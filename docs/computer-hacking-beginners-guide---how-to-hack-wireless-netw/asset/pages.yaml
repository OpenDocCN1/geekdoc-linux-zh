  md: '# Chapter 7. Wireless Hacking


    The proliferation of readily available Wi-Fi networks has made Wi-Fi one of the
    most common network mediums. Wi-Fi is in many ways superior to traditional copper
    wire physically connected networks. Aside from the convenience of connectivity
    and the flexibility of network configurations that wireless networks afford the
    users, the lack of physical infrastructure needed to complete the network makes
    it much cheaper and easier to implement than Ethernet. With this convenience,
    however, certain security concerns that are not associated with traditional hardwired
    networks. With a copper or fiber-based network, a physical connection is needed
    for a new machine to join the network. A hacker would normally have difficulty
    accessing the physical space of a target network and would likely arouse suspicion
    attempting to connect their own hardware to network cabling. Although the range
    of Wi-Fi is limited, it is omnidirectional and the radiofrequency signals admitted
    by the server and the various nodes on a wireless network traverse walls and other
    barriers and can be intercepted by any range. This gives the hacker much more
    freedom to conduct a network intrusion without being detected.


    # Hacking Wi-Fi


    Most Wi-Fi networks consist of a wireless router, or a group of wireless routers,
    that are connected to a modem which is delivering internet access to some physical
    location. The routers broadcast and receive radio signals on specific channels
    that carry the appropriate TCP/IP packets to and from other machines and devices
    that have similar wireless connectivity. All nodes communicating at any time on
    the channels associated with the router or routers that are connected to the modem
    at that location comprise a Wi-Fi network. By nature, Wi-Fi networks are very
    dynamic and fluid. Especially in commercial settings, like coffee shops or office
    buildings that provide wireless access, the number and nature of the nodes on
    that particular'
  merge: -1
  pgno: 40
- img_proc: true
  md: 'network are in constant flux. In these public settings, it is easy for hacker
    to hide in plain sight and attempt to intrude into any of the nodes on the network.
    Once the hacker is successfully on the network itself, they can scan the network
    for all connected machines and probe for vulnerabilities. Many networks have both
    wireless and subnetworks that are interconnected. When a hacker gains access to
    a wireless network they can conceivably use to leverage access to all of the nodes
    on the wired portion of the network. This makes Wi-Fi hacking a very popular goal
    for modern hackers.


    # Wi-Fi Encryption Protocols


    Since Wi-Fi signals are broadcast into the air as opposed to be confined within
    wires, it is important for the information contained in the signals to be encrypted.
    Otherwise, anyone could passively receive and view any information being sent
    between the nodes on the network. The encryption protocols used in Wi Fi have
    necessarily evolved since wireless networks began gaining popularity. Moreover,
    as technology has improved and resulted in increased bandwidth and data rates,
    a great density of information can be broadcast from a wireless network in a very
    short period of time, making it especially important for it to be encrypted and
    kept out of the hands of malicious hackers.


    The oldest and most common Wi-Fi encryption protocol is Wired Equivalent Privacy
    (WEP). The goal of the WEP standard, as the name implies, is to give users the
    same amount of security that they would have on a physically connected network.
    Unfortunately, over time WEP has become the least secure of all of the existing
    encryption protocols and it is so insecure in fact, that many Wi-Fi router manufacturers
    no longer provide that type of encryption as an option on their hardware. Most
    security professionals recommend that router does not use WEP when other options
    are available. Step-by-step instructions and coding examples for attacking Wi-Fi
    networks are freely and readily available on the internet. Although the level
    of encryption has increased from 64 bit to 128 bit to 256 bit, the underlying
    flaws in WEP remain easily exploitable by even the most green of neophyte hackers.
    The biggest problem with WEP is that a password can be quickly and easily deciphered
    simply through the passive (“sniffing”) (receiving and viewing network packets)
    of network'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'traffic.


    A significant step up from WEP Wi-Fi encryption is the Wi-Fi Protected Access
    (WPA) standard of encryption. This new protocol fixed many of the problems in
    WEP, but remained vulnerable to attack because it was still based on some of the
    underlying encryption algorithms. Furthermore, WPA-protected routers were deployed
    with a feature that was designed to make it more convenient for home users to
    connect new devices to their network. This feature proved to be an additional
    vulnerability in systems that employed WPA.


    It wasn''t long before an update to WPA was needed to keep Wi-Fi networks more
    secure. A new encryption standard being used in other secure applications, the
    Advanced Encryption Standard (AES), became mandatory in the new Wi-Fi encryption
    protocol which became known as WPA-2. WPA-2 with AES encryption has become the
    recommended setting for wireless routers on which it is available because of its
    significant improvement in security over its preceding standards. Cracking WPA
    and WPA-2 requires more intrusive hacking techniques than the simple passive sniffing
    that can be used to attack WEP-protected networks.


    # Wi-Fi Attacks


    In order to conduct a Wi-Fi attack a hacker needs, at a minimum, a computer (normally
    a laptop) that can run scripts which are used to decipher the Wi-Fi password.
    They must also acquire a special Wi-Fi adapter that can be purchased relatively
    cheaply. A list of suitable Wi-Fi adapters can be found on hacker resource websites,
    but in general the adapter must have a feature known as “monitor mode” in order
    to be able to execute a Wi-Fi attack. It is important to note that not all Wi-Fi
    adapters that can be found at retail supply stores have this feature, and most
    internal adapters are not appropriate. In general, hackers prefer to use some
    of Linux distribution, usually Kali, to conduct a Wi-Fi attack most of the readily
    available tools were written for the Linux OS and come preinstalled on Kali. It
    is also possible with some configuration to run Linux on a virtual machine within
    another OS to mount a successful attack. Although attacks from other operating
    systems are possible, it is much easier for the beginner to conduct them from
    either a native Linux distribution or a'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'virtual machine. A hacker-friendly distribution like Kali is recommended.


    The detailed procedures and recommended programs for conducting Wi-Fi attacks
    against the various encryption protocols changes over time, although the general
    principles are the same. For the simplest attack, which is against WEP encryption,
    the general steps are as follows:


    +   1. monitor and view all Wi-Fi traffic in the range of the adapter while "monitor
    mode" (set by a program called airmon-ng) using a program called airodump-ng),


