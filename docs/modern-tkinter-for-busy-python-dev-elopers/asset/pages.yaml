  md: '# 7.4. Handling Resize


    If you''ve tried to resize the example, you''ll notice that nothing moves at all,
    as, as shown below.


    | Grid Example |

    |---||

    | | Name |

    | | |

    | ☑ One Two Three Okay Cancel |


    Resizing the window.


    Even if you took a peek below and added the extra sticky options to our example,
    you''d still see the same thing. It looks like sticky may tell Tk how to react
    if the cell''s row or column does resize, but doesn''t actually say that the row
    or columns should resize if extra room becomes available. Let''s fix that.


    Every column and row in the grid has a weight option associated with it. This
    grid how much the column or row would grow if there is extra room in the master
    to fill. By default, the weight of each column or row is 0, meaning it won''t
    expand to fill any extra space.


    For the user interface to resize, then we''ll need to specify a positive weight
    to the columns we''d like to expand. This is done using the columnconfigure and
    rowconfigure methods of grid. This weight is relative. If two columns have the
    same weight, they''ll expand at the same rate. In our example, we''ll give the
    three leftmost columns (holding the checkboxes) a weight of 3, and the two rightmost
    columns a weight of 1. For every one pixel the columns grow, the left columns
    will grow by three pixels. So as the window grows larger, most of the extra space
    will go to the left side.'
  merge: -1
