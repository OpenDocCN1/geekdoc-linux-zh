- img_proc: true
  md: 'The forget method of grid removes slaves from the grid they''re currently part
    of. It takes a list of one or more slave widgets as arguments. This does not destroy
    the widget altogether but takes it off the screen as if it had not been gridded
    in the first place. You can grid it again later, though any grid options you''d
    originally assigned will have been lost.


    The remove method of grid works the same, except that the grid options will be
    remembered if you grid it again later.'
