  md: "# 14.2 Event Bindings\n\nWe've already seen that the canvas widget as a whole,\
    \ like any other Tk widget, can capture events using the bind command.\n\nYou\
    \ can attach bindings to individual items in the canvas (or groups of them, as\
    \ we'll see in the next section using tags). So if you want to know whether or\
    \ not a particular item has been clicked on, you don't need to watch for mouse\
    \ click events for the canvas as a whole, and then figure out if that click happened\
    \ on your item. Tk will take care of all for you.\n\nTo capture these events,\
    \ you use a bind command built into the canvas. It works exactly like the regular\
