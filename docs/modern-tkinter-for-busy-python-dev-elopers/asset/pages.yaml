  md: '# ## 6.5 Radiobutton


    ttk.Radiobutton


    https://tkdocs.com/man/ttk_radiobutton


    A radiobutton widget lets you choose between one of several mutually exclusive
    choices. Unlike a checkbutton, they are not limited to just two options. Radiobuttons
    are always used together in a set, where multiple radiobutton widgets are tied
    to a single choice or preference. They are appropriate to use when the number
    of options is relatively small, e.g., 3-5.


    ![](img/e444c319ec16222f00278651bee8c21d_80_0.png)


    Radiobuttons are created using the ttk.Radiobutton class. Typically, you''ll create
    and initialize several of them at:


    ```

    phone = StringVar()

    home = ttk.Radiobutton(parent, text=''Home'', variable=phone,

    value=''home'')

    office = ttk.Radiobutton(parent, text=''Office'',

    =phone, value=''office'')

    cell = ttk.Radiobutton(parent, text=''Mobile'', variable=phone,

    value=''cell'')

    ```


    Radiobuttons share most the same configuration options as checkboxes. One exception
    is that the onvalue and offvalue options are replaced with a single value option.
    Each radiobutton in the set will have the same linked variable, but a different
    value.'
