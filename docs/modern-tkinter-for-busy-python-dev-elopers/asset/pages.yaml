    https://tkdocs.com/man/ttk_progressbar

    ```


    A progressbar widget provides feedback to users about the progress of a lengthy
    operation.

    In situations where you can estimate how long the operation will take to complete,
    you can display what fraction has already been completed. Otherwise, you can indicate
    the operation is continuing, but without suggesting how much longer it will take.


    ![](img/e444c319ec16222f00278651bee8c21d_128_0.png)


    Progressbar widgets are created using the ttk.Progressbar class:


    ```

    p = ttk.Progressbar(parent, orient=HORIZONTAL, length=200, mode=''determinate'')

    ```


    As with scale widgets, they should be given an orientation horizontal or vertical
    with the orient configuration option, and can be given an optional length. The
    mode configuration option can be set to either determinate, where the progressbar
    will indicate relative progress towards completion, or to indeterminate, where
    it'
  merge: -1
