  md: '# 15.3. Formatting with Tags


    So far, we''ve used text widgets when all the text is in a single font. Now it''s
    time to look at how to add special formatting, such as bold, italic, strikethrough,
    background colors, font sizes, and much more. Tk''s text widget implements these
    using a feature called tags.


    Tags are objects associated with the text widget. Each tag is referred to via
    a name chosen by the programmer. Each tag has several configuration options. These
    are things like fonts and colors that control formatting. Though tags are objects
    having state, they don''t need to be explicitly created. They are automatically
    created the first time the tag is used.


    # Adding Tags to Text


    Tags can be associated with one or more ranges of text in the widget. As before,
    ranges are specified via indices. A single index represents a single character,
    and a pair of indices represent a range from the start character to just before
    the end character. Tags are added to a range of text using `tag_add` method.


    ```

    text.tag.add(''highlight'', ''5.0'', ''6.0'')

    ```


    Tags can also be provided when first inserting the text. The `insert` method supports
    an optional parameter containing a list of one or more tags to add to the text
    being inserted.


    ```

    text.insert(''end'', ''new material to insert'', (''highlight'', ''recent'', ''warning''))

    ```


    As the text in the widget is modified, whether by a user or your program, the
    tags will adjust automatically. For example, if we tagged the text "the quick
    brown fox" with the tag "nounphrase", and then replaced the word "quick" with
    "speedy", the tag still applies to the entire phrase.'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# Applying Formatting to Tags


    Formatting is applied to tags via configuration options; these work similarly
    to configuration options for the entire widget. As an example:


    ```

    text.tag_configure(''highlightline'', background=''yellow'',

    font=''TkFixedFont'', relief=''raised'')

    ```


    Tags support the following configuration options: background, bgstipple, font,
    foreground, justify, lmargin1, borderwidth, elide, fgstipple, lmargin2, offset,
    overstrike, relief, rmargin, spacing1, spacing2, spacing3, tabs, tabstyle, underline,
    and wrap. Check the reference manual for detailed descriptions of these. The tag_cget
    tag option method allows us to query the configuration options of a tag.


    Because multiple tags can apply to the same range of text, there is the possibility
    of conflict (e.g., two tags specifying different fonts). A priority order is used
    to resolve these; the most recently created tags have the highest priority, but
    priorities can be rearranged using the tag_raise tag and tag_lower tag methods.


    # More Tag Manipulations


    To delete one or more tags altogether, we can use the tag_delete tags method.
    This, of course, removes any references to the tag in the text. We can also remove
    a tag from a range of text using the tag_remove tag start?end? Even if it leaves
    no ranges of text with that tag, the tag object still exists.


    The tag_ranges tag method returns a list of ranges in the text that the tag has
    been applied to. There are also tag_nextrange tag start?end? and tag_prevrange
    tag start?end? methods to search forward or backward for the first such range
    from a given position.


    The tag_names ?id? method, called with no additional parameters, returns a list
    of all tags currently defined in the text widget (including those that may not
    be presently used). If we pass the method an index, it will return the list of
    tags applied to just the character at the index.


    Finally, we can use the first and last characters in the text having as indices,
    the same way we can use "end" or "2.5". To do so, just specify tagname.first or
    tagname.last.'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# Differences between Tags in Canvas and Text Widgets


    Both canvas and text widgets support "tags" that can be applied to several objects,
    style them, etc. However, canvas and text tags are not the same. There are important
    differences to take note of.


    In canvas widgets, only individual canvas items have configuration options that
    control their appearance. When we refer to a tag in a canvas, the meaning of that
    is identical to "all canvas items presently having that tag." The tag itself doesn''t
    exist as a separate object. So in the following snippet, the last rectangle will
    not be colored red.


    ```

    canvas.itemconfigure(''important'', fill=''red'')

    canvas.create_rectangle(10, 10, 40, 40, tags=(''important''))

    ```


    In contrast, with text widgets, it''s not the individual characters that retain
    the state information about appearance, but tags, which are objects in their own
    right. So in this snippet, the newly added text will be colored red.


    ```

    text.insert(''end'', ''first text'', (''important'')

    text.tag_configure(''important'', foreground=''red'')

    text.insert(''end'', ''second text'', (''important''))

    ```'
  merge: -1
  pgno: 227
- img_proc: true
  md: '# # 15.4. Events and Bindings


    One very cool thing we can do define event bindings on tags. That allows us to
    do things like easily recognize mouse clicks on particular ranges of text, and
    popup up a menu or dialog in response. Different tags can have different bindings.
    This saves the hassle of sorting out questions like "what does a click at this
    location mean?". Bindings on tags are implemented using the tag_bind method:


    ```

    text.tag_bind(''important'', ''<1>'', popupImportantMenu)

    ```


    Widget-wide event bindings continue to work as they do for every other widget,
    e.g., to capture a mouse click anywhere in the text. Besides the normal low-level
    events, the text widget generates a <<Modified>> virtual event whenever a change
    is made to the content of the widget, and a <<Selection>> virtual event whenever
    there is a change made to which text is selected.'
  merge: -1
  pgno: 228
- img_proc: true
  md: '# 15.5. Selecting Text


    We can identify the range of text selected by a user, if any. For example, an
    editor may have a toolbar button to bold the selected text. While you can tell
    when the selection has changed (e.g., whether or not the bold button is active)
    via the <<Selection>> virtual event, that doesn''t tell you what has been selected.


    The text widget automatically maintains a tag name `sel`, which refers to the
    selected text. Whenever the selection changes, the `sel` tag will be updated.
    So we can find the range of text selected using the `tag_ranges` method, passing
    `sel` as the tag to report on.


    Similarly, we can change the selection by using `tag_add` to set a new selection,
    `tag_remove` to remove the selection. The `sel` tag cannot be deleted, however.


    > Though the default widget bindings prevent this from happening, `sel` is like
    any other tag in that it can support multiple ranges, i.e., disjoint selections.
    To prevent this from happening, changing the selection from your code, make sure
    to remove any old selection before adding a new one.


    The text widget manages the concept of the insertion cursor (where newly typed
    text will appear) separate from the selection. It does so using a new concept
    called *mark*.'
  merge: -1
  pgno: 229
- img_proc: true
  md: '# 15.6. Marks


    Marks indicate a particular place in the text. In that respect, they are like
    indices. However, as the text is modified, the mark will adjust to be in the same
    relative location. In that way, they resemble tags, but refer to a single position
    rather than a range of text. Marks actually don''t refer to a position occupied
    by a character in the text but specify a position **between two** characters.


    Tk automatically maintains two different marks. The first, named `insert`, is
    the present location of the insertion cursor. As the cursor is moved (via mouse
    or keyboard), the second mark, named `current`, tracks the position of the character
    underneath the current mouse position.


    To create your own marks, use the widget''s `mark_set name idx` method, passing
    the name of the mark and the given index (the mark is positioned before the character
    at the given index). This is also used to move an existing mark to a different
    position. Marks can be removed using the `mark_unset name` method, passing the
    name of the mark. If you delete a range of text containing a mark, that also removes
    the mark.


    The name of a mark can also be used as an index (in the same way `1.0` or `end-lc`
    are indices). You can find the next mark (or previous one) from a given index
    in the text using the `mark_next idx` of `mark_previous idx` methods. The `mark_names`
    method will return a list of the names of all marks.


    Marks also have a gravity, which can be modified with the `mark_gravity name ?direction`
    method, which affects what happens when text is inserted at the mark. Suppose
    we have the text "ac" with a mark in between that we''ll symbolize with a pipe,
    i.e., "a|c". If the gravity of that mark is right (the default), the mark attaches
    itself to the "c". If the new text "b" is inserted at the mark, the mark will
    remain stuck to the "c," and so the new text will be inserted before the mark,
    i.e., "abc|c." If the gravity is instead left, the mark attaches itself to the
    "a," and so new text will be inserted after the mark, i.e., "a|bc."'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# 15.7. Images and Widgets


    Like canvas widgets, text widgets can contain not only text but also images and
    any other Tk widgets (including a frame, itself containing many other widgets).
    In a sense, this allows the text widget to work as a geometry manager in its own
    right. The ability to add images and widgets within the text opens up a world
    of possibilities for your program.


    Images are added to a text widget at a particular index, with the image specified
    as an existing Tk image. Other options that allow you to fine-tune padding, etc.


    ```

    flowers = PhotoImage(file=''flowers.gif'')

    text.image_create(''sel.first'', image=flowers)

    ```


    Other widgets are added to a text widget in much the same way as images. The widget
    being added must be a descendant of the text widget in the widget hierarchy.


    ```

    b = ttk.Button(text, text=''Push Me'')

    text.window_create(''1.0'', window=b)

    ```'
  merge: -1
  pgno: 231
- img_proc: true
  md: '# 15.8. Even More


    Text widgets can do many more things. Here, we''ll briefly mention just a few
    of them. For details on any of these, see the reference manual.


    # Search


    The text widget includes a powerful search method that allows you to locate a
    piece of text within the widget. This is useful for a "Find" dialog, as one obvious
    example. You can search backward or forward from a particular position or within
    a given range, specify the search term using exact text, case insensitive, or
    via regular expressions, one one or all occurrences of the search term, etc.


    # Modifications, Undo and Redo


    The text widget keeps track of whether changes have been made to the text (useful
    to know whether it needs to be saved to a file, for example). We can query (or
    change) using the edit_modified? method. There is also a complete multi-level
    undo/redo mechanism, managed automatically by the widget when we set its undo
    configuration option to true. Calling edit_undo or edit_redo modifies the current
    text using information stored on the undo/redo stack.


    # Eliding Text


    Text widgets can include text that is not displayed. This is known as "elided"
    text, and is made available using the elide configuration option for tags. It
    can be used to implement an outliner, a "folding" code editor, or even to bury
    extra meta-data intermixed with displayed text. When specifying positions within
    elided text, you have to be a bit more careful. Methods that work with positions
    have extra options to either include or ignore the elided text.


    # Introspection'
  merge: -1
  pgno: 232
- img_proc: true
  md: 'Like Tk widgets, the text widget goes out of its way to expose information
    about its internal state. We''ve seen this in terms of the get method, widget
    configuration options, names and cget for both tags and marks, etc. There is even
    more information available that can be useful for a wide variety of tasks. Check
    out the debug, dlineinfo, bbox, count, and dump methods in the reference manual.


    # Peering


    The Tk text widget allows the same underlying text data structure (containing
    all the text, marks, tags, images, etc.) to be shared between two or more different
    text widgets. This is known as peering and is controlled via the peer method.'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# 16. Treeview


    +   - ttk.Treeview

    - https://tkdocs.com/man/ttk_treeview


    A treeview widget displays a hierarchy of items and allows users to browse through
    it. One or more attributes of each item can be displayed as columns to the right
    of the tree. It can be used to build user interfaces similar to the tree display
    you''d find in file managers like the macOS Finder or Windows Explorer. As with
    most Tk widgets, it offers incredible flexibility so it can be customized to suit
    a wide range of situations.


    | macOS | Size | Modified | Windows | Size | Modified | Linux | Size | Modified
    |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | gallery | 25KB | Yesterday | 25KB | Yesterday | 25KB | Yesterday |

    | resources | 2KB | Two weeks ago | 2KB | Two weeks ago | 2KB | Two weeks ago
    |

    | tutorial | 220KB | Ten minutes ago | 2.1MB | Ten minutes ago | 2.1MB | Ten minutes
    ago |

    | canvas | 18KB | Last week | 18KB | Last week | 18KB | Last week |

    | tree | 5KB | Ten minutes ago | 5KB | Ten minutes ago | 5KB | Ten minutes ago
    |

    | text | 12KB | Yesterday | 12KB | Yesterday | 12KB | Yesterday |


    Treeview widgets are created using the ttk.Treeview class:'
  merge: -1
  pgno: 234
- img_proc: true
  md: '```

    tree = ttk.Treeview(parent)

    ```


    Horizontal and vertical scrollbars can be added in the usual manner if desired.'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# 16.1. Adding Items to the Tree


    To do anything useful with the treeview, we''ll need to add one or more items
    to it. Each item represents a single node in the tree, whether a leaf node or
    an internal node containing other nodes. Items are referred to by a unique id.
    You can assign this id when the item is first created, or the widget can automatically
    generate one.


    Items are created by inserting them into the tree, using the treeview''s `insert`
    method. To insert an item, we need to know where to insert it, specifying the
    parent item and where within the list of the parent''s existing children the new
    item should be inserted.


    The treeview widget automatically creates a root node (which is not displayed).
    Its id is the empty string. It serves as the parent of the first level of items
    that are added. Positions within the list of a node''s children are specified
    by index (0 being the first, and `end` meaning insert after all inserting children).


    Normally, you''ll also specify the *name* of each item, which is the text displayed
    in the tree. Other options allow you to add an image beside the name, specify
    whether the node is open or closed, etc.


    ```

    # Inserted at the root, program chooses id:

    tree.insert('''', ''end'', ''widgets'', text=''Widget Tour'')


    # Same thing, but inserted as first child:

    tree.insert('''', 0, ''gallery'', text=''Applications'')


    # Treeview chooses the id:

    id = tree.insert('''', ''end'', text=''Tutorial'')


    # Inserted underneath an existing node:

    tree.insert(''widgets'', ''end'', text=''Canvas'')

    tree.insert(id, ''end'', text=''Tree'')

    ```


    Inserting the item returns the id of the newly created item.'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# 16.2. Rearranging Items


    A node (and its descendants, if any) can be moved to a different location in the
    tree. The only restriction is that a node cannot be moved underneath one of its
    descendants, for obvious reasons. As before, the target location is specified
    via an existing parent node, and a position within its list of children.


    ```

    tree.move(''widgets'', ''gallery'', ''end'') # move widgets under

    gallery

    ```


    Items can be detached from the tree, which removes the item and its descendants
    from the hierarchy, but does not destroy the items. This allows us to later reinsert
    them with `move`.


    ```

    tree.detach(''widgets'')

    ```


    Items can also be deleted, which does completely destroy the item and its descendants.


    ```

    tree.delete(''widgets'')

    ```


    To traverse the hierarchy, there are methods to find the parent of an item `parent
    item`, its next or previous sibling (`next item` and `prev item`), and return
    the list of children of an item (`children item`).

    We can control whether or not the item is open and shows its children by modifying
    the `open` item configuration option.


    ```

    tree.item(''widgets'', open=TRUE)

    isopen = tree.item(''widgets'', ''open'')

    ```'
  merge: -1
  pgno: 237
- img_proc: true
  md: '# 16.3. Displaying Information for each Item


    The treeview can display one or more additional pieces of information about each
    item. These are shown as columns to the right of the main tree display.


    Each column is referenced by a symbolic name that we assign. We can specify the
    list of columns using the columns configuration of the treeview widget, either
    when first creating the widget, or later on.


    ```

    tree = ttk.TreeView(root, columns=(''size'', ''modified''))

    tree[''columns''] = (''size'', ''modified'', ''owner'')

    ```


    We can specify the width of the column, how the display of item information is
    aligned, and more. We can also provide information about the heading of the column,
    such as the text to display, an optional image, alignment, and a script to invoke
    when the item is clicked (e.g. to sort the tree).


    ```

    tree.column(''size'', width=100, anchor=''center'')

    tree.heading(''size'', text=''Size'')

    ```


    What to display in each column for each item can be specified individually using
    the set method. We can also provide a list describing what to display in all the
    columns for the item. This is done using the values item configuration option.
    It can be used when first inserting the item or to update it. It takes a list
    of values. The order of the list must be the same as the order in the columns
    widget configuration option.


    ```

    tree.set(''widgets'', ''size'', ''12KB'')

    size = tree.set(''widgets'', ''size'')

    tree.insert('''', ''end'', text=''Listbox'', values=(''15KB'', ''Yesterday'',
    ''mark''))

    ```'
  merge: -1
  pgno: 238
- img_proc: true
  md: '# # 16.4. Item Appearance and Events


    Like the text and canvas widgets, the treeview widget uses tags to modify the
    appearance of items in the tree. We can assign a list of tags to each item using
    the tags item configuration option (again, when creating the item or later on).


    Configuration options can be specified on the tag, which will apply to all items
    having that tag. Valid tag options include foreground (text color), background,
    font, and image (not used if the item specifies its own image).


    We can also create event bindings on tags, which lets us capture mouse clicks,
    keyboard events etc.


    ```

    tree.insert('''', ''end'', text=''button'', tags=(''ttk'', ''simple''))

    tree.tag_configure(''ttk'', background=''yellow'')

    tree.tag_bind(''ttk'', ''<1>'', itemClicked)

    # the item clicked can be found via tree.focus()

    ```


    The treeview will generate virtual events <<TreeviewSelect>>, <<TreeviewOpen>>,
    and <<TreeviewClose>>, which allow us to monitor changes to the widget made by
    users. We can use the selection method to determine the current selection (the
    selection can also be changed from your program).'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# 16.5. Customizing the Display


    There are many aspects of how the treeview widget is displayed that we can customize.
    We''ve already seen some of them, such as the text of items, fonts and colors,
    names of column headings, and more. Here are a few additional ones:


    +   - Specify the desired number of rows to show using the height widget configuration
    option.

    - Control the width of each column using the column''s width minwidth options.
    The column holding the tree can be accessed with the symbolic name #0. The overall
    requested width for the widget is based on the sum of the column widths.

    - Choose which columns to display and the order to display them using the displaycolumns
    widget configuration option.

    - You can optionally hide one or both of the column headings of the tree itself
    (leaving just the columns) using the show widget configuration option (default
    is "tree headings" to show both).

    - You can specify whether a single item or multiple items can be selected by users
    via the selectmode widget configuration option, passing browse (single item),
    extended (multiple items, the default), or none.'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# 17. Styles and Themes


    The **themed** aspect of the modern Tk widgets is one of the most powerful and
    exciting aspects of the newer widget set. Yet, it''s also one of the most confusing.


    This chapter explains styles (which control how widgets like buttons look) and
    themes (which are a collection of styles that define how all the widgets in your
    application look). Changing themes can give your application an entirely different
    look.


    ![](img/e444c319ec16222f00278651bee8c21d_241_0.png)


    Note that it''s not just colors that have changed, but the actual shape of individual
    widgets. Styles and themes are **extremely** flexible.


    Why?'
  merge: -1
  pgno: 241
- img_proc: true
  md: 'However, before you get carried away, very few applications will benefit from
    switching themes like this. Some games or educational programs might be exceptions.
    Using the standard Tk theme for a given platform will display widgets the way
    that people expect to see them, particularly if they’re running macOS or Windows.


    On Linux systems, there’s less standardization of look and feel. Users expect
    (and are more comfortable with) some variability and "coolness." Because widget
    sets (typically GTK or QT) are used by window managers, control panels, and other
    system utilities, Tk can seamlessly blend with the current settings on any particular
    system. Most of Linux screenshots in this book use Tk''s alt theme. Despite being
    accustomed to variability, there are limits to what most users will accept. The
    styling of core widgets in Tk''s classic widget set, matching circa-1992 OSF/Motif,
    is a prime example.


    Styles and themes, used in a more targeted manner and with significant restraint,
    can have a role in modern applications. This chapter explains why and when you
    might want to use them and how to go about doing so. We’ll begin drawing a parallel
    between Tk’s styles and another realm of software development.


    # Understanding Styles and Themes


    If you’re familiar with web development, you know about cascading stylesheets
    (CSS). There are two ways it can be used to customize the appearance of an element
    in your HTML page. In the first way, you can add a bunch of style attributes (fonts,
    colors, borders, etc.) directly to an element in your HTML code via the example:


    ```

    <label style="color:red; font-size:14pt; font-weight:bold; background-color:yellow;">Meltdown
    imminent!</label>

    ```


    The other way to use CSS is to attach a class to each widget the class attribute.
    The details of how elements of that class appear elsewhere, often in a separate
    CSS file. You can attach the same class to many elements, and they will all have
    the same appearance. You don’t need to repeat the full details for every element.
    More importantly, you separate the logical content of your site (HTML) from its
    appearance (CSS).'
  merge: -1
  pgno: 242
- img_proc: true
  md: '```

    <label class="danger">Meltown imminent!</label>

    ....

    <style type="text/css">

    label.danger {color:red; font-size:14pt; font-weight:bold;

    background-color:yellow; }

    </style>

    ```


    Back to Tk.


    +   - In the classic Tk widgets, all appearance customizations require specifying
    each detail on individual widgets, akin to always using the style HTML attribute.

    - In the themed Tk style, all appearance customizations are made via attaching
    a style to a widget, akin to using the class HTML attribute. Separately, you define
    how widgets with that style will appear, akin to writing CSS.

    - Unlike HTML, you can''t freely mix and match. You can''t customize some themed
    entries or buttons with styles, and others by directly changing appearance options.


    > Yes, there are a few exceptions, like labels where you can customize the font
    and colors through both styles and configuration options.


    # Benefits


    Why use styles and themes in Tk? They take the fine-grained details of appearance
    decisions away from individual instances of widgets.

    That makes for cleaner code and less repetition. If you have 20 widgets in your
    application, you don''t need to repeat the same appearance details every time
    you create one (or write a wrapper function). You just assign them a style.


    Styles also put all appearance decisions in one place. And because styles for
    a button and styles for a widget can share common elements, it promotes consistency
    and improves reuse.


    > Styles also have many benefits for widget authors. Widgets can delegate most
    appearance decisions to styles. A widget author no longer has to hardcode logic
    to the effect of "when the state is disabled, consult the ''disabledforeground''
    configuration option and use that for the foreground color." Not only did that
    make coding widgets longer (and more repetitive), but it also restricted'
  merge: -1
  pgno: 243
- img_proc: true
  md: 'how a widget could be changed based on its state. If the widget author hadn''t
    coded in logic to change the font when the state changed, you as an application
    developer using the widget were out of luck.


    Using styles, widget authors don''t need to provide code for every possible appearance
    option. That not only simplifies the widget but paradoxically ensures that a wider
    range of appearances **can** be set, including those the widget author may not
    have anticipated.'
  merge: -1
  pgno: 244
- img_proc: true
  md: '# 17.1. Using Existing Themes


    Before delving into the weightier matters of tastefully and selectively modifying
    and applying styles to improve the usability of your application and cleanliness
    of your code, let''s deal with the fun bits: using existing themes to completely
    reskin your application.


    Themes are identified by a name. You can obtain the names of all available themes:


    ```

    >>> s = ttk.Style()

    >>> s.theme_names ()

    (''aqua'', ''step'', ''clam'', ''alt'', ''default'', ''classic'')

    ```


    > Tkinter encapsulates all style manipulations in the ttk.Style class. We''ll
    require then an instance of that class for this and other operations.


    | | default | clam | classic |

    |---|---|---|---|

    | Done | Done | Done | Done |

    | [ ] Radio [x] Special | [ ] Radio [x] Special | [ ] Radio [x] Special |

    | Sun | Sun | Sun |

    | 12345 | 12345 | 12345 | 12345 |

    | Name: | Name: | Name: | Name: |


    Built-in themes.


    Besides the built-in themes (alt, default, clam, and classic), macOS includes
    a theme named aqua to match the system-wide style, while Windows includes themes
    named vista, winxpnative, and wininnative.


    Only one theme can ever be active at a time. To obtain the name of the theme currently
    in use, use the following:


    ```

    >>> s.theme_use()

    ''aqua''

    ```'
  merge: -1
  pgno: 245
- img_proc: true
  md: 'This API, which was originally targeted for Tk 8.6, was back-ported to Tk 8.5.9.
    If you''re using an earlier version of Tk getting this info is a bit trickier.


    Switching to a new theme can be done with:


    ```

    s.theme_use(''thetheme'')

    ```


    What does this actually do? Obviously, it sets the current theme to the indicated
    theme. Doing this, therefore, replaces all the currently available styles with
    the set of styles defined by the theme. Finally, it refreshes all widgets, so
    that they take on the appearance described by the new theme.


    # Third-Party Themes


    With a bit of looking around, you can find some add-on themes available for download.
    A good starting point is https://wiki.tcl.org/page/List+of+tk+Themes.


    Though themes can be defined in any language that Tk supports, most that you will
    find written in Tcl. How can you install them so that they are available to use
    in your application?


    As an example, let''s use the "awkward" theme, available from https://sourceforge.net/projects/tcl-awhemes/.
    Download and unzip awhemes*.zip file somewhere. You''ll notice it contains a bunch
    of .tcl files, a subdirectory containing many directory images used by the theme,
    etc.


    One of the files is named pkgIndex.tcl. This identifies it as a Tcl package, which
    is similar to a Python module. If we look inside, you''ll see a bunch of lines
    like package needed awkward 7.7. Here, awkward is the name of the package, and
    7.7 is its version number. It''s not unusual, as in this case, for a single pkgIndex.tcl
    file to provide several packages.


    To use it, we need to tell Tcl where to find the package (adding its directory
    to Tcl''s auto_path) and the name of the package to use.


    ```

    root.tcl.call(''append'', ''auto_path'', ''/full/path/to/awhemes-9.3.1'')

    root.tcl.call(''package'', ''require'', ''awkward'')

    ```'
  merge: -1
  pgno: 246
- img_proc: true
  md: 'If the theme is instead implemented as a single Tcl source file, without a
    `pkgIndex.tcl`, you can make it available like this:


    ```

    root.tk.call(''source'', ''/full/path/to/themfile.tcl'')

    ```


    You should now be able to use the theme in your own application, just as you would
    any of the built-in themes.'
  merge: -1
  pgno: 247
- img_proc: true
  md: '# 17.2. Using Styles


    We''ll now tackle the more difficult issue of how to take full advantage of styles
    and themes within your application, not just reskinning it with an existing theme.


    # Definitions


    We first need to introduce a few essential concepts.


    # Widget Class


    A *widget class* identifies the type of a particular widget, whether it is a button,
    a label, a canvas, etc. All themed widgets have a default class. Buttons have
    the class `TButton`, labels `TLabel`, etc.


    # Widget State


    A *widget state* allows a single widget to have more than one appearance or behavior,
    depending on things like mouse position, different state options set by the application,
    and so on.


    As you''ll recall, all themed widgets maintain a set of binary state flags, accessed
    by the `state` and `instance` methods. The flags are: `active, disabled, focus,
    pressed, selected, background, readonly, alternate`, and `invalid`. All widgets
    have the same set of state flags, though they may ignore some of them (e.g., a
    label widget would likely ignore an `invalid` state flag). See the `themed widget`
    page in the reference manual for the exact meaning of each state flag.


    +   - https://tkdocs.com/man/ttk_widget


    # Style


    A *style* describes the appearance (or appearances) of a widget class. All themed
    widgets having the same widget class will have the same appearance(s).'
