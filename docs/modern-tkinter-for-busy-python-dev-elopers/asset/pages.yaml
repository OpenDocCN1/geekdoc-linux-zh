  md: "# ## 14.3. Tags\n\nWe've seen that every canvas item has a unique id number,\
    \ but there is another very useful and powerful way to refer to items on a canvas,\
    \ and that is using tags.\n\nA tag is just an identifier of your creation, something\
    \ meaningful to your program. You can attach tags to canvas items; each item can\
    \ have any number of tags. Unlike id numbers, which are unique for each item,\
    \ many items can have the same tag.\n\nWhat can you do with tags? We saw that\
    \ you can use the item id to modify a canvas (and we will see soon there are other\
    \ things you can do to items, move them around, delete them, etc.). Any time you\
    \ can use an item id, you can use a tag. For example, you can change the color\
    \ of all items having a specific tag.\n\nTags are a good way to identify certain\
    \ types of items in your canvas (items that are part of a drawn line, items that\
    \ are part of your palette, etc.). You can use tags to correlate canvas items\
    \ to particular objects in your application (for example, tag all canvas items\
    \ that are part of the robot with id #37 with the tag \"robot37\"). With tags,\
    \ you dont to keep track of the ids of canvas items to refer to groups of items\
    \ later; let Tk do that for you.\n\nYou can assign tags when creating an item\
    \ using the tags item option configuration. You can add tags later with the addtag\
    \ method, or remove them with the dtags method. You can get the list of tags for\
    \ an item with the gettags method, or return a list of item id numbers having\
    \ the given tag with the find command.\n\nFor example:\n\n```\n>>> c = Canvas(root)\n\
    >>> c.create_line(10, 10, 20, 20, tags=('firstline',\n     'drawing'))\n1\n>>>\
    \ c.create_rectangle(30, 30, 40, 40, tags=('drawing'))\n2\n>>> c.addtag('rectangle',\
    \ 'withtag', 2)\n>>> c.addtag('polygon', 'withtag', 'rectangle')\n>>> c.gettags(2)\n\
    ```"
