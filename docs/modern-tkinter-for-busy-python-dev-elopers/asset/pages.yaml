  md: "constructed from elements. Different styles and themes could (and do) accomplish\
    \ this in different ways.\n\nHere is a second example, for a vertical scrollbar.\
    \ It consists of a \"trough\" element, which contains other elements. These include\
    \ the up and down arrow elements at either end and a \"thumb\" element in the\
    \ middle (it might have other elements too, like borders).\n\n![](img/e444c319ec16222f00278651bee8c21d_254_0.png)\n\
    \nLayout\nBesides specifying which elements make up a widget, a style also defines\
    \ how those elements are arranged within the widget. This is called their layout.\
    \ In the button example, we had a label element inside a spacing element, inside\
    \ a focus ring element, inside a border element. Its logical layout is:\n\n```\n\
    border {\n  focus {\n    spacing {\n      label\n    }\n  }\n}\n```"
