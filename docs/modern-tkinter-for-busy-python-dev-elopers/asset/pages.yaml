  md: '# Checkbutton and Radiobutton Items


    Finally, there are also checkbutton and radiobutton menu items that behave analogously
    to checkbutton and radiobutton widgets. These menu items have a variable associated
    with them. Depending on its type, a indicator (i.e., checkmark or selected radiobutton)
    may be shown to its label.


    ```

    check = StringVar()

    menu_file.add_checkbutton(label=''Check'', variable=check, onvalue=1, offvalue=0)

    radio = StringVar()

    menu_file.add_radiobutton(label=''One'', variable=radio, value=1)

    menu_file.add_radiobutton(label=''Two'', variable=radio, value=2)

    ```


    When a user selects a checkitem that is not already checked, it sets the associated
    variable to the value in onvalue. Selecting an item that is already checked sets
    it to the value in offvalue. Selecting a radioitem sets the associated variable
