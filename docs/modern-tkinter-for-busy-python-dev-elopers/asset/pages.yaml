    # Selecting Items


    You can choose whether users can select only a single item at a time from the
    listbox, or multiple items can simultaneously be selected. This is controlled
    by the selectmode option: the default is only being able to select a single item
    (browse), while a selectmode of extended allows users to select multiple items.


    The names browse and extended, again for backward compatibility reasons, are truly
    awful. This is made worse by the fact that there are two other modes, single and
    multiple, which you should not use (they use an old interaction style that is
    inconsistent with modern user interface and platform conventions).


    To find out which item or items in the listbox are currently selected, use the
    selection method. It returns a list of indices of all items currently selected;
    this may be an empty list. For lists with selectmode of browse, it will never
    be longer than one item. You can also use the selection_includes index method
    to check if the item with the given index is currently selected.


    ```

    if lbox.selection_includes(2): ...

    ```


    To programmatically change the selection, you can use the selection_clear first
    ?last? method to deselect every single item or within the range of indices specified.
    To select an item or all items in a range, use the selection_set ?last? method.
    Both of these will not touch the selection of any items outside the range specified.'
