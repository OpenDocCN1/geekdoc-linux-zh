  md: '# 6.4. Checkbutton


    ttk.Checkbutton


    https://tkdocs.com/man/ttk_check_button


    A checkbutton is like a regular button that also holds a binary value of some
    kind (i.e., a toggle). When pressed, a checkbutton flips the toggle and then invokes
    its callback. Checkbutton widgets are frequently used to allow users to turn an
    option on or off.


    | macOS | Windows | Linux |

    | --- | --- | --- |

    | ☐ Frognicate | ☐ Frognicate | ☐ Frognicate |

    | ☑ xtkify | ☑ xtkify | ☑ xtkify |

    | ☐ Decisive. | ☐ Decisive. | ☐ Decisive. |

    | ☑ WSC 1.1 | ☑ WSC 1.1 | ☑ WSC 1.1 |


    Checkbutton widgets.


    Checkbuttons are created using the ttk.Checkbutton class. Typically, their contents
    and behavior are specified at the same time:


    ```

    measureSystem = StringVar()

    check = ttk.Checkbutton(parent, text=''Use Metric'',

    command=metricChanged, variable=measureSystem,

    value=''metric'', offvalue=''imperial'')

    ```


    Checkbuttons use many of the same options as regular buttons but add a few more.
    The text, textvariable, image, and compound configuration options control the
    display of the label (next to the checkbox itself). Similarly, the command option
    lets you to specify a command to be called every time a user toggles the checkbox;
    and the invoke method will also execute the same command. The'
