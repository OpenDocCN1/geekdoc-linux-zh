  md: "# ## 5.3. Event Handling\n\nTk, as with most other user interface toolkits,\
    \ runs an event loop that receives events from the operating system. These are\
    \ things button presses, keystrokes, mouse movement, window resizing, and so on.\n\
    \nGenerally, Tk takes care of managing this event loop for you. (did a user click\
    \ on this button? if a key was pressed, textbox know the focus?), and dispatch\
    \ it accordingly. Individual widgets know how to respond to events; for example,\
    \ a button might change color when the mouse moves over it, and revert back when\
    \ the mouse leaves.\n\n> It's critical in event-driven applications that the event\
    \ loop not be blocked. The event loop should run continuously, normally executing\
    \ dozens of steps per second. At every step, it processes an event. If your program\
    \ is performing a long operation, it can potentially block the event loop. In\
    \ that case, no events would be processed, no drawing would be done, and it would\
    \ appear as if your application is frozen. There are many ways to avoid this happening,\
    \ mostly related to the structure of your application. We'll discuss this in more\
    \ detail in a later chapter.\n\n# ## Event Callbacks\n\nYou often want your program\
    \ to handle some event in a particular way, e.g., do something when a button is\
    \ pushed. For those that are most frequently customized (what good is a button\
    \ without something happening when you press it?), the widget will allow you to\
    \ specify a callback as a widget configuration option. We saw this in the example\
    \ with the command option of the button.\n\n```\ndef calculate(*args):\n    ...\n\
    ntk.Button(mainframe, text=\"Calculate\", command=calculate)\n```"
  merge: -1
  pgno: 58
- img_proc: true
  md: 'Callbacks in Tk tend to be simpler than in user interface toolkits used with
    compiled languages (where a callback must be a procedure with a certain set of
    parameters or an object method with a certain signature). Instead, the callback
    is just an ordinary bit of code that the interpreter evaluates. While it can be
    as complicated as you want to make it, most of the time, you''ll just want your
    callback to call some procedure.


    # Binding to Events


    For events that don''t have a widget-specific command callback associated with
    them, you can use Tk''s bind to capture any event, and then (like with callbacks)
    execute an arbitrary piece of code.


    Here''s a (silly) example showing a label responding to different events. When
    an event occurs, a description of the event is displayed in the label.


    ```

    from tkinter import *

    from tkinter import ttk

    root = Tk()

    1 = ttk.Label(root, text="Starting...")

    1.grid()

    1.bind(''<Enter>'', lambda e: 1.configure(text=''Moved mouse inside\''))

    1.bind(''<Leave>'', lambda e: 1.configure(text=''Moved mouse outside\''))

    1.bind(''<Button-1>'', lambda e: 1.configure(text=''Clicked left mouse button''))

    1.bind(''<3>'', lambda e: 1.configure(text=''Clicked right button\''))

    1.bind(''<Double-1>'', lambda e: 1.configure(text=''Double clicked\''))

    1.bind(''<B3-Motion>'', lambda e: 1.configure(text=''right button drag to=%d,%d''
    (e.x,e.y)))

    root.mainloop()

    ```


    ![](img/e444c319ec16222f00278651bee8c21d_59_0.png)


    The first two binds are pretty straightforward, just watching for simple events.
    An <Enter> event means the mouse has moved over top the widget, while the <Leave>
    event is generated when the mouse outside the widget to a different one.


    https://tkdocs.com/code/bindings.py'
  merge: -1
  pgno: 59
- img_proc: true
  md: 'The next binding looks for a mouse click, specifically a <ButtonPress-1> event.
    Here, the <ButtonPress> is the actual event, but the -1 is an event detail specifying
    the left (main) mouse button on the mouse. The binding will only trigger when
    a <ButtonPress> event is generated involving the mouse button. If another mouse
    button was clicked, this binding would ignore it.


    This binding looks for a <3> event. This is actually a shorthand for <ButtonPress-3>.
    It will respond to events generated when the right mouse button is clicked. The
    next binding, <Double-1> (shorthand for <Double-ButtonPress-1>) adds another modifier,
    Double, and so will respond to the left mouse button double clicked.


    The last binding also uses a modifier: capture mouse movement (Motion), but only
    when the right mouse button (B) is held down. This binding also shows an example
    of how to use event parameters. Many events, as mouse clicks or movement carry
    additional information like the current position of the mouse. Tk provides access
    to these parameters in Tcl callback scripts through the use of percent substitutions.
    These percent substitutions let you capture them as they be used in your script.


    Tkinter abstracts away percent substitutions and instead encapsulates all the
    event parameters in an event object. Above, we used the x and y fields to retrieve
    the mouse position. We''ll see percent substitutions used later in another context,
    entry widget validation.


    > What''s with the lambda expressions? Tkinter expects you to provide a function
    as the callback, whose first argument is an event object representing the event
    that triggered the callback. It''s sometimes not worth the bother of defining
    named functions for one-off trivial callbacks such as in this example. Instead,
    we''ve just used Python''s anonymous functions via lambda. In real applications,
    you''ll almost always use a regular function, such as the calculate function in
    our feet to meters example, or a method of an object.


    # Multiple Bindings for an Event'
  merge: -1
  pgno: 60
- img_proc: true
  md: 'We''ve just seen event bindings can be set up for an individual widget. When
    a matching event is received by that widget, the binding will trigger. But that''s
    not all you can do.


    Your binding can capture not just a single event, but a short sequence of events.
    The `<Double-1>` binding triggers when two mouse clicks occur in a short time.
    You can do the same to capture two keys pressed in a row, e.g., `<KeyPress-A><KeyPress-B>`
    or simply `<a>`.


    You can also set up an event binding on a toplevel window. When a matching event
    occurs anywhere in that window, the binding will be triggered. In our example,
    we set up a binding for the Return key on the main application toplevel window.
    If the Return key was pressed when any widget in the toplevel window had the focus,
    that binding would fire.


    Less commonly, you can create bindings that are triggered when a matching event
    occurs anywhere in the application, or even for events received by any widget
    of a given class, e.g., all buttons.


    ![](img/e444c319ec16222f00278651bee8c21d_61_0.png)


    > More than one event binding can fire for an event. This keeps event handlers
    concise and limited in scope, meaning more modular code. For example, the behavior
    of each widget class in Tk is itself defined with script-level event bindings.
    These stay separate from event bindings in your application. Event bindings can
    be changed or deleted. They can be modified to alter event handling for widgets
    of a certain class or parts of your application. You can reorder, extend, or change
    the sequence of event handlers that will be triggered for each event; see the
    `bindtags` command reference if you''re curious.


    ```

    https://tkdocs.com/man/bindtags

    ```


