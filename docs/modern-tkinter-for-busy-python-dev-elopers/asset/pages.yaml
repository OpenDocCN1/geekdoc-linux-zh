  md: '2.5 wordstart:

    First char. of the word with the char. at index 2.5.


    2.5 wordend:

    First char. after the word with the char. at index 2.5.


    Some additional things to keep in mind:


    +   - The term chars can be abbreviated as c, and lines as l.

    - Spaces between terms can be omitted, e.g., 1.0+3c.

    - An index past the end of the text (e.g., end + 100c) is interpreted as end.

    - Indices wrap to subsequent lines as needed; e.g., 1.0 + 10 chars on a line with
    only five characters will refer to a position on the second line.

    - Line numbers in indices are interpreted as logical lines, i.e., each line ends
    only at the "in". With long lines and wrapping enabled, one logical line may represent
    multiple display lines. If you''d like to move up or down a single line on the
    display, you can specify this as, e.g., "1.0 + 2 display lines".


    To determine the canonical position of an index, use the index method. Pass it
    any index expression, and it returns the corresponding index in the form line.char.
    For example, to find the position of the last character (ignoring the automatic
    newline at the end), use:


    ```

    text.index(''end'')

