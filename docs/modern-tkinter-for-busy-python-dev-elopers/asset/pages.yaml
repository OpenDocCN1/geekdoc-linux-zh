  md: '# 8.5. Spinbox


    ttk.Spinbox

    https://tkdocs.com/man/tk_spinbox


    A spinbox widget allows users to choose numbers (or, in fact, items from an arbitrary
    list). It does this by combining an entry-like widget showing the current value
    with a pair of small up/down arrows, which can be used to step through the range
    of possible choices.


    > The themed spinbox was added in Tk 8.5.9 (released in 2010). If you must run
    an older version, there is a spinbox in the classic Tk widgets, though with a
    slightly different API.


    | macOS | Linux |

    |---|--|

    | 5 | 5 |

    | Wednesday | Wednesday |

    | 25.5 | 25.5 |


    Spinbox widgets.


    Spinval widgets are created using the ttk.Spinbox class:


    ```

    spinval = StringVar()

    s = ttk.Spinbox(parent, from_=1.0, to=100,

    textvariable=spinval)

    ```


    Like scale widgets, spinboxes let user choose a number between a certain range
    (specified using the from_ and to configuration options), though through a very
    different user interface. You can also specify increment, which controls how much
    the value changes every time you click the up or down button.'
  merge: -1
  pgno: 125
- img_proc: true
  md: 'Like a listbox or combobox, spinboxes can also be used to let users choose
    an item from an arbitrary list of strings; these can be specified using the values
    configuration option. This works in the same way it does for combboxes; specifying
    a list of values will override it from and to settings.


    In their default state, spinboxes allow users to select values either via the
    up and down buttons, or by typing directly into the entry area that displays the
    current value. If you''d like to disable the feature, so that only the up and
    down buttons are available, you can set the readonly state flag.


    ```

    s.state([''readonly''])

    ```


    Other themed widgets, you can also disable spinboxes, via the disabled state flag,
    or check the state via the instate method. Spinboxes also support validation in
    the same manner as entry widgets, using the validate and validatecommand configuration
    options.


    ![](img/e444c319ec16222f00278651bee8c21d_126_0.png)


