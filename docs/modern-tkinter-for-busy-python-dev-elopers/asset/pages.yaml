- img_proc: true
  md: 'with some data item. This might bean internal object that is meaningful to
    your program, but not meant to be displayed to users. In other words, what you''re
    really interested in is not so much the string displayed in the listbox, but the
    associated data item. For example, a listbox may display a list of names to users,
    but your program is really interested in the underlying user object (or id number)
    for each one, not the particular name.


    How can we associate this underlying value with the name that is displayed? Unfortunately,
    the listbox widget doesn''t offer any facilities, so it''s something we''ll have
    to manage separately. There are a couple of obvious approaches. First, if the
    displayed strings are guaranteed unique, you could use a hash table to map each
    name to its associated underlying object. This wouldn''t work well for peoples''
    names, where duplicates are possible, but could work for countries, which are
    unique.


