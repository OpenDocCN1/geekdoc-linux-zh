    # Text


    Text items can display a block of text. Positioning the text works the same as
    with image items. Specify the text to display using the text attribute. All of
    the text in the item will have the same color (specified by the fill attribute)
    and the same font (specified by a font attribute).


    The item can display multiple lines of text if you embed \n in the text. Alternatively,
    you can have the item automatically wrapped into multiple lines by providing a
    width attribute to represent the maximum width of a line. The alignment of multiple
    lines of text can be set using the justify attribute, which can be one of left
    (default), right, or center.


    ```

    canvas.create_oval(100, 100, text=''A wonderful story'', anchor=''nw'', font=''TkMenuFont,
    fill=''red'')

    ```


