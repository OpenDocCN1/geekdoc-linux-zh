  md: '# 4.3. Step-by-Step Walkthrough


    Let''s take a closer look at that code, piece by piece. For now, all we''re trying
    to do is get a basic understanding of the types of things we need to do to create
    a user interface in Tk, and roughly what those things look like. We''ll go into
    details later.


    # Incorporating Tk


    Our program starts by incorporating Tk.


    ```

    from tkinter import *

    from tkinter import ttk

    ```


    These two lines tell Python that our program needs two modules. The first, tkinter,
    is the standard binding to Tk. When imported, it loads the Tk library on your
    system. The second, ttk, is a submodule of tkinter. It implements Python''s binding
    to the newer "themed widgets" that were added to Tk in 8.5.


    > Notice that we''ve imported (·) from the tkinter module. That way, we can call
    tkinter functions etc. without prefixing them with the module name. This is standard
    Tk practice.


    However, because we''ve imported ttk itself, we''ll need to prefix anything inside
    that module. For example, calling Entry(...) would refer to the Entry class inside
    the tkinter module (classic widgets). We''d need ttk.Entry(...) to use the Entry
    class inside ttk (themed widgets).


    As you''ll see, several classes are defined in both modules. Sometimes you will
    need one or the other, depending on the context. Explicitly using the ttk prefix
    facilitates this, and will be the style used in this book.


    > One of the first things you''ll find if you''re migrating Python 2.x code is
    that the name of the Tk module is now lowercase, i.e. tkinter rather than Tkinter.
    In Python 2.x, Ttk was also its own module, not a sub-module of Tk.'
