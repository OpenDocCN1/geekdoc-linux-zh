  md: '# 12.2. Label Frames


    `ttk.Labelframe`

    https://tkdocs.com/man/ttk_labelframe


    A **labelframe** widget, also commonly known as a **group box**, provides another
    way to group related components. It acts like a normal `ttk::frame`, in that it
    contains other widgets that you `grid` inside it. However, it is visually set
    off the rest of the user interface. You can optionally provide a text label to
    be displayed outside the labelframe.


    ![](img/e444c319ec16222f00278651bee8c21d_184_0.png)


    Labelframes are created using the `ttk.Labelframe` class:


    ```

    lf = ttk.Labelframe(parent, text=''Label'')

