  md: '# ## 11.1. Creating and Destroying Windows


    We''ve seen that all Tk programs start out with a root tolevel window, and then
    widgets are created as children of that root window. Creating new tolevel windows
    works almost exactly the same as creating new widgets.


    Toplevel windows are created using the `Toplevel` class:


    ```

    t = Toplevel(parent)

    ```


    Note: Toplevels are part of the classic Tk widgets, not the themed widgets.

    Unlike regular widgets, we don''t have to `grid` a tolevel for it to appear onscreen.
    Once we''ve created a new tolevel, we can create other widgets as children of
    thatlevel, and `grid` them inside the tolevel. The new tolevel behaves exactly
    like the automatically created root window.


    To destroy a window, use `destroy` method:


    ```

    window.destroy()

    ```


    Note that you can use `destroy` on any widget, not just a tolevel window. When
    you destroy a window, all windows (widgets) that are children of that window are
    also destroyed. Be careful! If you destroy the root window (that all other widgets
    are descended from), that will terminate your application.


    > In a typical document-oriented application, we want to be able to close any
    windows while leaving the others open. In that case, we may want to create a new
    tolevel for every window, and not put anything directly inside the root window
    at all. While we can''t destroy the root window, we can remove it entirely from
    the screen using its `withdraw` method, which we''ll see shortly.'
  merge: -1
  pgno: 162
- img_proc: true
  md: '# ## 11.2. Window Behavior and Styles


    There are lots of things about how windows behave and how they look that can be
    changed.


    # ### Window Title


    To examine or change the title of the window:


    ```

    oldtitle = window.title()

    window.title(''New title'')

    ```


    # ### Size and Location


    In Tk, a window''s position and size on the screen are known as its `geometry`.
    A full geometry specification looks like this: `widthheight`.


    Width and height (usually in pixels) are pretty self-explanatory. Similarly, `x`
    (horizontal position) is specified with a leading plus or minus, so `+25` means
    the left edge of the window should be 25 pixels from the left edge of the screen,
    while `-50` means the right edge of the window should be 50 pixels from the right
    edge of the screen. Similarly, a `y` (vertical) position of `+10` means the top
    edge of the window should be ten pixels below the top of the screen, while `-100`
    means the bottom edge of the window should be 100 pixels above the bottom of the
    screen.


    > Geometry specifies the actual coordinates on the screen. It doesn''t make allowances
    for systems like macOS with a menubar along the top or a dock along the bottom.
    By specifying a position of `+0` would actually place the part of the window under
    the system menu bar. It''s a good idea to leave a healthy margin (at least 30
    pixels) from the screen''s edge.


    Screen positions can be different than you might expect when you have multiple
    monitors on your system. We''ll cover that shortly.'
  merge: -1
  pgno: 163
- img_proc: true
  md: 'Here is an example of changing the size and position. It places the window
    towards the top righthand corner of the screen:


    ```

    window.geometry(''300x200-5+40'')

    ```


    You can retrieve the current geometry the same way; just provide a new geometry
    value. However, if you try it immediately after changing the geometry, you''ll
    find it doesn''t match. Remember that all drawing effectively occurs in the background,
    in response to idle times via the event loop. Until drawing occurs, the internal
    geometry of the window won''t be updated. If you do want to force things to update
    immediately, you can.


    ```

    window.update_idletasks()

    print(window.geometry())

    ```


    > We''ve seen that the window defaults to the size requested by the widgets that
    are gridded into it. If we''re creating and adding new widgets interactively in
    the interpreter, or our program adds new widgets in other events, the window size
    adjusts. This behavior continues until we explicitly define the window''s geometry
    as above or a user resizes the window. At that point, even if we add more widgets,
    the window won''t change size. You''ll want to be sure you''re using all of grid''s
    features (e.g., sticky, weight) to make everything fit nicely.


    # Resizing Behavior


    By default, tolevel windows, including the root window, can be resized by users.
    However, sometimes you may want to prevent users from resizing the window. You
    can do this via the resizable method. It''s first parameter controls whether users
    can change the width, and the second if they can change the height. So to disable
    all resizing:


    ```

    window.resizable(FALSE,FALSE)

    ```'
  merge: -1
  pgno: 164
- img_proc: true
  md: 'If a window is resizable, you can specify a minimum and/or maximum size that
    you''d like the window''s size constrained to (again, parameters are width and
    height):


    ```

    window.minsize(200,100)

    window.maxsize(500,500)

    ```


    You saw earlier on how to obtain the current size of the window via its geometry.
    Wondering how large it would be if you didn''t specify its geometry, or a user
    didn''t resize it? You can retrieve the window''s **requested size**, i.e., how
    much space it requests from the geometry manager. With drawing, geometry calculations
    are only done at idle time in the event loop, so you won''t get a useful response
    until the widget has appeared onscreen.


    ```

    window.winfo_reqwidth() # or winfo_reqheight

    ```


    > You can use the `reqwidth` and `reqheight` methods on any widget, not just toplevel.
    There are other `winfo` methods you can call on any widget, such as `width` and
    `height`, to get the actual (not requested) `width` and height. For more, see
    the `winfo` command reference.

    https://tkdocs.com/man/winfo


    # Intercepting the Close Button


    Most windows have a close button in their title bar. By default, Tk will destroy
    the window if users click on that button. You can, however, provide a callback
    that will be run instead. A common use is to prompt the user to save an open file
    if modifications have been made.


    ```

    window.protocol("WM_DELETE_WINDOW", callback)

    ```


    > The somewhat obscure-named `WM_DELETE_PROTOCOL` originated with X11 window manager
    protocols.'
  merge: -1
