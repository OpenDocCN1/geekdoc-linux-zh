- img_proc: true
  md: '# 3.1. Installing Tk on macOS


    # ## The Easy Way


    As noted, the easiest way to get Tk and Tkinter installed on your system is using
    Python''s binary installer, available at python.org. Thanks to work by Python
    core developer Ned Deily, binary installers starting with version 3.7 include
    T and Tk.


    > Remember, we''re using Python 3.x, not 2.x. As of this writing, the latest 3.9
    installer (3.9.0rc1) includes Tk 8.6.8.


    If, however, you''re compiling Python yourself, you''ll have more work to do.
    Read on...


    # Installing Tcl/Tk


    The Tkinter module is included with core Python, of course, but you''ll need a
    version of Tcl/Tk on your system to compile it again. Do yourself a huge favor
    and get the most recent version.


    Whatever you do, do not rely on the Tcl versions included in macOS! Older versions
    included Tk 8.4.x. Even more recent macOS versions include an early 8.5 version
    (8.5.9, released in 2010), which have several serious bugs that are easily triggered
    by Tkinter.


    While there are several different ways to get Tcl and Tk onto your machine, the
    easiest and most recommended is to use the ActiveTcl distribution.


    In your web browser, visit www.activestate.com/products/activetcl. Download ActiveTcl
    (as of this writing, it''s version 8.6.9). Make sure to download an 8.6.x version,
    Note that you will need to create an account with ActiveState (no cost) to download.
    After it''s downloaded, run the installer to get Tcl and Tk loaded onto your machine.


    > If you''re a masochist and want to read about other Tcl/Tk options variations
    and how they interact with Python, see the Mac Tcl/Tk page'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'at python.org/download/mac/tcl. If you want to compile Tcl/Tk from source,
    see www.tcl.tk.


    # Compiling Python


    When compiling Python from source, you may need to tell it where to find the ActiveTcl
    (or other) distribution. Otherwise, it might not find any Tcl/Tk distribution
    (so Tkinter won''t work), or it could find any (ancient and broken) version of
    Tcl/Tk supplied with macOS.


    If you''re using Python 3.9 or newer, the build system will tell you in /Library/Frameworks,
    where ActiveState and other custom builds are typically installed.


    +   * ./configure

    * make


    > The initial "%" is the Unix shell prompt; you don''t have to type it. The rest
    of it should all go on one line, without adding line breaks.


    When compiling Python versions prior to 3.9, you will need to add two new command-line
    options to the initial ./configure in the Python build process. The first provides
    the locations of the Tcl and Tk include files, and the second provides the locations
    of the Tcl and Tk libraries. These are usually found in two different locations
    (i.e., Tcl.framework and Tk.framework). You therefore need to provide two locations
    for the files and for the libraries. Note the location of the quotes in the command
    and the spaces separating the Tcl and Tk paths.


    ```

    ./configure --with-tcltk-includes="-I/Library/Frameworks/Tcl.framework/Headers
    -I/Library/Frameworks/Tk.framework/Headers" --with-tcltk-libs="-L/Library/Frameworks/Tcl.framework/Tcl
    -L/Library/Frameworks/Tk.framework/Tk"

    make

    ```


    > If you have multiple versions of Tcl/Tk installed on your system (and in the
    same frameworks), you may need to check inside the framework to'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'ensure the most recent version is marked as the current one. If not, you may
    need to adjust your paths to point to the specific version (i.e., Versions/8.x/)
    within each framework.


    When everything is built, be sure to test it out. Start Python from your terminal,
    e.g.


    ```

    ./python.exe

    ```


    This should give you the Python command prompt. From the prompt, enter these two
    commands:


    ```

    >>> import tkinter

    >>> tkinter._test()

    ```


    This should pop up a small window; the first line at the top of the window should
    say "This is Tcl/Tk version 8.6"; make sure it is not 8.4 or 8.5!


    > Get an error saying No module named tkinter? You''re probably using Python 2.
    This book assumes Python 3.


    You can also get the exact version of Tcl/Tk that is being used with:


    ```

    >>> tkinter.().eval(''info patchlevel'')

    ```


    It should return something like ''8.6.9''.


    > Verified install using ActiveTcl 8.6.9609.2 and Python 3.90rc1 source code from
    python.org on macOS 10.15.6.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# 3.2. Installing Tk on Windows


    Tkinter (and, since Python 3.1, ttk, which is the interface to the newer themed
    widgets) is included in the Python standard library. We highly recommend installing
    Python using the standard binary distributions from python.org. These will automatically
