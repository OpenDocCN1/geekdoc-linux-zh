  md: '# 7.2. Spanning Multiple Cells


    Widgets can take up more than a single cell in the grid; to this, we''ll use the
    colspan and rowspan options when gridding the widget. These are analogous to the
    "colspan" and "rowspan" attribute of HTML tables.


    Here is an example of creating a user interface with multiple widgets, some that
    take up more than a single cell.


    ![](img/e444c319ec16222f00278651bee8c21d_93_0.png)


    ```

    from tkinter import *

    from tkinter import ttk


    root = Tk()


    content = ttk.Frame(root)

    frame = ttk.Frame(content, borderwidth=5, relief="ridge", width=200, height=100)

    namlbl = ttk.Label(content, text="Name")

    name = ttk.Entry(content)


    onevar = BooleanVar(value=True)

    twovar = BooleanVar(value=False)

    threevar = BooleanVar(value=True)


    one = ttk.Checkbutton(content, text="One", variable=onevar,nonvalue=True)

    two = ttk.Checkbutton(content, text="Two", variable=twovar,onvalue=True)

    three = ttk.Checkbutton(content, text="Three", variable=threevar,onvalue=True)

    ```'
