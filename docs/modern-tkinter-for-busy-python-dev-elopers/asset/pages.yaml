  md: 'associated with; see [bugs.python.org/issue25173].


    Choosing the window as the parent of the dialog is important. It ensures the dialog
    window appears near that window. On macOS, these dialogs are often attached to
    the title bar of the parent window (see the error alerts in the previous section).


    > The front ends to these dialogs in Tkinter support both a master and a parent.
    While most of the time, "master" and "parent" are used interchangeably in Tkinter,
    that''s not the case. If you provide only the master, the dialog won''t be attached
    to that window (but the dialog still needs an existing window to create the dialog,
    which is why the master parameter is there). If the dialog is associated with
    another window, be sure to use the parent parameter.'
