  md: '# 12.4. Notebook


    ```

    ttk.Notebook

    https://tkdocs.com/man/ttk_notebook

    ```


    A notebook widget uses the metaphor of a tabbed notebook to let users switch between
    one of several pages, using an index tab. Unlike with normed windows, users only
    see a single page (akin to a pane) at a time.


    | macOS | Windows | Linux |

    |---|---|---||

    | One Two Three | | Notebook widgets.|


    Notebooks are created using the ttk.Notebook class:


    ```

    n = ttk.Notebook(parent)

    f1 = ttk.Frame(n)   # first page, which would get widgets

    gridded into it

    f2 = ttk.Frame(n)   # second page

    n.add(f1, text=''One'')

    n.add(f2, text=''Two'')

    ```


    The operations on tabbed notebooks are similar to those on pannedwindows. Each
    page is typically a frame and again must be a direct child (subwindow) of the
    notebook itself. A new page and its associated tab are added after the last tab
    with add subwindow option value=? method. The text tab option sets the label on
    the tab; also useful is the state tab option, which can have the value normal,
    disabled (not selectable), or hidden.'
  merge: -1
  pgno: 187
- img_proc: true
  md: 'To insert a tab somewhere other than the end of the list, use the `insert position`
    subwindow `?option value...?`, and to remove a given tab, use the `forget` method,
    passing either the position (0..n-1) or the tab''s subwindow. You can retrieve
    the list of all subwindows contained in the notebook via the `tabs` method.


    To retrieve the subwindow that is currently selected, call the tab''s position
    or the subwindow itself as a parameter.


    To change a tab option (like the text label on the tab or its state), you can
    use the `tab(tabid, option=value)` method (where `tabid` is again the tab''s position
    or subwindow); omit the `=value` to return the current value of the option.


    Notebook widgets generate a `<<NotebookChanged>>` virtual event whenever a new
    tab is selected.


    Again, there are a variety of less frequently used options and commands detailed
    in the `command reference`.


    +   - https://tkdocs.com/man/ttk_notebook'
