  md: "# Customizing Appearance\n\nWe previously saw the width height configuration\
    \ options for text widgets. Several others control its overall appearance. The\
    \ most useful are:\n\n+   foreground:\n  color to draw the text in\nbackground:\n\
    \  background color of the widget\npadx, pady:\n  extra padding along the inside\
    \ border of the widget\nborderwidth:\n  width of the border around widget\nrelief:\n\
    \  border style: flat, raised, sunken, solid, ridge, groove\n\nIf some lines of\
    \ text in the widget are very long, longer than the width of the widget? By default,\
    \ the text wraps around the next line. This behavior can be changed with the wrap\
    \ configuration option. defaults to char, meaning wrap lines at any character.\
    \ Other options are word to wrap lines only at word breaks (e.g., spaces), and\
    \ none meaning to not wrap lines at all. In the latter case, some of longer lines\
    \ won't be visible unless we attach a horizontal scrollbar to the widget. (Users\
    \ can also scroll through the text using arrow keys, even if scrollbars aren't\
    \ present).\n\nScrollbars, both horizontal and vertical, can be attached to the\
    \ text widget in the same way as other widgets, e.g., canvas, listbox.\n\n```\n\
    t = Text(root, width = 40, height = 5, wrap = \"none\")nys = tk.Scrollbar(root,\
    \ orient = 'vertical', command = t.view)\nxs = tk.Scrollbar(root, orient = 'horizontal',\
    \ command = t.view)\nt[yscrollcommand] = ys.set\nt[xscrollcommand] = xs.set\n\
