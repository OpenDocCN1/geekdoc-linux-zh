- img_proc: true
  md: 'Lines have several interesting additional attributes, allowing for drawing
    curves, arrows, and more.


    arrow:


    +   place an arrowhead at the start (first), end (last), or both ends (both);
    default is none


    +   arrowshape: allows changing the appearance of any arrowheads


    +   capstyle: for wide lines without arrows, this controls the end of lines are
    drawn; one by butt (default), projecting, or round


    +   joinstyle: for wide lines with multiple segments, this controls drawings of
    each vertex; one of round (default), bevel, or miter


    +   smooth: if specified as true (or bezier), draws a smooth curve via quadratic
    splines between multiple segments rather than using straight lines; raw specifies
    a different type of curve (cubic splines)


    +   splinesteps: controls the smoothness of curved lines, i.e., those with the
    smooth option set


    # Rectangle


    Rectangles are specified by the coordinates of opposing corners, e.g., top-left
    and bottom-right. They can be filled in (via fill) with one color, and the outline
    given a different color.


    ```

    canvas.create_rectangle(10, 10, 200, 50, fill=''red'', outline=''blue'')

    ```


    # Oval


    Ovals items work exactly the same as rectangles.


    ```

    canvas.create_oval(10, 10, 200, 150, fill=''red'', outline=''blue'')

    ```'
