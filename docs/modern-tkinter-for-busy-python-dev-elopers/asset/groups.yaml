    # 15.3. 使用标签格式化


    到目前为止，当所有文本使用单一字体时，我们使用的是文本小部件。现在是时候查看如何添加特殊格式了，例如**粗体**、斜体、删除线、背景颜色、字体大小等。Tk
    的文本小部件使用一种称为“标签”（tags）的功能来实现这些格式。


    标签是与文本小部件关联的对象。每个标签通过程序员选择的名称进行引用。每个标签都有几个配置选项。这些是控制格式的项，如字体和颜色。虽然标签是具有状态的对象，但它们不需要显式创建。它们在标签第一次被使用时会自动创建。


    ## 为文本添加标签


    标签可以与小部件中的一个或多个文本范围相关联。与之前一样，范围通过索引指定。单个索引表示单个字符，一对索引表示从起始字符到结束字符前一个字符的范围。使用 `tag_add`
    方法将标签添加到文本范围。


    ```

    text.tag.add(''highlight'', ''5.0'', ''6.0'')

    ```


    在首次插入文本时也可以提供标签。`insert` 方法支持一个可选参数，该参数包含一个或多个要添加到所插入文本的标签列表。


    ```python

    text.insert(''end'', ''new material to insert'', (''highlight'', ''recent'', ''warning''))

    ```


    当小部件中的文本被修改（无论是通过用户还是通过你的程序），标签将自动调整。例如，如果我们为文本 "the quick brown fox" 标记标签 "nounphrase"，然后将单词
    "quick" 替换为 "speedy"，该标签仍然适用于整个短语。


    ## 对标签应用格式


    格式通过配置选项应用于标签；这些选项的工作原理与整个小部件的配置选项类似。例如：


    ```python

    text.tag_configure(''highlightline'', background=''yellow'', font=''TkFont'',
    relief=''raised'')

    ```


    标签支持以下配置选项：background, backgroundbackground, font, foreground, justify, margin1,
    borderwidth, elide, foregroundbackground, margin2, offset, overstrike, relief,
    margin1, spacing2, tabs, tabstyle, underline, 和 wrap。请查看参考手册获取这些内容的详细描述。`tag_cget`
    方法允许我们查询标签的配置选项。


    由于多个标签可以应用于同一文本范围，因此存在冲突的可能性（例如，两个标签指定不同的字体）。使用优先级顺序来解决这些问题；最近创建的标签优先级最高，但可以使用
    `tag_raise` 和 `tag_lower` 方法重新排列优先级。


    ## 更多操作


    要完全删除一个或多个标签，我们可以使用 `tag_delete` 方法。这会移除对该标签的任何引用。即使它没有留下任何文本范围，标签对象仍然存在。


    `tag_ranges` 方法返回标签已应用于文本的范围列表。还有 `tag_next` 和 `tag_prev` 方法，用于从给定位置向前或向后搜索。


    `tag_names` 方法在不带额外参数调用时，会返回小部件中当前定义的所有标签列表。如果我们传递一个索引，它将返回应用于该索引处字符的标签列表。


    最后，我们可以使用文本中的第一个和最后一个字符作为索引，就像我们可以使用 "end" 或 "1" 一样。只需指定 `.first` 或 `.last` 即可。


    ## Canvas 和 Text 小部件中标签的区别


    canvas 和 text 小部件都支持可以应用于对象的“标签”，用于设置样式等。然而，canvas 和 text 标签并不相同。有需要注意的重要区别。


    在 canvas 小部件中，只有单独的项目具有控制其外观的配置选项。当我们引用 canvas 中的标签时，它的意思是所有具有该标签的 canvas 项目。标签本身并不作为一个独立的对象存在。因此，在下面的代码段中，矩形将不会变成红色。


    ```python

    canvas.itemconfigure(''highlight'', fill=''red'')

    canvas.create_rectangle(10, 10, 40, 40, tags=(''highlight'',))

    ```


    相比之下，在 text 小部件中，保留外观状态信息的不是单个字符，而是标签，标签本身就是对象。因此在这一段代码中，新添加的文本将被染红。


    ```python

    text.insert(''end'', ''first text'', (''highlight''))

    text.tag_configure(''highlight'', foreground=''red'')

    text.insert(''end'', ''second text'', (''highlight''))

    ```


    ## 15.4. 事件与绑定


    我们可以做的酷之一是在标签上定义事件绑定。这允许我们轻松地识别对特定文本范围的鼠标点击，并响应弹出菜单或对话框。不同的标签可以有不同的绑定。这节省了处理诸如“点击此位置意味着什么？”问题的麻烦。标签上的绑定使用
    `tag_bind` 方法实现：


    ```python

    text.tag_bind(''highlight'', ''<Button-1>'', popupMenu)

    ```


    小部件级的事件绑定继续像其他所有小部件一样工作，例如，捕捉文本中任意处的鼠标点击。除了普通的低级事件外，当小部件的内容发生变化时，文本小部件会生成 <<Modified>>
    虚拟事件，当选中的文本发生变化时，会生成 <<Selection>> 虚拟事件。


    ## 选择文本


    我们可以通过标签来标识选中的文本范围，在某些情况下这通过 <<Selection>> 虚拟事件指示了光标所在的位置。例如，编辑器可能会在光标处输入新文本。


    文本小部件自动维护名为 `sel` 的标签，当选择范围变化时，该标签将更新。我们可以通过 `tag_ranges` 方法找到具有 `sel` 标签的文本范围。同样，我们可以通过
    `tag_add` 设置新的选择范围并将 `sel` 标签。在选择发生变化时，`sel` 标签会被更新。


    > 默认情况下，标记的重力是右侧，标记附在“c”上。如果我们在标记处插入新文本“b”，标记将停留在“c”上，因此新文本将插入在标记之前。如果重力反而是左侧，标记将附在“a”上，因此新文本将插入在标记之后。


    ## 15.6. 标记


    标记指示文本中的特定位置。在这方面，它们类似于索引。然而，当文本被修改时，标记将调整到相同的位置。以这种方式，它们类似于标签，但指的是单个位置而不是文本范围。


    Tk 自动维护两个标记。第一个名为 `insert`，是光标当前的位置。随着光标（通过鼠标或键盘移动），第二个标记 `current` 会跟踪鼠标所在的位置。


    要创建自己的标记，使用小部件的 `mark_set name idx` 方法，传递标记名称和给定索引（标记位于给定索引字符之前）。这也被用于移动现有标记到不同的位置。可以使用
    `mark_unset name` 方法移除标记，传递标记名称。如果你删除了包含标记的文本范围，该标记也会被移除。


    标记的名称也可以作为索引（就像使用 1.0 或 end-lc 一样）。你可以使用 `mark_next idx` 和 `mark_previous idx`
    方法从给定索引查找下一个标记（或上一个标记）。`mark_names` 方法将返回所有标记名称的列表。


    标记还具有重力，可以通过 `mark_gravity name direction` 方法进行修改，这会影响在标记处插入文本时发生的情况。假设我们有文本 "ac"，中间有一个标记，我们用管道符
    | 来表示它，即 "a|c"。如果该标记的重力是右侧（默认值），标记将附在“c”上。如果在标记处插入新文本“b”，标记将保持附着在“c”上，因此新文本将插入在标记之前，即
    "abc|c。"如果重力反而是左侧，标记将附在“a”上，因此新文本将插入在标记之后，即 "a|bc。"


