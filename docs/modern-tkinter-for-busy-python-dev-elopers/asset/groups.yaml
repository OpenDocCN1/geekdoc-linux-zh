    \ a good day')\n```\n\n| macOS | Windows | Linux |\n| --- | --- | --- |\n| ![Have\
    \ a good day](https://example.com/macos_alert.png) | ![Have a good day](https://example.com/windows_alert.png)\
    \ | ![Have a good day](https://example.com/linux_alert.png) |\n\nSimple message\
    \ boxes.\n\n```\nmessagebox.askyesno(\n    message='Are you sure you want to install\
    \ SuperVirus?'\n    icon='question' title='Install')\n```"
