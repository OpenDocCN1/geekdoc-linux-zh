    ## 2.3. 静默的革命


    Tk 8.5.0 于 2007 年 12 月 20 日发布，这与十多年前的 8.0 版本 Windows 和 macOS 版本同样关键。核心发行版包含了“新”控件，用于如树形结构（trees）、组合框（combo-boxes）、笔记本（notebooks）等现在已常见的组件。这些组件以前仅作为插件可用（且选择非常多）。


    最重要的是，Tk 8.5 添加了一组新的“主题”（themed）控件，它补充了但并未取代“经典”（classic）控件组。经典控件提供了完全的向后兼容性，保留了它们几乎无限的灵活性，但外观通常比较过时。新的主题控件在各自平台上开箱即用的效果要好得多。设计初目的是让开发者在几乎所有的主流用户界面需求中使用它们。新控件还支持通过主题更改外观和感受，使得对于合适的应用程序和平台，实现“可换肤”的用户界面变得简单。


    为什么我称之为 Tk 的静默革命呢？这一切都发生在它黄金时期大约十年后。当时，网页开发让桌面 GUI 变得边缘化，很少有开发者关注 Tk。如果你不关注，你就不知道发生了任何变化。多亏了向后兼容性，对大多数人来说，确实没有发生变化。遗憾的是。


    ## 2.4. 今天的 Tk


    本文写于 2020 年 9 月。在 8.5.0 发布后的十几年年里，核心 T/Tk 包大约发布了 30 个新版本，目前版本为 8.6.10。在此期间，尽管新功能的开发有所放缓，但它仍在持续改进。


    ## 2.5. Tkinter


    Python 的 Tkinter 是 Tk 的早期绑定之一，也无疑是最流行的绑定之一。Tkinter 最初由 Fredrik Lundh 编写。Tkinter
    的工作原理类似于大多数 Tk 绑定，通过在 Python 程序中嵌入一个 Tcl 解释器。然后，Tkinter 命令被翻译成 Tcl 命令并在该解释器中执行。


    2009 年，Guilherme Polo 为 Tkinter 添加了对 Tk 中较新的“ttk”主题控件的支持，从 Python 2.7（ 2.x 分支上）和
    Python 3.1 开始。这为使用 Tkinter 构建更好的用户界面打开了大门。文档仍然是 Python 程序员学习新主题控件的主要障碍。


    ## 3. 安装 Tkinter


    在本章中，你将在你的机器上安装 Tk 和 Tkinter，验证其运行情况，然后查看一个 Tkinter 程序的快速示例。


    在过去，这是一个多步骤的过程。然而，如果你使用的是 Python 3.7 或更高版本，那么你走运了！在 python.org 上提供的 macOS 和 Windows
    Python 二进制安装程序现在包含了使用 Tkinter 所需的所有内容，包括底层的 Tcl/Tk 库。


    如果你在 Linux 上运行，所有流行的发行版都有可用的包，这也让安装 Tkinter 变得轻而易举。


    如果你使用的是旧版本的 Python 或从源码编译，你需要在你的系统上安装 Tcl/Tk。如果你处于这种情况，我们将解释如何使用免费的发行版 ActiveTcl（由
    ActiveState 提供）来完成。


    记住


    ## 3.1. 在 macOS 上安装 Tk


    ### 简易方法


    如所述，在你的系统上安装 Tk 和 Tkinter 最简单的方法是使用 python.org 上的 Python 二进制安装程序。得益于 Python 核心开发者
    Ned Deily 的工作，从3.7版本开始的二进制安装程序包含了 T 和 Tk。


    > 记住，我们使用的是 Python 3.x，而不是 2.x。截至本文写作，最新的 3.9 安装程序 (3.9.0rc1) 包含了 Tk 8.6.8。


    然而，如果你自己编译 Python，你需要做更多工作。请继续阅读...


    ### 安装 Tcl/Tk


    Tkinter 模块包含在核心 Python 中，但你需要在系统上有一个 Tcl/Tk 版本才能重新编译它。为自己个大忙，获取最新版本。


    无论你做什么，都不要依赖 macOS 自带的 Tcl 版本！旧版本包含了 Tk 8.4.x。更新的 macOS 版本甚至包含一个早期的 8.5 版本（8.5.9，2010
    年发布），这些版本有几个容易被 Tkinter 触发的严重错误。


    虽然有多种不同的方法可以将 Tcl 和 Tk 引入你的机器，但简单且最推荐的方法是使用 ActiveTcl 发行版。


    在浏览器中，访问 www.activestate.com/products/activetcl。下载 ActiveTcl（截至本文写作，它是 8.6.9 版本）。确保下载的是
    8.6.x 版本。注意，你需要创建一个 ActiveState 账户（免费）才能下载。下载完成后，运行安装程序将 Tcl 和 Tk 加载到你的机器上。


    > 如果你是一个受虐狂并想了解其他 Tcl/Tk 选项变体以及它们如何与 Python 交互，请查看 python.org/download/mac/tcl
    中的 Mac Tcl/Tk 页面。如果你想从源码编译 Tcl/Tk，请访问 www.tcl.tk。


    ### 编译 Python


    从源码编译 Python 时，你可能需要告诉它哪里寻找 ActiveTcl（或其他发行版）。否则，它可能找不到任何 Tcl/Tk 发行版（因此 Tkinter
    将无法工作），或者它可能会找到任何（古老且损坏的）版本的 Tcl。


    当你从源码编译 Python 时，你可能需要告诉它哪里寻找 ActiveTcl（或其他发行版）。否则，它可能找不到任何 Tcl/Tk 发行版（因此 Tkinter
    将无法工作），或者它可能会找到任何（古老且损坏的）版本的 Tcl。


