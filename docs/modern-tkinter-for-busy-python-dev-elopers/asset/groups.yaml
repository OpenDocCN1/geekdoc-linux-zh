    # 17.5. Sound Difficult to you?


    So you now know that styles are made up of elements, which have a variety of options,
    and are composed together in a particular layout. You can change various options
    on styles to make all widgets using the style appear differently. Any widgets
    using that style take on the appearance that the style defines. Themes collect
    an entire set of related styles, making it easy to change the appearance of your
    user interface.


    So what makes styles and themes so difficult in practice? Three things. First:


    > You can only modify options for a style, not element options (except sometimes).


    We talked earlier about how to discover what elements were used in the style by
    examining the style''s layout, and also how to discover what options were available
    for each element. But when we wanted to make changes to a style, we seemed to
    be configuring an option for the style, without specifying an individual element.
    What''s going on?


    Again, using our button example, we had an element Button.label, which, among
    other things, had a font configuration option. What happens is when that Button.label
    element is drawn, it looks at the font configuration option set on the style to
    determine what font to draw in.


    > To understand why, you need to know that a style includes an element as a piece
    of it, that element does not maintain any (element-specific) storage. In particular,
    it does not store any configuration options itself. When it needs to retrieve
    options, it does so via the containing style, which is passed to the element.
    Individual elements, therefore, are "flyweight" objects in GoF parlance.


    ![](img/e444c319ec16222f00278651bee8c21d_259_0.png)


    Similarly, any other elements will lookup their configuration options set on the
    style. What if two elements use the same configuration option (like a background
    color)? Because there is only one background configuration option, stored in the
    style, both elements will use the same background color. You can''t have one element
    one background color, and the other use a different background color.'
- md: 'Except when you can. There are a few nasty, widget-specific things called sublayouts
    in the current implementation, which let you sometimes modify just a single element,
    via configuring an option like TButton.Label (rather than TButton, the name of
    the style).


    Some styles also provide additional configuration options that let you specify
    what element options effects. For example, the Checkbutton style provides a background
    option for the main part of the widget and an indicatorbackground option for the
    box that shows whether it is checked.


    Are the cases where you can do this documented? Is there some way to introspect
    to determine when you can so (believe it or not, this is an improvement); the
    answer to used to be a clear "no". You can sometimes find some of the style''s
    options by calling the style without providing any new configuration options.
    The reference manual pages for each themed widget now generally include a styling
    options section that lists options that may be available to change.


    This is one area of the themed widget API that continues to evolve over time.


    ## The second difficulty is also related to modifying style options:


    - Options that are available don''t necessarily have an effect, and it''s not
    an error to modify a bogus option.


    You''ll sometimes try to change an option that is supposed to exist according
    to element options, but it will have no effect. For example, you can''t modify
    the background color of a button in the aqua theme used by macOS. While there
    are valid reasons for these cases, it''s not easy to discover them, which can
    make experimenting frustrating at times.


    Perhaps more frustrating when you''re experimenting is that specifying an incorrect
    style or name does not generate an error. When doing a configure or lookup you,
    in fact, specify any name at all for a style, and specify any name at all for
    an option. So if you''re bored with the background and font options, feel free
    to configure a dowhatimean option. It may not do anything, but it''s not an error.
    Again, it may make it hard to know what you would be modifying and what you shouldn''t.


    This is one of the downsides of having a very lightweight and dynamic system.
    You can create new styles by just providing their name when configuring style
    options; this means you don''t need to explicitly create a style object. At the
    same time, this does open itself to errors. It''s also possible to find out what
    styles currently exist or are used. And because style options are really just
    a front end for element options, and the elements in a style can change at any
    time, it''s not necessarily obvious that options should be restricted to those
    referred to current elements alone, which may themselves not all be introspective.


    Finally, here is the last thing that makes styles and themes so difficult:


    - The elements available, the names of those elements, which options are available
    or have an effect for each of those elements, and which are used for a particular
    widget can be different in every theme.


    So? Remember, the default theme for each platform (Windows, macOS and Linux) is
    different (which is a good thing). Some implications of this:


    - 1. If you want to define a new type of widget (or a variation of an existing
    widget) for your application, you''ll need to do it separately and differently
    for each theme application uses (i.e., at least three for a cross-platform application).

    - 2. The elements and options available will differ for each theme/platform, meaning
    you may have to come up with a quite different customization approach for each
    theme/platform.

    - 3. The elements, names, and element options available with each theme are not
    typically documented (outside of reading the theme definition files themselves),
    but are generally identified via theme introspection (which we''ll see soon).
    Because all themes aren''t available on all platforms (e.g., aqua is only available
    on macOS), you''ll need ready access to every platform and theme you need to run.


    Consider trying to customize a button. You know it uses TButton. But that style
    is implemented using a different theme on each platform. If you examine the layout
    of that style in each theme, you''ll discover each uses different elements, arranged
    differently. If you try to find the advertised options available for each element,
    you see those different too. And of course, even if an option is nominally available,
    it may not have an effect.


    The bottom line is that in classic Tk, where you had the ability to modify any
    of a large set of attributes for an individual widget, you''d be able to do something
    on one platform and it would sorta-kinda work (but probably need tweaking) on
    others. In themed Tk, the easy option just isn''t there, and you''re pretty much
    forced to do it the right way if you want your application to work with multiple
    themes/platforms. It''s more work upfront.


    ## 17.6. Advanced: More on Elements


    While that''s about as far as we''re going to go on styles and themes in this
    book, for curious users and those who want to delve further into creating new
    themes, we can provide a few more tidbits about elements.


    Because elements are the building blocks of styles and themes, it begs the question
    of "where do elements come from?" Practically speaking, we can say that elements
    are normally created in C code and conform to a particular API that the theming
    engine understands.


    At the very lowest level, elements come from something called an element factory.
    At present, there is a default one, which most themes use, and uses drawing to
    create elements from images and is actually accessible at the script level using
    the ttk::style element create method (from Tcl). Any image format supported by
    Tk is available, including scalable formats like SVG, if you have the right extension.
    Finally, there is a third, Windows-specific engine using the underlying "Visual
    Styles" platform API.


    If one uses elements created via a platform''s native widgets, the calls to use
    these native widgets will normally appear within that theme''s element specification
    code. Of course, themes elements depend on native widgets or API calls can only
    run on the platforms that support them.


    Themes will then take a set of elements and use those to assemble the styles that
    are actually used by the widgets. And given the whole idea of themes is that several
    styles can share the same appearance, it''s not surprising that different styles
    share the same elements.


    So the TButton style includes a Button.padding element, and the TEntry style includes
    an Entry.padding element, underneath, these padding elements are more than likely
    one and the. They may appear differently, but that''s because of different configuration
    options, which as we recall, are stored in the style that uses the element.


    It''s also probably not surprising to find out that a theme can provide a set
    of common options that are used as defaults for each style the style doesn''t
    specify them otherwise. This means that if pretty everything in an entire theme
    has a green background, the theme doesn''t need to explicitly say this for each
    style. This uses a root style named .. After all, if Fun.TButton can inherit from
    TButton, why can''t TButton inherit from .?.


    Finally, it''s worth having a look at how existing themes are defined, both at
    the C code level in Tk''s C library, but also via the scripts found in Tk''s "library/ttk"
    directory or in third-party themes. Search for Ttk_RegisterElementSpec in Tk''s
    C library to see how elements are specified.


    ## 18. Case Study: IDLE Modernization


    This chapter presents a case study of modernizing the appearance of a substantial
    Tk-based application.


    IDLE (Integrated Development Environment) is the standard Python development environment
    that is bundled with every Python release. It consists of an interactive Python
    shell, editors with syntax highlighting, a debugger, etc. Its user interface is
    written in Tkinter.

