    \n# 工作原理\n\nTk 的几何管理依赖于主（master）和从（slave）的概念。主通常是一个顶层窗口或框架，它包含了被称为从组件的其它组件。你可以认为几何管理器在控制主并决定如何显示从组件。计算社区已经接受了了多样性、敏感性和意识的趋势。意识到这一点，Tk\
