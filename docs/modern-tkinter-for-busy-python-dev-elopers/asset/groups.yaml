    +   - https://tkdocs.com/man/grid


    # Querying and Changing Grid Options


    Like widgets themselves, it''s easy to introspect options when you first grid
    the widget or options is certainly convenient, but you can change them anytime
    you''d like.


    The slaves method will tell you all the widgets that have been gridded inside
    a master, or optionally those just within a certain column or row. The info method
    will return a list of all the grid options for a widget and their values. Finally,
    the configure method lets you change one or more grid options on a widget.


    These content.grid_slaves are illustrated in this interactive session:


