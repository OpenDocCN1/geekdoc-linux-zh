    \n## 14.3. 标签 (Tags)\n\n我们已经看到每个画布项目（item）都有唯一的 id 数字，但还有另一种非常有用且强大的方法来引用画布上的项目，那就是使用标签（tags）。\n\
    \n标签只是你创建的内容的标识符，对你的程序具有意义的东西。你可以将标签附加到画布项目上；每个项目可以拥有任意数量的标签。与每个项目唯一的 id 数字不同，许多项目可以具有相同的标签。\n\
    \n使用标签可以做什么？我们已经看到可以使用项目 id 来修改画布（我们很快就会看到还可以对项目进行许多其他操作，如移动它们、删除它们等）。在任何你可以使用项目\
    \ id 的地方，都可以使用标签。例如，你可以更改所有具有特定标签的项目的颜色。\n\n标签是识别画布中某些类型项目的好方法（例如绘制线条的一部分的项目、作为你调色板一部分的项目等）。你可以使用标签将画布项目与应用程序中的特定对象相关联（例如，将所有属于\
    \ id 为 #37 的机器人的画布项目标记为 \"robot37\" 标签）。有了标签，你就不需要一直跟踪画布项目的 id 以便以后引用一组项目；让 Tk\
    \ 为你完成这些工作吧。\n\n在创建项目时，可以使用 `tags` 选项配置来分配标签。稍后可以使用 `addtag` 方法添加标签，或使用 `dtags`\
    \ 方法移除标签。你可以使用 `gettags` 方法获取项目的标签列表，或使用 `find` 命令返回具有给定标签的所有项目 id 数字列表。\n\n例如：\n\
    \n```python\n>>> c = Canvas(root)\n>>> c.create_line(10, 10, 20, 20, tags=('firstline',\n\
