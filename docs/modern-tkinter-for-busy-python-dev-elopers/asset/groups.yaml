    https://tkdocs.com/code/f2mo.py\n\n## 5. Tk Concepts\n\nWith your first example\
    \ behind you, you now have a basic idea of what a Tk program looks like and the\
    \ type of code you need to write to make it work. In this chapter, we'll step\
    \ back and look at three broad concepts that you need to know to understand Tk:\
    \ widgets, geometry management, and event handling.\n\n## 5.1. Widgets\n\nWidgets\
    \ are all the things that you see onscreen. In our example, we had a button, an\
    \ entry, a few labels, and a frame. Others are things like checkboxes, tree views,\
    \ scrollbars, text areas, and so on. Widgets are often referred to as \"controls.\"\
    \ You'll also sometimes see them referred to as \"windows,\" particularly in Tk's\
    \ documentation. This is a holdover from its X11 roots (under that terminology,\
    \ both your toplevel application window and things like a button would be called\
    \ windows).\n\nHere is an example showing some of Tk's widgets, which we'll cover\
    \ individually shortly.\n\n![](img/e444c319ec16222f00278651bee8c21d_47_0.png)\n\
    \n### Widget Classes\n\nWidgets are objects, instances of classes that represent\
    \ buttons, frames, and so on. When you want to create a widget, the first thing\
    \ you'll need to do is identify the specific class of the widget you'd like to\
    \ instantiate. This book will help with that.\n\n### Widget Hierarchy\n\nBesides\
    \ the widget class, you'll need one other piece of information to create it: its\
    \ *parent*. Widgets don't float off in space. Instead, they're contained within\
    \ something else, like a window. In Tk, all widgets are part of a *widget (or\
    \ window) hierarchy*, with a single root at the top of the hierarchy.\n\nIn our\
    \ metric conversion example, we had a single frame that was created as a child\
    \ of the root window, and that frame had all the other controls as children. The\
    \ root window was a *container* for the frame and was, therefore, the frame's\
    \ *parent*. The complete hierarchy for the example looked like this:\n\n![](img/e444c319ec16222f00278651bee8c21d_48_0.png)\n\
    \nThe widget hierarchy of the metric conversion example.\n\nThis hierarchy can\
    \ be arbitrarily deep, so you might have a button in a frame in another frame\
    \ within the root window. Even a new window in your application (often called\
    \ a *toplevel*) is part of that same hierarchy. That window and all its contents\
    \ form a subtree of the overall widget hierarchy.\n\n![](img/e444c319ec16222f00278651bee8c21d_49_0.png)\n\
    \n## Creating Widgets\n\nEach separate widget is a Python object. When instantiating\
    \ a widget, you must pass its parent as a parameter to the widget class. The *only*\
    \ exception is the \"root\" window, which is the toplevel window that will contain\
    \ everything else. That is automatically created when you instantiate *Tk*. It\
    \ does not have a parent. For example:\n\n```python\nroot = Tk()\ncontent = ttk.Frame(root)\n\
    button = ttk.Button(content)\n```\n\nWhether or not you save the widget object\
    \ in a variable is entirely up to you, depending on whether you'll need to refer\
    \ to it later. Because the object is inserted into the widget hierarchy, it won't\
    \ be garbage collected even if you don't keep your reference to it.\n\nIf you\
    \ sneak a peek at Tcl manages widgets, you'll see each widget has a specific pathname;\
    \ you'll also see this pathname referred to in Tk documentation. Tkinter chooses\
    \ and manages all these pathnames for you behind the scenes, so you should never\
    \ have to worry about them. If you do, you can get the pathname from a widget\
    \ by calling str(widget).\n\n### Configuration Options\n\nAll widgets have several\
    \ configuration options. These control how the widget is displayed or how it behaves.\n\
    \nThe available options for a widget depend upon the widget class, of course.\
    \ There is a lot of consistency between different widget classes, so that options\
    \ that do pretty much the same tend to be named the same. For example, both a\
    \ button and a label have a text option to adjust the text that the widget displays,\
    \ while a scrollbar would not have a text option since it's needed. Similarly,\
    \ the button has a command option telling it what to do when pushed, while a label,\
    \ which holds static text, does not.\n\nConfiguration options can be set when\
    \ the widget is first created by specifying their names and values as optional\
    \ parameters. Later, you can retrieve the current values of those options, and\
    \ with a very small number of exceptions, change them at any time.\n\nIf you're\
    \ not sure what configuration options a widget supports, you can ask the widget\
    \ to describe them. This gives you a long list of all its options.\n\nThis is\
    \ all best illustrated with the following interactive dialog with the interpreter.\n\
    \n```\n# python\n>>> from tkinter import *\n>>> from tkinter import ttk\n>>> root\
    \ = Tk()\ncreate a button, passing two options:\n>>> button = ttk.Button(root,\
    \ text=\"Hello\", command=\"buttonpressed\")\n>>> button.grid()\ncheck the current\
    \ value of the text option:\n>>> button['text']\n'Hello'\nchange the value of\
    \ the text option:\n```\n"
