    \ like row, column, or sticky) we repeat the whole thing.\n\nThis all works recursively\
    \ as well. In our example, we had a content frame inside the tolevel application\
    \ window, and then several other widgets inside the content frame. We, therefore,\
    \ had to manage the geometry for two different masters. At the outer level,\n"
