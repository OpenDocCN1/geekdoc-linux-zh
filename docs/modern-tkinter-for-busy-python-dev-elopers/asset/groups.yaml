  - '[PAGE 300]


    # Debugger


    The design of the original debugger, along with having its own set of flaws (see
    [bugs.python.org/issue17942]), was too tall to be integrated like we wanted to
    do.


    The user interface was substantially revised, with a layout that would work both
    in a standalone window and when integrated. The new version uses a pared window
    to separate the controls and stack on the left from the variable display on the
    right. Both the stack and variable display are implemented using tree view widgets.
    This also provides a great deal of control when it comes to how much space each
    element will use.'
  - '[PAGE 301]


    ![](img/e444c319ec16222f00278651bee8c21d_301_0.png)


    # # Integrated Shell and Debugger


    To achieve the integration of the shell and the debugger with the tabbed editor,
    another paneled window was used. Additional controls will be added to show/hide
    the panes as the implementation progresses.


    The embedded shell is interesting too. Recall that IDLE normally has a single
    Python shell window running another Python process; when modules in an editor
    are "run," they do so via that shell. It''s nice to have big shell available,
    and we don''t necessarily want to start up a separate shell in the editor.


    New in Tk 8.5, the Text widget actually supports the ability to create "peers,"
    which are separate widgets, but they share the same text backend. That means when
    something changes in one, it changes in the other. It''s a seamless way to solve
    our problem here.'
  - '[PAGE 302]


    # 18.7. Workarounds, Hacks, and More


    In this being a chapter on actual experiences modernizing a real application,
    it would be a lie to say that the underlying user interface toolkit (Tk and the
    Tkinter wrapper) always worked exactly as it should. Like IDLE, Tkinter and Tcl/Tk
    are the results of incredible volunteer efforts. That being said...


    > Tk and Tkinter have some bugs and rough edges. Now you''re shocked.


    In this section, I''ll try to catalog just a few of the particular "gotchas" that
    we ran into, as well as provide some little tips that don''t necessarily fit elsewhere
    but help provide a bit more polish to the user interface.


    # Tool Tips


    +   * tool tips broken on macOS;

    see [bugs.python.org/issue24570]

    * MacWindowStyle help for tooltips, vs. wm overriddenirectelsewhere


    # Context Menus


    +   * bogus text widget bindings interfere with popup clicks;

    see [bugs.python.org/issue24801]

    * two different popup click bindings needed on macOS;

    [bugs.python.org/issue24801]


    # Peer Text Widgets


    +   * broken peer text widget API in Tkinter;

    see [bugs.python.org/issue17945]


