    ## 6.2 Label


    * ttk.Label


    https://tkdocs.com/man/ttk_label


    A **label** is a widget that displays text or images, typically that users will
    just view but not otherwise interact with it. Labels are used to identify controls
    or other parts of the user interface, provide textual feedback or results, etc.


    | macOS | Windows | Linux |

    | :--- | :--- | :--- |

    | Your Name: | Your Name: | Your Name: |

    | Figure 1. Pretty Picture. | Figure 1. Pretty Picture. | Figure 1. Pretty Picture.
    |

    | Name must not be blank. | Name must not be blank. | Name must not be blank.
    |


    *Label widgets.*


    Labels are created using the **ttk.Label** class. Often, the text or image the
    label will display are specified via configuration options at the same time:


    ```python

    label = ttk.Label(parent, text=''Full name:'')

    ```


    Like frames, labels can take several different configuration options, which can
    alter how they are displayed.


    ### Displaying Text


    The **text** configuration option (shown above when creating the label) is the
    most commonly used, particularly when the label is purely decorative or explanatory.
    You can change what text is displayed by modifying this configuration option.
    This can be done at any time, not only when first creating the label.


    You can also have the widget monitor a variable in your script. Anytime the variable
    changes, the label will display the new value of the variable. This is done with
    the textvariable option:


    ```python

    resultsContents = StringVar()

    label[''variable''] = resultsContents

    resultsContents.set(''New value to display'')

    ```


    Tkinter only allows you to attach widgets to an instance of the class, and not
    arbitrary Python variables. This class contains all the logic to watch for changes
    and communicate them back and forth between the variable and Tk. Use the get and
    set methods to read or write the current value of the variable.


    ### Displaying Images


    Labels can also display an image instead of text. If you just want an image displayed
    in your user interface, this is normally the way to do it. We''ll go into images
    in more detail in a later chapter, but for now, let''s assume you want to display
    a GIF stored on a disk. This is a two-step process. First, you will create an
    image "object". Then, you can tell the label to use that object via its image
    configuration:


    ```python

    image = PhotoImage(file=''myfile.gif'')

    label[''image''] = image

    ```


    Labels can also display both an image and text at the same time. You''ll see this
    in toolbar buttons. To do so, use the compound configuration option. The default
    value is none, meaning display only the image if present; if there is no image,
    display the text specified by the text or textvariable options. Other possible
    values for the compound option are: text (text only), image (image only), center
    (text in the center of image), top (image above text), left, bottom, and right.


    ### Fonts, Colors, and More


    Like with frames, you normally don''t want to change things like fonts and colors
    directly. If you need to change them (e.g., to create a special type of label),
    the preferred method would be to create a new style, which is then used by the
    widget with the style option.


    Unlike most themed-specific options the label widget also provides explicit widget-specific
    configuration options as an alternative. Again, you should use these only in special
    one-off cases when using a style doesn''t necessarily make sense.


    You can specify the font used to display the label''s text using the font configuration
    option. While we''ll go into fonts in more detail in a later chapter, here are
    the names of some predefined fonts you can use:


    - TkDefaultFont: Default for all GUI items not otherwise specified.

    - kT: Used for entry widgets, listboxes, etc.

    - TkFixedFont: A standard fixed-width font.

    - TkMenuFont: The font used for menu items.

    - TkHeadingFont: A font for column headings in lists and tables.

    - TkCaptionFont: A font for window and dialog caption bars.

    - TkSmallCaptionFont: Smaller captions for subwindows or tool dialogs.

    - TkIconFont: A font for icon captions.

    - ToolTipFont: A font for tooltips.


    > Because font choices are so platform-specific, be careful of hardcoding specifics
    (font families, sizes, etc.). This is something else you''ll see in many old Tk
    programs that can make them look ugly.


    ```python

    label[''font''] = "TkDefaultFont"

    ```


    The foreground (text) and background color of the label can also be changed via
    the foreground background configuration options. Colors are covered in detail
    later, but you can specify them as either color names (e.g., red) or hex RGB codes
    (e.g., #ff340a). Labels also accept the relief configuration option discussed
    for frames to make them appear sunken or raised.


    ### Layout


    While the overall layout of the label (i.e., where it is positioned within the
    user interface, and how large it is) is determined by the geometry manager, several
    options can help control how the label will be displayed within the rectangle
    geometry manager gives it.


    If the box given to the label is larger than the label requires for its contents,
    you can use the anchor option to specify which edge or corner the label should
    be attached to, which would leave any empty space in the opposite edge or corner.
    Possible values are specified as compass directions: n (north, or top edge), ne,
    (north-east, or top corner), e, s, sw, w, nw Or center.


    ![](img/e444c319ec16222f00278651bee8c21d_71_0.png)


    > Things not appearing where you think they? It may be that the geometry manager
    is not putting the label where you think it is. For example, if you''re using
    grid, you may need to adjust the sticky option of widget, to know exactly where
    each is positioned. This is a good example of those "one-off" cases we just mentioned
    where you might use configuration options rather than styles to modify appearance.


    ### Multi-line Labels


    Labels can display more than one line of text. To do so, embed carriage returns
    (\n or textvariable string). Labels can also automatically wrap your text into
    multiple lines via the wraength option, which specifies the maximum length of
    a line (in pixels, centimeters, etc.).


    ```python

    Multi-line labels are a replacement for the older message widgets in classic Tk.

    ```


    You can also control how the text is justified via the `justify` option. It can
    have the values `left`, `center`, or `right`. If you have only a single line of
    text, you probably want the `anchor` option instead.


    ## 6.3 Button


    ```python

    ttk.Button

    ```


    https://tkdocs.com/man/ttk_button


    A **button**, unlike a frame or label, is very much there to interact with. Users
    press a button to perform an action. Like labels, they can display text or images,
    but accept additional options to change their behavior.


    ![](img/e444c319ec16222f00278651bee8c21d_73_0.png)


    Buttons are created using the **ttk.Button** class:


    ```python

    button = ttk.Button(parent, text=''Okay'', command=submitForm)

    ```


    Typically, their contents and command callback are specified at the same time.
    As with other widgets, buttons can take several different configuration options,
    including the standard `style` option, which can alter their appearance and behavior.


    ### Text or Image


    Buttons take the same `text`, `textvariable` (rarely used), `image`, and `compound`
    configuration options as labels. These control whether the button displays text.


    Buttons have a default configuration option. If specified as active, this tells
    the button is the default button in the user interface; otherwise it is normal.
    Default buttons are invoked if users hit the Return or Enter key. Some platforms
    and styles will draw this default button with a different border or highlight.
    Note that setting this option doesn''t create an event binding that will make
    the Return or Enter key activate the button; that you have to do yourself.


    ### Command Callback


    The command connects the button''s action and your application. When a user presses
    the button, the script provided by the option is evaluated.


    You can also ask the button to invoke the command callback from your application.
    That way, you don''t need to repeat the command to be invoked several times in
    your program. If you change the command attached to the button, you don''t need
    to change it elsewhere too. Sounds like a useful way to add event binding on our
    default button, doesn''t it?


    ```python

    action = ttk.Button(root, text="Action", default="active",

    command=myaction)

    root.bind(''<Return>'', lambda e: action.invoke())

    ```


    > Standard behavior for dialog boxes and many others on most platforms is to setup
    a window for the Return key (<Return> or <Key-Return>) to invoke the active button
    if it exists, as we''ve done here. If there is a "Close" or "Cancel" button, create
    a binding to the Escape key (<Key-Escape>). On macOS, you should additionally
    bind the Enter key on the keyboard (<KP_Enter>) to the active button, and Command-period
    (<Command->) to the close or cancel button.


    ### Button State


    Buttons and many widgets start off in a normal state. A button will respond to
    mouse movements, can be pressed, and will invoke its command callback. Buttons
    can also be put into a disabled state,

