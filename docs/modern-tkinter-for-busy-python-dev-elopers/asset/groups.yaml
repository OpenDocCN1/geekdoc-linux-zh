  - '[PAGE 57]


    toplevel window was the master, and the content frame was its slave. At the inner
    level, the content frame was the master, with each of the other widgets being
    slaves. Notice that the same widget, e.g., the content frame, can be both a master
    and a slave! As we saw previously, this widget hierarchy can be nested much more
    deeply.


    > While each master can be managed by only one geometry manager (e.g. grid), different
    masters can have different geometry managers. While grid is the right choice most
    of the time, others may make sense for a particular layout used in one part of
    your user interface. Other geometry managers include pack, which we''ve mentioned,
    and place, which leaves all layout decisions entirely up to you. Some complex
    widgets like canvas and text let you embed other widgets, making de facto geometry
    managers.


    Finally, we''ve been making the assumption that slave widgets are the immediate
    children of their master in the widget hierarchy. While this is usually the case,
    and mostly there''s no good reason to do it any other way, it''s also possible
    (with some restrictions) to get around this.'
  - "[PAGE 58]\n\n# ## 5.3. Event Handling\n\nTk, as with most other user interface\
    \ toolkits, runs an event loop that receives events from the operating system.\
    \ These are things button presses, keystrokes, mouse movement, window resizing,\
    \ and so on.\n\nGenerally, Tk takes care of managing this event loop for you.\
    \ (did a user click on this button? if a key was pressed, textbox know the focus?),\
    \ and dispatch it accordingly. Individual widgets know how to respond to events;\
    \ for example, a button might change color when the mouse moves over it, and revert\
    \ back when the mouse leaves.\n\n> It's critical in event-driven applications\
    \ that the event loop not be blocked. The event loop should run continuously,\
    \ normally executing dozens of steps per second. At every step, it processes an\
    \ event. If your program is performing a long operation, it can potentially block\
    \ the event loop. In that case, no events would be processed, no drawing would\
    \ be done, and it would appear as if your application is frozen. There are many\
    \ ways to avoid this happening, mostly related to the structure of your application.\
    \ We'll discuss this in more detail in a later chapter.\n\n# ## Event Callbacks\n\
    \nYou often want your program to handle some event in a particular way, e.g.,\
    \ do something when a button is pushed. For those that are most frequently customized\
    \ (what good is a button without something happening when you press it?), the\
    \ widget will allow you to specify a callback as a widget configuration option.\
    \ We saw this in the example with the command option of the button.\n\n```\ndef\
    \ calculate(*args):\n    ...\nntk.Button(mainframe, text=\"Calculate\", command=calculate)\n\
    ```"
  - '[PAGE 59]


    Callbacks in Tk tend to be simpler than in user interface toolkits used with compiled
    languages (where a callback must be a procedure with a certain set of parameters
    or an object method with a certain signature). Instead, the callback is just an
    ordinary bit of code that the interpreter evaluates. While it can be as complicated
    as you want to make it, most of the time, you''ll just want your callback to call
    some procedure.


    # Binding to Events


    For events that don''t have a widget-specific command callback associated with
    them, you can use Tk''s bind to capture any event, and then (like with callbacks)
    execute an arbitrary piece of code.


    Here''s a (silly) example showing a label responding to different events. When
    an event occurs, a description of the event is displayed in the label.


    ```

    from tkinter import *

    from tkinter import ttk

    root = Tk()

    1 = ttk.Label(root, text="Starting...")

    1.grid()

    1.bind(''<Enter>'', lambda e: 1.configure(text=''Moved mouse inside\''))

    1.bind(''<Leave>'', lambda e: 1.configure(text=''Moved mouse outside\''))

    1.bind(''<Button-1>'', lambda e: 1.configure(text=''Clicked left mouse button''))

    1.bind(''<3>'', lambda e: 1.configure(text=''Clicked right button\''))

    1.bind(''<Double-1>'', lambda e: 1.configure(text=''Double clicked\''))

    1.bind(''<B3-Motion>'', lambda e: 1.configure(text=''right button drag to=%d,%d''
    (e.x,e.y)))

    root.mainloop()

    ```


    ![](img/e444c319ec16222f00278651bee8c21d_59_0.png)


    The first two binds are pretty straightforward, just watching for simple events.
    An <Enter> event means the mouse has moved over top the widget, while the <Leave>
    event is generated when the mouse outside the widget to a different one.


