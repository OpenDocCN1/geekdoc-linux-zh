    # # 6.3. Button


    ```

    ttk.Button

    ```


    https://tkdocs.com/man/ttk_button


    A **button**, unlike a frame or label, is very much there to interact with. Users
    press a button to perform an action. Like labels, they can display text or images,
    but accept additional options to change their behavior.


    ![](img/e444c319ec16222f00278651bee8c21d_73_0.png)


    Buttons are created using the **ttk.Button** class:


    ```

    button = ttk.Button(parent, text=''Okay'', command=submitForm)

    ```


    Typically, their contents and command callback are specified at the same time.
    As with other widgets, buttons can take several different configuration options,
    including the standard `style` option, which can alter their appearance and behavior.


    # # Text or Image


    Buttons take the same `text`, `textvariable` (rarely used), `image`, and `compound`
    configuration options as labels. These control whether the button displays text
    and/or an image.'
  - '[PAGE 74]


    Buttons have a default configuration option. If specified as active, this tells
    the button is the default button in the user interface; otherwise it is normal.
    Default buttons are invoked if users hit the Return or Enter key. Some platforms
    and styles will draw this default button with a different border or highlight.
    Note that setting this option doesn''t create an event binding that will make
    the Return or Enter key activate the button; that you have to do yourself.


    # The Command Callback


    The command connects the button''s action and your application. When a user presses
    the button, the script provided by the option is evaluated by the interpreter.


    You can also ask the button to invoke the command callback from your application.
    That way, you don''t need to repeat the command to be invoked several times in
    your program. If you change the command attached to the button, you don''t need
    to change it elsewhere too. Sounds like a useful way to add event binding on our
    default button, doesn''t it?


    ```

    action = ttk.Button(root, text="Action", default="active"

    command=myaction)

    root.bind(''<Return>'', lambda e: action.invoke())

    ```


    > Standard behavior for dialog boxes and many others on most platforms is to setup
    a window for the Return key (<Return> or <Key-Return>) to invoke the active button
    if it exists, as we''ve done here. If there is a "Close" or "Cancel" button, create
    a binding to the Escape key (<Key-Escape>). On macOS, you should additionally
    bind the Enter key on the keyboard (<KP_Enter>) to the active button, and Command-period
    (<Command->) to the close or cancel button.


    # Button State


    Buttons and many widgets start off in a normal state. A button will respond to
    mouse movements, can be pressed, and will invoke its command callback. Buttons
    can also be put into a disabled state,'
- md: '

    where the button is greyed out, does not respond to mouse movements, and cannot
    be pressed. Your program would disable the button when its command is not applicable
    at a given point in time.


    All themed widgets maintain an internal state, represented by a series of binary
    flags. Each flag can either be set (on) or cleared (off). You can set or clear
    these different flags, and check the current setting using the state and instate
    methods. Buttons make use of the disabled flag to control whether or not users
    can press the button. For:


    ```

    b.state([''disabled'']) # set the disabled flag

    b.state([''!disabled'']) # clear the disabled flag

    b.instate([''disabled'']) # true if disabled, else false

    b.instate([''!disabled'']) # true if not disabled, else false

    b.state([''!disabled''], cmd) # execute ''cmd'' if not disabled

    ```


    > Note that these commands accept an array of state flags as their argument.


    The full list of state flags available to themed widgets is: active, disabled,
    focus, pressed, selected, background, readonly, alternate, and invalid. These
    are described in the themed widget reference. While all widgets have the same
    set of state flags, not all states are meaningful for all widgets. It is also
    possible to get fancy in the state and instate methods and specify multiple state
    flags at the same time.


    https://tkdocs.com/man/ttk_widget


    The state and instate methods replace the older state option (which takes the
    values normal or disabled).


    That configuration option is actually available for themed widgets in Tk 8.5,
    but "write-only," which means that changing the option calls the state command.
    It is mainly intended as a convenience so you can specify a widget should be disabled
    when you first create it. However, any changes made using the new state command
    do not update the configuration option. To


    ```

    avoid confusion, you should update your code to use the new state flags for all
    themed widgets.

    ```


    ## 6.4. Checkbutton


    ttk.Checkbutton


    https://tkdocs.com/man/ttk_check_button


    A checkbutton is like a regular button that also holds a binary value of some
    kind (i.e., a toggle). When pressed, a checkbutton flips the toggle and then invokes
    its callback. Checkbutton widgets are frequently used to allow users to turn an
    option on or off.


    | macOS | Windows | Linux |

    | --- | --- | --- |

    | ☐ Frognicate | ☐ Frognicate | ☐ Frognicate |

    | ☑ xtkify | ☑ xtkify | ☑ xtkify |

    | ☐ Decisive. | ☐ Decisive. | ☐ Decisive. |

    | ☑ WSC 1.1 | ☑ WSC 1.1 | ☑ WSC 1.1 |


    Checkbutton widgets.


    Checkbuttons are created using the ttk.Checkbutton class. Typically, their contents
    and behavior are specified at the same time:


    ```

    measureSystem = StringVar()

    check = ttk.Checkbutton(parent, text=''Use Metric'',

    command=metricChanged, variable=measureSystem,

    value=''metric'', offvalue=''imperial'')

    ```


    Checkbuttons use many of the same options as regular buttons but add a few more.
    The text, textvariable, image, and compound configuration options control the
    display of the label (next to the checkbox itself). Similarly, the command option
    lets you to specify a command to be called every time a user toggles the checkbox;
    and the invoke method will also execute the same command. The


    state and instate methods allow you to manipulate the disabled state flag to enable
    or disable the checkbox.


    ## Widget Value


    Unlike regular buttons, checkbuttons also hold a value. We''ve seen before how
    textvariable option can link the label of a widget to a variable in your program.
    The variable option for checkbuttons behaves similarly, except it links a variable
    to current value of the widget. The variable is updated whenever the widget is
    toggled. By default, checkbuttons use a value of 1 when the widget is checked,
    and 0 when not checked. These can be changed to something else using the onvalue
    and offvalue options.


    A checkbutton doesn''t automatically set (or create) the linked variable. Therefore,
    your program needs to initialize it to the appropriate starting value.


    What happens when the linked variable contains neither the onvalue or the offvalue
    (or even doesn''t exist?). In that case, the checkbox is put into a special "tristate"
    or indeterminate mode. When in this mode, the checkbox might display a single
    dash, instead of being empty or holding a checkmark. Internally, the state flag
    alternate is set, which you can inspect via the instate method:


    ```

    check.instate([''alternate''])

    ```


    While we''ve been using an instance of the StringVar class, Tkinter provides other
    variable classes that can hold booleans, integers, or floating-point numbers.
    You can always use a StringVar (because the Tcl API is string-based) but can choose
    one of the others if the data that will be stored in it fits the type. All are
    subclasses of the base class Variable.


    We saw in the feet to meters example that you can call the get method of a Variable
    to retrieve its value or the set method to provide a new value. You can also supply
    an initial value when you instantiate it.


    ```

    s = StringVar(value="abc")      # default value is ''''

    b = BooleanVar(value=True)     # default is False

    i = IntVar(value=10)               # default is 0

    d = DoubleVar(value=10.5)      # default is 0.0

    ```


    ## 6.5 Radiobutton


    ttk.Radiobutton


    https://tkdocs.com/man/ttk_radiobutton


    A radiobutton widget lets you choose between one of several mutually exclusive
    choices. Unlike a checkbutton, they are not limited to just two options. Radiobuttons
    are always used together in a set, where multiple radiobutton widgets are tied
    to a single choice or preference. They are appropriate to use when the number
    of options is relatively small, e.g., 3-5.


    ![](img/e444c319ec16222f00278651bee8c21d_80_0.png)


    Radiobuttons are created using the ttk.Radiobutton class. Typically, you''ll create
    and initialize several of them at:


    ```

    phone = StringVar()

    home = ttk.Radiobutton(parent, text=''Home'', variable=phone,

    value=''home'')

    office = ttk.Radiobutton(parent, text=''Office'',

    variable=phone, value=''office'')

    cell = ttk.Radiobutton(parent, text=''Mobile'', variable=phone,

    value=''cell'')

    ```


    Radiobuttons share most the same configuration options as checkboxes. One exception
    is that the onvalue and offvalue options are replaced with a single value option.
    Each radiobutton in the set will have the same linked variable, but a different
    value.


    When the variable holds the matching value, that radiobutton will visually indicate
    it is selected. If it doesn''t match, the radiobutton will be unselected. If the
    linked variable doesn''t exist, or you don''t specify one with the `variable`
    option, radiobuttons also display as "tristate" or indeterminate. This can be
    checked via the `alternate` state flag.


    ## 6.6. Entry


    ```

    ttk.Entry

    https://tkdocs.com/man/ttk_entry

    ```


    An entry widget presents users with a single line text field where they can type
    in a string value. These can be just about anything: a name, city, a password,
    social security number, etc.


    ![](img/e444c319ec16222f00278651bee8c21d_82_0.png)


    Entries are created using the ttk.Entry class:


    ```

    username = StringVar()

    name = ttk.Entry(parent, textvariable=username)

    ```


    A width configuration option may be specified to provide the number of characters
    wide the entry should be. This allows you, for example, to display a shorter entry
    for zip or postal code.


    ### Entry Contents


    We''ve seen how checkbutton and radiobutton widgets have a value associated with
    them. Entries do as well, and that value is usually accessed through a linked
    variable.


    Unlike the various buttons, entries don''t have a text or image beside them to
    identify them. Use a separate label widget for that.


    You can also get or change the value of the entry widget without going through
    the linked variable. The get method returns the current value, and the delete
    and insert methods let you change the contents, e.g.


    ```

    print(''current value is %s'' % name.get())

    name.delete(0,''end'') # delete between two indices, 0-based

    name.insert(0, ''your name'') # insert new text at a given index

    ```


    ### Watching for Changes


    Entry widgets don''t have a command option to invoke a callback whenever the entry
    is changed. To watch for changes to the linked variable. See also "Validation",
    below.


    ```

    def it_has_been_written(*args):

    ...

    username.trace_add("write", it_has_been_written)

    ```


    You''ll be fine if you stick with simple uses of trace_add like that shown above.
    You might want to know that this is a small part of a much complex system for
    observing variables and invoking callbacks when they are read, written, or deleted.
    You can trigger multiple callbacks, add or delete them (trace_remove), and introspect
    them (trace_info).


    These methods also replace a now-deprecated set of older methods (trace, trace_variable,
    trace_vdelete, and trace_vinfo) that should not be used.


    Tkinter allows you to watch for changes on a StringVar (or any subclass of Variable).
    Both the older and newer tracing tools are

