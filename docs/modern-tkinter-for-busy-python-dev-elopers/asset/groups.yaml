    \ odio |\n\n*文本控件。*\n\n> Tk 的文本控件与画布（canvas）一样，是两个强大的控件之一，提供了极其深层且易于编程的功能。文本控件已成为全文字处理器、大纲编辑器、网页浏览器等程序的基础。我们将在后面的章节中介绍一些高级内容。在这里，我们将展示如何使用文本控件来捕获相当简单的多行文本输入。\n\
    \n文本控件是通过 **Text** 类创建的：\n\n```\nt = Text(parent, width=40, height=10)\n```\n\n\
    **width**（宽度）和 **height**（高度）选项分别指定文本控件请求屏幕尺寸，单位分别为字符和行。文本的内容可以是任意大的。你可以使用 **wrap**\
    \ 配置选项来控制换行的处理方式：可选值包括 **none**（不换行，文本可以水平滚动）、**char**（在任意字符处换行）和 **word**（仅在单词边界处换行）。\n\
    \n可以禁用文本控件以防止进行编辑。由于文本不是主题化控件，因此无法使用通常的状态和实例化方法。相反，请使用 `state` 配置选项，将其设置为 `disabled`（禁用）或\
    \ `normal`（正常）。\n\n```\ntxt['state'] = 'disabled'\n```\n\n滚动机制与列表框（listboxes）相同。`xscrollcommand`\
