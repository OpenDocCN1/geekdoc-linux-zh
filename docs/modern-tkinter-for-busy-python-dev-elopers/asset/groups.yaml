    ```


    If you don''t supply a name, Tkinter will generate one, which you can retrieve
    via font.name or str(font). It''s usually best to supply one.

    The family specifies the font. Tk knows the names Courier, Times, and Helvetica
    are available, though they may be mapped to an appropriate monospaced, serif,
    or sans-serif font. Other fonts installed on your system can be used, but the
    usual caveats about portability apply. You can get the names of all available
