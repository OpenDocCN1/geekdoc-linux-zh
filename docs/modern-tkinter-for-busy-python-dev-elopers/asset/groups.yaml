    This API, which was originally targeted for Tk 8.6, was back-ported to Tk 8.5.9.
    If you''re using an earlier version of Tk getting this info is a bit trickier.


    Switching to a new theme can be done with:


    ```

    s.theme_use(''thetheme'')

    ```


    What does this actually do? Obviously, it sets the current theme to the indicated
    theme. Doing this, therefore, replaces all the currently available styles with
    the set of styles defined by the theme. Finally, it refreshes all widgets, so
    that they take on the appearance described by the new theme.


    # Third-Party Themes


    With a bit of looking around, you can find some add-on themes available for download.
    A good starting point is https://wiki.tcl.org/page/List+of+tk+Themes.


    Though themes can be defined in any language that Tk supports, most that you will
    find written in Tcl. How can you install them so that they are available to use
    in your application?


    As an example, let''s use the "awkward" theme, available from https://sourceforge.net/projects/tcl-awhemes/.
    Download and unzip awhemes*.zip file somewhere. You''ll notice it contains a bunch
    of .tcl files, a subdirectory containing many images used by the theme, etc. One
    of the files is named pkgIndex.tcl. This identifies it as a Tcl package, which
    is similar to a module. If you look inside, you''ll see a bunch of lines like
    needed. Here, awkward is the name of the package, and 7.7 is its version number.
    For a single pkgIndex.tcl file to provide several packages, to use it, we need
    to tell Tcl where to find the package (adding its directory to Tcl''s auto_path)
    and the name of the package to use.


    ```

    tk::append autopath ''/path/to/awhemes''

    tk::require ''awkward''

    ```


    If the theme is instead implemented as a single Tcl source file, without pkgIndex.tcl,
    you can make it available like this:


    ```

    tk::source ''/path/to/theme.tcl''

    ```


    You should now be able to use the theme in your own application, just as you would
    any built-in themes.


    ## 17.2. Using Styles


    We''ll now tackle the more difficult issue of how to take full advantage of styles
    and themes within your application, not just skinning it with an existing theme.


    ### Definitions


    We first need to introduce a few concepts.


    ### Widget Class


    A *widget class* identifies the type of particular widget, whether it is a button,
    label, canvas, etc. All themed widgets have a default class. Buttons have the
    class `TButton`, labels `TLabel`, etc.


    ### Widget State


    A *widget state* allows a single widget to have more than one appearance or behavior,
    depending on things like mouse position, different options set by the application,
    and so on. As you recall, all themed widgets maintain a set of state flags, accessed
    by the `state` and `instance` methods. The flags are: `active, disabled, focus,
    pressed, selected, background, alternate, and invalid`. All widgets have the same
    set of state flags, though they may ignore some of them (e.g., a label widget
    would likely ignore the `invalid` state). See the `themed widget` page in the
    reference manual for the exact meaning of each state flag.


    - https://tkdocs.com/man/ttk_widget


    ### Style


    A *style* describes the appearance (or appearances) of a widget class. All themed
    widgets having the same widget class will have the same appearance(s). Styles
    are referred to by the name of the widget class they describe. For example, the
    style TButton defines the appearance of all widgets with the class TButton. Styles
    know about different states, and one style can define different appearances based
    on a widget''s state. For example, a style can specify a widget''s appearance
    should change if the pressed state flag is set.


    ### Theme


    Using a particular theme in an application means that, by default, the appearance
    of each widget will be controlled by the style within that theme responsible for
    that class.


    ### Style Names


    Every style has a name. If you''re going to modify a style, create a new one,
    or use a style for a widget, you need to know its name. How do you know what names
    of the styles are? If you have a particular widget, and you want to know what
    style is currently used, you can first check the value of its style configuration
    option. If that is empty, the widget is using the default style for the widget.
    You can retrieve that via the widget''s class. For example:


    ```

    >>> b = ttk.Button()

    >>> b[''style'']

    ''''

    >>> b.winfo_class()

    ''TButton''

    ```


    In this case, the style that is being used is TButton. The default styles for
    other themed widgets are named similarly, e.g., TEntry, TLabel, etc. It''s always
    wise to check the specifics. For example, the treeview widget''s class is Treeview,
    not ttk.


    Beyond the default styles, styles can be named pretty much anything. You might
    create your own style (or use a theme that has a style) named FunButton, NuclearReactorButton,
    or even GuessWhatIAM (not a smart choice). More often, you''ll find names like
    Fun.TButton or NuclearReactor.TButton, which suggest variations of a base style;
    as you''ll see, this is something Tk supports for creating and modifying styles.


    The ability to retrieve a list of all available styles is currently not supported.
    This will likely appear in Tk 8.7 in the form of a new command, `ttk::style theme
    styles` to return the list of styles implemented by a theme. It also proposes
    adding a style for all widgets, so you don''t have to examine the widget''s style
    configuration option and its class. TIP #584 (https://tip.tcl.tk/584).


    # Applying a Style


    Use a style to apply that style to an individual widget. If you know the name
    of the style you want to use, and which widget to apply it to, it''s easy. Setting
    the style can be done at creation time:


    ```

    b = ttk.Button(parent, text=''Hello'', style=''Fun.TButton'')

    ```


    As well, a widget''s style can be changed at any time with the style configuration
    option:


    ```

    b[''style''] = ''Emergency.TButton''

    ```


    # Creating a Simple Style


    So do we create a new style like Emergency.TButton? In situations like this, prepending
    another name (Emergency) followed by a dot onto an existing style creates a new
    style derived from the one. The new style will have exactly the same options as
    the one except for the indicated differences:


    ```

    s.configure(''Emergency.TButton'', font=''Helvetica 24'', foreground=''red'',
    padding=10)

    ```


    You could then apply that style to an individual button using its style configuration
    option, as shown earlier. Every other button would retain its normal appearance.


    How do you know what options are available for a given style? That requires diving
    a little deeper inside styles.


    ![](img/e444c319ec1622f00278651bee8c21d_251_0.png)


    You may have used existing code using the classic widgets that you''d like to
    move to themed widgets. Most appearance made to widgets through configuration
    options can probably be dropped. For those that can''t, you may need to create
    a new style. State-specific changes can be treated similarly. In Classic Tk, widgets
    supported a few state changes via configuration options. For example, setting
    a button''s state option to disabled would draw it with a greyed-out label. Some
    allowed an additional state, active, which represented a different appearance.
    You could control the appearance of the widget in different states via additional
    configuration options, e.g., foreground, disabledforeground, and activeforeground.


    State changes via configuration options should be changed to use the state method
    on themed widgets. Configuration options to modify the appearance of a widget
    in a particular state should be dealt with in style.

