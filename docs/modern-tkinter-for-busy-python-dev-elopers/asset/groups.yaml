    \n# 11. Windows and Dialogs\n\nEverything we've done up until now has been in\
    \ a single window. In this chapter, we'll cover how to use multiple windows, changing\
    \ various attributes of windows, and use some of the standard dialog boxes that\
    \ are available in Tk.\n\n## 11.1. Creating and Destroying Windows\n\nWe've seen\
    \ that all Tk programs start out with a root-level window, and then widgets are\
    \ created as children of that root window. Creating new top-level windows works\
    \ almost exactly the same as creating new widgets.\n\nToplevel windows are created\
    \ using the `Toplevel` class:\n\n```python\nt = Toplevel(parent)\n```\n\nNote:\
    \ Toplevels are part of the classic Tk widgets, not the themed widgets.\nUnlike\
    \ regular widgets, we don't have to `grid` a top-level for it to appear onscreen.\
    \ Once we've created a new top-level, we can create other widgets as children\
    \ of that top-level, and `grid` them inside the top-level. The new top-level behaves\
    \ exactly like the automatically created root window.\n\nTo destroy a window,\
    \ use `destroy` method:\n\n```python\nwindow.destroy()\n```\n\nNote that you can\
    \ use `destroy` on any widget, not just a tovel window. When you destroy a window,\
    \ all windows (widgets) that are children of that window are also destroyed. Be\
    \ careful! If you destroy the root window (that all other widgets are descended\
    \ from), that will terminate your application.\n\n> In a typical document-oriented\
    \ application, we want to be able to close any windows while leaving the others\
    \ open. In that case, we may want to create a new top-level for every window,\
    \ and not put anything directly inside the root window at all. While we can't\
    \ destroy the root window, we can remove it entirely from the screen using its\
    \ `withdraw` method, which we'll see shortly.\n\n## 11.2. Window Behavior and\
    \ Styles\n\nThere are lots of things about how windows behave and how they look\
    \ that can be changed.\n\n### Window Title\n\nTo examine or change the title of\
    \ the window:\n\n```python\noldtitle = window.title()\nwindow.title('New title')\n\
    ```\n\n### Size and Location\n\nIn Tk, a window's position and size on the screen\
    \ are known as its `geometry`. A full geometry specification looks like this:\
    \ `widthheight`.\n\nWidth and height (usually in pixels) are pretty self-explanatory.\
    \ Similarly, `x` (horizontal position) is specified with a leading plus or minus,\
    \ so `+25` means the left edge of the window should be 25 pixels from the left\
    \ edge of the screen, while `-50` means the right edge of the window should be\
    \ 50 pixels from the right edge of the screen. Similarly, a `y` (vertical) position\
    \ of `+10` means the top edge of the window should be ten pixels below the top\
    \ of the screen, while `-100` means the bottom edge of the window should be 100\
    \ pixels above the bottom of the screen.\n\n> Geometry specifies the actual coordinates\
    \ on the screen. It doesn't make allowances for systems like macOS with a menubar\
    \ along the top or a dock along the bottom. By specifying a position of `+0` would\
    \ actually place the part of the window under the system menu bar. It's a good\
    \ idea to leave a healthy margin (at least 30 pixels) from the screen's edge.\n\
    \nScreen positions can be different than you might expect when you have multiple\
    \ monitors on your system. We'll cover that shortly.\n\nHere is an example of\
    \ changing the size and position. It places the window towards the top right-hand\
    \ corner of the screen:\n\n```python\nwindow.geometry('300x200-5+40')\n```\n\n\
    You can retrieve the current geometry the same way; just provide a new geometry\
    \ value. However, if you try it immediately after changing the geometry, you'll\
    \ find it doesn't match. Remember that all drawing effectively occurs in the background,\
    \ in response to idle times via the event loop. Until drawing occurs, the internal\
    \ geometry of the window won't be updated. If you do want to force things to update\
    \ immediately, you can.\n\n```python\nwindow.update_idletasks()\nprint(window.geometry())\n\
    ```\n\n> We've seen that the window defaults to the size requested by the widgets\
    \ that are gridded into it. If we're creating and adding new widgets interactively\
    \ in the interpreter, or our program adds new widgets in other events, the window\
    \ size adjusts. This behavior continues until we explicitly define the window's\
    \ geometry as above or a user resizes the window. At that point, even if we add\
    \ more widgets, the window won't change size. You'll want to be sure you're using\
    \ all of grid's features (e.g., sticky, weight) to make everything fit nicely.\n\
    \n# Resizing Behavior\n\nBy default, top-level windows, including the root window,\
    \ can be resized by users. However, sometimes you may want to prevent users from\
    \ resizing. You can do this via the resizable method. The first parameter controls\
    \ whether users can change the width, and the second the height.\n\n```python\n\
    window.resizable(FALSE,FALSE)\n```\n\nIf a window is resizable, you can specify\
    \ a minimum and maximum size that you'd like the window constrained:\n\n```python\n\
    window.minsize(200,100)\nwindow.maxsize(500,500)\n```\n\nWondering how large it\
    \ would be if you didn't specify? You can obtain the actual (not requested) size\
    \ via `winfo` methods. For more, see the `winfo` command.\nhttps://tkdocs.com/man/winfo\n\
    \n# Intercepting the Close Button\n\nMost windows have a close button in their\
    \ title bar. By default, Tk will destroy the window if users click on that button.\
    \ You can, however, provide a callback that will be run instead. A common use\
    \ is to prompt the user to save an open file if modifications have been made.\n\
    \n```python\nwindow.protocol(\"WM_DELETE_WINDOW\", callback)\n```\n\n> The somewhat\
    \ obscure-named `WM_DELETE_PROTOCOL` originated with X11 window manager protocols.\n\
    \n# Transparency\n\nWindows can be made partially transparent by specifying an\
