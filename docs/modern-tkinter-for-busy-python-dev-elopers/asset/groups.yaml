    An entry widget presents users with a single line text field where they can type
    in a string value. These can be just about anything: a name, city, a password,
    social security number, etc.


    ![](img/e444c319ec16222f00278651bee8c21d_82_0.png)


    Entries are created using the ttk.Entry class:


    ```

    username = StringVar()

    name = ttk.Entry(parent, textvariable=username)

    ```


    A width configuration option may be specified to provide the number of characters
    wide the entry should be. This allows you, for example, to display a shorter entry
    for a zip or postal code.


    # Entry Contents


    We''ve seen how checkbutton and radiobutton widgets have a value associated with
    them. Entries do as well, and that value is usually accessed through a linked
    variable specified by the textvariable configuration option.'
