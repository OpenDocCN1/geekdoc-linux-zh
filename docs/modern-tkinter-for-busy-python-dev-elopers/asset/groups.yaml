    \nNotice how on the macOS screenshot, without the highlight, the status bar at\
    \ the bottom of the window blends into the text widget. Not good."
  - '[PAGE 276]


    As you''ll see looking at other applications, the border around the text widget
    is no longer a common convention. So let''s start by removing that, which is as
    easy as adding highlightthickness="0" when we create the text widget.


    That still leaves us with the problem of the status bar blending into the editor.
    We changed the status bar to be a ttk.Frame widget, which has a background shading
    on all platforms. We also placed a ttk.Separator widget just above the status
    bar, to give us clean separation.


    Each of the line and column indicators were labels, previously created with:


    ```

    label = Label(self, bd=1, relief=SUNKEN, anchor=W)

    ```


    This was replaced with a ttk.Label, to ensure it matched the frame. We also did
    away with the 1990''s sunken "3d" look.


    ```

    label = ttk.Label(self)

    ```


    But not least, we can replace the original Tk scrollbar with the newer ttk.Scrollbar
    widget.


    The resulting changes to the main window are shown below. Despite these being
    fairly minor, subtle changes, they go a long way towards IDLE''s main window looking
    a lot cleaner, more modern, and "just fitting in" on all platforms.


    ![](img/e444c319ec16222f00278651bee8c21d_276_0.png)


    IDLE''s main window, with improvements (macOS).'
  - '[PAGE 277]


    ![](img/e444c319ec16222f00278651bee8c21d_277_0.png)


    ![](img/e444c319ec16222f00278651bee8c21d_277_1.png)'
  - '[PAGE 278]


    # 18.4. Preferences Dialog


    One visible piece that greatly needed improvement was the Preferences dialog.
    Again, here are screenshots on the three platforms:


    ![](img/e444c319ec16222f00278651bee8c21d_278_0.png)


    IDLE''s Preferences window (macOS).'
  - '[PAGE 279]


    ![](img/e444c319ec16222f00278651bee8c21d_279_0.png)


    IDLE''s Preferences window (Windows).'
  - '[PAGE 280]


    ![](img/e444c319ec16222f00278651bee8c21d_280_0.png)


    The other tabs allow you to modify individual colors for syntax highlighting,
    keystrokes assigned to particular operations, and a few other miscellaneous things.


    While there was some debate as the need for this level of configuration on what
    was primarily a learning environment, it seemed reasonable to at least make what
    there looked like and work better considering any more radical surgery; see [bugs.python.org/issue24810].


    Among other things, the Preferences dialog was changed from modal (which, amusingly
    enough, didn''t quite work on macOS, to headless, allowing multiple copies to
    be created) though I won''t go further into that at this point; see [bugs.python.org/issue24760].'
  - '[PAGE 281]


    # Tabs


    The first issue to address the panes was the tabs used to switch between the four
    different preference panes. The original used a custom "megawidget", as classic
    Tk doesn''t have its own widget. While the Windows and Linux ones don''t look
    too bad, on recent versions of macOS, there is a built-in tab widget that looks
    quite different.


    > It''s actually more common in macOS applications now to use something similar
    to a toolbar (row of icons with labels along the top or side) to switch between
    preference panes, though some programs still use tabs. Tabs are very common on
    Windows and Linux.


    The code was modified to use the ttk.Notebook widget, which not only looks better
    on each platform but allows us to jettison a lot of code for managing tabs ourselves.


    # Updating Widgets


    The next obvious step was upgrading the "classic" widgets to their themed counterparts.
    On this screen, which included the buttons, labels, frames, checkbox, scrollbar,
    etc. There were a few others on some of the other panes. Generally, this was a
    straightforward process, often involving removing widget options that were no
    longer needed or supported by the themed widgets.


    Sometimes choosing a different widget made more sense. In this screen, the option
    menu used for font size was better replaced by a combobox. Similarly, the scale
    widget is not commonly seen in today''s user interfaces and was replaced with
    the more familiar (and compact) spinbox widget.


    There were also non-standard ways of using certain widgets or specifying types
    of data. These were generally modified to use more familiar paradigms. There were
    a number of general issues discussed relating to the design of these dialogs,
    see, e.g., [bugs.python.org/issue24776], and [bugs.python.org/issue24782].


    # Layout'
  - '[PAGE 282]


    While this dialog is a bad example, just given the space imbalance between the
    left and right halves, a lot of time was spent in general looking at widget spacing
    and alignment in dialog boxes.


    The general approach was to find similar examples in other applications and use
    those as a guide. Where are the buttons located? How are multiple fields of a
    dialog organized? Where are labels relative to the widget they''re labeling? Are
    they left- or right-aligned, capitalized, do they have a trailing colon? These
    are the sorts of questions to think about.


    > A great starting point is converting from using the old pack geometry manager
    to grid. Because of the way it works, pack-based layouts tend to have weird and
    inconsistent alignment and spacing, especially if they''ve modified over time.
    Using grid will increase maintainability, both because it uses a more familiar
    mental model and because it''s not dependent on the order in which widgets are
    inserted.


    It''s likely impossible to come up with one layout that looks fantastic on all
    platforms, but often you can come up with one (possibly with a couple platform-specific
    tweaks in the code) that looks decent.


    A revised version of the dialog, incorporating many of the techniques here, is
    shown below.'
- md: '

    IDLE Preferences, revised version (Windows).


    IDLE Preferences, revised version (Linux).


    # Another Example


    The screenshot below shows a before and after of the IDLE Preferences pane, which
    controls syntax coloring; see [bugs.python.org/issue/24781].


    Again, substituting widgets and using more familiar conventions is one piece of
    this. I think the bigger changes have to do with thinking about things from the
    users'' perspective. Particularly as a beginner tool, if you''re in here at all,
    it''s probably to switch themes, not tweak colors, which is more prominent in
    the new version. It also does away with an arbitrary distinction between "built-in"
    and "custom" themes.


    I think the new version is a big improvement, though as of this writing I have
    yet to convince some people of this. This being open source, we''ll see what happens!


    # 18.5. Other Dialogs


    There are multiple other dialog boxes in IDLE; we''ll consider a couple more examples
    here.


    ## Find Dialog


    One of the find/search dialogs is shown below, again with before and after on
    the three platforms; see [bugs.python.org/issue23218].


    IDLE Find dialog, before and after (Windows)


    IDLE Find dialog, before and after (Linux)


    The first step was upgrading the widgets to use the equivalent themed widgets.
    The effect of this is most obvious with the buttons (being consistent with the
    capitalization doesn''t hurt either).


    Speaking of buttons, notice that in the new version, the buttons are on the right
    on Windows (where they were all before), but at the bottom for macOS and Linux.
    On examining multiple different applications, our target users would likely have
    encountered on each platform, we found these locations were common. With only
    a few lines of extra code needed to special case for this layout difference, it
    made sense to handle things of this way.


    Other aspects of the original dialogs (especially how the buttons don''t quite
    line up with other widgets), I originally thought it was created with pack, and
    expected to convert it to grid. Interestingly, it was already using grid. Why
    then the unaligned widgets, a hallmark of pack-based layouts?


    This turned out to be a result of using nested frames. For example, the buttons
    were placed into their own frame, and then that placed into the rest of the window.
    Because of that, the individual buttons couldn''t be aligned with widgets in the
    rest of the user interface.


    Nested frames were required when using pack, but often with grid it is better
    to avoid them except in exceptional circumstances. That allows you to make different
    parts of the user interface line up (at the expense of dealing with a lot of colspan/rowspan
    tweaking).


    A more substantial reorganization would likely have removed the nested frames,
    but particularly with adjusting the buttons, this simple layout could be made
    with just a few tweaks.


    > You''ll notice a lot of older Tkinter user interfaces have the problem here
    their contents running to the edge of the windows, which often doesn''t look right.
    I''ve gotten into the habit of placing a ttk.Frame directly inside each tooplevel,
    with some additional padding, and then placing the rest of the user interface
    inside that.


    Like Preferences, the Find dialogs were also modal, which meant we had to dismiss
    them before doing any editing of your file, though at least they did remember
    previous settings when we reopened them. These were eventually changed to be regular
    modelless windows.


    # About Dialog


    Speaking of modal dialogs, the About box was also originally modal. Not only that,
    getting more information (e.g., the IDLE README file) resulted in launching another
    modal dialog, which needed to be dismissed to go back to the first modal dialog,
    which needed... etc.


    # IDLE


    Python''s Integrated Development Environment


    email: idle-dev@python.org


    | Python version | Tk version |

    | :--- | :--- |

    | 3.4 | 8.5.1 |

    | License | Credits |


    # About - Readme


    IDLE is Python''s Integrated Development Environment. IDLE emphasizes a lightweight,
    clean design with a simple interface. Although it is suitable for beginners, even
    advanced users will find IDLE has everything they need to develop pure Python
    code. IDLE features a multi-window editor with multiple undo, Python colorizing,
    and many other capabilities, e.g. smart indent, call tips, and autocompletion.
    The editor has comprehensive search functions, including searching through multiple
    files. Class browsers and path browsers provide fast access to code objects from
    a top level viewpoint dealing with code folding. There is a Python Shell which
    features colorizing and command recall.


    Making the dialog non-modal was the first priority. Second, the nested dialogs
    were eliminated using a progressive disclosure technique. The dialog when launched
    is fairly sparse but contains one of the documentation files, with an option to
    switch to any of the others.


    One thing you can do to convey that the link is clickable is to change the cursor
    when the mouse is over it (via the ''cursor'' option found on many widgets). On
    macOS, choose the platform-specific ''pointinghand'' cursor, on Windows and Linux
    choose the ''hand2'' cursor, which actually gets mapped to something more appropriate
    on those platforms.

    '
  mdcn: '


    IDLE 偏好，修订版本（Windows）。


    IDLE 偏好，修订版本（Linux）。


    # 另一个示例


    下面的截图显示了 IDLE 偏好面板修改前后的，该面板控制语法着色；参见 [bugs.python.org/issue/24781]。


    再次，替换组件并使用更熟悉的约定是其中的一项工作。我认为更大的变化与从用户的角度来考虑问题有关。特别是作为一个面向初学者的工具，如果你进入了这里，很可能是为了切换主题，而不是调整颜色（后者在旧版本中更为突出）。它还消除了“内置”主题和“自定义”主题之间这种随意的区别。


    我认为新版本是一个巨大的改进，尽管在写下这些文字时，我尚未说服某些人接受这一点。既然是开源的，让我们拭目后续的发展吧！


    # 18.5. 其他对话框


    IDLE 中还有多个其他对话框；我们在这里再考虑几个例子。


    ## 查找对话框


    下面显示了查找/搜索对话框之一，同样展示了三个平台上的修改前后对比；参见 [bugs.python.org/issue23218]。


    IDLE 查找对话框，修改前后（Windows）


    IDLE 查找对话框，修改前后（Linux）


    第一步是升级组件以使用等效的主题组件。这种效果在按钮上最为明显（保持大小写一致也没有什么坏处）。


    说到按钮，请注意在新版本中，按钮在 Windows 上位于右侧（之前它们都在右侧），但在 macOS 和 Linux 上位于底部。通过检查目标用户在每个平台上都可能遇到的多个不同应用程序，我们发现这些位置是通用的。仅需几行额外代码来针对这种布局差异进行特例处理，因此以这种方式处理是有意义的。


    关于原始对话框的其他方面（特别是按钮并未与其他组件完全对齐），我原本认为它们是使用 `pack` 创建的，并原打算将其转换为 `grid`。有趣的是，它已经在使用
    `grid` 了。那么为什么会出现组件未对齐的情况——这种 `pack` 布局的典型特征？


    事实证明这是使用嵌套框架（frames）的结果。例如，按钮被放置在它们自己的框架中，然后将该框架放在窗口的其余部分。由于由于，单个按钮无法与用户界面其余部分的组件对齐。


    在使用 `pack` 时需要嵌套框架，但在使用 `grid` 时，通常最好避免它们，除非特殊情况。这允许你让用户界面的不同部分对齐（代价是处理大量的 `colspan`/`rowspan`
    调整）。


    更实质性的重组可能会移除嵌套框架，但对于调整按钮来说，只需少量微调即可实现这种简单的布局。


    > 你会注意到许多旧的 Tkinter 用户界面存在这样一个问题：内容一直运行到窗口边缘，这通常看起来不对。我已经养成了一个习惯，在每个 `topoplevel`
    中直接放置一个 `ttk.Frame` 并带有一些额外的内边距，然后将用户界面的其余放在其中。


    和偏好设置一样，查找对话框也是模态的（modal），这意味着在编辑你的文件之前我们必须关闭它们，尽管至少在我们重新打开它们时，它们会记住之前的设置。这些对话框最终被改为普通的非模态（modeless）窗口。


    # 关于对话框


    说到模态对话框，“关于”框起初也是模态的。不仅如此，获取更多信息（例如 IDLE README 文件）会启动另一个模态对话框，需要先关闭它才能回到第一个模态对话框，而它又需要……以此类推。


    # IDLE


    Python 的集成开发环境


    | Python 版本 | Tk 版本 |

    | :--- | :--- |

    | 3.4 | 8.5.1 |

    | 许可证 | 致谢 |


    # 关于 - Readme


    IDLE 是 Python 的集成开发环境。IDLE 强调轻量级、简洁的设计和简单的界面。尽管它适合初，即使是高级用户也会发现 IDLE 拥有他们开发纯 Python
    代码所需的一切功能。IDLE 具有多窗口编辑器，支持多次撤销、Python 着色以及许多其他功能，例如：智能缩进、调用提示和自动补全。编辑器具有全面的搜索功能，包括跨文件搜索。类浏览器和路径浏览器可以从顶层视角快速访问代码对象，并处理代码折叠。还有一个
    Python Shell，具有着色和命令回溯功能。


    将对话框改为非模态是首要任务。其次，使用渐进式显示技术（progressive disclosure）消除了嵌套对话框。对话框启动时非常空旷，但包含一个文档文件，并提供切换到其他任何文件的选项。


    你可以用来传达链接可点击的一个方法是当鼠标悬停在其上时更改光标（通过许多组件上找到的 ''cursor'' 选项）。在 macOS 上，选择特定平台的 ''pointinghand''
    光标；在 Windows 和 Linux 上，选择 ''hand2'' 光标，这在这些平台上实际上会被映射到更合适的值。


    '
