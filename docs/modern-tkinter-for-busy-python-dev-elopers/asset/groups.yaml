- md: "\nAt the same time, like the rest of Python, there was [reference documentation](#),\
    \ created as \"structured text\" which can then be formatted using a tool called\
    \ Sphinx into HTML, text, etc.\n\nThe documentation of IDLE's help dialog was\
    \ based on a separate, but similar plain text file. Keeping the two in sync was\
    \ a problem. They were separate; Sphinx's text rendering didn't look anything\
    \ that good, and all the extra navigation, etc. in the HTML rendering wouldn't\
    \ be needed for online help, and then there's the hassle of opening a web browser,\
    \ etc.; see [bugs.python.org/issue16893](#).\n\nTk's widget is smart enough to\
    \ handle the very basic formatting in IDLE's documentation, and Python includes\
    \ an HTML parser in its standard library. Putting the two together made displaying\
    \ a simplified version of the HTML reference documentation easy.\n\n![](img/e444c319ec16222f00278651bee8c21d_293_0.png)\n\
    \n## 1. Menus\n\nIDLE has two main window types, the Shell window and the Editor\
    \ window. It is possible to have multiple editor windows simultaneously. Output\
    \ windows, such as used for Edit / Find in Files, are a subtype of edit window.\
    \ They quickly have the same menu as Editor windows but a different online help\
    \ using widget (macOS).\n\n> It's easy to get carried away here. Back in the mid-1990s,\
    \ a tiny HTML [parser in Tcl](#) spawned a slew of \"web browser in a text widget\"\
    \ adventures, first in Tcl and then in other languages, e.g., Python's Grail.\n\
    \nTrying to keep up with everything that large teams of developers are putting\
    \ into real web browsers is a fool's errand. Yet, for very limited and constrained\
