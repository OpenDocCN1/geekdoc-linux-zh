    \ the widget is displayed or hidden (all its ancestors in the hierarchy must be\
    \ viewable for it to be viewable)\n```\n\n# 5.2. Geometry Management\n\nIf you've\
    \ been running code interactively, you've probably noticed that by creating widgets,\
    \ they didn't appear onscreen. Placing widgets onscreen, and precisely *where*\
    \ they are placed, is a separate step called *geometry management*.\n\nIn our\
    \ example, positioning each widget was accomplished by the `grid` command. We\
    \ specified the column and row we wanted each widget to go in, how things were\
    \ to be aligned within the grid, etc. Grid is an example of a *geometry manager*\
    \ (of which there are several in Tk, grid being the most useful). For now, we'll\
    \ look at geometry management in general; we'll talk about grid in a later chapter.\n\
    \nA geometry manager's job is to figure out exactly where widgets are going to\
    \ be put. This turns out to be a complex optimization problem, and a good geometry\
    \ manager relies on quite sophisticated algorithms. A good geometry manager provides\
    \ the flexibility, power, and ease of use that makes programmers happy. It also\
    \ makes it easy to create good user interface layouts without needing to jump\
    \ through hoops. Tk's `grid` is, without a doubt, one of the absolute best. A\
    \ poor geometry manager... well, all the Java programmers who have suffered through\
    \ `GridBagLayout` please raise their hands.\n\n> We'll go into more detail in\
    \ a later chapter, but `grid` was introduced years after Tk became popular. Before\
    \ that, an older geometry manager named `pack` was most commonly used. It's very\
    \ powerful, but is much harder to use, and extremely difficult to create layouts\
    \ that look appealing today. Unfortunately, much of the example Tk code and documentation\
    \ out there uses `pack` instead of `grid` (a good clue to how current it is).\
    \ The widespread use of `pack` is one major reason that so many Tk interfaces\
    \ look terrible. Start new code with `grid`, and upgrade old code when you can.\n\
    \n# The Problem\n\nThe problem for a geometry manager is to take all the different\
    \ widgets the program creates, plus the program's instructions for where in the\
    \ window each should go (explicitly, or more often, relative to other widgets),\
    \ and then actually position them in the window.\n\nIn doing so, the geometry\
    \ manager has to balance multiple constraints. Consider these situations:\n\n\
    - The widgets may have a natural size, e.g., the natural width of a label would\
    \ depend on the text it displays and the font used to display it. What if the\
    \ application window containing all these different widgets isn't big enough to\
    \ accommodate them? The geometry manager must decide which widgets to shrink to,\
    \ by how much, etc.\n- If the application window is bigger than the natural size\
    \ of all the widgets, how is the extra space used? Is space placed between each\
    \ widget, and if so, how is that space distributed? Is it used to make widgets\
    \ larger than they want to be, such as a text entry growing to fill a wider window?\
    \ Which widgets would grow?\n- If the application window is resized, how does\
    \ the size and position of each widget inside it change? Will certain areas (e.g.,\
    \ a text area) expand or shrink while other parts stay the same size, or is the\
    \ area distributed differently? Do certain widgets have a minimum size that you\
    \ want to avoid going below? A maximum size? Does the window itself have a minimum\
    \ or maximum size?\n- How can widgets in different parts of the user interface\
    \ be aligned with each other? How much space should be left between them? This\
    \ is needed to present a clean layout and comply with platform-specific guidelines.\n\
    - For a complex user interface, which may have many frames nested in other frames\
    \ (etc.), how can all the above be accomplished?\n\n# How it Works\n\nGeometry\
    \ management in Tk relies on the concept of master and slave. A master is a widget,\
    \ typically a tolevel window or a frame, which contains other widgets, called\
    \ slaves. You can think of a geometry manager controlling the master and deciding\
    \ how the slave widgets will be displayed. The computing community has embraced\
    \ more general societal trends toward diversity, sensitivity, and awareness about\
    \ language. Recognizing this, the Tk core will slowly be adopting a more inclusive\
    \ set of terminology. For example, where it makes sense, \"parent\" and \"child\"\
