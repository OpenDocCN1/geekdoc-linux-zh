    In many applications, you''ll want the canvas to be larger than what appears on
    the screen. You can attach horizontal and vertical scrollbars to the canvas in
    the usual way, via the xview and yview methods.


    You can specify both how large you''d like it to be on screen and its full size
    (which would require scrolling to see). The width and height configuration options
    for the canvas widget will request the given amount of space from the geometry
    manager. The scrollregion configuration option tells Tk how large the canvas surface
    is by specifying its left, top, right, and bottom coordinates, e.g., 0 0 1000.


    You should be able to modify the sketchpad program to add scrolling, given what
    you already know. Give it a try.


    Once you''ve done that, scroll the canvas down a little bit, and then drawing.
    You''ll see that the line''re drawing appears above where the mouse is pointing!
    Surprised?


    What''s going on is that the global bind command doesn''t know that the canvas
    is scrolled (it doesn''t know the details of any particular widget). So if you''ve
    scrolled the canvas down by 50 pixels, and you click on the top left corner, bind
    will report that you clicked at (0,0). But we know that because of the scrolling,
    the position should really be (0,50).


    The canvas and canvas methods translate the position into the actual point on
    the canvas (taking into account scrolling).


    > Be careful if you''re adding canvas and canvas methods directly to the event
    binding scripts. You need to watch the quoting and substitutions to ensure the
    conversions are done when the event fires. As always, it''s better to place that
    code in a procedure separate from the event itself.'
