    +   ://tkdocs.com/man/colors


    In general, Tk widgets default to the right colors for most situations. If you''d
    like to change colors, you''ll do so widget-specific commands or options, e.g.,
    the label''s [foreground]() [background]() configuration options. For most themed
    widgets, color changes are specified through styles, not by the widget directly.


    You can specify colors by RGB, as you would in HTML or CSS, e.g. #FF01A. Tk also
    recognizes names such as red, black, grey50, light blue, etc.


    Tk recognizes the standard names for colors defined by X11. You can find a complete
    list in the command reference (noted above).


    As with fonts, both macOS and Windows specify many system-specific abstract color
    names (again, see the reference). The actual color these correspond to may depend
    on system settings and can change over time, e.g., dark mode, text highlight colors,
    default backgrounds.


    If needed, you can find the RGB values (between 0 and 65535) for a color using
    the [winfo_rgb]() method on any widget.


    ```

    root.winfo_rgb(''red'')

    ```


    > It should probably go without saying, but restraint in the use of colors is
