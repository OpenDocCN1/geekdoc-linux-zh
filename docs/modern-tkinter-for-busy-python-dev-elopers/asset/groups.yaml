    # ## 13.3. Images


    We''ve seen the basics of how to use images already, displaying them in labels
    or buttons, for example We create an image object, usually from a file on disk.


    ```

    imgobj = PhotoImage(file=''myimage.gif'')

    label[''image''] = imgobj

    ```


    Out of the box, Tk 8 includes support for GIF and PPM/PNM images. Tk 8.6 added
    PNG to this short list. However, there is a Tk extension library Img, which adds
    support for many others: BMP, XBM, XPM, JPEG, PNG (if you''re using 8.5), TIFF,
    etc. Though not directly in the Tk core, Img is usually included with other packaged
    distributions (e.g., ActiveTk).


    Instead of using Tk''s extension, Tkinter uses a made-for-Python image library
    PIL (Python Imaging Library). More specifically, we''ll use a more up-to-date
    fork of PIL Pillow. As it doesn''t bundled with Python, you''ll normally need
    to install it. You should be able to do so by, e.g., `pip install Pillow`.


    ```

    from PIL import ImageTk, Image

    myimg = ImageTk.PhotoImage(Image.open(''myimage.png''))

    ```


    The ImageTk.PhotoImage provides a drop-in replacement for Tk''s PhotoImage which
    supports the broader range of images.


    Tk''s images are actually quite powerful and sophisticated and a wide variety
    of ways to inspect and modify images. You can find out more from the [image command
    reference](https://tkdocs.com/man/image) and the [photo command reference](https://tkdocs.com/man/photo).


