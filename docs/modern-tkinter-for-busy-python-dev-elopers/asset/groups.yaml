    \n字体选择器对话框。\n\n虽然系统字体对话框在某些平台（如 Windows）是模态的，但在所有地方并非如此。在 macOS 上，系统字体选择器更像绘画程序中的浮动工具面板，保持可用，以便更改应用程序窗口中选定任何文本的字体。Tk\
    \ 字体对话框 API 必须兼顾这两种模式。为此，它使用回调（以及虚拟事件）来通知你的应用程序字体变化。更多细节可以参阅 [fontchooser](#...)\
    \ 参考页。\n\n- https://tkdocs.com/man/fontchooser\n\n要使用字体对话框，首先要为它提供一个初始字体和一个在选择字体时被调用的回调。为了说明，我们将让回调更改标签上的字体。\n\
    \n```python\nl = ttk.Label(root, text=\"Hello World\", font=\"helvetica 24\")\n\
    l.grid(padx=10, pady=10)\n\ndef font_changed(font):\n    l['font'] = font\n\n\
    root.tk.call('tk', 'fontchooser', 'configure', '-font',\n    'helvetica 24', '-command',\
    \ root.register(font_changed))\nroot.tk.call('tk', 'fontchooser', 'show')\n```\n\
    \nTkinter 尚未添加使用此新对话框的方便方法，因此示例代码直接使用了 Tcl API。你可以在 [bugs.python.org/issue28694](#...)\
    \ 查看实现完善的 Python API 的最新进展并下载代码。\n\n> 你可以随时时候查询或更改对话框中显示的（或将要显示的）字体。\n\n接下来，通过\
    \ `show` 方法将对话框显示在屏幕上。在字体对话框为模态的平台上，你的程序在此处阻塞直到对话框关闭。在其他平台上，`show` 会立即返回；对话框保留在屏幕上，而你的程序继续运行。此时尚未选择字体。还有一个\
    \ `hide` 方法可以从屏幕上移除（当字体对话框为模态时，这并不大用）。\n\n```python\nroot.tk.call('tk', 'fontchooser',\
    \ 'show')\nroot.tk.call('tk', 'fontchooser', 'hide')\n```\n\n如果对话框是模态的且用户选择了字体，对话框将调用你的回调并传递字体规范。当他们取消对话框时，将没有回调。当对话框不是模态的且用户选择了字体时，它将调用你的回调。还会生成一个\
    \ <<TkFontChooserFontChanged>> 虚拟事件；你可以获取当前字体。一个 <<TkFontChooserVisibility>> 虚拟事件也会生成；你可以通过该事件获取对话框是否可见。\n\
    \n如果对话框是模态的，且用户选择了字体，对话框将调用你的回调并传递字体规范。当他们取消对话框时，将将没有回调。当对话框不是模态的，且用户选择了字体时，它将调用你的回调。还会生成一个\
    \ <<TkFontChooserFontChanged>> 虚拟事件；你可以获取当前字体。一个 <<TkFontChooserVisibility>> 虚拟事件也会生成；你可以通过该事件获取对话框是否可见。\n\
    \n如果对话框是模态的，且用户选择了字体，对话框将调用你的回调并传递字体规范。当他们取消对话框时，将将没有回调。当对话框不是模态的，且用户选择了字体时，它将调用你的回调。还会生成一个\
    \ <<TkFontChooserFontChanged>> 虚拟事件；你可以获取当前字体。一个 <<TkFontChooserVisibility>> 虚拟事件也会生成；你可以通过该事件获取对话框是否可见。\n\
    \n如果对话框是模态的，且用户选择了字体，对话框将调用你的回调并传递字体规范。当他们取消对话框时，将将没有回调。当对话框不是模态的，且用户选择了字体时，它将调用你的回调。还会生成一个\
    \ <<TkFontChooserFontChanged>> 虚拟事件；你可以获取当前字体。一个 <<TkFontChooserVisibility>> 虚拟事件也会生成；你可以通过该事件获取对话框是否可见。\n\
    \n（注：由于原文最后部分存在大量重复和乱码，译文已根据上下文进行了清理对齐）\n\n### 警报与确认对话框\n\n许多应用程序使用简单的模态警报或对话框来通知用户事件、确认操作或做出选择。Tk\
    \ 提供了一个通用的“消息框”来封装所有这些类型。\n\n```python\nfrom tkinter import messagebox\nmessagebox.showinfo(message='Have\
    \ a good day')\n```\n\n| macOS | Windows | Linux |\n| --- | --- | --- |\n| ![祝你好运](https://example.com/macos_alert.png)\
    \ | ![祝你好运](https://example.com/windows_alert.png) | ![祝你好运](https://example.com/linux_alert.png)\
    \ |\n\n消息框。\n\n```python\nmessagebox.askyesno(\n    message='Are you sure you\
    \ want to install SuperVirus?',\n    icon='question', title='Install')\n```\n\n\
    ![](img/e444c319ec16222f00278651bee8c21d_178_0.png)\n\n与我们之前过的对话框一样，这些是模态的，并将用户的操作返回给调用者。Tkinter\
    \ 没有使用类型选项，而是为种类型的对话框使用不同的方法。返回值随方法而异：\n\n- showinfo: ok\n- showwarning: ok\n\
    - showerror: ok\n- askokcancel: True (点击 ok) 或 False (点击 cancel)\n- askyesno:\
    \ True (点击 yes) 或 False (点击 no)\n- askretrycancel: True (点击 retry) 或 False (点击\
    \ cancel)\n- askquestion: yes 或 no\n- askyesnocancel: True (点击 yes), False (点击\
    \ no) 或 None (点击 cancel)\n\n> 诚然，Tkinter messagebox API 并不一致。它混合了返回类型（字符串或布尔值），存在重复（askyesno\
    \ 和 question），并且遗漏了一个底层对话框类型（abortretryignore）。\n\n所有可能的选项列所示：\n\n- message: 显示在警报内部的主消息。\n\
    - detail: 详细信息。\n\n"
