    # 9.3. Asynchronous I/O


    Timer events take care of breaking up a long-running computation, where you know
    that each step can be guaranteed to complete quickly so that your handler return
    to the event loop. What if you have an operation that may not complete quickly?
    This can happen when you make a variety of calls to the operating system. The
    most common is when we''re doing some kind of I/O, writing a file, communicating
    with a database, or retrieving data from a remote web server.


    Most I/O calls are blocking. They don''t return until the operation completes
    (or fails). What we want to use instead are non-blocking or asynchronous I/O calls.
    When you make an asynchronous I/O call, it returns immediately, before the operation
    is completed. Your code can continue running, or in this case, return back to
    the event loop. Later, when the I/O operation completes, your program is notified
    and can process the result of the I/O operation.


    If sounds like treating I/O as another type of event, you''re exactly right. In
    fact, it''s also called event-driven I/O.


    In Python, asynchronous I/O is provided through the asyncio module, as well as
    many other modules that are layered on top of it.


    All asyncio applications rely heavily on an event loop. How convenient


    My recommendation: keep Tkinter in the main thread, and spin off your asyncio
    event loops in another thread.


    Your application code, running in the main thread, may need to coordinate with
    the asyncio event loop running in the other thread. You can call a function running
    in the asyncio event loop thread (even from the Tkinter loop, e.g., in a widget
    callback) using the `call_soon_threadsafe` method. To call Tkinter from the asyncio
    event loop, keep reading.'
  - '[PAGE 138]


    # 9.4. Threads or Processes


    Sometimes it''s either not possible or practical to break up a long-running computation
    into discrete pieces that can run quite quickly. You may be using a library that
    doesn''t support asynchronous operations. Or, like Python''s asyncio, it doesn''t
    play nice with Tk''s event loop. In cases like these, to keep your Tk GUI responsive,
    you''ll need to move those time-consuming operations or library calls out of your
    event handlers and run them somewhere else. Threads, or other processes, can help
    with that.


    Running tasks in threads, communicating with them, etc. is beyond the scope of
    this book. However, there are some restrictions on using Tk with threads that
    you should be aware of. The main rule is that you must only make Tk calls from
    the thread where you loaded Tk.


    Tkinter goes to great lengths internally so you make Tkinter calls from multiple
    threads. It routes them to the main thread (the one created the Tk instance).
    It works well, but not always. Despite all it tries to do, I highly recommend
    you make all Tkinter calls from a single thread.


    If you need to communicate from another thread to the running Tkinter, keep it
    as simple as possible. Use event_generate to post a virtual event to the Tkinter
    event queue, and then bind to that event in your code.


    It can be even more complicated. The Tcl/Tk libraries can be built either or without
    thread support. If you have more than one thread in your application, make sure
    you''re running in a threaded build. If you''re unsure, check the Tk variable
    tcl_platform(threaded); it should be 1, not 0.


    ```

    >>> tkinter.Tk().eval(''set tcl_platform(threaded)'')

    ```


    > Everyone should be running threaded builds. The ability to create non-threaded
    builds in Tcl/Tk is likely to go away in future. If you''re using a non-threaded
    build with threaded code, consider this a bug in your application, not a challenge
    to make it work.'
  - '[PAGE 139]


    # 9.5. Nested Event Processing


    The previous three approaches are the correct ways to handle long-running operations
    while still keeping your Tk GUI responsive. What they have in common is a single
    event loop that continuously processes events of all kinds. That event loop will
    call event handlers in your application code, which do their thing and quickly
    return.


    There is one other way. Within your long-running operation, you can invoke the
    event loop to process a bunch of events. You can do this with a single command,
    update. There''s no messing around with timer events or asynchronous I/O. Instead,
    you just sprinkle some update throughout your operation. If you want to only keep
    the screen redrawing but not process other events, there''s even an option for
    that update_idletasks.


    This approach is deceptively easy. And if you''re lucky, it might work. At least
    for a while. But sooner or later, you''re going to run into serious difficulties
    trying to do things that way. Something won''t be updating, event handlers aren''t
    getting called that should be, events are going missing or being fired out of
    order, or worse. You''ll turn your program''s logic inside out and tear your hair
    trying to make it again.


    ![](img/e444c319ec16222f00278651bee8c21d_139_0.png)


    When you use update, you''re not returning control back to the running event loop.
    You''re effectively starting a new event loop nested within the existing one.
    Remember, the event loop follows a single thread of execution: no threads, no
    coroutines. If you''re not careful, you''re going to end up with event loops called
    from event loops called from... well, you get the idea. Even if you realize you''re
    doing this, unwinding the event loop (each of may have different conditions to
    terminate it) will be an interesting exercise. The reality won''t match with your
    mental model of a simple event loop dispatching events one at a time, independent
    of every other event. It''s a classic example of fighting against Tk''s model.
    In very specific circumstances, it''s possible to make it work. In practice, you''re
    asking trouble. Don''t say you haven''t been warned...'
