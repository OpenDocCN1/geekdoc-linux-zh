    # Selecting Fonts


    Tk 8.6 added support for another system dialog: a font chooser. While the file
    dialogs and color chooser were modal dialogs, that block until the dialog is dismissed
    and then return a result, the font chooser does not work like that.


    > As the font chooser isn''t available in Tk 8.5, if your code needs to support
    older versions, you''ll need to take that into account.


    ![](img/e444c319ec16222f00278651bee8c21d_174_1.png)


    Font chooser dialogs.'
  - "[PAGE 175]\n\nWhile the system font dialog is modal on some platforms, e.g.,\
    \ Windows, that's not the case everywhere. On macOS, the system font chooser works\
    \ more like a floating tool palette in a drawing program, remaining available\
    \ to change the font for whatever text is selected in your application window.\
    \ The Tk font dialog API has to accommodate both modes. To do so, it uses callbacks\
    \ (and virtual events) to notify your application of font changes. Additional\
    \ details can be found in the [fontchooser](#...) reference pages.\n\n+   https://tkdocs.com/man/fontchooser\n\
    \nTo use the font dialog, first provide it with an initial font and a callback\
    \ which will be invoked when a font is chosen. For illustration, we'll have the\
    \ callback change the font on the label.\n\n```\nl = ttk.Label(root, text=\"Hello\
    \ World\", font=\"helvetica 24\")\nl.grid(padx=10, pady=10)\n\ndef font_changed(font):\n\
    \    l['font'] = font\n\nroot.tk.call('tk', 'fontchooser', 'configure', '-font',\n\
    \    'helvetica 24', '-command', root.register(font_changed))\nroot.tk.call('tk',\
    \ 'fontchooser', 'show')\n```\n\nTkinter has not yet added a convenient way to\
    \ use this new dialog, so this example code uses the Tcl API directly. You can\
    \ see the latest work towards a proper Python API and download code at [bugs.python.org/issue28694](#...).\n\
    \n> You can query or change the font that is (or will be) displayed in the dialog\
    \ at any time.\n\nNext, put the dialog onscreen via the `show` method. On platforms\
    \ where the font dialog is modal, your program will block at this point until\
    \ the dialog is dismissed. On other platforms, `show` returns immediately; the\
    \ dialog remains onscreen while your program continues. At this point, a font\
    \ has not been chosen. There's also a `hide` method to remove it from the screen\
    \ (not terribly useful when the font dialog is modal)."
  - '[PAGE 176]


    ```

    root.tk.call(''tk'', ''fontchooser'', ''show'')

    root.tk.call(''tk'', ''fontchooser'', ''hide'')

    ```


    If the dialog was modal, and the user chose a font, the dialog would have invoked
    your callback, passing it a font specification. When they cancelled out of the
    dialog, there''d be no callback. When the dialog isn''t modal, and the user chooses
    a font, it will invoke your callback. A <<TkFontChooserFontChanged>> virtual event
    is also generated; you can retrieve the current font via the dialog''s font configuration
    option. If the font dialog is closed, a <<TkFontChooserVisibility>> virtual event
    is generated. You can also find out if the font dialog is currently visible onscreen
    using the visible configuration option (though changing it is an error; use the
    show and hide methods instead).


    Because of the significant differences between them, providing a good user experience
    on all platforms takes a bit of work. On platforms where the dialog is modal,
    it''s likely to be invoked from a button or menu item that says, e.g., Font...
    On other platforms, the button or menu item should toggle between Show Fonts and
    Hide Fonts.


    If you have several widgets in your application that can be different fonts, when
    one of them gains focus, it should update the font chooser with its current font.
    This also means that a callback from the font dialog may apply to a different
    text widget than the one you initially called from! Finally, be aware that the
    font chooser itself may gain the keyboard focus on some platforms.


    As Tk 8.6.10, there are a few bugs in the font chooser on various platforms. Here''s
    a quick rundown including workarounds:


    +   - macOS, if you don''t provide a font via the font configuration option, your
    callbacks won''t be invoked ⇒ provides an initial font

    - X11, if you don''t provide values for all configuration options, those you don''t
    include will be reset to their default values ⇒ whenever you change any option,
    change all of them, if it''s just to their current value

    - X11, the font dialog includes an Apply button when you provide a callback, but
    omits it when you don''t (and just watch for virtual events); however, other bugs
    mean these virtual events are never generated ⇒ always provide a command callback'
  - "[PAGE 177]\n\n+   • on Windows, you can also leave off the Apply button by not\
    \ providing a callback; while virtual events are generated on font changes, the\
    \ font configuration option is never updated ⇒ always provide a command callback,\
    \ and hold onto the font yourself, rather than trying to ask the font dialog for\
    \ it later\n\n+   • on Windows, a font virtual event is not generated if you change\
    \ the font configuration option in your code, though it is on macOS and X11 ⇒\
    \ take any necessary actions when you change the font in your code rather than\
    \ in a virtual event handler\n\nBecause of the differences between platforms and\
    \ the various bugs, testing is far more important when using the font chooser\
    \ than the other system dialogs.\n\n# Alert and Confirmation Dialogs\n\nMany applications\
    \ use various simple modal alerts or dialogs to notify users of an event, ask\
