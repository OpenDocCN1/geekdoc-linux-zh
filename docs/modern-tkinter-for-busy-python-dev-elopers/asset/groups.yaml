    ## State


    You can disable a menu item that users cannot select it. This can be done via
    the state option, setting it to the value disabled. Use a value of `normal` to
    re-enable the item.


    Menus should always reflect the current state of your application. If a menu item
    is not presently relevant (e.g., the "Copy" item is only applicable if something
    in your application is selected), you should disable it. When your application
    state changes so that the item is applicable, make sure to enable it.


    ```python

    menu_file.entryconfigure(''Close'', state=DISABLED)

    ```


    Sometimes you may have menu items whose name changes in response to application
    state changes, rather than the menu item being disabled. For example, a web browser
    might have a menu item that changes between "Show Bookmarks" and "Hide Bookmarks"
    as a bookmarks pane is hidden or displayed.


    ```python

