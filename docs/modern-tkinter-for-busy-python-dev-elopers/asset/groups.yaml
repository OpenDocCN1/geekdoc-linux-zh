- md: "\nA secondary message (if needed).\n\ntitle:\n\nTitle for the dialog window.\
    \ Not used on macOS.\n\nicon:\n\nIcon, one of info (default), error, question\
    \ or warning.\n\ndefault:\n\nDefault button, e.g. ok or cancel for a okcancel\
    \ dialog.\n\nparent:\n\nWindow of your application dialog is being posted.\n\n\
    Additional details can be found in the reference manual.\n\n+   https://tkdocs.com/man/messageBox\n\
    \n> These new messagebox replaces the older tk_dialog command, which does not\
    \ comply with current platform user interface conventions.\n\n# Rolling Your Own\n\
    \nIf you need to create your own modal dialogs, there are a few things you'll\
    \ need to take care of. We've covered most of them earlier in the chapter, e.g.\
    \ setting up window styles, positioning the window, etc.\n\nFirst, you need to\
    \ ensure that users can only interact with your dialog. You can use grab set to\
    \ do this.\n\nIf you want your dialog function to block your application (i.e.,\
    \ the call to create the dialog shouldn't return until the dialog is dismissed),\
    \ this is also possible. There's no reason you need to do this, as you can respond\
    \ to callbacks, event bindings, etc. while running the normal event loop, destroy\
    \ the dialog and move on.\n\nThis somewhat cryptic example includes the main steps\
    \ needed to create a modal dialog.\n\n```\nttk.Entry(root).grid() # something\
    \ to interact with\ndef dismiss():\n    dlg.grab_release()\n    dlg.destroy()\n\
    \ndlg = Toplevel(root)\nttk.Button(dlg, text=\"Done\", command=dismiss).grid()\n\
    dlg.protocol(\"WM_DELETE_WINDOW\", dismiss) # intercept close button\n```\n\n\
    ```\ndlg.transient(root)      # dialog window is related to main\ndlg.wait_visibility()\
    \           # can't grab until window appears, so we\n    wait\ndlg.grab_set()\
    \                # ensure all input goes to our window\ndlg.wait_window()    \
    \           # block until window is destroyed\n```\n\nhttps://tkdocs.com/code/dialog.py\n\
    \n> Application code blocking like this is an example of running a nested event\
    \ loop that we generally recommend against, though it may be more convenient in\
    \ certain circumstances.\n\nTkinter's standard library includes a simpledialog\
    \ module that helps with building your own dialogs. Because it uses the classic\
    \ Tk widgets rather than the newer themed widgets, we don't recommend using it\
    \ directly. However, it does illustrate how to use some of the techniques for\
    \ making dialogs behave that we just covered.\n\n# 12. Organizing Complex Interfaces\n\
    \nIf you have a complex user interface, you'll need to find ways to organize it\
    \ that don't overwhelm your users. There are several different approaches to doing\
    \ this. Both general-purpose and platform-specific human interface guidelines\
    \ are good resources when designing your user interface.\n\nWhen we talk about\
    \ complexity in this chapter, we don't mean the underlying techical complexity\
    \ of how the program is implemented. Instead, we mean how it's presented to users.\
    \ A user interface can be pulled together from many different modules, built from\
    \ hundreds of widgets combined in a deeply nested hierarchy, but that doesn't\
    \ mean users need to perceive it as complex.\n\n## Multiple windows\n\nOne benefit\
    \ of using multiple windows in an application can be to simplify the user interface.\
    \ Done well, it can require users to focus only on the contents of one window\
    \ at a time to complete a task. Forcing them to focus on or switch between several\
    \ windows also have the opposite effect. Similarly, showing only the widgets relevant\
    \ to the current task (i.e. via `grid`) can help simplify the user interface.\n\
    \n## White space\n\nIf you need to display a large number of widgets onscreen\
    \ at the same time, think about how to organize them visually. We've seen how\
    \ `grid` makes it easy to align widgets with each other. White space is another\
    \ useful aid. Place related widgets close to each other (possibly with an explanatory\
    \ label immediately above) and separate them from other widgets by white space.\
    \ This helps users organize the user interface in their own minds.\n\n> \U0001F4A1\
    \ The recommended amount of white space around different widgets, between groups\
    \ of widgets, around borders, etc. is highly platform-specific. While you can\
    \ do an adequate job without worrying about exact pixel numbers, if you want a\
    \ highly polished user interface, you'll need to tune this for each platform.\n\
    \n## 12.1. Separator\n\n-   ttk.Separator\n- https://tkdocs.com/man/ttk_separator\n\
    \nA second approach to grouping widgets in one display is to place a thin horizontal\
    \ or vertical rule between groups of widgets; often, this can be more space-efficient\
    \ than using white space, which may be relevant for a tight display. Tk provides\
    \ a simple separator widget for this purpose.\n\nSeparators are created using\
    \ the ttk.Separator class.\n\n```\ns = ttk.Separator(parent, orient=HORIZONTAL)\n\
    ```\n\nThe orient option may be specified as either horizontal or vertical.\n\n\
    ## 12.2. Label Frames\n\n`ttk.Labelframe`\nhttps://tkdocs.com/man/ttk_labelframe\n\
    \nA **labelframe** widget, also commonly known as a **group box**, provides another\
    \ way to group related components. It acts like a normal `ttk::frame`, in that\
    \ it contains other widgets that you `grid` inside it. However, it is visually\
    \ set off the rest of the user interface. You can optionally provide a text label\
    \ to be displayed outside the labelframe.\n\nLabelframes are created using the\
    \ `ttk.Labelframe` class:\n\n```\nlf = ttk.Labelframe(parent, text='Label')\n\
    ```\n\n## 12.3. Paned Windows\n\nttk.Panedwindow\nhttps://tkdocs.com/man/ttk_panedwindow\n\
    \nA panedwindow widget lets you stack two or more resizable widgets above and\
    \ below each other (or to the left and right). Users can adjust the relative heights\
    \ (or widths) of each pane by dragging a sash located between them. Typically\
    \ the widgets you're adding to a panedwindow will be frames containing many other\
    \ widgets.\n\nPanedwindows are created using the ttk.Panedwindow class:\n\n```\n\
    p = ttk.Panedwindow(parent, orient=VERTICAL)\n# two panes, each of which would\
    \ get widgets gridded into it:\nf1 = ttk.Labelframe(p, text='Pane1', width=100,\
    \ height=100)\nf2 = ttk.Labelframe(p, text='Pane2', height=100\n```\n\nA panedwindow\
    \ is either vertical (its panes are stacked on top of each other) or horizontal.\
    \ Importantly, each pane you add to the panedwindow must be a direct child of\
    \ the panedwindow.\n\nCalling the `add` method adds a new pane at the end of the\
    \ list of panes. The `insert position subwindow` method allows you to place the\
    \ pane at the given position in the list of panes (0..n-1). If the pane is already\
    \ managed by the panedwindow, it will be moved to the new position.\n\nYou can\
    \ assign relative weights to each pane so that if the panedwindow resizes, certain\
    \ panes will be allocated more space than others. As well, you can adjust the\
    \ position of each sash between items in the panedwindow. See the [command reference](https://tkdocs.com/man/ttk_panedwindow)\
    \ for details.\n\nhttps://tkdocs.com/man/ttk_separator\n\n## 12.4. Notebook\n\n\
    ```\nttk.Notebook\nhttps://tkdocs.com/man/ttk_notebook\n```\n\nA notebook widget\
    \ uses the metaphor of a tabbed notebook to let users switch between one of several\
    \ pages, using an index tab. Unlike with normed windows, users only see a single\
    \ page (akin to a pane) at a time.\n\n| macOS | Windows | Linux |\n|---|---|---|\n\
    | One Two Three | | Notebook widgets.|\n\nNotebooks are created using the ttk.Notebook\
    \ class:\n\n```\nn = ttk.Notebook(parent)\nf1 = ttk.Frame(n)   # first page, which\
    \ would get widgets\ngridded into it\nf2 = ttk.Frame(n)   # second page\nn.add(f1,\
    \ text='One')\nn.add(f2, text='Two')\n```\n\nThe operations on tabbed notebooks\
    \ are similar to those on pannedwindows. Each page is typically a frame and again\
    \ must be a direct child (subwindow) of the notebook itself. The `add subwindow\
    \ option value=? method adds a new page after the last tab. The text tab option\
    \ sets the label on the tab; also useful is the state tab option, which can have\
    \ the value normal, disabled (not selectable), or hidden.\n"
  mdcn: "\n\n次要消息（如果需要）。\n\ntitle:\n\n对话框的标题。在 macOS 上不使用。\n\nicon:\n\n图标，可选 info（信息，默认）、error（错误）、question（提问）或\
    \ warning（警告）之一。\n\ndefault:\n\n默认按钮，例如 okcancel 对话框中的 ok 或 cancel。\n\nparent:\n\
    \n正在发布的你的应用程序对话框的窗口。\n\n可以在参考手册中找到更多细节。\n\n+   [messageBox 参考](https://tkdocs.com/man/messageBox)\n\
    \n> 这些新的消息框取代了旧的 tk_dialog 命令，该命令不符合当前的平台用户界面规范。\n\n# 自定义对话框 (Rolling Your Own)\n\
    \n如果你需要创建自己的模态对话框，有几点需要你注意。我们在章节早早时候已经涵盖了大部分内容，例如设置窗口样式、定位窗口等。\n\n首先，你需要确保用户只能与你的对话框交互。你可以使用\
    \ `grab set` 来实现这一点。\n\n如果你希望你的对话框函数能够阻塞你的应用程序（即创建对话框的调用在对话框关闭之前不应返回），这也是可以的。你并没有必要这样做，因为你可以在运行普通事件循环的同时响应回调、事件绑定等，销毁对话框并继续。\n\
    \n这个有些晦涩的示例包含了创建模态对话框所需的步骤步骤。\n\n```\nttk.Entry(root).grid() # 用于用于交互的组件\ndef\
    \ dismiss():\n    dlg.grab_release()\n    dlg.destroy()\n\ndlg = Toplevel(root)\n\
    ttk.Button(dlg, text=\"Done\", command=dismiss).grid()\ndlg.protocol(\"WM_DELETE_WINDOW\"\
    , dismiss) # 拦截关闭按钮\n```\n\n```\ndlg.transient(root)      # 对话框窗口与主窗口关联\ndlg.wait_visibility()\
    \           # 在窗口出现之前无法 grab，所以\n    wait\ndlg.grab_set()                # 确保所有输入都进入我们的窗口\n\
    dlg.wait_window()               # 阻塞直到窗口被销毁\n```\n\n[dialog.py](https://tkdocs.com/code/dialog.py)\n\
    \n> 这种应用程序代码阻塞是运行嵌套事件循环的示例，我们通常不建议这样做，尽管在某些情况下可能会更方便。\n\nTkinter 的标准库包含一个 `simpledialog`\
    \ 模块，帮助你构建自己的对话框。因为它使用的是经典的 Tk 控件而不是新的主题控件（themed widgets），我们不建议直接使用它。然而，它确实说明了如何使用我们刚刚涵盖的一些让对话框行为变化的技巧。\n\
    \n# 12. 组织复杂界面\n\n如果你有一个复杂的用户界面，你需要找到一种不会让用户感到不知所措的组织方式。有几种不同的方法。在设计用户界面时，通用和特定平台的人机界面都是很好的资源。\n\
    \n当我们在本章讨论复杂性时，我们指的不是程序实现的底层技术复杂度。相反，我们指的是它呈现给用户的方式。用户界面可以从许多不同的模块组合在一起，由深度嵌套层级结构中的数百个控件组合构建，但这并不意味着用户需要将其感知为复杂的。\n\
    \n## 多窗口\n\n在应用程序中使用多个窗口的益处之一是可以简化用户界面。如果做得好，它可以要求用户一次只关注一个窗口的内容来完成任务。强迫他们关注几个窗口或在几个窗口之间切换也会产生相反的效果。同样，只显示与当前任务相关的控件（例如通过\
    \ `grid`）可以帮助简化用户界面。\n\n## 留白\n\n如果你需要在屏幕上同时显示大量控件，请考虑如何在视觉上组织它们。我们已经看到 `grid`\
    \ 如何轻松让控件相互对齐。留白是另一个有用的辅助。将相关的控件放置在一起（可能在紧邻上方有一个解释性标签），并用留白与其他控件隔开。这有助于用户在自己的脑海中组织用户界面。\n\
    \n> \U0001F4A1 在不同控件周围、控件组之间、边界周围等地方建议的留白取决于特定的平台。虽然你可以在不担心精确像素值的情况下完成胜任的工作，但如果你想要一个高度精细的用户界面，你需要为每个平台对其进行调整。\n\
    \n## 12.1. 分隔符 (Separator)\n\n-   ttk.Separator\n-   [ttk_separator 参考](https://tkdocs.com/man/ttk_separator)\n\
    \n在同一个显示中将控件分组的第二种方法是在控件组之间放置一条细的水平线或垂直线；通常，这比使用留白更节省空间，这对于紧凑的显示可能非常有用。Tk 提供了一个简单的分隔符控件用于此目的。\n\
    \n使用 `ttk.Separator` 类创建分隔符。\n\n```\ns = ttk.Separator(parent, orient=HORIZONTAL)\n\
    ```\n\n`orient` 选项可以指定水平（horizontal）或垂直（vertical）。\n\n## 12.2. 标签框架 (Label Frames)\n\
    \n`ttk.Labelframe`\n[ttk_labelframe 参考](https://tkdocs.com/man/ttk_labelframe)\n\
    \n**标签框架 (labelframe)** 控件也称为**组框 (group box)**，提供了分组组件的另一种方法。它的作用类似于普通的 `ttk::frame`，因为它包含了你在内部\
    \ `grid` 的其他控件。然而，它在视觉上与其他用户界面部分隔离开。你可以可选地提供一个文本标签显示在标签框架外部。\n\n使用 `ttk.Labelframe`\
    \ 类创建标签框架：\n\n```\nlf = ttk.Labelframe(parent, text='Label')\n```\n\n## 12.3.\
    \ 分栏窗口 (Paned Windows)\n\nttk.Panedwindow\n[ttk_panedwindow 参考](https://tkdocs.com/man/ttk_panedwindow)\n\
    \n`panedwindow` 控件允许你堆叠两个或多个控件，在上下或左右。用户可以通过拖动它们之间的滑块（sash）来调整相对高度或宽度。分栏窗口通常是包含许多控件的框架。\n\
    \n使用 `ttk.Panedwindow` 类创建分栏窗口：\n\n```\np = ttk.Panedwindow(parent, orient=VERTICAL)\n\
    # 两个面板，每个内部 grid 了控件：\nf1 = ttk.Labelframe(p, text='Pane1', width=100, height=100)\n\
    f2 = ttk.Labelframe(p, text='Pane2', height=100)\n```\n\n分栏窗口可以是垂直（面板堆叠）或水平的。重要的是，添加到分栏窗口的每个面板必须是其直接子窗口。\n\
    \n调用 `add` 方法会在列表末尾添加新面板。`insert` 方法允许将面板放置在列表的指定位置（0..n-1）。如果面板已被分栏窗口管理，它将移动到新位置。\n\
    \n你可以为每个面板分配相对权重，这样当分栏窗口调整大小时，某些面板将获得更多空间。同样，你可以调整分栏窗口项之间滑块的位置。详情请参见[命令参考](https://tkdocs.com/man/ttk_panedwindow)。\n\
    \nhttps://tkdocs.com/man/ttk_separator\n\n## 12.4. 笔记本 (Notebook)\n\n```\nttk.Notebook\n\
    [ttk_notebook 参考](https://tkdocs.com/man/ttk_notebook)\n```\n\n笔记本控件使用标签页笔记本的隐喻让用户通过索引标签切换到多个页面之一。与普通窗口不同，用户一次只看到一个页面（类似于面板）。\n\
    \n| macOS | Windows | Linux |\n|---|---|---|\n| One Two Three | | 笔记本控件|\n\n使用\
    \ `ttk.Notebook` 类创建笔记本：\n\n```\nn = ttk.Notebook(parent)\nf1 = ttk.Frame(n) \
    \  # 第一页，其内部 grid 了控件\nf2 = ttk.Frame(n)   # 第二页\nn.add(f1, text='One')\nn.add(f2,\
    \ text='Two')\n```\n\n对标签页笔记本的操作与分栏窗口类似。每个页面通常是一个框架，并且再次必须是笔记本本身的直接子窗口（subwindow）。`add`\
    \ 方法在最后一个标签之后添加新页面。`text` 标签选项设置标签上的文字；同样有用的是 `state` 选项，其值可以是 normal（正常）、disabled（禁用/不可选择）或\
    \ hidden（隐藏）。\n\n"
