    ## 1. 引言


    本书将帮助你快速上手，并使用 Python 3 和 Tkinter 构建主流的桌面图形用户界面。如你所知，Tkinter 是 Python 对名为 Tk 的
    GUI 库的接口。它最初是为 Tcl 语言开发的，但被其他动态语言广泛采用，包括 Ruby、Perl，当然还有 Python。


    本书将教你掌握你已经知道的一或两个关键点，即 Tkinter 和 Tk，特别是 Tk 8.5 和 8.6。Tk 8.5 是一个里程碑式的发布版本。它标志着与大多数人熟悉并喜爱的旧版本
    Tk 有了重大区别。


    缺点是，除非是重大的发布，否则实际上，它看起来什么都没有改变。由于向后兼容性，除非现有程序进行一些简单的更改，否则它们看起来不会有任何不同。（想象一下，如果你刚搬进一个古老且奇特的历史建筑，你也会希望有人指给你他们把灯开关和电源插隐藏在哪里，对吧？）


    如果你是 Tk 的初学者或正在创建一个新程序，本书将确保你以正确的方式开始。如果你以前用过 Tk，它将帮助你将知识更新到最新状态。如果你正在更新几年前编写的代码，你将逐步看到如何将其带入现代时代。这虽然是个老生谈调，但我无法相信我在写这本书期间学到了多少，我已经使用
    Tk 多二十年了。


    遗憾的是，Tk 文档的总体（除了以 Tcl 为导向的参考文档，那个非常优秀）在今天并不处于高水平。这对于从非 Tcl 语言使用 Tk 的开发者，以及在多个平台上工作的开发者来说尤为如此。因此，本书将尽可能针对三个主要平台（Windows、macOS
    和 Linux）的开发者。


    它并不是一份参考指南。它不会涵盖所有内容，只涵盖你在 95% 应用中所需的内核内容。其余可以在参考文档中找到。


    ## 1.1. 本书的读者群


    本书专为在 Tk 中构建工具和应用的开发者设计。它还关注相当主流的图形用户界面，带有按钮、列表、复选框、富文本编辑、2D 图形等。因此，如果你正试图修改 Tk
    的内部 C 代码，或者构建下一个大 3D 沉浸式游戏界面，那么这些材料可能不适合你。


    本书也不教你 Python，所以你应该已经有了基础掌握。本书专门使用 Python 3，不涵盖在 Python 2 中使用 Tkinter。同样，你应该对它有基本的了解。


    ## 1.2. 为什么选择 Tkinter?


    如果你是构建桌面用户界面的初学者，为什么要用 Tkinter？毕竟，有很多选择，包括 PyQt、PySide、WxPython、PySimpleGUI 和
    Kivy。每种都有其优缺点。


    人们选择 Tkinter 有几个原因。它是 Python 的默认 GUI 工具包，唯一包含在标准库中的。它是跨平台的，因此相同的代码可以在 Windows、macOS
    或 Linux 上运行。最重要的是，它易于学习和使用。它非常 Pythonic；感觉很自然。在许多情况下编写桌面应用仍然很有意义，无论是开源项目、公司内部工具，还是快速搭建前端。这些都是
    Tkinter 优异之处。


    ## 1.3. 现代最佳实践


    本书关于如何使用 Tk 提供的现代工具构建现代用户界面。这关乎实现此点所需的最佳实践。


    对于大多数工具来说，你可能不会认为这一点。但对于 Tk 来说，情况并非如此。Tk 经历了非常长的演变，而任何演变都会留下一些陈旧代码。再加上图形界面平台和标准在此期间的进化。你可以看到保持像
    GUI 库这样复杂的系统性（且向后兼容）是具有挑战性的。


    # Tk 扩展


    在现代最佳实践方面，Tk 扩展特别值得提。多年来，开发者为 Tk 创建了各种扩展，例如，添加了核心库中不具备（或至少在当时不具备）的新组件。一些知名且非常流行的
    Tk 扩展包括 BLT、Tix、iWidgets、BWidgets；还有非常多其他的。


    许多扩展是几十年前创建的。由于核心 Tk 一直保持高度的向后兼容，


    '
