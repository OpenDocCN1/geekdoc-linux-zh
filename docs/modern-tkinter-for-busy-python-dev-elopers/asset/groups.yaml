    Tk 本身最近内置的、更现代的设施强大了。


    如果你决定使用 Tk 扩展程序，强烈建议你仔细调查并审查你的选择。


    ## 1.4. 更好的发展之路


    Tk 为你提供了很多选择。在屏幕上布局小组件至少有六种不同的方法。多个组件可以实现相同的功能，而这还未曾考虑任何 Tk 扩展程序。Tk 强调向后兼容性，这是一把双刃剑。这些老方法中的大多数仍然年复一年地保持运行。但这并不意味着你应该继续使用它们。


    所以 Tk 中有很多现这种方法，但坦率地说，所有的选择都阻碍了效率。如果你想学习并使用 Tk，你不需要知道十种实现相同功能的不同方法。你不应该进行所有的研究，探索所有的选项，并由这本书来为你做出选择。将其看作等同于“有主见的软件（opinionated
    software）”的文档即可。


    因此，我们经常会使用你在其他文档或示例中看到的不同方法。通常，这是因为在编写那些内容时，更好的方法甚至不存在。（这里有一个测试 Tk 文档的试金石：它是使用过时的
    `pack` 而不是现代的 `grid` 吗？）以后，一旦你成为了专家，并且遇到某些典型选择不再适用的奇葩情况，你就可以寻找替代方案了。


    ## 1.5. 如何使用


    虽然本书的设计是供线性阅读的，但请根据你的需要随心跳跃。我们经常会提供链接以获取更多信息，例如特定命令的完整参考文档。虽然 Tk 的原生参考文档是基于 Tcl
    的，但它们非常准确且编写良好，并且通常易于“翻译”成 Python。遗憾的是，没有哪个 Tkinter 参考文档能达到它的质量或完备性。


    你可以通过 https://tkdocs.com/code/ 访问一个包含许多大型示例的 GitHub 仓库。你还会在下文“规范”章节代码列表下方找到直接链接。


    ## 规范


    按照惯例，代码列表、解释器或外壳（shell）命令及响应将用等宽字体表示。在显示解释器的交互会话时，你输入的部分将用加粗等宽字体表示。


    在描述过程或方法调用时，字面部分（例如方法名）将使用普通等宽字体，你应该填入实际值的参数将带有*斜体*，而可选参数将用 `?` 包围，例如 `set variable
    ?value`。


    通常情况下，当在正文中引用这些过程或方法调用时，我们会省略 Tkinter 需要的标点符号（括号、逗号、等号等）。当然，代码片段显示了完整的语法。


    你会看到一些与正文隔离开段落。这些段落有几种不同的用途。每个段落都用不同的图标进行标识，如下：


    > 此段落将帮助指出人们常犯的错误，或建议与主题相关的有用但不一定显易的解决方案。


    这表示 Tk 8.5 或 Tk 8.6 中一种新的方法，它与以前的做法非常不同。熟悉 Tk 的旧版本或正在基于旧版本 Tk 开发的程序进行工作的人应该应该加注意。


    此段落提供了一些额外信息。它对于学习当前主题并非绝对必要，但可能帮助你更多地理解这样做的方式或为什么要这样做。


    这表示 Tk 中一个可以宽泛地描述为“粗糙边缘”的区域。它可能表示一个糟糕或缺失的 API，要求你在代码中使用变通方法（workaround）。由于这些问题往往会随着时间的推移而修复，因此在代码中使用
    `TODO` 标记它们是值得的。


