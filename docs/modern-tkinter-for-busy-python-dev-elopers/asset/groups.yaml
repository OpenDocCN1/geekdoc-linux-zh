- md: "\n> In general, switching from font descriptions to named fonts is advisable\
    \ to isolate font differences in one location in the program.\n\n## 13.2. Colors\n\
    \nAs with fonts, there are various ways to specify colors. Full details can be\
    \ found in the [colors command reference]().\n\n- :://tkdocs.com/man/colors\n\n\
    In general, Tk widgets default to the right colors for most situations. If you'd\
    \ like to change colors, you'll do so widget-specific commands or options, e.g.,\
    \ the label's [foreground]() [background]() configuration options. For most themed\
    \ widgets, color changes are specified through styles, not by the widget directly.\n\
    \nYou can specify colors by RGB, as you would in HTML or CSS, e.g. #FF01A. Tk\
    \ also recognizes names such as red, black, grey50, light blue, etc.\n\nTk recognizes\
    \ the standard names for colors defined by X11. You can find a complete list in\
    \ the command reference (noted above).\n\nAs with fonts, both macOS and Windows\
    \ specify many system-specific abstract color names (again, see the reference).\
    \ The actual color these correspond to may depend on system settings and can change\
    \ over time, e.g., dark mode, text highlight colors, default backgrounds.\n\n\
    If needed, you can find the RGB values (between 0 and 65535) for a color using\
    \ the [winfo_rgb]() method on any widget.\n\n```\nroot.winfo_rgb('red')\n```\n\
    \n> It should probably go without saying, but restraint in the use of colors is\
    \ highly advisable!\n\n## 13.3. Images\n\nWe've seen the basics of how to use\
    \ images already, displaying them in labels or buttons, for example. We create\
    \ an image object, usually from a file on disk.\n\n```\nimgobj = PhotoImage(file='myimage.gif')\n\
    label['image'] = imgobj\n```\n\nOut of the box, Tk 8 includes support for GIF\
    \ and PPM/PNM images. Tk 8.6 added PNG to this short list. However, there is a\
    \ Tk extension library Img, which adds support for many others: BMP, XBM, XPM,\
    \ JPEG, PNG (if you're using 8.5), TIFF, etc. Though not directly in the Tk core,\
    \ Img is usually included with other packaged distributions (e.g., ActiveTk).\n\
    \nInstead of using Tk's extension, Tkinter uses a made-for-Python image library\
    \ PIL (Python Imaging Library). More specifically, we'll use a more up-to-date\
    \ fork of PIL Pillow. As it doesn't bundled with Python, you'll normally need\
    \ to install it. You should be able to do so by, e.g., `pip install Pillow`.\n\
    \n```\nfrom PIL import ImageTk, Image\nmyimg = ImageTk.PhotoImage(Image.open('myimage.png'))\n\
    ```\n\nThe ImageTk.PhotoImage provides a drop-in replacement for Tk's PhotoImage\
    \ which supports the broader range of images.\n\nTk's images are actually quite\
    \ powerful and sophisticated and a wide variety of ways to inspect and modify\
    \ images. You can find out more from the [image command reference](https://tkdocs.com/man/image)\
    \ and the [photo command reference](https://tkdocs.com/man/photo).\n\n- https://tkdocs.com/man/image\n\
    - https://tkdocs.com/man/photo\n\n> The types of multi-color images we've seen\
    \ here are referred to in Tk as photo images. Tk also provides a second type of\
    \ images, two-bit bitmap images, which were widely used in the '90s when most\
    \ Unix workstations used quite large (compared with PCs) monitors, but they were\
    \ only black and white. Needless to say, color is de rigueur these days, so updating\
    \ to full-color images for icons and so on is highly advisable. Though in what\
    \ some may consider retro-styling, some flat and material design schemes have\
    \ returned to black and white. Plus ça change…\n\n# 14. Canvas\n\nhttps://tkdocs.com/man/canvas\n\
    \nA canvas manages a 2D collection of graphical objects — lines, circles, text,\
    \ images, other widgets, and more. Tk's canvas is an incredibly powerful and flexible\
    \ widget, and truly one of Tk's highlights. It is suitable for a wide range of\
    \ uses, including drawing or diagramming, CAD tools, displaying or monitoring\
    \ simulations or actual equipment, and building more complex widgets out of simpler\
    \ ones. Note: Canvas widgets are part of the classic Tk widgets, not the themed\
    \ Tk widgets.\n\n![](img/e444c319ec16222f00278651bee8c21d_198_0.png)\n\nCanvas\
    \ widgets are created using the Canvas class:\n\n```\ncanvas = Canvas(parent,\
    \ width=500, height=400, background='gray75')\n```\n\nYou'll often provide a width\
    \ and height, either in pixels or any of the other standard distance units. As\
    \ always, you can ask the geometry manager to expand it to fill the available\
    \ space in the window. You might provide a default background color for the canvas,\
    \ specifying colors in any of the ways you learned about in the last chapter.\
    \ Canvas widgets also support other appearance options like relief and borderwidth\
    \ that we've used.\n\nCanvas widgets have a tremendous number of features, and\
    \ we won't cover everything here. Instead, we'll start with a simple example,\
    \ a freehand sketching tool, and incrementally add new pieces to it, each showing\
    \ another new feature of canvas widgets.\n\n## 14.1. Creating Items\n\nWhen you\
    \ create a new canvas, it is essentially a blank. To do anything useful with it,\
    \ you need to add items. Here's a simple example, we're using global variables\
    \ to store the start position. In practice, we'd encapsulate all of this in a\
    \ Python class. Note that this example creates a subclass of Canvas, which is\
    \ treated like any other widget. Here's how we could do.\n\n```python\nfrom tkinter\
    \ import *\nfrom tkinter import ttk\n\nclass Sketchpad(Canvas):\n    def __init__(self,\
    \ parent, **kwargs):\n        super().__init__(parent, **kwargs)\n        self.bind(\"\
    <Button-1>\", self.saveposn)\n        self.bind(\"<B1-Motion>\", self.add_line)\n\
    \n    def saveposn(self, event):\n        lastx, lasty = event.x, event.y\n\n\
    \    def add_line(self, event):\n        self.create_line(lastx, lasty, event.x,\
    \ event.y)\n```\n\nThe coordinates are expressed as pixels, the top-left corner\
    \ is the origin. The \"x\" value increases horizontally, the \"y\" value increases\
    \ vertically. To create a canvas, we'll specify the width and height. Often, you\
    \ can ask the geometry manager to expand it to fill the available space in the\
    \ window. You might provide a default background color for the canvas, specifying\
    \ colors in any of the ways you learned about in the last chapter. Canvas widgets\
    \ also support other appearance options like relief and borderwidth that we've\
    \ used.\n\n```python\nfrom tkinter import *\nfrom tkinter import ttk\n\nglobal\
    \ lastx, lasty\n\ndef saveposn(event):\n    global lastx, lasty\n    lastx, lasty\
    \ = event.x, event.y\n\ndef add_line(event):\n    canvas.create_line(lastx, lasty,\
    \ event.x, event.y)\n\nroot = Tk()\nroot.columnconfigure(0, weight=1)\nroot.rowconfigure(0,\
    \ weight=1)\n\ncanvas = Canvas(root)\ncanvas.grid(column=0, row=0, sticky=(N,\
    \ W, E, S))\ncanvas.bind(\"<Button-1>\", saveposn)\ncanvas.bind(\"<B1-Motion>\"\
    , add_line)\n\nroot.mainloop()\n```\n\nhttps://tkdocs.com/code/sketch1.py\n\n\
    Try it - drag the mouse around the canvas to create your masterpiece.\n\n# Item\
    \ Attributes\n\nWhen creating items, you can also specify one or more attributes\
    \ for the item, affecting how it is displayed. For example, here we'll specify\
    \ that the line should be red and three pixels wide.\n\n```\ncanvas.create_line(10,\
    \ 10, 200, 50, fill='red', width=3)\n```\n\nThe exact set of attributes will vary\
    \ according to the type of item. Some commonly used ones are:\n\n- fill: color\
    \ to draw the object\n- width: line width of the item (or its outline)\n- outline:\
    \ for filled shapes like rectangles, the color to draw the item's outline\n- dash:\
