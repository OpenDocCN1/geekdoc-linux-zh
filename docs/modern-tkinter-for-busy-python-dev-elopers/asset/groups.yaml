  - '[PAGE 54]


    # 5.2. Geometry Management


    If you''ve been running code interactively, you''ve probably just that by creating
    widgets, they didn''t appear onscreen. Placing widgets onscreen, and precisely
    *where* they are placed, is a separate step called *geometry management*.


    In our example, positioning each widget was accomplished by the `grid` command.
    We specified the column and row we wanted each widget to go in, how things were
    to be aligned within the grid, etc. Grid is an example of a *geometry manager*
    (of which there are several in Tk, grid being the most useful). For now, we''ll
    look at geometry management in general; we''ll talk about grid in a later chapter.


    A geometry manager''s job is to figure out exactly where widgets are going to
    be put. This turns out to be a complex optimization problem, and a good geometry
    manager relies on quite sophisticated algorithms. A good geometry manager provides
    the flexibility, power, and ease of use that makes programmers happy. It also
    makes it easy to create good user interface layouts without needing to jump through
    hoops. Tk''s `grid` is, without a doubt, one of the absolute best. A poor geometry
    manager... well, all the Java programmers who have suffered through `GridBagLayout`
    please raise their hands.


    > We''ll go into more detail in a later chapter, but `grid` was introduced years
    after Tk became popular. Before that, an older geometry manager named `pack` was
    most commonly used. It''s very powerful, but is much harder to use, and extremely
    difficult to create layouts that look appealing today. Unfortunately, much of
    the example Tk code and documentation out there uses `pack` instead of `grid`
    (a good clue to how current it is). The widespread use of `pack` is one major
    reason that so many Tk interfaces look terrible. Start new code with `grid`, and
    upgrade old code when you can.


    # The Problem'
  - '[PAGE 55]


    The problem for a geometry manager is to take all the different widgets the program
    creates, plus the program''s instructions for where in the window each should
    go (explicitly, or more often, relative to other widgets), and then actually position
    them in the window.


    In doing so, the geometry manager has to balance multiple constraints. Consider
    these situations:


    +   * The widgets may have a natural size, e.g., the natural width of a label
    would depend on the text it displays and the font used to display it. What if
    the application window containing all these different widgets isn''t big enough
    to accommodate them? The geometry manager must decide which widgets to shrink
    to, by how much, etc.

    * If the application window is bigger than the natural size of all the widgets,
    how is the extra space used? Is space placed between each widget, and if so, how
    is that space distributed? Is it used to make widgets larger than they want to
    be, such as a text entry growing to fill a wider window? Which widgets would grow?

    * If the application window is resized, how does the size and position of each
    widgets inside it change? Will certain areas (e.g., a text area) expand or shrink
    while other parts stay the same size, or is the area distributed differently?
    Do certain widgets have a minimum size that you want to avoid going below? A maximum
    size? Does the window itself have a minimum or maximum size?

    * How can widgets in different parts of the user interface be aligned with each
    other? How much space should be left between them? This is needed to present a
    clean layout and comply with platform-specific user interface guidelines.

    * For a complex user interface, which may have many frames nested in other frames
    nested in the window (etc.), how can all the above be accomplished, trading off
    the conflicting demands of different parts of the entire user interface?


    # How it Works'
  - '[PAGE 56]


    Geometry management in Tk relies on the concept of master and slave widgets. A
    master is a widget, typically a tolevel application window or a frame, which contains
    other widgets, called slaves. You can think of a geometry manager controlling
    the master widget and deciding how all the slave widgets will be displayed within.


    The computing community has embraced the more general societal trends toward more
    diversity, sensitivity, and awareness about the impacts of language. Recognizing
    this, the Tk core will slowly be adopting a more inclusive set of terminology.
    For example, where it makes sense, "parent" and "child" will be preferred over
    "master" and "slave". To preserve backward compatibility, the current terminology
    will not be disappearing. This is something to be aware of. For more details,
    see TIP #581 (https://tip.tcl.tk/tk581).


    Your program tells the geometry manager what to manage within the master, i.e.,
    via calling grid. Your program also provides hints as how it would like each slave
    to be displayed, e.g., via the column and rows options. You can also provide other
    things to the geometry manager. For example, we used columnspan and rowconfigure
    to identify the columns and rows we''d like to expand if there is space available
    in the window. It''s worth noting that all these parameters and hints are specific
    to grid; other geometry managers would use different ones.


    The geometry manager takes all the information about the slaves in the master,
    as well as information about how large the master is. It then asks each slave
    widget for its natural size, i.e., how large it ideally like to be displayed.
    The geometry manager''s internal algorithm calculates the area each slave will
    be allocated (if any!). The slave is then responsible for rendering itself within
    that particular rectangle. And of course, any time the size of the master changes
    (e.g., because the to window was resized), the natural size of a slave changes
    (e.g., because we changed the text in a label), or any of the geometry manager
    parameters change (e.g., like row, column, or sticky) we repeat the whole thing.


    This all works recursively as well. In our example, we had a content frame inside
    the tolevel application window, and then several other widgets inside the content
    frame. We, therefore, had to manage the geometry for two different masters. At
    the outer level,'
- md: "\ntoplevel window was the master, and the content frame was its slave. At the\
    \ inner level, the content frame was the master, with each of the other widgets\
    \ being slaves. Notice that the same widget, e.g., the content frame, can be both\
    \ a master and a slave! As we saw previously, this widget hierarchy can be nested\
    \ much more deeply.\n\n> While each master can be managed by only one geometry\
    \ manager (e.g. grid), different masters can have different geometry managers.\
    \ While grid is the right choice most of the time, others may make sense for a\
    \ particular layout used in one part of your user interface. Other geometry managers\
    \ include pack, which we've mentioned, and place, which leaves all layout decisions\
    \ entirely up to you. Some complex widgets like canvas and text let you embed\
    \ other widgets, making de facto geometry managers.\n\nFinally, we've been making\
    \ the assumption that slave widgets are the immediate children of their master\
    \ in the widget hierarchy. While this is usually the case, and mostly there's\
    \ no good reason to do it any other way, it's also possible (with some restrictions)\
    \ to get around this.\n\n## 5.3. Event Handling\n\nTk, as with most other user\
    \ interface toolkits, runs an event loop that receives events from the operating\
    \ system. These are things button presses, keystrokes, mouse movement, window\
    \ resizing, and so on.\n\nGenerally, Tk takes care of managing this event loop\
    \ for you. (did a user click on this button? if a key was pressed, textbox know\
    \ the focus?), and dispatch it accordingly. Individual widgets know how to respond\
    \ to events; for example, a button might change color when the mouse moves over\
    \ it, and revert back when the mouse leaves.\n\n> It's critical in event-driven\
    \ applications that the event loop not be blocked. The event loop should run continuously,\
    \ normally executing dozens of steps per second. At every step, it processes an\
    \ event. If your program is performing a long operation, it can potentially block\
    \ the event loop. In that case, no events would be processed, no drawing would\
    \ be done, and it would appear as if your application is frozen. There are many\
    \ ways to avoid this happening, mostly related to the structure of your application.\
    \ We'll discuss this in more detail in a later chapter.\n\n## Event Callbacks\n\
    \nYou often want your program to handle some event in a particular way, e.g.,\
    \ do something when a button is pushed. For those that are most frequently customized\
    \ (what good is a button without something happening when you press it?), the\
    \ widget will allow you to specify a callback as a widget configuration option.\
    \ We saw this in the example with the command option of the button.\n\n```python\n\
    def calculate(*args):\n    ...\ntk.Button(mainframe, text=\"Calculate\", command=calculate)\n\
    ```\n\nCallbacks in Tk tend to be simpler than in user interface toolkits used\
    \ with compiled languages (where a callback must be a procedure with a certain\
    \ set of parameters or an object method with a certain signature). Instead, the\
    \ callback is just an ordinary bit of code that the interpreter evaluates. While\
    \ it can be as complicated as you want to make it, most of the time, you'll just\
    \ want your callback to call some procedure.\n\n# Binding to Events\n\nFor events\
    \ that don't have a widget-specific command callback associated with them, you\
    \ can use Tk's bind to capture any event, and then (like with callbacks) execute\
    \ an arbitrary piece of code.\n\nHere's a (silly) example showing a label responding\
    \ to different events. When an event occurs, a description of the event is displayed\
    \ in the label.\n\n```python\nfrom tkinter import *\nfrom tkinter import ttk\n\
    root = Tk()\nlabel = ttk.Label(root, text=\"Starting...\")\nlabel.grid()\nlabel.bind('<Enter>',\
    \ lambda e: label.configure(text='Moved mouse inside'))\nlabel.bind('<Leave>',\
    \ lambda e: label.configure(text='Moved mouse outside'))\nlabel.bind('<Button-1>',\
    \ lambda e: label.configure(text='Clicked left mouse button'))\nlabel.bind('<Button-3>',\
    \ lambda e: label.configure(text='Clicked right button'))\nlabel.bind('<Double-1>',\
    \ lambda e: label.configure(text='Double clicked'))\nlabel.bind('<B3-Motion>',\
    \ lambda e: label.configure(text='right button drag to=%d,%d' % (e.x,e.y)))\n\
    root.mainloop()\n```\n\n![](img/e444c319ec16222f00278651bee8c21d_59_0.png)\n\n\
    The first two binds are pretty straightforward, just watching for simple events.\
    \ An <Enter> event means the mouse has moved over top the widget, while the <Leave>\
    \ event is generated when the mouse outside the widget to a different one.\n\n\
    https://tkdocs.com/code/bindings.py\n\nThe next binding looks for a mouse click,\
    \ specifically a <ButtonPress-1> event. Here, the <ButtonPress> is the actual\
    \ event, but the -1 is an event detail specifying the left (main) mouse button\
    \ on the mouse. The binding will only trigger when a <ButtonPress> event is generated\
    \ involving the mouse button. If another mouse button was clicked, this binding\
    \ would ignore it.\n\nThis binding looks for a <3> event. This is actually a shorthand\
    \ for <ButtonPress-3>. It will respond to events generated when the right mouse\
    \ button is clicked. The next binding, <Double-1> (shorthand for <Double-ButtonPress-1>)\
    \ adds another modifier, Double, and so will respond to the left mouse button\
    \ double clicked.\n\nThe last binding also uses a modifier: capture mouse movement\
    \ (Motion), but only when the right mouse button (B) is held down. This binding\
    \ also shows an example of how to use event parameters. Many events, as mouse\
    \ clicks or movement carry additional information like the current position of\
    \ the mouse. Tk provides access to these parameters in Tcl callback scripts through\
    \ the use of percent substitutions. These percent substitutions let you capture\
    \ them as they be used in your script.\n\nTkinter abstracts away percent substitutions\
    \ and instead encapsulates all the event parameters in an event object. Above,\
    \ we used the x and y fields to retrieve the mouse position. We'll see percent\
    \ substitutions used later in another context, entry widget validation.\n\n> What's\
    \ with the lambda expressions? Tkinter expects you to provide a function as the\
    \ callback, whose first argument is an event object representing the event that\
    \ triggered the callback. It's sometimes not worth the bother of defining named\
    \ functions for one-off trivial callbacks such as in this example. Instead, we've\
    \ just used Python's anonymous functions via lambda. In real applications, you'll\
    \ almost always use a regular function, such as the calculate function in our\
    \ feet to meters example, or a method of an object.\n\n# Multiple Bindings for\
    \ an Event\n\nWe've just seen event bindings can be set up for an individual widget.\
    \ When a matching event is received by that widget, the binding will trigger.\
    \ But that's not all you can do.\n\nYour binding can capture not just a single\
    \ event, but a short sequence of events. The <Double-1> binding triggers when\
    \ two clicks occur in a short time. You can do the same to capture two keys pressed\
    \ in a row, e.g., <KeyPress-A><KeyPress-B> or simply <a>.\n\nYou can also set\
    \ up an event binding on a toplevel window. When a matching event occurs anywhere\
    \ in that window, the binding will be triggered. In our example, we set up a binding\
    \ for the Return key on the main application toplevel window. If the Return key\
    \ was pressed when any widget in the toplevel had the focus, that binding would\
    \ fire.\n\nLess commonly, you can create bindings that are triggered when a matching\
    \ event occurs anywhere in the application, or even for events received by any\
    \ widget of a given class, e.g., all buttons.\n\n![](img/e444c319ec16222f00278651bee8c21d_61_0.png)\n\
    \n> More than one event binding can fire for an event. This keeps event handlers\
    \ concise and limited in scope, meaning more modular code. For example, the behavior\
    \ of each widget class in Tk is itself defined with script-level event bindings.\
    \ These stay separate from event bindings in your application. Event bindings\
    \ can be changed or deleted. They can be modified to alter event handling for\
    \ widgets of a certain class or parts of your application. You can reorder, extend,\
    \ or change the sequence of event handlers that will be triggered for each event;\
    \ see the `bindtags` command reference if you're curious.\n\n```\nhttps://tkdocs.com/man/bindtags\n\
    ```\n\n# Available Events\n\nThe most commonly used events are described below,\
    \ along with the circumstances when they are generated. Some are generated on\
    \ some platforms and not. For a complete description of all the different event\
    \ names, modifiers, and the different event parameters that are available with\
    \ each, the best place to look is the `bind` command reference.\n"
  mdcn: "\n顶层窗口是主窗口（master），内容帧是它的从窗口（slave）。在内部层级中，内容帧是主窗口，其他每个控件都是从窗口。注意，同一个控件（例如内容帧）既可以是主窗口，也可以是从窗口！正如我们之前看到的，这种控件层级结构可以嵌套得深得多。\n\
    \n> 每个主窗口只能由一个几何管理器（例如 `grid`）管理，但不同的主窗口可以使用不同的几何管理器。虽然大多数情况下 `grid` 是正确的选择，但对于用户界面某部分的特定布局，其他管理器可能更合适。其他的几何管理器包括我们提到过的\
    \ `pack` 以及 `place`，后者将所有布局决策完全留给你你。一些复杂的控件（如 `canvas` 和 `text`）允许你嵌入其他控件，从而成为事实上的几何管理器。\n\
    \n最后，我们一直假设从控件在控件层级结构中是其主窗口的直接子节点。虽然通常情况下如此，而且大多数时候没有理由这样做，但也（在某些限制下）可以绕过这一限制。\n\
    \n## 5.3. 事件处理\n\nTk 与大多数其他用户界面工具包一样，运行着一个接收来自系统事件的事件循环。这些是诸如按钮按下、按键输入、鼠标移动、窗口缩放等事件。\n\
    \n通常，Tk 负责为你管理这个事件循环（用户是否点击了这个按钮？如果按了键，文本框知道焦点吗？），并据此进行分发。单个控件知道如何响应事件；例如，按钮在鼠标移动过其上方时可能会改变颜色，并在鼠标离开时恢复。\n\
    \n> 在事件驱动的应用程序中，事件循环不被阻塞至关重要。事件循环应该持续运行，通常每秒执行几十个步骤。在每一步，它都会处理一个事件。如果你的程序正在执行耗时操作，它可能会阻塞事件循环。在这种情况下，没有任何事件会被处理，也不会进行任何绘制，应用程序看起来就像死机了一样。有很多方法可以避免这种情况发生，主要与你应用程序的结构有关。我们将在后面的章节中详细讨论。\n\
    \n## 事件回调 (Event Callbacks)\n\n你通常希望程序以特定方式处理某些事件，例如在按下按钮时执行某些操作。对于那些最频繁需要自定义的部分（如果按下按钮没有任何发生，按钮有什么用呢？），控件将允许你将回调作为控件配置选项来指定。我们在按钮的\
    \ `command` 示例中看到了这一点。\n\n```python\ndef calculate(*args):\n    ...\ntk.Button(mainframe,\
    \ text=\"Calculate\", command=calculate)\n```\n\nTk 中的回调通常比用于编译语言的用户界面工具包中的回调要简单（在编译语言中，回调必须是一个具有特定参数集的过程或具有特定签名的对象方法）。相反，回调仅仅是一段解释器评估的普通代码。虽然它可以变得你认为的任何复杂程度，但大多数时候，你只是想让回调调用某些过程。\n\
    \n# 绑定事件 (Binding to Events)\n\n对于那些没有关联特定控件命令回调的事件，你可以使用 Tk 的 `bind` 来捕获任何事件，然后（像回调一样）执行任意代码。\n\
    \n这里有一个（幼稚的）示例，展示了标签如何响应不同的事件。当事件发生时，标签将显示事件的描述。\n\n```python\nfrom tkinter import\
    \ *\nfrom tkinter import ttk\nroot = Tk()\nlabel = ttk.Label(root, text=\"Starting...\"\
    )\nlabel.grid()\nlabel.bind('<Enter>', lambda e: label.configure(text='Moved mouse\
    \ inside'))\nlabel.bind('<Leave>', lambda e: label.configure(text='Moved mouse\
    \ outside'))\nlabel.bind('<Button-1>', lambda e: label.configure(text='Clicked\
    \ left mouse button'))\nlabel.bind('<Button-3>', lambda e: label.configure(text='Clicked\
    \ right button'))\nlabel.bind('<Double-1>', lambda e: label.configure(text='Double\
    \ clicked'))\nlabel.bind('<B3-Motion>', lambda e: label.configure(text='right\
    \ button drag to=%d,%d' % (e.x,e.y)))\nroot.mainloop()\n```\n\n![](img/e444c319ec16222f00278651bee8c21d_59_0.png)\n\
    \n前两个绑定（bind）非常直观，只需监听简单事件。`<Enter>` 事件意味着鼠标移动到了控件上方，而 `<Leave>` 事件在鼠标从控件外部移动到另一个控件上时生成。\n\
    \nhttps://tkdocs.com/code/bindings.py\n\n下一个绑定寻找鼠标点击，特别是 `<ButtonPress-1>` 事件。在这里，`<ButtonPress>`\
    \ 是实际事件，但 `-1` 是一个事件细节，指定鼠标上的左（主）按钮。只有当生成涉及该鼠标按钮的 `<ButtonPress>` 事件时，绑定才会触发。如果点击了另一个鼠标按钮，此绑定将忽略它。\n\
    \n"
