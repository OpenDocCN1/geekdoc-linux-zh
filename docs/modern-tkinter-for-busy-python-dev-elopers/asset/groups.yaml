    # 8. 更多组件


    本章将继续介绍几个组件：列表框（listbox）、滚动条（scrollbar）、文本（text）、刻度（scale）、数值框（spinbox）和进度条（progressbar）。其中一些组件比之前看到的的基础组件更强大。在这里我们看到一些经典组件的使用实例，用于那些没有（或没有需要）主题对应组件的情况。


    ## 8.1. Listbox（列表框）


    [Listbox](https://tkdocs.com/man/textbox)


    listbox 组件显示单行文本项列表（通常很长），允许用户浏览列表并选择一个或多个项。


    列表框是经典 Tk 组件的一部分；目前主题化 Tk 组件集中还没有 listbox。


    > Tk 的 treeview 组件（带主题的）也可以用作 listbox（一层深度的树），允许你在列表中使用图标和样式。在未来的某时刻，多列（表格）列表组件也可能加入
    Tk，无论它是基于 treeview 还是某个现有的扩展程序。


    | macOS | Windows | Linux |

    |---|---|---|

    | Tcl | Tcl | Tcl |

    | Ruby | Ruby | Ruby |

    | Python | Python | Python |

    | Perl | Perl | Perl |

    | Lua | Lua | Lua |

    | Lisp | Lisp | Lisp |

    | Caml | Caml | Caml |

    | Erlang | Erlang | Erlang |


    Listbox 组件。


    列表框使用 `Listbox` 类创建。`height` 选项可以指定列表框在不滚动的情况下一次显示的行数：


    ```

    1 = Listbox(parent, height=10)

    ```


    ## 填充列表框项


    有一种简单的方法和一种困难的方法来填充和管理列表框中的所有项。


    这里是简单的方法。每个 listbox 都有一个 `listvariable` 配置，允许你将一个变量（必须包含列表）链接到 listbox。此列表的每个元素都是代表列表框中一个项的字符串。要向列表框中添加、删除或重新排列项，你只需像修改其他列表一样修改该变量即可。同样，若要查找例如列表框中第三行是哪个项，只需查看列表变量的第三元素即可。


    实际上这并没有那么简单。Tkinter 不允许你将普通的 Python 列表链接到 listbox。正如我们在 entry 等组件中看到的，我们需要使用 `StringVar`
    作为中间变量。它提供了 Python 列表与底层 Tk 组件可以使用的字符串表示之间的映射。这意味着每每当我们更改列表时，都需要更新 `StringVar`。


    ```

    choices = ["apple", "orange", "banana"]

    choicesvar = StringVar(value=choices)

    l = Listbox(parent, listvariable=choices)

    ...

    choices.append("peach")

    choicesvar.set(choices)

    ```


    较旧且较困难的方法是使用 listbox 组件自带的一组方法。这些方法在组件维护的（内部）项列表上操作：


    - `insert idx ?item?...` 方法用于向列表添加一个或多个项；`idx` 是一个从 0 开始的索引，表示要添加的项之前的位置；指定 `end`
    可将新项放在列表末尾。


    - `delete first ?last?` 方法从列表中删除一个或多个项；`first` 和 `last` 是与 `insert` 方法相同的索引。


    - 使用 `get first ?last?` 方法返回指定位置的单个项的内容，或返回 `first` 和 `last` 之间项的列表。


    - `size` 方法返回列表中的项数。


    之所以存在这种困难的方法，是因为 `variable` 选项直到 Tk 8.3 才被引入。在此之前，你只能使用这种困难的方法。由于使用列表变量允许使用所有的标准列表操作，它提供了一个简单得多的
    API。如果你有在使用旧方法的列表框，这无疑是一个值得考虑的升级。


    ## 选择项


    你可以决定用户是每次只能从列表框中选择一个项，还是可以同时选择多个项。这由 这里的 `selectmode` 选项控制：默认是只能选择单个项（browse），而
    `selectmode` 为 `extended` 时允许用户选择多个项。


    出于向后兼容性，`browse` 和 `extended` 这两个名字非常糟糕。由于还有两种模式 `single` 和 `multiple`，情况更糟，你不应该使用它们（它们使用了与现代用户界面和平台习惯不的旧交互样式）。


    要查找列表框中当前选择了哪些项，请使用 `selection` 方法。它返回所有当前选中项的索引列表；这可能是一个空列表。对于 `selectmode` 为
    `browse` 的列表，其长度永远不会超过一项。你还可以使用 `selection_includes index` 方法来检查给定索引的项是否当前被选中。


    ```

    if lbox.selection_includes(2): ...

    ```


    要通过程序更改选择，你可以使用 `selection_clear first ?last?` 方法取消每个项或指定索引范围内的项的选中。要选择范围内的某个项或所有项，请使用
    `selection_set ?last?` 方法。这两种方法都不会触及指定范围之外任何项的选择。


    ```

    if lbox.selection_includes(2): ...

    ```

    （注：此处原文存在大量重复的段落，翻译时已按要求去重并保留逻辑结构）


    ## 样式化列表


    与大多数经典组件一样，你对[外观](https://docs.python.org/3/library/tkinter.html) 具有极大的活性，你可以更改字体和背景。还有一个
    `configure` 方法允许你更改单个项的前颜色和背景。在这种情况下，我们将显示交替行。


    ## 保留额外的项数据


    我们如何将此底层值与显示的名称关联？遗憾的是，listbox 组件没有提供任何设施，因此这是我们必须单独管理的。有两个显而易见的方法。首先，如果确保显示的字符串是唯一的，你可以使用哈希表将每个名称映射到其底层对象。这对于可能重复的人名效果不佳，但对于唯一的国家是可行的。


    第二方法是维护一个与字符串列表并行的第二个列表。第二个列表将持有与每个显示的项相关的底层对象。


    '
