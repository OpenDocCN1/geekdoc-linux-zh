    \ Help\nPython 3.4.0 (default, Jun 19 2015, 14:20:21)\n[GCC 4.8.2] on linux\n\
    Type \"copyright\", \"credits\" or \"license()\" for more informati\n>>> \n```\n\
    \nIDLE main window using TkFixedFont (Linux).\n\nSpeaking of preferences dialogs,\
    \ if you want to change the font it often helps to know what the fonts actually\
    \ is (using Font.actual). Here's the new code from IDLE's preferences dialog that\
    \ figures out:\n\n```python\nif (family == 'TkFixedFont'):\n    f = Font(name\
    \ ='TkFixedFont', exists = True, root=root)\n    actualFont = Font.actual(f)\n\
    \    family = actualFont['family']\n    size = actualFont['size']\n    if size\
    \ < 0:\n        size = 10 # if font in pixels, ignore actual\n\n    bold = 1 if\
    \ actualFont['weight']=='bold' else 0\n```\n\nFor the record, the fonts that Tk\
    \ for TkFixedFont are Monaco 11 on macOS, Courier New 10 on Windows, and DejaVu\
    \ Sans Mono 10 on Linux (Ubuntu 14 to specific).\n\n# Around the Text Widget\n\
    \nThere were a few other things that just weren't right around the edge of the\
    \ main window; see [bugs.python.org/issue24750]. Look back at the earlier screenshots\
    \ of the IDLE main window.\nNotice there's a border around the text widget. It's\
    \ most noticeable on macOS where it's a dark black, somewhat less so on Linux,\
    \ and barely perceptible on Windows. This is the result of Tk's \"highlight\"\
    \ attribute, which is present when the text widget has the focus.\nIf the text\
    \ widget doesn't have the focus, such as when the window becomes inactive, the\
    \ highlight gives away:\n\n![](img/e444c319ec16222f00278651bee8c21d_275_0.png)\n\
    \nNotice how on the macOS screenshot, without the highlight, the status bar at\
    \ the bottom of the window blends into the text widget. Not good.\n\nAs you'll\
    \ see looking at other applications, the border around the text widget is no longer\
    \ a common convention. So let's start by removing that, which is as easy as adding\
    \ highlightthickness=\"0\" when we create the text widget.\n\nThat still leaves\
    \ us with the problem of the status bar blending into the editor. We changed the\
    \ status bar to be a ttk.Frame widget, which has a background shading on all platforms.\
    \ We also placed a ttk.Separator widget just above the status bar, to give us\
    \ clean separation.\n\nEach of the line and column indicators were labels, previously\
    \ created with:\n\n```python\nlabel = Label(self, bd=1, relief=SUNKEN, anchor=W)\n\
    ```\n\nThis was replaced with a ttk.Label, to ensure it matched the frame. We\
    \ also did away with the 1990's sunken \"3d\" look.\n\n```python\nlabel = ttk.Label(self)\n\
    ```\n\nBut not least, we can replace the original Tk scrollbar with the newer\
    \ ttk.Scrollbar widget.\n\nThe resulting changes to the main window are shown\
    \ below. Despite these being fairly minor, subtle changes, they go a long way\
    \ towards IDLE's main window looking a lot cleaner, more modern, and \"just fitting\
    \ in\" on all platforms.\n\n![](img/e444c319ec16222f00278651bee8c21d_276_0.png)\n\
    \nIDLE's main window, with improvements (macOS).\n\n![](img/e444c319ec16222f00278651bee8c21d_277_0.png)\n\
    \n![](img/e444c319ec16222f00278651bee8c21d_277_1.png)\n\n# 18.4. Preferences Dialog\n\
    \nOne visible piece that greatly needed improvement was the Preferences dialog.\
    \ Again, here are screenshots on the three platforms:\n\n![](img/e444c319ec16222f00278651bee8c21d_278_0.png)\n\
    \nIDLE's Preferences window (macOS).\n\n![](img/e444c319ec16222f00278651bee8c21d_279_0.png)\n\
    \nIDLE's Preferences window (Windows).\n\n![](img/e444c319ec16222f00278651bee8c21d_280_0.png)\n\
    \nThe other tabs allow you to modify individual colors for syntax highlighting,\
    \ keystrokes assigned to particular operations, and a few other miscellaneous\
    \ things.\n\nWhile there was some debate as the need for this level of configuration\
    \ on what was primarily a learning environment, it seemed reasonable to at least\
    \ make what there looked like and work better considering any more radical surgery;\
    \ see [bugs.python.org/issue24810].\n\nAmong other things, the Preferences dialog\
    \ was changed from modal (which, amusingly enough, didn't quite work on macOS,\
    \ to headless, allowing multiple copies to be created) though I won't go further\
    \ into that at this point; see [bugs.python.org/issue24760].\n\n# Tabs\n\nThe\
    \ first issue to address the panes was the tabs used to switch between the four\
    \ different preference panes. The original used a custom \"megawidget\", as classic\
    \ Tk doesn't have its own widget. While the Windows and Linux ones don't look\
    \ too bad, on recent versions of macOS, there is a built-in tab that looks quite\
    \ different.\n> It's actually more common in macOS applications now to use something\
    \ similar to a toolbar (row of icons with the top) to switch between preference\
    \ panes, though some programs still use tabs.\n\nThe code was modified to use\
    \ ttk.Notebook, which not only looks better but allows us to jettison a lot of\
    \ code for managing tabs.\n\n# Updating Widgets\n\nThe next obvious step was upgrading\
    \ the \"classic\" widgets to their themed counterparts. On this screen, which\
    \ included the buttons, labels, frames, checkbox, scrollbar, etc. There were a\
    \ few others on some of the other panes. Generally, this was a straightforward\
    \ process, often involving removing widget options that were no longer needed\
    \ or supported by the themed widgets.\n\nSometimes choosing a different widget\
    \ made more sense. In this screen, the option menu used for font size was better\
    \ replaced by a combobox. Similarly, the scale widget is not commonly seen in\
    \ today's interfaces and was replaced with the more familiar (and compact) spinbox\
    \ widget.\n\nThere were also non-standard ways of using certain widgets or specifying\
    \ types of data. These were generally modified to use more familiar paradigms.\
    \ There were a number of general issues discussed relating to the design of these\
    \ dialogs, see, e.g., [bugs.python.org/issue24776], and [bugs.python.org/issue24782].\n\
    \n# Layout\n\nWhile this dialog is a bad example, just given the space imbalance\
    \ between the left and right halves, a lot of time was spent in general looking\
    \ at widget spacing and alignment in dialog boxes.\n\nThe general approach was\
    \ to find similar examples in other applications and use those as a guide. Where\
    \ are the buttons located? How are multiple fields of a dialog organized? Where\
    \ are labels relative to the widget they're labeling? Are they left- or right-aligned,\
    \ capitalized, do they have a trailing colon? These are the sorts of questions\
    \ to think about.\n\nA great starting point is converting from using the old pack\
    \ geometry manager to grid. Because of the way it works, pack-based layouts tend\
    \ to have weird and inconsistent alignment and spacing, especially if they've\
    \ modified over time. Using grid will increase maintainability, both because it\
    \ uses a more familiar mental model and because it's not dependent on the order\
    \ in which widgets are inserted.\n\nIt's likely impossible to come up with one\
    \ layout that looks fantastic on all platforms, but often you can come up with\
    \ one (possibly with a couple platform-specific tweaks in the code) that looks\
    \ decent.\n\nA revised version of the dialog, incorporating many of the techniques\
    \ here, is shown below.\n"
