    plain text file. Keeping the two in sync was a problem. They were separate Sphinx''s
    text rendering didn''t look anything that good, and all the extra navigation,
    etc. in the HTML rendering wouldn''t be needed for online help, and then there''s
    the hassle of opening a web browser, etc.; see [bugs.python.org/issue16893](#)


    Tk''s widget is smart enough to handle the very basic formatting in IDLE''s documentation,
    and Python includes an HTML parser in its standard library. Putting the two together
    made displaying a simplified version of the HTML reference documentation easy.


