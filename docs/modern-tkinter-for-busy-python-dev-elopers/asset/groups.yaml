    > At this point, almost everything here has been completed, and it ended up almost
    identical to the original mockup. See, once in a while, it happens!


    # Tabbed Editor


    Even beginner programmers have to juggle multiple different source files. If each
    gets its own window, as was the case originally in IDLE, things can get messy
    and/or lost quickly. Using tabs to organize multiple files in a single window
    is a familiar, effective solution.


    When architecting your application, don''t build large components as subclasses
    of Toplevel, or assume they''ll be the only thing in the window in the future.
    Getting around that assumption in the code could a large amount of work. If components
    are instead built as frames, they can be more easily inserted into a toplevel,
    a panned window, a tabbed notebook, another frame, etc.


    Likely, we can rely on the ttk.Notebook widget to provide the tabbed user interface,
    just like we did in Preferences.


    Or may not.

    Unfortunately, the ttk.Notebook widget (and the underlying platform widgets it
    uses) only support displaying and switching between a small, fixed number of tabs.
    There''s nothing built-in to support or closing tabs from the user interface,
    which we definitely need here. And as every programmer knows, it is more than
    possible to need a large number of tabs.


    As you''ve seen in different editors and word processors, everyone does things
    slightly different. We did our custom tab widget (sigh...) for IDLE. The design
    borrowed heavily from the TextMate editor on macOS. It allows creating tabs, closing
    old ones, dragging to rearrange the order, tooltips on each tab, indicating if
    the contained file needed saving, etc. When number of tabs grows too large to
    comfortably display, the remainder are accessible via a popup menu on the last
    tab.


    > The tabbed widget implementation relies on a single Tkinter canvas to display
    the row of tabs and handle all interaction. The actual switching of window content
    is handled completely outside of the widget, with a simple callback mechanism
    used to coordinate everything.'
