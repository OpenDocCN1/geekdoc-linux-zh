    selected text. Whenever the selection changes, the `sel` tag will be updated.
    So we can find the range of text selected using the `tag_ranges` method, passing
    `sel` as the tag to report on.


    Similarly, we can change the selection by using `tag_add` to set a new selection,
    `tag_remove` to remove the selection. The `sel` tag cannot be deleted, however.


    > Though the default widget bindings prevent this from happening, `sel` is like
    any other tag in that it can support multiple ranges, i.e., disjoint selections.
    To prevent this from happening, changing the selection from your code, make sure
    to remove any old selection before adding a new one.


    The text widget manages the concept of the insertion cursor (where newly typed
    text will appear) separate from the selection. It does so using a new concept
    called *mark*.'
  - '[PAGE 230]


    # 15.6. Marks


    Marks indicate a particular place in the text. In that respect, they are like
    indices. However, as the text is modified, the mark will adjust to be in the same
    relative location. In that way, they resemble tags, but refer to a single position
    rather than a range of text. Marks actually don''t refer to a position occupied
    by a character in the text but specify a position **between two** characters.


    Tk automatically maintains two different marks. The first, named `insert`, is
    the present location of the insertion cursor. As the cursor is moved (via mouse
    or keyboard), the second mark, named `current`, tracks the position of the character
    underneath the current mouse position.


    To create your own marks, use the widget''s `mark_set name idx` method, passing
    the name of the mark and the given index (the mark is positioned before the character
    at the given index). This is also used to move an existing mark to a different
    position. Marks can be removed using the `mark_unset name` method, passing the
    name of the mark. If you delete a range of text containing a mark, that also removes
    the mark.


    The name of a mark can also be used as an index (in the same way `1.0` or `end-lc`
    are indices). You can find the next mark (or previous one) from a given index
    in the text using the `mark_next idx` of `mark_previous idx` methods. The `mark_names`
    method will return a list of the names of all marks.


    Marks also have a gravity, which can be modified with the `mark_gravity name ?direction`
    method, which affects what happens when text is inserted at the mark. Suppose
    we have the text "ac" with a mark in between that we''ll symbolize with a pipe,
    i.e., "a|c". If the gravity of that mark is right (the default), the mark attaches
    itself to the "c". If the new text "b" is inserted at the mark, the mark will
    remain stuck to the "c," and so the new text will be inserted before the mark,
    i.e., "abc|c." If the gravity is instead left, the mark attaches itself to the
    "a," and so new text will be inserted after the mark, i.e., "a|bc."'
- md: '

    ## 15.7. Images and Widgets


    Like canvas widgets, text widgets can contain not only text but also images and
    any other Tk widgets (including a frame, itself containing many other widgets).
    In a sense, this allows the text widget to work as a geometry manager in its own
    right. The ability to add images and widgets within the text opens up a world
    of possibilities for your program.


    Images are added to a text widget at a particular index, with the image specified
    as an existing Tk image. Other options that allow you to fine-tune padding, etc.


    ```

    flowers = PhotoImage(file=''flowers.gif'')

    text.image_create(''sel.first'', image=flowers)

    ```


    Other widgets are added to a text widget in much the same way as images. The widget
    being added must be a descendant of the text widget in the widget hierarchy.


    ```python

    b = ttk.Button(text, text=''Push Me'')

    text.window_create(''1.0'', window=b)

    ```


    ## 15.8. Even More


    Text widgets can do many more things. Here, we''ll briefly mention just a few
    of them. For details on any of these, see the reference manual.


    ### Search


    The text widget includes a powerful search method that allows you to locate a
    piece of text within the widget. This is useful for a "Find" dialog, as one obvious
    example. You can search backward or forward from a particular position or within
    a given range, specify the search term using exact text, case insensitive, or
    via regular expressions, one or all occurrences of the search term, etc.


    ### Modifications, Undo and Redo


    The text widget keeps track of whether changes have been made to the text (useful
    to know whether it needs to be saved to a file, for example). We can query (or
    change) using the `edit_modified()` method. There is also a complete multi-level
    undo/redo mechanism, managed automatically by the widget when we set its undo
    configuration option to true. Calling edit_undo or edit_redo modifies the current
    text using information stored on the undo/redo stack.


    ### Eliding Text


    Text widgets can include text that is not displayed. This is known as "elided"
    text, and is made available using the elide configuration option for tags. It
    can be used to implement an outliner, a "folding" code editor, or even to bury
    extra meta-data intermixed with displayed text. When specifying positions within
    elided text, you have to be a bit more careful. Methods that work with positions
    have extra options to either include or ignore the elided text.


    ### Introspection


    Like Tk widgets, the text widget goes out of its way to expose information about
    its internal state. We''ve seen this in terms of the get method, widget configuration
    options, names and cget for both tags and marks, etc. There is even more information
    available that can be useful for a wide variety of tasks. Check out the debug,
    dlineinfo, bbox, count, and dump methods in the reference manual.


    ### Peering


    The Tk text widget allows the same underlying text data structure (containing
    all the text, marks, tags, images, etc.) to be shared between two or more different
    text widgets. This is known as peering and is controlled via the peer method.


    ## 16. Treeview


    - ttk.Treeview

    - https://tkdocs.com/man/ttk_treeview


    A treeview widget displays a hierarchy of items and allows users to browse through
    it. One or more attributes of each item can be displayed as columns to the right
    of the tree. It can be used to build user interfaces similar to the tree display
    you''d find in file managers like the macOS Finder or Windows Explorer. As with
    most Tk widgets, it offers incredible flexibility so it can be customized to suit
    a wide range of situations.


    | macOS | Size | Modified | Windows | Size | Modified | Linux | Size | Modified
    |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | gallery | 25KB | Yesterday | 25KB | Yesterday | 25KB | Yesterday |

    | resources | 2KB | Two weeks ago | 2KB | Two weeks ago | 2KB | Two weeks ago
    |

    | tutorial | 220KB | Ten minutes ago | 2.1MB | Ten minutes ago | 2.1MB | Ten minutes
    ago |

    | canvas | 18KB | Last week | 18KB | Last week | 18KB | Last week |

    | tree | 5KB | Ten minutes ago | 5KB | Ten minutes ago | 5KB | Ten minutes ago
    |

    | text | 12KB | Yesterday | 12KB | Yesterday | 12KB | Yesterday |


    Treeview widgets are created using the ttk.Treeview class:


    ```python

    tree = ttk.Treeview(parent)

    ```


    Horizontal and vertical scrollbars can be added in the usual manner if desired.


    ## 16.1. Adding Items to the Tree


    To do anything useful with the treeview, we''ll need to add one or more items
    to it. Each item represents a single node in the tree, whether a leaf node or
    an internal node containing other nodes. Items are referred to by a unique id.
    You can assign this id when the item is first created, or the widget can automatically
    generate one.


    Items are created by inserting them into the tree, using the treeview''s `insert`
    method. To insert an item, we need to know where to insert it, specifying the
    parent item and where within the list of the parent''s existing children the new
    item should be placed.


    (Note: The OCR text contained significant repetition/garble in the latter half
    of section 16.1; based on standard Tkinter documentation, the core logic is de-deduplicated
    and cleaned here.)


    ## 16.2. Rearranging Items


    A node (and its descendants) can be moved to a different location using the `move`
    method. Items can be detached from the tree, which does not destroy them. Items
    can also be deleted, which completely removes the item.


    ## 16.3. Displaying Information for each Item


    The treeview can display one or more additional pieces of information about each
    item. These are shown as columns to the right of the main tree display.


    Each column is referenced by a symbolic name that we assign. We can specify the
    list of columns using the columns configuration of the treeview widget, either
    when first creating the widget or later on.


    We can specify the width of the column, how the display of item information is
    aligned, and more. We can also provide information about the heading of the column,
    such as the text to display, an optional image, alignment, and a script to invoke
    when the item is clicked (e.g. to sort the tree).


    What to display in each column for each item can be specified individually using
    the `set` method. We can also provide a list describing what to display in all
    the columns for the item. This is done using the `values` item configuration option.
    It can be used when first inserting the item or to update it.

