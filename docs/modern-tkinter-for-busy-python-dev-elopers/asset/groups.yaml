    ```


    A progressbar widget provides feedback to users about the progress of a lengthy
    operation.

    In situations where you can estimate how long the operation will take to complete,
    you can display what fraction has already been completed. Otherwise, you can indicate
    the operation is continuing, but without suggesting how much longer it will take.


    ![](img/e444c319ec16222f00278651bee8c21d_128_0.png)


    Progressbar widgets are created using the ttk.Progressbar class:


    ```

    p = ttk.Progressbar(parent, orient=HORIZONTAL, length=200, mode=''determinate'')

    ```


    As with scale widgets, they should be given an orientation horizontal or vertical
    with the orient configuration option, and can be given an optional length. The
    mode configuration option can be set to either determinate, where the progressbar
    will indicate relative progress towards completion, or to indeterminate, where
    it'
  - '[PAGE 129]


    shows that the operation is still continuing but without showing relative progress.


    # Determine Progress


    To use determinate mode, estimate the total number of "steps" the operation will
    take to complete. This could be an amount of time but doesn''t need to be. Provide
    this to the progress using the maximum configuration option. It should be a floating-point
    number and defaults to 100.0 (i.e., each step is 1%).


    As you proceed through the operation, tell the progress how far along you are
    with the value configuration option. This would start at 0, and then count upwards
    to the maximum value you have set.


    > There are two slight variations on this. First, you can just store the current
    value for the progress in a variable linked to by the progress''s variable configuration
    option; that, when you change the variable, the progress will update. The other
    alternative is to call the progress''s step ?amount method. This increments the
    value by the given amount (defaults to 1.0).


    # Indeterminate Progress


    Use indeterminate mode when you can''t easily estimate how far along in a long-running
    task you are. However, you still want to provide feedback that the operation is
    continuing (and that your progress hasn''t crashed). At the start of the operation
    you''ll call the progress''s start method. At the end of the operation, call its
    stop method. The progress will take care of the rest.


    Unfortunately, "the progress will take care of the rest" isn''t quite so simple.
    In fact, if you start the progress, call a function that takes several minutes
    to complete, and then stop the progress, your program will appear frozen the whole
    time, with the progress not updating. In fact, it will not likely appear onscreen
    at all. Yikes!


    To learn why that is, and how to address it, the next chapter takes a deeper dive
    into Tk''s event loop.'
  - '[PAGE 130]


    # #9. Event Loop


    At the end of the last chapter, we explained how to use a progressbar to provide
    feedback to users about long-running operations. The progressbar itself was simple:
    call it''s start method, perform your operation, and then call it''s stop method.
    Unfortunately, you learned that if you tried this, your application will most
    likely appear completely frozen.


    To understand why, we need to revisit our discussion of event handling, way back
    in the Tk Concepts chapter. As we''ve seen, after we construct an application''s
    initial user interface, it enters the Tk event loop. In the event loop, it continuously
    processes events, pulled from the system event queue, usually dozens of times
    a second. It watches for mouse or keyboard events, invoking command callbacks
    and event bindings needed.


    Less obviously, all screen updates are processed only in the event loop. For example,
    you may change the text of a label widget. However, that change doesn''t appear
    onscreen immediately. Instead, the widget notifies Tk that it needs to be redrawn.
    Later on, in between processing other events, Tk''s event loop will ask the widget
    to redraw itself. All drawings occur in the event loop. The change appears to
    happen immediately because the time between making the change to the widget and
    the actual redraw in the event loop is so small.'
  - '[PAGE 131]


    ![](img/e444c319ec16222f00278651bee8c21d_131_0.png)


    Event loop showing application callbacks and screen updates.'
  - '[PAGE 132]


    # 9.1. Blocking the Event Loop


    Where you run into problems is when the event loop is prevented from processing
    events for a lengthy period of time. Your application won''t redraw or respond
    to events and will appear to be frozen. The event loop is said to be blocked.
    How can this happen?


    Let''s start by visualizing the event loop as an execution timeline. In a normal
    situation, each deviation from the event loop (callback, screen update) takes
    only a fraction of a second before returning control to the event loop.


    ![](img/e444c319ec16222f00278651bee8c21d_132_0.png)


    Execution timeline for well-behaved event loop.


    In our scenario, the whole thing probably got started from an event like a user
    pressing a button. So the event loop calls our application code to handle the
    event. Our code creates the progressbar, performs the (lengthy) operations, and
    stops the progressbar. Only then does our code return control back to the event
    loop. No events have been processed in the meantime. No screen redrawing has occurred.
    They''ve just been piling up in the event queue.'
  - '[PAGE 133]


    ![](img/e444c319ec16222f00278651bee8c21d_133_0.png)


    Event loop


    Lengthy callback blocking the event loop.


    To prevent blocking the event loop, it''s essential that event handlers execute
    quickly and return control back to the event loop.


    If you have a long-running operation to perform, or anything like network I/O
    that could potentially take a long time, there are a few different approaches
    you can take.


    > For the more technically-inclined, Tk uses a single-threaded, event-driven programming
    model. All the GUI code, the event loop, and your application run within the same
    thread. Because of this, any calls or computations that block event handlers are
    highly discouraged. Some other GUI toolkits use different models that allow for
    blocking code, runs the GUI and event handlers in separate threads from application
    code, etc. Attempting to shoehorn these models into Tk can be a recipe for frustration
    and lead to fragile and hacky code. If you respect Tk''s model rather than try
    to fight with it, you won''t run into problems.'
  - '[PAGE 134]


    # 9.2. One Step at a Time


    If possible, the very best thing you can do is break your operation into very
    small steps, each of which can execute very quickly. You let the event loop be
    responsible for when the next step occurs. That way, the event loop continues
    to run, processing regular events, updating the screen, and, in between all that,
    calling your code to perform the next step of the operation.


    To do this, we make use of timer events. Our program can ask the event loop to
    generate one of these events at some time in the future. As part of its regular
    work, when the event loop reaches that, it will call back into our code to handle
    the event. Our code would perform the next step of the operation. It then schedules
    another timer for the next step of the operation and immediately returns back
    to the event loop.


    ![](img/e444c319ec16222f00278651bee8c21d_134_0.png)


    Breaking up a large operation into small steps tied together with timer events.


    Tk''s after command can be used to generate timer events. You provide the number
    of milliseconds to wait until the event should be fired. It may happen later than
    that if Tk is busy processing other events but not happen before that. You can
    also ask that an idle event be generated; it will fire when no other events in
    the queue need to be processed. (Tk''s screen updates and redraws occur in the
    context of idle events.) You can find more details on after reference manual.


    +   - https://tkdocs.com/man/after'
