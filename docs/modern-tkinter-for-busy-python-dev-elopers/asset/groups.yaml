    Quickly learn to create great looking user interfaces for Windows, Mac and Linux
    using Python''s standard GUI toolkit


    Third Edition. Copyright © 2012-2020 by Mark Roseman


    Published by Late Afternoon Press. Victoria, BC, Canada. lateaft.com.


    This book brings together various information from the website TkDocs.com, which
    Mark developed as a much-needed source of documentation on the modern features
    available in Tk. The website contains information on using Tk through Tk, Ruby
    and Perl as well as Python. This book should be considered a companion to that
    website, and supports its further development.


    ISBN: 978-1-9991495-9-8 (KINDLE)


    ## About the Author


    ![](img/e444c319ec16222f00278651bee8c21d_305_0.png)


    Mark Roseman is a veteran software developer, entrepreneur, and writer. He previously
    worked and published extensively on topics related to user experience and technology
    to support collaboration between groups of people, and founded two software startup
    companies.


    He has been using Tcl, Tk and Python since the early 1990''s, and has been influential
    within the Tcl/Tk community.


    Mark lives in Victoria, BC, Canada. He can be contacted via his personal website,
    markroseman.com.


    He has published additional information related to Tk and Tkinter at tkdocs.com
    website.

