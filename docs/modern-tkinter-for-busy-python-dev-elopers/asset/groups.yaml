    As your program grows complex, it''s easy to miss enabling or disabling some items.
    One strategy is to centralize all the menu state changes in one routine. Whenever
    there is a state change in your application, it should call this routine. It will
    examine the current state and update menus accordingly. The same code can also
    handle toolbars, status bars, or other user interface components.


