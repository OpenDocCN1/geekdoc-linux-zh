    要在列表末尾其他位置插入标签，请使用 `insert position` 子窗口 `?option value...?`；要删除指定的标签，请使用 `forget`
    方法，并传递位置 (0..n-1) 或标签的子窗口。你可以通过 `tabs` 方法获取笔记本（notebook）中包含的所有子窗口列表。


    要获取当前选中的子窗口，请将标签的位置或子窗口本身作为参数调用。


    要更改标签选项（如标签上的文本标签或其状态），可以使用 `tab(tabid, option=value)` 方法（其中 `tabid` 再次是标签的位置或子窗口）；省略
    `=value` 则返回该选项的当前值。


    每当选择一个新标签时，Notebook 小控件都会生成一个 `<<NotebookChanged>>` 虚拟事件。


    再次，`command reference`（命令参考）中详细列许多许多不常用的选项和命令。


    - https://tkdocs.com/man/ttk_notebook


    # 13. 字体、颜色、图像


    本章描述了 Tk 如何处理字体、颜色和图像。我们之前提到过所有这些内容，但在这里我们将提供更深入的探讨。


    ## 13.1. 字体


    Tk 的 label 小控件允许你通过字体配置选项更改用于显示文本的字体。后续章节涵盖的 canvas 和 text 小控件也允许你指定字体。其他显示文本的小控件可能没有字体配置选项，或者可以使用样式（styles）更改它们的字体。


    > 我们稍后会详细介绍样式。从本质上，它们取代了以前在单个小控件上调整多个配置选项的方法。相反，字体、颜色和其他控制外观的设置可以组合在一个样式中。然后，该样式可以被应用于多个小控件。这类似于在
    HTML 页面内部硬编码显示导向的标记与使用 CSS 将显示特定信息分开来之间的区别。


    对于 Tk 中的许多内容，默认字体通常是很好的选择。如果你需要进行更改，本节将向你展示使用命名字体（named fonts）来实现此点的最佳方法。Tk 包含了适用于用户界面所有不同组件的命名字体。它们考虑了你所运行的特定平台的规范。当你需要额外的灵活性时，也可以指定自己的字体。


    字体命令参考提供了指定字体以及其他字体相关操作的完整细节。


    - https://tkdocs.com/man/font


    > 许多旧的 Tk 程序硬编码了字体。使用“族 大小样式”格式感觉会像 X11 名称，或者顺序和更晦涩的 X11 字体规范字符串。随着平台的演进，这些应用程序变得越来越过时。糟糕糟糕，字体通常是按小控件指定的，导致字体决策散落在整个代码中。命名字体，特别是
    Tk 提供的标准字体，是一个得多的解决方案。在任何现有应用程序中，检查和更新字体决策都是既简单又重要的更改。


    # 标准字体


    每个平台都定义了应该用于标准用户界面元素的特定字体。Tk 将这些决策中的许多封装成一组标准的命名字体。它们在所有平台上都可用，尽管使用的具体字体会有所不同。这有助于抽象平台差异。当然，标准小控件使用了这些命名字体。预定义的字体有：


    - **TkDefaultFont**: 未另指定项的默认字体。

    - **TkTextFont**: 用于 entry 小控件、listbox 等。

    - **TkFixedFont**: 标准的等宽字体。

    - **TkMenuFont**: 用于菜单项的字体。

    - **TkHeadingFont**: 用于列表和表格中列头的字体。

    - **TkCaptionFont**: 用于窗口和对话框标题栏的字体。

    - **TkSmallCaptionFont**: 用于工具对话框的较小标题字体。

    - **TkIconFont**: 用于图标标题的字体。

    - **TkTooltipFont**: 用于工具提示的字体。


    # **特定平台的字体**


    Tk 提供了额外的命名字体，以帮助你适应特定平台上不常见的情况。各个平台的指南详细说明了这些字体应如何使用。这些字体仅在特定平台上定义。如果你的应用程序需要跨平台迁移，则需要考虑这一点。


    X11上的 Tk 识别任何合法的 X11 字体名称（例如，查看 `xlsfonts` 命令）。然而，这些会随着操作系统、安装的软件以及单台机器的配置而异。无法保证你的
    X11 系统可用的字体已安装在任何其他 X11 系统上。


    在 Windows 上，Tk 为“显示”控制面板中可以设置的所有字体提供了命名字体。它识别以下字体名称：system, ansi, device, systemfixed,
    ansified 和 oemfixed。


    在 macOS 上，Apple 人类机界面指南 (HIG) 规定了许多额外的字体。Tk 识别以下名称：systemSystemFont, systemSmallSystemFont,
    systemApplicationFont, systemViewsFont, systemMenuItemFont, systemMenuItemCmdKeyFont,
    systemPushButtonFont, systemAlertHeaderFont, systemMiniSystemFont, systemDetailEmphasizedSystemFont,
    systemEmphasizedSystemFont, systemSmallEmphasizedSystemFont, systemLabelFont,
    systemTitleFont, systemMenuItemMarkFont, systemWindowTitleFont, systemUtilityWindowTitleFont,
    systemToolbarFont, 和 systemDefaultSystemFont。


    # **使用命名字体**


    Tk 提供了若干与命名字体协作的操作。你可以从获取所有当前定义的字体列表开始。


    ```

    from tkinter import font

    font.names()

    ```


    你可以找到由抽象命名字体代表的实际字体。


    ```

    >>> from tkinter import font

    >>> f = namofont(''TkTextFont'')

    {''family'': ''AppleUIFont'', ''size'': 13, ''weight'': ''normal'', ''slant'':
    ''roman'', ''underline'': 0, ''overstrike'': 0}

    >>> f.metrics()

    {''ascent'': 13, ''descent'': 3, ''linespace'': 16, ''fixed'': 0}

    >>> f.measure(''The quick brown fox'')

    124

    ```


    Tkinter 提供了一个 Font 类来存储有关命名字体的信息。你可以通过 namofont 函数从字体名称创建类的实例。当你在应用程序中使用命名字体（例如通过
    label 的字体选项）时，你可以提供字体名称（作为字符串）或 Font 实例。


    > 在交互式 shell 中尝试这些操作并报错？即使我们没有在屏幕上显示，在使用各种函数之前需要初始化 Tk。


    你还可以创建自己的字体，然后像使用预定义字体一样使用它们。为此，为字体名称并像上面一样指定其属性。


    ```

    from tkinter import font

    highlightFont = font.Font(family=''Helvetica'', name=''HighlightFont'', size=12,
    weight=''bold'')

    ttk.Label(root, text=''Attention!'', font=highlightFont).grid()

    ```


    如果你没有提供名称，Tkinter 将生成一个，你可以通过 font.name 或 `str(font)` 获取它。通常最好提供一个。family 指定字体。Tk
    知道 Courier、Times 和 Helvetica 是可用的，尽管它们可能被映射到相应的等宽、衬线或无衬线字体。安装在你系统上的其他字体也可以使用，但通常的移植性警告仍然适用。你可以通过以下命令获取所有可用族的名称：


    ```

    font.families()

    ```


    > 你可以使用 `configure` 方法更改命名字体的属性。你可能会为了响应允许用户放大或缩小的选项而这样做，即增加或减少字体大小。


    # 字体描述


    指定字体的另一种方法是通过属性列表。它从字体族开始，然后可选地包含大小，以及一个或多个样式选项。一些示例包括 Helvetica、Helvetica 12、Helvetica
    12 bold 以及 Helvetica 12 bold italic。这些字体描述可以用于任何你使用命名字体的地方，例如字体配置选项。


    '
