    \n在此过程中，几何管理器必须平衡多个约束条件。考虑这些情况：\n\n- 组件可能有一个自然尺寸，例如，标签的自然宽度取决于它显示的文本和用于显示它的字体。如果包含所有这些不同组件的应用程序窗口不够大以容纳它们怎么办？几何管理器必须决定缩小哪些组件、缩减多少等。\n\
