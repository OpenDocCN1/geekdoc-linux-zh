  mdcn: '


    此 API 最初针对 Tk 8.6 设计，此后已回移植到 Tk 8.5.9。如果你使用的是更早版本的 Tk，获取这些信息会稍微困难。


    可以通过以下方式切换到新主题：


    ```

    s.theme_use(''thetheme'')

    ```


    这实际上执行了什么？显然，它将当前主题设置为指定的主题。因此，这样做会把所有当前可用的样式替换为该主题定义的一组样式。最后，它会刷新所有小部件，使它们采用新主题所描述的外观。


    # 第三方主题


    通过自行寻找，你可以找到一些可以下载的附加主题。一个很好的起点是 https://wiki.tcl.org/page/List+of+tk+Themes。


    虽然主题可以用 Tk 支持的任何语言来定义，但你找到的大多数主题都是用 Tcl 编写的。你该如何安装它们以便在你的应用程序中使用呢？


    举个例子，让我们使用“awkward”主题，该主题可以从 https://sourceforge.net/projects/tcl-awhemes/ 获取。在某处下载并解压
    awhemes*.zip 文件。你会发现它包含许多 .tcl 文件、一个包含主题使用的许多图像的子目录等。其中一个文件命名为 `pkgIndex.tcl`。它将其标识为一个
    Tcl 包，类似于模块。如果你查看内部，你会看到许多类似 `needed` 的行。这里，awkward 是包的名字，7.7 是它的版本号。为了让单个 `pkgIndex.tcl`
    文件提供多个包并使用它，我们需要告诉 Tcl 在哪里找到该包（将其目录添加到 Tcl 的 `auto_path` 中）以及要使用的包名。


    ```

    tk::append autopath ''/path/to/awhemes''

    tk::require ''awkward''

    ```


    如果主题被实现为单个 Tcl 源文件且没有 `pkgIndex.tcl`，你可以通过以下方式使其变为可用：


    ```

    tk::source ''/path/to/theme.tcl''

    ```


    你现在应该能够在自己的应用程序中使用该主题了，就像使用任何其他内置主题一样。


    ## 17.2. 使用样式


    现在我们将处理更棘手的问题：如何在应用程序中充分利用样式和主题，而不仅仅是使用现有主题对其进行“换肤”。


    ### 定义


    我们首先需要引入几个概念。


    ### 小部件类 (Widget Class)


    *小部件类*标识特定小部件的类型，无论是按钮、标签、画布等。所有带主题的小部件都有默认类。按钮具有 `TButton` 类，标签具有 `TLabel` 类，等。


    ### 小部件状态 (Widget State)


    *小部件状态*允许单个小部件具有多种一种外观或行为，取决于鼠标位置、应用程序设置的不同选项等。正如你所记得，所有带主题的小部件都维护着一组状态标志，通过 `state`
    和 `instance` 方法访问。这些标志是：`active, disabled, focus, pressed, selected, background,
    alternate, and invalid`。所有小部件都具有同一组状态标志，尽管它们可能会忽略其中某些一个（例如，标签小部件可能会忽略 `invalid`
    状态）。请参阅参考手册中的 `themed widget` 页面获取每个状态标志的精确含义。


    - https://tkdocs.com/man/ttk_widget


    ### 样式 (Style)


    *样式*描述了一个小部件类的外观（或多种外观）。具有相同小部件类的所有主题小部件将具有相同的外观。样式通过它们所描述的小部件类的名称来引用。例如，样式 TButton
    定义了所有类为 TButton 的小部件的外观。样式感知不同的状态，一个样式可以根据小部件的状态定义不同的外观。例如，样式可以指定如果设置了 pressed
    状态标志，小部件的外观应该改变。


    ### 主题


    在应用程序中使用特定主题意味着默认情况下，每个小部件的外观将由主题中负责该类的样式控制。


    ### 样式名称


    每个样式都有一个名称。如果你要修改样式、创建一个新样式或为小部件使用样式，你需要知道它的名称。你如何知道样式的名称？如果你有一个特定的小部件，并想知道当前使用的是什么样式，可以先检查其样式配置选项的值。如果为空，则该小部件使用的是该小部件的默认样式。你可以通过小部件的类来检索它。例如：


    ```

    >>> b = ttk.Button()

    >>> b[''style'']

    ''''

    >>> b.winfo_class()

    ''TButton''

    ```


    在这种情况下，使用的样式是 TButton。其他主题小部件的默认样式命名也类似，例如 TEntry、TLabel 等。检查具体细节总是明智的。例如，treeview
    小部件的类是 Treeview，而不是 ttk。


    除了默认样式外，样式可以命名为任何名称。你可以创建自己的样式（或使用带有某种样式的主题），命名为 FunButton、NuclearReactorButton，甚至是
    GuessWhatIAM（这不是一个明智的选择）。更多时候，你会发现诸如 Fun.TButton 或 NuclearReactor.TButton 这样的名称，它们暗示了基础样式的变体；正如你将看到的，这是
    Tk 支持的创建和修改样式的功能。


    目前不支持检索所有可用样式列表。这可能会在 Tk 8.7 中以新命令 `ttk::style theme styles` 的形式出现，该命令将返回由主题实现的样式列表。它还建议为所有小部件添加样式，这样你不需要检查小部件的样式配置选项及其类。参见
    TIP #584 (https://tip.tcl.tk/584)。


    # 应用样式


    使用样式将该样式应用到单个小部件。如果你知道想使用的样式的名称以及要将其应用到哪个小部件，这很容易。在创建时设置样式：


    ```

    b = ttk.Button(parent, text=''Hello'', style=''Fun.TButton'')

    ```


    同样，也可以随时样式配置选项更改小部件的样式：


    ```

    b[''style''] = ''Emergency.TButton''

    ```


    # 创建简单样式


    我们要创建一个像 Emergency.TButton 的新样式吗？在这种情况下，在现有样式前加上另一个名称（Emergency）并跟一个点可以创建一个自该样式的新样式。新样式将具有与其完全相同的选项，除了指示的差异：


    ```

    s.configure(''Emergency.TButton'', font=''Helvetica 24'', foreground=''red'',
    padding=10)

    ```


    现在你可以通过样式配置选项将该样式应用到特定的按钮，如之前所示。其他按钮将保持其正常外观。


    你如何知道给定样式具有哪些选项？这需要深入了解样式。


    ![](img/e444c319ec162f00278651bee8c21d_251_0.png)


    你可能使用了经典小部件的代码并想将其迁移到主题小部件。大多数通过配置选项对小部件进行的外观修改都可以放弃。对于那些不能放弃的，你可能需要创建一个新样式。状态更改可以用类似的方法处理。在经典
    Tk 中，小部件通过配置选项支持一些状态更改。例如，将按钮的状态选项设置为 disabled 将其以带有灰色的标签绘制出来。某些允许额外的状态 active，它代表不同的外观。你可以通过额外的配置选项控制小部件在不同状态下的外观，例如
    foreground、disabledforeground 和 activeforeground。


    通过配置选项的状态更改应该改为使用主题小部件的 state 方法。修改特定状态下小部件外观的配置选项应该在样式中处理。


    '
