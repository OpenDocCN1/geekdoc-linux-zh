    ## 16.4. Item Appearance and Events


    Like the text and canvas widgets, the treeview widget uses tags to modify the
    appearance of items in the tree. We can assign a list of tags to each item using
    the tags item configuration option (again, when creating the item or later on).


    Configuration options can be specified on the tag, which will apply to all items
    having that tag. Valid tag options include foreground (text color), background,
    font, and image (not used if the item specifies its own image).


    We can also create event bindings on tags, which lets us capture mouse clicks,
    keyboard events etc.


    ```

    tree.insert('''', ''end'', text=''button'', tags=(''ttk'', ''simple''))

    tree.tag_configure(''ttk'', background=''yellow'')

    tree.tag_bind(''ttk'', ''<1>'', itemClicked)

    # the item clicked can be found via tree.focus()

    ```


    The treeview will generate virtual events <<TreeviewSelect>>, <<TreeviewOpen>>,
    and <<TreeviewClose>>, which allow us to monitor changes to the widget made by
    users. We can use the selection method to determine the current selection (the
    selection can also be changed from your program).


    ## 16.5. Customizing the Display


    There are many aspects of how the treeview widget is displayed that we can customize.
    We''ve already seen some of them, such as the text of items, fonts and colors,
    names of column headings, and more. Here are a few additional ones:


    - Specify the desired number of rows to show using the height widget configuration
    option.

    - Control the width of each column using the column''s width minwidth options.
    The column holding the tree can be accessed with the symbolic name #0. The overall
    requested width for the widget is based on the sum of the column widths.

    - Choose which columns to display and the order to display them using the displaycolumns
    widget configuration option.

    - You can optionally hide one or both of the column headings of the tree itself
    (leaving just the columns) using the show widget configuration option (default
    is "tree headings" to show both).

    - You can specify whether a single item or multiple items can be selected by users
    via the selectmode widget configuration option, passing browse (single item),
    extended (multiple items, the default), or none.


    ## 17. Styles and Themes


    The **themed** aspect of the modern Tk widgets is one of the most powerful and
    exciting aspects of the newer widget set. Yet, it''s also one of the most confusing.


    This chapter explains styles (which control how widgets like buttons look) and
    themes (which are a collection of styles that define how all the widgets in your
    application look). Changing themes can give your application an entirely different
    look.


    ![](img/e444c319ec16222f00278651bee8c21d_241_0.png)


    Note that it''s not just colors that have changed, but the actual shape of individual
    widgets. Styles and themes are **extremely** flexible.


    Why?


    However, before you get carried away, very few applications will benefit from
    switching themes like this. Some games or educational programs might be exceptions.
    Using the standard Tk theme for a given platform will display widgets the way
    that people expect to see them, particularly if they’re running macOS or Windows.


    On Linux systems, there’s less standardization of look and feel. Users expect
    (and are more comfortable with) some variability and "coolness." Because widget
    sets (typically GTK or QT) are used by window managers, control panels, and other
    system utilities, Tk can seamlessly blend with the current settings on any particular
    system. Most of Linux screenshots in this book use Tk''s alt theme. Despite being
    accustomed to variability, there are limits to what most users will accept. The
    styling of core widgets in Tk''s classic widget set, matching circa-1992 OSF/Motif,
    is a prime example.


    Styles and themes, used in a more targeted manner and with significant restraint,
    can have a role in modern applications. This chapter explains why and when you
    might want to use them and how to go about doing so. We’ll begin drawing a parallel
    between Tk’s styles and another realm of software development.


    # Understanding Styles and Themes


    If you’re familiar with web development, you know about cascading stylesheets
    (CSS). There are two ways it can be used to customize the appearance of an element
    in your HTML page. In the first way, you can add a bunch of style attributes (fonts,
    colors, borders, etc.) directly to an element in your HTML code via the example:


    ```

    <label style="color:red; font-size:14pt; font-weight:bold; background-color:yellow;">Meltdown
    imminent!</label>

    ```


    The other way to use CSS is to attach a class to each widget the class attribute.
    The details of how elements of that class appear elsewhere, often in a separate
    CSS file. You can attach the same class to many elements, and they will all have
    the same appearance. You don’t need to repeat the full details for every element.
    More importantly, you separate the logical content of your site (HTML) from its
    appearance (CSS).


    ```

    <label class="danger">Meltown imminent!</label>

    ....

    <style type="text/css">

    label.danger {color:red; font-size:14pt; font-weight:bold;

    background-color:yellow; }

    </style>

    ```


    Back to Tk.


    - In the classic Tk widgets, all appearance customizations require specifying
    each detail on individual widgets, akin to always using the style HTML attribute.

    - In the themed Tk style, all appearance customizations are made via attaching
    a style to a widget, akin to using the class. Unlike HTML, you can freely mix
    and match.


    # Why use styles and themes?


    In the classic widgets, if the widget author hadn''t coded in logic to change
    the font based on its state, you as an application developer were out of luck.
    Using styles, widget authors don''t need to provide code for every possible appearance.
    That not only simplifies the widget but also ensures that a wider range of appearances
    can be set, including those the widget author may not have anticipated.


    Styles also put all appearance decisions in one place. And because styles for
    a widget can share common elements, it promotes consistency and reuse. Styles
    also have many benefits. Widgets delegate appearance decisions to styles.


    ## 17.1. Using Existing Themes


    Before delving into the weightier matters of tastefully and selectively modifying
    and applying styles to improve the usability of your application and cleanliness
    of your code, let''s deal with the fun bits: using existing themes to completely
    reskin your application.


    Themes are identified by a name. You can obtain the names of all available themes:


    ```

    >>> s = ttk.Style()

    >>> s.theme_names()

    (''aqua'', ''step'', ''clam'', ''alt'', ''default'', ''classic'')

    ```


    > Tkinter encapsulates all style manipulations in the ttk.Style class. We''ll
    require then an instance of that class for this and other operations.


    Built-in themes.


    Besides the built-in themes (alt, default, clam, and classic), macOS includes
    a theme named aqua to match the system-wide style, while Windows includes themes
    named vista, winxpnative, and wininnative.


    Only one theme can ever be active at a time. To obtain the name of the theme currently
    in use, use the following:


    ```

    >>> s.theme_use()

    ''aqua''

    ```

