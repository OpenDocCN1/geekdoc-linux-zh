    \ an integer or a valid zip or postal code.\n\nYour program can specify what makes\
    \ an entry valid or invalid, as well as to check its validity. As we'll see, the\
    \ two are related. We'll start with a simple example, an entry that can only hold\
    \ up to five digits long.\n\nThe validation criteria is specified via an entry's\
    \ validatecommand configuration option. You supply a piece of code whose job is\
    \ to validate the entry. It functions like a widget callback or event binding,\
    \ except that it returns a value (whether or not the entry is valid). We'll arrange\
    \ to validate the entry on any keystroke, which is specified by providing a value\
    \ of key to the validate configuration option.\n\n```\nimport re\ndef check_num(newval):\n\
    \    return re.match('^[0-9]*$', newVal) is not None and \\\n    len(newval) <=\
    \ 5\ncheck_num_wrapper = (root.register(check_num), '%P')\n\nnum = StringVar()\n\
    e = ttk.Entry(root, textvariable=num, validate='key',\nvalidatecommand=check_num_wrapper)\n\
    e.grid(column=0, row=0, sticky='we')\n```\n\n![](img/e444c319ec16222f00278651bee8c21d_85_0.png)\n\
    \nA few things are worth noting. First, as with event bindings, we can access\
    \ more information about the conditions that triggered the validation via percent\
    \ substitutions. We used one of these: %P is the new value of the entry if the\
    \ validation passes. We use a simple regular expression and a length check to\
    \ determine if the change is valid. To reject the change, our validation command\
    \ can return a false value, and the entry will remain unchanged.\n\nTaking advantage\
    \ of these percent substitutions requires a bit of gymnastics. You will recall\
    \ that Tkinter abstracts away percent substitutions in event binding callbacks.\
    \ There, all of the event parameters are wrapped into an event object which is\
    \ always passed to the callback. There's not equivalent abstraction to choose\
    \ which percent substitutions we're interested in. The register method (which\
    \ can be called on any widget, not just root) creates a Tk procedure which will\
    \ call our Python function. The percent substitutions we've chosen will be passed\
    \ to it as parameters.\n\nLet's extend our example so that the entry will accept\
    \ a US zip code, formatted as ##### ###### (\"#\" can be any digit). We'll still\
    \ do some validation on each keystroke (allowing only entry numbers or a hyphen).\
    \ However, we can no longer fully validate the entry on every keystroke; if they've\
    \ typed the first digit, it's not valid yet. So validation will only happen when\
    \ the entry loses focus (e.g., a user tabs away from it). Tk refers to this as\
    \ revalidation, in contrast with prevalidation (accepting changes on each keystroke).\n\
    \nHow should we respond to errors? Let's add a message reminding users of our\
    \ format. It will appear if they type a wrong key or tab away from the entry when\
    \ it's not holding a valid zip code. We'll remove the message when they return\
    \ to the entry or type a valid key. We'll also add a (dummy) button to \"process\"\
    \ the zip code, which will be disabled unless the zip entry is valid. Finally,\
    \ we'll also add a \"name\" entry so they can tab away from the entry.\n\n```python\n\
    import re\nerrsmg = StringVar()\nformatmsg = \"Zip should be ##### or #####-####\"\
    \n\ndef check_zip(newval, op):\n    errsmg.set('')\n    valid = re.match('^[0-9]{5}(\\\
    -[0-9]{4})?$', newVal) is not None\n    if not valid:\n        btn.state(['disabled'\
    \ if valid else ['disabled'])\n    if op=='key':\n        ok_so_far = re.match('^[0-9]*$',\
    \ newVal) is not None\n        if len(newval) <= 10:\n            if not ok_so_far:\n\
    \                errsmg.set(formatmsg)\n        return ok_so_far\n    elif op=='focusout':\n\
    \        if not valid:\n            errsmg.set(valid)\n        return valid\n\
    check_zip_wrapper = (root.register(check_zip), '%P', '%V')\n\nzip = StringVar()\n\
    f = ttk.Frame(root)\nf.grid(f, column=0, row=0, pady=0)\nttk.Label(f, text='Name:').grid(column=0,\
    \ row=0, padx=5, pady=5)\nttk.Entry(f, column=1, row=0, padx=5, pady=5)\nttk.Label(f,\
    \ text='Zip:').grid(column=0, row=1, padx=5, pady=5)\ne = ttk.Entry(f, variable=zip,\
    \ validate='all',\nvalidatecommand=check_zip_wrapper)\ne.grid(column=1, row=1,\
    \ padx=5, pady=5)\nbtn = ttk.Button(f, text=\"Process\")\nbtn.grid(column=2, row=1,\
    \ padx=5, pady=5)\nbtn.state(['disabled'])\n```\n\n```python\nmsg = ttk.Label(f,\
    \ font='TkSmallCaptionFont',\nforeground='red', textvariable=errmsg)\nmsg.grid(column=1,\
    \ row=2, padx=5, pady=5, sticky='w')\n```\n\nhttps://tkdocs.com/code/validate.py\n\
    \nNotice that the validate option has been changed from key to all. That arranges\
    \ for the validatecommand callback to be invoked on only keystrokes but other\
    \ triggers. The trigger is passed to the callback using the %v percent substitution.\
    \ The callback differentiated between key and focusout triggers (you can also\
    \ check for focusin).\n\n-   There's a few more things to know about validation.\
    \ First, if validatecommand ever generates an error (or doesn't return a boolean),\
    \ validation will be disabled for that widget. Your callback can modify the entry,\
    \ e.g., change its textvariable. You can ask the widget to validate at any time\
    \ by calling its %validate method, which returns true if validation passes (%v\
    \ substitution is set to forced).\n\nThere is an invalidcommand configuration\
    \ option (which works like validatecommand) that is called whenever validation\
    \ fails. You can use it to accomplish nasty things like forcing the focus back\
    \ on the widget that didn't validate. In practice, it's rarely used. As mentioned\
    \ earlier, the entry's invalid state flag (which can be checked via the instance\
    \ invalid method) is automatically updated as validation succeeds or fails.\n\n\
    Other percent substitutions allow you to get the entries prior to editing (%s),\
    \ differentiate between insert and delete (%d), where an insert or delete occurs\
    \ (%i), what is being inserted or deleted (%s), the current setting of the validate\
    \ option (%v) and the name of the widget (%w).\n\n# 6.7. Combobox\n\nttk.Combobox\n\
    https://tkdocs.com/man/combobox\n\nA combobox widget combines an entry with a\
    \ list of choices. This lets users either choose from a set of values you've provided\
    \ (e.g., typical settings), but also put in their own (e.g., for common cases).\n\
    \n![](img/e444c319ec16222f00278651bee8c21d_88_0.png)\n\nComboboxes are created\
    \ using the ttk.Combobox class:\n\n```python\ncountryvar = StringVar()\ncountry\
    \ = ttk.Combobox(parent, textvariable=countryvar)\n```\n\nLike entries, the textvariable\
    \ option links a variable in your program to the current value of the combobox.\
    \ As other widgets, you should initialize the linked variable in your code.\n\n\
    A combobox will generate a <<Combobox>> event that you can bind to whenever value\
    \ changes. (You could also trace changes on the textvariable, as we've seen in\
    \ the previous widgets. Binding to the event is more straightforward, and so tends\
    \ to be our preferred choice.)\n\n```python\ncountry.bind('<<ComboboxSelected>>',\
    \ function)\n```\n\n# Predefined Values\n\nYou can provide a list of values that\
    \ users can choose from using the `values` configuration option:\n\n```python\n\
    country['values'] = ('USA', 'Canada', 'Australia')\n```\n\nIf set, the `readonly`\
    \ state flag will restrict users to making choices only from the list, but not\
    \ be able to enter their own (though if the current value of the combobox is not\
    \ in the list, it won't be changed).\n\n```python\ncountry.state([\"readonly\"\
    ])\n```\n\n> If you're using the combobox in `readonly` mode, I recommend that\
    \ when the value changes (i.e., on a `<<ComboboxSelected>>` event), you call the\
    \ `selection_clear` method. It looks a bit odd visually without doing that.\n\n\
    You can also get the current value using the `get` method, and change the current\
    \ value using the `set` method (which takes a single argument, the new value).\n\
    \nAs a complement to the `get` and `set` methods, you can also use the `current`\
    \ method to determine which item in the predefined list is selected. Call `current`\
    \ with no arguments; it will return a 0-based index into the list, or -1 if the\
    \ current value is not in the list. You can select an item in the list by calling\
    \ `current` with a single 0-based index.\n\n> Want to associate some other value\
    \ with each item in the list so that your program can use one internally, but\
    \ gets displayed in the combobox as something else? You'll want to have a look\
    \ at the section \"Keeping Extra Item Data\" when we get to the discussion of\
    \ listboxes in a couple of chapters from now.\n"
