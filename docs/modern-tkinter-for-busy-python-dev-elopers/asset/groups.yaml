    ## 10.1. Menubars


    In this section, we''ll look at menubars: how to create them, what goes in them,
    how they''re used, etc.


    Properly designing a navbar and set of menus is beyond the scope of this book.
    However, if you''re creating an application for someone other than yourself, here
    is a bit of advice. If you find yourself with many menus, very long menus, or
    deeply nested menus, you may need to rethink how your user interface is organized.
    Second, many people use the menus to explore what the program can do, particularly
    when they''re first learning it, so to ensure major features are accessible by
    the menus. Finally, for each platform you''re targeting, become familiar with
    how applications use menus, and consult the platform''s human interface guidelines
    for full details about design, terminology, shortcuts, and much more. This is
    an area you will likely have to customize for each platform.


    ![](img/e444c319ec16222f00278651bee8c21d_142_0.png)


    Menubars.


    > You''ll notice on some recent Linux distributions that many applications show
    their menus at the top of the screen when, rather than in the window itself. Tk
    does not support this style of menus.


    ## Menu Widgets and Hierarchy


    ### Menu


    https://tkdocs.com/man/menu


    Menus are implemented as widgets in Tk, just like buttons and entries. Each menu
    widget consists of a different number of items in the menu. Items have various
    attributes, such as the text to display for the item, a keyboard accelerator,
    and a command to invoke.


    Menus are arranged based on. "File" "Edit", etc., each of which is a submenu containing
    more items. These items can include things like the "Open..." command in a "File"
    menu, but also separators between other items. (so-called cascading menus). As
    you''d expect from other things you''ve seen already in Tk, whenever you have
    a submenu, it must be created as a child of your parent menu.


    Menus are part of the classic Tk widgets; there is not presently a menu in the
    themed Tk widget set.


    ### Before you Start


    It''s essential to put the following line in your application somewhere before
    you start creating menus.


    ```

    root.option_add(''*tearOff'', FALSE)

    ```


    Without it, each of your menus (on Windows and X11) will start with what looks
    like a dashed line and allows you to "tear off" the menu, so it appears in its
    own window. You should eliminate tear-off menus from your application as they''re
    not part of any modern user interface style.


    > This is a throw-back to the Motif-style X11 that Tk''s original look and feel
    were based on. Get rid of them unless your application is designed to run only
    on that old box collecting in the basement. We''ll look forward to a future version
    of Tk where this misguided paean to backward compatibility is removed.


    While on the topic of ancient history, the option_add bit uses the option database.
    On X11 systems, this provided a standardized way to customize certain elements
    of user interfaces through text-based configuration files. It''s no longer used
    today. Older Tk programs may use the option command internally to separate style
    configuration options from widget code. This all-themed Tk styles, which should
    be used for that purpose today. However, it''s something fitting to use the obsolete
    option database to automatically remove the obsolete tear-off menus.


    ### Creating a Menubar


    In Tk, menbars are associated with individual windows; each toplevel window can
    have at most one menubar. On Windows and many X11 window managers, this is visually
    obvious, as the menus are part of each window, sitting just below the title bar
    at the top.


    On macOS, though, there is a single menubar along the top of the screen, shared
    by each window. As far as your Tk program is concerned, each window still has
    its own menubar. As you switch between windows, Tk ensures the correct menubar
    is displayed. If you don''t specify a menubar for a particular window, Tk will
    use the menubar associated with the root window; you''ll noticed by now that this
    is automatically created for when your Tk application starts.


    > Because all windows have a menubar on macOS, it''s important to define one,
    either for each window or a fallback menubar for the root window. Otherwise, you''ll
    end up with the "built-in" menubar, which contains menus that are only intended
    for typing commands directly into the interpreter.


    To create a menubar for a window, first create a menu widget. Then, use the window''s
    menu configuration option to attach the menu widget to the window.


    ```

    win = Toplevel(root)

    menubar = Menu(win)

    win[''menu''] = menubar

    ```


    > You can use the same menubar for more than one window. In other words, you can
    specify the same menubar as the menu configuration for several toplevel windows.
    This is particularly useful on Windows and X11, where you may want a window to
    include a menu, but don''t necessarily need to juggle different menus in your
    application. However, if the contents or state of menu items depends on what''s
    going on in the active window, you''ll have to manage this yourself.


    > This is truly ancient history, but menbars used to be implemented by creating
    a frame widget containing the menu items and packing it into the top of the window
    like any other widget. Hopefully, you don''t have any code or documentation that
    still does this.


    ### Adding Menus


    We now have a restar, but that''s pretty useless without some menus to go in it.
    Again, we''ll create a menu widget for each menu, each one child of the restar.
    We''ll then add them all to them menubar.


    ```

    menubar = Menu(parent)

    menu_file = Menu(menubar)

    menu_edit = Menu(menubar)

    menubar.add_cascade(menu=menu_file, label=''File'')

    menubar.add_cascade(menu=menu_edit, label=''Edit'')

    ```


    > FYI The add_cascade method adds a menu item, which itself is a menu (a submenu).


    ### Adding Menu Items


    Now that we have a couple of menus in our menubar, we can add a few items to each
    menu.


    ### Command Items


    Regular menu items are called command items in Tk. We''ll see some other types
