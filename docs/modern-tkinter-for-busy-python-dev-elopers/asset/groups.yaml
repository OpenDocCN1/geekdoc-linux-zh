    \ (0 is o'clock position)\n- extent: how many degrees \"wide\" the arc should\
    \ be, positive for counter-clockwise from the start, negative for clockwise\n\
    - style: one of pies (the default), arc (draws just the outer perimeter), or chord\
    \ (draws the area between the start and end points).\n\n```\ncanvas.create_arc(10,\
    \ 10, 200, 150, fill='yellow', outline='black', start=45, extent=135)\n```\n\n\
    ## Image\n\nImage items can display arbitrary images. By default, the item is\
    \ centered at the coordinates you specify, but this can be changed with anchor\
    \ option, e.g., nw means where to put the top-left of the image. There's also\
    \ a bitmap type for images having only two colors, which can be changed via foreground\
    \ and background.\n\n## Text\n\nText items can display a block of text. Automatically\
    \ wrapped into multiple lines by providing a width attribute to represent the\
    \ maximum width of a line. The alignment of multiple lines of text can be set\
    \ using justify attribute, which can be one of left (default), right, or center.\
    \ Text items can display a block of text. Positioning the text works the same\
    \ as image items. Specify the text to display using the text attribute. All of\
    \ the text in the item will have the same color (specified by fill attribute)\
    \ and the same font (specified by font attribute).\n\n```\ncanvas.create_text(100,\
    \ 100, text='A wonderful story', anchor='nw', font='Tk', fill='red')\n```\n\n\
    ## Widget\n\nOne of the coolest things you can do with the canvas widget is to\
    \ embed other widgets inside it. This can be a button, an entry, a listbox, a\
    \ frame containing a complex set of widgets... anything! Remember when we said\
    \ back a canvas widget could act as geometry manager? This is what we mean. Canvas\
    \ items that display other widgets are known as window items (Tk's terminology\
    \ for widgets). They are positioned like text and image items. You can give them\
    \ explicit width and height attributes; they default to the widget's size. Finally,\
    \ it's important that the widget you're placing on the canvas (via the window\
    \ attribute) be a child widget of the canvas.\n\n```\nb = ttk.Button(canvas, text='Click!')\n\
    canvas.create_window(10, 10, anchor='nw', window=b)\n```\n\n## Modifying Items\n\
    \nWe've seen how you can modify the options on an item — its color, width, etc.\
    \ There are several other things you can do with items.\n\n- To delete items,\
    \ use the delete method.\n- To change an item's size and position, you can use\
    \ the coords method. You supply new coordinates for the item, specified the same\
    \ way when you created it. Calling this method without a new set of coordinates\
    \ will return the current coordinates of the item.\n- To move one or more items\
