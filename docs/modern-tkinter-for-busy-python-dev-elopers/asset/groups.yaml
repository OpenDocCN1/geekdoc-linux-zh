    # ## 8.1. Listbox


    +   * [Listbox](https://tkdocs.com/man/textbox)


    A listbox widget displays a list of single-line text items, usually lengthy, and
    allows users to browse through the list, selecting one or more.


    Listboxes are part of the classic Tk widgets; there is not presently a listbox
    in the themed Tk widget set.


    > Tk''s treeview widget (which is themed) can also be used as a listbox (a one
    level deep tree), allowing you to use icons and styles with the list. It''s also
    likely that a multi-column (table) list widget will make it into Tk at some point,
    whether based on treeview or one of the available extensions.


    | macOS | Windows | Linux |

    |---|---|---|

    | Tcl | Tcl | Tcl |

    | Ruby | Ruby | Ruby |

    | Python | Python | Python |

    | Perl | Perl | Perl |

    | Lua | Lua | Lua |

    | Lisp | Lisp | Lisp |

    | Caml | Caml | Caml |

    | Erlang | Erlang | Erlang |


    Listbox widgets.


    Listboxes are created using the Listbox class. A height option can specify the
    number of lines the listbox will display at a time without scrolling:


    ```

    1 = Listbox(parent, height=10)

    ```


    # ## Populating the Listbox Items'
  - '[PAGE 108]


    There''s an easy way and a hard way to populate and manage all the items in the
    listbox.


    Here''s the easy way. Each listbox has a listvariable configuration, which allows
    you to link a variable (which must hold a list) to the listbox. Each element of
    this list is a string representing one item in the listbox. To add, remove, or
    rearrange items in the listbox, you can simply modify this variable as you would
    any other list. Similarly, to find out, e.g., which item is on the third line
    of the listbox, just look at the third element of the list variable.


    It''s actually not quite that easy. Tkinter doesn''t allow you to link regular
    Python lists to a listbox. As we saw with widgets like entry, we need to use a
    StringVar as an intermediary. It provides a mapping between Python''s lists and
    a string representation that the underlying Tk widgets can use. It also means
    that anytime we change the list, we need to update the StringVar.


    ```

    choices = ["apple", "orange", "banana"]

    choicesvar = StringVar(value=choices)

    l = Listbox(parent, listvariable=choices)

    ...

    choices.append("peach")

    choicesvar.set(choices)

    ```


    The older, harder way to do things is to use a set of methods that are part of
    the listbox widget itself. They operate on the (internal) list of items maintained
    by the widget:


    +   * The insert idx item ?item?... method is used to add one or more items to
    the list; idx is a 0-based index indicating the position of the item before the
    item(s) should be added; specify end to put the new items at the end of the list.


    +   * The delete first ?last? method to delete one or more items from the list;
    first and last are indices as per the insert method.


    +   * Use the get first ?last? method to return the contents of a single item
    at the given position, or a list of the items between first and last.'
  - '[PAGE 109]


    +   - The size method returns the number of items in the list.


    The reason there is a hard way at all is because the variable option was only
    introduced in Tk 8.3. Before that, you were stuck with the hard way. Because using
    the list variable lets you use all the standard list operations, it provides a
    much simpler API. It''s certainly an upgrade worth considering if you have listboxes
    doing the older way.


    # Selecting Items


    You can choose whether users can select only a single item at a time from the
    listbox, or multiple items can simultaneously be selected. This is controlled
    by the selectmode option: the default is only being able to select a single item
    (browse), while a selectmode of extended allows users to select multiple items.


    The names browse and extended, again for backward compatibility reasons, are truly
    awful. This is made worse by the fact that there are two other modes, single and
    multiple, which you should not use (they use an old interaction style that is
    inconsistent with modern user interface and platform conventions).


    To find out which item or items in the listbox are currently selected, use the
    selection method. It returns a list of indices of all items currently selected;
    this may be an empty list. For lists with selectmode of browse, it will never
    be longer than one item. You can also use the selection_includes index method
    to check if the item with the given index is currently selected.


    ```

    if lbox.selection_includes(2): ...

    ```


    To programmatically change the selection, you can use the selection_clear first
    ?last? method to deselect every single item or within the range of indices specified.
    To select an item or all items in a range, use the selection_set ?last? method.
    Both of these will not touch the selection of any items outside the range specified.'
  - '[PAGE 110]


    If you change the selection, you should also make sure that the newly selected
    item is visible (i.e., it is not scrolled out of view). To do this, use the `see
    index` method.


    ```

    lbox.selection_set(idx)

    lbox.see(idx)

    ```


    When a user changes the selection, a <<ListboxSelect>> virtual event is generated.
    You can bind to this to take any action you need. Depending on your application,
    you may also want to bind to a double-click `<Double-1>` event and it to invoke
    an action with the currently selected item.


    ```

    lbox.bind("<<ListboxSelect>>", lambda e:

    updateDetails(lbox.selection())

    lbox.bind("<<Double-1>>", lambda e:

    invokeAction(lbox.selection()))

    ```


    # Stylizing the List


    Like most of the "classic" Tk widgets, you have immense flexibility in modifying
    the appearance of a listbox. As described in the [reference manual](https://docs.python.org/3/library/tkinter.list.html),
    you can modify the font listbox items are displayed in, the foreground (text)
    and background colors for items in their normal state, selected, when the widget
    is disabled. There is also an `configure` method that allows you to change the
    foreground and background colors of individual items.


    As is the case, restraint is useful. Generally, the default values will be entirely
    suitable and a good match for platform conventions. In the example we''ll get
    to momentarily, we will show how restrained use of these options can be to good
    effect, in this case displaying alternate lines of the listbox in slightly different
    colors.


    # Keeping Extra Item Data


    The `listvariable` (or the internal list, if you''re managing things the old way)
    holds the strings that will be shown in the listbox. It''s often the case, though,
    each string you''re displaying is associated'
  - '[PAGE 111]


    with some data item. This might bean internal object that is meaningful to your
    program, but not meant to be displayed to users. In other words, what you''re
    really interested in is not so much the string displayed in the listbox, but the
    associated data item. For example, a listbox may display a list of names to users,
    but your program is really interested in the underlying user object (or id number)
    for each one, not the particular name.


    How can we associate this underlying value with the name that is displayed? Unfortunately,
    the listbox widget doesn''t offer any facilities, so it''s something we''ll have
    to manage separately. There are a couple of obvious approaches. First, if the
    displayed strings are guaranteed unique, you could use a hash table to map each
    name to its associated underlying object. This wouldn''t work well for peoples''
    names, where duplicates are possible, but could work for countries, which are
    unique.


    A second approach is to keep a second list, parallel to the list of strings. This
    second list will hold the underlying object associated with each item that is
    displayed. So the first item in the displayed strings corresponds to the first
    item in the underlying objects list, the second to the second, etc. Any changes
    that you make in one list (insert, delete, reorder), you must make in the other.
    You can then easily map from the displayed list item to the underlying object,
    based on their position in the list.


