    to Tcl''s auto_path) and the name of the package to use.


    ```

    root.tcl.call(''append'', ''auto_path'', ''/full/path/to/awhemes-9.3.1'')

    root.tcl.call(''package'', ''require'', ''awkward'')

    ```'
