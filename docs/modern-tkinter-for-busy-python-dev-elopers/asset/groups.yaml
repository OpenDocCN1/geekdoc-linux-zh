    is similar to a Python module. If we look inside, you''ll see a bunch of lines
    like package needed awkward 7.7. Here, awkward is the name of the package, and
    7.7 is its version number. It''s not unusual, as in this case, for a single pkgIndex.tcl
    file to provide several packages.


