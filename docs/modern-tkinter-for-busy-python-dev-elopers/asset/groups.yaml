    # 7.5. Padding


    Normally, each column or row will be directly adjacent to the next, so that widgets
    will be right next to each other. This is sometimes you want (think of a listbox
    and its scrollbar), but often you want some space between widgets. In Tk, this
    is called padding, and there are several ways you can choose to add it.


    We''ve already actually seen one way, and that is using a widget''s own options
    to add the extra space around it. Not all widgets have this, but one that is a
    frame; this is useful frames are most often used as the master to other widgets.
    The frame''s padding option lets you specify a bit of extra padding inside the
    frame, which adds the same amount for each of the four sides or even different
    for each.


    A second way is using the padx and pady options when adding the widget. As you''d
    expect, padx puts a bit of extra space to the left and while pady adds extra space
    top and bottom. A single value for the option puts puts the same padding on both
    left and right (or top and bottom), while a two-value list lets you put different
    amounts on left and right (or top and bottom). Note that this extra padding is
    within the grid cell containing the widget.


    If you want to add padding around an entire row or column, the columnconfigure
    and rowconfigure methods accept a pad option, which will do this for you.


    Let''s add the extra sticky, resizing, and padding behavior to our example (adds
    in bold).


    ```

    from tkinter import *

    from tkinter import ttk


    root = Tk()


    content = ttk.Frame(root, padding=(3,13,12,12))

    frame = ttk.Frame(content, borderwidth=5, relief="ridge", width=200, height=100)

    namelbl = ttk.Label(content, text="Name")

    name = ttk.Entry(content)

    ```'
