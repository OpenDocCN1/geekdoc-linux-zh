    \ which specifies a minimum size which you really don't want the column or row\
    \ to shrink beyond.\n\n## 7.5. Padding\n\nNormally, each column or row will be\
    \ directly adjacent to the next, so that widgets will be right next to each other.\
    \ This is sometimes what you want (think of a listbox and its scrollbar), but\
    \ often you want some space between widgets. In Tk, this is called padding, and\
    \ there are several ways you can choose to add it.\n\nWe've already actually seen\
    \ one way, and that is using a widget's own options to add the extra space around\
    \ it. Not all widgets have this, but one that is a frame; this is useful since\
    \ frames are most often used as the master to other widgets. The frame's padding\
    \ option lets you specify a bit of extra padding inside the frame, which adds\
    \ the same amount for each of the four sides or even different for each.\n\nA\
    \ second way is using the `padx` and `pady` options when adding the widget. As\
    \ you'd expect, `padx` puts a bit of extra space to the left and right while `pady`\
    \ adds extra space top and bottom. A single value for the option puts the same\
    \ padding on both left and right (or top and bottom), while a two-value list lets\
    \ you put different amounts on left and right (or top and bottom). Note that this\
    \ extra padding is within the grid cell containing the widget.\n\nIf you want\
    \ to add padding around an entire row or column, the `columnconfigure` and `rowconfigure`\
    \ methods accept a `pad` option, which will do this for you.\n\nLet's add the\
    \ extra sticky, resizing, and padding behavior to our example (adds in bold).\n\
    \n```python\nfrom tkinter import *\nfrom tkinter import ttk\n\nroot = Tk()\n\n\
    content = ttk.Frame(root, padding=(3,13,12,12))\nframe = ttk.Frame(content, borderwidth=5,\
    \ relief=\"ridge\", width=200, height=100)\nnamelbl = ttk.Label(content, text=\"\
    Name\")\nname = ttk.Entry(content)\n```\n\n```python\nonevar = BooleanVar()\n\
    twovar = BooleanVar()\nthreevar = BooleanVar()\n```\n\n```python\nonevar.set(True)\n\
    twovar.set(False)\nthreevar.set(True)\n```\n\n```python\none = ttk.Checkbox(content,\
    \ text=\"One\", variable=onevar, onvalue=True)\ntwo = ttk.Checkbox(content, text=\"\
    Two\", variable=twovar, onvalue=True)\nthree = ttk.Checkbox(content, text=\"Three\"\
    , variable=threevar, onvalue=True)\nok = ttk.Button(content, text=\"Okay\")\n\
    cancel = ttk.Button(content, text=\"Cancel\")\n```\n\n```python\ncontent.grid(column=0,\
    \ row=0, sticky=\"N, S, E, W\")\nframe.grid(column=0, row=0, columnspan=3, rowspan=2,\
    \ sticky=(N, S, E, W))\nnamelbl.grid(column=3, row=0, columnspan=2, sticky=(N,\
    \ W), padx=5)\nname.grid(column=3, row=1, columnspan=2, sticky=(N, E, W), pady=5,\
    \ padx=5)\none.grid(column=0, row=3)\ntwo.grid(column=1, row=3)\nthree.grid(column=2,\
    \ row=3)\nok.grid(column=3, row=3)\ncancel.grid(column=4, row=3)\n```\n\n```python\n\
    root.columnconfigure(0, weight=1)\nroot.rowconfigure(0, weight=1)\ncontent.columnconfigure(0,\
    \ weight=3)\ncontent.columnconfigure(1, weight=3)\ncontent.columnconfigure(2,\
    \ weight=3)\ncontent.columnconfigure(3, weight=1)\ncontent.columnconfigure(4,\
    \ weight=1)\ncontent.rowconfigure(1, weight=1)\nroot.mainloop()\n```\n\nThis looks\
    \ more promising. Play around with the example to get a feel for the resize behavior,\
    \ handling in-cell layout and resize.\n\n## 7.6. Additional Features\n\nIf you\
    \ look at the documentation for grid, you'll see many other things you can change\
    \ with grid. Here are a few of the more useful:\n- https://tkdocs.com/man/grid\n\
    \n### Querying and Changing Grid Options\n\nLike widgets themselves, it's easy\
    \ to introspect options when you first grid the widget, but you can change them\
    \ anytime. The `slaves` method will tell you all the widgets that have been gridded\
    \ inside a master, or just within a certain column or row. The `info` method will\
    \ return a list of all the grid options for a widget and their values. Finally\
    \ the `configure` method lets you change one or more grid options.\n\nThese `content.grid_slaves()`\
    \ are illustrated in this interactive session:\n\n```\n>>> content.grid_slaves()\n\
    [tkinter.ttk.Button object .frame.button2,\n<tkinter.ttk.Button object .frame.button,\n\
    <tkinter.ttk.Checkbox object .frame.checkbox3,\n<tkinter.ttk.Checkbox object .frame.check2,\n\
    <tkinter.ttk.Entry object .frame.checkbutton,\n<tkinter.ttk.Entry object .frame.entry,\n\
    <tkinter.ttk.Label object .frame.label,\n <tkinter.ttk.Frame object .frame.frame>]\n\
    >>> for w in content.grid_slaves():\n    print(w)\n...\n.frame.button2\n.frame.button\n\
    .frame.checkbox3\n.frame.check2\n.frame.checkbutton\n.frame.entry\n.frame.label\n\
    .frame.frame\n>>> for w in content.grid_slaves(row=3):\n    print(w)\n...\n.frame.button2\n\
    .frame.button\n.frame.checkbox3\n.frame.check2\n.frame.checkbutton\n>>> for w\
    \ in content.grid_slaves(column=0):\n    print(w)\n...\n>>> namelbl.grid_info()\n\
    {'in': '<tkinter.Frame Object .frame>', 'column': 3, 'row': 0, 'columnspan': 2,\
    \ 'rowspan': 1, 'ipadx': 0, 'ipyady': 0, 'padx': 5, 'pady': 0, 'sticky': 'nw'}\n\
    >>> namelbl.grid_configure(sticky=(E,W))\n>>> namelbl.grid_info()\n{'in': '<tkinter.Frame\
    \ Object .frame>', 'column': 3, 'row': 0, 'columnspan': 2, 'rowspan': 1, 'ipadx':\
    \ 0, 'ipyady': 0, 'padx': 5, 'pady': 0, 'sticky': 'ew'}\n```\n\n### Internal Padding\n\
    \nYou saw how the `padx` and `pady` grid options added extra space around the\
    \ outside of a widget. There's also a less used type of padding called \"internal\
    \ padding\" controlled by the grid options `ipadx` and `ipady`.\n\nThe difference\
    \ can be subtle. Let's say you have a frame that's 20x20, and specify normal (external)\
    \ padding of 5 pixels on each side. The frame will request a 20x20 rectangle (its\
    \ natural size) from the geometry manager. Normally, that's what it will be granted,\
    \ so it'll get a 20x20 rectangle for the frame, surrounded by a 5-pixel border.\n\
    \nWith internal padding, the geometry manager will effectively add the extra padding\
    \ to the widget when figuring out its natural size, if the widget has requested\
    \ a 30x30 rectangle. If the frame is centered, or attached to a single side or\
    \ corner (sticky), we'll end up with a 20x20 frame with extra space around it.\
    \ However, if the frame is set to stretch (i.e., a sticky value of we, ns, or\
    \ nwes), it will fill the extra space, resulting in a 30x30 frame, with no border.\n\
    \n### Forget and Remove\n\nThe `forget` method of grid removes slaves from the\
    \ grid they're currently part of. It takes a list of one or more slave widgets\
    \ as arguments. This does not destroy the widget altogether but takes it off the\
    \ screen as if it had not been gridded in the first place. You can grid it again\
    \ later, though any grid options you'd originally assigned will have been lost.\n\
    \nThe `remove` method of grid works the same, except that the grid options will\
    \ be remembered if you grid it again later.\n\n## 7.7. Nested Layouts\n\nAs your\
    \ user interface gets more complicated, the grids that you're using to organize\
    \ all your widgets get increasingly complicated. This can make changing and maintaining\
    \ your program very difficult.\n\nLuckily, you don't have to manage your entire\
    \ user interface with a single grid. If you have one area independent of others,\
    \ create a new frame to hold that area and grid the widgets within that frame.\
    \ For example, if you were building a graphics editor with multiple palettes,\
    \ toolbars, etc., each one of those areas might be a candidate for putting in\
    \ its own frame.\n\nIn theory, these frames, each with its own grid, can be nested\
    \ arbitrarily deep, though in practice usually doesn't go beyond a few levels.\
    \ This can be a big help in modularizing your program. If, for example, you have\
    \ a palette of drawing tools, you can create the whole thing in a separate function\
    \ or class. It would be responsible for creating all the component widgets, gridding\
    \ them together, setting up event bindings, etc. The details of how things work\
    \ inside that palette can be contained in that one piece of code. From the point\
    \ of view of your main program, all it needs to know about is the single frame\
    \ widget containing your palette.\n\nOur examples have shown just a hint of this,\
    \ where a content frame was gridded into the main window, and all the other widgets\
    \ gridded into the content frame.\n\nAs your own programs grow larger, you'll\
    \ likely run into situations where making a change in the layout of one part of\
    \ your interface requires code changes to the layout of another part. That may\
    \ be a clue to reconsider how you're using grid and splitting out components into\
    \ separate frames would help.\n"
