    We have previously used the `winfo` command to find out information about specific
    widgets. It can also provide information about the entire display or screen. As
    usual, see the `winfo` command reference for full details.


    https://tkdocs.com/man/winfo


    For example, you can determine the screen''s color depth (how many bits per pixel)
    and color model (usually truecolor on modern displays), it''s pixel density, and
    resolution.


    ```python

    print("color depth=" + str(root.winfo_screendepth()) + " (" + root.winfo_screenvisual()
    + ")")

    ```


    ```python

    print("pixels per inch" + str(root.winfo_pixels(''li''))

    print("width=", str(root.winfo_screenwidth()) + " height=", str(root.winfo_screenheight()))

    ```


    ## Multiple Monitors


    While normally you shouldn''t have to pay attention to it, if you do have multiple
    monitors on your system and want to customize things a bit, there are some tools
    in Tk to.


    First, there are two ways that multiple monitors can be represented. The first
    is with logically separate displays. This is often the case on X11 systems, though
    it can be changed, e.g., using the `xrandr` utility.


    The second is a single large virtual desktop. This is the case on Windows and
    macOS. In this case, the screen is a single coordinate system that encompasses
    all monitors. You can use the `winfo` coordinates to determine where a window
    is on the screen.


    For example, you can determine the position of a window on the screen:


    ```python

    print(window.winfo_x(), window.winfo_y())

    ```


    If you want to move a window to another monitor, you can use the `geometry` method:


    ```python

    window.geometry("+100+100")

    ```


    There are many other ways to handle multiple monitors, such as using third-party
    libraries. For more control, use the methods above.

