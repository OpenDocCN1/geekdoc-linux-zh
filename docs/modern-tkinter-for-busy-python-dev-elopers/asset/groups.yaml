    # 13. Fonts, Colors, Images


    This chapter describes how Tk handles fonts, colors, and images. We''ve touched
    on all of these before, but here we''ll provide a more in-depth treatment.


    ## 13.1. Fonts


    Tk''s label widget allows you to change the font used to display text via the
    font configuration option. The canvas and text widgets, covered in the following
    chapters, also allow you to specify fonts. Other widgets that display text may
    not have a font configuration option, or their fonts can be changed using styles.


    > We will cover styles in detail later. In essence, they replace the old way of
    tweaking multiple configuration options on individual widgets. Instead, fonts,
    colors, and other settings that control appearance can be bundled together in
    a style. That style can then be applied to multiple widgets. It''s akin to the
    difference between hardcoding display-oriented markup inside HTML pages vs. using
    CSS to keep display-specific information separate.


    With many things in Tk, the default fonts are usually a good choice. If you need
    to make changes, this section shows you the best way to do so, using named fonts.
    Tk includes named fonts suitable for all different components of your user interface.
    They take into account the conventions of the specific platform you''re running
    on. You can also specify your own fonts when you need additional flexibility.


    The font command reference provides full details on specifying fonts, as well
    as other font-related operations.


    - https://tkdocs.com/man/font


    > Many older Tk programs hardcoded fonts. using the "family size style" format
    will feel like X11 names, or the order and more arcane X11 font specification
    strings. These applications increasingly dated as platforms evolved. Worse, fonts
    were often specified on a per-widget basis, leaving font decisions spread throughout
    the code. Named fonts, particularly the standard fonts that Tk provides, are a
    far better solution. Reviewing and updating font decisions is an easy and important
    change to make in any existing applications.


    # Standard Fonts


    Each platform defines specific fonts that should be used for standard user interface
    elements. Tk encapsulates many of these decisions into a standard set of named
    fonts. They are available on all platforms, though the exact font used will vary.
    This helps abstract away platform differences. Of course, the standard widgets
    use these named fonts. The predefined fonts are:


    - **TkDefaultFont**: Default for items not otherwise specified.

    - **TkTextFont**: Used for entry widgets, listboxes, etc.

    - **TkFixedFont**: A standard fixed-width font.

    - **TkMenuFont**: The font used for menu items.

    - **TkHeadingFont**: Font for column headings in lists and tables.

    - **TkCaptionFont**: A font for window and dialog caption bars.

    - **TkSmallCaptionFont**: A smaller caption font for tool dialogs.

    - **TkIconFont**: A font for icon captions.

    - **TkTooltipFont**: A font for tooltips.


    # **Platform-Specific Fonts**


    Tk provides additional named fonts to help you comply with less common situations
    on specific platforms. Individual platform guidelines detail and how these fonts
    should be used. These fonts are only defined on specific platforms. You''ll need
    to take that into account if your application is portable across platforms.


    Tk on X11 recognizes any valid X11 font name (see, e.g., the xlsfonts command).
    However, these can vary with the operating system, installed software, and the
    configuration of the individual machine. There is no guarantee that a font available
    on your X11 system has been installed on any other X11 system.


    On Windows, Tk provides named fonts for all the fonts that can be set in the "Display"
    Control Panel. It recognizes the following font names: system, ansi, device, systemfixed,
    ansified, and oemfixed.


    On macOS, the Apple Human Interface Guidelines (HIG) specifies a number of additional
    fonts. Tk recognizes the following names:

    systemSystemFont, systemSmallSystemFont, systemApplicationFont, systemViewsFont,
    systemMenuItemFont, systemMenuItemCmdKeyFont, systemPushButtonFont, systemAlertHeaderFont,
    systemMiniSystemFont, systemDetailEmphasizedSystemFont, systemEmphasizedSystemFont,
    systemSmallEmphasizedSystemFont, systemLabelFont, systemTitleFont, systemMenuItemMarkFont,
    systemWindowTitleFont, systemUtilityWindowTitleFont, systemToolbarFont, and systemDefaultSystemFont.


    # **Working with Named Fonts**


    Tk provides several operations that work with named fonts. You can start by getting
    a list of all the currently defined fonts.


    ```

    from tkinter import font

    font.names()

    ```


    You can find the actual font represented by an abstract named font.


    ```

    >>> from tkinter import font

    >>> f = namofont(''TkTextFont'')

    {''family'': ''AppleUIFont'', ''size'': 13, ''weight'': ''normal'', ''slant'':
    ''roman'', ''underline'': 0, ''overstrike'': 0}

    >>> f.metrics()

    {''ascent'': 13, ''descent'': 3, ''linespace'': 16, ''fixed'': 0}

    >>> f.measure(''The quick brown fox'')

    124

    ```


    Tkinter provides a Font class to hold information about a named font. You can
    create an instance of this class from the name of a font using the namofont function.
    When you used named fonts in your application (e.g., via a label''s font option,
    you can supply either the font name (as a string) or a Font instance.


    > Trying these in an interactive shell and got an error? Even though we''re not
    displaying onscreen, you need to initialize Tk before using the various functions.


    You can also create your own fonts, which can then be used exactly like the predefined
    ones. To do so, choose a name for the font and specify its attributes as above.


    ```

    from tkinter import font

    highlightFont = font.Font(family=''Helvetica'', name=''HighlightFont'', size=12,
    weight=''bold'')

    ttk.Label(root, text=''Attention!'', font=highlightFont).grid()

    ```


    If you don''t supply a name, Tkinter will generate one, which you can retrieve
    via font.name or str(font). It''s usually best to supply one. The family specifies
    the font. Tk knows the names Courier, Times, and Helvetica are available, though
    they may be mapped to an appropriate monospaced, serif, or sans-serif font. Other
    fonts installed on your system can be used, but the usual caveats about portability
    apply. You can get the names of all available families with:


    ```

    font.families()

    ```


    > You can change the attributes of a named font using its configure method. You
    might do this in response to menu options allowing users to zoom in or out, i.e.,
    increasing or decreasing font sizes.


    # Font Descriptions


    Another way to specify fonts is via a list of attributes. starting with the font
    family, and then optionally includes a size, and one or more style options. Some
    examples of this are Helvetica, Helvetica 12, Helvetica 12 bold, and Helvetica
    12 bold italic. These font decriptions can be used anywhere you''d use a named
    font, e.g., a font configuration option.

