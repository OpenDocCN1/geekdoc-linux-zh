    \n```\nid = canvas.create_line(0, 0, 10, 10, fill='red')\n...\ncanvas.itemconfigure(id,\
    \ fill='blue', width=2)\n```\n\n## Item Types\n\nCanvas widgets support a wide\
    \ variety of item types.\n\n## Line\n\nOur sketchpad created simple line items,\
    \ each a single segment with a start point and an end point. Lines items can also\
    \ consist of multiple segments.\n\n```\ncanvas.create_line(10, 10, 200, 50, 90,\
    \ 150, 50, 80)\n```\n\nLines have several interesting additional attributes, allowing\
    \ for drawing curves, arrows, and more.\n\n### arrow:\n- place an arrowhead at\
    \ the start (first), end (last), or both ends (both); default is none\n- arrowshape:\
    \ allows changing the appearance of any arrowheads\n- capstyle: for wide lines\
    \ without arrows, this controls the end of lines are drawn; one by butt (default),\
    \ projecting, or round\n- joinstyle: for wide lines with multiple segments, this\
    \ controls drawings of each vertex; one of round (default), bevel, or miter\n\
    - smooth: if specified as true (or bezier), draws a smooth curve via quadratic\
    \ splines between multiple segments rather than using straight lines; raw specifies\
    \ a different type of curve (cubic splines)\n- splinesteps: controls the smoothness\
    \ of curved lines, i.e., those with the smooth option set\n\n## Rectangle\n\n\
    Rectangles are specified by the coordinates of opposing corners, e.g., top-left\
    \ and bottom-right. They can be filled in (via fill) with one color, and the outline\
    \ given a different color.\n\n```\ncanvas.create_rectangle(10, 10, 200, 50, fill='red',\
    \ outline='blue')\n```\n\n## Oval\n\nOvals items work exactly the same as rectangles.\n\
    \n```\ncanvas.create_oval(10, 10, 200, 150, fill='red', outline='blue')\n```\n\
    \n## Polygon\n\nPolygon items allow you to create arbitrary shapes as defined\
    \ by a series of points. The coordinates are given in the same way as multipoint\
    \ lines. Tk ensures the polygon is \"closed\", attaching the last point to the\
    \ first. Like ovals and rectangles, they can have separate fill and outline colors.\
    \ They also support joinstyle, smooth, and splinesteps attributes.\n\n```\ncanvas.create_polygon(10,\
    \ 10, 200, 50, 90, 150, 80, 120, 55, fill='red', outline='blue')\n```\n\n## Arc\n\
    \nArc items draw a portion of an oval; think of one piece of pie chart controlled\
