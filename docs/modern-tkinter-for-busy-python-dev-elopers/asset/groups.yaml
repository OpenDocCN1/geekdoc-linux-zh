    All themed widgets maintain an internal state, represented as a series of binary
    flags. Each flag can either be set (on) or cleared (off). You can set or clear
    these different flags, and check the current setting using the state and instar
    methods. Buttons make use of the disabled flag to control whether or not users
    can press the button. For:


    ```

    b.state([''disabled'']) # set the disabled flag

    b.state([''!disabled'']) # clear the disabled flag

    b.instate([''disabled'']) # true if disabled, else false

    b.state([''!disabled'']) # true if not disabled, else

    false

    b.state([''!disabled''], cmd) # execute ''cmd'' if not disabled

    ```


    > Note that these commands accept an array of state flags as their argument.


    The full list of state flags available to themed widgets is: active, disabled,
    focus, pressed, selected, background, readonly, alternate, and invalid. These
    are described in the themed widget reference. While all widgets have the same
    set of state flags, not all states are meaningful for all widgets. It is also
    possible to get fancy in the state and instar methods and specify multiple state
    flags at the same time.


    https://tkdocs.com/man/ttk_widget


    The state and instar methods replace the older state option (which takes the values
    normal or disabled).


    That configuration option is actually available for themed widgets in Tk 8.5,
    but "write-only," which means that changing the option calls the state command.
    It is mainly intended as a convenience so you can specify a widget should be disabled
    when you first create it. However, any changes made using the new state command
    do not update the configuration option. To'
