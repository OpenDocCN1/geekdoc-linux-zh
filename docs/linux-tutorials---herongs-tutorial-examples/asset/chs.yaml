  \ - 提供如何通过 PDF、EPUB 或格式获取完整本书的信息。\n\n# Linux 系统介绍\n提供 Linux 操作系统的介绍和教程。主题包括用于显示操作系统信息的\
  \ `uname` 命令。\n\n### 核心要点\n* `uname` 命令可用于显示操作系统信息。\n\n## uname - 显示系统信息\n提供了一个如何在\
  \ Linux 系统上使用 `uname` 命令显示操作系统信息的教程示例。在新的 Linux 计算机上，你应该做的第一件事就是像本教程所示收集其系统信息。\n\
  \n1. 显示 Linux 操作系统信息最常用的命令是 `uname` 命令。\n\n（在我的 CentOS 8 计算机上）\n```bash\ncentos8$\
  \ uname -mprsv\nLinux 4.18.0-147.el8.x86_64\n    #1 SMP Wed Dec 4 21:51:45 UTC 2019\
  \ x86_64 x86_64\n```\n\n（在我的 CentOS 6 计算机上）\n```bash\ncentos6$ uname -mprsv\nLinux\
  \ 2.6.32-696.20.1.el6.i686 #1 SMP Fri Jan 26 18:13:32 UTC 2018\n    i686 i686 i386\
  \ GNU/Linux i386\n```\n\n（在我的 macOS 10 计算机上）\n```bash\nmacos$ uname -mnprsv\nDarwin\
  \ 16.7.0 Darwin Kernel Version 16.7.0:\n    Sun Jun  2 20:26:31 PDT 2019; root:xnu-3789.73.50~1/RELEASE_X86_64\n\
  \    x86_64 i386\n```\n\n2. 在大多数 Linux 系统上，操作系统信息可以通过名为 `/proc/version` 的特殊文件访问。你可以使用\
  \ `cat` 命令来显示它：\n\n（在我的 CentOS 8 计算机上）\n```bash\ncentos8$ cat /proc/version\nLinux\
  \ version 4.18.0-147.el8.x86_64\n    (mockbuild@kbuilder.bsys.centos.org)\n    (gcc\
  \ version 8.3.1 20190507 (Red Hat 8.3.1-4) (GCC))\n    #1 SMP Wed Dec 4 21:51:45\
  \ UTC 2019\n```\n\n（在我的 CentOS 6 计算机上）\n```bash\ncentos6$ cat /proc/version\nLinux\
  \ version 2.6.32-69.20.1.el6.i686\n    (mockbuild@x86_64_01.bsys.centos.org)\n \
  \   (gcc version 4.4.7 20120313 (Red Hat 4.4.7-18) (GCC))\n    #1 SMP Fri Jan 26\
  \ 18:13:32 UTC 2018\n```\n\n3. CPU 架构是安装 Linux 系统和应用程序时的关键参数。你可以使用 `arch` 命令来显示它：\n\
  \n（在我的 CentOS 8 计算机上）\n```bash\ncentos8$ arch\nx86_64\n```\n\n（在我的 CentOS 6 计算机上）\n\
  ```bash\ncentos6$ arch\ni686\n```\n\n（在我的 macOS 10 计算机上）\n```bash\nmacOS$ arch\n\
  i386\n```\n\n## free - 显示空闲和已内存\n提供了一个如何在 Linux 系统上使用 `free` 命令显示空闲和已内存信息的教程示例。关于你的\
  \ Linux 系统的另一个重要信息是内存。你可以使用 `free` 命令显示内存统计信息，包括空闲和已用内存大小。以下是我 CentOS 计算机上 `free`\
  \ 命令输出的一些示例。\n\n1. 使用默认选项 `free` 显示内存信息。内存计数以 kibibytes（1,024 字节）显示。注意，一个 kibibyte（1,024\
  \ 字节）与 kilobyte（1,000 字节）略有不同。\n```bash\nherong$ free\n             total      used\
  \      free  shared  buff/cache   available\nMem:       7789220   2047412   677256\
  \   297448   5064552     5145248\nSwap:       8085500           0   8085500\n```\n\
  \n2. 为了控制单位，你可以使用 `free -b|k|m|g` 选项。\n```bash\nherong$ free -m\n             total\
  \      used      free  shared  buff/cache   available\nMem:       7789220   2047412\
  \   677256   297448   5064552     5145248\nSwap:       8085500           0   8085500\n\
  ```\n\n3. 或者使用 `free -h` 以人类可读格式。\n```bash\nherong$ free -h\n             total\
  \        used        free      shared  buff/cache   available\nMem:       7.5 |\
  \       1.9Gi       660M       290M       4.8Gi       4.9Gi\nSwap:       7.7Gi \
  \                  0       7.7Gi\n```\n\n\n\n\n\n```text\nherong    1345  0.0  0.0\
  \    9528  2192 pts/1    S+   05:17   0:00 more\nherong   29872  0.0  0.0   24700\
  \  5372 pts/0    Ss   Aug24   0:00 -bash\nherong   31723  0.0  0.0   25084  5704\
  \ pts/1    Ss   02:29   0:00 -bash\n...\n```\n\n```bash\nherong$ ps -u joe\n```\n\
