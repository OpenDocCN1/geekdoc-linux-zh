  \ Linux 教程 - Herong 的教程示例 ∟ 进程管理\n\n## \"jobs\" - 管理后台作业\n\n提供了一个关于如何使用 `jobs` 命令显示后台作业的教程示例，后台作业是指输入与键盘分离的进程。你可以通过在命令末尾添加取符符号（`&`）来启动后台作业。\n\
  \n### 什么是后台作业？\n\n后台作业是指其输入与键盘设备分离的进程。它的输出可能仍然连接到屏幕。\n\n前台作业是指其输入与键盘设备连接的进程。当你在\
  \ shell 提示符输入命令启动进程时，它将默认作为前台作业启动。键盘会被该前台作业占用直到它被终止。因此，你任何时候只能执行 1 个进程作业。\n\n如果你想将进程作为后台作业启动以释放键盘，可以使用以下\
  \ 2 选项：\n\n1.  在命令行行末尾添加 `&`。这将立即将该进程作为后台作业启动。例如，以下命令启动一个进程（ID=40120）作为后台作业（#=1）。\n\
  ```bash\nherong$ sleep 100000 &\n[1] 40120\n```\n\n2.  在执行前台作业期间按下 `ctrl-z`。这将停止前台作业并将其变为后台作业，同时保持其停止状态。\n\
  ```bash\nherong$ sleep 50000\nctrl-z\n[2]+ Stopped\n```\n\n如果你想查看你自己的后台作业列表，可以使用\
  \ `jobs` 命令：\n```bash\nherong$ jobs\n[1]- Running  sleep 10000 &\n[2]+ Stopped \
  \ sleep 50000\n```\n\n如果你想在后台恢复已停止的作业，可以使用 `bg` 命令：\n```bash\nherong$ bg 2\n[2]+\
  \ sleep 50000 &\nherong$ jobs\n[1]- Running  sleep 10000 &\n[2]+ Running  sleep\
  \ 50000 &\n```\n\n如果你想将后台作业带回前台，可以使用 `fg` 命令：\n```bash\nherong$ fg 2\nsleep 100000\n\
  ```\n\n在后台运行命令的一个好点处是，即使你的 shell 会话断开/关闭，它也会继续运行。\n\n Linux 教程 - Herong 的教程示例 ∟\
  \ 进程管理\n\n## \"tmux\" - 终端复用器\n\n提供了一个关于如何使用 `tmux` 工具在单个终端中将多个 shell 作为窗口和面板（panes）管理的教程示例。`tmux`\
  \ 在终端断开时会自动保持所有 shell 运行。\n\n### 什么是 \"tmux\"？\n\n`tmux` 是一个终端复用器。它允许你在一个终端中的多个程序之间轻松切换，将它们分离（detach）（它们会在后台继续运行）并重新连接（attach）到不同的终端。以下是\
  \ `tmux` 帮助页中的官方描述：\n\n`tmux` 是一个终端复用器：它允许从单个屏幕创建、访问和控制多个终端。`tmux` 可以从屏幕中分离并继续在后台运行，稍后重新连接。\n\
  \n当启动 `tmux` 时代，它会创建一个带有单个窗口的新会话并将其显示在屏幕上。屏幕底部的状态行显示当前会话的信息，并用于输入交互命令。\n\n会话是 `tmux`\
  \ 管理下的单个伪终端集合。每个会话都有一个或多个与其链接的窗口。窗口占据整个屏幕，并可能被分成矩形面板，每个面板都是一个独立的伪终端（`pty(4)` 手页文档了伪终端的节点细节）。任意数量的\
  \ `tmux` 实例都可以连接到同一个会话，会话中也可以存在任意数量的窗口。\n\n一旦所有会话都被杀死，`tmux` 退出。每个会话都是持久的，能够防止意外断开（例如\
  \ `ssh(1)` 连接超时）或故意的分离（使用 `C-b d` 组合键）。可以使用以下命令重新连接 `tmux`：\n```bash\n$ tmux attach\n\
  ```\n\n在 `tmux` 中，会话由客户端显示在屏幕上，所有会话都由单个服务器管理。服务器和每个客户端是独立的进程，通过 `/tmp` 中的 socket\
  \ 进行通信。\n\n`tmux` 是一个非常用的工具，它减少了远程 `ssh` 会话的数量，并节省了手动将进程推到后台以防止因连接超时而被杀死的时间。以下是我在\
  \ CentOS 计算机上尝试的尝试。\n\n1.  安装 `tmux`：\n```bash\nherong$ sudo dnf install tmux\n\
  Installed:\ntmux-2.7-1.el8.x86_64\n```\n\n2.  使用 `tmux` 命令启动一个新的 `tmux` 会话，这会在 `tmux`\
  \ 会话的第一个窗口的第一个面板启动一个 shell。\n```bash\nherong$ tmux\n(in a child shell in \"tmux\"\
  )\nherong$ exit\n(back to the original shell)\n```\n\n3.  使用以下热键控制其窗口和标签：\n- `ctrl-b,\
  \ %`：从左到右将屏幕对分为二半\n- `ctrl-b, \"`：从上到下将屏幕对分为二半\n- `ctrl-b, 方向方向键`：切换到不同方向的面板\n-\
  \ `ctrl-b, c`：创建一个新窗口\n- `ctrl-b, 0|1|...`：切换到指定的窗口\n- `ctrl-b, d`：从 tmux 分离，让其在后台运行\n\
  \n如果你想查看你自己的后台作业列表，可以使用 `jobs` 命令：\n```bash\nherong$ jobs\n```\n\n如果你想在后台恢复已停止的作业，可以使用\
  \ `bg` 命令：\n```bash\nherong$ bg 2\n```\n\n如果你想将后台作业带回前台，可以使用 `fg` 命令：\n```bash\n\
  herong$ fg 2\n```\n\n如果你想重新连接已分离或断开的会话，使用 `tmux ls|attach`：\n```bash\nherong$ tmux\
  \ ls\n0: 1 windows\n$ tmux attach\n(tmux is displayed again)\n```\n\n Linux 教程 -\
  \ Herong 的教程示例 ∟ 进程管理\n\n## Linux 文件系统\n\n提供关于 Linux 文件系统的介绍和教程。主题包括使用 `df` 查看已挂载文件系统的剩余空间；`mount`\
  \ 连接 USB 驱动器文件系统；`fdisk` 列出分区和文件系统类型；`dd` 复制数据并测试 I/O 速度；`hdparm` 用于管理硬盘参数。\n\n\
  - `df` - 显示文件系统的剩余空间\n- `mount` - 挂载 USB 驱动器为文件系统\n- `fdisk` - 格式化分区\n- `dd` - 从到存储设备复制数据\n\
  - `使用 `dd` 命令测试 I/O 速度\n- `hdparm` - 硬盘参数\n- `du` - 显示目录的磁盘占用\n- `挂载 Windows 文件系统\n\
  - `W95 Ext'd (LBA) 分区\n- `文件系统类型、ID 和格式化\n\n### 知识点总结：\n\n* `df` 命令用于显示已挂载文件系统的剩余空间。\n\
  * `mount` 命令用于将文件系统分区上线。`umount` 命令用于将其离线。\n* `fdisk -l` 命令用于列出给定存储设备的分区及其格式类型。\n\
  * `dd` 命令用于以连续字节块的形式从一个设备复制到另一个设备，绕过文件系统结构。\n* `hdparm` 命令用于收集硬盘识别信息并获取/设置其单个参数。\n\
  \n\n\n\n\n# \"df\" - 显示文件系统可用空间\n\n本文提供了一个教程示例，介绍了如何使用 `df` 命令显示 Linux 系统上已挂载文件系统的可用空间。要查看已挂载文件系统的可用空间，你可以使用\
  \ `df` 命令。以下是我 CentOS 8 电脑上 `df` 命令的一些示例输出。\n\n### 1. 使用 \"df\" 显示所有已挂载文件系统的可用空间：\n\
  \n```bash\nherong$ df\n\nFilesystem           1K-blocks      Used Available Use%\
  \ Mounted on\ndevtmpfs             3875992           0   3875992   0% /dev\ntmpfs\
  \               3894608           0   3894608   0% /dev/shm\ntmpfs             \
  \  3894608      18192   3876416   1% /run\ntmpfs               3894608         \
  \  0   3894608   0% /sys/fs/cgroup\n/dev/mapper/cl-root  52403200 6279684  46123516\
  \  12% /\n/dev/mapper/cl-home  40813088  609176  40203912   2% /home\n/dev/sda6\
  \             999320  148068    782440  16% /boot\ntmpfs                778920 \
  \     1168    777752   1% /run/user/42\ntmpfs                778920      6960  \
  \  771960   1% /run/user/1000\n```\n\n### 2. 使用 \"df -m\" 以兆字节（MB）为单位显示所有已挂载文件系统的可用空间：\n\
  \n```bash\nherong$ df -m\n\nFilesystem           1M-blocks  Used Available Use%\
  \ Mounted on\ndevtmpfs               3786           0      3786   0% /dev\ntmpfs\
  \               3804           0      3804   0% /dev/shm\ntmpfs               3804\
  \          18      3786   1% /run\ntmpfs               3804           0      3804\
  \   0% /sys/fs/cgroup\n/dev/mapper/cl-root   5175         133      5043   2% /\n\
  /dev/mapper/cl-home   3987          95      3892   2% /home\n/dev/sda6         \
  \     96          45      765  16% /boot\ntmpfs                761           2 \
  \     760   1% /run/user/2\ntmpfs                761           7      754   1% /run/user/1000\n\
  ```\n\n### 3. 使用 \"df --block-size=1G\" 以吉字节（GB）为单位显示所有已挂载文件系统的可用空间：\n\n```bash\n\
  herong$ df --block-size=1G\n\nFilesystem           1G-blocks  Used Available Use%\
  \ Mounted on\ndevtmpfs                   4           0           4   0% /dev\ntmpfs\
  \                   4           0           4   0% /dev/shm\ntmpfs             \
  \      4           1           4   1% /run\ntmpfs                   4          \
  \ 0           4   0% /sys/fs/cgroup\n/dev/mapper/cl-root      50           6   \
  \       44  12% /\n/dev/mapper/cl-home      39           1          39   2% /home\n\
  /dev/sda6               1           1           1  16% /boot\ntmpfs            \
  \       1           1           1   1% /run/user/42\ntmpfs                   1 \
  \          1           1   1% /run/user/1000\n```\n\n# 将 USB 盘挂载为文件系统\n\n本文提供了一个教程示例，介绍如何在\
  \ Linux 系统上将格式化后的 USB 盘分区挂载为文件系统。如果你有一个 USB 盘，可以将其插入 Linux 系统的接口中，并按照此教程将其挂载为新系统。\n\
  \n## 1. 检查表示表示为 `/dev/sd*` 的现有 SCSI 设备：\n\n```bash\nherong$ ls -l /dev/sd*\nbrw-rw----\
  \ 1 root root 8 May 26 21:17 /dev/sda\nbrw-rw---- 1 root root 8 May 26 21:17 /dev/sda1\n\
  brw-rw---- 1 root root 8 May 26 21:17 /dev/sda2\nbrw-rw---- 1 root root 8 May 26\
  \ 21:17 /dev/sda5\nbrw-rw---- 1 root root 8 May 26 21:17 /dev/sda6\nbrw-rw---- 1\
  \ root root 8 May 26 21:17 /dev/sda7\n```\n\n### 2. 将 USB 盘插入接口。再次检查 SCSI 设备。\n\n\
  由于 USB 盘在 Linux 系统中被视为 SCSI 设备，你将看到检测到更多设备，它们被表示为 `/dev/sd*`。在我下方的示例中，我看到 `/dev/sdb`\
  \ 代表整个 USB 盘，而 `/dev/sdb1` 代表第一个 FAT32 分区。\n\n```bash\nherong$ ls -l /dev/sd*\n\
  brw-rw---- 1 root root 8 May 26 21:17 /dev/sda\nbrw-rw---- 1 root root 8 May 26\
  \ 21:17 /dev/sda1\nbrw-rw---- 1 root root 8 May 26 21:17 /dev/sda2\nbrw-rw---- 1\
  \ root root 8 May 26 21:17 /dev/sda5\nbrw-rw---- 1 root root 8 May 26 21:17 /dev/sda6\n\
  brw-rw---- 1 root root 8 May 26 21:17 /dev/sda7\nbrw-rw---- 1 root root 8 Apr 04\
  \ 02:25 /dev/sdb\nbrw-rw---- 1 root root 8 Apr 04 02:25 /dev/sdb1\n```\n\n### 3.\
  \ 在我的 CentOS 8 电脑的根文件系统中找到一个挂载点，并挂载格式化设备 `/dev/sdb1`。\n\n你可能会在其他 Linux 系统上看到不同的挂载点。顺便提一下，你不能挂载\
  \ `/dev/sdb`，因为它不是文件系统。\n\n```bash\nherong$ ls -l /\nlrwxrwxrwx. 1 root root 7 May\
  \ 10 2019 bin -> usr/bin\ndr-xr-xr-x. 6 root root 4096 Mar 26 21:18 boot\ndrxr-xr-x.\
  \ 20 root root 3700 Apr 04 08:25 dev\ndrxr-xr-x. 144 root root 8192 Mar 30 07:37\
  \ etc\ndrxr-xr-x. 3 root root 20 Mar 26 17:11 home\nlrwxrwxrwx. 1 root root 7 May\
  \ 10 2019 lib -> usr/lib\ndrxr-xr-x. 2 root root 6 May 10 2019 media\ndrxr-xr-x.\
  \ 2 root root 6 May 10 2019 mnt\ndrxr-xr-x. 2 root root 6 May 10 2019 opt\n...\n\
  herong$ ls -l /media\ntotal 0\nherong$ sudo mount /dev/sdb1 /media\n```\n\n### 4.\
  \ 验证作为已挂载文件系统的 USB 盘格式化分区：\n\n```bash\nherong$ df\nFilesystem           1K-blocks\
  \      Used Available Use% Mounted on\n...\n/dev/sdb1             7813124 1146116\
  \  6667008  15% /media\n```\n\n### 5. 检查 \"System Volume Information\" 文件夹，它通常存在于任何\
  \ USB 盘的格式化分区上。\n\n```bash\nherong$ ls -l \"/media/System Volume Information\"\n\
  total 256\n-rwxrwxrwx 1 root root 7 Apr 04 02:25\n-rwxrwxrwx 1 root root 7 Apr 04\
  \ 02:25\n```\n\n### 6. 拔出 USB 盘之前记得卸载它以防止任何损坏。\n\n```bash\nherong$ sudo umount /dev/sdb1\n\
  ```\n\n\n\n\n\n```\n/dev/sdc1       10392 15667199 15656808  7.5G  c W95 FAT32 (LBA)\n\
  ```\n\n# \"dd\" - 从存储设备复制数据到存储设备\n\n提供了一个教程示例，介绍如何使用 `dd` 命令从存储设备或到存储设备复制连续的字节数据块。可以跳过文件系统结构。如果你想将数据以连续字节块的形式从一个设备复制到另一个设备，可以使用本教程所示的\
  \ `dd (data duplicator)` 命令。如果在 `dd` 命令中使用了设备名称，则将不会遵循文件系统结构。\n\n### 1. 从原始设备复制数据\n\
  这将从设备中连续读取数据，而不遵循分区和格式结构。（从 USB 闪存器复制第一个数据块（512 字节）)\n\n```bash\nherong$ sudo dd\
  \ count=1 if=/dev/sdb of=one-block\n\n1+0 records in\n1+0 records out\n512 bytes\
  \ copied, 6.1976e-05 s, 8.3 MB/s\n```\n\n### 2. 向原始设备复制数据\n这将数据连续写入设备中，并覆盖分区和格式结构。此命令非常危险。设备名称中的一个拼写错误可能会损坏硬盘的\
  \ MBR（主引导记录），它表示为 `/dev/sda`。（将 CentOS 8 DVD 镜像复制到 USB 闪存器）\n\n```bash\nherong$\
  \ sudo dd if=CentOS-8.1.1911-x86_64-boot.iso of=/dev/sdb\n```\n\n（将 TAR（磁带存档）格式的备份文件复制到磁带设备）\n\
  ```bash\nherong$ sudo dd if=backup.tar of=/dev/sdc\n```\n\n（向磁带设备开头写入 1 GB 的 '0'）（这是移除旧磁带上敏感数据的好方法）\n\
  ```bash\nherong$ sudo dd if=/dev/zero of=/dev/sdc bs=64k count=16k\n```\n\n# 使用\
  \ \"dd\" 命令测试 I/O 速度\n\n提供了一个教程示例，介绍如何使用 `dd` 命令配合不同的块大小测试硬盘和 USB 闪存器的 I/O 速度。`dd\
  \ (data duplicator)` 命令也可用于测量给定存储设备的 I/O（输入/输出）速度。在我 CentOS 8.0 电脑上的测试。\n\n### 1.\
  \ 测试内置硬盘的输入（写入）速度\n我发现向硬盘写入时，较大的块大小 (`bs`）效率更高。\n\n```bash\nherong$ pwd\n/home/herong\n\
  herong$ dd if=/dev/zero of=one-giga bs=64k count=16k\n\n16384+0 records in\n16384+0\
  \ records out\n1073741824 bytes (1.1 GB, 1.0 GiB) copied, 0.255833 s, 4.2 GB/s\n\
  \nherong$ dd if=/dev/zero of=one-giga bs=1k count=1024k\n\n1048576+0 records in\n\
  1048576+0 records out\n1073741824 bytes (1.1 GB, 1.0 GiB) copied, 1.98674 s, 540\
  \ MB/s\n\nherong$ ls -l one*\n-rw-rw-r--. 1 herong herong 1073741824 Apr  5 03:23\
  \ one-giga\n```\n\n### 2. 测试内置硬盘的输出（读取）速度\n我发现从硬盘读取数据时，较大的块大小 (`bs`）效率更高。我还发现读取比写入慢一倍，这让我有点意外。\n\
  \n```bash\nherong$ dd if=one-giga of=/dev/null bs=64k count=16k\n\n16384+0 records\
  \ in\n16384+0 records out\n1073741824 bytes (1.1 GB, 1.0 GiB) copied, 0.113039 s,\
  \ 9.5 GB/s\n\nherong$ dd if=one-giga of=/dev/null bs=1k count=1024k\n\n1048576+0\
  \ records in\n1048576+0 records out\n1073741824 bytes (1.1 GB, 1.0 GiB) copied,\
  \ 1.18922 s, 903 MB/s\n```\n\n### 3. 测试 USB 闪存器的输入（写入）速度\n我发现 USB 闪存器上的输入速度在块大小为\
  \ 1 KB 时与硬盘相似，这让我有点意外。（USB 闪存器挂载在 `/media` 上）\n\n```bash\nherong$ df /dev/sdc1\n\
  Filesystem      1K-blocks  Used Available Use% Mounted on\n/dev/sdc1       15667199\
  \  10392 15656808  7% /media\n\nherong$ cd /media\nherong$ sudo dd if=/dev/zero\
  \ of=one-giga bs=64k count=16k\n\n16384+0 records in\n16384+0 records out\n1073741824\
  \ bytes (1.1 GB, 1.0 GiB) copied, 0.937841 s, 1.1 GB/s\n\nherong$ sudo dd if=/dev/zero\
  \ of=one-giga bs=1k count=1024k\n\n1048576+0 records in\n1048576+0 records out\n\
  1073741824 bytes (1.1 GB, 1.0 GiB) copied, 2.12935 s, 504 MB/s\n```\n\n### 4. 测试同一\
  \ USB 闪存器的输出（读取）速度\n我发现 USB 闪存器上的输出速度在大小块大小下都与硬盘相似，这让我有点意外。\n\n```bash\nherong$\
  \ dd if=one-giga of=/dev/null bs=64k count=16k\n\n16384+0 records in\n16384+0 records\
  \ out\n1073741824 bytes (1.1 GB, 1.0 GiB) copied, 0.115699 s, 9.3 GB/s\n\nherong$\
  \ dd if=one-giga of=/dev/null bs=1k count=1024k\n\n1048576+0 records in\n1048576+0\
  \ records out\n1073741824 bytes (1.1 GB, 1.0 GiB) copied, 1.13126 s, 949 MB/s\n\
  ```\n\n# 在我的 macOS 10 电脑上的测试\n\n### 1. 测试内置硬盘的输入（写入）速度\n我发现我的 macOS 硬盘的输入速度比 CentOS\
  \ 慢得多。\n\n```bash\nherong$ pwd\n/Users/herong\nherong$ dd if=/dev/zero of=one-giga\
  \ bs=64k count=16k\n\n16384+0 records in\n16384+0 records out\n1073741824 bytes\
  \ transferred in 0.741450 secs (1,448,164 bytes/sec)\n\nherong$ dd if=/dev/zero\
  \ of=one-giga bs=1k count=1024k\n\n1048576+0 records in\n1048576+0 records out\n\
  1073741824 bytes transferred in .04608 secs (265,378 bytes/sec)\n```\n\n### 2. 测试内置硬盘的输出（读取）速度\n\
  我发现硬盘的输出速度比输入速度快得多，这是符合逻辑的。\n\n```bash\nherong$ dd if=one-giga of=/dev/null bs=64k\
