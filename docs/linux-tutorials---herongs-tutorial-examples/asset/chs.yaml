  \ DNF 和 YUM 的介绍。\n\n### 核心要点\n* `DNF`，也称为 `Dandified YUM`，是基于 `RPM`（RedHat Package\
  \ Manager）的 Linux 发行版的下一代 `YUM`（Yellowdog Update Modified）软件包管理器。\n* `YUM`（Yellowdog\
  \ Update Modified）是基于 `RPM`（RedHat Package Manager）的 Linux 发行版的软件包管理器。\n* 你可以使用\
  \ `dnf search keyword` 来搜索带有给定关键词的包。\n* 你可以使用 `sudo dnf install package_name` 来安装软件包。\n\
  \n### 使用方法\n```bash\nherong$ dnf [options]\n```\n\n### 主要命令列表\n* `alias`: 列出或创建别名\n\
  * `autoremove`: 移除所有最初作为依赖安装的不再需要的包\n* `check`: 检查包中的问题\n* `check-update`: 检查可用的更新\n\
  * `clean`: 缓存数据\n* `deplist`: 列出包的依赖关系及其提供者\n* `distro-sync`: 将已安装的包同步到最新版本\n* `downgrade`:\
  \ 降级软件包\n* `group`: 显示或使用组信息\n* `help`: 显示帮助性的用法信息\n* `history`: 显示或使用事务历史记录\n*\
  \ `info`: 显示关于包或一组包的详细信息\n* `install`: 在系统上安装一个或多个包\n* `list`: 列出包或包组\n* `makecache`:\
  \ 生成元数据缓存\n* `mark`: 标记或取消标记已安装的包\n* `module`: 与模块交互\n* `provides`: 查找提供给定值的包\n\
  * `reinstall`: 重新安装包\n* `remove`: 从系统中移除包\n* `repolist`: 显示配置软件仓库\n* `repoquery`:\
  \ 搜索匹配关键词的包\n* `repository-packages`: 对给定仓库中的所有包运行命令\n* `search`: 为给定字符串搜索包详情\n\
  * `shell`: 运行交互式 `DNF` shell\n* `swap`: 使用交互式 `dnf mod` 移除并安装一个 spec\n* `updateinfo`:\
  \ 显示软件包公告\n* `upgrade`: 升级系统上的包或包\n* `upgrade-minimal`: 仅升级修复系统问题的“最新”包\n\n### 示例对比\n\
  ```bash\nherong$ yum info make\n\nAvailable Packages\nName:             make\nEpoch:\
  \            1\nVersion:          4.2.1\nRelease:          9.el8\nArchitecture:\
  \     x86_64\nSize:             498 k\nSource:           make-4.2.1-9.el8.src.rpm\n\
  Repository:       BaseOS\nSummary:          一个简化用户构建过程的 GNU 工具\nURL:           \
  \   http://www.gnu.org/software/make/\nLicense:          GPLv3\nDescription:   \
  \   从程序源文件生成可执行文件和其他非源文件的 GNU 工具。Make 允许用户在无需了解构建过程细节的情况下构建和安装包。关于如何构建程序的详细信息通过程序中的\
  \ makefile 提供给 make。\n\nherong$ dnf info make\n\nAvailable Packages\nName:     \
  \        make\nEpoch:            1\nVersion:          4.2.1\nRelease:          9.el8\n\
  Architecture:     x86_64\nSize:             498 k\n```\n\n\n\n\n\n# 软件包信息\n- **架构**:\
  \ `x86_64`\n- **大小**: 498 k\n- **来源**: `make-4.2.1-9.el8.src.rpm`\n- **软件仓库**: `BaseOS`\n\
  - **摘要**: 一个为用户简化构建过程的 GNU 工具\n- **URL**: http://www.gnu.org/software/make/`\n-\
  \ **许可证**: `GPLv3+`\n- **描述**: 一种用于从程序源文件控制生成程序可执行文件和其他非源文件的 GNU 工具。Make 允许用户在不了解构建过程详细细节的情况下构建并安装包。关于程序应如何构建的细节由程序中的\
  \ makefile 提供给 make 使用。\n\n因此，你应该停止使用 `YUM` 并开始习惯使用 `DNF`。`YUM` 可能会在下一次 CentOS 发布中被移除。\n\
  \n## 在 CentOS 上安装和管理 Java 包\n\n提供了一个教程示例，介绍了如何使用 `dnf/yum` 作为包管理器在 CentOS 8 系统上安装\
