  ```\n\n### 5. 验证 GCC 安装\n```bash\n# C++ 编译器\nherong$ g++ --version\ng++ (GCC) 8.3.1\n\
  ```\n\n### 6. 编译并运行 C++ 程序\n```bash\nherong$ vi hello.cpp\n#include <iostream>\n\
  int main(void) {\n  std::cout << \"Hello world from C++.\\n\";\n  return 0;\n}\n\
  herong$ g++ hello.cpp\nherong$ ./a.out\nHello world from C++.\n```\n\n## \"g++ --verbose\"\
  \ - GCC 编译步骤和设置\n\n提供了一个教程示例，介绍如何使用 `g++ --verbose` 选项导出 GCC 编译步骤和设置。如果你在使用 GCC\
  \ C++ 编译器时遇到问题，可能想使用 `g++ --verbose` 导出所有当前设置。\n\n```bash\nherong$ g++ --verbose\
  \ hello.cpp\n...\n目标: x86_64-redhat-linux\n配置为: ../configure --enable-bootstrap\
  \ --enable-languages=c,c++,fortran,lto ...\n/usr/libexec/gcc/x86_64-redhat-linux/8/cc1plus\
  \ -quiet -v -D_GNU_SOURCE hello.cpp\n  -quiet -dumpbase hello.cpp -mtune=generic\
  \ -march=x86-64 -auxbase hello -version\n  -o /tmp/cceaNqFM.s\n忽略不存在的目录 \"/usr/lib/gcc/x86_64-redhat-linux/8/include-fixed\"\
  \n忽略不存在的目录 \"/usr/x86_64-redhat-linux/include\"\n\n# include \"...\" 搜索开始:\n\n#\
  \ include <...> 搜索开始:\n```\n\n\n\n\n\n`/usr/include/c++/8`\n`/usr/include/c++/8/x86_64-redhat-linux`\n\
  `/usr/include/c++/8/backward`\n`/usr/lib/gcc/x86_64-redhat-linux/8/include`\n`/usr/local/include`\n\
  `/usr/include`\n\n搜索列表结束。\n\n```\nas -v --64 -o /tmp/ccGgvc09.o /tmp/cceaNqFM.s\n\
  ```\n\n`COMPILER_PATH=/usr/libexec/gcc/x86_64-redhat-linux/8/: ...`\n`LIBRARY_PATH=/usr/lib/gcc/x86_64-redhat-linux/8/:...`\n\
  \n```\n/usr/libexec/gcc/x86_64-redhat-linux/8/collect2 -plugin \\\n    /usr/libexec/gcc/x86_64-redhat-linux/8/liblto_plugin.so\
  \ ...\n```\n\n因此 `g++` 命令实际上运行了 3 个命令：`cc1plus`、`as` 和 `collect2`。\n\n## \"g++ -I...\"\
  \ 和 CPATH 环境变量\n\n提供了一个关于如何使用 `g++ -I...` 选项和/或 `CPATH` 环境变量为 GCC 编译器指定头文件路径的教程示例。如果你正在编译一个使用自定义头文件的\
  \ C/C++ 程序，你需要需要指定头文件所在的路径。\n\n1. 创建一个简单的头文件，`./include/myheader.h`：\n```bash\n\
  herong$ vi ./include/myheader.h\n#define Name \"herong\"\n```\n\n2. 创建一个使用该头文件的\
  \ C++ 程序文件：\n```cpp\nherong$ vi HeaderTest.cpp\n#include \"iostream\"\n#include\
  \ \"string\"\n#include \"myheader.h\"\n\nint main(void) {\n  std::string who (Name);\
  \  \n  std::cout << \"Hello \" << who << \"!\" << std::endl;\n  return 0;\n}\n```\n\
  \n3. 在不指定包含路径的情况下进行编译：\n```bash\nherong$ g++ HeaderTest.cpp\nHeaderTest.cpp:3:10:\
  \ fatal error: myheader.h: No such file or directory\n  #include \"myheader.h\"\n\
  \             ^~~~~~~~~~~~\ncompilation terminated.\n```\n\n4. 使用 `-I ...` 选项指定包含路径进行编译：\n\
  ```bash\nherong$ g++ -I ./include -v HeaderTest.cpp\n...\n#include \"...\" search\
  \ starts here:\n#include <...>  search starts here:\n  ./include\n/usr/include/c++/8\n\
  /usr/include/c++/8/x86_64-redhat-linux\n/usr/include/c++/8/backward\n/usr/lib/gcc/x86_64-redhat-linux/8/include\n\
  /usr/local/include\n/usr/include\n搜索列表结束。\n...\nherong$ ./a.out\nHello herong!\n\
  ```\n\n5. 使用 `CPATH=...` 环境变量指定包含路径进行编译：\n```bash\nherong$ export CPATH=./include\n\
  herong$ g++ -v HeaderTest.cpp\n...\n#include \"...\" search starts here:\n#include\
  \ <...>  search starts here:\n  ./include\n/usr/include/c++/8\n/usr/include/c++/8/x86_64-redhat-linux\n\
  /usr/include/c++/8/backward\n/usr/lib/gcc/x86_64-redhat-linux/8/include\n/usr/local/include\n\
  /usr/include\n搜索列表结束。\n...\nherong$ ./a.out\nHello herong!\n```\n\n现在我知道 `-I ...`\
  \ 选项或 `CPATH` 环境变量是在向 GCC 默认列表添加更多路径，以搜索包含头文件。\n\n## \"g++ -l...\" 链接库文件\n\n提供了一个关于如何使用\
  \ `g++ -static` 和 `g++ -l...` 选项将你的程序与静态或动态库文件链接的教程示例。GCC C/C++ 编译器支持 2 类型的库文件：\n\
  \n1. **静态库文件 (Static Library Files)**：静态库文件也称为存档文件（Archive files），在 Linux 系统上具有\
  \ `.a` 后缀。当你将程序与静态库文件链接时，程序中引用的所有对象都将被验证并复制到最终执行文件中。这使得可执行文件大得多。但它让执行变得更容易，因为执行时不再需要静态库文件。\n\
  2. **动态库文件 (Dynamic Library Files)**：动态库文件也称为共享对象文件（Shared Object files），在 Linux\
  \ 系统上具有 `.so` 后缀。当你将程序与动态库文件链接时，程序中引用的所有对象将被验证但不会复制到最终执行文件中。这使得可执行文件小得多。但执行变得更困难，因为动态库文件需要与你的执行文件一起加载到\
  \ CPU。\n\nGCC C/C++ 编译器允许通过 `-static` 和 `-l...` 选项控制使用哪种库文件并指定库文件。注意，实际的库名是从 `-l...`\
  \ 选项中指定的带有 `lib` 前缀和 `.a` 或 `.so` 后缀计算出的。\n\n示例 1 - 以下命令链接了当前目录下的 2 个库文件，`libabc.a`\
  \ 和 `libxyz.a`：\n```bash\nherong$ g++ -static -labc -lxyz myProgram.cpp\n```\n\n\
  示例 2 - 以下命令链接了当前目录下的 2 个库文件，`libabc.so` 和 `libxyz.so`：\n```bash\nherong$ g++ -labc\
  \ -lxyz myProgram.cpp\n```\n\n## \"g++ -c\" 和 \"ar cs\" 构建静态库\n\n提供了一个关于如何使用 `g++\
  \ -c` 和 `ar cs` 命令在 Linux 系统上编译代码并构建库文件的教程示例。如果你想构建自己的库文件，你需要分两个步骤完成：\n* 使用 `g++\
  \ -c` 编译源代码并生成对象代码文件。\n* 使用 `ar cs` 从对象代码文件构建存档文件作为库文件。\n\n以下是我构建第一个静态库文件 `libMyStatic.a`\
  \ 的操作：\n\n1. 创建一个源代码文件，`MyStatic.cpp`：\n```cpp\nherong$ cat MyStatic.cpp\n#include\
  \ \"iostream\"\nvoid myStaticFunc() {\n  std::cout << \"RunningStaticFunc()...\"\
  \ << std::endl;\n}\n```\n\n2. 将源代码文件 `MyStatic.cpp` 编译为对象代码文件 `MyStatic.o`：\n```bash\n\
  herong$ g++ -c MyStatic.cpp\nherong$ ls -l MyStatic.*\n-rw-rw-r-- 1 herong 17 Apr\
  \ 10 23:50 MyStatic.cpp\n-rw-rw-r-- 1 herong 2744 Apr 10 23:52 MyStatic.o\n```\n\
  \n3. 从对象代码文件 `MyStatic.o` 创建静态库文件 `libMyStatic.a`：\n```bash\nherong$ ar cs libMyStatic.a\
  \ MyStatic.o\nherong$ ls -l libMyStatic.*\n-rw-rw-r-- 1 herong 2898 Apr 10 23:54\
  \ libMyStatic.a\n-rw-rw-r-- 1 herong 17 Apr 10 23:50 MyStatic.cpp\n-rw-rw-r-- 1\
  \ herong 2744 Apr 10 23:52 MyStatic.o\nherong$ ar t libMyStatic.a MyStatic.o\n```\n\
  \n4. 创建一个调用程序 `MyStaticTest.cpp`：\n```cpp\nherong$ cat MyStaticTest.cpp\n#include\
  \ \"iostream\"\nextern void myStaticFunc();\nint main() {\n  std::cout << \"CallingStaticFunc()...\"\
  \ << std::endl;\n  myStaticFunc();\n}\n```\n\n5. 直接用 `MyStatic.o` 链接 `MyStaticTest.cpp`\
  \ 以确认程序正常：\n```bash\nherong$ g++ MyStatic.o MyStaticTest.cpp\nherong$ ./a.out\n\
  CallingStaticFunc()...\nRunningStaticFunc()...\n```\n\n6. 在不提供路径的情况下将 `MyStaticTest.cpp`\
  \ 链接到 `libMyStatic.a`：\n```bash\nherong$ g++ -lMyStatic MyStaticTest.cpp\n/usr/bin/ld:\
  \ cannot find -lMyStatic\n```\n\n7. 使用 `g++ -L ...` 选项指定 `libMyStatic.a`。我也可以使用\
  \ `LIBRARY_PATH` 环境变量代替 `g++ -L ...`：\n```bash\nherong$ g++ -L . -lMyStatic MyStaticTest.cpp\n\
  /tmp/cciFWV0h.o: In function `main`:\nMyStaticTest.cpp:(.text+0x21): undefined reference\
  \ to `myStaticFunc()`\n```\n\n8. 强制 GCC 进行静态库链接：\n```bash\nherong$ g++ -static -L\
  \ . -lMyStatic MyStaticTest.cpp\n/usr/bin/ld: cannot find -lstdc++\n/usr/bin/ld:\
  \ cannot find -lm\n/usr/bin/ld: cannot find -lc\ncollect2: error: ld returned 1\
  \ exit status\n```\n看来我仍然缺少让 GCC 处理静态库文件的方法。顺便说，你可以使用 `LIBRARY_PATH` 环境变量来指定静态库路径，而不是使用\
  \ `g++ -L ...` 选项。\n\n## \"g++ -shared\" 构建动态库\n\n提供了一个关于如何使用 `g++ -shared` 命令在\
  \ Linux 系统上编译代码并构建库文件的教程示例。如果你想构建自己的动态库文件，你需要使用 `g++ -shared` 命令。\n\n以下是我构建第一个动态库\
  \ `libMyDynamic.so` 的操作：\n\n1. 创建一个源代码文件，`MyDynamic.cpp`：\n```cpp\nherong$ cat MyDynamic.cpp\n\
  #include \"iostream\"\nvoid myDynamicFunc() {\n```\n\n\n\n\n\n```cpp\nstd::cout\
  \ << \"Running myDynamicFunc()...\" << std::endl;\n}\n```\n\n### 2. 将源文件 `MyDynamic.cpp`\
  \ 编译为动态库文件：\n```bash\nherong$ g++ -shared -o libMyDynamic.so MyDynamic.cpp\n```\n\
  ```\n/usr/bin/ld: /tmp/ccG05g0J.o: relocation R_X86_64_32 against `.rodata' can\
  \ not be used when making a shared object; recompile with -fPIC\n/usr/bin/ld: final\
  \ link failed: Nonrepresentable section on output\n```\n\n### 3. 根据建议，使用 \"-fPIC\"\
  \ 选项重新编译：\n```bash\nherong$ g++ -shared -fPIC -o libMyDynamic.so MyDynamic.cpp\n\
  ```\n```bash\nherong$ ls -l *MyDynamic*\n-rwxrwxr-x. 1 herong herong 8872 Apr 13\
  \ 01:57 libMyDynamic.so\n-rw-rw-r--. 1 herong herong  120 Apr 13 01:53 MyDynamic.cpp\n\
  ```\n\n### 4. 创建一个调用程序 `MyDynamicTest.cpp`：\n```bash\nherong$ cat MyDynamicTest.cpp\n\
  // MyDynamicTest.cpp\n#include \"iostream\"\nextern void myDynamicFunc();\n\nint\
  \ main() {\n  std::cout << \"Calling myDynamicFunc()...\" << std::endl;\n  myDynamicFunc();\n\
  }\n```\n\n### 5. 在不提供路径的情况下将 `MyDynamicTest.cpp` 与 `libMyDynamic.so` 链接：\n```bash\n\
  herong$ g++ -lMyDynamic MyDynamicTest.cpp\n```\n```\n/usr/bin/ld: cannot find -lMyDynamic\n\
  ```\n\n### 6. 使用 `g++ -L ...` 选项提供路径，将 `MyDynamicTest.cpp` 与 `libMyDynamic.so` 链接。我也可以使用环境变量\
  \ `LIBRARY_PATH` 来替 `g++ -L ...`。\n```bash\nherong$ g++ -L . -lMyDynamic MyDynamicTest.cpp\n\
  herong$ ./a.out\nCalling myDynamicFunc()...\nRunning myDynamicFunc()...\n```\n\n\
  ### 7. 注销并重新登录再次运行程序。我如预期得到了一个错误，因为 `libMyDynamic.so` 不再加载到 CPU 中，程序加载器不知道去哪里寻找它。\n\
  ```bash\nherong$ ./a.out\n./a.out: error while loading shared libraries: libMyDynamic.so:\n\
  \    cannot open shared object file: No such file or directory\n```\n\n### 8. 将\
  \ `LD_LIBRARY_PATH` 设置为动态库路径再次运行：\n```bash\nherong$ export LD_LIBRARY_PATH=.\nherong$\
  \ ./a.out\nCalling myDynamicFunc()...\nRunning myDynamicFunc()...\n```\n\n很酷。在 Linux\
  \ 系统，GCC C/C++ 编译器处理动态库比处理静态库简单得多。\n\n## ldd - 动态库依赖检查器\n提供了一个如何使用 `ldd` 工具列出任何可执行文件的动态库依赖教程示例，包括\
  \ Linux 系统上的动态库文件。大多数可执行程序使用动态库是因为有两个主要优点：\n\n- 使可执行程序文件更小，因为依赖的程序代码存储在外部动态库文件中。\n\
  - 减少加载时间和内存占用，因为依赖的程序代码是单独加载的并可以被多个程序共享。\n\n如果你想知道一个可执行程序使用了哪些动态库，你可以在 Linux 系统上使用\
  \ `ldd` 命令。这里是 `ldd` 命令的一些用法示例。\n\n### 1. 列出 `ls` 系统命令程序的动态库依赖项。我看到了 8 个系统库。\n```bash\n\
  herong$ which ls\n  /usr/bin/ls\nherong$ ldd /bin/ls\n  linux-vdso.so.1 (0x00007ffd037900)\n\
  \  libinux.so.1 => /lib64/libinux.so.1 (0x00007fe8a1cd00)\n  libcap.so.2 => /lib64/libcap.so.2\
  \ (0x00007fe8a1c700)\n  libc.so.6 => /lib64/libc.so.6 (0x00007fe8a130400)\n  libpcre2-8.so.0\
  \ => /lib64/libpcre2-8.so.0 (0x00007fe8a108000)\n  libdl.so.2 => /lib64/libdl.so.2\
  \ (0x00007fe8a0e7c00)\n  /lib64/ld-linux-x86-64.so.2 (0x00007fe8a1d1b00)\n  libpthread.so.0\
  \ => /lib64/libpthread.so.0 (0x00007fe8a0c5c00)\n```\n\n### 2. 列出由 `hello.c` 编译的\
  \ C 程序的动态库依赖。我看到了 2 个系统库和 1 个 C 库。\n```bash\nherong$ gcc -o hello hello.c\nherong$\
  \ ./hello\nHello world! From C.\nherong$ ldd hello\n  linux-vdso.so.1 (0x00007ffd5fc6000)\n\
  \  libc.so.6 => /lib64/libc.so.6 (0x00007fe8a1f2600)\n  /lib64/ld-linux-x86-64.so.2\
  \ (0x00007fe8a1f3200)\n```\n\n### 3. 列出由 `hello.cpp` 编译的 C++程序的动态库依赖。我看到了 3 个库。\n\
  ```bash\nherong$ g++ -o hello hello.cpp\nherong$ ./hello\nHello world! From C++.\n\
  herong$ ldd hello\n  linux-vdso.so.1 (0x00007fedec3c2000)\n  libstdc++.so.6 => /lib64/libstdc++.so.6\
  \ (0x00007fe8a58c000)\n  libm.so.6 => /lib64/libm.so.6 (0x00007fe8a5b0000)\n  libgcc_s.so.1\
  \ => /lib64/libgcc_s.so.1 (0x00007fe8a3a4000)\n  libc.so.6 => /lib64/libc.so.6 (0x00007fe8a7f2000)\n\
  \  /lib64/ld-linux-x86-64.so.2 (0x00007fe8a7f9100)\n```\n\n### 4. 列出使用自有动态库的程序的动态库依赖。我在列表中看到了动态库\
  \ `libMyDynamic.so`。\n```bash\nherong$ g++ -L . -lMyDynamic -o MyDynamicTest MyDynamicTest.cpp\n\
  herong$ export LD_LIBRARY_PATH=.\nherong$ ./MyDynamicTest\nCalling myDynamicFunc()...\n\
  Running myDynamicFunc()...\nherong$ ldd MyDynamicTest\n  linux-vdso.so.1 (0x00007ffd01126000)\n\
  \  libMyDynamic.so => ./libMyDynamic.so (0x00007ffd04c1700)\n  libstdc++.so.6 =>\
  \ /lib64/libstdc++.so.6 (0x00007ffd04c82000)\n  libm.so.6 => /lib64/libm.so.6 (0x00007ffd04bf0000)\n\
  \  libgcc_s.so.1 => /lib64/libgcc_s.so.1 (0x00007ffd04bce800)\n  libc.so.6 => /lib64/libc.so.6\
  \ (0x00007ffd04c92500)\n  /lib64/ld-linux-x86-64.so.2 (0x00007ffd04c81900)\n```\n\
  \n### 5. 如果环境变量 `LD_LIBRARY_PATH` 设置不，某些动态库将被列为“not found”（未找到）。\n```bash\nherong$\
  \ export LD_LIBRARY_PATH=/tmp\nherong$ ldd MyDynamicTest\n  linux-vdso.so.1 (0x00007ffd9e734000)\n\
  \  libMyDynamic.so => not found\n  libstdc++.so.6 => /lib64/libstdc++.so.6 (0x00007ffd9e33e000)\n\
  \  libm.so.6 => /lib64/libm.so.6 (0x00007ffd9e35bc00)\n  libgcc_s.so.1 => /lib64/libgcc_s.so.1\
  \ (0x00007ffd9e3a4000)\n  libc.so.6 => /lib64/libc.so.6 (0x00007ffd9e72fe100)\n\
  \  /lib64/ld-linux-x86-64.so.2 (0x00007ffd9ecd300)\n```\n\n### 6. \"ldd\" 也适用于动态库文件（*.so\
  \ 文件），因为它们是可执行文件。\n```bash\nherong$ g++ -shared -fPIC -o libMyDynamic.so MyDynamic.cpp\n\
  herong$ ldd libMyDynamic.so\n  linux-vdso.so.1 (0x00007ffd7f35d000)\n  libstdc++.so.6\
  \ => /lib64/libstdc++.so.6 (0x00007ffd7f9e271900)\n  libm.so.6 => /lib64/libm.so.6\
  \ (0x00007ffd7f9b000)\n  libgcc_s.so.1 => /lib64/libgcc_s.so.1 (0x00007ffd7f97700)\n\
  \  libc.so.6 => /lib64/libc.so.6 (0x00007ffd7f9a000)\n  /lib64/ld-linux-x86-64.so.2\
  \ (0x00007ffd7f9b000)\n```\n\n### 7. 抱歉，“ldd” 不作用于目标文件（.o），因为它们不是可执行文件。\n```bash\n\
  herong$ g++ -c -o hello.o hello.cpp\nherong$ ldd hello.o\nldd: warning: you do not\
  \ have permission for './hello.o'\nnot a dynamic executable\n```\n\n\n\n\n\n: 允许用户构建并安装包，而无需大量了解构建过程的细节。关于程序如何构建的细节由程序中的\
  \ `makefile` 提供给 `make`。\n\n### 2. 验证 \"make\" 版本\n```bash\nherong$ make --version\n\
  GNU Make 4.2.1\nBuilt for x86_64-redhat-linux-gnu\nCopyright (C) 1988-2016 Free\
  \ Software Foundation, Inc.\n```\n\n### 3. 创建包含一个任务的 \"Makefile\"\n```bash\nherong$\
  \ cat Makefile\ncompile: hello.cpp\n  g++ -o hello hello.cpp\n```\n\n### 4. 运行 \"\
  Makefile\" 中指定的任务\n```bash\nherong$ make compile\ng++ -o hello hello.cpp\n```\n\n\
  ### 5. 验证结果\n```bash\nherong$ ./hello\nHello world! From C++.\n```\n\n好了。现在我可以使用\
  \ `make` 工具在我的 CentOS 8 计算机上自动化任何任务了。\n\n---\n\n# Conda - 环境与包管理器\n\nConda 提供了关于\
  \ Conda 环境的介绍和教程示例。主题包括从 Miniconda 安装包安装 Conda；启动/结束 Conda `base` 环境；安装 Conda 包。\n\
  \n### 核心要点\n- `Conda` 是一个强大的开源环境和包管理器，允许你为多个版本的软件软件包及其依赖项安装多个环境，并在它们之间轻松切换。\n- `Miniconda`\
  \ 是 `Conda` 最小的发行包。\n- `Conda` 发行包包含一个 `base` Conda 环境。\n- `Conda` 环境是一个针对特定版本 Python\
  \ 脚本引擎及其库的独立 shell 环境。\n- `Conda` 命令允许你管理 Conda 环境并创建新环境。\n\n## 什么是 Conda\nConda\
  \ 提供了关于 Conda 的快速介绍，它是一个强大的开源环境和包管理器，允许你为多个版本的软件软件包及其依赖项安装多个环境，并在它们之间轻松切换。\n\n什么是\
  \ Conda？`Conda` 是一个强大的开源环境和包管理器，允许你为多个版本的软件软件包及其依赖项安装多个环境，并在它们之间轻松切换。`Conda` 最初开发是为了是为了解决复杂的\
  \ Python 包管理挑战。\n\n`Conda` 包含在两个发行包中：\n- `Miniconda`:包含 `Conda` 及其依赖项（包括 Python）。\n\
  - `Anaconda`:包含 `Conda` 和 7,500 个流行的开源软件包，包括 Python、R、Jupyter/IPython、ggplot2、NumPy、SciPy、Pandas\
  \ 等。\n\n对于大多数用户来说，下载并安装 `Miniconda` 就足够了。如果你任何额外的包，可以从 Conda 包仓库单独下载并安装。更多信息请访问\
  \ Conda 网站 `https://www.anaconda.com`。\n\n## 安装 Miniconda 3\n提供关于如何安装 Miniconda\
