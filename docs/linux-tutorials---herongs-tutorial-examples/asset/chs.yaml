  \ vsftpd - 非常安全的 FTP 守护进程\n提供了关于 vsftpd - 非常安全的 FTP 守护程序的介绍和教程示例。主题包括安装 vsftpd；配置\
  \ vsftpd 以允许本地用户访问；测试本地和远程 FTP 访问；启用基于 SSL/TLS 的 FTP 以加密连接。\n\n\n\n\n\n# URL: `https://security.appspot.com/vsftpd.html`\n\
  许可证: `GPLv2 带有异常条款`\n 描述: `vsftpd` 是一个非常安全的 FTP 守护进程。它完全从零开始编写。\n\n## 安装 vsftpd\n\
  \n```bash\nherong$ sudo dnf install vsftpd\n...\n下载包:\nvsftpd-3.0.3-28.el8.x86_64.rpm\
  \   2.5 MB/s | 180 kB   00:00\n...\n安装:\nvsftpd-3.0.3-28.el8.x86_64\n完成！\n```\n\n\
  ### 2. 启用 vsftpd 以便在系统启动时自动启动：\n```bash\nherong$ sudo systemctl enable vsftpd\n\
  ```\n创建符号链接 `/etc/systemd/system/multi-user.target.wants/vsftpd.service` -> `/usr/lib/systemd/system/vsftpd.service`。\n\
  \n### 3. 启动 vsftpd 并检查其状态：\n```bash\nherong$ sudo systemctl start vsftpd\nherong$\
  \ sudo systemctl status vsftpd\n```\n```text\nvsftpd.service - Vsftpd ftp daemon\n\
  \  Loaded: loaded (/usr/lib/systemd/system/vsftpd.service; enabled; ...)\n  Active:\
