  \ with ...\nDescription:  gcc 包包含第 8 版本的 GNU 编译器集。你需要此包来编译代码。\nherong$ sudo dnf\
  \ install gcc\n...\n已安装:\n  gcc-8.3.1-4.5.el8.x86_64\n  annobin-8.7.el8.x86_64\n\
  \  cpp-8.3.1-4.5.el8.x86_64\n  isl-0.16.1.el8.x86_64\n  glibc-devel-2.28-72.el8.x86_64\n\
