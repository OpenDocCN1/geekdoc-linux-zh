  \n3. 在活动区域中开放端口范围，以接收传入的 FTP 被动连接。\n```bash\nherong$ sudo firewall-cmd --zone=public\
  \ --add-port=30000-31000/tcp\nsuccess\n```\n\n4. 列出活动区域 \"public\" 中的所有设置：\n```bash\n\
