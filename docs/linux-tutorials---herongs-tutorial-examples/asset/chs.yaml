  \ 磁盘上的旧文件了！\n\n# W95 Ext'd (LBA) 分区\n\n对 `W95 Ext'd LBA`（Windows 95 扩展逻辑块体系）区的快速介绍，它实际上是一个包含子分区的容器。如果你在使用从\
  \ Windows 计算机创建的硬盘，你可能会看到一个类型为 `W95 Ext'd (LBA)` 的特殊分区。`W95 Ext'd (LBA)` 代表 Windows\
  \ 95 扩展逻辑块体系。\n\n`W95 Ext'd LBA` 并不是文件系统分区。它实际上是一个包含子分区的容器。在 Windows 系统上，硬盘最多只能分为\
  \ 4 个分区。`W95 Ext'd LBA` 技术允许你从这 4 个主分区创建更多的子分区。如果你看到一个硬盘有超过 4 个分区，或者看到分区索引高于 4 的分区，你就知道该硬盘上使用了\
  \ `W95 Ext'd LBA`。\n\n例如，我的 CentOS 计算机上有以下分区：\n\n```bash\nherong$ sudo fdisk -l\
  \ /dev/sda\n\nDisk /dev/sda: 900.0 GiB\nUnits: sectors of 1 * 512 = 512 bytes\n\
  Sector size (logical/physical): 512 bytes / 4096 bytes\nI/O size (minimum/optimal):\
  \ 4096 bytes / 4096 bytes\nDisklabel type: dos\nDevice     Boot       Start    \
  \     End      Sectors    Size Id Type\n/dev/sda1  *             2048  167776255\
  \  167774208     80G  7 HPFS/NTFS/exFAT\n/dev/sda2             167776256 1953523711\
  \ 1785747456 851.5G  f W95 Ext'd (LBA)\n/dev/sda5             167778304 1748721663\
  \ 1580943360 753.9G  7 HPFS/NTFS/exFAT\n/dev/sda6             1748723712 1750820863\
  \     20971522      1G 83 Linux\n/dev/sda7             1750822912 1953523711  202700800\
  \   96.7G 8e Linux LVM\n```\n\n输出告诉我：\n* 硬盘只有 2 个主分区 `/dev/sda1` 和 `/dev/sda2`。\n\
  * `/dev/sda1` 有 80 GB 的 Windows NTFS 格式，并带有引导区以用于我的 Windows 系统。\n* `/dev/sda2` 有\
  \ 850 GB 的 `W95 Ext'd LBA` 格式，包含 3 个子分区：`/dev/sda5`、`/dev/sda6` 和 `/dev/sda7`。\n\
  * `/dev/sda5` 是 753 GB 的 Windows NTFS 格式子分区。\n* `/dev/sda6` 是 1 GB 的 Linux 格式子分区，用于存放\
  \ Linux 的 `/root` 文件。\n* `/dev/sda7` 是 96 GB 的 Linux LVM 格式子分区，用于我的 Linux 系统。\n\n\
  因此，不要尝试将 `W95 Ext'd LBA` 格式的 `/dev/sda2` 挂载到 Linux 系统，它不是真正的文件系统。\n\n# 文件系统类型、ID\
  \ 和格式\n\n列出了 Linux 系统上常用的文件系统格式及其识别代码。如果你从朋友那里收到一个存储设备，你可能会在 Linux 计算机上挂载其分区时遇到困难。这是因为该存储设备可能是用\
  \ Linux 无法识别的文件系统格式创建的。为了帮助你处理这种情况，这里是常用文件系统格式列表及处理建议。\n\n1. **Linux** - `Linux\
  \ (ID: 83)` 用于识别一些旧的 Linux 原生文件系统，如 `xiafs`、`ext2`、`ext3`、`reiserfs` 等。它仍可能用于存放现代\
  \ Linux 系统（如 CentOS）上的 `/root` 文件。\n2. **Linux LVM** - `Linux LVM (ID: 8e)` 用于识别\
  \ Linux LVM（逻辑卷管理器）分区。它在 CentOS 系统中作为主文件系统。\n3. **Linux Swap** - `Linux Swap (ID:\
  \ 82)` 用于识别 Linux 交换分区。\n4. **FAT16** - `FAT16 (ID: 6)` 用于识别 16 位 FAT（文件分配表）分区，由旧的\
  \ DOS（磁盘操作系统）计算机使用。大多数 Linux 系统默认支持 FAT16。\n5. **NTFS** - `NTFS (ID: 7)` 用于识别 NTFS（新技术文件系统）分区，由旧\
  \ Windows 计算机使用。你可能需要安装 `ntfs-3g` 设备来支持它。\n6. **HPFS** - `HPFS (ID: 7)` 用于识别旧操作系统计算机使用的\
  \ HPFS（可安装文件系统）。你需要安装特殊的设备驱动来支持它。\n7. **exFAT** - `exFAT (ID: 7)` 用于识别 exFAT（扩展文件分配表）分区，由旧\
  \ Windows Vista 使用。你可能需要安装 `fuse-exfat` 设备来支持它。\n8. **W95 Ext'd LBA** - `W95 Ext'd\
  \ LBA (ID: f)` 用于识别 Windows 95 扩展 LBA（逻辑块体系）分区。注意 `W95 Ext'd LBA` 不是文件系统。它实际上是一个包含子分区的容器。在\
  \ Windows 系统上，硬盘最多只能分为 4 个分区。`W95 Ext'd LBA` 技术允许你从这 4 个主分区创建更多的子分区。\n9. **OpenBSD**\
  \ - `OpenBSD (ID: a6)` 用于识别 OpenBSD（伯克利软件发行）分区，由 OpenBSD 计算机使用。你需要安装特殊的设备驱动来支持它。\n\
  10. **Mac OS-X** - `Mac OS-X (ID: a8)` 用于识别 Mac OS-X 分区，由 Mac OS-X 计算机使用。你需要安装特殊的设备驱动来支持它。\n\
  \n# 安装 CentOS\n\n提供了安装 Linux 系统的教程。主题包括下载 CentOS ISO 文件；使用 `dd` 复制镜像文件创建可启动 USB\
  \ 盘；从可启动 USB 盘安装 CentOS。\n\n### 总结\n* 你可以在 macOS 计算机上下载 ISO ISO 并使用 `dd` 命令创建可启动的\
  \ USB 盘。\n* 如果硬盘上有足够的可用空间，从可启动 USB 盘安装 CentOS 系统是非常直接的。\n* 你可以使用内置的磁盘工具删除现有分区以腾出空间。\n\
  \n## 创建可启动 USB\n提供了一个如何在 macOS 计算机上下载完整的 CentOS ISO 文件并创建可启动 USB 盘的教程示例。CentOS 8\
  \ 是 CentOS 系统的最新发布版本，它是 RHEL（红帽企业 Linux）的开源版本。如果你想尝试，可以按照下面的描述遵循我的做法来下载 CentOS 8.1\
  \ ISO 文件并创建可启动 USB 盘。\n\n1. 访问 CentOS 下载网站 `https://wiki.centos.org/Download`。我看到了\
  \ CentOS 8、7 和 6 的下载选项。\n2. 点击 `CentOS 8.1 (1911)` 旁边的 `mirrors` 按钮。我看到了下载镜像站列表。\n\
  3. 选择一个离你最近的站点，例如 `http://centos.les.net/`。我看到两个 ISO 镜像文件：`CentOS-8.1.1911-x86_64-boot.iso`\
  \ 和 `CentOS-8.1.1911-x86_64-dvd1.iso`。它们适用于具有 `x86_64` CPU 架构的计算机。\n    * `boot.iso`\
  \ 要小得多，只包含可启动的 CentOS 8 内内核。使用 `boot.iso` 安装 CentOS 8 时，需要在线下载额外的系统和应用程序包。\n   \
  \ * `dvd1.iso` 要大得多，包含了所有系统包和基础应用程序包。你可以使用 `dvd1.iso` 安装 CentOS 8，而无需从互联网下载任何内容。\n\
  4. 点击 `CentOS-8.1.1911-x86_64-dvd1.iso` 并将其保存到我的 macOS 计算机。我选择了 `CentOS-8.1.1911-x86_64-dvd1.iso`，因为它匹配我想安装\
  \ CentOS 的联想计算机所使用的 CPU 架构 `x86_64`。你可以通过进入镜像站的父目录来选择其他架构的 ISO 文件。\n5. 等待下载完成，这可能需要时间。\n\
  6. 在我的 macOS 计算机上使用 `dd` 命令将 `CentOS-8.1.1911-x86_64-dvd1.iso` 拷贝到 USB 盘。你也可以通过\
  \ `Etcher` 或 `Rufus` ISO 工具来完成，这比使用 `dd` 命令安全得多。\n\n```bash\nmacOS$ df\n```\n\n\n\
  \n\n```\n/dev/disk1          29% 1024263 4293943016    0%    /\n/dev/disk2s1   \
  \       3%       0            0  100%   /Volumes/NO NAME\n```\n\n（将 ISO 文件复制到 USB\
  \ 盘，`/dev/disk2`，而不是文件系统）\n\n（使用 `64k` 的大块效率更高且耗时更短）\n\n```bash\nsudo dd if=CentOS-8.1.1911-x86_64-dvd1.iso\
  \ of=/dev/disk2 bs=64k\n```\n\n7. 将此 USB 盘标记为 \"CentOS 8.1 Bootable\"。参考接下来的教程了解如何从此\
  \ USB 盘启动并在任何计算机上安装 CentOS。\n\n## 从可启动的 USB 安装 CentOS\n提供了一个了一个教程示例，介绍了如何在联想电脑上通过\
  \ CentOS 可启动的 USB 盘安装 CentOS 操作系统。在创建了 CentOS 可启动 USB 盘后，你可以按照此教程在联想电脑上进行尝试。\n\n\
  1. 关闭联想电脑并移除所有 USB 盘。\n2. 将 \"CentOS Bootable\" USB 盘插入联想电脑并重新启动。\n3. 电脑完成从 USB\
  \ 盘启动后，等待 CentOS 安装界面。如果它仍在从内部硬盘启动，你需要更改 BIOS 启动顺序，以确保 USB 盘列在内部硬盘之前。在启动过程开始时按 `F10`\
  \ 可进入 BIOS 设置。\n4. 从安装界面选择 \"Install CentOS Linux\"安装 CentOS Linux）。我看到了语言选择界面。\n\
  5. 从安装界面选择 \"English\"英语）并点击 \"Continue”（继续）。我看到了安装摘要界面。\n6. 如果你想使用默认配置，且硬盘上有足够的可用空间，请点击\
  \ \"Begin Installation”（开始安装）。我看到了 root 用户设置界面。\n7. 为 root 用户输入新密码，并创建一个具有管理员权限的新用户\
  \ \"herong\"。\n8. 拔出 USB 盘并重启电脑。我看到 CentOS 8 运行在我的电脑上！太酷了。安装 CentOS 8 真的太简单了！！\n\
  \n## 通过删除现有分区安装 CentOS\n提供了一个教程示例，介绍了如何在联想电脑上通过删除现有硬盘分区来释放空间以安装 CentOS 系统。如果硬盘上没有足够的可用空间（未分区空间），CentOS\
  \ 安装程序将强制你选择要删除哪个现有分区，以为新的 CentOS 系统释放空间。以下是我在第二台联想电脑上的操作。\n\n1. 从 CentOS 可启动的 USB\
  \ 盘启动电脑。\n2. 继续安装过程直到进入安装摘要界面。我看到系统部分的 \"Installation Destination\"安装目标被高亮并显示警告。\n\
  3. 点击 \"Installation Destination\"链接。我看到了\"Installation Destination\"配置页，列出了两个存储设备：内部硬盘和可启动的\
  \ USB。硬盘已完全分区，仅剩 `2.55 MB` 空闲空间。\n4. 选择内部硬盘作为安装目标。勾选 \"I would like to make additional\
  \ space available\"我想提供额外的空间）复选框。\n5. 点击 \"Done\"完成）按钮。我看到一条警告信息，显示没有空间安装 CentOS。但我可以使用内置的空间回收工具来缩小或删除现有分区。\n\
  6. 点击 \"Reclaim Space\"回收空间）。我看到硬盘上列出了 3 个分区。\n7. 选择第三个分区，它上面有垃圾数据。点击 \"Delete\"\
  删除）以为 CentOS 系统释放足够的空间。\n8. 再次点击 \"Reclaim Space\"回收空间）返回安装摘要界面。\n9. 点击 \"Begin\
  \ Installation\"开始安装以完成安装过程。\n\n# SELinux - 安全增强型 Linux\n提供 SELinux（Security-Enhanced\
  \ Linux）的介绍和教程。主题包括 SELinux 基础概念介绍；用户、角色、域、类型、类和布尔值；类型强制（Type Enforcement）规则语法和数据库；修改\
  \ SELinux 策略规则；使用 SELinux 相关工具。\n\n- 什么是 SELinux（安全增强型 Linux）\n- CentOS 上的 SELinux\
  \ 配置与状态\n- 什么是 SELinux 用户\n- 什么是 SELinux 角色\n- 什么是 SELinux 类型\n- 什么是 SELinux 域\n\
  - SELinux 策略规则\n- 什么是 SELinux 布尔值\n- SELinux 相关工具\n- SELinux 错误信息\n- SELinux 相关术语\n\
  \n### 核心要点总结\n- **SELinux**: `SELinux` 是一种用于 Linux® 系统的安全架构，允许管理员对谁可以访问系统拥有更多控制权。\n\
  - **SELinux User**: `SELinux User` 是一个抽象概念，代表 Linux 系统上的一组真实用户，作为 SELinux 系统中的安全主体。\n\
  - **SELinux Role**: `SELinux Role` 是一个抽象概念，代表为特定功能角色分组在一起的一组权限。\n- **SELinux Type**:\
  \ `SELinux Type` 是一个抽象概念，代表一组分组在一起的文件/目录，以便安全策略可以应用在组级别，而不是单独地应用到文件/目录层级上。\n- **SELinux\
  \ Domain**: `SELinux Domain` 是一个抽象概念，代表一组分组在一起的运行进程，以便安全策略可以应用在组级别，而不是单独地应用到进程层级上。\n\
  - **Type Enforcement**: `Type Enforcement`（类型强制）策略规则的定义为 `allow \"source\" on \"\
  target\" of \"class\" with \"permissions\"` 的形式。\n- **SELinux Boolean**: `SELinux\
  \ Boolean` 是一种布尔标志，可以添加到一个或多个 SELinux 策略规则中，用以开启或关闭这些规则。\n- **semanage**: `semanage`\
  \ 命令用于配置 SELinux 策略的某些元素，而无需修改或从策略源重新编译。\n- **seinfo**: `seinfo` 命令用于打印 SELinux\
  \ 策略信息。\n- **sesearch**: `sesearch` 是一个 SELinux 策略规则搜索工具。\n- **Logs**: SELinux 错误信息记录在\
  \ `/var/log/messages` 文件中。\n\n\n\n\n\n# SELinux - 安全增强型 Linux\n\n## 什么是 SELinux\
  \ (安全增强型 Linux)\n提供了 SELinux（安全增强型 Linux）的快速介绍，它由两个部分组成：安全服务器和策略数据库。它们共同工作，为想要访问\
  \ Linux 系统上给定对象的实体提供安全服务。\n\n### 什么是 SELinux (安全增强型 Linux)？\nSELinux 是针对 Linux®\
  \ 系统的一种安全架构，允许管理员对谁可以访问系统拥有更多控制权。它最初由美国国家安全局（NSA）开发，是通过 Linux 安全模块（`LSM`）对 Linux\
  \ 内核系列补丁。\n\nSELinux 由两个部分组成：SELinux 安全服务器和 SELinux 策略数据库。如下所示，它们共同工作，为想要访问 Linux\
  \ 系统上给定对象的实体提供安全服务（来源：mit.edu）：\n\n![](img/Image00005.jpg)\n\n### SELinux - 访问权限决策过程\n\
  当主体（例如，应用程序）尝试访问对象（例如，文件）时，内核中的策略执行服务器会检查访问向量缓存（`AVC`），其中缓存了主体和对象的权限。如果无法根据 AVC\
  \ 中的数据做出决策，请求将继续传递到安全服务器，并在矩阵中查找应用程序和文件的安全上下文。然后授予或拒绝权限，如果权限被拒绝，则会在 `/var/log/messages`\
  \ 中详细记录 `avc: denied` 消息。主体和对象的安全上下文应用自安装的策略，该策略还为填充安全服务器的矩阵提供信息。\n\n当 SELinux 运行并强制执行时，你的\
  \ Linux 系统将有两个级别的安全控制同时运行，这会给你带来更多困惑，但会为你提供一个更安全的环境。\n\n*   **Linux 默认访问控制**：一种\
  \ DAC（自主访问控制）类型的权限系统，基于所有权（用户、组和其他其它用户）和访问类型（读、写和执行）的访问控制矩阵。\n*   **SELinux 访问控制**：一种\
  \ MAC（强制访问控制）类型的权限系统，基于存储在策略数据库中的显式访问规则。\n\n因此，用户可能拥有 Linux 默认访问控制的读取文件的权限，但仍被 SELinux\
  \ 访问控制拒绝。更多信息请参阅 “USING SELINUX” 指南。\n\n## CentOS  SELinux 配置和状态\n提供了一个教程示例，说明如何通过查看\
  \ `/etc/sysconfig/selinux` 文件查看当前的 SELinux 配置，并通过运行 `/usr/sbin/sestatus` 命令查看当前的\
  \ SELinux 状态。\n\n如果你正在运行 CentOS 8 系统，SELinux 默认安装并运行。你可以通过查看 `/etc/sysconfig/selinux`\
  \ 文件查看当前的 SELinux 配置。以下是我 CentOS 8 上的配置：\n\n```bash\nherong$ more /etc/sysconfig/selinux\n\
  \n# 此文件控制系统上 SELinux 的状态。\n# SELINUX= 可以取以下三个值之一：\n#      enforcing - 强制执行 SELinux\
  \ 安全策略。\n#      permissive - SELinux 打印警告而不是强制执行。\n#      disabled - 不加载任何 SELinux\
  \ 策略。\nSELINUX=enforcing\n\n# SELINUXTYPE= 可以取以下三个值之一：\n#      targeted - 保护目标进程，\n\
  #      minimum - 修改目标策略。仅保护选定的进程。\n#      mls - 多级安全保护。\nSELINUXTYPE=targeted\n\
  ```\n\n因此，我在“targeted”进程上以“enforcing”模式运行 SELinux。如果你想查看 SELinux 的当前状态，可以运行 `/usr/sbin/sestatus`\
  \ 命令：\n\n```bash\nherong$ /usr/sbin/sestatus -v\n\nSELinux status:             \
  \  enabled\nSELinuxfs mount:              /sys/fs/selinux\nSELinux root directory:\
  \       /etc/selinux\nLoaded policy name:           targeted\nCurrent mode:    \
  \             enforcing\nMode from file:              enforcing\nPolicy MLS:   \
  \                enabled\nPolicy deny_unknown:         allowed\nMemory protection:\
  \            (secure)\nMax kernel version:           3\nProcess contexts:\nCurrent\
  \ context:              unconfined_u:unconfined_r:unconfined_t:s0-s0:c0.c123\nInit\
  \ context:                system_u:system_r:init_t:s0\nFile contexts:\nControlling\
  \ terminal:          unconfined_u:object_r:user_pts_t:s0\n/etc/passwd          \
  \         system_u:object_r:passwd_file_t:s0\n/etc/shadow                   system_u:object_r:shadow_t:s0\n\
  /bin/bash                     system_u:object_r:shell_exec_t:s0\n/bin/login    \
  \                system_u:object_r:login_exec_t:s0\n/bin/sh                    \
  \  system_u:object_r:bin_t:s0 -> system_u:object_r:shell_exec_t:s0\n/sbin/agetty\
  \                  system_u:object_r:getty_exec_t:s0\n/sbin/init               \
  \     system_u:object_r:bin_t:s0 -> system_u:object_r:init_exec_t:s0\n/usr/sbin/sshd\
  \                system_u:object_r:sshd_exec_t:s0\n```\n\n## 什么是 SELinux 用户\n提供了关于\
  \ SELinux 用户的快速介绍，以及一个如何查看当前 SELinux 用户映射以及为特定用户更改 SELinux 用户映射的教程示例。SELinux 使用了几个基本概念：SELinux\
  \ 用户、SELinux 角色、SELinux 域和 SELinux 类型。它们共同用于以以下形式定义 SELinux 安全策略：\n\n*   “SELinux\
  \ 用户”可以扮演“SELinux 角色”\n*   “SELinux 角色”可以进入“SELinux 域”\n*   “SELinux 域”拥有对“SELinux\
  \ 类型”的访问权限\n\nSELinux 用户是一个抽象概念，代表 Linux 系统上的一组真实用户，作为 SELinux 系统中的安全实体（subject）。默认情况下，SELinux\
  \ 具有以下预定义的 SELinux 用户：\n\n*   `guest_u`：供具有最低权限的用户使用。`guest_u` 用户没有网络访问权限，在 `/home`\
  \ 中没有脚本执行权限，无法使用 `sudo` 或 `su` 命令获取更高权限。\n*   `root`：供具有最高权限的 root 用户使用。\n*   `staff_u`：供需要同时执行非管理和管理任务的用户使用。`staff_u`\
  \ 用户具有 GUI、网络访问权限，并可以使用 `sudo` 命令。\n*   `sysadm_u`：供仅执行管理任务的用户使用。`sysadm_u` 用户可以执行像\
  \ `staff_u` 用户的所有任务，此外他可以使用 `su` 命令。\n*   `system_u`：供运行系统的特殊用户使用。\n*   `unconfined_u`：供除目标服务外几乎没有任何限制的用户使用。\n\
  *   `user_u`：供没有特殊权限的普通用户使用。\n*   `xguest_u`：类似于 `guest_u` 用户。`xguest_u` 用户拥有与 `guest_u`\
  \ 用户相同的权限，此外它可以访问 GUI 和网络，但仅通过 Firefox 浏览器。\n\n以下是我在 CentOS 8 计算机上的操作，用于查看 Linux\
  \ 用户是如何映射到 SELinux 用户的，并更改 \"john\" 的映射以禁止其使用互联网。要查看 Linux 用户如何映射到 SELinux 用户，请使用\
  \ `semanage login -l`。在 CentOS 8 系统上，默认所有用户都映射到 `unconfined_u` SELinux 用户。因此每个人都可以使用互联网。\n\
  \n```bash\nherong$ sudo semanage login -l\n\nLogin Name      SELinux User    MLS/MCS\
  \ Range      Service\n__default__      unconfined_u    s0-s0:c0.c1023     *\nroot\
  \            unconfined_u    s0-s0:c0.c1023     *\n```\n\n\n\n\n2. 要添加将 \"john\"\
  映射到 `guest_u` SELinux 用户的新条目，请使用 `semanage login -a` 命令。\n```bash\nherong$ sudo\
  \ semanage login -a -s guest_u john\n```\n\n```bash\nherong$ sudo semanage login\
  \ -l\n```\n\n| 登录名称 | SELinux 用户 | MLS/MCS 范围 | 服务 |\n| :--- | :--- | :--- | :---\
  \ |\n| __default__ | unconfined_u | s0-s0:c0.c1023 | * |\n| john | guest_u | s0\
  \ | * |\n| root | unconfined_u | s0-s0:c0.c1023 | * |\n\n3. 要验证更改，让 \"john\"登录并尝试使用\
  \ `ping` 命令。他将收到“Permission denied”错误。\n```bash\njohn$ ping google.com\nping: socket:\
  \ Permission denied\n```\n\n4. 要移除 \"john\" 的 SELinux 用户条目，请使用 `semanage login -d`\
  \ 命令。\n```bash\nherong$ sudo semanage login -d -s guest_u john\n```\n\n# 什么是 SELinux\
  \ 角色 (Role)\n\n快速介绍什么是 SELinux 角色，并提供一个关于如何查看每个 SELinux 用户允许的 SELinux 角色，以及如何更改当前\
  \ SELinux 角色的示例教程。在上一个教程中，我们学习了什么是 SELinux 用户。现在让我们来看看 SELinux 角色。\n\n## 什么是 SELinux\
  \ 角色？\n\nSELinux 角色是一个抽象概念，代表为特定功能角色分组在一起的一组权限。这使得系统能够灵活将多个角色关联到单个用户。因此，SELinux\
  \ 系统是一个 RBAC（基于角色的访问控制）系统。\n\n默认情况下，SELinux 具有以下预定义的 SELinux 角色：\n\n- `guest_r`\
  \ - 访客用户角色，权限最低。\n- `user_r` - 普通用户角色，仅允许用户应用程序和其他非特权对象。\n- `staff_r` - 与 `user_r`\
  \ 角色类似，但可能允许比普通用户接收更多的系统信息。此角色通常分配给允许切换到其他角色的用户。\n- `sysadm_r` - 系统管理员角色；这是一个非常强大的角色，因为它被允许访问目标对象。\n\
  - `system_r` - 系统角色，不用于直接切换。\n- `unconfined_r` - 无限制的用户角色。\n- `xguest_r` - 与 `guest_r`\
  \ 角色类似，但可以访问 GUI。\n\n以下是我在 CentOS 8 计算机上的操作，用于查看特定 SELinux 用户允许的 SELinux 角色，以及更改给定\
  \ SELinux 用户的 SELinux 角色。\n\n1. 要查看每个 SELinux 用户允许的 SELinux 角色，请使用 `semanage user\
  \ -l`。\n```bash\nherong$ sudo semanage user -l\n```\n\n| SELinux 用户 | 前缀 | MCS 级别\
  \ | MCS 范围 | SELinux 角色 |\n| :--- | :--- | :--- | :--- | :--- |\n| guest_u | user\
  \ | s0 | s0 | guest_r |\n| root | user | s0 | s0 | staff_r sysadm_r system_r unconfined_r\
  \ |\n| staff_u | user | s0 | s0-s0-s0:c0.1023 | staff_r sysadm_r system_r unconfined_r\
  \ |\n| sysadm_u | user | s0 | s0-s0-s0:c0.1023 | sysadm_r |\n| system_u | user |\
  \ s0 | s0-s0-s0:c0.1023 | system_r unconfined_r |\n| unconfined_u | user | s0 |\
  \ s0-s0-s0:c0.1023 | system_r unconfined_r |\n| user_u | user | s0 | s0 | user_r\
  \ |\n| xguest_u | user | s0 | s0 | xguest_r |\n\n2. 要找出我的 SELinux 用户以及我扮演的 SELinux\
  \ 角色，请使用 `id` 命令。注意，我的 SELinux 用户和我的 SELinux 角色列在 `context` 属性的前两个字段中。\n```bash\n\
  herong$ id\nuid=1000(herong) gid=1000(herong) groups=1000(herong),10(wheel)\ncontext=unconfined_u:unconfined_r:unconfined_t:s0-s0:c0.1023\n\
  ```\n\n3. 要将我当前的 SELinux 角色从 `unconfined_r` 更改为 `system_r`，请使用 `newrole -r system_r`\
  \ 命令。这是允许的，因为 `semanage user -l` 的输出显示 `system_r` 和 `unconfined_r` 角色都允许 `unconfined_u`\
  \ 用户使用。\n```bash\nherong$ newrole -r system_r\n```\n注意你可能需要安装 `policycoreutils-newrole`\
  \ 来使用 `newrole` 命令。\n\n# 什么是 SELinux 类型 (Type)\n\n快速介绍什么是 SELinux 类型，并提供一个关于如何查看文件/目录对应的\
  \ SELinux 类型，以及更改文件/目录 SELinux 类型的示例教程。\n\n在之前的教程中，我们学习了什么是 SELinux 用户以及什么是 SELinux\
  \ 角色。我们还学习了 SELinux 用户可以扮演哪些 SELinux 角色。现在让我们来看看 SELinux 类型。\n\n## 什么是 SELinux 类型？\n\
  \nSELinux 类型是一个抽象概念，代表一组分组的文件/目录，这样安全策略就可以在组级别上应用，而不是单独应用到文件/目录层级。\n\n默认情况下，SELinux\
  \ 拥有一长长的预定义 SELinux 类型列表。下面列出了其中：\n`default_t`, `bin_t`, `boot_t`, `device_t`, `etc_t`,\
  \ `httpd_log_t`, `lib_t`, `man_t`, `mnt_t`, `public_content_t`, `shell_exec_t`,\
  \ `sysfs_t`, `tmp_t`, `usr_t`, `var_lib_t`, `var_t`, `removable_device_t`, `sound_device_t`,\
  \ `tape_device_t`, `tty_device_t`, `home_root_t`, `auth_home_t`, `config_home_t`,\
  \ `mail_home_t`, `user_home_t`...\n\n当创建新文件或目录时，SELinux 会根据一组预定义的设置将其分配给默认的 SELinux\
  \ 类型。分配给文件/目录的 SELinux 类型存储在其 context 属性的第三字段中。在下面的示例中，文件 `/home/herong/myfile`\
  \ 被分配给 `user_home_t` SELinux 类型。\n```bash\nherong$ stat ~/myfile\nFile: /home/herong/myfile\n\
  Size: 0  Blocks: 0  IO Block: 4096  regular file\nDevice: 0/6477d  Inode: 6680 \
  \ Links: 1\nAccess: (0644rw-r--) Uid: (1000(herong)) Gid: (1000(herong))\nContext:\
  \ unconfined_u:object_r:user_home_t:s0\nAccess: 2020-09-12 04:50:25.8507 -0400\n\
  Modify: 2020-09-12 04:50:25.8507 -0400\nChange: 2020-09-12 04:50:25.8507 -0400\n\
  ```\n\n文件的 SELinux context 属性也称为 SELinux 标签。为文件分配 SELinux 类型的过程被称为 SELinux 标记（SELinux\
  \ Labeling）。SELinux context（文件标签）以 5 个字段存储文件的完整安全信息，所示：\n\n有几种方法可以查看和管理文件及目录的 SELinux\
  \ 类型：\n\n1. 使用 `ls -Z` 查看文件/目录上下文。\n```bash\nherong$ ls -Z ~/myfile\nunconfined_u:object_r:user_home_t:s0\
  \ /home/herong/myfile\n```\n2. 使用 `chcon -t` 更改文件/目录的 SELinux 类型。\n```bash\nherong$\
  \ chcon -t user_tmp_t ~/myfile\nherong$ ls -Z ~/myfile\nunconfined_u:object_r:user_tmp_t:s0\
  \ /home/herong/myfile\n```\n3. 查看 SELinux 默认设置：\n```bash\nherong$ sudo semanage\
  \ fcontext -l\n```\n\n| SEL fcontext | type | Context |\n| :--- | :--- | :--- |\n\
  | / | | system_u:object_r:root_t:s0 |\n| /.* | | system_u:object_r:default_t:s0\
  \ |\n| /[^/]+ | | system_u:object_r:etc_runtime_t:s0 |\n| /.autofs | | system_u:object_r:etc_runtime_t:s0\
  \ |\n| /afs | | system_u:object_r:mnt_t:s0 |\n| /bacula(/)? | | system_u:object_r:bacula_store_t:s0\
  \ |\n| /bin | | system_u:object_r:bin_t:s0 |\n| /bin/.* | | system_u:object_r:bin_t:s0\
  \ |\n| /bin/alsaunmute | | system_u:object_r:alsa_exec_t:s0 |\n| /bin/bash | | system_u:object_r:shell_exec_t:s0\
  \ |\n| /bin/tcsh | | system_u:object_r:shell_exec_t:s0 |\n| /boot | | system_u:object_r:boot_t:s0\
  \ |\n| /boot/.* | | system_u:object_r:boot_t:s0 |\n| /dev | | system_u:object_r:device_t:s0\
  \ |\n| /dev/(misc/)?agpgart | | system_u:object_r:agp_device_t:s0 |\n| /dev/(misc/)?psaux\
  \ | | system_u:object_r:mouse_device_t:s0 |\n\n\n\n\n\n`/home/[^/]+/.+ all files\
  \ unconfined_u:object_r:user_home_t:s0`\n\n...\n\n4. 检查 SELinux 类型与默认值不同的文件/目录。它将打印出我之前修改过\
  \ SELinux 类型的 `~/myfile`。\n`herong$ sudo fixfiles check ~`\n\n 是否要将 `/home/herong/myfile`\
  \ 从 `unconfined_u:object_r:user_tmp_t:s0` 重新标记为 `unconfined_u:object_r:user_home_t:s0`？\n\
  \n5. 将文件/目录上的 SELinux 类型恢复为默认值：\n`herong$ sudo fixfiles restore ~/myfile`\n\n`herong$\
  \ ls -Z ~/myfile`\n\n`unconfined_u:object_r:user_home_t:s0 /home/herong/myfile`\n\
  \n[Linux 教程 - Herong 的教程示例] [SELinux - 安全增强型 Linux]\n\n## 什么是 SELinux 域 (Domain)\n\
  快速介绍什么是 SELinux 域。它是一个抽象概念，表示一组分组在一起的运行进程，以便安全策略可以在组级别上应用，而不是在进程级别逐个应用。在之前的教程中，我们学习了什么是\
  \ SELinux 用户、什么是 SELinux 角色以及什么是 SELinux 类型。现在让我们来看下 SELinux 域。\n\n### 什么是 SELinux\
  \ 域？\nSELinux 域是一个抽象概念，表示一组分组在一起的运行进程，以便安全策略可以在组级别上应用，而不是在进程级别逐个应用。默认情况下，SELinux\
  \ 拥有一长串预定义的 SELinux 域。其中一些列举所示：\n`accountsd_t`, `alsa_t`, `auditd_t`, `avahi_t`,\
  \ `boltd_t`, `chronyd_t`, `colord_t`, `crond_t`, `cupsd_t`, `dnsmasq_t`, `firewalld_t`,\
  \ `fsdaemon_t`, `ftpd_t`, `fwupd_t`, `gssproxy_t`, `httpd_t`, `init_t`, `irqbalance_t`,\
  \ `kernel_t`, `ksmtuned_t`, `lsmd_t`, `mcelog_t`, `modemmanager_t`, `mysqld_t`,\
  \ `policykit_t`, `rngd_t`, `rpcbind_t`, `rtkit_daemon_t`, `sshd_t`, `syslogd_t`,\
  \ `systemd_usd_t`, `systemd_logind_t`, `systemd_machined_t`, `tuned_t`, `udev_t`,\
  \ `unconfined_t`, `virtd_t`, `xdm_t`, `xd_t`。\n\n当创建一个新进程时，SELinux 会根据一组预定义的设置将其分配到默认的\
  \ SELinux 域。分配给进程的 SELinux 域存储在其上下文属性的第三字段中。在下面的示例中，进程 `bash` 被分配给了 `unconfined_t`\
  \ SELinux 域。\n`herong$ ps -Z | grep bash`\n`unconfined_u:unconfined_r:unconfined_t:s0-s0:c1023\
  \ 20713 pts/1 0:00 bash`\n\n进程的 SELinux 上文属性也称为 SELinux 标签。为文件分配 SELinux 类型的过程称为\
  \ SELinux 标记化（Labeling）。SELinux 上文（进程标签）以 5 个字段存储进程的完整安全信息，如下所示：\nSELinux 上文 = user:role:domain:level:category\
  \ \n\n实际上，如果我们将 SELinux 类型视为一组资源的表示，那么 SELinux 域可以被视为 SELinux 类型的一种特殊情况。文件和进程只是不同的类型而已。\n\
  \n## SELinux 策略规则\n快速介绍 SELinux 策略规则以及如何使用 `sesearch` 命令来审查它们。在之前的教程中，我们学习了 SELinux\
  \ 系统中最重要的四个实体：用户、角色、域和类型。它们用于以层次形式定义 SELinux 安全策略：`SELinux 用户`、`SELinux 角色`、`SELinux\
  \ 域`、`SELinux 类型`。\n\n现在让我们来看 SELinux 安全分级结构的底部部分，它也称为类型强制（Type Enforcement）：`SELinux\
  \ 域`。SELinux 类型强制策略实际上是一组形式如下的策略规则：`allow \"source\" on \"target\" of \"class\"\
  \ with \"permissions\"`，其中：\n- `source`: 一个 SELinux 域\n- `target`: 一个 SELinux 域或类型\n\
  - `permissions`: 允许的动作列表\n- `class`: 作为目标子集的 SELinux 类\n\n下面是一个通过 `sesearch` 命令检索的\
  \ SELinux 策略规则示例：\n`herong$ sesearch --allow --source httpd_t --target httpd_log_t\
  \ --class file`\n`allow httpd_t httpd_log_t:file { append create getattr ioctl open\
  \ ... };`\n\n上述策略规则告诉我们，位于 `httpd_t` SELinux 域中的任何进程对 `httpd_log_t` SELinux 类型的\
  \ `file` 类具有 `append create getattr ioctl open ...` 权限。让我们验证哪些进程在 `httpd_t` SELinux\
  \ 域中：\n`herong$ ps -eZ | grep httpd_t`\n`system_u:system_r:httpd_t:s0 3427 ? 00:02:43\
  \ php-fpm`\n`system_u:system_r:httpd_t:s0 3428 ? 00:03:01 httpd`\n\n这些进程可以向 httpd\
  \ `access-log` 文件追加新的日志条目吗？答案是肯定的，因为它是 `httpd_log_t` SELinux 类型：\n`herong$ sudo\
  \ ls -Z /var/log/httpd/access_log`\n`system_u:object_r:httpd_log_t:s0 /var/log/httpd/access_log`\n\
  \n`httpd_t` 进程可以在 `/var/www/html` 目录下创建新文件吗？答案是否，因为相关的策略规则中没有列出 `create` 权限：\n`herong$\
  \ sudo ls -dZ /var/www/html`\n`system_u:object_r:httpd_sys_content_t:s0 /var/www/html`\n\
  `herong$ sesearch --allow --source httpd_t --target httpd_sys_content_t --class\
  \ dir`\n`allow httpd_t httpd_sys_content_t:dir { getattr ioctl lock open read search\
  \ };`\n\nSELinux 类型强制策略规则在 SELinux 策略数据库中也称为 `allow` 规则。你可以使用 `sesearch --allow`\
  \ 命令获取所有 `allow` 规则的列表：\n`herong$ sesearch --allow | more`\n`allow NetworkManager_etc_rw_t\
  \ NetworkManager_etc_rw_t:filesystem associate;`\n`allow NetworkManager_etc_t NetworkManager_etc_t:filesystem\
  \ associate;`\n`allow NetworkManager_exec_t NetworkManager_exec_t:filesystem associate;`\n\
  `allow NetworkManager_log_t NetworkManager_log_t:filesystem associate;`\n`allow\
  \ NetworkManager_log_t tmp_t:filesystem associate;`\n`allow NetworkManager_log_t\
  \ tmpfs_t:filesystem associate;`\n\n...\n\n## 什么是 SELinux 布尔值 (Boolean)\n快速介绍 SELinux\
  \ 布尔值。SELinux 布尔值是一种布尔标志，可以添加到一个或多个 SELinux 策略规则中以启用或禁用这些规则。\n\n### 什么是 SELinux\
  \ 布尔值？\nSELinux 布尔值是一种布尔标志，可以添加到一个或多个 SELinux 策略规则中以启用或禁用这些规则。默认情况下，SELinux 拥有一长串预定义的\
  \ SELinux 布尔值。你可以使用 `semanage boolean -l` 查看它们及其设置：\n`herong$ sudo semanage boolean\
  \ -l`\n\n| SELinux 布尔值 | 状态 | 描述 |\n| :--- | :--- | :--- |\n| abrt_anon_write |\
  \ off | 允许 abrt 写入 |\n| abrt_handle_event | off | 允许 abrt 处理事件 |\n| antivirus_scan_system\
  \ | off | 允许 扫描系统 |\n| antivirus_use_jit | off | 允许 antivirus 使用 jit |\n| auditadm_exec_content\
  \ | on | 允许 auditadm 执行内容 |\n| authlogin_radius | off | 允许 authlogin 使用 radius |\n\
  | authlogin_yubikey | off | 允许 authlogin 使用 yubikey |\n| boinc_execmem | on | 允许\
  \ boinc 执行内存 |\n| ... | ... | ... |\n| httpd_can_network_connect | off | 允许 httpd\
  \ 连接网络 |\n\n...\n\n如果一个 SELinux 策略规则受 SELinux 布尔值控制，该布尔标志将列在规则的末尾。下面的策略规则表示，只有当\
  \ `httpd_can_network_connect` 布尔值为 True 时，`httpd_t` 进程才能对 `port_type:tcp_socket`\
  \ 类型执行 `name_connect`。\n`herong$ sesearch --allow --source httpd_t | grep 'httpd_can_network_connect\
  \ '`\n`allow httpd_t port_type:tcp_socket name_connect; [ httpd_can_network_connect\
  \ ]:True`\n\n多种方法管理 SELinux 布尔值设置：\n`semanage boolean -l`: 列出所有布尔值及其设置\n`getsebool\
  \ -a`: 列出所有布尔值及其设置\n`setsebool boolean_name on`: 开启指定的布尔值\n\n```\nsetsebool -P abrt_anon_write\
  \ on\n```\n\n\n\n\n\n开启指定的布尔值并永久保存更改\n`togglesebool` `boolean_name`\n\n切换指定布尔值的状态\n\
  \n# SELinux - 安全增强型 Linux\n\n提供了与 SELinux 相关的常用工具简要介绍。有几个重要的工具可以管理 SELinux 系统：\n\
  \n1. `semanage` - SELinux 策略管理工具。\n```\nherong$ semanage -h\n```\n`semanage` 用于配置\
  \ SELinux 策略的某些元素，而无需修改或重新编译策略源文件。\n\n位置参数：\n- `import`: 导入本地自定义配置\n- `export`:\
  \ 输出本地自定义配置\n- `login`: 管理 Linux 用户与 SELinux 用户之间的登录映射\n- `user`: 管理 SELinux 用户（SELinux\
  \ 用户所属的角色和级别）\n- `port`: 管理网络端口类型定义\n- `ibpkey`: 管理 infiniband ibpkey 类型定义\n- `ibendport`:\
  \ 管理 infiniband 终端端口类型定义\n- `interface`: 管理网络接口类型定义\n- `module`: 管理 SELinux 策略模块\n\
  - `node`: 管理网络节点类型定义\n- `fcontext`: 管理文件上下文映射定义\n- `boolean`: 管理用于选择性启用功能的布尔值\n\
  - `permissive`: 管理进程类型强制模式\n- `dontaudit`: 禁用/启用策略中的 dontaudit 规则\n\n2. `seinfo`\
  \ - SELinux 策略信息工具。`seinfo` 未包含在默认的 CentOS 8 系统中。你需要安装 `setools-console` 软件包来使用它。\n\
  ```\nherong$ seinfo\nbash: seinfo: command not found...\nInstall package 'setools-console'\
  \ to provide command 'seinfo'? [N/y] n\nherong$ sudo dnf install setools-console\n\
  ...\nInstalled:\n  setools-console-4.2.2-2.el8.x86_64\nherong$ seinfo -h\n...\n\
  ```\n组件查询：\n- `-a [ATTR], --attribute [ATTR]`: 打印类型属性。\n- `-b [BOOL], --bool [BOOL]`:\
  \ 打印布尔值。\n- `-c [CLASS], --class [CLASS]`: 打印对象类。\n- `-r [ROLE], --role [ROLE]`:\
  \ 打印角色。\n- `-t [TYPE], --type [TYPE]`: 打印类型。\n- `-u [USER], --user [USER]`: 打印用户。\n\
  \n3. `sesearch` - SELinux 策略规则搜索工具。`sesearch` 未包含在默认的 CentOS 8 系统中。你需要安装 `setools-console`\
  \ 软件包来使用它。\n```\nherong$ sesearch -h\nusage: sesearch [-h] [--version] [-v] [--debug]\
  \ [-A] [--allow] [--allowxperm]\n    [--auditallow] [--auditallowxperm] [--dontaudit]\n\
  \    [--dontauditxperm] [--neverallow] [--neverallowxperm] [-T]\n    [--type_change]\
  \ [--type_member] [--role_allow] [--role_trans]\n    [--range_trans] [-s SOURCE]\
  \ [-t TARGET] [-c TCLASS] [-p PERMS]\n    [-x XPERMS] [-D DEFAULT] [-b BOOL] [-eb]\
  \ [-ep] [-ex] [-ds]\n    [-dt] [-rs] [-rt] [-rc] [-rd] [-rb]\n    [policy]\n```\n\
  \n4. `newrole` - 使用新的 SELinux 角色运行 shell。`newrole` 未包含在默认的 CentOS 8 系统中。你需要安装 `policycoreutils-newrole`\
  \ 软件包来使用它。\n```\nherong$ newrole\nbash: newrole: command not found...\nInstall package\
  \ 'policycoreutils-newrole' to provide command 'newrole'? [N/y]\nherong$ sudo dnf\
  \ install policycoreutils-newrole\n...\npolicycoreutils-newrole-2.9-9.el8.x86_64\n\
  Installed:\n  policycoreutils-newrole-2.9-9.el8.x86_64\nherong$ newrole\nUSAGE:\
  \ newrole -r role ] -t type ] -l level ] -p ] -V ] [ args ]\n```\n\n5. `fixfiles`\
  \ - 修复 SELinux 安全上下文。\n```\nherong$ man fixfiles\nfixfiles [-v] [-f] relabel\nfixfiles\
  \ [-v] [-F] { check | restore } dir/file\nfixfiles [-v] [-F] -B { check | restore\
  \ }\nfixfiles [-v] [-F] -C PREVIOUS_CONTEXT { check | restore } onboot\n```\n\n\
  # SELinux 错误消息\n\n提供了 SELinux 错误的简要介绍，这些错误记录在 `/var/log/messages` 文件中。你可以获取错误的更详细信息以及一些建议的解决方案。默认情况下，SELinux\
  \ 错误消息记录在 `/var/log/messages` 中。以下是我 CentOS 8 计算机上的 SELinux 错误消息示例。\n\nphp-fpm 因\
  \ SELinux 类型错误无法运行 PHP 脚本。错误消息建议你运行 `sealert` 以获取更详细的信息。\n```\nherong$ sudo cat\
  \ /var/log/messages | grep SELinux | more\n...\nSELinux is preventing /usr/sbin/php-fpm\
  \ from read access on the file test.php. For complete SELinux messages run:\nsealert\
  \ -l 06a19151-14d3-4930-e18-4c0f0696350\nherong$ sealert -l 06a19151-14d3-4930-e18-4c0f0696350\n\
  SELinux is preventing /usr/sbin/php-fpm from read access on file test.php.\n*****\
  \ Plugin catchall_boolean (89.3 confidence) suggests *****\nIf you want to allow\
  \ httpd to read user content you must tell SELinux about this by enabling the 'httpd_read_user_content'\
  \ boolean.\nDo\nsetse -P httpd_read_user_content 1\n```\n附加信息：\n- 源上下文: `system_u:system_r:httpd_t:s0`\n\
  - 目标上下文: `unconfined_u:object_r:user_home_t:s0`\n- 目标对象: `test.php [ file ]`\n-\
  \ 源: `php-fpm`\n- 源路径: `/usr/sbin/php-fpm`\n- 主机: `localhost.localdomain`\n- 源 RPM\
  \ 包:\n- 目标 RPM 包:\n- 策略 RPM: `selinux-policy-3.14.3-20.el8.noarch`\n- SELinux 启用:\
  \ `True`\n- 策略类型: `targeted`\n- 强制模式: `Enforcing`\n\nhttpd/php-fpm 无法运行尝试调用 `curl`\
  \ 接口的 PHP 脚本文件。建议的解决方案非常准确。\n```\nherong$ sudo cat /var/log/messages | grep SELinux\
  \ | more\n...\nsetroubleshoot[24609]: SELinux is preventing /usr/bin/curl from name_connect\
  \ access on the tcp_socket. For complete SELinux messages run:\nsealert -l 06a19151-14d3-4930-e18-4c0f0696350\n\
  herong$ sealert -l 06a19151-14d3-4930-e18-4c0f0696350\nSELinux is preventing /usr/bin/curl\
  \ from name_connect access on the tcp_socket.\n***** Plugin catchall_boolean (89.3\
  \ confidence) suggests *****\nIf you want to allow httpd to read user content you\
  \ must tell SELinux about this by enabling the 'httpd_read_user_content' boolean.\n\
  Do\nsetse -P httpd_read_user_content 1\n```\n附加信息：\n- 源上下文: `system_u:system_r:httpd_t:s0`\n\
  - 目标上下文: `unconfined_u:object_r:user_home_t:s0`\n- 目标对象: `test.php [ file ]`\n-\
  \ 源: `php-fpm`\n- 源路径: `/usr/sbin/php-fpm`\n- 主机: `localhost.localdomain`\n\n# SELinux\
  \ 相关术语\n\n提供了与 SELinux 相关的常用术语列表。以下是一些与 SELinux 相关的常用术语：\n\n- **ACL (Access Control\
  \ List) 访问控制列表**：与对象关联的权限列表。例如，`rw-rw-r--` 是与文件关联 ACL：`-rw-rw-r-- . 1 herong herong\
  \ 0 Sep 12 04:50 myfile`。它表示“herong”作为所有者可以读写，“herong” 组的用户可以读写，其他用户可以读。\n\n- **AVC\
  \ (Access Vector Vache) 访问向量缓存**：存储主体和对象权限的缓存，以便快速访问。\n\n- **DAC (Discretionary\
  \ Access Control) 自主访问控制**：一种基于每个对象关联的 ACL（访问控制列表）的权限系统。Linux 默认安全使用 DAC。\n\n\n\n\
  \n\n# SELinux 核心概念\n\n- `MAC (强制访问控制)` - 一种基于存储在数据库中的显式安全策略集的权限系统。`SELinux` 使用了\
  \ `MAC`。\n- `MCS (多分类安全)` - 权限系统将不同安全类别（例如：核心、实用程序、插件）关联到信息对象的能力。\n- `MLS (多级安全安全)`\
  \ - 权限系统将不同安全级别（例如：未分类、机密、秘密、绝极机密）关联到信息对象的能力。安全级别具有层级关系。较高的安全级别通常允许的操作较少。\n- `SELinux\
  \ User (SELinux 用户)` - 一种抽象概念，代表 Linux 系统上一组真实用户，作为 `SELinux` 系统中的安全主体。\n- `SELinux\
  \ Role (SELinux 角色)` - 一种抽象概念，代表为特定功能角色分组在一起的一组权限。\n- `SELinux Type (SELinux 类型)`\
  \ - 一种抽象概念，代表一组分组的文件/目录，以便安全策略可以应用于组级别，而不是单独地应用于文件/目录级别。\n- `SELinux Domain (SELinux\
  \ 域)` - 一种抽象概念，代表一组运行在一起的进程，以便安全策略可以应用于组级别，而不是单独地应用于进程级别。\n- `SELinux Class (SELinux\
  \ 类)` - 一种抽象概念，代表根据目标资源的性质划分的 `SELinux Types` 子集，如“文件”、“目录”、“socket”等。\n\n# CentOS\
  \ 网络连接\n\n提供了关于 CentOS 系统上网络配置和防火墙的介绍和教程。主题包括：带有自动 DHCP 配置的以太网连接介绍；使用 `ifconfig`\
  \ 查看当前网络配置；`firewalld` 守护进程和 `firewall-cmd` CLI 作为防火墙前端工具；`nftables` 守护进程和 `nft`\
  \ CLI 作为防火墙后端工具；作为网络扫描器的 `nmap`；作为网络活动监控器的 `netstat`。\n\n## 核心要\n\n- 以太网连接设置可以通过本地网络的\
  \ `DHCP (动态主机配置协议)` 服务自动完成。\n- `ifconfig` 命令可以查看 CentOS 系统上所有网络接口的当前网络配置。\n- `firewalld`\
  \ 守护进程和 `firewall-cmd` CLI（命令行界面）是管理 CentOS 系统上网络防火墙的前端工具。\n- `nftables` 守护进程和 `nft`\
  \ CLI（命令行界面）是管理 CentOS 系统上网络防火墙的后端工具。\n- 在 CentOS 8 系统上，`iptables` 命令被 `nftables`\
  \ 守护进程和 `nft` CLI 代替。\n- `nmap (网络映射)` 是一种网络探索工具和安全扫描器。\n- `netstat (网络状态)` 是网络活动监控工具。\n\
  \n# 在 CentOS 上设置以太网连接\n\n提供了一个如何在 CentOS 8 系统上检查和排除以太网连接故障的教程示例。如果您在桌面计算机上运行 CentOS\
  \ 系统，它很可能连接到了本地网络的以太网。以下是我在 CentOS 8 计算机上检查和设置以太网连接的操作。\n\n1. 确保计算机已以太网线到本地网络。您应该看到以太网端口旁边有两个灯。如果其中一个在闪烁，说明您的计算机和网络之间存在数据活动。\n\
  2. 从桌面屏幕检查以太网连接设置。\n   - 点击屏幕右上角的以太网图标。\n   - 点击打开“有线 (Wired)”连接。您应该看到网络设置屏幕。\n\
  \   - 点击开关将其打开。\n   - 点击设置图标。您应该看到有线连接详情。\n3. 读取有线连接详情。默认情况下，您的 IP 地址、默认路由（网关）、DNS\
  \ 是由本地网络的 `DHCP (动态主机配置协议)` 服务动态配置的。无需更改它们。\n   - 链路速率：100 Mb/s\n   - IPv4 地址：192.168.1.100\n\
  \   - 硬件地址：...\n   - 默认路由：192.168.1.1\n   - DNS：192.168.1.1\n\n![](img/Image00006.jpg)\n\
  \n4. 您也可以使用 `ifconfig` 命令验证以太网连接：\n\n```bash\nherong$ ifconfig\n\neno1: flags=4163<UP,BROADCAST,RUNNING,MULTICAST>\
  \  mtu 1500\n     inet 192.168.1.100  netmask 255.255.255.0  broadcast 192.168.1.255\n\
  \     inet6 fe80::...:fe80  prefixlen 64  scopeid 0x20<link>\n     ether 39:39:...\
  \  txqueuelen 1000  (Ethernet)\n     RX packets 1162982  bytes 31120747 (296.7 MiB)\n\
  \     RX errors 0  dropped 61365  overruns 0  frame 0\n     TX packets 247671  bytes\
  \ 58741459 (56.0 MiB)\n     TX errors 0  dropped 0 overruns 0  carrier 0  collisions\
  \ 0\n     device interrupt 20  memory 0xf7c00000-f7c20000\n```\n\n5. 使用 `ping` 命令验证互联网连接：\n\
  \n```bash\nherong$ ping bing.com\n\nPING bing.com (204.79.197.200) 56(84) bytes\
  \ of data.\n64 bytes from a-0001.a-msedge.net (204.79.197.200): icmp_seq=1 ttl=118\
  \ time=21.1 ms\n64 bytes from a-0001.a-msedge.net (204.79.197.200): icmp_seq=2 ttl=118\
  \ time=20.9 ms\n...\n64 bytes from a-0001.a-msedge.net (204.79.197.200): icmp_seq=9\
  \ ttl=118 time=20.8 ms\n\n^C\n--- bing.com ping statistics ---\n9 packets transmitted,\
  \ 9 received, 0% packet loss, time 18ms\nrtt min/avg/max/mdev = 20.658/21.993/30.929/3.163\
  \ ms\n```\n\n6. 如果 `ping` 命令失败，请检查以下内容：\n   - 检查两端的以太网线连接。\n   - 更换一根新的以太网线。\n \
  \  - 将计算机移动到不同的以太网插座。\n   - 验证本地网络网关防火墙设置。确保您的 IP 地址或 MAC 地址未被黑名单拦截。\n\n\n\n\n\n\
  7. 如果在安装 CentOS 期间遇到连接连接问题，可以下载 `-dvd1.iso` 版本，通过 ISO 镜像在没有网络连接的情况下安装 CentOS。\n\n\
  ## CentOS 网络防火墙工具\n\n本文简要描述了 CentOS 8 系统上 3 种主要的网络防火墙工具：`firewalld/fireall-cmd`、`nftables/nft`\
  \ 以及 `iptables`。将 CentOS 系统连接到互联网后，你需要检查并修改防火墙设置以保护你的系统。CentOS 系统使用多种工具来管理网络防火墙，以下是三个主要的工具：\n\
  \n1. `firewalld` 和 `fireall-cmd` - 一个防火墙守护和一个 CLI（命令行接口），共同工作作为前端工具管理网络防火墙。`firewalld`\
  \ 使用 `nftables/iptables` 作为后端引擎。\n2. `nftables` 和 `nft` - 一个防火墙守护和一个 CLI（命令行接口），共同工作作为数据过滤和分类的后端引擎。`nftables`\
  \ 使用 `/etc/nftables` 目录存储其规则。CentOS 8 默认安装了 `nftables` 以替换 `iptables`。\n3. `iptables`\
  \ - Linux 内核中用于 IPv4/IPv6 数据包过滤和 NAT（网络地址转换）的基础管理工具。`iptables` 使用 `/usr/sbin/iptables`\
  \ 存储其规则。在 CentOS 8 系统上，`iptables` 现在已被 `nftables` 替换。\n\n以下是显示 `firewalld`、`nftables/iptables`\
  \ 以及其他工具之间关系的图（来源：https://firewalld.org）。\n![](img/Image00007.jpg)\n\n## firewalld\
  \ 和 firewall-cmd\n\n提供一个如何在 CentOS 8 系统上使用 `firewalld` 守护进程和 `firewall-cmd` CLI\
  \ 管理网络防火墙的教程示例。`firewalld` 是一个服务守护进程，与 `firewall-cmd` CLI（命令行接口）协同工作，形成用于 `nftables/iptables`\
  \ 工具控制互联网流量的前端工具。以下是我确保 `firewalld` 和 `firewall-cmd` 在我的 CentOS 8 计算机上运行所采取的操作。\n\
  \n1. 确保我已通过 `dnf info` 命令安装了最新版本的 `firewalld`：\n```bash\nherong$ sudo dnf info firewalld\n\
  \nInstalled Packages\nName: firewalld\nVersion: 0.7.0\nRelease: 5.el8\nArchitecture:\
  \ noarch\nSize: 1.9 M\nSource: firewalld-0.7.0-5.el8.src.rpm\nRepository: @System\n\
  From repo: anaconda\nSummary: A firewall daemon with D-Bus interface providing a\
  \ dynamic firewall\nURL: http://www.firewalld.org\nLicense: GPLv2+\nDescription:\
  \ firewalld 是一个带有 D-Bus 接口的防火墙服务守护进程，提供动态可定制的防火墙。\n```\n\n2. 确保通过 `systectl status`\
  \ 命令确认 `firewalld` 服务正在运行：\n```bash\nherong$ sudo systemctl status firewalld\n\n\
  firewalld.service - firewalld - dynamic firewall daemon\n    Loaded: loaded (/usr/lib/systemd/system/firewalld.service;\
  \ enabled;\n             vendor preset: enabled)\n    Active: active (running)\n\
  \    Docs: man:firewalld(1)\n    Main PID: 1360 (firewalld)\n    Tasks: 3 (limit:\
  \ 26213)\n    Memory: 34.4M\n    CGroup: /system.slice/firewalld.service\n```\n\n\
  3. 使用 `firewall-cmd` 命令检查每个网络接口上激活的安全区域。我看到以太网接口应用了 `public` 区域的安全规则。\n```bash\n\
  herong$ sudo firewall-cmd --get-active-zones\n\npublic\n  interfaces: eno1\n```\n\
  \n4. 检查 `public` 区域中定义了哪些安全规则。我看到两个 TCP 端口 80 和 3306 允许入站流量。`cockpit`、`dhcpv6-client`\
  \ 和 `ssh` 服务使用的端口也是开放的。\n```bash\nherong$ sudo firewall-cmd --zone=public --list-all\n\
  public (active)\n  target: default\n  icmp-block-version: no\n  interfaces: eno1\n\
  \  sources:\n  services: cockpit dhcpv6-client ssh\n  ports: 80/tcp 3306/tcp\n \
  \ protocols:\n  masquerade: no\n  forward-ports:\n  icmp-blocks:\n  rich rules:\n\
  ```\n\n5. 添加一条新规则为 Tomcat 服务器开放 TCP 端口 8080。第一条命令允许来自互联网的所有 IP 地址访问 8080 端口。第二条命令永久保存更改。\n\
  ```bash\nherong$ sudo firewall-cmd --zone=public --add-port=8080/tcp\nherong$ sudo\
  \ firewall-cmd --runtime-to-permanent\n```\n\n6. 添加一条新规则为指定的 IP 地址开放所有端口。\n```bash\n\
  herong$ sudo firewall-cmd --zone=public --add-source=192.168.1.11\nherong$ sudo\
  \ firewall-cmd --runtime-to-permanent\n```\n\n7. 开启流量转发和转发规则：\n```bash\nherong$\
  \ sudo firewall-cmd --zone=external --add-masquerade\nherong$ sudo firewall-cmd\
  \ --zone=public --add-forward-port\n```\n\n8. 在 `public` 区域添加端口转发规则：\n```bash\n\
  herong$ sudo firewall-cmd --zone=public --add-forward-port=8080:8080:tcp\nherong$\
  \ sudo firewall-cmd --runtime-to-permanent\n```\n\n9. 在 `external` 区域开启伪装功能：\n```bash\n\
  herong$ sudo firewall-cmd --zone=external --add-masquerade\nherong$ sudo firewall-cmd\
  \ --runtime-to-permanent\n```\n\n10. 在 `public` 区域添加服务：\n```bash\nherong$ sudo firewall-cmd\
  \ --zone=public --add-service=http\nherong$ sudo firewall-cmd --runtime-to-permanent\n\
  ```\n\n11. 在 `public` 区域添加富规则：\n```bash\nherong$ sudo firewall-cmd --zone=public\
  \ --add-rich-rule='rule family=\"ipv4\" source address=\"192.168.1.0/24\" port port=\"\
  80\" protocol=\"tcp\" accept'\nherong$ sudo firewall-cmd --runtime-to-permanent\n\
  ```\n\n\n\n\n\n活动状态: active (active) (已退出)\n\n文档: man:nft(8)\n\n进程: 5226 ExecStart=/sbin/nft\
  \ -f /etc/sysconfig/nftables.conf\n\n主 PID: 5226 (code=exited, status=0/SUCCESS)\n\
  \n### 3. 使用 \"nft\" 命令列出所有表。\n\n```bash\nsudo nft list tables\n```\n\n```\ntable\
  \ ip filter\ntable ip6 filter\ntable bridge filter\ntable ip security\ntable ip\
  \ raw\ntable ip mangle\ntable ip nat\ntable ip6 security\ntable ip6 raw\ntable ip6\
  \ mangle\ntable ip6 nat\ntable bridge nat\ntable inet firewalld\ntable ip firewalld\n\
  table ip6 firewalld\n```\n\n### 4. 使用 \"nft\" 命令列出 \"ip/firewalld\" 表中的所有规则。\n\n\
  ```bash\nsudo nft list table ip firewalld | more\n```\n\n```text\ntable ip firewalld\
  \ {\n  chain nat_PREROUTING {\n    type nat hook prerouting priority -90; policy\
  \ accept;\n    jump nat_PREROUTING_ZONES\n  }\n  chain nat_PREROUTING_ZONES {\n\
  \    iifname \"virbr0\" goto nat_PRE_libvirt\n    iifname \"eno1\" goto nat_PRE_public\n\
  \    goto nat_PRE_public\n  }\n  chain nat_POSTROUTING {\n    type nat hook postrouting\
  \ priority 110; policy accept;\n    jump nat_POSTROUTING_ZONES\n  }\n  chain nat_POSTROUTING_ZONES\
  \ {\n    oifname \"virbr0\" goto nat_POST_libvirt\n    oifname \"eno1\" goto nat_POST_public\n\
  \    goto nat_POST_public\n  }\n  chain nat_PRE_public {\n  ...\n  }\n```\n\n如你所示，`nft`\
  \ 使用的防火墙安全规则语法比 `firewall-cmd` 。\n\n#### CentOS 上的 iptables 命令\n\n提供了一个教程示例，说明如何使用\
  \ `iptables` 守护进程 CLI 在旧版 CentOS 系统上管理网络防火墙。在 CentOS 系统上管理网络防火墙的最佳工具是 `firewall-cmd`\
  \ 前端工具。但如果你想使用后端工具，可以按照此教程使用 `iptables` 命令。\n\n##### 1. 确保已通过 `dnf info` 命令安装了最新版本的\
  \ `iptables`：\n\n```bash\nsudo dnf info iptables\n```\n\n```\nInstalled Packages\n\
  Name         : iptables\nVersion      : 1.8.2\nRelease      : 16.el8\nArchitecture\
  \ : x86_64\nSize         : 2.3 M\nSource       : iptables-1.8.2-16.el8.src.rpm\n\
  Repository   : @System\nFrom repo    : anaconda\nSummary      : 用于管理 Linux 内核数据包过滤能力的工具\n\
  URL          : http://www.netfilter.org/\nLicense      : GPLv2 and Artistic 2.0\
  \ and ISC\nDescription  : iptables 工具控制 Linux 内核中的网络数据包过滤代码。如果你需要设置防火墙和/或 IP 伪装，你应该安装\
  \ nftables 或此程序包。\n             注意：此包包含了基于 nftables 的 iptables 和 ip6tables 变体，它们是旧工具的直接替换品。\n\
  ```\n\n##### 2. 使用 `iptables` 命令检查所有安全规则的链：\n\n```bash\nsudo iptables --list\n```\n\
  \n```text\nChain INPUT (policy ACCEPT)\ntarget  prot opt source                \
  \   destination\nACCEPT  udp  --where                   where      pt:domain\nACCEPT\
  \  tcp  --where                   where      pt:domain\nACCEPT  udp  --where   \
  \                where      pt:boot\nACCEPT  tcp  --where                   where\
  \      pt:boot\nChain FORWARD (policy ACCEPT)\ntarget  prot opt source         \
  \          destination\nACCEPT  all  --where                   where\nChain OUTPUT\
  \ (policy ACCEPT)\ntarget  prot opt source                   destination\nACCEPT\
  \  udp  --where                   where      pt:boot\n```\n\n##### 3. 添加新规则以使我的电脑更安全。\n\
  \n记住 `iptables` 规则是按顺序比较的。如果找到匹配项，将执行相应的操作。\n\n```bash\n# 允许访问 google.com\nsudo\
  \ iptables -A OUTPUT -p tcp -d google.com -j ACCEPT\n# 禁止访问任何 HTTP 网站\nsudo iptables\
  \ -A OUTPUT -p tcp --dport 80 -j DROP\n# 禁止访问任何 HTTPS 网站\nsudo iptables -A OUTPUT\
  \ -p tcp --dport 443 -j DROP\n# 允许从我的笔记本通过 SSH 连接\nsudo iptables -A INPUT -p tcp\
  \ -s 192.168.1.11 --dport 22 -j ACCEPT\n# 允许本地计算机访问 Web 服务器\nsudo iptables -A INPUT\
  \ -p tcp --src-range 192.168.1.2-192.168.1.100 --dport 80 -j ACCEPT\n# 禁止所有人通过 SSH\
  \ 连接\nsudo iptables -A INPUT -p tcp -s 0.0.0.0/0 --dport 22 -j DROP\n# 禁止所有人进入任何端口\n\
  sudo iptables -A INPUT -j DROP\n```\n\n#### 4. 永久保存对 `iptables` 中做的更改：\n\n```bash\n\
  sudo /sbin/iptables-save\n```\n\n注意 `iptables` 守护进程运行在旧版 CentOS 系统上，而不是 `firewalld`。你可以使用\
  \ `service` 命令检查其状态：\n\n```bash\nsudo service iptables status\n```\n\n```text\n\
  Table: filter\nChain INPUT (policy ACCEPT)\nnum  target  prot opt source       \
  \            destination\n...\nChain FORWARD (policy ACCEPT)\nnum  target  prot\
  \ opt source                   destination\n...\nChain OUTPUT (policy ACCEPT)\n\
  num  target  prot opt source                   destination\n...\n```\n\n#### CentOS\
  \  nmap - Network Mapper\n\n提供了一个教程示例，说明如何在 CentOS 系统上安装和使用 `nmap` (Network Mapper)\
  \ 作为网络探索工具和安全扫描器。另一个有用工具叫做 `nmap (Network Mapper)`，它是一个网络探索工具和安全扫描器。以下是 `nmap` 的完整描述：\n\
  \nNmap (“Network Mapper”）是一个用于网络探索和安全审计的开源工具。它被设计用于快速扫描大型网络，尽管它对单个主机也运行良好。Nmap 以新的方式使用原始\
  \ IP 包来确定网络上有哪些主机可用、这些主机提供哪些服务（应用程序名称和版本）、它们运行什么操作系统（以及操作系统版本）、使用了什么类型的数据包过滤器/防火墙，以及数十种其他特征。虽然\
  \ Nmap 常用于安全审计，但许多系统和网络管理员发现它对于日常任务（如网络清单、服务调度和主机运行时间监控）非常有用。Nmap 的输出是扫描目标列表，并根据选项提供补充信息。其中关键信息是“有趣的端口表”。该表列出了端口号、协议、服务名称和状态。状态为\
  \ open、filtered 或 closed。open 表示目标机器上的应用程序正在监听连接/数据包。filtered 表示防火墙、过滤器或其他网络障碍阻止了端口，导致\
  \ Nmap 无法确定它是开放还是关闭。closed 端口没有应用程序，但它们随时可能打开。当端口对 Nmap 的探测有响应时，被分类为 unfiltered，但\
  \ Nmap 无法确定它是开放还是关闭。当 Nmap 无法确定哪种状态描述端口时，报告 open|filtered。如果请求了版本检测，端口表还可能包含软件版本详情。当请求\
  \ IP 扫描 (`-sO`) 时，Nmap 提供的是支持协议的信息，而不是监听端口。\n\n\n\n\n\n# 说明：Nmap 是一个用于网络探索或安全审计的工具。\n\
  \n## 1. 安装 \"nmap\"\n```bash\nsudo dnf install nmap\n```\n解析依赖。\n\n已安装：\n```\nnmap-2:7.70-5.el8.x86_64\n\
  ```\n完成！\n\n## 2. 扫描 localhost 的 TCP 连接\n```bash\nsudo nmap -sT -O localhost\n```\n\
