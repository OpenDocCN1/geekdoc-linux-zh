  \n在使用 MySQL 服务器存储你自己的数据后，你需要进行数据备份并将其存储在另一台计算机上。可以使用本教程所示的 `mysqldump` 命令进行转储：\n\
  \n1. 将 MySQL 服务器上的所有数据库备份为 SQL 格式：\n```bash\nmysqldump -u root -p --all-databases\
  \ > mysql-bck-2020-03-28.sql\n```\n2. 压缩备份文件：\n```bash\nzip mysql-bck-2020-03-28.sql\
  \ mysql-bck-2020-03-28.sql\n```\n(deflated 89%)\n3. 将其发送到另一台计算机：\n```bash\nscp mysql-bck-2020-03-28.zip\
  \ user@backup\n```\n4. 如果需要，使用 `mysql` 命令在另一个 MySQL 服务器上加载备份文件：\n```bash\nmysql\
  \ -u root -p < mysql-bck-2020-03-28.sql\n```\n\n### MySQL 服务器日志文件\n\n这是一个关于如何在 CentOS\
  \ 8 系统上查看 MySQL 8.0 服务器日志文件设置和位置的示例。日志文件对于监控 MySQL 服务器性能和解决任何问题非常有用。你应该学习如何像本教程所示管理\
  \ MySQL 日志。\n\n1. 注意 MySQL 8 支持 7 类型的日志文件：\n* `Error Log`（错误日志）：记录错误。由 `log_error%`\
  \ 变量控制。\n* `Slow Query Log`（慢查询日志）：记录运行较长的查询。由 `slow_query_log` 变量控制。\n* `Binary\
  \ Log`（二进制日志）：记录更改数据的语句（也用于复制）。由 `binlog%` 和 `log_bin%` 变量控制。\n* `General Query\
  \ Log`（通用查询日志）：记录所有查询。由 `general_log%` 变量控制。\n* `DDL Log`（DDL 日志）：记录 DDL（数据定义语言）操作。由\
  \ `metadata%` 变量控制。\n* `Relay Log`（中继日志）：记录从主服务器接收的数据更改。由 `relay_log%` 变量控制。\n*\
  \ `InnoDB Log`（InnoDB 日志）：由 `innodb_log%` 变量控制。\n\n2. 检查 \"Error Log\"文件的设置和位置。记住\
  \ \"Error Log\" 总是开启的。\n```bash\nmysqladmin -u root -p variables | grep log_error\n\
  ```\n```\n+-----------------------+-------------------------------+\n| Variable_name\
  \         | Value                         |\n+-----------------------+-------------------------------+\n\
  | binlog_error_action   | ABORT_SERVER                  |\n| log_error         \
  \    | `/var/log/mysql/mysqld.log`      |\n| log_error_services    | log_filter_internal;\
  \ log_sink_internal |\n| log_error_suppression_list |                          \
  \       |\n| log_error_verbosity   | 2                             |\n+-----------------------+-------------------------------+\n\
  ```\n```bash\nsudo ls -l /var/log/mysql/mysqld.log\n```\n```\n-rw-r-----. 1 mysql\
  \ mysql 8735 Mar 28 08:20 /var/log/mysql/mysqld.log\n```\n```bash\nsudo head -100\
  \ /var/log/mysql/mysqld.log\n```\n[Server] /usr/libexec/mysqld (mysqld 8.0.17) initializing\
  \ of server in progress as process 18690\n[Server] root@localhost 已使用空密码创建！请考虑关闭\
  \ --initialize-insecure（*非安全初始化*）选项。\n```。\n[Server] /usr/libexec/mysqld (mysqld\
  \ 8.0.17) initializing of server\n[Server] root@localhost 已使用空密码创建！请考虑关闭 --initialize-insecure（*非安全初始化*）选项。\n\
  [Server] /usr/libexec/mysqld (mysqld 8.0.17) initializing of server\n[Server] root@localhost\
  \ 已使用空密码创建！请考虑关闭 --initialize-insecure（*非安全初始化*）选项。\n[Server] /usr/libexec/mysqld\
  \ (mysqld 8.0.17) initializing of server\n[Server] root@localhost 已使用空密码创建！请考虑关闭\
  \ --initialize-insecure（*非安全初始化*）选项。\n[Server] /usr/libexec/mysqld (mysqld 8.0.17)\
  \ initializing of server\n[Server] root@localhost 已使用空密码创建！请考虑关闭 --initialize-insecure（*非安全初始化*）选项。\n\
  [Server] /usr/libexec/mysqld (mysqld 8.0.17) initializing of server\n[Server] root@localhost\
  \ 已使用空密码创建！请考虑关闭 --initialize-insecure（*非安全初始化*）选项。\n[Server] /usr/libexec/mysqld\
  \ (mysqld 8.0.17) initializing of server\n[Server] root@localhost 已使用空密码创建！请考虑关闭\
  \ --initialize-insecure（*非安全初始化*）选项。\n\n要启用 General Log：\n```bash\nmysql> show variables\
  \ like 'general_log%';\n```\n```\n+-----------------------+-------------------------------+\n\
  | Variable_name         | Value                         |\n+-----------------------+-------------------------------+\n\
  | general_log           | OFF                           |\n| general_log_file  \
  \    | `/var/lib/mysql/mysql.log`      |\n+-----------------------+-------------------------------+\n\
  ```\n```bash\nmysql> set global general_log = on;\n```\n（运行你的 MySQL 应用）\n```bash\n\
  sudo head -100 /var/lib/mysql/mysql.log\n```\n```\n/usr/libexec/mysqld, Version:\
  \ 8.0.17 (Source distribution). started with:\nTcp port: 3306  Unix socket: /var/lib/mysql/mysql.sock\n\
  Time    Id Command Argument\n...\n... 34 Connect  herong@localhost on mydb using\
  \ Socket\n... 34 Query  SELECT COUNT(*) FROM Cases\n... 34 Query  SELECT * FROM\
  \ Cases ORDER BY ID DESC LIMIT 0, 30\n... 34 Quit\n... 35 Connect  herong@localhost\
  \ on mydb using Socket\n... 35 Query  SELECT * FROM Cases WHERE ID = 10001\n...\
  \ 35 Quit\n```\n\n\n\n\n\nSocket 连接（Socket Connection）按照以下规则工作：\n\n1. 默认情况下，MySQL\
  \ 8 服务器启用了 Socket 连接。\n2. 在 CentOS 系统上，Socket 连接通过 socket 文件表示，并使用 `mysqlx_socket`\
  \ 和 `socket` 变量指定其位置：\n```mysql\nmysql> show variables like '%socket';\n```\n+---------------+----------------------------+\n\
  | Variable_name | Value                      |\n+---------------+----------------------------+\n\
  | mysqlx_socket | /var/lib/mysql/mysqlx.sock |\n| socket        | /var/lib/mysql/mysql.sock\
  \  |\n+---------------+----------------------------+\n3. 用户必须创建主机名为 \"localhost\"\
  \ 的用户才能使用 Socket 连接。例如，根据 `mysql.user` 记录，\"root\" 和 \"herong\" 是可以使用 Socket 连接的用户：\n\
  ```mysql\nmysql> select user, host from mysql.user;\n```\n+------------------+-----------+\n\
  | user             | host      |\n+------------------+-----------+\n| mysql.infoschema\
  \ | localhost |\n| mysql.session    | localhost |\n| mysql.sys        | localhost\
  \ |\n| root             | localhost |\n| herong           | localhost |\n+------------------+-----------+\n\
  4. 客户端程序必须使用 \"localhost\" 作为主机名来使用 Socket 连接。例如，以下 PHP 语句将使用 Socket 连接到 MySQL 服务器：\n\
  ```php\n$conn = mysqli_connect(\"localhost\", 'herong', 'TopSecret');\n```\n5. MySQL\
  \ 客户端工具使用默认的 `-h localhost` 选项通过 Socket 连接 SQL 服务器。见下例：\n```bash\nherong$ mysql\
  \ -u herong -p\nEnter password: junk<Enter>\nERROR 1045 (28000): Access denied for\
  \ user 'herong'@'localhost' ...\n```\nSocket 连接更安全。但它只允许来自 MySQL 服务器同一主机的连接。要允许来自远程主机的连接，你需要使用下一个教程所示的\
  \ TCP/IP 连接。\n\nMySQL 服务器支持来自客户端程序的两种类型连接：\n\n- Socket 连接或命名管道连接（Named Pipe Connection）\
  \ - 允许本地主机上的客户端程序在不使用 TCP/IP 协议的情况下访问服务器。\n- TCP/IP 连接 - 允许来自任何主机上的客户端程序使用 TCP/IP\
  \ 协议访问服务器。\n\nTCP/IP 连接按照以下规则工作：\n\n1. 默认情况下，MySQL 8 服务器启用了 TCP/IP 连接。\n2. MySQL\
  \ 服务器监听在 `bind_address` 变量指定的服务器主机的 IP 地址上。如果服务器有多个 IP 地址，可以指定用逗号分隔的 IP 列表。可以指定通配符\
  \ `*` 来监听服务器上所有的 IP 地址。对于 CentOS 8  MySQL 8.0 服务器，`bind_address` 默认设置为 `*`。\n```mysql\n\
  mysql> show variables like '%bind_address';\n```\n+---------------------+-------+\n\
  | Variable_name       | Value |\n+---------------------+-------+\n| bind_address\
  \        | *     |\n| mysqlx_bind_address | *     |\n+---------------------+-------+\n\
  3. `bind_address` 是只读变量，你需要在 MySQL 服务器配置文件 `/etc/my.cnf.d/mysql-server.cnf` 中设置它，该文件包含在\
  \ `/etc/my.cnf` 文件中。例如，你可以将 `bind_address` 改为特定的 IP 地址以提高服务器安全性。修改配置文件后，请重启 MySQL\
  \ 服务器。\n```bash\nherong$ sudo cat /etc/my.cnf.d/mysql-server.cnf\n[mysqld]\n# 仅监听环回\
  \ IP 地址，因此只有来自服务器主机\n# 的客户端程序可以使用 TCP/IP 连接。\n# bind_address=127.0.0.1\n# 仅监听本地\
  \ IP 地址，因此来自其他本地 IP 地址\n# 192.168.1.* 的客户端程序可以使用 TCP/IP 连接\n# bind_address=192.168.1.100\n\
  # 默认 - 监听服务器主机上所有的 IP 地址。\nbind_address=*\n```\n4. MySQL 服务器监听在 `port` 变量指定的 IP\
  \ 端口 3306，该变量也是只读的。如果你需要更改，必须在 MySQL 服务器配置文件 `/etc/my.cnf.d/mysql-server.cnf` 中设置，该文件包含在\
  \ `/etc/my.cnf` 中。\n5. 用户必须以 IP 地址作为主机名创建才能使用 TCP/IP 连接。来自给定 IP 地址的用户格式为 `'user'@'ip_address'`。你可以在\
  \ IP 地址中使用通配符字符来表示 IP 地址范围。例如，`'herong'@'127.0.0.1'` 允许我从 IP 地址为 `192.168.1.11`\
  \ 的计算机连接到服务器。`'herong'@'192.168.1.%'` 允许我从局域网上的任何计算机连接到服务器。`'herong'@'%'` 允许我从互联网上的任何计算机连接到服务器。参考下方的\
  \ MySQL 命令创建多个用户以便不同主机使用 TCP/IP 连接：\n```mysql\nmysql> # 在同一主机上使用 TCP/IP 连接\nmysql>\
  \ create user 'herong'@'127.0.0.1' by 'TopSecret';\nmysql> # 允许来自我的电脑的 TCP/IP 连接\n\
  mysql> create user 'herong'@'192.168.1.11' by 'TopSecret';\nmysql> # 允许来自局域网内任何计算机的\
  \ TCP/IP 连接\nmysql> create user 'herong'@'192.168.1.%' by 'TopSecret';\nmysql> #\
  \ 允许来自互联网上任何计算机的 TCP/IP 连接\nmysql> create user 'herong'@'%' by 'TopSecret';\nmysql>\
  \ select user, host from mysql.user;\n```\n+------------------+--------------+\n\
  | user             | host           |\n+------------------+--------------+\n| herong\
  \           | localhost      |\n| herong           | 127.0.0.1      |\n| herong\
  \           | 192.168.1.11   |\n| herong           | 192.168.1.%    |\n| herong\
  \           | %              |\n+------------------+--------------+\n6. 客户端程序可以指定\
  \ MySQL 服务器监听的 IP 地址和端口号以建立 TCP/IP 连接。例如，以下 PHP 语句将使用 TCP 连接到 MySQL 服务器：\n```php\n\
  # MySQL 正在 127.0.0.1:3306 监听：\n$conn = mysqli_connect(\"127.0.0.1\", 'herong', 'TopSecret');\n\
  # MySQL 正在 192.168.1.100:3306 监听：\n$conn = mysqli_connect(\"192.168.1.100\", 'herong',\
  \ 'TopSecret');\n# MySQL 正在 192.168.1.100:3307 监听：\n$conn = mysqli_connect(\"192.168.1.100:3307\"\
  , 'herong', 'TopSecret');\n```\n7. MySQL 客户端工具使用给定的 `-h ip_address` 和 `-P port_nunber`\
  \ 选项通过 TCP/IP 连接 SQL 服务器。见下例：\n```bash\nherong$ mysql -u herong -h 192.168.1.100\
  \ -p\nherong$ mysql -u herong -h 192.168.1.100 -P 3307 -p\n```\n8. 使用 TCP/IP 连接时遇到的最后一个问题可能是网络防火墙。防火墙可能会在\
  \ 4 处阻止你的 TCP/IP 连接：\n- 你的计算机上的防火墙必须允许向 MySQL 服务器的 TCP 出站请求。\n- 你的计算机局域网上的防火墙必须允许你的\
  \ TCP 请求出站。\n- MySQL 服务器局域网网关上的防火墙必须允许你的 TCP 请求进入。\n- MySQL 服务器上的防火墙必须开放以接受来自你 IP\
  \ 地址的 TCP 入站请求。\n\n\n\n\n\n```\ninet 192.168.1.100 netmask 255.255.255.0 broadcast\
  \ 192.168.1.255\n...\n```\n\n```bash\nherong$ mysql -u root -p\n\nmysql> show variables\
  \ like 'bind_address';\n\n+---------------------+-------+\n| Variable_name     \
  \  | Value |\n+---------------------+-------+\n| bind_address        | *     |\n\
  +---------------------+-------+\nmysql> show variables like 'port';\n\n+---------------+-------+\n\
  | Variable_name | Value |\n+---------------+-------+\n| port          | 3306  |\n\
  +---------------+-------+\n```\n\n## 2. 确保我的 MySQL 用户账户涵盖了我的电脑 IP 地址。\n\n我看到我的电脑\
  \ IP 地址 `192.168.1.11` 已经在范围内了（服务器上）\n\n```bash\nherong$ mysql -u root -p\n\nmysql>\
  \ select user, host from mysql.user;\n\n+------------------+--------------+\n| user\
  \             | host         |\n+------------------+--------------+\n| herong  \
  \         | localhost    |\n| herong           | 127.0.0.1    |\n| herong      \
  \     | 192.168.1.%  |\n+------------------+--------------+\n```\n\n（我的电脑上）\n\n\
  ```bash\nherong$ ifconfig\n\nen0: flags=8863<UP,BROADCAST,SMART,RUNNING,SIMPLEX,MULTICAST>\
  \ mtu 1500\ninet 192.168.1.11 netmask 0xffffff00 broadcast 192.168.1.255\n```\n\n\
  ## 3. 检查从我的电脑到服务器的 IP 地址和端口连接。\n\n我看到电脑可以到达服务器，但无法访问端口 `3306`。（我的电脑上）\n\n```bash\n\
  herong$ ping 192.168.1.100\n\nPING 192.168.1.100 (192.168.1.100): 56 data bytes\n\
  64 bytes from 192.168.1.100: icmp_seq=0 ttl=64 time=4.548 ms\n64 bytes from 192.168.1.100:\
  \ icmp_seq=1 ttl=64 time=2.308 ms\n...\n\nherong$ telnet 192.168.1.100 3306\n\n\
  Trying 192.168.1.100...\ntelnet: connect to address 192.168.1.100: Connection refused\n\
  telnet: Unable to connect to remote host\n```\n\n## 4. 在 MySQL 服务器上开放 3306 端口的防火墙。\n\
  \n这些命令为互联网上的所有电脑开放 `3306` 端口。我稍后需要添加更多限制。（服务器上）\n\n```bash\nherong$ sudo firewall-cmd\
  \ --zone=public --add-port=3306/tcp\nherong$ sudo firewall-cmd --runtime-to-permanent\n\
  ```\n\n## 5. 再次检查从我的电脑到服务器的 IP 地址和端口连接。\n\n我看到 TCP/IP 连接已开启。\n\n```bash\nherong$\
  \ telnet 192.168.1.100 3306\n\nTrying 192.168.1.100...\nConnected to 192.168.1.100.\n\
  Escape character is '^]'.\nJ\n8.0.17/1TZi76?l...\n```\n\n## 6. 最后，从我的客户端电脑连接到 MySQL\
  \ 服务器：\n\n```bash\nherong$ /usr/local/mysql/bin/mysql -u herong -h 192.168.1.100\
  \ -p\n\nEnter password: TopSecret<Enter>\nmysql>\n```\n\n酷酷！我成功设置了 MySQL 服务器和防火墙，实现了从客户端电脑的\
  \ TCP/IP 连接。\n\n---\n\n## “服务器向客户端发送未知字符集 (Server sent charset unknown to the client)”错误\n\
  \n提供了一个教程示例，说明如何解决在连接 CentOS 8 系统上运行的 MySQL 8.0 时，PHP `mysqli_connect()` 调用收到的“Server\
  \ sent charset unknown to the client”错误。如果你在客户端电脑上运行旧版本的 PHP，并尝试使用 `mysqli_connect()`\
  \ 函数连接到 CentOS 系统上的 MySQL 8.0，你将得到“Server sent charset unknown to the client”错误：\n\
  \n```bash\nherong$ php --version\nPHP 5.6.30 (cli) (built: Oct 29 2017 30:32)\n\n\
  herong$ php test.php\nPHP Warning: mysqli_connect(): Server sent charset (255) unknown\
  \ to the client. Please, report to the developers in /Users/herong/test.php on line\
  \ 10.\nPHP Warning: mysqli_connect(): (HY000/2054): Server sent charset ...\n```\n\
  \n根据互联网上的报告，上述问题是由默认设置 `character_set_client = utf8mb4` 引起的，旧版本的 `mysqli` 模块无法识别它。我尝试了互联网上建议的多种解决方案，对我无效。组合使用也没有效果：\n\
  \n- 在 MySQL 8.0 服务器上运行 `set global character_set_client = 'utf8';`\n- 在 MySQL 8.0\
  \ 服务器上运行 `set global character_set_results = 'utf8';`\n- 在 MySQL 8.0 服务器上运行 `set\
  \ global character_set_connection = 'utf8';`\n- 使用 `skip-character-set-handshake`\
  \ 选项重启 MySQL 8.0 服务器\n- 使用 `character_set_client=utf8` 选项重启 MySQL 8.0 服务器\n\n对我唯一的有效的解决方案是升级\
  \ PHP：\n\n```bash\nherong$ php --version\nPHP 7.2.1 (cli) (built: Oct 9 2018 15:09:36)\
  \ NTSTS\n\nherong$ php test.php\nmysqli_get_server_info() = 8.0.17\nmysqli_get_host_info()\
  \ = 192.168.1.100 via TCP/IP\n```\n\n---\n\n## 向 MySQL 插入整数的性能\n\n提供了一个教程示例，说明如何使用\
  \ PHP `mysqli` 函数测试向 MySQL 数据库插入整数的性能。在我的 CentOS 和 macOS 电脑上，MySQL 服务器的速度慢了 100\
  \ 倍。如果你正在处理大量数据集，那么你需要了解 MySQL 服务器的性能。以下是我在运行 CentOS 8 和 macOS 电脑的 MySQL 服务器上收集的数据。创建一个\
  \ PHP 脚本来测量向数据库插入的速度。\n\n```php\n<?php\n# speed-of-insert-integer.php\n# Copyright\
  \ (c) Herong.com. All Rights Reserved.\n\n$count = 100;\nif (count($argv) > 1) $count\
  \ = $argv[1];\n$binLog = \"on\";\nif (count($argv) > 2) $binLog = $argv[2];\n\n\
  print(\"Testing parameters:\\n\");\nprint(\"Number of operations: $count\\n\");\n\
  print(\"Binary log = $binLog\\n\");\n\n$con = mysqli_connect(\"127.0.0.1\", 'herong',\
  \ 'TopSecret', \"test\");\n$sql = \"SET sql_log_bin = $binLog\";\n$res = mysqli_query($con,\
  \ $sql);\n$sql = \"CREATE TABLE Tests (Quantity INTEGER);\n$res = mysqli_query($con,\
  \ $sql);\n$startTime = round(microtime(true)*1000);\n\n$i = 0;\nwhile ($i < $count)\
  \ {\n    $sql = \"INSERT INTO Tests VALUES ($i)\";\n    $res = mysqli_query($con,\
  \ $sql);\n    $i++;\n}\n$endTime = round(microtime(true)*1000);\n$exeTime = $endTime\
  \ - $startTime;\n\nprint(\"Testing result:\\n\");\nprint(\"Execution time in milliseconds\
