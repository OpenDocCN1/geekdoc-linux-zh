  \ FTP。\n\n---\n\n# 在 CentOS 上测试远程 FTP 访问\n\n提供了一个教程示例，说明如何在 `vsftpd` 服务器（如果它是在云端提供，则为其防火墙网关）上更新防火墙，为入站连接开放\
