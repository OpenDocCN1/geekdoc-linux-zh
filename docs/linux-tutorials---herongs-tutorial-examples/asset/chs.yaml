  \ in ..18341 secs (5,117,265 bytes/))\n\nongong$ dd if=one-iga=/dev/dev bs=1k count=1024k\n\
  \n1048576+0 records in\n1048576+0 records out\n1073741824 bytes transferred in 2.32091\
  \ secs (462,701, bytes/sec)\n```\n\n### 3. 测试同一 USB 驱动器的输入（写入）速度\n我发现 macOS 上 USB\
  \ 驱动器的输入速度比 CentOS 慢了 200 倍。我认为速度下降的主要原因是连接 USB 的电缆。（USB 驱动器挂载在 `/Volumes` 上）\n\n\
  ```bash\nherong$ df\nFilesystem      1K-blocks  Used Available Use% Mounted on\n\
  /dev/disk3s1    15626248  229480  13331440    15% /Volumes/NAME\n\nherong$ sudo$\
  \ sudo dd if=/dev/zero of=one-giga bs=64k count=16k\n\n16384+0 records in\n16384+0\
  \ records out\n1073741824 bytes transferred in 214.29878 secs (5,010,490 bytes/sec)\n\
  \nherong$ sudo dd if=/dev/zero of=one-giga bs=1k count=1024k\n\n1048576+0 records\
  \ in\n1048576+0 records out\n1073741824 bytes transferred in 208.1572 secs (5,158,326\
  \ bytes/sec)\n```\n\n### 4. 测试 USB 驱动器的输出（读取）速度\n我发现 USB 驱动器上的输出速度比输入速度快 600 倍，这让我很惊讶。\n\
  \n```bash\nherong$ dd if=one-giga of=/dev/null bs=64k count=16k\n\n16384+0 records\
  \ in\n16384+0 records out\n1073741824 bytes transferred in 0.353298 s (3,039,196,314\
  \ bytes/sec)\n\n# \"hdparm\" - 硬盘参数\n\n提供了一个教程示例，介绍如何使用 `hdparm` 命令收集硬盘识别信息并获取/设置参数。`hdparm`\
