  gcc (GCC) 8.3.1\n\n# 别名\nherong$ ls -l /usr/bin/cc\nlrwxrwxrwx 1 root root 7 May\
  \  5 23:36 /usr/bin/cc -> gcc\n```\n\n### 3. 编译并运行 C 程序\n```bash\nherong$ vi hello.c\n\
  #include<stdio.h>\nint main(void) {\n  printf(\"Hello world!\\n\");\n  return 0;\n\
