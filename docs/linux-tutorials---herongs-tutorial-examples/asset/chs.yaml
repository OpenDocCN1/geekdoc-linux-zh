  \  Main PID: 26803 (vsftpd)\n    Tasks: 1 (limit: 23087)\n    Memory: 540.0K\n \
  \   CGroup: /system.slice/vsftpd.service\n             | 26803 /usr/sbin/vsftpd\
  \ /etc/vsftpd/vsftpd.conf\nJun 23 16:59:40  systemd[1]: Starting Vsftpd ftp daemon...\n\
  Jun 23 16:59:40  systemd[1]: Started Vsftpd ftp daemon.\n```\n\n## vsftpd 服务器配置\n\
  \n提供了一个教程示例，介绍如何配置 `vsftpd` 服务器，允许某些本地用户使用 FTP 客户端程序在其自己的私有目录下上传和下载文件。安装 `vsftpd`\
  \ 后，下一步是检查并更新其配置。我想实现的是允许某些本地用户使用 FTP 客户端程序在其私有目录下上传和下载文件。\n\n### 1. 找到 vsftpd 配置文件并创建备份。\n\
  ```bash\nherong$ cd /etc/vsftpd\nherong$ ls -l\ntotal 20\n-rw------- 1 root root\
  \  125 May 14  2019 ftpusers\n-rw------- 1 root root  361 May 14  2019 user_list\n\
  -rw------- 1 root root 5098 May 14  2019 vsftpd.conf\n-rwxr--r-- 1 root root  348\
  \ May 14  2019 vsftpd_conf_migrate.sh\nherong$ sudo cp vsftpd.conf vsftpd.conf.bck\n\
  ```\n\n### 2. 打开 vsftpd.conf 如下所示更新或添加设置：\n```bash\nherong$ sudo vi vsftpd.conf\n\
  ```\n```ini\n# 注消此注释以允许本地用户登录。\n# 当 SELinux 强制执行时，检查 SE bool ftp_home_dir\nlocal_enable=YES\n\
  \n# 注消此注释以启用任何形式的 FTP 写入命令。\nwrite_enable=YES\n\n# 本地用户的默认 umask 为 077。如果你的用户需要，你可以将其更改为\
  \ 022，\n# (大多数其他 ftpd 使用 022)\nlocal_umask=022\n...\n# 激活上传/下载日志记录。\nxferlog_enable=YES\n\
  \n# 如果你需要，可以覆盖日志文件的存储位置。默认值如下所示。\nxferlog_file=/var/log/xferlog\n\n# 如果需要，可以让日志文件采用标准的\
  \ ftpd xferlog 格式。\n# 注意在这种情况下默认的日志文件位置是 /var/log/xferlog。\nxferlog_std_format=NO\n\
  \n# 你可以指定一个本地用户列表，将其 chroot() 到其主目录。\n# 如果 chroot_local_user 为 YES，则此列表将变为\n# 不\
  \ chroot 的用户列表。\n# (警告！chroot 可能非常危险。如果使用 chroot，请确保\n# 用户对 chroot 内的顶级目录没有写入权限)\n\
  chroot_local_user=YES\n...\n# 允许 vsftpd.user_list 列表中的用户访问服务器\nuserlist_enable=YES\n\
  userlist_file=/etc/vsftpd/user_list\nuserlist_deny=NO\n# 当用户连接到服务器时，重定向到他们的 \"ftp\"\
  \ \nuser_sub_token=$USER\nlocal_root=/home/$USER/ftp\n# 指定被动连接的端口范围\npasv_min_port=30000\n\
  pasv_max_port=31000\n```\n\n### 3. 重启 vsftpd:\n```bash\nherong$ sudo systemctl restart\
  \ vsftpd\n```\n`vsftpd` 服务器已就绪。请参阅下一个关于如何设置用户目录和权限的教程。\n\n## 为本地用户设置子目录\n\n提供了一个教程示例，介绍如何在系统中为本地用户设置\
  \ `ftp` 子目录，并允许他们使用 `vsftpd` 上传和下载文件。根据上一个教程提供的 `vsftpd` 配置，我已经准备好在家目录下创建一个 `ftp`\
  \ 目录用于上传和下载文件。\n\n### 1. 创建 `ftp` 子目录作为我的 FTP 目录。更改其所有权和权限以允许 `vsftpd` 访问。\n```bash\n\
  herong$ sudo mkdir /home/herong/ftp\nherong$ sudo chown nobody:nobody /home/herong/ftp\n\
  herong$ sudo a-w /home/herong/ftp\nherong$ sudo ls -l /home/herong\ndr-xr-xr-x 2\
  \ nobody 6 Jun 23 17:03 ftp\n```\n\n### 2. 创建具有私有权限的 `ftp/files` 子目录用于上传和下载文件。\n\
  ```bash\nherong$ sudo mkdir /home/herong/ftp/files\nherong$ sudo chown nobody:nobody\
  \ /home/herong/ftp/files\nherong$ sudo ls -l /home/herong\ndr-xr-xr-x 2 nobody 6\
  \ Jun 23 17:03 ftp\ndrwxr-xr-x 2 nobody root 0 Jun 23 17:03 files\n```\n\n### 3.\
  \ 将用户添加到 vsftpd.user_list 列表中。\n```bash\nherong$ cd /etc/vsftpd\nherong$ echo \"\
  herong\" >> user_list\nherong$ cat user_list\n```\n输出：\n```\nherong\n```\n\n###\
  \ 4. 重启 vsftpd:\n```bash\nherong$ sudo systemctl restart vsftpd\n```\n`vsftpd` 服务已重启。\n\
