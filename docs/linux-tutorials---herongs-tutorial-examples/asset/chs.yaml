  \ (on)\n```\n\n## \"du\" - 显示目录的磁盘使用情况\n\n提供了一个教程示例，介绍如何在 Linux 系统上使用 `du` 命令显示任何给定目录的磁盘使用情况。要查看某个目录占用了多少空间，可以使用\
