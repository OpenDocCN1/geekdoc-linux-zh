  \ php-pdo-7.2.11-2.module_el8.1.0\n```\n```\n如果你看到更多未定义函数的错误，可以继续使用 `yum` 命令搜索并安装\
  \ PHP 模块。\n\n### PHP \"include\" 语句使用的文件\n\n提供了一个 PHP 引擎如何搜索 `include` 语句给出文件的教程示例。当你使用\
  \ `include` 语句执行存储在单独文件中脚本时，PHP 引擎按照以下规则搜索并查找脚本文件。\n\n#### 1. 如果提供了绝对路径，PHP 引擎将仅在给定的绝对路径目录下搜索该文件。例如，以下代码将在\
  \ `/usr/share/php` 目录中搜索 `include_extra.php`。\n\n```php\n<?php\n  include \"/usr/share/php/include_extra.php\"\
  ;\n?>\n```\n\n#### 2. 如果提供了相对路径，PHP 引擎将相对于当前工作目录搜索该文件，而当前工作目录可能与调用脚本所在的目录不同。例如，以下代码将在代码执行所在的目录中搜索\
  \ `include_extra.php`。\n\n```php\n<?php\n  include \"./include_extra.php\";\n?>\n\
  ```\n\n\n\n\n3. 如果未同文件名未提供路径，PHP 引擎将按照顺序在以下 3 个位置搜索文件：\n\n*   `include_path` 中指定的目录。\n\
  *   调用脚本所在的目录。\n*   当前工作目录。\n\n例如，以下代码将在多个处搜索 `include_extra.php`。\n\n```php\n<?php\n\
  \  include \"include_extra.php\";\n?>\n```\n\n因此，使用 `include` 语句的最佳方法是仅提供文件名，并确保被包含的文件存储在\
  \ `include_path` 目录之一。\n\n1. 验证 `PHP FPM (FastCGI Process Manager)`，即 `php-fpm`\
  \ 是否正在运行。如果没有运行，请安装 `php-fpm` 软件包并启动 `php-fpm` 服务。PHP FPM 提供了 Apache Web 服务器与 PHP\
  \ 引擎之间的接口。\n\n```bash\nherong$ systemctl status php-fpm\nphp-fpm.service - The PHP\
  \ FastCGI Process Manager\n    Loaded: loaded (/usr/lib/systemd/system/php-fpm.service;\
  \ disabled;\n    Active: active (running) since Thu 2020-03-26 23:00:41 EDT;\n \
  \   Main PID: 21507 (php-fpm)\n        ...: ...\n```\n\n2. 验证 Apache Web 服务器，`httpd`\
  \ 是否正在运行。如果没有运行，请安装 `httpd` 软件包并启动 `httpd` 服务。\n\n```bash\nherong$ systemctl status\
  \ httpd\nhttpd.service - The Apache HTTP Server\n    Loaded: loaded (/usr/lib/systemd/system/httpd.service;\
  \ disabled;\n    Drop-In: /usr/lib/systemd/system/httpd.service.d\n            \
  \ |-php-fpm.conf\n    Active: active (running) since Thu 2020-03-26 22:06:40 EDT;\n\
  \    Main PID: 19007 (httpd)\n        ...: ...\n```\n\n3. 将 PHP 脚本发布到 Apache Web\
  \ 服务器的 HTML 文档目录。\n\n```bash\nherong$ cd /var/www/html\nherong$ sudo mkdir test\n\
  herong$ ls -l\ndrwxr-xr-x. 2 root root  6 Mar 28 22:25 test\nherong$ sudo chown\
  \ herong test\nherong$ ls -l\ndrwxr-xr-x. 2 herong root  6 Mar 28 22:25 test\nherong$\
  \  cd /var/www/html/test\nherong$ ls -l\n-rw-r--r--. 1 herong herong 73 Mar 28 22:28\
  \ test.php\nherong$ cat test.php\n```\n\n```html\n<html>\n<body>\n<p>\n<?php\nprint(\"\
  Hello world!\\n\");\n?>\n</p>\n</body>\n</html>\n```\n\n4. 验证 PHP 脚本页面是否工作正常。\n\n\
  ```bash\nherong$ curl http://localhost/test/test.php\n<html>\n<body>\n<p>\nHello\
  \ world!\n</p>\n</body>\n</html>\n```\n\n## 导出 PHP/Apache 环境信息\n\n提供了一个关于如何在 CentOS\
  \ Linux 系统上导出 Apache/PHP 环境信息的教程示例。在 Apache Web 服务器上运行 PHP 脚本的执行环境与从命令行运行不同。你需要按照本教程所示导出\
  \ Apache/PHP 环境信息。\n\n1. 将以下脚本文件 `test_phpinfo.php` 发布到 Apache Web 服务器目录 `/var/www/html/test`：\n\
  \n```php\n<?php phpinfo(); ?>\n```\n\n2. 在 Web 浏览器通过 `http://localhost/test/test_phpinfo.php`\
  \ 将脚本文件作为网页查看。你应该能看到良好的格式看到 Apache/PHP 环境信息。\n\n```text\nHP Version 7.2.11\nSystem\
  \  =>  Linux 4.18.0-147.el8.x86_64 #1 SMP Wed Dec 4 21:51:45 UTC 2019\nBuild Date\
  \  =>  10/09/18 03:09 PM\nServer API  =>  FPM/FastCGI\nVirtual Directory Support\
  \  =>  disabled\nConfiguration File (php.ini) Path  =>  /etc\nLoaded Configuration\
  \ File  =>  /etc/php.ini\nScan this dir for additional .ini files  =>  /etc/php.d\n\
  Additional .ini files parsed  =>  /etc/php.d/20-bz2.ini, ...\n..\nDirective  =>\
  \  Local Value  active    Master Value\ncgi-fcgi\nphp-fpm  => active\ncgi.discard_path\
  \  =>  0  =>  0\ncgi.fix_pathinfo  =>  1  =>  1\ncgi.force_redirect  =>  1  => \
  \ 1\ncgi.nph  =>  0  =>  0\ncgi.redirect_status_env  =>  no value  =>  no value\n\
  cgi.rfc2616_headers  =>  0  =>  0\nfastcgi.error_header  =>  no value  =>  no value\n\
  fastcgi.logging  =>  1  =>  1\nCore\nallow_url_fopen  =>  On  =>  On\nallow_url_include\
  \  =>  Off  =>  Off\n...\nerror_log  =>  /var/log/php-fpm/www-error.log  =>  ...\n\
  extension_dir  =>  /usr/lib64/php/modules  =>  /usr/lib64/php/modules\n...\n```\n\
  \n现在我知道该去哪里寻找 Apache/PHP 错误日志文件了：\n\n```bash\ncentos$ sudo ls -l /var/log/php-fpm\n\
  ```\n\n\n\n\n\n看起来 PHP-FPM 模块添加了一些额外的安全保护，以防止任何 PHP 脚本写回 Apache HTML 目录。为所有用户授予“rwxrwxrwx”写入权限对于\
  \ PHP-FPM 模块来说是不够的。一种变通是从 Apache PHP 脚本将文件写入 `/tmp` 或 `/var/log`。\n\n## /var/www/html\
  \ 上的 SELinux 安全上下文\n\n提供了一个教程示例，说明如何更改 `/var/www/html` 内部子目录的 SELinux 安全上下文类型，以允许运行在\
  \ CentOS 系统 Apache Web 服务器上的 PHP 脚本创建新文件。\n\n上一个教程中提到的“Apache PHP `file_put_contents()`\
  \ 权限被拒绝”问题的根源，实际上是 `/var/www/html` 目录上的 SELinux 安全上下文设置。我们可以通过本教程所示的更改 SELinux 安全上下文类型来临时修复它。\n\
  \n1. 对比 `/var/www/html/test` 与 `/tmp` 的 SELinux 安全上下文。我发现它们的安全用户、组和类型是不同的。\n\n```\n\
  herong$ ls -la --context /var/www/html/test\ndrwxrwxrwx. 2 herong root unconfined_u:object_r:httpd_sys_content_t:s0\
  \ .\n\nherong$ ls -la --context /tmp\ndrwxrwxrwt. 15 root root system_u:object_r:tmp_t:s0\
  \ .\n```\n\n2. 将 `/var/www/html/test` 的 SELinux 安全上下文类型更改为匹配 `/tmp`，我的 PHP Web 脚本就可以创建文件。\n\
  \n```\nherong$ cd /var/www\nherong$ sudo chcon -t tmp_t test\nherong$ ls -la --context\
  \ test\ndrwxrwxrwx. 2 herong root   unconfined_u:object_r:tmp_t:s0 .\n```\n\n3.\
  \ 在 Apache 服务器上重新运行测试脚本。我看到 `/var/www/html/test` 中创建了新文件。\n\n```\nherong$ curl localhost/test/test_file_put_contents.php\n\
  \n<html><body><pre>\nOutput from whoami:\napache\n\nOutput from getcwd():\n/var/www/html/test\n\
  \ntest file_put_contents(./tmp-cwd.tmp):\n-rw-r--r--. 1 apache apache 26 Apr  1\
  \ 02:29 ./tmp-cwd.tmp\n\ntest file_put_contents(/tmp/tmp-tmp.tmp):\n-rw-r--r--.\
  \ 1 apache apache 27 Apr  1 02:29 /tmp/tmp-tmp.tmp\n</pre></body></html>\n```\n\n\
  太酷了。我有一个临时解决方案，可以在带有“PHP-FPM”模块的 Apache Web 服务器上通过 PHP 脚本在 `/var/www/html` 目录下创建新文件。\n\
  \n## 将旧脚本迁移到新 PHP 版本\n\n提供了一个教程示例，说明如何将旧 PHP 脚本迁移到新的 PHP 版本。如果你在较版本的 PHP 引擎上运行旧\
  \ PHP 脚本，可能会看到许多错误，因为某些模块或函数已弃用或删除。以下是它们的替换列表。\n\n- `eregi('...', ...);` --> `preg_match(('/.../i',\
  \ ...);`\n- `mysql_*()` --> `mysqli_*()`\n- `date(): ... not safe ...` --> `date_default_timezone_set('Europe/Paris');`\n\
  \n## 在 Linux 系统上运行 MySQL 数据库服务器\n\n提供了 CentOS 系统 MySQL 数据库服务器的介绍和教程示例。主题包括在 CentOS\
  \ 8 上安装 MySQL 8.0；启动和停止 `mysqld` 系统服务；设置 MySQL `root` 密码；MySQL 文件和数据位置；MySQL 日志文件；备份\
  \ MySQL 数据；MySQL socket 和 TCP/IP 连接；为 MySQL 连接开放防火墙。\n\n### 核心点：\n- 在 CentOS 8 上，可以使用\
  \ `dnf install mysql-server` 命令安装 MySQL 服务器。\n- 可以 `service mysqld start/stop` 命令启动和停止\
  \ MySQL 服务器。\n- MySQL 服务器启动时 `root` 用户没有密码。你可以使用 `mysqladmin -u root -p password`\
  \ 命令设置密码。\n- MySQL 命令程序位于 `/usr/bin` 目录。\n- MySQL 数据和日志文件位于 `/var/lib/mysql` 目录。\n\
  - 可以 `mysqldump` 命令备份 MySQL 数据。\n- MySQL 可以 `general_log` 设置记录所有查询。\n- MySQL 支持服务器上使用\
  \ `localhost` 作为主机名的客户端程序进行 socket 连接。\n- MySQL 支持通过端口 3306 为远程客户端提供 TCP/IP 连接。\n\
  - 只有当使用其特定的 IP 地址创建用户时，MySQL 才允许远程用户访问。\n- MySQL 要求服务器和网关开放端口 3306 的入站消息防火墙。\n-\
  \ 使用旧的 PHP `mysqli_connect()` 函数连接 MySQL 8.0 时会返回“Server sent charset unknown to\
  \ the client”错误。\n- 在默认设置下，我的 CentOS 上 MySQL 服务器比 macOS 慢 100 倍。\n\n### 在 CentOS\
  \ 上安装 MySQL 数据库服务器\n\n提供了一个教程示例，说明如何使用 `dnf/yum` 作为包管理器在 CentOS 8 上安装 MySQL 8.0\
  \ 服务器。如果你想在 CentOS 系统上使用 MySQL 数据库服务器，可以参考我在 CentOS 8 计算机上的操作：\n\n1. 以具有管理员权限的 \"\
  herong\" 登录。\n2. 运行 `dnf search` 可用包。我看到 `mysql-server` 和一些相关模块可以安装：\n\n```\nherong$\
  \ dnf search mysql\nmysql-server.x86_64 : MySQL programs and shared libraries\n\
  grafana-mysql.x86_64 : Grafana datasource\npostfix-mysql.x86_64 : Postfix map\n\
  rsyslog-mysql.x86_64 : MySQL support for rsyslog\ndovecot-mysql.x86_64 : MySQL end\
  \ for docot\nperl-DBD-MySQL.x86_64 : MySQL interface for Perl\nfreeradius-mysql.x86_64\
  \ : MySQL support for freeradius\nmysql-server.x86_64 : MySQL server and related\
  \ files\nmysql-test.x86_64 : test suite distributed with MySQL\n```\n\n3. 安装 `mysql-server`\
  \ 包：\n\n```\nherong$ sudo dnf install mysql-server\nPackage            Arch    \
