    ## 什么是 SELinux 域 (Domain)\n快速介绍什么是 SELinux 域。它是一个抽象概念，表示一组分组在一起的运行进程，以便安全策略可以在组级别上应用，而不是在进程级别逐个应用。在之前的教程中，我们学习了什么是\
    \ SELinux 用户、什么是 SELinux 角色以及什么是 SELinux 类型。现在让我们来看下 SELinux 域。\n\n### 什么是 SELinux\
    \ 域？\nSELinux 域是一个抽象概念，表示一组分组在一起的运行进程，以便安全策略可以在组级别上应用，而不是在进程级别逐个应用。默认情况下，SELinux\
    \ 拥有一长串预定义的 SELinux 域。其中一些列举所示：\n`accountsd_t`, `alsa_t`, `auditd_t`, `avahi_t`,\
    \ `boltd_t`, `chronyd_t`, `colord_t`, `crond_t`, `cupsd_t`, `dnsmasq_t`, `firewalld_t`,\
    \ `fsdaemon_t`, `ftpd_t`, `fwupd_t`, `gssproxy_t`, `httpd_t`, `init_t`, `irqbalance_t`,\
    \ `kernel_t`, `ksmtuned_t`, `lsmd_t`, `mcelog_t`, `modemmanager_t`, `mysqld_t`,\
    \ `policykit_t`, `rngd_t`, `rpcbind_t`, `rtkit_daemon_t`, `sshd_t`, `syslogd_t`,\
    \ `systemd_usd_t`, `systemd_logind_t`, `systemd_machined_t`, `tuned_t`, `udev_t`,\
    \ `unconfined_t`, `virtd_t`, `xdm_t`, `xd_t`。\n\n当创建一个新进程时，SELinux 会根据一组预定义的设置将其分配到默认的\
    \ SELinux 域。分配给进程的 SELinux 域存储在其上下文属性的第三字段中。在下面的示例中，进程 `bash` 被分配给了 `unconfined_t`\
    \ SELinux 域。\n`herong$ ps -Z | grep bash`\n`unconfined_u:unconfined_r:unconfined_t:s0-s0:c1023\
    \ 20713 pts/1 0:00 bash`\n\n进程的 SELinux 上文属性也称为 SELinux 标签。为文件分配 SELinux 类型的过程称为\
    \ SELinux 标记化（Labeling）。SELinux 上文（进程标签）以 5 个字段存储进程的完整安全信息，如下所示：\nSELinux 上文 =\
    \ user:role:domain:level:category \n\n实际上，如果我们将 SELinux 类型视为一组资源的表示，那么 SELinux\
    \ 域可以被视为 SELinux 类型的一种特殊情况。文件和进程只是不同的类型而已。\n\n## SELinux 策略规则\n快速介绍 SELinux 策略规则以及如何使用\
    \ `sesearch` 命令来审查它们。在之前的教程中，我们学习了 SELinux 系统中最重要的四个实体：用户、角色、域和类型。它们用于以层次形式定义\
    \ SELinux 安全策略：`SELinux 用户`、`SELinux 角色`、`SELinux 域`、`SELinux 类型`。\n\n现在让我们来看\
    \ SELinux 安全分级结构的底部部分，它也称为类型强制（Type Enforcement）：`SELinux 域`。SELinux 类型强制策略实际上是一组形式如下的策略规则：`allow\
    \ \"source\" on \"target\" of \"class\" with \"permissions\"`，其中：\n- `source`:\
    \ 一个 SELinux 域\n- `target`: 一个 SELinux 域或类型\n- `permissions`: 允许的动作列表\n- `class`:\
    \ 作为目标子集的 SELinux 类\n\n下面是一个通过 `sesearch` 命令检索的 SELinux 策略规则示例：\n`herong$ sesearch\
    \ --allow --source httpd_t --target httpd_log_t --class file`\n`allow httpd_t\
    \ httpd_log_t:file { append create getattr ioctl open ... };`\n\n上述策略规则告诉我们，位于\
    \ `httpd_t` SELinux 域中的任何进程对 `httpd_log_t` SELinux 类型的 `file` 类具有 `append create\
    \ getattr ioctl open ...` 权限。让我们验证哪些进程在 `httpd_t` SELinux 域中：\n`herong$ ps -eZ\
    \ | grep httpd_t`\n`system_u:system_r:httpd_t:s0 3427 ? 00:02:43 php-fpm`\n`system_u:system_r:httpd_t:s0\
    \ 3428 ? 00:03:01 httpd`\n\n这些进程可以向 httpd `access-log` 文件追加新的日志条目吗？答案是肯定的，因为它是\
    \ `httpd_log_t` SELinux 类型：\n`herong$ sudo ls -Z /var/log/httpd/access_log`\n\
    `system_u:object_r:httpd_log_t:s0 /var/log/httpd/access_log`\n\n`httpd_t` 进程可以在\
    \ `/var/www/html` 目录下创建新文件吗？答案是否，因为相关的策略规则中没有列出 `create` 权限：\n`herong$ sudo ls\
    \ -dZ /var/www/html`\n`system_u:object_r:httpd_sys_content_t:s0 /var/www/html`\n\
    `herong$ sesearch --allow --source httpd_t --target httpd_sys_content_t --class\
    \ dir`\n`allow httpd_t httpd_sys_content_t:dir { getattr ioctl lock open read\
    \ search };`\n\nSELinux 类型强制策略规则在 SELinux 策略数据库中也称为 `allow` 规则。你可以使用 `sesearch\
    \ --allow` 命令获取所有 `allow` 规则的列表：\n`herong$ sesearch --allow | more`\n`allow NetworkManager_etc_rw_t\
    \ NetworkManager_etc_rw_t:filesystem associate;`\n`allow NetworkManager_etc_t\
    \ NetworkManager_etc_t:filesystem associate;`\n`allow NetworkManager_exec_t NetworkManager_exec_t:filesystem\
    \ associate;`\n`allow NetworkManager_log_t NetworkManager_log_t:filesystem associate;`\n\
    `allow NetworkManager_log_t tmp_t:filesystem associate;`\n`allow NetworkManager_log_t\
    \ tmpfs_t:filesystem associate;`\n\n...\n\n## 什么是 SELinux 布尔值 (Boolean)\n快速介绍\
    \ SELinux 布尔值。SELinux 布尔值是一种布尔标志，可以添加到一个或多个 SELinux 策略规则中以启用或禁用这些规则。\n\n### 什么是\
    \ SELinux 布尔值？\nSELinux 布尔值是一种布尔标志，可以添加到一个或多个 SELinux 策略规则中以启用或禁用这些规则。默认情况下，SELinux\
    \ 拥有一长串预定义的 SELinux 布尔值。你可以使用 `semanage boolean -l` 查看它们及其设置：\n`herong$ sudo semanage\
    \ boolean -l`\n\n| SELinux 布尔值 | 状态 | 描述 |\n| :--- | :--- | :--- |\n| abrt_anon_write\
    \ | off | 允许 abrt 写入 |\n| abrt_handle_event | off | 允许 abrt 处理事件 |\n| antivirus_scan_system\
    \ | off | 允许 扫描系统 |\n| antivirus_use_jit | off | 允许 antivirus 使用 jit |\n| auditadm_exec_content\
    \ | on | 允许 auditadm 执行内容 |\n| authlogin_radius | off | 允许 authlogin 使用 radius\
    \ |\n| authlogin_yubikey | off | 允许 authlogin 使用 yubikey |\n| boinc_execmem |\
    \ on | 允许 boinc 执行内存 |\n| ... | ... | ... |\n| httpd_can_network_connect | off\
    \ | 允许 httpd 连接网络 |\n\n...\n\n如果一个 SELinux 策略规则受 SELinux 布尔值控制，该布尔标志将列在规则的末尾。下面的策略规则表示，只有当\
    \ `httpd_can_network_connect` 布尔值为 True 时，`httpd_t` 进程才能对 `port_type:tcp_socket`\
    \ 类型执行 `name_connect`。\n`herong$ sesearch --allow --source httpd_t | grep 'httpd_can_network_connect\
    \ '`\n`allow httpd_t port_type:tcp_socket name_connect; [ httpd_can_network_connect\
    \ ]:True`\n\n多种方法管理 SELinux 布尔值设置：\n`semanage boolean -l`: 列出所有布尔值及其设置\n`getsebool\
    \ -a`: 列出所有布尔值及其设置\n`setsebool boolean_name on`: 开启指定的布尔值\n\n```\nsetsebool -P\
    \ abrt_anon_write on\n```\n\n"
- fmt: "\nTo turn on a given Boolean and save the change permanently\n`togglesebool`\
    \ `boolean_name`\n\nTo toggle a given Boolean\n\n# SELinux - Security-Enhanced\
    \ Linux\n\nProvides quick introductions of commonly used tools related SELinux.\
    \ There are several important tools that allows to manage the SELinux system:\n\
    \n1. `semanage` - SELinux Policy Management tool.\n```\nherong$ semanage -h\n\
    ```\n`semanage` is used to configure certain elements of SELinux policy without\
    \ requiring modification to or recompilation from policy source.\n\npositional\
    \ arguments:\n- `import`: Import local customizations\n- `export`: Output local\
    \ customizations\n- `login`: Manage login mappings between linux users and SELinux\
    \ Users\n- `user`: Manage SELinux Users (Roles and levels for an SELinux User)\n\
    - `port`: Manage network port type definitions\n- `ibpkey`: Manage infiniband\
    \ ibpkey type definitions\n- `ibendport`: Manage infiniband end port type definitions\n\
    - `interface`: Manage network interface type definitions\n- `module`: Manage SELinux\
    \ policy modules\n- `node`: Manage network node type definitions\n- `fcontext`:\
    \ Manage file context mapping definitions\n- `boolean`: Manage booleans to selectively\
    \ enable functionality\n- `permissive`: Manage process type enforcement mode\n\
    - `dontaudit`: Disable/Enable dontaudit rules in policy\n\n2. `seinfo` - SELinux\
    \ policy information tool. `seinfo` is not included in the default CentOS 8 system.\
    \ You need to install the `setools-console` package to use it.\n```\nherong$ seinfo\n\
    bash: seinfo: command not found...\nInstall package 'setools-console' to provide\
    \ command 'seinfo'? [N/y] n\nherong$ sudo dnf install setools-console\n...\nInstalled:\n\
    \  setools-console-4.2.2-2.el8.x86_64\nherong$ seinfo -h\n...\n```\nComponent\
    \ Queries:\n- `-a [ATTR], --attribute [ATTR]`: Print type attributes.\n- `-b [BOOL],\
    \ --bool [BOOL]`: Print Booleans.\n- `-c [CLASS], --class [CLASS]`: Print object\
    \ classes.\n- `-r [ROLE], --role [ROLE]`: Print roles.\n- `-t [TYPE], --type [TYPE]`:\
    \ Print types.\n- `-u [USER], --user [USER]`: Print users.\n\n3. `sesearch` -\
    \ SELinux policy rule search tool. `sesearch` is not included in the default CentOS\
    \ 8 system. You need to install the `setools-console` package to use it.\n```\n\
    herong$ sesearch -h\nusage: sesearch [-h] [--version] [-v] [--debug] [-A] [--allow]\
    \ [--allowxperm]\n    [--auditallow] [--auditallowxperm] [--dontaudit]\n    [--dontauditxperm]\
    \ [--neverallow] [--neverallowxperm] [-T]\n    [--type_change] [--type_member]\
    \ [--role_allow] [--role_trans]\n    [--range_trans] [-s SOURCE] [-t TARGET] [-c\
    \ TCLASS] [-p PERMS]\n    [-x XPERMS] [-D DEFAULT] [-b BOOL] [-eb] [-ep] [-ex]\
    \ [-ds]\n    [-dt] [-rs] [-rt] [-rc] [-rd] [-rb]\n    [policy]\n```\n\n4. `newrole`\
    \ - Run a shell with a new SELinux role. `newrole` is not included in the default\
    \ CentOS 8 system. You need to install the `policycoreutils-newrole` package to\
    \ use it.\n```\nherong$ newrole\nbash: newrole: command not found...\nInstall\
    \ package 'policycoreutils-newrole' to provide command 'newrole'? [N/y]\nherong$\
    \ sudo dnf install policycoreutils-newrole\n...\npolicycoreutils-newrole-2.9-9.el8.x86_64\n\
    Installed:\n  policycoreutils-newrole-2.9-9.el8.x86_64\nherong$ newrole\nUSAGE:\
    \ newrole -r role ] -t type ] -l level ] -p ] -V ] [ args ]\n```\n\n5. `fixfiles`\
    \ - Fix SELinux security contexts.\n```\nherong$ man fixfiles\nfixfiles [-v] [-f]\
    \ relabel\nfixfiles [-v] [-F] { check | restore } dir/file\nfixfiles [-v] [-F]\
    \ -B { check | restore }\nfixfiles [-v] [-F] -C PREVIOUS_CONTEXT { check | restore\
    \ } onboot\n```\n\n# SELinux Error Messages\n\nProvides a quick introduction on\
    \ SELinux error, which are recorded in the `/var/log/messages` file. You can get\
    \ more detailed information about the error and some suggested solutions. By default,\
    \ SELinux error messages are logged in the `/var/log/messages` file. Here are\
    \ some examples of SELinux error messages found on my CentOS 8 computer.\n\nphp-fpm\
    \ failed to run a PHP script due to incorrect SELinux type. The error message\
    \ suggest you to run `sealert` to get more detailed information.\n```\nherong$\
    \ sudo cat /var/log/messages | grep SELinux | more\n...\nSELinux is preventing\
    \ /usr/sbin/php-fpm from read access on the file test.php. For complete SELinux\
    \ messages run:\nsealert -l 06a19151-14d3-4930-e18-4c0f0696350\nherong$ sealert\
    \ -l 06a19151-14d3-4930-e18-4c0f0696350\nSELinux is preventing /usr/sbin/php-fpm\
    \ from read access on file test.php.\n***** Plugin catchall_boolean (89.3 confidence)\
    \ suggests *****\nIf you want to allow httpd to read user content you must tell\
    \ SELinux about this by enabling the 'httpd_read_user_content' boolean.\nDo\n\
    setse -P httpd_read_user_content 1\n```\nAdditional Information:\n- Source Context:\
    \ `system_u:system_r:httpd_t:s0`\n- Target Context: `unconfined_u:object_r:user_home_t:s0`\n\
    - Target Objects: `test.php [ file ]`\n- Source: `php-fpm`\n- Source Path: `/usr/sbin/php-fpm`\n\
    - Host: `localhost.localdomain`\n- Source RPM Packages:\n- Target RPM Packages:\n\
    - Policy RPM: `selinux-policy-3.14.3-20.el8.noarch`\n- SELinux Enabled: `True`\n\
    - Policy Type: `targeted`\n- Enforcing Mode: `Enforcing`\n\nhttpd/php-fpm failed\
    \ to run a PHP script file that tries to run the `curl` interface. The suggested\
    \ solution is pretty accurate.\n```\nherong$ sudo cat /var/log/messages | grep\
    \ SELinux | more\n...\nsetroubleshoot[24609]: SELinux is preventing /usr/bin/curl\
    \ from name_connect access on the tcp_socket. For complete SELinux messages run:\n\
    sealert -l 06a19151-14d3-4930-e18-4c0f0696350\nherong$ sealert -l 06a19151-14d3-4930-e18-4c0f0696350\n\
    SELinux is preventing /usr/bin/curl from name_connect access on the tcp_socket.\n\
    ***** Plugin catchall_boolean (89.3 confidence) suggests *****\nIf you want to\
    \ allow httpd to read user content you must tell SELinux about this by enabling\
    \ the 'httpd_read_user_content' boolean.\nDo\nsetse -P httpd_read_user_content\
    \ 1\n```\nAdditional Information:\n- Source Context: `system_u:system_r:httpd_t:s0`\n\
    - Target Context: `unconfined_u:object_r:user_home_t:s0`\n- Target Objects: `test.php\
    \ [ file ]`\n- Source: `php-fpm`\n- Source Path: `/usr/sbin/php-fpm`\n- Host:\
    \ `localhost.localdomain`\n\n# SELinux Related Terminologies\n\nProvides a list\
    \ of commonly used terminologies related SELinux. Here are some commonly used\
    \ terminologies related to SELinux:\n\n- **ACL (Access Control List)**: A list\
    \ of permissions associated with an object. For example, `rw-rw-r--` is an ACL\
    \ associated with a file: `-rw-rw-r-- . 1 herong herong 0 Sep 12 04:50 myfile`.\
    \ It says \"herong\" as the owner can read and write, users in \"herong\" group\
    \ can read and write, and other users can read.\n\n- **AVC (Access Vector Vache)**:\
    \ A cache where subject and object permissions are stored for fast access.\n\n\
    - **DAC (Discretionary Access Control)**: A type of permission system that is\
    \ based on ACL (Access Control List) associated with each and every objects. Linux\
    \ default security used DAC.\n"
