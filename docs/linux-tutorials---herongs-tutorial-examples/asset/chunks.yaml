    herong$ pip3 install --upgrade pip\n```\n\n### 6. Run \"pip3\" with the \"python3\
    \ -m pip\" command. This works because \"pip\" is actually a Python3 module.\n\
    ```bash\nherong$ python3 -m pip help\nUsage:\n  /usr/bin/python3 -m pip <command>\
    \ [options]\n  ...\n```\n\n---\n\n# Install MySQL Connector/Python on CentOS\n\
    Provides a tutorial example on how to install MySQL Connector/Python on CentOS\
    \ systems. If you want to access MySQL database server from Python scripts, you\
    \ can follow what I did on my CentOS 8 computer to install the MySQL Connector/Python\
    \ module.\n\n### 1. Install MySQL Connector/Python with \"pip3\" command.\n```bash\n\
    herong$ sudo pip3 install mysql-connector-python\nCollecting mysql-connector-python\n\
    \  Downloading https://files.pythonhosted.org/packages/d8/29/...\nCollecting dnspython==16.0\
    \ (from mysql-connector-python)\n  Downloading https://files.pythonhosted.org/packages/ec/d3/...\n\
    Collecting protobuf==3.6.1 (from mysql-connector-python)\n  Downloading https://files.pythonhosted.org/packages/c2/f9/...\n\
