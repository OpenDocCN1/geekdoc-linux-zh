    \   0      8     2  0   60 -20 -      0 -       ?      00:00:00 mm_percpu_wq\n\
    1 S     0      9     2  0   80   0 -      0 -       ?      00:00:00 ksoftirqd/0\n\
    1 I     0     10     2  0   80   0 -      0 -       ?      00:02:42 rcu_sched\n\
    ...\n```\n\n\n\n [Linux Tutorials - Herong's Tutorial Examples](#text00002.html_a2N5)\
    \ ∟ [Process Management](#text00007.html_a2NA)\n\n## \"jobs\" - Manage Background\
    \ Jobs\n\nProvides a tutorial example on how to use `jobs` command to display\
    \ background jobs, which are processes with input detached the keyboard. You can\
    \ start a background job by adding the `ampersand` sign to the end of the command.\n\
    \n### What Is Background Job?\n\nA background job is a process with its input\
    \ being detached from the keyboard device. Its output may still be attached to\
    \ the screen.\n\nA foreground job is a process with its input being attached to\
    \ the keyboard device. When you enter a command at the shell prompt to start a\
    \ process, it will be started as a foreground job by default. The keyboard will\
    \ be occupied by this foreground job until it is terminated. So you can only executed\
    \ 1 process job at any time.\n\nIf you want start a process as a background job\
    \ to keep the keyboard free you use the following 2 options:\n\n1. Adding `&`\
    \ at the end of the command line. This will start the process as a background\
    \ job immediately. For example the following command starts a process (ID=40120)\
    \ as a background job (#=1).\n```bash\nherong$ sleep 100000 &\n[1] 40120\n```\n\
    \n2. Press `ctrl-z` during the execution of a foreground job. This will stop the\
    \ foreground job and make it as a background job and keep it as stopped.\n```bash\n\
    herong$ sleep 50000\nctrl-z\n[2]+ Stopped\n```\n\nIf you want see a list of your\
    \ own background jobs you can use the `jobs` command:\n```bash\nherong$ jobs\n\
    [1]- Running  sleep 10000 &\n[2]+ Stopped  sleep 50000\n```\n\nIf you want to\
    \ resume a stopped job in the background you can use the `bg` command:\n```bash\n\
    herong$ bg 2\n[2]+ sleep 50000 &\nherong$ jobs\n[1]- Running  sleep 10000 &\n\
    [2]+ Running  sleep 50000 &\n```\n\nIf you want to bring a background job to the\
    \ foreground you can use the `fg` command:\n```bash\nherong$ fg 2\nsleep 100000\n\
    ```\n\nOne nice about running a command in the background is that it will to run\
    \ even if your shell session gets disconnected/closed.\n\n [Linux Tutorials -\
    \ Herong's Tutorial Examples](#text00002.html_a2N5) ∟ [Process Management](#text00007.html_a2NA)\n\
    \n## \"tmux\" - Terminal Multiplexer\n\nProvides a tutorial example on how to\
    \ use `tmux` tool to manage multiple shells as windows and panes in a single terminal.\
    \ `tmux` automatically keeps all shells running when the terminal is disconnected.\n\
    \n### What Is \"tmux\"?\n\n`tmux` is a terminal multiplexer. It lets you switch\
    \ easily between several programs in one terminal, detach them (they keep running\
    \ in the background) and reattach them to a different terminal. Here is the official\
    \ description of `tmux` from its manual page:\n\n`tmux` is a terminal multiplexer:\
    \ it enables a number of terminals to be created, accessed, and controlled from\
    \ a single screen. `tmux` may be detached from a screen and continue running in\
    \ the background, then later reattached.\n\nWhen `tmux` is started it creates\
    \ a new session with a single window and displays it on screen. A status line\
    \ at the bottom of the screen shows information on the current session and is\
    \ used to enter interactive commands.\n\nA session is a single collection of pseudo\
    \ terminals under the management of `tmux`. Each session has one or more windows\
    \ linked to it. A window occupies the entire screen and may be split into rectangular\
    \ panes, each of which is a separate pseudo terminal (the `pty(4)` manual page\
    \ documents the technical details of pseudo terminals). Any number of `tmux` instances\
    \ may connect to the same session, and any number of windows may be present in\
    \ the same session.\n\nOnce all sessions are killed, `tmux` exits. Each session\
    \ is persistent and will survive accidental disconnection (such as `ssh(1)` connection\
    \ timeout) or intentional detaching (with the `C-b d` key strokes). `tmux` may\
    \ be reattached using:\n```bash\n$ tmux attach\n```\n\nIn `tmux`, a session is\
    \ displayed on screen by a client and all sessions are managed by a single server.\
    \ The server and each client are separate processes which communicate through\
    \ a socket in `/tmp`.\n\n`tmux` is a nice tool that reduces the number of remote\
    \ `ssh` sessions, saves time on trying to push processes to the background manually\
    \ to prevent be killed by connection timeouts. Here is what I tried on my CentOS\
    \ computer.\n\n1. Install `tmux`:\n```bash\nherong$ sudo dnf install tmux\nInstalled:\n\
    tmux-2.7-1.el8.x86_64\n```\n\n2. Use `tmux` command to start a new `tmux` session,\
    \ which starts a shell as the first pane in the first window of the `tmux` session.\n\
    ```bash\nherong$ tmux\n(in a child shell in \"tmux\")\nherong$ exit\n(back to\
    \ the original shell)\n```\n\n3. Use the following hot keys to control its windows\
    \ and tabs:\n- `ctrl-b, %`: split the screen in half from left to right\n- `ctrl-b,\
    \ \"`: split the screen in half from top to bottom\n- `ctrl-b, array_key`: switch\
    \ to the pane in different directions\n- `ctrl-b, c`: create a new window\n- `ctrl-b,\
    \ 0|1|...`: switch to a given window\n- `ctrl-b, d`: detach from tmux, leaving\
    \ it running in the background\n\nIf you want to see a list of your own background\
    \ jobs you can use the `jobs` command:\n```bash\nherong$ jobs\n```\n\nIf you want\
    \ to resume a stopped job in the background you can use the `bg` command:\n```bash\n\
    herong$ bg 2\n```\n\nIf you want to bring a background job to the foreground you\
    \ can use the `fg` command:\n```bash\nherong$ fg 2\n```\n\nIf you want to reattach\
    \ a detached or disconnected session use `tmux ls|attach`:\n```bash\nherong$ tmux\
    \ ls\n0: 1 windows\n$ tmux attach\n(tmux is displayed again)\n```\n\n [Linux Tutorials\
    \ - Herong's Tutorial Examples](#text00002.html_a2N5) ∟ [Process Management](#text00007.html_a2NA)\n\
    \n## Linux File Systems\n\nProvides introductions and tutorial on Linux file systems.\
    \ Topics include `df` to see free spaces of mounted file systems; `mount` to connect\
    \ to USB drive file systems; `fdisk` to list partitions and file system types;\
    \ `dd` to copy data and test I/O speed; `hdparm` to manage hard disk parameters.\n\
    \n- [`df` - Display Free Space of File System](#text00012.html_a2NF)\n- [`mount`\
    \ - Mount USB Drive as File System](#text00013.html_a2NG)\n- [`fdisk` - Format\
    \ Disk Partitions](#text00014.html_a2NH)\n- [`dd` - Copy Data from/to Storage\
    \ Devices](#text00015.html_a2NJ)\n- [`Use `dd` Command to Test I/O Speed](#text00016.html_a2NK)\n\
    - [`hdparm` - Hard Disk Parameters](#text00017.html_a2NM)\n- [`du` - Display Disk\
    \ Usage of Directories](#text00018.html_a2NN)\n- [`Mount Windows File System](#text00019.html_a2NP)\n\
    - [`W95 Ext'd (LBA) Partition](#text00020.html_a2NR)\n- [`File System Types, IDs\
    \ and Formats](#text00021.html_a2NS)\n\n### Takeaways:\n\n* `df` command can be\
    \ used to display free spaces of mounted file systems.\n* `mount` command can\
    \ be used to bring file system partitions online. `umount` command can be used\
    \ to bring them offline.\n* `fdisk -l` command can be used to list file system\
    \ partitions and their format types of a given storage device.\n* `dd` command\
    \ can be used to copy data as continuous blocks of bytes from one device to another\
    \ bypassing file system structures.\n* `hdparm` command can be used to gather\
    \ hard disk identification information and get/set its individual parameters.\n"
