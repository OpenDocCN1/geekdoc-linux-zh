    \ -el`\n\n```text\nF S    UID  PID  PPID  C PRI  NI ADDR SZ WCHAN  TTY       TIME\
    \ CMD\n4 S     0      1     0  0   80   0 - 61833 -       ?      00:03:09 systemd\n\
    1 S     0      2     0  0   80   0 -      0 -       ?      00:00:01 kthreadd\n\
    1 I     0      3     2  0   60 -20 -      0 -       ?      00:00:00 rcu_gp\n1\
    \ I     0      4     2  0   60 -20 -      0 -       ?      00:00:00 rcu_par_gp\n\
    1 I     0      8     2  0   60 -20 -      0 -       ?      00:00:00 mm_percpu_wq\n\
    1 S     0      9     2  0   80   0 -      0 -       ?      00:00:00 ksoftirqd/0\n\
    1 I     0     10     2  0   80   0 -      0 -       ?      00:02:42 rcu_sched\n\
    ...\n```\n\n\n\n\n\n\n\n Linux 教程 - Herong 的教程示例 ∟ 进程管理\n\n## \"jobs\" - 管理后台作业\n\
    \n提供了一个关于如何使用 `jobs` 命令显示后台作业的教程示例，后台作业是指输入与键盘分离的进程。你可以通过在命令末尾添加取符符号（`&`）来启动后台作业。\n\
    \n### 什么是后台作业？\n\n后台作业是指其输入与键盘设备分离的进程。它的输出可能仍然连接到屏幕。\n\n前台作业是指其输入与键盘设备连接的进程。当你在\
    \ shell 提示符输入命令启动进程时，它将默认作为前台作业启动。键盘会被该前台作业占用直到它被终止。因此，你任何时候只能执行 1 个进程作业。\n\n\
    如果你想将进程作为后台作业启动以释放键盘，可以使用以下 2 选项：\n\n1.  在命令行行末尾添加 `&`。这将立即将该进程作为后台作业启动。例如，以下命令启动一个进程（ID=40120）作为后台作业（#=1）。\n\
    ```bash\nherong$ sleep 100000 &\n[1] 40120\n```\n\n2.  在执行前台作业期间按下 `ctrl-z`。这将停止前台作业并将其变为后台作业，同时保持其停止状态。\n\
    ```bash\nherong$ sleep 50000\nctrl-z\n[2]+ Stopped\n```\n\n如果你想查看你自己的后台作业列表，可以使用\
    \ `jobs` 命令：\n```bash\nherong$ jobs\n[1]- Running  sleep 10000 &\n[2]+ Stopped\
    \  sleep 50000\n```\n\n如果你想在后台恢复已停止的作业，可以使用 `bg` 命令：\n```bash\nherong$ bg 2\n\
    [2]+ sleep 50000 &\nherong$ jobs\n[1]- Running  sleep 10000 &\n[2]+ Running  sleep\
    \ 50000 &\n```\n\n如果你想将后台作业带回前台，可以使用 `fg` 命令：\n```bash\nherong$ fg 2\nsleep 100000\n\
    ```\n\n在后台运行命令的一个好点处是，即使你的 shell 会话断开/关闭，它也会继续运行。\n\n Linux 教程 - Herong 的教程示例\
    \ ∟ 进程管理\n\n## \"tmux\" - 终端复用器\n\n提供了一个关于如何使用 `tmux` 工具在单个终端中将多个 shell 作为窗口和面板（panes）管理的教程示例。`tmux`\
    \ 在终端断开时会自动保持所有 shell 运行。\n\n### 什么是 \"tmux\"？\n\n`tmux` 是一个终端复用器。它允许你在一个终端中的多个程序之间轻松切换，将它们分离（detach）（它们会在后台继续运行）并重新连接（attach）到不同的终端。以下是\
    \ `tmux` 帮助页中的官方描述：\n\n`tmux` 是一个终端复用器：它允许从单个屏幕创建、访问和控制多个终端。`tmux` 可以从屏幕中分离并继续在后台运行，稍后重新连接。\n\
    \n当启动 `tmux` 时代，它会创建一个带有单个窗口的新会话并将其显示在屏幕上。屏幕底部的状态行显示当前会话的信息，并用于输入交互命令。\n\n会话是\
    \ `tmux` 管理下的单个伪终端集合。每个会话都有一个或多个与其链接的窗口。窗口占据整个屏幕，并可能被分成矩形面板，每个面板都是一个独立的伪终端（`pty(4)`\
    \ 手页文档了伪终端的节点细节）。任意数量的 `tmux` 实例都可以连接到同一个会话，会话中也可以存在任意数量的窗口。\n\n一旦所有会话都被杀死，`tmux`\
    \ 退出。每个会话都是持久的，能够防止意外断开（例如 `ssh(1)` 连接超时）或故意的分离（使用 `C-b d` 组合键）。可以使用以下命令重新连接 `tmux`：\n\
    ```bash\n$ tmux attach\n```\n\n在 `tmux` 中，会话由客户端显示在屏幕上，所有会话都由单个服务器管理。服务器和每个客户端是独立的进程，通过\
    \ `/tmp` 中的 socket 进行通信。\n\n`tmux` 是一个非常用的工具，它减少了远程 `ssh` 会话的数量，并节省了手动将进程推到后台以防止因连接超时而被杀死的时间。以下是我在\
    \ CentOS 计算机上尝试的尝试。\n\n1.  安装 `tmux`：\n```bash\nherong$ sudo dnf install tmux\n\
    Installed:\ntmux-2.7-1.el8.x86_64\n```\n\n2.  使用 `tmux` 命令启动一个新的 `tmux` 会话，这会在\
    \ `tmux` 会话的第一个窗口的第一个面板启动一个 shell。\n```bash\nherong$ tmux\n(in a child shell in\
    \ \"tmux\")\nherong$ exit\n(back to the original shell)\n```\n\n3.  使用以下热键控制其窗口和标签：\n\
    - `ctrl-b, %`：从左到右将屏幕对分为二半\n- `ctrl-b, \"`：从上到下将屏幕对分为二半\n- `ctrl-b, 方向方向键`：切换到不同方向的面板\n\
    - `ctrl-b, c`：创建一个新窗口\n- `ctrl-b, 0|1|...`：切换到指定的窗口\n- `ctrl-b, d`：从 tmux 分离，让其在后台运行\n\
    \n如果你想查看你自己的后台作业列表，可以使用 `jobs` 命令：\n```bash\nherong$ jobs\n```\n\n如果你想在后台恢复已停止的作业，可以使用\
    \ `bg` 命令：\n```bash\nherong$ bg 2\n```\n\n如果你想将后台作业带回前台，可以使用 `fg` 命令：\n```bash\n\
    herong$ fg 2\n```\n\n如果你想重新连接已分离或断开的会话，使用 `tmux ls|attach`：\n```bash\nherong$\
    \ tmux ls\n0: 1 windows\n$ tmux attach\n(tmux is displayed again)\n```\n\n Linux\
    \ 教程 - Herong 的教程示例 ∟ 进程管理\n\n## Linux 文件系统\n\n提供关于 Linux 文件系统的介绍和教程。主题包括使用 `df`\
    \ 查看已挂载文件系统的剩余空间；`mount` 连接 USB 驱动器文件系统；`fdisk` 列出分区和文件系统类型；`dd` 复制数据并测试 I/O 速度；`hdparm`\
    \ 用于管理硬盘参数。\n\n- `df` - 显示文件系统的剩余空间\n- `mount` - 挂载 USB 驱动器为文件系统\n- `fdisk` -\
    \ 格式化分区\n- `dd` - 从到存储设备复制数据\n- `使用 `dd` 命令测试 I/O 速度\n- `hdparm` - 硬盘参数\n- `du`\
    \ - 显示目录的磁盘占用\n- `挂载 Windows 文件系统\n- `W95 Ext'd (LBA) 分区\n- `文件系统类型、ID 和格式化\n\n\
    ### 知识点总结：\n\n* `df` 命令用于显示已挂载文件系统的剩余空间。\n* `mount` 命令用于将文件系统分区上线。`umount` 命令用于将其离线。\n\
    * `fdisk -l` 命令用于列出给定存储设备的分区及其格式类型。\n* `dd` 命令用于以连续字节块的形式从一个设备复制到另一个设备，绕过文件系统结构。\n\
    * `hdparm` 命令用于收集硬盘识别信息并获取/设置其单个参数。\n\n"
