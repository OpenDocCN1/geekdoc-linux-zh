    \ 选项或 `CPATH` 环境变量是在向 GCC 默认列表添加更多路径，以搜索包含头文件。\n\n## \"g++ -l...\" 链接库文件\n\n提供了一个关于如何使用\
    \ `g++ -static` 和 `g++ -l...` 选项将你的程序与静态或动态库文件链接的教程示例。GCC C/C++ 编译器支持 2 类型的库文件：\n\
    \n1. **静态库文件 (Static Library Files)**：静态库文件也称为存档文件（Archive files），在 Linux 系统上具有\
    \ `.a` 后缀。当你将程序与静态库文件链接时，程序中引用的所有对象都将被验证并复制到最终执行文件中。这使得可执行文件大得多。但它让执行变得更容易，因为执行时不再需要静态库文件。\n\
    2. **动态库文件 (Dynamic Library Files)**：动态库文件也称为共享对象文件（Shared Object files），在 Linux\
    \ 系统上具有 `.so` 后缀。当你将程序与动态库文件链接时，程序中引用的所有对象将被验证但不会复制到最终执行文件中。这使得可执行文件小得多。但执行变得更困难，因为动态库文件需要与你的执行文件一起加载到\
    \ CPU。\n\nGCC C/C++ 编译器允许通过 `-static` 和 `-l...` 选项控制使用哪种库文件并指定库文件。注意，实际的库名是从 `-l...`\
    \ 选项中指定的带有 `lib` 前缀和 `.a` 或 `.so` 后缀计算出的。\n\n示例 1 - 以下命令链接了当前目录下的 2 个库文件，`libabc.a`\
    \ 和 `libxyz.a`：\n```bash\nherong$ g++ -static -labc -lxyz myProgram.cpp\n```\n\
    \n示例 2 - 以下命令链接了当前目录下的 2 个库文件，`libabc.so` 和 `libxyz.so`：\n```bash\nherong$ g++\
    \ -labc -lxyz myProgram.cpp\n```\n\n## \"g++ -c\" 和 \"ar cs\" 构建静态库\n\n提供了一个关于如何使用\
    \ `g++ -c` 和 `ar cs` 命令在 Linux 系统上编译代码并构建库文件的教程示例。如果你想构建自己的库文件，你需要分两个步骤完成：\n*\
    \ 使用 `g++ -c` 编译源代码并生成对象代码文件。\n* 使用 `ar cs` 从对象代码文件构建存档文件作为库文件。\n\n以下是我构建第一个静态库文件\
    \ `libMyStatic.a` 的操作：\n\n1. 创建一个源代码文件，`MyStatic.cpp`：\n```cpp\nherong$ cat MyStatic.cpp\n\
    #include \"iostream\"\nvoid myStaticFunc() {\n  std::cout << \"RunningStaticFunc()...\"\
    \ << std::endl;\n}\n```\n\n2. 将源代码文件 `MyStatic.cpp` 编译为对象代码文件 `MyStatic.o`：\n\
    ```bash\nherong$ g++ -c MyStatic.cpp\nherong$ ls -l MyStatic.*\n-rw-rw-r-- 1 herong\
    \ 17 Apr 10 23:50 MyStatic.cpp\n-rw-rw-r-- 1 herong 2744 Apr 10 23:52 MyStatic.o\n\
    ```\n\n3. 从对象代码文件 `MyStatic.o` 创建静态库文件 `libMyStatic.a`：\n```bash\nherong$ ar cs\
    \ libMyStatic.a MyStatic.o\nherong$ ls -l libMyStatic.*\n-rw-rw-r-- 1 herong 2898\
    \ Apr 10 23:54 libMyStatic.a\n-rw-rw-r-- 1 herong 17 Apr 10 23:50 MyStatic.cpp\n\
    -rw-rw-r-- 1 herong 2744 Apr 10 23:52 MyStatic.o\nherong$ ar t libMyStatic.a MyStatic.o\n\
    ```\n\n4. 创建一个调用程序 `MyStaticTest.cpp`：\n```cpp\nherong$ cat MyStaticTest.cpp\n\
    #include \"iostream\"\nextern void myStaticFunc();\nint main() {\n  std::cout\
    \ << \"CallingStaticFunc()...\" << std::endl;\n  myStaticFunc();\n}\n```\n\n5.\
    \ 直接用 `MyStatic.o` 链接 `MyStaticTest.cpp` 以确认程序正常：\n```bash\nherong$ g++ MyStatic.o\
    \ MyStaticTest.cpp\nherong$ ./a.out\nCallingStaticFunc()...\nRunningStaticFunc()...\n\
    ```\n\n6. 在不提供路径的情况下将 `MyStaticTest.cpp` 链接到 `libMyStatic.a`：\n```bash\nherong$\
    \ g++ -lMyStatic MyStaticTest.cpp\n/usr/bin/ld: cannot find -lMyStatic\n```\n\n\
    7. 使用 `g++ -L ...` 选项指定 `libMyStatic.a`。我也可以使用 `LIBRARY_PATH` 环境变量代替 `g++ -L ...`：\n\
    ```bash\nherong$ g++ -L . -lMyStatic MyStaticTest.cpp\n/tmp/cciFWV0h.o: In function\
    \ `main`:\nMyStaticTest.cpp:(.text+0x21): undefined reference to `myStaticFunc()`\n\
    ```\n\n8. 强制 GCC 进行静态库链接：\n```bash\nherong$ g++ -static -L . -lMyStatic MyStaticTest.cpp\n\
    /usr/bin/ld: cannot find -lstdc++\n/usr/bin/ld: cannot find -lm\n/usr/bin/ld:\
    \ cannot find -lc\ncollect2: error: ld returned 1 exit status\n```\n看来我仍然缺少让 GCC\
    \ 处理静态库文件的方法。顺便说，你可以使用 `LIBRARY_PATH` 环境变量来指定静态库路径，而不是使用 `g++ -L ...` 选项。\n\n\
    ## \"g++ -shared\" 构建动态库\n\n提供了一个关于如何使用 `g++ -shared` 命令在 Linux 系统上编译代码并构建库文件的教程示例。如果你想构建自己的动态库文件，你需要使用\
    \ `g++ -shared` 命令。\n\n以下是我构建第一个动态库 `libMyDynamic.so` 的操作：\n\n1. 创建一个源代码文件，`MyDynamic.cpp`：\n\
    ```cpp\nherong$ cat MyDynamic.cpp\n#include \"iostream\"\nvoid myDynamicFunc()\
    \ {\n```\n\n"
- fmt: "\n```cpp\nstd::cout << \"Running myDynamicFunc()...\" << std::endl;\n}\n```\n\
    \n### 2. Compile source code file, `MyDynamic.cpp`, into a dynamic library file:\n\
    ```bash\nherong$ g++ -shared -o libMyDynamic.so MyDynamic.cpp\n```\n```\n/usr/bin/ld:\
    \ /tmp/ccG05g0J.o: relocation R_X86_64_32 against `.rodata' can not be used when\
