    \              x86_64\n  tzdata-java-2019c-1.el8             noarch\n  xorg-x11-fonts-Type1-7.5-19.el8\
    \      noarch\n  lksctp-tools-1.0.18-3.el8           x86_64\nComplete!\n```\n\n\
    4. 验证 OpenJDK 11 JRE（Java 运行环境）：\n\n```bash\nherong$ java -version\nopenjdk version\
    \ \"11.0.6\" 2020-01-14 LTS\nOpenJDK Runtime Environment 18.9 (build 11.0.6+10-LTS)\n\
    OpenJDK 64-Bit VM 18.9 (build 11.0.6+10-LTS), mixed mode, sharing\n```\n太酷了！我已经在\
    \ CentOS 上无问题地安装了 OpenJDK 11 JRE。\n\n## 在 CentOS 上安装和管理 Perl 包\n\n提供了一个教程示例，介绍如何使用\
    \ `dnf/yum` 作为包管理器在 CentOS 8 系统上安装 Perl 5.26。Perl（实用提取和报告语言）脚本引擎默认作为 CentOS 8\
    \ 系统的一部分包含。你不需要手动安装它。但你仍然可以使用 `dnf` 包管理器安装额外的模块。\n\n1. 以具有管理员权限的用户 \"herong\"\
    \ 登录。\n2. 当前安装的 Perl 版本：\n\n```bash\nherong$ perl -v\nThis is perl 5, version\
    \ 26, subversion 3 (v5.26.3) built for x86_64-linux-thread-multi (with 51 registered\
    \ patches, ...)\n...\n```\n\n3. 运行 `dnf info perl` 查看 Perl 包信息：\n\n```bash\nherong$\
    \ dnf info perl\nAvailable Packages\nName          : perl\nEpoch        : 4\n\
    Version      : 5.26.3\nRelease      : 416.el8\nArchitecture : x86_64\nSize   \
    \      : 72 k\nSource       : perl-5.26.3-416.el8.src.rpm\nRepository   : AppStream\n\
    Summary      : Practical Extraction and Report Language\nURL          : http://www.perl.org/\n\
    License      : GPL+ or Artistic\nDescription  : Perl 是一种高级编程语言，源自 C、sed、awk 和\
    \ shell 脚本编写。Perl 擅长处理进程和文件，特别擅长处理文本。Perl 的特点是实用和高效。虽然它被用于许多不同的任务，但 Perl 最常见的应用是系统管理工具和\
    \ Web 编程。这是一个元包，包含了从 perl.org 上游 tar 包中找到的所有 Perl 碎片和核心模块。如果你只需要某个特定功能，可以安装特定的包。例如，要使用\
    \ `/usr/bin/perl` 处理 Perl 脚本，请安装 `perl-interpreter` 包。有关 Perl 包拆分的更多详细信息，请参见 `perl-interpreter`。\n\
    ```\n\n4. 安装 `perl` 包：\n\n```bash\nherong$ sudo dnf install perl\nInstalled:\n\
    \  perl-4:5.26.3-416.el8               x86_64\n  perl-Encode-4:2.97-3.el8    \
    \   x86_64\n  perl-Env-1.04-395.el8               noarch\n  perl-DB-File-1.842-1.el8\
    \             x86_64\n  perl-Data-OptList-0.110-6.el8        noarch\n  perl-Data-Section-0.200007-3.el8\
    \      noarch\n  perl-Devel-PPPort-3.36-5.el8         x86_64\n  perl-Devel-Peek-1.26-416.el8\
    \         x86_64\n  perl-Devel-SelfStubber-1.06-416.el8   noarch\n  perl-Devel-Size-0.81-2.el8\
    \           x86_64\n  perl-Digest-SHA-1:6.02-1.el8        x86_64\n  perl-Encode-devel-4:2.97-3.el8\
    \      x86_64\n  perl-Config-Perl-V-0.30-1.el8        noarch\n  perl-CPAN-2.18-397.el8\
    \             noarch\n  perl-CPAN-Meta-2.150010-396.el8      noarch\n  perl-CPAN-Meta-Requirements-2.140-396.el8\
    \ noarch\n  perl-CPAN-Meta-YAML-0.018-397.el8    noarch\n  perl-Compress-Bzip2-2.26-6.el8\
    \        x86_64\n  perl-Compress-Raw-Bzip2-2.081-1.el8  x86_64\n  perl-Compress-Raw-Zlib-2.081-1.el8\
    \   x86_64\n  perl-Archive-Tar-1.30-2.el8        noarch\n  perl-Archive-Zip-1.60-5.el8\
    \   noarch\n  perl-Attribute-Handlers-0.99-416.el8   noarch\n  perl-B-Debug-1.26-416.el8\
    \         noarch\n```\n\n5. 验证已安装的 Perl 包：\n\n```bash\nherong$ perl -v\n```\n\n"
- fmt: "\nOk. The installed Perl package is the same version as the pre-installed\
    \ Perl in the CentOS system.\n\n[Linux Tutorials - Herong's Tutorial Examples](#text00002.html_a2N5)∟\
    \ [Software Package Manager on CentOS - DNF and YUM](#text00046.html_a2PH)∟ Install\
    \ \"git-core\" for GitHub Packages on CentOS\n\nProvides a tutorial example on\
    \ how to install `git-core` on CentOS 8 systems for managing GitHub packages.\
    \ If you are downloading packages from GitHub repository frequently, you should\
    \ install `git` tools on your Linux computer. There are a number of `git` tools\
    \ available. But `git-core` with minimal functionality and dependencies is good\
    \ enough for beginners.\n\n1\\. Run `dnf info git-core` to see package information:\n\
    ```bash\nherong$ sudo dnf info git-core\n```\nName          : git-core\nVersion\
    \      : 2.18.4\nRelease      : 2.el8_2\nArchitecture : x86_64\nSize         :\
    \ 4.0 M\nSource       : git-2.18.4-2.el8_2.src.rpm\nRepository   : AppStream\n\
    Summary      : Core package of git with minimal functionality\nURL          :\
    \ https://git-scm.com/\nLicense      : GPLv2\nDescription  : Git is a fast, scalable,\
    \ distributed revision control system with an unusually rich command set that\
    \ provides both high-level operations and full access to internals. The git-core\
    \ rpm installs really the core tools with minimal dependencies. Install git package\
    \ for common set of tools. To install all git packages, including tools for integrating\
    \ with other SCMs, install the git-all meta-package.\n\n2\\. Install `git-core`:\n\
    ```bash\nherong$ sudo dnf install git-core\nInstalled:\n  git-core-2.18.4-2.el8_2.x86_64\n\
    ```\n```bash\nherong$ git version\ngit version 2.18.4\n```\n\n3\\. Try it to clone\
    \ the `git` package itself:\n```bash\nherong$ git clone https://github.com/git/git\n\
    Cloning into 'git'...\nremote: Enumerating objects: 291689, done.\nReceiving objects:\
    \   9% (26899/291689), ...\n```\n\n[Linux Tutorials - Herong's Tutorial Examples](#text00002.html_a2N5)∟\
    \ Running Apache Web Server (httpd) on Linux Systems](#text00052.html_a2PR) \n\
    \nProvides introductions and tutorial on Apache web server (`httpd`) on Linux\
    \ systems. Topics include installing Apache web server (`httpd`). [Verify Apache\
    \ Web Server \"httpd\"](#text00053.html_a2PS)\n\nTakeaways:\n* The Apache Web\
    \ server, `httpd`, is included as part of the CentOS 8 system by default.\n\n\
    [Linux Tutorials - Herong's Tutorial Examples](#text00002.html_a2N5)∟ [Running\
    \ Apache Web Server (httpd) on Linux Systems](#text00052.html_a2PR)∟ Verify Apache\
    \ Web Server \"httpd\"\n\nProvides a tutorial example on how to manage Apache\
    \ Web Server `httpd` on CentOS 8 systems, and how to publish HTML documents and\
    \ PHP scripts.\n\n Apache Web server, `httpd`, is included as part of the CentOS\
    \ 8 system by default. You don't need to install it yourself. But you need to\
    \ follow this tutorial to learn how to manage it.\n\n1\\. Check Apache web server,\
    \ `httpd`, package status. I see `httpd 2.4` installed.\n```bash\nherong$ dnf\
    \ info httpd\n```\nInstalled Packages\nName          : httpd\nVersion      : 2.4.37\n\
    Release      : 16.module_el8.1.0+256+ae790463\nArchitecture : x86_64\nSize   \
    \      : 5.4 M\nSource       : httpd-2.4.37-16.module_el8.1.0+256+ae790463.src.rpm\n\
    Repository   : @System\nFrom repo      : AppStream\nSummary      : Apache HTTP\
    \ Server\nURL          : https://httpd.apache.org/\nLicense      : ASL 2.0\nDescription\
    \  : The Apache HTTP Server is a powerful, efficient, and extensible web server.\n\
    \n2\\. Check Apache Web server, `httpd`, running status:\n```bash\nherong$ sudo\
    \ systemctl status httpd\n```\n- httpd.service - The Apache HTTP Server\nLoaded:\
    \ loaded (/usr/lib/systemd/system/httpd.service; disabled; ...\nDrop-In: /usr/lib/systemd/system/httpd.service\n\
    Active: active (running) since Sat 2020-03-28 22:06:00 UTC; 3min ago\nMain PID:\
    \ 1907 (code)\nMemory: 24.4M\nTasks: 21 (limit: 4096)\nCGroup: /system.slice/httpd.service\n\
    Requests: 100/100; 1/1; 100/100;0\nMemory: 24.4M (24.4M, 30M)\n\n3\\. Check default\
    \ Web page:\n```bash\nherong$ curl http://localhost\n```\n```html\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta\
    \ charset=\"UTF-8\">\n<title>Apache HTTP Server</title>\n</head>\n<body>\n<h1>It\
    \ works!</h1>\n<p>This server is a to test page.</p>\n</body>\n</html>\n```\n"
