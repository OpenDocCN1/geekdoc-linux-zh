    ## Software Package Manager on CentOS - DNF and YUM


    Provides introductions and tutorial examples about Software Package Manager on
    CentOS systems. Topics include introductions of DNF and YUM.


    ### takeaways

    * `DNF`, also called `Dandified YUM`, is the next generation of `YUM` (Yellowdog
    Update Modified) software package manager for `RPM` (RedHat Package Manager) based
    Linux distributions.

    * `YUM` (Yellowdog Update Modified) is a software package manager for `RPM` (RedHat
    Package Manager) based Linux distributions.

    * You can use `dnf search keyword` to search for packages with a given keyword.

    * You can use `sudo dnf install package_name` to install a software package.


    ### usage

    ```bash

    herong$ dnf [options]

    ```


    ### List of Main Commands

    * `alias`: List or create aliases

    * `autoremove`: remove all unneeded packages that were originally installed as
    dependencies

    * `check`: check for problems in the package

    * `check-update`: check for available upgrades

    * `clean`: remove cached data

    * `deplist`: List package''s dependencies and what provide them

    * `distro-sync`: synchronize installed packages to the latest versions

    * `downgrade`: Downgrade a package

    * `group`: display, or use, the groups information

    * `help`: display a helpful usage message

    * `history`: display, or use, the transaction history

    * `info`: display details about a package or group of packages

    * `install`: install a package or packages on your system

    * `list`: list a package or groups of packages

    * `makecache`: generate the metadata cache

    * `mark`: mark or unmark installed packages as user.

    * `module`: Interact with Modules.

    * `provides`: find what package provides the given value

    * `reinstall`: reinstall a package

    * `remove`: remove a package or packages from your system

    * `repolist`: display the configured software repositories

    * `repoquery`: search for packages matching keyword

    * `repository-packages`: run commands on top of all packages in given repository

    * `search`: search package details for the given string

    * `shell`: run an interactive `DNF` shell

    * `swap`: run an interactive `dnf mod` for remove and install one `spec`

    * `updateinfo`: display advisories about packages

    * `upgrade`: upgrade a package or packages on your system

    * `upgrade-minimal`: upgrade, but only ''newest'' package match which fixes a
    problem that affects your system


    ### Example Comparison

    ```bash

    herong$ yum info make


    Available Packages

    Name:             make

    Epoch:            1

    Version:          4.2.1

    Release:          9.el8

    Architecture:     x86_64

    Size:             498 k

    Source:           make-4.2.1-9.el8.src.rpm

    Repository:       BaseOS

    Summary:          A GNU tool which simplifies the build process for users

    URL:              http://www.gnu.org/software/make/

    License:          GPLv3

    Description:      A GNU tool for controlling the generation of executables and
    other non-source files of a program from the program''s source files. Make allows
    users to build and install packages without any significant knowledge about the
    details of the build process. The details about how the program should be built
    are provided for make in the program''s makefile.


    herong$ dnf info make


    Available Packages

    Name:             make

    Epoch:            1

    Version:          4.2.1

    Release:          9.el8

    Architecture:     x86_64

    Size:             498 k

    ```

