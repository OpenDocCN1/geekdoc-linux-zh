    running PHP scripts on Linux systems. Topics include installing PHP engine on
    CentOS Linux systems; installing missing PHP modules; dumping PHP environment
    info; ''include'' statements.[Install and Manage PHP Packages on CentOS](#text00055.html_a2PU)["php
    -i" - Dump PHP Environment Information](#text00056.html_a2PV)[Install and Manage
    PHP Modules on CentOS](#text00057.html_a2PW)[Files Used in PHP "include" Statements](#text00058.html_a2PX)[Publish
    PHP Scripts on Apache Web Server](#text00059.html_a2PY)[Dump PHP/Apache Environment
    Information](#text00060.html_a2PZ)[Apache PHP file_put_contents() Permission Denied](#text00061.html_a2R0)[SELinux
    Security Context on /var/www/html](#text00062.html_a2R1)[Migrate Old Scripts to
    New PHP Release](#text00063.html_a2R2)Takeaways:


    *   Installing the PHP engine can be done using the "dnf install php" command
    on CentOS systems.


    *   Dumping PHP environment information can be done by using the "php -i" command.


    *   Missing PHP modules can be installed using additional "dnf install ..." commands.


    *   "include" statement with no file path searches 3 places for the included file.


    [Linux Tutorials - Herong''s Tutorial Examples](#text00002.html_a2N5)∟ [Running
    PHP Scripts on Linux Systems](#text00054.html_a2PT)∟ Install and Manage PHP Packages
    on CentOSProvides a tutorial example on how to install PHP 7.2 on CentOS 8 systems
    using ''dnf/yum'' as the package manager.If you want to run PHP scripts on CentOS
    Linux systems, you can follow what I did on my CentOS 8 computer:1\. Login as
    "herong", who has admin privileges.2\. Run "dnf search" to find available PHP
    packages. I see "php" and some PHP modules available for installation:herong$
    dnf search php'
