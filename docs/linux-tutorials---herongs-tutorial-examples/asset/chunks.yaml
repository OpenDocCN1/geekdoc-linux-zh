    herong$ sudo hdparm -r 1 /dev/sdb\n```\n\n```\n/dev/sdb:\n  setting readonly to\
    \ 1 (on)\n  readonly   =1 (on)\n```\n\n## 5. 验证 USB 驱动器的只读标记。\n\n我发现 USB 驱动器上的只读标记没有生效。（挂载了\
    \ USB 盘的唯一分区）\n\n```bash\nherong$ sudo mount /dev/sdb1 /media\nherong$ cd /media\n\
    (在 USB 驱动器上创建一个新文件)\nherong$ sudo touch test.txt\nherong$ ls -l test.txt\n-rwxr-xr-x.\
    \ 1 root root  0 Apr 1 05:38 test.txt\n```\n\n```bash\nherong$ sudo hdparm -r\
    \ /dev/sdb\n```\n\n```\n/dev/sdb:\n  readonly   =1 (on)\n```\n\n## \"du\" - 显示目录的磁盘使用情况\n\
    \n提供了一个教程示例，介绍如何在 Linux 系统上使用 `du` 命令显示任何给定目录的磁盘使用情况。要查看某个目录占用了多少空间，可以使用 `du`\
    \ 命令。以下是我 CentOS 8 计算机上 `du` 命令的一些示例输出。\n\n### 1. 使用 `du` 显示我主目录的磁盘使用情况：\n\n```bash\n\
    herong$ du ~\n```\n\n```\n124876  ./ftp/files\n124876  ./ftp\n124880  ./work/pytorch\n\
    0  ./work/r\n124884  ./work\n4  ./.cache/pip/http/6/8/c/5/e\n4  ./.cache/pip/http/6/8/c/5\n\
    4  ./.cache/pip/http/6/8/c\n...\n104  ./.cache/pip/http/c\n592  ./.cache/pip/http\n\
    596  ./.cache/pip\n0  ./.cache/matplotlib/tex.cache\n28  ./.cache/matplotlib\n\
    624  ./.cache\n0  ./.config/matplotlib\n0  ./.config\n4  ./.keras\n250420  .\n\
    ```\n\n### 2. 使用 `du -d 0` 显示没有任何子目录条目的磁盘使用情况：\n\n```bash\nherong$ du -d 0\n```\n\
    \n```\n250420  .\n```\n\n### 3. 使用 `du -h` 以人类可读单位显示磁盘使用情况：\n\n```bash\nherong$\
    \ du -d 0 -h\n```\n\n```\n245M  .\n```\n\n### 4. 使用 `du -k|m|g` 以 KB、MB 或 GB 为单位显示磁盘使用情况：\n\
    \n```bash\nherong$ du -d 0 -k\n```\n\n```\n250420  .\n```\n\n## 挂载 Windows NTFS\
    \ 文件系统\n\n提供了一个教程示例，介绍如何挂载 Windows NTFS 文件系统。如果你有一个格式化为 NTFS 的磁盘分区，你可能需要 NTFS\
    \ 驱动程序在 Linux 系统上挂载它。以下是我的操作步骤：\n\n```bash\nherong$ fdisk -l /dev/sda\n```\n\n\
    ```\n/dev/sda:\n\nATA device, with non-removable media\n  Model Number:      WDC\
    \ WD10EZEX-xxxxxx\n  Serial Number:      WD-xxxxxx\n  Firmware Revision:  01.01A01\n\
    \  Transport:          Serial, SATA 1.0a, SATA II Extensions, ...\n...\n  device\
    \ size with M = 1000*1000:      1000204 MBytes (1000 GB)\n...\nCapabilities:\n\
    ...\n  DMA: mdma0 mdma1 mdma2 udma0 udma1 mdma2 udma3 udma4 *udma5\n  PIO: pio0\
    \ pio1 pio2 pio3 pio4\n...\n```\n/dev/sda1\nSG_IO: bad/missing sense data, sb[]:\
    \  0 00 05 00 00 14 ...\nATA device, with non-removable media\n\nStandards:\n\
    \  Likely used: 1\n\nConfiguration:\n  Logical    max  current\n  cylinders  0\
    \  0\n  heads    0  0\n  sectors/track  0  0\n  --\n  Logical/Physical Sector\
    \ size:                   512 bytes\n  device size with M = 1024*1024:      0\
    \ MBytes\n  device size with M = 1000*1000:      0 MBytes\n  cache/buffer size\
    \  = unknown\n\nCapabilities:\n  IORDY not likely\n  Cannot perform double-word\
    \ IO\n  R/W multiple sector transfer: not supported\n  DMA: not supported\n  PIO:\
    \ pio0\n```\n\n"
- fmt: "\nCool. I can read my old files on the Windows disk on my CentOS computer\
    \ now!\n\n# W95 Ext'd (LBA) Partition\n\nProvides a quick introduction on `W95\
    \ Ext'd LBA` (Windows 95 Extended Logical Block Addressing) Partition, which is\
    \ actually a container to hold sub-partitions. If you are using a hard disk create\
    \ from a Windows computer, you may see a special partition with the `W95 Ext'd\
    \ (LBA)` type. `W95 Ext'd (LBA)` stands for Windows 95 Extended Logical Block\
    \ Addressing.\n\n`W95 Ext'd LBA` is not a file system partition. It is actually\
    \ a container to hold sub-partitions. On Windows systems, a hard disk can only\
    \ be divided up to 4 partitions. `W95 Ext'd LBA` technology allows you create\
    \ more sub-partitions from those 4 primary partitions. If you see a hard disk\
    \ that has more than 4 partitions, or you see a partition index higher than 4,\
    \ you know that `W95 Ext'd LBA` is used on the hard disk.\n\nFor example, I have\
    \ the following partitions on my CentOS computer:\n\n```bash\nherong$ sudo fdisk\
    \ -l /dev/sda\n\nDisk /dev/sda: 900.0 GiB\nUnits: sectors of 1 * 512 = 512 bytes\n\
    Sector size (logical/physical): 512 bytes / 4096 bytes\nI/O size (minimum/optimal):\
    \ 4096 bytes / 4096 bytes\nDisklabel type: dos\nDevice     Boot       Start  \
    \       End      Sectors    Size Id Type\n/dev/sda1  *             2048  167776255\
    \  167774208     80G  7 HPFS/NTFS/exFAT\n/dev/sda2             167776256 1953523711\
    \ 1785747456 851.5G  f W95 Ext'd (LBA)\n/dev/sda5             167778304 1748721663\
    \ 1580943360 753.9G  7 HPFS/NTFS/exFAT\n/dev/sda6             1748723712 1750820863\
    \     20971522      1G 83 Linux\n/dev/sda7             1750822912 1953523711 \
    \ 202700800   96.7G 8e Linux LVM\n```\n\nThe output tells me that:\n* The hard\
    \ disk has only 2 primary partitions `/dev/sda1` and `/dev/sda2`.\n* `/dev/sda1`\
    \ has 80 GB in Windows NTFS format with the boot sector to serve my Windows system.\n\
    * `/dev/sda2` has 850 GB in `W95 Ext'd LBA` format and contains 3 sub-partitions:\
    \ `/dev/sda5`, `/dev/sda6` and `/dev/sda7`.\n* `/dev/sda5` is sub-partition with\
    \ 753 GB in Windows NTFS format.\n* `/dev/sda6` is sub-partition with 1 GB in\
    \ Linux format to hold Linux `/root` files.\n* `/dev/sda7` is sub-partition with\
    \ 96 GB in Linux LVM format to server my Linux system.\n\nSo do not try to mount\
    \ `W95 Ext'd LBA` formatted `/dev/sda2` to Linux system, it is not a true file\
    \ system.\n\n# File System Types, IDs and Formats\n\nProvides a list of commonly\
    \ used File System formats and their identification codes on Linux systems. If\
    \ you receive a storage device from a friend, you may have trouble to mount its\
    \ partitions on your Linux computer. This is because the storage device could\
    \ be created with a file system format, which is not recognized by the Linux computer.\
    \ To help you dealing with this situation, here is a list of commonly used File\
    \ System formats and handling suggestions.\n\n1. **Linux** - `Linux (ID: 83)`\
    \ is used to identify some old Linux native file systems, like `xiafs`, `ext2`,\
    \ `ext3`, `reiserfs`, etc. It may still be used to hold the `/root` files on todays\
    \ Linux systems, like CentOS.\n2. **Linux LVM** - `Linux LVM (ID: 8e)` is used\
    \ to identify the Linux LVM (Logical Volume Manager) partition. It is used on\
    \ CentOS systems as the main file system.\n3. **Linux Swap** - `Linux Swap (ID:\
    \ 82)` is used to identify Linux swap partition.\n4. **FAT16** - `FAT16 (ID: 6)`\
    \ is used to identify 16-bit FAT (File Allocation Table) partition, which is used\
    \ by old DOS (Disk Operating System) computers. Most Linux systems supports FAT16\
    \ by default.\n5. **NTFS** - `NTFS (ID: 7)` is used to identify the NTFS (New\
    \ Technology File System) partition, which is used by old Windows computers. You\
    \ may need to install `ntfs-3g` device to support it.\n6. **HPFS** - `HPFS (ID:\
    \ 7)` is used to identify HPFS (Installable File System) used by old OS computers.\
    \ You need to install special device drivers to support it.\n7. **exFAT** - `exFAT\
    \ (ID: 7)` is used to identify the exFAT (Extended File Allocation Table) partition,\
    \ which is used by old Windows Vista. You may need to install `fuse-exfat` device\
    \ to support it.\n8. **W95 Ext'd LBA** - `W95 Ext'd LBA (ID: f)` is used to identify\
    \ the Windows 95 Extended LBA (Logical Block Addressing) partition. Note that\
    \ `W95 Ext'd LBA` is not a file system. It is actually a container to hold sub-partitions.\
    \ On Windows systems, a hard disk can only be divided up to 4 partitions. `W95\
    \ Ext'd LBA` technology allows you create more sub-partitions from those 4 primary\
    \ partitions.\n9. **OpenBSD** - `OpenBSD (ID: a6)` is used to identify the OpenBSD\
    \ (Berkeley Software Distribution) partition, which is used by OpenBSD computers.\
    \ You need to install special device drivers to support it.\n10. **Mac OS-X**\
    \ - `Mac OS-X (ID: a8)` is used to identify the Mac OS-X partition, which is used\
    \ by Mac OS-X computers. You need to install special device drivers to support\
    \ it.\n\n# Installing CentOS\n\nProvides tutorial examples on installing Linux\
    \ system. Topics include downloading CentOS ISO file; copying image file with\
    \ `dd` to create bootable USB drive; installing CentOS from bootable USB.\n\n\
    ### Takeaways\n* You can download CentOS ISO image and create a bootable USB drive\
    \ using the `dd` command on a macOS computer.\n* Installing CentOS system from\
    \ a Bootable USB drive is straightforward, if you have enough free space on the\
    \ hard disk.\n* You can use the built-in hard disk tool delete existing partitions\
    \ to free up space.\n\n## Create Bootable USB\nProvides a tutorial example on\
    \ how to download the full CentOS ISO file and create a bootable USB drive on\
    \ a macOS computer. CentOS 8 is the latest release of the CentOS system, which\
    \ is the open source version of RHEL (Red Hat Enterprise Linux). If you want to\
    \ try it, you can follow what I did as described below to down the CentOS 8.1\
    \ ISO file and create a bootable USB drive.\n\n1. Go to CentOS download Website\
    \ at `https://wiki.centos.org/Download`. I see a list of CentOS 8, 7, and 6 download\
    \ options.\n2. Click `mirrors` button next to `CentOS 8.1 (1911)`. I see a list\
    \ of download mirror sites.\n3. Select a mirror site near you, like `http://centos.les.net/`.\
    \ I see two ISO image files: `CentOS-8.1.1911-x86_64-boot.iso`, and `CentOS-8.1.1911-x86_64-dvd1.iso`.\
    \ They are for computers with an `x86_64` CPU architecture.\n    * `boot.iso`\
    \ is much smaller and contains only the bootable CentOS 8 kernel. When installing\
    \ CentOS 8 with `boot.iso`, additional system and application packages needed\
    \ to be downloaded on the fly.\n    * `dvd1.iso` is much larger and contains all\
    \ system packages and basic application packages. You can install CentOS 8 with\
    \ `dvd1.iso` without download anything from the Internet.\n4. Click `CentOS-8.1.1911-x86_64-dvd1.iso`\
    \ and save it to my macOS computer. I select `CentOS-8.1.1911-x86_64-dvd1.iso`,\
    \ because it matches the CPU architecture `x86_64` of the Lenovo computer I want\
    \ to install CentOS on. You can select ISO files for other architectures by going\
    \ to the parent directory on the mirror site.\n5. Wait until the download is completed,\
    \ which may take some time.\n6. Copy `CentOS-8.1.1911-x86_64-dvd1.iso` to a USB\
    \ drive using the `dd` command on my macOS computer. You can also do this by using\
    \ `Etcher` or `Rufus` ISO tools, which is much safer than the `dd` command.\n\n\
    ```bash\nmacOS$ df\n```\n"
