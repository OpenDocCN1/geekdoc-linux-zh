    \ connection established.\nStatus: Logged in\nStatus: Retrieving directory listing...\n\
    Status: Directory listing of \"/\" successful\n\nNice! My FTP connections are\
    \ secured now.\n\n## Disable SSH Access for FTP Users\n\nProvides a tutorial example\
    \ on how to disable SSH login access of a user on CentOS systems and allow his/her\
    \ to use FTP service only for upload and download files. Some times, you may want\
    \ to create a user and allow him/her to use the FTP service only, not allow him/her\
    \ to use the SSH (Secure Shell) service to login to your CentOS system. This can\
    \ be done by disabling his/her access in the `sshd` (SSH Daemon) configuration.\
    \ Here is what I did to create \"john\" as FTP user and disable his access in\
    \ the `sshd` configuration.\n\n### 1. Create \"john\" as a user\n```bash\nherong$\
    \ sudo useradd john\nherong$ sudo passwd john\nChanging password for user john.\n\
    ```\n\n### 2. Enable FTP access for John\n```bash\nherong$ sudo vi /etc/vsftpd/user_list\n\
    ...\nherong\njohn\nherong\nherong$ sudo systemctl restart vsftpd\n```\n\n### 3.\
    \ Create FTP home directory for John\n```bash\nsudo mkdir /home/john/ftp\nsudo\
    \ chown nobody:nobody /home/john/ftp\nsudo mkdir /home/john/ftp/private\nsudo\
    \ chown john:john /home/john/ftp/private\n```\n\n### 4. Disable SSH access for\
    \ John\n```bash\nherong$ sudo vi /etc/ssh/sshd_config\n...\n#  ForceCommand cvs\
    \ server\nUseDNS no\nAddressFamily inet\nSyslogFacility AUTHPRIV\nPermitRootLogin\
    \ yes\nPasswordAuthentication yes\nDenyUsers guest john\nherong$ sudo systemctl\
    \ restart sshd\n```\n\n### 5. Verify SSH access. It should be denied.\n```bash\n\
    FYIs-MacBook-Pro:src herong$ ssh john@192.168.1.3\njohn@192.168.1.3's password:\n\
    Permission denied, please try again.\njohn@192.168.1.3's password:\n```\nNow John\
    \ can upload and download files remotely on my CentOS computer. But he can not\
    \ SSH login remotely.\n\n## GCC - C/C++ Compiler on Linux Systems\n\nProvides\
    \ introductions and tutorial examples about GCC C/C++ compilers. Topics include\
    \ installing GCC C/C++ compilers; GCC compilation steps and settings; `g++ -I`\
    \ for include header files; `g++ -l` for static/dynamic library files; `g++ -shared`\
    \ for building shared object (dynamic library) file; `ldd` for checking dynamic\
    \ library dependencies; `make` tool for automation.\n\n### Takeaways:\n* Installing\
    \ the GCC C/C++ compilers can be done using `dnf install gcc` and `dnf install\
    \ gcc-c++` commands on CentOS systems.\n* Dumping PHP environment information\
    \ can be done by using the `php -i` command.\n* Include header file paths can\
    \ be specified by `g++ -I...` option or `CPATH` environment variable.\n* Static\
    \ and dynamic library files can be specified by `g++ -l... -l...` options.\n*\
    \ Static and dynamic library file paths can be specified by `g++ -L...` option\
    \ or `LIBRARY_PATH` environment variable at the link time.\n* Dynamic library\
    \ file paths can be specified by `LD_LIBRARY_PATH` environment variable at the\
    \ execution load time.\n* Dynamic library dependencies of any executable program\
    \ can be listed by the `ldd` command.\n* Building (compiling, linking, ...) C/C++\
    \ programs can be automated by the `make` tool, which uses `Makefile` to define\
    \ tasks involved in the building process.\n\n## Install GCC C/C++ Compilers\n\n\
    Provides a tutorial example on how to install GCC C/C++ compiler on CentOS systems.\
    \ If you want develop your own C/C++, or compile third party C/C++ source code,\
    \ you need install GCC C/C++ compilers as shown in this tutorial.\n\n### 1. Install\
    \ GCC compiler\n```bash\nherong$ dnf info gcc\nAvailable Packages\nName:     \
    \    gcc\nVersion:      8.3.1\nRelease:      4.5.el8\nArchitecture: x86_64\nSize:\
    \         23 M\nSource:       gcc-8.3.1-4.5.el8.rpm\nRepository:   AppStream\n\
    Summary:      Various compilers (C, C++, Objective-C, ...)\nURL:          http://gcc.gnu.org\n\
    License:      GPLv3+ and GPLv3+ with exceptions and GPL2+ with ...\nDescription:\
    \  The gcc package contains the GNU Compiler Collection version 8. You'll need\
    \ this package in order to compile code.\nherong$ sudo dnf install gcc\n...\n\
    Installed:\n  gcc-8.3.1-4.5.el8.x86_64\n  annobin-8.7.el8.x86_64\n  cpp-8.3.1-4.5.el8.x86_64\n\
    \  isl-0.16.1.el8.x86_64\n  glibc-devel-2.28-72.el8.x86_64\n  glibc-headers-2.28-72.el8.x86_64\n\
    \  kernel-headers-4.18.0-147.5.1.el8_1.x86_64\n  libxcrypt-devel-4.1.1-4.el8.x86_64\n\
    ```\n\n### 2. Verify GCC installation\n```bash\n# The C preprocessor\nherong$\
    \ cpp --version\ncpp (GCC) 8.3.1 20190507 (Red Hat 8.3.1-4)\nCopyright (C) 2018\
    \ Free Foundation, Inc.\n\n# The GNU project compiler\nherong$ gcc --version\n\
    gcc (GCC) 8.3.1 20190507 (Red Hat 8.3.1-4)\nCopyright (C) 2018 Free Foundation,\
    \ Inc.\n\n# Alias of gcc\nherong$ ls -l /usr/bin/cc\nlrwxrwxrwx. 1 root 3 Nov\
    \ 5 23:36 /usr/bin/cc -> gcc\n```\n\n### 3. Compile and run a C program, hello.c\n\
    ```bash\nherong$ vi hello.c\n#include<stdio.h>\nint main(void) {\n  printf(\"\
    Hello world! From C.\\n\");\n  return 0;\n}\nherong$ gcc hello.c\nherong$ ./a.out\n\
    Hello world! From C.\n```\n\n### 4. Install GCC C++ compiler\n```bash\nherong$\
    \ dnf info gcc-c++\nAvailable Packages\nName:         gcc-c++\nVersion:      8.3.1\n\
    Release:      4.5.el8\nArchitecture: x86_64\nSize:         12 M\nSource:     \
    \  gcc-8.3.1-4.5.el8.rpm\nRepository:   AppStream\nSummary:      C++ support for\
    \ GCC\nURL:          http://gcc.gnu.org\nLicense:      GPLv3+ and GPLv3+ with\
    \ exceptions and GPL2+ with ...\nDescription:  This package adds C++ support to\
    \ the GNU Compiler Collection. It includes support for most of the current C++\
    \ specification, including templates and exception handling.\nerong@localhost\
    \ build]$ sudo dnf install gcc-c++\n...\nInstalled:\n  gcc-c++-8.3.1-4.5.el8.x86_64\n\
    \  libstdc++-devel-8.3.1-4.5.el8.x86_64\nComplete!\n```\n\n### 5. Verify GCC installation\n\
    ```bash\n# The GNU C++ compiler\nherong$ gcc --version\ng++ (GCC) 8.3.1 20190507\
    \ (Red Hat 8.3.1-4)\nCopyright (C) 2018 Free Foundation, Inc.\n```\n\n### 6. Compile\
    \ and run a C++ program, hello.cpp\n```bash\nherong$ vi hello.cpp\n#include \"\
    iostream\"\nint main(void) {\n  std::cout << \"Hello world! From C++.\\n\";\n\
    \  return 0;\n}\nherong$ g++ hello.cpp\nherong$ ./a.out\nHello world! From C++.\n\
    ```\n\n## \"g++ --verbose\" - GCC Compiler Steps and Settings\n\nProvides a tutorial\
    \ example on how to dump GCC compiler steps and settings using the `g++ --verbose`\
    \ command option. If you are running into issues with the GCC C++ compiler, you\
    \ may want to use the `g++ --verbose` to dump all current settings from the compiler.\n\
    \n```bash\nherong$ g++ --verbose hello.cpp\n...\nTarget: x86_64-redhat-linux\n\
    Configured with: ../configure --enable-bootstrap --enable-languages=c,c++,fortran,lto\
    \ ...\n/usr/libexec/gcc/x86_64-redhat-linux/8/cc1plus -quiet -v -D_GNU_SOURCE\
    \ hello.cpp\n  -quiet -dumpbase hello.cpp -mtune=generic -march=x86-64 -auxbase\
    \ hello -version\n  -o /tmp/cceaNqFM.s\nignoring nonexistent directory \"/usr/lib/gcc/x86_64-redhat-linux/8/include-fixed\"\
    \nignoring nonexistent directory \"/usr/x86_64-redhat-linux/include\"\n\n#include\
    \ \"...\" search starts here:\n\n#include <...> search starts here:\n```\n"
