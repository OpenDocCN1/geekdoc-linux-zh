    ## CentOS 上的软件包管理器 - DNF 和 YUM


    本文提供了关于 CentOS 系统上软件包管理器的介绍和教程示例。主题包括 DNF 和 YUM 的介绍。


    ### 核心要点

    * `DNF`，也称为 `Dandified YUM`，是基于 `RPM`（RedHat Package Manager）的 Linux 发行版的下一代 `YUM`（Yellowdog
    Update Modified）软件包管理器。

    * `YUM`（Yellowdog Update Modified）是基于 `RPM`（RedHat Package Manager）的 Linux 发行版的软件包管理器。

    * 你可以使用 `dnf search keyword` 来搜索带有给定关键词的包。

    * 你可以使用 `sudo dnf install package_name` 来安装软件包。


    ### 使用方法

    ```bash

    herong$ dnf [options]

    ```


    ### 主要命令列表

    * `alias`: 列出或创建别名

    * `autoremove`: 移除所有最初作为依赖安装的不再需要的包

    * `check`: 检查包中的问题

    * `check-update`: 检查可用的更新

    * `clean`: 缓存数据

    * `deplist`: 列出包的依赖关系及其提供者

    * `distro-sync`: 将已安装的包同步到最新版本

    * `downgrade`: 降级软件包

    * `group`: 显示或使用组信息

    * `help`: 显示帮助性的用法信息

    * `history`: 显示或使用事务历史记录

    * `info`: 显示关于包或一组包的详细信息

    * `install`: 在系统上安装一个或多个包

    * `list`: 列出包或包组

    * `makecache`: 生成元数据缓存

    * `mark`: 标记或取消标记已安装的包

    * `module`: 与模块交互

    * `provides`: 查找提供给定值的包

    * `reinstall`: 重新安装包

    * `remove`: 从系统中移除包

    * `repolist`: 显示配置软件仓库

    * `repoquery`: 搜索匹配关键词的包

    * `repository-packages`: 对给定仓库中的所有包运行命令

    * `search`: 为给定字符串搜索包详情

    * `shell`: 运行交互式 `DNF` shell

    * `swap`: 使用交互式 `dnf mod` 移除并安装一个 spec

    * `updateinfo`: 显示软件包公告

    * `upgrade`: 升级系统上的包或包

    * `upgrade-minimal`: 仅升级修复系统问题的“最新”包


