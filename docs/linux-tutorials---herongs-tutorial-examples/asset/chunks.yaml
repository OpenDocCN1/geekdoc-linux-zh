    \ knowledge about the details of the build process. The details about how the\
    \ program should be built are provided for make in the program's makefile.\n\n\
    So you should stop using `YUM` and get used to `DNF`. `YUM` will probably be removed\
    \ in the next CentOS release.\n\n## Install and Manage Java Packages on CentOS\n\
    \nProvides a tutorial example on how to install OpenJDK 11 JRE (Java Runtime Environment)\
    \ on CentOS 8 systems using `dnf/yum` as the package manager. If you want to run\
    \ Java applications on CentOS Linux systems, you can follow what I did on my CentOS\
    \ 8 computer:\n\n1. Login as \"herong\", who has admin privileges.\n2. Run `dnf\
    \ search` to find available Java packages. I see OpenJDK 1.8 and OpenJDK 11 packages\
    \ available for installation:\n\n```bash\nherong$ dnf search java\n\njava-11-openjdk.x86_64\
    \ : OpenJDK Runtime Environment 11\njava-11-openjdk-src.x86_64 : OpenJDK Source\
    \ Bundle 11\njava-11-openjdk-demo.x86_64 : OpenJDK Demos 11\njava-11-openjdk-devel.x86_64\
    \ : OpenJDK Development Environment 11\njava-11-openjdk-jmods.x86_64 : JMods for\
    \ OpenJDK 11\njava-1.8.0-openjdk.x86_64 : OpenJDK Runtime Environment 8\njava-1.8.0-openjdk-src.x86_64\
    \ : OpenJDK Source Bundle 8\njava-1.8.0-openjdk-demo.x86_64 : OpenJDK Demos 8\n\
    java-1.8.0-openjdk-devel.x86_64 : OpenJDK Development Environment 8\njava-1.8.0-openjdk-javadoc.noarch\
    \ : OpenJDK 8 API documentation\njava-1.8.0-openjdk-headless.x86_64 : OpenJDK\
    \ Headless Runtime Environment 8\n...\n```\n\n3. Install the OpenJDK 11 JRE (Java\
    \ Runtime Environment):\n\n```bash\nherong$ sudo dnf install java-11-openjdk\n\
    \nDependencies resolved.\nPackage                     Architecture    Version\n\
    ============================================================\nInstalling:\n  java-11-openjdk\
