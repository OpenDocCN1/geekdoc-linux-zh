  trans: "\n\n7. 如果在安装 CentOS 期间遇到连接连接问题，可以下载 `-dvd1.iso` 版本，通过 ISO 镜像在没有网络连接的情况下安装\
    \ CentOS。\n\n## CentOS 网络防火墙工具\n\n本文简要描述了 CentOS 8 系统上 3 种主要的网络防火墙工具：`firewalld/fireall-cmd`、`nftables/nft`\
    \ 以及 `iptables`。将 CentOS 系统连接到互联网后，你需要检查并修改防火墙设置以保护你的系统。CentOS 系统使用多种工具来管理网络防火墙，以下是三个主要的工具：\n\
    \n1. `firewalld` 和 `fireall-cmd` - 一个防火墙守护和一个 CLI（命令行接口），共同工作作为前端工具管理网络防火墙。`firewalld`\
    \ 使用 `nftables/iptables` 作为后端引擎。\n2. `nftables` 和 `nft` - 一个防火墙守护和一个 CLI（命令行接口），共同工作作为数据过滤和分类的后端引擎。`nftables`\
    \ 使用 `/etc/nftables` 目录存储其规则。CentOS 8 默认安装了 `nftables` 以替换 `iptables`。\n3. `iptables`\
    \ - Linux 内核中用于 IPv4/IPv6 数据包过滤和 NAT（网络地址转换）的基础管理工具。`iptables` 使用 `/usr/sbin/iptables`\
    \ 存储其规则。在 CentOS 8 系统上，`iptables` 现在已被 `nftables` 替换。\n\n以下是显示 `firewalld`、`nftables/iptables`\
    \ 以及其他工具之间关系的图（来源：https://firewalld.org）。\n![](img/Image00007.jpg)\n\n## firewalld\
    \ 和 firewall-cmd\n\n提供一个如何在 CentOS 8 系统上使用 `firewalld` 守护进程和 `firewall-cmd` CLI\
    \ 管理网络防火墙的教程示例。`firewalld` 是一个服务守护进程，与 `firewall-cmd` CLI（命令行接口）协同工作，形成用于 `nftables/iptables`\
    \ 工具控制互联网流量的前端工具。以下是我确保 `firewalld` 和 `firewall-cmd` 在我的 CentOS 8 计算机上运行所采取的操作。\n\
    \n1. 确保我已通过 `dnf info` 命令安装了最新版本的 `firewalld`：\n```bash\nherong$ sudo dnf info\
    \ firewalld\n\nInstalled Packages\nName: firewalld\nVersion: 0.7.0\nRelease: 5.el8\n\
    Architecture: noarch\nSize: 1.9 M\nSource: firewalld-0.7.0-5.el8.src.rpm\nRepository:\
    \ @System\nFrom repo: anaconda\nSummary: A firewall daemon with D-Bus interface\
    \ providing a dynamic firewall\nURL: http://www.firewalld.org\nLicense: GPLv2+\n\
    Description: firewalld 是一个带有 D-Bus 接口的防火墙服务守护进程，提供动态可定制的防火墙。\n```\n\n2. 确保通过 `systectl\
    \ status` 命令确认 `firewalld` 服务正在运行：\n```bash\nherong$ sudo systemctl status firewalld\n\
    \nfirewalld.service - firewalld - dynamic firewall daemon\n    Loaded: loaded\
    \ (/usr/lib/systemd/system/firewalld.service; enabled;\n             vendor preset:\
    \ enabled)\n    Active: active (running)\n    Docs: man:firewalld(1)\n    Main\
    \ PID: 1360 (firewalld)\n    Tasks: 3 (limit: 26213)\n    Memory: 34.4M\n    CGroup:\
    \ /system.slice/firewalld.service\n```\n\n3. 使用 `firewall-cmd` 命令检查每个网络接口上激活的安全区域。我看到以太网接口应用了\
    \ `public` 区域的安全规则。\n```bash\nherong$ sudo firewall-cmd --get-active-zones\n\n\
    public\n  interfaces: eno1\n```\n\n4. 检查 `public` 区域中定义了哪些安全规则。我看到两个 TCP 端口 80\
    \ 和 3306 允许入站流量。`cockpit`、`dhcpv6-client` 和 `ssh` 服务使用的端口也是开放的。\n```bash\nherong$\
    \ sudo firewall-cmd --zone=public --list-all\npublic (active)\n  target: default\n\
    \  icmp-block-version: no\n  interfaces: eno1\n  sources:\n  services: cockpit\
    \ dhcpv6-client ssh\n  ports: 80/tcp 3306/tcp\n  protocols:\n  masquerade: no\n\
    \  forward-ports:\n  icmp-blocks:\n  rich rules:\n```\n\n5. 添加一条新规则为 Tomcat 服务器开放\
    \ TCP 端口 8080。第一条命令允许来自互联网的所有 IP 地址访问 8080 端口。第二条命令永久保存更改。\n```bash\nherong$ sudo\
    \ firewall-cmd --zone=public --add-port=8080/tcp\nherong$ sudo firewall-cmd --runtime-to-permanent\n\
    ```\n\n6. 添加一条新规则为指定的 IP 地址开放所有端口。\n```bash\nherong$ sudo firewall-cmd --zone=public\
    \ --add-source=192.168.1.11\nherong$ sudo firewall-cmd --runtime-to-permanent\n\
    ```\n\n7. 开启流量转发和转发规则：\n```bash\nherong$ sudo firewall-cmd --zone=external --add-masquerade\n\
    herong$ sudo firewall-cmd --zone=public --add-forward-port\n```\n\n8. 在 `public`\
    \ 区域添加端口转发规则：\n```bash\nherong$ sudo firewall-cmd --zone=public --add-forward-port=8080:8080:tcp\n\
    herong$ sudo firewall-cmd --runtime-to-permanent\n```\n\n9. 在 `external` 区域开启伪装功能：\n\
    ```bash\nherong$ sudo firewall-cmd --zone=external --add-masquerade\nherong$ sudo\
    \ firewall-cmd --runtime-to-permanent\n```\n\n10. 在 `public` 区域添加服务：\n```bash\n\
    herong$ sudo firewall-cmd --zone=public --add-service=http\nherong$ sudo firewall-cmd\
    \ --runtime-to-permanent\n```\n\n11. 在 `public` 区域添加富规则：\n```bash\nherong$ sudo\
    \ firewall-cmd --zone=public --add-rich-rule='rule family=\"ipv4\" source address=\"\
    192.168.1.0/24\" port port=\"80\" protocol=\"tcp\" accept'\nherong$ sudo firewall-cmd\
    \ --runtime-to-permanent\n```\n\n"
