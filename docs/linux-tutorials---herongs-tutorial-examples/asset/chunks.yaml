  trans: "\n\n看起来 PHP-FPM 模块添加了一些额外的安全保护，以防止任何 PHP 脚本写回 Apache HTML 目录。为所有用户授予“rwxrwxrwx”写入权限对于\
    \ PHP-FPM 模块来说是不够的。一种变通是从 Apache PHP 脚本将文件写入 `/tmp` 或 `/var/log`。\n\n## /var/www/html\
    \ 上的 SELinux 安全上下文\n\n提供了一个教程示例，说明如何更改 `/var/www/html` 内部子目录的 SELinux 安全上下文类型，以允许运行在\
    \ CentOS 系统 Apache Web 服务器上的 PHP 脚本创建新文件。\n\n上一个教程中提到的“Apache PHP `file_put_contents()`\
    \ 权限被拒绝”问题的根源，实际上是 `/var/www/html` 目录上的 SELinux 安全上下文设置。我们可以通过本教程所示的更改 SELinux\
    \ 安全上下文类型来临时修复它。\n\n1. 对比 `/var/www/html/test` 与 `/tmp` 的 SELinux 安全上下文。我发现它们的安全用户、组和类型是不同的。\n\
    \n```\nherong$ ls -la --context /var/www/html/test\ndrwxrwxrwx. 2 herong root\
    \ unconfined_u:object_r:httpd_sys_content_t:s0 .\n\nherong$ ls -la --context /tmp\n\
    drwxrwxrwt. 15 root root system_u:object_r:tmp_t:s0 .\n```\n\n2. 将 `/var/www/html/test`\
    \ 的 SELinux 安全上下文类型更改为匹配 `/tmp`，我的 PHP Web 脚本就可以创建文件。\n\n```\nherong$ cd /var/www\n\
    herong$ sudo chcon -t tmp_t test\nherong$ ls -la --context test\ndrwxrwxrwx. 2\
    \ herong root   unconfined_u:object_r:tmp_t:s0 .\n```\n\n3. 在 Apache 服务器上重新运行测试脚本。我看到\
    \ `/var/www/html/test` 中创建了新文件。\n\n```\nherong$ curl localhost/test/test_file_put_contents.php\n\
    \n<html><body><pre>\nOutput from whoami:\napache\n\nOutput from getcwd():\n/var/www/html/test\n\
    \ntest file_put_contents(./tmp-cwd.tmp):\n-rw-r--r--. 1 apache apache 26 Apr \
    \ 1 02:29 ./tmp-cwd.tmp\n\ntest file_put_contents(/tmp/tmp-tmp.tmp):\n-rw-r--r--.\
    \ 1 apache apache 27 Apr  1 02:29 /tmp/tmp-tmp.tmp\n</pre></body></html>\n```\n\
    \n太酷了。我有一个临时解决方案，可以在带有“PHP-FPM”模块的 Apache Web 服务器上通过 PHP 脚本在 `/var/www/html` 目录下创建新文件。\n\
    \n## 将旧脚本迁移到新 PHP 版本\n\n提供了一个教程示例，说明如何将旧 PHP 脚本迁移到新的 PHP 版本。如果你在较版本的 PHP 引擎上运行旧\
    \ PHP 脚本，可能会看到许多错误，因为某些模块或函数已弃用或删除。以下是它们的替换列表。\n\n- `eregi('...', ...);` --> `preg_match(('/.../i',\
    \ ...);`\n- `mysql_*()` --> `mysqli_*()`\n- `date(): ... not safe ...` --> `date_default_timezone_set('Europe/Paris');`\n\
    \n## 在 Linux 系统上运行 MySQL 数据库服务器\n\n提供了 CentOS 系统 MySQL 数据库服务器的介绍和教程示例。主题包括在 CentOS\
    \ 8 上安装 MySQL 8.0；启动和停止 `mysqld` 系统服务；设置 MySQL `root` 密码；MySQL 文件和数据位置；MySQL 日志文件；备份\
    \ MySQL 数据；MySQL socket 和 TCP/IP 连接；为 MySQL 连接开放防火墙。\n\n### 核心点：\n- 在 CentOS 8\
    \ 上，可以使用 `dnf install mysql-server` 命令安装 MySQL 服务器。\n- 可以 `service mysqld start/stop`\
    \ 命令启动和停止 MySQL 服务器。\n- MySQL 服务器启动时 `root` 用户没有密码。你可以使用 `mysqladmin -u root -p\
    \ password` 命令设置密码。\n- MySQL 命令程序位于 `/usr/bin` 目录。\n- MySQL 数据和日志文件位于 `/var/lib/mysql`\
    \ 目录。\n- 可以 `mysqldump` 命令备份 MySQL 数据。\n- MySQL 可以 `general_log` 设置记录所有查询。\n-\
    \ MySQL 支持服务器上使用 `localhost` 作为主机名的客户端程序进行 socket 连接。\n- MySQL 支持通过端口 3306 为远程客户端提供\
    \ TCP/IP 连接。\n- 只有当使用其特定的 IP 地址创建用户时，MySQL 才允许远程用户访问。\n- MySQL 要求服务器和网关开放端口 3306\
    \ 的入站消息防火墙。\n- 使用旧的 PHP `mysqli_connect()` 函数连接 MySQL 8.0 时会返回“Server sent charset\
    \ unknown to the client”错误。\n- 在默认设置下，我的 CentOS 上 MySQL 服务器比 macOS 慢 100 倍。\n\n\
    ### 在 CentOS 上安装 MySQL 数据库服务器\n\n提供了一个教程示例，说明如何使用 `dnf/yum` 作为包管理器在 CentOS 8 上安装\
    \ MySQL 8.0 服务器。如果你想在 CentOS 系统上使用 MySQL 数据库服务器，可以参考我在 CentOS 8 计算机上的操作：\n\n1.\
    \ 以具有管理员权限的 \"herong\" 登录。\n2. 运行 `dnf search` 可用包。我看到 `mysql-server` 和一些相关模块可以安装：\n\
    \n```\nherong$ dnf search mysql\nmysql-server.x86_64 : MySQL programs and shared\
    \ libraries\ngrafana-mysql.x86_64 : Grafana datasource\npostfix-mysql.x86_64 :\
    \ Postfix map\nrsyslog-mysql.x86_64 : MySQL support for rsyslog\ndovecot-mysql.x86_64\
    \ : MySQL end for docot\nperl-DBD-MySQL.x86_64 : MySQL interface for Perl\nfreeradius-mysql.x86_64\
    \ : MySQL support for freeradius\nmysql-server.x86_64 : MySQL server and related\
    \ files\nmysql-test.x86_64 : test suite distributed with MySQL\n```\n\n3. 安装 `mysql-server`\
    \ 包：\n\n```\nherong$ sudo dnf install mysql-server\nPackage            Arch  \
    \        Version                Repo      Size\n===================================\n\
    Installing:\n  mysql-server      x86_64        8.0.17-3.module_el8.0  22 M\nInstalling\
    \ dependencies:\n  mariadb-connector-c  noarch         3.0.7-1.el8           \
    \  13 k\n  mecab              x86_64        0.996-1.module_el8.0  397 k\n  mysql\
    \             x86_64        8.0.17-3.module_el8.0  11 M\n  mysql-common      x86_64\
    \        8.0.17-3.module_el8.0  143 k\n  mysql-errmsg      x86_64        8.0.17-3.module_el8.0\
    \  557 k\n  protobuf-lite    x86_64        3.5.0-7.el8               150 k\nEnabling\
    \ module streams:\n  mysql                               8.0\n...\nInstalled:\n\
    \  mysql-server      x86_64        8.0.17-3.module_el8.0\n  mariadb-connector-c\
    \  noarch         3.0.7-1.el8\n  mecab              x86_64        0.996-1.module_el8.0\n\
    \  mysql             x86_64        8.0.17-3.module_el8.0\n```\n\n```\n\n完成！\n\n\
    3. 验证 \"php\" 包：\n\n```\nherong$ mysql --version\nmysql  Ver 8.0.17 for Linux\
    \ on x86_64 (Source distribution)\n```\n\n"
- fmt: "\nCool! I have installed the \"mysql-server\" 8.0 on my CentOS computer without\
    \ any issues. And the MySQL client program `mysql` is working. See next tutorial\
    \ on how to start and stop MySQL server on CentOS systems.\n\n# Manage MySQL Server\
    \ 'mysqld' on CentOS\n\nProvides a tutorial example on how to start and stop MySQL\
    \ server program `mysqld` as a system service on CentOS 8 systems using the `systemctl`\
    \ command. After install MySQL server with the `yum` command CentOS Linux systems,\
    \ you need to learn how to manage it. The first task is to start or stop the MySQL\
    \ server. Here is what I did on my CentOS 8 computer.\n\n### 1. Check MySQL server\
    \ status.\nI see an error message, because the it is not running.\n```bash\nherong$\
    \ mysqladmin status\nmysqladmin: connect to server at 'localhost' failed\nerror:\
    \ 'Can't connect to local MySQL server through socket ...\nCheck that mysqld is\
    \ running and that the socket:\n    '/var/lib/mysql/mysql.sock' exists!\n```\n\
    \n### 2. Start MySQL server as a system service:\nI see an error message, because\
    \ it is not enabled on CentOS 8.\n```bash\nherong$ sudo systemctl start mysqld.service\n\
    Failed to start mysqld.service: Unit mysqld.service not found.\n```\n\n### 3.\
    \ Enable MySQL server as a system service.\n```bash\nherong$ sudo systemctl enable\
    \ mysqld.service\nCreated symlink /etc/systemd/system/multi-user.target.wants/mysqld.service\n\
    \    /usr/lib/systemd/system/mysqld.service.\n```\n\n### 4. Check MySQL server\
    \ status again.\nI see the server is running. And there is no password for the\
    \ \"root\" user!\n```bash\nherong$ mysqladmin status -u root -p\nEnter password:\
    \ <Enter>\nUptime: 82  Threads: 2  Questions: 5  Slow queries: 0  Opens: 115\n\
    \    Flush tables: 3  Open tables: 35  Queries per second avg: 0.060\n```\n\n\
    ### 5. Stop MySQL server.\n```bash\nherong$ sudo systemctl stop mysqld.service\n\
    ```\n\n### 6. Start MySQL server again.\n```bash\nherong$ sudo systemctl start\
    \ mysqld.service\n```\n\n### 7. Connect to MySQL Server with \"mysql\" client\
    \ program:\n```bash\nherong$ mysql -u root -p\nEnter password: <Enter>\n...\n\
    mysql> show databases;\n+--------------------+\n| Database           |\n+--------------------+\n\
    | information_schema |\n| mysql              |\n| performance_schema |\n| sys\
    \               |\n+--------------------+\n```\n\nCool. I am able to start and\
    \ stop MySQL server as a system service on my CentOS 8 computer. You can also\
    \ use the `service` command, which actually calls the `systemctl` command, to\
    \ start and stop MySQL server:\n```bash\nherong$ sudo service mysqld start\nherong$\
    \ sudo service mysqld stop\n```\n\nBut, do not try to run the MySQL server program,\
    \ `mysqld`, directly. You will run into errors. \n```bash\nherong$ sudo mysqld\n\
    [System] [MY-010116] [Server] /usr/libexec/mysqld (mysqld 8.0.17) starting\n \
    \   as process 15754\n[ERROR] [MY-010123] [Server] Fatal error: Please read \"\
    Security\" section\n    of the manual to find out how to run mysqld as root!\n\
    [ERROR] [MY-010119] [Server] Aborting\n[System] [MY-010910] [Server] /usr/libexec/mysqld:\
    \ Shutdown complete\n    (mysqld 8.0.17)  Source distribution.\n```\n\n# Set MySQL\
    \ Server \"root\" Password on CentOS\n\nProvides a tutorial example on how to\
    \ set or reset 'root' password, in case it has no password or you can not remember\
    \ the password, for MySQL 8.0 server on CentOS 8 systems. When MySQL database\
    \ server is installed on CentOS, it will create a \"root\" user name to access\
    \ the database contents. This \"root\" user has all types permissions to access\
    \ all database objects. But it has no password by default. So before adding any\
    \ data to your MySQL database, you should set a password for this \"root\" user\
    \ to protect your data. Here what I did on my MySQL 8 server on my CentOS 8 computer.\n\
    \n### 1. Connect to MySQL 8 server with the \"root\" user without any password:\n\
    ```bash\nherong$ mysql -u root -p\nEnter password: <Enter>\n...\nmysql>\n```\n\
    \n### 2. Checking the current password of \"root\".\nI see that the \"root\" use\
    \ has not password:\n```sql\nmysql> select user, host, plugin, authentication_string\
    \ from mysql.user;\n+----------------+-------------+-------------+-----------------------+\n\
    | user              | host        | plugin | authentication_string |\n+----------------+-------------+-------------+-----------------------+\n\
    | information_schema | localhost | caching_sha2_password | $A005$... |\n| mysql.session\
    \       | localhost | caching_sha2_password | $A005$... |\n| mysql.sys       \
    \   | localhost | caching_sha2_password | $A005$... |\n| root                |\
    \ localhost | mysql_native_password | 8E4DE7FB... |\n+----------------+-------------+-------------+-----------------------+\n\
    ```\n\n### 3. Set a new password for the current login user, \"root\".\n```sql\n\
    mysql> set password = 'TopSecret';\nmysql> select user, host, plugin, authentication_string\
    \ from mysql.user;\n+----------------+-------------+-------------+-----------------------+\n\
    | user              | host        | plugin | authentication_string |\n+----------------+-------------+-------------+-----------------------+\n\
    | information_schema | localhost | caching_sha2_password | $A005$... |\n| mysql.session\
    \       | localhost | caching_sha2_password | $A005$... |\n| mysql.sys       \
    \   | localhost | caching_sha2_password | $A005$... |\n| root                |\
    \ localhost | mysql_native_password | 8E4DE7FB... |\n+----------------+-------------+-------------+-----------------------+\n\
    ```\n\n### 4. Disconnect and connect with the new password:\n```bash\nmysql> exit;\n\
    Bye\nherong$ mysql -u root -p\nEnter password: TopSecret<Enter>\n...\nmysql>\n\
    ```\n\nCool. I have added a password to the \"root\" user on my MySQL 8 server.\
    \ Not that there are other ways to set or reset the \"root\" password:\n*   Using\
    \ `mysqladmin -u root -p password new_password` command.\n*   Using `alter user\
    \ root identified by 'new_password';` MySQL command.\n*   Using `update mysql.user\
    \ set authentication_string = '' where user='root';` SQL statement to update the\
    \ user table directly, which is not recommended.\n\nIf you lost the \"root\" password,\
    \ there is only one way to recover it by running MySQL server without password\
    \ protection:\n```bash\nherong$ sudo service mysqld stop\nherong$ sudo mysqld\
    \ --skip-grant-tables &\nherong$ mysql -u root\nmysql> set password = 'TopSecret';\n\
    mysql> quit;\nherong$ killall mysqld\nherong$ sudo service mysqld\n```\n\n# MySQL\
    \ File Locations on CentOS\n\nProvides a tutorial example on how to find and view\
    \ MySQL Server file locations for MySQL 8.0 server on CentOS 8 systems. In order\
    \ to properly maintain MySQL server, you need to know how and where MySQL server\
    \ stores its files. As an example, here are the locations of MySQL server files\
    \ on my CentOS 8 computer:\n\n### 1. MySQL command program files are stored in\
    \ 2 directories:\n```bash\nherong$ ls -l /usr/sbin | grep mysql\nlrwxrwxrwx. 1\
    \ root root 19 Oct 8 09:34 mysqld -> /usr/libexec/mysqld\nherong$ ls -l /usr/bin\
    \ | grep mysql\n-rwxr-xr-x. 1 root root 7703224 Oct 8 09:37 mysql\n-rwxr-xr-x.\
    \ 1 root root 7474568 Oct 8 09:37 mysqladmin\n-rwxr-xr-x. 1 root root 8198496\
    \ Oct 8 09:37 mysqlbinlog\n-rwxr-xr-x. 1 root root 7495776 Oct 8 09:37 mysqlcheck\n\
    -rwxr-xr-x. 1 root root 674528 Oct 8 09:37 mysql_config_editor\n-rwxr-xr-x. 1\
    \ root root 4392 Oct 8 09:24 mysqld_pre_systemd\n-rwxr-xr-x. 1 root root 7587512\
    \ Oct 8 09:37 mysqldump\n-rwxr-xr-x. 1 root root 7690 Oct 8 09:24 mysqldumpslow\n\
    -rwxr-xr-x. 1 root root 7473216 Oct 8 09:37 mysqlimport\n-rwxr-xr-x. 1 root root\
    \ 8380208 Oct 8 09:37 mysqlpump\n-rwxr-xr-x. 1 root root 7458664 Oct 8 09:37 mysql_secure_installation\n\
    -rwxr-xr-x. 1 root root 7467968 Oct 8 09:37 mysqlshow\n-rwxr-xr-x. 1 root root\
    \ 7497168 Oct 8 09:37 mysqlslap\n-rwxr-xr-x. 1 root root 733424 Oct 8 09:37 mysql_ssl_rsa_setup\n\
    ```\n"
