    [Linux Tutorials - Herong''s Tutorial Examples](#text00002.html_a2N5)∟ [Process
    Management](#text00007.html_a2NA)∟ "jobs" - Manage Background JobsProvides a tutorial
    example on how to use ''jobs'' command to display background jobs, which are processes
    with input detached the keyboard. You can start a background job by adding the
    ''ampersand'' sign to the end of the commmad.What Is Background Job? - A background
    job is a process with its input being detached from the keyboard device. Its output
    may still be attached to the screen.A foreground job is a process with its input
    being attached to the keyboard device. When you enter a command at the shell prompt
    to start a process, it will be started as a foreground job by default. The keyboard
    will be occupied by this foreground job until it is terminated. So you can only
    executed 1 process job at any time.If you want start a process as a background
    job to keep the keyboard free for the next process, you use the following 2 options:1\.
    Adding "&" at the end of the command line. This will start the process as a background
    job immediately. For example, the following command starts a process (ID=40120)
    as a background job (#=1).herong$ sleep 100000 &


    [1] 40120


    2\. Press "ctrl-z" during the execution of a foreground job. This will stop the
    foreground job and make it as a background job and keep it as stopped.herong$
    sleep 50000


    ctrl-z


    [2]+  Stopped                 sleep 50000


    If you want to see a list of your own background jobs, you can use the "jobs"
    command:herong$ jobs


    [1]-  Running                 sleep 100000 &


    [2]+  Stopped                 sleep 50000


    If you want to resume a stopped job in the background, you can use the "bg #"
    command:herong$ bg 2


    [2]+ sleep 50000 &


    herong$ jobs


    [1]-  Running                 sleep 100000 &


    [2]+  Running                 sleep 50000 &


    If you want to bring a background job to the foreground, you can use the "fg"
    command:herong$ fg 2


    sleep 100000


    One nice about running a command in the background is that it will to run, even
    if your shell session gets disconnected/closed.[Linux Tutorials - Herong''s Tutorial
    Examples](#text00002.html_a2N5)∟ [Process Management](#text00007.html_a2NA)∟ "tmux"
    - Terminal MultiplexerProvides a tutorial example on how to use ''tmux'' tool
    to manage multiple shells as windows and panes in a single terminal. ''tmux''
    automatically keeps all shells running when the terminal is disconnected.What
    Is "tmux"? - "tmux" is a terminal multiplexer. It lets you switch easily between
    several programs in one terminal, detach them (they keep running in the background)
    and reattach them to a different terminal.Here is the official description of
    "tmux" from its manual page:tmux is a terminal multiplexer: it enables a number
    of terminals to be


    created, accessed, and controlled from a single screen.  tmux may be


    detached from a screen and continue running in the background, then later


    reattached.


    When tmux is started it creates a new session with a single window and


    displays it on screen.  A status line at the bottom of the screen shows


    information on the current session and is used to enter interactive


    commands.


    A session is a single collection of pseudo terminals under the management


    of tmux.  Each session has one or more windows linked to it.  A window


    occupies the entire screen and may be split into rectangular panes,


    each of which is a separate pseudo terminal (the pty(4) manual page


    documents the technical details of pseudo terminals).  Any number of tmux


    instances may connect to the same session, and any number of windows may


    be present in the same session.  Once all sessions are killed, tmux exits.


    Each session is persistent and will survive accidental disconnection


    (such as ssh(1) connection timeout) or intentional detaching (with the


    ‘C-b d’ key strokes).  tmux may be reattached using:


          $ tmux attach


    In tmux, a session is displayed on screen by a client and all sessions


    are managed by a single server.  The server and each client are separate


    processes which communicate through a socket in /tmp.


    "tmux" is a nice tool that reduces the number of remote "ssh" sessions, saves
    time on trying to push processes to the background manually to prevent be killed
    by connection timeouts. Here is what I tried on my CentOS computer.1\. Install
    "tmux":herong$ sudo dnf install tmux


    Installed:


     tmux-2.7-1.el8.x86_64


    2\. Use "tmux" command to start a new "tmux" session, which starts a shell as
    the first pane in the first window of the "tmux" session.herong$ tmux


    (in a child shell in "tmux")


    herong$ exit


    (back to the original shell)


    3\. Use the following hot keys to control its windows and tabs:ctrl-b, %     split
    the screen in half from left to right


    ctrl-b, "     split the screen in half from top to bottom


    ctrl-b, array_key  switch to the pane in different directions


    ctrl-b, c    create a new window


    ctrl-b, 0|1|... switch to a given window


    ctrl-b, d     detach from tmux, leaving it running in the background


    ...


    ctrl-b, ?     display all hot keys


    4\. Use "tmux ls|attach" to list and reattach to a detached or disconnected tmux
    session.herong$ tmux ls


    0: 1 windows (created Tue Aug 25 20:16:44 2020) [122x42]


    herong$ tmux attach


    (old tmux is displayed again)


