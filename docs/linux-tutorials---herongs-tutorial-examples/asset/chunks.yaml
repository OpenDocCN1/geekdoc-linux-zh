  trans: "\n\n3. 将文本文件上传到 `./files` 子目录。不要向 FTP 主目录上传任何文件，该目录仅配置供 `vsftpd` 守护进程访问。\n\
    \n```bash\nftp> put test.txt\nlocal: test.txt remote: test.txt\n229 Entering Extended\
    \ Passive Mode (|||30283|)\n150 Ok to send data.\n226 Transfer complete.\n637\
    \ bytes sent in 4e-05 secs (1592.00 Kbytes/sec)\nftp> dir\n229 Entering Extended\
    \ Passive Mode (|||30217|)\n150 Here comes the directory listing.\n-rw-r--r--\
    \     1 1000      1000           637 Jul 11 10:03 test.txt\n226 Directory send\
    \ O\nftp> cd ..\n250 Directory successfully changed.\nftp> put test.txt\nlocal:\
    \ test.txt remote: test.txt\n229 Entering Extended Passive Mode (|||30871|)\n\
    553 Could not create file.\nftp> exit\n221 Goodbye.\n```\n\n4. 检查日志文件。它可能是 `/var/log/xferlog`\
    \ 或 `/var/log/xferlog:herong$`。\n\n```bash\nsudo tail /var/log/xferlog\n... 1\
    \ ::ffff:192.168.1.11 0 /some.pdf b _ i r joe ftp 0 * i\nherong$ sudo tail /var/log/vsftpd.log\n\
    ... [pid 21901] CONNECT: Client \"::ffff:192.168.1.11\"\n... [pid 21900] [herong]\
    \ OK LOGIN: Client \"::ffff:192.168.1.11\"\n... [pid 21969] [herong] OK UPLOAD:\
    \ Client \"::ffff:192.168.1.11\",\n   \"/files/test.txt\", 3547 bytes, 218.68Kbyte/sec\n\
    ```\n\n酷了！`vsftpd` 守护进程现在在本地运行。请查看下个教程，了解如何配置防火墙允许用户进行远程 FTP。\n\n---\n\n## 在 CentOS\
    \ 上测试远程 FTP 访问\n\n提供了一个教程示例，说明如何在 `vsftpd` 服务器（如果它是在云端提供，则为其防火墙网关）上更新防火墙，为入站连接开放\
    \ 21 和 30000-31000 端口。为了允许用户远程上传和下载文件，我需要打开防火墙，允许用户通过我 CentOS 上的 `vsftpd` 服务器远程上传和下载文件。\n\
    \n1. 找到防火墙的活动区域：\n```bash\nherong$ sudo firewall-cmd --get-active-zones\npublic\n\
    \  interfaces: eno1\n```\n\n2. 在活动区域 \"public\" 中添加预定义的 \"ftp\" 设置，以接收传入的 FTP\
    \ 连接。\n```bash\nherong$ sudo firewall-cmd --zone=public --add-service=ftp\nsuccess\n\
    ```\n\n3. 在活动区域中开放端口范围，以接收传入的 FTP 被动连接。\n```bash\nherong$ sudo firewall-cmd --zone=public\
    \ --add-port=30000-31000/tcp\nsuccess\n```\n\n4. 列出活动区域 \"public\" 中的所有设置：\n```bash\n\
    herong$ sudo firewall-cmd --zone=public --list-all\npublic (active)\n  target:\
    \ default\n  icmp-block-inversion: no\n  interfaces: eno1\n  sources:\n  services:\
    \ cockpit dhcpv6-client ftp http ssh\n  ports: 80/tcp 3306/tcp 30000-31000/tcp\n\
    \  protocols:\n  masquerade: no\n  forward-ports:\n  source-ports:\n  icmp-blocks:\n\
    \  ...\n```\n\n5. 将防火墙更改持久化到配置文件。\n```bash\nherong$ sudo firewall-cmd --runtime-to-permanent\n\
    ```\n\n6. 通过在同一网络的另一台电脑上运行 FTP 客户端程序验证远程访问，假设 192.168.1.3 是 `vsftpd` 服务器电脑的 IP\
    \ 地址。\n```bash\nherong$ ftp 192.168.1.3\nConnected to 192.168.1.3.\n220 (vsFTPd\
    \ 3.0.3)\nName (192.168.1.3:herong): herong\n331 Please specify the password.\n\
    Password:\n230 Login successful.\nRemote system type is UNIX.\nUsing binary mode\
    \ to transfer files.\nftp> dir\n229 Entering Extended Passive Mode (|||30445|)\n\
    150 Here comes the directory listing.\ndrwxr-xr-x     2 1000      1000       \
    \    22 Jul 11 10:03 files\n226 Directory send OK.\nftp> cd files\n250 Directory\
    \ successfully changed.\nftp> dir\n229 Entering Extended Passive Mode (|||30768|)\n\
    150 Here comes the directory listing.\n-rw-r--r--     1 1000      1000       \
    \    637 Jul 11 10:03 test.txt\n226 Directory send OK.\nftp> get test.txt\nlocal:\
    \ test.txt remote: test.txt\n229 Entering Extended Passive Mode (|||30283|)\n\
    150 Ok to send data.\n226 Transfer complete.\n637 bytes sent in 4e-05 secs (1592.00\
    \ Kbytes/sec)\nftp> exit\n221 Goodbye.\n```\n\n太棒了！`vsftpd` 守护进程现在可以本地工作了。\n\n"
