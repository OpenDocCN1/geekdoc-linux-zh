    Installing collected packages: dnspython, protobuf, mysql-connector-python\nFound\
    \ existing installation: protobuf 3.11.3\nSuccessfully uninstalled protobuf-3.11.3\n\
    Successfully installed dnspython-16.0 mysql-connector-python-8.0.19 protobuf-3.6.1\n\
    ```\n\n### 2. If \"pip3\" command fails, install MySQL Connector/Python with \"\
    dnf/yum\" command.\n```bash\nherong$ sudo yum install mysql-connector-python\n\
    ...\n```\n\n### 3. If \"dnf/yum\" command fails, Go to MySQL Connector/Python\
    \ download site at `https://dev.mysql.com/downloads/connector/python/` to download\
    \ the \"Red Hat Linux 8 / Oracle Linux 8 (x86_64-bit) RPM\". Then run the `rpm`\
    \ command to install it.\n```bash\nherong$ sudo rpm -i ....\n```\n\n### 4. Test\
    \ MySQL Connector/Python with the following Python code:\n```python\nherong$ python3\n\
    >>> import mysql.connector\n>>> con = mysql.connector.connect(user='herong', password='Secret',\
    \ host='localhost')\n>>> con.close()\n```\n\n### 5. Read the MySQL Connector/Python\
    \ Developer Guide at `https://dev.mysql.com/doc/connector-python/` to learn more.\n\
    \n---\n\n# Install Python 2 Engine on CentOS\nProvides a tutorial example on how\
    \ to install Python 2 to run old Python scripts and applications on CentOS systems.\
    \ If you still have some old Python scripts written in Python 2 language, you\
    \ need following this tutorial to install the module.\n\n### 1. Check for Python\
    \ 2 packages:\n```bash\nherong$ dnf search python2\npython2.x86_64 : An interpreted,\
    \ interactive, object-oriented programming language\npython2-jinja2.noarch : General\
    \ purpose template engine for python2\npython2-test.x86_64 : The test modules\
    \ from the main python2 package\npython2-docutils.noarch : System for processing\
    \ plaintext documentation for python2\npython2-urllib3.noarch : Python2 HTTP library\
    \ with thread-safe connection pooling and file\n```\n\n### 2. Install Python 2:\n\
    ```bash\nherong$ sudo dnf install python2\n...\nInstalled:\n  python2-2.7.16-12.module_el8.1.0+219+cf9eac9.x86_64\n\
    \  python2-pip-9.0.3-14.module_el8.1.0+219+cf9eac9.noarch\n  python2-setuptools-39.0.1-11.module_el8.1.0+219+cf9eac9.noarch\n\
    \  python2-libs-2.7.16-12.module_el8.1.0+219+cf9eac9.x86_64\n  python2-pip-wheel-9.0.3-14.module_el8.1.0+219+cf9eac9.noarch\n\
    \  python2-setuptools-wheel-39.0.1-11.module_el8.1.0+219+cf9eac9.noarch\nComplete!\n\
    ```\n\n### 3. Verify Python 2 installation:\n```bash\nherong$ python2\nPython\
    \ 2.7.16 (default, Nov 17 2019, 00:07:27) [GCC 8.3.1 20190507 (Red Hat 8.3.1-4)]\
    \ on linux2\n>>> <Ctrl-D>\nherong$ pip2 --version\npip 9.0.3 from /usr/lib/python2.7/site-packages\
    \ (python 2.7)\n```\nCool. I have Python 2 engine and package installer installed\
    \ and ready to run any Python 2 scripts.\n\n---\n\n# vsftpd - Very Secure FTP\
    \ Daemon\nProvides introductions and tutorial examples about `vsftpd` - Very Secure\
    \ FTP Daemon. Topics include installing vsftpd; configuring vsftpd for local user\
    \ access; testing FTP access locally and remotely; enabling FTP over SSL/TLS to\
    \ secure connections.\n"
