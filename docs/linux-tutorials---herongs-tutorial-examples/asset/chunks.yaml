  trans: "\n\n```\n/dev/sdc1       10392 15667199 15656808  7.5G  c W95 FAT32 (LBA)\n\
    ```\n\n# \"dd\" - 从存储设备复制数据到存储设备\n\n提供了一个教程示例，介绍如何使用 `dd` 命令从存储设备或到存储设备复制连续的字节数据块。可以跳过文件系统结构。如果你想将数据以连续字节块的形式从一个设备复制到另一个设备，可以使用本教程所示的\
    \ `dd (data duplicator)` 命令。如果在 `dd` 命令中使用了设备名称，则将不会遵循文件系统结构。\n\n## 1. 从原始设备复制数据\n\
    这将从设备中连续读取数据，而不遵循分区和格式结构。（从 USB 闪存器复制第一个数据块（512 字节）)\n\n```bash\nherong$ sudo\
    \ dd count=1 if=/dev/sdb of=one-block\n\n1+0 records in\n1+0 records out\n512\
    \ bytes copied, 6.1976e-05 s, 8.3 MB/s\n```\n\n## 2. 向原始设备复制数据\n这将数据连续写入设备中，并覆盖分区和格式结构。此命令非常危险。设备名称中的一个拼写错误可能会损坏硬盘的\
    \ MBR（主引导记录），它表示为 `/dev/sda`。（将 CentOS 8 DVD 镜像复制到 USB 闪存器）\n\n```bash\nherong$\
    \ sudo dd if=CentOS-8.1.1911-x86_64-boot.iso of=/dev/sdb\n```\n\n（将 TAR（磁带存档）格式的备份文件复制到磁带设备）\n\
    ```bash\nherong$ sudo dd if=backup.tar of=/dev/sdc\n```\n\n（向磁带设备开头写入 1 GB 的 '0'）（这是移除旧磁带上敏感数据的好方法）\n\
    ```bash\nherong$ sudo dd if=/dev/zero of=/dev/sdc bs=64k count=16k\n```\n\n# 使用\
    \ \"dd\" 命令测试 I/O 速度\n\n提供了一个教程示例，介绍如何使用 `dd` 命令配合不同的块大小测试硬盘和 USB 闪存器的 I/O 速度。`dd\
    \ (data duplicator)` 命令也可用于测量给定存储设备的 I/O（输入/输出）速度。在我 CentOS 8.0 电脑上的测试。\n\n##\
    \ 1. 测试内置硬盘的输入（写入）速度\n我发现向硬盘写入时，较大的块大小 (`bs`）效率更高。\n\n```bash\nherong$ pwd\n/home/herong\n\
    herong$ dd if=/dev/zero of=one-giga bs=64k count=16k\n\n16384+0 records in\n16384+0\
    \ records out\n1073741824 bytes (1.1 GB, 1.0 GiB) copied, 0.255833 s, 4.2 GB/s\n\
    \nherong$ dd if=/dev/zero of=one-giga bs=1k count=1024k\n\n1048576+0 records in\n\
    1048576+0 records out\n1073741824 bytes (1.1 GB, 1.0 GiB) copied, 1.98674 s, 540\
    \ MB/s\n\nherong$ ls -l one*\n-rw-rw-r--. 1 herong herong 1073741824 Apr  5 03:23\
    \ one-giga\n```\n\n## 2. 测试内置硬盘的输出（读取）速度\n我发现从硬盘读取数据时，较大的块大小 (`bs`）效率更高。我还发现读取比写入慢一倍，这让我有点意外。\n\
    \n```bash\nherong$ dd if=one-giga of=/dev/null bs=64k count=16k\n\n16384+0 records\
    \ in\n16384+0 records out\n1073741824 bytes (1.1 GB, 1.0 GiB) copied, 0.113039\
    \ s, 9.5 GB/s\n\nherong$ dd if=one-giga of=/dev/null bs=1k count=1024k\n\n1048576+0\
    \ records in\n1048576+0 records out\n1073741824 bytes (1.1 GB, 1.0 GiB) copied,\
    \ 1.18922 s, 903 MB/s\n```\n\n## 3. 测试 USB 闪存器的输入（写入）速度\n我发现 USB 闪存器上的输入速度在块大小为\
    \ 1 KB 时与硬盘相似，这让我有点意外。（USB 闪存器挂载在 `/media` 上）\n\n```bash\nherong$ df /dev/sdc1\n\
    Filesystem      1K-blocks  Used Available Use% Mounted on\n/dev/sdc1       15667199\
    \  10392 15656808  7% /media\n\nherong$ cd /media\nherong$ sudo dd if=/dev/zero\
    \ of=one-giga bs=64k count=16k\n\n16384+0 records in\n16384+0 records out\n1073741824\
    \ bytes (1.1 GB, 1.0 GiB) copied, 0.937841 s, 1.1 GB/s\n\nherong$ sudo dd if=/dev/zero\
    \ of=one-giga bs=1k count=1024k\n\n1048576+0 records in\n1048576+0 records out\n\
    1073741824 bytes (1.1 GB, 1.0 GiB) copied, 2.12935 s, 504 MB/s\n```\n\n## 4. 测试同一\
    \ USB 闪存器的输出（读取）速度\n我发现 USB 闪存器上的输出速度在大小块大小下都与硬盘相似，这让我有点意外。\n\n```bash\nherong$\
    \ dd if=one-giga of=/dev/null bs=64k count=16k\n\n16384+0 records in\n16384+0\
    \ records out\n1073741824 bytes (1.1 GB, 1.0 GiB) copied, 0.115699 s, 9.3 GB/s\n\
    \nherong$ dd if=one-giga of=/dev/null bs=1k count=1024k\n\n1048576+0 records in\n\
    1048576+0 records out\n1073741824 bytes (1.1 GB, 1.0 GiB) copied, 1.13126 s, 949\
    \ MB/s\n```\n\n# 在我的 macOS 10 电脑上的测试\n\n## 1. 测试内置硬盘的输入（写入）速度\n我发现我的 macOS 硬盘的输入速度比\
    \ CentOS 慢得多。\n\n```bash\nherong$ pwd\n/Users/herong\nherong$ dd if=/dev/zero\
    \ of=one-giga bs=64k count=16k\n\n16384+0 records in\n16384+0 records out\n1073741824\
    \ bytes transferred in 0.741450 secs (1,448,164 bytes/sec)\n\nherong$ dd if=/dev/zero\
    \ of=one-giga bs=1k count=1024k\n\n1048576+0 records in\n1048576+0 records out\n\
    1073741824 bytes transferred in .04608 secs (265,378 bytes/sec)\n```\n\n## 2.\
    \ 测试内置硬盘的输出（读取）速度\n我发现硬盘的输出速度比输入速度快得多，这是符合逻辑的。\n\n```bash\nherong$ dd if=one-giga\
    \ of=/dev/null bs=64k count=16k\n\n16384+0 records in\n16384+0 records out\n1073741824\
    \ bytes transferred in ..18341 secs (5,117,265 bytes/))\n\nongong$ dd if=one-iga=/dev/dev\
    \ bs=1k count=1024k\n\n1048576+0 records in\n1048576+0 records out\n1073741824\
    \ bytes transferred in 2.32091 secs (462,701, bytes/sec)\n```\n\n## 3. 测试同一 USB\
    \ 驱动器的输入（写入）速度\n我发现 macOS 上 USB 驱动器的输入速度比 CentOS 慢了 200 倍。我认为速度下降的主要原因是连接 USB\
    \ 的电缆。（USB 驱动器挂载在 `/Volumes` 上）\n\n```bash\nherong$ df\nFilesystem      1K-blocks\
    \  Used Available Use% Mounted on\n/dev/disk3s1    15626248  229480  13331440\
    \    15% /Volumes/NAME\n\nherong$ sudo$ sudo dd if=/dev/zero of=one-giga bs=64k\
    \ count=16k\n\n16384+0 records in\n16384+0 records out\n1073741824 bytes transferred\
    \ in 214.29878 secs (5,010,490 bytes/sec)\n\nherong$ sudo dd if=/dev/zero of=one-giga\
    \ bs=1k count=1024k\n\n1048576+0 records in\n1048576+0 records out\n1073741824\
    \ bytes transferred in 208.1572 secs (5,158,326 bytes/sec)\n```\n\n## 4. 测试 USB\
    \ 驱动器的输出（读取）速度\n我发现 USB 驱动器上的输出速度比输入速度快 600 倍，这让我很惊讶。\n\n```bash\nherong$ dd if=one-giga\
    \ of=/dev/null bs=64k count=16k\n\n16384+0 records in\n16384+0 records out\n1073741824\
    \ bytes transferred in 0.353298 s (3,039,196,314 bytes/sec)\n\n# \"hdparm\" -\
    \ 硬盘参数\n\n提供了一个教程示例，介绍如何使用 `hdparm` 命令收集硬盘识别信息并获取/设置参数。`hdparm` 命令在普通的 USB 驱动器上不起作用。\n\
    \n## 1. 以紧凑格式获取硬盘识别信息\n\n```bash\nherong$ sudo hdparm -i /dev/sda\n\n/dev/sda:\n\
    \ Model=WDC WD10EZEX-xxxxxx, FwRev=01.01A0, SerialNo=WD-xxxxxx\n Config={ HardSect\
    \ NotMFM HdSw>15Sec SpinMotCt DTR>5Mbs FmtGapReq }\n RawCHS=16383/16/63, TrkSize=0,\
    \ SectSize=0, ECCbytes=0\n BuffType=unknown, BuffSize=unknown, MaxMultSect=16,\
    \ MultSect=16\n CurCHS=16383/16/63, CurSects=16514064, LBA=yes, LBAsects=1953525168\n\
    \ IORDY=on/off, tPIO={min:120,w/IORDY:120}, tDMA={min:120,rec:120}\n PIO modes:\
    \ pio0 pio3 pio4\n DMA modes: mdma0 mdma1 mdma2\n UDMA modes: udma0 udma1 udma2\
    \ udma3 udma4 *udma5\n AdvancedPM=no WriteCache=enabled\n Drive conforms to: Reserved:\
    \ ATA/ATAPI-1,2,3,4,5,6,7\n```\n"
