    | /.autofs | | system_u:object_r:etc_runtime_t:s0 |

    | /afs | | system_u:object_r:mnt_t:s0 |

    | /bacula(/)? | | system_u:object_r:bacula_store_t:s0 |

    | /bin | | system_u:object_r:bin_t:s0 |

    | /bin/.* | | system_u:object_r:bin_t:s0 |

