    \ repository\npygments-json (0.1)             - Pygments JSON formatter\npretty-json\
    \ (1.2.0)             - make pretty json\n...\n```\n\n### 4. Sometimes, \"pip3\"\
    \ command may fail due to network connection issue. Just try it again later. \n\
    ```bash\nherong$ pip3 search json\nRetrying (Retry(total=4, connect=None, read=None,\
