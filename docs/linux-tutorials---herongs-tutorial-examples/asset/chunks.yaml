  trans: "\n\n状态: 正在初始化 TLS...\n状态: 正在验证证书...\n状态: TLS 连接已建立。\n状态: 已登录\n状态: 正在检索目录列表...\n\
    状态：\"/\" 目录列表成功\n\n太棒了！我的 FTP 连接现在已经安全了。\n\n## 为 FTP 用户禁用 SSH 访问\n\n提供了一个教程示例，介绍如何在\
    \ CentOS 系统上禁用某个用户的 SSH 登录访问，并允许其仅使用 FTP 服务进行文件的上传和下载。某些时候，你可能想创建一个用户，并允许其仅使用\
    \ FTP 服务，而不允许其使用 SSH（安全外壳）服务登录到你的 CentOS 系统。这可以通过在 `sshd`（SSH 守护进程）配置中禁用其访问来实现。以下是我创建\
    \ \"john\" 作为 FTP 用户并并在 `sshd` 配置中禁用其访问的操作。\n\n### 1. 创建用户 \"john\"\n```bash\n\
    herong$ sudo useradd john\nherong$ sudo passwd john\n正在为用户 john 更改密码。\n```\n\n\
    ### 2. 为 John 启用 FTP 访问\n```bash\nherong$ sudo vi /etc/vsftpd/user_list\n...\n\
    herong\njohn\nherong\nherong$ sudo systemctl restart vsftpd\n```\n\n### 3. 为 John\
    \ 创建 FTP 家目录\n```bash\nsudo mkdir /home/john/ftp\nsudo chown nobody:nobody /home/john/ftp\n\
    sudo mkdir /home/john/ftp/private\nsudo chown john:john /home/john/ftp/private\n\
    ```\n\n### 4. 为 John 禁用 SSH 访问\n```bash\nherong$ sudo vi /etc/ssh/sshd_config\n\
    ...\n#  ForceCommand cvs server\nUseDNS no\nAddressFamily inet\nSyslogFacility\
    \ AUTHPRIV\nPermitRootLogin yes\nPasswordAuthentication yes\nDenyUsers guest john\n\
    herong$ sudo systemctl restart sshd\n```\n\n### 5. 验证 SSH 访问。它应该被拒绝。\n```bash\n\
    FYIs-MacBook-Pro:src herong$ ssh john@192.168.1.3\njohn@192.168.1.3 的密码:\n权限被拒绝，请重试。\n\
    john@192.168.1.3 的密码:\n```\n现在 John 可以在我的 CentOS 计算机上远程上传下载文件。但他不能远程 SSH 登录。\n\
    \n## Linux 系统上的 GCC - C/C++ 编译器\n\n提供了关于 GCC C/C++ 编译器的介绍和教程示例。主题包括安装 GCC C/C++\
    \ 编译器；GCC 编译步骤和设置；用于包含头文件的 `g++ -I`；用于静态/动态库文件的 `g++ -l`；用于构建共享对象（动态库）文件的 `g++\
    \ -shared`；用于检查动态库依赖的 `ldd`；用于自动化的 `make` 工具。\n\n### 核心点：\n* 在 CentOS 系统上，可以使用\
    \ `dnf install gcc` 和 `dnf install gcc-c++` 命令安装 GCC C/C++ 编译器。\n* 使用 `php -i`\
    \ 命令可以输出 PHP 环境信息。\n* 头文件包含路径可以通过 `g++ -I...` 选项或 `CPATH` 环境变量指定。\n* 静态库和动态库文件可以通过\
    \ `g++ -l... -l...` 选项指定。\n* 在链接时，可以通过 `g++ -L...` 选项或 `LIBRARY_PATH` 环境变量指定静态库和动态库文件路径。\n\
    * 在执行加载时，可以通过 `LD_LIBRARY_PATH` 环境变量指定动态库路径。\n* 使用 `ldd` 命令可以列出任何可执行程序的动态库依赖。\n\
    * C/C++ 程序的构建（编译、链接等）可以通过 `make` 工具自动化，该工具使用 `Makefile` 来定义构建过程中涉及的任务。\n\n## 安装\
    \ GCC C/C++ 编译器\n\n提供了一个关于如何在 CentOS 系统上安装 GCC C/C++ 编译器的教程示例。如果你想开发自己的 C/C++\
    \ 或编译第三方 C/C++ 源代码，你需要按照本教程所示安装 GCC C/C++ 编译器。\n\n### 1. 安装 GCC 编译器\n```bash\n\
    herong$ dnf info gcc\n可用软件包\nName:         gcc\nVersion:      8.3.1\nRelease:\
    \      4.5.el8\nArchitecture: x86_64\nSize:         23 M\nSource:       gcc-8.3.1-4.5.el8.rpm\n\
    存储库:       AppStream\nSummary:      各种编译器 (C, C++, Objective-C, ...)\nURL:   \
    \       http://gcc.gnu.org\nLicense:      GPLv3+ and GPLv3+ with exceptions and\
    \ GPL2+ with ...\nDescription:  gcc 包包含第 8 版本的 GNU 编译器集。你需要此包来编译代码。\nherong$ sudo\
    \ dnf install gcc\n...\n已安装:\n  gcc-8.3.1-4.5.el8.x86_64\n  annobin-8.7.el8.x86_64\n\
    \  cpp-8.3.1-4.5.el8.x86_64\n  isl-0.16.1.el8.x86_64\n  glibc-devel-2.28-72.el8.x86_64\n\
    \  glibc-headers-2.28-72.el8.x86_64\n  kernel-headers-4.18.0-147.5.1.el8_1.x86_64\n\
    ```\n\n### 2. 验证 GCC 安装\n```bash\n# 预处理器\nherong$ cpp --version\ncpp (GCC) 8.3.1\n\
    \n# C 编译器\nherong$ gcc --version\ngcc (GCC) 8.3.1\n\n# GNU 项目\nherong$ gcc --version\n\
    gcc (GCC) 8.3.1\n\n# 别名\nherong$ ls -l /usr/bin/cc\nlrwxrwxrwx 1 root root 7 May\
    \  5 23:36 /usr/bin/cc -> gcc\n```\n\n### 3. 编译并运行 C 程序\n```bash\nherong$ vi hello.c\n\
    #include<stdio.h>\nint main(void) {\n  printf(\"Hello world!\\n\");\n  return\
