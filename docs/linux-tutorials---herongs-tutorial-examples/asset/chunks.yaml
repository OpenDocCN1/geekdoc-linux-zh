    herong$ sudo dnf install php-mysqlnd\nInstalled:\n php-mysqlnd-7.2.11-2.module_el8.1.0+209+03b98ff.x86_64\n\
    \ php-pdo-7.2.11-2.module_el8.1.0+209+03b98ff.x86_64\nComplete!\n```\nIf you see\
    \ more errors on undefined functions, you can continue to search and install additional\
    \ PHP modules with the `yum` command.\n\n### Files Used in PHP \"include\" Statements\n\
    \nProvides a tutorial example on how to the PHP engine search for files given\
    \ in the `include` statements. When you use the `include` statement to execute\
    \ script stored in a separate file, the PHP engine uses the following rules to\
    \ search and find the script file.\n\n#### 1. If an absolute path is given together\
    \ with the file name, the PHP engine will search for the file in the directory\
    \ of the given absolute path only. For example, the following code will search\
    \ for `include_extra.php` in `/usr/share/php` directory only.\n\n```php\n<?php\n\
    \  include \"/usr/share/php/include_extra.php\";\n?>\n```\n\n#### 2. If a relative\
    \ path is given together with the file name, the PHP engine will search for the\
    \ file in the directory of the given path relative to the current working directory,\
    \ which may not be the same as the directory of the calling script is located.\
    \ For example, the following code will search for `include_extra.php` in the same\
    \ directory where the code is executed.\n\n```php\n<?php\n  include \"./include_extra.php\"\
    ;\n?>\n```\n"
