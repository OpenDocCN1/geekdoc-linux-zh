- fmt: "\n- `php.x86_64` : PHP scripting language for creating dynamic web sites\n\
    - `php-common.x86_64` : Common files for PHP\n- `php-fpm.x86_64` : PHP FastCGI\
    \ Process Manager\n- `php-dbg.x86_64` : The interactive PHP debugger\n- `php-cli.x86_64`\
    \ : Command-line interface for PHP\n- `php-xml.x86_64` : A module for PHP applications\
    \ which use XML\n- `php-json.x86_64` : JavaScript Object Notation extension for\
