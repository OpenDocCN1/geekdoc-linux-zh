- fmt: "\n```\n/dev/sdc1       10392 15667199 15656808  7.5G  c W95 FAT32 (LBA)\n\
    ```\n\n# \"dd\" - Copy Data from/to Storage Devices\n\nProvides a tutorial example\
    \ on how to copy continuous blocks of data bytes from or to storage devices using\
    \ the `dd` command. File system structures can be bypassed. If you want to copy\
    \ data as continuous blocks of bytes from one device to another, you can use the\
    \ `dd (data duplicator)` command as shown in this tutorial. If device names are\
    \ used in `dd` commands, file system structures are not respected.\n\n## 1. Copy\
    \ data from a raw device\nThis will read data continuously from the device without\
    \ respecting the partition and format structures. (copy the first block (512 bytes)\
    \ from a USB drive)\n\n```bash\nherong$ sudo dd count=1 if=/dev/sdb of=one-block\n\
    \n1+0 records in\n1+0 records out\n512 bytes copied, 6.1976e-05 s, 8.3 MB/s\n\
    ```\n\n## 2. Copy data to a raw device\nThis will write data continuously to the\
    \ device and whipping out the partition and format structures. This command is\
    \ very dangerous. One typo in the device name could damage the MBR (Master Boot\
    \ Record) of the hard disk, which is represented as `/dev/sda`. (copy CentOS 8\
    \ DVD image to a USB drive)\n\n```bash\nherong$ sudo dd if=CentOS-8.1.1911-x86_64-boot.iso\
    \ of=/dev/sdb\n```\n\n(copy a backup file in TAR (Tape ARchiving) format to a\
    \ tape device)\n```bash\nherong$ sudo dd if=backup.tar of=/dev/sdc\n```\n\n(copy\
    \ 1 GB of '0' to the beginning of a tape device) (this is a good way to remove\
    \ sensitive data on old tapes)\n```bash\nherong$ sudo dd if=/dev/zero of=/dev/sdc\
    \ bs=64k count=16k\n```\n\n# Use \"dd\" Command to Test I/O Speed\n\nProvides\
    \ a tutorial example on how to test I/O speed of hard disk and USB drives using\
    \ the `dd` command with different block sizes. The `dd (data duplicator)` command\
    \ can also be used to measure I/O (Input/Output) speed of a given storage device.\
    \ Tests on my CentOS 8.0 computer.\n\n## 1. Test input (writing) speed of the\
    \ internal hard disk\nI see that bigger block size (`bs`) is more efficient when\
    \ writing to the hard disk.\n\n```bash\nherong$ pwd\n/home/herong\nherong$ dd\
    \ if=/dev/zero of=one-giga bs=64k count=16k\n\n16384+0 records in\n16384+0 records\
    \ out\n1073741824 bytes (1.1 GB, 1.0 GiB) copied, 0.255833 s, 4.2 GB/s\n\nherong$\
    \ dd if=/dev/zero of=one-giga bs=1k count=1024k\n\n1048576+0 records in\n1048576+0\
    \ records out\n1073741824 bytes (1.1 GB, 1.0 GiB) copied, 1.98674 s, 540 MB/s\n\
    \nherong$ ls -l one*\n-rw-rw-r--. 1 herong herong 1073741824 Apr  5 03:23 one-giga\n\
    ```\n\n## 2. Test output (reading) speed of the internal hard disk\nI see that\
    \ bigger block size (`bs`) is more efficient when reading from the hard disk.\
    \ I also see that reading is two times slower than writing, which is a little\
    \ surprise to me.\n\n```bash\nherong$ dd if=one-giga of=/dev/null bs=64k count=16k\n\
    \n16384+0 records in\n16384+0 records out\n1073741824 bytes (1.1 GB, 1.0 GiB)\
    \ copied, 0.113039 s, 9.5 GB/s\n\nherong$ dd if=one-giga of=/dev/null bs=1k count=1024k\n\
    \n1048576+0 records in\n1048576+0 records out\n1073741824 bytes (1.1 GB, 1.0 GiB)\
    \ copied, 1.18922 s, 903 MB/s\n```\n\n## 3. Test input (writing) speed of a USB\
    \ drive\nI see that the input speed on USB drive is about the same as the hard\
    \ disk with block size of 1 KB, which is a little surprise to me. (USB drive is\
    \ mounted on `/media`)\n\n```bash\nherong$ df /dev/sdc1\nFilesystem      1K-blocks\
    \  Used Available Use% Mounted on\n/dev/sdc1       15667199  10392 15656808  7%\
    \ /media\n\nherong$ cd /media\nherong$ sudo dd if=/dev/zero of=one-giga bs=64k\
    \ count=16k\n\n16384+0 records in\n16384+0 records out\n1073741824 bytes (1.1\
    \ GB, 1.0 GiB) copied, 0.937841 s, 1.1 GB/s\n\nherong$ sudo dd if=/dev/zero of=one-giga\
    \ bs=1k count=1024k\n\n1048576+0 records in\n1048576+0 records out\n1073741824\
    \ bytes (1.1 GB, 1.0 GiB) copied, 2.12935 s, 504 MB/s\n```\n\n## 4. Test output\
    \ (reading) speed of the same USB drive\nI see that the output speed on USB drive\
    \ is about the same as the hard disk for both large and small sizes, which is\
    \ a little surprise to me.\n\n```bash\nherong$ dd if=one-giga of=/dev/null bs=64k\
    \ count=16k\n\n16384+0 records in\n16384+0 records out\n1073741824 bytes (1.1\
    \ GB, 1.0 GiB) copied, 0.115699 s, 9.3 GB/s\n\nherong$ dd if=one-giga of=/dev/null\
    \ bs=1k count=1024k\n\n1048576+0 records in\n1048576+0 records out\n1073741824\
    \ bytes (1.1 GB, 1.0 GiB) copied, 1.13126 s, 949 MB/s\n```\n\n# Tests on my macOS\
    \ 10 computer\n\n## 1. Test input (writing) speed of the internal hard disk\n\
    I see that the input speed of my macOS hard disk is much slower than CentOS.\n\
    \n```bash\nherong$ pwd\n/Users/herong\nherong$ dd if=/dev/zero of=one-giga bs=64k\
    \ count=16k\n\n16384+0 records in\n16384+0 records out\n1073741824 bytes transferred\
    \ in 0.741450 secs (1,448,164,705 bytes/sec)\n\nherong$ dd if=/dev/zero of=one-giga\
    \ bs=1k count=1024k\n\n1048576+0 records in\n1048576+0 records out\n1073741824\
    \ bytes transferred in 4.046084 secs (265,378,040 bytes/sec)\n```\n\n## 2. Test\
    \ output (reading) speed of the internal hard disk\nI see that the output speed\
    \ is much faster than input speed, which makes sense.\n\n```bash\nherong$ dd if=one-giga\
    \ of=/dev/null bs=64k count=16k\n\n16384+0 records in\n16384+0 records out\n1073741824\
    \ bytes transferred in 0.218341 secs (4,917,726,275 bytes/sec)\n\nherong$ dd if=one-giga\
    \ of=/dev/null bs=1k count=1024k\n\n1048576+0 records in\n1048576+0 records out\n\
    1073741824 bytes transferred in 2.320591 secs (462,701,888 bytes/sec)\n```\n\n\
    ## 3. Test input (writing) speed of the same USB drive\nI see that the input speed\
    \ on the same USB drive on macOS is about 200 times slower than CentOS. I think\
    \ the main cause of the speed drop is the USB to USB-C cable used to connect the\
    \ USB drive. (USB drive is auto mounted on `/Volumes/NO NAME`)\n\n```bash\nherong$\
    \ df\nFilesystem      512-blocks  Used Available Capacity Mounted on\n/dev/disk3s1\
    \    15626248  2294808  13331440    15% /Volumes/NO NAME\n\nherong$ cd '/Volumes/NO\
    \ NAME'\nherong$ sudo dd if=/dev/zero of=one-giga bs=64k count=16k\n\n16384+0\
    \ records in\n16384+0 records out\n1073741824 bytes transferred in 214.298787\
    \ secs (5,010,490 bytes/sec)\n\nherong$ sudo dd if=/dev/zero of=one-giga bs=1k\
    \ count=1024k\n\n1048576+0 records in\n1048576+0 records out\n1073741824 bytes\
