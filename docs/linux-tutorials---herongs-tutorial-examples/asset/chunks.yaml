    \ files.\nftp> dir\n229 Entering Extended Passive Mode (|||30675|)\n150 Here comes\
    \ the directory listing.\ndr-xr-xr-x  2 1000    1000           6 Jun 23 09:08\
    \ files\n226 Directory send OK.\n```\n"
