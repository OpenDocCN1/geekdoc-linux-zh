  trans: "\n太棒了。现在我可以在 CentOS 计算机上读取 Windows 磁盘上的旧文件了！\n\n# W95 Ext'd (LBA) 分区\n\n\
    对 `W95 Ext'd LBA`（Windows 95 扩展逻辑块体系）区的快速介绍，它实际上是一个包含子分区的容器。如果你在使用从 Windows 计算机创建的硬盘，你可能会看到一个类型为\
    \ `W95 Ext'd (LBA)` 的特殊分区。`W95 Ext'd (LBA)` 代表 Windows 95 扩展逻辑块体系。\n\n`W95 Ext'd\
    \ LBA` 并不是文件系统分区。它实际上是一个包含子分区的容器。在 Windows 系统上，硬盘最多只能分为 4 个分区。`W95 Ext'd LBA`\
    \ 技术允许你从这 4 个主分区创建更多的子分区。如果你看到一个硬盘有超过 4 个分区，或者看到分区索引高于 4 的分区，你就知道该硬盘上使用了 `W95\
    \ Ext'd LBA`。\n\n例如，我的 CentOS 计算机上有以下分区：\n\n```bash\nherong$ sudo fdisk -l /dev/sda\n\
    \nDisk /dev/sda: 900.0 GiB\nUnits: sectors of 1 * 512 = 512 bytes\nSector size\
    \ (logical/physical): 512 bytes / 4096 bytes\nI/O size (minimum/optimal): 4096\
    \ bytes / 4096 bytes\nDisklabel type: dos\nDevice     Boot       Start       \
    \  End      Sectors    Size Id Type\n/dev/sda1  *             2048  167776255\
    \  167774208     80G  7 HPFS/NTFS/exFAT\n/dev/sda2             167776256 1953523711\
    \ 1785747456 851.5G  f W95 Ext'd (LBA)\n/dev/sda5             167778304 1748721663\
    \ 1580943360 753.9G  7 HPFS/NTFS/exFAT\n/dev/sda6             1748723712 1750820863\
    \     20971522      1G 83 Linux\n/dev/sda7             1750822912 1953523711 \
    \ 202700800   96.7G 8e Linux LVM\n```\n\n输出告诉我：\n* 硬盘只有 2 个主分区 `/dev/sda1` 和 `/dev/sda2`。\n\
    * `/dev/sda1` 有 80 GB 的 Windows NTFS 格式，并带有引导区以用于我的 Windows 系统。\n* `/dev/sda2`\
    \ 有 850 GB 的 `W95 Ext'd LBA` 格式，包含 3 个子分区：`/dev/sda5`、`/dev/sda6` 和 `/dev/sda7`。\n\
    * `/dev/sda5` 是 753 GB 的 Windows NTFS 格式子分区。\n* `/dev/sda6` 是 1 GB 的 Linux 格式子分区，用于存放\
    \ Linux 的 `/root` 文件。\n* `/dev/sda7` 是 96 GB 的 Linux LVM 格式子分区，用于我的 Linux 系统。\n\
    \n因此，不要尝试将 `W95 Ext'd LBA` 格式的 `/dev/sda2` 挂载到 Linux 系统，它不是真正的文件系统。\n\n# 文件系统类型、ID\
    \ 和格式\n\n列出了 Linux 系统上常用的文件系统格式及其识别代码。如果你从朋友那里收到一个存储设备，你可能会在 Linux 计算机上挂载其分区时遇到困难。这是因为该存储设备可能是用\
    \ Linux 无法识别的文件系统格式创建的。为了帮助你处理这种情况，这里是常用文件系统格式列表及处理建议。\n\n1. **Linux** - `Linux\
    \ (ID: 83)` 用于识别一些旧的 Linux 原生文件系统，如 `xiafs`、`ext2`、`ext3`、`reiserfs` 等。它仍可能用于存放现代\
    \ Linux 系统（如 CentOS）上的 `/root` 文件。\n2. **Linux LVM** - `Linux LVM (ID: 8e)` 用于识别\
    \ Linux LVM（逻辑卷管理器）分区。它在 CentOS 系统中作为主文件系统。\n3. **Linux Swap** - `Linux Swap (ID:\
    \ 82)` 用于识别 Linux 交换分区。\n4. **FAT16** - `FAT16 (ID: 6)` 用于识别 16 位 FAT（文件分配表）分区，由旧的\
    \ DOS（磁盘操作系统）计算机使用。大多数 Linux 系统默认支持 FAT16。\n5. **NTFS** - `NTFS (ID: 7)` 用于识别\
    \ NTFS（新技术文件系统）分区，由旧 Windows 计算机使用。你可能需要安装 `ntfs-3g` 设备来支持它。\n6. **HPFS** - `HPFS\
    \ (ID: 7)` 用于识别旧操作系统计算机使用的 HPFS（可安装文件系统）。你需要安装特殊的设备驱动来支持它。\n7. **exFAT** - `exFAT\
    \ (ID: 7)` 用于识别 exFAT（扩展文件分配表）分区，由旧 Windows Vista 使用。你可能需要安装 `fuse-exfat` 设备来支持它。\n\
    8. **W95 Ext'd LBA** - `W95 Ext'd LBA (ID: f)` 用于识别 Windows 95 扩展 LBA（逻辑块体系）分区。注意\
    \ `W95 Ext'd LBA` 不是文件系统。它实际上是一个包含子分区的容器。在 Windows 系统上，硬盘最多只能分为 4 个分区。`W95 Ext'd\
    \ LBA` 技术允许你从这 4 个主分区创建更多的子分区。\n9. **OpenBSD** - `OpenBSD (ID: a6)` 用于识别 OpenBSD（伯克利软件发行）分区，由\
    \ OpenBSD 计算机使用。你需要安装特殊的设备驱动来支持它。\n10. **Mac OS-X** - `Mac OS-X (ID: a8)` 用于识别\
    \ Mac OS-X 分区，由 Mac OS-X 计算机使用。你需要安装特殊的设备驱动来支持它。\n\n# 安装 CentOS\n\n提供了安装 Linux\
    \ 系统的教程。主题包括下载 CentOS ISO 文件；使用 `dd` 复制镜像文件创建可启动 USB 盘；从可启动 USB 盘安装 CentOS。\n\n\
    ### 总结\n* 你可以在 macOS 计算机上下载 ISO ISO 并使用 `dd` 命令创建可启动的 USB 盘。\n* 如果硬盘上有足够的可用空间，从可启动\
    \ USB 盘安装 CentOS 系统是非常直接的。\n* 你可以使用内置的磁盘工具删除现有分区以腾出空间。\n\n## 创建可启动 USB\n提供了一个如何在\
    \ macOS 计算机上下载完整的 CentOS ISO 文件并创建可启动 USB 盘的教程示例。CentOS 8 是 CentOS 系统的最新发布版本，它是\
    \ RHEL（红帽企业 Linux）的开源版本。如果你想尝试，可以按照下面的描述遵循我的做法来下载 CentOS 8.1 ISO 文件并创建可启动 USB\
    \ 盘。\n\n1. 访问 CentOS 下载网站 `https://wiki.centos.org/Download`。我看到了 CentOS 8、7 和\
    \ 6 的下载选项。\n2. 点击 `CentOS 8.1 (1911)` 旁边的 `mirrors` 按钮。我看到了下载镜像站列表。\n3. 选择一个离你最近的站点，例如\
    \ `http://centos.les.net/`。我看到两个 ISO 镜像文件：`CentOS-8.1.1911-x86_64-boot.iso` 和\
    \ `CentOS-8.1.1911-x86_64-dvd1.iso`。它们适用于具有 `x86_64` CPU 架构的计算机。\n    * `boot.iso`\
    \ 要小得多，只包含可启动的 CentOS 8 内内核。使用 `boot.iso` 安装 CentOS 8 时，需要在线下载额外的系统和应用程序包。\n \
    \   * `dvd1.iso` 要大得多，包含了所有系统包和基础应用程序包。你可以使用 `dvd1.iso` 安装 CentOS 8，而无需从互联网下载任何内容。\n\
    4. 点击 `CentOS-8.1.1911-x86_64-dvd1.iso` 并将其保存到我的 macOS 计算机。我选择了 `CentOS-8.1.1911-x86_64-dvd1.iso`，因为它匹配我想安装\
    \ CentOS 的联想计算机所使用的 CPU 架构 `x86_64`。你可以通过进入镜像站的父目录来选择其他架构的 ISO 文件。\n5. 等待下载完成，这可能需要时间。\n\
    6. 在我的 macOS 计算机上使用 `dd` 命令将 `CentOS-8.1.1911-x86_64-dvd1.iso` 拷贝到 USB 盘。你也可以通过\
    \ `Etcher` 或 `Rufus` ISO 工具来完成，这比使用 `dd` 命令安全得多。\n\n```bash\nmacOS$ df\n```\n"
