    # 在 CentOS 上监控网络服务

    提供了一个教程示例，介绍如何使用不同的工具如 `netstat`（网络状态）、`lsof`（打开文件列表）、`ss`（套接字统计）来监控 CentOS 系统上的网络服务。在配置了网络防火墙后，下一个任务是监控网络服务。以下是可以在
    CentOS 8 系统上使用的工具：


