    ```\n\n### 5. 验证 GCC 安装\n```bash\n# C++ 编译器\nherong$ g++ --version\ng++ (GCC)\
    \ 8.3.1\n```\n\n### 6. 编译并运行 C++ 程序\n```bash\nherong$ vi hello.cpp\n#include <iostream>\n\
    int main(void) {\n  std::cout << \"Hello world from C++.\\n\";\n  return 0;\n\
    }\nherong$ g++ hello.cpp\nherong$ ./a.out\nHello world from C++.\n```\n\n## \"\
