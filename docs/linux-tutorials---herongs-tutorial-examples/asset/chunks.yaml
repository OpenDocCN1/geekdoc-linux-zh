    # Linux Tutorials- Herong''s Tutorial Examples


    ![](Image00002.jpg)


    1.20, 2020Dr. Herong Yang© 2020 Dr. Herong Yang. All rights reserved.


    This book is a collection of notes and sample codes written by the author while
    he was learning Linux systems. Topics include using network configuration and
    security firewall; managing Linux file systems; installing CentOS systems; using
    SELinux (Security-Enhanced Linux) system; DNF/YUM software package manager; managing
    MySQL server; developing Python and PHP scripts; using GCC C/C++ compilers; managing
    `vsftpd` - Very Secure FTP daemon; running `Conda` - Environment and Package Manager.
    Updated in 2020 (Version 1.20) with SELinux tutorials. For latest updates and
    free sample chapters, visit http://www.herongyang.com/Linux.


