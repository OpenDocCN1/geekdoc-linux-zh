    # SELinux - 安全增强型 Linux


    ## 什么是 SELinux (安全增强型 Linux)

    提供了 SELinux（安全增强型 Linux）的快速介绍，它由两个部分组成：安全服务器和策略数据库。它们共同工作，为想要访问 Linux 系统上给定对象的实体提供安全服务。


    ### 什么是 SELinux (安全增强型 Linux)？

    SELinux 是针对 Linux® 系统的一种安全架构，允许管理员对谁可以访问系统拥有更多控制权。它最初由美国国家安全局（NSA）开发，是通过 Linux
    安全模块（`LSM`）对 Linux 内核系列补丁。


    SELinux 由两个部分组成：SELinux 安全服务器和 SELinux 策略数据库。如下所示，它们共同工作，为想要访问 Linux 系统上给定对象的实体提供安全服务（来源：mit.edu）：


    ![](img/Image00005.jpg)


    ### SELinux - 访问权限决策过程

    当主体（例如，应用程序）尝试访问对象（例如，文件）时，内核中的策略执行服务器会检查访问向量缓存（`AVC`），其中缓存了主体和对象的权限。如果无法根据 AVC
    中的数据做出决策，请求将继续传递到安全服务器，并在矩阵中查找应用程序和文件的安全上下文。然后授予或拒绝权限，如果权限被拒绝，则会在 `/var/log/messages`
    中详细记录 `avc: denied` 消息。主体和对象的安全上下文应用自安装的策略，该策略还为填充安全服务器的矩阵提供信息。


    当 SELinux 运行并强制执行时，你的 Linux 系统将有两个级别的安全控制同时运行，这会给你带来更多困惑，但会为你提供一个更安全的环境。


    *   **Linux 默认访问控制**：一种 DAC（自主访问控制）类型的权限系统，基于所有权（用户、组和其他其它用户）和访问类型（读、写和执行）的访问控制矩阵。

    *   **SELinux 访问控制**：一种 MAC（强制访问控制）类型的权限系统，基于存储在策略数据库中的显式访问规则。


    因此，用户可能拥有 Linux 默认访问控制的读取文件的权限，但仍被 SELinux 访问控制拒绝。更多信息请参阅 “USING SELINUX” 指南。


    ## CentOS  SELinux 配置和状态

    提供了一个教程示例，说明如何通过查看 `/etc/sysconfig/selinux` 文件查看当前的 SELinux 配置，并通过运行 `/usr/sbin/sestatus`
    命令查看当前的 SELinux 状态。


    如果你正在运行 CentOS 8 系统，SELinux 默认安装并运行。你可以通过查看 `/etc/sysconfig/selinux` 文件查看当前的 SELinux
    配置。以下是我 CentOS 8 上的配置：


    ```bash

    herong$ more /etc/sysconfig/selinux


    # 此文件控制系统上 SELinux 的状态。

    # SELINUX= 可以取以下三个值之一：

    #      enforcing - 强制执行 SELinux 安全策略。

    #      permissive - SELinux 打印警告而不是强制执行。

    #      disabled - 不加载任何 SELinux 策略。

    SELINUX=enforcing


    # SELINUXTYPE= 可以取以下三个值之一：

    #      targeted - 保护目标进程，

    #      minimum - 修改目标策略。仅保护选定的进程。

    #      mls - 多级安全保护。

    SELINUXTYPE=targeted

    ```


    因此，我在“targeted”进程上以“enforcing”模式运行 SELinux。如果你想查看 SELinux 的当前状态，可以运行 `/usr/sbin/sestatus`
    命令：


    ```bash

    herong$ /usr/sbin/sestatus -v


    SELinux status:               enabled

    SELinuxfs mount:              /sys/fs/selinux

    SELinux root directory:       /etc/selinux

    Loaded policy name:           targeted

    Current mode:                 enforcing

    Mode from file:              enforcing

    Policy MLS:                   enabled

    Policy deny_unknown:         allowed

    Memory protection:            (secure)

    Max kernel version:           3

    Process contexts:

    Current context:              unconfined_u:unconfined_r:unconfined_t:s0-s0:c0.c123

    Init context:                system_u:system_r:init_t:s0

    File contexts:

    Controlling terminal:          unconfined_u:object_r:user_pts_t:s0

    /etc/passwd                   system_u:object_r:passwd_file_t:s0

    /etc/shadow                   system_u:object_r:shadow_t:s0

    /bin/bash                     system_u:object_r:shell_exec_t:s0

    /bin/login                    system_u:object_r:login_exec_t:s0

    /bin/sh                      system_u:object_r:bin_t:s0 -> system_u:object_r:shell_exec_t:s0

    /sbin/agetty                  system_u:object_r:getty_exec_t:s0

    /sbin/init                    system_u:object_r:bin_t:s0 -> system_u:object_r:init_exec_t:s0

    /usr/sbin/sshd                system_u:object_r:sshd_exec_t:s0

    ```


    ## 什么是 SELinux 用户

    提供了关于 SELinux 用户的快速介绍，以及一个如何查看当前 SELinux 用户映射以及为特定用户更改 SELinux 用户映射的教程示例。SELinux
    使用了几个基本概念：SELinux 用户、SELinux 角色、SELinux 域和 SELinux 类型。它们共同用于以以下形式定义 SELinux 安全策略：


    *   “SELinux 用户”可以扮演“SELinux 角色”

    *   “SELinux 角色”可以进入“SELinux 域”

    *   “SELinux 域”拥有对“SELinux 类型”的访问权限


    SELinux 用户是一个抽象概念，代表 Linux 系统上的一组真实用户，作为 SELinux 系统中的安全实体（subject）。默认情况下，SELinux
    具有以下预定义的 SELinux 用户：


    *   `guest_u`：供具有最低权限的用户使用。`guest_u` 用户没有网络访问权限，在 `/home` 中没有脚本执行权限，无法使用 `sudo`
    或 `su` 命令获取更高权限。

    *   `root`：供具有最高权限的 root 用户使用。

    *   `staff_u`：供需要同时执行非管理和管理任务的用户使用。`staff_u` 用户具有 GUI、网络访问权限，并可以使用 `sudo` 命令。

    *   `sysadm_u`：供仅执行管理任务的用户使用。`sysadm_u` 用户可以执行像 `staff_u` 用户的所有任务，此外他可以使用 `su`
    命令。

    *   `system_u`：供运行系统的特殊用户使用。

    *   `unconfined_u`：供除目标服务外几乎没有任何限制的用户使用。

    *   `user_u`：供没有特殊权限的普通用户使用。

    *   `xguest_u`：类似于 `guest_u` 用户。`xguest_u` 用户拥有与 `guest_u` 用户相同的权限，此外它可以访问 GUI
    和网络，但仅通过 Firefox 浏览器。


    以下是我在 CentOS 8 计算机上的操作，用于查看 Linux 用户是如何映射到 SELinux 用户的，并更改 "john" 的映射以禁止其使用互联网。要查看
    Linux 用户如何映射到 SELinux 用户，请使用 `semanage login -l`。在 CentOS 8 系统上，默认所有用户都映射到 `unconfined_u`
    SELinux 用户。因此每个人都可以使用互联网。


    ```bash

    herong$ sudo semanage login -l


    Login Name      SELinux User    MLS/MCS Range      Service

    __default__      unconfined_u    s0-s0:c0.c1023     *

    root            unconfined_u    s0-s0:c0.c1023     *

    ```

    '
- fmt: "\n2. To add new entry that maps \"john\" to the `guest_u` SELinux user, use\
    \ the `semanage login -a` command. \n```bash\nherong$ sudo semanage login -a -s\
    \ guest_u john\n```\n\n```bash\nherong$ sudo semanage login -l\n```\n\n| Login\
    \ Name | SELinux User | MLS/MCS Range | Service |\n| :--- | :--- | :--- | :---\
    \ |\n| __default__ | unconfined_u | s0-s0:c0.c1023 | * |\n| john | guest_u | s0\
    \ | * |\n| root | unconfined_u | s0-s0:c0.c1023 | * |\n\n3. To verify the change,\
    \ ask \"john\" to login and try the `ping` command. He will get a \"Permission\
    \ denied\" error.\n```bash\njohn$ ping google.com\nping: socket: Permission denied\n\
    ```\n\n4. To remove the SELinux user entry for \"john\", use the `semanage login\
    \ -d` command.\n```bash\nherong$ sudo semanage login -d -s guest_u john\n```\n\
    \n# What Is SELinux Role\n\nProvides a quick introduction on what is SELinux Role,\
    \ and a tutorial example on how to view what SELinux Roles are permitted for each\
    \ SELinux User, as well as change my current SELinux Role.\n\nIn the last tutorial,\
    \ we learned what is SELinux User. Now let's take a look at SELinux Role.\n\n\
    ## What Is SELinux Role?\n\nA SELinux Role is an abstract concept that represents\
    \ a set of permissions grouped together for a specific functional role. This gives\
    \ the system the flexibility to associate multiple roles to a single user. So\
    \ SELinux system is RBAC (Role-Based Access Control) system.\n\nBy default, SELinux\
    \ has the following pre-defined SELinux roles:\n\n- `guest_r` - The guest user\
    \ role, which has the lowest privilege.\n- `user_r` - The regular user role, which\
