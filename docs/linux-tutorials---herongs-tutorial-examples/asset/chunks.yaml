  trans: "\n3. 如果未同文件名未提供路径，PHP 引擎将按照顺序在以下 3 个位置搜索文件：\n\n*   `include_path` 中指定的目录。\n\
    *   调用脚本所在的目录。\n*   当前工作目录。\n\n例如，以下代码将在多个处搜索 `include_extra.php`。\n\n```php\n\
    <?php\n  include \"include_extra.php\";\n?>\n```\n\n因此，使用 `include` 语句的最佳方法是仅提供文件名，并确保被包含的文件存储在\
    \ `include_path` 目录之一。\n\n1. 验证 `PHP FPM (FastCGI Process Manager)`，即 `php-fpm`\
    \ 是否正在运行。如果没有运行，请安装 `php-fpm` 软件包并启动 `php-fpm` 服务。PHP FPM 提供了 Apache Web 服务器与\
    \ PHP 引擎之间的接口。\n\n```bash\nherong$ systemctl status php-fpm\nphp-fpm.service -\
    \ The PHP FastCGI Process Manager\n    Loaded: loaded (/usr/lib/systemd/system/php-fpm.service;\
    \ disabled;\n    Active: active (running) since Thu 2020-03-26 23:00:41 EDT;\n\
    \    Main PID: 21507 (php-fpm)\n        ...: ...\n```\n\n2. 验证 Apache Web 服务器，`httpd`\
    \ 是否正在运行。如果没有运行，请安装 `httpd` 软件包并启动 `httpd` 服务。\n\n```bash\nherong$ systemctl status\
    \ httpd\nhttpd.service - The Apache HTTP Server\n    Loaded: loaded (/usr/lib/systemd/system/httpd.service;\
    \ disabled;\n    Drop-In: /usr/lib/systemd/system/httpd.service.d\n          \
    \   |-php-fpm.conf\n    Active: active (running) since Thu 2020-03-26 22:06:40\
    \ EDT;\n    Main PID: 19007 (httpd)\n        ...: ...\n```\n\n3. 将 PHP 脚本发布到 Apache\
    \ Web 服务器的 HTML 文档目录。\n\n```bash\nherong$ cd /var/www/html\nherong$ sudo mkdir\
    \ test\nherong$ ls -l\ndrwxr-xr-x. 2 root root  6 Mar 28 22:25 test\nherong$ sudo\
    \ chown herong test\nherong$ ls -l\ndrwxr-xr-x. 2 herong root  6 Mar 28 22:25\
    \ test\nherong$  cd /var/www/html/test\nherong$ ls -l\n-rw-r--r--. 1 herong herong\
    \ 73 Mar 28 22:28 test.php\nherong$ cat test.php\n```\n\n```html\n<html>\n<body>\n\
    <p>\n<?php\nprint(\"Hello world!\\n\");\n?>\n</p>\n</body>\n</html>\n```\n\n4.\
    \ 验证 PHP 脚本页面是否工作正常。\n\n```bash\nherong$ curl http://localhost/test/test.php\n\
    <html>\n<body>\n<p>\nHello world!\n</p>\n</body>\n</html>\n```\n\n## 导出 PHP/Apache\
    \ 环境信息\n\n提供了一个关于如何在 CentOS Linux 系统上导出 Apache/PHP 环境信息的教程示例。在 Apache Web 服务器上运行\
    \ PHP 脚本的执行环境与从命令行运行不同。你需要按照本教程所示导出 Apache/PHP 环境信息。\n\n1. 将以下脚本文件 `test_phpinfo.php`\
    \ 发布到 Apache Web 服务器目录 `/var/www/html/test`：\n\n```php\n<?php phpinfo(); ?>\n\
    ```\n\n2. 在 Web 浏览器通过 `http://localhost/test/test_phpinfo.php` 将脚本文件作为网页查看。你应该能看到良好的格式看到\
    \ Apache/PHP 环境信息。\n\n```text\nHP Version 7.2.11\nSystem  =>  Linux 4.18.0-147.el8.x86_64\
    \ #1 SMP Wed Dec 4 21:51:45 UTC 2019\nBuild Date  =>  10/09/18 03:09 PM\nServer\
    \ API  =>  FPM/FastCGI\nVirtual Directory Support  =>  disabled\nConfiguration\
    \ File (php.ini) Path  =>  /etc\nLoaded Configuration File  =>  /etc/php.ini\n\
    Scan this dir for additional .ini files  =>  /etc/php.d\nAdditional .ini files\
    \ parsed  =>  /etc/php.d/20-bz2.ini, ...\n..\nDirective  =>  Local Value  active\
    \    Master Value\ncgi-fcgi\nphp-fpm  => active\ncgi.discard_path  =>  0  => \
    \ 0\ncgi.fix_pathinfo  =>  1  =>  1\ncgi.force_redirect  =>  1  =>  1\ncgi.nph\
    \  =>  0  =>  0\ncgi.redirect_status_env  =>  no value  =>  no value\ncgi.rfc2616_headers\
    \  =>  0  =>  0\nfastcgi.error_header  =>  no value  =>  no value\nfastcgi.logging\
    \  =>  1  =>  1\nCore\nallow_url_fopen  =>  On  =>  On\nallow_url_include  =>\
    \  Off  =>  Off\n...\nerror_log  =>  /var/log/php-fpm/www-error.log  =>  ...\n\
    extension_dir  =>  /usr/lib64/php/modules  =>  /usr/lib64/php/modules\n...\n```\n\
    \n现在我知道该去哪里寻找 Apache/PHP 错误日志文件了：\n\n```bash\ncentos$ sudo ls -l /var/log/php-fpm\n\
    ```\n\n"
- fmt: "\nIt looks like PHP-FPM module added some extra security protection to prevent\
    \ any PHP scripts to write back to the Apache HTML directory. Giving the \"write\"\
    \ permission to all users as \"rwxrwxrwx\" is not enough for the PHP-FPM module.\
    \ One workaround is to write files to `/tmp` or `/var/log` from Apache PHP scripts.\n\
    \n## SELinux Security Context on /var/www/html\n\nProvides a tutorial example\
    \ on how to change the SELinux security context type on sub directories inside\
    \ `/var/www/html` to allow new files to be created by PHP scripts running on the\
    \ Apache Web server on CentOS systems.\n\nThe root cause of the \"Apache PHP `file_put_contents()`\
    \ Permission Denied\" problem presented in the previous tutorial is actually the\
    \ SELinux security context setting on the `/var/www/html` directory. We can fix\
    \ it with a temporary solution by changing the SELinux security context type as\
    \ shown in this tutorial.\n\n1. Compare the SELinux security context of `/var/www/html/test`\
    \ with `/tmp`. I see that their security users, groups, and types are different.\n\
    \n```\nherong$ ls -la --context /var/www/html/test\ndrwxrwxrwx. 2 herong root\
    \ unconfined_u:object_r:httpd_sys_content_t:s0 .\n\nherong$ ls -la --context /tmp\n\
    drwxrwxrwt. 15 root root system_u:object_r:tmp_t:s0 .\n```\n\n2. Change the SELinux\
    \ security context type on `/var/www/html/test` to match `/tmp`, where my PHP\
    \ Web script can create files.\n\n```\nherong$ cd /var/www\nherong$ sudo chcon\
    \ -t tmp_t test\nherong$ ls -la --context test\ndrwxrwxrwx. 2 herong root   unconfined_u:object_r:tmp_t:s0\
    \ .\n```\n\n3. Re-run the test script on the Apache server. I see that the new\
    \ file created in `/var/www/html/test`.\n\n```\nherong$ curl localhost/test/test_file_put_contents.php\n\
    \n<html><body><pre>\nOutput from whoami:\napache\n\nOutput from getcwd():\n/var/www/html/test\n\
    \ntest file_put_contents(./tmp-cwd.tmp):\n-rw-r--r--. 1 apache apache 26 Apr \
    \ 1 02:29 ./tmp-cwd.tmp\n\ntest file_put_contents(/tmp/tmp-tmp.tmp):\n-rw-r--r--.\
    \ 1 apache apache 27 Apr  1 02:29 /tmp/tmp-tmp.tmp\n</pre></body></html>\n```\n\
    \nCool. I have a temporary solution to create new files inside the `/var/www/html`\
    \ directory from my PHP scripts running on Apache Webserver with the \"PHP-FPM\"\
    \ module.\n\n## Migrate Old Scripts to New PHP Release\n\nProvides a tutorial\
    \ example on how to migrate old PHP scripts to PHP new releases. If you are running\
    \ old PHP scripts on a newer release of the PHP engine, you may see many errors,\
    \ because some modules or functions are deprecated or removed. Here is a list\
    \ of them of their replacements.\n\n- `eregi('...', ...);` --> `preg_match(('/.../i',\
    \ ...);`\n- `mysql_*()` --> `mysqli_*()`\n- `date(): ... not safe ...` --> `date_default_timezone_set('Europe/Paris');`\n\
    \n## Running MySQL Database Server on Linux Systems\n\nProvides introductions\
    \ and tutorial examples about MySQL database server on CentOS systems. Topics\
    \ include installing MySQL 8.0 on CentOS 8; starting and stoping `mysqld` as a\
    \ system service; setting MySQL `root` password; MySQL file and data locations;\
    \ MySQL log files; backing up MySQL data; MySQL socket and TCP/IP connections;\
    \ Open firewall for MySQL connections.\n\n### Takeaways:\n- MySQL server can be\
    \ installed with the `dnf install mysql-server` command on CentOS 8.\n- MySQL\
    \ server can be started and stopped with `service mysqld start/stop` commands.\n\
    - MySQL server starts with no password for `root`. You can set one with `mysqladmin\
    \ -u root -p password` command.\n- MySQL command programs are located in `/usr/bin`\
    \ directory.\n- MySQL data and log files are located in `/var/lib/mysql` directory.\n\
    - MySQL data can be backed up with the `mysqldump` command.\n- MySQL can log all\
    \ queries with the `general_log` setting.\n- MySQL supports socket connections\
    \ for client programs on the server using `localhost` as the host name.\n- MySQL\
    \ supports TCP/IP connections for remote clients on port 3306.\n- MySQL allows\
    \ a remote user to access only if the user is created with his/her IP address.\n\
    - MySQL requires the server and gateway to open firewall for inbound messages\
    \ on port 3306.\n- \"Server sent charset unknown to the client\" error is returned\
    \ using older PHP `mysqli_connect()` function to connect to MySQL 8.0.\n- MySQL\
    \ server is 100 times slower on my CentOS than macOS computer with default settings.\n\
    \n### Install MySQL Database Server on CentOS\n\nProvides a tutorial example on\
    \ how to install MySQL 8.0 server on CentOS 8 using `dnf/yum` as the package manager.\
    \ If you want to use MySQL database server on CentOS systems, you can follow what\
    \ I did on my CentOS 8 computer:\n\n1. Login as \"herong\", who has admin privileges.\n\
    2. Run `dnf search` to find available packages. I see `mysql-server` and some\
    \ related modules available for installation:\n\n```\nherong$ dnf search mysql\n\
    mysql.x86_64 : MySQL programs and shared libraries\ngrafana-mysql.x86_64 : Grafana\
    \ datasource\npostfix-mysql.x86_64 : Postfix map support\nrsyslog-mysql.x86_64\
    \ : MySQL support for rsyslog\ndovecot-mysql.x86_64 : MySQL back end for docot\n\
    perl-DBD-MySQL.x86_64 : MySQL interface for Perl\nfreeradius-mysql.x86_64 : MySQL\
    \ support for freeradius\nmysql-server.x86_64 : The MySQL server and related files\n\
    mysql-test.x86_64 : The test suite distributed with MySQL\n```\n\n3. Install the\
    \ `mysql-server` package:\n\n```\nherong$ sudo dnf install mysql-server\nPackage\
    \            Arch          Version                Repo      Size\n===================================================\n\
    Installing:\n  mysql-server      x86_64        8.0.17-3.module_el8.0.0  AppStream\
    \  22 M\nInstalling dependencies:\n  mariadb-connector-c-config  noarch      \
    \   3.0.7-1.el8             AppStream  13 k\n  mecab              x86_64     \
    \   0.996-1.module_el8.0.0  AppStream  397 k\n  mysql             x86_64     \
    \   8.0.17-3.module_el8.0.0  AppStream  11 M\n  mysql-common      x86_64     \
    \   8.0.17-3.module_el8.0.0  AppStream  143 k\n  mysql-errmsg      x86_64    \
    \    8.0.17-3.module_el8.0.0  AppStream  557 k\n  protobuf-lite    x86_64    \
    \    3.5.0-7.el8               AppStream  150 k\nEnabling module streams:\n  mysql\
    \                               8.0\n...\nInstalled:\n  mysql-server      x86_64\
    \        8.0.17-3.module_el8.0.0\n  mariadb-connector-c-config  noarch       \
    \  3.0.7-1.el8\n  mecab              x86_64        0.996-1.module_el8.0.0\n  mysql\
    \             x86_64        8.0.17-3.module_el8.0.0\n  mysql-common      x86_64\
    \        8.0.17-3.module_el8.0.0\n  mysql-errmsg      x86_64        8.0.17-3.module_el8.0.0\n\
    \  protobuf-lite    x86_64        3.5.0-7.el8\n```\n\nComplete!\n\n3. Verify the\
    \ \"php\" package:\n\n```\nherong$ mysql --version\nmysql  Ver 8.0.17 for Linux\
    \ on x86_64 (Source distribution)\n```\n"
