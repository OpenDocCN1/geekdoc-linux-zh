    # Monitor Network Services on CentOS

    Provides a tutorial example on how to use different tools, `netstat` (Network
    Status), `lsof` (List of Open Files), `ss` (Socket Statistics), to monitor network
    services on CentOS systems. With network firewall configured, the next task is
    to monitor network services. Here are the tools you can use on CentOS 8 systems:


    ### 1. `/etc/services` - Network service list file which contains service names
    and their default IP ports.

    ```bash

    sudo cat /etc/services | more

    ```

    ```

    # Network services, Internet style

    # IANA services version: last updated 2016-07-08

    # The Well Known Ports are from 0 through 1023.

    # The Registered Ports are from 1024 through 49151

    # The Dynamic/or Private Ports are from 49152 through 65535

    tcux     1/tcp          # port multiplexer

    tcux     1/udp          # port multiplexer

    je       5/tcp          # Remote Entry

    je       5/udp          # Remote Entry

    echo     7/tcp

    echo     7/udp

    discard  9/tcp          sink

    discard  9/udp          sink

    systat   1/tcp          users

    systat   1/udp          users

    daytime  13/tcp

    daytime  13/udp

    qotd     17/tcp          quote

    qotd     17/udp          quote

    chargen  19/tcp          ttytst source

    chargen  19/udp          ttytst source

    ftp-data 20/tcp

    ftp-data 20/udp

    ftp      21/tcp

    ftp      21/udp          fsp fspd

    ssh      22/tcp          # The Secure Shell (SSH) Protocol

    ssh      22/udp          # The Secure Shell (SSH) Protocol

    telnet   23/tcp

    telnet   23/udp

    ```


    ### 2. List active Internet connections with the `netstat` command

    ```bash

    netstat -atu

    ```

