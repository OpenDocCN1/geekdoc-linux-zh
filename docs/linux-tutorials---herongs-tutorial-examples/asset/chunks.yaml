    herong   31723  0.0  0.0   25084  5704 pts/1    Ss   02:29   0:00 -bash\n...\n\
    ```\n\n```bash\nherong$ ps -u joe\n```\n\n...\n\n## Display all processes on the\
    \ system in long format using the \"ps -el\" command: `ps -el`\n\n```text\nF S\
    \    UID  PID  PPID  C PRI  NI ADDR SZ WCHAN  TTY       TIME CMD\n4 S     0  \
