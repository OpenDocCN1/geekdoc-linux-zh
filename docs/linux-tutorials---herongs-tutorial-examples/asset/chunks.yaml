  trans: "\n\n# URL: `https://security.appspot.com/vsftpd.html`\n许可证: `GPLv2 带有异常条款`\n\
    \ 描述: `vsftpd` 是一个非常安全的 FTP 守护进程。它完全从零开始编写。\n\n## 安装 vsftpd\n\n```bash\nherong$\
    \ sudo dnf install vsftpd\n...\n下载包:\nvsftpd-3.0.3-28.el8.x86_64.rpm   2.5 MB/s\
    \ | 180 kB   00:00\n...\n安装:\nvsftpd-3.0.3-28.el8.x86_64\n完成！\n```\n\n### 2. 启用\
    \ vsftpd 以便在系统启动时自动启动：\n```bash\nherong$ sudo systemctl enable vsftpd\n```\n创建符号链接\
    \ `/etc/systemd/system/multi-user.target.wants/vsftpd.service` -> `/usr/lib/systemd/system/vsftpd.service`。\n\
    \n### 3. 启动 vsftpd 并检查其状态：\n```bash\nherong$ sudo systemctl start vsftpd\nherong$\
    \ sudo systemctl status vsftpd\n```\n```text\nvsftpd.service - Vsftpd ftp daemon\n\
    \  Loaded: loaded (/usr/lib/systemd/system/vsftpd.service; enabled; ...)\n  Active:\
    \ active (running)\n  Process: 26802 ExecStart=/usr/sbin/vsftpd /etc/vsftpd/vsftpd.conf\n\
    \  Main PID: 26803 (vsftpd)\n    Tasks: 1 (limit: 23087)\n    Memory: 540.0K\n\
    \    CGroup: /system.slice/vsftpd.service\n             | 26803 /usr/sbin/vsftpd\
    \ /etc/vsftpd/vsftpd.conf\nJun 23 16:59:40  systemd[1]: Starting Vsftpd ftp daemon...\n\
    Jun 23 16:59:40  systemd[1]: Started Vsftpd ftp daemon.\n```\n\n## vsftpd 服务器配置\n\
    \n提供了一个教程示例，介绍如何配置 `vsftpd` 服务器，允许某些本地用户使用 FTP 客户端程序在其自己的私有目录下上传和下载文件。安装 `vsftpd`\
    \ 后，下一步是检查并更新其配置。我想实现的是允许某些本地用户使用 FTP 客户端程序在其私有目录下上传和下载文件。\n\n### 1. 找到 vsftpd\
    \ 配置文件并创建备份。\n```bash\nherong$ cd /etc/vsftpd\nherong$ ls -l\ntotal 20\n-rw-------\
    \ 1 root root  125 May 14  2019 ftpusers\n-rw------- 1 root root  361 May 14 \
    \ 2019 user_list\n-rw------- 1 root root 5098 May 14  2019 vsftpd.conf\n-rwxr--r--\
    \ 1 root root  348 May 14  2019 vsftpd_conf_migrate.sh\nherong$ sudo cp vsftpd.conf\
    \ vsftpd.conf.bck\n```\n\n### 2. 打开 vsftpd.conf 如下所示更新或添加设置：\n```bash\nherong$\
    \ sudo vi vsftpd.conf\n```\n```ini\n# 注消此注释以允许本地用户登录。\n# 当 SELinux 强制执行时，检查 SE\
    \ bool ftp_home_dir\nlocal_enable=YES\n\n# 注消此注释以启用任何形式的 FTP 写入命令。\nwrite_enable=YES\n\
    \n# 本地用户的默认 umask 为 077。如果你的用户需要，你可以将其更改为 022，\n# (大多数其他 ftpd 使用 022)\nlocal_umask=022\n\
    ...\n# 激活上传/下载日志记录。\nxferlog_enable=YES\n\n# 如果你需要，可以覆盖日志文件的存储位置。默认值如下所示。\nxferlog_file=/var/log/xferlog\n\
    \n# 如果需要，可以让日志文件采用标准的 ftpd xferlog 格式。\n# 注意在这种情况下默认的日志文件位置是 /var/log/xferlog。\n\
    xferlog_std_format=NO\n\n# 你可以指定一个本地用户列表，将其 chroot() 到其主目录。\n# 如果 chroot_local_user\
    \ 为 YES，则此列表将变为\n# 不 chroot 的用户列表。\n# (警告！chroot 可能非常危险。如果使用 chroot，请确保\n# 用户对\
    \ chroot 内的顶级目录没有写入权限)\nchroot_local_user=YES\n...\n# 允许 vsftpd.user_list 列表中的用户访问服务器\n\
    userlist_enable=YES\nuserlist_file=/etc/vsftpd/user_list\nuserlist_deny=NO\n#\
    \ 当用户连接到服务器时，重定向到他们的 \"ftp\" \nuser_sub_token=$USER\nlocal_root=/home/$USER/ftp\n\
    # 指定被动连接的端口范围\npasv_min_port=30000\npasv_max_port=31000\n```\n\n### 3. 重启 vsftpd:\n\
    ```bash\nherong$ sudo systemctl restart vsftpd\n```\n`vsftpd` 服务器已就绪。请参阅下一个关于如何设置用户目录和权限的教程。\n\
    \n## 为本地用户设置子目录\n\n提供了一个教程示例，介绍如何在系统中为本地用户设置 `ftp` 子目录，并允许他们使用 `vsftpd` 上传和下载文件。根据上一个教程提供的\
    \ `vsftpd` 配置，我已经准备好在家目录下创建一个 `ftp` 目录用于上传和下载文件。\n\n### 1. 创建 `ftp` 子目录作为我的 FTP\
    \ 目录。更改其所有权和权限以允许 `vsftpd` 访问。\n```bash\nherong$ sudo mkdir /home/herong/ftp\n\
    herong$ sudo chown nobody:nobody /home/herong/ftp\nherong$ sudo a-w /home/herong/ftp\n\
    herong$ sudo ls -l /home/herong\ndr-xr-xr-x 2 nobody 6 Jun 23 17:03 ftp\n```\n\
    \n### 2. 创建具有私有权限的 `ftp/files` 子目录用于上传和下载文件。\n```bash\nherong$ sudo mkdir /home/herong/ftp/files\n\
    herong$ sudo chown nobody:nobody /home/herong/ftp/files\nherong$ sudo ls -l /home/herong\n\
    dr-xr-xr-x 2 nobody 6 Jun 23 17:03 ftp\ndrwxr-xr-x 2 nobody root 0 Jun 23 17:03\
    \ files\n```\n\n### 3. 将用户添加到 vsftpd.user_list 列表中。\n```bash\nherong$ cd /etc/vsftpd\n\
    herong$ echo \"herong\" >> user_list\nherong$ cat user_list\n```\n输出：\n```\nherong\n\
    ```\n\n### 4. 重启 vsftpd:\n```bash\nherong$ sudo systemctl restart vsftpd\n```\n\
    `vsftpd` 服务已重启。\n\n## 在 CentOS 上本地测试 FTP\n\n提供了一个教程示例，介绍如何使用 `ftp` 客户端在 CentOS\
    \ 系统上本地访问 `vsftpd` 服务器。在更新了 `vsftpd` 配置并设置了用户目录后，我已准备好在本地计算机上测试 `vsftpd` 服务器。\n\
    \n### 1. 确保 `ftp` 程序可用。\n```bash\nherong$ dnf info ftp\n最后元数据过期检查: 6:29:59 以前，于周二\
    \ 07 Jul 2020 11:12:35 PM EDT\n可用包\nName:          ftp\nVersion:       0.17\n\
    Release:       78.el8\nArchitecture:  x86_64\nSize:          112 k\nSource:  \
    \      ftp-0.17-78.el8.rpm\nRepository:     @System\nAppStream\nSummary:     \
    \  标准的 Unix FTP（文件传输协议）客户端\nURL:           ftp://ftp.linux.org.uk/pub/linux/Networking/netkit\n\
    License:       BSD with advertising\nDescription:   ftp 包提供了标准的命令行 FTP（文件传输协议）客户端。FTP\
    \ 是一种广泛用于在互联网传输和存档文件的协议。如果你的系统在网络上，你应该安装 ftp 以进行文件传输。\nherong$ sudo dnf install\
    \ ftp\n...\n下载包:\nftp-0.17-78.el8.x86_64.rpm   373 kB/s |  70 kB   00:00\n安装:\n\
    ftp-0.17-78.el8.x86_64\n完成！\n```\n\n### 2. 连接到本地 FTP 服务器：\n```bash\nherong$ ftp\
    \ localhost\n```\n```text\n尝试 ::1...\n已连接到 localhost (::1)。\n220 (vsFTPd 3.0.3)\n\
    用户名 (localhost:herong): herong\n331 指定密码。\n密码:\n230 登录成功。\n远程系统类型为 UNIX。\n使用二进制模式传输文件。\n\
    ftp> dir\n229 进入扩展被动模式 (|||30675|)\n150 正在发送目录列表。\ndr-xr-xr-x  2 1000    1000\
    \           6 Jun 23 09:08 files\n226 目录发送完成。\n```\n\n"
- fmt: "\n3. Upload a text file to the `./files` sub-directory. Do not upload any\
    \ files to the FTP home directory, which is configured only for the `vsftpd` daemon\
    \ to access.\n\n```bash\nftp> put test.txt\nlocal: test.txt remote: test.txt\n\
    229 Entering Extended Passive Mode (|||30283|)\n150 Ok to send data.\n226 Transfer\
    \ complete.\n637 bytes sent in 4e-05 secs (1592.00 Kbytes/sec)\nftp> dir\n229\
    \ Entering Extended Passive Mode (|||30217|)\n150 Here comes the directory listing.\n\
    -rw-r--r--     1 1000      1000           637 Jul 11 10:03 test.txt\n226 Directory\
    \ send O\nftp> cd ..\n250 Directory successfully changed.\nftp> put test.txt\n\
    local: test.txt remote: test.txt\n229 Entering Extended Passive Mode (|||30871|)\n\
    553 Could not create file.\nftp> exit\n221 Goodbye.\n```\n\n4. Check log file.\
    \ It could be `/var/log/xferlog` or `/var/log/xferlog:herong$`.\n\n```bash\nsudo\
    \ tail /var/log/xferlog\n... 1 ::ffff:192.168.1.11 0 /some.pdf b _ i r joe ftp\
    \ 0 * i\nherong$ sudo tail /var/log/vsftpd.log\n... [pid 21901] CONNECT: Client\
    \ \"::ffff:192.168.1.11\"\n... [pid 21900] [herong] OK LOGIN: Client \"::ffff:192.168.1.11\"\
    \n... [pid 21969] [herong] OK UPLOAD: Client \"::ffff:192.168.1.11\",\n   \"/files/test.txt\"\
    , 3547 bytes, 218.68Kbyte/sec\n```\n\nCool! `vsftpd` daemon is working locally\
    \ now. See the next tutorial on how to option the firewall for users to do FTP\
    \ remotely.\n\n---\n\n## Test FTP Access Remotely on CentOS\n\nProvides a tutorial\
    \ example on how to update firewall on the `vsftpd` server (and its firewall gateway\
    \ if it is served in the cloud) to open ports 21 and 30000-31000 for inbound connections.\
    \ To allow users to upload and download files remotely, I need to open the firewall\
    \ to allow users to upload and download files remotely using the `vsftpd` server\
    \ on my CentOS computer.\n\n1. Find the active zone of the firwall:\n```bash\n\
    herong$ sudo firewall-cmd --get-active-zones\npublic\n  interfaces: eno1\n```\n\
    \n2. Add predefined \"ftp\" settings in the active zone \"public\" to receive\
    \ incoming FTP connections.\n```bash\nherong$ sudo firewall-cmd --zone=public\
    \ --add-service=ftp\nsuccess\n```\n\n3. Open a range of ports in the active zone\
    \ to receive incoming FTP passive connections.\n```bash\nherong$ sudo firewall-cmd\
    \ --zone=public --add-port=30000-31000/tcp\nsuccess\n```\n\n4. List all settings\
    \ in the active zone \"public\":\n```bash\nherong$ sudo firewall-cmd --zone=public\
    \ --list-all\npublic (active)\n  target: default\n  icmp-block-inversion: no\n\
    \  interfaces: eno1\n  sources:\n  services: cockpit dhcpv6-client ftp http ssh\n\
    \  ports: 80/tcp 3306/tcp 30000-31000/tcp\n  protocols:\n  masquerade: no\n  forward-ports:\n\
    \  source-ports:\n  icmp-blocks:\n  ...\n```\n\n5. Persist firewall changes to\
    \ configuration files.\n```bash\nherong$ sudo firewall-cmd --runtime-to-permanent\n\
    ```\n\n6. Verify remote access by running an FTP client program on another computer\
    \ on the same network, assuming that 192.168.1.3 is the IP address of `vsftpd`\
    \ server computer.\n```bash\nherong$ ftp 192.168.1.3\nConnected to 192.168.1.3.\n\
    220 (vsFTPd 3.0.3)\nName (192.168.1.3:herong): herong\n331 Please specify the\
    \ password.\nPassword:\n230 Login successful.\nRemote system type is UNIX.\nUsing\
    \ binary mode to transfer files.\nftp> dir\n229 Entering Extended Passive Mode\
    \ (|||30445|)\n150 Here comes the directory listing.\ndrwxr-xr-x     2 1000  \
    \    1000           22 Jul 11 10:03 files\n226 Directory send OK.\nftp> cd files\n\
    250 Directory successfully changed.\nftp> dir\n229 Entering Extended Passive Mode\
    \ (|||30768|)\n150 Here comes the directory listing.\n-rw-r--r--     1 1000  \
    \    1000           637 Jul 11 10:03 test.txt\n226 Directory send OK.\nftp> get\
    \ test.txt\nlocal: test.txt remote: test.txt\n229 Entering Extended Passive Mode\
    \ (|||30673|)\n150 Opening BINARY mode data connection for test.txt (637 bytes).\n\
    100% |*********************************|    637    3.41 MiB/s    00:00 ETA\n226\
    \ Transfer complete.\n637 bytes received in 00:00 (1.08 MiB/s)\nftp> exit\n221\
    \ Goodbye.\n```\n\nVery good. Remote FTP access is ready! Note that if your server\
    \ provided by service in the cloud, you need open port 21 and 30000-31000 for\
    \ inbound connections on the firewall.\n\n---\n\n## Support FTP Over TLS\n\nProvides\
    \ a tutorial on how to turn SSL/TLS support in `vsftpd` server on CentOS systems.\
    \ A private-public key pair and a self-signed certificate is generated with `OpenSSL`\
    \ tool. If you allow users to upload and download files remotely over public networks,\
    \ you need to enable `SSL` (Secure Socket Layer) on `vsftpd` to support `TLS`\
    \ (Transport Layer Security). This will encrypt information between FTP client\
    \ programs and the `vsftpd` server, included user's password and upload/download\
    \ files. Here is what I did to enable SSL support for `vsftpd` on my CentOS computer.\n\
    \n1. Make sure `openssl` is available:\n```bash\nherong$ sudo dnf info openssl\n\
    Available Packages\nName: openssl\nEpoch: 1\nVersion: 1.1.1\nRelease: 15.el8\n\
    Architecture: x86_64\nSize: 697 k\nSource: openssl-1.1.1-15.el8.rpm\nRepository:\
    \ BaseOS\nSummary: Utilities from general purpose cryptography library with TLS\n\
    URL: http://www.openssl.org/\nLicense: OpenSSL\nDescription: OpenSSL toolkit provides\
    \ support for secure communications between machines. OpenSSL includes a certificate\
    \ management tool and shared libraries which provide various cryptographic algorithms\
    \ and protocols.\nherong$ sudo dnf install openssl\nUpgraded: openssl-1.1.1-15.el8.x86_64\
    \ openssl-libs-1.1.1-15.el8.x86_64\n```\n\n2. Generate a private-public key pair\
    \ and self-signed certificate for the `vsftpd` server:\n```bash\nherong$ cd /etc/vsftpd\n\
    herong$ sudo mkdir ssl\nherong$ cd ssl\nherong$ sudo openssl req -x509 -nodes\
    \ -newkey rsa:2048 -keyout vsftpd-private.pem -out vsftpd-cert.pem\nGenerating\
    \ a RSA private key\n............++++\n..++++\nwriting new private key to 'vsftpd-private.pem'\n\
    -----\nYou are about to enter information that will be incorporated into your\
    \ certificate request.\nWhat you about to enter is called a Distinguished Name\
    \ or DN.\nThere are quite a few fields but you can leave some blank. For some\
    \ fields there will be a default value, If you enter '.', the field will be left\
    \ blank.\n-----\nCountry Name (2 letter code) [XX]:US\nState or Province Name\
    \ (full name) []:NY\nLocality Name (eg, city) [Default City]:NY\nOrganization\
    \ Name (eg, company) [Default Company Ltd]:HY\nOrganizational Unit Name (eg, section)\
    \ []:IT\nCommon Name (eg, your name or your server's hostname) []:hy.centos\n\
    Email Address []:\nherong$ sudo ls -l\ntotal 8\n-rw-r--r-- 1 root root 1294 Jul\
    \ 11 13:50 vsftpd-cert.pem\n-rw------- 1 root root 1704 Jul 11 13:49 vsftpd-private.pem\n\
    ```\n\n3. Update `vsftpd` configuration to turn on SSL:\n```bash\nherong$ cd /etc/vsftpd\n\
    herong$ sudo vi vsftpd.conf\n...\nssl_enable=YES\nrsa_cert_file=/etc/vsftpd/ssl/vsftpd-cert.pem\n\
    rsa_private_key_file=/etc/vsftpd/ssl/vsftpd-private.pem\nallow_anon_ssl=NO\nforce_local_data_ssl=YES\n\
    force_local_logins_ssl=YES\nssl_sslv2=NO\nssl_sslv3=NO\nssl_tlsv1=NO\nssl_tlsv1_1=NO\n\
    ssl_tlsv1_2=YES\nrequire_ssl_reuse=NO\nssl_ciphers=HIGH\n```\n\n4. Restart `vsftpd`\
    \ server.\n```bash\nherong$ sudo systemctl restart vsftpd\n```\n\n5. Test FTP\
    \ over TLS with FileZilla client: Define a new site with the following:\n- Protocol:\
    \ FTP - File Transfer Protocol\n- Host: 192.168.1.3\n- Port:\n- Encryption: Require\
    \ explicit FTP over TLS\n- ...\nClick \"Connect\" and enter user/password. Click\
    \ ok when you see a warning on server's certificate, because it is signed by my-self,\
    \ not by a certificate authority.\nYou see a successful connection in the log:\n\
    - Status: Connecting to 192.168.1.10:21...\n- Status: Connection established,\
    \ waiting for welcome message...\n"
