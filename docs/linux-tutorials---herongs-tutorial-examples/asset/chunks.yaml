    \ -version\nopenjdk version \"11.0.6\" 2020-01-14 LTS\nOpenJDK Runtime Environment\
    \ 18.9 (build 11.0.6+10-LTS)\nOpenJDK 64-Bit VM 18.9 (build 11.0.6+10-LTS), mixed\
    \ mode, sharing\n```\nCool! I have installed OpenJDK 11 JRE on my CentOS without\
    \ any issues.\n\n## Install and Manage Perl Packages on CentOS\n\nProvides a tutorial\
    \ example on how to install Perl 5.26 on CentOS 8 systems using `dnf/yum` as the\
    \ package manager. The Perl (Practical Extraction and Report Language) script\
    \ engine is included as part of the CentOS 8 system by default. You don't need\
    \ to install it yourself. But you can still install its additional modules using\
    \ the `dnf` package manager.\n\n1. Login as \"herong\", who has admin privileges.\n\
    2. Check the current installed version of Perl:\n\n```bash\nherong$ perl -v\n\
    This is perl 5, version 26, subversion 3 (v5.26.3) built for x86_64-linux-thread-multi\
    \ (with 51 registered patches, ...)\n...\n```\n\n3. Run `dnf info perl` to see\
    \ Perl package information:\n\n```bash\nherong$ dnf info perl\nAvailable Packages\n\
