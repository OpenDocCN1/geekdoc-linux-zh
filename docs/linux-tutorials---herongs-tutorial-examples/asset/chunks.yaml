    \ Nonrepresentable section on output\n```\n\n### 3. Re-compile it again with \"\
    -fPIC\" option as suggested:\n```bash\nherong$ g++ -shared -fPIC -o libMyDynamic.so\
    \ MyDynamic.cpp\n```\n```bash\nherong$ ls -l *MyDynamic*\n-rwxrwxr-x. 1 herong\
    \ herong 8872 Apr 13 01:57 libMyDynamic.so\n-rw-rw-r--. 1 herong herong  120 Apr\
    \ 13 01:53 MyDynamic.cpp\n```\n\n### 4. Create a calling program, `MyDynamicTest.cpp`:\n\
    ```bash\nherong$ cat MyDynamicTest.cpp\n// MyDynamicTest.cpp\n#include \"iostream\"\
    \nextern void myDynamicFunc();\n\nint main() {\n  std::cout << \"Calling myDynamicFunc()...\"\
    \ << std::endl;\n  myDynamicFunc();\n}\n```\n\n### 5. Link `MyDynamicTest.cpp`\
    \ with `libMyDynamic.so` without giving location path:\n```bash\nherong$ g++ -lMyDynamic\
    \ MyDynamicTest.cpp\n```\n```\n/usr/bin/ld: cannot find -lMyDynamic\n```\n\n###\
    \ 6. Link `MyDynamicTest.cpp` with `libMyDynamic.so` with giving location path\
    \ using the `g++ -L ...` option. I can also use the `LIBRARY_PATH` environment\
    \ variable instead of `g++ -L ...`.\n```bash\nherong$ g++ -L . -lMyDynamic MyDynamicTest.cpp\n\
    herong$ ./a.out\nCalling myDynamicFunc()...\nRunning myDynamicFunc()...\n```\n\
    \n### 7. Logout and login to run the program again. I got an error as expected,\
    \ because `libMyDynamic.so` is no longer loaded in the CPU, and the program loader\
    \ has no idea where to find it.\n```bash\nherong$ ./a.out\n./a.out: error while\
    \ loading shared libraries: libMyDynamic.so:\n    cannot open shared object file:\
    \ No such file or directory\n```\n\n### 8. Run it again with `LD_LIBRARY_PATH`\
    \ set to the dynamic library path:\n```bash\nherong$ export LD_LIBRARY_PATH=.\n\
    herong$ ./a.out\nCalling myDynamicFunc()...\nRunning myDynamicFunc()...\n```\n\
    \nCool. GCC C/C++ compiler is much easier to work with dynamic libraries than\
    \ static libraries in Linux systems. \n\n## ldd - Dynamic Library Dependency Checker\n\
    Provides a tutorial example on how to use the `ldd` tool to list dynamic library\
    \ dependencies of any executable files, including dynamic library files on Linux\
    \ systems. Most of executable programs use dynamic libraries because of two main\
    \ benefits:\n\n- Makes the executable program file smaller because dependent program\
    \ code is stored in the external dynamic library files.\n- Reduces loading time\
    \ and memory usage because dependent program code is loaded separately and can\
    \ be shared by multiple programs.\n\nIf you want to know which dynamic libraries\
    \ are used by an executable program, you can use the `ldd` command on Linux systems.\
    \ Here are some usage examples of the `ldd` command.\n\n### 1. List dynamic library\
    \ dependency of the `ls` system command program. I see 8 system libraries.\n```bash\n\
    herong$ which ls\n  /usr/bin/ls\nherong$ ldd /bin/ls\n  linux-vdso.so.1 (0x00007ffd03779000)\n\
    \  libselinux.so.1 => /lib64/libselinux.so.1 (0x00007fe8a18cd000)\n  libcap.so.2\
    \ => /lib64/libcap.so.2 (0x00007fe8a16c7000)\n  libc.so.6 => /lib64/libc.so.6\
    \ (0x00007fe8a1304000)\n  libpcre2-8.so.0 => /lib64/libpcre2-8.so.0 (0x00007fe8a1080000)\n\
    \  libdl.so.2 => /lib64/libdl.so.2 (0x00007fe8a0e7c000)\n  /lib64/ld-linux-x86-64.so.2\
    \ (0x00007fe8a1d1b000)\n  libpthread.so.0 => /lib64/libpthread.so.0 (0x00007fe8a0c5c000)\n\
    ```\n\n### 2. List dynamic library dependency of my own C program compiled from\
    \ `hello.c`. I see 2 Linux system libraries and 1 C library.\n```bash\nherong$\
    \ gcc -o hello hello.c\nherong$ ./hello\nHello world! From C.\nherong$ ldd hello\n\
    \  linux-vdso.so.1 (0x00007ffd5fc6000)\n  libc.so.6 => /lib64/libc.so.6 (0x00007fe8a1f2600)\n\
    \  /lib64/ld-linux-x86-64.so.2 (0x00007fe8a1f3200)\n```\n\n### 3. List dynamic\
    \ library dependency of my own C++ program compiled from `hello.cpp`. I see 3\
    \ more libraries.\n```bash\nherong$ g++ -o hello hello.cpp\nherong$ ./hello\n\
    Hello world! From C++.\nherong$ ldd hello\n  linux-vdso.so.1 (0x00007fedec33c2000)\n\
    \  libstdc++.so.6 => /lib64/libstdc++.so.6 (0x00007fe8a58c000)\n  libm.so.6 =>\
    \ /lib64/libm.so.6 (0x00007fe8a5b0000)\n  libgcc_s.so.1 => /lib64/libgcc_s.so.1\
    \ (0x00007fe8a3a4000)\n  libc.so.6 => /lib64/libc.so.6 (0x00007fe8a7f2000)\n \
    \ /lib64/ld-linux-x86-64.so.2 (0x00007fe8a7f9100)\n```\n\n### 4. List dynamic\
    \ library dependency of my own program that uses own dynamic library. I see dynamic\
    \ library `libMyDynamic.so` in the list.\n```bash\nherong$ g++ -L . -lMyDynamic\
    \ -o MyDynamicTest MyDynamicTest.cpp\nherong$ export LD_LIBRARY_PATH=.\nherong$\
    \ ./MyDynamicTest\nCalling myDynamicFunc()...\nRunning myDynamicFunc()...\nherong$\
    \ ldd MyDynamicTest\n  linux-vdso.so.1 (0x00007ffd01126000)\n  libMyDynamic.so\
    \ => ./libMyDynamic.so (0x00007ffd04c61700)\n  libstdc++.so.6 => /lib64/libstdc++.so.6\
    \ (0x00007ffd04c82000)\n  libm.so.6 => /lib64/libm.so.6 (0x00007ffd04bf0000)\n\
    \  libgcc_s.so.1 => /lib64/libgcc_s.so.1 (0x00007ffd04bce800)\n  libc.so.6 =>\
    \ /lib64/libc.so.6 (0x00007ffd04c92500)\n  /lib64/ld-linux-x86-64.so.2 (0x00007ffd04c81900)\n\
    ```\n\n### 5. If `LD_LIBRARY_PATH` environment variable is not set properly, some\
    \ dynamic libraries will be listed as \"not found\".\n```bash\nherong$ export\
    \ LD_LIBRARY_PATH=/tmp\nherong$ ldd MyDynamicTest\n  linux-vdso.so.1 (0x00007ffd9e734000)\n\
    \  libMyDynamic.so => not found\n  libstdc++.so.6 => /lib64/libstdc++.so.6 (0x00007ffd9e33e000)\n\
    \  libm.so.6 => /lib64/libm.so.6 (0x00007ffd9e35bc000)\n  libgcc_s.so.1 => /lib64/libgcc_s.so.1\
    \ (0x00007ffd9e33a400)\n  libc.so.6 => /lib64/libc.so.6 (0x00007ffd9e72fe100)\n\
    \  /lib64/ld-linux-x86-64.so.2 (0x00007ffd9e7cd3000)\n```\n\n### 6. \"ldd\" works\
    \ on dynamic library files (*.so files) too, because they are executable files.\n\
    ```bash\nherong$ g++ -shared -fPIC -o libMyDynamic.so MyDynamic.cpp\nherong$ ldd\
    \ libMyDynamic.so\n  linux-vdso.so.1 (0x00007ffd7f35d000)\n  libstdc++.so.6 =>\
    \ /lib64/libstdc++.so.6 (0x00007ffd7f9e271900)\n  libm.so.6 => /lib64/libm.so.6\
    \ (0x00007ffd7f9b000)\n  libgcc_s.so.1 => /lib64/libgcc_s.so.1 (0x00007ffd7f97700)\n\
    \  libc.so.6 => /lib64/libc.so.6 (0x00007ffd7f9a000)\n  /lib64/ld-linux-x86-64.so.2\
    \ (0x00007ffd7f9b000)\n```\n\n### 7. Sorry, \"ldd\" does not work on object files\
    \ (.o), because they are not executable.\n```bash\nherong$ g++ -c -o hello.o hello.cpp\n\
    herong$ ldd hello.o\nldd: warning: you do not have permission for './hello.o'\n\
    not a dynamic executable\n```\n"
