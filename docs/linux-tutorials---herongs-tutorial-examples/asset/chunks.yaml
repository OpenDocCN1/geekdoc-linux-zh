    | /bin/bash | | system_u:object_r:shell_exec_t:s0 |

    | /bin/tcsh | | system_u:object_r:shell_exec_t:s0 |

    | /boot | | system_u:object_r:boot_t:s0 |

    | /boot/.* | | system_u:object_r:boot_t:s0 |

    | /dev | | system_u:object_r:device_t:s0 |

    | /dev/(misc/)?agpgart | | system_u:object_r:agp_device_t:s0 |

