  trans: "\n变量和用户配置。\n\n- `-v`, `--verbose` 提供更多输出。该选项是累加的，且最多可以使用 3 次。\n- `-V`, `--version`\
    \ 显示版本并退出。\n- `-q`, `--quiet` 提供更少的输出。该选项是累加的，且最多可以使用 3 次（对应 `WARNING`、`ERROR`\
    \ 和 `CRITICAL` 日志级别）。\n- `--log <path>` 详细追加日志的路径。\n\n### 2. 获取已安装的 Python3 程序包列表：\n\
    ```bash\nherong$ pip3 list\nasn1crypto (0.24.0)\nblivet (3.1.0)\nBrlapi (0.6.7)\n\
    cffi (1.11.5)\nchardet (3.0.4)\nchrome-gnome-shell (0.0.0)\nconfigobj (5.0.6)\n\
    coverage (4.5.1)\ncryptography (2.3)\n...\n```\n\n### 3. 搜索处理 JSON 字符串的包。我看到了一系列\
    \ JSON 包列表。我不确定哪个更好。\n```bash\nherong$ pip3 search json\njson-escape (1.0.0) \
    \           - Json escape\njson-websocket (0.2.1582880480) - json-websocket\n\
    json-dotenv (0.0.21)            - json-dotenv\nmo-json (3.57.20089)          \
    \ - More JSON Tools!\njson-mindiff (0.1)              - Minimize json diffs\n\
    linaro-json (2.0.1)            - JSON Schema Validator\njson-logging (1.0.6) \
    \          - JSON Python Logging\njson-repository (0.2.0)         - A simple json\
    \ repository\npygments-json (0.1)             - Pygments JSON formatter\npretty-json\
    \ (1.2.0)             - make pretty json\n...\n```\n\n### 4. 有时，“pip3” 命令可能会因为网络连接问题而失败。请稍后重试。\n\
    ```bash\nherong$ pip3 search json\nRetrying (Retry(total=4, connect=None, read=None,\
    \ redirect=None, ...\n...\nException:\nTraceback (most recent call last):\n  File\
    \ \"/usr/lib/python3.6/site-packages/pip/_vendor/urllib3/connection.py\"\n  ...\n\
    OSError: [Errno 101] Network is unreachable\n```\n\n### 5. 如果你认为你的“pip3”命令过过，可以使用“pip3”来升级它本身。\n\
    ```bash\nherong$ pip3 install --upgrade pip\n```\n\n### 6. 使用“python3 -m pip”命令运行“pip3”。这之所以有效，是因为“pip”\
    \ 实际上是一个 Python3 模块。\n```bash\nherong$ python3 -m pip help\nUsage:\n  /usr/bin/python3\
    \ -m pip <command> [options]\n  ...\n```\n\n---\n\n# 在 CentOS 上安装 MySQL Connector/Python\n\
    提供了一个如何在 CentOS 系统上安装 MySQL Connector/Python 的教程示例。如果你想从 Python 脚本访问 MySQL 数据库服务器，可以按照我在\
    \ CentOS 8 计算机上的操作来安装 MySQL Connector/Python 模块。\n\n### 1. 使用 \"pip3\" 命令安装 MySQL\
    \ Connector/Python。\n```bash\nherong$ sudo pip3 install mysql-connector-python\n\
    Collecting mysql-connector-python\n  Downloading https://files.pythonhosted.org/packages/d8/29/...\n\
    Collecting dnspython==16.0 (from mysql-connector-python)\n  Downloading https://files.pythonhosted.org/packages/ec/d3/...\n\
    Collecting protobuf==3.6.1 (from mysql-connector-python)\n  Downloading https://files.pythonhosted.org/packages/c2/f9/...\n\
    Requirement already satisfied: six>=1.9\nRequirement already satisfied: setuptools\n\
    Installing collected packages: dnspython, protobuf, mysql-connector-python\nFound\
    \ existing installation: protobuf 3.11.3\nSuccessfully uninstalled protobuf-3.11.3\n\
    Successfully installed dnspython-16.0 mysql-connector-python-8.0.19 protobuf-3.6.1\n\
    ```\n\n### 2. 如果 \"pip3\" 命令失败，使用 \"dnf/yum\" 命令安装 MySQL Connector/Python。\n```bash\n\
    herong$ sudo yum install mysql-connector-python\n...\n```\n\n### 3. 如果 \"dnf/yum\"\
    \ 命令失败，前往 MySQL Connector/Python 下载网站 `https://dev.mysql.com/downloads/connector/python/`\
    \ 下载“Red Hat Linux 8 / Oracle Linux 8 (x86_64-bit) RPM”。然后运行 `rpm` 命令进行安装。\n```bash\n\
    herong$ sudo rpm -i ....\n```\n\n### 4. 使用以下 Python 代码测试 MySQL Connector/Python：\n\
    ```python\nherong$ python3\n>>> import mysql.connector\n>>> con = mysql.connector.connect(user='herong',\
    \ password='Secret', host='localhost')\n>>> con.close()\n```\n\n### 5. 阅读 `https://dev.mysql.com/doc/connector-python/`\
    \ 上的 MySQL Connector/Python 开发者指南以了解更多信息。\n\n---\n\n# 在 CentOS 上安装 Python 2 引擎\n\
    提供了一个如何在 CentOS 系统上安装 Python 2 以运行旧版 Python 脚本和程序的教程示例。如果你仍有一些 Python 2 语言编写的旧\
    \ Python 脚本，你需要按照此教程安装该模块。\n\n### 1. 检查 Python 2 程序包：\n```bash\nherong$ dnf search\
    \ python2\npython2.x86_64 : An interpreted, interactive, object-oriented programming\
    \ language\npython2-jinja2.noarch : General purpose template engine for python2\n\
    python2-test.x86_64 : The test modules from the main python2 package\npython2-docutils.noarch\
    \ : System for processing plaintext documentation for python2\npython2-urllib3.noarch\
    \ : Python2 HTTP library with thread-safe connection pooling and file\n```\n\n\
    ### 2. 安装 Python 2：\n```bash\nherong$ sudo dnf install python2\n...\nInstalled:\n\
    \  python2-2.7.16-12.module_el8.1.0+219+cf9eac9.x86_64\n  python2-pip-9.0.3-14.module_el8.1.0+219+cf9eac9.noarch\n\
    \  python2-setuptools-39.0.1-11.module_el8.1.0+219+cf9eac9.noarch\n  python2-libs-2.7.16-12.module_el8.1.0+219+cf9eac9.x86_64\n\
    \  python2-pip-wheel-9.0.3-14.module_el8.1.0+219+cf9eac9.noarch\n  python2-setuptools-wheel-39.0.1-11.module_el8.1.0+219+cf9eac9.noarch\n\
    Complete!\n```\n\n### 3. 验证 Python 2 安装：\n```bash\nherong$ python2\nPython 2.7.16\
    \ (default, Nov 17 2019, 00:07:27) [GCC 8.3.1 20190507 (Red Hat 8.3.1-4)] on linux2\n\
    >>> <Ctrl-D>\nherong$ pip2 --version\npip 9.0.3 from /usr/lib/python2.7/site-packages\
    \ (python 2.7)\n```\n```太酷了。我已经安装并准备好了 Python 2 引擎和包管理器，可以运行任何 Python 2 脚本。\n\n\
    ---\n\n# vsftpd - 非常安全的 FTP 守护进程\n提供了关于 vsftpd - 非常安全的 FTP 守护程序的介绍和教程示例。主题包括安装\
    \ vsftpd；配置 vsftpd 以允许本地用户访问；测试本地和远程 FTP 访问；启用基于 SSL/TLS 的 FTP 以加密连接。\n\n"
- fmt: "\n# URL: `https://security.appspot.com/vsftpd.html`\nLicense: `GPLv2 with\
    \ exceptions`\nDescription: `vsftpd` is a Very Secure FTP daemon. It was written\
    \ completely from scratch.\n\n## Installing vsftpd\n\n```bash\nherong$ sudo dnf\
    \ install vsftpd\n...\nDownloading Packages:\nvsftpd-3.0.3-28.el8.x86_64.rpm \
    \  2.5 MB/s | 180 kB   00:00\n...\nInstalled:\nvsftpd-3.0.3-28.el8.x86_64\nComplete!\n\
    ```\n\n### 2. Enable vsftpd so that will be started automatically at system boot\
    \ time:\n```bash\nherong$ sudo systemctl enable vsftpd\n```\nCreated symlink `/etc/systemd/system/multi-user.target.wants/vsftpd.service`\
    \ -> `/usr/lib/systemd/system/vsftpd.service`.\n\n### 3. Start vsftpd and check\
    \ its status:\n```bash\nherong$ sudo systemctl start vsftpd\nherong$ sudo systemctl\
    \ status vsftpd\n```\n```text\nvsftpd.service - Vsftpd ftp daemon\n  Loaded: loaded\
    \ (/usr/lib/systemd/system/vsftpd.service; enabled; ...)\n  Active: active (running)\n\
    \  Process: 26802 ExecStart=/usr/sbin/vsftpd /etc/vsftpd/vsftpd.conf\n  Main PID:\
    \ 26803 (vsftpd)\n    Tasks: 1 (limit: 23087)\n    Memory: 540.0K\n    CGroup:\
    \ /system.slice/vsftpd.service\n             | 26803 /usr/sbin/vsftpd /etc/vsftpd/vsftpd.conf\n\
    Jun 23 16:59:40  systemd[1]: Starting Vsftpd ftp daemon...\nJun 23 16:59:40  systemd[1]:\
    \ Started Vsftpd ftp daemon.\n```\n\n## vsftpd Server Configuration\n\nProvides\
    \ a tutorial example on how to configure `vsftpd` server to allow some local users\
    \ to upload and download files in their own private Directories with FTP client\
    \ programs. After installing `vsftpd`, the next step is to review and update its\
    \ configuration. What I want is allow some local users to upload and download\
    \ files in their own private directories with FTP client programs.\n\n### 1. Locate\
    \ vsftpd configuration files and create a backup.\n```bash\nherong$ cd /etc/vsftpd\n\
    herong$ ls -l\ntotal 20\n-rw------- 1 root root  125 May 14  2019 ftpusers\n-rw-------\
    \ 1 root root  361 May 14  2019 user_list\n-rw------- 1 root root 5098 May 14\
    \  2019 vsftpd.conf\n-rwxr--r-- 1 root root  348 May 14  2019 vsftpd_conf_migrate.sh\n\
    herong$ sudo cp vsftpd.conf vsftpd.conf.bck\n```\n\n### 2. Open vsftpd.conf to\
    \ update or add settings as shown below:\n```bash\nherong$ sudo vi vsftpd.conf\n\
    ```\n```ini\n# Uncomment this to allow local users to log in.\n# When SELinux\
    \ is enforcing check for SE bool ftp_home_dir\nlocal_enable=YES\n\n# Uncomment\
    \ this to enable any form of FTP write command.\nwrite_enable=YES\n\n# Default\
    \ umask for local users is 077\\. You may wish to change this to 022,\n# if your\
    \ users expect that (022 is used by most other ftpd's)\nlocal_umask=022\n...\n\
    # Activate logging of uploads/downloads.\nxferlog_enable=YES\n\n# You may override\
    \ where the log file goes if you like. The default is shown\n# below.\nxferlog_file=/var/log/xferlog\n\
    \n# If you want, you can have your log file in standard ftpd xferlog format.\n\
    # Note that the default log file location is /var/log/xferlog in this case.\n\
    xferlog_std_format=NO\n\n# You may specify an explicit list of local users to\
    \ chroot() to their home\n# directory. If chroot_local_user is YES, then this\
    \ list becomes a list of\n# users to NOT chroot().\n# (Warning! chroot'ing can\
    \ be very dangerous. If using chroot, make sure that\n# the user does not have\
    \ write access to the top level directory within the\n# chroot)\nchroot_local_user=YES\n\
    ...\n# Allow users in listed vsftpd.user_list to access the server\nuserlist_enable=YES\n\
    userlist_file=/etc/vsftpd/user_list\nuserlist_deny=NO\n# When users are connected\
    \ to the server, redirect to their \"ftp\" directory\nuser_sub_token=$USER\nlocal_root=/home/$USER/ftp\n\
    # Specify the range of ports for passive connections\npasv_min_port=30000\npasv_max_port=31000\n\
    ```\n\n### 3. Restart vsftpd:\n```bash\nherong$ sudo systemctl restart vsftpd\n\
    ```\n`vsftpd` server is ready. See next tutorial on how to set up user's directory\
    \ and permission.\n\n## Setup Sub-Directory for Local Users\n\nProvides a tutorial\
    \ example on how to setup `ftp` sub-directory for local users and allow them upload\
    \ and download files using `vsftpd` on systems. With the `vsftpd` configuration\
    \ presented in the previous tutorial, I am ready to create a `ftp` directory under\
    \ my home for my upload and download files.\n\n### 1. Create `ftp` sub-directory\
    \ as my FTP home. Its ownership and permissions are changed to allow `vsftpd`\
    \ to access.\n```bash\nherong$ sudo mkdir /home/herong/ftp\nherong$ sudo chown\
    \ nobody:nobody /home/herong/ftp\nherong$ sudo a-w /home/herong/ftp\nherong$ sudo\
    \ ls -l /home/herong\ndr-xr-xr-x 2 nobody 6 Jun 23 17:03 ftp\n```\n\n### 2. Create\
    \ `ftp/files` sub-directory with private access for uploading and downloading\
    \ files.\n```bash\nherong$ sudo mkdir /home/herong/ftp/files\nherong$ sudo chown\
    \ herong:herong /home/herong/ftp/files\nherong$ sudo ls -lah /home/herong/ftp\n\
    dr-xr-xr-x 3 nobody 19 Jun 23 17:08 .\ndrwx------ 3 herong herong 94 Jun 23 17:07\
    \ ..\ndrwxr-xr-x 2 herong herong  6 Jun 23 17:08 files\n```\n\n### 3. Add myself\
    \ to the vsftpd allowed user list. Note that I am using `user_list` as the allowed\
    \ user list, different than the default setting. So I have to remove all users\
    \ in this file.\n```bash\nherong$ cd /etc/vsftpd\nherong$ sudo cp user_list user_list.bck\n\
    herong$ sudo vi user_list\n```\n```ini\n# vsftpd userlist\n# If userlist_deny=NO,\
    \ only allow users in this file\n# If userlist_deny=YES (default), never allow\
    \ users in this file, and\n# do not even prompt for a password.\n# Note that the\
    \ default vsftpd pam config also checks /etc/vsftpd/ftpusers\n# for users that\
    \ are denied.\n```\n\n### 4. Restart vsftpd:\n```bash\nherong$ sudo systemctl\
    \ restart vsftpd\n```\nMy FTP access is ready. See next tutorial on how to test\
    \ FTP locally.\n\n## Test FTP Locally on CentOS\n\nProvides a tutorial example\
    \ on how to use the `ftp` client program to access the `vsftpd` server locally\
    \ on the same CentOS computer. After updating `vsftpd` configuration and setting\
    \ up my `ftp` home directory, now I am ready to test my FTP access locally on\
    \ the same CentOS computer as the `vsftpd` server.\n\n### 1. Make sure the `ftp`\
    \ client program is available.\n```bash\nherong$ dnf info ftp\nLast metadata expiration\
    \ check: 6:29:59 ago on Tue 07 Jul 2020 11:12:35 PM EDT.\nAvailable Packages\n\
    Name:          ftp\nVersion:       0.17\nRelease:       78.el8\nArchitecture:\
    \  x86_64\nSize:          112 k\nSource:        ftp-0.17-78.el8.src.rpm\nRepository:\
    \    @System\nFrom repo:     AppStream\nSummary:       The standard UNIX FTP (File\
    \ Transfer Protocol) client\nURL:           ftp://ftp.linux.org.uk/pub/linux/Networking/netkit\n\
    License:       BSD with advertising\nDescription:   The ftp package provides the\
    \ standard UNIX command-line FTP (File\nTransfer Protocol) client. FTP is a widely\
    \ used protocol for\ntransferring files over the Internet and archiving files.\n\
    If your system is on a network, you should install ftp in order to do\nfile transfers.\n\
    herong$ sudo dnf install ftp\n...\nDownloading Packages:\nftp-0.17-78.el8.x86_64.rpm\
    \   373 kB/s |  70 kB   00:00\nInstalled:\nftp-0.17-78.el8.x86_64\nComplete!\n\
    ```\n\n### 2. Connect to FTP server locally:\n```bash\nherong$ ftp localhost\n\
    ```\n```text\nTrying ::1...\nConnected to localhost (::1).\n220 (vsFTPd 3.0.3)\n\
    Name (localhost:herong): herong\n331 Please specify the password.\nPassword:\n\
