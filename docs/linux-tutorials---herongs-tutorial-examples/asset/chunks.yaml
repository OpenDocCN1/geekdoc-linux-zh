- fmt: "\n```\ninet 192.168.1.100 netmask 255.255.255.0 broadcast 192.168.1.255\n\
    ...\n```\n\n```bash\nherong$ mysql -u root -p\n\nmysql> show variables like 'bind_address';\n\
    \n+---------------------+-------+\n| Variable_name       | Value |\n+---------------------+-------+\n\
    | bind_address        | *     |\n+---------------------+-------+\nmysql> show\
    \ variables like 'port';\n\n+---------------+-------+\n| Variable_name | Value\
    \ |\n+---------------+-------+\n| port          | 3306  |\n+---------------+-------+\n\
    ```\n\n## 2. Make sure that my MySQL user accounts covers my computer IP address.\n\
    \nI see that my computer IP address `192.168.1.11` is covered:(On the server)\n\
    \n```bash\nherong$ mysql -u root -p\n\nmysql> select user, host from mysql.user;\n\
    \n+------------------+--------------+\n| user             | host         |\n+------------------+--------------+\n\
    | herong           | localhost    |\n| herong           | 127.0.0.1    |\n| herong\
    \           | 192.168.1.%  |\n+------------------+--------------+\n```\n\n(On\
    \ my computer)\n\n```bash\nherong$ ifconfig\n\nen0: flags=8863<UP,BROADCAST,SMART,RUNNING,SIMPLEX,MULTICAST>\
    \ mtu 1500\ninet 192.168.1.11 netmask 0xffffff00 broadcast 192.168.1.255\n```\n\
    \n## 3. Checking IP address and port connection from my computer to the server.\n\
    \nI see that my computer can reach the server, but not the port `3306`.(On my\
    \ computer)\n\n```bash\nherong$ ping 192.168.1.100\n\nPING 192.168.1.100 (192.168.1.100):\
    \ 56 data bytes\n64 bytes from 192.168.1.100: icmp_seq=0 ttl=64 time=4.548 ms\n\
    64 bytes from 192.168.1.100: icmp_seq=1 ttl=64 time=2.308 ms\n...\n\nherong$ telnet\
    \ 192.168.1.100 3306\n\nTrying 192.168.1.100...\ntelnet: connect to address 192.168.1.100:\
    \ Connection refused\ntelnet: Unable to connect to remote host\n```\n\n## 4. Open\
    \ the firewall on the MySQL server for port 3306.\n\nThese commands opens port\
    \ `3306` for all computers on the Internet. I need to add more restrictions later.(On\
    \ the server)\n\n```bash\nherong$ sudo firewall-cmd --zone=public --add-port=3306/tcp\n\
    herong$ sudo firewall-cmd --runtime-to-permanent\n```\n\n## 5. Checking IP address\
    \ and port connection from my computer to the server again.\n\nI see that the\
    \ TCP/IP connection is open.\n\n```bash\nherong$ telnet 192.168.1.100 3306\n\n\
    Trying 192.168.1.100...\nConnected to 192.168.1.100.\nEscape character is '^]'.\n\
    J\n8.0.17/1TZi76?l...\n```\n\n## 6. Finally, connect to MySQL server from my client\
    \ computer:\n\n```bash\nherong$ /usr/local/mysql/bin/mysql -u herong -h 192.168.1.100\
    \ -p\n\nEnter password: TopSecret<Enter>\nmysql>\n```\n\nCool! I was able to setup\
    \ MySQL server and firewall to for TCP/IP connection from my client computer.\n\
    \n---\n\n## \"Server sent charset unknown to the client\" Error\n\nProvides a\
    \ tutorial example on how to resolve the 'Server sent charset unknown to the client'\
    \ error received in PHP `mysqli_connect()` call to MySQL 8.0 running on CentOS\
    \ 8 systems. If you are running an older version of PHP on a client computer and\
    \ tries to connection a MySQL 8.0 running on a CentOS system with the `mysqli_connect()`\
    \ function, you will get the \"Server sent charset unknown to the client\" error:\n\
    \n```bash\nherong$ php --version\nPHP 5.6.30 (cli) (built: Oct 29 2017 30:32)\n\
    \nherong$ php test.php\nPHP Warning: mysqli_connect(): Server sent charset (255)\
    \ unknown to the client. Please, report to the developers in /Users/herong/test.php\
    \ on line 10.\nPHP Warning: mysqli_connect(): (HY000/2054): Server sent charset\
    \ ...\n```\n\nBased on reports on the Internet, the above issue is caused by the\
    \ default setting of `character_set_client = utf8mb4`, which is unknown to older\
    \ `mysqli` modules. I have tried a number of solutions suggested on the Internet.\
    \ None of them works for me. Combinations of them are not working:\n\n- Run `set\
    \ global character_set_client = 'utf8';` on MySQL 8.0 server.\n- Run `set global\
    \ character_set_results = 'utf8';` on MySQL 8.0 server.\n- Run `set global character_set_connection\
    \ = 'utf8';` on MySQL 8.0 server.\n- Restart MySQL 8.0 server with the `skip-character-set-handshake`\
    \ option.\n- Restart MySQL 8.0 server with the `character_set_client=utf8` option.\n\
    \nThe only solution that worked for me is to upgrade PHP:\n\n```bash\nherong$\
    \ php --version\nPHP 7.2.1 (cli) (built: Oct 9 2018 15:09:36) NTSTS\n\nherong$\
    \ php test.php\nmysqli_get_server_info() = 8.0.17\nmysqli_get_host_info() = 192.168.1.100\
    \ via TCP/IP\n```\n\n---\n\n## Performance of Inserting Integers to MySQL\n\n\
    Provides a tutorial example on how to test the performance of inserting integers\
    \ into MySQL database using PHP `mysqli` functions. MySQL server is 100 times\
    \ slower on my CentOS and macOS computer. If you are working with large sets,\
    \ then you need to know the performance of MySQL server. Here are some measurements\
    \ I collected on MySQL servers running CentOS 8 and macOS computers. Create a\
    \ PHP script to measure the speed of inserting into database.\n\n```php\n<?php\n\
    # speed-of-insert-integer.php\n# Copyright (c) Herong.com. All Rights Reserved.\n\
    \n$count = 100;\nif (count($argv) > 1) $count = $argv[1];\n$binLog = \"on\";\n\
    if (count($argv) > 2) $binLog = $argv[2];\n\nprint(\"Testing parameters:\\n\"\
    );\nprint(\"Number of operations: $count\\n\");\nprint(\"Binary log = $binLog\\\
    n\");\n\n$con = mysqli_connect(\"127.0.0.1\", 'herong', 'TopSecret', \"test\"\
    );\n$sql = \"SET sql_log_bin = $binLog\";\n$res = mysqli_query($con, $sql);\n\
    $sql = \"CREATE TABLE Tests (Quantity INTEGER);\n$res = mysqli_query($con, $sql);\n\
    $startTime = round(microtime(true)*1000);\n\n$i = 0;\nwhile ($i < $count) {\n\
    \    $sql = \"INSERT INTO Tests VALUES ($i)\";\n    $res = mysqli_query($con,\
    \ $sql);\n    $i++;\n}\n$endTime = round(microtime(true)*1000);\n$exeTime = $endTime\
    \ - $startTime;\n\nprint(\"Testing result:\\n\");\nprint(\"Execution time in milliseconds\
    \ = $exeTime\\n\");\nprint(\"Milliseconds per operation = \".round($exeTime/$count).\"\
    \\n\");\n\n$sql = \"SELECT COUNT(*) FROM Tests\";\n$res = mysqli_query($con, $sql);\n\
    $row = mysqli_fetch_array($res);\nprint(\"Records inserted = $row[0]\\n\");\n\n\
    $sql = \"DROP TABLE Tests\";\n$res = mysqli_query($con, $sql);\nmysqli_close($con);\n\
    ?>\n```\n\n### 2. Establish performance baseline for the MySQL server on my CentOS\
    \ 8 computer.\n\nI see that inserting an integer into the database took about\
    \ 55 milliseconds. This is too high and needs to be investigated.\n\n```bash\n\
    centos$ php speed-of-insert-integer.php 100\nTesting parameters:\nNumber of operations:\
    \ 100\nBinary log = on\nTesting result:\nExecution time in milliseconds = 5295\n\
    Milliseconds per operation = 53\nRecords inserted = 100\n\ncentos$ php speed-of-insert-integer.php\
    \ 1000\nTesting parameters:\nNumber of operations: 1000\nBinary log = on\nTesting\
    \ result:\nExecution time in milliseconds = 59162\nMilliseconds per operation\
    \ = 59\nRecords inserted = 1000\n```\n\n### 3. Check the impact of binary logging\
    \ on the MySQL server on my CentOS 8 computer.\n\nI see that turning off binary\
    \ logging does not improve the performance. This is also a surprise to me.\n\n\
    ```bash\ncentos$ php speed-of-insert-integer.php 100 off\nTesting parameters:\n\
    Number of operations: 100\nBinary log = off\nTesting result:\nExecution time in\
    \ milliseconds = 5586\nMilliseconds per operation = 56\nRecords inserted = 100\n\
    ```\n\n### 4. Compare performance with the MySQL server on my macOS 10 computer.\n\
    \nI see that my macOS computer is 100 times faster! This is a big surprise to\
    \ me!\n\n```bash\nmacOS$ php speed-of-insert-integer.php 100\nTesting parameters:\n\
    Number of operations: 100\nBinary log = on\nTesting result:\nExecution time in\
    \ milliseconds = 47\nMilliseconds per operation = 0\nRecords inserted = 100\n\n\
    macOS$ php speed-of-insert-integer.php 1000\nTesting parameters:\nNumber of operations:\
    \ 1000\nBinary log = on\nTesting result:\nExecution time in milliseconds = 397\n\
    ```\n"
