  trans: "\n\n太棒了！我已经在 CentOS 计算机上安装了“mysql-server” 8.0，没有任何问题。MySQL 客户端程序 `mysql`\
    \ 也可以运行。请查看接下来的教程，如何在 CentOS 系统上启动和停止 MySQL 服务。\n\n# 在 CentOS 上管理 MySQL 服务 'mysqld'\n\
    \n提供了一个教程示例，介绍如何使用 `systemctl` 命令在 CentOS 8 系统上作为系统服务启动和停止 MySQL 服务器程序 `mysqld`。在使用\
    \ `yum` 命令在 CentOS Linux 系统上安装 MySQL 服务器后，你需要学习如何管理它。第一个任务是启动或停止 MySQL 服务器。以下是我在\
    \ CentOS 8 计算机上的操作。\n\n### 1. 检查 MySQL 服务器状态。\n我看到一个错误信息，因为它没有运行。\n```bash\nherong$\
    \ mysqladmin status\nmysqladmin: connect to server at 'localhost' failed\nerror:\
    \ 'Can't connect to local MySQL server through socket ...\nCheck that mysqld is\
    \ running and that the socket:\n    '/var/lib/mysql/mysql.sock' exists!\n```\n\
    \n### 2. 作为系统服务启动 MySQL 服务器：\n我看到一个错误信息，因为它在 CentOS 8 上没有被启用。\n```bash\nherong$\
    \ sudo systemctl start mysqld.service\nFailed to start mysqld.service: Unit mysqld.service\
    \ not found.\n```\n\n### 3. 将 MySQL 服务器设置为系统服务。\n```bash\nherong$ sudo systemctl\
    \ enable mysqld.service\nCreated symlink /etc/systemd/system/multi-user.target.wants/mysqld.service\n\
    \    /usr/lib/systemd/system/mysqld.service.\n```\n\n### 4. 再次检查 MySQL 服务器状态。\n\
    我看到服务器正在运行。而且“root”用户没有密码！\n```bash\nherong$ mysqladmin status -u root -p\nEnter\
    \ password: <Enter>\nUptime: 82  Threads: 2  Questions: 5  Slow queries: 0  Opens:\
    \ 115\n    Flush tables: 3  Open tables: 35  Queries per second avg: 0.060\n```\n\
    \n### 5. 停止 MySQL 服务器。\n```bash\nherong$ sudo systemctl stop mysqld.service\n\
    ```\n\n### 6. 再次启动 MySQL 服务器。\n```bash\nherong$ sudo systemctl start mysqld.service\n\
    ```\n\n### 7. 使用 \"mysql\" 客户端程序连接 MySQL 服务器：\n```bash\nherong$ mysql -u root\
    \ -p\nEnter password: <Enter>\n...\nmysql> show databases;\n+--------------------+\n\
    | Database           |\n+--------------------+\n| information_schema |\n| mysql\
    \              |\n| performance_schema |\n| sys               |\n+--------------------+\n\
    ```\n\n太棒了。我可以在我的 CentOS 8 计算机上作为系统服务启动和停止 MySQL 服务器了。你也可以使用 `service` 命令（它实际上调用了\
    \ `systemctl` 命令）来启动和停止 MySQL 服务器：\n```bash\nherong$ sudo service mysqld start\n\
    herong$ sudo service mysqld stop\n```\n\n但不要尝试直接运行 MySQL 服务器程序 `mysqld`。你会遇到错误。\n\
    ```bash\nherong$ sudo mysqld\n[System] [MY-010116] [Server] /usr/libexec/mysqld\
    \ (mysqld 8.0.17) starting\n    as process 15754\n[ERROR] [MY-010123] [Server]\
    \ Fatal error: Please read \"Security\" section\n    of the manual to find out\
    \ how to run mysqld as root!\n[ERROR] [MY-010119] [Server] Aborting\n[System]\
    \ [MY-010910] [Server] /usr/libexec/mysqld: Shutdown complete\n    (mysqld 8.0.17)\
    \  Source distribution.\n```\n\n# 在 CentOS 上设置 MySQL 服务器 \"root\" 密码\n\n提供了一个教程示例，如何在\
    \ CentOS 8 系统上的 MySQL 8.0 服务器设置或重置 'root' 密码，以防没有密码或你忘记了密码。在 CentOS 上安装 MySQL\
    \ 数据库服务器时，它会创建一个“root”用户名来访问数据库内容。此“root”用户拥有访问数据库对象的所有权限。但它默认没有密码。因此，在向 MySQL\
    \ 数据库添加任何数据之前，你应该为此“root”用户设置密码以保护你的数据。以下是我在 CentOS 8 计算机的 MySQL 8 服务器上的操作。\n\n\
    ### 1. 使用无密码的 \"root\" 用户连接 MySQL 8 服务器：\n```bash\nherong$ mysql -u root -p\n\
    Enter password: <Enter>\n...\nmysql>\n```\n\n### 2. 检查 \"root\" 的当前密码。\n我看到 \"\
    root\" 用户没有密码：\n```sql\nmysql> select user, host, plugin, authentication_string\
    \ from mysql.user;\n+----------------+-------------+-------------+-----------------------+\n\
    | user              | host        | plugin | authentication_string |\n+----------------+-------------+-------------+-----------------------+\n\
    | information_schema | localhost | caching_sha2_password | $A005$... |\n| mysql.session\
    \       | localhost | caching_sha2_password | $A005$... |\n| mysql.sys       \
    \   | localhost | caching_sha2_password | $A005$... |\n| root                |\
    \ localhost | mysql_native_password | 8E4DE7FB... |\n+----------------+-------------+-------------+-----------------------+\n\
    ```\n\n### 3. 为当前登录用户 \"root\" 设置新密码。\n```sql\nmysql> set password = 'TopSecret';\n\
    mysql> select user, host, plugin, authentication_string from mysql.user;\n+----------------+-------------+-------------+-----------------------+\n\
    | user              | host        | plugin | authentication_string |\n+----------------+-------------+-------------+-----------------------+\n\
    | information_schema | localhost | caching_sha2_password | $A005$... |\n| mysql.session\
    \       | localhost | caching_sha2_password | $A005$... |\n| mysql.sys       \
    \   | localhost | caching_sha2_password | $A005$... |\n| root                |\
    \ localhost | mysql_native_password | 8E4DE7FB... |\n+----------------+-------------+-------------+-----------------------+\n\
    ```\n\n### 4. 断开并使用新密码连接：\n```bash\nmysql> exit;\nBye\nherong$ mysql -u root -p\n\
    Enter password: TopSecret<Enter>\n...\nmysql>\n```\n\n太棒了。我已经为我的 MySQL 8 服务器上的\
    \ \"root\" 用户添加了密码。并不是没有其他设置或重置 \"root\" 密码的方法：\n*   使用 `mysqladmin -u root -p\
    \ password new_password` 命令。\n*   使用 `alter user root identified by 'new_password';`\
    \ MySQL 命令。\n*   使用 `update mysql.user set authentication_string = '' where user='root';`\
    \ SQL 语句直接更新用户表，但这并不推荐。\n\n如果你丢失了 \"root\" 密码，只有一种方法可以通过运行无密码保护的 MySQL 服务器来恢复它：\n\
    ```bash\nherong$ sudo service mysqld stop\nherong$ sudo mysqld --skip-grant-tables\
    \ &\nherong$ mysql -u root\nmysql> set password = 'TopSecret';\nmysql> quit;\n\
    herong$ killall mysqld\nherong$ sudo service mysqld\n```\n\n# CentOS  MySQL 文件位置\n\
    \n提供了一个教程示例，如何为 CentOS 8 系统上的 MySQL 8.0 服务器查找和查看 MySQL 服务器文件位置。为了正确维护 MySQL 服务器，你需要知道\
    \ MySQL 服务器如何以及存储何处存储。例如，以下是我的 CentOS 8 计算机上 MySQL 服务器文件的位置：\n\n### 1. MySQL 命令程序存储在\
    \ 2 个目录中：\n```bash\nherong$ ls -l /usr/sbin | grep mysql\nlrwxrwxrwx. 1 root root\
    \ 19 Oct 8 09:34 mysqld -> /usr/libexec/mysqld\nherong$ ls -l /usr/bin | grep\
    \ mysql\n-rwxr-xr-x. 1 root root 7703224 Oct 8 09:37 mysql\n-rwxr-xr-x. 1 root\
    \ root 7474568 Oct 8 09:37 mysqladmin\n-rwxr-xr-x. 1 root root 8198496 Oct 8 09:37\
    \ mysqlbinlog\n-rwxr-xr-x. 1 root root 7495768 Oct 8 09:37 mysqlcheck\n-rwxr-xr-x.\
    \ 1 root root 674528 Oct 8 09:37 mysql_config_editor\n-rwxr-xr-x. 1 root root\
    \ 4392 Oct 8 09:24 mysqld_pre_systemd\n-rwxr-xr-x. 1 root root 7587512 Oct 8 09:37\
