  trans: "\n\n开启指定的布尔值并永久保存更改\n`togglesebool` `boolean_name`\n\n切换指定布尔值的状态\n\n# SELinux\
    \ - 安全增强型 Linux\n\n提供了与 SELinux 相关的常用工具简要介绍。有几个重要的工具可以管理 SELinux 系统：\n\n1. `semanage`\
    \ - SELinux 策略管理工具。\n```\nherong$ semanage -h\n```\n`semanage` 用于配置 SELinux 策略的某些元素，而无需修改或重新编译策略源文件。\n\
    \n位置参数：\n- `import`: 导入本地自定义配置\n- `export`: 输出本地自定义配置\n- `login`: 管理 Linux 用户与\
    \ SELinux 用户之间的登录映射\n- `user`: 管理 SELinux 用户（SELinux 用户所属的角色和级别）\n- `port`: 管理网络端口类型定义\n\
    - `ibpkey`: 管理 infiniband ibpkey 类型定义\n- `ibendport`: 管理 infiniband 终端端口类型定义\n\
    - `interface`: 管理网络接口类型定义\n- `module`: 管理 SELinux 策略模块\n- `node`: 管理网络节点类型定义\n\
    - `fcontext`: 管理文件上下文映射定义\n- `boolean`: 管理用于选择性启用功能的布尔值\n- `permissive`: 管理进程类型强制模式\n\
    - `dontaudit`: 禁用/启用策略中的 dontaudit 规则\n\n2. `seinfo` - SELinux 策略信息工具。`seinfo`\
    \ 未包含在默认的 CentOS 8 系统中。你需要安装 `setools-console` 软件包来使用它。\n```\nherong$ seinfo\n\
    bash: seinfo: command not found...\nInstall package 'setools-console' to provide\
    \ command 'seinfo'? [N/y] n\nherong$ sudo dnf install setools-console\n...\nInstalled:\n\
    \  setools-console-4.2.2-2.el8.x86_64\nherong$ seinfo -h\n...\n```\n组件查询：\n- `-a\
    \ [ATTR], --attribute [ATTR]`: 打印类型属性。\n- `-b [BOOL], --bool [BOOL]`: 打印布尔值。\n\
    - `-c [CLASS], --class [CLASS]`: 打印对象类。\n- `-r [ROLE], --role [ROLE]`: 打印角色。\n\
    - `-t [TYPE], --type [TYPE]`: 打印类型。\n- `-u [USER], --user [USER]`: 打印用户。\n\n3.\
    \ `sesearch` - SELinux 策略规则搜索工具。`sesearch` 未包含在默认的 CentOS 8 系统中。你需要安装 `setools-console`\
    \ 软件包来使用它。\n```\nherong$ sesearch -h\nusage: sesearch [-h] [--version] [-v] [--debug]\
    \ [-A] [--allow] [--allowxperm]\n    [--auditallow] [--auditallowxperm] [--dontaudit]\n\
    \    [--dontauditxperm] [--neverallow] [--neverallowxperm] [-T]\n    [--type_change]\
    \ [--type_member] [--role_allow] [--role_trans]\n    [--range_trans] [-s SOURCE]\
    \ [-t TARGET] [-c TCLASS] [-p PERMS]\n    [-x XPERMS] [-D DEFAULT] [-b BOOL] [-eb]\
    \ [-ep] [-ex] [-ds]\n    [-dt] [-rs] [-rt] [-rc] [-rd] [-rb]\n    [policy]\n```\n\
    \n4. `newrole` - 使用新的 SELinux 角色运行 shell。`newrole` 未包含在默认的 CentOS 8 系统中。你需要安装\
    \ `policycoreutils-newrole` 软件包来使用它。\n```\nherong$ newrole\nbash: newrole: command\
    \ not found...\nInstall package 'policycoreutils-newrole' to provide command 'newrole'?\
    \ [N/y]\nherong$ sudo dnf install policycoreutils-newrole\n...\npolicycoreutils-newrole-2.9-9.el8.x86_64\n\
    Installed:\n  policycoreutils-newrole-2.9-9.el8.x86_64\nherong$ newrole\nUSAGE:\
    \ newrole -r role ] -t type ] -l level ] -p ] -V ] [ args ]\n```\n\n5. `fixfiles`\
    \ - 修复 SELinux 安全上下文。\n```\nherong$ man fixfiles\nfixfiles [-v] [-f] relabel\n\
    fixfiles [-v] [-F] { check | restore } dir/file\nfixfiles [-v] [-F] -B { check\
    \ | restore }\nfixfiles [-v] [-F] -C PREVIOUS_CONTEXT { check | restore } onboot\n\
    ```\n\n# SELinux 错误消息\n\n提供了 SELinux 错误的简要介绍，这些错误记录在 `/var/log/messages` 文件中。你可以获取错误的更详细信息以及一些建议的解决方案。默认情况下，SELinux\
    \ 错误消息记录在 `/var/log/messages` 中。以下是我 CentOS 8 计算机上的 SELinux 错误消息示例。\n\nphp-fpm\
    \ 因 SELinux 类型错误无法运行 PHP 脚本。错误消息建议你运行 `sealert` 以获取更详细的信息。\n```\nherong$ sudo\
    \ cat /var/log/messages | grep SELinux | more\n...\nSELinux is preventing /usr/sbin/php-fpm\
    \ from read access on the file test.php. For complete SELinux messages run:\n\
    sealert -l 06a19151-14d3-4930-e18-4c0f0696350\nherong$ sealert -l 06a19151-14d3-4930-e18-4c0f0696350\n\
    SELinux is preventing /usr/sbin/php-fpm from read access on file test.php.\n*****\
    \ Plugin catchall_boolean (89.3 confidence) suggests *****\nIf you want to allow\
    \ httpd to read user content you must tell SELinux about this by enabling the\
    \ 'httpd_read_user_content' boolean.\nDo\nsetse -P httpd_read_user_content 1\n\
    ```\n附加信息：\n- 源上下文: `system_u:system_r:httpd_t:s0`\n- 目标上下文: `unconfined_u:object_r:user_home_t:s0`\n\
    - 目标对象: `test.php [ file ]`\n- 源: `php-fpm`\n- 源路径: `/usr/sbin/php-fpm`\n- 主机:\
    \ `localhost.localdomain`\n- 源 RPM 包:\n- 目标 RPM 包:\n- 策略 RPM: `selinux-policy-3.14.3-20.el8.noarch`\n\
    - SELinux 启用: `True`\n- 策略类型: `targeted`\n- 强制模式: `Enforcing`\n\nhttpd/php-fpm\
    \ 无法运行尝试调用 `curl` 接口的 PHP 脚本文件。建议的解决方案非常准确。\n```\nherong$ sudo cat /var/log/messages\
    \ | grep SELinux | more\n...\nsetroubleshoot[24609]: SELinux is preventing /usr/bin/curl\
    \ from name_connect access on the tcp_socket. For complete SELinux messages run:\n\
    sealert -l 06a19151-14d3-4930-e18-4c0f0696350\nherong$ sealert -l 06a19151-14d3-4930-e18-4c0f0696350\n\
    SELinux is preventing /usr/bin/curl from name_connect access on the tcp_socket.\n\
    ***** Plugin catchall_boolean (89.3 confidence) suggests *****\nIf you want to\
    \ allow httpd to read user content you must tell SELinux about this by enabling\
    \ the 'httpd_read_user_content' boolean.\nDo\nsetse -P httpd_read_user_content\
    \ 1\n```\n附加信息：\n- 源上下文: `system_u:system_r:httpd_t:s0`\n- 目标上下文: `unconfined_u:object_r:user_home_t:s0`\n\
    - 目标对象: `test.php [ file ]`\n- 源: `php-fpm`\n- 源路径: `/usr/sbin/php-fpm`\n- 主机:\
    \ `localhost.localdomain`\n\n# SELinux 相关术语\n\n提供了与 SELinux 相关的常用术语列表。以下是一些与 SELinux\
    \ 相关的常用术语：\n\n- **ACL (Access Control List) 访问控制列表**：与对象关联的权限列表。例如，`rw-rw-r--`\
    \ 是与文件关联 ACL：`-rw-rw-r-- . 1 herong herong 0 Sep 12 04:50 myfile`。它表示“herong”作为所有者可以读写，“herong”\
    \ 组的用户可以读写，其他用户可以读。\n\n- **AVC (Access Vector Vache) 访问向量缓存**：存储主体和对象权限的缓存，以便快速访问。\n\
    \n- **DAC (Discretionary Access Control) 自主访问控制**：一种基于每个对象关联的 ACL（访问控制列表）的权限系统。Linux\
    \ 默认安全使用 DAC。\n\n"
- fmt: "\n# SELinux Core Concepts\n\n- `MAC (Mandatory Access Control)` - A type of\
    \ permission system that is based on a set of explicit security policies stored\
    \ in a database. `SELinux` uses `MAC`.\n- `MCS (Multi-Category Security)` - The\
    \ ability for a permission system to associated different categories (for example:\
    \ Core, Utility, Add-on) of securities to information objects.\n- `MLS (Multi-Level\
    \ Security)` - The ability for a permission system to associated different levels\
    \ (for example: Unclassified, Confidential, Secret, Top Secret) of securities\
    \ to information objects. Security levels are having hierarchical relations. Higher\
    \ security levels are usually have less permitted actions.\n- `SELinux User` -\
    \ An abstract concept that represents a group of real users on the Linux system\
    \ as security subject in `SELinux` system.\n- `SELinux Role` - An abstract concept\
    \ that represents a set of permissions grouped together for a specific functional\
    \ role.\n- `SELinux Type` - An abstract concept that represents a set of files/directories\
    \ grouped together, so that security policy can be applied at the group level\
    \ instead of individually at files/directories level.\n- `SELinux Domain` - An\
    \ abstract concept that represents a set of running processes grouped together,\
    \ so that security policy can be applied at the group level instead of individually\
    \ at process level.\n- `SELinux Class` - An abstract concept that represents a\
    \ subset of `SELinux Types` based on the nature of the targeted resource, like\
    \ \"file\", \"dir\", \"socket\", etc.\n\n# Network Connection on CentOS\n\nProvides\
    \ introductions and tutorial on network configuration and firewall on CentOS systems.\
    \ Topics include introduction of Ethernet connection with auto DHCP configuration;\
    \ `ifconfig` to view current network configuration; `firewalld` daemon and `firewall-cmd`\
    \ CLI as firewall frontend tools; `nftables` daemon and `nft` CLI as firewall\
    \ backend tools; `nmap` as network scanner; `netstat` as network activity monitor.\n\
    \n## Takeaways\n\n- Ethernet connection setting can be automatically done with\
    \ `DHCP (Dynamic Host Configuration Protocol)` service from the local network\
    \ on CentOS systems.\n- `ifconfig` command can be used to view the current network\
    \ configuration on all network interfaces on CentOS systems.\n- `firewalld` daemon\
    \ and `firewall-cmd` CLI (Command Line Interface) are the frontend tools to manage\
    \ network firewall on CentOS systems.\n- `nftables` daemon and `nft` CLI (Command\
    \ Line Interface) are the backend tools to manage network firewall on CentOS systems.\n\
    - `iptables` command is replaced by `nftables` daemon and `nft` CLI on CentOS\
    \ 8 systems.\n- `nmap (Network Mapper)` is a network exploration tool and security\
    \ scanner.\n- `netstat (Network Status)` is a network activity monitor tool.\n\
    \n# Setup Ethernet Connection on CentOS\n\nProvides a tutorial example on how\
    \ to review and troubleshoot Ethernet connection on CentOS 8 systems. If you are\
    \ running a CentOS system on a desktop computer, it is most likely having an Ethernet\
    \ connection to the local network. Here is what I did to review and setup the\
    \ Ethernet connection on my CentOS 8 computer.\n\n1. Make sure the computer is\
    \ connected with an Ethernet cable to the local network. You should see two lights\
    \ next to the Ethernet port. If one of them is blinking, then there are some data\
    \ activities between your computer and the network.\n2. Review Ethernet connection\
    \ settings from the desktop screen.\n   - Click the Ethernet icon on the top-right\
    \ corner of the screen.\n   - Click to open \"Wired\" connection line. You should\
    \ see the Network settings screen.\n   - Click the switch to turn it on.\n   -\
    \ Click the settings icon. You should see Wired connection details.\n3. Read the\
    \ Wired connection details. By default, your IP address, default route (gateway),\
    \ DNS are dynamically configured by the `DHCP (Dynamic Host Configuration Protocol)`\
    \ service from the local network. There is no need to change them.\n   - Link\
    \ Speed: 100 Mb/s\n   - IPv4 Address: 192.168.1.100\n   - Hardware Address: ...\n\
    \   - Default Route: 192.168.1.1\n   - DNS: 192.168.1.1\n\n![](Image00006.jpg)\n\
    \n4. You can also verify the Ethernet connection with the `ifconfig` command:\n\
    \n```bash\nherong$ ifconfig\n\neno1: flags=4163<UP,BROADCAST,RUNNING,MULTICAST>\
    \  mtu 1500\n     inet 192.168.1.100  netmask 255.255.255.0  broadcast 192.168.1.255\n\
    \     inet6 fe80::...:fe80  prefixlen 64  scopeid 0x20<link>\n     ether 39:39:...\
    \  txqueuelen 1000  (Ethernet)\n     RX packets 1162982  bytes 31120747 (296.7\
    \ MiB)\n     RX errors 0  dropped 61365  overruns 0  frame 0\n     TX packets\
    \ 247671  bytes 58741459 (56.0 MiB)\n     TX errors 0  dropped 0 overruns 0  carrier\
    \ 0  collisions 0\n     device interrupt 20  memory 0xf7c00000-f7c20000\n\n5.\
    \ Verify the Internet connection using the `ping` command:\n\n```bash\nherong$\
    \ ping bing.com\n\nPING bing.com (204.79.197.200) 56(84) bytes of data.\n64 bytes\
    \ from a-0001.a-msedge.net (204.79.197.200): icmp_seq=1 ttl=118 time=21.1 ms\n\
    64 bytes from a-0001.a-msedge.net (204.79.197.200): icmp_seq=2 ttl=118 time=20.9\
    \ ms\n...\n64 bytes from a-0001.a-msedge.net (204.79.197.200): icmp_seq=9 ttl=118\
    \ time=20.8 ms\n\n^C\n--- bing.com ping statistics ---\n9 packets transmitted,\
    \ 9 received, 0% packet loss, time 18ms\nrtt min/avg/max/mdev = 20.658/21.993/30.929/3.163\
    \ ms\n```\n\n6. Check the following if the `ping` command fails:\n   - Check the\
    \ Ethernet cable connections at both ends.\n   - Change the Ethernet cable to\
    \ a new one.\n   - Move your computer to different Ethernet jacket.\n   - Verify\
    \ local network gateway firewall settings. Make sure your IP address or MAC address\
    \ is not blocked on the blacklist.\n"
