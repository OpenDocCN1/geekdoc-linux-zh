- fmt: '

    Socket Connection works under the following rules:


    1. By default, the Socket Connection is turned on for MySQL 8 server.

    2. Socket Connection is represented with socket files on CentOS system with `mysqlx_socket`
    and `socket` variables for their locations:

    ```mysql

    mysql> show variables like ''%socket'';

    ```

    +---------------+----------------------------+

    | Variable_name | Value                      |

    +---------------+----------------------------+

    | mysqlx_socket | /var/lib/mysql/mysqlx.sock |

    | socket        | /var/lib/mysql/mysql.sock  |

    +---------------+----------------------------+

    3. Users must be created with "localhost" as host named to use the Socket Connection.
    For example, "root" and "herong" are users who can use the Socket Connection based
    on the `mysql.user` records:

    ```mysql

    mysql> select user, host from mysql.user;

    ```

    +------------------+-----------+

    | user             | host      |

    +------------------+-----------+

    | mysql.infoschema | localhost |

    | mysql.session    | localhost |

    | mysql.sys        | localhost |

    | root             | localhost |

    | herong           | localhost |

    +------------------+-----------+

    4. Client programs must use "localhost" as the host name to use the Socket Connection.
    For example, the following PHP statement will connect to the MySQL server using
    the Socket Connection:

    ```php

    $conn = mysqli_connect("localhost", ''herong'', ''TopSecret'');

    ```

    5. MySQL client tools connect to the SQL server use the Socket Connection with
    the default `-h localhost` option. See the example below:

    ```bash

    herong$ mysql -u herong -p

    Enter password: junk<Enter>

    ERROR 1045 (28000): Access denied for user ''herong''@''localhost'' ...

    ```

    Socket Connection is more secure. But it only allows connections from the same
    host as the MySQL server. To allow connections from a remote host, you have to
    use the TCP/IP connection as shown in the next tutorial.


    MySQL server supports 2 types of connections from client programs:


    - Socket Connection, or Named Pipe Connection - Allows client programs from the
    local host to access the server without using the TCP/IP protocol.

    - TCP/IP Connection - Allows client programs from any hosts to access the server
    using the TCP/IP protocol.


    TCP/IP Connection works under the following rules:


    1. By default, the TCP/IP Connection is turned on for MySQL 8 server.

    2. The MySQL server listens on the IP address of the server host specified in
    the `bind_address` variable. A comma-separated IP list can be specified if the
    server has multiple IP addresses. Wildcard `*` can be specified to listen to all
    IP addresses on the server. `bind_address` is set to `*` by default for MySQL
    8.0 server on CentOS 8.

    ```mysql

    mysql> show variables like ''%bind_address'';

    ```

    +---------------------+-------+

    | Variable_name       | Value |

    +---------------------+-------+

    | bind_address        | *     |

    | mysqlx_bind_address | *     |

    +---------------------+-------+

    3. `bind_address` is a read only variable, you need to set it in MySQL server
    configuration file, `/etc/my.cnf.d/mysql-server.cnf`, which is included in the
    `/etc/my.cnf` file. For example, you can change `bind_address` to a specific IP
    address to make the server more secure. Remember to restart MySQL server after
    changing the configuration file.

    ```bash

    herong$ sudo cat /etc/my.cnf.d/mysql-server.cnf

    [mysqld]

    # Listen to the loopback IP address only so only client programs

    # from the server host can use the TCP/IP connection.

    # bind_address=127.0.0.1

    # Listen to the local IP address only so only client programs

    # from other local IP address, 192.168.1.* can use the TCP/IP connection

    # bind_address=192.168.1.100

    # Default - Listen to all IP addresses on the server host.

    bind_address=*

    ```

    4. The MySQL server listens on IP port 3306 specified in the `port` variable,
    which is a read only variable too. If you need to change it, you have to set it
    MySQL server configuration file, `/etc/my.cnf.d/mysql-server.cnf`, which is included
    in the `/etc/my.cnf`.

    5. Users must be created with their IP address as host names to use the TCP/IP
    Connection. The format of a user from a given IP address is `''user''@''ip_address''`.
    You can use wildcard characters in the IP address to represent a range of IP addresses.
    For example, `''herong''@''127.0.0.1''` allows me to connect to the server from
    my computer that has IP address `192.168.1.11`. `''herong''@''192.168.1.%''` allows
    me to connect to the server from any computer on the local network. `''herong''@''%''`
    allows me to connect to the server from any computer on the Internet. See MySQL
    commands below to create multiple users to use the TCP/IP connection from different
    client hosts:

    ```mysql

    mysql> # use the TCP/IP connection on the same host

    mysql> create user ''herong''@''127.0.0.1'' by ''TopSecret'';

    mysql> # Allow TCP/IP connection from my computer

    mysql> create user ''herong''@''192.168.1.11'' by ''TopSecret'';

    mysql> # Allow TCP/IP connection from any computer on the local network

    mysql> create user ''herong''@''192.168.1.%'' by ''TopSecret'';

    mysql> # Allow TCP/IP connection from any computer on the Internet

    mysql> create user ''herong''@''%'' by ''TopSecret'';

    mysql> select user, host from mysql.user;

    ```

    +------------------+--------------+

    | user             | host           |

    +------------------+--------------+

    | herong           | localhost      |

    | herong           | 127.0.0.1      |

    | herong           | 192.168.1.11   |

    | herong           | 192.168.1.%    |

    | herong           | %              |

    +------------------+--------------+

    6. Client programs can specify the IP address and the port number where the MySQL
    server is listening to make a TCP/IP Connection. For example, the following PHP
    statements will connect to the MySQL server using the TCP Connection:

    ```php

    # MySQL is listening on 127.0.0.1 at 3306:

    $conn = mysqli_connect("127.0.0.1", ''herong'', ''TopSecret'');

    # MySQL is listening on 192.168.1.100 at 3306:

    $conn = mysqli_connect("192.168.1.100", ''herong'', ''TopSecret'');

    # MySQL is listening on 192.168.1.100 at 3307:

    $conn = mysqli_connect("192.168.1.100:3307", ''herong'', ''TopSecret'');

    ```

    7. MySQL client tools connect to the SQL server use the TCP/IP Connection with
    given `-h ip_address` and `-P port_nunber` options. See the example below:

    ```bash

    herong$ mysql -u herong -h 192.168.1.100 -p

    herong$ mysql -u herong -h 192.168.1.100 -P 3307 -p

    ```

    8. The last issue you may have on using TCP/IP connection is network firewall.
    Firewall may stop your TCP/IP connection in 4 places:

    - Firewall on your computer must allow TCP outbound request to the MySQL server.

    - Firewall on your computer local network must allow your TCP request to go out.

    - Firewall on the gateway the MySQL server local network must allow your TCP request
    to go in.

    - Firewall on the MySQL server must to be open to accept TCP inbound requests
    from your IP address.

    '
