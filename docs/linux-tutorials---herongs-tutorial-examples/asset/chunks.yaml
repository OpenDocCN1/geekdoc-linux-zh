    # SELinux - Security-Enhanced Linux


    ## Is SELinux (Security-Enhanced Linux)

    Provides a quick introduction on SELinux (Security-Enhanced Linux), which is made
    of two components: Security Server and Policy Database. They work together to
    provide security services to any subject who wants to access a given object on
    the Linux system.


    ### What Is SELinux (Security-Enhanced Linux)?

    SELinux is a security architecture for Linux® systems that allows administrators
    to have more control over who can access the system. It was originally developed
    by the United States National Security Agency (NSA) as a series of patches to
    the Linux kernel using Linux Security Modules (`LSM`).


    SELinux is made of two components: SELinux Security Server and SELinux Policy
    Database. They work together to provide security services to any subject who wants
    to access a given object on the Linux system as shown below (source: mit.edu):


    ![](Image00005.jpg)


    ### SELinux - Access Permission Decision Process

    When a subject (for example, an application), attempts to access an object (for
    example, a file), the policy enforcement server in the kernel checks an access
    vector cache (`AVC`), where subject and object permissions are cached. If a decision
    cannot be made based on data in the AVC, the request continues to the security
    server, which looks up the security context of the application and the file in
    a matrix. Permission is then granted or denied, with an `avc: denied` message
    detailed in `/var/log/messages` if permission is denied. The security context
    of subjects and objects is applied from the installed policy, which also provides
    the information to populate the security server''s matrix.


    When SELinux is running and enforced, your Linux system will have two levels of
    security controls running together, which will cause you more confusions, but
    give you a more secure environment.


    *   **Linux Default Access Control**: A DAC (Discretionary Access Control) type
    of permission system based an access control matrix of ownerships (User, Group,
    and Other) and access types (Read, Write, and Execute).

    *   **SELinux Access Control**: A MAC (Mandatory Access Control) type of permission
    system based on explicit access rules stored a policy database.


    So a user may have the permission to read a file by the Linux Default Access Control,
    but still gets rejected by the SELinux Access Control. For more information, see
    "USING SELINUX" guide at `https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/8/html/using_selinux/index`.


    ## SELinux Configuration and Status on CentOS

    Provides a tutorial example on how to view the current SELinux configuration by
    looking at the `/etc/sysconfig/selinux` file, and the current SELinux status by
    running the `/usr/sbin/sestatus` command.


    If you are running a CentOS 8 system, SELinux is installed and running by default.
    You can view the current configuration of SELinux by looking at the `/etc/sysconfig/selinux`
    file. Here is what I have on my CentOS 8 computer:


    ```bash

    herong$ more /etc/sysconfig/selinux


    # This file controls the state of SELinux on the system.

    # SELINUX= can take one of these three values:

    #      enforcing - SELinux security policy is enforced.

    #      permissive - SELinux prints warnings instead of enforcing.

    #      disabled - No SELinux policy is loaded.

    SELINUX=enforcing


    # SELINUXTYPE= can take one of these three values:

    #      targeted - Targeted processes are protected,

    #      minimum - Modification of targeted policy. Only selected processes

    #               are protected.

    #      mls - Multi Level Security protection.

    SELINUXTYPE=targeted

    ```


    So I am running SELinux in "enforcing" mode on "targeted" processes. If you want
    to view the current status SELinux, you can run the `/usr/sbin/sestatus` command:


    ```bash

    herong$ /usr/sbin/sestatus -v


    SELinux status:               enabled

    SELinuxfs mount:              /sys/fs/selinux

    SELinux root directory:       /etc/selinux

    Loaded policy name:           targeted

    Current mode:                 enforcing

    Mode from file:              enforcing

    Policy MLS:                   enabled

    Policy deny_unknown:         allowed

    Memory protection:            (secure)

    Max kernel version:           3

    Process contexts:

    Current context:              unconfined_u:unconfined_r:unconfined_t:s0-s0:c0.c123

    Init context:                system_u:system_r:init_t:s0

    File contexts:

    Controlling terminal:          unconfined_u:object_r:user_pts_t:s0

    /etc/passwd                   system_u:object_r:passwd_file_t:s0

    /etc/shadow                   system_u:object_r:shadow_t:s0

    /bin/bash                     system_u:object_r:shell_exec_t:s0

    /bin/login                    system_u:object_r:login_exec_t:s0

    /bin/sh                      system_u:object_r:bin_t:s0 -> system_u:object_r:shell_exec_t:s0

    /sbin/agetty                  system_u:object_r:getty_exec_t:s0

    /sbin/init                    system_u:object_r:bin_t:s0 -> system_u:object_r:init_exec_t:s0

    /usr/sbin/sshd                system_u:object_r:sshd_exec_t:s0

    ```


    ## What Is SELinux User

    Provides a quick introduction on what is SELinux User, and a tutorial example
    on how to view the current SELinux User mapping, as well as change SELinux User
    mapping for a specific user. There are several basic concepts used by SELinux:
    SELinux User, SELinux Role, SELinux Domain, and SELinux Type. Together, they are
    used to define SELinux security policies in the form of:


    *   "SELinux Users" can play "SELinux Roles"

    *   "SELinux Roles" can go to "SELinux Domains"

    *   "SELinux Domains" have access to "SELinux Types"


    A SELinux User is an abstract concept that represents a group of real users on
    the Linux system as security subject in SELinux system. By default, SELinux has
    the following pre-defined SELinux users:


    *   `guest_u`: Intended for users with the lowest privilege. A `guest_u` user
    has no access to networking, no script execution privileges in `/home`, nor can
    make use of `sudo` or `su` commands to gain higher privileges.

    *   `root`: Intended for the root user with the highest privilege.

    *   `staff_u`: Intended for users that need to perform both non-administrative
    and administrative tasks. A `staff_u` user have access to GUI, to networking,
    and the use of `sudo` command.

    *   `sysadm_u`: Intended for users who perform only administrative tasks. A `sysadm_u`
    user can perform all tasks like a `staff_u` user, plus he/she can use `su` command.

    *   `system_u`: Intended for special users to run system services.

    *   `unconfined_u`: Intended for users with hardly any restrictions except for
    targeted services.

    *   `user_u`: Intended for regular users with no special privileges.

    *   `xguest_u`: Similar to `guest_u` user. A `xguest_u` user has the sample privilege
    as a `guest_u` user, plus he/she can access to GUI and to the network, but only
    via the Firefox browser.


    Here is what I did on my CentOS 8 computer to see how Linux users are mapped to
    SELinux users. And to change the mapping for "john" to ban him using the Internet.
    To see how Linux users are mapped to SELinux users, use the `semanage login -l`.
    By default, all users are mapped to the `unconfined_u` SELinux User on CentOS
    8 system. So everyone can use the Internet.


    ```bash

    herong$ sudo semanage login -l


    Login Name      SELinux User    MLS/MCS Range      Service

    __default__      unconfined_u    s0-s0:c0.c1023     *

    root            unconfined_u    s0-s0:c0.c1023     *

    ```

    '
