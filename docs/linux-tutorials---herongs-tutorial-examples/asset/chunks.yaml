    ## 通过删除现有分区安装 CentOS

    提供了一个教程示例，介绍了如何在联想电脑上通过删除现有硬盘分区来释放空间以安装 CentOS 系统。如果硬盘上没有足够的可用空间（未分区空间），CentOS
    安装程序将强制你选择要删除哪个现有分区，以为新的 CentOS 系统释放空间。以下是我在第二台联想电脑上的操作。


    1. 从 CentOS 可启动的 USB 盘启动电脑。

    2. 继续安装过程直到进入安装摘要界面。我看到系统部分的 "Installation Destination"安装目标被高亮并显示警告。

