    \ 54 Nov 13 23:09 calendar.ini\n-rw-r--r-- 1 root root 48 Nov 13 23:09 ctype.ini\n\
    -rw-r--r-- 1 root root 46 Nov 13 23:09 curl.ini\n...\n```\ncentos$ ls -l /usr/lib64/php/modules/\n\
    total 8744\n-rwxr-xr-x 1 root root 34104 Nov 13 23:09 bz2.so\n-rwxr-xr-x 1 root\
    \ root 55304 Nov 13 23:09 calendar.so\n-rwxr-xr-x 1 root root 18736 Nov 13 23:09\
    \ ctype.so\n-rwxr-xr-x 1 root root 113680 Nov 13 23:09 curl.so\n...\n```\n\n###\
    \ 在 CentOS 上安装和管理 PHP 模块\n\n提供了一个如何使用 `dnf/yum` 作为包管理器在 CentOS 8 系统上搜索并安装额外 PHP\
    \ 模块的教程示例。如果你正在使用 PHP 脚本开发 Web 应用程序，可能需要像本教程所示安装额外的 PHP 模块。\n\n#### 1. 如果看到 \"\
    Call to undefined function json_decode()\" 错误，安装 php-json 包\n\n```bash\nherong$\
    \ test-script.php\nCall to undefined function json_decode()\nherong$ sudo yum\
    \ search php | grep json\nphp-json.x86_64 : JavaScript 对象表示法（JSON）扩展\n...\nherong$\
    \ sudo dnf install php-json\nInstalled:\n php-json-7.2.11-2.module_el8.1.0\n```\n\
    ```\n\n#### 2. 如果看到 \"Call to undefined function mb_encoding()\" 错误，安装 php-mbstring\
    \ 包\n\n```bash\nherong$ test-script.php\nCall to undefined function mb_encoding()\n\
    herong$ sudo yum search php | grep mb\nphp-embedded.x86_64 : 用于嵌入的 PHP 库\nphp-mbstring.x86_64\
    \ : 需要多字节字符串的 PHP 模块\n...\nherong$ sudo dnf install php-mbstring\nInstalled:\n\
    \ php-mbstring-7.2.11-2.module_el8.1.0\n```\n```\n\n#### 3. 如果看到 \"Call to undefined\
    \ function mysqli_connect()\" 错误，安装 php-mysqlnd 包\n\n```bash\nherong$ test-script.php\n\
    Call to undefined function mysqli_connect()\nherong$ sudo yum search php | grep\
    \ mysql\nphp-mysqlnd.x86_64 : 用于 MySQL 数据库的 PHP 模块\n...\nherong$ sudo dnf install\
    \ php-mysqlnd\nInstalled:\n php-mysqlnd-7.2.11-2.module_el8.1.0\n php-pdo-7.2.11-2.module_el8.1.0\n\
    ```\n```\n如果你看到更多未定义函数的错误，可以继续使用 `yum` 命令搜索并安装 PHP 模块。\n\n### PHP \"include\"\
    \ 语句使用的文件\n\n提供了一个 PHP 引擎如何搜索 `include` 语句给出文件的教程示例。当你使用 `include` 语句执行存储在单独文件中脚本时，PHP\
    \ 引擎按照以下规则搜索并查找脚本文件。\n\n#### 1. 如果提供了绝对路径，PHP 引擎将仅在给定的绝对路径目录下搜索该文件。例如，以下代码将在 `/usr/share/php`\
    \ 目录中搜索 `include_extra.php`。\n\n```php\n<?php\n  include \"/usr/share/php/include_extra.php\"\
    ;\n?>\n```\n\n#### 2. 如果提供了相对路径，PHP 引擎将相对于当前工作目录搜索该文件，而当前工作目录可能与调用脚本所在的目录不同。例如，以下代码将在代码执行所在的目录中搜索\
    \ `include_extra.php`。\n\n```php\n<?php\n  include \"./include_extra.php\";\n\
    ?>\n```\n\n"
- fmt: "\n3. If no path is given together with the file name, the PHP engine will\
    \ search for the file in the following 3 locations sequentially:\n\n* Directories\
    \ specified in the `include_path`.\n* Directory where the calling script is located.\n\
    * The current working directory.\n\nFor example, the following code will search\
    \ for `include_extra.php` in multiple places.\n\n```php\n<?php\n  include \"include_extra.php\"\
    ;\n?>\n```\n\nSo the best way to use the `include` statement is to give the file\
    \ name only and make sure the included files are stored in one of the `include_path`\
    \ directory.\n\n1. Verify that `PHP FPM (FastCGI Process Manager), `php-fpm`,\
    \ is up and running. If not, install `php-fpm` package and start `php-fpm` service.\
    \ PHP FPM provides the interface between the Apache Web server and the PHP engine.\n\
    \n```bash\nherong$ systemctl status php-fpm\nphp-fpm.service - The PHP FastCGI\
    \ Process Manager\n    Loaded: loaded (/usr/lib/systemd/system/php-fpm.service;\
    \ disabled;\n    Active: active (running) since Thu 2020-03-26 23:00:41 EDT;\n\
    \    Main PID: 21507 (php-fpm)\n        ...: ...\n```\n\n2. Verify that Apache\
    \ Web server, `httpd`, is up and running. If not, install `httpd` package and\
    \ start `httpd` service.\n\n```bash\nherong$ systemctl status httpd\nhttpd.service\
    \ - The Apache HTTP Server\n    Loaded: loaded (/usr/lib/systemd/system/httpd.service;\
    \ disabled;\n    Drop-In: /usr/lib/systemd/system/httpd.service.d\n          \
    \   |-php-fpm.conf\n    Active: active (running) since Thu 2020-03-26 22:06:40\
    \ EDT;\n    Main PID: 19007 (httpd)\n        ...: ...\n```\n\n3. Publish a PHP\
    \ script in the HTML document directory on the Apache Web server.\n\n```bash\n\
    herong$ cd /var/www/html\nherong$ sudo mkdir test\nherong$ ls -l\ndrwxr-xr-x.\
    \ 2 root root  6 Mar 28 22:25 test\nherong$ sudo chown herong test\nherong$ ls\
    \ -l\ndrwxr-xr-x. 2 herong root  6 Mar 28 22:25 test\nherong$  cd /var/www/html/test\n\
    herong$ ls -l\n-rw-r--r--. 1 herong herong 73 Mar 28 22:28 test.php\nherong$ cat\
    \ test.php\n```\n\n```html\n<html>\n<body>\n<p>\n<?php\nprint(\"Hello world!\\\
    n\");\n?>\n</p>\n</body>\n</html>\n```\n\n4. Verify that the PHP script page is\
    \ working.\n\n```bash\nherong$ curl http://localhost/test/test.php\n<html>\n<body>\n\
    <p>\nHello world!\n</p>\n</body>\n</html>\n```\n\n## Dump PHP/Apache Environment\
    \ Information\n\nProvides a tutorial example on how to dump Apache/PHP environment\
    \ information on CentOS Linux systems. The execution environment of running PHP\
    \ scripts on the Apache Web server is different than running them from the command\
    \ line. You need to dump the Apache/PHP environment information as shown in this\
    \ tutorial.\n\n1. Publish the following script file, `test_phpinfo.php`, to the\
    \ Apache Web server directory, `/var/www/html/test`:\n\n```php\n<?php phpinfo();\
    \ ?>\n```\n\n2. View the script file as a Web page, `http://localhost/test/test_phpinfo.php`\
    \ in a Web browser. You should see the Apache/PHP environment information displayed\
    \ in a nice format.\n\n```text\nHP Version 7.2.11\nSystem  =>  Linux 4.18.0-147.el8.x86_64\
    \ #1 SMP Wed Dec 4 21:51:45 UTC 2019\nBuild Date  =>  10/09/18 03:09 PM\nServer\
    \ API  =>  FPM/FastCGI\nVirtual Directory Support  =>  disabled\nConfiguration\
    \ File (php.ini) Path  =>  /etc\nLoaded Configuration File  =>  /etc/php.ini\n\
    Scan this dir for additional .ini files  =>  /etc/php.d\nAdditional .ini files\
    \ parsed  =>  /etc/php.d/20-bz2.ini, ...\n..\nDirective  =>  Local Value  active\
    \    Master Value\ncgi-fcgi\nphp-fpm  => active\ncgi.discard_path  =>  0  => \
    \ 0\ncgi.fix_pathinfo  =>  1  =>  1\ncgi.force_redirect  =>  1  =>  1\ncgi.nph\
    \  =>  0  =>  0\ncgi.redirect_status_env  =>  no value  =>  no value\ncgi.rfc2616_headers\
    \  =>  0  =>  0\nfastcgi.error_header  =>  no value  =>  no value\nfastcgi.logging\
    \  =>  1  =>  1\nCore\nallow_url_fopen  =>  On  =>  On\nallow_url_include  =>\
    \  Off  =>  Off\n...\nerror_log  =>  /var/log/php-fpm/www-error.log  =>  ...\n\
    extension_dir  =>  /usr/lib64/php/modules  =>  /usr/lib64/php/modules\n...\n```\n\
    \nNow I know where to go find the Apache/PHP error log file:\n\n```bash\ncentos$\
    \ sudo ls -l /var/log/php-fpm\n```\n"
