  trans: "\n\n: 允许用户构建并安装包，而无需大量了解构建过程的细节。关于程序如何构建的细节由程序中的 `makefile` 提供给 `make`。\n\
    \n### 2. 验证 \"make\" 版本\n```bash\nherong$ make --version\nGNU Make 4.2.1\nBuilt\
    \ for x86_64-redhat-linux-gnu\nCopyright (C) 1988-2016 Free Software Foundation,\
    \ Inc.\n```\n\n### 3. 创建包含一个任务的 \"Makefile\"\n```bash\nherong$ cat Makefile\n\
    compile: hello.cpp\n  g++ -o hello hello.cpp\n```\n\n### 4. 运行 \"Makefile\" 中指定的任务\n\
    ```bash\nherong$ make compile\ng++ -o hello hello.cpp\n```\n\n### 5. 验证结果\n```bash\n\
    herong$ ./hello\nHello world! From C++.\n```\n\n好了。现在我可以使用 `make` 工具在我的 CentOS\
    \ 8 计算机上自动化任何任务了。\n\n---\n\n# Conda - 环境与包管理器\n\nConda 提供了关于 Conda 环境的介绍和教程示例。主题包括从\
    \ Miniconda 安装包安装 Conda；启动/结束 Conda `base` 环境；安装 Conda 包。\n\n## 核心要点\n- `Conda`\
    \ 是一个强大的开源环境和包管理器，允许你为多个版本的软件软件包及其依赖项安装多个环境，并在它们之间轻松切换。\n- `Miniconda` 是 `Conda`\
    \ 最小的发行包。\n- `Conda` 发行包包含一个 `base` Conda 环境。\n- `Conda` 环境是一个针对特定版本 Python 脚本引擎及其库的独立\
    \ shell 环境。\n- `Conda` 命令允许你管理 Conda 环境并创建新环境。\n\n## 什么是 Conda\nConda 提供了关于 Conda\
    \ 的快速介绍，它是一个强大的开源环境和包管理器，允许你为多个版本的软件软件包及其依赖项安装多个环境，并在它们之间轻松切换。\n\n什么是 Conda？`Conda`\
    \ 是一个强大的开源环境和包管理器，允许你为多个版本的软件软件包及其依赖项安装多个环境，并在它们之间轻松切换。`Conda` 最初开发是为了是为了解决复杂的\
    \ Python 包管理挑战。\n\n`Conda` 包含在两个发行包中：\n- `Miniconda`:包含 `Conda` 及其依赖项（包括 Python）。\n\
    - `Anaconda`:包含 `Conda` 和 7,500 个流行的开源软件包，包括 Python、R、Jupyter/IPython、ggplot2、NumPy、SciPy、Pandas\
    \ 等。\n\n对于大多数用户来说，下载并安装 `Miniconda` 就足够了。如果你任何额外的包，可以从 Conda 包仓库单独下载并安装。更多信息请访问\
    \ Conda 网站 `https://www.anaconda.com`。\n\n## 安装 Miniconda 3\n提供关于如何安装 Miniconda\
    \ 3 的教程示例。安装完成后，你可以像 Linux shell 一样启动和结束 Conda `base` 环境。要开始使用 Conda，你可以按照此教程安装\
    \ `Miniconda`。\n\n### 1. 下载 Miniconda 安装脚本\n```bash\nherong$ export miniconda=Miniconda3-latest-Linux-x86_64.sh\n\
    herong$ curl https://repo.anaconda.com/miniconda/$miniconda > $miniconda\nherong$\
    \ ls -l\n  93052469 Aug 24 02:06 Miniconda3-latest-Linux-x86_64.sh\n```\n\n###\
    \ 2. 运行安装脚本\n```bash\nherong$ bash Miniconda3-latest-Linux-x86_64.sh\n...\n为了继续安装过程，请审阅许可协议。\n\
    请按 ENTER 继续\n>>> ENTER\n你接受许可条款吗？[yes|no]\n[no] >>> yes\nMiniconda3 现在将安装到此位置：\n\
    `/home/herong/miniconda3`\n- 按 ENTER 确认位置\n- 按 `CTRL-C` 取消安装\n- 或在下方指定不同的位置\n\
    [/home/herong/miniconda3] >>> ENTER\n```\n\n`PREFIX=/home/herong/anaconda3`\n\n\
    将安装以下新包：\n- `_libgcc_mutex` pkgs/main/linux-64::_libgcc_mutex-0.1-main`\n- `ca-certificates`\
    \ pkgs/main/linux-64::ca-certificates-2020.1.1-0`\n- `certifi` pkgs/main/linux-64::certifi-2020.4.5.1-py38_0`\n\
    - `cffi` pkgs/main/linux-64::cffi-1.14.0-py38he30daa8_1`\n- `chardet` pkgs/main/linux-64::chardet-3.0.4-py38_1003`\n\
    - `conda` pkgs/main/linux-64::conda-4.8.3-py38_0`\n- `conda-package-handling`\
    \ pkgs/main/linux-64::conda-package-handling-1.6.1-py38h7b64c_0`\n- `cryptography`\
    \ pkgs/main/linux-64::cryptography-2.9.2-py38hba5d50_0`\n- `idna` pkgs/main/noarch::idna-2.9-py_1`\n\
    - `ld_impl_linux-64` pkgs/main/linux-64::ld_impl_linux-64-2.33.1-h53a64e_7`\n\
    - `libedit` pkgs/main/linux-64::libedit-3.1.201829-hc05e9b_0`\n- `libffi` pkgs/main/linux-64::libffi-3.3-he6710b_1`\n\
    - `libgcc-ng` pkgs/main/linux-64::libgcc-ng-9.1.0-hdf63c60_0`\n- `libstdcxx-ng`\
    \ pkgs/main/linux-64::libstdcxx-ng-9.1.0-hdf63c60_0`\n- `ncurses` pkgs/main/linux-64::ncurses-6.2-he6710b_1`\n\
    - `openssl` pkgs/main/linux-64::openssl-1.1.1-h7b644c_0`\n- `pip` pkgs/main/linux-64::pip-20.0.2-py38_3`\n\
    - `pycosat` pkgs/main/linux-64::pycosat-0.6.3-py38h7b64c_1`\n- `pyparser` pkgs/main/noarch::pyparser-2.20-py_0`\n\
    - `pyopenssl` pkgs/main/linux-64::pyopenssl-19.1.0-py38_0`\n- `pysocks` pkgs/main/linux-64::pysocks-1.7.1-py38_0`\n\
    - `python` pkgs/main/linux-64::python-3.8.3-hcff3b4d_0`\n- `readline` pkgs/main/linux-64::readline-8.0-h7b644c_0`\n\
    - `requests` pkgs/main/linux-64::requests-2.23.0-py38_0`\n- `ruamel_yaml` pkgs/main/linux-64::ruamel_yaml-0.15.87-py38h7b644c_0`\n\
    - `setuptools` pkgs/main/linux-64::setuptools-46.4.0-py38_0`\n- `six` pkgs/main/linux-64::six-1.14.0-py38_0`\n\
