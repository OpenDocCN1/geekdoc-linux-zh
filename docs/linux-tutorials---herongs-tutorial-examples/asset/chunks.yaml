    ```\n\nOk. I can use the `make` tool to automate any tasks on my CentOS 8 computer\
    \ now.\n\n---\n\n# Conda - Environment and Package Manager\n\nConda provides introductions\
    \ and tutorial examples about Conda environments. Topics include installing Conda\
    \ from the Miniconda package; starting/ending Conda `base` environment; installing\
    \ Conda packages.\n\n## Takeaways\n- `Conda` is a powerful open source environment\
    \ and package manager that allows you to install multiple environments for multiple\
    \ versions of software packages and their dependencies and switching easily between\
    \ them.\n- `Miniconda` is the smallest distribution package for `Conda`.\n- `Conda`\
    \ distribution package comes with a `base` Conda environment.\n- A `Conda` environment\
    \ is an independent shell environment for a specific version of Python script\
    \ engine and its libraries.\n- `Conda` commands allows you to manage Conda environments\
    \ and create new ones.\n\n## What Is Conda\nConda provides a quick introduction\
    \ on Conda, which is a powerful open source environment and packager manager that\
    \ allows you to install multiple environments for multiple versions of software\
    \ packages and their dependencies and switching easily between them.\n\nWhat Is\
    \ Conda? `Conda` is a powerful open source environment and package manager that\
    \ allows you to install multiple environments for multiple versions of software\
    \ packages and their dependencies and switching easily between them. `Conda` was\
    \ originally developed to solve difficult Python package management challenges.\n\
    \n`Conda` is included in two distribution packages:\n- `Miniconda`: Includes `Conda`\
    \ and its dependencies including Python.\n- `Anaconda`: Includes `Conda` and 7,500\
    \ popular open-source packages, including Python, R, Jupyter/IPython, ggplot2,\
    \ NumPy, SciPy, Pandas, etc.\n\nFor most users, download and install `Miniconda`\
    \ is good enough. If you need any additional packages, you can download and install\
    \ them individually from the Conda package repository. For more information, visit\
    \ Conda Website at `https://www.anaconda.com`.\n\n## Install Miniconda 3\nProvides\
    \ a tutorial example on how to install Miniconda 3. Once installed, you can start\
    \ and end the Conda `base` environment similar to a Linux shell. To get started\
    \ with Conda, you can follow this tutorial to install `Miniconda`.\n\n### 1. Download\
    \ Miniconda installation shell script\n```bash\nherong$ export miniconda=Miniconda3-latest-Linux-x86_64.sh\n\
    herong$ curl https://repo.anaconda.com/miniconda/$miniconda > $miniconda\nherong$\
    \ ls -l\n  93052469 Aug 24 02:06 Miniconda3-latest-Linux-x86_64.sh\n```\n\n###\
    \ 2. Run the installation shell script\n```bash\nherong$ bash Miniconda3-latest-Linux-x86_64.sh\n\
