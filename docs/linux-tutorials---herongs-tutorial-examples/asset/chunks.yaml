    \    goto nat_POST_public\n  }\n  chain nat_PRE_public {\n  ...\n  }\n```\n\n\
    As you can see, the syntax of firewall security rules used by `nft` is more complicated\
    \ than the `firewall-cmd`.\n\n### iptables Command on CentOS\n\nProvides a tutorial\
    \ example on how to use `iptables` daemon CLI to manage network firewall on older\
    \ CentOS systems. The best tool to manage the network firewall on CentOS systems\
    \ is the `firewall-cmd` frontend tool. But if you want to use the backend tool,\
    \ you can follow this tutorial to use the `iptables` command.\n\n#### 1. Make\
    \ sure that I have the latest version of `iptables` installed with the `dnf info`\
    \ command:\n\n```bash\nsudo dnf info iptables\n```\n\n```\nInstalled Packages\n\
    Name         : iptables\nVersion      : 1.8.2\nRelease      : 16.el8\nArchitecture\
    \ : x86_64\nSize         : 2.3 M\nSource       : iptables-1.8.2-16.el8.src.rpm\n\
    Repository   : @System\nFrom repo    : anaconda\nSummary      : Tools for managing\
    \ Linux kernel packet filtering capabilities\nURL          : http://www.netfilter.org/\n\
    License      : GPLv2 and Artistic 2.0 and ISC\nDescription  : The iptables utility\
    \ controls the network packet filtering code in the Linux kernel. If you need\
    \ to set up firewalls and/or IP masquerading, you should either install nftables\
    \ or this package.\n             Note: This package contains the nftables-based\
    \ variants of iptables and ip6tables, which are drop-in replacements of the legacy\
    \ tools.\n```\n\n#### 2. Check all chains of security rules with the `iptables`\
    \ command:\n\n```bash\nsudo iptables --list\n```\n\n```text\nChain INPUT (policy\
    \ ACCEPT)\ntarget  prot opt source                   destination\nACCEPT  udp\
    \  --where                   where      pt:domain\nACCEPT  tcp  --where      \
    \             where      pt:domain\nACCEPT  udp  --where                   where\
    \      pt:boot\nACCEPT  tcp  --where                   where      pt:boot\nChain\
    \ FORWARD (policy ACCEPT)\ntarget  prot opt source                   destination\n\
    ACCEPT  all  --where                   where\nChain OUTPUT (policy ACCEPT)\ntarget\
    \  prot opt source                   destination\nACCEPT  udp  --where       \
    \            where      pt:boot\n```\n\n#### 3. Append new rules to make my computer\
    \ more secure. \n\nRemember that `iptables` rules are compared sequentially. If\
    \ a match is found, it will take the action.\n\n```bash\n# allow to visit google.com\n\
    sudo iptables -A OUTPUT -p tcp -d google.com -j ACCEPT\n# stop going out to any\
    \ HTTP Websites\nsudo iptables -A OUTPUT -p tcp --dport 80 -j DROP\n# stop going\
    \ out to any HTTPS Websites\nsudo iptables -A OUTPUT -p tcp --dport 443 -j DROP\n\
    # allow me to come in with SSH connection from my laptop\nsudo iptables -A INPUT\
    \ -p tcp -s 192.168.1.11 --dport 22 -j ACCEPT\n# allow local computers access\
    \ the Web server\nsudo iptables -A INPUT -p tcp --src-range 192.168.1.2-192.168.1.100\
    \ --dport 80 -j ACCEPT\n# stop everyone to come in with SSH connection\nsudo iptables\
    \ -A INPUT -p tcp -s 0.0.0.0/0 --dport 22 -j DROP\n# stop everyone to come in\
    \ on any ports\nsudo iptables -A INPUT -j DROP\n```\n\n#### 4. Save changes made\
    \ in `iptables` permanently:\n\n```bash\nsudo /sbin/iptables-save\n```\n\nNote\
    \ that `iptables` daemon is running on older CentOS systems instead of `firewalld`.\
    \ You can check its status with the `service` command:\n\n```bash\nsudo service\
    \ iptables status\n```\n\n```text\nTable: filter\nChain INPUT (policy ACCEPT)\n\
    num  target  prot opt source                   destination\n...\nChain FORWARD\
    \ (policy ACCEPT)\nnum  target  prot opt source                   destination\n\
    ...\nChain OUTPUT (policy ACCEPT)\nnum  target  prot opt source              \
    \     destination\n...\n```\n\n### nmap - Network Mapper on CentOS\n\nProvides\
    \ a tutorial example on how to install and use `nmap` (Network Mapper), as a network\
    \ exploration tool and security scanner on CentOS systems. Another useful tool\
    \ is called, `nmap (Network Mapper)`, which is a network exploration tool and\
    \ security scanner. Here is the full description of `nmap`:\n\nNmap (“Network\
    \ Mapper”) is an open source tool for network exploration and security auditing.\
    \ It was designed to rapidly scan large networks, although it works fine against\
    \ single hosts. Nmap uses raw IP packets in novel ways to determine what hosts\
    \ are available on the network, what services (application name and version) those\
    \ hosts are offering, what operating systems (and OS versions) they are running,\
    \ what type of packet filters/firewalls are in use, and dozens of other characteristics.\
    \ While Nmap is commonly used for security audits, many systems and network administrators\
    \ find it useful for routine tasks as network inventory, managing service schedules,\
    \ and monitoring host service uptime. The output from Nmap is a list of scanned\
    \ targets, with supplemental information on each depending on the options used.\
    \ Key among that information is the “interesting ports table”. That table lists\
    \ the port number and protocol, service name, and state. The state is either open,\
    \ filtered, or closed. Open means that an application on the target machine is\
    \ listening for connections/packets on that port. Filtered means that a firewall,\
    \ filter, or other network obstacle is blocking the port so that Nmap cannot determine\
    \ whether it is open or closed. Closed ports have no application on them, though\
    \ they could open up any time. Ports are classified as unfiltered when they are\
    \ responsive to Nmap's probes, but Nmap cannot determine whether they are open\
    \ or closed. Nmap reports the state open|filtered and closed|filtered when it\
    \ cannot determine which of the two states describe a port. The port table may\
    \ also include software version details when version detection has been requested.\
    \ When an IP scan is requested (`-sO`), Nmap provides information on supported\
    \ protocols rather than listening ports.In addition to the interesting ports table,\
    \ Nmap can provide further information on targets, including reverse DNS names,\
    \ operating system guesses, device types, and MAC addresses. Here is what I did\
    \ to install and use it on my CentOS 8 computer:\n\n#### 1. Check the availability\
    \ of `nmap`:\n\n```bash\ndnf info nmap\n```\n\n```\nAvailable Packages\nName \
    \        : nmap\nEpoch         : 2\nVersion      : 7.70\nRelease      : 5.el8\n\
    Architecture : x86_64\nSize         : 5.8 M\nSource       : nmap-7.70-5.el8.src.rpm\n\
    Repository   : AppStream\nSummary      : Network exploration tool and security\
    \ scanner\nURL          : http://nmap.org/\nLicense      : Nmap\n```\n"
