- fmt: "\n* Version 1.20, 2020. Added SELinux tutorials.\n* Version 1.00, 2019. Completed\
    \ first edition.\n\nWeb version: [http://www.herongyang.com/Linux](http://www.herongyang.com/Linux)\
    \ - Provides free sample chapters, latest updates and readers' comments. The Web\
    \ version of this book has been viewed a total of:\n* 0 times as of December 2019.\n\
    \nPDF/EPUB version: [http://www.herongyang.com/Linux/PDF-Full-Version.html](http://www.herongyang.com/Linux/PDF-Full-Version.html)\
    \ - Provides information on how to obtain the full version of this book in PDF,\
    \ EPUB, or other format.\n\n# Introduction to Linux Systems\nProvides introductions\
    \ and tutorial on Linux operating systems. Topics include `uname` to display operating\
    \ system information.\n\n### Takeaways\n* `uname` command can be used to display\
    \ operating system information.\n\n## uname - Display System Information\nProvides\
    \ a tutorial example on how to display operating system information using the\
    \ `uname` command on Linux systems. The first thing you should do on a new Linux\
    \ computer is to gather its system information as shown in this tutorial.\n\n\
    1. The most commonly used command to display Linux operating system information\
    \ is the `uname` command.\n\n(on my CentOS 8 computer)\n```bash\ncentos8$ uname\
    \ -mprsv\nLinux 4.18.0-147.el8.x86_64\n    #1 SMP Wed Dec 4 21:51:45 UTC 2019\
    \ x86_64 x86_64\n```\n\n(on my CentOS 6 computer)\n```bash\ncentos6$ uname -mprsv\n\
    Linux 2.6.32-696.20.1.el6.i686 #1 SMP Fri Jan 26 18:13:32 UTC 2018\n    i686 i686\
    \ i386 GNU/Linux i386\n```\n\n(on my macOS 10 computer)\n```bash\nmacos$ uname\
    \ -mnprsv\nDarwin 16.7.0 Darwin Kernel Version 16.7.0:\n    Sun Jun  2 20:26:31\
    \ PDT 2019; root:xnu-3789.73.50~1/RELEASE_X86_64\n    x86_64 i386\n```\n\n2. On\
    \ most Linux systems, the operating system information is accessible via a special\
    \ file called `/proc/version`. You can use the `cat` command to display it:\n\n\
    (on my CentOS 8 computer)\n```bash\ncentos8$ cat /proc/version\nLinux version\
    \ 4.18.0-147.el8.x86_64\n    (mockbuild@kbuilder.bsys.centos.org)\n    (gcc version\
    \ 8.3.1 20190507 (Red Hat 8.3.1-4) (GCC))\n    #1 SMP Wed Dec 4 21:51:45 UTC 2019\n\
    ```\n\n(on my CentOS 6 computer)\n```bash\ncentos6$ cat /proc/version\nLinux version\
    \ 2.6.32-69.20.1.el6.i686\n    (mockbuild@x86_64_01.bsys.centos.org)\n    (gcc\
    \ version 4.4.7 20120313 (Red Hat 4.4.7-18) (GCC))\n    #1 SMP Fri Jan 26 18:13:32\
    \ UTC 2018\n```\n\n3. The CPU architecture is a key parameter when installing\
    \ Linux systems and applications. You can use the `arch` command to display it:\n\
    \n(on my CentOS 8 computer)\n```bash\ncentos8$ arch\nx86_64\n```\n\n(on my CentOS\
    \ 6 computer)\n```bash\ncentos6$ arch\ni686\n```\n\n(on my macOS 10 computer)\n\
    ```bash\nmacOS$ arch\ni386\n```\n\n## free - Display Free and Used Memory\nProvides\
    \ a tutorial example on how to display free and used memory information using\
    \ the `free` command on Linux systems. Another important information about your\
    \ Linux system is the memory. You can use the `free` command to display memory\
    \ statistics including free and used memory sizes. Here are some examples of `free`\
    \ command output on my CentOS computer.\n\n1. Display memory information using\
    \ `free` with default options. The memory counts are displayed in kibibytes (1,024\
    \ bytes). Note that a kibibyte (1,024 bytes) is slightly different than a kilobyte\
    \ (1,000 bytes).\n```bash\nherong$ free\n             total      used      free\
    \  shared  buff/cache   available\nMem:       7789220   2047412   677256   297448\
    \   5064552     5145248\nSwap:       8085500           0   8085500\n```\n\n2.\
    \ To control the unit, you can use `free -b|k|m|g` options.\n```bash\nherong$\
    \ free -m\n             total      used      free  shared  buff/cache   available\n\
    Mem:       7789220   2047412   677256   297448   5064552     5145248\nSwap:  \
    \     8085500           0   8085500\n```\n\n3. Or you can use `free -h` to display\
    \ counts in human readable.\n```bash\nherong$ free -h\n             total    \
    \   used        free  shared  buff/cache   available\nMem:       7.4Gi       2.0Gi\
    \       661Mi  290Mi       4.8Gi       4.9Gi\nSwap:       7.7Gi              \
    \   0       7.7Gi\n```\n\nThe output columns are defined as:\n* `total`: Total\
    \ memory (`MemTotal` and `SwapTotal` in `/proc/meminfo`)\n* `used`: Used memory\
    \ (calculated as `total - free - buffers`)\n* `free`: Unused memory\n* `shared`:\
    \ Memory used (mostly by tmpfs)\n* `buffers`: Memory used by kernel (`Buffers`\
    \ in `/proc/meminfo`)\n* `buff/cache`: Sum of buffers and cache\n* `available`:\
    \ Estimation of how much memory is available for starting applications, without\
    \ swapping. Unlike the data provided by the cache, this field takes into account\
    \ that all reclaimable memory will be reclaimed due to items in use\n\n## Process\
    \ Management\nProvides introductions and tutorial on managing processes on Linux.\
    \ Topics include `ps` to display processes; `jobs` and other commands to manage\
    \ background jobs; `tmux` tool to manage multiple shells and keep them in background.\n\
    \n### Takeaways\n* `ps` command can be used to display processes on the system.\n\
    * `jobs` command can be used to display your background jobs that are running\
    \ with inputs detached from keyboards.\n* `ctrl-z` can be used to stop a foreground\
    \ job and send it to the background.\n* `bg` command can be used to resume a background\
    \ job.\n* `fg` command can be used to bring a background job to the foreground.\n\
    * `tmux` tool can be used to manage multiple shells in a terminal window.\n* `tmux`\
    \ tool automatically keeps its shells running when the terminal is disconnected.\n\
    \n### ps - Current Processes\nProvides a tutorial example on how to use `ps` command\
    \ to display current process on the system.\n\nWhat Is Process? A process is a\
    \ unit of work that is currently running in the operating system. A process has\
    \ the following properties:\n* `PID`: A number that identifies the process.\n\
    * `UID`: The user ID who owns the process.\n* `Command`: The command that initiated\
    \ the process.\n* `Time`: The elapse time since the starting moment of the process.\n\
    * `Priority`: A number that indicates the execution priority of the process comparing\
    \ to other processes.\n* `TTY` (or Teletype): A device attached to the process\
    \ to handle input and output.\n\nYou can use the `ps` command to display current\
    \ processes and their properties. Here are some examples:\n\n1. Display processes\
    \ associated with the current terminal session using the `ps` command with default\
    \ options.\n```bash\nherong$ ps\n  PID TTY      TIME CMD\n  1171 pts/1  00:00:00\
    \ sleep\n  1172 pts/1  00:00:00 ps\n31723 pts/1  00:00:00 bash\n```\n\n2. Display\
    \ processes in long format using the `ps -l` command.\n```bash\nherong$ ps -l\n\
    F S    UID  PID  PPID  C PRI  NI ADDR SZ WCHAN  TTY      TIME CMD\n0 S  1000 \
    \ 1195 31723  0  80   0 -  1820 hrtime pts/1   00:00:00 sleep\n0 R  1000  1213\
    \ 31723  0  80   0 - 11191 -     pts/1   00:00:00 ps\n0 S  1000 31723 31720  0\
    \  80   0 -  6271 -     pts/1   00:00:00 bash\n```\n\n3. Display processes owned\
    \ by myself or another user using the `ps -u` command.\n```bash\nherong$ ps -u\n\
    USER       PID %CPU %MEM    VSZ  RSS TTY      STAT START   TIME COMMAND\nherong\
    \     878  0.0  0.0   9800  2624 pts/0     S+   04:37  0:00 less\nherong    1344\
    \  0.0  0.0  57184  3792 pts/1     R+   05:17  0:00 ps -u\n```\n"
