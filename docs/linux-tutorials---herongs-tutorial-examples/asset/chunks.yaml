    ## Install CentOS from Bootable USB

    Provides a tutorial example on how to install CentOS operating system from a CentOS
    bootable USB drive on a Lenovo computer. After creating the CentOS bootable USB
    drive, you can follow this tutorial to try it on Lenovo computer.


    1. Power off the Lenovo computer and remove all USB drives.

    2. Insert the "CentOS Bootable" USB drive to Lenovo computer and turn the power
    back on.

    3. Wait for the CentOS installation screen after the computer finishing booting
    from the USB drive. If it is still booting from the internal hard disk, you need
    to change the BIOS book sequence to make sure USB drive is listed before internal
    hard disk. BIOS setting is accessible by pressing `F10` at the beginning of the
    boot process.

    4. Select "Install CentOS Linux" from the installation screen. I see the language
    selection screen.

    5. Select "English" from the installation screen and click "Continue". I see the
    installation summary screen.

    6. Click "Begin Installation", if you want to take the default configuration and
    there is enough free space on the hard disk. I see the root user setting screen.

    7. Enter a new password for the root user, and create a new user "herong" with
    administrator privilege.

    8. Take out the USB drive and reboot the computer. I see CentOS 8 running on my
    computer!. Cool. Installing CentOS 8 is so easy!!


    ## Install CentOS by Deleting Existing Partition

    Provides a tutorial example on how to delete existing hard disk partition to free
    up space to install CentOS system on Lenovo computers. If you don''t have enough
    free space (un-partitioned space) on the hard disk, CentOS installation program
    will force you to select which existing partition to delete to free up space for
    the new CentOS system. Here is what I did on my second Lenovo computer.


    1. Boot the computer from the CentOS bootable USB drive.

    2. Continue the installation process until the installation summary screen. I
    see that the "Installation Destination" in the system section is highlighted with
    a warning.

    3. Click on "Installation Destination" link. I see the "Installation Destination"
    configuration page with two storage devices listed: the internal hard disk and
    the bootable USB. The hard disk is fully partitioned with only `2.55 MB` free
    space left.

    4. Select the internal hard disk as the installation destination. And check the
    "I would like to make additional space available" checkbox.

    5. Click "Done" button. I see a warning message saying that there is not space
    to install CentOS. But I can use the built-in space reclaim tool to shrink or
    delete existing partitions.

    6. Click "Reclaim Space". I see 3 partitions on my hard disk listed.

    7. Select the third partition, which has junk data on it. And click "Delete" to
    free up enough space for the CentOS system.

    8. Click "Reclaim Space" again to go back to the installation summary screen.

    9. Click "Begin Installation" to finish the installation process.


    ## SELinux - Security-Enhanced Linux

    Provides introductions and tutorial on SELinux (Security-Enhanced Linux). Topics
    include introduction of SELinux basic concepts; User, Role, Domain, Type, Class,
    and Boolean; Type Enforcement policy rule syntax and database; making changes
    to SELiunx policy rules; using SELinux related tools.


    - What Is SELinux (Security-Enhanced Linux)

    - SELinux Configuration and Status on CentOS

    - What Is SELinux User

    - What Is SELinux Role

    - What Is SELinux Type

    - What Is SELinux Domain

    - SELinux Policy Rule

    - What Is SELinux Boolean

    - SELinux Related Tools

    - SELinux Error Messages

    - SELinux Related Terminologies


    ### Takeaways

    - **SELinux**: `SELinux` is a security architecture for Linux® systems that allows
    administrators to have more control over who can access the system.

    - **SELinux User**: A `SELinux User` is an abstract concept that represents a
    group of real users on the Linux system as security subject in SELinux system.

    - **SELinux Role**: A `SELinux Role` is an abstract concept that represents a
    set of permissions grouped together for a specific functional role.

    - **SELinux Type**: A `SELinux Type` is an abstract concept that represents a
    set of files/directories grouped together, so that security policy can be applied
    at the group level instead of individually at files/directories level.

    - **SELinux Domain**: A `SELinux Domain` is an abstract concept that represents
    a set of running processes grouped together, so that security policy can be applied
    at the group level instead of individually at process level.

    - **Type Enforcement**: A `Type Enforcement` policy rule is defined in a form
    of `allow "source" on "target" of "class" with "permissions"`.

    - **SELinux Boolean**: A `SELinux Boolean` is a Boolean flag that can be added
    to one or more SELinux policy rules to turn on or turn off those rules.

    - **semanage**: The `semanage` command is used to configure certain elements of
    SELinux policy without requiring modification to or recompilation from policy
    source.

    - **seinfo**: The `seinfo` command is used to print out SELinux policy information.

    - **sesearch**: `sesearch` is an SELinux policy rule search tool.

    - **Logs**: SELinux error messages are logged in the `/var/log/messages` file.

