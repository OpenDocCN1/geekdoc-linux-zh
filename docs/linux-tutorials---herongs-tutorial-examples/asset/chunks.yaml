    [Linux Tutorials - Herong''s Tutorial Examples](#text00002.html_a2N5)∟ [Introduction
    to Linux Systems](#text00004.html_a2N7)∟ "free" - Display Free and Used MemoryProvides
    a tutorial example on how to display free and used memory information using the
    ''free'' command on Linux systems.Another important information about your Linux
    system is the memory. You can use the "free" command to display memory statistics
    including free and used memory sizes. Here are some examples of "free" command
    output on my CentOS computer.1\. Display memory information using "free" with
    default options. The memory counts are displayed in kibibytes (1,024 bytes). Note
    that a kibibyte (1,024 bytes) is slightly different than a kilobyte (1,000 bytes).herong$
    free


               total     used     free   shared  buff/cache   available


    Mem:     7789220  2047412   677256   297448     5064552     5145248


    Swap:    8085500        0  8085500


    2\. To control the unit, you can use "free -b|k|m|g" options.herong$ free -m


               total     used     free   shared  buff/cache   available


    Mem:        7606     1999      661      290        4945        5024


    Swap:       7895        0     7895


    3\. Or you can use "free -h" to display counts in human readable formats.  


    herong$ free -h


               total     used     free   shared  buff/cache   available


    Mem:       7.4Gi    2.0Gi    661Mi    290Mi       4.8Gi       4.9Gi


    Swap:      7.7Gi       0B    7.7Gi


    The output columns are defined as:


    *   total - Total installed memory (MemTotal and SwapTotal in /proc/meminfo)


    *   used - Used memory (calculated as total - free - buffers - cache)


    *   free - Unused memory


    *   shared - Memory used (mostly) by tmpfs


    *   buffers - Memory used by kernel buffers (Buffers in /proc/meminfo)


    *   cache Memory used by the page cache and slabs


    *   buff/cache - Sum of buffers and cache


    *   available - Estimation of how much memory is available for starting new applications,
    without swapping. Unlike the data provided by the cache or free fields, this field
    takes into account page cache and also that not all reclaimable memory slabs will
    be reclaimed due to items being in use


    [Linux Tutorials - Herong''s Tutorial Examples](#text00002.html_a2N5)∟ Process
    ManagementProvides introductions and tutorial on managing processes on Linux systems.
    Topics include ''ps'' to display processes; ''jobs'' and other commands to manage
    background jobs; ''tmux'' tool to manage multiple shells and keep them in background.["ps"
    - Display Current Processes](#text00008.html_a2NB)["jobs" - Manage Background
    Jobs](#text00009.html_a2NC)["tmux" - Terminal Multiplexer](#text00010.html_a2ND)Takeaways:


    *   "ps” command can be used to display processes running on the system.


    *   "jobs" command can be used to display your background jobs that are running
    with inputs detached from keyboards.


    *   "ctrl-z" can be used to stop a foreground job and send it to the background.


    *   "bg" command can be used to resume a background job.


    *   "fg" command can be used to bring a background job to the foreground.


    *   "tmux" tool can be used to manage multiple shells in a single terminal window.


    *   "tmux" tool automatically keeps its shells running when the terminal is disconnected.


    [Linux Tutorials - Herong''s Tutorial Examples](#text00002.html_a2N5)∟ [Process
    Management](#text00007.html_a2NA)∟ "ps" - Display Current ProcessesProvides a
    tutorial example on how to use ''ps'' command to display current process on the
    system.What Is Process? - A process is a unit of work that is currently running
    in the operating system. A process has the following basic properties:


    *   PID - A number that identifies the process.


    *   UID - The user ID who owns the process.


    *   Command - The command that initiated the process.


    *   Time - The elapse time since the starting moment of the process.


    *   Priority - A number that indicates the execution priority of the process comparing
    to other processes.


    *   TTY (or Teletype) - A termainl device attached to the process to handle input
    and output.


    You can use the "ps" command to display current processes and their properties.
    Here are some examples:1\. Display processes associated with the current terminal
    session using the "ps" command with default options.herong$ ps


      PID TTY          TIME CMD


     1171 pts/1    00:00:00 sleep


     1172 pts/1    00:00:00 ps


    31723 pts/1    00:00:00 bash


    2\. Display processes in long format using the "ps -l" command.herong$ ps -l


    F S   UID   PID  PPID  C PRI  NI ADDR SZ WCHAN  TTY          TIME CMD


    0 S  1000  1195 31723  0  80   0 -  1820 hrtime pts/1    00:00:00 sleep


    0 R  1000  1213 31723  0  80   0 - 11191 -      pts/1    00:00:00 ps


    0 S  1000 31723 31720  0  80   0 -  6271 -      pts/1    00:00:00 bash


    3\. Display processes owned by myself or another user using the "ps -u" command.herong$
    ps -u


    USER       PID %CPU %MEM    VSZ   RSS TTY      STAT START   TIME COMMAND


    herong     878  0.0  0.0   9800  2624 pts/0    S+   04:37   0:00 less


    herong    1344  0.0  0.0  57184  3792 pts/1    R+   05:17   0:00 ps -u'
