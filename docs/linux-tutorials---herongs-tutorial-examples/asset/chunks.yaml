  trans: "\n\n```\ninet 192.168.1.100 netmask 255.255.255.0 broadcast 192.168.1.255\n\
    ...\n```\n\n```bash\nherong$ mysql -u root -p\n\nmysql> show variables like 'bind_address';\n\
    \n+---------------------+-------+\n| Variable_name       | Value |\n+---------------------+-------+\n\
    | bind_address        | *     |\n+---------------------+-------+\nmysql> show\
    \ variables like 'port';\n\n+---------------+-------+\n| Variable_name | Value\
    \ |\n+---------------+-------+\n| port          | 3306  |\n+---------------+-------+\n\
    ```\n\n## 2. 确保我的 MySQL 用户账户涵盖了我的电脑 IP 地址。\n\n我看到我的电脑 IP 地址 `192.168.1.11` 已经在范围内了（服务器上）\n\
    \n```bash\nherong$ mysql -u root -p\n\nmysql> select user, host from mysql.user;\n\
    \n+------------------+--------------+\n| user             | host         |\n+------------------+--------------+\n\
    | herong           | localhost    |\n| herong           | 127.0.0.1    |\n| herong\
    \           | 192.168.1.%  |\n+------------------+--------------+\n```\n\n（我的电脑上）\n\
    \n```bash\nherong$ ifconfig\n\nen0: flags=8863<UP,BROADCAST,SMART,RUNNING,SIMPLEX,MULTICAST>\
    \ mtu 1500\ninet 192.168.1.11 netmask 0xffffff00 broadcast 192.168.1.255\n```\n\
    \n## 3. 检查从我的电脑到服务器的 IP 地址和端口连接。\n\n我看到电脑可以到达服务器，但无法访问端口 `3306`。（我的电脑上）\n\n```bash\n\
    herong$ ping 192.168.1.100\n\nPING 192.168.1.100 (192.168.1.100): 56 data bytes\n\
    64 bytes from 192.168.1.100: icmp_seq=0 ttl=64 time=4.548 ms\n64 bytes from 192.168.1.100:\
    \ icmp_seq=1 ttl=64 time=2.308 ms\n...\n\nherong$ telnet 192.168.1.100 3306\n\n\
    Trying 192.168.1.100...\ntelnet: connect to address 192.168.1.100: Connection\
    \ refused\ntelnet: Unable to connect to remote host\n```\n\n## 4. 在 MySQL 服务器上开放\
    \ 3306 端口的防火墙。\n\n这些命令为互联网上的所有电脑开放 `3306` 端口。我稍后需要添加更多限制。（服务器上）\n\n```bash\nherong$\
    \ sudo firewall-cmd --zone=public --add-port=3306/tcp\nherong$ sudo firewall-cmd\
    \ --runtime-to-permanent\n```\n\n## 5. 再次检查从我的电脑到服务器的 IP 地址和端口连接。\n\n我看到 TCP/IP\
    \ 连接已开启。\n\n```bash\nherong$ telnet 192.168.1.100 3306\n\nTrying 192.168.1.100...\n\
    Connected to 192.168.1.100.\nEscape character is '^]'.\nJ\n8.0.17/1TZi76?l...\n\
    ```\n\n## 6. 最后，从我的客户端电脑连接到 MySQL 服务器：\n\n```bash\nherong$ /usr/local/mysql/bin/mysql\
    \ -u herong -h 192.168.1.100 -p\n\nEnter password: TopSecret<Enter>\nmysql>\n\
    ```\n\n酷酷！我成功设置了 MySQL 服务器和防火墙，实现了从客户端电脑的 TCP/IP 连接。\n\n---\n\n## “服务器向客户端发送未知字符集\
    \ (Server sent charset unknown to the client)”错误\n\n提供了一个教程示例，说明如何解决在连接 CentOS\
    \ 8 系统上运行的 MySQL 8.0 时，PHP `mysqli_connect()` 调用收到的“Server sent charset unknown\
    \ to the client”错误。如果你在客户端电脑上运行旧版本的 PHP，并尝试使用 `mysqli_connect()` 函数连接到 CentOS\
    \ 系统上的 MySQL 8.0，你将得到“Server sent charset unknown to the client”错误：\n\n```bash\n\
    herong$ php --version\nPHP 5.6.30 (cli) (built: Oct 29 2017 30:32)\n\nherong$\
    \ php test.php\nPHP Warning: mysqli_connect(): Server sent charset (255) unknown\
    \ to the client. Please, report to the developers in /Users/herong/test.php on\
    \ line 10.\nPHP Warning: mysqli_connect(): (HY000/2054): Server sent charset ...\n\
    ```\n\n根据互联网上的报告，上述问题是由默认设置 `character_set_client = utf8mb4` 引起的，旧版本的 `mysqli`\
    \ 模块无法识别它。我尝试了互联网上建议的多种解决方案，对我无效。组合使用也没有效果：\n\n- 在 MySQL 8.0 服务器上运行 `set global\
    \ character_set_client = 'utf8';`\n- 在 MySQL 8.0 服务器上运行 `set global character_set_results\
    \ = 'utf8';`\n- 在 MySQL 8.0 服务器上运行 `set global character_set_connection = 'utf8';`\n\
    - 使用 `skip-character-set-handshake` 选项重启 MySQL 8.0 服务器\n- 使用 `character_set_client=utf8`\
    \ 选项重启 MySQL 8.0 服务器\n\n对我唯一的有效的解决方案是升级 PHP：\n\n```bash\nherong$ php --version\n\
    PHP 7.2.1 (cli) (built: Oct 9 2018 15:09:36) NTSTS\n\nherong$ php test.php\nmysqli_get_server_info()\
    \ = 8.0.17\nmysqli_get_host_info() = 192.168.1.100 via TCP/IP\n```\n\n---\n\n\
    ## 向 MySQL 插入整数的性能\n\n提供了一个教程示例，说明如何使用 PHP `mysqli` 函数测试向 MySQL 数据库插入整数的性能。在我的\
    \ CentOS 和 macOS 电脑上，MySQL 服务器的速度慢了 100 倍。如果你正在处理大量数据集，那么你需要了解 MySQL 服务器的性能。以下是我在运行\
    \ CentOS 8 和 macOS 电脑的 MySQL 服务器上收集的数据。创建一个 PHP 脚本来测量向数据库插入的速度。\n\n```php\n<?php\n\
    # speed-of-insert-integer.php\n# Copyright (c) Herong.com. All Rights Reserved.\n\
    \n$count = 100;\nif (count($argv) > 1) $count = $argv[1];\n$binLog = \"on\";\n\
    if (count($argv) > 2) $binLog = $argv[2];\n\nprint(\"Testing parameters:\\n\"\
    );\nprint(\"Number of operations: $count\\n\");\nprint(\"Binary log = $binLog\\\
    n\");\n\n$con = mysqli_connect(\"127.0.0.1\", 'herong', 'TopSecret', \"test\"\
    );\n$sql = \"SET sql_log_bin = $binLog\";\n$res = mysqli_query($con, $sql);\n\
    $sql = \"CREATE TABLE Tests (Quantity INTEGER);\n$res = mysqli_query($con, $sql);\n\
    $startTime = round(microtime(true)*1000);\n\n$i = 0;\nwhile ($i < $count) {\n\
