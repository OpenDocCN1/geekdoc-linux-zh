    SystemsProvides introductions and tutorial on Linux file systems. Topics include
    ''df'' to see disk free spaces of mounted file systems; ''mount'' to connect to
    USB drive file systems; ''fdisk'' to list partitions and file system types; ''dd''
    to copy data and test I/O speed; ''hdparm'' to manage hard disk parameters.["df"
    - Display Free Space of File System](#text00012.html_a2NF)[Mount USB Drive as
    File System](#text00013.html_a2NG)["fdisk" - Format Disk Partitions](#text00014.html_a2NH)["dd"
    - Copy Data from/to Storage Devices](#text00015.html_a2NJ)[Use "dd" Command to
    Test I/O Speed](#text00016.html_a2NK)["hdparm" - Hard Disk Parameters](#text00017.html_a2NM)["du"
    - Display Disk Usage of Directories](#text00018.html_a2NN)[Mount Windows NTFS
    File System](#text00019.html_a2NP)[W95 Ext''d (LBA) Partition](#text00020.html_a2NR)[File
    System Types, IDs and Formats](#text00021.html_a2NS)Takeaways:


    *   "df” command can be used to display free spaces of mounted file systems.


    *   "mount" command can be used to bring file system partitions online. "umount"
    command can be used to bring them offline.


    *   "fdisk -l " command can be used to list file system partitions and their format
    types of a given storage device.


    *   "dd" command can be used to copy data as continuous blocks of bytes from one
    device to another bypassing file system structures.


    *   "dd" command can also be used to test I/O (Input and Output) speed of a given
    storage device.


    *   "hdparm" command can be used to to gather hard disk identification information
    and get/set its individual parameters.'
