    C/C++ Compiler on Linux Systems](#text00090.html_a2RX)∟ "make" - Manage Program
    Build ProcessProvides a tutorial example on how to use the ''make'' tool to manage
    the build process of large programs that have multiple components.What Is "make"
    - "make" is a utility tool to manage the build (compile, link, install, test,
    etc.) process of large programs that have multiple components. "make" can determine
    automatically which source code files of the program need to be recompiled, and
    issue the commands to recompile them. You can actually use "make" to describe
    any task where some files must be updated automatically from others whenever the
    others change.You can follow this tutorial to install and verify the "make" tool
    on CentOS 8 systems.1\. Install "make":herong$ sudo dnf install make


