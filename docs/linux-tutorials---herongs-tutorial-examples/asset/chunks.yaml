    [Linux Tutorials - Herong''s Tutorial Examples] [SELinux - Security-Enhanced Linux]


    ## What Is SELinux Domain

    Provides a quick introduction on what is SELinux Domain, which is an abstract
    concept that represents a set of running processes grouped together, so that security
    policy can be applied at the group level instead of individually at process level.
    In previous tutorials, we learned what is SELinux User, what is SELinux Role and
    what is SELinux type. Now let''s take a look at SELinux Domain.


    ### What Is SELinux Domain?

    A SELinux Domain is an abstract concept that represents a set of running processes
    grouped together, so that security policy can be applied at the group level instead
    of individually at process level. By default, SELinux has a long list of pre-defined
    SELinux domains. Some of them are listed below:

    `accountsd_t`, `alsa_t`, `auditd_t`, `avahi_t`, `boltd_t`, `chronyd_t`, `colord_t`,
    `crond_t`, `cupsd_t`, `dnsmasq_t`, `firewalld_t`, `fsdaemon_t`, `ftpd_t`, `fwupd_t`,
    `gssproxy_t`, `httpd_t`, `init_t`, `irqbalance_t`, `kernel_t`, `ksmtuned_t`, `lsmd_t`,
    `mcelog_t`, `modemmanager_t`, `mysqld_t`, `policykit_t`, `rngd_t`, `rpcbind_t`,
    `rtkit_daemon_t`, `sshd_t`, `syslogd_t`, `systemd_usd_t`, `systemd_logind_t`,
    `systemd_machined_t`, `tuned_t`, `udev_t`, `unconfined_t`, `virtd_t`, `xdm_t`,
    `xd_t`.


    When a new process is created, SELinux will assign it to a default SELinux Domain
    according a set of pre-defined settings. The SELinux Domain assigned to a process
    is stored in its context attribute as the third field. In the example below, process
    `bash` is assigned to the `unconfined_t` SELinux domain.

    `herong$ ps -Z | grep bash`

    `unconfined_u:unconfined_r:unconfined_t:s0-s0:c1023 20713 pts/1 0:00 bash`


    The SELinux context attribute of a process is also called SELinux label. The process
    of assigning an SELinux type to a file is called SELinux Labeling. The SELinux
    context (process label) stores the complete security information for a process
    in 5 fields as shown below:

    SELinux Context = user:role:domain:level:category


    Actually, SELinux Domain can be viewed as a special case of SELinux Type, if we
    consider SELinux Type as representation of a group of resources. Files and processes
    are just different types.


    ## SELinux Policy Rule

    Provides a quick introduction on innux Policy rules and how to use `sesearch`
    command to review them. In previous tutorials, we learned 4 most important entities
    of the SELinux system: User, Role, Domain and Type. They are used to define SELinux
    security policies in a hierarchical form of: `SELinux Users`, `SELinux Roles`,
    `SELinux Domains`, `SELinux Types`.


    Now let''s look at the bottom part of the SELinux security hierarchy, which is
    also called Type Enforcement: `SELinux Domains`. The SELinux Type Enforcement
    policy is actually a set of policy rules in the form to: `allow "source" on "target"
    of "class" with "permissions"` where:

    - `source`: A SELinux Domain

    - `target`: A SELinux Domain or Type

    - `permissions`: A list of actions permitted

    - `class`: A SELinux Class acting as a subset of targets


    Below is an example of SELinux policy rule retrieved by the `sesearch` command:

    `herong$ sesearch --allow --source httpd_t --target httpd_log_t --class file`

    `allow httpd_t httpd_log_t:file { append create getattr ioctl open ... };`


    The above policy rule tells us that Any process in the `httpd_t` SELinux Domain
    has `append create getattr ioctl open ...` permissions on `file` Class of the
    `httpd_log_t` SELinux Type. Let''s verify what processes are in the `httpd_t`
    SELinux Domain:

    `herong$ ps -eZ | grep httpd_t`

    `system_u:system_r:httpd_t:s0 3427 ? 00:02:43 php-fpm`

    `system_u:system_r:httpd_t:s0 3428 ? 00:03:01 httpd`


    Can these processes append new log entries to the httpd `access-log` file? The
    answer is yes, because it is of the `httpd_log_t` SELinux Type:

    `herong$ sudo ls -Z /var/log/httpd/access_log`

    `system_u:object_r:httpd_log_t:s0 /var/log/httpd/access_log`


    Can a `httpd_t` process create new files in the `/var/www/html` directory? The
    answer is no, because `create` permission is not listed in the related policy
    rule:

    `herong$ sudo ls -dZ /var/www/html`

    `system_u:object_r:httpd_sys_content_t:s0 /var/www/html`

    `herong$ sesearch --allow --source httpd_t --target httpd_sys_content_t --class
    dir`

    `allow httpd_t httpd_sys_content_t:dir { getattr ioctl lock open read search };`


    The SELinux Type Enforcement policy rules are also called `allow` rules in the
    SELinux Policy Database. You can get a list of all `allow` rules using the `sesearch
    --allow` command:

    `herong$ sesearch --allow | more`

    `allow NetworkManager_etc_rw_t NetworkManager_etc_rw_t:filesystem associate;`

    `allow NetworkManager_etc_t NetworkManager_etc_t:filesystem associate;`

    `allow NetworkManager_exec_t NetworkManager_exec_t:filesystem associate;`

    `allow NetworkManager_log_t NetworkManager_log_t:filesystem associate;`

    `allow NetworkManager_log_t tmp_t:filesystem associate;`

    `allow NetworkManager_log_t tmpfs_t:filesystem associate;`


    ...


    ## What Is SELinux Boolean

    Provides a quick introduction on SELinux Boolean, which is a Boolean flag that
    can be added to one or more SELinux policy rules to turn on or turn off those
    rules.


    ### What Is SELinux Boolean?

    A SELinux Boolean is a Boolean flag that can be added to one or more SELinux policy
    rules to turn on or turn off those rules. By default, SELinux has a long list
    of pre-defined SELinux Booleans. You can use `semanage boolean -l` to see them
    and their current settings:

    `herong$ sudo semanage boolean -l`


    | SELinux boolean | State | Description |

    | :--- | :--- | :--- |

    | abrt_anon_write | off | Allow abrt to anon write |

    | abrt_handle_event | off | Allow abrt to handle event |

    | antivirus_can_scan_system | off | Allow antivirus to scan system |

    | antivirus_use_jit | off | Allow antivirus to use jit |

    | auditadm_exec_content | on | Allow auditadm to exec content |

    | authlogin_radius | off | Allow authlogin to radius |

    | authlogin_yubikey | off | Allow authlogin to yubikey |

    | boinc_execmem | on | Allow boinc to execmem |

    | ... | ... | ... |

    | httpd_can_network_connect | off | Allow httpd to can network connect |


    ...


    If a SELinux policy rule is controlled by a SELinux Boolean, The boolean flag
    will be listed at the end of the rule. For the following policy rule says that
    a `httpd_t` process can `name_connect` on `port_type:tcp_socket` type only when
    `httpd_can_network_connect` Boolean is True.

    `herong$ sesearch --allow --source httpd_t | grep ''httpd_can_network_connect
    ''`

    `allow httpd_t port_type:tcp_socket name_connect; [ httpd_can_network_connect
    ]:True`


    There are several ways to manage SELinux Boolean settings:

    `semanage boolean -l`: To list all Booleans and their settings

    `getsebool -a`: To list all Booleans and their settings

    `setsebool boolean_name on`: To turn on a given Boolean


    ```

    setsebool -P abrt_anon_write on

    ```

    '
