    # "df" - Display Free Space of File System


    Provides a tutorial example on how to use the `df` command to display free spaces
    of mounted file systems on Linux systems. To see free spaces of mounted file systems,
    you can use the `df` command. Here are some sample outputs of the `df` command
    on my CentOS 8 computer.


    ## 1. Display free spaces of all mounted file systems using "df":


    ```bash

    herong$ df


    Filesystem           1K-blocks      Used Available Use% Mounted on

    devtmpfs             3875992           0   3875992   0% /dev

    tmpfs               3894608           0   3894608   0% /dev/shm

    tmpfs               3894608      18192   3876416   1% /run

    tmpfs               3894608           0   3894608   0% /sys/fs/cgroup

    /dev/mapper/cl-root  52403200 6279684  46123516  12% /

    /dev/mapper/cl-home  40813088  609176  40203912   2% /home

    /dev/sda6             999320  148068    782440  16% /boot

    tmpfs                778920      1168    777752   1% /run/user/42

    tmpfs                778920      6960    771960   1% /run/user/1000

    ```


    ## 2. Display free spaces in unit of Megabyte of all mounted file systems using
    "df -m":


    ```bash

    herong$ df -m


    Filesystem           1M-blocks  Used Available Use% Mounted on

    devtmpfs               3786           0      3786   0% /dev

    tmpfs               3804           0      3804   0% /dev/shm

    tmpfs               3804          18      3786   1% /run

    tmpfs               3804           0      3804   0% /sys/fs/cgroup

    /dev/mapper/cl-root   5175         133      5043   2% /

    /dev/mapper/cl-home   3987          95      3892   2% /home

    /dev/sda6              96          45      765  16% /boot

    tmpfs                761           2      760   1% /run/user/2

    tmpfs                761           7      754   1% /run/user/1000

    ```


    ## 3. Display free spaces in unit of Gigabyte of all mounted file systems using
    "df --block-size=1G":


    ```bash

    herong$ df --block-size=1G


    Filesystem           1G-blocks  Used Available Use% Mounted on

    devtmpfs                   4           0           4   0% /dev

    tmpfs                   4           0           4   0% /dev/shm

    tmpfs                   4           1           4   1% /run

    tmpfs                   4           0           4   0% /sys/fs/cgroup

    /dev/mapper/cl-root      50           6          44  12% /

    /dev/mapper/cl-home      39           1          39   2% /home

    /dev/sda6               1           1           1  16% /boot

    tmpfs                   1           1           1   1% /run/user/42

    tmpfs                   1           1           1   1% /run/user/1000

    ```


    # Mount USB Drive as File System


    Provides a tutorial example on how to mount the formatted partition of a USB drive
    on a Linux system as a file system. If you have a USB drive, you can insert it
    into a socket on your Linux system, and follow this tutorial to mount it as a
    new system.


    ## 1. Check existing SCSI devices represented as `/dev/sd*`:


    ```bash

    herong$ ls -l /dev/sd*

    brw-rw---- 1 root root 8 May 26 21:17 /dev/sda

    brw-rw---- 1 root root 8 May 26 21:17 /dev/sda1

    brw-rw---- 1 root root 8 May 26 21:17 /dev/sda2

    brw-rw---- 1 root root 8 May 26 21:17 /dev/sda5

    brw-rw---- 1 root root 8 May 26 21:17 /dev/sda6

    brw-rw---- 1 root root 8 May 26 21:17 /dev/sda7

    ```


    ## 2. Insert the USB drive in a socket. And check SCSI devices again.


    Since USB drives are considered SCSI devices on Linux system, you will see more
    devices are detected and represented as `/dev/sd*`. In my example below, I see
    `/dev/sdb` representing the USB as a whole, and `/dev/sdb1` representing the first
    FAT32 partition.


    ```bash

    herong$ ls -l /dev/sd*

    brw-rw---- 1 root root 8 May 26 21:17 /dev/sda

    brw-rw---- 1 root root 8 May 26 21:17 /dev/sda1

    brw-rw---- 1 root root 8 May 26 21:17 /dev/sda2

    brw-rw---- 1 root root 8 May 26 21:17 /dev/sda5

    brw-rw---- 1 root root 8 May 26 21:17 /dev/sda6

    brw-rw---- 1 root root 8 May 26 21:17 /dev/sda7

    brw-rw---- 1 root root 8 Apr 04 02:25 /dev/sdb

    brw-rw---- 1 root root 8 Apr 04 02:25 /dev/sdb1

    ```


    ## 3. Find a mounting point on the root file system on my CentOS 8 computer, and
    mount the USB formatted device, `/dev/sdb1`.


    You may see different mounting points on other Linux systems. By the way, you
    can not mount `/dev/sdb`, because it is not a file system.


    ```bash

    herong$ ls -l /

    lrwxrwxrwx. 1 root root 7 May 10 2019 bin -> usr/bin

    dr-xr-xr-x. 6 root root 4096 Mar 26 21:18 boot

    drxr-xr-x. 20 root root 3700 Apr 04 08:25 dev

    drxr-xr-x. 144 root root 8192 Mar 30 07:37 etc

    drxr-xr-x. 3 root root 20 Mar 26 17:11 home

    lrwxrwxrwx. 1 root root 7 May 10 2019 lib -> usr/lib

    drxr-xr-x. 2 root root 6 May 10 2019 media

    drxr-xr-x. 2 root root 6 May 10 2019 mnt

    drxr-xr-x. 2 root root 6 May 10 2019 opt

    ...

    herong$ ls -l /media

    total 0

    herong$ sudo mount /dev/sdb1 /media

    ```


    ## 4. Verify the formatted partition of the USB drive as a mounted file system:


    ```bash

    herong$ df

    Filesystem           1K-blocks      Used Available Use% Mounted on

    ...

    /dev/sdb1             7813124 1146116  6667008  15% /media

    ```


    ## 5. Check the "System Volume Information" folder, which usually exists on the
    formatted partition of any USB drive.


    ```bash

    herong$ ls -l "/media/System Volume Information"

    total 256

    -rwxrwxrwx 1 root root 7 Apr 04 02:25

    -rwxrwxrwx 1 root root 7 Apr 04 02:25

    ```


    ## 6. Remember to unmount the USB before taking it out to avoid any damage.


    ```bash

    herong$ sudo umount /dev/sdb1

    ```

