  trans: "\n\n# SELinux 核心概念\n\n- `MAC (强制访问控制)` - 一种基于存储在数据库中的显式安全策略集的权限系统。`SELinux`\
    \ 使用了 `MAC`。\n- `MCS (多分类安全)` - 权限系统将不同安全类别（例如：核心、实用程序、插件）关联到信息对象的能力。\n- `MLS\
    \ (多级安全安全)` - 权限系统将不同安全级别（例如：未分类、机密、秘密、绝极机密）关联到信息对象的能力。安全级别具有层级关系。较高的安全级别通常允许的操作较少。\n\
    - `SELinux User (SELinux 用户)` - 一种抽象概念，代表 Linux 系统上一组真实用户，作为 `SELinux` 系统中的安全主体。\n\
    - `SELinux Role (SELinux 角色)` - 一种抽象概念，代表为特定功能角色分组在一起的一组权限。\n- `SELinux Type (SELinux\
    \ 类型)` - 一种抽象概念，代表一组分组的文件/目录，以便安全策略可以应用于组级别，而不是单独地应用于文件/目录级别。\n- `SELinux Domain\
    \ (SELinux 域)` - 一种抽象概念，代表一组运行在一起的进程，以便安全策略可以应用于组级别，而不是单独地应用于进程级别。\n- `SELinux\
    \ Class (SELinux 类)` - 一种抽象概念，代表根据目标资源的性质划分的 `SELinux Types` 子集，如“文件”、“目录”、“socket”等。\n\
    \n# CentOS 网络连接\n\n提供了关于 CentOS 系统上网络配置和防火墙的介绍和教程。主题包括：带有自动 DHCP 配置的以太网连接介绍；使用\
    \ `ifconfig` 查看当前网络配置；`firewalld` 守护进程和 `firewall-cmd` CLI 作为防火墙前端工具；`nftables`\
    \ 守护进程和 `nft` CLI 作为防火墙后端工具；作为网络扫描器的 `nmap`；作为网络活动监控器的 `netstat`。\n\n## 核心要\n\n\
    - 以太网连接设置可以通过本地网络的 `DHCP (动态主机配置协议)` 服务自动完成。\n- `ifconfig` 命令可以查看 CentOS 系统上所有网络接口的当前网络配置。\n\
    - `firewalld` 守护进程和 `firewall-cmd` CLI（命令行界面）是管理 CentOS 系统上网络防火墙的前端工具。\n- `nftables`\
    \ 守护进程和 `nft` CLI（命令行界面）是管理 CentOS 系统上网络防火墙的后端工具。\n- 在 CentOS 8 系统上，`iptables`\
    \ 命令被 `nftables` 守护进程和 `nft` CLI 代替。\n- `nmap (网络映射)` 是一种网络探索工具和安全扫描器。\n- `netstat\
    \ (网络状态)` 是网络活动监控工具。\n\n# 在 CentOS 上设置以太网连接\n\n提供了一个如何在 CentOS 8 系统上检查和排除以太网连接故障的教程示例。如果您在桌面计算机上运行\
    \ CentOS 系统，它很可能连接到了本地网络的以太网。以下是我在 CentOS 8 计算机上检查和设置以太网连接的操作。\n\n1. 确保计算机已以太网线到本地网络。您应该看到以太网端口旁边有两个灯。如果其中一个在闪烁，说明您的计算机和网络之间存在数据活动。\n\
    2. 从桌面屏幕检查以太网连接设置。\n   - 点击屏幕右上角的以太网图标。\n   - 点击打开“有线 (Wired)”连接。您应该看到网络设置屏幕。\n\
    \   - 点击开关将其打开。\n   - 点击设置图标。您应该看到有线连接详情。\n3. 读取有线连接详情。默认情况下，您的 IP 地址、默认路由（网关）、DNS\
    \ 是由本地网络的 `DHCP (动态主机配置协议)` 服务动态配置的。无需更改它们。\n   - 链路速率：100 Mb/s\n   - IPv4 地址：192.168.1.100\n\
    \   - 硬件地址：...\n   - 默认路由：192.168.1.1\n   - DNS：192.168.1.1\n\n![](img/Image00006.jpg)\n\
    \n4. 您也可以使用 `ifconfig` 命令验证以太网连接：\n\n```bash\nherong$ ifconfig\n\neno1: flags=4163<UP,BROADCAST,RUNNING,MULTICAST>\
    \  mtu 1500\n     inet 192.168.1.100  netmask 255.255.255.0  broadcast 192.168.1.255\n\
    \     inet6 fe80::...:fe80  prefixlen 64  scopeid 0x20<link>\n     ether 39:39:...\
    \  txqueuelen 1000  (Ethernet)\n     RX packets 1162982  bytes 31120747 (296.7\
    \ MiB)\n     RX errors 0  dropped 61365  overruns 0  frame 0\n     TX packets\
    \ 247671  bytes 58741459 (56.0 MiB)\n     TX errors 0  dropped 0 overruns 0  carrier\
    \ 0  collisions 0\n     device interrupt 20  memory 0xf7c00000-f7c20000\n```\n\
    \n5. 使用 `ping` 命令验证互联网连接：\n\n```bash\nherong$ ping bing.com\n\nPING bing.com (204.79.197.200)\
    \ 56(84) bytes of data.\n64 bytes from a-0001.a-msedge.net (204.79.197.200): icmp_seq=1\
    \ ttl=118 time=21.1 ms\n64 bytes from a-0001.a-msedge.net (204.79.197.200): icmp_seq=2\
    \ ttl=118 time=20.9 ms\n...\n64 bytes from a-0001.a-msedge.net (204.79.197.200):\
    \ icmp_seq=9 ttl=118 time=20.8 ms\n\n^C\n--- bing.com ping statistics ---\n9 packets\
    \ transmitted, 9 received, 0% packet loss, time 18ms\nrtt min/avg/max/mdev = 20.658/21.993/30.929/3.163\
    \ ms\n```\n\n6. 如果 `ping` 命令失败，请检查以下内容：\n   - 检查两端的以太网线连接。\n   - 更换一根新的以太网线。\n\
    \   - 将计算机移动到不同的以太网插座。\n   - 验证本地网络网关防火墙设置。确保您的 IP 地址或 MAC 地址未被黑名单拦截。\n\n"
- fmt: "\n7. If you have trouble connecting to the Internet during CentOS installation,\
    \ you can download the `-dvd1.iso` version to install CentOS from the ISO image\
    \ without Internet connection.\n\n## Network Firewall Tools on CentOS\n\nProvides\
    \ quick descriptions on 3 major network firewall tools, `firewalld/fireall-cmd`,\
    \ `nftables/nft`, and `iptables` on CentOS 8 systems. After connecting your CentOS\
    \ system to the Internet, you need to review and revise firewall settings to protect\
    \ your system. CentOS system uses a number tools to manage the network firewall.\
    \ Here are 3 major ones:\n\n1. `firewalld` and `fireall-cmd` - A firewall daemon\
    \ and a CLI (Command Line Interface) works together as a frontend tool to manage\
    \ the network firewall. `firewalld` uses `nftables/iptables` as the backend engine.\n\
    2. `nftables` and `nft` - A firewall daemon and a CLI (Command Line Interface)\
    \ works together as a backend engine for packet filtering and classification.\
    \ `nftables` uses `/etc/nftables` directory to store its rules. `nftables` is\
    \ installed on CentOS 8 by default to replace `iptables`.\n3. `iptables` - A basic\
    \ administration tool for IPv4/IPv6 packet filtering and NAT (Network Address\
    \ Translation) in the Linux kernel. `iptables` uses `/usr/sbin/iptables` to store\
    \ its rules. `iptables` is now replaced by `nftables` on CentOS 8 systems.\n\n\
    Here is diagram that shows how firewalld, `nftables/iptables` and other tools\
    \ are related to each other (source: https://firewalld.org).\n![](Image00007.jpg)\n\
    \n## firewalld and firewall-cmd\n\nProvides a tutorial example on how to use `firewalld`\
    \ daemon and `firewall-cmd` CLI to manage network firewall on CentOS 8 systems.\
    \ `firewalld` is a service daemon that works together with the `firewall-cmd`\
    \ CLI (Command Line Interface) to form a front-end tool for the `nftables/iptables`\
    \ tool to control the Internet traffic. Here is what I did to ensure that `firewalld`\
    \ and `firewall-cmd` are working on my CentOS 8 computer.\n\n1. Make sure that\
    \ I have the latest version of `firewalld` installed with the `dnf info` command:\n\
    ```bash\nherong$ sudo dnf info firewalld\n\nInstalled Packages\nName: firewalld\n\
    Version: 0.7.0\nRelease: 5.el8\nArchitecture: noarch\nSize: 1.9 M\nSource: firewalld-0.7.0-5.el8.src.rpm\n\
    Repository: @System\nFrom repo: anaconda\nSummary: A firewall daemon with D-Bus\
    \ interface providing a dynamic firewall\nURL: http://www.firewalld.org\nLicense:\
    \ GPLv2+\nDescription: firewalld is a firewall service daemon that provides a\
    \ dynamic customizable firewall with a D-Bus interface.\n```\n\n2. Make sure that\
    \ `firewalld` service is running with the `systectl status` command:\n```bash\n\
    herong$ sudo systemctl status firewalld\n\nfirewalld.service - firewalld - dynamic\
    \ firewall daemon\n    Loaded: loaded (/usr/lib/systemd/system/firewalld.service;\
    \ enabled;\n             vendor preset: enabled)\n    Active: active (running)\n\
    \    Docs: man:firewalld(1)\n    Main PID: 1360 (firewalld)\n    Tasks: 3 (limit:\
    \ 26213)\n    Memory: 34.4M\n    CGroup: /system.slice/firewalld.service\n```\n\
    \n3. Check to see which security zone is active on each network interface with\
    \ the `firewall-cmd` command. I see `public` zone of security rules applied on\
    \ the Ethernet interface.\n```bash\nherong$ sudo firewall-cmd --get-active-zones\n\
    \npublic\n  interfaces: eno1\n```\n\n4. Check to see what security rules are defined\
    \ in the `public` zone. I see two TCP ports, 80 and 3306, are open for incoming\
    \ traffic. Other ports used by `cockpit`, `dhcpv6-client`, and `ssh` services\
    \ are also open.\n```bash\nherong$ sudo firewall-cmd --zone=public --list-all\n\
    public (active)\n  target: default\n  icmp-block-version: no\n  interfaces: eno1\n\
    \  sources:\n  services: cockpit dhcpv6-client ssh\n  ports: 80/tcp 3306/tcp\n\
    \  protocols:\n  masquerade: no\n  forward-ports:\n  icmp-blocks:\n  rich rules:\n\
    ```\n\n5. Add a new rule to open TCP port 8080 for Tomcat server. The first command\
    \ allows all IP addresses from the Internet to access port 8080. The second command\
    \ saves the change permanently.\n```bash\nherong$ sudo firewall-cmd --zone=public\
    \ --add-port=8080/tcp\nherong$ sudo firewall-cmd --runtime-to-permanent\n```\n\
    \n6. Add a new rule to open all ports for a given IP address.\n```bash\nherong$\
    \ sudo firewall-cmd --zone=public --add-source=192.168.1.11\nherong$ sudo firewall-cmd\
    \ --runtime-to-permanent\n```\n\n7. Turn on traffic forward and a forward rule:\n\
    ```bash\nherong$ sudo firewall-cmd --zone=external --add-masquerade\nherong$ sudo\
    \ firewall-cmd --zone=public --add-forward-port=8888:proto=tcp:port=80:addr=192.168.1.201\n\
    herong$ sudo firewall-cmd --runtime-to-permanent\n```\n\n8. Add a pre-defined\
    \ service, which contains IP ports used by the service. For example, opening `http`\
    \ service is the same as opening port 80.\n```bash\nherong$ sudo firewall-cmd\
    \ --zone=public --add-service=http\nherong$ sudo firewall-cmd --zone=public --list-services\n\
    cockpit dhcpv6-client ssh\nherong$ sudo firewall-cmd --runtime-to-permanent\n\
    ```\n\n9. Add new rich rules, which are basically `iptable` rules.\n# reject incoming\
    \ traffic from the guest computer\n```bash\nherong$ sudo firewall-cmd --add-rich-rule=\"\
    rule family='ipv4' source='192.168.1.100' reject\"\n```\n# allow my computer to\
    \ access the MySQL database at port 3306\n```bash\nherong$ sudo firewall-cmd --add-rich-rule='rule\
    \ family=\"ipv4\" address=\"192.168.1.11\" protocol=\"tcp\" port=\"3306\" accept'\n\
    ```\n# allow local computers to access the `http` service at port 80\n```bash\n\
    herong$ sudo firewall-cmd --add-rich-rule='rule family=\"ipv4\" source=\"192.168.1.0/24\"\
    \ service=\"http\" accept'\n```\n# verify changes\n```bash\nherong$ sudo firewall-cmd\
    \ --zone=public --list-all\npublic (active)\n  target: default\n  icmp-block-version:\
    \ no\n  interfaces: eno1\n  sources:\n  services: cockpit dhcpv6-client ssh\n\
    \  ports: 80/tcp 3306/tcp\n  protocols:\n  masquerade: no\n  forward-ports:\n\
    \  source-ports:\n  icmp-blocks:\n  rich rules:\n  rule family=\"ipv4\" source=\"\
    192.168.1.0/24\" service=\"http\" accept\n```\n# save changes\n```bash\nfirewall-cmd\
    \ --runtime-to-permanent\n```\n\n## nftables and nft\n\nProvides a tutorial example\
    \ on how to use `nftables` daemon and `nft` CLI to manage network firewall on\
    \ CentOS 8 systems. The best tool to manage the network firewall on CentOS systems\
    \ is the `firewall-cmd` frontend tool. But if you want to use the backend tool,\
    \ you can follow this tutorial to use the `nftables` daemon and `nft` command.\n\
    \n1. Make sure that I have the latest version of `nftables` installed with the\
    \ `dnf info` command:\n```bash\nherong$ sudo dnf info nftables\n\nInstalled Packages\n\
    Name: nftables\nEpoch: 1\nVersion: 0.9.0\nRelease: 14.el8\nArchitecture: x86_64\n\
    Size: 848 k\nSource: nftables-0.9.0-14.el8.src.rpm\nRepository: @System\nFrom\
    \ repo: anaconda\nSummary: Netfilter Tables userspace utilities\nURL: http://netfilter.org/projects/nftables/\n\
    License: GPLv2\nDescription: Netfilter Tables userspace utilities.\n```\n\n2.\
    \ Make sure that `nftables` service is running with the `systectl status` command:\n\
    ```bash\nherong$ sudo systemctl status nftables\n\nnftables.service - Netfilter\
    \ Tables\n    Loaded: loaded (/usr/lib/systemd/system/nftables.service; disabled;\n\
    \             vendor preset: disabled)\n    Active: inactive (dead)\n    Docs:\
    \ man:nft(8)\n```\n```bash\nherong$ sudo systemctl enable nftables\nCreated symlink\
    \ /etc/systemd/system/multi-user.target.wants/nftables.service ...\n\nherong$\
    \ sudo systemctl start nftables\n\nherong$ sudo systemctl status nftables\n\n\
    nftables.service - Netfilter Tables\n    Loaded: loaded (/usr/lib/systemd/system/nftables.service;\
    \ enabled; ...\n```\n"
