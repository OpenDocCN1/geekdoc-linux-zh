    \ tutorial example on how to use `g++ -I...` option and/or `CPATH` environment\
    \ variable to specify paths of include header files for GCC compiler. If you are\
    \ compiling a C/C++ program that uses custom header files, you need to specify\
    \ the path name where the header files are located.\n\n1. Create a simple header\
    \ file, `./include/myheader.h`:\n```bash\nherong$ vi ./include/myheader.h\n#define\
    \ Name \"herong\"\n```\n\n2. Create a C++ program file that uses the header file:\n\
    ```cpp\nherong$ vi HeaderTest.cpp\n#include \"iostream\"\n#include \"string\"\n\
    #include \"myheader.h\"\n\nint main(void) {\n  std::string who (Name);  \n  std::cout\
    \ << \"Hello \" << who << \"!\" << std::endl;\n  return 0;\n}\n```\n\n3. Compile\
    \ it without specifying the include path:\n```bash\nherong$ g++ HeaderTest.cpp\n\
    HeaderTest.cpp:3:10: fatal error: myheader.h: No such file or directory\n  #include\
    \ \"myheader.h\"\n             ^~~~~~~~~~~~\ncompilation terminated.\n```\n\n\
    4. Compile it with `-I ...` option to specify include path:\n```bash\nherong$\
    \ g++ -I ./include -v HeaderTest.cpp\n...\n#include \"...\" search starts here:\n\
    #include <...>  search starts here:\n  ./include\n/usr/include/c++/8\n/usr/include/c++/8/x86_64-redhat-linux\n\
    /usr/include/c++/8/backward\n/usr/lib/gcc/x86_64-redhat-linux/8/include\n/usr/local/include\n\
    /usr/include\nEnd of search list.\n...\nherong$ ./a.out\nHello herong!\n```\n\n\
    5. Compile it with `CPATH=...` environment variable to specify include path:\n\
    ```bash\nherong$ export CPATH=./include\nherong$ g++ -v HeaderTest.cpp\n...\n\
    #include \"...\" search starts here:\n#include <...>  search starts here:\n  ./include\n\
    /usr/include/c++/8\n/usr/include/c++/8/x86_64-redhat-linux\n/usr/include/c++/8/backward\n\
    /usr/lib/gcc/x86_64-redhat-linux/8/include\n/usr/local/include\n/usr/include\n\
    End of search list.\n...\nherong$ ./a.out\nHello herong!\n```\n\nNow I know the\
    \ `-I ...` option or `CPATH` environment variable is adding more paths to the\
    \ GCC default list to search for include header files.\n\n## \"g++ -l...\" to\
    \ Link with Library Files\n\nProvides a tutorial example on how to use `g++ -static`\
    \ and `g++ -l...` options to link your program with static or dynamic library\
    \ files. GCC C/C++ compilers support 2 types of library files:\n\n1. **Static\
    \ Library Files**: Static library files are also called Archive files and have\
    \ `.a` file extension on Linux systems. When you link your program with static\
    \ library files, all objects referenced by your program will be verified and copied\
    \ into the final executable file. This makes the executable file much bigger.\
    \ But it makes the execution easier, since static library files are no longer\
    \ needed at the execution time.\n2. **Dynamic Library Files**: Static library\
    \ files are also called Shared Object files and have `.so` file extension on Linux\
    \ systems. When you link your program with Dynamic library files, all objects\
    \ referenced by your program will be verified but not copied into the final executable\
    \ file. This makes the executable file much smaller. But it makes the execution\
    \ harder, since dynamic library files needs be loaded into CPU together with your\
    \ executable file.\n\nThe GCC C/C++ compilers allows to control which type of\
    \ library files to use and specify library file using `-static` and `-l...` options.\
    \ Note that the actual library name is computed from whatever specified in the\
    \ `-l...` option with `lib` prefix and `.a` or `.so` extension.\n\nExample 1 -\
    \ the following command links 2 library files, `libabc.a` and `libxyz.a` in the\
    \ current directory:\n```bash\nherong$ g++ -static -labc -lxyz myProgram.cpp\n\
    ```\n\nExample 2 - the following command links 2 library files, `libabc.so` and\
    \ `libxyz.so` in the current directory:\n```bash\nherong$ g++ -labc -lxyz myProgram.cpp\n\
    ```\n\n## \"g++ -c\" and \"ar cs\" to Build Static Library\n\nProvides a tutorial\
    \ example on how to use `g++ -c` and `ar cs` commands to compile your code and\
    \ to build library file on Linux systems. If you want to build your own library\
    \ files, you need to do it in two steps:\n* Compile source code files and generate\
    \ object code files with `g++ -c`.\n* Build an archive file as the library file\
    \ from object code files with `ar cs`.\n\nHere is what I did to build first static\
    \ library file: `libMyStatic.a`:\n\n1. Create a source code file, `MyStatic.cpp`:\n\
    ```cpp\nherong$ cat MyStatic.cpp\n#include \"iostream\"\nvoid myStaticFunc() {\n\
    \  std::cout << \"RunningStaticFunc()...\" << std::endl;\n}\n```\n\n2. Compile\
    \ source code file, `MyStatic.cpp`, into object code file, `MyStatic.o`:\n```bash\n\
    herong$ g++ -c MyStatic.cpp\nherong$ ls -l MyStatic.*\n-rw-rw-r-- 1 herong 17\
    \ Apr 10 23:50 MyStatic.cpp\n-rw-rw-r-- 1 herong 2744 Apr 10 23:52 MyStatic.o\n\
    ```\n\n3. Create static library file, `libMyStatic.a` from object code file, `MyStatic.o`:\n\
    ```bash\nherong$ ar cs libMyStatic.a MyStatic.o\nherong$ ls -l libMyStatic.*\n\
    -rw-rw-r-- 1 herong 2898 Apr 10 23:54 libMyStatic.a\n-rw-rw-r-- 1 herong 17 Apr\
    \ 10 23:50 MyStatic.cpp\n-rw-rw-r-- 1 herong 2744 Apr 10 23:52 MyStatic.o\nherong$\
    \ ar t libMyStatic.a MyStatic.o\n```\n\n4. Create a calling program, `MyStaticTest.cpp`:\n\
    ```cpp\nherong$ cat MyStaticTest.cpp\n#include \"iostream\"\nextern void myStaticFunc();\n\
    int main() {\n  std::cout << \"Calling myStaticFunc()...\" << std::endl;\n  myStaticFunc();\n\
    }\n```\n\n5. Link `MyStaticTest.cpp` with `MyStatic.o` directly to confirm that\
    \ the test program is working:\n```bash\nherong$ g++ MyStatic.o MyStaticTest.cpp\n\
    herong$ ./a.out\nCalling myStaticFunc()...\nRunningStaticFunc()...\n```\n\n6.\
    \ Link `MyStaticTest.cpp` with `libMyStatic.a` without giving location path:\n\
    ```bash\nherong$ g++ -lMyStatic MyStaticTest.cpp\n/usr/bin/ld: cannot find -lMyStatic\n\
    ```\n\n7. Link `MyStaticTest.cpp` with `libMyStatic.a` with giving location path\
    \ using the `g++ -L ...` option. I can also use the `LIBRARY_PATH` environment\
    \ variable instead of `g++ -L ...`:\n```bash\nherong$ g++ -L . -lMyStatic MyStaticTest.cpp\n\
    /tmp/cciFWV0h.o: In function `main':\nMyStaticTest.cpp:(.text+0x21): undefined\
    \ reference to `myStaticFunc()`\n```\n\n8. Force GCC to do static library linking:\n\
    ```bash\nherong$ g++ -static -L . -lMyStatic MyStaticTest.cpp\n/usr/bin/ld: cannot\
    \ find -lstdc++\n/usr/bin/ld: cannot find -lm\n/usr/bin/ld: cannot find -lc\n\
    collect2: error: ld returned 1 exit status\n```\nLooks like I am still missing\
    \ something to make GCC working with static library files. By the way, you can\
    \ use `LIBRARY_PATH` environment variable to specify static library file path\
    \ instead of the `g++ -L ...` option.\n\n## \"g++ -shared\" to Build Dynamic Library\n\
