    # Checking for an Accurate Response


    The protocols used to send and receive query packets implement length fields to
    ensure receipt of the expected amount of data, and they use checksum fields to
    ensure that the data received is the same as the data sent. There is still a possibility,
    albeit a small one, that your client may receive a corrupted response from your
    server under heavy network and system loading conditions.


    Listing 7.1 uses a simple check of the line number that is contained, by design,
    on each line of text. It reads the line number from the text and compares it to
    the line number asked for, as follows:


    ```

    /* print out response to our query */

    printf("\tline \d: %%s", jj, buf);\n/* check for correct line */

    p = strchr(buf, '' '') + 2;

    if(jj != atoi(p))

    printf("*");


    printf("\n");

    ```


    Note the asterisk (*) appended to each report line when a mismatch is detected.

    You can make this more sophisticated by counting the number of correct and incorrect
    responses and by keeping track of the percentage of correct packets. The client
    program you develop later in this chapter implements such a feature and includes
    these statistics in its display.'
