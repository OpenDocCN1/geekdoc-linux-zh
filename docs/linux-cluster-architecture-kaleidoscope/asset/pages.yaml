  md: '# Configuring the Relevant Operating System Files


    Network interface cards, a hub, and a few cables are just not enough to meeting
    needs. Each machine on the network must know that a network exists, know its own
    network name, and know the names of at least some of the remote machines. Until
    you can access a remote machine and all its resources from your local machine,
    the network isn''t a.


    Making all this hardware together requires that you change some Linux system files.
    The Linux network support you to influence comes in the form of active processes,
    called daemons, started at boot or as in response to an inter-process communication.
    The remote service is discussed in Chapter 3, "Inter-Process Communications,"
    and we will be on discussion later in this chapter in the section titled "Remote
    Reference Commands." These processes look at certain system files every time you
    try to access a remote machine by name. These files are well defined and can be
    found in predictable locations. (Remember that later versions of an OS might change
    the format or location of these system files.)


    # A Brief Review of the Cluster Configuration


    During the Linux installation process, you are asked to identify hostnames, IP
    addresses, the domain name, and so on. The configuration examples that follow
    invented machine names and addresses to show what you needs to be added or changed
    in each case. Remember that you can choose whatever names you like, provided you
    stay within some minor constraints.


