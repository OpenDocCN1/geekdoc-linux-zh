    a packet, a string of bytes with header information that included the sender and
    receiver''s addresses and the number of data bytes; trailer information held information
    used to verify that the bytes were received as sent. A corrupted packet was to
    be the result of a collision—two or more data packets transmitted at the same
    time.


    This protocol was so simple and yet powerful that computer scientists took notice.
    They thought about the possibilities that this new-computer communication technique
