- img_proc: true
  md: 'to reduce the overall response time. This is a direct application of principles
    that are often applied to software optimization: time function, and then time
    each high-level instruction of the long-running functions to get an area where
    the execution time is being spent; then you can optimize that code if possible.
    Distributed systems can be analyzed as if they were an application, but they are
    more complex because of the variance in their interprocess communications on heavily
    loaded networks.


    Following are two maxims of software optimization: time is always somewhere than
    you expect, and (the news) initial efforts are often rewarded with huge gains.
    As with newly written application programs, a close look at the way in which calculations
    are made, and a little effort toward optimizing these methods can reduce the overall
    execution time dramatically. You will find that the same rewards await you when
    you optimize your cluster, and it will take a much greater effort on your part
    to get the timing data because these tools are not generally available at this
    writing. Fret not, however, because later chapters will guide you through a custom
    development of tools specific to your needs.


