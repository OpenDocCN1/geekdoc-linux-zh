  md: '# Distributed Shared Memory Systems


    As part of his doctoral work in 1986, Li designed a unique system using PCs on
    a network. He suggested mapping the concept of a tightly coupled multiprocessor
    running virtual memory onto the collective physical memory space of a network
    of workstations.


    Each time data was accessed in local memory, it came directly from local memory
    data bus speeds. When data was accessed in a remote PC''s memory, memory data
    request and response messages would have to be exchanged before processing resume.
    The data address would be unique within the address space of the distributed process.
    Any process designed and compiled for a tightly coupled MP system could run without
    modification on that relatively inexpensive collection of PCs on a simple local
    network.


    Li called this class of systems later became as distributed shared memory, or
    DSM, DSMs were painfully slow compared to their tightly coupled MP counterparts,
    but they were very cheap, and they had some very interesting properties further
    exploration. Researchers flooded architecture and operating system conferences
    with DSM papers for many years, and many of those papers have been collected into
    a book that is cited in the "Further Reading" section at the end of this chapter.


    # Cluster Architectures


    The software running on Li''s networked PCs was unique in that it defined the
    architecture. Subsequent research capitalized on this feature, giving us what
    we call the cluster system today. Their software gave these independent PCs unity,
    defining the system''s personality; the software was the soul of the system!


    The plethora of research into DSM systems led to the maximum ratio of packet size
    versus processing time mentioned earlier. It also brought to light many ways to
    achieve high availability through fault tolerance. This was certainly a welcome
    feature considering the dramatic growth in online banking, computerized stock
    trading, and distributed database servers. Ten years after Li''s initial work,
    when all this computerization was getting to be a very hot topic, the World Wide
    Web took online computing by storm.


    Today, a popular commercial Web''s server absolutely must be up and operational
    24 hours a day, 7 days a week, or a good deal of money may be lost. A big enough
    market exists for high availability servers that the software running on each
    node and the hardware that connects them has become very sophisticated indeed.
    (And that sophistication is reflected in their cost!)'
