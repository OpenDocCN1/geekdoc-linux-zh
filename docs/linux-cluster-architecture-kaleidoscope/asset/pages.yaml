  md: '# CHAPTER 2 Multiprocessor Architecture


    Loosely coupled MP systems are difficult to tune when a process on one computer
    communicates with a process on another computer, it is likely to be sending or
    receiving a packet containing control information and data. Control information
    needs to be examined and data needs to be processed. The ratio of the size of
    the information packet one process sends to another is a primary measure of efficiency
    in such systems. If the chosen packet size is too small, many packets may have
    to be sent to complete a transfer; if the packet size is too large, the receiving
    process might spend too much of its idle time, waiting for another packet to process.
    When the packet is tuned to just the right size, according to relative process
    and bus speeds, the next packet arrives as fast as the previous one is finished
    processed—just in time. The trouble is true, the correct packet size can vary
    from application to application and may vary from one point in the same application
    to another—a function of processor or network loading. This nontrivial problem
    is subject of ongoing research.


    Tightly coupled MPs are very efficient because the time to transfer an instruction
    to be executed or for data to be processed is small for all its CPUs; they share
    the same memory. loosely coupled MPs have a memory bottleneck by design: their
    CPUs spend a lot of time sending messages to one another over a slow communication
    network medium. Although switched gigabit ethernet replaces all but the fastest
    back plane interconnections, it''s still slow when compared to direct memory access
    speeds. Successfully loosely coupled MP systems have their software tuned to the
    needs of a specific application.


    In general, MP systems that have central memory shared among its processors perform
    better than those built from many independent nodes computers each with its own
    physical memory. The central memory MP system is far more expensive, however,
    and a network of computers can compete, performance, if it is carefully tuned
    to the application for which it is designed.


    Remember, that when a CPU fails inside a tightly coupled MP, the whole system
    is sent back to the manufacturer. When one of your network''s PCs fails, only
    one needs to be repaired or replaced. The system is still there, minus just one
    PC. Such a benefit can far outweigh the technical challenges faced by the cluster
    architect.


    You will design, and tune a loosely coupled MP in the course of this book. Evidence
    supports that the 8-to-16-node loosely coupled MP can provide the same or better
    performance as a tightly coupled MP costing 10 times as much. (See the description
    of NASA''s Beowulf Project at www.beowulf.org.) The deciding factor, however,
    is that designing, building, and tuning a loosely coupled MP is within our grasp;
    a tightly coupled MP may not be. Consider too, that you can buy the necessary
    individual processors at a very reasonable price in today''s salvage market.'
