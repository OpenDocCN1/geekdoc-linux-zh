  md: '# CHAPTER 7 The Master-Slave Interface Software Architecture


    So far, you have seen three different approaches to process software architecture.
    These were each tested over 10BASE-2 (thinnet) network, between a beefed-up 486-base-machine,
    and an older 386. You sent streams of twenty packets, randomly querying a 99-line
    file. The reliable inter-arrival times were 8, 7, and 4 milliseconds on Listings
    7.2, 7.3, and 7.4, respectively. A lot of overhead occurs in creating a subtask
    to process every incoming query, as shown by the less-stellar improvement from
    adding that to a serial server. The big return came, from moving the head into
    the process initialization phase, by establishing a fixed number of processes
    up front, and hoping the incoming queries don''t swamp them. You might be able
    to improve this server''s performance even further by finding an optimal number
    of preestablished subtasks for your processor and network speed and available
    memory.


    Note that an interrupt handler is added to Listing 7.4 so that you can use Ctrl+C
    to exit the server during testing. When keystroke is detected, the subtasks and
    the parent exit gracefully.


    # The Distributed Server Process


    Notice that the inter-process communication between the master process and its
    slave subtasks in Listing 7.4 is through a shared memory space (see Figure 7.1a).
    Low-overhead communication link is possible because the master and all its slaves
    are on the same machine, running in the same physical memory. (A memory bus transfers
    data much faster than an external network). The benefit of parallel processing
    is limited, however, because this single machine has only one CPU. If you spread
    the slaves across your cluster, as in Figure 7.1b, you can gain in parallelism
    through the simultaneous use of multiple processors. Performance will improve
    if process querying required high CPU. Performance will suffer, however, because
    of the added cost of interprocess communication across the network.


    The client will accesse the server (the master process, in this case) the same
    way as it did in the earlier examples:


    +   > Listing.7.2  gamma      0.25


    The server''s master will create its subtasks in advance, as the server did in
    Listing 7.4. It can do so by treating its slaves as second-tier servers, as shown
    in Figure 7.1b. The master process must establish communication with each slave
    process, and it should be aware of other machines on the network in advance. Instead
    of accessing a list of these other processors, you can generalize this process
    by having the master process issue a broadcast message to all possible slave ports.'
