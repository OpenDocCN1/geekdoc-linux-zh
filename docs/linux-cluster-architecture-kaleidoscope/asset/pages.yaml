    # # Summary


    In this chapter, four salvage PCs were purchased, Linux was loaded on each of
    them, and they were interconnected with a 10Mbps hub. Only one of the PCs has
    a monitor, keyboard, and mouse attached. It will become the network file server.


    The ease with multiple computer systems can be networked under the Linux operating
    system will become apparent when you create a user work area in the file system.
    This single user can log in to any machine on the network and use the same home
    directory. All its files look the same from any machine because they are the same
    files, made available through the NFS service. You will discover file service
    in the next chapter.'
