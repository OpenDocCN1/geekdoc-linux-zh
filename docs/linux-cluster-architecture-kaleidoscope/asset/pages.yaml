- img_proc: true
  md: '# Internal Performance Measurement and Timing


    # IN THIS CHAPTER


    +   * Profiling Software Execution

    * Distributed System Execution Profiling

    * Event Timing Techniques

    * Execution Phase Timing Plots

    * System Performance Improvements

    * Final MSI Performance Results

    * Further Reading


    Why measure the internal performance of a cluster server? You learned how to measure
    external performance in Chapter 8, “External Performance Measurement and Analysis.”
    If you are unhappy with your external performance results and want to know where
    the server spends its time as it processes each incoming query. In this chapter,
    you will divide query processing into phases, measure the time each phase takes
    to complete, and present the average phase completion times in a bar graph for
    analysis. An example of such a graph, called a phase execution profile, is shown
    in Figure 9.1. Each bar represents a single phase of execution in order of execution,
    from left to right. The height of each bar represents the average execution time
    for that phase.


    Some phases may be more complex than others and will correspondingly longer to
    complete. Having designed the processing architecture, you would have a good feel
    for how long one phase takes compared to others. Sending data over the network
    will take much longer than transferring it across the internal data bus. Generally
    speaking, TCP/IP links have a greater overhead and take longer to transfer than
    UDP/IP links. Some rules exist, but don’t be surprised if you guess wrong which
    phases are longer.


    If two or more phases are thought to take equal amounts of time but not do, look
    for time-saving improvements in the ones with the unexpectedly long execution
    times. Finally, rerun the internal performance analysis to see whether the changes
    you made caused any performance improvements.'
  merge: -1
