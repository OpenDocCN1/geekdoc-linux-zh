    # Further Explorations


    The hardware for your cluster—the PCs, the monitor and keyboard, the network hub
    and cabling—are generic. You can use this same hardware to develop any kind of
    multicluster system. Most of the OS configuration you made to whatever Linux distribution
    and version you run are. The software for the MSI, however, is specific to this
    tool, which highlights an earlier point about how the software defines the “personality”
    of a cluster system. This chapter is about some other kinds of cluster systems
    you might want to design and build now that you''re an experienced architect.
    Get ready to broaden your horizons, to face bigger.


    The MSI is a distributed transaction server system. It receives a query, processes
    in parallel with other queries, and sends the response back to an external client.
    It initializes at startup and runs forever. After all distributed applications
    work like this.


    As an application''s requirements increase, so does its complexity. The amount
    of effort necessary to upgrade a complex application becomes cost prohibitive
    for two reasons. First, the amount of work necessary to support a new feature
    can require additional infrastructure to support it. Second, the complexity of
    a distributed system''s infrastructure software can make it brittle, more prone
    to failure because of the increased complexity.


    The classic solution to these infrastructure-related problems was to encapsulate
    the infrastructure software in a package—a function library that the application
    program can use to reduce the cost of development and enhancement. Two of the
    more popular packages can be downloaded for free from the Internet. The PVM (parallel
    virtual machine) and the MPI (message passing interface) package download sites
    are referenced in the “Further Reading” section at the end of this chapter.'
