    # Summary


    Chapter 9 begins by introducing execution profiling, a common performance measurement
    technique. Profilers have gotten cheaper and more sophisticated over the years,
    but they are still not well suited to distributed systems analysis.


    Direct measurement is perhaps the most demanding performance measurement technique,
    but it lends itself well to a distributed environment. In the case of a cluster
    server, query processing can be broken into discrete executions. Execution times
    for each phase either be measured directly or estimated from a higher-level direct
    measurement. The results, plotted on a time-ordered bar chart, are used to analyze
    the internal system performance. When execution times are seen to be unexpectedly
    long, the source code associated with that phase can be optimized for speed. When
    all the suspect phases are examined and their code optimized, another run produces
    a subsequent bar chart, which can be compared to the earlier baseline and examined
    for any performance improvement.


    Finally, the overall (external) system performance is measured and compared to
    earlier results. The goal is, always, client satisfaction, and clients are most
    satisfied when response times are low.'
