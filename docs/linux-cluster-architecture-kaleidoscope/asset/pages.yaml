    # Messaging: UDP Versus TCP


    Signals used to send basic information from one process to another, assuming you
    already had or knew how to obtain the target process ID. What if the information
    you want to send is more complex—a database query, for example? A general way
    to send information is called interprocess communication, or IPC, or often just
    messaging. Two popular messaging protocols exist, and they mimic how we communicate
    as humans. They are called datagram protocol, or UDP, and transmission control
    protocol, or TCP. Collectively, they are referred to as socket programming; you
    can find more information listed in the “Further Reading” at the end of this chapter.


    Both protocols require a message sending and receiving address, called the name
    of the socket. Remember that a signal was associated with a process, so PID was
    a sufficient target address. However, the same socket name can be used by a process
    that one that terminates and restarts with a new PID, the PID can be misleading.
    Finally, the OS picks the PID, but a socket name must be predictable if one machine
    is to send a message to its colleague on another. The well-known socket name solves
    all these problems nicely.


    # IPC with UDP


    UDP takes the concept of a signal to a higher level. When one process sends a
    signal to another, it has no feedback and no indication that the signal was received,
    or if it was received, it was handled, and so on. UDP is a one-way messaging protocol
    that can be used for simplex transmission, in which one process sends information
    to another without regard or concern for reply. This is how humans might send
    a postcard home while on vacation.


    It can be used for half-duplex transmission, too, in which one process sends a
    request for information to another, and that process responds accordingly. Half-duplex
    communication is more complex, involving allowances for lost requests and lost
    or duplicate responses, similar to how publishers send magazine subscribers a
    request for renewal.


    Allowance for error conditions, also called fault tolerance—was anticipated and
    included in a more sophisticated, connection-oriented protocol—TCP. UDP is said
    to'
