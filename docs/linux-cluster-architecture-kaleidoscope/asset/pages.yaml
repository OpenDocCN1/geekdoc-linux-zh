  md: '# CHAPTER 5 Configuring the Relevant Operating System Files


    Each line entry in the password file contains several fields, each field separated
    by a colon (:) for readability. In Unix systems, readability usually implies machine
    read-ability, and it can sometimes present a challenge to humans. You can edit
    this file, for root, and rewrite the contents of the field:


    ```

    root::0:0:root:/bin/bash

    chief::500:500:Chief User:/home/chief:/bin/csh

    ```


    Note that :: represents an entry, or null, field in the entry. Passwords are no
    longer required for the root user or your personal user ID. Do not do this unless
    you implicitly trust others who may have access to these systems! You will have
    to make these changes in the /etc/passwd file on each of your nodes.


    # NOTE


    You may find that later releases of Linux have changed the significance of, or
    may have even replaced, the password file. There are other ways to eliminate the
    necessity of typing in a password in those cases. Refer to the Linux documentation
    included with your installation package.


