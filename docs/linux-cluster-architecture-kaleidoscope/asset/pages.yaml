- img_proc: true
  md: '# CHAPTER 11 Further Explorations


    evaluating each in terms of its long-term ramifications can take a tremendous
    amount of execution power. Because each sub-branch is independent of the others,
    however, a parallel computing architecture can reduce the overall space search
    time by having each processor working on a separate branch until the space is
    solved. Clever ways exist to reduce the number of branches, called "tree pruning"
    algorithms. See the "Further Reading" section for a reference to one of the best
    on AI.


    Engineering problems, the design of the heat radiating fin structure on a modern
    high-speed processor chip, for example, might use finite element analysis to judge
    the effectiveness of a fin structure. Instead of looking the fins as a solid piece
    of metal, it might be being constructed of tiny volumes of metal called finite
    elements. A thin layer of elements makes the face that is in contact with the
    top of the chip. The chip absorbs heat, this face absorbs heat from them, and
    so on, until the outer layer of elements above the face absorbs heat from them,
    and they transfer heat to the surrounding (perhaps moving) air. The tinier the
    elements are, the longer the analysis takes, but the model reflects reality. Simulated
    chip processing requirements cause the simulation to catch the temperature of
    the chip''s surface, which causes the heat to transfer throughout every one of
    the elements in the fin structure and finally into the air. The amount of heat
    that a particular element can absorb is a function of how hot it is and how hot
    its surrounding elements are. An ideal fin structure has fins that transfer heat
    to the air so that the elements cool quickly, absorbing heat from the next layer
    down; then they can absorb heat, and so on, right down to the face layer, so that
    the chip doesn''t melt while you''re working on some programming of your.


    Software simulations can compress billions of years of geological time into a
    few seconds or nanoseconds at the beginning of time (the Big Bang) into several
    minutes that geologists and astrophysists can study the behavior of phenomena
    of interest in a reasonable amount of real-time. Software simulations can derive
    great benefit from distributed simulation, and this is a very hot research topic.


    Each of these kinds of applications, and the list is not exhaustive, has its inherent
    parallelism that can be exploited by a parallel processor. Parallel compilers
    can detect such parallelism by analyzing your source code. (This process itself
    is a candidate for a supercomputer!) These compilers are very expensive, however,
    and alternatives exist. The scientific application developer is perhaps the best
    person to determine where parallelism exists in the process. He or she can break
    these sections into blocks of code that work on subsections of the problem and
    arrange them into a scheduling tree, as shown in Figures 11.1a and 11.1b.'
