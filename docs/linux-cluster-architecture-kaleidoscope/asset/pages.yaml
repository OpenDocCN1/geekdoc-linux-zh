  md: '# Linux Cluster Computer Fundamentals


    This book is about cluster computers. It explains what they are, how they can
    be used, what kind of hardware is needed to build one, and what kind of software
    architectures bring the best out in them.


    Clusters are a hot topic. What is unique about them is the personality of their
    architecture—how they appear to behave to their users—is so dependent on their
    software. The same collection of computers interconnected via some network can
    become a supercomputer, a fault-tolerant server, or something completely different—something
    design!


    These architectural varieties are all a part of distributed computing, a network
    of individual computers working together at solving a problem or providing a service.
    A cluster computer is a distributed system; this concept will become more familiar
    in the future as the world''s problems become more geographically dispersed. Examples
    include international financial transactions, global weather forecasting, and
    rapid military deployment. The farthest reaches of the world are getting closer
    through the proliferation of distributed computer and communication systems. Exposure
    to their underlying principles might help you get a better job some day or move
    up the ranks in one you already have.


    # Why a Cluster?


    Let''s begin our journey with a couple of loose definitions. First, just what
    is a cluster computer? A cluster computer is a set of individual computers that
    are connected through specialized hardware and software, presenting a single-system
    image to its users.


    # IN THIS CHAPTER


    +   * Why a Cluster?


    +   * Architectural Design Features


    +   * Cluster Applications


    +   * The Sample System: The Master-Slave Interface


    +   * Reader Skills and OS Information


    +   * The Remainder of This Book


    +   * Further Reading'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# CHAPTER 1 Linux Cluster Computer Fundamentals


    What is a cluster computer? A bunch of PCs connected on a network does not qualify
    as a cluster computer. To be a cluster computer, each of these PCs must be running
    software that takes advantage of the fact that other PCs are available. They must
    be made to act like a team, working together and supporting one another toward
    a common goal, presenting a single-system image to their users.


    What is a single-system image? A single-system image is one that is indistinguishable
    from that of a single computer. Its users are unaware that more than one computer
    exists.


    Consider the PC on your desk connected to some distant Web over the Internet.
    With each click of your mouse, you are downloading Web page''s text and image
    file data into your browser for display. The Web server could be dozens of PCs
    in a network—a cluster server. Each time your browser asks for data, its request
    packet be broken up and passed along to several of the other computers, which
    read the files from disk and send back to your browser. You are unlikely to be
    aware that these computers were working together to serve your requests. Such
    a cluster server presents a single-system image to your browser, to the client,
    and to you, the user.


    Why bother? Why not just start with a single high-speed server and replace it
    with a faster one each time your client resource grows? The answers to these questions
    encompass some complex issues that are the subject of today''s computer science
    research: cost-effectiveness, scalability, high availability, and fault tolerance.
    You''ll learn more about these issues later in the chapter.


    Computer science born the concept of a stepwise process leads to a desired goal.
    It showed that any process toward a desired goal can be broken down into a set
    of steps, and that each step can be broken down into smaller steps, and so on.
    If all the achievements to date and all the motivations to continue to drive computer
    science research could be condensed into a single word, that word might overlap.


    Overlap refers to the capability to perform two or more functions simultaneously.
    Early computers were required to stop all their other processing just to print
    a line of characters. In contrast, modern computers routinely execute instructions
    without redrawing a screen image, reading from or writing to the hard drive, printing,
    and so on. Exploiting even the smallest potential for overlap can yield a tremendous
    improvement in performance.


    A cluster computer is a type of parallel processor called a multiprocessing to
    distinguish from a true multiprocessor, which has a single physical memory that
    is shared among its processors. Later chapters discuss different kinds of parallel
    processors. For now, let''s look toward exploiting overlap at the task execution
    level. You can do this in a cluster by finding tasks or portions of tasks that
    can be executed in'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'parallel and scheduling these chunks on different processors in your cluster.
    As each chunk results are returned to the scheduling processor. Individual results
    are combined into what serial processing of these chunks might produce. This combined
    result is fed into the next high-level step, and so on, until the task''s processing
    is complete.


    Examining the interdependencies among the steps of any process, you can see that
    some steps must be executed in strict sequence, the outcome of one feeding the
    requirements of another. Other steps are independent of one another and may be
    executed in parallel, allowing you to exploit any parallelism inherent in process.
    The benefit of executing steps in parallel is a shorter process-completion time.
    The cost is in the extra resources required to perform this parallel execution
    and the time required to schedule their parallel execution. Cluster computing
    is one kind of parallelism. You''ll see other forms in later chapters.


    Gene Amdahl put the benefits of parallel processing in perspective in the 1960s.
    He pointed out that all of the time spent by a parallel processor executing your
    application, it is only in part of it where parallelism occurs, that any time
    can be saved, and any time savings will be in proportion to the amount of inherent
    parallelism, minus the overhead in managing parallel processes. This concept later
    to be known as Amdahl''s Law.


    If the inherent parallelism in your application is so small that most of the steps
    have to execute sequentially, you probably do not want to consider using a parallel
    architecture. There are enough common processes with inherent parallelism, however,
    to generate a lot of interest in parallel processors. The cluster architecture,
    in particular, gives you the benefits of a scalable parallel processor at a very
    low cost and a potential for high availability through software fault tolerance.


    # Architectural Design Features


    Cost-effectiveness, in terms of performance and reliability, is the single most
    important design. The goal is to assemble several individual computers and sacrifice
    resources in managing them as a cluster system. This should result in a higher
    level of performance and reliability than what you can get from a single computer
    in the same price range.


    Scalability, high availability, and fault tolerance are the three features necessary
    to achieve high performance and reliability. If the support software overhead
    for any of these is too high, the cluster may not extend beyond a trivial number
    of nodes, or may fail to sustain a modest query load. The following sections look
    at each of these features.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Scalability


    As you add more node computers to the cluster, the number of simultaneous users
    can service should increase proportionally. Reality, however, shows that the performance
    is limited to some upper number of individual computers because of the overhead
    of interprocessor (computer-to-computer) communication. As the number of individual
    computers increases, the performance improves up to a point and then drops off;
    this is the point of diminishing returns.


    Much of computer science research on scalability is focused on moving that point
    further and further out, providing a corresponding increase in performance over
    a greater range as more node computers are added to the cluster. You learn how
    to determine the exact value of that point for your cluster in Chapter 8, “External
    Performance Measurement/Analysis.” Performance measurement is an iterative process,
    which means that you will take a baseline measurement, tweak your system, and
    then measure again to see what effect your efforts had on scalability.


    # High Availability


    In a single-computer server implementation, a hardware failure can bring all its
    services to an unpleasant halt. In cluster server implementation, such a loss
    can mean that one or more computers go down, suffering only a degraded performance
    level proportional to that loss. The advantage is that you have several other
    computers are still running, which are able to keep your critical applications
    running. You are not down completely, as in the single-server architecture.


    Exactly how one computer in a cluster senses the failure of another, how it chooses
    another to assume the responsibilities and the resources of the failing system,
    and exactly how this can be handled seamlessly with the least impact to the user
    is the subject of much research. This is the concept of a highly available server.


    # Fault Tolerance


    A system becomes fault tolerant when individual computer systems in a cluster
    begin to share the responsibility of running many processes. Some processes are
    dependent on others; some are totally independent. Either a local monitoring process
    or perhaps some feature of the operating system detects the failure of a process
    and restarts it, either from its initial state or from its most recent checkpoint.
    A global monitor may try to balance the resource load on each computer by stopping
    a process on one system and restarting it on another. Cluster-management software
    can grow very complex, commanding resources that would ordinarily be used by the
    mainline service processes. The trade-off is between the reliability and the capacity
    of the server’s primary function.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Feature Interdependence


    The astute reader will notice that all these features are, to a great extent,
    interdependent. The reason that the performance of a high-availability system
    degrades beyond the extent of its loss, for example, has a lot to do with scalability.
    A considerable amount of overhead is needed to monitor for an internal failure,
    let alone determining and reassign resources and responsibilities to some other
    system in the cluster. In league with all these evils is the ever-present threat
    of failure of a monitoring process corrective actions are being negotiated—a potential
    cause of recovery operations! Also, there is a trade-off when applying the cluster’s
    resources to managing the soundness of the cluster, rather than toward its primary
    goal of serving the user.


    # Cluster Applications


    Keep in mind that you install Linux onto a bunch of PCs and configure them into
    a network, you have a network of PCs running Linux—nothing more. To achieve cluster
    status, the PCs must work as a team. You must either make changes to the operating
    system, which is beyond the scope of this book, or design cluster-aware application,
    which is exactly what you''ll do.


    Cluster computing applications generally fall into two broad categories: supercomputing
    and transaction processing.


    # Supercomputers


    Supercomputers execute complex numerical algorithms in parallel to solve equations.
    Solutions might generate a graphical projection of weather data patterns, such
    as software simulations predicting what the weather might tomorrow. Supercomputers
    require special programming skills in numerical methods. You must know how to
    solve a complex equation by a digital approximation algorithm, how to validate
    that algorithm, and how to detect and exploit any parallelism in it.


    Supercomputing applications on cluster architectures are historically successful
    because a large number of computers will outperform a single processor of equivalent
    cost, for example, making a cluster computer the optimal choice. NASA''s Beowulf
    Project, which was assembled from 1994 with high-end PCs and specialized communication
    gear for one-tenth the cost of a single computer of equivalent power. (See the
    section titled “Further Reading” later in this chapter.) Later researchers expanded
    the number of nodes and worked out the resulting bottlenecks, pushing the point
    of diminishing returns higher and higher.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# CHAPTER 1 Linux Cluster Computer Fundamentals


    Scalability is less important to a supercomputer when the inherent parallelism
    in an application is limited. Parallelism is usually exploited by scheduling blocks
    of identical sets of instructions on several nodes, with each block operating
    on a different subset of the data. If the maximum number of blocks exceeds soient,
    the system architect not bother extending the point of diminishing returns beyond
    that. Similarly, if the optimum number of available nodes in the system exceeds
    the maximum number of blocks, the system has a built-in margin of fault tolerance
    and high availability.


    # Transaction Processors


    The word *transaction* is used here in the general sense to include database queries,
    financial instructions, and the familiar Web browser requests for file and image
    data. In this realm, you can exploit parallelism at the transaction level to perform
    performance improvement, in contrast to careful examination of parallelism inherent
    in some complex numerical algorithm, assuming that each transaction is independent
    of all the others. The transaction contains the block of action codes and data
    to be processed.


    When you direct your browser to a complex Web page, you may have to download a
    dozen images and text files before the page is completely displayed on your screen.
    These requests are often independent of one another and can be read disk simultaneously
    by each server node, which sends its data to your browser. Your request for a
    page resulted in a list of requests to be processed in parallel. Alternatively,
    a cluster server might support your browser along with many others, on the same
    Web page.


    Scalability, fault tolerance, and high availability in the case of an ATM (automatic
    teller machine), for example, translate into customer satisfaction. Imagine that
    every one of your bank''s branches has an ATM installed inside and out. A few
    months later, the bank signs a contract with a local supermarket chain, tripling
    the number of its ATMs in the city. If every transaction on machines is sent to
    a central server that was operating at near capacity before the contract, a faster
    system is in order. Adding nodes to a cluster seems inherently less risky than
    replacing the single working machine.


    # The Sample System: The Master-Slave Interface


    The focus of this book is to help you design, build, and tune a cluster computer.
    In Chapter 7, "The Master-Slave Interface Architecture," you will see a simple
    server undergo design changes that morph it into the final design. A master process,
    which may be started on any of the cluster''s nodes, starts slave processes on
    each of the other nodes. These slaves contact the master, which establishes a
    set of subtasks'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# The Remainder of This Book


    that are dedicated to communicating with each of the slaves. The master accepts
    incoming queries from the clients. It passes the query to an available subtask,
    which sends it to a remote node''s slave for processing. This is how parallelism
    is exploited in the master-slave interface.


    You will discover several ways to measure the performance of the sample system,
    examine some possible results, and learn how to detect and surmount bottlenecks.
    Your personal version will likely present different technical challenges, but
    the techniques and the concepts you''ll learn will possibly help you tune it.


