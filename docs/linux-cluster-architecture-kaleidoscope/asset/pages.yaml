  md: '# Remote Access Security


    The simple cluster system in this book is assumed to enjoy full physical access
    security. That is, you and your trusted associates are the ones who will be allowed
    to get near to any of the nodes to log in them, and no node is accessible from
    any network outside this physical perimeter. Configuration gets a lot more complicated
    if you want to keep anyone out! The focus of this book is to help you get your
    cluster up running. If you allow public access to it—through the Internet, you
    will have to make changes to tighten up the security. Here, we are interested
    in loosening security to make remote access easy on ourselves, to save time.


    After you are logged in alpha, you can access a remote machine through the telnet
    command:


    +   > telnet beta


    This command presents a login prompt to you, asking for a user ID and password,
    like the process you followed when logged in to alpha. It will log you in the
    remote machine named beta. This assumes, of course, that the user ID and password
    you use the account you established during the Linux installation process on beta.


    Similarly, you can issue the rlogin (remote login) command, and it will assume
    that you want to log in with your current user ID, asking only for your password:


    +   > rlogin beta


    The login command will do the same as telnet, but it can assume your current user
    ID to save you even more time.


    The rsh (remote shell) command is the same as rlogin, but it is shorter and faster
    to type:


    +   > rsh delta


    It will log you to the remote machine named delta, just as the rlogin command
    does. This is the fastest and easiest way to remotely log in to a machine, but
    it gets even faster if you don''t have to supply your password. Remember: you
    are not creating a secure system here!


    # Optional Addition of a /home/chief/.rhosts File


    Even on a physically secure system, OS software security checks can prevent you
    from simply logging in to a remote system—even one that is right next to you.
    To'
