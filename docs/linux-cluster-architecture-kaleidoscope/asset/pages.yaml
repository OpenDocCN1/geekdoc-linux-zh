    Robust software is software that keeps running correctly in spite of error detected.
    Things can go wrong during the execution of the examples presented in earlier
    chapters. In this chapter, you will learn what kinds of errors are likely to occur
    in the MSI and what you can add to your software to prevent its failure in the
    presence of such errors.


    If you''ve worked through the text far and followed along with your own cluster
    development, you have probably discovered how unpredictable distributed software
    systems can be. The master process, for example, an interrupt handler that catches
    a Ctrl+C keystroke. On receipt, the parent sets flags for each of its subtasks,
    telling them to exit gracefully. They send a datagram to each of their slave counterparts,
    telling them to exit gracefully, before cleaning up and exiting themselves. The
    parent waits for each subtask to exit before removing the shared memory area and
    exiting.


    This is a good design, yet there are times when the processes terminate in a manner
    that is less graceful, or not graceful at all.


    Most of the time, even after several streams of packets, a Ctrl+C keystroke produces
    the expected result: the master, all its subtasks, and all the remote slave processes
    terminate normally. A look at each node


    ```

    > ps aux

    ```


    shows all these processes terminated. A look at shared memory areas via


    ```

    > ipcs -m

    ```


    shows that both the client and the master removed their areas before exiting.
    Every so often, however, you will find'
