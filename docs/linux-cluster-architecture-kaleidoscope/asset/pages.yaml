  md: 'All your C programs and header files should be under the /tmp directory. Many
    people do not take the time to actually try to restore their files from a backup
    medium. It is a good idea to make sure that backup and restore procedures both
    work to your satisfaction before placing your confidence in them. It''s your time
    being saved.


    Another backup and restore disk process uses the tar (archive) command. You do
    not need to use a command to mount the disk in this case, but you still have to
    be root to write to that device. (And you must, of course, put the disk into the
    drive!)


    ```

    ```

    cd /home/chief

    tar -zcvf /dev/fd0 [Note the final dot]

    ```

    ```


    This copies everything chief''s home directory, in compressed archive file format,
    onto the disk. You can restore the data as follows:


    ```

    ```

    cd /tmp

    tar -xvf /dev/fd0

    ```

    ```


    You can check the contents of such a disk with yet another minor difference in
    operands.


    The differences in the operations of these commands are so subtle that you can
    easily destroy the contents of an existing archive disk by specifying c instead
    of x on the command line. Remember, c is for create, x is for extract, and t is
    for me to tell what''s in it.


