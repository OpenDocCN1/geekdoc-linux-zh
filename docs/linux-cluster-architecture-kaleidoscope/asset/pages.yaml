  md: "# APPENDIX A The Source Code\n\nThe monitor process runs on a noncluster node,\
    \ named omega in our examples. It receives info from each of the perform tasks\
    \ running on the cluster nodes, displaying overall system performance information\
    \ for quick visual reference. See Chapter 8 for further details. Following is\
    \ the line command to start the monitor task:\n\n> monitor\n\nNote that there\
    \ are no line command operands. Also note that you may start and stop this task\
    \ at your convenience any UDP packets sent to while it is running will be discarded.\n\
    \n# LISTING A.6 The Centralized Performance-Monitoring Process\n\n```\n#include\
    \ <netinet/inet.h>\n#include <sys/socket.h>\n#include <string.h>\n#include <stdio.h>\n\
    #include <netdb.h>\n#include \"cpm.h\"\n\nmain(void)\n{\n    /*\n     ** monitor.c\
    \ - Centralized Performance Monitoring\n     */\n    int cp[4], rm[4]; /* central\
    \ processor, real memory */\n    int ps[4], pr[4]; /* packets sent, packets received\
    \ */\n    int dr[4], dw[4]; /* disk reads, disk writes */\n    union {\n     \
    \   unsigned long addr;\n        char bytes[4];\n    } u;\n    struct sockaddr_in\
    \ in_soc;\n    struct cprStats stats;\n    int len=sizeof(soc);\n    struct hostent\
