  md: "# CHAPTER 9 Internal Performance Measurement and Timing\n\nOne solution is\
    \ to access the file as if it were direct access, but that runs counter to the\
    \ simplicity of the example.\n\nAnother solution is to maintain a cache, a local\
    \ pool of earlier requests and their responses. If a duplicate request arrives,\
    \ the master substack can look up the response in its cache entry and respond\
    \ immediately, saving a tremendous amount of time by avoiding the use of its remote\
    \ process entirely. Typical test streams contain fewer packets than there are\
    \ queries, however, the probability of a duplicate will arrive is small. We can\
    \ certainly change this ratio, but this solution also seems to be overkill for\
    \ such a simple server.\n\nHere is a compromise solution that is simple, yet shows\
    \ the promise of dramatic performance improvement. Originally, every time a query\
    \ arrives, the slave opens, reads up to the requested line, and then closes the\
    \ file until next time. Given that the requested line numbers are random, the\
    \ probability that the next line number will be higher than the previous one is\
    \ approximately 50%.\n\nIf the file was already open when the next query arrives,\
    \ it would have to be closed and reopened in half—where the requested line was\
    \ lower than the one most recently retrieved. Also, cases where the requested\
    \ line is higher than the previous one, all the lines prior to the one requested\
    \ need be read. Following is the performance improvement solution for phase 5:\n\
    \n```\n/*\n** Extract the requested line of text\n*/\nif(line > curr) /* false\
    \ first time *\n{\n    line = curr; /* adjust to offset *\n    curr += line; /*\
    \ save for next time *\n}\nelse\n{\n    fclose(fp); /* ignored first time *\n\
    \    fp = fopen(file, \"r\");\n    curr = line; /* save for next time *\n}\nwhile(line--)\n\
    \    fgets(packet.buffer, sizeof(packet.buffer), fp);\n```\n\nIn phase 8, the\
    \ master's substack responds to the query and declares itself idle.\n\n```\n/*\
    \ result back to client */\nstrcpy(buf, packet.buffer);\nsend(cli, buf, strlen(buf)+1,\
    \ 0);\nclose(cli);\n```\n\n```\n/* check for exit request before continuing */\n\
    ```"
