  md: 'beacon was picked up by your system, or perhaps its system picked up yours.
    In any event, your two systems became aware of each other''s relative position
    and speed.


    When the car went by you and drifted into your lane, the car''s system sensed
    the change in relative position, turned on the tone to warn your driver, and sent
    a message to your car, which also sounded a tone to warn you. When you touched
    your brakes, your system knew there no cars behind you and did not send a message.
    When you drifted left, it knew this was not a problem and remained silent.


    You still saw the other car''s turn signal. If the driver forgot to turn it on,
    the system, sensing the drift, would have done so. When you touched the brakes,
    your brake lights came on, and when you left, your turn signal came on, just in
    case there was an other vehicle back without this kind of gear. This scenario
    was intended as an example of a peer-to-peer network. If you can see how each
