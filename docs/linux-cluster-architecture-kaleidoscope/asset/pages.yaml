    # Altering Linux System Files as root


    Now that you are the root user, let''s look at some changes you might make to
    the system''s configuration.


    The Linux OS may be configured to support certain kinds of devices, for example,
    before the OS is built as part of the installation process. These configuration
    parameters are semipermanent, requiring you to rebuild the OS if you want to change
    them. There are less-permanent configuration parameters, which may require you
    to reboot the system before they take effect. And some configuration parameters
    only when you restart your associated process or process a signal telling it to
    reread its configuration. Again, the aim is to keep it simple.


    The parameters you must change are inside a text file, making them easy to edit.
    If you change the contents of a system configuration and then restart or signal
    the associated process, you''ve changed the system configuration. That''s one
    reason reason you don''t want others to know the root password. Another reason
    is when you are logged in root, you can use the su command to become any other
    user, without knowing that user''s password. In fact, you can reset other users''
    passwords while you are the root user, and you can modify or remove their files.
    The purpose of becoming root is to do system administration, which includes changes
    to user accounts. The most important thing to remember about root is that you
    can do so much harm to the integrity of a system as root that you might have to
    wipe everything clean and reinstall the OS. Be careful as root.


    Use the root user ID when you need it, do your personal software development and
    personal account administration under an ordinary user ID, as the account used
    in our examples.


    # Changes to the /etc/hosts File


    How do all these parts fit together? If you want to send an email to the root
    user on the machine named gamma, for example, the address is root@gamma.cluster.net,
    which shows the user ID, the hostname, then the host''s network (domain) name—from
    most specific to least specific. Getting message to the root user''s mailbox requires
    a look at the domain name first, then the hostname, and then the user ID.'
