  md: '# CHAPTER 6 Configuring a User Environment for Software Development


    ![](img/e3b03565d41f4709ef69644849feddb3_102_0.png)


    FIGURE 6.1 Linux file system overview.


    Following are some of the directory names discussed in this book, followed by
    a description of what you might find under them. You should recognize some of
    them as the locations of files discussed in the previous chapter.


    +   * /bin—Executables composing the basic Unix command set

    * /dev—Devices accessed through these file-like I/O ports

    * /etc—System configuration files

    * /home—Home directories for (nonroot) system users

    * /mnt—Mount points for removable file systems: floppy disk, CD-ROM, and so on

    * /proc—Process information pseudo files, discussed in Chapter 8, “External Performance
    Measurement and Analysis"

    * /root—The root user''s home directory

    * /tmp—Temporary files

    * /usr—System and application executables and their associated files

    * /var—Logs, email, and so on'
