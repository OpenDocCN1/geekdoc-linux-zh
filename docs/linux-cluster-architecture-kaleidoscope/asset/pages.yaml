  md: '# CHAPTER 4 Assembling the Hardware for Your Cluster


    ![](img/e3b03565d41f4709ef69644849feddb3_82_0.png)


    FIGURE 4.3 A hub and four networked computers.


    A crossover cable eliminates the hub through crossed wiring; the transmit pin
    of one machine''s network interface is connected to the receive pin of the other.
    (This is similar to the null modem cable approach to RS-232 serial port interfacing
    of two machines in close proximity.) These RJ45 crossover cables work not with
    a hub. If you buy one of these, and it is not already clearly marked as a crossover
    cable, mark it as such. It can save you lot of troubleshooting at some future
    date.


    # Implementing an OS


    Salvage PCs usually come with a reformatted hard drive, wiped clean of its previous
    owner''s email, favorite Web sites, and sensitive documents and data. You must
    supply an operating system if you want these machines to boot. The Linux OS is
    used for all the examples in this book. It is available for free at Internet download
    sites. If you are an expert capable of configuring and building an OS and installing
    it on a remote system, it is really free. For the rest of us, $30 or so for an
    off-the-shelf Linux installation package is worth the price.


    Some installation packages include a boot disk—a 3 1/2-inch disk. Some packages
    provide for one to be created during the installation process. Follow the instructions
    in the installation guide to create a simple system. Remember to include support
    for the C programming compiler and libraries. You may want to include support
    for the X Window System. You certainly want support for a fixed address, local
    area network.


    NOTE


    My first cluster did not include the X Window option because the hard disks were
    too small to support anything beyond a text-based interface. My second cluster
    included X support, making it possible to monitor activity on all the remote systems
    at once. X support isn''t necessary for what you are going to build, but it''s
    nice to have because you can open a separate window for each node on the monitor
    connected to the main node.'
