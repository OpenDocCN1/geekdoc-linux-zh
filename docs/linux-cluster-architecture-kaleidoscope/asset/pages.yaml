    The cluster presented in this book is called a multiprocessor. It gets its name
    from the fact that it is built up from many individual computer systems that are
    interconnected through a communication network. Each of these computers runs processes
    that must communicate with others across the network, working together to present
    the single-system image described in Chapter 1, "Linux Cluster Fundamentals."


    Most multiprocessors can be built only by computer manufacturers. The multicomputer,
    however, is one that you can build from readily available components and some
    custom software. When properly tuned, it can outperform a single computer of equivalent
    power by exploiting overlap, the parallelism inherent in many transaction-processing
