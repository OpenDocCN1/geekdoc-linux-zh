  md: '# Master-Slave-Execution Phase Times


    ![](img/e3b03565d41f4709ef69644849feddb3_166_0.png)


    **FIGURE 9.1** A sample execution phase profile.


    In this chapter, you will see the master-slave interface (MSI) processing broken
    down into execution phases. Source code used to time these phases is presented
    and discussed in some detail. The results of actual timing runs are graphed and
    analyzed. Unexpectedly long phases are investigated, and you will see what was
    done to reduce your execution times. A final set of timing data will help you
    quantify any any performance improvement over the baseline data presented in Chapter
    8.


    # Profiling Software Execution


    Thirty years ago, excessive application execution times (measured in days in extreme
    cases!) were of great concern to scientific data center managers. They measured
    performance by recompiling these programs with a state-of-the-art mainframe profiler.
    The profiler started the program under as a subtask and paused at regular intervals
    to record the address of its next executable instruction. After a short representative
    run, the profiler printed a histogram of memory address ranges, along with the
    number of times the program under test was found to be executing in each of the
    address ranges. An analyst converted each memory address range to a range of Fortran
    languages by hand, with the aid of a linkage editor map. Finally, the programmer
    recoded these sections in a more efficient manner. This effort took days, sometimes
    weeks, but initial efforts provided generous rewards, and computer time was expensive.


    Ten years ago, you could buy a C language program execution profiler for your
    PC for less than $30. It reported execution times at the main and function level
    and, optionally, at the statement level within any one of your functions. You
    could optimize your C code for faster execution time in a matter of hours.'
