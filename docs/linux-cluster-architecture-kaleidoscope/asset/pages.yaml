  pgno: 80
- img_proc: true
  md: '# Network Media and Interfaces


    a lot more sophisticated than what you will need for this project. If your application
    regularly drives network utilization up beyond saturation, a higher-speed network
    is definitely indicated, and a switch might be necessary. 10BASE-T or 100BASE-T
    hub will suit your networking needs.


    It is hard to find 10Mbps hub on computer stores today because everything is moving
    to the 100BASE-T standard and higher. Be sure the number of ports on whichever
    hub you buy exceeds the size of your cluster. You will want an extra machine on
    the same network for performance monitoring, transaction query generation, and
    so on, and you should leave room for cluster expansion. Note that many of the
    “home network” hubs allow stacking. You can plug one hub into another, at the
    cost of only one port on each, minus two. Stacking a four-port and a six-port
    hub gives you an eight-port hub, and so on. It’s cheaper to buy an eight-port
    hub, of course, plan ahead.


    # Network Cabling


    Network cabling comes two ways: in bulk rolls so you can cut it to custom lengths
    and attach your own RJ45 plug with a special pair of crimping pliers, or commercially
    prepared cables with the plugs already connected. Bulk rolls can be a real cost
    saver for installing hundreds of PCs on their networks, but the prepared cables
    at 6-foot lengths have served this author well over the years. If your space is
    tight, you can use the 3-foot lengths, but the price difference may not justify
    the inconvenience if you expand your cluster.


    The ordinary, low-cost gray cables are for simple networks.(They look like larger
    versions of ordinary telephone cords.). There are even cables with special jackets
    that meet building code requirements, should they have to run through air conditioning
    or heating ventilation ducts. Our system is simple; you are not likely to be running
    cables through your air-conditioning ducts, and inexpensive cable should suit
    your needs.


    # Cabling with Crossover Cables


    One more thing about networking cables: If you have only two machines, you can
    avoid the cost of a hub by buying a specially wired cable called a crossover cable.
    The hub, you may recall, connects to each PC through a single cable (see Figure
    4.3). The hub''s job is to retransmit everything it gets in any one cable out
    to every other cable. An ethernet network connects all its machines through the
    same coaxial cable described in Chapter 2, “Multiprocessor Architecture.” When
    one PC sends a packet, it is received simultaneously by all the others. Firmware
    in the network card inspects the destination address and ignores the packet if
    it doesn''t match.'
