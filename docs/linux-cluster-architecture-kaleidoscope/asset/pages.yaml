    # # Summary


    Successful networking goes beyond hardware, requiring the reconfiguration of at
    least a few system files. Each machine on the network needs to know the names
    and addresses of each of the other machines before it can interact with them.
    You configured the primary node, named alpha, the NFS file server. You removed
    the system''s need for password checking for convenience. A network that allows
    a user to log in to any machine from other machine without a password check can
    be a serious security risk, but it makes working with the cluster lot easier.
    Finally, you implemented a remote file access command pair: a remote reference
    command and a file access daemon implemented as an inetd service, described in
    Chapter 3.'
