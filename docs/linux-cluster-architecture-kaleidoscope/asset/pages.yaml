    # Using Semaphores with Shared Data


    The shared data example in Listing 3.4 doesn''t quite illustrate the risk associated
    with shared variables. Consider a similar example in which the parent bank account
    creates two subtasks: one child process responsible for deposits and the other
    for withdrawals, each calculating the new balance as part of its processing. Can
    you see the risk?


    If two transactions arrive at approximately the same time—one a deposit, the other
    withdrawal—a possibility exists, albeit a small, one of them will be nullified.
    In the case in which the withdrawal process gets the balance from shared memory,
    subtracts the withdrawal amount from it, and is interrupted by the deposit process.
    The deposit process picks up the balance from shared memory (the one that the
    withdrawal process still has), adds the deposit, puts the balance back into shared
    memory, and waits for another deposit transaction. The withdrawal process continues
    processing, putting its recalculated balance into shared memory, over the value
    that the deposit process set. The transaction is lost because all the actions
    of the deposit process were nullified by that interrupt.


    The research concept of interest here is the critical section of how you can be
    certain after a process starts its processing by picking up a balance from shared
    memory, it will not be nullifying another transaction when it puts a recalculated
    back? You protect the integrity of shared data by using semaphores.


    What''s a semaphore? First, consider what it not: A semaphore does not stop another
    from modifying shared data, no more than a red traffic light prevents you from
    entering an intersection. We go on green, slow on amber, and stop on agreement.
    This holds true for semaphores, too.


    Each semaphore is associated with a shared resource, not directly, indirectly
    through the source code comments and other documentation. A semaphore is either
    set or not set, and that''s all the operating system cares about. If you try to
    set a semaphore and the OS will set it. If you try to set a semaphore that is
    set, the OS will cause your process to wait until the last process set clears
    it.


    To avoid any difficulties with the bank transaction example, both processes (deposit
    and withdrawal) must set a semaphore prior to getting the balance from shared
    memory and clear it after the recalculated balance is put back (see Listing 3.5).'
