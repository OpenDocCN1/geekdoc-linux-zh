    # Supercomputer Applications


    The MSI is a transaction processor in the Web or database server sense. It receives
    incoming queries and sends a response to some external client. A-time scientific
    application exhibits similar behavior in that it receives acquired or sensed data
    and develops a solution. Most scientific applications present a static solution,
    but some systems require data at regular intervals and display a continuously
    updated solution that changes with the environment.


    For example, a major city, interested in its air quality, installs a dozen or
    more air pollution sensors. Each sensor measures wind speed, direction, temperature,
    humidity, and levels of ozone, carbon monoxide, sulfur dioxide, and other particles
    that contribute to known respiratory health problems. It averages these counts
    over a 10-minute period and transmits the readings to a central computing system.
    This central computer''s job is to receive all the latest data and update its
    real-time data, a false-color image depicting the location, shape, and density
    of each particle. Not too surprisingly, around rush hour, the shape of the carbon
    monoxide pattern resembles a crude map of the highways and arterial streets of
    that city.


    On a larger scale, the National Center for Atmospheric Research (NCAR) has satellites
    that feed sensory data into computers, which generate real-global weather patterns.
    Software simulation data is also used to generate predictions of future weather
    patterns. Hopefully, the software is efficient enough, and the computers are fast
    enough to generate tomorrow''s weather before tomorrow arrives. More information
    can be found at the Universities for Atmospheric Research Web, referenced in the
    “Further Reading” section at the end of this chapter.


    Artificial intelligence (AI) researchers take their games very seriously. IBM
    RS/6000 SP computer, nicknamed Deep Blue, played against Garry Kasparov, a chess
    master, and won. In this kind of application, the current board arrangement is
    the acquired data, and the solution is a single legal move that is judged best
    by looking at its consequences several moves ahead. The software builds an inverted
    tree structure beginning with the current board. Each lower branch represents
    a legal move, and each branch below those represents a possible response from
    the opponent, and so on. This tree structure is called a problem space and the
    number of branches below each move is its depth. Searching for solutions and'
