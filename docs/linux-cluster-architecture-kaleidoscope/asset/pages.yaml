    # The Master-Slave Interface Software Architecture


    This chapter marks a turning point in the book. In earlier chapters, you selected
    the cluster''s hardware, installed and configured its operating system, and learned
    several techniques used to develop cluster software. In this chapter, you focus
    on developing a concurrent server, one that handles incoming queries concurrently.
    It begins as a simple, serialized processing loop and evolves into a master-slave
    configuration, a software architecture that is well suited to your cluster''s
    system.


    Each change to a server''s architecture ought to show improvement over the earlier
    version. This chapter starts by introducing a client that drives the server and
    gives you an indication of overall system performance. You take a much closer
    look at performance measurement and analysis in Chapter 8, "External Performance
    Measurement and Analysis," when you fine-tune the system.


    Each version of the server in this chapter is driven by the same client. Let''s
    take a look at that first.


    # The Client Process


    The client requests a random line of text from a file that is located on the server''s
    disk. It sends a query containing a filename and a line number. The server opens
    the file, retrieves the line of text, and sends it back to the client in its response.


    As simple as this scenario, it involves the acceptance of a client''s socket connection,
    access to a shared resource, and a response back to the client. That''s pretty
    much all'
