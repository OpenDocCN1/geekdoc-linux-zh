    A radio transceiver (transmitter-receiver) is usually connected to its antenna
    over a convenient length of transmission line, often a coaxial cable designed
    to match the transceiver''s output characteristics to the antenna''s, hopefully
    with minimum loss of signal strength. The radio sits in a radio room, but the
    antenna is up high on the roof or even higher on a tower to the radio room. The
    transmission line makes this separation easy. Every node in the original experiment
