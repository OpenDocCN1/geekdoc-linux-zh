    The source listings are intended to be suggestive of how a master process can
    remotely start a set of slave processes with no foreknowledge of how many there
    might be or where they may be located. After the broadcast message is out, the
    registration responses come in, allowing the master process to build a dynamic
    membership list.


    # How the Master-Slave Interface Works


    The master has two phases: initialization and processing handoff. In the initialization
    phase, described previously, the slaves are activated and registered. The result
    is a utility table, with entry for each registered slave process. Each entry contains
    a name, an IP address, and a projected utilization index, or UI. The UI is an
    integer from zero to one hundred: zero idle and 100 saturated. In the processing
    handoff phase, each query is received and passed to the slave process on the least
    busy machine in the utility table.


    Local performance data are gathered at each remote machine by subtasks of the
    slave processes and passed back to the master process inside each acknowledgement
    packet—the receipt of each query. A danger exists in this technique, however.
    If a machine gets busy in relation to all others that it is no longer chosen for
    work, the table may continue to show as busy, although it drops down to idle long.
    If it is never chosen for work, it doesn''t acknowledge receipt, and the master''s
    isn''t updated. The local data gets stale and unreliable, yet decisions are still
    being made on its content.


    One way to circumvent this problem is to have each send regular reports of its
    utilization, the potentially excessively network traffic associated with these
    reports can adversely affect the overall system performance. In another method,
    slaves report only significant changes in utilization, and only when such changes
    occur. A 5% change in the calculated index, for example, might require the slave
    to send an update to the master. Under a highly irregular query load, however,
    the utilizations can also fluctuate to an extent that excessive network traffic.'
