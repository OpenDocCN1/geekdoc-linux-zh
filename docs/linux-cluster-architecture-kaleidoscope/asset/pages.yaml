    # Future Applications


    You are probably familiar with the PDA, or personal digital assistant. You probably
    know that it is becoming more like a cellular telephone every day and that many
    PDAs can access the Internet. What follows not too much of a leap from what we
    have today. It accepts the promise of electronic commerce, takes its lead from
    today''s corporate intranets, and adds an extension to the shared virtual memory
    concepts of the DSM.


    The problem with the handheld PDA device is the size of the screen. The screen
    is of acceptable size, the device is inconvenient to carry. If there is no objective,
    let''s assume there is a folding-screen version that fits into your pocket, purse,
    or clips on belt when not in use (see Figure 11.2). It''s an ordinary PDA unless
    you want to interact with whatever environment you happen to be—more on that aspect
