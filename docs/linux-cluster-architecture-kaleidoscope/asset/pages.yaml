  md: '# Overlap with Multiple CPUs


    The number of CPUs inside the computer and how they are interconnected form the
    basis for one multiprocessor naming convention. Four basic kinds of multiprocessors
    exist, representing the four ways that CPUs and physical memories have been successfully
    combined into a working computer.


    # Uniprocessors


    A uniprocessor (UP) is literally a single-processor computer that contains just
    one CPU, such as the one shown in Figure 2.1''s. The computer stores instructions
    and data in physical memory, also called random access memory, or RAM. Provisions
    for getting information into and out of the computer''s memory through input and
    output (I/O) devices, supported by software inside the operating system, or OS.
    (Don''t you love this alphabet soup?)


    # Multiprocessors


    A multiprocessor (MP) has two or more processors, but it has a single, shared
    memory that may be accessed by any of its CPUs, as shown in Figure 2.2. With multiple
    CPUs, more than one program can run at the same time. This allows for parallel
    execution, provided that software in the OS supports this feature.


    This is a double-edged sword, however. You must program these machines carefully,
    taking into account that two of your instructions might set one of your variables
    to different values at the same time! (Technically, only one of them will actually
    happen first; which one depends on the wiring and logic associated with the physical
    memory, but that level of detail is beyond the scope of this book.) You can protect
    shared data on an MP using semaphores, which are discussed in the next chapter.


    ![](img/e3b03565d41f4709ef69644849feddb3_27_0.png)


    # Array Processors


    An array processor is a special-purpose computer with many individual processors,
    each with its own physical memory area, as shown in Figure 2.3. The benefit of
    such a machine is its capability to execute the same instruction on all its processors
    at'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'once. For example, consider an ADD instruction. The two numbers to be added
    together are specified as address offsets into each of its processor’s memory
    areas. Your program gives the same ADD A to B instruction to each processor in
    the array, but each memory area has a different set of numbers at its A and B
    offsets.


    ![](img/e3b03565d41f4709ef69644849feddb3_28_0.png)


    FIGURE 2.3 Array processor—many CPUs interact with special-purpose memories.


    Note that a list of lists is called an array in many programming languages; hence
    the name array processor. Mathematicians call a list of related numbers a vector,
    so you may also see this kind of machine called a vector processor.


    If you have two lists of numbers to be added, A[0] to B[0], A[1] to B[1], and
    so on, you can give the same ADD instruction to every processor. Each value in
    list A is added to each corresponding value in list B, all in a single instruction
    cycle! If your application requires the same operations on lists of values, this
    is the kind of computer for you.


    # Pipeline Processors


    A pipeline processor is a highly specialized machine that can exploit overlap
    at the instruction level with only one CPU. The ADD A to B instruction, for example,
    can be viewed as a multistep process:


    +   1. Get the ADD instruction from memory.

    2. Get the address of variable A from the instruction, and then the value of variable
    A from memory.

    3. Get the address of B from the instruction, and then the value of B from memory.

    4. Add the two values, putting the result into the memory location of variable
    B.'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'Overlap can be achieved by a pipeline processor by getting the address of variable
    B from the instruction at the same time it gets the value of A from memory. Pipeline
    computers fill their pipe with instructions and begin processing all of them at
    once to maximize the overlap effect. They are often used as supercomputers, in
    which the speed of instruction processing is paramount. Debugging is especially
    challenging when you don''t know exactly which instruction was being executed
    when the failure occurred!


    # NOTE


    This author worked with one of the early pipeline processors, IBM 370 model 195.
    Execution errors, called interrupts, were coded so the programmer could tell the
    kind of error that occurred. Errors often resulted in a listing of memory at the
    time of the error, called a dump, a hexadecimal listing of your entry program
    along with instructions, and the address of the next instruction to be executed.
    Most of the time was a matter of finding the failing instruction in the dump and
    looking at the data that was being manipulated by that. If an imprecise interrupt
    occurred, however, you had to look at perhaps dozen instructions prior to the
    one indicated, because they were all as far as the system was concerned.


    # NOTE


    The back plane gets its name from its location in the back of a cabinet. Computer
    boards, each with a CPU and memory, on rails into the cabinet and plug into that
    plane in the back, where they can access power and board-to-board data communication
    lines.


    # A Taxonomy for Multiprocessors


    A multcomputer is a multiprocessor that is constructed from many individual computers,
    which are interconnected via a network or back plane (see the following Note for
    more on back plane). From a hardware perspective, considerable differences exist
    between a multiprocessor and a multcomputer. They are sometimes referred to as
    tightly and loosely coupled multiprocessors, respectively, in reference to the
    CPU-RAM data coupling. From a software perspective, however, they look almost
    alike; they form a special class, with its own subclass taxonomy, described in
    more detail next.


    In the late 1960s, M. J. Flynn created a special taxonomy for computing systems
    to help distinguish among many architectural designs. He focused on instruction
    and data access from the perspective of the CPU, noting how many different paths
    were available. He asked, “How many instructions can the CPU’s processor(s) access
    at the same time, and how many blocks of data can the CPU’s arithmetic and logic
    unit(s) access at the same time?” The answer was either one or many, in both cases,
    for a total of four distinct architectures.'
