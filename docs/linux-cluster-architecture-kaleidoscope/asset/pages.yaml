  md: 'Distributed System Execution Profiling


    155


    # NOTE


    Code profiling is easier because the tools are better today than they ever were.
    Code optimization still requires a lot of talent, however, because the developer
    must understand that an index reference into an array, for example, is slow compared
    to an incremental pointer reference. Developers must also understand that an optimizing
    compiler might generate the same machine-level code for either of those approaches
    and that the array index might be a better choice for documentation purposes.
    (Don''t forget the people who might have to debug your code later)


    Knowledge of the target platform''s assembler, or at least the general hardware
    requirements for a given set of instructions, can save a lot of time during an
    optimization effort.


    If you sample a program''s point of execution at regular intervals, the percentage
    of times you observed executing a particular phase is a good representation of
    the percentage of time it spends in that phase. This is a statistical result,
    of course, the larger your sample size, the better the representation. Because
    it doesn''t require knowledge of the process, sampling is perhaps the best way
    to obtain an execution profile.


    Direct measurement—the technique used here—gives more accurate results, but you
    have to know how to do the measuring.


    The MSI is a distributed system—several tasks running on a network of nodes, working
    together to resolve incoming queries. Profiling each program separately may prove
    helpful, but using the phase timing and reporting techniques outlined in this
    chapter should give you insight into broader performance issues. The overall processing
    time of a distributed system can be greatly influenced by process—interaction
    communication, for example, which cannot be measured with a simple profiler. Take
    another look at Figure 7.2, the MSI architecture diagram, to refresh your memory
    of how these processes interact.


    # Distributed System Execution Profiling


    The MSI server responds to incoming queries, and each query is processed in the
    same way. That means the processing phases can be ordered linearly. Keep in mind
    that phases of a more complex system—one that processes queries differently based
    on their content, for example—may have a treelike ordering in time. Treat each
    processing branch as a separate service and analyze them separately in cases.


    The first question to ask is, “What are the execution phases required to process
    a single incoming query?” Remember that you must not limit your thinking to the
    response-building phases, but to all the cluster management in support of it,
    as well. Let’s look at what steps the server performs to process a query.'
  merge: -1
