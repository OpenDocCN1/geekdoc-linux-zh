  md: '# Estimating and Displaying Network Utilization


    Network utilization may be displayed by the netstat line command:


    +   - netstat -i


    It gives you the number of packets sent and received on each of the network interfaces,
    along with any packets in error, dropped, overflowed, collided, and so on. Note
    that this information is associated only with the machine that executes this command.
    What you really want to know is the overall network loading, and that requires
    an estimate.


    Assuming your cluster is on a closed network, with perhaps a single client machine
    that monitors and displays the real-time performance, you can estimate the network
    loading by adding all the sent and received counts from each node and dividing
    by two. If machine A sends a packet to machine B, for example, A will show one
    packet sent and B will show one packet received. The number of packets on the
    network, however, is one.


    One way to get real-time netstat data is to actually issue the command, via a
    system() function call, from a process that runs on every node. It must read the
    report from netstat (see also the open() function call), calling out the interest
    values, and send them to a central performance monitoring process on the client
    machine for analysis and display. Each server process (master or slave) can start
    such a subtask as part of its initialization. The client can start the centralized
    performance subtask. Each performance reporter must know the IP address of the
    client and where performance packets are received. You will learn more about of
    these features later in this chapter.


    The netstat command is an inefficient way to get these numbers. Luckily, Linux
    provides an application-level user interface—a window into the inner workings
    of the kernel that is very efficient and easy to use. Several kernel modules update
    /proc pseudofs. You can open and read them as if they were text files. You will
    learn about the contents of them as they were defined in an early version of the
    Linux OS. Note that their contents change without running the command line and
    then investigate their exact meaning by looking at the kernel source code that
    updates each file of interest. (See the man proc page and the Linux programming
    book cited in the “Further Reading” section at the end of this chapter for more
    details.)


    Listing 8.2 is a program that reads the /proc files, gathering real-time statistics.
    This program will run on each node of your cluster. It will be started via fork-exec
    (explained in Chapter 3, “Interprocess Communication”) with an operand that tells
    it the hostname where the network utilization display process runs. These processes'
