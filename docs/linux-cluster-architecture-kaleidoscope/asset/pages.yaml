  md: '# Tightly Versus Loosely Coupled Multiprocessors


    ![](img/e3b03565d41f4709ef69644849feddb3_31_0.png)


    **Figure 2.5** NUMA—non-uniform memory access times (as loosely coupled).


    Note that in some references, NUMA is further separated into NUMA and NORMA (No
    Remote Memory Access through hardware). NORMA systems, these texts explain, require
    software intervention to cache a message to that system, requesting the required
    data from it. NUMA differs from a NORMA in that it has its individuals systems
    interconnected with a high-speed back plane, and when a memory address is outside
    of the local system, the back plane hardware gates the requested data into the
    memory register of the requesting CPU. Remote memory access in a NUMA is still
    much slower than memory access speeds, but the hardware handles everything, eliminating
    the need for specialized memory access software. Technically, you are going to
    build a NORMA system. If you do any further reading, it will be pleasant aware
    of this technical detail.


    # Tightly Versus Loosely Coupled Multiprocessors


    Tightly coupled MP systems are very efficient. All processes can communicate with
    one another at internal data speeds, in a nanosecond time frame. Their disadvantage
    is their high cost and their single point of failure—the central memory and its
    bus. Some designs incorporate redundant structures and the like, but this chapter
    considers such classifications in general terms.


    A network of computers, such as the multicomputer you are going to design in this
    book, is called a tightly coupled MP if the MP processes want to communicate with
    one another, they must do so over their external interconnection media at I/O
    speeds, in a millisecond time frame. Interprocessor communication over a network
    is thousands of times slower than that of a tightly coupled multiprocessor (MP),
    but it has the advantage of relatively low cost. High availability through fault
    tolerance may be achieved in software.'
