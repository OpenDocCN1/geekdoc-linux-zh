- img_proc: true
  md: "8. The master's chosen subtask responds to the query and declares itself idle:\n\
    \nThe subtask is waiting for the slave to process the request. When the response\
    \ arrives, the subtask extracts the timing data from the slave's execution phases\
    \ and sends it to the client. The subtask resets its condition flag to show the\
    \ master that it is idle.\n\nLet's assume Figure 9.1 represents these eight execution\
    \ phases, although it does not. During the analysis, you might wonder why phases\
    \ 3 and 7, the network transit times, are not equal. You might also wonder why\
    \ phase 2 takes so long when there is so little effort involved. These are the\
    \ kind of questions that lead to internal performance. The answers to these questions,\
    \ and the analysis that follows, lead to better internal performance. It leads\
    \ to better external performance, too, in direct support of your ultimate goal\
    \ of client satisfaction.\n\n# Event Timing Techniques\n\nMost phases will begin\
    \ and end in the same process and have no intervening wait times. Some phases,\
    \ however, will include I/O, and some will span processes of the network nodes.\
    \ Some of these cases will prove very interesting, leading to valuable insights\
    \ into the inner workings of a distributed system.\n\nThe simple events are easy\
    \ to time using the gettimeofday function call. It returns the time of day, in\
    \ microseconds, since a point of time in the distant past. (As of this writing,\
    \ distant point in time was midnight, January 1, 1970, Universal Coordinated Time.)\
    \ The exact number of seconds and microseconds is returned as two long integers\
    \ (time_t). You may use two time-of-day values to calculate the elapsed time,\
    \ as follows:\n\n+   9.1 A Sample Program That Times an Execution Phase\n\n```\n\
    #include <sys/time.h>\n#include <unistd.h>\n#include <stdio.h>\n\nmain(void) {\n\
    \  /*\n   ** Listing9.1.c - sample execution phase timing\n   */\n  struct timeval\
    \ time1, time2;\n\n  gettimeofday(&time1, NULL); /* START time * */\n```"
  merge: -1
  pgno: 169
- img_proc: true
  md: "# CHAPTER 9 Internal Performance Measurement and Timing\n\n# LISTING 9.1 Continued\n\
    \n```\n/* (execution phase of interest) */\nngettimeofday(time2, NULL); /* END\
    \ end time */\ntime2.tv_sec -= time1.tv_sec;\ntime2.tv_use -= time1.tv_use;\n\
    if(time2.tv_use < 0L)\n{\n    time2.tv_use += 1000000L;\n    time2.tv_sec -= 1;\n\
    }\nprintf(\"Execution time %ld.%06ld seconds\\n\",\n       time2.tv_sec, time2.tv_use);\n\
    return(0);\n```\n\nNote that time-of-day values are requested, and the difference\
    \ between them is the time it takes to execute the event phase, plus overhead\
    \ in the gettimeofday function call. This overhead is very small and usually be\
    \ ignored. If your application cannot ignore even such small overheads, however,\
    \ you can time this whole event and subtract the overhead, as will be the same\
    \ for both sets of time-of-day calls.\n\nMost of the events in the MSI are simple\
    \ and can be timed using the technique in Listing 9.1. Phases 4 through 6 are\
    \ timed in the slave process, which means that these measurements must be brought\
    \ back to the master's subst for consolidation with the local data. These results\
    \ can be sent along with each packet the time the slave sends back a packet. The\
    \ network transit times, however, require special consideration.\n\nAt glance,\
    \ it might seem reasonable to get the packet-send time on the sending machine\
    \ and the packet-receive time on the receiving machine. Passing the latter time\
    \ and subtracting it calculates the transit time—au contraire!\n\nThe call to\
    \ gettimeofday returns a value that represents the exact number of microseconds\
    \ since January 1, 1970, according to documentation. Practically speaking, however,\
    \ times on a PC are driven by a crystal oscillator that is subject to both manufacturer\
    \ tolerances and temperature variations. Each crystal is slightly off its design\
    \ frequencies, so any two may drift apart over time. Although months may go before\
    \ you reset the time of day on your PC, the differences between any two nodes\
    \ on a network prevent them from being perfectly synchronized. This difference\
    \ is especially apparent when calculating the short time it takes to send a packet\
    \ between nodes. Not to worry—a clear way exists to handle this situation. See\
    \ the timing diagram in Figure 9.2."
