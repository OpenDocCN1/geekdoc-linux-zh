    # Backup and Recovery


    A small number of C programs can represent a lot of time and effort on your part.
    Creating a simple backup and recovery scheme is highly recommended. A common 3
    1/2-inch disk holds a megabyte and a half of uncompressed data. Regularly using
    the Unix tar (archive) command, or even a simple copy operation, can be a significant
    defense against the loss of a hard drive.


    A large number of files can be backed up to the hard drive of another machine
    in the cluster by archiving these files to the local temporary area (/tmp) and
    then copying that archive file to a subdirectory (/backups, for example) on some
    remote machine''s hard drive.


    For a straight file copy, you can use a DOS-formatted disk, but you must mount
    it (as root) so that Linux knows what it is.


    Under /mnt there will probably be a subdirectory floppy. If not, create one:


    ```

    > cd /mnt

    > mkdir floppy

    ```


    Now mount the disk, copy the source files directly to it, and dismount it in:


    ```

    > mount -t msdos /dev/fd0 /mnt/floppy

    > cd /home/chief/src

    > cp * /mnt/floppy/

    > cd ../inc

    > cp *.h /mnt/floppy/

    > umount /mnt/floppy

    ```


    Finally, remove the disk and check its contents on a DOS (or Windows) machine.
    Similarly, you can restore these files as follows:


    ```

    > mount -t msdos /dev/fd0 /mnt/floppy

    > cd /mnt/floppy

    > cp * /tmp/

    > umount /mnt/floppy

    ```'
