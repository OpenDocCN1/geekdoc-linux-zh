    passes through. A switch is a vastly improved hub, allowing, simultaneous point-to-point
    communication pathways. A hub is a device that employs simple cables (twisted
    pairs, although they aren''t really admired) in a network that behaves as a coaxial
    cable (coax) is being used for the communication medium. And coax its start is
    by fooling the media access cards into believing that a single radio frequency
    channel was used to communicate.


