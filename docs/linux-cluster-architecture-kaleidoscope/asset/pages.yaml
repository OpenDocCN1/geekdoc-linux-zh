  md: '# CHAPTER 2 Multiprocessor Architecture


    Our goal is to design and build a cluster system. Let''s look at some of your
    choices in deciding what hardware to assemble and what software architecture to
    choose. The following sections of this chapter discuss the hardware decisions,
    the software features, and wrap up with a discussion about performance and some
    software choices made for our target system.


    # Hardware Options


    You need to consider two hardware decisions: the node computer architecture and
    the interconnection network.


    # Node Computers


    Big name workstations are available for a hefty price. They run sophisticated
    operating system, have humongous physical memories and disk drives, and are highly
    reliable. The principles of designing a cluster either out of workstations or
    PCs pretty much the same. Therefore, this discussion focuses on the typical, Intel-based
    PC.


    The node computers you choose should all be very much alike, for simplicity of
    replacement, load balancing, and performance analysis. The cluster system used
    to test the software described in this book has eight node computers with nearly
    identical processors, memory sizes, and so on.


    How powerful should these node computers be? The quick answer might be, "As powerful
    as you can afford." However, consider this for a moment. This author''s system
    grew out of two computers that were overdue for replacement. Throwing them out
    seemed rude considering all the years of good service they gave. I still had the
    original user''s manual, the diagnostics guide, and initialization floppy disks,
    not to mention all the experience gained working inside the machines, upgrading
    the memory and drives, and so on. When old machines hit the salvage market, I
    bought several of them at $20 apiece, including a spare part for parts.


    I built a four-node system recently for less than $300. Each had network interface
    hardware built in their system boards. They were almost 10 times the speed of
    the original system''s nodes, and their salvage price was only slightly higher,
    because of inflation. I attached a monitor, a mouse, and a keyboard to only one
    of them because the network allows remote access to the others, and these newer
    PCs would successfully boot without one. (Some older machines will fail their
    power-on self-test if a keyboard is not attached.)


    You can get details about computer outlets from large corporations and educational
    institutions. Some of these organizations are renting computers now, so their
    old models go back to the rental agencies. Contact the rental agency directly
    in that case.) One large university has a warehouse dedicated to selling its obsolete
    systems to the public and a test bench where you can plug it in to see if it works'
