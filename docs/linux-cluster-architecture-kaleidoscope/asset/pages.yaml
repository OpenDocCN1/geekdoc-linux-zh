  md: '# CHAPTER 9 Internal Performance Measurement and Timing


    +   1. The master chooses a local subtask (from its pool) to receive an incoming
    query:


    In Chapter 7, “The Master-Slave Interface Software Architecture,” you saw how
    a concurrent server outperformed a serial server and a resident pool of subtasks
    reduced the overhead of spawning a new subtask to handle incoming query. In the
    subtask pool architecture, the parent task must choose an available subtask from
    the pool. This is the first phase of execution. This phase, and others, can be
    timed directly by subtracting the phase-start time from the phase-end time.


    +   2. The chosen subtask receives its query and passes it to a remote slave process:


    Each subtask is paired with a slave process running on a remote node of the cluster
    (refer to Figure 7.2). Each query is sent to a remote slave for processing. This
    phase includes the preparation of the packet but not the actual transmission time,
    which is included in the next phase.


    +   3. Calculated master-to-slave network transit time:


    Each packet is sent from one node to another. In an inactive network, these transmission
    times are predictable, but when several nodes on the network compete for it, the
    network access time can become excessive.


    +   4. The slave process receives the incoming query and extracts a request from
    it:


    A filename and a line number are inside each query in the example. These details
    are extracted from the incoming query before a response can be built.


    +   5. The slave process retrieves the requested line of text from the shared
    text file:


    The slave opens the specified file, reads the requested line of text, and closes
    the file.


    +   6. The slave process builds and returns the response to the master subtask:


    The requested line of text is encapsulated in a response packet.


    +   7. Calculated slave-to-master network transit time (same transit time as step
    3):


    This is the exact opposite route the preceding one taken in phase 3, so you can
    assume that it takes approximately the same amount of time under similar network
    utilization. The network load is probably the same during trips because the time
    between them is very short, as you will learn from the analysis later in this
    chapter. The analysis is based on a chart of the averages times taken to process
    many queries, so unexpected differences in trip times will become insignificant.'
  merge: -1
