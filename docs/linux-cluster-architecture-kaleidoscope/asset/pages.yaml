- img_proc: true
  md: '# CHAPTER 7 The Master-Slave Interface Software Architecture


    It is quite reasonable for a slave to acknowledge receipt of each query, and piggy-backing
    utilization data onto such packets is a low-cost solution. The next chapter describes
    an experimental UI calculation that should overcome the stale data problem without
    the added cost or concern.


    You may have noticed that the preestablished subtasks in Listing 7.4 detected
    the readiness of an incoming query before giving control to its subtasks. The
    chosen subtask accepted and received the query and responded to it independently
    of the parent task. This technique employs a high degree of parallelism and frees
    the parent task to focus on the incoming query stream. We will use over-the-network
    equivalent technique so that the master process can sustain the highest possible
    incoming query load. See the diagram in Figure 7.2.


    ![](img/e3b03565d41f4709ef69644849feddb3_132_0.png)


    FIGURE 7.2 The master-slave interface.


    When the number of remote slave processes is known, the master will preestablish
    a local subtask dedicated to each. The parent will detect the readiness of a query,
    choose a remote slave based on its local utilization table data, and assign the
    query to its counterpart subtask. This gives you the benefit of parallelism that
    you want and moves the burden of utilization updates away from the parent and
    onto the associated subtask.


    There is the further benefit of fault detection: the communication link from local
    subtask to remote slave process can indicate a process failure and serve as a
    link to confirm or deny a failure, should suspicion arise. Similarly, any of the
    slave'
  merge: -1
  pgno: 132
- img_proc: true
  md: 'processes can detect a failure in the master—or at least in its associated
    subtask. The local subtask can restart a failed remote slave process by sending
    a UDP datagram, just as the parent did at initialization time, without the parent''s
    involvement.


    Complete source listings of these processes are in the Appendix at the back of
    this book. The source code is also available at www.samspublishing.com and may
    be downloaded at no cost. You are encouraged to experiment with solutions to these
    design issues, and having this code as a starting point should help you do so.


    # System Limitations


    The most obvious limitation is the master as a single point of failure. If the
    master fails, so does the entire server. A fault-tolerant solution would detect
    failure of the master and hold an election. One of the slave systems would assume
    the role of master and assume the IP address of the potentially failed machine.
    When queries come from an external client, there is often only one published IP
    address and port number where all the queries are sent. One publishes an IP address
    that the master process assumes as an alias, accepting packets addressed to this
    IP. When a master process fails, another process can assume that by sending a
    gratuitous ARP (address resolution protocol) message, which is beyond the scope
    of this book. (See the “Further Reading” section in this chapter).


    # Summary


    The focus of this chapter is the server. You start simply and build up to the
    master-slave interface center that adapts to cluster architectures.


    This started with a client and a simple application. The simplest server version
    was introduced and converted to a concurrent server—one that exploited the parallelism
    of incoming queries by spawning a subtask to handle each of them as they arrived.
    Finally, the more sophisticated approach of creating a pool of subtasks was in
    advance used. Finally, this subtask was extended into the realm of the cluster
    architecture by creating the same number of subtasks as there were remote processes.
    This architecture exploits the parallelism afforded by a multicomputer, or cluster
    architecture.


    In the next chapter, you will find out how well the system performs, at a level
    of detail that will help you fine-tune this system to meet the expected needs
    of your clientele.


    # Further Reading


    +   - Stevens, W. Richard. TCP/IP Illustrated. Vol. 1. Reading, MA: Addison-Wesley,
    1994.'
