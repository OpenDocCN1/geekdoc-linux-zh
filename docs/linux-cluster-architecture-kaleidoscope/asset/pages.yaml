  md: '# External Performance Measurement and Analysis


    # IN THIS CHAPTER


    +   - Query Generation


    +   - Inter-Arrival Time Distributions


    +   - Checking for an Accurate Response


    +   - Estimating and Displaying Network Utilization


    +   - Displaying Response Time


    +   - The External Performance of Your MSI Server


    +   - Further Reading


    Why measure the external performance of a server? The short answer is because
    that what matters to your clients: the overall system-response time.


    The server is your cluster system—its hardware and software. The clients are represented
    by one or more processes running on some external machines that you know little
    or nothing about. You want to give your clients the best possible service, and
    clients usually measure their quality of service in terms of the *response time*,
    the amount of time they have to wait for a server to respond to a query.


    You can measure the response time from the client''s perspective by viewing the
    server from the outside, as if it were a black box, the only discernible features
    being its inputs and outputs. Looking at a server''s external performance means
    measuring the time it takes to get a suitable response to your query, on average,
    and under a variety of loading conditions.


    This chapter shows how to design a query-generating client that will simultaneously
    stress your server and report on its performance. You saw a simple one in the
    previous chapter (refer to Listing 7.1) that queries at a constant rate. In this
    chapter, three more inter-arrival time (IAT) distributions are used to stress
    the server and update the client in Listing 7.1 accordingly.


    When external performance is less than stellar, you''ll need an alternative approach.
    In the next chapter, you''ll look inside the server, viewing it as a white box,
    and discover where and all the response time is being spent, reducing wherever
    possible.'
  merge: -1
