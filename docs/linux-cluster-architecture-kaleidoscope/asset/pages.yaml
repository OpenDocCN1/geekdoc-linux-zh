    # Summary


    A cluster computer architecture presents a low-cost alternative to a sophisticated
    multiprocessor system for many applications that are generally associated with
    supercomputers and transaction processing servers. Furthermore, building a cluster
    is well within the reach of even a computer hobbyist who has solid C language
    programming skills and a knowledge of computer operating systems, hardware, and
    networking. This book leads you through the design and assembly of such system
    and shows how to measure and tune its overall performance.


    A cluster computer is a multicomputer, a network of nodes running specialized
    software that turns the simple collection of networked computers into a distributed
    system. It presents the user with a single-system image and gives the system its
    personality. It can turn this network of computers into a transaction processor,
    as described in this book, or it can make it a supercomputer. Other possibilities
    exist, too, and these are the subject of speculation near the end of the book.'
