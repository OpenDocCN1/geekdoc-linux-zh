  md: '# Using the C Compiler


    The directories of most interest in this chapter are /home and /usr. The files
    under your home directory reside on alpha''s hard drive; alpha is the NFS file
    server. (NFS) is discussed in Chapter 5, “Configuring the Relevant Operating System
    Files.”) You will add subdirectories under your /home/chief user''s home directory
    and create some files to facilitate compiling C language programs. The programming
    language libraries and header files are under /usr/lib and /usr/include, respectively.


    # Your /home/chief Home Directory


    When you created the new user ID name during installation, a new subdirectory
    /home/chief was created for it, along with some environmental files that you can
    change to suit your needs. We created a file named .hosts (Chapter 5) under /home/chief
    to make our cluster system easier to use. You will also find a bin subdirectory
    (short for binary) to contain your local executables.


    You need some other subdirectories under your home directory—places to put all
    your language source programs and their associated header files. The executables
    that you make will go into /home/chief/bin. Source files are kept in /home/chief/src
    and headers under /home/chief/inc. Create these subdirectories by using the mkdir
    command, a contraction of “make directory.”


    ```

    > cd             [change to the home directory if not already there]

    > mkdir src [create /home/chief/src for C language source files]

    > mkdir inc [create /home/chief/inc for included C header files]

    ```


    # Using the C Compiler


    The GNU Compiler (the gcc command) creates executables in processing steps: precompile,
    compile, assemble, and link. The preprocessor processes any directives it finds
    (the #include, for example, inserts header files); the compiler creates object
    files from source, the assembler creates object files from assembly source, and
    the linker creates executables from object files. Each time you use the gcc command,
    the compiler and the linker need to be told which programs to compile or assemble
    or which object files need to be linked. It also needs to know where to find any
    header files referenced in precompiler directives, which object files compose
    the resulting executable, and so on. This is a complex process, requiring correspondingly
    complex instructions.


    Listing 6.1 is a C program that starts out simple and gradually grows in complexity
    to demonstrate how to control gcc does.'
