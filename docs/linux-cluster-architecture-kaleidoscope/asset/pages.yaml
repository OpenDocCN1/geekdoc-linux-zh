  md: 'Further Reading 179


    # Summary


    Designing robust software up front—or finding and removing vulnerabilities in
    an experimental system—should lead to a reliable cluster server. You find out
    what can go wrong through hands-on testing of your system and use this knowledge
    to add detection and recovery software to your system, minimizing the probability
    of seeing kinds of problems again. (You have better things to do with your time
    than finding terminating stray processes and removing leftover, shared memory
    areas.)


    Distributed software systems can be complex. Several subtasks communicate across
    the network to their remote counterparts, working together toward the common goal:
    servicing clients'' needs. Strong process interdependence should not result in
    a system failure because of an unexpected termination in one of them. You can
    detect and recover from process failures and reestablish disconnected links. You
    can design a system in which process failure results in another stepping to take
    its place.


    The result of your efforts, the focus of this chapter, is robust software: software
    that does exactly what you want it to do, when you want it to do it.


    # Further Reading


    +   - Jalote, P. Fault *Tolerance in Distributed Systems*. Englewood Cliffs, NJ:
    PTR Prentice Hall, 1994.

    - Lyu, Michael R. R. (editor). *Software Fault Tolerance*. West Sussex, England:
    J. Wiley and Sons,1995.

    - Stallings, W. *Data and Computer Communications*. 4th ed. New York: Macmillan,
    1994.'
