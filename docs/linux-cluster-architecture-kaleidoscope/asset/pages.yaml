  md: 'Don''t forget to look inside keyboard, mouse, and monitor cable ends and check
    all those tiny, delicate pins carefully. Be sure the monitor has both a power
    cord and a video interface cable. Do not remove the cover from the monitor unless
    TV repair is your specialty. The video screen, a cathode ray tube or CRT, is a
    lot like a TV screen and requires a very high operating voltage that stays high
    even after it has been unplugged for long periods of time.


    # Networking Hardware


    Remember, too, that these machines are going to be networked, so look for the
    RJ45 jack on the back of the PC''s system board along with the other ports, as
    shown in Figure 4.1, or on one of the accessory cards, as shown in Figure 4.2.
    Find out what speeds the network interface supports before you buy a hub. Many
    of the salvage systems at this writing are 10Mbps, and computers with 100Mbps
    support are just starting to become available. The speed of the hub must be compatible
    with the speed of each network interface interface. 10BASE-T and 100BASE-T, but
    if one 10BASE-T interface is on the network, everything at 10Mbps. If the hub
    is about 10Mbps and all your machines are at 10Mbps, nothing will work, so be
    careful about what you buy. You can always add a 100Mbps card to a computer and
    ignore its 10Mbps system board interface, but that drives up the overall cost
    of the cluster.


    ![](img/e3b03565d41f4709ef69644849feddb3_79_0.png)


    FIGURE 4.1 A network interface RJ45 connector on the computer''s system board.'
