  md: '# CHAPTER 2 Multiprocessor Architecture


    The uniprocessor has one pathway to an instruction and a single pathway to data,
    so he named the single instruction, single data machine, or SISD. The MP has multiple
    pathways both to instructions and data; therefore, it was designated multiple
    instruction, multiple data, or MIMD. The array processor has multiple paths to
    data but only one path to instructions, so it is a single instruction, multiple
    data machine, or SIMD. Controversy exists about the multiple instruction, single
    data, or MISD, designation. Trying to imagine such a construct is a good example:
    multiple instruction pipeline processor with only one data pathway? Some cite
    the instruction pipeline processor as an MISD. One mainframe, the IBM 360 model
    95, is a good example of a pipeline processor.


    # The MIMD In Depth


    The MIMD turns out to be a very useful and interesting type of machine and is
    the subject of much speculation and experimentation, so much that the two variants
    of this basic structure have their own subcategories: Uniform Memory Access (UMA)—In
    tightly coupled MPs, every CPU has direct access to central memory through the
    same memory register; each memory access takes approximately the same amount of
    time (see Figure 2.4).


    ![](img/e3b03565d41f4709ef69644849feddb3_30_0.png)


    FIGURE 2.4 UMA—uniform memory access times (same as tightly coupled).


    +   Non-Uniform Memory Access (NUMA)—In loosely coupled MPs, the CPUs have direct
    access through their memory registers to their local memory but not directly to
    those of the other CPUs (see Figure 2.5). Access to data in their own memory is
    very fast compared to access to data in another CPU''s memory, often over an external
    data network. Access times are nonuniform across CPUs.'
