    Every time a remote host name is used by a remote reference command, it must be
    translated into an IP address. The /etc/hosts files contain all the names that
    you might need, so you must add your node names and IP addresses to this file.
    Log in as root and use your favorite editor to change the contents of /etc/hosts,
    as follows:


    +   - 10.0.0.1 alpha.cluster.net alpha

    - 10.0.0.2 beta.cluster.net beta

    - 10.0.0.3 gamma.cluster.net gamma

    - 10.0.0.4 delta.cluster.net delta

    - 127.0.0.1 localhost.localdomain


    Left-justify the IP addresses and the shorter alias name. For readability of the
    long, fully qualified hostname name. The last entry is typed as shown and is in
    reference to the local host on every system. Whatever the hostname, localhost
    can always be used as its host name. Make all the hosts files on each of your
    nodes look the same.


    The machine used by a remote reference command to discover an IP address, which
    is used to communicate with the corresponding process on that remote machine.
    (You will design a sample remote reference command later in this chapter.) You
    may be unaware of the many messages sent back and forth between the two machines.
    You may experience a strong feeling that you are actually logged in to a remote
    machine, provided the network is configured correctly.


    Almost anything you can do while actually logged in to a machine can be done while
    you are remotely logged in to it. This is the power of networking, but it requires
    more than just hardware. It requires changes to the OS configuration files such
    as the /etc/hosts file to make the OS of the other machines on the network.


    # Changes to the /etc/fstab and /etc/exports Files


    One you might think when you use a remote login feature is that your home directory,
    along with all your files, is available to you on the remote machine. This is
    accomplished by changing two files: the "file system table" (/etc/fstab) on all
    the remote machines and the "file exports table" (/etc/exports) on the local file
    server machine. The local file server is named alpha in our examples.'
