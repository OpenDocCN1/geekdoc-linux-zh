    And if you want to look for a library book while you''re eating lunch, you can
    always do that the old-fashioned way: dial your ISP and connect through the Internet.


    Finally, perhaps the ultimate cluster software architecture is one in which the
    structure is defined by the process requirements instead of by the available hardware.
    New divisions of a corporation and brand-new companies are represented by a corporate
    chart of positions first, second. The distributed software architect should be
    designing the process chart that will the job done, without regard for the hardware
    at first. Each of these processes, with their interprocess communication links
    defined in advance, should not be burdened with any concerns related to where
    they execute relative to their peers. A process senses that it isn''t capable
    of running its goals from where it happens to be executing (too many processes
    are running there, for example, slowing down access to the local resources), it
    should be able to send itself to other machine for the betterment of the overall
    system performance.


    The concept of a process reestablishing itself on some other machine is described
    under autonomous agents but that area of computer science has the vision of your
    personal agent roaming throughout the Internet, seeking information for you. You
    may be looking for a good restaurant in Seattle, for example, knowing you will
    be on business this week. It carries a matrix describing your preferences in food
    and price range and knows where you will stay. When it finds an optimal solution,
    it reports to your desktop, where information waits until your PDA is in range
    for download.


    Ubiquitous computing will soon be the production, not the demonstration package.
    The software and hardware will be designed by fresh minds that are unburdened
    by the ways they have always been done and by flexible minds willing and anxious
    to shed old ways of thinking in the light of new problems. Join the fun.'
