    # Software Options


    The software choices are simpler. You want an operating system that is sophisticated
    enough to support a local area network, remote command execution (remote shell)
    access from one machine to any other on the network, and a reliable C compiler.


    Unix has all the required features, and several versions are available for the
    PC. The cost of the OS software goes with features, not quality, so you have an
    advantage because you will need many. A sophisticated Linux user can download,
    configure, build, and install the OS for no cost the download time on an Internet.
    For the rest of us, a simple version of Linux is available for less than $50,
    including basic documentation and a user-friendly installation program. The test
    system runs the Linux 2.0.30 kernel in character mode (no X Window support). If
    you are going to attach only one monitor, keyboard, and mouse, you may want to
    include the X Window System, which will enable you to open an individual terminal
    window to each of the machines on that single monitor.


    Linux comes with a good C compiler, unlike many other operating systems. Linux
    is certainly the best choice. The security is one Linux feature that gets more
    sophisticated with time, so older versions are preferred over newer ones. Security
    within your local area network is not an issue—you are not going to attach anything
    to the Internet elsewhere outside your direct control.


    # Performance Issues


    You can look at a cluster''s performance in two ways: externally and internally.
    The external viewpoint focuses on the rate at which the cluster can handle transactions
    for a server. It looks at how quickly high-level calculations can be performed
    for a supercomputer. The internal view gives you the view of how long it takes
    to do whatever the cluster is designed to do, in detail. For example, an transaction
    is accepted by the master and passed along for further processing by one of the
    slaves. The response is built and returned to the master, where it sent back to
    the requester. Many steps are associated with this process. You can (and in a
    later chapter) time the execution of each its phases and each of the steps in
    each phase if you are moved. You can plot these times as a bar graph to see most
    of the time is being spent and take a close look at that code, optimizing it'
  merge: -1
