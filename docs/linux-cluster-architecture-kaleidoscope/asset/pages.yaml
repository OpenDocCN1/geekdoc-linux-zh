    This file will be checked by the remote login process every time you try to log
    in from some node on the network. Note that every node on the network will have
    this file because every file in your home directory is made available through
    the network file system, as configured previously. NFS is a very nice feature.


    By specifying all the nodes on the network, along with your user ID, you allow
    remote access to any node from any other node, without any password checking.


    # Optional Changes to the /etc/passwd File


    If you are doing a lot of logging in and as user chief and a list of system configuration
    as root, you might want to consider removing the need for either these passwords.
    This is certainly a security risk, but it will save a lot of time. If your system
    is in a secure area and no you (and those you trust with the root password) will
    ever get close to these systems, you can physically remove the password from your
    user ID and the root entries in /etc/passwd.


    ```

    root:c6752ffa:0:0:root:/bin/bash

    chief:4456aab:500:500:Chief User:/home/chief:/bin/csh

    ```'
