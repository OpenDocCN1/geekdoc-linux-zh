    NOTE


    Most computer manufacturers have specification information for their discontinued
    models on their Web sites, usually under a Support section. See the “Further Reading”
    section at the end of this chapter for a few reference Web sites.


    # Network Media and Interlaces


    Results from the Beowulf Project (www.beowulf.org) emphasized the need for a fast
    external network if a network of PCs was going to be used as a competitive replacement
    for a more expensive multiprocessor in supercomputing applications. The custom
    network and device drivers are well beyond our needs, but you should be aware
    of the choices available to you, even on a home network. Radio frequency links,
    fiber optics, and even high speed (gigabit plus) ethernet are available to ordinary
    consumers in many of the larger computer stores today. Many firewalls, routers,
    switches, and hubs are available that it can hard to find the simple networking
    products you need here.


    # Switches or Hubs?


    If money is not an object, you might consider switched, gigabit ethernet. A hub
    emulates the coaxial cable network by letting each of the other machines on the
    network hear what the sender is transmitting. A switch makes a connection between
    the sender and receiver, reducing the potential for collisions. The benefit is
    better performance and the cost is, well, the cost; switches are expensive and
    are probably'
