- img_proc: true
  md: '# CHAPTER 8 External Performance Measurement and Analysis


    # Query Generation


    Recall the client program in Listing 7.1. It records the time of day and creates
    a subtask to send each query. When the parent regains control, it calculates the
    amount of time remaining in the IAT and waits before sending another query. The
    client implements a constant IAT—each query follows the next after some amount
    of time. If only our world were orderly!


    Arrival rates in cases so mundane as a bank teller''s window were of interest
    to early-time-and-efficiency experts who thought a branch of mathematics, called
    queuing theory, was a direct result of it. Queuing theory allows bank managers
    to predict how many tellers will be needed at a time of day for a given day of
    the week. Telephone companies can determine how many central offices it can connect
    to a tune line, and airlines can decide how many flights to schedule, based on
    records of their customers'' historical behavior. Computer scientists use queuing
    theory to predict the bandwidth needed between nodes of a network and to determine
    how many users can be supported by a particular service. This is powerful, but
    it''s beyond the scope of this book. A classic text on this is cited in the “Further
    Reading” section at the end of this chapter.


    Those efficiency experts sat in view of a teller''s window and wrote down the
    exact time that each bank customer arrived. A modern-day observer is more likely
    to be a small metal box at the side of the road. It has a long black rubber sensor
    stretching across each car''s tires roll over the sensor, the time of day is recorded.
    The box is picked up at day end, and traffic flow is analyzed based on the observed
    data. But the analysis is the same.


    Taking the differences between successive arrival times produces a list of IATs
    that can be ordered, categorized, and tabulated. Categories represent the number
    of times that an IAT between zero and ten seconds was observed, the number of
    times that an IAT between twenty and twenty seconds was observed, and so on, and
    in the first two columns of Table 8.1.


    # TABLE 8.1 A Discrete Inter-Arrival Time Distribution


    | IAT (seconds) | Number of Observations | Percentage of Observations | Probability
    of Observation | Cumulative Probabilities |

    |---|---|---|---||

    | 1-10 | 52 | 26 | 0.26 | 0.26 |

    | 11-20 | 42 | 21 | 0.21 | 0.47 |

    | 21-30 | 32 | 16 | 0.16 | 0.63 |

    | 31-40 | 26 | 13 | 0.13 | 0.76 |

    | 41-50 | 16 | 8 | 0.08 | 0.84 |

    | 51-60 | 12 | 6 | 0.06 | 0.90 |

    | 61-70 | 8 | 4 | 0.04 | 0.94 |

    | 71-80 | 6 | 3 | 0.03 | 0.97 |

    | 81-90 | 4 | 2 | 0.02 | 0.99 |

    | 91-100 | 2 | 1 | 0.01 | 1.00 |

    | Total = 200 | Total = 100% | | Total = 1.00 |'
