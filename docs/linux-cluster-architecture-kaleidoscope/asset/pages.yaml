    A naming convention exists for networks and their connectors. The original half-inch
    coax networks supported a single piece of coax up to 500 meters and operated at
    a 1-, then a 2-, and finally a 10-megabit data rate. These were designated 1BASE-5,
    2BASE-5, and 10BASE-5, respectively. The first number represents the data rate
    in megabits per second. Base refers to base communication, in which only one carrier
    frequency is used. (Contrast to broadband communication.) A final number represents
    the maximum coax length in hundreds of meters. Coax connectors are commonly called
    UHF connectors because they are rated for frequencies into the UHF (300MHz and
    up) range before exhibit noticeable losses. (Technically these are called PL-259
    connectors: PL for plug, which matches the SO-239 socket.) Thinnet uses BNC connectors
    that are easy to connect or disconnect. Both require a terminator at each end
    to make them appear infinite in length. The terminator is a resistor that absorbs
    the transmitted energy, avoiding interference-reflections.


