    Our four-node cluster''s system names are alpha, beta, gamma and delta, at IP
    addresses 10.0.0.1 through 10.0.0.4, respectively. They are all on a domain named
    cluster.net. Finally, you will need a user ID for众多 configuration and application
    development. We use chief for our general-purpose user ID. We assume you established
    a user ID named chief on each of these systems during the Linux installation process.


    The machine named alpha is our primary system; always boot it. It will have the
    monitor, keyboard, and mouse (if any) directly attached to it. It will be our
    file server, which means user files in the home directory will be physically located
    on alpha''s hard drive. When we log in one of the other remote machines, those
    files, through the magic of the Network File System, or NFS, will appear to be
    there. We discuss NFS when we make changes to the /etc/fstab and /etc/exports
    in a later section of this chapter.


    # The Linux root User


    If dozens of user accounts are on a particular machine, dozens of home directories
    exist, each containing that user''s personal files. Which user, then, is responsible
    for the system files?


    A special user ID, named root, is on all UNIX systems. This user is also called
    the super user because of its special powers, as you will see. The root user owns
    and is responsible for all the system files. If any changes must be made to any
    of them, you must become the root user; you may do so with the su (switch user
    ID) command, as:


    +   - su root


    The su command enables you to switch to some other user ID. Dangling dash (-)
    shows your intent to assume the personal profile of that user.(When you change
    to the root user ID, you don''t even have to specify root; just su—is sufficient.)
    You will be asked to type a password before you are allowed to proceed. Use the
    root password that you established during system installation.


    When you are finishing work as root, type the logout command to end the root login
    session and resume the earlier session under your personal user ID. You may also
    end a session by typing an exit command, or simply a Ctrl+D keystroke, which is
    by far the quickest and easiest method.


    # Logging in as root at the System Prompt


    Another way to become the root user is to log in as root at the system prompt.
    Some security-conscious systems, however, do not allow the root user to log directly,'
