    # Ad Hoc Peer-to-Peer Networks


    The MSI is a hierarchical architecture—it is a tree structure with the master
    node at the base and slave nodes on each branch. Not all clusters are organized
    like this.


    Peer-to-peer networks do not have a master and slave relationship. Rather, each
    can take on either role, and these nodes are programmatically, with the same processes
    running. Each will accept incoming data and ask for assistance as if it were a
    master, and each will accept a request for assistance from another node as if
    it were a slave. Some of these distributed systems can ad hoc (temporary, needed)
    networks-on-the-fly and disassemble them as quickly as they are no longer needed.


    As an example, consider an automobile on a four-lane highway, in medium traffic.
    You activate the cruise control, settle into the right lane, and let others go
    by on the left. As you approach an exit ramp, a car comes past you on the left,
    with a right turn signal, and crosses your lane to make that. You see it coming,
    your brakes, and move into the left lane in case the car brakes before exiting,
    adding injury to injury. You relied upon your instinct, your vigilance, and the
    visual clue of the other car''s turn signal. You did not look behind before you
    touched the brakes, nor did you check carefully before moving into the left lane.
    Not a problem this, but this could have ended differently.


    Fast-forward about six years. You are in the same situation, but most cars are
    equipped with an onboard driver-awareness system, a node computer with bidirectional
    radio frequency link, and a display on the dashboard. As soon as the car comes
    by you on your left and begins to drift into your lane, a warning sounds both
    in your car and in his. As the first car comes behind you in the left lane, its'
