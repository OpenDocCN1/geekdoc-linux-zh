  md: '# Our Cluster System''s Network Topology


    # Adding Network Support to the OS Installation


    When you get to the networking information part of the installation process, select
    the local area network option, without any dynamic name server (DNS) address support.
    Use fixed IP addresses from 10.0.0.1 through 10.0.0.x, in which x is the number
    of machines in your cluster. For example, a four-node cluster will require IP
    addresses 10.0.0.1, 10.0.0.2, 10.0.0.3, and 10.0.0.4.


    You will want to have friendly names for each machine in your cluster. Your hostnames
    can be formal, such as system1, system2, and so on, but on, nothing prevents you
    from having a little fun with them. You can use the names of the planets: Mercury,
    Venus, Earth, and Mars, for example. You can use the names of presidents, automobiles,
    four of your favorite cartoon characters, gemstones, and like; which is yours.
    The OS changes a friendly name into an IP address when you send a message or log
    in to a remote machine, based on entries in the system''s hosts file, which is
    discussed in the next chapter.


    > TIP

    An inexpensive labeling machine is available in most department stores. Print
    a strip with each name and one with each IP address and stick them on the front
    of each machine for easy recognition.


    # Our Cluster System''s Network Topology


    Our four-node cluster is built from four 166MHz PCs, each with a 64MB memory,
    a 3 1/2-inch floppy drive, a CD-ROM drive, a 1GB hard drive, and a 10Mbps RJ45
    connector connected to the system board. We have a single monitor, keyboard, and
    mouse, five commercially made network cables with RJ45 plugs on each end, and
    a six-port, 10BASE-T to complete the package. Our cost was $30 for each base unit,
    $50 for the monitor, keyboard, and $70 for the hub and cables—for less than $300,
    including a commercial Linux package and sales tax. The network topology is diagramed
    in Figure 4.4.


    Note that each of the four cluster nodes in Figure 4.4 is connected to the hub
    by a single cable. Only the local node has a monitor and keyboard attached to
    it. (If all four nodes are essentially the same, one can have a larger hard drive,
    choose it. This is not a critical choice.) You will be accessing the remote nodes
    from the local node through that single keyboard and monitor. These techniques
    are discussed in a later chapter.


    The cluster nodes are going to work together as a server. You will need at least
    one external computer to run the client software that sends queries to your server.
    It will also run performance monitoring and display software that shows you how
    stressed each server node is. These functions are discussed in greater detail
    in later chapters.'
