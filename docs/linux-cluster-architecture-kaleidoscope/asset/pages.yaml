  md: "Note the requirement for common knowledge of the performance information\n\
    packet structure as well as the destination port address. The header file referenced\
    \ by\nListings 8.2 and 8.4 follows:\n\n```\n#define PORT 9090\nstruct cprStats\n\
    {\n    int cp; /* cpu utilization */\n    int rm; /* mem utilization */\n    int\
    \ ps; /* packets sent */\n    int pr; /* packets recvd */\n    int dr; /* disk\
    \ reads */\n    int dw; /* disk writes */\n} cprStats;\n```\n\nThe method of reading\
    \ four incoming packets prior to each redrawing of the display\narea seem inlegant.\
    \ It lacks robustness by assuming everything is working\ncorrectly. You can ignore\
    \ for now; you will learn more about software robustness\nissues in Chapter 10,\
    \ \"Robust Software.\"\n\n# Displaying Response Time Statistics\n\nThe subtasks\
    \ in Listing 7.1 can record the time query was sent, the corre-\nspponding was\
    \ received, and can easily calculate each of their response\ntimes. It can also\
    \ keep this information in a shared memory space set up by the\nclient's parent\
    \ task for purpose. You may want the subtasks to record the individual\nresponse\
    \ times in a shared memory space and the parent to report the external\nperformance\
    \ as it changes.\n\nThe parent task in Listing 7.1 waits for any remainder of\
    \ IAT, and it issues error\nmessages in cases where the amount of time necessary\
    \ to prepare and send a query\nexceeds that value. Assuming it can work within\
    \ the IAT limitation and must\nwait before continuing, it can certainly take a\
    \ tiny moment to update an array of\nresponse time categories. It can display\
    \ these response times in a bar chart when the\npacket stream is finished, as\
    \ shown in Figure 8.5. A character-based presentation is\nfor simplicity.\n\n\
    Listing 8.4 shows a client process that supports exponential, pulse, and sweep\
    \ distrib-\nutions and presents a bar chart of overall response time statistics."
