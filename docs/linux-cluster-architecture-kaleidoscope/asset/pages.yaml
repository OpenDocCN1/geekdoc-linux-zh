  md: '# CHAPTER 3 Inter-Process Communication


    > TIP

    You can test these program pairs using an alternative way, in case you don''t
    have a network built yet. Start a second login session (by opening a new X Window
    or by pressing ALT+F2 on Linux) and consider it a server machine. Run the client
    application from your original login session with a destination IP address of
    127.0.0.1, which is the universally recognized "local loop-back" IP address. The
    term loopback means "the same machine." Do everything else as you do in the preceding
    example.


    # Automatically Starting Remote Servers


    In the client/server example, you started the server manually, but a server will
    usually be running before you try to connect to it. A database server machine,
    for example, usually starts a database server at boot and restarts it in the event
    of failure. Your client interacts with the database server and expects it to always
    be available. A more familiar example might be your Web browser as a client that
    accesses your favorite sites, expecting them to be up to 24 hours a day, 7 days
    a week.


    You don''t want to have start your experimental server every time, and it isn''t
    practical to have it running all the time! How can you have a server start when
    you want to use it and have it go away after you''re done with? Unix allows you
    to specify your own services, but setting this up to administration, it requires
    root access. Because this subject is closer to communication than to administration,
    it is covered here. If you''re not comfortable being a root operator yet, skip
    this section for now and come back to after you''ve had a look at Chapter 5, "Configuring
    the Relevant Operating Files," or later in this book.


    The Unix networking daemon, named inet, is started at boot and is referred to
    as the super server. This is because it is a generic service, awaiting a connection
    to any one of its sockets. That is, instead of having your server up and running
    all day, every day, you configure inet to respond to a connection attempt by actually
    starting your server process and giving it control, by reassigning standard input
    and output streams that would be a socket connection in an ordinary server. That''s
    right—an inet service simply reads from standard input (file descriptor 0) and
    optionally writes to output (file descriptor 1). Comparing Listing 3.8c and Listing
    3.9c to their original server counterparts in Listing 3.8b and Listing 3.9b. These
    are much simpler indeed!


    +   LISTING 3.8C Service: Prints UDP Datagrams from a Remote Client


    ```

