  md: '# Summary


    The MSI is a toy compared to commercial systems, but it is an excellent learning
    tootheless. Modern systems employ two-tiered software architectures, encapsulating
    the interprocess communication software to remove its influence on the design
    and enhancement of the high-level service application.


    Beowulf-class architectures are the classic distributed systems design driving
    of the cluster architecture development today. Scientific applications provide
    the motivation for such systems, perhaps more than information servers do today,
    but this is changing.


    Parallel processing of scientific applications requires a preprocessor of some
    sort to break up an algorithm into parallel processing blocks and an execution-time
    manager to schedule these on available processors, consolidating their results
    for continued processing of the single, central thread.


    Networks don''t have to be fixed. Ad hoc networking—among automobiles on the highway
    or soldiers on a battlefield—allows communication where none would be possible
    without tremendous effort, filling in vast areas with cellular-style communication
    stations where highways are built or battles be fought.


    Finally, thinking outside the box, consider a fixed network where the processes
    moves from node to node. The future may hold a world where computational communication
    power is as ubiquitous as AC power is to the appliances we use today. And there
    will be no shortage of technical challenges.


