  md: '# Introduction


    You may have opened this particular book because you heard or read something recently
    about cluster computing. It is definitely a hot topic! You might be a hobby-ist
    who enjoys the hands-on experience of working with computers or an engineer or
    engineering manager who needs to understand the trade-offs and the pitfalls in
    cluster computer development. I hope that when you finish reading this book, you
    will either have or know how to design and build a working cluster computer. This
    may help you understand what kinds of problems your development project is likely
    to encounter. It may allow you to test and tweak distributed algorithms that are
    destined to run on hardware that is still under development, in parallel with
    your computer club. Or your cluster might be the first parallel Web server in
    your local computer club. Whatever your motivation, I want you to know how much
    I enjoyed learning and employing the skills necessary to build such systems; I
    consider it an honor and a privilege to be the one to pass them along to you.


    Alex Vrenios

    Phoenix, AZ'
