    > NOTE

    A mailbox, by the way, is a text file with the same name as your user ID; it gets
    larger with each new e-mail and shrinks as you read and delete them. The mailbox
    for chief, for example, is found at /var/spool/mail/chief. This is not too different
    from the address you write on the front of an envelope if you generalize syntax
