  md: '# Assembling the Hardware for Your Cluster


    # IN THIS CHAPTER


    +   * Node Processors and Accessories

    * Network Media and Interfaces

    * Implementing an OS

    * Our Cluster System’s Network Topology

    * Further Reading


    Processor speeds increased dramatically over the last three years. Newer, faster
    computer models kept coming out until the threat of recession put the damper on
    their sales. Individuals and families thought, quite rightly, that they could
    make do with the computers they already owned. Office managers decided that cuts
    to their budgets could be partially by extending lease agreements another two
    years. Lately, the computer manufacturing industry experienced hard times.


    The only good news to come out of all this is for the consumer: major computer
    stores have their hottest systems on sale at about 15% below last year’s prices.
    Second-tier models are even cheaper, and the economy models are selling for just
    under $1,000. Computer salvage houses have $30 price tags on computers that will
    easily run all but the very latest operating systems and their productivity suites.
    Add a monitor, keyboard, mouse, modem, and a sound card, and you’ve built an adequate
    home system for about $100. Considering the computer configuration you need for
    the nodes of your cluster system, a four-node cluster can be had for very little
    money. Let’s get started!


    # Node Processors and Accessories


    “money is no object,” as they say, you can buy four or more of the best systems
    available. For the fairly well heeled, a set of second-tier machines or perhaps
    a larger number of economy machines is the cluster of choice. We frugal designers,
    however, must plan things more carefully.'
  merge: -1
  pgno: 77
- img_proc: true
  md: 'If you can afford better, maybe your first cluster ought to be built from salvage
    PCs. Someone was proud to have these systems on their desk not so long ago. They
    earned their keep and have nothing more to prove; they can probably still cut
    the mustard with an efficient OS such as Linux. Besides, old machines will teach
    you a lot more about computers than the ones will. You will swap cards and upgrade
    memory, get to know a PCI slot from an ISA, and learn to spot the notch in memory
    strip without a thought. You will have to figure out memory part numbers, determine
    its interface speed, and so forth. In doing so, you will gain a sense of confidence
    and a working knowledge of your systems. Let''s look deeper into the cost-effective
    components that can be used to make a frugal, but effective cluster.


    # NOTE


    Large corporations, computer discount houses, and institutions such as hospitals
    and universities have a central telephone number that you can call for details
    about their salvage policies. Many employees have volunteer to rebuild the company''s
    old computers for local schools, so they don''t sell them to the public. Some
    do, and it''s worth a call to find out. A university near me has a warehouse dedicated
    to sales and is open to the public during daytime hours. They have a test bench
    in back, and their prices are quite reasonable. A bottle of general purpose cleaner
    and a roll of paper towels can bring these systems back to very nice, no जिक्र,
    condition.


    # Hardware Accessories


    Assuming you are going to build a four-node cluster, try to find five PC base
    units that are identical and model number. Look inside them to make sure all have
    a hard disk and CD-ROM drives and that the memory slots are at least partially
    populated. Check the rear port connectors for bent pins and don''t forget the
    power cords. If the store will let you try before you buy it, do so. Bring a boot
    disk to see if it will boot without errors. An extra machine is nice to have for
    when something goes wrong, buying five PCs can really dampen your enthusiasm!


    # I/O Requirements


    You need only one monitor, keyboard, and mouse for this cluster because Linux
    will let you log into remote systems from the main computer. Attach them directly
    to each machine as you check it out and load the OS, but after they are up and
    running on a network, they will be attached to the network file system (NFS) server.
    You will learn more about NFS in the next chapter.'
