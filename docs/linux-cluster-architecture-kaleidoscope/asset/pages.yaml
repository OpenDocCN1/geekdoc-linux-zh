  md: '# Changes to the /etc/fstab and /etc/exports Files 79


    At boot, the presence of a file system reference in the local fstab triggers interprocess
    communication to initialize the service, provided that the reference is to a matching
    file system in the server''s exports file. Use the exports file to announce the
    availability of a local file system, such as the home directory; use the fstab
    entry to tell each client machine to request that these files be mounted from
    the file server at boot.


    # NFS with the /etc/fstab and /etc/exports Files


    NFS uses a team of active processes to support the strong illusion that you are
    working with your personal files on one machine when you are physically located
    on another machine. That, the file data resides on the server''s disk (alpha''s
    hard drive), you are working with them as if they were on a remote node''s alpha.


    Note that we are referring to the personal files in your home directory—your C
    programs, for example. System files on your cluster exist on each system''s hard
    drive because they represent the local machine''s configuration parameters. There
    are remote systems, called diskless workstations, that get all their files from
    a remote server. These kinds of systems are outside the scope of this book. They
    do not have a hard drive. They boot from a floppy disk that contains enough data
    to get them up and running to a point where they request subsequent file data
    from a designated server.


    Add the following line to the /etc/exports file on the NFS server machine named
    alpha:


    ```

    /home rw

    ```


    This says that you want the /home directory to be available for NFS mount on any
    remote system with read and write privileges.


    Add the following line to the /etc/fstab file on each of the other (NFS client)
    nodes:


    ```

    alpha:/home  home nfs rw 0 0

    ```


    This says that you want the NFS to mount alpha''s /home directory locally, as
    /home, with read and write privileges, or more precisely, over your local /home
    directory because you are required to have a /home directory locally for this
    mount to succeed. This process is called mounting a remote file system.


    The NFS server boots first, and its processes discover that the local /home subdirectory
    is offered for export to any other node that requests it. As the other nodes boot,
    NFS processes each request that the /home directory be made available from alpha.
    That file system now appears to be on the local node''s hard drive. When you log
    in to the node gamma (or beta or delta), your home directory will be available
    to you, along with all your files.'
