    # Summary


    This chapter began by examining the components of a typical computer and then
    looked at some of the other kinds of computer architectures built with multiple
    CPUs, multiple memories, or some specialized hardware. The introduction of the
    desktop computer, a network of the LAN, or local area network, led to the design
    of the multi-computer, a network of computers running custom software. You saw
    how the nature of this software defined the properties of such machines, making
    them suitable for transaction processing, supercomputing applications, and to
    the like.


    The simplest multicom construct is the master-slave architecture, in which one
    of the network machines uses the others according to their availability to exploit
    any parallelism inherent in the data processing algorithm. The design of such
    a system is the focus of this book.'
