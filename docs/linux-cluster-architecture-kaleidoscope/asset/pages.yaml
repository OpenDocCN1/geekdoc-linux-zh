    # About the Author


    Alex Vrenios is Chief Scientist at the Distributed Systems Research Lab, a technical
    consulting group specializing in the performance measurement and analysis of distributed
    computing architecture. He holds a B.S., M.S. in Computer Science, is the author
    of numerous articles, and is a Professional member of the ACM and a Senior member
    of the IEEE. Alex started his career working with communication and data transmission
    software on mainframe computers. When he made the transition to the networked
    C/Unix environment and found out about interprocess communication, distributed
    algorithms, and cluster computing, he never looked back. Nearly 30 years in industry,
    he believes it is time to organize his experiences and passions for publication
    in an effort to leave a contribution for others to build on. He married his lovely
    wife, Diane, 13 years ago. They have two Miniature Schnauzers named Brutus and
    Cleo. His other interests include amateur radio, astronomy, photography, bicycling,
    hiking, and riding a bright red Honda PC800 motorcycle.'
