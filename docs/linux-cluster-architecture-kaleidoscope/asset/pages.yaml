  md: "The response packet has the following structure:\n\n```\nstruct packet\n{\n\
    \    /*\n     ** Information request packet\n     */\n    #ifdef TIMING\n    /*\
    \ slave phase times */\n    struct timeval remote;\n    struct timeval phase4;\n\
    \    struct timeval phase5;\n    struct timeval phase6;\n    #endif\n    char\
    \ buffer[QUERYSIZE]; /* request * */\n} packet;\n```\n\nThe buffer contains the\
    \ query when the master sends it to the slave; it contains the response when the\
    \ slave sends it back. Note that the timing results (the three slave' phases and\
    \ the overall slave processing time described previously) are present in the packet\
    \ only when timing is of. The packet is smaller when the server is not undergoing\
    \ timing performance measurements.\n\n> /*\n** Shared Memory Space\n\n```\nstruct\
    \ area\n{\n    int flag[MAX]; /* 0:idle, 1:good, -exit */\n    #ifdef TIMING\n\
    \    int count[MAX]; /* number of queries handled * */\n    struct timeval phase2[MAX];\n\
    \    struct timeval phase3[MAX];\n    struct timeval phase4[MAX];\n    struct\
    \ timeval phase5[MAX];\n    struct timeval phase6[MAX];\n    struct timeval phase7[MAX];\n\
    \    struct timeval phase8[MAX];\n    #endif\n} area, *ptr;\n```\n\nEach subtask\
    \ sets its flag, indicating its state to the parent task. Each subtask adds in\
    \ timing results from the local node and from the remote node, via the extra space\
    \ in the packet when timing is being measured."
