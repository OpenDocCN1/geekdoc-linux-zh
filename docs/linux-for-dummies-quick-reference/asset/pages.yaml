  md: '# Mounting MS-DOS Media and Partitions


    | Command | Function |

    | --- | --- |

    | mmount | Mounts MS-DOS file system. |

    | mmove | Renames an MS-DOS file or directory. |

    | mpartition | Creates an MS-DOS partition. |

    | mrd | Removes an MS-DOS subdirectory. |

    | mren | Renames an MS-DOS file or directory. |

    | mtoolest | Tests Mtools configuration. |


    # Mount MS-DOS Media and Partitions


    Rather than use Mtools, you can use the support for MS-DOS file systems that is
    built into LINUX. You mount the MS-DOS file system just like any other file system,
    and then you treat it like part of the LINUX file hierarchy.


    # Mounting hard disk partitions


    If you have an MS-DOS file system on your LINUX computer, you can keep it. Just
    follow these steps:


    +   1. Log on as root.

    2. Create a mount point directory using mkdir.

    3. Edit /etc/fstab and add a mount line for the appropriate device and mount point.
    See the following table for examples of the fields in this line.

    4. Save the updated version of /etc/fstab.

    5. Type mount -a to force a reread of /etc/fstab.


    | Field | Function |

    | --- | --- |

    | Device | The device name of the partition. |

    | Mount point | Name of the directory where the file system is to be mounted.
    |

    | Filesystem type | Type of file system to use. msdos for MS-DOS partition. |

    | Options | How it should be mounted. Using default is safe. |

    | Dump frequency | Use 0 if you don''t want this partition to be included in standard
    dumps. |

    | fsck order | Use 0. |'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# Working with Mac Media


    For example, if your second partition on your first hard drive (/dev/hda2) has
    an MS-DOS file system on it and you want it to be automatically mounted in the
    directory /dosC whenever you boot up LINUX, add this line to /etc/fstab:


    ```

    /dev/hda2 /dosC msdos default 0 0

    ```


    You can back up MS-DOS file systems by mounting them under LINUX and using LINUX
    backup utilities such as tar or cpio to back them up.


    # Mounting and unmounting removable media


    The following command mounts an MS-DOS floppy in a directory called /mnt/dos.
    Make sure that the directory /mnt/dos exists before attempting the mount.


    ```

    mount -t msdos /mnt/dos /dev/fd0

    ```


    To unmount, make sure that you are no longer in any directory on the disk. The
    command is as follows:


    ```

    umount /mnt/dos

    ```


    If you add an entry to /etc/fstab for your floppy device and allow user, then
    any user can mount and unmount MS-DOS disks. For example, the command should look
    like the following: /dosA /dev/fd0 msdos user,noauto 0 0


    Users can mount a floppy by typing mount /dosA.


    DOS uses a two-character sequence consisting of a Return followed by a Newline
    to separate lines in a text file. UNIX and LINUX use only a Newline character.
    The tr command can be used to delete the Return characters. For example, to copy
    the textfile.dos tofile.linux deleting the Return characters in the process (whose
    value is octal 15), use the command tr -d ''\015'' <textfile.dos >textfile.linux.


    # Working with Mac Media


    You can use a set of tools similar to Mtools to work with Mac HFS volumes. You
    must first mount the HFS volume using hmount; then you can use all the other utilities
    to work with the data.


    # hcd — Changing the HFS working directory


    hcd changes the current working directory on the Mac disk.


    ![](img/74a57ca3470b31765a6f932d60bcc72e_156_0.png)'
