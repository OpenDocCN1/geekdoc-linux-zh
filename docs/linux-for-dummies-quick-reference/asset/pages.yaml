- img_proc: true
  md: '# 22 Files Associated with a Program


    # Connecting commands


    Many commands can read from standard input and write to standard output. LINUX
    calls commands that can do this filters. The names come from the fact that they
    are filtering whatever comes in to produce whatever is supposed to come out.


    Filters allow commands to connect to other commands through pipes or to become
    part of a pipeline. When using the pipe character (|) with two commands, the pipe
    connects the output of the left-hand command to the input of the right-hand command.
    For example, ls -la | less pipes the output of the file list command (ls) into
    the input of the less command, which allows you to scroll back and forth through
    the file listing.


    System resources present the only limitation on how many commands can be connected
    together in this way. For example, the grep command is a filter. Read standard
    input, apply some selection criteria to the input, and then select the selected
    information to standard output. The following pipeline can run the program monthly,
    filter output through grep (in this case, looking for lines with the word super
    in them), and display the selected lines on the screen.


    monthly | grep super


    # Redirecting command output


    The > operator is used to redirect the output of a command to a file or device.
    For example, to cause the output of the program monthly to be redirected to a
    new file called monthly.output, you would enter the command


    monthly > monthly.output


    If you want to append to an existing file, use the >> operator. Working with this
    example, if you want to append to an existing file called monthly.output rather
    than create a new file,


    monthly >> monthly.output


    If monthly.output does not exist, >> acts just like > and creates a new file.


    The filename /dev/tty is a special name that always points at your screen. If
    you write a shell script in which you want the output of one command to come back
    to the screen no matter where stdout and stderr are redirected, redirect that
    command''s output to /dev/tty.


    ![](img/74a57ca3470b31765a6f932d60bcc72e_39_0.png)'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# File Naming Conventions


    # Redirecting command input


    To indicate that the input for a command is to come from a file rather than your
    keyboard, you use the < operator. For example, to run a program named monthly
    and have it read from the file input.data,


    monthly < input.data


    You can combine input redirection with other redirection. To run monthly with
    its input coming from input.data, its output sent to monthly.output, and its error
    output coming back to the screen (a pretty typical situation), use


    monthly < input.data > monthly.output


    # Redirecting error messages


    If you want to redirect the error messages from a program to a file, for example,
    use the 2> operator. if you want the error messages from program monthly to be
    sent to monthly.errors, use


    monthly 2> monthly.errors


    You can redirect stderr and stdout to different places. For example, to append
    the standard output of monthly to monthly.output and send the error messages to
    monthly.errors,


    monthly >> monthly.output 2> monthly.errors


    If you want to run a command and redirect both stdout and stderr, you need to
    use the command 2>&1, which means, essentially, "redirect output 2 to the same
    place as output stream 1." For example, to redirect the stdout and stderr of monthly
    to monthly.both, you would use


    monthly >monthly.both 2&1


    ![](img/74a57ca3470b31765a6f932d60bcc72e_40_0.png)


    # File Naming Conventions


    LINUX does not impose any structure on the name of a file — other than prohibiting
    the use of a slash character (/) in a filename, and requiring the length of the
    filename to be fewer than 256 characters. Although this state of anarchy may sound
    desirable to some, you should follow certain file-naming conventions to keep yourself
    out of trouble. When in doubt, keep filenames simple.


    In LINUX, filenames are case-sensitive. The file carrot is different from Carrot,
    CARROT, or cArrot. These three files may all live together in the same directory.


    ![](img/74a57ca3470b31765a6f932d60bcc72e_40_1.png)'
  merge: -1
  pgno: 40
