    # Exiting Emacs


    To exit Emacs, simply follow these steps:


    +   1. Press Ctrl+X, Ctrl+S to save your work.

    2. Press Ctrl+X, Ctrl+C to exit to the shell.


    # Starting Emacs


    Just type emacs to get started. If you want to create a new file or edit an existing
    file, type

    emacs file

    Emacs starts up and displays the file starting at the beginning.


    # Editing Text with vi


    vi (which stands for visual editor, originally written by Bill Joy) is really
    just a Visual front end on top of the capabilities of ed, a line editor. Most
    people have a hate-love relationship with vi. They realize that vi helps them
    edit faster than ever before. So even though vi can be maddeningly complex, users
    can''t help loving it.


    # Defining vi in modes


    vi is a modal editor. This means that when you are in command mode, all the standard
    keyboard keys perform editing functions. You can always press Esc to get into
    command mode. If you are already in command mode when you press Esc, vi beeps
    but no harm is done.


    This idea of modal editors used to be very popular but the introduction of WYWYWY
    word processors has made the use of modes almost nonexistent. (First, I''ll attempt
    to clear up any confusion about modes before we get into the details of vi.)


    Modes can increase your efficiency. If you do a lot of work before changing modes,
    then you can decrease the number of keystrokes you need to accomplish a task.


    vi offers two modes — one to enter text and one to edit text. These modes are
    called insert mode and command mode.'
  merge: -1
  pgno: 121
- img_proc: true
  md: '# Editing Text with vi


    +   When you type something in input mode, that entry is inserted into the file
    you are editing. A host of commands can get you into input mode, 1 being the most
    popular.


    +   When you type something in command mode, it is interpreted as a command to
    vi. One command, Esc, gets you into command mode.


    # Deleting text


    To delete text, simply follow these steps:


    +   1. Move the cursor to the character that you want to delete.


    +   2. Type x.


    vi deletes the character and moves the remainder of the line to the left.


    To delete a line, move the cursor to it and type dd.


    If you want to replace a single character, you don''t have to delete it and then
    insert its replacement. Simply type r followed by the replacement character.


    # Exiting vi


    Follow these steps to exit vi:


    +   1. Press Esc to get into or make sure that you are in command mode.


    +   2. Type ZZ to exit and return to the shell prompt.


    vi saves your file, if you have modified it, before exiting.


    It is common practice for users to exit vi by typing :wq followed by Enter. There
    are two things wrong with this. One is that the w tells us to unconditionally
    write the file. This means that the last modify date the system maintains is updated,
    even if there were no changes to the file. On the other hand, ZZ writes the file
    only if it has been modified. The second thing wrong with this exit technique
    is that you should never use four keystrokes when three will do.


    If you don''t want to save your changes, type :q! and press Enter. vi exits without
    making the changes to your file.


    If you want to save without exiting the editor, type :w and press Enter. vi saves
    your current file at this point and allows you to continue editing.'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# Editing Text with vi


    # Inserting text from other places


    Why invent text when you already have what you need somewhere else? Sometimes,
    the best source of text is from another file or from the output of a command.
    vi makes including either source into the file you are editing easy.


    +   * If you want to read another file into your current editing session, type
    :r filename and press Enter. The file will be read at the current cursor location.


    +   * Ever wonder how people write books on LINUX manage to include all the examples
    of command output? You can include the output of a command in your current editing
    session by typing :r command and pressing Enter.


    # Recovering from a mistake


    Don''t panic if you make a typo and part of your file vanishes. Just type U and
    undoes your last change. And, of course, if you decide that you don''t really
    want to undo your last change, just type U again, and undoes what it just did.


    If you have been editing on one line and decide you want to start over, type U.
    U undoes all of your changes on that line (since you got there).


    # Repeating commands


    To repeat commands, follow these steps:


    +   1. Enter the number of times you want the command repeated.


    +   2. Enter the command.


    For example, to delete ten words, really type 10dw.


    When you enter 10dw, you really tell vi to perform 10 deletes of one word. You
    can also say d10w, which tells vi to do one delete of ten words. You can do five
    deletes of two words with 5d2w. Yes, this works.


    Assume that you have a document in which you want to change but not all of the
    occurrences of fly to drive. You can combine the n and . (dot) commands. (The
    command repeats the last replacement command.) First, search for fly using the
    / command. Then, use n to search again. After you have found an occurrence you
    want to use, use the cw command to make the change. You can now use n and . to
    continue your seek-and-destroy mission.


