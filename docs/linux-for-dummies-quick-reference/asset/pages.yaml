  md: '# Usenet Newsgroups


    www.linuxjournal.com — Monthly magazine published in the United States.


    www.linuxgazette.com — Monthly online LINUX magazine. You can read the magazine
    online or download it and read it at your leisure.


    # Usenet Newsgroups


    A whole host of online newsgroups gather to discuss LINUX. Some of the groups
    are moderated, which means they have specific requirements and the content must
    pass muster with a moderator, but most of the groups welcome general postings.
    The following list provides names of some available newsgroups and the general
    topics under discussion. You may be able to find more LINUX-related newsgroups,
    some of which may be local to your newsfeed.


    +   - alt.os.linux.caldera — Postings specific to the Caldera LINUX distribution


    +   - alt.os.linux.slackware — Postings specific to the Slack LINUX distribution


    +   - comp.os.linux.advocac — Benefits of LINUX compared with other operating
    systems


    +   - comp.os.linux.alpha — LINUX on Digital Alpha machines


    +   - comp.os.linux.announce — Announcements important to the LINUX community
    (moderated)


    +   - comp.os.linux.answers — FAQs, HOWTOs, READMEs, and other information about
    LINUX (moderated)


    +   - comp.os.linux.development.apps — Writing LINUX applications; porting to
    LINUX


    +   - comp.os.linux.development.system — LINUX kernels, device drivers, and modules


    +   - comp.os.linux.hardware — Hardware compatibility with the LINUX operating
    system


    +   - comp.os.linux.m68k — LINUX operating system on 680x0 Amiga, Atari, VME


    +   - comp.os.linux.misc — LINUX-specific topics not covered by other groups


    +   - comp.os.linux.networking — Networking and communications under LINUX'
