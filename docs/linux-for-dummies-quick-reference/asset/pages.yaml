  md: '# Managing E-Mail with elm


    Rather than select a message with the cursor keys, you can do the following:


    +   * Search for a keyword in the Subject or From line, using / as you do in vi.

    * Select a particular message by typing its number and then pressing Enter.

    * Search the body of the messages for a string by typing // and typing the string,
    and then pressing Enter.


    # Reading other mail files


    By default, elm accesses your incoming mail file. This file is known as /var/spool/mail/name,
    where name corresponds to your login name. To make elm read and read from another
    file, follow these steps:


    +   1. Type c. elm prompts you with Change to which folder.

    2. Enter the name of the file you want to read and press Enter. You can type =name
    to specify a file named name in your $HOME/Mail directory.


    If you want elm to read a different mail file when you start it, you can specify
    a filename using the :f option. For example, to read mail from the file ~garbonzo/Mail/beans,
    enter elm -f ~garbonzo/Mail/beans.


    A shortcut for changing back to your default mail folder is to enter ! at the
    Change to which folder: prompt.


    # Saving a message


    By default, elm saves e-mail in the $HOME/Mail directory. elm assumes you usually
    want to save messages in the file whose name matches the name of the sender. You
    specify the directory in which you want elm to save your messages by preceding
    the filename with =.


    Follow these steps to save an e-mail message:


    +   1. If you are not already in elm, type elm.

    2. Use the cursor keys or a search to find the message you want to save.

    3. Type s.

    4. elm suggests a filename. If you like the suggestion, just press Enter. Otherwise,
    type the filename and press Enter. If the file already exists, elm appends the
    message to the file.


