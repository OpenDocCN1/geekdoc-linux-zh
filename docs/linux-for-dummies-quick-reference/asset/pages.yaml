  md: '# 32 Archiving, Converting, and Other File Manipulation


    # Archiving, Converting, and Other File Manipulation


    This section shows you how to work with files within files and with compressed
    files. If the idea of a file in files sounds strange, consider a file backup,
    which is the process of copying a bunch of files onto a single place.


    # cpio — Creating and restoring archive files


    Although tar has always been the workhorse of backups, the archiving command has
    its limitations, such as the length of the pathnames it can handle. As a solution,
    cpio was introduced in UNIX System V. Today''s tar has additional options and
    cpio can work with different archive formats, including tar archives. Criteria
    for selecting between cpio and tar archive include:


    +   * cpio format is more portable between different types of computers.

    * tar is easiest to use for backing up a complete file hierarchy.

    * cpio is much more flexible because it uses an external program or file to specify
    which files to archive.

    * tar is available on more computer systems (for example, the suntar program for
    the Mac) than cpio.


    The cpio command has three modes:


    +   * Copy in: Lists the contents of an archive or restores files from an archive.
    The i option specifies copy in. Use it to restrict the operation to a list of
    the contents.

    * Copy out: Creates an archive. Use o to specify this mode.

    * Pass-through: Copies a piece of the file hierarchy from one place to another.
    Use -p to specify this mode.


    ```

    Copy in: cpio -i [-d] [-F file] [-H fmt] [-m] [-t]

    [-u] <archive> pat

    Copy out: cpio -o [-a] [-F file] [-H fmt] [-v]

    <file_list> archive

    Pass-through: cpio -p [a] [d] [v] <file_list> dest_dir

    ```


    | Option or Argument | Function |

    | -a | Restores file access times after copying. |

    | -d | Creates directories as needed. |'
  merge: -1
  pgno: 49
- img_proc: true
  md: '# Archiving, Converting, and Other File Manipulation 33


    | Option or Argument | Function |

    | :--- | :--- |

    | -F file | Uses file as archive rather than stdin or stdout. |

    | -H fmt | Designates the archive format. You should use new unless you need to
    write an archive''s compatible with a system that can''t handle the new POSIX
    standard. (See also Part I.) | |

    | -m | Retains the modification time of the file when it was archived. |

    | -t | Displays only the archive''s table of contents — does not restore any files.
    |

    | -u | Unconditionally restores the selected files. By default, cpio does overwrite
    a file that is newer than the one being restored. |

    | -v | Verbose — lists each filename (or file details if used with -t) as the
    file being processed. |

    | archive | The file you create in copy out mode or the file you read in copy
    mode. |

    | dest_dir | The directory to which cpio copies the selected hierarchy. |

    | file_list | A list of filenames to be selected. |

    | pat | A regular expression-based pattern to select files. Quote this to prevent
    interpretation by the shell |


    If you want to back up all the files in the hierarchy under your home directory
    to a tape (/dev/tape), you can change to your home directory and then use the
    following commands (note that I first use find to produce the list of filenames):


    ```

    find . -print | cpio -oa /dev/tape

    ```


    To verify the contents of the tape, use the following command:


    ```

    cpio -itv </dev/tape

    ```


    Now, suppose that you accidentally deleted all the files whose names end with
    .favorite from your Vegetables subdirectory. The following command restores those
    files and preserves their last modification time. Note that I quote the pattern
    so the shell does not interpret the *


    ```

    cpio -imv </dev/tape ''Vegetables/*.favorite''

    ```


    It is very likely that the devices related to backups will not have read/write
    permission. If you want to allow users to access these devices, you need to change
    the permissions (see also chmod — Changing file permissions, in this part). For
    example, to enter the following: chmod 666 /dev/fd0


    ![](img/74a57ca3470b31765a6f932d60bcc72e_50_0.png)


    ![](img/74a57ca3470b31765a6f932d60bcc72e_50_1.png)'
