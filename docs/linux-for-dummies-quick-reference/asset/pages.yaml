    # Setting up files in the run level directories


    The init program handles run level changes. When that happens, init will do the
    following:


    +   - Execute all the scripts in the directory of the old run level that start
    with the letter K; init executes scripts in the order they are displayed in the
    output of the ls command.

    - Execute all the scripts in the directory of the new run level that start with
    the letter S; init executes scripts in the order they are displayed in the output
    of the ls command.


    For example, assume that you are in run level 2 and you are going to run level
    3. Also assume that the files in the rc2.d directory are K10_undount, S10_doit,
    and S20_startgoodstuff, and that the files in the rc3.d directory are K10_nfs,
    K20_rpc, K30 zap. S10, S20_rpc, and S40_greet. init executes rc2.d/K10_undount,
    rc3.d/S10_nfs, rc3.d/S20_rpc, and finally rc3.d/S40_greet.'
