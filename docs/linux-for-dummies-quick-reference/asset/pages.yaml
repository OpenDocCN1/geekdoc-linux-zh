  md: '# Acknowledgments


    As I update the original work to produce the second edition of this book, I have
    some additions to the list of thank you. The first is Laurie Tucker, who is acting
    as my liaison between the world of LINUX and a piece of foreign software called
    Microsoft Word.


    The other humans involved in the second edition are Susan Christopherson, Steve
    Hayes, and Steve Manes. These three have worked with me to help make an impossible
    schedule possible. In addition, the humans I work with at SSC have been a big
    help by offering input and also letting me take the time to finish this second
    edition.


    Making the second edition possible was the work of the editorial and production
    team for the first edition. Thanks, guys.


    One final person needs to be thanked, and that''s Linus Torvalds. I have worked
    with computers for more than 30 years and enjoyed much of it, but computing (and
    drinking beer) became really fun thanks to Linus and the LINUX community that
    has formed around his work.


    There has also been a lot of help from nonhumans. This entire manuscript was developed
    using the vi text editor and spell checked using ispell on a LINUX system. Although
    some see a WYSIWYG word processor as the way to go, you can''t beat the speed
    and ease of use of a basic text editor. Of course, 15 years of using vi as my
    editor of choice may also help.'
  merge: -1
