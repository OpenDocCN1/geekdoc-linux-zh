    # Working with the System


    This section covers how you interact with the operating system — how to terminate
    a shell, change your password, find out which processes end users are currently
    running, and add and remove file systems.


    # exit — Leaving a shell


    When you log on, you enter a shell. You can enter subshells by running shells
    or by typing the name of a shell as a command. The exit command instructs your
    current shell to terminate. If you leave your login shell, you log off. You can
    optionally specify a return value (0–255) for the exiting shell to return its
    exit status.


    ```

    exit [value]

    ```'
