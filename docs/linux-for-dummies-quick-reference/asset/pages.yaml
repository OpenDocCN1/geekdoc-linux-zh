    # Tagging messages


    You may at times want to save or print a whole set of messages to one place. Rather
    than save each message individually, you can tag each message that you want to
    save. The save command works with the tagged messages rather than just the current
    message. To tag a message, follow these steps:


    +   1. Move to the message by using the arrow keys or by entering the message
