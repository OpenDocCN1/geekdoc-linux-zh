    The term *in focus* is used to describe the status of an active window. The border
    of the window currently in focus appears in a different color in order to identify
    it as the active window. The three focus methods are as follows:


    +   * **Click-to-focus:** You must move the mouse into a window and click in order
    to bring it into focus.

    * **Focus-follows-mouse:** You only need to move the mouse to a window in order
    to make it active.

    * **Sloppy focus:** This focus method (available only in FVWM95) offers a combination
    of the other two methods. Focus follows the mouse to other windows, but if you
    move to the root window, the focus stays in the most recently active window.'
