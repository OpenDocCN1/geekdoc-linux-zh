    +   2. Type t. A + sign appears to the left of the message number to indicate
    that it is tagged. To untag an already tagged message, type t again.


    # Using elm options


    elm is very configurable. To change its basic options, you must use the options
    menu. To edit an option, follow these steps:


    +   1. Enter the letter shown at the left of the option you want to change.


    +   2. If the option is a selection from a set of values, press the spacebar until
    the desired value appears and then press Enter. Otherwise, type the new value
    and press Enter.


    +   3. Type > to make your option permanent, or type i to discard your changes.
    pine


    # Managing E-Mail with pine


    pine evolved from elm. It was designed to idiot proofed and comes pretty close.
    (pine, by the way, is copyrighted by the University of Washington.) But pine tends
    to frustrate more serious users by default it assumes that you don''t know what
    you are doing and asks you a lot of questions.


    pine outdoes elm in one important way: In pine, you can seamlessly attach other
    types of files to your mail message. (These attachments are known as metail attachments.)


    When you invoke pine, it changes directories to your home directory. Therefore,
    if you need to enter a filename (for an attachment, for example), you must enter
    its pathname relative to your home directory rather than the directory that was
    current when you invoked pine. If you need help locating a file, press Ctrl-T
    to start the pine file navigator.'
