  md: '# Deciphering Network Addressing


    # Deciphering Network Addressing


    Computers on any network (the Internet being the biggest example) use an assortment
    of network addressing methods. For a more detailed look at network addressing,
    check out Linux SECRETS, 2nd Edition (IDG Books Worldwide, Inc.) or the Linux
    Network Administrators Manual available on the LINUX Documentation pages (click
    LDP on www.linuxresources.com).


    # Domain addresses


    Rather than to remember the IP address of a computer system, we humans would rather
    remember a name. That’s when domains come handy. A domain is a symbolic name that
    can be used to refer to a particular IP address.


    Multiple domain names can refer to the same IP address, and multiple domain names
    can refer to different IP addresses on the same machine. Check out www.linuxjournal.com
    and www.linuxresources.com as an example. These two URLs take you to the same
    machine but on a different home page.


    To establish a domain name, you need to register with the Internic at rs.internic.net.


    # IP addresses


    All machines on the Internet (and most likely on your local network as we) have
    IP (Internet Protocol) addresses. An IP address is composed of four numbers, ranging
    from zero to 255, which are written in dotted quad quotation. This means that
    the four numbers are written as a string with dots separating each of them. For
    example, 198.186.207.128 is the IP address of one of my computers.


    It is possible, and sometimes desirable, to have multiple IP addresses assigned
    to the same machine. A common use for this is when you want your Web server to
    do something differently depending on the address you access it from (display
    a different home page, for example).


    # Nameservers


    When you register your domain name, you need to specify the IP addresses of at
    least two nameservers (machines that have the information necessary to map your
    domain name to the IP address'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# ftp — Transferring Files 145


    of the computer that the message should be delivered to). Nameservers must be
    able to respond to queries from other nameservers so that the name-to-address
    translation is available wherever needed. Mapping between IP addresses and hardware
    addresses is handled by Address Resolution Protocol (ARP) and Reverse ARP.


    # ftp — Transferring Files


    FTP (file transfer protocol) is the most common way to send and receive files
    over the Internet. You can also use it on a local network. To avoid some ftp-versus-FTP
    confusion, ftp is the name of the program in LINUX and FTP is the general process.)


    To use FTP, you need an account on a remote machine. You can log in to many public
    servers with the user name anonymous and receive files.


    ```

    ftp [-d] [-g] [-i] [-n] [-v] [host]

    ```


    | Option or Argument | Function |

    | --- | --- |

    | -d | Enables debug mode. |

    | -g | Disables wildcard expansion of file names (also known as globbing in UNIXspeak).
    |

    | -i | Turns off interactive prompting during multifile transfers. |

    | -n | Instructs program not to attempt auto-login. ftp normally prompts you with
    a guess at your login name and allows you to press Enter if you are happy with
    it. In this mode, no login attempt is made and you will have to type user at the
    ftp prompt. |

    | -v | Shows all responses from the remote server and transfer statistics. |

    | host | The name of the machine you want to connect to. If you omit host, ftp
    asks for the machine name. |


    # Connecting to anonymous FTP servers


    An anonymous FTP session is just like a regular FTP session except that you don''t
    need your own account. Many servers (such as sunsite.unc.edu) offer anonymous
    FTP so that you can access publicly available files. For example, all of LINIX
    is available via anonymous FTP from Sunsite and hundreds of other anonymous servers.


    Follow these steps to connect to an anonymous FTP server:'
