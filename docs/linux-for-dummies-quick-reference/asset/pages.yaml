  md: '# Text Editors and Working with Text


    You use text editors to write and edit messages and other text files. Text editors,
    however, are not word processors. They allow you to edit text files, but they
    do not offer sophisticated commands to format text. If you need such formatting,
    you can either look for a WYSIWYG word processor such as Word Perfect, Apprixware,
    or StarOffice or use a text formatter such as LaTeX or groff, both of which are
    included with your LINUX system.


    # In this part ...


    +   - Using Pico or joe to work with text

    - Editing (the industrial-strength kind) with vi and Emacs

    - Formatting text with fmt and groff

    - Checking your spelling with ispell


    ![](img/74a57ca3470b31765a6f932d60bcc72e_112_0.png)'
  merge: -1
