  md: '# Customizing the Environment


    located. The easiest way to pass this information would be to set some environment
    variables. Whenever the shell starts the scripts, the scripts can just read in
    the values.


    ```

    export veg_ADDRESSES=~/Addr/veggie

    export RECIPES=~/Recipes/Veg

    ```


    # Setting environment variables


    Environment variables are saved in such a way that are available to any shell
    that is a child of the current shell. Thus, environment variables are the right
    place to save things such as your search path and the name of your printer.


    ```

    export var=value

    or

    var=value

    export var

    ```


    The order of the commands doesn''t matter in the preceding example. The export
    statement performs the binding. If the shell variable is already set, its current
    value is exported to the environment. If the value is changed at a later time,
    the environment variable follows the value of the shell variable.


    | Option or Argument | Function |

    | var | Name of the variable to set. |

    | value | A string value to be assigned. You must quote value if it contains spaces
    or other characters that have special meaning to the shell. |


    If you want to invoke one command with a different value for either a shell or
    environment variable, but not change its value subsequent to that, you can specify
    the variable value on the command line. For example, to run a script called way
    cool with the PRINTER variable set to fastone, just type PRINTER=fastone way_cool.


    # Setting shell editing modes


    With the Bash and Kern shells, you have your choice whether to use-vi or Emacs-style
    command line editing (see also Part V). My advice is that if you use the vi or
    Emacs text editor, set your shell to the editing mode matches your editor (which
    will help you get more comfortable with your editor). If you don''t currently
    use either editor, try each mode and pick the one that you are most comfortable
    with.'
