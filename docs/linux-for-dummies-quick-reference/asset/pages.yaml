    | Option or Argument | Function |

    |---|---|

    | -l user | Sets login name on the remote system to user. The default is your
    current login name on the local system |

    | n | Redirects standard input from /dev/null. This means that if the program
    you are executing remotely attempts to read from standard input, it will receive
    an end of file. |

    | command | The shell command to run on the remote computer. If you don''t specify
    a command, rsh acts just like rlogin and starts a shell on the remote host. |

    | host | Name of the remote computer. |


