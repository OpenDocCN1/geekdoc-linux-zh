- img_proc: true
  md: '# What is LINUX?


    # What Is LINUX?


    LINUX is a multiuser, multitasking operating system that runs on PCs as well as
    many other computers. It implements a superset of the POSIX (IEEE P1003.x) operating
    system standard that was created in order to document a standard set of UNIX capabilities.
    LINUX includes all these capabilities, plus it draws on the best capabilities
    of BSD UNIX and System V to offer a well-rounded and capable operating system.
    LINUX also interoperates with other systems, including Microsoft Windows, MacOS,
    UNIX, and Novell NetWare.


    LINUX was the brainchild of a college student named Linus Torvalds. In 1990, while
    a computer science student at the University of Helsinki in Finland, Torvalds
    decided that writing a UNIX-operating system would be interesting. Over the following
    years, LINUX grew from one person''s idea into a personal experiment and widely
    effort by thousands of people around the world to write a UNIX clone.


    Today, millions of people use LINUX. Some individuals are using it as a way to
    learn about operating systems. However, many businesses also depend on LINUX for
    a number of applications. LINUX is currently used on desktops at companies as
    large and well-known as Hewlett-Packard, in embedded systems such as Point of
    Sale from Schlumberger, and by Internet Service Providers worldwide.


    Some of LINUX''s strengths include the following:


    +   **Adaptability**: The source code for LINUX is freely available to anyone.
    This means you can make modifications to the code to add other capabilities or
    enable LINUX to work with unique hardware.


    +   **Interoperability**: LINUX-based systems can be connected to most other computer
    platforms.


    +   **Price**: Much of the code in LINUX is licensed under the GNU Public License
    (GPL). The GPL ensures that the code can be redistributed, whether you get it
    off the Internet, an archive CD, or a commercial CD, you still have the right
    to share or redistribute it.


    LINUX has the look, feel, and smell of a UNIX system. What distinguishes it from
    a commercial version of UNIX is that it is not a product of a company or of an
    individual, but rather the result of a cooperative effort on the part of developers
    and users worldwide to produce something that meets their own computing requirements.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Selecting a LINUX Flavor


    Unlike most commercial software development, LINUX has no “marketing department”
    dictating what it users need. Development follows the path set by Torvalds (considered
    a minor deity in many developer circles) and “kernel-hacking cabal.” The introduction
    of new features into LINUX is spontaneous and dynamic, and is dominated by a casual
    mob rule among techno-geeks on the Internet.


    # Selecting a LINUX Flavor


    Much like UNIX versions and very unlike Microsoft operating systems, multiple
    flavors (formally known as *distributions*) of LINUX are available. These flavors
    (or versions or distributions, whichever you prefer), come from various companies
    and organizations.


    To make a distribution, a vendor takes the basic LINUX operating system and utility
    programs and adds value to the system and programs. This added value is generally
    a combination of the vendor''s installation method, some proprietary programs,
    and technical support.


    The difference between the distributions is in many ways like the difference between
    a Ford and a Chevy — they work pretty much the same, just with a different “nameplate”
    and a few different features. The most popular distributions today are the following:


    +   **Caldera**: A series of proprietary distributions that include LINUX and
    additional licensed software from Caldera Corporation. Information on Caldera
    is available at www.caldera.com. (**Note**: The whole distribution is not available
    on the Web site — just some information and a few parts.)


    +   **Debian**: A completely free distribution put together by a set of volunteers.
    Information on Debian is available at www.debian.org.


    +   **Red Hat**: A very popular commercial distribution that is available for
    free. Information on Red Hat is available at www.redhat.com.


    +   **Slackware**: Another commercial distribution, which is also available for
    free. Information on Slackware is available at www.cdrom.com.


    +   **S.u.S.E.**: The most popular commercial distribution in Germany and is now
    available in the U.S. Very complete. ww.suse.com.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Selecting a LINUX Flavor


    Most of these distributions, minus the technical support, are available for free.
    The exact versions of Red Hat and Slackware that you can buy are also available
    for free.


    No single distribution is right for everyone. Among various LINUX distributions,
    differences exist in cost, included such as installation methods and add-programs,
    supported formats, and user support. For example, some versions of Caldera include
    Netscape web server and StarOffice office suite. If you need these products, purchasing
    Caldera is probably the right choice. On the other hand, if you want to be a part
    of the cooperative evolution of LINUX itself, Debian may be the best choice.


    In any case, all the products are based on the same LINUX kernel and programs.
    Because of the GNU general public license, programmers who make innovations or
    improvements to the LINUX source code make those changes to all LINUX users.


    Some vendors produce LINUX archive CDs, which contain an assortment of LINUX software
    from various sites on the Internet. A typical archive set may contain the Debian,
    Red Hat, and Slackware distributions, along with other LINUX software. Archive
    CDs usually sell for around $25. The following are the two most popular archive
    CD packages:


    +   * InfoMagic at www.infomagic.com

    * Pacific HighTech at www.pht.com


    Besides being able to purchase a LINUX distribution on CD, you can download copies
    from many ftp sites on the Internet. Two popular examples are the following:


    +   * sunsite.unc.edu — Sunsite offers http as well as ftp access to the LINUX
    Documentation Project pages at sunsite.unc.edu/LDP, and is mirrored at many other
    sites, including www.linuxresources.com.

    * tsx-11.mit.edu — ftp access only. This site typically contains more of the cutting-edge
    development releases of software than does Sunsite.


    If you elect to download LINUX over the Internet, find a site that has the distribution
    you are interested in and follow the download directions. For example, to download
    Debian, point your browser at www.debian.org. From that page, you can find a download
    location near you and go for it.


    On the practical side of things, however, you are generally better off to get
    a LINUX CD. The CDs are expensive and the sheer volume of LINUX software makes
    downloading a serious time commitment.'
  merge: -1
