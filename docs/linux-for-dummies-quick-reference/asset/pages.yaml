    # Conventions using dash and double dash


    UNIX offers single-letter command options that follow a dash ( ) and LINUX continues
    this tradition. LINUX also GNU-style options for many commands, which consist
    of two dashes--) followed by a word. For example, if you want to list all the
    files in a directory, you can type ls -a or ls --all.


    Any command that supports the GNU-style options should support the --help option.
    This option instructs the command to display a message listing all its options,
    and then exit.


    Many commands can read from standard input — either from the keyboard or from
    where you have redirected the command (see also Part II). Leaving out a filename
    or substituting a dash (-) for a filename usually gets the command to read from
    standard input.


    # cp — Copying files and directories


    In its simplest form, cp copies a file. This command can also copy a set of files
    to directories.


    ```

    cp [ f ] [ i ] [-p] [-v] source_file dest_file

    cp [-f] [-i] [-p] [ v ] source_files directory

    ```


    | Option | Function |

    | -f | Forces overwriting existing files. |

    | -i | Interactively prompts whether to overwrite an existing file. |

    | -p | Preserves the original file characteristics including owner, permissions,
    and last modify time. |

    | -R | Recursively copies directories as well as regular files. |

    | -u | Overwrites a file only if the file being copied is newer than the destination
    file. cp into a mini-archiver. |

    | v | Verbose mode. Prints the name of each file as it is copied. |


