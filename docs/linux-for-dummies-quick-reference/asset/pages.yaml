    keyword=value. |

    | host | Hostname to look up. If you don''t specify host, nslookup enters interactive
    mode. |

    | server | Nameserver to use for the lookup. |


    If you attempt a lookup using nslookup host and you get a > prompt, your version
    of nslookup does not support this mode. Abort nslookup (use your kill character
    or press Ctrl+D). Then, type nslookup and press Enter.


    nslookup supports the following options. You enter them on the command line or
    following the keyword set while in interactive mode.


    | Option | Meaning |

