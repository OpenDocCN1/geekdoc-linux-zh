  md: '# Working with MS-DOS Media


    # Working with MS-DOS Media


    You can work with MS-DOS files in one of two ways: by using what are called Mtools,
    or by mounting the disk and just using regular LINUX commands.


    # Mtools basics


    Mtools are a series of commands specifically written to act like the standard
    MS-DOS file manipulation commands. They are called Mtools because they are designed
    to work with MS-DOS files. The actual command names are just the MS-DOS command
    names with an m in front of them.


    +   * Mtools support VFAT (long style) filenames. If the specified filename does
    not fit into the 8.3 format of the standard MS-DOS, Mtools create a VFAT name
    and an appropriate short name. The original name is called the primary name; J
    is the secondary; any derived name is called the secondary name.


    +   * You refer to the MS-DOS file systems by device names. By default, A is the
    first floppy disk, B is the second, and J is a Jaz drive (if available), Z is
    a Zip drive (available).


    +   * Mtools wildcards work the way they do in LINUX. That is, the * character
    matches all files as it would with LINUX, unlike MS-DOS, for which you use *.


    +   * Precede filenames with a drive letter and a colon (for example, you can
    use a:) to tell Mtools that the files are on an MS-DOS device. Otherwise, Mtools
    assumes that they are on the LINUX file system.


    +   * Mtools supports most high-capacity disk format schemes.


    +   * You use the /etc/mtools.conf and $HOME/.mtoolsrc configuration files to
    configure Mtools.


    All the Mtools programs use the following command-line options. Check out the
    mtools.1 man page for complete configuration information.


    | Option | Function |

    | -a | Renames the primary name if there is a conflict. |

    | -A | Renames the secondary name if there is a conflict. |

    | -m | Asks the user what to do with the primary name on conflict. |

    | M | Asks the user what to do with the secondary name on conflict. |

    | -O | Overwrites the primary name if there is a conflict. |'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# Working with MS-DOS Media 135


    | Option | Function |

    | - | - |

    | -0 | Overwrites the secondary name if there is a conflict. |

    | -S | Skips the primary name if there is a conflict. |

    | -S | Skips the secondary name if there is a conflict. |


    # mcd — Changing the current directory


    You use mcd to change the current directory on the MS-DOS device. The current
    information is saved in $HOME/.mcwd.


    ```

    mcd [dos_dir]

    ```


    | Argument | Function |

    | - | - |

    | dos_dir | Name of an MS-DOS directory or device (or both) to make current. If
    you do not specify a directory or device, mcd returns the name of the current
    directory. |


    # mcopy — Copying files between DOS disks


    The mcopy command copies files to and from DOS disks. It also handles any necessary
    filename conversions in the process (because of the limitations of filename length
    in MS-DOS).


    ```

    mcopy [-m] [-n] [-Q] [-t] source target

    mcopy [-m] [-n] [-t] dos_source

    ```


    | Option or Argument | Function |

    | - | - |

    | -m | Preserves file modification time. |

    | -n | Overwrites files without asking for confirmation. |

    | -Q | Quits if any copy fails. |

    | -t | Text transfer. Converts Return/Newline sequence to Newline only. |

    | source | A file or files to copy. If you specify multiple files, target must
    be a directory. |

    | target | Destination file for single file copies or a destination directory
    if you specify multiple files. |

    | dos_source | A file on an MS-DOS disk. mcopy copies the file to a file of the
    same name in the current LINUX directory. |


    # mdel — Deleting MS-DOS files


    The equivalent to the del command on MS-DOS, mdel deletes one or more files from
    an MS-DOS disk.'
