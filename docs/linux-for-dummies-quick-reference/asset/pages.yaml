- img_proc: true
  md: '# Working with Run Levels


    LINUX is a multi-tasking system. In normal operation, lots of processes, called
    daemons, run in the background to support the system users. Examples of some daemons
    are init, which sets up the multi-user environment; network daemons that handle
    NFS; telnet and login requests; sendmail, which queues and sends mail; and the
    print spool, which manages the print queues and delivers work to the printers.
    Because daemons are at work, you must stop them in an orderly fashion before shutting
    off your computer.


    # Adding a new start or kill file


    If you want to add something totally new to the init system, just follow these
    steps:


    +   1. Write a start and a kill script.

    2. Place the scripts in the `init.d` directory.


    +   3. Add links to them in the directory where you want them to be executed.
    Use a name that starts with S for startup, or K for kill.

    4. Type `telinit q` to get init to reread the script files.


    *See also* "Setting up files in the run level directories," in this section.


    # Changing run levels


    You use the `/sbin/telinit` program (which is generally just a link to `/sbin/init`)
    to change run levels. When the system boots, init starts with the run level specified
    in the entry in `/etc/inittab` that has an action of `initdefault`. Follow these
    steps if you want to change run levels:


    +   1. Log in as root.

    2. Type `telinit` followed by the desired run level (0 through 6).


    +   * If you have edited `/etc/inittab` or any of the script files and want init
    to re-read the files, type `telinit q`.

    * To switch to single user mode, type `telinit s`.


    Not all LINUX distributions use the same run-level definitions; however, run levels
    0, 1, and 6 are the same in Calder, Debian, Red Hat, and Slackware. Run levels
    2 through 5 are always multiuser but their specific use varies.'
