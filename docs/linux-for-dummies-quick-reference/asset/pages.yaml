  md: '# # Using Regular Expressions


    Regular expressions provide a way to quickly and concisely specify the criteria
    for matching or selecting a string of characters. (I could have probably filled
    an entire Quick Reference on regular expressions, but I had a feeling my editor
    wouldn''t let me.)


    You can use regular expressions for pattern matching in awk, ed, egrep, fg, grep,
    sed, and vi for starters. You can also call regular expression matching tools
    from C programs. After you understand the basics in this part, you are well on
    your way to becoming a regular expression guru.


    **In this part ...**


    +   - Understanding simple regular expressions

    - Combining regular expressions

    - Looking at some examples


    ![](img/74a57ca3470b31765a6f932d60bcc72e_204_0.png)'
  merge: -1
  pgno: 204
- img_proc: true
  md: '# Examining Simple Regular Expressions


    # Examining Simple Regular Expressions


    The regular expression matching mechanism attempts to find the longest match for
    the specified regular expression. A string of characters is the simplest regular
    expression. It matches one string, that being itself.

    You can add the expressions in the table that follows to expand upon what is matched.
    Simple expressions can also be combined to create more complex expressions such
    as the ones in the next section.


    | Expression | Meaning |

    | --- | --- |

    | c | Any character except the special characters / ( ) * | + ? [ ^ \$ matches
    itself |

    | \c | Matches special character c |

    | nnn | Matches char with ASCII value nnn octal (8) |

    | . | Matches any single character except a Newline |

    | [list] | Matches any character in list where list is one or more single chars
    or ranges specified with |

    | [^list] | Matches any char not in list |

    | ^ | Anchors pattern match to start of string |

    | $ | Anchors pattern match to end of string |


    # Combining Simple Regular Expressions


    When using a regular expression, the goal is to build one that matches what you
    are searching for or substituting. To build a more complicated regular expression,
    you can combine simple regular expressions. For example, the regular expression
    [09] matches a single digit. If you need to match a series of digits, adding a
    + to the simple expression turns it into a match for one or more digits.'
  merge: -1
  pgno: 205
- img_proc: true
  md: '# Samples of Basic Regular Expressions


    | Combination | Meaning |

    | --- | --- |

    | (re1)(re2) | Matches regular expression re1 concatenated with regular expression
    re2 |

    | re* | Matches 0 or more occurrences of the regular expression re |

    | re+ | Matches 1 or more occurrences of the regular expression re |

    | re? | Matches 0 or 1 occurrences of the regular expression re |

    | re1|re2 | Matches regular expression re1 or regular expression re2 |

    | (re) | Matches the regular expression re |

    | () | Ensures precedence of the expression — optional


    # Samples of Basic Regular Expressions


    Armed with the information in the previous two tables, I present you with some
    regular expressions so that you can put the theory into practice. The following
    table lists regular expressions and what they match:


    | Regular Expression | Matches |

    | --- | --- |

    | d?g | Any three-letter string that starts with d and ends with g |

    | ^From | Any string that begins with From |

    | ^$ | An empty line |

    | ^*YZ | Any line that begins with O or more of the character X followed by YZ.
    To ensure at least one X, use XX*YZ or X+YZ |

    | ^....m | Any string that has m as the fifth character |

    | [a-z]+ | Any string of one or more lowercase letters |

    | [^aA] | Any string that does not begin with a or A'
  merge: -1
