    # chmod — Changing file access permissions


    LINUX is a multiuser system — it offers file permissions associated with the owner
    of the file, the group file is, and anyone who is not the file owner or the group
    associated with the file. You use the `chmod` command to change the permissions
    of an existing file.


    Two ways exist to use `chmod`: symbolic (such as `r` for read) or an octal digit
    contains three bits. Because the permissions are grouped into three 3-bit segments,
    I personally prefer octal numbers.


    ![](img/74a57ca3470b31765a6f932d60bcc72e_74_0.png)


    chmod [-R] mode files


    | Option or Argument | Function |

    | -R | Recursively changes permissions of directories and their contents. |

    | mode | Accesses permissions in octal or symbolically. |

    | files | Shows a list of files whose permissions you are changing. |


    The symbolic specification is made up of three parts — each of which is optional.
    The parts of the symbolic specification are as follows:


    +   **The type of ownership:** `u` for user, `g` for group, `o` for other, or
    `a` for all

    **An operator:** `+` for add permissions, `-` for remove permissions, `=` for
    set permissions exactly as specified

    **The values to set:** `r` for read, `w` for write, and `x` for execute or directory
    search.


    If you need to specify more than one symbolic specification, use a command to
    separate the specifications.


    Using octal, the following values are added together to form the bitmap.'
