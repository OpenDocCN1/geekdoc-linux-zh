  md: '# 116 Spell-Checking with ispell


    Note that on some LINUX systems, the man pages are kept in gzipped format. In
    that case, the file would be named groff.1.gz and you would need to use the following
    command to print it:

    zcat groff.1.gz | groff -man | lpr`


    groff is just a front-end program for the whole document processing section. For
    more details, see the man pages on groff, gtbl, geqn, and gpic. For details on
    the macro packages, check out groff_me, groff_mm, and groff_ms in Section 7 of
    the man pages.


    # Spell-Checking with ispell


    ispell is an interactive spelling checker. For me, the best thing about ispell
    is that it guesses what you intended to spell.

    To spell-check one or more files, enter

    ispell filenames`


    When ispell finds a word of questionable spelling, it highlights the word, possibly
    offers some suggestions, and then waits for you to tell it what to do. Here are
    your choices:


    | Your Input | What It Does |

    | 0-n | Replaces the word with one of the suggested words |

    | Space | Accepts the word this time, but if found in another place in the file,
    asks again |

    | a | Accepts the word for the rest of the ispell execution |

    | i | Accepts the word and adds it, as is, to your private dictionary |

    | l | Looks up words that match a pattern you specify in the system dictionary
    |

    | q | Quits ispell without making any updates |

    | r | Replaces the misspelled word with what you enter |

    | u | Accepts the word and adds it, uncapitalized, to your personal dictionary
    |

    | x | Makes the updates to this point, writes out the updated file, and moves
    on to the next specified file |

    | Ctrl+l | Redraws the screen (that''s Ctrl plus lowercase L, by the way) |

    | ! | Escapes to the shell |

    | ? | Displays a help message |


    ispell searches in your home directory and the current directory for your personal
    dictionary. If it finds a personal dictionary in both places, it merges the two.
    ispell then names the dictionary .ispell_default.`'
  merge: -1
