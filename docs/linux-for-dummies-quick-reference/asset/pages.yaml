  md: '# Selecting a Window Manager Style


    # Selecting a Window Manager Style


    You can customize the look and feel of your window manager. There are three common
    global choices and then a set of all sorts of personal customizations. The major
    differences are in appearance of the window decorations. The common choices are
    the following:


    +   - Windows-95 like

    - Less-Tif

    - AfterStep


    The default with Red Hat is the Windows-95 like mode. If you are moving to LINUX
    from Windows 95, you will probably be most comfortable with this choice. This
    choice is described in more detail in the man and info pages included with your
    LINUX distribution.


    Less-Tif is likely to be most comfortable for people familiar with other UNIX-like
    platforms. It is a free clone of the Motif Window Manager. With Less-Tif, there
    are three buttons on the top of the window. The one on the left calls up the window
    operations menu, and the other two are maximize and minimize.


    The AfterStep configuration is designed to clone the appearance of the NeXTStep
    configuration on NeXT computers. If you are open for new ideas, AfterStep has
    the nicest, most capable user interface.


    # The Wharf


    AfterStep offers what is called the Wharf. This is an area of icons similar to
    what you see in the lower right of the screen in the FVWM Desktop Anatomy section.
    Traditionally, the Wharf includes:


    +   - A pager to desktops

    - A digital clock and calendar

    - A restart and exit button

    - An xload window

    - Buttons for common utilities such as Netscape


    # AfterStep configuration


    All of the configuration information for AfterStep is saved in subdirectories
    of the GNustep directory in your home directory. There is a directory for each
    menu and a file for each program. You can directly edit these files to make changes
    in program characteristics.'
  merge: -1
