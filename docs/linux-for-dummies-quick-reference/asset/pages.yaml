    The ical appointment calendar program allows you to do the following:


    +   * Schedule your day

    * Include more than one calendar file

    * Schedule reoccurring events

    * Receive alarms for upcoming events


    ical stores its schedule information in a file called .calendar in your home directory.
    If ical doesn''t do all you need, take a look at plan. Although similar to ical,
    plan includes the ability to schedule program executions or send you e-mail at
    the scheduled time of an event — and it supports long messages.


    # xbill — Video game for LINUX


    This program is an I-must-save-the-world video game. It gives you a chance to
