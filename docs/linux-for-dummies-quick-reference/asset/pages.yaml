  md: '# Editing Text with vi


    # Using operators and objects


    You can use vi much more efficiently if you work on objects (such as words or
    lines) rather than a single character at a time. Many vi commands consist of an
    operator — what action to take — and what to apply the action to.


    | Operator | What It Means |

    | --- | --- |

    | c | Change |

    | d | Delete |

    | p | Put the most recently deleted or yanked object back in the file after the
    current cursor location |

    | y | Yank (copy to an internal buffer) |

    | ^ | Beginning of line |

    | $ | End of line |

    | w | One word forward |

    | W | One word forward including punctuation |

    | b | One back word |

    | B | One back word including punctuation |

    | e | End of current word |

    | E | End of current word including punctuation |

    | ) | Next sentence |

    | ( | Previous sentence |

    | j | Forward one line |

    | k | Back one line |

    | h | Left one character |

    | l | Right one character |


    Assume the cursor is on the first t in testers the example shown in the section
