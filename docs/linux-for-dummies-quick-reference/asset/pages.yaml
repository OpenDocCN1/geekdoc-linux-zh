  md: '# Special Characters


    # Special Characters


    Many characters have special meanings to the shell. The characters and their meanings
    vary from shell to shell and system to system. Use the documentation on your shell
    and the stty command to verify these characters. The following list lists examples
    showing the proper way to use the stty command. The table that follows the list
    provides likely default meanings for some keyboard entries and characters.


    +   * To display all your current terminal settings, type stty a.


    +   * To change a stty mode that is either true or false, type stty followed by
    the name of the mode to turn it on. To turn a mode off, precede the name with
    a a-. For example, to turn off the opost mode, type stty -opost.


    +   * To change the value of a setting, type stty name value. For example, to
    change the erase command you would type stty erase, then press Ctrl+H.


    | Special Entry | What It Does |

    | --- | --- |

    | Enter | Tells the shell that your command is ready to be processed. |

    | Spacebar or Tab | Separates words in. In Bash, Tab prompts the shell to complete
    the current word into a match with a filename, login name (if it starts with ~),
    hostname (if it starts with @), or shell variable (if it starts with $). |

    | Backspace or Delete | Each key deletes the most recently typed character. Use
    stty to change the backspace character. |

    | ; | Command separator. Allows you to enter multiple commands on the same line
    When placed at the end of a command line, this character starts the command in
    the line preceding the & in the background and returns a shell prompt immediately.
    You can use && between commands to represent a logical AND. The second command
    executes only if the first command completes successfully. |

    | | Connects the standard output of the command on the left to the standard input
    of the command on the right. || can be used between commands to mean a logical
    OR. The second command executes only if the first one fails. |

    | ! | In Bash and tsch, this character denotes a history reference. When this
    character is followed by the beginning of a command, the history list is searched
    backward for the most recent command that matches. |'
