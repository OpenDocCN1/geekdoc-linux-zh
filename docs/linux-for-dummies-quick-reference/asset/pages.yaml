  md: '# How to Use This Book


    LINUX For Dummies Quick Reference, 2nd Edition fills you in on some of the basic
    capabilities of the LINUX system, along with an assortment of those that aren''t
    so widely used — commands and options you would discover only after years of experience
    using LINUX.


    Although this book isn''t the whole story on LINUX, I have tried to provide you
    with the most amount of useful information possible in a compact reference. For
    instance, descriptions of LINUX commands include examples of their usage to illustrate
    how LINUX syntax really works.


    To find what you need, you can either browse through the book and scan the section
    headings for relevant entries (most of which are alphabetized), or turn to the
    Table of Contents or the Index for more help in locating information on using
    LINUX.


    ![](img/74a57ca3470b31765a6f932d60bcc72e_18_0.png)'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# How to Use This Book


    # How This Book Is Organized


    LINUX For Dummies Quick Reference, 2nd Edition contains ten parts, one appendix
    and a glossary of terms to help you find things fast.


    Part I, “Getting to Know LINUX,” starts with the story of how LINUX came to be.
    It then provides advice for selecting the LINUX distribution that is right for
    you, LINUX installation information, and tips for dealing with any problems you
    may encounter during the installation process.


    Part II, “Understanding the Shell,” introduces the available shells (the command
    interpreters) and examines the file structure of LINUX. I discuss the basic capabilities
    of the shell, concentrating on Bash. Don’t miss the table of characters that have
    special meaning to the shell.


    Part III, “Common Shell Commands,” is where the most commonly used LINUX commands
    can be found. I divide the commands into functional groups — such as Sorting,
    Searching, or Printing — alphabetically.


    Part IV, “Using X/FVWM,” covers the X Window System and FVWM, the most common
    window manager. It includes keyboard shortcuts for working with X and information
    on how to work with nonproportional forms in this graphical environment.


    Part V, “Text Editors and Working with Text,” offers information on how to use
    two text editors — pico and joe — are designed for beginners, and how to use two
    powerhouse text editors — Emacs and vi. This part also covers spell-checking and
    formatting.


    Part VI, “Sending and Receiving E-Mail,” explains how electronic mail works in
    LINUX. It covers pine and em, the two most common mail user agents, and tells
    you how to get your e-mail from your Internet provider.


    Part VII, “Working with the Other Guys,” shows you how to handle files from the
    MS-DOS/Windows, Macintosh, and UNIX environments.


    Part VIII, “Networking,” describes the tools you need to test network connectivity,
    transfer files over a network, and how to interactively on remote computers.


    Part IX, “Systems Administration,” takes you beyond the scope of the individual
    user and into the realm of system administration. You can read about routine systems,
    such as adding users and checking files systems, or more advanced operations as
    establishing a PPP (Point-to-Point Protocol) connection to your ISP.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# How to Use This Book


    Part X, “Using Regular Expressions,” is a concise reference on regular expressions,
    which are used by many LINUX editors and other programs for searching and matching
    text patterns.


    The Appendix, “Online Resources,” offers a list of places to search for software,
    user groups, documentation, and lots more information on LINUX.


    The glossary of terms, “Techie Talk,” contains an alphabetical listing of technical
    terms used in this book and in the LINUX community. Go to the glossary when you
    need an unfamiliar term translated into English.


    # Conventions Used in This Book


    When I include LINUX commands and lines of code, they are presented in `monospace`
    typeface. For example:


    ```

    cp *.food ~/Html/

    ```


    When you’re instructed to type something exactly as it appears in the text, it
    is presented in **monospace** and **bold**. For example:


    Type man at.


    In the “Syntax” sections, *italics* are used to indicate that they are to be replaced
    with the actual name you are using, usually the name of a file. The command itself
    is shown in bold for emphasis. Square brackets are used to indicate optional information
    that is not part of the command itself. How should you use the information in
    the brackets is explained in the Options or Arguments table that follows the commands
    themselves. For example:


    ```

    cat [-E] [-n] [-T] [-v] files

    ```


    (By the way, the conventions used in the book are also common to much of the LINUX
    online documentation, as the man pages)


    # Need More Information?


    This book size can provide every user with every answer to every question. Although
    I don’t have the space to list all the options for every command, I can give you
    the most common and most important ones that you’re likely to need.


    If you are looking for more detailed information about a particular command, the
    `man` command (**see also** Part III for more on man) is the built-in LINUX command
    that prints techno-help documentation. Or, check out the Appendix, “Online Resources,”
    for other sources of information.'
  merge: -1
