  md: '# Startup Files


    | Special Entry | What It Does |

    | --- | --- |

    | # | Comment. The remainder of the line is ignored by the shell. |

    | \ | Takes away the special meaning of a special character that follows it. Can
    escape the Enter character, allowing you to continue commands onto a subsequent
    line. |

    | '' | Disables the special meaning of characters enclosed in single quotation
    marks. |

    | " | Disables the special meaning of characters (except for $) enclosed in double
    quotation marks. |

    | | Executes what''s in the quoted string and replaces the command in quotation
    marks with its output. |

    | $ | Introduces a reference to a shell variable. |

    | * | Matches any number of characters. |

    | ? | Matches a single character. |

    | [ ] | Matches any single character contained within the braces. For example,
