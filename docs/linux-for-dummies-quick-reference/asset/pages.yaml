  md: '# Archiving, Converting, and Other File Manipulation


    # gzip — Compressing and decompressing


    You can save a lot of disk space by compressing files that you don''t access regularly.
    Furthermore, if you need to read the compressed files, commands such as zcat allow
    you to read the file without having to decompress it. The gzip command uses Lempel-Ziv
    coding, which is nonproprietary. This command is also capable of decompressing
    files that were compressed with UNIX compress.


    ```

    gzip [-num] [-c] [-d] [-r] [-t] [-v] files

    ```


    | Option or Argument | Function |

    |---|---|

    | -num | Level of compression (from 1 to 9). 9 is best but takes longer. |

    | -c | Sends output to stdout. Normally, the input file is deleted and the output
    file is named the same as the input file, with .gz appended to the filename. |

    | -d | Decompresses rather than compresses. |

    | -r | Recursively compresses or decompresses files within a specified directory.
    |

    | -t | Tests the integrity of a compressed file. |

    | -v | Verbose — shows how much each file is being compressed. |

    | files | The files to compress or decompress. |


    Typing gunzip file is equivalent to typing gunzip -d file — and it saves typing
    one character.

    Suppose that you have your old recipe files in a directory and you want to compress
    all of them to save space, and you also want to see how much space is being saved.
    Change to the directory that contains your recipe files and enter

    gzip -v *


    You can then individually look at the files using zcat; or, you can decompress
    the file using gunzip.


    # More compressed file utilities


    In addition to zcat, LINUX offers other utilities that work with compressed files.
    The big difference is that all of these utilities are actually Bourne shell scripts
    that interpret the command line, invoke gzip to decompress the file, and then
    pass the result to the regular command. This is the common way to build new tools
    in the LINUX environment.'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Archiving, Converting, and Other File Manipulation 35


    | Command | Function |

    | --- | --- |

    | zcmp | Decompresses and compares files using cmp. |

    | zdiff | Decompresses and compares files using diff. |

    | zgrep | Decompresses and searches for patterns using grep. |

    | zless | Decompresses and displays file. |


    Suppose that you have some compressed recipe files and you want to find the ones
    that contain the word Tofu. Rather than decompressing the files and then use grep,
    you can just use zgrep; zgrep Tofu *.food.gz


    # Working with tar archives


    The workhorse of LINUX backups, tar is also used as the format for package distribution
    in Slack. When picking between tar and cpio, the advantage to tar is by using
    the z key, tar automatically compresses on backup and decompresses on restore
    using gzip. The bad news is that tar cannot save and restore special files (like
    those in /dev). pathname of files are limited to 100 characters. When using tar,


    To create an archive:


    ```

    tar c[v][z][f archive] files

    ```


    To list an archive''s table of contents:


    ```

    tar t[v][z][f archive]

    ```


    To extract from an archive:


    ```

    tar x[k][m][v][f archive] files

    ```


    | Key or Argument | Function |

    | --- | --- |

    | f archive | Name of the file or device that is the archive. Use - to specify
    stdin or stdout. |

    | k | Does not overwrite newer files. |

    | m | Preserves file modification time. |

    | v | Verbose — lists filenames, or in the case of table of contents, detailed
    file information. |

    | z | Compresses files if archiving, decompresses if unarchiving. |

    | files | A list of filenames. If directories are specified, tar descends through
    the hierarchy, archiving the files within those directories. * |'
