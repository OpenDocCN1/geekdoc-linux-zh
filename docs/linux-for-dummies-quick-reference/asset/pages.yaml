  md: '# Networking with PPP


    PPP stands for Point-to-Point Protocol. It is a common way to connect to an Internet
    service provider (ISP) using a dial-up connection over a standard phone line or
    ISDN.


    You need many pieces of properly configured software to make a successful PPP
    connection. After you understand all those pieces, you should have little trouble
    getting PPP up and running on your system. (For more information on network addressing,
    see also Part VIII.)


    To get yourself connected, you need to follow these steps:


    +   1. Dial the modem.


    +   2. Log on to your ISP and start PPP.


    +   3. Establish routing so that your data packets are sent over your PPP interface.


    After you have everything set up, you can do the whole sequence with one command.


    To set up your PPP connection, you need to know these things:


    +   ◆ The telephone number of your ISP.


    +   ◆ The proper login sequence. This may involve standard LINUX- logins or include
    other authorization requirements.


    +   ◆ The IP addresses of the nameserver you are supposed to use.


    +   ◆ The domain name of the machine you use as your mail server. You may notice
    two different addresses: that a POP server uses to receive your mail, and one
    that an SMTP server uses to send mail.


    +   ◆ The name of the news server you use.


    +   ◆ Your IP address, if you have a static one. You probably do not have a static
    IP address unless you purchased dedicated service from your ISP. Having a static
    IP address for your PPP connection does not necessarily have to do with whether
    you have your own set of IP addresses — just how you need to talk to your ISP.
    For example, the address block 198.184.169.* belongs to me, but I still have a
    dynamic address assigned for the PPP connection each time I connect to my ISP.
    My LINUX systems handle the routing from my addresses to my gateway system and
    on to my ISP.'
  merge: -1
  pgno: 186
- img_proc: true
  md: '# 170 Networking with PPP


    The following table lists example parameters I''ve used to set up a PPP connection.
    You may need to stick pop, mail, and news on the front of the ISP''s domain name;
    check with your ISP first.


    | Parameter | Value |

    | --- | --- |

    | My ISP | aa.net |

    | Telephone number | 777-7777 |

    | Login sequence | LINUX-like with a login name and password |

    | Name servers | 204.157.220.4, 204.157.223.111 |

    | Mail server (POP) | pop.aa.net |

    | Mail server (SMTP) | mail.aa.net |

    | News server | news.aa.net |

    | My IP address | dynamic |


    After you have all this information, you have to decide what to do with it. If
    your Linux distribution has a GUI-based utility to set up PPP, you probably have
    to fill out some forms with the information. Just enter the information and you
    should be all set.


    # The chat program


    chat establishes a dial-up connection. You can use another program as dip, but
    chat is the best choice. For a more detailed look at this setup, see LINUX SECRETS,
    2nd Edition (IDG Books Worldwide, Inc.).


    ```

    chat [-r rfile] [-t time] [-v] [-V] script

    chat -f sfile [-r rfile] [-t time] [-v] [-V]

    ```


    | Option or Argument | Function |

    | --- | --- |

    | -f sfile | Reads the chat script from sfile rather than the command line. |

    | -r rfile | Uses rfile as the report file. This is the location where chat writes
    strings to the REPORT script keyword. By default, chat writes these strings to
    standard error. (See also Part II for more information.) |

    | -t time | Waits time seconds for a reply. |

    | -v | Logs all text received from the modem and output strings to the system
    log (usually /var/spool/messages/) |

    | -V | Sends all text received from the modem and output strings to standard error.
    |

    | script | The actual chat script.'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# Networking with PPP


    The chat script consists of a sequence of expect/send sequences. The first string
    tells chat what to expect to receive from the modem, and the second string tells
    chat what to send to the modem after it receives the expect sequence.


    The expect sequence may also contain a subexpect/subsend sequence to deal with
    cases in which chat does not receive what it expected from the modem. You separate
    this sequence from the actual expect string with hyphens. For example, if you
    wanted an expect sequence that says for OK but send +++ and wait again if you
    don''t get it, you would


    ```

    ''OK +++\c gin:''

    ```


    The \c tells chat not to send a Return character. By default, chat sends a Return
    character at the end of a send sequence but does not expect it at the end of an
    expect sequence.


    You should include only enough information in the expect sequence for chat to
    identify the sequence. For example, you can use gin: for login and word: for password.
    That way, even if the initial characters are garbled, chat recognizes the string.


    chat recognizes the following special strings in what would normally be the expect
    field. (If one of these appears, it is configuration information to chat rather
    than an expect sequence.)


    | String | Result |

    |---|---|

