  md: '# Using fetchmail for Remote Mail Access


    If you want to add another attachment, just press Ctrl+J again and follow the
    rest of the steps.


    If you intend to use both elm and pine, you should link the Mail and mail directories.
    elm uses Mail, and pine uses mail. If you link them, all your saved mail appears
    in the same directory.


    If you don''t have a dedicated connection to the Internet and want a way to download
    your incoming e-mail, you should try Post Office Protocol (POP). You can run a
    client program on your local system and tell it to fetch your mail.


    The most popular of the client programs is called fetchmail; another is called
    popclient.


    You can automate downloading your mail by adding a call to fetchmail to your pop
    connect script.


    ```

    fetchmail [-c] [-d secs] [-f rcfile] [-k] [-m] [-p proto] [-u username]

    ```


    | Option or Argument | What It Does |

    |---|--|

    | -c | Checks for mail and reports. Doesn''t fetch any messages. |

    | -d secs | Runs as a daemon and fetches mail every secs. If you have started
    fetchmail in this mode and want to terminate it, type fetchmail -- quit to kill
    the daemon. |

    | -f rcfile | Specifies the location of the fetchmail run control file ($HOME/.fetchmail
    default). |

    | -k | Keeps message on the remote server. Handy for testing. |

    | -m | Passes mail to the MDA directly (rather than forwards it via port 25).
    |

    | -p proto | The protocol to use when retrieving mail. See also the following
    table for your choices. |

    | -u username | The login name to use on the mail server. This defaults to your
    login name on your local machine. |


    The following table lists your mail retrieval protocol choices.'
