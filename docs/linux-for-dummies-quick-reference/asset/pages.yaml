  md: '# Managing User Control Files


    | File | Function |

    | --- | --- |

    | /etc/shadow | Shadow password file. Used only if shadow passwords are enabled.
    |

    | /etc/syslog.conf | File to configure what system messages are logged and where
    they are logged. |

    | /var/lock/ | Directory for lock files. |

    | /var/log/ | Directory where all log files are kept. |

    | /var/spool/cron/crontabs | crontab files for each user. |

    | /var/spool/lpd/ | Directory for the print spooler. It contains control files
    as well as the print queues. |

    | /var/spool/mail/ | Directory for incoming mail files. |

    | /var/spool/mqueue/ | Mail transfer agent (sendmail or smail) queue directory.
    |


    If you want to know about recent important events on the system, you can type
    `dmesg` rather than look through the files in `/var/log`. The command `dmesg`
    displays recent system messages.


    # # Managing User Control Files


    You identify users by creating entries for them in the password file. Each user
    also has an entry in the group and possibly in the shadow password file. (**See
    also** the section “Shadow passwords,\” a little later in this part.


    # ## The group file


    The `/etc/group` file shows which users have access to which groups. Each group
    has a line in the file. Each entry consists of four fields separated by colons.


    | Field | Meaning |

    | --- | --- |

    | 1 | Group name. |

    | 2 | Group password. This is rarely used and very difficult to administer. |

    | 3 | Group ID. This corresponds to field 4 of `/etc/passwd`. |

    | 4 | A comma-separated list of group members. |


    The following program shows a few lines from `/etc/group` file. You can see that
    `fyl, viki, george, john, and marsha` are all members of the users group, whereas
    only `fyl` and `viki` are members of `fyl` group. User `george` has his own group.'
