  md: '# Editing Text with Emacs


    +   * All the common commands are listed on the menu at the bottom of the screen.
    When in doubt, refer to the command menu. If you are still in doubt, press Ctrl+G
    to view the built-in documentation.


    # Editing Text with Emacs


    The big daddy of all editors, Emacs — which stands for Editing Macros— was written
    and still maintained by Richard M. Stallman. I tell you only how to start it and
    how to get out of it (something that I feel is less than intuitive) and I provide
    a list of common commands.


    Why is the E in Emacs capitalized? After all, you must enter the program name
    (emacs) in all lowercase letters when you want to start it. However, people in
    the know always capitalize the E when referring to Emacs. Go figure.


    # Checking out Emacs commands


    Unlike vi, Emacs is not modest. This means that you can type a command at any
    time. However, sometimes you have to use some strange combination of key sequences
    to perform certain commands.


    The arrows, PageUp, PageDown, Home, and End keys do what you would expect. Thus,
    you can use them rather than the control key sequences.


    Emacs has always used two keys for commands: Ctrl and Meta. Most keyboards don''t
    have a Meta key. If your keyboard has an Alt key, use it rather than the Meta
    key. If your keyboard doesn''t have an Alt key, use Esc.


