  md: '# 174 Networking with PPP


    If you send or receive mail with a Web browser such as Netscape or Mosaic, you
    need to include the names of your smart host as well as the name of your POP server
    in the browser''s configuration options.


    # Making the connection


    To establish a connection, you need to execute the link by using a shell script.
    You can manually start the link using pppp with the right options. Just log on
    as root (or use su to become root) and run the script. The PPP code includes examples
    of a startup script (called ppp on) and a shutdown script (called ppp-off). On
    Red Hat 5.1, these scripts are located in /usr/doc/ppp-2.2.3/scripts. On other
    distributions, they may be incorporated into the standard startup scripts in /etc/rc.d
    or /etc/rc.d/init.


    I used the sample script for pppd in the preceding section. I put the script in
    /usr/log/sbin and called it paa.


    Rather than log in as root each time you need to start or stop PPP, you can create
    logins for this task. one named pppup to bring PPP up, and one named pppdown to
    bring it down. By setting the user ID on these logins to 0, they run as root.
    Set their shells to the name of the script you want to run.


    # Name servers


    You can list up to three nameserver in /etc/resolv.conf, and you must list them
    by IP address. They are searched in the order they appear in the file. The following
    code snippet describes my /etc/resolv.conf file. The search line sets the default
    domain to fylz.com. This line instructs network applications to append fylz.com
    onto any address it receives that does not have a domain name before it attempts
    a DNS lookup. For example, if i used the e-mail address visi@smiley as a mail
    destination, the program performing the DNS lookup would append fylz.com to the
    address before performing the lookup.


    ```

    fylz.com

    nameserver 204.157.220.4

    nameserver 204.157.223.111

    ```


