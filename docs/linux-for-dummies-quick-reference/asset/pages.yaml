    the shell and log you out. |

    | Ctrl+U | Cancels the line that you are entering and allows you to start over.
    Use stty to set this. |

    | Ctrl+Z | Pauses the current program. You can use bg to restart the program in
    the background, fg to restart it in the foreground, or kill to terminate it. You
    can also use jobs to get a status report of your jobs. |


