  md: '# Formatting Text with groff 115


    ◆ groff has output filters to produce PostScript, dvi, ASCII, and X11 formats.


    groff [-macro] [-opages] [-t] files


    | Option | Function |

    | - | - |

    | -mmmacro | Specifies the macro package: an for man macros, m for mm macros,
    or s for ms macros. |

    | -opages | You can specify the pages you want to print in a commadelimited list.
    You specify ranges with a hyphen. Default is all pages. |

    | t | Preprocesses the document using tbl, a program that allows you to create
    tables. |


    The macro packages enhance the groff command set and address a more specific audience
    than bare groff, as the following table shows:


    | Macro Package | Use |

    | - | - |

    | man | This is the package for producing the documentation included with UNIX
    and LINUX systems. It is rather basic and very specific to creating a document
    with the structure of a man page. |

    | me | This package was developed at University of California, Berkeley in the
    computer science department. It was designed to address the specific needs of
    producing a thesis. It is, however, much more general than the man package and
    has been used commercially to produce manuals. |

    | mm | Developed at AT&T, this is the most modern, most general package. It is
    the best choice for producing books and reports. |

    | ms | Also developed at AT&T, ms is older than mm. It is general purpose with
    fewer features than mm. You may want to choose this package because it is less
    complicated and, therefore, easier to learn than mm. |


    All the LINUX manual pages (man pages) are written using the man macros. Suppose
    you decide you need a hard copy of the man page for groff, which is named groff.1
    because it is in Section 1 of the manual (user commands). You type locate groff.1,
    press Enter, and find that it is in /usr/man/man1. You then enter the following
    to print to:


    ```

    cd /usr/man/man1

    groff -man groff.1 | lpr

    ```'
