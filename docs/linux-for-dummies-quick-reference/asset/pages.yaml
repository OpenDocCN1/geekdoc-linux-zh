    # mdir — Displaying an MS-DOS directory


    mdir is the equivalent of the MS-DOS command dir. The -w option is equivalent
    to the /w switch of the dir command.


    ```

    mdir [w] dos_dir\mddir [a] [f] [-w] dos_files

