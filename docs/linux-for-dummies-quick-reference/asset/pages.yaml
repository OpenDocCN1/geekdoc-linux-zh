  md: '# Shell Command Elements


    +   ◆ Whether the command should run in its own shell , that is, "&"


    For instance, here''s an example of a shell command:

    diff -i first second > result


    +   ◆ diff, the first word on the line, is the name of the command that you are
    asking the shell to run.


    +   ◆ -i is an option (the hyphen is a tip-off). Options must generally appear
    between the command name and the arguments.


    +   ◆ first is the first argument.


    +   ◆ second is the second argument.


    +   ◆ > is a redirection operator. It redirects the output of the command to a
    file. (*See also* the section "Files Associated with a Program," earlier in this
    part.)


    +   ◆ result is the name of the file where the command output is redirected.


    +   ◆ Each of these items is commonly called a word. The words of the shell command
    are separated by *whitespace*, which are defined as one or more space or tab characters.


    The most basic command consists of only a command name. For example, to display
    the current date, date time and press Enter.


    Most shells interpret the redirection operator first, and then parse the other
    command parameters. For that reason, a line consisting of only output redirection
    and a filename (for example, >peach_cobbler) creates an empty file called peach_cobbler.
    (*See also* the section "Files Associated with a Program," earlier in this part,
    for an understanding of the redirection operator)


    Some commands need arguments to operate. For example, if you want to edit a text
    file with vi (which I like to call "the world''s greatest editor"), you need to
    tell the editor of the name of the file. Thus, vi myfile starts the editor and
    tells it to open a file named myfile. (*See also* Part V for on vi.)


    The third type of information that is passed to a command is a command-line option.
    ls modify the operation of a command. For example, ls lists the files in your
    current directory, but it does not display files with names beginning with a dot.
    (These are known as hidden files.) The *option* (ls -a) instructs to include in
    the output those that have filenames starting with a dot.


