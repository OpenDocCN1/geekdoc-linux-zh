    # Modifying Window Characteristics


    Clicking the leftmost button in a window’s title bar activates a pull-down menu,
    where you can modify the characteristics of the window.


    # Closing a window


    Closing is a graceful way to ask the X client to disappear (as opposed to when
    you kill a window and the program relinquishes control of the window). To close
    a window, do the following:


    +   1. Click the leftmost button in the title bar.

    2. Click Close from the pull-down menu that appears.


    # Destroying a window


    The distinction between Close and Destroy is that the Close command is “friendly”
    — it asks the client program to remove itself. If, however, the window does not
    understand the message, or you elect to use Kill from the pull-down menu, the
    window is destroyed by the window manager. Because this can cause the application
    to crash and burn, you resort to the Kill option only if the window has not responded
    to the Close request. Here’s what you do in that case:


    +   1. Click the leftmost button in the title bar.

    2. Click Kill.'
