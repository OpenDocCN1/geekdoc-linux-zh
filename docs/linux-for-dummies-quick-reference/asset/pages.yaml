  md: '# Systems Administration


    LINUX distributions offer a combination of high-level utilities to help you with
    systems administration. All in all, administering a LINUX system is not that much
    different from a UNIX system. So if you know how to administer UNIX, you may already
    be familiar with much of the information in this part of the book.


    If your LINUX distribution has a GUI for systems administration, use it. If, however,
    something goes wrong, you may have to get down and dirty to fix it. (Which is
    why I take the time to cover the down-and-dirty part of systems administration.)


    # In this part ...


    +   * Adding users and groups

    * Connecting to an ISP with PPP

    * Starting and stopping the system

    * Performing system maintenance

    * Introducing kernel modules


    ![](img/74a57ca3470b31765a6f932d60bcc72e_180_0.png)'
  merge: -1
