  md: '# Available Shells


    Multiple shells are included with LINUX distributions. They include ash, Bash,
    ksh, tcsh, and zsh. The most popular shell by far is Bash, a product of the GNU
    Project of the Free Software Foundation. Bash stands for Bourne Again Shell (named
    after Stephen Bourne, who wrote the first programmable shell for UNIX).


    In this book, I use the Bash shell as the standard. As a user, you may want to
    consider ksh (pronounced by spelling: k-s-h) as an alternative — particularly
    if you work with UNIX platforms. The ksh shell is a public-domain implementation
    of the POSIX-compliant Korn shell, which was written by David AT&T. The ksh shell
    is commonly available on most UNIX platforms.


    # Basic Directory Commands


    Use the following commands to perform basic directory management tasks:


    +   - cd dirname — To change your current directory

    - mkdir dirname — To create a new directory or directories

    - rdir dirname — To remove an empty directory

    - pwd — To find out which directory you''re in


    Type pwd (for "print working directory") and the name of the current directory
    appears on-screen. To verify the name of your home directory, type pwd after logging
    in.


    # Character Quoting


    Some characters have a special meaning to the shell (that is, the shell treats
    the characters as directions to perform some action). If you need to enter these
    characters as part of a filename, and you don''t want the shell to interpret their
    special meaning, then you need to quote these characters.


    # Quoting an individual character


    To quote any single character, precede it with a backslash (\). For example, to
    list the names of all files that contain an \*, type this:


    ```

    ls -a \*\*

    ```'
