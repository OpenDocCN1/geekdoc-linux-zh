    # zip and unzip — Working with zip archives


    The pkzip command for MS-DOS is a common way to compress and archive files. Functionally,
    pkzip is equivalent to the LINUX tar command when used with the z key, but the
    format of a zip archive is not the same as the format of a zip archive. The zip
    command (which is available for LINUX, UNIX, VMS, MS-DOS, OS/2, Windows NT, Minix,
    Atari, and Macintosh) offers a way to work with zip format archives. You''ll probably
    use this program when exchanging files with Bill Gates or some of his customers.
    This Windows folks won''t have the capabilities to work with standard tar or cpio
    files, so you will have to use zip and unzip to exchange files.


    To create a zip archive or update an archive, you use:


    ```

    zip archive list

    ```


    To extract from a zip archive, you use:


    ```

    unzip archive list

    ```


    | Option or Argument | Function |

    | -@ | Reads the filenames from standard input rather than the command line. |

    | -d | Deletes the files in a list from archive. |

    | -h | Shows a complete list of command-line options. |

    | -m | Deletes the original files after the files in a list are added to the archive.
    |

    | -q | Works silently. |

    | -T | Tests the integrity of the archive. |

    | archive | The name of the archive file. If zip finds that the archive already
    exists, it adds the files in list to the existing archive. |

    | list | A list of filenames to either extract or add to the archive. The default
    action of unzip is to extract all files in the archive. |


    Imagine that Paul sends you a zip archive containing pictures of his new football
    stadium. You want to retrieve the README.TXT file from the STADIUM.PS file. The
    archive name is bigdough.zip. Enter the following:

    unzip bigdough.zip README.TXT STADIUM.PS'
