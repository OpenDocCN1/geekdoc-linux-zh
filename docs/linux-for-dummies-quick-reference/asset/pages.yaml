  md: '# Sending and Receiving

    E-Mail


    LINUX grew up on the Internet, so you shouldn’t be surprised to find out that
    it comes with a great assortment of tools for working with e-mail. With Finland’s
    Linus Torvalds and thousands of other people worldwide contributing to the LINUX
    development effort, a wide range of e-mail options were certain to be an essential
    part of the LINUX system.


    # In this part ...


    +   - Understanding the pieces of an e-mail system

    - Using elm and pine, the most popular screen-based e-mail programs

    - Getting your e-mail remotely with POP

    - Working with metamail files


    ![](img/74a57ca3470b31765a6f932d60bcc72e_136_0.png)'
  merge: -1
  pgno: 136
- img_proc: true
  md: '# Collecting All the Pieces


    # Collecting All the Pieces


    For e-mail to work properly, all its pieces need to fit together. The elm and
    pine programs offer users an interface for electronic mail, and behind the scenes
    are programs such as small and sendmail that handle getting mail messages to the
    Internet.


    For those of you use a PPP connection to the Internet, there is one more piece
    you may need — a program that allows you to get your messages using POP. (PPP
    stands for Point-to-Point Protocol, a scheme for connecting two computers over
    a phone line. POP stands for Post Office Protocol, a system by which a mail server
    on the Internet lets you pick up your mail and download it to your machine)


    +   - Mail transfer agent (MTA) gets mail from one remote host and transfers the
    mail to another remote host. Three common MTAs are qmail, sendmail, and small.


    +   - SMTP, Simple Mail Transfer Protocol, is the language spoken by MTAs.


    +   - Post Office Protocol (POP) is an alternative language (alternative to SMTP)
    spoken by MTAs.


    +   - Mail user agent (MUA) is the program you use to read and send mail. Examples
    of MUAs include elm and pine.


    # Decoding MIME Messages with munpack


    MIME (Multipurpose Internet Mail Extensions) allows almost any type of file to
    be included within an e-mail message. MIME is an Internet standard described in
    RFC-1341. (RFC stands for Request for Comments, which is a collection of Internet
    standards papers.) Each attachment to a mail message has its own identifier in
    a text line that starts with Content-Type:. The suggested name for the unencoded
    file also appears in this line.


    Two programs available for LINUX with MIME encoded messages: metamail and munpack.
    Metamodel is designed to be called by a mail reading program to display the contents
    of the attachment. munpack is designed to be the command to unpack a MIME message
    saved into files with the names suggested in the header.


    ```

    munpack [-C dir] [-f] [-q] [-t] [files]

    ```'
  merge: -1
  pgno: 137
- img_proc: true
  md: "# Dissecting E-Mail Addresses\n\n| Option or Argument | What It Does |\n| ---\
    \ | --- |\n| -C dir | Changes directories to dir before reading any files. Useful\
    \ if you are piping a file into munpack. |\n| -f | Overwrites existing files.\
    \ Without this flag, munpack appends .n where n is an integer. |\n| -q | Quiet.\
    \ Doesn't display uninteresting messages. |\n| -t | Writes the text parts of a\
    \ MIME message to files. By default, text parts that do not have a name specified\
    \ in the header are discarded. |\n| files | MIME format to unpack. If you don't\
    \ specify any files, munpack reads the file to unpack to standard input. |\n\n\
    metavail uses the file /etc/mailcap to determine how to process the different\
    \ types of attachments. You may have to tune the entries in /etc/mailcap to reflect\
    \ your local configuration.\n\nSuppose that you save a MIME message in a file\
    \ named strange.stuff. To get an idea what is in the file, you can use grep to\
    \ look for Content-Type lines:\n\n```\ngrep \"Content-Type:\" strange.stuff\n\
    ```\n\nIf you do so, you get the following output:\n\n```\nContent-Type: TEXT/PLAIN;\
    \ charset US ASCII\nContent-Type: APPLICATION/octet-stream;\nname=\"fig4.tif\"\
    \n```\n\nYou can then unpack it like so:\n\n```\nmunpack strange.stuff\n```\n\n\
    munpack creates two files: fig4-2.tif and tif4-2.desc. The second file is from\
    \ the text that munpack associated with the tif file. If you use the -t option,\
    \ munpack creates a file named part1 instead.\n\n# Dissecting E-Mail Addresses\n\
    \nJust as you need an address to send a letter via mail, you need an address in\
    \ order to send e-mail. An e-mail address is composed of two parts — who and where.\
    \ An \"at\" sign (@) separates these two parts. For example, in the mail address\
    \ phil1@ssc.com, phil is the who, and ssc.com is the where. \n\n+   - The portion\
    \ of the address to the right of the @ is a domain name. It could refer to a set\
    \ of computers rather than an individual machine."
