  md: '# Distribution Web Pages


    LINUX information sites as well as to its own individual content, which includes
    employment ads, a speaker''s bureau, and GLUE (a LINUX user group directory).


    # Distribution Web Pages


    Each LINUX vendor maintains its own Web site. Many of these vendor sites contain
    mirrors (copies) of other LINUX information. The Debian, Red Hat, and Slack include
    complete downloadable versions of their distributions. Cruise to the following
    sites for more distribution information:


    +   * www.caldera.com — Caldera distribution

    * www.cdrom.com — Officialing distribution

    * www.debian.org — Debian LINUX distribution

    * www.infomagic.com — LINUX mirror, commercial CD sales

    * www.redhat.com — Red Hat distribution

    * www.stampede.org — Stampede LINUX distribution

    * www.suse.com — S.u.S.E. LINUX distribution

    * www.turbolux.com — TURBO LINUX distribution


    # FTP Resources


    The following FTP (File Transfer Protocol) sites offer information on LINUX from
    public archives over the Net:

    * tsx-11.mit.edu/pub/linux — General LINUX archive site

    * ftp.cdrom.com/pub/linux — Official home of Slackware

    * ftp.debian.org — Official home of Debian

