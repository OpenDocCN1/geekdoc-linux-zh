- img_proc: true
  md: '# 108 Editing Text with vi


    The ultimate shorthand for line ranges is %, which you can use to represent all
    lines in the file. It''s equivalent to 1,$.


    To change the case of the letter under the cursor, just enter ~. You can precede
    ~ with a number to change the case of more than one letter.


    Suppose that you receive an e-mail message containing some good jokes about Microsoft
    that has been forwarded so many times that most of the lines start with >. You
    can enter the following command to clean up the file:


    ```

    %s/^> //

    ```


    Then, press Enter. This command replaces (indicated by the s, substitute) > at
    the beginning (indicated by the ^) of every line (indicated by the %) with nothing
    (the lack of any text between the second and third slash).


    # Saving vi settings


    If you have a set of options, key maps, and abbreviations that you always want
    to use with vi, you can save them in your .exrc file by following these steps:


    +   1. Edit the .exrc file in your home directory.


    +   2. Enter the desired commands into the file.


    +   3. Save the file.


    vi reads the .exrc file every time it starts, so you have these settings available
    each time you start vi. This is the ideal place to put commands such as abbreviations
    and settings that you want to establish as your default.


    The following example .exrc file sets the right margin to eight characters, setting
    a spell correction abbreviation for teh, and well, sets another interesting abbreviation.
    (You can''t blame a guy for trying.) Note that the : is optional at the beginning
    of commands when they are placed in this file.


    # Searching for text


    If you want to search for some text, follow these steps:


    +   1. Type / to get into search mode.


    +   2. Type the text for which you want to search.


    +   3. Press Enter.'
