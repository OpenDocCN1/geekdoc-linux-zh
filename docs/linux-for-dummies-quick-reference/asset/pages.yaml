    # gimp — The GIMP


    The GIMP is a sophisticated bitmapped graphics program similar to Adobe''s Photoshop.
    It includes tools for Web graphic development and prevents work with many graphics
    formats.


    Documentation on the GIMP is available from:


    +   * www.gimp.org — the GIMP home page

    * www.thegimp.com — an e-zine on the GIMP


