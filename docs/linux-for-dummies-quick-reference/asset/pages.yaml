- img_proc: true
  md: '# Adding Users


    You have a number of methods available to add a user. You can add a user by doing
    any of the following:


    +   * Using the GUI supplied with your LINUX distribution

    * Using the `adduser` command

    * Making the necessary changes manually


    The GUI and `adduser` command “hold your hand” while you add users. To add a user
    manually, you must be logged in as root and do all of the following things:


    +   1. Edit `/etc/passwd` and add an entry for the new user.


    +   2. If you are using shadow passwords, edit `/etc/shadow` and add an entry
    for the new user. (The password program will do this for you when you assign a
    password to the user.)


    +   3. If the new user will have his or her own group, edit `/etc/group` and add
    a new group entry.


    (For a description of the password file record format, the shadow password record
    format, and the group file record format, **see also** the “Managing User Control
    Files” section, later in this.)


    +   4. Create the user''s home directory using the `mkdir` command — for example,
    you can enter `mkdir /home/newguy`. (**See also** Part III for more information.)


    +   5. Change the ownership of the home directory to the new user — for example,
    you can enter `chown newguy.users /home/newguy`. (**See also** Part III for more
    information.)


    +   6. Copy any system default configuration files to the new user''s home directory,
    making sure ownership and permissions are correct.


    +   7. Set the new user''s password — for example, you can enter password newguy
    and follow the prompts.


    Besides seeming like a lot of work, there are potential problems with this sequence.
    For example, someone else may be updating the password file while you are manually
    editing it. You are always better off to use the GUI or administration scripts
    to add users.'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# Checking File Systems


    The fsck script runs the appropriate file system check program for each file system
    in /etc/mtab when the system is booted. A list of the programs that check the
    different file system types follows:


    | File System Type | Program |

    | e2fsck (or fsck.ext2) | Second extended file system (LINUX default) |

    | fsck.minix | Minix file system |

    | xfsck (or fsck.xias) | Xia file system |


    The programs do a complete check if either of the following conditions exist:


    +   * The system was not properly shut down.

    * The file system has been mounted more times than the interval between checks
    as saved in the file system.


    Follow these steps to manually check a file system:


    +   1. Log on as root.

    2. If possible, unmount the file system you are about to check (for example, you
    can enter unmount /home).

    3. To check and repair the file system, type fsck and press Enter. The file system
    name can be either the mount point (/home, for example) or the device name for
    the partition where the file system resides (/dev/hda3, for example). If you would
    rather have the program automatically perform the check without asking you to
    decide on the correct action, type fsck -a instead.


    # Deleting Users


    Deleting users is pretty much the opposite of adding users. To delete a user,
    you must do the following:


    +   1. Delete or change the owner of any files that belong to the user. (**See
    also** the find command in Ill for more information.)

    2. Delete the user from /etc/passwd.

    3. If you are using shadow passwords, delete the user from /etc/shadow.'
  merge: -1
  pgno: 182
- img_proc: true
  md: '# Finding System Files


    4. Delete the user from /etc/group. You may have to edit multiple group file entries.


    5. If the user''s home directory is empty, delete it.


    Users may have files in directories other than their home directory. You can use
    find to locate those files. For example, to save a list of all files that belong
    to the user vegan to the file /tmp/vegan.files, enter find / -owner vegan -print
    >/tmp/vegan.files. If you are really courageous, you could use the -exec option
    of find to automatically remove them.


    # Finding System Files


    You must use numerous files to maintain and administer the system. You can use
    the following shopping list to check off the files as you locate them:


    | File | Function |

    | --- | --- |

    | /etc/HOSTNAME | The name of your computer |

    | /etc/at.deny | A list of users who are not allowed to use the at command |

    | /etc/bashrc | Startup commands for the Bash shell |

    | /etc/crontab | A system crontab file. It is much like the regular crontab files
    (see also Part III) but also has a user name field |

    | /etc/exports | File system exports via NFS |

    | /etc/getdefs | Serial line setup methods (for the getty process) |

    | /etc/group | See also "Managing User Control Files," later in this part |

    | /etc/hosts | Local file that offers a mapping from hostnames to IP addresses
    |

    | /etc/inabb | Run level control. (See also "Working with Run Levels," later in
    this part.) |

    | /etc/issue | Text file that is displayed before the login prompt |

    | /etc/issue.net | Text file that is displayed before the login prompt for Internet
    connections |

    | /etc/ld.so.conf | Locations for the dynamic loader to look for run-time libraries
    |

    | /etc/motd | Text file that is displayed after you successfully log in |

    | /etc/mtab | Mount table for file systems |

    | /etc/passwd | Password file |'
