  md: '# Archiving, Converting, and Other File Manipulation


    For historical reasons, tar treats the command line differently than other LINUX
    commands. It uses keys rather than options preceded by hyphens. Also, make sure
    you don''t put spaces between the keys or tar will certainly interpret the command
    incorrectly.


    If you want to back up all the files in the hierarchy under your home directory
    to a tape (/dev/tape), you can change to your home directory and then enter the
    following command to create the archive: tar cvf /dev/tape. To verify the contents
    of the archive, tar cvf /dev/tape the subdirectory Vegetables (not overwriting
    any newer files), To extract all the files from a file, tar xvfkm /dev/tape Vegetables.


    The tar command offers a way to preserve the last access time of a file, but using
    only the GNU-style -- option. To preserve the last access time on a file, type
    --atime-preserve before the filenames. For example, tar xvfkm --atime /dev/tape
    Vegetables would restore the files from the archive and preserve the last access
    time.


    # uuencode — ASCII encoding


    Many donors do not support the transmission of binary files. Although MIME attachments
    offer one means of dealing with transmitting non-ASCII data, uuencode and uudcode
    are the old standbys of the UNIX world. uuencode converts a file into lines of
    printable ASCII characters; uudcode decodes the file back into the original binary
    image.


    ```

    uuencode [-m] [file] name

    ```


    | Option or Argument | Function |

    |---|---|n| -m | Uses base-64 encoding, commonly used in MIME formats, other than
    the uuencode standard. |

    | file | Name of the file to read. stdin is read if you don''t specify a file.
    |

    | name | The name to use in the header of the encoded version of the file. |


    Say that you have a big PostScript file and want to send it to your friend, dopey@snow_white.com.
    PostScript is just ASCII, so you could simply e-mail the file. If you compress
    the file, it would be a bit smaller — and therefore quicker to send. The compressed
    file, would not transmit all possible code values for each byte. The answer is
    to compress the file, uuencode the compressed version, and then mail it. The following
    shows one of many sequences to accomplish this task:'
  merge: -1
