  md: '# About the Author


    **Phil Hughes** is President of Specialized Systems Consultants (SSC) and publisher
    of *Linux Journal* magazine. He has authored or edited many of SSC''s Pocket Reference
    cards for the UNIX operating system and utility programs.


    Phil has worked in computing as a programmer and design specialist since 1968.
    He has worked with UNIX since 1980 as a systems programmer, consultant, trainer,
    and writer. In 1983, armed with one English class he took in college, Phil turned
    SSC into a company that specializes in documentation for UNIX systems.'
  merge: -1
  pgno: 4
