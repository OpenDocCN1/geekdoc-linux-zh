- img_proc: true
  md: '# Working with Run Levels


    | Field | Function |

    | --- | --- |

    | runlevel | A string of digits that identifies the run levels where this entry
    is to be activated. For example, the string 235 means this entry is to be activated
    at run levels 2, 3, and 5. |

    | action | The action to take with regard to this entry (see the following table).
    |

    | process | The process to be executed. |


    The following table lists valid choices for action:


    | Keyword | Meaning |

    | --- | --- |

    | boot | Executes the process during the system boot. The `runlevel` field is
    ignored. |

    | bootwait | Executes the process during the system boot and waits for it to complete
    before continuing the boot process. The `runlevel` field is ignored. |

    | ctrlaltet | Executes the process when Ctrl+Alt+Del is pressed on the system
    console. |

    | initdefault | Specifies the default run level in the `runlevel` field. |

    | kbrequest | Executes when a special keyboard sequence is received (still under
    development). |

    | off | This entry is ignored by init. |

    | once | Runs once when the specified run level is entered. |

    | demand | Runs when an `ondemand` run level is called (but no run level change
    is made). The `ondemand` run levels are a, b, and c. |

    | powerfail | Starts this process when a power failure signal is received. |

    | powerwait | Executes the process when a power failure signal is received; init
    waits for this process to be completed. |

    | powerokwait | Executes the process when the power ok (SIGPWR) signal is received.
    |

    | respawn | Starts a process and restarts it whenever it terminates. Programmers
    commonly use it for the getty processes that make logins possible on the consoles
    and serial ports. |

    | sysinit | Runs at boot time before any `boot` or `bootwait` entries. The `runlevel`
    field is ignored. |

    | wait | The process is executed when the run level is entered, and init waits
    for its completion. |'
  merge: -1
