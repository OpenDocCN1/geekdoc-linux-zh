    | String | Meaning |

    | Iname | Your login name for this machine. |

    | passwd | Your password for this machine. |


    You can place a line at the end of .netrc to instruct ftp to try the login as
    anonymous if the name of the remote system is not in the file:


    default login anonymous password me@myhost.com


    Make sure that you set the permissions so that you can read and write to your
    .netrc file (see also Part III for more information). Anyone who accesses this
    file has your passwords for all the machines you use. If you have doubts about
    system security, don''t use .netrc.


    # Downloading files with ftp


    When you download, retrieve, or get files, you transfer them from the remote machine
    to your local machine. Follow these steps to download files:


    +   1. Use the cd command and dir command to locate the files you want to download.

    2. Set your file transfer mode to match the type of files you intend to retrieve.
    To do this, type asc to set the mode to ASCII for text files, or type bin for
    non-ASCII files.

    3. Get type, then the name of the file you want to retrieve, and optionally, a
    new name for the file on the local system. If you omit the name, the local file
    will have the same name as the remote file.


    For example, this session retrieves the NOTES file from the current directory
    on the remote system and saves it in /tmp/new.notes on your local system:


    ```

    ftp get NOTES /tmp/new.notes

    local: /tmp/new.notes remote: NOTES

    200 PORT command successful.

    150 Opening BINARY mode data connection for NOTES

    (4157 bytes).

    226 Transfer complete.

    4157 bytes received in 0.026 secs (1.5e+02 Kbytes/sec)

    ```


    In ASCII mode, ftp performs line-end conversions (such as translating the MS-DOS
    Return/Newline sequence to Neweline). If local and remote systems use the same
    operating system (LINUX or UNIX on both ends), you can safely use bin mode for
    all file transfers.'
