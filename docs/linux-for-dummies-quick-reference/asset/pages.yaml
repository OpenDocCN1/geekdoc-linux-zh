  md: '# Archiving, Converting, and Other File Manipulation 37


    gzip bigfile.ps

    uuencode bigfile.ps.gz | mail dopey@snow_white.com


    # uudcode — Decoding ASCII encoding


    If you receive a uudencoded file, you can use this command to decode it.


    ```

    uudecode [-o outname] [file]

    ```


    | Option or Argument | Function |


    | -o outname | Name of the file to create. By default, the name is specified on
    the first line of the encoded file. |


    | file | Name of the uudencoded file. If not specified, stdin is read. |


    Suppose that your friend dopey@snow_white.com has just received this file that
    claims to be uudencoded. Dpey saves the file as strange_file and now wants to
    decode it. Dpey enters


    ```

    uudecode strange_file

    ```


    Magically, a new file bigfile.ps.gz appears in his current directory. He can now
    decompress the file and print it, using the following code:


    ```

    gunzip bigfile.ps.gz

    lpr bigfile.ps

    ```


    uudecode is smart enough to figure out what sort of encoding was used on the file.


    # zcat — Listing files without decompressing


    If you want to list a file that has been compressed with the UNIX compress command
    or gzip, the command zcat offers an alternative to having to decompress the file
    and then run an additional command (such as cat) to actually do the intended operation
    on the file.


    ```

    zcat [file]

    ```


    If you don''t specify a file, zcat reads from stdin.


    Say that you have all your best vegetarian recipes in a compressed file called
    healthy_food.gz and you want to take a quick look for your tempeh stew recipe.
    You can search for a string using less, but less can read a compressed file. Rather
    than have to decompress the file, use zcat.'
