  md: '# Editing Text with vi 111


    To enter vi and have the window display at a particular location in a file, enter
    vi /pattern filename (with pattern and brackets, replaced with the actual commands)
    at the shell prompt. vi starts with the cursor located on the first occurrence
    of pattern. Note that this pattern is actually a Regular Expression (see also
    Part X).


    # Using insert mode


    You enter text in insert mode. Some people call it input mode, so don''t be confused
    if I also call it insert mode. No matter what you call it, you enter text by following
    these steps:


    +   1. Type i (for insert).

    2. Type your text, pressing Enter where you want to break the lines.

    3. When you are done inputting, press Esc to return to command mode.


    You can enter insert mode in other ways. You can determine where the text will
    be inserted by using different commands, as the following table shows.


    | Command | Action | Result |

    |---|---|---|n| i | insert | Inserts text at the current cursor location |

    | I | insert | Inserts text at the beginning of the current line |

    | o | open | Inserts a new line below the current line |

    | 0 | open | Inserts a new line above the current line |

    | a | append | Inserts text after the current cursor location |

    | A | append | Inserts text after the last character in the current line |


    When entering text, you sometimes need to insert a character, such as Esc or Enter,
    that has a special meaning to vi. To turn off this special meaning, press Ctrl+V
    before the desired character. For example, to enter an Esc character while in
    insert mode, press Ctrl+V, Esc.


    vi includes two features to help you make sure your parentheses, brackets, braces
    match. If you set the showmatch option (see also the section "Setting options,"
    earlier in this part), the cursor flashes back to the matching parenthesis, bracket,
    or brace when you enter the closing one.


    In command mode, if you type % while the cursor is on a parenthesis, bracket,
    or brace, the cursor moves to its mate.'
