- img_proc: true
  md: '# Creating shell aliases


    While you can use shell and environment variables to remember what''s in a character
    string, shell alias is specifically designed to allow you to make names for commands.


    ```

    alias [name=command]]

    ```


    | Argument | Function |

    | --- | --- |

    | name | The name of the alias. If not specified, alias lists all your aliases.
    |

    | command | Command string assigned to the alias. If command contains any spaces
    or special characters, it must be quoted. |


    Suppose that you want to occasionally print files on a printer named soy (rather
    than your default printer). Normally, you can type lpr -P soy file to the other
    printer, but you want an easier way. The following command establishes an alias
    lpsoy that would do this for you.


    ```

    alias lpsoy=''lpr -P soy''

    ```


    After the alias is created, you can direct your printer output to printer soy
    using the alias. For example, to print the file lentil.loaf, type lpsoy lentil.loaf.


    You can use the unalias command to delete a shell alias. For example, to delete
    your alias lpsoy, type unalias lpsoy.


    # Displaying environment variables


    Any environment variable is also available as a shell variable, so you can display
    an environment variable just as you would a shell variable — by using the prefix
    as an argument to a command (such as echo) that displays the value of its arguments.


    ```

    echo $var

    ```


    | Option or Argument | Function |

    | --- | --- |

    | var | Name of the environment (or shell) variable to display |


    Figuring out which variables are local to your current shell and which are from
    the environment can be confusing. Type export with no variable names to see a
    list of variables that are exported.


    Suppose that you have written some shell scripts that e-mail recipes to your fellow
    vegetarians. The scripts need to know where you keep your list of e-mail addresses.
    The shell scripts also need to know the name of the directory where the recipes
    are'
