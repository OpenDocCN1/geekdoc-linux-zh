  md: '# Configuring X 85


    Unless you have a configuration file that is close to what you want, you are better
    off using Xconfigurator or xf86config. Both programs can generally be found in
    the /usr/X11R6/bin directory.


    These programs created the configuration file XF86Config, which will be in either
    the /etc/X11 or the /usr/X11R6/lib/X11 directory. After the file is created, you
    may want to make manual changes. Here is the general layout of the file:


    | Section | Function |

    | --- | --- |

    | Files | Establish any files (such as font files) needed |

    | ServerFlags | Configure the server (abort, debugging, and so on) |

    | Keyboard | Set up keyboard characteristics |

    | Pointer | Set up your mouse or other pointing device |

    | Monitor | Establish the capabilities of your monitor |

    | Device | Establish the characteristics of your video board |

    | Screen | Set the server, pixel depth, and resolution |


    The XF86Config is heavily commented, so it should be easy to locate and change
    the characteristics you want. You should, however, keep a copy of a working XF86Config
    file just in case you make a mistake.


    # Setting up XDM


    XDM, the X Display Manager, allows you to always be in X rather than have to log
    on with a text screen and start X. If LINUX distribution has an X-based run level
    (**see also** "Working with Run Levels" in Part IX), you can just change to that
    run level `telinit`. For example, that is run level 5 in Red Hat 5.1, so you can
    just enter the following command: /sbin/telinit 5.


    If you want your system to always start up with XDM running, you should do the
    following:


    +   1. Log on as root.

    2. Edit the file `/etc/initab`.

    3. Locate the line that has `initdefault` in the third field (example, `initdefault:`).

    4. The second field is the run level. Change this number to the run level for
    starting XDM (5 in Red Hat 5.1).

    5. Save the updated file.

    6. Either force `init` to rerad `/etc/initab` by entering `/sbin/telinit` q, or
    reboot.'
