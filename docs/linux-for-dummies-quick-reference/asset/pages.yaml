    biggie login: fyl

    Password:

    Last login: Sun Oct 5 13:48:51 from smiley.fylz.com

    Linux 1.3.57.


    ```

    biggie:~$

    ```


    # Terminating your telnet session


    You can quickly terminate your telnet session by exiting the remote system way
    you normally exit the remote system (by entering exit or logout, for example,
    if you are on a UNIX or LINUX system).


    Here is the fail-safe way to exit telnet (even if the remote system is not currently
    responding):


    +   1. Enter the telnet escape command (usually Ctrl+]).

    2. At the telnet> prompt, type close to terminate the connection, or type quit
    to terminate the connection and exit telnet.


    # traceroute — Finding the Route to a Remote Host


    Why is the Internet slow? Why is your LAN slow? Why can''t you talk to a particular
    host? These are the sorts of questions traceroute is designed to answer.


    The traceroute program does its thing by sending ICMP (Internet Control Message
    Protocol) packets with small time-to-live values and interpreting the responses
    to build a map of the path from your local machine to the distant host. The transmission
    of a packet from one to another is calculated in hops. For example, if the time-to-live
    value is ten, after the message has traveled (hopped) through ten hosts, it is
    considered undeliverable.(I recommend sticking with the default settings in the
    table that follows.)


    The Internet is a heterogeneous mix of computers. Not every computer or operating
    system handles these ICMP packets correctly. You may notice gaps or anomalies
    in the output of traceroute.


    ```

    traceroute [-m max] [-n] [-qcount] [-w time] host

    ```


    ![](img/74a57ca3470b31765a6f932d60bcc72e_176_0.png)'
