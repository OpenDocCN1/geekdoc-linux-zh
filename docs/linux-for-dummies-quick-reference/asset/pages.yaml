    ```


    The easiest way to find something in a file is to search for it. The / command
    searches forward for the pattern (actually, the Regular Expression) that you enter
    after it. The ? command searches in the reverse direction.


    Type n to repeat the last search from the current cursor location. You can also
    repeat the last search in the opposite direction by typing N.


    The following figure gives you a "window" into a file and shows the positions
    of the cursor about to be described.

    Assume that the cursor is initially positioned at the beginning of the word developers.
    When you enter /, the cursor then moves down to the status line. After entering
    a search string (th) and pressing Enter, the cursor moves forward to the next
    occurrence at the t in that. There are no more forward-direction occurrences of
    th in the file, so the search wraps around to the beginning. Type n again and
    the cursor moves to the t in the first line.


    # Setting options


    Editing options can be divided into two types: those that are on or off, and those
    that have a value assigned to them. You can configure these options in many different
    ways.


    +   * To set an on/off option to on, type :set option_name and press Enter.

    * To set an on/off option to off, type :set nooption_name and press Enter.

    * To assign a value to an option, type :set option_name=value.


