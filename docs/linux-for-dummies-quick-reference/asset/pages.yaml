  md: '# 156 Setting Up Your System to Use rlogin and rsh


    You cannot run commands such as vi that require character-level interaction using
    rsh. If you wish to run such a command remotely, use rlogin.


    When you use rsh, you have to be concerned about which machine — the local one
    or the remote one — is interpreting the commands:


    +   * The local machine interprets shell metacharacters that are not quoted.


    +   * The remote machine interprets quoted metacharacters.


    For example,


    ```

    rsh tofu date > local.output

    ```


    executes the date command on the remote host (tofu) but saves the output in a
    file named local.output on your computer. However, this command


    ```

    rsh tofu date ''>'' remote.output

    ```


    executes date on the remote host and saves the output on the remote machine in
    a file named remote.output. Note that you can write this command as follows:


    ```

    rsh tofu ''<date> remote.output''

    ```


    # Setting Up Your System to Use rlogin and rsh without Passwords


    rlogin and rsh need to establish your real identity before they allow you to access
    a remote machine. The default configuration is to assume that you are attempting
    a remote login from a machine that may not be trustworthy. If you want to allow
    access without passwords, you need to configure the remote computer to accept
    the remote machine as equivalent and that any login attempts are from the users
    they claim to be. You can use either one of the following configurations:


    +   * Establish system-wide configuration using the /etc/hosts.equiv file. This
    configuration applies to a single computer, or if the computer is on a network
    using NIS, it could be an entire network (see the NIS HowTo at www.linuxresources.com/LDP).


    +   * Create your own personal configuration using the $HOME/.hosts file, which
    grants only password-free access.


    ![](img/74a57ca3470b31765a6f932d60bcc72e_173_0.png)'
  merge: -1
