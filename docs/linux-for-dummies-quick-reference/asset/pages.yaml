  md: 'In the previous line of code, the shell interprets the first and third asterisk
    but not the second one. Therefore, it matches any set of characters that contains
    an asterisk.


    You can use double and single quotation marks (" and '') to quote whole strings.
    Their meaning is somewhat different.


    +   - Single quotation marks quote almost everything.


    +   - Double quotation marks allow the shell to interpret words that start with
    a $, which are commonly known as shell variables.


    +   - You can use a single quotation mark to turn off the special meaning of a
    double quotation mark, and vice versa.


    For example, in the following command, the double quotation marks prevent the
    shell from interpreting the special meaning of the single quotation mark in it''s
    but they allow $money to be treated as a reference to a shell variable. The double
    quotation marks also prevent the shell from interpreting the whitespace so that
    it''s my $money is treated as a single argument rather than three separate ones.


    ```

    grep "it''s my $money" junkfile

    ```


    # Using the back-quote character (`)


    The single back-quote character (`) is useful for telling the shell to execute
    a command within the back quotation marks, insert the output of the execution
    into the original command line in place of the command in back quotation marks,
    and then execute the newly built in command line. You can use this trick to display
    a message that contains the current date.


    echo Gee, today is `date` soon it will be my birthday


    The date displays a timestamp to standard output. By embedding the date command
    within quotation marks in the echo command, the shell substitutes the result of
    executing date into the command line before executing the echo command. (The following
    code shows the input lines in bold.)


    ```

    date

    Fri Jul 10 09:30:18 PDT 1998

    echo Gee, today is `date` soon it will be

    my birthday

    Gee, today is Fri Jul 10 09:30:18 PDT 1998 soon it

    will be be my birthday

    ```'
