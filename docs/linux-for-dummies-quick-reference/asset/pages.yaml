  md: '# Shutting Down LINUX


    As part of your systems administration duties, you may be called upon to bring
    LINUX down in an orderly and secure way. To do so, you must follow these steps


    +   1. Notify all logged-in users that the system is going down.

    2. Block new logins.

    3. Notify all programs that the system is going down (so that they can do their
    cleanup).


    ```

    shutdown [-h] [-r] time [message]

    ```


    | Option or Argument | Function |

    |---|---|

    | -h | Halts the system after shutdown |

    | -r | Reboots the system after shutdown (default). |

    | time | When to perform the shutdown. This can be an absolute time specified
    as hh:mm or a number of minutes to wait before performing the shutdown specified
    as +mins. The command now is a synonym for +mins. |

    | message | A message to send to all users. |


    To shut down the system 5 minutes from now and notify users that the system will
    be down for 30 minutes, you would type shutdown -h +5 Back up in 30 minutes.


    Each user would receive a message that looks like this:


    > Broadcast message from root (tty3) Wed Oct 8 15:16:17 1997 ... Back up in 30
    minutes. The system is going DOWN for system halt in 5 minutes !!


    Don''t simply push reset or turn the power off to shut down the system. LINUX
    buffers a lot of information (in order to run efficiently). If you don''t give
    LINUX a chance to do its cleanup, your files may be damaged. The Linux file system
    is extremely good at recovering from such a powerdown, but that''s no excuse to
    risk damaging the system.


    # Starting LINUX


    The way you configure LILO (the boot loader) when you install LINUX determines
    how the system starts up. You probably installed LILO in one of three modes:'
