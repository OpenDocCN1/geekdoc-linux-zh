  md: '# Accessing Pull-Down Menus


    FVWM95 allows you to specify a focus style per window. By using this capability,
    you can prevent focus from automatically changing to windows where you would not
    typically enter data, thus removing the focus from a terminal window.


    # The Pager


    The Pager is a module of FVWM that displays a miniature view of all the desktops.
    You can switch to a different desktop by clicking that desktop''s mini-image in
    the pager.


    Directly to the left of the Pager is a rectangle that shows a jagged graph at
    the bottom. This graph displays the output of a program called xload, which shows
    system load over time. Essentially, the taller the graph, the greater the load.


    # The root window


    The background (the area on the screen where no windows appear) is called the
    root window. This area normally consists of a solid color, but you can run a program
    that offers a changing background. Two examples are xearth and xfisht.


    # The Task bar


    If you are using the Win95-like decoration of FVWM95, the Task bar appears across
    the bottom of the screen. You can use the Start button on the left end of the
    Task bar to access menus that start additional applications. The other buttons
    on the Task bar represent other programs or applications. You click these buttons
    to change the active (meaning, selected) task. The active task''s button appears
    depressed; all others appear raised.


    # Accessing Pull-Down Menus


    A whole host of pull-down menus is available. Included in these menus are the
    following:


    +   * An entry to start a new terminal window (shell)

    * Lists of programs that may be started

    * A screen lock utility

    * System preference and configuration options

    * A window operations window

    * An exit button for leaving X'
  merge: -1
