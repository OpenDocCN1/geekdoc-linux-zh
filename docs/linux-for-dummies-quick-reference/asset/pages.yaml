  md: '# Getting to Know LINUX


    The capabilities of the LINUX operating system rival that of commercial products
    that cost big companies millions of dollars to develop, but with one big difference
    — LINUX is available free to anyone who wants it. As you find out more about LINUX,
    you can see what made it possible in the first place as well as what it can accomplish
    for you.


    For UNIX users out there, LINUX offers all the familiar UNIX capabilities and
    features, plus a few new capabilities that you may have wished for on your UNIX
    system.


    In this part...


    +   - Understanding the origin of LINUX

    - Finding out about LINUX distributions

    - Installing LINUX


    ![](img/74a57ca3470b31765a6f932d60bcc72e_22_0.png)'
