  md: '# Working with the System


    | Argument | Function |

    | --- | --- |

    | value | You can pass a value back to the calling shell by setting value. By
    convention, zero indicates success and nonzero values are used to indicate a particular
    type of failure. |


    All commands return an exit status. You can display the current exit status by
    echoing the current value of the exit status variable. The Bourne shell and its
    relatives store this value in $?. C Shell relatives store it in $. Remember, every
    command returns a status, so after you have read the status, you have changed
    its meaning to the success or failure of the command that you read. If you need
    to use the status value more than once, the first thing you need to do is save
    the value in another shell variable.


    # finger — Checking up on users


    The finger command displays information about a specified user or all users on
    either your local machine or a specified machine. If you finger an individual
    user, the user''s current login status and the contents of the user''s .plan file
    are displayed. If you finger a computer (for example, finger @42.com), finger
    shows the status of everyone currently logged in.


    ```

    finger [-l] [-m] [-p] [-s] [what]

    ```


    You can use the finger command locally or over a network.


    | Argument or Option | Function |

    | --- | --- |

    | -l | Displays the long format of finger information (default for finger of one
    user). |

    | -m | Matches only login names — doesn''t attempt to match what to a user''s
    name. |

    | p | Doesn''t display .plan and project files. |

    | s | Displays the short format of finger information (default for finger of an
    entire machine). |

    | what | A login name, machine name in the form @machine, or login and machine
    name in the form user@machine. If omitted, information on all users on the current
    machine is displayed.|


    Suppose that you want to find out whether your friend Ellen is logged on to her
    machine. You know that her machine is uncle.ssc.com and her login is emd. You
    can finger her computer with either of the following commands:


    ```

    finger emd@uncle.ssc.com

    finger ellen@uncle.ssc.com

    ```'
