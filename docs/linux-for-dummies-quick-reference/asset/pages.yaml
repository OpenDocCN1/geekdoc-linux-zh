  md: '# Networking


    The Internet, the largest and most well-known networking system, is really what
    made LINUX happen. Without the Internet, the cooperative effort that went into
    developing LINUX wouldn''t have been possible. So, it only stands to reason that
    LINUX provides you with the means to exchange data with the wide world of computer
    users.


    In this part ...


    +   - Transferring files over a network

    - Working interactively on remote machines

    - Checking network connectivity


    ![](img/74a57ca3470b31765a6f932d60bcc72e_160_0.png)'
