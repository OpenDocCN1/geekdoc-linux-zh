  md: '# 146 ftp — Transferring Files


    +   1. At your shell prompt, type ftp followed by the name of the remote system.


    +   2. When prompted for a login name, type anonymous.


    +   3. When prompted for a password, enter your e-mail address.

    You then get a message that you''re logged in.


    Most systems offer a program nctfp. It offers a friendlier interface that includes
    a bookmark file where you can save your favorite FTP sites and logins. To see
    whether nctfp is available, type ncftp at your shell prompt. If it comes up, type
    help to display the help screen.


    # Connecting to the remote system


    You can connect to the remote system by following these steps:


    +   1. At the shell prompt, type ftp followed by the name of the remote system.
    ftp then asks you for your user name and password.


    +   2. Type your name and password, and you should receive a message indicating
    that you are logged in.


    A sample login session looks like this:


    ```

    [fyl@smiley fyl]$ ftp orange.fylz.com

    Connected to orange.fylz.com.

    220 orange.fylz.com FTP server ready.

    Name (orange:fyl): fyl

    331 Password required for fyl.

    Password: enter_password_here

    230 User fyl logged in.

    Remote system type is UNIX.

    Using binary mode to transfer files.>

    ```


    # Configuring .netrc for automatic logins


    When you start the ftp program, it looks for a file named .netrc in your home
    directory. .netrc contains the information to automatically log in to remote machines.


    You can create .netrc with your text editor. Each line consists of the following:


    ```

    machine mname login iName password passwd

    ```


    | String | Meaning |

    | mname | The name of the remote system (for example, ftp.ssc.com). |'
