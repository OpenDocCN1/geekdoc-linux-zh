  md: '# Fixing the routing


    When pppd has successfully completed negotiation (the setup sequence in which
    PPP establishes transmission parameters), it informs the kernel of the local and
    report IP addresses. (See also "The pppd program," later in this part.) The kernel
    uses this information to add a default route to the remote end of the link.


    +   * If you have specified the defaultroute option to pppd, pppd asks the kernel
    to add a default route to the routing table for this interface.


    +   * If your machine is a gateway on a LAN, you probably should specify proxyarp
    in order to allow other hosts to communicate with the remote host. This option
    causes pppd to look for a network interface on the same subnet as the remote host.
    If found, pppd creates an ARP entry with the IP address of the remote host and
    the hardware address of the network interface it found.


    +   * If you need to do something special after your connection is established,
    you can add commands to /etc/ppp/ip-up. This script is executed after the link
    is up.


    +   * You can use the ifconfig and route commands.


    # Mail servers


    If you use Post Office Protocol (POP) to retrieve messages, you need to tell the
    program you use to retrieve your e-mail about the POP server name. The program
    you use most likely is fetch. (See also Part VI for more information on POP.)


    If you send mail via SMTP, you probably want to send your mail to a machine at
    your ISP, which will then forward it over the Internet. This machine is called
    your smart host. Without a smart host, you would have to configure your local
    system to perform all the address lookups on the Internet and be responsible for
    mail forwarding to the final destination. Besides creating work, your local machine
    would have to stay connected to the Internet until all mail is delivered.


    To configure your system using a smart host, you need to give the name of the
    mail host to your mail transfer agent. If your MTA is sendmail, you need to assign
    the smart host name to the S scratch in the sendmail.cf file. (For more information
    on configuring sendmail, see the Network Administrators Guide and Linux-HOWTO.
    Both are available online from the LINUX Documentation Project. Most distributions
    include the HowTos on their CDs.)


    ![](img/74a57ca3470b31765a6f932d60bcc72e_190_0.png)'
