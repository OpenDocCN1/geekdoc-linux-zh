  md: '# Files Associated with a Program


    is not your home directory but you want to get a list of the files in your home
    directory, you can type `ls ~` as an alternative to `ls /home/phil`.


    You can also follow the tilde with a user name (such as `~tempeh`) to access information
    in the directory of the user named `tempeh`. For example, to change your current
    directory to a directory named Carrots that is in the home of a user whose login
    name is tempeh, `cd ~tempeh/Carrots`.


    # Files Associated with a Program


    Whenever you start any program, three files are associated with the program. In
    LINUXspeak, these files are referred to as:


    +   * stdin for standard input

    * stdout for standard output

    * stderr for standard error


    # Redirecting the files


    The files associated with a program are all initially associated with both your
    keyboard and display, but you can also connect the files to other files and programs.
    The following table lists characters you can use to redirect the files


    | Redirection Character | What It Does |

    | --- | --- |

    | > | Redirects the output of the command to a file or device.

    | >> | Acts like >, but if the file already exists, appends the new data to the
    end of an existing file. If the file does not exist, it is created.

    | 2> | Redirects the error output (also called stderr) of a command to a file
    or device. (Error output is a second output file available to every program. The
    program itself decides which output to write to stdout and which to write to stderr.)

    | < | Redirects the input of the command from a file or device.

    | \| | Joins two simple commands so that they work together in a more useful way.
    (This character is called a pipe. **See also** the next section, "Connecting commands,"
    for more on pipes.) |'
