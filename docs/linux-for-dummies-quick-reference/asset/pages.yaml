  md: '# 180 Using the cron Program


    +   - Immediately boot LINUX.

    - Wait a predetermined amount of time (such as five seconds) and then boot some
    operating system.

    - Wait until a system ID is entered at the LILO prompt.


    For more information about configuring LILO, see the “Installing LILO” section
    in LINUX SECRETS, 2nd Edition.

    The following steps work no matter how you configure LILO.


    +   1. When your computer is starting up, press and hold down the Shift key and
    wait for the LILO prompt.

    2. Release the Shift key and press Tab. LILO displays a list of boot choices (such
    as DOS, LINUX, or whatever you decided to type when you configured LILO).

    3. Type your selection and press Enter. LILO locates and loads the system you
    choose.


    If you have just booted LINUX and want to go back and and check the startup messages,
    you can page through the messages with Shift+PageUp and Shift+PageDown.


    # Using the cron Program


    The cron program is started at boot time and runs every minute. cron then runs
    any jobs that are scheduled to run at the current time. The scheduled jobs are
    in either /etc/crontab (the system crontab file) or in files whose names are the
    individual user names in the /var/spool/cron/crontabs directory.

    to change the system crontab file, you need only to edit the file and make the
    desired modifications. The cron program checks the file each time it runs. You
    can modify individual crontab files by using the cron program. (See also Part
    III for more on)


    # Working with Run Levels


    Run levels allow the system to be configured in many different ways without having
    to modify configuration files. Each run level represents a particular configuration.
    For example, you might want to have one run level for your system running alone
    and another for your system connected to a network (local, PPP link, or both).


    ![](img/74a57ca3470b31765a6f932d60bcc72e_197_0.png)'
