  md: '# Working with MS-DOS Media


    # mtype — Displaying file contents


    The command mtype displays the contents of a file on the screen. It also has options
    to do some minor translations during the display process.


    ```

    mtype [-s] [-t] dos_files

    ```


    | Option or Argument | Function |

    | - | - |

    | -s | Strips the high bit from the data. |

    | -t | Translates Return/Newline to Newline. |

    | dos_files | Names of files to display. |


    copy does not allow you to append files as its MS-DOS equivalent does. To append
    files, use mtype and redirect its output to a file. For example, to append two.nd
    to the end of fir.st from the first floppy and put the result in both.files, type
    mtype a:fir.st a:two.nd > both.files.


    # xcopy — Copying one directory to another


    xcopy reproduces the file hierarchy under one directory in another location by
    copying all the files and subdirectories.


    ```

    xcopy source_dir target_dir

    ```


    | Argument | Function |

    | - | - |

    | source_dir | Directory of files to copy. |

    | target_dir | Destination of copy. If target_dir does not exist, xcopy creates
    it and the files are copied directly into it. |


    # More Mtools commands


    The following commands are also included in the Mtools utilities.


    | Command | Function |

    | - | - |

    | mattrib | Sets/clears attribute bits. |

    | mbad | Scans for bad blocks. |

    | mdeltree | Deletes a directory tree. |

    | mformat | Formats an MS-DOS disk. |

    | mininfo | Displays the content of the fields of the boot sector of an MS-DOS
    file system. |

    | mkmanifest | Creates a LINUX shell script to unmangle the MS-DOS conversion
    to 8.3 filenames. |

    | mlabel | Adds a volume label. |'
  merge: -1
