  md: '# Formatting Text with fmt


    This is just a sampling of what vi can do. A list of every command would fill
    a couple dozen pages of this book. A handy reference card is available from www.ssc.com.


    # Formatting Text with fmt


    fmt is a simple text formatter that fills and joins lines to make text look more
    uniform in length. It isn''t a text processor; it just cleans up files a bit while
    preserving indent and blank lines.


    ```

    fmt [-w width] [files]

    ```


    | Option or Argument | Function |

    | --- | --- |

    | -w width | Maximum output line length in characters (72 default). |

    | files | Text to read. If you don''t specify any files, stdin is read. |


    The output of fmt is sent to stdout.


    Suppose that you have been editing a file named my.novel and the lines are all
    sorts of strange lengths. You can use the following command to make all lines
    65 characters long and save a new version in my.new.novel.


    ```

    fmt -w 65 my.novel >my.new.novel

    ```


    You can use fmt while you are vi to reformat text. To reformat the current paragraph,
    move the cursor to the top of the paragraph, type ! fmt ), and press Enter.


    # Formatting Text with groff


    groff is the GNU version of troff, the text formatting system that turned UNIX
    into something useful for Bell Labs. People have written complete books on text.
    I have written this section merely to help you understand what it is and how to
    print the documents that are formatted in groff on your LINUX system.


    +   * groff uses commands embedded in text files to control formatting. They consist
    of commands that start with a dot (.) plus control sequences that start with a
    backslash (\).

    * groff has macro packages that are designed for specific uses: for manuals, ms
    and mm for documents, and for doing for your CS thesis at U.C. Berkeley.

    * groff has preprocessors for handling tables (tbl), equations (eqn), and pictures
    (pic).'
  merge: -1
