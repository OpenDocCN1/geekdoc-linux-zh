  md: '# Working with Run Levels


    # System run levels


    When you start LINUX, various programs need to be started. In order to make the
    program selection configurable, there exists a file called /etc/initab and a set
    of directories containing startup scripts or programs. On Red Hat, these directories
    are in the /etc/rc.d directory. On Debian, they are in /etc. Although some room
    for variability between LINUX flavors exists, the following table provides you
    with the general:


    | Filename | Function |

    |---|---|

    | init.d | Master directory of all the startup files. Each run level links back
    to the files in this directory. |

    | rc | Initial startup file. It is also executed when the run level is changed.
    On Debian, a directory named rc.boot contains startup files. |

    | rc0.d | Directory of files to run at run level 0. |

    | rc1.d | Directory of files to run at run level 1. |

    | rc2.d | Directory of files to run at run level 2. |

    | rc3.d | Directory of files to run at run level 3. |

    | rc4.d | Directory of files to run at run level 4. |

    | rc5.d | Directory of files to run at run level 5. |

    | rc6.d | Directory of files to run at run level 6. |

    | rc.local | Local configuration file. |

    | rc.sysinit | File that is run at boot time. (Red Hat only.) |


    The run level scheme just described was derived from UNIX System V. Some earlier
    LINUX distributions don''t use it. They use a system based on Berkeley Unix which
    has files rather than directories for each run. The files have names such as rc.1,
    rc.2 and so on. The basic concept is the same, but you have to edit multiple files
    to make a change that affects multiple run levels.


    Along with the run levels and directories, the /etc/initab controls the system
    action at each run level. Each line in this file is a sequence of commands separated
    by colons with entries in the following format:


    ```

    id:runlevels:action:process

    ```


    The fields are defined as shown in the following table:


    | Field | Function |

    |---|---|

    | id | A one- to four-character identifier that uniquely identifies the line.
    |'
  merge: -1
