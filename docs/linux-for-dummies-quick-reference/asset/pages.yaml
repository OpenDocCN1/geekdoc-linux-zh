  md: '# Using Attributes and Permissions


    # chown — Changing the owner of a file


    Each file has an owner and also belongs to a particular group. You can change
    either (use .group to change group only) or both using the chown command.


    You can change the ownership of a file only if you logged as root.


    ```

    chown [-R] [user][.group] files

    ```


    | Option or Argument | Function |

    | -R | Recursively changes ownership of directories and their contents. |

    | user | New user ID for the files. |

    | group | New group ID for the files. |


    Say that you have permission to log on as root and you want to make a copy of
    your recipe files for your new user, Donnie. Donnie a good place for these files
    from your Good_Food directory is in a similar directory in Donnie''s hierarchy.


    ```

    cd Good_Food

    su - ~donnie/Good_Food

    mkdir ~donnie/Good_Food

    cp * ~donnie/Good_Food

    chown -R donnie ~donnie/Good_Food

    exit

    ```


    Although the preceding example works, a safer way to do this would be to make
    your files available for read by Donnie and let Donnie make the directory and
    copy the files. As a general rule, do all you can to avoid being logged on as
    root, a situation in which a simple mistake can have much more impact than if
    you were just logged on as a user.


    # umask — Changing your default file creation mask


    When you run a program that creates a file, that program requests certain permissions.
    For example, a text editor normally asks for read/write permission for everyone
    (user, group, and other), and a program that is building an executable program
    would also ask for execution permission. The permissions received are limited
    by the value of your umask. Any bit set in a umask corresponds to a permission
    that is not granted. For example, if your umask is set to 0, nothing is limited,
    and all permissions are granted for. Each bit set in umask means that you will
    not get that permission in the file that you create.'
  merge: -1
