    | Option or Argument | Function |

    | --- | --- |

    | -a | Includes hidden files in the list. |

    | -f | Fast output — doesn''t include frepace count. |

    | -w | Wide output — lists filenames with no size or date information. |

    | dos_dir | Name of the directory whose contents are to be listed. |

    | dos_file | MS-DOS filenames (possibly using wildcard notation). |


    # mininfo — Printing MS-DOS file system parameters


