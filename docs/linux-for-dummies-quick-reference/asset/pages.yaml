  md: '# Spell-Checking with ispell


    You can build your own hash tables for ispell (the lookup tables that enable ispell
    to find words quickly). if you would like to do this, check out the documentation
    on buildhash, munchlist, findaffix, tryfix, icombine, and ijoin on the ispell
    man page.


    ispell includes dictionaries for English, Danish, French, German, Italian, Spanish,
    Swedish, and perhaps more languages.


    Although seldom used, ispell has an array of command-line options. My favorites
    follow:


    | Option | What It Does |

    |---|---|

    | b | Creates a backup file by appending .bak to the name of the input file |

    | -n | Assumes that the input file is in troff format |

    | -pfile | Uses file as your personal dictionary |

    | -S | Sorts ispell guesses by probability of correctness rather than alphabetically
    |

    | -t | Assumes that the input file is in TeX or LaTeX format |


    If you use ispell with TeX or LaTeX, take a look at the man page. ispell treats
