  md: '# Using Button Bars


    Button bars allow you to access an action directly without going to a menu. You
    can display most of the pull-down menus described in the following sections as
    button bars. If you can select the title line by clicking it, you can create a
    button bar that offers those menu options. To bring up a button bar:


    +   1. Click the Start button or anywhere in the root window.

    2. Move the mouse to the desired sub-menu.

    3. Click the sub-menu title.


    The button bar appears in some free real estate at the top of your screen.

    One of the handiest sub-menus to turn into a button bar is the Window Operations
    sub-menu. You can then modify any window (or even a button bar) by just clicking
    the desired button, moving the mouse cursor to the window where you want to perform
    the operation, and clicking.


