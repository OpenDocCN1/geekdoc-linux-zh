  md: '# Accessing Pull-Down Menus


    # Bringing up a pull-down menu


    Although Windows 95 users may be more comfortable using the Start button, you
    can access the menus by following these steps:


    +   1. Move the mouse cursor to the root window (background).

    2. Click to activate the menu. The menus are multilevel. That means that there
    are layers of sub-menus. Just move to each item you you want and click to get
    the next sub-menu.

    3. When you get to the application you want to run, click the name.


    You can always start programs from the shell prompt. By using the shell alias
    command (**see also "Aliases," Part II**), you can create abbreviations for your
    favorite commands.


    # Sub-menu choices


    There is no standard for what sub-menus exist. It is really up to the distributor
    or the user to configure the menus so that they are easy to use. Typical categories
    for programs include


    +   * Administration

    * Applications

    * Games or amusements

    * Graphics

    * Networking

    * Utilities


    # Window Operations menu


    The Windows Operations pull-down menu contains options that direct the window
    manager to take some action on a client window. I describe most of these actions
    elsewhere in this part, so this section simply lists them.


    You can select the Window Operations pull-down menu by clicking and holding the
    center mouse button while the mouse cursor is on the title bar.


    | Program Name | Function |

    | Move | Moves a window by using click and drag |

    | Resize | Changes the size of a window using click and drag |

    | Raise | Moves window to the top of all stacked windows |'
