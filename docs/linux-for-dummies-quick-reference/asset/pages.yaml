    The gv program is a GUI front end for GhostScript, the PostScript-to-almost-anything
    translator. This program allows you to scale a document, print parts of it, and
    otherwise manipulate a PostScript file.


    Another program that acts as a front end for GhostScript is called Ghostview.
    It is available in the Applications pull-down menu.


