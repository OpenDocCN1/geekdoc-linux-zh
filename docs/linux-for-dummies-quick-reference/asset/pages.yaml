    # hmdir — Creating a new directory


    Use the command hmdir to create new directories on the current Mac disk.


    ```

    hmdir hfs_paths

    ```


    | Argument | Function |

    |---|---|

    | hfs_paths | Pathname of the directories to create. |


    # hmount — Mounting an HFS volume


    You must use hmount to mount a Mac HFS volume before you can use any of the other
    commands that access the volume.


    ```

    hmount source_path [path]

    ```


    | Argument | Function |

    |---|---|

    | source_path | LINUX pathname to a block device or regular file containing an
    HFS volume image. |

    | part | Use partition number part as the partition to mount. If you do not specify,
    the first HFS partition is mounted. |


    # hmount — Unmounting an HFS volume


    You generally do not need to use the hmount command. It only updates $HOME/.hcwd.


    ```

    hunmount [volume]

    ```


    | Argument | Function |

    |---|---|

    | volume | The volume name or path to the HFS volume to unmount. If you do not
    specify, the current HFS volume is unmounted. |'
