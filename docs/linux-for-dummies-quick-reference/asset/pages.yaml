  md: '# telnet — Logging in Remotely


    # telnet — Logging in Remotely


    telnet is the most widely accepted method of logging in to a remote system. It
    is very much like a standard remote login that you might use with a terminal emulator
    program, but telnet is designed to work over a TCP/IP connection.


    ```

    telnet [-e esc_char] [host] [port]

    ```


    | Option or Argument | Function |

    |---|--|

    | -e esc_char | Sets the escape character to esc_char. The default is normally
    (Ctrl+). |

    | host | Name of the remote computer. |

    | port | The port number to use for the connection. The default is port 23. See
    /etc/services for a complete list of supported ports. |


    You can use telnet to check to see whether other services are working. For example,
    you can use telnet to port 25 to see whether SMTP requests are being answered.


    # Connecting to the remote host using telnet


    telnet acts much like a terminal emulator program that you might use to log onto
    a bulletin board system, but it is designed to work over the Internet. Here’s
    how to perform a remote login using telnet.


    +   1. Type telnet and the name of the remote computer. telnet asks you for your
    login name.

    2. Type your login name on the remote system and press Enter. telnet asks you
    for your password.

    3. Enter your password (it won''t be displayed as you type it) and press Enter.
    You should now be logged on to the remote system.


    In this example, I telnet to biggie.fylz.com from smiley.fylz.com by typing telnet
    biggie.fylz.com. At the remote prompts, I use my user i.d. and password.


    ```

    Trying 198.186.207.131...

    Connected to biggie.fylz.com.

    Escape character is ''^''


    Linux 1.3.57 (biggie.fylz.com) (ttype4)

    ```'
  merge: -1
