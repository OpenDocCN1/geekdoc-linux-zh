    # Adding Backgrounds


    Backgrounds are programs that replace the boring stuff in your root window with
    something interesting. Most LINUX distributions offer xerth, xishtank, and xsnow
    as backgrounds. These programs are active: that is, the background changes.


    Although these programs are available on the CD as RPMs, Red Hat has chosen a
    different route by offering you a background dialog box in the preferences menu.
    From that dialog box, you can specify a solid color or select a static bitmap.


    # Checking Out Programs under X


    Many programs are designed to run under X. This section gives you a sampling of
    a few programs that I think you will find useful. The programs include a terminal
    window (where you run nonggraphic applications), a viewer for PostScript files,
    and an appointment calendar system.


    You can add any of these programs to your menus or just enter their names in a
    shell window to start them.'
