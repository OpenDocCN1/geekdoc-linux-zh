  md: '# Starting Applications


    # Starting X


    If your login screen is graphical, your system is probably running xdm. If, on
    the other hand, you have a text-mode login, you will have to start X yourself.


    +   1. Enter your login name and password to log in.

    2. Type startx and press Enter to start X.


    A default screen appears, displaying the Pager and the Task bar. If you are running
    the default Red Hat configuration, a single terminal window, called an xterm,
    also comes up.


    Most distributions offer a GUI environment at one run level and a command-line
    environment at another run level. Most likely, you can change the default run
    level in /etc/inab to select whether your system comes up in GUI or command-line
    mode. For example, with Red Hat 5.1, log on as root and type telinit 5 to switch
    to GUI mode.


    # Switching Tasks


    You can switch between tasks using multiple methods. If the task to which you
    want to switch is visible, you can just click its window. Otherwise, just click
    its entry in the Task bar. A third method of switching tasks is as follows:


    +   1. Click the center mouse button to get the active task pull-down menu.

    2. Click the desired task.'
