    # Setting Up Serial Ports for User Login


    When the LINUX system is started, init uses the information in

    /etc/inittab to start programs on the consoles and serial ports

    allow user logins. One program that is started getty (or

    mget, a variant with additional options such as the capability to

    handle FAX connections). getty does the following:


    +   * Opens the line and sets its modes, such as line speed.

    * Waits for an indication of a login, gets the login name, and

    transfers control to the login program.


    The two versions of getty use different configuration files:


    +   * getty uses a file named /etc/default/getty.line to

    configure each individual line.

    * getty uses files in the /etc/mgetty+sendfax directory,

    with mgetty.config being the main configuration file.'
