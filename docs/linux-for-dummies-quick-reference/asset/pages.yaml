  md: '# Editing Text with Pico


    # Exiting Pico


    If you realize that Pico is not the place you want to be, or that you''ve opened
    the wrong file, you can exit Pico by following these steps:


    +   1. Press Ctrl+X.


    +   2. If Pico asks whether you wish to save changes made to the file, type Y
    to save and N to exit without saving.


    # Importing a file into an edit session


    To insert a file into the file you are currently editing, follow these steps:


    +   1. Position cursor to the location where you want to insert the file.


    +   2. Press Ctrl+R. Pico asks you to enter the name of file that you want to
    insert.


    +   3. Enter the filename (including its directory, if you are in a different
    directory) that you want to insert and press Enter. If you''re not sure what the
    file is called or where it is located, press Ctrl+T. Pico looks around for the
    file.


    +   4. After you have your filename highlighted, press Enter, and the file drops
    into your current document at the current cursor position.


    # Maneuvering around a file


    Maneuvering in Pico is rather straightforward. The up-arrow key moves you up,
    the down-arrow key moves you down, the left-arrow key moves you left, and you
    can guess the rest.


    For more complicated maneuvering, use Ctrl-Y to move up a page and Ctrl+V to move
    down a page. If you forget these commands, just look at the command menu at the
    bottom of the screen.


    # Starting Pico


    Whether you want to use Pico to edit an existing file or to create a new file,
    type Pico followed by the filename that you want to create or edit to start Pico.


    In Pico, you need to remember only two things:


    +   Pressing Ctrl+X gets you out of whatever you get into.'
