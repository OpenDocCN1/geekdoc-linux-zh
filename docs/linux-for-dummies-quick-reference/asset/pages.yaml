  md: '# Executing local commands while in ftp


    Sometimes you need to check something on your local machine (such as what directory
    you are in) while you are in ftp. To do this, just type ! followed by the shell
    command that you want to execute.


    You may be tempted to use the ! command to change directories on the local machine.
    However, you can''t do it ! creates a subshell. After the command is executed,
    the subshell terminates and you are right back where you started. Use the cd command
    to change your local directory.


    # Exiting ftp


    To disconnect from the remote system and exit the ftp program, type quit.


    # ftp command summary


    ftp offers an assortment of commands. Here is a quick summary of the more interesting
    ones:


    | Command | Meaning |

    | --- | --- |

    | asc | Sets ASCII transfer mode. |

    | bin | Sets binary transfer mode. |

    | case | Converts the case of filenames from upper- to lowercase or lower- to
    uppercase. |

    | cd dir | Changes directories on the remote machine. |

    | delete file | Deletes files on the remote system. |

    | dir [files] [dest] | Lists the names of files matching the pattern files (all
    files default) on the remote system. The output is placed in dest on the local
    system if specified, otherwise it appears on the screen. |

    | get rfile [file] | Transfers rfile from the remote system to file on the local
    system. lfile defaults to the same name as rfile. |

    | hash | Turns on/off a pound sign (#) printing on the screen every 1,024 characters.
    |

    | lcd dir | Changes directories on the local system. |

    | mget files | Gets the specified files from the remote system. |

    | mput files | Puts the specified files onto the remote system. |

    | prompt | Toggles prompting mode for the mget and mput commands. |

    | pwd | Displays the name of the current directory on the remote system. |'
