  md: '# Choosing an Editor


    # Choosing an Editor


    Some folks would sooner fight to the death than switch text to a favorite editor.
    If you already have a editor, just stick with it. But if you are shopping for
    an editor, here''s some advice.


    +   * If you are a beginner, take a serious look at joe. It is very powerful and
    has on-screen help and many modes to humor your most.


    +   * Pico, as popular as it is, offers nothing that joe doesn''t already have.
    It is the default editor for pine (see also "Managing E-Mail with pine,") so many
    people are using pico without realizing that they are.


    +   * If you expect to do a large volume of editing — that is, hours per day —
    you need vi or Emacs.


    +   * vi integrates with the other UNIX/LINUX tools. It uses many of the same
    capabilities as those tools and generally acts more like a UNIX-type command than
    the other editors. For example, Regular Expressions in vi work just like they
    do in awk, and sed.


    +   * Emacs is its own environment — many Emacs users just live in Emacs all day.


    +   * Some people are frustrated by the two modes of vi — one to enter text, one
    to edit text. However, you can generally do more with fewer keystrokes in vi than
    other editors.


    +   * On a system with limited resources, vi is the best choice because it is
    much smaller than Emacs.


    In this part, I mention two editors with training wheels: joe and Pico. I then
    present two industrial-strength editors: vi and Emacs. If none of these tools
    meets your fancy, keep shopping. You have many LINUX editors to choose from.


    # Editing Text with joe


    joe (Joe''s Own Editor) is a simple-to-use text editor (written by one Joseph
    H. Allen) that reasonably offers good capabilities. joe is the chameleon of editors
    and is willing to pretend that it is another editor if you ask it nicely. You
    do so by calling joe by a different name. Here''s how that works: Within LINUX,
    there are links (different names for the same file) that all point to the same
    program. When joe starts, it checks to see what name you used to invoke it, and
    based on that information, determines its mode of operation.'
  merge: -1
