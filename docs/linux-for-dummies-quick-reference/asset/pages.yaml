  md: '# 42 File Management Basics


    # cat — Displaying the contents of files


    This command gets its name from the word concatenate, which means to link. The
    cat command displays multiple files one after another. Although you can use cat
    to display short files on the screen, less is more appropriate if you use files
    are longer than a single screen (see also — “Paging through a file” later in this
    part).


    ![](img/74a57ca3470b31765a6f932d60bcc72e_59_0.png)


    ```

    cat [-E] [-n] [-T] [-v] files

    ```


    | Option | Function |

    | --- | --- |

    | E | Shows the lines of ends. Displays a $ after the end of each line. |

    | -n | Adds line numbers to the beginning of each output line. |

    | -T | Displays tab characters as ^. |

    | -v | Makes nonprintable characters visible by preceding control characters by
    ^ and preceding (most significant bit of each character) set with M-. This option
    is helpful for viewing executable files. |


    If you type cat (without specifying a filename), cat prints whatever characters
    you type from the keyboard.


    Use the -E option to find trailing spaces in lines in a text file. Trailing spaces
    are a common cause of uneven word spacing when using text formatters such as groff.
    (See also Part III.)


    Suppose that you want to print two files for an office mate to look at. You also
    want to put some instructions on the files as they print so that your office mate
    knows what to do with the files. Why not use a stick-note when you can include
    your comments on the printout without changing the contents of the files? You
    can add comments easily by using cat.


    In the following example, you print the main article from a newsletter, which
    you want to send to your office mate to receive her feedback. You want her to
    look also at a new “Green Hat policy.”—See also Part III for information on the
    lpr command).


    ```

    cat main.article Green.Hat | lpr

    Pat, this article looks very interesting, and I think it may help with our shortage
    of wool socks.

    Ctrl+D

    ```


    This comment will appear at the top of the newsletter article when it prints.'
