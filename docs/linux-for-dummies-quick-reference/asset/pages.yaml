  md: '# Managing User Control Files


    ```

    root::0:root

    bin::1:root,bin,daemon

    users::100:fyl,viki,george,john,marsha

    fyl::500:fyl,viki

    george::501:george

    ```


    # The password file


    The /etc/passwd file contains the password login information about all the users
    on the system. This is a text file with one line for each user. Each line contains
    seven fields separated by a colon.


    | Field | Meaning |

    | 1 | Login name. |

    | 2 | Encrypted password. If this field is empty, the user does not have a password.
    You can put an * in this field to disable login. |\| 3 | User ID. The root login
    has an ID of 0. Depending on your LINUX flavor, regular user IDs start somewhere
    between 100 and 1000. |

    | 4 | Group ID. This establishes the default group for this login associating
    it with an entry in the /etc/group file. |

    | 5 | User name and other contact information. |

    | 6 | Pathname of the user''s home directory. |

    | 7 | Pathname of the user''s shell. |


    Coming up are a few lines from my /etc/passwd file. Note that george doesn''t
    have a password, and root and fyl are the only accounts that have valid passwords.


    ```

    root:JVMXsFvtOMQs:0:0:root:/bin/bash

    bin::*:1:2:daemon:/sbin

    fyl:Xpw.kT1c12ZY:100:500:Phil Hughes:/home/fyl:

    /bin/bash

    george::1001:501:George L. Tyrebyter:/home/george:

    /bin/bash

    ```


    # Shadow passwords


    Some versions of LINUX (and UNIX) support shadow passwords to enhance security.
    The /etc/passwd file, which contains login information about all the users in
    the system, must be readable by everyone. When you use a shadow password, the
    password is moved from /etc/passwd to /etc/shadow and an is placed in the password
    field of /etc/password. Permissions on /etc/shadow are set to prevent anyone except
    root from reading it.


    > *'
