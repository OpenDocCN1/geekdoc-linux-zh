    # hcp — Copying files to or from an HFS volume


    `hcp` copies files between Mac disks and LINUX file systems. You can instruct
    `hcp` how to treat the two parts of the Mac file when it performs the copy.


    hcp [-a|-b|-m|-r|-t] sources target


    | Option or Argument | Function |

    | a | Automatic — `mcp` guesses the right translation (default). |

    | -b | BinHex — an alternative format to -m for binary data. |

    | -m | MacBinary II — copies both forks of the Mac file. Good choice for arbitrary
    Mac files. |

    | -r | Raw data — copies only the fork of the Mac file without translation. |

    | -t | Text — copies only the fork of the Mac file and performs end-of-line translation.
    |


    sources Files to copy. You specify `stdin` by using a . Use `a` at the beginning
    to force an HFS path; use `/` at the beginning to force a LINUX path.


    target Destination file or directory. Specify `stdout` by using a . Use `a` at
    the beginning to force an HFS path; use `/` at the beginning to force a LINUX
    path.


