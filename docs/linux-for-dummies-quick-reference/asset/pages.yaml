    With LINUX, you have a choice of working in either a command-line environment
    or a graphical environment. Because the graphical environment is more intuitive
    to use and allows you to display on-screen information on multiple tasks, most
    users prefer it over the command-line environment. (However, most users keep one
    or more shell windows open for entering commands.)


    In case you''re wondering about the "alphabet soup" in the title of this part,
    X is short for *The X Window System*, a GUI (graphical user interface) environment
    developed at the Massachusetts Institute of Technology. It has become the de facto
    standard for UNIX systems (and by association, LINUX as well). FVWM stands for
    *Feeble Virtual Window Manager* (the name given to it by its creator, Robert Nation).
    FVWM has become the de facto standard for windows managers on LINUX systems.


    # In this part...


    +   - Discovering the basics of X and window managers

    - Working with FVWM and AnotherLevel

    - Understanding pull-down menus

    - Finding out about common GUI-based programs

    - Using non-GUI programs in a GUI world

    - Using shortcuts for efficient operation of your environment


    ![](img/74a57ca3470b31765a6f932d60bcc72e_90_0.png)'
