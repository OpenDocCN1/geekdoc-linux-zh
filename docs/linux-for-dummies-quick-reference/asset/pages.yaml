  md: '# Command History


    # Command History


    The Bash shell maintains a command history, a list of up to 500 of the most recently
    entered commands. If you type the command history, the shell displays your history
    list.


    The history command is useful when you want to reexecute a command without having
    to retype it. (The number of commands saved can be changed by setting the HISTSIZE
    shell variable.) You can then use the commands described in the following sections
    to go back through the list and reexecute a command.


    # Setting command history mode


    How you edit recent commands depends on whether your shell is set to vi mode or
    Emacs mode.


    +   * For vi mode, type set -o vi and press Enter.

    * For Emacs mode, type set -o emacs and press Enter.


    # Using Emacs mode


    If you are in Emacs mode, you can press Ctrl+P to access the previous command,
    press Ctrl+N to access the next command, or use the arrow keys. When you finish
    editing, press Enter to execute the command. (**See also** Part V for details
    on the available editing commands.)


    # Using vi mode


    If you are in vi mode, press Esc and then use standard vi commands (k to move
    up, j to move down, and so on) to access and edit the history list. When you are
    ready to execute the edited command, press Enter. (**See also** Part V for details
    on the available editing commands.)


    # Customizing the Environment


    LINUX, in the UNIX tradition, has always allowed you to customize your work environment,
    and this section shows you some of the ways to do that.'
