  md: '# Online Resources


    You can find plenty of information about the LINUX operating system on the Internet.
    You can download versions of LINUX distributions, read on-line magazines about
    LINUX, participate in user newsgroups, and much more.


    Try the list of resources in this part or click the GLUE link at www.linuxresources.com
    to search for a user group in your area.


    # General Web Resources


    The following Web sites offer extensive information on LINUX:


    sunsite.unc.edu/LDP — This is the location of the LINUX Documentation Project
    pages.


    www.linuxresources.com — This is a general information site with emphasis on the
    business and professional aspects of LINUX as well as current news involving LINUX.
    It has links to most other


    ![](img/74a57ca3470b31765a6f932d60bcc72e_208_0.png)'
