  md: '# Managing E-Mail with elm


    +   * Levels in the domain name are separated by a dot (.).


    +   * The top-level domain is the one at the rightmost part of the address. In
    phil@ssc.com, com is the top-level domain.


    +   * Moving to the left in the domain part of the address, each name is a member
    of the domain to its right. phil@ssc.com, ssc is a member of the com domain.


    +   * Individual computers may have their own names (for example, mine is named
    herein), but you generally do not need to use the machine name. For example, my
    official e-mail address is phil@truckin.com, but you can send e-mail to me at
    phil@ssc.com, and I will receive it.


    +   * If you are sending to someone on your machine or local network, you can
    use just that person’s user name (without the @domain part of the address)


    With all that said, if people give you their complete e-mail addresses in the
    format just described, and if you are connected to the Internet, you would be
    able to send them mail.


    # Managing E-Mail with elm


    The e-mail program was written by Dave Taylor and is now maintained by a cooperative
    group. You can start elm when first log on to your LINUX system and then just
    keep it running. Simply type elm at the shell prompt. elm displays a list of message
    titles and waits for your instructions.


    Strange as it may seem, you get more help if you set your user level to Expert.
    elm assumes that if you are beginner, you want to learn about what you can do.
    Use the options menu (O) to change the user level.


    # Creating mail aliases


    elm includes a mechanism that allows you to create aliases for mail recipients.
    So, rather than have to remember a mail address such as Robert.Klazowski@super-duper-systems.com,
    you can just use an alias such as bob.


    To create from the elm index, type a to access the aliases menu.


    +   1. If you want to create an alias for the person who sent you your current
    message, type a; otherwise, type n.


    +   3. Type the alias name and, if requested, other information.'
