  md: '# Creating Schedules and Timed Events


    LINUX features some commands that allow you to get your computer to work for you
    at a later time (plus a calendar that can save you a lot of paper).


    # at — Scheduling commands


    The at command instructs the computer to do a job at a later time. The job could
    be as simple as sending you a reminder.


    ```

    at  [-f file] [-l] [-m] time

    ```


    | Argument or Option | Function |

    | -f file | Reads commands from file. Normally, at expects you to enter the commands
    from the keyboard and terminate your entry by pressing Ctrl+D. |

    | -l | Just display the at queue (synonym for the at command). |

    | -m | Mail user when command has been run. |

    | time | Time that you want at execute the action. You can enter the time in 12-hour
    format (such as 11AM or 0930PM), or in 24-hour format (such as 1145 or 2130).
    If the time has already passed today, tomorrow is assumed. The at command offers
    many more choices — type man at to see them. |


    A simple use for the at command is sending yourself e-mail at a particular time.
    If you want to send yourself the message at 1:00 p.m., and don''t want to include
    any content in the message, just enter


    ```

    at -m 1300

    ```


    and press Ctrl+D.


    You can remove a queued job by using the atm command (or at -d). Specify the job
    number as at -1 to identify the job that you want to delete.


    For security reasons, the at command can be restricted to certain users in the
    /etc/at.allow and /etc/at.deny files. Any queued jobs can be displayed using the
    at command.


    # cal — Displaying a calendar


    When you see cal, the word "exceptional" doesn''t come to mind. But this command
    does produce a functional calendar for any month or year that you will ever need.'
  merge: -1
  pgno: 56
- img_proc: true
  md: '# Creating Schedules and Timed Events


    ```

    cal [[month] year]

    ```


    # Arguments or Options Function


    month Number of the month to produce a calendar for. If a month isn''t specified,
    LINUX displays a calendar for the whole year.


    year Year for which you want a calendar (for example, 1998). If you don''t specify
    a year, cal uses the current year.


    Say that your supervisor''s birthday is August 11 and you want to know on day
    of the week this date falls in 1998. Enter


    ```

    cal 8 1998

    ```


    The cal command produces a calendar for the exact date that you enter. So, if
    you enter a command as cal 6 98, cal produces a calendar for June of year 98,
    not June of 1998.


    # crontab — Scheduling periodic events


    LINUX needs to run all sorts of events on a periodic basis, and you can use the
    crontab command to manipulate your schedule for these events. For example, you
    may need to trim log files, clear out temporary directories, and schedule the
    execution of your vegetarian mailing-list processing program.


    These schedules are saved in /var/spool/cron/crontabs under your user name. The
    cron daemon (crond) reads these schedule files and starts the requested programs
    at the requested times.


    ```

    crontab [-d] [-e] [-l] [file]

    ```


    | Argument or Option | Function |

    | -d | Deletes a crontab file (the file you tell crontab to install and manipulate).
    |

    | -e | Edits a crontab file by invoking your default text editor on a copy of
    the file. |

    | -l | Lists a crontab file. |

    | file | Name of a file that is to be installed as the new crontab. |


    Each entry in a crontab file has six fields. The fields are separated by spaces
    or tabs, or both.'
  merge: -1
  pgno: 57
- img_proc: true
  md: '# File Management Basics 41


    | Field | Meaning |

    |---| 1 | Minute when command is scheduled |

    | 2 | Hour when command is scheduled |

    | 3 | Day of month when command is scheduled |

    | 4 | Month when command is scheduled |

    | 5 | Day of week when command is scheduled (Sunday is 0, Monday is 1, and so
    on) |

    | 6 | Shell command line to be executed |


    The time fields can contain a, comma-delimited list or an * to indicate every
    time period (every month if in the month field, every day if in the day field,
    and so on). You can add lines to a crontab file by preceding the line with a #
    character. If you specify both a day of the week and day of the month, the commands
    are run on the specified weekday, as well as on the specified day of the month.


    If the command crontab produces output and you haven''t written it to a file or
    to a printer, the shell-emails the output to you.


    Suppose you have a program get_my_mail, which connects you to the Internet and
    downloads your mail. Suppose that you want to run this program every two hours
    the day (and a couple of times during the night) on every weekday. To have a crontab
    file, enter crontab -e to edit your current crontab file and add a line like this:


    +   * 4,8,10,12,14,16,23 * 1-6 get_my_mail


    The preceding line schedules an event to run at 0407, 0807, 1007, 1207, 1407,
    1607, and 2307. It is to run every day of every month on Monday through Saturday
    (1-6). The actual event is to execute the program get_my_mail.


    All the crontab files are located in /var/spool/cron/crontabs. Their names are
    the user IDs of owner. If you are logged in as root, you can append a user ID
    to the crontab command to list, edit, or delete a user''s crontab.


