  md: '# Shell Variables


    # Shell Variables


    Shell variables are a local place for your shell to store information. For example,
    the shell variable HOME is set to the pathname of your login directory. In Bash
    and ksh, you can set shell variables to environment variables by the use of the
    export statement.


    The difference between shell variables and environment variables is that environment
    variables are available to the shells that you start up. Shell variables, on the
    other hand, are used only in the shell in which they were created. Shell variables
    are identified by placing a $ (dollar sign) in front of the variable name.


    The following sequence sets the shell variable DOG to the value Beagle. The second
    line exports the shell variable to an environment variable. The third line then
    displays the environment variable using the echo command.


    ```

    DOG=Beagle

    export DOG

    echo My dog is $DOG

    ```


    +   * If your login is Bash, zsh, or ksh, then the environment variables in ~/.profile
    are used every time you log in.

    * The .bashrc file contains environment variables that are used as the default
    settings for the Bash shell.

    * The equivalent files for csh and tcsh are .login and .cshrc.


    The following table shows the standard shell variables:


    | Shell Variable | What It Means |

    | --- | --- |

    | $? | Return status of last command (0 indicates success — whatever the command
    considers a successful execution) |

    | HOME | Pathname of your home directory |

    | MAIL | Name of the file to check for incoming mail |

    | OLDPWD | Pathname of current directory before previous cd command |

    | PWD | Your current directory |

    | SHELL | Pathname of your shell |


    Many common shell variables are available. Type set to see your current variables
    and their assigned values.'
