  md: '# Replacing text


    Follow these steps to replace text:


    +   1. Enter : to get into ed command mode.

    2. Enter a range you want the command applied to (if you don''t enter a range,
    the command is applied to the current line only).

    3. Type s, the substitute command, followed by /.

    4. Enter the text you want to replace followed by /.

    5. Enter the replacement text followed by /.

    6. Enter any options you want applied to the command.

    7. Press Enter to execute the command.


    You can use many forms of these replace commands; each allows you to specify line
    ranges or search patterns. The most basic substitute command consists something
    like the following line: :range/old_pattern/new_text/options


    followed by Enter.


    In this example, range specifies the line to apply to (the current line is the
    default); old_pattern is a Regular Expression to match the text to be replaced;
    new_text is the replacement text, and options affects how the command operates.
    The g option is optional — it changes every occurrence of old_pattern that matches
    the text being replaced (the default is limited to the first match in each line).
    The c option asks to confirm the change — it displays the pending change and asks
    for confirmation before making it.


    To exchange the position of two letters, move the cursor to the first letter and
    enter xp. The x deletes the letter under the cursor, and the p puts it back after
    the next. If you frequently transpose letters (for example, I intend to type teh
    for the), you can set up an abbreviation so that vi automatically corrects your
    mistake when you type it. for example, you use the command:ab teh followed by
    Enter, vi automatically changes teh to the.


    You specify line ranges using the format first,last. You can use .(dot) as shorthand
    for the current line and $ as shorthand for the last line. For example, 5,10 refers
    to lines five through ten and 1,. refers to all lines up to and including the
    current line.'
  merge: -1
