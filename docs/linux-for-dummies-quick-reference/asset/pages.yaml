  md: '# Setting Up System to Use login and rsh


    # Using /etc/hosts.equiv


    You use the /etc/hosts.equiv file to tell a computer system example that any of
    the named machines is equivalent in terms of permissions to itself. In other words,
    this file identifies machines trustworthy enough to be considered equivalent.
    Follow these steps to set up the /etc/hosts.equiv file:


    +   1. Log in as root.


    +   2. Edit /etc/hosts.equiv with your favorite editor (for example, use vi /etc/hosts.equiv).
    If the file does not already exist, the editor creates it.


    +   3. Add a line with the name of the machine that you trust to be equivalent.
    For example, if you are on machine tofu and you want to declare machine tempeh
    to be equivalent, just add a line with the word tempeh in.


    You really don''t want to add a machine to your host equivalent file unless you
    are sure it can be trusted. Generally, this means you have administrative control
    over it.


    # Using .rhosts


    .rhosts is a local file that allows each user to map between different accounts
    on different machines. Unlike the /etc/hosts.equiv file, which is global for everyone
    on the computer, .rhosts is unique for each user. In the following steps, you
    create personal .rhosts files on all the machines you want to connect to.


    +   1. Log in to each machine on which you want to establish a personal equivalence
    and create the filename .rhosts in your home directory.


    +   2. Enter lines of the form system userid in this file for all the systems
    on which you want to enable equivalence. For example, if your login is bill on
    whitehouse.gov and william on secret.net, set up your .rhosts file like this:


    ```

    whitehouse.gov bill

    secret.net william

    ```


    .rhosts has a drawback — it can present a significant security problem because
    it expands the ways in which people can log into your account.'
  merge: -1
