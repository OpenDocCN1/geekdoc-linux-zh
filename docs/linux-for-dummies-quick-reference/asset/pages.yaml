    * sunsite.unc.edu/pub/Linux — General LINUX archive site

    * ftp.kernel.org — LINUX kernel source


    # Magazines


    In addition to the following magazines published in English, LINUX Journal is
    translated into Japanese, Korean, and Polish.'
