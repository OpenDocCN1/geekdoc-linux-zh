  md: '# Installing LINUX


    Another place to look for generic information on LINUX is SSC LINUX resources
    page at www.linuxresources.com. From there, you can find links to LINUX International,
    LINUX User Groups, and LINUX Speaker''s Bureau, LINUX Gazette (an e-zine), and
    LINUX Journal — a monthly magazine about LINUX.


    # Installing LINUX


    All the distributions discussed in the preceding section are available on CD.
    Debian and Red Hat also support installation over the Internet. Although some
    installation differences exist among each flavor of LINUX, the following list
    shows the basic steps that you must perform to install any version:


    +   1. Make some space available for LINUX on your hard drive. You can do so by
    adding an additional hard drive to your computer or repartitioning your current
    hard drive.


    ![](img/74a57ca3470b31765a6f932d60bcc72e_26_0.png)


    If you elect to partition your hard drive, you can use a program called FIPS (First
    Interactive Partitioning System), which is available on most distribution CDs
    and at archive sites. FIPS shows the amount of free space on your MS-DOS partitions
    and allows you to reduce the size of the existing partitions to free up some space.
    I have found FIPS totally reliable, but before you start repartitioning, you should
    do a full backup of your hard drive, just to be safe.


    The amount of space that you need depends on how much of LINUX you load and what
    you intend to do with. The LINUX kernel and a basic set of utilities could easily
    fit on a disk partition as small as 50MB. When you start loading pieces such as
    the language compilers and GUI interface, the required disk space grows significantly.
    On the other end of the spectrum, loading every part of LINUX can take more than
    2GB.


    +   2. After you have established a place for LINUX, you need to load and start
    the installation process. The most common way to boot LINUX is from a floppy disk.
    If you purchase a distribution directly from the manufacturer, it usually includes
    a boot disk. If you don''t have a boot disk, you can mount the CD on any system
    supporting standard ISO-9660 file systems and write the necessary disks. You can
    do this from an MS-DOS system, you can use the rewrite.exe program included on
    the CD.


    If your computer has a bootable CD-ROM drive, you may be to boot LINUX directly
    from the CD. Most current distributions allow you to do this. (Red Hat 5.x does
    require a boot floppy).'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# 10 Fixing Installation Problems


    3. After you boot the LINUX installation program, it interacts with you to guide
    you through the installation process. Each distribution is different, but the
    basic process remains the same. The installation process includes the repartitioning
    of your hard drive (even if you did it earlier, you still need to set the partition
    types to LINUX), the formatting of the partition or partitions, selection of the
    packages to load, and the actual loading process.


    4. Somewhere along the way, the installation program asks whether you want to
    run the X Window System (more commonly called X). X is the graphical user interface
    common to all LINUX and UNIX systems. X isn''t required to use LINUX and it does
    use lot of disk space. You may want to initially load LINUX without X.


    5. At the tail of the installation process, the installation program asks whether
    you want to install LILO (the LINUX Loader). LILO allows you to select which operating
    system to start each time you reboot your computer. You can safely install LILO
    on the master boot record of your primary hard drive. In the installation process,
    all you have to do is tell LILO about other operating systems that you want to.


    6. Finally, you should always make a *rescue disk*. This is a boot disk for your
    particular system. If something happens and you cannot boot off the hard drive,
    you can boot off the rescue disk, mount the LINUX partition from your hard drive,
    and look for the problem.


    ![](img/74a57ca3470b31765a6f932d60bcc72e_27_0.png)


    LINUX SECRETS, 2nd Edition, by Naba Barkakati, (IDG Books Worldwide, Inc.), contains
    detailed instructions on installation.


    It''s a good idea to open up the computer and write down the manufacturer and
    part numbers for things such as SCSI, Ethernet, and video controller boards before
    starting the install because you will be asked about them later in the installation.
    The same goes for hard drive specifications.


    # Fixing Installation Problems


    Nothing is completely foolproof. This is my way of saying that problems can occur
    during installation of LINUX. Here are a few of the most common ones and their
    possible causes.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Fixing Installation Problems


    # Errors while booting from a floppy


    The most common causes of this problem are that the floppy disk itself is bad
    or you downloaded a bad file. Trying to write to a new floppy, and if you downloaded
    the boot image over the Internet, try downloading it again. (All distributions
    have boot disk images on their CDs, which can be copied to floppies.)


    If you bought a copy of LINUX that included a boot floppy and a CD, a boot image
    should appear on the CD. Locate this image, copy it to a new floppy, and trying
    boot again.


    # System gets hung up during the boot


    First, remember that booting from a floppy can take some time. If the floppy drive
    light is on, the boot process is probably in the works. You should keep a couple
    of things in mind:


    +   * The first step in booting from a floppy is to load LILO. Each letter of
    the word LILO is displayed for each step in the boot process. If only some of
    the letters display (L and I, for example), this may indicate that some sort of
    error has occurred. Refer to the LILO documentation on the LINUX CD to determine
    the exact problem.


    +   * During the boot process, routines in the various device probe the hardware
    to determine addresses and interrupts. A routine probing for one device (an Ethernet
    card, for example) may instead probe for a different device (such as a sound or
    SCSI card), causing the system to hang. One way to try to isolate this problem
    is to remove nonessential cards from the computer and try the boot again. If this
    works, add the cards one at a time until the problem crops up.


    # System says it''s out of memory


    Most installation programs use what''s called a RAMdisk, which means that a portion
    of the RAM in the computer is allocated to act as a file system. Make sure that
    you are allocating and activating swap space during the installation. (Swap space
    is allocated on the hard drive that LINUX can use as an extension of RAM. During
    the installation process, answer Yes to both messages you get about swap space
    allocation and activation.)'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# 12 Fixing Installation Problems


    # You get a "Cylinder > 1023" error message


    LINUX doesn''t use your computer''s BIOS (basic input/output system) after it
    is booted, but it uses BIOS in the boot process. Because of a BIOS limitation,
    all of the partition that you intend to boot must fall below cylinder 1024. This
    may require your moving partitions around or installing a small boot partition
    and then placing most of LINUX on another partition.


    # You get an "Unable to Mount" message


    This means that the system is unable to mount the LINUX root directory or unable
    to mount the CD. Make sure that the CD is inserted completely in the drive and
    the CD is recognized (you''ll know whether the CD is recognized by the boot messages
    telling you that the CD-ROM drive was found at a particular address).


    # Win95 made LINUX vanish


    If you install Windows 95 you install LINUX, Win95 will wipe LILO. This is a Win95bug.
    The solution is to either boot LINUX from a floppy or to reinstall LILO after
    you install Windows 95.


    ![](img/74a57ca3470b31765a6f932d60bcc72e_29_0.png)


    # You''re having hardware problems


    LINUX now runs on more hardware (although you may find some other SCSI controllers
    or Ethernet cards that aren''t supported).


    +   * If you get an "unable to access the CD or disk drive" message, read the
    boot messages. If you don''t see a message about a device that you know among
    your hardware, you probably have a device that is unsupported by LINUX.


    +   * Many users receive memory errors when running LINUX on a system that ran
    MS-DOS with no problems. These errors usually indicate that something is wrong
    with your hardware. Because LINUX takes advantage of more system features (such
    as overlapping DMA I/O transfers while using the CPU for other tasks), a less-than-totally-reliable
    memory chip or faulty motherboard can cause these problems.


    +   * To diagnose a problem, first remove any unnecessary hardware, such as an
    Ethernet card. If the problem goes away, hardware may be the culprit or may be
    a conflict in an address or IRQ (Interrupt Request).


    ![](img/74a57ca3470b31765a6f932d60bcc72e_29_1.png)


    LINUX Secrets, (IDG Books Worldwide, Inc.). Chapter 9, offers additional suggestions
    for diagnosing hardware problems.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Understanding the Shell


    The shell is the **command interpreter** — it acts as your interface to the operating
    system by accepting your input and performing the tasks you request.


    Before I get into the nifty-gritty of shells, let mention that graphical user
    interfaces are available for LINUX. That means that for those of you who prefer
