    # Listing directory contents with ftp


    After you are connected to a remote system with ftp, you need to look for what
    you want. Type `dir`, and `ftp` presents to you with a listing of the files in
    the current directory.


    You can use two optional arguments to make the listing more specific:


    | Argument | Meaning |

    | --- | --- |

    | files | A pattern for file selection. Use * if you want to list every file.
    Use `dir ve*`, for example, if you want a list of filenames that begin with `ve`.
    This pattern matching works like shell wildcards. (**See also** Part II for more
    details.) |

    | destination | This is the name of a file on your local system. If you use this
    argument, `dir` sends its output to the file on your computer instead of displaying
    it on the screen.


    If the directory contains more files than will fit on the screen, you can view
    the list one page at a time by typing `dir * | more`. Press the spacebar when
    you want to see the next page.


    # Navigating the remote host with ftp


    After you know what is on the remote host, you may need to change directories
    on that machine. The command is called `cd` and it works just like the `cd` shell
    command in LINUX. You can use relative or absolute pathnames to specify your destination
    directory. For example, to move to the `/pub/Linux/Goodies` directory, type `cd
    /pub/Linux/Goodies`.


    On almost anonymous FTP servers, all the start at the `/pub` directory (which
    is almost always where all the publicly accessible files are located).


