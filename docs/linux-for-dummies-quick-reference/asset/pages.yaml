    Say that you want to create a new environment variable called WOW and set it to
    be equal to the directory path where you keep all your good files. Then you can
    reference this directory any time you want to copy or access a file in that directory.


    The following commands set the variable and list the file super from that directory
    using the less command. Placing the export command in your .profile file makes
    WOW available every time you log in.


    ```

    export WOW=/home/tofu/Good-files

    less $WOW/stew.txt

    ```


    To add a new directory to your current search path, enter PATH=$PATH:newdir.

    This command adds a new directory named newdir to the end of the path (last directory
    to be searched).


    # Directory Naming Conventions


    A popular practice is to name directories with a leading capital letter (for example,
    Correspondence or Secret). This way, all directories display together in a file
    list (ls) and are easily identified. (See also Part III for details.)


    If you are unsure which entries in a list are directories, type ls -F and press
    Enter. A / is displayed at the end of any directories.


    # Directory Referencing


    A reliable way to access a file in your home directory (or one of its branches)
    is to use a tilde (~). It acts as an abbreviation for the path to your home directory.
    For example, if your current directory'
