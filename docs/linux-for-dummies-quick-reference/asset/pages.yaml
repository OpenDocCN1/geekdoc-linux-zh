  md: '# Pathnames


    Some special characters, which are technically legal to use in a filename, may
    get you trouble because of their other meanings. The following table offers better-safe-than-sorry
    choices for filename characters.


    | Lowercase letters | Always safe to use |

    | Uppercase letters | Always safe to use, but many people reserve them for directory
    names |

    | Numbers | Always safe to use |

    | Underscores (_) | Always safe to use — they make good word separators |

    | Hyphens | Don''t use as a first character |

    | Commas | Always safe to use |

    | Periods | Always safe to use (filenames that begin with a period are hidden
    from normal directory displays) |


    ![](img/74a57ca3470b31765a6f932d60bcc72e_41_0.png)


    LINUX/UNIX uses whitespace as an argument separator. Don''t use spaces in filenames.


    See also the section “Special Characters,” later in this part, for an explanation
    of the meaning that other characters have to the shell.


    # Pathnames


    A file''s *pathname* consists of the file''s full name, starting at the root of
    the file tree. Therefore, if your home directory is /home/tofu, and you have a
    subdirectory called Secret, and within that directory you have a file called `love.letters`,
    the pathname of `love.letters` would be `/home/tofu/Secret/love.letters`. This
    file is totally distinct from a file with a similar name in a different directory,
    such as `/home/tempeh/love.letters` or `/home/tofu/Correspondence/love.letters`.


    # Shell Command Elements


    When you want to instruct the shell to perform a task, you need to pass it a whole
    set of information. The basic elements of a shell command are the following:


    +   * The name of the command to run

    * Any command-line options that you want to use

    * Any arguments required by the command

    * Instructions on how to handle the input and output data streams


    ![](img/74a57ca3470b31765a6f932d60bcc72e_41_1.png)'
