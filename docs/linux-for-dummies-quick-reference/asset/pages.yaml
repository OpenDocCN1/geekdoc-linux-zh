    # rsh — Executing Commands Remotely


    You can use rsh to do the same things that you use rlogin to do, but you also
    can use rsh to execute a single command on a remote system.


    If you remotely log in to a system over the Internet, look into obtaining a copy
    of ssh. It works much like rsh but encrypts the data.


    ```

    rsh [-l user] [-n] [host] [command]

