  md: '# An Introduction to X


    # An Introduction to X


    The Window System (or more commonly X) is a GUI environment available for most
    UNIX and UNIX-like platforms — including LINUX. X includes three pieces: the window
    manager, the X client, and the X server.


    # The window manager


    This program, as the name implies, manages windows. That is, this program gives
    you a method to work with the windows — to change their size, location, and things
    like that.


    As with X servers, you have many window managers to choose from. The commercial
    standard is *Motif* — but the most popular window manager in the LINUX community
    is *FVWM*. FVWM is highly configurable (as well as free), making it a good choice.


    In the past, most users configured FVWM to look like Motif, the window manager
    developed at the Open Software Foundation. Today, more people prefer the look
    of Windows 95, which is emulated by FVWM in a configuration called FVWM95. The
    default window manager for Red Hat Linux systems is *AnotherLevel*, a specific
    configuration of FVWM95. The information on programs in this chapter is independent
    of window managers, but any window manager functions that I discuss are specific
    to AnotherLevel (which was developed by Greg J. Badros of Duke University).


    If the look and feel of the default X environment isn’t to your liking, you may
    want to look into other desktop environments for FVWM or possibly other window
    managers such as, FVWM, Less-Tif, and AfterStep.


    # The X client


    The client is the program that the server works with to get your job done. The
    client is an applications program with the necessary hooks that enable it to communicate
    with an X server.


    # The X server


    The server is the program that runs on your local computer and drives the display.
    This definition may sound backward in a world in which we talk about database
    servers and users as clients, but you can also think about it another way. The
    program that displays the information from the programs you are running on your
    screen serves you, the user.'
  merge: -1
  pgno: 91
- img_proc: true
  md: '# The FVWM Desktop Anatomy


    A few more words on the X server are in order. Free86 is a freely available X
    server that comes with all LINUX distributions. Two commercial X servers are also
    available for LINUX: Accelerated-X (from Xi Graphics) and Metro-X (from Metro
    Link). Free86 usually is adequate, but if you have a performance-critical application,
    a commercial alternative may be worth the cost. The commercial X servers may also
    support video boards not supported by Free86.


    # The FVWM Desktop Anatomy


    The LINUX desktop contains a bunch of levels, so I will start from the top. FVWM
    offers multiple virtual desktops that you can select by using the Pager. Each
    desktop may be larger than the displayable screen size and is limited by the amount
    of video RAM that you have available. The screen becomes the default FVWM95 Desktop
    on Red Hat LINUX.


    # Applications windows


    The following section describes how to work with an application you want to run
    in FVWM. These applications run in their own windows that appear as any size on
    a desktop. FVWM manages these windows as well.


    FVWM supplies a border for each window. You use this border to modify the characteristics
    of the window. The top border includes a title bar that displays the name of the
    window (which may also be the name of the application). The title bar may also
    contain to ten buttons.


    Depending on your configuration, the title bar has three or four buttons. Clicking
    the far-left title button displays a list of window options. Clicking the button
    that minimizes the window (it appears as an icon on the Task bar). Clicking the
    button that contains a rectangle maximizes the window to fill the desktop (clicking
    this button a second time changes the window back to its previous size). If you
    have four buttons, the fourth is the kill button and has an X on it.


    Another characteristic of a window is that it can be sticky, which means that
    the window appears in all the desktops. The Pager is a sticky window (this feature
    is also commonly used for clocks and can be used for icons that you want to have
    on all desktops).'
  merge: -1
