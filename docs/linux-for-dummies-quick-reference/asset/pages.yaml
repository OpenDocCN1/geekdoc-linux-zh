  md: '# Customizing the Environment


    To set the shell mode to vi, use the following command:

    set -o vi


    To set the shell mode to Emacs, use this command:

    set -o emacs


    You can place either of these commands in your .profile file so that the mode
    will be automatically set at login time.


    One significant difference between using the editing commands in vi and those
    in Emacs is that in vi you need to press Esc to activate the editing command (you
    have to switch back and forth between insert and command mode in vi command-line
    mode). In Emacs, you just need to type the key combinations, as shown in the following
    table.


    | Emacs | vi | Function |

    | Ctrl+P | K | Moves back one command in your history list |

    | Ctrl+N | J | Moves forward one line in your history list |

    | Ctrl+B | H | Moves back one character in the displayed command line |

    | Ctrl+F | L | Moves forward one character in the displayed command line |

    | Esc+B | b | Moves backward one word |

    | Esc+F | * | Moves forward one word |

    | Ctrl+A | 0 | Moves to beginning of line |

    | Ctrl+E | $ | Moves to end of line |

    | | Esc | Exit insert mode |

    | | a | Appends to line |

    | Esc+Del | X | Deletes backward one character |

    | Ctrl+D | x | Deletes forward one character |

    | Esc+D | dw | Deletes forward one word |

    | Esc+K | D | Deletes forward to end of line |

    | Esc+. | Esc+_ | Inserts last word of previous command |


    After you''ve mastered these commands, check out the man pages (enter man bash
    or man ksh) for additional editing commands.


    # Standard environment variables


    Environment variables are used to set your working environment. You change their
    values to change your default environment. You may also want to add new variables
    that your own programs use.'
