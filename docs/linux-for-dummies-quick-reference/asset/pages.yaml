  md: '# Techie Talk


    **absolute pathname**: The location of a file relative to the top of the file
    hierarchy. Also known as a full pathname; an absolute pathname starts with a /
    (slash).


    **alias**: A synonym. Aliases exist within the shell as abreviations for commands
    and in e-mail as shorthand for mail addresses.


    **argument**: A command-line parameter passed to a program. Also, what you get
    when you mention vi to an Emacs junkie or Emacs to a vi junkie.


    **ARP**: Address Resolution Protocol. This protocol maps IP addresses to hardware
    addresses.


    **ASCII (American Standard Code for Information Interchange)**: The standard code
    used for storing characters, including control characters, on computers.


    **background**: Running a program without it maintaining control of the terminal
    device. You start a program in the background by appending an ampersand (&) to
    the command line that invokes it.


    ![](img/74a57ca3470b31765a6f932d60bcc72e_212_0.png)'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# 196 Techie Talk


    **BASH (Born Again Shell):** The shell developed by the Free Software Foundation
    is upward compatible with the UNIX System V (Bourne) Shell.


    **bin:** The name of one of many program directories. /bin and /usr/bin exist
    on all systems. You may also have your own bin directory.


    **boot image:** An executable kernel that is initially loaded into memory.


    **CHAP (Challenge/Handshake Authentication Protocol):** One of the two popular
    protocols used by PPP for authentication. PAP is the other.


    **client-server:** In X, the client program does the work and the server interacts
    with the user shell.


    **command interpreter:** A shell. The program that reads and interprets user input.


    **command mode:** In vi, the mode in which all key functions are commands rather
    than text entries.


    **compression:** A way to shrink files or decrease the number of characters sent
    over a communications connection. File programs include compress, zip, and gzip.


    **csh:** Pronounced *cee-shell*, csh is a shell developed by Bill Joy at the University
    of California at Berkeley. csh was the first UNIX shell to offer command history
    and substitution, a feature that is now available in the Bash and Korn shells.


    **CTS (Clear To Send):** The control signal on a serial interface that tells the
    modem is ready to send data.


    **daemon:** A program that runs in the background and performs various tasks.
    Examples include sendmail, which delivers e-mail, and lpd, which handles the print
    queues.


    **desktop:** A graphical work environment. It includes a screen background, possibly
    a task bar, and an assortment of icons.


    **distribution:** One of several LINUX products. A distribution consists of LINUX
    software, installation programs, and possibly proprietary software.


    **DNS (Domain Name System):** The hierarchical method used to organize host names.


    **dotted quad notation:** The common way of expressing an IP address which consists
    of four number in the range of zero to 255. An example address written this way
    is 202.17.32.139.'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# Techie Talk 197


    **dvi (DeVice Independent):** An intermediate file format used by troff, LaTeX,
    and other formatting software. You can convert dvi files into various output formats
    with utility programs.


    **filter:** A program that can read from standard input and write to standard
    output.


    **flag:** An option. Flags are relics from UNIX Version 6, and they differ from
    today''s options in that they do not have a-(hyphen) in front of them. ar and
    tar are two programs that still use flags.


    **fork:** What LINUX uses to create a new process. The fork operation makes a
    clone of the current process.


    **FVWM (Feeble Virtual Window Manager):** The most popular window manager used
    with the X window system.


    **GNU:** Stands for GNU''s Not Unix. GNU is an attempt by the Free Software Foundation
    to write a UNIX-like operating system called the Hurd. While the Hurd remains
    incomplete, LINUX has drawn heavily on its utilities, including gcc, the GNU Compiler


    **GPL (GNU Public License):** A software licensing agreement developed at the
    Free Software Foundation to ensure that software remains free. Most of LINUX is
    covered by the GPL.


    **GUI (Graphical User Interface):** An interface that allows you to use your computer
    by pointing at objects with a mouse and clicking instead of typing in commands.


    **hidden file:** A file having a name starting with a dot (.). Use the -a option
    on the ls command to see hidden files.


    **home directory:** The directory you are in when you first log in. It is specified
    in your password file entry and is usually a subdirectory of /home.


    **host:** A computer. Commonly used when talking about computers connected on
    a network.


    **I/O redirection:** See *redirection.*


    **inode:** An entry in a file system in which all information about a file (except
    its name) is stored.


    **insert mode:** In vi, the mode in which you enter text.


    **Internet:** A huge network of networks connecting computers globally.


    **IP (Internet Protocol):** The protocol used for addressing messages on the Internet
    and some local networks.'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# 198 Techie Talk


    ISDN (Integrated System Digital Network): A digital network offering higher speed
    connections than conventional POTS (plain old telephone service).


    **kernel**: The guts of the operating system. The kernel is responsible for allocating
    resources and protecting users from one another.


    **kill**: To terminate a process. Various kinds of kill commands send signals
    to the process being terminated.


    **Korn shell**: The shell developed by David Korn at AT&T. It is upward compatible
    with the Bourne shell. You can use it for LINUX, or you can obtain a freeware
    clone pddksh.


    **LILO (LINUX Loader)**: The boot loader comes with LINUX. You can use it to boot
    multiple operating systems including those from Microsoft.


    **link**: An additional name for a file. You can create links using the ln command.


    **login directory**: See *home directory*.


    **man (manual) page**: A highly technical description of a file or command. The
    man command reads one of these guys.


    **Meta key**: A special key such as the Control key used by Emacs for additional
    control functions. If your keyboard has an Alt key, it acts as the Meta key. If
    you do not have an Alt key, press Esc and then the key that was to be associated
    with the Meta key.


    **MIME (Multipurpose Internet Mail Extensions)**: A means to attach any type of
    file, including multimedia, to an e-mail message.


    **mount**: To attach a new file system to an existing directory.


    **NFS (Network File System)**: A networking system that allows you to share files
    between computers. NFS was developed by Sun Microsystems and is available for
    virtually all UNIX implementations as well as for LINUX.


    **NIS (Network Information Service)**: Originally called yellow pages, NIS allows
    you to share password files, machine names, and other files in a consistent manner.


    **option**: A special kind of argument used to send a command. Options start with
    a hyphen.


    **PAP (Password Authentication Protocol)**: One of the two popular protocols used
    by PPP for authentication. CHAP is the other.


    **parent directory**: The directory that contains the current directory.'
  merge: -1
  pgno: 215
- img_proc: true
  md: 'partitioning: Dividing an allocatable device (such as a hard drive) into a
    number of pieces.


    permissions: A set of bits that identify who has the right to read, write, or
    execute a file. For directories, the permissions identify who can read, write,
    or search.


    pipe: A connection (entered using the | character) between the output of the program
    to the left of the pipe and the input of the program to the right of the pipe.


    POP (Post Office Protocol): The common protocol used for downloading mail from
    an ISP.


    POSIX: The IEEE standard for a portable operating system. The POSIX standard was
    derived from UNIX. LINUX complies with this standard.


    PostScript: A computer language designed specifically to describe printable and
    displayable pages. Many high-end printers interpret PostScript.


    PPP (Point to Point Protocol): Protocol used to send data over serial lines. Although
    commonly used to send IP packets, you can use PPP with other protocols such as
    Novell''s IPX.


    process: A running program.


    prompt: A string of characters displayed by the shell or a program to identify
    that it is waiting for user input.


    redirection: To alter the destination of the input or output of a program.


    Regular Expression: A pattern-matching mechanism used by UNIX and LINUX utility
    programs.


    rescue disk: A floppy disk that contains a boot image and other programs. It is
    used to recover from a damaged file system on the hard drive.


    root: The login name for a super user.


    root directory: The top level directory in a file hierarchy.


    route: The path between one machine and another. Commonly used in networking.


    RTS (Request to Send): The control signal on a serial interface that tells the
    modem that the computer wants to send data.


    screen editor: A text editor that displays a window into a file rather than displaying
    text on a line-by-line basis. Emacs, joe, pico, and we are all examples of screen
    editors. Screen editors are commonly used to write program files and edit text
    that will processed by a text formatter such as LaTeX or troff.'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# 200 Techie Talk


    script: See shell script. awk and Perl programs are traditionally called scripts.


    search path: A list of directories, typically stored in your $PATH environment
    variable, in which the shell looks for executable programs.


    server: The part of the X window system that is responsible for displaying information.


    shell: The command interpreter that interacts with the user.


    shell script: A program written in the language of the shell.


    shell variable reference: A dollar sign ($) followed by a string. The shell substitutes
    the value of the shell variable for this reference.


    SMTP (Simple Mail Transfer Protocol): The common protocol for transferring electronic
    mail. Mail Transfer Agents such as sendmail use SMTP.


    super user: The user/administrator who has access to everything in a system.


    symbolic link: Also known as a soft link, a symbolic link is a pointer from a
    filename to the location of a file. Symbolic links are the only way to link across
    different file systems.


    system administrator: The person responsible for keeping the computer system running.


    TCP (Transmission Control Protocol): The most reliable protocol that uses IP to
    transfer messages. TCP adds the necessary checks on top of IP to make sure a message
    is delivered.


    Telnet: A program that enables you to remotely log into a computer system.


    text formatter: A program that interprets special control sequences in text files
    and produces fancy-looking documents. LaTeX and groff are examples of such programs.


    tcsh: An enhanced version of csh that offers file name completion and a built-in
    vi and Emacs-like editor.


    Usenet: The Net before the Internet. Today, Usenet remains the source of newsgroups.


    user name: The name you use to identify yourself to your LINUX system.


    utility: A program that comes with LINUX or has been added to LINUX to perform
    a task.'
  merge: -1
  pgno: 217
- img_proc: true
  md: 'UUCP (UNIX to UNIX Communications Program): A batch-oriented method of transferring
    e-mail and news files over phone lines.


    **uuencoded file**: A binary file that has been translated into coded ASCII text.
    uuencoding is used to transmit non-text information via e-mail.


    **vi**: Pronounced *vee-eye* by 70 percent of the people, *vi* (like violet) by
    29 percent of the people, and *six* by the other 1 percent. One of two UNIX-based
    editors. Emacs is the other.


    **virtual memory**: The memory you pretend you have but don''t really have. On
    systems that support virtual memory, you can use as much memory as you want and
    the operating system uses swap space on the disk for the missing memory.


    **wildcard**: A special character that tells the shell to look for a match from
    available file names. ? matches a single character, and * matches 0 or more characters.


    **window manager**: A program that allows you to manipulate windows by moving,
    resizing, or closing them.


    **working directory**: Your current directory. Type `pwd` to find out what it
    is.


    **X server**: The part of the X window system that is responsible for displaying
    the information.


    **X window system (or just X)**: A GUI designed at the Massachusetts Institute
    of Technology. X is the de facto GUI standard for UNIX and LINUX.


    **zsh**: A shell similar in function to the Korn shell (ksh).'
  merge: -1
