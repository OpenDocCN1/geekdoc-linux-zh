  md: '# Networking with PPP


    | Option | Function |

    | --- | --- |

    | asyncmap map | Uses map to establish which control characters cannot be received
    over the serial line. This is a 32-bit bitmap specified in octal, in which each
    bit represents a control character. Bit 0 (00000000) represents the character
    0x00; bit 31 (10000000) represents the character 0x1F. |

    | auth connect cmd | Requires the peer to authenticate itself. Uses the program
    or shell command specified to set up the serial connection. The invoking of chat
    appears here. |

    | crtscts default | Uses hardware (RTS/CTS) flow control. |

    | defaultroute | Adds a default route to the system routing tables for this connection.
    |

    | disconnect cmd | Runs cmd to disconnect the link after pppd has terminated.
    |

    | escape xx,yy,... | Escapes the specified characters. You must put the values
    of the characters to be escaped in hexadecimal. (Escaping encapsulates them in
    a special sequence before sending them over the data link.) |

    | file optf lock | Reads options from file optf. Creates a UUCTP-style (Unix to
    Communications Program) lock file to prevent other programs from accessing the
    device that pppd is using. |

    | mru n | Sets the maximum receive unit value to n bytes. |

    | mtu n | Sets the maximum transmit unit value to n bytes. |

    | netmask n | Specifies a mask for this interface. You must use dotted notation
    (for example, 255.255.255.0). |

    | silent | Doesn''t send anything until the remote system sends a valid packet.
    |

    | local:remote | Sets the local and/or remote interface IP addresses. You may
    omit either. With dynamic addresses, you generally don''t need to specify either
    address. If you specify an address, use the icpc-accept-local or icpc-accept-remote
    options. |

    | bsdcomp nr,nt | Requests the remote system compress packets use the BSD compression
    scheme. nr specifies the maximum code size in bits. Packets sent to the remote
    system are compressed with a maximum code size of nt bits. If you don''t specify
    nt, nt defaults to the value of nr. |

    | -bsdcomp | Turns off BSD compression. |'
