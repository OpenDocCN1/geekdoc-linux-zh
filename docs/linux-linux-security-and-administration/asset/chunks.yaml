    如果你在服务器或网络中启用了此功能，你可以在攻击发生在你的系统之前阻止许多攻击。


    ## CIPE 或加密 IP 封装 (Cryptographic IP Encapsulation)


    这种加密目的是为服务器和系统提供一个安全的设施。这种加密保护了跨不安全数据包子网络之间的连接免受流量分析、窃听和伪造消息注入。使用 `CIPE`，你可以在服务器和网络层对数据加密。所有以数据包形式沿网络传输的信息都是被加密的，这些数据包由相邻网络驱动程序的加密引擎接收和发送。


    `CIPE` 不加密通过网络或连接传输的数据。它甚至不加密网络层或套接字层的数据。它只加密不同主机上网络、套接字和程序之间的逻辑连接。这与 `SSH` 非常不同。你还可以使用
    `CIPE` 通过隧道创建新的 VPN。如果你想避免对正在使用的应用程序软件进行更改，可以使用低级加密方法。这些方法确保连接到 VPN 或虚拟私有网络的网络之间的逻辑连接透明地工作。


    ## 使用影子密码 (Shadow Passwords)


    你可以使用影子密码来确保用户的密码经过加密，并将信息维护在普通用户无法访问的文件中。新版本的 `RedHat` 和 `Debian` 将此设置作为默认。加密后，密码存储在服务器目录下的文件中，服务器上的每个用户都可以访问该文件。如果有人在该文件上运行密码破解或猜词程序，他们就可以获得系统上每个用户的密码。


    影子密码将存储在另一个文件中，只有管理员或特权用户才能访问。如果你想使用影子密码，你需要确保每个需要密码的应用程序、工具或实用程序都能访问该信息。你可能还需要重新编译密码列表以支持用户访问系统。使用
    `PAM`，你可以插入一个影子模块，而不需要重新编译系统的任何密码。


    ## John the Ripper 和 Crack (John the Ripper 破解工具)


    如果你在服务器上使用了密码程序，但你发现人们没有使用难以猜测的密码，那么你就需要运行密码破解程序。该程序将帮助你判断你和用户使用的密码是否安全。密码破解程序背后的原理很简单——程序将查看字典中的每个单词，并尝试相同单词的各种变体。它还会加密这些单词并与你的密码进行比对。如果程序找到匹配项，它就能知道用户的密码。


    有许多你可以使用的密码破解程序，但人们经常使用“John the Ripper”和“Crack”。这些程序可能会占用你 CPU 的时间，但会产生极的结果。在黑客在你的系统和服务器上使用这些程序之前，你需要先使用它们并检查是否有弱密码。如果是，要求用户立即更改以避免任何黑客攻击。你可能会奇怪，当黑客只能通过漏洞或安全漏洞访问服务器时，他们是如何访问服务器上的密码文件的。遗憾的是，服务器上存在漏洞，经验丰富的黑客可以很容易找到这些漏洞。


    你还可以尝试 Linux 中使用的其他加密方法，例如透明加密文件系统 (`TCFS`)、加密文件系统、显示安全、`X11` 和 `SVGA`。我们将在书的后面详细介绍它们。


    ## 第六章：加密和解密密码保护文件的工具


    编码或保护文件以确保只有选定用户可以访问文件的过程称为加密。在计算机出现之前，我们就已经在使用加密的概念。当国家处于战争时，他们开发了代码来与战区的间谍或士兵通信。这是他们确保没有其他人能理解所传递的消息的一种方式。


    Linux 发行版自带了标准工具，用于加密和解密系统或服务器中的信息。在本章中，我们将查看七种你可以使用密码加密和解密文件的工具。


    ### GNU 隐私守护 (GNU Privacy Guard 或 GnuPG)


    `GnuPG` 通常称为 `GPG` 是各种加密软件的集合或套件，用 `C` 语言编写。如果你想用它来加密和解密文件，最好下载文件的最新版本。过去几年发布的大多数
    Linux 发行版都会默认安装此包。如果你发现你的服务器或系统上没有安装它，请使用以下命令进行安装：


