    # SELinux Modes


    - **Disabled**: When you use this mode, you can disable the use of SELinux on
    your server.

    - **Permissive**: If you use this mode, you will only receive a warning or alert
    when unauthorized activity is performed on the server. It will also log the actions
    performed by the user.

    - **Enforcing**: In this mode, the functions of SELinux are not limited, which
    means it looks at every aspect of the security of your server.


    You can manage the modes using the `/etc/selinux/config` file.


    # Securing the Console Access


    It is important to protect a Linux server from end-to-end, which means you need
    to protect the server''s access through a console. You need to disable the use
    of external devices, such as USB pens, CDs, or DVDs, once you set up the BIOS.
    You also need to set up the BIOS and use the `grub` boot loader password to protect
    the updated settings.


    # Restricting the Use of Old Passwords


    You can ensure users do not use old passwords when they are prompted to update
    their passwords. Your Linux server will save the old passwords in the file `/etc/security/opasswd`.
    You can ensure your server does this using the PAM module. If you are unsure of
    how to do this, follow the steps given below:


    1. If you use CentOS, Fedora or RHEL, you can open the file `/etc/pam.d/system-auth`.
    To do this, run the command:

    ```bash

    vi /etc/pam.d/system-auth

    ```


    2. If you use Ubuntu or Debian, you can open the file `/etc/pam.d/common-password`
    using the command:

    ```bash

    vi /etc/pam.d/common-password

    ```


    3. You need to add the following command to the `auth` section in your configuration
    file:

    ```bash

    auth sufficient pam_unix.so likeauth nullok

    ```

