    你可以通过访问虚拟机的设置来轻松修复此问题。在这里你可以处理虚拟机的硬件，并以超出硬盘（HDD）限制的方式调整设置。你可以更改网络适配器配置、内存、处理器等。


    在进行任何操作之前，你需要先查看处理器屏幕。你会发现一个关于虚拟化引擎的引用。当你在系统中安装虚拟机时，它会自动工作。如果你在出现问题时需要排查处理器，你需要设置
    `AMD-V` 或 `Intel VT-x`。


    虚拟桌面设置中的内存 屏幕将帮助你解决内存性能问题。你的虚拟机将包含你需要使用的 `RAM` 详细信息。它会告诉你你在物理机和虚拟机上需要维护的设置。建议你坚持这些设置。如果你将内存大小减到推荐值以下或高于推荐值，可能会产生问题或减慢你的系统。这意味着你的系统无法按预期方式运行。


    然后，你需要花时间处理显示设置。如果你愿意，可以坚持默认设置，但如果有问题，可以尝试调整 3D 加速开关。你可以根据用途对不同的显示器进行不同的设置。需要注意的是，你设置的某些模式可能会与你使用的不同桌面发生冲突。


    如果你对更改感到满意，确认它们并点击播放按钮启动你的虚拟机。


    ### 下载并安装工具

    现在你已经下载了虚拟机，应该重启它。你会被要求查看在此阶段可以下载并安装的各种 `VMware tools`。你只需要同意向导的说明，并让工具安装在你的虚拟机上即可。这些工具将提高你虚拟机的性能，允许你在客机和主机之间、以及虚拟机和物理机之间共享文件夹。


    ### 在 VMware 上安装 Linux

    当你启动虚拟机时，`ISO` 会直接进入你的现场环境，此版本的 Linux 是临时的，当你关闭设备时，它不会留在系统内存或启动媒体中。如果你想按照预期方式使用该环境，应该使用虚拟机的安装选项。


    此时，安装向导将继续在实际机器上安装操作系统。你需要遵循安装向导的步骤，在提示时创建账户并设置其他选项。当安装完成后，你就可以使用 Linux 虚拟机和客体操作系统了。过程就是如此。


    ### 在虚拟机上运行 Linux

    现在你已经在系统中启动了虚拟机，你可以使用系统上的播放按钮在虚拟机上运行想要使用的发行版。如果你正在寻找要安装的软件，可以选择作为 Linux 发行版一部分的预装应用程序。如果你愿意，也可以选择下载不同的应用。


    如果你想通过系统访问 Linux 终端，可以在没有 `VMware workstation` 的情况下实现。


    ### 在 Windows 虚拟机上安装 Linux 发行版

    如果你使用 Windows 操作系统，通过虚拟机访问 Linux 是简单的方法。来自 `VMware` 的 workstation player 具有帮助你完成此操作的最佳工具。你可以轻松在
    `VMware workstation` 上安装 Linux。让我们再次快速过一遍步骤：


    - **第一步**：你需要下载 `VMware workstation player`。建议下载最新版本。

    - **第二步**：安装 workstation player 并重启。

    - **第三步**：配置并创建虚拟机。

    - **第四步**：安装你选择的 Linux 发行版。

    - **第五步**：重启虚拟机并使用操作系统


    这个过程非常简单，你不需要局限于某一个系统。你可以从上述的 Linux 发行版列表中进行选择，并可以在你的工作站上安装所有它们。


    ### 第二章：在 Linux 上保护用户账户


    #### 不要使用 Root 账户登录

    你 Linux 操作系统上的 `root` 用户就像 Windows 上的管理员。在某些情况下，你可能想登录 Windows 上的管理员账户。你永远不要使用
    root 账户登录 Linux。微软一直致力于通过用户控制 (`UAC`) 改进 Windows 上的安全实践。Linux 没有此类现成的工具，因此你应该避免使用
    root 用户。


    #### 使用 Sudo 账户

    用户需要避免使用 root 账户访问操作系统。`Ubuntu` 为不同用户提供了 `sudo` 权限。`Ubuntu` 锁定了 root 账户，因此任何用户如果不额外启用
    root 账户并获取密码，无法登录 root 账户。早期版本的 Linux 发行版允许用户通过图形登录界面访问 root 账户进入 root 桌面。许多应用程序可能无法以
    root 身份运行，另一些可能会报错。如果你从 Windows 转到 Linux，可能想用 root 登录操作系统。你可能认为这与使用 Windows 管理员账户不同。这是一个糟糕的做法，因为它会危及你的系统。当你在
    `Ubuntu` 上使用 `sudo` 账户时，你会获得 root 权限。如果你使用 `su`，你只是访问 root shell 来运行可能需要的命令。通过
    `sudo`，你可以在系统中执行正确的安全实践。只有当你处于 root shell 时，才能以 root 用户身份访问并运行应用程序。


    #### 减少损害

    当你使用个人账户访问操作系统时，系统将确保硬盘上运行的任何程序都不会受到影响。使用个人账户运行的程序只会对你的家目录进行更改。在没有获得 root 权限的情况下，你无法修改任何系统文件。这是一种维护安全的简单方法。假设你使用
    `Chrome` 作为默认应用程序，如果你使用 root 账户运行操作系统，会使系统面临漏洞。恶意软件可以通过不同的页面进入你的系统。如果你使用受限账户，恶意软件仍然可以进入系统，但无法破坏系统功能。使用受限账户登录系统可以保护系统免受恶意软件攻击。恶意软件可以访问你的账户，但无法替换任何命令。使用
    root 账户可能会损害你的系统，这绝对不是好主意。如果你使用 root 账户运行操作系统，你可以无法轻松恢复硬盘上的文件。这意味着你需要重新安装操作系统。


    #### 细粒度权限

    旧的 Linux 发行版使用 `root` 账户运行各种程序。现代发行版系统使用 `PolicyKit` 等工具来区分 Linux 用户账户可以执行的功能。你也可以定义权限。例如，如果你在操作系统上管理应用程序，你可以使用
    `PolicyKit` 确保应用程序可以安装和更新软件。根据你设置的权限，只有部分用户可以执行操作。这意味着这些用户没有 root 访问权限，无法对操作系统进行任何更改。你可以在
    Linux 中使用 root 账户登录图形桌面，这允许你删除硬盘上的每个文件。当系统运行时，你也可以在硬盘上写入随机信息，这会毁掉你的文件系统。使用 root
    账户将绕过安全，让系统产生漏洞。


    ### 管理用户账户安全

    如果你想保护操作系统，需要对用户账户进行控制。本节将查看如何执行用户账户管理功能和任务。我们来看如何实施安全措施。


    #### 添加新用户

    如前所述，你应该避免使用 `root` 账户执行任何功能，特别是常规操作。如果你在新的服务器或虚拟机上部署了操作系统，使用 root 账户意味着你需要为每个访问系统的人创建新账户。要执行此，在
    shell 中运行命令：

    ```bash

    adduser <username>

    ```

    你还需要创建密码并输入关于用户的其他信息，你可以使用用户账户来实现。


    #### 禁用 Root 登录

    如果你想防止任何入侵，必须禁用远程访问。配置文件包含 OpenSSH 设置，你可以使用 Ubuntu 上的编辑器打开它：

    ```bash

    sudo nano /etc/ssh/sshd_config

    ```

    如果你使用 Red Hat 或 CentOS 变体，可以使用：

    ```bash

    sudo vi /etc/ssh/sshd_config

    ```

    你也可以搜索认证设置和选项并更改登录权限。你可以通过使用命令将设置改为 `no` 来实现：

    ```text

    PermitRootLogin no

    ```

    保存文件。一旦完成更新，重启服务器。如果你在云服务器和 CentOS 上，可以使用命令：

    ```bash

    sudo systemctl restart ssh

    ```

    在 Ubuntu 系统上，调用以下命令：

    ```bash

    sudo service ssh restart

    ```


    #### Linux 中的密码策略

    如果你允许用户远程访问服务器，你需要使用 Linux 中名为 `PAM` 的模块来强制并实施密码策略。你可以通过 `pam_cracklib.so` 调用它。你可以使用此模块检查用户输入的密码是否与字典单词冲突。这防止了弱密码的使用。该模块还允许你定义任何新的密码要求，例如复杂性和长度。在
    Debian 和 Ubuntu 系统上，你可以使用以下安装此模块：

    ```bash

    sudo apt-get install libpam-cracklib

    ```

    Red Hat 和 CentOS 变体预装了此模块。安装完发行版后，你需要打开并编辑配置文件。如果你使用 Debian 或 Ubuntu，在文本编辑器中打开文件：

    ```bash

    sudo nano /etc/pam.d/common-password

    ```

    在 CentOS 上，文件将以新名称存储。使用命令：

    ```bash

    sudo vi /etc/pam.d/system-auth

    ```

    当你在 Debian 或 Ubuntu 上安装模块时，服务器上会配置密码并执行检查。因此，你需要找到相应的此设置并更改它，使其看起来如下所示：

    ```text

    password required pam_cracklib.so retry=3 minlen=8 difok=3 dcredit=1 ucredit=1
    lcredit=1

    ```

    如果你使用 CentOS，你可能需要将上述整行直接添加到配置文件中，但这取决于你正在使用的版本。


