    ## Chapter Ten: Downloading and Installing Kali Linux

    If you want to perform an analysis of your system’s security, you need to use
    the Kali Linux distro. This is a powerful tool you can use to assess the vulnerabilities
    in the system. In this chapter, we will look at how you can download and install
    the Kali Linux distro in your system and use various penetration testing tools
    which are built into the operating system. These tools will help any system administrator
    while conducting penetration tests in the various stages of the penetration lifecycle.
    We have covered the details of how to install an operating system onto your system
    using a virtual machine, but let us look at what you should do when you install
    the operating system directly onto your system. For those of you who have never
    installed an operating system ever, there is nothing to worry about, as this chapter
    will guide you with a detailed installation of the Kali operating system. From
    the information in this chapter, you will learn how to install Kali Linux and
    where you can download the installation media from.


    Kali Linux is a tool you can use to check the system for any vulnerabilities.
    This operating system installs quickly on permanent media like a hard disk but
    can also be installed on a USB stick and live booted from it whenever required.
    This is a very convenient and portable tool in the toolkit of a system administrator.
    If you can access the local machine while you work as a system administrator,
    you can leverage the Kali Linux live disk to boot it into a locally available
    physical machine inside the target organization’s infrastructure. There are over
    400 tools and applications available in the Kali Linux operating system.


    ### Downloading Kali Linux

    Kali Linux is a distribution of the Linux operating system, and we discussed the
    same in the first chapter. This operating system is available for free, and you
    can download the ISO image file from the official website. You may need to use
    a different system to download the ISO and then burn it onto a DVD or USB to ensure
    you install it onto your system. You can download the image from the following
    URL:


    https://www.kali.org/downloads/


    If you need material to learn more about the configurations, advanced operations,
    and other special cases, you can find this information on the official Kali Linux
    website at:

    http://www.kali.org/official-documentation/


    It is recommended that you register on the Kali Linux website to access the community
    where you can discuss your issues and learn more about how to overcome them. Before
    you download the image file from the website, you need to ensure you select the
    right architecture. Your system architecture is 32-bit or 64-bit, and you need
    to choose the image which works for your system. Once you complete the download,
    you can use the image burning software to copy Kali Linux onto your system.


    ### Hard Disk Installation

    Once you start with the installation process, you need to place the DVD in the
    drive and plug the USB stick to install the media used to load the operating system.
    Depending on what you want to use, you should set up the boot priority in your
    computer’s BIOS settings.


    ### Booting Kali Linux for the First Time

    If you have managed to install Kali Linux from a USB stick or DVD, you should
    reboot your system and should be able to boot from the newly installed drive.


    ### Setting the Defaults

    The next few screens will have the default settings you need to use when you set
    up the operating system. You can choose various options such as the language,
    location, and keyboard. You need to select the settings which apply to your region.


    ### Initial Network Setup

    A screen will appear on your system, and you can use it to type the hostname.
    When you click next, the installation manager will request you to enter the fully
    qualified domain name. If you are unsure about what you need to do leave the option
    blank and continue.


    ### Password

    On this screen, the installation manager will ask you to choose the password for
    the root account. The root account is a superuser or privileged account and can
    be used to own the system. The Kali Linux system comes with a default password
    for the root account. It is recommended for you to change the password to the
    complexity of your choice. You also need to ensure the password adheres to the
    following criteria: uppercase, number, and symbol. Once you choose the password,
    you need to click on to move to the next step in the installation process.


    ### System Clock

    Another prompt will appear on your screen, where you can choose the alarm clock.
    Now select the time zone and continue with the installation.


    ### Disk Partitioning

    There are different methods you can implement when you install Kali Linux using
    a hard disk. There is a lot of information one needs to know when it comes to
    disk partitioning. In this chapter, we will look at the basic process called Guided
    Partitioning. Since we are using a Guided partition mechanism, you need to use
    the entire disk to install the operating system. Select the option and continue
    the process of installation.


    On the next screen, you will obtain information about all the hard drives which
    are on your system. You will see only one drive in the list and multiple drives
    since most systems come with one drive. Choose the hard drive you want to use
    to install Kali Linux. Now select Continue.


    On the next screen, the installer will prompt you how you will use the available
    hard drive. I am assuming you are a beginner reading this book and will guide
    you on how you should do this. You need to select the `All Files` option and choose
    one partition. This will keep the process extremely simple. Once you select this,
    click continue. In the next section, you will be given all the options you can
    use as an input. You will be given the details selected to review. If you are
    happy with the details provided, you can continue with the information. There
    is only going to be one primary partition where all the files and folders will
    be saved. The secondary partition is called swap. The latter is used as the virtual
    memory system where you switch between the RAM and CPU and the files are moved
    between these two locations. In simple terms, this is termed as buffer memory.
    It is important to ensure all the swap partitions are only on Linux systems. This
    is the best way to encrypt the swap and protect the information in the swap. The
    swap needs to be the same size as the RAM that is installed on your system. Once
    this is done, you can select finish and move onto the next step. Once you are
    done with the selection, you can confirm the options selected by you. You will
    also be presented with a prompt to select yes and continue with the installation.
    You can change the partitioning scheme if you need to, but you can only do this
    when your operating system is live. This will damage your system. After clicking
    Continue, you will see a progress bar screen and the installer will begin copying
    files to your hard disk. The time your system takes to complete the installation
    process is dependent on the hardware in your system.


    ### Configuring the Packet Manager

    When you finish copying the files onto the hard disk, you will receive a prompt
    that will ask how you would like to configure the package manager for your system.
    This package manager is especially important for your system, and it is used by
    the Kali Linux system when it needs to update the package repository based on
    the new updates made to the software. You need to use a network that mirrors the
    one that Kali Linux is sitting on since this is the only way you will learn about
    the package sources available for Kali Linux. You need to click on yes to continue
    the process of installation. You will also be prompted with another screen to
    specify the use of a third-party URL. This is again used when Kali Linux is part
    of the local repository. If you do not want to fill in these details, leave it
    blank and continue the installation process.


    ### Installing the GRUB

    When you move onto the next screen, the installer will throw a prompt asking you
    if you wish to install the bootloader. The Grand Unified Bootloader, or GRUB,
    is the main screen that will appear on your screen when the Linux operating system
    boots up. GRUB gives you a menu that you can use to move into the advanced settings.
    If you are an advanced user, you may need to do this. Select Yes and click Continue.


    ### Completing the Installation

    You are now at the end of the installation phase and will find the system''s completion
    screen. Once this is done, you can click Continue and your system will automatically
    reboot. Remove the installation DVD or use the USB stick if you need before reboot.
    At this point, you will see the Kali Linux welcome screen on your system. You
    need to log in using the root account you set up initially.


    ### USB Drive Installation

    You can use a USB drive, thumb drive, or stick to install Kali Linux. This is
    a storage device, and it is recommended for you to use a USB drive with at least
    10 GB storage space if you want to install Kali Linux on your system. Every new
    computer will allow you to boot the Linux operating system from a USB device.
    You can choose to set the boot priority for the USB device from the BIOS settings
    in your system. We will look at how you can use a USB drive to install Kali Linux
    on Windows or Linux machine. You can look at the documentation provided on the
    Kali Linux website to understand this better.


    When you use a USB drive, use the command below in the Linux terminal if you want
    to see where the USB drive is present:


    ```bash

    mount | grep -i udisks | awk ''{print $1}''

    ```


    When you use a USB drive, you need to remember two terms: persistence and non-persistence.
    The former is the system’s ability to retain the modifications you make to the
    file after you reboot. The latter refers to the fact that the system will lose
    its changes when you reboot. In this chapter, we will look at the persistent and
    non-persistent installation of Kali Linux on Linux and Windows operating systems
    respectively.


    ### Windows Non-Persistent Installation

    Before you move with the installation of Kali Linux using a USB drive through
    the Windows operating system, you need to download the Win32 Disk Imager from
    the following URL:


    https://sourceforge.net/projects/win32diskimager/


    Once you download the ISO for Kali Linux like you used the hard drive to install
    it, plug your USB drive into the system. Your current operating system will detect
    it automatically and assign a driver to the file. You then need to launch Win32
    Disk Imager application and click on the folder to browse through the different
    files and folders. You need to select the ISO for Kali Linux and click the OK
    button. Select the drive letter you want to assign to the USB drive from the drop-down.
    You now need to click the write button so your operating system will write the
    Kali Linux operating system onto the USB drive. This process will take time and
    is dependent on your system’s hardware. When the installer has completed moving
    the ISO to the USB drive, you need to restart your computer. Set the option to
    highest boot priority for the USB drive from the BIOS settings in your system.
    It is important to understand that each system has its own user interface for
    the BIOS settings depending on the manufacturer. Therefore, you need to select
    the boot priority settings carefully. Once you do this, you need to reboot the
    system and the first thing on your screen will be the Kali Linux boot menu. You
    can choose the Live option that is the first option when it comes to booting Linux
    from the USB drive directly.


    ### Persistent Installation

    It is important to remember that the size of the memory matters, especially if
    you use a USB drive to install Kali Linux on your system. Depending on the type
    of operating system you use, you need to create a Kali Linux USB drive. You need
    to ensure that the GParted application is installed on your device before you
    work on installing Kali Linux. If you have trouble with GParted, you need to read
    the documentation and see what you should do to get rid of any errors during installation.
    You can use any of the following commands in the terminal to install this tool:


    ```bash

    apt-get install gparted

    aptitude install gparted

    yum install gparted

    ```


    Once you have GParted downloaded on your system, you need to download the Kali
    Linux ISO from the official website and plug the USB drive onto your computer
    system. You need to use the command below in the Linux terminal if you want to
    see where the USB drive is present:


    ```bash

    mount | grep -i udisks | awk ''{print $1}''

    ```


    The file in the USB drive will be saved using the name `/dev/sdb1`. You must ensure
    you look at the right file when you install Linux on your system since the file
    can be different from one system to the next. In the following command, you can
    remove the numbers at the end to switch between file names. Use the `dd` command
    to write the Kali Linux ISO to the USB drive as follows:


    ```bash

    dd if=kali_linux_image.iso of=/dev/sdb bs=12k

    ```


    Launch Gparted application using the following command:


    ```bash

    gparted /dev/sdb

    ```


    You should now have one partition in your drive which has the Kali Linux image
    on it. The next thing to do is create another partition in the drive by right-clicking
    on the drive and selecting the ‘New’ option from the menu. Here are the steps
    you need to follow:

    - The unallocated space in the drive is greyed out.

    - Select the partition menu.

    - Specify the size of the partition.

    - Format the file system as `ext4`.

    - Set the boot flag.

    - Create the partition.

    - Create the mount point.

    - Mount the partition.

    - Create the persistence file using the following commands:


    ```bash

    mkdir /mnt/usb

    mount /dev/sdb1 /mnt/usb

    dd if=/dev/zero of=/mnt/usb/persistence count=10

    touch /mnt/usb/persistence

    echo "root" >> /mnt/usb/persistence

    umount /mnt/usb

    ```


    You have now created a persistent Live USB. Reboot your system and you should
    be able to boot from the USB drive.


    ## Chapter Eleven: The Penetration Testing Cycle

    As a system administrator, you need to perform penetration testing to ensure you
    have the right security. In this chapter, we will look at the different stages
    used in penetration testing. Using this chapter, you will learn more about the
    penetration testing lifecycle.


    ### The Five Stages of the Penetration Testing

    In this section, we will look at the five stages of the penetration lifecycle
    and understand what each expects.


    ### Stage 1: Reconnaissance

    Reconnaissance is the first step in the penetration testing phase. Let us assume
    you are running a military operation. The analysts are going through the territory
    map, looking at the news and trying to see what can be done. You need to gather
    information using public and private sources.


    ### Stage 2: Scanning

    This is exactly what you do in the reconnaissance stage. You gather information
    to determine which server and network you need to scan to find any vulnerabilities.
    You can use various tools to scan the target network, and Kali Linux comes with
    in-built options. You need to use the information you collect during this stage
    during the exploitation phase to determine which areas you need to exploit.


    ### Stage 3: Exploitation

    If you are performing the penetration testing with a team, you need to ensure
    you move through the network and server easily without being detected. You also
    need to find a way to enter the server without getting caught. You need to find
    the right gaps in the server and enter the system and network through the server''s
    open door. You also need to spend time inside the server and see what information
    you can extract from the system. The objective is to ensure you quickly enter
    and exit the network and server with the information you need without being detected
    by anybody. During this stage, you need to exploit the system and find sensitive
    information about the business.


    ### Stage 4: Maintaining Access

    When you perform the penetration test, you must ensure you have unlimited access
    to the servers and network you are using. You need to ensure there is access to
    all the information you need. As the system administrator, you need to find a
    way to keep access while you discover how to enter the target system and network.
    You also need to find a way to exploit the server and see what information you
    can obtain or access through the network. You also need to find a way to get in
    and out of the system without getting caught. Therefore, with the information
    gathered in the exploitation state, they automate a way to keep their access to
    the target system.


    ### Stage 5: Reporting

    When you perform penetration testing on your system and server, you need to stand
    in front of the entire team and the higher-ups to tell them what you learned from
    the penetration test you performed. You need to explain every step and detail
    everything you found during the test. You need to expand the details of your findings.
    At the end of the penetration testing lifecycle, you also need to prepare a report
    which explains each phase of your penetration test. You need to explain the loopholes
    discovered, the vulnerabilities exploited, and the servers and networks.

