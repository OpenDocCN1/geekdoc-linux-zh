- fmt: '

    Once you do this, you need to add the following lines to the configuration file
    to ensure a user does not reuse his last few passwords. You can decide the number
    of passwords you want the server to store.


    ```

    password sufficient pam_unix.so nullok use_authtok md5 shadow remember=5

    ```

    This line will indicate to the server that it needs to remember the user''s last
    five passwords. So, if the user enters one of the earlier passwords, he will receive
    an error from Linux asking him to choose a different password.


    ## Checking Listening Ports

    You need to look at the different ports in your server and view them along with
    the services they provide. To do this, you can run the following command: `netstat
    -tunlp`. Based on the list you receive, you can determine if there are any ports
    you need to disable from the system. You can do this using the command `chkconfig`.
    You can then close all the ports in the server which you do not need. To do this,
    you can run the command: `chkconfig serviceName off`.


    ## Disabling Login through the Root

    As mentioned earlier, it is important to ensure that you do not log in to your
    server using the root account. Therefore, you need to disable the ssh port as
    the root account on the server''s configuration file. Before you do this, let
    us look at an example where we create a user with `sudo` privileges, so you can
    use the ssh port to access the server and perform the necessary tasks. When you
    log in to the server, you can move from the user to the root account if you need
    to.


    Let us first create a new user. To do this, use the following command: `useradd
    user1`. You can now add a password to this user account using the command: `passwd
    user1`. Now that you have a user created on the server, you can give it `sudo`
    permissions using the following line: `echo ''user1 ALL=(ALL) ALL'' >> /etc/sudoers`.
    You then need to use `ssh` to access the server using the new user account. This
    is one way to ensure you log in to the server.


    Now, we need to disable the root access to the SSH port. This will mean no user
    can use SSH to log in to the server using the root account. You need to open the
    configuration file `nano /etc/ssh/sshd_conf` to do this. You then need to update
    the line `PermitRootLogin` to `no` in the file. You then need to save this file
    and close it. Once you restart it, you will see that the settings have been updated.


    Before you log out of the server, you should test if you can log in to the server
    using SSH using a user ID that was created earlier. To do this, you can open another
    instance in the terminal and log in to the council using SSH. If everything works
    as it should, you can log out of the server as the root user.


    ## Change Ports

    You can also change the default port used by SSH to access the network. You can
    add a layer of security to ensure your server is safe. To do this, you need to
    make updates to the `/etc/ssh/sshd_config` file. In this file, you need to replace
    port number `22` with a number you want to use as the port. Once you save the
    file down, you can reboot the server. To do this, you need to use the following
    command: `service sshd restart`. You can then log in to the server using the updated
    port number with the following command: `ssh username@IP -p 1110`.


    ## Disabling Shortcuts

    When you hit the shortcut `Ctrl+Alt+Delete`, your server will automatically reboot.
    Therefore, it is best for you to disable this shortcut to prevent someone from
    rebooting the system by mistake. This action is in the configuration file named
    `/etc/init/control-alt-delete.conf`. All you need to do is to comment out the
    line `#start on control-alt-delete` in the configuration file.


    ## Logging In Without Passwords

    You can log in to your server using SSH. You can let go of passwords if you configure
    the details in the file. The only thing you need to do is to enter the server
    by generating a key using SSH. It is important to ensure the user can only enter
    the server from the machine where he generated the ssh key. Let us see how we
    can generate an SSH key to access the server: `ssh-keygen -t rsa`. Once you generate
    the key, you can add the key to the server you want to access using the following
    command: `cat ~/.ssh/id_rsa.pub`.


    If you have more than one user on the server, you can give each user a `ssh` key
    to access the server from his system. You can do this using the following command:
    `cd /home/user1 ls -ll`.


    To ensure that only some users have access to a ssh key for security reasons,
    you can configure the list of users in a ssh directory. You can do this using
    the following commands:

    ```

    mkdir .ssh

    cd /home/admin/.ssh

    vim authorized_keys

    ```

    You can also create a public SSH key and add it to the configuration file before
    changing the owner. To do this, run the following command: `chown user1 authorized_keys`.


    If you do not want to use an SSH key, you need to disable the SSH login. To do
    this, you need to edit the configuration file using the following lines of command:

    ```

    Edit /etc/ssh/sshd_config

    Passwordauthentication no

    PermitRootLogin no

    ```

    Once you do this, you can ensure only an authorized user can enter the server
    using the command: `ssh user-name@serverIP -p(port Number)`.


    ## Use fail2ban

    If you want to use an application to see where a server is attacked frequently,
    you can use `fail2ban`. This application also tells you about any automated attacks
    that happen on the server. It also works on the firewall and updates it when there
    is any issue found in the server. `Fail2ban` changes the configuration in the
    firewall and will push it to block the IP address either for a specific period
    or permanently, depending on the type of attack.


    Run the following command if you want to install `fail2ban` on your system: `sudo
    apt install fail2ban -y`. You should then copy the configuration file that is
    found on your system using the following command: `sudo cp /etc/fail2ban/jail.conf
    /etc/fail2ban/jail.local`. If you do not have `jail.local` file, you need to create
    it and then copy the content from `jail.config` to `jail.local`. You can use the
    following command:cp /etc/fail2ban/jail.conf /etc/fail2ban/jail.local`. You now
    need to make the required changes to the file:

    ```

    [sshd]

    enabled = true

    port = ssh

    protocol = tcp

    filter = sshd

    logpath = /var/log/secure

    maxretry = 3

    findtime = 600

    bantime = 600

    ```

    Before you restart the application, you need to block the IP by setting `bantime`
    parameter to `-1`. Once you do this, you can restart the application using the
    following command: `sudo service fail2ban restart`. It is as simple as this. The
    application will continue to examine the log files on the system and look for
    attacks. The application will also have a list of all IP addresses which it will
    prevent from accessing the server. If you want to view this list, use the following
    command: `sudo fail2ban-client status ssh`. You can also use `fail2ban` to log
    in to SSH. You need to ensure the application is updated regularly, so you can
    access the server.


    ## Creating a Newileged Account

    You should now create a user account. Bear in mind that you do not log in to the
    server using the root account. You can also create your own account. As mentioned
    earlier, you should create a `sudo` account using which you access the server.
    Now, log in to the server using the sudo account. We have looked at how you can
    create new accounts and give it `sudo` privilege access.


    ## Uploading the SSH Key

    When you create a new server, you need an SSH key to access the server. You can
    use a pre-generated key if you want to or create a new key. To do this, run the
    following command: `ssh-copy-id <username>@ip_address`. You can now avoid the
    password when you log in to the new server using the SSH key.


    ## Securing SSH

    Once you do this, you need to make the following changes:

    1. Remove the password authentication for the SSH protocol

    2. Do not allow users to access the root account remotely

    3. Also restrict access to IPv6 and use IPv4


    To do this, you need to make changes to the SSH configuration file. When you open
    the file, you will find the following lines of code:

    ```

    PasswordAuthentication yes

    PermitRootLogin yes

    ```

    You need to change it, so the lines look at follows:

    ```

    PasswordAuthentication no

    PermitRootLogin no

    ```

    You then need to restrict which the SSH service uses – either IPv4 or IPv6. You
    can do this by making changes to the `AddressFamily` option in the configuration
    file. If you want to change it, so it uses only IPv4, make the following change:
    `AddressFamily inet`.


    It is only when you restart the SSH service that your changes will reflect on
    your server. Bear in mind that you should have two active server connections before
    you restart the SSH server. When you have an extra connection, you can fix any
    issue that may arise in case the restart does not go as planned. If you use Ubuntu,
    you can run the following command: `sudo service sshd restart`. If you use any
    Linux distros which has a Systemd configuration, run the following command: `sudo
    systemctl restart sshd`.


    ## Creating a Firewall

    In the previous chapter, we looked at how you can install, enable and configure
    a firewall on your system, so it allows only the network traffic you allow to
    access the server. You can also use an uncomplicated firewall if you need to,
    depending on how well you code. If you cannot code, use `ufw`. You can install
    it on your system using the following command: `sudo apt install ufw`.


    The `ufw` firewall, by default, will deny any incoming connections and allow everything
    to go out of the network. This means all the tools and applications on your system
    or server can connect to the Internet, but if anything external tries to connect
    to the server, it will not allow it. You need to ensure you can access HTTPS,
    HTTP, and SSH protocols on your server using the following commands:

    ```

    sudo ufw allow ssh

    sudo ufw allow http

    sudo ufw allow https

    ```

    After you do this, you should enable the firewall using the following command:
    `sudo ufw enable`. You also need to check which services and applications are
    allowed and denied by the `ufw`: `sudo ufw status`. If you do not want to use
    the firewall, you should type the following command: `sudo ufw disable`. Alternatively,
    you can use the firewall interface we discussed in the previous chapter.


    ## Removing Unused Network Services

    Every Linux operating system has a server that has applications and servers that
    work with the network. You need to use most of these applications and servers,
    but you can get rid of some. Using the command `ss`, you can see the network services
    and applications being used on your Linux servers: `sudo ss -atpu`.


    The output of this command will differ depending on the distros you are using
    on your system. The following is an example of the output you may see. The output
    shows that `nginx` and `sshd` are the only active services listening to every
    activity:

    ```

    LISTEN 0 0.0.0.0:22 0.0.0.0:* users:(("root",fd=6))

    LISTEN 0 0.0.0.0:80 0.0.0.0:* users:(("nginx",fd=7))

    ```

    The process of removing an unused application or service will be different depending
    on the type of distros you are using. If you use Ubuntu or Debian, you need to
    run the following command: `sudo apt purge <service_name>`. On CentOS or Red Hat
    systems, you need to run the command: `sudo yum remove <service_name>`. If you
    run `ss -atup`, you can determine if unused or dormant services are no longer
    running.


    ## Chapter Five: Password Encryption Methods in Linux

    Since passwords are the main security mechanism used nowadays, it is important
    to ensure every user on the server or system has a difficult password. Linux distributions
    come with programs that ensure the user’s password is strong. You need to use
    encryption software since it is necessary more than ever. There are different
    methods you can use to encrypt data and every method has its own characteristics.
    We will discuss methods in the latter part of the chapter. The method used is
    called Data Encryption Standard (DES). The passwords, once encrypted, are stored
    in a file on the server: `/etc/passwd`. Otherwise, they are stored in `/etc/shadow`.
    When a user logs into the server or network, the password he enters will be encrypted
    and checked against the file where his password matches, access is denied.


    ## Pretty Good Privacy (PGP) and Public-Key Cryptography

    If you use public-key cryptography, there will be separate keys used to encrypt
    and decrypt the information passed through the server. Traditional forms of cryptography
    use one key to encrypt and decrypt information, and this key should be available
    to both parties. It is assumed that the key is transferred carefully between the
    users. The public-key cryptography method uses two different keys to prevent the
    loss of the key used to decrypt information during the transfer. A public key
    is available for anybody performs the encryption. The user, however, must ensure
    the decryption key used by them is kept private. They should not share this key
    with anybody over the network.


    PGP is another privacy option you can use to protect the data on your system and
    server. If you choose to use this, ensure you have the version applicable and
    allowed in your country. There are some export restrictions placed by the US government.
    Therefore, you cannot use strong encry when you transfer any information from
    outside the country.


    ## S/MIME, SSL and S-HTTP

    Most users are unaware of the differences between these forms of encryption and
    security protocols. They also not know how they can be used. In this section,
    we will go through each protocol to know how to use them to secure your network
    and server.


    ### S/MIME

    S/MIME or Secure Multipurpose Internet Mail Extension is a standard encryption
    protocol. This is used to encrypt all messages passed through the Internet, especially
    electronic email. S/MIME is an open standard, and this was developed by three
    programmers - Ron Rivest, Adi Shamir, and Leonard Adleman or RSA. Therefore, you
    will see it used in Linux quite often.


    ### SSL

    SSL or Secure Sockets Layer is an encryption method used often in Linux. It was
    developed to provide security when moving data across the Internet and was programmed
    by Netscape. SSL also uses different encryption protocols and ensures the client
    and server is authenticated. The protocol will operate at the transport layer.
    It will also create a secure encrypted channel within which the data is passed.
    This makes it easy for you to encrypt the data passed through the connection.
    This encryption method is used when you visit a secure website. For example, you
    may want to access an online document that is secured. To do this, you can use
    the communicator. On using this method, the SSL will create a secure communication
    network with the communicator using different encryption software.


    ### S-HTTP

    S-HTTP is another Internet protocol that is used to provide security. This protocol
    was first designed to provide confidentiality, integrity, and authentication when
    data passed across the network. It also supports cryptographic algorithms and
    the use of key-management systems.

