    /etc/fail2ban/jail.local fileYou now need to make the required changes to the
    file:[sshd]enabled  = trueport     = ssh ( provide the port number if the default
    port is changed )protocol = tcpfilter   = sshdlogpath  = /var/log/securemaxretry
    = 3 ( max no. of tries after which the host should be banned)findtime = 600 (You
    can use this parameter to set the window that the application will pay attention
    to when it looks for repetitive incorrect authentication in a few seconds)bantime 
    = 600 (time duration for which the host is banned -in seconds)Before you restart
    the application, you need to block the IP by setting the bantime parameter to
    -1\. Once you do this, you can restart the application using the following command:
    $ sudo service fail2ban restart .It is as simple as this. The application will
    continue to examine the log files on the system and look for any attacks. The
    application will also have a list of all IP addresses, which it will prevent from
    accessing the server. If you want to view this list, use the following command:
    $ sudo fail2ban-client status ssh .You can also use fail2ban to log in to SSH.
    You need to ensure the application is updated regularly, so you can access the
    server using SSH.Creating a New Privileged AccountYou should now create a user
    account. Bear in mind that you do not log in to the server using the root account.
    You can also create your own account. As mentioned earlier, you should create
    a sudo account using which you access the server. Now, log in to the server using
    the sudo account. We have looked at how you can create new accounts and give it
    sudo privilege access.Uploading the SSH KeyWhen you create a new server, you need
    an SSH key to access the server. You can use a pre-generated SSH key if you want
    to or create a new key. To do this, run the following command: $ ssh-copy-id <username>@ip_address
    . You can now avoid the password when you log in to the new server using the SSH
    key.Securing SSHOnce you do this, you need to make the following changes:Step
    One : Remove the password authentication for the SSH protocolStep Two : Do not
    allow users to access the root account remotelyStep Three : You also need to restrict
    access to IPv6 and IPv4To do this, you need to make changes to the SSH configuration
    file. When you open the file, you will find the following lines of code:PasswordAuthentication
    yesPermitRootLogin yesYou need to change it, so the lines look at follows:PasswordAuthentication
    noPermitRootLogin noYou then need to restrict which IP the SSH service uses –
    either IPv4 or IPv6\. You can do this by making changes to the AddressFamily option
    in the configuration file. If you want to change it, so it uses only IPv4, make
    the following change:AddressFamily inetIt is only when you restart the SSH service
    that your changes will reflect on your server. Bear in mind that you should have
    two active server connections before you restart the SSH server. When you have
    an extra connection, you can fix any issue that may arise in case the restart
    does not go as planned. If you use Ubuntu, you can run the following command:
    $ sudo service sshd restart . If you use any Linux distros which has a Systemd
    configuration, run the following command: $ sudo systemctl restart sshd .Creating
    a FirewallIn the previous chapter, we looked at how you can install, enable and
    configure a firewall on your system, so it allows only the network traffic you
    allow to access the server. You can also use an uncomplicated firewall on your
    server if you need to, depending on how well you code. If you cannot code, use
    the uncomplicated firewall. You can install it on your system using the following
    command: $ sudo apt install ufw .The uncomplicated firewall, by default, will
    deny any incoming connections and allow everything to go out of the network. This
    means all the tools and applications on your system or server can connect to the
    Internet, but if anything external tries to connect to the server, it will not
    allow it. You need to ensure you can access HTTPS, HTTP, and SSH protocols on
    your server using the following commands:$ sudo ufw allow ssh$ sudo ufw allow
    http$ sudo ufw allow httpsAfter you do this, you should enable the uncomplicated
    firewall using the following command: $ sudo ufw enable . You also need to check
    which services and applications are allowed and denied by the uncomplicated firewall:
    $ sudo ufw status . If you do not want to use the uncomplicated firewall, you
    should type the following command: $ sudo ufw disable . Alternatively, you can
    use the firewall interface we discussed in the previous chapter, as well.Removing
    Unused Network ServicesEvery Linux operating system has a server that has applications
    and servers that work with the network. You need to use most of these applications
    and servers, but you can get rid of some. Using the command ss, you can see the
    network services and applications being used on your Linux servers.$ sudo ss -atpuThe
    output of this command will differ depending on the distros you are using on your
    system. The following is an example of the output you may see. The output shows
    that the Ngnix (ngnix) and SSH (sshd_ services are the only active services. These
    are listening to every activity on the server and are waiting to connect to another
    server.tcp LISTEN 0 128 *:http *:* users:(("nginx",pid=22563,fd=7))tcp LISTEN
    0 128 *:ssh *:* users:(("sshd",pid=685,fd=3))The process of removing an unused
    or dormant application or service will be different depending on the type of distros
    you are using. It also depends on the package manager on the operating system.
    If you use Ubuntu or Debian, you need to run the following command: $ sudo apt
    purge <service_name> . On CentOS or Red Hat systems, you need to run the command
    $ sudo yum remove <service_name> . If you run the ss -atup one more time, you
    can determine if the unused or dormant services are no longer running and are
    uninstalled on your operating system.In this chapter, we looked at tips you need
    to keep in mind when it comes to hardening your Linux server without using a firewall.
    You can add additional security layers to the server depending on how you and
    your team use the system. Some of these layers include intrusion detection software,
    access control and management, two-factor authentication, individual application
    configuration, and more.Chapter Five: Password Encryption Methods in LinuxSince
    passwords are the main security mechanism used these days, it is important to
    ensure that every user on the server or system has a difficult and secure password.
    Linux distributions come with password programs that ensure a user’s password
    is strong. You can also use other encryption software available in the market
    if you want to add another layer of protection to the passwords stored in the
    server. You need to ensure the programs used to protect passwords are updated
    constantly.You need to use encryption software since it is necessary now more
    than ever. There are different methods you can use to encrypt data, and every
    method has its own characteristics. We will discuss methods in the latter part
    of the chapter. Since Linux distributions use a one-way password encryption method,
    no user can learn another user’s password. The method used is called Data Encryption
    Standard (DES).The passwords, once encrypted, are stored in a file on the server.
    If you do not use shadow passwords, the passwords are stored in the ‘/etc/passwd
    ’ file. Otherwise, they are stored in the ‘/etc/shadow ’ file. When a user logs
    into the server or network, the password he enters will be encrypted and checked
    against the file where his password is stored. If the passwords match, the user
    can enter the system. Otherwise, his access is denied. He is given a number of
    attempts depending on what has been keyed into the server. The data encryption
    algorithm or standard works as a two-way algorithm that allows users to encode
    and decode any message by using the right keys. Most Linux distributions only
    use a one-way algorithm, which means no user can reverse the encryption to identify
    the password.You can use different methods, such as brute force attacks or password
    injections, to guess a user’s password unless the password is strong. Using PAM
    modules, a user can encrypt his password using different routines in the module.
    If you are still unsure of the password being used, you can use “Crack” to assess
    your password''s strength and the passwords of every other user on the system.
    Experts recommend that users run the “Crack” program on their server as often
    as possible to identify any insecure passwords. Only when you do this can you
    determine the strength of the passwords in your system.Pretty Good Privacy (PGP)
    and Public-Key Cryptography  If you use public-key cryptography, there will be
    separate keys used to encrypt and decrypt the information passed through the server.
    Traditional forms of cryptography use one key to encrypt and decrypt information,
    and this key should be available to both parties. It is assumed that the key is
    transferred carefully between the users. The public-key cryptography method uses
    two different keys to prevent the loss of the key used to decrypt information
    during the transfer. A public key is available for anybody who performs the encryption.
    The user, however, must ensure the decryption key used by them is kept private.
    They should not share this key with anybody over the network.PGP is another privacy
    option you can use to protect the data on your system and server. If you choose
    to use this, ensure you have the version applicable and allowed in your country.
    There are some export restrictions placed by the US government. Therefore, you
    cannot use strong encryptions when you transfer any information from outside the
    country.S/MIME, SSL and S-HTTPMost users are unaware of the differences between
    these forms of encryption and security protocols. They also do not know how they
    can be used. In this section, we will go through each protocol to know how to
    use them to secure your network and server.S/MIMES/MIME or Secure Multipurpose
    Internet Mail Extension is a standard encryption protocol. This is used to encrypt
    all messages passed through the Internet, especially electronic email. S/MIME
    is an open standard, and this was developed by three programmers - Ron Rivest,
    Adi Shamir, and Leonard Adleman or RSA. Therefore, you will see it used in Linux
    quite often.SSLSSL or Secure Sockets Layer is an encryption method used often
    in Linux. It was developed to provide security when moving data across the Internet
    and was programmed by Netscape. SSL also uses different encryption protocols and
    ensures the client and server is authenticated. The protocol will operate at the
    transport layer. It will also create a secure encrypted channel within which the
    data is passed. This makes it easy for you to encrypt the data passed through
    the connection. This encryption method is used when you visit a secure website.
    For example, you may want to access an online document that is secured. To do
    this, you can use the communicator. On using this method, the SSL will create
    a secure communication network with the communicator using different encryption
    software.S-HTTPS-HTTP is another Internet protocol that is used to provide security
    when you pass data through the Internet. This protocol was first designed to provide
    confidentiality, integrity, and authentication when data is passed across the
    network. It also supports cryptographic algorithms and the use of multiple key-management
    systems through the option of negotiating between the different parties communicating
    over the Internet. This protocol is limited to the use of specific encryption
    software, and you can implement it to ensure every individual only accesses secure
    information.Linux IPSEC ImplementationAlong with Cryptographic IP Encapsulation
    (CIPE) and other forms of data encryption, there are different Internet Protocol
    Security (IPSEC) methods used in Linux. The Internet Engineering Task Force developed
    the IPSEC methods and tools to ensure the data passed between IP networks was
    safe. These methods and tools encrypt the data using different cryptographic programs.
    You can also use these methods to manage access control, confidentiality, integrity,
    and authentication.The Linux FreeS or WAN IPSEC is a free implementation of IPSEC
    which can be used on almost any system. This service allows you to build a secure
    tunnel even when you use untrusted networks or connections. The IPSEC gateway
    machine will encrypt all the information passing through the untrusted network.
    The machine also decrypts the information at the destination. The IPSEC gateway
    machine led to the development and use of Virtual Private Networks or VPNs to
    ensure there is a secure network used by machines, especially if they are connected
    to the same server or network from different locations and devices.Secure Telnet
    (stelnet) and Secure Shell (ssh)ssh and stelnet are a collection or suite of programs
    that enable a user to log in to the server or system remotely. These programs
    use an encrypted connection which allows them to log in safely.Another suite of
    programs called openssh is used as a replacement for rcp, rlogin, and rsh. This
    is a secure alternative to these programs. This suite encrypts the communication
    or data passed between hosts through public-key cryptography. It also can be used
    to authenticate users on the server or system. This program can also be used by
    users to log in to the server remotely. Once they are logged in, users can copy
    the data between hosts and prevent DNS spoofing, man-in-the-middle, and other
    hacks. The suite compresses the data passed between users and secures the data
    passed between the connection.SSLeay is another SSL protocol that has many features
    like stelnet. It was developed as part of Netscape’s SSL protocol. It can be used
    on numerous databases and algorithms, including IDEA, DES, and Blowfish.Pluggable
    Authentication Modules or PAMNew versions of Red Hat Linux and Debian Linux distributions
    use a unified authentication mechanism to move data between networks and other
    logical connections. This is termed as PAM or Pluggable Authentication Modules.
    These modules allow users to change their authentication methods and requirements
    as and when they need to. They can also use these modules to encapsulate any local
    authentication methods used without having to recompile the information or binaries.
    The following are functions you can perform using PAM:'
