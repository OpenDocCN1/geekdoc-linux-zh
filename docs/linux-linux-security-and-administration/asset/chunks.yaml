    1. **Retry**: 此参数定义了用户可以输入错误密码的次数。

    2. **Minlen**: 此参数定义了每个密码应具有的最小长度。

    3. **Difok**: 此参数用于检查当前密码与之前的密码相比时，重用的字符数量。

    4. **Dcredit**: 这表示你的密码中需要包含数字。

    5. **Ucredit**: 这定义了大写字母的数量。

    6. **Lcredit**: 这定义了小写字母的数量。


    你可以更新这些设置并保存更新后的设置。你需要理解，这些策略将适用于服务器上的所有用户，管理员用户除外。后者负责维护 root 密码的强度。


    ## 限制 SSH 访问


    你可以使用 `OpenSSH` 服务器根据用户所属的组来限制连接到服务器的连接数。这是一项非常有用的备用技术，特别是当你有很多用户，且其中某些人不应该远程访问你的服务器时。你也可以通过此为你的服务器增加更多安全性。例如，当你运行
    Web 服务时，你可能不希望每个人都使用同一台服务器访问该服务。


    要做到这一点，你需要创建新的用户组。为组使用一个恰当的名称。在接下来的命令中，我们将创建一个名为 `sshusers` 的用户组：

    ```bash

    sudo groupadd sshusers

    ```


    如果你想成为该组的一员，可以使用命令在组名后添加你的用户名：

    ```bash

    sudo gpasswd -a <username> sshusers

    ```


    如果你想检查谁被添加到了组中，可以使用命令：

    ```bash

    groups <username>

    ```

    该命令的输出将向你显示用户名所属的不同组。你也可以在列表中为同一个用户包含另一个用户组。列表中还会包含一个与用户名同名的用户名。


    上述命令的输出为：

    ```

    user: user sudo sshusers

    ```


    完成此后，你就可以指定你想要为 `OpenSSH` 使用的组。要做到这一点，你需要使用编辑器打开配置文件。如果你的系统中安装了 `nano`，你可以使用命令：

    ```bash

    sudo nano /etc/ssh/sshd_config

    ```

    否则，你可以使用命令：

    ```bash

    sudo vi /etc/ssh/sshd_config

    ```


    在配置文件的末尾，你需要添加以下行：

    ```bash

    AllowGroups sshusers

    ```

    确保你选择的配置选项前面没有使用井号符号注释。保存文件并退出编辑器。现在，重启 SSH 服务器，如果你使用的是 Debian 或 Ubuntu 服务器，使用此命令：

    ```bash

    sudo service ssh restart

    ```

    对于 Red Hat 和 CentOS 变体，可以使用此命令执行相同的操作：

    ```bash

    sudo systemctl restart sshd

    ```


    使用新配置后，不属于特定组的用户将被拒绝通过 `SSH` 访问服务器。他们的密码可能输入正确，但他们不会获得访问权限。这减少了人们通过暴力破解破解服务器的概率。这种方法是保护你正在使用的
    Linux 服务器简单的方法。


    ## 理解账户权限


    作为一名 Linux 安全专业人员或系统管理员，你需要管理系统用户及其活动。你还需要使用不同的工具来限制用户在系统上可以执行的操作。重要的一点是，用户可能会犯错。这些错误可以是任何情况，包括给一个
    Linux 新手用户分配管理员权限、使用 `root` 权限在系统上运行应用程序或脚本，或者在你的系统中留下漏洞让黑客能够访问。


    由于你承担着责任，你需要尽尽努力确保用户不在系统上执行任何他们不应该执行的活动。你可能甚至不想清理这些烂摊子。


    你的主要目标应该是控制用户在访问 Linux 服务器时可以做什么和不能做什么。Linux 系统上的用户需要一个账户来访问系统。当用户在操作系统、数据或应用程序上执行任何活动时，可以直接访问这些账户。每个系统都需要特定的账户才能正常运行。应用程序也需要账户来连接服务器。


    你可以通过多种方法和使用不同的工具来管理分配给用户的权限。管理用户访问和权限的最佳方法是使用特权访问管理（PAM）工具，因为这些工具允许你集中管理活动。


    在本节中，我们将考虑在管理 Linux 账户和权限时，你需要记住的九项重要实践。务必记住，这些并不是保护账户的唯一方法。新的方法不断涌现，你可以根据你维护的系统类型学习更多关于它们的信息。


    ## 管理 Linux 用户账户


    在 Linux 上创建账户是很容易的，我们在上一节中已经看到了你可以执行此操作的命令。但要删除或禁用你不再需要的账户就变得困难了。如果不删除这些账户，它们将继续保持激活状态，可能会导致进一步的问题。每个
    Linux 系统都需要一个用户可以使用来访问服务器并在操作系统或所存储的数据上执行任何活动的账户。系统需要账户才能正常运行。应用程序也需要账户来将其连接到服务器。


    大多数人认为账户管理只围绕管理用户账户展开。他们并不担心功能性、系统或应用程序账户。这为你的服务器风险管理留下了很多漏洞。


    ## 减少权限


    当涉及特权账户时，你需要限制这些用户的访问和权利，以确保他们只有执行所需活动的权限，而不再更多。确保用户只做他们被要求做的事情是非常。如果你给用户提供了超过他们所需的权限，将很难控制用户能做什么。在分配权限时，你需要考虑以下因素：


    1. 系统管理员需要使用 `root` 账户吗？

    2. 系统管理员需要运行只有 `root` 账户才能运行的命令吗？

    3. 数据库管理员需要访问 `root` 账户吗？


    ## 管理密码


    你可能已经实施并强制执行密码策略，以及在设置策略时需要遵守的参数。尽管如此，目标应该是减少系统中所使用的密码数量。在某些地方和时候你仍然需要使用密码。如果你在系统中使用密码，必须找到一种管理方法。


    在管理系统密码时，需要记住以下几：


    1. 确保经常更改密码

    2. 防止使用旧密码

    3. 评估系统中所密码的复杂度


