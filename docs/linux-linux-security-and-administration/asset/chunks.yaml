    # 1. 你正在使用的 Linux 发行版可能需要特定类型的操作系统

    # 2. 你的操作系统中可能缺少某些组件

    '
- fmt: '

    You can fix this easily by accessing the settings on your virtual machine. This
    is where you can work with the virtual machine’s hardware and tweak the settings
    in ways that are beyond the HDD. You can make changes to the network adapter configuration,
    memory, processors, and more.


    You need to look at the processor screen before anything else. You will find a
    reference to the virtualization engine. This will work automatically when you
    install the virtual machine in your system. If you want to troubleshoot your processor
    when there are issues, you need to set the `AMD-V` or `Intel VT-x`.


    The memory screen on your virtual desktop settings will help you address memory
    performances. Your virtual machine will have the details of the `RAM` you need
    to use. It will tell you about the settings you need to maintain on your physical
    and virtual machines. It is recommended for you to stick to these settings. If
    you reduce the memory size below or higher than the recommended size, you may
    either create a problem or slow your system. This will mean your system cannot
    function the way it should.


    You then need to spend time on the display settings. You can stick to the default
    settings if you want, but you can play around with the 3D toggle acceleration
    if there is an issue. You can set up different monitors differently depending
    on what you would like to use them for. It is important to note that some modes
    you set up will clash with the different desktops you use.


    If you are happy with the changes, confirm them and click on the play button to
    start your virtual machine.


    ### Download and Install Tools

    Now that you have downloaded your virtual machine, you should reboot it. You will
    be asked to look at different `VMware tools` you can download and install at this
    stage. All you need to do is to agree to what the wizard says and let the tools
    install on your virtual machine. These tools will improve your virtual machine’s
    performance, enabling you to share folders between the guest and host machines,
    the virtual and physical machine, respectively.


    ### Installing Linux on VMware

    When you launch your virtual machine, the `ISO` boots directly into your live
    environment, this version of Linux is only temporary and will not reside in your
    system memory or boot media when you turn off the device. If you want to use the
    environment the way it should be used, you should use the virtual machine''s install
    option.


    At this point, the installation wizard will continue to install the operating
    system on the actual machine. You need to follow the installation wizard steps,
    create an account, and set the other options when you are prompted to do this.
    When the installation is complete, you can use the Linux virtual machine and use
    the guest operating system. The process is this simple.


    ### Running Linux on a Virtual Machine

    Now that you have the virtual machine launched on your system, you can run the
    distros you want to use on the virtual machine using the Play button on your system.
    If you are looking for software to install, you can choose the preinstalled applications
    which come as part of your Linux distros. You can also choose to download different
    apps if you want to.


    If you want to access the Linux terminal through your system, you can do this
    without a `VMware workstation`.


    ### Installing a Linux Distro on a Windows Virtual Machine

    The easiest way to access Linux on your system is through a virtual machine if
    you use a Windows operating system. The workstation player from `VMware` has the
    best tools to help you do this. You can install Linux easily on your `VMware workstation`.
    Let us quickly go through the steps again:


    - **Step One**: You need to download the `VMware workstation player`. It is recommended
    that you download the latest version.

    - **Step Two**: Install the workstation player and reboot.

    - **Step Three**: Configure and create the virtual machine.

    - **Step Four**: Install the Linux distros of your choice.

    - **Step Five**: Reboot the virtual machine and use the operating system


    The process is this simple, and you do not have to stick to one system alone.
    You can choose from the list of Linux distros mentioned above, and you can install
    all of them on your workstation.


    ### Chapter Two: Securing User Accounts on Linux


    #### Don’t Login Using a Root Account

    The `root` user on your Linux operating system is like the administrator on Windows.
    There are situations where you may want to log in to the administrator account
    on Windows. You should never log in to Linux using the root account. Microsoft
    has worked on improving the security practices on Windows using user control (`UAC`).
    Linux does not have any such tools readily available so you should avoid using
    the root user.


    #### Using Sudo Accounts

    Users need to avoid using the root account to access the operating system. `Ubuntu`
    gives `sudo` access to different users. `Ubuntu` locks the root account, so any
    user cannot log in to the root account without going out of his way to enable
    the root account and obtain the password. Earlier versions of Linux distributions
    allowed users to access the root account through the graphical login screen. They
    can get to the root desktop. Many applications may not run as root while others
    may throw errors. If you are moving from Windows to Linux, you may want to log
    in to the operating system using root. You may think this is different from using
    administrator account on Windows. This is a terrible thing to do since it endangers
    your system. When you use `sudo` accounts on `Ubuntu`, you get root privileges.
    If you use `su`, you only access the root shell to run the command you may need
    before you come out of the root shell. Through `sudo`, you can enforce the right
    security practices in your system. You can access and run application as root
    user only when you are in the root shell.


    #### Reducing the Damage

    When you access the operating system using your personal account, the system will
    ensure that none of the programs you run on the hard drive. The programs you run
    using your personal account only make changes to your home folder. You cannot
    modify any system file without gaining access to the root account. This is an
    easy way to maintain the security of your computer. Let us assume you use `Chrome`
    as your default browsing application. If there is a vulnerability in `Chrome`,
    and you run the operating system using a root account, you will leave your system
    open to malware and other web pages. Malware can be pushed into your system through
    different web pages, and it can be used to read various files on your system including
    those stored on personal folders. They can also compromise system functions. If
    you are logged into your system using a limited user account, the malicious web
    page can still send malware, but it cannot replace any commands. The malware will
    only damage the information on your account folder. This can lead to problems
    but it is better than having your entire system compromised. Using a limited access
    account will protect your system against buggy and malicious applications. For
    instance, you may have an application that has a bug that deletes the files it
    can access. So, when you run it, the application removes all files from your account
    folder. This is definitely not good for you but you can restore the files easily
    if you have a backup. If the application can access the root account, it can delete
    every file on your hard drive. This means you need to reinstall the full operating
    system again on your computer.


    #### Fine-Grained Permissions

    Older distributions of Linux used the `root` account to run various administration
    programs on your system. Modern distribution systems use tools like `PolicyKit`
    to differentiate the access or functions that different user accounts on Linux
    can perform. You can determine the permissions which can be defined in the application
    too. For instance, if you have a software management application on your operating
    system, you can use `PolicyKit` to ensure the application can only install and
    update your software whenever necessary. The application would only run in your
    operating system based on permissions you have set. Only the part of the different
    programs in the operating system which use this software will have elevated or
    higher permissions. Only this part can install and manage software in your operating
    system. The program you are using will not have root access which means it cannot
    create a security hole or vulnerability in the application or system. You can
    also use `PolicyKit` to ensure only some users have the authority to make changes
    to the system administration. You can also ensure these users do not have access
    to the root account and cannot make any changes to the operating system. This
    allows you to control who can perform activities on your system without any hassle.


    You can log in to the graphical desktop using your root account in Linux. You
    can also delete every file on your hard drive or write random information or noise
    into your hard drive when your system is running. This will obliterate and ruin
    your file system. This is a terrible idea. You may know what you are doing, but
    your system is not designed to let you run the applications and tools using the
    root account. If you use the root account, you will bypass security, leaving your
    operating system open to any hacks.


    ### Managing User Account Security

    You need to maintain control over the user accounts if you want to secure the
    operating system. This section will look at how you can perform certain user account
    management functions and tasks. We will also look at how you can implement security
    measures.


    #### Adding New Users

    As mentioned earlier, you should avoid using a `root` account to perform any functions,
    especially any regular operations. If you have deployed the operating system on
    a new server or virtual machine, you will only have a root account on the server.
    This means you need to create new accounts for everybody who will access the operating
    system. If it is only you, create a username. To do this, run the command in the
    shell:

    ```bash

    adduser <username>

    ```

    You also need to create a password and enter other key information about the user,
    and you can do this using the user account.


    #### Disable Root Login

    If you want to prevent any breaches, you must disable remote access. The configuration
    file has the OpenSSH settings, and you can open it using a text editor on Ubuntu:

    ```bash

    sudo nano /etc/ssh/sshd_config

    ```

    If you use Red Hat or CentOS variants, you can use the:

    ```bash

    sudo vi /etc/ssh/sshd_config

    ```

    You can also search for authentication settings and options and change the permission
    to log in. You can do this by changing the setting to `no` using the command:

    ```text

    PermitRootLogin no

    ```

    Save the file with the commands. Once you make the updates, restart the server.
    If you use cloud servers and CentOS, you can use the command:

    ```bash

    sudo systemctl restart ssh

    ```

    On systems where you use Ubuntu, call the following command::

    ```bash

    sudo service ssh restart

    ```


    #### Password Policies in Linux

    If you allow users to access the server remotely, you need to enforce and implement
    password policies using a module in Linux called `PAM`. You can invoke this using
    `pam_cracklib.so`. You can use this module to check the passwords entered by users
    against any dictionary words. This prevents the use of weak passwords. The module
    also allows you to define any new password requirements, such as complexity and
    length. On Debian and Ubuntu systems, you can install this module using:

    ```bash

    sudo apt-get install libpam-cracklib

    ```

    Red Hat and CentOS variants come with this module installed. Once you have the
    distros installed, you need to open and edit the configuration file. If you use
    Debian or Ubuntu, open the file in a text editor:

    ```bash

    sudo nano /etc/pam.d/common-password

    ```

    The file will be stored with a new name on CentOS. Use the command:

    ```bash

    sudo vi /etc/pam.d/system-auth

    ```

    When you install the module on Debian or Ubuntu, the password is configured on
    the server, and the checks are performed. Therefore, you need to find a setting
    corresponding to this and change it, so it looks like the following:

    ```text

    password required pam_cracklib.so retry=3 minlen=8 difok=3 dcredit=1 ucredit=1
    lcredit=1

    ```

    If you use CentOS, you may need to add the entire line above directly to the configuration
    file, but this is dependent on the version you are using.

