    - [Conclusion](#part0017.xhtml_a1F)\n- [References](#part0018.xhtml)\n\n## Introduction\n\
    If you are new to using Linux, it will be difficult for you to find the right\
    \ information. This book has all the information you need to help you install\
    \ the operating system and show you how you can use it either on your system or\
    \ a virtual system. The book also has information about how you need to configure\
    \ user access and other information to maintain the network and server's security\
    \ on the Linux system. You do not have to know anything about Linux before you\
    \ use it since the information in this book will guide you every step of the way!\n\
    \nThank you for purchasing the book. I hope you learn more about Linux and how\
    \ you can protect the information in your files and folders.\n\n## Chapter One:\
    \ Using Linux on Virtual Machines\nHave you wanted to use Linux but did not want\
    \ to use it on your system? Your system may have trouble if you use dual-booting,\
    \ and the best thing to do is to use Linux on a virtual machine. It is easy for\
    \ you to use Linux on a virtual machine if you use Windows. The procedure is straightforward.\
    \ In this chapter, we will look at installing and using Linux on a virtual machine,\
    \ a VMware Workstation specifically.\n\nIf you want to use a virtual machine,\
    \ you need to find a PC, which allows you to use virtualization. You may have\
    \ tried to install Linux on your system using a CD, but you may not be sure about\
    \ dual booting. You should install the Linux operating system on your PC but using\
    \ a virtual machine. Virtual machines are environments that replicate the conditions\
    \ of the hardware on your device. The environment mirrors everything in your personal\
    \ computer and is limited only by the system's different components. This means\
    \ you cannot expect to have a four-core CPU on a processor which only has two\
    \ cores. You can achieve virtualization on multiple systems, and the result of\
    \ this will be superior on computers that have CPUs that support visualization.\n\
    \nYou can use different virtual machines to install the Linux operating system\
    \ on your computer. VMware is one of the leading manufacturers of virtual machines\
    \ and applications. In this chapter, we will look at how you can install Linux\
    \ OS in Windows using a workstation player designed by VMware.\n\n### Installing\
    \ a Workstation Player\nIf you want the workstation player, you need to download\
    \ the latest version from the VMware website. They constantly upgrade their workstation\
    \ player, and for example, we will use the workstation player 15 MB. These workstation\
    \ players are available for home, non-commercial, and personal use. Non-profit\
    \ organizations and students can use this version since they do not have to shell\
    \ out any money. After you download, click on the installer and follow the enrollment\
    \ steps to set up your virtual.\n\n### Choose the Correct Distro\nYou should read\
    \ about the different Linux distributions available to you and choose the one\
    \ that works best for you. Some Linux distributions work best on virtual machines,\
    \ while others cannot work on them. 64-bit and 32-bit versions of Linux work well\
    \ on machines. If you do not know which distro you need, choose any from the list\
    \ below:\n\n### Linux Distros\nSince there are many options available, you may\
    \ find it hard to choose the right distro for your system. How do you know that\
    \ is the best one you should use for your system? What if you want to use a distro\
    \ that uses the same structure as macOS? In this section, we will look at the\
    \ different distros available for you. These distros have been used actively by\
    \ individuals over the last few years. You also check if the distro you use is\
    \ updated regularly using security patches.\n\n### Linux Distros\nRed Hat Enterprise\
    \ This distro is like Fedora, but it is used commercially. This distro was designed\
    \ for enterprise customers. You can use any of the addons and variants. If you\
    \ want to be an administrator, you need to be certified.\n\nSUSE Linux Enterprise\
    \ This Linux distro version is designed for an enterprise and can be used by businesses.\
    \ For this reason this variant is easy for one to use with different office programs.\
    \ You can run this distro on various devices, and it can be used even on critical\
    \ systems. Many versions of this distro are also available on the Linux website.\n\
    \n### Gaming Distros\nSparkyLinux Game Over Edition SparkyLinux has various versions,\
    \ but this version which focuses on gaming, is the most used. This gaming version\
    \ comes with various pre-installed games, an LXDE desktop, PlayOnLinux, and Wine.\
    \ There are numerous premium and free games available on this distro which you\
    \ can use easily. SteamOS Many gamers have started using Linux as their operating\
    \ system since it comes with a Steam client. It is easier to install the SteamOS\
    \ version of Linux if you are a gamer. One of the best Linux distros you can use\
    \ for gaming is SteamOS, and this is optimized to perform well in any game and\
    \ comes with in-built sound drivers, proprietary graphics, and a Steam client.\n\
    \n### GeneralPurpose Linux Distros\nUbuntu is a Debian-based operating system,\
    \ and it uses GNOME as the desktop environment. You cannot update this environment\
    \ since it is used as the default. This Linux distro has regular patch updates,\
    \ and improves with every new release. The latest versions of this OS are designed\
    \ for hybrids, desktops, and laptops. Therefore, if you are moving from Windows\
    \ to macOS, you need to use the Ubuntu OS. openSUSE This distro is a general OS\
    \ built by Linux for various projects, but it is primarily used for openSUSE projects.\
    \ This distro is used by both beginners and by experienced Linux users. This distro\
    \ comes with an administration program called YaST which controls and monitors\
    \ the installation, package management, and other functions. Fedora This Linux\
    \ distro was developed by IBM-owned Red Hat and uses a default GNOME desktop environment.\
    \ You can switch to LXDE, XForms Common Environment (Xfce), Cinnamon, KDE and\
    \ MATE, and other desktop environments. Some variations of Fedora, like Fedora\
    \ spins, can be used by people with specific requirements. Debian is an old Linux\
    \ distro and is the best version compared to other Linux distros. This also comes\
    \ with a default GNOME desktop environment, but it can also be used in the FreeBSD\
    \ kernel. Developers are working on making this compatible with other kernels\
    \ like the Hurd. Some Linux distros such as Raspbian and Ubuntu, are based on\
    \ Debian. Slackware Linux is another distro that has been built specifically for\
    \ simplicity and security. It is a distro that is Unix-like and is used for server\
    \ and file management since it has web, FTP, and email servers available for use.\
    \ If you have never tried managing a server or using a Unix server, you can use\
    \ this server as a live disc. You can also use this as a virtual machine to learn\
    \ how to use Linux distros better. Mageia This Linux distro was developed by a\
    \ non-profit fork community and had various features that a major desktop environment\
    \ should have. The default desktop used by this distro is GNOME and KDE. SparkyLinux\
    \ This version of Linux evolved when the developers were testing the Debian version\
    \ of Linux. This edition of Linux has a customized lightweight LXDE desktop. You\
    \ can also use this with other customized desktops. Gentoo Linux You can use this\
    \ distros version on any desktop. It is compatible with multiple requirements,\
    \ and its performance and versatility make it one of the best versions of Linux\
    \ OS. Gentoo Linux has Portage, that is an advanced package management system.\
    \ Since Gentoo can be used on different systems, you gain complete access to your\
    \ system and control it the way you need to. Community Operating System or CentOS\
    \ is built by the Red Hat community and is a rebuild of Red Hat Enterprise. This\
    \ is a free version. If you do not want to work with different distros, you can\
    \ use this.\n\n### Lightweight Linux Distros\nLinux lite is a lightweight version\
    \ that has a very minimal footprint. Linux lite distros are based on Ubuntu LTS\
    \ and have a very minimal footprint. This distro uses a simple Windows-style menu\
    \ which makes any user feel at home. This distro has a small resource, which you\
    \ can use it on PC with 512 MB RAM and 700 MHz CPU. It is for this reason this\
    \ is called light. Lubuntu is another lightweight version of Linux based on Ubuntu,\
    \ and is perfect to use on laptops or desktops. It uses a lightweight environment\
    \ and has in-built applications which are designed for speed and energy-efficiency.\
    \ If you want to maximize- maintain your device’s life, you should definitely\
    \ pick this. Xubuntu is a derivative of the Ubuntu which uses Xfce desktop which\
    \ is lightweight and elegant. You can use it on different notebooks and laptops.\
    \ If you have devices with low specs, you can use this distro. Puppy Linux uses\
    \ a small distribution that you can run using RAM. This version is great for older\
    \ laptops or computers, and you can use it without hard drives. This tool can\
    \ remove malware. Manjaro Linux is an easy-to-use, fast and lightweight distribution\
    \ which mirrors the Arch distro. This version uses the benefits of Arch Linux\
    \ and is more accessible and user-friendly. The default desktop used is Xfce,\
    \ but you can switch to other options depending on what you are comfortable using.\
    \ Arch Linux this version of Linux is a distribution developed with user experience\
    \ in mind. The Arch distribution is aimed at keeping things simple and easy. It\
    \ is updated regularly through patches. Arch has Pacman, a custom-made package\
    \ manager used in Linux making it easy for users to build, share and modify packages.\
    \ This distro is recommended if you are a beginner, since it requires some hands-on\
    \ experience with the operating system. NuTy do you want to customize the system\
    \ you currently use? If yes, you should use this distro. NuTy allows you to ship\
    \ bloatware-free and barebones across the OS. Bodhi is an Ubuntu-based operating\
    \ system, and it comes with a beautiful and lightweight desktop. Bodhi can be\
    \ customized, and it comes with applications and themes. You can use these to\
    \ expand on the basic operating system.\n\n Multimedia Linux Distros\nFedora Design\
    \ Suite you can save time on artistic applications and tools by using Fedora,\
    \ a spin-off of the Fedora design suite. This design suite comes with GIMP and\
    \ Inkscape. It also comes with different applications and tools which can be used\
    \ for art and illustration. This is a distro focused on DTP. Ubuntu Studio The\
    \ Ubuntu studio was released in 2007 and is the default choice used by Linux users.\
    \ If you are creative, you can use this distro to work on your talents. This distro\
    \ also comes with an Xfce desktop environment and has low kernel latency. Therefore,\
    \ everything about this distro is geared towards the production of media. You\
    \ can use different distros for this as well, but Ubuntu studio is the best for\
    \ photographers, music producers, designers, and other users.\n\n Linux Distros\
    \ for Beginners\nEndless OS if you just started using Linux, you may want to keep\
    \ everything simple. The best Linux distros to use for this is the endless OS.\
    \ Families often use this since it comes with multiple applications. It is best\
    \ to use this OS if you do not have an Internet connection at home. You can also\
    \ use this if you are unsure about which application you need to use on your Linux\
    \ OS. This is not an ideal approach for you if you are an experienced user. If\
    \ you are new to using open-source operating systems, you can use this OS to obtain\
    \ more information about working with Linux. Linux Mint is a modern and elegant\
    \ distro that is powerful and easy to use. This distro is based on Ubuntu and\
    \ is reliable. It was developed with the idea of a software manager in mind. This\
    \ distro is one of the top-rated Linux operating systems since 2011. Many macOS\
    \ and Windows refugees choose to use this as their new virtual desktop. Linux\
    \ Mint also comes with various desktop options. You can use the Cinnamon desktop,\
    \ that is the default for Linux Mint. Alternatively, you can use KDE, Xfce, or\
    \ Mate. You can also use a Debian and Linux Mint combination if you are a beginner.\
    \ Deepin is another Ubuntu-based distro, and it comes with a stylish DDE or Deepin\
    \ Desktop Environment. This distro is great for new Linux users. It is simple\
    \ and intuitive and features a variety of system settings. Deepin is inspired\
    \ and developed based on macOS. This distro also has a software center that is\
    \ easy to use. Pop!OS is another Ubuntu-based operating system that was manufactured\
    \ by System76. It uses a GNOME desktop as the default environment and has a theme\
    \ that you can change. This distro also comes with its own application, making\
    \ it easy to use. Some applications may not match the brand, but it is easy to\
    \ use. Zorin OS if you are new to Linux, you can use Zorin OS since it is designed\
    \ for beginners. This distro is based on Ubuntu and has several applications,\
    \ which makes it easy to use. You can also use it on your device. Raspberry Pi\
    \ Linux Raspberry Pi uses an ARM processor instead of AMD or Intel 32-bit or 64-bit\
    \ CPUs. It is for this reason the Raspberry Pi Foundation worked on developing\
    \ specialist distros. Some of them are Pi-friendly versions of existing operating\
    \ systems. Raspbian Stretch for Raspbian Pi, the default operating system used\
    \ is the Debian-based Raspbian Stretch. The Raspberry Pi Foundation developed\
    \ the latter. Raspbian Stretch is an ARM distro and has multiple programming tools\
    \ and applications. A beginner can use these tools to learn more about coding\
    \ on Linux. Raspbian also has LXDE-based PIXEL environments, making this distro\
    \ the best option, especially if you are using Raspberry Pi. Kano OS is like Raspbian\
    \ but it focuses more on coding. The operating system is aimed at helping children\
    \ learn how to code. The system comes with an interactive user interface, and\
    \ this gives your children the tools he needs to code without much fuss. DietPi\
    \ do you work on projects where you need to use barebones operating systems? If\
    \ yes, you should choose this is a very light Debian-based operating system and\
    \ can be used on all models of Raspberry Pi. You can also use it on single-board\
    \ computers if you have one. Raspbian Stretch Lite is an option that most Pi users\
    \ choose, especially if they use applications with a small footprint. The difference\
    \ between DietPi and other Raspbian Pi operating systems is the amount of space\
    \ you need to run the OS on your system. DietPi only needs 1 GB storage, while\
    \ others need 2 GB or more.\n\n Linux Distros for Security and Recovery\nQubes\
    \ 3.2 de-I am sure you know Linux is a very secure operating system, and it is\
    \ better than Windows, too. The most secure Linux distros are Qubes. The current\
    \ version is 3.2, and this is a better upgrade compared to the earlier versions\
    \ of Qubes. Edward Snowden stated that Qubes is a reasonably secure operating\
    \ system, and this testimonial is enough for you to use this distro in your virtual\
    \ machine. If you are a security-conscious user, you need to choose Qubes. This\
    \ distro is known for freedom, security, and various privacy features. It also\
    \ comes with sandboxes that allow you to separate the application and hardware\
    \ when you perform different functions. Kali Linux was earlier known as BackTrack.\
    \ It is a penetration testing Linux distro that is used often by the online security\
    \ community. This is a Debian-based distro which makes it easier for you to perform\
    \ various forensic tasks. Parted Magic this Linux distro is used to manage disk\
    \ space on your system. You can partition the hard disk and copy the information\
    \ across different servers as the OS's primary applications. Parted Magic makes\
    \ it easier for you to secure erasing and recovery of data. GParted is a single-purpose\
    \ distribution operating system that makes it easier for you to partition hard\
    \ drives. You can do this easily using a graphical interface. A Linux user is\
    \ familiar with using standard versions of various distribution operating systems.\
    \ This is a dedicated and standalone operating system, but it can also be run\
    \ using a CD. If you want to manage the disk space on your system without booting\
    \ your computer or the operating system, you can use GParted. Tails is a Linux\
    \ distribution that revolves around security and privacy. You can use it on a\
    \ USB stick, SD card, or DVD. You can use it through different router (called\
    \ Onion Router) to maintain anonymity.\n"
