    # SELinux 模式


    - **Disabled (禁用)**：当你使用此模式时，可以禁用服务器上的 SELinux。

    - **Permissive (许可模式)**：如果你使用此模式，只有当服务器上执行未经授权的活动时，你才会收到警告或警报。它还会记录用户执行的操作。

    - **Enforcing (强制模式)**：在此模式下，SELinux 的功能不受限制，这意味着它会检查服务器安全的方方面面。


    你可以使用 `/etc/selinux/config` 文件管理这些模式。


    # 安全控制台访问


    从端到端保护 Linux 服务器至关重要，这意味着你需要保护通过控制台对服务器的访问。在设置好 BIOS 后，你需要禁用外部设备的使用，例如 USB 优盘、CD
    或 DVD。你还需要设置 BIOS 并使用 `grub` 启动加载程序密码来保护更新后的设置。


    # 限制旧密码的使用


    你可以确保用户在被提示更新密码时不再使用旧密码。你的 Linux 服务器会将旧密码保存在 `/etc/security/opasswd` 文件中。你可以使用
    PAM 模块确保服务器实现此功能。如果你不确定如何操作，请遵循以下步骤：


    1. 如果你使用 CentOS、Fedora 或 RHEL，可以打开 `/etc/pam.d/system-auth` 文件。执行此操作，请运行命令：

    ```bash

    vi /etc/pam.d/system-auth

    ```


    2. 如果你使用 Ubuntu 或 Debian，可以使用命令打开 `/etc/pam.d/common-password` 文件：

    ```bash

    vi /etc/pam.d/common-password

    ```


    3. 你需要在配置的 `auth` 部分添加以下命令：

    ```bash

    auth sufficient pam_unix.so likeauth nullok

    ```


