  trans: "\n\n这些是管理密码的基础知识。你需要将这些内容扩展到服务器上的所有密码，包括 `root`、用户、功能性账户、服务账户以及应用程序密码。\n\
    \n## 减少共享账户的使用\n作为管理员，你永远不要与服务器上的另一个用户共享账户。管理员需要拥有独立的账户，以便对他们执行的所有操作进行问责和可追溯性管理。你需要跟踪每个用户的操作。每个\
    \ Linux 系统都带有一个 `root` 账户。你服务器上的应用程序将拥有与其关联的账户，这些账户有自己的一套权限。这限制了应用程序对系统的访问权限。\n\
    \n有时，数据管理员或应用程序管理员需要在操作系统、数据服务或应用程序上执行高特权活动。你需要实施并强制执行一种系统，使用户可以在不登录特权账户的情况下访问另一个账户。这就是\
    \ `sudo` 命令，它可以用于访问操作系统。作为管理员，你可以在不允许用户共享账户的情况下扩展用户的权限。它提供了所需的问责制和可追溯性，以识别他们所执行的活动。\n\
    \n## 控制账户访问\n重要的是，要理解系统中的每一个账户并不都需要通过网络访问。你必须在整个服务器上实施并执行权限控制。只有当你这样做时，才不会有人登录错误的账户或在你的服务器上执行未经授权的活动。此外，确保每个用户都不使用\
    \ `SSH` 配置访问服务器也是重要的。服务器上并不是每个用户账户都需要从网络上的不同计算机访问服务器。你不需要允许用户从任何地方访问服务器。用户应该只访问服务器来执行分配给他们的任务。\n\
    \n## 维护日志\n记录你服务器上发生的一切是非常关重要的。你需要记录服务器上每个用户的访问、更改、补丁、权限和功能。这并不是一个详尽的列表，你也可以查看用户活动的其他方面。你和你的团队需要花时间浏览这些消息并评估所有执行的活动。这是你绝对需要做的事情。\n\
    \n你应该报告哪个用户有权执行哪些活动。你根据不同的法规需要这些信息。记录对不同账户的所有更改、权限的更改、用户的删除或添加，或用户执行的任何其他活动都是至关重要的。只有在你了解用户正在执行的活动时，你才能对你服务器的规则进行更改。\n\
    \n## 记录和管理特权活动\n了解哪个用户访问了服务器、使用了哪个主机、在哪里访问的服务器以及如何访问的是非常关重要的。了解用户的权限并分析用户对服务器做了什么甚至更为重要。你需要收集这些数据并进行分析，以查看系统上正在执行哪些活动。\n\
    \n如果你是管理员，你可以管理用户权限、活动以及他们活动的时间。这是一个强大的工具。为了了解用户在系统上正在做什么，你可以使用未分配给用户的权限运行命令。此类权限的示例包括数据库管理员或应用程序管理员。这些用户只能执行配置或维护活动。如果这些用户拥有过高的权限，可能会导致各种问题。你需要管理管理员访问，即使看起来你无法信任该管理员。这些账户应该被仔细检查，并对活动进行监控。这不是因为可以使用这些账户的人，而是因为这些账户是黑客的价值资产。\n\
    \n## 在发现可疑活动时通知或警报\n一旦你在 Linux 上实施并建立了审计和日志系统，你就设置自动化通知，以提醒你系统中使用的任何服务器上的任何可疑活动。这并不意味着你设置信号来报告任何微小的违规，而是那些可能导致你的服务器泄露的行为。你的通知和警报系统必须定义规则来停止不当行为。当你记录此类活动时，它将向你显示用户正在执行他不应该执行的功能。然后你可以利用通知来定义规则，防止这种情况再次发生。这个过程将让你更容易采取主动而非被动措施。这个过程基于“通过强制来实现检测”的概念。这个概念意味着你使用相同的规则来检测并防止任何坏行为的发生。\n\
    \n## 统一与集中\n所有的 Linux 发行版都允许你原生执行目前列出的所有操作。例如，你可以使用 `SSH` 配置用户如何访问服务器以及在何处访问。你也可以用它来定义用户使用该访问可以执行哪些活动。如果你只与一个系统和几个用户一起工作，手动执行这些是很容易的。如果你有多台服务器，就会增加你维护服务器配置所需的投入的精力。在手动更新每个用户的访问权限和用户组时，你可能会出错。\n\
    \n将权限管理和访问控制结合起来是非常重要的。如果你分开观察这两个领域，将会出错。在 Linux 安全世界中，你还需要将访问和账户控制结合起来。为了做到这一点，你需要工具来让你能够集中地管理访问控制、账户管理和权限管理领域。\n\
    \n## 第三章：使用防火墙保护服务器\n作为系统管理员，你需要学习如何为你的 Linux 服务器配置和维护防火墙。在本章中，我们将查看如何使用 `firewall-cmd`\
    \ 命令管理服务器。\n\n如果你以前工作过网络安全，你就知道防火墙是其中的重要部分。因此，作为系统管理员，学习防火墙的工作原理是非常重要的。只有当你理解防火墙如何工作时，你才能保护服务器并对你允许哪些流量进入和离开服务器做出正确选择。防火墙系统必须定义规则来停止不当行为。当你记录此类活动时，它将向你显示用户正在执行他不应该执行的功能。然后你可以利用通知来定义规则，防止这种情况再次发生。这个过程将让你更容易采取主动而非被动措施。这个过程基于“通过强制来实现检测”的概念。这个概念意味着你使用相同的规则来检测并防止任何坏行为的发生。防火墙是保护用户数据的一个小部分，但某些人会将防火墙与发生在网络末端的（内部或外部）战斗攻击混淆。与\
    \ Tron-style 战斗攻击不同，防火墙可以防止释放恶意数据包。\n\n### 端口\n你可以使用防火墙来管理流入和流出服务器的流量。防火墙中的端口指的是任何物理连接，如\
    \ `VGA` 或 `HDMI`。在防火墙方面，端口是用于连接或创建各种数据源之间路径的虚拟连接。你可以经常使用不同的端口，但我想说的是有很多不同的端口，有些端口使用的频率比其他高。这些端口约定如下：\n\
    \n- `HTTP` 使用端口 `80`\n- `HTTPS` 使用端口 `443`\n- `SSH` 使用端口 `22`\n- `FTP` 使用端口 `21`\n\
    \n当数据从一个系统移动到另一个系统时，这将决定应该使用的端口。如果协议接受数据而你不知道如何工作，你可以通过访问系统上的任何浏览器来了解它：\n\n```\n\
    curl --connect-timeout 3 \"http://example.com:80\"\n```\n```html\n<!doctype html>\n\
    <html>\n<head>\n<title>Example</title>\n</head>\n```\n\n在相同的形式中，使用不同的端口拒绝访问网站。例如，你可以添加端口号\
    \ `79`。这将拒绝访问：\n\n```bash\ncurl --connect-timeout 3 \"http://example.com:79\"\n\
    ```\n`curl: (7) Failed to connect: Network is unreachable`\n\n网络上的协议和端口之间存在关联，专家设置了这些约定。如果你需要，可以轻松更改这些设置。当人们开始使用计算机和网络时，他们害怕更改服务器中的端口，因为这可能导致攻击。现在攻击是复杂的，这意味着黑客不会通过在网络或\
    \ Web 服务器上运行端口扫描来学习任何。防火墙将查看 Web 服务器上执行的活动。\n\n### 使用 firewall-cmd 接口\n你正在使用的操作系统将为服务器提供基础设施。该接口的目标是运行防火墙。或者，你的调制解器和路由器可能自带防火墙。这将作为互联网任何网站使用的主要网关和路径。重要的是记住防火墙是预配置的，可以使用你可以更改的接口。在本节中，我们将查看你在\
    \ Linux 发行版中通过 `firewall-cmd` 接口可以使用命令。\n\n当你配置防火墙时，大多数专家会要求你在防火墙上阻塞一切。专家还建议在阻塞一切后，开放某些端口。这意味着你需要确切知道服务器需要什么以及如何操作。\n\
    \n### 阻塞一切\n如果你在一个拥有 `DNS` 缓存服务的组织工作，你需要在处理 DNS 之前解锁端口。如果你仅仅依赖 `SSH` 配置并用它远程更改服务器，你是无法阻止它的。你需要了解操作系统运行着哪些服务，并理解服务是否是组织内部。你还需要确定服务器上的不同服务之间是否存在交互。\n\
    \n对于专有软件，服务器可能会调用外部端口，而你可能不知道这些调用。如果某些应用程序对服务器上的任何严格防火墙反应糟糕，你需要使用逆向工程。你可能还需要与应用程序的支持部门交流，以了解应用程序创建的流量类型。你还需要知道应用程序为什么表现那样。对于开源软件来说，这不是常见问题。对于复杂的软件栈并非如此。大多数媒体播放器会调用互联网。它们需要使用端口来获取专辑。\n\
    \n### 创建区域 (Zone)\n所有的 Linux 发行版都允许你原生执行目前列出的所有操作。例如，你可以使用 `SSH` 配置用户如何访问服务器以及在何处访问。你也可以用它来定义用户使用该访问可以执行哪些活动。如果你只与一个系统和几个用户一起工作，手动执行这些是很容易的。如果你有多台服务器，就会增加你维护服务器配置所需的精力。在手动更新每个用户的访问权限和用户组时，你可能会出错。\n\
    \n将权限管理和访问控制结合起来是非常重要的。如果你分开观察这两个领域，将会出错。在 Linux 安全世界中，你还需要将访问和账户控制结合起来。为了做到这一点，你需要工具来让你能够集中地管理访问控制、账户管理和权限管理领域。\n\
    \n你需要使用 `--new-zone` 命令在 Web 服务器上添加一个新区域。使用 `firewall-cmd` 命令执行的任何操作仅持续到重启电脑。要使任何更改永久，你需要使用\
    \ `--permanent` 标记。\n\n```bash\nfirewall-cmd --new-zone\n```\n\n现在你已经有了新区域，可以将网络接口分配给它。在此之前，你需要使用\
    \ `ssh` 服务来访问区域。使用 `--permanent` 标记对你的服务器进行永久更改：\n\n```bash\nfirewall-cmd --add-service\
    \ ssh --permanent\n```\n\n如果你想激活 `corp` 区域并设置为默认区域，你需要使用 `--change-interface`\
    \ 选项：\n\n```bash\nfirewall-cmd --change-interface ens3 --zone corp --permanent\n\
    ```\n\n当你将 `corp` 区域设置为默认区域时，使用的命令将应用于服务器，除非你指定其他区域。\n\n```bash\nfirewall-cmd\
    \ --set-default corp\n```\n\n你还可以查看分配到接口的区域。为了这样做，你需要使用：\n\n```bash\nfirewall-cmd\
    \ --get-active-zones\n```\n```text\ncorp: ens3\ninterfaces: ens4\n```\n\n### 设置默认区域\n\
    如果你想了解更多特定区域允许的内容，你可以运行以下命令：\n\n```bash\nfirewall-cmd --zone corp --list-all\n\
    ```\n```text\ntarget: default\nicmp-block-in: no\ninterfaces:\nsource: \nmasquerade:\
    \ no\nports: \nservices:\nrules:\n```\n\n### 移除或添加服务\n你现在阻止了除了 `SSH` 之外的所有网络访问。因此，根据使用的协议，通过防火墙允许端口是种简单且快速的方法。如果你想查看网络上可用的服务列表，可以使用以下：\n\
    \n```bash\nfirewall-cmd --get-services\n```\n```text\nRH-Satellite-6\namanda-client\n\
    amqp\namqps\napcups\naudit\nbacula\nbacula-client\nbgp\nbitcoin\nbitcoin-rpc\n\
    bitcoin-testnet\nceph\ncockpit\ndhcp\ndhcpv6\ndistcc\ndns\n```\n\n让我们考虑一种你需要运行\
    \ Web 服务器的情况。为了这样做，你需要在网络上安装它。你可以在 Debian 或 Ubuntu 上使用 `apache2`，或者在 Fedora 或\
    \ RHEL 上使用 `httpd` 包。在下面的示例中，我们将使用 `httpd` 服务：\n\n```bash\nsudo dnf install httpd\n\
    sudo systemctl --enable --now httpd\n```\n\n现在你应该从本地网络测试 Web 服务器并查看它是如何工作的。\n\n\
    ```bash\ncurl --silent localhost:80 | grep title\n```\n```html\n<title>Test Page\
    \ for Apache HTTP Server on Red Hat Linux</title>\n```\n\n你应该然后从网络连接到 Web 服务器，最好是外部的。\n\
    \n```bash\ncurl --connect-timeout 3 192.168.122.206\n```\n`curl: (28) Connection\
    \ timed out after 3001 milliseconds`\n\n### 解服务\n如果你想通过网络或防火墙允许 `HTTP` 协议的流量，你需要在\
    \ Web 服务器上包含 `HTTP` 服务。\n\n```bash\nsudo firewall-cmd --add-service http --permanent\n\
    sudo firewall-cmd --reload\n```\n\n你应该使用外部浏览器测试此包含：\n\n```bash\ncurl --silent\
    \ 192.168.122.206 | grep title\n```\n```html\n<title>Test Page for Apache HTTP\
    \ Server on Red Hat Linux</title>\n```\n\n现在你已经知道如何向你的 Web 服务器包含或添加服务了。因此，对你来说移除一个很容易。\n\
    \n```bash\nsudo firewall-cmd --remove-service http --permanent\nsudo firewall-cmd\
    \ --reload\n```\n\n### 移除和添加端口\n你可能会发现寻找预定义服务时遇到困难。与其添加服务，不如使用 `--add-port` 添加端口号。例如，如果你想在自定义区域为\
    \ `SSH` 协议使用非标准端口，你可以使用命令添加它：\n\n```bash\nsudo firewall-cmd --add-port=2222/tcp\
    \ --permanent\nsudo firewall-cmd --reload\n```\n\n移除该端口，使用 `--remove-port`：\n\n\
    ```bash\nsudo firewall-cmd --remove-port=2222/tcp --permanent\nsudo firewall-cmd\
    \ --reload\n```\n\n### 防火墙规则\n你可以使用 `firewall-cmd` 执行很多上面未列出的操作。你可以定义 ICMP 阻塞，定义向你的系统发送数据流量的源，甚至定义你想允许的服务。通过实验很容易学习。你可以在\
    \ GNOME box 中安装 Fedora 或 Red Hat Linux 来玩 `firewall-cmd` 选项。\n\n## 第四章：保护你的服务器\n\
    在上一章中，我们查看了如何使用防火墙保护服务器。我们还查看了用户账户和其他细节。在本章中，我们将查看在不使用防火墙保护服务器的不同方法。\n\n### 更新服务器\n\
    如果你以管理员身份访问服务器，你需要定期更新它。为了这样做，运行以下命令：\n\n```bash\nsudo apt-get update && sudo\
    \ apt-get upgrade\n```\n重要的是在运行升级时你是在 VPS 或虚拟机实例上，这可能会损坏服务器。所以，你需要检查是否可以在 host\
    \ 上这样做。\n\n### 创建二级用户\n你需要这样做以确保没有用户通过 `root` 账户登录服务器。如果你想减少服务器上通过 root 进行未授权访问的概率，你需要创建一个用户并赋予他们相关的权限。我们查看了如何将新用户添加到服务器中。如果你想让用户拥有特定的权限访问服务器，你需要更新配置中的这些项。\n\
    \n```bash\n/etc/init.d/sshd restart\n```\n```text\nStarting sshd: [ OK ]\n```\n\
    \n要完成这一点，你需要编辑配置文件：\n\n```bash\nsudo vi /etc/ssh/sshd_config\n```\n\n重要的是将 `#PermitRootLogin\
    \ yes` 更新为 `PermitRootLogin no`。你可以通过以下命令重启服务：\n\n```bash\nservice ssh restart\n\
    ```\n\n记住，在服务器上安装操作系统时没有 root 密码，但作为管理员，你拥有 `sudo` 权限和管理访问。\n\n### 设置 SSH 密钥\n\
    在服务器上的 `SSH` 密钥允许你安全地连接服务器。这是一个额外的步骤，以确保服务器免受未经授权的访问。你需要运行：\n\n```bash\nssh-keygen\
    \ -t rsa -C \"you@example.com\"\n```\n\n一旦你接受了默认位置，名称将添加到服务器。你现在使用以下代码将公密钥复制到\
    \ root 目录：\n\n```bash\ncd ~/.ssh\ncp id_rsa.pub authorized_keys\n```\n\n你现在可以直接通过\
    \ root 账户连接到服务器。\n\n### 检查和配置防火墙\n运行以下命令来检查和配置防火墙。你也可以使用上一章中的信息。\n\n```bash\n\
    root@server:~# ufw list\n```\n```text\nAvailable applications:\nOpenSSH\n```\n\
    ```bash\nroot@server:~# ufw status\n```\n```text\nStatus: active\nTo         \
    \                From\n--                         ------\n22/tcp             \
    \        ALLOWwhere\n8080/tcp                   ALLOWwhere\n80/tcp           \
    \          ALLOWwhere\n22/tcp (v6)                ALLOW (v6)\n8080/tcp (v6)  \
    \           ALLOW (v6)\n80/tcp (v6)                ALLOW (v6)\n```\n\n### 限制端口的使用\n\
    当你在系统上安装 Linux 时，你不必担心监听通过服务器的任何网络服务。当你启动服务器时，你可以确定管理员和 root 用户应该使用的各种端口和服务。你需要测试服务器上的开放端口。为了这样做，运行以下代码：\n\
    \n```bash\nnetstat -tulpn\n```\n```text\nActive Internet connections (only servers)\n\
    Proto Recv-Q Send-Q Local Address Foreign Address State PID/Program\ntcp 0   \
    \   0 0.0.0.0:22     0.0.0.0:*      LISTEN 1234/sshd\ntcp 0      0 0.0.0.0:80\
    \     0.0.0.0:*      LISTEN 5678/nginx\ntcp 0      0 0.0.0.0:443    0.0.0.0:*\
    \      LISTEN 9012/nginx\n```\n\n### 设置实时内核补丁\n你可以使用 `livepatch` 服务来确定你的服务器何时需要安全修复，特别是对于不需要重启的主内核。作为\
