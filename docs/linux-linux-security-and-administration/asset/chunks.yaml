- fmt: "\nThese are the basics when it comes to managing passwords. You need to expand\
    \ this to all passwords on the server, including the `root`, user, functional,\
    \ service accounts, and application passwords.\n\n## Reduce the Use of Shared\
    \ Accounts\nAs an administrator, you should never share an account with another\
    \ user on the server. Administrators need to have separate accounts for accountability\
    \ and traceability for all the actions performed by them. You need to track every\
    \ user’s actions. Every Linux system comes with a `root` account. Applications\
    \ on your server will have accounts associated with them, and these accounts have\
    \ their own set of privileges. This limits the access the application can have\
    \ to the system.\n\nThere are times when a data administrator or application administrator\
    \ needs to perform privileged activities on the operating system, data service,\
    \ or application. You need to implement and enforce a system where a user can\
    \ access a different account without logging into the privileged account. This\
    \ is a `sudo` command which can be used to access the operating system. You, as\
    \ an administrator, can extend a user’s privilege without allowing them to share\
    \ accounts. It provides the required accountability and traceability to identify\
    \ the activities they perform.\n\n## Control Access to Accounts\nIt is important\
    \ to understand that not every account present in the system needs to be accessed\
    \ over a network. You must implement and enforce privilege control across the\
    \ server. It is only when you do this that nobody logs into incorrect accounts\
    \ or performs unauthorized activities on your server. It is also important to\
    \ ensure that every user does not access the server using the `SSH` configuration.\
    \ Not every user account on the server needs to access the server from different\
    \ computers on the network. You do not have to give a user access to the server\
    \ from anywhere. Users should only access the server to perform the tasks he is\
    \ assigned.\n\n## Maintain Logs\nIt is important to log everything that happens\
    \ on your server. You need to log the accesses, changes, patches, privileges,\
    \ and features of every user on your server. This is not an exhaustive list, and\
    \ you can look at other aspects of a user’s activity, as well. It will take you\
    \ and your team time to go through the messages and evaluate all the activities\
    \ performed. This is something you most certainly need to do.\n\nYou should report\
    \ which user has access to perform which activity. You need this information for\
    \ different regulations. It is important to log all changes to different accounts,\
    \ changes to entitlements, deletions or additions of users, or any other activity\
    \ performed by the users. You can only make changes to your servers' rules if\
    \ you are aware of the activities being performed by the users.\n\n## Record and\
    \ Manage Privileged Activity\nIt is important to know which user accessed the\
    \ server, which host was used, where he accessed the server, and how he did it.\
    \ It is even more important to know the user's privileges and analyze what the\
    \ user did to the server. You need to collect this data and analyze it to see\
    \ what activities are being performed on your system.\n\nIf you are the administrator,\
    \ you can manage user rights, activities, and their activities' timings. This\
    \ is a powerful tool. To understand what a user is doing on the system, you can\
    \ run commands using privileges not assigned to the users. Some examples of such\
    \ privileges are database administrators or application administrators. These\
    \ users can perform only configuration or maintenance activities. If these users\
    \ have excessive privileges, it can lead to various problems. You need to manage\
    \ the administrator access, even if it looks like you cannot trust the administrator.\
    \ These accounts should be looked at carefully, and the activities should be monitored.\
    \ This is not because of the people who can use the accounts but because the accounts\
    \ are a hacker’s valuable asset.\n\n## Notify or Alert in Case of Suspicious Activity\n\
    Once you implement and establish the audit and logging system on Linux, you need\
    \ to set up an automated notification to alert you of any suspicious activity\
    \ on any server used in the system. This does not mean you set a signal to report\
    \ any minor violation, but those which can cause a breach in your servers. Your\
    \ notification and alerting system must be defined on rules to stop inappropriate\
    \ behavior. When you log this activity, it will show you that a user is performing\
    \ a function he should not. You can then use the notification to define rules\
    \ which will prevent this from happening again. This process will make it easier\
    \ for you to be proactive instead of reactive. This process is based on the concept\
    \ of detecting through enforcing. This concept means that you use the same rules\
    \ to detect and prevent any bad behavior from occurring.\n\n## Unify and Centralize\n\
    All Linux distros allow you to perform all the actions listed so far natively.\
    \ For instance, you can use `SSH` to configure how a user can access the server\
    \ and where he can access it. You can also use it to define what activities the\
    \ user can perform using that access. It is easy for you to do this manually if\
    \ you are working only with one system and a few users. If you have multiple servers,\
    \ it increases the effort you need to put in to maintain the configuration of\
    \ the servers. You may also make an error when it comes to manually updating the\
    \ access and user groups for every user.\n\nIt is important to couple privilege\
    \ management and access control. You will make mistakes if you look at these two\
    \ domains separately. In the world of Linux security, you need to couple access\
    \ and account control as well. To do this, you need to have tools that allow you\
    \ to manage the access control, account management, and privilege management domains\
    \ centrally.\n\n## Chapter Three: Securing Servers Using Firewalls\nAs a system\
    \ administrator, you need to learn how to configure and maintain a firewall for\
    \ your Linux servers. In this chapter, we will look at how you can manage the\
    \ server using a `firewall-cmd` command.\n\nIf you have worked on network security\
    \ before, you know that a firewall is an important part of it. Therefore, it is\
    \ important for you, as the system administrator, to learn about how a firewall\
    \ works. It is only when you understand how a firewall works that you can secure\
    \ the server and make the right choice about which traffic you prefer to allow\
    \ to enter and exit your server. Firewall is a different name, and some people\
    \ confuse it with a Tron-style battle which happens at the ends or outside the\
    \ network. Unlike a Tron-style battle where rogue data packets are released to\
    \ protect the user’s data, a firewall is only a small part of software you can\
    \ use to control the incoming traffic in the network.\n\n### Ports\nYou can use\
    \ firewalls to manage any traffic flowing into and out of the server, and does\
    \ this by monitoring the ports used in the network. When it comes to firewalls,\
    \ the port does not refer to any physical connection, such as `VGA` or `HDMI`.\
    \ In terms of firewall, ports are artificial connections or constructs which are\
    \ created in the operating system. This port is used as a way to connect or create\
    \ a pathway between various data sources and the operating system. You can name\
    \ the port using different words, but port is used often. What I am trying to\
    \ say is that there is nothing new or different about port. There are different\
    \ ports used in operating system, and some are used more than others. These ports\
    \ are conventions:\n\n- `HTTP` moves on port `80`\n- `HTTPS` moves on port `443`\n\
    - `SSH` uses port `22`\n- `FTP` uses port `21`\n\nWhen data is moved from one\
    \ system to another, this prefix will determine the port that should be used.\
    \ If the end port accepts the data and information you send through the protocol,\
    \ it means the data is accepted. If you do not know how this works, you can learn\
    \ about it by accessing any URL. Open any browser on your system and use the command:\n\
    \n```\ncurl --connect-timeout 3 \"http://example.com:80\"\n```\n```html\n<!doctype\
    \ html>\n<html>\n<head>\n<title>Example Domain</title>\n</head>\n```\n\nIn the\
    \ same form, use a different port to reject access to a website. For example,\
    \ you can add port number `79` (using the notation `example.com:79`). This will\
    \ push the website to decline access:\n\n```bash\ncurl --connect-timeout 3 \"\
    http://example.com:79\"\n```\n`curl: (7) Failed to connect: Network is unreachable`\n\
    \nThere is a correlation between protocols and ports on a network, and experts\
    \ set these conventions. You can easily change these settings if you need to on\
    \ your computer. When people began to work with computers and networks, they were\
    \ afraid to change the ports in their server because they believed it could lead\
    \ to an attack. Now, attacks are sophisticated, and this means the hacker will\
    \ not learn anything by running a port scanner on the network or web server to\
    \ determine whether or not there is a change in the ports. A firewall will look\
    \ at the activity that is performed in the web server on any port.\n\n### Using\
    \ the Firewall-cmd Interface\nThe operating system you are using will have an\
    \ infrastructure for the server and network. The objective of this interface is\
    \ to run the firewall. Alternatively, your modem and router may come with a firewall\
    \ installed. This will act as the primary gateway and path used by any website\
    \ on the Internet. It is important to remember that firewalls come pre-configured\
    \ and use a different interface that you can change. In this section, we will\
    \ look at the different commands you can use through the `firewall-cmd` interface\
    \ on your Linux distribution.\n\nWhen you configure the firewall used, most experts\
    \ will ask you to block everything on the firewall. Experts also recommend that\
    \ once you block everything, you can open the network up to some ports. This means\
    \ you need to know exactly what your server needs and identify how to do it.\n\
    \n### Blocking Everything\nIf you work in an organization with its own `DNS` caching\
    \ service or `DNS`, you need to unlock the port before handling the communication\
    \ in the DNS. If you solely rely on the `SSH` configuration and use that to change\
    \ the servers and access them remotely, you cannot block it. You need to know\
    \ which service runs on the operating system and understand if the service is\
    \ internal to the organization. You also need to determine if there is any interaction\
    \ between different services in the server.\n\nWhen it comes to proprietary software,\
    \ the server may make calls to external ports, and you may not be aware of these\
    \ calls. If there are applications that react terribly to any strict firewall\
    \ on your server, you need to use reverse engineering. You may also need to speak\
    \ to the application's support line to understand the type of traffic the application\
    \ is creating. You also need to know why the application behaves the way it does.\
    \ When it comes to open-source software, this is not a common issue. This is not\
    \ true for complex software stacks. Most media players will make calls to the\
    \ Internet. They will need to use the port to fetch the album.\n\n### Creating\
    \ a Zone\nAll Linux distros allow you to perform all the actions listed so far\
    \ natively. For instance, you can use `SSH` to configure how a user can access\
    \ the server and where he can access it. You can also use it to define what activities\
    \ the user can perform using that access. It is easy for you to do this manually\
    \ if you are working only with one system and a few users. If you have multiple\
    \ servers, it increases the effort you need to put in to maintain the configuration\
    \ of the servers. You may also make an error when it comes to manually updating\
    \ the access and user groups for every user.\n\nIt is important to couple privilege\
    \ management and access control. You will make mistakes if you look at these two\
    \ domains separately. In the world of Linux security, you need to couple access\
    \ and account control as well. To do this, you need to have tools that allow you\
    \ to manage the access control, account management, and privilege management domains\
    \ centrally.\n\nYou need to use the `--new-zone` command to add a new zone on\
    \ the web server. Any action you perform using `firewall-cmd` command will only\
    \ persist until you restart the computer. To make anything permanent, you need\
    \ to use the `--permanent` flag.\n\n```bash\nfirewall-cmd --new-zone corp\n```\n\
    \nNow that you have a new zone in place, you can assign a network interface to\
    \ this. Before you do this, you need to use the `ssh` service to access the zone.\
    \ To make a permanent change to your server using the `--permanent` flag:\n\n\
    ```bash\nfirewall-cmd --zone corp --add-service ssh --permanent\n```\n\nIf you\
    \ want to activate the `corp` zone and make it the default zone, you need to use\
    \ the `--change-interface` option:\n\n```bash\nfirewall-cmd --change-interface\
    \ ens3 --zone corp --permanent\n```\n\nWhen you make the `corp` zone the default\
    \ zone used in the server, every command you use in the code will be applied to\
    \ the `corp` zone unless you specify any other zone. If you want to do this, you\
    \ need to use the following command:\n\n```bash\nfirewall-cmd --set-default corp\n\
    ```\n\nYou can also look at the interfaces and the zones assigned to the interface.\
    \ To do this, you need to use the following:\n\n```bash\nfirewall-cmd --get-active-zones\n\
    ```\n```text\ncorp: ens3\ninterfaces: ens4\n```\n\n### Setting the Default Zone\n\
    If you want to learn more about what is allowed in a specific zone, you can run\
    \ the following:\n\n```bash\nfirewall-cmd --zone corp --list-all\n```\n```text\n\
    target: default\nicmp-block-in: no\ninterfaces:\nsource: \nmasquerade: no\nports:\
    \ \nservices: cockpit dhcpv6-client ssh\nrules:\n```\n\n### Removing or Adding\
    \ Services\nYou have now blocked access to the network from every protocol except\
    \ `SSH`. Therefore, you can open the ports used in your network based on the protocol\
    \ being used. The easy and quick way for you to permit or manage traffic through\
    \ the firewall is to include predefined networks or services. If you want to look\
    \ at the list of services that are available on your network, you can use the\
    \ following:\n\n```bash\nfirewall-cmd --get-services\n```\n```text\nRH-Satellite-6\n\
    amanda-client\namqp\namqps\napcups\naudit\nbacula\nbacula-client\nbgp\nbitcoin\n\
    bitcoin-rpc\nbitcoin-testnet\nceph\ncockpit\ndhcp\ndhcpv6\ndhcpv6-client\ndistcc\n\
    dns\n```\n\nLet us consider a situation where you need to run a web server. To\
    \ do this, you need to install a web server on the network you want to use. You\
    \ can use `apache2` on Debian or Ubuntu or the `httpd` package on Fedora or RHEL.\
    \ In the following example, we will use the `httpd` service:\n\n```bash\nsudo\
    \ dnf install httpd\nsudo systemctl --enable --now httpd\n```\n\nYou should now\
    \ test the web server from your local network and see how it works.\n\n```bash\n\
    curl --silent localhost:80 | grep title\n```\n```html\n<title>Test Page for the\
    \ Apache HTTP Server on Red Hat Linux</title>\n```\n\nYou should then use the\
    \ network and connect to the web server in your network from any browser, preferably\
    \ an external one.\n\n```bash\ncurl --connect-timeout 3 192.168.122.206\n```\n\
    `curl: (28) Connection timed out after 3001 milliseconds`\n\n### Unblocking a\
    \ Service\nIf you want to permit the traffic from the `HTTP` protocol through\
    \ your network or firewall, you need to include the `HTTP` service in your web\
    \ server.\n\n```bash\nsudo firewall-cmd --add-service http --permanent\nsudo firewall-cmd\
    \ --reload\n```\n\nYou should test this inclusion using an external browser:\n\
    \n```bash\ncurl --silent 192.168.122.206 | grep title\n```\n```html\n<title>Test\
    \ Page for the Apache HTTP Server on Red Hat Linux</title>\n```\n\nNow, you know\
    \ how you can include or add a service to your web server. It is, therefore, easy\
    \ for you to remove one.\n\n```bash\nsudo firewall-cmd --remove-service http --permanent\n\
    sudo firewall-cmd --reload\n```\n\n### Removing and Adding Ports\nYou may have\
    \ trouble with finding a predefined service on your system. Instead of adding\
    \ a service, you can add a port number using `--add-port`. For example, if you\
    \ want to use a non-standard port for the `SSH` protocol in your custom zone,\
    \ you can add it using the commands:\n\n```bash\nsudo firewall-cmd --add-port=2222/tcp\
    \ --permanent\nsudo firewall-cmd --reload\n```\n\nTo remove that port, use `--remove-port`:\n\
    \n```bash\nsudo firewall-cmd --remove-port=2222/tcp --permanent\nsudo firewall-cmd\
    \ --reload\n```\n\n### Walls of the Firewall\nYou can do quite a bit using `firewall-cmd`,\
    \ which is not listed above. You can define `ICMP` blocking, define the sources\
    \ which send data and traffic to your system, or even define the services you\
    \ want to permit. It is easy for you to learn by experimenting. So you can install\
    \ Fedora or Red Hat Linux in a GNOME box to play with `firewall-cmd` options.\n\
    \n## Chapter Four: Securing Your Server\nIn the previous chapter, we looked at\
    \ how you can secure the server using a firewall. We also looked at the importance\
    \ of user accounts and other details. In this chapter, we will look at different\
    \ ways to secure a server without using a firewall.\n\n### Updating Servers\n\
    If you can access the server as the administrator, you need to update it regularly.\
    \ To do this, run the following command:\n\n```bash\nsudo apt-get update && sudo\
    \ apt-get upgrade\n```\nIt is important to ensure while you run the upgrade that\
    \ you are on a VPS or virtual instance. This can damage the image and the server.\
    \ So, you need to check if you can do this on the host.\n\n### Creating a Secondary\
    \ User\nYou need to do this to ensure no user logs into the server using the `root`\
    \ account. If you want to reduce the probability of unauthorized access on your\
    \ server, you need to create a user and give them the relevant privileges. We\
    \ have looked at how to add new users to the servers. If you want the user to\
    \ have access to the server with a specified set of privileges, you need to update\
    \ these terms in the configuration file.\n\nTo accomplish this, you need to edit\
    \ the configuration file:\n\n```bash\nsudo vi /etc/ssh/sshd_config\n```\n\nIt\
    \ is important to update the line `#PermitRootLogin yes` to `PermitRootLogin no`.\
    \ You can then restart the service using the following command:\n\n```bash\n/etc/init.d/sshd\
    \ restart\n```\n```text\nStopping sshd: [ OK ]\nStarting sshd: [ OK ]\n```\n\n\
    Bear in mind that Linux does not have a default root password when you install\
    \ the operating system on your server. There is no root login, but you, as an\
    \ administrator, will have `sudo` privileges and administrative access.\n\n###\
    \ Setting up SSH Keys\nAn `SSH` key on your server allows you to connect securely\
    \ to the server using an authorized key pair. This is an extra step you need to\
    \ perform to ensure the server is secure from any unauthorized access. You need\
    \ to log in to `SSH` using the root account and run the following command:\n\n\
    ```bash\nssh-keygen -t rsa -C \"you@example.com\"\n```\n\nOnce you click on accept,\
    \ the default file locations and names will be added to the server along with\
    \ the file names. You can re-enter the password for your user account and add\
    \ the public key to the file on your server. Use the following code to this:\n\
    \n```bash\ncd ~/.ssh\ncp id_rsa.pub authorized_keys\n```\n\nYou should now copy\
    \ the public key to the `SSH` directory in the root account that is present on\
    \ the server. To do this, you can run the following commands:\n\n```bash\ncd ~/.ssh\n\
    scp authorized_keys root@host.servername.com:/root/.ssh/\n```\n\nYou can now connect\
    \ with the server directly.\n\n### Checking and Configuring the Firewall\nRun\
    \ the following commands to check and configure your firewall. You can also do\
    \ it using the information present in the previous chapter.\n\n```bash\nroot@server:~#\
    \ ufw app list\n```\n```text\nAvailable applications:\nOpenSSH\n```\n```bash\n\
    root@server:~# ufw status\n```\n```text\nStatus: active\nTo Action From\n-- ------\
    \ ----\n22/tcp ALLOW Anywhere\n22 ALLOW Anywhere\n8080/tcp ALLOW Anywhere\n80/tcp\
    \ ALLOW Anywhere\nAnywhere DENY 58.218.92.34\n80 DENY 202.54.1.5\n22 (v6) ALLOW\
    \ Anywhere (v6)\n22/tcp (v6) ALLOW Anywhere (v6)\n8080/tcp (v6) ALLOW Anywhere\
    \ (v6)\n80/tcp (v6) ALLOW Anywhere (v6)\n```\n\n### Limiting the Use of Open Ports\n\
    When you install Linux on your system, you do not have to worry about any network\
    \ services listening to and monitoring the data you are passing through the server.\
    \ When you start the server, you can determine who the administrator and root\
    \ users should be and determine the various ports and services that can use the\
    \ server. You need to test the open ports on your server. To do this, run the\
    \ following lines of code:\n\n```bash\nroot@server:~# /home\nnetstat -tulpn\n\
    ```\n```text\nActive Internet connections (only servers)\nProto Recv-Q Send-Q\
    \ Local Address Foreign Address State PID/Program\ntcp 0 0 0.0.0.0:22 0.0.0.0:*\
    \ LISTEN 1234/sshd\ntcp 0 0 0.0.0.0:80 0.0.0.0:* LISTEN 5678/nginx\ntcp 0 0 0.0.0.0:443\
    \ 0.0.0.0:* LISTEN 9012/nginx\n```\n\n### Setting Up Live Kernel Patches\nYou\
    \ can use the `livepatch` service to determine when your server needs a security\
    \ fix, especially when it comes to major kernels which do not reboot. As a Linux\
    \ user, you can take advantage of these services free up to three zones or nodes.\
    \ This is a part of the system that you can learn more on the website.\n\n###\
    \ Setting Up Two-Factor Authentication\nIf you want to add an additional protection\
    \ layer to your server, you can set up multi-factor or two-factor authentication\
    \ on the server. You need to be careful about setting this up because you can\
    \ lock yourself if you incorrectly enter the password. To do this, follow the\
    \ steps below:\n\n#### One\nAccess the server through `SSH` and run the following\
    \ command to use Google authenticator as your authentication mechanism:\n\n```bash\n\
    apt-get install libpam-google-authenticator\n```\n\n#### Two\nYou should now run\
    \ the command `google-authenticator` to create a secret key in the server's home\
    \ directory.\n\n```bash\ngoogle-authenticator\n```\nDo you want authentication\
    \ tokens to be time-based (y/n)? y\nYour new secret key is: `73GRXVJNWN2T`\nYour\
    \ verification code is: `389485`\nYour emergency codes are: `9953657844768915904806008228133756945099`\n\
    Do you want me to update your `/root/.google_authenticator` file (y/n)? y\nDo\
    \ you want to disallow multiple uses of the same authentication token? This restricts\
    \ you to one login every 30s, but increases your chances to notice or prevent\
    \ man-in-the-middle attacks (y/n)? y\nBy default, tokens are good for 30 seconds\
    \ and in order to compensate for possible time-skew between the client and the\
    \ server, we allow an extra token before and after the current time. If you experience\
    \ problems with poor time synchronization, you can increase the window from its\
    \ default size of 3 to 4 minutes. Do you want to do so (y/n)? y\nIf the computer\
    \ that you are logging into isn’t hardened against brute-force login attempts,\
    \ you can enable rate-limiting for the authentication module. By default, this\
    \ limits attackers to no more 3 login attempts every 30s. Do you want to enable\
    \ rate-limiting (y/n)? y\n\n#### Three\nYou should now edit the configuration\
    \ file for your SSH port. The file is called `/etc/ssh/sshd_config` and you can\
    \ access it using `PAM` (pluggable authentication module). You need to run the\
    \ following command before you save the changes and close the file:\n\n```\nUsePAM\
    \ yes\nChallengeResponseAuthentication yes\n```\n\nNow, you can restart the server\
    \ using the command below:\n\n```bash\nsystemctl restart ssh\n```\n\n#### Four\n\
    Now that you have the `SSH` set up, you need to edit another configuration file\
    \ where the `PAM` is present. This file is for the SSH daemon. You need to add\
    \ the following command to the file `/etc/pam.d/sshd`:\n\n```bash\nauth required\
    \ pam_google_authenticator.so\n```\n\n#### Five\nYou now have to save the file.\
    \ Close the file and reboot the server. You will now be authenticated using Google\
    \ authenticator.\n\n### Turning Off Internet Protocols\nIt is important to identify\
    \ which Internet protocol (`IPv4` or `IPv6`) you use frequently. For instance,\
