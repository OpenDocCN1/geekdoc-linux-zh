    - 结论\n- 参考文献\n\n## 介绍\n如果你是 Linux 使用的新手，对你来说找到正确的信息将很困难。这本书包含了你所需的所有信息，帮助你安装操作系统，并向你展示如何在你的系统或虚拟机中使用它。书中还包含了关于你如何配置用户访问和其他信息以维护网络和服务器的信息。法律声明：本书受版权保护。本书仅供个人使用。未经作者同意，你不得修改、分发、销售、使用、引用或转述本书的任何部分或内容。免责声明：请注意本文包含的信息仅供教育和娱乐之用。我们已尽一切提供准确、最新、可靠的完整信息。我们不提供任何形式的明示或暗示保证。读者承认作者并未提供法律、财务、医疗或专业建议。本书的内容源自各种来源。在尝试本书中列出的任何技术之前，请咨询获得执照的专业人士。通过阅读本文档，读者同意在任何情况下，作者对因使用本文档包含的信息而导致的任何直接或间接损失不承担责任，包括但不限于错误、遗漏或不准确。\n\
    \n## 第一章：在虚拟机上使用 Linux\n如果你是 Linux 使用的新手，对你来说找到正确的信息将很困难。这本书包含了你所需的所有信息，帮助你安装操作系统，并向你展示你如何在你的系统或虚拟机中使用它。书中还包含了关于你如何配置用户访问和其他信息以维护网络和服务器的信息。法律声明：本书受版权保护。本书仅供个人使用。未经作者同意，你不得修改、分发、销售、使用、引用或转述本书的任何部分或内容。免责声明：请注意本文包含的信息仅供教育和娱乐之用。我们已尽一切提供准确、最新、可靠的完整信息。我们不提供任何形式的明示或暗示保证。读者承认作者并未提供法律、财务、医疗或专业建议。本书的内容源自各种来源。在尝试本书中列出的任何技术之前，请咨询获得执照的专业人士。通过阅读本文档，读者同意在任何情况下，作者对因使用本文档包含的信息而导致的任何直接或间接损失不承担责任，包括但不限于错误、遗漏或不准确。感谢购买本书。希望你学习更多关于\
    \ Linux 的知识以及如何保护你的文件和文件夹。\n\n### 安装 Workstation Player\n如果你想使用 Linux 但不想在你的系统上使用？如果你使用双系统，你的系统可能会遇到问题。最好的方法是在虚拟机中使用\
    \ Linux。如果你使用 Windows，操作过程是简单的。在本章中，我们将查看如何在虚拟机上安装和使用 Linux，特别是 Workstation Player。\n\
    \n### 选择正确的发行版\n由于有很多选项，你可能很难选择适合你系统的正确发行版。你如何知道哪一个最适合你？如果你想使用一个与 macOS 结构相同的发行版？在本节中，我们将查看供你使用的不同发行版。64\
    \ 位和 32 位的 Linux 版本在机器上运行良好。如果你不知道需要哪种发行版，请从下列表中进行选择：\n\n### Linux 发行版\n由于有很多选项，你可能很难选择适合你系统的正确发行版。你如何知道哪一个最适合你？如果你想使用一个与\
    \ macOS 结构相同的发行版？在本节中，我们将查看供你积极使用的不同发行版。这些发行版在过去几年中被个人积极使用。你还应该检查你使用的发行版是否使用安全补丁定期更新。\n\
    \n### Linux 发行版\nRed Hat Enterprise 该发行版与 Fedora 类似，但用于商业领域。该发行版为企业客户设计。你可以使用任何插件和变体。如果你想成为管理员，你需要通过认证。SUSE\
    \ Linux Enterprise 这种 Linux 发行版是为企业设计的，可以供业务使用。由于这个原因，这种变体易于使用不同的办公程序。你可以在各种设备上运行此发行版，它甚至可以在关键系统上使用。该发行版的许多版本在\
    \ Linux 网站上可用。\n\n### 游戏发行版\nSparkyLinux Game Over Edition SparkyLinux 有多个版本，但这个专注于游戏的版本最常用。这个游戏版本带有各种预装游戏、LXDE\
    \ 桌面、PlayOnLinux 和 Wine。该发行版上有许多高级和免费游戏，你可以轻松地使用。SteamOS 许多玩家已开始使用 Linux 作为他们的操作系统，因为它带有\
    \ Steam 客户端。如果你是一个玩家，安装 SteamOS 版本的 Linux 会更简单。你可以用于游戏的最佳 Linux 发行版之一是 SteamOS，它经过优化，可以在任何游戏中表现良好，并内置了音频驱动程序、专有图形界面和\
    \ Steam 客户端。\n\n### 通用 Linux 发行版\nUbuntu 是一个基于 Debian 的操作系统，使用 GNOME 作为桌面环境。你无法更新这个环境，因为它是默认的。这个\
    \ Linux 发行版有定期补丁更新，并在每个新版本不断改进。该操作系统的最新版本为混合、台式机和笔记本电脑设计。因此，如果你从 Windows 迁移到 macOS，你需要使用\
    \ Ubuntu 操作系统。openSUSE 该发行版是 Linux 为各种项目构建的通用操作系统，但主要用于 openSUSE 项目。该发行版由新手和丰富的\
    \ Linux 用户共同使用。该发行版带有一个名为 YaST 的管理程序，它可以控制和监控安装、包管理和其他功能。Fedora 该 Linux 发行版由 IBM\
    \ 拥有的 Red Hat 开发，使用默认的 GNOME 桌面环境。你可以切换到 LXDE、Xfce 桌面、Cinnamon、KDE 和 MATE 以及其他桌面环境。Fedora\
    \ 的某些变体（如 Fedora spins）可以供特定需求的人使用。Debian 是一个旧的 Linux 发行版，与其他 Linux 发行版相比是最好的版本。它也带有默认的\
    \ GNOME 桌面环境，但也可以用于 FreeBSD 内核。开发人员正在努力使其与其他内核（如 Hurd）兼容。某些 Linux 发行版（如 Raspbian\
    \ 和 Ubuntu）基于 Debian 的。Slackware Linux 是另一个专门为简单和安全构建的发行版。它是一个类 Unix 发行版，用于服务器和文件管理，因为它提供了\
    \ Web、FTP 和电子邮件服务器可用。如果你从未尝试过管理服务器或使用 Unix 服务器，你可以将此作为 live 光使用。Mageia 该 发行版由非营利社区开发，具有你应有的各种功能，默认桌面是\
    \ GNOME 和 KDE。SparkyLinux 这种 Linux 版本在开发者测试 Debian 版本时演进而来。这个版本的 Linux 带有自定义的\
    \ LXDE 桌面，你可以轻松使用。Gentoo Linux 它可以满足多种需求，其性能和通用性使其成为 Linux 的最佳版本之一。Gentoo Linux\
    \ 拥有 Portage，这是一个高级包管理系统。由于 Gentoo 可以用于不同的系统，你可以获得对系统的完全访问。社区操作系统 CentOS 是 Red\
    \ Hat 社区构建的，是 Red Hat Enterprise 的重构。这是一个免费版本。如果你不想与不同的发行版工作，可以使用这个。\n\n### 轻量级\
    \ Linux 发行版\nLinux lite 是一种占用资源极小的版本，基于 Ubuntu，具有非常小的 footprint。这些轻量级 Linux 发行版基于\
    \ Ubuntu，具有 Windows 风格的菜单让用户感到熟悉。该发行版资源较小，可以在 512 MB RAM 和 700 MHz CPU 的设备上使用。Lubuntu\
    \ 是另一个基于 Ubuntu 的轻量级版本，非常适合笔记本电脑或台式机。它使用轻量级环境并内置了应用程序。如果你想最大化你的设备效率，应该选择这个。Xubuntu\
    \ 是 Ubuntu 的一个衍生品，使用 Xfce 桌面，轻量级且优雅。你可以将其用于笔记本电脑和台式机。Puppy Linux 是一个较小的发行，可以在没有硬盘的情况下运行。这个版本非常适合旧笔记本电脑或电脑，可以使用它。Manjaro\
    \ Linux 是一种易于使用的、快速且轻量级的发行版，基于 Arch。这个版本使用了 Arch Linux 的优势，默认桌面是 Xfce，但你可以根据需要切换到其他选项。Arch\
    \ Linux 这种版本是考虑到用户体验而开发的，旨在保持简单易用。Arch 通过补丁定期更新。Arch 有 Pacman，这是一个自定义的包管理器。你想要自定义\
    \ Linux 系统？如果是，你应该使用这个发行版。Bodhi 是一个基于 Ubuntu 的操作系统，带有美观且轻量级的桌面。Bodhi 可以被自定义，并带有应用程序和主题。你可以使用这些来扩展基础操作系统。\n\
    \n"
