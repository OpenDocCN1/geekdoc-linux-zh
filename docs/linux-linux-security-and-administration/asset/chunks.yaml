    luksClose my_encrypted_partitionStep Eight : When you try to mount the file in
    the regular file system, it will indicate an error. If it does, you have done
    the right thing to encrypt the partitionAdding Additional Layers of SecurityYou
    can also encrypt the swap space in the server to add another layer of security.
    When you enter a passphrase on your server to encrypt the partition in the server,
    it will be stored in the RAM when you switch your system on. If any hacker wants
    to use this key, he can easily decrypt this information in the data. It is especially
    easy to do this when it comes to a laptop since the partitions of a RAM are maintained,
    even during their hibernation sessions, in the swap layers or sections of the
    memory.If you want to avoid leaving a copy of the accessible to a hacker, you
    need to encrypt this swap layer or partition using the process mentioned below:Step
    One : Create a partition or separation in the RAM, which will be used as the swap.
    You need to maintain the right size and use the encryption mechanism mentioned
    earlier. You can name this section as swap if you need toStep Two : Once you set
    this partition, you need to activate the swap using the following commands:# mkswap
    /dev/mapper/swap# swapon /dev/mapper/swapStep Three : You should now change the
    entry of the swap in the file: /etc/fstab. To do this, use the following command:
    /dev/mapper/swap none                      swap              sw                        0   0Step
    Four : The last thing you need to do is to save the file down and reboot the server.
    To do this, run the following command: swap               /dev/sdd1         /dev/urandom
    swapWhen you reboot the system, you can verify if the swap space is active or
    not using the following command: # cryptsetup status swap.Chapter Nine: Using
    Access Control Lists in LinuxNow that you know how to encrypt and protect your
    files and data using a password, let us understand how you can control access
    to the servers in Linux.Introduction to Access Control Lists (ACL)An ACL is one
    that provides flexible and additional permissions for your files and directories.
    It is designed so you can work with the different file permissions in Linux. ACL
    also allows you to identify the permissions you need to set for each user or a
    group of users. You can also use it to protect any disc resource.Uses of ACLConsider
    a situation where you have a user who is not a part of any user group on the server
    or network. This user needs to access files and make changes to them, so you will
    need to give him access using commands. This is where the concept of Access Control
    Lists comes into the picture. Using ACLs, you can grant flexible permissions to
    specific users in the system. If you are an administrator, you can use an ACL
    to define the fine-grained access rights for directories and files. You can use
    the keywords setfacl and getfacl to set up an ACL and view the ACL on your server
    or system. For instance, if you run the following command: getfacl test/declarations.h,
    you will receive the output below:# file: test/declarations.h# owner: mandeep#
    group: mandeepuser::rw-group::rw-other::r—List of Commands to Set Up ACLsIn this
    section, we will look at the different commands you can use to set up ACLs in
    your system.Adding Permissions to UsersYou can do this using the following command:setfacl
    -m "u:user:permissions" /path/to/fileAdding Permissions to GroupsTo do this, run
    the command: setfacl -m "g:group:permissions" /path/to/fileAllowing Files and
    Directories to Inherit ACL EntriesYou can use the following command to allow a
    file or directory to inherit the properties or privileges found in an ACL from
    the directory it is a part of: setfacl -dm "entry" /path/to/dir.Removing a Specific
    Entry in the ACLTo do this, you can run the command: setfacl -x "entry" /path/to/fileRemoving
    Entries in ACLThere may be times when you might want to remove the entries in
    the ACL. To do this, you need to run the command: setfacl -b path/to/file. For
    instance, you can use the following to remove the declarations against the user
    Mandeep: setfacl -m u:mandeep:rwx test/declarations.hModifying the ACLAdding Permissions
    for UsersTo do this, you need to enter either the username or ID of the user who
    you want to add to the list. Use the following command to do this: # setfacl -m
    "u:user:permissions".Adding Permissions to GroupsThis is similar to what was done
    in the previous section. You can use the group name and ID to add permissions.
    Use the following command to do this: # setfacl -m "g:group:permissions"Allow
    Files or Directories to Inherit the ACL EntriesYou can use commands to let the
    files and directories obtain the properties from the directory where the files
    and directories are present. To do this, you need to use the command: # setfacl
    -dm "entry".For example, when you run the command setfacl -m u:mandeep:r-x test/declarations.h,
    the output will be the one in the image below.![](image_rsrc1HA.jpg)Viewing ACLYou
    can use the following command to view the permissions written in ACL: # getfacl
    filename. The differences between the getfacl and setfacl commands are quite obvious.
    So, pay attention to them. We have used an extra line against the username Mandeep,
    and this is in the image above. You can use the above command to change the permissions
    in the ACL from rwx to r-x.Removing ACLIf you want to remove any commands you
    set in the ACL, use the setfacl command with the option ‘-b.’ Consider the example
    below:![](image_rsrc1HB.jpg)Now, compare the output when you run the getfacl command
    before and after you use the setfacl commands with the option ‘-b.’ You will see
    there is no entry in the list with the name mandeep in the second output. You
    can also look for any extra permissions which were set through the ACL using the
    command ‘ls.’![](image_rsrc1HC.jpg)When you look at the first command in the above
    image, there is a plus sign immediately at the end of the ACL''s permissions.
    This is an indication that there are some extra permissions that you can set in
    the ACL, and you can do this using the getfacl command.Using Default ACLsThe default
    ACL uses a specific permission type that is assigned to the directory where you
    are making changes directly to the directory. This makes it easier for you to
    use the ACLs which come with your Linux. Let us see how you can use it. We are
    now going to create a directory or file and assign the default ACL to the file
    or directory using the option ‘-d’ using the following command: $ mkdir test &&
    setfacl -d -m u:dummy:rw test.You now have an idea of what you can do to maintain
    security in your systems and server. The next two chapters shed light on how you
    can perform penetration testing and scanning to find any vulnerabilities in your
    server and network.Chapter Ten: Downloading and Installing Kali LinuxIf you want
    to perform an analysis of your system’s security, you need to use the Kali Linux
