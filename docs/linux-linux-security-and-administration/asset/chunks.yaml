- fmt: "\nIf you have this enabled in your server or network, you can prevent numerous\
    \ attacks before they occur on your system.\n\n## CIPE or Cryptographic IP Encapsulation\n\
    \nThe objective of this encryption is to provide a facility that is secure for\
    \ the server and system. This encryption protects the interconnection between\
    \ subnetworks across insecure packet networks from traffic analysis, eavesdropping,\
    \ and faked message injection. Using `CIPE`, you can encrypt the data at both\
    \ the server and network levels. All the information moving along the network\
    \ in the form of packets is encrypted, and these packets are received and sent\
    \ by an encryption engine that is next to the network driver.\n\n`CIPE` does not\
    \ encrypt the data that is passed through the network or connection. It does not\
    \ even encrypt the data at the network or socket levels. It will only encrypt\
    \ the logical connection between networks, sockets, and programs found on different\
    \ hosts. This is very different from `SSH`. You can also use `CIPE` to create\
    \ new VPNs through tunneling. If you want to avoid making changes to the application\
    \ software being used, you can use low-level encryption methods. These methods\
    \ ensure the logical connection between two networks connected in the VPN or Virtual\
    \ Private Network work transparently.\n\n## Using Shadow Passwords\n\nYou can\
    \ use shadow passwords to ensure a user’s password is encrypted and the information\
    \ is maintained in a file that normal users cannot access. New versions of `RedHat`\
    \ and `Debian` use this setting as a default. After encryption, the passwords\
    \ are stored in a file in the server directory that every user on the server can\
    \ access. If one were to run a password cracking or guesser program on the file,\
    \ they could obtain every user's password on the system. \n\nA shadow password\
