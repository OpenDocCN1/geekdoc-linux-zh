    2. **Minlen**: This parameter defines the minimum length every password should
    have

    3. **Difok**: This parameter is used to check the number of characters reused
    in the current password when compared to a previous password

    4. **Dcredit**: This indicates the numerals you need to have in your password

    5. **Ucredit**: This defines the number of uppercase characters

    6. **Lcredit**: This defines the number of lowercase characters


    You can update these settings and save the updated settings. You need to understand
    that the policies will apply to every user on the server except for administrator
    users. The latter is responsible for maintaining the strength of root passwords.


    ## Restrict SSH Access


    You can use the `OpenSSH` server to limit the number of connections to the server
    based on the group users is categorized into. This is a useful technique to have
    up your sleeve, especially if you have many users and you have some who should
    not access your server remotely. You can also do this to add more security to
    your server. For example, when you run a web service, you may not want everybody
    to access that service using the same server.


    To do this, you need to create new user groups. Use an apt name for the group.
    In the following command, we will create a group of users called `sshusers`:

    ```bash

    sudo groupadd sshusers

    ```


    If you want to be a part of this group, add your username against the group’s
    name using the command:

    ```bash

    sudo gpasswd -a <username> sshusers

    ```


    If you want to check who has been added to the group, you can use the command:

    ```bash

    groups <username>

    ```

    The output of this command will show you the different groups of which the username
    is a part. You can also include another user group in the list for the same user.
    The list will also have a username that is the same as the name of the user.


    The output of the above command is:

    ```

    user: user sudo sshusers

    ```


    Once this is done, you can specify the group you want to use for `OpenSSH`. To
    do this, you need to open the configuration file using an editor. If you have
    `nano` installed in your system, you can use the command:

    ```bash

    sudo nano /etc/ssh/sshd_config

    ```

    Otherwise, you can use the command:

    ```bash

    sudo vi /etc/ssh/sshd_config

    ```


    At the end of your configuration file, you need to add the following line:

    ```bash

    AllowGroups sshusers

    ```

    Ensure the configuration option you have chosen is not commented out using the
    hashtag sign in front of it. Save the file down and exit the editor. Now, restart
    the SSH server and use this command if you use Debian or Ubuntu servers:

    ```bash

    sudo service ssh restart

    ```

    With Red Hat and CentOS variants, you can do the same using this command:

    ```bash

    sudo systemctl restart sshd

    ```


    Using the new configuration, a user who does not belong to a specific group can
    be denied access to the server over `SSH`. Their passwords may be entered correctly,
    but they will not be given access. This reduces the chance of people hacking the
    server through brute force attacks. This method is the easiest way to protect
    the Linux server you are using.


    ## Understanding Account Privileges


    As a Linux security professional or system administrator, you need to manage the
    system users and their activities. You also need to limit the activities a user
    can perform on the system using different tools. It is important to remember that
    a user can make mistakes. These can be anything, including assigning an administrator''s
    privileges to a user who is new to Linux, running an application or script on
    the system using `root` privileges, or leaving vulnerabilities in your system
    that allow a hacker to access it.


    Since you are responsible, you need to do everything in your power to ensure users
    do not perform any activity on the system that they should not. You may not even
    want to clean up the mess.


    Your main goal should be to control what a user can and cannot do when he accesses
    the Linux server. A user on a Linux system needs an account to access the system.
    Users can access these accounts directly when they perform any activity on the
    operating system, data, or application. Every system requires specific accounts
    so that it can function properly. It also needs applications that will need an
    account for them to access the server.


    You can manage the privileges assigned to users in multiple ways and using different
    tools. The best way to manage users’ access and privileges is using the privileged
    access management tools since these allow you to manage the activity centrally.


    In this section, we will look at nine important practices you need to bear in
    mind when it comes to managing accounts and privileges on Linux. It is important
    to bear in mind that these are not the only ways to protect accounts. Newer methods
    are emerging regularly, and you can learn more about them depending on the type
    of system you maintain.


    ## Manage Linux User Accounts


    It is easy to create an account on Linux, and we have seen the commands you can
    use to do this in the previous section. It becomes difficult to remove or disable
    an account that you no longer need. If you do not remove these accounts, they
    continue to be active, which can cause further issues. Every Linux system needs
    an account that users can use to access the server to perform any activity on
    the operating system or on the data stored. The system will need accounts for
    it to function properly. Applications also require accounts that can be used to
    connect it to the server.


    Most people assume that account management only revolves around managing user
    accounts. They do not worry about the functional, system, or application accounts.
    This leaves a lot of gaps in your risk management for the server.


    ## Reducing Privileges


    When it comes to privileged accounts, you need to restrict these users'' access
    and rights to ensure they only have the authority to perform the required activities
    and nothing more. It is important to ensure users only do what they are required
    to do. If you give a user more access than he needs, it will be difficult for
    you to control what a user can do. You need to consider the following when you
    assign privileges:


    1. Do system administrators need to use the `root` account?

    2. Does a system administrator need to run commands which only the `root` account
    can run?

    3. Does a database administrator need to access the `root` account?


    ## Managing Passwords


    You may have implemented and enforced a password policy and the parameters one
    needs to adhere to when they set their policy. Having said that, the goal should
    be to reduce the number of passwords used in the system. There are places and
    times where you need to use passwords still. If you use passwords on the system,
    you must find a way to manage them.


    The following need to be kept in mind when it comes to managing passwords on the
    system:


    1. Ensure passwords are frequently changed

    2. Prevent the use of old passwords

    3. Assess the complexity of the passwords used in the system

