    Retrieved from https://www.beyondtrust.com/blog/entry/controlling-unix-linux-account-privileges-9-best-practicesHoffman,
    C. (n.d.). Why You Shouldn’t Log Into Your Linux System As Root . How-to Geek.
    Retrieved from https://www.howtogeek.com/124950/htg-explains-why-you-shouldnt-log-into-your-linux-system-as-root/How
    to manage Linux user account security - Tutorial . (n.d.). UpCloud. Retrieved
