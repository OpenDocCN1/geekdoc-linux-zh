  trans: '

    完成此操作后，你需要在配置文件中添加以下行，以确保用户不会重复使用其最后几个密码。你可以决定服务器想要存储的密码数量。


    ```

    password sufficient pam_unix.so nullok use_authtok md5 shadow remember=5

    ```

    此行将向服务器指示，它需要记住用户的最后五个密码。因此，如果用户输入了早期的某个密码，他将收到来自 Linux 的一个错误提示，要求他选择不同的密码。


    ## 检查监听端口

    你需要查看服务器上不同的端口，并查看它们以及它们所提供的服务。要执行此操作，你可以运行以下命令：`netstat -tunlp`。根据收到的列表，你可以判断是否有任何需要从系统内核禁用的端口。你可以使用
    `chkconfig` 命令来实现此。然后你可以关闭服务器上所有不需要的端口。要执行此操作，你可以运行命令：`chkconfig serviceName off`。


    ## 禁用 root 登录

    如前所述，确保你不要使用 root 账户登录服务器是非常关重要的。因此，你需要在服务器的配置文件中禁用 root 账户的 ssh 端口。在执行此操作之前，让我们来看一个示例，我们创建一个具有
    `sudo` 权限的用户，这样你就可以使用 ssh 端口访问服务器并执行必要的任务。当你登录服务器时，如果需要，你可以从用户切换到 root 账户。


    让我们先创建一个新用户。执行此操作请使用以下命令：`useradd user1`。你现在可以使用命令 `passwd user1` 为此用户账户添加密码。现在你已经在服务器上创建了一个用户，你可以使用以下行为它赋予
    `sudo` 权限：`echo ''user1 ALL=(ALL) ALL'' >> /etc/sudoers`。然后你需要使用 `ssh` 使用新用户账户访问服务器。这是确保你登录服务器的一种方法。


    现在，我们需要禁用 SSH 端口的 root 访问。这意味着没有用户可以使用 root 账户通过 SSH 登录服务器。你需要打开配置文件 `nano /etc/ssh/sshd_conf`
    来执行此操作。然后你需要将文件中的行 `PermitRootLogin` 更新为 `no`。然后你需要保存并关闭文件。一旦重启它，你就会看到设置已更新。


    在登出服务器之前，你应该测试是否可以使用早些创建的用户 ID 通过 SSH 登录服务器。要执行此操作，你可以在终端中打开另一个实例并使用 SSH 登录控制台。如果一切运行正常，你就可以以
    root 用户身份登出服务器。


    ## 更改端口

    你也可以更改用于 访问网络的 SSH 默认端口。你可以添加一层安全防护以确保你的服务器是安全的。要执行此操作，你需要对 `/etc/ssh/sshd_config`
    文件进行更新。在该文件中，你需要将端口号 `22` 替换为你想要使用的端口号。一旦保存文件，你就可以重启服务器。要执行此操作，你需要使用以下命令：`service
    sshd restart`。然后你可以使用以下命令通过更新后的端口登录服务器：`ssh username@IP -p 1110`。


    ## 禁用快捷键

    当你按下快捷键 `Ctrl+Alt+Delete` 时，你的服务器将自动重启。因此，你最好禁用此快捷键，以防止有人误重启系统。此操作位于名为 `/etc/init/control-alt-delete.conf`
    的配置文件中。你所做的只是在配置文件中注释掉 `#start on control-alt-delete` 这一行即可。


    ## 免密登录

    你可以使用 SSH 登录你的服务器。如果你在文件中配置了细节，你可以放弃密码。你唯一需要做的就是通过 SSH 生成密钥来进入服务器。确保用户只能从其生成 ssh
    密钥的机器进入服务器是非常重要的。让我们看看如何生成 SSH 密钥来访问服务器：`ssh-keygen -t rsa`。一旦生成了密钥，你可以使用以下命令将密钥添加到你想访问的服务器上：`cat
    ~/.ssh/id_rsa.pub`。


    如果服务器上有有多个用户，你可以给每个用户一个 `ssh` 密钥，以便他们从自己的系统访问服务器。你可以使用以下命令执行此：`cd /home/user1
    ls -ll`。


    出于安全考虑，为了确保只有部分用户访问 ssh 密钥，你可以配置 ssh 目录中的用户列表。你可以使用以下命令执行此：

    ```

    mkdir .ssh

    cd /home/admin/.ssh

    vim authorized_keys

    ```

    你也可以创建一个公共 SSH 密钥并在更改所有者之前将其添加到配置文件中。要执行此操作，运行以下命令：`chown user1 authorized_keys`。


    如果你不想使用 SSH 密钥，则需要禁用 SSH 登录。要执行此操作，你需要使用以下命令编辑配置文件：

    ```

    Edit /etc/ssh/sshd_config

    Passwordauthentication no

    PermitRootLogin no

    ```

    一旦执行此操作，你就可以确保只有授权用户可以使用命令：`ssh user-name@serverIP -p(port Number)` 进入服务器。


    ## 使用 fail2ban

    如果你想使用一个应用程序来查看频繁被攻击的服务器，可以使用 `fail2ban`。该程序还会你发生在服务器上的任何攻击。`fail2ban` 会更改防火墙配置，并根据攻击类型永久或永久地阻塞
    IP 地址。如果你想在系统上安装 `fail2ban`，请运行以下命令：`sudo apt install fail2ban -y`。然后你需要使用以下命令复制配置文件：`cp
    /etc/fail2ban/jail.conf /etc/fail2ban/jail.local`。如果你没有 `jail.local` 文件，你需要创建它。然后使用以下命令对
    `/etc/fail2ban/jail.local` 进行所需的更改：

    ```

    [sshd]

    enabled = true

    port = ssh

    protocol = tcp

    filter = sshd

    logpath = /var/log/secure

    maxretry = 3

    findtime = 600

    bantime = 600

    ```

    在重启应用程序之前，你需要设置 `bantime` 为 `-1`。一旦执行此操作，你可以使用以下命令重启应用程序：`sudo service fail2ban
    restart`。这很简单。应用程序将继续检查系统日志文件并查找攻击。如果你想查看此列表，使用以下命令：`sudo fail2ban-client status`。你也可以使用
    `fail2ban` 登录 SSH。你需要定期更新应用程序，以便你可以访问服务器。


    ## 创建新账户

    你现在应该创建一个用户账户。请记住不要使用 root 账户登录服务器。你也可以创建自己的账户。如前所述，你应该创建一个具有 `sudo` 权限的账户，你可以使用
    `sudo` 账户访问服务器。


    ## 上传 SSH 密钥

    当你创建一个新服务器时，你需要 SSH 密钥来访问服务器。如果你想使用预生成的密钥，执行此操作请运行以下命令：`ssh-copy-id <username>@ip_address`。你现在可以使用
    SSH 密钥避免登录时使用密码。


    ## 安全 SSH

    一旦执行了此操作，你需要进行以下更改：

    1. 移除 SSH 协议的密码认证

    2. 不允许用户远程访问 root 账户

    3. 同样限制对 IPv6 的访问并使用 IPv4


    要执行此操作，你需要更改 SSH 配置文件。当你打开文件时，你会发现以下代码：

    ```

    PasswordAuthentication yes

    PermitRootLogin yes

    ```

    你需要更改它，使其看起来如下：

    ```

    PasswordAuthentication no

    PermitRootLogin no

    ```

    然后你需要限制 SSH 服务使用的是 IPv4 或 IPv6。你可以通过更改配置文件中的 `AddressFamily` 选项来实现。如果你想将其更改为仅使用
    IPv4，执行以下更改：`AddressFamily inet`。


    只有在重启 SSH 服务时，你的更改才会反映在服务器上。请记住，在重启 SSH 服务器之前，你应该有一个活跃的服务器连接。如果重启没有按计划进行，你可以修复任何出现的问题。如果你使用
    Ubuntu，可以运行以下命令来重启服务。如果你使用任何带有 Systemd 配置的 Linux 发行版，运行以下命令：`sudo systemctl restart
    sshd`。


    ## 创建防火墙

    在上一章节中，我们看了如何在系统上安装、启用和配置防火墙，使其仅允许允许的网络流量访问服务器。根据你的编程水平，你也可以使用简单的防火墙。如果你不会编程，请使用
    `ufw`。你可以使用以下命令在你的系统上安装它：`sudo apt install ufw`。


    `ufw` 防火墙默认拒绝任何入站连接并允许所有流出流量。这意味着系统或服务器上的所有工具和应用程序都可以连接互联网，但任何外部尝试连接服务器，它将不允许。你需要使用以下命令确保你的服务器可以访问
    HTTPS、HTTP 和 SSH 协议：

    ```

    sudo ufw allow ssh

    sudo ufw allow http

    sudo ufw allow https

    ```

    执行此操作后，你应该使用以下命令启用防火墙：`sudo ufw enable`。你还需要检查哪些服务和应用程序被 `ufw` 允许或拒绝：`sudo ufw
    status`。如果你不想使用防火墙，应该输入以下命令：`sudo ufw disable`。或者，你可以使用上一章节中讨论的防火墙接口。

    '
