    screen on your system. You need to log in using the root account you had initially
    set up and finally access Kali Linux.USB Drive InstallationYou can use a USB drive,
    thumb drive, or stick to install Kali Linux. This is a storage device, and you
    can plug this into the port of your system. It is recommended for you to use a
    USB drive with at least 10 GB storage space or more if you want to install Kali
