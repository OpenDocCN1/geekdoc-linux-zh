    ‘New’ option from the menu. This will appear once you select the partition menu
    available in the Menu bar. The following are the steps you need to follow, and
    they may vary depending on the machine you use:●      The unallocated space in
    the drive is greyed out●     You should now select the new option from the partition
    using the drop-down menu●     You can specify the size of the drive using a graphical
    slider●     Now, choose the file system and update it to ext4●     Select the
    add option and click on the drop-down menu. You need to select the option to apply
    all the operations on your system●     When you see a prompt, click ok, and the
    settings will updateYou can add a persistence function to the USB drive using
    the following commands.mkdir /mnt/usbmount /dev/sdb2 /mnt/usbecho "/ union" ..
    /mnt/usb/persistence.confumount /mnt/usbThat is it. You have now created a persistent
    Live Kali Linux USB. Reboot your system and you should be able to boot the Kali
    Linux operating system from the USB drive.Chapter Eleven: The Penetration Testing
    Life CycleAs a system administrator, you need to perform penetration testing in
    your organization to ensure you have the right security enabled in your network
    and server. In this chapter, we will look at the different stages used in penetration
    testing. Using this chapter, you will learn more about system administrators''
    different tools and the processes they need to follow during each stage. This
    way, you will understand the five stages of the penetration testing lifecycle
    and have an idea of the tools used by security professionals while engaging in
    penetration testing.The Five Stages of the Penetration Testing Life CycleIn this
    section, we will look at the five stages in the penetration testing lifestyle,
    and the information is broken down easily to help you understand what exactly
    is expected out of you during each stage.Stage 1: ReconnaissanceThis is the first
    step in the penetration testing phase. Let us assume you are running a military
    operation. The officers and analysts are going through the foreign territory map,
    and others in a different room are looking at the news and trying to see what
    can be done to take down the enemy. Another group is working on the information
    they need to collect to ensure the team can move into the enemy territory and
    make it their own. You need to do this when you work on a penetration test during
    your ethical hacking process.If you do not have the expertise to run a penetration
    test, the organization will hire a team to perform this test. During this phase,
    you need to discover the information about the target system and also gather information
    about the system using public and private sources. You can do this easily by looking
    for information about the Internet since most information is publicly available.
    During this stage, you need only to understand what is present in the target’s
    network and server. You do not breach the network and server since you only have
    to scan and document the information you will need while performing the next few
    steps.Stage 2: ScanningLet us consider that you are on a military mission with
    a team of people, and there is a hilltop you need to reach. This hilltop is behind
    your enemy lines, and one of your soldiers is hidden in the bushes. This soldier
    will come back and give you information about the enemy camp. The objective of
    this mission is for you to determine the type of activities the enemy is performing.
    This soldier will also tell you about the different ways you can move into enemy
    land and the security that is around the camp.This soldier was told what he needed
    to do for him to get the information he needed. He was told what he had to look
    at. This is exactly what you do in the reconnaissance stage. You gather information,
    and it is this information you use during the scanning stage to determine which
    server and network you need to scan to find any vulnerabilities. You can use various
    tools to scan the target network, and Kali Linux comes with in-built options.
    You need to use the information you collect during this stage during the exploitation
    phase to determine which areas you need to exploit so that you can extract information.Stage
    3: ExploitationIf you are performing the penetration testing with a team, you
    need to ensure you move through the network and server easily without being detected.
    You also need to find a way to enter the server without getting caught. You need
    to find the right gaps in the server and enter the system and network through
    the server''s open door. You also need to spend time inside the server and see
    what information you can extract from the system. You need to do this during the
    exploitation stage. The objective is to ensure you quickly enter and exit the
    network and server with the information you need without being detected by anybody.
    During this stage, you need to exploit the system and find sensitive information
    about the business. You can do this repeatedly if you need to.Stage 4: Maintaining
    AccessWhen you perform the penetration test, you must ensure you have unlimited
    access to the servers and network you are using. You need to ensure there is access
    to all the information you need. As the system administrator, you need to find
    a way to keep access while you discover how to enter the target system and network.
    You also need to find a way to exploit the server and see what information you
    can obtain or access through the network. You also need to find a way to get in
    and out of the system without getting caught. Therefore, with the information
    gathered in the exploitation state, they automate a way to keep their access continued
    to the target system.Stage 5: ReportingWhen you perform penetration testing on
    your system and server, you need to stand in front of the entire team and the
    higher-ups to tell them what you learned from the penetration test you performed.
    You need to explain every step and detail everything you found during the test.
    You need to expand the details of your findings. At the end of the penetration
    testing lifecycle, you also need to prepare a report which explains each phase
    of your penetration test. You need to explain the loopholes discovered, the vulnerabilities
    exploited and the servers, networks and systems targeted during the test. In some
    cases, you may need to provide information about the findings. You need to ensure
    management will look at the different means they can use to protect their servers
    and networks.Chapter Twelve: ScanningIn this chapter, you will learn about the
    second stage of penetration testing, and this is the most important step since
    you will learn more about how to scan the servers and see what can be done to
    identify any vulnerabilities. In this stage, you need to take input from the discoveries
    made during the reconnaissance stage and gather information about the operating
    system and the users who use the information on that system. When you perform
    the testing as a system administrator, you can move back to the reconnaissance
    stage to see if there is any new information you need to obtain about the processes
    and people.This stage''s objective is for you to scan the information in the network
    and server and identify the information about the target. You can learn more about
    your information and network systems. During this stage, you need to focus on
    obtaining information about live hosts, device types(laptop, desktop, router,
    mobile, etc.), operating systems, software, public-facing services offered(SMTP,
    FTP, web applications, etc.). You can use this stage to remove any basic vulnerabilities
    in the system. These vulnerabilities are easy for one to detect during the scanning
    stage. You can use different tools in the scanning process, but we will look at
    the main tool Nmap that is used to perform this process. This stage''s objective
    is for you to gather the information you can pass onto the next step of the ethical
    hacking process.Network TrafficYou need to learn more about network traffic and
    how it works for you to understand the different tools and processes used in this
    stage. The communication which takes place between two devices over a network
    can only happen because of network traffic. The most popular modes of network
    traffic are wireless ethernet and wired ethernet. In this section, we will look
    at the main aspects of network traffic: firewalls and ports, and see how you can
    use them to improve your systems'' security.Firewalls and PortsOne of the main
    reasons why organizations have firewalls is to protect the systems, network, and
    server used to transfer information. You can protect the internal server and network
    on your system and server to ensure the communication between external and internal
    networks is secure. A firewall can is software or hardware which has rules to
    serve as a gatekeeper to a network. The firewall has access controls defined in
    them, enabling you to monitor the inbound traffic called outbound and ingress
    traffic. This is termed egress. The traffic that satisfies these rules ensures
    the firewall is never dropped or discarded during a hack. This is done by opening
    and closing ports on the firewall that allow or reject traffic.We have looked
    at what ports are and how they are used and adjusted in the Linux operating system
    earlier in the book.PINGPing is an ICMP-based application to which you and every
    other user in the system or server is exposed to. When you use the ping command,
    you can send a code 0 and type 8 packet, indicating that the packet was just an
    echo. Systems that receive this package will instantly respond with a type 0 code
    0 packet, an echo reply. A successful ping indicates to the system that the ping
    was made only on a live network. This means that you are working out of a live
    host. When you use the ping command, you can use the Windows command prompt. The
    ping will send the request at least four times by default. If you use this ping
    in the Linux terminal, the command will continue to run until you interrupt it.Let
    us look at a successful and unsuccessful ping command.If the host being pinged
    is LivePing 192.168.1.1Pinging 192.168.1.1 with 32 bytes of data:Reply from 192.168.1.1:
    bytes=32 time=2ms TTL=64Reply from 192.168.1.1: bytes=32 time=1ms TTL=64Reply
    from 192.168.1.1: bytes=32 time=1ms TTL=64Reply from 192.168.1.1: bytes=32 time<1ms
    TTL=64If the host is unreachablePing 192.168.1.200Pinging 192.168.1.200 with 32
    bytes of data:Reply from 192.168.1.129: Destination host unreachable.Reply from
    192.168.1.129: Destination host unreachable.Reply from 192.168.1.129: Destination
    host unreachable.Reply from 192.168.1.129: Destination host unreachable.Ping statistics
    for 192.168.1.200:Packets: Sent 5 4, Received 5 4, Lost 5 0 (0% loss)TracerouteIf
    you use the traceroute command, you will see that the ICMP ping command is used
    to determine the number of devices that lie between the system and the network.
    This is one way for it to initiate the trace on the target system. The traceroute
    command functions by manipulating the Time To Live value of a network packet,
    also known as TTL. This term indicates the number of times a packet of data is
    moved through a network and is broadcasted repeatedly by the host before the packet
    of data expires.On Linux-based systems, the command to run a traceroute is traceroute.
    If you want to run the command on Windows, you can do it to check the vulnerabilities
    in the system and network. Let us take an example of a traceroute to google.comtracert
    www.google.comTracing route to www.google.com [74.125.227.179]over a maximum of
    30 hops:1 1 ms<1 ms 1 ms 192.168.1.12 7 ms 6 ms 6 ms 10.10.1.23 7 ms 8 ms 7 ms
    10.10.1.454 9 ms 8 ms 8 ms 10.10.25.455 9 ms 10 ms 9 ms 10.10.85.996 11 ms 51
    ms 10 ms 10.10.64.27 11 ms 10 ms 10 ms 10.10.5.888 11 ms 10 ms 11 ms 216.239.46.2489
    12 ms 12 ms 12 ms 72.14.236.9810 18 ms 18 ms 18 ms 66.249.95.23111 25 ms 24 ms
    24 ms 216.239.48.412 48 ms 46 ms 46 ms 72.14.237.21313 50 ms 50 ms 50 ms 72.14.237.21414
    48 ms 48 ms 48 ms 64.233.174.13715 47 ms 47 ms 46 ms dfw06s32-in-f19.1e100.net
    [74.125.227.179]Trace complete.You can use different tools on Kali Linux to run
    these traces, and these tools use the ICMP, TCP, and UDP protocols to scan the
    target systems and networks. The result of a successful scan will give you information
    such as operating systems, network hostnames, IP addresses, and services operated
    on the network. Some scanning tools can also be used to discover any vulnerabilities
    in the server and network. The details gathered in the scanning stage can be used
    in the exploitation stage to attack specific targets.Nmap: The King of ScannersThe
    Nmap scanning tool is one of the most popular scanning tools used by system administrators
    since it is the easiest way to help you list down all the active hosts present
    on the target network. You can also use it to determine operating systems, services,
    ports, and even user credentials in some cases. This tool uses a combination of
    options, switches, and commands to find the details and vulnerabilities in your
    system during the scanning stage of this lifecycle.Timing OptionsWe have learned
    above that the default timing option in the Nmap scan does not specify anything,
    but you can use the default value or choose from one of the options below. There
    is a feature in Nmap through which the user can specify the timing option he wants
    to use. This option can be used to override the default time option used in the
    tool. You can either choose to expedite the process or slow the process down if
    you need to.Using this timing template, you can enable various settings, especially
    the one where you add a delay between the scanning and parallel processing of
    the ports. The different timing templates can be explained using the options scan_delay,
    max_scan_delay, max_parallelism. We can use these options to measure every timing
    template so that an appropriate timing template is used for scanning a target
    network.You can use the can_delay option if you need to set the probes in the
    target system to a minimum number. You can use the max-scan_delay to define the
    scanner''s maximum time between delays made while scanning the ports and IP addresses
    in the server and network. If you ask why this is important, it is because certain
    systems respond to probes only at a specific rate. When you use these options,
    you will adjust to the different probes and find a way to meet the system''s requirements
    that you are scanning. The max_parallelism option allows Nmap to send scan probes
    one at a time or in serial or in parallel. Let us look at the different timing
    options you can use in the Nmap tool.-T0 ParanoidWhen you use this timing option,
    the scan is performed slowly, and the network links are slow. You may get detected
    when you run these scans on your Linux network or server. Using this timing option,
    the scan will work serially and pause every 5 minutes. The max_delay setting is
    ignored during the scan when you use this timing template since the base scan_delay
    has a higher value than the default.-T1 SneakyThis timing method is used to perform
    a sneaky scan of the network and server. This is better and slightly faster than
    the previous timing by maintaining your discretion. This scan also serially scans
    the target system but reduces the scan_delay to about 15 seconds. The scan_delay
    is reduced in number, but since the value is higher, Nmap will ignore max_scan_delay.TargetThe
    target used in an IP address is an important part of the Nmap command string used,
    and if you end up using an incorrect target, you may end up scanning empty IP
    systems or spaces. You cannot do this as per the regulations. There are several
    ways to set a target for the Nmap scan, and we will look at the two common methods
    used to do this: IP address range and scan list.IP Address RangeUsing IP Address
    ranges to define targets in the system is an easy process to define the range
    or port you want to use. Let us take an example of a class C IP address range
    for our example. If you use the C IP address, you can run the scan on 254 different
    hosts. To do this, you can use the command below. Using this, you can scan all
    the hosts on a particular IP address range belonging to class C.nmap 10.0.2.1
    -255You can use the Classless inter-domain routing (CIDR) to run the same scan
    on the server or system''s ports. CIDR is a quick way to specify an IP address
    range, but this is something beyond this book''s scope.nmap 10.0.2.1/24If the
    IP address being used is very small, you can use a smaller range to define the
    target used in the scan. For instance, if you want to scan the IP addresses within
    the range, you can use the following command: nmap 10.0.2.1 -50Scan ListYou can
    use text files as inputs when you need to use the Nmap command to scan the list.
    The file will include the IP addresses which are present in your target server
    or system. You can choose to use the following IP addresses and store them in
    the target text file if you need to.10.0.2.110.0.2.1510.0.2.5510.0.2.100The syntax
    of the above command is as below:nmap -iL target.txtPort SelectionThe Nmap command
    structure allows you to determine the ports you want to use by using the -p switch.
    This will help you determine the port you want to scan.  You can either specify
    a single port or a range of ports depending on what you need to scan.nmap -sS
    -p 1-100nmap -sU -p 53, 25, 143, 80You can also choose to combine both commands
    like the example below: nmap -sS -p 1-100, 53, 25, 143, 80Output OptionsThe results
    of a scan you perform on the network and servers will scan the Nmap command results.
    You can print the information on the terminal window, but it is not always a good
    idea to do this. As the administrator, you need to save the file down with the
    output, so you can use it to determine how to remove any vulnerabilities in the
    system. You can redirect the output from the scan and send it to a file. There
    are some built-in commands you can use if you prefer, and this allows you to redirect
    the output and move it onto a file. Let us go with each of these options.-oN Normal
    OutputYou can use this output option to create a normal text file to ensure the
    output is stored in the form of a text file. You can use this file to evaluate
    the output. You can also use it as an input key for other programs: nmap -oN output.txt
    10.0.2.111-oX Extensible Markup Language(XML) OutputSome applications and tools
    use XML files as their input when they perform a penetration test, and therefore,
    this option is extremely easy to use. You can also store the output in an XML
    format using the following command: nmap -oX output.txt 10.0.2.111-oS Script Kiddie
    OutputThe output files from a script kiddie attack cannot be used when you perform
    penetration testing, but these are a good way to determine how good the security
    in your network and server is. You cannot use the output from the following syntax
    for any industrial use.nmap -oS output.txt 10.0.2.111Nmap Scripting EngineYou
    need to learn how to build a custom script in Nmap if you do not want to use the
    built-in packages. If you are willing to use the preconfigured penetration tests
    in Nmap, you can use the following URL: [https://nmap.org/nsedoc/](https://nmap.org/nsedoc/)
    .For instance, you can use this script to fetch the MAC address and the NetBIOS,
    each of which is important information you need for the target system. You can
    use the flag ‘—script’ as per the below example, along with the Nmap command followed
    by the script name.nmap --script nbstat.nse 10.0.2.111As a system administrator,
    you must ensure you have a script database and update it regularly. It is important
    for you to update the Nmap script as well every time you perform a new penetration
    test on your server or network. To do this, use the following command: nmap --script
    -updatedbConclusionIf you are a system administrator or engineer trying to learn
    more about Linux, then you found the right book. This book included all of the
    information you needed about Linux and how you can use it on your system or a
    virtual machine. You learned about the different distribution systems of Linux
    and how every distro differs from the other.This book covered the different ways
    to encrypt and decrypt information. It also provided information about the different
    methods you can use to secure the server and the files and folders in the network
    and system. You learned about the different ways to use an access control list
    to manage how users access the system. It is important to take care of the access
    users have to the server and network since these individuals play a key role in
    taking care of the system''s information. You learned more about the different
    ways to manage access control and discovered how you can manage privileges in
    the system. By the end of the book, you were able to learn to improve your network
    security, including the different methods you can use to test the system, and
    how to look for vulnerabilities.Now it’s time to dive in and keep your system
    up to date and safe!References7 Tools to Encrypt/Decrypt and Password Protect
    Files in Linux . (2015). Tecmint.com. https://www.tecmint.com/linux-password-protect-files-with-encryption/16
    Ways to Secure a Linux Server . (2019, March 26). Liquid Web. https://www.liquidweb.com/kb/security-for-your-linux-server/Access
    Control Lists(ACL) in Linux - GeeksforGeeks . (2018, May 2). GeeksforGeeks. https://www.geeksforgeeks.org/access-control-listsacl-linux/comments,
    08 O. 2019 P. H. M. F. 92up 6\. (n.d.). 7 steps to securing your Linux server
    . Opensource.com. https://opensource.com/article/19/10/linux-server-securityControlling
