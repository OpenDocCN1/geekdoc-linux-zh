    for each user

    2. Allow users to log in to the server only from specific devices and places at
    specific time intervals

    3. Use shadow passwords (we will cover this shortly)

    4. Use different forms of encryption, including `DES`, for passwords to ensure
    they cannot be detected through brute-force attacks

