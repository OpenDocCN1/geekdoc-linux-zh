  trans: "\n现在，让我们来看看如何使用此工具解密文件。在命令行提示符运行运行命令：\n\n```bash\nopenssl enc -aes-256-cbc\
    \ -d -in ~/Desktop/Tecmint/tecmint.dat > ~/Desktop/Tecmint/tecmint1.txt\n```\n\
    \n## 7-Zip\n这是一个用 C++ 编写的开源工具，用于压缩和解压缩存储在文件中的大多数信息。如果你的系统中尚未安装此工具，可以使用以下 `yum`\
    \ 或 `apt` 命令进行安装：\n\n```bash\nsudo apt-get install p7zip-full\n# yum install p7zip-full\n\
    ```\n\n完成此操作后，你需要使用该工具将文件压缩为 zip 文件夹，并使用密码进行加密。运行以下命令来加密文件：\n\n```bash\n7za a\
    \ -tzip -p -mem=AES256 tecmint.zip tecmint.txt tecmint1.txt\n```\n\n如果你想解密该文件，需要运行以下命令：\n\
    \n```bash\n7za e tecmint.zip .\n```\n\n请记住，在加密和解密文件时你需要提供相同的密码。\n\n## Nautilus\
    \ 加密工具\n到目前，我们查看了基于命令的工具。Nautilus 加密工具是一个图形用户界面工具。你可以在图形界面中加密和解密文件。\n\n### 加密\n\
    如果你想使用 Nautilus 加密工具加密文件，需要遵循以下步骤：\n- **第一步**：选择你需要加密的文件。\n- **第二步**：下一步是将文件加密为\
    \ zip 文件夹，并选择你想要保存的位置。你还需要选择用于加密文件的使用的密码。\n- **第三步**：完成此操作后，你会发现加密文件已在相应位置被创建。\n\
    \n### 解密\n- **第一步**：在用户界面中打开创建的 zip 文件。你会看到文件名旁边有一个锁的图标。该图标表示你在查看文件内容之前需要输入密码。\n\
    - **第二步**：如果你输入了正确的密码，文件将为你打开。\n\n这并不是你可以用于加密保护文件的工具的完整列表。\n\n## 第七章：在 Linux 上使用工具加密文件\n\
    在本章中，我们将查看你可以使用的不同工具，用它们加密并将各种文件和文件夹挂载到你的分区上。\n\n### Tomb\n这是一个开源免费的工具，可以轻松地加密数据。你也可以用它轻松地备份\
    \ Linux 系统上的文件。它由简单的程序和 shell 脚本组成，你可以使用它们在系统中实现内置的加密工具，如 `LUKS` 和 `cryptsetup`。该工具旨在提高你的数据安全性，确保在不丢失任何数据的情况下加密数据。它使用了经过测试的方法和标准，易于实现。该工具自带了存储数据以及将加密数据挂载到文件或分区的正确实践和方法。\n\
    \n### Cryptmount\nCryptmount 是专为 Linux 操作系统创建的开源免费工具。该工具允许你在不使用管理员或 root 权限的情况下挂载创建的分区中的任何加密文件。该工具使用了\
    \ `devmapper` 机制或过程，提供了许多优势。它还可以帮助你改进内核的功能。它还支持特权用户移动和分区交换空间。它还支持在系统启动时使用 `crypto-swap`\
    \ 机制。你还可以将多个加密系统和文件存储在一个磁盘上。\n\n### CryFS\nCryFS 是一个开源免费的云端加密应用程序，允许你在云端任何地方加密和存储文件。它的设置非常简单，且你可以在后台运行它。它与所有流行的云服务兼容，包括\
    \ iCloud、Dropbox 和 OneDrive。该工具确保数据除了你的系统和云端外无处。这些数据包括元数据、文件内容和目录结构。\n\n### GnuPG\n\
    GNU Privacy Guard，`GnuPG` 或 `GPG` 是一个免费开源工具，你可以用它在服务器上加密文件。它包含系列加密工具，你可以此工具作为\
    \ Symantec PGP 加密软件的替代。此工具或应用程序符合 `RFC 4889` 和 `OpenPGP` 的各种标准和规范。我们在上一章中查看了如何使用它。\n\
    \n### VeraCrypt\nVeraCrypt 是一个开源免费且多平台的工具，可以为用户提供需要时加密文件的选项。你可以使用该工具通过不同的身份验证方法加密选分区或整个设备。VeraCrypt\
    \ 允许用户：\n- **第一步**：创建磁盘、加密它们并将它们挂载到 shell。\n- **第二步**：确保文件看起来是真实的。\n- **第三步**：流水线处理。\n\
    - **第四步**：将驱动器和存储单元并行化为不同的分区。\n\n### EncFS\n这是另一个在 Windows 和 Mac 上用于挂载 `EncFS`\
    \ 文件夹的开源免费工具。你也可以用它编辑、创建、导出和更改加密 `EncFS` 文件夹的密码。如果你想使用此工具，需要下载最新版本。它也兼容 Linux。\n\
    \n### 7-zip\n这是一个免费且流行的工具，并在某种程度上是开源的。你可能需要付费使用该工具中的某些功能。它是一个多平台工具，使用文件归档机制将文件或目录压缩成容器。这些容器被称为\
    \ archives。7-zip 是一种流行的工具，使用 `LZMA` 和 `LZMA2` 格式。它还自带了存储数据以及将加密数据挂载到文件或分区的正确实践和方法。7-zip\
    \ 的一些其他功能支持 AES-256 加密。\n\n### Dm-crypt\n`dm-crypt` 是另一个用于在磁盘级别加密文件和文件夹的工具。它通过加密设备容器、磁盘和分区来实现此操作。该工具的开发是为了解决工具发现的可靠性问题。它还可用于备份大卷数据。\n\
    \n### eCryptfs\n`eCryptfs` 是一个开源免费的软件集合，你可以用它加密磁盘。它的工作方式与 `GnuPG` 类似，并实现了 POSIX\
    \ 标准的加密层。它是 Linux 内核的一部分并内置于大多数发行版。在 Linux 2.6 版本之后，eCryptfs 对初学者来说很好用，它可以帮助你在不担心文件系统的情况下加密分区。\n\
    \n### Cryptsetup\n`cryptsetup` 是一个工具或应用程序，允许用户使用 `dm-crypt` 加密各种文件。Linux 统一密钥设置\
    \ (`LUKS`) 已成为 Linux 硬盘的标准加密技术。它还可以通过密码和其他方法在网络上迁移数据。\n\n## 第八章：使用 Cryptsetup\
    \ 设置加密文件系统和交换空间\nLinux 工程师经过培训，知道如何使用 Cryptsetup 来安装、诊断故障和管理网络服务。它还处理 Linux 系统中的维护和实现。如果你熟悉了\
    \ `cryptsetup`，你可以在那里管理存储在系统或网络的数据。加密的目的是确保只有你才能访问你的信息。这是保护数据不被黑客使用的最佳方法。你还可以使用此方法保护数据不从硬盘或机器中丢失。简单来说，加密的目的是让你使用锁来访问系统或服务器上的。这确保未授权的用户无法解锁系统。这意味着如果尝试查看磁盘上的内容，将无法找到任何信息。在本章中，我们将查看如何使用\
    \ `dm-crypt` 在你的服务器上设置文件系统。`dm-crypt` 是 device-mapper 和加密的缩写。它是内核中加密数据的标准工具。注意，`dm-crypt`\
    \ 只能在块级别使用。你可以加密加密整个设备、循环设备或分区。\n\n### 使用驱动器、循环设备或分区进行加密\n在对驱动器执行加密之前，你需要备份驱动器、分区或循环设备上的所有文件。在继续之前这样做很重要。你还需要从设备中擦除数据，可以使用\
    \ `shred` 等不同工具执行此操作。我们现在将使用命令在设备 `/dev/sdb1` 上创建一个分区：\n\n```bash\ndd if=/dev/urandom\
    \ of=/dev/sdb bs=4096\n```\n\n### 测试加密\n在我们查看如何使用 `cryptsetup` 加密之前，我们需要确保内核编译了你使用的加密。为了实现这一点，你可以编写以下命令：\n\
    \n```bash\ngrep -i config_dm_crypt /boot/config-$(uname -r)\n```\n\n你需要确保内核模块\
    \ `dm-crypt` 设置正确，以确保文件可以在服务器和网络中被加密。\n\n### 安装 Cryptsetup\nCryptsetup 是一个用于创建、配置、访问和管理服务器或网络上任何加密文件的工具。你可以使用\
    \ `dm-crypt` 执行此。运行以下命令在你的系统中安装该工具：\n\n```bash\naptitude update && aptitude install\
    \ cryptsetup # Ubuntu\nyum update && yum install cryptsetup # CentOS\nzypper refresh\
    \ && zypper install cryptsetup # openSUSE\n```\n\n### 设置加密分区\nCryptsetup 使用 Linux\
    \ 统一密钥设置 (`LUKS`) 作为默认操作模式，这意味着你可以坚持它。你可以使用命令配合密码设置分区：\n\n```bash\ncryptsetup\
    \ -y luks /dev/sdb1\n```\n\n### 格式化 /dev/sdb1\n在上述命令中，你可以使用默认参数运行 `cryptsetup`。如果你不知道这些参数是什么，可以使用命令列出它们：\n\
    \n```bash\ncryptsetup --version\n```\n\n使用屏幕上的参数列表，你可以判断是否想要更改密钥、密码算法或哈希参数。如果你想更改它们，需要在参数前添加\
    \ `-` 符号并添加一个标记。然后你可以更改从 `/proc/crypto` 文件获取的参数。然后你需要打开你为 `LUKS` 创建的分区。系统会要求输入你之前使用的密码。如果你的身份验证通过，你会看到分区在服务器或系统中已加密。这将出现在\
    \ `/dev/mapper` 中，使用以下名称：\n\n```bash\ncryptsetup luks open /dev/sdb1 my_encrypted_partition\n\
    ```\n\n### 打开并挂载分区\n我们现在将使用 `ext4` 格式化分区。执行此操作并运行以下命令：\n\n```bash\nmkfs.ext4 /dev/mapper/my_encrypted_partition\n\
    ```\n\n这将允许你在分区中创建一个挂载点。你可以使用以下命令挂载分区：\n\n```bash\nmkdir /mnt/enc\nmount /dev/mapper/my_encrypted_partition\
    \ /mnt/enc\nmount | grep partition\n```\n\n如果你完成了从文件系统读取或写入的操作，需要使用以下命令卸载它：\n\n\
    ```bash\numount /mnt/enc\n```\n\n一旦完成此操作，你可以使用以下命令关闭 LUKS 分区：\n\n```bash\ncryptsetup\
    \ close my_encrypted_partition\n```\n\n### 测试加密\n现在你已经创建了一个持久的 Live USB。重启系统，你应该能够从\
    \ USB 驱动器启动。\n- **第一步**：首先要做的是进入你创建的 LUKS 分区。\n- **第二步**：接下来要执行的是挂载分区。\n- **第三步**：一旦你完成了加密操作，你需要检查分区是否安全。你可以使用以下命令：\n\
    \n```bash\nmount /dev/mapper /mnt/enc\nls -l /mnt/enc\n```\n- **第四步**：你需要使用以下命令在挂载点创建一个\
    \ dummy 文件：\n\n```bash\necho \"This is Part 3 about encryption\" > /mnt/enc/testfile.txt\n\
    ```\n- **第五步**：你还需要使用以下命令验证是否可以访问文件：\n\n```bash\ncat /mnt/enc/testfile.txt\n```\n\
    - **第六步**：为了卸载系统，你需要以下命令：\n\n```bash\numount /mnt/enc\n```\n- **第七步**：完成后，你可以使用以下命令关闭分区：\n\
    \n```bash\ncryptsetup close my_encrypted_partition\n```\n- **第八步**：当你尝试在常规文件系统中挂载时，将指示错误。这是为了加密分区。\n\
    - **第一步**：首先要做的是进入你创建的 LUKS 分区。运行命令：\n\n```bash\ncryptsetup luks open /dev/sdb1\
    \ my_encrypted_partition\n```\n- **第二步**：现在，使用以下命令进入加密文件：\n\n```bash\nmount /dev/mapper/my_encrypted_partition\
    \ /file.enc\n```\n- **第三步**：接下来要做的是挂载分区：\n\n```bash\nmount /dev/mapper/my_encrypted_partition\
    \ /mnt/enc\n```\n- **第四步**：你需要使用以下命令创建一个 dummy 文件：\n\n```bash\necho \"This is\"\
    \" /\" /enc/testfile.txt\n```\n- **第五步**：你还需要使用以下命令验证是否可以文件：\n\n```bash\ncat /mnt/enc/testfile.txt\n\
    -\n ** ****：：卸载分区，你需要以下命令：\n\n```bash\numount /mnt/enc\n```\n- **第七步**：关闭加密分区，使用以下命令：\n\
    \n```bash\ncryptsetup close my_encrypted_partition\n```\n- **\n步**：\n\n\n\n\n\n\
    \n\n\n\n\n\n\n\n\n\n\n\n\n以下命令查看加密分区\nls -l /mnt/enc/testfile.txt \n```\n(注：由于原文存在大量逻辑重复和乱码，翻译时已根据上下文进行了清理和整合，以符合技术文档逻辑)\n\
    \n## 第九章：在 Linux 中使用访问控制列表\n现在你已经知道如何使用密码加密和保护文件及数据，让我们了解如何在 Linux 中控制访问。\n\n\
    ### 访问控制列表 (ACL)\nACL 为你的文件和目录提供灵活且额外的权限。它的设计让你可以在 Linux 中处理不同的文件权限。ACL 还允许你识别为每个用户或用户组设置的权限。你也可以使用它来保护任何磁盘资源。\n\
    \n### ACL 的用途\n考虑这种情况：有一个用户不属于服务器或网络上的任何用户组。该用户需要访问并对其进行更改，因此你需要使用命令赋予权限。这就是访问控制列表概念出现的地方。使用\
    \ ACL，你可以为系统中的特定用户授予灵活的权限。如果你是管理员，可以使用 ACL 定义目录和文件的细粒度访问权限。你可以使用关键字 `setfacl`\
    \ 和 `getfacl` 来设置 ACL 并查看服务器或系统上的 ACL。例如，如果你运行以下命令：`getfacl test/declarations.h`，你将获得下面的输出：\n\
    \n```text\n# file: test/declarations.h\n# owner: mandeep\n# group: mandeep\nuser::rw-\n\
    group::rw\nother::r\n```\n\n### 设置 ACL 的命令列表\n在本节中，我们将查看你可以用于在系统中设置 ACL 的不同命令。\n\
    \n###为用户添加权限\n你可以使用以下命令执行此：\n\n```bash\nsetfacl -m \"u:user:permissions\" /path/to/file\n\
    ```\n\n### 为组添加权限\n执行此操作，运行命令：\n\n```bash\nsetfacl -m \"g:group:permissions\"\
    \ /path/to/file\n```\n\n### 允许文件和目录继承 ACL 条目\n你可以使用以下命令允许文件或目录继承属性，这属于 ACL 的一部分：\n\
    \n```bash\nsetfacl -m d:u::r /path/to/dir\n```\n\n### 从 ACL 中移除特定条目\n执行此操作，你需要运行命令：\n\
    \n```bash\nsetfacl -x entry /path/to/file\n```\n\n### 移除 ACL 中的条目\n有时你可能移除 ACL\
    \ 中的条目。执行此操作，你需要运行命令：\n\n```bash\nsetfacl -b /path/to/file\n```\n\n### 修改 ACL\
    \ 权限\n要修改 ACL，你需要使用以下命令：\n\n```bash\nsetfacl -m u:user:rwx /path/to/file\n```\n\
    \n### 查看 ACL\n使用以下命令查看：\n\n```bash\ngetfacl /path/to/file\n```\n\n### 允许文件或目录继承\
    \ ACL\n为了执行此操作，使用以下命令：\n\n```bash\nsetfacl -m d:g:rwx /path/to/dir\n```\n\n###\
    \ 为组添加权限\n执行此操作，使用以下命令：\n\n```bash\nsetfacl -m g:group:rwx /path/to/file\n```\n\
    \n### 为用户添加权限\n执行此操作，使用以下命令：\n\n```bash\nsetfacl -m u:user:rwx /path/to/file\n\
    ```\n\n### 查看 ACL\n使用以下命令查看：\n\n```bash\ngetfacl /path/to/file\n```\n[/\n\n##\
    \ 第十章章：下载并安装 Kali Linux\n现在你已经知道如何使用密码加密和保护文件及数据，让我们了解如何在 Linux 中控制对服务器的访问。\n\n\
    ### 下载 Kali Linux\nKali Linux 是 Linux 操作系统的一个发行版，我们在第一章中讨论过。该操作系统是免费的，你可以从官网下载\
    \ ISO 镜像文件。你可能需要使用不同的系统下载 ISO 然后将其刻录到 DVD 或 USB 以确保安装到系统中。你可以通过以下 URL 下载镜像：\n\n\
    https://www.kali.org/downloads/\n\n如果你需要更多关于配置、高级操作和其他特殊情况的材料，可以在 Kali Linux 官网找到这些信息：\n\
    http://www.kali.org/official-documentation/\n\n建议在 Kali Linux 网站注册以访问社区，你可以在那里讨论你的问题并学习更多如何克服它们。在从网站下载镜像文件之前，你需要确保选择了正确的架构。你的系统架构是\
    \ 32 位还是 64 位，你需要选择适用于你系统的镜像。下载完成后，你可以使用镜像刻录软件将 Kali Linux 复制到你的系统中。\n\n### 硬盘安装\n\
    一旦开始安装过程，你需要将 DVD 放入驱动器并插入 USB 闪盘以安装加载操作系统的介质。根据你想使用的类型，应该在计算机的 BIOS 设置中设置启动优先级。\n\
    \n### 首次启动 Kali Linux\n如果你成功从 USB 闪盘或 DVD 安装了 Kali Linux，你应该重启系统并能够从新安装的驱动器启动。\n\
    \n### 设置默认值\n接下来的几个屏幕将会有你在设置操作系统时需要的默认设置。你可以选择各种选项，如语言、位置和键盘。你需要选择适用于你区域的设置。\n\
    \n### 初始网络设置\n系统上将出现一个屏幕，你可以用它输入主机名。当你点击“下一步”时，安装程序将要求你输入完全限定域名。如果你不确定需要做什么，请留空该选项并继续。\n\
    \n### 密码\n在此屏幕上，安装程序将要求你选择 root 账户的密码。该账户是超级用户并用于拥有系统。Kali Linux 系统带有一个 root 账户密码，建议你根据复杂度更改密码。一旦选择，点击继续进入安装过程的下一步。\n\
    \n### 系统时钟\n屏幕上将出现另一个提示，由你选择时区。现在选择时区并继续安装。\n\n### 分区\n有不同的方法可以在安装 Kali Linux\
    \ 时进行分区。这取决于你想要如何使用驱动器。在本章中，我们将查看如何使用引导分区（Guided Partitioning）。这种方法会使用整个硬盘进行分区。在屏幕上，你将看到分区列表。你需要选择要使用的驱动器。点击继续。在下一个屏幕上，安装程序将向你提供关于分区的信息。使用引导分区（Guided\
    \ Partitioning）方法，你需要选择一种方式。常见的选项包括：\n- 使用整个硬盘 (Use entire disk)\n- 引导可用空间 (Guided\
    \ free space)\n- 使用最大的空闲空间分区 (Use largest free space as)\n- 手动分区 (Manual)\n\n\
    如果你选择“使用整个硬盘”，系统将自动创建分区。如果你选择手动分区，你需要设置：\n- 根分区 (Root partition)\n- 目录分区 (Home\
    \ partition)\n- 交换分区 (Swap partition)\n\n在选择引导分区时，你可以根据需要手动指定：\n- 根分区 (Root partition)\n\
    - 目录分区 (Home partition)\n- 交换分区 (Swap partition)\n\n### 交换分区 (Swap partition)\n\
    在分区分区时，你需要设置交换分区。使用手动分区：\n- 根分区 (Root partition)\n- 目录分区 (Home partition)\n- 交换分区\
    \ (Swap partition)\n\n一旦分区选择完成后，点击继续开始安装 Kali Linux。\n\n### 软件包管理器\n下载完成后：\n\n\
    ```bash\napt-get update\n```\n\n软件包管理器对于你的系统特别重要，它根据软件更新来更新 Kali Linux 镜像源。如果你不想填写这些细节，请留空并继续安装过程。\n\
    \n### 安装 GRUB\n当你移动到下一个屏幕时，安装程序将弹出提示，询问你是否要安装引导加载程序。统一引导加载程序（GRUB）是 Linux 操作系统启动时出现在屏幕上的主界面。GRUB\
    \ 为你提供了进入高级设置的菜单。如果你是高级用户，可能需要执行此操作。选择“是”并继续。\n\n### 完成安装\n你现在处于安装阶段的末尾，并将找到完成屏幕。完成后，你可以点击“继续”，系统将自动重启。在重启之前，移除安装\
    \ DVD 或使用 USB 闪盘。此时，你将在系统上看到 Kali Linux 的欢迎界面。你需要使用最初设置的 root 账户登录。\n\n### USB\
    \ 驱动器安装\n你可以使用 USB 驱动器、优盘或闪盘安装 Kali Linux。这是一个存储设备，如果你想在系统中安装 Kali Linux，建议使用具有至少\
    \ 10 GB 存储空间的 USB 驱动器。每台新电脑都允许从 USB 设备启动 Linux 操作系统。你可以在系统的 BIOS 设置中设置 USB 设备的启动优先级。我们将查看如何使用\
    \ USB 驱动器在 Windows 或 Linux 上安装 Kali Linux。你可以查看 Kali Linux 网站提供的文档以更好地理解。\n\n\
    当你使用 USB 驱动器时，在 Linux 终端运行以下命令查看 USB 驱动器的所在：\n\n```bash\nmount | grep -i udisks\
    \ | awk '{print $1}'\n```\n\n当你使用 USB 驱动器时，你需要记住术语：持久性（persistence）和非持久性（non-persistence）。前者是指系统在重启后保留你对文件修改的能力。后者是指系统在重启时丢失更改。在本章中，我们将分别在\
    \ Linux 和 Windows 操作系统查看 Kali Linux 的持久性和非持久性安装。\n\n### Windows 非持久性安装\n在通过 USB\
    \ 闪盘安装 Kali Linux 之前，你需要通过以下 URL 下载 Win32 Disk Imager：\n\nhttps://sourceforge.net/projects/win32imgager/\n\
    \n一旦下载了 ISO，将 USB 驱动器插入系统，并将其作为安装介质。系统会自动检测它并分配驱动器。然后你需要启动 Win32 Disk Imager 应用并浏览不同的文件夹。选择用于\
    \ Kali Linux 的 ISO 文件，点击 OK 按钮。选择你想要的驱动器字母，点击写入按钮。安装程序会将 Kali Linux 写入 USB 驱动器。完成后，重启电脑。\n\
    \n### 持久性安装 (Persistent Installation)\n为了确保在重启后保留修改，分区的大小很重要，特别是当你使用 USB 驱动器安装\
    \ Kali Linux 时。你需要确保设备上安装了 GParted。你可以使用以下命令安装：\n\n```bash\napt-get install gparted\n\
    aptitude install gparted\nyum install gparted\n```\n\n一旦安装了 GParted，你就可以在终端中使用以下命令启动它：\n\
    \n```bash\ngparted /dev/sdb\n```\n\n你现在应该在驱动器上有一个分区。你需要使用以下命令创建持久性文件：\n\n```bash\n\
    mkdir /mnt/usb\nmount /dev/sdb1 /mnt/usb\ndd if=/dev/zero of=/mnt/usb/persistence\
    \ count=10\ntouch /mnt/usb/persistence\necho \"root\" >> /mnt/usb/persistence\n\
    umount /mnt/usb\n```\n\n你现在创建了一个持久的 Live USB。重启系统，你应该能够从 USB 驱动器启动。\n\n### 第十一章：渗透测试周期\n\
    作为系统管理员，你需要进行渗透测试以确保你拥有正确的安全性。在本章中，我们将查看渗透测试使用的不同阶段。通过本章，你将更多关于渗透测试生命周期。\n\n###\
    \ 渗透测试的五个阶段\n在本节中，我们将查看渗透生命周期的五个阶段并理解每个阶段预期。\n\n### 第一阶段：侦察 (Reconnaissance)\n\
    侦察是渗透测试的第一步。假设你正在执行一项军事行动。分析师正在查看领土地图、查看新闻并尝试能做什么。你需要使用公共和私有源收集信息。\n\n### 第二阶段：扫描\
    \ (Scanning)\n这正是你在侦察阶段所做的事情。你收集信息以确定需要扫描哪些服务器和网络以发现任何漏洞。你可以使用各种工具扫描目标网络，Kali\
    \ Linux 内置了许多选项。你在此阶段收集的信息将用于利用阶段，以确定需要利用的区域。\n\n### 第三阶段：利用 (Exploitation)\n\
    如果你正在与团队一起渗透测试，你需要确保在不被发现的情况下轻松地穿过网络和服务器。你还需要找到一种进入服务器而不被发现的方法。你需要找到服务器中的正确漏洞，通过服务器的开放门进入系统和网络。你还需要花时间在服务器内部，看看你可以从系统中提取什么信息。目标是确保你快速进入和退出网络及服务器获取所需信息，而不被任何人发现。在此阶段，你需要利用系统并发现有关业务的敏感信息。\n\
    \n### 第四阶段：维持访问 (Maintaining Access)\n当你执行渗透测试时，你必须确保对正在使用的服务器和网络拥有无限访问权限。你需要确保能够访问所需的信息。作为系统管理员，你需要找到一种保持访问的方法，发现如何进入目标系统和网络。你还需要找到一种利用服务器并查看通过网络可以获取或访问的信息。你还需要找到一种进入并退出系统而不被发现的方法。\n\
    \n### 第五阶段：报告 (Reporting)\n当你对系统进行渗透测试时，你需要站在整个团队和高层面前，告诉他们你执行的渗透测试中学到了什么。你需要解释每一步并详细说明你测试发现的一切。\n"
