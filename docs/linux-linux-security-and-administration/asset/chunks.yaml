    ## Chapter Seven: Using Tools to Encrypt Files on Linux

    In this chapter, we will look at the different tools you can use to encrypt and
    mount various files and folders onto your partition.


    ### Tomb

    This is an open-source and free tool that can be used to encrypt data easily.
    You can also use it to back files on your Linux system easily. It consists of
    simple programs and shell scripts that you can use to implement in-built encryption
    tools on your systems, such as `LUKS` and `cryptsetup`. This tool aims to improve
    the safety of your data to ensure you encrypt the data without losing any data.
    It uses well-tested methods and standards. It is easy to implement. The tool comes
    with the right practices and methods to store data and mount encrypted data onto
    a file or partition.


    ### Cryptmount

    Cryptmount is an open-source and free tool that was created specifically for Linux
    operating systems. This tool allows you to mount any encrypted file in the partition
    created without using administrator or root privileges. The tool uses a `devmapper`
    mechanism or process, which offers numerous advantages. It also helps you improve
    the functionality of the kernel. It also supports the movement and partition of
    swaps for privileged users. It also supports the use of the `crypto-swap` mechanism
    when the system boots. You can also store multiple encrypted systems and files
    onto one disk.


    ### CryFS

    CryFS is an open-source and free cloud-based encryption application that allows
    you to encrypt and store files anywhere on the cloud. It is extremely easy for
    you to set up, and you can run it in the background. It works with all the popular
    cloud services, including iCloud, Dropbox, and OneDrive. The tool ensures there
    is no data anywhere but in your system and on the cloud. This data includes metadata,
    file content, and directory structure.


    ### GnuPG

    GNU Privacy Cloud, `GnuPG` or `GPG` is a free and open-source tool you can use
    to encrypt files on the server. It comes with a collection of cryptographic tools
    and you can use this tool as a replacement for Symantec’s PGP cryptographic software.
    This tool or application is compliant with the various standards and tracks specific
    to the `RFC 4889` and `OpenPGP`. We have looked at how this can be used in the
    previous chapter.


    ### VeraCrypt

    VeraCrypt is an open-source, free and multi-platform tool which can be used to
    provide any user with the option to encrypt the files whenever they need to. You
    can use the tool to encrypt selected partitions or an entire device using different
    methods of authentication. VeraCrypt allows users to:

    - **Step One**: Create disks, encrypt them and mount them onto the shell.

    - **Step Two**: Ensure the files appear like they are real.

    - **Step Three**: Pipeline.

    - **Step Four**: Parallelize the drives and storage units into different partitions.


    ### EncFS

    This is another open-source and free tool that is used on Windows and Mac to mount
    `EncFS` folders. You can also use it to edit, create, export, and change the encrypt
    `EncFS` folders'' password. If you wish to use this tool, you need to download
    the latest version. It is also compatible with Linux.


    ### 7-zip

    This is a free and popular tool and is open-source to an extent. You may have
    to pay to use some functionalities in the tool. It is a multi-source platform
    and uses a file archiving mechanism to compress files or directories into containers.
    These containers are termed as archives. 7-zip is a popular utility tool used
    because of the compression ratio using the forms `LZMA` and `LZMA2` with the `7z`
    format. It also comes with a plugin for a FAR manager and can be integrated with
    Windows. Some other features of 7-zip are AES-256` encryption.


    ### Dm-crypt

    `dm-crypt` is another tool used to encrypt the files and folders stored at the
    disk level. It does this by encrypting portable containers, disks and partitions.
    This tool was developed to address reliability and vulnerability issues found
    in the tool. It can also be used to back up large volumes of data.


    ### eCryptfs

    `eCryptfs` is an open-source and free collection of software and tools you can
    use to encrypt data on disks. It works like `GnuPG`, and implements a POSIX-compliant
    layer of encryption. It is part of the Linux kernel and comes installed with most
    distros. After the Linux 2.6 version, eCryptfs is easy for beginners to use since
    it helps you encrypt partitions and directories without worrying about the file
    system.


    ### Cryptsetup

    `cryptsetup` is a tool or application used to enable users to encrypt various
    files using `dm-crypt`, a kernel module with the Linux Unified Key Setup (`LUKS`).
    This has become a standard encryption technique used in the Linux hard drive because
    it is compatible with every distro. This also ensures that data can be migrated
    or transported through the network by securing the information through passwords
    and other methods.


    ## Chapter Eight: Using Cryptsetup to Setup Encrypted Filesystems and Swap Space

    A Linux Foundation Certified Engineer is trained and has the knowledge to handle
    Linux services. He will be trained to install, troubleshoot and manage network
    services in these systems. He also deals with the maintenance and implementation
    of the architecture used in Linux systems. If you are certified `cryptsetup`,
    you can do everything there to manage the data stored in the system or network.
    The objective of encryption is to ensure you have only people accessing your information,
    especially sensitive data. This is the best way to protect the data from being
    used by hackers. You can also use this method to protect the data from being stolen
    or lost from your hard disk or machine. In simple words, the objective of encryption
    is for you to use lock to access the information on your system or server. This
    is done to ensure the information only is available when you run the system. This
    ensures unauthorized users cannot unlock the system. This means if a person tries
    to look at the content on the disk he will not find any information. In this chapter,
    we will look at how you can use `dm-crypt` to set up a file system in your server.
    The term `dm-crypt` is short for device-mapper and cryptographic. This is the
    standard tool used for encrypting data in the kernel. It is important to note
    that `dm-crypt` can only be used at block-level. You can use it to encrypt the
    entire device, loop device, or partition.


    ### Using a Drive, Loop Device, or Partition for Encryption

    Before you perform encryption on your drive, you need to backup all the files
    on the drive, partition or loop device before you wipe the data in the chosen
    space. It is important for you to do this before you proceed further. You also
    need to wipe the data from the device used, and to do this, we will use the `dd`
    command. You can also perform these actions using different tools such as `shred`.
    We will now create a partition on the device, `/dev/sdb1`, using the command:


    ```bash

    dd if=/dev/urandom of=/dev/sdb bs=4096

    ```


    ### Testing the Encryption

    Before we see how we can use `cryptsetup` to encrypt files, we need to ensure
    the kernel is compiled of the encryption you use. To do this, you can write the
    following command:


    ```bash

    grep -i config_dm_crypt /boot/config-$(uname -r)

    ```


    You need to ensure the kernel module `dm-crypt` is set up correctly to ensure
    the files and systems can be encrypted in the server and network.


    ### Installing Cryptsetup

    Cryptsetup is a tool used to create, configure, access and manage any encrypted
    files on the server or network. You can do this using `dm-crypt`. Run the following
    commands to install the tool on your system:


    ```bash

    aptitude update && aptitude install cryptsetup # On Ubuntu

    yum update && yum install cryptsetup # On CentOS

    zypper refresh && zypper install cryptsetup # On openSUSE

    ```


    ### Setting the Encrypted Partition

    Cryptsetup uses Linux Unified Key Setup (`LUKS`) as the default operating mode,
    so this means you can stick to it. You can set the partition along with the passphrase
    using the command:


    ```bash

    cryptsetup -y luks /dev/sdb1

    ```


    ### Formatting /dev/sdb1

    In the above command, you can run the `cryptsetup` using some of the default parameters.
    If you do not know what these parameters are, you can list them using the command:


    ```bash

    cryptsetup --version

    ```


    Using the list of parameters on your screen, you can determine if you want to
    change the key, cipher, or hash parameters. If you want to change them, you need
    to add the symbol `-` before the parameter and add a flag to it. You can then
    change the parameter which you take from the file `/proc/crypto`. You then need
    to open the partition you have created for `LUKS`. You will be asked to enter
    the passphrase you used previously. If your authentication passes, you will see
    that the partition is encrypted in the server or system. This will be present
    inside `/dev/mapper` using the following name:


    ```bash

    cryptsetup luks open /dev/sdb1 my_encrypted_partition

    ```


    ### Opening and Mounting the Partition

    We will now save the partition using the format `ext4`. To do this, run the following
    command:


    ```bash

    mkfs.ext4 /dev/mapper/my_encrypted_partition

    ```


    This will allow you to create a mount point in your partition, which will help
    you mount the partition encrypted in the partition. You can also use the commands
    below to determine if the mount operation is successful:


    ```bash

    mkdir /mnt/enc

    mount /dev/mapper/my_encrypted_partition /mnt/enc

    mount | grep partition

    ```


    If you are done reading from or writing to the file system you have encrypted,
    you need to unmount it using the following command:


    ```bash

    umount /mnt/enc

    ```


    Once you do this, you can close `LUKS` partition using the following command:


    ```bash

    cryptsetup close my_encrypted_partition

    ```


    ### Testing Encryption

    Now that you have encrypted the file, you need to check if the partition or swap
    you encrypted is safe.

    - **Step One**: The first thing you need to do is enter `LUKS` partition you created.
    To do this, run the command:

    ```bash

    cryptsetup luks open /dev/sdb1 my_encrypted_partition

    ```

    - **Step Two**: Now, enter the passphrase you entered to encrypt the file.

    - **Step Three**: The next thing to do is to mount the partition using the following
    command:

    ```bash

    mount /dev/mapper/my_encrypted_partition /mnt/enc

    ```

    - **Step Four**: You need to create a dummy file in the mount point using the
    command:

    ```bash

    echo "This is Part 3 article about encryption" > /mnt/enc/testfile.txt

    ```

    - **Step Five**: You also need to verify if you can access and use the files you
    created in the mount point using the command:

    ```bash

    cat /mnt/enc/testfile.txt

    ```

    - **Step Six**: To unmount the system, you need to enter the command:

    ```bash

    umount /mnt/enc

    ```

    - **Step Seven**: Now that this is done, you can close the partition using the
    command:

    ```bash

    cryptsetup close my_encrypted_partition

    ```

    - **Step Eight**: When you try to mount the file in the regular file system, it
    will indicate error. If it does, you have done the right thing to encrypt the
    partition.


    ### Adding Additional Layers of Security

    You can also encrypt the swap space in the server to add another layer of security.
    When you enter a passphrase on your server to encrypt the partition in the server,
    it will be stored in the RAM when you switch your system on. If any hacker wants
    to use this key he can easily decrypt this information in the data. If you want
    to avoid leaving a copy of the accessible to hacker, you need to encrypt this
    swap layer using the process below:

    - **Step One**: Create a partition in the RAM, which will be used as swap. You
    need to maintain the right size and name this section as swap.

    - **Step Two**: Once you set this partition, you need to activate swap using the
    following commands:

    ```bash

    mkswap /dev/mapper/swap

    swapon /dev/mapper/swap

    ```

    - **Step Three**: You should now change the entry of swap in the file: `/etc/fstab`.
    To do this, use the following command:

    ```

    /dev/mapper/swap none 0 0

    ```

    - **Step Four**: The last thing you need to do is to save the file down and reboot
    the server. To do this, run the following command:

    ```bash

    mount -a

    ```

    - **Step Five**: When you reboot the system, you can verify if the swap space
    is active or not using the following command:

    ```bash

    cryptsetup status swap

    ```


    ## Chapter Nine: Using Access Control Lists in Linux

    Now that you know how to encrypt and protect your files and data using a password,
    let us understand how you can control access to the servers in Linux.


    ### Introduction to Access Control Lists (ACL)

    An ACL is one that provides flexible and additional permissions for your files
    and directories. It is designed so you can work with different file permissions
    in Linux. ACL also allows you to identify the permissions you need to set for
    each user or a group of users. You can also use it to protect any disc resource.


    ### Uses of ACL

    Consider a situation where you have a user who is not a part of any user group
    on the server or network. This user needs to access files and make changes to
    them, so you will need to give him access using commands. This is where the concept
    of Access Control Lists comes into the picture. Using ACLs, you can grant flexible
    permissions to specific users in the system. If you are an administrator, you
    can use an ACL to define the fine-grained access rights for directories and files.
    You can use the keywords `setfacl` and `getfacl` to set up an ACL and view the
    ACL on your server or system. For instance, if you run the following command:
    `getfacl test/declarations.h`, you will receive the output below:


    ```text

    # file: test/declarations.h

    # owner: mandeep

    # group: mandeep

    user::rw-

    group::rw

    other::r

    ```


    ### List of Commands to Set Up ACLs

    In this section, we will look at the different commands you can use to set up
    ACLs in your system.


    ### Adding Permissions to Users

    You can do this using the following command:

    ```bash

    setfacl -m "u:user:permissions" /path/to/file

    ```


    ### Adding Permissions to Groups

    To do this, run the command:

    ```bash

    setfacl -m "g:group:permissions" /path/to/file

    ```


    ### Allowing Files and Directories to Inherit ACL Entries

    You can use the following command to allow a file or directory to inherit the
    properties or privileges found in an ACL from the directory it is a part of:

    ```bash

    setfacl -dm "entry" /path/to/dir

    ```


    ### Removing a Specific Entry in the ACL

    To do this, you can run the command:

    ```bash

    setfacl -x "entry" /path/to/file

    ```


    ### Removing Entries in ACL

    There may be times when you might want to remove the entries in the ACL. To do
    this, you need to run the command:

    ```bash

    setfacl -m "u:user:rwx" test/declarations.h

    ```


    ### Modifying the ACL

    ### Adding Permissions for Users

    To do this, you need to enter either the username or ID of the user who you want
    to add. Use the following command:

    ```bash

    setfacl -m "u:user:permissions"

    ```


    ### Adding Permissions to Groups

    This is similar to what was done in the previous section. You can use the group
    name and ID to add permissions. Use the following command:

