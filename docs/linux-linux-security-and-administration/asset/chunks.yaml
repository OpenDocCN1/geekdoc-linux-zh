    在本章的所有示例中，我们将使用一个名为 `tecmint.txt` 的文件进行加密和解密。该文件位于系统的桌面上，如果需要，它将会被移动到不同的位置。在继续之前，让我们看看这个文件的内容。为此，请运行以下命令：


