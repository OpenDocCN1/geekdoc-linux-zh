  \n## 第一章：在虚拟机上使用 Linux\n如果你是 Linux 使用的新手，对你来说找到正确的信息将很困难。这本书包含了你所需的所有信息，帮助你安装操作系统，并向你展示你如何在你的系统或虚拟机中使用它。书中还包含了关于你如何配置用户访问和其他信息以维护网络和服务器的信息。法律声明：本书受版权保护。本书仅供个人使用。未经作者同意，你不得修改、分发、销售、使用、引用或转述本书的任何部分或内容。免责声明：请注意本文包含的信息仅供教育和娱乐之用。我们已尽一切提供准确、最新、可靠的完整信息。我们不提供任何形式的明示或暗示保证。读者承认作者并未提供法律、财务、医疗或专业建议。本书的内容源自各种来源。在尝试本书中列出的任何技术之前，请咨询获得执照的专业人士。通过阅读本文档，读者同意在任何情况下，作者对因使用本文档包含的信息而导致的任何直接或间接损失不承担责任，包括但不限于错误、遗漏或不准确。感谢购买本书。希望你学习更多关于\
  \ Linux 的知识以及如何保护你的文件和文件夹。\n\n### 安装 Workstation Player\n如果你想使用 Linux 但不想在你的系统上使用？如果你使用双系统，你的系统可能会遇到问题。最好的方法是在虚拟机中使用\
  \ Linux。如果你使用 Windows，操作过程是简单的。在本章中，我们将查看如何在虚拟机上安装和使用 Linux，特别是 Workstation Player。\n\
  \n### 选择正确的发行版\n由于有很多选项，你可能很难选择适合你系统的正确发行版。你如何知道哪一个最适合你？如果你想使用一个与 macOS 结构相同的发行版？在本节中，我们将查看供你使用的不同发行版。64\
  \ 位和 32 位的 Linux 版本在机器上运行良好。如果你不知道需要哪种发行版，请从下列表中进行选择：\n\n### Linux 发行版\n由于有很多选项，你可能很难选择适合你系统的正确发行版。你如何知道哪一个最适合你？如果你想使用一个与\
  \ macOS 结构相同的发行版？在本节中，我们将查看供你积极使用的不同发行版。这些发行版在过去几年中被个人积极使用。你还应该检查你使用的发行版是否使用安全补丁定期更新。\n\
  \n### Linux 发行版\nRed Hat Enterprise 该发行版与 Fedora 类似，但用于商业领域。该发行版为企业客户设计。你可以使用任何插件和变体。如果你想成为管理员，你需要通过认证。SUSE\
  \ Linux Enterprise 这种 Linux 发行版是为企业设计的，可以供业务使用。由于这个原因，这种变体易于使用不同的办公程序。你可以在各种设备上运行此发行版，它甚至可以在关键系统上使用。该发行版的许多版本在\
  \ Linux 网站上可用。\n\n### 游戏发行版\nSparkyLinux Game Over Edition SparkyLinux 有多个版本，但这个专注于游戏的版本最常用。这个游戏版本带有各种预装游戏、LXDE\
  \ 桌面、PlayOnLinux 和 Wine。该发行版上有许多高级和免费游戏，你可以轻松地使用。SteamOS 许多玩家已开始使用 Linux 作为他们的操作系统，因为它带有\
  \ Steam 客户端。如果你是一个玩家，安装 SteamOS 版本的 Linux 会更简单。你可以用于游戏的最佳 Linux 发行版之一是 SteamOS，它经过优化，可以在任何游戏中表现良好，并内置了音频驱动程序、专有图形界面和\
  \ Steam 客户端。\n\n### 通用 Linux 发行版\nUbuntu 是一个基于 Debian 的操作系统，使用 GNOME 作为桌面环境。你无法更新这个环境，因为它是默认的。这个\
  \ Linux 发行版有定期补丁更新，并在每个新版本不断改进。该操作系统的最新版本为混合、台式机和笔记本电脑设计。因此，如果你从 Windows 迁移到 macOS，你需要使用\
  \ Ubuntu 操作系统。openSUSE 该发行版是 Linux 为各种项目构建的通用操作系统，但主要用于 openSUSE 项目。该发行版由新手和丰富的\
  \ Linux 用户共同使用。该发行版带有一个名为 YaST 的管理程序，它可以控制和监控安装、包管理和其他功能。Fedora 该 Linux 发行版由 IBM\
  \ 拥有的 Red Hat 开发，使用默认的 GNOME 桌面环境。你可以切换到 LXDE、Xfce 桌面、Cinnamon、KDE 和 MATE 以及其他桌面环境。Fedora\
  \ 的某些变体（如 Fedora spins）可以供特定需求的人使用。Debian 是一个旧的 Linux 发行版，与其他 Linux 发行版相比是最好的版本。它也带有默认的\
  \ GNOME 桌面环境，但也可以用于 FreeBSD 内核。开发人员正在努力使其与其他内核（如 Hurd）兼容。某些 Linux 发行版（如 Raspbian\
  \ 和 Ubuntu）基于 Debian 的。Slackware Linux 是另一个专门为简单和安全构建的发行版。它是一个类 Unix 发行版，用于服务器和文件管理，因为它提供了\
  \ Web、FTP 和电子邮件服务器可用。如果你从未尝试过管理服务器或使用 Unix 服务器，你可以将此作为 live 光使用。Mageia 该 发行版由非营利社区开发，具有你应有的各种功能，默认桌面是\
  \ GNOME 和 KDE。SparkyLinux 这种 Linux 版本在开发者测试 Debian 版本时演进而来。这个版本的 Linux 带有自定义的 LXDE\
  \ 桌面，你可以轻松使用。Gentoo Linux 它可以满足多种需求，其性能和通用性使其成为 Linux 的最佳版本之一。Gentoo Linux 拥有 Portage，这是一个高级包管理系统。由于\
  \ Gentoo 可以用于不同的系统，你可以获得对系统的完全访问。社区操作系统 CentOS 是 Red Hat 社区构建的，是 Red Hat Enterprise\
  \ 的重构。这是一个免费版本。如果你不想与不同的发行版工作，可以使用这个。\n\n### 轻量级 Linux 发行版\nLinux lite 是一种占用资源极小的版本，基于\
  \ Ubuntu，具有非常小的 footprint。这些轻量级 Linux 发行版基于 Ubuntu，具有 Windows 风格的菜单让用户感到熟悉。该发行版资源较小，可以在\
  \ 512 MB RAM 和 700 MHz CPU 的设备上使用。Lubuntu 是另一个基于 Ubuntu 的轻量级版本，非常适合笔记本电脑或台式机。它使用轻量级环境并内置了应用程序。如果你想最大化你的设备效率，应该选择这个。Xubuntu\
  \ 是 Ubuntu 的一个衍生品，使用 Xfce 桌面，轻量级且优雅。你可以将其用于笔记本电脑和台式机。Puppy Linux 是一个较小的发行，可以在没有硬盘的情况下运行。这个版本非常适合旧笔记本电脑或电脑，可以使用它。Manjaro\
  \ Linux 是一种易于使用的、快速且轻量级的发行版，基于 Arch。这个版本使用了 Arch Linux 的优势，默认桌面是 Xfce，但你可以根据需要切换到其他选项。Arch\
  \ Linux 这种版本是考虑到用户体验而开发的，旨在保持简单易用。Arch 通过补丁定期更新。Arch 有 Pacman，这是一个自定义的包管理器。你想要自定义\
  \ Linux 系统？如果是，你应该使用这个发行版。Bodhi 是一个基于 Ubuntu 的操作系统，带有美观且轻量级的桌面。Bodhi 可以被自定义，并带有应用程序和主题。你可以使用这些来扩展基础操作系统。\n\
  \n\n\n\n\n### 1. 你正在使用的 Linux 发行版可能需要特定类型的操作系统\n### 2. 你的操作系统中可能缺少某些组件\n\n\n\n\n\
  你可以通过访问虚拟机的设置来轻松修复此问题。在这里你可以处理虚拟机的硬件，并以超出硬盘（HDD）限制的方式调整设置。你可以更改网络适配器配置、内存、处理器等。\n\
  \n在进行任何操作之前，你需要先查看处理器屏幕。你会发现一个关于虚拟化引擎的引用。当你在系统中安装虚拟机时，它会自动工作。如果你在出现问题时需要排查处理器，你需要设置\
  \ `AMD-V` 或 `Intel VT-x`。\n\n虚拟桌面设置中的内存 屏幕将帮助你解决内存性能问题。你的虚拟机将包含你需要使用的 `RAM` 详细信息。它会告诉你你在物理机和虚拟机上需要维护的设置。建议你坚持这些设置。如果你将内存大小减到推荐值以下或高于推荐值，可能会产生问题或减慢你的系统。这意味着你的系统无法按预期方式运行。\n\
  \n然后，你需要花时间处理显示设置。如果你愿意，可以坚持默认设置，但如果有问题，可以尝试调整 3D 加速开关。你可以根据用途对不同的显示器进行不同的设置。需要注意的是，你设置的某些模式可能会与你使用的不同桌面发生冲突。\n\
  \n如果你对更改感到满意，确认它们并点击播放按钮启动你的虚拟机。\n\n### 下载并安装工具\n现在你已经下载了虚拟机，应该重启它。你会被要求查看在此阶段可以下载并安装的各种\
  \ `VMware tools`。你只需要同意向导的说明，并让工具安装在你的虚拟机上即可。这些工具将提高你虚拟机的性能，允许你在客机和主机之间、以及虚拟机和物理机之间共享文件夹。\n\
  \n### 在 VMware 上安装 Linux\n当你启动虚拟机时，`ISO` 会直接进入你的现场环境，此版本的 Linux 是临时的，当你关闭设备时，它不会留在系统内存或启动媒体中。如果你想按照预期方式使用该环境，应该使用虚拟机的安装选项。\n\
  \n此时，安装向导将继续在实际机器上安装操作系统。你需要遵循安装向导的步骤，在提示时创建账户并设置其他选项。当安装完成后，你就可以使用 Linux 虚拟机和客体操作系统了。过程就是如此。\n\
  \n### 在虚拟机上运行 Linux\n现在你已经在系统中启动了虚拟机，你可以使用系统上的播放按钮在虚拟机上运行想要使用的发行版。如果你正在寻找要安装的软件，可以选择作为\
  \ Linux 发行版一部分的预装应用程序。如果你愿意，也可以选择下载不同的应用。\n\n如果你想通过系统访问 Linux 终端，可以在没有 `VMware workstation`\
  \ 的情况下实现。\n\n### 在 Windows 虚拟机上安装 Linux 发行版\n如果你使用 Windows 操作系统，通过虚拟机访问 Linux 是简单的方法。来自\
  \ `VMware` 的 workstation player 具有帮助你完成此操作的最佳工具。你可以轻松在 `VMware workstation` 上安装\
  \ Linux。让我们再次快速过一遍步骤：\n\n- **第一步**：你需要下载 `VMware workstation player`。建议下载最新版本。\n\
  - **第二步**：安装 workstation player 并重启。\n- **第三步**：配置并创建虚拟机。\n- **第四步**：安装你选择的 Linux\
  \ 发行版。\n- **第五步**：重启虚拟机并使用操作系统\n\n这个过程非常简单，你不需要局限于某一个系统。你可以从上述的 Linux 发行版列表中进行选择，并可以在你的工作站上安装所有它们。\n\
  \n## 第二章：在 Linux 上保护用户账户\n\n### 不要使用 Root 账户登录\n你 Linux 操作系统上的 `root` 用户就像 Windows\
  \ 上的管理员。在某些情况下，你可能想登录 Windows 上的管理员账户。你永远不要使用 root 账户登录 Linux。微软一直致力于通过用户控制 (`UAC`)\
  \ 改进 Windows 上的安全实践。Linux 没有此类现成的工具，因此你应该避免使用 root 用户。\n\n### 使用 Sudo 账户\n用户需要避免使用\
  \ root 账户访问操作系统。`Ubuntu` 为不同用户提供了 `sudo` 权限。`Ubuntu` 锁定了 root 账户，因此任何用户如果不额外启用 root\
  \ 账户并获取密码，无法登录 root 账户。早期版本的 Linux 发行版允许用户通过图形登录界面访问 root 账户进入 root 桌面。许多应用程序可能无法以\
  \ root 身份运行，另一些可能会报错。如果你从 Windows 转到 Linux，可能想用 root 登录操作系统。你可能认为这与使用 Windows 管理员账户不同。这是一个糟糕的做法，因为它会危及你的系统。当你在\
  \ `Ubuntu` 上使用 `sudo` 账户时，你会获得 root 权限。如果你使用 `su`，你只是访问 root shell 来运行可能需要的命令。通过\
  \ `sudo`，你可以在系统中执行正确的安全实践。只有当你处于 root shell 时，才能以 root 用户身份访问并运行应用程序。\n\n### 减少损害\n\
  当你使用个人账户访问操作系统时，系统将确保硬盘上运行的任何程序都不会受到影响。使用个人账户运行的程序只会对你的家目录进行更改。在没有获得 root 权限的情况下，你无法修改任何系统文件。这是一种维护安全的简单方法。假设你使用\
  \ `Chrome` 作为默认应用程序，如果你使用 root 账户运行操作系统，会使系统面临漏洞。恶意软件可以通过不同的页面进入你的系统。如果你使用受限账户，恶意软件仍然可以进入系统，但无法破坏系统功能。使用受限账户登录系统可以保护系统免受恶意软件攻击。恶意软件可以访问你的账户，但无法替换任何命令。使用\
  \ root 账户可能会损害你的系统，这绝对不是好主意。如果你使用 root 账户运行操作系统，你可以无法轻松恢复硬盘上的文件。这意味着你需要重新安装操作系统。\n\
  \n### 细粒度权限\n旧的 Linux 发行版使用 `root` 账户运行各种程序。现代发行版系统使用 `PolicyKit` 等工具来区分 Linux 用户账户可以执行的功能。你也可以定义权限。例如，如果你在操作系统上管理应用程序，你可以使用\
  \ `PolicyKit` 确保应用程序可以安装和更新软件。根据你设置的权限，只有部分用户可以执行操作。这意味着这些用户没有 root 访问权限，无法对操作系统进行任何更改。你可以在\
  \ Linux 中使用 root 账户登录图形桌面，这允许你删除硬盘上的每个文件。当系统运行时，你也可以在硬盘上写入随机信息，这会毁掉你的文件系统。使用 root\
  \ 账户将绕过安全，让系统产生漏洞。\n\n### 管理用户账户安全\n如果你想保护操作系统，需要对用户账户进行控制。本节将查看如何执行用户账户管理功能和任务。我们来看如何实施安全措施。\n\
  \n#### 添加新用户\n如前所述，你应该避免使用 `root` 账户执行任何功能，特别是常规操作。如果你在新的服务器或虚拟机上部署了操作系统，使用 root\
  \ 账户意味着你需要为每个访问系统的人创建新账户。要执行此，在 shell 中运行命令：\n```bash\nadduser <username>\n```\n\
  你还需要创建密码并输入关于用户的其他信息，你可以使用用户账户来实现。\n\n#### 禁用 Root 登录\n如果你想防止任何入侵，必须禁用远程访问。配置文件包含\
  \ OpenSSH 设置，你可以使用 Ubuntu 上的编辑器打开它：\n```bash\nsudo nano /etc/ssh/sshd_config\n```\n\
  如果你使用 Red Hat 或 CentOS 变体，可以使用：\n```bash\nsudo vi /etc/ssh/sshd_config\n```\n你也可以搜索认证设置和选项并更改登录权限。你可以通过使用命令将设置改为\
  \ `no` 来实现：\n```text\nPermitRootLogin no\n```\n保存文件。一旦完成更新，重启服务器。如果你在云服务器和 CentOS\
  \ 上，可以使用命令：\n```bash\nsudo systemctl restart ssh\n```\n在 Ubuntu 系统上，调用以下命令：\n```bash\n\
  sudo service ssh restart\n```\n\n#### Linux 中的密码策略\n如果你允许用户远程访问服务器，你需要使用 Linux 中名为\
  \ `PAM` 的模块来强制并实施密码策略。你可以通过 `pam_cracklib.so` 调用它。你可以使用此模块检查用户输入的密码是否与字典单词冲突。这防止了弱密码的使用。该模块还允许你定义任何新的密码要求，例如复杂性和长度。在\
  \ Debian 和 Ubuntu 系统上，你可以使用以下安装此模块：\n```bash\nsudo apt-get install libpam-cracklib\n\
  ```\nRed Hat 和 CentOS 变体预装了此模块。安装完发行版后，你需要打开并编辑配置文件。如果你使用 Debian 或 Ubuntu，在文本编辑器中打开文件：\n\
  ```bash\nsudo nano /etc/pam.d/common-password\n```\n在 CentOS 上，文件将以新名称存储。使用命令：\n\
  ```bash\nsudo vi /etc/pam.d/system-auth\n```\n当你在 Debian 或 Ubuntu 上安装模块时，服务器上会配置密码并执行检查。因此，你需要找到相应的此设置并更改它，使其看起来如下所示：\n\
  ```text\npassword required pam_cracklib.so retry=3 minlen=8 difok=3 dcredit=1 ucredit=1\
  \ lcredit=1\n```\n如果你使用 CentOS，你可能需要将上述整行直接添加到配置文件中，但这取决于你正在使用的版本。\n\n\n\n\n\n1.\
  \ **Retry**: 此参数定义了用户可以输入错误密码的次数。\n2. **Minlen**: 此参数定义了每个密码应具有的最小长度。\n3. **Difok**:\
  \ 此参数用于检查当前密码与之前的密码相比时，重用的字符数量。\n4. **Dcredit**: 这表示你的密码中需要包含数字。\n5. **Ucredit**:\
  \ 这定义了大写字母的数量。\n6. **Lcredit**: 这定义了小写字母的数量。\n\n你可以更新这些设置并保存更新后的设置。你需要理解，这些策略将适用于服务器上的所有用户，管理员用户除外。后者负责维护\
  \ root 密码的强度。\n\n## 限制 SSH 访问\n\n你可以使用 `OpenSSH` 服务器根据用户所属的组来限制连接到服务器的连接数。这是一项非常有用的备用技术，特别是当你有很多用户，且其中某些人不应该远程访问你的服务器时。你也可以通过此为你的服务器增加更多安全性。例如，当你运行\
  \ Web 服务时，你可能不希望每个人都使用同一台服务器访问该服务。\n\n要做到这一点，你需要创建新的用户组。为组使用一个恰当的名称。在接下来的命令中，我们将创建一个名为\
  \ `sshusers` 的用户组：\n```bash\nsudo groupadd sshusers\n```\n\n如果你想成为该组的一员，可以使用命令在组名后添加你的用户名：\n\
  ```bash\nsudo gpasswd -a <username> sshusers\n```\n\n如果你想检查谁被添加到了组中，可以使用命令：\n```bash\n\
  groups <username>\n```\n该命令的输出将向你显示用户名所属的不同组。你也可以在列表中为同一个用户包含另一个用户组。列表中还会包含一个与用户名同名的用户名。\n\
  \n上述命令的输出为：\n```\nuser: user sudo sshusers\n```\n\n完成此后，你就可以指定你想要为 `OpenSSH` 使用的组。要做到这一点，你需要使用编辑器打开配置文件。如果你的系统中安装了\
  \ `nano`，你可以使用命令：\n```bash\nsudo nano /etc/ssh/sshd_config\n```\n否则，你可以使用命令：\n```bash\n\
  sudo vi /etc/ssh/sshd_config\n```\n\n在配置文件的末尾，你需要添加以下行：\n```bash\nAllowGroups sshusers\n\
  ```\n确保你选择的配置选项前面没有使用井号符号注释。保存文件并退出编辑器。现在，重启 SSH 服务器，如果你使用的是 Debian 或 Ubuntu 服务器，使用此命令：\n\
  ```bash\nsudo service ssh restart\n```\n对于 Red Hat 和 CentOS 变体，可以使用此命令执行相同的操作：\n\
  ```bash\nsudo systemctl restart sshd\n```\n\n使用新配置后，不属于特定组的用户将被拒绝通过 `SSH` 访问服务器。他们的密码可能输入正确，但他们不会获得访问权限。这减少了人们通过暴力破解破解服务器的概率。这种方法是保护你正在使用的\
  \ Linux 服务器简单的方法。\n\n## 理解账户权限\n\n作为一名 Linux 安全专业人员或系统管理员，你需要管理系统用户及其活动。你还需要使用不同的工具来限制用户在系统上可以执行的操作。重要的一点是，用户可能会犯错。这些错误可以是任何情况，包括给一个\
  \ Linux 新手用户分配管理员权限、使用 `root` 权限在系统上运行应用程序或脚本，或者在你的系统中留下漏洞让黑客能够访问。\n\n由于你承担着责任，你需要尽尽努力确保用户不在系统上执行任何他们不应该执行的活动。你可能甚至不想清理这些烂摊子。\n\
  \n你的主要目标应该是控制用户在访问 Linux 服务器时可以做什么和不能做什么。Linux 系统上的用户需要一个账户来访问系统。当用户在操作系统、数据或应用程序上执行任何活动时，可以直接访问这些账户。每个系统都需要特定的账户才能正常运行。应用程序也需要账户来连接服务器。\n\
  \n你可以通过多种方法和使用不同的工具来管理分配给用户的权限。管理用户访问和权限的最佳方法是使用特权访问管理（PAM）工具，因为这些工具允许你集中管理活动。\n\
  \n在本节中，我们将考虑在管理 Linux 账户和权限时，你需要记住的九项重要实践。务必记住，这些并不是保护账户的唯一方法。新的方法不断涌现，你可以根据你维护的系统类型学习更多关于它们的信息。\n\
  \n## 管理 Linux 用户账户\n\n在 Linux 上创建账户是很容易的，我们在上一节中已经看到了你可以执行此操作的命令。但要删除或禁用你不再需要的账户就变得困难了。如果不删除这些账户，它们将继续保持激活状态，可能会导致进一步的问题。每个\
  \ Linux 系统都需要一个用户可以使用来访问服务器并在操作系统或所存储的数据上执行任何活动的账户。系统需要账户才能正常运行。应用程序也需要账户来将其连接到服务器。\n\
  \n大多数人认为账户管理只围绕管理用户账户展开。他们并不担心功能性、系统或应用程序账户。这为你的服务器风险管理留下了很多漏洞。\n\n## 减少权限\n\n当涉及特权账户时，你需要限制这些用户的访问和权利，以确保他们只有执行所需活动的权限，而不再更多。确保用户只做他们被要求做的事情是非常。如果你给用户提供了超过他们所需的权限，将很难控制用户能做什么。在分配权限时，你需要考虑以下因素：\n\
  \n1. 系统管理员需要使用 `root` 账户吗？\n2. 系统管理员需要运行只有 `root` 账户才能运行的命令吗？\n3. 数据库管理员需要访问 `root`\
  \ 账户吗？\n\n## 管理密码\n\n你可能已经实施并强制执行密码策略，以及在设置策略时需要遵守的参数。尽管如此，目标应该是减少系统中所使用的密码数量。在某些地方和时候你仍然需要使用密码。如果你在系统中使用密码，必须找到一种管理方法。\n\
  \n在管理系统密码时，需要记住以下几：\n\n1. 确保经常更改密码\n2. 防止使用旧密码\n3. 评估系统中所密码的复杂度\n\n\n\n\n\n这些是管理密码的基础知识。你需要将这些内容扩展到服务器上的所有密码，包括\
  \ `root`、用户、功能性账户、服务账户以及应用程序密码。\n\n## 减少共享账户的使用\n作为管理员，你永远不要与服务器上的另一个用户共享账户。管理员需要拥有独立的账户，以便对他们执行的所有操作进行问责和可追溯性管理。你需要跟踪每个用户的操作。每个\
  \ Linux 系统都带有一个 `root` 账户。你服务器上的应用程序将拥有与其关联的账户，这些账户有自己的一套权限。这限制了应用程序对系统的访问权限。\n\n\
  有时，数据管理员或应用程序管理员需要在操作系统、数据服务或应用程序上执行高特权活动。你需要实施并强制执行一种系统，使用户可以在不登录特权账户的情况下访问另一个账户。这就是\
  \ `sudo` 命令，它可以用于访问操作系统。作为管理员，你可以在不允许用户共享账户的情况下扩展用户的权限。它提供了所需的问责制和可追溯性，以识别他们所执行的活动。\n\
  \n## 控制账户访问\n重要的是，要理解系统中的每一个账户并不都需要通过网络访问。你必须在整个服务器上实施并执行权限控制。只有当你这样做时，才不会有人登录错误的账户或在你的服务器上执行未经授权的活动。此外，确保每个用户都不使用\
  \ `SSH` 配置访问服务器也是重要的。服务器上并不是每个用户账户都需要从网络上的不同计算机访问服务器。你不需要允许用户从任何地方访问服务器。用户应该只访问服务器来执行分配给他们的任务。\n\
  \n## 维护日志\n记录你服务器上发生的一切是非常关重要的。你需要记录服务器上每个用户的访问、更改、补丁、权限和功能。这并不是一个详尽的列表，你也可以查看用户活动的其他方面。你和你的团队需要花时间浏览这些消息并评估所有执行的活动。这是你绝对需要做的事情。\n\
  \n你应该报告哪个用户有权执行哪些活动。你根据不同的法规需要这些信息。记录对不同账户的所有更改、权限的更改、用户的删除或添加，或用户执行的任何其他活动都是至关重要的。只有在你了解用户正在执行的活动时，你才能对你服务器的规则进行更改。\n\
  \n## 记录和管理特权活动\n了解哪个用户访问了服务器、使用了哪个主机、在哪里访问的服务器以及如何访问的是非常关重要的。了解用户的权限并分析用户对服务器做了什么甚至更为重要。你需要收集这些数据并进行分析，以查看系统上正在执行哪些活动。\n\
  \n如果你是管理员，你可以管理用户权限、活动以及他们活动的时间。这是一个强大的工具。为了了解用户在系统上正在做什么，你可以使用未分配给用户的权限运行命令。此类权限的示例包括数据库管理员或应用程序管理员。这些用户只能执行配置或维护活动。如果这些用户拥有过高的权限，可能会导致各种问题。你需要管理管理员访问，即使看起来你无法信任该管理员。这些账户应该被仔细检查，并对活动进行监控。这不是因为可以使用这些账户的人，而是因为这些账户是黑客的价值资产。\n\
  \n## 在发现可疑活动时通知或警报\n一旦你在 Linux 上实施并建立了审计和日志系统，你就设置自动化通知，以提醒你系统中使用的任何服务器上的任何可疑活动。这并不意味着你设置信号来报告任何微小的违规，而是那些可能导致你的服务器泄露的行为。你的通知和警报系统必须定义规则来停止不当行为。当你记录此类活动时，它将向你显示用户正在执行他不应该执行的功能。然后你可以利用通知来定义规则，防止这种情况再次发生。这个过程将让你更容易采取主动而非被动措施。这个过程基于“通过强制来实现检测”的概念。这个概念意味着你使用相同的规则来检测并防止任何坏行为的发生。\n\
  \n## 统一与集中\n所有的 Linux 发行版都允许你原生执行目前列出的所有操作。例如，你可以使用 `SSH` 配置用户如何访问服务器以及在何处访问。你也可以用它来定义用户使用该访问可以执行哪些活动。如果你只与一个系统和几个用户一起工作，手动执行这些是很容易的。如果你有多台服务器，就会增加你维护服务器配置所需的投入的精力。在手动更新每个用户的访问权限和用户组时，你可能会出错。\n\
  \n将权限管理和访问控制结合起来是非常重要的。如果你分开观察这两个领域，将会出错。在 Linux 安全世界中，你还需要将访问和账户控制结合起来。为了做到这一点，你需要工具来让你能够集中地管理访问控制、账户管理和权限管理领域。\n\
  \n## 第三章：使用防火墙保护服务器\n作为系统管理员，你需要学习如何为你的 Linux 服务器配置和维护防火墙。在本章中，我们将查看如何使用 `firewall-cmd`\
  \ 命令管理服务器。\n\n如果你以前工作过网络安全，你就知道防火墙是其中的重要部分。因此，作为系统管理员，学习防火墙的工作原理是非常重要的。只有当你理解防火墙如何工作时，你才能保护服务器并对你允许哪些流量进入和离开服务器做出正确选择。防火墙系统必须定义规则来停止不当行为。当你记录此类活动时，它将向你显示用户正在执行他不应该执行的功能。然后你可以利用通知来定义规则，防止这种情况再次发生。这个过程将让你更容易采取主动而非被动措施。这个过程基于“通过强制来实现检测”的概念。这个概念意味着你使用相同的规则来检测并防止任何坏行为的发生。防火墙是保护用户数据的一个小部分，但某些人会将防火墙与发生在网络末端的（内部或外部）战斗攻击混淆。与\
  \ Tron-style 战斗攻击不同，防火墙可以防止释放恶意数据包。\n\n### 端口\n你可以使用防火墙来管理流入和流出服务器的流量。防火墙中的端口指的是任何物理连接，如\
  \ `VGA` 或 `HDMI`。在防火墙方面，端口是用于连接或创建各种数据源之间路径的虚拟连接。你可以经常使用不同的端口，但我想说的是有很多不同的端口，有些端口使用的频率比其他高。这些端口约定如下：\n\
  \n- `HTTP` 使用端口 `80`\n- `HTTPS` 使用端口 `443`\n- `SSH` 使用端口 `22`\n- `FTP` 使用端口 `21`\n\
  \n当数据从一个系统移动到另一个系统时，这将决定应该使用的端口。如果协议接受数据而你不知道如何工作，你可以通过访问系统上的任何浏览器来了解它：\n\n```\n\
  curl --connect-timeout 3 \"http://example.com:80\"\n```\n```html\n<!doctype html>\n\
  <html>\n<head>\n<title>Example</title>\n</head>\n```\n\n在相同的形式中，使用不同的端口拒绝访问网站。例如，你可以添加端口号\
  \ `79`。这将拒绝访问：\n\n```bash\ncurl --connect-timeout 3 \"http://example.com:79\"\n\
  ```\n`curl: (7) Failed to connect: Network is unreachable`\n\n网络上的协议和端口之间存在关联，专家设置了这些约定。如果你需要，可以轻松更改这些设置。当人们开始使用计算机和网络时，他们害怕更改服务器中的端口，因为这可能导致攻击。现在攻击是复杂的，这意味着黑客不会通过在网络或\
  \ Web 服务器上运行端口扫描来学习任何。防火墙将查看 Web 服务器上执行的活动。\n\n### 使用 firewall-cmd 接口\n你正在使用的操作系统将为服务器提供基础设施。该接口的目标是运行防火墙。或者，你的调制解器和路由器可能自带防火墙。这将作为互联网任何网站使用的主要网关和路径。重要的是记住防火墙是预配置的，可以使用你可以更改的接口。在本节中，我们将查看你在\
  \ Linux 发行版中通过 `firewall-cmd` 接口可以使用命令。\n\n当你配置防火墙时，大多数专家会要求你在防火墙上阻塞一切。专家还建议在阻塞一切后，开放某些端口。这意味着你需要确切知道服务器需要什么以及如何操作。\n\
  \n### 阻塞一切\n如果你在一个拥有 `DNS` 缓存服务的组织工作，你需要在处理 DNS 之前解锁端口。如果你仅仅依赖 `SSH` 配置并用它远程更改服务器，你是无法阻止它的。你需要了解操作系统运行着哪些服务，并理解服务是否是组织内部。你还需要确定服务器上的不同服务之间是否存在交互。\n\
  \n对于专有软件，服务器可能会调用外部端口，而你可能不知道这些调用。如果某些应用程序对服务器上的任何严格防火墙反应糟糕，你需要使用逆向工程。你可能还需要与应用程序的支持部门交流，以了解应用程序创建的流量类型。你还需要知道应用程序为什么表现那样。对于开源软件来说，这不是常见问题。对于复杂的软件栈并非如此。大多数媒体播放器会调用互联网。它们需要使用端口来获取专辑。\n\
  \n### 创建区域 (Zone)\n所有的 Linux 发行版都允许你原生执行目前列出的所有操作。例如，你可以使用 `SSH` 配置用户如何访问服务器以及在何处访问。你也可以用它来定义用户使用该访问可以执行哪些活动。如果你只与一个系统和几个用户一起工作，手动执行这些是很容易的。如果你有多台服务器，就会增加你维护服务器配置所需的精力。在手动更新每个用户的访问权限和用户组时，你可能会出错。\n\
  \n将权限管理和访问控制结合起来是非常重要的。如果你分开观察这两个领域，将会出错。在 Linux 安全世界中，你还需要将访问和账户控制结合起来。为了做到这一点，你需要工具来让你能够集中地管理访问控制、账户管理和权限管理领域。\n\
  \n你需要使用 `--new-zone` 命令在 Web 服务器上添加一个新区域。使用 `firewall-cmd` 命令执行的任何操作仅持续到重启电脑。要使任何更改永久，你需要使用\
  \ `--permanent` 标记。\n\n```bash\nfirewall-cmd --new-zone\n```\n\n现在你已经有了新区域，可以将网络接口分配给它。在此之前，你需要使用\
  \ `ssh` 服务来访问区域。使用 `--permanent` 标记对你的服务器进行永久更改：\n\n```bash\nfirewall-cmd --add-service\
  \ ssh --permanent\n```\n\n如果你想激活 `corp` 区域并设置为默认区域，你需要使用 `--change-interface` 选项：\n\
  \n```bash\nfirewall-cmd --change-interface ens3 --zone corp --permanent\n```\n\n\
  当你将 `corp` 区域设置为默认区域时，使用的命令将应用于服务器，除非你指定其他区域。\n\n```bash\nfirewall-cmd --set-default\
  \ corp\n```\n\n你还可以查看分配到接口的区域。为了这样做，你需要使用：\n\n```bash\nfirewall-cmd --get-active-zones\n\
  ```\n```text\ncorp: ens3\ninterfaces: ens4\n```\n\n### 设置默认区域\n如果你想了解更多特定区域允许的内容，你可以运行以下命令：\n\
  \n```bash\nfirewall-cmd --zone corp --list-all\n```\n```text\ntarget: default\n\
  icmp-block-in: no\ninterfaces:\nsource: \nmasquerade: no\nports: \nservices:\nrules:\n\
  ```\n\n### 移除或添加服务\n你现在阻止了除了 `SSH` 之外的所有网络访问。因此，根据使用的协议，通过防火墙允许端口是种简单且快速的方法。如果你想查看网络上可用的服务列表，可以使用以下：\n\
  \n```bash\nfirewall-cmd --get-services\n```\n```text\nRH-Satellite-6\namanda-client\n\
  amqp\namqps\napcups\naudit\nbacula\nbacula-client\nbgp\nbitcoin\nbitcoin-rpc\nbitcoin-testnet\n\
  ceph\ncockpit\ndhcp\ndhcpv6\ndistcc\ndns\n```\n\n让我们考虑一种你需要运行 Web 服务器的情况。为了这样做，你需要在网络上安装它。你可以在\
  \ Debian 或 Ubuntu 上使用 `apache2`，或者在 Fedora 或 RHEL 上使用 `httpd` 包。在下面的示例中，我们将使用 `httpd`\
  \ 服务：\n\n```bash\nsudo dnf install httpd\nsudo systemctl --enable --now httpd\n\
  ```\n\n现在你应该从本地网络测试 Web 服务器并查看它是如何工作的。\n\n```bash\ncurl --silent localhost:80 |\
  \ grep title\n```\n```html\n<title>Test Page for Apache HTTP Server on Red Hat Linux</title>\n\
  ```\n\n你应该然后从网络连接到 Web 服务器，最好是外部的。\n\n```bash\ncurl --connect-timeout 3 192.168.122.206\n\
  ```\n`curl: (28) Connection timed out after 3001 milliseconds`\n\n### 解服务\n如果你想通过网络或防火墙允许\
  \ `HTTP` 协议的流量，你需要在 Web 服务器上包含 `HTTP` 服务。\n\n```bash\nsudo firewall-cmd --add-service\
  \ http --permanent\nsudo firewall-cmd --reload\n```\n\n你应该使用外部浏览器测试此包含：\n\n```bash\n\
  curl --silent 192.168.122.206 | grep title\n```\n```html\n<title>Test Page for Apache\
  \ HTTP Server on Red Hat Linux</title>\n```\n\n现在你已经知道如何向你的 Web 服务器包含或添加服务了。因此，对你来说移除一个很容易。\n\
  \n```bash\nsudo firewall-cmd --remove-service http --permanent\nsudo firewall-cmd\
  \ --reload\n```\n\n### 移除和添加端口\n你可能会发现寻找预定义服务时遇到困难。与其添加服务，不如使用 `--add-port` 添加端口号。例如，如果你想在自定义区域为\
  \ `SSH` 协议使用非标准端口，你可以使用命令添加它：\n\n```bash\nsudo firewall-cmd --add-port=2222/tcp\
  \ --permanent\nsudo firewall-cmd --reload\n```\n\n移除该端口，使用 `--remove-port`：\n\n\
  ```bash\nsudo firewall-cmd --remove-port=2222/tcp --permanent\nsudo firewall-cmd\
  \ --reload\n```\n\n### 防火墙规则\n你可以使用 `firewall-cmd` 执行很多上面未列出的操作。你可以定义 ICMP 阻塞，定义向你的系统发送数据流量的源，甚至定义你想允许的服务。通过实验很容易学习。你可以在\
  \ GNOME box 中安装 Fedora 或 Red Hat Linux 来玩 `firewall-cmd` 选项。\n\n## 第四章：保护你的服务器\n\
  在上一章中，我们查看了如何使用防火墙保护服务器。我们还查看了用户账户和其他细节。在本章中，我们将查看在不使用防火墙保护服务器的不同方法。\n\n### 更新服务器\n\
  如果你以管理员身份访问服务器，你需要定期更新它。为了这样做，运行以下命令：\n\n```bash\nsudo apt-get update && sudo apt-get\
  \ upgrade\n```\n重要的是在运行升级时你是在 VPS 或虚拟机实例上，这可能会损坏服务器。所以，你需要检查是否可以在 host 上这样做。\n\n\
  ### 创建二级用户\n你需要这样做以确保没有用户通过 `root` 账户登录服务器。如果你想减少服务器上通过 root 进行未授权访问的概率，你需要创建一个用户并赋予他们相关的权限。我们查看了如何将新用户添加到服务器中。如果你想让用户拥有特定的权限访问服务器，你需要更新配置中的这些项。\n\
  \n```bash\n/etc/init.d/sshd restart\n```\n```text\nStarting sshd: [ OK ]\n```\n\n\
  要完成这一点，你需要编辑配置文件：\n\n```bash\nsudo vi /etc/ssh/sshd_config\n```\n\n重要的是将 `#PermitRootLogin\
  \ yes` 更新为 `PermitRootLogin no`。你可以通过以下命令重启服务：\n\n```bash\nservice ssh restart\n\
  ```\n\n记住，在服务器上安装操作系统时没有 root 密码，但作为管理员，你拥有 `sudo` 权限和管理访问。\n\n### 设置 SSH 密钥\n在服务器上的\
  \ `SSH` 密钥允许你安全地连接服务器。这是一个额外的步骤，以确保服务器免受未经授权的访问。你需要运行：\n\n```bash\nssh-keygen -t\
  \ rsa -C \"you@example.com\"\n```\n\n一旦你接受了默认位置，名称将添加到服务器。你现在使用以下代码将公密钥复制到 root\
  \ 目录：\n\n```bash\ncd ~/.ssh\ncp id_rsa.pub authorized_keys\n```\n\n你现在可以直接通过 root\
  \ 账户连接到服务器。\n\n### 检查和配置防火墙\n运行以下命令来检查和配置防火墙。你也可以使用上一章中的信息。\n\n```bash\nroot@server:~#\
  \ ufw list\n```\n```text\nAvailable applications:\nOpenSSH\n```\n```bash\nroot@server:~#\
  \ ufw status\n```\n```text\nStatus: active\nTo                         From\n--\
  \                         ------\n22/tcp                     ALLOWwhere\n8080/tcp\
  \                   ALLOWwhere\n80/tcp                     ALLOWwhere\n22/tcp (v6)\
  \                ALLOW (v6)\n8080/tcp (v6)             ALLOW (v6)\n80/tcp (v6) \
  \               ALLOW (v6)\n```\n\n### 限制端口的使用\n当你在系统上安装 Linux 时，你不必担心监听通过服务器的任何网络服务。当你启动服务器时，你可以确定管理员和\
  \ root 用户应该使用的各种端口和服务。你需要测试服务器上的开放端口。为了这样做，运行以下代码：\n\n```bash\nnetstat -tulpn\n\
  ```\n```text\nActive Internet connections (only servers)\nProto Recv-Q Send-Q Local\
  \ Address Foreign Address State PID/Program\ntcp 0      0 0.0.0.0:22     0.0.0.0:*\
  \      LISTEN 1234/sshd\ntcp 0      0 0.0.0.0:80     0.0.0.0:*      LISTEN 5678/nginx\n\
  tcp 0      0 0.0.0.0:443    0.0.0.0:*      LISTEN 9012/nginx\n```\n\n### 设置实时内核补丁\n\
  你可以使用 `livepatch` 服务来确定你的服务器何时需要安全修复，特别是对于不需要重启的主内核。作为 Linux 用户，你可以免费使用这些服务三个区域或节点。这是系统的一部分，你可以在网站上了解更多信息。\n\
  \n### 设置双重身份验证\n如果你想为服务器添加额外的保护层，你可以在服务器上设置多因素或双重身份验证。你需要小心设置，因为如果你错误输入密码，可能会把自己锁锁。要这样做，请按照下面的步骤操作：\n\
  \n#### 第一\n通过 `SSH` 访问服务器并运行以下命令使用 Google authenticator 作为你的身份验证机制：\n\n```bash\n\
  apt-get install libpam-google-authenticator\n```\n\n#### 第二\n你现在应该运行 `google-authenticator`\
  \ 命令在服务器的家目录下创建一个密钥。\n\n```bash\ngoogle-authenticator\n```\nDo you want authentication\
  \ tokens to be time-based (y/n)? y\n你的新密钥是: `73GRXVJNWN2T`\n你的验证码是: `389485`\n你的紧急代码是:\
  \ `9953657844768915`\n\n你现在应该将公密钥复制到 root 账户下的 SSH 目录。使用以下代码：\n\n```bash\ncd ~/.ssh\n\
  scp id_rsa.pub root@host.servername:/root/.ssh/\n```\n\n你现在可以直接连接到服务器。\n\n\n\n\n\
  \n## SELinux 模式\n\n- **Disabled (禁用)**：当你使用此模式时，可以禁用服务器上的 SELinux。\n- **Permissive\
  \ (许可模式)**：如果你使用此模式，只有当服务器上执行未经授权的活动时，你才会收到警告或警报。它还会记录用户执行的操作。\n- **Enforcing (强制模式)**：在此模式下，SELinux\
  \ 的功能不受限制，这意味着它会检查服务器安全的方方面面。\n\n你可以使用 `/etc/selinux/config` 文件管理这些模式。\n\n## 安全控制台访问\n\
  \n从端到端保护 Linux 服务器至关重要，这意味着你需要保护通过控制台对服务器的访问。在设置好 BIOS 后，你需要禁用外部设备的使用，例如 USB 优盘、CD\
  \ 或 DVD。你还需要设置 BIOS 并使用 `grub` 启动加载程序密码来保护更新后的设置。\n\n## 限制旧密码的使用\n\n你可以确保用户在被提示更新密码时不再使用旧密码。你的\
  \ Linux 服务器会将旧密码保存在 `/etc/security/opasswd` 文件中。你可以使用 PAM 模块确保服务器实现此功能。如果你不确定如何操作，请遵循以下步骤：\n\
  \n1. 如果你使用 CentOS、Fedora 或 RHEL，可以打开 `/etc/pam.d/system-auth` 文件。执行此操作，请运行命令：\n\
  ```bash\nvi /etc/pam.d/system-auth\n```\n\n2. 如果你使用 Ubuntu 或 Debian，可以使用命令打开 `/etc/pam.d/common-password`\
  \ 文件：\n```bash\nvi /etc/pam.d/common-password\n```\n\n3. 你需要在配置的 `auth` 部分添加以下命令：\n\
  ```bash\nauth sufficient pam_unix.so likeauth nullok\n```\n\n\n\n\n完成此操作后，你需要在配置文件中添加以下行，以确保用户不会重复使用其最后几个密码。你可以决定服务器想要存储的密码数量。\n\
  \n```\npassword sufficient pam_unix.so nullok use_authtok md5 shadow remember=5\n\
  ```\n此行将向服务器指示，它需要记住用户的最后五个密码。因此，如果用户输入了早期的某个密码，他将收到来自 Linux 的一个错误提示，要求他选择不同的密码。\n\
  \n## 检查监听端口\n你需要查看服务器上不同的端口，并查看它们以及它们所提供的服务。要执行此操作，你可以运行以下命令：`netstat -tunlp`。根据收到的列表，你可以判断是否有任何需要从系统内核禁用的端口。你可以使用\
  \ `chkconfig` 命令来实现此。然后你可以关闭服务器上所有不需要的端口。要执行此操作，你可以运行命令：`chkconfig serviceName off`。\n\
  \n## 禁用 root 登录\n如前所述，确保你不要使用 root 账户登录服务器是非常关重要的。因此，你需要在服务器的配置文件中禁用 root 账户的 ssh\
  \ 端口。在执行此操作之前，让我们来看一个示例，我们创建一个具有 `sudo` 权限的用户，这样你就可以使用 ssh 端口访问服务器并执行必要的任务。当你登录服务器时，如果需要，你可以从用户切换到\
  \ root 账户。\n\n让我们先创建一个新用户。执行此操作请使用以下命令：`useradd user1`。你现在可以使用命令 `passwd user1`\
  \ 为此用户账户添加密码。现在你已经在服务器上创建了一个用户，你可以使用以下行为它赋予 `sudo` 权限：`echo 'user1 ALL=(ALL) ALL'\
  \ >> /etc/sudoers`。然后你需要使用 `ssh` 使用新用户账户访问服务器。这是确保你登录服务器的一种方法。\n\n现在，我们需要禁用 SSH\
  \ 端口的 root 访问。这意味着没有用户可以使用 root 账户通过 SSH 登录服务器。你需要打开配置文件 `nano /etc/ssh/sshd_conf`\
  \ 来执行此操作。然后你需要将文件中的行 `PermitRootLogin` 更新为 `no`。然后你需要保存并关闭文件。一旦重启它，你就会看到设置已更新。\n\
  \n在登出服务器之前，你应该测试是否可以使用早些创建的用户 ID 通过 SSH 登录服务器。要执行此操作，你可以在终端中打开另一个实例并使用 SSH 登录控制台。如果一切运行正常，你就可以以\
  \ root 用户身份登出服务器。\n\n## 更改端口\n你也可以更改用于 访问网络的 SSH 默认端口。你可以添加一层安全防护以确保你的服务器是安全的。要执行此操作，你需要对\
  \ `/etc/ssh/sshd_config` 文件进行更新。在该文件中，你需要将端口号 `22` 替换为你想要使用的端口号。一旦保存文件，你就可以重启服务器。要执行此操作，你需要使用以下命令：`service\
  \ sshd restart`。然后你可以使用以下命令通过更新后的端口登录服务器：`ssh username@IP -p 1110`。\n\n## 禁用快捷键\n\
  当你按下快捷键 `Ctrl+Alt+Delete` 时，你的服务器将自动重启。因此，你最好禁用此快捷键，以防止有人误重启系统。此操作位于名为 `/etc/init/control-alt-delete.conf`\
  \ 的配置文件中。你所做的只是在配置文件中注释掉 `#start on control-alt-delete` 这一行即可。\n\n## 免密登录\n你可以使用\
  \ SSH 登录你的服务器。如果你在文件中配置了细节，你可以放弃密码。你唯一需要做的就是通过 SSH 生成密钥来进入服务器。确保用户只能从其生成 ssh 密钥的机器进入服务器是非常重要的。让我们看看如何生成\
  \ SSH 密钥来访问服务器：`ssh-keygen -t rsa`。一旦生成了密钥，你可以使用以下命令将密钥添加到你想访问的服务器上：`cat ~/.ssh/id_rsa.pub`。\n\
  \n如果服务器上有有多个用户，你可以给每个用户一个 `ssh` 密钥，以便他们从自己的系统访问服务器。你可以使用以下命令执行此：`cd /home/user1\
  \ ls -ll`。\n\n出于安全考虑，为了确保只有部分用户访问 ssh 密钥，你可以配置 ssh 目录中的用户列表。你可以使用以下命令执行此：\n```\n\
  mkdir .ssh\ncd /home/admin/.ssh\nvim authorized_keys\n```\n你也可以创建一个公共 SSH 密钥并在更改所有者之前将其添加到配置文件中。要执行此操作，运行以下命令：`chown\
  \ user1 authorized_keys`。\n\n如果你不想使用 SSH 密钥，则需要禁用 SSH 登录。要执行此操作，你需要使用以下命令编辑配置文件：\n\
  ```\nEdit /etc/ssh/sshd_config\nPasswordauthentication no\nPermitRootLogin no\n\
  ```\n一旦执行此操作，你就可以确保只有授权用户可以使用命令：`ssh user-name@serverIP -p(port Number)` 进入服务器。\n\
  \n## 使用 fail2ban\n如果你想使用一个应用程序来查看频繁被攻击的服务器，可以使用 `fail2ban`。该程序还会你发生在服务器上的任何攻击。`fail2ban`\
  \ 会更改防火墙配置，并根据攻击类型永久或永久地阻塞 IP 地址。如果你想在系统上安装 `fail2ban`，请运行以下命令：`sudo apt install\
  \ fail2ban -y`。然后你需要使用以下命令复制配置文件：`cp /etc/fail2ban/jail.conf /etc/fail2ban/jail.local`。如果你没有\
  \ `jail.local` 文件，你需要创建它。然后使用以下命令对 `/etc/fail2ban/jail.local` 进行所需的更改：\n```\n[sshd]\n\
  enabled = true\nport = ssh\nprotocol = tcp\nfilter = sshd\nlogpath = /var/log/secure\n\
  maxretry = 3\nfindtime = 600\nbantime = 600\n```\n在重启应用程序之前，你需要设置 `bantime` 为 `-1`。一旦执行此操作，你可以使用以下命令重启应用程序：`sudo\
  \ service fail2ban restart`。这很简单。应用程序将继续检查系统日志文件并查找攻击。如果你想查看此列表，使用以下命令：`sudo fail2ban-client\
  \ status`。你也可以使用 `fail2ban` 登录 SSH。你需要定期更新应用程序，以便你可以访问服务器。\n\n## 创建新账户\n你现在应该创建一个用户账户。请记住不要使用\
  \ root 账户登录服务器。你也可以创建自己的账户。如前所述，你应该创建一个具有 `sudo` 权限的账户，你可以使用 `sudo` 账户访问服务器。\n\n\
  ## 上传 SSH 密钥\n当你创建一个新服务器时，你需要 SSH 密钥来访问服务器。如果你想使用预生成的密钥，执行此操作请运行以下命令：`ssh-copy-id\
  \ <username>@ip_address`。你现在可以使用 SSH 密钥避免登录时使用密码。\n\n## 安全 SSH\n一旦执行了此操作，你需要进行以下更改：\n\
  1. 移除 SSH 协议的密码认证\n2. 不允许用户远程访问 root 账户\n3. 同样限制对 IPv6 的访问并使用 IPv4\n\n要执行此操作，你需要更改\
  \ SSH 配置文件。当你打开文件时，你会发现以下代码：\n```\nPasswordAuthentication yes\nPermitRootLogin yes\n\
  ```\n你需要更改它，使其看起来如下：\n```\nPasswordAuthentication no\nPermitRootLogin no\n```\n\
  然后你需要限制 SSH 服务使用的是 IPv4 或 IPv6。你可以通过更改配置文件中的 `AddressFamily` 选项来实现。如果你想将其更改为仅使用\
  \ IPv4，执行以下更改：`AddressFamily inet`。\n\n只有在重启 SSH 服务时，你的更改才会反映在服务器上。请记住，在重启 SSH 服务器之前，你应该有一个活跃的服务器连接。如果重启没有按计划进行，你可以修复任何出现的问题。如果你使用\
  \ Ubuntu，可以运行以下命令来重启服务。如果你使用任何带有 Systemd 配置的 Linux 发行版，运行以下命令：`sudo systemctl restart\
  \ sshd`。\n\n## 创建防火墙\n在上一章节中，我们看了如何在系统上安装、启用和配置防火墙，使其仅允许允许的网络流量访问服务器。根据你的编程水平，你也可以使用简单的防火墙。如果你不会编程，请使用\
  \ `ufw`。你可以使用以下命令在你的系统上安装它：`sudo apt install ufw`。\n\n`ufw` 防火墙默认拒绝任何入站连接并允许所有流出流量。这意味着系统或服务器上的所有工具和应用程序都可以连接互联网，但任何外部尝试连接服务器，它将不允许。你需要使用以下命令确保你的服务器可以访问\
  \ HTTPS、HTTP 和 SSH 协议：\n```\nsudo ufw allow ssh\nsudo ufw allow http\nsudo ufw allow\
  \ https\n```\n执行此操作后，你应该使用以下命令启用防火墙：`sudo ufw enable`。你还需要检查哪些服务和应用程序被 `ufw` 允许或拒绝：`sudo\
  \ ufw status`。如果你不想使用防火墙，应该输入以下命令：`sudo ufw disable`。或者，你可以使用上一章节中讨论的防火墙接口。\n\n\n\
  \n1. 通过为每个用户设置资源限制，防止用户发起拒绝服务（DoS）攻击\n2. 允许用户仅在特定的时间段从特定的设备和地点登录服务器\n3. 使用影子密码（我们稍后会介绍这一点）\n\
  4. 对密码使用不同形式的加密（包括 `DES`），以确保其不会被暴力破解攻击破解\n\n\n\n如果你在服务器或网络中启用了此功能，你可以在攻击发生在你的系统之前阻止许多攻击。\n\
  \n## CIPE 或加密 IP 封装 (Cryptographic IP Encapsulation)\n\n这种加密目的是为服务器和系统提供一个安全的设施。这种加密保护了跨不安全数据包子网络之间的连接免受流量分析、窃听和伪造消息注入。使用\
  \ `CIPE`，你可以在服务器和网络层对数据加密。所有以数据包形式沿网络传输的信息都是被加密的，这些数据包由相邻网络驱动程序的加密引擎接收和发送。\n\n`CIPE`\
  \ 不加密通过网络或连接传输的数据。它甚至不加密网络层或套接字层的数据。它只加密不同主机上网络、套接字和程序之间的逻辑连接。这与 `SSH` 非常不同。你还可以使用\
  \ `CIPE` 通过隧道创建新的 VPN。如果你想避免对正在使用的应用程序软件进行更改，可以使用低级加密方法。这些方法确保连接到 VPN 或虚拟私有网络的网络之间的逻辑连接透明地工作。\n\
  \n## 使用影子密码 (Shadow Passwords)\n\n你可以使用影子密码来确保用户的密码经过加密，并将信息维护在普通用户无法访问的文件中。新版本的\
  \ `RedHat` 和 `Debian` 将此设置作为默认。加密后，密码存储在服务器目录下的文件中，服务器上的每个用户都可以访问该文件。如果有人在该文件上运行密码破解或猜词程序，他们就可以获得系统上每个用户的密码。\n\
  \n影子密码将存储在另一个文件中，只有管理员或特权用户才能访问。如果你想使用影子密码，你需要确保每个需要密码的应用程序、工具或实用程序都能访问该信息。你可能还需要重新编译密码列表以支持用户访问系统。使用\
  \ `PAM`，你可以插入一个影子模块，而不需要重新编译系统的任何密码。\n\n## John the Ripper 和 Crack (John the Ripper\
  \ 破解工具)\n\n如果你在服务器上使用了密码程序，但你发现人们没有使用难以猜测的密码，那么你就需要运行密码破解程序。该程序将帮助你判断你和用户使用的密码是否安全。密码破解程序背后的原理很简单——程序将查看字典中的每个单词，并尝试相同单词的各种变体。它还会加密这些单词并与你的密码进行比对。如果程序找到匹配项，它就能知道用户的密码。\n\
  \n有许多你可以使用的密码破解程序，但人们经常使用“John the Ripper”和“Crack”。这些程序可能会占用你 CPU 的时间，但会产生极的结果。在黑客在你的系统和服务器上使用这些程序之前，你需要先使用它们并检查是否有弱密码。如果是，要求用户立即更改以避免任何黑客攻击。你可能会奇怪，当黑客只能通过漏洞或安全漏洞访问服务器时，他们是如何访问服务器上的密码文件的。遗憾的是，服务器上存在漏洞，经验丰富的黑客可以很容易找到这些漏洞。\n\
  \n你还可以尝试 Linux 中使用的其他加密方法，例如透明加密文件系统 (`TCFS`)、加密文件系统、显示安全、`X11` 和 `SVGA`。我们将在书的后面详细介绍它们。\n\
  \n## 第六章：加密和解密密码保护文件的工具\n\n编码或保护文件以确保只有选定用户可以访问文件的过程称为加密。在计算机出现之前，我们就已经在使用加密的概念。当国家处于战争时，他们开发了代码来与战区的间谍或士兵通信。这是他们确保没有其他人能理解所传递的消息的一种方式。\n\
  \nLinux 发行版自带了标准工具，用于加密和解密系统或服务器中的信息。在本章中，我们将查看七种你可以使用密码加密和解密文件的工具。\n\n### GNU 隐私守护\
  \ (GNU Privacy Guard 或 GnuPG)\n\n`GnuPG` 通常称为 `GPG` 是各种加密软件的集合或套件，用 `C` 语言编写。如果你想用它来加密和解密文件，最好下载文件的最新版本。过去几年发布的大多数\
  \ Linux 发行版都会默认安装此包。如果你发现你的服务器或系统上没有安装它，请使用以下命令进行安装：\n\n```bash\n$ sudo apt-get\
  \ install gnupg\n### yum install gnupg\n```\n\n在本章的所有示例中，我们将使用一个名为 `tecmint.txt`\
  \ 的文件进行加密和解密。该文件位于系统的桌面上，如果需要，它将会被移动到不同的位置。在继续之前，让我们看看这个文件的内容。为此，请运行以下命令：\n\n```bash\n\
  $ cat ~/Desktop/Tecmint/tecmint.txt\n```\n\n你现在可以使用该工具加密 `tecmint.txt`。当你使用 `-c`\
  \ 选项运行 `gpg` 命令时。这是一个对称密码，它将针对文件 `tecmint.txt` 创建扩展名为 `.gpg` 的加密文件。你可以查看目录内容来确定哪个文件被加密了：\n\
  \n```bash\n$ gpg -c ~/Desktop/Tecmint/tecmint.txt\n$ ls -l ~/Desktop/Tecmint\n```\n\
  \n如果你想加密任何文件，你需要输入两次“paraphrase”这个单词。在上面的示例中，我们使用了 `CAST55` 算法来加密文件。你可以根据需要指定不同的算法。这些方法确保连接到\
  \ VPN 或虚拟私有网络中的两个网络之间的逻辑连接透明地工作。\n\n（注：由于原文存在大量重复内容，译文已根据核心逻辑进行了去重处理。）\n\n\n\n\n\
  ### 1. Enc: 加密\n\n- `-out`: 这是解密后文件路径\n- `-in`: 这是你的加密文件存储位置\n- `-aes-256-cbc`:\
  \ 这是用于加密和解密文件的算法\n\n\n\n现在，让我们来看看如何使用此工具解密文件。在命令行提示符运行运行命令：\n\n```bash\nopenssl\
  \ enc -aes-256-cbc -d -in ~/Desktop/Tecmint/tecmint.dat > ~/Desktop/Tecmint/tecmint1.txt\n\
  ```\n\n### 7-Zip\n这是一个用 C++ 编写的开源工具，用于压缩和解压缩存储在文件中的大多数信息。如果你的系统中尚未安装此工具，可以使用以下 `yum`\
  \ 或 `apt` 命令进行安装：\n\n```bash\nsudo apt-get install p7zip-full\n### yum install p7zip-full\n\
  ```\n\n完成此操作后，你需要使用该工具将文件压缩为 zip 文件夹，并使用密码进行加密。运行以下命令来加密文件：\n\n```bash\n7za a -tzip\
  \ -p -mem=AES256 tecmint.zip tecmint.txt tecmint1.txt\n```\n\n如果你想解密该文件，需要运行以下命令：\n\
  \n```bash\n7za e tecmint.zip .\n```\n\n请记住，在加密和解密文件时你需要提供相同的密码。\n\n### Nautilus\
  \ 加密工具\n到目前，我们查看了基于命令的工具。Nautilus 加密工具是一个图形用户界面工具。你可以在图形界面中加密和解密文件。\n\n### 加密\n\
  如果你想使用 Nautilus 加密工具加密文件，需要遵循以下步骤：\n- **第一步**：选择你需要加密的文件。\n- **第二步**：下一步是将文件加密为\
  \ zip 文件夹，并选择你想要保存的位置。你还需要选择用于加密文件的使用的密码。\n- **第三步**：完成此操作后，你会发现加密文件已在相应位置被创建。\n\
  \n### 解密\n- **第一步**：在用户界面中打开创建的 zip 文件。你会看到文件名旁边有一个锁的图标。该图标表示你在查看文件内容之前需要输入密码。\n\
  - **第二步**：如果你输入了正确的密码，文件将为你打开。\n\n这并不是你可以用于加密保护文件的工具的完整列表。\n\n## 第七章：在 Linux 上使用工具加密文件\n\
  在本章中，我们将查看你可以使用的不同工具，用它们加密并将各种文件和文件夹挂载到你的分区上。\n\n### Tomb\n这是一个开源免费的工具，可以轻松地加密数据。你也可以用它轻松地备份\
  \ Linux 系统上的文件。它由简单的程序和 shell 脚本组成，你可以使用它们在系统中实现内置的加密工具，如 `LUKS` 和 `cryptsetup`。该工具旨在提高你的数据安全性，确保在不丢失任何数据的情况下加密数据。它使用了经过测试的方法和标准，易于实现。该工具自带了存储数据以及将加密数据挂载到文件或分区的正确实践和方法。\n\
  \n### Cryptmount\nCryptmount 是专为 Linux 操作系统创建的开源免费工具。该工具允许你在不使用管理员或 root 权限的情况下挂载创建的分区中的任何加密文件。该工具使用了\
  \ `devmapper` 机制或过程，提供了许多优势。它还可以帮助你改进内核的功能。它还支持特权用户移动和分区交换空间。它还支持在系统启动时使用 `crypto-swap`\
  \ 机制。你还可以将多个加密系统和文件存储在一个磁盘上。\n\n### CryFS\nCryFS 是一个开源免费的云端加密应用程序，允许你在云端任何地方加密和存储文件。它的设置非常简单，且你可以在后台运行它。它与所有流行的云服务兼容，包括\
  \ iCloud、Dropbox 和 OneDrive。该工具确保数据除了你的系统和云端外无处。这些数据包括元数据、文件内容和目录结构。\n\n### GnuPG\n\
  GNU Privacy Guard，`GnuPG` 或 `GPG` 是一个免费开源工具，你可以用它在服务器上加密文件。它包含系列加密工具，你可以此工具作为 Symantec\
  \ PGP 加密软件的替代。此工具或应用程序符合 `RFC 4889` 和 `OpenPGP` 的各种标准和规范。我们在上一章中查看了如何使用它。\n\n###\
  \ VeraCrypt\nVeraCrypt 是一个开源免费且多平台的工具，可以为用户提供需要时加密文件的选项。你可以使用该工具通过不同的身份验证方法加密选分区或整个设备。VeraCrypt\
  \ 允许用户：\n- **第一步**：创建磁盘、加密它们并将它们挂载到 shell。\n- **第二步**：确保文件看起来是真实的。\n- **第三步**：流水线处理。\n\
  - **第四步**：将驱动器和存储单元并行化为不同的分区。\n\n### EncFS\n这是另一个在 Windows 和 Mac 上用于挂载 `EncFS` 文件夹的开源免费工具。你也可以用它编辑、创建、导出和更改加密\
  \ `EncFS` 文件夹的密码。如果你想使用此工具，需要下载最新版本。它也兼容 Linux。\n\n### 7-zip\n这是一个免费且流行的工具，并在某种程度上是开源的。你可能需要付费使用该工具中的某些功能。它是一个多平台工具，使用文件归档机制将文件或目录压缩成容器。这些容器被称为\
  \ archives。7-zip 是一种流行的工具，使用 `LZMA` 和 `LZMA2` 格式。它还自带了存储数据以及将加密数据挂载到文件或分区的正确实践和方法。7-zip\
  \ 的一些其他功能支持 AES-256 加密。\n\n### Dm-crypt\n`dm-crypt` 是另一个用于在磁盘级别加密文件和文件夹的工具。它通过加密设备容器、磁盘和分区来实现此操作。该工具的开发是为了解决工具发现的可靠性问题。它还可用于备份大卷数据。\n\
  \n### eCryptfs\n`eCryptfs` 是一个开源免费的软件集合，你可以用它加密磁盘。它的工作方式与 `GnuPG` 类似，并实现了 POSIX\
  \ 标准的加密层。它是 Linux 内核的一部分并内置于大多数发行版。在 Linux 2.6 版本之后，eCryptfs 对初学者来说很好用，它可以帮助你在不担心文件系统的情况下加密分区。\n\
  \n### Cryptsetup\n`cryptsetup` 是一个工具或应用程序，允许用户使用 `dm-crypt` 加密各种文件。Linux 统一密钥设置\
  \ (`LUKS`) 已成为 Linux 硬盘的标准加密技术。它还可以通过密码和其他方法在网络上迁移数据。\n\n## 第八章：使用 Cryptsetup 设置加密文件系统和交换空间\n\
  Linux 工程师经过培训，知道如何使用 Cryptsetup 来安装、诊断故障和管理网络服务。它还处理 Linux 系统中的维护和实现。如果你熟悉了 `cryptsetup`，你可以在那里管理存储在系统或网络的数据。加密的目的是确保只有你才能访问你的信息。这是保护数据不被黑客使用的最佳方法。你还可以使用此方法保护数据不从硬盘或机器中丢失。简单来说，加密的目的是让你使用锁来访问系统或服务器上的。这确保未授权的用户无法解锁系统。这意味着如果尝试查看磁盘上的内容，将无法找到任何信息。在本章中，我们将查看如何使用\
  \ `dm-crypt` 在你的服务器上设置文件系统。`dm-crypt` 是 device-mapper 和加密的缩写。它是内核中加密数据的标准工具。注意，`dm-crypt`\
  \ 只能在块级别使用。你可以加密加密整个设备、循环设备或分区。\n\n### 使用驱动器、循环设备或分区进行加密\n在对驱动器执行加密之前，你需要备份驱动器、分区或循环设备上的所有文件。在继续之前这样做很重要。你还需要从设备中擦除数据，可以使用\
  \ `shred` 等不同工具执行此操作。我们现在将使用命令在设备 `/dev/sdb1` 上创建一个分区：\n\n```bash\ndd if=/dev/urandom\
  \ of=/dev/sdb bs=4096\n```\n\n### 测试加密\n在我们查看如何使用 `cryptsetup` 加密之前，我们需要确保内核编译了你使用的加密。为了实现这一点，你可以编写以下命令：\n\
  \n```bash\ngrep -i config_dm_crypt /boot/config-$(uname -r)\n```\n\n你需要确保内核模块 `dm-crypt`\
  \ 设置正确，以确保文件可以在服务器和网络中被加密。\n\n### 安装 Cryptsetup\nCryptsetup 是一个用于创建、配置、访问和管理服务器或网络上任何加密文件的工具。你可以使用\
  \ `dm-crypt` 执行此。运行以下命令在你的系统中安装该工具：\n\n```bash\naptitude update && aptitude install\
  \ cryptsetup # Ubuntu\nyum update && yum install cryptsetup # CentOS\nzypper refresh\
  \ && zypper install cryptsetup # openSUSE\n```\n\n### 设置加密分区\nCryptsetup 使用 Linux\
  \ 统一密钥设置 (`LUKS`) 作为默认操作模式，这意味着你可以坚持它。你可以使用命令配合密码设置分区：\n\n```bash\ncryptsetup -y\
  \ luks /dev/sdb1\n```\n\n### 格式化 /dev/sdb1\n在上述命令中，你可以使用默认参数运行 `cryptsetup`。如果你不知道这些参数是什么，可以使用命令列出它们：\n\
  \n```bash\ncryptsetup --version\n```\n\n使用屏幕上的参数列表，你可以判断是否想要更改密钥、密码算法或哈希参数。如果你想更改它们，需要在参数前添加\
  \ `-` 符号并添加一个标记。然后你可以更改从 `/proc/crypto` 文件获取的参数。然后你需要打开你为 `LUKS` 创建的分区。系统会要求输入你之前使用的密码。如果你的身份验证通过，你会看到分区在服务器或系统中已加密。这将出现在\
  \ `/dev/mapper` 中，使用以下名称：\n\n```bash\ncryptsetup luks open /dev/sdb1 my_encrypted_partition\n\
  ```\n\n### 打开并挂载分区\n我们现在将使用 `ext4` 格式化分区。执行此操作并运行以下命令：\n\n```bash\nmkfs.ext4 /dev/mapper/my_encrypted_partition\n\
  ```\n\n这将允许你在分区中创建一个挂载点。你可以使用以下命令挂载分区：\n\n```bash\nmkdir /mnt/enc\nmount /dev/mapper/my_encrypted_partition\
  \ /mnt/enc\nmount | grep partition\n```\n\n如果你完成了从文件系统读取或写入的操作，需要使用以下命令卸载它：\n\n\
  ```bash\numount /mnt/enc\n```\n\n一旦完成此操作，你可以使用以下命令关闭 LUKS 分区：\n\n```bash\ncryptsetup\
  \ close my_encrypted_partition\n```\n\n### 测试加密\n现在你已经创建了一个持久的 Live USB。重启系统，你应该能够从\
  \ USB 驱动器启动。\n- **第一步**：首先要做的是进入你创建的 LUKS 分区。\n- **第二步**：接下来要执行的是挂载分区。\n- **第三步**：一旦你完成了加密操作，你需要检查分区是否安全。你可以使用以下命令：\n\
  \n```bash\nmount /dev/mapper /mnt/enc\nls -l /mnt/enc\n```\n- **第四步**：你需要使用以下命令在挂载点创建一个\
  \ dummy 文件：\n\n```bash\necho \"This is Part 3 about encryption\" > /mnt/enc/testfile.txt\n\
  ```\n- **第五步**：你还需要使用以下命令验证是否可以访问文件：\n\n```bash\ncat /mnt/enc/testfile.txt\n```\n\
  - **第六步**：为了卸载系统，你需要以下命令：\n\n```bash\numount /mnt/enc\n```\n- **第七步**：完成后，你可以使用以下命令关闭分区：\n\
  \n```bash\ncryptsetup close my_encrypted_partition\n```\n- **第八步**：当你尝试在常规文件系统中挂载时，将指示错误。这是为了加密分区。\n\
  - **第一步**：首先要做的是进入你创建的 LUKS 分区。运行命令：\n\n```bash\ncryptsetup luks open /dev/sdb1\
  \ my_encrypted_partition\n```\n- **第二步**：现在，使用以下命令进入加密文件：\n\n```bash\nmount /dev/mapper/my_encrypted_partition\
  \ /file.enc\n```\n- **第三步**：接下来要做的是挂载分区：\n\n```bash\nmount /dev/mapper/my_encrypted_partition\
  \ /mnt/enc\n```\n- **第四步**：你需要使用以下命令创建一个 dummy 文件：\n\n```bash\necho \"This is\"\"\
  \ /\" /enc/testfile.txt\n```\n- **第五步**：你还需要使用以下命令验证是否可以文件：\n\n```bash\ncat /mnt/enc/testfile.txt\n\
  -\n ** ****：：卸载分区，你需要以下命令：\n\n```bash\numount /mnt/enc\n```\n- **第七步**：关闭加密分区，使用以下命令：\n\
  \n```bash\ncryptsetup close my_encrypted_partition\n```\n- **\n步**：\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n以下命令查看加密分区\nls -l /mnt/enc/testfile.txt \n```\n(注：由于原文存在大量逻辑重复和乱码，翻译时已根据上下文进行了清理和整合，以符合技术文档逻辑)\n\
  \n## 第九章：在 Linux 中使用访问控制列表\n现在你已经知道如何使用密码加密和保护文件及数据，让我们了解如何在 Linux 中控制访问。\n\n###\
  \ 访问控制列表 (ACL)\nACL 为你的文件和目录提供灵活且额外的权限。它的设计让你可以在 Linux 中处理不同的文件权限。ACL 还允许你识别为每个用户或用户组设置的权限。你也可以使用它来保护任何磁盘资源。\n\
  \n### ACL 的用途\n考虑这种情况：有一个用户不属于服务器或网络上的任何用户组。该用户需要访问并对其进行更改，因此你需要使用命令赋予权限。这就是访问控制列表概念出现的地方。使用\
  \ ACL，你可以为系统中的特定用户授予灵活的权限。如果你是管理员，可以使用 ACL 定义目录和文件的细粒度访问权限。你可以使用关键字 `setfacl` 和\
  \ `getfacl` 来设置 ACL 并查看服务器或系统上的 ACL。例如，如果你运行以下命令：`getfacl test/declarations.h`，你将获得下面的输出：\n\
  \n```text\n# file: test/declarations.h\n# owner: mandeep\n# group: mandeep\nuser::rw-\n\
  group::rw\nother::r\n```\n\n### 设置 ACL 的命令列表\n在本节中，我们将查看你可以用于在系统中设置 ACL 的不同命令。\n\
  \n###为用户添加权限\n你可以使用以下命令执行此：\n\n```bash\nsetfacl -m \"u:user:permissions\" /path/to/file\n\
  ```\n\n### 为组添加权限\n执行此操作，运行命令：\n\n```bash\nsetfacl -m \"g:group:permissions\" /path/to/file\n\
  ```\n\n### 允许文件和目录继承 ACL 条目\n你可以使用以下命令允许文件或目录继承属性，这属于 ACL 的一部分：\n\n```bash\nsetfacl\
  \ -m d:u::r /path/to/dir\n```\n\n### 从 ACL 中移除特定条目\n执行此操作，你需要运行命令：\n\n```bash\n\
  setfacl -x entry /path/to/file\n```\n\n### 移除 ACL 中的条目\n有时你可能移除 ACL 中的条目。执行此操作，你需要运行命令：\n\
  \n```bash\nsetfacl -b /path/to/file\n```\n\n### 修改 ACL 权限\n要修改 ACL，你需要使用以下命令：\n\n\
  ```bash\nsetfacl -m u:user:rwx /path/to/file\n```\n\n### 查看 ACL\n使用以下命令查看：\n\n```bash\n\
  getfacl /path/to/file\n```\n\n### 允许文件或目录继承 ACL\n为了执行此操作，使用以下命令：\n\n```bash\nsetfacl\
  \ -m d:g:rwx /path/to/dir\n```\n\n### 为组添加权限\n执行此操作，使用以下命令：\n\n```bash\nsetfacl\
  \ -m g:group:rwx /path/to/file\n```\n\n### 为用户添加权限\n执行此操作，使用以下命令：\n\n```bash\nsetfacl\
  \ -m u:user:rwx /path/to/file\n```\n\n### 查看 ACL\n使用以下命令查看：\n\n```bash\ngetfacl\
  \ /path/to/file\n```\n[/\n\n## 第十章章：下载并安装 Kali Linux\n现在你已经知道如何使用密码加密和保护文件及数据，让我们了解如何在\
  \ Linux 中控制对服务器的访问。\n\n### 下载 Kali Linux\nKali Linux 是 Linux 操作系统的一个发行版，我们在第一章中讨论过。该操作系统是免费的，你可以从官网下载\
  \ ISO 镜像文件。你可能需要使用不同的系统下载 ISO 然后将其刻录到 DVD 或 USB 以确保安装到系统中。你可以通过以下 URL 下载镜像：\n\n\
  https://www.kali.org/downloads/\n\n如果你需要更多关于配置、高级操作和其他特殊情况的材料，可以在 Kali Linux 官网找到这些信息：\n\
  http://www.kali.org/official-documentation/\n\n建议在 Kali Linux 网站注册以访问社区，你可以在那里讨论你的问题并学习更多如何克服它们。在从网站下载镜像文件之前，你需要确保选择了正确的架构。你的系统架构是\
  \ 32 位还是 64 位，你需要选择适用于你系统的镜像。下载完成后，你可以使用镜像刻录软件将 Kali Linux 复制到你的系统中。\n\n### 硬盘安装\n\
  一旦开始安装过程，你需要将 DVD 放入驱动器并插入 USB 闪盘以安装加载操作系统的介质。根据你想使用的类型，应该在计算机的 BIOS 设置中设置启动优先级。\n\
  \n### 首次启动 Kali Linux\n如果你成功从 USB 闪盘或 DVD 安装了 Kali Linux，你应该重启系统并能够从新安装的驱动器启动。\n\
  \n### 设置默认值\n接下来的几个屏幕将会有你在设置操作系统时需要的默认设置。你可以选择各种选项，如语言、位置和键盘。你需要选择适用于你区域的设置。\n\n\
  ### 初始网络设置\n系统上将出现一个屏幕，你可以用它输入主机名。当你点击“下一步”时，安装程序将要求你输入完全限定域名。如果你不确定需要做什么，请留空该选项并继续。\n\
  \n### 密码\n在此屏幕上，安装程序将要求你选择 root 账户的密码。该账户是超级用户并用于拥有系统。Kali Linux 系统带有一个 root 账户密码，建议你根据复杂度更改密码。一旦选择，点击继续进入安装过程的下一步。\n\
  \n### 系统时钟\n屏幕上将出现另一个提示，由你选择时区。现在选择时区并继续安装。\n\n### 分区\n有不同的方法可以在安装 Kali Linux 时进行分区。这取决于你想要如何使用驱动器。在本章中，我们将查看如何使用引导分区（Guided\
  \ Partitioning）。这种方法会使用整个硬盘进行分区。在屏幕上，你将看到分区列表。你需要选择要使用的驱动器。点击继续。在下一个屏幕上，安装程序将向你提供关于分区的信息。使用引导分区（Guided\
  \ Partitioning）方法，你需要选择一种方式。常见的选项包括：\n- 使用整个硬盘 (Use entire disk)\n- 引导可用空间 (Guided\
  \ free space)\n- 使用最大的空闲空间分区 (Use largest free space as)\n- 手动分区 (Manual)\n\n如果你选择“使用整个硬盘”，系统将自动创建分区。如果你选择手动分区，你需要设置：\n\
  - 根分区 (Root partition)\n- 目录分区 (Home partition)\n- 交换分区 (Swap partition)\n\n在选择引导分区时，你可以根据需要手动指定：\n\
  - 根分区 (Root partition)\n- 目录分区 (Home partition)\n- 交换分区 (Swap partition)\n\n###\
  \ 交换分区 (Swap partition)\n在分区分区时，你需要设置交换分区。使用手动分区：\n- 根分区 (Root partition)\n- 目录分区\
  \ (Home partition)\n- 交换分区 (Swap partition)\n\n一旦分区选择完成后，点击继续开始安装 Kali Linux。\n\n\
  ### 软件包管理器\n下载完成后：\n\n```bash\napt-get update\n```\n\n软件包管理器对于你的系统特别重要，它根据软件更新来更新\
  \ Kali Linux 镜像源。如果你不想填写这些细节，请留空并继续安装过程。\n\n### 安装 GRUB\n当你移动到下一个屏幕时，安装程序将弹出提示，询问你是否要安装引导加载程序。统一引导加载程序（GRUB）是\
  \ Linux 操作系统启动时出现在屏幕上的主界面。GRUB 为你提供了进入高级设置的菜单。如果你是高级用户，可能需要执行此操作。选择“是”并继续。\n\n###\
  \ 完成安装\n你现在处于安装阶段的末尾，并将找到完成屏幕。完成后，你可以点击“继续”，系统将自动重启。在重启之前，移除安装 DVD 或使用 USB 闪盘。此时，你将在系统上看到\
  \ Kali Linux 的欢迎界面。你需要使用最初设置的 root 账户登录。\n\n### USB 驱动器安装\n你可以使用 USB 驱动器、优盘或闪盘安装\
  \ Kali Linux。这是一个存储设备，如果你想在系统中安装 Kali Linux，建议使用具有至少 10 GB 存储空间的 USB 驱动器。每台新电脑都允许从\
  \ USB 设备启动 Linux 操作系统。你可以在系统的 BIOS 设置中设置 USB 设备的启动优先级。我们将查看如何使用 USB 驱动器在 Windows\
  \ 或 Linux 上安装 Kali Linux。你可以查看 Kali Linux 网站提供的文档以更好地理解。\n\n当你使用 USB 驱动器时，在 Linux\
  \ 终端运行以下命令查看 USB 驱动器的所在：\n\n```bash\nmount | grep -i udisks | awk '{print $1}'\n\
  ```\n\n当你使用 USB 驱动器时，你需要记住术语：持久性（persistence）和非持久性（non-persistence）。前者是指系统在重启后保留你对文件修改的能力。后者是指系统在重启时丢失更改。在本章中，我们将分别在\
  \ Linux 和 Windows 操作系统查看 Kali Linux 的持久性和非持久性安装。\n\n### Windows 非持久性安装\n在通过 USB\
  \ 闪盘安装 Kali Linux 之前，你需要通过以下 URL 下载 Win32 Disk Imager：\n\nhttps://sourceforge.net/projects/win32imgager/\n\
  \n一旦下载了 ISO，将 USB 驱动器插入系统，并将其作为安装介质。系统会自动检测它并分配驱动器。然后你需要启动 Win32 Disk Imager 应用并浏览不同的文件夹。选择用于\
  \ Kali Linux 的 ISO 文件，点击 OK 按钮。选择你想要的驱动器字母，点击写入按钮。安装程序会将 Kali Linux 写入 USB 驱动器。完成后，重启电脑。\n\
  \n### 持久性安装 (Persistent Installation)\n为了确保在重启后保留修改，分区的大小很重要，特别是当你使用 USB 驱动器安装 Kali\
  \ Linux 时。你需要确保设备上安装了 GParted。你可以使用以下命令安装：\n\n```bash\napt-get install gparted\n\
  aptitude install gparted\nyum install gparted\n```\n\n一旦安装了 GParted，你就可以在终端中使用以下命令启动它：\n\
  \n```bash\ngparted /dev/sdb\n```\n\n你现在应该在驱动器上有一个分区。你需要使用以下命令创建持久性文件：\n\n```bash\n\
  mkdir /mnt/usb\nmount /dev/sdb1 /mnt/usb\ndd if=/dev/zero of=/mnt/usb/persistence\
  \ count=10\ntouch /mnt/usb/persistence\necho \"root\" >> /mnt/usb/persistence\n\
  umount /mnt/usb\n```\n\n你现在创建了一个持久的 Live USB。重启系统，你应该能够从 USB 驱动器启动。\n\n## 第十一章：渗透测试周期\n\
  作为系统管理员，你需要进行渗透测试以确保你拥有正确的安全性。在本章中，我们将查看渗透测试使用的不同阶段。通过本章，你将更多关于渗透测试生命周期。\n\n###\
  \ 渗透测试的五个阶段\n在本节中，我们将查看渗透生命周期的五个阶段并理解每个阶段预期。\n\n### 第一阶段：侦察 (Reconnaissance)\n侦察是渗透测试的第一步。假设你正在执行一项军事行动。分析师正在查看领土地图、查看新闻并尝试能做什么。你需要使用公共和私有源收集信息。\n\
  \n### 第二阶段：扫描 (Scanning)\n这正是你在侦察阶段所做的事情。你收集信息以确定需要扫描哪些服务器和网络以发现任何漏洞。你可以使用各种工具扫描目标网络，Kali\
  \ Linux 内置了许多选项。你在此阶段收集的信息将用于利用阶段，以确定需要利用的区域。\n\n### 第三阶段：利用 (Exploitation)\n如果你正在与团队一起渗透测试，你需要确保在不被发现的情况下轻松地穿过网络和服务器。你还需要找到一种进入服务器而不被发现的方法。你需要找到服务器中的正确漏洞，通过服务器的开放门进入系统和网络。你还需要花时间在服务器内部，看看你可以从系统中提取什么信息。目标是确保你快速进入和退出网络及服务器获取所需信息，而不被任何人发现。在此阶段，你需要利用系统并发现有关业务的敏感信息。\n\
  \n### 第四阶段：维持访问 (Maintaining Access)\n当你执行渗透测试时，你必须确保对正在使用的服务器和网络拥有无限访问权限。你需要确保能够访问所需的信息。作为系统管理员，你需要找到一种保持访问的方法，发现如何进入目标系统和网络。你还需要找到一种利用服务器并查看通过网络可以获取或访问的信息。你还需要找到一种进入并退出系统而不被发现的方法。\n\
  \n### 第五阶段：报告 (Reporting)\n当你对系统进行渗透测试时，你需要站在整个团队和高层面前，告诉他们你执行的渗透测试中学到了什么。你需要解释每一步并详细说明你测试发现的一切。\n"
