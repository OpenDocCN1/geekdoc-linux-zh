  md: '# Reading Input


    Although shell programs do not generally require a lot of interaction with users,
    you can use the read command to request a line of input from STDIN.


    The general syntax for the read command is:


    ```

    read [variable_name, ...]

    ```


    If you don''t provide a variable name, the line of input is assigned to REPLY.


    If you provide a single variable name, the whole line of input is assigned to
    it. If you provide more than one variable name, the line of input is broken up
    into words and assigned to the variables one by one. The last variable on the
    command line gets whatever words are left over.


    Here are some examples of the read command:


    ```

    % read <- use the default variable

    This is a great day! <- which is named REPLY.

    echo $REPLY

    This is a great day!

    ```


    This is a simple example. The default variable is used to hold the entire line
    of input.


    ```

    % read one two <- use your own variables

    This!is a great day!

    % echo **$one *$two** - ends words,

    *This!is* *a great day!* - exclamation characters

    ```


    This example is slightly more difficult. The first variable is assigned the value
    of the first word from the line of input. But how are words delimited? It turns
    out that Bash has a variable IFS (short for Internal Field Separator) that holds
    the word-delimiting characters. Normally, the space, tab, and newline characters
    delimit words. This is why, in the last example, the first word was "Thistlis".
    Any English-speaking person can tell that "This!is" would be two words, but Bash
    knows only about the space, tab, and newline characters.


    You can make Bash a little more intelligent by adding the exclamation character
    to the end of the IFS variable. For example:'
  merge: -1
  pgno: 130
- img_proc: true
  md: '```

    % IFS="$IFS\!"

    % read one two

    This!is a great day!

    % echo "**$one* $*two*"

    *This*is a great day!

    ```


    Now the shell recognizes that "This" and "is" are separate words. Notice that
    the delimiting character, the exclamation, disappears. The shell tosses the delimiting
    characters away.


    Pay close attention to the way that the exclamation character was appended to
    the IFS variable. If the exclamation character is not "escaped" by the slash,
    the shell interprets it as a special character related to the shell''s command
    history. This book doesn''t cover the topic of command history. If you''re interested,
    the best place to start learning about command history is in the Bash man page
    (use the **man bash** command).


    If you decide that you don''t want to make a long-lasting change to your shell
    environment by changing the IFS variable, you can use a compound command like
    this:


    ```

    % (IFS="$IFS!"); read one two; echo "**$one* $*two*"

    This!is!algreatday.

    *This*is!algreatday.*

    ```


