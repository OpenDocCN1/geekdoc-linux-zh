    Tcl also does an admirable job at replacing text inside of files. Because of Tcl''s
    quoting rules and particular viewpoint, it''s worth looking closely at how Tcl
    can be used to implement replace.sh.

    Tcl''s approach to command-line parameters is similar to Perl''s. However, instead
    of determining how many parameters exist by examining the @ARGV array, you can
    simply use the argc Tcl variable. Another small difference is revealed when the
    name of the script itself is needed. Bash and Perl store the name of the currently
    executing script in $0; Tcl uses argv0.


    > I usually refer to Bash and Tcl variable names without the initial dollar sign
    because that''s how they are used in assignment statements. However, with Perl
    it seems better to always show the initial data type indicator—the $, @, or %
    characters. You can use whatever method you like. I haven''t seen any "official"
    rules regarding this topic.


    As a programmer who works with many languages, I frequently make mistakes that
    relate to how computer languages handle quotes. For me, Tcl is no exception. These
    typos invariably require several trials to fix. So let me point out one gotcha
