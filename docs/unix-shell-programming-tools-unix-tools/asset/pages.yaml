  md: "# Objects\n\nhave a flat top, a place for your legs, and perhaps a drawer or\
    \ two—you realize that all 50 items are desks. This process of generalization\
    \ is critical to object-oriented programming.\n\nObject-oriented programs move\
    \ from the general (a definition of a desk) to the specific (an 18^{th} century\
    \ mahogany rolltop desk) using classes. A class defines the characteristics of\
    \ an object—its properties and behaviors. A generic class can represent many different\
    \ objects. A more specific class—a subclass—represents fewer objects, but describes\
    \ each more precisely. Subclasses inherit properties and methods from their parent\
    \ classes.\n\nThe terms object and class are pretty interchangeable, except that\
    \ a class might be considered an object described in computer language—whereas\
    \ an object is just an object.\n\nThe design of a class is dependent on the project\
    \ you’re programming. The description of an object, and the class, depend on what\
    \ needs to be done. If you were attempting to design a school course-scheduling\
    \ program, your objects would be very different than you were designing a statistics\
    \ program.\n\nThere are four buzzwords associated with object-oriented programming.\n\
    \n**Abstraction**: Information about an object (its properties) can be accessed\
    \ in a manner that isolates how data is stored from how it is accessed and used.\n\
    \n**Encapsulation**: The information about an object and functions that manipulate\
    \ the information (its methods) are stored together.\n\n**Inheritance**: Classes\
    \ can inherit properties and methods from one or more parent classes.\n\n**Polymorphism**:\
    \ A child class can redefine a method already defined in the parent class.\n\n\
    The rest of this section discusses these buzzwords in the context of creating\
    \ a class that represents pens as an inventory item.\n\nAll inventory items have\
    \ at least a part ID number and a quantity-on-hand number associated with them.\
    \ Let’s use these two properties to create an inventory class:\n\n```\n$Inventory\
    \ = {\n  'PART_ID'    => 'PEN1491',\n  'QTY_ON_HAND' => 14\n}\n```"
  merge: -1
  pgno: 200
- img_proc: true
  md: "# Chapter 06 / Using Perl\n\nIn object-oriented Perl programs, I equate a variable\
    \ with an object. Each hash key-value pair is a different property of the object.\n\
    \nThe (...) notation returns a reference to an anonymous hash variable. The ->\
    \ notation indicates key-value pairs; each -> represents another hash entry. I\
    \ need to use references to show you object-oriented techniques, but I don't have\
    \ space to explain them fully. A basic definition of a reference is that it points\
    \ to a spot in memory. In this case, you'll need to access the anonymous hash\
    \ later in your code. And because it has no name, you'll need to store the reference\
    \ value.\n\nThe code above uses a hash to represent the class. Each property in\
    \ the class becomes an entry in the hash. This type of representation is fast,\
    \ easy to program, and easy to extend. If you need to add a new property, perhaps\
    \ price, all you need to do is add an additional hash entry:\n\n```\n$Inventory\
    \ = {\n  'PART_ID'     => 'PEN1491',\n  'QTY_ON_HAND' => 14,\n  'PRICE'      \
    \ => 28.50\n};\n```\n\nYou can display the properties like this:\n\n```\nprint\
    \ \"Part ID: $Inventory->{'PART_ID'}\\n\";nprint \"Quantity: $Inventory->{'QTY_ON_HAND'}\\\
    n\";nprint \"Price: $Inventory->{'PRICE'}\\n\";\n```\n\nYou now know how to create\
    \ an object by hand. Listing 6.3 shows how to create objects programmatically.\n\
    \n# Listing 6.3 inv.pl—Creating Inventory Objects\n\n```\n#!/usr/bin/perl\n\n\
    # Start using a namespace called Inventory.\npackage Inventory;\n\n# Define a\
    \ function that can create a new Inventory\n# object. The new function returns\
    \ a reference to\n# an anonymous hash containing the two key-value pairs\n# passed\
    \ to new.\nnew {\n  my($class) = shift;\n  my(@params) = @_;\n```"
