- img_proc: true
  md: "# Chapter 11 / Debugging Concepts\n\n% perl -e '$x = 1; print $x'\n\nHere's\
    \ another example: the infamous and nefarious infinite loop. Take a look at the\
    \ following Tcl code:\n\n```\nfor {set x 1} {$x != 10} {set x [expr $x + 2]} {\n\
    \  puts $x\n}\n```\n\nThe idea here is that the loop prints out the odd numbers\
    \ between 1 and 10. Let's walk through this code step by step and see why it doesn't\
    \ stop. When the for statement starts, it initializes the value of the variable\
    \ x to 1. Next, it evaluates the test part of the command, to make sure the value\
    \ of x is not equal to 10. It's not, so the body of the loop is executed, which\
    \ prints out the value of x. Finally, after the loop is executed, the interpreter\
    \ executes the next part of the command, which adds 2 to the value of x, making\
    \ it 3.\n\nYou can probably see where this is heading. Now the value of x is 3,\
    \ so the body is executed and x is incremented by 2 to 5. At the next test, x\
    \ is still not equal to 10, so the body is executed and x is incremented to 7.\
    \ At the next test, x doesn't equal 10, so the body is executed and x is incremented\
    \ to 9. The test is performed again, and x doesn't equal 10, so x is incremented\
    \ to 11. At this point, it's clear that x will never be equal to 10, because it's\
    \ already more than 10, and we're adding to its value at the end of every loop.\n\
    \nThe problem here is the test portion of the if command. Tests that make sure\
    \ that x equals 10, or x does not equal 10, are not very robust tests. We can\
    \ rewrite this snippet of code so that the loop stops when x is more than 10:\n\
    \n```\nfor {set x 1} {$x <= 10} {set x [expr $x + 2]} {\n  puts $x\n}\n```\n\n\
    You will never run out of opportunities to make new mistakes of this nature. My\
    \ best advice is that you should stay calm and analyze the error messages and\
    \ your code closely for errors. If it takes more than 15 minutes to find the syntax\
    \ problem, get up and take a short walk to clear your head."
