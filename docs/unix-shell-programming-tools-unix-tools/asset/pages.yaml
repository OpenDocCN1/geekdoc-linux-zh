  md: '# The replace Command


    You might recall from Chapter 5, "Controlling the Shell," that command1 && command2
    is a command list. The second command executes only if the first command succeeds.
    You might also recall that the (command1; command2) notation indicates a compound
    command and that all of the commands inside the curly braces are executed in the
    current shell. A child shell is not used.


    By using both techniques, you can simulate an if..then control statement. I know
    that Bash has an if statement, but every technique you learn moves you along the
    slippery slope to "expert programmer."


    In order for the text replacement script to be flexible, it needs to be able to
    search in a variety of directories or no file extension. This type of flexibility
    can be achieved using options on the command line.


    The first step to recognizing command-line options is deciding how they need to
    be specified. Should the user use single-letter options or longer, more descriptive
    words? Let''s focus on single-letter options for this example.


    The next step is deciding which options to support and determining if they are
    optional. We''ve already talked about needing to specify a directory and file
    extension, so let''s stick with those as command-line options. Using -d to specify
    a directory and -e to specify a file extension should work fine. It makes sense
    that the majority of replacements are done in the current directory, so the -d
    option should be optional. What about the -e? Well, a good default action, if
    no extension is specified, can be searching every file. Therefore, the -e option
    is also optional.


    Let''s take stock of the situation so far. The syntax of the replace.sh script
    looks like this:


    ```

    replace.sh [-d=directory] [-e=extension] oldtext newtext

    ```


    The last step is determining how to tell a command-line option is specified. Remember
    that inside shell scripts, the options are stored in variables $n. So the four
    options are stored in $1, $2, $3, and $4. However, because the options are optional,
    the oldtext and newtext parameters might be stored in any of the four variables.
    For example, if only one option is specified, then oldtext and newtext will be
    in $2 and $3, respectively.'
