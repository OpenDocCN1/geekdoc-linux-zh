    \ glory.\n\n# **Listing 10.3** filter.tcl—Filter Out Today's Messages from the\
    \ Rest Using Tcl\n\n```\n#!/usr/local/bin/tcl\n\nset filterfile wwwboard.html\n\
    \nputs {Content-type: text/html}\n\n<head>\n<title>filtered output</title>\n</head>\n\
    <body>\n<h1>Today's Posts</h1>\n}\n\nset today [exec date +%m/%d/%y]\nset today\
