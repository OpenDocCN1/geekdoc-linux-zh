- img_proc: true
  md: '# 134 Chapter 06 / Using Perl


    Perl combines arrays that are side-by-side into a single array.

    This means that ( 1, 2, 3), (4, 5, 6 ) is the same as ( 1, 2, 3, 4, 5, 6 )

    By combining arrays, Perl ensures that each array element is a scalar value. Some
    programmers call this behavior flattening.


    One of Perl''s savers is the list range operator. An operator indicates you want
    Perl to perform an action on one or more operands. The list range operator is
    expressed as two periods together (..) and is used to specify a range of elements
    in a list. For example, the expression (0..5) is shorthand for (0, 1, 2, 3, 4,
    5). Like-wise, (A..F) is shorthand for (A, B, C, D, E, F).


    Perl can evaluate arrays in either a list or a scalar context. When evaluating
    in a list content, all of the elements are used. For example:


    ```

    @array = (0..5);

    print "Array\n";

    ```


    This code snippet displays "0 1 2 3 4 5".


    > TIP

    The $variable controls controls which delimiter is displayed between array elements.
    Its default value is a space. However, you can change it to whatever you like.
    For example, if you want to print array elements one per line, use \$="\n"; to
    assign the newline character as the array element delimiter.


    When evaluating an array in a scalar context, the number of elements is returned.
    For example:


    ```

    @array = (0..5);

    $numElements = @array;

    print "$numElements\n";

    ```


    This code snippet displays "6".


    Another saver is the array slice feature. Array slices are subsets of existing
    arrays. For example, suppose you only need the third and fifth elements of an
    array. Instead of writing:


    ```

    @array = (0..5);

    $third = @array[2];

    $fifth = @array[4];

    ```'
