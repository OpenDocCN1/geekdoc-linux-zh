  md: '# Table 6.7 Perl''s Special Variables (Cont''d)


    | Variable Name | Description |

    | %ENV | This hash variable contains entries for your current environment variables.
    Changing or adding an entry only affects the current process or a child process,
    never the parent process. |

    | %SIG | This hash variable contains entries for signal handlers. For more information
    about signal handlers, see Chapter 13, "Handling Exceptions." |

    | - | This file handle (the underscore) can be used when testing files. If it
    is used, the information about the last file will be used to evaluate the new
    test. |

    | DATA | This file handle refers to any data following __END__. |

    | STDERR | This file handle is used to send output to the standard error file.
    Normally, this is connected to the display, but it can be re-directed if needed.
    |

    | STDIN | This file handle is used to read input from the standard input file.
    Normally, this is connected to the keyboard, but it can be changed. |

    | STDOUT | This file handle is used to send output to the standard output file.
    Normally, this is the display, but it can be changed. |


    Some of Perl''s special variables are hard to understand without examples. Unfortunately,
    I don''t have space in this book to do them justice. The ENV hash and the DATA
    file handle are interesting and simple to illustrate with short lists.

    As you might know from Chapter 2, "Variables & Operators," environment variables
    are critical to effective shell programming. Perl lets you read and modify environment
    variables directly using the %ENV hash. While you can change environment variables,
    those changes will not persist after the process running Perl has ended. The changes
    will, however, affect the current process and any child processes that are started.'
