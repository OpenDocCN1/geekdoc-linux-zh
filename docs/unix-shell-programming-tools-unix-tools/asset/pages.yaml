    # The cksum Command


    Synopsis:

    cksum calculates the checksum of a file.


    Syntax:

    cksum [--help | --version] [file..]


    Description:

    The cksum command was originally intended to make sure that files transferred
    from one system to another weren''t corrupted in the process. This test requires
    the checksum to be calculated on the original system, calculated again on the
    destination system, and the two figures compared. If the checksums were the same,
