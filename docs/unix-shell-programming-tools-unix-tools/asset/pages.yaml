  md: 'There are two special cases that you need to know about:


    +   1. You can''t match a / character. The character is the name of the root directory
    and is used as a delimiter for path names.


    +   2. The * character won''t match periods at the beginning of files. You must
    explicitly specify the initial dot in your pattern.


    TIP Use single or double quotes to control which program expands the pattern.
    With quotes, the program (e.g., ls) expands the pattern. Without quotes, the shell
    expands the pattern.


    When the shell finds filenames that match a pattern, it replaces (or expands)
    the pattern into a list of filenames that match. For example, ls f* might become
    ls foo. This is an important note to remember. Sometimes, you want the command
    to expand the pattern instead of the shell.


    # Pattern Expansion


    Filenames are replaced by a list of matching files.


    The two obvious times when shell pattern matching might not be appropriate are
    when using the grep command and calling Perl or Tcl scripts. Let''s look at an
    example using the grep command. The grep command searches one or more files looking
    inside each one for a specified pattern.


    For more information about the grep command, see“The grep Command” on page 340
    in Chapter 9, “Examining the Tools.",


    The following example looks in all C files for text lines that contain words beginning
    with dav or Dav. Both foo.c and bar.c contain such patterns, so both should be
    found by the grep command.


    ```

    % ls

    foo.c  bar.c david

    % grep [Dd]av* *.c <- Nothing was found?

    % echo [Dd]av* *.c

    grep david bar.c foo.c <- Ah, here''s the reason.

    ```


    You can use the echo command to find out the shell expands your command lines.
    In this case, the first argument to grep, the [Dd]av* pattern, matches the david
    file and therefore is'
