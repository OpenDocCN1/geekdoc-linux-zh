  md: '# Creating Compound Commands


    The line numbered 2 executes two commands, the cd command and the pwd command.
    The cd command changes to a new directory; the pwd command displays current working
    directory. Notice that the cd command changes the current directory, which isn''t
    the behavior we need. The goal is to retrieve the name of the parent directory
    without changing the current shell.


    The parenthesized expression in the line numbered 3 runs the same commands as
    line 2, except that they are run in a child shell, the cd command affects the
    child shell normally, so pwd displays the name of the login shell''s parent directory.


    Now let''s return to our original compound command example: parentDir=$(cd ...
    :pwd)


    Backicked strings are executed, and the resulting output replaces the backicked
    string in the original command. Therefore, this example reduces to:


    parentDir=/var


    > By the way, even in the "more powerful" Perl and Tcl languages, escaping to
    the shell using (cd .. :pwd) might be the easiest way to determine the parent
    directory name. Learning the fundamentals (i.e., the shell language) is always
    a good idea.


    # TIP


    The next example displays an error message if the init.dat file doesn''t exist.
