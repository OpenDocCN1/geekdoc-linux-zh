  md: '# What is the User''s First Name?


    The first.pl script makes use of the $_ special variable. Many of Perl''s functions
    use the $_ variable if no other variable is specified. For example, when a line
    of input is read using the <FILE> operation, that line is stored in $_ When you
    use the m// operator, it looks for patterns using $_ as the target string. Additionally,
    split breaks up the string in $_ if no second parameter is supplied. The $_ variable
    provides a nice way to streamline your code.


    Perl''s split function creates an array of string using a specified pattern as
    the delimiter. The heart of the first.pl script lies in the following line of
    code:


    ```

    $FIRST_NAME = split(/[\s]/., split(/:/)[4]);

    ```


    This line of code performs the following steps. First, it creates an array using
    the colon character as a delimiter. Then, using parentheses to create an array
    context and the [n] notation to specify an element, it selects the fourth element
    (corresponds to the fifth column). Next, that element is split further using either
    whitespace or the comma. The first element returned by the second split function
    is assigned to the $FIRST_NAME variable.


    The following lines of code show each step as a single line of code—which is less
    efficient than placing everything on one line.


    ```

    @list_fields = split(/:/);

    $user_info = $list_fields[4];

    @list_user_info = split(/[\s]/., $user_info);

    $FIRST_NAME = $list_user_info[0];

    ```


