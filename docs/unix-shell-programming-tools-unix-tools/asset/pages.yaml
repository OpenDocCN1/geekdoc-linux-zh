- img_proc: true
  md: 'Logic errors are quite numerous and hard to predict. My best advice regarding
    logic errors is to keep your statements as simple as possible. When using Perl,
    avoid the ++ and -- (pre-increment and post-increment operators). Additionally,
    both Perl and Tcl use a single equal sign for assignment and two equal signs in
    conditional expressions; for programmers who use more than one language, equal
    signs can be a source of continuing frustration.

    The most common type of error is the type. You might have entered a curly brace
    inside of a square brace or spelled "name" as "nane."., programmers forget to
    use end-of-line delimiters like the semi-colon in Perl or the slash line-continuation
    character in Bash.


    # Syntax Errors


    The syntax of a programming language is the set of rules for creating legal, well-formed
    statements in the language, and when you break the rules, Bash or Perl or Tcl
    can''t decipher your code. They display error messages describing what they think
    the problem is and on what approximate line the error resides.

    Syntax errors are the easiest kind of error to make when you''re writing a script,
    and they''re the easiest kind of error to fix. They are the easiest in the sense
    that you are absolutely positive something-wrong—after all, the script interpreter
    tells you so. How-ever, knowing that something is wrong and knowing what that
    something is are two different kettles of fish.


    There are a million different ways to make syntax mistakes in a script. Here are
    a few common examples, which represent just a few ways that you can mess up your
    script if you''re not paying attention.


    # Improper Form


    Form is important. In English, you need to make sure that the words in a sentence
    are in a certain order: you that English, sure are a need make the words in in
    a certain sentence order to just doesn''t make sense, even though it contains
    the same words as the first part of the sentence. Similarly, the script''s interpreter
    expects commands to be structured in a certain way.'
