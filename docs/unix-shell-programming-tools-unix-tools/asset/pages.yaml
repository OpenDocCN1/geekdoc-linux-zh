    \ this chapter) with the for command.\n\n# Perl\n\nPerl uses regular expressions\
    \ for pattern matching, pattern substitution, and character translation. Pattern\
    \ matching uses the m// operator, which returns true if a requested pattern is\
    \ matched; false otherwise. The substitution operation uses the s// operator and\
    \ replaces one pattern with a replacement pattern. The tr// translates one set\
    \ of characters into another. These operators are summarized in Table 8.3.\n\n\
    # Table 8.3 Perl’s Regular Expression Operators\n\n| Operator | Description |\n\
    | m/PATTERN/ | This operator returns true if PATTERN is found in $_. |\n| s/PATTERN/REPLACEMENT/\
