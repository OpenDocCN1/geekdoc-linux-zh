  md: 'Some of this syntax should already be familiar to you. The $1 positional variable
    was discussed in Chapter 2, “Variables and Operators,” where it was used to access
    the command-line parameters. In Listing 3.1, it’s used to access parameters passed
    to the procedure. In this case, it’s the name of the tar file that is being untarted.


    Here is an example of the script in action:


    ```

    % chmod +x untar

    % source untar

    % untar medined.tar

    ```


    “The for Command” section in Chapter 4 shows you how to change the untar function
    to handle multiple tar files.

    Notice that you don’t need any special mechanisms to run the procedure. You simply
    use it like any other shell command—after the script has been sourced, of course.
    Interestingly enough, you can run the untar procedure from either the command
    line or from another script file. Once you source the procedure, it becomes a
    part of the shell, usable anywhere a “normal” Bash command can be used.


    The untar command does not display any output. Instead, the information is sent
    to a log file called ~/tar.log. If you try this procedure, check the log file
    created in your home directory. My log file, after the above sequence of commands,
    looks like this:


    ```

    medinet.tar

    Sat Mar 14 15:42:31 EST 1998

    name.pl

    desk.pl

    pen.pl

    ```


    This output shows that on March 14, 1998 at 3:42 in the afternoon I extracted
    three files from the medinet.tar file. If you work with tar files a lot, this
    information might come in handy if you need to remember which tar file a specific
    file came from.


    As mentioned earlier, you can use the untar procedure (or any other procedure
    you create) inside scripts. Calling a procedure means the shell stops executing
    the current series of commands. Execution flow jumps to the commands inside the
    procedure.'
