    # MacPerl


    Perl has also been ported to the Mac. In some ways, such a port\seems bizarre:
    Larry Wall sometimes refers to Perl as a "distillation

    of Unix," and there are those (present company excluded) who think

    of the Mac’s command-line-less interface as the antithesis of Unix.

    Still, MacPerl makes a lot of sense. First, MacPerl is handy for sys-

    tem administration tasks that aren''t especially easy under a graphical

    interface—such as renaming all the files in a folder or grepping

    through several different files for a search term. Second, plenty of

    web development takes places on Macs (where all the nice tools are),

    and there are plenty of test servers running under Mac OS.


    The Mac OS has its own models for security and multitasking,

    and it''s nonsensical to map Unix concepts (like permissions

    and inter-process communications) onto Mac ideas. Thus, there

    are some Unix-based Perl functions that simply aren''t implemented

    in MacPerl.


    Table 10.2 shows the Tcl functions not available in the MacPerl

    environment, according to the most recent documentation.


    # Table 10.2 Perl Functions NOT Available in MacPerl


    | Function | Description |

    |---|---|n| crypt | This function encrypts a file. |

    | exec | This function executes a built-in system program. |

    | chroot, login, getpgrp, setppid, getptw*, getgr*, setgr*, endgren, endpwe, umask
    | These functions get (or set) user and security information. |

    | fork, kill | These functions are process-related. |'
