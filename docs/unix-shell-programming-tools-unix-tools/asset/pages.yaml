  md: '# The xargs Command


    Table 9.44 lists the options usable with the xargs command.


    # Table 9.44 Options for the xargs Command


    | Option | Description |

    |---|---|

    | --eof=DELIMITER or -eDELIMIT | Defines the end-of-file string. When the end-of-file
    string is encountered in the input, no further processing is done. The default
    delimiter is the underscore character (_). The --eof option is present without
    the DELIMITER being specified, then xargs stops looking for an end-of-file string.
    |

    | --exit or -x | Exits the current command line if the maximum command-line length
    is exceeded. The -size option specifies the maximum command-line length. |

    | --help | Displays a help message. |

    | --interactive or -p | Requests confirmation from the user before running each
    command line. This option implies the --verbose option. |

    | --max-args=NUM_ARGS or -n NUM_ARGS | Uses at most NUM_ARGS per command line.
    Fewer than NUM_ARGS will be used if using NUM_ARGS exceeds the maximum command-line
    length specified in the --maxchars option. If the --exit option is specified and
    the maximum command-line length is exceeded using NUM_ARGS, then xargs exits.
    |

    | --max-chars=MAX_CHARS or -s MAX_CHARS | Specifies that each command line can
    be at most MAX_CHARS long. The default maximum characters is as long as Unix can
    handle, up to 20,000 characters. |

    | --max-lines=NUM_LINES or -1NUM_LINES | Uses at most NUM_LINES nonblank input
    lines per command. This option implies the exit option. |'
  merge: -1
  pgno: 432
- img_proc: true
  md: '# Table 9.44 Options for the xargs Command (Cont''d)


    | Option | Description |

    | --max-procs=NUM_PROCS or -P NUM_PROCS | Runs up to NUM_PROCS processes at once.
    If NUM_PROCS is zero, as many processes as possible are used. The --max-args option
    is frequently used in conjunction with --max-procs to ensure that multiple processes
    are started. |

    | --no-run-if-empty or -r | Prevents the command from running if the input is
    empty or all blanks. Normally, the command is run at least once. |

    | --null or -0 | Uses a null or zero byte as the delimiter determining the list
    of parameters present in the input. No other characters have any special meanings.
    Additionally, the --eof parameter, if present, is ignored. Frequently used in
    conjunction with the -print0 option of the **find** command. |

    | --replace=REPLACE_STR or -iPLACE_STR | Provides a mechanism of substitution
    into the command that gets executed. All instances of REPLACE_STR in the initial_parameters
    section of the command line are replaced with the parameters found in STDIN. Using
    this option implies the --exit and --maxlines=1 options. If REPLACE_STR is omitted,
    curly braces ({}) are used. |

    | --verbose or -t | Displays each command line to STDERR before executing it.
    |

    | --version | Displays a version message. |


