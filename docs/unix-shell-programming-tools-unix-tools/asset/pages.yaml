    # The read Command


    Synopsis


    **read** gets one line of input from STDIN.


    Syntax


    read [-r] [variable_name...]


    Description:


    The **read** command can be quite versatile because it can read both from the
    keyboard and files.


    The **read** command is also described, with more examples, FRI the "Reading Input"
    section of Chapter 5, "Controlling the Shell."


    With no parameters, the command simply reads from STDIN and stores one line of
    input in the REPLY variable. If you supply variable names, Bash stores each word
    of input in its corresponding variable, with any leftover words being assigned
    to the last variable.


    Bash uses the *IFS* to determine where words start and end; when getting input
    from the user, you rarely need to change IFS. However, if you redirect stdin from
    a file, you might need to change IFS to recognize different end-of-field characters.
    Chapter 5, in the "Reading Input" section, has examples of changing *IFS* to use
    different delimiters.


    The -r option indicates that the backslash (\) character does not perform its
    normal line-continuation function. For example:


    ```

    % read

    Line One \

    Line Two

    ```'
