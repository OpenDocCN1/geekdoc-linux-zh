    \ my friends from IRC, Phil Howard, has worked with the find command for many\
    \ years. He frequently uses it to construct command lines. For example:\n\n```\n\
    % dir2=backup\n% find find -type d -printf \"mkdir -p ${dir2}/%P\\n\" -o \\\n\
    \  > ! -type d -printf \"mv %p '${dir2}/%P\\n\" \\\n  mkdir -p /backup/\n  mv\
    \ /dir1/one.txt /backup/dir1.txt\n  mv /dir1/two.txt /backup/dir1/two.txt\n  mv\
