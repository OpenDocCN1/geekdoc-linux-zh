    # Using Device Files


    In Unix, all of the hardware devices connected to your computers are represented
    by device files in the /dev directory. Device files are merely a convenient way
    for the operating system (or you) to communicate with the hardware. They provide
    a consistent way to send and receive information.


    Most of the aspects of device files fall into the realm of system administration
    instead of programming and won’t be covered here. However, you should know some
    basics. Table 5.3 shows some of the different types of device files.'
