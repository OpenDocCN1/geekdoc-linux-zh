    ```

    % # Is the hard disk a block device? NO

    % (test -b /dev/hd0; echo $)

    1

    ```


    ```

    % # Have I spelled my home directory correctly? NO

    % (test -d /hme/medined; echo $)

    1

    ```


    ```

    % # Create two files.

    % echo "FILE1" > file1

    % echo "FILE2" > file2

    % # Test the modification times.

    ```


    ```

    % # Is file1 newer? NO

    % (test file1 -nt file2; echo $)

    1

    ```


    ```

    % # Is file1 older? YES

    % (test file1 -ot file2; echo $)

    0

    ```


    ```

    % # The ~ notation is valid and is a directory.

    % (test -d ~; echo $)

    0

    ```


    ```

    % # test can handle strings quite well.

    % # Is USER empty? NO

    % (test -n $USER; echo $)

    0

    ```


    ```

    % # Is USER equal to "medined"? YES

    % (test $USER = "medined"; echo $)

    0

    ```


    ```

    % # Is USER equal to "MEDINED"? NO,

    % # The test is case-sensitive.

    % (test $USER = "MEDINED"; echo $)

    1

    ```


    ```

    % # Is the current user my wife or myself?

    % test $USER = "medinek" -o $USER = "medined"

    % echo $?

    0

    ```


    ```

    % # test can also handle positive and negative integers.

    % (test 5 -eq "5"; echo $)

    0

    ```


    ```

    % # As a special case, you can use -1 STRING, the length

    % # of STRING, in place of one or more integer arguments.

    % (test 5 -eq -1 "12345"; echo $)

