    \ variable. The other 13 assignment-operators are combinations of some operation\
    \ with the equal sign—another of Perl's shortcuts. You can use +=, *=, /=, %=,\
    \ -=, **=, x=, <<=, &=, ||=, and ^= as assignment operators. For example, $numBooks\
    \ += 15; adds 15 to the value of $numBooks.\n\n# Functions\n\nFunctions are sections\
    \ of code designed to do a specific task. In order to let you refer to them conveniently,\
    \ these sections of code are given names. Perl includes both built-in functions\
    \ and userdefined functions. This template to create user-defined functions:\n\
    \n```\nSub functionName {\n  # statements\n}\n```\n\nThe Sub statement causes\
    \ Perl to store the subroutine’s state for future use. Function names must start\
    \ with a letter and can't use $, @, %, or or & in their names.\n\nYou invoke Perl\
    \ subroutines like this:\n\n```\n...\nfunctionName();\n...\n```\n\nSome subroutines\
    \ require information in order to do their work. For example, a subroutine that\
    \ multiplies two numbers needs to know which numbers to multiply. The specific\
    \ numbers to use are passed into the subroutine as parameters inside the parentheses\
    \ at the end of the subroutine. For example:\n\n```\n...\n$result = multiply(4,\
    \ 2);\n...\n```"
