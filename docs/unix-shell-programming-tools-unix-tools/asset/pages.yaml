    107


    # Using Advanced Redirection


    The advanced redirection techniques shown here are probably the most complex topics
    in this book. Only the topic of pattern matching comes close. However, by building
    from simple examples to more complex examples, I''ve made the techniques as easy
    to understand as possible.


    Our first example shows how to combine two output streams into one—STDERR is combined
    with STDOUT.


    ```

    % (date ''+%B %d''; ls -1 *.foo) >ls.log 2>&1

    cat ls.log

    ```


    May 10

    ls: *: No such file or directory


    The date command sends its output to STDOUT, while the ls command (because there
    aren''t any files with an extension of foo) generates errors that are sent to
    STDERR. When the .log file is displayed, both STDOUT and STDERR have been merged.
    You could merge the streams in the opposite direction and have STDOUT merge into
    STDERR, but that would go against convention.


    You can merge any two output streams using m>&n notation. The output going to
    the m descriptor is merged with the output going to the n file descriptor.


    That example wasn''t too hard, was it? Let''s take the next step by looking at
    the file descriptors 3 through 9. Unix only reserves file descriptors 0, 1, and
    2—the are yours to use as you see fit.


    The next example looks at using file descriptor 4 to temporarily hold an exit
    value for a first command in a pipe sequence. Normally, the exit value of a pipe
    sequence of commands is the exit value of the last command executed. Because each
    command is executed in its own child shell, the exit values of the earlier commands
    are lost.


    You can use redirection to save the exit value of one of the earlier commands.
    The only caveat is that the normal STDOUT needs to be redirected to a file.


    ```

    % status=`a; echo $?) >4 | b >so.dat 2>se.dat 4>&1

    ```'
