- img_proc: true
  md: '# The sort Command


    The sort1.dat file has four fields (or columns) per line. By default, sort arranges
    the lines based on the leftmost field. If two lines have identical leftmost fields,
    the next field is examined—and so on until sort decides which line should come
    first in the sorted output.


    You can force sort to base its comparison on a different field using the -k option.
    For example, the following command sorts on the second field:


    ```

    % sort -k2 sort1.dat

    2 AB CC DD

    1 AC BB CC

    5 BD AA AA

    4 BE DD EE

    3 CA BB CC

    ```


    Notice that the second column, the sort key, is shown in bold for easy reference.
    This was only done for illustration purposes; the sort command doesn''t have this
    feature.


    You can also sort on a subfield. For example:


    ```

    % sort -k2.3 sort1.dat

    3 CA BB CC

    2 AB CC DD

    1 AC BB CC

    5 BD AA AA

    4 BE DD EE

    ```


    The above command line sorts sorts on the second characters of the second field.
    Why the command needs .3 instead of .2 is unclear to me. But, hey, it works and
    that''s counts.


    The various sort key options can be appended to the -k option to modify the sort
    behavior. For example, to sort in reverse order, use the r option.


    ```

    % sort -k2.3r sort1.dat

    4 BE DD EE

    5 BD AA AA

    1 AC BB CC

    2 AB CC DD

    3 CA BB CC

    ```


    The -b option comes in handy if your input files aren''t in nice neat rows. Listing
    9.10 shows such a file.'
  merge: -1
  pgno: 402
- img_proc: true
  md: '# Listing 9.10 sort2..dat—A Datafile Used to Demonstrate the sort Command


    ```

    1 AC BB CC

    2 AB CC DD

    3 CA BB CC

    4 BE DD EE

    5 BD AA AA

    ```


    Sorting sort2.dat on the second column doesn''t quite work:


    ```

    % sort -k2 sort1.dat

    1 AC BB CC

    2 AB CC DD

    5 BD AA AA

    4 BE DD EE

    3 CA BB CC

    ```


    This command didn''t work properly because sort, by default, doesn''t understand
    multiple spaces or tabs between fields. Using the -b option fixes the situation:


    ```

    % sort -k2 sort1.dat

    2 AB CC DD

    1 AC BB CC

    5 BD AA AA

    4 BE DD EE

    3 CA BB CC

    ```


    If you actually want to eliminate the extra spaces, use the tr command:


    ```

    % cat sort1.dat | \\

    > tr --squeeze-repeats " " | \

    > sort -k2 sort1.dat

    2 AB CC DD

    1 AC BB CC

    5 BD AA AA

    4 BE DD EE

    3 CA BB CC

    ```


    The sort command is quite useful. However, when sorting files, make sure you have
    adequate temporary disk space.'
