  md: '# Using Statements


    ```

    {

    $scalar1++;

    $scalar2 += 10;

    }

    ```


    If you know that a certain variable is only needed inside a statement block, you
    can use the my function to create a local variable. Changes to a local variable
    don''t affect global variables of the same name. For example:


    ```

    $numRooms = 10;

    my($numRooms) = 20;

    print "numRooms = $numRooms\n";

    print "numRooms = $numRooms\n";

    ```


    The above code prints 20 and 10 because the my function creates a local version
    of the $numRooms variable. Variables created with the my function can only be
    used inside the statement blocks in which they are created. If you use my outside
    a statement block, the variables can be used anywhere in the file.


    # Decision Statements


    Decision statements are used to choose between two courses of action. The basic
    decision statement is the if statement. If-statements look like this:


    ```

    if ($numRooms > 9) {

    print "Very Large House\n";n} elsif ($numRooms > 6) {

    print "Large House";

    } else {

    print "House\n";n}

    ```


    If the condition expression in the first line of this example evaluates to true,
    the first statement block is executed. When the condition evaluates to false,
    the second statement block is executed. Both the else and elsif clauses are optional.

    If you need to test for a false value, you can use the unless statement. The unless
    statement works exactly opposite to the if statement.'
