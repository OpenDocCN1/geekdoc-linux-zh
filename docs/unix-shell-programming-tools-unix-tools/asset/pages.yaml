  md: '# Meltdowns


    It''s sometimes easy to forget that the Bash, Perl, and Perl interpreters are
    software distributions and, like all software, might contain their own bugs that
    manifest themselves even if your own code is completely error free. There''s very
    little you can do about errors, or not submit a bug report via the appropriate
    channels and try to rewrite your software around the problem. Such bugs might
    cause your script to return bizarre or unexpected results, on the Mac OS or Windows
    platforms, might cause the Perl or Perl application (or the whole machine) to
    go down.


    Fortunately, such problems are rare, and patches and fixes appear with startling
    promptness. In fact, I am not aware of any unfixed bugs in the current distributions
    of Bash, Perl, or Perl.


    # Debugging Techniques


    In the real world, programmers spend more time debugging programs than writing
    the code in the first place. If you''re banging out little scripts for your own
    personal quick-and-dirty use, you probably don''t need to make your scripts flawless.
    However, you will still need to fix problems when your scripts misbehave.


    # Bash Debugging


    Shell scripts are generally small. But you can still run into problems while creating
    them. To help you, Bash provides a few options through its set command.


    The set -u command turns on unbound variable flagging. Here is a demonstration
    of its use:


    ```

    % echo $bookName

    % set -u

    % echo $bookName

    bash: bookName: unbound variable

    % bookName=''Shell Programming Tools''

    % echo $bookName

    bash: bokName: unbound variable

    % echo $bookName

    Shell Programming Tools

    ```'
