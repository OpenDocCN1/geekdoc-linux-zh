  md: "# 422\n\n# Chapter 10 / Portability Issues\n\nLike the shell, and unlike Perl,\
    \ Tcl strips the newline from the results of the system call.\n\nNow, we need\
    \ to make a system call to date, and put the results into a variable. Tcl provides\
    \ a special function, called exec, for executing system calls. We'll use Tcl's\
    \ command substitution to stand in the shell's version of command substitution\
    \ and Perl's backticks:\n\n```\nset today [exec date %+m/%d/%y]\n```\n\n# CAUTION\n\
    \nBe careful with exec on Windows! It really doesn't do what you'd expect at all.\
    \ (See the \"Tcl Under Windows\" section, later in this chapter, for more details.)\n\
    \nStep 3 of the master plan is to format the date string by removing the leading\
    \ zero. Tcl's variable substitution doesn't offer an equivalent for the shell's\
    \ fancy strip-leading-characters substitution, but it does offer a built-in function,\
    \ string trimleft, that neatly accomplishes the same result—removing the first\
    \ character:\n\n```\nset today [string trimleft $today 0]\n```\n\n# NOTE\n\nThe\
    \ string trimleft function removes any instances of its parameter from the beginning\
    \ of its first parameter. In this example, all zero characters are removed from\
    \ the start of $today.\n\nIn step 4, it's time to write our grep-surrogate in\
    \ Tcl. It's easy, and it's nearly equivalent to the Perl procedure, if a little\
    \ wordier:\n\n```\nset myfile [open filterfile]\nwhile [!eof $myfile] {\n    gets\
    \ $myfile line\n    if [regexp $today $line] puts $line]\n}\nclose $myfile\n```\n\
    \nFinally, we write out the closing HTML. Once again, we can use a single puts\
    \ function call:\n\n```\nputs {\n<br><br>\n<hr>\n<a href=board.html>Back to main\
    \ message board</a>\n</body>}\n```"
