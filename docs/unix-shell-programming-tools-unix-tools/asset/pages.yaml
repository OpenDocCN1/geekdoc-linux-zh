    Finding all files except for a given filename means that you want to print the
    filename when -name "two.txt" is false, so the -or operator is needed:


    ```

    % find -name "two.txt" -or -print

    ./one.txt

    ./three.txt              <- ./two.txt is missing.

    ./dir1

    ./dir1/one.txt

    ./dir1/three.txt        <- ./dir1/two.txt is missing.

    ```


    The find command is frequently used to generate a list of files.'
