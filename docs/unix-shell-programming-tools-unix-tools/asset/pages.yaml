    Description:

    The diff command is used extensively by Unix programmers to determine what has
    changed between two versions of a file. Programmers usually focus their attention
    on source code files. However, you can be much more creative. I use diff to monitor
    whole directories (as explained in the cksum section of this chapter).


    If either the FROM or TO parameters are directory names, diff handles them in
    a special way. If only FROM is a directory, then diff compares the file FROM/TO
    (i.e., the file in the directory with the same name as the destination file) to
    the file named TO. For example, (cd /home/medined; diff /home/bashrc) compares
    /home/medined/.bashrc to /home/harry/.bashrc. If both FROM and TO are directories,
    then diff compares each of the files in one directory to the corresponding files
    (based on their names) in the other directory, in alphabetical order. If you need
    the comparison to walk the directory hierarchy, use the --recursive option.


    If there are no differences between the compared files, diff will not display
    any output at all (unless you use the -s option).


