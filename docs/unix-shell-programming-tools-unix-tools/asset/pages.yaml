- img_proc: true
  md: 'incorrect variable names, like using a variable called shipping-Books instead
    of Shipping_Books.


    After the relative ease of fixing the syntax errors comes phase two-finding and
    fixing logic errors. In Bash, you can use the set -u and set +x command to turn
    on unbound variable flagging and expanded command display. I also recommend the
    use of the echo command to verify the command-line variable expansion before running
    any potentially dangerous command.


    Perl has three main techniques for catching bugs. The -w command-line option,
    the strict module, and the print statement. The -w option tells Perl to look for
    some dangerous situations, like variables that are only used once. The strict
    module does a few things, the most important being that it requires you to declare
    all variables before they are used. And the last technique, the print statement,
    is ubiquitous across all computer languages. Simply place print statements at
    strategic locations throughout your code to display status messages and the value
    of important variables.


    Tcl doesn''t have Perl''s ability to turn on extra levels of warning messages,
    but the puts function to display variables and monitor the progress of your program
    is very helpful.


    The Perl interactive debugger can be very useful, although I have a feeling that
    most Perl programmers don''t use it enough. Its many commands and its ability
    to interactively display variables, call functions, and change the values of variables
    make it invaluable when creating larger and more complex scripts.


    The Tcl/Expect combination produces an interactive debugger similar to Perl. You
    can use it to step through your script, display the value of variables, and change
    the variable''s value on-the-fly.


    Chapter 12, “Customizing the Tools,” gives you a chance to use all of these debugging
    techniques when you try out the samples provided. The scripts are shown in more
    than one language so you can compare and contrast how the languages are similar
    and how they are different.


    Chapter 12, “Customizing the Tools,” investigates Bash, Perl, and Tcl can be used
    to perform everyday tasks. You see new tools created through custom scripts. Each
    custom script is developed using two or more languages so you can form your own
    opinion about which language is best for each task.'
