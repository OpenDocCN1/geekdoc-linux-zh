  md: "# Using Statements\n\nthe procedure definition, but does not actually execute\
    \ the procedure until you call the procedure.\n\nHowever, when you are writing\
    \ a more complex script, you probably want to use control structures—conditional\
    \ statements, which execute commands or blocks of commands selectively and looping\
    \ structures, which repeat commands or blocks for a certain number of repetitions.\
    \ Tcl offers a basic set of conditional statements and looping structures.\n\n\
    # Conditional Statements\n\nTcl offers two basic commands that handle conditions:\
    \ if and switch.\nYnYou had a peek at the if command earlier in this chapter.\
    \ Basically, if executes a command or a block of commands if a test expression\
    \ evaluates to true. Optionally, the if command can include an alternate command\
    \ or command block to execute if the test conditional expression evaluates to\
    \ false. Thus, if is a three-five-word command:\n\n```\nif condition command(s)\n\
    ```\n\nor\n\n```\nif condition(s) else alternate-commands\n```\n\nHere's an example\
    \ of how if (with an else clause) might look in real world code:\n\n```\nif ($x\
    \ == black) {\n    puts \"The color is black\"\n} else {\n    puts \"The color\
    \ is white\"\n}\n```\n\nRemember that the brackets are there for grouping purposes\
    \ and are not part of the command itself. Before Tcl evaluates the conditional\
    \ expression, it strips off any braces.\n\nThe switch command is handy for handling\
    \ strings that have several different values. You can associate a block of code\
    \ with any number of strings (or regular expression patterns); if switch matches\
    \ its argument string with any of the strings that are associated with blocks\
    \ of code, it executes the appropriate code.\n\nFor example, consider the following\
    \ code:"
