    \ The rest of the replacement list is ignored.\n\nUnlike the matching and substitution\
    \ operators, the translation operator doesn't perform variable substitution.\n\
    \nThe translation operator has options different from the matching and substitution\
    \ operators. You can delete matched characters, replace repeated characters with\
    \ a single character, and translate only characters that don't match the character\
    \ list. Table 8.6 shows the translation options."
