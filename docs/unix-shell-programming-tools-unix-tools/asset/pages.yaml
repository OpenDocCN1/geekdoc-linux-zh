    http://bplyot.obspm.fr/~/dlwwtools.html.


    # Summary


    In this chapter, you learn about the basic issues that you face when you port
    scripts from one language to another. We look at a case study of a simple CGI
    script ported from Bash to both Perl and Tcl.


    Perl has been ported to Windows. Although certain functions, such as those that
    handle security issues and multitasking, are not supported under Windows, it is
    fairly easy to port Perl scripts to Windows. System calls (via system, exec, backtracking,
    and pipes) can be used to invoke DOS''s built-in commands.


    Tcl has also been ported to Windows. All of the core Tcl commands are supported
    under Windows. The behavior of exec (and pipes) is a little peculiar: exec must
    execute a file, rather than a DOS command. You can work around this restriction
    by writing DOS commands to a batch file and executing the file.


    Perl has been ported to the Mac in the form of MacPerl. Many security and multitasking
    commands are not supported under Mac OS, and there is no means to invoke operating
    system commands (because there aren''t any to invoke!)


    There''s also a Mac port of Tcl. The only core Tcl command that is not supported
    on the Mac is exec. It is especially important to be careful about Mac filenames
    that contain slashes (/) when you''re working with Tcl on the Mac OS.


