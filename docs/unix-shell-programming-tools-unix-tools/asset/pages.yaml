  md: "# Chapter 06 / Using Perl\n\nQuite often, a finer level of control is needed\
    \ over looping statements. Using the conditional expression only provides one\
    \ point of control—at the beginning or end of the loop. What if an error arises?\
    \ What if you need to restart the loop?\nPerl has a series of jump keywords to\
    \ help you control loops. The last keyword jumps out of the current statement\
    \ block. The next keyword jumps to the next iteration of the loop. The redo keyword\
    \ restarts the current iteration of the loop. And the goto keyword jumps to a\
    \ specified label. For example:\n\n```\nfor (i = 0; i < 10; i++) {\n    last $numRoom\
