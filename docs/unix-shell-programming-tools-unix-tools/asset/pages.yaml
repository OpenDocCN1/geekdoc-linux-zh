  md: '# The expr Command


    Synopsis


    expr evaluates an expression and sends the result to STDOUT.


    Syntax


    expr expression


    Description:


    The expressions used in expr commands can be very complex. Some of them involve
    regular expressions. The simpler expressions evaluate arithmetic expressions,
    like this:


    ```

    % n=expr 12 + 34

    % echo $n

    46

    % n=expr $n + 1

    % echo $n

    47

    ```


    The first expr command assigns the results of 12+34 to the variable n. The second
    expr command increments n by one. More examples are shown after Table 9.13—which
    shows all of the operators that can be used with expr.


    # Table 9.13 Operators for the expr Command


    | Operator | Description |

    | \( op1 \) | Returns the result of evaluating op1. |

    | op1 | op2 | Returns op1 if op1 is not null or 0. Otherwise op2 is returned.
    |

    | op1 & op2 | Returns op1 if both operands are not null and not 0. Otherwise 0
    is returned. |

    | op1 = op2 | Returns 1 if the expression evaluates as true, 0 otherwise. These
    operators perform their normal functions of equals, not equals, greater than,
    greater than or equal to, less than, less than or equal to. |

    | op1= op2 | |

    | op1 > op2 | |

    | op1 >= op2 | |

    | op1 < op2 | |

    | op1 <= op2 | |'
