  md: '# Using Modules


    +   - The file name should have a file extension of pm.

    - The package should be derived from the Exporter class if object-oriented techniques
    are not being used.

    - The module should export functions and variables to the main namespace using
    the @EXPORT and @EXPORT_OK arrays if object-oriented techniques are not being
    used.


    Since most modules have their own namespace, you need a way to tell Perl both
    the namespace and the variable name or function you''re interested in. The ::
    notation tells Perl which namespace you need:


    ```

    Test::foo();

    ```


    This line of code invokes the foo function in the Test package.

    Occasionally, you may see a reference to what may look like a nested module. For
    example, $Outer::Inner::foo. This really refers to a variable named Outer::Inner,
    so by the statement:

    package Outer::Inner; Module designers sometimes use this technique to simulate
    nested modules.


    You can also choose to export function and variable names from the module''s namespace
    to the default namespace (main). Object-oriented modules keep all function and
    variable names hidden. They are not available directly, you access them through
    the module name. Remember the class->function notation shown in the object-oriented
    section? However, simple function collections don''t have this object-oriented
    need for secrecy. They want your script to directly access the defined functions.
    This is done using the Exporter class and the @EXPORT and @EXPORT_OK arrays.


    The Exporter module supplies basic functionality that gives your script access
    to the functions and variables inside the module. The import function, defined
    inside the Exporter module, is executed at compile-time by the use compiler directive.
    The import function takes function and variable names from the module''s namespace
    and places them into the main namespace. Thus, your script can access them directly.'
  merge: -1
