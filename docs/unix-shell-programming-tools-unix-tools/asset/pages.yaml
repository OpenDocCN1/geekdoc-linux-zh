  md: '# Summary


    What about our filtering CGI from the beginning of the chapter? Unfortunately,
    I cannot in good faith recommend that you write CGIs in Tcl on the Mac. To date,
    there isn''t a good mechanism to pass information (such as the contents of the
    $ENV variable) from a MacHTTPd-compatible server to a Tcl script. It is theoretically
    possible, using AppleScript as the glue between the server and tcl, but it''s
    a non-trivial task. I suggest you use MacPerl for your Mac CGI needs. If you''re
    serious about running Tcl-based CGIs on a Mac, you should probably start by writing
