  md: '# Using Perl


    This chapter takes you on a whirlwind tour of Perl—a very popular programming
    language. You learn about its basic features, such as its many operators, functions,
    and file-handling abilities. Perl’s pattern matching feature is covered in Chapter
    8, “Pattern Matching.”'
