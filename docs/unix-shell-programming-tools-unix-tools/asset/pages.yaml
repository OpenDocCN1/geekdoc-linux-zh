  md: '# Bash Quoting Rules


    The /proc directory is a pseudo-filesystem that is used as an interface to kernel
    data structures (including those that are used to track running processes). Normally,
    only system administrators need to know the details about the /proc directory,
    so I will avoid describing it in this book. You can find more information about
    /proc by using the man proc command. If you don''t have the man pages loaded on
