  md: '# Using Eval


    The **eval** command concatenates its parameters and executes the newly created
    command. This effectively results in a second round of variable substitution.
    This functionality has some fascinating uses. First, look at a very basic use
    of **eval**


    ```

    $ function="ls *.dat"

    $ eval $function

    cat.dat  cut.dat  mail.dat

    $ function="ls -1 *.dat"

    $ eval $function

    -rw-rw-r- 1 medined medined 45 May 9 15:42 cat.dat

    -rw-rw-r- 1 medined medined 45 May 9 15:42 cut.dat

    -rw-rw-r- 1 medined medined 45 May 9 15:42 mail.dat

    ```


    In this example, the same command **eval $function** produces two different results
    because the value of $function changes. Using this technique, you indirectly run
    commands. At times, this can be handy. For example, perhaps you need to let users
    run different commands but you always want the results to be logged:


    ```

    % eval "function >> $USER.log"

    % ls $USER.log

    medined.log

    ```


    Using the **$USER** variable lets each user have his own log file. It''s time
    to move on to something more complicated—arrays. An array is a list of items,
    like this fruit array: apples, pears, and oranges. Manipulating lists of information
    is usually easier than using separate variables for each one. In some languages,
    you can reference the first element of the fruit array with this type of notation:
    fruit[1], which is equal to apples.


    Bash doesn''t have any support for arrays. But you can create fake arrays using
    the **eval** command. I think it''s easier to see a working example of this technique
    before reading. Listing 5.10 contains a list of appointments. Listing 5.11 holds
    a script that reads the list and displays the appointment for either the current
    date or a date specified on the command line.'
