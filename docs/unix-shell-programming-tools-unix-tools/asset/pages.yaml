  md: '# Portability Across Platforms


    dows 95 and NT operating systems. (Henceforth, I shall refer to Windows 95 and
    Windows NT as simply “Windows.”) For example, there is a whole family of commands
    for dealing with inter-process communication—i.e., programs communicating with
    or controlling other programs——but Windows has its own proprietary methods for
    dealing with these issues. Similarly, Windows handles security and file access
    privileges in its own way, and it''s impossible to map the Unix model onto Windows.


    Table 10.1 shows the Perl functions not available in the Windows environment.


    # Table 10.1 Perl Functions NOT Available in Windows


    | Function | Description |

    |---|---|

    | getnetbyname, getnetbyaddr, getnetent, getprotoent, getservent, setprotoent,
    setservent, endhostent, endprotoent, endservent, socketpair | Functions to handle
    basic network operations. |

    | msgctl, msgget, msgrcv, msgsnd, semcttl, semget, semop, shmctl, shmget, shmread,
    shmwrite | Functions to handle interprocess communications. |

    | ioctl | Function to manipulate the properties of devices, especially terminals.
    Not especially portable across Unices, and doesn''t make sense on Windows, where
    devices aren''t treated like files. |

    | chroot | Function to change root for current process. |

    | fcntl | Function for file locking and multithreading. |

    | link, stat, readlink, symlink | Function to handle symbolic links. |

    | umask | Function used for file permissions. |'
  merge: -1
