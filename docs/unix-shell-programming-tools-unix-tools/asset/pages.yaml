    ```


    By using this technique you can use several log files simultaneously. Perhaps
    one log file holds messages about directories and another messages about files.
    As an alternative, you could use a different log file for each user. The possibilities
    and permutations are numerous.


    Another way to use exec is to redirect STDOUT and then restore STDOUT to normal.
    Listing 5.9 redirects STDOUT for most of the script, but restores STDOUT back
    to the terminal before the last command.


    # Listing 5.9 Listing 5.9[stdout1—Using the exec Command to Redirect STDOUT and
    then Restoring It


    ```

    #!/bin/bash


    exec > /tmp/standard_output


    echo "This line is going to the file."

    echo "This line is too too."


    exec > /dev/tty

    echo "This line is going to the display."

    ```


    Here is an example of this script in action:


    ```

    % chmod +x stdout1

    % ./stdout1

    This line is going to the display.

    % cat /tmp/standard_output

    This line is going to the file.

    This line too.

    ```


    The /dev/tty device file represents the display connected to your login shell.
    So if you redirect STDOUT to /dev/tty, you essentially restore it to normal.'
