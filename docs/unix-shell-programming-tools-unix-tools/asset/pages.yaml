  md: '# Using Static Information


    Static text is a little more complicated than static numbers. There are two types
    of static text—single-quoted text and double-quoted text. Single-quoted text is
    used without any processing. Double-quoted text is subject to variable interpolation
    before it is used. Variable interpolation replaces the variable name with the
    variable''s value. For example:


    ```

    $age = ''14''

    print "Charlie is $age years old\n"

    ```


    This code snippet displays "Charlie is 14 years old". Notice that the value of
    $age has replaced the variable name in the output. The static value of $age is
    assigned using single-quotes because no variable interpolation is needed. Double-quoted
    strings take longer to evaluate than single-quoted strings. Therefore, single-quoted
    strings should be used whenever possible (i.e., whenever there are no variables
    to interpret).


    Double-quoted text also lets you use some special characters, like the newline
    character, to get different results. The characters are represented by escape
    sequences in double-quoted strings. Table 6.1 lists Perl escape sequences.


    # Table 6.1 Perl Escape Sequences


    | Escape Sequence | Description |

    |---|---|

    | \a | Alarm bell |

    | \b | Backspace |

    | \e | Escape |

    | \f | Form feed |

    | \n | Newline |

    | \r | Carriage return |

    | \t | Tab |

    | \v | Vertical tab |

    | \$ | Dollar sign |

    | \@ | Ampersand |'
