    # The groff Command


    Synopsis


    groff formats text files using a tag-based language.


    Syntax


    ```

    groff [options] [file...]

    ```


    Description:


    The groff command accepts text files as input and formats the

    contexts specified by tags embedded in the text. The embedded

    tags are similar, in concept, to HTML. However, unlike HTML,

    groff provides a much greater level of control over what your doc-

    ument looks like.


    At first glance, groff might not seem like a command that shell

    programmers need to know about. However, let me tell you a short

    story about a pharmaceutical company. Every year this company

    needed to create an annual report listing all of the pharmaceutical

    compounds in their database and their hazard ratings. A couple of

    years ago, a programmer wrote a program to generate an HTML

    report that showed the required information and allowed people to

    view the report at any time through their web browsers. There

    were several problems with this solution:


    +   - The report needed to be printed, not viewed. Each year the

    report was printed, copied 20 times, and distributed in an

    annual review meeting.


    +   - The report was more than 1,600 pages long! Even though only

    800 compounds were in the database, HTML’s lack of

    whitespace control and pagination control resulted in a lot of

    pages with only one or two lines on them.'
