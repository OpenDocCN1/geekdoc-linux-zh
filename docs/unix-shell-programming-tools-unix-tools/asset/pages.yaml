    # Summary


    This chapter gives you a good first look at basic Tcl concepts and practices,
    and a fleeting glimpse of Tcl''s most popular extension, Tk. Hopefully, you have
    learned enough to decipher (and even modify) other folks'' Tcl programs, and get
    started on writing your own scripts.


    You must understand substitution to understand Tcl. There are three basic kinds
    of substitution in Tcl: variable substitution, ($) symbol, which substitutes a
    variable''s value for the variables name; command substitution, marked by square
    brackets ([]), which substitute the command''s value for the command; and back-slash
    substitution, marked by the backslash (\), which is used to implement escape sequences.


    Another critical Tcl concept is that of grouping. Tcl uses braces ({}) and double
    quotes (") to group a series of words into a single "word". (Square brackets,
    used for command substitution, also serve to group bracketed content.) Braces
    prevent substitution within the braced material; double quotes allow substitution.


    Tcl has two basic data types: simple variables and arrays. Simple-variables can
    hold just anything: numbers, strings, or lists. You don''t need to initialize
    simple variables, or specify their type. Tcl converts the content of the variable
    between formats as needed. Tcl arrays, like Perl hashes, are sequences of simple
    variables that are indexed by numbers or strings.


    You learned about decision and loop statements. Both types of statements are vital
    to properly control your program''s logic. Decision statements let you choose
    between two options. Loop statements let you repeatedly execute a group of statements.


    Tcl offers basic tools for working with files and other text streams, such as
    pipelines. You open files or streams with the open command, and use the resulting
    file code to read and write to the file or stream with gets and puts, respectively.'
  merge: -1
