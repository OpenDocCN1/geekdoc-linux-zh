    # Bash Quoting Rules


    You''ve seen a few examples so far of using the echo command to display the value
    of variables. Now let''s look at the rules behind the usage. There are three kinds
    of quotes you can use in shell scripts:


    +   - double quotes—Double quotes around text stop the shell from interpreting
    most special characters. For example, the # character doesn''t begin commands
    inside double quotes, it simply indicates a pound sign. However, the $, , and
    " characters keep their special meanings.


    +   - single quotes—Single quotes around text stop all character interpretation
    except for the single quote character.


    +   - backticks—Backticks around text indicate command substitution. The shell
    command inside the backticks is executed, and the resulting output is substituted
    for the backticks text. All special characters are interpreted normally.


    The following series of commands shows how the rules for double quotes work:


    The second and third commands show that the dollar sign and backtick characters
    retain their special meanings.'
