  md: '# What is the User''s First Name?


    The first step in this task requires filtering the password file so that only
    the line relating to the current user is shown. Filtering usually implies the
    `grep` command, and that''s what we use here:


    ```

    $ grep "$USER" /etc/passwd

    medined::500:500:David Medinet,,:,/home/medined:...

    kathy::500:500:Kathryn,,:,/home/medined:...

    ```


    Oops. I forgot my wife and share a home directory. The pattern used with grep
    needs to be changed so that only the start of the input lines is looked at:


    ```

    $ grep "$USER" /etc/passwd

    medined::500:500:David Medinet,,:,/home/medined:...

    ```


    Much better. Now there is only one line to deal with. The next step involves extracting
    the fifth column where the columns are delimited by colons. Column extraction
    usually means using the `cut` command:


    ```

    $ grep "$USER" /etc/passwd | \

    cut --delimiter=":" --fields=5 \

    David Medinet,,:,/home/medined:...

    ```


    Well, there''s the first name that is needed. So let''s perform a second extraction
    based on the space character:


    ```

    $ grep "^USER" /etc/passwd | \

    cut --delimiter=":" --fields=5 \

    cut --delimiter=":" --fields=1 \

    David

    ```


    Let''s test this command using the kathy user:


    ```

    $ grep "^kathy" /etc/passwd | \

    cut --delimiter=":" --fields=5 | \

    cut --delimiter=":" --fields=1 \

    Kathryn,,,

    ```


    Because no last name was specified in the password file, a *third extraction*
    needs to be done—this time based on the comma character:


    ```

    $ grep "^kathy" /etc/passwd | \

    cut --delimiter=":" --fields=5 | \

    cut --delimiter=":" --fields=1

    ```'
