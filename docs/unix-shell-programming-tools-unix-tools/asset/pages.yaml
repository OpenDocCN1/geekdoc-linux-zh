    - <- The value is back!


    This series of commands shows that the count variable defined in the current or
    login shell is not accessible in the child shell.


    CAUTION Make sure that you don''t leave any spaces around the equal sign in your
    assignment commands or use the let command as described in the "The let Command"
    section later in this chapter.


    Now use the export command to make the count variable available to the child shell:


    +   % export count-19 <- assign a value to count

    - and export it.

    % bash <- start a child shell.

    % echo $count <- display count''s value.

    19 <- The value is displayed.

    % exit <- leave the child shell.


    Notice that the export command can be used as part of the assignment command.
    This feature helps to shrink your scripts and reduce cross-referencing. If the
    export command were run later in the script and you were trying to understand
    what the script was doing, you''d need to check the assignment command to see
