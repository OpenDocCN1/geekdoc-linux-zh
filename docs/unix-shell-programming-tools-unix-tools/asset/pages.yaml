    Table 2.2 lists all of the operators used by the shell in order of decreasing
    precedence. Operators with a higher level of precedence are evaluated before operators
    of a lower level of precedence.


    # Table 2.2 Shell Operators and Their Order of Precedence


    | Level | Operator | Description |

    | --- | --- | --- |

    | 13 | -, + | Unary minus, Unary positive |

    | 12 | !, ~ | Logical negation, Bitwise inversion or one''s complement |

    | 11 | *, /, % | Multiplication, Division, Modulus |

    | 10 | +, - | Addition, Subtraction |

    | 9 | <<, >> | Bitwise left shift, Bitwise right shift |

    | 8 | <=, >=, < > | Less than or equal to, Greater than or equal to, Less than,
    Greater than |

    | 7 | =, != | Equality, Inequality |

    | 6 | & | Bitwise AND |

    | 5 | ^ | Bitwise XOR |

    | 4 | | | Bitwise OR |

    | 3 | && | Logical AND |

    | 2 | || | Logical OR |

    | 1 | +=, -=, *=, /=, %, &=, <=, <<, >= | Assignment, Evaluate the operator then
    assign |


    > You might think Table 2.2 lists a lot of operators. You''re wrong; this list
    is actually fairly modest. For example, the shell does not support the exponentiation
    operator. For this and more advanced operators, you need to use Perl or Tcl.'
