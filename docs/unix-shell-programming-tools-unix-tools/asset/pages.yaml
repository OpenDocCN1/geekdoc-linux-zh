  md: "# Metachacters for the case Command\n\nThe case command is discussed in Chapter\
    \ 4, “Commands to Control Script Execution.” It deserves to be mentioned again\
    \ because you can use patterns with it. First, let me remind you of the syntax\
    \ for the case command:\n\n```\ncase string\nin  regular_expression_1\n    commands\
    \ ..\n    ::\n  regular_expression_2\n    commands ..\n  ::\n*)\n    commands\
    \ ..\n  ::nesac\n```\n\nEach of the clauses in the case command uses a regular\
    \ expression or pattern for matching the string's value. Any of the metachacters\
    \ used for filenames can be used with the case command.\n\nListing 8.1 shows a\
    \ short script that uses the case command to display a project's due date.\n\n\
    # Listing 8.1 duedate—Using Case to Display a Project's Due Date\n\n```\n#!/bin/sh\n\
    case $1 in\n  Pp[[Ee][Nn]]\n    echo \"The pen project is due 11/20/1998\"\n \
    \   ::\nben)\n  echo \"The ben group of projects are due in January 1999.\"\n\
    \  ::\n*)\n  echo \"The $1 project is unknown.\"\n  ::\nesac\n```\n\nHere is an\
    \ example of this script in action:\n\n```\n% chmod +x duedate\n% ./duedate Pen\n\
    The pen project is due 11/20/1998.\n```"
