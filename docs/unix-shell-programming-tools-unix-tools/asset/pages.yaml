- img_proc: true
  md: "executes identically to\n\n```\n#!/usr/bin/perl\nif ($title eq \"Perl\") {\n\
    \    print \"The title is Perl.\\n\";n}\n```\n\nThe second line in both examples\
    \ holds the beginning of the if statement. The end of the if statement is the\
    \ closing bracket. Notice that the entire statement does not have to be contained\
    \ on one line. \nThe eq used in the code snippet is not an operator. You might\
    \ have read about operators in Chapter 2, \"Variables\". Perl has a lot more operators\
    \ than the shell does. The eq operator compares two text strings for equality.\
    \ In this case, the $title variable is being compared to the \"Perl\" text string.\n\
    \nStatements are built out of variables, operators, and functions. You've already\
    \ read about variables. The next step is to examine operators. Functions are discussed\
    \ in the \"Functions\" section later in this chapter. Finally, all of the statement\
    \ elements are pulled together in the \"Statements\" section of the chapter.\n\
    \n# Operators\n\nPerl has many operators. An operator indicates you want Perl\
    \ to perform an action on one or more operands. The standard arithmetic operators\
    \ are addition, subtraction, multiplication, and division. In addition, Perl operators\
    \ to assign values, do comparisons, test the status of files, manipulate lists,\
    \ and do a variety of other things.\n\nYou can use more than one operator in a\
    \ statement. In order to determine which operation is performed first, Perl uses\
    \ a specific Order of Precedence. However, if you use parentheses to explicitly\
    \ tell Perl how to evaluate statements, you can effectively ignore the issue of\
    \ operator precedence. For example, instead of using 5 + 4 * 2, I use 5 +(4 *\
    \ 2). Operations inside parentheses are evaluated first—they have the highest\
    \ level of precedence."
