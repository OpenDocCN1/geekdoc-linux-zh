- img_proc: true
  md: '# Debugging Tools


    Table 11.2 The Debugger Commands (Cont''d)


    | Command | Description |

    | --- | --- |

    | Commands That Involve Breakpoints: | |

    | b | Sets a breakpoint at the current execution line. You can specify a line
    where the breakpoint should be set. For example, $b 35 sets a breakpoint at line
    35. You can also create a conditional breakpoint. For example, $b 35 $numLines==0$
    causes the debugger to stop at line 35 only if $numLines is equal to zero. Watch
    conditions can also be attached to functions; just use the function name instead
    of a line number. |

    | d | Deletes the breakpoint from the current execution line. If you specify a
    line number, the breakpoint is deleted from that line. |

    | D | Deletes all breakpoints. |

    | L | Lists all breakpoints and actions. |

    | Commands That Display Information: | |

    | l | Lets you print parts of your script. There are several flavors of this command
    that you can use:

    - Using a plain l displays about 10 lines of your script.

    - Using l 5+4 displays 4 lines of your script, starting with line 5.

    - Using l 4-7 displays 4 lines through 7 of your script.

    - Using l 34 displays line 34 of your script.

    - Using l foo displays roughly the first 10 lines of the foo function. |

    | L | Lists all breakpoints and actions. |

    | p EXPR | Prints the result of evaluating EXPR to the display. It is a shorthand
    of saying print DB::OUT(EXPR). |

    | S | Lists all function names that are defined. The list will include any function
    defined in modules as well as those in your script. |'
