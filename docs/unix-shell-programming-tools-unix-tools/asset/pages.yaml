  md: '# The xargs Command


    Synopsis

    xargs builds and executes command lines.


    Syntax

    xargs [options] [command [initial-parameters]]


    Description:

    The xargs command is used to circumvent some limitations on the length of command
    lines. It does this by calling a command many times instead of one time with many
    parameters. In other words, instead of executing:


    ```

    ls grep1.dat grep2.dat tr.dat

    ```


    you could use xargs to execute:


    ```

    ls grep1.dat

    ls grep2.dat

    ls tr.dat

    ```


    If you imagine a longer command with three hundred filenames instead of just three,
    you can see how the command line might get at too long for the shell to handle.

    xargs reads STDIN to generate a list of parameters. Parameters are delimited by
    spaces (however, if spaces are inside quotes or preceded by a backslash, xargs
    ignores them). Blank lines are ignored.

    xargs has the following possible exit values:


    +   - 0—success.

    "- 1—unknown reason for failure.

    "- 123—if any instance of the executed command exited with a value between 1 and
    125.

    "- 124—if the command exited with status 255.

    "- 125—if the command is killed by a signal.

    "- 126—if the command can’t run.

    "- 127—if the command isn’t found.'
  merge: -1
  pgno: 431
