    inside parentheses in order to store the string that matches the components into
    pattern memory. You might also hear pattern memory referred to as pattern buffers.
    This memory persists after a match statement is finished executing so you can
    assign the matched value to another variable.


    You saw a simple example of this earlier, after the component descriptions. That
    example looked for the first word in a string and stored it into the first buffer,
    $1. The following small program:


    ```

    $_ = "AAA BBB CCC":

    m/(\w+)/;

    print("$1\n");

    ```


    displays:


    AAA


    You can use as many buffers as you need. Each time you add a set of parentheses,
    another buffer is used. If you want to find all the words in a string, you need
    to use the /g match option. In order to find all the words, you can use a loop
    statement that loops until the match operator returns false.


    ```

    $_ = "AAA BBB CCC":

    while (m/(\w+)/g) {

    print("$1\n");

    }

    ```


    The program displays


    AAA

    BBB

    CCC


    If looping through the matches is not the right approach for your needs, you can
    create an array consisting of the matches, like this:


    ```

    $_ = "AAA BBB CCC":

    @matches = m/(\w+)/g;

    print("@matches\n");

    ```


    The program displays


    AAA BBB CCC'
