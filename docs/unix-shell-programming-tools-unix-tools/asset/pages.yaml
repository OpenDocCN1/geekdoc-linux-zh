    # The regsub Function


    The regsub function is used to replace a pattern in text. It uses the same metacharacters
    as the list of the regexp function. Please look at Table 8.17 for a list of metacharacters
    usable by the regsub function.


    The regsub function uses this syntax:

    regsub ?switches? pattern target replacement newVariable


    There are three switches usable by regsub:


    +   - -nocase This option causes uppercase characters in the target to be treated
    as lowercase characters.

    - -all This option replaces all matched text in the target string. Without this
    option, only the first matched text is replaced. This option is equivalent to
    the /g option in Perl.

    - -- This option (two dashes in a row) indicates that there are no more options.
    This is useful if your pattern starts with a dash.


    The regsub function returns a count of the number of times the pattern was matched
    and replaced. The newVariable variable is assigned the result of replacing pattern
    with replacement in target. The target variable is not changed. If no replacements
    were made, newVariable becomes the same as target.'
