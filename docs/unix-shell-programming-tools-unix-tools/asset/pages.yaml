  md: '# Using Background Processes


    nice, orderly progression of command, execution and view of the results.


    A problem arises, however, when one of the programs that you run takes a long
    time to finish. For example, suppose you''re using the find command to search
    for all backup files more than two weeks old. Such a command might take five minutes
    or more to complete. In the meantime, your terminal is unusable because the find
    command has control of it.


    The solution to this problem is to make the find command run in the background.
    When programs are run in background, they no longer control your keyboard. In
    fact, it''s hard for them to get input at all, unless you pipe it into a file.


    Background processes can be quite convenient. They let you run more than one program
    at once. In fact, you can run lots of programs at once.


    Every time a program is executed, it is assigned a Process ID number, or PID.
    The PID can be used to find information about a running program. Once the program
    is finished, the PID goes away.


    Programs are placed into the background by adding an ampersand (&) to the end
    of a command line. For example:


    ```

    % find / -name "temp.dat" -print &

    [1] 301

    % find: /etc/uucp: permission denied

    find:/var/spool/at: Permission denied

    date

    Mon Jun 22 14:13:01 EDT 1998

    [1]+ Exit 1 find / -name "temp.dat" -print

    %

    ```


    The number in square brackets tells you how many background processes you''ve
    started. In this case, the find command is the first background process. The second
    number, the 301, is the Process ID. Every time you start a new background process,
    you''ll see a new PID. This PID is also displayed by the ps command:


    ```

    % ps

    PID TTY STAT COMMAND

    263 1 S 0:00 /bin/login -- medined

    301 R 0:00 find / -name temp.dat -print

    323 R 0:00 ps

    ```'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'I''ve italicized the relevant line in the output from the ps command. The important
    information consists of the PID, the TTY, and the command line that is being executed.


    Just as important as knowing how to start background processes is knowing how
    to stop them. Let''s create a background process that never ends, so you can learn
    how to stop runaway or misbehaving processes. The script in Listing 5.12 never
    ends, because background processes are disconnected from the keyboard. Therefore,
    without any input, the read command just waits forever.


    # Listing 5.12 background.sh—A Never-ending Script


    Let''s start a few never-ending background processes:


    ```

    % background.sh &\n[1] 341

    % background.sh &\n[2] 342

    ```


    ```

    [1] Stopped (tty input) background.sh

    % background.sh &\n[3] 343

    ```


    ```

    [2] Stopped (tty input) background.sh

    % ps

    PID TTY STAT TIME COMMAND

    327 1 S 0:00 /bin/login - medined

    328 1 T 0:00 -bash

    341 1 T 0:00 -bash

    342 1 T 0:00 -bash

    343 1 T 0:00 -bash

    344 1 R 0:00

    ```


    The ps command shows all three background process (the italic lines). Each process
    is stopped because it is waiting for input from the TTY—because of the unsatisfied
    read command.


    There are two ways to get rid of the background jobs. You can log out or use the
    kill command, as shown here:


    ```

    % kill -SIGKILL 341 342 343

    [1]- Killed background.sh

    ```'
