- img_proc: true
  md: '# Table 8.3 Perl''s Regular Expression Operators (Cont''d)


    | Operator | Description |

    | tr/ CHARACTERS/ REPLACEMENTS/ | This operator replaces characters specified
    by CHARACTERS with the characters in REPLACEMENTS. |


    All three regular expression operators work with a default variable called $,
    which holds the string that is searched. You might like to think of the $_ variable
    as the target of the search. Perl has special binding operators that let you select
    a different variable as the target of the search (see the section “The Binding
    Operators” later in this chapter).


    Both the matching (m//) and the substitution (s///) operators perform variable
    substitution on the PATTERN and REPLACE strings. For example, if the value of
    $book is Shell Programming Tools, then m/$book/. is really m/Shell Programming
    Tools.


    # Variable Substitution


    Replacing the variable name with its value.


    If PATTERN evaluates to the empty string, the last valid pattern is used. So,
    if you see a statement like print if //; in a Perl program, for the previous regular
    expression operator to see what the pattern is. The substitution operator also
    uses this interpretation of the empty pattern.


    # Pattern Delimiters


    Every Perl regular expression operator allows the use of alternative pattern delimiters.
    A delimiter marks the beginning and end of a given pattern. In the following statement:


    ```

    m//;

    ```


    the slashes (/) are the delimiters. However, you can use any delimiter character.
    This lets you use the slash character inside patterns. For example, matching a
    file with the default delimiters looks like this:


    ```

    m\/medined\/what.dat/

    ```'
