    Synopsis


    tr translates characters into other characters or deletes characters.


    Syntax


    tr [options] charset1 [charset2]


    Description:


    The tr command copies STDIN to STDOUT. However, along the way, the command-line
    options determine what filter effect, if any, is performed. The length of CHARSET1
    and CHARSET2 should always be the same length; each character in CHARSET1 should
    have an equivalent character in CHARSET2.


    Normally, tr is used to convert all instances of one character to another. For
    example, all instances of the letter A might be changed to the letter C. You can
    convert one character at a time. CHARSET1 and CHARSET2 specify which characters
    are converted and what they are converted into. Examples of the tr command are
    shown after Table 9.37.


    tr performs translation when both CHARSET1 and CHARSET2 are specified and the
    --delete option is not. Each input character that matches a character in CHARSET1
    is translated to the corresponding character in CHARSET2. Non-matching characters
    are not translated.


    tr can also be used to squeeze repeated sequences of characters into single characters.
    I use this feature quite frequently to remove extra spaces in my files.


    The tr command is picky about which backslash sequence it understands in CHARSET1
    and CHARSET2. If you use a backslash sequence that is not shown in Table 9.37,
    an error message will be displayed.'
  merge: -1
