  md: '# Exploring Shell Features


    The command Bash executes is really ls *.c. The output of the cat ls_info command
    replaces the cat ls_info part of the original command line.


    You might ask why I call this a powerful technique. The answer is that command
    substitution lets you set parameters around commands. Imagine the `cat ls_info`
    command was inside a script and further imagine that a user changed the contents
    of the ls_info file. What would happen when the script is run? The ls automatically
    executes using the changed contents of the ls_info file.


    # Background Processing


    Another useful feature of shells is the ability to run multiple programs or scripts
    at the same time. When this happens, the program in control of the keyboard is
    to be in the foreground. Any other programs run in the background.


    This feature comes in handy when you know a program will take a long time to finish
    and doesn''t need your input—it''ll just percolate while itself running. The find
    command frequently takes a long time to run and is a good candidate for background
    processing. Let''s take a look at an example:


    ```

    % find / -name "hello" -print > find.log &

    % date

    ```


    ```

    Wed Apr 15 22:43:59 EDT 1998

    % date

    ```


    ```

    Wed Apr 15 22:46:23 EDT 1998

    [1] Exit 1 find / -name "hello" -print >find.log

    % cat find.log

    /data/tk8.0/library/demos/hello

    /home/medined/hello

    /usr/lib/tk8.0/demo/hello

    ```


    The two date commands show that time has passed while the command was running.
    They also show that the login shell retains keyboard control. The find command
    can display error messages; however, it can''t access the keyboard. When the background
    process is done, the shell displays a message indicating the exit code of the
    process. Because the find command sent its output to the find.log (you''ll learn
    about the > operator in Chapter 5,'
