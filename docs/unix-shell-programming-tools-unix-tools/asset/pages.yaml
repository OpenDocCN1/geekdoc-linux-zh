    \ every time the computer is turned on.\n\nPerl controls access to files using\
    \ file handles. A file handle is associated with a file using the open function.\
    \ Subsequent use of a file is done using the file handle in order to specify which\
    \ file to use. When all file activity is done, the close function is called to\
