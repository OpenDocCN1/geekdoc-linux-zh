    action is being used as the default.


    Now let''s see what happens if we explicitly tell find to look in the current
    directory:


    ```

    % find . two.txt

    ./one.txt

    ./two.txt

    ./three.txt

    ./dir1

    ./dir1/one.txt

    ./dir1/three.txt

    ./dir1/two.txt

