    # Table 8.8 The Six Types of Quantifiers


    | Quantifier | Description |

    |---|---|

    | * | The component must be present zero or more times. |

    | + | The component must be present one or more times. |

    | ? | The component must be present zero or one time. |

    | {n} | The component must be present $n$ times. |

    | {n,} | The component must be present at least $n$ times. |

    | {n,m} | The component must be present at least $n$ times and more than $m$ times.
    |


    If you need to match a word whose length is unknown, you need to use the + quantifier
    because a zero-length word makes no sense. So, the match statement might look
    like this:


    ```

    m/^\w+/;

    ```


    This pattern matches OOO and AAAAA but not " or BBB. In order to account for the
    leading whitespace, which might or not be at the beginning of a string, you need
    to use the asterisk (*) quantifier in conjunction with the \ symbolic character
    class in the following way:


    ```

    m/\s*\w+/;

    ```


    > Be careful using the * quantifier because it can match an empty string, which
    might not be your intention. The pattern /b* matches any string—even without any
    b characters.


    At times, you might need to match an exact number of components. The following
    match statement is true only if five words are present in the $_ variable:


    ```

    $_ = "AA AB AC AD AE";nm/^(\w+\WW+)(5)$/;

    ```'
