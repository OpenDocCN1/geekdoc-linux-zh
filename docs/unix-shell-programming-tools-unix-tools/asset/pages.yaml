    # Metacharacters and the for Command


    The for command lets you use filename metacharacters to create the list that is
    iterated over. This feature comes in handy when you need to limit which files
    are processed.


    Listing 8.2 shows how to process all of the files in a directory.


    # Listing 8.2 process_all—Using the for Command to Process All Files in a Directory


    ```

    #!/bin/sh

    nfor file in *

    do

    echo "$file is being processed."

    end

    ```


    Here is an example of this script in action:


    ```

    % chmod +x process_all

    % ls

    foo.c bar.c david

    ./process_all

    foo.c is being processed.

    bar.c is being processed.

    david is being processed.

    ```'
