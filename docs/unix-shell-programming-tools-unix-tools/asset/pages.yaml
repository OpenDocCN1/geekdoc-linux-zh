    \ are doing. Important elements and techniques of the scripts are specifically\
    \ mentioned in the text following each listing.\n\n# A Better find Command\n\n\
    Some Unix administrators frown on users who search entire directory hierarchies\
    \ when looking for files. Indiscriminately searching the entire disk leads to\
    \ disk contention as the system tries to balance the needs of the search program\
    \ with the needs of the other users.\n\n12.1 contains the nfind.sh script, which\
