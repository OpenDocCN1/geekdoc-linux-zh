  md: '# The strings Command


    Synopsis

    strings displays the printable characters in a binary file.


    Syntax

    strings [options] [filename...]


    Description:

    The strings command peeks inside binary files looking for printable sequences
    of characters. The printable characters in compiled programs are rarely encrypted.
    Therefore, I was once able to use strings to find the Oracle database name and
    user id that a program was using when the original source code was lost—something
    my system administrator didn''t think was possible.


    By default, strings looks for any printable sequence longer than three characters.
    This is controllable by the --bytes option. strings limits its search of object
    files to the initialized and loaded sections. If you don''t know what the initialized
    and loaded sections are, don''t worry—simply use the --all option.


    Table 9.33 Options for the strings Command


    | Option | Description |

    | -a or --all | Scans the entire file for strings. |

    | -f or --print-file-name | Prepends the filename to each string that is found.
    |

    | --help | Displays a help message. |

    | -v or --version | Displays the version information. |

    | -n LENGTH or --bytes=LENGTH | Tells strings to look for printable sequences
    that are at least LENGTH characters long. |

    | -o or -t [o | x | d] or --radix-[o | x | d] | Displays the location of each
    string using octal, hexadecimal, or decimal notation. |


    Let''s use the strings command to find out what files the date program uses:'
  merge: -1
  pgno: 405
- img_proc: true
  md: '# The strings Command


    % strings /bin/date | grep "/"

    /lib/ld-linux.so.2

    /usr/share/locale

    %%D date (mm/dd/yy)

    %%x locale''s date representation (mm/dd/yy)


    By filtering the output of the strings command, only those strings that contain
    a slash are displayed. Some of the displayed lines don''t deal with files, but
    you can easily ignore them.


    Searching more than one file at a time is simple. All you need to do is add the
    second filename to the command line:


    ```

    % strings /bin/date /bin/date | grep "/"

    /lib/ld-linux.so.2

    /usr/share/locale

    %%D date (mm/dd/yy)

    %%x locale''s date representation (mm/dd/yy)

    /lib/ld-linux.so.2

    />t[j/

    /usr/share/locale

    //DIRED//

    //SUBDIRED//

    ```


    Now there''s a problem. How do you know which line belongs to which file? Looking
    at Table 9.33 provides the answer, --print-file-name option. Let''s try it:


    ```

    % strings --print-file-name /bin/date | grep "/"

    bin/date: /lib/ld-linux.so.2

    /bin/date: gmon_start_

    ```


    Interingly enough, using the --print-file-name option causes the previous technique
    to fail because the full path of each is displayed on each line. This prevents
    grep from filtering any lines, because they all have slashes in them.


    Connecting to the /bin directory before running the strings command solves this
    problem:


    ```

    % (cd /bin; strings --print-file-name date ls | grep "/"

    date: /lib/ld-linux.so.2

    date: /usr/share/locale

    date: %%D date (mm/dd/yy)

    date: %%x locale''s date representation (mm/dd/yy)

    ls: /lib/ld-linux.so.2

    ls />t[j/

    ```'
