- img_proc: true
  md: "# Using Statements\n\nThe while statement is probably the simplest of the looping\
    \ statements; it simply repeats a block over and again until the specified test\
    \ expression evaluates to false. (Be aware that if you're not careful with your\
    \ test expression, the loop might never end!) For example, the following snippet\
    \ of code loops through a list of names until it has printed all of the names\
    \ that start with the letters A through M:\n\n```\n% set names \"Abe Chuck Ethan\
    \ Fergie\\nGramps Jim Larry Nathan Pops\\nSam Tim Zach\"\n% set ctr 0\nwhile [[string\
    \ compare N [index $names $ctr]] > 0] {\n  puts [index $names $ctr]\n  incr ctr\n\
    }\nAbe\nChuck\nEthan\nFergie\nGramps\nJim\nLarry\n```\n\nThe key part of this\
    \ code is the test expression: [string compare N [index $names $ctr]] > 0\n\n\
    If a list element starts with a letter alphabetically preceding the letter N,\
    \ the string match returns 1, so the test expression is true, and the body of\
    \ the loop is executed. However, if a list element starts with a letter alphabetically\
    \ following N, string match returns -1, so the test expression evaluates to false,\
    \ and the loop exits.\n\nThe for command is typically used to iterate a fixed\
    \ number of times. For example, to print the first five elements of the list stored\
    \ in the variable names, we would use a for command that looks like this:\n\n\
    ```\n% for {set i 0} ($i <= 4) {incr i} {\n  puts [index $names $i]\n}\nAbe\n\
    Chuck\nEthan\nFergie\nGramps\n```"
  merge: -1
  pgno: 246
- img_proc: true
  md: "Finally, the foreach command is used to repeat a command or block once for\
    \ each element in a list. It's a snap to print out each of the elements in our\
    \ list stored in names:\n\n```\n% foreach x $names {\n  puts $x\n}\nAbe\nChuck\n\
    Ethan\nFergie\nGramps\nJim\nLarry\nNathan\nPops\nSam\nTim\nZach\n%\n```\n\nSometimes,\
    \ you'll just need to bail out of a loop in the middle (it happens to the best\
    \ of us). Tcl offers two special commands for loop control: break and continue.\
    \ The break command quits out of the loop command completely, as demonstrated\
    \ in the following code:\n\n```\n% (set i 0) ($i < 5) (incr i) {\n  if ($i ==\
    \ 3) break\n  puts $i\n}\n0\n1\n2\n```\n\nThe continue command bails out of the\
    \ current iteration of the loop, but doesn't quit out of the loop completely.\
    \ Take a close look at the output of the following code—the third loop didn't\
    \ print, but the fourth generation did.\n\n```\n% (set i 0) ($i < 5) (incr i)\
    \ {\n  if ($i == 3) continue\n  puts $i\n}\n0\n1\n2\n```"
  merge: -1
