  md: '# Description:


    The mv command has two functions:


    +   - Moving files from one directory into another—done when the last parameter
    on the command line is a directory.


    +   - Renaming files—done when there are only two filenames on the command line.


    The mv command, like the cp command, only affects regular files. Therefore, you
    might want to use the find command and its type f option to build a list of files
    to move.

    When using a script, the -force option to avoid having the mv command prompt the
    user to confirm overwriting files.

    Table 9.27 shows the options for the mv command.


