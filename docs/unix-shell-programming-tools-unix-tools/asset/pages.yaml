- img_proc: true
  md: "# Syntax Errors\n\nFor example, consider Tcl's puts function. If you look at\
    \ puts's syntax in the Tcl documentation, you see the following:\nputs ?-nonewline\
    \ ?channelId string\n\nIn other words, the Tcl interpreter expects the word puts\
    \ to be followed by a list of one to three words: possibly the word ?-nonewline?,\
    \ possibly a word that indicates the name of a channel (i.e., the file or pipe\
