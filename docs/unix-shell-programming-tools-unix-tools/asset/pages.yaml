    | fcntl | The meaning of file controls system specific. Try using the POSIX.pm
    module, which provides a useful interface. |

    | ioctl | The meaning of input/output controls is system specific. Try using the
    POSIX.pm module, which provides a useful interface. |

    | time | The beginning of time for Mac uses January 1, 1904, which is different
    from Unix''s beginning of time. |


    The most significant difference between standard Perl and MacPerl doesn''t have
    support for system calls. The Mac doesn''t have a command-line interface, so there''s
    no Unix-like (or DOS-like) language for communicating with the operating system.
    Consequently, Perl code that makes system calls—via **exec, system**, backtracking,
    or opening a pipe, rather than via a file—just won''t work on a Mac.


    There is software that adds a command line to the Mac—the MPW (Macintosh Programmer''s
    Workshop) Shell, distributed (freely) by Apple. There''s a special build of MacPerl
    that allows you to pass commands to the MPW tools. See http://dewworld.apple.com/dev/tools/mpw-tools/about_mpw.html
    for details.


    TIP


    Don''t forget there''s a good chance that the next implementation of the Mac OS
    will have a Unix kernel, and it''s not completely crazy to imagine that future
    versions of MacPerl will be completely compatible with the standard Perl distribution.
    Keep your fingers crossed.


