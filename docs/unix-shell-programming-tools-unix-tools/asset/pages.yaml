  md: 'You can see the command list in this example has an exit value of 0 (indicating
    success). However, we know that the init.dat file doesn''t exist. So why is the
    command considered a success?

    Because the last command executed is echo, and echo returns success if it successfully
    displays its message.


    At times, it will make more sense to have a non-zero exit value.

    This can be done using a compound command:


    ```

    % test -e init.dat || (echo "Bad File."; exit 1)

    Bad File.

    % echo $?

    ```


    The exit command ends a compound command''s subshell—not the login shell or any
    script in which you might use this technique.

    Current you also use the following compound command?


    ```

    % (test -e init.dat || echo "Bad File."; exit 1)

    Bad File.

    % echo $?

    ```


    The exit value still remains in this compound command. However, can you spot it?
    If the init.dat file exists, this compound command returns 1. You need for it
    to return 0.


    Let''s go back to the working version of the compound command. By adding another
    test command, you can exit the parent shell:


    ```

    test -e init.dat || (echo "Bad File."; exit 1)

    test $? = 1 && exit


    # more commands

    ...

    ```


    As you work with shell scripting, you''ll find many uses for the () notation.
    I once needed to add an end-of-file delimiter between two files before sending
    them to a processing program. Using a compound command worked very well:


    ```

    % $FILE1="monday.dat"

    % $FILE2="tuesday.dat"

    % (cat $FILE1; echo "..."; cat $FILE2) | audit

    ```'
