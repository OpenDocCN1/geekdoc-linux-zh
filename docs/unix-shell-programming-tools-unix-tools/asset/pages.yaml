  md: '# Introduction


    Welcome to Unix Shell Programming Tools. What makes this book different from other
    Unix books? Quite simply, it is focused on programming. You won''t find discourses
    on the best editor or why one Unix version is better than another in this book.
    Nor will you find information about Unix system administration. Here, you''ll
    only find simple advice on how to create programs that perform the tasks you need
    them to do.


    This book is different in other ways, as well. One of the biggest is how Bash,
    Perl and Tcl are all used to illustrate programming concepts. Bash, of course,
    is what is commonly considered the shell, while both Perl and Tcl are called programming
    languages. All three can be used to create programs; each has its strengths. Being
    able to pick a particular language for a specific task will make you a stronger
    programmer.


    I''ve packed this book with many code examples as possible because that''s how
    I like to learn. Additionally, I have literally added comments to the examples.
    When you return to this book, in a month or a year, you won''t need to read the
    text to remember what an example does. Simply read the comments and your memory
    should be jogged well enough to remember the details.


    # Who Should Use This Book?


    Unix Shell Programming Tools should be read by anyone seeking to learn how to
    program in the Unix environment. Basic skills, such as how to list a directory
    and edit a file, are not covered.


    If you are already familiar with Perl or Tcl, reading this book lets you transfer
    many of your skills to creating Bash programs.


    # What Do I Need?


    In order to effectively use this book you need access to two things: a computer
    running Bash, and a text editor such as vi or emacs. That''s it! You don''t even
    need to have a local computer running Bash. If you have a way to telnet into an
    ISP''s computer, and that computer uses Bash, then you can use this book.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# How to Use This Book


    There are several ways to use this book. If you''re not too familiar with programming,
    start at the beginning and work your way to the end. Each chapter builds on the
    last, giving you an understanding of basic concepts before the more complex concepts.


    More experienced programmers might want to skip to Chapter 5, “Controlling the
    Shell,” read Chapter 8, “Pattern Matching,” and then move on the Chapter 12, “Customizing
    the Tools.”


    # Code Listings


    Many readers prefer to type in most of the example code by hand. This helps them
    focus on the code one line at a time. If you do this, remember that you don’t
    need to copy the comments! Not copying the comments makes most listings much shorter.


    All of the code examples are on the Web at http://www.codebits.com/spt. After
    each example, trying a little to see what happens. Change a few lines, or add
    a couple. Don''t be afraid to purposely introduce syntax errors so that you can
    see the errors arise.


    One of the most important attributes of a learning experience is that it should
    be fun. If you are getting frustrated over a topic, take a break. Talk with a
    colleague. Then go back to the program.


    # Conventions


    The following conventions are used in this book:


    +   * Codelines, functions, and any text you see onscreen appear in a special
    monospace typeface.


    +   * Filenames and variable names are set in *italic*.


    +   * New terms are also in *italic*.


    +   * Case is important in Perl and Tcl programming. Always pay attention to uppercase
    and lowercase in variable and function names.


    +   * Commands and keywords are set in **boldface**.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Introduction


    If you are required to type text, the text you type appears in boldface. For example,
    “type cd examples."


    +   - // this style is used for author''s comments in the code. They should //
    not be entered into your scripts.


    # Overview


    Part I, “Fundamentals,” consists of the first eight chapters of this book. These
    chapters discuss the fundamentals of Shell, Perl, and Tcl Programming. Chapter
    1, “Playing With Shells,” introduces you to shells and processes. It provides
    the foundation for the rest of the book. Then Chapter 2, “Variables and Operators,”
    discusses how to store and manipulate data using Bash. Going one step further,
    Chapter 3, “Procedures,” shows how to create nuggets of functionality that can
    be used again and again. With procedures under your belt, Chapter 4, “Script Execution
    Commands,” provides information at the script level. After controlling scripts,
    it''s good to know how to control the shell itself—which is the environment in
    which the script runs. Chapter 5, “Controlling the Shell,” fulfills this need.


    After you read the first five chapters, you''ll have a good understanding of the
    general nature of shell programming. Chapters 6 and 7 cover the basics of Perl
    and Tcl respectively. Then one comes one of the more difficult chapters: Chapter
    8, “Pattern Matching,” delves into some details of how to match patterns of text.


    Part II, “Using the Toolkit,” explores the utilities that come with the Bash shell.
    Just like no man is an island, the shell is not isolated, either. It comes loaded
    with hundreds of utilities waiting for you. Chapter 9, “Examining the Tools,”
    looks at many of the more important utilities and provides some short examples
    of how they can be used. Chapter 10, “Portability Issues,” looks at how Bash,
    Perl, and Tcl differ from each other and how they are similar. Chapter 11, “Debugging
    Concepts,” shows you some debugging techniques that are useful when your scripts
    don''t work correctly. And finally, Chapter 12, “Customizing the Tools,” shows
    longer examples in all three languages—Bash, Perl, and Tcl.


    Appendix A, “Internet Resources,” talks about some the ways to get information
    about Shell Programming from the World Wide Web. Appendix B, “The ASCII Table,”
    is a list of the ASCII codes for your convenience, should you need to reference
    them.'
