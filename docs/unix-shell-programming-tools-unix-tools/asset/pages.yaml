  md: '# Summary


    At the very least, you''ll be able to look at someone else''s code and figure
    out what it does.


    # Summary


    This chapter serves as a backdrop for the rest of the book. All of the concepts
    presented here are explored further in various parts of the book.


    The chapter began with a description of Unix and shells. When you log into a Unix
    system, the keyboard and monitor are “attached” to a login shell. This shell interacts
    with you and does your bidding.


    As you run commands, they are executed as child processes. If you desire, you
    can place child processes in the background so you can continue working while
    they continue processing.


    Unix uses access permissions to control who can read, write and execute files.
    These permissions are associated with each file and directory. The `chmod` command
    changes permissions when needed. The `-l` option is used.


    In order to execute a script file, the `chmod +x scriptfile` command is used.
    From then on, simply using the name of the script file executes it.


    Mention was made of the many different types of shells that are available. However,
    only the Bash shell is covered in this book because it seems to be the most modern,
    the cheapest (it''s free), and the most stable.


    The Bash shell has many features that make a programmer''s life easier. Some of
    them—like word completion—only affect you at the command line and not while programming.
    Therefore, those features were not covered. Aliases, command substitution, back-ground
    processing, variables, pipes, redirection, pattern matching, and the shell''s
    special characters were mentioned. Each of these topics is discussed in more detail
    later in the book.


    Chapter 2, “Variables,” introduces you to variables and how they are used to store
    information.'
