- img_proc: true
  md: 'First things first: Tcl is an acronym for Tool Command Language, and Tcl aficionados
    pronounce the language''s name “tickle,” trying not to blush as they say it. Tcl
    was developed by Dr. John Osterhout in the late 1980s. The “tools” in question
    are software tools, i.e., application programs that do useful tasks. Tcl was originally
    developed to script the behavior of the applications that Osterhout and his students
    created. Much to Osterhout''s surprise, Tcl quickly caught on as a general-purpose
    programming language.


    Tcl has been ported to all major platforms, including the major implementations
    of Unix, the various flavors of Windows, the macOS, and even to BeOS. Tcl/Tk is
    often touted as “the cross-platform scripting language,” because the Tcl development
    team has made a conscious effort to make Tcl scripts as portable as possible.


    Tcl is a great language for little tasks, as little as five-line utility programs.
    After all, that''s what it was originally intended to serve. As it turns out,
    Tcl enthusiasts have also built very large programs in Tcl with excellent results.


    One of Tcl''s great strengths, and arguably the reason Tcl is so widely used,
    is that it is readily extensible. Tcl was designed so that developers could easily
    implement their own additions to the Tcl language—essentially, create their own
    commands—by writing the extensions in C. Many such extensions have been publicly
    released, such as Tcl/Tk and Expect. Furthermore, it''s easy for developers to
    build Tcl into applications as a scripting language for the application, the same
    way that Microsoft''s Visual Basic for Applications is used as the scripting language
    for Microsoft''s suite of office applications.


    # The Features of Tcl


    Why should you spend time learning Tcl? Look at some of its many features:


    Completeness: Tcl is a bona fide procedural programming language that supports
    all of the necessary elements—variables, decision statements, iteration statements,
    and recursion—that you need to write any program like.'
