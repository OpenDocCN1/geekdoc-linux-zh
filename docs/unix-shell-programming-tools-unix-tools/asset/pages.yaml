    | -u | Causes, when not used with -c, only the first of a series of duplicate
    lines to be displayed. In order words, all output lines are guaranteed to be unique.
    |

    | --version | Displays sort''s version information. |

    | +POS1 [-POS2] | Specifies a sort field (also called a key field) within each
    input line. The field begins at POS1 and extends to, but does not include, POS2.
    All fields and character positions are numbered starting with zero, using the
    +POS notation. However, using the +POS notation is discouraged. Please use the
    -k option instead. |


    Just in case you haven''t been exposed to keys before, let''s quickly review.
    Key fields are used by sort to compare two input lines. If no key field is defined,
    the entire line is essentially considered to be one big key field. Let''s use
    the file in Listing 9.9 to explore the key field concept.


