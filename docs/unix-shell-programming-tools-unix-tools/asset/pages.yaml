    # The basename Command


    Synopsis:


    **basename** removes the directory and, optionally, the suffix from a filename.


    Syntax:


    ```

    basename filename [suffix]

    ```


    Description:


    The **basename** command comes in handy when you need to remove the directory
    information from a filename. The *suffix* parameter can be used to remove suffixes
    from filename, but only when the *suffix* parameter matches the suffix of filename.
    Here are a few examples:


    ```

    % basename "/home/medined/test.dat"

    test.dat

    % basename "/home/medined/test.dat" ".dat"

    test

    % basename "Newark, NJ", "NJ"

    Newark

