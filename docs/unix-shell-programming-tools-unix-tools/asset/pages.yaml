  md: '# Redirecting Input/Output


    If your situation requires you to prevent overwriting, use Bash''s built-in set
    command to turn on the nocclobber option: % set -o nocclobber % echo "one" > test.dat
    ...


    Use the set -o nocclobber command to prevent existing files.


    ```

    % set -o nocclobber

    % echo "one" > test.dat

    % cat test.dat

    % echo "two" > test.dat

    bash: test.dat: Cannot clobber existing file

    % echo $?

    ```


    When the nocclobber option is turned on, the shell won''t let overwrite files.
    You can use the $? variable to test the exit value of echo command. In addition
    to redirection to create files, you can append output to existing files like this:


    ```

    % echo "two" >> test.dat

    % cat test.dat

    two

    ```


    Most programs send their error messages to STDERR instead of STDOUT. This separation
    of normal output from error output can be very handy at times. Remember the unsightly
    error message that appeared when nocclobber was set and you tried to overwrite
    the test.dat file? Let''s use STDERR redirection to stop it from displaying on
    the monitor.


    ```

    % set -o nocclobber

    % echo "one" > test.dat

    % cat test.dat

    % echo "two" 2> error.dat > test.dat

    % echo $?

    % echo "two" 2> error.dat > test.dat

    bash: error.dat: Cannot clobber existing file

    ```


    The 2> notation tells the shell to redirect STDERR. In this case, we''re directing
    STDERR to a file called error.dat. Notice the error message does not display the
    first time the 2> redirection is used. On the other hand, the second time that
    2> redirection is attempted, the error message is displayed. Why? Because the'
