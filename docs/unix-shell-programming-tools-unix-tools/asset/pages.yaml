    # File Test Operators


    Frequently, programmers need to determine the size of a file or if a file exists.
    In order to get this information. For example, the following code fragment checks
    for the existence of the demo.dat file.


    ```

    print "demo.dat exists!" if -e "demo.dat";

    ```


    You can shorten this conditional expression even further if $_ contains the filename.
    For example,


    ```

    print "demo.dat exists!" if -e;

    ```


    You can also use a file handle instead of a filename. The special file handle
    _ (the underscore character) is used when you need to run two or more tests on
    the same file. Behind the scenes, Perl invokes a system call for each file test.
    The _ file handle tells Perl to use the file information retrieved from the last
    system call. For example:


    ```

    print "Readable and Executable\n"

    if -r "test.pl" && -x _;

    ```


    This line of code only displays the message Readable and Executable if both conditions
    are true for the test.pl file. By using the underscore file handle, you use the
    file information that is still in'
