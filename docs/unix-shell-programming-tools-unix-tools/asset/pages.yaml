  md: '# Bash 237


    replaced. Use single quotes around patterns you don''t want thenshell to expand:


    ```

    % 1 ls

    foo.c bar.c david

    % grep ''*Dd]av*'' *.c

    bar.c:david-07/97

    foo.c:david-09/97

    ```


    In this example, you see that the grep command, rather than

    shell, expands the pattern by finding matches in the two .c files.

    Notice, however, that the *c pattern is expanded by the shell.

    There''s one more small twist to how the shell expands patterns.

    If the pattern does not match any filenames, the pattern is left

    unexpanded. For example:


    ```

    % 1 ls

    foo.c bar.c  <- the david file was removed.

    % echo grep [Dd]av* bar.c foo.c

    grep [Dd]av* bar.c foo.c  <- the pattern is expanded.

    ```


    In order to gain the maximum benefit from using patterns,

    sometimes you need to plan ahead and create filename conventions.

    For example, if you have multiple projects, it might help to assign

    each project a three-letter prefix code. Then, you can use patterns

    to manipulate all of the project files at once:


    ```

    % 1 ls

    trn_whach.c trn_qwre.c trn_sce.c

    wed_forc.c wed_qwsa.c wed_uyhd.c

    % mkdir training

    % mv trn_* training

    ```


    This example shows what you might do when the number of

    files in a project gets to be too many—use the mv command to

    to move all of the project files into a subdirectory.


    # Metacharacters for Variables


    When metacharacters are paired with variables, they let you

    strip off parts of a variable''s value and work with the rest. Some

    examples using project codes should make this concept clear:


    ```

    % project_code=''ben_2344''

    % echo $project_code

    ben_2344

    ```'
