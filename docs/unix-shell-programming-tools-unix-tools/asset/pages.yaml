  md: "Let's take a closer look at the key lines in the regToHex procedure. If you\
    \ look carefully, you'll see that the whole procedure definition is is one big\
    \ Tcl command; there are no \"naked\" end-of-line characters that aren't wrapped\
    \ up in a pair of braces. Thus, as far as the Tcl interpreter is concerned, the\
    \ procedure consists of four words:\n\n+   - proc The command name of the command\
    \ that defines the procedure.\n\n+   - rgbToHex The name of the new procedure\
    \ that we are defining.\n\n+   - args The name of the argument(s) that are passed\
    \ to the procedure. If you use the name args, you can pass a list of any length\
    \ to the procedure, and Tcl will store the list in args.\n\nand the body of the\
    \ command consists of:\n\n```\n{\nset hexValue #nforeach x $args {\n  append hexValue\
    \ [format %x $x]\n}\nreturn $hexValue\n}\n```\n\nDefining a procedure does not\
    \ cause the procedure to execute immediately. If you type in the rgbToHex procedure\
    \ definition at the prompt, you'll notice that tcsh does not return a hex value;\
    \ it simply puts up the familiar Tcl prompt to acknowledge that it has accepted\
    \ the procedure definition. Once you have defined a command with proc, you can\
    \ use the command just like you'd use any of Tcl's built-in commands. For example:\n\
    \n```\n% rgbToHex 255 102 204\n#ff66cc\n```\n\nThe Tcl interpreter takes anything\
    \ after the procedure's name and \"feeds\" it to the procedure. In the case of\
    \ rgbToHex, it stores the list whose elements are 255, 102, and 204 in the simple\
    \ variable called args."
