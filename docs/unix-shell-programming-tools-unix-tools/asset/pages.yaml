    - first letter a or A.


    Now it''s time for examples that use the match operator. First, let''s extract
    the basename without any extension:


    ```

    % filespec=`home/medined/foobar.txt''

    % filename=`expr $filespec : ''.*/\.(.*)\.*'' $filespec`n% echo $filename

    foobar

    ```


    The pattern in the above command line is ''.*\.(.*)\.*''. The only way to understand
    patterns is to pick apart piece by piece:


    +   - .*matches zero or more characters until a slash is found.

    - \.(.*)-tells expr to display whatever matches the pattern inside the parentheses.

    - \-matches a single period (the start of the extension).


    The ''$ $filespec'' part of the command displays the original filename if it doesn''t
    match the pattern. Alternatively, you might want to return a string “Incompatible
    Filespec” to indicate an error condition.


    By slightly changing the pattern, you can extract the extension:


    ```

    % extension=`expr $filespec : ''.*\.(..*)\.*'' $filespec`

    % echo $extension

    txt

    ```


    The only difference between the last two patterns is the location of the \ notation.
    You can go a step further and remove the period altogether from the output by
    placing the \ in front of the parentheses:


    ```

    % extension=`expr $filespec : ''.*\.(.*)\.*'' $filespec`

    % echo $extension

    txt

    ```'
