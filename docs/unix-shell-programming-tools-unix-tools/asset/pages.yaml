    # Data Structures


    Tcl really has two basic data structures: simple variables and arrays. Simple
    variables can hold all kinds of data: numbers, strings, and lists. Arrays contain
    an indexed list of simple variables and, as with Perl''s hash tables, the array
    indices can be either strings or numbers.


    One of the things that you''ll commonly store in a simple variable is a list—say,
    a list of filenames or names to be sorted. You don''t need to create a special
    kind of variable in Tcl to store or manipulate a list—you can use a simple variable—but
    it''s handy to think of a list as a special case, because Tcl offers a wide array
    of built-in tools for managing lists.


    # Simple Variables


    A Tcl variable can hold just anything that you care to put into it. You don''t
    need to worry about declaring a variable before you use it, or making sure that
    a variable contains a certain kind of data. Tcl takes care of all of the details
    for you. For example, let''s say that you want to put a number into a variable
    called x. You create the variable and set its value with a single set command:


    ```

    % set x 25

    ```


    Then, you can treat the variable as a number, and perform whatever mathematical
    operations you like on it:


    ```

    % expr x * 2

    ```


    If you prefer to treat the variable as a string of characters, rather than as
    a number, you can do something like this:


    ```

    % append x " dollars

    ```'
