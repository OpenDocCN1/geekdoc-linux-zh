  md: "# The replace Command\n\n```\nif { $letter - \"d\" } {\n    set dir \"$value\"\
    ;\n}\nif { $letter - \"e\" } {\n    set pattern \"*.$value\";\n}\n```\n\nNotice\
    \ when an option is found, the value variable returned from the regexp function\
    \ is used. There are no intermediary variables (like $1 or $2) to worry about.\n\
    Once the options are determined, the script needs to find out if the specified\
    \ directory exists. The existence of a directory is determined by using the filedirectory\
    \ function, which is used like this:\nif [ filedirectory $dir ] puts \"dir exists\"\
    ;\n\nHowever, you need to test for non-existence—which is our script needs—the\
    \ conditional expression becomes a little more complex:\nif ! [ filedirectory\
    \ $dir ] puts \"no such dir\";\n\nThe next step is determining the old text and\
    \ the new, replacement, Tcl doesn't have negative subscripts like Perl. Grabbing\
    \ the last and next-to-last array elements isn't too painful. First, the subscript\
    \ of the last element is determined. Then, the last element is assigned to the\
    \ new variable. Finally, the subscript is decremented and the next-to-last element\
    \ is assigned to the old variable.\n\n```\nset index [ expr length $argv - 1 ];\n\
    set new [ lindex $argv $index ];\nset index [ expr $iindex - 1 ];\nset old [ lindex\
    \ $argv $index ];\n```\n\nThe length function returns the length of a list (or\
    \ array)—in this case the argv variable. However, in order to grab the last element,\
    \ you need to subtract one. Using the lindex function is straightforward—simply\
    \ specify which array and subscript to use. Notice that, unlike what we know to\
    \ be true of Perl, using math in Tcl requires the expr function. Personally, I\
    \ find this requirement a bit irksome, but at least it's consistent with the language's\
    \ paradigm."
