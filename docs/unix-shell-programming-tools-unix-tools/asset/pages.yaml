  md: '# Table 6.2 Perl''s Operators


    | Operator | Description |

    | --- | --- |

    | () | Parentheses group scalars into lists and change the evaluation order of
    operations. |

    | [] | Square brackets are used in array slices and provide access to individual
    array elements. |

    | {} | Curly braces are used to access individual hash entries. |

    | -> | The infix dereference operator is used for object-oriented programming.
    |

    | ++ | The auto increment operator increments a variable by one. |

    | -- | The auto decrement operator decrements a variable by one. |

    | ** | The exponentiation operator raises a value to a specific power. For example,
    2** evaluates to four. |

    | ! | The logical not operator is used in conditional and decision statements—like
    if and while. |

    | ~ | The bitwise not operator flips all the bits in a value. This is also known
    as taking the complement of a value. If you don''t know what the term “bitwise”
    means, don''t worry—you probably never need to use this operator. |

    | + | The plus operator adds two values together. |

    | - | The minus operator subtracts one value from another. The minus sign is used
    to create negative numbers. |

    | \ | The reference operator creates a reference to a value. A reference is essentially
    a pointer to the value. It is used to pass arrays and hashes into functions. |

    | =~ and !~ | The binding operators force Perl to perform matching operations
    on a variable other than $_. See Chapter 8, “Pattern Matching,” for more information.
    |

    | * | The multiplication operator multiplies one value by another. |

    | / | The division operator divides one value by another. |'
