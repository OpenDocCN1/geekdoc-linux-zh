    # A Better write Command


    The write command lets you send a message to another user''s terminal. In order
    to run the write command, you need to know the user''s username and, perhaps,
    their terminal name. After specifying the username, you simply type in your message
    and then, on a separate line, enter the end-of-file character, Ctrl-D. When the
    endofofile character is received by the write command, the message is sent—to
    appear seconds later on the display of the recipient.


    In order to demonstrate some shell scripting techniques, let''s make the write
    command a bit more user-friendly. One improvement might be to provide a list of
    usernames for the sender to select from. A refinement on this theme would be to
    provide a list of terminal names if the recipient is logged in to more than one
    terminal.


    When beginning to create a script, I like to start at the most basic level and
    work my way from simple to complex. Our first improvement to the write command
    is to provide a list of usernames. By perusing the man pages that come with Unix,
    I found the who command:


    ```

    % whoami

    medined

    % who

    medined tty1    Jun 2 20:08

    root    tty2       May 31 00:26

    medined tty3    Jun 2 20:08

    kathy.medinets tty4 Jun 2 22:38

    medined tty5    Jun 2 22:44

    ```


    The whoami command displays the username of the user running the shell. In this
    case, I was using my medined account. The who command does indeed display a list
    of current users—just what we need. However, the list is not easy to read and'
