- img_proc: true
  md: '# Creating Compound Commands


    Let''s look at examples of each type. The and type prevents b from executing if
    a succeeds. When might you need this ability? You could use it to make sure an
    initialization file exists before running a program:


    ```

    test -e init.dat && count_users

    ```


    This line uses the test command to see if a file called init.dat exists. If it
    does, the shell executes the count_users program.


    The or list type can be used to create the initialization file if needed:


    ```

    test -e init.dat || create_init

    Count_users

    ```


    This line uses the test command to check for init.dat. If it doesn''t exist, the
    create_init program is run. Finally, the count_users command is run.


    For more information about the test command, see Chapter 9, FRI "Examining the
    Tools."


    Using a combination of these two list types lets you make intelligent scripts
    that check the system''s status before running critical applications.


    # Creating Compound Commands


    A compound command executes a command list as if it were a single command. The
    exit value of the last command in the list becomes the exit value of the entire
    command. Table 5.2 shows the two types of compound commands.


    Table 5.2 The Two Types of Compound Commands


    | Notation | Description |

    | ( list ) | A parenthesized list executes all of its commands inside the same
    child shell. Variable assignment and commands like cd, which change the environment
    of the shell, do not remain in effect after the list is finished executing. |'
  merge: -1
  pgno: 114
- img_proc: true
  md: "# Table 5.2 The Two Types of Compound Commands (Cont'd)\n\n| Notation | Description\
    \ |\n| { list } | An expression inside curly braces executes all of its commands\
    \ inside the current shell. Variable assignment and environment changes remain\
    \ in effect after the list is finished executing. Note that a space is required\
    \ after the initial curly brace. |\n\n**CAUTION** Don't confuse parentheses used\
    \ for compound commands with parentheses used to affect operator precedence in\
    \ expressions. Expressions are only used in assignment or decision statements.\
    \ If a parenthesis is at the beginning of whatever you're looking at, there's\
    \ a good chance it's a compound command.\n\nThe ( list ) notation lets you combine\
    \ several commands together in the same child shell. This ability is especially\
    \ useful if you need to temporarily change the environment variables.\nA classic\
    \ example of this type of compound command is: \n\n```\nparentDir=`cd ..; pwd`\n\
    ```\n\nThis line sets the parentDir variable to the name of the parent directory.\
    \ If the current directory is /var/local, then parentDir is set to /var. Let's\
