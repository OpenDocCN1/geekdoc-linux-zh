    | (expression) | Anything inside parentheses is evaluated first. |

    | ! expression or not expression | Returns true if expression is false. |

    | expression1 expression2 expression1 -a expression2 expression1 -and expression2
    | Returns true if both expression1 and expression2 are true. If expression1 is
    false, then expression2 is never evaluated. |

    | expression1 -o expression2 expression1 -or expression2 | Returns true if either
    expression1 or expression2 is true. If expression1 is true, then expression2 is
    never evaluated. |

    | expression1, expression2 | Returns the value of expression2. Both expressions
    are always evaluated. |


    Expressions can be made of clauses that consist of options, tests, or actions.
    Each clause is connected by an operator to the next clause. If no operator is
    specified, the and operator is assumed.

