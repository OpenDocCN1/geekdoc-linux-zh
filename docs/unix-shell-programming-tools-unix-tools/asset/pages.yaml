    As you can see, Perl has quite a few pre-defined functions. In order to properly
    harness the power of Perl''s many functions, however, you need to know about statements.
    Statements are discussed in the next section.


    # Statements


    Statements are complete units of instruction to the Perl interpreter. The interpreter
    evaluates each statement in a script in sequence until a jump or loop command
    is processed. The simplest statement is 123;— literal number followed by a semi-colon.
    The semi-colon is very important. It tells the Perl interpreter that the statement
    is complete.


    Every Perl statement has a value. The last value evaluated becomes the value for
    the statement. For example, the value of the statement 56 + 3; is 59.


    # Statement Blocks


    Statement blocks group statements into a single unit for execution. The value
    of the statement block is the value of the last executed statement. In order to
    create a statement block, simply surround the group of statements within curly
    braces. For example:'
