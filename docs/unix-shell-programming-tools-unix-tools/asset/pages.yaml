  md: "# The if Command\n\nsense of the test, so the test command returns true if\
    \ the file doesn't exist and false if the file exists.\n\nRecently, I worked on\
    \ an application where the development computer had a different directory structure\
    \ from the production computer. Therefore, I created a variable indicating which\
    \ directory should be used by the script. I used an if command similar to this:\n\
    \n```\nif test \"$HOSTNAME\" = 'waswaldo'\nthen\n  working_dir=\"/usr/waswaldo/project_one\"\
    \nelse\n  working_dir=\"/usr/local/project_one\"\nfi\n```\n\nWhen the script is\
    \ run on the waswaldo computer, the first assignment statement is executed and\
    \ working_dir is set to /usr/waswaldo/project_one. On any other computer (including\
    \ the production computer) the working_dir variable is set to /usr/local/project_one.\n\
    \nIf you need to decide between more than two options, you can either use the\
    \ case command (discussed in the next section) or use an elif clause in your if\
    \ command. For example:\n\n```\nif test \"$HOSTNAME\" = 'waswaldo'\nthen\n  working_dir=\"\
    /usr/waswaldo/project_one\"\nelif test \"$HOSTNAME\" = 'thor'\n  working_dir=\"\
    /usr/thor/project_on\"\nelse\n  working_dir=\"/usr/local/project_one\"\nfi\n```\n\
    \nThis script sequence sets the working_dir variable to one of three values.\n\
    \nThe next section on case statements shows what many programmers feel is a better\
    \ technique for dealing with situations where a single variable needs to be tested\
    \ for different values."
