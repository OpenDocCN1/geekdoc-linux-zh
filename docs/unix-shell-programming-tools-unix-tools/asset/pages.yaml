    > I nearly always use **groff** with the -me option. This option loads macros.

    **groff** macros are the same as functions. Macros are usually used as a shorthand
    way of specifying a format. For example, the .c macro begins a centered block,
    and .j ends the block.


    Table 9.21 shows some of the most frequently used tags. Tags that begin with a
    period are called tags and must be placed on separate lines. Tags beginning with
    a slash are called escapes and can be placed anywhere in the input text—except,
    perhaps, inside of requests.


