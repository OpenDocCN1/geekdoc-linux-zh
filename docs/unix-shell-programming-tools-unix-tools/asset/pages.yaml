  md: "# The Matching Operator (m//)\n\nThe matching operator (m//) finds patterns\
    \ in strings. One of its more common uses is to look for a specific string inside\
    \ a data file. For example, you might look for all customers whose first name\
    \ is Mark, or you might look for all names starting with the letter M.\n\nThe\
    \ matching operator only uses the $_ variable as its target. This makes the match\
    \ statement shorter, because you don't need to specify where to search. Here is\
    \ a quick example:\n\n```\n$_ = \"AAA bbb AAA\";\nprint \"Found bbb\\n\" if m/bbb;\n\
    ```\n\nThe print statement is executed only if the bbb character sequence is found\
    \ in the $_ variable. In this particular case, bbb is found, so the program displays\
    \ the following:\n\nFound bbb\n\nThe matching operator lets you use substitution\
    \ to create-patterns. For example:\n\n```\n$needToFind = \"bbb\";n$_ = \"AAA bbb\
    \ AAA\";nprint \"Found bbb\\n\" if m/$needToFind;\n```\n\nUsing the matching operator\
    \ is so commonplace that Perl allows you to leave off the m from the matching\
    \ operator as long as slashes are used as delimiters:\n\n```\n$_ = \"AAA bbb AAA\"\
    ;\nprint \"Found bbb\\n\" if m/bbb;\n```\n\nUsing the matching operator to find\
    \ a string inside a file is very easy because of the $_ default variable—it's\
    \ designed to facilitate this type of activity. For example:\n\n```\n$target =\
    \ \"M\";\n\nopen(INPUT, \\<findstr.dat\");\n\nwhile (<INPUT>) {\n    if ($target/)\
    \ {\n        print \"Found $target on line .$\";\n    }\n}\nclose(INPUT);\n```"
  merge: -1
