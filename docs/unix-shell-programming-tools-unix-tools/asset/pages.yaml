    # The find Command


    Synopsis:

    find examines directory hierarchies, evaluating an expression for every file found.


    Syntax:

    find [path...] [expression]


    Description:

    The find command examines directory trees evaluating expression for every file
    that is encountered. The main concept behind the find command is not to locate
    files—it is to evaluate the expression. However, one important use of the evaluation
    might be to display filenames that match the specified criteria (i.e., the expression).


    > NOTE

    The default path is the current directory.The default expression is -print. Therefore
    a simple find command with no parameters resembles the ls command because the
    -print option always returns true.


    You can examine multiple directory trees by specifying more than one path. Therefore,
    find looks for the following characters—a dash, a parenthesis, a comma, or an
    exclamation mark—to determine the start of the expression parameter. If no expression
    is given, the default action is -print.


    I think that find is one of the more complex commands available in Unix. It takes
