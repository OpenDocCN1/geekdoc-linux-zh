    # Being Strict With Your Code


    Chapter 6, "Using Perl," barely touches on the topic of mod-

    ules. Perl modules dramatically increase the scope of what can be

    done with Perl. They also can be used to change Perl''s behavior.

    This section discusses the strict module, which does two things:


    +   - Forces you to use the my function to declare all variables.

    When all variables have a local scope, you avoid problems

    associated with unintentionally changing the value of a variable

    in a function.


    +   - Ensures that you can''t use accidental symbolic dereferencing.

    This topic was not covered in Chapter 6, "Using Perl," because

    it is relatively advanced. If you''re not working with references

    or object-oriented programming techniques, you won''t need to

    worry about this feature of the strict module.'
