  md: '# Variables in Perl


    you could write:


    ```

    ($third, $fifth) = @array[2, 4];

    ```


    This line of code assigns the list returned by the array slice on the right of
    the equals sign to the variables in the list on the left of the equals sign. You
    can also assign the list from an array slice to an array. You can even use an
    array slice on the left side of the equals sign to assign values to multiple array
    elements at once. For example,


    ```

    @array[2, 4] = ($third, $fifth);

    ```


    Using array slices on both sides of the equals sign efficiently swaps array elements.
    For example, @array[2, 4] = @array[4, 2] swaps the third and fifth elements.


    TIP


    # Hashes


    Hash variable names always start with a percent sign (%). They can hold a series
    of scalar index-value pairs. Hashes are assigned values like this:


    ```

    %hash = ( "David", "123 Hardy Rd",

    "Kathy", "45 Darling Lane");

    ```


    The %hash variable consists of two index-value pairs. Hash indexes are also known
    as keys. The first index-value pair "David" and "123 Hardy Rd". The index is "David"
    and the value is "123 Hardy Rd". The index (or key) can be used to directly access
    the value scalar. For example, $hash{"Kathy"} is equal to "45 Darling Lane". Notice
    that the value is a scalar and therefore starts with a dollar sign. Also notice
    that curly braces surround the hash index. You can also use => instead of the
    comma to define the hash. For example:


    ```

    %hash = ("David" => "123 Hardy Rd",

    "Kathy" => "45 Darling Lane");

    ```


    Associating the value with the index creates individual hash entries. Use curly
    braces around the index:


    ```

    $hash{"Matt"} = "23 Park Place";

    ```'
