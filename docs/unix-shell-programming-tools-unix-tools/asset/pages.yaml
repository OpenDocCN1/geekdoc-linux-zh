  md: '# Description:


    The tee command does two things at once. It performs the same function as the
    | character (sending the STDOUT of one process to the STDIN of another). However,
    tee also can send the STDOUT to one or more files listed on the command line.
    The --append option is used when existing files shouldn''t be overwritten.


    The following lines demonstrate tee:


    ```

    % Create some files to work with.

    % echo "demo" > file1

    % echo "demo" > file2

    % echo "demo" > file3

    % Sort the filenames in reverse order

    % ls file* | tee ls.lst | sort -r

    file3

    file2

    file1

    % Display the output from ls file*

    % cat ls.lst

    file1

    file2

    file3

    ```


    This example shows that the output of the ls* command is saved in the ls.lst file.
    You can use tee as as many times as needed in the same command line. For example,
    here is an example that uses tee twice:


    ```

    % Sort the filenames in reverse order but only

    % display the first file in the list.

    % ls file* | tee ls.lst | sort -r | tee -a ls.lst head -1

    file3

    % cat ls.lst

    file1 <- output from

    file2 <- the first tee

    file3 <- command.

    file3 <- output from

    file2 <- the second tee

    file1 <- command.

    ```'
