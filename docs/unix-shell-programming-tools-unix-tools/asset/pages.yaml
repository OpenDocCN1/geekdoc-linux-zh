  md: '# Redirecting Input/Output


    If you only need to combine the two files, you can use cat $FILE1 $FILE2. Using
    the subshell lets you insert any type of information you need between the two
    files.


    # Redirecting Input/Output


    The topic of redirection is briefly mentioned in Chapter 1, where redirection
    is shown to change where a program looks for input and where a program sends output.
    Figure 5.1 should serve as a reminder of the mechanism.


    Preference File

    (STDIN)


    ![](img/8fe1800c5b705516dc6b73632c4160ad_118_0.png)


    **Figure 5.1** Input and output after redirection has taken place.


    You already know (from Chapter 1) every program has an associated standard input
    (STDIN) and standard output (STDOUT). All programs also have a standard error
    (STDERR). Beneath the covers, STDIN, STDOUT, and STDERR are file handles—they
    point to the locations where the actual input and output happen. STDIN usually
    points to your keyboard. STDOUT and STDERR usually point to your monitor.


    > STDIN, STDOUT, and STDERR point to the locations where input and output take
    place. Under the covers, they are file handles and are associated with the file
    descriptor numbers 0, 1, and 2, respectively. You can also use file descriptor
    numbers 3 through 9.


    Every file accessed by Unix has its own file descriptor number. STDIN is always
    0. STDOUT is always 1. And STDERR is always 2. The file descriptors from 3 to
    9 can be used for any purpose you dream up. The “Using Advanced Redirection” section
    shows examples of using the higher numbered file descriptors.'
  merge: -1
  pgno: 118
- img_proc: true
  md: 'Unix views any file as a simple series of bytes—no one byte is more important
    than any other. One series of bytes is as good as the next when it comes to getting
    input. Therefore, from a program''s point of view, getting input from a file is
    just as good as getting input from the keyboard. Likewise, sending data to a file
    instead of the monitor is okay.


    By convention, some bytes have special meanings (see Appendix B—the ASCII Table).
    For example, a byte that has a value of 9 is considered a tab character. Nearly
    all programs understand these conventions. Thus, displaying or printing a byte
    that has a value of 9 performs a tab action.


    Our goal in the following sections is to learn the notation used by the shell
    to indicate input and output redirection.


    # Controlling Input


    Programs can get input from three places: the keyboard, a file, or in-line. Getting
    input from the keyboard is being a no-brainer—it''s the default, after all—so
    we''ll skip it. First, let''s look at getting input directly from a file.


    Getting input from a file uses this syntax:


    ```

    command < input_file

    ```


    It''s up to you to ensure that the data in input_file is correct and has the right
    format. If the command is looking for input that has two columns and input_file
    has three columns, the result of the redirection won''t be what you expected.


    Getting input in-line input uses this syntax:


    ```

    command << END

    line one

    line two

    END

    ```


    Many books and programmers refer to in-line input as a "here document." I''ve
    never liked that term because it sounds awkward and is not descriptive.'
  merge: -1
  pgno: 119
- img_proc: true
  md: '# Redirecting Input/Output


    Many people find this type of input to be counterintuitive. However, the effort
    to become familiar with in-line input pays handsomely when you combine it with
    variable substitution. Your scripts suddenly become easier to understand. For
    example, let''s see how in-place input can be used to send email:


    ```

    $TO_MAIL_ADDR="medined.planet.net"

    $SUBJECT="This is a test."

    $NAME="David"

    mail $TO_EMAIL_ADDR -s $SUBJECT << END

    ```


    $NAME, sorry about the delay.

    Please be patient, I''ll be back from vacation in June.


    END


    This short script shows how to use in-line input to send email messages. By changing
    the value of the three variables, you can change the contents of the email message
    and to whom it is sent.


    > You can parameterize your scripts by extracting changeable information into
    variables. Then you only need to make changes in the variable initialization section
    of your script in order to change the script''s actions.


    You can use input redirection in some non-obvious ways. For example, you can use
    it to provide input to a while command. Listing 5.1 contains a data file used
    by the send_status script of Listing 5.2. The send_status script uses the email
