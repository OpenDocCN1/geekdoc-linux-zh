  md: '# Redirection


    The previous section briefly described the concept of pipes. Redirection is a
    related concept. *Redirection* lets you change where a program looks for input
    and where a program sends output.


    Let''s use the **sort** command to examine redirection. When you run the **sort**
    command from the command line, it might look like this:


    ```

    % sort

    10

    9

    ^D          - press control D to end input.

    9

    10

    ```


    The **sort** command looked to the keyboard for input and sent its output to the
    monitor. If you have a few hundred numbers to sort, this behavior isn''t very
    useful. However, you can use redirection to tell the **sort** command to look
    at a data file for its input.


    ```

    % sort < unsorted.dat

    9

    10

    ```


    Notice how the `<` character represented redirection **into** the **sort** command.
    By the way, the *unsorted.dat* file contains the following lines:


    ```

    10

    9

    ```


    The `>` character represents redirection **out of** the **sort** command.


    ```

    % sort unsorted.dat > sorted.dat

    % cat unsorted.dat

    9

    10

    ```


    The “location” where input is gotten from is called STDIN, while the output “location”
    is called STDOUT. More details about **STDIN** and **STDOUT** are given in Chapter
    5, “Controlling the Shell.”'
