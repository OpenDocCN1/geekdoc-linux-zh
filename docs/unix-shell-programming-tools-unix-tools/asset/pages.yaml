    # Character Classes


    A character class defines a type of character. The character class [0123456789]
    defines the class of decimal digits, and [0-9a-f] defines the class of hexadecimal
    digits. Notice that you can use a dash to define a range of consecutive characters.
    Character classes let you match any of a range of characters; you don''t know
    in advance which character is matched. This capability to match non-specific characters
    is what metacharacters are all about.


    You can use variable interpolation inside the character class, but you must be
    careful when doing so. For example:


    ```

    $_ = "AAABBBCCC";n$charList = "ADE";nprint "matched" if m/$[$charList]/;

    ```


