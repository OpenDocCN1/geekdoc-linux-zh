    2 <- The first split happens at line 2.

    3 <- The second split happens at line 3.

    10 <- Everything goes into the last file.

    % ls

    csplit.dat xx00 xx01 xx02 <- The old files are overwritten.

    % rm xx*

    % csplit csplit.dat ''/@@/''

    2

    13

    % cat xx00

    1

    % cat xx01

    ##@@ <- The line containing the matched pattern

    2 <- always starts the new output file. Even though

    @@ <- the pattern was at the end of the line, the whole

    3 <- line is in the new output file.

    @@

    % rm xx*

    % # The next command adds a repeat count

    % # and specifies a prefix for the output.

    % csplit --prefix rec csplit.dat ''/@@/'' ''(*)''

    2

    7

    5

    3

    % ls rec*

    rec00 rec01 rec02 rec03

    % cat rec00

    1

    % cat rec01

    ##@@

    2

    % cat rec02

    @@

    3

