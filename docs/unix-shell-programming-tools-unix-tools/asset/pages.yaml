    Note that you need to use an uppercase Q here; lowercase will not work. |

    | \U | Change characters following the \U to uppercase until a \E sequence is
    encountered. Note that you need to use an uppercase U here, lowercase will not
    work. |

    | \E | Terminates \L, \Q, and \U sequences. Note that you need to use an uppercase
    E here, lowercase will not work. |

    | \\ | Backslash |


    TIP Perl uses strings and numbers Interchangeably. If the string doesn''t contain
    a number, a zero value is used. Therefore, never worry about string-to-number
    or number-to-string conversions.'
