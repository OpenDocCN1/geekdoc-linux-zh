    I''m sure you see the pattern emerging: The oldtext and newtext parameters are
    always in the last two positions. Using this bit of insight, we can devise a complex,
    high-tech series of commands to always locate the last two parameters.


    Step 1: Determine the position of the last parameter—the location of the newtext
    parameter. The $$ variable holds the number of parameters, so it should be used:


    ```

    newPos=$#

    ```


    Step 2: Determine the position of the next-to-last parameter—the location of the
    oldtext parameter. Because newPos already holds the position of the last parameter,
    we can simply subtract from it to get the position of the next-to-last parameter:


    ```

    let oldPos=newPos-1

    ```


    Step 3: Create a variable whose value is the name of the positional variable that
    contains the newtext parameter. For example, if there are three parameters, the
    $newVar variable should contain `$3`:


    ```

    newVar=\`echo $newPos`

    ```


    Step 4: Do the same for the oldtext parameter:


    ```

    oldVar=`echo $oldPos`

    ```'
