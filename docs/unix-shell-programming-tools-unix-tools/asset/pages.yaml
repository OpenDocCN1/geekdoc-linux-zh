  md: '# Summary


    The substitution operator has the same options as the matching operator and one
    more—the /e option. The /e option lets you evaluate the replacement pattern and
    use the new value as the replacement string. If you use backticks as delimiters,
    the replacement pattern is executed as a Unix command, and the resulting output
    becomes the replacement string.


    The translation operator has three options: /c, /d, and /s. These options are
    used to complement the match character list, delete characters not in the match
    character list, and eliminate repeated characters in a string. If no replacement
    list is specified, the number of matched characters is returned. This is handy
    if you need to know how many times a given character appears in a string.


    The binding operators are used to force the matching, substitution, and translation
    operators to search a variable other than $. The =~ operator can be used with
    all three of the regular expression operators, while the !~ operator can be used
    only with the matching operator.


    Quite a bit of space is devoted to creating patterns, and the topic deserves even
    more space. This is easily one of the more involved features of the Perl language.
    One character can have multiple meanings. For example, the plus sign can mean
    a plus sign in one instance (its literal), but can also mean to match something
    one or more times in another (its metameaning).


    Regular expression components can be combined in an infinite number of ways. Table
    8.7 lists most of the metameaning for different characters. Pattern matching also
    consists of character classes, alternation, quantifiers, anchors, pattern memory,
    word boundaries, and extended components.


