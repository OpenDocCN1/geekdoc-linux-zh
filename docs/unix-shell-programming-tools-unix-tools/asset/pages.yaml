  md: '# Table 9.31 Options for the sort Command (Cont''d)


    | Option | Description |

    | -t DELIMITER | Defines the end-of-field delimiter used when finding sort keys.
    Normally sort creates fields where there is a transition between non-whitespace
    and whitespace. For example, the input file David 35 Author has three fields;
    however, the second and third fields have extra leading spaces. The delimiter
    character is not considered to be part of any field. |

    | -u used with -c | Checks that no consecutive pair of input lines are duplicates
