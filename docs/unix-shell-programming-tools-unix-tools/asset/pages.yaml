  md: '# Using Device Files


    **Table 5.3** Devices Files Are Located in /dev


    | File Name | Description |

    | /dev/fd0 | Associated with floppy drive A. |

    | /dev/hda | Associated with the first physical (as opposed to logical) drive
    in your system. |

    | /dev/mouse | Associated with your mouse. |

    | /dev/sda | Associated with the first SCSI drive in your system. |

    | /dev/lp0 | Associated with your parallel port—normally your printer. |

    | /dev/null | This device accepts bytes and then ignores them. It is frequently
    used when the output from a program is not needed. |

    | /dev/tty | Associated with your terminal. |

    | /dev/ttyS0 | Associated with the first serial port. |

    | /dev/zero | This device is a byte emitter. You can read an infinite number of
    zero bytes from /dev/zero. |


    If you have more than one of any type of device, they are represented by changing
    the suffix of the device file. For example, serial port two is represented by
    `/dev/ttyS1`.


    If you take a look at the `/dev` directory in your system, you’ll see files that
    don’t correspond to existing devices. On my system, for example, there is `/dev/sda`
    file and I don’t have a SCSI disk.


    Device files are, in some ways, just like regular files. However, some devices
    have special requirements. Most of the diskbased files need to be made known to
    Unix before being used. The **mount** command is used for this purpose. It tells
    Unix what kind of disk is being used and where files and directories will attach
    to the rest of the Unix file system. I use the following command to make my floppy
    disk accessible:


    ```

    mount -t msdos /dev/fd0 /mnt/floppy

    ```'
