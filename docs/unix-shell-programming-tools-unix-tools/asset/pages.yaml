- img_proc: true
  md: '# Table 10.1 Perl Functions NOT Available in Windows (Cont''d)


    | Function | Description |

    | --- | --- |

    | getprpg, getppid, getpriority, getpwnam, getgrnam, getpwuid, getgrgid, getpwent,
    getgrent, setpwnd, setgrrent, endpwnd, endgrp | Functions for security and userid
    handling. |

    | fork, setpriority, times, wait, waitpid | Functions for Unix multitasking. |

    | alarm | Function used when scripts need to send signals to themselves. Windows
    doesn''t support signals. |

    | dump | Function used to create a core dump. |

    | syscall | Function used to make a system function call. |


    In most cases, Perl for Windows warns you when you try to use a function that
    isn''t supported. However, Perl for Windows can''t warn you about link, readlink,
    symlink, and syscall, so pay special attention to these functions.


    > Here''s a great way to sharpen your Perl skills:Write a little script that cycles
    through the forbidden commands, and greps a Perl file against each function to
    make sure it''s portable. It''s a breeze, really—the hardest part is typing in
    the forbidden functions, which is a good way to learn them anyway.


    Commands that are normally passed to Unix—via functions like system and exec,
