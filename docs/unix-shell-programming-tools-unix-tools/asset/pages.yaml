    ```


    In this example, the switch command tests the contents of the variable color against
    the strings red, blue, and green. If the value of color matches one of these strings,
    the switch command executes the block that appears immediately after the string.
    If the switch command doesn''t match the value of color to one of the strings
    supplied in the command, it executes the string that appears after the keyword
    default.


    # Looping Commands


    Tcl supports three basic looping commands that you can use to repeatedly execute
    a command or block of commands. Table 7.5 briefly describes the while, for, and
    foreach commands.


    # Table 7.5 Tcl''s Looping Commands


    | Command | Description | Format |

    |---|---||

    | while | Repeatedly evaluates a statement as long as the test-expression is true.
    The statement block is never evaluated if the condition is false. | while test-expression
    body |

    | for | Repeatedly evaluates a statement block. Loop termination is typically
    controlled by a count variable. | for setup test final body |

    | foreach | Evaluates a statement block for each element in an array. | foreach
    var list body |'
