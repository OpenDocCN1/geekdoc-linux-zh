  md: '# Perl


    The $ special variable keeps track of the record number. Every time the diamond
    operators read a line, this variable is incremented. NOTE


    This example reads every line in the input searching for the letter M. When an
    M is found, the print statement is executed. The print statement prints the letter
    that is found and the line number it was found on.


    The matching operator has several options. The ignore case option is probably
    the most useful, followed closely by the option to create an array of all matched
    text in a targeted string. Table 8.4 shows the options you can use with the matching
    operator.


    # Table 8.4 Options for the Matching Operator


    | Option | Description |

    | --- | --- |

    | g | The g option causes Perl to find all occurrences of the pattern in the target
    string. A list of matches is returned, or you can iterate over the matches using
    a loop statement. |

    | i | The i option causes Perl to ignore the case of characters in the string.
    |

    | m | The m option causes Perl to treat the string as multiple lines. If you know
    your target string contains embedded newline characters, use this option. |

    | o | The o option causes Perl to compile the pattern only once. You can achieve
    some small performance gains with this option. It should be used with variable
    substitution only when the value of the variable won''t change during the lifetime
    of the program. |

    | s | The s option causes Perl to treat the string as a single line. |

    | x | The x option lets you use extended regular expressions. Basically, this
    means that Perl ignores whitespace that''s not escaped with a backslash or within
    a character class. I highly recommend this option so you can use spaces to make
    your regular expressions more readable. See the section “Example: Extension Syntax”
    later in this chapter for more information. |'
