    # Summary


    This chapter is a brief introduction to Perl. Its purpose is to expose you to
    a lot of concepts in a short amount of time and space. You now have the knowledge
    needed to understand other programmers'' Perl scripts and, perhaps, to write a
    few of your own.


    In the beginning, Larry Wall dreamt of Perl and life was good. Then, other programmers
    on the Internet joined forces with Larry and life got even better. Perl is now
    a full-fledged portable programming language with support for file I/O, pattern
    matching using regular expressions, reporting features, special variables, references,
    objects, modules, source-level debugging, and many command-line options.


    Perl has three types of variables: scalars, arrays, and hashes. Scalar variables
    can hold a single unit of information—either text or numeric. Arrays hold a list
    of scalar values. Hashes hold key-value pairs. Each type of variable uses a different
    character to begin the variable name. Scalars use $, arrays use @, and hashes
    use %.'
