  md: "Tcl ordinarily uses local variables in procedures. When you define a variable\
    \ inside a procedure, the variable doesn't exist outside the procedure—therefore\
    \ it is called local. For example:\n\n```\nproc localVarExample {} {\n  set a\
    \ 100\n}\n% puts $a\n\ncan't read \"a\": no such variable\n```\n\nEven if you\
    \ define a variable with the same name outside a procedure, the procedure's local\
    \ variable does not affect the global variable defined in the main body of the\
    \ script. For example:\n\n```\n% set a 50\nproc localVarExample {} {\n  set a\
    \ 100\n}\n% localVarExample\n100\n% puts $a\n50\n```\n\nSometimes, however, you\
    \ do want to change a global variable from within a procedure. Tcl provides a\
    \ special command, **global**, to handle this situation:\n\n```\n% set a 50\n\
    proc localVarExample {} {\n  global a\n  set a 100\n}\n% localVarExample\n100\n\
    % puts $a\n100\n```\n\n# Standard Control Structures\n\nWhen you use tclsh or\
    \ Wish to type commands at a Tcl prompt, you don't need to worry about control\
    \ structures or the order of program execution. You simply type a command, and\
    \ Tcl executes the command immediately.\n\nWhen Tcl executes a script that you\
    \ have written to a file, it moves in an orderly fashion, executing commands from\
    \ top to bottom. If there are any procedures defined in the script, Tcl executes"
