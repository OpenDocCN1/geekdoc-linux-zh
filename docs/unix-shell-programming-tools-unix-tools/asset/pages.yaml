    # The csplit Command


    Synopsis:

    csplit breaks a file into pieces using context as the split criterion.


    Syntax:

    csplit [options] infile pattern...


    Description:

    The csplit command can be used to split up a file based on number of lines, a
    pattern, or a series of patterns. An error occurs if the specified pattern can''t
    be found in the input. When an error occurs, all output files are removed, unless
    this behavior is overridden by the --keep-files option. After every pattern on
    the command line has been matched, any leftover input is stored in the last output
    file.


    Let''s take a look at how csplit is used. Listing 9.2 contains the text file used
    in the examples. Each record (a record is a grouping of information) is delimited
    by two at (@) signs. The examples show how to create files that each contain one
    record.


    # Listing 9.2 csplit.dat—A Data File Used to Demonstrate the csplit Command


    ```

    1

    ##@@

    2

    @@

    3

    @@

    ```


    In order to make it easy to see the output filenames, the following commands were
    issued in a directory that only contains csplit.dat:


    ```

    % csplit csplit.dat 2

    2 <- The number of bytes written to xx00.

    13 <- The number of bytes written to xx01.

    % ls

    csplit.dat xx00 xx01

    ```'
