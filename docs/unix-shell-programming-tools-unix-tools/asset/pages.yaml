  md: '# Table 11.2 The Debugger Commands (Cont''d)


    | Command | Description |

    |---|---|

    | c LINE | Executes the rest of the statements in your script, unless a breakpoint
    is found before the script ends. You can optionally use this command to create
    a temporary break by specifying a line number after the c. I think of this command
    as continue until LINE. |

    | NO COMMAND | Pressing the Enter key without specifying a command will make the
    debugger repeat the last n or s command that was used. This feature makes it a
    little easier to single step through your script. |

    | Commands That Work With the Debugger Command History: |

    | ! | Redoes the previous command. You can also specify the number of the previous
    command to execute. Use the H command to get a list of the previous commands.
    If you specify a negative number, like !-2, the debugger counts backwards from
    the last executed command. |

    | H | Lists all the debugger commands you have issued. Only commands that cause
    action are saved in the command history. This means that the I and T commands
    are not saved. You can limit the history viewed by specifying a negative number.
    For example, H-5 displays the last five commands you have issued. |

    | Miscellaneous Commands: |

    | f FILENAME | Causes the debugger to switch to FILENAME. The file specified must
    have already been loaded via the use or require statements. Please note that some
    of the documentation that accompanies the Perl interpreter might indicate that
    f is the finish command. It used to be; however, the finish functionality is now
    accomplished by the r command. |

    | q | Quits the debugger. You can also use the Ctrl+D key sequence under Unix
    and the Ctrl+Z key sequence under DOS and Windows. |'
