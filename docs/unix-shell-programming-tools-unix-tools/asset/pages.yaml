  md: 'The use function by automatically exporting function and variable names available
    to your script by the main namespace by calling a module''s import function. Most
    modules don''t have their own import function; instead they inherit it from the
    Exporter module. You have to keep in mind that the import function is not applicable
    to object-oriented modules. Object-oriented modules should not export any of their
    functions or variables. For example, if you need to use the Test module, your
    script might look like this:


    ```

