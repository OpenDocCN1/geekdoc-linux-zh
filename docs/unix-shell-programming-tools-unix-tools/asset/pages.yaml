  md: '# Perl 243


    The pattern is hard to read because all of the slashes seem to run together (some
    programmers say they look like upside-down tees). The forward slash is used to
    escape the backslash so the pattern does not prematurely end. If you use an alternate
    delimiter, it might look like this:


    ```

    m!/medined/what.dat!

    ```


    or


    ```

    m(/medined/what.dat);

    ```


    These examples are a little clearer. The last example also shows that, if a left
    bracket is used as the starting delimiter, then the ending delimiter must be the
    right bracket.


    Another method of avoiding the backslash requirement is to use variable substitution.
    For example:


    ```

    $file = ''/medined/what.dat'';

    m$file;

    ```


    Some programmers think this technique yields clearer code than simply changing
    the delimiters.


    If you choose the single quote as your delimiter character, then no variable interpolation
    is performed on the pattern. However, you still need to use the backslash character
    to escape any of the metacharacters discussed in the “How to Create Patterns”
    section later in this chapter.


    > I tend to avoid delimiters that might be confused with characters in the pattern.
    For example, using the plus sign as a delimiter (m+abc+) does not help program
    readability. A casual reader might think that you intend to add two expressions
    instead of matching them.


    The ? has a special meaning when used as a match pattern delimiter. It works like
    the /delimiter, except that it matches only once between calls to the reset()
    function. This feature might be removed in future versions of Perl, so avoid using
    it.


    TIP'
