- img_proc: true
  md: 'This is quite a complex command. As with all complicated commands, the best
    way to understand this one is to break it down into components. The innermost
    command is:


    (a: echo $ >&4 | b > so.dat 2>se.dat)


    This command, in turn, is really two commands a: echo $ >&4 and b > so.dat 2>se.dat.
    A pipe is used to connect the output of a with the input of b.


    Let''s look at a; echo $ >&4 more closely. What exactly is happening? You know
    that the > character causes output redirection and that m&n merges two output
    streams. It turns out that if no value is specified for m, the default is STDOUT,
    or 1. >&4 means that the output originally destined for file descriptor 1 is sent
    to file descriptor 4. So, the result of a; echo $ >&4 is that the exit value of
    the program is sent as output, to file descriptor 4.


    Now let at b > so.dat 2>se.dat. This command is pretty straightforward. Both STDOUT
    and STDERR are being redirected to files. Because the first command sends its
    output to file descriptor 4, that''s where the output from b would go if not redirected.


    In simplified form, the original command was:

    % status=(...) 4>&1


    By now, you probably recognize the 4>&1; it means that the output stream going
    to file descriptor 4 is being redirected to file descriptor 1. But wait, you might
    be thinking, isn''t file descriptor 1 the same as STDOUT? Yes, it is. The only
    output coming from the backticked string is that of the echo $ command—the exit
    value of program a. The assignment statement assigns the exit value to the status
    variable, which can be used as needed.


    Learning to use file descriptors in this manner involves a lot of trial and error.
    But, on those rare occasions where this technique is needed, there is no other
    path to success.'
