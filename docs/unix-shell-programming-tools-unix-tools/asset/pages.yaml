  md: '# Portability Issues


    > HTML, or Hypertext Markup Language, is the lingua franca of the Web. It defines
    the structure and content of a web document.


    All communication between web servers and web clients starts with HTTP headers.
    HTTP, or Hypertext Transport Protocol, lets the servers and clients know what
    kind of request is being made and what kind of response has been generated.


    NOTE


    +   1. Spit out a standard HTTP header and some initial HTML for the page.


    +   2. Get the current date and store it in a variable.


    +   3. Make sure the date is formatted as the dates appear on the board page (i.e.,
    with no leading zeros in the number for the month), like this: 5/02/98.


    +   4. Search through the board page line by line and print out any lines that
    contain today’s date.


    +   5. Print out a little more HTML to finish off the web page.


    As it turns out, this task is shockingly easy to perform using Bash. Listing 10.1
    shows how it''s done.


    # Listing 10.1 filter.sh—Filter Out Today''s Messages from the Rest Using Bash


    ```

    #!/usr/local/bin/bash


    # The Messages are stored in the file assigned

    # to filterfile.

    filterfile="board.html"


    # Step 1: Display the Initial HTML

    cat << EDHEADER

    Content-type: text/html


    <head>

    <title>filtered output</title>

    </head>

    <body>

    <h1>Today''s Posts</h1>

    EDHEADER

    ```'
