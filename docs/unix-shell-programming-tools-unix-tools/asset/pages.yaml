  md: '# Summary


    The exec command is usually used to change your current shell.

    For example, the command exec /bin/csh causes you to start using the C shell instead
    of Bash. However, it can also be used to semi-permanently redirect a file descriptor
    (so a descriptor other than STDOUT or STDERR can be used) inside a script. For
    example, exec 3> /tmp/log redirects file descriptor 3 to a temporary file.

    After the redirection is set up, you can make use of it like this: echo "This
    is a message"&&3.


    After the eval command, the eval command concatenates its parameters and executes
    the newly created command, which effectively results in a second round of variable
    substitution. This technique can be used in a variety of ways — from creating
    pseudo-arrays to passing the names of commands to scripts for them to execute.


    Next, background processes are examined. By running commands in the background,
    you can run more than one command at the same time. Each command has its own Process
    ID, or PID. If one of your processes goes awry, you can use the kill -SIGKILL
    pid command to end it.


    The next chapter, “Using Perl,” introduces the Perl programming language. This
    versatile language has quickly become the “de facto” system administration language
    for Unix systems. Additionally, it is used for quite a bit of Internet development.
    Its scope of features and portability make it a powerful tool in the shell programmer’s
    arsenal.'
