    +   001 04/12/1989

    002 06/23/1994

    003 12/12/1997

    004 11/17/1997

    005 02/06/1998

    006 07/20/1995


    These three files are linked because the initial field on each line has a common
    number. The 003 associated with John in jnames.dat is also associated with a salary
    of 45000 in jsalaries.dat. The join performs this association task for you:


    ```

    % join jnames.dat jsalaries.dat

    001 Barry 132500

    002 Mario 80000

    003 John 45000

    004 Harry 75000

    005 Dorothy 90000

    ```


    Input lines that aren’t pairable—i.e., that don’t have corresponding entries in
