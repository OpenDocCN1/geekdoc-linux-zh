    # The grep Command


    Synopsis


    **grep** and **fgrep** search input files for lines that match a given pattern.


    Syntax


    ```

    `grep [options] pattern [files...]`

    ```


    Description:


    The **grep** command is a favorite of many programmers. It is frequently used
    to locate variable names in source files or to find records in text-based databases.
    **grep**''s many options are quite powerful and worth the time it takes to become
    familiar with them.


    If you haven''t used patterns (also called regular expressions) before, please
    read Chapter 8, “Pattern Matching."


    By default, **grep** displays input lines that match the pattern parameter. If
    no files are specified or the – notation is used, then **grep** reads from STDIN.


    The **grep** command interprets the pattern parameters as a series of fixed strings,
    delimited by newlines, any of which can be matched.


    The **grep** command can exit with the following values:


    +   - 0—matches were found.

    - 1—no matches were found.

    - 2—there were syntax errors in the pattern, unreachable input files, or other
    errors.'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# The grep Command


    | Option | Description |

    | -A NUM_LINES or --after-context=NUM_LINES | Displays NUM_LINES number of lines
    after the line(s) matching the pattern parameter. For example, if the matching
    line(s) is the first line of a four-line record, setting NUM_LINES to four lets
    you display all records that contain the pattern parameter |

    | -B NUM_LINES or --before-context=NUM_LINES | Displays NUM_LINES number of lines
    before the line(s) matching the pattern parameter. For example, if the matching
    line(s) is the last line of a four-line record, setting NUM_LINES to four lets
    you display all records that contain the pattern parameter |

    | -b or --byte-offset | Displays the byte offset of the line(s) matching the pattern
    parameter |

    | -C or --context | Displays two lines before and two lines after the line(s)
    matching the pattern parameter. These extra lines hopefully provide some context
    for the matching line. |

    | -c or --count | Displays the number of matching lines instead of the lines themselves.
    The -c option is sometimes used in conjunction with the -v option to display the
    number of non-matching lines. |'
