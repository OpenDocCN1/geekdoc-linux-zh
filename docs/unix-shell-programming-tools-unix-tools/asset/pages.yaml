  md: '# Table 1.1 Characters with Special Meanings to the Shell


    | Character | Description |

    |---|---|

    | " | Double quotes are used to hide spaces, tabs, and most other special characters
    from the shell. This lets "David Medinet" be seen as one value instead of two.
    In the same vein, "David < Medinet" also indicates one value and the redirection
    interpretation of the < character is ignored. |

    | '' | Single quotes hide all special characters from the shell, except the ending
    single quote. |

    | ` | Backticks are used for command substitution. The output from the command
    inside the back quotes replaces the backticked string in the original command.
    You can see examples of backticked strings in the "Command Substitution" section
    earlier in this chapter and in Chapter 12, "Customizing the Tools." |

    | \ | A backslash character hides only the following character from the shell.
    In other words, the character following the backslash loses any special meaning.
    As a trivial example, you could use David\Medinet to represent one value instead
    of two. |

    | : | The semi-colon puts more than one command on a line. However, one command
    per line is considered readable. |

    | & | The ampersand, when placed at the end of a command, puts that command into
    the background. You can see an example of this in the "Background Processing"
    section earlier in this chapter. |

    | ( ) | Parents are used to create command grouping. Examples of command groups
    are in the "Sequencing Your Commands" section of Chapter 5. |'
