  md: 'contains the username of the person running the who command. Additionally,
    some usernames are repeated, the list is not sorted, and the columns are unaligned.


    We can change all of these problems using various shell commands.


    First, we will remove the name of the person running the who command from the
    list of users. This makes sense, because people don''t usually need to send messages
    to themselves:


    ```

    % grep --revert-match `whoami`

    root tty2 - May 31 00:26

    kathy.medinets Jun 2 22:38

    ```


    By sending the output of the who command through the grep and rejecting any lines
    that contain the owner of the login shell, we get a shorter list of users.


    Is this really the list we want to present to the user of the write command? Probably
    not. For example, one person might have "lent" his userid to another, and perhaps
    the "real" person is on a computer in the lecture hall building and the borrower
    is working on a computer in a dorm room. In this scenario, a message sender might
    indeed want to send a message to himself!


    So what we really need to remove is only the line containing the terminal name
    of the sender. After a little more searching of the Tix manual, I found the tty
    command:


    ```

    % tty

    /dev/tty

    ```


    This command returns the terminal name of the shell—in this case, /dev/tty1. However,
    there is a complication. The last part of the terminal name is displayed by the
    who command, so we can''t simply use the output of the tty command in place of
    the whoami command in the grep--revert-match command.


    Getting rid of the /dev/ in the output from tty requires using the variable name
    metacharacters, as mentioned in Chapter 8, “Regular Expressions.” For example:


    ```

    % termid-''tty''

    % termid=$(termid#/dev/)

    % echo $termid

    ```


