  md: '# Debugging Techniques


    Remember the problem here? Because Perl is case sensitive, $x and $X are completely
    different variables. If you run this script with the -w switch, Perl''s optional
    warnings try to tell you that something seems wrong:


    ```

    % perl -w -e ''$x = 1; print $X''

    Name ''main::X'' used only once: possible typo at -e line 1

    Name ''main::x'' used only once: possible typo at -e line 1

    Use of uninitialized value at -e line 1

    ```


    bash>


    Now, Perl doesn''t say "Hey, I''m case sensitive, $x isn''t the same as $X," but
    its warning messages do provide some valuable clues about the problem.


    If you find the standard Perl warnings a little too terse, you can use the diagnostics
    module that comes with most Perl distributions to get a more detailed description
    of the problem. To do so, you''ll need to add the line use diagnostics; near the
    top of your script, as shown in Listing 11.5.


    # Listing 11.5 pbug.pl—Using the Perl Diagnostics Module


    ```

    #!/usr/bin/perl

    use diagnostics

    $x = 1;

    print $X;

    ```


    Using the diagnostics module enables warnings even if you don''t explicitly use
    the -w option when you run Perl. Execute the script in Listing 11.5 and you see
    a detailed message in place of the standard warning.


    ```

    % perl pbug

    Name ''main::X'' used only once: possible typo at pbug line 5

    (#1)

    ```


    (W) Typographical errors often show up as unique variable names. If you had a
    good reason for having a unique name, then mention it again somehow to suppress
    the message. The vars pragma is provided for just this purpose.'
