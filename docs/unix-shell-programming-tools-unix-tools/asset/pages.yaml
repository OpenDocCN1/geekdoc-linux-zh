  md: '# The split Command


    Synopsis

    split breaks a file into pieces using size as the split criterion.


    Syntax

    split [options] [infile] [outfile]


    Description:

    The split command, by default, creates as many 1,000-line files as needed to hold
    the contents of the input file specified on the command line or STDIN (if no input
    file is specified). You can use the options shown in Table 9.32 to change the
    size of the output files.


    # Table 9.32 Options for the split Command


    | Option | Description |

    | --- | --- |

    | -NUM -l NUM or --lines=NUM | Limits the size of the output files to NUM lines.
    |

    | -b NUM[b|k|m] or --bytes=NUM[b|k|m] | Limits the size of the output files to
    NUM bytes or you can specify a block size of 512 bytes, 1 kilobyte, or 1 megabyte
    using the b, k, or m suffixes respectively. |

    | -C NUM[b|k|m] or --line-bytes=NUM[b|k|m] | Stuffs as many lines as possible
    into output files that are limited to NUM bytes or you can specify a block size
    of 512 bytes, 1 kilobyte, or 1 megabyte using the b, k, or m suffixes respectively.
    |

    | --help | Displays a help message. |

    | --version | Displays the version information. |


    Using the split command is quite straightforward. Each time an output file is
    created, a suffix is appended to its name to make it unique. The first suffix
    is aa, the second is ab, and the rest of the suffixes continue the pattern (ac,
    ad, and so forth).'
