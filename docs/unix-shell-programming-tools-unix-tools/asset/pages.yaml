    Table 10.2 Perl Functions NOT Available in MacPerl (Cont’d)


    | Function | Description |

    |---|---|

    | link | This function deals with symbolic links (unfortunately, this doesn''t
    work with Mac OS aliases). The good (or bad) news: MacPerl treats aliases as ordinary
    files. |

    | msg*, shm* | These functions deal with interprocess communications. |

    | syscall | This function makes calls to system functions. |

    | alarm, wait, waitpid | These functions are simply not implemented. |

    | dump | This function dumps the system core. |


    Although not mentioned in the documentation, the following functions are presumably
    not supported in MacPerl:


    system*: calls a Unix built-in program.


    sem*: deals with interprocess communication.


    The MacPerl documentation also includes the following information about nonstandard
    behavior of Perl functions under Mac OS. These functions are shown in Table 10.3.


    # Table 10.3 Perl Functions That Are DIFFERENT in MacPerl


    | Function | Description |

    |---|---|

    | chmod | The meaning of the mode of files is different between Unix and Mac.
    |

    | chown | The meaning of file ownership is different between Unix and Mac. |

    | exit | This function needs to be accompanied by MacPerl::Quit in order for it
    to do what you expect. |'
