  md: '-nocase This option causes uppercase characters in the target to be treated
    as lowercase characters.


    -indices This option affects the match and subMatch variables. Instead of containing
    the actual text that was matched, the match and subMatch variables contain a list
    of the starting and ending indices of the matched text.


    -- This option (two dashes in a row) indicates that there are no more options.
    This can be useful if your pattern starts with a dash.


    The regexp function returns 1 if a pattern can be matched, and a zero if it cannot.

    The match variable, if specified, is assigned the value of the text that matches
    the pattern. If the -indices option is used, the match variable contains the starting
    and ending indices of the matched text. For example:


    ```

    % tcl

    tcl>set target "Time and Again"

    tcl>regexp "^{.)} $target match

    1

    tcl>puts $match

    T

    ```


    The match variable is assigned the value T because the ^-pattern matches the first
    character of the target.

    The subMatch variables, if specified, are assigned any text that matches parenthesized
    subexpressions. If the -indices option is used, the match variable contains the
    starting and ending indices of the matched text. For example:


    ```

    % tcl

    tcl>set target "Time and Again"

    tcl>regexp "^(.)} $target match subMatch1 subMatch2

    1

    tcl>puts $match

    T

    tcl>puts $subMatch1

