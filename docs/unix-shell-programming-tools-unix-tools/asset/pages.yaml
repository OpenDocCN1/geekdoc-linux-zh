    % PS1=\"[\\w] \" # 1\n[/var/local] % cd ..; pwd # 2\n/var\n[/var/local] % cd local\n\
    [/var/local] % (cd ..; pwd) # 3\n/var\n[/var/local] %\n```\n\nThe line numbered\
