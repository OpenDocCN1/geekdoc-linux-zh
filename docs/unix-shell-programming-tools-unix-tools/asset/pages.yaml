    # The ps Command


    Synopsis


    +   * ps reports process statistics.


    Syntax


    ps [options] [pid...]


    Description:


    I mainly use the ps command to determine process id numbers

    (PIDs) and terminal (TTY) numbers. However, ps has a lot more

    utility than that. You can also see cpu time, page faults, and a host

    of other information.


    Information about each process is displayed on a row of the ps

    output. Each row contains columns. And each column relates

    directly to specific statistics describing the process. For example,

    the PID column tells you the Process ID, and the PPID tells you

    the Parent''s Process ID.


    By default, ps displays information about the Process ID (PID),

    Terminal Number (TTY), Status (STAT), CPU Time (TIME), and

    the command the process is running (COMMAND).'
  merge: -1
  pgno: 389
- img_proc: true
  md: '# The ps Command


    The output of the ps command is normally truncated after 80 characters—so each
    process only takes one line of your terminal display. However, the w command-line
    option lets you extend the output lines. Each w used on the command line extends
    the maximum length of output lines by another line. However, since ps only uses
    as many lines as needed, blank lines will not be displayed. ps www-www is to use
    if you''re unsure how many lines the output needs.


    If you only need information about a specific process or a list of processes,
    you can specify it or by typing PID on the command-line.


    At first glance, the ps command doesn''t have too much to do with programming;
    it is more like a system administration command. It''s included in this chapter
    for three reasons. For one, other entries reference it, and therefore it is needed
    here. After, you can combine it with grep and awk to extract useful information.
    Finally, I found the manual pages to be unclear.


    The h command-line option is handy when using ps inside scripts because it eliminates
    the default header line. After all, because you already know which column you
    need to extract information from, the header line only gets in the way.


    Table 9.28 lists most of the options available for the ps command. The options
    dealing with sorting the output are not shown.


    > Unlike Unix commands, the ps command shouldn''t include a dash (-) in front
    of its command-line options. You can simply place the options one after another.
    For example, ps af displays processes for all users in a tree structure.


    # Table 9.28 Options for the ps Command


    | Option | Description |

    | a | Displays information about the processes for all users. |

    | c | Displays the command name for each process instead of the full directory
    path to the command and the parameter used on the command line. For example, instead
    of displaying ps fj, only ps would be shown. |'
  merge: -1
  pgno: 390
- img_proc: true
  md: '# Table 9.28 Options for the ps Command (Cont''d)


    | Option | Description |

    | --- | --- |

    | e | Displays the environment variables available to each process. |

    | f | Alters the COMMAND column of information so the parent-child relationship
    is apparent. This is not too useful for shell programming. If you need to determine
    the parent of a process inside your script, use the PGID column. |

    | h | Suppresses the display of a header line. |

    | j | Adds the PPID, PGID, SID, TPGID, and UID columns to the default list. |

    | l | Adds the FLAGS, UID, PPID, PRI, NI, SIZE, RSS, WCHAN, and STA columns to
    the default list. |

    | m | Adds the MAJLT, MINFLT, TRS, DRS, SIZE, SWAP, RSS, SHRD, LIB, and DT columns
