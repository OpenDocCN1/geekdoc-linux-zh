  md: '# Summary


    Let''s look at a simple example of regsub:


    ```

    % tcl

    tcl>set target "aaa bbb ccc"

    tcl>set pattern (bbb)

    tcl>set rep (zzz)

    tcl>set count [regsub $pattern $target $rep newVariable]

    tcl>puts $newVariable

    aaa zzz ccc

    tcl>puts $count

    1

    tcl>set target "aaa bbb ccc bbb"

    tcl>set count [regsub -all $pattern $target $rep

    newVariable]

    tcl>puts $newVariable

    aaa zzz ccc aaa

    tcl>puts $count

    2

    ```


    The second call to regsub replaces both instances of *bbb* in the target variable.


    Like Perl''s // and s// operators, the regsub function makes use of pattern memory.
    regsub lets enclose pattern components inside parentheses in order to store the
    string that matches the components into pattern memory. You can use pattern memory
    as one of the components of the replacement pattern.


    The character sequence \0, when used in the replacement string, gets replaced
    with the whole matched text. The \n character sequence gets replaced with the
    $n^{th}$ parenthesized sub-expression. For example:


    ```

    % tcl

    tcl>set target "aaa bbb ccc bbb"

    tcl>set pattern {bbb}

    tcl>set rep (z\0)

    tcl>regsub $pattern $target $rep newVariable

    1

    tcl>puts $newVariable

    aaa zbbbz ccc

    ```


    # Summary


    As you''ve seen, pattern matching is a useful, but complex, subject. Bash uses
    pattern matching mainly for filenames. Perl has integrated pattern matching and
    uses patterns in many different ways.'
