    # Understanding Substitution Concepts


    Substitution is the heart and soul of Tcl. Once you''ve mastered substitution
    and grouping (explained in the next section), you''ll be in a position to fully
    use the power of Tcl. If you don''t understand substitution, you''ll get frustrated
    quickly.


    There are three basic kinds of substitution in Tcl: variable substitution, which
    substitutes the value of a variable for the variable''s name in a command; command
    substitution, which replaces a command with the results of the command; and backslash
    substitution, which replaces a sequence of characters with a special character.


    # Variable Substitution


    Variable substitution is similar to the kind of variable substitution that takes
    place in Bash. When you add the $ prefix to a variable''s name in a Tcl command,
    the Tcl interpreter substitutes the value of the variable for the variable''s
    name. For example, let''s say that we store the value "Mugsy" in the variable
    named friend, like so:


    ```

    % set friend Mugsy

    Mugsy

    ```


    Now, if we use $friend in a new command, the Tcl interpreter substitutes the value
    for the name, like so:


    ```

    % puts $friend

    Mugsy

    ```


    Without the $ symbol to denote substitution, Tcl treats the variable''s name as
