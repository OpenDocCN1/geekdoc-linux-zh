- img_proc: true
  md: '# Variable Affecting Commands


    The declare command understands four options:


    +   -f displays only function names.


    +   -r creates read-only variables. Read-only variables can''t be assigned new
    values or unset unless the declare or typeset command is used.


    +   -x creates exported variables.


    +   -i creates integer variables. If you attempt to assign text to an integer
    variable, a zero is actually assigned instead.


    By using a + instead of a -, you can reverse the meaning of an option.


    If no parameters are used, declare displays a list of currently defined variables
    and functions.


    Let''s take a closer look at the -r option:


    ```

    % declare -r title="Paradise Lost"

    % title="Xenogenesis"

    bash: title: read-only variable

    % declare title="Xenogenesis"

    % echo $title

    Xenogenesis

    % typeset title="The Longing Ring"

    % echo $title

    ```


    The Longing Ring

    This example shows that only the declare or the typeset command can change the
    value of a read-only variable.


    # The Export Command


    Syntax:

    export [options] [name[value]]


    Synopsis:

    Used to create variables that are passed to child shells.


    The export command understands four options:


    +   -- signifies the end of options. All subsequent parameters are arguments.


    +   -f signifies that the names (in the name-value pairs) are functions.'
