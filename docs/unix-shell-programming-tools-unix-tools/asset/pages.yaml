  md: '# Debugging Concepts


    This chapter introduces you to the many types of errors that arise when you create
    scripts. The two basic types of problems are syntax errors and logic errors. Syntax
    errors reflect incorrectly formed statements—missing spaces, too many parentheses,
    and so forth. Logic errors are all but impossible to guard against. Logic errors
    result when you want to count to 10 and, instead, you only count to 9 because
    you use a less than operator instead of a less than or equal to operator.'
  merge: -1
