  md: '# Variables in Perl


    indicate a module or package name. See the "Using Modules" section later in this
    chapter for additional information on modules and packages.


    Variable names can be quite long. However, the practical limit is roughly 15 characters.
    Any longer and you''ll get tired of typing the variable name as you enter your
    code into a text editor.


    # Scalars


    Scalar variable names always start with a dollar sign ($). They can hold one number
    or one text string at a time. Perl variables always start with a value of zero
    or the empty string (""). If a number is needed, the value is zero. If a string
    is needed, the empty string is used. Scalars are assigned values, using the equals
    sign, like this:


    ```

    $bookNum = 10;

    $bookTitle = "The Scarlet Letter";n$bookNum = $bookNum + 5;

    ```


    # Arrays


    Array variable names always start with an sign (@). They can hold a series of
    scalar values or elements. Arrays can consist of mixture of numbers and text in
    any combination and are assigned values like this:


    ```

    $oddNumbers = (1, 3, 5, 7, 9);

    $weekends = ("Saturday", "Sunday");

    $mixed = (1, "Monday", 2, "Tuesday");

    ```


    The parentheses indicate the beginning and ending of the list of scalars. Individual
    elements are accessed using a numeric index. You access the first elements of
    the @oddNumbers array using $oddNumbers[0]. Notice that the individual element
    is a scalar and therefore starts with a dollar sign. Also notice that the array
    index is surrounded by square brackets. Array indexes start at zero. Therefore,
    while the @oddNumbers array has five elements, the last element is referenced
    by $oddNumbers[4].


    > You can always access the last element in an array using the -1 index. The next
    to last element is -2 and so on.'
