    |

    | () | The parentheses let you affect the order of pattern evaluation and act
    as a form of pattern memory. |

    | * | The asterisk quantifier forces the previous component to be matched zero
    or more times. |

    | + | The plus quantifier forces the previous component to be matched one or more
    times. |

    | | | The mark quantifier forces the previous component to be matched zero or
    one times. |


