- img_proc: true
  md: 'Second, the $0 variable holds the name of the script itself. This variable
    might be used to create log files that are easily associated with the script.


    There are three other variables that are related to the positional variables:


    +   $* This variable contains a list of the parameters.

    $@ This variable contains a list of the parameters.

    $# This variable contains the number of parameters.


    Bash maintains both the $* and the @@ variables to make posting scripts from other
    shell programs easier.

    Listing 2.7 contains the listparam script, and demonstrates use of the *, @@,
    and ## variables.


    # Listing 2.7 listparam—Using the *, @@, and ## Variables


    ```

    #!/bin/bash


    echo "There are $$ parameters."

    echo "The parameters are $*($#)**"

    echo "The parameters are $@*"

    ```


    Here is an example of this script in action:


    ```

    % chmod +x listparam

    % ./listparam one two three

    There are 3 parameters.

    The parameters are *one two three*

    The parameters are *one two three*#

    ```


    Notice how the curly braces were used in the second echo command so that the variable''s
    value could be surrounded by asterisks. The curly braces come in handy in more
    than one situation.

    The $@ variable will become very useful to you after you read about the for command
