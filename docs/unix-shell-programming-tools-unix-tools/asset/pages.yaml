  md: '# Special Variables


    # Table 6.7 Perl''s Special Variables (Cont''d)


    | Variable Name | Description |

    | --- | --- |

    | $$ | Holds the process number of the process running the Perl interpreter. |

    | $? | Holds the status of the last pipe close, backtick string, or system function.
    |

    | &=\ | Holds the string that was matched by the last successful pattern match.
    |

    | `$ | Holds the string that preceded whatever was matched by the last pattern
    match. |

    | $'' | Holds the string that followed whatever was matched by the last pattern
    match. |

    | $+ | Holds the string that was matched by the last bracket in the last successful
    pattern match. For example, the statement /Filename: (.*)|Filename: (.*) / &&
    ($fName = $+); finds the name of a field if you don''t know which of the two possible
    spellings is being used. |

    | $* | Changes the interpretation of the ^ and $ pattern anchors. Setting $* to
    1 is the same as using the /m option with the regular expression matching and
    substitution operators. Normally, $* is equal to 0. |

    | $0 | Holds the name of the file containing the Perl script being executed. |

    | $<number> | This group of variables ($1, $2, $3, ...) holds the regular expression
    pattern memory. Each set of parentheses in a pattern stores the string that matches
    the components surrounded by the parentheses into one of the $<number> variables.
    |

    | $[ | Holds the base array index. Normally, it''s set to 0. Most Perl authors
    recommend against changing it without a very good reason. |'
