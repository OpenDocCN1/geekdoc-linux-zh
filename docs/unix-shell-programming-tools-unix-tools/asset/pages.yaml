    | 7 | SIGBUS | Program Error | This signal indicates an invalid memory address
    was referenced. |

    | 8 | SIGFPE | Program Error | This signal indicates a fatal arithmetic error.
    |

    | 9 | SIGKILL | Termination | This signal is always fatal. It can’t be handled
    or ignored. |'
