    # Writing to Files


    If you wish to open a file for writing or appending, you''ll need to add an additional
    argument to the **open** command. This argument is a Tcl-specific code that tells
    the interpreter what you plan to do with the file. For example, to write to a
    file, replacing its current contents, you add the **w** code, like so:


    ```

    openfile.txt w

    ```


    Table 7.6 summarizes the codes used for the **open** command.


    Table 7.6 The Code Used with Tcl''s open Command


    | Code | Description |

    |---|---|

    | r | Opens an existing file for reading only. (This is the default.) |

    | r+ | Opens an existing file for reading and writing. |

    | w | Opens an existing file for writing only, clobbering any contents that the
    file contains; if the file does not exist, creates a new file. |

    | w+ | Opens an existing file for writing and reading, clobbering any contents
    that the file contains; if the file does not exist, creates a new file. |

    | a | Opens an existing file for writing only, appending any new content to the
    end of the current contents. |

    | a+ | Opens an existing file for writing and reading, appending any new content
    to the end of the current contents. |'
