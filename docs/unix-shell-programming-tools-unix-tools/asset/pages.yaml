    % proc trySwitch color {

    > switch $color {

    > red (puts "Apples are red.")

    > blue (puts "The sky is blue.")

    > green (puts "Kerm is green, and it''s not easy.")

    > default (puts "Sorry, I don''t know that color.")

    > }

    % trySwitch red

    Apples are red.

