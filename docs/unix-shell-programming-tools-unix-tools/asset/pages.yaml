    | Operator | Description |

    |---|---|

    | op1 + op2 op1 - op2 | Returns op1 plus op2 or op1 minus op2 depending on the
    operator. |

    | op1 \ op2 op1 / op2 op1 % op2 | Returns op1 times op2 or op1 divided by op2
    or op1 mod op2 depending on the operator. |

    | PATTERN or match op1 PATTERN | Returns the number of characters that match PATTERN
    or 0. The PATTERN is automatically anchored to the beginning of op1. |

    | op1 : \( PATTERN \) match op1 \( PATTERN \) | Returns the substring of op1 that
    matches PATTERN or null. The PATTERN is automatically anchored to the beginning
    of op1. |

    | substr op1 POSITION LENGTH | Returns the substring that begins at POSITION and
    is LENGTH long. If the POSITION or LENGTH parameters are negative or non-numeric,
    a null string is returned. |

    | index op1 CHARLIST | Returns the first position in op1 where a character in
    CHARLIST was found. |

    | length op1 | Returns the length, in characters, of op1.


