    \ nfind.sh script to make it easier to test and debug. Instead, the echo command\
    \ is used to display find commands that would normally be executed.\n\nListing\
    \ 12.1 nfind.sh—Using test and read to Limit Searching Entire Disk Hierarchies\n\
    \n```\n#!/bin/bash\n\n# First, let's cover the case of no parameters.\nif [ $$\
