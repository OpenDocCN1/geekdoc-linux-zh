    +   * [[:upper:]—matches one uppercase letter.


    +   * [[:xdigit:]—matches one hexadecimal character (0-9 and A-F).


    +   * \w—matches an empty string at the beginning of a word.


    +   * \b—matches an empty string at the end of a word.


    +   * \w—matches an empty string at the edge of a word.


    +   * \B—matches an empty string not at the edge of a word.


    You can invert the sense of any of these character classes using this notation:


