    \ a particular value in an array, you use the array's name, followed by the value's\
    \ index. For example, let's say you have an array called form_values, and you'd\
    \ like to create a value indexed by the string name:\n\n```\n% set form_values(name)\
    \ David\nDavid\n```\n\nVariable substitution works exactly the same for arrays\
    \ as for simple variables. Thus, to access the name slot in form_values:\n\n```\n\
