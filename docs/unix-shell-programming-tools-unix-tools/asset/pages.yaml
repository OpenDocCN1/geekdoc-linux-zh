    | tell | Returns the current position in a file. |

    | time | Times the execution of a block of commands. |

    | trace | Executes a command when a variable is accessed. |

    | unset | Removes a variable. |

    | uplevel | Executes a script at a different level of the call stack. |

    | upvar | Links to a variable that has been defined at a different level of the
    call stack; essentially used to pass variables by reference, rather than by value.
    |

    | while | Creates basic looping control structure. |


    # Expr Commands


    In addition to its wide range of built-in commands, Tcl supports many mathematical
    and logical functions and operators. These functions can’t be used as standalone
    Tcl commands, but they’re useful in the context of an **expr** command or a control
    command, such as **if** or **while**.


    For example, suppose that you’re interested in calculating square roots. Using
    Tcl’s **sqrt** function at the Tcl prompt returns an error:


    ```

    % sqrt(36)

    invalid command name "sqrt(36)"

    ```


    However, using the function makes perfect sense inside an **expr** command:


    ```

    % expr (sqrt(36))

    6.0

    ```'
