    # Special Variables


    Perl uses many special variables to modify how its functions behave and to store
    the results of operations. For example, after a pattern match attempt (using the
    m// or s/// operators), the $& variable contains the text, if any, that matched
    the pattern. Special variables hold the values of environment variables, and can
    turn on and off debugging options.


    The details about how to use many of the special variables, such as the $D variable—which
    holds the value of Perl''s debugging options—are beyond the scope of this book.
    However, you should be aware that these variables exist, especially because the
    Perl scripts in Chapter 12, “Customizing the Tools,” use several of them.'
