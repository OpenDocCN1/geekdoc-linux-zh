  md: '# The trap Command


    What''s a signal? Good question. A signal is sent to your script by the shell
    when specific things happen. For example, if your script dials into another machine,
    a signal would be generated if the phone line goes dead—the SIGHUP or hang signal.

    The simplest use of the trap command is to use it to ignore signals. If you wanted
    your script to ignore the CTRL-C combination, you would use the following line
    of code earlier in your script:


    ```

    trap "" 2

    trap "" SIGINT

    ```


    Listing 4.4 contains a program that reads lines of input from the keyboard (actually
    standard input, but let''s not be too technical). The user can press CTRL-C without
    causing the program to break. As long as the user enters "a" and then presses
    <ENTER>, the script loops. If any other input is read, the script ends.


    # Listing 4.4 test_sigint—A Script to Use for Experimenting with SIGINT


    ```

    #!/bin/bash

    trap "" SIGINT


    input="a"


    while [ $input = "a" ]

    do

    echo "Type ''a'' to continue, anything else to quit:"

    read input

    done

    ```


    The script is done.

    First run the script with the trap command commented out (use the #character at
    the beginning of the second line). This results in the following:


    ```

    % chmod +x test_sigint

    % test_sigint

    Type ''a'' to continue, anything else to quit:

    a  <- while "a" is entered, the script loops.

    Type ''a'' to continue, anything else to quit:

    *C  <- CTRL-C is pressed. And the script exits.

    ```'
  merge: -1
  pgno: 88
