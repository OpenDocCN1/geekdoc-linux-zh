- img_proc: true
  md: '# Description:


    The **sort** command, without any command-line parameters, reads lines of input
    from STDIN until an end-of-file character (^D) is received, and then arranges
    the lines in alphabetical order before sending them to STDOUT.


    There are three main ways to use the **sort** command:


    +   - to sort—This is the default usage. All input lines are rearranged until
    they are in alphabetical order.


    +   - to merge—This usage (the -m option) merges two or more sorted files into
    one sorted file. Because the input files are pre-sorted, this mode is faster than
    simply concatenating all input files and sorting the resulting file.


    +   - to verify sortedness—This usage (the -c option) checks to see if all input
    lines are already in alphabetical order. If not, an error message is displayed
    (*disorder on filename*) and **sort** ends with an exit value of 1.


    Table 9.31 shows the options available with the **sort** command. Options that
    are set globally can be overridden when the same option is used with a specific
    sort key. If no sort keys are specified, global options affect the comparison
    of entire input lines.


    # **Table 9.31** Options for the sort Command


    | Option | Description |

    | -b | Ignores leading blanks when finding sort keys in each line. This option
    can be specified globally or for each sort key |

    | -c | Verifies that the input lines are already in sorted order. |

    | -d | Sorts in phone directory order. All characters except letters, digits and
    blanks are ignored. |

    | -f | Ignores case when sorting by folding lowercase letters into their uppercase
    equivalents. |

    | --help | Displays a help message. |'
  merge: -1
  pgno: 399
- img_proc: true
  md: '# The sort Command


    # Table 9.31 Options for the sort Command (Cont’d)


    | Option | Description |

    | --- | --- |

    | -i | Ignores characters outside the ASCII range (32 to 126 inclusive) when sorting.
    |

    | -k POS1 [,POS2] | Specifies a sort field (also called a key field) within each
    input line. The field begins at POS1 and extends to, but does not include, POS2.
    All fields and character positions are numbered starting with 1 when using the
    -k option. |

    | -M | Looks for three-letter abbreviations at the beginning of input lines and
    sorts in a logical manner (i.e., "Jan" is before "Feb"). Valid abbreviations are
    sorted before invalid ones. Initial whitespace (spaces and tabs) is ignored. |

    | -m | Merges two or more sorted input files. |

    | -n | Looks for a number at the beginning of input lines and sorts accordingly
    (i.e., this option provides a numerical sort). |

    | -o FILENAME | Writes the sorted output to FILENAME instead of STDIN. FILENAME
    can also be one of the input files; sort handles this situation correctly. |

    | -r | Reverses the order of the sort. For example, reverse alphabetical order
    is "Z" to "A". |

    | -s | Eliminates the last-ditch comparison by machine-collating sequence sort
    performs when comparison by key fields determines that input lines are the same.
    In other words, if the key fields on two or more input lines are the same, the
    lines are left in the same relative order. |

    | -T DIRNAME | Specifies a temporary directory for sort to use. This option overrides
    the TMPDIR environment variable. If no temporary directory is specified, /tmp
    will be used. |'
