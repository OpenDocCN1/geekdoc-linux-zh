    # Runtime Errors


    After you''ve fixed the syntax errors in your script, the real work of debugging
    begins. A script that makes perfect syntax sense to a Perl or Tcl interpreter
    might still not do what you want to do; in fact, it might do something really
    stupid (if you''re not careful) really dangerous. For example, consider this perfectly
    legal and simple-looking script:


    ```

    % perl -e ''$x = 1; print $X''

    ```


    You might think—at least I thought, in my innocent years—that this script would
    print out the number 1. However, it prints nothing at all, not even an error message.
    What''s going on here? Remember, Perl is case sensitive, so when we set the value
    of $x, the variable $X remains undefined. Perl doesn''t mind printing out an undefined
    value, so it prints nothing. By the way, the proper form of this code is:'
