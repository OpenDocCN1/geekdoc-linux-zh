    # The ptree Command


    Synopsis


    pstree displays process names using a tree format.


    Syntax


    ```

    pstree [options][pid|user]

    ```


    Description:


    I like the ptree command better than the ps command for learning which processes
    are running on a system and how they relate to one another. This is because the
    ps command shows a lot of extraneous information, while the ptree command shows
    only the process name—the focus of the command is narrower.


    By default, the beginning of the displayed tree starts with the init process—the
    first process started when Linux is booted. You can change the starting point
    by specifying a PID or username on the command line.


    Normally, a series of identical processes (like the getty process that monitors
    TTYs) is shown on one line of the tree, along with a number showing how many of
    the processes exist. For example, 4*[getty] means four getty processes are running.


    Table 9.29 lists the options available for the ptree command'
  merge: -1
  pgno: 393
- img_proc: true
  md: '# The pstree Command


    Table 9.29 Options for the pstree Command


    | Option | Description |

    | --- | --- |

    | -a | Shows the command lines of processes in the tree. Processes that are swapped
    out are shown in parentheses. |

    | -c | Suppresses the compaction of identical processes. |

    | -G | Draws the tree using VT100 line-drawing characters. |

    | -h | Highlights the current process and its children. |

    | -l | Uses long lines when displaying the tree. Normally, lines are truncated
    to the display width. |

    | -n | Sorts processes by PID instead of name. |

    | -p | Displays the PIDs of each process. |

    | -u | Displays the username of the process if the username of the parent is different—see
    the example following this table. |

    | -U | Displays the table using Unicode characters. |

    | -V | Displays version information. |


    Here is the pstree command in action:


    ```

    # The default pstree command.

    % pstree

