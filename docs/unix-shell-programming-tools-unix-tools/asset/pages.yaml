    # Variable Affecting Commands


    The shell has several commands that work with variables. And several of them seem
    to duplicate each other''s features. For example, you can create global (or exported)
    variables using the **declare**, **export**, and **typeset** commands. In fact,
    **typeset** is a synonym for the **declare** command.


    # The declare Command


    Syntax:


    ```

    declare [options] [name={value}]

    ```


    Synopsis:


    Used to display or set variables.'
