  md: '# 294 / Chapter 09 / Examining the Tools


    While some Unix commands are quite simple—the mv command, for example—nearly all
    of them have valuable options and features that might not be immediately obvious.
    When I learned Unix—some 16 years ago—few of the reference books had examples.
    They consisted of lists of command options and a minimum amount of information
    about what each option does. Commands were rarely shown in combination with other
    commands—the way they are used by experienced Unix users. In the ensuing 16 years,
    the documentation hasn''t gotten much better. Yes, it is more comprehensive, but
    not more understandable. In this chapter, I hope to remedy that situation.


    The tools described in this chapter, and the many others that are available, comprise
    one of Unix''s biggest advantages over other operating systems. Recently, I needed
    to manipulate a17MB text file in DOS. Without the aid of tools as split, grep
