    (#1)


    Use of uninitialized value at pbug line 5 (#2)


    (W) An undefined value was used as if it were

    ready defined. It was interpreted as a "" or

    a 0, but maybe it was a mistake. To suppress this

    warning assign an initial value to your variables.


    If you are truly desperate for feedback from your script, you can

    use the verbose option with the diagnostics module, like this:


    ```

    use diagnostics -verbose;

    ```


    The verbose option simply displays the Perl man page, which

    describes the levels of error messages listed in Table 11.1, before it

    ponds to particular messages. It does not cause Perl to provide

    more detailed responses or descriptions for individual messages.


    # NOTE


    Some Perl distributions might not include the standard Perl librar-

    ies, or might store the libraries in a peculiar location. Check with

