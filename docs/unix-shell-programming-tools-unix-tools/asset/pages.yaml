  md: '# Exploring Shell Features


    Shells have many features in common. The following sections briefly discuss some
    of these features.


    # Aliases


    Aliases are used to create shortcut commands that stand in for full command lines.
    For example, many people use an alias of **ll** to mean `ls -l` or `la` to mean
    `ls -a`. Aliases are only peripherally related to shell programming. Mainly, they
    are used to reduce the amount of typing needed at the command line.


    When I start working with a new web server, I frequently create an alias to display
    the last 10 lines of the server log file.


    The **alias** is fully documented in the Bash **man** page. When creating shell
    script, sometimes you want to ensure that you''re using a “basic” shell command
    instead of an alias (somebody might have aliased **ls -a**). You can avoid the
    alias by using the full pathname of the command. In the case of **ls**, the full
    pathname is `/bin/ls`.


    # Command Substitution


    One of the shell''s nicer features is the ability to do command substitution.
    You can combine the output of one command inside another using backtick notation.
    This might sound like a wacky idea at first, but as you gain proficiency you''ll
    find that it''s a powerful technique.


    Some of the examples in Chapter 12, “Customizing the Tools,” use command substitution,
    so I''ll only give a simple example here. Let''s say you created a file called
    `ls_info` that contained a single line:


    ```

    *.c

    ```


    You could incorporate the contents of the `ls_info` file into an **ls** command
    line like this:


    ```

    % ls `cat ls_info`

    one.c two.c

    ```'
