    |

    | -i or --interactive | Requests confirmation before overwriting any file |

    | -S or --suffixFFIX | Defines the suffix to be used when creating backup files
    with the -b option. The default is a tilde (-). You can also set the SIMPLE_BACKUP_SUFFIX
    variable. The command-line option overrides the variable. |

