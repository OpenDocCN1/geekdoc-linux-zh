- img_proc: true
  md: '# The eval Command


    Synopsis


    eval generates and executes command lines on the fly.


    Syntax


    ```

    eval [parameters...]

    ```


    Description:


    The eval command concatenates its parameters and executes the resulting command.
    Its exit value is the exit value of the command that is executed, or 0 if no parameters
    are supplied. Perhaps the only reason to use the eval command is to force a second
    round of variable substitution. For example, simply executing a command with variables
    on the left side of an assignment command looks like this:


    ```

    % mm=''Jun''

    % dd=''15''

    % $mm$dd="John''s Birthday"

    bash: Jun16=John''s Birthday: command not found

    ```


    Bash performs the variable substitution correctly, but tries to find a command
    called Jun16=John''s Birthday instead of interpreting the command correctly. The
    eval command fixes this problem at the expense of simplicity:


    ```

    % eval "$mm$dd=\"John''s Birthday\"

    % echo Jun15

    John''s Birthday

    % eval "echo \$$mm$$dd"

    John''s Birthday

    ```


    From this example, you can determine that $$mm$$ evaluates to $Jun15 because it
    is displayed with the echo command, it has the same value: John''s Birthday. The
    backslash characters are needed to prevent certain characters from interfering
    in the first round of variable substitution. For example, without the backslash
    $$mm$$dd would be seen as the variable $$ followed by the text mm followed by
    the variable $dd, which is not intended.'
  merge: -1
  pgno: 346
