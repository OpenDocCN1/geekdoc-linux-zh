    The above examples show that the csplit command has great flexibility. They used
    three methods to control the context split:


    +   Line Number—The exact line number(s) at which to split can be specified on
    the command line.


    +   Pattern—Using the ''/PATTERN/'' ''[''n*]*'' notation, you can specify a regular
    expression to control the splits. The entire line containing the pattern starts
    a new output file. The ''[n*]'' notation means to look for the pattern n times
    or, if the asterisk is specified, look for the pattern until the end of the input.


    +   Anti-Pattern—Using the %PATTERN% ''[''n*]*'' notation, you can specify a section
    of file to ignore. csplit ignores from the line containing the anti-pattern to
    the next pattern found. The optional ''[n*]'' notation means to look for the pattern
