  md: '# The cut Command


    Synopsis

    cut displays one or more sections from each line of input.


    Syntax

    cut (section_specifiers) [options] [file...]


    Description:

    The cut command looks at each line of input, chops each line into sections, and
    displays those sections specified on the command line. If no files are listed
    on the command line, STDIN is used.


    Table 9.6 shows sections are specified.


    # Table 9.6 Section Specifiers for the cut Command


    | Section Specifier | Description |

    | -bLIST or --bytes LIST | Displays the bytes located in the positions specified
    by the LIST parameter. For example, --bytes 1-3 displays only the first three
    bytes of each line. Note that the --bytes specifier needs a space before the LIST
    parameter |

    | -cLIST or --characters LIST | Displays the characters located in the positions
    specified by the LIST parameter. For example, --characters 1-3 displays only the
    first three bytes of each line. Note that the --characters specifier needs a space
    before the LIST parameter |

    | -fLIST or --fields LIST | Displays the fields specified by LIST. A field is
    delimited by the beginning of a line, the end of a line, and the DELIMITER specified
    by the -d/delimiter option. The default delimiter is a tab character. Note that
    the --fields specifier needs a space before the LIST parameter |


    A distinction is made between bytes and characters because of international character
    sets. For now, assume the two options perform the same actions.'
