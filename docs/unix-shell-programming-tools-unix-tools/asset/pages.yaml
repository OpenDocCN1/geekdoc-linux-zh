- img_proc: true
  md: 'Let''s get some basic information out of the way first. Unix is an operating
    system. It mediates between the CPU, disk drives, memory, monitors, keyboards,
    and other pieces of hardware. When you look at a Unix screen, you''re not really
    seeing “Unix,” you''re seeing a program running by the operating system that monitors
    and responds to the keyboard. That program is called the login shell. The login
    shell is a user interface to the Unix operating system. Figure 1.1 shows a diagram
    that depicts this situation.


    Login Shell


    ![](img/8fe1800c5b705516dc6b73632c4160ad_23_0.png)


    **Figure 1.1** The login shell monitors the command line.


    I''m not certain of the origin of the term shell. If I had to guess, I would say
    it relates to how everything you do at the keyboard is enveloped by monitoring
    program—the login shell. This is an important concept to understand. When you
    enter commands on the keyboard, the shell program interprets them.


    For example, let''s say that you run a program that displays generic statistics—the
    ps program. The ps program runs inside the shell program. You might want to picture
    the shell as a big balloon. When the calculator program is run, the balloon swells
    up to accommodate it (because the calculator program essentially runs inside the
    shell). When the calculator program is finished, the balloon shrinks.


    Shell programs are also called command interpreters.


    Login Shell ps command


    ![](img/8fe1800c5b705516dc6b73632c4160ad_23_1.png)


    **Figure 1.2** Shell programs can run other programs.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Exploring Access Permissions


    The ps program is executed as a process inside the computer. Processes are simply
    individual commands being run by the computer. Each process has its own memory
    and access permissions.


    You can even run a shell program inside another shell program. The shell program
    inside the balloon is called a child shell. The following series of commands shows
    you a child process in:


    ```

    $ echo SHLVL

    1

    $ bash

    $ echo SHLVL

    2

    $ exit

    $ echo SHLVL

    1

    ```


    Notice how the number displayed by the echo command (corresponding to the level
    of shell nesting) increases? This shows that the child shell is displaying the
    value. The exit command returns back to the parent shell.


    # Exploring Access Permissions


    If this is the first time you''re looking into programming—as opposed to simply
    running programs—you might be unfamiliar with access permissions. Access permissions
    are used to control access to files. Restrictions can be based on the file''s
    owner, the file''s group, and all other users. There are three types of access
    for each of these groups: read, write, execute.


    Access permissions are changed by the chmod command. Because access permissions
    are part of the file system structure on all Unix systems are so integral to shell
    programming, let''s look at a couple of examples of:


    ```

    $ echo "A Test" > test.dat

    $ mkdir test_dir

    $ ls -1 test.dat test_dir

    total 2

    -rw-rw-r-- 1 medined medined 7 [date] test.dat

    drwxwxrxr 2 medined medined 1024 [date] test_dir2

    $ rm -r test_dir

    $ rm test.dat

    ```'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Chapter 01 / Playing with Shells


    For some special files, the first character can be something beside a dash or
    a "d". Those files are more likely not used by system administrators and aren''t
    covered in this book.


    The first column of the ls -l command contains the access permissions for each
    file listed. As shown in Figure 1.3, you interpret the first column by breaking
    it into four sections: d, rwx, and x.


    ![](img/8fe1800c5b705516dc6b73632c4160ad_25_0.png)


    **Figure 1.3** You can read, write, and execute permissions to the file owner,
    the file owner''s group, or to all other users.


    Although it might be counter-intuitive, directory information is stored inside
    files. And the first section indicates whether or not the file contains directory
    information. If it does, the first section displays a d; it is blank for normal
    files.


    The next three sections use a simple notation to indicate if the user, group,
    or other categories have read, write, or execute access to the file.


    The next section of this chapter lets you create and run a shell script. It will
    briefly show how to use the `chmod` command to control the access permissions.
    The “421” numbers in Figure 1.3 are explained there.


    # Running a Shell Script


