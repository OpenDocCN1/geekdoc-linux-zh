  md: '-- signifies the end of options. All subsequent parameters are arguments.


    -f creates read-only functions.


    The unset command removes the specified variables and functions from the shell''s
    environment. Note that PATH, IFS, PPID, PS1, PS2, UID, and UUID cannot be unset.
    If you unset the RANDOM, SECONDS, LINENO, or HISTCMD variables, they lose their
    special properties.


    # Summary


    Variables are used quite a bit in the shell. Quite often they are used to control
    shell behavior, as evidenced by the IGNOREEOF variable. At other times they are
    simply used to hold important values like the HISTSIZE variable.


    The shell understands the difference between integer variables and text variables.
    When integer variables are assigned text values, the shell quietly replaces the
    text with a zero value.


    The shell also incorporates the concept of variable scope—although it''s not quite
    advanced as “full-blown” computer languages. In the shell, local variables are
    only accessible by the current shell. Global variables are accessible by child
    shells.


    The shell recognizes the $ character as an indicator that variable substitution
    needs to take place. When the shell sees a $ and a variable name, both are replaced
    with the variable value. $(VARIABLE), $(VARIABLE:-DEFAULT), $(VARIABLE:=DEFAULT),
    $(VARIABLE:+VALUE), $(VARIABLE), and $(VARIABLE?=MESSAGE) are all notations that
    provide additional flexibility using variable substitution.


    Variable names that consist only of numbers are reserved by the shell to indicate
    parameters passed to scripts and procedures. When using positions higher than
    9, use curly braces around the variable name. For example, $[13] and $[15].


    The $?, $$, $-$, and !$ variables hold information about processes. <? indicates
    the success or failure of the last command. $$ is the current process id. $- is
    a list of shell options that are turned on'
