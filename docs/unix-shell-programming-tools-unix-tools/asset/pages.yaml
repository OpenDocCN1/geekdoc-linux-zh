  md: "# The groff Command\n\n+   - No table of contents page was included. HTML's\
    \ lack of pagination implies that it can't produce a table of contents.\n\n+ \
    \  - It seemed to take forever for the web browser to load the 3MB document.\n\
    \nI used groff to shrink the report to 800 pages, add a table of contents, and\
    \ automatically print the report upon request. groff neatly solved all of the\
    \ problems and vastly improved the efficiency of the process. Oh, and shrinking\
    \ the report to 800 pages—that saved more than 32 realms of paper!\n\nA full examination\
