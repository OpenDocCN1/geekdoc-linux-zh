  md: 'One of the earlier examples in this chapter needed to run the vi shell command
    inside a child process. Tcl couldn''t run the vi command because of the way that
    subshells are handled—all output is collected and then returned as one unit to
    the called program. However, Tcl can handle running the find shell command just
    fine:


    ```

    set files [ exec "find" "$dir" "$name" "$pattern" ];

    ```


    The output lines from the find command are stored in the files array. Notice that
    each parameter of the find command is enclosed in quotes. This ensures that find
    sees three separate parameters instead of one parameter with three parts.


    Remarkably enough, Tcl handles files in a very compact manner. I say remarkable
    because of Tcl''s tendency towards long function names (for example, string length
    and file isdirectory). The following three lines of code read a whole file into
    memory:


    ```

    set f [ open $file r ];

    set inpBuffer [ read $f ];

    close $f;

    ```


    The first line opens the file in read-only mode. The second line reads the file
    and stores it into the f variable. It is very important to close files as soon
    as possible. This lets the operating system allocate file space and internal memory
    efficiently.


    If you like to write dense code (a lot of function packs onto one line), you might
    be tempted to condense these three lines of code into two:


    ```

    set inpBuffer [ read open $file r ];

    close $f;

    ```


    Can you spot the problem in these lines of code? The close function refers to
    the f variable, but it''s no longer being defined! Therefore, in this case, creating
    dense code doesn''t work.


    The Bash and Perl versions of the replace script are inefficient because they
    rewrite every file they examine. I didn''t mention this issue before, so that
    you could have a chance to figure it out on your own. Tcl makes it easy to eliminate
    this inefficiency because the regsub function returns the number of replacements
    that are'
