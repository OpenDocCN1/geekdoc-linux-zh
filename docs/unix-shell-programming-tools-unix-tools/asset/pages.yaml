  md: '# The cksum Command


    I''ve included the cksum command in this reference chapter because it comes in
    handy when you need to check files or directories for tampering. By determining
    the checksum of a directory or file and comparing it to an old checksum, you can
    tell if the file has been changed.


    cksum reads from STDIN if no filenames are specified on the command line. When
    one or more filenames are specified, cksum displays the checksum, the number of
    bytes in each file, and the filename.


    The first step to using cksum to check for tampering is to create a baseline file:


    ```

    % mkdir /cksum

    % cksum /bin/* > cksum/bin.cksum

    % cat /cksum/bin.cksum

    296704608 2088 /bin/arch

    91932943 62692 /bin/ash

    2817380754 151496 /bin/ash.static

    ```


    Once the baseline file is created, you—at any time in the future—can quickly determine
    any of the checksumed files have changed using this command:


    ```

    % cksum /bin/* | diff - /cksum/bin.cksum

    4c4

    < 890459061 13882 /bin/awk

    ```


    ```

    > 890459061 13882 /bin/awk

    ```


    The output clearly shows that the /bin/awk file has been renamed. All output lines
    that begin with a > character belong to the baseline file. The diff command is
    documented in its own section of this chapter.


    If someone had replaced the awk file with another, the output might look like
    this:


    ```

    % cksum /bin/* | diff - /cksum/bin.cksum

    4c4

    < 2165160898 29 /bin/awk

    ```


    ```

    > 890459061 13882 /bin/awk

    ```


    This output shows that both the contents of the file and its size have been altered.'
  merge: -1
  pgno: 322
