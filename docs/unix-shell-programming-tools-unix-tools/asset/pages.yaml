  md: 'Operators tell Perl which actions to perform at a very low level. Operators
    are combined with variables and function calls to create statements. Statements
    are combined to create functions. And functions are combined to create packages
    or modules.


    In this chapter you learn about decision and loop statements. Both types of statements
    are vital to properly control your program''s logic. Decision statements let you
    choose between two options, while loop statements let repeatedly execute a group
    of statements.


    Perl, like nearly all other computer languages, can manipulate files. The open
    function is used to form a connection between a file handle and a file. The diamond
    operator (<>) is used to read a record. The close function is used to shut down
    the connection between a file handle and a file. The binmode function is briefly
    mentioned as responsible for ensuring that binary data files are read and written
    correctly. The file section also mentions Perl''s file test operators and how
    they are used to determine many things—such as size of a file and whether it is
    read-only.


    Next, a short description of objects and object-oriented programming is presented.
    I hope enough information is presented so you have an understanding of object
    terminology and can read other people''s programs. However, if you need to create
    more than a few small objects, consider reading a book devoted specifically to
    object-oriented programming.


    Object-oriented programming has its own terminology. This terminology lets you
    think of objects in a manner independent of computer language. After describing
    the object or class as a set of properties (information) and methods (functions),
    the class can be programmed using C++, Perl, or Delphi. The programming language
    is relegated to the role of an implementation detail.


    The four big concepts in object-oriented programming are abstraction, encapsulation,
    inheritance, and polymorphism. Abstraction means to isolate the access of a property
    from how it is stored. Encapsulation means that properties and the methods that
    act on are defined together. Inheritance means that one class (the child) can
    be derived from another (the parent), and the child class will have all the properties
    and methods defined in the parent. Polymorphism means that the child class can
    override properties'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# Summary


    and methods defined in the parent simply by using the same property or method
    name.


    The chapter shows you how to initialize properties by passing values to an object''s
    new function. With this technique, you can use named parameters and therefore
    create partly initialized objects needed. Classes in Perl will not automatically
    inherit properties from parent classes. However, using anonymous hashes totally
    avoids this issue because the parent constructor can be explicitly called to create
    the object. Then, the child can simply add entries to the anonymous hash.


    Last, modules are mentioned. Modules are used to group a set of functions and
    variables together. You read about several guidelines that should be followed
    when creating modules. For example, package names should have their first letter
    capitalized and use file extensions of pm.


    Modules are loaded with the use directive. In addition to loading the module,
    use moves variable and function names into the main namespace where your script
    can easily access them. Exporting names is accomplished using the @EXPORT and
    @EXPORT_OK arrays.


    You also read about the BEGIN and END blocks, which are module constructors and
    destructors. The BEGIN block is evaluated as soon as it is defined. END blocks
    are evaluated just before your program ends—in reverse order. The last END block
    defined is the first to be evaluated.


    The use directive controls others directives, called pragmas. The most useful
    pragmas are integer and strict. Use the integer pragma when you need fast integer
    math. And use strict all of the time to enforce good programming habits—like local
    variables.


    One chapter isn''t sufficient to introduce you to Perl in any meaningful way.
    Still, you''ve now been exposed to most of Perl''s features and syntax. If you
    need to become proficient in Perl, please continue your research using the Internet.
    You might start with Chapter 7, the next chapter,which introduces you to Tcl.
    This relatively new language has been rapidly growing in popularity. Chapter 7,
    "Using Tcl", covers the basics of functions, file handling, and other important
    features of the language.'
