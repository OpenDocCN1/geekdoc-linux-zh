  md: '# Turning on Warnings


    Perl stratifies its warning messages into several different

    “levels,” as shown in Table 11.1, below.


    TIP

    ALWAYS USE THE -w OPTION! I can''t emphasize this point enough.

    In fact, I''ve gotten in the habit of using #!usr/bin/perl -w as the first

    line of every Perl script that I write—no matter how small or large.


    # Table 11.1 The Different Levels of Perl''s Error Messages


    | Code | Description |

    |---|---|

    | (W) | A warning message, not printed unless Perl is invoked with the -w switch.
    |

    | (D) | A deprecation, not printed unless Perl is invoked with the -w switch.
    (A deprecation marks something that was supported in an old version of Perl that
    is being phased out in modern and “official” Perl.) |

    | (S) | A severe warning message, which will always be printed. |

    | (F) | A fatal warning, which will always be printed and will cause your script
    to fail. |

    | (P) | A panic warning, which suggests something wrong is going on inside Perl.
    In theory, you’ll never see a panic warning. |

    | (X) | A fatal warning, which will always be printed. |

    | (A) | An alien message, generated by another program. For example, an error
    message generated by Bash or tclsh if you generate an error in a backtracked command.
    |


    Perl''s optional warnings can tell you a lot about what''s happening in a malfunctioning
    script. For example, let''s take another look at the do-nothing script from the
    last section:


    ```

    % perl -e ''$x = 1; print $X''

    ```'
