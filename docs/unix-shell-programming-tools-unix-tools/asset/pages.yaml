  md: '# The grep Command


    % grep "male" grep1.dat

    Mindy Female Wife

    Rachel Female Daughter

    Sara Female Daughter


    It is the result that you were expected? Probably not. grep found exactly what
    we asked for—the lines matching the lowercase text male. What we really want is
    for the grep command to ignore the case and intelligently look for the word male,
    like this:


    ```

    % grep --ignore-case "<male\> grep1.dat

    Paul Male Husband

    ```


    The --ignore-case option forces grep to ignore the case of both the pattern and
    the input file. The \< and \>slash sequences match the beginning and end of a
    word, respectively.


    Because humans can only be male or female, you can use the --revert-match to find
    all of the females listed in the grep1.dat file:


    ```

    % grep --revert-match "<male\> grep1.dat

    Mindy Female Wife

    Rachel Female Daughter

    Sara Female Daughter

    ```


    If we assume that the first-born child is always listed after the wife in the
    first-file, you can extract the name of the first-born child like this:


    ```

    % grep --ignore-case --after-context=1 "wife" grep1.dat \ \

    > grep --ignore-case "son|daughter" \ \

    > cut -d"" -fl

    ```


    Rachel


    This example uses two grep commands linked together by a pipe. The first grep
    command filters the input file, so that only the lines containing the wife’s name
    and the line following it are left. The second grep command filters the file even
    more, so that only the lines with either the text "son" or the text "daughter"
    are left. Finally, the cut command displays the first column.


    The --count option comes in handy at times. It counts the number of lines that
    match the pattern or, when used with --revert-match, counts the number of lines
    that don''t contain the pattern. The following example shows how many men are
    listed in grep1.dat:'
