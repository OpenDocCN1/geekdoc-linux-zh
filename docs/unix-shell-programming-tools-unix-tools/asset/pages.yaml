    ```


    Synopsis:


    Used to shift position variables.


    The shift command adjusts the positional variables so that the value of $3 is
    assigned to $2 is assigned to $1. This ripple effect affects any positional variables
    that are defined when the shift command executes. The shift command is often used
    to check parameters of procedures for specific values—such as setting flag variables
    for options.


    The section “The Shift Command” in chapter 3, “Procedures,” has more detailed
    information.


