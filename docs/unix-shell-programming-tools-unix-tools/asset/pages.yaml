  md: '# Using Files


    is equivalent to one line. Unless you specify a different variable, the input
    record is placed into $$.


    > Perl uses the $_ as a scratchpad variable. Many functions use the $_ as the
    default variable to check for input or to store output.


    # Reading From Files


    Perl seems to be expressly designed for record-based I/O. The $/ variable holds
    the end-of-record delimiter—usually ''\n''. The following example shows how to
    read and display each line of a file.


    ```

    open(INPUT, "demo.dat")

    or die "Unable to open the demo file.";

    print $_ while <INPUT>;

    close(INPUT);

    ```


    In this four-line example, the file is handled by INPUT. The < character is used
    to indicate that you want to read from the file. Because the default action is
    to open for reading, the < character is optional. The second line is a continuation
    of the open statement. If an error occurs while the file is being opened, the
    die function is executed—the text message is displayed and the script ends. The
    third line is a loop statement. The print clause is repeatedly executed as long
    as another line (or record) can be read from the input file. After the file has
    been processed, the close statement shuts down the connection between the file
    handle and the file.


    > Note that the record delimiter (the newline character) is not stripped from
    the input records. Use the chomp function if you need to remove the delimiter.


    # Writing to Files


    When opening files for writing, the > character is used to indicate that you want
    to write to the file. The print function is used to send the information to the
    file—simply add the file handle to the print statement. The following example
    creates the new.dat file by copying the demo.dat file.'
