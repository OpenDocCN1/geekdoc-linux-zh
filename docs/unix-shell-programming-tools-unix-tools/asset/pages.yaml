- img_proc: true
  md: 'Perl came into widespread usage mainly for its ability to quickly create system
    utilities and for its use on web servers to create dynamic web pages. However,
    its use has grown far beyond that limited scope. Today, programmers are using
    Perl to access databases, create or process XML, and work in many other areas
    too numerous to mention.



    Perl has evolved quite a bit since Larry Wall created it in 1986. In its first
    incarnation, Perl was used as a utility to print reports. Larry Wall wrote the
    first Perl interpreter using a Unix-based C compiler. In some ways, Perl has never
    outgrown its Unix origins. However, the Perl community has labored miserably in
    order to port Perl to many computer platforms. You can find Perl running under
    nearly every flavor of Unix as well as Windows 95 and Windows NT.


    Perl seems to have an infinite number of uses. I''ve used it to automate the creation
    of tables of contents for my web site. A friend of mine uses Perl to analyze Radius
    (a user authentication server) scripts. Because of Perl''s many built-in functions
    and its built-in pattern matching, it is ideal for quick, one-shot programs and
    reports.


    On the other hand, Perl''s object-oriented features and its ability to limit the
    scope of variables makes it ideal for robust, long-term programs.


    Most of Perl''s features work the same on the various Unix and Windows operating
    systems. The only time you''ll have a problem with portability is if you''re forking
    processes or using the timeout feature for sockets under Unix. Perl for Windows
    doesn''t have those Unix-based features.


    After you read this chapter, you''ll be able to identify the components of a Perl
    program. If you''re already a programmer or have a little programming experience,
    you''ll be able to create your own Perl programs with no trouble.


    If you need to have additional information about Perl after reading this chapter,
    you can turn to the Perl Usenet newsgroups—comp.lang.perl and comp.lang.perl.misc.—or
    read the online version of my Perl introductory book, "Perl 5 by Example," at
    http://www.affy.com/p5be.'
  merge: -1
  pgno: 149
- img_proc: true
  md: '# The Features of Perl


    Even if you don''t create your own Perl scripts from scratch, you might need to
    modify someone else''s. This section will familiarize you with Perl''s features,
    giving you the bird''s eye of the language.


    Completeness—Perl has all the elements of a modern computer language. There are
    variables, decision statements, control state-loops, and functions. It also allows
    you to manipulate files and access information directories.


    File I/O—You can use Perl to open files, read and write refor-mation, and close
    files. You can read or write information charac-ter by character or record by
    record.


    Pattern Matching—There are few computer languages that have built-in pattern matching.
    Pattern matching is used to search for patterns of characters in strings. For
    example, you might need to find all customers named "John" in a database. The
    first step to performing the search is creating a pattern or regular expression
    defining the characters you''re looking for. In this case, the regular expression
    is /^John/. The ^ character matches start at the beginning of the string and the
    i means that the case of the string should be ignored. The ^ character is known
    as a metachar-acters and modifiers. The i is a regular expression modifier. Perl
    has many add-tional metacharacters and modifiers. They are covered in more detail
    in Chapter 8, "Pattern Matching."


    Reports—Perl has the ability to create simple reports. You define the report format
    and specify what information should be used. Perl handles the hard work of pagination
    and information alignment.


    References—Perl uses references to hold the memory locations of variables. They
    are mostly used to pass information to subrout-ines and to create data structures
    in memory.'
  merge: -1
  pgno: 150
- img_proc: true
  md: 'Objects—Objects group data and subroutines together. The data describes the
    objects (size, price, quantity), and the sub-routines act on the data. For example,
    if you have an inventory item object, you need subroutines to change the quantity
    on hand and an item''s price.


    Modules—Modules are used to physically separate subroutines and data into different
    files. The module file has a extension of pm. Often, modules are object-oriented
    and each object is defined in a separate module.


    Debugger—When you are trying to understand the behavior of Perl code or you are
    tracking a bug, Perl''s built-in debugger can come in handy. The debugger lets
    you control the execution of your Perl script.


    Command-line Options—When you run the Perl interpreter from the command line,
    you can specify any different options to change its behavior. the -c option tells
    Perl to only check for syntax errors, not to execute the script.


    Perl has many features that are not available in the shell. Perl can do everything
    the shell can. In some ways, Perl can be thought of as a super-shell.


    As much as I''d like to discuss all aspects of Perl, this book covers programming
    and Perl is just one aspect of that topic. Therefore, some topics to Perl aren''t
    discussed in this chapter. One important topic left out is reports. If you need
    to know more about Perl, take a look at http://www.perl.org.


    # Introduction to Perl


    The Perl syntax will grow on, if you let it. Don''t assume so quickly that familiar
    words have entirely different meanings just because you know Perl is a programming
    language. Trust your instincts. This chapter describes the features of Perl using
    language wherever possible. Words that are special to Perl or that are computer-related
    are italicized the first time they are used.


    This chapter assumes that Perl is already installed on your system. You can check
    to see if Perl is installed and find out what version is installed using the perl
    -v command. If Perl is installed, the response should look similar to this:'
