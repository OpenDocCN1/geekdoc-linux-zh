    Chapter 8 covers many aspects of pattern matching. However, the grep command does
    have some unique named classes of characters:


    +   - \w—matches one alphanumeric character.

    - \W—matches one non-alphanumeric character.

    - [[:num:]]-matches one alphanumeric character.

    - [[:alpha:]]-matches one alphabetic character.

    - [[:cntrl:]]-matches one control character.

    - [[:digit:]]-matches one numeric character.

    - [[:graph:]]-matches one graph character.

    - [[:lower:]]-matches one lowercase letter.

    - [[:print:]]-matches one printable character.

    - [[:punct:]]-matches one punctuation character.'
