  md: "# Using Files\n\nTcl offers basic support for reading from and writing to files\
    \ and other kinds of text streams, such as pipelines. Tcl is not quite as slick\
    \ as Perl in this particular department, but it gets the job done.\n\n# Reading\
    \ From Files\n\nThere are three essential steps in reading from a file in Tcl:\n\
    \n+   1. Open the file with the **open** command.\n\n+   2. Read a line from the\
    \ file with **gets**, or read a fixed number of bytes with **read**. (Repeat this\
    \ step as necessary to work through the file.)\n\n+   3. Close the file with **close**.\n\
    \nWhen you use Tcl's **open** command, it returns a unique ID code for the file;\
    \ you'll need this code for reading from the file and to close the file. It's\
    \ a standard Tcl idiom to store the ID code in a variable with a name *myStream*\
    \ or *myFile*:\n\n```\n$ set myFile [open myfile.txt]\n```\n\nTo read a line of\
    \ code from the current file and put it in a variable *line*, you use the **gets**\
    \ command, like so:\n\n```\n% gets $myFile line\nThis is the first line of myfile.txt\n\
    ```\n\nTypically, you'll want to loop through each line of the file, using the\
    \ **eof** command to test whether or not you've reached the end of the file. The\
    \ following code loops through a file and prints it out, line by line:\n\n```\n\
    while {[eof $myFile] {\n  gets $myFile line\n  puts $line\n}\n```\n\nFinally,\
    \ you'll want to close the file with the close command, like so:\n\n```\nclose\
    \ $myFile\n```"
  merge: -1
  pgno: 248
