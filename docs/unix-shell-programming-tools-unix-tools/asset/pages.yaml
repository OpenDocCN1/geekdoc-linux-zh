  md: '(see the set command entry in Chapter 9, “Examining the Tools”).nAnd $! is
    the process id of the last executed background process.


    There are three types of quotes used by the shell: double quotes, single quotes,
    and backticks. In general, quoting is a means of turning off the special meaning
    of characters. For example, the : character typically indicates that a new command
    is starting. However, inside quotes the : character has no special meaning. Backticks
    tell the shell to execute the command inside the backticks and substitute the
    command output for the backticked text.


    The shell does understand a limited number of operators, as shown in Table 2.2.
    When using them, you need to surround expressions with the [] or $(()) notation
    and the expression should be assigned to some variable, otherwise the shell executes
    the resulting value as a command.


    Table 2.6 lists the standard shell variables, of which there are quite a few.
    Not too many of them are directly related to shell programming, however, so you
    don''t need to learn the entire list right away.


    The declare, export, let, local, readonly, set, shift, typeset, and unset commands
    work with variables. Although the declare command can create both global and read-only
    variables, it might help script readability if you use the more specific export
    and readonly commands.


    The next chapter, “Procedures,” shows you how to create your own commands.'
