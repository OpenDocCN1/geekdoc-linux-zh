  md: '# Debugging Techniques


    The command lines displayed by the set +x command have all variables and all file
    wildcards expanded. This feature helps track down problems in wildcard expansion—you
    can make sure that the filename you need to refer to is in the list.


    ```

    % ls *.dat

    + ls fl.dat input.dat xargs.dat

    fl.dat xargs.dat

    ```


    Although the “Generic Debugging” section discusses the importance of using display
    statements when debugging, this technique is so essential that it bears repeated
    mention here.


    Many Bash commands are dangerous, even seemingly innocuous one like chown. Changing
    the owner associated with a file doesn''t seem like a major problem. Usually,
    it''s not. However, when you accidentally change the owner of a system file, all
    of a sudden you might not be able to login to your system or start it up after
    a shutdown.


    Because of the danger involved, I highly recommend using the echo command to give
    yourself a chance to catch typing errors when executing potentially dangerous
    commands—especially when you are using the root user account.


    Let me give you a good example of why you might want to use the echo command.
    Perhaps you need to remove all of the files beginning with a period from the current
    directory. You''d use rm .*, right? Wrong. Here''s why:


    ```

    % echo rm *

    ls ..Xdefaults .bash_history

    bash_logout .bash_profile .bashrc

    ```


    See those two periods displayed as the second file in the expanded list of files?
    Those two periods mean the parent directory. And if you had executed rm .* for
    real, a disaster might have happened.


    # Perl Debugging


    When you''re debugging Perl scripts, one of the most valuable tools at your disposal
    is the -w switch. You can also use the strict module.'
