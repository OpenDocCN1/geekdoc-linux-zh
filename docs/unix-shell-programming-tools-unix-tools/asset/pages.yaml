  md: "# Table 7.4 Tcl’s Operators (Cont’d)\n\n| Operator | Description |\n| --- |\
    \ --- |\n| ?: | The ternary conditional operator chooses between two values based\
    \ on the evaluation of a conditional expression. For example, $numBooks < 5000\
    \ ? \"Small Library\" : \"Big Library\" evaluates to \"Small Library\" only if\
    \ the value of the $numBooks variable is less than 5000. Otherwise, the evaluation\
    \ results in \"Big Library\". |\n\n# Writing Procedures\n\nIf Tcl doesn’t supply\
    \ a built-in command to perform a particular function, you can write your own\
    \ procedure to handle it. Breaking down your script into procedures makes it easier\
    \ to develop your program and makes it easier for you (someone else) to alter\
    \ or debug your script.\n\nFor example, let’s say you’re writing a little script\
    \ that calculates hex numbers from RGB color values: You want the user to type\
    \ in the RGB value, such as (51, 102, 102), and have the script return the hex\
    \ value #336666, so you can plug the hex value into an HTML document in the expected\
    \ format. It makes sense to break out the actual calculation into a separate procedure.\
    \ Let’s call the new procedure rgbToHex. We use the proc command to define the\
    \ new procedure, like so:\n\n```\nrgbToHex args {\n    set hexValue \\\n    foreach\
    \ x $args {\n        append hexValue [format %02x $x]\n    }\n    return $hexValue\n\
    }\n```\n\nNotice that the procedure doesn’t read the RGB specification from the\
    \ command prompt, or do any error checking to make sure that the RGB specification\
    \ is in the right format; it simply calculates the value and spits it out. That’s\
    \ the way procedures should work in Tcl (and in every language, for that matter).\
    \ A procedure does one thing, and it does it well."
  merge: -1
