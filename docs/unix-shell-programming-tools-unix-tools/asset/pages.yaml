  md: '# Table 6.3 Perl Functions by Name (Cont''d)


    | Function | Description |

    | --- | --- |

    | bind | Binds a network address to the socket handle. |

    | binmode | On systems that distinguish between text and binary files (like Windows
    95 and Windows NT), this function forces binary mode treatment of a file. |

    | bless | Changes the type of the referenced variable to a new type—used for object-oriented
    programming. |

    | caller | Returns true, if the current code has been called as a subroutine.
    Returns details, in an array context, of the calling context comprising the package
    name, filename, and line of the call. |

    | chdir | Changes the current directory to the directory specified. |

    | chmod | Changes file permissions on Unix operating systems. |

    | chomp | Removes characters at end of a string if they equal the value of the
    $/ variable—which is usually the newline character. If the $/ variable contains
    more than one character, all of those characters are removed. |

    | chop | Removes the last character from a string and returns it. |

    | chown | Changes the ownership of files. |

    | chr | Returns the ASCII character of the specified number. |

