- img_proc: true
  md: '# Script Execution Commands


    This chapter discusses commands that let you control the execution of your script.
    So far in this book you''ve mostly seen shell scripts that execute sequentially,
    top to bottom. While you''ll have occasion to use sequential scripts, most of
    the time you''ll need more flexibility. The commands in this chapter provide the
    ability to test return values of procedures and commands and to execute statement
    blocks more than once. You''ll also see how to trap signals and leave scripts
    at will instead of only at the end of the script file.


    63'
  merge: -1
  pgno: 84
- img_proc: true
  md: 'Script flexibility, or control, is provided by the commands listed in Table
    4.1. These commands let you make decisions, repeatedly execute a block of commands
    (also called looping), and control your scripts in other ways.


    # Table 4.1 Commands for Controlling Script Execution


    | Command | Description |

    | --- | --- |

    | break | The **break** command leaves the current command block. |

    | case | The **case** command is an alternative to the *if* statement. It is normally
    used when you need to make a decision based on a variable that has many possible
    values. |

    | continue | The **continue** command skips the remaining commands in a command
    block. It''s used in conjunction with the **for**, **while**, and **until** commands.
    |

    | exit | The **exit** command forces a script to end. It is very useful when error
    conditions are detected. |

    | for | The **for** command iterates over a set (or list) of values, executing
    a specific block of statements for each value in the list. |

    | if | The **if** command lets you decide on one or more courses of action. |

    | trap | The **trap** command lets your script intercept signals and act on them.
    If your script does something particularly critical, you might want to trap certain
    signals to avoid interruptions. The **trap** command is also used for running
    "cleanup" commands just before the script exits. |

    | until | The **until** command repeatedly executes a command block until a test
    succeeds (returns a zero). |

    | while | The **while** command, like the **until** command, repeats a command
    block. However, instead of stopping when the test succeeds, it stops when the
    test fails (i.e., returns non-zero). |


    **CAUTION** In order to avoid confusing readers of your shell scripts (or yourself!),
    try to pick variable and procedure names that aren''t similar to shell commands.'
  merge: -1
  pgno: 85
- img_proc: true
  md: 'The rest of this chapter discusses the commands in more detail. First, the
    exit and trap commands are discussed. Then, decision-making-commands are discussed.
    Next, looping commands are explained. Finally, the chapter closes with the jump
    commands—break and continue.


    # The exit Command


    Syntax:


    ```

    exit [n]

    ```


    Synopsis:


    Forces a script to end, returning the value of n to the calling process.


    The exit command lets you communicate—in a limited way—between two scripts. It
    is used to assign an exit value for one script that can be evaluated in the other.
    Let''s look at how this can be accomplished with the following three small scripts.


    Listing 4.1 shows the success script. When run, it simply exits with a zero value,
    which is the standard success indicator.


    **Listing 4.1** success—A Command that Always Returns the Value for Success


    ```

    #!/bin/bash


    exit 0

    ```


    Listing 4.2 shows the failure script. When run, it simply exits with a value of
    one, which is the standard failure indicator. Actually, any non-zero value signifies
    failure. Some programs assign specific meanings to different non-zero values.


    **Listing 4.2** failure—A Command that Always Returns the Value for Failure


    ```

    #!/bin/bash


    exit 1

    ```'
