  md: "# 416\n\n# Chapter 10 / Portability Issues\n\nLet's develop a script to see\
    \ how we might port a simple CGI script written in Bash into Perl or Tcl. If you're\
    \ not familiar with CGI, don't worry. The discussion is focused on the low-level\
    \ mechanics of the three languages. The higher-level concepts of CGI and HTML\
    \ are ignored.\n\nCGI stands for Common Gateway Interface—the protocol used by\
    \ web servers to communicate information to programs running on the server machine.\
    \ Here's a quick synopsis: In order to communicate with the CGI program, the web\
    \ server creates a group of exported environment variables, then the CGI program\
    \ reads the environment variables as needed and generates a file (i.e., writes\
    \ to STDOUT) that the web server sends to the web client (generally a web browser\
    \ like Netscape).\n\n# NOTE\n\nThe script we'll work on was developed to provide\
    \ a quick-and-dirty filter for a web-based threaded discussion board. It will\
    \ create a web page that only contains the latest messages.\n\nBefore we jump\
    \ into the script, let's quickly review the discussion board application. The\
    \ board simulates a graphical news reader, organizing posts to the board by topic,\
    \ like so:\n\n+   * dates - Jen 5/08/98 (1)\n  o Re: dates - tim 5/09/98 (0)\n\
    \  * And then there's boulder - Dan 5/07/98 (1)\n  o Re: And then there's boulder\
    \ - tim 5/07/98 (0)\n  * Hows about Eugene - Dan Talayco 5/07/98 (0)\n  * RV rental\
    \ - tim 5/03/98 (0)\n  * driveways - tim 5/02/98 (2)\n  o Re: driveways - Christine\
    \ 5/11/98 (1)\n  + Re: driveways - tim 5/11/98 (0)\n\nThese dates are shown in\
    \ month, day, year.\n\nAs you can see, new entries don't necessarily appear at\
    \ the top of the board; sometimes they appear in the middle (the last two entries,\
    \ shown in bold, are also the newest). Because the new posts are not marked, they\
    \ can be a little hard to spot. And that is a usability problem. Most people only\
    \ want to see the newest messages.\n\nTo solve this problem, we can write a script\
    \ that reads through the HTML file that contains the entries and extracts only\
    \ the lines that contain the current date, displaying any such new posts in its\
    \ own web page. The basic approach uses the following steps:"
