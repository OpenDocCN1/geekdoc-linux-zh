  md: '# The Binding Operators (=~ and !~)


    # Table 8.9 The Pattern Component Order of Precedence


    | Precedence Level | Component |

    |---|---|

    | 1 | Parentheses |

    | 2 | Quantifiers |

    | 3 | Sequences and anchors |

    | 4 | Alternation |


    You can use parentheses to affect the order in which components are evaluated
    because they have the highest precedence. However, unless you use the extended
    syntax, you are affecting pattern memory.


    TIP


    # Extension Syntax


    The regular expression extensions are a way to significantly add the power of
    patterns without adding a lot of metacharacters to the proliferation that already
    exists. If you use the basic (?...) notation, you can greatly extend the regular
    expression capabilities.

    At this time, Perl recognizes five extensions. These vary widely in functionality—from
    adding comments to setting options. Table 8.10 lists the extensions and gives
    a short description of each.


    # Table 8.10 Five Extension Components


    | Extension | Description |

    |---|---|

    | # TEXT | This extension lets you add comments to your regular expression. The
    TEXT value is ignored. |

    | (...) | This extension lets you add parentheses to your regular expression without
    causing a pattern memory position to be used. |

    | (=...) | This extension lets you match values without including them in the
    $& variable. |

    | (!...) | This extension lets you specify what should not follow your pattern.
    For example, /blue(?!bird)/ means that bluebox and bluesary are matched, but not
    bluebird. |'
