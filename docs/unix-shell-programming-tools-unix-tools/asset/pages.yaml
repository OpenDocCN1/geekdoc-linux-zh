    # The Assignment Operators


    The basic assignment has already been used in many previous examples in this chapter.
    It simply places the value of the expression on the right side of the equal sign
    into the variable on the left side of the equal sign.


    The shell also has shortcut assignment operators that combine the basic assignment
    operator with another operator. For example, instead of saying let $count = $count
    + $change you could say let $count += $change. The advantage of using shortcut
    operators—besidesides having less characters to type—is that your intentions regarding
    assignment are more clearer.


    # Expression Substitution


    In the last section, you use the [] notation to evaluate expressions. You can
    also use $(()) to evaluate expressions. But I prefer to use $[] because it has
    fewer characters and seems less confusing.


    All shell expression evaluation is done using integers. The divide by zero error
    is the only math error that is trapped. A divide by zero error message looks like
    this:


    ```

    $ echo $[ 12 / 0 ]

    bash: 12 / 0 : division by 0 (remainder of expression is")

    ```'
