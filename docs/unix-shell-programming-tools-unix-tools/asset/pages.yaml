  md: "# Using Backicked Strings\n\nPerl sends backicked strings to the operating\
    \ system for execution. You can use variable interpolation within backicked strings.\
    \ If you assign a backicked string to an array, the elements of the array will\
    \ contain the output from the string's execution. For example,\n\n```\n$directory\
    \ = `/usr/bin/';\n```\n\n# Get the output of the $ls command.\n\n```\n@output\
    \ = `ls $directory`;\n```\n\n# Iterate over the @output array and print\n# each\
    \ element.\n\n```\nforeach (@output) {\n  print;\n}\n```\n\nThis code snippet\
    \ displays the output of the ls command. The first line of output is assigned\
    \ to $output[0]. The last line of output is assigned to $output[-1]. The @output\
    \ array has as many elements as there are lines of output from the ls command.\n\
    \nThe foreach statement iterates over the list of elements in @output and prints\
    \ each one. When no temporary variable name is specified in the foreach statement,\
    \ \\$_ is used. It just so happens that the print function displays the \\$\\\
    _ variable as the default when nothing else is specified.\n\nEach output line\
    \ is displayed on a separate line of your monitor because the newline character\
    \ is preserved when the output of the ls command is stored in the array elements.\
    \ Use the chop function to remove the newline character if you don't need it.\n\
    \n# Using Statements\n\nPerl interprets script files starting with the first line\
    \ and executes them sequentially until some decision or condition statement forces\
    \ the execution path to change. A Perl statement is a logical unit of work. Statements\
    \ can span multiple physical lines in your script file. For example:\n\n```\n\
    #!/usr/bin/perl\nif ($title eq \"Perl\") { print \"The title is Perl.\\n\"; }\n\
    ```"
  merge: -1
