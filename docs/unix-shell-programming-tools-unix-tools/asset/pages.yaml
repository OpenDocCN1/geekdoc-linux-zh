    # Bash


    The Bash section shows you how pattern matching can be used to search for filenames.
    Table 8.1 lists the meaning for the ?, *, [], and () metacharacters. The shell
    interprets these metacharacters before any applications see them unless they are
    prefixed with a backslash or are placed inside single quotes.


    Bash also has some little-used pattern matching available for use with variables,
    as shown in Table 8.2. The patterns let you prune the beginning or end of a variable''s
    value. This ability might be valuable when you only need the first or last part
    of a string.


    The case command uses filename metacharacters to determine which command block
    to execute.


    And, finally, metacharacters can be used with the for command to create a list
    of filenames to iterate over.


    # Perl


    The Perl section introduces you to regular expressions or patterns, regular expression
    operators, and the binding operators. There are three regular expression operators—m//,
    s//, and l!—used to match, substitute, and translate. They use the $ variable
    as the default operand. The binding operators, ~= and ~-, are used to bind the
    regular expression operators to a variable other than $.


    While the slash character is the default pattern delimiter, you can use any character
    in its place. This feature is useful if the pattern you are working contains the
    slash character. If you use an opening bracket or parenthesis as the beginning
    delimiter, the closing bracket or parenthesis as the ending delimiter. Using the
    single quote as the delimiter turns off variable interpolation for the pattern.


    The matching operator has six options: /g, /i, /m, /o, /s, and /x. These options
    are described in Table 8.4. I''ve found that the /x option is very helpful for
    creating maintainable, commented programs. The /g option, used to find all matches
    in a string, is also very useful. And, of course, the capability to create case-insensitive
    patterns using the /i option is crucial in many cases.'
