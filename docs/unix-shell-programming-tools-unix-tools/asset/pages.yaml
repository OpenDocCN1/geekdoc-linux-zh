  md: '# The Features of Tcl


    **Data Structures:** Tcl offers a few simple data structures—simple variables,
    which can hold numbers or strings (transparently converting the format as needed);
    lists, which contain non-indexed sequences of data; and arrays, which contain
    indexed lists of data.


    **File I/O:** Tcl scripts can create and destroy files, read from and write to
    files, and gather basic information about files. It can also process files in
    any size you like—byte by byte, or by line.


    **Pattern Matching:** Tcl has built-in support for regular expressions, which
    makes it a great language for processing text. Pattern matching based on regular
    expressions adds a whole new dimension of flexibility and power to searching operations,
    because you can find *patterns* of characters, rather than linear strings. For
    example, if you''re processing an HTML document, you can use regular expressions
    to find all of the strings that begin with < and with >—i.e., all of the HTML
    tags—in the document.


    **Internet Functionality:** The latest implementation of Tcl (version 8.1) has
    built-in commands to perform basic network operations. For example, with the single
    Tcl command `http_get`, you can download the contents of any web page you specify.


    **Dynamism:** Tcl is a dynamic language—a Tcl script can execute commands that
    the script itself has created *as the script runs*. In other words, a script can
    essentially re-write itself as it interacts with the user.


    As of this writing, version 8.1 is still in alpha testing.

    Error Handling:** Tcl supports throw-catch style error-handling, which makes it
    easy to create scripts that are both robust (i.e., handle unexpected results without
    script failure) and easy to read and modify.


    **Debugging:** Tcl offers some special commands that make it easy to develop and
    debug scripts. For example, you can use Tcl''s *trace* command to execute a set
    of instructions when the value of a particular variable changes, or use the **info**
    command to gain access to information about the state of the Tcl interpreter.


    **Extensibility:** If the need arises, you can write your own Tcl commands in
    C. Extending Tcl allows you to add new features to the language without sacrificing
    Tcl''s basic ease of use. There are plenty of freely available extensions to Tcl,
    including Tcl/Tk (which allows you to build a Windows-style graphic interface
    for your script), *Expect* (which allows your Tcl program to


