- img_proc: true
  md: 'Regardless of how many options are specified, the options are stored in $1
    and $2. Because we know this fact won''t change, that''s a good place to start.
    The following lines of code strip off the endings of $1 and $2, leaving just the
    text before the equals sign. If the variable has no equals sign (and therefore
    is not an option), then the value of $1 and $2 is retained.


    ```

    option1=$${1%%-*}

    option2=$${2%%-*}

    ```


    The ${variable%%pattern} notation expands the pattern and then tries to find the
    longest matching text at the end of the variable''s value. If a match is found,
    the matching text is deleted and the rest of the text is returned.


    In order to see what the option1 variable can be assigned, there are two test
    cases to be worried about—one where $1 contains an option and one where $1 does
    not. The following command-line session performs these tests using the opt variable,
    because the $1 variable can only be used inside shell functions and scripts.


    ```

    % opt="oldtext"

    % echo ${1%%-*}

    oldtext

    % opt="-directory"

    % echo ${1%%-*}

    -d

    ```


    Note that the $1 variable can''t be used on the command line. These tests show
    that the evaluation of ${1%%=*} produces the text that is needed—just the option
    letter. If $1 doesn''t contain an option letter, then comparing $1 to -d or -e
    fails, indicating that no option was specified on the command line.


    Because the -d and -e options are optional, the oldtext and newtext parameters
    might be found in any of positions one through four. There are at least two methods
    you can use to determine which positions are used.


    Let''s look at the easy-to-understand, low-tech method first:


    +   # If there are only two parameters, then

    # oldtext and newtext must be in $1 and $2.'
