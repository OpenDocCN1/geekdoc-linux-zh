  md: 'The $[] notation is very flexible because it can accept numbers using different
    bases, not only decimal and hexadecimal. For example:


    ```

    % echo $[2#10 + 1]

    3

    % echo $[7#10 + 1]

    8

    % echo $[10#8 + 1]

    9

    ```


    You can use this [base#]n notation for any base from 2 to 36. If the [base#] is
    omitted, then base 10 is used.

    The shell also supports the standard 0x and 0X prefixes to indicate hexadecimal
    numbers. For example:


    ```

    % echo $[0x10 + 1]

    17

    ```


