  md: '# Debugging Tools


    If you''re building scripts in Tcl and you''re on the Unix platform, you have
    several options. Although there is no debugger built into the core Tcl distribution,
    there are several freely available extensions to Tcl that provide debugging services.
    One of the most common Tcl-based applications, includes a Tcl interpreter and
    is installed on many Unix systems. There are also many visual debuggers for Tcl
    based on Tcl/Tk, including one called Tuba. (Information about Tuba can be found
    on its web site at http://www.doitnow.com/~iliad/tcl/)


    # Perl


    Perl provides an interactive environment that lets you execute your script''s
    statements one at a time. This environment is called a debugger. If necessary,
    you can display the lines of your script, view or alter variables, and even execute
    entirely new statements.


    You start the debugger by using the -d command-line option. The following line


    ```

    perl -w -d test.pl

    ```


    starts the debugger and loads the script called test.pl. If you want to invoke
    the debugger with no script, you need to perform a small bit of magic, like this:


    ```

    perl -d -e "1";

    ```


    I say this is a bit of magic because this book doesn''t discuss all of the different
    command-line options available for Perl. There are simply too many of them. The
    -e option tells Perl to execute a single Perl statement. If the case is 1;, which
    basically means do nothing, stop the interpreter from looking- for the name of
    a script file on the command line.


    When the debugger starts, your screen should look something like this:


    ```

    Loading DB routines from perl5db.pl version 1

    Emacs support available.

    ```


    Enter h or ''h h'' for help.


    ```

    main::(-e:1): 1:

    DB<1>

    ```'
