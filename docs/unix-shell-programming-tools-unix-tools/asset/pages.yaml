  md: '# Table 11.2 The Debugger Commands (Cont’d)


    | Command | Description |

    | --- | --- |

    | t | Toggles trace mode on and off. Trace mode, when on, displays each trace
    script line as it is being executed. I don’t recommend this option except for
    very short programs, because the lines are displayed so quickly that you won’t
    be able to read them. |

    | /pattern/ | Searches for *pattern* in the currently loaded file. If *pattern*
    is found, the current display line is changed to the line where *pattern* was
    found. |

    | ?pattern/ | Searches backward for *pattern* in the currently loaded file. If
    *pattern* is found, the current display line is changed to the line where *pattern*
    was found. |

    | = | Displays aliases that are currently defined. You can also use it to create
    aliases. See the section “Examples: Creating Command Aliases” later in this chapter
    for more information about aliases and the = command. |

    | COMMAND | Any text that is not recognized as an alias or a debugger command
    is executed as a Perl statement. See the section "Examples: Using the Debugger
    as an Interactive Interpreter" later in this chapter for more information about
    executing Perl statements inside the debugger. |


