- img_proc: true
  md: '# Variables and Operators


    # Variable Substitution


    Replacing a variable''s name with its value.


    For more information about how to use variables inside of quoted strings, see
    the "Bash Quoting Rules" section later in this chapter.


    Now let''s return to the issue of why the echo logfile command doesn''t display
    anything when run from the command line, but displays the log file''s name when
    run inside the script.


    You might recall from Chapter 1 that each script runs inside its own shell—scripts
    are nearly totally enclosed and cut off from other programs except for the files
    that they open. Well, that description is not totally accurate. Each shell, irrespective
    of scripts that might be running, has memory that is devoted to holding information
    about its variables.


    The variable information the shell maintains is called the shell''s "environment."
    The assign_logfile script changes its own environment when the assignment statement
    is made. The first echo logfile command works because it is run from within the
    same environment as the assignment command. The second echo command doesn''t work
    because it is run from the parent shell of the assign_logfile script.


    The parent shell of the assign_logfile script is your login shell, which is also
    called the current shell (i.e., the shell you''re currently interacting with via
    the keyboard).


    You can force a script to affect the environment of the current shell by using
    the source command (which executes all the commands in the script regardless of
    the script file''s permissions). For example:


    ```

    % source assign_logfile          <- execute the file.

    The value of logfile is:               <- the correct value is

    monday.dat                               <- displayed.


    % echo $logfile                          <- the correct value is

    monday.dat                               <- displayed.

    ```'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# Chapter 02 / Variables and Operators


    source


    A command that lets scripts affect the environment of their parent shells.


    # TIP


    Some programmers use the period as a shorthand representation of the source command.
    I feel using a period is prone to misinterpretation and it is too easy to miss
    when reading a script.


    You''ve now seen how to affect the parent shell of a script. What if you need
    to affect a child shell? That''s when the export command comes in handy.


    # export


    A command that lets scripts affect the environment of their children shells.


    Listing 2.2 holds a short script that displays the value of the logfile variable.
    Let''s use it to demonstrate the export command using the script in Listing 2.3.


    # Listing 2.2 display_logfile—Display the Value of the logfile Variable


    ```

    #!/bin/bash

    echo "logfile is $logfile."

    ```


    # Listing 2.3 export_logfile—A Simple Variable Assignment


    ```

    #!/bin/bash


    # The following line is the assignment command.

    logfile="monday.dat"


    # call the display script before using export

    echo "Before Export:"

    ./display_logfile


    # call the display script after export

    echo "After Export:"

    ./display_logfile

    ```'
