  md: 'All options are specified after the last pattern delimiter. For example, if
    you want to ignore the case of the characters in the target string, you can do
    this:


    ```

    $_ = "AAA BBB AAA\"

    print "Found bbb\n" if m/bbb/;

    ```


    This program finds a match even though the pattern uses lowercase and the string
    uses uppercase, because the /i option was used, telling Perl to ignore the case.


    # The Substitution Operator (s///)


    You can replace one pattern with another using the substitution operator (s///).
    It requires two operands, like this:


    ```

    s/a/z/

    ```


    This statement changes the first a in $_ into a z.

    You can use variable substitution with s/// just as you can with the matching
    operator. For example:


    ```

    $needToReplace = "bbb";

    $replacementText = "1234567890";

    $_ = "AAA AAA AAA";

    $result = s/$needToReplace/$replacementText;

    ```


    You can use variable substitution in the replacement pattern as shown here, but
    none of the metacharacters described later in the chapter can be used in the replacement
    pattern.


    This program changes the $_ variable to hold AAA 1234567890 AAA instead of its
    original value, and the $result variable holds 1—the number of substitutions.


    Frequently, the substitution operator is used to remove substrings. For example,
    if you want to remove the bbb sequence of characters from the $_ variable, you
    could do this:


    ```

    s/bbb/

    ```


    By replacing the matched string with nothing, you have effectively deleted it.'
