  md: '# Syntax Errors


    This is also one of the biggest sources of frustration with syntax errors—the
    inexactness of the error messages. Tcl uses lines as command separators, so you
    don''t need to worry about remembering a semicolon to the end of every line. However,
    you do need to worry about putting a command separator at the end of every line.
    Breaking a line of code for legibility''s sake causes the Tcl interpreter to return
    a cryptic error message. Listing 11.3 shows a Tcl script with an incorrect line
    break.


    Tcl syntax errors are rarely exact. Frequently, the error is one or two lines
    before the line number in the message.


    # Listing 11.3 bughunt.tcl—An Incorrect Snippet of Tcl Code


    ```

    set mystring

    "boy, this is really a long string!"

    ```


    Running this script looks like this:


    ```

    % tcl bughunt.tcl

    can''t read "mystring": no such variable

    ```


    Tcl thinks line 1 is a complete instruction and that you are asking for the value
    of the variable *mystring*. Because the *mystring* variable hasn''t been created
    yet, the interpreter can''t return the value of the variable. (Strictly speaking,
    this isn''t a syntax error, because **set mystring** is a legal command, albeit
    not really the command that you had in mind.) And even though it doesn''t warn
    you, the Tcl interpreter also thinks that you intend *boy* as some sort of bizarre
    procedure name, and unless you have created a procedure called *boy* for your
    own nutty reasons, the interpreter will return an error for the second line.


    > If you really need to put a Tcl command on two lines, end the first line with
    a backslash (\)—The Tcl interpreter replaces the \<return> sequence with a space,
    so the line doesn''t end, as far as the interpreter is concerned.


    NOTE


    # Misspelled Words


    Unfortunately, spelling counts in the world of programming. A simple typo set
    can cause Perl or Tcl to return an error. For example:'
