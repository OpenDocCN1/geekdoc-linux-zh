  md: '# 102 Chapter 05 / Controlling the Shell


    error.dat file exists and the noclobber option is turned on, the shell has no
    choice but to ignore the redirection and display the error message on your monitor.
    The second message can be avoided by using the 2>> notation—thereby appending
    to the error.dat file instead of trying to create it.


    The > notation provides an alternative to appending when noclobber has been turned
    on. When the >| notation is used, it overrides the noclobber option, letting you
    overwrite files on an as-needed basis:


    ```

    % set -o noclobber

    % echo "one" > test.dat

    % cat test.dat

    one

    % echo "two" > test.dat

    bash: test.dat: Cannot clobber existing file

    % echo "two" | test.dat

    % cat test.dat

    ```


    If you want to simply ignore a program’s output, redirect the output to the /dev/null
    file. When the program ends, the /dev/null file is closed and automatically deleted.


    > CAUTION When redirecting output to /dev/null you might run out of disk space
    if a program generates a lot of output or runs continuously without stopping.
    The program must end in order for the shell to close the /dev/null file and delete
    it.


    # The Pipe


    As you’ve seen, redirection can be quite handy. The next step beyond redirecting
    from or to a file is to make the output of one program the another. More technically,
    this means making the STDOUT of program A the STDIN of program B. This technique
    is called a pipe.


    Unix programmers use this feature frequently. One advantage of this technique
    is that no temporary files are created, so no cleanup is needed.


    The vertical bar character is used to indicate a pipe. For example,'
  merge: -1
  pgno: 123
- img_proc: true
  md: '# Redirecting Input/Output


    % ls *.dat | sort -r

    c.dat

    b.dat

    a.dat


    The command line connects the output of the ls command to the input of the sort
    command. The -r option of the sort command causes the sort''s lines of input to
    be sorted in reverse order.


    There is no practical limit to the number of pipes used on a command line. If
    you need the list of files in reverse order to be processed again, just tack the
    next command to the end of the line:


    % ls *.dat | sort -r | processing_program


    Each command is executed inside its own child shell. So, if the first program
    changes the environment, those changes don''t affect the second program.


    All of the sub-commands are executed before the exit value of the command is determined.
    Therefore, don''t place commands in the middle of a pipe sequence into the background.


    You can place a ! character in the front of a piped sequence in order to negate
    the exit value. The following example shows what this syntax looks like:


    ```

    % sorted_files=`ls *.dat | sort -r`n% echo $?

    0

    % echo $sorted_files

    c.dat b.dat a.dat

    % sorted_files=`! ls *.dat | sort -r`n% echo $?

    1

    % echo $sorted_files

    c.dat b.dat a.dat

    ```


    Notice that using the ! character does not change the value of the sorted_files
    variable. This might seem strange, until you realize that the value of sorted_files
    comes from the output of the sort and not its exit value. The ! character negates
    the exit value, but doesn''t affect the output of the command.


    One of the more interesting uses of a pipe is to send output to the for command.
    Most programmers use pipes to form con-'
