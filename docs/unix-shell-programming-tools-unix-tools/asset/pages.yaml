    # Pattern Precedence


    Pattern components have an order of precedence just as operators. If you see the
    following pattern:


    ```

    m/(a|b)+/

    ```


    it''s difficult to tell if the pattern should be:


    ```

    m/(a|b)+ # match either the "a" character repeated one # or more times or the
    "b" character repeated # one or more times.

    ```


    or


    ```

    m/a|(b)+ # match either the "a" character or the "b" # character repeated one
    or more times.

    ```


    The order of precedence shown in Table 8.9 is designed to solve problems like
    this. By looking at the table, you can see that quantifiers have a higher precedence
    than alternation. Therefore, the second interpretation is correct.'
