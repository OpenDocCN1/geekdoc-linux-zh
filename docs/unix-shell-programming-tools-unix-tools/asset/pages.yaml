  md: '# Operators


    Here is an example of this script in action:


    ```

    % chmod +x modulus

    ./modulus one two three four five six

    tree six

    ```


    The only tricky part of the modulus script is the test command. The test command
    is fully discussed in Chapter 9, “Examining the Tools,” so it is only briefly
    described here. The expression that needs evaluation, $count % 3, is within the
    [] notation. And the value that the expression should be compared to is on the
    right side of the equals sign. Thus, when count reaches three, the expression
    inside the square brackets evaluates to zero and the echo statement is executed.


    Notice that every third item is printed. By changing the value on the right side
    of the modulus operator, you can affect which items are processed. Changing the
    value to five means that a message will be printed every five items.


    # The Bitwise Operators


    Bitwise operators work at the bit level on two operands. Each bit in the first
    operand is compared to its corresponding bit in the second operand (except for
    the inversion operator that only acts on one operand).


    Table 2.3 provides details about each of the bitwise operators used by the shell.


    # Table 2.3 The Bitwise Operators


    | Operator | Description |

    | --- | --- |

    | ~op1 | The INVERSION operator converts all 1 bits to 0 and all 0 bits to 1 in
    op1. |

    | op1 << op2 | The SHIFT LEFT operator moves the bits to the left op2 bits, discards
    the far bits, and the rightmost bits by a value of 0. Each bitwise move to the
    left effectively multiplies op1 by 2. |'
  merge: -1
  pgno: 56
- img_proc: true
  md: '# Table 2.3 The Bitwise Operators (Cont’d)


    | Operator | Description |

    | --- | --- |

    | op1 >> op2 | The SHIFT RIGHT operator moves the bits in op1 to the right op2,
    discards the far right bits, and assigns the far left bits to a value of 0. Each
    move to the right effectively divides op1 in half. |

    | op1 & op2 | The AND operator compares the corresponding bits in op1 and op2
    and generates, for each bit, a result of 1 if both bits are 1; otherwise it returns
    0. |

    | op1 ^ op2 | The EXCLUSIVE-OR operator compares the corresponding bits in op1
    and op2 and generates, for each bit, a result of 1 if the bits are complementary
    (i.e., not the same); otherwise it returns 0. |

    | op1 | op2 | The OR operator compares the corresponding bits in op1 and op2 and
    generates, for each bit, a result of 1 if either or both bits are 1; otherwise
    it returns 0. |


    # The Logical Operators


    Logical operators allow programs to make decisions based on multiple conditions.
    Each operand is evaluated to a true or false value. Then the true or false values
    of the operands are used to determine the overall value of the expression.


    Table 2.4 lists the four different ways that two operands can be combined using
    the && (AND) operator. You can see that only if both operands are true is the
    result true.


    # Table 2.4 The &&& Result Table


    | Operand1 | Operand2 | Operand1 && Operand2 |

    | --- | --- | --- |

    | 0 | 0 | 0 |

    | 1 | 0 | 0 |

    | 0 | 1 | 0 |

    | 1 | 1 | 1 |'
