  md: '# Table 6.7 Perl''s Special Variables (Cont''d)


    | Variable Name | Description |

    |---|---|n| $ | The output separator for the print() function. Normally, this
    variable is an empty string. However, setting $ to a newline might be useful if
    you need to print each element in the parameter list on a separate line. |

    | \ | Added as an invisible last element to the parameters passed to the print()
    function. Normally an empty string, but if you want to add a newline or other
    suffix to everything that is printed, you can assign the suffix to \ |

    | # | The default format for numbers. Normally, it is set to %.20g, but you can
    use any of the format specifiers mentioned in the section "The printf Command"
    of Chapter 9. |

    | % | Holds the current page number for the default file handle. If you use Perl''s
    select function to change the default file handle, % changes to reflect the page
    number of the newly selected file handle. |

    | = | Holds the current page length for the default file handle. Changing the
    default file handle, using Perl''s select function, changes $% to reflect the
    page length of the new file handle. |

    | - | Holds the number of lines left to print for the default file handle. Changing
    the default handle will change $- to reflect the number of lines left to print
    for the new file handle. |

    | ~ | Holds the name of the default line format for the default file handle. Normally,
    it is equal to the file handle''s name. |

    | ^ | Holds the name of the default heading format for the default file handle.
    Normally, it is equal to the file handle''s name with _TOP appended to it. |

    | $ | If non-zero, flushes the output buffer after every write() or print() function.
    Normally, it is set to zero. |'
