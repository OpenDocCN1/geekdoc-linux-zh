    Character Sequences: A sequence of characters matches the identical sequence in
    the searched string. The characters need to be in the same order in both the pattern
    and the searched string to be true. For example, m/abc/; matches abc but not cab
    or bca. If any character in the sequence is a metacharacter, you need to use the
    backslash to match its literal value.


    Alternation: The alternation metacharacter (l) lets you match more than one possible
    string. For example, m/a|b/; matches if either the a or the b character is in
    the searched string. You can use sequences of more than one character with alternation.
    For example, m/dog|cat/; matches if either of the strings dog or cat is in the
    searched string.


    TIP Some programmers like to enclose the alternation sequence inside parentheses
    to help indicate where the sequence begins and ends. m/(dog|cat)/ However, this
    affects something called pattern memory, which you''ll learn about in the section
    "Pattern Memory" later in the chapter.


