    \ > 9;\nprint \"Green\" unless $color eq 'Red';\n```\n\nUsing these modifiers\
    \ is straightforward. Notice that, by convention, parentheses don't surround the\
    \ conditional expression.\n\n# Loop Statements\n\nPerl has several ways to repeatedly\
    \ evaluate a statement block. You can use the while, do, for and foreach statements.\n\
    \n# Table 6.4 Perl's Loop Statements\n\n| Statement | Description | Example |\n\
    | --- | --- | --- |\n| while | Repeatedly evaluates a statement block as long\
    \ as the condition is true. The statement block is never evaluated if the condition\
    \ is false. | while (condition) { ... } |\n| do | Repeatedly evaluates a statement\
