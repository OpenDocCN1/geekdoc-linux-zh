  md: "# Returning Values From Procedures\n\nThe local command comes handy if you\
    \ create large scripts that contain many procedures. Keeping variable values local\
    \ to a procedure makes them easier to understand because changes in one procedure\
    \ won't affect other procedures.\n\nNOTE\n\n> If you prefer, you don't need to\
    \ use the return() function to return a value, because Bash will automatically\
    \ return the value of the last expression evaluated. I prefer to use the return()\
    \ function and be explicit so that there is no mistaking my intention.\n\nYou\
    \ might have used programming languages that distinguish between functions and\
    \ subroutines. The difference is that a function returns a value and a subroutine\
    \ does not. Bash makes no such distinctions. All procedures, commands, programs,\
    \ and scripts have a return value—even it’s only the default value of success\
    \ (i.e., zero).\n\n# Summary\n\nProcedures are important for every programmer\
    \ to become familiar. When a new Bash procedure is defined, it seems to become\
    \ a part of the shell and is invoked just like any command. The syntax to define\
    \ a procedure is quite simple:\n\n```\nprocName () {\n  |\n```\n\nParameters to\
    \ procedures are stored in the positional parameter variables described in Chapter\
    \ 2, “Variables and Operators.” When a procedure is called, the values of the\
    \ current positional variables are processed, so that the parameters used by the\
    \ procedure don't overwrite their values. Then, when the procedure is finished,\
    \ the original values of the positional variables are restored. The $$ variable\
    \ holds the number of parameters passed to your procedure or script. It is handy\
    \ for iterating over the parameter list."
  merge: -1
  pgno: 81
- img_proc: true
  md: 'The shift command shifts the values of the positional variables down one position.
    So, for example, the value of $3 is assigned to $2 and the value of $2 is assigned
    to $1. shift is another handy tool to use when you need to iterate over the parameter
    list.


    Most shell variables are global in scope, which means that every procedure and
    script can access them. However, you can create local variables (variables only
    accessible inside one procedure) using the local command.


    The last section of the chapter mentions that every command in Bash has a return
    value. You can store return values in variables and test them using the test command
    as discussed in Chapter 9, “Examining the Tools.”


    The next chapter, “Script Execution Commands,” shows how to control what happens
    inside your scripts. Your scripts can be a little more intelligent after you see
    how to handle loops and make decisions.'
