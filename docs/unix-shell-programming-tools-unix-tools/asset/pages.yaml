  md: '# Useful Information, Tips, and Warnings


    This section is devoted to information, tips, and warnings that I can''t fit neatly
    into one of the other sections in this book or that I feel bear repeating.


    One of the important tasks a programmer can undertake involves molding the computing
    environment to better suit their everyday needs. This frequently involves creating
    aliases for commonly used commands. However, it could also involve using commands
    to check disk quotas or automatically connect to remote disks when you log in.


    When Bash starts up, it executes several files so that both system-wide or user-specific
    environment changes can be made. The following files are executed in order:


    +   - /etc/profile—Executed for all login shells.


    +   - ~/.bash_profile or ~/.profile—Executed for all login shells. The profile
    is only executed if the .bash_profile file is not found.


    +   - ~/.bashrc—Executed for interactive non-login shells. For example, if you
    run the :!/bin/bash command inside the vi editor, you start an interactive non-login
    shell.


    +   $ENV—Executed for all shells, if it is set.


    If you are on Unix, consider placing the following lines of code at the start
    of all these files:


    ```

    echo "The $0 file is being executed."

    read    <- highly optional.

    ```


    This technique lets you know exactly which files are being executed and when.
    Every time one of the files is executed, Bash displays the message from the echo
    command and then pauses. As you go about your daily activities, you''ll discover
    exactly when and why the files are called.


    When you log out, Bash executes a file called .bash_logout. This file is a good
    place to put backup and housekeeping routines.


    I like to personalize my login shell by adding the following lines to my ~/.bash_profile
    file:'
