    One of the nice features of groff is that it knows what a page is.

    A page has a height and width and is blank unless text or graphics are printed
    on it. Therefore, groff always creates full pages—which is why the examples have
    so many blank lines. The blank lines pad the output so that it is a full page.


    The .br tag lets you start a new line without also creating a blank line:


    ```

    % groff -Tascii >.out <<EOT

    > This is line one.

    > .br

    > This is line two.

    > EOT

    % cat g.out

    This is line one.

    This is line two.

    ```


    The tag language used by groff is primitive but complete. It even has variables,
    although they are called registers by groff. Register names are one to three letters
    long. For example, the .j register holds the alignment and .ce holds the number
    of lines to be centered. Some of the registers that groff uses are described in
    Table 9.20.


    # Table 9.20 Some of the Registers Used by groff


    | Register | Description |

    | % | Holds the current page number |

    | dw | Holds the day of the week |

    | dy | Holds the day of the month |

    | ln | Holds the current output line number. This number is reset to zero for
    each new page. |

    | mo | Holds the current month |

    | pn | Holds the next page number |'
