  md: "# Using Statements\n\n# Table 6.4 Perl's Loop Statements (Cont'd)\n\n| Statement\
    \ | Description | Example |\n| --- | --- | --- |\n| for | Repeatedly evaluates\
    \ a statement block. Loop termination is typically controlled by a count variable.\
    \ | for (initialization; condition; operation) { ... } |\n| foreach | Evaluates\
    \ a statement block for each element in an array. | foreach (array_var) { ...\
    \ } |\n\nMany of these loop statements perform similar operations. Choosing which\
    \ one to use is a matter of deciding which one best matches your program logic.\n\
    \nThe while statement evaluates the conditional expression before executing the\
    \ statements inside the block. The do statement is guaranteed to execute the statement\
    \ block at least once. Successive loops are controlled by the condition expression.\
    \ do..while loops continue to loop as long as the condition is true. do..until\
    \ loops continue to loop as long as the condition is false.\n\nFor statements\
    \ are a little more complex than while or do statements. For statements are typically\
    \ used to execute a statement block for a specified number of times. The initialization\
    \ clause usually sets the counting variable to zero. The condition clause terminates\
    \ the loop when it evaluates to true. The operation clause usually increments\
    \ or decrements the counting variable.\n\nForeach iterate over the elements of\
    \ an array. Each time the loop is evaluated, another element is assigned to \\\
    $. You can specify another variable name instead of \\$_ like this:\n\n```\nforeach\
    \ $element (@array) {\n  print \"\\$element\\n\";\n}\n```\n\nIn this example,\
    \ each array element is assigned to \\$element before each iteration of the loop.\
    \ The loop is terminated when the last array element is processed."
