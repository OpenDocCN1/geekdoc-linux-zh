    The foreach command iterates over a list of two elements. Therefore, it can be
    used to find the command-line options. Tcl stores the command-line parameters
    in the argv array.


    I feel that, in some ways, Tcl''s regexp function is more programmer-friendly
    than either Bash or Perl, because you can specify variables to hold the matching
    text. The syntax of the regexp function is:


    ```

    regexp pattern target [whole_match] [submatches...]

    ```


    If you specify a third parameter, whatever text is in target that matched the
    whole pattern is stored in the variable named by the pattern. Submatches, created
    using parentheses in pattern, are also optional.


    The replace.tcl script uses the regexp function like this:


    ```

    regexp (^-).(.*)) $parameter temp letter value;

    ```


    The pattern used here is identical to the one used in the replace.pl script, except
    that the dash character needs to be escaped. The parameter variable holds the
    text that gets searched. In this situation, the text matching the whole pattern
    is not important, so it is ignored. The text matching the two sub-matches is stored
    in the letter and value variables, respectively.


    Because the option is readily available in the letter variable, it''s easy to
    test if the d or e option was specified:


    Regular expressions are discussed in Chapter 8, "Pattern Matching."'
