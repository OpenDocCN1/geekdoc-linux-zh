  md: '# Creating Command Lists


    Chapter 1 points out that each shell command is a process. For simplicity''s sake,
    not too much detail is given about processes. However, you need to know more details
    about processes before you can fully understand command lists.


    NOTE


    For the purposes of this chapter, the terms command and process are nearly interchangeable.
    A command list is more than one command combined to form a single command.


    Every command produces an exit value when it stops. A typical successful command
    has an exit value of zero. Any other exit value indicates a failure of some sort.
    You might find it useful to assign exit values to indicate specific problems.
    For example, your scripts could use an exit value of 5 to indicate that an initialization
    file was not found. As an alternative, you could use the values between 200 and
    250 to indicate different types of input errors.


    A command list can use the exit value of one command to control whether or not
    another command is executed. For example, you might not want to begin a backup
    process if an initialization file doesn''t exist.


    Table 5.1 shows the notation used when creating command lists.


    # Table 5.1 The Three Types of Command Lists


    | Notation | Description |

    |---|---|

    | a && b | The *and* list type executes b if and only if a succeeds. This is shorthand
    for: *if a then b*.. |

    | a || b | The *or* list type executes b if and only if a fails. This is shorthand
    for: *if not a then b*. |

    | a ; b | The *sequential* list type simply executes a, then b. The exit value
    of b becomes the exit value for the list. |'
  merge: -1
