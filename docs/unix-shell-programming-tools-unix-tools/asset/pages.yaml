  md: 'Notice when CRTL-C is pressed the script immediately exits. The final echo
    command is not executed.


    Now let''s try Listing 4.4 with the trap command active. Remove

    e # character that you used to comment out the trap line. Here is

    the the script in:


    ```

    % test_sigint

    Type ''a'' to continue, anything else is entered to quit:

    a      <- while "a" is entered, the script loops.

    Type ''a'' to continue, anything else is entered to quit:

    ^C      <- CRTL-C is pressed. And nothing happens.

    w

    Type ''a'' to continue, anything else is entered to quit:

    the end

    The script is done.

    ```


    At this point, you might be wondering what other kinds of sig-

    als you might use. You can find the signal numbers and

    mnemonic names by using the -l option of the trap command:


    ```

    % trap -1

    0) EXIT 1) SIGHUP 2) SIGINT 3) SIGQUIT

    4) SIGILL 5) SIGTRAP 6) SIGIOT 7) SIGBUS

    8) SIGFPE 9) SIGKILL 10) SIGUSRI 11) SIGSEGV

    12) SIGUSR2 13) SIGPIPE 14) SIGALRM 15) SIGTERM

    16) SIGJUNK(16) 17) SIGCHLD 18) SIGCONT 19) SIGSTOP

    20) SIGSTP 21) SIGTTIN 26) SIGTTO 23) SIGURG

    24) SIGCPU 25) SIGXFS 26) SIGVTALRM 27) SIGPROF

    28) SIGWINCH 29) SIGIO 30) SIGPWR 31) SIG-

    UNK(31)

    ```


    Table 4.2 describes each of these signals:


    | Signal Number | Mnemonic Name | Type | Description |

    |---|---|---|---|n| 0 | EXIT | Termination | This signal is received when the
    script exits. |

    | 1 | SIGHILL | Termination | This signal reports that a user''s terminal is disconnected.
    |'
