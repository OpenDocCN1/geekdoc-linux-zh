  md: '# Chapter 05 / Controlling the Shell


    You can redirect input into a program or redirect output from a program. Input
    redirection uses the < file or the << label notation. The < file notation lets
    you substitute the contents of a file for input from the keyboard. The << label
    notation lets you place the required input directly on the command line (and therefore
    directly inside a script).


    Output redirection is done using the > file notation. If the file doesn''t exist
    it is created unless the noclobber variable is set. You can also use the | notation
    to avoid overwriting existing files. The >> file notation is used to append output
    to a file. The 2> file notation lets you redirect output sent to STDERR.


    You can merge any two output streams using m>&n notation. The output going to
    the m file descriptor is merged with the output going to the n file descriptor.


    One of the most important concepts in Unix is the pipe. Pipes are used to connect
    the output of one command to the input of another. Because it''s so easy to link
    two programs, programmers are encouraged to write short, focused programs that
    perform short tasks. Then, using pipes, these programs can be linked together
    to perform larger tasks.


    The read command is discussed next. read takes a line of input from STDIN and
    stores it either into a variable of your choosing or in $REPLY. Optionally, read
    breaks up the input into words and stores the individual words into variables
    that you specify. If you need to delimit words using any character other than
    spaces, tabs, or newlines, you''ll need to set the IFS (short for Internal Field
    Separator) variable. For example, IFS="$IFS!" adds the exclamation point to the
    delimiter list.


    Next, the - file name was introduced. Most Unix commands and programs understand
    that when a dash is used as a file name, it means that STDIN should be read instead
    of a file. This notation is especially useful in pipes when the program on the
    right side of the pipe (the one accepting input) doesn''t normally read from STDIN.


    Unix uses device files to communicate with hardware. For example, if you need
    to interact with the system''s floppy disk, you might use a file /dev/fd0. Some
    other devices are /dev/mouse and /dev/lp0, which allow communication with the
    mouse and printer, respectively.'
