    002 Mario 80000

    003 John 45000

    004 Harry 75000

    005 Dorothy 90000

    006 Jackie

    ```


    If you need to join three files together, first join two files and then join the
    third using a pipe:


    # NOTE


    The dash filename tells a command to read from STDIN instead of a file. Some commands
    normally only read from files. The dash-name lets these commands be used with
    pipes.


    ```

    % join -al jnames.dat jsalaries.dat | \

    > join - jhiredt.dat

    001 Barry 132500 04/12/1989

    002 Mario 80000 06/23/1994

    003 John 45000 12/12/1997

    004 Harry 75000 11/17/1997

    005 Dorothy 90000 02/06/1994

    006 Jackie 07/20/1995

    ```


    Notice that a dash is used in the second join command to indicate the order that
    its first file should be read from STDIN.

    The -o option lets you rearrange the order that the fields display in. For example,
    you can display the hire date and name fields using this command line:


