    Table 6.5 lists all of the available File Test Operators.


    # Table 6.5 Perl''s File Test Operators


    | Operator | Description |

    | - | - |

    | -A OP1 | Returns the access age of a file OP1 when the program is started. |

    | -b OP1 | Returns true if OP1 is a block device. |

    | -B OP1 | Returns true if OP1 is a binary file. If OP1 is a file handle, the
    current buffer is examined, instead of the file itself. |

    | -c OP1 | Returns true if OP1 is a character device. |

    | -C OP1 | Returns the inode change age of OP1 when the program is started. |

    | -d OP1 | Returns true if OP1 is a directory. |

    | -e OP1 | Returns true if OP1 exists. |

    | -f OP1 | Returns true if OP1 is a regular file as opposed to a directory, symbolic
    link, or other type of file. |

    | -g OP1 | Returns true if OP1 has the setgid bit set. |

    | -k OP1 | Returns true if OP1 has the sticky bit set. |

    | -l OP1 | Returns true if OP1 is a symbolic link. Under DOS, this operator will
    always return false. |

    | -M OP1 | Returns the age of OP1, in days, when the program is started. |

    | -o OP1 | Returns true if OP1 is owned by the effective uid. Under DOS, it always
    returns true. |

    | -0 OP1 | Returns true if OP1 is owned by the real uid/gid. Under DOS, it always
    returns true. |

    | -p OP1 | Returns true if OP1 is a named pipe. |

    | -r OP1 | Returns true if OP1 can be read from. |'
