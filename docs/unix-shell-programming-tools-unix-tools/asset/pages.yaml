- img_proc: true
  md: '# The Binding Operators (=~ and !~)


    # Table 8.6 Options for the Translation Operator


    | Option | Description |

    | --- | --- |

    | c | The c option complements the match character list. In other words, the translation
    is done for every character that does not match the character list. |

    | d | The d option deletes any character in the match list that does not have
    a corresponding character in the replacement list. |

    | s | The s option reduces repeated instances of matched characters to a single
    instance of that character. |


    Normally, if the match list is longer than the replacement list, the last character
    in the replacement list is used as the replacement for the extra characters. However,
    when the d option is used, the matched characters are simply deleted.


    If the replacement list is empty, no translation is done. The operator returns
    the number of characters that match, though. This is useful when you need to know
    how often a given letter appears in a string. This feature also can compress repeated
    characters using the s option.


    # The Binding Operators (=~ and !~)


    The search, modify, and translation operations work on the $_ variable by default.
    If the target string is stored in some other variable? That''s where the binding
    operators come into play. They let you bind the regular operators to a variable
    other than $. There are two forms of the binding operator: the regular =~ and
    its complement !~.


    The following small program shows the syntax of the =~ operator:


    ```

    print(\\$match = $match\n");

    print(\\$substitution = $substitution\n");

    ```'
