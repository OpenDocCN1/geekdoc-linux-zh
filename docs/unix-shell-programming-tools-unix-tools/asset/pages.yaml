    Character Classes: Square brackets are used to create character classes. A character
    class is used to match a specific type of character. For example, you can match
    any decimal digit using m/[0123456789]/. This matches a single character in the
    range of zero to nine. You can find more information about character classes in
    the section “Character Classes” later in this chapter.


    Symbolic Character Classes: There are several character classes that are used
    so frequently that they have a symbolic representation. The period metacharacter
    stands for a special character class that matches all characters except the newline.
    The rest are \d, \D, \s, \S, \w, and \W. These are mentioned in Table 8.7 earlier
    and are discussed in the section “Character Classes” later in this chapter.


    Anchors: The caret (^) and the dollar sign ($) metacharacters are used to anchor
    a pattern to the beginning and the end of the searched string. The caret is always
    the first character in the pattern when used as an anchor unless the alternation
    metacharacter is used. For example, m/^one/; only matches if the searched string
    starts with the sequence of characters, one. The dollar sign is always the last
    character in the pattern when used as an anchor. For example, m/(last|end)$/;
    matches only if the searched string ends with either the sequence last or the
    character sequence end. The \A and \Z metasequences are also used as anchors for
    the beginning and end of strings.


    Quantifiers: There are several metacharacters that are devoted to controlling
    how many characters are matched. For example, m/a{5}/; matches that five characters
    must be found before a true result is returned. The *, +, and ? metacharacters
    and the curly braces are all used as quantifiers. See the section “Quantifiers”
    later in this chapter for more information.


    Pattern Memory: Parentheses are used to store matched into buffers for later recall.
    I like to think of this as a form of pattern memory. Some programmers call them
    back-references. After you use m/(fish|fowl)/; to match a string and is found,
    the variable $1 holds either fish or fowl depending on which sequence was matched.
    See the section “Pattern Memory” later in this chapter for more information.


