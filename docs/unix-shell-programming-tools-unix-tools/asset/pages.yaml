  md: '# Table 11.2 The Debugger Commands (Cont''d)


    | Command | Description |

    | --- | --- |

    | T | Prints a stack trace. A stack trace displays a list of function calls and
    the line number where the calls were made. |

    | V | Lists all variables that are currently defined from all packages and modules
    that are loaded. A better form of this command is V PACKAGE or V PACKAGE VARLIST,
    where PACKAGE is the name of a loaded package or module and VARLIST is a currently
    defined variable in PACKAGE. When specifying variable names, do not use the $,
    @, or % type specifiers. |

    | w LINE | Displays about 10 lines centered around LINE. For example, if you use
    w 10, lines 7 to 16 display. |

    | X | Lists all variables in the current package. If you have stepped into a function
    that is in package foo, the variables in package foo are displayed, not those
    in main. You can also specify exactly variables to display if needed. When specifying
    variable names, do not use the $, @, or % type specifiers. |

    | | Displays about 10 lines of your script that are before the current line. For
    example, if the current display line is 30, this command might display lines 19
    to 29. |

    | s | Steps through the lines in your script one at a time and into any user-defined
    function that is called. While single stepping is slow, you see exactly how your
    code is being executed. |

    | n | Executes the next statement in your script. Although all function calls
    are executed, it does not follow the execution path inside a function. This command
    enables you to move quickly through the execution of your script than simply using
    the s command. An example of this is shown in the "Examples: Using the n Command"
    section later in this chapter. |

    | r | Executes the rest of the statements in the current function. The debugger
    pauses for input on the line following the line that made the function call. |'
