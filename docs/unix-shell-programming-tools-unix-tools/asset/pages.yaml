  md: 'Regrettably, Tcl does not have its own debugger. (The Scriptics company is
    planning a final release of its TclPro development environment that should include
    a visual debugger.) However, the freely available (and widely distributed) Expect
    application, which uses Tcl as its scripting language, contains a debugger that
    you can use with your Tcl scripts.


    # TIP


    To make sure you have Expect on your system, type which expect at the shell prompt.
    If Expect is not installed, point your preferred web browser at http://expect.nist.gov
    for more information.


    To debug fl.tcl, invoke Expect using the -D switch with a value of 1:


    ```

    % expect -D 1 fl.tcl 10 fl.dat

    1: if ($argc != 2) exit

    dbg1.0>

    ```


    As you can see, the Expect debugger displays the dbg1.0> prompt. For the record,
    the first 1 in “1.0” shows the level of the stack, and the second 1 is simply
    the number of the current command in the history of the current Expect session.
    You’ll also notice that the first command in the script (the if command) appears
    above the prompt. This is the command that Expect executes next when you ask Expect
    to execute a command. Typing sat at Expect’s debugger prompt executes this command:


    # NOTE


    A stack holds the temporary information that gets passed from caller to callee
    as functions are executed within programs. Each time one function calls another,
    and then that function calls another, the stack gets deeper. As functions end
    and control is returned to the caller, the stack gets shallower.


    ```

    dbg1.0> s

    1: index $argv 0

    dbg1.1>

    ```


    The debugger has executed the if statement, and finding the expression false,
    moved along to the next line. Continue stepping until the prompt says dbg1.3.'
