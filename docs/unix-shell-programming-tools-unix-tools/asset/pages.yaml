  md: "current name to **grep**. Of course, we could make a system call to **grep**\
    \ from Perl, but that would be cheating, and would make our Perl script non-portable\
    \ to Windows or Mac OS environments. Frankly, we can simulate **grep** in a few\
    \ lines of Perl. We simply open up the *messages* file and run through it line\
