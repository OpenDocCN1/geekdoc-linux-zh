- img_proc: true
  md: '# Here is an example of this script in action:


    ```

    % unset logfile

    % chmod +x export_logfile

    % ./export_logfile

    Before Export:

    logfile is

    After Export:

    logfile is monday.dat

    % ./display_logfile

    logfile is

    ```


    Because the second running of the display_logfile script displays the value of
    the logfile variable, you can see the effect of the export command. You can give
    the child script—the second running of display_logfile—access to the logfile variable.
    You can see that the parent script—the login shell—still doesn''t see the logfile
    variable because the display_logfile script, run from the command line, doesn''t
    display a value for logfile.


    The logfile needs to be unset or undefined for this test to work as shown, just
    in case you run the source command earlier in the chapter. If the unset command
    isn''t issued, the logfile variable might be displayed by the display_logfile
    run from the command line.


    # NOTE


    You might be wondering why the source and export commands are needed. Couldn''t
    the various shells be granted access to change their parent and children shells?

    While you think about the answer to this question, remember Unix is multi-threaded
    and runs multiple processes. Can you imagine what would happen if one process
    created 50 children and each of these tried to update a variable in its parent''s
    environment? Which child''s assignment command would have precedence and why?
    These would not be easy questions to answer.


    Let''s take a look at another example using the export command. This time you
    create a variable in the login shell and then try to access it inside a child
    shell.'
