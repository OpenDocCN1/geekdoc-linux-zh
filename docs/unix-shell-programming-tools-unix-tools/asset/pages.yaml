    You can use the following lines as a template for creating your own modules:


    ```

    package Module;

    require(Exporter);

    @ISA = qw(Exporter);

    @EXPORT = qw(funcOne $varOne @variable %variable);

    @EXPORT_OK = qw(funcTwo $varTwo);

    ```


    The names in the @EXPORT array are always available in the main namespace without
    using the :: notation. Those names in @EXPORT_OK are only available if requested
    in the use statement. This small module can be loading into your script using
    this statement:


    ```

    use Module;

    ```


    Since use is a compiler directive, the module is loaded as soon as the compiler
    sees the directive. This means variables and functions from the module are available
    to the rest of your script.


