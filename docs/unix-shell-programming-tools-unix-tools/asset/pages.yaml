  md: '# Chapter 08 / Pattern Matching


    ```

    % echo ${project_code#????} <- display the project name

    2344

    % echo ${project_code%????} <- display the project number

    ```


    The metacharacters after the # or % are expanded to produce a pattern just like
    when they are used for filenames.


    The first example uses four question marks to strip off the first four characters
    of the project code, which results in the project name. The second example removes
    five characters from the end of the variable''s value.


    Table 8.2 shows the four constructs where you can use metacharacters to work with
    variables.


    # **Table 8.2** Metacharacters for Variables


    | Syntax | Meaning |

    |---|---|

    | ${variable#pattern} | This construct expands the pattern and then tries to find
    the shortest matching text at the beginning of the variable''s value. If a match
    is found, the matching text is deleted and the rest of the text is returned. |

    | ${variable##pattern} | This construct expands the pattern and then tries to
    find the longest matching text at the beginning of the variable''s value. If a
    match is found, the matching text is deleted and the rest of the text is returned.
    |

    | ${variable%pattern} | This construct expands the pattern and then tries to find
    the shortest matching text at the end of the variable''s value. If a match is
    found, the matching text is deleted and the rest of the text is returned. |

    | ${variable%%pattern} | This construct expands the pattern and then tries to
    find the longest matching text at the end of the variable''s value. If a match
    is found, the matching text is deleted and the rest of the text is returned. |'
