  md: "So far you've learned about object-oriented terminology and\nhow to create\
    \ an inventory object. Let's take the next step and see\nhow to create a pen object.\
    \ For the purposes of this example, pen\nobjects differ from inventory objects\
    \ by the addition of one prop-\nerty—INK_COLOR.\n\nListing 6.4 shows one way that\
    \ pen objects can be defined. The\npen.pl script builds on the inv.pl script.\
    \ New or changed lines are\nshown in bold.\n\n# Listing 6.4 pen.pl—Creating Pen\
