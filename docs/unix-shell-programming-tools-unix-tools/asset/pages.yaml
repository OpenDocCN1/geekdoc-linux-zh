  md: '# UNIX


    # $ 39.99 U.S.A.


    # Introducing the Most Comprehensive

    IX Shell Programming Kit


    This all-in-one book/CD-ROM package helps you harness the power of the UNIX operating
    system through Bash, Perl, and Tcl shell programming.


    ![](img/8fe1800c5b705516dc6b73632c4160ad_595_0.png)


    # The UNIX Shells

    Power-Pack


    If you are a UNIX programmer, you know the flexibility and greater productivity
    that results from shell programming are much of what set UNIX apart. This developer-friendly,
    fully indexed handbook covers all the tools you need, and provides clear advice
    on how to create programs that perform the tasks you need them. David Medinet''
    UNIX Shell Programming Tools features two practical chapters filled with shell
    programming tips and techniques. Plus, you also get a CD-ROM that''s loaded with
    usable code, utilities, and shareware tools.


    +   - Literals, Variables, and Operators

    - Constructs

    - Controlling the Shell

    - Looking in the Toolbox

    - Extending the Toolbox

    - Finding Bugs in Your Script

    - Portability Issues

    - Perl

    - Tcl/TK

    - Using the CD-ROM Tools and Internet Resources


    When it comes to showing you how to utilize shell programming to maximize the
    effectiveness of the UNIX server/environment, UNIX Shell Programming Tools is
    the one-stop, all-inclusive resource that you''ll rely on time after time, for
    large tasks and small.


    # About the Author


    David Medinets, the author or co-author of twelve books, including Perl 5 By Example
    (published by Que), has been working on UNIX systems since 1980. He is the founder
    and president of Eclectic Consulting.


    Series Design: Tisa Lynn Lerner


    P/N 039733-3 part of

    ISBN 0-07-913790-3


    ![](img/8fe1800c5b705516dc6b73632c4160ad_595_1.png)


    McGraw-Hill

    1221 Avenue of the Americas

    New York, NY 10020


    McGraw-Hill - A Division of The McGraw-Hill Companies'
