    # Metacharacters for Perl Pattern Matching


    So far in this chapter, you''ve read about the different operators used with regular
    expressions, and you''ve seen how to match sequences of characters. Now we''ll
    look at the wide array of metacharacters that are used to harness the full power
    of regular expressions. Metacharacters are characters that have an additional
    meaning above and beyond their literal meaning. For example, the period character
    can have two meanings in a pattern. First, it can be used to match a period character
    in the searched string—its literal meaning. Second, it can be used to match any
    character in the searched string except for the newline character—this is its
    metameaning.


    When you create patterns, the metameaning is the default. If you really intend
    to match the literal character, you need to prefix the metacharacter with a backslash.
    You might recall that the backslash is used to create an escape sequence.


    Patterns can have many different components. These components all combine to provide
    you with the power to match any type of string. The following list of components
    can give you a good idea of the variety of ways that patterns are created. The
    section “Pattern Examples” later in this chapter shows many examples of these
    rules in action.


    Variable Interpolation: Any variable is interpolated, and the essentially new
    pattern is evaluated as a regular expression. Remember that only one level of
    interpolation is done. This means that if the value of a variable includes, for
    example, $scalar as a string value, then $scalar is not to be interpolated. In
    addition, backticks do not interpolate within double quotes, and single quotes
    do not stop interpolation of variables when used within double quotes.


    Self-Matching Characters: Any character matches itself unless it is a metacharacter
    or one of the symbols $, @, %, or &. The metacharacters are listed in Table 8.7,
    and the other characters are used to begin variable names and function calls.
    You can use the back-'
