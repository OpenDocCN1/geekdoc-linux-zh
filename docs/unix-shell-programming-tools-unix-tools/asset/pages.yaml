- img_proc: true
  md: 'When shell scripts need to hold a piece of information for later use—(perhaps
    a filename) they store it in a variable. Variables are chunks of computer memory
    that hold changeable values. You (or the shell) give each variable a name so that
    it''s easy to refer to.


    Listing 2.1 displays a short script that simply assigns a value of monday.dat
    to a variable called logfile.


    # Listing 2.1 assign_logfile—A Simple Variable Assignment


    ```

    #!/bin/bash


    # The following line is the assignment command.

    logfile="monday.dat"


    echo "The value of logfile:"


    # The dollar sign is used to access a variable''s value.

    echo "$logfile".

    ```


    Here is an example of this script in action:


    +   % chmod +x assign_logfile

    - execute the file.

    % ./assign_logfile

    - the correct value is

    monday.dat

    - displayed.

    % echo $logfile

    - yikes! how come no no value

    - is displayed.


    Listing 2.1 shows that variables are, by default, only accessible in the shell
    that creates them. Before exploring this issue further, let''s look at the $ character
    and how it''s used in the script to access the value of a variable.


    When assigning a value to a variable, you use only the variable''s name (on the
    left side of the assignment). For example:

    logfile="monday.dat".


    However, when accessing the variable''s value, some character is needed to let
    the shell know that a variable substitution is to be done. Variable substitution
    replaces the variable''s name with its value, and Bash uses the $ character to
    signal that the substitution needs to be made. For example:

    echo "The log file name is $logfile".'
  merge: -1
