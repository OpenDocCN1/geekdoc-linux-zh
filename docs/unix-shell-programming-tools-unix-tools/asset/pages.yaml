  md: '# The trap Command


    If you want to do something when a signal is received, you need to create a signal
    handler. For example, let''s say that you want to display a parting message (“Bye
    Bye”) when a script ends. To accomplish this task, you need to take these steps:


    +   1. Develop the script to display the parting message.


    +   2. Trap the EXIT signal.


    The first step is easy enough. It''s simply an echo command like this:


    ```

    echo "Bye Bye"

    ```


    This command is given to the trap command as a parameter enclosed in single quotes.
    Listing 4.5 shows how to combine the echo and trap commands.


    # Listing 4.5 PARTING_MSG—Using the trap Command to Display a Parting Message


    ```

    #!/bin/bash

    trap echo "Bye Bye": exit

    ```


    ```

    echo "Line One"

    ```


    Here is an example of this script in action:


    ```

    % chmod +x parting_msg

    ./parting_msg

    ```


    ```

    Line One

    Bye Bye

    ```


    Notice how echo "Line One" is printed before the "Bye Bye" message? This shows
    the signal handler is created, but doesn''t get triggered until the script ends
    (generating the EXIT signal).'
  merge: -1
  pgno: 94
