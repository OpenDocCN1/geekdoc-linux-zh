  md: 'where. The **trap** command lets you either ignore signals or kick off some
    commands whenever a signal is detected. The **if** command is great for making
    decisions among a small number of options. When greater flexibility is needed,
    the **case** statement can be used. It can test a variable for any number of values,
    and execute different commands or a group of commands for each value specified.
    The **for, while,** and **until** commands are used to control looping. The **for**
    command iterates over the values in a list. The **while and until** commands loop
    until a **test** command fails or succeeds. Finally, the **break** and **continue**
    commands give you fine control over exactly how and when loop iterations begin
    and end.


