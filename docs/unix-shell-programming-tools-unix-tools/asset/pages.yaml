    \ statement (explained later in the chapter).\n\nThe value of the last statement\
    \ executed becomes the value returned by the subroutine to the main program. In\
    \ the above example, the last statement executed is $a * $b; the result of this\
    \ manipulation is $result when the subroutine ends and $result = multiply(4, 2);\
    \ assignment statement is finished. Perl provides a return function that explicitly\
    \ indicates the value to return. However, it is not needed (unless, of course,\
    \ the value you want to return is different from the value of the last statement\
