  md: '# Pattern Matching


    Pattern matching is a wonderful feature of Bash, Perl, Tcl, and other languages.
    This chapter explains the concept of pattern matching in general and then goes
    into specifics about each language. One of humanity’s best features is our ability
    to generalize or to pick out common features of disparate objects. At its most
    basic level, pattern matching takes a description and finds out if an object matches
    that description. Usually, patterns are matched in text. However, you can also
    use pattern matching with filenames or the contents of variables.'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# Pattern Matching


    Testing text to see if it matches a description.


    # Pattern


    A series of characters that describe the text you''re looking for.


    Almost every Unix user knows at least the rudiments of pattern matching. Every
    time you use the ls command with a wildcard character (e.g., to only list PostScript
    files using a command like *.ps) or to list all files with a certain letter (e.g.,
    using ls m*), you''re using pattern matching.


    The rest of this chapter is divided into three main sections. The first section
    discusses how pattern matching is used by Bash. The second discusses how Perl
    uses pattern matching. The third shows how Tcl uses pattern matching.


    All three languages rely on metacharacters to describe the text to be matched.
    Metacharacters are characters that have an additional meaning above and beyond
    their literal meaning. For example, the ? has a literal meaning of a question
    mark. However, in Bash, it can also mean: match any single character.


    Lets see the ? in action:


    ```

    % ls

    doo.txt foo.txt waswaldo.txt

    % ls ?.txt

    doo.txt foo.txt

    ```


    This example shows that the ? metacharacter matches both the d in doo.txt and
    the f in foo.txt.


    > Use the \ (backslash) to return a character back to its normal meaning. For
    example, \? actually means a question mark and not "match any character." The
    backslash is called the escape character, perhaps because it lets characters escape
    from being treated as metacharacters.


    Patterns, the description of the text you''re searching for, are also called regular
    expressions or regex. I don''t know the history behind this term, just that it''s
    commonly used.'
  merge: -1
  pgno: 255
- img_proc: true
  md: "Bash\n\n# Regular Expressions\n\nA group of characters and metacharacters used\
    \ to determine if text matches a description.\n\n# Bash\n\nThe Bash shell uses\
    \ pattern matching matching in several different ways. The most prevalent use\
    \ of pattern matching is to specify filenames. However, pattern matching is also\
    \ used with variables, the case command, and for the command.\n\n# Metacharacters\
    \ for Filenames\n\nMost of the time when using metacharacters in the shell, you'll\
    \ be looking for filenames. You might need to move PostScript files or you might\
    \ need to delete files associated with an old project. These tasks, and more,\
    \ can be accomplished with pattern matching.\n\nTable 8.1 lists all of the metacharacters\
    \ used when matching filenames.\n\n# Table 8.1 Metacharacters for Filenames\n\n\
    | Metacharacter(s) | Metameaning |\n| ? | The question mark matches any single\
    \ character. |\n * | The asterisk matches zero or more of any character. |\n [\
    \ ] | Square brackets create a character list. All characters inside the square\
    \ brackets are used to match or not match a single character. For example, [xyz]\
    \ matches either x, y, or z but not xx, xy, or any other combination. Character\
    \ lists only match a single character regardless of how many characters are in\
    \ the list. You can use [a-e] as shorthand for [abcd]. Additionally, using a !\
    \ as the first character of the list negates it. For example, [!xyz] matches any\
    \ character except x, y, and z. |\n () | Curly brackets are used for pattern expansion.\
    \ For example, x(y,z) matches either xy or xz and no other text. It is very useful\
    \ when dealing with directories."
