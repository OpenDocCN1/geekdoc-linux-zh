    # Beyond the Shell


    The core Tcl language is really only your first taste of the Tcl family of tools.
    Much of Tcl’s popularity stems from Tcl extensions, such as Tk and Expect, and
    the ease with which developers can write new, custom extensions to Tcl. Tcl extensions
    allow you to leverage the Tcl syntax that you have mastered, and to apply your
    skills with powerful new tools.


    Tk probably the most famous and widely used Tcl extension. In fact, Tk is so useful,
    and so easy to use, that it has been adapted for use with other scripting languages,
    such as Perl and Scheme. Tcl/Tk (as the extended language is called) allows you
    to quickly develop a graphical front end for Tcl scripts.


    > You''ll need to use Wish, rather than wish, to try the little program below.
    Tcl does not support Tk. If you''ve been using Wish throughout the chapter and
    you minimized the display window, sure to bring it back!


    Let’s walk through a simple example of Tcl/Tk. Remember the little procedure that
    performed RGB-to-hex conversions? Let’s build a simple interface that make it
    easy for point-and-click users to perform conversions. First, we’ll need the little
    engine that does all of the work:


    ```

    % proc rgbToHex args {

    > set hexValue #

    > foreach x $args {

    > append hexValue [format %02x $x]

    > }

    > return $hexValue

    >

    ```'
