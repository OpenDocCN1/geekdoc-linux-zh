- img_proc: true
  md: '# Procedures


    This chapter discusses how to create packages of commands called procedures. These
    packages can be called whenever needed and are used to store sets of commands
    that are called often within a script. They help to keep your script small and
    tidy because the same sequence of commands doesn’t need to be repeated many times
    throughout the script.'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'Shell procedures are rarely used because, by their nature, shell scripts need
    to be small and straightforward. However, occasion-ally you''ll need the extra
    kick provided by procedures.


    One of their biggest benefits is that they allow you to create advanced aliases.
    Instead of simply aliasing ls -l to ll, you can get more creative by using and
    manipulating parameters in your procedures. This chapter only goes into the basics
    of procedure syntax and how to use parameters. Chapter 10, “Customizing the Tools,”
    shows more advanced examples of procedures in action.


    # Procedure


    A block of commands that has been given a name for later use.


    Procedures are blocks of shell commands that are given names so you can use them
    wherever they are needed. Procedures organize your code into easy-to-understand
    and easy-to-use pieces. They let you build your scripts slowly, testing them along
    the way.


    As you prepare to implement a complex script, you should break the script into
    several tasks and create a procedure for each task. As you develop a small army
    of procedures, you''ll find that writing scripts becomes easy—sometimes as easy
    as stringing your procedures together in a new way. This is called code reuse.


    When procedures are sourced, they are defined just if you were typing the shell
    commands they comprise. Procedures are sourced using the source command (using
    a . instead of source also works). The command lines following Listing 3.1 show
    the source command in action. Basically speaking, the source command means that
    the script is not run inside a subshell. Instead, it''s run in the current shell.


    You can simply call procedures (after sourcing) from the shell command line. Many
    procedures, in fact, are created to enhance existing shell commands. Other procedures
    are created to combine commands or to process the output of one command before
    displaying it.


    What does a procedure look like? Listing 3.1 shows a procedure that tracks tar
    file extractions. The unt audit trail lists the name of the tar file used and
    the files inside it, and then moves the tar file to a storage partition. A full
    explanation of the script follows the listing.'
  merge: -1
  pgno: 73
- img_proc: true
  md: "# 3.1 untar—Creating an Audit Trail for the tar Command\n\n```\n#!/bin/bash\n\
    \nuntar () {\n  cp $1 /store\n  echo \"-------------------------------- ---\"\
    \ >> ~/tar.log\n  echo $1 >> ~/tar.log\n  date >> ~/tar.log\n  tar tf $1 >> ~/tar.log\n\
    \  tar xvf $1\n  rm $1\n  ln -s /store/$1 $1\n}\n```\n\nThis script, while straightforward,\
    \ does quite a few things:\n\n+   1. Copies the tar file to the /store directory.\
    \ On my system, the /store directory is a separate partition that I use solely\
    \ to store tar files so I will have them in case an emergency arises in the future.\n\
    2. Appends a separator to a log file in the user’s home directory. This log file\
    \ records tar activities for future audits.\n3. Appends the name of the tar file\
    \ to the log file.\n4. Appends a timestamp to the log file.\n5. Appends a list\
    \ of the files inside the tar file to the log file.\n6. Extracts the files inside\
    \ the tar file.\n7. Removes the tar file to save space in the current partition.\n\
    8. Creates a symbolic link to the new location of the tar file (in the /data partition)\
    \ in the current directory. This symbolic link is frequently not needed, but it's\
    \ cheap in terms of disk space.\n\n> Running the untar script, as is, requires\
    \ that the /store directory already exist and for you to be able to write to it.\
    \ If this is not the case, either comment out lines 1, 7, and 8 or simply create\
    \ a store directory in your home directory and change lines 1 and 7 to use ~/store\
    \ instead of plain /store."
  merge: -1
