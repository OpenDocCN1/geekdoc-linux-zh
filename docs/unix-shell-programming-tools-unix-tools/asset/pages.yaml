    # Position Variables


    The shell uses position variables to access script parameters. If you create a
    script to process two files, you might need to find out the names of the files
    to be processed. The filenames are stored in the variables, $1 and $2. You can
    access any number of parameters simply by placing a dollar sign in front of its
    associated number. When accessing any parameters past the tenth, you need to use
    curly braces around the number. For example, ${14} and ${19}.


    Listing 2.6 shows a script that displays its parameters using position variables.


    # Listing 2.6 display_parameters—Using Position Variables to Display Script Parameters


    ```

    #!/bin/bash


    echo "$0 = $*0*"

    echo "$1 = $*1*"

    echo "$2 = $*2*"

    echo "$3 = *$3*"



    ```


    Here is an example of this script in action:


    ```

    % chmod +x process

    % ./process one.dat two.dat

    $0 = *process*

    $1 = *one.dat*

    $2 = *two.dat*

    $3 = **


    ```


    This scripts illustrates two main points. First, sometimes it’s useful to surround
    values with asterisks so that you can more easily tell when a variable is empty.
    Notice that $3 is empty. This makes good sense, because only two parameters are
    passed to the script.'
