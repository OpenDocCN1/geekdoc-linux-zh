  md: '# Chapter 09 / Examining the Tools


    You can easily use the cut command to display information from any of the columns.
    The following command views the second column:


    ```

    % cut -b9-14 cut.dat

    Male

    Female

    Male

    Female

    ```


    Once you''ve determined the section of information that you need, the pipe command
    can be used for further processing. For example, generate a list of the unique
    values in a section:


    ```

    % cut -b9-14 cut.dat | sort | uniq

    Female

    Male

    ```


    Let''s briefly turn our attention to the --fields option before moving to the
    echo command. The --fields option works in conjunction with the --delimiter option
    to virtually chop each line into sections, based on the end-of-field delimiter.
    Let''s see how this works:


    ```

    % cut -delimiter=" " --fields 1 cut.dat

    Robert

    Barbara

    Peter

    Richard

    ```


    That''s pretty straightforward. Let''s try looking at the second column:


    ```

    % cut -delimiter=" " --fields 2 cut.dat

    Female

    Male

    ```


    What happened? Why didn''t all four lines of input produce output? The answer
    lies in how cut defines the end-of-field delimiter. The end-of-field delimiter
    can only be a single character. Therefore, when there is more than one space between
    the words, cut sees more than two fields.


    The tr command can solve this problem by collapsing multiple spaces into one space:'
