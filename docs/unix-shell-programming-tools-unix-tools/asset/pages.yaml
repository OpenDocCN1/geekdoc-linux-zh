    , \"Kathy\\ The foreach statement iterates over the list of indexes. Each index\
    \ value is placed into the $index variable, in turn, and the statement inside\
    \ the curly braces is executed.\n\n# Using Static Information\n\nMuch of the information\
    \ used in programs is static—it never changes. For example, a graphics program\
