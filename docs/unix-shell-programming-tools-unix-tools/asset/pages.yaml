- img_proc: true
  md: 'This message tells you that the debugger (DB) routines have been loaded. The
    DB<1> is a prompt that indicates that the debugger is waiting for input. The line
    number inside the angle brackets is the current execution line. The current execution
    line is that the debugger waits to execute.


    One of the features of the debugger is the capability to insert breakpoints into
    your script. A breakpoint is an instruction that tells the debugger to stop, to
    display a prompt, and to wait for input. When the debugger first starts, there
    are no breakpoints defined for your program.


    You can use any of the commands listed in Table 11.2 while using the debugger.
    While these commands are not demonstrated because of space considerations, you
    can''t hurt anything by experimenting with any or all of the commands on your
    own.


    # Table 11.2 The Debugger Commands


    | Command | Description |

    |---|---|

    | Commands That Control Actions: | |

    | ACTION | This command tells the debugger to perform ACTION just before the current
    execution line is executed. Optionally, you can specify a line number. For example,
    a 10 print("$num-Files"); executes the print statement before line 10 is executed.
    If line 10 is inside a loop, the action is performed each time through the loop.
    |

    | A | Deletes all actions. |

    | L | Lists all breakpoints and actions. |

    | < ACTION | Forces the debugger to execute ACTION each time the debugger prompt
    is displayed. This command is great if you need to print the value of certain
    values each time you are prompted by the debugger. |

    | > ACTION | Forces the debugger to execute ACTION after every debugger command
    you issue. |'
  merge: -1
