  md: "# Listing 4.3 test_return—A Command that Tests Its First Parameter or Argument\n\
    \n```\n#!/bin/bash\n\nif $1\nthen\n    echo \"The Test Worked.\"\nelse\n    echo\
    \ \"The Test Failed.\"\nfi\n```\n\nFor more information about the If command,\
    \ see the section\n\"The Command\" later in this chapter.\nHere is an example\
    \ of these scripts in action:\n\n+   % chmod +x success failure test_return\n\
    % ./test_return success\nThe Test Worked.\n% ./test_return failure\nThe Test Failed.\n\
    \nThe test_return script runs its argument and tests its exit value.\nIf the exit\
    \ value is zero, success is assumed and the first echo command is run. Otherwise,\
    \ failure is assumed and the second echo command is run.\nThe success and failure\
    \ scripts explicitly told the exit command what value to use; you can also substitute\
    \ a shell command for the literal value. For example, the line of code below is\
    \ perfectly okay:\n\nexit \"failure\"\n\nAssuming you've already created the failure\
    \ script, this might be a nice way to make your script files more readable—at\
    \ the expense of some extra CPU cycles. However, when moving your scripts from\
    \ one machine to another you'd need to move the success and failure scripts. So\
    \ perhaps this isn't the greatest idea after all.\n\n# The trap Command\n\nSyntax:\n\
    trap [-l] [[commands] signals]\n\nSynopsis:\nLets your script intercept signals\
    \ and, optionally, acts on them."
