    # CAUTION


    The mount point directory must already exist before you issue the mount command
    or an error message will be displayed.


    Don''t ever use /tmp or a subsubdirectory of /tmp as a mounting point! Many systems
    automatically delete files in the /tmp directory when space is needed or after
    a certain amount of time has elapsed.


    # Using Exec


    The exec command can do a number of interesting things because it runs commands
    in place of the current shell. Most of the time this ability is used to change
    your current shell. For example the command exec /bin/csh causes you to start
    the C shell instead of Bash.


    The exec command can also be used to semi-permanently redirect to a file descriptor.
    This technique lets you a file descriptor other than STDOUT or STDERR, as shown
    in Listing 5.8.


    Listing 5.8 to_log—Using the exec Command and Redirection to Create a Log File


    ```

    #!/bin/bash

    exec 3>/tmp/log

    for file in *

    echo "`date +%B %d %H:%M:%S` - Processing $file" >3

    ```'
