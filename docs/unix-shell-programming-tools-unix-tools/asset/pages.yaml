  md: '# The tr Command


    Table 9.37 Backslash Sequences Used with the tr Command


    | Backslash Sequence | Description |

    | --- | --- |

    | \a | The alarm or CTRL-G character |

    | \b | The backspace or CTRL-H character |

    | \f | The formfeed or CTRL-L character |

    | \n | The newline or CTRL-J character |

    | \r | The carriage return or CTRL-M character |

    | \t | The tab or CTRL-I character |

    | \v | The vertical tab or CTRL-K character |

    | \nnn | Any character specified in octal |

    | \\ | The backslash character |


    In addition to simple backslash sequences and regular characters, you can use
    any of the following notations in CHARSET1 and CHARSET2:


    +   * Ranges—The notation *m-n* expands to all characters from *m* to *n*, inclusive.
    The character *m* must sort before *n* or an error message is generated. For example,
    D-G expands to D,E,F,G.

    * Repeated characters—The notation [*c*n]* creates *n* repetitions of *c* in CHARSET2.
    If you need to replace characters A, B with the character 1 and the character
    C with the character 2 you use `tr "ABC" "[12]"`. The notation [*c*]` repeats
    *c* as many times as needed to make CHARSET1 and CHARSET2 the same length. The
    [*c*n]* notation does not appear at the end of CHARSET2. Please see the examples
    shown in the text after Table 9.38.

    * Character classes—The character class notation, *[:class:]*, provides an easy-to-remember
    way to specify types of characters. Only the *upper* and *lower* classes expand
    in ascending order. The *upper* and *lower* classes are valid in CHARSET2 only
    if the opposite class is specified in CHARSET1 (resulting in case con'
