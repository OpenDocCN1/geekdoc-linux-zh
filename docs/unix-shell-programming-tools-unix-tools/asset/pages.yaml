  md: "Now, we'll use Tk to build entry boxes where users can type in values for red,\
    \ green, and blue values, and an entry box to hold the resulting hex value. To\
    \ build an entry box, we use Tk's entry command, like so:\n\n```\n% entry .r -textvariable\
    \ r\n```\n\n.r is the name of the entry box, and r is the name of the Tcl variable\
    \ in which to store anything the user enters in the entry box. We'll create a\
    \ few more entry boxes to hold the green, blue and hex values:\n\n```\n% entry\
    \ .g -textvariable g\n% entry .b -textvariable b\n% entry .h -textvariable hex\n\
    ```\n\nWe'll use a similar command—label—to create the labels for each entry box:\n\
    \n```\n% label .rlabel -text red\n% label .glabel -text green\n% label .blabel\
    \ -text blue\n% label .hlabel -text hex\n```\n\nNext, we'll use Tk's grid command\
    \ to place all of the interface elements in the window:\n\n```\n% grid .rlabel\
    \ -col 1 -row 1\n% grid .r -col 2 -row 1\n% grid .glabel -col 1 -row 2\n% grid\
    \ .g -col 2 -row 2\n% grid .blabel -col 1 -row 3\n% grid .b -col 2 -row 3\n% grid\
    \ .hlabel -col 1 -row 4\n% grid .h -col 2 -row 4\n```\n\nThat's our interface.\
    \ Now, all we need to do is create a button for the user to push, and tie the\
    \ button to the rgbToHex procedure. As you probably guessed, the command that\
    \ creates the button is simply called button.\n\n```\n% button .button -text convert\
    \ -command {\n  set hex [rgbToHex $r $g $b]\n  configure -background [rgbToHex.\
    \ $r $g $b]\n```"
