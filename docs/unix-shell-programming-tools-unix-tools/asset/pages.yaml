    # Tcl Under Mac OS


    Finally, let''s look at Tcl under Mac OS. In many ways, tcsh and Wish are a kind
    of command-line interface for Mac OS. MacPerl is cool, but it''s mostly useful
    for writing and compiling scripts; if you use the Wise console to navigate the
    Mac, you might feel—if only in passing—that you''re using Unix on the anti-Unix
    box.


    Tcl lives up to its cross-platform ambitions on the Mac: Every core Tcl command
    is implemented under Mac OS, except for exec. As I mentioned in the MacPerl section,
    there''s no Macintosh command-line interface, so exec makes no sense on the Mac.


    # NOTE


    The Mac has its own native scripting language, called AppleScript, and the Mac
    port of Tcl includes a module that allows Tcl scripts to execute or communicate
    with AppleScript. (This module adds its own set of commands, rather than allowing
    access to AppleScript via exec and pipes.) Of course, you''ll need to know a little
    about AppleScript, which is a topic too large to cover in this chapter. For more
    information on getting started with Mac scripting, see http://applescript.com/default.html.


    The biggest problem with using Tcl on the Mac is Mac filenames. Unfortunately,
    the Mac OS allows filenames to contain a slash. If you want to refer to a file
    or folder that contains a slash in its name, such as:


    ```

    cd {Tcl/Tk Folder}

    ```


    the Tcl interpreter assumes that you want a directory called Tk Folder as a subdirectory
    of a directory called Tcl. As far as the interpreter is concerned, a directory
    with the name Tcl/Tk is unthinkable. There isn''t an elegant way to address this
    problem in every situation; you''ll need to figure out solutions to individual
    problems on a case-by-case basis.'
