    # The man Command


    Synopsis


    **man** displays online documentation.


    Syntax


    man [options] name


    Description:


    **the man** command searches directories for a documentation file that matches
    NAME. This search is controlled by the **MANPATH** variable. Once a documentation
    file is found, it is displayed using the software specified by the *PAGER* variable
    or the -P option.


    The techniques that **man** uses to find and display information are unimportant
    to most people. If you are curious, start with the **man man** command and then
    explore the **groff** command.


    The manual pages that **man** searches are broken up into nine categories:


    +   1. User Commands


    +   2. System Calls


    +   3. Library Functions


