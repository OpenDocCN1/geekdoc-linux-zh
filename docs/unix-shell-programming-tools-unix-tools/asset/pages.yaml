  md: '# Summary


    Well, that did do it. We can exit the debugger and make the appropriate changes
    to our source code.


    Table 11.3 summarizes Expect''s debugging commands.


    # Table 11.3 Expect''s Debugging Commands


    | Level Code | Description |

    |---|--|

    | s | step into procedure |

    | n | step over procedure |

    | r | return from procedure |

    | b | breakpoint |

    | c | continue |

    | w | show stack |

    | u | move scope up |

    | d | move scope down |

    | h | help |

    | \r> | repeat last debugger command |


    # Summary


    This chapter presents an overview of the many types of errors you can encounter
    as you create scripts. No programmer that I''ve ever heard of writes perfect scripts
    more than a few lines long. Just remember, as you make your own mistakes, you''re
    in good company.


    Debugging generally has two phases. The first phase involves fixing any syntax
    or typographical errors you introduced into your program while entering the code.
    For example, in Perl you might not have added a semi-colon to the end of the line,
    or you might have used **else** instead of **elsif**. Every programming language
    has its unique blend of easy-to-make typing mistakes.


    Sometimes, typographical errors aren''t revealed until your script has started
    running. These errors are called runtime errors. Runtime errors include the classic
    division by zero error and using'
  merge: -1
