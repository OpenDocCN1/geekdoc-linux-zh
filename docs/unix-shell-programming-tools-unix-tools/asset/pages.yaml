    Why are so many files displayed? The answer is not obvious. However, the display
    offers a clue. Notice that both /two.txt and two.txt are displayed. But aren''t
    these the same file? Yes, they are. Remember that the find command does: It evaluates
    expressions. Because no expression was specified, the default action of -print
    was performed for each file under the command-path parameters.


    If you need to find all instances of a given filename using somewhere in a directory
    structure, the -name test comes in handy:


    ```

