    Figure 5-9 A simple asynchronous messaging scenario


    # Summary


    Asynchronous messaging systems allow many applications, written in different languages,
    to exchange business information in the form of a message. Messages are transmitted
    from one application to another on a network using message-oriented middle ware
    (MOM). JMS can be used with different MOMs. For example, you can use the same
    JMS API to send messages with Progress'' SonicMQ as IBM''s MQSeries; BEA''s WebLogic
    EJB service; and Sun Microsystems'' Planet Message Queue to give a name to.


    EJB 2.0 Message-Driven Bean acts as an integration point for an EJB application.
    They allow to integrate other systems into EJB applications, because the systems
    are loosely-coupled via simple data exchange. The Message-driven Beans are managed
    by the EJB container and in onMessage() method they receive formatted messages
    that can be processed directly, or processing may be delegated to other Entity
    Beans, or passed to other message driven beans using JMS. They are an excellent
    addition to the EJB platform.'
  - '[PAGE 97]


    # 5.1.2 EJB 2.0 Bean Managed Persistence Entity Bean


    This section describes creation of an Entity Bean with Bean-Managed Persistence
    (BMP). An Entity Bean implements the object view of an entity in an underlying
    database, or an entity in an existing enterprise application; for example, a mainframe
    program using flat files such as VSAM. The data access protocol for transferring
    the state of the entity between the bean and the database is referred to as persistence.
    In a BMP Entity it is the developers task to write the persistence handling code
    into the bean class. As a database, we use the Linux version of IBM DB2 Version
    7.2 in some helper classes.


    # The business logic in ITSO Bean sample


    The ITSO bean sample we will realize a simple check reorder. We received two properties
    in our Message-driven Bean: the customer identification and quantity will be the
    number of checks the customer wants to reorder. Customer ID is the input for the
    BMP bean called by the Message-driven Bean RcvoBean. The bean has to store the
    customer''s reorder request into a check_reorder table. The request records in
    the check_reorder table will enable the check print to produce individual checks
    and mail it to the customer.


    Example 5-8 Check-reorder request table definition


    ```

    CREATE TABLE ITSO.CHECK_REORDER (

    CK_RO_ID INTEGER NOT NULL GENERATED ALWAYS AS IDENTITY

    (START WITH 101, INCREMENT BY 1, NO CACHE)

    FK CUST INTEGER NOT NULL,

    QUANTITY INTEGER NOT NULL,

    STATUS VARCHAR(15) NOT NULL,

    DATA_ORDERED TIMESTAMP NOT NULL,

    PRIMARY KEY (CK_RO_ID));

    ALTER TABLE ITSO.CHECK_REORDER

    ADD CONSTRAINT CheckReordering FOREIGN KEY (FK_CUST)

    REFERENCES ITSO.CUSTOMER ON DELETE RESTRICT;

    GRANT ALL ON ITSO.CHECK_REORDER TO PUBLIC);

    ```


    The function for the BMP bean is to insert a customer check reorder into the check_reorder
    table of the WSA5 database. A new request ID will be generated by incrementing
    the maximum check_reorder primary key CK_RO_ID. The CheckReordering constraint
    will guarantee that inserted records have existing customer ID. If we get an invalid
    customer ID delivered from the Message-driven Bean, then the check_reorder insert
    into the request table will fail.'
