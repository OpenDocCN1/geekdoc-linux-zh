    # 6.2 Introducing ITSO Banking example using XML


    In this chapter, we will describe some of the features that we use for our example,
    and give you an overview of the various parts of the ITSO Banking example. Walking
    through our example will give you an opportunity to get started with the new XML
    features that are available for WebSphere Studio Application Developer on Linux.


    The following list includes some of the features that we cover:


    +   - How to build an XML from an SQL query - The SQL to XML creates an XML source
    code from a query. You can create an XML schema or a DTD that will build the structure
    of your XML source code. There are two Java class libraries, SQLtoXML and XMLtoSQL,
    which are required for your applications successfully. For example, in our example
    we use the SQLtoXML Java library to perform the database queries.


    +   - Creating HTML or XML documents by applying an XSL stylesheet against an
    XML document using the Xalan processor. Our example uses the Xalan processor to
    build the HTML and XML documents.


    +   - XSL debugging and transformation tools - This allows you apply XSL documents
    to XML documents that transform them into new HTML documents. You may use the
    XSL debugger to visually step through an XSL transformation script.


    +   - Show the use of the various XML editors - The XML editor can be used to
    inspect, modify, and validate XML documents. The DTD editor can be used to view
    DTD documents and also convert them into new XSD (XML schema) documents. The editors
    are described in details later in the chapter.


    +   - Use of DTDs, XML schemas, XML documents, and XSL stylesheets


    The ITSO Banking example for this chapter will perform the following functions:


    +   - Acquires the user ID and password


    +   - Authenticating the user


    +   - Performs the necessary calculations to obtain the account balance for the
    user; uses an SQL query to access the example WSAD5 database


    +   - Displays the results in an HTML page


    Once you have completed this chapter, the SQL statement will be as follows (Example
    6-1).'
  - '[PAGE 135]


    # Example 6-1 Select statement for customer account balance


    ```

    SELECT

    ITS0.CUSTOMER.FIRSTNAME,

    ITS0.CUSTOMER.LASTNAME,

    ITS0.ACCOUNT.BALANCE,

    ITS0.ACCOUNT.ACCTYPE

    FROM

    ITS0.CUSTOMER,ITS0.CUSTACCT, ITS0.ACCOUNT

    WHERE

    ITS0.CUSTOMERID = ITS0.CUSTACCT.ID

    AND ITS0.CUSTACCT.ACCID = ITS0.ACCOUNT.ACCID

    AND ITS0.CUSTOMER.UserID = :userid

    AND ITS0.CUSTOMER.PASSWORD = :passwd

    ```


    The Tokyo Banking example functions are built using XML not Enterprise JavaBeans
    as shown in Chapter 5, "Enterprise JavaBeans 2.0" on page 59. As stated earlier,
    there are two Java class libraries, SQLtoXML and XMLtoSQL, which are required
    for your applications to execute successfully. Since our SQL query uses select,
    we will mainly be using the SQLtoXML library. The XMLtoSQL library is used for
    inserts or deletes. The functions for the example are created in two stages:


    +   - Using wizards to create XML from SQL queries. We use the RDB to XML mapping
    (SQL to XML wizard) editor to execute a database query and convert the results
    into an XML format. The editor generates the DTD or the XML schema describing
    a list of customers and their balances.

    - Dynamically generating the XML from SQL queries. We go to implement the dynamic
    way from SQL to XML to use the SQLtoXML library to get the dynamic results. The
    SQLtoXML is a library. This library provides classes/methods that can be used
    by servlets and other development tools (SQL to XML wizard) to perform database
    queries. The query result is to obtain in an XML format corresponding DTD, XML
    schema, and a default XML to transform the generated XML data into HTML.


    We have also added some information to help you use the XSL debugger and transformation
    tools. At the end of the XML chapter, you may find that the XML/XSL development
    is similar to JavaServer Pages (JSP) and it shows opportunity to develop a Web
    application without JSP technology (using the StrutsCX Framework).'
  - '[PAGE 136]


    # 6.3 Using the wizards to create XML from SQL


    In the following section, we will show the database to XML mapping, how to create
    an SQL query, generating XML from the SQL query, and how to use the XML, DTD,
    and XSL editors.


    # 6.3.1 RDB to XML mapping


    In data perspective of your WorkBench, you will find the SQL to XML wizard that
    helps you produce a SQL statement. The SQL to XML wizard gives the developers
    the capability of generating XSL and XML files from a SQL statement.


    The Figure 6-1 shows the flow of the RDB to XML mapping as generated by the wizard.


    ![](img/88f7c0f0eff8122fc71c8c318ea660bf_136_0.png)


    Figure 6-1 Flow of the RDB to XML mapping


    The above figure clearly shows that the wizard will create the necessary documents
    as well as a frontend HTML. The select statement is shown in Example 6-1 on page
    116.


    Here are the steps that you have to follow to create an RDB to XML mapping:


    +   1. Create a database connection.

    2. Import the connection to your project.

    3. Use the SQL builder to build the query.

    4. Use the RDB to XML mapping to convert the results into XML.'
