    # 3.2.2 Using Enterprise JavaBeans with your Web application


    The ITSO Bank example follows this model (Figure 3-14).


    ![](img/88f7c0f0eff8122fc71c8c318ea660bf_50_0.png)


    Figure 3-14 ITSOBankEJB project model


    In the above model, the customer requests to re-order cheques. The customer will
    enter the customer ID and quantity. The request is then sent to a JSP program
    that consist of two main functions: sending and receiving. The sending function
    sends the request to the first queue (Q1). The queue passes the necessary information
    to the Message Driven Bean (MDB). The Message Drive Bean sends the information
    to the Entity Bean (EB), which performs the'
  - '[PAGE 51]


    necessary SQL query to the backend database. Once the database is updated, a confirmation
    is send back to the EB. The EB sends this information to the MDB, which sends
    it to the second queue (Q2). The Q2 forwards the information to the JSP''s receiving
    function. This function interacts with the servlet and produces an HTML output
    with a sample cheque.


    Since this is an example, the JSP contains the receiving function. Normally, it
    would only send the data to the Q1 and not receive any confirmation.


