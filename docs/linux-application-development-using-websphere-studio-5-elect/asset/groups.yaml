    We have discussed briefly the WebSphere software platform. For more detailed information
    visit the IBM WebSphere Web site:

    http://www.ibm.com/software/websphere


    # 2.3.1 WebSphere products


    As shown, the WebSphere platform is divided in four main components. Each of these
    components consists of products that are used for development.


    +   The *Reach and User Experience* component consists of the products:

    - IBM WebSphere Commerce offers you products and services over the Internet, which
    promotes a global and mobile marketplace.

    - IBM WebSphere Portal is a single point of interaction for dynamic information,
    applications and processes.

    - IBM Pervasive Products has products such as WebSphere Voice Server or DB2 Everyplace,
    which allows you to deliver any information over various network, using different
    devices.


    +   The *Transaction Servers and Tools* component consists of the products:

    - IBM Enterprise Modernization solutions, which use the IBM WebSphere software
    to help you develop the process, tooling, and infrastructure to transform your
    business into the world of e-business.

    - Transaction Processing Product has products such as IBM''s CICS Transaction
    Server, and other similar products that can handle more than thirty transactions
    per day.

    - Traditional products contain enterprise application development and operational
    tools, which improve user productivity and effectiveness.


    +   The *Foundation and Tools* component consists of the following products:

    - IBM WebSphere Application Server is a world-class infrastructure for open e-business
    applications, which provides a complete set of e-business application deployment
    and integration services.

    - IBM WebSphere Studio is an integrated application development environment, which
    makes building the e-business application easier and faster.

    - IBM WebSphere Host Integration is a single offering, which provides a fast and
    cost-effective way to access to publish host information to Web-based clients
    and applications.


    +   The *Business Integration* component consists of the following products:'
  - '[PAGE 31]


    +   - Process integration products such as IBM WebSphere MQ Workflow, which provides
    ability to design, document, execute, or optimize the business processes.


    +   - Application connectivity has products such as IBM WebSphere MQ, which is
    a key product for dynamic integration. They provide flexible and reliable connections
    between applications.


    We urge you to visit the IBM WebSphere web site for more detailed information,
    and make use of these tools in your next e-business application: http://www.ibm.com/software/websphere


    # 2.3.2 WebSphere Studio Application Developer for Linux


    IBM WebSphere Studio Application Developer for Linux, also known as WebSphere
    Application Developer, is an integrated application development environment. For
    this "represents the next generation of IBM offerings making e-business application
    easier and faster."


    # What is new in Version 5


    Some of the new features of this version are:


    +   - Support for J2EE 1.3, EJB 2.0, Servlet 2.3 and JSP 1.2


    +   - Support for both WebSphere Application Server Version 4 (J2EE 1.2) and Version
    5 (J2EE 1.3)


    +   - Allow users for WebSphere Application Server Version 4 to adopt Eclipse
    Version 2 without any upgrades


    +   - Uses the Eclipse Version 2 platform


    # Version 5 feature


    We will briefly describe some of the version features:


    +   - J2EE development environment: Some of the features include the development
    environment, which includes support for J2EE 1.3 specifications with EJB 2.0,
    servlet 2.3 and JSP1.2. Ability to generate code on J2EE 1.2 and 1.3 specifications.
    EJB-to-RDF mapping tables for editing the mapping between EJBs and relational
    database tables with top-down, bottom-up, and in-the-middle-capacity tools. For
    creating, editing, and validating EAR files.


    +   - Services development environment: Some of the features include support for
    UDDI Version 2; browse the UDDI business registry to locate existing Web services
    for integration; support for Web Services Language (WSIL); and testing Web services
    as they run locally or remotely.'
  - '[PAGE 32]


    +   XML development environment: Some of the features include debug and edit

    XSL with code assistance, Define mappings between relational table and

    DTD files. Create and execute XPath using Wizard.


    +   Web development environment: Some of the features include support for

    XHTML. JavaScript editing and validating. Cascading Style Sheet (CSS)

    editing support. HTTP/FTP import and Web project creation using the J2EE

    container structure.


    +   Team collaboration: Some of the features include managing project versions;

    erving as a backup vehicle. New support for namespace versions so that

    when files are moved, deleted, or renamed, Relation ClearCase LT will

    perform the equivalent SCM operation.


    # 2.3.3 WebSphere Application Server for Linux


    As part of the foundation for the WebSphere software platform, the WebSphere

    Application Server for Linux maintains its reputation as the premier Java-based

    application platform for the dynamic e-business environment. It provides a very

    rich e-business application deployment environment for transaction

    management, Web services, security, performance, availability, connectivity, and

    scalability.


    # What is new with Version 5


    Some of the new features of this version are:


    +   A fast, scalable, and reliable server based on the Java 2 Platform, Enterprise

    Edition (J2EE) technology


    +   Compatible to J2EE 1.3 technology


    +   Supports core web services standards like XML, Simple Object Access

    Protocol (SOAP), and Web Services Description Language (WSDL)


    +   Offers deployment of Web services using SOAP and HTTP, JMS or Remote

    Method Invocation Inter-ORB Protocol (RMI/IIOP) communication

    mechanism


    +   Delivers dynamic caching, content-based routing, load balancing, and content

    distribution for application optimization


    # 2.3.4.2 Version 5 features


    We will briefly describe some of the version features:


    +   Enable dynamic application integration - Dynamic application integration

    through native, high-performance Java Messaging Services (JMS), J2EE 1.3

    Message Beans and container managed messaging.'
  - '[PAGE 33]


    +   Web services - Allows you to create new business opportunities by exposing
    business and application services for integration by other divisions, business
    organizations, or platforms. It has most comprehensive across platforms on the
    market, including the IBM eServer, IBM iSeries, and IBM zSeries.


    +   Management - XML based administrator client that works over HTTP. This allows
    the administrator to create and manage the cluster quickly and easily.


    +   Volume Maintenance - Support for Java Management Extensions (JMX), which records
    and logs statistics on usage and resources. This is the standard way to manage
    a J2EE environment and expose the WebSphere administrative data to partners like
    Tivoli and others for management integrations.


    +   Security - Security authentication options to include Kerberos tokens for
    strong authentication security for client/server applications. Also, provides
    open Security Programming Interfaces (SPIs) for integration into those third-party
    solutions.'
  - '[PAGE 34]


    ![](img/88f7c0f0eff8122fc71c8c318ea660bf_34_0.png)


    # Setting up the development environment


    In this chapter, we discuss the following sections:


    +   - Workbench fundamentals show the different perspectives, views, editors,
    and projects that are available with Workbench.

    - This chapter introduces our sample application, which will be used throughout
    the redbook.'
  - '[PAGE 35]


    # 3.1 Workbench fundamentals


    In Chapter 1, "What is Linux?" on page 1, we described Linux and its advantages.
    In Chapter 2, "WebSphere application development for Linux" on page 5, we introduced
    the foundation of WebSphere software platform and listed some of the new feature
    for WebSphere Studio Application Developer and Server Version 5. In this chapter
    we will show you the Workbench features that are available in the WebSphere software
    platform.


    Workbench is an integrated development environment (IDE) that has flexible perspectives.
    These perspectives contain views and editors that provide a common way for members
    of the development team to create, manage, and navigate resources. For example,
    a Java developer would work most often in the Java perspective, while a Web designer
    would work in the Web perspective.


    A perspective defines an initial set and layout of editors for performing a particular
    set of development activities. You can change the layout and the preferences that
    you have customized. One or more perspectives can be open in a single Workbench
    window. You can switch between perspectives in the same window, or you can open
    a new Workbench window.


    We will briefly describe the perspectives that are available in the Application
    Developer.


    # 3.1.1 Resource perspective


    This is the default perspective. This perspective is always shown at the top of
    the list when you select Window -> Open Perspective then Open from the menu. For
    a list of perspectives, select Other from the menu. Figure 3-1 shows the different
    perspectives that are available for your development.'
