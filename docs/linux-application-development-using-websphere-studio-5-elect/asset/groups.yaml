    \ value is true.\n\nIn the above code, we use the request.getParameter to acquire\
    \ the parameter that is usually the user's responses. Using the session Attribute,\
    \ we have assigned it to a variable and later set it to a string variable by using\
    \ session.getAttribute. The string variable can be further manipulated within\
    \ the JSP. You can also define the session attribute to true or false in the page\
    \ directive. By default the session value is true.\n\n## 4.4 Servlet\n\nIn this\
    \ section, we will be using the ITSOBankWeb servlet, controller.java to explain\
    \ the basics of servlet, and also, web.xml, the Web Descriptor.\n\nServlets are\
    \ Java programs that are portable across platform. These are programs that run\
    \ in the middle layer acting as controller for requests that come from a Web browser,\
    \ HTTP clients, and database. The main components of servlets are the init, doGet,\
    \ doPost, performServices, and dispatch methods. The following is a brief description\
    \ of what each one looks.\n\n### The init method\n\nThis method is used to load\
    \ the initial variables. In this case the values reside in the Deployment Descriptor\
    \ or the servlet tag. You can also specify other variables that are required for\
    \ the servlet to initialize.\n\nExample 4-7 init method in servlets\n\n```java\n\
    public void init(ServletConfig config) throws ServletException {\n  super.init(config);\n\
    }\n```\n\n### The doGet method\n\nWhen the user submits an HTML form, it specifies\
    \ if the method is going to be HTTP get or post. If the user uses the method,\
    \ the doGet method should be used. The doGet takes two arguments, HttpServletRequest\
    \ and HttpServletResponse, where the first handles incoming data, and the later\
    \ handles outgoing data. In our example we override the method with the performTask\
    \ method.\n\nExample 4-8 doGet method in servlets\n\n```java\npublic void doGet(HttpServletRequest\
    \ req, HttpServletResponse resp) throws ServletException, IOException {\n  performTask(req,\
    \ resp);\n}\n```\n\n### The doPost method\n\nIf the user uses the method, the\
    \ doPost method takes two arguments, HttpServletRequest and HttpServletResponse,\
    \ where the first handles incoming data, and the later handles outgoing data.\
    \ This is exactly the same as its counter part doGet. In our example we override\
    \ the method with the performTask method.\n\nExample 4-9 doPost method in servlets\n\
    \n```java\npublic void doPost(HttpServletRequest req, HttpServletResponse resp)\
    \ throws ServletException, IOException {\n  performTask(req, resp);\n}\n```\n"
