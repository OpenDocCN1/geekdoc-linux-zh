    \ 的客户端和应用程序中。\n\n- 业务集成（*Business Integration*）组件包含以下产品：\n    - 流程集成产品，如 IBM WebSphere\
    \ MQ Workflow，它提供了设计、文档化、执行或优化业务流程的能力。\n    - 应用连接性（Application connectivity）包含诸如\
    \ IBM WebSphere MQ 等产品，它是动态集成的关键产品。它们在应用程序之间提供了灵活可靠的连接。\n\n我们建议您访问 IBM WebSphere\
    \ 网站获取更多详细信息，并在您的下一个电子商务应用程序中使用这些工具：http://www.ibm.com/software/websphere\n\n\
    ## 2.3.2 Linux 版 WebSphere Studio Application Developer\n\nLinux 版 IBM WebSphere\
    \ Studio Application Developer（也称为 WebSphere Application Developer）是一个集成的应用程序开发环境。它“代表了\
    \ IBM 的下一代产品，使电子商务应用程序的开发更加简单快速。”\n\n## 版本 5 的新特性\n\n该版本的某些新特性包括：\n\n- 支持 J2EE\
