    public void performTask(HttpServletRequest req,\n    HttpServletResponse resp)\n\
    throws ServletException, IOException {\n    String nextPage;\n    try {\n    \
    \    performServices(req, resp);\n        nextPage = getInitParameter(req.getParameter(\"\
    command\"));\n    } catch (Exception ex) {\n        nextPage = getInitParameter(\"\
    error_page\");\n    }\n    dispatch(req, resp, nextPage);\n}\n```\n\n# The dispatch\
    \ method\n\nThe dispatch method passes the input variables using the dispatch.forward\
    \ function. Then using the nextPage variable launches the next page in response\
    \ to the user's request.\n\nExample 4-12 dispatch method in servlets\n\n```\n\
    public void dispatch(\n    HttpServletRequest req, HttpServletResponse resp, String\
    \ nextPage)\nthrows ServletException, IOException {\n    RequestDispatcher dispatch\
    \ = req.getRequestDispatcher(nextPage);\n    dispatch.forward(req, resp);\n}\n\
    ```"
