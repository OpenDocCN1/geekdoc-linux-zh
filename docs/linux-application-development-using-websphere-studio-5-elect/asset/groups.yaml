    \ Linux 环境下启动 ITSO Banking 的构建文件。\n\n表 7-2 JEE 项目到 CVS 模块的映射\n\n| 项目名称 | CVS 模块名称\
    \ |\n| --- | --- |\n| 企业级应用项目 | ITSOBankEAR |\n| Web 项目 | ITSOBankWeb |\n| EJB\
    \ 项目 | ITSOBankEJB |\n\nCVS 模块名称的结构也描述了 Linux 环境下的目录结构，类似于 J2EE 的命名规范。在 Linux\
