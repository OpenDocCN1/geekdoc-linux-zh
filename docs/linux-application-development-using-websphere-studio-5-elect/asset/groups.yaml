    \ again.\n\n| dir | Installation bin-directory of the Application Server |\n|\
    \ executable | Name of the Shell script startServer.sh |\n| arg value | Name of\
    \ the Application Server to start |\n\nExample 8-6 Target \"start-appsrv\"\n\n\
    ```\n<-- Target Application Server -->\n<target name=\"start-appsrv\" depends=\"\
    stop-appsrv\">\n  <echo message=\"Start Application Server\" />\n  <exec dir=\"\
    ${was.bin}\" executable=\"${was.start}\">\n    <arg value=\"${appsrv.name}\" />\n\
    \  </exec>\n</target>\n```\n\n# Run Ant\n\nThe build file is now modified and\
    \ can run on the command line in the build directory. The output of the StdOutput\
