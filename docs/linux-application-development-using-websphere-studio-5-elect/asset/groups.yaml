    /**\n * Enterprise Bean 的实现类：Check\n */\npublic class CheckBean implements javax.ejb.EntityBean\
    \ {\n    private javax.ejb.EntityContext myEntityCtx;\n    public jms.itso.bean.CheckDAO\
