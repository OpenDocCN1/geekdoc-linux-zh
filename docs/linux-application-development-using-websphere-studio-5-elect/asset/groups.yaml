    # Deploying the Web application


    This chapter describes the deployment of the J2EE application in the following
    sections:


    +   * Deploying an Enterprise Application describes step-by-step the manual deployment
    and installation of the ITSO Bank example on the Application Server Version 5
    with the administration console.

    * Setting up a remote server describes the important steps to create a remote
    server instance to publish a Web application to the remote server.

    * Automatic deployment by tools shows the way to use the wsadmin command tool
    and the Ant build tool to install the ITSO Bank example on the Application Version
    5.'
