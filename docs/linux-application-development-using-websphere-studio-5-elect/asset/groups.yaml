    \ Method Invocation Inter-ORB Protocol (RMI/IIOP) communication mechanism\n- Delivers\
    \ dynamic caching, content-based routing, load balancing, and scalability\n\n\
    ## 2.3.4 Version 5 features\n\nWe will briefly describe some of:\n\n- Enable dynamic\
    \ integration - high-performance Messaging Services (JMS), J2EE 1.3 Message Beans\
    \ and container managed\n- Web services - Allows you to create new business opportunities\
    \ by exposing business and application services for other divisions or platforms.\n\
    - Management - XML based administrator that works over HTTP. This allows the administrator\
    \ to create and manage the cluster quickly.\n- Volume Maintenance - Support for\
    \ Java Management Extensions (JMX), which records and logs statistics.\n- Security\
    \ - Security authentication options to include Kerberos tokens for strong authentication\
    \ for client/server applications. Also, provides open Security Programming Interfaces\
    \ (SPIs) for integration into third-party solutions.\n\n![](88f7c0f0eff8122fc71c8c318ea660bf_34)\n\
    \n## Setting up the development environment\n\nIn this chapter, we discuss the\
    \ following sections:\n\n- Workbench fundamentals show the different perspectives,\
    \ views, editors, and projects that are available with Workbench.\n- This chapter\
    \ introduces our sample application, which will be used throughout the redbook.\n\
    \n### 3.1 Workbench fundamentals\n\nIn Chapter 1, \"What is Linux?\" on page 1,\
    \ we described Linux and its advantages. In Chapter 2, \"WebSphere application\
    \ development for Linux\" on page 5, we introduced the foundation of WebSphere\
    \ software platform and listed some of the new feature for WebSphere Studio Application\
    \ Developer and Server 5. In this chapter we will show you the Workbench features\
    \ that are available in the WebSphere software platform.\n\nWorkbench is an integrated\
    \ development environment (IDE) that has flexible perspectives. These perspectives\
    \ contain views and editors that provide a common way for members of the development\
    \ team to create, manage, and navigate resources. For example, a Java developer\
    \ would work most often in the Java perspective, while a Web designer would work\
    \ in the Web perspective.\n\nA perspective defines an initial set and layout of\
    \ editors for performing a particular set of development activities. You can change\
    \ the layout and the preferences you have customized. One or more perspectives\
    \ can be open in a single Workbench window. You can switch between perspectives\
    \ in the same window, or you can open a new Workbench window.\n\nWe will briefly\
    \ describe the perspectives that are available in the Application Developer.\n\
    \n#### 3.1.1 Resource perspective\n\nThis is the default perspective. This perspective\
    \ is always shown at the top of the list when you select Window -> Open Perspective\
    \ then Open from the menu. For a list of perspectives, select Other from the menu.\
    \ Figure 3-1 shows the different perspectives that are available for your development.\n"
