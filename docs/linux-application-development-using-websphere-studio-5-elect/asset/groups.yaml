    \ | 数据访问对象接口 |\n| DB2CheckDAO.java | 包含 DB2 的编码实现 |\n| DB2DAOFactory | 获取 DB2\
    \ 数据访问对象的工厂 |\n| DAOFactory | 抽象类 |\n\n在本章中，我们将完成 BMP 实体 Bean 的编码。剩余工作是持久化 bean。由于执行\
