    # DTD editor


    In the XML Perspective double-click the customerBalance.dtd file in the Navigator
    view. This file contains the Document Type Definition (DTD) used by the query
    result file customerBalance.xml. It contains the declarations that define elements
    for a particular XML file and establishes constraints for how each element may
    be used within that particular XML file.


    You can use the Outline view to add or remove components of your DTD. When you
    select an object in this view, the Design view will display the properties that
    are associated with the DTD component object. Also, you can switch to the Source
    view to browse and edit the DTD source directly. The Task view is also active
    from the Workbench for reporting errors in the DTD file.


    # XSL editor


    This is a text editor to view the source code of an XSL file. It has several editing
    features like content assist and syntax highlighting. Another useful feature of
    this editor is the incremental validation. At any point during your development
    of an XSL file, you can start the validation process to validate the file. Right-click
    on the **file name** in the Navigator view, and select **Validate XSL File**.
    The validation is now running and any error will be reported in the Task view.
    The validation process also runs when you save a document. To view the file in
    the XML Perspective under the Navigator view, double-click **customerBalance.xsl**.
    This has an XML stylesheet that describes XML to HTML conversion. The XSL file
    defines the layout of your web page.'
