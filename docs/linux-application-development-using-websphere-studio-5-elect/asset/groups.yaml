    \ 将 ITSOBankWeb 项目源码编译为 .class 文件 |\n| ej-compile | 将 ITSOBankEJB 项目源码编译为 .class\
    \ 文件 |\n| ej-jar | 创建 EJB 项目的 JAR 文件，依赖于 ej-compile |\n| ej-deploy | 为 WebSphere\
    \ 服务器生成部署代码，调用部署工具 |\n| war | 创建项目的 war 文件 |\n| ear | 创建整个项目的 ear 归档文件 |\n\n接下来的章节详细描述了构建文件中的目标。\n\
    \n## 设置属性和 ant 元素\n\n理解 Ant 操作最重要的概念是属性（properties）的含义。属性类似于变量，因为它们在名称和值之间建立映射，并且在概念上与\
