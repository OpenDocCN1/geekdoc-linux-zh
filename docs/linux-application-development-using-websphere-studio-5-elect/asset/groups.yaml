  mdcn: "\n将显示图 A-2。\n\n![](img/88f7c0f0eff8122fc71c8c318ea660bf_204_0.png)\n\n图 A-2\
    \ DB2 安装窗口\n\n安装完成后，将显示图 A-3。\n\n![](img/88f7c0f0eff8122fc71c8c318ea660bf_205_0.png)\n\
    \n图 A-3 DBB2 安装完成窗口\n\n22. 以实例用户身份登录并运行 First Steps（初步步骤）。创建数据库以确认 DBB2 安装。\n\n\
    ## 如何配置 CVS\n\n按照以下步骤配置版本控制系统：\n\n- 1. 以 root 身份为 CVS 和其他用户创建账户。\n- 2. 将用户添加到\
    \ CVS 组。\n- 3. 以 CVS 身份，在主目录下创建 cvs_rep。\n- 4. 将以下变量添加到 `bash.profile` 文件中：\n\
    \  \n  CVS=/home/cvs/crs_rep\n  export CVSROOT\n- 5. 执行 `source .bash_profile`\
    \ 命令使用更新后的配置。\n- 6. 执行 `cis init` 创建新存储库。\n- 7. 如果你的系统使用 inetd，则在 `/etc` 文件中添加以下变量：\n\
    \  \n  cvpserver 2401/tcp\n- 8. 同时，将 `inetd.conf` 文件中的 2401 更改为 cvpserver。\n-\
    \ 9. 如果你的系统使用 xinetd，则在 `/etc` 目录下创建一个名为 `cvpserver` 的文件。文件内容为：\n\n```\nservices\
    \ cvpserver {\nport = 2401\nsocket_type = stream\nprotocol = tcp\nwait = np\n\
    user = root\npassenv = PATH\nserver = /user/local/bin/cvs\nserver_args = -f --allow-root=/user/cvroot\
    \ prefer\n}\n```\n\n- 10. 重启启动这些服务。\n\n## 如何配置 Telnet、FTP 和 Samba\n\n按照以下步骤配置\
    \ Telnet：\n\n- 1. 打开终端窗口。\n- 2. 以 root 身份编辑 `/etc/xinetd.d` 下的 telnet 文件。将 `disable`\
    \ 参数更改为 no。\n\n按照以下步骤配置 FTP：\n\n- 1. 打开终端窗口。\n- 2. 以 root 身份编辑 `/etc/xinetd.d`\
    \ 下的 wu-ftpd 文件。将 `disable` 参数更改为 no。\n\n按照以下步骤配置 Samba：\n\n- 1. 打开终端窗口。\n- 2.\
    \ 进入 `/etc/samba/`，在提示符处执行 `touch smbpasswd`。\n- 3. 在 `smb.conf` 文件中将 `workgroup`\
    \ 参数更改为你的工作组。\n- 4. 通过取消注释 `smb.conf` 文件中的这些变量来打开 `tmp` 目录。\n- 5. 进入服务配置中的系统设置，激活\
    \ smb 代理并重启机器。\n\n## 补充材料\n\n本红书提到了下文所述的可以从网上下载的补充材料。\n\n## 定位 Web 材料\n\n与本红书相关的\
    \ Web 材料可以通过 IBM Redbooks Web 服务器以电子版形式在网上获取。将你的 Web 浏览器指向：\n\nftp://www.redbooks.ibm.com/redbooks/SG246431/sg246431.tar\n\
    \n或者，你可以访问 IBM Redbooks 网站：\n\nibm.com/redbooks\n\n选择“Additional materials”（补充材料）并打开与红书表号\
    \ SG246431 对应的目录。\n\n## 使用 Web 材料\n\n随本红书的补充 Web 材料包含以下文件：\n\n| 文件名 | 说明 |\n|\
    \ :--- | :--- |\n| SG246431.tar | 示例和数据库脚本 |\n\n## 下载 Web 材料的系统要求\n\n推荐以下系统配置：\n\
    \n- **硬盘空间：** 至少 10 MB\n- **操作系统：** Linux\n- **处理器：** Pentium III 600Mhz 或更高\n\
    - **内存：** 512MB\n\n## 如何使用 Web 材料\n\n在你的工作站上创建一个子目录（文件夹），并将 Web 材料 zip 文件包的内容解压到此文件夹中。\n\
    \n目录：\n\n- BuildWithAnt: Ant 示例\n- DBscripts: 数据库生成\n- Deploy: 部署示例\n- ServletSP:\
    \ 示例 Web 应用程序\n- XML:  XML 应用程序\n\n## 缩写和术语\n\n| AAT | application assembly tool\
