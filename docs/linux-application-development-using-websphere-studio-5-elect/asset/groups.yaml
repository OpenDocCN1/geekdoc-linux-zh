    - Web 服务使用 SOAP 和 Web 服务描述语言（WSDL）\n- 管理 - 基于 HTTP 的管理员，允许快速创建和管理集群\n- 卷量维护 -\
    \ 支持 Java 管理扩展（JMX），记录统计信息\n- 安全 - 安全认证选项包括 Kerberos 令牌，用于客户端应用程序的强身份验证。还为集成第三方解决方案提供了安全编程接口（SPIs）。\n\
    \n![](887c0f0eff8122fc71c8c318ea660bf_34) \n\n## 设置开发环境\n\n在本章中，我们将讨论以下章节：\n\n\
    - Workbench 基础知识显示了 Workbench 可用的不同视角、视图、编辑器和项目。\n- 本章介绍了我们的示例应用程序，它将贯穿本书。\n\n\
    ### 3.1 Workbench 基础知识\n\n在第一章“什么是 Linux?”第 1 页中，我们描述了 Linux 及其优势。在第二章“Linux 的\
    \ WebSphere 应用开发”第 5 页中，我们介绍了 WebSphere 平台的基础，并列出了 WebSphere Studio Application\
    \ Developer 和 Server 5 的新功能。在本章中，我们将向您展示 WebSphere 平台中提供的 Workbench 功能。\n\nWorkbench\
    \ 是一个集成开发环境（IDE），具有灵活的视角。这些视角包含视图和编辑器，为开发团队成员提供了创建、管理和导航资源的通用方法。例如，Java 开发者通常在\
    \ Java 视角下工作，而 Web 设计师则在 Web 视角下工作。\n\n视角定义了执行特定开发活动的初始编辑器集和布局。您可以更改布局和自定义的偏好设置。一个\
    \ Workbench 窗口可以打开多个视角。您可以在同一个窗口中切换视角，也可以打开一个新的 Workbench 窗口。\n\n我们将简要描述 Application\
    \ Developer 中可用的视角。\n\n#### 3.1.1 资源视角\n\n这是默认视角。当您从菜单中选择 Window -> Open Perspective\
    \ 然后 Open 时，此视角始终显示在列表顶部。要查看视角列表，请从菜单中选择 Other。图 3-1 显示了您的开发可用的不同视角。\n"
