    and the directory and security services provided by the network infrastructure.
    They can also leverage database, transaction, and groupware facilities.

    - The third tier: This tier mainly consists of Customer Information Control System
    (CICS) server, legacy applications developed on mainframes, legacy systems, or
    relational databases such as DB2.


    ### 2.2.2 The programming model


    The application programming model highlights the software tools and products used
    to build, run, and manage e-business applications. The Framework is constantly
    evolving to support more industry standards, expand the product offerings, and
    make the methodologies stronger.


    Figure 2-2 shows the Framework for e-business.


    ![](img/88f7c0f0eff8122fc71c8c318ea660bf_27_0.png)


    Figure 2-2 IBM e-business Framework


    We will briefly describe the three parts of the Framework:


    - Development Tools and Components: This component consists of the build tools.
    For example, WebSphere Studio or Domino Designer.

    - Application Server Software: This component consists of runtime environments
    available on all major platforms, including collaboration, transaction, and database.

    - Secure Network and Management: The Framework includes a complete portfolio of
    management products such as Tivoli.


    We have given you an introduction to the building blocks required when developing
    an e-business. In the next section, we will elaborate on the WebSphere platform
    and the new additions.


    ## 2.3 WebSphere Application Developer and Server


    WebSphere is an infrastructure for building e-business. WebSphere has evolved
    to meet the demands of the changing business environment by increasing the developer''s
    ability to build complex solutions, allowing an open platform. Based on Eclipse,
    WebSphere has come a long way to provide everything a customer needs to build,
    deploy, and operate a dynamic e-business.


    Figure 2-3 is the WebSphere platform.


    ![](img/88f7c0f0eff8122fc71c8c318ea660bf_28_0.png)


    Figure 2-3 WebSphere platform


    The WebSphere pyramid consists of the Foundation and Tools, Reach and Experience,
    Business Integration, and Transaction Servers and Tools. Together these components
    close the gap between business strategy and information technology. We will discuss
    each component below:


    ### Foundation and tools


    If you want to make a presence on the Internet, you will require a solid foundation
    and the latest tools. Having business processes and transactions on the Web allows
    your customers, partners, and employees to buy, sell, and share information anytime,
    anywhere. The WebSphere e-business infrastructure is about Web-enabling your business
    as fast as possible. For example, as stated in the IBM WebSphere Web site:


    > "...WebSphere Application Server, Version 5 provides rich-business application
    deployment capabilities for transaction management in a heterogeneous environment,
    comprehensive Web services support, increased security..."


    ### Reach and experience


    This can happen only after your e-business starts to grow. WebSphere e-business
    infrastructure allows you to provide any user or device access to customized content,
    therefore, allowing you to extend and personalize your e-business.


    ### Business integration


    This is all about acquiring business agility by integrating and automating business
    processes. Delivering a customer'' e-business needs requires your business to
    have both the internal and external business processes integrated in the e-business
    environment. Once the employees, customers, suppliers, business partners, and
    e-marketplaces can connect with speed, efficiency, and agility, they can now provide
    dynamic e-business solutions.


    ### Transaction servers and tools


    WebSphere infrastructure has the necessary features to integrate traditional assets,
    so that companies are not left wondering what they will do as the new technology
    revolutionizes the way people work and interact. As stated in the IBM WebSphere
    Web site:


    > "Leveraging these core software assets allows you to capitalize on existing
    investments, shorten deployment time for new e-business applications, and create
    real competitive advantage"

