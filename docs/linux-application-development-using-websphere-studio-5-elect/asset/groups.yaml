    directory points to the WebSphere deployment directory that is seen from the Workbench
    using the FTP client program.


    - iv. **FTP URL**: Type the URL that is used to access the FTP server.


    - v. **User login**: Type the FTP user ID to access the FTP server.


    - vi. **User password**: Type the FTP password used to access the FTP server.


    - vii. **Connection timeout**: The time (in milliseconds) that the Workbench will
    wait attempting to contact the FTP server before trying


    - viii. **Use PASV Mode (Passive Mode)** in go through the firewall: Select this
    box if you want pass through a firewall provided that one is installed over your
    FTP server and the Workbench.


    - ix. **Use Firewall**: Select the check box if you want to use the firewall options.
    To change the firewall options, change the firewall options.


