    用于业务。全面的硬件和软件支持。Linux 用户可以使用 IBM 的经验、资源和技能来满足他们的技术需求。运行电子商务应用的开放平台环境使 IT 专业人员能够构建特定供应商软件和硬件的
    Web 解决方案。


    尽管有很多适用于 Linux 的 IBM 产品，但我们专注于在 Red Hat Linux 7.3 上使用 WebSphere 5.0 进行开发。本书旨在展示
    IBM 以 Linux 作为操作系统为 WebSphere 提供高级平台的能力。我们采用的方法是构建一个具有后端数据库和前端业务应用程序的 ITSO 示例。我们使用的
