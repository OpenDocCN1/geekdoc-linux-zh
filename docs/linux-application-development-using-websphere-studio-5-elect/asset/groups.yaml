    \ window choose defaults and click Next.\n13. In the Network Configuration window,\
    \ select the required Network devices and DHCP or Static addressing and click\
    \ Next.\n14. In the Firewall Configuration window choose Trusted Devices, select\
    \ the default network card, allow all incoming protocols, and click Next.\n15.\
    \ In the Additional Language Support window choose the defaults and click Next.\n\
    16. In the Time Zone Section choose your time zone and click Next.\n17. In the\
    \ Account Configuration window enter your root password then click to add a user\
    \ account and click Next.\n18. In the Authentication Configuration window choose\
    \ defaults and click Next.\n19. In the Package Selection window go to the Desktops\
    \ section, under the X Windows System de-select Gnome. Ensure that KDE is selected.\
    \ In the Applications section choose the defaults. In the Development section\
    \ under Development Tools, ensure that CVS is selected by default and select expect.\
    \ In the System section choose the Administration Tools and in System Tools select\
    \ VNC. Click the Select Individual Packages check box and then click Next.\n"
  mdcn: "\n\n## 8.3.2 控制应用程序服务器\n\nWebSphere Application Server 包含多个命令行工具，用于启动、停止和监控\
    \ WebSphere Application Server 进程和节点。这些工具在本地服务器和节点上运行，无法在远程服务器或节点上操作。在前面的节中，您已经学会使用\
    \ `wsadmin` 工具作为命令行工具安装应用程序。现在我们将展示如何在没有管理员控制台的情况下启动和停止应用程序服务器。\n\n## 启动应用程序服务器\n\
    \n确保您有权限运行 WebSphere Application Server `bin` 目录下的脚本。要启动服务器，请运行 *startServer.sh*\
    \ 脚本：\n\n```\n# /opt/WebSphere/AppServer/bin/startServer.sh <servername>\n```\n\
    \n当出现以下消息时，服务器已启动：\n\nServer <servername> open for e-business; process id is <ID>\n\
    \n## 停止应用程序服务器\n\n与启动服务器类似，运行脚本 *stopServer.sh* 即可停止服务器。\n\n```\n# /opt/WebSphere/AppServer/bin/stopServer.sh\
    \ <servername>\n```\n\n当出现以下消息时，服务器停止完成：\n\nServer <servername> stop completed.\n\
    \n## 8.3.3 使用 Ant \n\n本节介绍了命令行工具 `wsadmin` 与 Ant 构建工具的结合。此构建创建一个 ITSO Bank EAR\
    \ 文件并将其部署在应用程序服务器上。您已经知道如何处理 `wsadmin` 工具来安装新的企业级应用程序，以及通过命令行*停止并启动*应用程序服务器。这将通过\
    \ Ant 中的 `<exec>` 任务实现。见图 8-24。该构建脚本完成了整个构建和部署过程。\n\n![](img/88f7c0f0eff8122fc71c8c318ea660bf_192_0.png)\n\
    \n## 更新属性文件\n\n属性文件是构建过程中的重要配置文件。它包含了操作系统构建过程中所需的所有属性。若要为 `<exec>` 任务设置属性，您必须在属性文件中添加以下变量：\n\
    \n- # WebSphere Application Server 的属性\n- was.bin=/opt/WebSphere/AppServer/bin\n\
    - was.admin=wasadmin.sh\n- was.stop=stopServer.sh\n- was.start=startServer.sh\n\
    - appsrv.name=server1\n- ear.install=$AdminApp install $(dest.ear)\n- ear.uninstall=$AdminApp\
    \ uninstall $(ear)\n- save.config=$AdminConfig save\n\n在接下来的步骤中，我们想要向构建文件 `build.xml`\
    \ 添加并解释额外的目标（targets）。\n\n首先，您需要将项目名称顶部的默认目标属性从 \"ear\" 改为 \"start-apprv\"。该目标是我们安装应用程序的最后一个目标，它依赖于所有其他目标。见下方：\n\
    \n```\n<project name=\"ITSBankingExample\" default=\"start-apprv\">\n```\n\n>\
    \ 注意：在运行 Ant 脚本安装企业应用程序之前，应用程序服务器应该处于运行状态，否则服务无法安装。\n\n## 目标 \"install-app\"\n\
    \n目标 \"install-app\" 使用 `<exec>` 任务通过命令行运行 `wsadmin` 工具来启动安装。该目标依赖目标 \"ear\" 来开始安装：\n\
    \n- dir 应用程序服务器的安装 bin 目录\n- executable 脚本 wsadmin.sh 的名称\n- arg value 使用命令任务运行\
    \ wsadmin 工具 (-c)\n- arg value 对象 Admins，安装的 EAR 文件的位置和名称\n\n示例 8-3 目标 \"install-app\"\
    \n\n```\n<--\n<target name=\"install-app\" depends=\"ear\">\n  <echo message=\"\
    Installing of the J2EE Enterprise Application ${ear}\" />\n  <exec dir=\"${was.bin}\"\
    \ executable=\"${was.admin}\">\n    <arg value=\"-c\" />\n    <arg value=\"${ear.install}\"\
    \ />\n  </exec>\n</target>\n```\n\n## 目标 \"save-config\"\n\n\"save-config\" 使用\
    \ `<exec>` 任务通过命令行运行 `wsadmin` 工具来保存应用程序服务器的配置。您必须每次更改应用程序服务器后运行此操作。在我们的案例中，该目标依赖目标\
    \ \"install\" 来保存配置更改：\n\n- dir 应用程序服务器的安装 bin 目录\n- executable 脚本 wsadmin.sh\
    \ 的名称\n- arg value 使用命令任务运行 wsadmin 工具 (-c)\n- arg value 对象 Adminconfig 保存配置更改\n\
    \n示例 8-4 目标 \"save-config\"\n\n```\n<--\nTarget save-config 保存应用程序服务器的配置更改\n-->\n\
    <target name=\"save-config\" depends=\"install-app\">\n  <echo message=\"Save\
    \ configuration\" />\n  <exec dir=\"${was.bin}\" executable=\"${was.admin}\">\n\
    \    <arg value=\"-c\" />\n    <arg value=\"${save.config}\" />\n  </exec>\n</target>\n\
    ```\n\n## 目标 \"stop-appsrv\"\n\n目标 \"stop-appsrv\" 使用 `<exec>` 任务通过命令行运行 `wsadmin`\
    \ 工具来启动（注：此处原文可能有误，根据语境应为停止）应用程序服务器。该目标依赖于目标 `save-config`：\n\n- dir 应用程序服务器的安装\
    \ bin 目录\n- executable 脚本 wsadmin.sh 的名称\n- arg value 使用命令任务运行 wsadmin 工具 (-c)\n\
    \n示例 8-5 目标 \"stop-appsrv\"\n\n```\n<--\n<target name=\"stop-appsrv\" depends=\"\
    save-config\">\n  <echo message=\"Stop Server\" />\n  <exec dir=\"${was.bin}\"\
    \ executable=\"${was.admin}\">\n    <arg value=\"-c\" />\n    <arg value=\"${stop.appsrv}\"\
    \ />\n  </exec>\n</target>\n```\n\n## 目标 \"start-apprv\"\n\n目标 \"start-apprv\"\
    \ 使用 `<exec>` 任务通过命令行运行 `wsadmin` 工具来启动应用程序服务器。该目标依赖于目标 `install-app`：\n\n- dir\
    \ 应用程序服务器的安装 bin 目录\n- executable 脚本 wsadmin.sh 的名称\n- arg value 使用命令任务运行 wsadmin\
    \ 工具 (-c)\n\n示例 8-6 目标 \"start-apprv\"\n\n```\n<--\n<target name=\"start-apprv\"\
    \ depends=\"install-app\">\n  <echo message=\"Start Server\" />\n  <exec dir=\"\
    ${was.bin}\" executable=\"${was.admin}\">\n    <arg value=\"-c\" />\n    <arg\
    \ value=\"${start.apprv}\" />\n  </exec>\n</target>\n```\n\n## 运行 Ant\n\n构建文件已修改并可以在命令行运行。日志输出可以在\
    \ `WithAnt` 目录中找到。\n\n> 注意：应用程序服务器已安装，可以通过 URL 访问。\n\n## 安装说明\n\n在本附录中，我们讨论了以下主题：\n\
    \n- 如何安装 Linux 说明了方法。\n- 如何安装 WebSphere Studio。\n- 如何安装 WebSphere Application\
    \ Server。\n- 如何安装 DB2。\n- 如何配置 CVS。\n- 如何配置 Telnet、FTP 以及 Samba 等其他工具。\n\n## 如何安装\
    \ Linux\n\n按照以下步骤安装 Linux：\n\n1. 使用 Red Linux 8.0 CD-ROM 启动计算机。\n2. 在启动提示符处按回车。\n\
    3. 在欢迎窗口中点击 Next。\n4. 在语言选择窗口选择 English 并点击 Next。\n5. 在键盘配置窗口选择 U.S. English 并点击\
    \ Next。\n6. 在鼠标配置窗口选择默认设置并点击 Next。\n7. 在安装类型窗口选择 Custom 并点击 Next。\n8. 在磁盘分区步骤选择\
    \ Automatically partition 并点击 Next。\n9. 在自动分区窗口选择删除系统上的所有分区并点击 Next。\n10. 确认删除分区并继续。\n\
    11. 在网络配置窗口，选择所需的网络设备以及 DHCP 或静态地址并点击 Next。\n12. 在防火墙配置窗口选择 Trusted Devices，选择默认网卡，允许所有入站协议并点击\
    \ Next。\n13. 在附加语言支持窗口选择默认设置并点击 Next。\n14. 在时区部分选择您的时区并点击 Next。\n15. 在账户配置窗口输入您的\
    \ root 密码，然后点击添加用户账户并点击 Next。\n16. 在身份验证配置窗口选择默认设置并点击 Next。\n17. 在软件包选择窗口中，进入桌面部分，在\
    \ X Windows 系统下取消勾选 Gnome。确保选中了 KDE。在应用程序部分选择默认设置。在开发部分，在开发工具下，确保 CVS 默认选中并选择\
    \ expect。在系统部分选择管理工具，在系统工具下选择 VNC。点击 Select Individual Packages 复选框，然后点击 Next。\n\
    \n"
