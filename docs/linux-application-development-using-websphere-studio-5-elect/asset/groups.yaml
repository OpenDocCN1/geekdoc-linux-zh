    \n您可以使用 Outline 视图添加或删除 DTD 的组件。当在此视图中选择一个对象时，Design 视图将显示与该 DTD 组件相关的属性。此外，您可以切换到\
    \ Source 视图直接浏览并编辑 DTD。\n\n### XSL 编辑器\n\n这是一个用于查看源码的 XSL 编辑器。它具有内容辅助和语法高亮等功能。在开发期间的任何时候都可以开始验证。在\
    \ Navigator 视图中右键点击文件名，选择 Validate XSL。\n\ncustomerBalance.html 是当 customerBalance.xsl\
