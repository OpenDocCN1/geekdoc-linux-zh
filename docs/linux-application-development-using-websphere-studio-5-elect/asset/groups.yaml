    中构建 SQL 查询。要完成本节，您需要在您的 DB2 环境中拥有我们的数据库。请参考示例代码中 ITSO 数据库目录下的 readme 文件。


    ### 4.6.1 ITSO 银行数据库


    如上一章所述，WSAD5 数据库由构建模型的实体和关系组成。我们将描述关系型数据库。WSAD5 数据库包含以下表：


    - 客户表 (Customer table) - 客户表包含以下信息。


    | 列名 | 类型 - 长度 | 键 | 是否为空 | 描述 |

