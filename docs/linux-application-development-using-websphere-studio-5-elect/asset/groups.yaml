    \  System.out.println(\"CheckBean:ejbLoad:Time = \" +\n    checkVO.getDateOrdered());\n\
    \  System.out.println(\"CheckBean:ejbLoad:Customer = \" +\n    checkVO.getCustomer());\n\
    }\n```\n\n`ejbStore()` 将实例值保存到底层数据库。它是 `ejbLoad()` 的互补。容器可以在任何时候调用 `ejbLoad()`\
