    # How to install Linux


    Follow these steps to install Linux:


    +   1. Boot the computer using the Red Hat Linux 8.0 CD-ROM.

    2. At the boot prompt press Enter.

    3. In the Welcome window, click Next.

    4. In the Language Selection window choose English and click Next.

    5. In the Keyboard Configuration window choose U.S. English and click Next.

    6. In the Mouse Configuration window choose defaults and click Next.

    7. In the Install Type window choose Custom and click Next.

    8. In the Disk Partition Step window choose Automatically partition and click
    Next.

    9. In the Automatic Partitioning window choose to Remove all partition on system
    and click Next.

    10.Confirm deletion of partitions and click Next.

    11. In the Setup window choose defaults and click Next.

    12. In the Boot Loader window choose defaults and click Next.

    13. In the Network Configuration window, select the required Network devices and
    DHCP or Static addressing and click Next.

    14. In the Firewall Configuration window choose Trusted Devices, select the default
    network card, allow all incoming protocols, and click Next.

    15. In the Additional Language Support window choose the defaults and click Next.

    16. In the Time Zone Section choose your time zone and click Next.

    17. In the Account Configuration window enter your root password then click to
    add a user account and click Next.

    18. In the Authentication Configuration window choose the defaults and click Next.

    19. In the Package Selection window go to the Desktops section, under the X Windows
    System de-select Gnome. Ensure that KDE is selected. In the Applications section
    choose the defaults. In the Development section under Development Tools, ensure
    that CVS is selected by default and select expect. In the System section choose
    the Administration Tools and in System Tools select VNC. Click the Select Individual
    Packages check box and then click Next.'
