  mdcn: "\n\n## 6.4 从 SQL 动态生成 XML\n\n在本节中，我们希望在 servlet 中使用 `SQLtoXML` 类库，在运行时从 SQL\
    \ 查询动态生成 XML。该库适用于所有 JDBC 数据库，例如 DB2、Oracle 或 Sybase。\n\n图 6-7 显示了 servlet 如何调用\
    \ `SQLtoXML` 类库并将其转换为 XML 文档（DOM 对象），然后使用 XSLT 处理器将其转换为简单的 HTML。\n\n![](img/88f7c0f0eff8122fc71c8c318ea660bf_143_0.png)\n\
    \n图 6-7 Servlet 访问以获取 XML 文档\n\n以下步骤描述了更详细的说明：\n\n- 1. HTML 页面通过 HTTP 请求将带有用户\
    \ ID 和密码的表单发送到 servlet，调用 servlet 的 `doPost()` 方法。\n- 2. servlet 从 HTTP 请求中过滤出用户\
    \ ID 和密码，并带有两个参数调用 `SQLtoXML` 类库。\n- 3. `SQLtoXML` 类库开始访问数据库，并像处理 XML 文档一样从数据库中检索数据。\n\
    \n> 注意：WebSphere Studio Application Developer Version 5 中的 `SQLtoXML` 库的结果返回一个\
    \ XML 文档。早版本的 WebSphere Studio 返回流数据结果。现在不再需要解析。\n\n- 4. servlet 从 `SQLtoXML`\
    \ 类库获取 XML 文档并实例化 XSLT 处理器。\n- 5. 应用 XSL 样式表，生成 HTML 结果页面并传输到浏览器。用户可以看到其实际账户余额。\n\
    \n### 6.4.1 设置 Web 项目\n\n为了搭建工作环境，请从 `samples\\ch09` 文件夹导入文件到你的 Web 项目（ITSOBankWeb）中。图\
    \ 6-8 是 Web 项目及其内容的导航器视图。\n\n![](img/88f7c0f0eff8122fc71c8c318ea660bf_144_0.png)\n\
    \n图 6-8 设置环境\n\n你可能还需要修改 Web 项目的部署描述符（Deployment Descriptor）。在 `web.xml` 文件中，servlet\
    \ 标签应该包含以下信息（示例 6-4）。\n\n示例 6-4 添加到部署描述符 web.xml 的代码\n\n```\n<servlet>\n  <servlet-name>CustomerBalanceReportsServlet</servlet-name>\n\
