    和 K 桌面环境（KDE）是免费的桌面环境，对许多用户来说也是强大的应用程序框架。成本、稳定性、便携性和易用性的结合使得 Linux 非常强大。


    ## 1.2 IBM 与 Linux


    正如 IBM 网站 http://www.ibm.com/linux所示，Linux 是一个稳定、安全且强大的开源平台。Linux 开发的主要参与者包括 Red
