  - "[PAGE 164]\n\nNote: The J2EE directory structure below the module directories\
    \ correspond to the WebSphere Studio.\n\nAnt supports the <cvs> task for working\
    \ with the CVS server, and all operations to get out the source code from the\
    \ repository:\n\n+   - cvRoot:Root directory of the CVS server\n- package: Name\
    \ of the CVS module to extract (also checkout)\n- dest: Directory other than the\
    \ project's directory, where files are extracted locally\n\nExample 7-9 getcvs\
    \ target in the build\n\n```\n<target name=\"getcvs\" depends=\"clean\">\n  <echo\
    \ message=\"File from CVS Repository: ${cvs.home}\" />\n  <cvs root=\"${cvs.home}\"\
    \ package=\"${ear}\" dest=\"${home.build}\"\n        command=\"${cvs.command}\"\
    \ />\n  <cvs root=\"${cvs.home}\" package=\"${web}\" dest=\"${home.build}\"\n\
    \        command=\"${cvs.command}\" />\n  <cvs root=\"${cvs.home}\" package=\"\
    ${ejb}\" dest=\"${home.build}\"\n        command=\"${cvs.command}\" />\n  <mkdir\
    \ dir=\"${dest}\" />\n</target>\n```\n\n# Target-compile of ITSBankWeb\n\nBefore\
    \ we compile the code of the Web application, we first ensure that the destination\
    \ directory exists. We achieve this using the <mkdir> task to create the classes\
    \ directory of the Web application. The <copy> task copies all files excluding\
    \ Java sources from the Java source directory into the classes directory. This\
    \ function is needed if configuration files are used in the Java source directory.\
    \ After we start with the <javac> task to compile the of the Java code in the\
    \ Web application, specifying with following attributes:\n\n+   - srcdir: The\
    \ location of the Java source files\n- destdir: The directory to write generated\
    \ .class files\n- classpathref: A reference to the class path to use during compilation\n\
    - optimize: Use a compiler optimization\n- debug: Generate debug information in\
    \ all class files\n- deprecation: Output source locations where deprecated APIs\
    \ are used\n\nThe compile of the Web-compile task is in Example 7-10."
  - "[PAGE 165]\n\n# Example 7-10 Target web-compile\n\n```\n<target name=\"web-compile\"\
    \ depends=\"getcvs\">\n  <mkdir dir=\"${web.classes}\" />\n  <copy todir=\"${web.classes}\"\
    >\n    <fileset dir=\"${web.sources}\" excludes=\"**/*.java\"/>\n  </copy>\n \
    \ <javac srcdir=\"${web.sources}\"\n    destdir=\"${web.classes}\"\n    classpathref=\"\
    common.classpath\"\n    optim=\"${javac.optimize}\"\n    debug=\"${javac.debug}\"\
    \n    deprecation=\"${javac.deprecation}\"/>\n</target>\n```\n\n> Note: An Ant\
    \ itself is not a Java compiler; it simply contains a facade over compilers such\
    \ as IBM's javac.\n\n# Target ejb-compile of ITSOBankEJB\n\nThis compile target\
    \ for the EJB is nearly identical to that for the Web application code. The difference\
    \ is the destination directory for the compiled .class files. All Java source\
