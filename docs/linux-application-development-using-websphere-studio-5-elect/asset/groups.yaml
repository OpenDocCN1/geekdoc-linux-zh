    GNU 软件。随着修复程序的生成，它们的发行速度比商业软件快得多。


    ### 1.1.3 Linux 是便携的


    许多用户希望拥有平台供应商和应用程序的独立性。例如，Microsoft Windows 操作系统不能加载到任何计算机上。它必须满足非常特定的安装要求，且平台必须是
