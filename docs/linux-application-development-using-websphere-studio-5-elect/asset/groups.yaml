    \ to extract (also checkout)\n- dest: Directory other than the project's directory,\
    \ where files are extracted locally\n\nExample 7-9 getcvs target in the build\n\
    \n```\n<target name=\"getcvs\" depends=\"clean\">\n  <echo message=\"File from\
    \ CVS Repository: ${cvs.home}\" />\n  <cvs root=\"${cvs.home}\" package=\"${ear}\"\
    \ dest=\"${home.build}\"\n        command=\"${cvs.command}\" />\n  <cvs root=\"\
    ${cvs.home}\" package=\"${web}\" dest=\"${home.build}\"\n        command=\"${cvs.command}\"\
    \ />\n  <cvs root=\"${cvs.home}\" package=\"${ejb}\" dest=\"${home.build}\"\n\
    \        command=\"${cvs.command}\" />\n  <mkdir dir=\"${dest}\" />\n</target>\n\
    ```\n\n## Target-compile of ITSBankWeb\n\nBefore we compile the code of the Web\
    \ application, we first ensure that the destination directory exists. We achieve\
    \ this using the <mkdir> task to create the classes directory of the Web application.\
    \ The <copy> task copies all files excluding Java sources from the Java source\
    \ directory into the classes directory. This function is needed if configuration\
    \ files are used in the Java source directory. After we start with the <javac>\
    \ task to compile the of the Java code in the Web application, specifying with\
    \ following attributes:\n\n- srcdir: The location of the Java source files\n-\
    \ destdir: The directory to write generated .class files\n- classpathref: a reference\
    \ to the class path to use during compilation\n- optimize: Use a compiler optimization\n\
    - debug: Generate debug information in all class files\n- deprecation: Output\
    \ source locations where deprecated APIs are used\n\nThe compile of the Web-compile\
    \ task is in Example 7-10.\n\n## Example 7-10 Target web-compile\n\n```\n<target\
    \ name=\"web-compile\" depends=\"getcvs\">\n  <mkdir dir=\"${web.classes}\" />\n\
    \  <copy todir=\"${web.classes}\">\n    <fileset dir=\"${web.sources}\" excludes=\"\
    **/*.java\"/>\n  </copy>\n  <javac srcdir=\"${web.sources}\"\n    destdir=\"${web.classes}\"\
    \n    classpathref=\"common.classpath\"\n    optimize=\"${javac.optimize}\"\n\
    \    debug=\"${javac.debug}\"\n    deprecation=\"${javac.deprecation}\"/>\n</target>\n\
    ```\n\nNote: Ant itself is not a Java compiler; it simply contains a facade over\
    \ compilers such as IBM's javac.\n\n## Target ejb-compile of ITSBankEJB\n\nThis\
    \ compile target for the EJB is nearly identical to that for the Web application.\
    \ The difference is the destination directory for the compiled .class files. All\
    \ Java source files and compiled Java files are located in the same directory\
    \ called ejbModule.\n\nExample 7-11 Target ejb-compile\n\n```\n<target name=\"\
    ejb-jar\" depends=\"ejb-compile\">\n  <echo message=\"Create JAR file for EJB\"\
    \ />\n  <jar destfile=\"${ejb.jar}\" manifest=\"${ejb.meta}/MANIFEST.MF\">\n \
    \   <fileset dir=\"${ejb.module}\"/>\n  </jar>\n</target>\n```\n\n## Target ejb-jar\
    \ of ITSBankEJB\n\nTo create a JAR file of the EJB project, we use the <jar> task\
    \ to package the EJB JAR file. The <fileset> task specified the directory to package\
    \ in the EAR directory to generate later deployed code. Now we have only deployed\
    \ Java code.\n\nExample 7-12 Target ejb-jar\n\n```\n<target name=\"ejb-jar\" depends=\"\
    ejb-compile\">\n  <echo message=\"Create JAR file for EJB\" />\n  <jar destfile=\"\
    ${ejb.jar}\" manifest=\"${ejb.meta}/MANIFEST.MF\">\n    <fileset dir=\"${ejb.module}\"\
    />\n  </jar>\n</target>\n```\n\n## Target ejb-deploy of ITSBankEJB\n\nThe previous\
    \ section described how to generate the EJB JAR file. Before we install the EJBs\
    \ on an application server like WebSphere, we have to generate the deployed code\
    \ of the EJB JAR file. The deployment process involves examining the EJB code\
    \ and deployment information, and compiling WebSphere-specific code that links\
    \ the EJBs with the WebSphere container implementation. This target runs the WebSphere\
    \ tool ejbdeploy with the input and generates a new JAR file containing the deployed\
    \ code. To start the command line tool ejbdeploy, we have to be a root user or\
    \ a special user with permission in the Linux environment. The Ant <exec> task\
    \ helps to call ejbdeploy with the following arguments:\n\n- Name of the input\
    \ JAR file (deployed code)\n- Name of the working directory\n- Name of the output\
    \ JAR file (deployed code)\n- Option -quiet used only to display errors\n\nExample\
    \ 7-13 Target ejb-deploy\n\n```\n<target name=\"ejb-deploy\" depends=\"ejb-jar\"\
    >\n  <echo message=\"Create EJB deployed code for WebSphere using\"\n  <exec executable=\"\
    ${was.ejb}\">\n    <arg value=\"${ejb.jar}\"/>\n    <arg value=\"${ejb.project}\"\
    />\n    <arg value=\"${ejb.project}/ITSOBankEJB_deployed.jar\"/>\n    <arg value=\"\
    -quiet\"/>\n  </exec>\n  <move file=\"${ejb.project}/ITSOBankEJB_deployed.jar\"\
    \ tofile=\"${ear.project}/ITSOBankEJB.jar\" />\n</target>\n```\n\nThe Ant <move>\
    \ task moves the deployed JAR file to the ITSBankEAR directory. Later this directory\
    \ will be the ITSBankEAR .ear file. There is only one way to run Ant as a build\
    \ tool to generate deployed code. It is also possible to run the command line\
    \ for ejbdeploy, or to start the Assembly Tool within WebSphere Application Server.\n\
    \nNote: The ejbdeploy tool does not actually deploy EJBs into the application\
    \ server, it means it does not install them into an instance of the Application\
    \ Server.\n\nThe deployed code includes the RMI (Remote Method Invocation) stub\
    \ code generated by the rmic compiler.\n\n## Target WAR of ITSBankWeb\n\nThe Web\
    \ application has to be package in a WAR file. A WAR file is a JAR file with an\
    \ extended format: WEB-INF folder contains classes and a lib folder containing\
    \ libraries. The web.xml file in the WEB-INF directory describes the Web application\
    \ on the application server; if this file is missing or invalid, the WAR file\
    \ does not contain a Web application.\n\nTo generate war file in Ant we use the\
    \ <war> task; this task is a subclass of the <jar> task, and it supports all of\
    \ the parent task's attributes and elements. The parameters of the <war> task\
    \ in our example are:\n\n- warfile: The name and location of the created WAR file\n\
    - webxml: the web.xml file to be used as a deployment descriptor for WAR file\n\
    - manifest: Specify the manifest file\n\nThe <fileset> task specifies a collection\
    \ of files to package. All files and directories under the Web content directory\
    \ will be inside. The WAR file will be created in the ITSBankEAR directory.\n\n\
    Example 7-14 Generate war file ITSBankWeb.war\n\n```\n<target name=\"war\" depends=\"\
    ejb-deploy\">\n  <warfile src=\"${web.war}\" webxml=\"${webxml}\"\n       manifest=\"\
    ${web.meta}/MANIFEST.MF\">\n    <fileset dir=\"${web.content}\" />\n  </war>\n\
    </target>\n```\n\n## Target EAR of ITSO Bank example\n\nFinally, we have to create\
    \ the whole Enterprise Application as an EAR file. The WAR file of the Web application,\
    \ and the JAR file of the EJB project are available in the ITSBankEAR directory.\
    \ We created an EAR archive of this directory with the Ant <ear> task. This tasks\
    \ includes the following parameters:\n\n- destfile: The name and location of the\
    \ EAR file (destination)\n"
