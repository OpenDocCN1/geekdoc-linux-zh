    更加可靠、廉价、便携、易用且强大。


    ### 1.1.1 Linux 是可靠的


    由于 Linux 是由许多不同的程序员编写的，它的它的 Bug 更少，而且比任何其他操作系统都稳定得多。大多数操作系统的故障需要重启系统，但对于 Linux
    来说，你关闭系统的唯一时间是为了添加硬件。与终端用户相比，Linux 服务器以其运行数百天的能力而闻名。


