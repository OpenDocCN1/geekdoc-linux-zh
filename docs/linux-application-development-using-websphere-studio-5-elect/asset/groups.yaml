    \ 方法必须找到一个主键。主键由调用程序通过 `CheckBean(int method)` 提供。该方法返回主键。如果没有找到记录，则会抛出 `FinderException`。\n\
    \n## 示例 5-17 CheckBean 中的 ejFindByPrimaryKey() 方法\n\n```java\n/**\n * ejFindByPrimaryKey\n\
    \ */\npublic jms.ito.bean.CheckKey ejFindByPrimaryKey(\njms.itso.bean.CheckKey\
    \ primaryKey)\nthrows javax.ejb.FinderException {\n  System.out.println(\n   \
