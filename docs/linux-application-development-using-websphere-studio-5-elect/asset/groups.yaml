    # 8.3 Automatic deployment by tools


    This section describes the deployment (installation EAR file) with the non-graphical
    WebSphere administrative (wsadmin) scripting program; the uses of the available
    command line tools for WebSphere Application Server; and shows how to integrate
    the deployment process in the Ant script in Chapter 7, ‘Building a Web application
    with Ant’ on page 135.


    # 8.3.1 Installing application with the wsadmin tool


    Scripting is a non-graphical alternative that you can use to configure and manage
    the WebSphere Application Server. One manual way is to use only the administrative
    console (Web GUI) to configure and install your Enterprise Application.


    The Java application used for the WebSphere Application Server Advanced Edition
    Administrative Console in Version 4 has been replaced by a Web application, which
    edits use. The Version 5 Web-based console is expanded and improved over the Web-based
    console used for older version.


    The WebSphere Control Program (WSCP) available in Version 4, has also been replaced
    by a more flexible and coherent facility (known as wsadmin) which is available
    in all Version 5 versions. You can use wsadmin in interactive or batch modes and
    perform any operations that you can do with the administrative console. The wsadmin
    utility is based on IBM’s Bean Scripting Framework (BSF) and supports a variety
    of scripting languages, including JavaScript, Python, and Jacl (a Tcl derivative).


    The wasadmin tool provides an ability to execute scripts. It supports a full range
    of product administrative activities. This tool is located in the WebSphere/AppServer/bin
    directory. To invoke a script or using the commands object, you have to call the
    shell script wsadmin.sh We want to install the Enterprise Application ITSO Bank
    with the command object $AdminApp. We do not need to create a script to run this
    command.


    +   e. Click Next if you want to change the HTTP port number in the next window
    of the wizard.


    +   f. Click Finish to create a remote server file instance and a remote server
    instance. The server instances appear in the Server view. The remote file transfer
    appears in the Navigator view of WebSphere Studio Application Developer.'
