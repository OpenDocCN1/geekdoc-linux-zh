    \    }\n\n    /**\n     * setEntityContext\n     */\n    public void setEntityContext(javax.ejb.EntityContext\
    \ ctx) {\n        myEntityCtx = ctx;\n        System.out.println(\"CheckBean:setEntityContext():\
    \ START\");\n        // 获取数据访问对象\n        checkDAO = DAOFactory.getDAOFactory(1).getCheckDAO();\n\
    \    }\n\n    /**\n     * unsetEntityContext\n     */\n    public void unsetEntityContext()\
    \ {\n        myEntityCtx = null;\n        // 释放数据访问对象\n        checkDAO = null;\n\
    \    }\n...\n}\n```\n\n在 `ejCreate(CheckVO checkVO)` 中，我们从参数 `checkVO` 获取 `custid`\
    \ 和 `quantity`。将传入的值复制到 bean 中。然后，我们必须向 `check_reorder` 表插入一条记录，并查询客户表以获取传入 `custid`\
    \ 的抬头、名和姓。将新的 `requestid` 和客户信息复制到 bean 的值对象中。返回 bean 的主键。\n\n"
