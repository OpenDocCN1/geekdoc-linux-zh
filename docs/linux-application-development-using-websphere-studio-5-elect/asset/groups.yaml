    \ The WSAD5 database consists of the following tables:\n\n- Customer table - The\
    \ customer table contains the following information.\n\n| Column name | Type -\
    \ length | Key | Nulls | Description |\n| --- | --- | --- | --- | --- |\n| CUSTOMERI\
    \ | INTEGER - N/A | PK | NO | Customer ID |\n| TITLE | CHAR - 3 | | NO | Title\
    \ |\n| FIRSTNAME | VARCHAR - 30 | | NO | First name |\n| LASTNAME | VARCHAR -\
    \ 30 | | NO | Last name |\n| USERID | CHAR - 8 | | YES | User ID |\n| PASSWORD\
    \ | CHAR - 8 | | YES | Password |\n| PHONE | VARCHAR - 20 | | YES | Phone Number\
    \ |\n\n- Address table - The address table contains following information\n\n\
    Table 4-2 Address table\n\n| Column name | Type - length | Key | Nulls | Description\
    \ |\n| --- | --- | --- | --- | --- |\n| CUSTOMER | INTEGER - N/A | PK,FK | NO\
    \ | Customer ID |\n| STREET | CHAR - 20 | | YES | Street number, name |\n| CITY\
    \ | CHAR - 12 | | YES | City |\n| STATE | CHAR - 10 | | YES | State or country\
    \ |\n| ZIPCODE | CHAR - 10 | | YES | Postal code |\n\n- Customer account table\
    \ - The customer account table contains following information\n\nTable 4-3 Customer\
    \ account table\n\n| Column name | Type - Length | Key | Nulls | Description |\n\
    | --- | --- | --- | --- | --- |\n| CUSTOMER | INTEGER - N/A | PK,FK | NO | Customer\
    \ ID |\n| ACCID | CHAR - 8 | PK,FK | NO | Account ID |\n\n- Account table - The\
    \ account table contains following information\n\nTable 4-4 Account table\n\n\
    | Column name | Type - length | Key | Nulls | Description |\n| --- | --- | ---\
    \ | --- | --- |\n| ACCID | CHAR -8 | PK | NO | Account ID |\n| BALANCE | DEC -\
    \ (8,2) | | NO | Balance |\n| ACCTYPE | VARCHAR - 8 | | NO | Account type |\n\n\
    - Re-order Check table - The re-order checks table contains the following information\n\
    \nTable 4-5 Check_Reorder table\n\n| Column name | Type - length | Key | Nulls\
    \ | Description |\n| --- | --- | --- | --- | --- |\n| CK_RO_ID | INTEGER - N/A\
    \ | PK | YES | Customer Order ID |\n| FK_CUST | INTEGER - N/A | FK | YES | Customer\
    \ ID |\n| QUANTITY | INTEGER - N/A | | YES | Quantity |\n\n| Column name | Type\
    \ - length | Key | Nulls | Description |\n| --- | --- | --- | --- | --- |\n| STATUS\
    \ | VARCHAR - 15 | | YES | Status of order |\n| DATE_ORDERED | TIMESTAMP - N/A\
    \ | | YES | Date, time order |\n\nWe have not described the remaining tables since\
