    ## 6.6 使用 XML/XSL 代替 JSP 的动机


    本节将向你展示在 Struts Web 开发中，使用 XSLT 技术而非 JavaServer Page（JSP）的优势。Struts 是一种用于构建 Web
    应用程序的创新服务器端 Java 框架，由 Apache 软件基金会的 Jakarta 项目托管。本节展示了 Struts 中使用 Java Pages 的缺点，并建议使用一个名为
    StrCX 的开源框架，用 XML 和 XSLT 替换 JSP，以更好地分离逻辑与表现层。


    ### 6.6.1 Struts 结合 JavaServer Page 的缺点


    以下是使用 Struts 结合 JavaServer 技术时存在的缺点：


    - 开发者可以将应用程序逻辑嵌入到 JSPs 中。

    - JSP 语法不符合 XML 规范，无法保证生成的 XML HTML 输出是良好格式。

    - 开发者必须学习新的 API（Struts 标签库），这需要花费时间。

    - 每次更改后都需要重新编译，这在 JSP 中可能非常耗时。


    解决这些问题的方案可以是：


    - 分离逻辑与表现层。

    - 强制良好格式的 XML 和 HTML。

    - 易于分离不同的视图维度，如布局和样式。

    - 允许更快的开发周期。


    当使用带有 XSLT 技术的 Struts（称为 StrutsCX 时，可以实现这些解决方案。这是集成了 Castor XML 和 XSLT 但不包含任何
    JavaServer Pages 的 Struts。它代表了一个取代 JSP 技术的类框架。StrutsCX 也是开源的，可以从以下网站下载：


    ```

    http://it.cappuccinonet.com/strutscx/index.html

    ```


    ## 使用 Ant 构建 Web 应用程序


    本章提供了名为 Ant 的强大工具的概述。Ant 用于在 Linux 上构建和部署任何带有或不带集成开发环境的 Java 。涵盖以下章节：


    - Ant 哲学：描述了 Ant 在同构环境中的设计哲学和优势。


    - 配置环境使用 Ant：展示了如何在 Linux 上安装和配置 Ant。我们还将展示如何使用 Ant。


    - 使用 Ant 构建 J2EE 应用程序：展示了如何在独立环境中使用 Ant 构建 ITSO 银行示例。我们将使用第 59 页第5章“Enterprise
    JavaBeans 2.0”中的 Web 和 EJB 项目。


    ## 7.1 Ant 哲学


    Ant 是一种让你能够自动化构建过程的构建工具。在这种情况下，Ant 类似于 make 工具。Ant 专为 Java 开发设计，并支持部署过程。它是一个开源、平台无关的
    Java 构建工具。它使用 XML 进行数据操作，并使用 Java 作为执行语言。由于它使用 Java，因此 Ant 本身具有可扩展性。它可以用于小型到大型项目，或任何需要集成许多组件的软件项目。


    列出了我们认为 Ant 是一个极佳构建工具的原因：


    - 它具有非常简单的语法，易于学习。例如，简单的语法。

    - 它是跨平台的，因为可以在任何环境中使用。

    - 它支持 J2EE，例如。

    - 它可以自动化部署过程。

    - Ant 支持 NetBeans、Eclipse、Tomcat 等 IDE。

    - Ant 由 Apache 软件基金会项目开发。


    ## 7.2 配置环境使用 Ant


    Ant 的最新版本位于：


    ```

    http://www.apache.org/ant

    ```


    Ant 的最新版本是 1.5。要使用 Ant，你还需要安装 JDK。以下是步骤：


    - 1. 下载二进制 zip 包。

    - 2. 解压 zip 包：


    ```bash

    tar -xvf jakarta-ant-1.5.tar

    ```


    构建工具 Ant 现在已安装在 /usr/local。要使用 Ant 必须配置环境。每个用户都有自己的文件来设置环境。该文件会在每个 bash shell
    实例执行。示例 7-1 设置 bash_profile


    ```bash

    ANT_HOME=/usr/local/jakarta-ant-1.5

    JAVA_HOME=/opt/Java231

    PATH=$PATH:$JAVA_HOME/bin:$ANT_HOME/bin

    CLASPATH=$CLASPATH:$ANT_HOME/lib/ant.jar:$ANT_HOME/lib/xml-apis.jar:$ANT_HOME/lib/xercesImpl.jar

    export ANT_HOME, JAVA_HOME, PATH, CLASPATH

    ```


    调用你的用户配置文件来设置环境，运行 Ant 命令获取帮助信息：


    ```bash

    .bashrc_profile

    ant -help

    ```


    ### 7.2.1 使用 Ant 的基础


    Ant 脚本构建文件是用 XML 编写的。每个构建文件（build.xml）包含一个 project 元素。project 元素包含 target 元素，每个
    target 包含一组 task 元素。


    task 元素执行的功能如移动文件；编译项目；创建 JAR 包；或创建 EAR 包。


    属性（property）有一个名称和值。它通过 ${property,name} 引用，或者可以在整个构建文件中使用。属性值可以在构建文件内部设置，也可以从属性文件中外部获取。属性文件的优势是你可以为同一个构建文件设置不同的属性。你只需要更改属性文件来更改环境，而不需要修改构建文件。所有的操作系统路径都应该包含在此文件中。


    路径（path）是一组目录或文件的集合。Java 编译使用路径引用来确定使用的类路径。


