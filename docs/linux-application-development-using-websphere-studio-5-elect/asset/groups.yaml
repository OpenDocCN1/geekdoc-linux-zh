  mdcn: "\n检查图片。所有图片都必须与 servlet 在相同的包中，因为它使用了 `this.getClass().getResource(name);`\
    \ 语句来创建加载这两张图片的 URL。\n\n- ITSOBJB 中的 `jms.bean.RcvQ0SndQ2Bean.java` 是一个接收检查读取器的消息驱动\
    \ Bean（Message-driven Bean），它由 Entity Bean Check 创建。它也是 BMP Entity Bean Check\
    \ 的客户端程序。它会根据请求的 `ckroid` 生成一个主键（primaryKey）。该 MDB Bean 调用 Entity Bean Check 中的\
    \ `findPrimaryKey()`，并将 bean 返回的 `ejbLoad()` 值存储在值对象 `checkVO` 中。它将结果发回给 JSP `sndq0rc2`，`checkVO`\
    \ 中的所有值都被传递到回复队列 Q2。负责的方法应该是映射到回复队列 Q2 的消息处理，即 `pass2(custid, quantity, inserted,\
    \ requestedid, customer)`，下方的代码示例所示：\n\n## 示例 5-22 pass2 RcvQ0SndQ2Bean implements\n\
    \n```java\npublic class RcvQ0SndQ2Bean implements\n    javax.ejb.MessageDrivenBean,\
    \ javax.jms.MessageListener {\n    private javax.ejb.MessageDrivenContext fMessageDrivenCtx;\n\
    \    private javax.naming.Context jndiContext;\n}\n```\n\n```java\n/**\n * 转发到\
    \ Q2: passq2\n * 方法需要 jndiContext\n */\nprivate void passq2(int custid, int quantity,\
    \ int inserted,\nint requested, String customer) {\n    javax.jms.QueueFactory\
    \ qConnectionFactory;\n    qConnection = null;\n    javax.jms.Connection qConnection\
    \ = null;\n    javax.jms.Session qSession = null;\n    javax.jms.Queue queue =\
    \ null;\n    javax.jms.Sender qSender = null;\n    javax.jms.MapMessage message\
    \ = null;\n    try {\n        qConnectionFactory =\n            (javax.jms.QueueFactory)\
    \ jndiContext.lookup(\n                Constants.QUEUE_CONN_FACTORY_JNDI_NAME);\n\
    \        queue = (javax.jms.Queue) jndiContext.lookup(\n                Constants.QUEUE_DESTINATION_JNDI_NAME_Q2);\n\
    \    } catch (javax.naming.NamingException e) {\n        System.out.println(\"\
    RcvQ0SndQ2bean: JNDI lookup failed: \" + e.toString());\n    }\ntry {\n  qConnection\
    \ = qConnectionFactory.createQueueConnection();\n  qSession = qConnection.createSession(false,\n\
    \    javax.jms.Session.AUTO_ACKNOWLEDGED);\n  qSender = qSession.createSender(queue);\n\
    \  message = qSession.createMapMessage();\n  message.setInt(\"Custid\", custid);\n\
    \  message.setInt(\"Quantity\", quantity);\n  message.setInt(\"Inserted\", inserted);\n\
    \  message.setInt(\"Requestid\", requestid);\n  message.setString(\"Customer\"\
    , customer);\n  qSender.send(message);\n  System.out.println(\"RcvQ0SndQ2Bean:\
    \ Custid: \" + custid);\n  System.out.println(\"RcvQ0SndQ2Bean: Quantity: \" +\
    \ \n     quantity);\n  System.out.println(\"RcvQ0SndQ2Bean: Inserted: \" + \n\
    \    inserted);\n  System.out.println(\"RcvQ0SndQ2Bean: Requestid: \" + \n   \
    \ requestid);\n  System.out.println(\"RcvQ0SndQ2Bean: Customer: \" + \n    customer);\n\
    }\ncatch (javax.jms.JMSException e) {\n  System.out.println(\"RcvQ0SndQ2Bean:\
    \ Exception occurred: \" + \n    e.toString());\n}\nfinally {\n  if (qConnection\
    \ != null) {\n    try { qConnection.close(); }\n    catch (javax.jms.JMSException\
    \ e) {}\n  }\n}\n```\n\n- ITSOBankEJB 中的 `jms.itso.bean.RcvQ1SndQ2Bean.java` 与\
    \ RcvQ1SndQ0Bean.java 几乎相同，但它不是调用 Entity Bean Check 的 `home.findByPrimaryKey(primaryKey)`，而是将\
    \ `custid` 和 `quantity` 存储为 `checkVO` 的值对象，然后执行 `home.create(checkVO)` 方法。插入的值通过\
    \ `bean.getCheckVO();` 返回到一个新的值对象 `checkVO` 中。新 `checkVO` 中的值对象通过 `passQ2(int,int,int,String)`\
    \ 方法传递到队列 q2。\n\n- 带有数据访问对象的 BMP Entity Bean Check 应用于第 78 页的 5.1.2 节“EJB 2.0\
    \ Managed Entity Bean”中的描述。\n\n- ISO bean 示例还需要名为 ADS5 的 ISO Bank 数据库中的 checkorder\
    \ 客户表。ISO bean 示例设计用于演示在 WebSphere Application Developer V5 中开发 EJB 2.0 消息驱动 Bean\
    \ 和 Managed Entity Bean。在 Red Linux 8.0 下的 WebSphere Application Server V5.0 中，如果有数千个检查订单，必须确保从\
    \ q2 接收到的消息是由同一个 JSP 发起的。否则，可能一个 JSP 通过队列 Q0 或 Q1 接收到另一个 JSP 在队列 q2 生成的消息。产生消息的\
    \ JSP 和消费消息的 EJB 2.0 消息驱动 Bean 没有共同信息；这意味着消息是异步的。EJB 2.0 中的消息驱动 Bean 负责协调涉及 Entity\
    \ Bean 或 session bean 的任务，订阅特定消息并处理 bean 的操作。JSP 中的消息消费者部分仅在开发期间实现。这种方法在大多数使用\
    \ WebSphere Application Developer V5.0 运行的单用户情况下是可行的。这种情况下这种方法有效。如果打算将示例适配到生产系统，强烈建议消除\
    \ JSP 中的消息消费者部分以及消息驱动 Bean 中的转发部分。JSP 将发送检查订单并忽略。由于消息是异步的，不应等待回复。\n\n## 运行 ISO\
    \ bean\n\nISO bean 示例在 WebSphere Studio V5.0 和 Red Linux 8.0 的 WebSphere Application\
    \ Server V5.0 上进行了测试。使用了 Linux 版本 DB2。如果用户在测试服务器中创建了所需的表，并将 ITSOBankEAR 文件导入 V5.0\
    \ 服务器以运行 index.html 进行检查读取，控制台将出现以下消息。\n\n## 示例 5-23 ISO bean console\n\n```\n\
