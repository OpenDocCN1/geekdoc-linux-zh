    \ (J2EE 1.2) 和版本 5 (J2EE 1.3)\n- 允许 WebSphere Application Server 版本 4 的用户在不进行任何升级的情况下采用\
    \ Eclipse 版本 2\n- 使用 Eclipse 版本 2 平台\n\n## 版本 5 特性\n\n我们将简要描述该该版本特性：\n\n- J2EE\
    \ 开发环境：某些特性包括开发环境，其中包含对 EJB 2.0、servlet 2.3 和 JSP 1.2 的 J2EE 1.3 规范的支持。能够根据 J2EE\
    \ 1.2 和 1.3 规范生成代码。EJB-to-RDF 映射表，可使用自顶向下、自底向上和中间能力的工具编辑 EJB 与关系型数据库表之间的映射。用于创建、编辑和验证\
    \ EAR 文件。\n\n- 服务开发环境：某些特性包括对 UDDI 版本 2 的支持；浏览 UDDI 业务注册表以定位现有 Web 服务进行集成；支持 Web\
    \ 服务语言（WSIL）；以及测试在本地或远程运行的 Web 服务。\n\n- XML 开发环境：某些特性包括支持 UDDI 版本 2；使用 XPath 创建并\
    \ Web Web。\n\n- Web 开发环境：某些特性包括支持 XHTML。使用 JavaScript 及其级联样式表（CSS）编辑。\n\n- 团队协作：某些特性包括\
    \ ClearCase，当文件被移动、删除或重命名时进行。\n\n## 2.3.3 Linux 版 WebSphere Application Server\n\
    \nLinux 版 IBM WebSphere Application Server 作为 WebSphere 平台的基础，作为基于 Java 的安全、可用性和扩展性的服务器享有声誉。它提供了基于\
    \ Web 的。\n\n## 版本 5 的新之处\n\n该版本的某些新特性是：\n\n- 支持 J2EE 1.3、EJB 2.0、Servlet 2.3 和\
    \ JSP 1.2\n- 同时支持 WebSphere Application Server 版本 4 (J2EE 1.2) 和版本 5 (J2EE 1.3)\n\
    - 允许 WebSphere Application Server 版本 4 的用户在不进行任何升级的情况下采用 Eclipse 版本 2\n- 使用 Eclipse\
