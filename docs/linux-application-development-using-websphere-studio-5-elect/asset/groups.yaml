    # 4.3 JSP


    In this section, we will be using the ITSOBankWeb project and accountInfo.jsp
    to explain the basics of JSP and the use of SQL tag library, which are utilized
    by the Database Web Pages Web wizard. The accountUpdate.jsp uses similar library
    functions, we will not elaborate on this JSP. A simple example of the wizard can
    be found in the ITSOBankSelect project.


    JSPs are JavaServer Pages. They are portable across any platform. These are programs
    that run in the front and middle layer, acting as Web interface for requests that
    are coming from a user or HTTP clicks and database. In JSP you can add dynamic
    content using expressions. The tag <% and %> = at the start of the sequence makes
    a Java expression. This expression is evaluated at runtime. This allows the JSP
    to generate dynamic HTML. JSPs also allow you to write Java code. The syntax is
    the same as the expression, but without the sign. This Java code is known as a
    scriptlet. The accountinfo.jsp uses expressions and scriptlets. We will briefly
    describe how the taglib, session variables and connecting, query, and display
    database information is used in accountinfo.jsp:


