    # ## 8.2.1 IBM Agent Controller


    This section describes the installation and configuration of the IBM Agent Controller
    on Linux. We use the rpm-image to install Controller on Linux to run the following
    command:


    ```

    # rpm -ivh ibmrac-5.0.0.0-i386.rpm

    ```


    The IBM Agent Controller is successfully installed under Linux in the directory:
    /opt/IBMRAC


    # ### Configure and running the IBM Agent Controller


    Run the shell SetConfig.sh in the bin directory of the installation directory
    of the Agent Controller. Make sure you are a root user to start the process:


    ```

    /opt/IBMRAC/bin/SetConfig.sh

    ```


    Set up the following locations to your environment:


    +   * Installation directory of the Agent Controller

    * JDK installation directory (JAVA_HOME)

    * Installation directory of the WebSphere Application Server Version 2


    After this configuration, you have to start the Agent Controller:


    ```

    # /opt/IBMRAC/bin/RAStart.sh

    ```


