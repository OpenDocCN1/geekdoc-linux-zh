    \ comes up (Figure 8-15). Use the **Browse** ... button to specify the directory\
    \ where you stored the EAR file before (in our example: /opt/WebSphere/AppServer/installableApps).\
    \ Choose the **Local path.**\n\n![](img/88f7c0f0eff8122fc71c8c318ea660bf_179_0.png)\n\
    \n**Figure-8-15** Preparing for application install\n\n- 4. Click the **Next**\
    \ button.\n\n- 5. From the Default bindings frame, take the defaults setting and\
    \ click **Next**.\n\n- 6. Now walk through seven steps. From the *Step 1* in the\
    \ Preparing application frame, specify a directory to install the application.\
    \ (in our example: /opt/WebSphere/AppServer/installedApps/dhcp39065. The dhcp39065\
    \ directory is generally the nodename when the Application is installed. Type\
    \ **ITSOBankEAR** in the field Application Name (Figure 8-16).\n\n> **Note:**\
    \ The quantity of the steps depends on the contents of the EAR file. In our example\
    \ we have seven steps. If you have only a Web application to deploy, you might\
    \ be less than seven steps.\n\nAllows installation of Enterprise Applications\
    \ and modules\n\n-> Step 1: Provide options to perform the installation\n\nSpecify\
    \ the various options available to prepare and install your application.\n\n|\
    \ AppDeployment Options | Enable |\n| --- | --- |\n| Pre-compile JSP | |\n| Directory\
    \ to Install Application | /installedApps/dhcp3906 |\n| Distribute Application\
    \ | |\n| Use Binary Configuration | |\n| Deploy EJBs | |\n| Application Name |\
    \ ITSOBankEAR |\n| Create MBeans for Resources | |\n\n**Figure-8-16** Step 1:\
    \ Deployment options\n\n- 7. Click **Next** to come to the Step 2 Provide Listener\
    \ Ports for Messaging Beans sure the Listener Port is set to LP.\n\n> **Note:**\
    \ Remember that one port is mapped to one Message-driven Bean (defined in 5.1,\
    \ \"Java Message-driven Beans\" on page 60.)\n\n- 8. Click **Next** to come to\
    \ the Step 3 Provide JNDI Names for Beans, accept JNDI setting like the below\
    \ (Figure 8-17).\n\n| EJB | URI | JNDI Name |\n| --- | --- | --- |\n| ITSOBankEJB\
    \ | Check | ITSOBankEJB.jar_META-INF/ejb-jar.xml |\n| ejb/itso/ejb/CheckHome |\
    \ | |\n\n**Figure-8-17** Step 3: Provide JNDI names for beans\n\n- 9. Click **Next**\
    \ to come to the Step 4 Map virtual hosts for Web modules, accept the default\
    \ setting.\n\n- 10. Click **Next** to come to the Step 5 modules to application\
    \ servers; here specify for each module a target server or cluster. Accept the\
    \ default setting.\n\n- 11. Click **Next** to come to the Step 6 Ensure all unprotected\
    \ methods have the correct level; the application contains EJB 2.0 beans that\
    \ do not have permissions defined in the deployment descriptor for some of EJB\
    \ methods. For methods marked, authorization check is performed prior to their\
    \ invocation. Accept the default setting.\n\n- 12. Click Next to come to the Step\
    \ 7 Summary frame; click Finish to install the application.\n\n> **Note:** After\
    \ clicking Finish, if you receive an Out Of Memory exception and the application\
    \ does not install, your system might not have enough memory, or your application\
    \ might have too many modules in it to install successfully onto the server.\n\
    \n- 13. You have to receive the message: Application ITSOBankEAR installed successfully.\n\
    \n- 14. Click Save on the administrative console to save the changes to your configuration.\n\
    \n> **Note:** If you do any changes in the administrative console, you must save\
    \ the configuration, otherwise the changes will be lost.\n\n- 15. Click Logout\
    \ on the taskbar of the console. Change to the First Steps frame to Stop the Server,\
    \ or use the command line script stopServer.sh in the bin directory of the WebSphere\
    \ Application Server.\n\n> **Note:** You do not need to restart the application\
    \ after each installation. This step is only done when there are configuration\
    \ changes.\n\n## 8.1.5 Testing the application\n\nYou can now test your application\
    \ on the WebSphere Application Server:\n\n- 1. Start the Application Server again\
    \ with the First Steps frame.\n\n- 2. Open the Web browser with the specific URL:\n\
    \n```\nhttp://localhost:9080/ITSOBankWeb/index.html\n```\n\n## 8.2 Setting up\
    \ a server\n\nIn this section we want to publish the Enterprise Application inside\
    \ the WebSphere Studio Developer to deploy to a remote server like WebSphere Application\
    \ Server Version 5. With Application Developer you can deploy the application\
    \ to a remote server using a remote server instance and configuration. Before\
    \ you start, you have to make sure that the remote server has the following software\
    \ already installed:\n\n* IBM WebSphere Application Server Advanced Edition 5.0\
    \ for multiplatform\n* IBM Agent Controller\n* FTP server (optional)\n\n## 8.2.1\
    \ IBM Agent Controller\n\nThis section describes the installation and configuration\
    \ of the IBM Agent Controller on Linux. We use the rpm-image to install Controller\
    \ on Linux to run the following command:\n\n```\n# rpm -ivh ibmrac-5.0.0.0-i86.rpm\n\
    ```\n\nThe IBM Agent Controller is successfully installed under Linux in the directory:\
    \ /opt/ibmrac\n\n### Configure and running the IBM Agent Controller\n\nRun the\
    \ shell SetConfig.sh in the bin directory of the installation directory of the\
    \ Agent Controller. Make sure you are a root user to start the process:\n\n```\n\
    /opt/ibmrac/bin/SetConfig.sh\n```\n\nSet up the following locations to your environment:\n\
    \n* Installation directory of the Agent Controller\n* JDK installation directory\
    \ (JAVA_HOME)\n* Installation directory of the WebSphere Application Server Version\
    \ 5\n\nAfter this configuration, you have to start the Agent Controller:\n\n```\n\
    # /opt/ibmrac/bin/RAStart.sh\n```\n\nThe logging about the service is stored in\
    \ the servicelog.log file in the config directory. If the RAServer processes are\
    \ running, the Agent Controller is installed successfully. You can check the process\
    \ with the following command:\n\n```\n# ps -ef | grep RAServer\n```\n\n## 8.2.2\
    \ Creating a server for remote testing with Application Server\n\nWhen creating\
    \ a server in the Server view of WebSphere Studio Application Developer, you can\
    \ specify a remote server as server type if you wish to test on a remote installation\
    \ of WebSphere Application Server. In this case you have to do the following steps:\n\
    \n- 1. In the Server view of the Server perspective, create the server configuration\
    \ for the new remote Application Server: **New —> Server Instance and Configuration**.\
    \ Fill in and select in the fields below (Figure 8-18):\n\n  a. **Server Name**:\
    \ Enter a display name for the new server.\n  b. **Folder**: Enter a folder name\
    \ for the server.\n  c. Select **WebSphere Remote Server** as server type.\n\n\
    ![](img/88f7c0f0eff8122fc71c8c318ea660bf_183_0.png)\n\nFigure 8-18 Creating a\
    \ remote server instance\n"
