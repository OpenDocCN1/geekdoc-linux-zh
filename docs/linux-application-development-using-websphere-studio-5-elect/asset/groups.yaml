    \    <ACCTYPE>SAVINGS</ACCTYPE>\n  </CUSTOMER_CUSTACCT_ACCOUNT>\n</SQLResult>\n\
    ```\n\n### DTD 编辑器\n\n在 XML 视角下，在 Navigator 视图中双击 customerBalance.dtd 文件。该文件包含查询结果文件\
