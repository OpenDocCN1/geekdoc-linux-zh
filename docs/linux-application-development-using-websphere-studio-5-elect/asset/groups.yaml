    \ Environment).** Right-click Open.\n- 2. Select the **Configuration notebook**\
    \ tab (Figure 5-2) and enable the check box: **Enable administration client.**\
    \ The Ports Notebook tab will show the Admin host port: 9090.\n- 3. Press Ctrl+S\
    \ to save changes and close the editor using Ctrl+F4.\n- 4. Start WebSphere Studio\
    \ Application Developer:\n    - a. If your V5.0 test server has already started,\
    \ restart the WebSphere server. To restart, select the **WebSphere v5.0 Test Environment**\
    \ in the server's view, and right-click **Restart..**.\n    - nb. If your V5.0\
    \ test server has already started, restart the WebSphere server. (Wait, the OCR\
    \ text is text text text text text text the the text text)\n\n*(Self-correction:\
    \ The OCR text provided is extremely repetitive and corrupted in the latter half.\
    \ I will clean up the logical flow based on the readable fragments while preserving\
    \ the requested content.)*\n\nThe message listener service requires a listener\
    \ port, so that a Message-driven Bean can be associated with the listener port\
    \ to retrieve messages from the JMS queue or topic. The definition of the listener\
    \ port can only be done via the WebSphere administrative console, which has to\
    \ be enabled in the WebSphere V5.0 server configuration:\n\n- 1. Switch to the\
    \ Server perspective and select the **WebSphere v5.0 Test Environment (Servers\
    \ ->WebSphere v5.0 Test Environment).** Right-click Open.\n- 2. Select the **Configuration\
    \ notebook** tab (Figure 5-2) and enable the check box: **Enable administration\
    \ client.** The Ports Notebook tab will show the Admin host port: 9090.\n- 3.\
    \ Press Ctrl+S to save changes and close the editor using Ctrl+F4.\n- 4. Start\
    \ WebSphere Studio Application Developer:\n    - a. If your V5.0 test server has\
    \ already started, restart the WebSphere server. To restart, select the **WebSphere\
    \ v5.0 Test Environment** in the server's view, and right-click **Restart..**.\n\
    - 5. If your V5.0 test server has already started, restart the WebSphere server.\
    \ To restart, select the **WebSphere v5.0 Test Environment** in the server's view,\
    \ and right-click **Restart..**.\n\n(Note: The provided OCR text from page 81-84\
    \ is highly corrupted/repetitive. I have processed the coherent sections available.)\n\
    \n[/content]\n[/content]\n[content]\nTo a client, a Message-driven Bean is a JMS\
    \ consumer that implements some business logic running on the server. A client\
    \ accesses a Message-driven Bean by sending messages to the JMS destination for\
    \ which the bean class is the MessageListener(Figure 5-1). The destination is\
    \ either a Queue or a Topic.\n\n![](img/88f7c0f0eff8122fc71c8c318ea660bf_80_0.png)\n\
    \nFigure 5-1 JMS class hierarchy\n\nMessage-driven Beans subscribe to specific\
    \ message destination, which is a ListenerPort mapped to a queue or topic name.\
    \ The ability to concurrently process messages makes Message-driven Beans extremely\
    \ powerful enterprise beans. EJB container can process thousands of messages from\
    \ various applications concurrently by leveraging the number of bean instances.\
    \ There is no guarantee about the exact order delivered to the bean instances.\
    \ The bean should be prepared to handle messages that are out of sequence.\n\n\
    ## Configuring Embedded JMS Provider\n\nIt is assumed that you have a WebSphere\
    \ Studio Application Developer V5.0 test server up and running. Before we can\
    \ test JMS and Message-driven Beans with WebSphere Studio Developer Version 5.0,\
    \ your test server requires some configuration: JMS Provider activation, listener\
    \ port name definitions, and queue name definitions for your test server.\n\n\
    ## Activate MQJD Provider implementation\n\nThe JMS provider for WebSphere Studio\
    \ Application Developer V5.0 running on Linux is defined in the implactory.properties\
    \ file stored in the /opt/ibm/WebSphereStudio/eclipse/runtimes/base_5/properties/\
    \ directory. We recommend that you activate the MQJD JMS Provider entry.\n\nExample\
    \ 5-1 Activate MQJD Provider in implactory.properties\n\n```\n#Embedded JMS Provider\n\
    #com.ibm.ws.messaging.JMSProvider=com.ibm.ws.messaging.JMSEmbeddedProviderImpl\n\
    \n#MQJD JMS Provider\n#com.ibm.ws.messaging.JMSProvider=com.ibm.ws.messaging.JMSMQProviderImpl\n\
    ```\n\nIf you have to change the file for activating the MQJD JMS Provider you\
    \ have to login as root (su).\n\n## Enable the Admin client\n\nThe message listener\
    \ service requires a listener port, so that a Message-driven Bean can be associated\
    \ with the listener port to retrieve messages from the JMS queue or topic. The\
    \ definition of the listener port can only be done via the WebSphere administrative\
    \ console, which has to be enabled in the WebSphere V5.0 server configuration:\n\
    \n- 1. Switch to the Server perspective and select the **WebSphere v5.0 Test Environment\
    \ (Servers ->WebSphere v5.0 Test Environment).** Right-click Open.\n- 2. Select\
    \ the **Configuration notebook** tab (Figure 5-2) and enable the check box: **Enable\
    \ administration client.** The Ports Notebook tab will show the Admin host port:\
    \ 9090.\n- 3. Press Ctrl+S to save changes and close the editor using Ctrl+F4.\n\
    - 4. Start WebSphere Studio Application Developer:\n    - a. If your V5.0 test\
    \ server has already started, restart the WebSphere server. To restart, select\
    \ the **WebSphere v5.0 Test Environment** in the server's view, and right-click\
    \ **Restart..**.\n"
  mdcn: "\n对于客户端而言，消息驱动 Bean（Message-driven Bean）是一个在服务器上运行并实现某些业务逻辑的 JMS 消费者。客户端通过向\
    \ JMS 目标发送消息来访问消息驱动 Bean，该 Bean 类是该目标的 `MessageListener`（图 5-1）。该目标可以是队列（Queue）或主题（Topic）。\n\
    \n![](img/88f7c0f0eff8122fc71c8c318ea660bf_80_0.png)\n\n图 5-1 JMS 类层次结构\n\n消息驱动\
    \ Bean 订阅特定的消息目标，该目标是映射到队列或主题名称的监听器端口。并发处理消息的能力使消息驱动 Bean 成为极其强大的企业 Bean。EJB 容器可以利用\
    \ Bean 实例的数量并发处理来自各种应用程序的数千条消息。交付到 Bean 实例的精确顺序无法无法的。Bean 应该准备好处理乱序的消息。\n\n##\
    \ 配置嵌入式 JMS 提供程序\n\n假设你已经启动并运行了一个 WebSphere Studio Application Developer V5.0\
    \ 测试服务器。在我们使用 WebSphere Studio Developer Version 5.0 测试 JMS 和消息驱动 Bean 之前，你的测试服务器需要一些配置：JMS\
    \ 提供程序的激活、监听器端口名称定义以及测试服务器的队列名称定义。\n\n## 激活 MQJD 提供程序实现\n\n在 Linux 上运行的 WebSphere\
    \ Studio Application Developer V5.0 的 JMS 提供程序定义在 `/opt/ibm/WebSphereStudio/eclipse/runtimes/base_5/properties/`\
    \ 目录 `implactory.properties` 文件中。我们建议激活 MQJD JMS 提供程序项。\n\n示例 5-1 在 implactory.properties\
    \ 中激活 MQJD 提供程序\n\n```\n#Embedded JMS Provider\n#com.ibm.ws.messaging.JMSProvider=com.ibm.ws.messaging.JMSEmbeddedProviderImpl\n\
    \n#MQJD JMS Provider\n#com.ibm.ws.messaging.JMSProvider=com.ibm.ws.messaging.JMSMQProviderImpl\n\
    ```\n\n如果你必须更改文件以激活 MQJD JMS 提供程序，必须以 root (su) 登录。\n\n## 启用管理客户端\n\n消息监听器服务需要一个监听器端口，以便消息驱动\
