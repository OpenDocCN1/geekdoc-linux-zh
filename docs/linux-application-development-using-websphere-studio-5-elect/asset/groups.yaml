    | CITY | CHAR - 12 | | YES | 城市 |

    | STATE | CHAR - 10 | | YES | 州或国家 |

    | ZIPCODE | CHAR - 10 | | YES | 邮政编码 |


    - 客户账户表 (Customer account table) - 客户账户表包含以下信息


    表 4-3 客户账户表


    | 列名 | 类型 - 长度 | 键 | 是否为空 | 描述 |

    | --- | --- | --- | --- | --- |

    | CUSTOMER | INTEGER - N/A | PK,FK | NO | 客户 ID |

    | ACCID | CHAR - 8 | PK,FK | NO | 账户 ID |


    - 账户表 (Account table) - 账户表包含以下信息


    表 4-4 账户表


    | 列名 | 类型 - 长度 | 键 | 是否为空 | 描述 |

    | --- | --- | --- | --- | --- |

