    The book is divided into four parts: the Introduction, Web application development,
    building and deploying Web applications, and the Appendix. The ITSO Bank example
    is used in the Web application development, testing, and the deploying of Web
    application parts.


    The following is a list of topics that are covered in the Web Application Development
    section.


    ### 3.2.1 Web application using HTML, JSP, servlets, and JavaBeans


    This chapter consists of three projects. The ITSOBankSelectWeb project follows
    the model in Figure 3-12.


    ![](img/88f7c0f0eff8122fc71c8c318ea660bf_49_0.png)


    Figure 3-12 ITSOBankSelectWeb project model


    In this model, we show how to use JSP, servlets, and the database. The customer
    will request account balance information from the database as they submit the
    user ID and password for their account.


    The ITSOBankUpdateWeb project follows this model (Figure 3-13).


    ![](img/88f7c0f0eff8122fc71c8c318ea660bf_49_1.png)


    Figure 3-13 ITSOBankSelectUpdate project model


    In this model, we show how to use JSP servlet, JavaBeans, and database. The customer
    will be able to transfer the balance from one account to another. The customer
    will submit their account ID for their account(s).


    Both of the above models are then combined to produce the ITSOBankWeb project.
    Through this example we show the various technologies that you can use for your
    projects.


    ### 3.2.2 Using Enterprise JavaBeans with your Web application


    The ITSO Bank example follows this model (Figure 3-14).


    ![](img/88f7c0f0eff8122fc71c8c318ea660bf_50_0.png)


    Figure 3-14 ITSOBankEJB project model


    In the above model, the customer requests to re-order cheques. The customer will
    enter the customer ID and quantity. The request is then sent to a JSP program
    that consist of two main functions: sending and receiving. The sending function
    sends the request to the first queue (Q1). The queue passes the necessary information
    to the Message Driven Bean (MDB). The Message Drive Bean sends the information
    to the Entity Bean (EB), which performs the necessary SQL query to the backend
    database. Once the database is updated, a confirmation is send back to the EB.
    The EB sends this information to the MDB, which sends it to the second queue (Q2).
    The Q2 de-fivers the information to the JSP''s function.


    ### 3.2.3 Generating Web application using XML


    The ITSO Bank example follows this model (Figure 3-15).


    ![](img/88f7c0f0eff8122fc71c8c318ea660bf_51_0.png)


    Figure 3-15 ITSOBankXML model


    In this model, we show how to use JSP servlet, JavaBeans, and database. The customer
    will be able to transfer the balance from one account to another. The customer
    will submit their account ID for their account(s).


    Both of the above models are then combined to produce the ITSOBankWeb project.
    Through this example we show the various technologies that you can use for your
    projects.


    ### 3.2.4 Testing and deploying Web application


    The following is a list of topics that are covered in the Web Application Development
    section.


    The Deployment of applications


    We demonstrate how to install, configure, and deploy the application using WebSphere
    Studio. Also, the ITSOBankEJB project follows this model (Figure 3-16).


    ![](img/88f7c0f0eff8122fc71c8c318ea660bf_52_0.png)


    Figure 3-16 ITSOBankEJB project model


    ### 3.2.5 Database design for Web application


    The ITSO Bank example follows this model (Figure 3-17).


    ![](img/88f7c0f0eff8122fc71c8c318ea660bf_53_0.png)


    Figure 3-17 ITSOBankDatabase model


    In the above model, the customer requests to re-order cheques. The customer will
    enter the customer ID and quantity. The request is then sent to a JSP program
    that consist of two main functions: sending and receiving. The sending function
    sends the request to the first queue (Q1). The queue passes the necessary information
    to the Message Driven Bean (MDB). The Message Drive Bean sends the information
    to the Entity Bean (EB), which performs the necessary SQL query to the backend
    database. Once the database is updated, a confirmation is send back to the EB.
