    \ Check Entity Bean。点击 Finish 按钮，WebSphere Studio Application Developer V5.0 开始为\
    \ BMP Entity Bean 生成 RMIC 代码。\n\n# 部署描述\n\n让我们看看下面的部署描述。\n\n示例 5-19 CheckBean\
