  mdcn: "\n\n## 6.3.2 创建 SQL 查询\n\n在本节中，我们将描述创建 RDB 到 XML 映射的步骤 1、2 和 3：\n\n- 1. 在您的主目录下执行以下命令创建\
    \ XML 工作空间：\n  `wssappdev50 -data workspace_XML`\n- 2. 切换到 DB 窗口，右键点击 WSAD5 并选择\
    \ Reconnect（重连）。如果您需要重新连接到数据库，请使用以下变量：\n  **Connection name:** WSAD5\n  **Database\
    \ name:** WSAD5\n  **UserID:** db2inst1\n  **Password:** ******\n  **JDBC driver\
    \ class is:** db2java.jar\n- 3. 展开 WSAD5 连接并选择 WSAD(jdbc:db2:WSAD5) 数据库。\n- 4.\
    \ 右键点击并在弹出菜单中选择 **Import to Folder**（导入到文件夹）。\n- 5. 点击 **Browse**（浏览）并选择 **ITSOBankData**。该文件夹不存在，因此将由工具自动创建。\n\
    - 6. 在 **Data Definition**（数据定义）视图中展开 ITSOBankData 项目，并导航到位于 /Web Content/WEB-INF/databases\
    \ 的 statement文件夹。创建一个名为 **customerBalance** 的新 select语句。进入 select 查询表，替换默认的 SELECT\
    \ * 查询并保存编辑器内容。\n- 7. 要执行查询，点击此按钮：\n- 8. 按照图 6-2 所示输入变量。\n\n![](img/88f7c0f0eff8122fc71c818ea6bf137_0.png)\n\
    \n| Name | Type | Value |\n| :--- | :--- | :--- |\n| userid | CHARACTER | 'cust101'\
    \ |\n| :passwd | CHARACTER | 'ws' |\n\n图 6-2 变量输入。您应该得到如下结果（图 6-3）。\n\n| FIRSTNAME\
    \ | LASTNAME | BALANCE | ACCTYPE |\n| :--- | :--- | :--- | :--- |\n| | | | |\n\
    | Wolfgang | Sanyer | 10000.00 | CHECKING |\n| Wolfgang | Sanyer | 9826.26 | SAVINGS\
    \ |\n| Wolfgang | Sanyer | 5726.26 | SAVINGS |\n\n图 6-3 SQL builder 中的 SQL 查询结果，现在准备好移动到下一步了。\n\
    \n## 6.3.3 从 SQL 查询生成 XML\n\n在本节中，我们将描述创建 RDB 到 XML 映射的步骤 4：\n\n- 1. 从 SQL 到 XML\
    \ 创建转换文件非常简单，但在之前，我们必须创建一个包含企业级应用程序（Enterprise Application）的 Web 应用程序。使用企业级应用程序向导创建一个名为\
    \ BankEAR 的企业项目，并将其与名为 BankWeb 的新 Web 项目关联。现在您将有两个项目。\n- 2. 在 Navigator 视图的 libraries\
    \ 下展开 BankWeb 项目。确保 sqltoxml.jar 是可用的。您可以从文件系统中的以下位置获取它：`/opt/WebSphere/eclipse/plugins/com.ibm.tools.sqltoxml.jar`\n\
    - 3. 如果需要，将其导入到 BankWeb 项目。\n- 4. 打开 Data Definition 视角，选择 customerBalance 语句，右键点击并在弹出菜单中选择\
    \ Generate XML（生成 XML）。\n- 5. 在 XML from SQL Query 窗口中，验证您在此向导中提供的信息与图 6-4 所示完全一致。\n\
    \n![](img/88f7c0f0eff8122fc71c818ea6bf139_0.png)\n\n图 6-4 XML 从 SQL 向导\n\n- 6.\
    \ 您可能需要指定用户 ID 和密码。要指示它们，请在用户 ID 和密码的值周围使用单引号（参见第 118 页的图 6-2）。\n- 7. 打开 **Web\
    \ Perspective** 并选择 **Navigator** 视图。按照如下所示展开 **Web Content** 目录（图 6-5）。\n\n![](img/88f7c0f0eff8122fc71c818ea6bf140_0.png)\n\
    \n图 6-5 为 customerBalance 生成的文件\n\n您会注意到为 customerBalance 创建了五个文件。这些文件每个都具有不同的扩展名。您已成功生成了\
