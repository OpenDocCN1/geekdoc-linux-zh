    | FIRSTNAME | VARCHAR - 30 | | NO | 名字 |

    | LASTNAME | VARCHAR - 30 | | NO | 姓 |

    | USERID | CHAR - 8 | | YES | 用户 ID |

    | PASSWORD | CHAR - 8 | | YES | 密码 |

    | PHONE | VARCHAR - 20 | | YES | 电话号码 |


    - 地址表 (Address table) - 地址表包含以下信息


    表 4-2 地址表


    | 列名 | 类型 - 长度 | 键 | 是否为空 | 描述 |

    | --- | --- | --- | --- | --- |

