    # The eXtensive Markup Language


    In this chapter, we discuss the following sections:


    +   - XML tools in WebSphere Application Developer gives an introduction to the
    XML tools that are available in WebSphere Application Developer for Linux Version
    5.

    - Introducing ITSO Banking example using XML gives an introduction to the ITSO
    Banking example as used in this chapter.

    - Using the wizards to create XML from SQL shows how to create and generate XML
    from an SQL query. Also, describes how to use the various editors to update XML
    files.

    - Dynamically generating the XML from SQL describes the use of “SQLtoXML” class
    library with the example servlet.

    - Using the XSL debugger and transformation tools shows how the XSL debugger and
    transformation tools help you debug or transform XSL stylesheets.

    - Motivation to use XML/XSL instead of JSP gives a short opportunity to use XML/XSL
    with the XSLT technology instead of Java Pages in a Web application using Struts.'
