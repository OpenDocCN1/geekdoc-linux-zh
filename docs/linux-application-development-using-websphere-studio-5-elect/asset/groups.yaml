  - "[PAGE 91]\n\n# Example 5-2 EJB Deployment Descriptor entry for a Message-driven\
    \ Bean\n\n```\n<enterprise-bean>\n<message-driven id=\"Messagedriven_1034392674661\"\
    >\n  <ejb-name>RcvQoBean</ejb-name>\n  <ejb-class>itso.test.bean.RcvQoBean</ejb-class>\n\
    \  <transaction-type>Bean</transaction-type>\n  <acknowledge-mode>Auto-acknowledge</acknowledge-mode>\n\
    \  <message-driven-destination>\n    <destination-type>javax.jms.queue</destination-type>\n\
    \  </message-driven-destination>\n</message-driven>\n</enterprise-bean>\n```\n\
    \nYou will find following binding information in the IBM extension deployment\
    \ descriptor ejb-jar-bnd.xml.\n\n# Example 5-3 Binding Listener Port to a Message-driven\
    \ Bean\n\n```\n<ejbbinding xmlns:type=\"ejbnd:MessageDrivenBeanBinding\"\nid=\"\
    MessageDrivenBeanBinding_1034392526661\">\n  <listenerInputPortName=\"LPO\"/>\n\
    \  <enterpriseBean xmlns:type=\"ejb:MessageDriven\"\n  href=\"META-INF/ejb-jar.xml#RcvQoBean.java,1034392482387\"\
    />\n```\n\nWe now have to receive the message from queue Q0 and to implement business\
    \ logic within the onMessage method of the RcvQoBean.java code. To so, you need\
    \ knowledge about the architecture of messages in JMS.\n\nA JMS message is composed\
    \ of a header, optional properties, and an optional body. The message header contains\
    \ a set of fixed fields that are used to identify the message and help in routing.\
    \ Message properties are application related header fields the programmer can\
    \ set only on the sending side. They are read-only for the Message-driven Bean.\
    \ The message body can take five different forms:\n\n+   * TextMessage. The message\
    \ body is a Java string.\n* BytesMessage. A bytes message supports a body with\
    \ uninterpreted data. The message supports the methods of the DatalInputStream\
    \ and DataOutputStream interfaces from the Java I/O package.\n* StreamMessage.\
    \ A stream message has a body that is a stream of objects.\n* ObjectMessage. An\
    \ object message provides a body that can contain any Java object that supports\
    \ the serializable interface.\n* MapMessage. A map message supports the Map interface\
    \ and provides a body of name/value pairs."
  - "[PAGE 92]\n\nThe code snippet below uses the MapMessage interface. Expect receiving\
    \ a formatted message.\n\nExample 5-4 Completing the onMessage method with sample\
    \ code\n\n```\n/**\n * onMessage\n */\npublic void onMessage(javax.jms.Message\
    \ inMessage) {\n    javax.jms.MapMessage msg = null;\n}\n\ntry {\n    if (inMessage\
    \ instanceof javax.jms.MapMessage) {\n        msg = (javax.jms.MapMessage)inMessage;\n\
    \        int custid = msg.getInt(\"Custid\");\n        int quantity = msg.getInt(\"\
    Quantity\");\n        // Implement your business logic\n        System.out.println(\"\
    RcvQOBean: Custid: \" + custid);\n        System.out.println(\"RcvQOBean: Quantity:\
    \ \" + quantity);\n    }\n} else {\n    // Act on wrong message type accordingly\n\
    \    System.out.println(\"RcvQOBean: Wrong type.\");\n}\n} catch (javax.jms.JMSException\
    \ e) {\n    e.printStackTrace();\n    messageDrivenCtx.setRollbackOnly();\n} catch\
    \ (Throwable te) {\n    te.printStackTrace();\n}\n```\n\nThe on onMessage() method\
    \ defined for a MD bean leaves the parsing of the inbound message up to the application\
    \ programmer. The messages have to be in the right message format. If you expect\
    \ many message types on the same queue, this will lead to a chain of if-statements\
    \ in the Message-driven Bean.\n\nThe sample Message-driven Bean is now ready to\
    \ run. The bean consumes a message from listener port LP0 which was mapped to\
    \ destination queue Q0. The message type is checked and a map message with two\
    \ integers (Custid and Quantity) is received and written to your WebSphere Studio\
    \ Application V5.0 test server console."
