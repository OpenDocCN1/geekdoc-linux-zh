    # 6.1 XML tools in WebSphere Application Developer


    Following is a list of the visual XML development environments in WebSphere Studio
    Application Developer V5 for Linux:


    +   - Debug and edit XSL files with code assist


    +   - Create, view and validate DTDs, XML schemas, XML documents and XSL style
    sheets


    +   - Generate JavaBeans from XML


    +   - XML security contains a new digital signature wizard


    +   - Java XML/XSL script client that help you convert JavaBean data into a DOM
    tree


    +   - Generate XSL script that transform document that are defined mappings between
    XML documents


    +   - Generate an HTML or XML documents by applying an XSL stylesheet and XML
    document using the Xalan processor


    +   - Produce XML from an SQL query


    +   - Build mappings between DTD files and relational tables


    +   - Generate a document access definition (DAD) script, used by IBM DB2 XML
    Extender, to compose XML documents from existing DB2 data, or decompose XML documents
    into DB2 data


    +   - Create and execute XPath using the wizard


    The following list are the new functions in WebSphere Studio Application Version
    5:


    +   - New XML Debug Perspective to step visually through an XSL transformation
    script, highlighting the transformation. Debugging XSLs in now easy!


    +   - The powerful XSL wizards make creation of XSL sheets easily!


    +   - New XML Editor - XPath wizard creates visually and tests XPath expressions
    before adding to an XSL document.


    +   - Bean XML/XSL Client Wizard - Converts the data in a Java Bean (including
    EJBs) into a DOM tree


    +   - XML Security - Uses the advanced encryption technology for securing XML
    documents


    +   - XML Editor enhancements to associate XSL/DTD/XSD with an XML document. Simplifies
    document validation and transformation.'
