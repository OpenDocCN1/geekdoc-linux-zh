    \    <FIRSTNAME>Wolfgang</FIRSTNAME>\n    <LASTNAME>Sanyer</LASTNAME>\n    <BALANCE>10000.00</BALANCE>\n\
    \    <ACCTYPE>CHECKING</ACCTYPE>\n  </CUSTOMER_CUSTACCT_ACCOUNT>\n  <CUSTOMER_CUSTACCT_ACCOUNT>\n\
