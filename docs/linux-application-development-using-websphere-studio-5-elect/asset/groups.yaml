  mdcn: "\n\n## performServices 方法\n\nperformServices 方法用于执行用户身份验证。在我们的示例中，我们使用 JSP\
    \ 来执行此操作。Servlet 用作网关，将用户的请求和响应从前端传递到后端，最后返回给用户。\n\n示例 4-10 servlet 中的 performServices\
    \ 方法\n\n```java\npublic void performServices(HttpServletRequest request,\n   \
    \ HttpServletResponse response) {\n\n}\n```\n\n## performTask 方法\n\n在我们的示例中，performTask\
    \ 方法处理输入变量，但在在此之前，它会确保 performServices 方法没有任何需要为用户完成的服务。下一步将是获取 `nextPage` 变量，该变量将决定\
    \ servlet 将启动哪个页面，或者将通过 `dispatch` 方法执行什么操作。\n\n示例 4-11 servlet 中的 performTask\
    \ 方法\n\n```java\npublic void performTask(HttpServletRequest req,\n    HttpServletResponse\
    \ resp)\nthrows ServletException, IOException {\n    String nextPage;\n    try\
    \ {\n        performServices(req, resp);\n        nextPage = getInitParameter(req.getParameter(\"\
    command\"));\n    } catch (Exception ex) {\n        nextPage = getInitParameter(\"\
    error_page\");\n    }\n    dispatch(req, resp, nextPage);\n}\n```\n\n## dispatch\
    \ 方法\n\n`dispatch` 方法使用 `dispatch.forward` 函数传递输入变量。然后使用 `nextPage` 变量根据用户的请求启动下一个页面。\n\
    \n示例 4-12 servlet 中的 dispatch 方法\n\n```java\npublic void dispatch(\n    HttpServletRequest\
    \ req, HttpServletResponse resp, String nextPage)\nthrows ServletException, IOException\
    \ {\n    RequestDispatcher dispatch = req.getRequestDispatcher(nextPage);\n  \
    \  dispatch.forward(req, resp);\n}\n```\n\nServlet 的主功能是读取用户输入的任何数据、生成并格式化结果，以及将数据发回给用户。与传统的通用网关接口（CLI）和类\
    \ CGI 技术相比，Servlet 更加高效、可移植且强大。它们之所以高效是因为每个请求都是一个轻级的 Java 线程，而不是操作系统进程。由于 servlet\
    \ 是用 Java 编写的，因此具有可移植性。每个主要的 Web 服务器都支持 servlet。它们也是 Java 2 平台的一部分。总体来说，servlet\
    \ 变得强大且易用，因为它们比任何其他编程语言都更可靠且可用。\n\nWeb 部署描述符（Web Deployment Descriptor）包含有关 Web\
    \ 应用程序、servlet 映射和安全信息的通用信息。`web.xml` 的主要组件是 `web-app`、`display-name`、`servlet`、`servlet-mapping`\
    \ 和 `taglib` 标签。\n\n### web-app 标签\n\n在此标签中，你定义 Web 应用程序的名称。\n\n示例 4-13 Web 部署描述符中的\
    \ web-app 标签\n\n```xml\n<web-app id=\"WebApp\">...</web-app>\n```\n\n### display-name\
    \ 标签\n\n在此标签中，你定义 Web 应用程序在 WebSphere Application Developer 中显示的名称。\n\n示例 4-14\
    \ Web 部署描述符中的 Display-name 标签\n\n```xml\n<display-name>ITSBankSelect</display-name>\n\
    ```\n\n### servlet 标签\n\n在此标签中，定义了 servlet 的实际名称、显示名称及其初始参数。我们的示例中，初始参数包含了 servlet\
    \ 或 JSP 连接数据库时使用的 DB2 连接信息。\n\n示例 4-15 Web 部署描述符中的 servlet 标签\n\n```xml\n<servlet><servlet-name>accountInfo</servlet-name><display-name></display-name><jsp-file>/accountInfo.jsp</jsp-file><init-param><param-name>username</param-name><param-value>db2inst1</param-value></param-name></servlet>\n\
    ```\n\n### servlet-mapping 标签\n\n在此标签中，为你的 servlet 或 JSP 使用的 servlet 定义 servlet\
    \ 路径。\n\n示例 4-16 Web 部署描述符中的 Servlet-mapping 标签\n\n```xml\n<servlet-mapping><servlet-name>accountinfo</servlet-name><url-pattern>\n\
    accountinfo.jsp</url-pattern></servlet-mapping>\n```\n\n### taglib 标签\n\n在此标签中，为你的\
    \ servlet 或 JSP 使用的库定义库路径。\n\n示例 4-17 Web 部署描述符中的 taglib 标签\n\n```xml\n<taglib><taglib-uri>jpsql</taglib-uri><taglib-location>\n\
    WEB-INF/bin/jspql.jar</taglib-location></taglib>\n```\n\n## 4.5 JavaBeans\n\n\
    在本节，我们将使用 ITSOBankWeb、`confirmUpdate.jsp` 和 `updateBean.java` 来解释 JavaBeans 的基础知识，以及\
    \ JavaBean Web 页面向导使用的 SQL 库。在 ITSOBankWeb Web 项目中可以找到更更简单的示例。\n\n`confirmUpdate.jsp`\
    \ 有三个主要组件：类导入、Jsp `useBean` 标签和 `execute` 函数。以下是每个组件的简要描述。\n\n### 类导入语句\n\n页面指令（page\
    \ directive）用于导入包列表。在我们的案例，我们将导入 `updateBean` 类。\n\n示例 4-18 JSPs 中的类导入语句\n\n```jsp\n\
    <%@ page\nimport=\"updateBean\" contentType=\"text/html; charset=WINDOWS-1252\"\
    \npageEncoding=\"WINDOWS-1252\"\n%>\n```\n\n### Jsp useBean 标签\n\n这定义了带有 `id`\
    \ 和 `class` 的 `<useBean>` 标签。`id` 用于在 JSP 内部引用类文件。此语句允许你在 JSP 页面中加载 bean，然后通过将其绑定到指定的变量来实例化类对象。\n\
    \n示例 4-19 JSPs 中的 useBean 标签\n\n```jsp\n<jsp:useBean id=\"updateBean\" class=\"\
    updateBean\"/>\n```\n\n### execute 函数\n\n该函数用于传递 `newBalance`、`fromctID` 和 `toctID`\
    \ 变量，这些变量作为隐藏字段传递给 JSP。\n\n示例 4-20 JSPs 中的 execute 函数\n\n```jsp\n<% updateBean.execute(new\
    \ java.lang.Float(request.getParameter(\"newBalance\")), new java.lang.String(request.getParameter(\"\
    fromctID\")), new java.lang.String(request.getParameter(\"toctID\"))); %>\n```\n\
    \n"
