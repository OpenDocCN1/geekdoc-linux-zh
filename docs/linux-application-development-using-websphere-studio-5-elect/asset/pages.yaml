- pgno: 16
  md: '# Preface


    Linux is the fastest-growing server operating system in the world because of its
    powerful functionality, rock-solid stability, and open source foundation. Applications
    developed on Linux are reliable, portable, and cost efficient. IBM Redbook helps
    you get familiar with IBM middleware and tools for Linux, and develop your new
    Web application on Linux. The book is aimed to show IBM''s ability to provide
    an advanced platform for WebSphere application development using Linux as the
    operating system.


    The approach we have taken is to build an ITSO Banking example that has a backend
    database and a frontend e-business banking application. The Linux distribution
    that we use is Red Hat Linux Version 7.3.


    This book also shows you how to install the software to set up your development
    environment.


    # The team that wrote this redbook


    This redbook was produced by a team of specialists from around the world working
    at the International Technical Support Organization, Raleigh Center.


    Osamu Takagiwa is an Advisory IT Specialist at the International Technical Support
    Organization, San Jose Center. He writes extensively and teaches IBM classes worldwide
    on all areas of application development. Before joining itTO two years ago, Osamu
    worked at IBM Japan as an I/T Specialist.


    Bruno Holbusch is a European DBA working in the Application Services Group for
    Ford Motor Company in Germany. He has more than 14 years experience in system
    programming for networking components in VSE, VM, and MVS. He has 5 years of experience
    in writing Web applications for marketing and sales. During the last two years,
    he has concentrated on new technologies on the mainframe, such as Web Services,
    Linux, and JEE application serving. Bruno holds a bachelor''s degree in Electronic
    Engineering.


    Markus Mueller is a Senior IT Specialist with the IBM''s subsidiary, SerCon GmbH
    in Frankfurt, Germany. He has been with IBM for five years. His areas of expertise
    include AIX, Java, e-business, and e-infrastructure solutions. He specializes
    in software management, development, and deployment. Markus holds a bachelor''s
    degree in Electrical Engineering.'
  merge: -1
  img_proc: true
