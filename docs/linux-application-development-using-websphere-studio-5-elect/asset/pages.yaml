- pgno: 166
  md: "```\n<fileset dir=\"${ejb.module}\">\n  </fileset>\n  </jar>\n</target>\n```\n\
    \n# Target ejb-deploy of ITSOBankEJB\n\nThe previous section described how to\
    \ generate an undeployed EJB JAR file. Before we install the EJBs on an application\
    \ server like WebSphere, we have to generate the deployed code of the EJB JAR\
    \ file. The deployment process involves examining the EJB code and deployment\
    \ information, and generating and compiling WebSphere-specific code that links\
    \ the EJBs with the WebSphere EJB container implementation. This target runs the\
    \ WebSphere tool ejbdeploy with the input and generates a new JAR file containing\
    \ the deployed code. To start the command line tool ejbdeploy, we have to be a\
    \ root user or a special user with root permission in the Linux environment. The\
    \ Ant <exec> task helps to call the ejbdeploy tool with the following arguments:\n\
    \n+   * Name of the input JAR file (deployed code)\n* Name of the working directory\n\
    * Name of the output JAR file (deployed code)\n* Option -outlet used only to display\
    \ errors\n\nExample 7-13 Target ejb-deploy\n\n```\n<target name=\"ejb-deploy\"\
    \ depends=\"ejb-jar*\">\n  <echo message=\"Create EJB deployed code for WebSphere\
    \ using the\">\n  <exec executable=\"${was.ejb}\">\n    <arg value=\"${ejb.jar}\"\
    />\n    <arg value=\"${ejb.project}\"/>\n    <arg value=\"${ejb.project}/ITSOBankEJB_deployed.jar\"\
    />\n    <arg value=\"-quiet\"/>\n  </exec>\n  <move file=\"${ejb.project}/ITSOBankEJB_deployed.jar\"\
    \ntetofile=\"${ear.project}/ITSOBankEJB.jar\" />\n</target>\n```\n\nThe Ant <move>\
    \ task moves the deployed JAR file to the ITSOBankEAR directory. Later this directory\
    \ will be the ITSOBankEAR .ear file. There is only one way to run Ant as a build\
    \ tool to generate deployed code. It is also possible to run the command line\
    \ for ejbdeploy, or to start the Application Assembly Tool within WebSphere Application\
    \ Server.\n\nChapter 7. Building a Web application with Ant 147"
  merge: -1
  img_proc: true
- pgno: 167
  md: "> Note: The *ejbdeploy* tool does not actually deploy EJBs into the application\
    \ server, it means it does not install them into an instance of the Application\
    \ Server.\n\nThe deployed code includes the RMI (Remote Method Invocation) stub\
    \ code generated by the rmic compiler.\n\n# Target WAR of ITSOBankWeb\n\nThe Web\
    \ application has to be package in a WAR file. A WAR file is a JAR file with an\
    \ extended format: WEB-INF folder contains classes and a lib folder containing\
    \ libraries. The web.xml file in the WEB-INF directory describes the Web application\
    \ on the application server; if this file is missing or invalid, the WAR file\
    \ does not contain a Web application.\n\nTo generate war file in Ant we use the\
    \ <war> task; this task is a subclass of the <jar> task, and it supports all of\
    \ the parent task's attributes and elements. The parameters of the <war> task\
    \ in our example are:\n\n+   - warfile: The name and location of the created WAR\
    \ file\n- webxml: The web.xml file to be used as a deployment descriptor for WAR\
    \ file\n- manifest: Specify the manifest file to\n\nThe <fileset> task specifies\
    \ a collection of files to be package. All files and directories under the Web\
    \ content directory will be inside. The WAR file will be created in the ITSOBankEAR\
    \ directory.\n\nExample 7-14 Generate war file ITSOBankWeb.war\n\n```\n<target\
    \ name=\"war\" depends=\"ejb-deploy\">\n  <warfile src=\"${web.war}\" webxml=\"\
    ${webxml}\"\n       manifest=\"${web.meta}/MANIFEST.MF\">\n    <fileset dir=\"\
    ${web.content}\" />\n  </war>\n</target>\n```\n\n# Target EAR of ITSO Bank example\n\
    \nFinally, we have to create the whole Enterprise Application as an EAR file.\
    \ The WAR file of the Web application, and the JAR file of the EJB project are\
    \ available in the ITSOBankEAR directory. We created an EAR archive of this directory\
    \ with the Ant <ear> task. This tasks includes the following parameters:\n\ndestfile:\
    \ The name and location of the EAR file (destination)"
  merge: -1
  img_proc: true
