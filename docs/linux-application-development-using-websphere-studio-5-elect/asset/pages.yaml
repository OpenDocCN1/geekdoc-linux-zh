    applications and processes.

    - IBM Pervasive Products has products such as WebSphere Voice Server or DB2 Everyplace,
    which allows you to deliver any information over various network, using different
    devices.


    +   The *Transaction Servers and Tools* component consists of the products:

    - IBM Enterprise Modernization solutions, which use the IBM WebSphere software
    to help you develop the process, tooling, and infrastructure to transform your
    business into the world of e-business.

    - Transaction Processing Product has products such as IBM''s CICS Transaction
    Server, and other similar products that can handle more than thirty transactions
    per day.

