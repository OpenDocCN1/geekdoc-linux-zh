- pgno: 21
  md: '# 1.1 Linux as an operating system


    UNIX is an ancestor of Linux. It is an operating system that was created by Linus
    Trovals, a university student in Finland in 1991. He wrote the kernel based on
    the minix to make it like a UNIX-like operating system for desktops.


    Operating systems are simply software applications that control the computer.
    Most people use Microsoft Windows as their operating system. However, unlike the
    Windows operating system, Linux is much more reliable, cheaper, portable, easy-to-use,
    and powerful.


    # 1.1.1 Linux is reliable


    Since Linux is written by many different programmers, it is known to have fewer
    bugs, and it is much more stable than any other operating system. Application
    failure on most operating systems requires a reboot of the system, but for Linux
    the only time you turn off the Linux system is to add hardware, or to boot from
    a different kernel. Also, Linux servers are famous for their ability to run for
    hundreds of days, compared to the regular reboots required with a Windows system.
    This ends the enduser that Linux is very reliable.


    # 1.1.2 Linux is cheaper


    Open source software, compared to the traditional commercial software, has a huge
    impact on the computer industry. Once you purchase Microsoft Windows it has guidelines
    that must be followed for use within a business or at home. Also, it is impossible
    to get an upgrade without spending enormous amounts of time and money. On the
    other hand, can be found at no charge from the Internet. Once you become a part
    of the Free Software Foundation (FSF) you can copy GNU software and give it to
    anyone you choose. You can modify and distribute an improved version of the GNU
    software without any restrictions. The open source promotes security by allowing
    anyone to review the code and modify it as required. As the fixes are generated,
    they can be distributed much faster than commercial software.


    # 1.1.3 Linux is portable


    Many users like to have platform, vendor, and application independence. For example,
    the Microsoft Windows operating system cannot be loaded on just any computer.
    It has to meet very specific installation requirements, and the platform must
    be a variation of the Intel processor. Linux on the other hand, has a minimum
    specification, however, it is platform independent. Can be installed on a DEC
    Alpha, SUN Sparc, or 386/486-based computers. Computer can easily adapt to Linux.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# ### 1.1.4 Linux is easy-to-use


    UNIX Command Line Interface (CLI) was not appealing to many users, so Massachusetts
    Institute of Technology (MIT) released X to the public in 1988. MIT passed the
    development of X to the X Consortium. Within the XFree86 Project, Inc. now freely
    distributes the implementation of the X-Windows system. X is a graphical user
    interface that can run on Linux. X has two main advantages: it lets you configure
    the desktop to the n-th degree, and it allows users to access local and remote
    applications using very little resources.


    # ### 1.1.5 Linux is powerful


    Linux is capable and effective as an operating system, many users have come to
    think of Linux as being powerful. The cost of Linux compared to other operating
    systems is minimal. The stability has proven to be acceptable by many users in
    the computing environment. The constant headaches that are caused when an operating
    system crashes is clearly not the case when using Linux. Furthermore, be able
    to move from one platform to another without any difficulties is a major advantage
    in today''s changing environment. Also, Linux can work on any computer system.
    GNOME and K Desktop Environment (KDE) are free and easy-to-use desktop environments
    for all users, and they are also powerful application frameworks for many developers.
    The combination of the cost, stability, portability, and ease-of-use makes Linux
    powerful.


    # ### 1.2 IBM and Linux


    As stated in the IBM Web site, http://www.ibm.com/linux Linux is an open source
    platform that is stable, secure, and powerful. Some of the major players in the
    development of Linux are Red Hat, SuSE, Turbolin, and Caldera Systems. IBM joined
    to lay down the groundwork for co-marketing, development, training, and support
    initiatives, which encourage customers to use Linux for their business. IBM is
    committed to offering full hardware and software support for Linux to all IBM
    customers and business partners. Linux users can use IBM''s experience, resources,
    and skills to satisfy their technical needs. The open platform environment for
    running e-business applications enables IT professionals to build Web solutions
    independent of specific vendor software and hardware.


    Although there are many IBM products that are available for Linux, we focus on
    application development using WebSphere Version 5.0 on Red Hat Linux, Version
    7.3.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# 1.3 Web development on Linux


    This book is produced from a residency at the International Technical Support
    Organization (ITSO) in San Jose, California. The book is aimed to show IBM''s
    ability to provide an advanced platform for WebSphere Application Development
    using Linux as the operating system.


    The approach we have taken is to build an ITSO Banking example that has a backend
    database and a frontend-business banking application. The Linux distribution that
    we use is Red Hat Linux, Version 7.3. The IBM software we use is:


    +   * WebSphere Studio Application Developer, Version 5.0

    * WebSphere Application Server, Version 5.0

    * IBM HTTP Server, Version 1.3.19.3

    * IBM Database 2, Version 7.2, FixPak 7

    * IBMJava2, Version 1.3.1

    * IBM Remote Agent


    The ITSO Banking example is used to explain Web development using WebSphere on
    Linux. The following topics are covered in this book:


    +   * Dynamic Web page using servlet, JavaServer Pages (JSP), and JavaBeans

    * Enterprise JavaBeans with Message Driven Beans, and Session and Entity Beans

    * Development using eXtensible Markup/Stylesheet Language (XML/XSL) with JSP

    * Building and deploying using Ant


    In addition to the above, this book also shows you how to install the software
    to set up your development environment.'
  merge: -1
