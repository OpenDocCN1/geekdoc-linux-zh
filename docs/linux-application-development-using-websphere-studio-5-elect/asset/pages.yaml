  md: '# 8.3.2 Control the Application Server


    The WebSphere Application Server contains several command line tools that can
    be used to start, stop, and monitor WebSphere Application Server processes and
    nodes. These tools work on local server and nodes. They cannot operate on a remote
    server or node. In the section before you the wsadmin tool as command line tool
    to install the application. Now we want to show how to start and to stop the Application
    Server without the Administrator Console.


    # Start the Application Server


    Make sure, you have the access to run the shell scripts under the bin directory
    of the WebSphere Application Server. To start the Server run the *startServer.sh*
    script:


    ```

    # /opt/WebSphere/AppServer/bin/startServer.sh <servername>

    ```


    The server is started when the following message appears:


    Server <servername> open for e-business; process id is <ID>


    # Stop the Application Server


    Similar to the start of the Application Server run the Shell script *stopServer.sh*
    stop the server.


    ```

    # /opt/WebSphere/AppServer/bin/stopServer.sh <servername>

    ```


    The server is started when the following message appears:


    Server <servername> stop completed.


    # 8.3.3 Deployment with Ant


    This section describes the combination of the command line tools wsadmin and the
    build Ant. This build creates the ITSO Bank EAR file to deploy it on an Application
    Server. You know how to handle the wsadmin tool to install a new Enterprise Application
    and to *stop and start* the Application Server via the command line. This will
    be realized only with the <exec> task in Ant. See Figure 8-24. The build script
    is complete for the build and deployment process.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '![](img/88f7c0f0eff8122fc71c8c318ea660bf_192_0.png)


    # Update the properties file


    The properties file is the important configuration file of the build process.
    It includes all needed properties that are used in the build process of the operating
    system. To set the properties for the &lt;exec&gt; task, you have to add to your
    properties the following variables:


    +   # Properties of the WebSphere Application Server

    was.bin=/opt/WebSphere/AppServer/bin

    was.admin=wasadmin.sh

    was.stop=stopServer.sh

    was.start=startServer.sh

    appsrv.name=server1

    ear.install=$AdminApp install $(dest.ear)

    ear.uninstall=$AdminApp uninstall $(ear)

    save.config=$AdminConfig save


    In the next steps we want to add and explain the additional targets to the build
    file build.xml.


    First, you have to change in top of the project name the default target attribute
    from "ear" to "start-apprv". This target is our last target to install the application,
    and it depends on all the others. See below:


    ```

    <project name="ITSBankingExample" default="start-apprv">

    ```


    > Note: The Application Server should be before you are running the Ant script
    to install the Enterprise Application, otherwise, the service is not available
    to install.'
