  md: 'Since you have a good understanding of these perspectives, we will now describe
    the views that are in most perspectives.


    # 3.1.12 Workbench views


    Views are areas of navigating through the information in your Workbench. The perspective
    usually determines the type of view that you will require. For example, the Java
    perspective includes the Packages view and the Hierarchy view to help you work
    with Java packages and hierarchies.


    Here are the different views:


    +   Navigator - The most common view is the Navigator view. The Navigator panel
    shows how the resources are structured in different folders. These resources are
    files, folders, and projects.


    +   Outline - The Outline view gives you an overview of the key elements that
    make up the resource that is being edited. It allows quick and easy navigation
    through your resource. By selecting one of the elements in the Outline view, the
    line in the editor view that contains the selected element highlighted.


    +   Properties - When you click a resource in the Navigator view and then click
    the Properties tab at the bottom of the screen, you can view the properties of
    resource. The Properties view contains general things such as full path on the
    file system, the date when it was modified, and size.


    +   Tasks - The Task contains two types of elements: problems and tasks. Problems
    are todo issues that have to be resolved. Java compile errors, or broken links
    for HTML/JSP files. They are automatically added to the Task when working with
    the tool. When you double-click on a problem, the error for the file containing
    the problem opens, and the cursor is pointed at the location of the problem. The
    tasks can be manually added. For example, you can add a task that reminds you
    you have to implement a Java method. Place the cursor in the method''s implementation,
    right-click, and select Add -> Task. When you double-click, the file opens and
    the cursor is located in the method. You can also add general tasks that do not
    refer to a specific file.


    When you open a file, the software automatically opens the editor that is associated
    with the file. For example, an HTML editor is for .html, .htm and .jsp files.


    # 3.1.13 Workbench projects


    A project contains files and folders that are part of your application. In the
    Workbench, all folders and files must be contained in projects. Projects are'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'for building, version management, sharing, testing, and deployment. You can
    create different types of projects in WebSphere Studio; for example, Web and Java
    projects.


    We will briefly describe the different projects the are available in the Application
    Developer:


    +   - Java - Java projects are associated with the Java builder that compiles
    Java source files automatically. Java projects can be exported as JAR files or
    into a directory structure.


    +   - EAR - An Enterprise Application project is used to develop a J2EE enterprise
    application. An EAR project consists EJB modules, Web applications, and an application
    client.


    +   - Web - Web projects contain the resources needed for Web applications, including
    servlets, JSPs, Java files, static documents (for example HTML pages or images),
    and any associated metadata. A Web project is deployed as a Web module (WAR file).


    +   - EJB - EJB projects contain the resources for EJB applications. An EJB is
    deployed as an EJB module (JAR file).


    +   - Server - Server projects contain the necessary information to deploy application
    to an application server for testing.


    +   - Application Client - Application client projects are deployed as a JAR file.
    They contain the resources needed for application client modules.


    +   - Enterprise Application - Enterprise Application project contains the hierarchy
    of resources that are required to deploy an enterprise (J2EE) application. It
    contains a combination of Web modules, EJB modules, JAR files, and application
    client modules. It includes a deployment descriptor and an IBM extension document,
    as well as files that are common to all J2EE modules that are defined in the deployment
    descriptor. An Enterprise Application project is deployed in the form of an ear
    file.


