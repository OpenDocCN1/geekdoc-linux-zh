    # 7.3 Building JEE applications with Ant


    This section gives a general overview on how to build a J2EE application with
    the build tool Ant in the ITSO Bank example. These will mainly meet the requirements
    of developers and deployers who are building large scale J2EE applications with
    source code delivered by different teams or modules. For this community, it is
    interesting to have a powerful and simple build tool to reproduce the whole application.
    Ant is created to support the development aspect, but it can be used in bigger
    projects as a build and deployment tool.


    The ITSO Bank example is a J2EE Enterprise Application. This application includes
    a Web project and a EJB project, and is stored in CVS (Concurrent Versions System)
    as module names (Table 7-2). We use the CVS system to get all source code and
    configurations files out to start the ITSO Banking building file on a Linux environment.


    Table 7-2 Mapping JEE project to CVS module


    | Project name | CVS module name |

    | Enterprise Application Project | ITSOBankEAR |

    | Web Project | ITSOBankWeb |

    | EJB Project | ITSOBankEJB |


    The structure of the CVS module name also describes the directory structure on
    the Linux environment like the J2EE naming conventions. On the Linux file system,
    we will be creating the following structure for the build process (Figure 7-1).'
  merge: -1
  img_proc: true
