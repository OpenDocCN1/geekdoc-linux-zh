  md: "# 2.1 The IBM Framework for e-business\n\nHere we give an overview and explain\
    \ what the Framework can do for you.\n\nWhen building a successful e-business\
    \ application, you require an e-business Framework. A Framework environment consists\
    \ of guidelines to help develop e-business applications. The high-level architecture\
    \ element of the Framework includes the system and programming models. IBM has\
    \ already established a Framework for e-business, and has made it part of the\
    \ core of IBM's e-business software strategy. The Framework consists of products\
    \ and solutions to help customers build, run, and manage successful e-business\
    \ applications.\n\nIBM's Framework for e-business consists of the following: \n\
    \n+   - A commitment to accept and further industry standards, while providing\
    \ a multi-platform and multi-vendor solution.\n\n+   - Offer a design, development,\
    \ and deployment model that guides you the process of application development.\n\
    \n+   - State-of-the-art products that allow you to build and run e-business applications.\n\
    \nAs customers adopt to the Framework, they have access to many products and solutions.\
    \ Here are some of the advantages of using the IBM Framework for e-business:\n\
    \n+   - Reduce development time of an e-business application by using existing\
    \ solutions and state-of-the-art products.\n\n+   - Support for heterogeneous\
    \ client environments and integration standards, such as XML and Component Object\
    \ Request Architecture (CORBA)/Internet Inter-ORB Protocol (IIOP) which allow\
    \ exchange of applications and systems.\n\n+   - Support application protocols\
    \ such as Simple Mail Transfer Protocol (SMTP) and Post Office Protocol (POP)/\
    \ Internet Message Access Protocol (IMAP) which are used for e-mail and management\
    \ applications.\n\n+   - Support communication standards such as Secure Socket\
    \ Layer (SSL) and Transmission Control Protocol, or Internet Protocol (TCP/IP).\n\
    \n+   - And last not least:\n\n+   - IBM's commitment to support and enhance open\
    \ industry standards.\n\nThe IBM Framework for e-business helps you to deploy\
    \ and develop new or existing business applications, so that you can quickly operate\
    \ a dynamic e-business."
