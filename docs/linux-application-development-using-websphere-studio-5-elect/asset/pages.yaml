  md: '# Table 5-1 Data access modules for DB2


    | Data access module | Functional description |

    | --- | --- |

    | Constants.java | Installation dependent variable like JNDI names, queue factory
    names and queue data sources, user ID and password for DB2, etc. |

    | ConnectionPoolHelper.java | Delivers one connection to the data source using
    JNDI naming service. |

    | DataSourceNotFoundException.java | Extends exception and indicates that the
    database could not be found |

    | CheckDAO.java | The data access object interface |

    | DB2CheckDAO.java | The DB2 data access object contains the java coding of the
    data manipulation language |

    | DB2DAOFactory | The class extends the DAOFactory for DB2. Returns a connection
    and new DB2 data access object |

    | DAOFactory | Abstract class to get a vendor specific DAOFactories and data access
    objects |


    Each method in DB2CheckDAO closes the connection at the end of the method, allowing
    the EJB container to pool JDBC connections. The implementation of the data access
    objects make make use of connection pooling, which is a built-in function in the
    JDBC 2.0 specification and happens automatically. The data access objects performs
    the data manipulation with prepared statements. connection pooling and prepared
    statements are important performance improver. Prepared statements are cached
    by DB2 when executed on a connection. If a prepared statement is executed, DB2
    looks up the cache and if the statement has executed previously, it reuses the
    previous prepared version, which improves processing time.


