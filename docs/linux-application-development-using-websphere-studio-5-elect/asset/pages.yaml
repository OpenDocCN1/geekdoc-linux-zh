- pgno: 221
  md: '# # Linux Application Development Using WebSphere Studio


    **A comprehensive guide to Linux support of WebSphere development tools**


    Linux is the fastest-growing server operating system in the world because of its
    powerful functionality, rock-solid stability, and open source foundation. Applications
    developed on Linux are reliable, portable, and cost efficient. This IBM Redbook
    helps you get familiar with IBM middleware and tools for Linux, and develop your
    new Web application on Linux.


    **Develop, test, and deploy your Web application on Linux**


    This redbook is aimed to show IBM''s ability to provide an advanced platform for
    WebSphere application development using Linux as the operating system.


    **Setting up your Linux environment**


    The approach we have taken is to build an ITSO Banking example that has a backend
    database, and a frontend e-business banking application. The Linux distribution
    that we use is Red Hat Linux Version 7.3.


    This book also shows how to install the software to set up your development environment.


    # INTERNATIONAL TECHNICAL SUPPORT ORGANIZATION


    # BUILD TECHNICAL INFORMATION BASED ON PRACTICAL EXPERIENCE


    IBM Redbooks are developed by the IBM International Technical Support Organization.
    Experts from IBM, Customers and Partners from around the world create timely information
    based on realistic scenarios. Specific recommendations are provided to help you
    implement IT solutions more effectively in your environment.


    For more information: ibm.com/redbooks


