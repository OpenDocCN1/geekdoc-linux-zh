- pgno: 143
  md: '# 6.4 Dynamically generating XML from SQL


    In this section we want to dynamically generate XML from the SQL query at runtime
    using the SQLtoXML class library within a servlet. The library works with all
    JDBC databases, such as DB2, Oracle, or Sybase.


    The Figure 6-7 shows that the servlet calls to the SQLtoXML class library and
    transforms it into XML document (DOM Object), then by using the XSLT processor
    to transform to simple HTML.


    ![](img/88f7c0f0eff8122fc71c8c318ea660bf_143_0.png)


    Figure 6-7 Servlet access to get XML document


    The following steps describe more detail:


    +   1. The Hmtl page sends a form with user ID and password to the servlet via
    HTTP request, invoking the servlet doPost() method.

    2. The servlet filters the user ID and password from the HTTP request and invokes
    the SQLtoXML class library with two parameters.

    3. The SQLtoXML class library starts the access to the database and retrieves
    the data from the database like an XML document.


    > Note: The result of the SQLtoXML library in WebSphere Studio Application Developer
    Version 5 returns a XML document back. Earlier versions of WebSphere Studio return
    the result as stream data. No now parsing is necessary.


    +   4. The servlet gets an XML document from the SQLtoXML library and instantiates
    the XSLT Processor

    5. The Xsl stylesheet is applied and the HTML result page has been generated and
    transferred to the browser. The user can see his actual account balances.'
  merge: -1
  img_proc: true
