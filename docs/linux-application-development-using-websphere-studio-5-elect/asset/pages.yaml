- pgno: 161
  md: "# Setting properties and ant elements\n\nThe most important concept to understand\
    \ working with Ant is the meaning of the properties. Properties are loosely analogous\
    \ to variables in that they are mapped between names and values, and are very\
    \ similar conceptually to java.util.Properties. Ant properties depend on the context\
    \ of their use, denoted by ${property.name} within the build file.\n\nThe property\
    \ task allows a build file to define its own sets of properties. The variants\
    \ that we use are the name/value attribute, and loading a set of properties from\
    \ a build file.\n\nWe used a property tag in our build file to load the configuration\
    \ and setting data into our build process. The property file osamers1.properties\
    \ contains all needed settings of the build environment to build the J2EE application\
    \ without any written paths in the build file. To load the property file, we use\
    \ the property task. (See Example 7-2).\n\n7-2 Loading the property file osamers1.properties\n\
    \n```\n<project name=\"ITSOBankExample\" default=\"ear\">\n    <property file=\"\
    osamers1.properties\" />\n</project>\n```\n\n...\n\nThe values in the properties\
    \ file may also contain property references. We consider some lines in our property\
    \ file osamers1.properties. (See Example 7-3).\n\n7-3 Some code lines of the properties\
    \ file\n\n```\n# Properties of the ITSOBank project\nweb-ITSOBankWeb\nweb.project=$(home.build)/ITSOBankWeb\n\
    web.sources=${web.project}/Java Source\nweb.content=${web.project}/Web Content\n\
    web.classes=${web.content}/WEB-INF/classes\n...\n```\n\nIf the file is loaded\
    \ in the build file, you can refer to all properties in this file to make the\
    \ build file independent of any environment or operating system. This is also\
    \ helpful for the development in different teams. The teams can create their own\
    \ build file.\n\n> Note: In the example we used all environment variables from\
    \ the properties as an input for the build file. The build file is independent\
    \ and can be used in other applications."
  merge: -1
  img_proc: true
- pgno: 162
  md: "To set external libraries we need to have the directory called lib. In this\
    \ directory there are all the external libraries that we need in our application.\
    \ These libraries have to be available at the build time (runtime). We need to\
    \ use one library (j2ee.jar) to compile the source code of our project.\n\nThe\
    \ classpath can be simplified in the build file for the project. We use the path\
    \ element tag, which contains the pathname to set the location of the common libraries\
    \ to compile on runtime the Java source code. In our example we stored the common\
    \ libraries in the lib directory if they are not set in the class path of the\
    \ user (Example 7-4).\n\n# Example 7-4 Common library path\n\n```\n```\n<path\
    \ id=\"common.classpath\">\n  <patlement location=\"${lib.j2ee} />\n</path>\n\
    ```\n```\n\n# Target init\n\nThe first target to execute is the init target (Example\
    \ 7-5). All other targets in our build file depend upon this. It contains the\
    \ `<span>` task to set up properties, which include the timestamp information\
    \ like and date. The properties are available for the whole build file. To write\
    \ timestamp information as a message on the screen, we used the `<echo>` tag to\
    \ show the time and the starting date of our build file.\n\n# Example 7-5 Init\
    \ target in the build file\n\n```\n```\n<target name=\"init\">\n  <timestamp/>\n\
    \  <echo message=\"Build of the JZEE Project Banking example started at ${TSTAMP}\"\
    />\n</target>\n```\n```\n\nTo start only the target init on the command line type:\n\
    \nThe result of the command will be the current time and date. (See Example 7-6.)\n\
    \n# Example 7-6 Output after running the init target on command line\n\nBuildfile:\
    \ build.xml\n\ninit:"
