    The connection to the WSAD5 database we are using in the ITSO Bank sample database
    is built in the ConnectionPoolHelper.java. This utility class looks up the data
    source name and returns one instance of the connection to the WSAD5 database.
    It uses the singleton design pattern, so that we have never more than one connection
    to the database. Connectivity to the data source is created in a synchronized
    method during the first demand for connection to WSAD5.


    We implemented the abstract class DAOFactory where we can define more data access
    objects like the CheckDAO or other data access factories like DB2. The DB2 factory
    is coded in the class DB2DAOFactory, where we can get a connection to the WSAD5
    database and the check_reorder data access object DB2CheckDAO. A new instance
    of the CheckDAO for DB2 is called with CheckDAO checkDAO = DAOFactory.getDAOFactory(DAOFactory.DB2_DAO).getCheckDAO();
    If the data source is not found, an exception is thrown in DataSourceNotFound.java.
