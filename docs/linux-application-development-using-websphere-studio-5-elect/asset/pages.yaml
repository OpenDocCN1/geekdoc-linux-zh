    Call your user profile for setting up your environment, after run the Ant command

    to get the help messages back:


    ```

    $ .bashrc_profile

    $ -help

    ```


    # ## 7.2.1 Basics of using Ant


    The Ant scripts build files and are written in XML. Every build file

    (build.xml) contains one project element. A project element contains target

    elements, and each target contains a set of task elements.


    The task elements performs functions as moving a file; compiling a project;

    creating a JAR package; or creating an EAR package.


    A property has a name and a value. It is referenced by ${<property,name>}

    or can be used in the whole build file. Property values can be set inside a build
    file

    or be obtained externally from a property file. The advantage of property files

    is that you have different properties for only one build file. You only change
    the

    property file for changing your environment. You do not need to modify the build

    file. All operating system paths should be inside this file. This is useful for

    different test and development environments.


    A path is a set of directories or files. The Java compilation uses a path

    reference to determine the class path to use.


    In our ITSO Banking example, we want to use the following build-in tasks

    (Table 7-1).'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# Table 7-1 Build-In tasks of ITSO example


    | Build-in task | Description |

    | --- | --- |

    | ant | Runs Ant on a supplied build file |

    | move | Moves a file/directory to a new file/directory. The destination file
    if overwritten if it already exists by default adjustment |

    | echo | Output a message to the current System.out |

    | delete | Deletes files or directories or a set of files specified by one or
    more file sets |

    | javac | Compiles a Java source tree, the source and destination directory will
    be recursively scanned for Java source file to compile |

    | mkdir | Creates a directory |

    | tstamp | Sets properties containing date and time information. |

    | cvs | Handles packages/modules retrieved form a CVS repository |

    | jar | Jars a set of files in a Java archive file |

    | war | Creates a Web application archive including files that should end up in
    the WEB-INF/lib, WEB-INF/classes |

    | ear | Creates an enterprise application archive file similar to the JAR task.
    This file includes the whole enterprise application. |

    | exec | Executes a system command with Ant under the specified operation system
    |


    # # Run Ant


    After the Ant installation, we can execute a build file (*build.xml*) by simply
    typing ant at the command line prompt:


    ```

    $ ant [options] [target1] [target2] [target3] ...

    ```


    If a build file is not named *build.xml*, you will need to specify the build file
    name by using the -buildfile option:


    ```

    $ ant -buildfile [xml file] [target]

    ```'
