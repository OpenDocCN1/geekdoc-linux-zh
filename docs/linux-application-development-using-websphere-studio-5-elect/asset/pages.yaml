- pgno: 155
  md: '# 7.1 Philosophy of Ant


    Ant is a build tool that enables you to automate the build process. In this case,
    Ant is similar to the make tool make. Ant was designed specifically for Java development
    and to support the deployment process. It is an open source, platform, independent,
    and it is a Java build tool. It uses XML for data manipulation and Java as the
    execution language. Since it uses Java, Ant is inherently extensible. It can be
    used in small to large projects, or any software project that requires integrating
    many components.


    The following lists the reasons why we think Ant is a great build tool.


    +   - It has a very simple syntax that is easy to learn. For XML users, Ant is
    easy to use.

    - It is cross-platform because it can be used in any environment

    - It has build support for J2EE development, for example, EJB compilation and
    packaging.

    - It supports the deployment process outside the development environment. Ant
    gives the ability to automate the deployment process to other application servers
    via FTP and Telnet.

    - Open source Java project such as Apache, Tomcat, or Cactus uses Ant as their
    standard environment.

    - Ant supports Java-IDEs like NetBeans, Eclipse, jEdit, and WebSphere Application
    Developer.


    Ant was developed by the Apache Software Foundation as part of the Jakarta Project.
    Ant Version 1.5.1 is now released and can be downloaded from the following Web
    site:


    ```

    http://jakarta.apache.org/ant

    ```


    > Note: Ant Version 1.4.1 comes with WebSphere Studio Application Developer 5.0.
    You can update Ant in WebSphere Studio Application Developer.


    # 7.1.1 Build process approaches


    In an ideal world, the environment in which you develop would be homogenous. For
    example, same operating system, methodology, and tools. Unfortunately, this is
    not the case in most projects. Therefore, we have different ways that we can approach
    a build process to develop an application.'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'Stand-alone procedure, developers deliver source code, with the respective
    build files for their components. This code would most likely be delivered to
    a versioning system like CVS or ClearCase. A systems administrator would check
    out the code and build using a master build file. Many development teams use Ant
    under Linux to develop their components without a Integrated Development Environment
    (IDEs). This is a useful approach to a build/deployment process to support the
    whole development.


    # Integrated in WebSphere Studio


    WebSphere Studio Application Developer integrates all the necessary tools to effectively
    develop software at every stage in the software development cycle. The tool provides
    the Ant support as a built-in feature. Some functions are not supported (ebDeploy,
    earExport, warExport) as Tasks generally are in WebSphere Studio. It is possible
    to install an ANT plug-in to have those functionalities.


    # Headless


    In situations, it might be necessary to run the build process outside WebSphere
    Studio, but still keep its dependencies. In these situations, a Java wrapper can
    be built around Ant to understand these dependencies. One is provided at:


    ```

    http://www/7b.boulder.ibm.com/wsdd/library/techarticles/0203_searle/searle.html

    ```


    # 7.2 Setting up your environment to use Ant


    The latest version of Ant is available at the Ant Web page:


    ```

    http://jakarta.apache.org/ant

    ```


    Ant can be used successfully on several operating systems like Linux, Solaris,
    Windows, macOS X. To work with Ant you also need a JDK installed on your system,
    at least Version 1.1 or higher. In our installation we used the JDK of IBM Version
    1.3.1.


    Here are the steps:


    +   1. The newest version from the Apache Ant homepage. We used the actual version
    number 1.5.1. Download the binary GNU zip file in your download directory. (It
    is also possible to download and install the rpm image file.)


    +   2. Uncompress the GNU zip file and untar the tar file to the /usr/local directory:

