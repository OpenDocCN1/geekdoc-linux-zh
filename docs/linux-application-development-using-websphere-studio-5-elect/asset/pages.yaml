    # 4.2 HTML


    In this section, we will be using parts of the ITSOBankWeb login page and the
    login.html to explain the basics of HTML.


    HTML stands for Hypertext Markup Language. HTML is used to provide a simple markup
    language to create hypertext documents that are portable across platforms. The
    main components of HTML are the meta information, and HTML head and body. The
    Following is a brief description of what they are:


    +   - Meta information


    Example 4-1 Meta tags in HTML


    ```

    <!DOCTYPE HTML PUBLIC "//W3C//DTD HTML 4.01 Transitional//EN">

    <HTML>

    <META http-equiv="Content-Type" content="text/html">

    <META name="GENERATOR" content="IBM WebSphere Studio">

    ```


    In this component, you can show the version of the document, and date the document
    was created or updated.


    +   - HTML header


    Example 4-2 Header tags in HTML


    ```

    <HEAD>

    <LINK href="theme/Master.css" rel="stylesheet" type="text/css">

    <TITLE>-ITSO Banking Example</TITLE>

    </HEAD>

    ```


    In this component, you will usually see the title or a link to the stylesheet.
    The stylesheets helps towards the presentation of the Web Site. In the example
    above, the link element is an external link to style sheet. You can also import
    a stylesheet using the @import and a style attribute on an element inside the
    HTML body.'
