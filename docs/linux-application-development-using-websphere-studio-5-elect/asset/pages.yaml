  md: '# Building a Web application with Ant


    This chapter provides an overview of a powerful tool called Ant. Ant is used to
    build and deploy any Java application with or without an integrated development
    environment for Linux. This covers the following sections:


    +   - Philosophy of Ant, which describes the philosophy and advantages of Ant
    in a homogenous environments


    +   - Setting up your environment to use Ant shows how to install and set up Ant
    on Linux. We will also show how to use Ant.


    +   - Building a J2EE application with Ant shows how to build the ITSO Banking
    example using Ant in a stand-alone environment. We will be using the Web and EJB
    project from Chapter 5, “Enterprise JavaBeans 2.0” on page 59.'
