- pgno: 26
  md: '# 2.2 Models of the Framework


    As mentioned earlier, the high-level architecture element of the Framework includes
    the system and programming models. We will describe these models since they are
    the core of any development environment.


    # 2.2.1 The system model


    The Framework is based on an n-tier environment where a number of tiers of application
    logic and business services are separated into components that communicate with
    each other across a network. The basic form is a logical three-tier computing
    model.


    Figure 2-1 show a high-level system model for running an e-business application.


    ![](img/88f7c0f0eff8122fc71c8c318ea660bf_26_0.png)


    Figure 2-1 3-tier system model


    We will briefly describe the three tiers:


    +   - The first tier: This consists of the clients. Their main function is to
    present information and results produced by an application to the user. In system
    model, the clients are sometimes referred to as thin clients. This means that
    little or no application logic is executed on the client, hence, relatively little
    software is required to be installed on the client. The common element that ties
    these clients to the Web application server is their implementation of widely
    supported, Internet-based technologies and protocols; along with Java, which enables
    them to provide interaction between users and applications.

    - The second tier: This tier has a standards-based Web server that interacts with
    the client tier and defines user interaction. The Web application server'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'executes business logic independently of the client type and user interface
    style. It is implemented using various Internet and Java technologies, including
    the Hypertext Transfer Protocol (HTTP) server, and the Enterprise services, which
    enable rapid development and deployment of applications in a distributed network
    environment. Java servlets, JavaServer Pages, and Enterprise JavaBeans are examples
    of the components deployed in the Web application server. These server-side components
    communicate with their clients and other application components via HTTP or IOP,
    and the directory and security services provided by the network infrastructure.
    They can also leverage database, transaction, and groupware facilities.


    +   The tier: This tier mainly consists of Customer Information Control System
    (CICS) server, legacy applications developed on mainframes, legacy systems, or
    relational databases such as DB2.


    # 2.2.2 The programming model


    The application programming model highlights the software tools and products used
    to build, run, and manage e-business applications.The Framework is constantly
    evolving to support more industry standards, expand the product offerings, and
    make the methodologies stronger.


    Figure 2-2 shows the Framework for e-business.


    ![](img/88f7c0f0eff8122fc71c8c318ea660bf_27_0.png)


    Figure 2-2 IBM e-business Framework'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'We will briefly describe the three parts of the Framework:


    +   * Development Tools and Components: This component consists of the build tools.
    For example, WebSphere Studio or Domino Designer.


    +   * Application Server Software: The application servers include runtime environments
    that are available on all major platforms. The application server software should
    include collaboration, transaction, database, and integration.


    +   * Secure Network and Management Software: The Framework includes a complete
    portfolio of security and management products and services such as Tivoli.


    We have given you an introduction to the building blocks that are required when
    developing an e-business application. In the next section, we will elaborate on
    the WebSphere software platform, and the new additions to the WebSphere family.


    # 2.3 WebSphere Application Developer and Server


    WebSphere is an infrastructure for building e-business applications. WebSphere
    has evolved to meet the demands of the changing business environment by increasing
    the developer''s ability to build very complex solutions, and allowing tool integration
    to an open platform. Based on an Eclipse Framework, WebSphere has come a long
    way to provide everything a customer needs to build, deploy, and operate a dynamic
    e-business.


    Figure 2-3 is the WebSphere platform pyramid.


    ![](img/88f7c0f0eff8122fc71c8c318ea660bf_28_0.png)


    Figure 2-3 WebSphere platform pyramid'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'The WebSphere pyramid consists of the Foundation and Tools, Reach and User
    Experience. Business Integration, and Transaction Servers and Tools. Together
    these components close the gap between business strategy and information technology.
    We will discuss each component below:


    # Foundation and tools


    If you want to make a presence on the Internet, you will require a solid foundation
    and the latest tools. Having business processes and transactions on the Web allows
    your customers, partners, and employees to buy, sell, and share information anytime,
    anywhere. The WebSphere e-business infrastructure is about Web-enabling your business
    as fast as possible. For example, as stated in the IBM WebSphere Web site:


    > "...WebSphere Application Server, Version 5 provides rich-business application
    deployment capabilities for transaction management in a heterogeneous environment,
    comprehensive Web services support, increased security..."


    # Reach and use experience


    This can happen only after your e-business starts to grow. WebSphere e-business
    infrastructure allows you to provide any user or device access to customized content,
    therefore, allowing you to extend and personalize your e-business.


    # Business integration


    This is all about acquiring business agility by integrating and automating business
    processes. Delivering a customer''s e-business needs requires your business to
    have both the internal and external business processes integrated in the e-business
    environment. Once the employees, customers, suppliers, business partners, and
    e-marketplaces can connect with speed, efficiency, and agility, they can now provide
    dynamic e-business solutions.


    # Transaction servers and tools


    WebSphere infrastructure has the necessary features to integrate traditional assets,
    so that companies are not left wondering what they will do as the new technology
    revolutionizes the way people work and interact. As stated in the IBM WebSphere
    Web site:


    > "Leveraging these core software assets allows you to capitalize on existing
    investments, shorten deployment time for new e-business applications, and create
    real competitive advantage"'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'We have discussed briefly the WebSphere software platform. For more detailed
