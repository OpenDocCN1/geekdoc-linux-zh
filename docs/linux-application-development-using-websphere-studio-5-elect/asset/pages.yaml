- pgno: 35
  md: '# 3.1 Workbench fundamentals


    In Chapter 1, "What is Linux?" on page 1, we described Linux and its advantages.
    In Chapter 2, "WebSphere application development for Linux" on page 5, we introduced
    the foundation of WebSphere software platform and listed some of the new feature
    for WebSphere Studio Application Developer and Server Version 5. In this chapter
    we will show you the Workbench features that are available in the WebSphere software
    platform.


    Workbench is an integrated development environment (IDE) that has flexible perspectives.
    These perspectives contain views and editors that provide a common way for members
    of the development team to create, manage, and navigate resources. For example,
    a Java developer would work most often in the Java perspective, while a Web designer
    would work in the Web perspective.


    A perspective defines an initial set and layout of editors for performing a particular
    set of development activities. You can change the layout and the preferences that
    you have customized. One or more perspectives can be open in a single Workbench
    window. You can switch between perspectives in the same window, or you can open
    a new Workbench window.


    We will briefly describe the perspectives that are available in the Application
    Developer.


    # 3.1.1 Resource perspective


    This is the default perspective. This perspective is always shown at the top of
    the list when you select Window -> Open Perspective then Open from the menu. For
    a list of perspectives, select Other from the menu. Figure 3-1 shows the different
    perspectives that are available for your development.'
  merge: -1
  img_proc: true
