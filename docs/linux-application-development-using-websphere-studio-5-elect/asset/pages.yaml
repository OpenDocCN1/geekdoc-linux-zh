  md: '# 5


    # Enterprise JavaBeans 2.0


    This chapter provides the reader with an opportunity to learn about Enterprise
    JavaBeans application development, and deployment and testing with WebSphere Studio
    Application Developer Version 5.0. We will provide the ITSO Bank sample using
    EJBs, and we will walk through the operations necessary to implement business
    logic very quickly on a Web application server running on a Linux workstation
    or on a mainframe environment.


    Before we start to develop an EJB, we propose to refresh your mind with a short
    description of the major components found in the EJB Version 2.0 specification.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# 5.1 The types of Enterprise JavaBeans


    With EJB Version 2.0 there are now three types of Enterprise JavaBeans:


    +   - Message-driven Beans (MDBs). A MDB is a stateless Java component activated
    by messages that are mostly processed in asynchronous mode. According to the message
    paradigm, we distinguish between two messaging domains

    - Point-To-Point Messaging (PTP). This messaging domain is analogous to a mailbox,
    where the receiver decides when to open the message queue.

    - Publish/Subscriber Messaging (PUB/SUB). This messaging domain allows publishing
    one message for a specific topic to many receivers. Many clients, who subscribed
    to a message topic, can receive the message.


    +   Session beans. A session bean is a Java server-side component representing
    business logic or managing a process or a control flow. Session beans can come
    in two modes:

    - Stateless session beans

    - Stateful session beans


    +   Entity Beans. An Entity Bean is a Java server-side component that represents
    a business object and its associated data. Entity Beans divided by their form
    of persistence.

    - Bean-Managed Persistence (BMP). The bean itself is responsible for implementing
    object persistence.

    - Container-Managed Persistence (CMP). The container, which is the runtime environment
    for all beans, performs the persistence on behalf of the bean.


    # 5.1.1 Java Message-driven Beans


    Message-driven Bean is a new type of enterprise message consumer defined in the
    EJB 2.0 specification as an asynchronous message consumer. The bean is invoked
    by the container as the result of the arrival of a Java Message Service (JMS)
    message. The listener manager passes the message via a listener port to the bean.
    Message-driven Beans are stateless, server-side, and not distributed components.
    They do not have EJBOject and EJBHome references. They are invoked by the container
    as soon as an asynchronous messages are delivered from JMS. Once the message arrived
    at the queue, the EJB cannot wait to receive a JMS message.'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'To a client, a Message-driven Bean is a JMS consumer that implements some business
    logic running on the server. A client accesses a Message-driven Bean by sending
    messages to the JMS destination for which the bean class is the MessageListener(Figure
    5-1). The destination is either a Queue or a Topic.


    ![](img/88f7c0f0eff8122fc71c8c318ea660bf_80_0.png)


    Figure 5-1 JMS class hierarchy


    Message-driven Beans subscribe to specific message destination, which is a ListenerPort
    mapped to a queue or topic name. The ability to concurrently process messages
    makes Message-driven Beans extremely powerful enterprise beans. EJB container
    can process thousands of messages from various applications concurrently by leveraging
    the number of bean instances. There is no guarantee about the exact order delivered
    to the bean instances. The bean should be prepared to handle messages that are
    out of sequence.


    # Configuring Embedded JMS Provider


    It is assumed that you have a WebSphere Studio Application Developer V5.0 test
    server up and running. Before we can test JMS and Message-driven Beans with WebSphere
    Studio Developer Version 5.0, your test server requires'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'some configuration: JMS Provider activation, listener port name definitions,
    and queue name definitions for your test server.


    # Activate MQJD Provider implementation


    The JMS provider for WebSphere Studio Application Developer V5.0 running on Linux
    is defined in the implactory.properties file stored in the /opt/ibm/WebSphereStudio/eclipse/runtimes/base_5/properties/
    directory. We recommend that you activate the MQJD JMS Provider entry.


    Example 5-1 Activate MQJD Provider in implactory.properties


    ```

    #Embedded JMS Provider

    #com.ibm.ws.messaging.JMSProvider=com.ibm.ws.messaging.JMSEmbeddedProviderImpl


    #MQJD JMS Provider

    #com.ibm.ws.messaging.JMSProvider=com.ibm.ws.messaging.JMSMQProviderImpl

    ```


    If you have to change the file for activating the MQJD JMS Provider you have to
    login as root (su).


    # Enable the Admin client


    The message listener service requires a listener port, so that a Message-driven
    Bean can be associated with the listener port to retrieve messages from the JMS
    queue or topic. The definition of the listener port can only be done via the WebSphere
    administrative console, which has to be enabled in the WebSphere V5.0 server configuration:


    +   1. Switch to the Server perspective and select the **WebSphere v5.0 Test Environment
    (Servers ->WebSphere v5.0 Test Environment).** Right-click Open.

    2. Select the **Configuration notebook** tab (Figure 5-2) and enable the check
    box: **Enable administration client.** The Ports Notebook tab will show the Admin
    host port: 9090.

    3. Press Ctrl+S to save changes and close the editor using Ctrl+F4.

    4. Start WebSphere Studio Application Developer:


