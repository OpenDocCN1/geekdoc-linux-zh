- pgno: 194
  md: "# Target \"stop-appsrv\"\n\nThe target \"stop-appsrv\" uses the <exec> task\
    \ to start the Application Server on the command line with Ant, which uses the\
    \ existing shell script on the WebSphere/AppServer/bin directory. It depends on\
    \ the target \"save-config\".\n\n| dir | Installation bin-directory of the Application\
    \ Server |\n| executable | Name of the Shell script stopServer.sh |\n| arg value\
    \ | Name of the Application Server to stop |\n\nExample 8-5 \"stop-appsrv\"\n\n\
    ```\n<-- Target Application Server -->\n<target name=\"stop-appsrv\" depends=\"\
    save-config\">\n  <echo message=\"Stop Application Server\" />\n  <exec dir=\"\
    ${was.bin}\" executable=\"${was.stop}\">\n    <arg value=\"${appsrv.name}\" />\n\
    \  </exec>\n</target>\n```\n\n# Target \"start-appsrv\"\n\nThe target \"start-appsrv\"\
    \ uses the <exec> task to start the Application Server on the command line with\
    \ Ant. This target depends on \"stop\" to start the Application Server again.\n\
    \n| dir | Installation bin-directory of the Application Server |\n| executable\
    \ | Name of the Shell script startServer.sh |\n| arg value | Name of the Application\
    \ Server to start |\n\nExample 8-6 Target \"start-appsrv\"\n\n```\n<-- Target\
    \ Application Server -->\n<target name=\"start-appsrv\" depends=\"stop-appsrv\"\
    >\n  <echo message=\"Start Application Server\" />\n  <exec dir=\"${was.bin}\"\
    \ executable=\"${was.start}\">\n    <arg value=\"${appsrv.name}\" />\n  </exec>\n\
    </target>\n```\n\n# Run Ant\n\nThe build file is now modified and can run on the\
    \ command line in the build directory. The output of the StdOutput and StdError\
    \ can be stored in log files:\n\n```\n# ant 1>buildout.log -logfile buildErr.log\n\
    ```\n\nor use the Ant option -logfile <filename>\n\n```\n# ant -logfile build.log\n\
    ```"
  merge: -1
  img_proc: true
