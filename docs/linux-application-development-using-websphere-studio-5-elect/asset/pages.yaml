    # 6.6 Motivation to use XML/XSL instead of JSP


    This section will show you the advantages of XSLT technology instead of JavaServer
    Page in the Web development with Struts. Struts is an innovative server-side Java
    Framework designed to build Web applications, and is hosted by the Apache Software
    Foundation''s Jakarta Project. This section shows the drawback of Java Pages in
    Struts, and gives advice to use an open source Framework called StrCX for replacing
    JSP (JavaServer Pages) with XML and XSLT to better separate logic and presentation.


    # 6.6.1 Struts with JavaServer Page drawbacks


    The following drawbacks are represented to use Struts with the JavaServer technology:


    +   - The developer can be embedding application logic into the JSPs.

    - The JSP syntax is not XML compliant to guarantee that the resulting XML HTML
    output will be well formed.

    - Developers have to learn new APIs (Struts tag libraries) and it takes time.

    - Recompile time after every change, which can be time consuming with JSPs.


    The solutions for these problems can be:


    +   - Separate logic and presentation.

    - Enforce well-formed XML and HTML.

    - Ease the separation of different view aspects, like layout and style.

    - Allow for a faster development cycle.'
  merge: -1
  img_proc: true
