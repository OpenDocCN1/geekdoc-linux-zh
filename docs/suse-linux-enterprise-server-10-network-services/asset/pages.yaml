- img_proc: true
  md: '# Objective 8 Use YaST to Configure BIND


    YaST provides a module for the configuration of a name server. To start the module,
    select


    YaST2 > Network Services > DNS Server


    1-3


    ![](img/b7f4ef3c9bdffc8caed3395478c04bab_70_0.png)


    YaST is only able to decode manually created configuration and zone files if the
    files have a very specific structure.


    See the installation and administration guide for details. We want to have a closer
    look at another special aspect of SUSE Linux Enterprise Server 10 here.'
  merge: -1
  pgno: 70
- img_proc: true
  md: 'Besides /etc/named.conf, additional configuration files can be included. By
    default /etc/named.conf.include is searched for. This is defined at the end of
    /etc/named.conf:


    ```

    include "/etc/named.conf.include";

    ```


    Additional configuration files can be specified in /etc/sysconfig/named. The variable
    NAMED_CONF_INCLUDE_FILES has to contain the names of the configuration files to
    be included. If these filenames do not contain an absolute path, they have to
    be located in the directory /etc/named.d/.


    All relevant files (if they are specified in /etc/sysconfig/named) are copied
    to the respective subdirectories in the chroot environment (/var/lib/named/).
    For example, the BIND configuration file /etc/named.conf is copied to /var/lib/named/etc/named.conf.


    The content of the variable NAMED_CONF_INCLUDE_FILES is interpreted by the start
    script /etc/init.d/named.


    Additional options for starting the name server can be specified in /etc/sysconfig/named.'
  merge: -1
  pgno: 71
- img_proc: true
  md: '# Objective 9


    # Monitor the DNS Server


    In this objective, you learn about some tools that help to monitor your DNS server:


    +   - Use Command Line Tools to Query DNS Servers

    - Use rmdc to Control the Name Server

    - Check Configuration Files


    # Use Command Line Tools to Query DNS Servers


    Several command line tools are available to query DNS server. These include the
    following:


    +   - host Command

    - dig Command


    # host Command


    The most important command line tool for querying a DNS server is called host.
    The general syntax is as follows:


    host computer nameserver


    The following example shows how it is used:


    ```

    da51:~ # host da50

    da50.digitalirlines.com has address 10.0.0.50

    da51:~ # host 10.0.0.49

    49.0.0.10.in-addr.arpa domain pointer da49.digitalirlines.com.

    ```


    If a name server is not provided, host contacts the servers listed in /etc/resolv.conf.
    If you want to use another DNS server, you have to provide its IP address with
    the command.'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'By default, host returns the IP address or the host, depending on which information
    is given. If you want to query domain information, you need to use the option
    -t with the type of information required, as in the following:


    ```

    da51:- # host -t ns novell.com

    novell.com name server ns.novell.com

    novell.com name server ns1.westnet.net

    novell.com name server ns1.utah.edu

    da51:- # host -t mx novell.com

    novell.com mail is handled by 5 prv-mx.prova.novell.com

    novell.com mail is handled by 5 prvl-mx.prova.novell.com

    novell.com mail is handled by 5 minotaur.novell.com

    da51:- # host -t soa novell.com

    novell.com has SOA record ns.bwayne.novell.com

    2006053001 3600 900 604800 21600

    ```


    In this example, the host names of the DNS servers for the domain novell.com are
    requested.


    # dig Command


    A more verbose command is dig, which is normally used to troubleshoot DNS problems.
    The general syntax is as follows:


    ```

    dig @nameserver computer type query_options

    ```


    The options are listed in the following table:


    | Option | Description |

    | --- | --- |

    | nameserver | The IP address or name of the DNS server that should be queried.
    If not specified, dig checks all DNS servers listed in /etc/resolv.conf. |

    | computer | The resource record to query about (such as a host name, an IP address,
    or a domain name). |


    Table 1-5'
  merge: -1
  pgno: 73
- img_proc: true
  md: '# Table 1-5 (continued)


    | Option | Description |

    | type | The type of resource record to be returned, such as a (IP address), ns
    (DNS server), mx (mail exchanger), x (pointer), or any (all information). |

    | query_options | Defines how the query is done and how the results are displayed.
    Each query option starts with a plus sign (+). |


    The most important difference between host and dig is that dig does not use the
    domain list from /etc/resolv.conf by default to expand the host name. This means
    that the FDN or IP address of the host must be specified. If the domain list should
    be used, you need to use the query option +search.'
  merge: -1
  pgno: 74
