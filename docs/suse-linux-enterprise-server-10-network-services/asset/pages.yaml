  md: '# Configure Dynamic DNS


    # Objective 7


    You can modify the resource record sources of the name server dynamically without
    editing and reloading files. This is called dynamic DNS. Dynamic DNS can also
    be used by external servers like DHCP.


    ```

    allow-update { 127.0.0.1; };

    ```


    To edit the DNS records dynamically, use the command nsupdate:


    ```

    da51:- # nsupdate

    >

    ```


    > The security tool AppArmor is installed and enabled on SUSE Linux Enterprise
    10 by default. There is an AppArmor profile for BIND that prohibits nsupdate to
    change the BIND zone information. AppArmor is covered in the course SUSE Linux
    Enterprise 10 Security (Course 3075) in detail.


    > Stop the AppArmor daemon by entering rcapparmor stop to use nsupdate as described
    in the following.


    Before using nsupdate, make sure that all zone files have the correct access permissions.
    If they are not properly set, use the following commands:

    chgrp -R named /var/lib/named

    chmod -R g+w /var/lib/named'
  merge: -1
  pgno: 66
- img_proc: true
  md: 'Dynamic updates are stored in a journal file for the zone. This file is automatically
    generated by the server when the first dynamic update is performed. The name of
    the journal file is created by appending the extension .jnl to the name of the
    corresponding zone file. The journal file is in a binary format and should not
    be edited manually.


    The contents of the journal file are written to the zone file every 15 minutes.
    When the server is shut down, the contents of the journal file are written to
    the zone file, too.


    ![](img/b7f4ef3c9bdffc8caed3395478c04bab_67_0.png)


    Dynamic updates will change the layout of your zone files when the data is written
    to them. You should either use an editor or nsupdate to modify the zone information
    instead of using both tools.


    The most important nsupdate options are


    +   **server server [port].** Sends all dynamic update requests to the name server
    server.


    If no port number is specified, the default DNS port 53 is used.


    +   **update delete reference [ttl] [class] [type [value...]].** Deletes any resource
    records named reference.


    If the record type and value are provided, only matching resource records will
    be removed.


    The Internet class (IN) is assumed if class is not supplied.


    **ttl** is ignored. It is only allowed for compatibility.


    +   **update add reference ttl [class] type value....** Adds a new resource record
    with the specified ttl (in seconds), class and value.


    +   **send.** Sends the current message. This is necessary to actually execute
    the command. This is equivalent to entering a blank line.'
  merge: -1
  pgno: 67
- img_proc: true
  md: '# Configure a DNS Server Using BIND


    All commands are described in the man page of nsupdate: **man 8 nsupdate.**


    The following is an example of using nsupdate:


    ```

    da51:~ # nsupdate

    > server 127.0.0.1

    > update add da3.digitalairlines.com 86400 A 10.0.0.1

    >

    > update delete da3.digitalairlines.com A

    >

    > update add 13.0.0.10.in-addr.arpa 86400 PTR da13.digitalairlines.com

    ```


    This will generate messages like the following in /var/log/messages:


    ```

    May 20 11:13:58 da51 named[5161]: client 127.0.0.1#32781: updating zone

    ''digitalairlines.com/IN'': adding RR

    May 20 11:13:58 da51 named[5161]: journal file

    digitalairlines.com.zone.jnl does not exist, creating it

    May 20 11:13:58 da51 named[5161]: zone digitalairlines.com/IN: sending

    notifies (serial 2005051903)

    May 20 11:21:50 da51 named[5161]: client 127.0.0.1#32783: updating zone

    ''0.0.10.in-addr.arpa/IN: adding RR

    May 20 11:21:50 da51 named[5161]: journal file master/10.0.0.zone.jnl does

    not exist, creating it

    May 20 11:21:50 da51 named[5161]: zone 0.0.10.in-addr.arpa/IN: sending

    notifies (serial 2005051902)

    ```


    The journal files will be created automatically:


    ```

    da51:/var/lib/named # dir master/

    total 16

    drwxr-xr-x -- 2 root named 200 May 20 11:21 .

    drwxr-xr-x -- 9 root named 408 May 20 20:40 .

    -rw-r--r-- 1 root named 463 May 19 12:06 10.0.0.zone

    -rw-r--r-- 1 root named 814 May 20 11:21 10.0.0.zone.jnl

    -rw-r--r-- 1 root named 440 May 19 14:51 digitalairlines.com.zone

    -rw-r--r-- 1 root named 794 May 20 11:13 digitalairlines.com.zone.jnl

    ```


    Press Ctrl+D or enter to quit nsupdate.


    Copying all or part of this manual, or distributing copies, is strictly prohibited.
    To report suspected copying, please call 1-800-PIRATES.


    Version 1


    1-47'
