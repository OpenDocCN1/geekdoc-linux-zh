- img_proc: true
  md: '# Objective 2


    # Configure the DHCP Server


    To configure a Linux machine as a DHCP server, the following packages must be
    installed:


    +   - dhcp

    - dhcp-server


    The configuration is done using the files


    +   - /etc/sysconfig/dhcpd

    - /etc/dhcpd.conf


    before the service is started by entering


    # /etc/init.d/dhcpd start


    or


    # rcdhcpd start


    To start the DHCP daemon automatically every time the machine is booted, create
    the required symbolic links using inserv. When the DHCP server (dhcpd) starts,
    it reads the configuration parameters from the files /etc/sysconfig/dhcpd and
    /etc/dhcpd.conf.


    These files contain information about the server itself as well as information
    about which clients should be assigned addresses and domains. If changes have
    been made to the configuration, dhcpd must be restarted (or at least reloaded).


    To configure the DHCP server, you need to know the following:


    +   - The Configuration File /etc/sysconfig/dhcpd

    - The Configuration File /etc/dhcpd.conf

    - The Log File

    - Configure a DHCP Server with YaST'
  merge: -1
  pgno: 97
- img_proc: true
  md: '# The Configuration File /etc/sysconfig/dhcpd


    The file /etc/sysconfig/dhcpd contains configuration options which are submitted
    as parameters to the DHCP daemon when starting (see /etc/init.d/dhcpd). The first
    parameter defines the interface/ on which the DHCP server listens for requests.


    For example, if the DHCP server listens on the two interfaces eth0 and eth1, set
    the variable DHCPD_INTERFACE to


    ```

    DHCPD_INTERFACE="eth0 eth1"

    ```


    The DHCP server will listen only to the interfaces specified here.


    Starting with kernel 2.6, the names assigned to the network interface are not
    guaranteed to be permanent. The interface called eth0 might be called eth1 after
    the next reboot. (The names can only change after reloading the network kernel
    module.) This can be quite annoying if the DHCP server is not listening on all
    interfaces. You can rename interfaces in the file /etc/udev/rules.d/30-net_persistent_names.rules.
    For more detailed information, /usr/share/doc/packages/sysconfig/README.Persistent_Interface_Names.


    Two other variables enhance the security of the server:


    ```

    DHCPD_RUN_CHROOTED="yes"

    ```


    and


    ```

    DHCPD_RUN_AS="*dhcpd"

    ```


    The first of these variables configures the DHCP server processes to run in a
    chroot environment. The new root directory for all processes is /var/lib/dhcpd.'
  merge: -1
  pgno: 98
- img_proc: true
  md: 'SUSE Linux Enterprise Server 10: Networking Services


    The second variable defines the user to be used for running the processes. Normally
    there is no reason to change the default settings of these variables.


    The DHCP server can read additional configuration files that are included in the
    main configuration file. As the server processes running in a chroot environment,
    these additional configuration files have to be copied into the chroot environment,
    too. The files will be copied automatically when the DHCP server is starting,
    if they are listed in /etc/sysconfig/dhcpd.


    The following is an example:


    ```

    DHCPD_CONF_INCLUDE_FILES="/etc/dhcpd.conf.shared /etc/dhcpd.conf.d"

    ```


    As shown, the name of a directory can also be provided. All files located in this
    directory will be included.


    Use the option DHCPD_OTHER_ARGS if you want to start the dhcpd with some special
    arguments.


    The arguments are described in the man page of dhcpd (man 8 dhcpd).


    ![](img/b7f4ef3c9bdffc8caed3395478c04bab_99_0.png)


    # The Configuration File /etc/dhcpd.conf


    The configuration file for the DHCP server is /etc/dhcpd.conf. Global definitions
    are made at the top of the configuration file. The parameters defined here apply
    to all subsequent sections unless they are explicitly overwritten in the respective
    sections. The entries in the configuration file belong to two categories:


    +   - Parameter statements. They describe


    +   - How to do something (for example, define the time to an IP address is assigned)


    Copying all or part of this manual, or distributing such copies, is strictly prohibited.
    To report suspected copying, please call 1-800-PIRATES.


    2-8


    Version 1'
  merge: -1
  pgno: 99
- img_proc: true
  md: 'Use DHCP to Manage Networks


    +   - Whether to do something (for example, whether IP addresses should be assigned
    to unknown clients)


    +   - Which parameters should be provided to clients (for example, the IP address
    of the default gateway)


    +   - **Declarations.** They describe the topology of the network, for example,
    describe the clients, or provide the address ranges from which to server clients.


    Each statement have to be terminated using the semicolon (";").


    In case of an error in the configuration file, dhcpd will not start but will print
    out an error message. This message can be used to locate the error in the configuration
    syntax.


    To check the syntax of the configuration file without starting the DHCP server,
    use the start script with the parameter **syntax-check**:


    ```

    da51:~ # rcdhpcd syntax-check

    Checking syntax of /etc/dhcpd.conf.

    Config is okay. Hope you also specified existent network devices; )

    Lease file is okay

    da51:~ #

    ```


    SUSE Linux Enterprise Server 10 ships with a sample configuration file for the
    DHCP server. You will not need all the statements that are provided with this
    sample file. It is better to start with an empty configuration and to enter only
    those statements you really need.


    Information on the configuration of the DHCP server is available at several locations:


    +   - The man pages on your local system:


    +   - **man dhcpd** (DHCP server)


    +   - **man dhcpd.conf** (configuration file)


    +   - **man dhcpd-options** (configuration options)


    +   - In directories on your local system:


    Copying all or part of this manual, or distributing such copies, is strictly prohibited.
    To report suspected copying, please call 1-800-PIRATES.


    Version 1 2-9'
  merge: -1
  pgno: 100
- img_proc: true
  md: '+   - /usr/share/doc/packages/dhcp/

    - /usr/share/doc/packages/dhcp-server/


    +   On the web:

    - http://www.isc.org/products/DHCP/

    - http://www.dhcp-handbook.com


    +   In books:

    - Ralphs Droms and Ted Lemon, The DHCP Handbook (Sams Publishing)


    We will explain how to configure DHCP in the following steps:


    +   - A Simple Configuration

    - Assign Fixed Addresses

    - Group Host Declarations

    - Configure DHCP Pools

    - Use Classes


    # A Simple Configuration


    Comments can be used at any location in the configuration file. They start with
    the hash sign (“#”). The rest of the line after the hash sign will be ignored.


    The configuration file starts with the following lines:


    ```

    #

    # /etc/dhcpcd.conf

    #

    dns-update-style none;

    ```'
  merge: -1
  pgno: 101
- img_proc: true
  md: 'Starting with DHCP server version 3, dynamic updates of a DNS server are possible.
    This means when the DHCP server assigns an IP address to a client, it can update
    the corresponding information on the DNS server. The statement describing how
    to do this dynamic update (ddns-update-style) is mandatory. If no dynamic update
    is done (as in this example), specify none as the parameter to this statement.


    The following are statements on the lease times (the validity period for assigned
    IP addresses):


    ```

    # specify default and maximum lease time

    #

    default-lease-time 86400;

    max-lease-time 86400;

    ```


    When a client requests an IP address without providing any information on the
    desired lease time, the IP address will be assigned for the specified default
    lease time (in this example 86400 seconds, which is one day).


    ![](img/b7f4ef3c9bdffc8caed3395478c04bab_102_0.png)


    At maximum you can enter a number of $2^{31}-1$ seconds for the lease time. That
    is about 68 years.


    Shortly before the assigned IP address expires, the client will request a renewal
    of the address. Normally, the lease time for this address will be extended.


    Depending on its configuration, a client can request a specific lease time. Normally,
    this specific lease time request is accepted. We have to distinguish the two cases:


    +   - If the requested lease time is shorter than the default lease time, the
    DHCP server will assign the IP address for the requested time.'
  merge: -1
  pgno: 102
- img_proc: true
  md: 'If the requested lease time is longer than the default lease time and if no
    maximum time has been specified the DHCP server will accept this. If the statement
    max-lease-time is present, this time will be the longest available.


    In the example above, both times are the same. Setting a maximum lease time prohibits
    clients from requesting an infinite lease time (resulting in a permanent IP address).


    In the next step, provide information on the DNS domain to be used:


    ```

    # What What is the DNS domain and where is the name server?

    # option domain-name "digitalairlines.com";n# option domain-name-servers 10.0.0.254,
    10.0.0.2;

    ```


    These configuration options start with the keyword option.


    If a list of name server addresses (separated by commas) is provided, the list
    reflects the order of preference for contacting a name server.


    As the last parameter, specify the addresses of routers in subnet:


    ```

    # This is a router

    #noption routers 10.0.0.254;

    ```


    If several routers are specified here (separated by commas), the list reflects
    the order of preference for using these routers. The first router is the default
    gateway.'
  merge: -1
  pgno: 103
- img_proc: true
  md: "Finally, you need the declaration describing the range of addresses that can\
    \ be used for assigning IP addresses to clients. This declaration starts with\
    \ the keyword subnet and specifies the subnet and corresponding network mask:\n\
    \n```\n# # Which IP addresses may be assigned to the clients?\n# subnet 10.0.0.0\
    \ netmask 255.255.255.0\n{\n  range 10.0.0.101 10.0.0.120;\n}\n```\n\nWhen a client\
    \ requests an IP address, it will be assigned a free address from this range.\
    \ Starting with version 3 of the DHCP server, assignment will start with the highest\
    \ addresses (in this case, 10.0.0.120). If no parameters are defined inside this\
    \ subnet declaration, all globally defined parameters will be used. There can\
    \ be more than one range statement inside a subnet declaration.\n\nThe man pages\
    \ for dhcp-options and dhcpd.conf provide more information on the available configuration\
    \ options."
  merge: -1
  pgno: 104
- img_proc: true
  md: "# Assign Fixed Addresses\n\nUsing DHCP, you can assign a fixed IP address to\
    \ a certain computer. Whenever this computer requests an IP address, it will always\
    \ get the same address.\n\nTo assign a fixed address, the computer must be identified\
    \ by its MAC address:\n\n```\n# Host da5 will always get the same address\n# host\
    \ da5.digitalairairlines.com\n{\n  hardware ethernet 00:90:27:51:4D:95;\n  fixed-address\
    \ 10.0.0.5;\n}\n```\n\nTo identify this host, the hardware statement is mandatory.\n\
    Currently, only Ethernet and Token Ring are defined as hardware types.\n\nIf there\
    \ are any specific settings required for this host (such as lease time or routers),\
    \ they have to be provided inside the host statement.\n\n> If you are assigning\
    \ fixed addresses to certain hosts, make sure that these addresses are outside\
    \ all the defined address ranges.\n\n> Assigned fixed addresses are not logged\
    \ in the log file that contains information about all the leases. Only dynamically\
    \ assigned addresses are logged there."
  merge: -1
  pgno: 105
- img_proc: true
  md: "# Group Host Declarations\n\nInstead of providing specific settings for several\
    \ hosts in individual host statements, the hosts can be grouped in one declaration.\
    \ The declaration starts with the group statement and contains a list of the hosts\
    \ and the corresponding settings. The following is an example:\n\n```\n # This\
    \ group of hosts needs specific settings\ngroup {\n    default-lease-time 43200;\n\
    \    max-lease-time 86400;\n    option routers 10.0.0.250;\n    host da6.digitalairlines.com\n\
    \    {\n        hardware ethernet 00:90:27:51:4C:95;\n    }\n    host da7.digitalairlines.com\n\
    \    {\n        hardware ethernet 00:90:27:51:4C:96;\n    }\n    host da8.digitalairlines.com\n\
    \    {\n        hardware ethernet 00:90:27:51:4C:97;\n    }\n}\n```\n\nAll other\
    \ settings will be used as defined in the global settings.\n\n# Configure DHCP\
    \ Pools\n\nThe pool declaration can be used to specify a pool of addresses that\
    \ will be treated differently than any other pool of addresses, even on the same\
    \ network segment or subnet.\n\nFor example, you may want to provide a large set\
    \ of addresses that can be assigned to DHCP clients that are registered to your\
    \ DHCP server, while providing a smaller set of addresses, possibly with short\
    \ lease times, that are available for unknown clients."
  merge: -1
  pgno: 106
- img_proc: true
  md: "# To do this, you would set up a pair of pool declarations:\n\n```\nsubnet\
    \ 10.0.0.0 netmask 255.255.255.0 (\n  option routers 10.0.0.254;\n\n# Unknown\
    \ clients get this pool.\npool {\n  option domain-name-servers 10.0.0.254;\n \
    \ max-lease-time 300;\n  range 10.0.0.100 10.0.0.250;\n  allow unknown-clients;\n\
    }\n\n# Known clients get this pool.\npool {\n  option domain-name-servers 10.0.0.251,\
    \ 10.0.0.252;\n  max-lease-time 28800;\n  range 10.0.0.5 10.0.0.99;\n  deny unknown-clients;\n\
    }\n```\n\nIt is also possible to set up either entirely different subnets for\
    \ known and unknown clients. \"Known clients\" mean, that an IP address is assigned\
    \ to a MAC address using the host statement. Pools exist at the level of shared\
    \ networks, so address ranges within pool declarations can be on different subnets.\n\
    \nAs you can see in the preceding example, pools can permit lists that control\
    \ which clients are allowed to access the pool and which aren't.\n\nEach entry\
    \ in a pool's permit list is introduced with the allow or deny keyword. If a pool\
    \ has a permit list, then only those clients that match specific entries on the\
    \ permit list will be eligible to be assigned addresses from the pool.\n\nIf a\
    \ pool has a deny list, then only clients that do not match any entries on the\
    \ deny list will be eligible. If both permit and deny lists exist for a pool,\
    \ then only clients that match the permit list and do not match the deny list\
    \ will be allowed access."
  merge: -1
  pgno: 107
- img_proc: true
  md: "# Use Classes\n\nClients can be separated into classes and are then treated\
    \ differently depending on what class they are in. This can be used, for example,\
    \ to prohibit the DHCP server from offering IP addresses to computers (those would\
    \ have to get their information from another DHCP server).\n\nThe definition of\
    \ a class always starts with the class statement, followed by the name of the\
    \ class (you can choose any name here). After this definition, the parameters\
    \ are needed how to identify the members of this class. A simple example looks\
    \ like this:\n\n```\nclass \"unwanted-clients\"\n{\n    match if substring(hardware,\
    \ 1, 3) = 00:11:22;\n    denying booting;\n```\n\nThe match if statement in the\
    \ example specifies that the members of this class should be identified by their\
    \ hardware (MAC) address. This line identifies all MAC addresses where the first\
    \ three bytes match \"00:11:22\". All clients matching this definition are grouped\
    \ into this class automatically. The deny booting statement in the next line defines\
    \ that the DHCP server should not provide any IP addresses to these clients."
  merge: -1
  pgno: 108
- img_proc: true
  md: "A more complex example makes use of the so-called pools into which you can\
    \ separate the IP addresses to be used in the network:\n\n```\nclass \"apple-macs\"\
    \n  match if substring(hardware, 1, 3) = 01:23:45;\n  subnet 10.0.0.0 netmask\
    \ 255.255.255.0\n  {\n    pool {\n      allow members of \"apple-macs\"\n    \
    \  range 10.0.0.101 10.0.0.150;\n    }\n    pool {\n      deny members of \"apple-macs\"\
    \n      range 10.0.0.201 10.0.0.250;\n    }\n  }\n```\n\nThis configuration defines\
    \ a class apple-macs that contains all clients which match the given MAC address\
    \ (the first three bytes are 01:23:45). The members of this class will be assigned\
    \ IP addresses from the range 10.0.0.101 to 10.0.0.150, while all clients which\
    \ are not members of this class will be assigned IP addresses from the 10.0.0.201\
    \ to 10.0.0.250.\n\n# The Log File\n\nThe IP addresses assigned by the DHCP server\
    \ are logged to the file /var/lib/dhcp/db/dhcpd.leases. For each address assigned\
    \ to a client, several pieces of information are recorded, such as\n\n+   * When\
    \ the address was assigned\n-* When the lease time will end\n-* What the MAC address\
    \ of the client is\n-* The host name of the client (if submitted during the request)"
  merge: -1
  pgno: 109
- img_proc: true
  md: 'Whenever a new address is requested by a client, the corresponding entry is
    added to the end of the log file. When dhcpd is started, the log file is read
    so that the DHCP server knows about currently assigned IP addresses.


    This file is required before you start the DHCP server for the first time. If
    the file was not created automatically by DHCP installation, it has to be created
    manually. After starting dhcpd, a copy of the previous version of the log file
    will be created using the name


    ```

    /var/lib/dhcp/db/dhcpd.leases~

    ```


    To prevent a log file from becoming too large, by adding more and more entries
    it will be re-created occasionally.


    In the following example, one machine has been assigned the IP address 10.0.0.120,
    and another one has been assigned the IP address 10.0.0.119. The first address
    has been assigned for one hour, the second for twelve hours.


    ```

    lease 10.0.0.120

    nstarts 1 2006/06/14 08:06:51;

    ends 1 2006/06/14 09:06:51;

    binding state active;

    next binding state free;

    hardware ethernet 00:50:ba:be:33:1c;

    uid "\u001\000P\272\2763\u034";

    client-hostname "da5"

    lease 10.0.0.119

    starts 1 2006/06/14 08:06:06;

    ends 1 2006/06/14 20:08:06;

    binding state active;

    next binding state free;

    hardware ethernet 08:00:46:b6:d8:ce;

    uid "\u001\010\000F\266\330\u316";

    client-hostname "da6*"

    ```'
  merge: -1
  pgno: 110
- img_proc: true
  md: 'The following explains the entries:


    +   - The keyword **starts** is followed by the address was assigned. The keyword
    **ends** is followed by the time the address expires (the time at which the address
    is released).


    The first number following the corresponding keyword indicates the day of the
    week (0 stands for Sunday, 6 for Saturday). Next, the date and clock time follow
    (always as Greenwich Mean Time, GMT).


    +   - The keywords **binding state** and **next binding state** provide information
    on how the address can be assigned. If the DHCP server is not configured for failover,
    the only possible parameters are **active** and **free**. In a failover setup,
    you can use additional parameters like **backup**.


    +   - The keyword **hardware** specifies the MAC address of the network card.
    Addresses that are assigned permanently to specific clients via the entry **hardware**
    in the file /etc/dhcpcd.conf are not listed in this log file.


    +   - The keyword **uid** is followed by a client identification (provided the
    client transferred this information when the query was made).


    Most clients send their host names when requesting an IP address via DHCP. If
    this is the case, the host name appears after the keyword **client-hostname**
    in the lease file.'
  merge: -1
  pgno: 111
- img_proc: true
