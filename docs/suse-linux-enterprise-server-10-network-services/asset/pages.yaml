    of the RFC 2307 attribute from_attribute in all lookups.


    For example: nss_map_attribute uniqueMember member


    +   - pam_login_attribute. Specifies the attribute to use when constructing the
    attribute value assertion for retrieving a directory entry for a user''s name.


    The default is "uid", for compatibility with RFC 2307.


    +   - pam_filter. Specifies a filter to use when retrieving user information.
    The user entry must match the pam_login_attribute value as well as any filter
    specified here.


    For example: pam_filter objectclass=posixAccount


    +   - nss_base_map. Specify the search base, scope, and filter to be used for
    specific maps.


    ![](img/b7f4ef3c9bdffc8caed3395478c04bab_199_1.png)


    Note that maps forms part of the configuration file keyword and is one of the
