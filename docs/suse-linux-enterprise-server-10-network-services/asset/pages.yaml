- img_proc: true
  md: '+   - f file. By default, ntop captures traffic from network interface cards
    (NICs) or from netFlow/sFlow probes. If you specify -f, ntop will not capture
    any traffic from NICs and reads the content of the file instead.


    To capture network traffic, use tcpdump or Ethereal as described in this section.


    +   - -n. This parameter causes ntop to skip DNS resolution, showing only numeric
    IP addresses instead of the symbolic names.


    +   -p protocols. This parameter specifies the TCP/UDP protocols that ntop will
    monitor.


    The format is label=protocol list,label=protocol list], where label is used to
    symbolically identify the protocol list.


    The format of protocol list is protocol[protocol], where protocol is either a
    valid protocol specified inside /etc/services file or a numeric port range (such
    as 80 or 6000–6500).


    Example: -p FTP=ftp|ftop-data


    +   -i interface. Specifies the network interfaces to be used by ntop for network
    monitoring.


    +   -w port. The ntop web server is embedded in the application. These parameters
    specify the port (and optionally the address) of the ntop web server.


    The default port is 3000. The option -W operates similarly, but controls the port
    for the HTTPS connections.


    +   -d. This parameter causes ntop to become a daemon in the background.


    +   -m subnets. This parameter allows the user to define additional networks and
    subnets whose traffic is also considered local in ntop reports.


    +   -l. This parameter causes a dump file to be created of the network traffic
    captured by ntop in tcpdump (pcap) format.'
