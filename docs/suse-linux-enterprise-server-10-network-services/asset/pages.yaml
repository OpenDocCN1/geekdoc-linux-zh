- img_proc: true
  md: '# Objective | Summary


    5. Use DHCP and Dynamic DNS


    If a client assigns IP addresses via DHCP, the DNS server must be informed about
    the host name and the IP address.


    This can be done in two ways:


    +   - The client transmits its name to the DHCP server and gets an IP address
    from the DHCP server. The DHCP server transmits the host name and the IP address
    to the DNS server.


    +   - The client gets its name and IP address from the DHCP server. The DHCP server
    transmits the host name and IP address to the DNS server.


    To enable interaction between the DHCP server and DNS server, you have to modify
    the following files


    +   - /etc/named.conf


    +   - /etc/dhcpd.conf


    Since the DNS server should only accept changes from the authorized DHCP server,
    the updates must be protected cryptographically.


    The program dnssec-keygen generates the key.'
  merge: -1
  pgno: 160
- img_proc: true
  md: '# Objective | Summary


    | Objective | Summary |

    | --- | --- |

    | 5. Use DHCP and Dynamic DNS (continued) | The name server first saves dynamic
    entries in files with the extension **.jnl.**<br>At regular intervals, the changes
    are transferred from the .jnl file to the zone file by overwriting the old zone
    file.<br>New entries should not be added to the zone file with an editor; use
    the **nsupdate** utility. |

    | 6. Configure DHCP Failover | The failover protocol allows two DHCP servers to
    share a common address pool.<br>If one server fails, the other server will continue
    to renew leases out of the pool and will allocate new addresses.<br>The failover
    protocol defines a primary server role and a secondary server role.<br>In order
    to configure failover, you need to write a peer declaration in the file /etc/dhcpd.conf
    that configures the failover protocol, and you need to write peer references in
    each pool declaration for which you want to do failover. |'
