  md: '# Objective 2


    # Use Nagios to Monitor Hosts, Services, and Network


    Nagios is a program for monitoring hosts and services. Nagios can be used to:


    +   - Monitor host-based activity (such as use of disk space and running processes).

    - Monitor network services (such as SMTP, POP3, and HTTP).

    - Notify a person in case problems appear and disappear (using email or paging).

    - Provide a plugin interface for user-developed monitoring methods.

    - Provide access to the status via a webbrowser.


    Several packages can be used with Nagios. We will use the following packages in
    this chapter:


    +   - nagios. The base package of Nagios.

    - nagios-nsca. The Nagios service check acceptor.

    - nagios-plugins. Plugins needed for Nagios checks.

    - nagios-plugins-extra. More plugins for Nagios checks.

    - nagios-www. A web server for Nagios.


    The following topics are covered in this section:


    +   - Directories Used by Nagios

    - Basic Configuration of Nagios

    - Configuration of Contacts and Contact Groups

    - Configure the Hosts and Host Groups

    - Configure the Services

    - Configure Other Resources'
  merge: -1
  pgno: 404
- img_proc: true
  md: '+   - Configure the Nagios Web Server

    - Use Nagios


    # Directories Used by Nagios


    Nagios uses the following directories by default:


    +   - /etc/nagios/. Configuration files

    - /usr/lib/nagios/plugins/. Plugins for checking hosts and services

    - /usr/lib/nagios/cgi/. CGI scripts for the web server

    - /var/log/nagios/. Log files of Nagios

    - /var/spool/nagios/. Spool file of Nagios

    - /etc/apache2/conf.d/ Configuration files of the web server

    - /usr/share/nagios/. Content files of the web server


    # Basic Configuration of Nagios


    All configuration files for Nagios are located in the directory /etc/nagios/.
    The main configuration file is /etc/nagios/nagios.cfg. This file can include additional
    configuration files.


    The file /etc/nagios/nagios.cfg contains a lot of comments describing the different
    configuration options. Most of the options can be used as provided; we will describe
    only the most important options.


    The definition of the objects to monitor is done by including configuration files
    using the cfg_file statement. We will discuss those statements in the respective
    sections.'
  merge: -1
  pgno: 405
- img_proc: true
  md: '+   log_file=/var/log/nagios/nagios.log. Location of the logfile Nagios. Service
    and host events are logged to this file. This should be the first option specified
    in the configuration.


    +   cfg_file=/etc/nagios/checkcommands.cfg. This statement reads the definition
    of the plugin commands (service and host check commands).


    +   cfg_file=/etc/nagios/misccommands.cfg. This statement reads the definition
    of miscellaneous commands (notification and event handler commands, etc.)


    +   status_file=/var/log/nagios/status.log. This is where the current status of
    all monitored services and hosts is stored. The contents of the status file are
    read and processed by the CGI scripts. The contents are deleted every Nagios restarts.


    +   nagios_user=daemon and nagios_group=daemon. These two statements define the
    effective user and group ID used for the Nagios processes. You may specify a user
    name/group name or a UID/GID.


    +   check_external_commands=1. If you want to use the Nagios web server, you need
    to run CGI scripts provided with the package. To do so, you have to set this option
    to 1. The default value is 0, disabling this functionality.


    +   log_rotation_method=d. Rotation method for the log file (/var/log/nagios/nagios.log).
    By default, the logfile will be rotated daily. Values can be:


    +   n. Don’t rotate the log


    +   h. Hourly rotation (top of the hour)


    +   d. Daily rotation (midnight every day)


    +   w. Weekly rotation (midnight on Saturday evening)


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  pgno: 406
- img_proc: true
  md: "# SUSE Linux Enterprise Server 10: Networking Services\n\n+   - m. Monthly\
    \ rotation (midnight last day of month)\n- It may be useful to deactivate the\
    \ log rotation here. The file /etc/logrotate.d/nagios is checked on a daily basis\
    \ to monitor the log file. If the log file grows to more than 1024 KB, it will\
    \ be rotated.\n\n+   - log_archive_path=/var/log/nagios/archives. If rotating\
    \ logfiles is activated, the logfiles will be moved to this directory. If you\
    \ set log_rotation_method=n, this directive will have no effect.\n\n+   - use_syslog=1.\
    \ If you want messages logged via the syslog daemon as well, set this option to\
    \ 1. If not, set it to 0.\n\n# Configuration of Contacts and Contact Groups\n\n\
    A contact definition is used to identify someone who should be contacted in the\
    \ event of a problem on your network. These contacts have to be assigned to a\
    \ contact group (see below) which is informed by Nagios about certain problems.\
    \ All contacts should be defined in a special file, which is included with the\
    \ statement\n\n```\ncfg_file=/etc/nagios/contacts.cfg\n```\n\nAn example for a\
    \ contact definition is shown here:\n\n```\n# contact definition for kibailey\n\
    define contact{\n    contact_name kibailey\n    alias Kate Bailey\n    service_notification_period\
    \ workhours\n    host_notification_period workhours\n    service_notification_options\
    \ c,r\n    host_notification_options d,r\n    service_notification_commands notify-by-email\n\
    \    host_notification_commands host-notify-by-email\n    email kibailey@digitalairlines.com\n\
    }\n```\n\n# CNI USE ONLY-1 HARDCOPY PERMITTED\n\n6-12\n\nCopying all or part of\
    \ this manual, or distributing copies, is strictly prohibited. To report suspected\
    \ copying, call 1-800-PIRATES.\n\nVersion 1"
  merge: -1
  pgno: 407
- img_proc: true
  md: "The parameters for defining a contact are as follows:\n\n+   - **contact_name**.\
    \ Used to define a short name to identify the contact. It is referenced in contact\
    \ group definitions (see below).\n- **alias**. Used to define a longer name or\
    \ description for the contact.\n- **service_notification_period**. Used to specify\
    \ the short name of the time period during which the contact can be notified about\
    \ service problems or recoveries. You can think of this as an “on call” time for\
    \ service notifications.\n- **host_notification_period**. Used to specify the\
    \ short name of the time period during which the contact can be notified about\
    \ host problems or recoveries. You can think of this as an “on call” time for\
    \ host notifications.\n- **service_notification_options**. Used to define the\
    \ service states for which notifications can be sent out to this contact. Valid\
    \ options are a combination of one or more of the following:\n    - w. Notify\
    \ on WARNING service states.\n    - u. Notify on UNKNOWN service states.\n   \
    \ - c. Notify on CRITICAL service states.\n    - r. Notify on service recoveries\
    \ (OK states).\n\nIf you specify n (none) as an option, the contact will not receive\
    \ any type of service notifications.\n\n+   - **host_notification_options**. Used\
    \ to define the host states for which notifications can be sent out to this contact.\
    \ Valid options are a combination of one or more of the following:\n    - d. Notify\
    \ on DOWN host states.\n    - u. Notify on UNREACHABLE host states.\n    - r.\
    \ Notify on host recoveries (UP states).\n\nIf you specify n (none) as an option,\
    \ the contact will not receive any type of host notifications."
  merge: -1
  pgno: 408
- img_proc: true
  md: "+   **host_notification_commands**. Used to define a list of the short names\
    \ of the commands used to notify the contact of a host problem or recovery. Multiple\
    \ notification commands should be separated by commas.\n\n+   **email**. Used\
    \ to define an email address for the contact. Depending on how you configure your\
    \ notification commands, it can be used to send out an email alert to the contact.\
    \ This email address must exist on the system (/etc/aliases).\n\nAll contacts\
    \ must be members of at least one contact group. The definition of the contact\
    \ groups is included with the statement\n\n```\ncfg_file=/etc/nagios/contactgroups.cfg\n\
    ```\n\nAn example of a definition of a contact group looks like this:\n\n```\n\
    # 'admins' contact group definition\ndefine contactgroup(\n    contactgroup_name\
    \      admins\n    alias                 Administrators\n    members         \
    \      kbailey, jgoldman\n)\n```\n\nThe parameters for defining a contact group\
    \ are as follows:\n\n+   **contactgroup_name**. A short name used to identify\
    \ the contact group.\n\n+   **alias**. A longer name or description used to identify\
    \ the contact group.\n\n+   **members**. A list of the short names of contacts\
    \ that should be included in this group. Multiple contact names should be separated\
    \ by commas."
  merge: -1
  pgno: 409
- img_proc: true
  md: "# Configure the Hosts and Host Groups\n\nThe hosts you want to monitor with\
    \ Nagios are defined in the file /etc/nagios/hosts.cfg. A host definition is used\
    \ to define a physical machine: a server, a workstation, a network device (such\
    \ as routers or switches), etc. The list of host definitions is included using\
    \ the statement\n\n```\ncfg_file=/etc/nagios/hosts.cfg\n```\n\nAt the beginning\
    \ is the definition of a host template:\n\n```\n# Generic host definition template\n\
    define host{\n  name generic-host\n  notifications_enabled 1\n  event_handler_enabled\
    \ 1\n  flap_detection_enabled 1\n  process_perf_data 1\n  retain_status_information\
    \ 1\n  retain_nonstatus_information 1\n  register 0\n}\n```\n\nThis template is\
    \ referenced in other host definitions and allows you to use definitions which\
    \ are already specified.\n\nWe do not go into the details here; this template\
    \ is just activating different actions. The last line (register 0) is needed to\
    \ indicate that this is not a real host but just a template."
  merge: -1
  pgno: 410
- img_proc: true
  md: "An example for a host definition is shown here:\n\n```\n# 'dal10' host definition\n\
    define host{\n  use generic-host\n  host_name dal0\n  alias SLES 10 #1\n  address\
    \ 10.0.0.10\n  check_command check-host-alive\n  max_check_attempts 10\n  notification_interval\
    \ 120\n  notification_period 24x7\n  notification_options d,u,r\n}\n```\n\nThe\
    \ parameters for the host definition are as follows:\n\n+   - **host_name.** Used\
    \ to define a short name that is used to identify the host. It is used in host\
    \ group and service definitions to reference this particular host. Hosts can have\
    \ multiple services (which are monitored) associated with them.\n\n+   - **alias.**\
    \ Used to define a longer name or description that is used to identify the host.\
    \ It is provided to allow you to more easily identify a particular host.\n\n+\
    \   - **address.** Used to define the address of the host. Normally, this is an\
    \ IP address, although it could really be anything you want (so long as it can\
    \ be used to check the status of the host). You can use an FQDN to identify the\
    \ host instead of an IP address, but if DNS services are not available, this could\
    \ cause problems."
  merge: -1
  pgno: 411
- img_proc: true
  md: '+   check_command. Used to specify the short name of the command that should
    be used to check if the host is up or down. Typically, this command would try
    to ping the host to see if it is alive. The command must return a status of OK
    (0) or Nagios will assume the host is down. If you leave this argument blank,
    the host will not be checked—Nagios will always assume the host is up. This is
    useful if you are monitoring printers or other devices that are frequently turned
    off. The maximum amount of time that the notification command can run is controlled
    by the host_check_timeout option.


    +   max_check_attempts. Used to define the number of times Nagios will retry the
    host check if it returns any state other than an OK state. Setting this value
    to 1 will cause Nagios to generate an alert without retrying the host check. Note:
    If you do not want to check the status of the host, you must set this to a minimum
    value of 1. To bypass the host check, just leave the check_command option.


    +   notification_interval. Used to define the number of units to wait before re-notifying
    a contact that is still down or unreachable. Unless you changed the interval_length
    directive from the default value of 60, this number will mean minutes. If you
    set this value to 0, Nagios will not re-notify contacts about problems for this
    host—only one problem notification will be sent out.


    +   notification_period. Used to specify the short name of the period during which
    notifications of events for be sent out to contacts. If a host goes down, unreachable,
    or recovers during a time which is not covered by the period, no notifications
    will be sent out.


    +   notification_options. Used to determine when notifications for the host should
    be sent out. Valid options are a combination of one or more of the following:


    +   d. Send notifications on a DOWN state.


    +   u. Send notifications on an UNREACHABLE state.'
