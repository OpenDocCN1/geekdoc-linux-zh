  md: "# Configure the Services\n\nThe services to check are defined in a separate\
    \ file. This file is included with the statement\n\n```\ncfg_file=/etc/nagios/services.cfg\n\
    ```\n\nYou have to specify each service on each host as a separate entry in this\
    \ file.\n\nAt the beginning is the definition of a service template:\n\n```\n\
    # Generic service definition template\ndefine service{\n  name generic-service\n\
    \  active_checks_enabled 1\n  passive_checks_enabled 1\n  parallelize_check 1\n\
    \  obsess_over_service 1\n  check_freshness 0\n  notifications_enabled 1\n  event_handler_enabled\
    \ 1\n  flap_detection_enabled 1\n  process_perf_data 1\n  retain_status_information\
    \ 1\n  register 0\n}\n```\n\nThis template is referenced in other service definitions\
    \ which allows you to use definitions which are already specified.\n\nAgain, we\
    \ do not go into the details of this template. The last line (register 0) indicates\
    \ that this is not a real service, just a template."
  merge: -1
  pgno: 414
- img_proc: true
  md: "An example of the definition for a network service is shown here:\n\n```\n\
    # Service definition\ndefine service{\n  use generic-service\n  host_name da10\n\
    \  service_description SMTP\n  is_volatile 0\n  check_period 24x7\n  max_check_attempts\
    \ 3\n  normal_check_interval 1\n  retry_check_interval admins\n  contact_groups\n\
    \  notification_interval 120\n  notification_period 24x7\n  notification_options\
    \ w,u,c,r\n  check_command check_smtp\n}\n```\n\nAn example of the definition\
    \ for a local host-based service is shown here:\n\n```\n# Service definition\n\
    define service{\n  use generic-service\n  host_name da10\n  service_description\
    \ Check local disk usage\n  is_volatile 0\n  check_period 24x7\n  max_check_attempts\
    \ 3\n  normal_check_interval 5\n  retry_check_interval 1\n  contact_groups admins\n\
    \  notification_interval 120\n  notification_period 24x7\n  notification_options\
    \ c,r\n  check_command check_local_disk!80%!90!/\n}\n```\n\nThe parameters used\
    \ are as follows:\n\n+   - use. Name of the service template to use."
  merge: -1
  pgno: 415
- img_proc: true
  md: "+   - host_name. Reference to the host name in /etc/nagios/hosts.cfg.\n\n+\
    \   - service_description. Description of the check to perform.\n\n+   - check_period.\
    \ Period during which this service should be checked. The name provided here refers\
    \ to the definition in /etc/nagios/timeperiods.cfg.\n\n+   - max_check_attempts.\
    \ The maximum number of check attempts which should be done.\n\n+   - normal_check_interval.\
    \ The interval length at which the service should be checked.\n\n+   - retry_check_interval.\
    \ In case the check could not be performed successfully, specify the time after\
    \ which the attempt should be made.\n\n+   - contact_groups. The contact group\
    \ to be notified.\n\n+   - notification_interval: Used to define the number of\
    \ time units to wait before re-notifying a contact that this server is down or\
    \ unreachable. Unless you've changed the interval_length directive from the default\
    \ value of 60, this name will mean minutes. If you set this value to 0, Nagios\
    \ will not re-notify contacts for problems for this host—only one problem notification\
    \ will be sent out.\n\n+   - notification_options. Definition of the service states\
    \ when a notification should be sent out:\n  - Notify with WARNING service states.\n\
    \  - Notify with UNKNOWN service states.\n  - Notify with CRITICAL service states.\n\
    \  - Notify on service recoveries (OK states).\n\n+   - check_command. The command\
    \ to be used for the check. The structure of the command is defined in the file\
    \ /etc/nagios/checkcommands.cfg (see below). Depending on its structure, different\
    \ parameters have to be supplied to the command. The parameters are separated\
    \ by the exclamation mark."
  merge: -1
  pgno: 416
- img_proc: true
  md: "Here is the default definition of the check_local_disk command:\n\n```\n# 'check_local_disk'\
    \ command definition\ndefine command{\n    command_name    check_local_disk\n\
    \    command_line    $USER1$/check_disk -w $ARG1 -c $ARG2 -p $ARG3\n}\n```\n\n\
    The parameters for the definition are:\n\n+   * command_name. The name of the\
    \ command used in the service definitions.\n* command_line. The plugin that is\
    \ started with the required parameters. In this example definition, three parameters\
    \ are required to use this plugin correctly.\n\nThe meaning of the parameters\
    \ can be determined by calling the plugin with the option **help:**\n\n```\nda51:-#\
    \ /usr/lib/nagios/plugins/check_disk --help\n...\nThis plugin will check the percent\
    \ of used space on a mounted file system and generate an alert if percentage is\
    \ above one of the threshold values.\nUsage: check_disk -w limit -c limit [-p\
    \ path | -x device] [-t timeout]\n[-m] [-e]\n+[--verbose]\ncheck_disk (-h|--help)\n\
    check_disk (-V|--version)\n```\n\nIn the service definition above, the command\
    \ is called as\ncheck_local_disk!%80%!90%!\n\nThis means a warning message will\
    \ be created when the disk usage exceeds 80% and a critical message will be generated\
    \ when the disk space usage exceeds 90%. The file system to check is the root\
    \ file system /."
  merge: -1
