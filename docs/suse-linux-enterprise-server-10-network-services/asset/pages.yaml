    # Filter Display


    You can filter the displayed packets. You can enter a filter expression in the
    text box next to the Filter button in the top line.


    The expressions for display filters are different from the capture expressions.


    Possible expressions are:


    +   * eth.addr=08.00.08.15.ca.fe Display all traffic to and from the Ethernet
    address 08.00.08.15.ca.fe.

    * ip.addr=192.168.0.10 Display all traffic to and from the IP address 192.168.0.10.


