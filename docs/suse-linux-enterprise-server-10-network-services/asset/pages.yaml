  md: "The following two files must exist for the local computer. These are created\
    \ automatically during installation and should not be modified.\n\n# The File\
    \ /var/lib/named/master/localhost.zone\n\nThe following is an example of the file\
    \ /var/lib/named/master/localhost.zone:\n\n```\n$TTL 1W\n@ IN SOA root (d. adams)\n\
    \      42 ; refresh\n      2D ; retry\n      4H ; expiry\n      6W ; minimum\n\
    \      1W )\n\n@\nIN A 127.0.0.1\n```\n\nIn this example, the “@” character is\
    \ used as an abbreviation (for this reason, it must be replaced by a dot in the\
    \ email address in the database files).\n\nUsing “@” instead of the domain name\
    \ causes the file /etc/named.conf to be read to see which domain this file is\
    \ responsible.\n\nIn this case, it is localhost, which is also used for the name\
    \ of the DNS server (this is why “@” appears many times in the file)."
  merge: -1
