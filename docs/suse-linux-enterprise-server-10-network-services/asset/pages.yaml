- img_proc: true
  md: '+   AMAVIS_SENDMAIL_MILTER. If set to yes, the milter (Mail Filter) interface
    of Sendmail will be started.


    Using the milter interface, it is possible to connect mail filter applications
    to Sendmail in a standardized form.


    After changing the file /etc/sysconfig/amavis, you have to run the command SuSEconfig.


    Setting USE_AMAVIS to yes makes three changes in /etc/postfix/master.


    +   The smtp protocol


    | smtp | inet | n | n | 2 | smtpd -o |

    | content_filter=smtp:[127.0.0.1]:1024 |


    +   The smttps protocol (still marked as comment)


    | #smtps | inet | n | n | 2 | smtpd -o |

    | smtpd_tls_wrappermode=yes -o content_filter=smtp:[127.0.0.1]:1024 |


    +   Port 10025


    | localhost:10025 inet | n | n | - | smtpd -o |

    | content_filter= |


    In this file you also have to add a process for amavis:


    ```

    smtp-amavis unix - - - 2 smtp

    -o smtp_data_done_timeout=1200

    -o smtp_send_xforward_command=yes

    -o disable_dns_lookups=yes

    -o max_use=20

