- img_proc: true
  md: '# # Summary


    | Objective | Summary |

    | --- | --- |

    | 1. Understand the Structure of MIB | The Simple Network Management Protocol
    (SNMP) is an Internet standard for gathering statistics from and managing devices,
    principally routers, on the Internet.<br><br>The information about servers, routers,
    workstations, and printers are stored in the management information base (MIB).<br><br>An
    agent is an implemented variant of the MIB on the host that is managed by an SNMP
    daemon.<br><br>A *manager* is an application that uses SNMP utilities to access
    the stored information in the MIB.<br><br>The event notifications of the agent
    are sent via *SNMP traps* to the manager.<br><br>A *community* is a group of database
    users and their assigned permissions.<br><br>Each MIB can be visualized by a tree
    having no named root. The leaves of the tree represent the managed objects and
    variables. Every variable is unique and represented by its *OID* (Object Identifier).'
  merge: -1
  pgno: 478
- img_proc: true
  md: '# Objective


    # Summary


    +   2. Configure the SNMP Daemon


    The Net-SNMP package uses various configuration files to configure its applications.
    They can be found in /usr/share/snmp/, /etc/snmp.conf, and ~/.snmp.


    The file /etc/snmp.conf can be created with the command snmpconf, which leads
    you through setting up a configuration step by step.'
  merge: -1
  pgno: 479
- img_proc: true
  md: '# Objective


    # Summary


    +   3. Start the SNMP Agent


    snmpd is an SNMP agent which binds to a port and awaits requests from SNMP management
    software.


    Many utilities are included in the net-snmp package. Most of them are elementary
    utilities to access the MIB:


    +   - /usr/bin/snmpget. Get information from the MIB.


    +   - /usr/bin/snmset. Set information in the MIB.


    +   - /usr/bin/snmpnetstat. Show network status using SNMP (similar to netstat).


    +   - /usr/bin/snmptrans. Translates the object information values into human
    readable terms.


    +   - /usr/bin/snmptrap. Informs the manager program about traps of the agent.
    The daemon version /usr/sbin/sbin/snmptrap receives and logs SNMP trap messages.


    +   - /usr/bin/snmpwalk. Incremental request of a MIB (sub)-tree.'
