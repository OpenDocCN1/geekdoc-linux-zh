  md: '# SECTION 4 Configure a Mail Server


    The standard mail server in SUSE Linux Enterprise Server 10 is Postfix.


    Postfix was written as an alternative to the well-known Mail Transfer Agent (MTA)
    Sendmail.


    Postfix was originally developed as VMailer by Wietse Venema during his employment
    at IBM and placed under the “IBM Public License Version 1.0 – Secure Mailer.”


    Before its publication, however, the program was renamed Postfix to exclude possible
    name conflicts.


    The “IBM Public License Version 1.0 - Secure Mailer” is, to a large degree, similar
    to the GNU GPL. It allows free distribution of the source code and binary package
    of the program and allows modifications to the program on condition that the license
    is always modified.


    Venema had several goals for Postfix:


    +   - It should be a fast mailer.

    - It should be easy to administer.

    - It should be secure.

    - It should be compatible with Sendmail.'
  merge: -1
