  md: '# The File /var/lib/named/master/127.0.0.zone


    In this file, the abbreviation "@" is also used. But here the computer name must
    be given explicitly with localhost (remember the dot at the end):


    | TTL 1W | | localhost. root.localhost. ( |

    | @ IN SOA | 42 ; serial (d. adams) |

    | 2D | ; refresh |

    | 4H | ; retry |

    | 6W | ; expiry |

    | 1W ) ; minimum |

    | IN NS | localhost. |

    | 1 IN PTR | localhost. |


    # Create Additional Resource Records


    Apart from the resource records already discussed (SOA, NS, A, PTR), there are
    MX and CNAME resource records, which are used to do the following:


    +   - Define Mail Servers for the Domain

    - Assign Aliases for Computers


    Define Mail Servers for the Domain


    To be able to use email addresses in the form geeko@digitalairlines.com'
  merge: -1
  pgno: 45
- img_proc: true
  md: 'To achieve this, an MX (Mail Exchange) entry must be made in the database file
    for forward resolution, after the DNS server entry:


    | digitalairlines.com. | IN MX 0 mail |

    | | IN MX 10 dal |

    | | IN MX 10 da5 |


    If an email is now sent to the address geeko@digitalairlines.com, the computer
    sending the mail asks the DNS server which computer is the mail server, and is
    sent to the list of the MX entries in return.


    Several mail servers can be given. On the basis of their priorities, it is then
    decided to which computer the email is sent. The priority of mail servers is defined
    by the number next to MX; the lower this number, the higher the priority.


    In this example the computer mail.digitalairlines.com has the highest priority
    (it is, therefore, the primary mail server). dal.digitalairlines.com and da5.digitalairlines.com
    both have the same priority.


    If the mail server with the highest priority cannot be reached, the mail server
    with the second-highest priority is used. If several mail servers have the same
    priority, then one of them is chosen at random. An address entry must be made
    for each mail server.'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# Assign Aliases for Computers


    If you want a computer to be reached by more than one name (such as addressing
    a computer as da30.digitalairirlines.com and www.digitalairairlines.com), then
    corresponding aliases must be given.


    These are the CNAME (canonical name) entries in the database file for forward
    resolution:


    | da30 | IN A | 10.0.0.3 |

    | www | IN CNAME | da30 |


    The names of the mail servers for the domain (MX entry) cannot be alias names,
    since some mail servers cannot handle this correctly.


    # Configure One or More Slave Servers


    To guarantee reliable operation, at least one DNS server besides the master server
    is required. This can take over part of the load from the DNS master server. But
    it is especially important in case the DNS master server is not available. This
    additional DNS server is set up as a DNS slave server.


    The essential difference between the two types is that a slave server receives
    copies of the zone files from the master server. Modifications to the zone files
    are only made on the master server.


    As soon as a slave server is started, it connects to the master server and receives
    a copy of the zone files from it. This is called a zone transfer.


    Comparison of data between the servers takes place automatically. On the one hand,
    the slave server queries the master server at regular intervals and checks, using
    the serial number of the zone files, whatever has changed.'
  merge: -1
  pgno: 47
- img_proc: true
  md: "By default, the master server sends a message to all listed slave servers (called\
    \ *notify*) as soon as it has been restarted in order to read in modified zone\
    \ files.\n\nIn the configuration file `/etc/named.conf` for a slave server, there\
    \ are at least two entries that define it as a master server: the two zone definitions\
    \ for the loopback network (localhost).\n\nThere might also be a zone definition\
    \ for the root DNS server. But a zone definition is only necessary if the slave\
    \ server will forward requests to other DNS servers.\n\nThe definitions for zones\
    \ for which it should copy data from the master server look like the following:\n\
    \n```\nzone \"digitalairlines.com\" in {\n  type slave;\n  file \"slave/digitalairlines.com.zone\"\
    ;n  masters {\n    10.0.0.254;\n  }\n}\n```\n\nThe slave server gets data from\
    \ the master server with the IP address 10.0.0.254 and stores it in the directory\
    \ `/var/lib/named/slave/`. This directory is created when you install the BIND\
    \ package.\n\nA similar configuration must be made for reverse resolution, as\
    \ in the following:\n\n```\nzone \"0.0.0.10.in-addr.arpa\" in {\n  type slave;\n\
    \  file \"slave/10.0.0.zone\";n  masters {\n    10.0.0.254;\n  }\n}\n```"
  merge: -1
  pgno: 48
- img_proc: true
  md: "In the simplest configuration, the slave server gets information from the master\
    \ server at regular intervals. This can cause the slave server to provide outdated\
    \ information for a certain length of time.\n\nThis is why it is reasonable to\
    \ instruct the master server to inform the slave servers about modifications in\
    \ the database files. The slave servers then immediately carry out a zone transfer,\
    \ which always brings them up to date.\n\nIn order for the master server to be\
    \ able to communicate with the slave servers, it must know about them. By default,\
    \ the master server automatically informs its slave servers. This can also be\
    \ defined explicitly in the options section of the file /etc/named.conf, as in\
    \ the following:\n\n```\noptions {\n  ...\n  notify yes;\n}\n```\n\nSubsequently,\
    \ the slave servers must be listed as DNS servers in the database files (for the\
    \ forward and reverse resolution):\n\n| digitalairlines.com. | IN NS | da1.digitalairlines.com.\
    \ |\n| | | |\n| | IN NS | da8.digitalairlines.com. |\n\nThis informs the slave\
    \ server, da8.digitalairlines.com, about all modifications."
  merge: -1
  pgno: 49
- img_proc: true
  md: "# Objective 4\n\n# Configure the DNS Clients\n\nTo instruct a computer to use\
    \ a certain DNS server, the information about this server has to be written to\
    \ the file /etc/resolv.conf. This can be done using YaST (during installation\
    \ or at any time later) by editing this file with any text editor.\n\nThe file\
    \ /etc/resolv.conf looks like the following:\n\n```\nsearch digitalairirlines.com\n\
    nameserver 10.0.0.254\n```\n\nNormally, this file has the following two types\
    \ of entries:\n\n+   - A list after the names of domains (or subdomains) provided\
    \ after this keyword. Several domain names are listed on one line. This allows\
    \ only the host name to be used to resolve to the correct IP address.\n\t\t\t\
    The host name is expanded by the domain names specified here until a matching\
    \ IP address is found.\n\t\t\tFor example, if you provide digitalairirlines.com\
    \ and atl.digitalairirlines.com as domain names, the host server is expanded to\
    \ server.digitalairirlines.com and server.digitalairirlines.com to look for a\
    \ corresponding IP address. The first matching IP address is returned.\n- nameserver.\
    \ The keyword nameserver specifies the IP address of a DNS server to use. You\
    \ can have up to 3 entries, but each of them must only contain 1 server address.\
    \ If several entries of this type exist, the DNS servers are queried in this order."
  merge: -1
  pgno: 50
- img_proc: true
  md: 'There is another important file for the clients:

    /etc/nsswitch.conf. This file applies to all programs that use the resolver functions
    of the current GNU C Library (libc6). (The predecessor of this file is /etc/host.conf,
    which applies to older versions of the GNU C Library.)


    This file configures the name service switch, which is responsible for resolving
    host names, network names, users, and groups.


    The relevant part for resolving host names looks like the following:


    ```

    #

    # /etc/nsswitch.conf

    #

    hosts:          files dns

    networks:      files dns

    ...

    ```


    Both entries shown here define that the first attempt to resolve a host name is
    done using the file /etc/hosts. If this fails, a DNS server is contacted to resolve
    the name. The same applies to the resolution of network names, done using /etc/networks
    first.'
  merge: -1
  pgno: 51
- img_proc: true
  md: "# Objective 5\n\n# Forward DNS Requests\n\nIf the name server does not have\
    \ any information on the computer to be resolved, it tries to fetch this information\
    \ from another name server.\n\nTo do this, the name server has to know how to\
    \ reach other name servers:\n\n+   - The Name Servers of the Root Domain\n- Forward\
    \ Requests to Specific Name Servers\n- Forward Requests for a Subdomain\n\n# The\
    \ Name Servers of the Root Domain\n\nIn the configuration file /etc/named.conf\
    \ there should be a zone entry containing a reference to a file which contains\
    \ the addresses of the root name servers.\n\nThis file is created during the installation\
    \ of the bind package in the directory /var/lib/named/ and is called root.hint.\n\
    \nThe zone entry in the /etc/named.conf looks like this:\n\n```\nzone \".\" in\n\
    {\n    type hint;\n    file \"root.hint\";\n}\n```"
  merge: -1
  pgno: 52
- img_proc: true
  md: "# Forward Requests to Specific Name Servers\n\nIf no additional entries are\
    \ made, the name server can contact the root name servers directly. But it is\
    \ also possible to give the name addresses of other name servers. It will use\
    \ these first if it cannot resolve a computer name itself.\n\nThe definition of\
    \ such a name server is specified in the options section of the file /etc/named.conf:\n\
    \n```\noptions {\n  directory \"/var/lib/named\";\n  forwarders {\n    10.0.0.10;\n\
    \    10.0.0.15;\n  }\n}\n```\n\nIn this case, the requests that could not be resolved\
    \ locally are forwarded to one of the two name servers given. If neither of these\
    \ can be reached, the request runs via the root name servers, as described above."
  merge: -1
  pgno: 53
- img_proc: true
  md: "# Forward Requests for a Subdomain\n\nIf there is another name server used\
    \ for resolving host names for a subdomain, this name server has to be defined\
    \ in the corresponding zone entry.\n\nThe type is set to forward, and the address\
    \ of the respective name server has to be specified:\n\n```\nzone \"slc.digitalairlines.com\"\
    \ in {\n  type forward;\n  forward only;\n  forwarders {\n    10.0.0.10;\n  }\n\
    }\n```\n\nIf you include the entry **forward only**, the name server is instructed\
    \ never to try to resolve the address itself. All requests concerning the subdomain\
    \ slc.digitalairlines.com are forwarded to the name server with the address 10.0.0.10.\
    \ A corresponding instruction for reverse resolution must be defined."
  merge: -1
  pgno: 54
