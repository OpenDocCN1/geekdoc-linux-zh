  md: '# Objective Summary


    +   3. Understand the Architecture and Components of Postfix


    An email sent locally is placed by Postfix''s Sendmail via the postdrop command
    into the maildrop queue.


    Then it is picked up by the pickup daemon, which checks it for


    +   - Content


    +   - Size


    +   - Other factors based on rules


    Then the cleanup missing header lines


    +   - Inserts double recipient addresses


    +   - Converts the email address in the header via the trivial-rewrite daemon
    to the user@fully-qualified-domain convention


    +   - Writes data in the header according to the rules in the canonical and virtual
    tables


    After this, the email is copied to the incoming queue and the queue manager is
    informed of the arrival of this email.'
  merge: -1
  pgno: 348
- img_proc: true
  md: '# Objective


    # Summary


    +   3. Understand the Architecture and Components of Postfix (continued)


    Email received over the Internet or the LAN is accepted by the daemon smtpd.


    Emails are checked for


    +   - Content

    - Size

    - Other factors


    before passing it to the cleanup daemon.


    The queue manager fetches an email placed in the incoming queue and copies the
    email to the active queue, assuming it is empty.


    The trivial-rewrite daemon, using the transport table, checks to see if the recipient
    of the email is on the local system or on a remote system.


    Important components of Postfix are in:


    +   - /etc/aliases. Contains local address aliases.

    - /etc/postfix/. All the configuration files defining Postfix mail processing
    are located in this directory.

    - /usr/lib/postfix/. This directory contains all the programs needed by Postfix.'
