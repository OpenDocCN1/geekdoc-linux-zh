  md: '# Introduction


    In SUSE Linux Enterprise Server 10: Networking Services (Course 3074), you learn
    advanced Linux skills focused on network services you need to administer SUSE
    Linux Enterprise Server 10.


    These skills, along with those taught in SUSE Linux Enterprise Server 10: Security
    (Course 3075), prepare you to take the Novell Certified Linux Engineer 10 (Novell
    CLE 10) certification practicum test.


    For more information on CLE 10, visit


    http://www.novell.com/training/certinfo/cle10


    The contents of your student kit include the following:


    +   - SUSE Linux Enterprise Server 10: Networking Services Manual

    - SUSE Linux Enterprise Server 10: Networking Services Workbook

    - SUSE Linux Enterprise Server 10: Networking Services Course DVD

    - SUSE Linux Enterprise Server 10 Product DVD

    - SUSE Linux Enterprise Desktop 10 Product DVD


    The SUSE Linux Enterprise Server 10 Networking Services Course DVD contains a
    VMware Workstation SUSE Linux Enterprise Server 10 server (in the directory vmware)
    that you can use with the SUSE Linux Enterprise 10: Networking Services Workbook
    outside the classroom to practice the skills you need to take the Novell CLE 10
    Practicum.'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'Instructions for setting up a self-study environment are in the setup directory
    on the Course DVD.


    # Course Objectives


    This course teaches you how to perform the following SUSE Linux network tasks
    for SUSE Linux Enterprise Server 10:


    +   1. Configure a DNS Server Using BIND.

    2. Use DHCP to Manage Networks.

    3. Manage OpenLDAP.

    4. Configure a Mail Server.

    5. Use OpenSLP.

    6. Monitor Network Traffic.


    These are common tasks performed by an experienced SUSE Linux Enterprise Server
    administrator responsible for network services in an enterprise environment. Half
    of the final day of class is reserved for a “LiveFire” exercise that provides
    a set of scenarios to test your SUSE Linux Enterprise Server 10 administration
    skills and prepare you to take the Novell CLE 10 Practicum.


    # Audience


    The primary audience for this course is Novell Certified Linux Professionals (CLPs).


    For more information on CLP, visit


    http://www.novell.com/training/certinfo/clp'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Certification and Prerequisites


    This course helps you prepare for the Novell Certified Linux Engineer 10 (CLE
    10) Practicum exam, called the *Practicum*. The Novell CLE 10 is a higher-level
    certification for people who passed the Novell CLP Practicum.


    As with all Novell certifications, course work is recommended. To achieve the
    certification, you are required to pass the Novell CLE 10 Practicum (050–698).


    The Novell CLE 10 Practicum is a hands-on, scenario-based exam where you apply
    the knowledge you have learned to solve real-life problems—demonstrating that
    you know what to do and how to do it.


    The practicum tests you on objectives of this course (SUSE Linux Enterprise Server
    10: Networking Services – Course 3074) and those covered in *SUSE Linux Enterprise
    Server 10: Security (Course 3075)*.'
  merge: -1
  pgno: 12
