- img_proc: true
  md: '# Objective 1


    # Understand the Basics of LDAP


    A directory is a specialized database that is optimized for reading, browsing,
    and searching. Directories contain descriptive, attribute-based information and
    support sophisticated filtering.


    Directories are tuned to give quick response to high-volume lookup or search operations.
    They can replicate information wisely in order to increase availability and reliability,
    while reducing response time.


    There are many different ways to provide a directory service. Different methods
    allow different kinds of information to be stored in the directory; place different
    requirements on how that information can be referenced, queried, and updated;
    and determine how it is protected from unauthorized access.


    Some directory services are local, providing service to a restricted context (such
    as the finger service on a single machine). Other services are global, providing
    service to a much broader context (such as the entire Internet).


    Directory services can be used for many different purposes. Very often they are
    used as databases for user authentication. By default, SUSE Linux Enterprise Server
    10 uses OpenLDAP for user management and some configuration purposes.


    LDAP stands for Lightweight Directory Access Protocol. As the name suggests, it
    is a lightweight protocol for accessing directory services called “DAP”.'
  merge: -1
  pgno: 165
- img_proc: true
  md: 'DAP was developed in 1988 by the CCITT (International Telegraph and Telephone
    Consultative Committee). It should manage access to information stored in a X.500
    directory service. There are two more Protocols involved:


    +   - DSP. (Directory Service Protocol) Manages the communication between servers.

    - DISP. (Directory Information Shadowing Protocol) Transports the results of a
    database request.


    X.500 is based on a complete ISO/OSI stack. Clients that use IP are only able
    to access a server that needs a complete ISO/OSI stack via a gateway. Because
    of this, DAP could not win recognition.


    In 1995 Yeong, Howes, and Kill, from the University of Michigan, developed LDAP.
    Only the DAP functionalities of X.500 are reused and some new features were added.


    LDAP runs over TCP/IP or other connection-oriented transfer services. Because
    of this it can be easily integrated into an existing network.


    LDAP stores information in objects that can be associated with object classes.
    The classes determine which attributes an object can/must have. By including so-called
    schemas, you are able to access pre-defined object classes.


    OpenLDAP ships with some basic schema files located in the directory /etc/openldap/schema/


    Frequently used object classes are, for example:


    +   - alias

    - country

    - locality

    - organization'
  merge: -1
  pgno: 166
- img_proc: true
  md: '+   * organizationalUnit

    * organizationalRole

    * person


    Each object is a collection of attributes that has a globally unique distinguished
    name (DN). The DN is used to refer to the entry. Each of the entry’s attributes
    has a type and one or more values.


    The attributes are typically mnemonic strings, like “cn” for common name, or “mail”
    for email addresses. The syntax of values depends on the attribute type.


    For example, a cn attribute might contain the value “Geeko Chameleon.” A mail
    attribute might contain the value “geeko@digitalairairlines.com.” A jpegPhoto
    attribute might contain a photograph in the JPEG (binary) format.


    Some attributes of these classes include:


    +   * dn (distinguished name). Unique name for the object.

    * objectClass. Class the object belongs to.

    * cn (common name). Name (e.g., name of a surname).

    * sn (surname).

    * o (organization name). Name of an organisation (e.g., company name)

    * ou (organizational unit). Name of an organisational unit (e.g., name of a department)

    * l (locality name). Location

    * streetaddress. Street

    * c (country).

    * postalcode

    * telephonenumber'
  merge: -1
  pgno: 167
- img_proc: true
  md: "+   - mail. Email address\n\n+   - description. Description of the object\n\
    \nObject classes that LDAP uses for user authentication include\n\n+   - posixAccount\n\
    \n+   - shadowAccount\n\n+   - posixGroup\n\nSome of the attributes that are used\
    \ in these classes include:\n\n+   - uid. Login of the user\n\n+   - uidNumber.\
    \ Numerical user ID\n\n+   - gid. Group name\n\n+   - gidNumber. Numerical group\
    \ ID\n\n+   - homeDirectory. Path of the home directory\n\n+   - loginShell. Path\
    \ of the login shell\n\n+   - shadowLastChange. Date of the last changing of the\
    \ password\n\nIn LDAP, objects can be arranged in a hierarchical tree structure.\n\
    You can distinct between two kinds of objects:\n\n+   - Container objects. Container\
    \ objects are objects, that can have subordinate objects. There are five classes\
    \ of container objects:\n  - Root\n  - c (country)\n  - o (organizational unit)\n\
    \  - dc (domain component)\n\n+   - Leaf objects. Leaf objects cannot have any\
    \ subordinate objects. They are the end of a tree branch. For example:\n  - cn\
    \ (common name)"
  merge: -1
