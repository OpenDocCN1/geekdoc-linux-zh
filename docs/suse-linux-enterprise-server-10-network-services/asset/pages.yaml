- img_proc: true
  md: '# Objective 4 Start, Stop, and Reinitialize Postfix


    Postfix runs by default on SUSE Linux Enterprise Server 10 and it is started in
    runlevel 3 during startup.


    To start Postfix manually, you can use the command


    ```

    rcpostfix start

    ```


    To stop Postfix, enter


    ```

    rcpostfix stop

    ```


    To check the status of Postfix, enter


    ```

    rcpostfix status

    ```


    This command provides information on whether Postfix has already been activated
    on this system.


    If the Postfix configuration has been changed, Postfix has to re-read the modified
    configuration files to adjust mail processing to the changed configuration.


    To do this, enter


    ```

    rcpostfix reload

    ```


    or


    ```

    rcpostfix restart

    ```'
  merge: -1
  pgno: 249
- img_proc: true
  md: '# Objective 5


    # Configure Postfix


    This objective covers the following topics:


    +   - Configure the Postfix Master Daemon

    - Configure Global Settings

    - Configure General Scenarios

    - Configure the Lookup Tables


    # Configure the Postfix Master Daemon


    The Postfix master daemon /usr/lib/postfix/master is started directly by Postfix
    when the system is booted and is terminated only when the system goes down or
    if Postfix ends.


    The Postfix master daemon is normally configured once only when the email system
    is set up, and is usually never changed.


    The master daemon, which monitors the entire mail system,


    +   - Controls and monitors individual Postfix processes.

    - Adheres to configured resource limits, which were defined in the file master.cf.

    - Restarts killed Postfix processes.


    The Postfix master daemon is configured in the file /etc/postfix/master.cf. Each
    line in the file contains an entry for one Postfix process.'
  merge: -1
  pgno: 250
