  md: 'Even when a system is newly installed on a computer, DHCP can be activated
    directly in the network configuration.


    The configuration files for the network interfaces are located in the /etc/sysconfig/network/
    directory. Each interface has its own configuration file; for example, /etc/sysconfig/network/ifcfg-eth-id-00:0c:29:ed:c0:03.
    This file contains the values with which a network card should be activated. If
    an interface should be configured with DHCP, the entry might look like the following:


    ```

    BOOTPROTO=''dhcp''

    BROADCAST=''''

    ETHTOOL_OPTIONS=''''

    IFPLUG_PRIORITY=''20''

    IPADDR=''''

    MTU=''

    NAME=''Vircom Cardbus Ethernet 10/100''\NETMASK=''255.255.255.0''

    NETWORK=''''

    REMOTE_IPADDR=''''

    STARTMODE=''ifplugd''

    UNIQUE=''rBUF.Iew_4A28T26''

    USERCONTROL=''no''

    _nm_name=''bus-pci-0000:07:00.0.''

    ```'
  merge: -1
  pgno: 124
- img_proc: true
  md: '# SUSE Linux Enterprise Server 10: Networking Services


    The following explains the three most important entries:


    +   **BOOTPROTO="dhcp" and STARTMODE="ifplugd"** ensure that the DHCP client is
    launched automatically during the boot process. Otherwise, **BOOTPROTO** is set
    to static.


    +   **UNIQUE=rBUF.iew_4A28T26"** is generated by YaST, if the configuration was
    written by it.


    Options for the DHCP client are stored in the file /etc/sysconfig/network/dhcp.


    The following are some of the important options:


    +   **DHCLIENT_BIN**. Specifies which DHCP client should be used. Possible values
    are **dhcpd** (DHCP client daemon) and **dhclient** (ISC dhclient)


    By default, it is set to **dhcpd**.


    +   **DHCLIENT_DEBUG**. If set to **yes**, any debug output will be written to
    /var/log/messages.


    By default, it is set to **no**.


    +   **DHCLIENT_SET_HOSTNAME**. Should the DHCP client set the hostname? By default


    +   **DHCLIENT_MODIFY_RESOLV_CONF**. Should the file /etc/resolv.conf be modified
    by the client? By default, it is set to **yes**.


    +   **DHCLIENT_SET_DEFAULT_ROUTE**. Should the DHCP client set a default route
    (default Gateway)? By default, it is set to **yes**.


    +   **DHCLIENT_MODIFY_NTP_CONF**. If set to **yes**, the file /etc/ntp.conf is
    modified as needed if the DHCP server is enabled to send NTP server information
    (**option ntp-servers**) and if xtntpd is used.


    By default, it is set to **no**.'
  merge: -1
  pgno: 125
- img_proc: true
  md: '+   - DHCLIENT_SET_DOMAINNAME. Should the DHCP client set the domain name?
    By default, it is set to yes.


    +   - DHCLIENT_KEEP_SEARCHLIST. This option affects the contents of the file /etc/resolv.conf.


    It defines whether the DHCP client should combine a new name search list, as received
    from the DHCP server, with the existing one (yes).


    The default is yes.


    +   - DHCLIENT_HOSTNAME_OPTION. Specifies a string for the hostname field when
    dhcpcd sends DHCP messages. Some DHCP servers will update nameserver entries (dynamic
    DNS).


    By default the current hostname is sent (AUTO), if one is defined in /etc/HOSTNAME.
    Use DHCLIENT_HOSTNAME_OPTION to override the default hostname with another hostname,
    or leave empty to not send a hostname.


    +   - DHCLIENT_CLIENT_ID. Use this option to set to a client ID.


    By default, this ID is equivalent to the MAC address of the client network interface.


    +   - DHCLIENT_SCRIPT_EXE. This option allows you to specify a script to run when
    dhcpcd configures or disables the interface.


    A sample script is in /usr/share/doc/packages/dhcpcd/dhcpcd.exe.


    For instance, scripts that are supposed to be run by dhcpcd (such as dhcpcd.exe)
    can be placed in /etc/sysconfig/network/scripts/


    +   - DHCLIENT_MODIFY_SMB_CONF. Should the DHCP client modify /etc/amba/dhcpcd.conf?
    By default, it is set to yes.'
  merge: -1
