  md: '# Introduction


    Before attending this course, you should have attended the following courses:


    +   - SUSE Linux Enterprise Server 10 Fundamentals (Course 3071)

    - SUSE Linux Enterprise Server 10 Administration (Course 3072)

    - SUSE Linux Enterprise Server 10 Advanced Administration (Course 3073)


    Having passed the Novell CLP is also acceptable preparation.


    SUSE Linux Enterprise Server 10: Networking Services (Course 3074) is the first
    course of the CLE10 track. The final course is SUSE Linux Enterprise Server 10:
    Security (Course 3075).


    ![](img/b7f4ef3c9bdffc8caed3395478c04bab_14_0.png)


    For more information about Novell certification programs and taking the Novell
    CLP 10 and CLE 10 Practicum exam, see http://www.novell.com/training/certinfo.'
