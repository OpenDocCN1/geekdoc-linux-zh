  md: '+   $QUARANTINEDIR. The path to where infected mails can be put. This can be


    +   - a file. Path does not end with backslash.


    +   - a directory. Path ends with backslash.


    +   - disabled. Leave it empty.


    +   $quarantine_subdir_levels. If set to “I” subdirectories in $QUARANTINEDIR
    are created to disperse quarantine.


    +   $daemon_chroot_dir. Run the daemon in the specified chroot jail. If you do
    not want chroot, leave it empty.


    +   $db_home. Path of the databases. Default: $MYHOME/db.


    +   $helpers_home. Sets the environment variable $HOME. The value is passed to
    other SpamAssassin modules.


    +   $pid_file. Path of the PID file.


    +   $lock_file. Path of the lock file.


    +   @local_domains_maps. List of lookup tables that can be used to decide whether
    a recipient is local or not, i.e., if the message is outgoing or not.


    +   @mynetworks. List of IP ranges which determines if the original SMTP client
    address belongs to the internal networks, i.e. if mail is coming from inside.


