  md: '# Objective 7 Troubleshoot DHCP


    The dhcp-tools package contains the two most important tools for troubleshooting
    DHCP. They will be explained in this objective:


    +   - dhcping

    - dhcpcdump


    # dhcping


    You can use the dhcping utility to check if the DHCP server responds.


    You can specify


    +   - The address the client wants to reserve (-c)

    - The server to query (-s)

    - The hardware address of the client (-h)


    If the DHCP server responds, a message similar to the following appears:


    ```

    da51:~ # dhcping -c 10.0.0.5 -s 10.0.0.51 -h 00:90:27:51:47:A9

    Got answer from: 10.0.0.51

    ```


    If the server does not respond, the message looks like the following:


    ```

    da51:~ # dhcping -c 10.0.0.5 -s 10.0.0.200 -h 00:90:27:51:47:A9

    no answer

    ```'
  merge: -1
  pgno: 153
- img_proc: true
  md: 'Subsequently, the log file of the server will contain the following entries:


    ```

    Nov 25 17:05:56 da51 dhcpd: DHCPREQUEST for 10.0.0.5 from

    00:90:27:a4:96:1f via eth0

    Nov 25 17:05:56 da51 dhcpd: DHCPACK on 10.0.0.5 to 00:90:27:a4:96:1f via

    eth0

    Nov 25 17:05:56 da51 dhcpd: DHCPRELEASE of 10.0.0.5 from 00:90:27:a4:96:1f

    via eth0 (not found)

    ```


    # dhcpdump


    You can use the dhcpdump utility to analyze the communication between the client
    and the server.


    For this purpose, the output of tcpdump is piped to dhcpdump:


    ```

    da51:~ tcpdump -lenx -s 1500 port bootps or port bootpc | dhcpdump

    ```


    The output shows the packets that were exchanged between the DHCP server and the
    DHCP client in a legible form, thus facilitating the analysis and troubleshooting.'
  merge: -1
