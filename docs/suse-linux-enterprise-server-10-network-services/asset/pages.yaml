- img_proc: true
  md: '# Objective 6


    # Use Postfix Tools


    Apart from the previously mentioned tools, Postfix also has a whole range of useful
    administration tools that can make life considerably easier for a postmaster.


    This section briefly introduces the administration tools for Postfix:


    +   ****newaliases**: Converts the ASCII file /etc/aliases to the hash table /etc/aliases.db.


    +   **mailq**: Lists all emails in the mail queues that have not yet sent.


    +   **postalias**: Converts the ASCII file /etc/aliases to the hash table /etc/aliases.db.
    Same as **newaliases**.


    +   **postcat**: Displays the contents of a file from the queue directories in
    a readable form.


    +   **postconf**: Without any parameters, this tool displays the values of all
    variables defined in the file /etc/postfix/main.cf as well as the values used
    by the standard variables. To modify variables directly,


    ```

    postconf -e key=value

    ```


    These changes are automatically integrated in the file main.cf.


    +   **postdrop**: This is run automatically by using the **sendmail** command,
    if **sendmail** cannot write any files to the maildrop directory because of missing
    world-writable permissions. It saves the forwarded email as smailid.


    +   **postfix**: Enables configuration errors to be found (**postfix check**),
    forces email from the deferred queue to be delivered immediately (**postfix flush**)
    or rereads the Postfix configuration files (**postfix reload**).


    +   **postmap**: Generates the hash tables for the lookup tables in the directory
    /etc/postfix/.'
  merge: -1
  pgno: 286
- img_proc: true
  md: '+   * **postuper**. Checks the file structure in the queue directories and
    removes unneeded files and directories (**(postuper -s)** or deletes files and
    directories that have been left after a system crash and are useless (**(postuper
    -p)**).


    Individual email messages can be removed from the mail queues with **postuper
    -d ID**.


    In general, **postuper** removes all files that are not normal files or directories
    (such as symbolic links).


    ![](img/b7f4ef3c9bdffc8caed3395478c04bab_287_0.png)


    Run the command **postuper -s** immediately before starting the Postfix system.


    For more information about these tools, see the man page **man 1 Postfix-Tool.**.'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# Receive Email over IMAP and POP3


    To retrieve email from the mail server, you can use two protocols:


    +   - IMAP (Internet Message Access Protocol)

    - POP3 (Post Office Protocol)


    Using IMAP, all emails are kept on the server. To read your email, you always
    have to establish a connection to the server. Using POP3, all email is transferred
    to the client. Email can be removed or kept on the server after they are transferred.


    In this objective, you learn about the following:


    +   - Configure Cyrus IMAPd

    - Configure QPop

    - Sort Mail with Procmail


    # Configure Cyrus IMAPd


    Cyrus IMAPd provides access to email via IMAP and POP3. The mailboxes of the users
    are stored in a database which uses a special format.


    All users which receive email via this service need to exist on the computer.
    These users do not need to have full access to the system; it is sufficient to
    have a username and password.


    All email is stored in a Cyrus hierarchical file structure. Hierarchical means
    that changes on one level also influence the lower levels. It is possible for
    many servers to access this file structure at the same time.


    Cyrus servers can handle many postboxes. Cyrus does not support relational databases
    like MySQL, but Cyrus support quotas and ACLs.'
  merge: -1
  pgno: 288
- img_proc: true
  md: 'To use Cyrus IMAPd, you need to know about the following:


    +   - Install Cyrus IMAPd

    - Configure Postfix to Use Cyrus IMAPd

    - Cyrus IMAPd in Detail


    # Install Cyrus IMAPd


    To install Cyrus IMAPd, select the package cyrus-imapd.


    # Configure Postfix to Use Cyrus IMAPd


    You have to configure Postfix to use Cyrus IMAPd. The file /etc/postfix/master.cf
    already contains the following entry


    ```

    cyrus unix - n n - - pipe

    user=cyrus argv=/usr/lib/cyrus/bin/deliver -e $(sender) -m

    $(extension) $(user)

    ```


    > This calls the program deliver. This program submits all email to the recipients
    on the system. It replaces the program local of Postfix.


    You only need to assign Cyrus the responsibility for a mail domain. You can do
    this for, for example, in the file /etc/postfix/transport by appending the following
    line:


    | digitalairlines.com cyrus:


    The colon at the end of the line is required.'
  merge: -1
  pgno: 289
- img_proc: true
  md: 'With this transport configuration also the emails to user root are forwarded
    to Cyrus. To prevent this add another line that /etc/postfix/transport looks like
    this:


    ```

    root@               local:

    digitalirlines.com  cyrus:

    ```


    To create the corresponding lookup table, we use


    # postmap hash:/etc/postfix/transport


    Now, Postfix will give all email for the domain digitalirlines.com to the program
    deliver of the Cyrus package.


    # Cyrus IMAPd in Detail


    The most important files and directories of Cyrus IMAPd are described in the following:


    +   - /etc/cyrus.conf. The basic configuration file of Cyrus IMAPd. Normally it
    is not necessary to make changes.

    - /etc/imapd.conf. The configuration file of the IMAPd.

    - /var/lib/imap/. This directory contains the variable files of Cyrus IMAPd. This
    includes log files, database files, and information about the mailboxes of individual
    users.

    - /var/lib/imap/mailboxes.db. This file includes the configuration of the mailboxes.
    It is important to back up this file at regular intervals using the cron service
    via the file /etc/cron.daily/cyrus.

    - /var/lib/imap/log/. This log stores information. The file of the log file is
    equivalent to the process number of the IMAP server. If you use the syslog daemon
    for logging, you do not need the files in this directory.

    - /var/lib/imap/quota/. The quotas for each IMAP account can be added here.'
  merge: -1
  pgno: 290
- img_proc: true
  md: '+   * /var/lib/imap/shutdown If this file exists, the IMAP server sends the
    first line of this file as an alert to the client. The connection will be closed
    and no other clients can connect until this file is removed. This is useful for
    maintenance.


    +   * /var/lib/imap/motd. If this exists, the IMAP server sends the first line
    to the client after the connection is created. This can be used for welcome messages.


    +   * /usr/lib/cyrus/. The home directory of the user cyrus. The subdirectory
    bin/ contains most of the programs of the Cyrus IMAPD.


    This objective discusses the following:


    +   * The file /etc/imapd.conf


    +   * Test the IMAPd


    +   * Add Users to the System


    +   * Administer Cyrus IMAPd


    # The file /etc/imapd.conf


    The Cyrus server is configured in the file


    # /etc/imapd.conf


    Each line matches the format


    option: value'
  merge: -1
  pgno: 291
- img_proc: true
  md: '# After Cyrus server installation, the file looks like the following:


    ```

    configdirectory: /var/lib/imap

    partition-default: /var/spool/imap

    sievird: /var/lib/sieve

    admins: cyrus

    allowanonymouslogin: no

    autocreatequota: 10000

    reject8bit: no

    quotawarn: 90

    timeout: 30

    poptimout: 10

    dracinterval: 0

    drachost: localhost

    sasl_pwcheck_method: laslauth

    ltmp_overquota_perm_failure: no

    ltmp_downcase_rcpt: yes

    #

    # if you want TLS, you have to generate certificates and keys

    #

    #tls_cert_file: /usr/ssl/certs/cert.pem

    #tls_key_file: /usr/ssl/certs/skey.pem

    #tls_ca_file: /usr/ssl/CA/CACert.pem

    #tls_ca_path: /usr/ssl/CA

    ```


    # The most important options are


    +   - configdirectory. Location of the directory with the account configurations.


    +   - partition-default. Location where the mailboxes are stored.


    +   - admins. List of users that have administrative permissions. (Use a space
    to separate user names.) By default, the user cyrus is used for administration
    of the IMAP server.


    +   - allowanonymouslogin. If this option is yes, you can log in without entering
    a user name and a password. This should never happen!


    +   - autocreatequota. If this option is set to 0 (zero), the user is allowed
    to create new folders.


    If this option is set to -1, there is no quota for users.'
  merge: -1
