    ```


    Restart Postfix by entering postfix reload.


    # /etc/amavisd.conf


    AMaSd is configured by editing the file /etc/amavisd.conf.

    syntax of this configuration file is plain Perl code. Because of this,

    each line ends in a semicolon.


    In Perl strings in double quotation marks can include variables that

    start with "$\$ or "". To include characters "@" and "$"

    inndouble-quoted strings, they must be preceded by a backslash.


    In single-quoted strings, "$\$ and "@" lose their special

    meaning, so it is usually easier to use single quoted strings.


    In both cases, the backslash needs to be doubled.


    In the documentation directory of AMaViSd-new

    (/usr/share/doc/packages/amavisd-new/), two variants of the

    configuration file are available:


    +   - amavisd-conf-default. Includes all possible parameters with

    the defaults.

    - amavisd-conf-sample. A more structured file with a lot of

    explanations and examples.


    In this section we want to discuss some of the most important

    parameters in order of occurrence in the /etc/amavisd.conf file.


    +   - @bypass_virus_checks_maps. This array includes a list of

    virus lookup tables. You can disable virus checking by setting

    is array to "1" (uncomment the line).'
  merge: -1
  pgno: 337
- img_proc: true
  md: '@bypass_spam_checks_maps. This array includes a list of spam lookup tables.
    You can disable spam checking by setting this array to “1” (uncomment the line).


    Next to @bypass_virus_checks_maps and @bypass_spam_checks_maps, there are two
    more arrays of the same kind available:

    bypass_banned_checks_maps enables checking for banned names or file types.

    bypass_header_checks_maps enables checking for invalid headers.


    $max_servers. Number of pre-forked children.


    Should match the number of your MTA pipe, e.g., the maxproc field in /etc/postfix/master.cf.


    ```

    =======================================================================

    ===

    # service type private unpriv chroot wakeup maxproc command + args

    # (yes) (yes) (yes) (never) (100)

