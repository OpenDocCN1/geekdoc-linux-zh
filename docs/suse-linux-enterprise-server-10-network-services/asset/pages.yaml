  md: '# Objective 4 Configure a DHCP Relay Server


    As routers do not route packets addressed to the broadcast address of the network,
    the DHCP server must be accessible for the DHCP clients in the local network.


    Instead of implementing a DHCP server in every local network, a DHCP relay server
    can be installed on the routers for the routers for the purpose of receiving the
    client broadcasts via one interface and forwarding the broadcasts to the central
    server via the other interface.


    The package is dhcp-relay. The configuration of the DHCP relay is located in the
    file /etc/sysconfig/dhcrelay. The network interfaces are entered under DHCPCRELAY_INTERFACES;
    for example DHCPCRELAY_INTERFACES="eth0 eth1"


    The IP address of the DHCP server to which the relay server will forward the client
    queries must be specified under DHCPCRELAY_SERVERS.


    On the DHCP server itself, a suitable subnet declaration is required for the clients
    in the network behind the router.


    However, the entries do not differ from the entries required for clients in the
    server’s local network.'
  merge: -1
  pgno: 129
- img_proc: true
  md: '# Use DHCP and Dynamic DNS


    If you want clients that are assigned variable IP addresses via DHCP to be accessible
    under their respective names, the DNS server must be informed about the host name
    and the changed addresses.


    This can be done in two ways:


    +   - The client transmits its name to the DHCP server and gets an IP address
    from the DHCP server. The DHCP server transmits the host name and the IP address
    to the DNS server.


    +   - The client gets its name and IP address from the DHCP server. The DHCP server
    transmits the host name and IP address to the DNS server.


    To enable interaction between the DHCP server and DNS server, you must modify
    the respective configuration files (/etc/named.conf and /etc/dhcpd.conf).


    Because the DNS server can only accept changes from the authorized DHCP server,
    the updates must be protected cryptographically using a key.


    This key is generated using the program dnssec-keygen.


    The following parameters may be specified:


    +   -a. The algorithm (RSAMD5, RSASHA1, DSA, DH or HMAC-MD5)


    +   -b. The key length in bits (the key length depends on the used algorithm).


    +   -n. The name type, for example:


    +   - HOST. For a host-specific key


    +   - USER. For a user-specific key


    +   - ZONE. For the protected transmission of zone files'
  merge: -1
  pgno: 130
- img_proc: true
  md: '+   name of the key Used in the configuration files


    The following is an example:


    ```

    da51:- # ddnssec-keygen -a HMAC-MD5 -b 128 -n HOST dhcp-dns

    ```


    Two files are generated in the current directory:


    +   - Kdhcp-dns.+157+23165.key


    +   - Kdhcp-dns.+157+23165.private


    (The second number is a random number).


    The name of the files is written on the screen by the dnssec-keygen command.


    ```

    da51:- # ddnssec-keygen -a HMAC-MD5 -b 128 -n HOST dhcp-dns

    Kdhcp-dns.+157+23165

    ```


    These files contain the key in text:


    ```

    da51:- # cat Kdhcp-dns.+157+23165.key

    dhcp-dns. IN KEY 512 3 157 Usig5qub101Mhk0jzoKQgw==

    ```


    Enter this key and information about the affected zone in the configuration files.'
  merge: -1
  pgno: 131
- img_proc: true
  md: "In the file /etc/named.conf, append the following after options:\n\n```\nkey\
    \ dhcp-dns {\n  algorithm HMAC-MD5;\n  secret Usig5quub11MHk0jzoKQgw==;\n}\n\n\
    zone \"digitalirlines.com\" in {\n  type master;\n  file \"digitalirlines.zone\"\
    ;n  allow-update { key dhcp-dns };\n}\n\nzone \"10.0.0.zone\" in {\n  type master;\n\
    \  file \"digitalirlines.arpa\";n  allow-update { key dhcp-dns };\n}\n```\n\n\
    Because this file contains the key in clear text, the permissions of the configuration\
    \ file must be set so that the file is not readable for all users (this is the\
    \ default for SUSE Linux Enterprise Server 10):\n\n```\nda51:~# # ls -l /etc/named.conf\n\
    da51:~# # -rw-r----- 1 root named 3846 Jun 30 2006 /etc/named.conf\n```\n\nIf\
    \ you include the key using the include statement, it is not necessary to change\
    \ the permissions."
  merge: -1
  pgno: 132
- img_proc: true
  md: "# On the DHCP server, enter the following in the file /etc/dhcpd.conf:\n\n\
    ddns-update-style interim;\nddns-updates on;\n\n```\nkey dhcp-dns {\n    algorithm\
    \ HMAC-MD5;\n    secret Usig5qub101MHk0joKQgw==\n}\n\n# The dot after 0.0.10.in-addr.arpa.\
    \ is essential!\nzone 0.0.10.in-addr.arpa. (\n    key dhcp-dns;\n)\n\n# The dot\
    \ after digitalairirlines.com is essential!\nzone digitalairirlines.com. (\n \
    \   key dhcp-dns;\n)\n```\n\nThe two important parameters are described below:\n\
    \n+   **ddns-update-style.** Describes how the DNS is updated. A DNS server usually\
    \ maintains two resource records for each client. It maps FQNs to IP addresses\
    \ using A records. The other maps the IP address to the FQDN using PTR records\
    \ (Pointer).\nTwo update-styles are common:\n* **ad-hoc.** The A record will contain\
    \ the IP address that the client was assigned in its lease. If there is already\
    \ an A record with the same name in the DNS server, no update of either the A\
    \ or PTR records will occur.\n* If the A record update succeeds, a PTR record\
    \ update for the assigned IP address will be done, pointing to the A record. This\
    \ update is unconditional - it will be done even if another PTR record of the\
    \ same name exists."
  merge: -1
  pgno: 133
- img_proc: true
  md: 'When the client''s lease expires, the DHCP server will remove the client''s
    A and PTR records from the DNS database. If the client releases its lease by sending
    a DHCPPRELEASE message, the server will likewise remove the A and PTR records.


    +   - Unlike the ad-hoc style, the DHCP server does not necessarily update both
    the A and the PTR records. The FDQN option includes a flag which, when sent by
    the client, indicates that the client wants to update its own record. In that
    case, the server can be configured either to honor the client''s intentions or
    ignore them.


    +   - If the server is configured to allow client updates, the client sends a
    fully qualified domain name, the server will use that name sent to update the
    PTR record. The client also indicates that it wants to update its own record,
    the DHCP server will not attempt to set up an A record for the client, but does
    set up a PTR record for the IP address that it assigns the client, pointing at
    the FDQN supplied by the client.


    +   - If the server is configured not to allow client updates or if the client
    doesn''t want to do its update, the server will simply choose a name for the client,
    possibly using the hostname supplied by the client. If the client sends a FDQN,
    the server uses only the leftmost part of it. However, if the server configuration
    contains an option ddns-hostname, this takes precedence over a possible client
    supplied FDQN or hostname.


    The ad-hoc style is deprecated.


    +   - ddns-updates. Activates dynamic DNS.


    As this file contains the key in clear text, you must modify the file permissions
    of the configuration file to prevent it from being readable for all users:


    ```

    da51:~ # chmod 600 /etc/dhcpcd.conf

    ```'
  merge: -1
  pgno: 134
- img_proc: true
  md: "The client-specific entries depend on whether the client transmits host name\
    \ to the DHCP server or gets its host name from the DHCP server:\n\nThe following\
    \ happens:\n\n+   - The Client Transmits Its Name to the DHCP Server\n- The DHCP\
    \ Server Assigns a Name to the Client\n\nThen the zone files are updated.\n\n\
    # The Client Transmits Its Name to the DHCP Server\n\nIn the case DHCP server\
    \ gets the host name from the client, the configuration within a subnet declaration\
    \ is the same as the configuration without dynamic DNS.\n\n```\nsubnet 10.0.0.0\
    \ netmask 255.255.255.0 {\n  range 10.0.0.50 10.0.0.90;\n  # options may also\
    \ be put here if they are not global\n}\n```\n\n# The DHCP Server Assigns a Name\
    \ to the Client\n\nIn this case, a client must always be assigned the same host\
    \ name, even if the IP address changes.\n\nThe allocation of the name to the host\
    \ is based on the MAC address of the network card."
  merge: -1
  pgno: 135
- img_proc: true
  md: 'An entry for a client could look as follows (the IP address assigned to the
    client is derived from a subnet declaration that is independent from the host
    entry):


    ```

    host da5.digitalairlines.com {

    # The following entries concern the host

    # with this MAC address:

    hardware ethernet 00:90:27:a4:96:1f;

    da5 and digitalairlines.com are transmitted to the DNS server:

    dnns-domainname "da5";

    ```


    # The host name da5 is transmitted to the client:

    option host-name "da5";


    The client has to be configured in such a way that it accepts the host via DHCP.


    The easiest way to do this is to use YaST. Do the following:


    +   1. Select YaST2 > Network Devices > Network Card.

    2. Select a network card.

    3. Under Host Name and Name Server, select Change Host Name via DHCP.


    YaST changes the entry DHCPCLIENT_SET_HOSTNAME in /etc/sysconfig/network/dhcp
    to yes.


    The host name entered in the file /etc/dhcpd.conf under host-name will be displayed
    at the login prompt.


    The log file (/var/log/messages) of the DNS server and the DHCP server provide
    information about the address assignment and the success or failure of the DNS
    server update.'
  merge: -1
  pgno: 136
