  md: '# Summary


    Objective


    Summary


    +   1. Understand what OpenSLP Is Service Location Protocol (SLP) provides the
    dynamic discovery of services.

    On SUSE Linux Enterprise Server 10, OpenSLP is available. It''s an Open Source
    implementation of SLP v2.

    OpenSLP registers service information in a database and allows SLP clients to
    query the database to find these services.


    +   2. Understand the SLP Agents OpenSLP uses agents to represent applications
    and services on the network:

    * User Agent

    * Service Agent

    * Directory Agent

    The dialog between these agents is limited to very simple exchanges of request
    and reply messages.

    SLP is a unicast and multicast protocol. The messages can be sent

    * To one agent at a time (unicast)

    or

    * To all agents (that are listening) at the same time (multicast)'
  merge: -1
  pgno: 393
- img_proc: true
  md: '# Objective Summary


    3. Configure OpenSLP


    To configure OpenSLP, you need to know the following:


    +   - The OpenSLP Daemon slpd

    The OpenSLP daemon is /usr/sbin/slpd.

    - On SUSE Linux Enterprise Server 10, the daemon is installed and active by default.

    - Its init script is /etc/init.d/slpd.

    - To stop the daemon, enter /etc/init.d/slpd stop or rcslpd stop

    - To start the daemon, enter /etc/init.d/slpd start or rcslpd start

    - To restart the daemon, enter /etc/init.d/slpd restart or rcslpd restart

    - To check the daemon''s status, enter /etc/init.d/slpd status or rcslpd status'
  merge: -1
