- img_proc: true
  md: "# Edit the OpenLDAP Configuration Files\n\nThe configuration files for OpenLDAP\
    \ are located in the directory /etc/openldap/. The directory contains two configuration\
    \ files:\n\n+   - Configure the OpenLDAP Server with slapd.conf\n- Configure the\
    \ LDAP Clients with ldap.conf\n\n# Configure the OpenLDAP Server with slapd\n\n\
    The default version of the configuration file /etc/openldap/slapd.conf has only\
    \ a few options. Most of them do not need to be changed:\n\n+   - **include.**\
    \ The first entry includes a schema file. In this schema some object classes and\
    \ their attributes are defined. You can use these object classes to build a database.\n\
    - For simple example configurations, only the object classes of the *core* schema\
    \ needs to be included.\n- **referral.** Specifies the referral to pass back when\
    \ the slapd cannot find a local database to handle a request.\n- **pidfile.**\
    \ Path to the file that stores the process ID.\n- **argsfile.** Path to the file\
    \ that stores the server's command line options.\n- **modulepath.** Backend modules\
    \ that are loaded dynamically. With the **modulepath** directive you specify a\
    \ list of directories to search for loadable modules.\n- **moduleload.** Specifies\
    \ the filename or the absolute path of a dynamically loadable module.\n- **security.**\
    \ Specifies a set of security strength factors to require. The directive may be\
    \ specified globally and/or per-database. Possible security strength factors:\n\
    \  - **ssf.** Specifies the overall security strength factor."
  merge: -1
  pgno: 191
- img_proc: true
  md: '+   - transport. Specifies the transport security strength factor.


    +   - tls. Specifies the TLS security strength factor.


    +   - sasl. Specifies the SASL security strength factor.


    +   - update_*. Specifies the security strength factors required for directory
    updates.


    +   - simple_bind. Specifies the security strength factor required for simple
    username/password authentication.


    For a more detailed description, read the section about sasl-secprops in slapd.conf
    manage (man 5 slapd).


    +   - access to. Grant access to a set of entries and/or attributes by one or
    more requesters.


    Syntax: **access to objects [requesters level control]**


    The **objects** and the **requesters** are specified by their DNs.


    **As requesters**, you can also use the asterisk for *everybody*. self means the
    owner object of the attribute. You can also specify a DN by **dn=DN** or a group
    **group=DN**.


    The level can be:


    +   - read (Read access)


    +   - write (Write access)


    +   - auth (Authentication access)


    +   - none (No access)


    Example 1:


    ```

    access to attrs=userpassword

    by self write

    by anonymous auth

    by * none


    access to *

    by * read

    ```'
  merge: -1
  pgno: 192
- img_proc: true
  md: "# Example 2:\n\n```\naccess to *\nby dn=\"cn=Administrator,dc=digitalairlines,dc=com\"\
    \ write\nby * read\n```\n\n+   - database. Specifies the kind of back end. The\
    \ following databases are supported:\n  - bdb. Berkeley DB\n  - dnssrv. DNS SRV\n\
    \  - hdb. A hierarchical variant of bdb\n  - ldap. Lightweight Directory Access\
    \ Protocol (Proxy)\n  - ldbm. Lightweight DBM\n  - meta. Meta directory\n  - monitor.\
    \ Monitor backend\n  - password. Read-only access to passwd\n  - perl. Perl programmable\
    \ backend\n  - shell. External shell program\n  - sql. SQL programmable backend\n\
    \n+   - suffix “DN\"\nSpecify the DN suffix of queries that will be passed to\
    \ the backend database.\nExample:\n\n```\nsuffix \"dc=digitalairlines,dc=com\"\
    \n```\n\n+   - checkpoint ops minutes. Checkpoints are only tested after successful\
    \ write operations. If ops operations have been completed or more than the specified\
    \ number of minutes have passed, a new checkpoint is performed."
  merge: -1
  pgno: 193
- img_proc: true
  md: '+   - cachesize. Size of in-memory cache of the LDBM backend database.


    +   - rootdn "DN"


    This line sets the administrator of the LDAP server. You can also configure the
    domain components in this line.

    Example:


    ```

    rootdn      "ou=slc,dc=digitalairlines,dc=com"

    ```


    +   - rootpw password This specifies the password for the administrator. The default
    password secret must be changed.


    For security reasons, the password should be stored in an encrypted form. To create
    an encrypted password, use the following command:


    ```

    slappasswd -s your_password

    ```


    The command outputs a string that has to be copied into the configuration file.


    ```

    da51:~ slappasswd -s novell

    ((SSH)5JHIj3Q17MpxaNT95DqVg2u1VjfJyZhH

    ```


    The entry for the command rootpw looks like the following:


    ```

    rootpw      "(SSH)5JHIj3Q17MpxaNT95DqVg2u1VjfJyZhH"

    ```


    +   - directory. Path to the BDB or HDB database. This directory must exist before
    the server is started.


    +   - index. Specifies the indices to maintain. This increases the speed of the
    search.

    Syntax: index attributes types'
  merge: -1
  pgno: 194
- img_proc: true
  md: 'Possible types are:


    +   - **pres.** Allows filters to be used that ask if the attribute is present
    in an entry (cn=*).


    +   - **eq.** Allows filters to be used that ask if an attribute has an exact
    value. It includes presence, so it is not necessary to index something as pres,eq.


    +   - **approx.** Allows filters to be used that ask if an attribute value is
    "similar to" something.


    +   - **sub.** Allows filters to be used that do substring searches on an attribute''s
    values.


    +   - **none.**


    After finishing the configuration, you can start the server with the following
    command:


    # rcldap start


    If you want to start the LDAP server automatically when the server boots, use
    the following command:


    # insserv ldap


    # Configure the LDAP Clients with LDAP.conf


    After you have changed the server configuration file, you need to change the client
    configuration. Two files are important:


    +   - /etc/ldap/ldap.conf


    +   - /etc/ldap.conf'
  merge: -1
  pgno: 195
- img_proc: true
  md: "```\n/etc/openldap/ldap.conf\n```\n\nThe file /etc/openldap/ldap.conf is the\
    \ configuration file of the LDAP client.\n\nThe most important options are specified\
    \ below:\n\n+   - **host 127.0.0.1**\n  This line sets the default server that\
    \ LDAP clients should connect to.\n- **base dc=digitalairlines,dc=com**\n  This\
    \ is the default directory search base that should be used by LDAP clients.\n\n\
    For a standard installation, there is one more line in /etc/ldap.conf:\n\n| TLS_REQCERT\
    \ | allow |\n\n**TLS_REQCERT** specifies what checks, if any, to perform on server\
    \ certificates in a TLS session. The level can be specified as one of the following\
    \ keywords:\n\n+   - **never.** The client will not request or check any server\
    \ certificate.\n- **allow.** The server certificate is requested. If no certificate\
    \ or a bad certificate is provided, the session proceeds normally.\n- **try.**\
    \ The server certificate is requested. If no certificate is provided, the session\
    \ proceeds normally. If a bad certificate is provided, the session is immediately\
    \ terminated.\n- **demand or hard.** The server certificate is requested. If no\
    \ certificate or a bad certificate is provided, the session is immediately terminated.\
    \ (default)\n\nFor more options, read the manual **man 5 ldap.conf.**"
  merge: -1
  pgno: 196
- img_proc: true
  md: "# /etc/ldap.conf\n\nThe file /etc/ldap.conf is the configuration file for the\
    \ LDAP\nnameservice switch library, the LDAP PAM module, and the\nshadow package.\
    \ The file belongs to the RPM package pwudits.\n\n```\nda51:~ # rpm -qf /etc/ldap.conf\n\
    pwudits-3.0.7.1-17.10\nda51:~ #\n```\n\nThe most important options of /etc/ldap.conf\
    \ are:\n\n+   - host. Specifies the name(s) or IP address(es) of the LDAP\nserver(s)\
    \ to connect to.\n- base. Specifies the default base distinguished name (DN) to\n\
    use for searches.\n- ldap_version. Specifies the version of the LDAP protocol;\
    \ \"3\"\nstands for LDAPv3.\n- bind_policy. Specifies what happens if the LDAP\
    \ server is not\nreachable. The possible values are:\n  - hard. nss_ldap will\
    \ retry connecting to the software with\n    exponential backoff. (default)\n\
    \  - soft. Forbids nss_ldap from retrying failed LDAP queries.\n- binddn. Specifies\
    \ the distinguished name with which to bind to\nthe directory server(s).\n  The\
    \ default is to bind anonymously.\n- bindpw. Specifies the cleartext credentials\
    \ ith which to bind.\nThis option is only applicable when used with binddn above.\n\
    - scope. Specifies the search scope. Possible values are:\n  - sub. subtree\n\
    \  - one. one level\n  - base. base object"
  merge: -1
  pgno: 197
- img_proc: true
  md: "The default scope is sub; base scope is almost never useful for nameservice\
    \ lookups.\n\n+   * pam_password. Specifies the password change protocol to use.\
    \ The following protocols are supported:\n    * clear. Change password using LDAPModify\
    \ request, replacing the userPassword value with the new cleartext password.\n\
    \    * clear_remove_old, nds or racf. Change password using LDAPModify request,\
    \ first removing the userPassword value containing the old cleartext password,\
    \ and adding the userPassword value with the new cleartext password. This protocol\
    \ is necessary for Novell NGS and IBM RACF.\n    * crypt. Change password using\
    \ LDAPModify request, first generating a one-way hash of the new password crypt(3)\
    \ and replacing userPassword value with the new hashed password.\n    * md5. Change\
    \ password using LDAPModify request, first generating a one way hash of the new\
    \ password MD5 and replacing userPassword value with the new hashed password.\n\
    \    * ad. Change password using LDAPModify request, using the Active Directory\
    \ Services Interface (ADSI) password change protocol.\n    * exop. Change password\
    \ using the RFC 3062 modify extended operation (only the new password is sent).\n\
    \    * exop_send_old. Change password using the RFC 3062 password modify extended\
    \ operation (both the old and new passwords are sent). This is the preferred choice\
    \ when using the PADL XAD identity server.\n\n+   * ssl. Specifies whether to\
    \ use SSL/TLS or not. The following values are possible:\n    * on"
