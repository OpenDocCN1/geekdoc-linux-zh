    nsmtp  inet n           - n           - 2 smtpd -o

    content_filter=smtp:[127.0.0.1]:1024

    ```


    $daemon_user and $daemon_group. User and group to which the daemon will change.


    $mydomain. The domain name.


    $MYHOME. Location where the AMViSd-new files are stored.


    $TEMPBASE. The path of a temporary directory that can be used by AMViSd-new. This
    directory must exist or needs to be created manually.


    In the following line an environment variable $TMPDIR is defined with the content
    of the $TEMPBASE variable.'
