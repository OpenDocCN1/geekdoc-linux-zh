  md: '# Scenario


    Digital Airlines is planning on deploying SUSE Linux Enterprise Server 10 in its
    IT infrastructure. During the first phase, SUSE Linux Enterprise Server 10 will
    be used on the back-end systems like file, web, and network-infrastructure servers.


    As the network administrator for your Digital Airlines office, (along with management)
    have designed a migration plan which includes the following services to be migrated
    to SUSE Linux Enterprise 10:


    +   - DNS services on the internal network

