- img_proc: true
  md: '# Objective 3 Start the SNMP Agent


    snmpd is an SNMP agent which binds to a port and awaits requests from SNMP management
    software.


    Upon receiving a request, it processes the request(s), collects the requested
    information and/or performs the requested operation(s) and returns the information
    to the sender.


    snmpd knows a lot of options. The most important are:


    +   - -a. Log the source addresses of incoming requests.

    - -A. Append to the log file rather than truncating it.

    - -c file. Read file as a configuration file.

    - -C. Do not read any configuration files except the ones optionally specified
    by the -c option.

    - -d. Dump (in hexadecimal) the sent and received SNMP packets.

    - -D[token,...]. Turn on debugging output only for the specified tokens. Without
    any tokens specified, it defaults to printing all the tokens.


    ![](img/b7f4ef3c9bdffc8caed3395478c04bab_471_0.png)


    To get a list of all compiled modules, run the agent with the arguments -Dmib_init
    -Hf.


    +   - -g GID. Change to the numerical group ID GIF after opening listening sockets.

    - -I [-modules]. Specifies which modules should be initialized when the agent
    starts up. (the comma-separated list of modules is preceded by a "-", it is the
    list of modules that should not be started.

    - -L[efos]. Specify where logging output should be directed.. The possible options
    are:'
  merge: -1
  pgno: 471
- img_proc: true
  md: '+   e. Log messages to the standard error stream.


    +   f file. Log messages to the specified file.


    +   o. Log messages to the standard output stream.


    +   s facility. Log messages via syslog, using the specified facility.


    +   - MIBList. Specifies a colon-separated list of MIB modules to load for this
    application.


    +   - -M DirList. Specifies a colon-separated list of directories to search for
    MIBs.


    +   - -p file. Save the process ID of the daemon in the specified files.


    +   - -q. Print simpler output for easier automated parsing.


    +   -r. Do not require access to run the daemon. This option prevents snmpd from
    exiting if it doesn''t have permission to read something.


    +   - -u UID. Change to the user ID after opening listening sockets.


    +   - -V. Symbolically dump SNMP transactions.


    +   -x address. Listens for AgentX connections on the specified address.


    +   -X. Run as an AgentX subagent rather than as an SNMP master agent.


    +   ---token="value". Allows you to specify any token supported by the snmpd conf
    file and sets its value to value.


    Many utilities are included in the net-snmp package. Most of them are elementary
    utilities to access the MIB:


    +   - /usr/bin/snmpget. Get information from the MIB.


    +   - /usr/bin/snmpset. Set information in the MIB.


    +   - /usr/bin/snmpnetstat. Show network status using SNMP (similar to netstat).'
  merge: -1
  pgno: 472
- img_proc: true
  md: '+   - **/usr/bin/snmtranslate**. Translates the object information values into
    human readable terms.

    - **/usr/bin/snmtrap**. Informs the manager program about traps of the agent.
    The daemon version /usr/sbin/snmptrapd receives and logs SNMP trap messages.

    - **/usr/bin/snmpwalk**. Incremental request of a MIB (sub-)tree.'
  merge: -1
  pgno: 473
- img_proc: true
  md: '# Objective 4


    # Test the SNMP Configuration


    For the examples in this objective the configuration file

    /etc/snmp/snmp.conf has to look like the following:


    ```

    syslocation My Desk

    syscontact BOPH (root@localhost)

    rocomunity public 127.0.0.1

    #

    rocommunity public 147.2.90.0/23

    #

    rowcommunity mysecret 127.0.0.1

    #

    rowcommunity mysecret 147.2.90.0/23

    #

    proc nmbd 1 1

    #

    trapcommunity mysecret

    #

    trapsink 147.2.90.112

    defaultMonitors yes

    ```


    ```

    # Location of the system

    # responsible administrator

    # allow public read-only community

    from loopback address

    # allow public read-only community

    from 147.2.90.0/23 network

    # allow read-write community

    from loopback address

    # allow read-write community

    from 147.2.90.0/23 network

    # check ps process so that exactly

    one instance is running

    # specify the community used for

    snmp traps

    # specify the trap target host

    # run default monitors for snmp trap

    alarming

    ```


    If you cannot remember allowed parameters, you can run the

    command snmpd -H to view a full list of directives and their

    values.


    First make sure if the SNMP daemon is running:


    ```

    da51:/etc/snmp # rcsnmp status

    Checking for service snmpd:

    da51:/etc/snmp #

    ```


    If it is not started yet, start it using rsnmp start.


    Take a look at the log file /var/log/net-snmpd.log (you may see

    errors).


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  pgno: 474
- img_proc: true
  md: '# SUSE Linux Enterprise Server 10: Networking Services


    Now you should be able to query the entries using the command snmpget:

    da5:/etc/snmp # snmpget -v 1 -c public 127.0.0.1 system.sysContact.0\SNMPv2-MIB:sysContact.0
    = STRING: BOPH (root@localhost)


    The used options are:


    +   - -v version. Version number of the used protocol.

    - -c community. Name of the community.


    An overview of the options of many SNMP commands can be found in man 1 snmpcmd.


    You can also monitor your system using the SNMP tool.


    Let''s check the networking statistics for the eth0 device:


    ```

    da51:/etc/snmp # snmpstat -v 2c -c public 10.0.0.51 -Can

    Active Internet (tcp) Connections (including servers)

    Proto Local Address Remote Address (state)

    tcp *.111 *.* LISTEN

    tcp *.631 *.* LISTEN

    tcp *.5831 *.* LISTEN

    tcp *.5901 *.* LISTEN

    tcp 127.0.0.1.25 *.* LISTEN

