  md: '# Minimal SMTP Command Implementation


    Not all commands introduced up to now are implemented by every server. Certain
    SMTP commands are intentionally not included in some server implementations to
    increase the security of the server. One such security-critical command is HELP.
    The Postfix SMTP server by Wietse Venema has not fully implemented this command
    and simply responds to a HELP command with reply code 502 ("Command not implemented")."


    The following list shows the SMTP commands that an SMTP server absolutely must
    implement to provide SMTP communication:


    +   * HELO

    * MAIL FROM:

    * RCPT TO:

    * DATA

    * RSET

    * NOOP

    * QUIT'
  merge: -1
