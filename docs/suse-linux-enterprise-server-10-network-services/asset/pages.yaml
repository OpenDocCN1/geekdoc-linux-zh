  md: '# SECTION 6 Monitor Network Traffic


    After deploying your server in a network, it''s important to monitor your server
    network communications.


    If you deploy your server in an existing network where you already have a network-wide
    monitoring and management system based on SNMP, we recommend adding the new server
    to that framework by configuring the package net-snmp (based on the CMU 2.1.2.1
    cmu-snmp code).


    This type of configuration must follow the policies you established in your network-wide
    SNMP configuration.


    However, if you do not have an SNMP-based monitoring system, this section introduces
    you to some useful tools for monitoring network traffic on your SUSE Linux Enterprise
    Server 10.


    While these tools do not provide a management functionality like SNMP, they do
    provide capabilities critical for troubleshooting networking issues.


    # Objectives


    +   1. Use ntop to Monitor Network Traffic

    2. Use Nagios to Monitor Hosts, Services, and Network

    3. Troubleshoot the Network with Ethereal and tcpdump'
  merge: -1
  pgno: 396
- img_proc: true
  md: '# Objective 1 Use ntop to Monitor Network Traffic


    ntop is a web-based traffic monitor that shows network usage, similar to what
    the top command does. It is not included on SUSE Linux Enterprise Server 10 anymore.
    But it is included on the Course DVD.


    In this objective you will learn the following:


    +   - Configure ntop

    - Use ntop


    # Configure ntop


    To install ntop, select the ntop package in the software installation of YaST.


    The configuration file of ntop is /etc/sysconfig/ntop. The available options are:


    +   - NTOPD_IFACE. Specifies the network interface used by ntop. If you enter
    more than one interface, commas to separate the entries.

    - NTOPD_PORT. Specifies the port used by ntop (default: 3000).

    - NTOPD_SSL_PORT. Define the SSL port. You have to generate a certificate to run
    ntop with this option.

    - NTOP_USER. Define the user to run ntop. This should not be root!

    - NTOPD_ARGS. Additional arguments when starting ntop with the init script /etc/init.d/ntop
    or rcntop.


    See man 8 ntop for all available command line options.'
  merge: -1
  pgno: 397
- img_proc: true
  md: '# Use ntop


    Before starting ntop, you have to set the administrator password:


    ```

    da51:~ # ntop -A u wwwrun

    Tue May 24 04:32:57 2005 IniInitializing gdbm databases

    Tue May 24 04:32:57 2005 Now running as requested user ''wwwrun'' (30:8)


    Please enter the password for the admin user:

    nPlease enter the password again:

    Tue May 24 04:32:59 2005 Admin user password has been set

    da51:~ #

    ```


    +   - The -A parameter starts ntop, sets the admin password, and quits

    top. -A will prompt the user for the password.


    +   - The -u parameter specifies the user ntop should run as after

    initializes.


    The password is stored in the file /var/lib/ntop/ntop_pw.db.


    ntop must normally be started as root so that it has sufficient

    privileges to open the network interfaces in promiscuous mode

    to receive raw frames.


    After starting ntop, the processes run with the UID of the user

    spec on the command line. On SUSE Linux Enterprise Server 10,

    normally the user wwwrun is used for running ntop.


    This section covers the following:


    +   - Use ntop in Web Mode

    - Command Options of ntop'
  merge: -1
  pgno: 398
