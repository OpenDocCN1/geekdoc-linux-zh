  md: '# Objective 3


    # Configure OpenSLP


    On SUSE Linux Enterprise 10, the following packages are installed by default:


    +   - **openslp-server**. This package contains the SLP server (daemon), the init
    script, and documentation.


    Every system that provides any service that should be used by an SLP client has
    to run this server.


    +   - **openslp**. This package includes runtime libraries and slptool; a command
    line frontend.


    To ensure OpenSLP provides service information on your local network, you need
    to know the following:


    +   - The OpenSLP Daemon slpd

    - The OpenSLP Configuration Files

    - The OpenSLP Registration Files


    # The OpenSLP Daemon slpd


    The OpenSLP daemon /usr/sbin/slpd provides


    +   - Service Agent and Directory Agent functionality.

    - The ability to maintain a consistent state with respect to the locations of
    other SLP agents on the network.


    On SUSE Linux Enterprise 10, the daemon is installed and active by default. Its
    init script is `/etc/init.d/slpd`.


    When spld is started, it reads


    +   - The configuration file /etc/slp.conf (see “The OpenSLP Configuration File”
    on 5-12).

    - The registration files of the services that should be maintained by OpenSLP
    (see “The OpenSLP Registration Files” on 5-18).'
  merge: -1
  pgno: 371
- img_proc: true
  md: 'If any changes are made to the configuration files or to the registration files,
    the daemon needs to be restarted for the changes to be effective.


    To do this, enter as root


    ```

    /etc/init.d/slpd restart

    ```


    or


    ```

    rslpd restart

    ```


    To stop the daemon, enter as root


    ```

    /etc/init.d/slpd stop

    ```


    or


    ```

    rslpd stop

    ```


    To start the daemon, enter as root


    ```

    /etc/init.d/slpd start

    ```


    or


    ```

    rslpd start

    ```


    To check the daemon''s status, enter as root


    ```

    /etc/init.d/slpd status

    ```


    or


    ```

    rslpd status

    ```


    The OpenSLP daemon slpd must run as root initially in order to bind to the well-known
    SLP port. However, slpd will relinquish root privileges and suid(0) to the daemon
    user (if it exists).


    ![](img/b7f4ef3c9bdffc8caed3395478c04bab_372_0.png)'
  merge: -1
  pgno: 372
- img_proc: true
  md: '# The OpenSLP Configuration File


    The OpenSLP configuration file is /etc/slp.conf. The OpenSLP daemon slpd reads
    this file when it is started or restarted.


    This file contains configuration information that affects


    +   - The operation of the OpenSLP daemon (/usr/sbin/slpd)

    - Any application that uses the OpenSLP library (/usr/lib/libslp.so)


    The default settings of slpd will meet common requirements.

    Therefore, you do not need to modify this file.


    To understand this file, you need to know the following:


    +   - The Syntax of /etc/slp.conf

    - Parameters in /etc/slp.conf


    # The Syntax of /etc/slp.conf


    Each parameter in the slp.conf file is in a single line in the format


    parameter=value


    For example: net.slp.useScopes=DEFAULT


    Comment lines begin with “#” or “;”.


    ![](img/b7f4ef3c9bdffc8caed3395478c04bab_373_0.png)


    The file syntax is specified in RFC 2614.


    The parameters are described in the following section.'
  merge: -1
  pgno: 373
- img_proc: true
  md: '# Parameters in /etc/slp.conf


    The following is a list of parameters that are supported by OpenSLP:


    +   - net.slp.interfaces. This parameter is a comma-separated list of interfaces
    (local IP addresses) on which Directory Agent or Service Agent should listen for
    OpenSLP requests.


    This parameter is optional for the User Agent but required for a Service Agent
    or Directory Agent to operate properly.


    Both IPv4 and IPv6 addresses may be specified.


    While site-local and global IPv6 addresses are allowed, a Directory Agent or Service
    Agent can only receive IPv6 multicast on link-local addresses.


    By default, OpenSLP uses all interfaces.


    +   - net.slp.useScopes. This parameter is a comma-delimited list of strings indicating
    the only scopes a User Agent or Service Agent is allowed when making requests
    or registering, or the scopes a Directory Agent must support.


    The default value is DEFAULT. That means all services are registered in that scope.


    +   - net.slp.DAAAddresses. This parameter allows you to force User Agents and
    Service Agents to use specific Directory Agents.


    If this setting is not used, dynamic Directory Agent discovery will be used to
    determine which Directory Agents to use.


    The default is to use dynamic Directory Agent discovery.


    +   - net.slp.broadcastAddr. This parameter is a string indicating the broadcast
    address to use when sending broadcast packets. This parameter is only applicable
    when the other broadcast configuration variables are set.


    The default value is 255.255.255.255.'
  merge: -1
  pgno: 374
- img_proc: true
  md: '+   * net_slp.isBroadcastOnly. This parameter forces broadcasts to be used
    instead of mulicast.


    This parameter is seldom necessary since OpenSLP will automatically use broadcast
    if multicast is unavailable.


    The default value is false.


    +   * net_slp.passiveDADetection. A boolean indicating passive Directory Agent
    detection should be used.


    The default value is true.


    +   * net_slp.DAADiscoveryInterval. A 16-bit positive integer giving the number
    of seconds between Directory active discovery queries.


    The default value is 900 seconds (15 minutes).


    If the property is set to zero, active discovery is turned off.


    This is useful when the available Directory Agents are explicitly restricted to
    those obtained from DHCP or the net_slp.DAAaddresses property.


    +   * net_slp.multicastTTL. A positive integer that is less than or equal to 255.


    The default value is 255.


    +   * net_slp.multicastMaximumWait. An integer giving the maximum amount of time
    (in milliseconds) to perform multicast requests.


    The default value is 15000 ms (15 seconds).


    +   * net_slp.unicastMaximumWait. An integer giving the maximum amount of time
    (in milliseconds) to perform unicast requests.


    The default value is 15000 ms (15 seconds).


    +   * net_slp.randomWaitBound. An integer giving the maximum value for all random
    wait parameters.'
  merge: -1
  pgno: 375
- img_proc: true
  md: 'The default value is 1000 (1 second).


    +   - net.slp.MTU. An integer giving the network packet MTU in bytes.


    This is the maximum size of any datagram, but the implementation might receive
    a larger datagram.


    The default value is 1400 (bytes).


    +   - net.slp.securityEnabled. A boolean indicating whether the agent should enable
    security for URLs, attribute lists, DAAverts, and SAAdverts.


    Each agent is responsible for interpreting the property appropriately.


    The default value is false.


    +   - net.slp.locale. An RFC 1766 Language Tag [6] for the language locale.


    Setting this property causes the property value to become the default locale for
    OpenSLP messages.


    This property is also used for Service Agent and Directory Agent configuration.


    The default value is en (English).


    +   - net.slp.maxResults. A 32-bit integer giving


    +   - The maximum number of results to accumulate and return for a synchronous
    request before the timeout.


    +   - or the maximum number of results to return through a callback if the request
    results are reported asynchronously.


    +   - net.slp.isDA. A boolean indicating whether the OpenSLP server is to act
    as a Directory Agent.


    If the value is false, the OpenSLP server does not run as a Directory Agent.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  pgno: 376
- img_proc: true
  md: 'The default value is false.


    +   - net.slp.DaHeartBeat. A 32-bit integer giving the number of seconds for the
    Directory Agent heartbeat.


    The default value is 3 hours (10,800 seconds).


    This option will be ignored if the value of net.slp.isDA is false.


    +   - net.slp.useIPv4. This parameter specifies whether IPv4 should be used for
    OpenSLP.


    The default value is true.


    +   - net.slp.useIPv6. This parameter specifies whether IPv6 should be used for
    SLP.


    The default value is true.'
  merge: -1
  pgno: 377
- img_proc: true
