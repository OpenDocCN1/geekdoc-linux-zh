  md: '# Activate pam_ldap


    To activate PAM and NSS, you have to add LDAP as a possible source for authentication.
    You have to make sure the following lines are in file /etc/nsswitch.conf:


    ```

    passwd: compat

    group: compat

    ...

    passwd_compat: 1ldap

    group_compat: 1ldap

    ```


    If you configure the LDAP client with YaST the PAM module pam_ldap.so is activated
    for all kinds of authentication. This is done in the file /etc/security/pam_unix2.conf.


    ```

    auth: use_ldap

    account: use_ldap

    password: use_ldap

    session: none

    ```


    If you configure the LDAP client manually, you can activate the LDAP authentication
    for selected services.


    To do this, use the PAM module pam_ldap.so (included in the package pam_ldap)
    is used. Add the module corresponding to the service to the PAM configuration
    file in /etc/pam.d.


    For example, if you want LDAP authentication for ssh, the file /etc/pam.d/sshd
    must look like this:


    ```

    ##PAM-1.0

    auth include common-auth

    account include required pam_nologin.so

    account include common-auth

    password include common-password

    session include common-session

    # Enable the following line to get resmgr support for

    # ssh sessions (see /usr/share/doc/packages/resmgr/README)

    #session optional pam_resmgr.so fake_ttyname

    ```'
  merge: -1
  pgno: 213
- img_proc: true
  md: 'Here the files common-auth, common-account, common-password

    common-session are included. These files can also be found in

    /etc/pam.d/. The file /etc/pam.d/common-auth has -for example- the

    following statements:


    | required | pam_env.so |

    | required | pam_unix2.so |


    If a required module fails, the modules following the failed module

    are tested anyway. But an error occurs at the end. If a sufficient

    module fails, but another sufficient module matches, login is

    allowed.


    There are a couple of examples available in the directory

    /ust/share/doc/packages/pam_ldap/pam.d/.


    The advantage of using LDAP for all kinds of authentication (as

    done by YaST) is that you can use standard tools like passwd

    or chsh.


    ```

    kbailey@da51:~> passwd

    Changing password for kbailey.

    Enter login(LDAP) password:

    New password:

    Re-enter new password:

    LDAP password information changed for geeko

    ```'
  merge: -1
