- img_proc: true
  md: '# Objective 1


    # Understand what OpenSLP Is


    Traditionally, you access a service on an IP network by using the host IP address.
    That process can be simplified with DNS. However, these methods are static and
    do not guarantee that the host or the service on that host is actually available.


    The Service Location Protocol (SLP) provides the dynamic discovery of services.
    Only active services are visible through SLP.


    You only need to know the description of the desired service. Based on this description,
    SLP can return the URL of the desired service.


    For example, a search for NTP will result in addresses for all active NTP services
    on the network.


    SLP was originally an Internet Engineering Task Force (IETF) protocol that provides
    a framework to allow networking applications to discover


    +   * The existence

    * The location

    * The configuration


    of networked services in enterprise networks.


    OpenSLP is available on SUSE Linux Enterprise Server 10.


    OpenSLP is an Open Source implementation of the SLP version 2 protocol as defined
    by RFC 2608 and RFC 2614. OpenSLP registers information on active services on
    the network in a cached database and allows clients to query the database to find
    these services.'
  merge: -1
  pgno: 363
- img_proc: true
  md: 'From a high-level viewpoint, the information that OpenSLP maintains about a
    service is simply the service name and the IP address of the host that is running
    this service.


    On SUSE Linux Enterprise Server 10, many applications including the following,
    have already integrated OpenSLP support:


    +   - CUPS

    - ypserv (NIS)

    - OpenLDAP2

    - SANE

    - Postfix

    - SSH (via fish)

    - NTP


    SLP is described in great detail in the following RFCs:

    - RFC 2608, "Service Location Protocol, Version 2"

    - RFC 2609, "Service Templates and Service Schemes"

    - RPC 2610, "DHCP via SLP"

    - RFC 2614, "An API for Service Location Protocol"


    For more information on SLP, refer to the home page of the OpenSLP project at
    http://www.openslp.org, or see your SUSE Linux Enterprise Server 10 system at
    file:/usr/share/doc/packages/openslp/.*'
  merge: -1
  pgno: 364
- img_proc: true
  md: '# Objective 2 Understand the SLP Agents


    SLP uses agents to represent applications and services on the network.


    Figure 5-1


    ![](img/b7f4ef3c9bdffc8caed3395478c04bab_365_0.png)


    An agent is a software entity that processes SLP protocol messages.


    There are three types of SLP agents:


    +   - User Agent

    - Service Agent

    - Directory Agent


    These agents communicate with each other using different types of Messages.


    To understand how these messages are sent and received, you need to know the differences
    between Unicast, Multicast, and Broadcast Protocols.'
  merge: -1
  pgno: 365
- img_proc: true
  md: '# User Agent


    The SLP User Agent (UA) is software that looks for the location of one or more
    hosts running specified services.


    Usually implemented (at least partially) as a library to which client applications
    link, it provides client applications with a simple interface for accessing SLP
    registered service information.


    User Agents use two possible methods to identify the services they require:


    +   - If Directory Agents are used on the network, the User Agent will send unicast
    requests to the Directory Agents voicing the specified services.


    +   - If Directory Agents are not used on the network, the Service Agent will
    send out a multicast request for a specified service.


    # Service Agent


    The SLP Service Agent (SA) is software that advertises the location of one or
    more active services.


    SLP advertisement is designed to be both scalable and effective, minimizing the
    use of network bandwidth through the use of targeted multicast messages and unicast
    responses to queries.


    Service Agents use two possible methods to advertise the services they have registered:


    +   - If Directory Agents are used on the network, the Service Agent sends service
    registrations to the Directory Agent.


    +   - If Directory Agents are not used on the network, the Service Agent answers
    requests for services that match the services that are registered.


    Once this registration has been performed, requests for services can be serviced
    by the Directory Agent instead.'
  merge: -1
  pgno: 366
- img_proc: true
  md: 'All service requests and replies will be unicast packages.


    The Service Agent will stay passive until the service terminates or the life time
    is reached. Only then will it contact the Directory Agent again.


    # Directory Agent


    The SLP Directory Agent (DA) is software that acts as a centralized repository
    for service location information.


    Directory Agents receive registration requests from Service Agents and use the
    service information to answer requests for services from User Agents.


    Directory Agents can be implemented in a large environment to reduce traffic and
    segment service availability to manually defined scopes.


    Both Service Agents and User Agents make it a priority to discover available Directory
    Agents, using a Directory Agent minimizes the number of multicast messages sent
    by the protocol on the network.


    The Service Agent registers itself with the Directory Agent multicast group so
    that User Agents can locate the Directory Agent and become able to locate active
    services on the network using unicast packages only.


    # Messages


    In order to provide a framework for service location, SLP agents communicate with
    each other using 11 different types of messages.


    The dialog between agents is usually limited to very simple exchanges of request
    and reply messages:'
  merge: -1
  pgno: 367
- img_proc: true
  md: '+   * Service Request (SrvRqst). Message sent by User Agents to

    Service Agents or Directory Agents to request the location of a

    service.


    +   * Service Reply (SrvRply). Message sent by Service Agents or

    Directory Agents in response to a SrvRqst message.


    The SrvRply contains the URL of the requested service.


    +   * Service Registration (SrvDeReg). Message sent by Service

    Agents to Directory Agents containing information about a

    service that is available.


    +   * Service Deregister (SrvDeReg). Message sent by Service

    Agents to inform Directory Agents that a service is no longer

    available.


    The service informs the Service Agent to deregister itself

    immediately before it terminates.


    +   * Service Acknowledge (SrvAck). A generic acknowledgment

    that is sent by Directory Agents to Service Agents in response

    to SrvReg and SrvDeReg messages.


    +   * Attribute Request (AttrRqst). Message sent by User Agents

    to request the attributes of a service.


    +   * Attribute Reply (AttrRply). Message sent by Service Agents

    or Directory Agents in response to AttrRqst.


    The AttrRply contains the list of attributes that were requested.


    +   * Service Type Request (SrvTypeRqst). Message sent by User

    Agents to Service Agents or Directory Agents requesting the

    types of services that are available.


    +   * Service Type Reply (SrvTypeRply). Message sent by Service

    Agents or Directory Agents in response to a SrvTypeRply.


    The SrvTypeRply contains a list of requested service types.


    +   * DA Advertisement (DAADvert). Message sent by Directory

    Agents to let Service Agents and User Agents know where they

    are.'
  merge: -1
  pgno: 368
- img_proc: true
  md: '+   SA Advertisement (SAADvert). Message sent by Service Agents to let User
    Agents know where they are.


    # Unicast, Multicast, and Broadcast Protocols


    SLP is a unicast and multicast protocol.


    This means that the messages described above can be sent


    +   To one agent at a time (unicast)

    or

    To all agents (that are listening) at the same time (multicast)


    A multicast is not a broadcast.


    In theory, broadcast messages are heard by every node on the network, but multicast
    messages are only heard by the nodes on the network that have joined the multicast
    group.


    Network routers filter all broadcast and multicast traffic.


    This means that broadcasts and multicasts generated on one subnet will not be
    forwarded or routed to any of the other subnets connected to the router. (From
    the router''s perspective, a subnet comprises all machines connected to one of
    its ports.)


    By default, broadcast and multicast are not forwarded by routers.


    You can change your router configuration or use Directory Agents in every network.


    The Directory Agents can then share their service information using unicast (routable)
    packages, and all service information is available in all networks.'
  merge: -1
  pgno: 369
