  md: '# Objective | Summary


    5. Configure Postfix (continued)


    A mail server that forwards email to a provider''s mail server has to


    +   - Accept mail from the intranet clients.

    - Reject mail delivered by other clients.

    - Possibly rewrite sender addresses.

    - Submit all mail to the provider''s mail server.


    In addition, a mail server that also receives mail over the Internet has to


    +   - Accept mail that comes from the Internet and is addressed to your domain.

    - Reject mail that comes from the Internet and is not addressed to your domain.

    - Reject mail from known spam sources.


    Regardless of the individual configuration of Postfix in the last case, the server
    must be introduced to DNS as the responsible mail server by means of an MX record.'
