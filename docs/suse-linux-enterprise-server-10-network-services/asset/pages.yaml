- img_proc: true
  md: '# Receive Mail over the Internet


    If the mail server is set up not only for sending email messages of the users
    in the local network but also for receiving mail from the Internet addressed to
    the domain, configuring it is a bit more difficult.


    It is important to prevent the mail server from being misused as an open relay
    by spammers.


    Regardless of the individual configuration of Postfix, the server must be introduced
    to the DNS as the responsible mail server by means of MX record.


    In addition to the requirements in the last section, the mail server has to


    +   - Accept mail that comes from the Internet and is addressed to your domain


    +   - Reject mail that comes from the Internet and is not addressed to your domain


    +   - Reject mail from known spam sources


    Accordingly, a number of additional entries are needed.


    As mail can theoretically be received at all interfaces, a different value is
    necessary for inet_interfaces. mymynetworks_style can remain unchanged.


    ```

    inet_interfaces = all\mynetworks_style = subnet

    ```


    Postfix has to know for which domains it can accept mail:


    ```

    hostname = da51.digitalairairlines.com

    mydomain = digitalairairlines.com

    mydestination = $hostname, local.$mydomain

    mydomain

    ```'
  merge: -1
  pgno: 267
- img_proc: true
  md: 'If Postfix is not only responsible for the mail of your domain also for the
    mail of other domains (as is normally the case with web hosters), the domains
    are not entered under mysydination but in the lookup table virtual, which is covered
    in following section.


    The decision to accept or not accept mail is controlled by the following variables,
    which contain various criteria.


    +   - smtpd_helo_restrictions

    - smtpd_sender_restrictions

    - smtpd_recipient_restrictions

    - smtpd_client_restrictions


    A message is only delivered if it passes all the criteria without being rejected.


    For example, smtpd_sender_restrictions can be used to prevent known spammers from
    delivering mail.


    If the sender is listed in an RBL, the message can be rejected before the system
    checks whether it is addressed to a local user:


    ```

    maps_rbl_domains = rbl-domains.digitalairlines.com

    smtpd_sender_restrictions = reject_maps_rbl

    ```


    The following entry ensures that email from the range specified in $mynetworks
    as well as email for which Postfix is responsible due to the specifications in
    $mydomain is accepted—all other mail is rejected due to reject_unauth_destination:


    ```

    smtpd_recipient_restrictions = permit_mynetworks,

    reject_unauth_destination

    ```


    An explanation of all possibilities of the restrictions would exceed the scope
    of this course.'
  merge: -1
  pgno: 268
