  md: '# Objective 7 Replicate OpenLDAP Servers


    If there are a lot of requests for the LDAP server you may need more than one
    server. One server is the master. The other servers are slaves. A master/slave
    arrangement provides an effective way to increase capacity, availability, and
    reliability.


    Changes on the master server are propagated by the slurpd to the slaves. In this
    objective we cover the following topics:


    +   - Add the Replicaton DN to the LDAP Directory

    - Configure slapd for Replication

    - The Command-Line Options of slurpd

    - Transfer the LDAP Database


    # Add the Replicaton DN to the LDAP Directory


    In the LDAP directory (on master and slave) there must be an object with the DN
    used for replication. This can look like this:


    ```

    dn:uid=replicator,dc=digitalairirlines,dc=com

    objectClass: inetOrgPerson

    uid: replicator

    cn: LDAP Replicator

    sn: Replicator

    ```


    You also have to set a password for this object using ldappassword.


    # Configure slapd for Replication


    The slapd on the master server can be configured to write a replication logfile
    by the following entry /etc/openldap/slapd.conf:


    ```

    repllogfile /var/lib/ldap/master-slapd.repllog

    ```'
  merge: -1
  pgno: 216
- img_proc: true
  md: "# SUSE Linux Enterprise Server 10: Networking Services\n\nThis file contains\
    \ regular LDIF change records, e.g.\n\n```\ntime: 1148659780\nn: ou=groups,dc=digitalairlines,dc=com\n\
    changetype: add\nobjectClass:organizationalUnit\nou: groups\nstructuralObjectClass:organizationalUnit\n\
    entryUUID:c7b0c4e0-8b1d-102a-9c4d-219eeb1b381\ncreatorName: cn=Administrator,dc=digitalairlines,dc=com\n\
    createTimestamp: 20060526160940Z\nentryCSN: 20060526160940Z#000000#100000\nmodifierName:\
    \ cn=administrator,dc=digitalairlines,dc=com\nmodifyTimestamp: 20060526160940Z\n\
    ```\n\nOn the master server you have the name(s) of the slave server(s) with the\
    \ replica option:\n\n```\nreplica uri=ldap://10.0.0.51:389\nbinddn=cn=replicator,dc=digitalairlines,dc=com\
    \ bindmethod=simple\ncredentials=novell\n```\n\nThe following parameters are used:\n\
    \n+   **uri.** Name or IP of the slave server. The default LDAP port is 389. If\
    \ you want to use LDAP (port 636), the uri looks like this\n  **replica uri=ldap://10.0.0.51:636\
    \ ...**\n**binddn.** DN of the master server that is allowed to access the slave.\
    \ This DN must also be specified on the slave server with the option **updatedn.**\n\
    \n> This DN should not be the same as the master’s rootdn.\n\n+   **bindmethod.**\
    \ Specifies the authentication method. You can select between **simple** (password-based\
    \ authentication) and **sasl** (SASL authentication).\n\n3-54 Copying all or part\
    \ of this manual, or distributing such copies, is strictly prohibited. To report\
    \ suspected copying, please call 1-800-PIRATES. Version 1"
  merge: -1
  pgno: 217
- img_proc: true
  md: "+   - credentials. Password for simple authentication.\n\nOn the slave server\
    \ you have to add the updatedn option, as mentioned. For example:\n\n```\nupdatedn=\"\
    cn=replicator,dc=digitalairlines,dc=com\"\n```\n\nUse the upateref directive to\
    \ define the URL the slave should return if an update request is received.\n\n\
    ```\nupateref=ldap://10.0.0.51\n```\n\nYou have to make sure that this DN has\
    \ permission to write the database (e.g., by access directives).\n\n```\naccess\
    \ to *\nby dn=cn=replicator,dc=digitalairlines,dc=com write\nby * read\n```\n\n\
    # The Command-Line Options of slurpd\n\nThe man page of slurpd can be accessed\
    \ by man 8 slurpd\n\nThe options of slurpd are:\n\n+   - d level. Specify the\
    \ debug level. Possible debug levels are:\n  - 4. Heavy trace debugging\n  - 64.\
    \ Configuration file processing\n  - 65535. Enable all debugging\n  - ?. Lists\
    \ as debug levels and exits slurpd.\n\n+   - f-file. Specifies the slapd configuration\
    \ file. The default is /etc/openldap/slapd.conf.\n\n+   - r file. Specifies the\
    \ name of the slapd replication logfile."
  merge: -1
