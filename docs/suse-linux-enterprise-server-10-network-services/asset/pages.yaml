  md: "Data about the query, such as the duration of the query (**Query time**), the\
    \ server that answered the query (**SERVER**), and the date of the query (**WHEN**)\
    \ is listed at the end of the output.\n\n# Use rndc to Control the Name Server\n\
    \nYou can use the tool **rndc** (remote name daemon control) to manage the name\
    \ server from a local or a remote host.\n\nTo use this tool, the requests have\
    \ to be authenticated. This is done using a key similar to the key for the zone\
    \ transfer. By default, a key is provided in the file /etc/rndc.key.\n\n![](img/b7f4ef3c9bdffc8caed3395478c04bab_76_0.png)\n\
    \nBecause this file comes with a default key from the bind package, you should\
    \ not use this key on a production system. You should always create your own key.\n\
    \nThe key for rndc is generated using the command **rndc-confgen**. This generates\
    \ a default configuration that is sent to standard output.\n\n```\nda51:~ # rndc-confgen\
    \ > /etc/rndc.conf\n```\n\nThe configuration file /etc/rndc.conf on the client\
    \ used to manage the name server looks like this:\n\n```\nkey rndc_key {\n   \
    \ algorithm \"HMAC-MD5\";\n    secret \"d3YWE9j9xo5UZ6N/EcIbFg==\";\\}\n\noptions\
    \ {\n    default-key \"rndc-key\"\n    default-server 10.0.0.2;\n    default-port\
    \ 953;\n}\n```"
  merge: -1
  pgno: 76
- img_proc: true
  md: "# SUSE Linux Enterprise Server 10: Networking Services\n\nThe first statement\
    \ defines the algorithm used to generate the key\n the secret key. The second\
    \ statement defines the default server\nto manage the request (the IP address\
    \ of the name server) and the\ndefault key to use for the requests.\n\nUsing rndc,\
    \ you can always provide other parameters.\n\nBecause the file /etc/rndc.conf\
    \ contains the key, read access needs\nto be limited:\n\n```\nda51: # ls -1 /etc/rndc.conf\n\
    -rw-r----- 1 root named 141 Apr 7 16:16 /etc/rndc.conf\n```\n\n![](img/b7f4ef3c9bdffc8caed3395478c04bab_77_0.png)\n\
    \nInstead of creating /etc/rndc.conf and adding information about the key to\n\
    /etc/named.conf, the file /etc/rndc.key can be used for automatic rndc\nconfiguration.\
    \ The file /etc/rndc.key is created using the command\rndnc-conf -a.\n\nOn the\
    \ name server, access via rndc has to be permitted. This is\ndone in the file\
    \ /etc/named.conf by using the controls statement.\n\nYou also have to provide\
    \ information about the key.\n\n```\nkey rndc_key {\n  algorithm HMAC-MD5;\n \
    \ secret \"d3YWEW9jxo5UZ6N/EcIBFg==\";\n}\n\ncontrols {\n  inet 127.0.0.1\n  \
    \  allow {localhost;} keys {rndc_key};\n  inet 10.0.0.2\n    allow {localhost;\
    \ 10.0.0.51;} keys {rndc_key};\n}\n```\n\nThe inet statement defines which computers\
    \ get access using rndc.\nThe first parameter defines the IP address on which\
    \ named will\nlisten for rndc requests."
  merge: -1
  pgno: 77
- img_proc: true
  md: 'In this loopback, the first statement instructs the computer to listen

    on the loopback interface with the IP address 127.0.0.1, and the

    second statement instructs the computer to listen on the interface

    with the IP address 10.0.0.2.


    After the allow statement, a list of hosts that are allowed to access is

    provided. For the loopback interface, access is allowed only from

    localhost. For the IP address 10.0.0.2, access is allowed from local

    host and computer 10.0.0.51. In both cases, the key named rndc_key

    has to be used to get access.


    When you add the controls statement in /etc/named.conf, the name

    server listens on port 953 after reloading.


    ```

    da51:~ # nmap dal

    Starting nmap 3.50 ( http://www.insecure.org/nmap/ ) at 2005-04-21 12:34

    CEST

    Interesting ports on da2.digitalairirlines.com (10.0.0.2):

    (The 1653 ports scanned but not shown below are in state: closed)

    PORT    STATE SERVICE

    22/tcp  open    ssh

    53/tcp  open    domain

    111/tcp open    rpcbind

    427/tcp open    svrloc

    631/tcp open    ipp

    953/tcp open    rndc

    ```'
  merge: -1
  pgno: 78
- img_proc: true
  md: '# SUSE Linux Enterprise Server 10: Networking Services


    If you rndc without any options, you see a list of available parameters:


    ```

    da51:- # rndc

    Usage: rndc [-c config] [-s server] [-p port] [-k key-file ] [-y key] [-V]

    command

    ```


    command is one of the following:


    +   - reload Reload configuration file and zones.

    - reload zone [class] Reload a single zone.

    - refresh zone [class] Schedule immediate maintenance for a zone.

    - reconfig Reload configuration file and new zones only.

    - stats Write server statistics to the statistics_file.

    - querylog Toggle query logging.

    - dumpdb Dump cache(s) to the dump file (named_dump.db).

    - stop Saving updates to master files and stop the server.

    - halt Stop the server without saving pending updates.

    - trace Increment debugging level.

    - trace level Change the debugging level.

    - notrace Set debugging level to 0.

    - flush Flushes all of the server''s caches.

    - flush [view] Flushes the server''s cache for a view.

    - status Display status of the server.

    - *restart Restart the server.


    ```

    * = not yet implemented

    Version: 9.2.3

    ```


    Using the options, you can always specify another server or another key to use
    for the request.'
  merge: -1
  pgno: 79
- img_proc: true
  md: 'The following is an example for using rndc:


    ```

    da51:- # rndc status

    number of zones: 4

    debug level: 0

    xfers running: 0

    xfers deferred: 0

    soa queries in progress: 0

    query logging is OFF

    server is up and running


    da51:- # rndc dumpdb

    ```


    The last line creates a dump of the cache of the name server.

    dump file is defined in /etc/lib/named with the statement

    dump_file. By default it is /Var/lib/named/log/named_dump.db. This

    file needs to be created with the correct permissions before cache

    data can be written to it:


    +   - /var/lib/named/log/named_dump

    - chgrp /var/lib/named/log/named_dump

    - chmod g+w /var/lib/named/log/named_dump


    You can view the contents of the dump file using less or cat.


    If an rndc request is tried from a host without access permissions

    (either not listed in the controls statement or without the correct

    key), an error message similar to the following will appear in

    /var/log/messages on the name server:


    ```

    Apr 21 11:29:28 da51 named[4210]: rejected command channel message from

    10.0.0.21#32770

    ```


    On the denied client, the following message displays:


    ```

    da51:- # rndc dumpdb

    rndc: recv failed: connection reset

    ```'
  merge: -1
  pgno: 80
- img_proc: true
  md: '# Check Configuration Files


    If you changed the configuration of your name server, check the syntax of the
    configuration files before you enable them.


    To change the configuration, the BIND package provides tools:


    +   - named-checkconf


    +   - named-checkzone


    # named-checkconf


    named-checkconf checks the syntax of the named configuration file (/etc/named.conf)
    by default.


    If the tool cannot detect an error, there is no output.


    In case of an error, you get a message including the line number and a hint:


    ```

    da51:- # named-checkconf

    /etc/named.conf:52: expected IP address near ''listen-on-v6''

    ```


    If you want to check another file instead of /etc/named.conf, you can append the
    filename to the named-checkconf command.


    # named-checkzone


    The command named-checkzone checks the syntax of a zone file.


    named-checkzone has two parameters:


    # named-checkzone zone-name file-name'
  merge: -1
  pgno: 81
- img_proc: true
  md: 'In contrast to named-checkconf, you see a message if no errors are found:


    ```

    da51:~ # named-checkzone digitalairlines.com

    /var/lib/named/master/digitalairlines.com.zone

    zone digitalairlines.com/IN: loaded serial 2005071501

    OK

    ```'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# Find More Information About DNS


    If there are syntax errors in one of the configuration or zone files, BIND writes
    verbose messages to the file /var/log/messages. These messages also contain information
    on the filename and the line in which this error occurs.


    If there is an error, the processing of the file is interrupted at this point
    (that is, errors later in the file are not detected now).


    > For more information about BIND and DNS, see DNS and BIND by Paul Albitz and
    Cricket Liu and the BIND homepage at http://www.isc.org/sw/bind/.'
  merge: -1
