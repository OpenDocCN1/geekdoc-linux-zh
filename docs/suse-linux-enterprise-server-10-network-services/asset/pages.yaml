- img_proc: true
  md: '# Structure of the Files


    Each of the database files consists of a series of entries, or resource records.
    The syntax of these records is always as follows:


    reference [TTL] class type value


    The following describes each part of a record:


    +   - **reference.** The reference to which the record refers. This can be a domain
    (or subdomain) or a standalone computer (name or IP address).

    - **TTL.** The Time To Live value for the record. If this is not present, a default
    TTL value is used. This determines how other name servers store this information
    in cache.

    - **class.** The class of the record. For TCP/IP networks, this is always IN (internet).

    - **type.** The type of the record. The most important types are listed in the
    table below.

    - **value.** The value of the record. The value depends on the type of record
    listed in the following:


    | Record Type | Meaning | Value |

    |---|---|---|

    | SOA | Start of Authority (term for the authority) | Parameters for the domain
    |

    | NS | Name server | Name or IP address of one of the DNS servers for this domain
    |

    | MX | Mail exchanger | Name (or IP address) and priority of a mail server for
    this domain |

    | A | Address | IP address of a computer |

    | PTR | Pointer | Name of a computer |'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# Table 1-2 (continued)


    | Record Type | Meaning | Value |

    |---|---|--|

    | CNAME | Canonical name | Alias for a computer |


    Individual entries must always start in the first column with the reference. An
    entry does not start in the first column, the reference is taken from the previous
    entry.


    # The File /var/lib/named/master/digitalairlines.com.zone


    Unlike earlier versions of BIND, BIND 9 requires you to specify a default TTL
    for all information at the beginning. This value is used whenever the TTL has
    not been explicitly given for an entry.


    You define the TTL with the following instruction:


    ```

    ;

    ; definition of a standard time to live, here: two days

    ;

    $TTL 172800

    ```


    In this file, the semicolon is used as a comment sign.


    In this example, the TTL is given in seconds. It can be given in other units as
    well, such as 2D for two days. Other units are M (minutes), H (hours), and W (weeks).'
  merge: -1
  pgno: 39
- img_proc: true
  md: "This is followed by the definition of the SOA (Start of Authority) entry, which\
    \ specifies which DNS server has the authority for this domain:\n\n```\n;\n; SOA\
    \ Entry\ndigitalairlines.com IN SOA dal.digitalairlines.com\nhostmaster.digitalairlines.com.\
    \ (\n    2004092601; serial number\n    1D ; refresh (one day)\n    2H ; retry\
    \ (two hours)\n    1W ; expiry time (one week)\n    3H ; \"negative\" validity\
    \ (three hours)\n)\n```\n\nThe domain to which this entry refers (in the example,\
    \ digitalairlines.com) is listed first. If a name does not have a trailing dot,\
    \ the name of the domain is added, which would lead to an error here.\n\nThe name\
    \ of the DNS server is listed after the SOA entry (in this example, da1.digitalairlines.com\
    \ with a dot at the end). Alternatively, you could write dal, and the domain name\
    \ digitalairlines.com would be added after the name.\n\nNext comes the email address\
    \ of the person who is responsible for the administration of the DNS server. “@\
    \ usually used in email addresses must be replaced by a dot (so the email address\
    \ in this example is hostmaster.digitalairlines.com). This is necessary because\
    \ “@ has a special meaning as an abbreviation.\n\nIt is advisable to use a generic\
    \ email address here (e.g., hostmaster@digitalairlines.com) instead of an individual\
    \ email address.\n\nThe next entry is a serial number. Any number can be used,\
    \ normally the date and a version number are used here. After any change to the\
    \ data in this file, the serial number has to be increased."
  merge: -1
  pgno: 40
- img_proc: true
  md: 'Slave servers use this number to determine whether or not they need to copy
    this zone file. If the serial number on the master server is greater than that
    on the slave server, the file is copied.


    The serial number is followed by time information (the first three entries listed
    here are only important for slave servers):


    +   - The first entry causes a slave server to query a master server after this
    length of time, to see if there is a new version of the file (in the example,
    this is 1D or one day).

    - If the slave server cannot reach the master server, the next time entry specifies
    at what intervals new attempts should be made (in the example, this is 2H or two
    hours).

    - If the master server is not reached for a longer period of time, the third entry
    specifies when the slave server should discard its information on this zone (in
    the example, this is 1W or a week).

    - The basic idea here is that it is better not to pass on any information than
    to pass on outdated information.


    The fourth entry defines how long negative responses from the DNS server are valid.
    Each requesting server stores responses in its cache, even if a computer name
    could not be resolved (in the example, this is 3H or 3 hours).


    These time definitions are followed by the name or IP address of the computer
    that is acting as the DNS server for this domain. In all cases, the master server
    must be entered here. If slave servers are used, they should also be entered,
    in the following:


    ```

    ; entry for the name server

    ; digitalairlines.com. IN NS da1.digitalairlines.com.

    ;                 IN NS da2.digitalairlines.com.

    ```


    The name of the domain can be omitted at this. Then the name from the previous
    entry (the SOA entry) is taken.'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'At the end of this file are the IP addresses that are allocated to computer
    names. This is done with A (address) entries, as in the following:


    ```

    ; Allocation of IP addresses to host names

    ;

    dal10   IN A 10.0.0.10

    dal12   IN A 10.0.0.12

    dal13   IN A 10.0.0.13

    ...

    dal     IN A 10.0.0.254

    dal2    IN A 10.0.0.2

    ```


    # The File /var/lib/named/master/10.0.0.zone


    The file for reverse resolution contains similar entries as the file for forward
    resolution. At the beginning of the file there is the definition of a default
    TTL and an SOA entry.'
