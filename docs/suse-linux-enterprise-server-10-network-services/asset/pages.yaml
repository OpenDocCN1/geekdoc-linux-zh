    # Add Users to the System


    To define mail boxes for users on the mail server, these users have to be created
    on the system. Because the mail boxes for these users are stored in the directory
    /var/lib/imap/, it is not necessary to provide the users with a home directory.


    Only usernames and passwords have to exist in the files /etc/passwd and /etc/shadow.
    This information is needed when a user is receiving email from a client.


    ![](img/b7f4ef3c9bdffc8caed3395478c04bab_294_0.png)


    For security reasons, the users should not be allowed to log in to the mail server.
    Therefore, no home directory should be created and the login shell should be set
    to /usr/bin/passwd. When users log in to the mail server they can only modify
    their passwords but cannot perform any other tasks on the system.


