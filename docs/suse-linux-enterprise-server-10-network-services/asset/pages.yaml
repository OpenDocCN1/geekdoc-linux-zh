- img_proc: true
  md: '# Use DHCP to Manage Networks


    DHCP (Dynamic Host Configuration Protocol) is based on BOOTP (Bootstrap Protocol).
    BOOTP is used to provide network configuration parameters for hosts during startup.


    During the boot process, the client sends a request via broadcast into the local
    network. A BOOTP relay server answers and sends the configuration parameters (at
    least the IP address of the client).


    DHCP dynamically assigns network configuration parameters to computers. This includes
    IP address, network mask, broadcast address, default gateway, DNS server to be
    used, and others.


    DHCP is more flexible than BOOTP. For example, DHCP uses a lease time, so the
    delivered network information is valid only for a certain time. DHCP can also
    create pools of limited network addresses that can be shared in the network.


    # Objectives


    +   1. Understand How DHCP Works

    2. Configure the DHCP Server

    3. Configure DHCP Clients

    4. Configure a DHCP Relay Server

    5. Use DHCP and Dynamic DNS

    6. Configure DHCP Failover

    7. Troubleshoot DHCP'
  merge: -1
  pgno: 92
- img_proc: true
  md: '# Objective 1


    # Understand How DHCP Works


    Every network card is uniquely identified by a 6-byte serial number, called the
    MAC address. Computers communicate with each other using this MAC address, independently
    of the network protocol used. Every computer in a TCP/IP network uses the Address
    Resolution Protocol (ARP) to determine the MAC address of other computers.


    The information about the IP address of a computer located in the local subnet,
    together with the corresponding MAC address, is listed in the ARP table on the
    computer. This information is stored only in a cache; it''s not written to a file.


    If a machine sends data to another machine in the local network whose MAC address
    it does not yet know, it will subsequently send, or broadcast, a request for the
    MAC address to all the machines. The requested mac will then recognize, from the
    IP address, that it is being called and will reply to the machine that initiated
    the broadcast with its own MAC address.


    DHCP functions in the same way: A computer sends a broadcast containing its MAC
    address and expects that a DHCP server in the local network assigns an IP address
    for this MAC address. The DHCP server recognizes this machine based on the MAC
    address and assigns it an IP address.'
  merge: -1
  pgno: 93
- img_proc: true
  md: 'This assignment procedure is outlined in the following figure.


    # ### Figure 2-1


    ![](img/b7f4ef3c9bdffc8caed3395478c04bab_94_0.png)


    The steps are described below:


    +   1. On startup, the computer broadcasts a message to all the machines in the
    network, so it can find one or more DHCP servers (DHCPDISCOVER).


    +   If a DHCP server configured to respond to this request is on the network,
    it will answer the broadcasting machine''s request by offering an IP address and
    possible additional information (DHCPPOFFER).


    +   2. The client chooses one of the responses it has received. One criteria for
    this selection is the time of response. The client then sends a request to the
    corresponding DHCP server for the IP address (DHCPREQUEST).


    +   The DHCP server, in turn, confirms this information (DHCPPACK) and the client
    can now use the IP address.'
  merge: -1
  pgno: 94
- img_proc: true
  md: 'When the validity period (the lease time) of the IP address expires, the client
    sends a request to the server again (DHCPREQUEST).


    The server can either extend the duration of the IP address (DHCPACK) or prompt
    the client to request a new address. In this case, the server sends the notification
    DHCPNAK (negative acknowledgment).


    +   If the client no longer needs the IP address, it sends a notification to the
    DHCP server (DHCPRELEASE). Now the server can reassign the address.


    A DHCP server can handle queries from DHCP clients as well as from BOOTP clients.


    There are two ways to pass IP addresses with DHCP:


    +   Static assignment. The administrator defines a fixed IP address for a machine.
    This IP address is assigned to the computer when it is booted. The allocation
    of the IP address host is based on the MAC address of the network card of the
    client.


    In this way, the client always receives the same address from the server.


    +   Dynamic assignment. The DHCP server assigns the host IP address from an address
    pool. The next time the machine is booted, the host will probably receive a different
    IP address. This simplifies the administration of a large network.


    The administrator defines the required parameters within the configuration of
    the DHCP server and, above all, determines from which range the dynamically assigned
    IP addresses should originate.


    After configuring the machines as DHCP clients, no additional configuration is
    necessary, even if extensive changes are made to the network structure, such as
    dividing it into new subnets.'
  merge: -1
  pgno: 95
- img_proc: true
  md: Only the DHCP server must be configured accordingly, so that it can then disclose
    all the required information to the machines sending the requests.
