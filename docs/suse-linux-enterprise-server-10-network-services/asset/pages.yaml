    tcp 127.0.0.1.427 *.* LISTEN

    tcp 127.0.0.1.2544 *.* LISTEN

    tcp 147.2.90.112.427 *.* LISTEN

    Active Internet (udp) Connections

    Proto Local Address

    udp *.111

    udp *.161

