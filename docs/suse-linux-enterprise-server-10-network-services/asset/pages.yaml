- img_proc: true
  md: 'You are prompted to enter the cyrus password. After this, the prompt changes
    to


    ```

    localhost>

    ```


    To see an overview of the possible cyradmin commands, enter


    +   - help

    or simply

    - ?


    The most important commands of cyradm are the following:


    +   - mailbox or lm. Lists the names of all mailboxes.

    - createmailbox or create or cm. Creates a mailbox. The user must have a Linux
