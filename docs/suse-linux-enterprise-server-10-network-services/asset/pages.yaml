  md: "# Objective 3\n\n# Configure a DNS Server\n\nThe configuration of each DNS\
    \ server type is slightly different. In this objective the following is discussed:\n\
    \n+   - Configure a Caching-Only DNS Server\n- Configure a Master Server for Your\
    \ Domain\n- Configure One or More Slave Servers\n\n# Configure a Caching-Only\
    \ DNS Server\n\nA caching-only DNS server does not manage its own databases but\
    \ merely accepts queries and forwards them to other DNS servers. The replies are\
    \ saved in the cache.\n\nThe DNS server configuration is defined in the file /etc/named.conf.\
    \ You can use the example file that is installed with the DNS package as a configuration\
    \ file for a caching-only server.\n\nThe following example shows the beginning\
    \ of a simple configuration:\n\n```\n# /etc/named.conf: Configuration of the name\
    \ server (BIND9)\n# Global options\noptions\n{\n# In which directory are the database\
    \ files?\n#\n    directory \"/var/lib/named\";\n);\n```\n\nLines beginning with\
    \ a hash sign (\"#\") are comments and will be ignored."
  merge: -1
  pgno: 32
- img_proc: true
  md: 'The global options are defined in the options block at the beginning of the
    file. The directory option specifies the directory where the database files (or
    zone files) are located. Normally, this is /var/lib/named/


    Using the directory option you can specify filenames for the database files with
    a relative path (no absolute path required).


    The global options are followed by the definition of the database files for the
    domains managed by the DNS server. Several entries are needed for basic DNS server
    functions such as those provided by a caching-only server.


    Three entries are needed for every DNS server:


    +   - The entry for root DNS servers (not needed for BIND 9 it has the list of
    root DNS servers compiled into the software).

    - The forward resolution for localhost

    - The reverse resolution for the network 127.0.0.0 (localhost)'
  merge: -1
  pgno: 33
- img_proc: true
  md: "The following are examples of these entries:\n\n```\n## entry for root nameservers#\n\
    zone \". in (\n    type hint;\n    file \"root.hint\";\n);\n#\n# forward resolution\
    \ for localhost\n#\nzone \"localhost\" in (\n    type master;\n    file \"localhost.zone\"\
    ;n);\n#\n# reverse resolution for localhost\n#\nzone \"0.0.127.in-addr.arpa\"\
    \ in (\n    type master;\n    file \"127.0.0.zone\";n);\n```\n\nThe zone entry\
    \ for the root DNS servers contains a reference to a file containing the addresses\
    \ of the root DNS servers. (root.hint) is generated in the directory /var/lib/named/\
    \ during the installation of the package bind.\n\nThe two files for the resolution\
    \ of localhost are also generated during the installation. The structure of these\
    \ files is explained later.\n\nStarting each request for name resolution with\
    \ queries to the root servers can be quite slow. If these reqests forwarded to\
    \ a name server with a lot of information in its cache (e.g., the name server\
    \ of your Internet service provider), the process will be much faster in most\
    \ cases."
  merge: -1
  pgno: 34
