- img_proc: true
  md: "# Objective 6\n\n# Configure Access, Logging, and Security\n\nIn the last objective\
    \ you learned how to configure a DNS server. In this objective you will learn\
    \ about the following configuration options:\n\n+   - Restrict Access to the Name\
    \ Server\n- Configure Logging Options\n- Security Aspects for Zone Transfer\n\n\
    # Restrict Access to the Name Server\n\nTo prevent a name server from becoming\
    \ overloaded, it can be useful to allow access only from specific computers or\
    \ networks.\n\nTo do this, use the instruction **allow-query**. This instruction\
    \ is defined in the **options** section of the /etc/named.conf file:\n\n```\n\
    options (\n  ...\n  allow-query {\n    10.0.0.0/24;\n    10.0.1.0/24;\n  }\nn);\n\
    ```\n\nIf you include this instruction, only computers from the networks defined\
    \ can access this name server.\n\nAll other computers will receive an error message.\n\
    \n> Do not use this instruction for the name server that provides information\
    \ about your network to hosts on the Internet."
  merge: -1
  pgno: 56
- img_proc: true
  md: "# Configure Logging Options\n\nThe configuration statement logging can be used\
    \ to define the logging behavior of BIND.\n\nLog messages are written using channels.\
    \ In addition to some predefined channels, an unlimited number of channels can\
    \ be defined. Every channel contains a destination that determines what to do\
    \ with the messages.\n\nPossible destinations are\n\n+   - syslog. Messages are\
    \ passed to the syslog daemon.\n- null. Messages are dumped.\n\n+   - file. Specifies\
    \ the file to which the messages are written. You can add further options e.g.,\n\
    \  - size. The maximum file size. If this size is reached, a new version of the\
    \ file is created.\n  - version. Number of versions of the file that stored.\n\
    \nEvery message has a priority level. You can use the entry severity to determine\
    \ from which priority level messages are written to this channel. Possible levels\
    \ of severity are\n\n+   - critical. Similar to the “critical” level used by syslog.\n\
    - error. Similar to the “error” level used by syslog.\n- warning. Similar to the\
    \ “warning” level used by syslog.\n- notice. Similar to the “notice” level used\
    \ by syslog.\n- info. Similar to the “info” level used by syslog. This is the\
    \ default severity."
  merge: -1
  pgno: 57
- img_proc: true
  md: "+   debug [level]. You can specify a debug level. Logging will occur for any\
    \ message equal to or higher than the level specified; lower levels will not be\
    \ logged.\n\nlevel can be an integer between 0 (no debugging logs) and 11 (full\
    \ debugging log). The default level is 1.\n\n+   dynamic. If you specify dynamic\
    \ severity, then the server inherits its debug level from the server startup level.\n\
    \nYou can specify the server's startup debug level by starting with the parameter\
    \ -d [level].\n\nThe following is an example for a channel definition labeled\
    \ \"sec_file\":\n\n```\nlogging {\n  channel sec_file {\n    file \"/var/log/bind_security.log\"\
    \ versions 3 size 20m;\n    severity debug 3;\n    print-time yes;\n    print-category\
    \ yes;\n    print-severity yes;\n  };\n}\n```\n\nYou can see the syntax of the\
    \ logging option: The logging option includes the definition for channel sec_file.\n\
    \nAll messages with debug level 3 sent to this channel are written to the /var/log/bind_security.log\
    \ file with a time stamp (print-time yes), category (print-category yes) and severity\
    \ level (print-severity yes). As soon as the file reaches a size of 20 MB (size\
    \ 20m), a new file is created. Three old versions of the file are stored (version\
    \ 3)."
  merge: -1
  pgno: 58
- img_proc: true
  md: "# The following is a further example for two channel definitions:\n\n```\n\
    channel default_syslog {\n  syslog daemon;\n  severity info;\n}\nchannel null\
    \ {\n  file \"/dev/null\";n}\n```\n\nHere, two predefined channels are listed:\
    \ syslog daemon and null device.\n\nIt is possible to send logging messages to\
    \ more than one channel. Use the parameter category to determine where messages\
    \ are written. The following is an example for a category entry:\n\n```\nchannel\
    \ \"my_security_channel\" {\n  file \"/var/log/bind_security.log\";\n  severity\
    \ info;\n}\nchannel default_syslog {\n  syslog daemon;\n  severity info;\n}\n\
    category \"security\" {\n  \"my_security_channel\";\n  \"default_syslog\";\n}\n\
    ```\n\nThis logs security events to the file /var/log/bind_security.log but also\
    \ keeps the default logging behavior."
  merge: -1
  pgno: 59
- img_proc: true
  md: '# Security Aspects for Zone Transfer


    In this section we focus on two security aspects for the zone

    transfer:


    +   - Use Encryption

    - Zone Transfers from Slave Servers


    # Use Encryption


    It is important to ensure that only authorized hosts can perform a

    zone transfer. Restricting the zone transfer is done using the

    allow-transfer statement. This statement takes either an IP address

    or the name of an encryption key as a parameter. We strongly

    recommend that you use an encryption key, since the IP address can

    be spoofed quite easily.


    The key is used to sign requests from the slave server. Only signed

    requests for zone transfers are accepted by the master server. First, a

    key must be generated and known to the master server and

    slave servers. To do this, you do the following steps:


    +   - Create a Key

    - Configure the Master Server

    - Configure the Slave Server


    # Create a Key


    To create a key, use the dnssec-keygen command. The file name of

    the key is printed on the screen:


    ```

    da51:/var/lib/named # dnssec-keygen -a HMAC-MD5 -b 128 -n HOST

    zonetransfer

    Kzonetransfer.+157+01389

    ```'
  merge: -1
  pgno: 60
- img_proc: true
  md: 'The options are explained in the following table:


    # Table 1-3


    | Option | Description |

    | --- | --- |

    | -a HMAC-MD5 | The encryption procedure used (here HMAC-MD5) |

    | -b 128 | The length of the key (in the example, 128 bits) |

    | -n HOST | The type of key |

    | zonetransfer | Name of key |


    If you use this command, two files are created in the current directory:


    ```

    da51:/var/lib/named # ls -l K*

    -rw-------1 root root 56 Feb 21 10:39 Kzonransfer.+157+01389.key

    -rw-------1 root root 81 Feb 21 10:39 Kzonransfer.+157+01389.private

    ```


    > The numbers at the end of the filename will be slightly different when you run
    this command.


    +   * The *.key file contains a DNS KEY record that can be included in a zone
    file using the include statement.

    * The *.private file contains algorithm specific fields. For security reasons,
    this file does not have general read permission.


    Both files contain the same key:


    ```

    da51:/var/lib/named # cat Kzonransfer.+157+01389.key

    zonetransfer. IN KEY 512 3 157 KHDvspqFonWkv58rFXOww==

    da51:/var/lib/named # cat Kzonransfer.+157+01389.private

    Private-key-format: v1.2

    Algorithm: 157 (HMAC-MD5)

    Key: KHDvspqFonWkv58rFXOww==

    ```'
  merge: -1
  pgno: 61
- img_proc: true
  md: "This key has to be included in the configuration file /etc/named.conf on both\
    \ the master server and the slave server.\n\n# Configure the Master Server\n\n\
    The following entries must be made in the file /etc/named.conf on the master server:\n\
    \n```\noptions {\n  ...\n}\n\nkey zonetransfer {\n  algorithm HMAC-MD5;\n  secret\
    \ \"KhDvspoqFonWkV58rFXOWow==\";\n}\n\nzone \"digitalairlines.com\" in {\n  type\
    \ master;\n  file \"master/digitalairlines.com.zone\"\n  allow-transfer {\n  \
    \  key zonetransfer;\n  }\n}\n```\n\nA corresponding entry must be made for reverse\
    \ resolution.\n\n```\nzone \"0.0.10.in-addr.arpa\" in {\n  type master;\n  file\
    \ \"master/10.0.0.zone\"\n  allow-transfer {\n    key zonetransfer;\n  }\n}\n\
    ```\n\nThe key (the file /etc/named.conf) should not be readable for anybody except\
    \ root and the group named."
  merge: -1
  pgno: 62
- img_proc: true
  md: "# This is ensured by the predefined permissions of /etc/named.conf:\n\n```\n\
    da51:- # ls -l /etc/named.conf\nrw-r----- 1 root 572 Jun 14:30 /etc/named.conf\n\
    ```\n\nIf you include the key using the include statement, it is not necessary\
    \ to change the permissions of the file /etc/named.conf.\n\n# Configure the Slave\
    \ Server\n\nOn the slave server, define the key in the /etc/named.conf file. All\
    \ requests to the master server will be signed with this key (by using the server\
    \ instruction).\n\nThe following is an example:\n\n```\noptions {\n  ...\n}\n\n\
    key zonransfer {\n  algorithm HMAC-MD5;\n  secret \"KhdVspqFonWkv58rFXOWw==\"\
    ;\n}\n\nserver 10.0.0.2 {\n  keys {\n    zonransfer;\n  }\n}\n```\n\nIt is also\
    \ important that only the user root and the group named be able to read the configuration\
    \ file containing the key."
  merge: -1
  pgno: 63
- img_proc: true
  md: "If a computer now tries to carry out a zone transfer without possessing the\
    \ key, the zone transfer is refused. On the master server, corresponding messages\
    \ are listed in the file /var/log/messages. A successful zone transfer generates\
    \ a message in /var/log/messages similar to the following:\n\n```\nApr 21 10:37:18\
    \ da51 named[3976]: client 10.0.0.20#32769: transfer of 'digitalairlines.com/IN':\
    \ AXFR started\n```\n\nA failed zone transfer generates a message similar to this\
    \ in /var/log/messages:\n\n```\nApr 21 10:38:59 da51 named[3976]: client 10.0.0.20#32775:\
    \ request has invalid signature: tsig verify failure\n```\n\nIn /var/log/messages\
    \ on the slave server, a message similar to this is generated:\n\n```\nApr 21\
    \ 10:40:01 da20 named[4099]: zone 0.0.10.in-addr.arpa/IN: refresh: failure trying\
    \ master 10.0.0.51#53: tsig indicates error\n```\n\n# Zone Transfers from Slave\
    \ Servers\n\nYou should prohibit zone transfers from slave servers although it\
    \ is possible to perform them.\n\nIf you have only one server (the master) that\
    \ allows zone transfers to slave servers, you must ensure that all slave servers\
    \ get exactly the same information.\n\nTo prohibit the zone transfer from a server,\
    \ use the following statement:\n\n```\noptions {\n  allow-transfer {none};\n};\n\
    ```"
  merge: -1
  pgno: 64
