  md: '# Use tcpdump


    This software can read all or or certain packets going over the ethernet, tcpcdump
    is often used to save the network traffic in a file.


    tcpdump is installed during the default installation of SUSE Linux Enterprise
    10.


    The simplest way of using tcpdump is to enter just tcpdump.


    To quit the capture, press Ctrl + C. A short summary is shown.


    ```

    da51:- # tcpdump

    tcpdump: verbose output suppressed, use -v or -vv for full protocol decode

    listening on eth0, link-type ENILB, capture size 96 bytes

    16:52:50.488641 802.12 config 8000.00:80:20:2d:e2:9d:13013 root

    8000.00:80:2d:e2:9d:13 pathocht 0 max 20 hello 2 fdelay 15

    16:52:51.26790 (NOV-802.1) f4a3f8b.00:50:8b:d6:9b:b8.9001 >

    000000.ff:ff:ff:ff.9001: ipx-#9001 43

    ```


    ```

    2 packets captured

    2 packets received by filter

    0 packets dropped by kernel

    da51:- #

    ```


    The most important options of tcpdump are


    +   - **c number.** Exit after receiving **number of** packets.

    - **F file.** *File* as input for the filter expression.

    An additional expression given on the command line is ignored.

    - **i interface.** Listen on *interface*.

    - **-n.** Do not convert addresses (such as host addresses or port numbers) to
    names.

    - **-N.** Do not print the domain name qualification of host names.

    - **-S.** Print absolute, rather than relative, TCP sequence numbers.

    - **-w file.** Write the raw packets to file rather than parsing and printing
    them.


    # CNI ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  pgno: 433
- img_proc: true
  md: 'You can also specify a filter expression. The most important filter expressions
    are already described in the Ethereal section.


    For more information, see the man page **man 1 tcpdump.**


