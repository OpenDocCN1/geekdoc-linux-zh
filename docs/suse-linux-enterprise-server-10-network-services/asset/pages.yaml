- img_proc: true
  md: '# Configure QPopper


    Because the configuration of Cyrus IMAPd is quite complex (you have to create
    mailboxes for every user in the IMAP database), you may choose to only offer POP3
    as the protocol to provide email for your users. Using qpopper for this service
    is much easier than using Cyurs IMAPd for this.


    POP (Post Office Protocol Version) is a protocol that allows an email client to
    poll (download) its email from a POP server. The current version of POP is POP3.
    POP3 has been expanded several times since its original definition in RFC1081
    and is currently defined at great length in RFC1939.


    POP3 was developed because not every host wanted to both send and receive mail
    had enough resources (RAM, disk space, and CPU) to support a full mail server
    so it could directly receive its own mail.


    Many email providers do not provide their users with login access to the email
    server, instead they offer a POP3 server from which to get mail.


    POP3 has the following characteristics:


    +   - POP3 controls the transfer of mail, initiated by the recipient (as opposed
    to SMTP, where the sender initiates the transfer).

    - The client makes a connection on server port 110 using TCP.

    - The POP3 client and POP3 server exchange commands (client) and answers (server)
    until the connection is ended or aborted.

    - All commands are given in plain text, including arguments and parameters where
    relevant. The server sends the status message after each command. This either
    has the value +OK or -ERR (command could not successfully be run) or an optional
    text message.

    - POP3 supports the authentication of the client by the server.'
  merge: -1
  pgno: 301
- img_proc: true
  md: '+   - After a successful authentication process, the client and server enter
    the transaction phase, in which one or more email messages can be transferred.


    +   - When the connection is closed by the client, the server enters an update
    phase.


    The email messages are deleted from the mailbox and resources are released.


    This objective explains how to do the following:


    +   - Install QPopper


    +   - Configure QPopper


    # Install QPopper


    A POP3 server (QPopper) is supplied with SUSE Linux Enterprise Server 10. If SUSE
    Linux Enterprise Server 10 is not yet installed use YaST to select and install
    the qpopper package.


    # Configure QPopper


    As soon as QPopper is installed, you can use it to retrieve mail with the POP3
    protocol, if the superdaemon xinetd has been configured and started in the system.


    The POP3 server is started by xinetd as soon as it receives a TCP request on port
    110. The configuration of xinetd is described in the Novell Course SUSE Linux
    Administration (3072).'
  merge: -1
  pgno: 302
- img_proc: true
  md: "# SUSE Linux Enterprise Server 10: Networking Services\n\nThe entry in the\
    \ file /etc/xinetd.d/qpopper needs to look like the following:\n\n```\n# qpopper\
    \ - pop3 mail daemon\n#\nservice pop3\n{\n    disable = yes\n    socket_type =\
    \ stream\n    protocol = tcp\n    wait = no\n    user = root\n    server = /usr/sbin/popopper\n\
    \    server_args = -\n    flags = IPv4\n}\n```\n\nThe first line in the service\
    \ environment (disable = yes) is commented out. Alternatively you can set this\
    \ parameter to no.\n\nIf xinetd is not running, it can be started on a running\
    \ system by entering\n\nrxinetd start\n\nTo start xinetd automatically each time\
    \ the system is booted, enter\n\ninserv xinetd\n\nIf qpopper is activated, it\
    \ provides the email from the directory /var/spool/mail/ via POP3.\n\nWith this\
    \ configuration, the POP3 server is ready for operation and will process all requests\
    \ from POP3 clients.\n\nFor more information on QPopper see man page (man 8 popper)\
    \ in the\nusr/share/doc/packages/qpopper/directory.\n\n![](img/b7f4ef3c9bdffc8caed3395478c04bab_303_0.png)\n\
    \n4-80 Copying all or part of this manual, or distributing such copies, is strictly\
    \ prohibited. To report suspected copying, please call 1-800-PIRATES. Version\
    \ 1"
  merge: -1
