- img_proc: true
  md: '# Objective 3 Add Entries to the LDAP Server


    OpenLDAP provides the command ldapadd to insert data that is in LDIF format into
    the directory. You can use files in the LDIF format to avoid specifying all values
    on the command line.


    LDIF files contain the information that should be included in the directory service
    in a plain text format.


    You can create a different file for each user you would like to add, but you can
    also include multiple user records in one file. An LDIF file has the following
    structure:


    ```

    dn: DN

    objectclass: class

    attribute: value

    attribute: value

    ```


    For each object, you have to specify its distinguished name first. This must be
    unique and represent the position in the directory service tree.


    It follows the object class(es) the object belongs to and one or more attributes.
    For example:


    ```

    dc=digitalairlines,dc=com

    objectclass: domain

    objectclass: top

    o: digitalairlines


    ou=people,dc=digitalairlines,dc=com

    objectclass: organizationalUnit

    ou: people

    ```


    The file creates two objects in the directory tree:


    +   - The root object with the DN dc=digitalairlines,dc=com. Before you can add
    the first object, you have to create the root of the directory service tree.'
  merge: -1
  pgno: 201
- img_proc: true
  md: "+   - An object below the base entry for an organizational unit. The dn for\
    \ this object is ou=people,dc=digitalairlines,dc=com.\n\nMake sure that there\
    \ are no empty spaces or tabs at the beginning or end of a line.\n\nBecause LDAP\
    \ uses Unicode (UTF-8), special characters in LDIF files have to be coded into\
    \ UTF-8, or they might not be evaluated. This means you need to edit the LDIF\
    \ file with a Unicode editor, or convert the file later.\n\nYou can convert the\
    \ file by entering the following command:\n\n```\n`recode lat1..utf8 ldif_file`\n\
    ```\n\nTo know which object classes are available and which attributes are mandatory\
    \ and which are optional, you have to look into the schema file.\n\nFor example,\
    \ in the schema file /etc/ldap/schema/core.schema, there is an object class organization:\n\
    \n```\nobjectclass ( 2.5.6.4 NAME 'organization'\nDESC 'RFC2256: an organization'\n\
    SUP top STRUCTURAL\nMUST\nMAY (userPassword searchGuide $ seeAlso $\nbusinessCategory\
    \ $ \nx121Address $ registeredAddress $ \ndestinationIndicator $ \npreferredDeliveryMethod\
    \ $ texasNumber $ \ntetextTerminalIdentifier $ \nphoneNumber $ internationalSDNN\
    \ $ \nfacsimileTelephoneNumber $ street $\npostOfficeBox $ postalCode $\npostalAddress\
    \ $ physicalDeliveryObjectName\n$ st $ l $ description )\n```\n\nObjects of this\
    \ class must have a value for the o attribute."
  merge: -1
  pgno: 202
- img_proc: true
  md: 'The command to insert a data set that exists as an LDIF file looks

    like the following:


    ```

    ldapadd -x -D dn_of_the_administrator -W -f file.ldap

    ```


    You need to use the -x option because you haven''t configured SASL

    authentication yet.


    Use the option -D to specify who can access the directory. This

    should be rootdn, specified in the server configuration file.


    Use the option -W to display a password prompt. Otherwise, you

    must enter the password directly at the command line, where it will

    be visible as plain text.


    Finally, specify the LDIF file with the option -f.


    If the LDIF file is called example.ldif, ldapadd should be run as

    follow:


    ```

    da51:~ # ldapadd -x -D "cn=Administrator,dc=digitalairlines,dc=com" -W -f

    example.ldif

    Enter LDAP Password:

    adding new entry "dc=digitalairlines,dc=com"

    adding new entry "cn=people,dc=digitalairlines,dc=com"

    ```


    The password that is asked for must fit the password specified at

    rootwp in /etc/openldap/slapd.conf.


    The password is trasfer in clear text via the network. It is recommend that

    you configure the LDAP server locally or to use ssh.


    ![](img/b7f4ef3c9bdffc8caed3395478c04bab_203_0.png)'
  merge: -1
  pgno: 203
- img_proc: true
  md: 'After you have set up the basic tree structure, you can add a user to the directory
    with an LDIF file similar to this:


    ```

    dn: uid=geeko,ou=people,dc=digitalairlines,dc=com

    objectClass: posixAccount

    ObjectClass: shadowAccount

    objectClass: inetOrgPerson

    uid: geeko

    uidNumber: 1000

    gidNumber: 100

    cn: Geeko Chameleon

    genName: Geeko

    sn: Chameleon

    homeDirectory: /home/geeko

    loginShell: /bin/bash

    shadowMax: 99999

    shadowWarning: 7

    shadowInactive: -1

    shadowMin: 0

    shadowLastChange: 12609

    ```


    This example LDIF file creates a user based on the default LDAP setup of SUSE
    Linux Enterprise Server 10. The attributes are listed below, along with an explanation
    of each:


    +   **uid: geeko.** This attribute sets the login name of the user.

    - **uidNumber: 1000.** This attribute sets the numerical ID of the user.

    - **gidNumber: 100.** This attribute sets the default group ID of the user. The
    value 100 belongs to the group users in a SUSE Linux Enterprise Server 10 installation.

    - **cn: Geeko Chameleon.** This attribute sets the full name of the user.

    - **givenName: Geeko.** This attribute sets the given name of the user.

    - **sn: Chameleon.** This attribute sets the surname of the user.

    - **homeDirectory: /home/geeko.** This attribute sets the path to the home directory
    of the user.'
  merge: -1
  pgno: 204
- img_proc: true
  md: '+   - loginShell: /bin/bash. This attribute sets the login shell of the user.
    The default for SUSE Linux Enterprise Server 10 is /bin/bash.


    +   - ShadowMax: 99999. This attribute sets the number of days before the password
    expires.


    +   - ShadowWarning: 7. Users can be warned before their passwords expire. This
    attribute sets the number of days before the warning is issued. Set to -1 to disable
    the warning.


    +   - ShadowInactive: -1. This attribute sets the number of days that a user can
    still log in after the password expires. Set to -1 to set an unlimited number
    of days.


    +   - ShadowMin: 0. This attribute sets the minimum number of days that need to
    pass before a password can be changed.


    +   - ShadowLastChange: 12609. This attribute sets the date of the last password
    change.


    The home directories of the users are normally stored on a server. You use automounter
    to mount the user''s home directory.'
  merge: -1
  pgno: 205
- img_proc: true
  md: '# Objective 4


    # Query Information from the LDAP Server


    You can use the command ldapsearch to read data from the LDAP directory. The following
    command reads the entire tree:


    ```

    ldapsearch -x

    ```


    The -x option forces ldapsearch to use the simple authentication method. This
    is necessary if the LDAP server is not yet configured to use the SASL authentication
    method.


    ldapsearch reads the search base for the query out of the configuration file /etc/ldap.conf.
    The search base is the entry in the directory where ldapsearch starts the recursive
    search process.


    If the file ldap.conf file does not exist, or if you want to use a different search
    base, you can specify it with the -b option, as in the following:


    ```

    ldapsearch -x -b "ou=people,dc=digitalirlines,dc=com"

    ```


    If you have a lot of data in your LDAP tree, you might want to limit the output
    of ldapsearch to specific entries. You can do that by adding a filter expression
    to the ldapsearch command, as in the following:


    ```

    ldapsearch -x "uid=g*)"

    ```


    In this example, ldapsearch displays all entries that have a uid attribute starting
    with g. You can use any attributes or objectClasses as a search filter.'
  merge: -1
  pgno: 206
- img_proc: true
  md: '# The output of ldapsearch looks like the following:


    ```

    da51:/etc/openldap # ldapsearch -x "uid=geeko"

    # extended LDIF

    #

    # LDAPv3

    # base <> with scope subtree

    # filter: (uid=geeko)

    # requesting: ALL

    #

    # geeko, people, digitalairirlines, com

    duid=geeko,ou=people,dc=digitalairirlines,dc=com

    objectClass: posixAccount

    ObjectClass: shadowAccount

    ObjectClass: inetOrgPerson

    uid: geeko

    uidNumber: 1000

    gidNumber: 100

    cn: Geeko Chameleon

    givenName: Geeko

    sn: Chameleon

    homeDirectory: /home/geeko

    loginShell: /bin/bash

    shadowMax: 99999

    shadowWarning: 7

    shadowInactive: -1

    shadowMin: 0

    shadowLastChange: 12609


    # search result

    search: 2

    result: 0 Success


    # numResponses: 2

    # numEntries: 1

    da51:/etc/openldap #

    ```


    ldapsearch displays the result in LDIF format. That means you can transfer the
    data to another LDAP server by redirecting the data into a file and loading it
    with ldappadd on a different machine.'
  merge: -1
  pgno: 207
- img_proc: true
  md: '# Objective 5 Modify and Delete Entries of the LDAP Server


    The easiest way to modify data in the LDAP directory in SUSE Linux Enterprise
    Server 10 is to modify an LDIF file and apply the changes with the ldapmodify
    tool.


    In the following example, the uidNumber of the user geeko has been changed to
    1011:


    ```

    dn=geeko,dc=ou-people,dc=digitalairlines,dc=com

    objectClass: posixAccount

    objectClass: shadowPerson

    objectClass: inetOrgPerson

    uid: geeko

    uidNumber: 1011

    gidNumber: 100

    cn: Geeko Chameleon

    givenName: Geeko

    sn: Chameleon

    homeDirectory: /home/geeko

    loginShell: /bin/bash

    shadowMax: 99999

    shadowWarning: 7

    shadowInactive: -1

    shadowMin: 0

    shadowLastChange: 12609

    ```


    To apply the changes, use the following command:


    ldapmodify -x -D "cn=Administrator,dc=digitalairlines,dc=com" -W -f geeko.ldif


    Using the ldapmodify command is similar to using ldadd. ldapmodify compares the
    data in the directory with the data from the LDIF file and applies the changes
    to the directory entries.


    To delete an entry from the LDAP directory, use the following command:'
  merge: -1
  pgno: 208
- img_proc: true
  md: '```

    ldapdelete -D "cn=Administrator,dc=digitalirlines,dc=com" -x

    -W "uid=geeko,ou=people,dc=digitalairlines,dc=com"

    ```


    In this example, the entry with the distinguished name

    n“uid=geeko,ou=people,dc=digitalairlines,dc=com" is deleted.'
  merge: -1
