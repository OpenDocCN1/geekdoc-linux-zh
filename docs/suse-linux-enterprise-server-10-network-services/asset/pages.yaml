  md: '# Objective 1


    # Understand the Function of the Three Mail Agents


    Programs that process Internet messages are called agents.


    There are three types of agents:


    +   - Mail Transfer Agent (MTA)

    - Mail Delivery Agent (MDA)

    - Mail User Agent (MUA)


    The following is also described:


    +   - The Mail Cycle

    - Simple Mail Transfer Protocol (SMTP)


    # Mail Transfer Agent (MTA)


    Emails are passed by the email software to the MTA.


    The MTA sends them to a recipient MTA, which checks if the destination address
    exists locally. If it does, the recipient MTA passes the mail to an MDA.


    If the address does not exist locally, the recipient MTA sends the message back
    to the sending MTA.


    Chains are also possible: an MTA can send a message to another MTA, which passes
    it to other MTAs.


    Well-known MTAs are


    +   - Sendmail

    - Postfix

    - Exim

    - Qmail'
  merge: -1
  pgno: 226
- img_proc: true
  md: 'Each recipient MTA leaves a received entry in the header of the message sent.


    # Mail Delivery Agent (MDA)


    The MTA specifies which local user the message is intended for and passes it to
    an MDA, which stores it in the right location.


    A well-known MDA is the program Procmail.


    # Mail User Agent (MUA)


    The MUA reads saved messages and passes new messages to the MTA. It is the interface
    between the MDA and the user.


    The MUA can receive saved messages in three different ways:


    +   - By mail access protocols (such as IMAP or POP)

    - Remotely by file access protocols

    - Through access to local files


    When the MUA goes through IMAP or POP, its functionality is separated into the
    mail client and a server it belongs to, located between the client and the storage
    location.'
  merge: -1
  pgno: 227
- img_proc: true
  md: '# The Mail Cycle


    The following figure shows the mail cycle:


    # Figure 4-1


    ![](img/b7f4ef3c9bdffc8caed3395478c04bab_228_0.png)


    When an MTA receives an email, it checks first if the recipient of the email is
    an existing user on the local machine. If the email is not for a local user, the
    MTA sends it to another MTA (either a so-called relay host or to the mail server
    responsible for the destination domain).


    If the email is for a local user, the MTA hands it over to the MDA which stores
    the mail in the mailbox of the respective user. From there, the email can be retrieved
    using POP or IMAP.


    If POP is used, the email is transferred to the client computer; additionally
    it can be kept on the server.


    If IMAP is used, all emails are kept on the server and the MUA only checks emails
    on this server. The emails are not transferred to the client computer.


    When sending email, the MTA can be configured to ask the MUA for authentication
    of the user. This can be used to prohibit sending spam emails via this MTA.'
  merge: -1
  pgno: 228
- img_proc: true
  md: '# # Simple Mail Transfer Protocol (SMTP)


    Sending email is controlled uniformly in the Internet by SMTP (Simple Mail Transfer
    Protocol). SMTP is defined in RFC 821. Since its creation in 1982, it has undergone
    numerous extensions, such as Mime format (RFC 2045) and SMTP Service Extensions
    (RFC 1869).


    SMTP has the following characteristics:


    +   - There is a direct TCP connection between the sending and receiving computers
    - between the processes involved.

    - The task of SMTP is only transmission, not the receipt or saving of messages.

    - Every message is confirmed.

    - Messages can be forwarded, for example, if an address has changed.

    - Client and server communicate through readable plain text commands.


    In the following we want to have a closer look at:


    +   - The SMTP Commands

    - Command Syntax

    - SMTP Reply Codes

    - Minimal SMTP Command Implementation

    - An Example for Sending Mail with Telnet'
  merge: -1
  pgno: 229
- img_proc: true
  md: "# The SMTP Commands\n\nThe commands are:\n\n+   - HELLO (Hello) is used by\
    \ the SMTP sender to open a connection to an SMTP recipient (greeting) and to\
    \ introduce itself with its full host name. This host name is passed as an argument\
    \ attached to the HELO command.\n- The SMTP recipient answers this greeting with\
    \ its full host name. This completes the initialization of communication between\
    \ the SMTP sender and the recipient.\n- MAIL FROM initializes transmission of\
    \ an email message. In the simplest case, the MAIL FROM command takes the sender's\
    \ email address (reverse-path) as an argument. The argument can be optionally\
    \ extended to include a list of hosts in front of the recipient's address via\
    \ which a reply should be routed (source route relaying), e.g:\n  - @venus.example.com\n\
    \  - @mars.example.com:Sales@example.com\n- RCPT TO (Recipient) sets the recipient's\
    \ address (forward-path) for an item of mail. If the mail should be sent to several\
    \ recipients at the same time, this command is repeated number of times.\nThe\
    \ command may also include a list of hosts (e.g., @mars.example.com,@info@example.com)\
    \ via which the mail should be routed (source route relaying).\nIf the argument\
    \ contains source relay through a list of hosts, the mail will be routed directly\
    \ to the first host given. This removes itself from the beginning of the list\
    \ and forwards the mail to the next host in the list.\n- DATA tells the SMTP mailer\
    \ that anything that follows is the content of the mail. The end of the mail content\
    \ is indicated by Enter."
  merge: -1
  pgno: 230
- img_proc: true
  md: 'When the SMTP recipient recognizes the end of the mail transmission, it begins
    to process the information received. This involves interpreting and possibly updating
    the forward and reverse paths. If this data processing results in no failures,
    the SMTP sender is sent an OK. Otherwise, an error message is sent.


    A time stamp is inserted at the beginning of the mail as soon as the SMTP recipient
    receives a mail to forward further or for direct delivery to the recipient. This
    time stamp contains information about the identity of the SMTP sender, the SMTP
    recipient, and the time when the mail reached the SMTP recipient.


    Mails that are routed over several SMTP relays contain a corresponding number
    of these time stamps. If the SMTP recipient is responsible for the ultimate delivery
    of the mail (if, for example, the addsee''s mailbox is located on the SMTP recipient),
    the current contents of the return path (i.e., the contents of the MAIL FROM after
    being modified through the previous SMTP relays) are inserted at the top of the
    mail.


    +   - VRFY (Verify) verifies a user ID. This causes the SMTP recipient to check
    the validity of the address given as an argument. If the SMTP reader knows the
    address, the address is expanded into a full address (including domain). The VRFY
    command has no influence on the MAIL FROM, RCP TO, and DATA instructions.


    +   - EXPN (Expand) instructs the SMTP recipient to treat the argument as a mailing
    list. As a result, the members of the list are transmitted to the SMTP sender.


    +   - RSET (Reset) resets all the information previously stored about the SMTP
    recipient. The forward path, reverse path, and mail contents are lost.'
  merge: -1
  pgno: 231
- img_proc: true
  md: '+   - HELP takes as its argument any other SMTP command. A page of tips about
    how to use the corresponding instruction will be displayed.


    +   - NOOP (No Operation) causes the SMTP recipient to answer with an OK. Apart
    from that, no changes are made to the mail content or the forward and return paths.


    +   - QUIT ends the connection between the SMTP sender and recipient.


    # Command Syntax


    SMTP commands provide direct communication between the sender and recipient. The
    most commonly used SMTP commands are described in the following table.


    | Command Syntax | Description of the Arguments |

    | --- | --- |

    | HELO hostname | *hostname* contains the complete host name of the SMTP sender
    |

    | MAIL FROM: reverse-path | *reverse-path* contains the relay path for source
    route relaying and the sender''s address |

    | RCPT TO: forward-path | *forward-path* contains the relay path for source route
    relaying and the recipient''s address |

    | DATA data | *data* constitutes the contents of the mail (the actual message).

    | RSET | ./ |

    | VRFY string | *string* contains a user or mailbox name |

    | EXPN string | *string* contains a mailing list identifier |

    | HELP [string] | *string* contains any SMTP command |'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# Table 4-1


    | Command Syntax | Description of the Arguments |

    |---|---|

    | NOOP | /. |

    | QUIT | /. |


    Commands can be written in lower case or upper case; SMTP commands are not case
    sensitive. For example, the SMTP recipient will treat the following commands in
    the same way: **MAIL FROM, Mail From, mail from, Mail FrOm.**


    In contrast, the arguments in *forward-path* and *reverse-path* may be case-sensitive.
    The interpretation of these arguments depends on the SMTP recipient''s operating
    system and the structure of the user database, which is lowercase and uppercase
    characters may be treated differently.


    # SMTP Reply Codes


    During communication between the SMTP sender and recipient, the sender transmits
    various commands to the recipient and controls the course of the communication
    as a whole. The recipient acknowledges the message''s receipt and gives the status
    of command processing with a corresponding reply code. Only when the sender has
    received a receipt for the previous command can it start transmitting the next
    command.


    The most commonly found SMTP reply codes are listed in the table below:


    # Table 4-2


    | Reply Code | Description |

    |---|---|

    | 211 | System status or system help reply |

    | 214 | Displays the help message after entering HELP. |

    | 220 | SMTP server reply. |'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# Table 4-2 (continued)


    | Reply Code | Description |

    | --- | --- |

    | 221 | SMTP server has closed connection. |

    | 250 | Specified command has been carried out. |

    | 251 | User not local; will forward to forward-path. |

    | 354 | Start of the DATA entry. |

    | 421 | SMTP service not available. |

    | 450 | Requested action not taken (mailbox is already in use). |

    | 451 | Requested action aborted. |

    | 452 | Requested action not taken; insufficient storage space in system. |

    | 500 | Syntax error, command unrecognized. |

    | 501 | Syntax error in parameters or arguments. |

    | 502 | Command not implemented. |

    | 503 | Bad sequence of commands. |

    | 504 | Command not implemented for that parameter. |

    | 550 | Requested action not taken; file unavailable (e.g., mailbox not found,
    no access). |

    | 551 | User does not exist on mail server; try forward-path. |

    | 552 | Requested mail action aborted: storage allocation exceeded. |

    | 553 | Requested action not taken: mailbox name not allowed (e.g., mailbox syntax
    incorrect). |

    | 554 | Transaction failed. |'
