    10. |

    | 2. Install and Set Up an OpenLDAP Server | If you did not configure an OpenLDAP
    server during the installation, you need to install the following software packages:

    * openldap2

    * openldap2-clientnThe configuration of the OpenLDAP server is located in the
    file /etc/openldap/slapd.conf.

    You can create passwords for the administrator entry of the configuration file
    with the command `slappassword`.

    /etc/openldap/ldap.conf is the configuration file of the LDAP client.

    /etc/ldap.conf is the configuration file for the LDAP nameservice switch library,
