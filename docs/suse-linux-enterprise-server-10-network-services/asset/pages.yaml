- img_proc: true
  md: '# Objective 1


    # Understand the Domain Name System


    To understand the basics of name resolution with DNS, you need to know the following:


    +   - How Name Resolution Worked in the Early Days of the Internet

    - The Internet Domain Concept

    - How Name Servers Work

    - How to Query DNS


    # How Name Resolution Worked in the Early Days of the Internet


    Computers communicate with each other by using IP addresses, for humans it is
    more simple to address a computer by using its name. This requires some kind of
    conversion that provides computers with IP addresses when a user enters a computer
    name.


    In the early days of the Internet, when there were relatively few computers connected
    to each other, a file was maintained at the Network Information Centre (NIC) of
    the Stanford Research Institute in California that provided exactly this conversion.


    Whenever system administrators added a new computer to the Internet or changed
    the name of an already connected computer, these changes were sent by email to
    the SRI-NIC where they were written to a file called hosts.txt.


    Every system administrator worldwide had to copy this file by FTP and distribute
    it to all computers for which he was responsible.'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'This procedure had several weak points:


    +   - **Load.** Requests to the SRI-NIC created considerable network traffic.
    In addition the computer on which the file was located soon became completely
    overloaded.


    +   - **Name collisions.** Each computer name could be assigned only worldwide.
    Although the NIC was able to assign unique IP addresses, it had no influence over
    the choice of names.


    +   - **Consistency.** It was very difficult to guarantee the consistency of a
    file which was distributed worldwide. When a version of the file HOSTS.TXT reached
    a computer, it could already be out of date.


    +   - **Scalability.** As the number of computers grew, maintenance work became
    much greater.


    In 1984, Paul Mockapetris created a powerful solution for these problems: the
    Domain Name System (or DNS). DNS is a distributed database system that allows
    local administration of areas and guarantees unique computer names worldwide.
    Its hierarchical structure is very similar to the tree structure of the Linux
    file system.


    # The Internet Domain Concept


    DNS consists of several domains that can be divided into subdomains. The top level
    of this structure is the root domain. It is represented simply by a dot (".").
    There are 13 computers worldwide (actually, there are more than 13 computers to
    provide load balancing and fail-safe systems). The first layer below the root
    domain is built by the top-level domains (TLDs).'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'In the early days of DNS there were seven TLDs:


    +   - .com for commercial institutions (such as novell.com and suse.com)


    +   - .edu for educational institutions and research institutes (such as harvard.edu
    and tsci.edu)


    +   - .gov for institutions of the U.S. government (such as nasa.gov and whitehouse.gov)


    +   - .int for international institutions (such as un.int and ecb.int)


    +   - .mil for military institutions (such as army.mil and navy.mil)


    +   - .net for institutions that provide and manage network infrastructure (such
    as internic.net and att.net)


    +   - .org for noncommercial institutions (such as eso.org and eff.org)


    .arpa was used as a TLD, while the ARPANet transferred host files to DNS. The
    Advanced Research Projects Agency Network (ARPANet) developed by ARPA of the U.S.
    Department of Defense was the world''s first operational packet switching network,
    and the progenitor of the global Internet. All computers from the ARPANet were
    later put into the other TLDs. The arpa TLD still has a special meaning which
    will be explained later in this section.


    These TLDs are also known as generic TLDs. Other TLDs for individual countries,
    such as .de for Germany, .uk for the United Kingdom, and .ch for Switzerland,
    were defined later.


    Recently, TLDs such as .info or .biz have become operational. Each of these TLDs
    is administered by its own institution (the Network Information Center or NIC).'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Part of the Internet namespace is shown in the following:


    # Figure 1-1


    ![](img/b7f4ef3c9bdffc8caed3395478c04bab_26_0.png)


    The complete computer name or fully qualified domain name (FQDN) is made from
    the actual computer name, the domain name, and the name of the TLD (one or more
    subdomains might be included).


    Examples of FQDNs are ns.suse.de, www.astro.physik.uni-goetting.de and mail.novell.com.
    To be precise, all these names end with a dot (such as ns.suse.de.) indicating
    the root domain. But as a rule the domain normally is not used. All applications
    know how to handle this.


    # How Name Servers Work


    Domains are administered locally instead of using a global authority. Each domain
    has its own administration point (in practice, many domains are administered from
    one location).


    For each domain there is one DNS server (or name server) defined as being “in
    charge” of its domain. This server is known as the master server, and it is the
    authority for this domain (providing authoritative answers).'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'This authoritative information is important because DNS servers also temporarily
    store information on other domains in a cache and can pass this information on,
    with the note that it is a non-authoritative answer.


    There are other DNS servers called slave servers for the domain that distribute
    the load and serve as backups. Slave servers keep a copy of the information on
    the master server and update this information at regular intervals. This update
    is called zone transfer.


    The following describes the DNS server types available:


    # Table 1-1


    | Master server | Has the main responsibility for a domain.

    Gets its data from local files. |

    | Slave server | Gets its data from the master server using\zone transfer. |

    | Caching-only server | Queries data from other DNS servers and stores the information
    in the cache until its expiration date. All replies are nonauthoritative. |

    | Forwarding server | All queries the server cannot answer

    itatively are forwarded to other DNS

    servers |


    # How to Query DNS


    Various programs are involved in processing a request to the DNS database. The
    first is the resolver. This is a set of library routines used by various programs.


    The resolver makes a request to a DNS server, interprets the answer (real information
    or error message), and sends back this information to the program that called
    it up.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Configure a DNS Server Using BIND


    If the DNS server receives a request from a resolver, one of two things happens:


    +   - If the DNS server is the authority for the requested domain, the DNS server
    provides the required information to the resolver (the authoritative answer).


    or


    +   - If the DNS server is not the authority for the required domain, the DNS
    server queries the responsible authority for the request and gives the result
    to the resolver.


    The data is stored in the cache of the DNS server. If there is another request
    for this data later, the DNS server can provide it immediately (a non-authorative
    answer). All data has a timestamp and time-to-live (TTL) information. When the
    TTL expires, the information is deleted from the cache.


    Assume that your DNS server wants to find the IP address of the computer www.suse.de.
    To do this, the DNS server first makes a request to one of the DNS servers of
    the root domain.


    Each DNS server knows the server of the root domain. E.g., for www.suse.de, this
    is a DNS server for the TLD .de, that is, the computer dns2.denic.


    Our DNS server then asks dns2.denic.de for the authority for the domain suse.de
    and as an answer is given the computer ns.suse.de (one of the DNS servers).


    In a third step, this DNS server is queried and returns the IP address of the
    SUSE web server. This answer is returned by our DNS server to the requesting resolver.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# This procedure is illustrated in the following figure:


    # Figure 1-2


    ![](img/b7f4ef3c9bdffc8caed3395478c04bab_29_0.png)


    The DNS servers for the root domain play a very important role in name resolution.
    In order to alleviate the server load due to queries, every DNS server stores
    the information received from other name servers in its cache. When queries are
    made, this information is sent without querying the root DNS server anew. However,
    root DNS servers are very busy despite this caching mechanism. Several thousand
    queries per second are nothing unusual.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Objective 2


    # Install and Configure the BIND Server Software


    To run a DNS server, you need to install the following packages:


    +   - bind. The BIND server software (version 9.3 in SUSE Linux Enterprise Server
    10)

    - bind-chroot. Chroot environment for BIND server

    - bind-utils. Utilities to query and test BIND (included in standard installation)


    Before starting the DNS server, you have to make some basic configuration changes.
    After finishing your configuration, you can start the server using the following
    command:


    ```

    rcnamed start

    ```


    To stop a running server, use the following command:


    ```

    rcnamed stop

    ```


    To have the DNS server start automatically at boot time, use the following command:


    ```

    inserver named

    ```


    This creates the necessary links in the runlevel directories.


    By default, the name server runs in a chroot environment (NAMED_RUN_CHROOTED="yes")
    in /etc/sysconfig/named).


    For security reasons, chroot should always be used.


    ![](img/b7f4ef3c9bdffc8caed3395478c04bab_30_0.png)'
  merge: -1
  pgno: 30
- img_proc: true
