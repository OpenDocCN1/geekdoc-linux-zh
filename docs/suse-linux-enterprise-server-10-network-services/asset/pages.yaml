  md: '# Configure a DNS Server Using BIND


    This configuration already contains the global entries for the directory and the
    forwarders entries (which can be omitted). There are also some more options marked
    as the comment. The file also contains the mandatory entries for the root servers
    and the resolution of localhost.


    The zone options are followed by definitions for the database files (or zone files)
    for the domains this DNS server serves. At least 2 files are necessary for each
    domain:


    +   - A file for forward resolution (allocating an IP address to a computer name)

    - A file for reverse resolution (allocating a computer name to an IP address)


    If several subsets belong to a domain, then one file for each of these networks
    must be created for reverse resolution.


    Each definition begins with the instruction **zone** (this is why the database
    files are also known as zone files), followed by the name of this zone.


    For forward resolution, this is always the domain name. For reverse resolution,
    the network prefix of the IP address must be given in reverse order (10.0.0. becomes
    0.0.10.) to the suffix in-addr.arpa is added (0.0.10.in-addr.arpa).


    The zone name is always followed by an "in" for Internet. (DNS servers can administer
    information on different name spaces, only that of the Internet. Other name spaces
    are practically never used.)


    The text in curly brackets defines the type of DNS server type (e.g., master)
    for this zone and the name of the zone file.'
  merge: -1
  pgno: 36
- img_proc: true
  md: "The entries for a domain digitalairlines.com and a network\n10.0.0.0/24 would\
    \ look like this:\n\n```\n#\n# forward resolution for the domain digitalairlines.com\n\
    # zone \"digitalairlines.com\" in {\n  type master;\n  file \"master/digitalairlines.com.zone\"\
    ;n}\n# reverse resolution for the network 10.0.0.0\nzone \"0.0.10.in-addr.arpa\"\
    \ in {\n  type master;\n  file \"master/10.0.0.zone\"\n}\n```\n\n# Create the\
    \ Zone Files\n\nThe two files for the domain localhost and the file for the root\
    \ DNS\nservers are always included in the installation. You do not need to\nchange\
    \ these files; however, you must create the files required for\nthe actual domain.\n\
    \nThe subdirectory /var/lib/named/master/ is used for the database\nfiles of a\
    \ master server.\n\nYou need to know the following to manually create the zone\
    \ files:\n\n+   - Structure of the Files\n- The File /var/lib/named/master/digitalairlines.com.zone\n\
    - The File /var/lib/named/master/10.0.0.0.zone\n- The File /var/lib/named/master/localhost.zone\n\
    - The File /var/lib/named/master/127.0.0.zone"
  merge: -1
