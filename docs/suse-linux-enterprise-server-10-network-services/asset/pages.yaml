- img_proc: true
  md: '# Configure Mail Server


    If POSTFIX_LOCALDOMAINS is empty, the variable is set to $myhostname, localhost.$mydomain
    by SUSEconfig.


    +   * POSTFIX_NULL_CLIENT. A nullclient is a host that can only send mail over
    the network, does not receive mail over the network, and does not deliver any
    mail locally.


    If you enter yes, the variable mydestination in the file /etc/postfix/main.cf
    will remain empty after running SuSEconfig.


    The default entry is no.


    +   * POSTFIX_DIALUP. If this value is set to yes, emails that cannot be delivered
    locally are not sent to their destination until the command sendmail -q is run.


    The setting is useful for dial-up systems; otherwise, error messages would appear
    when sending emails if the system is not online, or a connection would be established
    for every message if dial-on-demand is used.


    The value no leads to an immediate attempt to deliver any emails waiting for delivery.


    If this variable is assigned the value yes, the line defer_transports = smtp will
    be added to the file /etc/postfix/main.cf by running SuSEconfig.


    +   * POSTFIX_NODNS. If this variable is set to yes, Postfix will not carry out
    any DNS lookups for the sender and recipient domains when processing emails.


    If this variable is assigned the value yes, the variable disable_dns_lookups =
    yes in the file /etc/postfix/main.cf will be activated by running SuSEconfig.


    +   * POSTFIX_CHROOT. If this variable is set to yes, services will run in a chroot
    environment, if possible. You can find the chroot environment in /var/spool/postfix.


    If the variable is set to no (default), all Postfix processes will run in the
    normal environment.'
