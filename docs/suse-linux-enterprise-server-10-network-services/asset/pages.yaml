  md: '# Objective 6


    # Activate LDAP Authentication


    +   - Change the User Password

    - Activate pam_ldap


    # Change the User Password


    If you use the LDAP directory for user authentication, you can change the user''s
    password using the ldapppasswd command.


    ```

    da51:~ # ldappasswd -x -D

    "cn=Administrator,dc=digitalairlines,dc=com" -W -S

    "uid=geeko,ou=people,dc=digitalairlines,dc=com"

    New password:

    Re-enter new password:

    Enter LDAP password:

    Result: Success (0)

    da51:~ #

    ```


    First you have to enter the new password for the user twice. Then you have to
    enter the administrator''s password to fulfill the change.


    The user can change his own password by:


    ```

    da51:~ # ldappasswd -x -D

    "uid=geeko,ou=people,dc=digitalairlines,dc=com" -W -S

    "uid=geeko,ou=people,dc=digitalairlines,dc=com"

    New password:

    Re-enter new password:

    Enter LDAP password:

    Result: Success (0)

    da51:~ #

    ```


    If you want to create a home directory automatically when the user logs in the
    first time, add the following line to /etc/pam.d/sshd

    session required pam_mkhomedir.so sk=/etc/skel/ umask=022'
