  md: 'SUSE Linux Enterprise Server 10: Networking Services


    +   **POSTFIX_UPDATE_CHROOT_JAIL.** If SuSEconfig is to set up the chroot environment,
    this value should be set to **yes**.

    By default, the variable is set to **no.**


    +   **POSTFIX_LAPTOP.** Some Postfix services access FIFOs frequently, thus preventing
    the hard disk from spinning down.

    However, if this is desired on notebooks for power-saving purposes, the variable
    can be set to **yes.**


    +   **POSTFIX_UPDATE_MAPS.** If SuSEconfig is to create the database files from
    the corresponding lookup tables, this variable should be set to **yes** (default).


    +   **POSTFIX_MAP_LIST.** If POSTFIX_UPDATE_MAPS is set to yes, you can select
    the lists Postfix should support here.


    +   **POSTFIX_RBL_HOSTS.** Here you can specify a comma-separated list of host
    names from which RBLs (Realtime Blackhole List) can be obtained.


    No mail is accepted from clients that are these lists.


    This entry makes sense only if **POSTFIX_BASIC_SPAM_PREVENTION** is **not** set
    to off.


    +   **POSTFIX_BASIC_SPAM_PREVENTION.** Here, specify how strict filter rules for
    UCE (unsolicited commercial email) should be configured.


    Possible levels are **off**, **medium**, and **hard.**


    More details you can find at http://www.postfix.org/uce.html.


    +   **POSTFIX_MDA.** Here, specify an MDA with which Postfix should cooperate.


    The entries are


    +   **procmail.** Use Procmail to deliver mail locally.


    +   **cyrus.** Use lmtp to deliver to cyrus-imapd.


    +   **local.** Use Postfix local MDA.


