  md: '# Dynamic Registration Using slptool


    If a service needs to be registered for OpenSLP from proprietary scripts, use
    the slptool command line frontend.


    slptool provides two basic functionalities:


    +   - It can be used to dynamically register services only for the runtime of
    slpd.

    - It provides User Agent functionality to request services.


    To list all available options and functions of slptool, enter


    ```

    slptool - help

    ```


    or


    ```

    slptool

    ```'
