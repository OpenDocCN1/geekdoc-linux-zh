  md: '# Summary


    # Objective Summary


    +   1. Understand How DHCP Works


    DHCP communication includes the following steps:


    +   1. On startup, the computer broadcasts a message to all the machines in the
    network to find a DHCP server.


    +   2. A DHCP server answers the broadcasting machine''s request by offering an
    IP address and possible additional information.


    +   3. The client chooses one of the responses it has received and sends a request
    to the corresponding DHCP server for the IP address.


    +   4. The DHCP server, in turn, confirms this information and the client is allowed
    to use the IP address.


    When the validity period of the IP address expires, the client sends a request
    to the server again and the server can either extend the duration of the IP address
    or prompt the client to request the assignment of a new address.


    If the client no longer needs the IP address, it sends a relevant notification
    to the DHCP server and the server can reassign the address.'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# Objective


    # Summary


    +   1. Understand How DHCP Works (continued)


    There are two ways IP addresses can be assigned with DHCP:


    +   - Static assignment. The administrator sets an IP address for a specific MAC
    address.


    +   - Dynamic assignment. The DHCP server assigns the host an IP address from
    an address range.'
  merge: -1
  pgno: 157
- img_proc: true
  md: '# Objective


    # Summary


    2. Configure the DHCP Server


    To configure a Linux machine as a DHCP server, the following packages have to
    be installed:


    +   - dhcp


    +   - dhcp-server


    The configuration is made in the following files:


    +   - /etc/sysconfig/dhcpd


    +   - /etc/dhcpd.conf


    The file /etc/sysconfig/dhcpd contains an entry for the network interface on which
    the DHCP server listeners.


    The file /etc/dhcpd.conf contains a number of entries that describe the network
    topology, influence the behavior of the server, or contain information transmitted
    to the clients.


    The entries in the file /etc/dhcpd.conf belong to two categories:


    +   - Parameter statements


    +   - Declarations


    Clients can be separated into classes and are treated differently depending on
    what class they are in.


    The records of the IP addresses already given are written to the file /var/lib/dhcp/db/dhcpd.leases.'
  merge: -1
  pgno: 158
- img_proc: true
  md: '| Objective | Summary |

    | --- | --- |

    | 3. Configure DHCP Clients | To configure a Linux host as a DHCP client software
    packages, like the dhcpd must be installed on the machine (included in the standard
    installation).


    The configuration file for each network interface is located in the directory
    /etc/sysconfig/network/


    This file contains the values with which a network card should be activated.


    Options for the DHCP client are stored in the file /etc/sysconfig/network/dhcp
    |

    | 4. Configure a DHCP Relay Server | Because routers do not route packets addressed
    to the broadcast address of the network, the DHCP server must be accessible for
    the DHCP clients in the local network.


    Instead of implementing a DHCP server in every local network, a DHCP relay server
    can be installed on the routers for the purpose of receiving the client broadcasts
    via one interface and forwarding it to the central server via the other interface.


    The respective package is dhcp-relay. The configuration of the DHCP relay is done
    in the file /etc/sysconfig/dhcprelay |'
  merge: -1
