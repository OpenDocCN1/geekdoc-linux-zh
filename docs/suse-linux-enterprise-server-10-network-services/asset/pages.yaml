- img_proc: true
  md: '# Configure Other Resources


    Two configuration files are used to define additional resources. The file which
    defines the names of the time periods to use is included with the statement:


    ```

    cfg_file=/etc/nagios/timeperiods.cfg

    ```


    The names of the time definitions are used in the services and the hosts definitions.


    A configuration file for basic settings is included with the statement


    ```

    resource_file=/etc/nagios/resource.cfg

    ```


    The file is used for setting variables which are used in the other configuration
    files. By default, only one directive is activated:


    ```

    # Sets $USER1$ to be the path to the plugins

    $USER1=$usr/lib/nagios/plugins

    ```


    The variable $USER1$ is used in the configuration file for commands to do the
    checks (/etc/nagios/checkcommands.cfg).'
  merge: -1
  pgno: 418
- img_proc: true
  md: '# Configure the Nagios Web Server


    To use the web server of Nagios, some configuration has to be done. The web server
    is designed to use the Apache web server; on SUSE Linxu Enterprise Server 10,
    its Apache version 2. By default, access to the web server is only allowed from
    localhost. The configuration file is /etc/apache2/conf/nagios.conf:


    ```

    ScriptAlias /nagios/cgi-bin/ /usr/lib/nagios/cgi/

    <Directory /usr/lib/nagios/cgi/>

    Options ExecCGI

    order deny,allow

    deny from all

    allow from 127.0.0.1

    </Directory>

    Alias /nagios/ /usr/share/nagios/

    <Directory /usr/share/nagios/>

    Options None

    order deny,allow

    deny from all

    allow from 127.0.0.1

    </Directory>

    ```


    To facilitate access to the CGI scripts (see below), it is advisable to require
    user authentication when accessing the Nagios web server. If security reasons
    requireyou to limit access to the web server to special IP addresses, this can
    be defined as well.'
  merge: -1
  pgno: 419
- img_proc: true
  md: "The easiest way to configure user authentication is to modify /etc/apache2/conf.d/nagios.conf\
    \ in this way:\n\n```\nScriptAlias /nagios/cgi-bin/ /usr/lib/nagios/cgi/\n<Directory\
    \ /usr/lib/nagios/cgi/\n    AllowOverride AuthConfig\n    Options ExecCGI\n  \
    \  order deny,allow\n    allow from all\n</Directory>\nAlias /nagios/ /usr/share/nagios/\n\
    <Directory /usr/share/nagios/\n    AllowOverride AuthConfig\n    Options None\n\
    \    order deny,allow\n    allow from all\n</Directory>\n```\n\nThe line AllowOverride\
    \ AuthConfig allows Nagios to use a file .htaccess in the directory which should\
    \ be protected. The contents of this file could look like this:\n\n```\nAuthName\
    \ \"Nagios Access\"\nAuthType Basic\nUserFile /etc/apache2/nagios\nrequire valid-user\n\
    ```\n\nOnly valid users who are defined in the file /etc/apache2/nagios are allowed\
    \ to connect to the Nagios web server. You create this file with the command :#\
    \ htpasswd2\n\n```\nda51:~ htpasswd2 -c /etc/apache2/nagios nagios\nNew password:\n\
    Re-type new password:\nAdding password for user nagios\n```\n\nAdding more users\
    \ to the file is done using htpasswd2 without the option -c."
  merge: -1
  pgno: 420
- img_proc: true
  md: 'The directory /usr/lib/nagios/cgi/ contains a collection of CGI scripts which
    are used to access the Nagios web server and display the status of the services
    and hosts monitored by Nagios. By default, access to these CGI scripts is denied
    for everybody. You have to allow access to the scripts by modifying the file /etc/nagios/cgi.cfg.


    If you use the user name nagiosadmin for connecting to the web server, there is
    not much to modify in order to allow access to the CGI scripts.


    By default, user authentication is required to access the CGI scripts.


    ```

    use_authentication=1

    ```


    All configuration lines defining authorized user names start with “authorized_for_”.
    An example is


    ```

    #authorized_for_system_information=nagiosadmin,theboss,jdoe

    ```


    To activate the statement, just remove the comment character (#) in the first
    column and modify the list of allowed user names. This list is a comma-separated
    list of user names. By default, they all include the user name nagiosadmin.'
  merge: -1
