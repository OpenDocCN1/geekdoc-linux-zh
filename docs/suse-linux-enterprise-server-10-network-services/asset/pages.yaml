  md: '# Administer Cyrus IMAPd


    In the /etc/imapd.conf file, the cyrus is configured for administering the Cyrus
    server (option: **admins**).


    This user is added to the system during Cyrus installation:


    ```

    da51:~ # grep cyrus /etc/passwd

    cyrus:x:96:12:User for

    cyrus-imapd:/usr/lib/cyrus:/bin/bash

    da51:~ # #

    ```


    This user account does not have a system password yet, so you have to set it:


    ```

    da51:~ # passwd cyrus

    Changing password for cyrus.

    New password:

    Re-enter new password:

    Password changed

    ```


    Cyrus IMAPd is using SASL (Simple Authentication and Security Layer) for authentication,
    saslasauthd is a daemon process that handles plaintext authentication requests
    on behalf of the SASL library.


    The SASL server fulfills two roles:


    +   * It isolates all code requiring superuser privileges into a single process.

    * It can be used to provide proxy authentication services to clients that do not
    understand SASL-based authentication.


    To administer your Cyrus server, you need the command **cyradm** to do all the
    other administration tasks. This tool is interactive.


    To start **cyradm**, enter


    ```

    da51:~ # cyradm -user cyrus -auth login localhost

    ```'
  merge: -1
