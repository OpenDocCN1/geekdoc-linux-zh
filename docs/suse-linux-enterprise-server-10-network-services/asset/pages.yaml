  md: '# APPENDIX B Combine Samba and OpenLDAP


    Samba is often combined with OpenLDAP because it allows you to build a backup
    domain controller (BDC) for Windows. Therefore the replication mechism of OpenLDAP
    is used.


    This appendix covers the following topics:


    +   - Prepare the OpenLDAP Directory

    - Understand the LDAP Options of Samba'
  merge: -1
  pgno: 446
- img_proc: true
  md: '# Objective 1


    # Prepare the OpenLDAP Directory


    If you want to access an LDAP directory service from Samba, you have to modify
    the file /etc/openldap/slapd.conf of your LDAP installation. Do the following:


    +   1. Include the schema file of Samba3.


    | include | /etc/openldap/schema/samba3.schema |


    +   2. Allow Samba to access LDAP in an access statement.

    This can look like the following:


    ```

    access to attrs=userpassword,sambaNTPassword,sambaLMPassword

    by self write

    by anonymous auth

    by * none

    ```


    In this example, everybody is allowed to use the different kinds of passwords
    to authenticate. They can only be changed by the password''s owner.


    All attributes can be read by everybody.


    +   3. Make sure that the options suffix, rootdn, and rootpw are set correctly.


    +   4. Check the base option in the file /etc/ldap.conf.'
  merge: -1
  pgno: 447
- img_proc: true
  md: '# 5. The index section may look like this:


    | | | |

    |---|---|-|

    | index objectClass | eq |

    | index cn | pres,sub,eq |

    | index sn | pres,sub,eq |

    | index uid | pres,sub,eq |

    | index displayName | pres,sub,eq |

    | index uidnNumber | eq |

    | index gdnNumber | eq |

    | index memberUid | eq |

    | index sambaSId | eq |

    | index sambaPrimaryGroupSID | eq |

    | index sambaDomainName | eq |

    | index default | sub |'
  merge: -1
  pgno: 448
- img_proc: true
  md: '# Objective 2 Understand the LDAP Options of Samba


    Samba provides some configuration options to communicate with LDAP.


    The most important are the following:


    Here, you can enter one of the following:


    +   - **smbpasswd**

    - **tdbsam (smbpasswd plus NT SAM)

    - **ldapsam**


    If there is a backup domain controller (BDC) in your network, select Ldapsam here.
    **mysqlam** and **xmlams** are also possible options, but not for primary domain
    controllers (PDCs).


    +   - **Ldap admin dn**. Specify the LDAP distinguished name used by Samba to
    retrieve user information.


    +   - **Ldap delete dn**. If this option is set to yes, a delete operation deletes
    the complete LDAP entry.


    Otherwise, only the attributes specific to Samba are deleted.


    +   - **Ldap group suffix**. This suffix is used by Samba for groups, when a group
    is added to the LDAP directory.


    +   - **Ldap idmap suffix**. Specifies the suffix that is used when storing imap
    mappings.


    +   - **Ldap machine suffix**. Specifies where workstations should be added to
    the LDAP directory.


    +   - **Ldap passwd sync**. If this option is set to yes, Samba tries to synchronize
    the LDAP password with the NT and LANManager hashes for normal users.'
  merge: -1
  pgno: 449
- img_proc: true
  md: 'If this option is set to no, only the NT and LANManager passwords are updated.
    If this option is set to only, only the LDAP password is changed.


    +   - ldap server. Enter the FQDN of the LDAP server here.


    +   - ldap ssl. If this option is set to On, Samba uses LDAPS to contact the LDAP
    server. If this option is set to Start_tls, extended StartTLS operations are used.
    Off disables the use of SSL.


    +   - ldap suffix. Specifies where users and workstations are added to the LDAP
    directory. This option can be overwritten by ldap user suffix and ldap machine
    suffix.


    +   - ldap user suffix. Specifies where users should be added to the LDAP directory.


    The following options must be added to the global section of the /etc/samba/smb.conf.


    ```

    passdb backend = ldapsam://da51.digitalairlines.com

    ldap ssl = no

    ldap suffix = "dc=digitalairlines,dc=com"

    ldap admin dn = "cn=administrator,dc=digitalairlines,dc=com"

    ```


    If you want to use SSL encryption, you can set ldap ssl to yes. In this case you
    should change the passwd backend parameter


    ```

    passdb backend = ldapsam://da51.digitalairlines.com

    ```


    ![](img/b7f4ef3c9bdffc8caed3395478c04bab_450_0.png)


    The replication of LDAP servers can be used to set up a Backup Domain Controller
    with Samba. You can find detailed information in the file Samba3-ByExample.pdf
    in the Samba documentation (package samba-doc).'
