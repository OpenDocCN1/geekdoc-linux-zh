  md: '# Objective 8


    # Manage Spam


    The most common tool used to filter spam in Linux is **SpamAssassin**. It tests
    the email body, header, URI and the attachments of mails.


    It also uses black lists and white lists of other organizations (e.g., http://razor.sf.net,
    http://pyzor.sf.net).


    Every hit is weighted with a number. If the sum reaches a defined value, the mail
    is marked as spam.


    This objective explains the following:


    +   * Install SpamAssassin

    * Configure SpamAssassin

    * Use SpamAssassin

    * Test SpamAssassin

    * Train SpamAssassin


    # Install SpamAssassin


    Select the package **spamassassin** to install the spam filter.


    After the installation, four executable files will be available:


    +   * **spamassassin**. Starts SpamAssassin.

    * **spamd**. A daemonized version of the SpamAssassin executable. This daemon
    is useful for automated mail checks.

    * **spamc**. A client for spamd. Use spamc instead of SpamAssassin in your own
    scripts.

    * **sa-learn**. A tool to train SpamAssassin.'
  merge: -1
  pgno: 312
- img_proc: true
  md: '# Configure SpamAssassin


    SpamAssassin is configured by editing the file


    **/etc/mail/spamassassin/local.cf**


    After the installation, this file is similar to the following:


    ```

    # Add your own customisations to this file.  See ''man

    Mail::SpamAssassin::Conf''

    # for details of what can be tweaked.

    #

    # do not change the subject

    # to change the subject, e.g. use

    # rewrite_header Subject ****SPAM(_SCORE)****

    rewrite_header Subject

    ```


    # Set the score required before a mail is considered spam.

    # required_score 5.00


    # uncomment, if you do not want spamassassin to create a new message

    # in case of detecting spam

    # report_safe 0


    Some possible options are described:


    +   - **required_score number**. Threshold when an email is marked as spam (5.0=low,
    7.5=medium, 10.0=high).

    - **rewrite_header [subject|from] string**. This string is added to the specified
    header.

    - **report_safe [0|1]**. If set to 1, the mail is sent as an encapsulated attachment.
    If set to 2, only text spam mails are sent as attachment.

    - **use_bayes [0|1]**. If set to 1, the statistical Bayes filter system is used.

    - **bayes_auto_learn [0|1]**. If set to 1, the Bayes filter learns what is spam
    and what is not.'
  merge: -1
  pgno: 313
- img_proc: true
  md: '# Configure a Mail Server


    +   - skip_rbl_checks [0l]. If set to 1, SpamAssassin uses RBLs

    (DNS black lists).


    +   - ok_locales string. Lists all the character sets SpamAssassin can

    receive (Chinese, English, Japanese, Korean, Russian, and

    Thai).


    If you want to allow all character sets, enter all.


    +   - whitelist_from @domain. Lists the domains that mail can be

    received from.


    ![](img/b7f4ef3c9bdffc8caed3395478c04bab_314_0.png)


    For more information on all possible options, see

    man 3::SpamAssassin::Conf


    The directory /usr/share/spamassassin/ contains a lot of filter rules

    for detecting the spam mails:


    ```

    da51:-# ls 1 /usr/share/spamassassin/

    n20_misc.cf 20_uri_tests.cf 30_text_de.cf

    20_advance_fee.cf 23_bayes.cf 30_text_fr.cf

    20_anti_ratware.cf 25_accessdb.cf 30_text_it.cf

    20_body_tests.cf 25_antivirus.cf 30_text_nl.cf

    20_compensate.cf 25_body_tests.cf 30_text_pl.cf

    20_dnsbbl_tests.cf 25_body_tests_pl.cf 30_pt_br.cf

    20_drugs.cf 25_dcc.cf 50_score.cf

    20_fake_hello_tests.cf 25_domainkeys.cf 60_avl.cf

    20_head_tests.cf 25_hashcache.cf 60_whitelist.cf

    20_html_tests.cf 25_pyzor.cf 60_whitelist_spf.cf

    20_meta_tests.cf 25_razor2.cf 60_whitelist_subject.cf

    20_net_tests.cf 25_replace.cf languages

    20_phrases.cf 25_spf.cf sa-update-pubkey.txt

    20_porn.cf 25_textcat.cf triplets.txt

    20_ratware.cf 25_uribl.cf user_prefs.template

    ```'
  merge: -1
  pgno: 314
- img_proc: true
  md: '# Use SpamAssassin


    spamassassin (and spamc) expect their input from STDIN.


    The simplest way to use SpamAssassin is to pipe the mailbox into

    the command spamassassin:


    ```

    da51:~ # cat /var/spool/mail/root | spamassassin

    ```


    If you want to use SpamAssassin with your Postfix configuration,

    the easiest way is to use Procmail. You need to edit three files:


    +   - Create the file /etc=/tmp/procmail.rc with this content:


    ```

    #LOGFILE=/tmp/procmail.log

    #VERBOSE=yes


    # Until now, mail is untagged, you may add rules for

    # mail that must not be tagged


    :0 hbfw

    | /usr/bin/spamc

    ```


    +   The mail is piped in the first filter rule to the spamc. The flags

    of the filter rule are explained below:

    h. Feed the header to the pipe, file, or mail destination

    (default).

    h. Feed the body to the pipe, file, or mail destination

    (default).

    f. Consider the pipe as a filter.

    h. Wait for the filter or program to finish and check its

    exitcode (normally ignored); if the filter is unsuccessful,

    then the text will not have filtered.


    +   - Make sure that you activate Procmail in /etc/postfix/main.cf:


    ```

    mailbox_command = /usr/bin/procmail

    ```'
  merge: -1
  pgno: 315
- img_proc: true
  md: '+   - Make sure that your smtpd definition in the file /etc/postfix/master.cf
    is set to default


    | smtp | inet | n | - | n | - | smtpd |


    After this, start spamd by entering


    # rcspamd start


    Spam can be filtered from the mail client or in a further Procmail configuration
    (~/.procmailrc) by adding lines similar to this:


    ```

    :0

    * X-Spam-Status: Yes

    $MAILDIR/Spam

    ```


    # Test SpamAssassin


    You can use telnet to test your configuration. You also can send a spam email
    directly using the sendmail command:


    ```

    cat sample-spam.txt | /usr/sbin/sendmail geeko@digitalairlains.com

    ```'
  merge: -1
  pgno: 316
- img_proc: true
  md: '# Train SpamAssassin


    SpamAssassin can learn and improve its spam detection quality. Therefore, it is
    useful to collect all the undetected spam in a separate folder.


    To teach SpamAssassin what spam is, enter


    ```

    sa-learn --spam --file mailfolder

    ```


    To teach SpamAssassin what is not spam, enter


    ```

    sa-learn --ham --file mailfolder

    ```


