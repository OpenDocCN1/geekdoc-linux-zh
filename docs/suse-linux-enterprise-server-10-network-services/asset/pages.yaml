  md: '# Sort Mail with Procmail


    Procmail is currently the most widely used MDA (Mail Delivery Agent) under Linux.
    Procmail is installed in a standard SUSE Linux Enterprise Server 10 installation.
    Postfix (and also Sendmail) integrate Procmail as an MDA.


    Procmail is a highly flexible MDA.


    It can sort email into mailboxes, forward them to other recipients, or delete
    them according to almost arbitrary criteria a user specifies.


    In particular, Procmail is extremely good at sorting large quantities of mail
    and automatically disposing of unwanted email.


    This objective describes how to do the following:


    +   - Install Procmail

    - Configure Procmail

    - Filter and Distribute Incoming Email


    # Install Procmail


    Procmail (package procmail) is automatically installed during the installation
    of Postfix.


    # Configure Procmail


    If Postfix is used as the MTA, the following entry is required in /etc/postfix/main.cf:


    ```

    mailbox_command = /usr/bin/procmail

    ```


    Then, Postfix passes received email to Procmail for local delivery.'
  merge: -1
  pgno: 306
- img_proc: true
  md: 'It is not necessary to take any further configuration steps to get

    Procmail to deliver email to the mailbox of the respective user.


    For more information about all possible Procmail options, see man pages

    man 1 procmail and man 1 procmailrc.


    # Filter and Distribute Incoming Email


    The most interesting aspect of using Procmail is the prefiltering and

    distribution of email based on the information in the mail header or

    the email body.


    This is Procmail''s great strength—it offers more filtering options

    than any other MDA.


    You can set up separate filters for each mail recipient.


    Each email recipient can create a file .procmailrc in his or her home

    directory and install his or her own desired settings for Procmail. It

    is also possible to create a system-wide configuration, using the

    configuration file /etc/procmailrc.


    Where these configuration files do not yet exist or contain no

    commands for Procmail, all mail is delivered to the

    /var/spool/mail/username mailbox.


    If incoming email should be distributed by Procmail to several different

    mailboxes, it must ensure that the directories containing the mailboxes exist.'
  merge: -1
  pgno: 307
- img_proc: true
  md: "# Example 1:\n\nA typical configuration file for Procmail might have the following\
    \ contents:\n\n```\nMAILDIR=$HOME/Mail\nLOGFILE=$MAILDDIR/mail.log\n\n:0\n *From.*digitalairirlines\n\
    $MAILDDIR/Digitalairirlines\n\n:0\n *\n$MAILDDIR/Inbox\n```\n\nThis configuration\
    \ file causes Procmail to respond to incoming email as follows:\n\n+   * The $MAILDDIR\
    \ environment variable is set to **HOME/Mail.**\n\nProcmail interprets any further\
    \ entries with a relative path in the configuration file relative to this directory.\n\
    * The $SLOGFILE environment variable is set to **$MAILDDIR/mail.log.**\n\nThis\
    \ is where log information is placed.\n* The next three lines build a rule comprised\
    \ of a key, a filter, and an action.\n  - The line containing :0 (the key) specifies\
    \ that data from the email header will be compared with the filter expression\
    \ in the following line.\n\nWhen a match is found, the email will be processed\
    \ in accordance with the last line.\n\nProcmail will not process the mail further,\
    \ even when it matches further rules."
  merge: -1
  pgno: 308
- img_proc: true
  md: '# SUSE Linux Enterprise Server 10: Networking Services


    +   The line * **From.*digitalairines** compares all lines in the email header
    with the given regular expression

    **From.*digitalairines.**


    The comparison here is not case-sensitive. All email messages that contains **digitalairines**
    in the From line match this filter.


    +   The line containing **$MAILDIR/Digitalairines** instructs Procmail to place
    the corresponding email in this mail folder.


    +   The last three lines build another rule like the first one.


    +   All email that passes through this last rule is checked by the filter expression,
    *


    +   Since no filter is given here, the rule matches all remaining email, and these
    are placed in the corresponding mail folder, in accordance with the last line

    ($MAILDIR/Inbox).


    Example 2:


    A more detailed configuration is shown in the following example:


    ```

    MAILDIR=$HOME/Mail

    LOGFILE=$MAILDIR/mail.log

    :0

    * ^From.*digitalairines

    * ^Subject.*mail

    {

    :0 c

    $MAILDIR/Digitalairines

    :0

    ! jgoldman@digitalairines.com

    :0

    *

    $MAILDIR/Inbox

    ```'
  merge: -1
  pgno: 309
- img_proc: true
  md: 'This configuration file causes Procmail to process email as follows:


    +   - The environment variables are set again in the first lines (see Example
    1).

    - Any email that contains **digitalairlines** in the From header and contains
    **mail** in the subject line of the header (case-insensitive) is placed in the
    **$MAILDIR/Digitalairlines** mail folder.

    - Procmail makes a copy of this email (:0) and sends it to **jgoldman@digitalairlines.com**.

    - All email that doesn''t match the above rule are matched against * (which matches
    all the remaining email) and these are sent to **$MAILDIR/Inbox**.


    For more information on the ~/.procmailrc configuration file, use the manual page
    (**man 5 procmailrc**).

    There is a good collection of useful configuration examples in the manual page
    of procmailx (**man 5 procmailx**).


    In the directory /usr/share/doc/packages/procmail/examples/ some examples of .procmailrc
    files.'
  merge: -1
  pgno: 310
- img_proc: true
  md: '# Exercise 4-7 Configure Procmail


    In this exercise, you configure Procmail.


    You will find this exercise in the workbook.


    (End of Exercise)'
