  md: '# Objective 3


    # Troubleshoot the Network with Ethereal and tcpdump


    +   * Use Ethereal

    * Use tcpdump


    # Use Ethereal


    Ethereal is a network protocol analyzer. It allows you to examine data from a
    live network or from a captured file on disk.


    You can interactively browse the capture data, viewing summary and detail information
    for each packet.


    Ethereal has a powerful display filter language and the ability to view a reconstructed
    stream of a TCP session.


    To install Ethereal, select the ethereal package in the YaST software installation
    module; then enter **ethereal**.


    To use the features of the program, you need to be logged in as root.


    In this objective, the following is covered:


    +   * Capture Traffic

    * The Ethereal Frontend

    * Filter Display'
  merge: -1
  pgno: 424
- img_proc: true
  md: '# Capture Traffic


    If you start Ethereal, the dialog shows only a menu bar and a tool bar at the
    top. To open a file containing a capture of network traffic, select

    **File > Open**


    To capture actual network traffic, select **Capture > Options.**


    The following dialog appears:


    Figure 6-2


    ![](img/b7f4ef3c9bdffc8caed3395478c04bab_425_0.png)


    From the **Interface** menu, you can select the interface (the traffic you want
    to capture).


    In **Capture Filter**, you can enter a filter rule


    Possible commands for the filter rule are


    +   - **[src|dst] host.** Allows you to filter a host IP address or name.'
  merge: -1
  pgno: 425
- img_proc: true
  md: 'If you add src or dst, you can specify that you are only interested in source
    or destination addresses.


    +   - **ether [src|dst] host.** Allows you to filter Ethernet host addresses.


    If you add src or dst, you can specify that you are only interested in source
    or destination addresses.


    +   - **gateway host.** Allows you to filter packets that used the host as a gateway
    (where the Ethernet source or destination was host but neither the source nor
    destination IP address was host).


    +   - **[src|dst] net net [<mask><mask>-len len].** Allows you to filter network
    numbers.


    If you add src or dst, you can specify that you are only interested in source
    or destination addresses.


    In addition, you can specify either the netmask or the CIDR (Classless InterDomain
    Routing) prefix for the network if it is different from your own.


    +   - **[tcp|udp] [src|dst] port.** Allows you to filter TCP and UDP port numbers.


    You can optionally proceed with this parameter with the keywords src or dst and
    tcp or udp. These parameters allow you to specify that you are only interested
    in source or destination ports and TCP or UDP packets respectively.


    The keywords tcp or udp must appear before src or dst.


    +   - **less|greater length.** Allows you to filter packets whose length was less
    than or equal to the specified length, or greater than or equal to the specified
    length, respectively.


    +   - **ip proto protocol.** Allows you to filter the specified protocol at either
    the Ethernet layer or the IP layer.


    +   - **etherip broadcastmulticast.** Allows you to filter either Ethernet or
    IP broadcasts multicasts.'
  merge: -1
  pgno: 426
- img_proc: true
  md: '+   - expr relop expr. Allows you to create complex filter expressions that
    select bytes or ranges of bytes in packets.


    You can combine these commands with and, or, or not. You can also use brackets.


    If you want to write the captured information into a file, use the options in
    the Capture File(s) frame. You can split the captured information into several
    files.


    By default, you have to stop the capture process with a mouse click. In the Stop
    Capture frame, you can choose to stop the capturing after a number of packets
    has been captured, a level of used memory, or after a certain time.


    To start capturing select Start.


    During the capture process, the following dialog shows how many packets have been
    captured.


