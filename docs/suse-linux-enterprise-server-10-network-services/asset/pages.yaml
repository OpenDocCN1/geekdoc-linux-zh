- img_proc: true
  md: '# Objective 9


    # Use a Virus Scanner for Email


    Communication via email is very important for companies and individuals today,
    but email can be infected by virus software.


    Most of the viruses attack Windows clients, but the mail server of a company is
    often a Linux or UNIX machine. To avoid damage we recommend to search for viruses
    before the infected mail arrives at the user''s client.


    SUSE Linux Enterprise Server 10 provides tools to detect viruses in email on your
    mail server.


    In this objective, the following tools are introduced:


    +   - AVMailGate

    - AMAviSd-new


    # AVMailGate


    AVMailGate is the abbreviation for AntiVir MailGate, an antivirus mail filter
    from H+BEDV Datentechnik GmbH (http://www.hbedv.com).


    AVMailGate updates the virus definition file and the engine itself.


    This topic describes the following:


    +   - AVMailGate Architecture

    - Install AVMailGate

    - Configure AVMailGate

    - Understand the AVMailGate Configuration Files

    - Update AVMailGate'
  merge: -1
  pgno: 319
- img_proc: true
  md: "# AVMailGate Architecture\n\nFigure 4-5\n\n![](img/b7f4ef3c9bdffc8caed3395478c04bab_320_0.png)\n\
    \nAVMailGate is composed of three queues and two kinds of processes:\n\n+   *\
    \ Queues (located in /var/spool/avmailgate)\n    * incoming. The input queue for\
    \ all incoming email.\n    * rejected/. The queue where possible infected email\
    \ are stored.\n    * outgoing. The output queue for not infected email.\n\n+ \
    \  * Processes\n    * avgated. The smtpd receiver that stores incoming email in\
    \ the input queue. (daemon)\n    * avgatefwd. Virus-scanning function and SMTP\
    \ forwarder and sendmail invoker. (daemon)\n\nBoth processes can be configured\
    \ by editing the file /etc/avmailgate.conf"
  merge: -1
  pgno: 320
- img_proc: true
  md: 'SUSE Linux Enterprise Server 10: Networking Services


    This file includes comments that describe the possible settings.


    For a description of all options, see

    /usr/share/packages/avmailgate/doc/MANUAL.


    # Install AVMailGate


    To install AVMailGate, select the package avmailgate.

    A startscript is available in rcavgate to start and stop AVMailGate.

    To start AVMailGate at the system''s start, enter insnerv avgate.


    # Configure AVMailGate


    There are two possibilities to use AVMailGate with Postfix:


    +   - AVMailGate Waits for Mails on Port 25 and Forwards Them to Postfix

    - AVMailGate Is Used from Postfix as Content Filter


    # AVMailGate Waits for Mails on Port 25 and Forwards Them to Postfix


    To use AVMailGate as mail proxy that waits for mails on port 25

    y simply have to avoid that Postfix listens on this port. Therefore

    mark the following line in /etc/postfix/master.cf: as command by

    adding a hash ("#") in front


    | smtp | inet n - - n - - smtpd |


    Then restart Postfix.'
  merge: -1
  pgno: 321
- img_proc: true
  md: '# AVMailGate Is Used from Postfix as Content Filter


    The best way to use AVMailGate with Postfix is to use the Full Content Filter
    API (see FILTER_README in the Postfix package for details).


    It waits for SMTP connections on port 10024 and sends email messages or virus
    warnings per filter over SMTP on port 1025.


    To integrate AVMailGate as a filter in Postfix, the following:


    +   1. Edit /etc/postfix/master.cf and uncomment –if applicable– add the following
    line:


    ```

    localhost:10025 n inet - y - smtpd -oncontent_filter=

    ```


    +   2. Edit /etc/postfix/main.cf and add the following line:


    ```

    content_filter = smtp:127.0.0.1:10024

    ```


    +   3. Since AVMailGate listens on port 10024, not port 25, edit /etc/avmailgate.conf
    and set


    ```

    ListenAddress localhost port 10024

    ```


    +   4. You have to tell AVMailGate it should send email back to Postfix via SMTP
    on host localhost via port 10025. Edit /etc/avmailgate.conf and set


    ```

    ForwardTo SMTP: localhost port 10025

    ```


    +   5. Since AVMailGate sends out notification messages as AVMailGate, set an
    alias in /etc/aliases:


    ```

    vmailgate: root

    ```'
  merge: -1
  pgno: 322
- img_proc: true
  md: 'You must run newaliases afterward.


    +   6. After these changes, enter


    rcpostfix reload

    and

    rcavgate start


    Your system is now ready to scan email.


    # Understand the AVMailGate Configuration Files


    As mentioned before, the configuration file of AVMailGate

    /etc/avmailgate.conf. The options of this file can be grouped:


    +   * General Parameters

    * Scanning of Files in an Archive

    * Handling Envelope Recipient Addresses

    * Adding a Notification in the Body of Transmitted Mails

    * Other Configuration Files


    # General Parameters


    +   * User and Group. avgated and avgatefwd run with the

    permissions of this user and group.

    * Postmaster. Errors and alert messages are sent to this user.

    * MyHostname. Hostname of the computer. If not set, it is

    retrieved by gethostname.

    * SpoolDir. The directory where the queues are stored.

    * AntiVirDir. Directory where the virus signatures are stored.

    * TemporaryVirDir. Temporary directory where email messages

    will be extracted and scanned.'
  merge: -1
  pgno: 323
- img_proc: true
  md: '+   - PidDir. The location of the PID files.


    +   - LogFile. Location of the log file.


    +   - SyslogFacility. Facility argument for the syslog daemon (default: mail).


    +   - MaxIncomingConnections. Maximum number of simultaneous connections.


    +   - SMPTTimeout. Number of seconds until an SMTP timeout occurs.


    More detailed timeouts can be configured by following options:


    +   - SMTPreetingTimeout


    +   - SMTPHeloTimeout


    +   - SMTPMailFromTimeout


    +   - SMTPRcptTimeout


    +   - SMTPDataBlockTimeout


    +   - SMTPDataPeriodTimeout


    +   - MaxSize. Maximum size of a message in bytes.


    +   - MaxRecipientsPerMessage. Maximum number of recipients.


    +   - MinFreeBlocks. Number of free system blocks. If the limit is reached, no
    more incoming email is accepted. (0=disable feature)


    +   - MaxForwarders. Maximum number of forward processes of avgatefwd. The number
    depends on the quality of the network connection (low network quality > higher
    value).


    +   - BlockSuspiciousMime. If set to YES, suspicious MIME email will be blocked.


    +   - BlockExtensions. Filename extensions that should be blocked (separated by
    a semicolon).'
  merge: -1
  pgno: 324
- img_proc: true
  md: '+   - ExposeRecipientsAlerts, ExposeSenderAlerts, ExposePostmasterAlerts. Specifies
    if alerts will be sent to the recipient, sender, or postmaster. The possible values
    are


    +   - NO. No alerts will be sent.


    +   - LOCAL (not available for ExposePostmasterAlerts). Alerts will be sent if
    the recipient/sender is a local user.


    +   - YES. Alerts will be sent.


    +   - AlertsUser. Name of sender of alerts. (Syntax: username or username@domain)


    +   - ListenAddress. Interface and port the SMTP daemon listens on. The default
    interface 0.0.0.0 means all interfaces.


    Syntax: **ListenAddress interface port**


    +   - ForwardTo. Type of mail forwarding.


    +   1. By piping: **ForwardTo sendmail**


    +   2. By SMTP: **ForwardTo SMTP: host port port**


    Default: **ForwardTo** /usr/sbin/sendmail -oem -oi


    +   - RefuseEmptyMail. If set to YES, mails containing a blank sender address
    will be blocked.


    +   - PollPeriod. Interval (in seconds) of queue scanning by avgatefwd.


    +   - QueueLifetime. Maximum time a message can stay in the queue before it is
    bounced. (0 = disable feature)


    +   - ForwarderRetryDelay. Maximum time between retrying to send a queued message.


    +   - ThrottleMessageCount. Number of messages that will be reprocessed in a given
    time. (Only needed for large queues).


    After reprocessing, the avgatefwd will sleep for **ThrottleDelay seconds.**'
  merge: -1
  pgno: 325
- img_proc: true
  md: '+   - BounceMessageUser. Name or mail address of the sender of error messages
    (e.g., if an email could not be delivered).


    # Scanning of Files in an Archive


    +   - ArchiveMaxRecursion. Maximum of recursion depth of unpacking and scanning
    archives. (0 = unlimited)


    +   - ArchiveMaxSize. Maximum file size (in bytes) of an archive that will be
    scanned. (0 = unlimited size)


    +   - ArchiveMaxRatio. Maximum compression ratio of an archive that will be scanned.


    +   - BlockSuspiciousArchive. If set to YES, email that reach the limits ArchiveMaxRecursion,
    ArchiveMaxSize or ArchiveMaxRatio are blocked.


    +   - BlockEncryptedArchive. If set to YES, email with encryped archives are blocked.


    +   - BlockUnsupportedArchive. If set to YES, email with archives that cannot
    be scanned are blocked.


    +   - BlockOnError. If set to YES mail that cannot be scanned due to scan timeout
    or process error are.


    # Handling Envelope Recipient Addresses


    Source routing is a technique whereby the sender of a packet specify the route
    that a packet should take through the network.


    The following options concern the source routing used by avagated. For a detailed
    description, read the AVMailGate documentation.


    +   - AllowSourceRouting


    +   - InEnvelopeAddressesBangIs


    +   - InEnvelopeAddressesPercentIs


    +   - AcceptLooseDomainName'
  merge: -1
  pgno: 326
- img_proc: true
  md: '# Adding a Notification in the Body of Transmitted Mails


    +   **AddStatusInBody.** If set to YES, a default status text is inserted in the
    email’s body.


    If you want to insert your own text, you can specify a file name. For no status
    text, enter NO (default).


    +   **MaxSizeSizeStatus.** Specify a message size up to where the status text
    is added to the message.


    Syntax: MaxMessageSizeStatus X | k | b


    +   **ForwardAllEmailAsMIME.** If set to YES, all incoming non-MIME mails are
    converted to MIME.


    +   **AddPrecedenceHeader.** If set to YES, each notice mail is made with “Precedence:”
    in the header. You can also enter a custom text.


    +   **AddressFilter.** If set to YES each sender and/or recipient address will
    be matched against the tables /etc/avmailgate.scan and /etc/avmailgate.ignore.


    The order in which the tables are scanned can be specified in FilterTableOrder.
    (first matches)


    +   **UseProxy.** You can optimize the scans using the proxy feature in an AVMailGate
    pool.


    The number of anti-virus scanners in the pool can be specified with the ProxyScanners
    option.


    ProxyConnections specifies the number of simultaneous allowed connections.


    +   **AddToHeaderToNotice.** If set to YES, a mail header is added to postmaster
    mails.


    +   **BounceMessageSizeBody, BounceMessageHeader.** Limit the size (in bytes)
    of bounced mails.


    +   **AddHeaderInfo.** If set to YES, the information about the scanning status
    is added to the checked mail.'
  merge: -1
  pgno: 327
- img_proc: true
  md: '+   AddReceivedByHeader. If set to YES, "Received:" is added to the mail''s
    header.


    +   MaxHopCount. If there are more than MaxHopCount "Received:" lines in the header,
    the mail will not be accepted.


    Prevent mail loops.


    # Other Configuration Files


    There are four more configuration files for AVMailGate. These files contain a
    couple of regular expressions.We will only give a short overview here:


    +   /etc/avmailgate.acl. Defines which hosts are considered local and for which
    the server is allowed to relay emails.


    +   /etc/avmailgate.ignore. Defines mail addresses that should not be scanned.


    +   /etc/avmailgate.scan. Defines mail addresses that are always scanned.


    +   /etc/avmailgate.warn. In this file one can specify who receives a mail in
    case of an alert.


    # Update AVMailGate


    The file that includes the virus signatures is /usr/lib/AntiVir/antivir[0123].vdf.


    To update these files, enter


    ```

    /usr/lib/AntiVir/antivir --update

    ```'
