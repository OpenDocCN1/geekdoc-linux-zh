  md: '# APPENDIX C Retrieve Mail with Fetchmail


    You can use Fetchmail to retrieve email from a server.


    The package fetchmail must be installed and configured in the file ~/.fetchmailrc.


    Fetchmail provides a wide range of customization options, such as


    +   - The processing of various mailboxes

    - Fetching mail for multiple users

    - Integration of filter programs

    - Encrypted transmission with SSL


    To start Fetchmail, use the fetchmail command.


    In addition, the progam has numerous options which can supplied when starting
    the program.


    By default, Fetchmail can be runs by any user on the system. This means that each
    user can create his own configuration file in his home directory.


    The user root uses Fetchmail to retrieve the email centrally in regular intervals
    and distribute them to the individual users. This method is set in the script
    /etc/ppp/poll.tcpip.


    The system-wide Fetchmail configuration is done in the file


    ```

    /etc/fetchmailrc

    ```'
  merge: -1
  pgno: 452
- img_proc: true
  md: 'For more information about Fetchmail, see the man pages for the program.

    Information is also available in the /usr/share/doc/packages/fetchmail/

    directory.


    This objective describes how to do the following:


    +   - Configure Fetchmail

    - Understand Command Line Options'
  merge: -1
  pgno: 453
- img_proc: true
  md: '# Objective 1 Configure Fetchmail


    In a line in the ~/.fetchmailrc file has the following structure:


    ```

    poll servername protocol protocol username "name" password

    "password"

    ```


    or, in abbreviated form:


    ```

    poll servername proto protocol user "name" pass "password"

    ```


    This basic form can be extended by adding "local_name"

    containing the user to which the retrieved email can be forwarded.


    In the following example, this is the user:


    ```

    poll da51.digitalairlines.com proto pop3 user "geeko.chameleon" pass

    "SECRET" is "geeko"

    ```


    If several mail servers are queried, the same details can be defined

    once using the defaults instruction, and then they are omitted.


    For example:


    ```

    defaults proto pop3 user "geeko.chameleon"

    poll da51.digitalairlines.com pass "SECRET"

    poll pop3.suse.com pass "CONFIDENTIAL"

    ```


    The basic user options are


    +   * **proto[col].** Type of protocol used (such as **auto, pop3, and imap**).

    * **port.** Port number.

    * **timeout.** Time in seconds to wait for the server replies before fetchmail
    closes the connection.


    The basic user options are'
  merge: -1
  pgno: 454
- img_proc: true
  md: 'SUSE Linux Enterprise Server 10: Networking Services


    +   - **user[name]**. Name of the user on the server.

    - **is.** Name of the user on the client.

    - **pass[word].** Password of the user on the server.

    - **keep.** Messages on the server are not deleted.

    - **flush**. Old messages on the server are deleted.

    - **fetchall**. Fetch both new and old email messages from the server.

    - **no keep**. Delete messages that have been read from the server.

    - **no fetchall**. Retrieve only new messages from the server (default).


    Apart from this, a number of global settings can be made at the beginning of the
    Fetchmail configuration file.


    The most important of these are


    +   - **set daemon seconds.** Fetchmail is started as a daemon in the background
    and checks at the given interval to see if email messages have arrived on the
    server.

    - **set postmaster "username".** Sets the local name of the user responsible for
    error messages.

    - **set logfile path.** Shows the path for the log file.


    ![](img/b7f4ef3c9bdffc8caed3395478c04bab_455_0.png)


    > Because the ~/.fetchmailrc contains the password for access in plain text, only
    the owner of the file should be granted read and write permissions `chmod 600
    .fetchmailrc`. If the permissions are too liberal, Fetchmail will terminate with
    a message indicating this situation.


    The package **fetchmailconf** contains a graphical tool to edit the file .fetchmailrc.


