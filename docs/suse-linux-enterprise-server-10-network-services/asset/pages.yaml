- img_proc: true
  md: "# # Summary\n\n| Objective | Summary |\n| --- | --- |\n| 1. Understand the\
    \ Domain Name System | DNS translates host names into IP addresses. DNS is a distributed\
    \ database. On SUSE Linux Enterprise Server 10, you can use the BIND software\
    \ to set up your own DNS server. A caching-only DNS server is not responsible\
    \ for a domain, it just forwards requests to other name servers and caches the\
    \ result for later requests. A master server is responsible for a domain. It provides\
    \ authoritative information about this domain. DNS server information is stored\
    \ in zone files. A slave DNS server receives copies of the domain zone files from\
    \ the master server. Using slave servers enhances the reliability of the DNS.\
    \ |\n\n+   2. Install and Configure the BIND Server Software\n    * bind. The\
    \ BIND server software (version 9.3 in SUSE Linux Enterprise 10)\n    * bind-utils.\
    \ Utilities to query and test BIND (included in standard installation)\n    *\
    \ bind-chrootenv. Chroot environment for bind"
  merge: -1
  pgno: 84
- img_proc: true
  md: '# Objective

    Summary


    3. Configure a DNS Server


    The configuration of the different DNS server types is slightly different. In
    this objective the following is discussed:


    +   - Configure a Caching-Only DNS Server

    - Configure a Master Server for Your Domain

    - Configure One or More Slave Servers


    The following are the tasks you need to do configure a master DNS server for your
    domain:


    +   - Adapt the Main Server Configuration File

    - Create the Zone Files

    - Create Additional Resource Records'
  merge: -1
  pgno: 85
- img_proc: true
  md: '# Objective


    # Summary


    4. Configure the DNS Clients


    You simply have to enter the IP address of the DNS server and possibly add some
    information about your domain if you are using YaST to set up your DNS client.


    This information is written to the file /etc/resolv.conf.


    /etc/resolv.conf has the following two types of entries:


    +   - search. A list of the names of domains (or subdomains) is provided after
    this keyword.

    - nameserver. The keyword nameserver specifies the IP address of a DNS server
    to use.


    /etc/nwitch.conf configures the name service switch, which is responsible for
    resolving host names, network names, users, and groups.'
  merge: -1
  pgno: 86
- img_proc: true
  md: '| Objective | Summary |

    | --- | --- |

    | 5. Forward DNS Requests | If the name server does not have any information on
    the computer to be resolved, it tries to fetch this information from another name
    server.<br>In the configuration file /etc/named.conf, there should be a zone entry
    containing a reference to a file that contains the IP addresses of the root name
    servers.<br>In this case the requests that could not be resolved locally are forwarded
    to one of the root servers.<br>If requests for a subdomain are forwarded to another
    name server, that server must be defined in the corresponding zone entry.<br>Using
    the entry **forward only**, the name server is instructed never to try to resolve
    the address itself. |'
  merge: -1
  pgno: 87
- img_proc: true
  md: '# Objective Summary


    +   6. Configure Access, Logging, and Security


    To prevent a name server from becoming overloaded, allow access only from specific
    computers or networks.


    This instruction is defined in the options section of the /etc/named.conf file.


    The logging block in the file /etc/named.conf contains the configuration of the
    BIND logging options.


    Log messages are written by means of channels.


    In addition to some predefined channels, an unlimited number of channels can be
    defined.


    Each channel has to contain a destination that determines what to do with the
    messages.


    Ensure that only authorized hosts can perform a zone transfer.


    This can be done by using an encryption key.


    Generate the key by using the dnssec-keygen command.'
  merge: -1
  pgno: 88
