  md: '# Use the Simple Mail Client


    You can use the program mail as a normal mail client on the command line. The
    simplest form of using mail is mail_address.


    Instead of mail_address you can enter a username of a person inside your local
    network. (For sending messages to users other than the local users, you need to
    configure a mail server on your local host.)


    mail first asks you for the subject of the mail. After this you can enter the
    body of your message. To finish the text you have to enter a single full stop
    in the last line:


    ```

    geeko@da51:~ > mail root

    Subject: A simple Mail

    This is just a test mail.

    The body of the text ends with an single full stop.

    ```


    mail confirms the end of the text body with "EOT" (end of text) and sends the
    mail immediately.


    The following are the most important options of mail:


    | Option | Description |

    | --- | --- |

    | -a file | Attach the given file to the message. |

    | -b list | Send blind carbon copies to list. List should be a comma-separated
    list of names. |

    | -c list | Send carbon copies to list of users. |

    | -q file | Start the message with the contents of the specified file. Can be
    given in send mode only. |

    | -s subject | Specify subject on command line (only the first argument after
    the -s flag is used as a subject; be careful to quote subjects containing spaces).
