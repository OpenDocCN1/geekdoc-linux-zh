    # The OpenSLP Registration Files


    On SUSE Linux Enterprise Server 10, many applications already have integrated
    OpenSLP support.


    With the SLP API (application programming interface), developers can easily add
    OpenSLP-based features to their programs.


    The major function calls and more information can be found on RFC 2614.


    Services are configured in registration files to make them available via OpenSLP.


    The following ways of registration are possible:


    +   * Static Registration via Files in /etc/slp.reg.d/

    * Static Registration via /etc/slp.reg

    * Dynamic Registration Using slptool'
  merge: -1
  pgno: 379
- img_proc: true
  md: '# Static Registration via Files in /etc/slp.reg.d/


    The best way to register a service for OpenSLP is to create a registration file
    for each service in the /etc/slp.reg.d/ directory.


    The OpenSLP daemon slpd reads the registration files on startup, maintains all
    the registrations, and re-reads the files whenever the SIGHUP signal is received.


    In order to be registered at the running Service Agent, the service needs to be
    running and have a valid registration file. Then, the Service Agent registers
    the service and can check the active state of the service when the lifetime expires.


    Service Agent registration information is kept in memory and can be sent to Directory
    Agents.


    To understand these registration files, you need to know the following:


    +   - The OpenSLP Registration File Syntax

    - The OpenSLP Service URL Syntax

    - The OpenSLP Service Type Syntax


    # The OpenSLP Registration File Syntax


    The registration file format is easy to understand.


    Each registration consists of several lines with the format


    ```

    #comment

    ;comment

    service-url,language-tag,lifetime,service-type

    scopes=scope-list

    attr=val1

    attr=val1,val2,val3

    ```'
  merge: -1
  pgno: 380
- img_proc: true
  md: '# The options mean


    +   - service-url. (required) This option defines the service URL.


    The syntax is described in “The OpenSLP Syntax” on 5-21.


    +   - language-tag. (required) This option uses the (2-character) language tags
    as specified by RFC 1766 (as en, fr, and de).


    +   - lifetime. (required) This option defines the lifetime of the registration
    in seconds.


    The value must be between 0 and 65535.


    Use 65535 if you want the registration maintained for the life of slpd.


    +   - service-type. (optional) This option defines the type of service being registered.


    This option is ignored by OpenSLP, because service-url must conform to the SLP
    Service URL format.


    +   - scope-list. (optional) This option is a list of comma-delimited scopes to
    register the service in.


    If it is omitted, the service is registered in all scopes specified by the slpd.conf
    file.


    By default, this is the DEFAULT scope on SLP version 2 systems.


    +   - attrid. (optional) This option lists the attributes to register along with
    the service.


    Any string but scopes or SCOPES can be used as an attribute.'
  merge: -1
  pgno: 381
- img_proc: true
  md: '# The OpenSLP Service URL Syntax


    The service URL syntax looks like


    service:service-type://addrspec


    The options mean


    +   - service-type. This option defines the service type as explained in the following
    paragraph.


    +   - addrspec. This option can be just about anything you want that fits URL
    syntax (see RFC 2396) and can be translated as a network location.


    The service and :// strings are required.


    If you want to use service SLPs extensively, read RFC 2609.


    # The OpenSLP Service Type Syntax


    The OpenSLP service type syntax is


    abstract-type:naming-authority:concrete-type


    The options mean


    +   - abstract-type. This option describes the type of service. It should be a
    simple and short description.


    +   - naming-authority. This option describes the name of the organization that
    named the service. It should be a unique name.

    The naming-authority is optional, but if it is omitted, IANA (Internet Assigned
    Numbers Authority) is assumed to be the naming authority, and IANA requires service
    types to be registered (see RFC 2609).'
  merge: -1
  pgno: 382
- img_proc: true
  md: '+   - concrete-type. A concrete-type is a kind of sub-type of the abstract
    type.


    For example, "printer" is an abstract type (owned by IANA) and "printer:lpr" is
    a concrete-type (owned by IANA).


    This option is also optional.


    The official definition of service type strings can be found in RFC 2609, "Service
    Templates and Service Schemes." If you want to work with well-known (IANA) service
    types, read this RFC.


    RFC 2614 specifies a syntax for a registration file that is read by the OpenSLP
    daemon.


    The following is the registration file for Samba (/etc/slp.reg/samba.reg):


    ```

    ################################################################

    # OpenSLP registration file

    # register Samba and SWAT

    ################################################################


    # Register the samba server, if it is running

    service:smb://$HOSTNAME,en,65535

    tcp-port=139

    description=Samba file and print server


    # Register the web administration front-end for samba

    service:Samba-Swat:http://$HOSTNAME:901,en,65535

    tcp-port=901

    description=Samba web administration front end

    ```'
  merge: -1
  pgno: 383
- img_proc: true
  md: "The lines are explained below:\n\n+   - service-smb://$HOSTNAME,en,65535. This\
    \ line describes the service URL:\n  - smb. The abstract type.\n  - $HOSTNAME.\
    \ The hostname of the machine that offers the service.\n  - en. The language (English).\n\
    \  - 65535. The service is registered the whole time while slpd is running.\n\
    - tcp-port=139. The service is provided on port 139.\n- description=Samba file\
    \ and print server. The service description.\n- service:Samba-Swat:http://$HOSTNAME:901,en,65535.\
    \ This line describes the service URL:\n  - Samba-Swat. The abstract type.\n \
    \ - http. The concrete type.\n  - $HOSTNAME. The hostname of the machine that\
    \ offers the service.\n  - 901. The service port.\n  - en. The language (English).\n\
    \  - 65535. The service is registered the whole time while slpd is running.\n\
    - tcp-port=901. The service is provided on port 901.\n- description=Samba web\
    \ administration front end. The service description."
  merge: -1
