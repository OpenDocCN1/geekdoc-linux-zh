- img_proc: true
  md: '# The relocated Lookup Table Format


    Each line defines a rule that is evaluated by smtpd when an email arrives.


    The rules are processed from top to bottom and the matching of rules ends when
    the first match occurs.


    Each line consists of a key field in the first column, which refers to the email
    address of the former recipient or defines this by means of a regular expression
    and contact information in the second column, which may contain a new email address
    of the recipient or other contact information.


    Possible values for the key field are


    +   * user@domain. Defines a filter for the specified email address.


    +   * user. Defines a filter for all email addresses with the same user port,
    provided the domain part of the email is listed in one of the variables $myorigin,
    $mydestination, $inet_interfaces, $proxy_interfaces of the file /etc/postfix/main.


    +   * @domain. Defines a filter for all email addresses of the specified domain.


    Possible values for contact information include any information (such as email
    address or telephone number) that will help someone reach the email addressee.
    The information is used in "user has moved to new_location bounce messages.


    Examples:


    | geeko@digitalirlines.com | geeko@novell.com |

    | tux@digitalirlines.com | Please call 1-800-PIRATES |'
  merge: -1
  pgno: 278
- img_proc: true
  md: 'The notifications of the mail server are sent by email to the sender:


    ```

    <geeko@digitalairlines.com>: host da51.digitalairlines.com[10.0.0.51]

    said: 550

    <geeko@digitalairlines.com>: Recipient address rejected: User has

    m to

    geeko@novell.com (in reply to RCPT TO command)


    <tux@digitalairlines.com>: host da51.digitalairlines.com[10.0.0.51] said:

    550

    <tux@digitalairlines.com>: Recipient address rejected: User has moved

    nPlease call 1-800-PIRATES (in reply to RCPT TO command)

    ```


    # The transport Lookup Table


    You can use the /etc/postfix/transport lookup table to define email routing for
    special email address ranges.


    The following is described:


    +   * Activate the Lookup Table

    * The transport Lookup Table Format


    # Activate the Lookup Table


    This function is activated in the file /etc/postfix/main.cf by the entry


    ```

    transport_maps = hash:/etc/postfix/transport

    ```


    # The transport Lookup Table Format


    Each line defines a rule that is evaluated via the qmgr or the trivial-rewrite
    daemon before an email is sent.


    The rules are processed from top to bottom and the matching of rules ends when
    the first match occurs.'
  merge: -1
  pgno: 279
- img_proc: true
  md: "Each line consists of the definition of a domain pattern in the first column\
    \ and a defined transport path in the second column.\n\nPossible values for the\
    \ domain pattern are\n\n+   - **user@domain**. Email to the specified user is\
    \ forwarded over the defined transport route.\n- **domain**. All email to the\
    \ specified domains are forwarded via the defined transport path.\n- **,domain**.\
    \ All email with subdomains under the specified domain are forwarded via the defined\
    \ transport path. This is only important if transport_maps is not listed in the\
    \ variable parent_domain_matches_subdomain; otherwise, **domain** also includes,\
    \ **,domain**.\n\nPossible values for the transport path are\n\n+   - **transport:nexthop**.\
    \ Different values can be assigned to *transport*, such as **local**, **smtp**,\
    \ or **uucp**. Any, transport path can be assigned to *transport*, including self-defined\
    \ paths (such as Cyrus and Procimal).\n  - **local**. Defines the delivery of\
    \ email via the Postfix process that delivers the email in the local system.\n\
    \    For this specification, the value for:*nexthop* remains blank.\n  - **smtp**.\
    \ Defines the delivery of email via the Postfix process smtp, which delivers the\
    \ email to a remote mail exchanger via the SMTP protocol.\n  - **host:port** can\
    \ be configured as *nexthop* for an email exchanger on a remote host in case it\
    \ does not accept email on port 25/TCP.\n\nTo prevent DNS lookups on the MX entry,\
    \ the form **[host]** or **[host]:port** should be used for the *nexthop* entry."
  merge: -1
  pgno: 280
- img_proc: true
  md: 'uucp. Defines the delivery of email via the Postfix pipe, which is configured
    by means of the file /etc/postfix/master.cf for the delivery of email via UUCP.

    The recipient host is specified as nextthop.


    Examples:


    | digitalirlines.com | smtp:da51.digitalirlines.com:10025 |

    | suse.com | uucp:da150 |


    # The virtual Lookup Table


    You can use the /etc/postfix/virtual lookup table to set up email for a number
    of domains with separate user names.


    The following topics are described:


    +   - Activate the Lookup Table

    - The virtual Lookup Table Format


    # Activate the Lookup Table


    This function is activated in the file /etc/postfix/main.cf by the entry


    ```

    virtual_maps = hash:/etc/postfix/virtual

    ```


    # The virtual Lookup Table Format


    Each line defines a rule that is evaluated via smtpd when an email arrives.


    The rules are processed from top to bottom and the matching of rules ends when
    the first match occurs.'
  merge: -1
  pgno: 281
- img_proc: true
  md: "Using virtual domains requires the definition of the virtual domain first.\
    \ This is done by placing the virtual domain name in the first column and arbitrary\
    \ text in the second column. Text is only used to keep the structure of the file\
    \ and has no meaning.\n\nEvery other line describing a recipient address of this\
    \ domain contains\n\n+   - First column: The recipient address.\n- Second column:\n\
    \  - The user name of the local email user to whom the incoming email should be\
    \ delivered.\n  - or\n  - A comma-separated list of all local email users to whom\
    \ incoming emails should be delivered.\n\nWhen you specify a virtual domain, only\
    \ email addresses containing this virtual domain are modified. Address with a\
    \ subdomain or host name are not modified. You need to specify them as virtual\
    \ domains first.\n\nExample:\n\n| virtual.domain | geeko, tux |\n| postmaster@virtual.domain\
    \ | postmaster |\n| user1@virtual.domain | geeko |\n| user2@virtual.domain | tux\
    \ |"
  merge: -1
  pgno: 282
- img_proc: true
  md: '# The aliases Lookup Table


    The /etc/aliases lookup table is used to define aliases. You cannot redirect emails
    to mailboxes on other hosts or domains.


    The following topics are described:


    +   - Activate the Lookup Table

    - The aliases Lookup Table Format


    # Activate the Lookup Table


    This function is activated in the file /etc/postfix/main.c by the entry


    ```

    alias_maps = hash:/etc/aliases

    ```


    # The aliases Lookup Table Format


    Each line defines a rule that is evaluated by smtpd when an email arrives.


    The rules are processed from top to bottom and the matching of rules ends when
    the first match occurs.


    Each line contains


    +   - First column: A local recipient address followed by a colon.

    - Second column: Filtered email is then redirected to another email user or to
    another email alias.


    Details of the target recipient in the second column can also be extended to include
    multiple recipients using a comma-separated list.


    An email is delivered explicitly to a local user if the recipient address in the
    second column begins with a "@".'
  merge: -1
