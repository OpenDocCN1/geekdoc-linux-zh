  md: '# APPENDIX D Manage Network Devices with SNMP


    The Simple Network Management Protocol (SNMP) is an Internet standard for gathering
    statistics from managing devices on the Internet, principally routers, but also
    network cards and most of the network-enabled devices.


    The information about server, router, workstations, and printers is stored in
    the management information base (MIB). This database includes static information
    and dynamic information such as routing tables and memory usage.


    An implemented variant of the MIB on the host that is managed by an SNMP daemon
    is called an agent.


    An application that uses SNMP utilities to access the stored information in the
    MIB is called the manager.


    The agent automatically collects the specified information on the hosts.


    Agent and manager communicate together. The manager sends a special SNMP command
    to the agent and waits for the answer of the agent. For querying the agents (polling)
    from a management host usually UDP port 161 is used for communication, snmp traps,
    the agent sends on event notifications to the specified management host are sent
    using UDP port 162.


    The most basic commands are SNMPGET and SNMPSET, to read or change information
    respectively. SNMPGETNEXT returns the content of the next MIB entity.'
  merge: -1
  pgno: 462
- img_proc: true
  md: 'The event notifications of the agent are sent via SNMP traps to the manager.
    TRAP is the fourth important SNMP command in this section.


    Another important term in the world of MIB is community. A community is a group
    of database users and their assigned permissions. You can compare the community
    as a string containing username and password in one and only authentication string
    for accessing the SNMP monitored entities.


    The name of the default community is public. The users of public are only allowed
    to read from the database.


    The community named private can read all information, but is also permitted to
    change information in the database (if configured).


    The SNMP daemon is included in the package net-snmp, which is originally based
    on the CMU 2.1.2.1 cmu-snmp code. The net-snmp package uses various configuration
    files to configure its applications. These files are in /usr/share/snmp/, /etc/snmp.conf,
    and ~/.snmp.


    Usually you would specify global setting in /usr/share/snmp and /etc/snmp.conf
    while you use ~/.snmp.conf for userspecific data. Please keep in mind, that those
    files contain private data (passphrases and communities), so limit the read access
    for those files only to the appropriate user.


    In this section, we cover the following topics:


    +   * Understand the Structure of MIB

    * Configure the SNMP Daemon

    * Start the SNMP Agent

    * Test the SNMP Configuration'
  merge: -1
  pgno: 463
- img_proc: true
  md: '# Objective 1 Understand the Structure of MIB


    Every MIB can be visualized as a tree having no named root. The leaves of the
    tree represent the managed objects and variables. Every variable is unique and
    represented by its OID (Object Identifier). The upper layers are administered
    by ISO (International Organization for Standardization) and ITU (International
    Telecommunication Union), while lower layers are delegated to enterprises and
    other organizations (you roughly compare this to the DNS, but without having a
    certain task or queried). The layer separator is the dot. Every node can be named
    either by its name or by the associated number so both strings os.org.dod.internet.mgmt.mib-2
    and 1.3.6.1.2.1 specify the same node MIB-II.


    The following figure shows an example of an MIB. The path to some system information
    is shown:


    ![](img/b7f4ef3c9bdffc8caed3395478c04bab_464_0.png)


    Figure D-1'
  merge: -1
  pgno: 464
- img_proc: true
  md: '# SUSE Linux Enterprise Server 10: Networking Services


    The nodes at one level can be numbered. These numbers are used to identify the
    leaf. The following identifiers are valid for the system''s object ID:


    +   - 1.3.6.1.2.1.1.2

    - 1.3.6.1.2.1.1.sysObjectID

    - iso.org.dod.internet.mgmt.mib-2.1.2

    - iso.org.dod.internet.mgmt.mib-2.system.sysObjectID

    - iso(1).org(3).dod(6).internet(1).mgmt(2).mib-2(1).system(1).sysObjectIDID(2)


    A standardized set of common structures and identity schemas refers to the variables
    of a MIB is called –gstructure of management information–h (SMI). (RFCs 1155,
    1212, 1215)


    The Abstract Syntax Notation One (ASN.1) is used to describe this structure. To
    define a data type in ASN.1, use the following syntax:

    Name ::= Definition


    To define a managed object/variable, you have to use the SMI.1 macro OBJECT-TYPE.
    The syntax is


    | Label OBJECT-TYPE |

    | SYNTAX Data type |

    | MAX-ACCESS Permission |

    | STATUS Importance |

    | DESCRIPTION Description |


    The parts of this definition are:


    +   - SYNTAX. Specify the data type of the object/variable.

    - MAX-ACCESS. Specify the access permission for the new object/variable. Possible
    values are:

    - read-only. Value is not writable.

    - read-write. Value is writable.

    - write-only. Value is not readable but writable.


    # CNI USE ONLY-1 HARDCOPY PERMITTED


    Copying all or part of this manual, or distributing copies, is strictly prohibited.
    To report suspected copying, please call 1-800-PIRATES.


    D-4 Version 1'
  merge: -1
  pgno: 465
- img_proc: true
  md: 'not-accessible. Value is not accessible.


    +   - STATUS. Specify the importance of the object/variable. Possible values are:


    +   - Mandatory. Variable must be set.


    +   - Optional. Variable is optional.


    +   - Deprecated. Variable is replaced by another one.


    +   - Obsolete. Variable is not used anymore in this MIB.


    +   - DESCRIPTION. A brief description of the object/variable.


    A couple of MIBs can be found in the directory /usr/share/snmp/mibs/.'
  merge: -1
  pgno: 466
- img_proc: true
  md: '# Objective 2 Configure the SNMP Daemon


