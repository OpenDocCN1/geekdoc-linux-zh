    3. 一旦你选择了目标，右键点击它以打开右菜单。点击 `Copy MAC Address`。


    4. 转到菜单栏上的 `Rules` 选项卡并选择 `MAC Addresses`。勾选 `MAC Address` 规则。


    5. 对于 `Action` 选项，选择 `CAPTURE`。之后，转到 `Add Record` 选项并选择 `BOTH`。


    6. 完成规则格式化后，将复制到剪贴板的 MAC 地址粘贴到其下方的框中。


    7. 在捕获包时，请记住你只需要捕获将用于破解的包。为了确保你只捕获所需的包，请选择选项 `D`（你可以在窗口正方的栏上找到）并取消勾选 `Management
    Packets` 和 `Control Packets`。


    8. 确保你保存了捕获到的包，以便以后破解。转到菜单栏上的 `Logging` 选项卡并启用 `Auto Saving`。随后，将 `Average Log
    File Size` 设置为 `20`，并将 `Maximum Directory Size` 设置为 `2000`。


    9. 现在，等待直到捕获足够的数据包。确保你等到至少有 `100,000` 个数据包，以便你获得用于破解的良好信号。


    10. 收集足够的数据包后，转到 `Log` 选项卡并选择捕获期间保存的所有日志。转到保存日志的文件夹。点击 `File`，然后点击 `Export`，选择
    `Wireshark tcpdump format` 将其保存为 `.cap` 文件。选择任何你以后方便访问的路径。不要关闭 `CommView`。


    11. 现在，你准备好破解了。运行 `Aircrack-ng GUI` 并选择 `WEP` 选项。系统会提示你打开之前导出的 `.cap` 文件。一旦检索该文件，选择
    `Launch`。


    12. 一旦你的 `Aircrack-ng GUI` 运行并解密日志中的数据包，打开命令提示符。输入你之前选择的网络的索引号。


    13. 等待无线密钥出现。


    如果一切进展顺利，你就能轻松地获得目标网络的无线密钥。如果你漏掉了一些包，`Aircrack-ng` 会提示你还需要捕获更多包。如果发生了这种情况，你只需要等待
    `CommView` 获取你所需的额外包。


    ## 更强的安全措施能被破解吗？


    到此时，你会意识到对于大多数黑客来说，访问你正在使用的网络安全类型相当容易。同时，你应该有这样一个观念：一旦犯罪黑客知道你正在使用的加密类型，他们就更容易识别出用于破解你网络应使用的工具。


    黑客有可能破解如 `WPA` 和 `WPA2` 等更高级的协议吗？是的，他们可以实现这一目标，但需要花费更多时间——使得过程效率低下，特别是考虑到他们破解网络连接的目标是为了享受更好的带宽和即时的互联网访问，甚至为了掩盖自己的位置。出于因此，如果你的设备允许，最好启用
    `WPA`（或其他更好的加密选项）。


    现在你已经对黑客如何窃取你的 Wi-Fi 有了大致，是时候采取一些预防措施了。下一章将告诉你更多相关信息。


    # 第 6 章 网络安全基础知识


    网络恐怖主义可以通过计算机网络和互联网来实现个人目标，一些经验丰富的网络恐怖分子能够对政府系统、医院记录以及国家军事和安全计划造成大规模破坏，使一个国家处于动荡状态，对进一步的攻击感到恐惧。许多网络恐怖分的目标通常与政治或意识形态日程有关。


    网络恐怖主义在预防或保护系统方面具有挑战性，因为它具有很大的匿名性，动机未知，并且未来是否会再次受到攻击具有不性。对于网络恐怖主义的确切定义，或者它是否应该被称为恐怖主义存在一些争议，因为这些行动与传统的恐怖主义方法没有密切联系，而是指向信息战；然而，由于许多动机具有政治性质并针对破坏基础设施，该术语松散地属于恐怖主义的范畴。


    网络恐怖主义可以由个人、团体和组织实施，在某些情况下由攻击竞争政府的国家实施。由于潜在的损害，网络恐怖主义目前是政府和媒体来源的关注重点，诸如联邦调查局 (`FBI`)
    和美国中央情报局等政府机构建立了专门的打击小组，以减少网络恐怖主义造成的破坏。


    网络恐怖主义可以通过多种技术实现，例如网络渗透和为了干扰和瘫痪系统而创建的病毒。网络恐怖主义比为了个人利益的简单网络犯罪更危险。网络恐怖主义会对受攻击的国家和机构产生严重后果，使生命面临危险。随着我们技术的进步，有很多方法可以对抗网络恐怖主义，首先通过预测和准备攻击并实施预防计划，在此之后我们准备事件管理，以在攻击达到目标的情况下限制攻击造成的损害。一旦攻击发生，防御的下一阶段是实施后果管理，即评估损害并记录我们如何在未来改进防御，然后重新开始这一过程。


    ## 网络恐怖主义的特征


    在理解了网络恐怖主义的定义后，发现许多网络恐怖分子具有具有非常相似的共同特征，这些特征可以将他们归类为网络恐怖分子。其中一个特征是，网络恐怖主义攻击的受害者是被专门针对的，而不是像除了财务利益或娱乐外没有明确目标的黑客那样是随机的。虽然存在黑客向普通公众发布病毒或蠕虫的随机情况，但这样做通常有明确的目标，受害者是由于黑客预设的原因而针对的特定群体或国家。其他目标涉及攻击组织、行业、部门或经济体，以造成破坏或摧毁其目标为目的。


    最后，网络恐怖主义的另一个共同特征是推进恐怖组织自己的目标，这些目标可能是财务的、政治的宗教或意识形态的。这些恐怖分子试图通过对目标造成严重损害来实现这一目标，并通过公开宣传来使自己的目标显而易见。


    ## 网络恐怖主义攻击类型


    加利福尼亚州蒙特雷的海军研究生学院恐怖主义与不规则战争研究中心将网络恐怖主义分为三个主要类别。这些类别是：简单非结构化、高级结构化和复杂协调化。


    ### 简单非结构化

    这些是小规模攻击，通常由经验丰富的黑客使用他人创建的广泛可用工具执行。此类攻击背后的黑客通常缺乏指挥控制技能，并且学习能力有限。


    ### 高级结构化

    这些类型的攻击更为复杂，可以针对多个系统或网络，负责的黑客拥有修改甚至创建基础黑客工具的能力。虽然黑客拥有有限的指挥控制技能，但他们具有不断学习的能力，并根据他们针对的组织构成了重大风险。


