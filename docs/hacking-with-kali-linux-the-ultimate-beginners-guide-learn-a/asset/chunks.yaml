    # Maltego


    Maltego is another free and open source platform that allows for deep mining and
    gathering of information, providing a picture of the threats on your system. Maltego
    is one of the best tools for showing how severe and complex the failure points
    are in your system and in the environment around you. It is used for analyzing
    real world links between companies, people, domains, websites, DNS names, documents,
    IP addresses and much more. Maltego is based on `Java` and has a user-friendly
    GUI with loads of options for customization.


    Supported platforms include `Linux`, `Mac OS X`, and `Windows`.


    # Social-Engineer Toolkit


    If you’ve watched `Mr. Robot`, you will recognize this tool, developed by `TrustedSec`.
    It is a highly advanced tool for the simulation of several social-engineering
    attack types, such as phishing attacks, credential harvesting and much more. The
    tool will automate each attack and generates malicious websites, spoof emails,
    and other things. It is based on `Python` and is the industry standard tool or
    penetration testing for social engineering attacks.


    # Netsparker


    Netsparker is one of the most popular scanners for web applications, looking for
    flaws such as local file induction, and `SQL injection`. It will come up with
    remedial actions that you can take in a safe and read-only manner. You will not
    need to verify the vulnerability yourself because Netsparker will provide you
    with the proof of the exploitation. If it is unable to automatically verify a
    flaw, you will get an alert message.


    Netsparker is very easy to use; all you do is input the `URL` of the web application
    you want scanning and it will get on with it for you. Netsparker has support for
    `AJAX` and `Java`-based applications so there is no need for any complex configurations
    for scanning. You can get a free demo version or pay for the full package.


    Netsparker is only supported on `Windows` systems.


    # w3af


    `w3af` is open source and free and is another scanner for web applications. It
    is used by penetration testers and hackers and the name stands for Web Application
    Attack and Audit Framework. `W3af` allows you to get information on security vulnerabilities
    that may be used in penetration testing. It claims to be able to identify in excess
    of 200 different vulnerabilities, including `SQL injection`, cross-site scripting,
    `PH` misconfigurations, unhandled app errors and easy-to-guess credentials. It
    also claims that it can make any web application more secure. `W3af` is available
    in GUI and command-line interfaces and is user-friendly.


    Supported platforms include `Mac OS X`, `BSD`, `Linux` and older versions of the
    tool are supported on `Windows`.


    # Other Top Hacking and Security Tools


    ## Web Vulnerability Scanners

    * `AppScan`

    * `Burp Suite`

    * `Firebug`

    * `Grendel-Scan`

    * `Nikto`

    * `OWASP Zed`

    * `Paros Proxy`


    ## Vulnerability Exploitation Tools

    * `BeEF`

    * `Core Impact`

    * `Netsparker`

    * `Sqlmap`

    * `WebGoat`


    ## Forensic Tools

    * `Autopsy`

    * `EnCase`

    * `Helix3 Pro`


    ## Port Scanners

    * `Angry IP Scanner`

    * `NetScanTools`

    * `Unicornscan`


    ## Traffic Monitoring Tools

    * `Argus`

    * `Nagios`

    * `Ngrep`

    * `NtopSplunk`


    ## Debuggers

    * `GDB`

    * `IDA Pro`

    * `Immunity Debugger`

    * `WinDbg`


    ## Rootkit Detectors

    * `DumpSec`

    * `HijackThis`

    * `Tripwire`


    ## Encryption Tools

    * `KeePass`

    * `OpenSSH/PuTTY/SSH`

    * `OpenSSL`

    * `Tor`


    ## Password Crackers

    * `Aircrack`

    * `Hydra`

    * `John the Ripper`


    # Best practices to prevent yourself from getting hacked


    Hackers are not the nicest of people, at least some of them aren’t. It doesn’t
    matter whether they work alone, as part of some shady syndicate or for someone
    with a political agenda, they have the power and the knowledge to gain access
    to your system and your information. A hacker could easily find tons of information
    on the internet about that company and they would then use what information they
    learned to find the weaknesses and exploit them. This puts any data that you have
    entrusted to that company in very real danger.


    Think of the computer system and internet network you use at home as a company.
    Is it protected? What can you do to make sure hackers can’t get into it? Instead
    of just sitting there and waiting for an attack to happen before you take any
    action, do it now; fight back against the hacker!


    Here are 10 ways that you can protect your system against a hacker:


    ### Update, Update, Update

    Keep your operating system and all your applications and software updated as often
    as possible. Every time an update is released, apply it. This stops hackers from
    being able to get into your computer through holes and weaknesses in programs
    that haven''t been updated. If you use `Windows`, ensure that automatic updating
    is on.


    ### Use Up Date Security Programs

    I’m talking about things like antivirus software, anti-malware tools, anti-spyware
    and, of course, your `firewall`. If you use software like `Flash` or `Java`, find
    alternatives because these are incredibly susceptible.


    ### Destroy Personal Information

    This is more if you are selling or throwing away your computer or hardware. Make
    sure your hard drive is completely erased. If your information is very critical
    and you are discarding the device, consider using a chainsaw to destroy the hard
    drive.


    ### Never Use Open Wi-Fi

    Using open `Wi-Fi` makes it easier for hackers to steal your network connection
    and download data from your computer. Use an encrypted password to protect your
    `Wi-Fi` and think about buying a new router every couple of years. Some routers
    do develop vulnerabilities that may never be patched up and newer ones provide
    the ability to give guest access.


    ### Password Protect All Your Devices

    This includes your desktop computer, laptop, smartphone, tablet, smartwatch, everything
    that can take a password. Because mobile devices are so highly used these days,
    they are more vulnerable than ever before. Make sure your phone is locked and
    the screen timeout is as short as possible. If available, use fingerprint locking
    or any other form of biometric security.


    ### Make Sure Your Passwords are Difficult to Guess

    All of your passwords should be difficult ones to crack and should be changed
    regularly. If you really do find it hard to remember so many passwords, consider
    using a password manager. If available, apply two-step verification where possible.


    ### Make Your Security Question Answers Creative

