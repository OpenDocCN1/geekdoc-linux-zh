    Any code you write would be executed by the interpreter regardless of the form
    it takes. As such, the primary condition for being able to execute python scripts
    is to have an interpreter correctly installed in your PC. An interpreter is capable
    of executing python codes in the following ways:


    * As a block of code entered an interactive session; or

    * As a module or script.


    ## How python codes are run an interactive session:


    Running python codes via the interactive session is one of the popular ways of
    executing scripts and modules. To begin the python interactive session, the terminal
    or command-line is opened. Next, depending on the version of python in use, input
    the word `python` or `python 3` in and click to enter. The default prompt in the
    interactive mode is the sign `>>>`. So, whenever you see these characters, keep
    in mind that you have entered the interactive interface. Here, you can attempt
    to write and run your python codes. However, as simple as this method seems, it
    has one major downside: your code lasts as long as the session. Once you terminate
    your session, your codes are gone. The upside to this method is that any statement
    and expression you input is immediately evaluated and executed. That it allows
    you to test each line of code written makes a great tool for development, and
    a fine platform to practice coding python easily and quickly. To leave the interactive
    mode, you could use any other following methods:


    * You can use built-in functions such as `exit()` or `quit()`.

    * You can also use a combination of keys. For systems with Unix-styled platforms,
    you can use `Ctrl and D`. In Windows, on the other hand, you can use the keys
    `Ctrl + Z` and click to enter.

    * Take note that the primary general guideline to keep in mind when coding with
    python is to use the interactive session when in doubt of the function(s) of any
    code.


    If you have no experience using the terminal or command-line, below are some steps
    you can use:


    1. When using Windows, locate the command-line otherwise known as the MS-DOS console
    or command prompt. The command-line is a program known as `cmd.exe`. However,
    the path to this program can change with the version of your system.

    2. To gain quick access to it, you can use the codes `Win + R` key to get to the
    Run dialogue. Once the interface opens, input `cmd` in and click to enter.

    3. On platforms that run on GNU or Linux as well as other versions of Unixes,
    there are numerous applications which provide access to the system command-line.
    Some of them include `Konsole`, `xterm`, `Terminal`, and `Gnome`. The tools run
    terminals or shells such as `csh`, `ksh`, `Bash`, among others. In this scenario,
    the path to each application is more diverse and is dependent on the way it is
    distributed, as well as the environment of the PC you use. Hence, it is essential
    for you to take note of the documentation regarding your system.

    4. On systems running on Mac OS X platform, the system terminal is accessible
    through the following processes:

    5. Go to Applications, enter Utilities and click on Terminal.


    ## How the interpreter runs python scripts:


    The process of running python scripts is riddled with multiple steps undergone
    by the interpreter. In doing this, the interpreter does the following:


    I. Processing the statements of your script in a manner of sequence.

    II. Compiling the source code into bytecode — an intermediate format:

    The bytecode represents the conversion of the code into a lower-level language
    which is independent of the platform. The purpose of the bytecode is to optimize
    the execution of the codes. As such, in running your code, the interpreter boycotts
    the compilation process. Take note that only modules undergo code mobilization
    because they are imported, executable scripts don''t.

    III. Send off the code to be executed:

    Here, the `PVM` (Python Virtual Machine) which is the runtime engine of python
    is used. The `PVM` works as a cycle which iterates over the instructions contained
    in your bytecode, running them one after the other. However, do not consider the
    Python Virtual Machine to be an isolated part of python. No. It is merely a part
    of the python system which is installed in your machine. In the Python interpreter,
    the `PVM` is the final step.


    The entirety of the processes required to execute python scripts is referred to
    as the Python Execution Model.


    ## How Python Scripts Can be Executed Using the Command-Line:


    The interactive session in Python would allow you to write many different lines
    of code, but the minute you close the window, everything you have written would
    be lost. This explains why python programs should be written using plain text
    files. Conventionally, files created this way would be attached with a `.py` extension
    which could also be `.pyw` on Windows operating systems. Any plain text editor
    can be used in the creation of python codes. To make this section more practical
    oriented, you would have to create a sample test script to explain how to run
    a python script.


    To begin, open a text editor and enter the following lines of code:


    ```python

    #!/usr/bin/env python3


    print("Hello World!")

    ```


    Proceed to save the file to your directory under the file name, `hello.py`. This
    marks the completion of writing your test script.


    ### How to use the python command:


    To run your sample python script or any other script, you would have to use python
    command. Begin by opening a command-line and entering the word `python3` or just
    `python` depending on your installed version. Next, attach a path to your script
    in the following fashion:


    ```bash

    python3 hello.py

    ```


    Hello World!


    If your coding is error-free, the execution should work well, and the words "Hello
    World!" would be displayed on the screen. So that is how you run a python script.
    If the script is unable to run, chances are you have made a mistake in your coding
    or in adding the path, or there might be problems with your installed version.
    Cross-check your text file to ensure it is error-free. If it is, check your path;
    the way and place the file is saved. If that is also all right, check your python
    installation. Basically, it is the simplest and most practical way to execute
    a python script.


    ### How to redirect output:


    It is sometimes helpful to save the output of a python script for analysis at
    a later date. To do that, enter the following line of code:


    ```bash

    python3 hello.py > output.txt

    ```


    In doing this, you would redirect the output of the python script to a file named
    `output.txt` instead of `stdout` — the default system output file. If before now
    `output.txt` file doesn''t already exist on your system, the procedure would automatically
    create it. However, if it already exists, the new output would be used to replace
    the contents in it. Thus, your line of code should be as such:


    ```bash

    python3 hello.py >> output.txt

    ```


    Now, instead of being replaced, the output script would be attached to the end
    of `output.txt`.


    ### How to run modules with the -m option:


    In Python, some command-line options are made available to meet the many different
    needs of users. For instance, if you want to execute a module in Python, you can
    run it under the command `python -m <module-name>`. The function of the `-m` option
    is to search the `sys.path` for a module name whose content runs as `__main__`.
    Take the instance below:


    ```bash

    python3 -m hello

    ```


    Hello World!


    Take note that the `module-name` has to be named after a module object rather
    than a string.

