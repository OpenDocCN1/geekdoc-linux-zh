    \ network’s operating systems such as `Windows servers`, `Linux/Unix`, and `Mac\
    \ OS servers`. \n\nIn this case, the firewall will be deconfigured on the network’s\
    \ server in order to grant permission to some network traffic types. When used\
    \ at home or in small offices, it can be installed on the home or office’s local\
    \ system where it will be configured for controlling traffic. You can also find\
    \ some third-party firewalls. Today, you can find hardware firewalls deployed\
    \ in different networks. These firewalls are usually dedicated network devices\
    \ and needs only little configuration for implementation. All the systems behind\
