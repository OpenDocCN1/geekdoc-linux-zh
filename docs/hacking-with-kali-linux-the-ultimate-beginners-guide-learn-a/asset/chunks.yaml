    道德黑客，或者网络社区所称的“白帽”，在技术上属于黑客，因为他们的工作是寻找各种计算机网络和系统中的漏洞和其他可被利用的弱点。这些“白帽”之所以被称为这样，是因为白色与善良联系在一起，因此他们是为了网络的良好而工作，通过尝试发现其弱点以便进行修复。


    公司聘佣道德黑客是为了更好地改进其安全系统，因为网络安全对于任何公司或企业来说至关重要，这确保他们不会被欺骗、被盗窃或遭受其他损害；因为一个容易受到攻击攻击的网络将允许恶意攻击者或黑客窃取数据、造成财务损失或其他种类的损害。


    请注意，在操作和使用的工具方面，道德黑客的实际操作方式往往与黑客相似。毕竟，黑客进入系统的意图是寻找漏洞，而许多顶级工作工具也供那些意图不那么高尚的人使用。此外，道德黑客或“白帽”通常还会刻意地使用与自由职业黑客或恶意黑客（即“黑帽”）相同的软件和工具，因为他们的工作是在“黑帽”之前发现相同的漏洞，或者在未能发现的情况下，找到修复和修复这些网络漏洞与弱点的方法。为了实现这一点，逻辑上只需以类似于“黑帽”的方式来处理问题，允许他们“戴上”对手的帽子”，以便像他们一样思考。


    请注意，仅仅由合法注册实体（如企业或公司）聘用黑客并不意味着他们自动成为“白帽”。有些企业聘用“黑帽”是为了从竞争对手那里获取公司数据或其他敏感信息。“白帽”的特征是他们只寻找自己雇主网络安全中的漏洞，并且他们获得了此的明确授权，而且他们有责任和义务尽快向雇主报告发现的任何和所有漏洞。


    还有另一类黑客，通常被称为“灰帽”，他们介于“黑帽”和“白帽”之间的中间地带。这些“灰帽”的功能与“白帽”类似，他们寻找漏洞是为了报告它们，允许网络所有者修复漏洞，但这些“灰帽”在没有网络所有者授权的情况下工作，这意味着尽管他们可能意图良好，他们所做的行为极有可能违反所在国家的网络犯罪法律。


    ## 道德黑客的分步骤流程


    当你的互联网连接被黑客攻击时会发生什么？你的连接不仅会变慢，你的身份和位置也可能被犯罪黑客利用你的网络进行任何非法活动。同时，由于发现了有漏洞的端口和共享网络设备（如打印机），犯罪黑客极可能更深入访问你的个人电脑。如果你的手机也同步到了电脑上，那么存在犯罪黑客也可能访问该设备的风险。


    因此，了解你的互联网连接如何被破解非常重要。在本章中，你将学习大多数犯罪黑客如何通过最流行的黑客工具破解你的互联网连接。


    ### 方法 1：检查未更改的路由器密码


    这可能是破解互联网连接最简单的方法。你只需要查看你可以连接的所有可用网络。要做到这一点，打开电脑的 WiFi 并查看附近的可用网络列表。


    现在，你会发现可用网络列表中常见的路由器名称，例如 `Linksys`。这些路由器的默认密码未被更改的可能性很大，因此你只需要登录制造商提供的密码即可。如何操作呢？你只需要访问制造商网站并查找路由器说明。


    如果你能够使用默认密码进入目标网络，请打开一个新的浏览器并登录到目标路由器的 GUI。如果你的目标是 `Linksys` 路由器，显示其 GUI 的 IP
    地址是 `192.168.1.1`。当提示输入登录凭据时，将用户名留空，密码处输入 `admin`。（注意：某些路由器根据型号不同的不同的登录凭据。你可以在制造商网站上检查这些内容。）


    一旦进入 GUI，你就可以更改目标路由器的 `SSID`、路由器密码和安全协议。通过这种方式，你将完全控制路由器并防止网络所有者连接到他自己的 ISP（ISP）！


    这种方法假设有太多的互联网用户在使用之前对互联网连接的安全不够小心。你会感到惊讶的，竟然有人懒得更改他们 Wi-Fi 的 `SSID`，这几乎暴露了它除了制造商使用的密码之外没有受到其他安全保护。


    ### 方法 2：破解互联网密码


    当黑客尝试破解的 Wi-Fi 受到保护时，他们会做什么？他们会做的下一件事是检查猜测目标网络密码有多大可能。此时，你需要学习在涉及识别和分配 Wi-Fi 连接安全性时的一些关键术语：


    1. `WEP` – 代表无线等效加密（Wired Equivalent Privacy）。这是互联网加密最基础的形式，因此对于大多数互联网用户来说，在为无线连接分配安全性时，这是一个不安全的选项。这种类型的加密可以使用最基础的黑客工具轻松破解。旧版本的
    Wi-Fi 模型仍在使用这种加密。

    2. `WPA` – 代表 Wi-Fi 保护访问（Wi-Fi Protected Access）。对于较新的计算机和路由器模型，这是一个更安全的选项，可以通过传统的试错法猜测组合来有效破解。如果使用了强密码，`WPA`
    连接几乎无法破解。这种安全协议的另一个变体是 `WPA-2`，它更难渗透。


    此时，你已经意识到大多数黑客会选择破解通过 `WEP` 协议保护的可用网络，因为它更快且更容易破解。以下是黑客破解受 `WEP` 保护的互联网连接所需的工具列表：


    1. 无线适配器 –你需要一个与 `CommView` 软件兼容无线适配器。该软件允许网卡进入监听模式。要查看你的网卡是否兼容 `CommView`，你可以访问
    `tamos.com` 查看你的适配器是否在列表中。

    2. `CommView` – `CommView for Wifi` 是一种用于从目标网络捕获包的软件。你只需要安装此软件，然后按照安装指南为你的网卡安装驱动程序。

    3. `Aircrack-ng GUI` – 这种软件允许你在完成数据包捕获后破解目标网络的密码。


    按照以下步骤开始破解 `WEP` 加密的网络：


    1. 运行 `CommView for Wifi` 根据通道扫描无线网络。让它运行几分钟。你将看到一个你的无线适配器可以到达的网络列表。

    2. 选择一个 `WEP` 网络（你会在网络名称旁边看到它）。选择一个分贝（dB）值最低且信号最强的网络。


