    ### 用户错误或不安全的设计

    另一种常用的传播恶意软件的方法是引导用户下载并安装受感染的文件。此类尝试可能包括带有恶意软件的硬件，如闪存驱动或 USB 设备。当这些硬件连接到计算机上时，受感染的文件就会自动执行，从而感染用户的系统。如果该受感染的系统位于网络环境中，恶意软件可能会跨网络传播并感染连接到该网络的其他系统。这对于传播恶意软件非常有效。


    ### 过时的杀毒软件

    过时或免费的杀毒软件无法提供付费版本所提供的相同安全级别。更新后的杀毒软件其数据库中将包含所有最新病毒的列表。旧版本的杀毒软件可以在一定程度上保护你，但不能完全保护。如果你的计算机遇到最新的病毒，它可能会将该病毒视为非恶意软件。


    ### 高权限代码和高权限用户

    在计算机科学领域，权限可以定义为修改系统时赋予的访问。权限被授予用户和程序。某些程序和用户获得的权限超过了他们应该拥有的权限。这种情况发生在设计不当的软件中。这是一个漏洞，恶意软件可以利用这一点。赋予更多权限可能导致两种问题，它们是：


    #### 高权限用户

    某些系统为用户提供的权限比他们应该拥有的多。这些用户可以修改或更改程序的代码。此类用户被称为高权限用户。


    #### 高权限代码

    某些系统为由用户执行的代码提供更多权限。搜索代码被称为高权限代码，它们拥有访问系统资源的权限。某些操作系统和脚本语言为代码提供了比需求更多的权限，使其成为一个漏洞。当这类代码被执行时，系统会将所有权限授予该代码，误认为是用户运行了它。


    ### 同质性

    如果一组系统运行在相同的操作系统并连接到同一个网络，我们可以称这些系统为同质系统。当存在同质性时，获取的恶意软件很容易传播到该网络中的所有系统。例如，如果单个系统上存在木马，它可以轻易地扩散到整个网络并感染该网络上的其他系统。同质性存在于软件公司、学校和学院等机构的系统中。大多数系统要么运行在
    Windows 操作系统上，要么运行在 Mac 操作系统上。通过专注于这些操作系统中的一种，黑客可以轻松利用运行在其上面的系统。解决此问题的办法是在计算机上使用不同的操作系统。通过这样做，黑客传播其恶意软件将变得非常困难。但这种做法也有自己的缺点。在初始阶段，维护和培训费用就属于缺点之一。


    ### 掩盖踪迹

    如果你计划成为一名优秀的伦理黑客，你不应该留下入侵的痕迹。留下证据只会增加你被发现的风险。你实际上可以使用恶意软件来清除你的入侵记录。使用恶意软件可以清除事件日志，提供干净的退出方式。有许多不同类型的恶意软件可用，利用它们你可以隐藏网络流量并清理目录。


    ### 代理服务器

    在穿过网络敏感区域时借助代理服务器是一个非常好的主意。如果你使用代理服务器，入侵检测软件无法检测到你的存在。这是因为代理服务器不会留下痕迹。


    在大多数情况下，木马通常是最佳选择，原因是它们能够长时间进行隐蔽监控。


    ### 犯罪软件

    犯罪软件可以定义为黑客用于黑客的软件或硬件工具。犯罪软件可以定义为具有以下特征的内容：


    * 不是无意导致犯罪。

    * 主要用于在线犯罪活动。

    * 通常不是一种理想的软件或硬件。


    在所有犯罪软件中，机器人（Bots）是使用最广泛的。下面简要描述了机器人。


    ### 机器人

    #### 到底什么是机器人（Bot）？

    “bot”一词是“robot”的缩写。这些机器人与电影中的机器人不同。它们不是公司从生产线上制造的机器人。机器人是人们面临的犯罪软件中最复杂的类型。它们在许多方面与蠕虫和木马相似。与其他恶意软件相比，机器人是独特的，它们的独特性在于它们能够执行极其广泛的自动化任务。它们代表攻击者执行这些自动化任务。攻击者将机器人放在互联网上某个安全的地方。机器人能够通过发送垃圾信息执行拒绝服务攻击。当计算机被机器人感染时，它就完全处于放置机器人的人的控制之下。这些被感染的机器被称为僵尸（zombies）。


    机器人可以通过多种方式感染计算机。在互联网上，它们通常搜索未受保护的计算机进行攻击。在找到具有漏洞的计算机后，它们会迅速溜入并向放置它们的人汇报。它们通常保持隐藏状态，什么都不做，直到主命令它们做某些事情。就像木马一样，它们在隐蔽中工作。大多数人在收到服务提供商关于其计算机向其他用户发送垃圾信息的通知之前，并没有意识到自己已成为机器人的受害者。它们有时甚至清理其停留的整个计算机，以确保自己不会被其他机器人取代并挤出计算机。它们与木马协同工作，木马帮助它们传播到互联网上的其他计算机。木马通过从受感染系统发送电子邮件来传播它们。


    机器人始终设计为与其他僵尸机器协同工作，它们不能独立工作。它们被设计为分组工作，这个小组被称为机器人网络（botnets）。通过使用上述任何一种技术，攻击者创建了机器人网络。他们通过反复用机器人感染计算机来实现这一点。


    # 第 8 章 快速扫描服务器和网络


    黑客工具是设计用于特定目的的软件程序，允许黑客未经授权地进入网络或系统。有很多黑客软件包你可以利用它们让工作变得简单，然后转向更棘手的技术。但如果你非常绝望并想要破解密码，最好是考虑使用黑客软件。


    不同类型的黑客工具如下：


    * 漏洞扫描器

    * 端口扫描器

    * Web 应用扫描器

    * 密码破解工具

    * 数据包嗅探器


    ## 漏洞扫描器


