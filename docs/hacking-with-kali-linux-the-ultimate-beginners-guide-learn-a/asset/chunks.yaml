    # Maltego


    Maltego 是另一个免费开源的平台，允许进行深度挖掘和信息收集，并提供你系统上威胁的概览。Maltego 是展示你的系统及其环境中故障点严重性和复杂性的最佳工具之一。它被用于分析公司、人员、域名、网站、DNS
    名称、文档、IP 地址等之间现实世界中的链接。Maltego 基于 `Java` 构建，具有用户友好的 GUI，并提供了大量的自定义选项。


    支持的平台包括 `Linux`、`Mac OS X` 和 `Windows`。


    # 社会工程工具包 (Social-Engineer Toolkit)


    如果你看过《机器人总动员你会你会这个由 `TrustedSec` 开发的工具。它是一个非常先进的工具，用于模拟多种社会工程攻击类型，例如钓鱼攻击、凭据收集等。该工具可以自动化每种攻击，并生成恶意网站、伪造电子邮件等方面内容。它基于
    `Python` 构建，是社会工程攻击渗透测试的行业标准工具。


    # Netsparker


    Netsparker 是最流行的 Web 扫描器之一，用于寻找本地文件包含和 `SQL injection` 等漏洞。它将提供你可以以安全且只读的方式采取补救措施。你不需要自己验证漏洞，因为
    Netsparker 会为你提供利用证明。如果它无法自动验证某个漏洞，你将收到警告消息。


    Netsparker 非常易于使用；你只需要输入想要扫描的 Web 应用程序的 `URL`，它就会为你完成。Netsparker 支持 `AJAX` 和基于
    `Java` 的应用程序，因此扫描时不需要任何复杂的配置。你可以获取免费的演示版本，也可以购买完整版。


    Netsparker 仅支持 `Windows` 系统。


    # w3af


    `w3af` 是开源免费的，另一个 Web 应用程序扫描器。它被渗透测试人员和黑客使用，其名称代表 Web 应用程序攻击与审计框架（Web Application
    Attack and Audit Framework）。`W3af` 允许你获取用于渗透测试的安全漏洞信息。它声称能够识别超过 200 种不同的漏洞，包括
    `SQL injection`、跨站脚本、PHP 配置错误、未处理的应用错误和易破解的凭据。它还声称可以让任何 Web 应用程序变得更安全。`W3af` 提供
    GUI 和命令行界面，且用户友好。


    支持的平台包括 `Mac OS X`、`BSD`、`Linux`，旧版本的工具支持 `Windows`。


    # 其他顶级攻击与安全工具


    ## Web 漏洞扫描器

    * `AppScan`

    * `Burp Suite`

    * `Firebug`

    * `Grendel-Scan`

    * `Nikto`

    * `OWASP Zed`

    * `Paros Proxy`


    ## 漏洞利用工具

    * `BeEF`

    * `Core Impact`

    * `Netsparker`

    * `Sqlmap`

    * `WebGoat`


    ## 取证分析工具

    * `Autopsy`

    * `EnCase`

    * `Helix3 Pro`


    ## 端口扫描器

    * `Angry IP Scanner`

    * `NetScanTools`

    * `Unicornscan`


    ## 流量监控工具

    * `Argus`

    * `Nagios`

    * `Ngrep`

    * `NtopSplunk`


    ## 调试器

    * `GDB`

    * `IDA Pro`

    * `Immunity Debugger`

    * `WinDbg`


    ## Rootkit 检测器

    * `DumpSec`

    * `HijackThis`

    * `Tripwire`


    ## 加密工具

    * `KeePass`

    * `OpenSSH/PuTTY/SSH`

    * `OpenSSL`

    * `Tor`


    ## 密码破解器

    * `Aircrack`

    * `Hydra`

    * `John the Ripper`


    # 防止自己被黑客的最佳实践


    黑客不是什么友好的人，至少其中一些不是。无论他们是单独行动、作为某个阴暗集团的一部分，还是为具有政治目的的人工作，他们都有权力和知识来访问你的系统和信息。黑客可以很容易在互联网上找到关于该公司的大量信息，然后利用学到的信息寻找弱点并进行利用。这使你托付给公司的任何数据处于非常真实的危险之中。


    将你在家里使用的计算机系统和互联网网络看作一家公司。它受保护吗？你可以做些什么来确保黑客无法进入？不要只坐在那里等攻击发生后再采取行动，现在就行动吧；反击黑客！


    以下是你保护系统免受黑客侵害的 10 种方法：


    ### 更新、更新、更新

    尽可能经常更新你的操作系统以及所有的应用程序和软件。每当发布更新时，请立即应用。这可以防止黑客通过未更新程序中的漏洞和缺陷进入你的电脑。如果你使用 `Windows`，请确保开启了自动更新。


    ### 使用最新的安全程序

    我说的是防病毒软件、反恶意软件工具、反间谍软件，当然还有你的 `firewall`。如果你使用 `Flash` 或 `Java` 等软件，请寻找替代方案，因为它们非常容易受到。


    ### 销毁个人信息

    这更多适用于出售或丢弃电脑或硬件。确保你的硬盘已被完全擦。如果你的信息非常关键且你正在丢弃设备，考虑使用电锯销毁硬盘。


    ### 永远不要使用开放 Wi-Fi

    使用开放 `Wi-Fi` 会让黑客更容易获取你的网络连接并从你的电脑下载数据。使用加密密码来保护你的 `Wi-Fi`，并考虑每几年更换一次路由器。某些路由器会产生可能永远无法的漏洞，而新的路由器提供了访客访问功能。


    ### 为所有设备设置密码

    这包括你的台式电脑、笔记本电脑、手机、平板电脑、智能手表等所有可以设置密码的设备。由于如今移动设备普及，它们比以往任何时候都脆弱。确保你的手机已锁定，且屏幕自动关闭时间尽可能短。如果可用，使用指纹锁或任何形式的生物识别安全。


    ### 确保你的密码难以猜到

    你所有的密码都应该是难以破解的，并定期更换。如果你真的觉得很难记住这么多密码，考虑使用密码管理器。如果可用，在可能的地方应用双重验证。


    ### 让你的安全问题答案更具创意


