- fmt: "\n3. Once you have chosen your target, right-click it to open a context menu.\
    \ Click on `Copy MAC Address`.\n\n4. Head over to the `Rules` tab on the menu\
    \ bar and select `MAC Addresses`. Tick on the `MAC Address` rules.\n\n5. For the\
    \ `Action` option, choose `CAPTURE`. Afterwards, head over to the `Add Record`\
    \ option and choose `BOTH`.\n\n6. Once you are done formatting the rules, paste\
    \ the mac addresses that you copied on your clipboard to the box that you would\
    \ find below it.\n\n7. When capturing packets, remember that you would only need\
    \ to capture the ones that you would be using for cracking. To make sure that\
    \ you only capture the packets that you need, select option `D` (which you would\
    \ find on the bar right above the window) and deselect `Management Packets` and\
    \ `Control Packets`.\n\n8. Make sure that you save the packets that you have captured\
    \ so that you can crack them for later. Go to the `Logging` tab on the menu bar\
    \ and enable `Auto Saving`. Afterwards, set the `Average Log File Size` to `20`\
    \ and the `Maximum Directory Size` to `2000`.\n\n9. Now, wait until you capture\
    \ enough data packets. Make sure that you wait until you have at least `100,000`\
    \ data packets so you can get a decent signal for cracking.\n\n10. After collecting\
    \ enough data packets, head over to the `Log` tab and select all the logs that\
    \ have been saved during capture. Head over to the folder where your saved logs\
    \ are stored. Click on `File`, and then `Export`, and select `Wireshark tcpdump\
    \ format` to save it as a `.cap` file. Choose any destination that you would easily\
    \ access later on. Do not close `CommView`.\n\n11. Now, you are ready to crack.\
    \ Run the `Aircrack-ng GUI` and choose the `WEP` option. You would be prompted\
    \ to open the `.cap` file that you have exported a while ago. Once you retrieve\
    \ that file, select `Launch`.\n\n12. Once your `Aircrack-ng GUI` is running and\
    \ decrypting the data packets that you had on your log, open the command prompt.\
    \ Type in the index number of the network that you have selected a while ago.\n\
    \n13. Wait until the wireless key appears.\n\nIf everything goes well, you would\
    \ easily get the wireless key of your targeted network. If you missed some packets,\
    \ you would be prompted by `Aircrack-ng` that you need to capture more of them.\
    \ If that happens, you just need to wait for `CommView` to get the additional\
    \ packets that you need.\n\n## Can Tougher Security Measures be Breached?\n\n\
    At this point, you would realize that it is fairly easy for most hackers to gain\
    \ access to the type of Internet security that you are using. At the same time,\
    \ you should also have the idea that once criminal hackers know what type of encryption\
    \ you are using, the easier it is for them to identify the tools that they should\
    \ use for hacking your network.\n\nIs it possible for hackers to breach more advanced\
    \ protocols such as `WPA` and `WPA2`? Yes, they could accomplish such a feat,\
    \ but it would take them more time – making the process inefficient, especially\
    \ given that their goal for hacking network connections is to enjoy better bandwidth\
    \ and have immediate internet access, or even to mask their location. For this\
    \ reason, it would be best to enable `WPA` (or other better encryption options)\
    \ should your devices allow it.\n\nNow that you have a general idea on how hackers\
    \ can steal your Wi-Fi, it is time to take some preventive measures. The next\
    \ chapter will tell you more about that.\n\n# Chapter 6. Cybersecurity essentials\n\
    \nCyberterrorism can be conducted in order to reach some kind of personal objective\
    \ through the use of computer networks and the internet with some experienced\
    \ cyberterrorists being able to cause mass damage towards government systems,\
    \ hospital records as well as national military and security programs that leave\
    \ a country in a state of turmoil, terrified of further attacks. The objective\
    \ for many cyberterrorists is often related to political or ideological agendas.\
    \ \n\nCyberterrorism can be challenging to prevent or protect systems from as\
    \ it can be largely anonymous with unknown motivations and uncertainty over whether\
    \ there could be repeated attacks again in the future. There is some argument\
    \ over the exact definitions of cyber terrorism or whether it should be referred\
    \ to as terrorism at all since the actions are not closely linked with conventional\
    \ methods of terrorism and instead are towards information warfare, however since\
    \ many of the motives are political in nature and targeted towards the disruption\
    \ of infrastructure, the term loosely fits into the category of terrorism. \n\n\
    Cyberterrorism can be committed by individuals, groups and organizations and in\
    \ some cases by nation states attacking rival governments. Cyberterrorism is currently\
    \ a major concern for both government and media sources due to the potential damages\
    \ with government agencies such as the Federal Bureau of Investigations (`FBI`)\
    \ and the Central Intelligence Agency establish targeted strike forces to reduce\
    \ the damage caused by cyber terrorism. \n\nCyberterrorism can be accomplished\
    \ through a variety of techniques such as a network penetration and viruses that\
    \ are created in order to disrupt and immobilize the system. Cyberterrorism is\
    \ more dangerous than simple cybercrime for personal gain. Cyberterrorism can\
