    MaxMind also allow people to sign up for a developer’s version of the database,
    but do not give you the software or the tools needed to read it. As such, it is
    free but is not as accurate as the full-on commercial version. To find the location
    of any IP address using this free version, you need to have a tool or program
    that can read the data.


    Two developers, T Williams and Jennifer Ennis, have come up with a Python script
    called `pygeoip`. It has been released under a GPL license that lets you put an
    IP address in and returns the information on its physical location.


    # Chapter 13. Legal and ethical precautions to take care


    Implement strategic plans to counter cyber terrorist efforts will ensure that
    your organization has the means to combat any threats it may face. There are a
    number of strategies which a business can employ or in order to stay ahead and
    heighten their security capabilities in the face of a threat. These are:


    ## Prosecuting Perpetrators


    Many attacks can behind the wall of anonymity with many smaller organizations
    failing to pursue and prosecute the hackers responsible. While this can be a costly
    activity, there are some advantages in identifying and taking the attackers to
    court. This can be a shock to the cyber terrorist community and set the standard
    for which other organizations should conduct themselves in the wake of an attack.
    If the case is particularly high profile, the organization can benefit from the
    hard-line response with the prosecuted hackers being an example to the rest of
    the criminal organizations that are determined to wreak havoc on your business.
    This example set can send waves throughout the rest of the community and can lead
    to improvements in the investigation and prosecution process of criminal cyber
    terrorists. Therefore, is always in the best interest of the parties that have
    been affected by an attack to seek justice.


    ## Develop New Security Practices


    As an organization faces an attack, they will follow through in revaluating their
    security and any potential loopholes that could be exploited. This involves further
    testing such as the pen-testing we explored earlier as a means of finding weaknesses
    and vulnerabilities and employing new security means to combat these. These activities
    require cooperation and coordinated efforts amongst all departments within an
    organization to ensure maximum effectiveness. Corporations should review international
    standard guidelines for security information to detail the steps that should be
    taken in order to secure organizations in terms of information security. As organizations
    further develop their security capabilities, they are able to adapt and modify
    the standard guidelines to comply with their own operations and needs to achieve
    the best results.


    ## Take a Proactive Approach


    It is important for both corporations and the general public to take a proactive
    approach as the threat from cyber terrorism becomes more sophisticated and targeted.
    This involves keeping up to date with the latest information within the cyber
    security sphere such as threats, vulnerabilities and noteworthy incidents as they
    will allow security professionals to gain a deeper insight into how these components
    could affect their organizations. From there they are able to develop and implement
    stronger security measures thereby reducing the opportunities for hackers to exploit
    for cyber-attacks.


    Organizations should constantly be on the forefront of cyber security having a
    multi-level security infrastructure in order to protect valuable data and user’s
    private information. All activities that are critical in nature should have security
    audits frequently to ensure all policies and procedures relating to security are
    adhered to. Security should be treated as an ongoing and continuous process rather
    than an aftermath of the consequences of an attack.


    ## Deploy Vital Security Applications


    There are many tools available for security professionals to protect their networks
    and they can provide a significant benefit to the job at hand. These applications
    involve firewalls, `IDS`, as well as anti-virus software that can ensure better
    protections against potential hackers. Using these security systems, security
    personnel are able to record, monitor and report any suspicious activities that
    can indicate the system is at risk. The applications are able to streamline the
    process, making the job far more efficient and effective. Utilizing these types
    of tools ensures that security personnel are assisted with the latest in prevention
    technology and have a greater probability of combating attackers.


    ## Establish Business Disaster Recovery Plans


    In the event that an attack does occur, all businesses should have a worst-case
    scenario contingency plan in place to ensure that processes and operations are
    brought back to normally as soon as possible. Without such plans, the consequences
    can be disastrous leading to a loss in revenue and reputation on behalf of the
    business. Once these plans have been devised, they should be rehearsed regularly
    in order to test their effectiveness and also provide staff with training in the
    event of an attack.


    These plans should be comprised of two main components, these being, repair and
    restoration. From the perspective of repair, the attacking force should be neutralised
    as soon as possible with the objective to return operations to normalcy and have
    all functions up and running. The restoration element is geared towards having
    pre-specified arrangements with hardware, software as well as a network comprised
    of service vendors, emergency services and public utilities on hand to assist
    in the restoration process.


    ## Cooperation with Other Firms


    Your organization would not be alone in dealing with the aftermath of a cyber-attack.
    Many organizations exist in order to deal with cyber terrorism threats both public
    and private. These groups can go a long way in helping with issues relating to
    cyber terrorism such as improving the security within your organization, helping
    devise and implement disaster recovery plans and further discuss how you can deal
    with threats in the future and what this means for the wider community. Having
    this extended network available to you will enhance your efforts in resisting
    cyber-attacks as well as having a role in discussing other emerging threats and
    protecting organizations facing these same threats.


    ## Increasing Security Awareness


    Security threats are prevalent and this requires an increase in awareness with
    all issues relating to cyber security. Having your organization become an authority
    in raising awareness within the community will help educate other organizations
    in how they can defend themselves against attacks and strengthen their own security
    which in turn will damage the cyberterrorist community as they face a stronger
    resistance. You can also raise awareness within your own organization through
    security training programs which will help all employees equip themselves with
    the right skillset to combat threats that could arise through their own negligence
    and will also help them be more alert in times when threats could be present.


    # Conclusion


    With this, we have now come to the end of this book. In the world of computer
    networking, security is given very high importance so as to protect data and safeguard
    the system from intruders. In spite of strict security guidelines and authentication
    schemes, hackers have managed to break into several systems skillfully, piquing
    the interest of common folk.


    Some hackers were able to develop groundbreaking utilities and websites like Facebook
    and Netflix (the founders of these websites are self-proclaimed hackers), so it
    is not surprising to see so many young people wanting to learn hacking. Before
    venturing into the depths of hacking, one needs to have clear-cut ideas about
    the basics of hacking. That is exactly what this book is intended for.

