    Kali Linux 专门为“白帽”以及渗透测试和安全测试而设计，此外还有白帽黑客通常从事的其他活动。为了满足这些专业化需求，Kali Linux 发行版经过修改以满足这些要求，特别是以下这些核心变化：


    - **单用户 root 权限访问**：Kali Linux 首先是一个以安全审计和渗透测试为中心的 Linux 发行版，它经过了调整，以反映该特定配置的需求。单用户设置是为了安全考虑，这允许用户持续地拥有
    root 权限。通常做法是仅在需要时给予 root 权限，但由于渗透测试和安全审计工具需要提升的用户权限，渗透测试本质要求 Kali Linux 拥有 root
    权限。如果 Kali Linux 遵循标准的仅在需要时提供 root 权限的模式，对用户来说将非常不便且是一种负担，因此有了这一特定的设计选择。

    - **禁用网络服务**：出于安全考虑，Kali Linux 默认禁用了网络和服务和功能，并带有系统钩子确保网络服务被禁用，同时允许根据需要安装服务。网络服务并非唯一为了安全目的而禁用的服务，甚至像蓝牙等其他连接选项默认也是禁用的，但根据用户的需求和偏好，可以按开启网络服务。

    - **自定义 Linux 内核**：Kali Linux 发行版的内核是针对无线注入专门补丁的上游内核，这允许内核在网络连接上发送信息包，同时使其看起来像是正常通信和信息流的一部分，许多黑客活动的关键组件。这使得安全测试人员和“白帽”能够恰当地复制获取未经授权访问和利用漏洞的常见途径。

    - **受信任且精选的仓库**：鉴于作为一个专注于安全的 Linux 发行版的本质，开发者的主要优先事项之一是保持 Kali Linux 的安全和可用性，因为发行版的漏洞或可用的利用程序将违背
    Kali Linux 的目的。因此，开发者知道系统完整性至关重要，他们审核并验证 Kali Linux 使用的每一个游软件源，确保只保留极其必要的源以最大限度地降低风险。注意，许多
    Kali Linux 用户经常会被想要扩展他们的 `sources.list` 资源，但请注意，这样做极有可能破坏 Kali Linux 的安装。


    # 第 1 章 黑客的类型


    当今社会中的所有工作都有不同的形式。你可能是蓝领、白领、无领……随你怎么如何。黑客也无二致。就像不同颜色的领口对应不同的工作一样，黑客领域也是如此。


    黑客被分为许多不同的类别：黑帽、白帽、灰帽、新手（Newbies）、黑客行动主义者（Hacktivists）、精英（Elite）等。现在，为了帮助你更好地理解灰帽黑客，让我们先看看其他这些类型的黑客，这样你就可以感受一下黑客在在线时在做什么，或者可以做什么。


    ## 新手


    任何事情的起点都是从开始，这就是为什么我们从新手黑客开始。很多新手黑客的问题在于，他们认为自己已经搞懂了一切，但实际上并非如此。涉及到这一切时，黑客的理念仅仅触及了皮毛，对于想要入行的人来说，看到真正需要学习的内容时感到不知所措一点并不罕见。


    然而，不要让这让你气馁，你能够学会这一切，这只是需要你付出时间和精力。借书并上网。查找需要学习的内容并记住它们。不要急于自己。你需要学习，并且真正学习。你任何没有记住的东西以后都可能让你付出代价。


    在真实的黑客世界中，会有即时的反应，坐在那里试图查找你本应该已经知道的内容不会让你作为一个黑客走得多远。如果你想在你的所做的事情上精通，那就花时间去精通。


    如果你不认为自己真的想学，就不要浪费时间，因为要进入问题核心需要大量的专注。不要误会我的意思，这是完全值得的，但如果你只是出于好奇在研究，除非了解这些对你来说真的意义重大，否则不要这样做。


    当然，确实有些人大致知道自己在做什么，或者他们可以进入朋友的邮箱账户，但那不是我在这里所指的黑客。我希望你成为一个真实的、有能力的黑客，除非你愿意花所需的时间学习并付出努力，否则这不会发生。


    你必须记住，任何存在的黑客都必须从新手黑客开始，并从那里建立技能。现在，他们建立这些技能的快慢很大取决于他们投入了多少时间和精力，但别担心，你会掌握窍门的，虽然你必须从新手开始，但你很快就会获得灰帽身份。


    ## 精英


    与新手黑客一样，精英黑客可以是任何种黑客，无论好坏。使他们成为精英的事实是他们擅长自己所做的事情，并且他们清楚这一点。网上对精英黑客有很高的尊重。就像任何精英领域一样，他们知道自己在做什么，并且知道除非别人也知道如何处理好自己，否则无法挑战他们。


    这种身份伴随着程度的傲慢，但这是实至名归的。任何人都可以步于第二，但要达到顶峰需要真正的奉献。精英黑客可以使用他们的力量行善，也可以行恶，但无论如何，他们都是一股不可小敌的力量。他们了解系统是如何工作的，如何绕过它们，以及如何让它们按照他们的意愿运行。


    如果你有一个成为精英黑客的目标，你确实有很多硬仗要做，但别担心，你会到达那里的。获得这种顶级地位只需要时间和精力，而且它属于那些渴望它的人。没有人能获得精英地位，这是他们必须努力才能得到的，但绝对值得投入其中所有的时间和精力。作为一名精英黑客，你不必担心遇到的任何系统，你将知道会发生什么，以及你可以如何绕过它，这只是这份工作的常态。


    ## 黑客行动主义者


    黑客行动主义黑客利用他们的技能来推动社会或政治议程。有时他们会被特定团体雇佣进入在线场所并收集信息，有时他们完全独立工作。这种黑客行为的目的是让一个政党看起来很糟糕，让黑客支持的政党看起来很好。然后，他们要么在网上其他地方发布，要么将其传递出去让其他人看到那个人做了什么或被指控做了什么。这是政客之间互相针刺的一种，这并不是真正的公平游戏。黑客随后将获得雇佣他们的政党的报酬，或者如果他们独立工作，他们就能看到他们对政客发布内容的结果。


    黑客及其所做的事情是一个永无止境的列表，但他们最终都可能归为三类：黑帽、白帽和灰帽。无论他们基础上是哪种黑客，这三个领域实际上涵盖了全部。

