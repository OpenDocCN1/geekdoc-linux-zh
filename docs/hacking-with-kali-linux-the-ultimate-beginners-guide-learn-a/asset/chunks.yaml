    \n# Chapter 10. Basics of Firewall\n\nToday, a network design is incomplete without\
    \ firewalls. This is a networking device that can either be a software- or hardware-based.\
    \ A firewall can control access to a network. The objective of the controlled\
    \ access is to ensure resource and data protection from external intruders. To\
    \ control the access, firewalls will be installed at the exit/entry points of\
    \ a network. For instance, a firewall may be placed between the Internet and an\
    \ internal network. When put in place, it can control the flow of traffic to the\
    \ network at the point.\n\nAlthough they are used for protecting internal networks\
    \ from public ones, they can also control access between segments within a specific\
    \ network. For instance, a firewall may be placed between the Sales Department\
