    tools and, of course, your firewall if you use one other than what was provided
    by your operating system. If you wanted to trick even the very worst of hackers,
    invest in anti-exploit technology, like Malwarebytes Anti-Exploit – this will
    stop any attack before it can happen


    Destroy Personal Information


    This is more so if you are selling or throwing away your computer or hardware
    device. Make sure your hard drive is completely erased because, if a person is
    looking to find information on an old device, this will make it so much harder
    to do. If your information is very critical and you are discarding the device,
    consider using a chainsaw to destroy the hard drive. It might seem drastic but
    that is the best way to stop your information from being found.


    Never Use Open Wi-Fi


    Using open Wi-Fi makes it easier for hackers to steal your network connection
    and download data from your computer. Use an encrypted password to protect your
    Wi-Fi connection and think about buying a new router every couple of years. Some
    routers do develop vulnerabilities that may never be patched up and newer ones
    provide the ability for you to give guest users segregated access, without having
    to hand over your password. Also, change your password on a frequent basis.


    Password Protect All Your Devices


    This includes your desktop computer, laptop, smartphone, tablet, smartwatch, everything
    that can take a password. Because mobile devices are so highly used these days,
    they are more vulnerable than ever before. Make sure your phone is locked and
    the screen timeout is as short as possible. If available on your device, use fingerprint
    locking or any other form of biometric security that may be available. Don’t forget;
    for many people, a phone or a tablet is a tiny computer that contains an awful
    lot of data, a real haul of personal information for any hacker and, should anyone
    be able to access it, it can use you a lot of heartaches. The same goes for your
    laptop or desktop; never leave it open and unattended. If you have to leave it,
    make sure it is, at least, locked and on the password screen.


    Make Sure Your Passwords are Difficult to Guess


    All of your passwords should be difficult ones to crack and should be changed
    regularly. If you really do find it hard to remember so many passwords, consider
    using a password manager – that way you only have to remember the one password. 
    If available, apply two-step verification where possible. Most devices, applications
    and other software provide this option now. For those who don’t know what it is,
    it is an extra layer of protection that makes accessing data more difficult.


    Make Your Security Question Answers Creative'
