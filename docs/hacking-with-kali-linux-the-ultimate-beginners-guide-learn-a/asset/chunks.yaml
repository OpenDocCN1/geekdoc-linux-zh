  raw: '3.  Once you have chosen your target, right-click it to open a context menu.
    Click on Copy MAC Address.


    4.  Head over to the Rules tab on the menu bar and select MAC Addresses. Tick
    on the MAC Address rules.


    5.  For the Action option, choose CAPTURE. Afterwards, head over to the Add Record
    option and choose BOTH.


    6.  Once you are done formatting the rules, paste the mac addresses that you copied
    on your clipboard to the box that you would find below it.


    7.  When capturing packets, remember that you would only need to capture the ones
    that you would be using for cracking. To make sure that you only capture the packets
    that you need, select option D (which you would find on the bar right above the
    window) and deselect Management Packets and Control Packets.


    8.  Make sure that you save the packets that you have captured so that you can
    crack them for later. Go to the Logging tab on the menu bar and enable Auto Saving.
    Afterwards, set the Average Log File Size to 20 and the Maximum Directory Size
    to 2000.


    9.  Now, wait until you capture enough data packets. Make sure that you wait until
    you have at least 100,000 data packets so you can get a decent signal for cracking.


    10.  After collecting enough data packets, head over to the Log tab and select
    all the logs that have been saved during capture. Head over to the folder where
    your saved logs are stored. Click on File, and then Export, and select Wireshark
    tcpdump format to save it as a .cap file. Choose any destination that you would
    easily access later on. Do not close CommView.


    11.  Now, you are ready to crack. Run the Aircrack-ng GUI and choose the WEP option.
    You would be prompted to open the .cap file that you have exported a while ago.
    Once you retrieve that file, select Launch.


    12.  Once your Aircrack-ng GUI is running and decrypting the data packets that
    you had on your log, open the command prompt. Type in the index number of the
    network that you have selected a while ago.


    13.  Wait until the wireless key appears.


    If everything goes well, you would easily get the wireless key of your targeted
    network. If you missed some packets, you would be prompted by Aircrack-ng that
    you need to capture more of them. If that happens, you just need to wait for CommView
    to get the additional packets that you need.


    Can Tougher Security Measures be Breached?


    At this point, you would realize that it is fairly easy for most hackers to gain
    access to the type of Internet security that you are using. At the same time,
    you should also have the idea that once criminal hackers know what type of encryption
    you are using, the easier it is for them to identify the tools that they should
    use for hacking your network.


    Is it possible for hackers to breach more advanced protocols such as WPA and WPA2?
    Yes, they could accomplish such a feat, but it would take them more time – making
    the process inefficient, especially given that their goal for hacking network
    connections is to enjoy better bandwidth and have immediate internet access, or
    even to mask their location. For this reason, it would be best to enable WPA (or
    other better encryption options) should your devices allow it.


    Now that you have a general idea on how hackers can steal your Wi-Fi, it is time
    to take some preventive measures. The next chapter will tell you more about that.


    # Chapter 6\. Cybersecurity essentials


    Cyberterrorism can be conducted in order to reach some kind of personal objective
    through the use of computer networks and the internet with some experienced cyberterrorists
    being able to cause mass damage towards government systems, hospital records as
    well as national military and security programs that leave a country in a state
    of turmoil, terrified of further attacks. The objective for many cyberterrorists
    is often related to political or ideological agendas. 


    Cyberterrorism can be challenging to prevent or protect systems from as it can
    be largely anonymous with unknown motivations and uncertainty over whether there
    could be repeated attacks again in the future. There is some argument over the
    exact definitions of cyber terrorism or whether it should be referred to as terrorism
    at all since the actions are not closely linked with conventional methods of terrorism
    and instead are towards information warfare, however since many of the motives
    are political in nature and targeted towards the disruption of infrastructure,
    the term loosely fits into the category of terrorism. 


    Cyberterrorism can be committed by individuals, groups and organizations and in
    some cases by nation states attacking rival governments. Cyberterrorism is currently
    a major concern for both government and media sources due to the potential damages
    with government agencies such as the Federal Bureau of Investigations (FBI) and
    the Central Intelligence Agency establish targeted strike forces to reduce the
    damage caused by cyber terrorism. 


    Cyberterrorism can be accomplished through a variety of techniques such as a network
    penetration and viruses that are created in order to disrupt and immobilize the
    system. Cyberterrorism is more dangerous than simple cybercrime for personal gain.
    Cyberterrorism can have serious consequences on the country and institutions that
    are attacked, placing lives at risk. As our technology improves, there are a number
    of ways to combat cyberterrorism by first anticipating and preparing for attacks
    and to implement a plan for prevention, following this we prepare for incident
    management to mitigate an attack limit the damage caused in the case that an attack
    has reached the target. Once an attack has occurred, the next stage of defence
    is to implement consequence management which is assessing the damage and taking
    note of how we are able to improve defences in the future, starting the process
    over once again. 


    Traits of Cyber Terrorism


    After understanding the definition of cyber terrorism, many cyber terrorists have
    found to have very similar traits in common which can place them in the category
    of cyber terrorists. One such trait is that the victims of cyber terrorist attacks
    are specifically targeted rather than random in the case of hackers without clear
    objectives other than financial gain or entertainment. While there can be randomised
    cases of hackers releasing viruses or worms into the general public, there are
    often clear objectives for doing so with the victims being a specific group or
    nation that has been targeted for predetermined reasons by the hacker. Other objectives
    involve attacking an organization, industry, sector or economy for the purpose
    of inflicting damage or destroying their target. 


    Finally, another common trait within cyber terrorism is to further the terrorist
    group''s own goals which could be financial, political, religious or ideological.
    These terrorists seek to achieve this goal by inflicting heavy damages on their
    target and make their own objectives obvious by publicising them. 


    Types of Cyber Terrorism Attack


    Cyberterrorism has been placed within three main categories by the Centre for
    the Study of Terrorism and Irregular Warfare at the Naval Postgraduate school
    in Monterey, California. These categories are simple-unstructured, advanced-structured
    and complex-coordinated. 


    Simple-Unstructured - These are small-scale attacks and are generally performed
    by inexperienced hackers using widely available tools created by other people.
    The hackers behind these kinds of attacks generally lack command and control skills
    as well as possessing a limited learning capability. 


    Advanced-Structured - These types of attacks are more sophisticated and can target
    multiple systems or networks and the hackers responsible possess the capability
    to modify or even create basic hacking tools. While the hackers possess limited
    command and control skills, they have an increase learning capability and present
    a significant risk depending on the organization they are targeting. '
