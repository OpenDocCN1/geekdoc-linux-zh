    ### User error or insecure design

    Another method that is commonly used for spreading malware is by taking the users
    to install download an infected file. Such attempts May include hardware like
    flash drives or USB devices, infected with malware. When this hardware is attached
    to the computer, the infected files automatically execute themselves, infecting
    the system of the user. If this infected system is on a network of systems, the
    malware might possibly spread across the network and infect other systems connected
    to it. This is very effective for spreading malwares.


    ### Outdated Antivirus

    Outdated or free antiviruses cannot provide the same level of security that the
    purchased versions provide. An updated antivirus will have the list of all the
    latest viruses in its database. The older version of antivirus may protect you
    too an extent but not completely. If your computer encounters a latest virus,
    it might view that virus as non-malicious software.


    ### Over Privileged code and over privileged users

    In the area of computer science, religion can be defined as the access given for
    modifying the system. Privileges are given to users and programs. Some programs
    and users are given more privilege than the privileges they should have. This
    happens with poorly designed software. This is the vulnerability and a malware
    can take advantage of it. There are two types of problems possible by giving more
    privileges. They are:


    #### Over Privileged users

    Some systems provide their users with what privileges than they should be having.
    These users can modify or change the code of a program. Such users are called
    over privileged users.


    #### Over Privileged code

    Some systems provide more privilege to be called executed by the user. Search
    code is called over privileged code and they have permissions to access the system
    resources. There are a few operating systems and scripting languages giving more
    than required privileges to the code, making it vulnerability. When this kind
    of code is executed, the system will give all the permissions to code, thinking
    that the user ran it.


    ### Homogeneity

    We can call a set of systems as homogeneous systems if they''re running on the
    same OS and connected to the same network. When homogeneity is present, are given
    malware can spread itself easily to all the systems in that network. For instance,
    if there is a Trojan horse on a single system, it can easily spread itself across
    the network and infect other systems on that network. Homogeneity can be found
    on systems present in organizations like software organizations, schools and colleges.
    Most of the systems either run on the Windows operating system or the Mac operating
    system. By concentrating on any of these operating systems, a hacker can easily
    exploit the systems running on them. A solution for this is to use different operating
    systems on the computers. By doing this, a hacker will have a hard time spreading
    his malware. Following this has its own disadvantages. In the initial stages,
    maintenance and training expenses are included in the disadvantages.


    ### Cover your tracks

    If you plan on becoming a good ethical hacker, you should not leave the traces
    of intrusion behind. By leaving evidence, you''re only risking your chances of
    getting caught. You can actually use malware for clearing your records of intrusion.
    Event logs can be cleared in using malware, providing a clean exit. There are
    many different types of malware available, using which you can hide your network
    traffic and clean the directories.


    ### Proxy Server

    Taking the help of a proxy server when tunneling through a network’s sensitive
    areas is a really good idea. Intrusion detection software cannot detect your presence
    if you are using a proxy server. This is because proxy servers leave no trace
    behind.


    For most of the cases, Trojans are usually the best and the reason for this is
    their ability to monitor in stealth for extended periods of time.


    ### Crimeware

    Crimeware can be defined as the software or hardware tools that hackers use for
    hacking. Crimeware can be defined as something that is:


    * Not enabling the crime involuntarily.

    * Mostly used for online criminal activities.

    * Not a desirable software or hardware, in general.


    Out of all the Crimeware, bots are the most widely used ones. Bots are described
    below in brief.


    ### Bots

    #### What exactly is a Bot?

    The term ‘bot’ is the short form for the word robot. These robots are different
    from the ones shown in movies. They aren''t the robots that companies manufacture
    from production line. Bots are most sophisticated of the Crimeware that people
    are facing today. They are similar to worms and Trojan horses in many ways. Bots
    are unique when compared to other malicious software and their uniqueness is because
    of the wide range of automated tasks that they are capable of performing. They
    perform these automated tasks on the half of the attacker. Attackers place bots
    from someplace safe on the Internet. Bots are capable of performing the denial
    of service attack by sending spam messages. When the computer is infected by a
    bot, it completely falls under the control of the person who placed the bot. These
    infected machines are called zombies.


    Bots can infect a computer in many ways. On the Internet, they usually search
    for unprotected computers for attacking. After finding a computer with vulnerability,
    they quickly sneak into it and reports back to the person who placed it. They
    usually stay hidden, doing nothing, until they are commanded to do something by
    their master. Just like Trojan horses, these work in stealth. Most of the people
    do not realize that they have fallen victims to bots until they get notified by
    their service provider about the spam messages from their computers to other users.
    They sometimes even clean the whole computer on which they are staying, for making
    sure that they don''t get replaced by other bots and get bumped off the computer.
    They work along with Trojan horses, which help them to spread to other computers
    on the Internet. Trojan horses spread them by sending emails from the infected
    system.


    Bots are always designed to work together with other zombie machines, and they
    can''t work alone. Then designed to work in groups and this group are called botnets.
    By using any of the mentioned techniques, attackers create botnets. They do it
    by repeatedly infecting computers with bots.


    # Chapter 8\. Quickly scanning the servers and the network


    Hacking tools are software programs that are designed with one specific purpose,
    to allow hackers to gain unauthorized admission to a network or system. There
    are many hacking software packages that you can make use to make the job simpler
    and then move on to tougher techniques. But if you are really desperate and wish
    to crack a password, it is best that you consider using hacking software.


    The different types of hacking tools are as follows:


    * Vulnerability scanners

    * Port scanners

    * Web application scanners

    * Password cracking tools

    * Packet sniffers


