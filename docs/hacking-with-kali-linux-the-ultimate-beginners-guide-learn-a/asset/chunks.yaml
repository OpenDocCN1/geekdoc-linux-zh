    \ and `PDAs` (Personal Digital Assistants).\n- The kind of antennae to implement\
    \ and where to locate them.\n- Knowing the exact type of devices that are allowed\
    \ on your network and also those that are not.\n- Adjusting signal-power settings\
    \ which will prevent your radio frequency signal from leaking outside your residence.\n\
    \nAll of these wireless network complexities add up to a multitude of security\
    \ weaknesses that are not available in the old traditional wired networks.\n"
