  trans: "\n\n# Android\nAndroid 由 Google 开发，作为一个开源移动平台提供。大多数为移动设备编写的恶意软件针对 Android\
    \ 的，因为有更多的途径可以攻击它。Android 操作系统允许用户从第三方应用商店以及官方的 Google Play 商店添加软件。恶意应用可能来自这两个任一来源，因为\
    \ Google 对其应用的审核过程并不像其他那样严格。Android 手机上的软件容易受到逆向工程攻击，这增加了该平台固有的危险。此外，许多 Android\
    \ 手机未经过加密，使得恶意软件攻击更容易实施。广告软件是 Android 设备上流行的恶意软件。\n\n[AndroidVulnerabilities.org](http://AndroidVulnerabilities.org)\
    \ 列出了若干种属于内核、网络、签名和系统漏洞的利用程序。\n\n# Apple\nApple 开发了三个移动平台 `iOS`、`tvOS` 和 `watchOS`。它们是\
    \ iPhone、iPad、Apple TV 和 Apple Watch 的操作系统。由于安全级别较高，且 App Store 受到严格监控，恶意应用很难在\
    \ App Store 上停留，因此 Apple 产品上的恶意软件攻击较少。Apple 移动操作系统不支持静短信，这使得恶意软件的传播变得更加困难。\n\n\
    # Web 服务器\nWeb 服务器是存储网络服务信息的计算机、硬件和软件，并通过局域网（LAN）或互联网提供这些信息。Web 服务器存储大量敏感数据，如社会安全号、信用卡号、电子邮件地址和密码。Web\
    \ 服务器遭受的著名攻击案例是 2017 年的 Equifax 黑客事件。该事件暴露了数百万人的个人数据，包括受害者的信用信息。攻击 Web 服务器是一种复杂的攻击。\n\
    \nWeb 服务器有多种漏洞。这些漏洞包括使用默认设置、Web 服务器配置错误、利用漏洞或仅仅缺乏安全防护。Web 服务器的类型有：\n\n*   `Apache`：`Apache`\
    \ 服务器是最常用的。`Apache` 通常运行在 Linux 上。\n*   `Internet Information Services (IIS)`：`IIS`\
    \ 是适用于 Windows 的 Web 服务器。它是仅于 `Apache` 的第二常用服务器。\n*   `Other`：市场上还有其他 Web 服务器，包括\
    \ Novell 的 Web 服务器和 Mac OS X 服务器。\n\n## 攻击类型\n黑客可以使用几种类型的攻击来破解 Web 服务器。这些攻击类型包括目录遍历攻击、DoS\
    \ 和 dS 攻击、域名系统攻击、嗅探、钓鱼、钓鱼网站攻击（Pharming）和网页篡改（Defacement）。域名系统攻击是指攻击者更改域名系统（`DNS`）设置，使得\
    \ Web 服务器的互联网流量被发送到黑客的 Web 服务器。钓鱼网站攻击是指攻击者更改用户计算机上的 `DNS` 设置。网页篡改攻击是指攻击者将网站网页替换为另一个，其中包括黑客的名字和黑客选择发布的任何媒体内容。网页篡改通常是为了建立黑客的声誉。\n\
    \n# 保持系统安全的工具\n当你刚开始时，如果得到一些帮助会容易得多，以下是你可以使用的一些最佳软件和硬件元素：\n\n### Metploit\n`Metploit`\
    \ 是你可以使用的最好的软件和硬件元素之一。它是开源且免费的。`Metploit` 允许你发现漏洞。`Metploit` 是一个渗透测试框架，被许多专业人士使用。`Metploit`\
    \ 允许你模拟攻击并发现漏洞。`Metploit` 适用于所有平台，包括 Linux、Windows 和 macOS。 \n\n### Acunetix\n\
    `Acunetix` 是一个漏洞扫描器，是最好的工具之一`Acunetix` 用于发现 Web 应用程序中的漏洞。`Acunetix` 是一个快速工具，用于发现\
    \ SQL 注入和其他漏洞。`Acunetix` 适用于所有平台，包括 Linux、Windows 和 macOS。\n\n### Nmap\n`Nmap`\
    \ 是 `Network Mapper` 的缩写。它是一个端口扫描器，是最流行的工具之一。`Nmap` 用于网络发现和安全审计。`Nmap` 允许你发现服务。`Nmap`\
    \ 适用于所有平台，包括 Linux、Windows 和 macOS。\n\n### Wireshark\n`Wireshark` 是史以来最著名的数据包工具之一。它是开源且免费的。`Wireshark`\
    \ 用于捕获和分析流量。`Wireshark` 让你读取来自以下协议的实时数据：\n*   802.11\n*   ATM\n*   Bluetooth\n\
    *   Ethernet\n*   FDDI\n*   Frame Relay\n*   IEEE\n*   PPP/HDLC\n*   Token Ring\n\
    *   USB\n\n### oclHashcat\n如果你对密码破解感兴趣，`Hashcat` 就是你需要的免费工具。它是基于 CPU 的，而 `oclHashcat`\
    \ 是该工具更高级的版本，利用了你的 GPU 性能。`oclHashcat` 因世界上最快的密码破解工具之一而闻名，它是世界上第一个拥有基于 GPGPU 引擎的工具。\n\
    \n### Nessus\n`Nessus` 是最好的漏洞扫描器之一，它采用客户端-服务器框架工作。它由 Tenable Network Security\
    \ 开发，是同类中最流行的工具。`Nessus` 用于发现漏洞。\n\n"
