    to beginner white hats to get them familiar with the process. The first step is
    to find a wireless network to hack: remember that “just trying” or “I’m learning”
    is not an excuse, and any unauthorized access or attempt to access without authorization
    may be punishable, so best that you ask permission, or better yet, simply create
    your own wireless network for convenience. 


    Now that we have a wireless network to work with, the next step is to find out
    the name of your own device’s wireless adapter. Note that there are a couple of
    terms that we should be familiar with: “eth – ethernet”, and “wlan – wireless
    local area network”. The “wlan” is what we’re looking for, so keep an eye out
    for that. Boot up your Kali Linux terminal and type in ifconfig, which should
    show us a lsit of all the terminals of our computer. Take note of the “wlan” adapter,
    along with the suffix, which is usually 0 / 1 / 2. 


    Now that we have our wireless adapter, we now have to enable monitor mode. The
    user can employ a tool called airmon – ng to create a “mon” virtual interface.
    This can easily be done by typing 


    Airmon – ng start wlan0 


    This should create a monitoring interface, which would be named by default as
    - mon0 if using an earlier version of Kali Linux, but if using the Kali Linux
    2.x onwards, the name would be wlan0mon. 


    Once the monitoring interface is up, we can begin to attempt to capture data packets
    that are being transmitted by the wireless network that we are trying to crack
    into. The following tool should help us gather data: 


    Airodump – ng wlan0mon 


    That should allow us to access a few data packets. If we want to save the data
    in a file, which we do, we add another command to the end, “write *filename*”,
    so it should look like the following: 


    Airodump – ng wlan0mon - - write *filename* 


    That will store any captured packets in *filename*.cap. Once we have about ten
    thousand data packets minimum stored, we can proceed with the wifi cracking process. 


    Now that we have our data packets, we can open another terminal and type in: 


    Aircrack – ng *filename*-01.cap 


    This should begin the cracking process, or, if there are multiple wireless networks,
    the program will ask which wireless network will be the target of the crack. Note
    that if there are multiple wireless networks, the amount of captured data packets
    needed may be even higher. If the password is fairly weak, then the password should
    appear in the following format: 


    Xx :: xx :: xx :: xx :: xx :: xx :: xx … 


    Remove the colons (so it will be “xxxxxxxxx”), and that should be the password
    of the wireless network. If the data packets captured aren’t enough, then the
    program will tell you so, and you have to gather more data packets to have enough
    to crack into the wifi. 


    One of the more common attacks, as earlier discussed, is SQL injection in order
    to gain access to a website or a database. Though the reader should know this
    by now, just for review: SQL is a structured query language that allows the computer
    to manage data, in order to store, manipulate, and retrieve data from the server
    or system database. The database is the repository of all the data, often containing
    passwords and other sensitive information. 


    So what is SQL injection? SQL injection is a way of injecting queries into the
    database. Now the database is specifically meant to answer queries, but only from
    authorized sources. SQL injection is a method wherein external queries, from unauthorized
    sources are granted access to the database. This is done through “inserting” them
    into the normal flow of data queries in order to disguise them as authorized requests
    for information. This allows the hacker to retrieve the information in the database,
    whether it be passwords, encryption keys, or even raw data. There are also some
    SQL injection methods that not only allow for retrieval of information, but even
    insertion of malware or other files, which may allow the hacker in question to
    control the database, either locking out the owner or even deleting some or all
    the files within. Needless to say, SQL injection is one of the preferred methods
    of attack by many hackers. 


    Now, “white hats” can duplicate some types of methods of SQL injection by trying
    to find vulnerabilities. One of the tools available to a white hat running the
    Kali Linux distribution is “metasploitable”, a virtual linux machine that will
    allow a person to practice gaining access and looking for vulnerabilities using
    the SQL injection method. 


    The “metasploitable” virtual machine is available online, or may even be contained
    in the bundle or installation of your Kali Linux. It should include various duplicates
    of web applications that have vulnerabilities, something that will help the “white
    hat” learn how to find vulnerabilities and how access to them is gained, which
    in turn can help the network security professionals find a way to shore up those
    vulnerabilities by patching them out or developing workarounds. 


    After installing or opening the “metasploitable” virtual Linux machine, the user
    can login, with the default username and password of the application being set
    to “msfadmin”. Once logged in, the user should change the application’s network
    settings to “bridge”, and restart the machine in order to make sure that the changes
    have properly taken effect. 


    ## How to remove hacking traces


    This the climax of the penetration attack. The hacker now has access to the resources
    available on the database of the organization. The hacker is then free to either
    extract the information that he sees of value or he is able to take control of
    the network and use it as a base to launch further attacks against other targeted
    networks in how we described a DoS attack. By gaining access to the network, the
    hacker now has control over one or more devices.


    As was the case in the preventative measures of scanning, there are some precautions
    that administrators and security personnel are able to take to ensure that devices
    and services are more challenging to access by legitimate users such as black
    hat hackers. This can involve restricting access of users such who have no legitimate
    day to day requirement to be accessing the devices. Furthermore, security managers
    should be closely monitoring the domains and those who are accessing services
    such as local administrators. Using physical security controls will allow managers
    to detect attacks that are occurring in real time and can deny access while also
    alerting the proper authorities to ensure the intruder is exposed. 


    Another approach which can be taken to ensure that access is denied is to encrypt
    highly sensitive and confidential information using protection keys. This would
    mean that any attacker attempting to access the system regardless of how well
    the system is protected, will gain access only to find that the information is
    scrambled and with the keys protected, the attacker would have no reliable method
    for using the data that has been encrypted. Encryption is a good final line of
    defence for particularly valuable data however it cannot be relied upon entirely
    in itself. Even if the attacker was to access the system and discover that the
    data is encrypted, they can still wreak havoc on the network and even disable
    it, causing significant damage as a means of sabotage. Even more alarming, the
    attacker could have control over the system and use it for further crimes which
    could be traced back to the organization''s network. 


    Once the attack has gained access to the system, they are still far from being
    in the clear. Access is for a limited time, the longer the hacker is operating
    from the system, the greater the chances of being caught. The hacker must then
    shift to the next phase, maintaining access to ensure they are able to collect
    as much data as possible. 


    Maintaining Access'
