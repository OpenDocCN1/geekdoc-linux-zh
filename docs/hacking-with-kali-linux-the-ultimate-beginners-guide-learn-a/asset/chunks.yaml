    黑客此时正在与时间赛跑，他们必须确保自己能够维持足够长的访问权限，以完成他们设定的目标，无论是窃取关键数据和信息，还是从这台受控的服务器发起进一步的攻击。在此之前，黑客能够规避检测，但他们仍然面临被捕获的风险，对系统的访问时间越长，被检测到的风险就越高。


    ## 掩盖踪迹


    你意识到有许多通过网络发起的攻击，这意味着黑客确实将访问点视为任何信息技术堡垒中最脆弱的环节之一。如果你还记得 Heartbleed（心脏溢血）事件，就会意识到即使是顶尖公司也容易通过网络被利用，甚至导致其更先进的系统突然吐出关于客户的机密加密信息。如果他们存在漏洞，那么你也是一样。


    如果你怀疑你的系统遭受了网络攻击，或者有人宣布他们要黑进你的系统，那么你完全有理由监控你网络中发生的情况，并尝试找出你的攻击者可能是谁。在本章中，你还将学习法医调查员在网络调查利用过程中，可能会关于攻击者收集到哪些信息。


    ## 示例问题场景


    你的浏览器表现异常，主页不断重定向到一个页面，告诉你你的电脑感染了病毒，然后提示你需要购买一种特定的反病毒软件。此外，你的电脑还开始卡顿，你看到有大量的广告不断弹出。这不仅干扰了你的工作，还消耗了电脑的资源。


    此时，你确定你的电脑被感染了。你想知道病毒是什么，以及感染源自哪里。


    ### 获取 Wireshark


    如果你已经有了 `Kali Linux`（是的，那个也可以用于发起网络攻击的工具套件），那么你已经拥有了这个工具。你可以在 `Network Traffic
    Analysis`（网络流量分析）下拉菜单中找到它。该界面能够对你的网络流量进行实时捕获，并分析在你的访问点上发送和接收的信息。


    启动 `Wireshark` 并进行实时捕获。你可以通过点击 `Capture`（位于顶部菜单），然后选择活动接口来实现。


    ### 你会看到屏幕上有三个窗口。上半部分的窗口将告诉你你收到的数据包信息，还会提供一些关于这些包的信息。中间窗口将显示流量中所有的位以及数据包头的字节。下半窗口将以
    `ASCII` 和 `hexadecimal`（十六进制）格式显示数据包内容。


    如果你查看数据包的内容，可能会看到一个来自全球信息网某处的信使包。当你点击该数据包时，可以更仔细地查看，然后检查出现在白色中间窗口中的详细信息。


    如果你意识到网络上的即时服务已禁用，你会发现不应该有任何其他活动。然而，你可能会注意到列表中有一个 `ICMP` 数据包，显示你的请求不可达。这很可能是一个可疑活动。


    ### 扫描流量并进行过滤


    如果你处于在线状态，你会看到你的电脑正在接收大量的流量。然而，通过像 `Wireshark` 这样的工具，你可以选择你感兴趣的流量来验证你所收到的数据。同时，你还可以检查数据包，并将安全的包与可疑的包分开。例如，你可能会看到你收到了来自可靠的反病毒软件的流量。当这种情况发生时，你可以从窗口中看到的其他所有数据包中剔除该流量，因为你已经知道该特定流量来自一个可靠的设备。要过滤掉你已经检查过的包并将它们从视图中移除，请使用此语法：


    ```

    !ip.addr == (流量的 IP 地址)

    ```


    执行此操作后，你可以将注意力放在其他可能对你的电脑造成危害的流量上。


    ### 开始观察 DNS 查询


    检查窗口中看到的其他流量。你可能会看到你的电脑（检查你的 IP 地址）正在使用 `DNS` 协议对某个站点进行标准查询，而你并不记得在使用电脑时访问过该站点。如果你意识到自己现在没有查看某个网站而电脑却表现如此，那么你就可以将其判定为可疑活动。


    现在检查其他数据包。如果你的电脑主机似乎正在从未知站点请求下载，那么你的电脑极可能感染了 rootkit（根内核程序），恶意软件正在向其源头汇报！好消息是你已经知道
    rootkit 来自哪里了，你可以运行恶意软件扫描将其从系统中移除。如果你认为由于 rootkit 造成了严重损害，可以保存结果，以便在向当局报告后作为反对罪犯的证据。


    ### 检测可能的 DoS 洪水攻击特征


    由于你之前在章节中读到过 `DoS` 攻击，你可能对如何查看你的端口是否正被黑客泛洪以试图拒绝你的服务非常感兴趣。如果你有 `Wireshark`，你就可以检测到犯罪黑客可能发送给你的波数据包的迹象。


    这是一个典型的 `DoS` 攻击数据包泛洪场景——如果一个犯罪黑客想要泛洪你，他会通过对他想要发送给你的每个类型数据包伪造 IP 地址来隐藏身份。犯罪黑客之所以这样做是因为他们非常清楚，许多商业防火墙很容易检测到来自单一源的泛洪，并将该
    `IP` 列入黑名单。当然，如果巨大的流量看起来在短时间内来自单一源，那么你就可以阻止来自该地址的连接。


    ## 确保你的网络安全


    通过确保在有人尝试对你进行端口扫描时能够察觉，你就能保护网络并防止任何网络相关的攻击。此此唯一证明的方法是由人员监控进入系统的流量，并确保所有在线数据请求都是合法的。一旦发生可疑活动，就到了你作为白帽黑客执行防御可能攻击的下一步了。

