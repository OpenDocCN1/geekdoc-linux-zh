- fmt: "\n# Go for Macintosh\n\nThe Windows operating system is very popular and therefore\
    \ many hackers and crackers target it. You may have read articles and blogs saying\
    \ that Macintosh operating systems are less secure; however, Macintosh is immune\
    \ to many threats that affect Windows. Thus, we urge you to try the Macintosh\
    \ platform. However, as we have explained in other chapters, no system in the\
    \ world is completely hack-proof, so don’t let your guard down. \n\n# Avoid Shady\
    \ Sites\n\nWhen you are browsing Facebook, you may come across unknown people\
    \ who send you messages with links, some in the form of clickbait. Avoid clicking\
    \ on such links. Also, you must avoid porn sites, or sites that promise you things\
    \ that are too good to be true. Some of these sites promise you free music when\
    \ you click on a link, while others offer free money or a movie. These sites are\
    \ run by malicious hackers who are looking for ways to harm your computer with\
    \ their malware links. Take note that on some malicious sites, you don’t even\
    \ have to click on anything to be hacked. A good browser will always inform you\
    \ of a bad site before it takes you there. Always listen to your browser’s warnings\
    \ and head back to safety if necessary. \n\n# Firewall\n\nIf you are a computer\
    \ specialist working in an organization, you might come across cases in which\
    \ more than one computer system’s OS is under one network. In situations like\
    \ these, you must install software that provides a security firewall. The Windows\
    \ operating system has an inbuilt firewall that you can activate and use directly.\
    \ This firewall feature comes in different versions of Windows, including Windows\
    \ XP, Windows Professional, Windows 10 and the other versions. \n\n# Spam\n\n\
    You can be hacked from spamming too. Email providers have taken the initiative\
    \ to classify emails according to a set of parameters. Some emails will be sent\
    \ directly into the inbox and some will be sent to the spam folder. To be safe,\
    \ avoid opening emails that look suspicious. Some of them will have attachments\
    \ that you should not open. Regardless of the security measures taken by email\
    \ providers, some spam emails will still pass their filters and come straight\
    \ into your inbox. Avoid opening such emails and do not download the attachments\
    \ that come with them. \n\n# Back-Up Options\n\nSome files will contain confidential\
    \ information, such as personal files, financial data and work-related documents\
    \ you cannot afford to lose. You should register with `Google Drive`, `Onedrive`\
    \ and other cloud drive companies so that you can upload your files as a form\
    \ of backup. You can also purchase an external hard disk and transfer all of your\
    \ important files to it. Take all these security measures because a single malicious\
    \ software can scramble your data regardless of the antivirus you have installed.\
    \ You can’t reverse some actions once they’ve been taken, so always have a backup.\
    \ \n\n# Password\n\nThis is the most important aspect of security. The importance\
    \ of a strong password can never be overstated. Starting from your e-mail, your\
    \ documents or even a secure server, a good password is the first and last line\
    \ of defense against external threats. There are two categories of passwords:\
    \ weak and strong. A weak password is made by using your mobile phone number,\
    \ your name, a family member’s name or something that can be guessed easily. Avoid\
    \ using this kind of password, as even an amateur hacker can guess it. \n\nSome\
    \ people use dates such as their birthday or a special anniversary; however, that\
    \ is still not safe. When creating a password, take your time and do some basic\
    \ math because your password must contain both letters and numbers. You can even\
    \ combine it with special characters. For instance, if your initial password is\
    \ “jack,” you can make it “J@ck007.” A password like this will be almost impossible\
    \ to guess even though it’s simple. Furthermore, avoid writing down your passwords.\
    \ Your password isn’t a file that needs backup; it must be personal to you. Make\
    \ sure you use a simple password that is very strong. However, keep in mind that\
    \ a strong password still doesn’t make you completely safe. \n\n# GENERAL SAFETY\
    \ TIPS\n\nAt this point, you should have an in-depth idea of what hacking is all\
    \ about and some guidelines for ensuring the safety of your computer system or\
    \ network. Following are general tips to follow to avoid becoming a victim of\
    \ hackers. \n\n- When you log into your email, you should avoid opening emails\
    \ from unknown sources. Most importantly, do not download any attachments that\
    \ come with such emails. \n- Do not visit unsafe websites. Always visit websites\
    \ that are secured, such as sites with “https”. Try to only engage in safe browsing.\
    \ \n- Before you install a new program, make sure the program is scanned to ensure\
    \ it is free of viruses. Then, you want to delete any old installation files because\
    \ you now have the new installation files. This can save you if a hacker uses\
    \ those old files as a backdoor. \n- Scan your files from time to time. Also make\
    \ sure that all of the applications on your system are updated frequently to the\
    \ latest version. \n- If you work at home, make sure you are in contact with security\
    \ professionals or firms that can help you check network loopholes and rectify\
    \ them as soon as possible. \n- Always back up your files. You can use safe cloud\
    \ drives such as `Google Drive` or `Dropbox`. You can also purchase an external\
    \ drive to keep your important files safe and intact. \n- Are you on a social\
    \ network? Avoid clicking on links sent by people you don’t know. Such tempting\
    \ messages can be invitations to private chat rooms or promises of money if you\
    \ click on the links. Avoid them and stay safe. \n- As technology is improving,\
    \ so are software developers. Always make sure you are surfing the internet with\
    \ a good browser. For instance, some browsers have inbuilt virus or danger detection\
    \ bots, which will alert you if you are trying to access a web page that is not\
    \ safe. When you want to download a browser, go for one with inbuilt security\
    \ features. The following browsers are recommended:\n  a) `Google Chrome`\n  b)\
    \ `Mozilla Firefox`\n  c) `Safari`\n- Use the features that matter to you when\
    \ you are connected to the internet with your browser. For instance, if you are\
    \ not using `Java` or `Active X` while you are connected, deactivate them in your\
    \ browser. Having them connected all the time is not safe. \n- Research has shown\
    \ that the most secure operating systems are `Linux` and `Macintosh`. If these\
    \ two systems meet your needs, it is recommended that you switch to them. They\
    \ are more secure, as they have had fewer incidences of hacking compared to the\
    \ popular Windows systems. \n- When you sleep, you can still be attacked if your\
    \ computer system is on and idle or in sleep mode. To prevent this, make sure\
    \ your computer is completely switched off when you are not using it. \n\n# Hacking\
    \ with Kali Linux\n\nGiven all these features and modifications made to the Linux\
    \ Debian system in order to make it useable for security testers and “white hats”,\
    \ the question now is, what makes `Kali Linux` the proper tool for a “white hat”\
    \ hacker? One would think that due to its thorough security features and wide\
    \ range of capabilities, that anyone would want to use `Kali Linux`. However,\
    \ its specialized nature means exactly that; `Kali Linux` is designed specifically\
    \ for professionals, for security specialists, penetration testers, and other\
    \ types of “white hats”. As such, `Kali Linux` offers little to no utility if\
    \ the user wishes to have a Linux distribution that is for general-purpose use,\
    \ or a specialized distribution for development, design, gaming, and `Kali Linux`\
    \ is especially not recommended for beginner users of Linux.\n"
  raw: 'Go for Macintosh 


    The Windows operating system is very popular and therefore many hackers and crackers
    target it. You may have read articles and blogs saying that Macintosh operating
    systems are less secure; however, Macintosh is immune to many threats that affect
    Windows. Thus, we urge you to try the Macintosh platform. However, as we have
    explained in other chapters, no system in the world is completely hack-proof,
    so don’t let your guard down. 


    Avoid Shady Sites 


    When you are browsing Facebook, you may come across unknown people who send you
    messages with links, some in the form of clickbait. Avoid clicking on such links.
    Also, you must avoid porn sites, or sites that promise you things that are too
    good to be true. Some of these sites promise you free music when you click on
    a link, while others offer free money or a movie. These sites are run by malicious
    hackers who are looking for ways to harm your computer with their malware links.
    Take note that on some malicious sites, you don’t even have to click on anything
    to be hacked. A good browser will always inform you of a bad site before it takes
    you there. Always listen to your browser’s warnings and head back to safety if
    necessary. 


    Firewall 


    If you are a computer specialist working in an organization, you might come across
    cases in which more than one computer system’s OS is under one network. In situations
    like these, you must install software that provides a security firewall. The Windows
    operating system has an inbuilt firewall that you can activate and use directly.
    This firewall feature comes in different versions of Windows, including Windows
    XP, Windows Professional, Windows 10 and the other versions. 


    Spam 


    You can be hacked from spamming too. Email providers have taken the initiative
    to classify emails according to a set of parameters. Some emails will be sent
    directly into the inbox and some will be sent to the spam folder. To be safe,
    avoid opening emails that look suspicious. Some of them will have attachments
    that you should not open. Regardless of the security measures taken by email providers,
    some spam emails will still pass their filters and come straight into your inbox.
    Avoid opening such emails and do not download the attachments that come with them. 


    Back-Up Options 


    Some files will contain confidential information, such as personal files, financial
    data and work-related documents you cannot afford to lose. You should register
    with Google Drive, Onedrive and other cloud drive companies so that you can upload
    your files as a form of backup. You can also purchase an external hard disk and
    transfer all of your important files to it. Take all these security measures because
    a single malicious software can scramble your data regardless of the antivirus
    you have installed. You can’t reverse some actions once they’ve been taken, so
    always have a backup. 


    Password 


    This is the most important aspect of security. The importance of a strong password
    can never be overstated. Starting from your e-mail, your documents or even a secure
    server, a good password is the first and last line of defense against external
    threats. There are two categories of passwords: weak and strong. A weak password
    is made by using your mobile phone number, your name, a family member’s name or
    something that can be guessed easily. Avoid using this kind of password, as even
    an amateur hacker can guess it. 


    Some people use dates such as their birthday or a special anniversary; however,
    that is still not safe. When creating a password, take your time and do some basic
    math because your password must contain both letters and numbers. You can even
    combine it with special characters. For instance, if your initial password is
    “jack,” you can make it “J@ck007.” A password like this will be almost impossible
    to guess even though it’s simple. Furthermore, avoid writing down your passwords.
    Your password isn’t a file that needs backup; it must be personal to you. Make
    sure you use a simple password that is very strong. However, keep in mind that
    a strong password still doesn’t make you completely safe. 


    GENERAL SAFETY TIPS 


    At this point, you should have an in-depth idea of what hacking is all about and
    some guidelines for ensuring the safety of your computer system or network. Following
    are general tips to follow to avoid becoming a victim of hackers. 


    · When you log into your email, you should avoid opening emails from unknown sources.
    Most importantly, do not download any attachments that come with such emails. 


    · Do not visit unsafe websites. Always visit websites that are secured, such as
    sites with “https”. Try to only engage in safe browsing. 


    · Before you install a new program, make sure the program is scanned to ensure
    it is free of viruses. Then, you want to delete any old installation files because
    you now have the new installation files. This can save you if a hacker uses those
    old files as a backdoor. 


    · Scan your files from time to time. Also make sure that all of the applications
    on your system are updated frequently to the latest version. 


    · If you work at home, make sure you are in contact with security professionals
    or firms that can help you check network loopholes and rectify them as soon as
    possible. 


    · Always back up your files. You can use safe cloud drives such as Google Drive
    or Dropbox. You can also purchase an external drive to keep your important files
    safe and intact. 


    · Are you on a social network? Avoid clicking on links sent by people you don’t
    know. Such tempting messages can be invitations to private chat rooms or promises
    of money if you click on the links. Avoid them and stay safe. 


    · As technology is improving, so are software developers. Always make sure you
    are surfing the internet with a good browser. For instance, some browsers have
    inbuilt virus or danger detection bots, which will alert you if you are trying
    to access a web page that is not safe. When you want to download a browser, go
    for one with better inbuilt security features. The following browsers are recommended: 


    a) Google Chrome 


    b) Mozilla Firefox 


    c) Safari 


    · Use the features that matter to you when you are connected to the internet with
    your browser. For instance, if you are not using Java or Active X while you are
    connected, deactivate them in your browser. Having them connected all the time
    is not safe. 


    · Research has shown that the most secure operating systems are Linux and Macintosh.
    If the these two systems meet your needs, it is recommended that you switch to
    them. They are more secure, as they have had fewer incidences of hacking compared
    to the popular Windows systems. 


    · When you sleep, you can still be attacked if your computer system is on and
    idle or in sleep mode. To prevent this, make sure your computer is completely
    switched off when you are not using it. 


    ## Hacking with KAli Linux


    Given all these features and modifications made to the Linux Debian system in
    order to make it useable for security testers and “white hats”, the question now
    is, what makes Kali Linux the proper tool for a “white hat” hacker? One would
    think that due to its thorough security features and wide range of capabilities,
    that anyone would want to use Kali Linux. However, its specialized nature means
    exactly that; Kali Linux is designed specifically for professionals, for security
    specialists, penetration testers, and other types of “white hats”. As such, Kali
    Linux offers little to no utility if the user wishes to have a Linux distribution
    that is for general – purpose use, or a specialized distribution for development,
    design, gaming, and Kali Linux is especially not recommended for beginner users
    of Linux.'
