    Ethical hackers, or “white hats” as the cyber – community identifies them, are
    technically hackers, in that their job is to find vulnerabilities and other exploitable
    weaknesses in various computer networks and systems. These “white hats” are called
    such because white is associated with good, and as such, they are working for
    the good of the network, by trying to find out its weaknesses in order to be able
    to fix them.


    Ethical hackers are employed by companies in order to better improve their security
    systems, as network security is paramount for any company or business to ensure
    that they are not cheated, stolen from, or otherwise compromised, as a network
    open to hacking would allow malicious attackers or hackers to steal data, cause
    financial loss, or cause other kinds of damages.


    Note that in terms of operations and tools used, ethical hackers often actually
    operate similarly to hackers. After all, hackers go in with the intent of finding
    vulnerabilities, and a lot of the best tools of the job are also available to
    those who have less noble intentions. In addition, ethical hackers or “white hats”
    often also intentionally use the same software and tools as freelance hackers
    or malicious hackers, i.e “black hats”, as their job is to find the same vulnerabilities
    before the “black hats” do, or failing that, find ways to patch and fix these
    network vulnerabilities and weaknesses. In order to do this, it would only be
    logical to approach the problem in a similar manner as “black hats” do, allowing
    them to “put the hat on” of their counterparts in order to think like they do.


    Note that the mere employment of a hacker by a legitimately registered entity
    such as a business or corporation does not mean that they are automatically “white
    hats”. Some businesses employ “black hats” in order to steal corporate data or
    other sensitive information from their rivals. The characteristic of a “white
    hat” is that they only look for vulnerabilities in their own employer’s network
    security, and they are given the express authorization to do so, and they have
    the duty and obligation to report any and all vulnerabilities found to their employer
    as soon as possible.


    There is also another type of hacker, often called the “grey hats”, which straddle
    a middle ground between “black hats” and “white hats”. These “grey hats” function
    similarly to “white hats” in that they look for vulnerabilities in order to report
    them, allowing the owner of the network to fix these vulnerabilities, but these
    “grey hats” do not work with the express authority of the network owner, meaning
    that while they may have good intentions, what they are doing is still most likely
    violating the cyber – crime laws of the country that they are in.


    ## Step by step process of ethical hacking


    What happens when your internet connection gets hacked? Your connection not only
    slows down, but your identity and location also gets used for any illegal activity
    that a criminal hacker may do using your network. At the same time, it also becomes
    very possible for a criminal hacker to get deeper access in your personal computer,
    thanks to discovered vulnerable ports and shared network devices such as printers.
    If your mobile phone is also synced to your computer, there is a risk that a criminal
    hacker would also get access to that device.


    For this reason, it is very important to know how your internet connection can
    be hacked. In this chapter, you will learn how most criminal hackers opt to crack
    your Internet connection through the most popular hack tools.


    ### Method 1: Check for Unchanged Router Passwords


    This is probably the easiest way to hack Internet connection. All you need to
    do is to see all the available networks that you can connect to. To do that, switch
    on your computer’s WiFi and look at the list of available networks in your vicinity.


    Now, you would see that there are common router names in the list of available
    networks, such as `Linksys`. There is a big chance that the default password for
    these routers are unchanged, so all you need to do is to log in the manufacturer’s
    given password. How do you do that? You just need to go to the manufacturer’s
    website and look up for the router’s manual.


    If you are able to go into the target network using the default password, pull
    up a fresh browser and log in into the GUI of the target router. If your target
    is a `Linksys` router, the IP address to show its GUI is `192.168.1.1`. Once you
    are prompted for log in credentials, leave the username blank, and type in `admin`
    for password. (Note: Some routers have different default log in credentials depending
    on the model. You can check for these on the manufacturer’s website.)


    Once you are in the GUI, you can change the `SSID`, the router password, and the
    security protocol of your target router. This way, you would be able to take full
    control of the router and prevent the network owner from connecting to his own
    ISP!


    This method assumes that there are just too many Internet users that are not too
    careful when it comes to securing their Internet connection before putting it
    to use. You would be surprised that there are people who do not even bother changing
    the `SSID` of their Wi-Fi, which is almost a giveaway that it is not secured by
    a password other than what the manufacturer uses.


    ### Method 2: Hack Internet Password


    What would hackers do when the Wi-Fi that they are trying to hack is secured?
    The next thing that they would do is to check how possible it is to guess what
    the password of their targeted network is. At this point, you would need to learn
    a few key terms when it comes to identifying and assigning security to Wi-Fi connections:


    1. `WEP` – means Wired Equivalent Privacy. This is the most basic form of Internet
    encryption, thus an unsafe option for most Internet users when it comes to assigning
    security to their wireless connection. This type of encryption can be cracked
    with ease using the most basic hacking tools. Older models of Wi-Fi still use
    this type of encryption.

    2. `WPA` – means Wi-Fi Protected Access. This is a more secure option for newer
    computer and router models, which can only be efficiently cracked through the
    old-fashioned trial-and-error method of guessing potential combinations. If a
    strong password combination is used, a `WPA` connection may almost be impossible
    to crack. Another variation of this security protocol is `WPA-2`, which is tougher
    to penetrate.


    At this point, you have the idea that most hackers would opt to hack available
    networks that are protected through `WEP` protocol, since it is faster and much
    easier to crack. Here is a list of tools that a hacker needs in order to crack
    a `WEP`-protected Internet connection:


    1. A wireless adapter – you would need to have a wireless adapter that is compatible
    with a software called `CommView`. This software allows your wireless card to
    enter monitor mode. To see if your wireless card is compatible with `CommView`,
    you can head over at `tamos.com` and see if your adapter is on the list.

    2. `CommView` – `CommView for Wifi` is a software that is used to capture packets
    from your target network. All you need to do is install this software and then
    follow the installation guide to install its drivers for your wireless card.

    3. `Aircrack-ng GUI` – this software enables you to crack the password of your
    target network after you are done capturing packets.


    Follow the steps below to start cracking a `WEP`-encrypted network:


    1. Run `CommView for Wifi` to start scanning for wireless networks according to
    channel. Leave it running for a few minutes. You would then see a long list of
    networks that your wireless adapter can reach.

    2. Choose a `WEP` network (you would see this right next to the name of networks
    on the list.) Select a network that has the lowest decibel (dB) rating and has
    the highest signal.

