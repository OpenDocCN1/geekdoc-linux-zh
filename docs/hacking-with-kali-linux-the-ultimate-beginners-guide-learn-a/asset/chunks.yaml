- fmt: '

    Most Linux distributions are composed of a Linux kernel, GNU tools and software
    libraries, other third – party software, a window manager, and a specialized desktop
    environment. Due to the nature of Linux, this often includes free and open – source
    software that can be found either as a compiled library or in raw source code,
    which may allow for various modifications, though most Linux distributions also
    include proprietary software in their core package, which cannot be modified by
    the user.


    Debian is a type of Linux kernel which Kali is built on, meaning that Debian is
    a particular build of Linux, and Kali is a build based on Debian, but is not Debian
    itself. It was developed by programmers Aharoni and Kearns of Offensive Security,
    basing it on a previous Linux – based incarnation of a security testing Linux
    Distribution known as “Backtrack”.


    The main reason for this rebuild was that though Backtrack was effective, the
    programmers wanted to build an updated Linux distribution, choosing Debian as
    their base due to Debian’s reputation as a reliable and stable Linux kernel, as
    well as due to the expansive software library that Debian had access and compatibility
    with. It was eventually developed and expanded to what it is today, and it has
    hundreds of tools designed specifically for security testing and network security
    purposes, and can be run natively directly from a hard drive, or even booted from
    a USB or CD, and can also be run on a virtual machine.


    Kali Linux was developed with multi – platform support, with both 32 – bit and
    64 – bit host formats, developed for compatibility with devices running x86 ARM
    processing chips, and which can run on other operating platforms such as Android
    and Windows 10, the former on certain compatible hardware, such as the Nexus line
    of Samsung phones, and the latter on Windows Subsystem for Linux – capable Windows
    10 operating systems, and this is even available from the official Windows Store
    for download.


    ## Features of Kali Linux


    Given the short background of Kali Linux as discussed earlier, it would be beneficial
    for the reader to have a short overview of the features and specific capabilities
    of Kali Linux, which should give a clearer idea of what Kali Linux really is and
    how it is used.


    ### Expansive library of network security and penetration testing tools: Kali
    Linux found its origins from Backtrack, as previously discussed, and thanks to
    this, there have been a huge amount of tools developed over time for the Backtrack
    distribution. However, due to the passage of time, a lot of these tools have been
    rendered redundant or outdated, and the Kali developers have been able to cut
    these down, removing the tools that no longer serve the intended purpose, while
    integrating and adding new and updated tools. Currently, Kali has over 600 penetration
    testing tools available for its user, and some of the more important and / or
    notable tools will be discussed later on.


    ### Free – use software: Much like the predecessor, BackTrack, Kali Linux is available
    for use free of charge, and according to the developers, they intend to keep it
    that way, making this tool available for download and use without need for any
    paywall, with all users receiving full functionality of the Kali Linux distribution.


    ### Open Source Git Tree: Kali Linux is freeware, and much like other freeware
    and many Linux distributions, it is also open source. The developers of Kali Linux
    are committed to using the open source development model, allowing their development
    tree to be made public. In addition, all the source code used in Kali Linux is
    also consistently made available by the developers, for any user that wants to
    tweak or modify Kali Linux for a specific need.


    ### File System Hierarchy – standard – compliant: The Kali Linux software is adherent
    to the `FHS`, or the “Filesystem Hierarchy Standard”, making it much easier for
    Linux users to navigate and locate specific files such as binary codes, support
    files, software libraries, and the like. The use of this standard allows for convenience
    and ease of use, one advantage that Kali Linux has over a lot of other similar
    software.


    ### Support for a wide variety of devices: As earlier discussed, the developers
    of Kali Linux have tried their best to make Kali Linux as user – friendly and
    versatile as possible, making it compatible with a large range of platforms. Kali
    Linux is supported by multiple operating systems, and one of the biggest things
    is that Kali Linux itself supports the use of wireless devices. Not only is Kali
    Linux compatible with multiple software setups, but also a large range of hardware
    setups, and the developers are trying their best to include as many hardware configurations
    as possible. This is quite notable, especially due to the wireless device support,
    as one of the regular criticisms against most Linux distributions is that they
    tend to lack support for wireless hardware, which Kali Linux provides.


    ### Custom Kernel: Kali Linux’s development team are, first and foremost, penetration
    testers, meaning that they are often required to do assessments wirelessly, and
    as such, the kernel of Kali Linux has injection patches constantly included, keeping
    it up to date.


    ### Secure Development Environment: The Kali Linux team is made up of “white hat”
    hackers and penetration testers, and as such, they are acutely aware of the need
    of security, especially when it comes to software that “white hats” often use,
    as a vulnerability or bug in the software itself can have disastrous and wide
    – ranging results. As such, the development team is restricted, and they are the
    only ones who commit packages and interact with Kali Linux’s repositories, all
    of this being done under multiple secure protocols to ensure fidelity and security.
    In addition, Kali Linux’s packages and repositories are `GPG` signed, with all
    packages contained by Kali Linux signed by the individual developer responsible
    for building and committing it, and each repository also signs the package, allowing
    for a secure set of software packages and repositories.


    ### Multi – lingual support: Though much of coding and a lot of penetration tools
    are built on the English language, Kali Linux attempts to include multi – lingual
    support, allowing non – native English speakers to operate in their native language,
    making it easier for them to make use of Kali Linux and its features, enabling
    them to be more effective in carrying out their tasks.


    ### Customization – enabled: As earlier mentioned, Kali Linux is a piece of open
    – source software, meaning that its source code is open to all. Much like most
    open source software, and in fact, a lot of Linux distributions as well, Kali
    Linux can be modified to suit the individual user’s needs and tastes, in case
    they have a differing opinion when it comes to design. Kali Linux is customizable
    on multiple levels, up until the kernel level, offering advanced users almost
    total control over their Kali Linux instance.


