    无论你编写的代码以什么形式存在，都会由解释器执行。因此，能够执行 python 脚本的首要条件是你的电脑上正确安装了解释器。解释器能够以以下方式执行 python
    代码：


    * 作为代码块输入交互式会话中；或

    * 作为模块或脚本。


    ## 如何在交互式会话中运行 python 代码：


    通过交互式会话运行 python 代码是执行脚本和模块的常用方式之一。要启动 python 交互式会话，需要打开终端或命令行。接下来，根据使用的 python
    版本，输入 `python` 或 `python 3` 并回车。交互模式下的默认提示符是符号 `>>>`。因此，每当你看到这些字符时，请记住你已经进入了交互式界面。在这里，你可以尝试编写并运行你的
    python 代码。然而，尽管这种方法看起来很简单，但它有一个主要的缺点：你的代码持续时间与会话同长。一旦你终止了会话，你的代码就会消失。这种方法的优点在于你输入的任何语句和表达式都会立即被求值并执行。它允许你测试编写的每一行代码，使其成为开发的极佳工具，也是简单快速练习
    python 编码的良好平台。要退出交互模式，你可以使用以下任何其他方法：


    * 你可以使用内置函数，如 `exit()` 或 `quit()`。

    * 你也可以使用组合键。对于具有 Unix 风格的系统，你可以使用 `Ctrl and D`。而在 Windows 中，你可以使用键键 `Ctrl + Z`
    并回车。

    * 请注意，在 python 编码时需要记住的首要通用指南是，当你怀疑任何代码的功能时，使用交互式会话。


    如果你没有使用终端或命令线的经验，以下是一些你可以使用的步骤：


    1. 当使用 Windows 时，找到命令行（也称为 MS-DOS 控制台或命令提示符）。命令行是一个名为 `cmd.exe` 的程序。然而，该程序的路径可能会随着你系统版本的变化而改变。

    2. 为了快速访问它，你可以使用快捷键 `Win + R` 运行运行对话框。一旦界面打开，输入 `cmd` 并回车。

    3. 在运行 GNU 或 Linux 以及其他版本 Unix 的平台上，有许多应用程序提供访问系统命令行的方法。其中一些包括 `Konsole`、`xterm`、`Terminal`
    和 `Gnome`。这些工具运行终端或 shell，如 `csh`、`ksh`、`Bash` 等。在这种情况下，每个应用程序的路径更加多样，取决于它的分发方式以及你所用电脑的环境。因此，注意关于你系统的文档是非常关重要的。

    4. 在运行 Mac OS X 平台的系统上，可以通过以下过程访问系统终端：

    5. 进入“应用程序”，进入“实用工具”并点击“终端”。


    ## 解释器如何运行 python 脚本：


    运行 python 脚本的过程充满了解释器经历的多个步骤。在此过程中，解释器执行以下操作：


    I. 按顺序处理你脚本中的语句。

    II. 将源代码编译为字节码 —— 一种中间格式：

    字节码代表代码转换为独立于平台的底层语言。字节码的目的是优化代码的执行。因此，在运行你的代码时，解释器跳过了编译过程。请注意，只有模块会经历代码移动，因为它们被导入了，可执行的脚本不会。

    III. 发送待执行的代码：

    在这里使用了 `PVM`（Python 虚拟机），它是 python 的运行时引擎。`PVM` 作为一个循环工作，遍历你字节码中包含的指令，一个接一个地运行它们。然而，不要将
    Python 虚拟机视为 python 的孤立部分。不，它仅仅是安装在你机器上的 python 系统的一部分。在 Python 解释器中，`PVM` 是最后一步。


    执行 python 脚本所需的整个过程被称为 Python 执行模型（Python Execution Model）。


    ## 如何使用命令行执行 Python 脚本：


    Python 中的交互式会话允许你编写许多不同的代码行，但你一关闭窗口，你编写的所有内容都会丢失。这解释了为什么 python 程序应该使用纯文本文件编写。按照惯例，这种方式创建的文件会带有
    `.py` 扩展名，在 Windows 操作系统上也可以是 `.pyw`。任何纯文本编辑器都可以用于 python 代码。为了使这部分更具实操性，你必须创建一个示例测试脚本来解释如何运行
    python 脚本。


    首先，打开文本编辑器并输入以下代码行：


    ```python

    #!/usr/bin/env python3


    print("Hello World!")

    ```


    继续将文件保存到你的目录中，文件名为 `hello.py`。这标志着你编写测试脚本的完成。


    ### 如何使用 python 命令：


    要运行你的示例 python 脚本或任何其他脚本，你必须使用 python 命令。首先打开命令行并输入单词 `python3` 或只需 `python`，取决于你安装的版本。接下来，按照如下方式为你的脚本附加路径：


    ```bash

    python3 hello.py

    ```


    Hello World!


    如果你的代码没有错误，执行应该正常工作，屏幕上会显示“Hello World!”字样。这就是运行 python 脚本的方法。如果脚本无法运行，可能是你在编码或添加路径时犯了错误，或者你安装的版本有问题。交叉检查你的文本文件以确保它是无错误的。如果是这样，检查你的路径；即文件保存的位置。基本上，这是执行
    python 脚本最简单且实用的方法。


    ### 如何重定向输出：


    有时保存 python 脚本的输出以便日后分析很有帮助。为了这样做，输入以下代码行：


    ```bash

    python3 hello.py > output.txt

    ```


    这样做，你把 python 脚本的输出重定向到名为 `output.txt` 的文件，而不是 `stdout` —— 默认系统输出文件。如果现在你的系统中不存在
    `output.txt` 文件，该过程将自动创建它。然而，如果它已经存在，新的输出将替换其中的内容。因此，你的代码行应如下：


    ```bash

    python3 hello.py >> output.txt

    ```


    现在，输出不再被替换，而是被附加到 `output.txt` 的末尾。


    ### 如何使用 -m 选项运行模块：


    在 Python 中，提供了一些命令行选项以满足用户的许多不同需求。例如，如果你想在 Python 中执行一个模块，可以使用命令 `python -m <module-name>`
    运行。`-m` 选项是在 `sys.path` 中搜索内容作为 `__main__` 运行的模块。参考以下实例：


    ```bash

    python3 -m hello

    ```


    Hello World!


    请注意，`module-name` 必须根据模块对象命名，而不是字符串。


