  raw: 'This is because these are not only hackers in and of themselves, but they
    are also characteristics of every king of hacker out there. Whether they are doing
    things for good, for bad, or doing good things without permission, these are really
    what hacking comes down to.


    ## a.    Black hat


    The black hat hacker is likely the most famous of the hacking world, or rather,
    infamous. This is the line of hacking that movies tend to focus on, and it is
    the line of hacking that has given all hacking a bad name.


    A black hat hacker is a hacker that is getting into a system or network to cause
    harm. They always have malicious intent, and they are there to hurt and destroy.
    They do this by either stealing things, whether it be the person’s information,
    the network’s codes, or anything else they find that is valuable to them, or they
    can do it by planting worms and viruses into the system. There have been viruses
    planted into various systems throughout history, causing hundreds of thousands
    of dollars’worth of damage, and putting systems down for days.


    Viruses are programs that hackers create, then distribute, that cause havoc on
    whatever they can get a grip on. They often times disguise themselves to look
    like one thing, and they prompt you to open them in whatever way they can.


    Then, once you do open the link, they get into the hard drive of your system and
    do whatever they want while they are in there. Many viruses behave like they have
    a mind of their own, and you would be surprised at the harm they can cause.


    There is a certain kind of virus, known as a‘backdoor’virus, which allows its
    sender to then have access to and control of whatever system it has planted itself
    into. It is as though the person who owns the system is nothing more than a bystander
    who can do nothing but watch as the virus takes its toll on the system.


    Hackers will use these viruses for a number of reasons, and none of them are very
    good for you. When a hacker has access to your computer, they can then do whatever
    they like on there.


    They can get into your personal information, and use that for their own gain.
    They can steal your identity, they can do things that are illegal while they are
    on your computer, and thus make it look like you were the one who did it, and
    get out of the suspicion by passing all the blame onto you.


    These are really hard viruses to get rid of, and it is of utmost importance that
    you do whatever you can to protect yourself on the outset to make sure you don’t
    get one of these viruses. However, if you do happen to get one, there is hope.
    You may have to get rid of a lot of your system, or close it down and restart
    it entirely, but it is always better to do that then to let a hacker have access
    to anything you are doing.


    Black hat hackers are malicious. They only do what they do to harm others and
    cause mischief. It is unfortunate that they do what they do, as this is what made
    hacking fall under a bad light, but there is hope, because wherever there is a
    bad thing, there is also some good to be found, and that good comes in the form
    of the white and grey hat hackers. 


    ## b. White hat


    The white hat hacker and the grey hat hacker are really similar, but there are
    key differences that make them separate categories. The white hat hacker is a
    person who is hired by a network or company to get into the system and intentionally
    try to hack it.


    The purpose of this is to test the system or network for weakness. Once they are
    able to see where hackers can get in, they can fix it and make it more difficult
    for the black hat hackers to break in.


    They often do this through a form of testing known as Penetration Testing, but
    we will look more on that later. White hat hackers always have permission to be
    in the system they are in, and they are there for the sole purpose of looking
    for vulnerabilities.


    There is a high enough demand for this line of work that there are white hat hackers
    that do it for a full time job. The more systems go up, and more hackers are going
    to try to break into them. The more hackers that try to do that, the more companies
    are going to need white hat hackers to keep them out.


    Companies aren’t too picky on who they hire to work for them, either, so it is
    remarkable that so many hackers will choose to go down the black hat path. They
    could be making decent wages by working for people and getting paid for what they
    do, but unfortunately not many people see it this way, and they would rather hack
    for their own selfish gain than to do what would help others.


    To put it simply, however, it can be broken down to a very basic relationship.
    Black hackers try to get in, white hackers try to keep them out. Sometimes the
    black hats have the upper hand, then there are times when it goes to the whites.


    It is like a codependent relationship of villain and super hero, where you are
    rooting for one but the other still manages to get what they want every once in
    a while.


    It is a big circle that works out in the end. Of course it would be a lot easier
    if black hat hackers would stop breaking into the systems in the first place,
    but unfortunately that isn’t going to happen.


    ## c.    Grey hat


    The world is often portrayed as being full of choices that are either right or
    wrong. You can do it one way, or you can do it any way but that one right way…thus
    making you wrong.


    Right and wrong, black and white. Yet…what about those exceptions to the rule?
    There is an exception to pretty much every rule in existence, and hacking is no
    exception. Grey hat hackers fall into this realm.


    Whether they are right to do what they do or wrong to do what they do is up to
    the individual to decide, because it is a grey area.


    To clarify what I mean, think about it this way. Black hat hackers get into networks
    without permission to cause harm. That is bad. Very bad. White hat hackers get
    into systems with permission to cause protection. That is good. Very good.


    But then you have the grey hat hackers. Grey hat hackers get into a system without
    permission…which is bad, but they get into that system to help the company or
    network…which is good.


    So, in a nutshell, grey hat hackers use bad methods to do good things. Which,
    in turn, should make the whole event a good thing. Many people feel that it is
    the grey hat hackers that do the best job of keeping the black hat hackers at
    bay, but there are still those that argue the grey hats should not do what they
    do because they have no permission to do it.


    What is important and universal is the fact that a grey hat hacker never does
    anything malicious or bad to a system, in fact, they do every bit as good as the
    white hat hackers for those who are in charge of the network, but they do it for
    free.


    In a way, the grey hat hackers can be considered the robin hoods of hacking, doing
    what they can to help people, unasked, and unpaid, and largely without a‘thank
    you’even.


    In the chapters to come we are going to look at how you can become a grey hat
    hacker, and how you can get into whatever network you please, as well as how you
    can help the people who run the network.


    # Chapter 2\. Hacking process


    By now, we should have a good idea of what Kali Linux is used for, and what “white
    hats” are, and ethical hacking. In addition, we have already gone over how to
    make sure that the Kali Linux that the user is downloading is verified and safe,
    with no malware or any other modification that would compromise its security.
    We now also know how to build our own installer image and package of Kali Linux,
    customizing it to our needs. We’ve already gone over how to install Kali Linux,
    and even dual – boot it, in case we need such a feature. Now we can go on to some
    of the basics, how to actually use this program that we’ve learned about, downloaded,
    and installed. 


    ## Step by step, gaining remote access'
