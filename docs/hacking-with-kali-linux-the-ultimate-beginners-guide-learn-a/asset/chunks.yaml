    Note as well that while Kali Linux is a type of open – source software, it’s not
    entirely widely open – source, mainly for security reasons. Thus, the development
    team is kept small, with packages and repositories signed by each team member
    that uploaded it as well as the team as a whole for verification and security
    purposes, and the amount of upstream repositories used are kept to a minimum,
    with as few updates and packages drawn from them as possible, again all in the
    interest of security. This configuration means that adding new repositories or
    packages that have not been fully vetted by the Kali Linux team is wont to cause
    problems, and may just break the installation of Kali Linux. Though as discussed
    earlier, Kali Linux was designed and intended to allow for a very high degree
    of user customization, the user still has to know what packages and repositories
    are compatible with Kali Linux, as adding unrelated or unvetted packages or software
    repositories will still most likely lead to bugs. For example, while Kali Linux
    has a lot of features, it does not support the `apt-add-repository` command, `PPAs`,
    or `Launchpad`, showing exactly the intent of the developers. Other unrelated
    programs such as `Steam` will also most likely not end well, and the Kali Linux
    distribution will most likely not work out well if that is the user’s intent.


    Even the insertion of some mainstream software packages such as `NodeJS` can take
    a bit of effort and know – how, but then, what Linux distribution doesn’t? However,
    due to the advanced nature of Kali Linux, it would require more than just a basic
    level of sys – ad competence in order to make proper use of and unlock the full
    potential of the Kali Linux distribution. This is also another reason why Kali
    Linux is not recommended for beginners, as the specialized nature means that it
    is difficult to learn from scratch, and as it is highly specialized, the knowledge
    that one may pick up from learning Kali Linux may not be applicable to other Linux
    distributions as a whole.


    Last but not least is that due to the fact that Kali Linux was developed as a
    “white hat” tool, and contains numerous security and penetration testing tools,
    it may be possible that these tools may be used improperly if the user is not
    quite familiar with what they are doing. Misuse of these tools, especially on
    a network where the user was not given express authorization, may result in damage,
    either to the system or the network, and may also result in numerous consequences,
    be it personal or legal. Take note that while this is the reason for network services
    being deactivated by default, if something happens, “not knowing what I did” is
    not a valid excuse, and an inexperienced user may just find themselves landing
    in hot water.


    However, for professional penetration testers or “white hats”, or even for those
    who are still studying or practicing with the aim of becoming a professional,
    Kali Linux has one of the best and most expansive toolkits available, especially
    at its price point – free.


    # Chapter 4. Bash and python scripting


    So why do we even use Python for collaborative processing? Even though `GIL` does
    not allow `CPython` programs with multiple threads to get all the advantages of
    multiprocessor systems in certain situations, most of the operations with blocking
    or long-term execution, such as input / output, image processing, as well as grinding
    numbers in `NumPy`, occur outside the existing one. `Gil` Thus, the `GIL` itself
    becomes a potential bottleneck only for programs with many threads that spend
    significant time inside the `GIL`. As you will see in subsequent chapters, multithreading
    is just some kind of co-processing programming, and although the `GIL` does make
    certain calls for multithreading `CPython` programs that allow more than one thread
    to access shared resources, other forms of parallel programming do not have this
    problem. For example, applications with many processes that do not share any common
    resources between processes, such as input / output, image processing, or grinding
    `NumPy` numbers, can work seamlessly with `GIL`.


    In addition, Python has gained increasing popularity in the programming community.
    Thanks to user-friendly syntax and general readability, more and more people believe
    that it is relatively easy to use Python in their development, whether it’s a
    beginner learning a new programming language, users with an average level of training
    in searching for available modern Python functionality, or experienced Programmers
    using Python to solve complex problems. There are estimates that Python code development
    can be up to 10 times faster than `C / C++` coding.


    A large number of developers using Python have come about as a result of a powerful,
    still growing community. Every day, Python libraries and packages are developed
    and released, supplying various tasks and technologies. Currently, Python supports
    an incredibly wide range of programming - namely, software development, GUI workstations,
    video game design, web and Internet development, as well as scientific and numerical
    calculations. In recent years, Python has also grown as one of the top tools in
    data science, Big Data, and machine learning, competing with a long-term player
    in the field, `R`.


    ## Running Python Scripts


    To excel in Python programming, it is essential for you to have an in-depth knowledge
    of how to run scripts and code in Python. It is imperative because scripts and
    codes are the only way with which you can check the functionality of your codes.
    So, the key to functional codes lies in being able to run scripts and codes. In
    this section, the focus is going to be on all the process you can use to run python
    scripts regardless of the operating system platform, requirements, and skill set
    you have obtained as a programmer.


    To begin, let''s consider the concepts of scripts and modules first.


    ### Scripts and Modules


    In computer programming, a script can be defined as a file which contains a logical
    sequence of orders. It can also be seen as a batch processing file. It is typically
    stored in a plain text file as a simple program. To process a script, an interpreter
    is needed. The interpreter has to run each command sequentially. Thus, any plain
    text file which contains python codes is known as a script, a term used informally
    to refer to a top-level program file. However, not all plain text files containing
    codes in Python are scripts. A module is a plain text file composed of python
    codes which are designed for importation to another python file from which it
    is used.


    Bringing both terms into comparison; a module is distinguishable from a script
    because while the former is crafted to be imported, the latter are meant to be
    run directly. Whatever the case may be, the critical thing is to learn how to
    run the codes you write in Python into your scripts and modules.


    ### Interpreter


    To better understand the concept of scripts and modules, let''s delve into the
    concept of the interpreter. Python can be an interpreter language. An interpreter
    is a vital program necessary to run python scripts and codes. In technical terms,
    an interpreter is a form of software which runs the code by working between the
    hardware of your computer and the program. There are different interpreters spanning
    across the different types of platforms. Thus, your interpreter can be any of
    the following depending on the python implementation you use:


    1. A program coded in C such as CPython` — the core implementation of the programming
    language.

    2. A program coded in Java. For example, `Jython`.

    3. A program coded using python, such as `PyPy`.

    4. A program implemented in .NET. For example, `IronPython`.

