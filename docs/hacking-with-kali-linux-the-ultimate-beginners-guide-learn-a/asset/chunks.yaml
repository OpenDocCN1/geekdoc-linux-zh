    # Chapter 10\. Basics of Firewall


    Today, a network design is incomplete without firewalls. This is a networking
    device that can either be a software- or hardware-based. A firewall can control
    access to a network. The objective of the controlled access is to ensure resource
    and data protection from external intruders. To control the access, firewalls
    will be installed at the exit/entry points of a network. For instance, a firewall
    may be placed between the Internet and an internal network. When put in place,
    it can control the flow of traffic to the network at the point.


    Although they are used for protecting internal networks from public ones, they
    can also control access between segments within a specific network. For instance,
    a firewall may be placed between the Sales Department and Accounts Department.
    As I mentioned earlier, firewalls can come as a software or a hardware device.
    Some organizations implement this device through their network’s operating systems
    such as Windows servers, Linux/Unix, and Mac OS servers. 


    In this case, the firewall will be configured on the network’s server in order
    to grant permission to some network traffic types. When used at home or in small
    offices, it can be installed on the home or office’s local system where it will
    be configured for controlling traffic. You can also find some third-party firewalls.
    Today, you can find hardware firewalls deployed in different networks. These firewalls
    are usually dedicated network devices and needs only little configuration for
    implementation. All the systems behind the firewall will be automatically protected
    from outside sources. 


    You can get these firewalls whenever you need them because they are readily available
    and can be combined with some other devices. For instance, many wireless access
    points and broadband routers have built-in firewall functionality. In such situation,
    the WAP or router may have some ports where systems can be plugged into.


    CSUs/DSUs


    Known as Channel Service Unit/Data Service Unit, this device plays the role of
    a translator between the WAN data format and the LAN data format. The translation
    is absolutely necessary because WAN and LAN use different technologies.


    Some people are of the opinion that a CSU/DSU is a digital modem. However, unlike
    a modem that can easily change its signal from digital to analog, this device
    changes signal from a digital format to another digital format. 


    A CSU/DSU is designed with a physical connection that can be used for LAN equipment.
    This can be via a different connection for a WAN or a serial interface. The CSU/DSU
    is not the regular networking equipment because it is always kept separate from
    others. However, as more WAN links are used, router manufacturers have seen the
    need to include the CSU/DSU functionality in their routers. When they are not
    included, the manufacturers give the WAN expansion capability to accommodate the
    CSU/DSU.


    If you are a computer specialist working in an organization, you might come across
    cases in which more than one computer system’s OS is under one network. In situations
    like these, you must install software that provides a security firewall. The Windows
    operating system has an inbuilt firewall that you can activate and use directly.
    This firewall feature comes in different versions of Windows, including Windows
    XP, Windows Professional, Windows 10 and the other versions.


    Installing a firewall or creating a strong set of passwords and having detailed
    access control settings is not enough to stay protected. In addition to all of
    the standards and vulnerabilities mentioned above, you must understand that the
    largest and most tedious obstacles to securing your wireless network are the complexities
    found within the network. However, no wireless network can be completely secured.
    There are some things that are not complex but may still be considered an obstacle.
    For instance, a plain old AP and a wireless NIC (interface card) might not actually
    be complex, although you can deduce that a lot more is going on at the backend.


    The 802.11 protocols aren’t developed to be perfect because they have big issues.
    These protocols don’t simply help you send and receive information with optimal
    management overhead, like the old Ethernet. Rather, the 802.11 protocols are deeply
    complex. Most of the wireless networks simply transmit and receive RF (radio frequency)
    signals which carry a packet of network data. The 802.11 network will actually
    perform more complex functions, such as:


    ·        Encrypting data to improve data privacy.


    ·        Authenticating clients to be sure only authorized personnel have access
    to their network.


    ·        Setting timing message packets to be certain about client synchronization
    and to help avoid data-transmission conflicts.


    ·        Checking the data integrity to make sure that all information remains
    uncontaminated.


    As complex as the 802.11 protocols are, their network design is associated with
    more complexities such as:


    ·        Staying updated with your wireless devices, which may include laptops,
    APs and PDAs (Personal Digital Assistants).


    ·        The kind of antennae to implement and where to locate them.


    ·        Knowing the exact type of devices that are allowed on your network and
    also those that are not.


    ·        Adjusting signal-power settings which will prevent your radio frequency
    signal from leaking outside your residence.


    All of these wireless network complexities add up to a multitude of security weaknesses
    that are not available in the old traditional wired networks.


