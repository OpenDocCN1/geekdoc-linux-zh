- fmt: '

    Kali Linux was specifically designed for “white hats” and for penetration testing
    and security testing, among other activities that “white hat” hackers usually
    do. In accordance to these specialized needs, the Kali Linux distribution has
    been modified in order to address these requirements, specifically these core
    changes:


    - **Single – user with root access**: Kali Linux is, first and foremost, a Linux
    distribution centered around security auditing and penetration testing, and it
    has been tweaked to reflect the needs of that particular setup. A single user
    setup is there for security purposes, and this allows the user to consistently
    have root access. The general practice is that root access is only given when
    necessary, but the nature of penetration testing requires that Kali Linux be given
    root access thanks to the escalated user access requirements needed by penetration
    testing and security auditing tools. If Kali Linux were to follow the standard
    root access only upon demand, this would be quite inconvenient and a burden to
    the user, hence this particular design choice.

    - **Disabled network services**: Kali Linux, in the interest of security, has
    its network services and capabilities disabled by default, with system hooks that
    make sure that the network services are disabled, while still allowing services
    to be installed as needed. Network services are not the only services disabled
    for security purposes, but even other connectivity options such as Bluetooth are
    disabled by default, though depending on the user’s needs and preferences, network
    services can be switched on as required.

    - **Custom Linux kernel**: The Kali Linux distribution’s kernel is an upstream
    kernel specially patched for wireless injection, which allows the kernel to send
    out information packages on a network connection while making it seem like they
    are part of the normal communications and information flow, a key component of
    a lot of hacking activities. This enables security testers and “white hats” to
    properly duplicate one of the common avenues of gaining unauthorized access and
    exploiting weaknesses.

    - **Trusted and curated repositories**: Given its nature as a security – focused
    Linux distribution, one of the developers’ main priorities is keeping Kali Linux
    secure and safe for use, as a weakness in the distribution or an available exploit
    would defeat the purpose of Kali Linux. As such, the developers know that system
    integrity is of utmost importance, and they vet and verify every upstream software
    source that Kali Linux makes use of, making sure that only the extremely necessary
    ones are kept in order to minimize risks. Note that a lot of Kali Linux users
    are often tempted to expand their `sources.list` resource, but note that doing
    so has a high chance of breaking the Kali Linux Installation.


    # Chapter 1. Types of Hackers


    All lines of work in society today have different forms. You are either blue collar,
    white collar, no collar…whatever. Hacking is no different. Just as there is different
    kinds of jobs associated with different kinds of collar colors, the same goes
    for hacking.


    Hackers have been classified into many different categories, black hat, white
    hat, grey hat, newbies, hacktivists, elites, and more. Now, to help you gain a
    better understanding as to what grey hacking is, let’s first take a look at these
    other kinds of hacking, so you can get a feel for what it is hackers do, or can
    do, when they are online.


    ## Newbies


    The best place to start anything is at the beginning, which is why we are starting
    with the newbie hackers. The problem with a lot of newbie hackers is that they
    think they have it all figured out when they really don’t. The idea of hacking
    is really only scratching the surface when it comes to everything that is involved,
    and it is not at all uncommon for people who want to get into it to get overwhelmed
    when they see what really needs to be learned.


    Don’t let that discourage you, however, you are able to learn it all, it just
    takes time and effort on your part. Borrow books and get online. Look up what
    needs to be and remember it. Don’t rush yourself. You need to learn, and really
    learn. Anything that you don’t remember can end up costing you later.


    There are immediate reactions when it comes to the real world of hacking, and
    sitting there trying to look up what you should have already known is not going
    to get you far as a hacker. If you want to be good at what you do, then take the
    time required to be good at it.


    Don’t waste your time if you don’t think you really want to learn it, because
    it is going to take a lot of your concentration to get to the heart of the matter.
    Don’t get me wrong, it is more than worth it, but if you are only looking into
    it for curiosity sake, don’t do it unless knowing really means that much to you.


    Sure there are those that kind of know what they are doing, or they can get into
    their friend’s email account, but that is not the hacking I am talking about here.
    I want you to become a real life, capable hacker, and that isn’t going to happen
    unless you are willing to take the time needed to learn it, and put forth the
    effort to learn it.


    You have to remember that any hacker that is in existence had to start as a newbie
    hacker, and build up their skills from there. Now, as fast they built those skills
    depended greatly on how much time and effort they put into working on it, but
    don’t worry, you will get the hang of things, and while you have to start as a
    newbie, you will have Grey Hat status soon enough.


    ## Elites


    As with the newbie hackers, elite hackers can be any kind of hacker, whether that
    be good or bad. What makes them elite is the fact they are good at what they do,
    and they know it. There is a lot of respect for elite hackers online. Just like
    with elite anything, they know what they are doing, and they know that others
    can’t challenge them unless they too know how to handle themselves.


    There is a level of arrogance that goes with the status, but it is well deserved.
    Anyone can stop at second best, but it takes true dedication to reach the top.
    An elite hacker can use their powers for good or bad, but they are a force to
    be reckoned with either way. They know the way systems work, how to work around
    them, and how to get them to do what they want to.


    If you have a goal of becoming an elite hacker, you do have your work cut out
    for you, but don’t worry, you will get there. It only takes time and effort to
    get this top status, and it comes to those who want it. No one achieves elite
    status, it is something that they had to work for, but it is definitely worth
    all of the time and effort that is put into it. As an elite hacker, you won’t
    have to worry about whatever system you run into, you will know what is coming,
    and how you can work around it, it just comes with the line of work.


    ## Hacktivists


    Hacktivist hackers use their skills to promote a social or political agenda. Sometimes
    they are hired by specific groups to get into places online and gather information,
    sometimes they work all on their own. The point of this kind of hacking is to
    make one political party look bad, and the one that the hacker promotes to look
    good. Then, they either publish it elsewhere online, or they pass it along so
    others can see what the person has done or what they are accused of doing. It
    is a way for politicians to make jabs at each other, and it isn’t really playing
    the game fairly. The hacker then is either paid by the party that hired them,
    or, if they are working for themselves, they get to see the results of what they
    posted about the politician.


    The list of hackers and what they do is one that goes on and on, but they all
    can ultimately fit into three categories, being the black hat, white hat, and
    grey hats. No matter what kind of hacker they are on top of it, these are the
    three realms that are really all encompassing.

