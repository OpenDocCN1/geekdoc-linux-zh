- fmt: '

    Now that we have our downloaded Kali Linux file, presumably using the official
    ISO download to ensure it is free from malware, and with the proper ISO build
    in order to match the user’s hardware and software set – up, the next step is
    to actually begin the installation process. Of course, the installation is necessary
    in order to use Kali Linux, and there are multiple ways we can install Kali Linux,
    from the most basic method: placing it on the system’s hard disk drive; to more
    advanced methods, such as dual – booting Kali Linux with other operating systems.
    Let’s get started!


    ## Installing Kali Linux on your machine


    Let’s start with the most basic method of installation of the Kali Linux distribution:
    placing it on our system’s hard disk drive. By now, the user should have already
    ensured that their system hardware is compatible (as a reminder, Kali Linux supports
    `i386` / 32 – bit systems, `amd64` / 64 – bit systems, and `ARM` / `armel` / `armhf`
    systems). The next step is ensuring that the system hardware, in addition to having
    compatible system architecture, should also meet the minimum hardware requirements,
    which are as follows:


    ### Installing Kali Linux on your hard disk drive


    - Minimum of 20 gigabytes of free hard disk drive space for Kali Linux’s installation

    - Minimum of 1 gigabyte of random access memory (RAM) for `i386` and `amd64` –
    based architecture (The more RAM the system has, the better the performance)

    - Native CD – DVD drive support, or USB boot support


    Note as well that the `i386` default images have `PAE` kernels enabled by default,
    so they can be run on systems that have above 4 gigabytes of RAM. Once the system
    hardware matches the Kali Linux compatibility and performance requirements, the
    ISO that was downloaded or rebuilt should be burned to a DVD, or a USB stick with
    the Kali Linux Live installation media should be readied. Note that in case there
    is no CD – DVD drive support, nor USB boot support, another option exists, being
    the Kali Linux Network Install, which will be discussed in a following section.


    #### Installation Procedure


    Once everything is ready, i.e all the requirements are met, and the Kali Linux
    software has been prepared and is ready to be installed, the first step would
    be to insert the installation media and boot it / run it (through the USB boot
    or the CD – DVD drive). Booting the medium should result in a window appearing
    with multiple options, such as “Live (amd64)”, “Graphical Install”, or simply
    “Install”. The “graphical install” enables a GUI install, and the “install” initiates
    a text mode installation process.


    Once the installation method is selected, the window will then request the user
    to select their preferred system / software language, as well as place their country’s
    location. In addition, a prompt may come out to request the user to configure
    their keyboard for the appropriate key – mapping. Once the language – country
    combination has been selected, and the keyboard properly mapped, the next step
    will be to input the geographical location of the user. Pressing “continue” after
    this step will instruct the installer to begin the process of installing the image
    by copying it to the hard disk drive, as well as probing the network interfaces
    of the device.


    Once these steps are complete, the installer will request the user to input the
    host name of the system. The purpose of the host name is to identify the system
    to the network that it is connected to. The host name can be selected by the user,
    and can be changed in the future. The next step is to choose a domain name, which
    forms part of the computer’s address, found on the right side of the host name.
    This domain name is usually seen as the “.com”, “.edu”, “.net” suffixes. Note
    that this step is entirely optional, but if used, it would be prudent to ensure
    all the computers on the network share the same domain name to avoid errors or
    confusion.


    Once the host and domain name have been selected, the system will then prompt
    the user to provide a name for the user account. Note that this account will NOT
    have root access, and is meant to enable the system to have an account that can
    carry out non-administrative activities without admin – access for safety purposes.
    Upon providing a name, a user – ID will be created based on the given account
    name, but this ID can be edited to match the user’s preference.


    Once all the naming conventions have been set up, the system will check and configure
    the clock, by requesting for the time zone wherein the user is located. Note that
    this step still occurs even after having chosen the geographical location, and
    in fact it notes that in case the time zone the user is in is not listed, they
    can simply go back and choose the country they are currently located in.


    After choosing the partition, the system installer will prompt the user one more
    time to check whether or not their chosen configuration is what they really want,
    allowing the user to double – check their configuration options, as installing
    the Kali Linux software makes numerous disk changes, and making an error in installation
    may cost a lot of time and effort to reverse and / or remedy. Once the configuration
    is confirmed, the installer will begin installation on the partitioned drive,
    and the result will be a near – complete installation. After this, the network
    mirrors can be configured by the user, and as Kali makes use of a central repository
    for the distribution of applications, it is necessary to set the network mirrors.
    Note that it may be possible that the installer will require the user to enter
    proxy information in case their network makes use of a proxy.


    Once the network has been set up, one of the final steps is to install the “GRUB”
    boot loader in order to be able to boot Kali Linux. Note that in case there are
    no other operating systems currently installed, the user may choose to have `GRUB`
    as the master boot loader. In case of other operating systems, selecting `GRUB`
    as the master boot loader may render the other operating systems temporarily unbootable,
    but this may be fixed by manually changing the configuration later on in order
    to reset it. Once this is done, the user only has to reboot their system by clicking
    “continue”, and this should reboot and load the newly – installed Kali Linux operating
    system.


    ###### Installing Kali Linux over a network (Preboot Execution Environment)


    As earlier mentioned, the conventional method of installing Kali Linux requires
    either a USB boot capability or a CD – DVD drive that can be used for the installation
    media to be loaded on the system. A lot of the time, this method is used for business
    or enterprise Kali Linux deployments, where multiple devices need to have the
    Kali Linux distribution pre – loaded onto them in order for use. This pre – seeding
    can be done over the network, which is something useful especially when the devices
    have their USB and CD – DVD ports and drives disabled, as is common practice for
    business laptops and computers.


    The first step in getting the Kali Linux distribution installed over a network,
    through a `PXE` (pre – boot execution environment), is to install the `dnsmasq`,
    which provides the DCHP / TFTP server. Once the `dnsmasq` is installed, the next
    step would then be to edit the `dnsmasq.conf` file.


    The previous code installs the `dnsmasq`. The following snippet of code will then
    allow the user to enable the boot – up of the DHCP, TFTP, and PXE, as well as
    allow the user to set the `dhcp – range` to match the environment. In addition,
    the gateway as well as the DNS servers can be re – defined using the `dhcp – option`
    directive as needed.


    After all the necessary changes have been made, the `dnsmasq` must be restarted
    in order for these changes to properly take effect.

    '
