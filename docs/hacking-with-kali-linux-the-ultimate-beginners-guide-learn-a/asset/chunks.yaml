  raw: 'Android was developed by Google and is available as an open-source mobile
    platform. The majority of the malware written for mobile devices is for Android
    because it there are more avenues to attack it. The Android OS allows users to
    add software from third-party application stores as well as the official Google
    Play store. Malicious apps can come from either source, as Google does not put
    their apps through as strict a vetting process. The software on Android phones
    is susceptible to reverse-engineering, which increases the danger inherent in
    the platform. Also, a large number of Android phones do not come encrypted, making
    malware attacks easier to perform. Adware is popular malware for Android devices.


    [AndroidVulnerabilities.org](http://AndroidVulnerabilities.org) lists several
    exploits that fall into the categories of kernel, network, signature, and system
    vulnerabilities. 


    Apple


    Apple developed three mobile platforms iOS, tvOS, and watchOS. They are operating
    systems for iPhones, iPads, Apple TVs, and Apple Watches. There are fewer malware
    attacks on the Apple products due to the higher level of security and because
    the App Store is monitored heavily and it is hard to get malicious apps onto the
    App Store for any length of time. The Apple Mobile OSs does not allow for silent
    SMS which makes it is more difficult to spread malicious software. 


    Web Servers


    A web server is the computer, hardware, and software that stores information on
    a web service, and makes that information available either over LAN or the internet.
    Web servers hold large amounts of sensitive data such as social security numbers,
    credit card numbers, email addresses, and passwords. An example of a famous attack
    on a web server is the Equifax hack in 2017\. The hack exposed the personal data
    of millions of people including information about the victims’ credit. Hacking
    a web server is a complex attack. 


    Web servers have several vulnerabilities. These vulnerabilities include using
    default settings, the web server is misconfigured, exploiting bugs, or there is
    simply a lack of security. The types of web servers are:


    •          Apache: Apache web servers are the most commonly used. Apache typically
    is run on Linux.


    •          Internet Information Services (IIS): IIS is a web server for Windows.
    It is the second most used, after Apache.


    •          Other: There are other web servers on the market including Novell’s
    web server and Mac OS X server.


    Types of Attacks


    There are several types of attacks a hacker can use to crack a web server. These
    types of attacks include directory traversable attacks, DoS and DDoS attacks,
    domain name system hacking, sniffing, phishing, pharming, and defacement. Domain
    name system hacking is when an attacker changes the Domain Name System (DNS) settings
    so that the internet traffic for the web server is instead sent to the hacker’s
    web server. A pharming attack is when the attacker changes the DNS settings on
    the user’s computer. There are defacement attacks, which is when the attacker
    replaces a website’s webpage with another one that including the hacker’s name
    and whatever media the hacker chooses to post. Defacement is often done to build
    a hacker’s reputation.


    ## Tools to keep your system secure


    When you are just beginning, it is much easier if you have some help and these
    are some of the best software and hardware elements you can use to get started
    on your journey:


    Metasploit


    This is more of a hacking infrastructure that a complete set of exploit tools.
    With Metasploit, you can build your own hacking tools, suited to your purpose.
    It’s free to use and is, without a doubt, the most popular of all the cybersecurity
    tools that let you find vulnerabilities on different platforms. Metasploit has
    the backing of over 200,000 contributors and users to help you find all the weaknesses
    your system could have.


    Metasploit allows you to simulate a real-world attack on your own system and then
    tells you where your weak points are. It is a great tool for penetration testing,
    pinpointing the vulnerabilities using Nexpose closed-loop integration, providing
    Top Remediation reports for you.


    Supported Platforms:


    Metasploit works on all the major platforms, including Mac OS X, Windows, and
    Linux


    Acunetix WVS


    Acunetix is a WVS tool or a Web Vulnerability Scanner. It is used to scan a website
    and find any potentially fatal flaws. It is a multi-threaded tool that crawls
    websites looking for SQL injection, Cross-site scripting, and many other vulnerabilities.
    It is a fast tool, easy to use and can easily be used to find more than 1200 different
    vulnerabilities on WordPress sites. 


    Acunetix comes complete with a Login Sequence Recorder that lets you access areas
    of websites that are protected by passwords. The tool has AcuSensor technology
    that helps to cut down on false positives, making Acunetix one of the best tools
    of its type.


    Acunetix only works on Windows XP or above, no other platform


    Nmap


    Nmap is short for Network Mapper and it is a port scanner. It is free and it is
    open source and is one of the most popular of all port scanning tools. Nmap allows
    for highly efficient security auditing and network discovery. It is used for many
    different services and uses raw IP packets to find out what hosts are on a network,
    what services they offer, the details of those services, the operating systems
    used by the hosts and what firewall they use, amongst other things.


    Supported platforms include all the major ones such as Mac OS X, Linux, and Windows


    Wireshark


    Wireshark is one of the best-known packet crafting tools of all time and is used
    for finding vulnerabilities in networks and probing the rule-sets of firewalls.
    It is used by many thousands of professionals in the security world for analyzing
    networks, capturing deep pockets and carrying out deep scans on many protocols.
    Wireshark lets you read live data from the following protocols:


    ●    802.11


    ●    ATM


    ●    Bluetooth


    ●    Ethernet


    ●    FDDI


    ●     Frame Relay


    ●    IEEE


    ●    PPP/HDLC


    ●     Token Ring


    ●    USB


    ●     And many others


    Originally known as Ethereal, Wireshark is open source and free to use.


    Supported platforms include Linux, Mac OS X, and Windows


    oclHashcat


    If you are interested in password cracking then Hashcat is the free tool you need.
    It is CPU-based and oclHashcat is a more advanced version of the tool that makes
    use of your GPU power. It is known as one of the fastest password cracking tools
    in the world and is the first tool in the world to have the GPGPU-based engine. 


    One other major feature of oclHashcat is the fact that it is open source and under
    an MIT license; this means that integrating or packaging it is easy with the most
    common of the Linux distributions.


    Supported platforms include all different versions of Windows, Mac OS X, and Windows


    Nessus Vulnerability Scanner


    Nessus is one of the best free vulnerability scanners and it works with a client-server
    framework. It was developed by Tenable Network Security and is the most popular
    tool of its kind. Nessus works differently for different users, including tools
    called Nessus Professional, Nessus Cloud, Nessus Manager and Nessus Home. 


    Nessus can be used to scan several types of vulnerabilities, including misconfiguration
    alerts, remote access flaw detection, preparing for PCI DSS audits, detecting
    malware, Denial of Service attacks against TCP/IP Stack, searching for sensitive
    data and many others. Nessus is also able to externally call on Hydra, another
    highly popular tool.


    Apart from all this, Nessus can also be used for scanning multiple hybrid, IPv4,
    and IPv6 networks. Scheduled scans can be set to run when you want them and you
    can use a feature called Selective Host Re-Scanning to rescan all or some of the
    hosts previously scanned. The most popular Linux distributions, such as Kali,
    Ubuntu, Debian, etc., Windows and Mac OS X


