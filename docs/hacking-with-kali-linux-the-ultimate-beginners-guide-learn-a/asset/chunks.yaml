    # Malware


    Malware (malicious software) software or hardware tools that the Hackers use for
    penetrating of exploiting into the computer or network of others with the motto
    of retrieving personal or sensitive information from individuals are from an organization.
    Malware can also be used for disrupting or crippling the operation of a computer
    or network, given the attacker a chance to retrieve information by accessing it.
    These are specifically designed with the intention of causing harm to the entities
    they infect. Malwares usually we have against the requirements of user. Malicious
    software is of two types, the ones that cause unintentional harm and the ones
    that are specifically designed for causing harm. We use the term `badware` for
    defining them.


    Malware are designed to gather information, in stealth. They gather information
    without the consent or permission of the user and they are designed to work for
    extended periods of time. Without the proper tools, it is extremely hard to find
    them. They make themselves with system files. Some of their functionalities include
    causing harm, information retrieval, sabotaging the system and payment extortion.
    The inclusion software and hostile software both come under malware. They include
    software programs like viruses, Trojan horses, spyware, adware and other malicious
    software. Malware usually disguise themselves as non-malicious programs so that
    they can continue working in stealth. Basing on the recent studies, viruses and
    Trojans horses are the most widely used malware. Viruses are now being replaced
    with worms and of their numbers are declining recently.


    ## Types of Malware


    ### Adware

    Adwares to be the most lucrative and least harmful of the lot. They''re designed
    with the sole purpose of displaying advertisements on your computer.


    ### Spyware

    Spywares are designed to keep an eye on the user and to constantly spy on their
    activities. At all times, they keep track on the user activities. Basing on the
    user''s Internet activities, they display advertising accordingly. After gathering
    the required information, they team up with Adwares and what when the user goes
    online.


    ### Virus

    A virus, in computer science, can be defined as a contagious program or code.
    They select software and attached to them. This way, they can multiply by reproducing
    themselves. It is hard to detect a virus unless you have the proper tools. They
    can easily spread from programs, folders and files that are infected, using a
    network or through direct file sharing. For instance, if you plug-in a USB device
    to the infected computer, the virus will attach itself to the file transferred
    to the USB device and infects it. Any device connected to that USB will get infected.
    Viruses can also attach themselves to email attachments like text files, music
    files or videos. Once the second party downloads them, they will start infecting
    them too.


    ### Worm

    Worms are small and simple programs specifically designed for sabotaging the system
    files of an operating system, thus crippling the overall functionality of the
    system. They are similar to viruses in a lot of ways and they can also replicate
    themselves. They disguise as system files and hide in folders. They use up the
    system resources like hard disk space and processor, affecting the performance
    of the system by slowing down the processes and emptying the hard disk space.


    ### Trojan

    The main motive behind designing Trojan horses is to steal sensitive user information,
    including personal and financial information. Trojan horses, out of all malicious
    software, are considered to cause the most harm. They''re the most dangerous of
    the lot. Trojan horses are used as the major tool by attackers for performing
    denial of service attacks. They constantly track the user activities in the background
    and notifies the person who placed it, by creating and maintaining a complete
    log of user activities. Trojan horses can be hard to detect and they can stay
    hidden for very long periods of time. Some types of Trojan horses claim to delete
    viruses from the user''s computer, but in reality, they will be adding viruses
    of their own. The name Trojan horses came from the Greek mythology, where the
    Greeks used a wooden horse for deceiving the Trojans. They made a wooden horse
    and hid inside it. They left the wooden horse on the shores of Troy, as a sacrifice
    to the gods. The Trojans took the horse inside their tall walls, and it is when
    the Greeks attacked the city of Troy from within. If you think of it, did the
    Trojan horse is a good fit.


    ### Rootkit

    We know that every system has a firewall protecting it, which blocks most of the
    malicious software. Attackers designed the rootkit for compromising the firewall
    protection of a system. Rootkits do not directly infect the system, but they work
    as backdoors that allow other malicious software into the system. They hide themselves
    from the user and in the background they open gateways, so that other malware
    can enter. From the user''s point of view, it would seem like nothing is wrong.


    ### Keyloggers

    Keyloggers are designed with a specific purpose of recording the keystrokes of
    user. Whether online or offline, they continue to record and store the user inputs
    from the keyboard and when the user goes online, they will send it to the person
    who placed them. The initial versions of keyloggers could only store the keystrokes
    given from keyboard. The latest versions can even take the keystrokes from virtual
    keyboards. The Hackers use the information sent by keyloggers for retrieving user
    information like credit card details, email ids and passwords. Keyloggers cannot
    differentiate passwords from regular text and for this reason; they store everything
    and sends it to the hacker. The hacker will then try to retrieve password is from
    the obtained information.


    ### Ransomware

    Ransomware can be considered as infections present inside a system. They lock
    the computer from within, often displaying messages like “you have been locked
    from your system; follow the instructions given to unlock it”. Those instructions
    usually demand money from the victim. The attacker will only unlock the computer
    of the victim after getting the money. In most of the cases, the computer will
    be rendered useless if left locked.


    We will discuss about the above malware briefly in our next chapters.


    ## Vulnerability to malware


    Whenever we use the term system, it implies that it can be anything from a single
    application, single computer, a large group of computers connected over a network,
    an operating system or the network itself. So when we say that the system is attacked,
    it means that any of the above mentioned entities are attacked. Malware take advantage
    of these vulnerabilities for making their way into a system. Some of those vulnerabilities
    are mentioned below:


    ### Security issues in software

    The security defect in software is a major vulnerability that the malware take
    advantage of. Both big and small software are included in this and this means
    all software, right from simple programs to complex operating systems are in it.
    Software distributing companies constantly update their software after fixing
    the security vulnerabilities found. They do this by releasing patches.


    Some of the commonly found software vulnerabilities are present in the browser
    plug-ins. Using outdated plug-ins is not advised. You cannot say that your software
    is saying just by updating it, even after updating it might still have a few security
    vulnerabilities. Keeping the older versions of plug-ins even after updating with
    newer versions is not safe.

