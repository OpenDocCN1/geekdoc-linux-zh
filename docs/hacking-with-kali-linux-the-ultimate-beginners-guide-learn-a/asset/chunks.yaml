  trans: "\n\n这些加密系统使用不同的密钥来加密和解密信息。虽然涉及的密钥不同，但它们之间仍然存在逻辑和/或数学上的关系。无法使用与加密密钥完全无关的解密密钥来提取信息。\n\
    \n根据密码学家的说法，这种加密模式开发于 20 世纪。它的开发是为了克服与对称密钥加密系统相关的挑战。这种加密方案的主要特征是：\n\n* 加密系统的每个成员都应该拥有两个不同的密钥——一个公钥和一个私钥。当使用其中一个密钥进行加密时，另一个必须用于解密。\n\
    * 私钥被视为机密信息。每个成员必须时刻保护自己的私钥。另一方面，公钥可以与任何人共享。因此，公钥可以存放在公共仓库中。因此，一些人将这种方案称为“公钥加密”。\n\
    * 虽然私钥和公钥在数学上是相关的，但在实践中，通过其“伙伴”密钥来确定另一个密钥是不可能的。\n* 当 `Member1` 想要向 `Member2` 发送信息时，他需要做三件事：\n\
    \    * 从公共仓库中获取 `Member2` 的公钥。\n    * 加密信息。\n    * 将信息发送给 `Member2`。`Member2`\
    \ 将使用他的私钥获取原始信息。\n* 这种加密模式涉及更大、更长的密钥。这意味着与对称加密相比，它的加密和解密过程更慢。\n* 非对称密钥加密需要加密系统中计算机具有较高的处理能力。\n\
    \n对称密钥加密很容易理解。然而，非对称加密则非常困难。\n\n你可能在好奇加密和解密密钥是如何既相互相关，又能防止入侵者通过其“伙伴”密钥获取密钥的。这个问题的答案在于数学原理。今天，密码学家可以根据这些原理创建加密密钥。实际上，非对称密钥加密的概念是新颖：系统入侵者尚不熟悉这种加密的工作原理。\n\
    \n以下是与非对称密钥加密系统相关的主要问题：\n\n* 每个成员都需要信任该加密系统。他/她必须相信用于传输的公钥是正确的。这个人必须说服自己公共仓库中的密钥是安全的，不受系统入侵者的攻击。\n\
    \n为了确保加密系统的安全，公司经常使用涉及信誉良好的第三方机构的 `PKI`（公钥基础设施）。这个“外部组织”负责管理并证明系统中使用的密钥的真实性。第三方公司必须保护公钥，并向授权的加密系统成员提供正确的密钥。\n\
    \n由于两种加密方法的优缺点，商业组织将它们结合起来创建更安全、更实用的安全系统。\n\n# 第 12 章 使用 VPN\n\n如今大多数用户都有路由器，它们将手机、平板电脑和计算机等设备连接到互联网。你的互联网提供商会为路由器提供公\
    \ IP 地址，而每个连接到互联网的设备将获得一个私 IP 地址。路由器提供私 IP 地址。当你将计算机连接到互联网时，看起来就像你的电脑就是路由器。在用户只有一台电脑的情况下，他们可以直接连接到互联网，他们的\
    \ ISP 会为其分配一个公 IP 地址。由于分配的 IP 地址是公开的，另一端的主可以跟踪你的上网活动。\n\n## 使用虚拟专用网络隐藏 IP 地址\n\
    \n`VPN`（虚拟专用网络）允许用户连接到另一个网络。`VPN` 为你的计算机提供自己的 IP 地址。`VPN` 可用于隐藏你的原始 IP 地址，你的 ISP\
    \ 提供的 IP 地址将被隐藏。`VPNs` 不仅用于隐藏 IP 地址。你可以访问所在组织的任何网络，而该网络可能被某些网络阻断。互联网上有许多商业和免费的\
    \ `VPN` 及代理服务。使用这些服务，你可以用新的 IP 地址连接到互联网，你的原始 IP 地址将被隐藏。\n\n以下是一些虚拟专用网络提供商：\n\n\
    * Hide My Ass\n* ZenMate VPN\n* Express VPN\n* Pure VPN\n* Vypr VPN (免费试用)\n\n\
    ## 为什么要隐藏你的 IP 地址？\n\n隐藏 IP 地址有很多原因。以下是人们希望隐藏其 IP 地址的一些原因：\n\n* **向你的竞争对手隐藏身份**\
    \ - 在论坛上对竞争对手的产品发表评论会泄露你的身份。在这种情况下，你可以通过隐藏原始 IP 地址来隐藏身份。\n* **隐藏你的地理位置** - 并非所有的互联网内容对所有人开放。某些网站防止某些国家的用户访问其网站。在这种情况下，使用代理服务器将解决问题，你就可以访问那些网站。\n\
    * **防止网站跟踪** - 你访问的每个网页或网站都会跟踪你的数据。Web 服务器保存所有这些数据。你可以通过代理服务器隐藏 IP 地址，防止 Web 服务器跟踪你。\n\
    * **保护你的身份** - 如果你使用自己的 IP 地址浏览互联网，人们就可以监控你的敏感和隐私信息。如果攻击者知道了你的 IP 地址，你的位置、安全和隐私可能会被破坏。你可以使用他人的\
    \ IP 地址 own 自己的来保护自己和身份。有一些工具可以掩盖你的 IP 地址。它们使用由第三方提供的 IP 地址。\n\n## 使用代理掩盖 IP 地址\n\
    \n你可以使用互联网上提供的代理服务器匿名上网。有数千个代理服务器可以隐藏你的 IP 地址。当你使用代理服务器浏览时，意味着你是在间接访问网站。\n\n##\
    \ 使用他人的网络\n\n你可以利用免费 Wi-Fi 服务作为替代。免费 Wi-Fi 可以在咖啡馆和酒店等场所找到。IP 地址会随位置改变，当你从不同的地方连接互联网时，无法获得相同的\
    \ IP 地址。\n\n或者，你可以使用咖啡馆、酒店或任何公共场所提供的免费 Wi-Fi 服务。\n\n当你查看 IP 地址时，是否曾停下来想它在物理上位于哪里？你可能在好奇你使用的代理服务器是在你的管辖区内还是境外；或者你可能与某人进行邮件通信并确认他们是否如所言的那样。相反，你可能是一个试图追踪入侵系统或发送威胁邮件的嫌疑人的调查员。\n\
    \n查询 IP 地址的物理位置很容易，而无需申请搜查令。\n\n有一家名为 `MaxMind` 的公司。他们负责维护一个全球每一个 IP 地址的完整数据库，无论其位于世界何处，以及该位置的\
    \ `GPS` 坐标、区码、邮政编码和国家。这不是你通常的关系型数据库，它实际上是一个扁文件。为了更新数据库，`MaxMind` 请求 370 美元的站点许可费，然后每月\
    \ 90 美元或每年 1360 美元。\n\n"
