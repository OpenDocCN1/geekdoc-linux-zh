    \ complexities found within the network. However, no wireless network can be completely\
    \ secured. There are some things that are not complex but may still be considered\
    \ an obstacle. For instance, a plain old `AP` and a wireless `NIC` (interface\
    \ card) might not actually be complex, although you can deduce that a lot more\
    \ is going on at the backend\n\nThe `802.11` protocols aren’t developed to be\
    \ perfect because they have big issues. These protocols don’t simply help you\
    \ send and receive with optimal management overhead, like the old Ethernet. Rather,\
    \ the `802.11` protocols are deeply complex. Most of the wireless networks simply\
    \ transmit and receive `RF` (radio frequency) signals which carry a packet of\
    \ network data. The `802.11` network will actually perform more complex functions,\
    \ such as:\n\n- encrypting data to improve data privacy.\n- Authenticating clients\
    \ to be sure only authorized personnel have access to their network.\n- Setting\
    \ timing message packets to be certain about client synchronization and to help\
