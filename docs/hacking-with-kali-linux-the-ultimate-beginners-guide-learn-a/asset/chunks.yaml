    \ points and broadband routers have built-in firewall functionality. In such situation,\
    \ the `WAP` or router may have some ports where systems can be plugged into.\n\
    \n## CSU/DSUs\n\nKnown as Channel Service Unit/Data Service Unit, this device\
    \ plays the role of a translator between the WAN data format and the LAN data\
    \ format. The translation is absolutely necessary because WAN and LAN use different\
    \ technologies.\n\nSome people are of the opinion that a `CSU/DSU` is a digital\
    \ modem. However, unlike a modem that can easily change its signal from digital\
    \ to analog, this device changes signal from a digital format to another digital\
    \ format. \n\nA `CSU/DSU` is designed with a physical connection that can be used\
    \ for LAN equipment. This can be via a different connection for a WAN or a serial\
    \ interface. The `CSU/DSU` is not the regular networking equipment because it\
    \ is always kept separate from others. However, as more WAN links are used, router\
    \ manufacturers have seen the need to include the `CSU/DSU` functionality in their\
    \ routers. When they are not included, the manufacturers give the WAN expansion\
    \ capability to accommodate the `CSU/DSU`.\n\nIf you are a computer specialist\
    \ working in an organization, you might come across cases in which more than one\
