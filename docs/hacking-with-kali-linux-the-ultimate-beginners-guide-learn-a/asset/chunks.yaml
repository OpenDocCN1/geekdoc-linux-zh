  trans: '

    漏洞被定义为一种无意的软件缺陷，黑客可以利用其作为突破口，发送如特洛马、病毒、蠕虫等恶意软件。


    漏洞扫描器是一种非常高效的工具，用于检查网络或计算机系统中的弱点。它本质上是一个计算机程序。扫描器的唯一目的是访问网络、应用程序和计算机系统以寻找漏洞。黑帽黑客和计算机安全管理员（通常是白帽黑客或蓝帽黑客）都会使用这种工具。黑帽黑客利用它发现漏洞并从这些点获取未经授权的访问。白帽黑客也会检查漏洞，但他们这样做是为了保护计算机系统，而不是为了进入。


    数据通过端口传输。漏洞扫描器用于检查已开放或具有计算机系统访问权限的端口。这用于快速检查网络中具有已知漏洞的计算机。通过限制端口，防火墙可以防御计算机，尽管它仍然存在漏洞。


    ## 漏洞扫描器的优势


    - 早期发现问题

    - 能够轻松识别安全漏洞

    - 由于它可以显示漏洞，因此可以对其进行处理


    ## 漏洞扫描器的类型


    ### 端口扫描器


    端口扫描器专门设计用于搜索主机或服务器上开放端口的计算机应用程序。打算使用此工具的人应该具有 `TCP/IP` 的基础知识。攻击者利用它来识别运行在服务器或主机上的服务，意图是破坏它。而管理员则利用它来验证其网络的安全策略。端口扫描是一个向选定范围的端口发送请求的过程，目标是寻找活跃的端口。这只能发现漏洞，不能用于攻击或防御。这种扫描的大部分用途是探测而非攻击。可以使用端口扫描器扫描多个主机，以寻找特定的监听端口。这一过程被称为端口遍历（port
    sweep）。这些被专门用于特定类型的服务。其中一种是基于 SQL 的计算机蠕虫。它可能被用于扫描在 `TCP` 上监听的端口。


    端口扫描的类型：


    #### TCP 扫描


    当无法进行 `SYN` 扫描时，这些简单的端口扫描器会使用操作系统的网络功能。这是在我们通过 `Nmap`（在后面的章节中讨论）进行扫描时的情况。计算机操作系统将完成三次
    `TCP` 握手，然后立即关闭连接以避免 `DoS` 攻击。否则，将返回错误代码。这种扫描模式的优势是用户不需要任何特殊权限。然而，这种类型的扫描并不常见，因为操作系统的网络功能阻止了低级控制。此外，在使用端口扫描时，这种扫描被认为是“有噪音的”。因此，这种扫描不是首选方法，因为入侵检测系统可以记录发送者的
    IP 地址。


    #### SYN 扫描


    这也是 `TCP` 扫描的一种类型。在这里，端口扫描器将自行生成原始 `IP` 包并监控响应，而不是使用操作系统的网络功能。`SYN` 扫描被称为“半开放扫描”。之所以这样命名是因为永远不会建立完整的
    `TCP` 连接。`SYN` 包由端口扫描器生成。当发现开放端口时，扫描器将发送 `SYN-ACK` 包。主机将在通过响应 `RST` 包完成握手之前关闭连接。


    当我们使用原始网络时，有几个优势。它们是：


    1. 扫描器对发送的数据包拥有完全控制权。

    2. 连接不会被单个服务接收。

    3. 扫描器对响应时间拥有完全控制权。这种扫描优于 `TCP` 扫描。


    #### UDP 扫描


    `UDP` 扫描是一种无连接协议。虽然这种扫描是可能的，但存在技术挑战。关闭端口将收到一个 `UDP` 备份，端口将响应一个称端口不可达的 `ICMP` 响应。扫描器寻找
    `ICMP` 响应。如果主机没有响应，则端口是开放的。然而，如果主机受到防火墙保护，扫描器将收到一个表示存在开放端口的响应，这是错误的。`ICMP` 速率限制也会影响这种方法。如果消息被拦截，所有端口看起来都是开放的。对于这一点，我们可以发送某些特定特定的
    `UDP` 包作为替代，并希望生成应用程序层响应。


    #### 窗口扫描


    这种方法已经过时，很少使用。但窗口扫描是相当可靠的，可以判断端口是关闭还是开放、经过过滤还是未经过过滤的。如果主机系统上有防火墙，可以使用这种方法。


    #### 网络漏洞扫描器


    这种类型的扫描器识别连接到网络的计算机系统的安全漏洞，以确定该特定系统是否可以被利用或威胁。它是一个拥有已知缺陷数据库的软件。它通过测试系统以使这些缺陷发生，从而扫描计算机系统中的这些已知缺陷。然后它将对该特定计算机系统或给定企业生成所有这些发现的报告。


    #### Web 应用程序扫描器


    有很多方法可以检查架构缺陷和安全回退。其中一种方法是 Web 应用程序安全扫描器，它充当用户和应用程序之间的通信器并识别这些问题。扫描器可以执行许多测试来发现
    Web 应用程序中的这些漏洞。


    最常用的测试是黑盒测试。这意味着用户将不知道结果背后的逻辑，但将获得有关结果的清晰信息，从而提供所需的完整信息。大多数扫描器通过投掷现实场景中可能发生的随机测试用例并给出结果来进行分析。这些
    Web 应用程序深受用户欢迎，因为它们作为与系统通信的简单平台，因此用户界面在应用的中起着重要作用。


    用户可以使用这些应用程序执行多种操作；包括创建账户、根据标准查询数据库、添加大量内容以及进行不同类型的交易。当存储大量信息时，用户往往也会在应用程序中存储他们的一些个人信息。


    这看起来是一个简单、方便的选择，但数据安全受到破坏这一点是大多数用户往往忽略的。而这正是内部泄露和黑客获利的点。所以，用户不仅需要考虑便利，还需要检查他们在这些
    Web 应用程序上共享信息的范围。


    Web 应用程序扫描器有许多优点，以下是几个：


    - 它们对于最后的快速检查缺陷非常有用。

    - 它们可以检查相同场景给定不同输入时可能获得的大量结果，然后可以识别异常。


    用于 Web 应用程序测试的工具（如扫描器）独立于所使用的编程语言。因此，无论 Web 应用程序使用什么语言编码，工具都可以以自己的方式工作，动态地更改不同语言的输入。这赋予了用户完全自由地测试他们所有的应用程序。


    有优点的地方就有缺点。以下是几个缺点：


    '
- fmt: '

    - One of the major weaknesses of these tools is that the hackers use the same
    tools. So if the users are able to find flaws in the system, the hackers can find
    them easily, too. This poses a major threat to the community.

    - Many updates are being made to the languages that are used in designing web
    applications and most of the users use tools that are available for free. These
    free tools are normally built to a basic level, so new modifications and updates
    will not be available. Therefore, the random inputs that are being thrown at the
    system to find the anomalies will not have the updated inputs. This means there
    are a lot of potential threats that can be caused because of these missing inputs.

    - There is a high chance that the first few tools will have zero results; this
    causes high anxiety in the users, which will ultimately result in them using the
    new tools. This will cause the creation of new tools and the extinction of old
    tools.

    - The excessive use of the tools can also be a problem, as it will help the attackers
    to check their test cases theoretically. It makes it easy for them to send botnets.
    These cause spam in the web applications that might lead to information leakage.

    - The malware used by the attackers can be updated using these botnets. This type
    of updated malware can be very difficult to remove.

    - As already mentioned, the software that is being used in web application designs
    is constantly being updated and the tools that are being used are dynamically
    programmed depending on the language that is being used by the web application.
    No one can give a 100% guarantee that the results obtained belong to the whole
    source code. To get the complete coverage of the web application there are testers,
    called penetration testers, who carefully and closely analyze the results to verify
    that the entire source code of the web application has been covered.

    - The users must be aware that these tools will not be able to detect logical
    flaws in the source code, such as leakage of information and low level of encryption
    of the data.

    - These tools also have a difficult time detecting any technical flaws. It doesn''t
    mean that they are incapable of doing so, but the web application has to provide
    the right clues to enable these tools to identify the technical flaws.


    # Chapter 9. Web security


    As more devices that use web applications are released onto the market, such as
    mobile phones, tablets, and computers, hacking web applications has become more
    prevalent as there are more and more web applications available, each with its
    own bugs, exploits, and vulnerabilities. Hacking web applications becomes easier
    every day as hackers discover new exploits in web applications. Below are some
    forms of web application attacks.


    ## Fundamentals of Web security


    Session Hijacking is a type of cyber attack where the attacker exploits a web
    server’s session tokens. The hacker does this by exploiting a control mechanism,
    which controls the session tokens.


    Web servers must communicate with several different `TCP` connections. The server
    needs to keep track of the connections, so it issues a session token after the
    computer or device is authenticated. This token can be used in cookies, the header
    of an `http` request, or in the body of the header requisition.


    A session hijacking attacks the session token by predicting a token or by stealing
    one. Once the hacker compromises the session token it can exploit the following:


    - One kind of attack predicts the `ID` values and allows the hacker to get into
    a system without authentication.

    - A session sniffing attack happens when a user sends a request with a `session
    ID` to the web server, and the hacker intercepts the `session ID` and uses it
    to create their own requests on the web server, effectively hiding the attacker
    as a user.

    - A client-side attack is a type of attack that exploits the vulnerabilities in
    software clients such as web browsers, `pdf` reader/writers, instant messengers,
    and other software with vulnerabilities. IBM’s Knowledge Center (`www.ibm.com/support/knowledgecenter/en`)
    lists two types of client-side attacks. They are content spoofing and Cross-site
    scripting (`XSS`). Content spoofing is when a user thinks that the content on
    the site is valid and legitimate and not originating from external sources. `XXS`
    is when an attacker executes scripts in a browser.

    - A Man-in-the-middle attack (`MITM`) occurs when a hacker intercepts an `http`
    transaction. The attacker takes the `TCP` connection and splits it in two, allowing
    the attacker to read, function as a proxy, or modify the data in the message.
    A popular tool for MITM attacks is `Ettercap`.

    - Man-in-the-browser attacks are similar to MITM attacks, except they use a trojan
    horse to attack banking information like transactions and balances.


    ### SQL Injection


    SQL injection is when an attacker adds `SQL` queries into an input form on an
    application. The `SQL` statements are executed and allow the attacker to read
    sensitive data from a database, have admin access allowing it to shut down, modify
    the database, recover content in a file in the database, and issue commands to
    the `OS`. `SQL` injection is often used on financial data such as changing balances
    or voiding transactions. It also allows the attacker to spoof identity, disclose
    all of the data in the database, destroy data, or gain administer privileges of
    the database.


    ### Cross-Site Scripting (XXS)


    There are three types of `XXS` attacks: Stored or non-persistent `XXS`, Reflected
    or persistent `XXS`; and `DOM`-based `XXS`.


    - Stored `XXS` attacks happen when a user’s input is saved on a web server. This
    attack often occurs in a database, on forums, or in comments sections of a website.

    - Reflected `XXS` occurs when a message is returned from the web server with an
    error message or a search result that is sent to the client.

    - `DOM`-based `XXS` occurs when the data is in `DOM`, and the data does not leave
    the browser. `DOM` stands for `Document Object Model` and is an `HTML` and `XML`
    interface for documents.


    ### Wireless Networking


    Wireless networks are a set of multiple devices that communicate over radio waves
    within a certain range. Wireless networks let multiple devices connect to the
    internet via a modem and a wireless router. The router controls the settings of
    the wireless network including `IP` addresses, `MAC` addresses, the wireless network’s
    authentication, and other settings. Wireless routers use `IEEE 802.11`, which
    is a set of `MAC` addresses and physical layer settings. Attacks on wireless networks
    are generally sniffing attacks that attempt to obtain the `SSID` and gain access
    to the wireless network.


    ### Wireless DoS attacks


    Wireless networks are susceptible to two types of attacks. The first is physical
    attacks, and it occurs when there is radio interference from cordless phones.
    The second type of attack is a network `DoS` attack. A network `DoS` attack is
    easy to accomplish. Like other `DoS` attacks, it operates by sending multiple
    requests, in this instance to an Access Point. Because the requests are taking
    up resources and clogging the queue, legitimate devices cannot connect to the
    network with their requests.


    ### Mobile Platforms


    The majority of attacks on mobile platforms come in the form of malware for the
    different mobile platforms. The major mobile platforms are `Android` and `iOS`.
    `Android` is a mobile platform, and since `Android` devices have a large market
    share, there is a large number of devices to attack. Not all malware is installed
    via an app store, however, some malware attacks via a `QR` (Quick Response) code.
    Hacking mobile devices provide a wealth of information about the user. Hackers
    can access contacts, `GPS` data, the microphone, the camera, emails, `MMS` messages,
    and `SMS` messages.


    ### Android

