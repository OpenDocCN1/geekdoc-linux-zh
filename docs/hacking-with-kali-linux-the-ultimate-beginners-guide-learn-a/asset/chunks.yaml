    # Introduction:


    Given the prevalence of hacking, and the importance of being able to find these
    vulnerabilities in order to shore them up to protect the network and the data
    contained within, and prevent unauthorized access, tools have been developed with
    this in mind, tools which allow hackers to be able to better carry out their tasks
    with regard to network security such as activities like penetration testing, security
    auditing, and even computer forensics and reverse – engineering cyber – attacks.


    Kali is one such tool, being a Linux distribution structured on Debian that is
    designed specifically to aid “white hats” in carrying out their assigned tasks,
    featuring multiple specialized tools and other features that make it much easier
    for a “white hat” to do their job.


    What is a Linux Distribution?


    A Linux distribution, often shortened to “distro”, is a type of operating system
    built from a collection of software based upon the classic Linux operating system
    kernel, and usually includes a package management system. “Linux” as it is popularly
    known usually serves as a base for variants, which are often developed  specifically
    for the particular device that the user wishes to use, ranging from embedded devices,
    to personal computer solutions, and even to massive supercomputers, with the Linux
    system of packages differing depending on what type of platform they will be run
    on.'
