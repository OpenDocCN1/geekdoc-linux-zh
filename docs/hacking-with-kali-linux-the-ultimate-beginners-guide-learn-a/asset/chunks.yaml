- fmt: '

    Note that the creation of a dual – boot is not possible using the `PXE` system,
    meaning that native CD – DVD drive support or USB boot support is indispensable
    when creating the dual – boot setup.


    ## Creating a Partition


    In order to create a partition, the installation media should be booted – this
    means loading the downloaded Kali Linux ISO or booting the Kali Linux Live, whichever
    is applicable. Booting the medium should result in a window appearing with multiple
    options, such as “Live (amd64)”, “Graphical Install”, or simply “Install”. The
    `graphical install` enables a GUI install, and the `install` initiates a text
    – mode installation process. Once this is loaded and the menu has opened, the
    `Live` option should be selected. This `Live` option will boot up the Kali Linux
    desktop and allow the user to access some of the applications and tools.


    The tool that we are looking for here is the `GParted` program. The user should
    look for and launch the `GParted` program. Linux distribution.


    Once the `GParted` program has launched, there will be options available to the
    user. There will be a list of partitions, and the user has to select the partition
    that has Windows loaded on it. Where it is situated on the list will depend on
    the user’s configuration, but most configurations have it as the second and larger
    – sized hard disk drive partition. Once the partition containing the Windows boot
    is selected, simply right – click the partition and select `resize / move` in
    order to resize the partition in question. Resize it in such a way that there
    will be at least twenty gigabytes (`20 GB`) in the `unallocated` portion, as this
    will be used for the Kali Linux installation further on.


    Upon resizing, there should be a button on the application dashboard shaped like
    a green check – mark, which is an `Apply All Operations` button. Simply click
    this in order to finalize the partition. Once the partition has been finalized,
    simply exit the `GParted` application and reboot the system. This should re –
    size the hard disk drive and free up enough space for the user to install a fresh
    version of Kali Linux.


    ## Installation Procedure


    Once the hard disk has already been properly partitioned, simply run the installation
    media once again and select the `install` option. Follow the same steps as provided
    in the section of “Installing Kali Linux on your hard drive” with one key difference,
    notably the selection of the partition option, which will be shown in the next
    paragraph.


    Upon completion of the preliminary steps, i.e language, location, time zone, and
    keyboard mapping, the installer will now probe the system’s disks and offer five
    possible choices for installation. These choices are: guided – use the largest
    continuous free space (note that this is a non – default option that only shows
    up once a partition is created using the `GParted` application). Upon selection
    (in this case, “guided – use the largest continuous free space” option should
    be used), the system installer will now install the Kali Linux distribution on
    the previously `unallocated` space that we previously freed up by making use of
    the `GParted` application. The system installer will give the user the option
    to have “all files in one partitioned” as the default recommended option, but
    also allows for a separate `/home` partition as well as a separate `/home`, `/usr`,
    `/var`, and `/tmp` partition setup.


    ## How to work with Kali Linux


    Before a hacker can hack into a system, he or she must complete certain processes.
    Some of these are:


    ### 1. RECONNAISSANCE

    To avoid being hacked, you should keep your private information very secure. The
    word “reconnaissance” in this context is a means by which the hacker tries to
    gather all information regarding you (the target) and any weak spots in your system.
    The hacker uses this step to find as much information as possible about the target.


    ### 2. SCANNING AND ENUMERATION

    Scanning involves the use of intelligent system port scanning to examine your
    system’s open ports and vulnerable spots. The attacker can use numerous automated
    tools to check and test your system’s vulnerabilities.


    ### 3. GAINING ACCESS

    If the hacker was able to complete the two phases above, his/her next stage is
    to gain access to your system. This stage is where all of the hacker’s fun will
    begin. He or she will use the weaknesses discovered during the reconnaissance
    and scanning of your system to break into your connection. The hacker could exploit
    your local area network, your internet (both online or offline) or your local
    access to a PC. In the real sense, the moment a hacker breaks into your system
    or network, the hacker is considered to be the owner of that system. The security
    breach refers to the stage in which the hacker can use evil techniques to damage
    your system.


    ### 4. MAINTAINING ACCESS

    In the previous phase, we said that once a black hat hacker hacks your system,
    it is no longer yours. In this phase, after the hacker has breached your security
    access and hacked your system completely, he or she can gain future access to
    your computer by creating a backdoor. So even if you get access to that computer
    system or network again, you still can’t be sure you are in total control. The
    hacker could install some scripts that would allow access to your system even
    when you think the threat is gone.


    ### 5. CLEARING TRACKS

    The hacker gained access to your system and at the same time maintained access
    to that system. What do you think the hacker will do next? The hacker will then
    clear all of his or her tracks to avoid detection by security personnel or agencies
    so that he or she can continue using the system. In other cases, the hacker may
    do this just to prevent legal action against him or her. Today, many security
    breaches go undetected. There have been cases in which firewalls were circumvented
    even when vigilant log checking was in place.


    By now, you should have some insight into what hacking is all about. Now we will
    outline the fundamental security guidelines that will protect you, your system
    and your information from external threats.


    ### Update Your OS (Operating System)

    Operating systems are open to different types of attacks. On a daily basis, new
    viruses are released; this alone should make you cautious because your operating
    system might be vulnerable to a new set of threats. This is why the vendors of
    these operating systems release new updates on a regular basis, so that they can
    stay ahead of new threats. his will help improve your security and reduce the
    risk of your system becoming a host to viruses.


    ### Update Your Software

    In the previous section, we talked about the importance of an update. Updated
    software is equipped with more efficiency and convenience, and even has better
    built-in security features. Thus, it is imperative that you frequently update
    your applications, browsers and other programs.


    ### Antivirus

    Based on our research, we have seen that some operating systems are open to a
    lot of attacks, especially Microsoft or Windows platforms. One way you can protect
    your system from viruses is through an antivirus program. An antivirus program
    can save you in many ways. There are many antivirus programs (free or paid) that
    you can install on your system to protect against threats. A malicious hacker
    can plant a virus on your system through the internet, but with a good antivirus
    scan, you can see the threat and eliminate it. As with any other software or program,
    your antivirus software needs frequent updates to be 100 percent effective.


    ### Anti-Spyware

    This program is also important, as you don’t want trojan programs on your system.
    You can get many anti-spyware programs on the internet; just make sure you go
    for one that has received good ratings.

