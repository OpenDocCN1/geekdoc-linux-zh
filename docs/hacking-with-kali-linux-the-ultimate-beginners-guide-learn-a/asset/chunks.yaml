    -   这些工具的主要缺点之一是黑客也使用相同的工具。因此，如果用户能够发现系统漏洞，黑客也能轻易地发现它们。这对社区构成了重大威胁。

    -   设计 Web 应用的语言正在进行许多更新，而大多数用户使用的是免费的工具。这些免费工具通常只构建到基础水平，因此无法获得新的修改和更新。因此，向系统投递以寻找异常的随机输入将缺乏更新后的输入。这意味着由于这些缺失的输入可能会导致许多潜在威胁。

    -   前几个工具结果为零的概率很高；这会导致用户产生高度焦虑，并最终导致他们使用新工具。这将导致新工具的产生和旧工具的灭绝。

    -   过度使用工具也可能是一个问题，因为它可以帮助攻击者在理论上检查他们的测试用例。这让他们能够发送机器人网络。这些会在 Web 应用中产生垃圾信息，可能导致信息泄露。

    -   攻击者使用的恶意软件可以通过这些机器人网络进行更新。这种更新后的恶意软件可能很难删除。

    -   如前所述，用于 Web 应用设计的软件在不断更新，而所使用的工具根据 Web 应用所使用的语言进行动态编程。没有人能 100% 保证获得的结果属于整个源代码。为了获得
    Web 应用的完整覆盖，有被称为渗透测试员的测试人员会仔细并严密地分析结果，以验证 Web 应用的源代码已完全覆盖。

    -   用户必须意识到，这些工具无法检测源代码中的逻辑缺陷，例如信息泄露和数据加密级别低。

    -   这些工具在检测任何技术缺陷方面也存在困难。这并不意味着它们没有能力，而是 Web 应用必须提供正确的线索，以便这些工具识别出技术缺陷。


    # 第 9 章 Web 安全


    随着更多使用 Web 应用的设备（如手机、平板电脑和电脑）进入市场，攻击 Web 应用已变得日益流行，因为出现了越来越多的 Web 应用，每个应用都有自己的漏洞、利用程序和风险。随着黑客发现
    Web 应用中的新利用，攻击 Web 应用每天都变得更容易。以下是一些 Web 应用攻击的形式。


    ## Web 安全基础


    会话劫持（Session Hijacking）是一种网络攻击，攻击者利用 Web 服务器的会话令牌。黑客通过利用控制会话令牌的控制机制来实现。


    Web 服务器必须与多个不同的 `TCP` 连接通信。服务器需要跟踪这些连接，因此在计算机或设备通过身份验证后会发布一个会话令牌。该令牌可以用于 `cookies`、`http`
    请求的标头或请求头的主文。


    会话劫持攻击通过预测令牌或窃取令牌对会话令牌进行攻击。一旦黑客攻破了会话令牌，就可以利用以下内容：


    -   一种攻击预测 `ID` 值，允许黑客在无需身份验证的情况下进入系统。

    -   会话嗅探攻击（session sniffing attack）发生在用户向 Web 服务器发送带有 `session ID` 的请求时，黑客拦截了
    `session ID` 并使用它在 Web 服务器上创建他们自己的请求，从而有效地将攻击者伪装成用户。

    -   客户端攻击是一种利用软件客户端漏洞的攻击，例如 Web 浏览器、`pdf` 阅读器/写入器、即时通讯软件和其他具有漏洞的软件。IBM 知识中心（`www.ibm.com/support/knowledgecenter/en`）列出了两种类型的客户端攻击：内容欺骗（content
    spoofing）和跨站脚本（`XSS`）。内容欺骗是指用户认为网站上的内容是有效且合法的，并非来自外部来源。`XXS` 是攻击者在浏览器中执行脚本。

    -   中间人攻击（`MITM`）发生在黑客拦截 `http` 事务时。攻击者接管 `TCP` 连接并将其分成两部分，允许攻击者读取、作为代理运行或修改消息中的数据。用于
    MITM 攻击的流行工具是 `Ettercap`。

    -   浏览器中间人攻击（Man-in-the-browser attacks）与 MITM 攻击类似，不同之处它们使用木马来攻击交易和余额等银行信息。


    ### SQL 注入


    SQL 注入是攻击者在应用程序的输入表单中添加 `SQL` 查询。`SQL` 语句被执行后，允许攻击者从数据库中读取敏感数据，获得管理员权限以关闭、修改数据库、恢复数据库文件中文件内容，并向
    `OS` 发出命令。`SQL` 注入经常用于财务数据，例如更改余额或作废交易。它还允许攻击者伪造身份、披露数据库中的所有数据、破坏数据或获取数据库的管理员权限。


    ### 跨站脚本 (XXS)


    有三种类型的 `XXS` 攻击：存储型或非持久型 `XXS`、反射型或持久型 `XXS` 以及基于 `DOM` 的 `XXS`。


    -   存储型 `XXS` 攻击发生在用户的输入被保存在 Web 服务器上。这种攻击通常发生在数据库、论坛或网站的评论区。

    -   反射型 `XXS` 发生在 Web 服务器将带有错误消息或搜索结果的消息返回给客户端时。

    -   基于 `DOM` 的 `XXS` 发生在数据在 `DOM` 中且数据未离开浏览器时。`DOM` 代表文档对象模型（Document Object Model），是文档的
    `HTML` 和 `XML` 接口。


    ### 无线网络


    无线网络是指在特定范围内通过无线电波通信的一组设备。无线网络允许多个设备通过调制解调器和无线路由器连接到互联网。路由器控制无线网络的设置，包括 `IP` 地址、MAC
    地址、无线网络认证和其他设置。无线路由器使用 `IEEE 802.11`，这是一组 `MAC` 地址和物理层设置。对无线网络的攻击通常是嗅探攻击，试图获取
    `SSID` 并获得无线网络的访问权限。


    ### 无线 DoS 攻击


    无线网络容易受到两种攻击的影响。第一种是物理攻击，发生在由于无线电话产生无线电干扰时。第二种攻击是网络 `DoS` 攻击。网络 `DoS` 攻击很容易完成。与和其他
    `DoS` 攻击一样，它通过发送多个请求（在本例中发送到接入点）运行。由于请求占用了资源并阻塞了队列，合法设备无法通过其请求连接网络。


    ### 移动平台


    移动平台的大多数攻击以不同平台恶意软件的形式出现。主要的移动平台有 `Android` 和 `iOS`。`Android` 是一个移动平台，由于 `Android`
    设备拥有巨大的市场份额，因此有大量的设备。并非所有的恶意软件都是通过应用商店安装的，某些恶意软件通过 `QR`（快速响应）码进行攻击。破解移动设备可以提供有关用户的丰富信息。黑客可以访问联系人、`GPS`
    数据、麦克风、摄像头、电子邮件、`MMS` 消息和 `SMS` 消息。


    ### Android


