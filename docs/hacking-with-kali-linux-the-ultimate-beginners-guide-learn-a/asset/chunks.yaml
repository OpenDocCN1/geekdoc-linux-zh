  trans: '

    目前，加密系统分为两类：(1)对称密钥加密和(2)非对称密钥加密。这种加密系统的分类方法是基于整个系统使用的加密/解密方法。


    对称加密与非对称加密的主要区别在于加密密钥和解密密钥之间的关系。通常来说，所有的加密系统都涉及密切相关的密钥。不可能创建一个与代码加密密钥完全无关的解密密钥。让我们详细讨论每种加密系统：


    ### 对称密钥加密


    属于此类别的加密系统只有一个密钥。该密钥用于对发送的信息进行加密和解密。对称加密和系统的研究被称为“对称密码学”。有些人将对称加密系统称为“密钥”系统。流行的对称密钥加密方法有：`IDEA`、`BLOWFISH`、`DES`（数字加密标准）和
    `3DES`（三重 DES）。


    在 20 世纪 60 年代，100%的加密系统都使用对称加密。这种加密和解密信息的方法如此可靠高效，以在今天仍在在使用。专门从事通信和信息技术的企业认为对称加密是可用的最佳选择。由于这种加密相比非对称加密具有明显优势，它在未来仍将被继续使用。


    以下是对称加密加密系统的主要特征：


    - 在传输消息之前，发送方和接收方必须确定将要使用的密钥。

    - 必须定期更换密钥以避免对加密系统的任何入侵。

    - 必须建立一种稳定的数据传输形式，以便相关方之间方便共享密钥。由于密钥必须定期更改，这种机制可能会证明是昂贵且复杂的。

    - 在由 `x` 个人组成的组织中，为了方便任何两个成员之间的双向通信，整个系统所需的密钥数量使用公式推导出：`x * (x-1)/2`。

    - 使用的密钥通常较小（即通过涉及的位数来测量），因此与非对称系统相比，其加密和解密过程更快、更简单。

    - 这些加密系统不需要计算机系统具备高处理能力。由于使用的密钥小而简单，可以使用普通计算机来建立和管理加密系统。


    这是使用此类加密系统时通常遇到的两个问题：


    - **密钥确定** – 在传输任何消息之前，发送方和接收方必须确定一个特定的对称密钥。这意味着必须建立一种安全且一致的密钥创建方法。

    - **信任问题** – 因为所有参与人员都使用相同的密钥，对称密钥加密要求发送方信任接收方，反之亦然。例如，如果他们其中一人将密钥与未经授权的共享，整个加密系统的安全性将遭到破坏。


    现代通信者表示，这两个问题极具挑战性。如今，人们被与不可信且不熟悉的双方交换贵贵数据（例如卖家和买方的关系）。由于这些问题，密码学家不得不开发一种新的加密方案：非对称密钥加密。


    #### 对称加密算法的类型


    有许多类型的对称加密算法，包括：


    1. **Rivest 算法或 RC4**


    这种加密算法由 Ron Rivest 于 1987 年设计。它是一种流加密算法。它以简单和快速而闻名。但专家后来发现 `RC4` 存在多个漏洞，并且在某种程度上是不安全的。


    `RC4` 通常使用 64 位和 128 位的密钥。该算法在密码学上是强有力的，而且相对容易实现。`RC4` 或 `Rivest Cipher` 包含两个部分——伪随机生成算法和密钥调度算法或
    `KSA`。该算法最流行的实现是在 `SSL` 和用于 `802.11` 无线网络的 `WEP` 中。


    以下是 `RC4` 工作原理的图：


    ![Description: 00005.jpeg](img/Image00000.jpg)

    ![Description: 00006.jpeg](img/Image00001.jpg)

    ![Description: 00007.jpeg](img/Image00002.jpg)

    ![Description: 00008.jpeg](img/Image00003.jpg)

    ![Description: 00009.jpeg](img/Image00004.jpg)

    ![Description: 00010.jpeg](img/Image00005.jpg) ![Description: 00011.jpeg](img/Image00006.jpg)

    ![Description: 00012.jpeg](img/Image00007.jpg) ![Description: 00013.jpeg](img/Image00008.jpg)
    ![Description: 00014.jpeg](img/Image00009.jpg) ![Description: 00015.jpeg](img/Image00010.jpg)


    密密钥是用于加密和解密消息的密码。图中的 `RC4` 仅仅是加密引擎。所以发生的情况是，用户输入一个带有密密钥的明文文件。然后，加密引擎生成密钥流，并将明文位位地转换为密文。


    `RC4` 初始化一个包含 `256` 字节的数组，并在上面运行 `KSA` 或密钥调度算法。`KSA` 的输出随后插入伪随机生成算法中，该算法将生成密钥流。然后，密钥流将对数据执行
    `XOR` 操作并将其转换为密文。


    2. **RC2**


    `RC2` 也称为 `ARC2`。这也是由 Ron Rivest 设计的。它被 `Lotus` 支持。这是一个 `64` 位块密码，具有可变长度密钥。它使用以下交错序列进行轮处理：


    - 五轮混合轮

    - 一轮洗牌轮

    - 六轮混合轮

    - 一轮洗牌轮

    - 五轮混合轮


    `RC2` 使用密钥扩展算法。


    3. **RC6**


    `RC6` 也是由 Ron Rivest 设计的。该算法拥有 `RSA Security` 专利。它具有 `128` 位块大小，并支持 `192`、`128`
    和 `256` 位密钥大小。它还针对 `32-bit` CPU 进行了优化。泄露报告显示用于拦截互联网通信的 `NSA` 系统产生 `RC6` `UDP`
    流量。


    4. **Serpent**


    `Serpent` 是由 `Lars Knusen`、`Eli Biham` 和 `Ross Anderson` 设计的对称算法。它的块大小为 `128`
    位，支持密钥大小 `256`、`192` 和 `128`。`Serpent` 在安全性上具有保守的安全余量。


    `Serpent` 密码没有专利，属于公有领域。任何人可以在他们的硬件或软件中引入该算法。


    许多研究表明 `XSL` 攻击可以削弱 `Serpent`。


    5. **Twofish**


    `Twofish` 是由 `Counterplane Labs` 于 1998 年发布的对称密码。它具有 `128-bit` 块大小。密钥范围从 `128`
    位到 `256` 位。它还针对 `32-bit` CPU 进行了优化。Twofish 免许可且未申请专利，因此任何人都可以它。`Twofish` 的设计是为了满足
    `NIST`（美国国家标准技术研究院）的设计标准。它没有弱密钥。它在 `Intel Pentium` 以及其他硬件软件平台上也是高效的。它的设计灵活，因此接受额外的密钥长度。


    6. **DES**


    `DES` 代表 `数据加密标准`。这曾是加密电子数据最常用的对称密钥算法。它由 `IBM` 在 20 世纪 70 年代开发。它在 70 年代被 `NSA`
    使用，因此许多人怀疑该密码存在后门。在轮处理之前，块被分为两个 `32-bit` 半部分。这两个部分交替处理。这个过程被称为 `Feistel` 方案。


    `DES` 现在被认为是不安全的，主要因为其 `56-bit` 密钥大小太小。

