- fmt: "\nThese cryptosystems use different keys for encrypting and decrypting the\
    \ message. Although the keys involved are dissimilar, they still have a logical\
    \ and/or mathematical relationship. It is impossible to extract the message using\
    \ a decryption key that is totally unrelated to the encryption key.\n\nAccording\
    \ to cryptographers, this mode of encryption was developed during the 20th century.\
    \ It was developed in order to overcome the challenges related to symmetric key\
    \ cryptosystems. The main characteristics of this encryption scheme are:\n\n*\
    \ Each member of the cryptosystem should have two different keys – a public key\
    \ and a private key. When one of these keys is used for encryption, the other\
    \ one must be used for decryption.\n* The private key is considered as confidential\
    \ information. Each member must protect the private key at all times. The public\
    \ key, on the other hand, can be shared with anyone. Thus, public keys can be\
    \ placed in a public repository. As such, some people refer to this scheme as\
    \ “public key encryption.”\n* Although the private and public keys are mathematically\
    \ related, it is practically impossible to determine a key using its “partner.”\n\
    * When `Member1` wants to send information to `Member2`, he needs to do three\
    \ things:\n    * Obtain `Member2`’s public key from the public repository.\n \
    \   * Encrypt the message.\n    * Transmit the message to `Member2`. `Member2`\
    \ will acquire the original message using his private key.\n* This mode of encryption\
    \ involves larger and longer keys. That means its encryption and decryption processes\
    \ are slower compared to those of symmetric encryption.\n* The asymmetric key\
    \ encryption requires high processing power from the computers used in the cryptosystem.\n\
    \nSymmetric key encryption is easy to comprehend. The asymmetric one, however,\
    \ is quite difficult to understand.\n\nYou may be wondering as to how the encryption\
    \ and decryption keys become related and yet prevent intruders from acquiring\
    \ a key using its “partner.” The answer to this question lies in mathematical\
    \ principles. Today, cryptographers can create encryption keys based on these\
    \ principles. Actually, the concept of asymmetric key cryptography is new: system\
    \ intruders are not yet familiar with how this encryption works.\n\nHere is the\
    \ main problem associated with asymmetric key cryptosystems:\n\n* Each member\
    \ needs to trust the cryptosystem. He/she has to believe that the public key used\
    \ for the transmission is the correct one. That person must convince himself that\
    \ the keys in the public repository are safe from system intruders.\n\nTo secure\
    \ the cryptosystem, companies often use a `PKI` (Public Key Infrastructure) that\
    \ involves a reputable third party organization. This “outside organization” manages\
    \ and proves the authenticity of the keys used in the system. The third party\
    \ company has to protect the public keys and provide the correct ones to authorized\
    \ cryptosystem members.\n\nBecause of the pros and cons of both encryption methods,\
    \ business organizations combine them to create safer and practical security systems.\n\
    \n# Chapter 12. Using VPN\n\nMost users nowadays have routers, which connect the\
    \ devices like mobiles, tablets and computers to the Internet. The router will\
    \ be given a public IP address by your Internet service provider and each of the\
    \ devices that connect to the Internet will be given a private IP address. The\
    \ router gives the private IP address. Whenever you connect your computer to the\
    \ Internet, it will look like your computer is your router. In cases where the\
    \ users have only a single computer, they can connect it directly to the Internet\
    \ and their ISP will give a public IP address to it. Since the assigned IP address\
    \ is public, a host from the other end can track your Internet activities.\n\n\
    ## Conceal Your IP Address with a Virtual Private Network\n\n`VPN` (virtual private\
    \ network) allows the users to connect to another network. The `VPN` will provide\
    \ your computer with its own IP address. `VPN` can be used for hiding your original\
    \ IP address and your IP address provided by your ISP will be hidden. `VPNs` are\
    \ not just used for hiding IP addresses. You can access any network from your\
    \ organization, which may be blocked from certain networks. There are many commercial\
    \ and free `VPN` and proxy services available on the Internet. Using these you\
    \ can connect to the Internet with a new IP address and your original IP address\
    \ will be hidden.\n\nHere are some of the virtual private network providers:\n\
    \n* Hide My Ass\n* ZenMate VPN\n* Express VPN\n* Pure VPN\n* Vypr VPN (Free Trial)\n\
    \n## Why Would You Hide Your IP address?\n\nThere are many reasons for hiding\
    \ an IP address. Here are some of these reasons why people wish to hide their\
    \ IP addresses:\n\n* **Hide your identity from your competitors** - Commenting\
    \ on your competitors’ products on forums will reveal your identity. In such cases,\
    \ you can hide your identity by hiding your original IP address.\n* **Hide your\
    \ geographical location** - Not all the content the Internet is available to all.\
    \ Some websites prevent users from some countries from visiting their websites.\
    \ Using a proxy server in such cases will solve the problem and you can access\
    \ those sites.\n* **Prevent website tracking** - Every web page or website that\
    \ you visit will track your data. The web server saves all this data. You can\
    \ keep the Web servers from tracking you by using a proxy server to hide your\
    \ IP address.\n* **Protect your identity** - People can monitor your sensitive\
    \ and private information if you use your own IP address for navigating the Internet.\
    \ Your location, your security, your privacy can be breached if the attackers\
    \ know your IP address. You can use someone else's IP address instead of your\
    \ own to protect yourself and your identity from others. There are several tools\
    \ that can mask your IP address. They use the third-party IP addresses provided\
    \ by public companies.\n\n## Mask Your IP Address with a Proxy\n\nYou can surf\
    \ the web anonymously using the proxy servers available on the Internet. There\
    \ are a few thousand of these proxy servers that will hide your IP address. When\
    \ you are browsing using a proxy server, it means that you are accessing a website\
    \ indirectly.\n\n## Use Someone Else's Network\n\nYou can make use of the free\
    \ Wi-Fi services as an alternative. Free Wi-Fi can be found in public locations\
    \ like coffee shops and hotels. The IP address will change with the location and\
    \ you cannot have the same IP address when you connect to the Internet from a\
    \ different place.\n\nAlternatively, you may use free Wi-Fi services offered by\
    \ a coffee shop, hotel, or any public location.\n\nWhen you look at an IP address,\
    \ do you ever stop and wonder where it is located, in the physical sense? You\
    \ might be wondering if that proxy server you have been using is inside or outside\
    \ of your local jurisdiction; or perhaps you have been exchanging email correspondence\
    \ with someone and want to make sure they are where they claim to be. On the other\
    \ hand, you could just be an investigator who is trying to track a suspect who\
    \ hacked into a system or sent threatening emails.\n\nIt is easy to find out the\
    \ physical location of an IP address, without having to resort to getting a search\
    \ warrant.\n\nThere is a company by the name of `MaxMind`. They are responsible\
    \ for maintaining a complete database of every single IP address in existence,\
    \ no matter where it is in the world, together with the `GPS` co-ordinates of\
    \ the location, the area code, the zip or postal code and the country. This is\
    \ not your usual relational database, mind you; it is actually a flat file. To\
    \ update the database, `MaxMind` requests a site license fee of $370 and then\
    \ $90 per month or $1360 per year.\n"
