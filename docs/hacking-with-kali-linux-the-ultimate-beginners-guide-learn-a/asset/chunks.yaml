    Currently, cryptosystems are divided into two kinds: (1) Symmetric Key Encryption
    and (2) Asymmetric Key Encryption. This way of classifying cryptosystems is based
    on the method of encryption/decryption used for the entire system.


    The major difference between the symmetric and asymmetric encryptions is the connection
    between the encryption and decryption keys. Generally speaking, all cryptosystems
    involve keys that are closely related. It is impossible to create a decryption
    key that is totally unrelated to the code’s encryption key. Let’s discuss each
    kind of cryptosystems in more detail:


    ### Symmetric Key Encryption


    Cryptosystems that belong to this kind have a single key. This key is used to
    encrypt and decrypt the information being sent. The study of symmetric encryption
    and systems is known as “symmetric cryptography.” Some people refer to symmetric
    cryptosystems as “secret key” systems. The most popular methods of symmetric key
    encryption are: `IDEA`, `BLOWFISH`, `DES` (Digital Encryption Standard), and `3DES`
    (Triple-DES).


    During the 1960s, 100% of the cryptosystems utilized symmetric encryption. This
    method of encrypting and decrypting information is so reliable and efficient that
    it is still being used even today. Businesses that specialize on Communications
    and Information Technology consider symmetric encryption as the best option available.
    Since this kind of encryption has distinct advantages over the asymmetric one,
    it will still be used in the future.


    Here are the main characteristics of symmetrically encrypted cryptosystems:


    - Before transmitting the message, the sender and the receiver must determine
    the key that will be used.

    - The key must be changed regularly to avoid any intrusion into the cryptosystem.

    - A stable form of data transmission must be established to facilitate easy sharing
    of the key between the involved parties. Since the keys must be changed on a regular
    basis, this mechanism may prove to be expensive and complicated.

    - In an organization composed of `x` individuals, to facilitate two-way communication
    between any two members, the required number of keys for the entire system is
    derived using the formula: `x * (x-1)/2`.

    - The keys used are often small (i.e. measured through the number of bits involved),
    so the encryption and decryption processes are faster and simpler compared to
    those used for asymmetric systems.

    - These cryptosystems do not require high processing capabilities from computer
    systems. Since the keys used are small and simple, ordinary computers can be used
    to establish and manage the cryptosystem.


    Here are the two problems usually encountered when using this kind of cryptosystem:


    - **Key Determination** – Before any message can be transmitted, the sender and
    the receiver must determine a specific symmetric key. That means a secure and
    consistent way of creating keys must be established.

    - **Trust Issues** – Because all the people involved use the same key, symmetric
    key cryptography requires the sender to trust the receiver, and vice versa. For
    instance, if one of them shares the key with an unauthorized party, the security
    of the entire cryptosystem will be ruined.


    Modern day communicators say that these two concerns are extremely challenging.
    Nowadays, people are required to exchange valuable data with non-trusted and non-familiar
    parties (e.g. seller and buyer relationships). Because of these problems, cryptographers
    had to develop a new encryption scheme: the asymmetric key encryption.


    #### Types of Symmetric Encryption Algorithms


    There are many types of symmetric encryption algorithms, including:


    1. **Rivest Cipher or RC4**


    This encryption algorithm was designed by Ron Rivest in 1987. It is a type of
    stream cipher. It is known for its simplicity and speed. But, experts discovered
    later one that `RC4` has multiple vulnerabilities and it is insecure to some extent.


    `RC4` normally uses 64 bit and 128 bit key sizes. This algorithm is strong cryptographically
    and relatively easy to implement. The `RC4` or `Rivest Cipher` has two parts –
    Pseudo-Random Generation Algorithm and Key Scheduling Algorithm or `KSA`. The
    most popular implementation of this algorithm is in `SSL` and in `WEP` for `802.11`
    wireless networks.


    Here’s a diagram of how `RC4` works:


    ![Description: 00005.jpeg](OEBPS/Image00000.jpg)

    ![Description: 00006.jpeg](OEBPS/Image00001.jpg)

    ![Description: 00007.jpeg](OEBPS/Image00002.jpg)

    ![Description: 00008.jpeg](OEBPS/Image00003.jpg)

    ![Description: 00009.jpeg](OEBPS/Image00004.jpg)

    ![Description: 00010.jpeg](OEBPS/Image00005.jpg) ![Description: 00011.jpeg](OEBPS/Image00006.jpg)

    ![Description: 00012.jpeg](OEBPS/Image00007.jpg) ![Description: 00013.jpeg](OEBPS/Image00008.jpg)
    ![Description: 00014.jpeg](OEBPS/Image00009.jpg) ![Description: 00015.jpeg](OEBPS/Image00010.jpg)


    The secret key is the password that’s used to encrypt and decrypt the message.
    The `RC4` block in the diagram is nothing but the encryption engine. So what happens
    is that the user inputs a plain text file with the secret key. Then, the encryption
    engine generates a key stream and converts the plain text bit by bit into an encrypted
    text.


    `RC4` initiates an array of `256` bytes and runs the `KSA` or key scheduling algorithm
    on them. The output of the `KSA` is then plugged into the Pseudo-Random Generation
    Algorithm which will generate the keystream. Then, the keystream will perform
    `XOR` operation on the data and turn it into encrypted text.


    2. **RC2**


    `RC2` is also known as `ARC2`. This was also designed by Ron Rivest. It was supported
    by `Lotus`. It is a `64` bit block cipher that has variable size key. It uses
    de rounds using this interleaved sequence:


    - Five mixing rounds

    - One mashing round

    - Six mixing rounds

    - One mashing round

    - Five mixing rounds


    `RC2` uses the key expansion algorithm.


    3. **RC6**


    `RC6` was also designed by Ron Rivest. The algorithm is patented by `RSA Security`.
    It has a block size of `128` bits and it supports key sizes `192`, `128`, and
    `256` bits. It is also optimized for `32-bit` CPUs. Leaked reports show that the
    `NSA` systems that are used to intercept internet communications produce `RC6`
    `UDP` traffic.


    4. **Serpent**


    `Serpent` is a symmetric key algorithm that was designed by `Lars Knusen`, `Eli
    Biham`, and `Ross Anderson`. It has a block size of `128` bits and supports a
    key size `256`, `192`, `128`. `Serpent` has a conservative approach to security
    as it has a large security margin.


    The `Serpent` cipher is not patented and it is in public domain. Anyone is free
    to incorporate this algorithm in their hardware or software implementation.


    A number of studies show that the `XSL` attack can weaken `Serpent`.


    5. **Twofish**


    `Twofish` is a symmetric block cipher published in 1998 by `Counterplane Labs`.
    It has a `128-bit` block size. The key size ranges from `128` to `256` bits. It
    is also optimized for `32-bit` CPUs. Twofish is license-free and unpatented so
    anyone can use it. `Twofish` was designed to meet the design criteria of `NIST`
    (National Institute of Standards and Technology). It has no weak keys. It is also
    efficient both on the `Intel Pentium` and other hardware and software platform.
    It has a flexible design so it accepts additional key lengths.


    6. **DES**


    `DES` stands for `Data Encryption Standard`. This was once the most commonly used
    symmetric-key algorithm for encrypting electronic data. This was developed at
    `IBM` in the 1970s. This was used by the `NSA` in the 70s so many suspected that
    there is a backdoor to this cipher. Before the rounds, the block is classified
    into two `32-bit` halves. The halves are processed alternately. This process is
    known as the `Feistel` scheme.


    `DES` is now considered as unsecured primarily because of its `56-bit` key size
    which is too small.

