    这是因为这些不仅是黑客本身的行为，也是每一位黑客的共同特征。无论他们是在做善事、做坏事，还是在未经许可的情况下做善事，这些都是黑客行为的本质。


    ## a. 黑帽 (Black hat)


    黑帽黑客可能是黑客世界最著名的，或者说是最臭名昭著的。这是电影往往关注的黑客类型，也是让所有黑客名声狼藉的类型。


    黑帽黑客是指进入系统或网络以造成危害的黑客。他们总是带有恶意意图，目的是伤害和破坏。他们通过窃取东西来实现这一点，无论是个人信息、网络代码或其他任何他们发现的有价值的东西，或者也可以通过向系统中植入蠕虫和病毒来实现。历史上，曾有病毒被植入各种系统，导致了价值数十万美元的损失，并让系统瘫痪数日。


    病毒是黑客创建并分发的程序，它们会对它们能控制的任何东西造成破坏。它们通常会伪装成某种东西，并诱导你以任何他们可能的方式打开它们。


    然后，一旦你打开了链接，它们就会进入你系统的硬盘，并在里面随心所欲地活动。许多病毒的行为就像有自己的思想一样，它们能造成的伤害会让你大惊。


    有一种特定的病毒被称为 `backdoor`（后门）病毒，它允许发送者访问并控制它所植入的任何系统。这就像系统的所有者仅仅是一个旁观者，只能眼睁睁看着病毒对系统造成破坏而无能为力。


    黑客出于多种原因使用这些病毒，但没有一种理由对你有好处。当黑客获得你电脑的访问权限时，他们可以在上面做任何他们想做的事。


    他们可以获取你的个人信息，并将其用于自己的获利。他们可以盗取你的身份，在你的电脑上进行非法活动，从而让这一切看起来是你干的，并通过将所有责任推卸给你来逃脱嫌疑。


    这些病毒很难剔除，因此在开始时尽一切努力保护自己以确保不感染其中任何一种病毒，是至关重要的。然而，如果你确实感染了病毒，仍然是有希望的。你可能需要删除系统的很多内容，或者将其关闭并完全重启，但这样做总比让黑客访问你正在进行的任何操作要好。


    黑帽黑客是有恶意的。他们所做的一切都是为了伤害他人和制造麻烦。遗憾的是他们以此所为，因为这让黑客行为陷入了负局面，但仍有希望，因为只要有坏事发生，就能发现一些好事，而这种好事以白帽和灰帽黑客的形式存在。


    ## b. 白帽 (White hat)


    白帽黑客和灰帽黑客非常相似，但存在关键区别，使他们属于不同的类别。白帽黑客是由网络或公司聘佣进入系统并刻意尝试黑客攻击的人。


    此举目的是测试系统或网络的弱点。一旦他们能够看到黑客从哪里进入，他们就可以修复它，并让黑帽黑客破解变得更加困难。


    他们通常通过被称为“渗透测试”（Penetration Testing）的形式进行测试，但我们稍后会详细讨论。白帽黑客进入其所在的系统时总是拥有权限，他们的唯一目的就是寻找漏洞。


    这项工作的需求很高，以至于有白帽黑客将其作为全职工作。系统越多，尝试破解的黑客就越多。尝试的黑客越多，公司越需要白帽黑客将他们挡在外面。


    公司对聘佣谁并不挑剔，因此如此多的黑客选择走黑帽之路是令人惊讶的。他们本可以通过为人工作并根据工作获得报酬来赚取丰薪，但遗憾的是，并没有人这样看待问题，他们宁愿为了自己的私利进行黑客，也不愿做对他人有帮助的事。


    简单来说，这可以分解为一种非常基础的关系：黑客客试图进入，白帽黑客试图将他们挡在外面。有时黑帽占据上风，有时则轮到白帽。


    这就像是反派与超级英雄之间相互依赖的关系，你支持其中一方，但另一个偶尔也能得到他们想要的东西。


    这是一个最终会解决的大圆圈。当然，如果黑帽黑客从一开始停止入侵系统，情况会简单得多，但遗憾的是这不会发生。


    ## c. 灰帽 (Grey hat)


    世界往往被描绘为充满了对错的选择。你可以用一种方式做，也可以用那种正确方式以外的任何方式做……从而让你变成错误的。


    对与错，黑白。然而……那些规则的例外呢？几乎每种规则都有例外，黑客行为也不例外。灰帽黑客就属于这个领域。


    他们所做的事是正确的还是错误的，取决于个人的决定。为了澄清我的意思，请这样想：黑帽黑客在未经许可的情况下进入网络以造成伤害。这是坏的，非常坏。白帽黑客在许可的情况下进入系统以提供保护。这是好的，非常好。


    但接着你就有了灰帽黑客了。灰帽黑客在未经许可的情况下进入系统……这是坏的，但他们进入该系统是为了帮助公司或网络……这是好的。所以，简而言之，灰帽黑客使用坏的方法做善事。重要且普适的事实是，灰帽黑客从不对对系统做任何恶意的或坏的事，事实上，对于负责人来说，他们所做的一切和白帽黑客做得一样好。在接下来的章节中，我们将介绍你如何成为一名灰帽黑客，如何进入任何你喜欢的网络，以及你如何帮助运行网络的人。


    # 第 2 章 黑客过程 (Hacking process)


    '
- fmt: "\nWiFi hacking is one of the most basic forms of hacking, and is usually taught\
    \ to beginner white hats to get them familiar with the process. The first step\
    \ is to find a wireless network to hack: remember that “just trying” or “I’m learning”\
    \ is not an excuse, and any unauthorized access or attempt to access without authorization\
    \ may be punishable, so best that you ask permission, or better yet, simply create\
    \ your own wireless network for convenience. \n\nNow that we have a wireless network\
    \ to work with, the next step is to find out the name of your own device’s wireless\
    \ adapter. Note that there are a couple of terms that we should be familiar with:\
    \ “eth – ethernet”, and “wlan – wireless local area network”. The “wlan” is what\
    \ we’re looking for, so keep an eye out for that. Boot up your Kali Linux terminal\
    \ and type in `ifconfig`, which should show us a lsit of all the terminals of\
    \ our computer. Take note of the “wlan” adapter, along with the suffix, which\
    \ is usually 0 / 1 / 2. \n\nNow that we have our wireless adapter, we now have\
    \ to enable monitor mode. The user can employ a tool called `airmon – ng` to create\
    \ a “mon” virtual interface. This can easily be done by typing \n\n```\nairmon\
    \ – ng start wlan0\n```\n\nThis should create a monitoring interface, which would\
    \ be named by default as - mon0 if using an earlier version of Kali Linux, but\
    \ if using the Kali Linux 2.x onwards, the name would be `wlan0mon`. \n\nOnce\
    \ the monitoring interface is up, we can begin to attempt to capture data packets\
    \ that are being transmitted by the wireless network that we are trying to crack\
    \ into. The following tool should help us gather data: \n\n```\naidump – ng wlan0mon\n\
    ```\n\nThat should allow us to access a few data packets. If we want to save the\
    \ data in a file, which we do, we add another command to the end, “write filename”,\
    \ so it should look like the following: \n\n```\naidump – ng wlan0mon - - write\
    \ filename\n```\n\nThat will store any captured packets in `filename.cap`. Once\
    \ we have about ten thousand data packets minimum stored, we can proceed with\
    \ the wifi cracking process. \n\nNow that we have our data packets, we can open\
    \ another terminal and type in: \n\n```\naircrack – ng filename-01.cap\n```\n\n\
    This should begin the cracking process, or, if there are multiple wireless networks,\
    \ the program will ask which wireless network will be the target of the crack.\
    \ Note that if there are multiple wireless networks, the amount of captured data\
    \ packets needed may be even higher. If the password is fairly weak, then the\
    \ password should appear in the following format: \n\nXx :: xx :: xx :: xx ::\
    \ xx :: xx :: xx … \n\nRemove the colons (so it will be “xxxxxxxxx”), and that\
    \ should be the password of the wireless network. If the data packets captured\
    \ aren’t enough, then the program will tell you so, and you have to gather more\
    \ data packets to have enough to crack into the wifi. \n\nOne of the more common\
    \ attacks, as earlier discussed, is SQL injection in order to gain access to a\
    \ website or a database. Though the reader should know this by now, just for review:\
    \ SQL is a structured query language that allows the computer to manage data,\
    \ in order to store, manipulate, and retrieve data from the server or system database.\
    \ The database is the repository of all the data, often containing passwords and\
    \ other sensitive information. \n\nSo what is SQL injection? SQL injection is\
    \ a way of injecting queries into the database. Now the database is specifically\
    \ meant to answer queries, but only from authorized sources. SQL injection is\
    \ a method wherein external queries, from unauthorized sources are granted access\
    \ to the database. This is done through “inserting” them into the normal flow\
    \ of data queries in order to disguise them as authorized requests for information.\
    \ This allows the hacker to retrieve the information in the database, whether\
    \ it be passwords, encryption keys, or even raw data. There are also some SQL\
    \ injection methods that not only allow for retrieval of information, but even\
    \ insertion of malware or other files, which may allow the hacker in question\
    \ to control the database, either locking out the owner or even deleting some\
    \ or all the files within. Needless to say, SQL injection is one of the preferred\
    \ methods of attack by many hackers. \n\nNow, “white hats” can duplicate some\
    \ types of methods of SQL injection by trying to find vulnerabilities. One of\
    \ the tools available to a white hat running the Kali Linux distribution is “metasploitable”,\
    \ a virtual linux machine that will allow a person to practice gaining access\
    \ and looking for vulnerabilities using the SQL injection method. \n\nThe “metasploitable”\
    \ virtual machine is available online, or may even be contained in the bundle\
    \ or installation of your Kali Linux. It should include various duplicates of\
    \ web applications that have vulnerabilities, something that will help the “white\
    \ hat” learn how to find vulnerabilities and how access to them is gained, which\
    \ in turn can help the network security professionals find a way to shore up those\
    \ vulnerabilities by patching them out or developing workarounds. \n\nAfter installing\
    \ or opening the “metasploitable” virtual Linux machine machine, the user can\
    \ login, with the default username and password of the application being set to\
    \ “msfadmin”. Once logged in, the user should change the application’s network\
    \ settings to “bridge”, and restart the machine in order to make sure that the\
    \ changes have properly taken effect.\n\n## How to remove hacking traces\n\nThis\
    \ the climax of the penetration attack. The hacker now has access to the resources\
    \ available on the database of the organization. The hacker is then free to either\
    \ extract the information that he sees of value or he is able to take control\
    \ of the network and use it as a base to launch further attacks against other\
    \ targeted networks in how we described a DoS attack. By gaining access to the\
    \ network, the hacker now has control over one or more devices. \n\nAs was the\
    \ case in the preventative measures of scanning, there are some precautions that\
    \ administrators and security personnel are able to take to ensure that devices\
    \ and services are more challenging to access by legitimate users such as black\
    \ hat hackers. This can involve restricting access of users such who have no legitimate\
    \ day to day requirement to be accessing the devices. Furthermore, security managers\
    \ should be closely monitoring the domains and those who are accessing services\
    \ such as local administrators. Using physical security controls will allow managers\
    \ to detect attacks that are occurring in real time and can deny access while\
    \ also alerting the proper authorities to ensure the intruder is exposed. \n\n\
    Another approach which can be taken to ensure that access is denied is to encrypt\
    \ highly sensitive and confidential information using protection keys. This would\
    \ mean that any attacker attempting to access the system regardless of how well\
    \ the system is protected, will gain access only to find that the information\
    \ is scrambled and with the keys protected, the attacker would have no reliable\
    \ method for using the data that has been encrypted. Encryption is a good final\
    \ line of defence for particularly valuable data however it cannot be relied upon\
    \ entirely in itself. Even if the attacker was to access the system and discover\
    \ that the data is encrypted, they can still wreak havoc on the network and even\
    \ disable it, causing significant damage as a means of sabotage. Even more alarming,\
    \ the attacker could have control over the system and use it for further crimes\
    \ which could be traced back to the organization's network.\n"
