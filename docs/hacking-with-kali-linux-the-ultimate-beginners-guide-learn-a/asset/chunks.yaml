    ## Complex-Coordinated

    At the higher end of the scale, coordinated and complex attacks can have a devastating
    effect on the system under attack with mass disruptions against integrated and
    heterogeneous defences. These types of hackers have the ability to create sophisticated
    hacking tools and have a strong command and control as well as an advanced capacity
    for further learning and skill development.


    Understanding each type of attack allows organizations to develop the proper counter
    measures to combat and prevent an attack as well as implement damage control in
    the wake of an attack.


    ### Incursion

    The objective of an incursion attack is to gain access or penetrate the networks
    and systems which contain valuable information for the attacks. This is one of
    the more common attacks and has a much greater success rates for the terrorists.
    Due to the high number of loopholes available to hackers, terrorists are able
    to take advantage of weak security and vulnerabilities to obtain or even modify
    secure information which can then be recycled for further attacks against the
    organization or for the personal gain of the attackers.


    ### Destruction

    This is a far more severe attack with the objective to infiltrate a computer system
    and inflict damage and ultimately destroy the network. For the organizations who
    are victim to these types of attacks, there can be incredible costs involved both
    in terms of repair and loss of revenue. An attacker intent on destruction can
    render an organization inoperable with their entire system thrown into disarray,
    impacting them financially and in some cases destroying their reputation as clients
    fear the security of their information following a serious attack. In terms of
    governments, a destruction attack can plunge the systems into chaos. It can take
    some amount of time for an organization to recover fully from the most severe
    destruction attack, as is the objective for the hacker.


    ### Disinformation

    Equally devastating can be that of disinformation. This involved spreading credibility
    destroying rumours and information, having a severe impact on the target. The
    rumours that are launched may or may not be true however they can be equally devastating
    and can still have long term effects on the organization or nation involved. Once
    these attacks are carried out, damage control can be quite challenging as information
    can spread regardless of whether the infiltration is contained. Information can
    relate to certain scandals and claims of corruption which can tarnish the reputation
    of individuals within the organization or the organization itself, leading to
    disruption of the order that has held the organization together.


    ### Denial of Service

    We have mentioned denial of service earlier in this book as it one of the most
    common and widely known forms of attack. In terms of cyberterrorism, `DoS` attacks
    occur with businesses and entities that have an online presence with the attack
    rendering the website or service useless at the time of the attack. These types
    of attacks can therefore cause immense issues in both the social and economic
    function of the business, causing organizations to suffer massive losses.


    ### Defacement of Web Sites

    While not as severe or damage, the defacement of a website can still have immense
    consequences for a business. Defacement of websites can involve websites to be
    changed completely, including a message from cyber terrorists for either propaganda
    or publicity purposes for them to achieve some type of cause. In other cases,
    hackers may cause the website to redirect to one in which they have established
    earlier which could also contain a message that they have devised to gain publicity
    and awareness of their propaganda or cause. These types of attacks have decreased
    in recent years as security measures have been heightened and hackers have a lower
    probability of access to web pages long enough to implement the changes and most
    major organizations effectively putting a stop to it.


    ## Intro to VPN’s

    It is possible to hack a computer or a system using its `IP` address. The steps
    are given below.


    1. Obtain the `IP` address of the target system. E.g: `101.23.53.73`.

    2. Download the advanced port scanner and install it.

    3. Open the install the software and enter the `IP` address of the target in the
    right column. After entering the `IP` address, click on `scan`.

    4. Now, it will scan and will provide you with the list of all open ports on the
    target system or target router. E.g: `Port 96`.

    5. How the application will ask you to enter the login information, type the username
    and password and press enter. In case if there is no password, just give the username.


    With this, you will be able to access the documents and files on the target''s
    system. You can use `command prompt` for copying, creating or deleting files.


    ## Hiding

    Nowadays, most of the users have `Wi-Fi Routers`. All of the devices like mobile
    phones, laptops, tablets, televisions, etc, connect to the `Wi-Fi router`. The
    Internet service provider will provide the router with a public `IP` address.
    Any device connected to the router will be given a private `IP` address. If you
    connect to the Internet from your device, your router will look like your computer.
    In some cases, the users only use one device and they won''t need a router. Then,
    the computable directly connect to the Internet and the public `IP` address will
    be given to that single system. The host from the other end can track your Internet
    activities, as your assigned `IP` address is public.


    ### Conceal your IP address with a Virtual Private Network

    If you want to hide your `IP` addresses, you can use the service of a `VPN`. `VPN`
    stands for `Virtual Private Network`. It is a private network that allows the
    users to connect to the internet or another network without revealing the actual
    `IP` address of the user’s system. The `VPN` assigns its own `IP` address to the
    user’s computer. The `IP` address assigned by the Internet Service provider will
    not be provided and remains hidden.


    The following are some popular Virtual Private Network providers:

    * `Hide My Ass`

    * `Pure VPN`

    * `Vypr VPN (Free Trial)`

    * `ZenMate VPN`

    * `Express VPN`


    ### Protect your identity

    If you are using your own `IP` address for surfing on the Internet, there are
    chances for the attacker to monitor your sensitive information. There can be a
    breach in your privacy, security and location if the attackers get hold of your
    `IP` address. You can solve this problem by using the `IP` address of other users.
    This way, you can protect your identity and yourself from attackers. There are
    several tools available which will help you to mask your `IP` address.


    ### Mask your IP address with Proxies

    There are many proxy servers on the Internet and you can make use of them to surf
    anonymously. If you use a proxy server to visit a website, your original `IP`
    address will be hidden and a new `IP` address will be given to you. However, the
    `IP` address given to you will be a temporary one. In other words, using a proxy
    browser lets you access websites indirectly.


    ### Use someone else''s network

    Instead of using your own Internet, you can actually use free `Wi-Fi` as an alternative.
    There are many hotels and coffee shops that provide their customers with free
    `Wi-Fi`. If at all you connect to the Internet from a different location, the
    `IP` address with which you are connecting will also change. This is because different
    locations have different `IP` addresses.

