    # 恶意软件


    恶意软件（malicious software）是黑客用于渗透或利用他人计算机或网络的软件或硬件工具，其口号通常是从个人或组织中获取个人或敏感信息。由于恶意软件也可用于破坏或瘫痪计算机或网络的运行，让攻击者有机会通过访问系统来获取信息。这些工具的设计意图是为了对它们所感染的实体造成危害。恶意软件通常违背用户的需求。恶意软件分为两类：引起无意危害的和专门设计用于造成危害的。我们使用
    `badware` 一词来定义它们。


    恶意软件的设计目的是隐地收集信息。它们在未经用户同意或许可的情况下收集信息，并被设计为长时间运行。如果没有适当的工具，极其难以发现。它们伪装成系统文件。它们的一些功能包括造成危害、信息检索、破坏系统和勒索软件。包含软件和敌对软件都属于恶意软件。它们包括病毒、特洛马、间谍软件、广告软件等恶意软件程序。恶意软件通常伪装成非恶意程序，以便能够继续隐蔽地工作。根据最近的研究，病毒和特洛马是最广泛使用的恶意软件。病毒现在正被蠕虫取代，且其数量近期有所下降。


    ## 恶意软件类型


    ### 广告软件 (Adware)

    广告软件是所有类型中最获利且危害最小的。它们的设计唯一目的是在你的计算机上显示广告。


    ### 间谍软件 (Spyware)

    间谍软件的设计目的是监控用户并不断监视其活动。它们随时跟踪用户的活动。根据用户的互联网活动，它们会相应显示广告。在收集所需信息后，它们与广告软件合作，并在用户在线时行动。


    ### 病毒 (Virus)

    在计算机科学中，病毒可以定义为一种具有传染性的程序或代码。它们选择软件并附着在上面。通过这种方式，它们可以通过自我复制来繁殖。除非你有适当的工具，否则很难检测到病毒。它们可以通过网络或直接文件共享地从受感染的程序、文件夹和文件中传播。例如，如果你向受感染的计算机插入
    USB 设备，病毒将附着在传输到 USB 设备的文件并感染它。连接到该 USB 的任何设备都会被感染。病毒还可以附着在电子邮件附件上，如文本文件、音乐文件或视频。一旦对方下载了它们，它们也会开始感染对方。


    ### 蠕虫 (Worm)

    蠕虫是小型且简单的程序，专门设计用于破坏操作系统的系统文件，从而瘫痪系统的整体功能。它们在许多方面与病毒相似，并且也可以自我复制。它们伪装成系统文件并隐藏在文件夹中。它们会消耗硬盘空间和处理器等系统资源，通过减慢进程运行速度和耗尽硬盘空间来影响系统性能。


    ### 特洛伊马 (Trojan)

    设计特洛伊马的主要动机是窃取敏感的用户信息，包括个人和财务信息。在所有恶意软件中，特洛伊马被认为危害最大。它们是所有类型中最危险的。特洛伊马是攻击者执行拒绝服务攻击的主要工具。它们在后台不断跟踪用户活动，并通过创建和维护一份完整的用户活动日志来通知放置它们的人。特洛伊马可能很难检测，并且可以隐藏很长时间。某些类型的特洛伊马声称可以从用户计算机中删除病毒，但实际上，它们会添加自己的病毒。“特洛伊木马”这个名字源于希腊神话，希腊人使用一个木马来欺骗特洛伊人。他们制作了一个木马并躲在里面。他们将木马留在特洛伊的岸边，作为给神的牺牲。特洛伊人将木马带进了高墙内，这时希腊人从内部进攻了特洛伊城。如果你仔细想想，特洛伊木马是一个非常贴切的比喻。


    ### Rootkit 根 get

    我们知道每个系统都有防火墙保护，防火墙可以阻止大多数恶意软件。攻击者设计 Rootkit 是为了破坏系统的防火墙保护。Rootkit 不直接感染系统，而是作为后门工作，允许其他恶意软件进入系统。它们在用户面前隐藏自己，并在后台打开网关，以便其他恶意软件进入。从用户的角度来看，似乎没有任何问题。


    ### 键盘记录器 (Keyloggers)

    键盘记录器的设计特定目的是记录用户的击键次数。无论在线还是离线，它们都会继续记录并存储来自键盘的用户输入，当用户在线时，它们会将这些信息发送给放置它们的人。初始版本的键盘记录器只能存储来自键盘的击键。最新版本甚至可以获取虚拟键盘的击键。黑客利用键盘记录器发送的信息来获取用户信息，如信用卡详情、电子邮箱
    ID 和密码。键盘记录器无法区分密码和普通文本，因此；它们存储一切并将其发送给黑客。黑客随后将尝试从获得的信息中提取密码。


    ### 勒索软件 (Ransomware)

    勒索软件可以被视为系统内部的感染。它们从内部锁定计算机，通常显示诸如“您的系统已被锁定；请按照给出的指令进行解锁”的消息。这些指令通常向受害者索要。攻击者只有在收到钱后才会解锁受害者的计算机。在大多数情况下，如果处于锁定状态，计算机将变得毫无用。


    将在后面的章节中简要讨论上述恶意软件。


    ## 恶意软件的脆弱性


    每当我们使用“系统”一词时，它意味着它可以可以是单个应用程序、单台计算机、通过网络连接的一大组计算机、操作系统或网络本身。因此，当我们说系统受到攻击时，意味着上述提到的实体中的任何一个遭受了攻击。恶意软件利用这些漏洞进入系统。下面列出了其中一些脆弱性：


    ### 软件中的安全问题

    软件中的安全缺陷是恶意软件利用的一种主要漏洞。大小的软件都包含在内，这意味着从简单程序到复杂的操作系统，所有软件都在其中。软件分发公司在修复发现的安全漏洞后会不断更新其软件。它们通过发布补丁来实现这一点。


    一些常见的软件漏洞存在于浏览器插件中。不建议使用过时的插件。你不能仅仅通过更新就认为你的软件是安全的，即使在更新之后可能仍然存在一些安全漏洞。在更新到新版本后仍保留旧版本的插件是不安全的。


