    the attack rendering the website or service useless at the time of the attack.
    These types of attacks can therefore cause immense issues in both the social and
    economic function of the business, causing organizations to suffer massive losses.


    Defacement of Web Sites - While not as severe or damage, the defacement of a website
    can still have immense consequences for a business. Defacement of websites can
    involve websites to be changed completely, including a message from cyber terrorists
    for either propaganda or publicity purposes for them to achieve some type of cause.
    In other cases, hackers may cause the website to redirect to one in which they
    have established earlier which could also contain a message that they have devised
    to gain publicity and awareness of their propaganda or cause. These types of attacks
    have decreased in recent years as security measures have been heightened and hackers
    have a lower probability of access to web pages long enough to implement the changes
    and most major organizations effectively putting a stop to it. 


    ## Intro to VPN’s


    It is possible to hack a computer or a system using its IP address. The steps
    are given below.


    1.      Obtain the IP address of the target system. E.g: 101.23.53.73.


    2.      Download the advanced port scanner and install it.


    3.      Open the install the software and enter the IP address of the target in
    the right column. After entering the IP address, click on scan.


    4.      Now, it will scan and will provide you with the list of all open ports
    on the target system or target router. E.g: Port 96.


    5.      How the application will ask you to enter the login information, type
    the username and password and press enter. In case if there is no password, just
    give the username.


    With this, you will be able to access the documents and files on the target''s
    system. You can use command prompt for copying, creating or deleting files.


    Hiding


    Nowadays, most of the users have Wi-Fi Routers. All of the devices like mobile
    phones, laptops, tablets, televisions, etc, connect to the Wi-Fi router. The Internet
    service provider will provide the router with a public IP address. Any device
    connected to the router will be given a private IP address. If you connect to
    the Internet from your device, your router will look like your computer. In some
    cases, the users only use one device and they won''t need a router. Then, the
    computable directly connect to the Internet and the public IP address will be
    given to that single system. The host from the other end can track your Internet
    activities, as your assigned IP address is public.


    Conceal your IP address with a Virtual Private Network


    If you want to hide your IP addresses, you can use the service of a VPN.VPN stands
    for Virtual Private Network. It is a private network that allows the users to
    connect to the internet or another network without revealing the actual IP address
    of the user’s system. The VPN assigns its own IP address to the user’s computer.
    The IP address assigned by the Internet Service provider will not be provided
    and remains hidden.


    The following are some popular Virtual Private Network providers


    ·        Hide My Ass


    ·        Pure VPN


    ·        Vypr VPN (Free Trial)


    ·        ZenMate VPN


    ·        Express VPN


    Protect your identity


    If you are using your own IP address for surfing on the Internet, there are chances
    for the attacker to monitor your sensitive information. There can be a breach
    in your privacy, security and location if the attackers get hold of your IP address.
    You can solve this problem by using the IP address of other users. This way, you
    can protect your identity and yourself from attackers. There are several tools
    available which will help you to mask your IP address. These masking tools use
    the IP address is from public companies, which are third-party IP addresses.


    Mask your IP address with Proxies


    There are many proxy servers on the Internet and you can make use of them to surf
    anonymously. If you use a proxy server to visit a website, your original IP address
    will be hidden and a new IP address will be given to you. However, the IP address
    given to you will be a temporary one. In other words, using a proxy browser lets
    you access websites indirectly.


    Use someone else''s network


    Instead of using your own Internet, you can actually use free Wi-Fi as an alternative.
    There are many hotels and coffee shops that provide their customers with free
    Wi-Fi. If at all you connect to the Internet from a different location, the IP
    address with which you are connecting will also change. This is because different
    locations have different IP addresses.


