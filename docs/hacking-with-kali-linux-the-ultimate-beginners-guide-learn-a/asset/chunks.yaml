- fmt: "\n# Android\nAndroid was developed by Google and is available as an open-source\
    \ mobile platform. The majority of the malware written for mobile devices is for\
    \ Android because it there are more avenues to attack it. The Android OS allows\
    \ users to add software from third-party application stores as well as the official\
    \ Google Play store. Malicious apps can come from either source, as Google does\
    \ not put their apps through as strict a vetting process. The software on Android\
    \ phones is susceptible to reverse-engineering, which increases the danger inherent\
    \ in the platform. Also, a large number of Android phones do not come encrypted,\
    \ making malware attacks easier to perform. Adware is popular malware for Android\
    \ devices.\n\n[AndroidVulnerabilities.org](http://AndroidVulnerabilities.org)\
    \ lists several exploits that fall into the categories of kernel, network, signature,\
    \ and system vulnerabilities.\n\n# Apple\nApple developed three mobile platforms\
    \ `iOS`, `tvOS`, and `watchOS`. They are operating systems for iPhones, iPads,\
    \ Apple TVs, and Apple Watches. There are fewer malware attacks on the Apple products\
    \ due to the higher level of security and because the App Store is monitored heavily\
    \ and it is hard to get malicious apps onto the App Store for any length of time.\
    \ The Apple Mobile OSs does not allow for silent SMS which makes it is more difficult\
    \ to spread malicious software.\n\n# Web Servers\nA web server is the computer,\
    \ hardware, and software that stores information on a web service, and makes that\
    \ information available either over LAN or the internet. Web servers hold large\
    \ amounts of sensitive data such as social security numbers, credit card numbers,\
    \ email addresses, and passwords. An example of a famous attack on a web server\
    \ is the Equifax hack in 2017. The hack exposed the personal data of millions\
    \ of people including information about the victims’ credit. Hacking a web server\
    \ is a complex attack.\n\nWeb servers have several vulnerabilities. These vulnerabilities\
    \ include using default settings, the web server is misconfigured, exploiting\
    \ bugs, or there is simply a lack of security. The types of web servers are:\n\
    \n*   `Apache`: `Apache` web servers are the most commonly used. `Apache` typically\
    \ is run on Linux.\n*   `Internet Information Services (IIS)`: `IIS` is a web\
    \ server for Windows. It is the second most used, after `Apache`.\n*   `Other`:\
    \ There are other web servers on the market including Novell’s web server and\
    \ Mac OS X server.\n\n## Types of Attacks\nThere are several types of attacks\
    \ a hacker can use to crack a web server. These types of attacks include directory\
    \ traversable attacks, DoS and dS attacks, domain name system hacking, sniffing,\
    \ phishing, pharming, and defacement. Domain name system hacking is when an attacker\
    \ changes the Domain Name System (`DNS`) settings so that the internet traffic\
    \ for the web server is instead sent to the hacker’s web server. A pharming attack\
    \ is when the attacker changes the `DNS` settings on the user’s computer. There\
    \ are defacement attacks, which is when the attacker replaces a website’s webpage\
    \ with another one that including the hacker’s name and whatever media the hacker\
    \ chooses to post. Defacement is often done to build a hacker’s reputation.\n\n\
    # Tools to keep your system secure\nWhen you are just beginning, it is much easier\
    \ if you have some help and these are some of the best software and hardware elements\
    \ you can use:\n\n### Metploit\n`Metploit` is one of the best software and hardware\
    \ elements you can use. It is open-source and free to use. `Metploit` allows you\
    \ to find vulnerabilities. `Metploit` is a framework for penetration testing and\
    \ is used by many professionals. `Metploit` allows you to simulate attacks and\
    \ find vulnerabilities. `Metploit` works on all platforms, including Linux, Windows,\
    \ and macOS. \n\n### Acunetix\n`Acunetix` is a vulnerability scanner and is one\
    \ of the best tools. `Acunetix` is used to find vulnerabilities in web applications.\
    \ `Acunetix` is a fast tool and is used to find SQL injection and other vulnerabilities.\
    \ `Acunetix` works on all platforms, including Linux, Windows, and macOS.\n\n\
    ### Nmap\n`Nmap` is short for `Network Mapper`. It is a port scanner and is one\
    \ of the most popular tools. `Nmap` is used for network discovery and security\
    \ auditing. `Nmap` allows you to find services. `Nmap` works on all platforms,\
    \ including Linux, Windows, and macOS.\n\n### Wireshark\n`Wireshark` is one of\
    \ the best-known packet tools of all time. It is open source and free to use.\
    \ `Wireshark` is used for capturing and analyzing traffic. `Wireshark` lets you\
    \ read live data from the following protocols:\n*   802.11\n*   ATM\n*   Bluetooth\n\
    *   Ethernet\n*   FDDI\n*   Frame Relay\n*   IEEE\n*   PPP/HDLC\n*   Token Ring\n\
    *   USB\n\n### oclHashcat\nIf you are interested in password cracking then `Hashcat`\
    \ is the free tool you need. It is CPU-based and `oclHashcat` is a more advanced\
    \ version of the tool that makes use of your GPU power. `oclHashcat` is known\
    \ as one of the fastest password cracking tools in the world and is the first\
    \ tool in the world to have the GPGPU-based engine.\n\n### Nessus\n`Nessus` is\
