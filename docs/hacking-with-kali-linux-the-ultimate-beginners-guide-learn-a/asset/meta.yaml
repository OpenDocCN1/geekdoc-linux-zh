- - '#'
  - 引言
- - '##'
  - 什么是 Linux 发行版？
- - '##'
  - Kali Linux 的特性
- - '###'
  - 广泛的网络安全和渗透测试工具库：Kali Linux 源于前述的 Backtrack，正因于此，随着时间的推移，Backtrack 发行版开发了大量的工具。然而，随着时间的流逝，许多工具已变得多余或过时，Kali
    开发者能够精简这些工具，移除了不再符合预期用途的工具，同时整合并添加了新的及更新的工具。目前，Kali 为用户提供了超过 600 渗透测试工具，其中一些更重要和/或显著的工具将在后文中讨论。
- - '###'
  - 免费软件：与其前身 BackTrack 类似，Kali Linux 可以免费使用。根据开发者的说法，他们意图保持现状，使该工具无需任何付费墙即可下载和使用，所有用户都将获得
    Kali Linux 发行版的完整功能。
- - '###'
  - 开源 Git 树：Kali Linux 是免费软件，并且像其他免费软件和许多 Linux 发行版一样，它也是开源的。Kali Linux 的开发者致力于使用开源开发模型，允许他们的开发树公开。此外，Kali
    Linux 中使用的所有源代码也由开发者持续提供，供任何想要根据特定需求微调或修改 Kali Linux 的用户。
- - '###'
  - 文件系统层级结构——符合标准：Kali Linux 软件遵循 `FHS`，即“文件系统层级标准”，这使得 Linux 用户能够更容易地导航和定位特定文件，例如二进制代码、支持文件、软件库等。这种标准的使用提供了便利性和易用性，这是
    Kali Linux 优于许多类似软件的优势之一。
- - '###'
  - 对各种设备的支持：如前所述，Kali Linux 的开发者已尽力让 Kali Linux 尽可能对用户友好且多功能，使其兼容广泛的平台。Kali Linux
    受多个操作系统支持，其中最大的特点之一是 Kali Linux 本身支持无线设备的使用。Kali Linux 不仅兼容多种软件设置，还兼容大量的硬件设置，开发者正尽力包含尽可能多的硬件配置。这非常值得关注，特别是由于其对无线设备的支持，因为对大多数
    Linux 发行版的常见批评之一就是它们倾向于缺乏对无线硬件的支持，而 Kali Linux 提供了支持。
- - '###'
  - 自定义内核：Kali Linux 的开发团队首先是渗透测试人员，这意味着他们经常需要进行无线评估，因此，Kali Linux 的内核不断包含注入补丁，以保持其最新状态。
- - '###'
  - 安全的开发环境：Kali Linux 团队由“白帽”黑客和渗透测试人员组成，因此，他们敏锐地察觉到安全的需求，特别是当涉及到“白帽”们经常使用的软件时，因为软件本身的漏洞或
    Bug 可能会导致灾难性且广泛的结果。因此，开发团队受到限制，他们是唯一提交包并与 Kali Linux 仓库交互的人员，所有操作均在多个安全协议下进行，以确保安全安全。此外，Kali
    Linux 的包和仓库经过 `GPG` 签名，Kali Linux 包含的所有包都由负责构建和提交它的个人开发者签名，每个仓库也会对包进行签名，从而形成了一套安全的软件包和仓库集合。
- - '###'
  - 多语言支持：尽管大部分代码和许多渗透工具是基于英语的，但 Kali Linux 尝试包含多语言支持，允许非英语母语者使用其母语操作，使他们更容易利用 Kali
    Linux 及其特性，使他们能够在执行任务时更高效。
- - '###'
  - 支持定制化：如前所述，Kali Linux 是一种开源软件，这意味着它的源代码对所有人开放。与大多数开源软件以及事实上也许多 Linux 发行版一样，Kali
    Linux 可以被修改以适应用户的需求和口味，以防他们在设计方面有不同意见。Kali Linux 在多个级别都是可定制的，直到内核级别，为高级用户提供了对
    Kali Linux 实例的几乎完全控制。
- - '###'
  - ARMEL 和 ARMHF 支持：基于 ARM 的单板系统变得越来越流行和普及，例如著名的树莓派微计算机或 BeagleBone Black，由于 Kali
    Linux 团队的设计理念，他们尽力让 Kali Linux 运行尽可能可能的平台和配置上。因此，Kali Linux 拥有强大的 ARM 支持，使其能够在
    `ARMEL` 和 `ARMHF` 嵌入式系统上运行，并兼容非常广泛的 ARM 设备。此外，Kali Linux 的 ARM 仓库与主线更新发行集成，这意味着
    ARM 工具随发行版的其他部分一起更新，保持最新并与 Kali Linux 的主工具同步
