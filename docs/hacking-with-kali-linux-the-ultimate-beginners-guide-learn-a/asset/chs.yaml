- "# Kali Linux 攻极初学者指南：学习并实践道德黑客攻击与网络安全基础\n\n\n\n![](img/cover.jpeg)\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n# 引言\n\n鉴于黑客攻击的泛滥，以及能够发现这些漏洞以加固它们、保护网络及包含的数据并防止未经授权的访问的重要性，许多工具是为了此而开发的。这些工具允许黑客执行与网络安全相关的任务，例如渗透测试、安全审计，甚至是计算机取证和网络攻击的逆向工程。\n\
  \nKali 是这样的工具之一，它是一个基于 Debian 的 Linux 发行版，专门设计用于帮助“白帽”执行其任务，具有多种专用工具和其他功能，这使得“白帽”工作变得更容易。\n\
  \n## 什么是 Linux 发行版？\n\nLinux 发行版（通常缩为“distro”）是一种基于经典 Linux 操作系统内核的软件集合构建的操作系统，通常包含一个包管理系统。众所知的“Linux”通常作为各种变体的基础，这些变体通常针对用户希望使用的特定设备专门开发，范围从嵌入式设备到个人电脑解决方案，再到巨大的超级计算机，Linux\
  \ 软件包系统根据它们运行的平台类型而异。\n\n\n\n\n大多数 Linux 发行版都由 Linux 内核、GNU 工具和软件库、其他第三方软件、一个窗口管理器以及专门的桌面环境组成。由于\
  \ Linux 的特性，这通常包括免费的开源软件，这些软件可以以编译后的库或原始源代码的形式存在，这允许对其进行各种修改，尽管大多数 Linux 发行版在其核心包中也包含了用户无法修改的**专有软件**。\n\
  \nDebian 是一种 Linux 内核类型，Kali 基于此构建，这意味着 Debian 是 Linux 的一个特定版本，而 Kali 是一个基于 Debian\
  \ 的构建，但它并不是 Debian 本身。它由 Offensive Security 的程序员 Aharoni 和 Kearns 开发，其基础是此前名为“Backtrack”的安全性测试\
  \ Linux 发行版的早期 Linux 形式。\n\n此次重构的主要原因是，尽管 Backtrack 非常有效，但程序员们想要构建一个更新的 Linux 发行版。他们选择\
  \ Debian 作为基础，是因为 Debian 作为可靠且稳定的 Linux 内核而闻名，同时也因为 Debian 拥有广泛的且兼容性良好的软件库。它最终被开发并扩展到今天的规模，拥有了数百种专为安全测试和网络安全目的设计的工具，可以直接从硬盘原生运行，甚至可以从\
  \ USB 或 CD 启动，也可以运行在虚拟机上。\n\nKali Linux 开发时支持多平台支持，具有 32 位和 64 位宿主机格式，旨在兼容运行 x86\
  \ ARM 处理器的设备，并可以在 Android 和 Windows 10 等其他操作系统上运行——其中前者可以在某些兼容硬件上（如三星的 Nexus 系列手机）运行，后者可以在支持\
  \ Linux 的 Windows 子系统（WSL）的 Windows 10 操作系统运行，且这可以从官方 Windows 商店进行下载。\n\n## Kali\
  \ Linux 的特性\n\n鉴于前述提到的 Kali Linux 短背景，让读者对 Kali Linux 的特性和特定能力有一个简短的概述将是有益的，这应该让人们更清晰地了解\
  \ Kali Linux 到底是什么以及如何使用。\n\n### 广泛的网络安全和渗透测试工具库：Kali Linux 源于前述的 Backtrack，正因于此，随着时间的推移，Backtrack\
  \ 发行版开发了大量的工具。然而，随着时间的流逝，许多工具已变得多余或过时，Kali 开发者能够精简这些工具，移除了不再符合预期用途的工具，同时整合并添加了新的及更新的工具。目前，Kali\
  \ 为用户提供了超过 600 渗透测试工具，其中一些更重要和/或显著的工具将在后文中讨论。\n\n### 免费软件：与其前身 BackTrack 类似，Kali\
  \ Linux 可以免费使用。根据开发者的说法，他们意图保持现状，使该工具无需任何付费墙即可下载和使用，所有用户都将获得 Kali Linux 发行版的完整功能。\n\
  \n### 开源 Git 树：Kali Linux 是免费软件，并且像其他免费软件和许多 Linux 发行版一样，它也是开源的。Kali Linux 的开发者致力于使用开源开发模型，允许他们的开发树公开。此外，Kali\
  \ Linux 中使用的所有源代码也由开发者持续提供，供任何想要根据特定需求微调或修改 Kali Linux 的用户。\n\n### 文件系统层级结构——符合标准：Kali\
  \ Linux 软件遵循 `FHS`，即“文件系统层级标准”，这使得 Linux 用户能够更容易地导航和定位特定文件，例如二进制代码、支持文件、软件库等。这种标准的使用提供了便利性和易用性，这是\
  \ Kali Linux 优于许多类似软件的优势之一。\n\n### 对各种设备的支持：如前所述，Kali Linux 的开发者已尽力让 Kali Linux\
  \ 尽可能对用户友好且多功能，使其兼容广泛的平台。Kali Linux 受多个操作系统支持，其中最大的特点之一是 Kali Linux 本身支持无线设备的使用。Kali\
  \ Linux 不仅兼容多种软件设置，还兼容大量的硬件设置，开发者正尽力包含尽可能多的硬件配置。这非常值得关注，特别是由于其对无线设备的支持，因为对大多数 Linux\
  \ 发行版的常见批评之一就是它们倾向于缺乏对无线硬件的支持，而 Kali Linux 提供了支持。\n\n### 自定义内核：Kali Linux 的开发团队首先是渗透测试人员，这意味着他们经常需要进行无线评估，因此，Kali\
  \ Linux 的内核不断包含注入补丁，以保持其最新状态。\n\n### 安全的开发环境：Kali Linux 团队由“白帽”黑客和渗透测试人员组成，因此，他们敏锐地察觉到安全的需求，特别是当涉及到“白帽”们经常使用的软件时，因为软件本身的漏洞或\
  \ Bug 可能会导致灾难性且广泛的结果。因此，开发团队受到限制，他们是唯一提交包并与 Kali Linux 仓库交互的人员，所有操作均在多个安全协议下进行，以确保保实和安全。此外，Kali\
  \ Linux 的包和仓库经过 `GPG` 签名，Kali Linux 包含的所有包都由负责构建和提交它的个人开发者签名，每个仓库也会对包进行签名，从而形成了一套安全的软件包和仓库集合。\n\
  \n### 多语言支持：尽管大部分代码和许多渗透工具是基于英语的，但 Kali Linux 尝试包含多语言支持，允许非英语母语者使用其母语操作，使他们更容易利用\
  \ Kali Linux 及其特性，使他们能够在执行任务时更高效。\n\n### 支持定制化：如前所述，Kali Linux 是一种开源软件，这意味着它的源代码对所有人开放。与大多数开源软件以及事实上也许多\
  \ Linux 发行版一样，Kali Linux 可以被修改以适应用户的需求和口味，以防他们在设计方面有不同意见。Kali Linux 在多个级别都是可定制的，直到内核级别，为高级用户提供了对\
  \ Kali Linux 实例的几乎完全控制。\n\n### ARMEL 和 ARMHF 支持：基于 ARM 的单板系统变得越来越流行和普及，例如著名的树莓派微计算机或\
  \ BeagleBone Black，由于 Kali Linux 团队的设计理念，他们尽力让 Kali Linux 运行尽可能可能的平台和配置上。因此，Kali\
  \ Linux 拥有强大的 ARM 支持，使其能够在 `ARMEL` 和 `ARMHF` 嵌入式系统上运行，并兼容非常广泛的 ARM 设备。此外，Kali Linux\
  \ 的 ARM 仓库与主线更新发行集成，这意味着 ARM 工具随发行版的其他部分一起更新，保持最新并与 Kali Linux 的主工具同步。\n\n## 为什么使用\
  \ Kali Linux\n\n\n\n\nKali Linux 专门为“白帽”以及渗透测试和安全测试而设计，此外还有白帽黑客通常从事的其他活动。为了满足这些专业化需求，Kali\
  \ Linux 发行版经过修改以满足这些要求，特别是以下这些核心变化：\n\n- **单用户 root 权限访问**：Kali Linux 首先是一个以安全审计和渗透测试为中心的\
  \ Linux 发行版，它经过了调整，以反映该特定配置的需求。单用户设置是为了安全考虑，这允许用户持续地拥有 root 权限。通常做法是仅在需要时给予 root\
  \ 权限，但由于渗透测试和安全审计工具需要提升的用户权限，渗透测试本质要求 Kali Linux 拥有 root 权限。如果 Kali Linux 遵循标准的仅在需要时提供\
  \ root 权限的模式，对用户来说将非常不便且是一种负担，因此有了这一特定的设计选择。\n- **禁用网络服务**：出于安全考虑，Kali Linux 默认禁用了网络和服务和功能，并带有系统钩子确保网络服务被禁用，同时允许根据需要安装服务。网络服务并非唯一为了安全目的而禁用的服务，甚至像蓝牙等其他连接选项默认也是禁用的，但根据用户的需求和偏好，可以按开启网络服务。\n\
  - **自定义 Linux 内核**：Kali Linux 发行版的内核是针对无线注入专门补丁的上游内核，这允许内核在网络连接上发送信息包，同时使其看起来像是正常通信和信息流的一部分，许多黑客活动的关键组件。这使得安全测试人员和“白帽”能够恰当地复制获取未经授权访问和利用漏洞的常见途径。\n\
  - **受信任且精选的仓库**：鉴于作为一个专注于安全的 Linux 发行版的本质，开发者的主要优先事项之一是保持 Kali Linux 的安全和可用性，因为发行版的漏洞或可用的利用程序将违背\
  \ Kali Linux 的目的。因此，开发者知道系统完整性至关重要，他们审核并验证 Kali Linux 使用的每一个游软件源，确保只保留极其必要的源以最大限度地降低风险。注意，许多\
  \ Kali Linux 用户经常会被想要扩展他们的 `sources.list` 资源，但请注意，这样做极有可能破坏 Kali Linux 的安装。\n\n\
  # 第 1 章 黑客的类型\n\n当今社会中的所有工作都有不同的形式。你可能是蓝领、白领、无领……随你怎么如何。黑客也无二致。就像不同颜色的领口对应不同的工作一样，黑客领域也是如此。\n\
  \n黑客被分为许多不同的类别：黑帽、白帽、灰帽、新手（Newbies）、黑客行动主义者（Hacktivists）、精英（Elite）等。现在，为了帮助你更好地理解灰帽黑客，让我们先看看其他这些类型的黑客，这样你就可以感受一下黑客在在线时在做什么，或者可以做什么。\n\
  \n## 新手\n\n任何事情的起点都是从开始，这就是为什么我们从新手黑客开始。很多新手黑客的问题在于，他们认为自己已经搞懂了一切，但实际上并非如此。涉及到这一切时，黑客的理念仅仅触及了皮毛，对于想要入行的人来说，看到真正需要学习的内容时感到不知所措一点并不罕见。\n\
  \n然而，不要让这让你气馁，你能够学会这一切，这只是需要你付出时间和精力。借书并上网。查找需要学习的内容并记住它们。不要急于自己。你需要学习，并且真正学习。你任何没有记住的东西以后都可能让你付出代价。\n\
  \n在真实的黑客世界中，会有即时的反应，坐在那里试图查找你本应该已经知道的内容不会让你作为一个黑客走得多远。如果你想在你的所做的事情上精通，那就花时间去精通。\n\
  \n如果你不认为自己真的想学，就不要浪费时间，因为要进入问题核心需要大量的专注。不要误会我的意思，这是完全值得的，但如果你只是出于好奇在研究，除非了解这些对你来说真的意义重大，否则不要这样做。\n\
  \n当然，确实有些人大致知道自己在做什么，或者他们可以进入朋友的邮箱账户，但那不是我在这里所指的黑客。我希望你成为一个真实的、有能力的黑客，除非你愿意花所需的时间学习并付出努力，否则这不会发生。\n\
  \n你必须记住，任何存在的黑客都必须从新手黑客开始，并从那里建立技能。现在，他们建立这些技能的快慢很大取决于他们投入了多少时间和精力，但别担心，你会掌握窍门的，虽然你必须从新手开始，但你很快就会获得灰帽身份。\n\
  \n## 精英\n\n与新手黑客一样，精英黑客可以是任何种黑客，无论好坏。使他们成为精英的事实是他们擅长自己所做的事情，并且他们清楚这一点。网上对精英黑客有很高的尊重。就像任何精英领域一样，他们知道自己在做什么，并且知道除非别人也知道如何处理好自己，否则无法挑战他们。\n\
  \n这种身份伴随着程度的傲慢，但这是实至名归的。任何人都可以步于第二，但要达到顶峰需要真正的奉献。精英黑客可以使用他们的力量行善，也可以行恶，但无论如何，他们都是一股不可小敌的力量。他们了解系统是如何工作的，如何绕过它们，以及如何让它们按照他们的意愿运行。\n\
  \n如果你有一个成为精英黑客的目标，你确实有很多硬仗要做，但别担心，你会到达那里的。获得这种顶级地位只需要时间和精力，而且它属于那些渴望它的人。没有人能获得精英地位，这是他们必须努力才能得到的，但绝对值得投入其中所有的时间和精力。作为一名精英黑客，你不必担心遇到的任何系统，你将知道会发生什么，以及你可以如何绕过它，这只是这份工作的常态。\n\
  \n## 黑客行动主义者\n\n黑客行动主义黑客利用他们的技能来推动社会或政治议程。有时他们会被特定团体雇佣进入在线场所并收集信息，有时他们完全独立工作。这种黑客行为的目的是让一个政党看起来很糟糕，让黑客支持的政党看起来很好。然后，他们要么在网上其他地方发布，要么将其传递出去让其他人看到那个人做了什么或被指控做了什么。这是政客之间互相针刺的一种，这并不是真正的公平游戏。黑客随后将获得雇佣他们的政党的报酬，或者如果他们独立工作，他们就能看到他们对政客发布内容的结果。\n\
  \n黑客及其所做的事情是一个永无止境的列表，但他们最终都可能归为三类：黑帽、白帽和灰帽。无论他们基础上是哪种黑客，这三个领域实际上涵盖了全部。\n\n\n\n\
  这是因为这些不仅是黑客本身的行为，也是每一位黑客的共同特征。无论他们是在做善事、做坏事，还是在未经许可的情况下做善事，这些都是黑客行为的本质。\n\n### a.\
  \ 黑帽 (Black hat)\n\n黑帽黑客可能是黑客世界最著名的，或者说是最臭名昭著的。这是电影往往关注的黑客类型，也是让所有黑客名声狼藉的类型。\n\n\
  黑帽黑客是指进入系统或网络以造成危害的黑客。他们总是带有恶意意图，目的是伤害和破坏。他们通过窃取东西来实现这一点，无论是个人信息、网络代码或其他任何他们发现的有价值的东西，或者也可以通过向系统中植入蠕虫和病毒来实现。历史上，曾有病毒被植入各种系统，导致了价值数十万美元的损失，并让系统瘫痪数日。\n\
  \n病毒是黑客创建并分发的程序，它们会对它们能控制的任何东西造成破坏。它们通常会伪装成某种东西，并诱导你以任何他们可能的方式打开它们。\n\n然后，一旦你打开了链接，它们就会进入你系统的硬盘，并在里面随心所欲地活动。许多病毒的行为就像有自己的思想一样，它们能造成的伤害会让你大惊。\n\
  \n有一种特定的病毒被称为 `backdoor`（后门）病毒，它允许发送者访问并控制它所植入的任何系统。这就像系统的所有者仅仅是一个旁观者，只能眼睁睁看着病毒对系统造成破坏而无能为力。\n\
  \n黑客出于多种原因使用这些病毒，但没有一种理由对你有好处。当黑客获得你电脑的访问权限时，他们可以在上面做任何他们想做的事。\n\n他们可以获取你的个人信息，并将其用于自己的获利。他们可以盗取你的身份，在你的电脑上进行非法活动，从而让这一切看起来是你干的，并通过将所有责任推卸给你来逃脱嫌疑。\n\
  \n这些病毒很难剔除，因此在开始时尽一切努力保护自己以确保不感染其中任何一种病毒，是至关重要的。然而，如果你确实感染了病毒，仍然是有希望的。你可能需要删除系统的很多内容，或者将其关闭并完全重启，但这样做总比让黑客访问你正在进行的任何操作要好。\n\
  \n黑帽黑客是有恶意的。他们所做的一切都是为了伤害他人和制造麻烦。遗憾的是他们以此所为，因为这让黑客行为陷入了负局面，但仍有希望，因为只要有坏事发生，就能发现一些好事，而这种好事以白帽和灰帽黑客的形式存在。\n\
  \n### b. 白帽 (White hat)\n\n白帽黑客和灰帽黑客非常相似，但存在关键区别，使他们属于不同的类别。白帽黑客是由网络或公司聘佣进入系统并刻意尝试黑客攻击的人。\n\
  \n此举目的是测试系统或网络的弱点。一旦他们能够看到黑客从哪里进入，他们就可以修复它，并让黑帽黑客破解变得更加困难。\n\n他们通常通过被称为“渗透测试”（Penetration\
  \ Testing）的形式进行测试，但我们稍后会详细讨论。白帽黑客进入其所在的系统时总是拥有权限，他们的唯一目的就是寻找漏洞。\n\n这项工作的需求很高，以至于有白帽黑客将其作为全职工作。系统越多，尝试破解的黑客就越多。尝试的黑客越多，公司越需要白帽黑客将他们挡在外面。\n\
  \n公司对聘佣谁并不挑剔，因此如此多的黑客选择走黑帽之路是令人惊讶的。他们本可以通过为人工作并根据工作获得报酬来赚取丰薪，但遗憾的是，并没有人这样看待问题，他们宁愿为了自己的私利进行黑客，也不愿做对他人有帮助的事。\n\
  \n简单来说，这可以分解为一种非常基础的关系：黑客客试图进入，白帽黑客试图将他们挡在外面。有时黑帽占据上风，有时则轮到白帽。\n\n这就像是反派与超级英雄之间相互依赖的关系，你支持其中一方，但另一个偶尔也能得到他们想要的东西。\n\
  \n这是一个最终会解决的大圆圈。当然，如果黑帽黑客从一开始停止入侵系统，情况会简单得多，但遗憾的是这不会发生。\n\n### c. 灰帽 (Grey hat)\n\
  \n世界往往被描绘为充满了对错的选择。你可以用一种方式做，也可以用那种正确方式以外的任何方式做……从而让你变成错误的。\n\n对与错，黑白。然而……那些规则的例外呢？几乎每种规则都有例外，黑客行为也不例外。灰帽黑客就属于这个领域。\n\
  \n他们所做的事是正确的还是错误的，取决于个人的决定。为了澄清我的意思，请这样想：黑帽黑客在未经许可的情况下进入网络以造成伤害。这是坏的，非常坏。白帽黑客在许可的情况下进入系统以提供保护。这是好的，非常好。\n\
  \n但接着你就有了灰帽黑客了。灰帽黑客在未经许可的情况下进入系统……这是坏的，但他们进入该系统是为了帮助公司或网络……这是好的。所以，简而言之，灰帽黑客使用坏的方法做善事。重要且普适的事实是，灰帽黑客从不对对系统做任何恶意的或坏的事，事实上，对于负责人来说，他们所做的一切和白帽黑客做得一样好。在接下来的章节中，我们将介绍你如何成为一名灰帽黑客，如何进入任何你喜欢的网络，以及你如何帮助运行网络的人。\n\
  \n# 第 2 章 黑客过程 (Hacking process)\n\n\n\n\nWiFi 破解是最基础的黑客行为之一，通常教给初级白帽以让他们熟悉整个过程。第一步是找到一个要破解的无线网络：记住，“只是试试”或“我正在学习”并不是借口，任何未经授权的访问或尝试在未经授权的情况下访问都可能受到惩罚，因此最好是获得许可，或者干脆为了方便起见，创建一个自己的无线网络。\n\
  \n现在我们有了一个可以操作的无线网络，下一步是找到你设备无线适配器的名称。请注意，有几个术语我们需要熟悉：“eth – 以太网”和“wlan – 无线局域网”。我们要找的就是“wlan”，所以请留意它。启动你的\
  \ Kali Linux 终端并输入 `ifconfig`，它应该会显示我们计算机所有终端的列表。请记录“wlan”适配器以及后缀，后缀通常是 0 / 1 /\
  \ 2。\n\n现在我们已经有了无线适配器，现在必须启用监听模式（monitor mode）。用户可以使用一个名为 `airmon – ng` 的工具来创建一个“mon”虚拟接口。这可以通过输入以下命令轻松完成：\n\
  \n```\nairmon – ng start wlan0\n```\n\n这应该创建一个监控接口，如果使用早期版本的 Kali Linux，默认名称为 -mon0，但如果使用\
  \ Kali Linux 2.x 及更高版本，名称将为 `wlan0mon`。\n\n一旦监控接口启动，我们就可以尝试捕获正在尝试破解的无线网络传输的数据包。以下工具将帮助我们收集数据：\n\
  \n```\naidump – ng wlan0mon\n```\n\n这将允许我们访问几个数据包。如果我们想将数据保存到文件中（我们确实这样做），可以在结尾添加另一个命令“write\
  \ filename”，所以它看起来如下：\n\n```\naidump – ng wlan0mon - - write filename\n```\n\n这将任何捕获到的包存储在\
  \ `filename.cap` 中。一旦我们存储了至少一万个数据包，就可以进行 wifi 破解过程。\n\n现在我们已经有了数据包，可以打开另一个终端并输入：\n\
  \n```\naircrack – ng filename-01.cap\n```\n\n这将开始破解过程，或者如果有多个无线网络，程序将询问哪个无线网络是破解目标。请注意，如果有多个无线网络，需要的捕获数据包数量可能会更高。如果密码相当弱，那么密码将以以下格式显示：\n\
  \nXx :: xx :: xx :: xx :: xx :: xx :: xx …\n\n删除冒号（这样它将变为“xxxxxxxxx”），那就是该无线网络的密码。如果捕获的数据包不够，程序会通知你，你必须收集更多数据包以足够破解\
  \ wifi。\n\n正如早些讨论过的，更常见的攻击之一是 SQL 注入，旨在获取网站或数据库的访问。尽管读者现在应该知道这一点，但仅为了复习：SQL 是一种结构化查询语言，允许计算机管理数据，以便从服务器或系统数据库中存储、操作和检索数据。数据库是所有数据的存储库，通常包含密码和其他敏感信息。\n\
  \n那么什么是 SQL 注入？SQL 注入是一种向数据库中注入查询的方法。现在数据库专门用于回答查询，但仅限来自授权的源。SQL 注入是一种让来自未经授权源的外部查询获得数据库访问权限。这是通过将它们“插入”到正常的数据查询流中来实现的，以便将它们伪装成授权的信息请求。这允许黑客检索数据库中的信息，无论是密码、加密密钥甚至是原始数据。还有一些\
  \ SQL 注入方法不仅允许检索信息，甚至可以插入恶意软件或其他文件，这可能允许相关的黑客控制数据库，将所有者锁定甚至删除部分或全部文件。不用说，SQL 注入是许多黑客首选的攻击方法之一。\n\
  \n现在，“白帽”可以通过尝试寻找漏洞来复制某些类型的 SQL 注入方法。运行 Kali Linux 发行版的白帽可用的工具之一是“metasploitable”，这是一个虚拟\
  \ Linux 虚拟机，允许人员使用 SQL 注入方法练习获取访问并寻找漏洞。\n\n“metasploitable”虚拟机可以在线获取，甚至可能包含在你的 Kali\
  \ Linux 软件包或安装程序中。它应该包含各种带有漏洞的 Web 应用程序副本，有助于“白帽”学习如何发现漏洞以及如何获取访问，反过来可以帮助网络安全专家找到通过修补漏洞或开发替代方案来加固这些漏洞的方法。\n\
  \n安装或打开“metasploitable”虚拟 Linux 虚拟机后，用户可以登录，应用程序的默认用户名和密码设置为“msfadmin”。登录后，用户应该将应用程序的网络设置更改为“bridge”（桥接），并重启机器以确保更改正确生效。\n\
  \n## 如何清除黑客痕迹\n\n这是渗透攻击的高潮。黑客现在可以访问组织数据库上的可用资源。然后，黑客可以自由地提取他认为有价值的信息，或者可以控制网络并将其作为基础，对其他目标网络发动进一步攻击（正如我们描述的\
  \ DoS 攻击）。通过访问网络，黑客现在控制了一个或多个设备。\n\n正如在扫描预防措施中所示，管理员和安全人员可以采取某些预防措施，以确保设备和服务更难被黑帽黑客等非法用户访问。这可能涉及限制没有日常访问访问设备的用户的访问。此外，安全经理应密切监控域以及访问本地管理员服务的人员。使用物理安全控制允许经理检测正在发生的攻击，并拒绝访问，同时通知有关部门以确保入侵者暴露。\n\
  \n另一种采取以确保访问被拒绝的方法是使用保护密钥对高度敏感和机密信息进行加密。这意味着任何尝试访问系统的攻击者无论系统保护得如何，获得访问后只会发现信息被乱码了，由于密钥受到保护，攻击者将没有可靠的方法使用已加密的数据。加密对于非常有价值的数据来说是一个很好的最后防线，但其本身不能完全依赖。即使攻击者访问了系统并发现数据已加密，他们仍然可以对网络造成破坏，甚至禁用它，作为一种破坏手段造成重大损害。更令人担忧的是，攻击者可能控制系统并利用它进行进一步犯罪，这些犯罪可以追溯到该的网络。\n\
  \n\n\n黑客此时正在与时间赛跑，他们必须确保自己能够维持足够长的访问权限，以完成他们设定的目标，无论是窃取关键数据和信息，还是从这台受控的服务器发起进一步的攻击。在此之前，黑客能够规避检测，但他们仍然面临被捕获的风险，对系统的访问时间越长，被检测到的风险就越高。\n\
  \n## 掩盖踪迹\n\n你意识到有许多通过网络发起的攻击，这意味着黑客确实将访问点视为任何信息技术堡垒中最脆弱的环节之一。如果你还记得 Heartbleed（心脏溢血）事件，就会意识到即使是顶尖公司也容易通过网络被利用，甚至导致其更先进的系统突然吐出关于客户的机密加密信息。如果他们存在漏洞，那么你也是一样。\n\
  \n如果你怀疑你的系统遭受了网络攻击，或者有人宣布他们要黑进你的系统，那么你完全有理由监控你网络中发生的情况，并尝试找出你的攻击者可能是谁。在本章中，你还将学习法医调查员在网络调查利用过程中，可能会关于攻击者收集到哪些信息。\n\
  \n## 示例问题场景\n\n你的浏览器表现异常，主页不断重定向到一个页面，告诉你你的电脑感染了病毒，然后提示你需要购买一种特定的反病毒软件。此外，你的电脑还开始卡顿，你看到有大量的广告不断弹出。这不仅干扰了你的工作，还消耗了电脑的资源。\n\
  \n此时，你确定你的电脑被感染了。你想知道病毒是什么，以及感染源自哪里。\n\n### 获取 Wireshark\n\n如果你已经有了 `Kali Linux`（是的，那个也可以用于发起网络攻击的工具套件），那么你已经拥有了这个工具。你可以在\
  \ `Network Traffic Analysis`（网络流量分析）下拉菜单中找到它。该界面能够对你的网络流量进行实时捕获，并分析在你的访问点上发送和接收的信息。\n\
  \n启动 `Wireshark` 并进行实时捕获。你可以通过点击 `Capture`（位于顶部菜单），然后选择活动接口来实现。\n\n### 你会看到屏幕上有三个窗口。上半部分的窗口将告诉你你收到的数据包信息，还会提供一些关于这些包的信息。中间窗口将显示流量中所有的位以及数据包头的字节。下半窗口将以\
  \ `ASCII` 和 `hexadecimal`（十六进制）格式显示数据包内容。\n\n如果你查看数据包的内容，可能会看到一个来自全球信息网某处的信使包。当你点击该数据包时，可以更仔细地查看，然后检查出现在白色中间窗口中的详细信息。\n\
  \n如果你意识到网络上的即时服务已禁用，你会发现不应该有任何其他活动。然而，你可能会注意到列表中有一个 `ICMP` 数据包，显示你的请求不可达。这很可能是一个可疑活动。\n\
  \n### 扫描流量并进行过滤\n\n如果你处于在线状态，你会看到你的电脑正在接收大量的流量。然而，通过像 `Wireshark` 这样的工具，你可以选择你感兴趣的流量来验证你所收到的数据。同时，你还可以检查数据包，并将安全的包与可疑的包分开。例如，你可能会看到你收到了来自可靠的反病毒软件的流量。当这种情况发生时，你可以从窗口中看到的其他所有数据包中剔除该流量，因为你已经知道该特定流量来自一个可靠的设备。要过滤掉你已经检查过的包并将它们从视图中移除，请使用此语法：\n\
  \n```\n!ip.addr == (流量的 IP 地址)\n```\n\n执行此操作后，你可以将注意力放在其他可能对你的电脑造成危害的流量上。\n\n###\
  \ 开始观察 DNS 查询\n\n检查窗口中看到的其他流量。你可能会看到你的电脑（检查你的 IP 地址）正在使用 `DNS` 协议对某个站点进行标准查询，而你并不记得在使用电脑时访问过该站点。如果你意识到自己现在没有查看某个网站而电脑却表现如此，那么你就可以将其判定为可疑活动。\n\
  \n现在检查其他数据包。如果你的电脑主机似乎正在从未知站点请求下载，那么你的电脑极可能感染了 rootkit（根内核程序），恶意软件正在向其源头汇报！好消息是你已经知道\
  \ rootkit 来自哪里了，你可以运行恶意软件扫描将其从系统中移除。如果你认为由于 rootkit 造成了严重损害，可以保存结果，以便在向当局报告后作为反对罪犯的证据。\n\
  \n### 检测可能的 DoS 洪水攻击特征\n\n由于你之前在章节中读到过 `DoS` 攻击，你可能对如何查看你的端口是否正被黑客泛洪以试图拒绝你的服务非常感兴趣。如果你有\
  \ `Wireshark`，你就可以检测到犯罪黑客可能发送给你的波数据包的迹象。\n\n这是一个典型的 `DoS` 攻击数据包泛洪场景——如果一个犯罪黑客想要泛洪你，他会通过对他想要发送给你的每个类型数据包伪造\
  \ IP 地址来隐藏身份。犯罪黑客之所以这样做是因为他们非常清楚，许多商业防火墙很容易检测到来自单一源的泛洪，并将该 `IP` 列入黑名单。当然，如果巨大的流量看起来在短时间内来自单一源，那么你就可以阻止来自该地址的连接。\n\
  \n## 确保你的网络安全\n\n通过确保在有人尝试对你进行端口扫描时能够察觉，你就能保护网络并防止任何网络相关的攻击。此此唯一证明的方法是由人员监控进入系统的流量，并确保所有在线数据请求都是合法的。一旦发生可疑活动，就到了你作为白帽黑客执行防御可能攻击的下一步了。\n\
  \n\n\n现在我们已经下载了 Kali Linux 文件（假设是使用官方 ISO 下载镜像以确保其没有恶意软件），并且准备了与用户的硬件和软件设置匹配的正确\
  \ ISO 镜像，下一步就是正式开始安装过程。当然，为了使用 Kali Linux，安装是必须的，而且我们有多种方法可以安装 Kali Linux，从最基础的方法：将其放置在系统的硬盘驱动器上；到更高级的方法，例如与其他操作系统双启动安装\
  \ Kali Linux。让我们开始吧！\n\n## 在你的机器上安装 Kali Linux\n\n让我们从安装 Kali Linux 发行版最基础的方法开始：将其放置在系统的硬盘驱动器上。到此时，用户应该已经确保了他们的系统硬件是兼容的（提点一下，Kali\
  \ Linux 支持 `i386` / 32 位系统、`amd64` / 64 位系统以及 `ARM` / `armel` / `armhf` 系统）。下一步是确保系统硬件除了具有兼容的系统架构外，还应满足以下最低硬件要求：\n\
  \n### 在你的硬盘驱动器上安装 Kali Linux\n\n- 安装 Kali Linux 至少需要 20 GB 字节的可用硬盘驱动器空间\n- 对于 `i386`\
  \ 和 `amd64` 架构，至少需要 1 GB 的随机存存储器（RAM）（系统内存越大，性能越好）\n- 支持原生 CD-DVD 驱动器或支持 USB 启动\n\
  \n另请注意，`i386` 默认镜像默认启用了 `PAE` 内核，因此它们可以在内存大于 4 GB 的系统上运行。一旦系统硬件符合 Kali Linux 的兼容性和性能要求，就应该将下载或重新构建的\
  \ ISO 镜像刻录到 DVD 中，或者准备好带有 Kali Linux Live 安装介质的 USB 闪。请注意，如果没有 CD-DVD 驱动器支持也不支持\
  \ USB 启动，还有另一种选项，即 Kali Linux 网络安装，我们将在后续章节中讨论。\n\n## 安装步骤\n\n一旦一切就绪（即满足了所有要求且 Kali\
  \ Linux 软件已准备好进行安装），第一步就是插入安装介质并启动/运行它（通过 USB 启动或 CD-DVD 驱动器）。启动介质后会出现带有多个选项的窗口，例如“Live\
  \ (amd64)”、“Graphical Install（图形化安装）”或简单的“Install（安装）”。graphical install”启用 GUI\
  \ 安装，而“install”则启动文本模式安装过程。\n\n一旦选择了安装方法，窗口将要求用户选择其偏好的系统/软件语言，以及其所在的国家地区。此外，可能会弹出一个提示要求用户配置键盘以进行适当的键映射。一旦选择了语言-国家组合并正确映射了键盘，下一步将是输入用户的地理位置。在此步骤之后按下“continue（继续）”，将指示安装程序开始通过将镜像复制到硬盘驱动器来执行安装过程，并探测设备上的网络接口。\n\
  \n完成这些步骤后，安装程序将要求用户输入系统的主机名（host name）。主名的目的是向其所连接的网络标识该系统。用户可以自行选择主机名，并在以后进行更改。下一步是选择一个域名（domain\
  \ name），它是计算机地址的一部分，位于主机名的右侧。此域名通常被认为是“.com”、“.edu”、“.net”后缀。请注意，这一步是完全可选的，但如果使用，最好确保网络上的所有计算机都共享相同的域名，以避免错误或混淆。\n\
  \n一旦选择了主机名和域名，系统将提示用户为用户账户提供一个名称。请注意，该账户**不会**拥有 root 权限，目的是让系统拥有一个可以执行非管理活动而无需管理员权限的账户，以确保安全。在提供名称后，将根据给定的账户创建一个用户\
  \ ID（user-ID），但此 ID 可以编辑以匹配用户的偏好。\n\n一旦设置了所有的命名规范，系统将检查并配置时钟，请求用户所在的时区。请注意，即使在选择了地理位置之后，这一步骤仍然会发生，事实上它指出，如果用户所在的时区未列出，他们可以简单返回选择他们当前所在的国家。\n\
  \n在选择分区后，系统安装程序将再次提示用户检查其选择的配置是否是他们真正想要的，允许用户双重检查配置选项，因为安装 Kali Linux 软件会引起大量的磁盘更改，安装中的错误可能会花费大量的时间和精力来撤销和/或修复。一旦确认了配置，安装程序将在分区的驱动器上开始安装，结果将是一个近乎完成的安装。之后，用户可以配置网络镜像（network\
  \ mirrors），由于 Kali 使用中央仓库来分发应用程序，因此有必要设置网络镜像。注意，如果用户的网络使用了代理，安装程序可能要求用户输入代理信息。\n\
  \n网络设置好后，最后步骤之一是安装“GRUB”引导加载程序，以便能够启动 Kali Linux。注意，如果当前没有安装其他操作系统，用户可以选择将 `GRUB`\
  \ 作为主引导加载程序。如果有其他操作系统，选择 `GRUB` 作为主引导加载程序可能会导致其他操作系统暂时无法启动，但可以通过稍后手动更改配置来修复。完成后，用户只需点击“continue（继续）”重启系统，这将重启并加载新安装的\
  \ Kali Linux 操作系统。\n\n##### 通过网络安装 Kali Linux（预启动执行环境）\n\n如前所述，安装 Kali Linux 的传统方法需要\
  \ USB 启动能力或用于加载安装介质的 CD-DVD 驱动器。这种方法通常用于企业或企业的 Kali Linux 部署，需要在多个设备上预加载 Kali Linux\
  \ 发行版以便使用。这种预装可以通过网络完成，对于那些禁用了 USB 和 CD-DVD 端口和驱动器的设备（如笔记本电脑）非常有用。\n\n通过 `PXE`（预启动执行环境）从网络安装\
  \ Kali Linux 发行版的第一步是安装 `dnsmasq`，它提供了 DHCP/TFTP 服务器。一旦安装了 `dnsmasq`，下一步就是编辑 `dnsmasq.conf`\
  \ 文件。\n\n之前的代码安装了 `dnsmasq`。接下来的代码段将允许用户启用 DHCP、TFTP 和 PXE Boot，并允许用户设置 `dhcp-range`\
  \ 以匹配环境。此外，还可以根据需要使用 `dhcp-option` 指令重新定义网关和 DNS 服务器。\n\n在完成所有必要的更改后，必须重启 `dnsmasq`\
  \ 以使这些更改生效。\n\n\n\n\n一旦 `dnsmasq` 重启并更改生效，下一步是确保存放 Kali Linux 网络引导启动镜像的目录已创建，并且已从适当的\
  \ Kali Linux 仓库下载了正确的镜像。\n\n这应当创建所需的目录并启动必要的下载。随后用户可以简单地启动他们想要在其上安装 Kali Linux 的系统，并将其配置为从连接的网络启动。连接的设备将自动从\
  \ `PXE` 服务器获取 IP 地址，并开始 Kali Linux 的安装过程。\n\n## 将 Kali Linux 安装为加密磁盘安装版\n\n### 提要要求\n\
  \n确保想要运行 Kali Linux 的设备已受到妥当保护，在这些情况下，他们可能希望创建一个使用安全密码加密的安装版本。到此时，用户应该已经确保了系统硬件的兼容性（顺便提醒一下，Kali\
  \ Linux 支持 `i386` / 32 位系统、`amd64` / 64 位系统以及 `ARM` / `armel` / `armhf` 系统）。下一步是确保系统硬件除了具有兼容的系统架构外，还应满足以下最低硬件要求：\n\
  \n- Kali Linux 安装至少需要 20 GB 的硬盘空闲空间\n- 对于 `i386` 和 `amd64` 架构，至少需要 1 GB 的随机访问内存（RAM）（系统内存越高，性能越好）\n\
  - 原生 CD-DVD 驱动器支持或 USB 启动支持\n\n同样注意，`i386` 默认镜像启用了 `PAE` 内核，因此可以在内存大于 4 GB 的系统上运行。一旦系统硬件符合\
  \ Kali Linux 的兼容性和性能要求，应将下载或重新构建的 ISO 刻录到 DVD，或准备好带有 Kali Linux Live 安装介质的 USB 盘。注意，如果没有\
  \ CD-DVD 驱动器支持也没有 USB 启动支持，还有另一个选项即 Kali Linux 网络安装，我们将在后续章节中讨论。\n\n## 安装步骤\n\n\
  一旦一切就绪（即满足了所有要求且 Kali Linux 软件已准备好进行安装），第一步是插入安装介质并启动/运行它（通过 USB 启动或 CD-DVD 驱动器）。启动介质后会出现带有多个选项的窗口，例如“Live\
  \ (amd64)”、“图形安装 (Graphical Install)”或简单的“安装 (Install)”。“图形安装”启用 GUI 安装，而“安装”则启动文本模式安装过程。\n\
  \n一旦选择了安装方法，窗口将要求用户选择其首选的系统/软件语言，以及所在的国家位置。此外，可能会弹出提示请求用户配置键盘以进行适当的键位映射。一旦选择了语言-国家组合并正确映射了键盘，下一步将是输入用户的地理位置。在此步骤后按下“继续\
  \ (continue)”将指示安装程序开始通过将镜像复制到硬盘来执行安装过程，并探测设备的网络接口。\n\n完成这些步骤后，安装程序将要求用户输入系统的主机名（host\
  \ name）。主名的目的是向其连接的网络标识该系统。用户可以选择主机名，并在以后进行更改。下一步是选择一个域名，它是计算机地址的一部分，位于主机名的右侧。该域名通常被视为“.com”、“.edu”或“.net”后缀。注意，这一步是完全可选的，但如果使用，最好确保网络上的所有计算机都共享相同的域名，以避免错误或混淆。\n\
  \n一旦选择了主机名和域名，系统将提示用户为用户账户提供一个名称。请注意，该账户将**没有** root 权限，其目的是让系统拥有一个可以在无需管理员权限的情况下执行非管理活动的账户，以确保安全。提供名称后，将根据给定的账户创建一个用户\
  \ ID（user-ID），但此 ID 可以编辑以匹配用户的偏好。\n\n一旦设置了所有命名规范，系统将检查并配置时钟，请求用户所在的时区。注意，即使在选择了地理位置之后，此步骤仍然发生，事实上它还指出，如果用户所在的时区未列出，他们只需返回并选择他们当前所在的国家。\n\
  \n在选择分区后，系统安装程序将再次提示用户检查其所选配置是否为他们真实想要的，允许用户双检其配置选项，因为安装 Kali Linux 软件会引起大量的磁盘更改，安装过程中出现错误可能会花费大量精力和时间来撤销/或补救。确认后，Kali\
  \ Linux 安装程序将要求用户设置密码，每次启动 Kali Linux 实例时都需要该密码。一旦通过了密码验证，用户只需简单地点击“继续 (continue)”。\n\
  \n一旦确认了配置并选择了密码，安装程序将在分区后的驱动器上开始，结果将是近乎完成的安装。此之后，用户可以配置网络镜像，由于 Kali 使用中央仓库分发应用程序，因此有必要设置网络镜像。注意，如果他们的网络使用了代理，安装程序可能要求用户输入代理信息。\n\
  \n网络设置好后，最后步骤之一是安装 `GRUB` 引导程序，以便启动 Kali Linux。注意，如果当前没有安装其他操作系统，用户可以选择将 `GRUB`\
  \ 作为主引导程序。如果有其他操作系统，选择 `GRUB` 作为主引导程序可能会导致其他操作系统暂时无法启动，但可以通过以后手动更改配置来修复。完成后，用户只需点击“继续\
  \ (continue)”重启系统，这将重启并加载新安装的 Kali Linux 操作系统。\n\n## Kali Linux 与 Windows 操作系统的双系统启动\n\
  \n某些用户可能需要在一台设备上运行两个操作系统——例如，预算限制可能意味着他们只能负担得起一台设备，因此他们需要笔记本电脑能够处理多任务，或者用户可能只是希望在他们加载了\
  \ Windows 的设备上使用 Kali Linux。无论原因如何，Kali Linux 都可以与 Windows 操作系统进行双启动。\n\n在本教程中，我们假设\
  \ Windows 操作系统占据了硬盘的所有空间，因此，我们将教读者如何划分硬盘以减小 Windows 的专用空间，以便用户能够启动 Kali Linux。\n\
  \n- Kali Linux 安装至少需要 20 GB 的硬盘空闲空间（重新分区后）\n\n\n\n\n\n请注意，使用 `PXE` 系统无法创建双启动，这意味着在创建双启动设置时，原生\
  \ CD-DVD 驱动器支持或 USB 启动支持是不可的。\n\n## 创建分区\n\n为了创建分区，必须启动安装介质——这意味着加载下载的 Kali Linux\
  \ ISO 或启动 Kali Linux Live（视具体情况而定）。启动介质后，会弹出一个包含多个选项的窗口，例如“Live (amd64)”、“Graphical\
  \ Install（图形化安装）”或“Install（安装）”。`graphical install` 启用图形界面安装，而 `install` 则启动文本模式安装过程。一旦加载并打开菜单，应选择\
  \ `Live` 选项。此 `Live` 选项将启动 Kali Linux 桌面并允许用户访问某些应用程序和工具。\n\n我们在这里寻找的工具是 `GParted`\
  \ 程序。用户应该查找并启动 Linux 发行版中的 `GParted` 程序。\n\n一旦启动 `GParted` 程序，用户将看到可用选项。系统会列出分区列表，用户必须选择加载了\
  \ Windows 的分区。它在列表中的位置取决于用户的配置，但大多数配置将其作为第二个且最大的硬盘分区。\n\n一旦选择了包含 Windows 启动的分区，只需右键点击该分区并选择\
  \ `resize / move（调整大小/移动）` 以调整相关分区的大小。调整大小使 `unallocated（未分配）`部分至少有二十 GB（`20 GB`），因为这将用于后续的\
  \ Kali Linux 安装。\n\n调整大小后，应用程序仪表板上有一个绿色勾选标记的按钮，这是 `Apply All Operations（应用所有操作）`\
  \ 按钮。只需点击此按钮完成分区。分区完成后，只需退出 `GParted` 应用并重启系统。这将调整硬盘大小，并为用户安装新版本的 Kali Linux 腾出足够的空间。\n\
  \n## 安装步骤\n\n一旦硬盘已妥善分区，只需再次运行安装介质并选择 `install` 选项。按照“在硬盘上安装 Kali Linux”章节中提供的步骤操作，但有一个关键区别，即分区选项的选择，将在下一段中显示。\n\
  \n在完成初步步骤（即语言、位置、时区和键盘映射）后，安装程序将探测系统磁盘并提供五种可能的安装选择。这些选择是：引导式——使用最大的连续空空间（注意这是一个非默认选项，只有在使用\
  \ `GParted` 应用创建分区后才会显示）。选择后（在此情况下应使用“引导式——使用最大的连续空空间”选项），系统安装程序将在之前通过 `GParted`\
  \ 应用释放的 `unallocated` 空间上安装 Kali Linux 发行版。系统安装程序会将“所有文件在一个分区中”作为默认推荐选项给用户，但也允许设置独立的\
  \ `/home` 分区以及独立的 `/home`、`/usr`、`/var` 和 `/tmp` 分区。\n\n## 如何使用 Kali Linux\n\n在黑客入侵系统之前，他或她必须完成某些流程。其中一些包括：\n\
  \n### 1. 侦察 (RECONNAISSANCE)\n为了避免被黑，你应该保持个人信息高度安全。在此语境下，“侦察”是黑客试图收集所有关于你（目标）的信息以及你系统中任何弱点的的一种手段。黑客利用这一步骤尽可能地获取关于目标的信息。\n\
  \n### 2. 扫描与枚举 (SCANNING AND ENUMERATION)\n扫描涉及使用智能系统端口扫描来检查你系统的开放端口和漏洞。攻击者可以使用许多自动化工具来检查和测试你系统的漏洞。\n\
  \n### 3. 获取访问 (GAINING ACCESS)\n如果黑客能够完成上述两个阶段，他/她的下一个阶段就是获取你系统的访问权限。这是黑客所有乐趣开始的阶段。他或她将利用在侦察和扫描你的系统期间发现的缺陷来破解你的连接。黑客可以利用你的局域网、你的互联网（在线或离线）或对\
  \ PC 的本地访问。从现实意义上说，黑客入侵你系统或网络的一刻，黑客就被视为该系统的所有者。安全泄露指的是黑客可以使用恶性技术破坏你系统的阶段。\n\n###\
  \ 4. 维持访问 (MAINTAINING ACCESS)\n在上一阶段中，我们说一旦黑帽黑客入侵你的系统，它就不再属于你了。在这个阶段，在黑客突破了你的安全访问并完全破解你的系统后，他或她可以通过创建后门获得未来访问你计算机权限。因此，即使再次获得了该计算机系统或网络的访问，你仍然无法确定自己处于完全控制。黑客可能会安装某些脚本，即使在你认为威胁已消失时也能访问你的系统。\n\
  \n### 5. 清除痕迹 (CLEARING TRACKS)\n黑客获取了你系统的访问权限并同时维持了对该系统的访问权限。你认为黑客接下来会做什么？黑客随后将清除他或她所有的痕迹，以避免被安全人员或机构发现，以便他或她可以继续使用该系统。在其他情况下，黑客这样做可能为了防止对其采取法律行动。今天，许多安全泄露未被发现。已经存在即使在有警惕日志检查的情况下，防火墙仍被绕过的案例。\n\
  \n到目前，你应该对什么是黑客有了些了解。现在我们将概述保护你、系统和信息免受外部威胁的基本安全准则。\n\n### 更新操作系统 (OS)\n操作系统暴露在各种攻击之中。每天都有新病毒发布，单此就应该让你保持警惕，因为你的操作系统可能受到新威胁的侵害。这就是为什么操作系统厂商定期发布新更新，以便走在威胁之前。这将有助于提高安全性并减少系统成为病毒宿主的的风险。\n\
  \n### 更新软件\n在上一节中，我们讨论了更新的重要性。更新后的软件具有更高的效率和便利性，甚至具有更好的内置安全性。因此，经常更新你的应用程序、浏览器和其他程序至关重要。\n\
  \n### 防病毒软件\n根据我们的研究，我们看到某些操作系统面临许多攻击，特别是微软或 Windows 平台。通过防病毒软件保护你的系统免受病毒的一种方法。防病毒软件可以在许多方面保护到你。恶意黑客可以通过互联网在你的系统中植入病毒，但通过良好的防病毒扫描，你可以发现并消除威胁。与任何其他软件或程序一样，你的防病毒软件需要频繁更新以保持\
  \ 100% 的效力。\n\n### 反间谍软件\n该程序同样重要，因为你不希望系统里存在木马程序。你可以从互联网上获取许多反间谍软件；只需确保你选择获得良好良好的一个。\n\
  \n\n\n\n\n# 选择 Macintosh 系统\n\nWindows 操作系统非常流行，因此许多黑客和破解者都将其作为攻击目标。你可能读过一些文章和博客，说\
  \ Macintosh 操作系统的安全性较低；然而，Macintosh 实际上许多影响 Windows 的威胁具有免疫力。因此，我们敦促你尝试 Macintosh\
  \ 平台。不过，正如我们在其他章节中解释过的那样，世界上没有哪个系统是完全防黑的，所以请不要掉以警惕。\n\n# 避开阴暗网站\n\n当你浏览 Facebook\
  \ 时，可能会遇到未知的人向你发送带有链接的消息，其中某些链接是点击诱饵的形式。避免点击此类链接。此外，你必须避免色情网站，或那些承诺提供“好得不可真实”之物的网站。其中一些网站承诺在你点击链接时提供免费音乐，而另一些则提供免费金钱或电影。这些网站由恶意黑客运营，他们正在寻找方法通过恶意软件链接损害你的计算机。请注意，在某些恶意网站上，你甚至不需要点击任何内容就会被破解。良好的浏览器会在带你进入不良网站之前始终向你发出。请务必听从浏览器的警告，并在必要时返回安全区域。\n\
  \n# 防火墙\n\n如果你是在机构中工作的计算机专家，你可能会遇到多个计算机系统的操作系统处于同一个网络的情况。在这种情况下，你必须安装提供安全防火墙的软件。Windows\
  \ 操作系统内置了防火墙，你可以直接激活并使用。此防火墙功能出现在多个版本的 Windows 中，包括 Windows XP、Windows 专业版、Windows\
  \ 10 以及其他版本。\n\n# 垃圾邮件\n\n你可能因为垃圾邮件被破解。电子邮件提供商已主动根据一组参数对邮件进行分类。某些邮件将直接发送到收件箱，而某些将发送到垃圾邮件文件夹。为了安全，请避免打开看起来可疑的邮件。某些邮件包含你不应该打开的附件。无论邮件提供商采取什么安全措施，某些垃圾邮件仍然会绕过过滤器进入你的收件箱。避免打开此类邮件，不要下载随附的附件。\n\
  \n# 备份选项\n\n某些文件包含机密信息，例如个人文件、财务数据和无法丢失的工作文档。你应该注册 `Google Drive`、`Onedrive` 和其他云盘公司，这样你就可以上传文件作为备份的形式。你也可以购买外部硬盘并将所有重要文件传输传输。采取所有这些安全措施，因为无论你安装了什么防病毒软件，单个恶意软件都可以扰乱你的数据。一旦执行了某些操作，你就无法还原，所以请始终保持备份。\n\
  \n## 密码\n\n这是安全领域最重要的方面。强密码的重要性无论如何强调都不为。从电子邮件、文档甚至安全的服务器，一个良好的密码都是防御外部威胁的第一道也是最后一道防线。密码分为两种：弱密码和强密码。弱密码是用你的手机号码、姓名、家庭成员姓名或容易被猜到的内容组成的。避免使用此类密码，因为即使是业余黑客也能猜到它。\n\
  \n有些人使用生日或特殊纪念日等日期；然而，这仍然安全。在创建密码时，请花些时间做一些基础数学计算，因为你的密码必须包含字母和数字。你甚至可以将其与特殊字符结合。例如，如果你的初始密码是“jack”，你可以将其改为“J@ck007”。这样的密码即使简单，也几乎不可能被猜到。此外，避免写下你的密码。你的密码不是需要备份的文件；它必须是你私人的。确保你使用一个简单但非常强力的密码。但是，请记住，强密码并不能让你完全安全。\n\
  \n# 通用安全提示\n\n到此时，你应该对黑客行为有了深入的了解，并掌握了一些确保你的计算机系统或网络安全的指南。以下是遵循以避免成为黑客受害者的通用建议。\n\
  \n- 当你登录电子邮件时，应避免打开来自未知来源的邮件。最重要的是，不要下载此类邮件附的任何附件。\n- 不要访问不安全的网站。始终访问安全的网站，例如带有“https”的网站。尝试只进行安全浏览。\n\
  - 在安装新程序之前，确保程序已通过扫描以确保其没有病毒。然后，你需要删除任何旧的安装文件，因为你现在有了新的安装文件。如果黑客利用那些旧文件作为后门，这可以避免你的损失。\n\
  - 定期扫描你的文件。还要确保系统上的所有应用程序频繁更新到最新版本。\n- 如果你在家里工作，请确保你与安全专业人士或公司联系，他们可以帮助你检查并尽快修复网络漏洞。\n\
  - 始终备份你的文件。你可以使用安全的云盘，如 `Google Drive` 或 `Dropbox`。你也可以购买外部硬盘以保持你的重要文件安全完整。\n- 你在社交网络上吗？避免点击陌生人发送的链接。此类诱人的信息可能是私人聊天室的邀请，或者是点击链接即可获得金钱。避免它们并保持安全。\n\
  - 随着技术的进步，软件开发者也在进步。始终确保你使用良好的浏览器进行上网。例如，某些浏览器内置了病毒或危险检测机器人，当你尝试访问不安全的网页时，它们会警示你。当你想要下载浏览器时，请选择内置安全特性的。推荐以下浏览器：\n\
  \  a) `Google Chrome`\n  b) `Mozilla Firefox`\n  c) `Safari`\n- 当使用浏览器连接互联网时，使用对你重要的功能。例如，如果你在连接时没有使用\
  \ `Java` 或 `Active X`，请在浏览器中禁用它们。一直保持连接是不安全的。\n- 研究表明，最安全的操作系统是 `Linux` 和 `Macintosh`。如果这两个系统符合你的需求，建议切换到它们。它们更安全，因为与流行的\
  \ Windows 系统相比，遭受黑客攻击的情况较少。\n- 当你睡觉时，如果你的计算机系统处于开启空闲或睡眠模式，仍然可能受到攻击。为了防止这一点，请在不使用计算机时确保已完全关闭。\n\
  \n# 使用 Kali Linux 进行黑客\n\n考虑到为了让 Linux Debian 系统供安全测试人员和“白帽”使用而进行的所有功能和修改，现在的问题是，是什么让\
  \ `Kali Linux` 成为“白帽”黑客的工具？人们可能会认为由于其完善的安全功能和广泛的能力，任何人都想使用 `Kali Linux`。然而，其专业化性质正意味着这一点；`Kali\
  \ Linux` 专为专业人士、安全专家、渗透测试人员和其他类型的“白帽”设计的。因此，如果用户希望有一个用于用途的 Linux 发行版，或者用于开发、设计、游戏的专用发行版，`Kali\
  \ Linux` 几乎没有用处，且特别不推荐 Linux 初学者使用。\n\n\n\n\n请注意，虽然 Kali Linux 是一种开源软件，但出于安全考虑，它并不是完全意义上的开源。因此，开发团队保持在较小规模，每个软件包和仓库都由上传的每个团队成员以及整个团队进行签名，以供验证和安全。此外，所使用的上游仓库数量被保持在最低水平，从那里引用的更新和软件包尽可能少，这同样是出于对安全的考虑。这种配置意味着，添加未经过\
  \ Kali Linux 团队完全审核的新仓库或软件包往往会导致问题，并可能直接破坏 Kali Linux 的安装。尽管如前所述，Kali Linux 的设计初衷是允许用户进行极高程度的自定义，但用户仍然需要知道哪些软件包和仓库与\
  \ Kali Linux 兼容，因为添加不相关或未审核的包或软件仓库极有可能导致 Bug。例如，虽然 Kali Linux 拥有许多功能，但它并不支持 `apt-add-repository`\
  \ 命令、`PPAs` 或 `Launchpad`，这恰恰体现了开发者的意图。其他如 `Steam` 等无关程序也可能不会良好的结果，如果这是用户的意图，Kali\
  \ Linux 发行版可能无法良好运行。\n\n即使是插入如 `NodeJS` 等某些主流软件包也可能需要一些努力和知识，但哪种 Linux 发行版不是这样呢？然而，由于\
  \ Kali Linux 的高级性，它需要不仅仅基础的系统管理员能力才能正确使用并释放 Kali Linux 发行版的全部潜力。这也是 Kali Linux 不推荐给初学者的另一个原因，因为其专业性意味着很难从零开始学习，而且由于其高度专业化，通过学习\
  \ Kali Linux 学到的知识可能并不完全适用于其他 Linux 发行版。\n\n最后但同样重要的一是，由于 Kali Linux 是作为一种“白帽”工具开发的，并包含了大量的安全和渗透测试工具，如果用户不是非常熟悉自己在做什么，这些工具可能会被不当使用。误用这些工具（特别是在用户未获得明确授权的网络上）可能会对系统或网络造成损害，并可能导致许多后果，无论是个人还是法律层面的。请注意，虽然这是网络服务默认禁用的原因，但如果发生了什么，“我不知道我做了什么”并不是一个有效的借口，缺乏经验的用户可能会发现自己陷入了困境。\n\
  \n然而，对于专业的渗透测试员或“白帽人士”，甚至对于那些以成为专业人士为目标仍在学习或练习的人来说，Kali Linux 拥有可用最好且最丰富的工具包之一，尤其是在它的价格水平下——免费。\n\
  \n# 第 4 章. Bash 和 Python 脚本\n\n那么我们为什么要用 Python 进行协作处理呢？尽管在某些情况下，`GIL` 不允许带有线程的\
  \ `CPython` 程序获得多处理器系统的所有优势，但大多数涉及阻塞或长期执行的操作（例如输入/输出、图像处理以及 `NumPy` 中的数字计算）都发生在现有\
  \ `GIL` 之外。因此，`GIL` 本身仅对那些在 `GIL` 内部花费大量时间的线程程序成为潜在的瓶颈。正如你将在后续章节中看到的，多线程只是一种协作处理编程，尽管\
  \ `GIL` 会为多线程 `CPython` 程序中的某些调用允许超过一个线程访问共享资源，但其他形式的并行编程并没有这个问题。例如，具有许多进程且进程之间不共享任何公共资源的应用程序（如输入/输出、图像处理或\
  \ `NumPy` 数字）可以与 `GIL` 无缝工作。\n\n此外，Python 在编程社区中变得越来越流行。得益于用户友好的语法和良好的可读性，越来越多的人认为在开发中使用\
  \ Python 是相对容易的，无论是学习新编程语言的初学者、具有平均训练水平寻找可用现代 Python 功能的用户，还是使用 Python 解决复杂问题的资深程序员。估计\
  \ Python 代码的开发速度可以比 `C / C++` 编码快 10 倍。\n\n大量使用 Python 的开发者的出现源于一个强大且不断增长的社区。每天都有\
  \ Python 库和软件包被开发和发布，提供各种任务和技术。目前，Python 支持极其广泛的编程——即软件开发、GUI 工作站、视频游戏设计、Web 和互联网开发，以及科学和数值计算。近年来，Python\
  \ 也成长为数据科学、大数据和机器学习领域的顶尖工具之一，与该领域的长期选手 `R` 竞争。\n\n## 运行 Python 脚本\n\n要在 Python 编程中脱颖而出，你深入了解如何在\
  \ Python 中运行脚本和代码至关重要。这是必不可少的，因为脚本和代码是你检查代码功能的唯一途径。因此，功能性代码在于能够运行脚本和代码。在本节中，重点将是你可以运行\
  \ Python 脚本的所有过程，无论你拥有什么样的操作系统平台、要求以及作为程序员所掌握的技能 set。\n\n首先，让我们先考虑脚本和模块的概念。\n\n\
  ### 脚本与模块\n\n在计算机编程中，脚本可以定义为包含逻辑顺序指令的文件。它也可以被看作批处理文件。它通常以简单程序的形式存储在纯文本文件中。要处理脚本，需要一个解释器。解释器必须顺序运行每条命令。因此，任何包含\
  \ Python 代码的纯文本文件被称为脚本，这是一个非正式指代顶级程序文件的术语。然而，并不是所有包含 Python 代码的纯文本文件都是脚本。模块是由 Python\
  \ 代码组成的纯文本文件，设计用于导入另一个使用它的 Python 文件。\n\n将这两个术语对比；模块与脚本的区别在于，因为前者被设计用于导入，而后者旨在直接运行。无论情况如何，关键是要学习如何将你在\
  \ Python 中编写的代码运行到脚本和模块中。\n\n### 解释器\n\n为了更好地理解脚本和模块的概念，让我们深入探讨解释器的概念。Python 可以是一种解释型语言。解释器是运行\
  \ Python 脚本和代码所需的关键程序。在技术术语中，解释器是一种软件形式，通过在计算机硬件和程序之间工作来运行代码。不同类型的平台有不同的解释器。因此，取决于你使用的\
  \ Python 实现，你的解释器可以是以下任意一种：\n\n1. 使用 C 语言编写的程序，例如 CPython —— 该编程语言的核心实现。\n2. 使用\
  \ Java 编写的程序。例如 `Jython`。\n3. 使用 Python 编写的程序，例如 `PyPy`。\n4. 在 .NET 中实现的程序。例如 `IronPython`。\n\
  \n\n\n\n无论你编写的代码以什么形式存在，都会由解释器执行。因此，能够执行 python 脚本的首要条件是你的电脑上正确安装了解释器。解释器能够以以下方式执行\
  \ python 代码：\n\n* 作为代码块输入交互式会话中；或\n* 作为模块或脚本。\n\n## 如何在交互式会话中运行 python 代码：\n\n通过交互式会话运行\
  \ python 代码是执行脚本和模块的常用方式之一。要启动 python 交互式会话，需要打开终端或命令行。接下来，根据使用的 python 版本，输入 `python`\
  \ 或 `python 3` 并回车。交互模式下的默认提示符是符号 `>>>`。因此，每当你看到这些字符时，请记住你已经进入了交互式界面。在这里，你可以尝试编写并运行你的\
  \ python 代码。然而，尽管这种方法看起来很简单，但它有一个主要的缺点：你的代码持续时间与会话同长。一旦你终止了会话，你的代码就会消失。这种方法的优点在于你输入的任何语句和表达式都会立即被求值并执行。它允许你测试编写的每一行代码，使其成为开发的极佳工具，也是简单快速练习\
  \ python 编码的良好平台。要退出交互模式，你可以使用以下任何其他方法：\n\n* 你可以使用内置函数，如 `exit()` 或 `quit()`。\n\
  * 你也可以使用组合键。对于具有 Unix 风格的系统，你可以使用 `Ctrl and D`。而在 Windows 中，你可以使用键键 `Ctrl + Z` 并回车。\n\
  * 请注意，在 python 编码时需要记住的首要通用指南是，当你怀疑任何代码的功能时，使用交互式会话。\n\n如果你没有使用终端或命令线的经验，以下是一些你可以使用的步骤：\n\
  \n1. 当使用 Windows 时，找到命令行（也称为 MS-DOS 控制台或命令提示符）。命令行是一个名为 `cmd.exe` 的程序。然而，该程序的路径可能会随着你系统版本的变化而改变。\n\
  2. 为了快速访问它，你可以使用快捷键 `Win + R` 运行运行对话框。一旦界面打开，输入 `cmd` 并回车。\n3. 在运行 GNU 或 Linux 以及其他版本\
  \ Unix 的平台上，有许多应用程序提供访问系统命令行的方法。其中一些包括 `Konsole`、`xterm`、`Terminal` 和 `Gnome`。这些工具运行终端或\
  \ shell，如 `csh`、`ksh`、`Bash` 等。在这种情况下，每个应用程序的路径更加多样，取决于它的分发方式以及你所用电脑的环境。因此，注意关于你系统的文档是非常关重要的。\n\
  4. 在运行 Mac OS X 平台的系统上，可以通过以下过程访问系统终端：\n5. 进入“应用程序”，进入“实用工具”并点击“终端”。\n\n## 解释器如何运行\
  \ python 脚本：\n\n运行 python 脚本的过程充满了解释器经历的多个步骤。在此过程中，解释器执行以下操作：\n\nI. 按顺序处理你脚本中的语句。\n\
  II. 将源代码编译为字节码 —— 一种中间格式：\n字节码代表代码转换为独立于平台的底层语言。字节码的目的是优化代码的执行。因此，在运行你的代码时，解释器跳过了编译过程。请注意，只有模块会经历代码移动，因为它们被导入了，可执行的脚本不会。\n\
  III. 发送待执行的代码：\n在这里使用了 `PVM`（Python 虚拟机），它是 python 的运行时引擎。`PVM` 作为一个循环工作，遍历你字节码中包含的指令，一个接一个地运行它们。然而，不要将\
  \ Python 虚拟机视为 python 的孤立部分。不，它仅仅是安装在你机器上的 python 系统的一部分。在 Python 解释器中，`PVM` 是最后一步。\n\
  \n执行 python 脚本所需的整个过程被称为 Python 执行模型（Python Execution Model）。\n\n## 如何使用命令行执行 Python\
  \ 脚本：\n\nPython 中的交互式会话允许你编写许多不同的代码行，但你一关闭窗口，你编写的所有内容都会丢失。这解释了为什么 python 程序应该使用纯文本文件编写。按照惯例，这种方式创建的文件会带有\
  \ `.py` 扩展名，在 Windows 操作系统上也可以是 `.pyw`。任何纯文本编辑器都可以用于 python 代码。为了使这部分更具实操性，你必须创建一个示例测试脚本来解释如何运行\
  \ python 脚本。\n\n首先，打开文本编辑器并输入以下代码行：\n\n```python\n#!/usr/bin/env python3\n\nprint(\"\
  Hello World!\")\n```\n\n继续将文件保存到你的目录中，文件名为 `hello.py`。这标志着你编写测试脚本的完成。\n\n### 如何使用\
  \ python 命令：\n\n要运行你的示例 python 脚本或任何其他脚本，你必须使用 python 命令。首先打开命令行并输入单词 `python3`\
  \ 或只需 `python`，取决于你安装的版本。接下来，按照如下方式为你的脚本附加路径：\n\n```bash\npython3 hello.py\n```\n\
  \nHello World!\n\n如果你的代码没有错误，执行应该正常工作，屏幕上会显示“Hello World!”字样。这就是运行 python 脚本的方法。如果脚本无法运行，可能是你在编码或添加路径时犯了错误，或者你安装的版本有问题。交叉检查你的文本文件以确保它是无错误的。如果是这样，检查你的路径；即文件保存的位置。基本上，这是执行\
  \ python 脚本最简单且实用的方法。\n\n### 如何重定向输出：\n\n有时保存 python 脚本的输出以便日后分析很有帮助。为了这样做，输入以下代码行：\n\
  \n```bash\npython3 hello.py > output.txt\n```\n\n这样做，你把 python 脚本的输出重定向到名为 `output.txt`\
  \ 的文件，而不是 `stdout` —— 默认系统输出文件。如果现在你的系统中不存在 `output.txt` 文件，该过程将自动创建它。然而，如果它已经存在，新的输出将替换其中的内容。因此，你的代码行应如下：\n\
  \n```bash\npython3 hello.py >> output.txt\n```\n\n现在，输出不再被替换，而是被附加到 `output.txt`\
  \ 的末尾。\n\n### 如何使用 -m 选项运行模块：\n\n在 Python 中，提供了一些命令行选项以满足用户的许多不同需求。例如，如果你想在 Python\
  \ 中执行一个模块，可以使用命令 `python -m <module-name>` 运行。`-m` 选项是在 `sys.path` 中搜索内容作为 `__main__`\
  \ 运行的模块。参考以下实例：\n\n```bash\npython3 -m hello\n```\n\nHello World!\n\n请注意，`module-name`\
  \ 必须根据模块对象命名，而不是字符串。\n\n\n\n\n\n道德黑客，或者网络社区所称的“白帽”，在技术上属于黑客，因为他们的工作是寻找各种计算机网络和系统中的漏洞和其他可被利用的弱点。这些“白帽”之所以被称为这样，是因为白色与善良联系在一起，因此他们是为了网络的良好而工作，通过尝试发现其弱点以便进行修复。\n\
  \n公司聘佣道德黑客是为了更好地改进其安全系统，因为网络安全对于任何公司或企业来说至关重要，这确保他们不会被欺骗、被盗窃或遭受其他损害；因为一个容易受到攻击攻击的网络将允许恶意攻击者或黑客窃取数据、造成财务损失或其他种类的损害。\n\
  \n请注意，在操作和使用的工具方面，道德黑客的实际操作方式往往与黑客相似。毕竟，黑客进入系统的意图是寻找漏洞，而许多顶级工作工具也供那些意图不那么高尚的人使用。此外，道德黑客或“白帽”通常还会刻意地使用与自由职业黑客或恶意黑客（即“黑帽”）相同的软件和工具，因为他们的工作是在“黑帽”之前发现相同的漏洞，或者在未能发现的情况下，找到修复和修复这些网络漏洞与弱点的方法。为了实现这一点，逻辑上只需以类似于“黑帽”的方式来处理问题，允许他们“戴上”对手的帽子”，以便像他们一样思考。\n\
  \n请注意，仅仅由合法注册实体（如企业或公司）聘用黑客并不意味着他们自动成为“白帽”。有些企业聘用“黑帽”是为了从竞争对手那里获取公司数据或其他敏感信息。“白帽”的特征是他们只寻找自己雇主网络安全中的漏洞，并且他们获得了此的明确授权，而且他们有责任和义务尽快向雇主报告发现的任何和所有漏洞。\n\
  \n还有另一类黑客，通常被称为“灰帽”，他们介于“黑帽”和“白帽”之间的中间地带。这些“灰帽”的功能与“白帽”类似，他们寻找漏洞是为了报告它们，允许网络所有者修复漏洞，但这些“灰帽”在没有网络所有者授权的情况下工作，这意味着尽管他们可能意图良好，他们所做的行为极有可能违反所在国家的网络犯罪法律。\n\
  \n## 道德黑客的分步骤流程\n\n当你的互联网连接被黑客攻击时会发生什么？你的连接不仅会变慢，你的身份和位置也可能被犯罪黑客利用你的网络进行任何非法活动。同时，由于发现了有漏洞的端口和共享网络设备（如打印机），犯罪黑客极可能更深入访问你的个人电脑。如果你的手机也同步到了电脑上，那么存在犯罪黑客也可能访问该设备的风险。\n\
  \n因此，了解你的互联网连接如何被破解非常重要。在本章中，你将学习大多数犯罪黑客如何通过最流行的黑客工具破解你的互联网连接。\n\n### 方法 1：检查未更改的路由器密码\n\
  \n这可能是破解互联网连接最简单的方法。你只需要查看你可以连接的所有可用网络。要做到这一点，打开电脑的 WiFi 并查看附近的可用网络列表。\n\n现在，你会发现可用网络列表中常见的路由器名称，例如\
  \ `Linksys`。这些路由器的默认密码未被更改的可能性很大，因此你只需要登录制造商提供的密码即可。如何操作呢？你只需要访问制造商网站并查找路由器说明。\n\
  \n如果你能够使用默认密码进入目标网络，请打开一个新的浏览器并登录到目标路由器的 GUI。如果你的目标是 `Linksys` 路由器，显示其 GUI 的 IP\
  \ 地址是 `192.168.1.1`。当提示输入登录凭据时，将用户名留空，密码处输入 `admin`。（注意：某些路由器根据型号不同的不同的登录凭据。你可以在制造商网站上检查这些内容。）\n\
  \n一旦进入 GUI，你就可以更改目标路由器的 `SSID`、路由器密码和安全协议。通过这种方式，你将完全控制路由器并防止网络所有者连接到他自己的 ISP（ISP）！\n\
  \n这种方法假设有太多的互联网用户在使用之前对互联网连接的安全不够小心。你会感到惊讶的，竟然有人懒得更改他们 Wi-Fi 的 `SSID`，这几乎暴露了它除了制造商使用的密码之外没有受到其他安全保护。\n\
  \n### 方法 2：破解互联网密码\n\n当黑客尝试破解的 Wi-Fi 受到保护时，他们会做什么？他们会做的下一件事是检查猜测目标网络密码有多大可能。此时，你需要学习在涉及识别和分配\
  \ Wi-Fi 连接安全性时的一些关键术语：\n\n1. `WEP` – 代表无线等效加密（Wired Equivalent Privacy）。这是互联网加密最基础的形式，因此对于大多数互联网用户来说，在为无线连接分配安全性时，这是一个不安全的选项。这种类型的加密可以使用最基础的黑客工具轻松破解。旧版本的\
  \ Wi-Fi 模型仍在使用这种加密。\n2. `WPA` – 代表 Wi-Fi 保护访问（Wi-Fi Protected Access）。对于较新的计算机和路由器模型，这是一个更安全的选项，可以通过传统的试错法猜测组合来有效破解。如果使用了强密码，`WPA`\
  \ 连接几乎无法破解。这种安全协议的另一个变体是 `WPA-2`，它更难渗透。\n\n此时，你已经意识到大多数黑客会选择破解通过 `WEP` 协议保护的可用网络，因为它更快且更容易破解。以下是黑客破解受\
  \ `WEP` 保护的互联网连接所需的工具列表：\n\n1. 无线适配器 –你需要一个与 `CommView` 软件兼容无线适配器。该软件允许网卡进入监听模式。要查看你的网卡是否兼容\
  \ `CommView`，你可以访问 `tamos.com` 查看你的适配器是否在列表中。\n2. `CommView` – `CommView for Wifi`\
  \ 是一种用于从目标网络捕获包的软件。你只需要安装此软件，然后按照安装指南为你的网卡安装驱动程序。\n3. `Aircrack-ng GUI` – 这种软件允许你在完成数据包捕获后破解目标网络的密码。\n\
  \n按照以下步骤开始破解 `WEP` 加密的网络：\n\n1. 运行 `CommView for Wifi` 根据通道扫描无线网络。让它运行几分钟。你将看到一个你的无线适配器可以到达的网络列表。\n\
  2. 选择一个 `WEP` 网络（你会在网络名称旁边看到它）。选择一个分贝（dB）值最低且信号最强的网络。\n\n\n\n\n\n3. 一旦你选择了目标，右键点击它以打开右菜单。点击\
  \ `Copy MAC Address`。\n\n4. 转到菜单栏上的 `Rules` 选项卡并选择 `MAC Addresses`。勾选 `MAC Address`\
  \ 规则。\n\n5. 对于 `Action` 选项，选择 `CAPTURE`。之后，转到 `Add Record` 选项并选择 `BOTH`。\n\n6. 完成规则格式化后，将复制到剪贴板的\
  \ MAC 地址粘贴到其下方的框中。\n\n7. 在捕获包时，请记住你只需要捕获将用于破解的包。为了确保你只捕获所需的包，请选择选项 `D`（你可以在窗口正方的栏上找到）并取消勾选\
  \ `Management Packets` 和 `Control Packets`。\n\n8. 确保你保存了捕获到的包，以便以后破解。转到菜单栏上的 `Logging`\
  \ 选项卡并启用 `Auto Saving`。随后，将 `Average Log File Size` 设置为 `20`，并将 `Maximum Directory\
  \ Size` 设置为 `2000`。\n\n9. 现在，等待直到捕获足够的数据包。确保你等到至少有 `100,000` 个数据包，以便你获得用于破解的良好信号。\n\
  \n10. 收集足够的数据包后，转到 `Log` 选项卡并选择捕获期间保存的所有日志。转到保存日志的文件夹。点击 `File`，然后点击 `Export`，选择\
  \ `Wireshark tcpdump format` 将其保存为 `.cap` 文件。选择任何你以后方便访问的路径。不要关闭 `CommView`。\n\n\
  11. 现在，你准备好破解了。运行 `Aircrack-ng GUI` 并选择 `WEP` 选项。系统会提示你打开之前导出的 `.cap` 文件。一旦检索该文件，选择\
  \ `Launch`。\n\n12. 一旦你的 `Aircrack-ng GUI` 运行并解密日志中的数据包，打开命令提示符。输入你之前选择的网络的索引号。\n\
  \n13. 等待无线密钥出现。\n\n如果一切进展顺利，你就能轻松地获得目标网络的无线密钥。如果你漏掉了一些包，`Aircrack-ng` 会提示你还需要捕获更多包。如果发生了这种情况，你只需要等待\
  \ `CommView` 获取你所需的额外包。\n\n## 更强的安全措施能被破解吗？\n\n到此时，你会意识到对于大多数黑客来说，访问你正在使用的网络安全类型相当容易。同时，你应该有这样一个观念：一旦犯罪黑客知道你正在使用的加密类型，他们就更容易识别出用于破解你网络应使用的工具。\n\
  \n黑客有可能破解如 `WPA` 和 `WPA2` 等更高级的协议吗？是的，他们可以实现这一目标，但需要花费更多时间——使得过程效率低下，特别是考虑到他们破解网络连接的目标是为了享受更好的带宽和即时的互联网访问，甚至为了掩盖自己的位置。出于因此，如果你的设备允许，最好启用\
  \ `WPA`（或其他更好的加密选项）。\n\n现在你已经对黑客如何窃取你的 Wi-Fi 有了大致，是时候采取一些预防措施了。下一章将告诉你更多相关信息。\n\n\
  # 第 6 章 网络安全基础知识\n\n网络恐怖主义可以通过计算机网络和互联网来实现个人目标，一些经验丰富的网络恐怖分子能够对政府系统、医院记录以及国家军事和安全计划造成大规模破坏，使一个国家处于动荡状态，对进一步的攻击感到恐惧。许多网络恐怖分的目标通常与政治或意识形态日程有关。\n\
  \n网络恐怖主义在预防或保护系统方面具有挑战性，因为它具有很大的匿名性，动机未知，并且未来是否会再次受到攻击具有不性。对于网络恐怖主义的确切定义，或者它是否应该被称为恐怖主义存在一些争议，因为这些行动与传统的恐怖主义方法没有密切联系，而是指向信息战；然而，由于许多动机具有政治性质并针对破坏基础设施，该术语松散地属于恐怖主义的范畴。\n\
  \n网络恐怖主义可以由个人、团体和组织实施，在某些情况下由攻击竞争政府的国家实施。由于潜在的损害，网络恐怖主义目前是政府和媒体来源的关注重点，诸如联邦调查局 (`FBI`)\
  \ 和美国中央情报局等政府机构建立了专门的打击小组，以减少网络恐怖主义造成的破坏。\n\n网络恐怖主义可以通过多种技术实现，例如网络渗透和为了干扰和瘫痪系统而创建的病毒。网络恐怖主义比为了个人利益的简单网络犯罪更危险。网络恐怖主义会对受攻击的国家和机构产生严重后果，使生命面临危险。随着我们技术的进步，有很多方法可以对抗网络恐怖主义，首先通过预测和准备攻击并实施预防计划，在此之后我们准备事件管理，以在攻击达到目标的情况下限制攻击造成的损害。一旦攻击发生，防御的下一阶段是实施后果管理，即评估损害并记录我们如何在未来改进防御，然后重新开始这一过程。\n\
  \n## 网络恐怖主义的特征\n\n在理解了网络恐怖主义的定义后，发现许多网络恐怖分子具有具有非常相似的共同特征，这些特征可以将他们归类为网络恐怖分子。其中一个特征是，网络恐怖主义攻击的受害者是被专门针对的，而不是像除了财务利益或娱乐外没有明确目标的黑客那样是随机的。虽然存在黑客向普通公众发布病毒或蠕虫的随机情况，但这样做通常有明确的目标，受害者是由于黑客预设的原因而针对的特定群体或国家。其他目标涉及攻击组织、行业、部门或经济体，以造成破坏或摧毁其目标为目的。\n\
  \n最后，网络恐怖主义的另一个共同特征是推进恐怖组织自己的目标，这些目标可能是财务的、政治的宗教或意识形态的。这些恐怖分子试图通过对目标造成严重损害来实现这一目标，并通过公开宣传来使自己的目标显而易见。\n\
  \n## 网络恐怖主义攻击类型\n\n加利福尼亚州蒙特雷的海军研究生学院恐怖主义与不规则战争研究中心将网络恐怖主义分为三个主要类别。这些类别是：简单非结构化、高级结构化和复杂协调化。\n\
  \n### 简单非结构化\n这些是小规模攻击，通常由经验丰富的黑客使用他人创建的广泛可用工具执行。此类攻击背后的黑客通常缺乏指挥控制技能，并且学习能力有限。\n\
  \n### 高级结构化\n这些类型的攻击更为复杂，可以针对多个系统或网络，负责的黑客拥有修改甚至创建基础黑客工具的能力。虽然黑客拥有有限的指挥控制技能，但他们具有不断学习的能力，并根据他们针对的组织构成了重大风险。\n\
  \n\n\n\n\n## 复杂协同攻击\n在攻击规模的高端，协同一致且复杂的攻击可以对受攻击系统产生毁灭性影响，通过对集成和异构防御体系造成大规模扰乱。这类黑客具有创建复杂黑客工具的能力，并拥有强大的命令与控制能力，以及先进的进一步学习和技能发展能力。\n\
  \n理解每种攻击类型允许组织制定适当的应对措施来对抗和防止攻击，并在攻击发生后实施损害控制。\n\n### 侵入 (Incursion)\n侵入攻击的目标是访问或渗透包含攻击所需价值信息的网络和系统。这是最常见的攻击之一，对恐怖分子而言其成功率高得多。由于黑客可以利用大量的漏洞，恐怖分子能够利用薄弱的安全性和漏洞来获取甚至修改安全信息，这些信息随后可以被循环用于对该组织进行进一步攻击，或供攻击者个人获。\n\
  \n### 破坏 (Destruction)\n这是一种更为严重的攻击，目标是渗透计算机系统并造成损害，最终破坏网络。对于遭受此类攻击的组织来说，在维修和收入损失方面可能涉及巨大的成本。意在破坏的攻击者可以使整个系统陷入混乱，导致组织无法运行，从而在财务上产生影响，并在某些情况下，由于客户在严重攻击后担心其信息的安全性，会破坏其声誉。对于政府而言，破坏性攻击可能使系统陷入混乱。组织从最严重的破坏性攻击中完全恢复需要一段时间，而这正是黑客的目标。\n\
  \n### 虚假信息 (Disinformation)\n虚假信息攻击同样具有破坏性。这涉及传播破坏信誉的谣言和信息，对目标产生严重影响。发出的谣言可能真可能假，但它们具有同样的破坏性，并可能对相关的组织或国家产生长期影响。一旦此类攻击实施，损害控制将变得非常困难，因为无论渗透是否被阻止，信息都会传播。信息可能涉及某些丑闻和腐败指控，这会损害组织内部个人或组织本身的声誉，导致维持组织运转的秩序中断。\n\
  \n### 拒绝服务 (Denial of Service)\n我们在书中前面已经提到过拒绝服务，因为它是最常见且广为人知的攻击形式之一。在网络恐怖主义方面，`DoS`攻击发生在拥有在线业务的机构和实体上，攻击在发生时使网站或服务变得无效。因此，这类攻击可能会在业务和社会经济功能上造成巨大问题，导致组织遭受巨大损失。\n\
  \n### 网页篡改 (Defacement of Web Sites)\n虽然严重程度或破坏性不及，但网页篡改对企业仍可能有巨大的后果。网页篡改可能涉及网站被完全更改，包括来自网络恐怖分信息，用于他们的宣传或公开目的，以实现某种事业。在其他情况下，黑客可能会导致网站重定向到他们之前建立的网站，该网站可能还包含他们设计的旨在，旨在获得对其宣传或事业的关注和认知。随着安全措施的加强，这类攻击在近年来有所减少，因为黑客访问网页足够长时间以实施更改的概率降低，且大多数主要组织已有效地阻止了这种行为。\n\
  \n## VPN 简介\n使用其 `IP` 地址可以黑入计算机或系统。步骤如下：\n\n1. 获取目标系统的 `IP` 地址。例如：`101.23.53.73`。\n\
  2. 下载并安装高级端口扫描器。\n3. 打开已安装的软件，在右侧列输入目标的 `IP` 地址。输入 `IP` 地址后，点击 `scan`。\n4. 现在，它将进行扫描并为您提供目标系统或目标路由器上所有开放端口列表。例如：`Port\
  \ 96`。\n5. 应用程序将要求您输入登录信息，输入用户名和密码并按回车。如果没有密码，只需提供用户名。\n\n通过此，你将能够访问目标系统上的文档和文件。你可以使用\
  \ `command prompt` 来复制、创建或删除文件。\n\n## 隐藏\n如今，大多数用户都拥有 `Wi-Fi routers`。手机、笔记本电脑、平板电脑、电视等所有设备都连接到\
  \ `Wi-Fi router`。互联网服务提供商会为路由器提供公共 `IP` 地址。任何连接到路由器的设备将获得一个私有 `IP` 地址。如果你从设备连接到互联网，你的路由器看起来就像你的电脑。在某些情况下，用户只使用一台设备，不需要路由器。这时计算机直接连接到互联网，该系统将获得公共\
  \ `IP` 地址。另一端主机可以跟踪你的互联网活动，因为分配给你的 `IP` 地址是公共。\n\n### 使用虚拟专用网络隐藏您的 IP 地址\n如果你想隐藏\
  \ `IP` 地址，可以使用 `VPN` 服务。`VPN` 代表虚拟专用网络（Virtual Private Network）。它是一种私有网络，允许用户在不泄露用户系统实际\
  \ `IP` 地址的情况下连接到互联网或另一个网络。`VPN`为用户的电脑分配自己的 `IP` 地址。由互联网服务提供商提供的 `IP` 地址将不再提供并保持隐藏。\n\
  \n以下是一些流行的虚拟专用网络提供商：\n* `Hide My Ass`\n* `Pure VPN`\n* `Vypr VPN (Free Trial)`\n\
  * `ZenMate VPN`\n* `Express VPN`\n\n### 保护您的身份\n如果你使用自己的 `IP` 地址上网，攻击者有监控你敏感信息的机会。如果攻击者获取了你的\
  \ `IP` 地址，你的隐私、安全和位置可能会泄露。你可以通过使用其他用户的 `IP` 地址来解决这个问题。这样，你可以保护自己的身份并免受攻击者的侵害。可以使用多种工具帮助你屏蔽\
  \ `IP` 地址。\n\n### 使用代理服务器屏蔽 IP 地址\n互联网上有许多代理服务器，你可以利用它们进行匿名上网。当你使用代理服务器访问网站时，你的原始\
  \ `IP` 地址将被隐藏，并会给你一个新的 `IP` 地址。然而，给你的 `IP` 地址是临时的。换句话说，使用代理浏览器可以让你间接访问网站。\n\n###\
  \ 使用他人的网络\n与其使用自己的网络，你实际上可以使用免费的 `Wi-Fi` 作为替代。许多酒店和咖啡馆为他们的客户提供免费的 `Wi-Fi`。如果你从不同的位置连接互联网，你连接时使用的\
  \ `IP` 地址也会改变。这是因为不同的位置有不同的 `IP` 地址。\n\n\n\n\n\n# 恶意软件\n\n恶意软件（malicious software）是黑客用于渗透或利用他人计算机或网络的软件或硬件工具，其口号通常是从个人或组织中获取个人或敏感信息。由于恶意软件也可用于破坏或瘫痪计算机或网络的运行，让攻击者有机会通过访问系统来获取信息。这些工具的设计意图是为了对它们所感染的实体造成危害。恶意软件通常违背用户的需求。恶意软件分为两类：引起无意危害的和专门设计用于造成危害的。我们使用\
  \ `badware` 一词来定义它们。\n\n恶意软件的设计目的是隐地收集信息。它们在未经用户同意或许可的情况下收集信息，并被设计为长时间运行。如果没有适当的工具，极其难以发现。它们伪装成系统文件。它们的一些功能包括造成危害、信息检索、破坏系统和勒索软件。包含软件和敌对软件都属于恶意软件。它们包括病毒、特洛马、间谍软件、广告软件等恶意软件程序。恶意软件通常伪装成非恶意程序，以便能够继续隐蔽地工作。根据最近的研究，病毒和特洛马是最广泛使用的恶意软件。病毒现在正被蠕虫取代，且其数量近期有所下降。\n\
  \n## 恶意软件类型\n\n### 广告软件 (Adware)\n广告软件是所有类型中最获利且危害最小的。它们的设计唯一目的是在你的计算机上显示广告。\n\n\
  ### 间谍软件 (Spyware)\n间谍软件的设计目的是监控用户并不断监视其活动。它们随时跟踪用户的活动。根据用户的互联网活动，它们会相应显示广告。在收集所需信息后，它们与广告软件合作，并在用户在线时行动。\n\
  \n### 病毒 (Virus)\n在计算机科学中，病毒可以定义为一种具有传染性的程序或代码。它们选择软件并附着在上面。通过这种方式，它们可以通过自我复制来繁殖。除非你有适当的工具，否则很难检测到病毒。它们可以通过网络或直接文件共享地从受感染的程序、文件夹和文件中传播。例如，如果你向受感染的计算机插入\
  \ USB 设备，病毒将附着在传输到 USB 设备的文件并感染它。连接到该 USB 的任何设备都会被感染。病毒还可以附着在电子邮件附件上，如文本文件、音乐文件或视频。一旦对方下载了它们，它们也会开始感染对方。\n\
  \n### 蠕虫 (Worm)\n蠕虫是小型且简单的程序，专门设计用于破坏操作系统的系统文件，从而瘫痪系统的整体功能。它们在许多方面与病毒相似，并且也可以自我复制。它们伪装成系统文件并隐藏在文件夹中。它们会消耗硬盘空间和处理器等系统资源，通过减慢进程运行速度和耗尽硬盘空间来影响系统性能。\n\
  \n### 特洛伊马 (Trojan)\n设计特洛伊马的主要动机是窃取敏感的用户信息，包括个人和财务信息。在所有恶意软件中，特洛伊马被认为危害最大。它们是所有类型中最危险的。特洛伊马是攻击者执行拒绝服务攻击的主要工具。它们在后台不断跟踪用户活动，并通过创建和维护一份完整的用户活动日志来通知放置它们的人。特洛伊马可能很难检测，并且可以隐藏很长时间。某些类型的特洛伊马声称可以从用户计算机中删除病毒，但实际上，它们会添加自己的病毒。“特洛伊木马”这个名字源于希腊神话，希腊人使用一个木马来欺骗特洛伊人。他们制作了一个木马并躲在里面。他们将木马留在特洛伊的岸边，作为给神的牺牲。特洛伊人将木马带进了高墙内，这时希腊人从内部进攻了特洛伊城。如果你仔细想想，特洛伊木马是一个非常贴切的比喻。\n\
  \n### Rootkit 根 get\n我们知道每个系统都有防火墙保护，防火墙可以阻止大多数恶意软件。攻击者设计 Rootkit 是为了破坏系统的防火墙保护。Rootkit\
  \ 不直接感染系统，而是作为后门工作，允许其他恶意软件进入系统。它们在用户面前隐藏自己，并在后台打开网关，以便其他恶意软件进入。从用户的角度来看，似乎没有任何问题。\n\
  \n### 键盘记录器 (Keyloggers)\n键盘记录器的设计特定目的是记录用户的击键次数。无论在线还是离线，它们都会继续记录并存储来自键盘的用户输入，当用户在线时，它们会将这些信息发送给放置它们的人。初始版本的键盘记录器只能存储来自键盘的击键。最新版本甚至可以获取虚拟键盘的击键。黑客利用键盘记录器发送的信息来获取用户信息，如信用卡详情、电子邮箱\
  \ ID 和密码。键盘记录器无法区分密码和普通文本，因此；它们存储一切并将其发送给黑客。黑客随后将尝试从获得的信息中提取密码。\n\n### 勒索软件 (Ransomware)\n\
  勒索软件可以被视为系统内部的感染。它们从内部锁定计算机，通常显示诸如“您的系统已被锁定；请按照给出的指令进行解锁”的消息。这些指令通常向受害者索要。攻击者只有在收到钱后才会解锁受害者的计算机。在大多数情况下，如果处于锁定状态，计算机将变得毫无用。\n\
  \n将在后面的章节中简要讨论上述恶意软件。\n\n## 恶意软件的脆弱性\n\n每当我们使用“系统”一词时，它意味着它可以可以是单个应用程序、单台计算机、通过网络连接的一大组计算机、操作系统或网络本身。因此，当我们说系统受到攻击时，意味着上述提到的实体中的任何一个遭受了攻击。恶意软件利用这些漏洞进入系统。下面列出了其中一些脆弱性：\n\
  \n### 软件中的安全问题\n软件中的安全缺陷是恶意软件利用的一种主要漏洞。大小的软件都包含在内，这意味着从简单程序到复杂的操作系统，所有软件都在其中。软件分发公司在修复发现的安全漏洞后会不断更新其软件。它们通过发布补丁来实现这一点。\n\
  \n一些常见的软件漏洞存在于浏览器插件中。不建议使用过时的插件。你不能仅仅通过更新就认为你的软件是安全的，即使在更新之后可能仍然存在一些安全漏洞。在更新到新版本后仍保留旧版本的插件是不安全的。\n\
  \n\n\n\n\n### 用户错误或不安全的设计\n另一种常用的传播恶意软件的方法是引导用户下载并安装受感染的文件。此类尝试可能包括带有恶意软件的硬件，如闪存驱动或\
  \ USB 设备。当这些硬件连接到计算机上时，受感染的文件就会自动执行，从而感染用户的系统。如果该受感染的系统位于网络环境中，恶意软件可能会跨网络传播并感染连接到该网络的其他系统。这对于传播恶意软件非常有效。\n\
  \n### 过时的杀毒软件\n过时或免费的杀毒软件无法提供付费版本所提供的相同安全级别。更新后的杀毒软件其数据库中将包含所有最新病毒的列表。旧版本的杀毒软件可以在一定程度上保护你，但不能完全保护。如果你的计算机遇到最新的病毒，它可能会将该病毒视为非恶意软件。\n\
  \n### 高权限代码和高权限用户\n在计算机科学领域，权限可以定义为修改系统时赋予的访问。权限被授予用户和程序。某些程序和用户获得的权限超过了他们应该拥有的权限。这种情况发生在设计不当的软件中。这是一个漏洞，恶意软件可以利用这一点。赋予更多权限可能导致两种问题，它们是：\n\
  \n#### 高权限用户\n某些系统为用户提供的权限比他们应该拥有的多。这些用户可以修改或更改程序的代码。此类用户被称为高权限用户。\n\n#### 高权限代码\n\
  某些系统为由用户执行的代码提供更多权限。搜索代码被称为高权限代码，它们拥有访问系统资源的权限。某些操作系统和脚本语言为代码提供了比需求更多的权限，使其成为一个漏洞。当这类代码被执行时，系统会将所有权限授予该代码，误认为是用户运行了它。\n\
  \n### 同质性\n如果一组系统运行在相同的操作系统并连接到同一个网络，我们可以称这些系统为同质系统。当存在同质性时，获取的恶意软件很容易传播到该网络中的所有系统。例如，如果单个系统上存在木马，它可以轻易地扩散到整个网络并感染该网络上的其他系统。同质性存在于软件公司、学校和学院等机构的系统中。大多数系统要么运行在\
  \ Windows 操作系统上，要么运行在 Mac 操作系统上。通过专注于这些操作系统中的一种，黑客可以轻松利用运行在其上面的系统。解决此问题的办法是在计算机上使用不同的操作系统。通过这样做，黑客传播其恶意软件将变得非常困难。但这种做法也有自己的缺点。在初始阶段，维护和培训费用就属于缺点之一。\n\
  \n## 掩盖踪迹\n如果你计划成为一名优秀的伦理黑客，你不应该留下入侵的痕迹。留下证据只会增加你被发现的风险。你实际上可以使用恶意软件来清除你的入侵记录。使用恶意软件可以清除事件日志，提供干净的退出方式。有许多不同类型的恶意软件可用，利用它们你可以隐藏网络流量并清理目录。\n\
  \n### 代理服务器\n在穿过网络敏感区域时借助代理服务器是一个非常好的主意。如果你使用代理服务器，入侵检测软件无法检测到你的存在。这是因为代理服务器不会留下痕迹。\n\
  \n在大多数情况下，木马通常是最佳选择，原因是它们能够长时间进行隐蔽监控。\n\n### 犯罪软件\n犯罪软件可以定义为黑客用于黑客的软件或硬件工具。犯罪软件可以定义为具有以下特征的内容：\n\
  \n* 不是无意导致犯罪。\n* 主要用于在线犯罪活动。\n* 通常不是一种理想的软件或硬件。\n\n在所有犯罪软件中，机器人（Bots）是使用最广泛的。下面简要描述了机器人。\n\
  \n### 机器人\n#### 到底什么是机器人（Bot）？\n“bot”一词是“robot”的缩写。这些机器人与电影中的机器人不同。它们不是公司从生产线上制造的机器人。机器人是人们面临的犯罪软件中最复杂的类型。它们在许多方面与蠕虫和木马相似。与其他恶意软件相比，机器人是独特的，它们的独特性在于它们能够执行极其广泛的自动化任务。它们代表攻击者执行这些自动化任务。攻击者将机器人放在互联网上某个安全的地方。机器人能够通过发送垃圾信息执行拒绝服务攻击。当计算机被机器人感染时，它就完全处于放置机器人的人的控制之下。这些被感染的机器被称为僵尸（zombies）。\n\
  \n机器人可以通过多种方式感染计算机。在互联网上，它们通常搜索未受保护的计算机进行攻击。在找到具有漏洞的计算机后，它们会迅速溜入并向放置它们的人汇报。它们通常保持隐藏状态，什么都不做，直到主命令它们做某些事情。就像木马一样，它们在隐蔽中工作。大多数人在收到服务提供商关于其计算机向其他用户发送垃圾信息的通知之前，并没有意识到自己已成为机器人的受害者。它们有时甚至清理其停留的整个计算机，以确保自己不会被其他机器人取代并挤出计算机。它们与木马协同工作，木马帮助它们传播到互联网上的其他计算机。木马通过从受感染系统发送电子邮件来传播它们。\n\
  \n机器人始终设计为与其他僵尸机器协同工作，它们不能独立工作。它们被设计为分组工作，这个小组被称为机器人网络（botnets）。通过使用上述任何一种技术，攻击者创建了机器人网络。他们通过反复用机器人感染计算机来实现这一点。\n\
  \n# 第 8 章 快速扫描服务器和网络\n\n黑客工具是设计用于特定目的的软件程序，允许黑客未经授权地进入网络或系统。有很多黑客软件包你可以利用它们让工作变得简单，然后转向更棘手的技术。但如果你非常绝望并想要破解密码，最好是考虑使用黑客软件。\n\
  \n不同类型的黑客工具如下：\n\n* 漏洞扫描器\n* 端口扫描器\n* Web 应用扫描器\n* 密码破解工具\n* 数据包嗅探器\n\n## 漏洞扫描器\n\
  \n\n\n\n漏洞被定义为一种无意的软件缺陷，黑客可以利用其作为突破口，发送如特洛马、病毒、蠕虫等恶意软件。\n\n漏洞扫描器是一种非常高效的工具，用于检查网络或计算机系统中的弱点。它本质上是一个计算机程序。扫描器的唯一目的是访问网络、应用程序和计算机系统以寻找漏洞。黑帽黑客和计算机安全管理员（通常是白帽黑客或蓝帽黑客）都会使用这种工具。黑帽黑客利用它发现漏洞并从这些点获取未经授权的访问。白帽黑客也会检查漏洞，但他们这样做是为了保护计算机系统，而不是为了进入。\n\
  \n数据通过端口传输。漏洞扫描器用于检查已开放或具有计算机系统访问权限的端口。这用于快速检查网络中具有已知漏洞的计算机。通过限制端口，防火墙可以防御计算机，尽管它仍然存在漏洞。\n\
  \n## 漏洞扫描器的优势\n\n- 早期发现问题\n- 能够轻松识别安全漏洞\n- 由于它可以显示漏洞，因此可以对其进行处理\n\n## 漏洞扫描器的类型\n\
  \n## 端口扫描器\n\n端口扫描器专门设计用于搜索主机或服务器上开放端口的计算机应用程序。打算使用此工具的人应该具有 `TCP/IP` 的基础知识。攻击者利用它来识别运行在服务器或主机上的服务，意图是破坏它。而管理员则利用它来验证其网络的安全策略。端口扫描是一个向选定范围的端口发送请求的过程，目标是寻找活跃的端口。这只能发现漏洞，不能用于攻击或防御。这种扫描的大部分用途是探测而非攻击。可以使用端口扫描器扫描多个主机，以寻找特定的监听端口。这一过程被称为端口遍历（port\
  \ sweep）。这些被专门用于特定类型的服务。其中一种是基于 SQL 的计算机蠕虫。它可能被用于扫描在 `TCP` 上监听的端口。\n\n端口扫描的类型：\n\
  \n#### TCP 扫描\n\n当无法进行 `SYN` 扫描时，这些简单的端口扫描器会使用操作系统的网络功能。这是在我们通过 `Nmap`（在后面的章节中讨论）进行扫描时的情况。计算机操作系统将完成三次\
  \ `TCP` 握手，然后立即关闭连接以避免 `DoS` 攻击。否则，将返回错误代码。这种扫描模式的优势是用户不需要任何特殊权限。然而，这种类型的扫描并不常见，因为操作系统的网络功能阻止了低级控制。此外，在使用端口扫描时，这种扫描被认为是“有噪音的”。因此，这种扫描不是首选方法，因为入侵检测系统可以记录发送者的\
  \ IP 地址。\n\n#### SYN 扫描\n\n这也是 `TCP` 扫描的一种类型。在这里，端口扫描器将自行生成原始 `IP` 包并监控响应，而不是使用操作系统的网络功能。`SYN`\
  \ 扫描被称为“半开放扫描”。之所以这样命名是因为永远不会建立完整的 `TCP` 连接。`SYN` 包由端口扫描器生成。当发现开放端口时，扫描器将发送 `SYN-ACK`\
  \ 包。主机将在通过响应 `RST` 包完成握手之前关闭连接。\n\n当我们使用原始网络时，有几个优势。它们是：\n\n1. 扫描器对发送的数据包拥有完全控制权。\n\
  2. 连接不会被单个服务接收。\n3. 扫描器对响应时间拥有完全控制权。这种扫描优于 `TCP` 扫描。\n\n#### UDP 扫描\n\n`UDP` 扫描是一种无连接协议。虽然这种扫描是可能的，但存在技术挑战。关闭端口将收到一个\
  \ `UDP` 备份，端口将响应一个称端口不可达的 `ICMP` 响应。扫描器寻找 `ICMP` 响应。如果主机没有响应，则端口是开放的。然而，如果主机受到防火墙保护，扫描器将收到一个表示存在开放端口的响应，这是错误的。`ICMP`\
  \ 速率限制也会影响这种方法。如果消息被拦截，所有端口看起来都是开放的。对于这一点，我们可以发送某些特定特定的 `UDP` 包作为替代，并希望生成应用程序层响应。\n\
  \n#### 窗口扫描\n\n这种方法已经过时，很少使用。但窗口扫描是相当可靠的，可以判断端口是关闭还是开放、经过过滤还是未经过过滤的。如果主机系统上有防火墙，可以使用这种方法。\n\
  \n#### 网络漏洞扫描器\n\n这种类型的扫描器识别连接到网络的计算机系统的安全漏洞，以确定该特定系统是否可以被利用或威胁。它是一个拥有已知缺陷数据库的软件。它通过测试系统以使这些缺陷发生，从而扫描计算机系统中的这些已知缺陷。然后它将对该特定计算机系统或给定企业生成所有这些发现的报告。\n\
  \n#### Web 应用程序扫描器\n\n有很多方法可以检查架构缺陷和安全回退。其中一种方法是 Web 应用程序安全扫描器，它充当用户和应用程序之间的通信器并识别这些问题。扫描器可以执行许多测试来发现\
  \ Web 应用程序中的这些漏洞。\n\n最常用的测试是黑盒测试。这意味着用户将不知道结果背后的逻辑，但将获得有关结果的清晰信息，从而提供所需的完整信息。大多数扫描器通过投掷现实场景中可能发生的随机测试用例并给出结果来进行分析。这些\
  \ Web 应用程序深受用户欢迎，因为它们作为与系统通信的简单平台，因此用户界面在应用的中起着重要作用。\n\n用户可以使用这些应用程序执行多种操作；包括创建账户、根据标准查询数据库、添加大量内容以及进行不同类型的交易。当存储大量信息时，用户往往也会在应用程序中存储他们的一些个人信息。\n\
  \n这看起来是一个简单、方便的选择，但数据安全受到破坏这一点是大多数用户往往忽略的。而这正是内部泄露和黑客获利的点。所以，用户不仅需要考虑便利，还需要检查他们在这些\
  \ Web 应用程序上共享信息的范围。\n\nWeb 应用程序扫描器有许多优点，以下是几个：\n\n- 它们对于最后的快速检查缺陷非常有用。\n- 它们可以检查相同场景给定不同输入时可能获得的大量结果，然后可以识别异常。\n\
  \n用于 Web 应用程序测试的工具（如扫描器）独立于所使用的编程语言。因此，无论 Web 应用程序使用什么语言编码，工具都可以以自己的方式工作，动态地更改不同语言的输入。这赋予了用户完全自由地测试他们所有的应用程序。\n\
  \n有优点的地方就有缺点。以下是几个缺点：\n\n\n\n\n\n-   这些工具的主要缺点之一是黑客也使用相同的工具。因此，如果用户能够发现系统漏洞，黑客也能轻易地发现它们。这对社区构成了重大威胁。\n\
  -   设计 Web 应用的语言正在进行许多更新，而大多数用户使用的是免费的工具。这些免费工具通常只构建到基础水平，因此无法获得新的修改和更新。因此，向系统投递以寻找异常的随机输入将缺乏更新后的输入。这意味着由于这些缺失的输入可能会导致许多潜在威胁。\n\
  -   前几个工具结果为零的概率很高；这会导致用户产生高度焦虑，并最终导致他们使用新工具。这将导致新工具的产生和旧工具的灭绝。\n-   过度使用工具也可能是一个问题，因为它可以帮助攻击者在理论上检查他们的测试用例。这让他们能够发送机器人网络。这些会在\
  \ Web 应用中产生垃圾信息，可能导致信息泄露。\n-   攻击者使用的恶意软件可以通过这些机器人网络进行更新。这种更新后的恶意软件可能很难删除。\n-  \
  \ 如前所述，用于 Web 应用设计的软件在不断更新，而所使用的工具根据 Web 应用所使用的语言进行动态编程。没有人能 100% 保证获得的结果属于整个源代码。为了获得\
  \ Web 应用的完整覆盖，有被称为渗透测试员的测试人员会仔细并严密地分析结果，以验证 Web 应用的源代码已完全覆盖。\n-   用户必须意识到，这些工具无法检测源代码中的逻辑缺陷，例如信息泄露和数据加密级别低。\n\
  -   这些工具在检测任何技术缺陷方面也存在困难。这并不意味着它们没有能力，而是 Web 应用必须提供正确的线索，以便这些工具识别出技术缺陷。\n\n# 第 9\
  \ 章 Web 安全\n\n随着更多使用 Web 应用的设备（如手机、平板电脑和电脑）进入市场，攻击 Web 应用已变得日益流行，因为出现了越来越多的 Web\
  \ 应用，每个应用都有自己的漏洞、利用程序和风险。随着黑客发现 Web 应用中的新利用，攻击 Web 应用每天都变得更容易。以下是一些 Web 应用攻击的形式。\n\
  \n## Web 安全基础\n\n会话劫持（Session Hijacking）是一种网络攻击，攻击者利用 Web 服务器的会话令牌。黑客通过利用控制会话令牌的控制机制来实现。\n\
  \nWeb 服务器必须与多个不同的 `TCP` 连接通信。服务器需要跟踪这些连接，因此在计算机或设备通过身份验证后会发布一个会话令牌。该令牌可以用于 `cookies`、`http`\
  \ 请求的标头或请求头的主文。\n\n会话劫持攻击通过预测令牌或窃取令牌对会话令牌进行攻击。一旦黑客攻破了会话令牌，就可以利用以下内容：\n\n-   一种攻击预测\
  \ `ID` 值，允许黑客在无需身份验证的情况下进入系统。\n-   会话嗅探攻击（session sniffing attack）发生在用户向 Web 服务器发送带有\
  \ `session ID` 的请求时，黑客拦截了 `session ID` 并使用它在 Web 服务器上创建他们自己的请求，从而有效地将攻击者伪装成用户。\n\
  -   客户端攻击是一种利用软件客户端漏洞的攻击，例如 Web 浏览器、`pdf` 阅读器/写入器、即时通讯软件和其他具有漏洞的软件。IBM 知识中心（`www.ibm.com/support/knowledgecenter/en`）列出了两种类型的客户端攻击：内容欺骗（content\
  \ spoofing）和跨站脚本（`XSS`）。内容欺骗是指用户认为网站上的内容是有效且合法的，并非来自外部来源。`XXS` 是攻击者在浏览器中执行脚本。\n\
  -   中间人攻击（`MITM`）发生在黑客拦截 `http` 事务时。攻击者接管 `TCP` 连接并将其分成两部分，允许攻击者读取、作为代理运行或修改消息中的数据。用于\
  \ MITM 攻击的流行工具是 `Ettercap`。\n-   浏览器中间人攻击（Man-in-the-browser attacks）与 MITM 攻击类似，不同之处它们使用木马来攻击交易和余额等银行信息。\n\
  \n### SQL 注入\n\nSQL 注入是攻击者在应用程序的输入表单中添加 `SQL` 查询。`SQL` 语句被执行后，允许攻击者从数据库中读取敏感数据，获得管理员权限以关闭、修改数据库、恢复数据库文件中文件内容，并向\
  \ `OS` 发出命令。`SQL` 注入经常用于财务数据，例如更改余额或作废交易。它还允许攻击者伪造身份、披露数据库中的所有数据、破坏数据或获取数据库的管理员权限。\n\
  \n### 跨站脚本 (XXS)\n\n有三种类型的 `XXS` 攻击：存储型或非持久型 `XXS`、反射型或持久型 `XXS` 以及基于 `DOM` 的 `XXS`。\n\
  \n-   存储型 `XXS` 攻击发生在用户的输入被保存在 Web 服务器上。这种攻击通常发生在数据库、论坛或网站的评论区。\n-   反射型 `XXS` 发生在\
  \ Web 服务器将带有错误消息或搜索结果的消息返回给客户端时。\n-   基于 `DOM` 的 `XXS` 发生在数据在 `DOM` 中且数据未离开浏览器时。`DOM`\
  \ 代表文档对象模型（Document Object Model），是文档的 `HTML` 和 `XML` 接口。\n\n### 无线网络\n\n无线网络是指在特定范围内通过无线电波通信的一组设备。无线网络允许多个设备通过调制解调器和无线路由器连接到互联网。路由器控制无线网络的设置，包括\
  \ `IP` 地址、MAC 地址、无线网络认证和其他设置。无线路由器使用 `IEEE 802.11`，这是一组 `MAC` 地址和物理层设置。对无线网络的攻击通常是嗅探攻击，试图获取\
  \ `SSID` 并获得无线网络的访问权限。\n\n### 无线 DoS 攻击\n\n无线网络容易受到两种攻击的影响。第一种是物理攻击，发生在由于无线电话产生无线电干扰时。第二种攻击是网络\
  \ `DoS` 攻击。网络 `DoS` 攻击很容易完成。与和其他 `DoS` 攻击一样，它通过发送多个请求（在本例中发送到接入点）运行。由于请求占用了资源并阻塞了队列，合法设备无法通过其请求连接网络。\n\
  \n### 移动平台\n\n移动平台的大多数攻击以不同平台恶意软件的形式出现。主要的移动平台有 `Android` 和 `iOS`。`Android` 是一个移动平台，由于\
  \ `Android` 设备拥有巨大的市场份额，因此有大量的设备。并非所有的恶意软件都是通过应用商店安装的，某些恶意软件通过 `QR`（快速响应）码进行攻击。破解移动设备可以提供有关用户的丰富信息。黑客可以访问联系人、`GPS`\
  \ 数据、麦克风、摄像头、电子邮件、`MMS` 消息和 `SMS` 消息。\n\n### Android\n\n\n\n\n\n### Android\nAndroid\
  \ 由 Google 开发，作为一个开源移动平台提供。大多数为移动设备编写的恶意软件针对 Android 的，因为有更多的途径可以攻击它。Android 操作系统允许用户从第三方应用商店以及官方的\
  \ Google Play 商店添加软件。恶意应用可能来自这两个任一来源，因为 Google 对其应用的审核过程并不像其他那样严格。Android 手机上的软件容易受到逆向工程攻击，这增加了该平台固有的危险。此外，许多\
  \ Android 手机未经过加密，使得恶意软件攻击更容易实施。广告软件是 Android 设备上流行的恶意软件。\n\n[AndroidVulnerabilities.org](http://AndroidVulnerabilities.org)\
  \ 列出了若干种属于内核、网络、签名和系统漏洞的利用程序。\n\n### Apple\nApple 开发了三个移动平台 `iOS`、`tvOS` 和 `watchOS`。它们是\
  \ iPhone、iPad、Apple TV 和 Apple Watch 的操作系统。由于安全级别较高，且 App Store 受到严格监控，恶意应用很难在 App\
  \ Store 上停留，因此 Apple 产品上的恶意软件攻击较少。Apple 移动操作系统不支持静短信，这使得恶意软件的传播变得更加困难。\n\n# Web\
  \ 服务器\nWeb 服务器是存储网络服务信息的计算机、硬件和软件，并通过局域网（LAN）或互联网提供这些信息。Web 服务器存储大量敏感数据，如社会安全号、信用卡号、电子邮件地址和密码。Web\
  \ 服务器遭受的著名攻击案例是 2017 年的 Equifax 黑客事件。该事件暴露了数百万人的个人数据，包括受害者的信用信息。攻击 Web 服务器是一种复杂的攻击。\n\
  \nWeb 服务器有多种漏洞。这些漏洞包括使用默认设置、Web 服务器配置错误、利用漏洞或仅仅缺乏安全防护。Web 服务器的类型有：\n\n*   `Apache`：`Apache`\
  \ 服务器是最常用的。`Apache` 通常运行在 Linux 上。\n*   `Internet Information Services (IIS)`：`IIS`\
  \ 是适用于 Windows 的 Web 服务器。它是仅于 `Apache` 的第二常用服务器。\n*   `Other`：市场上还有其他 Web 服务器，包括\
  \ Novell 的 Web 服务器和 Mac OS X 服务器。\n\n## 攻击类型\n黑客可以使用几种类型的攻击来破解 Web 服务器。这些攻击类型包括目录遍历攻击、DoS\
  \ 和 dS 攻击、域名系统攻击、嗅探、钓鱼、钓鱼网站攻击（Pharming）和网页篡改（Defacement）。域名系统攻击是指攻击者更改域名系统（`DNS`）设置，使得\
  \ Web 服务器的互联网流量被发送到黑客的 Web 服务器。钓鱼网站攻击是指攻击者更改用户计算机上的 `DNS` 设置。网页篡改攻击是指攻击者将网站网页替换为另一个，其中包括黑客的名字和黑客选择发布的任何媒体内容。网页篡改通常是为了建立黑客的声誉。\n\
  \n# 保持系统安全的工具\n当你刚开始时，如果得到一些帮助会容易得多，以下是你可以使用的一些最佳软件和硬件元素：\n\n### Metploit\n`Metploit`\
  \ 是你可以使用的最好的软件和硬件元素之一。它是开源且免费的。`Metploit` 允许你发现漏洞。`Metploit` 是一个渗透测试框架，被许多专业人士使用。`Metploit`\
  \ 允许你模拟攻击并发现漏洞。`Metploit` 适用于所有平台，包括 Linux、Windows 和 macOS。 \n\n### Acunetix\n`Acunetix`\
  \ 是一个漏洞扫描器，是最好的工具之一`Acunetix` 用于发现 Web 应用程序中的漏洞。`Acunetix` 是一个快速工具，用于发现 SQL 注入和其他漏洞。`Acunetix`\
  \ 适用于所有平台，包括 Linux、Windows 和 macOS。\n\n### Nmap\n`Nmap` 是 `Network Mapper` 的缩写。它是一个端口扫描器，是最流行的工具之一。`Nmap`\
  \ 用于网络发现和安全审计。`Nmap` 允许你发现服务。`Nmap` 适用于所有平台，包括 Linux、Windows 和 macOS。\n\n### Wireshark\n\
  `Wireshark` 是史以来最著名的数据包工具之一。它是开源且免费的。`Wireshark` 用于捕获和分析流量。`Wireshark` 让你读取来自以下协议的实时数据：\n\
  *   802.11\n*   ATM\n*   Bluetooth\n*   Ethernet\n*   FDDI\n*   Frame Relay\n* \
  \  IEEE\n*   PPP/HDLC\n*   Token Ring\n*   USB\n\n### oclHashcat\n如果你对密码破解感兴趣，`Hashcat`\
  \ 就是你需要的免费工具。它是基于 CPU 的，而 `oclHashcat` 是该工具更高级的版本，利用了你的 GPU 性能。`oclHashcat` 因世界上最快的密码破解工具之一而闻名，它是世界上第一个拥有基于\
  \ GPGPU 引擎的工具。\n\n### Nessus\n`Nessus` 是最好的漏洞扫描器之一，它采用客户端-服务器框架工作。它由 Tenable Network\
  \ Security 开发，是同类中最流行的工具。`Nessus` 用于发现漏洞。\n\n\n\n\n\n# Maltego\n\nMaltego 是另一个免费开源的平台，允许进行深度挖掘和信息收集，并提供你系统上威胁的概览。Maltego\
  \ 是展示你的系统及其环境中故障点严重性和复杂性的最佳工具之一。它被用于分析公司、人员、域名、网站、DNS 名称、文档、IP 地址等之间现实世界中的链接。Maltego\
  \ 基于 `Java` 构建，具有用户友好的 GUI，并提供了大量的自定义选项。\n\n支持的平台包括 `Linux`、`Mac OS X` 和 `Windows`。\n\
  \n# 社会工程工具包 (Social-Engineer Toolkit)\n\n如果你看过《机器人总动员你会你会这个由 `TrustedSec` 开发的工具。它是一个非常先进的工具，用于模拟多种社会工程攻击类型，例如钓鱼攻击、凭据收集等。该工具可以自动化每种攻击，并生成恶意网站、伪造电子邮件等方面内容。它基于\
  \ `Python` 构建，是社会工程攻击渗透测试的行业标准工具。\n\n# Netsparker\n\nNetsparker 是最流行的 Web 扫描器之一，用于寻找本地文件包含和\
  \ `SQL injection` 等漏洞。它将提供你可以以安全且只读的方式采取补救措施。你不需要自己验证漏洞，因为 Netsparker 会为你提供利用证明。如果它无法自动验证某个漏洞，你将收到警告消息。\n\
  \nNetsparker 非常易于使用；你只需要输入想要扫描的 Web 应用程序的 `URL`，它就会为你完成。Netsparker 支持 `AJAX` 和基于\
  \ `Java` 的应用程序，因此扫描时不需要任何复杂的配置。你可以获取免费的演示版本，也可以购买完整版。\n\nNetsparker 仅支持 `Windows`\
  \ 系统。\n\n# w3af\n\n`w3af` 是开源免费的，另一个 Web 应用程序扫描器。它被渗透测试人员和黑客使用，其名称代表 Web 应用程序攻击与审计框架（Web\
  \ Application Attack and Audit Framework）。`W3af` 允许你获取用于渗透测试的安全漏洞信息。它声称能够识别超过 200\
  \ 种不同的漏洞，包括 `SQL injection`、跨站脚本、PHP 配置错误、未处理的应用错误和易破解的凭据。它还声称可以让任何 Web 应用程序变得更安全。`W3af`\
  \ 提供 GUI 和命令行界面，且用户友好。\n\n支持的平台包括 `Mac OS X`、`BSD`、`Linux`，旧版本的工具支持 `Windows`。\n\
  \n# 其他顶级攻击与安全工具\n\n## Web 漏洞扫描器\n* `AppScan`\n* `Burp Suite`\n* `Firebug`\n* `Grendel-Scan`\n\
  * `Nikto`\n* `OWASP Zed`\n* `Paros Proxy`\n\n## 漏洞利用工具\n* `BeEF`\n* `Core Impact`\n\
  * `Netsparker`\n* `Sqlmap`\n* `WebGoat`\n\n## 取证分析工具\n* `Autopsy`\n* `EnCase`\n\
  * `Helix3 Pro`\n\n## 端口扫描器\n* `Angry IP Scanner`\n* `NetScanTools`\n* `Unicornscan`\n\
  \n## 流量监控工具\n* `Argus`\n* `Nagios`\n* `Ngrep`\n* `NtopSplunk`\n\n## 调试器\n* `GDB`\n\
  * `IDA Pro`\n* `Immunity Debugger`\n* `WinDbg`\n\n## Rootkit 检测器\n* `DumpSec`\n\
  * `HijackThis`\n* `Tripwire`\n\n## 加密工具\n* `KeePass`\n* `OpenSSH/PuTTY/SSH`\n* `OpenSSL`\n\
  * `Tor`\n\n## 密码破解器\n* `Aircrack`\n* `Hydra`\n* `John the Ripper`\n\n# 防止自己被黑客的最佳实践\n\
  \n黑客不是什么友好的人，至少其中一些不是。无论他们是单独行动、作为某个阴暗集团的一部分，还是为具有政治目的的人工作，他们都有权力和知识来访问你的系统和信息。黑客可以很容易在互联网上找到关于该公司的大量信息，然后利用学到的信息寻找弱点并进行利用。这使你托付给公司的任何数据处于非常真实的危险之中。\n\
  \n将你在家里使用的计算机系统和互联网网络看作一家公司。它受保护吗？你可以做些什么来确保黑客无法进入？不要只坐在那里等攻击发生后再采取行动，现在就行动吧；反击黑客！\n\
  \n以下是你保护系统免受黑客侵害的 10 种方法：\n\n### 更新、更新、更新\n尽可能经常更新你的操作系统以及所有的应用程序和软件。每当发布更新时，请立即应用。这可以防止黑客通过未更新程序中的漏洞和缺陷进入你的电脑。如果你使用\
  \ `Windows`，请确保开启了自动更新。\n\n### 使用最新的安全程序\n我说的是防病毒软件、反恶意软件工具、反间谍软件，当然还有你的 `firewall`。如果你使用\
  \ `Flash` 或 `Java` 等软件，请寻找替代方案，因为它们非常容易受到。\n\n### 销毁个人信息\n这更多适用于出售或丢弃电脑或硬件。确保你的硬盘已被完全擦。如果你的信息非常关键且你正在丢弃设备，考虑使用电锯销毁硬盘。\n\
  \n### 永远不要使用开放 Wi-Fi\n使用开放 `Wi-Fi` 会让黑客更容易获取你的网络连接并从你的电脑下载数据。使用加密密码来保护你的 `Wi-Fi`，并考虑每几年更换一次路由器。某些路由器会产生可能永远无法的漏洞，而新的路由器提供了访客访问功能。\n\
  \n### 为所有设备设置密码\n这包括你的台式电脑、笔记本电脑、手机、平板电脑、智能手表等所有可以设置密码的设备。由于如今移动设备普及，它们比以往任何时候都脆弱。确保你的手机已锁定，且屏幕自动关闭时间尽可能短。如果可用，使用指纹锁或任何形式的生物识别安全。\n\
  \n### 确保你的密码难以猜到\n你所有的密码都应该是难以破解的，并定期更换。如果你真的觉得很难记住这么多密码，考虑使用密码管理器。如果可用，在可能的地方应用双重验证。\n\
  \n### 让你的安全问题答案更具创意\n\n\n\n\n\n大多数人选择用母亲的娘姓或宠物的名字作为安全问题的答案，但这些在现在非常容易被猜，而且在很多情况下，通过在\
  \ Google 上进行简单的搜索就能找到答案。考虑用一种荒唐的方式回答问题。例如，如果你的安全问题之一是“你的第一辆车是什么颜色的？”，用一个完全无关的内容回答，比如“千层饼”。你明白意思了。只要以后需要提供答案，不要忘记你的答案是什么即可！\n\
  \n## 发邮件和上网时要明智\n\n钓鱼仍然是一个大问题，但他们现在比以前聪明得多。当你收到电子邮件时，将鼠标悬停在任何链接上——这会显示发送邮件的邮箱地址。如果你不确定某封邮件，请仔细观察句子的构造和格式。如果某些地方仍然不对，可以在互联网上搜索邮件的主题。如果是已知的诈骗，很可能会有很多关于它的信息。\n\
  \n## 永远不要关联账户\n\n如果你在一个要求你先加入才能进行任何操作的网站上，千万不要选择使用社交网络账户注册。许多网站提供使用 Facebook、Google+\
  \ 或 Twitter 登录的选项，但这是一条危险的道路。这看起来很方便，但它开启了大量的个人信息，而且你并不能总是确定自己正在一个真实的网站上登录。\n\n\
  ## 不要将敏感数据保存到你的云账户\n\n无论你如何看待，存储在云中的任何数据都不属于存储它那里的人，而且许多云存储解决方案只对“静态”存储数据提供加密，而不对传输中的数据提供加密。只把云用于那些不重要的事情。\n\
  \n## 重要提示\n\n毫无疑问，你至少收到过一条弹出窗口消息，告诉你的电脑不安全，并且有很多关键错误；希望你没有点击过其中任何一个。任何合格的操作系统绝不会这样做来告知你错误。这些都是来自诈骗者的信息，点击它们会让你的电脑面临攻击风险。\n\
  \n# 第 10 章。防火墙基础\n\n在今天，没有防火墙的网络设计是不完整的。这是一种既可以是基于软件也可以是基于硬件的网络设备。防火墙可以控制对网络的访问。控制访问的目的是确保资源和数据免受外部入侵者的侵害。为了控制访问，防火墙将安装在网络的出入口/入口处。例如，防火墙可以放置在互联网和内部网络之间。部署后，它可以控制该点进入网络的流量。\n\
  \n尽管它们被用于保护内部网络免受公共网络的侵害，但它们也可以控制特定网络内部分段之间的访问。例如，防火墙可以放置在销售部和财务部之间。正如我之前提到的，防火墙可以以软件或硬件设备的形式出现。某些组织通过其网络的操作系统（如\
  \ `Windows servers`、`Linux/Unix` 和 `Mac OS servers`）来实现这种设备。\n\n在这种情况下，防火墙将在网络服务器上进行去配置，以授予某些类型网络流量的权限。当在家庭或小型办公室中使用时，它可以安装在家庭或办公室的本地系统中，并在那里进行配置以控制流量。你也可以找到一些第三方防火墙。今天，你可以找到部署在不同网络中的硬件防火墙。这些防火墙通常是专用网络设备，只需要少量配置即可实施。防火墙后的所有系统都将自动受到外部源的保护。\n\
  \n你可以在需要时获取这些防火墙，因为它们随处可用，并且可以与其他设备结合使用。例如，许多无线接入点和宽带路由器都内置了防火墙功能。在这种情况下，`WAP` 或路由器可能会有一些供系统接入的端口。\n\
  \n## CSU/DSUs\n\n被称为信道业务单元/数据业务单元（Channel Service Unit/Data Service Unit），这种设备在\
  \ WAN 数据格式和 LAN 数据格式之间充当翻译官的角色。这种翻译是绝对必要的，因为 WAN 和 LAN 使用不同的技术。\n\n有些人认为 `CSU/DSU`\
  \ 是一个数字调制解调器。然而，与可以轻松将信号从数字转换为模拟的调制解调器不同，这种设备是将信号从一种数字格式转换为另一种数字格式。\n\n`CSU/DSU`\
  \ 设计有一个可用于 LAN 设备的物理连接。可以通过不同的 WAN 连接或串行接口实现。`CSU/DSU` 不是普通的网络设备，因为它始终与其他设备保持分离。然而，随着更多\
  \ WAN 链路的使用，路由器制造商认为有必要在他们的路由器中包含 `CSU/DSU` 功能。当路由器中不包含该功能时，制造商会提供 WAN 扩展能力以容纳 `CSU/DSU`。\n\
  \n如果你是组织中工作的计算机专家，你可能会遇到多个计算机系统的操作系统处于同一个网络的情况。在这些情况下，你必须安装提供安全防火墙的软件。`Windows`\
  \ 操作系统有一个内置防火墙，你可以直接激活并使用。此防火墙功能出现在不同版本的 `Windows` 中，包括 `Windows XP`、`Windows Professional`、`Windows\
  \ 10` 以及其他版本。\n\n安装防火墙或创建一组强密码并具有详细的访问控制设置不足以保持保护。除了上述提到的所有标准和漏洞外，你必须理解，保护无线网络最大且最令人厌的障碍是网络内部的复杂性。然而，没有任何无线网络是完全安全的。有些事情并不复杂，但可能仍被认为是障碍。例如，一个普通的\
  \ `AP` 和一个无线 `NIC`（网卡）可能实际上并不复杂，尽管你可以推断出后台有更多的事情在发生\n\n802.11 协议并不是为了完美而开发的，因为它们存在很多问题。这些协议并不能像旧的以太网那样以最优管理开销帮助发送。相反，802.11\
  \ 协议非常复杂。大多数无线网络仅仅传输和接收携带网络数据包的 `RF`（射频）信号。802.11 网络实际上会执行更复杂的功能，例如：\n\n- 加密数据以提高数据隐私。\n\
  - 验证客户端以确保只有授权的人员可以访问网络。\n- 设置定时数据包以确保客户端同步并帮助避免数据传输冲突。\n- 检查数据完整性以确保所有信息不受污染。\n\
  \n尽管 802.11 协议非常复杂，它们的网络设计还与更多复杂性相关，例如：\n\n- 更新你的无线设备，这些可能包括笔记本电脑、`APs` 和 `PDAs`（个人数字助理）。\n\
  - 采用什么种天线以及放置在哪里。\n- 确切知道哪些类型的设备允许进入网络哪些不允许。\n- 调整信号功率设置，防止你的射频信号泄漏到住宅之外。\n\n所有这些无线网络复杂性累积导致了许多传统有线网络中不存在的安全性漏洞。\n\
  \n\n\n\n目前，加密系统分为两类：(1)对称密钥加密和(2)非对称密钥加密。这种加密系统的分类方法是基于整个系统使用的加密/解密方法。\n\n对称加密与非对称加密的主要区别在于加密密钥和解密密钥之间的关系。通常来说，所有的加密系统都涉及密切相关的密钥。不可能创建一个与代码加密密钥完全无关的解密密钥。让我们详细讨论每种加密系统：\n\
  \n### 对称密钥加密\n\n属于此类别的加密系统只有一个密钥。该密钥用于对发送的信息进行加密和解密。对称加密和系统的研究被称为“对称密码学”。有些人将对称加密系统称为“密钥”系统。流行的对称密钥加密方法有：`IDEA`、`BLOWFISH`、`DES`（数字加密标准）和\
  \ `3DES`（三重 DES）。\n\n在 20 世纪 60 年代，100%的加密系统都使用对称加密。这种加密和解密信息的方法如此可靠高效，以在今天仍在在使用。专门从事通信和信息技术的企业认为对称加密是可用的最佳选择。由于这种加密相比非对称加密具有明显优势，它在未来仍将被继续使用。\n\
  \n以下是对称加密加密系统的主要特征：\n\n- 在传输消息之前，发送方和接收方必须确定将要使用的密钥。\n- 必须定期更换密钥以避免对加密系统的任何入侵。\n\
  - 必须建立一种稳定的数据传输形式，以便相关方之间方便共享密钥。由于密钥必须定期更改，这种机制可能会证明是昂贵且复杂的。\n- 在由 `x` 个人组成的组织中，为了方便任何两个成员之间的双向通信，整个系统所需的密钥数量使用公式推导出：`x\
  \ * (x-1)/2`。\n- 使用的密钥通常较小（即通过涉及的位数来测量），因此与非对称系统相比，其加密和解密过程更快、更简单。\n- 这些加密系统不需要计算机系统具备高处理能力。由于使用的密钥小而简单，可以使用普通计算机来建立和管理加密系统。\n\
  \n这是使用此类加密系统时通常遇到的两个问题：\n\n- **密钥确定** – 在传输任何消息之前，发送方和接收方必须确定一个特定的对称密钥。这意味着必须建立一种安全且一致的密钥创建方法。\n\
  - **信任问题** – 因为所有参与人员都使用相同的密钥，对称密钥加密要求发送方信任接收方，反之亦然。例如，如果他们其中一人将密钥与未经授权的共享，整个加密系统的安全性将遭到破坏。\n\
  \n现代通信者表示，这两个问题极具挑战性。如今，人们被与不可信且不熟悉的双方交换贵贵数据（例如卖家和买方的关系）。由于这些问题，密码学家不得不开发一种新的加密方案：非对称密钥加密。\n\
  \n#### 对称加密算法的类型\n\n有许多类型的对称加密算法，包括：\n\n1. **Rivest 算法或 RC4**\n\n这种加密算法由 Ron Rivest\
  \ 于 1987 年设计。它是一种流加密算法。它以简单和快速而闻名。但专家后来发现 `RC4` 存在多个漏洞，并且在某种程度上是不安全的。\n\n`RC4` 通常使用\
  \ 64 位和 128 位的密钥。该算法在密码学上是强有力的，而且相对容易实现。`RC4` 或 `Rivest Cipher` 包含两个部分——伪随机生成算法和密钥调度算法或\
  \ `KSA`。该算法最流行的实现是在 `SSL` 和用于 `802.11` 无线网络的 `WEP` 中。\n\n以下是 `RC4` 工作原理的图：\n\n![Description:\
  \ 00005.jpeg](img/Image00000.jpg)\n![Description: 00006.jpeg](img/Image00001.jpg)\n\
  ![Description: 00007.jpeg](img/Image00002.jpg)\n![Description: 00008.jpeg](img/Image00003.jpg)\n\
  ![Description: 00009.jpeg](img/Image00004.jpg)\n![Description: 00010.jpeg](img/Image00005.jpg)\
  \ ![Description: 00011.jpeg](img/Image00006.jpg)\n![Description: 00012.jpeg](img/Image00007.jpg)\
  \ ![Description: 00013.jpeg](img/Image00008.jpg) ![Description: 00014.jpeg](img/Image00009.jpg)\
  \ ![Description: 00015.jpeg](img/Image00010.jpg)\n\n密密钥是用于加密和解密消息的密码。图中的 `RC4` 仅仅是加密引擎。所以发生的情况是，用户输入一个带有密密钥的明文文件。然后，加密引擎生成密钥流，并将明文位位地转换为密文。\n\
  \n`RC4` 初始化一个包含 `256` 字节的数组，并在上面运行 `KSA` 或密钥调度算法。`KSA` 的输出随后插入伪随机生成算法中，该算法将生成密钥流。然后，密钥流将对数据执行\
  \ `XOR` 操作并将其转换为密文。\n\n2. **RC2**\n\n`RC2` 也称为 `ARC2`。这也是由 Ron Rivest 设计的。它被 `Lotus`\
  \ 支持。这是一个 `64` 位块密码，具有可变长度密钥。它使用以下交错序列进行轮处理：\n\n- 五轮混合轮\n- 一轮洗牌轮\n- 六轮混合轮\n- 一轮洗牌轮\n\
  - 五轮混合轮\n\n`RC2` 使用密钥扩展算法。\n\n3. **RC6**\n\n`RC6` 也是由 Ron Rivest 设计的。该算法拥有 `RSA\
  \ Security` 专利。它具有 `128` 位块大小，并支持 `192`、`128` 和 `256` 位密钥大小。它还针对 `32-bit` CPU 进行了优化。泄露报告显示用于拦截互联网通信的\
  \ `NSA` 系统产生 `RC6` `UDP` 流量。\n\n4. **Serpent**\n\n`Serpent` 是由 `Lars Knusen`、`Eli\
  \ Biham` 和 `Ross Anderson` 设计的对称算法。它的块大小为 `128` 位，支持密钥大小 `256`、`192` 和 `128`。`Serpent`\
  \ 在安全性上具有保守的安全余量。\n\n`Serpent` 密码没有专利，属于公有领域。任何人可以在他们的硬件或软件中引入该算法。\n\n许多研究表明 `XSL`\
  \ 攻击可以削弱 `Serpent`。\n\n5. **Twofish**\n\n`Twofish` 是由 `Counterplane Labs` 于 1998\
  \ 年发布的对称密码。它具有 `128-bit` 块大小。密钥范围从 `128` 位到 `256` 位。它还针对 `32-bit` CPU 进行了优化。Twofish\
  \ 免许可且未申请专利，因此任何人都可以它。`Twofish` 的设计是为了满足 `NIST`（美国国家标准技术研究院）的设计标准。它没有弱密钥。它在 `Intel\
  \ Pentium` 以及其他硬件软件平台上也是高效的。它的设计灵活，因此接受额外的密钥长度。\n\n6. **DES**\n\n`DES` 代表 `数据加密标准`。这曾是加密电子数据最常用的对称密钥算法。它由\
  \ `IBM` 在 20 世纪 70 年代开发。它在 70 年代被 `NSA` 使用，因此许多人怀疑该密码存在后门。在轮处理之前，块被分为两个 `32-bit`\
  \ 半部分。这两个部分交替处理。这个过程被称为 `Feistel` 方案。\n\n`DES` 现在被认为是不安全的，主要因为其 `56-bit` 密钥大小太小。\n\
  \n\n\n\n这些加密系统使用不同的密钥来加密和解密信息。虽然涉及的密钥不同，但它们之间仍然存在逻辑和/或数学上的关系。无法使用与加密密钥完全无关的解密密钥来提取信息。\n\
  \n根据密码学家的说法，这种加密模式开发于 20 世纪。它的开发是为了克服与对称密钥加密系统相关的挑战。这种加密方案的主要特征是：\n\n* 加密系统的每个成员都应该拥有两个不同的密钥——一个公钥和一个私钥。当使用其中一个密钥进行加密时，另一个必须用于解密。\n\
  * 私钥被视为机密信息。每个成员必须时刻保护自己的私钥。另一方面，公钥可以与任何人共享。因此，公钥可以存放在公共仓库中。因此，一些人将这种方案称为“公钥加密”。\n\
  * 虽然私钥和公钥在数学上是相关的，但在实践中，通过其“伙伴”密钥来确定另一个密钥是不可能的。\n* 当 `Member1` 想要向 `Member2` 发送信息时，他需要做三件事：\n\
  \    * 从公共仓库中获取 `Member2` 的公钥。\n    * 加密信息。\n    * 将信息发送给 `Member2`。`Member2` 将使用他的私钥获取原始信息。\n\
  * 这种加密模式涉及更大、更长的密钥。这意味着与对称加密相比，它的加密和解密过程更慢。\n* 非对称密钥加密需要加密系统中计算机具有较高的处理能力。\n\n对称密钥加密很容易理解。然而，非对称加密则非常困难。\n\
  \n你可能在好奇加密和解密密钥是如何既相互相关，又能防止入侵者通过其“伙伴”密钥获取密钥的。这个问题的答案在于数学原理。今天，密码学家可以根据这些原理创建加密密钥。实际上，非对称密钥加密的概念是新颖：系统入侵者尚不熟悉这种加密的工作原理。\n\
  \n以下是与非对称密钥加密系统相关的主要问题：\n\n* 每个成员都需要信任该加密系统。他/她必须相信用于传输的公钥是正确的。这个人必须说服自己公共仓库中的密钥是安全的，不受系统入侵者的攻击。\n\
  \n为了确保加密系统的安全，公司经常使用涉及信誉良好的第三方机构的 `PKI`（公钥基础设施）。这个“外部组织”负责管理并证明系统中使用的密钥的真实性。第三方公司必须保护公钥，并向授权的加密系统成员提供正确的密钥。\n\
  \n由于两种加密方法的优缺点，商业组织将它们结合起来创建更安全、更实用的安全系统。\n\n# 第 12 章 使用 VPN\n\n如今大多数用户都有路由器，它们将手机、平板电脑和计算机等设备连接到互联网。你的互联网提供商会为路由器提供公\
  \ IP 地址，而每个连接到互联网的设备将获得一个私 IP 地址。路由器提供私 IP 地址。当你将计算机连接到互联网时，看起来就像你的电脑就是路由器。在用户只有一台电脑的情况下，他们可以直接连接到互联网，他们的\
  \ ISP 会为其分配一个公 IP 地址。由于分配的 IP 地址是公开的，另一端的主可以跟踪你的上网活动。\n\n## 使用虚拟专用网络隐藏 IP 地址\n\n\
  `VPN`（虚拟专用网络）允许用户连接到另一个网络。`VPN` 为你的计算机提供自己的 IP 地址。`VPN` 可用于隐藏你的原始 IP 地址，你的 ISP 提供的\
  \ IP 地址将被隐藏。`VPNs` 不仅用于隐藏 IP 地址。你可以访问所在组织的任何网络，而该网络可能被某些网络阻断。互联网上有许多商业和免费的 `VPN`\
  \ 及代理服务。使用这些服务，你可以用新的 IP 地址连接到互联网，你的原始 IP 地址将被隐藏。\n\n以下是一些虚拟专用网络提供商：\n\n* Hide My\
  \ Ass\n* ZenMate VPN\n* Express VPN\n* Pure VPN\n* Vypr VPN (免费试用)\n\n## 为什么要隐藏你的\
  \ IP 地址？\n\n隐藏 IP 地址有很多原因。以下是人们希望隐藏其 IP 地址的一些原因：\n\n* **向你的竞争对手隐藏身份** - 在论坛上对竞争对手的产品发表评论会泄露你的身份。在这种情况下，你可以通过隐藏原始\
  \ IP 地址来隐藏身份。\n* **隐藏你的地理位置** - 并非所有的互联网内容对所有人开放。某些网站防止某些国家的用户访问其网站。在这种情况下，使用代理服务器将解决问题，你就可以访问那些网站。\n\
  * **防止网站跟踪** - 你访问的每个网页或网站都会跟踪你的数据。Web 服务器保存所有这些数据。你可以通过代理服务器隐藏 IP 地址，防止 Web 服务器跟踪你。\n\
  * **保护你的身份** - 如果你使用自己的 IP 地址浏览互联网，人们就可以监控你的敏感和隐私信息。如果攻击者知道了你的 IP 地址，你的位置、安全和隐私可能会被破坏。你可以使用他人的\
  \ IP 地址 own 自己的来保护自己和身份。有一些工具可以掩盖你的 IP 地址。它们使用由第三方提供的 IP 地址。\n\n## 使用代理掩盖 IP 地址\n\
  \n你可以使用互联网上提供的代理服务器匿名上网。有数千个代理服务器可以隐藏你的 IP 地址。当你使用代理服务器浏览时，意味着你是在间接访问网站。\n\n## 使用他人的网络\n\
  \n你可以利用免费 Wi-Fi 服务作为替代。免费 Wi-Fi 可以在咖啡馆和酒店等场所找到。IP 地址会随位置改变，当你从不同的地方连接互联网时，无法获得相同的\
  \ IP 地址。\n\n或者，你可以使用咖啡馆、酒店或任何公共场所提供的免费 Wi-Fi 服务。\n\n当你查看 IP 地址时，是否曾停下来想它在物理上位于哪里？你可能在好奇你使用的代理服务器是在你的管辖区内还是境外；或者你可能与某人进行邮件通信并确认他们是否如所言的那样。相反，你可能是一个试图追踪入侵系统或发送威胁邮件的嫌疑人的调查员。\n\
  \n查询 IP 地址的物理位置很容易，而无需申请搜查令。\n\n有一家名为 `MaxMind` 的公司。他们负责维护一个全球每一个 IP 地址的完整数据库，无论其位于世界何处，以及该位置的\
  \ `GPS` 坐标、区码、邮政编码和国家。这不是你通常的关系型数据库，它实际上是一个扁文件。为了更新数据库，`MaxMind` 请求 370 美元的站点许可费，然后每月\
  \ 90 美元或每年 1360 美元。\n\n\n\n\nMaxMind 也允许用户注册数据库的开发者版本，但并不提供读取该数据库所需的软件或工具。因此，它是免费的，但准确性不如完整的商业版本。要使用此免费版本查找任何\
  \ IP 地址的地理位置，你需要一个可以读取数据的工具或程序。\n\n两位开发者 T Williams 和 Jennifer Ennis 开发了一个名为 `pygeoip`\
  \ 的 Python 脚本。它在 GPL 许可证下发布，允许你输入一个 IP 地址并返回其物理位置的信息。\n\n# 第 13 章 需注意的法律与伦理预防措施\n\
  \n实施战略计划来应对网络恐怖主义努力将确保你的组织有能力应对可能面临的威胁。在面对威胁时，企业可以采用多种策略来保持领先并增强其安全能力。这些策略包括：\n\n\
  ## 起诉犯罪实施者\n\n许多攻击都隐藏在匿名性的围墙之后，许多小型组织未能追究并起诉负责的黑客。虽然这可能是一项成本昂贵的活动，但识别并将攻击者诉至法庭也有一些优势。这对于网络恐怖分子社区将是一个冲击，并为其他组织在攻击发生后的行为准则设定标准。如果案件具有很高的知名度，组织可以从强硬应对中获益，被起诉的黑客将成为那些决心对你的业务造成破坏的其余犯罪组织的反面。这种榜样作用可以在整个社区中引发波澜，并促进刑事网络恐怖分子调查和起诉流程的改进。因此，对于受攻击的影响方来说，寻求公正始终符合其利益。\n\
  \n## 开发新的安全实践\n\n当一个组织面临攻击时，他们将重新评估其安全性以及任何可能被利用的潜在漏洞。这涉及到进一步的测试，例如我们之前探讨的渗透测试，以此寻找弱点和漏洞，并采用新的安全手段来这些这些。这些活动需要组织内所有部门之间的合作和协调努力，以确保最大的效能。企业应该审查安全信息的标准指南，详细说明在信息安全方面保护组织时应采取的步骤。随着组织安全能力的进一步发展，他们能够调整和修改标准指南以符合自身的运营和需求，从而获得最佳结果。\n\
  \n## 采取主动措施\n\n随着网络恐怖主义的威胁变得日益复杂和针对性增强，企业和大众采取主动措施都是至关重要的。这涉及到关注网络安全领域的最新信息，例如威胁、漏洞和值得关注的事件，这将使安全专业人员能够深入洞察这些组件如何影响他们的组织。从这些点开始，他们能够开发并实施更强大的安全措施，从而减少黑客利用进行网络攻击的机会。\n\
  \n组织应该不断处于网络安全的最前沿，拥有多级安全基础设施，以保护价值数据和用户隐私信息。所有性质关键的活动都应频繁进行安全审计，以确保遵守所有与安全相关的策略和程序。安全应该被视为一个持续不断的过程，而不是攻击后果之后的补救。\n\
  \n## 部署关键安全应用\n\n安全专业人员有许多工具可用来保护其网络，这些工具可以为当前工作提供显著益处。这些应用程序涉及防火墙、`IDS` 以及防病毒软件，可以确保对潜在黑客提供更好的保护。通过使用这些安全系统，安全人员能够记录、监控和报告任何可能表明系统存在风险的可疑活动。这些应用程序能够简化流程，使工作变得更加高效有效。利用此类工具可以确保安全人员获得最新预防技术的支持，并有更大的概率击攻击者。\n\
  \n## 建立业务灾难恢复计划\n\n在发生攻击的情况下，所有企业都应该制定最坏情况的应急预案，以确保流程和操作尽快恢复正常。如果没有此类计划，后果可能是灾难性的，导致业务收入和声誉的损失。一旦制定这些计划，应定期进行演练，以测试其有效性，并在攻击发生时为员工提供培训。\n\
  \n这些计划由两个主要部分组成，即修复和恢复。从修复的角度来看，应该尽快中和攻击力量，目标是让操作恢复正常并使所有功能运行。恢复元素侧重于与硬件、软件以及由服务供应商、应急服务部门和公共公用事业组成的网络建立预设安排，以协助恢复过程。\n\
  \n## 与其他合作\n\n在处理网络攻击的后果时，你的组织不会孤单。存在许多公共和私立组织来应对网络恐怖主义威胁。这些群体在帮助解决与网络恐怖主义相关的问题可以提供巨大帮助，例如提高组织内部的安全、帮助制定和实施灾难恢复计划，并进一步讨论未来如何应对威胁以及这对更广泛社区意味着什么。拥有这个扩展网络将增强你抵抗网络攻击的能力，并在讨论其他新兴威胁以及保护面临相同威胁的组织方面发挥作用。\n\
  \n## 提高安全意识\n\n安全威胁无处不在，这需要提高对所有网络安全相关问题的意识。让你的组织成为社区内提高意识的权威，将有助于教育其他组织如何防御攻击并加强自身的安全，反过来这会让网络恐怖分子社区在面对更强抵抗力时遭受损害。你还可以通过安全培训计划提高自己组织内部的意识，这将帮助所有员工配备正确的技能，以应对可能因自身疏忽而产生的威胁，并帮助他们在威胁可能存在时保持警惕。\n\
  \n# 结论\n\n至此，我们已经读到了这本书的最后。在计算机网络世界，安全被赋予了极高的重视，以保护数据并确保系统不受入侵入侵。尽管有严格的安全指南和身份验证方案，黑客仍然成功地攻入了多个系统，引起了普通人的兴趣。\n\
  \n\n\n\n我已经以清晰且全面的方式解释了所有的黑客攻击概念；然而，起初将所有这些内容付诸实践可能看起来困难。但请不要气馁。黑客技术完全取决于实践，此外还需要良好的问题解决能力。善用像“Hack\
  \ this site”这样的网站，它们允许黑客合法地测试自己的黑客技巧。此外，如果你觉得这些内容对你来说太技术化，请不要犹豫，尽管寻求专业安全专家的帮助。\n\
  \n请注意，计算机世界始终在不断变化和进步。系统越先进，你就越需要提高自己的知识。\n\n同样重要的一点是，滥用你的黑客技能进行非法活动将受到法律惩处。大多数国家对黑帽黑客所实施的网络犯罪有非常严格的法律。因此，将个人的黑客技能限制在伦理黑客范围内，并利用这些技能测试自己设备的安全性，或协助组织测试其安全系统的健壮性是非常重要的。\n"
