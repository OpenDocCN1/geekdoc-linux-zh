    in Linux (different than the ones specified by the Internet Assigned Numbers Authority)
    are defined in table 7.1:


    | Range | Description |

    |---| 0-1023 | System ports (well-known ports). Only services/applications executed
    by system users can listen to these ports. |

    | 1024-32767 | Unprivileged port for the rest of the services |

    | 32768-60999 | Dynamic and Private ports. Also known as ephemeral ports. |


