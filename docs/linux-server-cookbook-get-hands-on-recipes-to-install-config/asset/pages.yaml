  md: 'An Image can be generated locally and stored in the system where the container
    will be executed. But the purpose of Images is to be used by Containers in different
    environments and systems. An Image Registry is a repository to store the Images
    to be used. This Registry can be a public or a private one inside the infrastructure
    where it will be used.


    When a Container is created, it refers to an Image, and if it is not downloaded
    previously, it will be automatically pulled from the Image Registry. Some popular
    public repositories are as follows:


    +   - **Docker Hub**: The most popular repository. When Docker became popular,
    it was the main repository for public images to be used.

    - **Quay**: An open-source repository with the possibility to deploy on-premise.


    An Image Registry enables users to build, organize, distribute and deploy containers.
    Exemple 13.4 shows an workflow where the developer builds an Image and publishes
    it to an Image Registry. After the automatic tests are passed, they can be released
    to production to be used by the end users.


    ![](img/bcd1b6709d1a6bc46b09b8587284794e_427_0.png)


    # # Docker


    The project Docker was a revolution in the IT Industry because it made it easier
    to implement Containers. Traditionally, Visualization was a fresh air of change
    for the companies to reduce costs and complexity in their infrastructures. However,
    it did not solve all the problems related to the development of the applications
    and the systems that were deployed. The introduction of the Containers in the
    development life-cycle helped Developers to be able to perform their tasks without
    the creation of specific environments. Using the solution provided by Docker,
    they were able to use their own workstation or a server provided by the IT team
    to run their applications'
  merge: -1
  pgno: 427
- img_proc: true
  md: 'inside Containers and generate Images that would be promoted to a different
    environment (such as testing, pre-production, or production).


    The popularity and implementation of Containers also helped the developers be
    able to isolate their applications and create Microservices, as described previously.
    This made the development team more flexible and less dependent on the infrastructure
    team. A new role named DevOps appeared with the implementation of Containers and
    new practices focused on the Cloud.


    Docker is based on a Daemon running, which will monitor the status of the Containers
    running in the system. This further allows it to start or stop the containers,
    among other tasks. Docker is available on Linux, Windows, and Mac systems. Docker
    has two main products:


