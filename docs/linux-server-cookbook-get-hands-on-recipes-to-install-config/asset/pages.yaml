  md: "# # CHAPTER 1\n\n# # Introduction to Linux\n\n# Introduction\n\nOn August 25,\
    \ 2021, Linux celebrated 30 years since Linus Torvalds posted a message about\
    \ the new operating system he had designed. The IT sector experienced enormous\
    \ advances and changes during these three decades. Linux became and consolidated\
    \ the most important operating system in the industry.\n\nIn this chapter, we\
    \ will describe why Linux is essential for companies, its latest features, and\
    \ the cases in which it is used.\n\n# Structure\n\nIn this chapter, we will discuss\
    \ the following topics:\n\n+   - The Magnitude of Linux\n- Linux on key sectors\
    \ of the IT industry\n    - Software\n    - Devices and Infrastructure\n    -\
    \ Information Technology and Business Services\n    - Emerging Technologies\n\
    \    - Telecommunications Services\n- Latest Features in Linux\n- Linux vs. Other\
    \ Operating Systems\n- Promising Future of Linux\n\n# # The magnitude of Linux\n\
    \nNowadays, it is impossible to understand our lives without a device connected\
    \ to the internet: a phone, a tablet, or a personal computer,"
  merge: -1
  pgno: 26
- img_proc: true
  md: 'accessing a Web server or using an application to read one''s e-mails, look
    up something in a search engine (like Google), or shop for a product you need.


    The most common operating system for phones and tablets is Android, a Linux variant.
    Popular services used by people on a daily basis, such as mail servers or Web
    servers, are all most probably running in systems with a Linux distribution. Other
    devices providing Internet access to those services are usually running Linux
    too.


    Linux is also used by a large number of professional developers, IT professionals,
    and regular users as their main operating system. Linux is currently the third
    most popular operating system for the desktop.


    Linux began as a personal project by Linux Torvalds in the year 1991. The development
    was done on MINIX, a Unix-like operating system. The year after, the X Window
    System was ported to Linux, helping to gain importance. The timeline for the more
    important releases are the following:


    +   - The first stable version was released in the year 1994.

    - The version 2.0 was released in the year 1996.

    - The version 2.2 was released in the year 1999, 2.4 in the year 2001, and 2.6
    in 2003.

    - The version 3.0 was published the year 2011.

    - The version 4.0 in the year 2015, 5.0 in the year 2019, and version 6.0 in 2022.


    Some other important events related to Linux during history are as follows:


    +   - Debian started in the year 1993.

    - Red Hat Linux was released in the year 1994

    - Ubuntu was released in the year 2004.

    - Android version 1.0 was released in the year 2008.

    - All the Top500 list of fastest supercomputers run Linux from the year 2017.


    # Linux on key sectors of the IT industry


    Linux is a well-known platform for running applications and services in enterprise
    environments. But Linux is not limited to servers; it is a key part'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'of the Information Technology industry and its general areas, such as:


    +   * Software

    * Devices and Infrastructure

    * Information Technology and Business Services

    * Emerging Technologies

    * Telecommunications Services.


    # Software


    This area includes developing software for business or customer markets, such
    as internet applications, system software, databases, management, home entertainment,
    and so on. Historically speaking, there was a gap between developers and the system
    administrators, as well as between the developers and the environment where the
    applications are executed.


    Modern development methodologies are based on the balance and relationship between
    the system administrators and the programmers. The concept of DevOps is a set
    of practices that combines software development **(Dev)** with IT Operations **(Ops)**.
    It aims to improve the system development life cycle and provides continuous delivery
    with high software quality.


    DevOps methodology is based on multiple tools, called *toolchains*, and is deployed
    by Linux in different stages. Some of these tools will be covered in this book.
    The following figure illustrates this:'
  merge: -1
  pgno: 28
- img_proc: true
  md: "![](img/bcd1b6709d1a6bc46b09b8587284794e_29_0.png)\n\nFigure 1.1: DevOps stages.\
    \ Source: Wikimedia\n\n+   * Plan: This stage is the definition of the activities\
    \ required.\n  * Jira is one of the most popular tools for this stage that can\
    \ be executed on Linux. Some open-source alternatives are Taiga and Kanboard.\n\
    * Create: This stage includes the coding, building, and integration with the source\
    \ repository as well as the continuous integration.\n  * Some popular tools are\
    \ as follows:\n    * For coding, Integrated Development Environments (IDEs): Vim,\
    \ Emacs, and Visual Studio Code.\n    * For repository and packaging: JFrogArtifactory,\
    \ Sonatype Nexus, Gitlab.\n    * For building and continuous integration: Maven,\
    \ Jenkins, and GitLab CI.\n* Verify: This stage ensures the quality of the software.\
    \ Different tests are performed during this stage related to security, integration,\
    \ and performance.\n  * Some popular tools are as follows:"
  merge: -1
  pgno: 29
