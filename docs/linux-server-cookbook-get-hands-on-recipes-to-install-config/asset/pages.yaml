  md: '# CHAPTER 14


    # Backup and Restore


    # Introduction


    Backup is the process of creating a copy of the data in a certain time with the
    objective of being able to recover it in the future. Restore is the process of
    recovering the data from a Backup, going back to an old version of the data, or
    reinsting a missing one. Backup requires a good definition, as well as planning
    and regular tasks to ensure the integrity of the copies.


    This chapter covers the different strategies available for the Backup and how
    it affects Restore. The storage media where the Backup can be stored is discussed,
    as well as the different locations to protect the copies from possible disasters.
    Backup Solutions includes different features to optimize the process, reducing
    the size stored with compression and removing duplicates, among other features.
    Two popular software are detailed in this chapter are Bacula and Relax and Recover
    (ReAR).


    # Structure


    In this chapter, we will discuss the following topics:


    +   * Introduction to backup and restore

    * Storage media for backups

    * Backup types

    * Backup sources

    * Backup strategies

    * Backup solution features

    * Bacula

    * Relax-and-recover (ReAR)


    # Introduction to backup and restore'
  merge: -1
  pgno: 467
- img_proc: true
  md: 'The Backup process, and with it the Restore process, has evolved along with
    the big transformation in the IT sector. Big enterprises have dedicated teams
    to configure the target environment and the clients and are responsible for the
    planning as well. Good Backup planning is essential to avoid data loss, accelerate
    the recovery time, and perform tasks periodically to ensure the Restore is viable.


    A Backup strategy requires to define of the following factors:


    +   - **The data to be included:** This is an important decision to take for many
    reasons, such as the size that the Backup will need, as well as the Restore time
    needed. For example, a Backup can include all the files from a system or only
    the files needed to reinstate the system is reinstalled with a fresh Operating
    System installation.

    - **The frequency:** It is important to define how often the Backup is going to
    be performed. The planning should include per environment frequency to be daily,
    weekly, monthly, or another specified period.

    - **Backup method to use:** There are several methods to make copies, which are
    going to be explored in this chapter. This includes a Full, Differential, or Incremental
    Backup, among others.

    - **The window-time for backups:** A Backup can be a long-time process, especially
    for Full ones, and can consume resources and network bandwidth. Deciding the window
    time to perform is one factor to be included in the planning.

    - **Backup storage media:** A Backup usually generates several copies to protect
    against disaster scenarios. Different media can be used to store, such as Tape,
    Shared Storage, or Cloud Storage.

    - **Retention:** Backup planning should define the retention of the data, and
    after that period, the copies would need to be removed to save space in the storage
    media.


    For the Restore, the important factors in defining the recovery are as follows:


    +   - **How Restore will be performed:** A Backup can include all the data required
    to restore a system or only those required for a service offered. It is important
    to define if the recovery process will be performed in the same system, if possible,
    or in a new one.'
  merge: -1
  pgno: 468
- img_proc: true
  md: '+   - How fast a Restore needs to be: Recovering data from a Backup can take
    longer, depending on the strategies used. The planning should thus include what
    is an acceptable time to reinstate files and services from a copy.


    +   - Restore procedures: Each system, service, or element included in the Backup
    should have a Restore procedure associated in case of data loss.


    +   - Restore test plan: A Backup without regular recovery testing cannot ensure
    that the Restore procedures are the proper ones.


    The overall Recovery goals are defined with two terms as follows:


    +   - Recovery Time Objective (RTO): the maximum duration of time to restore a
    disruption of the service in order to avoid unacceptable consequences. For example,
    for a non-critical environment, it can be hours or days, and for critical environments,
    it can be specified in minutes.


    +   - Recovery point objective (RPO): the maximum targeted period during which
    the data is lost due to an incident.


    Figure 14.1 shows a diagram representing the terms RTO/RPO:'
  merge: -1
  pgno: 469
- img_proc: true
  md: '![](img/bcd1b6709d1a6bc46b09b8587284794e_470_0.png)


    Figure 14.1: Terms RPO/RTO represented. Source: Wikipedia.


    It is important to remark that a Distributed Storage Solution (such as Ceph),
    High Availability systems, or Mirroring Technologies (such as RAID) are not not
