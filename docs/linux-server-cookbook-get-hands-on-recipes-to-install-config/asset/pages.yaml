    # # Permissions


    On a Linux system, each file and directory defines access rights for the user
    owner, for the members part of the group owner, and for the rest of the users
    not included in the group. The rights available are: read, write, and execution.
    The execution permission for directories has that meaning if the user is able
    to read the content index.


    The rights can be represented with a single character or with a numeric digit.
    Table 5.7 shows the available rights and the representations:


    | Permission | Symbol representation | Octal representation |

    | read | r | |

    | write | w | 2 |

    | execution | x | 1 |'
