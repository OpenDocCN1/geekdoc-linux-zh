  md: "# Introduction to cloud providers\n\nCloud Provider is responsible for offering\
    \ the different services to be consumed. Cloud Providers have evolved during the\
    \ last decades from a simple offering of Compute services and Storage Services\
    \ to more than hundreds of services. A Cloud Provider is responsible for all the\
    \ infrastructure, including storage, networking, computing, and security.\nSome\
    \ of the categorized services offered these days are the following (categories\
    \ offered by Amazon Web Services):\n\n+   * Infrastructure software: The services\
    \ in this category provide infrastructure-related solutions.\n  * Backup and recovery:\
    \ Services for storage and backup.\n  * Data analytics: Services used for data\
    \ analysis.\n  * High-performance computing: High-performance computing services.\n\
    \  * Migration: Services used for migration projects.\n  * Network infrastructure:\
    \ Services used to create networking solutions.\n  * Operating systems: Images\
