    As observed in the previous example, an inventory can contain a DNS-resolvable
    name or an IP. Groups can define systems with certain affinities, such as:


    +   - **Geographically:** For example, hosts located in the same data center,
    city, or country.

    - **Application:** Servers running similar applications, such as webs, databases,
    backup, and so on.

    - **Operating system or distribution:** For example, to separate Linux and Windows
    systems, Ubuntu, and Red Hat Enterprise Linux systems.

    - **Environment:** Such as development, test, production, and so on.


    ```

