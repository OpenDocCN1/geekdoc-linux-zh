    # # Linux directory structure


    Linux distributions have a common layout directory structure, where each directory
    has a specific purpose. The main directory is called root and is referred to with
    a slash (/). The rest of the directories appear under this directory. Figure 5.1
    shows the Filesystem Hierarchy Standard (FHS):


    ![](img/bcd1b6709d1a6bc46b09b8587284794e_141_0.png)


    > > Figure 5.1 Filesystem Hierarchy Standard. Source: Wikipedia.


    As is possible to observe in the previous image, the name of the directory, for
    example, /bin/. If a directory is part of another directory, the separation is
    using a slash (/). Again, the directory /usr/share/ indicates the directory share/
    is under the directory usr/, which is also under the root directory (/). Directories
    are represented by ending with a slash (/). It is possible to refer to the directory
    without specifying the last slash, but it is usually a good practice so that there
    is no confusion between file names.'
  merge: -1
