  md: '# # CHAPTER 9


    # # Network Services


    # # Introduction


    This chapter will cover the popular network services usually offered by a Linux
    Server. The services available for different needs are a big number; this chapter
    will focus on three main services: **Dynamic Host Configuration Protocol (DHCP)**,
    **Domain Name System (DNS)**, and remote access using **Secure Shell** or **Secure
    Socket Shell (SSH)**.


    The network service DHCP, which provides dynamic IP assignment to other elements
    in the network, is one of the cores in all infrastructures. This service was usually
    offered by network equipment, but on modern architectures, it is based on virtualization
    and containers. The service is based on Linux solutions.


    Another core network service is DNS, which is a key component for infrastructure
    software. It is required to understand how it works and its different configurations
    to offer this service to the network.


    When remote re-access to Linux systems is required, SSH is the popular and most
    used method used. This chapter will describe the different options to configure
    the service and how the client can be used for different use cases. Private and
    public keys will be covered to increase the security of the system.


    The last part of the chapter will introduce other popular services and Linux popular
    software associated with them.


    # # Structure


    In this chapter, we will discuss the following topics:


    +   - DHCP service and client

    - DNS service and clients

    - SSH service and SSH client

    - SSH private and public keys

    - Check network services available

    - Other popular network services


    # # DHCP service and client'
