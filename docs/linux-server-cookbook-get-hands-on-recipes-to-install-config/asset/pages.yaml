    # Infrastructure as code


    With the adoption of the Cloud, new needs appeared regarding the deploying of
    new infrastructure in a fast and flexible way. There are the two approaches for
    deployment:


    +   Declarative: This approach describes what to do, without a specific control
    flow, to have the desired Infrastructure. This approach was the most used before
    specific tools to deploy infrastructure appeared. It includes using specific tools
    for the platform to manage, such as:

    * AWS Command Line Interface (AWS): The tool to interact with the AWS Services
    from a command line. Using the command aws, it is possible to create different
    services, such as a VPC, EC2 Instance, or Load Balancer among others.

    * Google Cloud CLI (gcloud): A set of tools to create and manage resources on
    the Google Cloud Platform.

    * Azure Command-Line Interface (CLI): A set of commands used to create and manage
    Azure resources.

    * Alibaba Cloud CLI: Includes the aliyun command to interact with and manage your
    Alibaba Cloud resources.

    * Openstack CLI: OpenStackClient project provides a unified command-line interface,
    which enables access to the project API through the easy-to-use command openstack.

    Imperative: In this approach, it describes how the Infrastructure should be. The
    tool used will read the definition desired, and will ensure that the final state
    is the proper one. This approach has several advantages compared to the declarative
    one, and they are as follows:

    * Idempotent: The process can be executed several times; if only the resources
    status is not the same as the definition, it will be modified.'
