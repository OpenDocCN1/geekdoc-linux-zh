  md: '# # CHAPTER 15


    # # Multi Cloud Management


    # ## Introduction


    As described throughout this book, many companies have modernized their IT Infrastructure
    by moving to Virtualization (not only computing but networking and storage) and
    to Containerized environments. Another big transformation is the move from the
    On-Premise infrastructure to a Public Cloud. This migration comes with several
    advantages, but there are also some considerations to take into account.


    The opportunity to work with several Cloud environments, such as Amazon Web Servers,
    Microsoft Azure, Google Cloud, or Alibaba Cloud, brings new challenges in the
    automation and management of the environments. The combination of a Private Cloud,
    such as OpenStack, with a public provider is called Hybrid Cloud.


    This chapter will focus on the introduction of the different Cloud providers,
    the different services offered, and how they are compared among them. It would
    describe the advantages of using a Public Cloud as well as the disadvantages.
    It will describe the different strategies to manage Multiple Clouds and the use
    of the automation tool Terraform for it.


    # ## Structure


    In this chapter, we will discuss the following topics:


    +   - Introduction to Cloud Providers

    - Cloud Services

    - Multi Cloud Management

    - Infrastructure as code

    - Terraform'
  merge: -1
  pgno: 497
