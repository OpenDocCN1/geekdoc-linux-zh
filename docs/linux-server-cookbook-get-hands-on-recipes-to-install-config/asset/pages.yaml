    # # Multi cloud management


    One of the biggest disadvantages of using one Cloud Provider is being locked into
    the services and the costs from one vendor. The concept of Multi Cloud Management
    is that it is a set of tools and procedures that lets us more than one Cloud Provider
    and deploy services depending on the needs, such as cost or availability. The
    services to be distributed can be simple ones, such as an application running
    in a Virtual Machine, or a complex one, such as a Kubernetes cluster.


    These days, more companies are moving to use more than one Cloud Provider for
    the following reasons:


    +   - Reducing costs: Prices of running services on the Cloud can be very different
    from one to another. If the company has decided on one'
  merge: -1
  pgno: 511
- img_proc: true
  md: 'provider for its main services, it can reduce costs for some other services
    using a different provider.


    +   **Services available**: Most of the providers are offering the same services,
    but specific ones can be a reason to choose another provider that is different
    from the main one.


    +   **Availability**: Most of the providers are available in a big number of regions,
    specific zones to offer service to users in a country or region can be a reason
    to deploy a service in a different provider.


    The tools for **Multi Cloud Management** can be grouped into three different categories:


    +   **Infrastructure Automation Tools**: These tools can be used to deploy a service
    or application in multiple **Cloud Providers**. Some examples are as follows:


    +   **Terraform**: Described later on this chapter, Terraform is used to connect
    and deploy services in multiple providers.


    +   **Ansible**: Allows to perform different operations in different providers
    in an easy way.


    +   **Management Tools**: The tools in this category are responsible for managing
    multiple clouds from only one application or portal. Some examples are as follows:


    +   **Embotics**: A solution to help modern infrastructure and operations teams
    decrease the challenges of hybrid and multi-cloud management.


    +   **Kyryl Multicloud Management Platform**: Simplifies management of multi cloud
    IT architectures with comprehensive functionality and integration.


    +   **Red Hat Advanced Cluster Management**: Helps to administer different Kubernetes
    installations in different clouds from one dashboard.


    +   **Cloud Provider Solutions**: Some providers offer services to interoperate
    with different providers.


    +   **Google Anthos**: Consistent development and operations experience for hybrid
    and multi cloud environments.'
