    # # OpenStack


    The cloud solution OpenStack is an open-source platform usually deployed to have
    a Private Cloud in an on-premise environment. This mature solution started in
    the year 2010 and is used by thousands of companies in different sectors. It is
    possible to integrate with the infrastructure existing, such as storage or networking
    available.


    The services offered by OpenStack are similar to the most used in a Public Cloud
    solution. The core services on OpenStack are described in the following list:'
