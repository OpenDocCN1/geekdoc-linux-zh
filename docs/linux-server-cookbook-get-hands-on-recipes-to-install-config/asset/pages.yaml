    # Install mariadb-client and bacula-mysql packages

    apt install mariadb-client bacula-mysql

    ```


    # ## Bacula services


    Bacula is made up of the following five major components or services:


    +   * **Bacula Director**: The Bacula Director service is the program that supervises
    all the backup, restore, verify, and archive operations.

    * **Bacula Console**: The Bacula Console service is the program that allows the
    administrator or user to communicate with the Bacula Director.

    * **Bacula File**: This service (also known as the Client program) is the software
    program that is installed on the machine to be backed up.

    * **Bacula Storage**: These services consist of software programs that perform
    the storage and recovery of the file attributes and data to the physical backup
    media or volumes.

    * **Catalog**: These services are comprised of the software programs responsible
    for maintaining the file indexes and volume databases for all files backed up.


