    # Command top


    The command top provides a dynamic real-time information about the system. In
    Chapter 5. Managing Files, Directories, and Processes, this command was introduced
    to list the processes running in the system. The head part of information shown
    is related to the system resources, as illustrated in figure 6.8:


    ```

    top - 13:33:43 up 74 days, 6:49, 2 users, load average: 0.08, 0.05, 0.05

    Tasks: 466, 2 running, 463 sleeping, 1 stopped, 0 zombie

    %CPU: 0.0 us, 0.3 sy, 0.0 ni, 0.0 wa, 0.0 hi, 0.0 si, 0.0 st

    MIB Mem: 257658.4, 23417.0 free, 184388.5 used, 49763.3 buff/cache

    MIB Swap: 0.0 total, 0.0 free, 0.0 used, 67273.6 avail Mem

    ```


    Figure 6.8: Top command output header example


    The information shown in the first three lines of the top’s command head are follows:


    +   - Uptime, the number of users logged in, and load average in the system. Same
    as uptime’s command output.'
