    # Conclusion


    The adoption of the Cloud brought several advantages and challenges related to
    it. This chapter covered the popular providers and the common services offered
    by them. Working in a specific Cloud brings with it the limitation of having a
    vendor lock-in. Automation tools and management systems allow for managing multiple
    clouds and distributing services between them, saving costs and reducing the dependency
    on only one provider. This chapter covered how Ansible can be used to deploy an
    infrastructure and described how to use Terraform for a multi cloud application
    deployment.


    # Key facts


    +   * AWS is the biggest Cloud Provider as well as the pioneer.

    * Microsoft Azure and Google Cloud Platform are growing and obtaining a market
    share in the last few years.

    * Alibaba Cloud is one of the biggest providers based in Asia.

    * Ansible can be used as an Infrastructure-as-Code tool, defining step by the
    tasks to perform in the target provider.

    * Terraform is a specific Infrastructure-as-Code tool with hundreds of providers
    to operate with public and private clouds.'
