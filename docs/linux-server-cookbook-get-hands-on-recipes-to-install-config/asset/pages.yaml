  md: 'The Linux command line is known as well as the terminal, console, or shell.

    There are ways to access the command line as follows:


    +   * Using the internal Linux console provided by the Linux kernel, accessible
    locally in the system. The name for the software providing the login is getty
    and modern distributions include a default alternative named aget.

    * Using a terminal provided by the graphical environment of the system, where
    the commands are executed in the system where it is running. Some examples are
    GNOME Terminal, Konsole, or Terminator.

    * A remote terminal connecting from another console, usually using the protocol
    SSH.


    When the system is booted and not installed with a graphical interface, a Linux
    terminal will appear to introduce the username and the password. Traditionally,
    there were six available consoles to be used, with the keyboard combinations Ctrl+Alt+F1
    through Ctrl+Alt+F6. This behavior is configurable, and some distributions use
    Ctrl+Alt+F2 through Ctrl+Alt+F7.

    When the system is installed, and a graphical interface enabled, the server will
    show that as default. Using the combination Ctrl+Alt+F1 through Ctrl+Alt+F6, as
    described previously, will show the native Linux console, where Ctrl+Alt+F7 return
    to the graphical interface. Some distributions use Ctrl+Alt+F1 for the same purpose.

    On Linux, there are the following main system terminals:


    +   * **Teletypewriter (tty)leTypewriter (tty)**: enables direct interaction with
    the operating system, handling the input from the keyboard and the output using
    the screen.

    * **Pseudo-tty (pty)**: A pseudonymous behaves like a regular TTY using two pseudo-device
    endpoints. Using the graphical interface or connecting to a remote system, this
    pseudoterminal is used.


    When the login is completed, or a terminal from a graphical environment is used,
    an input field to write commands appears, indicating the system is ready to accept
    tasks. This input is known as *Linux prompt* and is showing every time the username,
    the name of the system, and the current directory. The following illustration
    shows the *Linux prompt* format:'
  merge: -1
  pgno: 77
- img_proc: true
  md: '# Figure 3.1: Prompt format example


    In this example, before typing the command to prompt the shell, ensure that the
    following information is indicated before the @.


    +   - The user running the command is indicated before the @.

    - The command will be executed in the system indicated after the @.

    - The current directory is indicated after the username and the system.

    - The command will be executed by a user non-administrator ($). For administrator
    users, the symbol symbol (#) will replace the dollar ($).


    In the following figure (figure 3.2), a user with username gonzalez is working
    in the system ubuntu (this system can be local or remote) and currently is the
    directory /tmp. This user is a regular user, indicated by the dollar before the
    input command. Please refer to the following figure:


    # Figure 3.2: Prompt example for a regular user


    The administrator user in Linux is commonly known as root. In the following example,
    it is possible to observe in the same system and directory how the prompt differs
    from a regular user. The following figure shows an example of the Linux prompt
    for root user:


    # Figure 3.3: Prompt example for the root user


    The interpreter who reads the commands from the user is called shell; the most
    popular and default in many distributions is called bash. Running a command in
    a Linux system has five important elements to have into consideration:'
  merge: -1
  pgno: 78
- img_proc: true
  md: '+   The command to be executed: This can be a system command (for example,
    mkdir to create a directory), an internal function from the Linux terminal (for
    example, alias to create command shortcut) or can be a user application (such
    as firefox). The command can be specified in three different options:


    +   Using the name of the command without indicating where it is. The system has
    configured some directories where to find the command specified, and introducing
    the command will go in order through the commands to check if the command is available.


    +   Using the full path where the command is situated, no matter the directory
    where the user is located, for example: /usr/bin/mkdir.


    +   Using a relative path from the directory where the user is located, for example:
    .../bin/firefox. In this example, the command firefox is located in a subdirectory
    called bin in the top-level directory where the user is located:


    +   If the user is located in /home/agonzalez/Documents/ running the command previously
    indicated, it will execute /home/agonzalez/bin/firefox. The two dots “..” indicates
    the top-level directory.


    +   The special character “~” indicates the home directory for the user. If the
    home directory is, for example, /home/agonzalez/, then indicating ~/bin/firefox
    will be expanded to /home/agonzalez/bin/firefox.


    +   The options for the command: This can be one or more options if it is needed
    to change the command behavior. Some options as ls to list the content of the
    current directory will show the name of files and directories, using the option
    -l (ls -l) shows more information such as permissions, size, and owner of the
    file.


    +   Some options can be indicated in short format (-a) or in long format (-all),
    taking into consideration that the long format uses two hyphens instead of one.
    With this option, the command ls shows hidden directories (directories starting
    with a dot).'
