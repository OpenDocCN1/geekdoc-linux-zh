    # Transport layer (Layer 4)


    This layer depends on protocols for the transmission of data. The transport protocols
    can be stateful, for example, Transmission Control Protocol (TCP), or stateless
    as User Datagram Protocol (UDP). The stateful connection ensures that the data
    is sent correctly and waits for the transmission to be completed. An example of
    a stateful connection is an HTTP request. A stateless connection sends the data
    and waits for an answer, but without ensuring communication. An example of a stateless
    connection is a DNS request.'
