    # # Conclusion


    Good Backup defines the strategy, the Restore tests to perform, and the storage
    media to use and specify the Recovery Time Objective (RTO) and the Recovery Point
    Objective (RPO). Usually, in enterprises, Backup is underrated and only becomes
    a priority when a disaster occurs. With the adoption of the Cloud and new technologies
    such as Containers, the Backup is still relevant, but the approach is different.
    New systems can be recreated from scratch using Automation, and applications are
    stored as Images. Thus, only the required data is needed to store it.


    There are different commercial Backup Solutions such as EMC Networker, HP Data
    Protector, or Symantec NetBackup. Moreover, there are mature'
