    Some popular latest features in Linux include the:


    +   * Live patching: allows keeping the Linux server updated to the latest kernel
    version without the requirement of rebooting the system, which was previously
    needed. This feature has been around for many years, but the latest version of
    distributions include matter tools. Some of the implementations for this feature
    are Ksplice, Kpatch, Livepatch, and KernelCare.

    * eFAT support: latest versions of Linux Kernel supports the popular Windows filesystem
    for flash memories.

    * Control Groups (v2): a mechanism to limit and isolate resources (CPU, memory,
    and disk I/O, example) of a process or collection of processes. Software such
    as Docker, systemd, and libvirt uses this mechanism.

    *Nftables: This low-level firewall solution has become the default in many distributions
    replacing the popular iptables. This software provides filtering and classification
    of network packets.

    * eBPF: is a technology that can run sandboxed programs in the Linux kernel without
    changing the kernel source code or loading a kernel module.


