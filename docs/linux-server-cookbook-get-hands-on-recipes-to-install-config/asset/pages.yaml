  md: 'The files generated can be included in another Backup solution, such as Bacula,
    to be used later if needed. The Recovering is a two-step process, mounting the
    boot media and transferring the data from the central server or the storage device.


    One of the biggest advantages of using Rear is that this solution uses system
    tools to perform the Backup. The following examples use a central NFS storage
    to save the data and the ISO image from being used. The installation requires
    to only install the package from the software repository. After the installation,
    the file to be configured is /etc/rear/local.conf as follows (example in a Red
    Hat Enterprise Linux system):


    ```

    yum install -y rear

    cat >/etc/rear/local.conf <<EOF

    OUTPUT=ISO

    BACKUP=NETFS

    BACKUP_URL=nfs://ubuntu/storage

    EOF

    ```


