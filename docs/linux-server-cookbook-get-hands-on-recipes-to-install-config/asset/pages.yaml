    There are two types of processes on Linux:


    +   - Foreground processes: this process interacts with the user who invoked it.
    This process would interact using the standard input, standard output, or standard
    error. Meantime the process running the shell would not accept other commands.

    - Background processes: this process does not interact with the user and usually
    are executed by the system. As the user possible to run a background process,
    the shell will allow the user to execute other commands.


    A process running is accepting signal interruptions. The common ones are shown
    in Table 5.21:


    | Signal | Signal ID | Key combination | Description |

    |---|---|---|---||

    | SIGUP | 1 | | Hangup detected, used to reload application configuration. |

    | SIGINT | 2 | Ctrl-C | Interrupt from keyboard |

    | SIGQUIT | 3 | Ctrl-D | Quit from keyboard | |

    | SIGKILL | 9 | | Kill signal |

    | SIGSTOP | 17,19,23 | Ctrl-Z | Stop process |


    Table 5.21: Linux interruption signals


    A foreground process running can be killed using Ctrl-C; if it is waiting for
    input is possible to use Ctrl-D to finish the input wait, and to use Ctrl-Z would
    be stopped. It is possible to send signal interruptions to background processes
    using the command kill, its syntax is as follows: kill [-signal | -s signal] pid.'
