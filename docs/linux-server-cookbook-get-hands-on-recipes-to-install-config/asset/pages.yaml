    # Kubernetes


    If Docker revolutionized the IT industry easing the container adoption and the
    modernization of the applications, Kubernetes went further and put the industry
    upside down in the way of working, deploying applications, and how the application
    modernization should be. Kubernetes offered container orchestration, whereas Docker
    tried with the project Docker Swarm. However, the limitations and the lack of
    functionalities Kubernetes into the perfect container orchestration solution.
    Kubernetes provides you with a framework to run distributed systems resiliently.
    It takes care of scaling and failover for your application, provides deployment
    patterns, and more. Kubernetes provides the following:


    +   • Service discovery and load balancing: Expose a container using the DNS name
    or using their own IP address.


    +   • Storage orchestration: Allows you to automatically manage a storage system
    of your choice, such as local storage, public cloud providers, and more.


    +   • Automated rollouts and rollbacks: It is possible to describe the desired
    state for your deployed containers using Kubernetes, and it can change the actual
    state to the desired at a controlled rate.


    +   • Automatic container distribution: Kubernetes consists of a cluster of nodes
    that it can use to containerize tasks. Each container defines how much CPU and
    memory (RAM) it needs. Kubernetes can fit containers onto your nodes to make the
    best of your resources.


    +   • Self-healing: Kubernetes restarts containers that fail, replaces containers,
    kills containers that do not respond to your user-defined health check, and does
    not advertise them to clients until they are ready to serve.


    +   • Secret and configuration management Kubernetes lets you store and manage
    sensitive information, such as passwords, OAuth tokens, and SSH keys. You can
    deploy and update secrets and application configuration without rebuilding your
    container images and without exposing secrets in your stack configuration.'
