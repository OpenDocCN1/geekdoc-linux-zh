    |

    | Installing packages | rpm -i--[install-options] package.rpm |

    | Upgrading packages | rpm -U--upgrade [install-options] package.rpm<br>rpm -F--freshen
    [install-options] package.rpm |

    | Reinstall packages | rpm --reinstall [install-options] package.rpm |'
