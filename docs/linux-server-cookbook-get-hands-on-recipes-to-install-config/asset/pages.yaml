    The service nfs uses the file /etc/exports to define the directories to be exported
    using the NFS protocol. Each directory in this file has an associated list of
    options and an access control list. A directory can be exported to the following:


    +   - A single host: specifies a fully qualified domain name and an IPv4 or IPv6
    address.

    - A network: this will export to all the hosts in the subnet indicated, and the
    format is address/netmask. The netmask can be specified with the dotted-decimal
    format, for example, 255.255.255.0, or mask length, for example, /24.

    - A pattern using a wildcard: it is possible to use an asterisk (*) or interrogation
    (?) to define a pattern. For example, *.example.com.

    - A Network Information Service (NIS) netgroup: Used with format @netgroup.


    A host that can be part of several definitions will have precedence to the first
    match definition. Some of the popular export options are described in table 10.2:


    | Option | Description |

    |---|---|

    | ro | The shared directory will be exported as read-only. |

    | rw | The shared directory will be exported, allowing you to write it. |

    | async | Allows to not write directly, causing better performance, but an unclean
    server restart will cause data loss. |

    | sync | Only reply to the client requests ensuring the data is written. |

    | fsid | Identify the directory to be exported with an id. |

    | no_subtree_check | Do not check if a subdirectory is in the same filesystem
    as the directory exported. It is the default in newer versions. |

    | subtree_check | Ensure the subdirectory is in the same filesystem as the directory
    exported. |


