- img_proc: true
  md: 'System load is a measure of the amount of computational work that a computer
    system performs. The load average represents the system load over a period of
    time. A processor with a load of 140% indicates it is running overload by 40%,
    just as a processor with a load of 30% is idling for 70% of the time for the period
    observed. The CPU load is represented by a decimal number, such as 1.40 to indicate
    140% and 0.30 to indicate 30%.


    A common analogy to understand the CPU Load in Linux is related to the traffic.
    A single-core CPU is like a single lane in a road. Having more cores and CPUs
    would be like having more lanes, such that the load would be distributed among
    them comfortably. This is illustrated in figure 6.5:


    ![](img/bcd1b6709d1a6bc46b09b8587284794e_182_0.png)


    Figure 6.5: Analogy with processors, load, and traffic


    By having multiple CPUs available, the tasks are going to be distributed between
    different CPUs, and the load would be related to the number of CPUs. A system
    load of 3.00 having four processors indicates that it is using 66.67% of the available
    CPU resources.


    # Command uptime and file /etc/loadavg'
  merge: -1
  pgno: 182
- img_proc: true
  md: 'This command, described in Chapter 3. Using the Command Line Interface, to
    see how long the system is running, is used to have a simple overview. uptime
    shows the CPU load average in the system. The load average on Linux systems is
    represented for the periods of 1 minute, 5 minutes, and 15 minutes. Figure 6.6
    illustrates the average in the last minute was 0.13, for the last 5 minutes was
    0.07, and for the last 15 minutes it was 0.01:


    ```

    [root@server ~]# uptime

    16:44:42 up 73 days, 10:00, 2 users, load average: 0.13, 0.07, 0.05

    ```


    Figure 6.6: Output example for command uptime


    Most of the commands open the file /proc/loadavg to obtain information about the
    system load. This file contains the information for the periods described previously
    in the first three columns the fourth column indicates, separated by a slash (/),
    how many processes are accessing the CPU and how many processes are being executed
    in the system, and the last column indicates the process id assigned. Figure 6.7
    features a content example for the file/proc/loadavg:


    ```

    [root@server ~]# cat /proc/loadavg

    0.04 0.09 0.05 2/640 2147326

    ```


