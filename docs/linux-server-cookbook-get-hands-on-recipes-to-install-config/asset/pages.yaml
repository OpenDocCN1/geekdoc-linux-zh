  md: '# # CHAPTER 13


    # # Containers and CI/CD


    # # Introduction


    Containers is one of the most popular technologies at the present time. Companies
    around the world started modernization of the applications and infrastructure
    to adapt them to the cloud and to the more agile ways to work. The popularity
    of the project Docker helped to make Linux containers a trend, which many companies
    adopted as a standard to deploy new applications. Open-source solutions to run
    containers get popularity as alternatives to Docker, where Podman is one of the
    most popular and used solutions. Kubernetes as orchestration and advanced solution
    Kubernetes Distributions provided another layer to help developers and end users
    build and run the software.


    Modernization of applications brought new practices to develop, test, and release
    software to production. This includes the following:


    +   - Continuous Integration (CI): The practice of automating the integration
    of code changes from multiple contributors into a single software project.

    - Continuous Delivery (CD): The practice where the code changes are automatically
    prepared for a release to production.


    # # Structure


    In this chapter, we will discuss the following topics:


    +   - Introduction to containers and images

    - Docker

    - Image Registry

    - Podman

    - Container runtimes

    - Kubernetes

    - Introduction to continuous integration/delivery

    - Jenkins, GitLab CI/CD, and GitHub Actions


    # # Introduction to containers and images'
  merge: -1
  pgno: 421
- img_proc: true
  md: 'Containers are not something new. They were used to isolate resources at the
    user level and application level. On Linux, the first approach to isolate system
    components before the containers was called chroot (also known as jail). It was
    used to isolate applications and users between them, with the limitation of it
    being unable to isolate physical resources (memory, CPU, or devices). The first
    implementations of chroot started in the 80s.


    Since the year 2000, new implementations to isolate resources appeared, not only
    on Linux systems but on UNIX systems (BSD systems, Solaris, and AIX) and Windows.
    Virtuoso was a pioneer company in developing software to isolate resources at
    the operating system level. The solution was called the same name as the company,
    and it was proprietary software. In the year 2005, the company released, with
    an open-source license, the software OpenVZ. This software is still popular and
    used by different companies, especially those that offer Virtual Private Servers
    (VPS) at low cost.


    Between 2000 and 2005, the technology advanced in the resource isolation level
    on UNIX systems. FreeBSD (a UNIX operating system) implemented “FreeBSD jail”,
    similar to chroot, but able to isolate resources. In the year 2001, Linux-Vserver
    appeared as a free alternative to Virtuoso, and this solution is considered the
    predecessor to the current Containers technology. In the year 2004, one of the
    best solutions to isolate resources appeared—Solaris zones. The zones were considered
    one of the best resource isolations until the appearance of Docker appeared in
    the year 2013, resource isolation was worth mentioning the following:


    +   * Workload partitions (WPARs) for the operating system IBM AIX in the year
    2007.

    * HP-UX Containers for the operating system HP-UX also in the year 2007.

    * Linux Containers (LXC) in the year 2008.


    In the first years of Docker (2013 and 2014), it used LXC to run Containers. From
    version 0.9, it started to use its own library (libcontainer) to handle Containers.


    # Containers versus virtualization


    In the beginning, the popularity of the Containers led to questions about how
    it was different from traditional Virtualization. The Virtualization technology
    consists of adding an abstraction layer for the physical resources, with the objective
    of improving the use of resources. With the introduction of Virtualization, it
    is possible to create several different emulated environments (Virtual Machines)
    for different resources. Thanks to Virtualization, it is possible to run Virtual
    Machines with different operating systems and with isolated resources (CPU, Memory,
    and Devices) inside the same physical system. That allowed the companies to reduce
    costs by grouping services running in different physical systems in only one system,
    migrating the'
  merge: -1
  pgno: 422
- img_proc: true
  md: 'services to Virtual Machines. There are different types of Virtualization,
    but the two most used nowadays are as follows:


    +   **Full Virtualization:** The Virtual Machine does not have direct access to
    the physical resources, and they require to have an upper layer to access them.
    Some software examples are as follows:

    * Oracle VirtualBox

    * QEMU

    * Hyper-V

    * VMware ESXi


    +   **OS-Level Virtualization:** This is where **Containers** are located. It
    is the Operating System, and not the hardware, that is responsible for isolating
    the resources and providing the tools to create, manipulate or manage the state
    of the **Containers** (term used **Virtual Machine**).


    Refer to figure 13.1 to see the difference between hardware and OS-Level Virtualization:


    ![](img/bcd1b6709d1a6bc46b09b8587284794e_423_0.png)


    # # Container content


    A Container contains everything that is needed to execute one or multiple applications.
    A **Container** does not have a full guest operating system as a **Virtual Machine**.
    The size of a **Container** is smaller and includes only the following:


    +   **Operating System libraries:** Only the libraries required to run the applications
    would be included. For example, an SSL library, in the case of a Web server application,
    requires a secure connection.'
  merge: -1
  pgno: 423
- img_proc: true
  md: '+   - Operating system tools: This can contain some tools needed for the application
    or to perform troubleshooting.


    +   - Runtime: Some software is needed to execute the application inside the container.
    For example:


    +   - Interpreters: To run applications such as Python, PHP, or Perl.


    +   - Binaries for compiled languages, such as Java or Go.


    +   - Application files: These are similar to the files that need to be interpreted,
    the binaries to run, configuration files, or any file needed for the application
    to be executed inside the Container.


    A Container can execute several applications inside, but it is recommended to
    separate applications into several applications. The concept of Microservices
    consists of running small independent services which can be managed individually.
    That is part of the modernization to avoiding Monolithic architectures. Some reasons
    to separate services in different containers are as follows:


    +   - Monitor applications individually.


    +   - Limit resources accessible from the applications.


    +   - Able to restart applications without affecting others.


    +   - Scale up/down specific applications (services).


    # # Images


    As described previously, a Container contains everything that is needed to execute
    an application. An Image is a base to run Containers and to create a child image.
    The image has different layers (the Kernel, the minimal required files for the
    operating system, the libraries, and the customization). A Base Image is used
    to generate other images. Figure 13.2 features the base image.'
