    | --configure package..|-a|--pending | Configure a package that has not yet configured.
    |

    | -V, --verify [package-name..] | Verifies the integrity of the package |

    | -C, --audit [package-name..] | Performs database sanity and consistency checks
    |

    | -l, --info archive [control-file..] | Show information about a package. |

    | -l, --list package-name-pattern | List packages matching the given pattern.
    |'
