    # # SSH public and private keys


    The public-key cryptography, also known as asymmetric cryptography, is a system
    that uses a pair of keys: the *public key*, which is the key to be distributed
    to allowed to access the systems, and the *private key*, which should not be shared
    and keep secure in the system initiating the connection. The steps in an SSH connection
    using the pair keys are as follows:


    +   1. The client initiates the connection to the remote host.

    2. The client sends the *public key* id to the SSH server.

    3. The remote host checks in the *authorized_hosts* file of the user trying to
    connect if that key is accepted.'
