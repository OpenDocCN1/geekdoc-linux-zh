  md: 'and used services during the last decades. Another popular solution is dnsmasq,
    which is a lightweight DNS, TFTP, and DHCP server.


    The installation of ISC-DHCP on distributions based on DEB packages requires to
    install the package isc-dhcp-server and isc-dhcp-client (for the client utilities).
    On distributions based on RPM packages, the names are dhcp-server and dhcp-client.
    The main configuration for the service is the file /etc/dhcp/dhcp.conf for IPv4
    and /etc/dhcp/dhcp6.conf for IPv6. The files contain global configurations, subnet
    definitions, other configurations, such as classes, pools, and shared-network
    declarations that are not covered in this book. The global configuration is lines
    ending with a semicolon and defines different options, as observed in the following
    except from the default configuration:


    ```

    # option definitions common to all supported networks...

    option domain-name "example.org"

    option domain-name-servers ns1.example.org, ns2.example.org;

    default-lease-time 600;

    max-lease-time 7200;

    ```


    For the subnet definition, it will include the subnet and the netmask, and the
    specific configuration for subnet, with curly brackets {{}}. In the following
    example of subnet 192.168.100.24, 25 IP addresses would be available, the DNS
    server would be 1.1.1.1, and the gateway 192.168.100.1, among other options:


