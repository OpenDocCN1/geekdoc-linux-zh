  md: '+   This leads to greater security because it is not needed to manage the agent
    versions or server services.


    +   It uses a common protocol such as Secure Sockets Shell (SSH) or WinRM (for
    Windows nodes), not requiring opening extra ports, and with the possibility to
    use standard authentication methods.


    +   A big number of companies collaborating in the project and creating content
    to manage different systems.


    Working with Ansible requires you to know some terminology. Table 12.3 introduces
    some of the important terms and provides a description:


    | Term | Description |

    |---|---|n| Playbook | List of Plays to perform in the nodes indicated. |

    | Play | List of Tasks to perform in the specified nodes in the Playbook. |

    | Inventory | List, static or dynamic, of the nodes to administer and the information
    required for each of them (remote IP, username, password, and so on) |

    | Host | A remote machine to manage it. It can be a Linux system, a Windows system,
    or a network device, among multiple options available. |

    | Task | A definition of an Action to perform. |

    | Action | The action to be performed in a Host |

    | Module | Unit of work that Ansible ships out to remote machines. These modules
    are usually written in Python language. |

    | Arguments | Values needed for the Module. |

    | Template | A dynamic file is usually used for configuration files, where variables
    will be evaluated. |

    | Facts | Data discovered about remote Hosts. |

    | Variable | Values specified statically or dynamically to be used in Playbooks
    and Templates. |

    | Roles | A group of tasks, files, and templates that can be reused in different
    projects. |

    | Collections | A new packaging format for bundling and distributing Ansible content,
    including roles, modules, and more. |

    | Conditions | Check to be performed to know if a Task needs to be performed.
    |


