  md: '# Preface


    This book covers how to administer a Linux server from basic tasks to advanced
    ones., starting with the installation of popular Linux distributions, going through
    administration users and software, to the installation and administration of advanced
    services such as databases and file sharing. This book will guide you through
    new technologies related to automation, containers and DevOps philosophy. Public
    and Private Clouds are covered, as well as why Hybrid Cloud is an important concept
    for enterprises.


    **Chapter 1** is the introduction to Linux. This chapter explains the history
    of the Operating System, the usage of Linux in most of the devices available and
    the IT sectors where Linux is the main operating system. This chapter also covers
    the latest features available and discusses the promising future of Linux.


    **Chapter 2** covers the Linux installation. It describes the different support
    levels available for the popular distributions. It also details the installation
    methods available and guides step-by-step how to install the popular Linux distributions
    available.


    **Chapter 3** introduces the Command Line Interface, a main component when a user
    is operating or administering a Linux system. This chapter covers basic commands
    and concepts related to the input and output of the commands. Commands to identify
    the resources of the system are detailed with different examples.


    **Chapter 4** shows how to manage users and software on Linux. It describes how
    users and groups work on Linux. With multiple examples, this chapter describes
    how to install software on systems such as Ubuntu Server or Red Hat Enterprise.


    **Chapter 5** covers how to manage files, directories and processes. It describes
    the directory structure on Linux, the permissions and how to access to the files.
    This chapter also covers the special characters and the regular expressions, as
    well as the important concepts working on the terminal. Popular editors and file
    managers are also described. The last part of the chapter focuses on the process
    management and the priorities.'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'Chapter 6 explains how to monitor the resources in the system. Commands to
    query the usage of CPU, Memory, Disk and Network are described with several examples.
    This chapter covers quotas and limits to limit the usage of the resources available.


    Chapter 7 covers the basics of the networking in general and explains how to configure
    the networking on Linux system. It also discusses commands to manage the IP addresses,
    and the routes are shown with different examples. In addition, advanced network
    configuration, such as bonding, bridges and virtual switches are also covered.


    Chapter 8 focuses on the security part on a Linux system. It discusses the different
    firewall solution available and how to ensure that the services are correctly
    protected against unwanted access. Different tools are described to monitor the
    traffic and the changes in the system.


    Chapter 9 details the popular network services available on Linux and the software
    associated to offer the services. Services such as DHCP, DNS and SSH are detailed
    with examples and the commands associated.


    Chapter 10 is about File Sharing solutions available on Linux. It describes NFS,
    MSB and FTP protocols and the software to provide the services and the client
    tools.


    Chapter 11 covers the popular databases available on Linux system. This chapter
    describes the difference between relational databases and NoSQL databases. Different
    solutions such as MySQL and MariaDB are detailed for the relational databases
    and MongoDB is described for the NoSQL database.


    Chapter 12 details about Automation and the importance in these days. This chapter
    explains how to perform automation with shell scripting and developing, with a
    programming language such as Python. The popular tool Ansible is detailed to perform
    simple and advanced automation tasks.


    Chapter 13 details the containers and the modernization of applications. Software
    to run containers, such as Docker and podman are also explained with several examples
    of usage. A basic introduction to Kubernetes is explained. New practices as Continuous
    Integration and Continuous Delivery (CI/CD) are explained and the software available
    for these practices are described with different examples.'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'Chapter 14 explains about the Backup and Restore and the importance of the
    enterprise level. Different open-source solutions are described. Installation,
    usage and examples of open-source software solutions called Bacula and Relax and
    Recover (ReaR) are covered.


    Chapter 15 covers a new concept: Multi Cloud Management. This chapter describes
    the popular public cloud available, such as AWS, GCP and Azure, as well as the
    services offered. The concept Infrastructure as code and the software Terraform
    for managing multiple clouds is also detailed with multiple examples.


    Chapter 16 is about Infrastructure as a Service. It details the components of
    a Private cloud and how a Hybrid Cloud operates. The popular IaaS solution called
    OpenStack is explained with detail and with several examples.'
  merge: -1
  pgno: 10
