  md: '# Table 5.7: Permission presentation in symbol octal


    When assigning permissions in symbol representation, the owner is represented
    with the character o, the group owner with the character g, and other users with
    the letter o=rwx, g=rw, o=r indicates:


    +   - The user is able to read (r), write (w), and execute (x) the file.

    - The group members associated to the file would be able to read and write the
    file but not execute it.

    - Other users can read the file but not write or execute it.


    The permission u=rwx, g=rx, o= indicates:


    +   - The user is able to access the directory (x), able to read the content (r),
    and create new files (w).

    - The group members associated with the directory would be able to access a directory
    (x) and able to read the content of the directory (r) but not write new files.

    - Other members are not going to be able to access the directory as they don''t
    have permission (x).


    The octal representation is the sum of the permissions desired to assign. For
    example, read and write is indicated with the number 6 (4+2). The first digit
    is for the user owner, the second for the group owner, and the last one for others.
    The representations shown before as character representations and other examples
    are illustrated in table 5.8:


    | Symbol representation | Conversion | Octal representation |

    |---|---|---|

