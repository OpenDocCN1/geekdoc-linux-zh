    # # Persistent storage


    By default, the Virtual Machines have ephemeral storage for the root disk. This
    is a common behavior working in a Cloud, and the persistent data are usually in
    a separate disk. The project cinder allows for creating volumes and attaching
    them to the Virtual Machine. The argument volume create is used to create a volume
    to be used later with the argument volume add. Figure 16.24 shows an example:


    ```

    [stack@client ~]$ openstack volume create --size 10 firstvolume


