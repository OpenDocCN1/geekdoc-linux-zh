    \ Different examples will be covered to demonstrate the usage of this language.\n\
    \nThis chapter will focus on MariaDB as one of the most popular open-source relational\
    \ databases. It will cover installation, configuration, backup, and restore for\
    \ the service. It will also go over the process for the client to access the service\
    \ and how to manipulate the data, such as creating databases, tables, and inserting\
