    > Figure 7.2: OSI Model layer traffic flow. Source: Wikipedia


    Networking evolved in the last decades, from communication to the adoption of
    new technologies. First communications were mainly between physical servers, through
    switches and routers. The traffic dominant was a north-south data flow, where
    the systems were communicating with devices outside the local network. Migration
    of the services to virtual machines, with the popularity of virtualization, introduced
    new challenges related to communication, thus, increasing the traffic east-west,
    which indicates the communication between different services inside of the same
    network.


    Adoption of the containers increased the traffic between the systems, and advanced
    network configuration and advanced network implementations, such as Software Defined
    Networks and tunnel protocols, are knowledge required nowadays when a server is
    configured.'
