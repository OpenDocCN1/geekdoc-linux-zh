    # Command apt-get, apt-cache, and apt-apt


    These three commands work with the repositories configured in the file /etc/apt/sources.list
    or in the files configured /etc/apt/sources.list/. A repository file contains
    a list of repositories, and each repository specifies if it is for binary packages
    (deb) or for source (deb-src), as well as the address of the repository, the distribution
    version, and the type of the software in this repository; (main for free, restricted
    for non-free software). The context of the word free is restricted to open source
    and not about cost). An example of repositories entries are shown for a Ubuntu
    Server with the codename jammy:


    ```

    deb http://es.archive.ubuntu.com/ubuntu jammy main restricted

    deb http://es.archive.ubuntu.com/ubuntu jammy-updates main restricted

    ```


    The command apt-get is used to install, update or remove software using a software
    repository. The common actions are shown in table 4.22:


    | Action | Description |

    | --- | --- |

    | update | Resynchronize the package index files from their sources. |

    | upgrade | Install the newest versions of all packages currently installed in
    the system. |

    | dist-upgrade | Upgrades the packages related to the core of the distribution.
    |

    | install | Install the package(s) specified. |'
