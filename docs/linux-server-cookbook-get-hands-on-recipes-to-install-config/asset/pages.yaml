- img_proc: true
  md: 'Modern distributions are applying some changes to the standard FHS to ease
    the directory structure and also adding new directories for new features:


    +   - Directory /bin/ is a link to directory /usr/bin/ and does not contain different
    content anymore.

    - Directory /lib/ is a link to directory /usr/lib/.

    - Directories /lib32/ (for 32-bit libraries) and /lib64/ (for 64-bit libraries)
    are linked to directories /usr/lib32/ and /usr/lib64/.

    - Directory /sbin/ is a link to directory /usr/sbin/

    - A new directory called /sys/ contains information about devices, drivers, and
    kernel features.

    - A new directory called /run/ contains a temporary filesystem associated with
    the memory available where run-time data are stored. This directory is cleared
    during the boot process.


    # Directories storing applications


    There are two main directories where applications are stored when we install software
    using a package (deb or rpm). These directories are as follows:


    +   - /usr/bin/ (linked to /bin/): It contains regular software which any user
    in the system can execute. Some commands were reviewed previously, such as `mkdir`
    or `groups` are stored here.

    - /usr/sbin/ (linked to /sbin/): It contains software used by administrators in
    the system. Some commands were reviewed previously, such as `useradd` or `groupadd`.


    Another directory that can contain software installed without using a Linux distribution
    package is `/usr/local/bin/`.


    # Directories storing user files


    Regular users would have their own directory inside the `/home/`. It is accessible
    only by the user or by an administrator and is isolated from the rest of the users.
    For example, the user `agonzalez` will have default home directory `/home/agonzalez/`.
    An exception to the `/home/` directory is for the home directory for the `root`
    user. This administrator user has as home directory labeled `/root/`. It is important
    not to confuse between the `root directory` (`/`) and the root’s home directory
    (`/root/`).'
