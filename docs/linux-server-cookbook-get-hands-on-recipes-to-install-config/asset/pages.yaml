  md: 'Ansible is not installed by default on Linux distributions. As described previously,
    Ansible does not use agents or a service; the only installation required is the
    tool in a Linux system which will be used as a control node. The only requirement
    is to have version Python 3.8 or newer for the latest Ansible versions. This control
    node which has the Ansible tools installed requires have communication to the
    nodes managed or to the jump hosts used to perform the intermediate connection.


    It is possible to install Ansible using the Linux distribution’s package manager
    or using Python’s package manager (pip). The following instructions are used for
    the installation in an Ubuntu system:


    ```

    apt-add-repository ppa:ansible/ansible

    apt install -y ansible-core ansible

    ```


