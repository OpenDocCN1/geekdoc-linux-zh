  md: "+   - CPU Socket (CPU slot): a mount on a computer motherboard that accepts\
    \ a CPU chip.\n- CPU Core: a separate processing unit that reads and executes\
    \ instructions. In modern systems, a CPU contains several cores.\n- CPU Thread:\
    \ a thread is a queue for an operating system instruction. Modern systems enable\
    \ hyper-threading enabling two threads.\n\nFor example, if a system has two sockets,\
    \ with four cores for each CPU, and has enabled the hyper-threading, it would\
    \ have available eight cores and 16 threads. It is capable of running eight operating\
    \ system instructions per cycle but would be to have a queue of up to 16 tasks\
    \ per cycle.\n\nAn advanced concept for physical servers is Non-Uniform Memory\
    \ Access (NUMA). This architecture divides the memory into local and remote memory\
    \ relative to the processors. CPU accessing the local memory assigned has better\
    \ performance than accessing the remote access using an interconnect. Figure 6.1\
    \ shows a representation of a node with two NUMA with one socket and four cores:\n\
    \n![](img/bcd1b6709d1a6bc46b09b8587284794e_180_0.png)\n\nFigure 6.1: Standard\
    \ Linux filesystem hierarchy. boost: org\n\n# Obtaining CPU(s) information\n\n\
    The command described in Chapter 3, Using the Command Line Interface, shows the\
    \ important information related to the CPU socket, core, threads, and NUMA. Figure\
    \ 6.2 shows a node with two CPU sockets and eight cores per socket.\n\n```\n[root@server\
    \ ~]# lscpu grep --color=never -E \"^(CPU|Thread|Core|Socket|NUMA)\"\nCPU(s):\n\
    \  32\nThread(s) per core: 2\nCore(s) per socket: 8\nSocket(s):\n  2\nNUMA node(s):\n\
    \  2\nNUMA node0 CPU(s): 0-7,16-23\nNUMA node1 CPU(s): 8-15,24-31\n```"
  merge: -1
  pgno: 180
- img_proc: true
  md: "# Figure 6.2: Using command lspcpu to obtain CPU information.\n\nThe command\
