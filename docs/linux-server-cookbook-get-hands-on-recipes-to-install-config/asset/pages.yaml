  md: 'Dynamic Host Configuration Protocol (DHCP) is a protocol to automatically assigns
    Internet Protocol (IP) addresses to the devices in the network. Chapter 7. Network
    Configuration, introduced the different layers of networking. The first layer,
    called the physical layer, is responsible for the transmission and reception of
    the data in a device. There are no IP addresses in this layer to send the data
    between the nodes. is based on the physical address. When a device without a static
    IP configured is booting, it asks the network to obtain an IP address. For this
    request, it sends a query using User Datagram Protocol (UDP) to port 67 as a destination
    and port number 68 as the client, and waits for an answer. This can be seen in
    figure 9.1:


    ![](img/bcd1b6709d1a6bc46b09b8587284794e_268_0.png)


    Figure 9.1: DHCP client requesting to obtain IP


    The request, called *discover*, is sent to all the devices in the network, expecting
    to reach a DHCP server, as observed in the preceding figure 9.1. As there are
    no IPs in this layer, the packet will be sent to the special address FF:FF:FF:FF:FF:FF,
    and the node will specify with its **MAC address** for which it wants the IP address.
    In the ethernet packet, the IP 0.0.0.0 is used as the source IP and the destination
    IP 255.255.255.255. A following excerpt from *tcpdump*''s output shows:


    ```

    16:28:34.690916 52:54:00:1a:9c:c4 > ff:ff:ff:ff:ff:ff, ethertype IPv4 (0x0800),
    length 342: (tos 0x0, ttl 128, id 0, flags [none], proto udp (17), length 328)

    0.0.0.0 > 255.255.255.255: [udp sum ok] BOOTP/DHCP, Request from 52:54:00:1a:9c:c4
    Client-Ethernet-Address 52:54:00:1a:9c:c4

    Vendor-rcfl048 Extensions

    Magic Cookie 0x63825363

    DHCP-Message (53), length 1: Discover

    Hostname (12), length 6: "ubuntu"

    ```


    The DHCP service will be listening in the network, waiting for requests. When
    a *discover* request is received, it will check if there is IP available from
