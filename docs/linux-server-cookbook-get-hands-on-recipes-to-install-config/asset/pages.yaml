    # # NFS service and client


    Network File System (NFS) is a distributed file system protocol developed in 1984
    by Sun Microsystems. The modern version of the protocol is version 4, referenced
    as NFS4, replacing the previous version 2 (NFS2) and version 3 (NFS3). NFS is
    the most popular protocol for sharing data with clients in a Linux system. Other
    storage solutions, such as Network Attached Storage and Storage systems, allow
    the sharing of available storage using the NFS protocol. The NFS server can be
    seen in figure 10.1.


    ![](img/bcd1b6709d1a6bc46b09b8587284794e_297_0.png)


    The NFS implementation in Linux includes several services required to provide
    authentication and access to the shared data by the clients. Table 10.1 shows
    the required services and the ports used:


    | Service | Description |

    |---|---|n| nfsd | The NFS server, which services the requests from the clients.
    It uses the port 2049/udp or 2049/tcp. |

    | rpcbind | The server that covers Remote Procedure Call (RPC) program numbers
    into universal addresses. Clients connect to rpcbind to determine the'
  merge: -1
  pgno: 297
- img_proc: true
  md: '| | |

    |---||

    | | address where the requests should be sent. This service uses 111/udp or 111/tcp.
    This is not required on NFSv4. |

    | rpc.mountd | Used for version 2 and version 3 to implement the directory mounting
    from a client. Version 4 uses only nfsd. |

    | rpc.nfsd | Provides an ancillary service to satisfy the NFS requests by the
    clients. |

    | lockd | It implements the Network Lock Manager (NLM) protocol, used by NFSv3,
    to lock files in the server. |

    | rpc.statd | It implements the Network Status Monitor (NSM) protocol, which notifies
    the clients when the server is restarted. |

    | rpc.idmapd | It provides to NFSv4 server and client map between names, local
    users, and groups. |


    Table 1.1: NFS services and description


    The modern NFSv4 is updated regularly with new versions and features. For example,
    version 4.1 includes Parallel NFS (pNFS), and version 4.2 includes server-side
    clone and copy features. It is important to take into consideration that some
    clients only accept specific versions (3,4) or minor versions (4.0, 4.1) of the
    NFS protocol.


    # # NFS server


    The package on the Advanced Packet Tool (APT) repositories, including the NFS
    server, is called nfs-server. On systems using RPM Package Manager, the server
    and the client is included inside the package named nfs-utils. In both systems,
    the main service on systemd, after installation, is named nfs-server.

    The main file to configure the service is /etc/nfs.conf, where it is possible
    to configure different values as the IP protocol to be used (tcp) or udp) or the
    NFS versions to be enabled (2, 3, 4, 4.0, 4.1 and 4.2). The following excerpt
    shows the parameters specific for the nfsd service, which by default are commented
