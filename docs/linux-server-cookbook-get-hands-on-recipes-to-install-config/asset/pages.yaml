    # # Networking for Virtual Machines


    To run a Virtual Machine on OpenStack, it should be connected to a network. The
    network should have at least one subnet added. The subnet can be configured to
    provide DHCP addresses to the Virtual Machines connected to it. The argument network
    create is used to create the network, which can be an overlay or a provider network.
    The argument subnet create is used to create subnets inside a network. Figure
    16.12 creates a provider network to be used as an external network for Floating
    IPs.


    ```

    [client ~]$ openstack network create external --share --external --provider-physical-network
    datacentre \ --provider-network-type flat

    ```


