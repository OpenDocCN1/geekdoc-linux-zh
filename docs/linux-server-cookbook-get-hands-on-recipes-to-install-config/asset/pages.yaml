  md: 'dame (such as disk problems).


    +   - Restore full system: That can include restoring a Virtual Machine or a Physical
    system. Modern Backup solutions allow performing a copy of a running system and
    the possibility of restoring it in the same system or in a new one.


    # # Storage media for Backups


    First, enterprise Backups were stored on physical tapes, where individual files
    were included in the copy. The Restore process is required to find the proper
    tape where the data to be recovered is located and then copy it from there to
    the system. More modern solutions were based on Tape Libraries (also known as
    Tape Robot), which included several tapes, and they automatically mount the desired
    tape to perform a Backup or Restore. Virtual Tape Library (VTL) simulates a Tape
    Library having the back-end of a regular storage system, such as a hard drive.
    One of the biggest advantages of usage of tapes, even these days, is the possibility
    of storing them off-site (in a different location where the original data is).


    The popularity of tapes as storage media for Backups was present until the first
    decade of the 21st century. The reduction of the cost of hard drives and the introduction
    of Cloud Storage, along with different work methodologies, such as DevOps, NFS,
    iSCSI, and NAS are used to store data from Backups. Network Storage solutions
    using NFS, iSCSI, and NAS Nevertheless, it is important to keep a copy in a different
    location (as a different Data Center) from the original data.


    Modern environments use Object Storage to store data, including Backup data. Public
    clouds offer affordable storage to store Objects. An Object Storage System places
    the unstructured data as opposite to regular file systems. The Object (file) to
    be stored cannot be modified but can only be replaced with a version. Some available
    options are as follows:


    +   - Amazon Web Services (AWS) offers a cheap solution called Amazon S3 Glacier
    for archiving and backup.

    - Microsoft Azure offers the service Azure Archive Storage.

    - Google Cloud offers Cloud Storage solution for archives and backups.

    - Private cloud OpenStack offers the solution, Swift.'
  merge: -1
  pgno: 471
- img_proc: true
  md: "+   - Software-defined storage solution Ceph has a component called Rados Gateway\
    \ (RGW) to offer an Object Storage service.\n\n# # Backup types\n\nThere are the\
    \ three main types of Backup:\n\n+   - Full Backup: It contains all the data to\
    \ be copied. This type does not mean that the whole system will be copied; rather,\
    \ it means that all the data specified to be copied will be included in the Backup\
    \ performed. The main advantage and disadvantage are as follows:\n  - Advantage:\
    \ Recover time is fast because all the data is included.\n  - Disadvantage: The\
    \ space needed is big, and each Backup performed requires all the space. For example,\
    \ if the data to be saved as 1 TB, and it is needed to have 30 different Backups,\
    \ the total size will be 30 TB.\n\n+   - Incremental Backup: Only transfer the\
    \ data changed from the previous Backup performed and the current time. This procedure\
    \ reduces the space needed. The main advantage and disadvantage are as follows:\n\
    \  - Advantage: The required space and the time to perform the Incremental Backup\
    \ is reduced considerably.\n  - Disadvantage: The Restore requires more time because\
    \ it is required to go through several Backup performed.\n\n+   - Differential\
    \ Backup: This method transfers only the difference between the previous Full\
    \ Backup and the moment where the Backup is being performed. The main advantage\
    \ and disadvantage are as follows:\n  - Advantage: The Restore process requires\
    \ less references than the Incremental one; it only requires the Full Backup and\
    \ the specific Differential Backup.\n  - Disadvantage: The size of the copy is\
    \ bigger than in an Incremental one."
  merge: -1
