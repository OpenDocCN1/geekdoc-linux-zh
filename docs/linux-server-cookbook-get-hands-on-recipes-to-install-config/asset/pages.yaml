  md: 'The NFS server, by default, does not allow the root user to access with the
    uid 0. Instead, it will be assigned a different id, called nobody uid. Regular
    users would access their files working locally, but in some situations, this is
    not possible because the user does not exist in the remote server. The different
    mapping options are described in table 10.3:


    | Mapping option | Description |

    | root_squash | Map requests from uid/0 to the anonymous uid/gid. This is the
    default option. |

    | no_root_squash | Turn off root squashing. |

    | all_squash | Map all uids and gids to the anonymous user. |

    | no_all_squash | The opposite to all_squash option. This is the default option.
    |

    | anonymid and anongid | These options explicitly set the uid and gid of the anonymous
    account. By default, the value is 65534. |


