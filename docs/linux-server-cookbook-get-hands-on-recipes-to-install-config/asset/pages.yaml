    # Introduction to RPM and DEB package formats


    Linux distributions are working with packaging systems to make the process of
    installing new software, updating the software, or removing it easily. These packaging
    systems are responsible for solving the dependencies needed and offering the possibility
    of verifying the status.


    A package contains an archive of files and meta-data that are used to install
    and erase the archive files. The meta-data includes help scripts, file attributes,
    and descriptive information about the package. Most of the distributions offer
    two types of packages:


    +   - Binary packages: used to encapsulate the software to be installed.

    - Source packages: containing the source code and everything else that is needed
    to produce binary packages.


    There are two popular package managers and formats used by the most used distributions:
    RPM Package Manager and Debian package.


    The RPM Package Manager (RPM) is an open packaging system that runs on Red Hat
    Enterprise Linux as well as other distributions such as Fedora, CentOS, Alma Linux,
    and Rocky Linux. There are different tools to operate with the RPM Package Manager
    (RPM):


    +   - rpm: the main tool to query, install, upgrade or remove packages from the
    system. This command will use the local RPM database when querying or uninstalling,
    and it will use local files with the extension .rpm to install or upgrade packages.'
  merge: -1
  pgno: 118
- img_proc: true
  md: '+   - yum (Yellowdog Updater Modified): The primary tool for getting, installing,
    deleting, and querying packages from software repositories. This tool will be
    responsible for downloading the package and the dependencies needed to install
    the software requested. It allows the update or upgrade of the full system.


    +   - dnf (Dandified YUM): The newest version of YUM, having compatibility with
    the YUM command and options. It is faster than the original yum, it is more extensible,
    and resolves the dependencies in a better way.


    The Debian package is the package format for Debian, Ubuntu, and derivatives.
    The extension for the packages is .deb. The main tools to operate with the Debian
    packages are as follows:


    +   - dpkg: The main tool to query, install, build and remove Debian packages.
    It acts as a frontend for the low-level commands dpkg-query (for listing) and
    dpkg-deb (to install software).


    +   - apt-get: One of the popular tools for handling packages from software repositories.
    It allows to install, update, reinstall, and remove software from the system.


    +   - apt-cache: This command is used to search packages in the software repositories.
    The system will keep a local copy of the list of the available packages, and this
    tool will query this local database to search for packages, search files inside
    packages or obtain information about a package.


    +   - apt: Provides a high-level interface for package management. Using this
    command simplifies the use of one command for the installation (apt-get tasks)
    or manipulation of packages and the search or obtaining package information (apt-cache
    tasks).


    # # Commands to operate with RPM packages


