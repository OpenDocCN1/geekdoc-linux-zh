  md: '# CHAPTER 16


    # Infrastructure as a Service


    # Introduction


    This chapter will detail what Infrastructure as a Service (IaaS) is and its different
    usages. This type of Cloud offers compute, storage, and network resources (among
    other resources) on demand. Users will access a platform to request the virtual
    resources needed.


    The previous chapter explained the common services offered by the popular Public
    Clouds and introduced OpenStack as a Private Cloud solution. This chapter will
    deepen on the options available for the Private Cloud and the term Hybrid Cloud.


    This chapter will describe how to operate an OpenStack platform, explaining all
    elements required to run Virtual Machines and access them.


    # Structure


    In this chapter, we will discuss the following topics:


    +   * Infrastructure as a Service

    * Private Cloud

    * Hybrid Cloud

    * OpenStack as an IaaS

    * Running virtual machines on OpenStack


    # Infrastructure as a Service


    The concept of Infrastructure as a Service consists of converting the resources
    on a traditional on-premise data center to an infrastructure based on the Cloud
    model. In this model, the resources are virtualized and offered to the users to
    be consumed. Some of the important characteristics offered by this service are
    as follows:


    +   * A self-service API to perform new requests, query, or manipulate resources.'
  merge: -1
  pgno: 537
- img_proc: true
  md: '+   • A Web-based self-service portal to ease operations.

    • High availability services to provide the best uptime possible.

    • Replication of the data stored to avoid data loss.

    • Physical resource optimization to provide the best performance on virtual resources
    offered.

    • Security of the data with secret management and encryption of the data.


    The primary components virtualized to be offered to the consumers as follows:


    +   • Computing resources: Run Virtual Machines in a controlled environment.

    • Networking resources: Networks, subnets, switches, firewall, and routers can
    be used as virtual elements.

    • Storage resources: Disks, file systems, or object containers can be consumed.


    In *Infrastructure as a Service*, the provider is the one responsible for managing
    the underlay physical resources, and the user is only responsible for managing
    the virtual components and the configuration for the virtual resources consumed,
    such as the operating system for a virtual machine created or the application
    running on it. Figure 16.1 features an Infrastructure as a Service diagram:


    ![](img/bcd1b6709d1a6bc46b09b8587284794e_538_0.png)'
  merge: -1
  pgno: 538
- img_proc: true
  md: "# Private Cloud\n\nIn a Private Cloud, the resources are only shared via the\
    \ internet and private network to a specific user or organizations. Companies\
    \ can decide on a Private Cloud for one of the following reasons:\n\n+   - **Privacy**:\
    \ Some enterprises require the data and the resources to be under their own responsibility.\n\
    - **Cost control**: The cost of a Public Cloud can be increased if it is not controlled\
    \ or estimated properly. Having a Private Cloud, the costs are fixed and not related\
    \ to the usage.\n- **Multicloud**: As described in the previous chapter, it is\
    \ possible to have a Private Cloud to perform development and test, and for production,\
    \ to use a Private one.\n\nA Private Cloud requires a dedicated team or teams\
    \ responsible for managing the infrastructure (such as servers, network devices,\
    \ data center, and so on), the platform providing the services, and the support\
    \ for the services offered. The team or teams are also responsible for scaling\
    \ up the infrastructure when needed to provide more resources to end users.\n\n\
    The underlay infrastructure in a Private Cloud has to ensure the following considerations:\n\
    \n+   - The system resources, as much memory and CPU, should be sufficient for\
    \ the requirements of the tenants using the platform.\n  - Overcommitment is a\
    \ technique used to provide more resources (memory or CPU) than the available\
    \ ones. In most of the cases, a Virtual Machine is not using all the resources\
    \ dedicated to them.\n- The traffic between the different networks should be isolated\
    \ for security avoiding bottleneck. For example, the storage network should not\
    \ affect the Virtual Machines traffic.\n- Infrastructure should operate in a High\
    \ Availability mode. This reduces the single point of failure (SPoF) having redundant\
    \ devices, such as power supply, Ethernet cards, switch, and so on.\n\nA Private\
    \ Cloud is a complex environment that requires a good architecture design and\
    \ a maintenance plan to avoid unexpected downtime and degradation of the services\
    \ offered. Different Open-Source enterprise-ready projects are available for building\
    \ a Private Cloud; some popular examples are as follows:"
  merge: -1
  pgno: 539
- img_proc: true
  md: '+   • OpenStack: A Cloud Computing solution for providing multiple services
    to end users.


    +   • Ceph: A software-defined storage solution to provide block, file, and object
    storage.


    +   • Open Virtual Network (OVN): A software-defined network solution on top of
    Open vSwitch (a distributed multilayer switch implementation).


    Public Clouds offers the possibility of having a Private Cloud on-premise integrated
    with the Public Cloud. The options and descriptions are as follows:


    +   • Azure Stack: A portfolio of products that extend Azure services and capabilities
    to create customers'' environments of choice—from the datacenter to edge locations.
    The hardware needs to be certified by Azure.


    +   • AWS Outposts: It is possible to run run AWS services locally and connect
    to a broad range of services available in the local AWS Region. The hardware needs
    to be bought directly from AWS.


    +   • Google Anthos: It allows building and managing modern applications on Google
    Cloud, existing on-premises environments, or public cloud environments. It enables
    consistency between on-premises and cloud environments.


    +   • Alibaba Apsara Stack: A full-stack cloud solution designed for enterprise-level
    customers that require a highly capable and flexible Hybrid cloud solution. Hardware
    needs to be certified by Alibaba Cloud.


    # # Hybrid Cloud


    The term Hybrid Cloud refers to the combination of computing, storage, networking,
    and services between different environments. It is usually the combination between
    a Private Cloud and a Public Cloud. As described in the previous chapter, one
    of the reasons to work with multiple Clouds is for avoiding vendor lock-in as
    well as reducing costs. Modern applications require an environment to be developed
    and tested because it is difficult for a developer to use a local system.


    Private Cloud in a Hybrid environment can be used for that purpose: developing
    new applications and testing them. Continuous Integration (CI) and Continuous
    Delivery (CD) can be used for the development process. The release of the applications
    can be performed on the Public Cloud when the tests and the required approvals
    are performed.'
  merge: -1
  pgno: 540
- img_proc: true
  md: 'The Public Cloud Providers offer the possibility of communicating between both
    environments through a secure and private connection. Figure 16.2 features a Hybrid
    Cloud diagram:


    ![](img/bcd1b6709d1a6bc46b09b8587284794e_541_0.png)


    # # OpenStack as an IaaS


    In the previous chapter, an introduction to OpenStack was described, including
    a list of the core components and other useful ones. This section will cover the
    architecture of OpenStack, its main use cases, and its advantages compared to
    a Public Cloud.


    In an OpenStack cluster, there are two main types of nodes providing computing
    services:


    +   - **Controller nodes**: They are servers running the database, queue services,
    load balancers, and OpenStack services accessible via API. These nodes include
    networking and storage services.

    - **Compute nodes**: They run Virtual Machines, and they are responsible for the
    correct functioning.'
  merge: -1
  pgno: 541
- img_proc: true
  md: 'Other types can be part of the cluster depending on the use case and the needs,
    for

    example:


    +   - Block storage nodes: Nodes responsible for the storage, called Volumes,
    to

    used by the Virtual Machines.


    +   - Object storage nodes: Nodes responsible for the objects; it stores the

    images to be used by Virtual Machines and other unstructured data.


    Figure 16.3 represents an architecture example for OpenStack. It includes the

    core (controllers and compute) nodes and optional ones (Block and Object

    storage). Please refer to the following figure:


    ![](img/bcd1b6709d1a6bc46b09b8587284794e_542_0.png)'
  merge: -1
  pgno: 542
- img_proc: true
  md: '![](img/bcd1b6709d1a6bc46b09b8587284794e_543_0.png)


    The Networking configuration on OpenStack can be simple for development or proof
    of concept clusters or complex when the cluster is for production purposes. There
    are the following six main networks required in a production-ready installation
    when network isolation is used:


    +   * **Control Plane** (also known as Provisioning): Used in development or installations
    without network isolation as the only network. In a production-ready environment,
    this network is used for provisioning and management.

    * **Internal API**: Communication to the Services API between the services. For
    example, the nova service (responsible for computing) communicates with the neutron
    service (responsible for networking) using this network.

    * **Tenant**: Used by the Virtual Machines in the east-west traffic (communication
    between Virtual Machines) and the north-south traffic (from or to outside the
    cluster).

    * **Storage**: Traffic generated from and to the systems providing the storage
    to OpenStack.

    * **Storage Management**: Traffic used internally between the systems involved
    in the Storage systems.

    * **External**: Used to provide external access from outside the cluster. The
    Network is used to provide an external address to be used for API, Web access,
    and access to the instances running on OpenStack.


    An additional network called Management can be configured to access the cluster
    nodes to be administered, usually only accessible by the teams who administrate
    the cluster. Figure 16.4 shows a network layout for OpenStack:'
  merge: -1
  pgno: 543
- img_proc: true
  md: '![](img/bcd1b6709d1a6bc46b09b8587284794e_544_0.png)


    Figure 16.4: OpenStack Network Layout. Source: Red Hat


    Installation of OpenStack is a complex process, but there are available installation
    tools available, making the process easier. The two popular main options are as
    follows:


    +   * **TripleO (OpenStack On OpenStack):** This project aims at the installation,
    upgrading, scaling, and operating OpenStack. The installation consists of a node
    called undercloud, which is an installation of OpenStack in a single node, which
    further helps the installation of an OpenStack cluster called overcloud. Figure
    16.5 features a TripleO diagram:'
  merge: -1
  pgno: 544
- img_proc: true
  md: "# Undercloud\n\n# Overcloud\n\n| OpenStack Deployment | OpenStack Identity\
    \ |\n| OpenStack Identity | OpenStack Dashboard |\n| OpenStack Dashboard | OpenStack\
    \ Networking |\n| OpenStack Orchestration | OpenStack Compute |\n| OpenStack Compute\
    \ | OpenStack Image Service |\n| OpenStack Image Service | OpenStack Object Storage\
    \ |\n| OpenStack Bare metal | OpenStack Block Storage |\n| OpenStack Telemetry\
    \ |\n\nDeploys Updates Monitors\n\nFigure 16.5: TripleO diagram. Source: OpenStack\n\
    \n+   - OpenStack Charms: This option uses Metal-As-A-Service (MAAS) and Juju\
    \ projects. The project MAAS is used for preparing a bare metal system, and Juju\
    \ to deploy OpenStack services on the nodes.\n\nOpenStack uses open-source projects\
    \ to provide high availability of the services offered. The projects used to provide\
    \ a reliable service as follows:\n\n+   - Pacemaker: A popular High Availability\
    \ resource manager for Linux. is responsible for ensuring that some of the services\
    \ configured are available on the controller nodes. The services can be configured\
    \ in active-passive or active-active. If it detects that some of the applications\
    \ or nodes are not responding, it is responsible for promoting a node as active.\
    \ The resources managed by Pacemaker are as follows:\n    - Galera: A Multi-Master\
    \ cluster for MySQL/MariaDB using synchronous replication.\n    - Haproxy: It\
    \ is responsible for performing load balancing for the services offered by OpenStack.\n\
    \    - RabbitMQ, Qpid, or ZeroMQ: The message queue service to coordinate operations\
    \ and status information among services.\n    - Virtual IPs: IP addresses associated\
    \ with an application and move with the application when the application is moved\
    \ from one server to another. It allows a client to always call the same IP address\
    \ instead of guessing where the application is running.\n\n+   - Memcached: Used\
    \ to cache tokens for the Identity Service.\n- Redis or MongoDB: These NoSQL are\
    \ used for the Telemetry Service."
  merge: -1
  pgno: 545
- img_proc: true
  md: 'The Controller nodes are usually three to guarantee the correct functionality
    of the system and provide high availability to the services. The number of Compute
    nodes depends on the resources for each of them and the needs of the end users.

    There are the following main use cases for OpenStack these days:


    +   - Telco Companies: These companies require a big performance and high bandwidth
    to offer telecommunication services to customers. OpenStack provides different
    options to increase performance, as Real Time Kernel and Huge Pages. For path
    networking, it is possible to use SRIOV or DPDK, among other solutions.

    - Service Providers: These kinds of companies need the flexibility to create,
    scale, and delete services. OpenStack is a good solution to reduce operational
    costs.

    - Development: Having a Private Cloud helps developers speed up the process and
    perform the testing.

    - Artificial Intelligence and Machine Learning (AI/ML): These technologies require
    access to special hardware to perform operations, as a Graphical Process Unit
    (GPU), OpenStack is a perfect place to run Virtual Machines to use virtual vGPUs.

    - Edge Computing: The current trend is to decentralize the infrastructure to have
    nodes to perform tasks in a different location. OpenStack allows it to be installed
    and contain Edge nodes.


    # Running virtual machines on OpenStack


    To operate with OpenStack, it is required to have the address to perform the authentication,
    a valid username, the password, and the project to be used. The authentication
    is performed against Keystone, which uses port 5000/tcp or 1300/tcp (TLS protected)
    to accept the requests. It is possible to specify the authentication data to the
    OpenStack command line client in the following ways:


    +   - Using the file clouds.yaml, which can include different configurations for
    multiple instances. The environment variable OS_CLOUD or the option -os-cloud
    is used to specify the authentication to be used. This file can be located in
    the following directories, with the first having more priority:

    - Inside the current directory.

    - Inside the directory ~/.config/openstack

    - Inside the directory /etc/openstack'
  merge: -1
