    # Operate with processes priorities


    Linux is using a scheduler to assign resources to perform tasks in the system.
    Some process requires to have more priority than others, especially the processes
    which are accessing system resources or to the Linux core. There are two types
    of processes as follows:


    +   * Real-time processes: These processes have the capability to run in time
    without being interrupted by any other processes. These processes have a system
    priority between the range 1 (low) and 99 (high).

    * Regular processes: These processes can be interrupted by other processes with
    more priority, which require access to the system resources. These processes have
    a nice value which indicates the priority of getting the resources. These values
    are from -20 (high priority) to +19 (low priority). A regular process has a default
    nice value 0. Negative values (higher priority) can only be specified by administrators.


    The option -l for the command ps and the command top show the priority and the
    nice value for the processes running. This section will focus on how to change
    the nice values for a process.'
