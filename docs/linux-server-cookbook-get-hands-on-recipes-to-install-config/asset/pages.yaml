    # Monitoring memory resources


    Random-access memory (RAM), is a limited and usually expensive resource in physical
    systems. Understanding how systems and applications are using memory is a required
    knowledge, to be able to administer systems and avoid running critical applications.


    Linux systems include memory management which is responsible to provide dynamic
    allocations of the memory of the processes and to release that portion when the
    application finishes. Memory management provides the:'
  merge: -1
  pgno: 188
- img_proc: true
  md: '+   - Option to offer more physical than the physical availability. For example,
    using swap, which uses the disk space to increase the memory space available.


    +   - Each process has a assigned address for the complex content and is isolated
    from other processes.


    +   - Active: the content of a file is linked to a virtual address of the process.


    +   - Fair allocation of the memory for processes.


    +   - Shared virtual memory between processes, for example, in libraries use.


