  md: '# # CHAPTER 5

    Managing Files, Directories, and Processes


    # ## Introduction


    This chapter will cover how to work with files, directories, and processes. Everything
    in Linux is reflected with files, such as regular files and documents, or devices,
    such as a hard disk, a USB device, or inter-process and network communications.
    Process information is also going to be accessible through files.


    The first part of the chapter will describe the directory structure in Linux distributions
    to better explain the hierarchy of the directories and the functionality of the
    most important ones.


    The second part of the chapter aims to describe how permissions work in Linux
    for files, directories, and applications. Commands to work with files and directories
    and an operation such as create, remove, or filter the content are going to be
    shown with different examples. Commands to operate with permissions are going
    to be described well.


    The third part of the chapter will describe how to work with popular editors,
    which is required knowledge to operate a Linux server. This includes some examples
    and tricks on how to use a basic editor and how to use a more advanced editor.
    In this part, file managers are going to be described as being able to navigate
    between directories in an interactive way.


    The last part of the chapter will show how the processes in a Linux distribution
    work and how it is possible to set permissions to allow or not allow execution,
    depending on the user or group who is trying to run it. Commands to change the
    processes are going to be described with different examples.


    # ## Structure


    In this chapter, we will discuss the following topics:


    +   * Linux directory structure

    * Permissions'
