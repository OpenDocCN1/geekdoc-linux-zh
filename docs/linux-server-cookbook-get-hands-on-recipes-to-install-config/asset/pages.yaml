    it is a runtime supported by the company Mirantis after buying Docker Enterprise.


    A Container Runtime Interface (CRI) is a plugin that allows Kubernetes to use
    a wide variety of Container Runtimes. The two main popular ones are as follows:


    +   • containerd: This runtime is available as a daemon for Linux and Windows,
    which can manage the complete container life cycle of its host system.


