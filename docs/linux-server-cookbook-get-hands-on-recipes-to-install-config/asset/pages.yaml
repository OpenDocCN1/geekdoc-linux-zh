    # Network monitoring


    Network monitoring consists of observing the traffic flow constantly or during
    a period to detect issues. It can also be used to detect attacks or to perform
    troubleshooting related to the network configuration in this system. This section
    will focus on the popular tools tcpdump and wireshark.


    The command tcpdump is a powerful command-line packet analyzer with the possibility
    to save the captured data to a file or read the data from a file. It allows to
    read in a specific interface or in all interfaces in the system. The command can
    be executed with options and arguments, and it will show the traffic generated
    in the first network interface. The arguments in the command tcpdump are to specify
    filters, for only capture packets originated from a specific IP. The common options
    are explained in the following table:


    | Option | Description |

    | -A | Print each packet (minus its link header) in ASCII. |

    | -c count | Exit after receiving count packets. |

    | --count | Print only on stamped the packet count when reading file(s) instead
    of parsing/printing the. |

    | -D,--list-interfaces | Print the list of the network interfaces available on
    the system and on which tcpdump capture packets. |

    | -e | Print the link-level header on each dump line. Useful to debug protocol
    information. |

    | -i interface | Uses the interface specified or with word for all of them. |'
