    \ is controlled by a database management system (DBMS). The data, the DBMS, and\
    \ the applications associated are referred to database system. Applications use\
    \ databases to store data in databases to be able to retrieve when required. This\
    \ chapter will introduce to the basics of databases and the differences between\
    \ relational and non-relational (NoSQL) database solutions.\n\nThe language Structured\
    \ Query Language (SQL) is used in all relational databases. This chapter will\
