    # Virtual LANs (VLANs)


    Virtual LANs are a method of creating independent logical networks within a physical
    network. The separation between the logical networks is done using a tag called
    VLAN ID, which is a number between 0 and 4.095. This VLAN ID is part of the network
    packet. Figure 7.34 shows the structure of a VLAN data packet:


    | Preamble | SFD | Destination Address | Source Address | Tag | Type/Length |
    Data | FCS |

