  md: 'In a shell script, we can include a list of the commands to be executed, each
    in a separate line. It is also possible to use pipes (|), as discussed in this
    book, to use the output of one command as the input for another one. In the first
    example, the function read was used to set a variable from the input, but in most
    of the cases, the variables are going to be set with a fixed value or with the
    output from a command.


    A variable can contain a string or any number type. It is simple to define a variable:
    set the desired of the variable, followed by an equal symbol (=) and the value
    desired. The value of the variable can be in uppercase (recommended for readability),
    lowercase, or combined. In case the value containing a text is separated by spaces,
    it is required to use double or simple quotes. The differences between the two
    options are as follows:


    +   - Double quotes: it evaluates the value of the variables inside.

    - Single quotes: treats the value between quotes as literal, without evaluation.


    The following code shows how to set two variables and run three commands with
    the variables.


    ```

    #!/bin/sh

    VARIABLE1=3.14

    variable2="PI number is $VARIABLE1"

    echo "The number PI is $VARIABLE1"

    echo "Content of variable2: $variable2"

    echo ''Content of variable2: $variable2''

    ```


    The execution of the previous code is shown in figure 1.2, where the difference
    between double and single quotes is demonstrated. Moreover, a variable can contain
    another variable, as demonstrated in the variable variable2:


    ```

    agonzalez@ubuntu:~$ ./example2.sh

    The number PI is 3.14

    Content of variable2: PI number is 3.14

    Content of variable2: $variable2

    ```


    > Figure 1.2: Variable usage in a shell script'
