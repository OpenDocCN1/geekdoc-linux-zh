  md: 'The most popular Cloud Provider, these days in the market, are the following
    ones:


    +   * Amazon Web Services (AWS): The pioneer of offering Cloud Services, it dominates
    the market.

    * Microsoft Azure: The second biggest Cloud Provider in the market, offering good
    integration with companies using Microsoft products.

    * Google Cloud Platform (GCP): Google growing in the Cloud market in the last
    few years and is the third biggest platform.

    * Alibaba Cloud: This is the fourth on the market and is part of the giant Chinese
    group Alibaba Group.


    On the Private Cloud solutions, the most popular open-source solution is OpenStack.
    OpenStack is a mature solution with the support of several companies, such as
    Red Hat, Mirantis, and Canonical. The decision to choose one Cloud Provider requires
    several considerations, and some of the important ones are the following:


    +   * Cost Saving: Migrations and modernization are based on the reduction of
    costs. As the Cloud Provider is the one responsible for keeping the infrastructure,
    it will ensure that only the services that are in use will be paid for. Each Cloud
    Provider offers different prices depending on the region, the service to be used,
    as well as the usage.

    * Availability: Most of the Cloud Providers offer different regions and availability
    zones, but in some specific cases, it can be a decision depending on the use case.

    * Services: In the Cloud competition, most of the providers offer similar services.
    But specific and advanced ones can make a difference when a decision has to be
    taken.

    * Ease to Use: Some Cloud Providers are more user-friendly than others, including
    documentation and the use of the API.

    * Migration: Depending on the services offered On-Premise, Cloud Providers are
    more suitable to perform the migration to a Cloud Service.


    # Advantages'
  merge: -1
  pgno: 500
- img_proc: true
  md: 'The use of a Cloud Provider has several advantages compared to running services
    on an On-Premise infrastructure. The main reasons for a migration to a Cloud are
    the following:


    +   Service Level Agreement (SLA): Most of the Cloud Providers guarantee that
    the services are available 99.99% of the time when different availability zones
    are in use.


    +   Services catalog: In a Cloud Provider, it is possible to run Virtual Machines,
    Containers, and they also have a Load Balancer or a Backup Solution, among hundreds
    of other options, together in the same portal. A cloud provider also enables more
    services immediately.


    +   Infrastructure: The end user is not required to maintain the infrastructure
    anymore, including the physical components (servers, routers, cables, among others)
    and the virtual components (routing, networking, storage, and so on).


    +   Flexibility: It is possible to dynamically change the resources allocated,
    depending on the needs of the services offered.


    +   Scalability: More compute power, more storage, or more services can be added
    manually or automatically on demand.


    +   Accessibility: Cloud Providers offer access to different services through
    the Internet, which allows them to offer a service directly to the end users.


    +   Security: The solutions offered by the Cloud Providers are secure, and they
    offer alternatives to increasing security, such as encryption for the storage,
    private network, and firewall.


    With every solution, there are some problems associated with the use of a Cloud
    Provider, especially a public one. Some of them are the following:


    +   Cost: Even though one of the main reasons for using a Public Cloud is to reduce
    the cost, the wrong planning, bad implementation of workflows can cause the cost
    to run the services, which further increases the cost in a Public Cloud. It is
    important in migration to define the needs, plan the possible costs and monitor
    the usage of the services.


    +   Vendor lock-in: Migration to a Public Cloud means adapting and using the services
    offered by the provider. This can reduce the'
  merge: -1
  pgno: 501
- img_proc: true
  md: 'possibilities in the future of the need to go to another solution more suitable
    for the company.


    +   - **Less control**: Although having the infrastructure managed by the provider
    is an advantage, it can be a disadvantage if you are not able to control the different
    elements involved in a service offered.


    +   - **Support**: The support offered by Cloud Providers cannot meet the needs
    of some companies, especially in the new implementations of the services, as it
    requires more time than desired.


    # Cloud services


    Let us discuss a few cloud services.


    # Amazon Web Services (AWS)


    AWS started to offer its first services in the year 2006. At the moment of writing
    this book, the global infrastructure contains 29 regions, each of them with multiple
    availability zones (AZs) and 93 availability zones. The latest estimation is that
    AWS has a 34% market share of the Cloud Service. Some of the main services offered
    by Amazon Web Services are as follows:


    +   - **Amazon Elastic Compute Cloud (EC2)**: The service to run Virtual Machines
    and the possibility to run Bare Metal nodes on the Cloud.


    +   - EC2 offers most of the Linux Distribution options available in the market,
    including Red Enterprise Linux, Ubuntu, or Debian.


    +   - An Amazon Machine Image (AMI) contains the operating system to be used to
    run the EC2 instance.


    +   - Running an EC2 instance requires to specify a Security Group, which is the
    definition of the Firewall rules.


    +   - It is possible to specify different Storage options depending on the needs
    of the Virtual Machine.


    +   - A **Key Pair** defines an SSH Public Key to access the Instance remotely.


    +   - **Amazon Virtual Private Cloud (VPC)**: Enables a Virtual Network to run
    instances on it. This makes a private and isolated network. As a'
  merge: -1
  pgno: 502
- img_proc: true
  md: 'regular Network, it includes subnets, routing, and IP addresses, among other
    elements.


    +   - An Elastic IP address is a public address to access the EC2 Instance from
    the Internet. This IP can be attached and detached from a running instance.


    +   - Amazon Simple Storage Service (S3): An object storage service offering scalability,
    data availability, security, and performance.


    +   - Amazon Elastic Beanstalk: A service for deploying and scaling Web applications.


    +   - Amazon Relation Database Service (RDS): A service to set up, operate, and
    scale databases in the cloud. The options available are as follows:


    +   - Amazon Aurora with MySQL compatibility.


    +   - Amazon Aurora with PostgreSQL compatibility.


    +   - MySQL, MariaDB, PostgreSQL, Oracle, and SQL Server.


    +   - Amazon DynamoDB: Fast, flexible NoSQL database service for performance at
    any scale.


    +   - Amazon Elastic Container Service (ECS): A fully managed Container orchestration
    service that makes it easy to deploy, manage, and scale containerized applications.


    +   - Amazon Elastic Kubernetes Service (EKS): A service to run Kubernetes in
    the AWS cloud and on-premises data centers.


    +   - Amazon Elastic Load Balancing (ELB): A service to distribute incoming traffic
    across multiple targets.


    +   - Amazon CloudFront: A Content Delivery Network (CDN) service built for high
    performance and security.


    +   - Amazon Route 53: A highly available and scalable Domain Name System (DNS)
    web service.


    +   - Amazon Lambda: A serverless, event-driven compute service that lets codes
    run for virtually any type of application or backend service without provisioning
    or managing servers.


    +   - AWS Identity and Access Management (IAM): Securely manage identities and
    access to AWS services and resources.'
