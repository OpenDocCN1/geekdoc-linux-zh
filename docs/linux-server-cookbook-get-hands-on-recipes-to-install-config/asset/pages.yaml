  md: '+   ○ reserved field: This field is not used currently.


    +   ○ /etc/group: This file defines the groups of the system. It contains the
    following fields separated by colon ("::\")."


    +   ○ group name: The name of the group


    +   ○ password: An "x" indicating the password is stored in file /etc/gshadow
    or empty if password is not needed.


    +   ○ group id (gid): A numerical id.


    +   ○ user list: a list of users separated by comma belonging to this group as
    one of the secondary groups.


    +   ○ /etc/gshadow: This file contains the password for the groups, as well as
    the administrators for the group and the members. This file should be protected
    and only readable by administrators. The fields separated by colon ("::\") are
    as follows:


    +   ○ group name: The name of the group from /etc/gshadow


    +   ○ encrypted password: A password usually automatically filled by the command
    `passwd`


    +   ○ administrators: A comma-separated list of administrator users. These users
    can change the password and the members of the group.


    +   ○ members: A comma-separated list of member users. It should match the list
    from /etc/group.


