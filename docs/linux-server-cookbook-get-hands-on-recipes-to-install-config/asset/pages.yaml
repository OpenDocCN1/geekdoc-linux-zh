- img_proc: true
  md: '# Introduction to IT automation


    IT automation simplifies operations, thereby reducing human intervention and improving
    the speed and agility of the different tasks performed in the infrastructure managed.
    IT automation is not reduced to only operating systems but also to any element
    in the infrastructure that can be configured. Some examples of the elements that
    can be configured using automation are as follows:


    +   - Infrastructure elements: Linux, Windows, Virtualization solutions, and so
    on.

    - Network devices.

    - Security systems.

    - Applications and services.

    - Clouds resources.


    IT automation is not limited to deploy elements but is able to perform all the
    life-cycle needed for the device. This life cycle usually includes provisioning,
    configuration, scale-up and scale-down, and de-provisioning. The advantages of
    using in IT automation are as follows:


    +   - Cost saving: Reducing human intervention entails the professionals to reduce
    the time performing repetitive tasks and the possibility to focus on other tasks.

    - Time-saving: IT Automation reduces time in all the life-cycles parts.

    - Flexibility: Having the infrastructure automated gives the flexibility to manipulate
    the current state infrastructure, as scaling up or down the infrastructure or
    updating an application to a newer version.

    - Reducing error: Human intervention can cause unexpected downtime and miss configurations
    in the infrastructure, which will affect the possibilities of possible issues.

    - Improve security: A good automation implementation reduces the possibility of
    breaches, and it can help to implement automatic fixes to the infrastructure.


    Some important principles when IT automation is used are as follows:'
  merge: -1
  pgno: 357
- img_proc: true
  md: '+   - Make it simple: Automation tasks should solve a specific need and not
    a general one. Complex automation tasks lead to less flexibility and a higher
    probability of needing human intervention.


    +   - Idempotent: Ensures if one system is already configured, running the same
    automation process will not cause any modification and downtime to the system.


    +   - Imperative versus declarative: Imperative model focuses on performing tasks
    to obtain the desired result, and on the other hand, the declarative model defines
    the desired state. For example:


    +   - Imperative machine: Running a command to create a virtual machine with specific
    options.


    +   - Declarative model: Using an automation tool that reads the desired virtual
    machine definition and that it exists and that state is desired. Otherwise, it
    will perform the needed actions to obtain the expected definition.


    +   - Mutable versus immutable: Traditional infrastructures were mutable after
    creation than modern ones. Updating operating system, libraries, and applications
    were a common task for system administrators. Modern systems, especially using
    virtual machines and containers, are more likely to be destroyed and deployed
    with the new versions of the distribution or the application running on it. Modern
    infrastructures are considered as immutable infrastructures.


    +   - Do not repeat yourself: One of the most important principles is to be reuse
    part of the automation definitions. Automation tools allow to create reusable
    part of codes and use it on different projects.


    Inside the IT infrastructure are different categories depending on the purpose
    of the tasks to perform. Automation evolved over the years from simple local tasks
    through multiple managed systems to reach the current status, which includes the
    following:


    +   - Configuration management: This automation ensures the managed devices have
    the proper configuration and applies the modification needed, ensuring that it
    will not cause any interruption. This automation ensures if it detects any issue
    during the new configuration, a possibility to revert the changes will be there.'
  merge: -1
