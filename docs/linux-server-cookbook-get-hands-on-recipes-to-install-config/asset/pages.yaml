    | IEEE 802.1Q Tag Insertion | | | | | | |


    | TID | PCP | CFI | VID |

    |---|---|---|---||

    | 16 | 3 | 1 | 12 |

    | IEEE 802.1Q Tag Format | | | |


    Figure 7.34: Packet fields for an Ethernet card using VLANs


