  md: 'The ansible-playbook commands show the result for the tasks performed in the
    hosts.


    +   - If the task did not modify anything in the system, it will be marked as
    ok.

    - If a task is modified in the system, it is marked as changed.

    - If it was not possible to connect to the system, it will be marked as unreachable.

    - If a task throws an error, it will be marked as failed.

    - If a task was not executed in a host (because of conditions), it will be marked
    as skipped.

    - The value rescued is for the use of error handling, and ignored is used when
    unreachable hosts are marked as ignored.


