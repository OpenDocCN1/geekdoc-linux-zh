    # TFTP introduction


    This simple protocol, Trivial File Transfer Protocol (TFTP), is usually used to
    provide files to a remote node when the system is booting. This protocol is used
    to perform automatic installation in baremetal nodes mainly. It does not have
    a login or access control mechanism, and its normal use is in a private network.
    The protocol used User Datagram Protocol (UDP), and the port is 69.


    This protocol is usually used with the Preboot Execution Environment (PXE), which
    allows systems to boot from the network and load boot media. This boot media can
    be stored in a TFTP server. Modern systems can use iPXE, which allows using an
    HTTP server instead of a TFTP service to store the boot media.


    Figure 10.17 illustrates a PXE/TFTP overview:'
