    # MariaDB client and tasks


    Client to access the MariaDB server is part of the package mariadb-client. The
    command to access to the server is mariadb (or mysql), and table 11.5 shows the
    common options available:


    | Option | Description |

    | --- | --- |

    | -e, --execute=name | Execute the statement and query. |

    | -h, --host=name | Connect to the host specified instead of using a Unix Socket.
    |

    | --max-allowed-packet=num | The maximum packet length to send or receive from
    the server. The default is 16 MB and the maximum 1 GB. Useful when importing big
    files. |

    | -p, --password=[name] | Password to use when connecting to server. |

    | -P, --port=num | Port used for connection instead of 3306. |

    | --print-details | Output a list of the options for the client. |

    | -u, --user=name | User for login if not the current user. |

    | -v, --verbose | Show information. |

    | -V, --version | Output version information and exit. |'
