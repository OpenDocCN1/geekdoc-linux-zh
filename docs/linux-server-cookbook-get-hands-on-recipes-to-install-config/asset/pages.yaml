    Along with the option --publish (-p), the port in the host will be used for the
    redirection, also needed to be specified. Three formats are available, as shown
    in [table 13.1](table 13.1).


    | Format | Description |

    | --- | --- |

    | host_port:container_port | Redirects the port host_port to container_port. All
    IPS available in the server will listen in the host_port. |

    | IP:host_port:port_container | Similar to the previous format, but specifying
    only one IP, which will listen to the port_host. |

    | IP::port_container | In this format, the same port will be used in the container
    and in the host. For example, if the container exposes port 8080, the same port
    will be used in both |


