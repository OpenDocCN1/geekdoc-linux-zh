  md: '| Record Type | Description |

    |---|---|

    | A | Resolves a hostname to an IP |

    | AAAA | Resolves a hostname to an IP, for IPv6. |

    | CNAME | Specifies an alias for a hostname |

    | PTR | Resolves an IP to a hostname |

    | NS | Specifies the name servers for a domain |

    | MX | Specifies the mail servers for a domain or subdomain. |

    | SRV | Specifies host and ports for a specific service. |

    | TXT | Specifies a text record for a hostname. Used for checking the owner of
    the domain and different configurations. |

    | SOA | Stands for “start of authority”, and provides admin information for the
    domain and information about the last update and refreshing times. |


    Table 9.1: DNS record types


    The records A and AAAA use the asterisk (*) to create a wildcard record. For example,
    creating a wildcard record *.dev.example.com pointing to the IP 192.168.122.222,
    the DNS server will resolve all hostnames with that subdomain to IP. In fact,
    the hostname web.dev.example.com or something.dev.example.com resolves to the
    same IP.


