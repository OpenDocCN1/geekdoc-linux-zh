    # Advanced installation steps


    During installation, there are three common advanced installation steps:


    +   Link aggregation: Allows to combine multiple Ethernet interfaces into a single
    logical link to work in parallel in active-passive mode or active-active to sum
    the available throughput. In Linux, the terms used for link aggregation for the
    interfaces are bonding or teaming.'
  merge: -1
  pgno: 46
- img_proc: true
  md: '+   Redundancy for high availability can be configured as a round-robin or
    as an active backup.


    +   To sum up the throughput, a Link Aggregation Control Protocol (LACP, 802.1AX,
    or 802.3ad) is required to be used and configured in the system and in the switches
    where the network interfaces are connected.


    +   Volume Manager: Linux distributions use the LVM tool for volume manager, which
    stands for Logical Volume Management. Using LVM provides flexibility and more
    advanced features than traditional partitioning. Installers usually use to encrypt
    the data disk inside using Linux Unified Key Setup (LUKS).


    +   Data redundancy: Technology to spread the data across several disks having
    multiple copies of the same information stored in more than one place at a time.
    RAID stands for Redundant Array of Independent Disks, which is usually implemented
    at the hardware level. Linux provides the possibility to reconfigure this using
    software. Depending on the required level of redundancy and performance, different
    RAID levels are available where popular ones are as:


    +   RAID-1 or mirror mode: Two or more disks are combined into one volume, and
    all the blocks are copied to all the disks. All the disks except except one can
    fail, and the data would still be accessible.


    +   RAID-5: The most popular and useful RAID mode, this requires three or more
    disks. The data will be distributed between the disks, but they will not be mirrored.
    Even if one disk fails, the data of the failed disk can be recalculated using
    the parity method.


    +   RAID-6: An extension of RAID-5, where many disks are used (requiring to have
    at least four). At this level, two disks can fail, and the data would still be
    accessible.


    Spare disks are an important part of storage redundancy, especially for RAID-5
    and RAID6. These disks are not used to distribute the data, but there are on standby
    to be filled if one of the active disks has failed.


