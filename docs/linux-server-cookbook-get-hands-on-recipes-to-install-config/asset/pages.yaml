  md: '# CHAPTER 7


    # Network Configuration


    # Introduction


    Networking is one of the core parts of enterprises. It involves multiple elements,
    such as servers, switches, routers, and cables. Understanding how the traffic
    flows and the possible configurations in Linux is important to provide a service
    in an efficient way to reduce costs, bottlenecks, and downtimes.


    Linux servers allow simple configurations and advanced ones. This chapter will
    cover how to configure them. Networking in different Linux distributions and advanced
    features such as aggregation, bridges, and Virtual LANs.


    # Structure


    In this chapter, the following topics will be discussed:


    +   * Network introduction

    * Basic network configuration

    * Routing

    * Advanced network configuration


    # Network introduction


    Modern systems depend on networks for most of the tasks, such as installing new
    software, updating the system, or offering services locally or remotely. Linux,
    as the most secure operating system, has different abstraction layers between
    the hardware, Kernel space, and user space. Figure 7.1 features the various Linux
    operating system layers:'
  merge: -1
  pgno: 212
- img_proc: true
  md: '![](img/bcd1b6709d1a6bc46b09b8587284794e_213_0.png)


    As a Linux administrator, it is important to understand the basic concepts of
    Networking, from how the traffic is managed by the physical devices to how the
    data is presented to the end user. The *Open Systems Interconnection Model* (*Open
    Systems Interconnection Model*) describes the universal standard communication.
    This model defines the following seven abstraction layers:


    +   - **Physical layer (Layer 1):** Responsible for the transmission and reception
    of the data in a device, such as an Ethernet device in a system, a cable, or a
    port in a Router.

    - **Data link layer (Layer 2):** Provides data transfer between different nodes.
    For example, a communication between two servers in the same local network.

    - **Network layer (Layer 3):** Transfers data from (or to) one node from a network
    to a different network. This requires a node to route the traffic between different
    Layer 2 (data link).

    - **Transport layer (Layer 4):** Data transmission using protocols, such as UDP
    or TCP.

    - **Session layer (Layer 5):** Maintains and synchronizes connection between two
    nodes.

    - **Presentation layer (Layer 6):** Formats and translates the data to be used,
    such as data encryption/decryption or compression/decompression.

    - **Application layer (Layer 7):** The application where the user interacts.


    **Figure 7.2** illustrates the traffic flow through the different layers in the
    OSI Model:'
  merge: -1
