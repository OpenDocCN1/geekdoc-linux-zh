    # Masquerading


    In Chapter 7, Network Configuration, we learned how to configure a Linux server
    to act as a router. Using IP Forwarding, we can access other networks. That is
    possible only when Network Address Translation (NAT) is not involved. For example,
    this communication is possible in the scenario when the node has the IP 192.168.122.10
    and gateway 192.168.122.1, and the nodes from the network 192.168.122.0/24 use
    the gateway 192.168.122.10 and IP forwarding is enabled.


    If One-to-many Network Address Translation is involved, meaning the connection
    from one network is redirected to another network, then masquerading is required
    to perform that connection. Figure 8.14 illustrates the traffic flow and the IP
    masquerading process:


