    \n# Relax-and-Recover (ReAR)\n\nThis software is an open-source bare metal disaster\
    \ recovery solution. It is easy to install, configure and use for restoring systems.\
    \ This solution generates a copy of the system ready to be used. It supports various\
    \ boot media (ISO, PXE, USB, or eSATA) and a variety of network protocols (nfs,\
    \ cifs, ftp, or http) as well as different Backup strategies (Symantec Netbackup,\
    \ EMC Networker, among others)."
