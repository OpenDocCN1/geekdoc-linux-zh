    **Figure 15.4: Terraform diagram. Source: Terraform**


    Some of the providers officially maintained and supported by HarshiCorp are as
    follows:


    +   - **Amazon Web Services (AWS):** Lifecycle management of AWS resources, Lambda,
    EKS, ECS, VPC, S3, RDS, DynamoDB, and more.

    - **Microsoft Azure:** Lifecycle management of Azure Resource Manager APIs. It
    is maintained by the Azure team at Microsoft and the Terraform team at HashiCorp.

    - **Google Cloud Platform (GCP):** Lifecycle management of GCP resources, including
    Compute Engine, Cloud Storage, Cloud SQL, GKE, Cloud Functions, and more. This
    provider is collaboratively maintained by the Google Terraform Team at Google
    and the Terraform team at HashiCorp.

    - **Kubernetes:** Management of all Kubernetes resources, including Deployments,
