    # Podman


    Podman is an alternative to Docker that is getting popular on Red Hat Linux systems
    and derivatives. The biggest difference between both is that Podman does not use
    a Daemon to run the containers. Each container is executed individually and is
    assigned to an individual systemd configuration. This allows the management of
    each container independently, and furthermore, containers will not be affected
    if the main Daemon is restarted or unexpectedly stopped, something which can happen
    in Docker.


    Installing Podman in a system will replace Docker if it is installed and vice
    versa. Installation can be based on the Linux distribution repository, such as
    using apt or dnf commands. The command associated with Podman is called podman.
    This command has the same syntax as the docker command, with the exception of
    minor differences. The images to be run on containers are the same as those used
    by Docker; these images use the format name Open Container Initiative (OCI). Figure
    13.48 shows the argument run to create a new container.'
