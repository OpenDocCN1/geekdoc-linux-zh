    # Operate with containers


    The argument ps for the command docker will list the Containers running in the
    system. Adding the option -a will display the containers, which are stopped. Figure
    13.6 shows an output example:


    ```

    root@ubuntu:~ docker ps -a

    CONTAINER ID  IMAGE             CREATED           STATUS

    PORTS         NAMES

    1f37b3155cc6 "hello-world" 26 minutes ago Exited (0) 26 minutes ago

    agitated_nightingale

    ```


    > Figure 13.6: Output example for listing containers


    The previous output includes the following columns:


    +   - Container ID: When a container is created, an auto-generated ID is assigned
    to it. The length is 64, but the output shows the first 12 characters.

    - Image: The image used to run the container.

    - Command: The command executed inside of the container.

    - Created: When the container was created.

    - Status: The status of the container; if it was exited, it will indicate when
    it was stopped, and the status (0 indicates the container finished correctly).

    - Ports: Forwards ports to access the service offered by the container. In the
    previous example, no ports were exposed.

    - Names: The name of the container. If a name is not specified during the execution,
    an auto-generated one is assigned.


    An Image has configured a command to be executed when it is referenced by a container.
    Using docker run, it is possible to specify the command to be used instead'
