    The Virtual Machines attached to an *Overlay Network* are not accessible from
    outside of the cluster. To have connectivity to the external world, a *Floating
    IP* in the external network should be created and attached to the *Virtual Machine*.
    The arguments floating ip create is used to create a new **Floating IP** to be
    used later on a *Virtual Machine*. The argument **server add floating ip** is
    used to attach the IP to the *Virtual Machine*. Figure 16.21 shows the process:'
