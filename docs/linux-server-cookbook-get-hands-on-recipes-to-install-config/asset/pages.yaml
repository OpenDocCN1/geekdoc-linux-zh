  md: "The clients access the cluster using the public endpoint, the services use\
    \ the internal endpoint (located in the internal API network), and some administrative\
    \ tasks are performed using the admin endpoint.\n\n# Images\n\nTo run a Virtual\
    \ Machine, it is required to use an image containing the operating system designed.\
    \ The project to upload, manipulate or delete images is called Glance. The popular\
    \ disk formats are as follows:\n\n+   * QCOW2 (QEMU copy-on-write version 2):\
    \ is the main format used with the KVM hypervisor, the one used on OpenStack.\
    \ The size is compressed, can be dynamically resized, and it is possible to run\
    \ several Virtual Machines from a base image as well as only the differences.\n\
    * RAW: This is an unstructured disk image; it contains the full size of the disk.\
    \ This format is needed when Ceph is the backend for the storage.\n* VMDK (Virtual\
    \ Machine Disk): This format is supported by many hypervisors, including VMware\
    \ ESXi.\n* VDI (Virtual Disk Image): Format supported by VirtualBox and QEMU.\n\
