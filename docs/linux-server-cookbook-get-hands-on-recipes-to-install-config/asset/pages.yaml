    # Cloud Providers


    offer an Infrastructure as a Code orchestration system. By writing a definition
    based on the template provided, it is possible to create resources and manage
    them. The biggest advantage is the creation of resources based on the templates,
    and this is automatically managed by the Cloud Provider instead of the tool. The
    orchestration system is also responsible for resolving the dependencies, and in
    case there is a removal request, it will perform it in the correct order. The
    biggest disadvantage is the syntax, which is usually more complex than simply
    using an Automation Tool, and it varies from one Cloud to another. The options
    available for the common providers are as follows:


    +   - AWS CloudFormation: Creating a template that describes all the AWS resources
    wanted (such as Amazon EC2 instances or Amazon RDS DB instances), CloudFormation
    takes care of provisioning and configuring those resources from the definition.

    - Google Cloud Deployment Manager: An infrastructure deployment service that automates
    the creation and management of Google Cloud resources. It also writes flexible
    templates and configuration files and uses them to create deployments that have
    a variety of Google Cloud services.'
