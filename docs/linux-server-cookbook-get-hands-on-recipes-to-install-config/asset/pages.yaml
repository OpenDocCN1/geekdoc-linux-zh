    # # Out of memory management


    When an application is executed in Linux, it reserves memory but usually is not
    all of it. That allows Linux to be able to execute more applications than the
    memory available, expecting that the memory used for the application is going
    to be less than the available. Linux includes a manager to detect when the system
    is using more memory than it should and automatically kills non-critical processes
    using memory.


    Each process has a score associated; a higher score indicates it is more likely
    to be killed. The score for a process is stored on /proc/<pid>/oom_score file.'
