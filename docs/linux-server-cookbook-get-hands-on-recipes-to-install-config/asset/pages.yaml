    # DNS service and clients


    The Domain Name System (DNS) is a service to convert domain names to addresses
    and vice versa. The structure is based on a hierarchy, where the top level contains
    the root nameservers. Currently, these root nameservers are 13 servers geolocated
    in different parts of the word. These servers have the syntax letterrootservers.org,
    where the letter currently is going from the letters a to m. The first query to
    the root nameservers is to obtain the servers for the top-level domain (TLD),
    responsible for the second level domain, such as .com, .net, and .org. These servers
    are associated with the top-level domain, code TLDs (for example, .in, .as, and
    jp), and new TLDs (for example, .tech and .space). These top-level domain servers
    would provide the domain servers for the domain specified. These domains are responsible
    to provide the answer for the domain or subdomain queried. DNS can contain complex
    configurations indicating other nameservers for subdomains. Figure 9.7 shows the
    hierarchy with two domain examples:'
