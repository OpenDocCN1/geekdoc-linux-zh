  md: '# CHAPTER 6


    # Monitoring System Resources


    # Introduction


    This chapter covers how to monitor the system resources in a Linux system. It
    will introduce how the CPU and memory work in modern systems and the common tools
    available to check the status with the objective to do troubleshooting in case
    of issues or overload.


    Other important resources to monitor to avoid downtimes in applications is the
    disk usage and the available space. Different tools will be described to check
    the current status and to detect the physical state of the disks.


    Monitoring the networking became one of the most important tasks in Linux systems,
    especially with the introduction of complex networking in the systems to provide
    connectivity for virtual machines and containers.


    The last part of the chapter focuses on disk quotas and resource limits and helping
    to protect the system when it is accessible by regular users to avoid the resources
    getting exhausted.


    # Structure


    In this chapter, we will discuss the following topics:


    +   * Monitoring CPU resources

    * Monitoring memory resources

    * Monitoring disk usage and available space

    * Monitoring network resources

    * Quotas and limits


    # Monitoring CPU resources


    A Central Processing Unit (CPU), a processor, executes instructions received from
    the system. In modern systems, there are three important concepts that are needed
    to understand, to be able to monitor and interpret the data received from the
    tools:'
  merge: -1
