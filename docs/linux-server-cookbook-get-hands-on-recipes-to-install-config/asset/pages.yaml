  md: 'A Linux service (or sometimes called daemon) is an application or set of applications
    that are running in the background performing some tasks or waiting for some event.
    Some services can execute applications, and when it finishes, the service is stopped.
    An example is a service to configure the network in the system. Other services
    are running constantly, waiting to offer some resource; for example, an SSH service
    is waiting for users to connect and offer the possibility to login to the server.


    Most Linux distributions use the service manager systemd, which is a replacement
    for the historical and popular SysV init daemon. When a Linux distribution is
    booted, the first process executed is systemd, and it will be responsible for
    starting the rest of the services enabled in the system to be booted on.


    Systemd is a full suite of applications to unify the service configuration and
    the behavior across Linux distributions. The main command to manage services is
    systemctl, and the popular actions are described in table 4.26:


    | Action | Description |

    | --- | --- |

    | list-units | List the units (services, mount points, devices, sockets) available
    in the system. |

    | status | Check the status of the specified unit(). |

    | show | Show the properties of the specified unit(). |

    | start | Start the unit(s) specified. |

    | stop | Stop the unit(s) specified. |

    | reload | The unit(s) will reload the configuration. |

    | restart | Stop and start the unit(s) specified. |

    | enable | Enable the unit(s) to be started when the system boots. |

    | disable | Disable the unit(s) specified to not be started when the system boots.
    |


