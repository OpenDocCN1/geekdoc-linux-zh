    # SSH service and SSH client


    The network protocol Secure Shell or Secure Socket Shell (SSH) gives the users
    a secure way to remotely access a Linux system. This system can be in the same
    network, a different network, or accessible through internet. The port used is
    22, and the protocol used is Transmission Control Protocol (TCP). This protocol
    was introduced in 1995 with version 1 (SSH-1); in the year 2006, version 2 (SSH-2)
    was adopted as a standard.


    The most popular implementation of SSH is the suite of utilities OpenSSH. This
    includes the server and client utilities. Other utilities use the protocol SSH
    for different functionalities; the most popular is to copy the file between servers
    using Secure Copy (scp) or rsync. Another popular option is SSH File Transfer
    Protocol (SFTP), an alternative to the File Transfer Protocol (SFTP).


    The SSH service sshd is included in the package openssh-server; the client ssh
    (which usually is installed by default on all Linux distributions) is part of
    the package opens-client (or opens-clients in some distributions). The main configuration
    for the server is /etc/ssh/sshd_config. The following block shows the default
    uncommented options in Ubuntu server system:


    ```

    Include /etc/ssh/sshd_config.conf

    KbdInteractiveAuthentication no

    UsePAM yes

    X11Forwarding yes

    PrintMmot no

    AcceptEnv LANG *

    Subsystem sftp /usr/lib/openssh/sftp-server

    PasswordAuthentication yes

    ```'
