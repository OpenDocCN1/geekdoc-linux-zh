  subexpression-calls\"></a>Subexpression calls\n[](#cb76-4)\n[](#cb76-5)$ awk #####\
  \ add your solution here\n[](#cb76-6)Regular Expressions\n[](#cb76-7)Subexpression\
  \ calls\n```\n\nm) 显示满足以下 `both` 条件的所有行：\n\n* `professor` 不区分大小写匹配\n* `quip` 或 `this`\
