- "# 通过题库学习：GNU AWK\n\n\n\n\n1. 封面\n2. 目录\n\n# 前言\n\n在涉及到命令行文本处理时，从抽象的角度来看，有三大支柱：用于过滤的\
  \ `grep`、用于替换的 `sed` 以及用于字段处理的 `awk`。这些工具也具有一些重叠的功能，例如，这三者都具备强大的过滤能力。\n\n与 `grep`\
  \ 和 `sed` 不同，`awk` 是一门完整的编程语言。然而，本书旨在展示如何从命令行组合成 `awk` 单行命令（one-liners），而不是编写程序文件。\n\
  \n本书极度依赖示例来逐一介绍 `awk` 的选项和功能。建议你手动输入每个示例并进行实验。理解示例输入字符串的本质以及产生的输出至关重要。类比一下，这就像学习骑自行车或开车——无论你读了多少相关书籍或听了多少解释，你都需要大量的练习并推导出自己的结论。如果你觉得复制粘贴更适合你，可以在\
  \ [GitHub 上按章节获取代码片段](https://github.com/learnbyexample/learn_gnuawk/tree/master/code_snippets)。\n\
  \n## 前提条件\n\n* 拥有命令行和 `bash` shell 的工作经验，应熟悉文件重定向、命令管道等概念。\n* 熟悉编程概念，如变量、打印、函数、控制结构、数组等。\n\
  * 了解 `grep` 和 `sed` 的基础将有助于理解 `awk` 的相似功能。\n\n如果你是命令行世界的新手，在开始本书之前，请先查看我整理的 [Linux\
  \ CLI 和 Shell 脚本](https://learnbyexample.github.io/curated_resources/linux_cli_scripting.html)\
  \ 资源。\n\n我的 [命令行文本处理](https://github.com/learnbyexample/Command-line-text-processing)\
  \ 仓库包含关于 `GNU awk` 的章节，该章节经过编辑和重构，形成了本书。\n\n## 规范\n\n* 此处展示的示例已在 `GNU bash` shell\
  \ 和 `GNU awk 5.1.0` 上经过测试，并包含了早期版本不支持的功能。\n* 所示的代码片段是从 `bash` shell 复制粘贴并为了演示目的修改过的。某些命令前带有注释，以提供背景和解释。为了提高可读性增加了空行；速度对比中仅显示\
  \ `real` 时间；对于 `wget` 等命令则跳过了输出。\n* 除非另有说明，所有示例和解释均针对 `ASCII` 字符。\n* 除非特别指定，`awk`\
  \ 指 `GNU awk`，`grep` 指 `GNU grep`，以此此类推。\n* 本书中提供了外部链接以供进一步阅读。不需要立即访问。它们经过了仔细挑选，会对你有帮助，尤其是在重读时。\n\
  * [learn_gnuawk 仓库](https://github.com/learnbyexample/learn_gnuawk) 包含了示例、练习以及与书籍相关的全部代码片段和文件。如果你不熟悉\
  \ `git` 命令，请点击网页上的 `Code` 按钮获取文件。\n\n## 致谢\n\n* [GNU awk documentation](https://www.gnu.org/software/gawk/manual/)\
  \ — 手册和示例。\n* [stackoverflow](https://stackoverflow.com/) 和 [unix.stackexchange](https://unix.stackexchange.com/)\
  \ —— 获取关于 `bash`、`awk` 和其他命令问题的答案。\n* [tex.stackexchange](https://tex.stackexchange.com/)\
  \ —— 获取关于 [pandoc](https://github.com/jgm/pandoc/) 和 `tex` 相关问题的帮助。\n* [LibreOffice\
  \ Draw](https://www.libreoffice.org/discover/draw/) —— 封面图片。\n* [pngquant](https://pngquant.org/)\
  \ 和 [svgcleaner](https://github.com/RazrFalcon/svgcleaner) 用于优化图像。\n* [softwareengineering.stackexchange](https://softwareengineering.stackexchange.com/questions/39/whats-your-favourite-quote-about-programming)\
  \ 和 [skolakoda](https://skolakoda.org/programming-quotes) 用于编程格言。\n* 由 [Amada44](https://commons.wikimedia.org/wiki/User:Amada44)\
  \ 提供的公有领域 [Warning](https://commons.wikimedia.org/wiki/File:Warning_icon.svg) 和\
  \ [信息](https://commons.wikimedia.org/wiki/File:Info_icon_002.svg) 图标。\n* [arifmahmudrana](https://github.com/arifmahmudrana)\
  \ 指出了一个歧义的解释。\n\n特别感谢我所有的朋友和在线伙伴提供的帮助、支持和鼓励，特别是在这些艰难的时刻。\n\n## 反馈与错误\n\n如果你能告诉我你对这本书的感受，我将不胜感激，这将有助于本书以及我未来的尝试。此外，如果你发现任何错误或错别字，请尽管告知。\n\
  \n问题管理器：[`github.com/learnbyexample/learn_gnuawk/issues`](https://github.com/learnbyexample/learn_gnuawk/issues)\n\
  \n电子邮箱：learnlearnbyexample.net@gmail.com\n\nTwitter：[`twitter.com/learn_byexample`](https://twitter.com/learn_byexample)\n\
  \n## 作者信息\n\nSundeep Agarwal 是一位自由培训师、作者和导师。他之前的经历包括在 Analog Devices 工作了 5 年多。你可以找到他的其他作品，主要是书籍\
  \ [命令行基础](https://www.packt.com/product/command-line-fundamentals/p36444)。他还担任过\
  \ [命令行基础](https://www.packt.com/product/command-line-fundamentals/p36444) 的技术评审员。\n\
  \n## 许可证\n\n本作品采用 [Creative Commons 署名-非商业-相同共享 4.0 ](https://creativecommons.org/licenses/by-sa/4.0/)\
  \ 许可。代码片段可在 `https://github.com/learnbyexample/` 获取。\n\n## 书籍版本\n\n查看 [Version_changes.md](https://github.com/learnbyexample/learn_gnuawk)\
  \ 以跟踪更改。\n\n# 安装与文档\n\n`awk` 命令名称源于它的开发者——Alfred V. Aho、Peter J. Weinberger 和 Brian\
  \ W. Kernighan。多年来，它被各种开发者不断适配和修改。详情请参见 [gawk 手册: History](https://www.gnu.org/software/gawk/manual.html#History)。本章将展示如何安装或升级\
  \ `awk`，随后是与文档相关的详细信息。\n\n## 安装\n\n如果你在类 Unix 系统上，你可能已经安装了某个版本的 `awk`。本书主要针对 `GNU\
  \ awk`。由于不同实现之间存在语法和功能的差异，请确保按照此处演示的内容进行。要安装更新或特定版本，请访问 [gnu: software gawk](https://www.gnu.org/software/gawk/)。\n\
  \n```\n## 使用一个目录，例如 ~/Downloads/awk_install 然后执行以下步骤\n$ wget https://ftp.gnu.org/gnu/gawk/gawk-5.1.0.tar.xz\n\
  $ tar -Jxf gawk-5.1.0.tar.xz\n$ cd gawk-5.1.0/\n$ ./configure\n$ make\n$ sudo make\
  \ install\n\n$ type -a awk\nawk is /usr/local/bin/awk\nawk is /usr/bin/awk\n$ awk\
  \ --version | head -n1\nGNU Awk 5.1.0, API: 3.0\n```\n\n\n\n\n> ![info](img/file0.svg)\
  \ 请参阅 [gawk 手册：安装](https://www.gnu.org/software/gawk/manual/html_node/Installation.html)\
  \ 获取高级选项以及在其他平台上安装 `awk` 的说明。\n\n## 文档\n\n知道哪里找到文档总是一个好主意。从命令行，你可以使用 `man awk` 查看简短手册，使用\
  \ `info awk` 查看完整文档。[在线 GNU awk 手册](https://www.gnu.org/software/gawk/manual/) 拥有更好的阅读界面，并提供最完整的文档、示例以及关于其他\
  \ `awk` 版本、POSIX 标准等信息。\n\n以下是 `man awk` 的一个片段：\n\n```\n[](#cb2-1)$ man awk\n[](#cb2-2)GAWK(1)\
  \                        Utility Commands                        GAWK(1) \n[](#cb2-3)\
  \ \n[](#cb2-4)NAME\n[](#cb2-5)       gawk - pattern scanning and processing language\n\
  [](#cb2-6)\n[](#cb2-7)SYNOPSIS\n[](#cb2-8)       gawk [ POSIX or GNU style options\
  \ ] -f program-file [ -- ] file ...\n[](#cb2-9)       gawk [ POSIX or GNU style\
  \ options ] [ -- ] program-text file ...\n[](#cb2-10)\n[](#cb2-11)DESCRIPTION\n\
  [](#cb2-12)       Gawk  is  the  GNU Project's implementation of the AWK programming\
  \ lan‐\n[](#cb2-13) guage.  It conforms to the definition of  the  language  in\
  \  the  POSIX\n[](#cb2-14) 1003.1  Standard.   This version in turn is based on\
  \ the description in\n[](#cb2-15) The AWK Programming Language, by Aho, Kernighan,\
  \ and Weinberger.   Gawk\n[](#cb2-16) provides  the additional features found in\
  \ the current version of Brian\n[](#cb2-17) Kernighan's awk and numerous GNU-specific\
  \ extensions.\n```\n\n## 选项概述\n\n若要快速概述所有可用选项，请在命令行使用 `awk --help`。\n\n```\n[](#cb3-1)$\
  \ awk --help\n[](#cb3-2)Usage: awk [POSIX or GNU style options] -f progfile [--]\
  \ file ...\n[](#cb3-3)Usage: awk [POSIX or GNU style options] [--] 'program' file\
  \ ...\n[](#cb3-4)POSIX options:                  GNU long options: (standard)\n\
  [](#cb3-5)    -f progfile                 --file=progfile\n[](#cb3-6)    -F fs \
  \                      --field-separator=fs\n[](#cb3-7)    -v var=val          \
  \        --assign=var=val\n[](#cb3-8)Short options:                  GNU long options:\
  \ (extensions)\n[](#cb3-9)    -b                          --characters-as-bytes\n\
  [](#cb3-10)    -c                          --traditional\n[](#cb3-11)    -C    \
  \                      --copyright\n[](#cb3-12)    -d[file]                    --dump-variables[=file]\n\
  [](#cb3-13)    -D[file]                    --debug[=file]\n[](#cb3-14)    -e 'program-text'\
  \           --source='program-text'\n[](#cb3-15)    -E file                    \
  \ --exec=file\n[](#cb3-16)    -g                          --gen-pot\n[](#cb3-17)\
  \    -h                          --help\n[](#cb3-18)    -i includefile         \
  \     --include=includefile\n[](#cb3-19)    -l library                  --load=library\n\
  [](#cb3-20)    -L[fatal|invalid|no-ext]    --lint[=fatal|invalid|no-ext]\n[](#cb3-21)\
  \    -M                          --bignum\n[](#cb3-22)    -N                   \
  \       --use-lc-numeric\n[](#cb3-23)    -n                          --non-decimal-data\n\
  [](#cb3-24)    -o[file]                    --pretty-print[=file]\n[](#cb3-25)  \
  \  -O                          --optimize\n[](#cb3-26)    -p[file]             \
  \       --profile[=file]\n[](#cb3-27)    -P                          --posix\n[](#cb3-28)\
  \    -r                          --re-interval\n[](#cb3-29)    -s              \
  \            --no-optimize\n[](#cb3-30)    -S                          --sandbox\n\
  [](#cb3-31)    -t                          --lint-old\n[](#cb3-32)    -V       \
  \                   --version\n```\n\n# awk 介绍\n\n本章将概述 `awk` 语法并提供一些示例，展示你可以使用\
  \ `awk` 解决什么类型的问题。这些功能将在后面的章节中深入介绍，但不要跳过本章。\n\n## 过滤\n\n`awk` 提供了类似于 `grep` 和 `sed`\
  \ 支持的过滤功能，以及它自身的一些巧妙功能。与许多命令行工具一样，`awk` 可以从 `stdin` 和文件接受输入。\n\n```\n[](#cb4-1)$\
  \ # sample stdin data\n[](#cb4-2) # sample stdin data\n```\n\n\n\n\n`sub` 和 `gsub`\
  \ 函数的第一个参数是用于匹配输入内容的正则表达式。第二个参数是替换字符串。字符串字面量在双引号内指定。在上面的示例中，`sub` 和 `gsub` 被用在块内部，因为它们并不是设计用于条件表达式的。块后面的\
  \ `1` 被视为条件表达式，因为它是在块外部使用的。你也可以使用下面展示的变体来获得相同的结果。\n\n*   `awk '{sub(/:/, \"-\")}\
  \ 1'` 等同于 `awk '{sub(/:/, \"-\"); print $0}'`\n*   你也可以用 `print` 代替 `print $0`，因为\
  \ `$0` 是默认字符串。\n\n> ![info](img/file0.svg) 你可能可能会奇怪，既然已经可以用 `awk` 实现相同的结果，为什么还要使用或学习\
  \ `grep` 和 `sed`呢？这取决于你尝试解决的问题。对于简单的行过滤，`grep` 会比 `sed` 或 `awk` 更快，因为 `grep` 针对此类情况进行了优化。同样，对于替换场景，`sed`\
  \ 会比 `awk` 快。此外，并不是所有功能都能在这些工具之间轻松转换。例如，用 `sed` 或 `awk` 编写 `grep -o` 需要更多的代码步骤。只有\
  \ `grep` 提供递归搜索。诸此类推。另请参见 [unix.stackexchange: When to use grep, sed, awk, perl,\
  \ etc.](https://unix.stackexchange.com/q/303044/109046)。\n\n## 字段处理\n\n如前所述，`awk`\
  \ 主要用于基于字段的处理。考虑下面所示的示例输入文件，字段由单个空格字符分隔。\n\n> ![info](img/file0.svg) [learn_gnuawk\
  \ 仓库](https://github.com/learnbyexample/learn_gnuawk/tree/master/example_files)\
  \ 包含了示例中使用的所有文件。\n\n```\n[](#cb8-1)$ cat table.txt\n[](#cb8-2)brown bread mat hair\
  \ 42\n[](#cb8-3)blue cake mug shirt -7\n[](#cb8-4)yellow banana window shoes 3.14\n\
  ```\n\n这里是一些基于特定字段而非整行的示例。默认情况下，`awk` 根据空格分割输入行，字段内容可以通过 `$N` 访问，其中 `N` 是所需的字段编号。特殊变量\
  \ `NF` 会更新为每行输入的字段总数。虽然还有更多细节需要介绍，但目前这些足够继续操作了。\n\n```\n[](#cb9-1)$ # 打印每个输入行的第二个字段\n\
  [](#cb9-2)$ awk '{print $2}' table.txt\n[](#cb9-3)bread\n[](#cb9-4)cake\n[](#cb9-5)banana\n\
  [](#cb9-6)\n[](#cb9-7)$ # 仅当最后一个字段为负数时打印这些行\n[](#cb9-8)$ # 记住默认操作是打印 $0 的内容\n[](#cb9-9)$\
  \ awk '$NF<0' table.txt\n[](#cb9-10)blue cake mug shirt -7\n[](#cb9-11)\n[](#cb9-12)$\
  \ # 仅针对第一个字段将 'b' 改为 'B'\n[](#cb9-13)$ awk '{gsub(/b/, \"B\", $1)} 1' table.txt\n\
  [](#cb9-14)Brown bread mat hair 42\n[](#cb9-15)Blue cake mug shirt -7\n[](#cb9-16)yellow\
  \ banana window shoes 3.14\n```\n\n## awk 一行命令结构\n\n之前章节中的示例使用了几种不同的方法来构建典型的 `awk`\
  \ 一行命令。如果你还没有掌握语法，这个通用结构可能会有所帮助：\n\n`awk 'cond1{action1} cond2{action2} ... condN{actionN}'`\n\
  \n如果未提供条件，则始终会执行动作（action）。在块内部，你可以提供多个用分号隔开的语句。如果未提供动作，那么当条件求值为 `true` 时，默认会打印\
  \ `$0` 变量的内容。当不存在动作时，你可以使用分号来结束一个条件并开始另一个 `condX{actionX}` 片段。\n\n注意，多个块只是语法上的糖。。它有助于在大多数一行命令中避免显式地使用\
  \ `if` 控制结构。下面的代码段展示了使用和不使用 `if` 结构时的等效代码。\n\n```\n[](#cb10-1)$ awk '{\n[](#cb10-2)\
  \ if($NF < 0){\n[](#cb10-3) print $0\n[](#cb10-4) }\n[](#cb10-5) }' table.txt\n\
  [](#cb10-6)blue cake mug shirt -7\n[](#cb10-7)\n[](#cb10-8)$ awk '$NF<0' table.txt\n\
  [](#cb10-9)blue cake mug shirt -7\n```\n\n当你需要在读取输入之前执行某些操作时可以使用 `BEGIN{}` 块，在处理所有输入之后执行某些操作时可以使用\
  \ `END{}` 块。\n\n```\n[](#cb11-1)$ seq 2 | awk 'BEGIN{print \"---\"} 1; END{print\
  \ \"%%%\"}'\n[](#cb11-2)---\n[](#cb11-3)1\n[](#cb11-4)%%%\n```\n\n后续章节会有更多类型。请参见\
  \ [awk 手册：运算符](https://www.gnu.org/software/gawk/manual/gawk.html#Operators) 了解细节。请参见\
  \ [awk 手册：字符串与数字](https://www.gnu.org/software/gawk/manual/gawk.html#Values-Conditions)\
  \ 了解更多。\n\n## 字符串与数字\n\n到目前为止示例使用了字符串和数字。如提到的，`awk` 会尝试将字符串转换为数字。字符串字面量在双引号内。数字可以是整数或浮点数。允许科学计数法。请参见\
  \ [awk 手册：字符串与数字](https://www.gnu.org/software/gawk/manual/gawk.html#Strings-and-Numbers)\
  \ 了解细节。\n\n```\n[](#cb12-1)$ # 等于：awk 'BEGIN{print \"hi\"}'\n[](#cb12-2)hi\n[](#cb12-3)\n\
  ```\n\n你也可以将这些保存在变量中以后使用。\n\n```\n[](#cb13-1)$ # 使用：awk 'BEGIN{a=5}'\n[](#cb13-2)5\n\
  [](#cb13-3)\n```\n\n如果使用了未初始变量，它将作为空字符串。\n\n```\n[](#cb14-1)$ # 示例：awk 'BEGIN{s1=\"\
  con\"; s2=\"cat\"; print s1 s2}'\n[](#cb14-2)concat\n[](#cb14-3)\n```\n\n如果字符串以有效数字开头，它将表现为\
  \ `0`。\n\n```\n[](#cb15-1)$ # 等于：awk 'BEGIN{sum=0}'\n[](#cb15-2)0\n[](#cb15-3)\n\
  ```\n\n## 数组\n\n`awk` 中的数组是关联的，这意味着它们键值对。键可以是数字或字符串，但数字内部会被转换为字符串。它们也可以是多维的。在后续相关章节会有大量的数组示例。请参见\
  \ [gawk 手册：数组](https://www.gnu.org/software/gawk/manual/gawk.html#Arrays) 了解完整的细节和注意事项。\n\
  \n```\n[](#cb16-1)$ # 分配数组并根据字符串键访问元素\n[](#cb16-2)$ awk 'BEGIN{student[\"id\"] =\
  \ 101; student[\"name\"] = \"Joe\";\n[](#cb16-3) print student[\"name\"]}'\n[](#cb16-4)Joe\n\
  [](#cb16-5)\n[](#cb16-6)$ # 检查键是否存在\n[](#cb16-7)$ awk 'BEGIN{student[\"id\"] = 101;\
  \ student[\"name\"] = \"Joe\";\n[](#cb16-8) if(\"id\" in student) print \"Key found\"\
  }'\n[](#cb16-9)Key found\n```\n\n\n\n\n在我刚开始接触 Linux 命令行时，我被 `sed` 和 `awk` 的示例吓住了，甚至没有尝试过学习它们。希望这个更温和的介绍对你有所帮助，并且各种语法魔法已经得到了充分解释。尝试对给定的示例进行实验，例如将字段编号更改为除使用的数字以外数字。保持好奇，例如如果字段编号是负数或浮点数会发生什么。阅读手册。多练习。\n\
  \n下一章专门介绍正则表达式。本章介绍的功能将用于示例中，因此在继续之前，请确保你已经熟悉 `awk` 的语法。而且，请解决下一节中的练习题。\n\n## 练习\n\
  \n> ![info](img/file0.svg) 练习相关文件从 [learn_gnuawk repo 的 exercises 文件夹](https://github.com/learnbyexample/learn_gnuawk/tree/master/exercises)\
  \ 获取。所有练习也已汇总在 [Exercises.md](https://github.com/learnbyexample/learn_gnuawk/blob/master/exercises/Exercises.md)\
  \ 一处。解决方案请参阅 [Exercise_solutions.md](https://github.com/learnbyexample/learn_gnuawk/blob/master/exercises/Exercise_solutions.md)。\n\
  \n**a)** 对于输入文件 `addr.txt`，显示所有包含 `is` 的行。\n\n```\n[](#cb16-1)$ cat addr.txt\n[](#cb16-2)Hello\
  \ World\n[](#cb16-3)How are you\n[](#cb16-4)This game is good\n[](#cb16-5)Today\
  \ is sunny\n[](#cb16-6)12345\n[](#cb16-7)You are funny\n[](#cb16-8)\n[](#cb16-9)$\
  \ awk ##### add your solution here\n[](#cb16-10)This game is good\n[](#cb16-11)Today\
  \ is sunny\n```\n\n**b)** 对于输入文件 `addr.txt`，显示不包含 `y` 的行的第一个字段。此文件空格空格字段分隔符。\n\n\
  ```\n[](#cb17-1)$ awk ##### add your solution here\n[](#cb17-2)Hello\n[](#cb17-3)This\n\
  [](#cb17-4)12345\n```\n\n**c)** 对于输入文件 `addr.txt`，显示所有包含不超过 2 个字段的行。\n\n```\n[](#cb18-1)$\
  \ awk ##### add your solution here\n[](#cb18-2)Hello World\n[](#cb18-3)12345\n```\n\
  \n**d)** 对于输入文件 `addr.txt`，显示第二个字段中包含 `is` 的行。\n\n```\n[](#cb19-1)$ awk ##### add\
  \ your solution here\n[](#cb19-2)Today is sunny\n```\n\n**e)** 对于输入文件 `addr.txt`\
  \ 的每一行，将 `o` 的第一次出现处替换为 `0`。\n\n```\n[](#cb20-1)$ awk ##### add your solution here\n\
  [](#cb20-2)Hell0 World\n[](#cb20-3)H0w are you\n[](#cb20-4)This game is g0od\n[](#cb20-5)T0day\
  \ is sunny\n[](#cb20-6)12345\n[](#cb20-7)Y0u are funny\n```\n\n**f)** 对于输入文件 `table.txt`，计算并显示每行最后一个字段中数字的乘积。此文件空格字段分隔符。\n\
  \n```\n[](#cb21-1)$ cat table.txt\n[](#cb21-2)brown bread mat hair 42\n[](#cb21-3)blue\
  \ cake mug shirt -7\n[](#cb21-4)yellow banana window shoes 3.14\n[](#cb21-5)\n[](#cb21-6)$\
  \ awk ##### add your solution here\n[](#cb21-7)-923.16\n```\n\n**g)** 在给定的 `stdin`\
  \ 数据的所有输入行末尾附加 `.`。\n\n```\n[](#cb22-1)$ printf 'last\\nappend\\nstop\\nttail\\\
  n' | awk ##### add your solution here\n[](#cb22-2)last.\n[](#cb22-3)append.\n[](#cb22-4)stop.\n\
  [](#cb22-5)tail.\n```\n\n## 正则表达式\n\n正则表达式是一种用于文本处理的多功能工具。它可以帮助精确定义匹配标准。为了学习和理解，可以将正则表达式视为一种专门用于文本处理的微型编程语言。正则表达式的某些部分可以保存以备后用，类似于变量和函数。有方法执行\
  \ AND（与）、OR（或）、NOT（非）条件，以及简洁定义重复的特征以避免手动复制等。\n\n这里是一些常见用例：\n\n*   清理字符串以确保符合一组已知的规则。例如，检查给定字符串是否符合密码规则。\n\
  *   在抽象层上过滤或提取部分，如字母、数字、标点符号等。\n*   限定的字符串替换。例如，在字符串的开头或结尾，根据周围文本仅替换整个单词等。\n\n本章将涵盖\
  \ `awk` 中实现的正则表达式。`awk` 的大多数正则表达式语法与 `grep -E` Find 的扩展正则表达式 (ERE) 相似。\n\n> ![info](img/file0.svg)\
  \ 练习相关文件从 [learn_gnuawk repo 的 exercises 文件夹](https://github.com/learnbyexample/learn_gnuawk/tree/master/exercises)\
  \ 获取。所有练习也已汇总在 [Exercises.md](https://github.com/learnbyexample/learn_gnuawk/blob/master/exercises/Exercises.md)\
  \ 一处。解决方案请参阅 [Exercise_solutions.md](https://github.com/learnbyexample/learn_gnuawk/blob/master/exercises/Exercise_solutions.md)。\n\
  \n### 语法与变量\n\n如前章所示，`string /regexp/` 检查字符串是否满足正则表达式。`string !~ /regexp/` 反转条件。你也可以将正则表达式保存在变量中。\n\
  \n```\nr = \"ed\"\nif ($0 ~ r) { print \"found\" }\n```\n\n### 字符串锚点\n\n在之前的示例中，`awk`\
  \ 在任何地方匹配。除非另有说明，否则转义字符。这些具有特殊含义的字符被称为元字符。\n\n有两个字符串锚点：\n\n*   `^` 元字符将匹配限制在字符串的开头。\n\
  *   `$` 元字符将匹配限制在字符串的结尾。\n\n```\n[](#cb24-1)$ cat addr.txt\n[](#cb24-2)Hello World\n\
  [](#cb24-3)How are you\n[](#cb24-4)This game is good\n[](#cb24-5)Today is sunny\n\
  [](#cb24-6)12345\n[](#cb24-7)You are funny\n[](#cb24-8)\n[](#cb24-9)$ awk #####\
  \ add your solution here\n[](#cb24-10)This game is good\n[](#cb24-11)Today is sunny\n\
  ```\n\n\n\n\n使用 `\\<` 表示单词起始锚点，使用 `\\>` 表示单词结束锚点。作为替代方案，你可以使用 `\\y` 同时表示单词的起始和结束锚点。\n\
  \n> ![info](img/file0.svg) 通常 `\\b` 用于表示单词锚点（例如在 `grep`、`sed`、`perl` 等中），但在 `awk`\
  \ 中，转义序列 `\\b` 指的是退格字符。\n\n```\ncat word_anchors.txt\nsub par\nspar\napparent effort\n\
  two spare computers\ncart part tart mart\n$ # 以 'par' 开头的单词\n$ awk '/\\<par/' word_anchors.txt\n\
  sub par\ncart part tart mart\n$ # 以 'par' 结尾的单词\n$ awk '/par\\>/' word_anchors.txt\n\
  sub par\nspar\n$ # 仅匹配整个单词 'par'\n$ # 注意只有替换成功的行会被打印\n$ # 因为 sub/gsub 的返回值是替换的次数\n\
  $ awk 'gsub(/\\<par\\>/, \"***\")' word_anchors.txt\nsub ***\n```\n\n> ![warning](img/file1.svg)\
  \ 另参 单词边界差异 。\n\n`\\y` 也有反向操作。`\\B` 匹配单词锚点匹配以外的位置。\n\n```\n# 如果 'par' 被单词字符包围，则匹配它\n\
  $ awk '/\\Bpar\\B/' word_anchors.txt\napparent effort\ntwo spare computers\n$ #\
  \ 匹配 'par' 但不是作为单词起始\n$ awk '/\\Bpar/' word_anchors.txt\nspar\napparent effort\n\
  two spare computers\n$ # 匹配 'par' 但不是作为单词结束\n$ awk '/par\\B/' word_anchors.txt\n\
  apparent effort\ntwo spare computers\ncart part tart mart\n```\n\n这是一个将单词边界本身作为模式使用的示例。它也清晰地展示了\
  \ `\\y` 和 `\\B` 的相反功能。\n\n```\necho 'copper' | awk '{gsub(/\\y/, \":\")} 1'\n:copper:\n\
  $ echo 'copper' | awk '{gsub(/\\B/, \":\")} 1'\nc:o:p:p:e:r\n```\n\n> ![warning](img/file1.svg)\
  \ 否定逻辑在许多文本处理场景中非常有用。但请谨慎使用，否则你可能会匹配到你无意的内容。\n\n## 组合条件\n\n在查看下一个正则表达式特性之前，最好注意，有时使用逻辑运算符比用正则表达式完成所有工作更易于阅读和维护。\n\
  \n```\n# 字符串以 'b' 开头但不包含 'at'\n$ awk '/^b/ && !/at/' table.txt\nblue cake mug shirt\
  \ -7\n$ # 如果第一个字段包含 'low' 或者最后一个字段小于 0\n$ awk '$1 ~ /low/ || $NF<0' table.txt\n\
  blue cake mug shirt -7\nyellow banana window shoes 3.14\n```\n\n## 分支 (Alternation)\n\
  \n很多时候，你想要搜索多个术语。在条件表达式中，你可以使用逻辑运算符组合多个条件。在正则表达式中，元字符 `|` 类似于逻辑或。如果由 `|` 分隔的表达式中有任何一个满足条件，正则表达式将匹配。这些表达式也可以拥有自己独立的锚点。\n\
  \n分支 类似于在两个正则表达式之间使用 `||` 运算符。使用单个正则表达式有助于编写更简洁的代码，且在需要替换时无法使用 `||`。\n\n```\n# 匹配整个单词\
  \ 'par' 或以 's' 结尾的字符串\n## 等同于：awk '/\\<par\\>/ || /s$/\n$ awk '/\\<par\\>|s$/' word_anchors.txt\n\
  sub par\ntwo spare computers\n$ 将 'cat' 或 'dog' 或 'fox' 替换为 '--'\n$ echo 'cats dog\
  \ parrot foxed' | awk '{gsub(/cat|dog|fox/, \"--\")} 1'\n```\n\n使用分支时存在一些复杂的情况。如果它用于过滤行，则没有歧义。但对于替换等用例，取决于几个因素。例如，你想替换\
  \ `are` 或 `spared` —— 哪一个获得优先级？是更大的单词 `spared`，还是它内部的子字符串 `are`，或者基于其他什么？在输入中最早匹配的分支获得优先级。\n\
  \n```\n## 注意这里使用了 'sub'，所以第一个匹配的项会被替换\n$ echo 'cats dog parrot foxed' | awk '{sub(/bee|parrot/,\
  \ \"--\")} 1'\ncats dog parrot foxed\n$ echo 'cats dog parrot foxed' | awk '{sub(/parrot|at/,\
  \ \"--\")} 1'\n```\n\n在匹配从相同位置开始的情况下，对于 `spar` 和 `spared`，最长部分获得优先级。与其他正则表达式实现不同，分支的从左到右优先级仅在匹配长度相同时才起作用。请参\
  \ 最长匹配获胜 和 反引用 以了解更多示例。\n\n```\necho 'spared party parent' | awk '{sub(/spa|spared/,\
  \ \"--\")} 1'\nparty parent\n$ echo 'spared party parent' | awk '{sub(/spared|spa/,\
  \ \"--\")} 1'\nparty parent\n## 其他实现如 'perl' 具有从左到右的优先级\n$ echo 'spared party parent'\
  \ | perl -pe 's/spa|spared/'\n```\n\n## 分组\n\n通常，正则表达式之间有一些共同点。可能是共同字符，也可能是锚点之类的限定符。在这种情况下，你可以使用一对元字符对它们进行分组。类似于数学中的\
  \ `a(b+c)`d`，在正则表达式中得到 `a(b|c)d`。\n\n```\n### 无分组\n$ printf 'red\\nreform\\nread\\\
  narrest\\n' | awk '/reform|rest/'\nreform\n### 有分组\n$ printf 'red\\nreform\\nread\\\
  narrest\\n' | awk '/re(form|st)/'\narrest\n### 无分组\n$ printf 'sub par\\nspare\\\
  npart time\\n' | awk '/\\<par>|\\<part>/'\nsub par\npart time\n### 提取共同锚点\n$ printf\
  \ 'sub par\\nspare\\npart time\\n' | awk '/\\<par|t)>\\'\nsub par\npart time\n#\
  \ 也提取共同字符\n# 你以后将学习一种更好的技术，而不是使用空分支\n$ awk '/\\<par(|t)>\\'\nsub par\npart time\n\
  ```\n\n## 匹配元字符\n\n你已经看到了一些有助于组合正则表达式的元字符和转义序列。要字面匹配这些元字符（即移除它们的特殊含义），在这些字符前加上 `\\\
  ` 字符。要表示字面量 `\\` 字符，请使用 `\\\\`。\n\n与 `grep` 和 `sed` 不同，字符串锚点必须始终转义才能字面匹配，因为 `awk`\
  \ 中没有 BRE 模式。当它们不在惯常的位置时，它们不会失去其特殊含义。\n\n```\n### awk '/b²/' 将不起作用，即使 ^ 没有被作锚点\n\
  ### 如果使用 BRE 语法，b² 对于 grep 和 sed 都是有效的\n$ echo 'a² + b² - C*3' | awk '/b\\²/'\n\
  a² + b² - C*3\n### 注意 ')' 不需要转义\n$ echo '(a*b) + c' | awk '{gsub(/\\(|)/, \"\")}\
  \ 1'\na*b + c\n$ echo '\\learn\\by\\example' | awk '{gsub(/\\\\/, \"/\")} 1'\n/learn/by/example\n\
  ```\n\n> ![info](img/file0.svg) 反引用 将在替换部分讨论如何处理元字符。\n\n## 使用字符串字面量作为正则\n\n\n\n\n\
  \n`sub` 和 `gsub` 函数的第一个参数也可以是字符串，`awk` 会处理将其转换为正则表达式。这有几个优点。例如，如果你在搜索模式中有许多 `/`\
  \ 字符，那么使用字符串而不是正则表达式可能会更简单。\n\n```\n[](#cb35-1)$ p='/home/learnbyexample/reports'\n\
  [](#cb35-2)$ echo \"$p\" | awk '{sub(/\\/home\\/learnbyexample\\//, \"~/\")} 1'\n\
  [](#cb35-3)~/reports\n[](#cb35-4)$ echo \"$p\" | awk '{sub(\"/home/learnbyexample/\"\
  , \"~/\")} 1'\n[](#cb35-5)~/reports\n[](#cb35-6)\n[](#cb35-7)$ # 使用行匹配而非替换的示例\n\
  [](#cb35-8)$ printf '/foo/bar/1\\n/foo/baz/1\\n' | awk '/\\/foo\\/bar\\//'\n[](#cb35-9)/foo/bar/1\n\
  [](#cb35-10)$ printf '/foo/bar/1\\n/foo/baz/1\\n' | awk '$0 ~ \"/foo/bar/\"'\n[](#cb35-11)/foo/bar/1\n\
  ```\n\n在上面的示例中，直接提供了字符串字面量。但也可以使用任何其他表达式或变量，相关的示例将在本章的稍后部分显示。不总是使用字符串作为第一个参数的原因是\
  \ `\\` 字符的特殊含义会产生冲突。例如：\n\n```\n[](#cb36-1)$ awk 'gsub(\"\\<par\\>\", \"X\")' word_anchors.txt\n\
  [](#cb36-2)awk: cmd. line:1: warning: escape sequence `\\<' treated as plain `<`\n\
  [](#cb36-3)awk: cmd. line:1: warning: escape sequence `\\>` treated as plain `>`\n\
  [](#cb36-4)\n[](#cb36-5)$ # 你需要用 \\\\ 来表示 \\\n[](#cb36-6)$ awk 'gsub(\"\\\\<par\\\
  \\>\", \"X\")' word_anchors.txt\n[](#cb36-7)sub X\n[](#cb36-8)$ # 使用正则表达式字面量更易读\n\
  [](#cb36-9)$ awk 'gsub(/\\<par\\>/, \"X\")' word_anchors.txt\n[](#cb36-10)sub X\n\
  [](#cb36-11)\n[](#cb36-12)$ # 另一个示例\n[](#cb36-13)$ echo '\\learn\\by\\example' |\
  \ awk '{gsub(\"\\\\\\\\\", \"/\")} 1'\n[](#cb36-14)/learn/by/example\n[](#cb36-15)$\
  \ echo '\\learn\\by\\example' | awk '{gsub(/\\\\/, \"/\")} 1'\n[](#cb36-16)/learn/by/example\n\
  ```\n\n> ![info](img/file0.svg) 查看 [gawk 手册：详细细节](https://www.gnu.org/software/gawk/manual/gawk.html#Gory-Details)\
  \ 获取比你需要的更多的信息。\n\n## 点元字符 `.`\n\n点元字符用作占位符来匹配任何字符（包括换行符）。稍后你将学习如何为有限字符集定义自定义的占位符。\n\
  \n```\n[](#cb37-1)$ # 以 'c' 开始以 't' 结尾的 3 字符序列\n[](#cb37-2)$ echo 'tac tin cot abc:tyz\
  \ excited' | awk '{gsub(/c.t/, \"-\")} 1'\n[](#cb37-3)ta-in - ab-yz ex-ed\n[](#cb37-4)\n\
  [](#cb37-5)$ # 任意字符后跟 3 再跟任意字符\n[](#cb37-6)$ printf '4\\t35x\\n' | awk '{gsub(/.3./,\
  \ \"\")} 1'\n[](#cb37-7)4x\n[](#cb37-8)\n[](#cb37-9)$ # 'c' 后跟任意字符再跟 'x'\n[](#cb37-10)$\
  \ awk 'BEGIN{s=\"abc\\nxyz\"; sub(/c.x/, \" \", s); print s}'\n[](#cb37-11)ab yz\n\
  ```\n\n## 量化符\n\n作为类比，或（alternation）提供了逻辑或（OR）。结合点元字符 `.` 和量化符（如果需要还有或）为执行逻辑与（AND）铺了道路。例如，检查字符串是否匹配两个之间带有任意字符的模式。量化符可以应用于字符和分组。除了指定精确数量和边界范围外，它们还可以匹配无边界的变化数量。\n\
  \n首先是 `?` 元字符，它将字符或分组量化为匹配 `0` 次或 `1` 次。这有助于定义可选模式，并在某些情况下与分组相比可以构建出更简洁的模式。\n\n\
  ```\n[](#cb38-1)$ # 等同于：awk '{gsub(/\\<(fe.d|fed)\\>/, \"X\")} 1'\n[](#cb38-2)$\
  \ echo 'fed fold fe:d feeder' | awk '{gsub(/\\<fe.?d\\>/, \"X\")} 1'\n[](#cb38-3)X\
  \ fold X feeder\n[](#cb38-4)\n[](#cb38-5)$ # 等同于：awk '/<par(|t)>'\n[](#cb38-6)$\
  \ printf 'sub par\\nare\\npart' | awk '/<part>/'\n[](#cb38-7)sub par\n[](#cb38-8)$\
  \ # 等同于：awk '{gsub(/part|parrot/, \"X\")} 1'\n[](#cb38-9)$ echo 'par part' | awk\
  \ '{gsub(/par(ro)?t/, \"X\")} 1'\n[](#cb38-10)par X\n[](#cb38-11)$ # 等同于：awk '{gsub(/part|parent/,\
  \ \"X\")} 1'\n[](#cb38-12)$ echo 'par part' | awk '{gsub(/par(en|ro)?t/, \"X\")}\
  \ 1'\n[](#cb38-13)par X\n[](#cb38-14)$ # 替换\n[](#cb38-15)\n[](#cb38-16)$ echo 'blah\
  \ bar' | awk '{gsub(/<?, \"<\")}'\n[](#cb38-19)\n```\n\n`*` 元字符将字符或分组量化为匹配 `0` 次或更多。没有上界，细节稍后讨论。\n\
  \n```\n[](#cb39-1)$ # 'f' 后跟 0 次或多次 'e'\n[](#cb39-2)$ echo 'fd fod:d' | awk '{gsub(/fe*/,\
  \ \"X\")} 1'\n[](#cb39-3)X fod:d\n[](#cb39-4)\n[](#cb39-5)$ # 'f' 后跟 0 次或多次 'e'\n\
  [](#cb39-6)$ echo '311111111251142' | awk '{gsub(/1*2/, \"-\")} 1'\n```\n注：此处为示例。\n\
  \n`+` 元字符将字符或分组量化为匹配 `1` 次或更多。与 `*` 量化符类似，没有上界。\n\n```\n[](#cb40-1)$ # 'f' 后跟 1\
  \ 次或多次 'e'\n[](#cb40-2)$ echo 'fd fod:d' | awk '{gsub(/fe+d/, \"X\")} 1'\n[](#cb40-3)X\
  \ fod:d\n[](#cb40-4)$ # 'f' 后跟 1 次或多次 'e' 或 'o' 或 ':' 后跟 'd'\n[](#cb40-5)$ echo\
  \ 'fd fod:d' | awk '{gsub(/f(e|o|)+d/, \"X\")} 1'\n[](#cb40-6)fd X X\n[](#cb40-8)$\
  \ # 'f' 后跟 1 次或多次 '1' 然后是可选的 '4' 最后是 '2'\n[](#cb40-9)$ echo '311111111251142' |\
  \ awk '{gsub(/1+?2/, \"-\")} 1'\n```\n\n你可以使用 `{}` 元字符指定整数范围，包括有边界和无边界的。使用此量化符有四种方式，如下所示：\n\
  \n| 模式 | 描述 |\n| --- | --- |\n| `{m,n}` | 匹配 `m` 到 `n` 次 |\n| `{m,}` | 至少匹配 `m`\
  \ 次 |\n| `{,n}` | 最多匹配 `n` 次（包括 `0` 次） |\n| `{n}` | 精确匹配 `n` 次 |\n\n```\n[](#cb41-1)$\
  \ # 注意 {} 内部不允许空格\n[](#cb41-2)$ echo 'ac abc abbc abbbc abbbbbbc' | awk '{gsub(/ab{1,4}c/,\
  \ \"X\")} 1'\n[](#cb41-3)ac X X X abbbbbbc\n[](#cb41-4)\n[](#cb41-5)$ echo 'ac abc\
  \ abbc abbbc abbbbbbc' | awk '{gsub(/ab{3,,}c/, \"X\")} 1'\n[](#cb41-6)ac abc abbc\
  \ X X\n[](#cb41-7)\n[](#cb41-8)$ echo 'ac abc abbc abbbc abbbbbbc' | awk '{gsub(/ab{,2}c/,\
  \ \"X\")} 1'\n[](#cb41-9)X X X abbbbbbbbc\n[](#cb41-10)\n[](#cb41-11)$ echo 'ac\
  \ abc abbc abbbc abbbbbbc' | awk '{gsub(/ab{3}c/, \"X\")} 1'\n[](#cb41-12)ac abc\
  \ abbc X abbbbbbc\n```\n\n> ![info](img/file0.svg) `{}` 元字符必须转义才能匹配其字面量。与 `()` 元字符类似，单独转义\
  \ `{` 即可。\n\n接下来是如何使用点元字符和量化符构建条件逻辑与。\n\n```\n[](#cb42-1)$ # 匹配 'Error' 后跟零或多个字符，再跟\
  \ 'valid'\n[](#cb42-2)$ echo 'Error: not a valid input' | awk '/Error.*valid/'\n\
  [](#cb42-3)Error: not a valid input\n```\n\n为了允许任意顺序匹配，你还需要引入或（alternation）。但是，对于超过\
  \ 3 个模式的情况，组合将变得难以编写和维护。\n\n```\n[](#cb43-1)$ # 'cat' 后跟 'dog' 或 'dog' 后跟 'cat'\n\
  [](#cb43-2)$ echo 'two cats and a dog' | awk '{gsub(/cat.*dog|dog.*cat/, \"pets\"\
  )} 1'\n[](#cb43-3)two pets\n[](#cb43-4)$ echo 'two dogs and a cat' | awk '{gsub(/cat.*dog|dog.*cat/,\
  \ \"pets\")} 1'\n[](#cb43-5)two pets\n```\n\n## 最长匹配获胜\n\n你已经看到一个或的示例，当两个备选方案从相同位置开始时，会选择最长的匹配部分。例如\
  \ `spar|spared` 将导致选择 `spared` 而不是 `spar`。当从相同起始位置有两个或多个匹配可能时，情况同样适用。例如，如果匹配的字符串是\
  \ `foot`，`f.?o` 将匹配 `foo` 而不是 `fo`。\n\n\n\n\n\n```\n[](#cb44-1)$ # 在 'foo' 和 'fo'\
  \ 之间最长匹配获胜\n[](#cb44-2)$ echo 'foot' | awk '{sub(/f.?o/, \"X\")} 1'\n[](#cb44-3)Xt\n\
  [](#cb44-4)$ # 这里将匹配所有内容\n[](#cb44-5)$ echo 'car bat cod map scat dot abacus' |\
  \ awk '{sub(/.*/, \"X\")} 1'\n[](#cb44-6)X\n[](#cb44-7)\n[](#cb44-8)$ # 当 (1|2|3)+\
  \ 只匹配到 '1233' 时，会发生最长匹配\n[](#cb44-9)$ # 这样 '12baz' 也能匹配\n[](#cb44-10)$ echo 'foo123312baz'\
  \ | awk '{sub(/o(1|2|3)+(12baz)?/, \"X\")} 1'\n[](#cb44-11)foX\n[](#cb44-12)$ #\
  \ 在 'perl' 等其他实现中，情况并非如此\n[](#cb44-13)$ # 量化尽可能匹配，但优先级是从左到右\n[](#cb44-14)$ echo\
  \ 'foo123312baz' | perl -pe 's/o(1|2|3)+(12baz)?/X/'\n[](#cb44-15)foXbaz\n```\n\n\
  在确定最长匹配时，还会考虑整个正则表达式的匹配。这就是 `Error.*valid` 示例能够工作的原理。如果 `.*` 消耗了 `Error` 之后的所有字符，那么就没有更多的字符可以尝试匹配\
  \ `valid` 了。因此，在匹配 `.*` 的数量字符中，将选择满足整个正则表达式的最长部分。类似于 `a.*b` 的表达式将从输入字符串中的第一个 `a`\
  \ 匹配到最后一个 `b`。在其他实现（如 `perl`）中，这是通过一个名为“回溯”（backtracking）的过程实现的。这两种方法各有优劣，并且在某些情况下，正则表达式会导致指数级的时间消耗。\n\
  \n```\n[](#cb45-1)$ # 从行首到行末最后一个 'm'\n[](#cb45-2)$ echo 'car bat cod map scat dot\
  \ abacus' | awk '{sub(/.*m/, \"-\")} 1'\n[](#cb45-3)-ap scat dot abacus\n[](#cb45-4)\n\
  [](#cb45-5)$ # 从行内第一个 'b' 到行末最后一个 't'\n[](#cb45-6)$ echo 'car bat cod map scat dot\
  \ abacus' | awk '{sub(/b.*t/, \"-\")} 1'\n[](#cb45-7)car - abacus\n[](#cb45-8)\n\
  [](#cb45-9)$ # 从行内第一个 'b' 到行末最后一个 'at'\n[](#cb45-10)$ echo 'car bat cod map scat\
  \ dot abacus' | awk '{sub(/b.*at/, \"-\")} 1'\n[](#cb45-11)car - dot abacus\n[](#cb45-12)\n\
  [](#cb45-13)$ # 这里 'm*' 将匹配 0 次 'm'，因为这产生了最长匹配\n[](#cb45-14)$ echo 'car bat cod\
  \ map scat dot abacus' | awk '{sub(/a.*m*/, \"-\")} 1'\n[](#cb45-15)c-\n```\n\n\
  ## 字符类\n\n为了为的字符集创建自定义占位符，可以将它们封装在 `[]` 元字符内部。这类似于在分组内部使用单字符交替，但增加了灵活性和功能。字符类有它们自己的元字符版本，并为常见用例提供了特殊的预定义集合。量化也适用于字符类。\n\
  \n```\n[](#cb46-1)$ # 等同于：awk '/cot|cut/' 和 awk '/c(o|u)t/'\n[](#cb46-2)$ printf\
  \ 'cute\\ncat\\ncot\\ncoat\\ncost\\nscuttle\\n' | awk '/c[ou]t/'\n[](#cb46-3)cute\n\
  [](#cb46-4)cot\n[](#cb46-5)scuttle\n[](#cb46-6)\n[](#cb46-7)$ # 等同于：awk '/.(a|e|o)+t/'\n\
  [](#cb46-8)$ printf 'meeting\\ncute\\nboat\\nat\\nfoot\\n' | awk '/.[aeo]+t/'\n\
  [](#cb46-9)meeting\n[](#cb46-10)boat\n[](#cb46-11)foot\n[](#cb46-12)\n[](#cb46-13)$\
  \ # 等同于：awk '{gsub(/\\<(s|o|t)(o|n)\\>/, \"X\")} 1'\n[](#cb46-14)$ echo 'no so in\
  \ to do on' | awk '{gsub(/\\<[sot][on]\\>/, \"X\")} 1'\n[](#cb46-15)no X in X do\
  \ X\n[](#cb46-16)\n[](#cb46-17)$ # 由字母 'o' 和 'n' 组成的字符串，长度至少为 2\n[](#cb46-18)$ #\
  \ /usr/share/dict/words 包含字典单词，每行一个单词\n[](#cb46-19)$ awk '/^[on]{2,}$/' /usr/share/dict/words\n\
  [](#cb46-20)no\n[](#cb46-21)non\n[](#cb46-22)noon\n[](#cb46-23)on\n```\n\n字符类有它们自己的元字符来简洁地定义集合。字符类外的\
  \ `^`、`$` 等元字符没有特殊含义，或者在字符类内部的含义完全不同。\n\n首先，`-` 元字符有助于定义字符范围，而不是逐个指定它们。\n\n```\n\
  [](#cb47-1)$ # 等同于：awk '{gsub(/[0123456789]+, \"-\")} 1'\n[](#cb47-2)$ echo 'Sample123string42with77numbers'\
  \ | awk '{gsub(/[0-9]+, \"-\")} 1'\n[](#cb47-3)Sample-string-numbers\n[](#cb47-4)$\
  \ # 由小写字母和数字组成的单词\n[](#cb47-5)$ echo 'coat food12 best' | awk '{gsub(/[a-z0-9]+,\
  \ \"X\")} 1'\n[](#cb47-6)X\n[](#cb47-7)$ # 由小写字母 'p' 到 'z' 组成的单词\n[](#cb47-8)$ echo\
  \ 'road post' | awk '{gsub(/[p-z][a-z]*, \"X\")} 1'\n[](#cb47-9)X\n```\n\n字符类也可以用于构建数值范围。然而，很容易漏掉边界情况，且某些范围的设计非常复杂。参见[正则表达式：范围](https://www.regular-expressions.info/ranges.html)。\n\
  \n```\n[](#cb48-1)$ # 10 到 29 之间的数字\n[](#cb48-2)$ echo '23 54 34' | awk '{gsub(/[12][0-9],\
  \ \"X\")} 1'\n[](#cb48-3)X\n[](#cb48-4)\n[](#cb48-5)$ # 带有前零的 >= 100 的数字\n[](#cb48-6)$\
  \ echo '0501 12 26 9823' | awk '{gsub(/0*[0-9]{3,}, \"X\")} 1'\n[](#cb48-7)X\n```\n\
  \n下一个元字符是 `^`，它必须作为第一个字符类指定。它否定该集合，因此除指定的字符以外的所有字符都会匹配。小心处理否定逻辑，可能会得到超出结果。\n\n```\n\
  [](#cb49-1)$ # 替换所有非数字\n[](#cb49-2)$ echo 'Sample123string42with77numbers' | awk\
  \ '{gsub(/[⁰-9]+, \"-\")} 1'\n[](#cb49-3)-123-\n[](#cb49-4)$ # 根据分隔符删除两列\n[](#cb49-5)$\
  \ echo 'foo:123:baz' | awk '{sub(/(::){2}$/, \"\") 1'\n[](#cb49-6)foo:123\n[](#cb49-7)$\
  \ # 被唯一字符围的字符序列\n[](#cb49-8)$ echo 'I like \"mango\" and \"guava\"' | awk '{gsub(/\"\
  \"]+, \"X\")} 1'\n[](#cb49-9)I like X\n[](#cb49-10)$ # 有时正向定义集合比否定更简单\n[](#cb49-11)$\
  \ # 等同于：awk '/^aeiou]*$/'\n[](#cb49-12)$ printf 'try\\nfun\\ngly\\npity\\n' | awk\
  \ '!/[aeiou]/'\n[](#cb49-13)try\n[](#cb49-14)\n```\n\n常用的字符集有预定义的转义序列：\n\n- `\\\
  w` 匹配所有`单词`字符 `[a-zA-Z0-9_]`（回顾单词描述）\n- `\\W` 匹配所有非单词字符（回顾之前的对立性，如 `\\y` 和 `\\B`）\n\
  - `\\s` 匹配所有`空白`字符：制表符、换行符、垂直制表符、分页、回车和空格\n- `\\S` 匹配所有非空白字符\n\n```\n[](#cb50-1)$\
  \ # 匹配所有非单词字符\n[](#cb50-2)$ echo 'load;err_msg--ant,r2..not' | awk '{gsub(/\\W+/,\
  \ \"-\")} 1'\n[](#cb50-3)load-err_msg-ant-r2-not\n[](#cb50-4)\n[](#cb50-5)$ # 将所有空白序列替换为单个空格\n\
  [](#cb50-6)$ printf 'hi  \\v\\f  there.\\thave   \\ra nice\\t\\tday\\n' | awk '{gsub(/\\\
  s+/, \" \")} 1'\n[](#cb50-7)hi there. have a nice day\n```\n\n这些转义序列*不能*在字符类内部使用。\n\
  \n```\n[](#cb51-1)$ # \\w 在字符类中将简单匹配 w\n[](#cb51-2)$ echo 'w=y\\x+3' | awk '{gsub(/[\\\
  w=], \"\") 1'\n[](#cb51-3)y\\x+3\n```\n\n> ![warning](img/file1.svg) `awk` 不支持 `\\\
  d` 和 `\\D`，这些在其他实现中用作所有数字和非数字的快捷方式。\n\n**命名字符集**由封装在 `[:` 和 `:]` 之间的名称定义，必须在字符类\
  \ `[]` 内使用，并根据需要与其他字符一起使用。\n\n| 命名集合 | 描述 |\n| --- | --- |\n| `[:digit:]` | `[0-9]`\
  \ |\n| `[:lower:]` | `[a-z]` |\n| `[:upper:]` | `[A-Z]` |\n| `[:alpha:]` | `[a-zA-Z]`\
  \ |\n| `[:alnum:]` | `[0-9a-zA-Z]` |\n| `[:xdigit:]` | `[0-9a-fA-F]` |\n| `[:cntrl:]`\
  \ | 控制字符 - 前 32 个 ASCII 字符和第 127 个(DEL) |\n| `[:punct:]` | 所有标点符号 |\n| `[:graph:]`\
  \ | `[:alnum:]` 和 `[:punct:]` |\n| `[:print:]` | `[:alnum:]`、`[:punct:]` 和空格 |\n\
  | `[:blank:]` | 空格和制表符字符 |\n\n\n\n\n\n| `[:space:]` | 空白字符，等同于 `\\s` |\n\n```\n\
  [](#cb52-1)$ s='err_msg xerox ant m_2 P2 load1 eel'\n[](#cb52-2)$ echo \"$s\" |\
  \ awk '{gsub(/\\<[[:lower:]]+\\>/, \"X\")} 1'\n[](#cb52-3)err_msg X X m_2 P2 load1\
  \ X\n[](#cb52-4)\n[](#cb52-5)$ echo \"$s\" | awk '{gsub(/\\<[[:lower_]+]+\\>/, \"\
  X\")} 1'\n[](#cb52-6)X X X m_2 P2 load1 X\n[](#cb52-7)\n[](#cb52-8)$ echo \"$s\"\
  \ | awk '{gsub(/\\<[[:alnum:]]+\\>/, \"X\")} 1'\n[](#cb52-9)err_msg X X m_2 X X\
  \ X\n[](#cb52-10)\n[](#cb52-11)$ echo ',pie tie#ink-eat_42' | awk '{gsub(/[^[:punct:]]+/,\
  \ \"\")} 1'\n[](#cb52-12),#-_\n```\n\n为了字面量匹配字符类元字符，需要特定的放置位置。或者，可以通过在前面加上 `\\`\
  \ 来进行转义，以避免记忆不同的规则。由于 `\\` 在字符类内部是特殊字符，请使用 `\\\\` 来表示其字面量。\n\n```\n[](#cb53-1)$\
  \ # - 应该是 [] 内的第一个或最后一个字符\n[](#cb53-2)$ echo 'ab-cd gh-c 12-423' | awk '{gsub(/[a-z-]{2,}/,\
  \ \"X\")} 1'\n[](#cb53-3)X X 12-423\n[](#cb53-4)$ # 或使用 \\ 进行转义\n[](#cb53-5)$ echo\
  \ 'ab-cd gh-c 12-423' | awk '{gsub(/[a-z\\-0-9]{2,}/, \"X\")} 1'\n[](#cb53-6)X X\
  \ X\n[](#cb53-7)\n[](#cb53-8)$ # ] 应该是 [] 内的第一个字符\n[](#cb53-9)$ printf 'int a[5]\\\
  nfoo\\n1+1=2\\n' | awk '/[=]]/'\n[](#cb53-10)$ printf 'int a[5]\\nfoo\\n1+1=2\\\
  n' | awk '//=]/'\n[](#cb53-11)int a[5]\n[](#cb53-12)1+1=2\n[](#cb53-13)\n[](#cb53-14)$\
  \ # 若要匹配 ，可以在字符集中的任何位置使用 [\n[$ # [][] 会同时匹配 [ 和 ]\n[](#cb53-16)$ printf 'int a[5]\\\
  nfoo\\n1+1=2\\n' | awk '/[][]/'\n[](#cb53-17)int a[5]\n[](#cb53-18)\n[](#cb53-19)$\
  \ # ^ 不应该是 [] 内的第一个字符\n[](#cb53-20)$ echo 'f*(a^b) - 3*(a+b)/(a-b)' | awk '{gsub(/a[+^]b/,\
  \ \"c\")} 1'\n[](#cb53-21)f*(c) - 3*(c)/(a-b)\n```\n\n> ![warning](img/file1.svg)\
  \ 像 `[.` 或 `[:` 这样的组合不能共同表示两个独立的字符，因为它们在 `[]` 中有特殊含义。更多详情请参阅 [gawk 手册：Using Bracket\
  \ Expressions](https://www.gnu.org/software/gawk/manual/gawk.html#Bracket-Expressions)。\n\
  \n```\n[](#cb54-1)$ echo 'int a[5]' | awk '/[x[.y]/'\n[](#cb54-2)awk: cmd. line:1:\
  \ error: Unmatched [, [^, [:, [., or [=: /[x[.y]/\n[](#cb54-3)$ echo 'int a[5]'\
  \ | awk '/[x[y.]/'\n[](#cb54-4)int a[5]\n```\n\n## 转义序列\n\n某些 ASCII 字符如制表符 `\\t`、回车\
  \ `\\r`、换行符 `\\n` 等都有表示它们的转义序列。此外，任何字符都可以使用八进制 `\\NNN` 或十六进制 `\\xNN` 格式的 ASCII 值来表示。与字符类转义序列（如\
  \ `\\w`）不同，这些可以在字符类内部。\n\n```\n[](#cb55-1)$ # 使用 \\t 表示制表符字符\n[](#cb55-2)$ printf\
  \ 'foo\\tbar\\tbaz\\n' | awk '{gsub(/\\t/, \" \")} 1'\n[](#cb55-3)foo bar baz\n\
  [](#cb55-4)\n[](#cb55-5)$ # 这些转义序列在字符类内同样有效\n[](#cb55-6)$ printf 'a\\t\\r\\fb\\\
  vc\\n' | awk '{gsub(/[\\t\\v\\f\\r]+/, \":\")} 1'\n[](#cb55-7)a:b:c\n[](#cb55-8)\n\
  [](#cb55-9)$ # 表示单引号\n[](#cb55-10)$ # 使用 \\047 八进制格式\n[](#cb55-11)$ echo \"universe:\
  \ '42'\" | awk '{gsub(/\\x27/, \"\")} 1'\n[](#cb55-12)universe: 42\n```\n\n> ![info](img/file0.svg)\
  \ 如果通过 ASCII 值指定元字符，仍视为元字符。未定义的序列将导致警告。\n\n```\n[](#cb56-1)$ # \\x5e 是 ^ 字符，作为字符串锚点\n\
  [](#cb56-2)$ printf 'cute\\ncot\\cat\\n' | awk '/\\xeco/'\n[](#cb56-3)cot\n[](#cb56-4)coat\n\
  [](#cb56-5)$ # & 代表整个匹配部分\n[](#cb56-7)$ echo 'hello world' | awk '{sub(*/, \"[&]\"\
  )} 1'\n[](#cb56-8)hello world\n[](#cb56-9)$ # \\x26 是 & 字符\n[](#cb56-10)$ echo 'hello\
  \ world' | awk '{sub(*/, \"\\x26]\")} 1'\n[](#cb56-11)hello world\n[](#cb56-12)$\
  \ echo 'read' | awk '{sub(/a/, \".\")} 1'\n[](#cb56-13)awk: line:1: escape sequence\
  \ `.` 被视为普通字符\n[](#cb56-14)re.d\n```\n\n> ![info](img/file0.svg) 参阅 [gawk 手册：Escape\
  \ Sequences](https://www.gnu.org/software/gawk/manual/html#Escape-Sequences)。\n\n\
  ## 替换特定次数\n\n替换函数 `gensub`，可以替代 `sub` 和 `gsub`。在语法上，`gensub` 需要三个参数。第三个参数用于指定是替换所有出现还是通过数字指定特定次数。另一个区别是\
  \ `gensub` 返回一个字符串值，而不是修改输入。\n\n```\n[](#cb57-1)$ # 等于 sed 's/:/-/'\n[](#cb57-2)$\
  \ # 仅替换第二个 ':' 为 '-'\n[](#cb57-3)$ # 注意 gensub 的输出在这里被传递\n[](#cb57-4)$ echo 'foo:123:bar:baz'\
  \ | awk '{print gensub(/:/, \"-\", 2)}'\n[](#cb57-5)foo:123-baz\n[](#cb57-6)$ #\
  \ 等于 sed -E 's/[^:]+/X/3'\n[](#cb57-8)$ # 仅替换第三字段为 'X'\n[](#cb57-9)$ echo 'foo:123:bar:baz'\
  \ | awk '{print gensub(/[^:]/, \"X\", 3)}'\n10)foo:123:X:baz\n```\n\n`gensub` 函数的第四个参数允许你指定执行替换的输入字符串或变量。默认值为\
  \ `$0`，如之前的示例所示。\n\n```\n[](#cb58-1)$ # 仅针对第四字段替换元音为 'X'\n[](#cb58-2)$ # 等于 awk\
  \ '{gsub(/[aeiou]/, \"X\", $4)}'\n[](#cb58-3)$ echo '1 good 2 apples' | awk '{$4\
  \ = gensub(/[aeiou]/, \"X\", \"g\", $4)} 1'\n4)1 good 2 Xs\n```\n\n## 反引用\n\n分组元字符\
  \ `()` 也称为捕获组。它们像变量一样，`()` 捕获的字符串可以通过反引用 `\\N` ，其中 `N` 是你想要的捕获组。正则表达式中最左边的 `(` 是\
  \ `\\1`，下一个是 `\\2`，依此类直到 `\\9`。作为特殊情况，由于 `\\` 在引号内是特殊字符，你必须使用 `\"\\\\1\"` 来表示 `\\\
  1`。\n\n> ![info](img/file0.svg) `\\N` 形式的反引用只能用于 `gensub` 函数。`&` 可以用于 `sub`、`gsub`\
  \ 和 `gensub` 函数。\n\n```\n[](#cb59-1)$ # 将 \\\\ 减少为单个 \\，如果它是单个 \\\n[](#cb59-2)$\
  \ s='\\[\\] and \\\\w and \\[a-zA-Z0-9\\_\\]'\n[](#cb59-3)$ echo \"$s\" | awk '{print\
  \ gensub(/(\\\\?)\\/, \"\\\\1\", \"g\")}'\n[](#cb59-4)[] and \\w and [a-zA-Z0-9_]\n\
  [](#cb59-5)\n[](#cb59-6)$ # 将第一列的值复制为最后一列\n[](#cb59-7)$ echo 'one,2,3.14,42' | awk\
  \ '{print gensub(/^,]+).*/ \"\\\\1\", 1)}'\n8)one,2,3.14,42\n[](#cb59-9)\n[](#cb59-10)$\
  \ # 在字符串开头和结尾添加内容\n[](#cb59-11)$ # 因为使用了 '&'，不需要 gensub\n[](#cb59-12)$ echo 'hello\
  \ world' | awk '{sub(*/, \"Hi. &. Have a day\")} 1'\n13)Hi. hello world. Have a\
  \ day\n[](#cb59-14)\n[](#cb59-15)$ # 这里 {N} 指的是最后一个但第 N 个出现\n[](#cb59-16)$ s='456:foo:123:bar:789:baz'\n\
  [](#cb59-17)$ echo \"$s\" | awk '{print gensub(/(.*):((.*:){2})/, \"\\\\1[]\\\\\
  2\", 1)}'\n18)456:foo:123[]bar:789:baz\n```\n\n> ![warning](img/file1.svg) 参阅 [unix.stackexchange:\
  \ 为什么这个 sed 命令没有替换倒数三个 \"and\"?](https://unix.stackexchange.com/q/579889/109046)\
  \ 关于在 `(){N})` 通用情况下使用单词边界的错误。\n\n> ![warning](img/file1.svg) 与 `grep` 或 `sed` 或\
  \ `perl` 等其他正则表达式实现不同，反引用不能用于 awk 的搜索部分。另参阅 [unix.stackexchange: backreference in\
  \ awk](https://unix.stackexchange.com/q/361427/109046)。\n\n如果量词应用于在 `()` 元字符内部分组的模式，你需要一个外部\
  \ `()` 组来捕获匹配部分。某些正则表达式引擎提供了非捕获组来处理此类情况。在 `awk` 中，你必须绕过额外的捕获组。\n\n\n\n\n\n```\n\
  [](#cb60-1)$ # 注意替换部分中使用的数字\n[](#cb60-2)$ s='one,2,3.14,42'\n[](#cb60-3)$ echo \"\
  $s\" | awk '{$0=gensub(/^(([^,]+,){2})([^,]+)/, \"\\\\1\", 1)} 1'\n[](#cb60-4)one,2,,42\n\
  ```\n\n这是一个当匹配部分的长度相同时，交替顺序变得重要的示例。目标是删除所有单词，除非它们以 `g` 或 `p` 开头且包含 `y`。\n\n```\n\
  [](#cb61-1)$ s='tryst,fun,glyph,pity,why,group'\n[](#cb61-2)\n[](#cb61-3)$ # 因为\
  \ \\w+ 在这里优先级更高，所有单词都会被删除\n[](#cb61-4)$ echo \"$s\" | awk '{print gensub(/\\<\\\
  w+\\>|(\\<[gp]\\w*y\\w*\\>)/, \"\\\\1\", \"g\")}'\n[](#cb61-5),,,,,\n[](#cb61-6)\n\
  [](#cb61-7)$ # 这里捕获组的优先级更高，因此匹配组的单词会被保留\n[](#cb61-8)$ echo \"$s\" | awk '{print\
  \ gensub(/(\\<[gp]\\w*y\\w*\\>)|\\<\\w+\\>/, \"\\\\1\", \"g\")}'\n[](#cb61-9),,glyph,pity,,\n\
  ```\n\n由于 `\\` 和 `&` 在替换部分的双引号内是特殊字符，请分别使用 `\\\\` 和 `\\\\&` 来进行字面表示。\n\n```\n[](#cb62-1)$\
  \ echo 'foo and bar' | awk '{sub(/and/, \"[&]\")} 1'\n[](#cb62-2)foo [and] bar\n\
  [](#cb62-3)$ echo 'foo and bar' | awk '{sub(/and/, \"[\\\\&]\")} 1'\n[](#cb62-4)foo\
  \ [&] bar\n[](#cb62-5)\n[](#cb62-6)$ echo 'foo and bar' | awk '{sub(/and/, \"\\\\\
  \")} 1'\n[](#cb62-7)foo \\ bar\n```\n\n## 不区分大小写的匹配\n\n与 `sed` 或 `perl` 不同，`awk`\
  \ 中的正则表达式并不支持使用标志（flags）来改变某些行为。例如，没有标志可以强制正则表达式在匹配时忽略大小写。\n\n特殊变量 `IGNORECASE`\
  \ 用于控制大小写敏感性，默认值为 `0`。通过将其更改为其他值（在条件表达式中表示 `true`），你可以进行不区分大小写的匹配。`-v` 命令行选项允许你在读取输入之前分配变量。`BEGIN`\
  \ 块也经常用于更改此类设置。\n\n```\n[](#cb63-1)$ printf 'Cat\\ncOnCaT\\nscatter\\ncot\\n' |\
  \ awk -v IGNORECASE=1 '/cat/'\n[](#cb63-2)Cat\n[](#cb63-3)cOnCaT\n[](#cb63-4)scatter\n\
  [](#cb63-5)\n[](#cb63-6)$ # 对于足够小的字符串，也可以使用字符类\n[](#cb63-7)$ printf 'Cat\\ncOnCaT\\\
  nscatter\\ncot\\n' | awk '{gsub(/[cC][aA][tT]/, \"dog\")} 1'\n[](#cb63-8)dog\n[](#cb63-9)cOndog\n\
  [](#cb63-10)sdogter\n[](#cb63-11)cot\n```\n\n另一种方法是使用内置字符串函数 `tolower` 先将输入转换为小小写。\n\
  \n```\n[](#cb64-1)$ printf 'Cat\\ncOnCaT\\nscatter\\ncot\\n' | awk 'tolower($0)\
  \ ~ /cat/'\n[](#cb64-2)Cat\n[](#cb64-3)cOnCaT\n[](#cb64-4)scatter\n```\n\n## 动态正则表达式\n\
  \n如之前所示，你可以使用字符串字面量而不是正则表达式来指定要匹配的模式。这意味着你可以使用任何表达式或变量。如果你需要根据某些条件计算正则表达式，或者从外部获取模式（例如用户输入），这种方法非常有帮助。\n\
  \n`-v` 命令行选项对于获取用户输入非常方便，例如从 `bash` 变量获取。\n\n```\n[](#cb65-1)$ r='cat.*dog|dog.*cat'\n\
  [](#cb65-2)$ echo 'two cats and a dog' | awk -v ip=\"$r\" '{gsub(ip, \"pets\")}\
  \ 1'\n[](#cb65-3)two pets\n[](#cb65-4)\n[](#cb65-5)$ awk -v s='ow' '$0 ~ s' table.txt\n\
  [](#cb65-6)brown bread mat hair 42\n[](#cb65-7)yellow banana window shoes 3.14\n\
  [](#cb65-8)\n[](#cb65-9)$ # 你必须确保使用 \\\\ 而不是 \\\n[](#cb65-10)$ r='\\\\<[12][0-9]\\\
  \\>'\n[](#cb65-11)$ echo '23 154 12 26 34' | awk -v ip=\"$r\" '{gsub(ip, \"X\")}\
  \ 1'\n[](#cb65-12)X 154 34\n```\n\n> ![info](img/file0.svg) 查看 使用 shell 变量 以避免使用\
  \ `\\`。\n\n有时你需要获取输入并将其视为字面量而不是正则表达式。在这种情况下，你需要在使用替换之前转义元字符。对于替换部分，只需要转义 `\\` 和\
  \ `&` 字符。\n\n```\n[](#cb66-1)$ awk -v s='(a.b)' '{BEGIN{gsub(//, \"\\\\&\", s);\
  \ print s}'\n[](#cb66-2)a.b\n[](#cb66-3)\n[](#cb66-4)$ echo 'f*(a^b)' | awk -v s='(a^b)'\
  \ '{gsub(//, \"\\\\&\", s); gsub(s, \"c\")} 1'\n[](#cb66-5)fc\n[](#cb66-6)fc\n[](#cb66-7)$\
  \ # 字面匹配给定输入，但仅位于字符串结尾\n```\n\n> ![info](img/file0.svg) 如果你需要匹配而不是替换，可以使用 `index`\
  \ 函数。查看 index。\n\n## 总结\n\n正则表达式是你会在命令行和编程语言中遇到的特性。它是一个多功能强大的文本处理工具。虽然 `awk` 中的功能与编程语言中的要少少，但对于你需要的命令行用法已经足够了。掌握正则表达式的语法和功能需要大量时间，因此我鼓励你多加练习。由于其灵活性，也可以将其视为一种微型编程语言。\n\
