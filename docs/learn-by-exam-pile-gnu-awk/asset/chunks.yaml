    \n```\n$ echo '1 grape\" and \"mango\" and \"guava\"' | awk ##### 在此处添加你的解决方案\n\
    \"grape\",\"guava\"\n$ echo 'a 1\"\"c-2\"\"d') | awk ##### 在此处添加你的解决方案\n\"a 1\"\
    ,\"c-2\"\n```\n\n**f)** 构造一个同时适用于给定输入和相应输出的解决方案。解决方案不应使用替换函数。你能在不显式使用 `print`\
    \ 的情况下完成吗？\n\n```\n$ echo 'hi,bye,there,was,to' | awk ##### 在此处添加你的解决方案\nhi,bye,to\n\
    $ echo '1,2,3,4,5' | awk ##### 在此处添加你的解决方案\n1,2,5\n```\n\n**g)** 转换给输入文件 `fw.txt`\
    \ 以得到所示输出。如果字段为空（即只包含空格字符），则将其替换为 `NA`。\n\n```\n$ cat fw.txt\n1.3  rs   90  0.134563\n\
    3.8           6\n5.2  ye       8.2387\n4.2  kt   32  45.1\n\n$ awk ##### 在此处添加你的解决方案\n\
    1.3,rs,0.134563\n3.8,NA,6\n5.2,ye,8.2387\n4.2,kt,45.1\n```\n\n**h)** 显示每行输入中的第三和第五个字符，如下所示。\n\
    \n```\n$ printf 'restore\\ncricket' | awk ##### 在此处添加你的解决方案\nsto\nik\n```\n\n\
    # 记录分隔符\n\n到为止，你已经看到 `awk` 如何根据 `\\n` 换行符自动拆分输入。正如你可以使用 `FS` 控制这些行进一步拆分为字段一样，`awk`\
    \ 提供了一种方法来控制什么构成一个行。在 `awk` 术语中，“记录（record）”一词用于描述放入 `$0` 变量的内容。类似于 `OFS`，你可以控制在\
    \ `print` 函数末尾添加的字符串。本章还将讨论如何使用与记录（行）号相关的特殊变量。\n\n## 输入记录分隔符\n\n`RS` 特殊变量用于控制如何将输入内容拆分为记录。默认是\
    \ `\\n` 换行符，如之前的章节所示。特殊变量 `NR` 用来跟踪当前记录号。\n\n```\n# 将输入记录分隔符改为逗号\n# 注意第二个记录的内容，换行只是另一个字符\n\
    printf 'this,is\\na,sample' | awk -v RS=, '{print NR \")\", $0}'\n1) this\n2)\
    \ is\n3) a\n4) sample\n```\n\n记得默认 `FS` 将根据空格、制表符和换行符拆分输入记录。现在你已经看到 `RS` 可以是换行符以外的内容，这里有一个示例展示了默认记录拆分的完整效果。\n\
    \n```\n$ s='   a\\t\\tb:1000\\n\\n\\n\\n123 7777:x  y \\n \\n z  '\nprintf '%b'\
    \ \"$s\" | awk -v RS=: -v OFS=, '{$1=$1} 1'\na,b\n1000\n7777\nz\n```\n\n与 `FS`\
    \ 类似，`RS` 的值被视为字符串字面量并转换为正则表达式。现在，考虑一个具有多个字符 `RS` 但不需要正则表达式元字符的示例。\n\n```\n$ cat\
    \ report.log\nblah blah Error: second record starts\nsomething went wrong\nsome\
    \ more details Error: third record\ndetails about what went wrong\n\n# 使用 'Error:'\
    \ 作为输入记录分隔符\n# 打印所有包含 'something' 的记录\nawk -v RS='Error:' '/something/' report.log\n\
    \ second record starts\nsomething went wrong\nsome more details \n```\n\n> ![warning](img/file1.svg)\
    \ 如果设置了 `IGNORECASE`，它也会影响记录分离。记录分隔符是单个字符时，可以通过使用字符类来绕过。\n\n"
- fmt: "\n```bash\nawk -v IGNORECASE=1 -v RS='error:' 'NR==1' report.log\nblah blah\
    \ \n# when RS is a single character\nawk -v IGNORECASE=1 -v RS='e' 'NR==1' report.log\n\
    blah blah Error: s\nawk -v IGNORECASE=1 -v RS='[e]' 'NR==1' report.log\nblah blah\
    \ \n```\n\n> ![warning](media/file1.svg) The default line ending for text files\
    \ varies between different platforms. For example, a text file downloaded from\
    \ internet or a file originating from Windows OS would typically have lines ending\
    \ with carriage return and line feed characters. So, you'll have to use `RS='\\\
    r\\n'` for such files. See also [stackoverflow: Why does my tool overwrite itself\
    \ and how do I fix it?](https://stackoverflow.com/q/45772525/4082052) for a detailed\
    \ discussion and mitigation methods.\n\n## Output record separator\n\nThe `ORS`\
    \ special variable is used for output record separator. `ORS` is the string that\
    \ gets added to the end of every call to the `print` function. The default value\
    \ for `ORS` is a single newline character, just like `RS`.\n\n```bash\n# change\
    \ NUL record separator to dot and newline\nprintf 'foo\\0bar\\0' | awk -v RS='\\\
    0' -v ORS='.\\n' '1'\nfoo.\nbar.\n\ncat msg.txt\nHello there.\nIt will rain to-\n\
    day. Have a safe\nand pleasant jou-\nrney.\n# here ORS is empty string\nawk -v\
    \ RS='-\\n' -v ORS= '1' msg.txt\nHello there.\nIt will rain today. Have a safe\n\
    and pleasant journey.\n```\n\n> ![info](media/file0.svg) Note that the `$0` variable\
    \ is assigned after removing trailing characters matched by `RS`. Thus, you cannot\
    \ directly manipulate those characters with functions like `sub`. With tools that\
    \ don't automatically strip record separator, such as `perl`, the previous example\
    \ can be solved as `perl -pe 's/-\\n//' msg.txt`.\n\nMany a times, you need to\
    \ change `ORS` depending upon contents of input record or some other condition.\
    \ The `cond ? expr1 : expr2` ternary operator is often used in such scenarios.\
    \ The below example assumes that input is evenly divisible, you'll have to add\
    \ more logic if that is not the case.\n\n```bash\n# can also use RS instead of\
    \ \"\\n\" here\nseq 6 | awk '{ORS = NR%3 ? \"-\" : \"\\n\"} 1'\n1-2-3\n4-5-6\n\
    ```\n\n> ![info](media/file0.svg) If the last line of input didn't end with the\
    \ input record separator, it might get added in the output if `print` is used,\
    \ as `ORS` gets appended.\n\n```bash\n# here last line of input didn't end with\
    \ newline\n# but gets added via ORS when 'print' is used\nprintf '1\\n2' | awk\
    \ '1; END{print 3}'\n1\n2\n3\n```\n\n## Regexp RS and RT\n\nAs mentioned before,\
    \ the value passed to `RS` is treated as a string literal and then converted to\
    \ a regexp. Here's some examples.\n\n```bash\n# set input record separator as\
    \ one or more digit characters\n# print records containing 'i' and 't'\nprintf\
    \ 'Sample123string42with777numbers' | awk -v RS='[0-9]+' '/i/ && /t/'\nstring\n\
    with\n\n# similar to FS, the value passed to RS is string literal\n# which is\
    \ then converted to regexp, so need \\\\ instead of \\ here\nprintf 'load;err_msg--ant,r2..not'\
    \ | awk -v RS='\\\\W+' '/an/'\nant\n```\n\n> ![info](media/file0.svg) First record\
    \ will be empty if `RS` matches from the start of input. However, if `RS` matches\
    \ until the very last character of the input file, there't be empty record as\
    \ the last record. This is different from how `FS` behaves if it matches until\
    \ the last character.\n\n```bash\n# first record is empty and last record is newline\n\
    # change 'echo' to 'printf' and see what changes\necho '123string42with777' |\
    \ awk -v RS='[0-9]+' '{print NR $0}'\n1 [string]\n2 [with]\n3 [4]\nprintf '123string42with777'\
    \ | awk -v FS='[0-9]+' '{print NF}'\n4\nprintf '123string42with777' | awk -v RS='[0-9]+'\
    \ 'END{print NR}'\n3\n```\n\nThe `RT` special variable contains the text that\
    \ was matched by `RS`. This variable gets updated for every input record.\n\n\
    ```bash\n# print record number and value of RT for that record\n# last record\
    \ has empty RT because it't end with digits\necho 'Sample123string42with777' |\
    \ awk -v RS='[0-9]+' '{print NR, RT}'\n1 123\n2 42\n3 777\n4 \n```\n\n## Paragraph\
    \ mode\n\nAs a special case, when `RS` is set to empty string, one or more consecutive\
    \ empty lines is used as the record separator. Consider the below sample:\n\n\
    ```bash\ncat programming_quotes.txt\nDebugging is twice as hard as writing the\
    \ code in the first place.\nTherefore, if you write the code as cleverly as possible,\
    \ you are,\nby definition, not smart enough to debug it by Brian W. Kernighan\n\
    Some people, when confronted with a problem, think - I know, I will\nuse regular\
    \ expressions. Now they have two problems by Jamie Zawinski\nA language that does\
    \ not affect the way you think about programming,\nis not worth knowing by Alan\
    \ Perlis\nThere are 2 hard problems in computer science: cache invalidation,\n\
    naming things, and off-by-1 errors by Leon Bambrick\n```\n\nHere's an example\
    \ of processing input paragraph wise.\n\n```bash\n# print all paragraphs containing\
    \ 'you'\n# note that there'll be an empty line after the last record\nawk -v RS=\
    \ -v ORS='\\n\\n' '/you/' programming_quotes.txt\nDebugging is twice as hard as\
    \ writing the code in the first place.\nTherefore, if you write the code as cleverly\
    \ as possible, you are,\nby definition, not smart enough to debug it by Brian\
    \ W. Kernighan\n\nA language that does not affect the way you think about programming,\n\
    is not worth knowing by Alan Perlis\n```\n\nThe empty line at the end is a common\
    \ problem when dealing with custom record separators. You could either process\
    \ the output to remove it or add logic to avoid the extras. Here's one workaround\
    \ for the previous example.\n\n```bash\n# here ORS is left as default newline\
    \ character\n# uninitialized variable 's' will be empty for the first match\n\
    # afterwards, 's' will provide the empty line separation\nawk -v RS= '/you/{print\
    \ s $0; s=\"\\n\"}' programming_quotes.txt\nDebugging is twice as hard as writing\
    \ the code in the first place.\nTherefore, if you write the code as cleverly as\
    \ possible, you are,\nby definition, not smart enough to debug it by Brian W.\
    \ Kernighan\n\nA language that does not affect the way you think about programming,\n\
    is not worth knowing by Alan Perlis\n```\n\nParagraph mode is not the same as\
    \ using `RS='\\n\\n+'` because `awk` does a few more operations when `RS` is empty.\
    \ See [gawk manual: multiline records](https://www.gnu.org/software/gawk/manual/html_node/Multiple-Line.html#Multiple-Line)\
    \ for details. Important points are quoted below and illustrated with examples.\n\
    \n> However, there is an important difference between `RS = \"\"` and `RS = \"\
    \\n\\n+\"`. In the first case, leading newlines in the input data file are ignored\n"
