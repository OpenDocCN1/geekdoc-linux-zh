    and modified by various other developers. See [gawk manual: History](https://www.gnu.org/software/gawk/manual/gawk.html#History)
    for more details. This chapter will show how to install or upgrade `awk` followed
    by details related to documentation.


    ## Installation


    If you are on a Unix like system, you are most likely to already have some version
    of `awk` installed. This book is primarily for `GNU awk`. As there are syntax
    and feature differences between various implementations, please make sure to follow
    along with what is presented here. `GNU awk` is part of [text creation and manipulation](https://www.gnu.org/manual/manual.html)
    commands provided by `GNU`. To install newer or particular version, visit [gnu:
    software gawk](https://www.gnu.org/software/gawk/). Check [release notes](https://lists.gnu.org/archive/cgi-bin/namazu.cgi?query=gawk+released&submit=Search%21&idxname=info-gnu&max=20&result=normal&sort=date%3Alate)
    for an overview of changes between versions.


    ```

    [](#cb1-1)$ # use a dir, say ~/Downloads/awk_install before following the steps
    below

    [](#cb1-2)$ wget https://ftp.gnu.org/gnu/gawk/gawk-5.1.0.tar.xz

    [](#cb1-3)$ tar -Jxf gawk-5.1.0.tar.xz

    [](#cb1-4)$ cd gawk-5.1.0/

    [](#cb1-5)$ ./configure

    [](#cb1-6)$ make

    [](#cb1-7)$ sudo make install

    [](#cb1-8)

    [](#cb1-9)$ type -a awk

    [](#cb1-10)awk is /usr/local/bin/awk

    [](#cb1-11)awk is /usr/bin/awk

    [](#cb1-12)$ awk --version | head -n1

    [](#cb1-13)GNU Awk 5.1.0, API: 3.0

    ```'
