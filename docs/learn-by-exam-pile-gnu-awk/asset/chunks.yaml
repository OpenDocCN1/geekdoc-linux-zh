    > and if a file ends without extra blank lines after the last record, the final
    newline is removed from the record. In the second case, this special processing
    is not done.


    ```bash

    s=''\n\n\na\nb\n\n12\n34\n\nhi\nhello\n''

    # paragraph mode

    printf ''%b'' "$s" | awk -v RS= -v ORS=''\n---\n'' ''END{print}''

    hi

    hello

    ---

    # RS is ''\n\n+'' instead of paragraph mode

    printf ''%b'' "$s" | awk -v RS=''\n\n+'' -v ORS=''\n---\n'' ''END{print}''

    hi

    hello


    ---

    ```


    > When RS is set to the empty string and FS is set to a single character, the
    newline character always acts as a field separator. This is in addition to whatever
    field separations result from FS. When FS is the null string (`""`) or a regexp,
    this special feature of RS does not apply. It does apply to the default field
    separator of a single space: `FS = " "`


    ```bash

    s=''a:b\nc:d\n\n1\n2\n3''

    # FS is a single character in paragraph mode

    printf ''%b'' "$s" | awk -F: -v RS= -v ORS=''\n---\n'' ''{$1=$1} 1''

    a b c d

    ---

    1 2 3

    ---

    # FS is a regexp in paragraph mode

    printf ''%b'' "$s" | awk -F'':+'' -v RS= -v ORS=''\n---\n'' ''{$1=$1} 1''

    a b

    c d

    ---

    1

    2

    3

    ---

    # FS is single character and RS is ''\n\n+'' instead of paragraph mode

    printf ''%b'' "$s" | awk -F: -v RS=''\n\n+'' -v ORS=''\n---\n'' ''{$1=$1} 1''

    a b

    c d

    ---

    1

    2

    3

    ---

    ```


    ## NR vs FNR


    There are two special variables related to record number. You''ve seen `NR` earlier
    in the chapter, but here''s some more examples.


    ```bash

    # same as: head -n2

    seq 5 | awk ''NR<=2''

    1

    2

    # same as: tail -n1

    awk ''END{print}'' table.txt

    banana window shoes 3.14

    # change first field only for second line

    awk ''NR==2{$1="green"} 1'' table.txt

    bread mat hair 42

    cake mug shirt -7

    banana window shoes 3.14

    ```


    All the examples with `NR` so far has been single file input. If are multiple
    file inputs, then you can choose between `NR` and the second variable `FNR`. The
    difference is that `NR` contains total records read so far whereas `FNR` contains
    record number of only the current file being processed. Here''s some examples
    to show them in action. You''ll see more examples later.


    ```bash

    awk -v OFS=''\t'' ''BEGIN{print "NR", "FNR"} {print NR, FNR, $0}'' report.txt

    NR FNR

    1 blah Error: second starts

    2 something went wrong

    3 some more details: third record

    4 details about what went wrong

    5 bread mat hair 42

    6 blue cake shirt -7

    7 banana window shoes 3.14

    # same as: head -q -n1

    awk ''FNR==1'' report.txt

    blah Error: second starts

    bread mat hair 42

    ```


    > ![info](media/file0.svg) For large input files, use `exit` to avoid unnecessary
    record processing.


    ```bash

    seq 3542 462352 | awk ''NR==2452{print; exit}''

    5993

    seq 3542 462352 | awk ''NR==250; NR==2452{print; exit}''

    3791

    5993

    # here is a sample time

    time seq 3542 462352 | awk ''NR==2452{print; exit}'' > f1

    real 0m.004s

    time seq 3542 462352 | awk ''NR==2452'' > f2

    real 0m.395s

    ```


    ## Summary


    This chapter showed you how to change the way input content is split into records
    and how to set the string to be appended when `print` is used. The paragraph mode
    is useful for processing multiline records separated by empty lines. You also
    learned two special variables related to record numbers and where to use them.


    So far, you''ve used `awk` to manipulate file content without modifying the source
    file. The next chapter will discuss how to write back the changes to the original
    input files.


