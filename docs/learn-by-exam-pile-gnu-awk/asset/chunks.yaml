    # 前言


    在涉及到命令行文本处理时，从抽象的角度来看，有三大支柱：用于过滤的 `grep`、用于替换的 `sed` 以及用于字段处理的 `awk`。这些工具也具有一些重叠的功能，例如，这三者都具备强大的过滤能力。


    与 `grep` 和 `sed` 不同，`awk` 是一门完整的编程语言。然而，本书旨在展示如何从命令行组合成 `awk` 单行命令（one-liners），而不是编写程序文件。


    本书极度依赖示例来逐一介绍 `awk` 的选项和功能。建议你手动输入每个示例并进行实验。理解示例输入字符串的本质以及产生的输出至关重要。类比一下，这就像学习骑自行车或开车——无论你读了多少相关书籍或听了多少解释，你都需要大量的练习并推导出自己的结论。如果你觉得复制粘贴更适合你，可以在
    [GitHub 上按章节获取代码片段](https://github.com/learnbyexample/learn_gnuawk/tree/master/code_snippets)。


    ## 前提条件


    * 拥有命令行和 `bash` shell 的工作经验，应熟悉文件重定向、命令管道等概念。

    * 熟悉编程概念，如变量、打印、函数、控制结构、数组等。

    * 了解 `grep` 和 `sed` 的基础将有助于理解 `awk` 的相似功能。


    如果你是命令行世界的新手，在开始本书之前，请先查看我整理的 [Linux CLI 和 Shell 脚本](https://learnbyexample.github.io/curated_resources/linux_cli_scripting.html)
    资源。


    我的 [命令行文本处理](https://github.com/learnbyexample/Command-line-text-processing) 仓库包含关于
    `GNU awk` 的章节，该章节经过编辑和重构，形成了本书。


    ## 规范


    * 此处展示的示例已在 `GNU bash` shell 和 `GNU awk 5.1.0` 上经过测试，并包含了早期版本不支持的功能。

    * 所示的代码片段是从 `bash` shell 复制粘贴并为了演示目的修改过的。某些命令前带有注释，以提供背景和解释。为了提高可读性增加了空行；速度对比中仅显示
    `real` 时间；对于 `wget` 等命令则跳过了输出。

    * 除非另有说明，所有示例和解释均针对 `ASCII` 字符。

    * 除非特别指定，`awk` 指 `GNU awk`，`grep` 指 `GNU grep`，以此此类推。

    * 本书中提供了外部链接以供进一步阅读。不需要立即访问。它们经过了仔细挑选，会对你有帮助，尤其是在重读时。

    * [learn_gnuawk 仓库](https://github.com/learnbyexample/learn_gnuawk) 包含了示例、练习以及与书籍相关的全部代码片段和文件。如果你不熟悉
