    Specific placement is needed to match character class metacharacters literally.
    Or, they can be escaped by prefixing `\` to avoid having to remember the different
    rules. As `\` is special inside character class, use `\\` to represent it literally.


    ```

    [](#cb53-1)$ # - should be first or last character within []

    [](#cb53-2)$ echo ''ab-cd gh-c 12-423'' | awk ''{gsub(/[a-z-]{2,}/, "X")} 1''

    [](#cb53-3)X X 12-423

    [](#cb53-4)$ # or escaped with \

    [](#cb53-5)$ echo ''ab-cd gh-c 12-423'' | awk ''{gsub(/[a-z\-0-9]{2,}/, "X")}
    1''

    [](#cb53-6)X X X

    [](#cb53-7)

    [](#cb53-8)$ # ] should be first character within []

    [](#cb53-9)$ printf ''int a[5]\nfoo\n1+1=2\n'' | awk ''/[=]]/''

    [](#cb53-10)$ printf ''int a[5]\nfoo\n1+1=2\n'' | awk ''//=]/''

    [](#cb53-11)int a[5]

    [](#cb53-12)1+1=2

    [](#cb53-13)

    [](#cb53-14)$ # to match [ use [ anywhere in the character set

    [](#cb53-15)$ # [][] will match both [ and ]

    [](#cb53-16)$ printf ''int a[5]\nfoo\n1+1=2\n'' | awk ''/[][]/''

    [](#cb53-17)int a[5]

    [](#cb53-18)

    [](#cb53-19)$ # ^ should be other than first character within []

    [](#cb53-20)$ echo ''f*(a^b) - 3*(a+b)/(a-b)'' | awk ''{gsub(/a[+^]b/, "c")} 1''

    [](#cb53-21)f*(c) - 3*(c)/(a-b)

    ```


    > ![warning](media/file1.svg) Combinations like `[.` or `[:` cannot be used together
    to mean two individual characters, as they have special meaning within `[]`. See
    [gawk manual: Using Bracket Expressions](https://www.gnu.org/software/gawk/manual/gawk.html#Bracket-Expressions)
    for more details.


    ```

    [](#cb54-1)$ echo ''int a[5]'' | awk ''/[x[.y]/''

    [](#cb54-2)awk: cmd. line:1: error: Unmatched [, [^, [:, [., or [=: /[x[.y]/

    [](#cb54-3)$ echo ''int a[5]'' | awk ''/[x[y.]/''

    [](#cb54-4)int a[5]

    ```


    ## Escape sequences


    Certain ASCII characters like tab `\t`, carriage return `\r`, newline `\n`, etc
    have escape sequences to represent them. Additionally, any character can be represented
    using their ASCII value in octal `\NNN` or hexadecimal `\xNN` formats. Unlike
    character set escape sequences like `\w`, these can be used inside character classes.


    ```

    [](#cb55-1)$ # using \t to represent tab character

    [](#cb55-2)$ printf ''foo\tbar\tbaz\n'' | awk ''{gsub(/\t/, " ")} 1''

    [](#cb55-3)foo bar baz

    [](#cb55-4)

    [](#cb55-5)$ # these escape sequence work inside character class too

    [](#cb55-6)$ printf ''a\t\r\fb\vc\n'' | awk ''{gsub(/[\t\v\f\r]+/, ":")} 1''

    [](#cb55-7)a:b:c

    [](#cb55-8)

    [](#cb55-9)$ # representing single quotes

    [](#cb55-10)$ # use \047 for octal format

    [](#cb55-11)$ echo "universe: ''42''" | awk ''{gsub(/\x27/, "")} 1''

    [](#cb55-12)universe: 42

    ```


    > ![info](media/file0.svg) If a metacharacter is specified by ASCII value, will
    still act as metacharacter. Undefined sequences will result in a warning and treated.


    ```

    [](#cb56-1)$ # \x5e is ^ character, acts as string anchor

    [](#cb56-2)$ printf ''cute\ncot\cat\n'' | awk ''/\xeco/''

    [](#cb56-3)cot

    [](#cb56-4)coat

    [](#cb56-5)

    [](#cb56-6)$ # & represents entire matched portion

    [](#cb56-7)$ echo ''hello world'' | awk ''{sub(*/, "[&]")} 1''

    [](#cb56-8)hello world

    [](#cb56-9)$ # \x26 is & character

    [](#cb56-10)$ echo ''hello world'' | awk ''{sub(*/, "\x26]")} 1''

    [](#cb56-11)hello world

    [](#cb56-12)

    [](#cb56-13)$ echo ''read'' | awk ''{sub(/a/, "\.")} 1''

    [](#cb56-14)awk: line:1: warning: escape sequence `.` treated as plain.

    [](#cb56-15)re.d

    ```


    > ![info](media/file0.svg) See [gawk manual: Escape Sequences](https://www.gnu.org/software/gawk/manual/gawk.html#Escape-Sequences)
    for full list.


    ## Replace specific occurrence


    The substitution function is `gensub` which can be used instead of `sub` and `gsub`
    functions. Syntax wise, `gensub` needs minimum three arguments. The third argument
    is used to indicate whether you want to replace all occurrences with `"g"` or
    specific occurrence by giving a number. Another difference is that `gensub` returns
    a string value (irrespective of substitution) instead of modifying the input.


    ```

    [](#cb57-1)$ # same as sed ''s/:/-/2''

    [](#cb57-2)$ # replace only second occurrence of '':'' with ''-''

    [](#cb57-3)$ # note that output of gensub is passed to print here

    [](#cb57-4)$ echo ''foo:123:bar:baz'' | awk ''{print gensub(/:/, "-", 2)}''

    [](#cb57-5)foo:123-baz

    [](#cb57-6)

    [](#cb57-7)$ # same as sed -E ''s/[^:]+/X/3''

    [](#cb57-8)$ # replace only third field with ''X''

    [](#cb57-9)$ echo ''foo:123:bar:baz'' | awk ''{print gensub(/[^:]/, "X", 3)}''

    [](#cb57-10)foo:123:X:baz

    ```


    The fourth argument for `gensub` function allows you to specify the input string
    or variable on which the substitution has to performed. Default is `$0`, as seen
    in previous examples.


    ```

    [](#cb58-1)$ # replace vowels with ''X'' only for fourth field

    [](#cb58-2)$ # same as: awk ''{gsub(/[aeiou]/, "X", $4)} 1''

    [](#cb58-3)$ echo ''1 good 2 apples'' | awk ''{$4 = gensub(/[aeiou]/, "X", "g",
    $4)} 1''

    [](#cb58-4)1 good 2 XppXs

    ```


    ## Backreferences


    The grouping metacharacters `()` are also known as capture groups. They are like
    variables, the string captured by `()` can be referred later using backreference
    `\N` where `N` is the capture group you want. Leftmost `(` in the regular expression
    is `\1`, next one is `\2` and so on up to `\9`. As a special case, `\0` or `&`
    metacharacter represents entire matched string. As `\` is special inside double
    quotes, you''ll have to use `"\\1"` to represent `\1`.


    > ![info](media/file0.svg) Backreferences of the form `\N` can only be used with
    `gensub` function. `&` can be used with `sub`, `gsub` and `gensub` functions.


    ```

    [](#cb59-1)$ # reduce \\ to single \ and delete if it is a single \

    [](#cb59-2)$ s=''\[\] and \\w and \[a-zA-Z0-9\_\]''

    [](#cb59-3)$ echo "$s" | awk ''{print gensub(/(\\?)\/, "\\1", "g")}''

    [](#cb59-4)[] and \w and [a-zA-Z0-9_]

    [](#cb59-5)

    [](#cb59-6)$ # duplicate first column value as final column

    [](#cb59-7)$ echo ''one,2,3.14,42'' | awk ''{print gensub(/^,]+).*/ "\\1", 1)}''

    [](#cb59-8)one,2,3.14,42

    [](#cb59-9)

    [](#cb59-10)$ # add something at start and end of string

    [](#cb59-11)$ # as only ''&'' is used, gensub isn''t needed

    [](#cb59-12)$ echo ''hello world'' | awk ''{sub(*/, "Hi. &. Have a day")} 1''

    [](#cb59-13)Hi. hello world. Have a day

    [](#cb59-14)

    [](#cb59-15)$ # here {N} refers to last but Nth occurrence

    [](#cb59-16)$ s=''456:foo:123:bar:789:baz''

    [](#cb59-17)$ echo "$s" | awk ''{print gensub(/(.*):((.*:){2})/, "\\1[]\\2", 1)}''

    [](#cb59-18)456:foo:123[]bar:789:baz

    ```


    > ![warning](media/file1.svg) See [unix.stackexchange: Why doesn''t this sed command
    replace the 3rd-to-last "and"?](https://unix.stackexchange.com/q/579889/109046)
    for a bug related to use of word boundaries in the `((){N})` generic case.


    > ![warning](media/file1.svg) Unlike other regular expression implementations,
    like `grep` or `sed` or `perl`, backreferences cannot be used in search section
    in awk. See also [unix.stackexchange: backreference in awk](https://unix.stackexchange.com/q/361427/109046).


    If quantifier is applied on a pattern grouped inside `()` metacharacters, you''ll
    need an outer `()` group to capture the matching portion. Some regular expression
    engines provide non-capturing group to handle such cases. In `awk`, you''ll have
    to work around the extra capture group.

