    # Preface


    When it comes to command line text processing, from an abstract point of view,
    there are three major pillars — `grep` for filtering, `sed` for substitution and
    `awk` for field processing. These tools have some overlapping features too, for
    example, all three of them have extensive filtering capabilities.


    Unlike `grep` and `sed`, `awk` is a full blown programming language. However,
    this book intends to showcase `awk` one-liners that can be composed from the command
    line instead of writing a program file.


    This book heavily leans on examples to present options and features of `awk` one
    by one. It is recommended that you manually type each example and experiment with
    them. Understanding both the nature of sample input string and the output produced
    is essential. As an analogy, consider learning to drive a bike or a car — no matter
    how much you read about them or listen to explanations, you need to practice a
    lot and infer your own conclusions. Should you feel that copy-paste is ideal for
    you, [code snippets are available chapter wise on GitHub](https://github.com/learnbyexample/learn_gnuawk/tree/master/code_snippets).


    ## Prerequisites


    * Prior experience working with command line and `bash` shell, should know concepts
    like file redirection, command pipeline and so on.

    * Familiarity with programming concepts like variables, printing, functions, control
    structures, arrays, etc.

    * Knowing basics of `grep` and `sed` will help in understanding similar features
    of `awk`.


    If you are new to the world of command line, check out my curated resources on
    [Linux CLI and Shell scripting](https://learnbyexample.github.io/curated_resources/linux_cli_scripting.html)
    before starting this book.


    My [Command Line Text Processing](https://github.com/learnbyexample/Command-line-text-processing)
    repository includes a chapter on `GNU awk` which has been edited and restructured
    to create this book.


    ## Conventions


    * The examples presented here have been tested on `GNU bash` shell with `GNU awk
    5.1.0` and includes features not available in earlier versions.

    * Code snippets shown are copy pasted from `bash` shell and modified for presentation
    purposes. Some commands are preceded by comments to provide context and explanations.
    Blank lines have been added to improve readability, only `real` time is shown
    for speed comparisons, output is skipped for commands like `wget` and so on.

    * Unless otherwise noted, all examples and explanations are meant for `ASCII`
    characters.

    * `awk` would mean `GNU awk`, `grep` would mean `GNU grep` and so on unless otherwise
    specified.

    * External links are provided for further reading throughout the book. Not necessary
    to immediately visit them. They have been chosen with care and would help, especially
    during re-reads.

    * The [learn_gnuawk repo](https://github.com/learnbyexample/learn_gnuawk) has
    all the code snippets and files used in examples, exercises and other details
    related to the book. If you are not familiar with `git` command, click the `Code`
    button on the webpage to get the files.


