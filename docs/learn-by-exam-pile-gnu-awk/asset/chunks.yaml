    `sub` 和 `gsub` 函数的第一个参数是用于匹配输入内容的正则表达式。第二个参数是替换字符串。字符串字面量在双引号内指定。在上面的示例中，`sub`
    和 `gsub` 被用在块内部，因为它们并不是设计用于条件表达式的。块后面的 `1` 被视为条件表达式，因为它是在块外部使用的。你也可以使用下面展示的变体来获得相同的结果。


    *   `awk ''{sub(/:/, "-")} 1''` 等同于 `awk ''{sub(/:/, "-"); print $0}''`

    *   你也可以用 `print` 代替 `print $0`，因为 `$0` 是默认字符串。


    > ![info](img/file0.svg) 你可能可能会奇怪，既然已经可以用 `awk` 实现相同的结果，为什么还要使用或学习 `grep` 和 `sed`呢？这取决于你尝试解决的问题。对于简单的行过滤，`grep`
    会比 `sed` 或 `awk` 更快，因为 `grep` 针对此类情况进行了优化。同样，对于替换场景，`sed` 会比 `awk` 快。此外，并不是所有功能都能在这些工具之间轻松转换。例如，用
    `sed` 或 `awk` 编写 `grep -o` 需要更多的代码步骤。只有 `grep` 提供递归搜索。诸此类推。另请参见 [unix.stackexchange:
    When to use grep, sed, awk, perl, etc.](https://unix.stackexchange.com/q/303044/109046)。


    ## 字段处理


    如前所述，`awk` 主要用于基于字段的处理。考虑下面所示的示例输入文件，字段由单个空格字符分隔。


    > ![info](img/file0.svg) [learn_gnuawk 仓库](https://github.com/learnbyexample/learn_gnuawk/tree/master/example_files)
    包含了示例中使用的所有文件。


    ```

    [](#cb8-1)$ cat table.txt

    [](#cb8-2)brown bread mat hair 42

    [](#cb8-3)blue cake mug shirt -7

    [](#cb8-4)yellow banana window shoes 3.14

    ```


    这里是一些基于特定字段而非整行的示例。默认情况下，`awk` 根据空格分割输入行，字段内容可以通过 `$N` 访问，其中 `N` 是所需的字段编号。特殊变量
    `NF` 会更新为每行输入的字段总数。虽然还有更多细节需要介绍，但目前这些足够继续操作了。


    ```

    [](#cb9-1)$ # 打印每个输入行的第二个字段

    [](#cb9-2)$ awk ''{print $2}'' table.txt

    [](#cb9-3)bread

    [](#cb9-4)cake

    [](#cb9-5)banana

    [](#cb9-6)

    [](#cb9-7)$ # 仅当最后一个字段为负数时打印这些行

