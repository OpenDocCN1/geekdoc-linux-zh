    \ Joel    72\n\n[](#cb243-18)CSE     Surya   81\n\n[](#cb243-19)ECE     Om   \
    \   92\n\n[](#cb243-20)CSE     Amy     67\n\n```\n\nFor multiple field comparison,\
    \ you need to construct the key robustly. Simply concatenating field values can\
    \ lead to false matches. For example, field values `abc` and `123` will wrongly\
    \ match `ab` and `c123`. To avoid this, you may introduce some string between\
    \ the field values, say `\"_\"` (if you know the field themselves cannot have\
    \ this character) or `FS` (safer option). You could also allow `awk` to bail you\
    \ out. If you use `,` symbol (not `\",\"` as a string) between field values, the\
    \ value of special variable `SUBSEP` is inserted. `SUBSEP` has a default value\
    \ of the non-printing character `\\034` which is usually not used as part of text\
    \ files.\n\n```\n\n[](#cb244-1)$ cat dept_name.txt\n\n[](#cb244-2)EEE Moi\n\n\
    [](#cb244-3)CSE Amy\n\n[](#cb244-4)ECE Raj\n\n[](#cb244-5)\n\n[](#cb244-6)$ #\
    \ uses SUBSEP as separator between field values to construct the key\n\n[](#cb244-7)$\
    \ # note the use of parentheses for key testing\n\n[](#cb244-8)$ awk 'NR==FNR{a[$1,$2];\
    \ next} ($1,$2) in a' dept_name.txt marks.txt\n\n[](#cb244-9)ECE     Raj     53\n\
    \n[](#cb244-10)EEE     Moi     68\n\n[](#cb244-11)CSE     Amy     67\n\n```\n\n\
    In this example, one of the field is used for numerical comparison.\n\n```\n\n\
    [](#cb245-1)$ cat dept_mark.txt\n\n[](#cb245-2)ECE 70\n\n[](#cb245-3)EEE 65\n\n\
    [](#cb245-4)CSE 80\n\n[](#cb245-5)\n\n[](#cb245-6)$ # match Dept and minimum marks\
    \ specified in dept_mark.txt\n\n[](#cb245-7)$ awk 'NR==FNR{d[$1]=$2; next}\n\n\
    [](#cb245-8) $1 in d && $3 >= d[$1]' dept_mark.txt marks.txt\n\n[](#cb245-9)ECE\
    \     Joel    72\n\n[](#cb245-10)EEE     Moi     68\n\n[](#cb245-11)CSE     Surya\
    \   81\n\n[](#cb245-12)ECE     Om      92\n\n```\n\nHere's an example of adding\
    \ a new field.\n\n```\n\n[](#cb246-1)$ cat role.txt\n\n[](#cb246-2)Raj class_rep\n\
    \n[](#cb246-3)Amy sports_rep\n\n[](#cb246-4)Tia placement_rep\n\n[](#cb246-5)\n\
    \n[](#cb246-6)$ awk -v OFS='\\t' 'NR==FNR{r[$1]=$2; next}\n\n[](#cb246-7) {$(NF+1)\
    \ = FNR==1 ? \"Role\" : r[$2]} 1' role.txt marks.txt\n\n[](#cb246-8)Dept    Name\
    \    Marks   Role\n\n[](#cb246-9)ECE     Raj     53      class_rep\n\n[](#cb246-10)ECE\
    \     Joel    72\n\n[](#cb246-11)EEE     Moi     68\n\n[](#cb246-12)CSE     Surya\
    \   81\n\n[](#cb246-13)EEE     Tia     59      placement_rep\n\n[](#cb246-14)ECE\
    \     Om      92\n\n[](#cb246-15)CSE     Amy     67      sports_rep\n\n```\n\n\
    ## getline\n\nAs the name indicates, `getline` function allows you to read a line\
    \ from a file on demand. This is most useful when you need something based on\
    \ line number. The following example shows how you can replace `m`th line from\
    \ a file with `n`th line from another file. There are many syntax variations with\
    \ `getline`, here the line read is saved in a variable.\n\n```\n\n[](#cb247-1)$\
    \ # return value handling is not shown here, but should be done ideally\n\n[](#cb247-2)$\
    \ awk -v m=3 -v n=2 'BEGIN{while(n-- > 0) getline s < \"greeting.txt\"}\n\n[](#cb247-3)\
    \ FNR==m{$0=s} 1' table.txt\n\n[](#cb247-4)brown bread mat hair 42\n\n[](#cb247-5)blue\
    \ cake mug shirt -7\n\n[](#cb247-6)Have a nice day\n\n```\n\nHere's an example\
    \ where two files are processed simultaneously. In this case, the return value\
    \ of `getline` is also used. It will be `1` if line was read successfully, `0`\
    \ if there's no more input to be read as end of file has already been reached\
    \ and `-1` if something went wrong. The `ERRNO` special variable will have details\
    \ regarding the issues.\n\n```\n\n[](#cb248-1)$ # print line from greeting.txt\
    \ if last column of corresponding line\n\n[](#cb248-2)$ # from table.txt is +ve\
    \ number\n\n[](#cb248-3)$ awk -v file='table.txt' '(getline line < file)==1{n=split(line,\
    \ a);\n\n[](#cb248-4) if(a[n]>0) print}' greeting.txt\n\n[](#cb248-5)Hi there\n\
    \n[](#cb248-6)Good bye\n\n```\n\nIf a file is passed as argument to `awk` command\
    \ and cannot be opened, you get an error. For example:\n\n```\n\n[](#cb249-1)$\
    \ awk '{print $2}' xyz.txt\n\n[](#cb249-2)awk: fatal: cannot open file `xyz.txt'\
    \ for reading (No such file or directory)\n\n```\n\nIt is recommended to always\
    \ check for return value when using `getline` or perhaps use techniques from previous\
    \ sections to avoid `getline` altogether.\n\n```\n\n[](#cb250-1)$ # xyz.txt doesn't\
    \ exist, but output doesn't show something went wrong\n\n[](#cb250-2)$ awk '{getline\
    \ line < \"xyz.txt\"; print $NF, line}' table.txt\n\n[](#cb250-3)42 \n\n[](#cb250-4)-7\
    \ \n\n[](#cb250-5)3.14 \n\n[](#cb250-6)\n\n[](#cb250-7)$ awk -v file='xyz.txt'\
    \ '{ e=(getline line < file);\n\n[](#cb250-8) if(e<0){print file \": \" ERRNO;\
    \ exit}\n\n[](#cb250-9) print $NF, line }' table.txt\n\n[](#cb250-10)xyz.txt:\
    \ No such file or directory"
