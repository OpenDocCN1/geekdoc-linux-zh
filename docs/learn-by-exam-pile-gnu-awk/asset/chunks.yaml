    # 原地文件编辑


    在目前为止的示例中，`awk` 的输出显示在终端上。本章将讨论如何使用 `-i` 命令行选项将更改写回输入文件本身。该选项可以配置为在不创建原始内容备份的情况下对输入文件进行更改。


    ## 不使用备份


    `-i` 选项允许你加载库（详情请 [gawk 手册: -i 选项](https://www.gnu.org/software/gawk/manual/gawk.html#index-_002di-option)）。`inplace`
    库随 `awk` 安装默认提供。使用 `-i inplace` 表示 `awk` 应该修改原始输入。请谨慎使用此选项，最好在测试代码按预期工作之后。


    ```

    [](#cb139-1)$ cat greet.txt

    [](#cb139-2)Hi there

    [](#cb139-3)Have a nice day

    [](#cb139-4)Good bye

    [](#cb139-5)

    [](#cb139-6)$ # 为行号添加前缀

    [](#cb139-7)$ awk -i inplace ''{print NR ". " $0}'' greet.txt

    [](#cb139-8)$ cat greet.txt

    [](#cb139-9)1. Hi there

    [](#cb139-10)2. Have a nice day

    [](#cb139-11)3. Good bye

    ```


    多个输入文件会被分别处理，更改会被写回各自对应的文件。


    ```

    [](#cb140-1)$ cat f1.txt

    [](#cb140-2)I ate 3 apples

    [](#cb140-3)$ cat f2.txt

    [](#cb140-4)I bought two balls and 3 bats

    [](#cb140-5)

    [](#cb140-6)$ awk -i inplace ''{gsub(/\<3\>/, "three")} 1'' f1.txt f2.txt

    [](#cb140-7)$ cat f1.txt

    [](#cb140-8)I ate three apples

    [](#cb140-9)$ cat f2.txt

    [](#cb140-10)I bought two balls and three bats

    ```


    ## 使用备份


    可以通过设置特殊变量 `inplace::suffix` 来提供备份扩展名。例如，如果输入文件是 `ip.txt` 并使用了 `inplace::suffix`，则备份文件将命名为
    `ip.txt.orig`。


