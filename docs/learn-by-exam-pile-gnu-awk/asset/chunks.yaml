    # Regular Expressions


    Regular Expressions is a versatile tool for text processing. It helps to precisely
    define a matching criteria. For learning and understanding purposes, one can view
    regular expressions as a mini programming language in itself, specialized for
    text processing. Parts of a regular expression can be saved for future use, analogous
    to variables and functions. There are ways to perform AND, OR, NOT conditionals,
    features to concisely define repetition to avoid manual replication and so on.


    Here''s some common use cases.


    *   Sanitizing a string to ensure that it satisfies a known set of rules. For
    example, to check if a given string matches password rules.


    *   Filtering or extracting portions on an abstract level like alphabets, numbers,
    punctuation and so on.


    *   Qualified string replacement. For example, at the start or the end of a string,
    only whole words, based on surrounding text, etc.


    This chapter will cover regular expressions as implemented in `awk`. Most of `awk`''s
    regular expression syntax is similar to Extended Regular Expression (ERE) found
    with `grep -E` and `sed -E`. Unless otherwise indicated, examples and descriptions
    will assume ASCII input.


    > ![info](media/file0.svg) See also [POSIX specification](https://pubs.opengroup.org/onlinepubs/9699919799/basedefs/V1_chap09.html)
    for regular expressions. And [unix.stackexchange: Why does my regular expression
    work in X but not in Y?](https://unix.stackexchange.com/q/119905/109046)


    ## Syntax and variable assignment


    As seen in previous chapter, the syntax is `string ~ /regexp/` to check if the
    given string satisfies the rules specified by the regexp. And `string !~ /regexp/`
    to invert the condition. By default, `$0` is checked if the string isn''t specified.
    You can also save a regexp literal in a variable by prefixing `@` symbol. The
    prefix is needed because `/regexp/` by itself would mean `$0 ~ /regexp/`.


    ```

    [](#cb23-1)$ printf ''spared no one\ngrasped\nspar\n'' | awk ''/ed/''

    [](#cb23-2)spared no one

    [](#cb23-3)grasped

    [](#cb23-4)

    [](#cb23-5)$ printf ''spared no one\ngrasped\nspar\n'' | awk ''BEGIN{r = @/ed/}
    $0 ~ r''

    [](#cb23-6)spared no one

    [](#cb23-7)grasped

    ```


    ## String Anchors


    In the examples seen so far, the regexp was a simple string value without any
    special characters. Also, the regexp pattern evaluated to `true` if it was found
    anywhere in the string. Instead of matching anywhere in the string, restrictions
    can be specified. These restrictions are made possible by assigning special meaning
    to certain characters and escape sequences. The characters with special meaning
    are known as **metacharacters** in regular expressions parlance. In case you need
    to match those characters literally, you need to escape them with a `\` (discussed
    in [Matching the metacharacters](#ch004.xhtml_matching-the-metacharacters) section).


    There are two string anchors:


    *   `^` metacharacter restricts the matching to the start of string


    *   `$` metacharacter restricts the matching to the end of string


    ```

    [](#cb24-1)$ # string starting with ''sp''

    [](#cb24-2)$ printf ''spared no one\ngrasped\nspar\n'' | awk ''/^sp/''

    [](#cb24-3)spared no one

    [](#cb24-4)spar

    [](#cb24-5)

    [](#cb24-6)$ # string ending with ''ar''

    [](#cb24-7)$ printf ''spared no one\ngrasped\nspar\n'' | awk ''/ar$/''

    [](#cb24-8)spar

    [](#cb24-9)

    [](#cb24-10)$ # change only whole string ''spar''

    [](#cb24-11)$ # can also use: awk ''/^spar$/{$0 = 123} 1'' or awk ''$0=="spar"{$0
    = 123} 1''

    [](#cb24-12)$ printf ''spared no one\ngrasped\nspar\n'' | awk ''{sub(/^spar$/,
    "123")} 1''

    [](#cb24-13)spared no one

    [](#cb24-14)grasped

    [](#cb24-15)123

    ```


    The anchors can be used by themselves as a pattern. Helps to insert text at the
    start or end of string, emulating string concatenation operations. These might
    not feel like useful capability, but combined with other features they become
    quite a handy tool.


    ```

    [](#cb25-1)$ printf ''spared no one\ngrasped\nspar\n'' | awk ''{gsub(/^/, "* ")}
    1''

    [](#cb25-2)* spared no one

    [](#cb25-3)* grasped

    [](#cb25-4)* spar

    [](#cb25-5)

    [](#cb25-6)$ # append only if string doesn''t contain space characters

    [](#cb25-7)$ printf ''spared no one\ngrasped\nspar\n'' | awk ''!/ /{gsub(/$/,
    ".")} 1''

    [](#cb25-8)spared no one

    [](#cb25-9)grasped.

    [](#cb25-10)spar.

    ```


    > ![info](media/file0.svg) See also [Behavior of ^ and $ when string contains
    newline](#ch016.xhtml_behavior-of--and--when-string-contains-newline) section.


    ## Word Anchors


    The second type of restriction is word anchors. A word character is any alphabet
    (irrespective of case), digit and the underscore character. You might wonder why
    there are digits and underscores as well, why not only alphabets? This comes from
    variable and function naming conventions — typically alphabets, digits and underscores
    are allowed. So, the definition is more programming oriented than natural language.'
