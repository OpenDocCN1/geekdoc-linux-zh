    # 字段分隔符


    现在你已经熟悉了 `awk` 语法和正则表达式，本章将深入探讨字段处理。你将学习如何设置输入输出字段分隔符、如何使用正则表达式定义字段以及如何处理固定长度字段。


    ## 默认字段分隔


    如之前所示，`awk` 自动将输入拆分为字段，可以使用 `$N` 访问，其中 `N` 是所需的字段编号。你也可以传递表达式而不是数字字面量来指定所需的字段。


    ```

    [](#cb81-1)$ cat table.txt

    [](#cb81-2)brown bread mat hair 42

    [](#cb81-3)blue cake mug shirt -7

    [](#cb81-4)yellow banana window shoes 3.14

    [](#cb81-5)

    [](#cb81-6)$ # 如果第一个字段以 ''b'' 开头，则打印第四字段

    [](#cb81-7)$ awk ''$1 ~ /^b/{print $4}'' table.txt

    [](#cb81-8)hair

    [](#cb81-9)shirt

    [](#cb81-10)$ # 打印存储在变量 ''f'' 中的字段

    [](#cb81-11)$ awk -v f=3 ''{print $f}''

    [](#cb81-12)mat

    [](#cb81-13)mug

    [](#cb81-14)window

    ```


    `NF` 特殊变量将给出一个每行的字段数。当你不知道输入中有多少字段且需要从末尾指定字段编号时，这非常有用。


    ```

    [](#cb82-1)$ # 打印每行的最后一个字段

    [](#cb82-2)$ awk ''{print $NF}'' table.txt

    [](#cb82-3)42

    [](#cb82-4)-7

    [](#cb82-5)3.14

    [](#cb82-6)$ # 打印倒数第二个字段

    [](#cb82-7)$ awk ''{print $NF-1}'' table.txt

    [](#cb82-8)hair

    [](#cb82-9)shoes

    [](#cb82-10)$ # 别忘记括号！

    [](#cb82-11)$ awk ''{print $NF-1}''

    [](#cb82-12)14

    ```


    默认情况下，`awk` 不仅按空格拆分输入，还会根据一个或多个空格、制表符或换行符进行拆分。此外，输入开头或结尾的这三种字符会被修剪，不作为内容的一部分。包含换行符的输入将包含在记录分隔符中。


    ```

    [](#cb83-1)$ echo ''a   b   c'' | awk ''{print NF}''

    [](#cb83-2)3

    [](#cb83-3)$ # 注意领先空格不是字段内容

    [](#cb83-4)$ echo ''a   b   c'' | awk ''{print $1}''

    [](#cb83-5)a

    [](#cb83-6)$ # 注意尾随空格不是字段内容

    [](#cb83-7)$ echo ''a   b   c'' | awk ''{print $NF}''

    [](#cb83-8)c.

    [](#cb83-9)$ # 这里包含制表符的另一个示例

    [](#cb83-10)$ printf ''one \t two\tthree'' | awk ''{print NF}''

    [](#cb83-11)3

    [](#cb83-12)$ printf ''one \t\tthree'' | awk ''{print $2}''

    [](#cb83-13)two.

    ```


    > ![warning](img/file.svg) 当传递表达式作为字段时，浮点结果是可以接受的。小数部分会被忽略。然而，由于精度限制，可能会导致舍入。


    ```

    [](#cb84-1)$ awk ''BEGIN{printf "%.16f\n", 2.999999999999999}''

    [](#cb84-2)2.9999999999999991

    [](#cb84-3)$ awk ''BEGIN{printf "%.16f\n", 2.999999999999999}''

    [](#cb84-4)3.0000000000000000

    [](#cb84-5)

    [](#cb84-6)$ # 相当于：awk ''{print $2}'' table.txt

    [](#cb84-7)$ awk ''{print $2.999999999999999}'' table.txt

    [](#cb84-8)bread

    [](#cb84-9)cake

    [](#cb84-10)banana

    [](#cb84-11)$ # 相当于：awk ''{print $3}'' table.txt

    [](#cb84-12)$ awk ''{print $2.999999999999999}'' table.txt

    [](#cb84-13)mat

    [](#cb84-14)mug

    [](#cb84-15)window


    ## 输入字段分隔符


    更改默认字段分隔符常用的方法是使用 `-F` 命令行选项。传递给选项的值将被视为字符串字面量，然后转换为正则表达式。这里是一些没有任何特殊正则表达式的示例。


    ```

    [](#cb85-1)$ # 使用 '':'' 作为输入字段分隔符

    [](#cb85-2)$ echo ''goal:amazing:whistle:kwality'' | awk -F: ''{print $1}''

    [](#cb85-3)goal

    [](#cb85-4)$ echo ''goal:amazing:whistle:kwality'' | awk -F: ''{print $NF}''

    [](#cb85-5)kwality

    [](#cb85-6)

    [](#cb85-7)$ # 使用引号避免与 shell 特殊字符冲突

    [](#cb85-8)$ echo ''one;two;three;four'' | awk -F'';'' ''{print $3}''

    [](#cb85-9)three

    [](#cb85-10)

    [](#cb85-11)$ # 第一个和最后一个字段将为空字符串

    [](#cb85-12)$ echo ''=a=b=c='' | awk -F= ''{print $1 "[" $NF ""]}''

    [](#cb85-13)[]

    ```


    你也可以直接设置特殊变量 `FS` 来更改输入字段分隔符。这可以通过命令行使用 `-v` 选项，或在代码块内完成。


    ```

    [](#cb86-1)$ echo ''goal:amazing:whistle:kwality'' | awk -v FS=: ''{print $2}''

    [](#cb86-2)amazing

    [](#cb86-3)

    [](#cb86-4)$ # 字段分隔符也可以是多个字符

    [](#cb86-5)$ echo ''1e4SPT2k6SPT3a5SPT4z0'' | awk ''BEGIN{FS="SPT"} {print $3}''

    [](#cb86-6)3a5

    ```


    如果你希望将输入拆分为单个字符，请使用空字符串作为字段分隔符。


    ```

    [](#cb87-1)$ # 注意 -F 和 '''' 之间的空格是强制的

    [](#cb87-2)$ echo ''apple'' | awk -F '''' ''{print $1}''

    [](#cb87-3)a

    [](#cb87-4)$ echo ''apple'' | awk -v FS= ''{print $NF}''

    [](#cb87-5)e

    [](#cb87-6)

    [](#cb87-7)$ # 根据区域设置，你也可以处理多字节字符

    [](#cb87-8)$ echo ''αλεπού'' | awk -v FS= ''{print $3}''

    [](#cb87-9)ε

    ```


    '
- fmt: '

    Here''s some examples with regexp based field separator. The value passed to `-F`
    or `FS` is treated as a string and then converted to regexp. So, you''ll need
    `\\` instead of `\` to mean a backslash character. The good news is that for single
    characters that are also regexp metacharacters, they''ll be treated literally
    and you do not need to escape them.


    ```

    [](#cb88-1)$ echo ''Sample123string42with777numbers'' | awk -F''[0-9]+'' ''{print
    $2}''

    [](#cb88-2)string

    [](#cb88-3)$ echo ''Sample123string42with777numbers'' | awk -F''[a-zA-Z]+'' ''{print
    $2}''

    [](#cb88-4)123

    [](#cb88-5)

    [](#cb88-6)$ # note the use of \\W to indicate \W

    [](#cb88-7)$ echo ''load;err_msg--\ant,r2..not'' | awk -F''\\W+'' ''{print $3}''

    [](#cb88-8)ant

    [](#cb88-9)

    [](#cb88-10)$ # same as: awk -F''\\.'' ''{print $2}''

    [](#cb88-11)$ echo ''hi.bye.hello'' | awk -F. ''{print $2}''

    [](#cb88-12)bye

    [](#cb88-13)

    [](#cb88-14)$ # count number of vowels for each input line

    [](#cb88-15)$ printf ''cool\nnice car\n'' | awk -F''[aeiou]'' ''{print NF-1}''

    [](#cb88-16)2

    [](#cb88-17)3

    ```


    > ![warning](media/file1.svg) The default value of `FS` is single space character.
    So, if you set input field separator to single space, then it will be the same
    as if you are using the default split discussed in previous section. If you want
    to override this behavior, you can use space inside a character class.


    ```

    [](#cb89-1)$ # same as: awk ''{print NF}''

    [](#cb89-2)$ echo ''   a   b   c   '' | awk -F'' '' ''{print NF}''

    [](#cb89-3)3

    [](#cb89-4)$ # there are 12 space characters, thus 13 fields

    [](#cb89-5)$ echo ''   a   b   c   '' | awk -F''[ ]'' ''{print NF}''

    [](#cb89-6)13

    ```


    > ![warning](media/file1.svg) If `IGNORECASE` is set, it will affect field separation
    as well. Except when field separator is a single character, which can be worked
    around by using a character class.


    ```

    [](#cb90-1)$ echo ''RECONSTRUCTED'' | awk -F''[aeiou]+'' -v IGNORECASE=1 ''{print
    $1}''

    [](#cb90-2)R

    [](#cb90-3)

    [](#cb90-4)$ # when FS is a single character

    [](#cb90-5)$ echo ''RECONSTRUCTED'' | awk -F''e'' -v IGNORECASE=1 ''{print $1}''

    [](#cb90-6)RECONSTRUCTED

    [](#cb90-7)$ echo ''RECONSTRUCTED'' | awk -F''[e]'' -v IGNORECASE=1 ''{print $1}''

    [](#cb90-8)R

    ```


    ## Output field separator


    The `OFS` special variable controls the output field separator. `OFS` is used
    as the string between multiple arguments passed to `print` function. It is also
    used whenever `$0` has to be reconstructed as a result of changing field contents.
    The default value for `OFS` is a single space character, just like for `FS`. There
    is no command line option though, you''ll have to change `OFS` directly.


    ```

    [](#cb91-1)$ # printing first and third field, OFS is used to join these values

    [](#cb91-2)$ # note the use of , to separate print arguments

    [](#cb91-3)$ awk ''{print $1, $3}'' table.txt

    [](#cb91-4)brown mat

    [](#cb91-5)blue mug

    [](#cb91-6)yellow window

    [](#cb91-7)

    [](#cb91-8)$ # same FS and OFS

    [](#cb91-9)$ echo ''goal:amazing:whistle:kwality'' | awk -F: -v OFS=: ''{print
    $2, $NF}''

    [](#cb91-10)amazing:kwality

    [](#cb91-11)$ echo ''goal:amazing:whistle:kwality'' | awk ''BEGIN{FS=OFS=":"}
    {print $2, $NF}''

    [](#cb91-12)amazing:kwality

    [](#cb91-13)

    [](#cb91-14)$ # different values for FS and OFS

    [](#cb91-15)$ echo ''goal:amazing:whistle:kwality'' | awk -F: -v OFS=- ''{print
    $2, $NF}''

    [](#cb91-16)amazing-kwality

    ```


    Here''s some examples for changing field contents and then printing `$0`.


    ```

    [](#cb92-1)$ echo ''goal:amazing:whistle:kwality'' | awk -F: -v OFS=: ''{$2 =
    42}''

    [](#cb92-2)goal:42:whistle:kwality

    [](#cb92-3)$ echo ''goal:amazing:whistle:kwality'' | awk -F: -v OFS=, ''{$2 =
    42}''

    [](#cb92-4)goal,42,whistle,kwality

    [](#cb92-5)

    [](#cb92-6)$ # recall that spaces at/end gets trimmed for default FS

    [](#cb92-7)$ echo ''   a   b   c   '' | awk ''{$NF = "last"}''

    [](#cb92-8)a last

    ```


    Sometimes you want to print contents of `$0` with the new `OFS` but field contents
    aren''t changed. In such cases, you can assign a field value to itself to force
    reconstruction of `$0`.


    ```

    [](#cb93-1)$ # no change because was no trigger to rebuild $0

    [](#cb93-2)$ echo ''Sample123string42with777numbers'' | awk -F''[0-9]+'' -v OFS=,
    ''{$1}''

    [](#cb93-3)Sample123string42with777numbers

    [](#cb93-4)

    [](#cb93-5)$ # assign a field to itself in such cases

    [](#cb93-6)$ echo ''Sample123string42with777numbers'' | awk -F''[0-9]+'' -v OFS=,
    ''{$1=$1}''

    [](#cb93-7)Sample,string,with,numbers



    ## Manipulating NF


    `NF` value will rebuild `$0` as well.


    ```

    [](#cb94-1)$ # reducing fields

    [](#cb94-2)$ echo ''goal:amazing:whistle:kwality'' | awk -F: -v OFS=, ''{NF=2}''

    [](#cb94-3)goal,amazing

    [](#cb94-4)

    [](#cb94-5)$ # increasing fields

    [](#cb94-6)$ echo ''goal:amazing:whistle:kwality'' | awk -F: -v OFS=: ''{$(NF+1)="sea"}''

    [](#cb94-7)goal:amazing:whistle:kwality:sea

    [](#cb94-8)

    [](#cb94-9)$ # empty fields will be created as needed

    [](#cb94-10)$ echo ''goal:amazing:whistle:kwality'' | awk -F: -v OFS=: ''{$8="go"}''

    [](#cb94-11)goal:amazing:whistle:kwality::::go

    ```


    > ![warning](media/file1.svg) Assigning `NF` to `0` will delete all the fields.
    However, a negative value will result in an error.


    ```

    [](#cb95-1)$ echo ''goal:amazing:whistle:kwality'' | awk -F: -v OFS=: ''{NF=-1}''

    [](#cb95-2)awk: cmd. line:1: (FILENAME=- FNR=1) fatal: NF set to negative value

    ```


    ## FPAT


    `FS` allows to define input field separator. In contrast, `FPAT` (field pattern)
    allows to define what the fields be made up of.


    ```

    [](#cb96-1)$ s=''Sample123string42with777numbers''

    [](#cb96-2)

    [](#cb96-3)$ # define fields to be one or more consecutive digits

    [](#cb96-4)$ echo "$s" | awk -v FPAT=''[0-9]+'' ''{print $2}''

    [](#cb96-5)42

    [](#cb96-6)

    [](#cb96-7)$ # define fields to be one or more consecutive alphabets

    [](#cb96-8)$ echo "$s" | awk -v FPAT=''[a-zA-Z]+'' -v OFS=, ''{$1=$1}''

    [](#cb96-9)Sample,string,with,numbers

    ```


    `FPAT` is often used for `csv` input where fields can contain embedded delimiter
    characters. For example, a field content `"fox,42"` when `,` is the delimiter.


    ```

    [](#cb97-1)$ s=''eagle,"fox,42",bee,frog''

    [](#cb97-2)

    [](#cb97-3)$ # simply using , as separator isn''t sufficient

    [](#cb97-4)$ echo "$s" | awk -F, ''{print $2}''

    [](#cb97-5)"fox

    ```


    For such simpler `csv` input, `FPAT` helps to define fields as starting and ending
    with double quotes or containing non-comma characters.


    ```

    [](#cb98-1)$ # * is used instead of + to allow empty fields

    [](#cb98-2)$ echo "$s" | awk -v FPAT=''"[^"]*"|[^,]*'' ''{print $2}''

    [](#cb98-3)"fox,42"

    ```


    > ![warning](media/file1.svg) The above will not work for all kinds of `csv` files,
    for example if fields contain escaped double, newline characters, etc. See [stackoverflow:
    What''s the most robust way to efficiently parse CSV using awk?](https://stackoverflow.com/q/4542053/4082052)
    for such cases. You could also use other languages such as Perl, Python, Ruby,
    etc which come with standard `csv` parsing libraries or have easy access to third
    party solutions. There are also specialized command line tools such as [xsv](https://github.com/BurntSushi/xsv).


    > ![info](media/file0.svg) If `IGNORECASE` is set, it affects field matching.
    Unlike `FS`, there is no different behavior for single character pattern.


    ```

    [](#cb99-1)$ # count number of ''e'' in the input string

    [](#cb99-2)$ echo ''Read Eat Sleep'' | awk -v FPAT=''e'' ''{print NF}''

    [](#cb99-3)3

    [](#cb99-4)$ echo ''Read Eat Sleep'' | awk -v IGNORECASE=1 -v FPAT=''e'' ''{print
    NF}''

    [](#cb99-5)4

    [](#cb99-6)$ echo ''Read Eat Sleep'' | awk -v IGNORECASE=1 -v FPAT=''[e]'' ''{print
    NF}''

    [](#cb99-7)4

    ```


    ## FIELDWIDTHS


    `FIELDWIDTHS` is another feature where you get to define field contents. As indicated
    by the name, you have to specify number of characters for each field. This method
    is useful to process fixed width file inputs, and especially when they can contain
    empty fields.

    '
  raw: 'Here''s some examples with regexp based field separator. The value passed
    to `-F` or `FS` is treated as a string and then converted to regexp. So, you''ll
    need `\\` instead of `\` to mean a backslash character. The good news is that
    for single characters that are also regexp metacharacters, they''ll be treated
    literally and you do not need to escape them.


    ```

    [](#cb88-1)$ echo ''Sample123string42with777numbers'' | awk -F''[0-9]+'' ''{print
    $2}''

    [](#cb88-2)string

    [](#cb88-3)$ echo ''Sample123string42with777numbers'' | awk -F''[a-zA-Z]+'' ''{print
    $2}''

    [](#cb88-4)123

    [](#cb88-5)

    [](#cb88-6)$ # note the use of \\W to indicate \W

    [](#cb88-7)$ echo ''load;err_msg--\ant,r2..not'' | awk -F''\\W+'' ''{print $3}''

    [](#cb88-8)ant

    [](#cb88-9)

    [](#cb88-10)$ # same as: awk -F''\\.'' ''{print $2}''

    [](#cb88-11)$ echo ''hi.bye.hello'' | awk -F. ''{print $2}''

    [](#cb88-12)bye

    [](#cb88-13)

    [](#cb88-14)$ # count number of vowels for each input line

    [](#cb88-15)$ printf ''cool\nnice car\n'' | awk -F''[aeiou]'' ''{print NF-1}''

    [](#cb88-16)2

    [](#cb88-17)3

    ```


    > ![warning](media/file1.svg) The default value of `FS` is single space character.
    So, if you set input field separator to single space, then it will be the same
    as if you are using the default split discussed in previous section. If you want
    to override this behavior, you can use space inside a character class.


    ```

    [](#cb89-1)$ # same as: awk ''{print NF}''

    [](#cb89-2)$ echo ''   a   b   c   '' | awk -F'' '' ''{print NF}''

    [](#cb89-3)3

    [](#cb89-4)$ # there are 12 space characters, thus 13 fields

    [](#cb89-5)$ echo ''   a   b   c   '' | awk -F''[ ]'' ''{print NF}''

    [](#cb89-6)13

    ```


    > ![warning](media/file1.svg) If `IGNORECASE` is set, it will affect field separation
    as well. Except when field separator is a single character, which can be worked
    around by using a character class.


    ```

    [](#cb90-1)$ echo ''RECONSTRUCTED'' | awk -F''[aeiou]+'' -v IGNORECASE=1 ''{print
    $1}''

    [](#cb90-2)R

    [](#cb90-3)

    [](#cb90-4)$ # when FS is a single character

    [](#cb90-5)$ echo ''RECONSTRUCTED'' | awk -F''e'' -v IGNORECASE=1 ''{print $1}''

    [](#cb90-6)RECONSTRUCTED

    [](#cb90-7)$ echo ''RECONSTRUCTED'' | awk -F''[e]'' -v IGNORECASE=1 ''{print $1}''

    [](#cb90-8)R

    ```


    ## Output field separator


    The `OFS` special variable controls the output field separator. `OFS` is used
    as the string between multiple arguments passed to `print` function. It is also
    used whenever `$0` has to be reconstructed as a result of changing field contents.
    The default value for `OFS` is a single space character, just like for `FS`. There
    is no command line option though, you''ll have to change `OFS` directly.


    ```

    [](#cb91-1)$ # printing first and third field, OFS is used to join these values

    [](#cb91-2)$ # note the use of , to separate print arguments

    [](#cb91-3)$ awk ''{print $1, $3}'' table.txt

    [](#cb91-4)brown mat

    [](#cb91-5)blue mug

    [](#cb91-6)yellow window

    [](#cb91-7)

    [](#cb91-8)$ # same FS and OFS

    [](#cb91-9)$ echo ''goal:amazing:whistle:kwality'' | awk -F: -v OFS=: ''{print
    $2, $NF}''

    [](#cb91-10)amazing:kwality

    [](#cb91-11)$ echo ''goal:amazing:whistle:kwality'' | awk ''BEGIN{FS=OFS=":"}
    {print $2, $NF}''

    [](#cb91-12)amazing:kwality

    [](#cb91-13)

    [](#cb91-14)$ # different values for FS and OFS

    [](#cb91-15)$ echo ''goal:amazing:whistle:kwality'' | awk -F: -v OFS=- ''{print
    $2, $NF}''

    [](#cb91-16)amazing-kwality

    ```


    Here''s some examples for changing field contents and then printing `$0`.


    ```

    [](#cb92-1)$ echo ''goal:amazing:whistle:kwality'' | awk -F: -v OFS=: ''{$2 =
    42} 1''

    [](#cb92-2)goal:42:whistle:kwality

    [](#cb92-3)$ echo ''goal:amazing:whistle:kwality'' | awk -F: -v OFS=, ''{$2 =
    42} 1''

    [](#cb92-4)goal,42,whistle,kwality

    [](#cb92-5)

    [](#cb92-6)$ # recall that spaces at start/end gets trimmed for default FS

    [](#cb92-7)$ echo ''   a   b   c   '' | awk ''{$NF = "last"} 1''

    [](#cb92-8)a b last

    ```


    Sometimes you want to print contents of `$0` with the new `OFS` value but field
    contents aren''t being changed. In such cases, you can assign a field value to
    itself to force reconstruction of `$0`.


    ```

    [](#cb93-1)$ # no change because there was no trigger to rebuild $0

    [](#cb93-2)$ echo ''Sample123string42with777numbers'' | awk -F''[0-9]+'' -v OFS=,
    ''1''

    [](#cb93-3)Sample123string42with777numbers

    [](#cb93-4)

    [](#cb93-5)$ # assign a field to itself in such cases

    [](#cb93-6)$ echo ''Sample123string42with777numbers'' | awk -F''[0-9]+'' -v OFS=,
    ''{$1=$1} 1''

    [](#cb93-7)Sample,string,with,numbers

    ```


    ## Manipulating NF


    Changing `NF` value will rebuild `$0` as well.


    ```

    [](#cb94-1)$ # reducing fields

    [](#cb94-2)$ echo ''goal:amazing:whistle:kwality'' | awk -F: -v OFS=, ''{NF=2}
    1''

    [](#cb94-3)goal,amazing

    [](#cb94-4)

    [](#cb94-5)$ # increasing fields

    [](#cb94-6)$ echo ''goal:amazing:whistle:kwality'' | awk -F: -v OFS=: ''{$(NF+1)="sea"}
    1''

    [](#cb94-7)goal:amazing:whistle:kwality:sea

    [](#cb94-8)

    [](#cb94-9)$ # empty fields will be created as needed

    [](#cb94-10)$ echo ''goal:amazing:whistle:kwality'' | awk -F: -v OFS=: ''{$8="go"}
    1''

    [](#cb94-11)goal:amazing:whistle:kwality::::go

    ```


    > ![warning](media/file1.svg) Assigning `NF` to `0` will delete all the fields.
    However, a negative value will result in an error.


    ```

    [](#cb95-1)$ echo ''goal:amazing:whistle:kwality'' | awk -F: -v OFS=: ''{NF=-1}
    1''

    [](#cb95-2)awk: cmd. line:1: (FILENAME=- FNR=1) fatal: NF set to negative value

    ```


    ## FPAT


    `FS` allows to define input field separator. In contrast, `FPAT` (field pattern)
    allows to define what should the fields be made up of.


    ```

    [](#cb96-1)$ s=''Sample123string42with777numbers''

    [](#cb96-2)

    [](#cb96-3)$ # define fields to be one or more consecutive digits

    [](#cb96-4)$ echo "$s" | awk -v FPAT=''[0-9]+'' ''{print $2}''

    [](#cb96-5)42

    [](#cb96-6)

    [](#cb96-7)$ # define fields to be one or more consecutive alphabets

    [](#cb96-8)$ echo "$s" | awk -v FPAT=''[a-zA-Z]+'' -v OFS=, ''{$1=$1} 1''

    [](#cb96-9)Sample,string,with,numbers

    ```


    `FPAT` is often used for `csv` input where fields can contain embedded delimiter
    characters. For example, a field content `"fox,42"` when `,` is the delimiter.


    ```

    [](#cb97-1)$ s=''eagle,"fox,42",bee,frog''

    [](#cb97-2)

    [](#cb97-3)$ # simply using , as separator isn''t sufficient

    [](#cb97-4)$ echo "$s" | awk -F, ''{print $2}''

    [](#cb97-5)"fox

    ```


    For such simpler `csv` input, `FPAT` helps to define fields as starting and ending
    with double quotes or containing non-comma characters.


    ```

    [](#cb98-1)$ # * is used instead of + to allow empty fields

    [](#cb98-2)$ echo "$s" | awk -v FPAT=''"[^"]*"|[^,]*'' ''{print $2}''

    [](#cb98-3)"fox,42"

    ```


    > ![warning](media/file1.svg) The above will not work for all kinds of `csv` files,
    for example if fields contain escaped double quotes, newline characters, etc.
    See [stackoverflow: What''s the most robust way to efficiently parse CSV using
    awk?](https://stackoverflow.com/q/45420535/4082052) for such cases. You could
    also use other programming languages such as Perl, Python, Ruby, etc which come
    with standard `csv` parsing libraries or have easy access to third party solutions.
    There are also specialized command line tools such as [xsv](https://github.com/BurntSushi/xsv).


    > ![info](media/file0.svg) If `IGNORECASE` is set, it will affect field matching.
    Unlike `FS`, there is no different behavior for single character pattern.


    ```

    [](#cb99-1)$ # count number of ''e'' in the input string

    [](#cb99-2)$ echo ''Read Eat Sleep'' | awk -v FPAT=''e'' ''{print NF}''

    [](#cb99-3)3

    [](#cb99-4)$ echo ''Read Eat Sleep'' | awk -v IGNORECASE=1 -v FPAT=''e'' ''{print
    NF}''

    [](#cb99-5)4

    [](#cb99-6)$ echo ''Read Eat Sleep'' | awk -v IGNORECASE=1 -v FPAT=''[e]'' ''{print
    NF}''

    [](#cb99-7)4

    ```


    ## FIELDWIDTHS


    `FIELDWIDTHS` is another feature where you get to define field contents. As indicated
    by the name, you have to specify number of characters for each field. This method
    is useful to process fixed width file inputs, and especially when they can contain
    empty fields.'
