    ## 正则表达式


    正则表达式是一种用于文本处理的多功能工具。它可以帮助精确定义匹配标准。为了学习和理解，可以将正则表达式视为一种专门用于文本处理的微型编程语言。正则表达式的某些部分可以保存以备后用，类似于变量和函数。有方法执行
    AND（与）、OR（或）、NOT（非）条件，以及简洁定义重复的特征以避免手动复制等。


    这里是一些常见用例：


    *   清理字符串以确保符合一组已知的规则。例如，检查给定字符串是否符合密码规则。

    *   在抽象层上过滤或提取部分，如字母、数字、标点符号等。

    *   限定的字符串替换。例如，在字符串的开头或结尾，根据周围文本仅替换整个单词等。


    本章将涵盖 `awk` 中实现的正则表达式。`awk` 的大多数正则表达式语法与 `grep -E` Find 的扩展正则表达式 (ERE) 相似。


    > ![info](img/file0.svg) 练习相关文件从 [learn_gnuawk repo 的 exercises 文件夹](https://github.com/learnbyexample/learn_gnuawk/tree/master/exercises)
    获取。所有练习也已汇总在 [Exercises.md](https://github.com/learnbyexample/learn_gnuawk/blob/master/exercises/Exercises.md)
    一处。解决方案请参阅 [Exercise_solutions.md](https://github.com/learnbyexample/learn_gnuawk/blob/master/exercises/Exercise_solutions.md)。


    ### 语法与变量


    如前章所示，`string /regexp/` 检查字符串是否满足正则表达式。`string !~ /regexp/` 反转条件。你也可以将正则表达式保存在变量中。


    ```

    r = "ed"

    if ($0 ~ r) { print "found" }

    ```


    ### 字符串锚点


    在之前的示例中，`awk` 在任何地方匹配。除非另有说明，否则转义字符。这些具有特殊含义的字符被称为元字符。


    有两个字符串锚点：


    *   `^` 元字符将匹配限制在字符串的开头。

    *   `$` 元字符将匹配限制在字符串的结尾。


    ```

    [](#cb24-1)$ cat addr.txt

    [](#cb24-2)Hello World

    [](#cb24-3)How are you

    [](#cb24-4)This game is good

    [](#cb24-5)Today is sunny

    [](#cb24-6)12345

    [](#cb24-7)You are funny

    [](#cb24-8)

    [](#cb24-9)$ awk ##### add your solution here

    [](#cb24-10)This game is good

    [](#cb24-11)Today is sunny

    ```

    '
- fmt: '

    Use `\<` to indicate start of word anchor and `\>` to indicate end of word anchor.
    As an alternate, you can use `\y` to indicate both the start of word and end of
    word anchors.


    > ![info](media/file0.svg) Typically `\b` is used to represent word anchor (for
    example, in `grep`, `sed`, `perl`, etc), but in `awk` the escape sequence `\b`
    refers to the backspace character.


    ```

    cat word_anchors.txt

    sub par

    spar

    apparent effort

    two spare computers

    cart part tart mart

    $ # words starting with ''par''

    $ awk ''/\<par/'' word_anchors.txt

    sub par

    cart part tart mart

    $ # words ending with ''par''

    $ awk ''/par\>/'' word_anchors.txt

    sub par

    spar

    $ # only whole word ''par''

    $ # note that only lines where substitution succeeded will be printed

    $ # as return value of sub/gsub is number of substitutions made

    $ awk ''gsub(/\<par\>/, "***")'' word_anchors.txt

    sub ***

    ```


    > ![warning](media/file1.svg) See also [Word boundary differences](#ch016.xhtml_word-boundary-differences)
    section.


    `\y` has an opposite too. `\B` matches locations other than those places where
    the word anchor would match.


    ```

    # match ''par'' if it is surrounded by word characters

    $ awk ''/\Bpar\B/'' word_anchors.txt

    apparent effort

    two spare computers

    $ # match ''par'' but not as start of word

    $ awk ''/\Bpar/'' word_anchors.txt

    spar

    apparent effort

    two spare computers

    $ # match ''par'' but not as end of word

    $ awk ''/par\B/'' word_anchors.txt

    apparent effort

    two spare computers

    cart part tart mart

    ```


    Here''s an example for using word boundaries by themselves as a pattern. It also
    neatly shows the opposite functionality of `\y` and `\B`.


    ```

    echo ''copper'' | awk ''{gsub(/\y/, ":")} 1''

    :copper:

    $ echo ''copper'' | awk ''{gsub(/\B/, ":")} 1''

    c:o:p:p:e:r

    ```


    > ![warning](media/file1.svg) Negative logic is handy in many text processing
    situations. But use it with care, you might end up matching things you didn''t
    intend.


    ## Combining conditions


    Before seeing the next regexp feature, it is good to note that sometimes using
    logical operators is easier to read and maintain compared to doing everything
    with regexp.


    ```

    # string starting with ''b'' but not containing ''at''

    $ awk ''/^b/ && !/at/'' table.txt

    blue cake mug shirt -7

    $ if the first field contains ''low'' or the last field is less than 0

    $ awk ''$1 ~ /low/ || $NF<0'' table.txt

    blue cake mug shirt -7

    yellow banana window shoes 3.14

    ```


    ## Alternation


    Many a times, you''d want to search for multiple terms. In a conditional expression,
    you can use the logical operators to combine multiple conditions. With regular
    expressions, the `|` metacharacter is similar to logical OR. The regular expression
    will match if any of the expression separated by `|` is satisfied. These can have
    their own independent anchors as well.


    Alternation is similar to using `||` operator between two regexps. Having a single
    regexp helps to write terser code and `||` cannot be used when substitution is
    required.


    ```

    # match whole word ''par'' or string ending with ''s''

    # same as: awk ''/\<par\>/ || /s$/

    $ awk ''/\<par\>|s$/'' word_anchors.txt

    sub par

    two spare computers

    $ replace ''cat'' or ''dog'' or ''fox'' with ''--''

    $ echo ''cats dog parrot foxed'' | awk ''{gsub(/cat|dog|fox/, "--")} 1''

    ```


    There''s some tricky situations using alternation. If it is used for filtering
    a line, there is no ambiguity. However, for use cases like substitution, depends
    on a few factors. Say, you want to replace `are` or `spared` — which one should
    get precedence? The bigger word `spared` or the substring `are` inside it or based
    on something else? The alternative which matches earliest in the input gets precedence.


    ```

    # note that ''sub'' is used here, so first match gets replaced

    $ echo ''cats dog parrot foxed'' | awk ''{sub(/bee|parrot/, "--")} 1''

    cats dog parrot foxed

    $ echo ''cats dog parrot foxed'' | awk ''{sub(/parrot|at/, "--")} 1''

    ```


    In case of matches starting from same location, for `spar` and `spared`, the longest
    portion gets precedence. Unlike other regular expression implementations, left-to-right
    priority for alternation comes into play only if length of matches are the same.
    See [Longest match wins](#ch004.xhtml_longest-match-wins) and [Backreferences](#ch004.xhtml_backreferences)
    for more examples.


    ```

    echo ''spared party parent'' | awk ''{sub(/spa|spared/, "--")} 1''

    party parent

    $ echo ''spared party parent'' | awk ''{sub(/spared|spa/, "--")} 1''

    party parent

    # other implementations like ''perl'' have left-to-right priority

    $ echo ''spared party parent'' | perl -pe ''s/spa|spared/''

    ```


    ## Grouping


    Often, there are some common things among the regular expression alternatives.
    It could be common characters or qualifiers like the anchors. In such cases, you
    can group them using a pair of metacharacters. Similar to `a(b+c)d = abd+acd`
    in maths, you get `a(b|c)d = abd|acd` in regular expressions.


    ```

    # without grouping

    $ printf ''red\nreform\nread\narrest\n'' | awk ''/reform|rest/''

    reform

    arrest

    # with grouping

    $ printf ''red\nreform\nread\narrest\n'' | awk ''/re(form|st)/''

    reform

    arrest

    # without grouping

    $ printf ''sub par\nspare\npart time\n'' | awk ''/\<par\>|\<part>/''

    sub par

    part time

    # taking out common anchors

    $ printf ''sub par\nspare\npart time\n'' | awk ''/\<par|part)\>/''

    sub par

    part time

    # taking out common characters as well

    # you''ll later learn a better technique instead of using empty alternate

    $ printf ''sub par\nspare\npart time\n'' | awk ''/\<par(|t)\>/''

    sub par

    part time

    ```


    ## Matching the metacharacters


    You have seen a few metacharacters and escape sequences that help to compose a
    regular expression. To match the metacharacters literally, i.e. to remove their
    special meaning, prefix those characters with a `\` character. To indicate a literal
    `\` character, use `\\`.


    Unlike `grep` and `sed`, the string anchors have to be always escaped to match
    them literally as there is no BRE mode in `awk`. They do not lose their special
    meaning when not used in their customary positions.


    ```

    # awk ''/b^2/'' will not work even though ^ isn''t being used as anchor

    # b^2 will work for both grep and sed if you use BRE syntax

    $ echo ''a^2 + b^2 - C*3'' | awk ''/b\^2/''

    a^2 + b^2 - C*3

    # note that '')'' doesn''t need to be escaped

    $ echo ''(a*b) + c'' | awk ''{gsub(/\(|)/, "")} 1''

    a*b + c

    $ echo ''\learn\by\example'' | awk ''{gsub(/\\/, "/")} 1''

    /learn/by/example

    ```


    > ![info](media/file0.svg) [Backreferences](#ch004.xhtml_backreferences) section
    will discuss how to handle the metacharacters in replacement section.


    ## Using string literal as regexp

