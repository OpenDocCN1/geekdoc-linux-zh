    # Dealing with duplicates


    Often, you need to eliminate duplicates from an input file. This could be based
    on entire line content or based on certain fields. These are typically solved
    with `sort` and `uniq` commands. Advantage with `awk` include regexp based field
    and record separators, input doesn''t have to be sorted, and in general more flexibility
    because it is a programming language.


    ## Whole line duplicates


    `awk ''!a[$0]++''` is one of the most famous `awk` one-liners. It eliminates line
    based duplicates while retaining input order. The following example shows it in
    action along with an illustration of how the logic works.


    ```

    [](#cb254-1)$ cat purchases.txt

    [](#cb254-2)coffee

    [](#cb254-3)tea

    [](#cb254-4)washing powder

    [](#cb254-5)coffee

    [](#cb254-6)toothpaste

    [](#cb254-7)tea

    [](#cb254-8)soap

    [](#cb254-9)tea

    [](#cb254-10)

    [](#cb254-11)$ awk ''{print +a[$0] "\t" $0; a[$0]++}'' purchases.txt

    [](#cb254-12)0       coffee

    [](#cb254-13)0       tea

    [](#cb254-14)0       washing powder

    [](#cb254-15)1       coffee

    [](#cb254-16)0       toothpaste

    [](#cb254-17)1       tea

    [](#cb254-18)0       soap

    [](#cb254-19)2       tea

    [](#cb254-20)

    [](#cb254-21)$ # only those entries with zero in first column will be retained

    [](#cb254-22)$ awk ''!a[$0]++'' purchases.txt

    [](#cb254-23)coffee

    [](#cb254-24)tea

    [](#cb254-25)washing powder

    [](#cb254-26)toothpaste

    [](#cb254-27)soap

    ```


