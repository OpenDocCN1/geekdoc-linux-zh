  trans: "\n\n```\n下方解决方案中使用的 `key` 特性：\n\n*   对于两个输入文件，仅当正在处理第一个文件时 `NR==FNR` 才会为\
    \ `true`\n*   `next` 将跳过剩余代码并获取下一个记录\n*   `a[$0]` 本身是一个有效语句。它会在数组 `a` 中创建一个以 `$0`\
    \ 为键的未初始化元素（假设该键尚不存在）\n*   `$0 in a` 检查给定字符串（此处为 `$0`）是否存在作为数组 `a` 的键\n```\n\n\
    ### 常见行示例\n\n```\n# 等同于：`grep -Fxf color_list1.txt color_list2.txt`\n\nawk 'NR==FNR{a[$0];\
    \ next} $0 in a' color_list1.txt color_list2.txt\n```\n浅蓝色\n\n黄色\n\n# color_list2.txt\
    \ 中存在但 color_list1.txt 中不存在的行\n\n```\n# 等同于：`grep -vFxf color_list1.txt color_list2.txt`\n\
    \nawk 'NR==FNR{a[$0]; next} !($0 in a)' color_list1.txt color_list2.txt\n```\n\
    黑色\n\n深绿色\n\n# 反转输入文件的顺序可以得到\n\n```\n# color_list1.txt 中存在但 color_list2.txt 中不存在的行\n\
    \nawk 'NR==FNR{a[$0]; next} !($0 in a)' color_list2.txt color_list1.txt\n```\n\
    青蓝色\n\n绿色\n\n> ![warning](img/file1.svg) 注意，如果第一个文件为空，`NR==FNR` 逻辑将失效。\n\n## 比较字段\n\
    \n在上一节中，你学习了如何比较两个文件之间的记录完整内容。本节将重点于只比较特定的字段。下面的示例文件将作为本节示例中两个输入文件之一。\n\n```\n\
    cat marks.txt\n\nDept    Name    Marks\nECE     Raj     53\nECE     Joel    72\n\
    EEE     Moi     68\nCSE     Surya   81\nEEE     Tia     59\nECE     Om      92\n\
    CSE     Amy     67\n```\n\n首先，这里有一个单字段比较。问题描述是：如果第一个字段匹配 `dept.txt` 文件中列出的任何部门，则获取\
    \ `marks.txt` 中的所有记录。\n\n```\ncat dept.txt\n\nCSE\nECE\n\n# 注意先使用 dept.txt 来构建数组键\n\
    \nawk 'NR==FNR{a[$1]; next} $1 in a' dept.txt marks.txt\n\nECE     Raj     53\n\
    ECE     Joel    72\nCSE     Surya   81\nECE     Om      92\nCSE     Amy     67\n\
    \n# 如果也需要表头\n\nawk 'NR==FNR{a[$1]; next} FNR==1 || $1 in a' dept.txt marks.txt\n\
    \nDept    Name    Marks\nECE     Raj     53\nECE     Joel    72\nCSE     Surya\
    \   81\nECE     Om      92\nCSE     Amy     67\n```\n\n对于多字段比较，你需要构建一个健健的键。简单连接字段值可能会导致误匹配。例如，字段值\
    \ `abc` 和 `123` 会错误地匹配 `ab` 和 `c123`。为了避免这种情况，你可以在字段值之间引入一些字符串，例如 `\"_\"`（如果你确定字段本身不会包含该字符）或\
    \ `FS`（更安全的选项）。你也可以允许 `awk` 帮你处理。如果你在字段值之间使用 `,` 符号（而不是字符串 `\",\"`），则会插入特殊变量 `SUBSEP`\
    \ 的值。`SUBSEP` 的默认值是非打印字符 `\\034`，该字符通常不作为文本的一部分。\n\n```\ncat dept_name.txt\n\n\
    EEE Moi\nCSE Amy\nECE Raj\n\n# 使用 SUBSEP 作为字段值之间的分隔符\n# 注意键上使用了括号\n\nawk 'NR==FNR{a[$1,$2];\
    \ next} ($1,$2) in a' dept_name.txt marks.txt\n\nECE     Raj     53\nEEE     Moi\
    \     68\nCSE     Amy     67\n```\n\n在这个例中，其中一个字段被用于数值比较。\n\n```\ncat dept_mark.txt\n\
    \nECE 70\nEEE 65\nCSE 80\n\n# 匹配 dept_mark.txt 中指定的部门和最低分数\n\nawk 'NR==FNR{d[$1]=$2;\
    \ next} $1 in d[$1]' dept_mark.txt marks.txt\n\nECE     Joel    72\nEEE     Moi\
    \     68\nCSE     Surya   81\nECE     Om      92\n```\n\n这是一个添加新字段的示例。\n\n```\n\
    cat role.txt\n\nRaj class_rep\nAmy sports_rep\nTia placement_rep\n\nawk -v OFS='\\\
    t' 'NR==FNR{r[$1]=$2; next} $(NF+1) = FNR==1 ? \"Role\" : r[$2]} 1' role.txt marks.txt\n\
    \nDept    Name    Marks   Role\nECE     Raj     53      class_rep\nECE     Joel\
    \    72\nEEE     Moi     68\nCSE     Surya   81\nEEE     Tia     59      placement_rep\n\
    ECE     Om      92\nCSE     Amy     67      sports_rep\n```\n\n## getline\n\n\
    顾名其实，`getline` 函数允许你按需从文件中读取行。当你需要基于行号进行操作时非常有用。以下示例展示了如何用另一个文件的 `n` 行替换某个文件的\
    \ `m` 行。`getline` 有许多语法变体，此处读取的行保存在变量中。\n\n```\n# 此处未显示返回值，但理想情况下应该这样做\n\nawk\
    \ -v m=3 -v n=2 'BEGIN{while(n-- > 0) getline s < \"greeting.txt\"} FNR==m{$0=s}\
    \ 1' table.txt\n\nbrown bread mat hair 42\nblue cake mug shirt -7\nHave a nice\
    \ day\n```\n\n这是一个同时处理两个文件的示例。在这种情况下也使用了 getline 的返回值。如果成功读取行，它将返回 `1`；如果没有更多输入（到达文件末尾），则返回\
    \ `0`；如果发生错误，则返回 `-1`。特殊变量 `ERRNO` 将包含有关问题的详细信息。\n\n```\n# 如果 table.txt 中对应行的最后一列是正数\n\
    # 则打印 greeting.txt 中的行\n\nawk -v file='table.txt' '(getline line < file)==1{n=split(line,\
    \ a); if(a[n]>0) print}' greeting.txt\n\nHi there\nGood bye\n```\n\n如果传递作为 `awk`\
    \ 命令参数的文件无法打开，你将得到错误。例如：\n\n```\nawk '{print $2}' xyz.txt\nawk: fatal: cannot\
    \ open file 'xyz.txt' for reading (No such file or directory)\n```\n\n建议在使用 `getline`\
    \ 时始终检查返回值，或者也许可以使用之前节的技术完全避免使用 `getline`。\n\n```\n# xyz.txt 不存在，但输出没有显示发生错误\n\
    \nawk '{getline line < \"xyz.txt\"; print $NF, line}' table.txt\n\n42 \n-7 \n\
    3.14 \n\nawk -v file='xyz.txt' '{ e=(getline line < file); if(e<0){print file\
    \ \": \" ERRNO; exit} print $NF, line }' table.txt\n\nxyz.txt: No such file or\
    \ directory\n```\n\n"
