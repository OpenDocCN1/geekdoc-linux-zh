    ```

    [](#cb227-1)$ awk ''/start/{f=1} f; /end/{exit}'' uniform.txt

    [](#cb227-2)--start 1--

    [](#cb227-3)1234

    [](#cb227-4)6789

    [](#cb227-5)`end 1`

    [](#cb227-6)

