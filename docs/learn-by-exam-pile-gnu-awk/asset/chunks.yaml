    ```

    [](#cb217-1)$ # 仅打印匹配行后找到第 2 行

    [](#cb217-2)$ # 数组为每条记录保存匹配结果

    [](#cb217-3)$ # 不依赖计数器，因此适用于重叠情况

    [](#cb217-4)$ awk -v n=2 ''a[NR-n]; /toy|flower/{a[NR]=1}'' context.txt

    [](#cb217-5)    sand stone

    [](#cb217-6)light blue

    [](#cb217-7)    water

    [](#cb217-8)

    [](#cb217-9)$ # 仅打印匹配行后找到第 3 行

    [](#cb217-10)$ # n && !--n 只有在 --n 产生 0 时才为真

    [](#cb217-11)$ # 重叠情况将不起，因为 n 在变为 0 之前会被重新赋值

    [](#cb217-12)$ awk ''n && !--n; /language/{n=3}'' context.txt

    [](#cb217-13)    spanish

    [](#cb217-14)    ruby

    ```


    ### 案例 4：匹配前打印 `n` 条记录。是否打印匹配本身留作练习。由于文件是正向读取的，且问题描述是在匹配记录之前打印内容，因此不会发生像之前示例那样的叠加情况。


    ```

    [](#cb218-1)$ # 使用 i>0 是因为 NR 从 1 开始

    [](#cb218-2)$ awk -v n=2 ''/toy|flower/{for(i=NR-n; i<NR; i++) if(i>0) print a[i]}

    [](#cb218-3) {a[NR]=$0}'' context.txt

    [](#cb218-4)blue

    [](#cb218-5)blue

    [](#cb218-6)    toy

    [](#cb218-7)    sand stone

    [](#cb218-8)light blue

    ```


    ### 案例 5：匹配记录之前的第 `n` 条记录。


    ```

    [](#cb219-1)$ # 如果计数足够小，你可以将它们保存在变量中

    [](#cb219-2)$ # 打印匹配行之前的第 2 行

    [](#cb219-3)$ # NR>2 是因为前 2 条记录不应被考虑

    [](#cb219-4)$ awk ''NR>2 && /toy|flower/{print p2} p2=p1; p1=$0'' context.txt

    [](#cb219-5)blue

    [](#cb219-6)    sand stone

    light blue

    []8)$ 否则，使用数组保存之前的记录

    [](#cb219-9)$ awk -v n=4 ''NR>n && /age/{print a[NR-n]} a[NR]=$0'' context.txt

    english

    ```


    ## 由不同标记边界的记录


    此部分涵盖输入文件始终包含交替出现的起始和结束模式的情况。例如，两个起始模式之间没有结束模式，反之亦然。这些组内部也可以出现零或多条记录。下方示例文件将用于说明。为了简单，假设起始模式由
    `start` 标记，结束模式由 `end` 标记。它们赋予了数字以便可视化输入和输出之间的转换。


    ```

    [](#cb220-1)$ cat.txt

    [](#cb220-2)mango

    [](#cb220-3)icecream

    [](#cb220-4)--start 1--

    [](#cb220-5)1234

    [](#cb220-6)6789

    [](#cb220-7)end 1

    [](#cb220-8)how are you

    [](#cb220-9)have a nice day

    [](#cb220-10)--start 2--

    [](#cb220-11)a

    [](#cb220-12)b

    [](#cb220-13)c

    [](#cb220-14)end 2

    [](#cb220-15)par,far,tar

    ```


    ### 案例 1：根据不同标记处理所有记录组，包括匹配本身。为了简单，下面的命令将打印所有此类记录。


    ```

    [](#cb221-1)$ awk ''/start/{f=1} f; /end/{f=0}'' uniform.txt

    [](#cb221-2)--start 1--

    [](#cb221-3)1234

    [](#cb221-4)6789

    [](#cb221-5)end 1

    [](#cb221-6)--start 2--

    [](#cb221-7)a

    [](#cb221-8)b

    [](#cb221-9)c

    [](#cb221-10)end 2

    ```


    ![info](img/file0.svg) 类似于 `sed -n ''/start/,/end/p''` 你也可以使用 `awk ''/start/,/end/''`
    但状态机格式更适用于后续的各种情况。


    ### 案例 2：处理所有记录组，但排除匹配本身。


    ```

    [](#cb222-1)$ awk ''/end/{f=0} f{print "*", $0} /start/{f=1}'' uniform.txt

    [](#cb222-2)* 1234

    [](#cb222-3)* 6789

    [](#cb222-4)* a

    [](#cb222-5)* b

    [](#cb222-6)* c

    ```


    ### 案例 3-4：处理所有记录组，但排除任意一个标记。


    ```

    [](#cb223-1)$ awk ''/start/{f=1} /end/{f=0} f'' uniform.txt

    [](#cb223-2)--start 1--

    [](#cb223-3)1234

    [](#cb223-4)6789

    [](#cb223-5)--start 2--

    [](#cb223-6)a

    [](#cb223-7)b

    [](#cb223-8)c

    [](#cb223-9)

    [](#cb223-10)$ awk ''f; /start/{f=1} /end/{f=0}'' uniform.txt

    [](#cb223-11)1234

    [](#cb223-12)6789

    [](#cb223-13)end 1

    [](#cb223-14)a

    [](#cb223-15)b

    [](#cb223-16)c

    [](#cb223-17)end 2

    ```


    接下来的四个案例仅通过在上面的案例中使用 `!f` 代替 `f` 得到。


    ### 案例 5：处理所有输入记录，但标记边界的记录组。


    ```

    [](#cb224-1)$ awk ''/start/{f=1} !f{print $0 "."} /end/{f=0}'' uniform.txt

    [](#cb224-2)mango.

    [](#cb224-3)icecream.

    [](#cb224-4)how are you.

    [](#cb224-5)have a nice day.

    [](#cb224-6)par,far,mar,tar.

    ```


    ### 案例 6：处理所有输入记录，但排除标记之间的组。


    ```

    [](#cb225-1)$ awk ''/end/{f=0} !f; /start/{f=1}'' uniform.txt

    [](#cb225-2)mango

    [](#cb225-3)icecream

    [](#cb225-4)--start 1--

    [](#cb225-5)end 1

    [](#cb225-6)how are you

    [](#cb225-7)have a nice day

    [](#cb225-8)--start 2--

    [](#cb225-9)end 2

    [](#cb225-10)par,far,mar,tar

    ```


    '
- fmt: '

    ```

    [](#cb227-1)$ awk ''/start/{f=1} f; /end/{exit}'' uniform.txt

    [](#cb227-2)--start 1--

    [](#cb227-3)1234

    [](#cb227-4)6789

    [](#cb227-5)`end 1`

    [](#cb227-6)

    [](#cb227-7)$ # use other tricks discussed in previous section as needed

    [](#cb227-8)$ awk ''/end/{exit} f; /start/{f=1}'' uniform.txt

    [](#cb227-9)1234

    [](#cb227-10)6789

    ```


    Getting last block alone involves lot more work, unless you happen to know how
    many blocks are present in the input file.


    ```

    [](#cb228-1)$ # reverse input linewise, change the order of comparison, reverse
    again

    [](#cb228-2)$ # can''t be used if RS has to be something other than newline

    [](#cb228-3)$ tac uniform.txt | awk ''/end/{f=1} f; /start/{exit}'' | tac

    [](#cb228-4)--start 2--

    [](#cb228-5)a

    [](#cb228-6)b

    [](#cb228-7)c

    [](#cb228-8)`end 2`

    [](#cb228-9)

    [](#cb228-10)$ # or, save the blocks in a buffer and print the last one alone

    [](#cb228-11)$ awk ''/start/{f=1; b=$0; next} f{b=b ORS $0} /end/{f=0}

    [](#cb228-12) END{print b}'' uniform.txt

    [](#cb228-13)--start 2--

    [](#cb228-14)a

    [](#cb228-15)b

    [](#cb228-16)c

    [](#cb228-17)`end 2`

    ```


    ### Only the `n`th block


    ```

    [](#cb229-1)$ # can also use: awk -v n=2 ''/4/{c++} c==n{print; if(/6/) exit}''

    [](#cb229-2)$ seq 30 | awk -v n=2 ''/4/{c++} c==n; /6/ && c==n{exit}''

    [](#cb229-3)14

    [](#cb229-4)15

    [](#cb229-5)16

    ```


    ### All blocks greater than `n`th block


    ```

    [](#cb230-1)$ seq 30 | awk -v n=1 ''/4/{f=1; c++} f && c>n; /6/{f=0}''

    [](#cb230-2)14

    [](#cb230-3)15

    [](#cb230-4)16

    [](#cb230-5)24

    [](#cb230-6)25

    [](#cb230-7)26

    ```


    ### Excluding `n`th block


    ```

    [](#cb231-1)$ seq 30 | awk -v n=2 ''/4/{f=1; c++} f && c!=n; /6/{f=0}''

    [](#cb231-2)4

    [](#cb231-3)5

    [](#cb231-4)6

    [](#cb231-5)24

    [](#cb231-6)25

    [](#cb231-7)26

    ```


    ### All blocks, only if the records between the markers match an additional condition


    ```

    [](#cb232-1)$ # additional condition here is a record with entire content as ''15''

    [](#cb232-2)$ seq 30 | awk ''/4/{f=1; buf=$0; m=0; next}

    [](#cb232-3) f{buf=buf ORS $0}

    [](#cb232-4) /6/{f=0; if(m) print buf}

    [](#cb232-5) $0=="15"{m=1}''

    [](#cb232-6)14

    [](#cb232-7)15

    [](#cb232-8)16

    ```


    ## Broken blocks


    Sometimes, you can have markers in random order and mixed in different ways. In
    such cases, to work with blocks without any other marker present in between them,
    the buffer approach comes in handy again.


    ```

    [](#cb233-1)$ cat broken.txt

    [](#cb233-2)qqqqqqqqqqqqqqqq

    [](#cb233-3)error 1

    [](#cb233-4)hi

    [](#cb233-5)error 2

    [](#cb233-6)1234

    [](#cb233-7)6789

    [](#cb233-8)state 1

    [](#cb233-9)bye

    [](#cb233-10)state 2

    [](#cb233-11)error 3

    [](#cb233-12)xyz

    [](#cb233-13)error 4

    [](#cb233-14)abcd

    [](#cb233-15)state 3

    [](#cb233-16)zzzzzzzzzzzz

    [](#cb233-17)$ awk ''/error/{f=1; buf=$0; next}

    [](#cb233-18) f{buf=buf ORS $0}

    [](#cb233-19) /state/{if(f) print buf; f=0}'' broken.txt

    [](#cb233-20)error 2

    [](#cb233-21)1234

    [](#cb233-22)6789

    [](#cb233-23)state 1

    [](#cb233-24)error 4

    [](#cb233-25)abcd

    [](#cb233-26)state 3

    ```


    ## Summary


    This chapter covered various examples of working with multiple records. State
    machines play an important role in deriving solutions for such cases. Knowing
    various cases is also crucial, otherwise a solution that works for one input may
    fail for others.


    Next chapter will discuss cases where you need to process a file based on contents
    of another.


