    ```bash

    s=''\n\n\na\nb\n\n12\n34\n\nhi\nhello\n''

    # paragraph mode

    printf ''%b'' "$s" | awk -v RS= -v ORS=''\n---\n'' ''NR<=2''

    a

    b

    ---

    12

    34

    ---


    # RS is ''\n\n+'' instead of paragraph mode

    printf ''%b'' "$s" | awk -v RS=''\n\n+'' -v ORS=''\n---\n'' ''NR<=2''


    ---

