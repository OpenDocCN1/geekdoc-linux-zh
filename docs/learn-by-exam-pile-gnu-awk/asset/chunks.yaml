    ## Regular Expressions


    Regular Expressions is a versatile tool for text processing. It helps to precisely
    define a matching criteria. For learning and understanding purposes, one can view
    regular expressions as a mini programming language in itself, specialized for
    text processing. Parts of a regular expression can be saved for future use, analogous
    to variables and functions. There are ways to perform AND, OR, NOT conditionals,
    features to concisely define repetition to avoid manual replication and so on.


    Here''s some common use cases:


    *   Sanitizing a string to ensure that it satisfies a known set of rules. For
    example, to check if a given string matches password rules.

    *   Filtering or extracting portions on an abstract level like alphabets, numbers,
    punctuation and so on.

    *   Qualified string replacement. For example, at the start or the end of a string,
    only whole words, based on surrounding text, etc.


    This chapter will cover regular expressions as implemented in `awk`. Most of `awk`''s
    regular expression syntax is similar to Extended Regular Expression (ERE) found
    with `grep -E`.


    > ![info](media/file0.svg) Exercise related files are available from [exercises
    folder of learn_gnuawk repo](https://github.com/learnbyexample/learn_gnuawk/tree/master/exercises).
    All the exercises are also collated together in one place at [Exercises.md](https://github.com/learnbyexample/learn_gnuawk/blob/master/exercises/Exercises.md).
    For solutions, see [Exercise_solutions.md](https://github.com/learnbyexample/learn_gnuawk/blob/master/exercises/Exercise_solutions.md).


    ### Syntax and variable


    As seen in previous chapter, `string /regexp/` checks if the string satisfies
    the regexp. `string !~ /regexp/` inverts the condition. You can also save regexp
    in variable.


    ```

    r = "ed"

    if ($0 ~ r) { print "found" }

    ```


    ### String Anchors


    In the examples so far, `awk` matched anywhere. Unless indicated, escape characters.
    These characters with special meaning are known as metacharacters.


    There are two string anchors:


    *   `^` metacharacter restricts the matching to the start of string.

    *   `$` metacharacter restricts the matching to the end of string.


    ```

    [](#cb24-1)$ cat addr.txt

    [](#cb24-2)Hello World

    [](#cb24-3)How are you

    [](#cb24-4)This game is good

    [](#cb24-5)Today is sunny

    [](#cb24-6)12345

    [](#cb24-7)You are funny

    [](#cb24-8)

    [](#cb24-9)$ awk ##### add your solution here

    [](#cb24-10)This game is good

    [](#cb24-11)Today is sunny

    ```


    In the examples so far, `awk` matched anywhere. Unless indicated, escape characters.
    These with special meaning are known as metacharacters.


    ```bash

    [](#cb24-1)$ cat addr.txt

    [](#cb24-2)Hello World

    [](#cb24-3)How are you

    [](#cb24-4)This game is good

    [](#cb24-5)Today is sunny

