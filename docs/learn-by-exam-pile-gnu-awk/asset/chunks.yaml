    ## Dynamic regexp


    As seen earlier, you can use a string literal instead of regexp to specify the
    pattern to be matched. Which implies that you can use any expression or a variable
    as well. This is helpful if you need to compute the regexp based on some conditions
    or if you are getting the pattern externally, such as user input.


    The `-v` command line option comes in handy to get user input, say from a `bash`
    variable.


    ```

    [](#cb65-1)$ r=''cat.*dog|dog.*cat''

    [](#cb65-2)$ echo ''two cats and a dog'' | awk -v ip="$r" ''{gsub(ip, "pets")}
    1''

    [](#cb65-3)two pets

    [](#cb65-4)

    [](#cb65-5)$ awk -v s=''ow'' ''$0 ~ s'' table.txt

    [](#cb65-6)brown bread mat hair 42

    [](#cb65-7)yellow banana window shoes 3.14

    [](#cb65-8)

    [](#cb65-9)$ # you''ll have to make sure to use \\ instead of \

    [](#cb65-10)$ r=''\\<[12][0-9]\\>''

    [](#cb65-11)$ echo ''23 154 12 26 34'' | awk -v ip="$r" ''{gsub(ip, "X")} 1''

    [](#cb65-12)X 154 X X 34

    ```


    > ![info](media/file0.svg) See [Using shell variables](#ch008.xhtml_using-shell-variables)
    chapter for a way to avoid having to use `\\` instead of `\`.


    Sometimes, you need to get user input and then treat it literally instead of regexp
    pattern. In such cases, you''ll need to first escape the metacharacters before
    using in substitution functions. Below example shows how to do it for search section.
    For replace section, you only have to escape the `\` and `&` characters.


    ```

    [](#cb66-1)$ awk -v s=''(a.b)^{c}|d'' ''BEGIN{gsub(/[{[(^$*?+.|\\]/, "\\\\&",
    s); print s}''

    [](#cb66-2)\(a\.b)\^\{c}\|d

    [](#cb66-3)

    [](#cb66-4)$ echo ''f*(a^b) - 3*(a^b)'' |

    [](#cb66-5)     awk -v s=''(a^b)'' ''{gsub(/[{[(^$*?+.|\\]/, "\\\\&", s); gsub(s,
    "c")} 1''

    [](#cb66-6)f*c - 3*c

    [](#cb66-7)

    [](#cb66-8)$ # match given input string literally, but only at the end of string

    [](#cb66-9)$ echo ''f*(a^b) - 3*(a^b)'' |

    [](#cb66-10)     awk -v s=''(a^b)'' ''{gsub(/[{[(^$*?+.|\\]/, "\\\\&", s); gsub(s
    "$", "c")} 1''

    [](#cb66-11)f*(a^b) - 3*c

    ```


    > ![info](media/file0.svg) If you need to match instead of substitution, you can
    use the `index` function. See [index](#ch010.xhtml_index) section for details.


    ## Summary


    Regular expressions is a feature that you''ll encounter in multiple command line
    programs and programming languages. It is a versatile tool for text processing.
    Although the features in `awk` are less compared to those found in programming
    languages, they are sufficient for most of the tasks you''ll need for command
    line usage. It takes a lot of time to get used to syntax and features of regular
    expressions, so I''ll encourage you to practice a lot and maintain notes. It''d
    also help to consider it as a mini-programming language in itself for its flexibility
    and complexity.


