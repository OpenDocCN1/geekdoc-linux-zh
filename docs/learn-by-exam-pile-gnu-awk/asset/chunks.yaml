    为了字面量匹配字符类元字符，需要特定的放置位置。或者，可以通过在前面加上 `\` 来进行转义，以避免记忆不同的规则。由于 `\` 在字符类内部是特殊字符，请使用
    `\\` 来表示其字面量。


    ```

    [](#cb53-1)$ # - 应该是 [] 内的第一个或最后一个字符

    [](#cb53-2)$ echo ''ab-cd gh-c 12-423'' | awk ''{gsub(/[a-z-]{2,}/, "X")} 1''

    [](#cb53-3)X X 12-423

    [](#cb53-4)$ # 或使用 \ 进行转义

    [](#cb53-5)$ echo ''ab-cd gh-c 12-423'' | awk ''{gsub(/[a-z\-0-9]{2,}/, "X")}
    1''

    [](#cb53-6)X X X

    [](#cb53-7)

    [](#cb53-8)$ # ] 应该是 [] 内的第一个字符

    [](#cb53-9)$ printf ''int a[5]\nfoo\n1+1=2\n'' | awk ''/[=]]/''

    [](#cb53-10)$ printf ''int a[5]\nfoo\n1+1=2\n'' | awk ''//=]/''

    [](#cb53-11)int a[5]

    [](#cb53-12)1+1=2

    [](#cb53-13)

    [](#cb53-14)$ # 若要匹配 ，可以在字符集中的任何位置使用 [

    [$ # [][] 会同时匹配 [ 和 ]

    [](#cb53-16)$ printf ''int a[5]\nfoo\n1+1=2\n'' | awk ''/[][]/''

    [](#cb53-17)int a[5]

    [](#cb53-18)

    [](#cb53-19)$ # ^ 不应该是 [] 内的第一个字符

    [](#cb53-20)$ echo ''f*(a^b) - 3*(a+b)/(a-b)'' | awk ''{gsub(/a[+^]b/, "c")} 1''

    [](#cb53-21)f*(c) - 3*(c)/(a-b)

    ```


    > ![warning](img/file1.svg) 像 `[.` 或 `[:` 这样的组合不能共同表示两个独立的字符，因为它们在 `[]` 中有特殊含义。更多详情请参阅
    [gawk 手册：Using Bracket Expressions](https://www.gnu.org/software/gawk/manual/gawk.html#Bracket-Expressions)。


    ```

    [](#cb54-1)$ echo ''int a[5]'' | awk ''/[x[.y]/''

    [](#cb54-2)awk: cmd. line:1: error: Unmatched [, [^, [:, [., or [=: /[x[.y]/

    [](#cb54-3)$ echo ''int a[5]'' | awk ''/[x[y.]/''

    [](#cb54-4)int a[5]

    ```


    ## 转义序列


    某些 ASCII 字符如制表符 `\t`、回车 `\r`、换行符 `\n` 等都有表示它们的转义序列。此外，任何字符都可以使用八进制 `\NNN` 或十六进制
    `\xNN` 格式的 ASCII 值来表示。与字符类转义序列（如 `\w`）不同，这些可以在字符类内部。


    ```

    [](#cb55-1)$ # 使用 \t 表示制表符字符

    [](#cb55-2)$ printf ''foo\tbar\tbaz\n'' | awk ''{gsub(/\t/, " ")} 1''

    [](#cb55-3)foo bar baz

    [](#cb55-4)

    [](#cb55-5)$ # 这些转义序列在字符类内同样有效

    [](#cb55-6)$ printf ''a\t\r\fb\vc\n'' | awk ''{gsub(/[\t\v\f\r]+/, ":")} 1''

    [](#cb55-7)a:b:c

    [](#cb55-8)

    [](#cb55-9)$ # 表示单引号

    [](#cb55-10)$ # 使用 \047 八进制格式

    [](#cb55-11)$ echo "universe: ''42''" | awk ''{gsub(/\x27/, "")} 1''

    [](#cb55-12)universe: 42

    ```


    > ![info](img/file0.svg) 如果通过 ASCII 值指定元字符，仍视为元字符。未定义的序列将导致警告。


    ```

    [](#cb56-1)$ # \x5e 是 ^ 字符，作为字符串锚点

    [](#cb56-2)$ printf ''cute\ncot\cat\n'' | awk ''/\xeco/''

    [](#cb56-3)cot

    [](#cb56-4)coat

    [](#cb56-5)$ # & 代表整个匹配部分

    [](#cb56-7)$ echo ''hello world'' | awk ''{sub(*/, "[&]")} 1''

    [](#cb56-8)hello world

    [](#cb56-9)$ # \x26 是 & 字符

    [](#cb56-10)$ echo ''hello world'' | awk ''{sub(*/, "\x26]")} 1''

    [](#cb56-11)hello world

    [](#cb56-12)$ echo ''read'' | awk ''{sub(/a/, ".")} 1''

    [](#cb56-13)awk: line:1: escape sequence `.` 被视为普通字符

    [](#cb56-14)re.d

    ```


    > ![info](img/file0.svg) 参阅 [gawk 手册：Escape Sequences](https://www.gnu.org/software/gawk/manual/html#Escape-Sequences)。


    ## 替换特定次数


    替换函数 `gensub`，可以替代 `sub` 和 `gsub`。在语法上，`gensub` 需要三个参数。第三个参数用于指定是替换所有出现还是通过数字指定特定次数。另一个区别是
    `gensub` 返回一个字符串值，而不是修改输入。


    ```

    [](#cb57-1)$ # 等于 sed ''s/:/-/''

    [](#cb57-2)$ # 仅替换第二个 '':'' 为 ''-''

    [](#cb57-3)$ # 注意 gensub 的输出在这里被传递

    [](#cb57-4)$ echo ''foo:123:bar:baz'' | awk ''{print gensub(/:/, "-", 2)}''

    [](#cb57-5)foo:123-baz

    [](#cb57-6)$ # 等于 sed -E ''s/[^:]+/X/3''

    [](#cb57-8)$ # 仅替换第三字段为 ''X''

    [](#cb57-9)$ echo ''foo:123:bar:baz'' | awk ''{print gensub(/[^:]/, "X", 3)}''

    10)foo:123:X:baz

    ```


    `gensub` 函数的第四个参数允许你指定执行替换的输入字符串或变量。默认值为 `$0`，如之前的示例所示。


    ```

    [](#cb58-1)$ # 仅针对第四字段替换元音为 ''X''

    [](#cb58-2)$ # 等于 awk ''{gsub(/[aeiou]/, "X", $4)}''

    [](#cb58-3)$ echo ''1 good 2 apples'' | awk ''{$4 = gensub(/[aeiou]/, "X", "g",
    $4)} 1''

    4)1 good 2 Xs

    ```


    ## 反引用


    分组元字符 `()` 也称为捕获组。它们像变量一样，`()` 捕获的字符串可以通过反引用 `\N` ，其中 `N` 是你想要的捕获组。正则表达式中最左边的
    `(` 是 `\1`，下一个是 `\2`，依此类直到 `\9`。作为特殊情况，由于 `\` 在引号内是特殊字符，你必须使用 `"\\1"` 来表示 `\1`。


    > ![info](img/file0.svg) `\N` 形式的反引用只能用于 `gensub` 函数。`&` 可以用于 `sub`、`gsub` 和 `gensub`
    函数。


    ```

    [](#cb59-1)$ # 将 \\ 减少为单个 \，如果它是单个 \

    [](#cb59-2)$ s=''\[\] and \\w and \[a-zA-Z0-9\_\]''

    [](#cb59-3)$ echo "$s" | awk ''{print gensub(/(\\?)\/, "\\1", "g")}''

    [](#cb59-4)[] and \w and [a-zA-Z0-9_]

    [](#cb59-5)

    [](#cb59-6)$ # 将第一列的值复制为最后一列

    [](#cb59-7)$ echo ''one,2,3.14,42'' | awk ''{print gensub(/^,]+).*/ "\\1", 1)}''

    8)one,2,3.14,42

    [](#cb59-9)

    [](#cb59-10)$ # 在字符串开头和结尾添加内容

    [](#cb59-11)$ # 因为使用了 ''&''，不需要 gensub

    [](#cb59-12)$ echo ''hello world'' | awk ''{sub(*/, "Hi. &. Have a day")} 1''

    13)Hi. hello world. Have a day

    [](#cb59-14)

    [](#cb59-15)$ # 这里 {N} 指的是最后一个但第 N 个出现

    [](#cb59-16)$ s=''456:foo:123:bar:789:baz''

    [](#cb59-17)$ echo "$s" | awk ''{print gensub(/(.*):((.*:){2})/, "\\1[]\\2", 1)}''

    18)456:foo:123[]bar:789:baz

    ```


    > ![warning](img/file1.svg) 参阅 [unix.stackexchange: 为什么这个 sed 命令没有替换倒数三个 "and"?](https://unix.stackexchange.com/q/579889/109046)
    关于在 `(){N})` 通用情况下使用单词边界的错误。


    > ![warning](img/file1.svg) 与 `grep` 或 `sed` 或 `perl` 等其他正则表达式实现不同，反引用不能用于 awk
    的搜索部分。另参阅 [unix.stackexchange: backreference in awk](https://unix.stackexchange.com/q/361427/109046)。


    如果量词应用于在 `()` 元字符内部分组的模式，你需要一个外部 `()` 组来捕获匹配部分。某些正则表达式引擎提供了非捕获组来处理此类情况。在 `awk`
    中，你必须绕过额外的捕获组。


    '
- fmt: '

    ```

    [](#cb60-1)$ # note the numbers used in replacement section

    [](#cb60-2)$ s=''one,2,3.14,42''

    [](#cb60-3)$ echo "$s" | awk ''{$0=gensub(/^(([^,]+,){2})([^,]+)/, "[\\1](\\3)",
    1)} 1''

    [](#cb60-4)[one,2,](3.14),42

    ```


    Here''s an example where alternation order matters when matching portions have
    same length. Aim is to delete all whole words unless it starts with `g` or `p`
    and contains `y`.


    ```

    [](#cb61-1)$ s=''tryst,fun,glyph,pity,why,group''

    [](#cb61-2)

    [](#cb61-3)$ # all words get deleted because \w+ gets priority here

    [](#cb61-4)$ echo "$s" | awk ''{print gensub(/\<\w+\>|(\<[gp]\w*y\w*\>)/, "\\1",
    "g")}''

    [](#cb61-5),,,,,

    [](#cb61-6)

    [](#cb61-7)$ # capture group gets priority here, thus words matching the group
    are retained

    [](#cb61-8)$ echo "$s" | awk ''{print gensub(/(\<[gp]\w*y\w*\>)|\<\w+\>/, "\\1",
    "g")}''

    [](#cb61-9),,glyph,pity,,

    ```


    As `\` and `&` are special characters inside double quotes in replacement section,
    use `\\` and `\\&` respectively for literal representation.


    ```

    [](#cb62-1)$ echo ''foo and bar'' | awk ''{sub(/and/, "[&]")} 1''

    [](#cb62-2)foo [and] bar

    [](#cb62-3)$ echo ''foo and bar'' | awk ''{sub(/and/, "[\\&]")} 1''

    [](#cb62-4)foo [&] bar

    [](#cb62-5)

    [](#cb62-6)$ echo ''foo and bar'' | awk ''{sub(/and/, "\\")} 1''

    [](#cb62-7)foo \ bar

    ```


    ## Case insensitive matching


    Unlike `sed` or `perl`, regular expressions in `awk` do not directly support the
    use of flags to change certain behaviors. For example, there is no flag to force
    the regexp to ignore case while matching.


    The `IGNORECASE` special variable controls case sensitivity, which is `0` by default.
    By changing it to some other value (which would mean `true` in conditional expression),
    you can match case insensitively. The `-v` command line option allows you to assign
    a variable before input is read. The `BEGIN` block is also often used to change
    such settings.


    ```

    [](#cb63-1)$ printf ''Cat\ncOnCaT\nscatter\ncot\n'' | awk -v IGNORECASE=1 ''/cat/''

    [](#cb63-2)Cat

    [](#cb63-3)cOnCaT

    [](#cb63-4)scatter

    [](#cb63-5)

    [](#cb63-6)$ # for small enough string, can also use character class

    [](#cb63-7)$ printf ''Cat\ncOnCaT\nscatter\ncot\n'' | awk ''{gsub(/[cC][aA][tT]/,
    "dog")} 1''

    [](#cb63-8)dog

    [](#cb63-9)cOndog

    [](#cb63-10)sdogter

    [](#cb63-11)cot

    ```


    Another way is to use built-in string function `tolower` to change the input to
    lowercase first.


    ```

    [](#cb64-1)$ printf ''Cat\ncOnCaT\nscatter\ncot\n'' | awk ''tolower($0) ~ /cat/''

    [](#cb64-2)Cat

    [](#cb64-3)cOnCaT

    [](#cb64-4)scatter

    ```


    ## Dynamic regexp


    As seen earlier, you can use a string literal instead of regexp to specify the
    pattern to be matched. Which implies that you can use any expression or a variable
    as well. This is helpful if you need to compute the regexp based on some conditions
    or if you are getting the pattern externally, such as user input.


    The `-v` command line option comes in handy to get user input, say from a `bash`
    variable.


    ```

    [](#cb65-1)$ r=''cat.*dog|dog.*cat''

    [](#cb65-2)$ echo ''two cats and a dog'' | awk -v ip="$r" ''{gsub(ip, "pets")}
    1''

    [](#cb65-3)two pets

    [](#cb65-4)

    [](#cb65-5)$ awk -v s=''ow'' ''$0 ~ s'' table.txt

    [](#cb65-6)brown bread mat hair 42

    [](#cb65-7)yellow banana window shoes 3.14

    [](#cb65-8)

    [](#cb65-9)$ # you''ll have to make sure to use \\ instead of \

    [](#cb65-10)$ r=''\\<[12][0-9]\\>''

    [](#cb65-11)$ echo ''23 154 12 26 34'' | awk -v ip="$r" ''{gsub(ip, "X")} 1''

    [](#cb65-12)X 154 X 34

    ```


    > ![info](media/file0.svg) See [Using shell variables](#ch008.xhtml) for a way
    to avoid having to use `\` instead.


    Sometimes, you need to get user input and then treat it literally instead of regexp.
    In such cases, you''ll need to first escape the metacters before using substitution.
    Below example shows how to do it for search. For replace section, only have to
    escape the `\` and `&` characters.


    ```

    [](#cb66-1)$ awk -v s=''(a.b)^{BEGIN{gsub(/[{^$?|\\]/, "\\&", s); print s}''

    [](#cb66-2)a.b

    [](#cb66-3)

    [](#cb66-4)$ echo ''f*(a^b) - 3*(a^b)'' | awk -v s=''(a^b)'' ''{gsub(/[{^$?|\\]/,
    "\\&", s); gsub(s, "c")} 1''

    [](#cb66-5)f*c - 3*c

    [](#cb66-6)f*c - 3*c

    [](#cb66-7)

    [](#cb66-8)$ # match given input literally, but only at end of string

    ```


    > ![info](media/file0.svg) If you need to match instead of substitution, you can
    use the `index` function. See [index](#ch01.xhtml).


    ## Summary


    Regular expressions is a feature that you''ll encounter in multiple command line
    and programming languages. It is a versatile tool for text processing. Although
    the features in `awk` are less compared to those found in programming languages,
    they are sufficient for most tasks you''ll need for command line usage. It takes
    a lot of time to get to syntax and features of regular expressions, so I''ll encourage
    you to practice a lot and maintain. It''d also help to consider it as a mini-programming
    language in itself for its flexibility and complexity.


