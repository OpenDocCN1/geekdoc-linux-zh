    metacharacter represents entire matched string. As `\` is special inside double
    quotes, you''ll have to use `"\\1"` to represent `\1`.


    > ![info](media/file0.svg) Backreferences of the form `\N` can only be used with
    `gensub` function. `&` can be used with `sub`, `gsub` and `gensub` functions.


    ```

    [](#cb59-1)$ # reduce \\ to single \ and delete if it is a single \

    [](#cb59-2)$ s=''\[\] and \\w and \[a-zA-Z0-9\_\]''

