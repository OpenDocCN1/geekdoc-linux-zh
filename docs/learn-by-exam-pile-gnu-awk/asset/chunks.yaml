    # 安装与文档


    `awk` 命令名称源于它的开发者——Alfred V. Aho、Peter J. Weinberger 和 Brian W. Kernighan。多年来，它被各种开发者不断适配和修改。详情请参见
    [gawk 手册: History](https://www.gnu.org/software/gawk/manual.html#History)。本章将展示如何安装或升级
    `awk`，随后是与文档相关的详细信息。


    ## 安装


    如果你在类 Unix 系统上，你可能已经安装了某个版本的 `awk`。本书主要针对 `GNU awk`。由于不同实现之间存在语法和功能的差异，请确保按照此处演示的内容进行。要安装更新或特定版本，请访问
    [gnu: software gawk](https://www.gnu.org/software/gawk/)。


    ```

    # 使用一个目录，例如 ~/Downloads/awk_install 然后执行以下步骤

    $ wget https://ftp.gnu.org/gnu/gawk/gawk-5.1.0.tar.xz

    $ tar -Jxf gawk-5.1.0.tar.xz

    $ cd gawk-5.1.0/

    $ ./configure

    $ make

    $ sudo make install


    $ type -a awk

    awk is /usr/local/bin/awk

    awk is /usr/bin/awk

    $ awk --version | head -n1

    GNU Awk 5.1.0, API: 3.0

    ```


