    \ 和 `gensub`。本章将讨论许多单行命令中常用的内置函数。你还将看到更多关于数组的示例。访问 [gawk 手册：函数](https://www.gnu.org/software/gawk/manual/gawk.html#Functions)\
    \ 获取有关所有内置函数的细节以及如何定义你自己的函数。\n\n### length\n\n`length` 函数返回给定字符串的字符数。默认情况下，它作用于\
    \ `$0` 变量，并将数字参数转换为字符串。\n\n```\n$ awk 'BEGIN{print length(\"road\"); print length(12346)}'\n\
    4\n6\n# 记录分隔符不是 $0 的一部分\n# 所以，行结束符在这里不会被计数\n$ printf 'fox\\ntiger\\n' | awk '{print\
    \ length()}'\n3\n5\n\n$ awk 'length($1)' table.txt\nbread mat hair 42\nblue cake\
    \ shirt -7\n```\n\n如果你需要字节数而不是字符数，请使用 `-b` 选项。区域设置（Locale）也可能起作用。\n\n```\n$ echo\
    \ 'αλε' | awk '{print length()}'\n6\n$ echo 'αλε' | awk -b '{print length()}'\n\
    12\n$ echo 'αλε' | LC_ALL=C awk '{print length()}'\n12\n```\n\n### 数组排序\n\n默认情况下，使用\
    \ `for(key in array)` 遍历数组会以随机顺序给你的元素。通过给 `PROCINFO[\"sorted_in\"]` 设置一个特殊值，你可以控制你想要检索元素的顺序。参见\
    \ [gawk 手册：使用预定义的数组顺序](https://www.gnu.org/software/gawk/manual/gawk.html#Controlling-Scanning)\
    \ 获取其他选项和细节。\n\n```\n$ 默认情况下，数组按随机顺序遍历\n$ awk 'BEGIN{a[\"z\"]=1; a[\"x\"]=12;\
    \ a[\"b\"]=42; for(i in a) print i, a[i]}'\nx 12\nz 1\nb 42\n\n# 索引（即键）按字符串升序排序\n\
    $ awk 'BEGIN{PROCINFO[\"sorted_in\"] = \"@ind_str_asc\";\na[\"z\"]=1; a[\"x\"\
    ]=12; a[\"b\"]=42; for(i in a) print i, a[i]}'\nb 42\nx 12\nz 1\n\n# 值按数字升序排序\n\
    $ awk 'BEGIN{PROCINFO[\"sorted_in\"] = \"@val_num_asc\";\na[\"z\"]=1; a[\"x\"\
    ]=12; a[\"b\"]=42; for(i in a) print i, a[i]}'\nz 1\nx 12\nb 42\n```\n\n这是一个根据第二列（视为字符串）升序排序输入行的示例。\n\
    \n```\n$ awk 'BEGIN{PROCINFO[\"sorted_in\"] = \"@ind_str_asc\"}\n{a[$2]=$0} END{for(k\
    \ in a) print a[k]}' table.txt\nyellow banana window shoes 3.14\nbrown bread mat\
    \ hair 42\nblue cake mug shirt -7\n```\n\n### split\n\n`split` 函数提供了与使用 `FS` 进行记录分割相同的功能。当你由于某些原因需要数组形式的结果时非常有用，例如为了使用数组排序功能。或者当你需要进一步拆分字段内容时。`split`\
    \ 四个参数，后两个是可选的。\n\n*   第一个参数是要拆分的字符串\n*   第二个参数是用于保存结果的数组变量\n*   第三个参数是分隔符，默认值为\
    \ `FS`\n\n`split` 函数的返回值是字段数，类似于 `NF` 变量。数组从 `1` 开始索引，第一个元素为 `1`，第二个元素为 `2`，依此类推。如果数组已经有了值，它会被新值覆盖。\n\
    \n"
