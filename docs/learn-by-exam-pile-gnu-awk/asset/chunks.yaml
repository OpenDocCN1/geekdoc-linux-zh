    [](#cb27-12)$ # match ''par'' but not as end of word

    [](#cb27-13)$ awk ''/par\B/'' word_anchors.txt

    [](#cb27-14)apparent effort

    [](#cb27-15)two spare computers

    [](#cb27-16)cart part tart mart

    ```


    Here''s an example for using word boundaries by themselves as a pattern. It also
    neatly shows the opposite functionality of `\y` and `\B`.


    ```

    [](#cb28-1)$ echo ''copper'' | awk ''{gsub(/\y/, ":")} 1''

    [](#cb28-2):copper:

    [](#cb28-3)$ echo ''copper'' | awk ''{gsub(/\B/, ":")} 1''

    [](#cb28-4)c:o:p:p:e:r

    ```


    > ![warning](media/file1.svg) Negative logic is handy in many text processing
    situations. But use it with care, you might end up matching things you didn''t
    intend.


    ## Combining conditions


    Before seeing the next regexp feature, it is good to note that sometimes using
    logical operators is easier to read and maintain compared to doing everything
    with regexp.


    ```

    [](#cb29-1)$ # string starting with ''b'' but not containing ''at''

    [](#cb29-2)$ awk ''/^b/ && !/at/'' table.txt

    [](#cb29-3)blue cake mug shirt -7

    [](#cb29-4)

    [](#cb29-5)$ # if the first field contains ''low'' or the last field is less than
    0

    [](#cb29-6)$ awk ''$1 ~ /low/ || $NF<0'' table.txt

    [](#cb29-7)blue cake mug shirt -7

    [](#cb29-8)yellow banana window shoes 3.14

    ```


    ## Alternation


    Many a times, you''d want to search for multiple terms. In a conditional expression,
    you can use the logical operators to combine multiple conditions. With regular
    expressions, the `|` metacharacter is similar to logical OR. The regular expression
    will match if any of the expression separated by `|` is satisfied. These can have
    their own independent anchors as well.


    Alternation is similar to using `||` operator between two regexps. Having a single
    regexp helps to write terser code and `||` cannot be used when substitution is
    required.


    ```

    [](#cb30-1)$ # match whole word ''par'' or string ending with ''s''

    [](#cb30-2)$ # same as: awk ''/\<par\>/ || /s$/''

    [](#cb30-3)$ awk ''/\<par\>|s$/'' word_anchors.txt

    [](#cb30-4)sub par

    [](#cb30-5)two spare computers

    [](#cb30-6)

    [](#cb30-7)$ # replace ''cat'' or ''dog'' or ''fox'' with ''--''

    [](#cb30-8)$ echo ''cats dog bee parrot foxed'' | awk ''{gsub(/cat|dog|fox/, "--")}
    1''

    [](#cb30-9)--s -- bee parrot --ed

    ```


    There''s some tricky situations when using alternation. If it is used for filtering
    a line, there is no ambiguity. However, for use cases like substitution, it depends
    on a few factors. Say, you want to replace `are` or `spared` — which one should
    get precedence? The bigger word `spared` or the substring `are` inside it or based
    on something else?


    The alternative which matches earliest in the input gets precedence.


    ```

    [](#cb31-1)$ # note that ''sub'' is used here, so only first match gets replaced

    [](#cb31-2)$ echo ''cats dog bee parrot foxed'' | awk ''{sub(/bee|parrot|at/,
    "--")} 1''

    [](#cb31-3)c--s dog bee parrot foxed

    [](#cb31-4)$ echo ''cats dog bee parrot foxed'' | awk ''{sub(/parrot|at|bee/,
    "--")} 1''

    [](#cb31-5)c--s dog bee parrot foxed

    ```


    In case of matches starting from same location, for example `spar` and `spared`,
    the longest matching portion gets precedence. Unlike other regular expression
    implementations, left-to-right priority for alternation comes into play only if
    length of the matches are the same. See [Longest match wins](#ch004.xhtml_longest-match-wins)
    and [Backreferences](#ch004.xhtml_backreferences) sections for more examples.


    ```

    [](#cb32-1)$ echo ''spared party parent'' | awk ''{sub(/spa|spared/, "**")} 1''

    [](#cb32-2)** party parent

    [](#cb32-3)$ echo ''spared party parent'' | awk ''{sub(/spared|spa/, "**")} 1''

    [](#cb32-4)** party parent

    [](#cb32-5)

    [](#cb32-6)$ # other implementations like ''perl'' have left-to-right priority

    [](#cb32-7)$ echo ''spared party parent'' | perl -pe ''s/spa|spared/**/''

    [](#cb32-8)**red party parent

    ```


    ## Grouping


    Often, there are some common things among the regular expression alternatives.
    It could be common characters or qualifiers like the anchors. In such cases, you
    can group them using a pair of parentheses metacharacters. Similar to `a(b+c)d
    = abd+acd` in maths, you get `a(b|c)d = abd|acd` in regular expressions.


    ```

    [](#cb33-1)$ # without grouping

    [](#cb33-2)$ printf ''red\nreform\nread\narrest\n'' | awk ''/reform|rest/''

    [](#cb33-3)reform

    [](#cb33-4)arrest

    [](#cb33-5)$ # with grouping

    [](#cb33-6)$ printf ''red\nreform\nread\narrest\n'' | awk ''/re(form|st)/''

    [](#cb33-7)reform

    [](#cb33-8)arrest

    [](#cb33-9)

    [](#cb33-10)$ # without grouping

    [](#cb33-11)$ printf ''sub par\nspare\npart time\n'' | awk ''/\<par\>|\<part\>/''

    [](#cb33-12)sub par

    [](#cb33-13)part time

    [](#cb33-14)$ # taking out common anchors

    [](#cb33-15)$ printf ''sub par\nspare\npart time\n'' | awk ''/\<(par|part)\>/''

    [](#cb33-16)sub par

    [](#cb33-17)part time

    [](#cb33-18)$ # taking out common characters as well

    [](#cb33-19)$ # you''ll later learn a better technique instead of using empty
    alternate

    [](#cb33-20)$ printf ''sub par\nspare\npart time\n'' | awk ''/\<par(|t)\>/''

    [](#cb33-21)sub par

    [](#cb33-22)part time

    ```


    ## Matching the metacharacters


    You have seen a few metacharacters and escape sequences that help to compose a
    regular expression. To match the metacharacters literally, i.e. to remove their
    special meaning, prefix those characters with a `\` character. To indicate a literal
    `\` character, use `\\`.


    Unlike `grep` and `sed`, the string anchors have to be always escaped to match
    them literally as there is no BRE mode in `awk`. They do not lose their special
    meaning when not used in their customary positions.


    ```

    [](#cb34-1)$ # awk ''/b^2/'' will not work even though ^ isn''t being used as
    anchor

    [](#cb34-2)$ # b^2 will work for both grep and sed if you use BRE syntax

    [](#cb34-3)$ echo ''a^2 + b^2 - C*3'' | awk ''/b\^2/''

    [](#cb34-4)a^2 + b^2 - C*3

    [](#cb34-5)

    [](#cb34-6)$ # note that '')'' doesn''t need to be escaped

    [](#cb34-7)$ echo ''(a*b) + c'' | awk ''{gsub(/\(|)/, "")} 1''

    [](#cb34-8)a*b + c

    [](#cb34-9)

    [](#cb34-10)$ echo ''\learn\by\example'' | awk ''{gsub(/\\/, "/")} 1''

    [](#cb34-11)/learn/by/example

    ```


    > ![info](media/file0.svg) [Backreferences](#ch004.xhtml_backreferences) section
    will discuss how to handle the metacharacters in replacement section.


    ## Using string literal as regexp'
  toc: []
  trans: '


    使用 `\<` 表示单词起始锚点，使用 `\>` 表示单词结束锚点。作为替代方案，你可以使用 `\y` 同时表示单词的起始和结束锚点。


    > ![info](img/file0.svg) 通常 `\b` 用于表示单词锚点（例如在 `grep`、`sed`、`perl` 等中），但在 `awk`
    中，转义序列 `\b` 指的是退格字符。


    ```

    cat word_anchors.txt

    sub par

    spar

    apparent effort

    two spare computers

    cart part tart mart

    $ # 以 ''par'' 开头的单词

    $ awk ''/\<par/'' word_anchors.txt

    sub par

    cart part tart mart

    $ # 以 ''par'' 结尾的单词

    $ awk ''/par\>/'' word_anchors.txt

    sub par

    spar

    $ # 仅匹配整个单词 ''par''

    $ # 注意只有替换成功的行会被打印

    $ # 因为 sub/gsub 的返回值是替换的次数

    $ awk ''gsub(/\<par\>/, "***")'' word_anchors.txt

    sub ***

    ```


    > ![warning](img/file1.svg) 另参 单词边界差异 。


    `\y` 也有反向操作。`\B` 匹配单词锚点匹配以外的位置。


    ```

    # 如果 ''par'' 被单词字符包围，则匹配它

    $ awk ''/\Bpar\B/'' word_anchors.txt

    apparent effort

    two spare computers

    $ # 匹配 ''par'' 但不是作为单词起始

    $ awk ''/\Bpar/'' word_anchors.txt

    spar

    apparent effort

    two spare computers

    $ # 匹配 ''par'' 但不是作为单词结束

    $ awk ''/par\B/'' word_anchors.txt

    apparent effort

    two spare computers

    cart part tart mart

    ```


    这是一个将单词边界本身作为模式使用的示例。它也清晰地展示了 `\y` 和 `\B` 的相反功能。


    ```

    echo ''copper'' | awk ''{gsub(/\y/, ":")} 1''

    :copper:

    $ echo ''copper'' | awk ''{gsub(/\B/, ":")} 1''

    c:o:p:p:e:r

    ```


    > ![warning](img/file1.svg) 否定逻辑在许多文本处理场景中非常有用。但请谨慎使用，否则你可能会匹配到你无意的内容。


    ## 组合条件


    在查看下一个正则表达式特性之前，最好注意，有时使用逻辑运算符比用正则表达式完成所有工作更易于阅读和维护。


    ```

    # 字符串以 ''b'' 开头但不包含 ''at''

    $ awk ''/^b/ && !/at/'' table.txt

    blue cake mug shirt -7

    $ # 如果第一个字段包含 ''low'' 或者最后一个字段小于 0

    $ awk ''$1 ~ /low/ || $NF<0'' table.txt

    blue cake mug shirt -7

    yellow banana window shoes 3.14

    ```


    ## 分支 (Alternation)


    很多时候，你想要搜索多个术语。在条件表达式中，你可以使用逻辑运算符组合多个条件。在正则表达式中，元字符 `|` 类似于逻辑或。如果由 `|` 分隔的表达式中有任何一个满足条件，正则表达式将匹配。这些表达式也可以拥有自己独立的锚点。


    分支 类似于在两个正则表达式之间使用 `||` 运算符。使用单个正则表达式有助于编写更简洁的代码，且在需要替换时无法使用 `||`。


    ```

    # 匹配整个单词 ''par'' 或以 ''s'' 结尾的字符串

    # 等同于：awk ''/\<par\>/ || /s$/

    $ awk ''/\<par\>|s$/'' word_anchors.txt

    sub par

    two spare computers

    $ 将 ''cat'' 或 ''dog'' 或 ''fox'' 替换为 ''--''

    $ echo ''cats dog parrot foxed'' | awk ''{gsub(/cat|dog|fox/, "--")} 1''

    ```


    使用分支时存在一些复杂的情况。如果它用于过滤行，则没有歧义。但对于替换等用例，取决于几个因素。例如，你想替换 `are` 或 `spared` —— 哪一个获得优先级？是更大的单词
    `spared`，还是它内部的子字符串 `are`，或者基于其他什么？在输入中最早匹配的分支获得优先级。


    ```

    # 注意这里使用了 ''sub''，所以第一个匹配的项会被替换

    $ echo ''cats dog parrot foxed'' | awk ''{sub(/bee|parrot/, "--")} 1''

    cats dog parrot foxed

    $ echo ''cats dog parrot foxed'' | awk ''{sub(/parrot|at/, "--")} 1''

    ```


    在匹配从相同位置开始的情况下，对于 `spar` 和 `spared`，最长部分获得优先级。与其他正则表达式实现不同，分支的从左到右优先级仅在匹配长度相同时才起作用。请参
    最长匹配获胜 和 反引用 以了解更多示例。


    ```

    echo ''spared party parent'' | awk ''{sub(/spa|spared/, "--")} 1''

    party parent

    $ echo ''spared party parent'' | awk ''{sub(/spared|spa/, "--")} 1''

    party parent

    # 其他实现如 ''perl'' 具有从左到右的优先级

    $ echo ''spared party parent'' | perl -pe ''s/spa|spared/''

    ```


    ## 分组


    通常，正则表达式之间有一些共同点。可能是共同字符，也可能是锚点之类的限定符。在这种情况下，你可以使用一对元字符对它们进行分组。类似于数学中的 `a(b+c)`d`，在正则表达式中得到
    `a(b|c)d`。


    ```

    # 无分组

    $ printf ''red\nreform\nread\narrest\n'' | awk ''/reform|rest/''

    reform

    # 有分组

    $ printf ''red\nreform\nread\narrest\n'' | awk ''/re(form|st)/''

    arrest

    # 无分组

    $ printf ''sub par\nspare\npart time\n'' | awk ''/\<par>|\<part>/''

    sub par

    part time

    # 提取共同锚点

    $ printf ''sub par\nspare\npart time\n'' | awk ''/\<par|t)>\''

    sub par

    part time

    # 也提取共同字符

    # 你以后将学习一种更好的技术，而不是使用空分支

    $ awk ''/\<par(|t)>\''

    sub par

    part time

    ```


    ## 匹配元字符


    你已经看到了一些有助于组合正则表达式的元字符和转义序列。要字面匹配这些元字符（即移除它们的特殊含义），在这些字符前加上 `\` 字符。要表示字面量 `\`
    字符，请使用 `\\`。


    与 `grep` 和 `sed` 不同，字符串锚点必须始终转义才能字面匹配，因为 `awk` 中没有 BRE 模式。当它们不在惯常的位置时，它们不会失去其特殊含义。


    ```

    # awk ''/b²/'' 将不起作用，即使 ^ 没有被作锚点

    # 如果使用 BRE 语法，b² 对于 grep 和 sed 都是有效的

    $ echo ''a² + b² - C*3'' | awk ''/b\²/''

    a² + b² - C*3

    # 注意 '')'' 不需要转义

    $ echo ''(a*b) + c'' | awk ''{gsub(/\(|)/, "")} 1''

    a*b + c

    $ echo ''\learn\by\example'' | awk ''{gsub(/\\/, "/")} 1''

    /learn/by/example

    ```


    > ![info](img/file0.svg) 反引用 将在替换部分讨论如何处理元字符。


    ## 使用字符串字面量作为正则


    '
- fmt: '

    The first argument to `sub` and `gsub` functions can be a string as well, `awk`
    will handle converting it to a regexp. This has a few advantages. For example,
    if you have many `/` characters in the search pattern, it might become easier
    to use string instead of regexp.


    ```

    [](#cb35-1)$ p=''/home/learnbyexample/reports''

    [](#cb35-2)$ echo "$p" | awk ''{sub(/\/home\/learnbyexample\//, "~/")} 1''

    [](#cb35-3)~/reports

    [](#cb35-4)$ echo "$p" | awk ''{sub("/home/learnbyexample/", "~/")} 1''

    [](#cb35-5)~/reports

    [](#cb35-6)

    [](#cb35-7)$ # example with line matching instead of substitution

    [](#cb35-8)$ printf ''/foo/bar/1\n/foo/baz/1\n'' | awk ''/\/foo\/bar\//''

    [](#cb35-9)/foo/bar/1

    [](#cb35-10)$ printf ''/foo/bar/1\n/foo/baz/1\n'' | awk ''$0 ~ "/foo/bar/"''

    [](#cb35-11)/foo/bar/1

    ```


    In the above examples, the string literal was supplied directly. But any other
    expression or variable can be used as well, examples for which will be shown later
    in this chapter. The reason why string isn''t always used as the first argument
    is that the special meaning for `\` character will clash. For example:


    ```

    [](#cb36-1)$ awk ''gsub("\<par\>", "X")'' word_anchors.txt

    [](#cb36-2)awk: cmd. line:1: warning: escape sequence `\<'' treated as plain `<`

    [](#cb36-3)awk: cmd. line:1: warning: escape sequence `\>` treated as plain `>`

    [](#cb36-4)

    [](#cb36-5)$ # you''ll need \\ to represent \

    [](#cb36-6)$ awk ''gsub("\\<par\\>", "X")'' word_anchors.txt

    [](#cb36-7)sub X

    [](#cb36-8)$ # much more readable with regexp literal

    [](#cb36-9)$ awk ''gsub(/\<par\>/, "X")'' word_anchors.txt

    [](#cb36-10)sub X

    [](#cb36-11)

    [](#cb36-12)$ # another example

    [](#cb36-13)$ echo ''\learn\by\example'' | awk ''{gsub("\\\\", "/")} 1''

    [](#cb36-14)/learn/by/example

    [](#cb36-15)$ echo ''\learn\by\example'' | awk ''{gsub(/\\/, "/")} 1''

    [](#cb36-16)/learn/by/example

    ```


    > ![info](media/file0.svg) See [gawk manual: Gory details](https://www.gnu.org/software/gawk/manual/gawk.html#Gory-Details)
    for more information than you''d want.


    ## The dot meta character


    The dot metacharacter serves as a placeholder to match any character (including
    the newline character). Later you''ll learn how to define your own custom placeholder
    for limited set of characters.


    ```

    [](#cb37-1)$ # 3 character sequence starting with ''c'' and ending with ''t''

    [](#cb37-2)$ echo ''tac tin cot abc:tyz excited'' | awk ''{gsub(/c.t/, "-")} 1''

    [](#cb37-3)ta-in - ab-yz ex-ed

    [](#cb37-4)

    [](#cb37-5)$ # any character followed by 3 and again any character

    [](#cb37-6)$ printf ''4\t35x\n'' | awk ''{gsub(/.3./, "")} 1''

    [](#cb37-7)4x

    [](#cb37-8)

    [](#cb37-9)$ # ''c'' followed by any character followed by ''x''

    [](#cb37-10)$ awk ''BEGIN{s="abc\nxyz"; sub(/c.x/, " ", s); print s}''

    [](#cb37-11)ab yz

    ```


    ## Quantifiers


    As an analogy, alternation provides logical OR. Combining the dot metacharacter
    `.` and quantifiers (and alternation if needed) paves a way to perform logical
    AND. For example, to check if a string matches two patterns with any number of
    characters in between. Quantifiers can be applied to both characters and groupings.
    Apart from ability to specify exact quantity and bounded range, these can also
    match unbounded varying quantities.


    First up, the `?` metacharacter which quantifies a character or group to match
    `0` or `1` times. This helps to define optional patterns and build terser patterns
    compared to groupings for some cases.


    ```

    [](#cb38-1)$ # same as: awk ''{gsub(/\<(fe.d|fed)\>/, "X")} 1''

    [](#cb38-2)$ echo ''fed fold fe:d feeder'' | awk ''{gsub(/\<fe.?d\>/, "X")} 1''

    [](#cb38-3)X fold X feeder

    [](#cb38-4)

    [](#cb38-5)$ # same as: awk ''/<par(|t)>''

    [](#cb38-6)$ printf ''sub par\nspare\npart time'' | awk ''/<part>/''

    [](#cb38-7)sub par

    [](#cb38-8)part time

    [](#cb38-9)$ # same as: awk ''{gsub(/part|parrot/, "X")} 1''

    [](#cb38-10)$ echo ''par part parent'' | awk ''{gsub(/par(ro)?t/, "X")} 1''

    [](#cb38-11)par X parent

    [](#cb38-12)$ # same as: awk ''{gsub(/part|parrot|parent/, "X")} 1''

    [](#cb38-13)$ echo ''par part parent'' | awk ''{gsub(/par(en|ro)?t/, "X")} 1''

    [](#cb38-14)par X X

    [](#cb38-15)

    [](#cb38-16)$ # both < replaced with <

    [](#cb38-17)$ echo ''blah bar <'' | awk ''{gsub(/<?, "<")} 1''

    [](#cb38-19)blah bar <

    ```


    The `*` metacharacter quantifies a character or group to match `0` or more times.
    There is no upper bound, more details will be discussed later.


    ```

    [](#cb39-1)$ # ''f'' followed by zero or more of ''e'' followed by ''d''

    [](#cb39-2)$ echo ''fd fod fe:d feeder'' | awk ''{gsub(/fe*d/, "X")} 1''

    [](#cb39-3)X fod fe:d

    [](#cb39-4)

    [](#cb39-5)$ # zero or more of ''1'' followed by ''2''

    [](#cb39-6)$ echo ''31111111112511142'' | awk ''{gsub(/1*2/, "-")} 1''

    [](#cb39-7)3-51114-

    ```


    The `+` metacharacter quantifies a character or group to match `1` or more times.
    Similar to `*` quantifier, there is no upper bound.


    ```

    [](#cb40-1)$ # ''f'' followed by one or more of ''e'' followed by ''d''

    [](#cb40-2)$ echo ''fd fod fe:d feeder'' | awk ''{gsub(/fe+d/, "X")} 1''

    [](#cb40-3)X fod fe:d

    [](#cb40-4)$ # ''f'' followed by at least one of ''e'' or ''o'' or '':'' followed
    by ''d''

    [](#cb40-5)$ echo ''fd fod fe:d feeder'' | awk ''{gsub(/f(e|o|)+d/, "X")} 1''

    [](#cb40-6)fd X X X

    [](#cb40-8)$ # one or more of ''1'' followed by optional ''4'' and then ''2''

    [](#cb40-9)$ echo ''31111111112511142'' | awk ''{gsub(/1+4?2/, "-")} 1''

    [](#cb40-10)3-5-

    ```


    You can specify a range of integer numbers, both bounded and unbounded, using
    `{}` metacharacters. There are four ways to use this quantifier as listed:


    | Pattern | Description |

    | --- | --- |

    | `{m,n}` | match `m` to `n` times |

    | `{m,}` | match at least `m` times |

    | `{,n}` | match up to `n` times (including `0` times) |

    | `{n}` | match exactly `n` times |


    ```

    [](#cb41-1)$ # note that inside {} space is not allowed

    [](#cb41-2)$ echo ''ac abc abbc abbbc abbbbbbc'' | awk ''{gsub(/ab{1,4}c/, "X")}
    1''

    [](#cb41-3)ac X X X abbbbbbc

    [](#cb41-4)

    [](#cb41-5)$ echo ''ac abc abbc abbbc abbbbbbc'' | awk ''{gsub(/ab{3,,}c/, "X")}
    1''

    [](#cb41-6)ac abc abbc X X

    [](#cb41-7)

    [](#cb41-8)$ echo ''ac abc abbc abbbc abbbbbbc'' | awk ''{gsub(/ab{,2}c/, "X")}
    1''

    [](#cb41-9)X X X abbbbbbbbc

    [](#cb41-10)

    [](#cb41-11)$ echo ''ac abc abbc abbbc abbbbbbc'' | awk ''{gsub(/ab{3}c/, "X")}
    1''

    [](#cb41-12)ac abc abbc X abbbbbbc

    ```


    > ![info](media/file0.svg) The `{}` metacharacters have to be escaped to match
    them literally. Similar to `()` metacharacters, escaping `{` alone is enough.


    Next up, how to construct conditional AND using dot metacharacter and quantifiers.


    ```

    [](#cb42-1)$ # match ''Error'' followed by zero or more characters followed by
    ''valid''

    [](#cb42-2)$ echo ''Error: not a valid input'' | awk ''/Error.*valid/''

    [](#cb42-3)Error: not a valid input

    ```


    To allow matching in any order, you''ll have to bring in alternation as well.
    But, for more than 3 patterns, the combinations become too many to write and maintain.


    ```

    [](#cb43-1)$ # ''cat'' followed by ''dog'' or ''dog'' followed by ''cat''

    [](#cb43-2)$ echo ''two cats and a dog'' | awk ''{gsub(/cat.*dog|dog.*cat/, "pets")}
    1''

    [](#cb43-3)two pets

    [](#cb43-4)$ echo ''two dogs and a cat'' | awk ''{gsub(/cat.*dog|dog.*cat/, "pets")}
    1''

    [](#cb43-5)two pets

    ```


    ## Longest match wins


    You''ve already seen an example with alternation, where the longest matching portion
    was chosen if two alternatives started from same location. For example `spar|spared`
    will result in `spared` being chosen over `spar`. The same applies whenever there
    are two or more matching possibilities from same starting location. For example,
    `f.?o` will match `foo` instead of `fo` if the input string to match is `foot`.

    '
  raw: 'The first argument to `sub` and `gsub` functions can be a string as well,
    `awk` will handle converting it to a regexp. This has a few advantages. For example,
    if you have many `/` characters in the search pattern, it might become easier
    to use string instead of regexp.


    ```

    [](#cb35-1)$ p=''/home/learnbyexample/reports''

    [](#cb35-2)$ echo "$p" | awk ''{sub(/\/home\/learnbyexample\//, "~/")} 1''

    [](#cb35-3)~/reports

    [](#cb35-4)$ echo "$p" | awk ''{sub("/home/learnbyexample/", "~/")} 1''

    [](#cb35-5)~/reports

    [](#cb35-6)

    [](#cb35-7)$ # example with line matching instead of substitution

    [](#cb35-8)$ printf ''/foo/bar/1\n/foo/baz/1\n'' | awk ''/\/foo\/bar\//''

    [](#cb35-9)/foo/bar/1

    [](#cb35-10)$ printf ''/foo/bar/1\n/foo/baz/1\n'' | awk ''$0 ~ "/foo/bar/"''

    [](#cb35-11)/foo/bar/1

    ```


    In the above examples, the string literal was supplied directly. But any other
    expression or variable can be used as well, examples for which will be shown later
    in this chapter. The reason why string isn''t always used as the first argument
    is that the special meaning for `\` character will clash. For example:


    ```

    [](#cb36-1)$ awk ''gsub("\<par\>", "X")'' word_anchors.txt

    [](#cb36-2)awk: cmd. line:1: warning: escape sequence `\<'' treated as plain `<''

    [](#cb36-3)awk: cmd. line:1: warning: escape sequence `\>'' treated as plain `>''

    [](#cb36-4)

    [](#cb36-5)$ # you''ll need \\ to represent \

    [](#cb36-6)$ awk ''gsub("\\<par\\>", "X")'' word_anchors.txt

    [](#cb36-7)sub X

    [](#cb36-8)$ # much more readable with regexp literal

    [](#cb36-9)$ awk ''gsub(/\<par\>/, "X")'' word_anchors.txt

    [](#cb36-10)sub X

    [](#cb36-11)

    [](#cb36-12)$ # another example

    [](#cb36-13)$ echo ''\learn\by\example'' | awk ''{gsub("\\\\", "/")} 1''

    [](#cb36-14)/learn/by/example

    [](#cb36-15)$ echo ''\learn\by\example'' | awk ''{gsub(/\\/, "/")} 1''

    [](#cb36-16)/learn/by/example

    ```


    > ![info](media/file0.svg) See [gawk manual: Gory details](https://www.gnu.org/software/gawk/manual/gawk.html#Gory-Details)
    for more information than you''d want.


    ## The dot meta character


    The dot metacharacter serves as a placeholder to match any character (including
    the newline character). Later you''ll learn how to define your own custom placeholder
    for limited set of characters.


    ```

    [](#cb37-1)$ # 3 character sequence starting with ''c'' and ending with ''t''

    [](#cb37-2)$ echo ''tac tin cot abc:tyz excited'' | awk ''{gsub(/c.t/, "-")} 1''

    [](#cb37-3)ta-in - ab-yz ex-ed

    [](#cb37-4)

    [](#cb37-5)$ # any character followed by 3 and again any character

    [](#cb37-6)$ printf ''4\t35x\n'' | awk ''{gsub(/.3./, "")} 1''

    [](#cb37-7)4x

    [](#cb37-8)

    [](#cb37-9)$ # ''c'' followed by any character followed by ''x''

    [](#cb37-10)$ awk ''BEGIN{s="abc\nxyz"; sub(/c.x/, " ", s); print s}''

    [](#cb37-11)ab yz

    ```


    ## Quantifiers


    As an analogy, alternation provides logical OR. Combining the dot metacharacter
    `.` and quantifiers (and alternation if needed) paves a way to perform logical
    AND. For example, to check if a string matches two patterns with any number of
    characters in between. Quantifiers can be applied to both characters and groupings.
    Apart from ability to specify exact quantity and bounded range, these can also
    match unbounded varying quantities.


    First up, the `?` metacharacter which quantifies a character or group to match
    `0` or `1` times. This helps to define optional patterns and build terser patterns
    compared to groupings for some cases.


    ```

    [](#cb38-1)$ # same as: awk ''{gsub(/\<(fe.d|fed)\>/, "X")} 1''

    [](#cb38-2)$ echo ''fed fold fe:d feeder'' | awk ''{gsub(/\<fe.?d\>/, "X")} 1''

    [](#cb38-3)X fold X feeder

    [](#cb38-4)

    [](#cb38-5)$ # same as: awk ''/\<par(|t)\>/''

    [](#cb38-6)$ printf ''sub par\nspare\npart time\n'' | awk ''/\<part?\>/''

    [](#cb38-7)sub par

    [](#cb38-8)part time

    [](#cb38-9)

    [](#cb38-10)$ # same as: awk ''{gsub(/part|parrot/, "X")} 1''

    [](#cb38-11)$ echo ''par part parrot parent'' | awk ''{gsub(/par(ro)?t/, "X")}
    1''

    [](#cb38-12)par X X parent

    [](#cb38-13)$ # same as: awk ''{gsub(/part|parrot|parent/, "X")} 1''

    [](#cb38-14)$ echo ''par part parrot parent'' | awk ''{gsub(/par(en|ro)?t/, "X")}
    1''

    [](#cb38-15)par X X X

    [](#cb38-16)

    [](#cb38-17)$ # both ''<'' and ''\<'' are replaced with ''\<''

    [](#cb38-18)$ echo ''blah \< foo bar < blah baz <'' | awk ''{gsub(/\\?</, "\\<")}
    1''

    [](#cb38-19)blah \< foo bar \< blah baz \<

    ```


    The `*` metacharacter quantifies a character or group to match `0` or more times.
    There is no upper bound, more details will be discussed later in the next section.


    ```

    [](#cb39-1)$ # ''f'' followed by zero or more of ''e'' followed by ''d''

    [](#cb39-2)$ echo ''fd fed fod fe:d feeeeder'' | awk ''{gsub(/fe*d/, "X")} 1''

    [](#cb39-3)X X fod fe:d Xer

    [](#cb39-4)

    [](#cb39-5)$ # zero or more of ''1'' followed by ''2''

    [](#cb39-6)$ echo ''3111111111125111142'' | awk ''{gsub(/1*2/, "-")} 1''

    [](#cb39-7)3-511114-

    ```


    The `+` metacharacter quantifies a character or group to match `1` or more times.
    Similar to `*` quantifier, there is no upper bound.


    ```

    [](#cb40-1)$ # ''f'' followed by one or more of ''e'' followed by ''d''

    [](#cb40-2)$ echo ''fd fed fod fe:d feeeeder'' | awk ''{gsub(/fe+d/, "X")} 1''

    [](#cb40-3)fd X fod fe:d Xer

    [](#cb40-4)

    [](#cb40-5)$ # ''f'' followed by at least one of ''e'' or ''o'' or '':'' followed
    by ''d''

    [](#cb40-6)$ echo ''fd fed fod fe:d feeeeder'' | awk ''{gsub(/f(e|o|:)+d/, "X")}
    1''

    [](#cb40-7)fd X X X Xer

    [](#cb40-8)

    [](#cb40-9)$ # one or more of ''1'' followed by optional ''4'' and then ''2''

    [](#cb40-10)$ echo ''3111111111125111142'' | awk ''{gsub(/1+4?2/, "-")} 1''

    [](#cb40-11)3-5-

    ```


    You can specify a range of integer numbers, both bounded and unbounded, using
    `{}` metacharacters. There are four ways to use this quantifier as listed below:


    | Pattern | Description |


    | --- | --- |


    | `{m,n}` | match `m` to `n` times |


    | `{m,}` | match at least `m` times |


    | `{,n}` | match up to `n` times (including `0` times) |


    | `{n}` | match exactly `n` times |


    ```

    [](#cb41-1)$ # note that inside {} space is not allowed

    [](#cb41-2)$ echo ''ac abc abbc abbbc abbbbbbbbc'' | awk ''{gsub(/ab{1,4}c/, "X")}
    1''

    [](#cb41-3)ac X X X abbbbbbbbc

    [](#cb41-4)

    [](#cb41-5)$ echo ''ac abc abbc abbbc abbbbbbbbc'' | awk ''{gsub(/ab{3,}c/, "X")}
    1''

    [](#cb41-6)ac abc abbc X X

    [](#cb41-7)

    [](#cb41-8)$ echo ''ac abc abbc abbbc abbbbbbbbc'' | awk ''{gsub(/ab{,2}c/, "X")}
    1''

    [](#cb41-9)X X X abbbc abbbbbbbbc

    [](#cb41-10)

    [](#cb41-11)$ echo ''ac abc abbc abbbc abbbbbbbbc'' | awk ''{gsub(/ab{3}c/, "X")}
    1''

    [](#cb41-12)ac abc abbc X abbbbbbbbc

    ```


    > ![info](media/file0.svg) The `{}` metacharacters have to be escaped to match
    them literally. Similar to `()` metacharacters, escaping `{` alone is enough.


    Next up, how to construct conditional AND using dot metacharacter and quantifiers.


    ```

    [](#cb42-1)$ # match ''Error'' followed by zero or more characters followed by
    ''valid''

    [](#cb42-2)$ echo ''Error: not a valid input'' | awk ''/Error.*valid/''

    [](#cb42-3)Error: not a valid input

    ```


    To allow matching in any order, you''ll have to bring in alternation as well.
    But, for more than 3 patterns, the combinations become too many to write and maintain.


    ```

    [](#cb43-1)$ # ''cat'' followed by ''dog'' or ''dog'' followed by ''cat''

    [](#cb43-2)$ echo ''two cats and a dog'' | awk ''{gsub(/cat.*dog|dog.*cat/, "pets")}
    1''

    [](#cb43-3)two pets

    [](#cb43-4)$ echo ''two dogs and a cat'' | awk ''{gsub(/cat.*dog|dog.*cat/, "pets")}
    1''

    [](#cb43-5)two pets

    ```


    ## Longest match wins


    You''ve already seen an example with alternation, where the longest matching portion
    was chosen if two alternatives started from same location. For example `spar|spared`
    will result in `spared` being chosen over `spar`. The same applies whenever there
    are two or more matching possibilities from same starting location. For example,
    `f.?o` will match `foo` instead of `fo` if the input string to match is `foot`.'
