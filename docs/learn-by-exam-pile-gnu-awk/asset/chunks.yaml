  trans: "\n\n```bash\n# 静默失败，由于字符串到数字的转换，$word 变成了 $0\nawk -v word=\"cake\" '$2==$word'\
    \ table.txt\n# 当变量使用正确时可以工作\nawk -v word=\"cake\" '$2==word' table.txt\nblue cake\
    \ mug shirt -7\n# 在这里 'field' 被替换为 '2'，因此打印 $2\nawk -v field=2 '{print $field}'\
    \ table.txt\nbread\ncake\nbanana\n```\n\n## Dos 风格行结束\n\n如前所述，行结束在不同平台之间有所不同。在\
    \ Windows 上，行结束通常是回车符和换行符的组合，被称为 `dos style` 行结束。由于 `GNU awk` 允许多字符的 `RS`，因此处理起来很容易。请参考\
    \ [stackoverflow: 为什么我的工具输出会覆盖自身，我该如何修复它？](https://stackoverflow.com/q/45772525/4082052)\
    \ 获取详细讨论和各种缓解方法。\n\n```bash\n# unix 风格行结束没有问题\nprintf 'mat dog\\n123 789\\n' |\
    \ awk '{print $2, $1}'\ndog mat\n789 123\n# dos 风格行结束会导致麻烦\nprintf 'mat dog\\\
    r\\n123 789\\r\\n' | awk '{print $2, $1}'\n mat\n123\nprintf 'mat dog\\r\\n123\
    \ 789\\r\\n' | awk '{sub(/$/, \".\")} 1'\n.at dog\n.23 789\n# 如果你想用同一个命令同时处理 unix\
    \ 和 dos 风格，请使用 \\r?\\n\n# 注意 ORS 仍然仅为换行符\nprintf 'mat dog\\r\\n123 789\\r\\n'\
    \ | awk -v RS='\\r\\n' '{print $2, $1}'\ndog mat\n789 123\nprintf 'mat dog\\r\\\
    n123 789\\r\\n' | awk -v RS='\\r\\n' '{sub(/$/, \".\")} 1'\nmat dog.\n123 789.\n\
    ```\n\n## 当字符串包含换行符时 ^ 和 $ 的行为\n\n在某些正则表达式实现中，`^` 匹配行首，`$` 匹配行尾（以换行符作为行分隔符）。在\
    \ `awk` 中，这些锚点始终匹配整个字符串的开头和整个字符串的结尾。当 `RS` 不是换行符时，或者你有一个包含换行符的字符串值时，这种情况就会发生作用。\n\
    \n```bash\n# 'apple\\n' 不匹配，因为有换行符\nprintf 'apple\\n,mustard,grape,\\nmango' |\
    \ awk -v RS=, '/e$/'\ngrape\n# '\\nmango' 不匹配，因为有换行符\nprintf 'apple\\n,mustard,grape,\\\
    nmango' | awk -v RS=, '/^m/'\nmustard\n```\n\n## 单词边界差异\n\n单词边界 `\\y` 同时匹配单词位置的开始和结束。而，`\\\
    <` 和 `\\>` 分别精确匹配单词位置的开始和结束。这导致你必须根据所需的结果选择这些单词边界中的某一个。以 `I have 12, he has 2!`\
    \ 作为样本文本，如下图所示，图中用竖线标记了单词边界。最后一个字符 `!` 没有单词结束边界，因为它不是单词字符。\n\n![word boundary](img/file2.png)\n\
    \n```bash\n# \\y 同时匹配单词边界的开始和结束\n# 这里的第一次匹配使用了 'I' 和 'have' 的起始边界\necho 'I have\
    \ 12, he has 2!' | awk '{gsub(/\\y..\\y/, \"[&]\")} 1'\n[I ]have [12][,he] has\
    \ [2]!\n# \\< 和 \\> 只匹配单词的开头结束边界\necho 'I have 12, he has 2!' | awk '{gsub(/\\\
    <..\\>/, \"[&]\")} 1'\nI have [12], [he] has 2\n```\n\n这里是另一个示例展示了两种单词边界之间的差异。\n\
    \n```bash\n# 在单词的开始/结束添加某些内容\necho 'hi_42 12b' | awk '{gsub(/\\y/, \":\")} 1'\n\
    hi:42:12b:\n# 只在单词开头添加某些内容\necho 'hi_42 12b' | awk '{gsub(/\\</, \":\")} 1'\n\
    :hi_42 12b\n# 只在单词结束添加某些内容\necho 'hi_42 12b' | awk '{gsub(/\\>/, \":\")} 1'\n\
    hi_42:12b\n```\n\n## 依赖默认值\n\n未初始化的变量是有用的，但有时当你将单个文件转换为多个文件时，它们的转换并不理想。你必须找出哪些变量在处理每个文件开始时需要重置。\n\
    \n```bash\n# 步骤 1 - 适用于单文件\nawk '{sum += $NF} END{print sum}' table.txt\n38.14\n\
    # 步骤 2 - 准备代码适用于多个文件\nawk '{sum += $NF} ENDFILE{print FILENAME \":\" sum}' table.txt\n\
    table.txt:38.14\n# 步骤 3 - 使用多个文件输入检查\n# 哎，sum 的默认数值值 '0' 仅作用一次\nawk '{sum += $NF}\
    \ ENDFILE{print FILENAME \":\" sum}' table.txt\ntable.txt:38.14\nmarks.txt:50.14\n\
    # 步骤 4 - 正确初始化变量\nawk '{sum += $NF} ENDFILE{print FILENAME \":\" sum; sum=0}'\
    \ table.txt\ntable.txt:38.14\nmarks.txt:42\n```\n\n## 替换部分的代码\n\n替换函数的替换部分接受任何表达式，并在需要时转换为字符串。如果正则表达式没有匹配输入字符串，但表达式可以更改变量的值（例如增减运算符）会怎样？好吧，表达式仍然会被执行，这可能不是你想要的。\n\
    \n```bash\n# 第二行没有匹配，但 'c' 仍然被修改了\nawk '{sub(/^(br|ye)/, ++c \") &\")} 1' table.txt\n\
    1) brown bread mat hair 42\nblue cake mug shirt -7\n3) \n# 在应用替换之前检查匹配行\n# 这有助于简化替换的正则表达式\n\
    # 或者，你可以将正则表达式保存在变量中以避免重复\nawk '/^(br|ye)/{sub(/^/, ++c \") \")} 1' table.txt\n\
    1) brown bread mat hair 42\nblue cake mug shirt -7\n2) yellow window shoes 3.14\n\
    ```\n\n此外，表达式每个函数调用执行一次，而不是每次匹配执行一次。\n\n```bash\n# 第一行有两个匹配，但 'c' 只被修改一次\nawk\
    \ '{gsub(/\\<b/, ++c \") &\")} 1' table.txt\n1) brown 1) bread mat hair 42\n2)\
    \ blue cake mug shirt -7\nyellow banana3) 3.14\n```\n\n## 强制字符串上下文\n\n连接空字符串以强制进行字符串比较。\n\
    \n"
- fmt: "\n```bash\n# parentheses around first argument to print used for clarity\n\
    # fields get compared as numbers here\necho '5 5.0' | awk '{print ($1==$2 ? \"\
    same\" : \"different\"), \"number\"}'\nsame number\n\n# fields get compared as\
    \ strings here\necho '5 5.0' | awk '{print ($1\"\"==$2 ? \"same\" : \"different\"\
    ), \"string\"}'\ndifferent string\n```\n\n## Negative NF\n\nManipulating `NF`\
    \ sometimes leads to a negative value. Fortunately, `awk` throws an error instead\
    \ of behaving like uninitialized variable.\n\n```bash\n# file with different number\
    \ of fields\ncat varying.txt\nparrot\ngood cool awesome\nblue sky\n12 34 56 78\
    \ 90\n\n# delete last two fields\nawk '{NF -= 2} 1' varying.txt\nawk: cmd. line:1:\
    \ (FILENAME=varying.txt FNR=1) fatal: NF set to negative value\n\n# add a condition\
    \ to check number of fields\n# assuming that lines with less than 3 fields should\
    \ be preserved\nawk 'NF>2{NF -= 2} 1' varying.txt\nparrot\ngood\nblue sky\n12\
    \ 34 56\n```\n\nHere's another example, which needs to access third field from\
    \ the end.\n\n```bash\nawk '{print $(NF-2)}' varying.txt\nawk: cmd. line:1: (FILENAME=varying.txt\
    \ FNR=1) fatal: attempt to access field -1\n\n# print only if there are minimum\
    \ 3 fields\nawk 'NF>2{print $(NF-2)}' varying.txt\ngood\n56\n```\n\n## Faster\
    \ execution\n\nChanging locale to ASCII (assuming current locale is not ASCII\
    \ and the input file has only ASCII characters) can give significant speed boost.\
    \ Using `mawk` is another way to speed up execution, provided you are not using\
    \ `GNU awk` specific features. Among other feature differences, `mawk` doesn't\
    \ support `{}` form of quantifiers, see [unix.stackexchange: How to specify regex\
    \ quantifiers with mawk?](https://unix.stackexchange.com/q/506119/109046) for\
    \ details. See also [wikipedia: awk Versions and implementations](https://en.wikipedia.org/wiki/AWK_programming_language#Versions_and_implementations).\n\
    \n```bash\n# time shown is best result from multiple runs\n# speed benefit will\
    \ vary depending on computing resources, input, etc\n# /usr/share/dict/words contains\
    \ dictionary words, one word per line\ntime awk '/^([a-d][r-z]){3}$/' /usr/share/dict/words\
    \ > f1\nreal    0m0.029s\n\ntime LC_ALL=C awk '/^([a-d][r-z]){3}$/' /usr/share/dict/words\
    \ > f2\nreal    0m0.022s\n\ntime mawk '/^[a-d][r-z][a-d][r-z][a-d][r-z]$/' /usr/share/dict/words\
    \ > f3\nreal    0m0.009s\n\n# check that the results are same\ndiff -s f1 f2\n\
    Files f1 and f2 are identical\ndiff -s f2 f3\nFiles f2 and f3 are identical\n\
    # clean up temporary files\nrm f1\n```\n\nHere's another example.\n\n```bash\n\
    # count words exactly 3 lowercase 'a'\ntime awk -F'a' 'NF==4{cnt++} END{print\
    \ cnt}' /usr/share/dict/words\nreal    0m0.034s\n\ntime LC_ALL=C awk -F'a' 'NF==4{cnt++}\
    \ END{print cnt}' /usr/share/dict/words\nreal    0m0.023s\n\ntime mawk -F'a' 'NF==4{cnt++}\
    \ END{print cnt}' /usr/share/dict/words\nreal    0m0.014s\n```\n\n## Further Reading\n\
    \n- `man awk` and `info awk` and [online manual](https://www.gnu.org/software/gawk/manual.html)\n\
    - Information about various implementations of `awk`\n    - [awk FAQ](http://www.faqs.org/lang/faq/)\
    \ — great resource, last modified 2002\n    - [grymoire: awk tutorial](https://grymoire.com/Unix/Awk.html)\
    \ — covers information about different `awk` versions\n    - [cheat sheet for\
    \ awk/nawk](https://catonmat.net/ftp/awk.cheat.txt)\n- Q&A on stackoverflow/stackexchange\
    \ are good source of learning material, good for practice\n    - [awk Q&A on stackexchange](https://unix.stackexchange.com/questions/awk?sort=votes&15)\n\
    \    - [awk Q&A on stackoverflow](https://stackoverflow.com/questions/awk?sort=15)\n\
    - Learn Regular Expressions (has information on flavors other than POSIX)\n  \
    \  - [regular-expressions](https://www.regular-expressions.info/) — tutorials\
    \ and tools\n    - [rexegg](https://rexegg.com/) — tricks and more\n    - [stackoverflow:\
    \ What does this regex mean?](https://stackoverflow.com/q/22937618)\n    - [online\
    \ regex tester and debugger](https://regex101.com/) — not fully suitable for cli\
    \ tools, but most of POSIX syntax works\n- [My repo on cli text processing](https://github.com/learnbyexample/Command-line-text-processing)\n\
    - Related tools\n    - [GNU datamash](https://www.gnu.org/software/datamash/)\n\
    \    - [bioawk](https://github.com/lh3/bioawk)\n    - [frawk](https://github.com/ezrosent/frawk)\
    \ — an efficient awk-like language, implemented in Rust\n    - [hawk](https://github.com/gelisam/hawk/blob/master/README.md)\
    \ — based on Haskell\n    - [miller](https://github.com/johnkerl/miller) — similar\
    \ to awk/sed/cut/join/sort for name-indexed data such as CSV, TSV, and tabular\
    \ JSON\n        - See this [newsycombinator discussion](https://news.ycombinator.com/item?id=1006672)\
    \ for other tools like this\n- miscellaneous\n    - [unix.stackexchange: When\
    \ to use grep, sed, awk, perl, etc](https://unix.stackexchange.com/q/303044/109046)\n\
    \    - [awk-libs](https://github.com/e36freak/awk-libs) — lots of useful functions\n\
