    "dog")} 1''

    [](#cb63-8)dog

    [](#cb63-9)cOndog

    [](#cb63-10)sdogter

    [](#cb63-11)cot

    ```


    Another way is to use built-in string function `tolower` to change the input to
    lowercase first.


    ```

    [](#cb64-1)$ printf ''Cat\ncOnCaT\nscatter\ncot\n'' | awk ''tolower($0) ~ /cat/''

    [](#cb64-2)Cat

    [](#cb64-3)cOnCaT

    [](#cb64-4)scatter

