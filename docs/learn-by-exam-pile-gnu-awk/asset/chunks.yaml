    \ sample.txt secrets.txt addr.txt table.txt\n[](#cb212-2)secrets.txt\n[](#cb212-3)addr.txt\n\
    [](#cb212-4)table.txt\n```\n\n# Processing multiple records\n\nOften, you need\
    \ to consider multiple lines at a time to make a decision, such as the paragraph\
    \ mode examples seen earlier. Sometimes, you need to match a particular record\
    \ and then get records surrounding the matched record. The `condX{actionX}` shortcut\
    \ makes it easy to code state machines concisely, which is useful to solve such\
    \ multiple record use cases. See [softwareengineering: FSM examples](https://softwareengineering.stackexchange.com/questions/47806/examples-of-finite-state-machines)\
    \ if you are not familiar with state machines.\n\n## Processing consecutive records\n\
    \nYou might need to define a condition that should satisfy something for one record\
    \ and something else for the very next record. `awk` does provide a feature to\
    \ get next record, but that could get complicated (see [getline](#ch013.xhtml_getline)\
    \ section). Instead, you can simply save each record in a variable and then create\
    \ the required conditional expression. The default behavior of uninitialized variable\
    \ to act as `0` in numerical context and empty in string context plays a role\
    \ too.\n\n```\n[](#cb213-1)$ # match and print two consecutive records\n[](#cb213-2)$\
    \ # first record should contain 'as' and second record should contain 'not'\n\
    [](#cb213-3)$ awk 'p ~ /as/ && /not/{print p ORS $0} {p=$0}' programming_quotes.txt\n\
    [](#cb213-4)Therefore, if you write the code as cleverly as possible, you are,\n\
    [](#cb213-5)by definition, not smart enough to debug it by Brian W. Kernighan\n\
    [](#cb213-6)\n[](#cb213-7)$ # same filtering as above, but print only the first\
    \ record\n[](#cb213-8)$ awk 'p ~ /as/ && /not/{print p} {p=$0}' programming_quotes.txt\n\
    [](#cb213-9)Therefore, if you write the code as cleverly as possible, you are,\n\
    [](#cb213-10)\n[](#cb213-11)$ # same filtering as above, but print only the second\
    \ record\n[](#cb213-12)$ awk 'p ~ /as/ && /not/; {p=$0}' programming_quotes.txt\n\
    [](#cb213-13)by definition, not smart enough to debug it by Brian W. Kernighan\n\
    ```\n\n## Context matching\n\nSometimes you want not just the matching records,\
    \ but the records relative to the matches as well. For example, it could be to\
    \ see the comments at start of a function block that was matched while searching\
    \ a program file. Or, it could be to see extended information from a log file\
    \ while searching for a particular error message.\n\nConsider this sample input\
    \ file:\n\n```\n[](#cb214-1)$ cat context.txt\n[](#cb214-2)blue\n[](#cb214-3)\
    \    toy\n[](#cb214-4)    flower\n[](#cb214-5)    sand stone\n[](#cb214-6)light\
    \ blue\n[](#cb214-7)    flower\n[](#cb214-8)    sky\n[](#cb214-9)    water\n[](#cb214-10)language\n\
    [](#cb214-11)    english\n[](#cb214-12)    hindi\n[](#cb214-13)    spanish\n[](#cb214-14)\
    \    tamil\n[](#cb214-15)programming language\n[](#cb214-16)    python\n[](#cb214-17)\
    \    kotlin\n[](#cb214-18)    ruby\n```\n\n**Case 1:** Here's an example that\
    \ emulates `grep --no-group-separator -A<n>` functionality. The `n && n--` trick\
    \ used in the example works like this:\n\n*   If initially `n=2`, then we get\n\
    \n    *   `2 && 2` --> evaluates to `true` and `n` becomes `1`\n\n    *   `1 &&\
    \ 1` --> evaluates to `true` and `n` becomes `0`\n\n    *   `0 &&` --> evaluates\
    \ to `false` and `n` doesn't change\n\n*   Note that when conditionals are connected\
    \ with logical `&&`, the second expression will not be executed at all if the\
    \ first one turns out to be `false` because the overall result will always be\
    \ `false`. Same is the case if the first expression evaluates to `true` with logical\
    \ `||` operator. Such logical operators are also known as **short-circuit** operators.\
    \ Thus, in the above case, `n--` won't be executed when `n` is `0` on the left\
    \ hand side. This prevents `n` going negative and `n && n--` will never become\
    \ `true` unless `n` is assigned again."
