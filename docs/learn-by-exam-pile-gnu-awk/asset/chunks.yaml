    \n---\n\n## 2 个苹果和 5 个芒果\n\n加油！\n\n2 个苹果\n\n### b) 针对输入文件 `lines.txt`，仅保留每行的第一个副本。假设空格作为字段分隔符，每行有两个字段。在比较行内容时不考虑字段的顺序。例如，`hehe\
    \ haha` 和 `haha hehe`将被视为重复项。\n\n```bash\ncat twos.txt\nhehe haha\ndoor floor\n\
    haha hehe\n6;8 3-4\ntrue blue\nhehe bebe\nfloor door\n3-4 6;8\ntru eblue\nhaha\
    \ hehe\n\n$ awk ##### 在此处添加你的解决方案\nhehe haha\ndoor floor\n6;8 3-4\ntrue blue\n\
    hehe bebe\ntru eblue\n```\n\n### c) 针对输入文件 `twos.txt`，创建一个包含所有唯一行的文件 `uniq.txt`\
    \ 以及一个包含所有重复行的文件 `dupl.txt`。假设空格作为字段分隔符，每行有两个字段。在比较行内容时不考虑字段的顺序。例如，`hehe haha`\
    \ 和 `haha hehe`将被视为重复项。\n\n```bash\nawk ##### 在此处添加你的解决方案\n\n$ cat uniq.txt\n\
    true blue\nhehe bebe\ntru eblue\n\n$ cat dupl.txt\nhehe haha\ndoor floor\nhaha\
    \ hehe\n6;8 3-4\nfloor door\n3-4 6;8\nhaha hehe\n```\n\n# awk 脚本\n\n## -f 选项\n\
    \n`-f` 命令行选项允许你通过文件传递 `awk` 代码，而不是将所有代码写在命令行中。这里是之前看到的一个单行命令转换为多行脚本的形式。注意，不再需要用\
    \ `;` 来分隔命令，换行符也可以。\n\n```bash\n$ cat buf.awk\n/error/{\n    f = 1\n    buf =\
    \ $0\n    next\n}\n\nf{\n    buf = buf ORS $0\n}\n\n/state/{\n    if(f)\n    \
    \    print buf\n    f = 0\n}\n\n$ awk -f buf.awk broken.txt\nerror 2\n1234\n6789\n\
    state 1\nerror 4\nabcd\nstate 3\n```\n\n另一个优势是可以自由使用单引号。\n\n```bash\n$ echo 'cue\
    \ us on this example' | awk -v q=\"'\" '{gsub(/\\w+/, q \"&\" q)} 1'\n'cue' 'us'\
    \ 'on' 'this' 'example'\n\n# 上面的解决方案写成脚本更简单\n$ cat quotes.awk\n{\n    gsub(/\\\
    w+/, \"'&'\")\n}\n\n1\n\n$ echo 'cue us on this example' | awk -f quotes.awk\n\
    'cue' 'us' 'on' 'this' 'example'\n```\n\n## -o 选项\n\n如果代码已经在命令行上测试过，可以添加 `-o`\
    \ 选项来获取美化输出的版本。输出文件名可以通过 `-o` 选项传递，否则默认将使用 `awkprof.out`。\n\n```bash\n# 在测试过单行命令后添加\
    \ -o\n$ # 输入文件名和 -v 将被简单忽略\n$ awk -o -v OFS='\\t' 'NR==FNR{a[$0]=$1;next}if(!($0\
    \ in a))print $0}' lines.txt\n```\n\n"
- fmt: "\n```bash\n# silently fails, $word becomes $0 because of string to numeric\
    \ conversion\nawk -v word=\"cake\" '$2==$word' table.txt\n# works when the variable\
    \ is used correctly\nawk -v word=\"cake\" '$2==word' table.txt\nblue cake mug\
    \ shirt -7\n# here 'field' gets replaced with '2' and hence $2 is printed\nawk\
    \ -v field=2 '{print $field}' table.txt\nbread\ncake\nbanana\n```\n\n## Dos style\
    \ line endings\n\nAs mentioned before, line endings differ from one platform to\
    \ another. On Windows, it is typically a combination of carriage return and the\
    \ newline character and referred as as `dos style` line endings. Since `GNU awk`\
    \ allows multicharacter `RS`, it is easy to handle. See [stackoverflow: Why does\
    \ my tool output overwrite itself and how do I fix it?](https://stackoverflow.com/q/45772525/4082052)\
    \ for a detailed discussion and various mitigation methods.\n\n```bash\n# no issue\
    \ with unix style line ending\nprintf 'mat dog\\n123 789\\n' | awk '{print $2,\
    \ $1}'\ndog mat\n789 123\n# dos style line ending causes trouble\nprintf 'mat\
    \ dog\\r\\n123 789\\r\\n' | awk '{print $2, $1}'\n mat\n123\nprintf 'mat dog\\\
    r\\n123 789\\r\\n' | awk '{sub(/$/, \".\")} 1'\n.at dog\n.23 789\n# use \\r?\\\
    n if you want to handle both unix and dos style with same command\n# note that\
    \ ORS would still be newline character only\nprintf 'mat dog\\r\\n123 789\\r\\\
    n' | awk -v RS='\\r\\n' '{print $2, $1}'\ndog mat\n789 123\nprintf 'mat dog\\\
    r\\n123 789\\r\\n' | awk -v RS='\\r\\n' '{sub(/$/, \".\")} 1'\nmat dog.\n123 789.\n\
    ```\n\n## Behavior of ^ and $ when string contains newline\n\nIn some regular\
    \ expression implementations, `^` matches the start of a line and `$` matches\
    \ the end of a line (with newline as the line separator). In `awk`, these anchors\
    \ always match the start of the entire string and end of the entire string respectively.\
    \ This comes into play when `RS` is other than the newline character, or if you\
    \ have a string value containing newline characters.\n\n```bash\n# 'apple\\n'\
    \ doesn't match as there's newline character\nprintf 'apple\\n,mustard,grape,\\\
    nmango' | awk -v RS=, '/e$/'\ngrape\n# '\\nmango' doesn't match as there's newline\
    \ character\nprintf 'apple\\n,mustard,grape,\\nmango' | awk -v RS=, '/^m/'\nmustard\n\
    ```\n\n## Word boundary differences\n\nThe word boundary `\\y` matches both start\
    \ and end of word locations. Whereas, `\\<` and `\\>` match exactly the start\
    \ and end of word locations respectively. This leads to cases where you have to\
    \ choose which of these word boundaries to use depending on results desired. Consider\
    \ `I have 12, he has 2!` as sample text, shown below as an image with vertical\
    \ bars marking the word boundaries. The last character `!` doesn't have end of\
    \ word boundary as it is not a word character.\n\n![word boundary](media/file2.png)\n\
    \n```bash\n# \\y matches both start and end of word boundaries\n# the first match\
    \ here used starting boundary of 'I' and 'have'\necho 'I have 12, he has 2!' |\
    \ awk '{gsub(/\\y..\\y/, \"[&]\")} 1'\n[I ]have [12][,he] has [2]!\n# \\< and\
    \ \\> only match the start and end word boundaries\necho 'I have 12, he has 2!'\
    \ | awk '{gsub(/\\<..\\>/, \"[&]\")} 1'\nI have [12], [he] has 2\n```\n\nHere's\
    \ another example to show the difference between the two types of word boundaries.\n\
    \n```bash\n# add something to both start/end of word\necho 'hi_42 12b' | awk '{gsub(/\\\
    y/, \":\")} 1'\nhi:42:12b:\n# add something only at start of word\necho 'hi_42\
    \ 12b' | awk '{gsub(/\\</, \":\")} 1'\n:hi_42 12b\n# add something only at end\
    \ of word\necho 'hi_42 12b' | awk '{gsub(/\\>/, \":\")} 1'\nhi_42:12b\n```\n\n\
    ## Relying on default value\n\nUninitialized variables are useful, but sometimes\
    \ they don't translate well if you are converting a single file to multiple files.\
    \ You have to workout which ones would need a reset at the beginning of each file\
    \ processed.\n\n```bash\n# step 1 - works for single file\nawk '{sum += $NF} END{print\
    \ sum}' table.txt\n38.14\n# step 2 - prepare code to work for multiple file\n\
    awk '{sum += $NF} ENDFILE{print FILENAME \":\" sum}' table.txt\ntable.txt:38.14\n\
    # step 3 - check with multiple file input\n# oops, default numerical value '0'\
    \ for sum works only once\nawk '{sum += $NF} ENDFILE{print FILENAME \":\" sum}'\
    \ table.txt\ntable.txt:38.14\nmarks.txt:530.14\n# step 4 - correctly initialize\
    \ variables\nawk '{sum += $NF} ENDFILE{print FILENAME \":\" sum; sum=0}' table.txt\
    \ marks.txt\ntable.txt:38.14\nmarks.txt:492\n```\n\n## Code in replacement section\n\
    \nThe replacement section in substitution functions can accept any expression,\
    \ converted to string whenever necessary. What happens if the regexp doesn't match\
    \ the input string but the expression can change the value of a variable, such\
    \ as increment/decrement operators? Well, the expression is still executed, which\
    \ may or may not be what you need.\n\n```bash\n# no match for second line, but\
    \ 'c' was still modified\nawk '{sub(/^(br|ye)/, ++c \") &\")} 1' table.txt\n1)\
    \ brown bread mat hair 42\nblue cake mug shirt -7\n3) yellow window shoes 3.14\n\
    # check for matching line first before applying substitution\n# that may help\
    \ to simplify the regexp for substitution\n# or, you could save the regexp in\
    \ a variable to avoid duplication\nawk '/^(br|ye)/{sub(/^/, ++c \") \")} 1' table.txt\n\
    1) brown bread mat hair 42\nblue cake mug shirt -7\n2) yellow window shoes 3.14\n\
    ```\n\nAlso, the expression is executed only once per function call, not for every\
    \ match.\n\n```bash\n# first line has two matches but 'c' is modified only once\n\
    awk '{gsub(/\\<b/, ++c \") &\")} 1' table.txt\n1) brown 1) bread mat hair 42\n\
    2) blue cake mug shirt -7\nyellow banana3) 3.14\n```\n\n## Forcing numeric context\n\
    \nUse unary operator `+` to force numeric conversion. A variable might have numeric\
    \ operations but still not get assigned a number if there's no input to read.\
    \ So, when printing a variable that should be a number, use unary `+` to ensure\
    \ it prints `0` instead of empty string.\n\n```bash\n# numbers present in last\
    \ column, no issues\nawk '{sum += $NF} END{print sum}' table.txt\n38.14\n# strings\
    \ in first column, gets treated as 0\nawk '{sum += $1} END{print sum}' table.txt\n\
    0\n# no input at all, empty string is printed\nawk '{sum += $1} END{print sum}'\
    \ /dev/null\n# forced conversion to number, so that 0 is printed\nawk '{sum +=\
    \ $1} END{print +sum}' /dev/null\n0\n```\n\n## Forcing string context\n\nConcatenate\
    \ empty string to force string comparison.\n"
