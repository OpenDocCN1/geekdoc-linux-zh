- fmt: "\n```\nThe `key` features used in the solution below:\n\n*   For two files\
    \ as input, `NR==FNR` will be `true` only when the first file is being processed\n\
    *   `next` will skip rest of code and fetch next record\n*   `a[$0]` by itself\
    \ is a valid statement. It will create an uninitialized element in array `a` with\
    \ `$0` as the key (assuming the key doesn't exist yet)\n*   `$0 in a` checks if\
    \ the given string (`$0` here) exists as a key in array `a`\n```\n\n### common\
    \ lines\n\n```\n# same as: `grep -Fxf color_list1.txt color_list2.txt`\n\nawk\
    \ 'NR==FNR{a[$0]; next} $0 in a' color_list1.txt color_list2.txt\n```\nlight blue\n\
    \nyellow\n\n# lines from color_list2.txt not present in color_list1.txt\n\n```\n\
    # same as: `grep -vFxf color_list1.txt color_list2.txt`\n\nawk 'NR==FNR{a[$0];\
    \ next} !($0 in a)' color_list1.txt color_list2.txt\n```\nblack\n\ndark green\n\
    \n# reversing the order of input files gives\n\n```\n# lines from color_list1.txt\
    \ not present in color_list2.txt\n\nawk 'NR==FNR{a[$0]; next} !($0 in a)' color_list2.txt\
    \ color_list1.txt\n```\nteal\n\ngreen\n\n> ![warning](media/file1.svg) Note that\
    \ the `NR==FNR` logic will fail if the first file is empty.\n\n## Comparing fields\n\
    \nIn the previous section, you saw how to compare whole contents of records between\
    \ two files. This section will focus on comparing only specific field(s). The\
    \ below sample file will be one of the two file inputs for examples in this section.\n\
    \n```\ncat marks.txt\n\nDept    Name    Marks\nECE     Raj     53\nECE     Joel\
    \    72\nEEE     Moi     68\nCSE     Surya   81\nEEE     Tia     59\nECE     Om\
    \      92\nCSE     Amy     67\n```\n\nTo start with, here's a single field comparison.\
    \ The problem statement is to fetch all records from `marks.txt` if the first\
    \ field matches any of the departments listed in `dept.txt` file.\n\n```\ncat\
    \ dept.txt\n\nCSE\nECE\n\n# note that dept.txt is used to build the array keys\
    \ first\n\nawk 'NR==FNR{a[$1]; next} $1 in a' dept.txt marks.txt\n\nECE     Raj\
    \     53\nECE     Joel    72\nCSE     Surya   81\nECE     Om      92\nCSE    \
    \ Amy     67\n\n# if header is needed as well\n\nawk 'NR==FNR{a[$1]; next} FNR==1\
    \ || $1 in a' dept.txt marks.txt\n\nDept    Name    Marks\nECE     Raj     53\n\
    ECE     Joel    72\nCSE     Surya   81\nECE     Om      92\nCSE     Amy     67\n\
    ```\n\nFor multiple field comparison, you need to construct the key robustly.\
    \ Simply concatenating field values can lead to false matches. For example, field\
    \ values `abc` and `123` will wrongly match `ab` and `c123`. To avoid this, you\
    \ may introduce some string between the field values, say `\"_\"` (if you know\
    \ the field themselves cannot have this character) or `FS` (safer option). You\
    \ could also allow `awk` to bail you out. If you use `,` symbol (not `\",\"` as\
    \ a string) between field values, the value of special variable `SUBSEP` is inserted.\
    \ `SUBSEP` has a default value of the non-printing character `\\034` which is\
    \ usually not used as part of text.\n\n```\ncat dept_name.txt\n\nEEE Moi\nCSE\
    \ Amy\nECE Raj\n\n# uses SUBSEP as separator between field values\n# note the\
    \ use of parentheses for key\n\nawk 'NR==FNR{a[$1,$2]; next} ($1,$2) in a' dept_name.txt\
    \ marks.txt\n\nECE     Raj     53\nEEE     Moi     68\nCSE     Amy     67\n```\n\
    \nIn this example, one of field is used for numerical comparison.\n\n```\ncat\
    \ dept_mark.txt\n\nECE 70\nEEE 65\nCSE 80\n\n# match Dept and minimum marks specified\
    \ in dept_mark.txt\n\nawk 'NR==FNR{d[$1]=$2; next} $1 in d[$1]' dept_mark.txt\
    \ marks.txt\n\nECE     Joel    72\nEEE     Moi     68\nCSE     Surya   81\nECE\
    \     Om      92\n```\n\nHere's an example of adding a new field.\n\n```\ncat\
    \ role.txt\n\nRaj class_rep\nAmy sports_rep\nTia placement_rep\n\nawk -v OFS='\\\
    t' 'NR==FNR{r[$1]=$2; next} $(NF+1) = FNR==1 ? \"Role\" : r[$2]} 1' role.txt marks.txt\n\
    \nDept    Name    Marks   Role\nECE     Raj     53      class_rep\nECE     Joel\
    \    72\nEEE     Moi     68\nCSE     Surya   81\nEEE     Tia     59      placement_rep\n\
    ECE     Om      92\nCSE     Amy     67      sports_rep\n```\n\n## getline\n\n\
    As the name indicates, `getline` function allows you to read a line from a file\
    \ on demand. This is most useful when you need something based line number. The\
    \ following example shows how you can replace `m`th line from a file with `n`th\
    \ line from another file. There are many syntax variations with `getline`, here\
    \ the line read is saved in a variable.\n\n```\n# return value handling is not\
    \ shown here, but should be done ideally\n\nawk -v m=3 -v n=2 'BEGIN{while(n--\
    \ > 0) getline s < \"greeting.txt\"} FNR==m{$0=s} 1' table.txt\n\nbrown bread\
    \ mat hair 42\nblue cake mug shirt -7\nHave a nice day\n```\n\nHere is an example\
    \ where two files are processed simultaneously. In this case, the return value\
    \ of `getline` is also used. It will be `1` if line was read successfully, `0`\
    \ if there's no more input to be read as end of file has already been reached\
    \ and `-1` if something went wrong. The `ERRNO` special variable will have details\
    \ regarding the issues.\n\n```\n# print line from greeting.txt if last column\
    \ of corresponding line\n# from table.txt is +ve number\n\nawk -v file='table.txt'\
    \ '(getline line < file)==1{n=split(line, a); if(a[n]>0) print}' greeting.txt\n\
    \nHi there\nGood bye\n```\n\nIf a file is passed as argument to `awk` command\
    \ and cannot be opened, you get an error. For example:\n\n```\nawk '{print $2}'\
    \ xyz.txt\nawk: fatal: cannot open file 'xyz.txt' for reading (No such file or\
    \ directory)\n```\n\nIt is recommended to always check for return value when using\
    \ `getline` or perhaps use techniques from previous sections to avoid `getline`\
    \ altogether.\n\n```\n# xyz.txt doesn't exist, but output doesn't show something\
    \ went wrong\n\nawk '{getline line < \"xyz.txt\"; print $NF, line}' table.txt\n\
    \n42 \n-7 \n3.14 \n\nawk -v file='xyz.txt' '{ e=(getline line < file); if(e<0){print\
    \ file \": \" ERRNO; exit} print $NF, line }' table.txt\n\nxyz.txt: No such file\
    \ or directory\n```\n"
