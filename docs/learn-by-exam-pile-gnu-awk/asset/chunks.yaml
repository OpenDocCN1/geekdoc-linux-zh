    # In-place file editing


    In the examples presented so far, the output from `awk` was displayed on the terminal.
    This chapter will discuss how to write back the changes to the input file(s) itself
    using the `-i` command line option. This option can be configured to make changes
    to the input file(s) with or without creating a backup of original contents.


    ## Without backup


    The `-i` option allows you to load libraries (see [gawk manual: -i option](https://www.gnu.org/software/gawk/manual/gawk.html#index-_002di-option)
    for details). `inplace` library comes by default with the `awk` installation.
    Use `-i inplace` to indicate that `awk` should modify the original input itself.
    Use this option with caution, preferably after testing that the code is working
    as intended.


    ```

    [](#cb139-1)$ cat greet.txt

    [](#cb139-2)Hi there

    [](#cb139-3)Have a nice day

    [](#cb139-4)Good bye

    [](#cb139-5)

    [](#cb139-6)$ # prefix line numbers

    [](#cb139-7)$ awk -i inplace ''{print NR ". " $0}'' greet.txt

    [](#cb139-8)$ cat greet.txt

    [](#cb139-9)1. Hi there

    [](#cb139-10)2. Have a nice day

    [](#cb139-11)3. Good bye

    ```


    Multiple input files are treated individually and changes are written back to
    respective files.


    ```

    [](#cb140-1)$ cat f1.txt

    [](#cb140-2)I ate 3 apples

    [](#cb140-3)$ cat f2.txt

    [](#cb140-4)I bought two balls and 3 bats

    [](#cb140-5)

    [](#cb140-6)$ awk -i inplace ''{gsub(/\<3\>/, "three")} 1'' f1.txt f2.txt

    [](#cb140-7)$ cat f1.txt

    [](#cb140-8)I ate three apples

    [](#cb140-9)$ cat f2.txt

    [](#cb140-10)I bought two balls and three bats

    ```


    ## With backup


    You can provide a backup extension by setting the `inplace::suffix` special variable.
    For example, if the input file is `ip.txt` and `inplace::suffix` is used, the
    backup file will be named `ip.txt.orig`.

    ```

    '
  raw: '```

