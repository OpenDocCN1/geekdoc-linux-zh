    ## 处理多个记录


    通常，你你需要将记录分组以便作为一个单元进行处理。例如，你可能想要处理所有属于同一个用户的行。


    ## 处理连续记录


    有时你不仅想要匹配的记录，还需要相对于匹配项的记录。例如，这可能是为了查看被匹配函数开处的注释。


    '
- fmt: '

    ```

    [](#cb215-1)$ # same as: grep --no-group-separator -A1 ''blue''

    [](#cb215-2)$ # print matching line as well as the one that follows it

    [](#cb215-3)$ awk ''/blue/{n=2} n && n--'' context.txt

    [](#cb215-4)blue

    [](#cb215-5)    toy

    [](#cb215-6)light blue

    [](#cb215-7)    flower

    [](#cb215-8)

    [](#cb215-9)$ # overlapping example, n gets re-assigned before reaching 0

    [](#cb215-10)$ awk ''/toy|flower/{n=2} n && n--{print NR, $0}'' context.txt

    [](#cb215-11)2     toy

    [](#cb215-12)3     flower

    [](#cb215-13)4     sand stone

    [](#cb215-14)6     flower

    [](#cb215-15)7     sky

    [](#cb215-16)

    [](#cb215-17)$ # doesn''t allow overlapping cases to re-assign the counter

    [](#cb215-18)$ awk ''!n && /toy|flower/{n=2} n && n--{print NR, $0}'' context.txt

    [](#cb215-19)2     toy

    [](#cb215-20)3     flower

    [](#cb215-21)6     flower

    [](#cb215-22)7     sky

    ```


    Once you''ve understood the above examples, the rest of the examples in this section
    should be easier to comprehend. They are all variations of the logic used above
    and re-arranged to solve the use case being discussed.


    ### Case 2: Print `n` records after match. This is similar to previous case, except
    that the matching record isn''t printed.


    ```

    [](#cb216-1)$ # print 1 line after matching line

    [](#cb216-2)$ # for overlapping cases, n gets re-assigned before reaching 0

    [](#cb216-3)$ awk ''n && n--; /language/{n=1}'' context.txt

    [](#cb216-4)    english

    [](#cb216-5)    python

    [](#cb216-6)

    [](#cb216-7)$ # print 2 lines after matching line

    [](#cb216-8)$ # doesn''t allow overlapping cases to re-assign the counter

    [](#cb216-9)$ awk ''!n && /toy|flower/{n=2; next} n && n--'' context.txt

    [](#cb216-10)    flower

    [](#cb216-11)    sand stone

    [](#cb216-12)    sky

    [](#cb216-13)    water

    ```


    ### Case 3: Here''s how to print `n`th record after the matching record.


    ```

    [](#cb217-1)$ # print only the 2nd line found after matching line

    [](#cb217-2)$ # the array saves matching result for each record

    [](#cb217-3)$ # doesn''t rely on a counter, thus works for overlapping cases

    [](#cb217-4)$ awk -v n=2 ''a[NR-n]; /toy|flower/{a[NR]=1}'' context.txt

    [](#cb217-5)    sand stone

    [](#cb217-6)light blue

    [](#cb217-7)    water

    [](#cb217-8)

    [](#cb217-9)$ # print only the 3rd line found after matching line

    [](#cb217-10)$ # n && !--n will be true only when --n yields 0

    [](#cb217-11)$ # overlapping cases won''t work as n gets re-assigned before going
    to 0

    [](#cb217-12)$ awk ''n && !--n; /language/{n=3}'' context.txt

    [](#cb217-13)    spanish

    [](#cb217-14)    ruby

    ```


    ### Case 4: Print `n` records before match. Printing the matching record as well
    is left as an exercise. Since the file is being read in forward direction, and
    the problem statement is to print something before the matching record, overlapping
    situation like the previous examples doesn''t occur.


    ```

    [](#cb218-1)$ # i>0 is used because NR starts from 1

    [](#cb218-2)$ awk -v n=2 ''/toy|flower/{for(i=NR-n; i<NR; i++) if(i>0) print a[i]}

    [](#cb218-3) {a[NR]=$0}'' context.txt

    [](#cb218-4)blue

    [](#cb218-5)blue

    [](#cb218-6)    toy

    [](#cb218-7)    sand stone

    [](#cb218-8)light blue

    ```


    ### Case 5: Print `n`th record before the matching record.


    ```

    [](#cb219-1)$ # if the count is small enough, you can save them in variables

    [](#cb219-2)$ # this one prints 2nd line before the matching line

    [](#cb219-3)$ # NR>2 is needed as first 2 records shouldn''t be considered for
    a match

    [](#cb219-4)$ awk ''NR>2 && /toy|flower/{print p2} {p2=p1; p1=$0}'' context.txt

    [](#cb219-5)blue

    [](#cb219-6)    sand stone

    [](#cb219-7)

    8)$ # else, use an array to save previous records

    [](#cb219-9)$ awk -v n=4 ''NR>n && /age/{print a[NR-n]} {a[NR]=$0}'' context.txt

    [](#cb219-10)light blue

    english

    ```


    ## Records bounded by distinct markers


    This section will cover cases where the input file will always contain the same
    number of starting and ending patterns arranged in alternating fashion. For example,
    there cannot be two starting patterns appearing without an ending pattern between
    them and vice versa. Zero or more records of text can appear inside such groups
    as well as in the groups The sample file shown below will be used to illustrate
    examples in this section. For simplicity, assume that the starting pattern is
    marked by `start` and the ending pattern by `end`. They have also been given numbers
    to make it easier to visualize the transformation between input and output.


    ```

    [](#cb220-1)$ cat.txt

    [](#cb220-2)mango

    [](#cb220-3)icecream

    [](#cb220-4)--start 1--

    [](#cb220-5)1234

    [](#cb220-6)6789

    [](#cb220-7)end 1

    [](#cb220-8)how are you

    [](#cb220-9)have a nice day

    [](#cb220-10)--start 2--

    [](#cb220-11)a

    [](#cb220-12)b

    [](#cb220-13)c

    [](#cb220-14)end 2

    [](#cb220-15)par,far,mar,tar

    ```


    ### Case 1: Processing all the groups of records based on distinct markers, including
    the records matched by themselves. For simplicity, the below command will just
    print all such records.


    ```

    [](#cb221-1)$ awk ''/start/{f=1} f; /end/{f=0}'' uniform.txt

    [](#cb221-2)--start 1--

    [](#cb221-3)1234

    [](#cb221-4)6789

    [](#cb221-5)end 1

    [](#cb221-6)--start 2--

    [](#cb221-7)a

    [](#cb221-8)b

    [](#cb221-9)c

    [](#cb221-10)end 2

    ```


    ![info](media/file0.svg) Similar to `sed -n ''/start/,/end/p''` you can also use
    `awk ''/start/,/end/''` but the state machine format is more suitable to change
    for various cases to follow.


    ### Case 2: Processing all the groups of records but excluding the records matched
    by themselves.


    ```

    [](#cb222-1)$ awk ''/end/{f=0} f{print "*", $0} /start/{f=1}'' uniform.txt

    [](#cb222-2)* 1234

    [](#cb222-3)* 6789

    [](#cb222-4)* a

    [](#cb222-5)* b

    [](#cb222-6)* c

    ```


    ### Case 3-4: Processing all the groups of records but excluding either of the
    markers.


    ```

    [](#cb223-1)$ awk ''/start/{f=1} /end/{f=0} f'' uniform.txt

    [](#cb223-2)--start 1--

    [](#cb223-3)1234

    [](#cb223-4)6789

    [](#cb223-5)--start 2--

    [](#cb223-6)a

    [](#cb223-7)b

    [](#cb223-8)c

    [](#cb223-9)

    [](#cb223-10)$ awk ''f; /start/{f=1} /end/{f=0}'' uniform.txt

    [](#cb223-11)1234

    [](#cb223-12)6789

    [](#cb223-13)end 1

    [](#cb223-14)a

    [](#cb223-15)b

    [](#cb223-16)c

    [](#cb223-17)end 2

    ```


    The next four cases are obtained by just using `!f` instead of `f` from the cases
    shown above.


    ### Case 5: Processing all input records except the groups of records bound by
    the markers.


    ```

    [](#cb224-1)$ awk ''/start/{f=1} !f{print $0 "."} /end/{f=0}'' uniform.txt

    [](#cb224-2)mango.

    [](#cb224-3)icecream.

    [](#cb224-4)how are you.

    [](#cb224-5)have a nice day.

    [](#cb224-6)par,far,mar,tar.

    ```


    ### Case 6: Processing all input records except the groups between the markers.


    ```

    [](#cb225-1)$ awk ''/end/{f=0} !f; /start/{f=1}'' uniform.txt

    [](#cb225-2)mango

    [](#cb225-3)icecream

    [](#cb225-4)--start 1--

    [](#cb225-5)end 1

    [](#cb225-6)how are you

    [](#cb225-7)have a nice day

    [](#cb225-8)--start 2--

    [](#cb225-9)end 2

    [](#cb225-10)par,far,mar,tar

    ```

