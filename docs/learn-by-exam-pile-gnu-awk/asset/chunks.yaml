    \ 3 fields should be preserved\n[](#cb279-14)$ awk 'NF>2{NF -= 2} 1' varying.txt\n\
    [](#cb279-15)parrot\n[](#cb279-16)good\n[](#cb279-17)blue sky\n[](#cb279-18)12\
    \ 34 56\n```\n\nHere's another example, which needs to access third field from\
    \ the end.\n\n```\n[](#cb280-1)$ awk '{print $(NF-2)}' varying.txt\n[](#cb280-2)awk:\
    \ cmd. line:1: (FILENAME=varying.txt FNR=1) fatal: attempt to access field -1\n\
    [](#cb280-3)\n[](#cb280-4)$ # print only if there are minimum 3 fields\n[](#cb280-5)$\
    \ awk 'NF>2{print $(NF-2)}' varying.txt\n[](#cb280-6)good\n[](#cb280-7)56\n```\n\
    \n## Faster execution\n\nChanging locale to ASCII (assuming current locale is\
    \ not ASCII and the input file has only ASCII characters) can give significant\
    \ speed boost. Using `mawk` is another way to speed up execution, provided you\
    \ are not using `GNU awk` specific features. Among other feature differences,\
    \ `mawk` doesn't support `{}` form of quantifiers, see [unix.stackexchange: How\
    \ to specify regex quantifiers with mawk?](https://unix.stackexchange.com/q/506119/109046)\
    \ for details. See also [wikipedia: awk Versions and implementations](https://en.wikipedia.org/wiki/AWK_programming_language#Versions_and_implementations).\n\
    \n```\n[](#cb281-1)$ # time shown is best result from multiple runs\n[](#cb281-2)$\
    \ # speed benefit will vary depending on computing resources, input, etc\n[](#cb281-3)$\
    \ # /usr/share/dict/words contains dictionary words, one word per line\n[](#cb281-4)$\
    \ time awk '/^([a-d][r-z]){3}$/' /usr/share/dict/words > f1\n[](#cb281-5)real\
    \    0m0.029s\n[](#cb281-6)\n[](#cb281-7)$ time LC_ALL=C awk '/^([a-d][r-z]){3}$/'\
    \ /usr/share/dict/words > f2\n[](#cb281-8)real    0m0.022s\n[](#cb281-9)\n[](#cb281-10)$\
    \ time mawk '/^[a-d][r-z][a-d][r-z][a-d][r-z]$/' /usr/share/dict/words > f3\n\
    [](#cb281-11)real    0m0.009s\n[](#cb281-12)\n[](#cb281-13)$ # check that the\
    \ results are same\n[](#cb281-14)$ diff -s f1 f2\n[](#cb281-15)Files f1 and f2\
    \ are identical\n[](#cb281-16)$ diff -s f2 f3\n[](#cb281-17)Files f2 and f3 are\
    \ identical\n[](#cb281-18)$ # clean up temporary files\n[](#cb281-19)$ rm f[123]\n\
    ```\n\nHere's another example.\n\n```\n[](#cb282-1)$ # count words containing\
    \ exactly 3 lowercase 'a'\n[](#cb282-2)$ time awk -F'a' 'NF==4{cnt++} END{print\
    \ +cnt}' /usr/share/dict/words\n[](#cb282-3)1102\n[](#cb282-4)real    0m0.034s\n\
    [](#cb282-5)\n[](#cb282-6)$ time LC_ALL=C awk -F'a' 'NF==4{cnt++} END{print +cnt}'\
    \ /usr/share/dict/words\n[](#cb282-7)1102\n[](#cb282-8)real    0m0.023s\n[](#cb282-9)\n\
    [](#cb282-10)$ time mawk -F'a' 'NF==4{cnt++} END{print +cnt}' /usr/share/dict/words\n\
    [](#cb282-11)1102\n[](#cb282-12)real    0m0.014s\n```\n\n# Further Reading\n\n\
    *   `man awk` and `info awk` and [online manual](https://www.gnu.org/software/gawk/manual/gawk.html)\n\
    \n*   Information about various implementations of `awk`\n\n    *   [awk FAQ](http://www.faqs.org/faqs/computer-lang/awk/faq/)\
    \ — great resource, but last modified *23 May 2002*\n\n    *   [grymoire: awk\
    \ tutorial](https://www.grymoire.com/Unix/Awk.html) — covers information about\
    \ different `awk` versions as well\n\n    *   [cheat sheet for awk/nawk/gawk](https://catonmat.net/ftp/awk.cheat.sheet.txt)\n\
    \n*   Q&A on stackoverflow/stackexchange are good source of learning material,\
    \ good for practice exercises as well\n\n    *   [awk Q&A on unix.stackexchange](https://unix.stackexchange.com/questions/tagged/awk?sort=votes&pageSize=15)\n\
    \n    *   [awk Q&A on stackoverflow](https://stackoverflow.com/questions/tagged/awk?sort=votes&pageSize=15)\n\
    \n*   Learn Regular Expressions (has information on flavors other than POSIX too)\n\
    \n    *   [regular-expressions](https://www.regular-expressions.info/) — tutorials\
    \ and tools\n\n    *   [rexegg](https://www.rexegg.com/) — tutorials, tricks and\
    \ more\n\n    *   [stackoverflow: What does this regex mean?](https://stackoverflow.com/q/22937618/4082052)\n\
    \n    *   [online regex tester and debugger](https://regex101.com/) — not fully\
    \ suitable for cli tools, but most of the POSIX syntax works\n\n*   [My repo on\
    \ cli text processing tools](https://github.com/learnbyexample/Command-line-text-processing)\n\
    \n*   Related tools\n\n    *   [GNU datamash](https://www.gnu.org/software/datamash/)\n\
    \n    *   [bioawk](https://github.com/lh3/bioawk)\n\n    *   [frawk](https://github.com/ezrosent/frawk)\
    \ — an efficient awk-like language, implemented in Rust\n\n    *   [hawk](https://github.com/gelisam/hawk/blob/master/doc/README.md)\
    \ — based on Haskell\n\n    *   [miller](https://github.com/johnkerl/miller) —\
    \ similar to awk/sed/cut/join/sort for name-indexed data such as CSV, TSV, and\
    \ tabular JSON\n\n        *   See this [news.ycombinator discussion](https://news.ycombinator.com/item?id=10066742)\
    \ for other tools like this\n\n*   miscellaneous\n\n    *   [unix.stackexchange:\
    \ When to use grep, sed, awk, perl, etc](https://unix.stackexchange.com/q/303044/109046)\n\
    \n    *   [awk-libs](https://github.com/e36freak/awk-libs) — lots of useful functions\n\
    \n    *   [awkaster](https://github.com/TheMozg/awk-raycaster) — Pseudo-3D shooter\
    \ written completely in awk\n\n    *   [awk REPL](https://awk.js.org/) — live\
    \ editor on browser\n\n*   ASCII reference and locale usage\n\n    *   [ASCII\
    \ code table](https://ascii.cl/)\n\n    *   [wiki.archlinux: locale](https://wiki.archlinux.org/index.php/locale)\n\
    \n    *   [shellhacks: Define Locale and Language Settings](https://www.shellhacks.com/linux-define-locale-language-settings/)\n\
    \n*   examples for some of the topics not covered in this book\n\n    *   [unix.stackexchange:\
    \ rand/srand](https://unix.stackexchange.com/q/372816/109046)\n\n    *   [unix.stackexchange:\
    \ strftime](https://unix.stackexchange.com/q/224969/109046)\n\n    *   [stackoverflow:\
    \ arbitrary precision integer extension](https://stackoverflow.com/q/46904447/4082052)\n\
    \n    *   [stackoverflow: recognizing hexadecimal numbers](https://stackoverflow.com/q/3683110/4082052)\n\
    \n    *   [unix.stackexchange: sprintf and file close](https://unix.stackexchange.com/q/223727/109046)\n\
    \n    *   [unix.stackexchange: user defined functions and array passing](https://unix.stackexchange.com/q/72469/109046)\n\
    \n    *   [unix.stackexchange: rename csv files based on number of fields in header\
    \ row](https://unix.stackexchange.com/q/408742/109046)"
