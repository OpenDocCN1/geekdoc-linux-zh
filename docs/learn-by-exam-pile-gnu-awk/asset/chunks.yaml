    \ hehe\n\n```\n\n# awk scripts\n\n## -f option\n\nThe `-f` command line option\
    \ allows you to pass the `awk` code via file instead of writing it all on the\
    \ command line. Here's a one-liner seen earlier that's been converted to a multiline\
    \ script. Note that `;` is no longer necessary to separate the commands, newline\
    \ will do that too.\n\n```\n\n[](#cb263-1)$ cat buf.awk\n\n[](#cb263-2)/error/{\n\
    \n[](#cb263-3)    f = 1\n\n[](#cb263-4)    buf = $0\n\n[](#cb263-5)    next\n\n\
    [](#cb263-6)}\n\n[](#cb263-7)\n\n[](#cb263-8)f{\n\n[](#cb263-9)    buf = buf ORS\
    \ $0\n\n[](#cb263-10)}\n\n[](#cb263-11)\n\n[](#cb263-12)/state/{\n\n[](#cb263-13)\
    \    if(f)\n\n[](#cb263-14)        print buf\n\n[](#cb263-15)    f = 0\n\n[](#cb263-16)}\n\
    \n[](#cb263-17)\n\n[](#cb263-18)$ awk -f buf.awk broken.txt\n\n[](#cb263-19)error\
    \ 2\n\n[](#cb263-20)1234\n\n[](#cb263-21)6789\n\n[](#cb263-22)state 1\n\n[](#cb263-23)error\
    \ 4\n\n[](#cb263-24)abcd\n\n[](#cb263-25)state 3\n\n```\n\nAnother advantage is\
    \ that single quotes can be freely used.\n\n```\n\n[](#cb264-1)$ echo 'cue us\
    \ on this example' | awk -v q=\"'\" '{gsub(/\\w+/, q \"&\" q)} 1'\n\n[](#cb264-2)'cue'\
    \ 'us' 'on' 'this' 'example'\n\n[](#cb264-3)\n\n[](#cb264-4)# the above solution\
    \ is simpler to write as a script\n\n[](#cb264-5)$ cat quotes.awk\n\n[](#cb264-6){\n\
    \n[](#cb264-7)    gsub(/\\w+/, \"'&'\")\n\n[](#cb264-8)}\n\n[](#cb264-9)\n\n[](#cb264-10)1\n\
    \n[](#cb264-11)\n\n[](#cb264-12)$ echo 'cue us on this example' | awk -f quotes.awk\n\
    \n[](#cb264-13)'cue' 'us' 'on' 'this' 'example'\n\n```\n\n## -o option\n\nIf the\
    \ code has been first tried out on command line, add `-o` option to get a pretty\
    \ printed version. Output filename can be passed along `-o` option, otherwise\
    \ `awkprof.out` will be used by default.\n\n```\n\n[](#cb265-1)$ # adding -o after\
    \ the one-liner has been tested\n\n[](#cb265-2)$ # input filenames and -v would\
    \ be simply ignored\n\n[](#cb265-3)$ awk -o -v OFS='\\t' 'NR==FNR{r[$1]=$2; next}\n\
    \n[](#cb265-4) {$(NF+1) = FNR==1 ? \"Role\" : r[$2]} 1' role.txt marks.txt\n\n\
    [](#cb265-5)\n\n[](#cb265-6)$ # pretty printed version\n\n[](#cb265-7)$ cat awkprof.out\n\
    \n[](#cb265-8)NR == FNR {\n\n[](#cb265-9)        r[$1] = $2\n\n[](#cb265-10) \
    \       next\n\n[](#cb265-11)}\n\n[](#cb265-12)\n\n[](#cb265-13){\n\n[](#cb265-14)\
    \        $(NF + 1) = FNR == 1 ? \"Role\" : r[$2]\n\n[](#cb265-15)}\n\n[](#cb265-16)\n\
    \n[](#cb265-17)1 {\n\n[](#cb265-18)        print\n\n[](#cb265-19)}\n\n[](#cb265-20)\n\
    \n[](#cb265-21)$ # calling the script\n\n[](#cb265-22)$ # note that other command\
    \ line options have to be provided as usual\n\n[](#cb265-23)$ awk -v OFS='\\t'\
    \ -f awkprof.out role.txt marks.txt\n\n[](#cb265-24)Dept    Name    Marks   Role\n\
    \n[](#cb265-25)ECE     Raj     53      class_rep\n\n[](#cb265-26)ECE     Joel\
    \    72\n\n[](#cb265-27)EEE     Moi     68\n\n[](#cb265-28)CSE     Surya   81\n\
    \n[](#cb265-29)EEE     Tia     59      placement_rep\n\n[](#cb265-30)ECE     Om\
    \      92\n\n[](#cb265-31)CSE     Amy     67      sports_rep\n\n```\n\n## Summary\n\
    \nSo, now you know how to write program files for `awk` instead of just the one-liners.\
    \ And about the useful `-o` option, helps to convert complicated one-liners to\
    \ pretty printed program files.\n\nNext chapter will discuss a few gotchas and\
    \ tricks.\n\n## Exercises\n\n**a)** Before explaining the problem statement, here's\
    \ an example of markdown headers and their converted link version. Note the use\
    \ of `-1` for the second occurrence of `Summary` header. Also note that this sample\
    \ doesn't simulate all the rules.\n\n```\n\n[](#cb266-1)# Field separators\n\n\
    [](#cb266-2)## Summary\n\n[](#cb266-3)# Gotchas and Tips\n\n[](#cb266-4)## Summary\n\
    \n[](#cb266-5)\n\n[](#cb266-6)* [Field separators](#field-separators)\n\n[](#cb266-7)\
    \    * [Summary](#summary)\n\n[](#cb266-8)* [Gotchas and Tips](#gotchas-and-tips)\n\
    \n[](#cb266-9)    * [Summary](#summary-1)\n\n```\n\nFor the input file `gawk.md`,\
    \ construct table of content links as per the details described below.\n\n*  \
    \ Identify all header lines\n    *   there are two types of header lines, one\
    \ starting with `#` and the other starting with `##`\n    *   lines starting with\
    \ `#` inside code blocks defined by ```` ```bash ```` and ```` ``` ```` markers\
    \ should be ignored\n\n*   The headers lines should then be converted as per the\
    \ following rules:\n\n    *   content is defined as portion of the header ignoring\
    \ the initial `#` or `##` characters and a space character\n\n    *   initial\
    \ `##` should be replaced with four spaces and a `*`\n\n    *   else, initial\
    \ `#` should be replaced with `*`\n\n    *   create a copy of the content, change\
    \ it to all lowercase, replace all space characters with `-` character and then\
    \ place it within `(#` and `)`\n\n        *   if there are multiple headers with\
    \ same content, append `-1`, `-2`, etc respectively for the second header, third\
    \ header, etc\n\n    *   surround the original content with `[]` and then append\
    \ the string obtained from previous step\n\n*   Note that the output should have\
    \ only the converted headers, all other input lines should not be present\n\n\
    As the input file `gawk.md` is too long, only the commands to verify your solution\
    \ is shown.\n\n```\n[](#cb267-1)$ awk -f toc.awk gawk.md > out.md\n[](#cb267-2)$\
    \ diff -sq out.md toc_expected.md\n[](#cb267-3)Files out.md and toc_expected.md\
    \ are identical\n```\n\n**b)** For the input file `odd.txt`, surround first two\
    \ whole words of each line with `{}` that start and end with the same word character.\
    \ Assume that input file will not require case insensitive comparison. This is\
    \ a contrived exercise that needs around 10 instructions and makes you recall\
    \ various features presented in this book.\n\n```\n[](#cb268-1)$ cat odd.txt\n\
    [](#cb268-2)-oreo-not:a _a2_ roar<=>took%22\n[](#cb268-3)RoaR to wow-\n[](#cb268-4)\n\
    [](#cb268-5)$ awk -f same.awk odd.txt\n[](#cb268-6)-{oreo}-not:{a} _a2_ roar<=>took%22\n\
    [](#cb268-7){RoaR} to {wow}-\n```\n\n# Gotchas and Tips\n\n## Prefixing $ for\
    \ variables\n\nSome scripting languages like `bash` require a `$` prefix when\
    \ you need the value stored in a variable. For example, if you declare `name='Joe'`\
    \ you'd need `echo \"$name\"` to print the value. This may result in using `$`\
    \ prefix and other bashisms in `awk` as well when you are a beginner. To make\
    \ it a bit worse, `awk` has the `$N` syntax for accessing field contents, which\
    \ could result in false comprehension that all variables need `$` prefix to access\
    \ their values. See also [unix.stackexchange: Why does awk print the whole line\
    \ when I want it to print a variable?](https://unix.stackexchange.com/q/291126/109046)."
