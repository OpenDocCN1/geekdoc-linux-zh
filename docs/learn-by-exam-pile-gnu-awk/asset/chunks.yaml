    - examples for some of the topics not covered in this book\n    - [unix.stackexchange:\
    \ rand/srand](https://unix.stackexchange.com/q/372816/109046)\n    - [unix.stackexchange:\
    \ strftime](https://unix.stackexchange.com/q/224969/109046)\n    - [stackoverflow:\
