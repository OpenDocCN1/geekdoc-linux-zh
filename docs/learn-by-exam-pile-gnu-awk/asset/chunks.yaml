    Character classes can also be used to construct numeric ranges. However, it is
    easy to miss corner cases and some ranges are complicated to design. See also
    [regular-expressions: Matching Numeric Ranges with a Regular Expression](https://www.regular-expressions.info/numericranges.html).


    ```

    [](#cb48-1)$ # numbers between 10 to 29

    [](#cb48-2)$ echo ''23 154 12 26 34'' | awk ''{gsub(/\<[12][0-9]\>/, "X")} 1''

