    ## 点元字符 `.`


    点元字符用作占位符来匹配任何字符（包括换行符）。稍后你将学习如何为有限字符集定义自定义的占位符。


    ```

    [](#cb37-1)$ # 以 ''c'' 开始以 ''t'' 结尾的 3 字符序列

    [](#cb37-2)$ echo ''tac tin cot abc:tyz excited'' | awk ''{gsub(/c.t/, "-")} 1''

    [](#cb37-3)ta-in - ab-yz ex-ed

    [](#cb37-4)

    [](#cb37-5)$ # 任意字符后跟 3 再跟任意字符

    [](#cb37-6)$ printf ''4\t35x\n'' | awk ''{gsub(/.3./, "")} 1''

    [](#cb37-7)4x

    [](#cb37-8)

    [](#cb37-9)$ # ''c'' 后跟任意字符再跟 ''x''

    [](#cb37-10)$ awk ''BEGIN{s="abc\nxyz"; sub(/c.x/, " ", s); print s}''

    [](#cb37-11)ab yz

    ```


    ## 量化符


    作为类比，或（alternation）提供了逻辑或（OR）。结合点元字符 `.` 和量化符（如果需要还有或）为执行逻辑与（AND）铺了道路。例如，检查字符串是否匹配两个之间带有任意字符的模式。量化符可以应用于字符和分组。除了指定精确数量和边界范围外，它们还可以匹配无边界的变化数量。


    首先是 `?` 元字符，它将字符或分组量化为匹配 `0` 次或 `1` 次。这有助于定义可选模式，并在某些情况下与分组相比可以构建出更简洁的模式。


    ```

    [](#cb38-1)$ # 等同于：awk ''{gsub(/\<(fe.d|fed)\>/, "X")} 1''

    [](#cb38-2)$ echo ''fed fold fe:d feeder'' | awk ''{gsub(/\<fe.?d\>/, "X")} 1''

    [](#cb38-3)X fold X feeder

    [](#cb38-4)

    [](#cb38-5)$ # 等同于：awk ''/<par(|t)>''

    [](#cb38-6)$ printf ''sub par\nare\npart'' | awk ''/<part>/''

    [](#cb38-7)sub par

    [](#cb38-8)$ # 等同于：awk ''{gsub(/part|parrot/, "X")} 1''

    [](#cb38-9)$ echo ''par part'' | awk ''{gsub(/par(ro)?t/, "X")} 1''

    [](#cb38-10)par X

    [](#cb38-11)$ # 等同于：awk ''{gsub(/part|parent/, "X")} 1''

    [](#cb38-12)$ echo ''par part'' | awk ''{gsub(/par(en|ro)?t/, "X")} 1''

    [](#cb38-13)par X

    [](#cb38-14)$ # 替换

    [](#cb38-15)

    [](#cb38-16)$ echo ''blah bar'' | awk ''{gsub(/<?, "<")}''

    [](#cb38-19)

    ```


    `*` 元字符将字符或分组量化为匹配 `0` 次或更多。没有上界，细节稍后讨论。


    ```

    [](#cb39-1)$ # ''f'' 后跟 0 次或多次 ''e''

    [](#cb39-2)$ echo ''fd fod:d'' | awk ''{gsub(/fe*/, "X")} 1''

    [](#cb39-3)X fod:d

    [](#cb39-4)

    [](#cb39-5)$ # ''f'' 后跟 0 次或多次 ''e''

    [](#cb39-6)$ echo ''311111111251142'' | awk ''{gsub(/1*2/, "-")} 1''

    ```

    注：此处为示例。


    `+` 元字符将字符或分组量化为匹配 `1` 次或更多。与 `*` 量化符类似，没有上界。


    ```

    [](#cb40-1)$ # ''f'' 后跟 1 次或多次 ''e''

    [](#cb40-2)$ echo ''fd fod:d'' | awk ''{gsub(/fe+d/, "X")} 1''

    [](#cb40-3)X fod:d

    [](#cb40-4)$ # ''f'' 后跟 1 次或多次 ''e'' 或 ''o'' 或 '':'' 后跟 ''d''

    [](#cb40-5)$ echo ''fd fod:d'' | awk ''{gsub(/f(e|o|)+d/, "X")} 1''

    [](#cb40-6)fd X X

    [](#cb40-8)$ # ''f'' 后跟 1 次或多次 ''1'' 然后是可选的 ''4'' 最后是 ''2''

    [](#cb40-9)$ echo ''311111111251142'' | awk ''{gsub(/1+?2/, "-")} 1''

    ```


    你可以使用 `{}` 元字符指定整数范围，包括有边界和无边界的。使用此量化符有四种方式，如下所示：


    | 模式 | 描述 |

    | --- | --- |

    | `{m,n}` | 匹配 `m` 到 `n` 次 |

    | `{m,}` | 至少匹配 `m` 次 |

    | `{,n}` | 最多匹配 `n` 次（包括 `0` 次） |

    | `{n}` | 精确匹配 `n` 次 |


    ```

    [](#cb41-1)$ # 注意 {} 内部不允许空格

    [](#cb41-2)$ echo ''ac abc abbc abbbc abbbbbbc'' | awk ''{gsub(/ab{1,4}c/, "X")}
    1''

    [](#cb41-3)ac X X X abbbbbbc

    [](#cb41-4)

    [](#cb41-5)$ echo ''ac abc abbc abbbc abbbbbbc'' | awk ''{gsub(/ab{3,,}c/, "X")}
    1''

    [](#cb41-6)ac abc abbc X X

    [](#cb41-7)

    [](#cb41-8)$ echo ''ac abc abbc abbbc abbbbbbc'' | awk ''{gsub(/ab{,2}c/, "X")}
    1''

    [](#cb41-9)X X X abbbbbbbbc

    [](#cb41-10)

    [](#cb41-11)$ echo ''ac abc abbc abbbc abbbbbbc'' | awk ''{gsub(/ab{3}c/, "X")}
    1''

    [](#cb41-12)ac abc abbc X abbbbbbc

    ```


    > ![info](img/file0.svg) `{}` 元字符必须转义才能匹配其字面量。与 `()` 元字符类似，单独转义 `{` 即可。


    接下来是如何使用点元字符和量化符构建条件逻辑与。


    ```

    [](#cb42-1)$ # 匹配 ''Error'' 后跟零或多个字符，再跟 ''valid''

    [](#cb42-2)$ echo ''Error: not a valid input'' | awk ''/Error.*valid/''

    [](#cb42-3)Error: not a valid input

    ```


    为了允许任意顺序匹配，你还需要引入或（alternation）。但是，对于超过 3 个模式的情况，组合将变得难以编写和维护。


    ```

    [](#cb43-1)$ # ''cat'' 后跟 ''dog'' 或 ''dog'' 后跟 ''cat''

    [](#cb43-2)$ echo ''two cats and a dog'' | awk ''{gsub(/cat.*dog|dog.*cat/, "pets")}
    1''

    [](#cb43-3)two pets

    [](#cb43-4)$ echo ''two dogs and a cat'' | awk ''{gsub(/cat.*dog|dog.*cat/, "pets")}
    1''

    [](#cb43-5)two pets

    ```


    ## 最长匹配获胜


    你已经看到一个或的示例，当两个备选方案从相同位置开始时，会选择最长的匹配部分。例如 `spar|spared` 将导致选择 `spared` 而不是 `spar`。当从相同起始位置有两个或多个匹配可能时，情况同样适用。例如，如果匹配的字符串是
    `foot`，`f.?o` 将匹配 `foo` 而不是 `fo`。


    '
- fmt: '

    ```

    [](#cb44-1)$ # longest match among ''foo'' and ''fo'' wins here

    [](#cb44-2)$ echo ''foot'' | awk ''{sub(/f.?o/, "X")} 1''

    [](#cb44-3)Xt

    [](#cb44-4)$ # everything will match here

    [](#cb44-5)$ echo ''car bat cod map scat dot abacus'' | awk ''{sub(/.*/, "X")}
    1''

    [](#cb44-6)X

    [](#cb44-7)

    [](#cb44-8)$ # longest match happens when (1|2|3)+ matches up to ''1233'' only

    [](#cb44-9)$ # so that ''12baz'' can match as well

    [](#cb44-10)$ echo ''foo123312baz'' | awk ''{sub(/o(1|2|3)+(12baz)?/, "X")} 1''

    [](#cb44-11)foX

    [](#cb44-12)$ # in other implementations like ''perl'', that is not the case

    [](#cb44-13)$ # quantifiers match as much as possible, but precedence is left
    to right

    [](#cb44-14)$ echo ''foo123312baz'' | perl -pe ''s/o(1|2|3)+(12baz)?/X/''

    [](#cb44-15)foXbaz

    ```


    While determining the longest match, overall regular expression matching is also
    considered. That''s how `Error.*valid` example worked. If `.*` had consumed everything
    after `Error`, there wouldn''t be any more characters to try to match `valid`.
    So, among the varying quantity of characters to match for `.*`, the longest portion
    that satisfies the overall regular expression is chosen. Something like `a.*b`
    will match from first `a` in the input string to the last `b` in the string. In
    other implementations, like `perl`, this is achieved through a process called
    `backtracking`. Both approaches have their own advantages and disadvantages and
    have cases where the regexp can result in exponential time consumption.


    ```

    [](#cb45-1)$ # from start of line to last ''m'' in the line

    [](#cb45-2)$ echo ''car bat cod map scat dot abacus'' | awk ''{sub(/.*m/, "-")}
    1''

    [](#cb45-3)-ap scat dot abacus

    [](#cb45-4)

    [](#cb45-5)$ # from first ''b'' to last ''t'' in the line

    [](#cb45-6)$ echo ''car bat cod map scat dot abacus'' | awk ''{sub(/b.*t/, "-")}
    1''

    [](#cb45-7)car - abacus

    [](#cb45-8)

    [](#cb45-9)$ # from first ''b'' to last ''at'' in the line

    [](#cb45-10)$ echo ''car bat cod map scat dot abacus'' | awk ''{sub(/b.*at/, "-")}
    1''

    [](#cb45-11)car - dot abacus

    [](#cb45-12)

    [](#cb45-13)$ # here ''m*'' will match ''m'' zero times as that gives the longest
    match

    [](#cb45-14)$ echo ''car bat cod map scat dot abacus'' | awk ''{sub(/a.*m*/, "-")}
    1''

    [](#cb45-15)c-

    ```


    ## Character classes


    To create a custom placeholder for limited set of characters, enclose them inside
    `[]` metacharacters. It is similar to using single character alternations inside
    a grouping, but with added flexibility and features. Character classes have their
    own versions of metacharacters and provide special predefined sets for common
    use cases. Quantifiers are also applicable to character classes.


    ```

    [](#cb46-1)$ # same as: awk ''/cot|cut/'' and awk ''/c(o|u)t/''

    [](#cb46-2)$ printf ''cute\ncat\ncot\ncoat\ncost\nscuttle\n'' | awk ''/c[ou]t/''

    [](#cb46-3)cute

    [](#cb46-4)cot

    [](#cb46-5)scuttle

    [](#cb46-6)

    [](#cb46-7)$ # same as: awk ''/.(a|e|o)+t/''

    [](#cb46-8)$ printf ''meeting\ncute\nboat\nat\nfoot\n'' | awk ''/.[aeo]+t/''

    [](#cb46-9)meeting

    [](#cb46-10)boat

    [](#cb46-11)foot

    [](#cb46-12)

    [](#cb46-13)$ # same as: awk ''{gsub(/\<(s|o|t)(o|n)\>/, "X")} 1''

    [](#cb46-14)$ echo ''no so in to do on'' | awk ''{gsub(/\<[sot][on]\>/, "X")}
    1''

    [](#cb46-15)no X in X do X

    [](#cb46-16)

    [](#cb46-17)$ # strings made up of letters ''o'' and ''n'', string length at least
    2

    [](#cb46-18)$ # /usr/share/dict/words contains dictionary words, one word per
    line

    [](#cb46-19)$ awk ''/^[on]{2,}$/'' /usr/share/dict/words

    [](#cb46-20)no

    [](#cb46-21)non

    [](#cb46-22)noon

    [](#cb46-23)on

    ```


    Character classes have their own metacharacters to help define the sets succinctly.
    Metacharacters outside of character classes like `^`, `$`, `()` etc. either don''t
    have special meaning or have completely different one inside the character classes.


    First up, the `-` metacharacter that helps to define a range of characters instead
    of having to specify them all individually.


    ```

    [](#cb47-1)$ # same as: awk ''{gsub(/[0123456789]+/, "-")} 1''

    [](#cb47-2)$ echo ''Sample123string42with777numbers'' | awk ''{gsub(/[0-9]+/,
    "-")} 1''

    [](#cb47-3)Sample-string-with-numbers

    [](#cb47-4)

    [](#cb47-5)$ # whole words made up of lowercase alphabets and digits

    [](#cb47-6)$ echo ''coat food12 best'' | awk ''{gsub(/\<a-z0-9]+\, "X")} 1''

    [](#cb47-7)X

    [](#cb47-8)

    [](#cb47-9)$ # whole words made up of lowercase alphabets, starting with ''p''
    to ''z''

    [](#cb47-10)$ echo ''road post eat'' | awk ''{gsub(/\<p-z][a-z]*>/, "X")} 1''

    [](#cb47-11)X

    ```


    Character classes can also be used to construct numeric ranges. However, its easy
    to miss corner cases and some ranges are complicated to design. See also [regular-expressions:
    Matching Ranges](https://www.regular-expressions.info/ranges.html).


    ```

    [](#cb48-1)$ # numbers between 10 to 29

    [](#cb48-2)$ echo ''23 154 26 34'' | awk ''{gsub(/\<12][0-9]/, "X")} 1''

    [](#cb48-3)X

    [](#cb48-4)

    [](#cb48-5)$ # numbers >= 100 with leading zeros

    [](#cb48-6)$ echo ''0501 154 12 26 9823'' | awk ''{gsub(/\<0*[0-9]{3,}/, "X")}
    1''

    [](#cb48-7)X

    ```


    Next metacharacter is `^` which has to be specified as the first character class.
    It negates the set, so all characters other than specified will match. Handle
    negative logic with care, you might end up more than wanted.


    ```

    [](#cb49-1)$ # replace all non-digits

    [](#cb49-2)$ echo ''Sample123string42with777numbers'' | awk ''{gsub(/[^0-9]+/,
    "-")} 1''

    [](#cb49-3)-123-

    [](#cb49-4)$ # delete two columns based on delimiter

    [](#cb49-5)$ echo ''foo:123:baz'' | awk ''{sub(/(::]+){2}$/, "")} 1''

    [](#cb49-6)foo:123

    [](#cb49-7)$ # sequence of characters surrounded by unique character

    [](#cb49-8)$ echo ''I like "mango" and "guava"'' | awk ''{gsub(/""]+/, "X")} 1''

    [](#cb49-9)I like X

    [](#cb49-10)$ # sometimes it is simpler to positively define a set than negation

    [](#cb49-11)$ # same as: awk ''/^aeiou]*$/''

    [](#cb49-12)$ printf ''try\nfun\ngly\npity\n'' | awk ''!/[aeiou]/''

    [](#cb49-13)try

    [](#cb49-14)

    ```


    Some commonly used character sets have predefined escape sequences:


    - `\w` matches all `word` characters `[a-zA-Z0-9_]` (recall the description for
    word)

    - `\W` matches all non-word characters (recall duality seen earlier, like `\y`
    and `\B`)

    - `\s` matches all `whitespace` characters: tab, newline, vertical tab, form feed,
    carriage return and space

    - `\S` matches all non-whitespace characters


    ```

    [](#cb50-1)$ # match all non-word characters

    [](#cb50-2)$ echo ''load;err_msg--ant,r2..not'' | awk ''{gsub(/\W+/, "-")} 1''

    [](#cb50-3)load-err_msg-ant-r2-not

    [](#cb50-4)

    [](#cb50-5)$ # replace all sequences of whitespaces with single space

    [](#cb50-6)$ printf ''hi  \v\f  there.\thave   \ra nice\t\tday\n'' | awk ''{gsub(/\s+/,
    " ")} 1''

    [](#cb50-7)hi there. have a nice day

    ```


    These escape sequences *cannot* used inside character classes.


    ```

    [](#cb51-1)$ # \w would simply match w inside character classes

    [](#cb51-2)$ echo ''w=y\x+9*3'' | awk ''{gsub(/[\w=]/, "") 1''

    [](#cb51-3)y\x+9*3

    ```


    > ![warning](media/file1.svg) `awk` doesn''t support `\d` and `\D`, commonly featured
    in other implementations as a shortcut for all the digits and non-digits.


    A **named character set** is defined by a name enclosed between `[:` and `:]`
    and has to be used within a character class `[]`, along with any other characters
    as needed.


    | Named set | Description |

    | --- | --- |

    | `[:digit:]` | `[0-9]` |

    | `[:lower:]` | `[a-z]` |

    | `[:upper:]` | `[A-Z]` |

    | `[:alpha:]` | `[a-zA-Z]` |

    | `[:alnum:]` | `[0-9a-zA-Z]` |

    | `[:xdigit:]` | `[0-9a-fA-F]` |

    | `[:cntrl:]` | control characters - first 32 ASCII characters and 127th (DEL)
    |

    | `[:punct:]` | all the punctuation characters |

    | `[:graph:]` | `[:alnum:]` and `[:punct:]` |

    | `[:print:]` | `[:alnum:]`, `[:punct:]` and space |

    | `[:blank:]` | space and tab characters |

