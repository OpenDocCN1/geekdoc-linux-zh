    [](#cb48-4)

    [](#cb48-5)$ # numbers >= 100 with optional leading zeros

    [](#cb48-6)$ echo ''0501 035 154 12 26 98234'' | awk ''{gsub(/\<0*[1-9][0-9]{2,}\>/,
    "X")} 1''

    [](#cb48-7)X 035 X 12 26 X

