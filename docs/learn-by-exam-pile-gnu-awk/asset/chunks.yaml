    \ note that the field contents will include the spaces as well\nawk -v FIELDWIDTHS='8\
    \ 4 6' '{print \"[\" $2 \"]\"}' items.txt\n[fig ]\n[10  ]\n```\n\nYou can optionally\
    \ prefix a field width with number of characters to be ignored.\n\n```\n# first\
    \ field is 5 characters\n# then 3 characters are ignored and 3 characters for\
    \ second field\n# then 1 character is ignored and 6 characters for third field\n\
    awk -v FIELDWIDTHS='5 3:3 1:6' '{print \"[\" $1 \"]\"}' items.txt\n[apple]\n[50\
    \   ]\nawk -v FIELDWIDTHS='5 3:3 1:6' '{print \"[\" $2 \"]\"}' items.txt\n[fig]\n\
    [10 ]\n```\n\nIf an input line length exceeds the total widths specified, the\
    \ extra characters will simply be ignored. If you wish to access those characters,\
    \ you can use `*` to represent the last field. See [gawk manual: FIELDWIDTHS](https://www.gnu.org/software/gawk/manual/gawk.html#Fields-with-fixed-data)\
