    ## awk 一行命令结构


    之前章节中的示例使用了几种不同的方法来构建典型的 `awk` 一行命令。如果你还没有掌握语法，这个通用结构可能会有所帮助：


    `awk ''cond1{action1} cond2{action2} ... condN{actionN}''`


    如果未提供条件，则始终会执行动作（action）。在块内部，你可以提供多个用分号隔开的语句。如果未提供动作，那么当条件求值为 `true` 时，默认会打印
    `$0` 变量的内容。当不存在动作时，你可以使用分号来结束一个条件并开始另一个 `condX{actionX}` 片段。


    注意，多个块只是语法上的糖。。它有助于在大多数一行命令中避免显式地使用 `if` 控制结构。下面的代码段展示了使用和不使用 `if` 结构时的等效代码。


    ```

    [](#cb10-1)$ awk ''{

    [](#cb10-2) if($NF < 0){

    [](#cb10-3) print $0

    [](#cb10-4) }

    [](#cb10-5) }'' table.txt

    [](#cb10-6)blue cake mug shirt -7

    [](#cb10-7)

    [](#cb10-8)$ awk ''$NF<0'' table.txt

    [](#cb10-9)blue cake mug shirt -7

    ```


    当你需要在读取输入之前执行某些操作时可以使用 `BEGIN{}` 块，在处理所有输入之后执行某些操作时可以使用 `END{}` 块。


    ```

    [](#cb11-1)$ seq 2 | awk ''BEGIN{print "---"} 1; END{print "%%%"}''

    [](#cb11-2)---

    [](#cb11-3)1

    [](#cb11-4)%%%

    ```


    后续章节会有更多类型。请参见 [awk 手册：运算符](https://www.gnu.org/software/gawk/manual/gawk.html#Operators)
    了解细节。请参见 [awk 手册：字符串与数字](https://www.gnu.org/software/gawk/manual/gawk.html#Values-Conditions)
    了解更多。


    ## 字符串与数字


    到目前为止示例使用了字符串和数字。如提到的，`awk` 会尝试将字符串转换为数字。字符串字面量在双引号内。数字可以是整数或浮点数。允许科学计数法。请参见 [awk
    手册：字符串与数字](https://www.gnu.org/software/gawk/manual/gawk.html#Strings-and-Numbers)
    了解细节。


    ```

    [](#cb12-1)$ # 等于：awk ''BEGIN{print "hi"}''

    [](#cb12-2)hi

    [](#cb12-3)

    ```


    你也可以将这些保存在变量中以后使用。


    ```

    [](#cb13-1)$ # 使用：awk ''BEGIN{a=5}''

    [](#cb13-2)5

    [](#cb13-3)

    ```


    如果使用了未初始变量，它将作为空字符串。


    ```

    [](#cb14-1)$ # 示例：awk ''BEGIN{s1="con"; s2="cat"; print s1 s2}''

    [](#cb14-2)concat

    [](#cb14-3)

    ```


    如果字符串以有效数字开头，它将表现为 `0`。


    ```

    [](#cb15-1)$ # 等于：awk ''BEGIN{sum=0}''

    [](#cb15-2)0

    [](#cb15-3)

    ```


    ## 数组


    `awk` 中的数组是关联的，这意味着它们键值对。键可以是数字或字符串，但数字内部会被转换为字符串。它们也可以是多维的。在后续相关章节会有大量的数组示例。请参见
    [gawk 手册：数组](https://www.gnu.org/software/gawk/manual/gawk.html#Arrays) 了解完整的细节和注意事项。


    ```

    [](#cb16-1)$ # 分配数组并根据字符串键访问元素

    [](#cb16-2)$ awk ''BEGIN{student["id"] = 101; student["name"] = "Joe";

    [](#cb16-3) print student["name"]}''

    [](#cb16-4)Joe

    [](#cb16-5)

    [](#cb16-6)$ # 检查键是否存在

    [](#cb16-7)$ awk ''BEGIN{student["id"] = 101; student["name"] = "Joe";

    [](#cb16-8) if("id" in student) print "Key found"}''

    [](#cb16-9)Key found

    ```


