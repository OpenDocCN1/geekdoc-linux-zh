    # Field separators


    Now that you are familiar with basic `awk` syntax and regular expressions, this
    chapter will dive deep into field processing. You''ll learn how to set input and
    output field separators, how to use regexps for defining fields and how to work
    with fixed length fields.


    ## Default field separation


    As seen earlier, `awk` automatically splits input into fields which are accessible
    using `$N` where `N` is the field number you need. You can also pass an expression
    instead of numeric literal to specify the field required.


    ```

    [](#cb81-1)$ cat table.txt

    [](#cb81-2)brown bread mat hair 42

    [](#cb81-3)blue cake mug shirt -7

    [](#cb81-4)yellow banana window shoes 3.14

    [](#cb81-5)

    [](#cb81-6)$ # print fourth field if first field starts with ''b''

    [](#cb81-7)$ awk ''$1 ~ /^b/{print $4}'' table.txt

    [](#cb81-8)hair

    [](#cb81-9)shirt

    [](#cb81-10)

    [](#cb81-11)$ # print the field as specified by value stored in ''f'' variable

    [](#cb81-12)$ awk -v f=3 ''{print $f}'' table.txt

    [](#cb81-13)mat

    [](#cb81-14)mug

    [](#cb81-15)window

    ```


    The `NF` special variable will give you the number of fields for each input line.
    This is useful when you don''t know how many fields are present in the input and
    you need to specify field number from the end.


    ```

    [](#cb82-1)$ # print the last field of each input line

    [](#cb82-2)$ awk ''{print $NF}'' table.txt

    [](#cb82-3)42

    [](#cb82-4)-7

    [](#cb82-5)3.14

    [](#cb82-6)

    [](#cb82-7)$ # print the last but one field

    [](#cb82-8)$ awk ''{print $(NF-1)}'' table.txt

    [](#cb82-9)hair

    [](#cb82-10)shirt

    [](#cb82-11)shoes

    [](#cb82-12)

    [](#cb82-13)$ # don''t forget the parentheses!

    [](#cb82-14)$ awk ''{print $NF-1}'' table.txt

    [](#cb82-15)41

    [](#cb82-16)-8

    [](#cb82-17)2.14

    ```


    By default, `awk` does more than split the input on spaces. It splits based on
    one or more sequence of **space** or **tab** or **newline** characters. In addition,
    any of these three characters at the start or end of input gets trimmed and won''t
    be part of field contents. Input containing newline character will be covered
    in [Record separators](#ch006.xhtml_record-separators) chapter.


    ```

    [](#cb83-1)$ echo ''   a   b   c   '' | awk ''{print NF}''

    [](#cb83-2)3

    [](#cb83-3)$ # note that leading spaces isn''t part of field content

    [](#cb83-4)$ echo ''   a   b   c   '' | awk ''{print $1}''

    [](#cb83-5)a

    [](#cb83-6)$ # note that trailing spaces isn''t part of field content

    [](#cb83-7)$ echo ''   a   b   c   '' | awk ''{print $NF "."}''

    [](#cb83-8)c.

    [](#cb83-9)

    [](#cb83-10)$ # here''s another example with tab characters thrown in

    [](#cb83-11)$ printf ''     one \t two\t\t\tthree  '' | awk ''{print NF}''

    [](#cb83-12)3

    [](#cb83-13)$ printf ''     one \t two\t\t\tthree  '' | awk ''{print $2 "."}''

    [](#cb83-14)two.

    ```


    > ![warning](media/file1.svg) When passing an expression for field number, floating-point
    result is acceptable too. The fractional portion is ignored. However, as precision
    is limited, it could result in rounding instead of truncation.


    ```

    [](#cb84-1)$ awk ''BEGIN{printf "%.16f\n", 2.999999999999999}''

    [](#cb84-2)2.9999999999999991

    [](#cb84-3)$ awk ''BEGIN{printf "%.16f\n", 2.9999999999999999}''

    [](#cb84-4)3.0000000000000000

    [](#cb84-5)

    [](#cb84-6)$ # same as: awk ''{print $2}'' table.txt

    [](#cb84-7)$ awk ''{print $2.999999999999999}'' table.txt

    [](#cb84-8)bread

    [](#cb84-9)cake

    [](#cb84-10)banana

    [](#cb84-11)$ # same as: awk ''{print $3}'' table.txt

    [](#cb84-12)$ awk ''{print $2.9999999999999999}'' table.txt

    [](#cb84-13)mat

    [](#cb84-14)mug

    [](#cb84-15)window

    ```


    ## Input field separator


    The most common way to change the default field separator is to use the `-F` command
    line option. The value passed to the option will be treated as a string literal
    and then converted to a regexp. For now, here''s some examples without any special
    regexp characters.


    ```

    [](#cb85-1)$ # use '':'' as input field separator

    [](#cb85-2)$ echo ''goal:amazing:whistle:kwality'' | awk -F: ''{print $1}''

    [](#cb85-3)goal

    [](#cb85-4)$ echo ''goal:amazing:whistle:kwality'' | awk -F: ''{print $NF}''

    [](#cb85-5)kwality

    [](#cb85-6)

    [](#cb85-7)$ # use quotes to avoid clashes with shell special characters

    [](#cb85-8)$ echo ''one;two;three;four'' | awk -F'';'' ''{print $3}''

    [](#cb85-9)three

    [](#cb85-10)

    [](#cb85-11)$ # first and last fields will have empty string as their values

    [](#cb85-12)$ echo ''=a=b=c='' | awk -F= ''{print $1 "[" $NF "]"}''

    [](#cb85-13)[]

    ```


    You can also directly set the special `FS` variable to change the input field
    separator. This can be done from the command line using `-v` option or within
    the code blocks.


    ```

    [](#cb86-1)$ echo ''goal:amazing:whistle:kwality'' | awk -v FS=: ''{print $2}''

    [](#cb86-2)amazing

    [](#cb86-3)

    [](#cb86-4)$ # field separator can be multiple characters too

    [](#cb86-5)$ echo ''1e4SPT2k6SPT3a5SPT4z0'' | awk ''BEGIN{FS="SPT"} {print $3}''

    [](#cb86-6)3a5

    ```


    If you wish to split the input as individual characters, use an empty string as
    the field separator.


    ```

    [](#cb87-1)$ # note that the space between -F and '''' is mandatory

    [](#cb87-2)$ echo ''apple'' | awk -F '''' ''{print $1}''

    [](#cb87-3)a

    [](#cb87-4)$ echo ''apple'' | awk -v FS= ''{print $NF}''

    [](#cb87-5)e

    [](#cb87-6)

    [](#cb87-7)$ # depending upon the locale, you can work with multibyte characters
    too

    [](#cb87-8)$ echo ''αλεπού'' | awk -v FS= ''{print $3}''

    [](#cb87-9)ε

    ```'
