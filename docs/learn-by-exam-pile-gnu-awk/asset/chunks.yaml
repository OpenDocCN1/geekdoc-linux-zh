    ## patsplit


    The `patsplit` function will give you the features provided by `FPAT`. The argument
    order and optional arguments is same as the `split` function, with `FPAT` as the
    default separator. The return value is number of fields obtained from the split.


    ```

    [](#cb172-1)$ s=''eagle,"fox,42",bee,frog''

    [](#cb172-2)

    [](#cb172-3)$ echo "$s" | awk ''{patsplit($0, a, /"[^"]*"|[^,]*/); print a[2]}''

    [](#cb172-4)"fox,42"

    ```


    ## substr


    The `substr` function allows to extract specified number of characters from given
    string based on indexing. The argument order is:


    *   First argument is the input string


    *   Second argument is starting position


    *   Third argument is number of characters to extract


    The index starts from `1`. If the third argument is not specified, by default
    all characters until the end of string input is extracted. If the second argument
    is greater than length of the string or if third argument is less than or equal
    to `0` then empty string is returned. Second argument will use `1` if a number
    less than one is specified.


    ```

    [](#cb173-1)$ echo ''abcdefghij'' | awk ''{print substr($0, 1, 5)}''

    [](#cb173-2)abcde

    [](#cb173-3)$ echo ''abcdefghij'' | awk ''{print substr($0, 4, 3)}''

    [](#cb173-4)def

    [](#cb173-5)

    [](#cb173-6)$ echo ''abcdefghij'' | awk ''{print substr($0, 6)}''

    [](#cb173-7)fghij

    [](#cb173-8)

    [](#cb173-9)$ echo ''abcdefghij'' | awk -v OFS=: ''{print substr($0, 2, 3), substr($0,
    6, 3)}''

    [](#cb173-10)bcd:fgh

    ```


    If only a few characters are needed from input record, can also use empty `FS`.


    ```

    [](#cb174-1)$ echo ''abcdefghij'' | awk -v FS= ''{print $3}''

    [](#cb174-2)c

    [](#cb174-3)$ echo ''abcdefghij'' | awk -v FS= ''{print $3, $5}''

    [](#cb174-4)c e

    ```


    ## match


    The `match` function is useful to extract portion of an input string matched by
    a regexp. There are two ways to get the matched portion:


    *   by using `substr` function along with special variables `RSTART` and `RLENGTH`


    *   by passing a third argument to `match` so that the results are available from
    an array


    The first argument to `match` is the input string and second is the regexp. If
    the match fails, then `RSTART` gets `0` and `RLENGTH` gets `-1`. Return value
    is same as `RSTART`.


    ```

    [](#cb175-1)$ s=''051 035 154 12 26 98234''

    [](#cb175-2)

    [](#cb175-3)$ # using substr and RSTART/RLENGTH

    [](#cb175-4)$ echo "$s" | awk ''match($0, /[0-9]{4,}/){print substr($0, RSTART,
    RLENGTH)}''

    [](#cb175-5)98234

    [](#cb175-6)

    [](#cb175-7)$ # using array, note that index 0 is used here, not 1

    [](#cb175-8)$ echo "$s" | awk ''match($0, /0*[1-9][0-9]{2,}/, m){print m[0]}''

    [](#cb175-9)154

    ```


    Both the above examples can also be easily solved using `FPAT` or `patsplit`.
    `match` has an advantage when it comes to getting portions matched only within
    capture groups. The first element of array will still have the entire match. Second
    element will contain portion matched by first group, third element will contain
    portion matched by second group and so on. See also [stackoverflow: arithmetic
    replacement in a text file](https://stackoverflow.com/q/62241101/4082052).


    ```

    [](#cb176-1)$ # entire matched portion

    [](#cb176-2)$ echo ''foo=42, baz=314'' | awk ''match($0, /baz=([0-9]+)/, m){print
    m[0]}''

    [](#cb176-3)baz=314

    [](#cb176-4)$ # matched portion of first capture group

    [](#cb176-5)$ echo ''foo=42, baz=314'' | awk ''match($0, /baz=([0-9]+)/, m){print
    m[1]}''

    [](#cb176-6)314

    ```


    If you need to get matching portions for all the matches instead of just the first
    match, you can use a loop and adjust the input string every iteration.


    ```

    [](#cb177-1)$ # extract numbers only if it is followed by a comma

    [](#cb177-2)$ s=''42 foo-5, baz3; x-83, y-20: f12''

    [](#cb177-3)$ echo "$s" | awk ''{ while( match($0, /([0-9]+),/, m) ){print m[1];

    [](#cb177-4) $0=substr($0, RSTART+RLENGTH)} }''

    [](#cb177-5)5

    [](#cb177-6)83

    ```


    ## index


    The `index` function is useful when you need to match a string literally in the
    given input string. This is similar to `grep -F` functionality of matching fixed
    strings. The first argument to this function is the input string and the second
    is the string to be matched literally. The return value is the index of matching
    location and `0` if there is no match.


    ```

    [](#cb178-1)$ cat eqns.txt

    [](#cb178-2)a=b,a-b=c,c*d

    [](#cb178-3)a+b,pi=3.14,5e12

    [](#cb178-4)i*(t+9-g)/8,4-a+b

    [](#cb178-5)

    [](#cb178-6)$ # no output because the metacharacters aren''t escaped

    [](#cb178-7)$ awk ''/i*(t+9-g)/'' eqns.txt

    [](#cb178-8)$ # same as: grep -F ''i*(t+9-g)'' eqns.txt

    [](#cb178-9)$ awk ''index($0, "i*(t+9-g)")'' eqns.txt

    [](#cb178-10)i*(t+9-g)/8,4-a+b

    [](#cb178-11)

    [](#cb178-12)$ # check only the last field

    [](#cb178-13)$ awk -F, ''index($NF, "a+b")'' eqns.txt

    [](#cb178-14)i*(t+9-g)/8,4-a+b

    [](#cb178-15)$ # index not needed if entire field/line is being compared

    [](#cb178-16)$ awk -F, ''$1=="a+b"'' eqns.txt

    [](#cb178-17)a+b,pi=3.14,5e12

    ```


    The return value is also useful to ensure match is found at specific positions
    only. For example start or end of input string.


    ```

    [](#cb179-1)$ # start of string

    [](#cb179-2)$ awk ''index($0, "a+b")==1'' eqns.txt

    [](#cb179-3)a+b,pi=3.14,5e12

    [](#cb179-4)$ # end of string

    [](#cb179-5)$ awk -v s="a+b" ''index($0, s)==length()-length(s)+1'' eqns.txt

    [](#cb179-6)i*(t+9-g)/8,4-a+b

    ```'
