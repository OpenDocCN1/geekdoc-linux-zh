    \ a[i]}'\nair water 12\nair water 42\nair water 3\n```\n\nSimilar to `FS`, you\
    \ can use regular expression as a separator.\n\n```bash\ns='Sample123string42with777numbers'\n\
    echo \"$s\" | awk '{split($0, s, /[0-9]+/); print s[2], s[4]}'\nstring numbers\n\
    ```\n\nThe fourth argument provides a feature not present with `FS` splitting.\
    \ It allows you to save the portions matched by the separator in an array. Quoting\
    \ from [gawk manual: split()](https://www.gnu.org/software/gawk/manual/gawk.html#index-split_0028_0029-function):\n\
    \n> If `fieldsep` is a single space, then any leading whitespace goes into `seps[0]`\
    \ and any trailing whitespace goes into `seps[n]`, where `n` is the return value\
    \ of `split()` (i.e., the number of elements in `array`).\n\n```bash\ns='Sample123string42with777numbers'\n\
    echo \"$s\" | awk '{n=split($0, s, /[0-9]+/, seps);\nfor(i=1; i<n; i++) print\
    \ seps[i]}'\n123\n42\n777\n```\n\nHere's an example where `split` is merely used\
    \ to initialize an array based on empty separator. Unlike `$N` syntax where an\
    \ expression resulting in floating-point number is acceptable, array index has\
    \ to be an integer. Hence, `int` function is used to convert floating-point result\
    \ to integer in the example below.\n\n```bash\ncat marks.txt\nDept    Name   \
    \ Marks\nECE     Raj     53\nECE     Joel    72\nEEE     Moi     68\nCSE     Surya\
    \   81\nEEE     Tia     59\nECE     Om      92\nCSE     Amy     67\n\n# adds a\
    \ new grade column based on marks in 3rd column\nawk 'BEGIN{OFS=\"\\t\"; split(\"\
    DCBAS\", g, //)}\n{$(NF+1) = NR==1 ? \"Grade\" : g[int($NF/10)-4]} 1' marks.txt\n\
    Dept    Name    Marks   Grade\nECE     Raj     53      D\nECE     Joel    72 \
    \     B\nEEE     Moi     68      C\nCSE     Surya   81      A\nEEE     Tia   \
    \  59      D\nECE     Om      92      S\nCSE     Amy     67      C\n```\n\n##\
    \ patsplit\n\nThe `patsplit` function will give you the features provided by `FPAT`.\
    \ The argument order and optional arguments is same as the `split` function, with\
    \ `FPAT` as the default separator. The return value is number of fields obtained\
    \ from the split.\n\n```bash\ns='eagle,\"fox,42\",bee,frog'\necho \"$s\" | awk\
    \ '{patsplit($0, a, /\"[^\"]*\"|[^,]*/); print a[2]}'\n\"fox,42\"\n```\n\n## substr\n\
    \nThe `substr` function allows to extract specified number of characters from\
    \ given string based on indexing. The argument order is:\n\n* First argument is\
    \ the input string\n* Second argument is starting position\n* Third argument is\
    \ number of characters to extract\n\nThe index starts from `1`. If the third argument\
    \ is not specified, by default all characters until the end of string input is\
    \ extracted. If the second argument is greater than length of the string or if\
    \ third argument is less than or equal to `0` then empty string is returned. Second\
    \ argument will use `1` if a number less than one is specified.\n\n```bash\necho\
    \ 'abcdefghij' | awk '{print substr($0, 1, 5)}'\nabcde\necho 'abcdefghij' | awk\
    \ '{print substr($0, 4, 3)}'\ndef\necho 'abcdefghij' | awk '{print substr($0,\
    \ 6)}'\nfgh\necho 'abcdefghij' | awk -v OFS=: '{print substr($0, 2, 3), substr($0,\
    \ 6)}'\nbcd:fgh\n```\n\nIf only a few characters are needed from input, can also\
    \ use `FS`.\n\n```bash\necho 'abcdefghij' | awk -v FS= '{print $3}'\nc\necho 'abcdefghij'\
    \ | awk -v FS= '{print $5}'\ne\n```\n\n## match\n\nThe `match` function is useful\
    \ to extract portion of input string matched by regexp. There are two ways to\
    \ get matched portion:\n\n* by using `substr` function along with special variables\
    \ `RSTART` and `RLENGTH`\n* by passing a third argument to `match` so that results\
    \ are available from array\n\nThe first argument to `match` is the input string\
    \ and second is regexp. If the match fails, then `RSTART` gets `0` and `RLENGTH`\
    \ gets `-1`. Return value is same as `RSTART`.\n\n```bash\ns='051 35 154 12 26\
    \ 98234'\n# using substr and RLENGTH\necho \"$s\" | awk 'match($0, /[0-9]{4}){print\
    \ substr($0, RSTART, RLENGTH)}'\n9823\n# using array, note that index 0 is used\
    \ here, not 1\necho \"$s\" | awk 'match($0, [0-9][0-9]{2}){print m[0]}'\n154\n\
    ```\n\nBoth the above examples can also easily solved using `FPAT` or `patsplit`.\
    \ `match` has an advantage when it comes to getting portions only capture groups.\
    \ The first element of array will still have the entire match. Second element\
    \ will contain portion by first group, third element will contain portion by second\
    \ group and so on. See also [stackoverflow: arithmetic replacement in a text file](https://stackoverflow.com/q/6224101/408205).\n\
    \n```bash\n# entire matched portion\necho 'foo=42, baz=314' | awk 'match($0, /baz=([0-9]+)/){print\
    \ m[0]}'\nbaz=314\n# matched portion of capture group\necho 'foo=42, baz=314'\
    \ | awk 'match($0, /baz=([0-9]+)/){print m[1]}'\n314\n```\n\nIf you need to get\
    \ matching portions for all the matches instead of just the first match, you can\
    \ use a loop and adjust the input string every iteration.\n\n```bash\n# extract\
    \ numbers only if it is followed by a comma\ns='42 foo-5, baz3; x-83, y-20: f12'\n\
    echo \"$s\" | awk '{while( match($0, /([0-9]+),, m ){print m[1]; $0=substr($0,\
    \ RSTART+RLENGTH)}'\n5\n```\n\n## index\n\nThe `index` function is useful when\
    \ you need to match a string literally in the given input string. This is similar\
    \ to `grep -F` functionality of matching fixed strings. The first argument to\
    \ this function is the input string and the second is the string to be matched\
    \ literally. The return value is the index of matching location and `0` if there\
    \ is no match.\n\n```bash\ncat eqns.txt\na=b,a-b=c,c*d\na+b,pi=3.14,5e12\ni*(t+9-g)/8,4-a+b\n\
    \ no output because the metacharacters aren't escaped\nawk '/i*(t+9-g)/' eqns.txt\n\
    # same as: grep -F 'i*(t+9-g)' eqns.txt\nawk 'index($0, \"i*(t+9-g)\")' eqns.txt\n\
    i*(t+9-g)/8,4-a+b\n# check only the last field\nawk -F, 'index($NF, \"a+b\")'\
    \ eqns.txt\ni*(t+9-g)/8,4-a+b\n# index not needed if entire field/line is being\
    \ compared\nawk -F, '$1==\"a+b\"' eqns.txt\na+b,pi=3.14,5e12\n```\n\nThe return\
    \ value is also useful to ensure match is found at specific positions only. For\
    \ example start or end of input string.\n\n```bash\n# start of string\nawk 'index($0,\
    \ \"a+b\")==1' eqns.txt\na+b,pi=3.14,5e12\n# end of string\nawk -v s=\"a+b\" 'index($0,\
    \ s)==length()-length(s)+1' eqns.txt\n```\n"
