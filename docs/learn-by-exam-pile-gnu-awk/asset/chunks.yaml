    ## ARGC and ARGV


    The `ARGC` special variable contains total number of arguments passed to the `awk`
    command, including `awk` itself as an argument. The `ARGV` special array contains
    the arguments themselves.


    ```

    [](#cb208-1)$ # note that index starts with ''0'' here

    [](#cb208-2)$ awk ''BEGIN{for(i=0; i<ARGC; i++) print ARGV[i]}'' f[1-3].txt greeting.txt

    [](#cb208-3)awk

    [](#cb208-4)f1.txt

    [](#cb208-5)f2.txt

    [](#cb208-6)f3.txt

    [](#cb208-7)greeting.txt

    ```


    Similar to manipulating `NF` and modifying `$N` field contents, you can change
    the values of `ARGC` and `ARGV` to control how the arguments should be processed.


    However, not all arguments are necessarily filenames. `awk` allows assigning variable
    values without `-v` option if it is done in the place where you usually provide
    file arguments. For example:


    ```

    [](#cb209-1)$ awk ''BEGIN{for(i=0; i<ARGC; i++) print ARGV[i]}'' table.txt n=5
    greeting.txt

    [](#cb209-2)awk

    [](#cb209-3)table.txt

    [](#cb209-4)n=5

    [](#cb209-5)greeting.txt

    ```


    In the above example, the variable `n` will get a value of `5` after `awk` has
    finished processing `table.txt` file. Here''s an example where `FS` is changed
    between two files.


    ```

    [](#cb210-1)$ cat table.txt

    [](#cb210-2)brown bread mat hair 42

    [](#cb210-3)blue cake mug shirt -7

    [](#cb210-4)yellow banana window shoes 3.14

    [](#cb210-5)$ cat books.csv

    [](#cb210-6)Harry Potter,Mistborn,To Kill a Mocking Bird

    [](#cb210-7)Matilda,Castle Hangnail,Jane Eyre

    [](#cb210-8)

    [](#cb210-9)$ # for table.txt, FS will be default value

    [](#cb210-10)$ # for books.csv, FS will be comma character

    [](#cb210-11)$ # OFS is comma for both files

    [](#cb210-12)$ awk -v OFS=, ''NF=2'' table.txt FS=, books.csv

    [](#cb210-13)brown,bread

    [](#cb210-14)blue,cake

    [](#cb210-15)yellow,banana

    [](#cb210-16)Harry Potter,Mistborn

    [](#cb210-17)Matilda,Castle Hangnail

    ```


    > ![info](media/file0.svg) See [stackoverflow: extract positions 2-7 from a fasta
    sequence](https://stackoverflow.com/a/64427745/4082052) for a practical example
    of changing field/record separators between the files being processed.


