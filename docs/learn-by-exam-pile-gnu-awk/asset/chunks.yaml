  trans: "\n\n```\n$ cat items.txt\napple   fig banana\n50      10  200\n\n# 这里分配了字段宽度，\n\
    # 额外的空格被放置在每个字段的末尾\nawk -v FIELDWIDTHS='8 4 6' '{print $2}' items.txt\nfig \n\
    10 \n# 注意字段内容也将包含空格\nawk -v FIELDWIDTHS='8 4 6' '{print \"[\" $2 \"]\"}' items.txt\n\
    [fig ]\n[10  ]\n```\n\n你可以选择性地在字段宽度前加上一个数字，表示要忽略的字符数。\n\n```\n# 第一个字段是 5 个字符\n\
    # 然后忽略前 3 个字符，第二个字段留 3 个字符\n# 然后忽略 1 个字符，第三个字段留 6 个字符\nawk -v FIELDWIDTHS='5 3:3\
    \ 1:6' '{print \"[\" $1 \"]\"}' items.txt\n[apple]\n[50   ]\nawk -v FIELDWIDTHS='5\
    \ 3:3 1:6' '{print \"[\" $2 \"]\"}' items.txt\n[fig]\n[10 ]\n```\n\n如果输入行的长度超过了指定的总宽度，多出的字符将被直接忽略。如果你想访问这些字符，可以使用\
    \ `*` 来表示最后一个字段。请参阅 [gawk 手册：FIELDWIDTHS](https://www.gnu.org/software/gawk/manual/gawk.html#Fields-with-fixed-data)\
    \ 以了解更多特殊边界情况。\n\n```\nawk -v FIELDWIDTHS='5 *' '{print \"[\" $1 \"]\"}' items.txt\n\
    [apple]\n[50   ]\n\nawk -v FIELDWIDTHS='5 *' '{print \"[\" $2 \"]\"}' items.txt\n\
    [   fig banana]\n[   10  200]\n```\n\n## 总结\n\n字段字段操作是 `awk` 最受欢迎的功能。本章讨论了将输入拆分为字段并对其处理的各种方法。在接后的章节中，还将讨论更多关于字段的示例。我强烈建议也阅读\
    \ [gawk 手册：Fields](https://www.gnu.org/software/gawk/manual/gawk.html#Fields)\
    \ 以获取更多关于字段处理的详细信息。\n\n下一章将讨论使用记录分隔符和相关特殊变量各种方法。\n\n## 练习\n\n**a)** 从每行输入中仅提取\
    \ `()` 或 `)(` 之间的内容。假设 `()` 字符每行只出现一次。\n\n```\n$ cat brackets.txt\nfoo blah blah(ice)\
    \ 123xyz$\n(almond-pista) choco\nyo )yoyo( yo\n\n$ awk ##### 在此处添加你的解决方案\nice\n\
    almond-pista\nyoyo\n```\n\n**b)** 对于输入文件 `scores.csv`，按所示格式提取 `Name` 和 `Physics`\
    \ 字段。\n\n```\n$ cat scores.csv\nName,Maths,Physics,Chemistry\nBlue,67,46,99\n\
    Lin,78,83,80\nEr,56,79,92\nCy,97,98,95\nOrt,68,72,66\nIth,100,100,100\n\n$ awk\
    \ ##### 在此处添加你的解决方案\nName:Physics\nBlue:46\nLin:83\nEr:79\nCy:98\nOrt:72\nIth:100\n\
    ```\n\n**c)** 对于输入文件 `scores.csv`，显示数学科目得分高于 `70` 的人员姓名。\n\n```\n$ awk ##### 在此处添加你的解决方案\n\
    Lin\nCy\nIth\n```\n\n**d)** 显示给定输入中单词字符的数量。这里的单词定义与正则表达式相同。你能构造一个使用 `gsub` 的解决方案，以及一个不使用替换替换的解决方案吗？\n\
    \n```\n$ echo 'hi there' | awk ##### 在此处添加你的解决方案\n7\n$ echo 'u-no;co_12:as' |\
