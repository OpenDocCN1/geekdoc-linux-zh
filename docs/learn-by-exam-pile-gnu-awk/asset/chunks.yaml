    The first argument to `sub` and `gsub` functions is the regexp to be matched against
    the input content. The second argument is the replacement string. String literals
    are specified within double quotes. In the above examples, `sub` and `gsub` are
    used inside a block as they aren''t intended to be used as a conditional expression.
    The `1` after the block is treated as a conditional expression as it is used outside
    a block. You can also use the variations presented below to get the same results.


    *   `awk ''{sub(/:/, "-")} 1''` is same as `awk ''{sub(/:/, "-"); print $0}''`

    *   You can also use `print` instead of `print $0` as `$0` is the default string


    > ![info](media/file0.svg) You might wonder why to use or learn `grep` and `sed`
    when you can achieve same results with `awk`. It depends on the problem you are
    trying to solve. A simple line filtering will be faster with `grep` compared to
    `sed` or `awk` because `grep` is optimized for such cases. Similarly, `sed` will
    be faster than `awk` for substitution cases. Also, not all features easily translate
    among these tools. For example, `grep -o` requires lot more steps to code with
    `sed` or `awk`. Only `grep` offers recursive search. And so on. See also [unix.stackexchange:
    When to use grep, sed, awk, perl, etc](https://unix.stackexchange.com/q/303044/109046).


    ## Field processing


    As mentioned before, `awk` is primarily used for field based processing. Consider
    the sample input file shown below with fields separated by a single space character.


    > ![info](media/file0.svg) The [learn_gnuawk repo](https://github.com/learnbyexample/learn_gnuawk/tree/master/example_files)
    has all the files used in examples.


    ```

    [](#cb8-1)$ cat table.txt

    [](#cb8-2)brown bread mat hair 42

    [](#cb8-3)blue cake mug shirt -7

    [](#cb8-4)yellow banana window shoes 3.14

    ```


    Here''s some examples that is based on specific field rather than entire line.
    By default, `awk` splits the input line based on spaces and the field contents
    can be accessed using `$N` where `N` is the field number required. A special variable
    `NF` is updated with the total number of fields for each input line. There''s
    more details to cover, but for now this is enough to proceed.


    ```

    [](#cb9-1)$ # print the second field of each input line

    [](#cb9-2)$ awk ''{print $2}'' table.txt

    [](#cb9-3)bread

    [](#cb9-4)cake

    [](#cb9-5)banana

    [](#cb9-6)

    [](#cb9-7)$ # print lines only if the last field is a negative number

    [](#cb9-8)$ # recall that the default action is to print the contents of $0

    [](#cb9-9)$ awk ''$NF<0'' table.txt

    [](#cb9-10)blue cake mug shirt -7

    [](#cb9-11)

    [](#cb9-12)$ # change ''b'' to ''B'' only for the first field

    [](#cb9-13)$ awk ''{gsub(/b/, "B", $1)} 1'' table.txt

    [](#cb9-14)Brown bread mat hair 42

    [](#cb9-15)Blue cake mug shirt -7

    [](#cb9-16)yellow banana window shoes 3.14

    ```


    ## awk one-liner structure


    The examples in previous sections used a few different ways to construct a typical
    `awk` one-liner. If you haven''t yet grasped the syntax, this generic structure
    might help:


    `awk ''cond1{action1} cond2{action2} ... condN{actionN}''`


    If a condition isn''t provided, the action is always executed. Within a block,
    you can provide multiple statements separated by semicolon character. If action
    isn''t provided, then by default, contents of `$0` variable is printed if the
    condition evaluates to `true`. When action isn''t present, you can use semicolon
    to terminate a condition and start another `condX{actionX}` snippet.


    Note that multiple blocks are just a syntactical sugar. It helps to avoid explicit
    use of `if` control structure for most one-liners. The below snippet shows the
    same code with and without `if` structure.


    ```

    [](#cb10-1)$ awk ''{

    [](#cb10-2) if($NF < 0){

    [](#cb10-3) print $0

    [](#cb10-4) }

    [](#cb10-5) }'' table.txt

    [](#cb10-6)blue cake mug shirt -7

    [](#cb10-7)

    [](#cb10-8)$ awk ''$NF<0'' table.txt

    [](#cb10-9)blue cake mug shirt -7

    ```


    You can use a `BEGIN{}` block when you need to execute something before the input
    is read and a `END{}` block to execute something after all of the input has been
    processed.


    ```

    [](#cb11-1)$ seq 2 | awk ''BEGIN{print "---"} 1; END{print "%%%"}''

    [](#cb11-2)---

    [](#cb11-3)1

    [](#cb11-4)%%%

    ```


    There are some more types in coming chapters. See [awk manual: Operators](https://www.gnu.org/software/gawk/manual/gawk.html#Operators)
    for details. [awk manual: Values and Conditions](https://www.gnu.org/software/gawk/manual/gawk.html#Values-and-Conditions)
    for more.


    ## Strings and Numbers


    Some examples so far have used string and numeric. As mentioned, `awk` tries to
    convert string to number. String literals are represented inside double quotes.
    Numbers can be integers or floating point. Scientific notation is allowed. See
    [awk manual: Converts Strings and Numbers](https://www.gnu.org/software/gawk/manual/gawk.html#Strings-and-Numbers)
    for details.


    ```

    [](#cb12-1)$ # same as: awk ''BEGIN{print "hi"}''

    [](#cb12-2)hi

    [](#cb12-3)

    ```


    You can also save these in variables and use later.


    ```

    [](#cb13-1)$ # have used: awk ''BEGIN{a=5}''

    [](#cb13-2)5

    [](#cb13-3)

    ```


    If uninitialized variable is used, it will act as empty string.


    ```

    [](#cb14-1)$ # for example: awk ''BEGIN{s1="con"; s2="cat"; print s1 s2}''

    [](#cb14-2)concat

    [](#cb14-3)

    ```


    If the string starts with a valid number, it will behave as `0`.


    ```

    [](#cb15-1)$ # same as: awk ''BEGIN{sum=0}''

    [](#cb15-2)0

    [](#cb15-3)

    ```


    ## Arrays


    Arrays in `awk` are associative, meaning they are key-value pairs. The keys can
    be numbers or strings, but numbers get converted to strings internally. They can
    be multi-dimensional as well. There will be plenty of array examples in later
    chapters in relevant context. See [gawk manual: Arrays](https://www.gnu.org/software/gawk/manual/gawk.html#Arrays)
    for complete details and gotchas.


    ```

    [](#cb16-1)$ # assigning an array and accessing an element based on string key

    [](#cb16-2)$ awk ''BEGIN{student["id"] = 101; student["name"] = "Joe";

    [](#cb16-3) print student["name"]}''

    [](#cb16-4)Joe

    [](#cb16-5)

    [](#cb16-6)$ # checking if a key exists

    [](#cb16-7)$ awk ''BEGIN{student["id"] = 101; student["name"] = "Joe";

    [](#cb16-8) if("id" in student) print "Key found"}''

    [](#cb16-9)Key found

    ```

