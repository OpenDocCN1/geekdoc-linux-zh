    \ chapter will give an overview of `awk` syntax and some examples to show what\
    \ kind of problems you could solve using `awk`. These features will be covered\
    \ in depth in later chapters, but don't go skipping this chapter.\n\n## Filtering\n\
    \n`awk` provides filtering capabilities like those supported by `grep` and `sed`\
    \ plus some nifty features of its own. And similar to many command line utilities,\
    \ `awk` can accept input from both `stdin` and files.\n\n```\n[](#cb4-1)$ # sample\
    \ stdin data\n[](#cb4-2)$ printf 'gate\\napple\\nwhat\\nkite\\n'\n[](#cb4-3)gate\n\
    [](#cb4-4)apple\n[](#cb4-5)what\n[](#cb4-6)kite\n[](#cb4-7)\n[](#cb4-8)$ # same\
    \ as: grep 'at' and sed -n '/at/p'\n[](#cb4-9)$ # print all lines containing 'at'\n\
    [](#cb4-10)$ printf 'gate\\napple\\nwhat\\nkite\\n' | awk '/at/'\n[](#cb4-11)gate\n\
    [](#cb4-12)what\n[](#cb4-13)\n[](#cb4-14)$ # same as: grep -v 'e' and sed -n '/e/!p'\n\
    [](#cb4-15)$ # print all lines NOT containing 'e'\n[](#cb4-16)$ printf 'gate\\\
    napple\\nwhat\\nkite\\n' | awk '!/e/'\n[](#cb4-17)what\n```\n\nSimilar to `grep`\
    \ and `sed`, by default `awk` automatically loops over input content line by line.\
    \ You can then use `awk`'s programming instructions to process those lines. As\
    \ `awk` is primarily used from the command line, many shortcuts are available\
    \ to reduce the amount of typing needed.\n\nIn the above examples, a regular expression\
    \ (defined by the pattern between a pair of forward slashes) has been used to\
    \ filter the input. Regular expressions (regexp) will be covered in detail in\
    \ the next chapter, only simple string value is used here without any special\
    \ characters. The full syntax is `string ~ /regexp/` to check if the given string\
    \ matches the regexp and `string !~ /regexp/` to check if doesn't match. When\
    \ the string isn't specified, the test is performed against a special variable\
    \ `$0`, which has the contents of the input line. The correct term would be input\
    \ **record**, but that's a discussion for a later chapter.\n\nAlso, in the above\
    \ examples, only the filtering condition was given and nothing about what should\
    \ be done. By default, when the condition evaluates to `true`, the contents of\
    \ `$0` is printed. Thus:\n\n*   `awk '/regexp/'` is a shortcut for `awk '$0 ~\
    \ /regexp/{print $0}'`\n\n*   `awk '!/regexp/'` is a shortcut for `awk '$0 !~\
    \ /regexp/{print $0}'`\n\n```\n[](#cb5-1)$ # same as: awk '/at/'\n[](#cb5-2)$\
    \ printf 'gate\\napple\\nwhat\\nkite\\n' | awk '$0 ~ /at/{print $0}'\n[](#cb5-3)gate\n\
    [](#cb5-4)what\n[](#cb5-5)\n[](#cb5-6)$ # same as: awk '!/e/'\n[](#cb5-7)$ printf\
    \ 'gate\\napple\\nwhat\\nkite\\n' | awk '$0 !~ /e/{print $0}'\n[](#cb5-8)what\n\
    ```\n\nIn the above examples, `{}` is used to specify a block of code to be executed\
    \ when the condition that precedes the block evaluates to `true`. One or more\
    \ statements can be given separated by `;` character. You'll see such examples\
    \ and learn more about `awk` syntax later.\n\nAny non-zero numeric value and non-empty\
    \ string value is considered as `true` when that value is used as a conditional\
    \ expression. Idiomatically, `1` is used to denote a `true` condition in one-liners\
    \ as a shortcut to print the contents of `$0`.\n\n```\n[](#cb6-1)$ # same as:\
    \ printf 'gate\\napple\\nwhat\\nkite\\n' | cat\n[](#cb6-2)$ # same as: awk '{print\
    \ $0}'\n[](#cb6-3)$ printf 'gate\\napple\\nwhat\\nkite\\n' | awk '1'\n[](#cb6-4)gate\n\
    [](#cb6-5)apple\n[](#cb6-6)what\n[](#cb6-7)kite\n```\n\n## Substitution\n\n`awk`\
    \ has three functions to cover search and replace requirements. Two of them are\
    \ shown below. The `sub` function replaces only the first match whereas `gsub`\
    \ function replaces all the matching occurrences. By default, these functions\
    \ operate on `$0` when the input string isn't provided. Both `sub` and `gsub`\
    \ modifies the input source on successful substitution.\n\n```\n[](#cb7-1)$ #\
    \ for each input line, change only first ':' to '-'\n[](#cb7-2)$ # same as: sed\
    \ 's/:/-/'\n[](#cb7-3)$ printf '1:2:3:4\\na:b:c:d\\n' | awk '{sub(/:/, \"-\")}\
    \ 1'\n[](#cb7-4)1-2:3:4\n[](#cb7-5)a-b:c:d\n[](#cb7-6)\n[](#cb7-7)$ # for each\
    \ input line, change all ':' to '-'\n[](#cb7-8)$ # same as: sed 's/:/-/g'\n[](#cb7-9)$\
