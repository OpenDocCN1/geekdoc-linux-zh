    ## Case insensitive matching


    Unlike `sed` or `perl`, regular expressions in `awk` do not directly support the
    use of flags to change certain behaviors. For example, there is no flag to force
    the regexp to ignore case while matching.


    The `IGNORECASE` special variable controls case sensitivity, which is `0` by default.
    By changing it to some other value (which would mean `true` in conditional expression),
    you can match case insensitively. The `-v` command line option allows you to assign
    a variable before input is read. The `BEGIN` block is also often used to change
    such settings.


    ```

    [](#cb63-1)$ printf ''Cat\ncOnCaT\nscatter\ncot\n'' | awk -v IGNORECASE=1 ''/cat/''

    [](#cb63-2)Cat

    [](#cb63-3)cOnCaT

    [](#cb63-4)scatter

