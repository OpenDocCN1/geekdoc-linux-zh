    [](#cb98-3)3

    [](#cb98-4)$ echo ''Read Eat Sleep'' | awk -v IGNORECASE=1 -v FPAT=''e'' ''{print
    NF}''

    [](#cb98-5)4

    [](#cb98-6)$ echo ''Read Eat Sleep'' | awk -v IGNORECASE=1 -v FPAT=''[e]'' ''{print
    NF}''

    [](#cb98-7)4

    ```


    ## FIELDWIDTHS


    `FIELDWIDTHS` 是另一个允许定义字段内容的特性。正如名称所示，你必须指定每个字段的字符数。这种方法适用于处理固定宽文件输入，特别是当它们可能包含空字段时。


