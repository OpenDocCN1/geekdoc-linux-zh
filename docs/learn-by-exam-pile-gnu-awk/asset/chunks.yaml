    # Control Structures


    You''ve already seen various examples requiring conditional expressions. This
    chapter will revisit `if-else` control structure along with the ternary operator.
    Then you will see some examples with explicit loops (recall that `awk` is already
    looping over input records). Followed by keywords that control loop flow. Most
    of the syntax is very similar to the `C` language.


    ## if-else


    Mostly, when you need to use `if` control structure, you can get away with using
    `condX{actionX}` format in `awk` one-liners. But sometimes, you need additional
    condition checking within such action blocks. Or, you might need it inside loops.
    The syntax is `if(cond){action}` where the braces are optional if you need only
    one statement. `if` can be optionally followed by multiple `else if` conditions
    and a final `else` condition. These can also be nested as needed.


    ```bash

    # print all lines starting with ''b''

    $ # additionally, if last column is > 0, print some info

    $ awk ''/^b/{print; if($NF>0) print "------"}'' table.txt

    brown mat hair 42

    ------

    blue cake shirt -7

    $ same as above, includes ''else'' as well

    $ awk ''/^b/{print; if($NF>0) print "------"; else print "=="}'' table.txt

    brown mat hair 42

    ------

    blue cake shirt -7

    ```


    The ternary operator often reduces the need for single `if-else` cases.


    ```bash

    $ same as: awk ''{if(NR%3) ORS="-" else ORS=RS}''

    $ seq 6 | awk ''{ORS = NR%3 ? "-" : RS}''

    1-2-3-4-56

    # note that parentheses is necessary for print in this case

    $ awk ''/^b/{print; print($NF>0 ? "------" : "=="}'' table.txt

    brown mat hair 42

    ------

    blue cake shirt -7

    ======

    ```


    > ![info] See also [stackoverflow: finding min and max value of a column](https://stackoverflow.com/a/297842).


    > ![info] See also [gawk manual: switch](https://www.gnu.org/software/gawk/manual.html#Switch-Statement).


    ## loops


    `for` loops are handy when you are working with arrays. Also for processing input
    fields, since `$N` syntax allows passing expression instead of fixed value.


    ```bash

    $ awk ''BEGIN{for(i=2; i<7; i+=2) print i}''

    2

    4

    6

    # looping each field

    $ awk -v OFS=, ''{for(i=1; i<=NF; i++) if($i ~ /^[bm]/) $i="["i"]"}'' 1'' table.txt

    brown,mat,hair,42

    blue,cake,shirt,-7

    yellow,banana,shoes,3.14

    ```


    Here''s an example of looping over a dynamically constructed array.


    ```bash

    $ cat marks.txt

    Dept    Name    Marks

    ECE     Raj     53

    ECE     Joel    72

    EEE     Moi     68

    CSE     Surya   81

    EEE     Tia     59

    ECE     Om      92

    CSE     Amy     67

    # average marks for each department

    $ awk ''NR>1{d[$1]+=$3; c[$1]++} END{for(k in d) print k, d[k]/c[k]}'' marks.txt

    ECE 72.3333

    EEE 63.5

    CSE 74

    ```


    You can use `break` and `continue` to alter the normal flow of loops. `break`
    will cause the current loop to quit immediately without processing the remaining
    statements and iterations. `continue` will skip the remaining statements in the
    loop and start next iteration.


    ```bash

    $ awk -v OFS=, ''{for(i=1; i<=NF; i++) if($i ~ /b/){NF=i; break}} 1'' table.txt

    brown

    blue

    yellow,banana

    ```


    > ![info] See also [stackoverflow: find missing numbers from sequential list](https://stackoverflow.com/q/38491676/408205).


    `awk` supports `while` and `do-while` loop mechanisms as well.


    ```bash

    $ awk ''BEGIN{i=6; while(i>0){print i; i-=2}}''

    6

    4

    2

    # recursive substitution

    $ echo ''titillate'' | awk ''{while(gsub(/til/, "")) print}''

    tilate

    ate

    $ echo ''titillate'' | awk ''{do{print} while(gsub(/til/, ""))}''

    titillate

    tilate

    ate

    ```


    ## next


    `next` is similar to `continue` statement but it acts on the default loop that
    goes through the input records. It doesn''t affect `BEGIN` or `END` blocks as
    they are outside the record looping. When `next` is executed, rest of the statements
    will be skipped and next input record will be fetched for processing.


    ```bash

    $ awk ''/\<par/{print "%% " $0; next} {print /s/ ? "X" : "Y"}'' word_anchors.txt

    %% sub par

    X

    Y

    X

    %% cart part tart mart

    ```


    You''ll see more examples with `next` in coming chapters.


    ## exit

