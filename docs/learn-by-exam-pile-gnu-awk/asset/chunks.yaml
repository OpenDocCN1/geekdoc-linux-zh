    # Installation and Documentation


    The command name `awk` is derived from its developers — Alfred V. Aho, Peter J.
    Weinberger, and Brian W. Kernighan. Over the years, it has been adapted and modified
    by various developers. See [gawk manual: History](https://www.gnu.org/software/gawk/manual.html#History)
    for more details. This chapter will show how to install or upgrade `awk` followed
    by details related to documentation.


    ## Installation


    If you are on a Unix like system, you are most likely to have some version of
    `awk` installed. This book is primarily for `GNU awk`. As there are syntax and
    feature differences between various implementations, please make sure to follow
    along with what is presented here. To install newer or particular version, visit
    [gnu: software gawk](https://www.gnu.org/software/gawk/).


    ```

    # use a dir, say ~/Downloads/awk_install before following the steps below

    $ wget https://ftp.gnu.org/gnu/gawk/gawk-5.1.0.tar.xz

    $ tar -Jxf gawk-5.1.0.tar.xz

    $ cd gawk-5.1.0/

    $ ./configure

    $ make

    $ sudo make install


    $ type -a awk

    awk is /usr/local/bin/awk

    awk is /usr/bin/awk

    $ awk --version | head -n1

    GNU Awk 5.1.0, API: 3.0

    ```

