    ## Strings and Numbers


    Some examples so far have already used string and numeric literals. As mentioned
    earlier, `awk` tries to provide a concise way to construct a solution from the
    command line. The data type of a value is determined based on the syntax used.
    String literals are represented inside double quotes. Numbers can be integers
    or floating point. Scientific notation is allowed as well. See [gawk manual: Constant
    Expressions](https://www.gnu.org/software/gawk/manual/gawk.html#Constants) for
    more details.


    ```

    [](#cb12-1)$ # BEGIN{} is also useful to write awk program without any external
    input

    [](#cb12-2)$ awk ''BEGIN{print "hi"}''

    [](#cb12-3)hi

    [](#cb12-4)

    [](#cb12-5)$ awk ''BEGIN{print 42}''

    [](#cb12-6)42

    [](#cb12-7)$ awk ''BEGIN{print 3.14}''

    [](#cb12-8)3.14

    [](#cb12-9)$ awk ''BEGIN{print 34.23e4}''

    [](#cb12-10)342300

    ```


    You can also save these literals in variables and use it later. Some variables
    are predefined, for example `NF`.


    ```

    [](#cb13-1)$ awk ''BEGIN{a=5; b=2.5; print a+b}''

    [](#cb13-2)7.5

    [](#cb13-3)

    [](#cb13-4)$ # strings placed next to each other are concatenated

    [](#cb13-5)$ awk ''BEGIN{s1="con"; s2="cat"; print s1 s2}''

    [](#cb13-6)concat

    ```


    If uninitialized variable is used, it will act as empty string in string context
    and `0` in numeric context. You can force a string to behave as a number by simply
    using it in an expression with numeric values. You can also use unary `+` or `-`
    operators. If the string doesn''t start with a valid number (ignoring any starting
    whitespaces), it will be treated as `0`. Similarly, concatenating a string to
    a number will automatically change the number to string. See [gawk manual: How
    awk Converts Between Strings and Numbers](https://www.gnu.org/software/gawk/manual/gawk.html#Strings-And-Numbers)
    for more details.


    ```

    [](#cb14-1)$ # same as: awk ''BEGIN{sum=0} {sum += $NF} END{print sum}''

    [](#cb14-2)$ awk ''{sum += $NF} END{print sum}'' table.txt

    [](#cb14-3)38.14

    [](#cb14-4)

    [](#cb14-5)$ awk ''BEGIN{n1="5.0"; n2=5; if(n1==n2) print "equal"}''

    [](#cb14-6)$ awk ''BEGIN{n1="5.0"; n2=5; if(+n1==n2) print "equal"}''

    [](#cb14-7)equal

    [](#cb14-8)$ awk ''BEGIN{n1="5.0"; n2=5; if(n1==n2".0") print "equal"}''

    [](#cb14-9)equal

    [](#cb14-10)

    [](#cb14-11)$ awk ''BEGIN{print 5 + "abc 2 xyz"}''

    [](#cb14-12)5

    [](#cb14-13)$ awk ''BEGIN{print 5 + " \t 2 xyz"}''

    [](#cb14-14)7

    ```


    ## Arrays


    Arrays in `awk` are associative, meaning they are key-value pairs. The keys can
    be numbers or strings, but numbers get converted to strings internally. They can
    be multi-dimensional as well. There will be plenty of array examples in later
    chapters in relevant context. See [gawk manual: Arrays](https://www.gnu.org/software/gawk/manual/gawk.html#Arrays)
    for complete details and gotchas.


    ```

    [](#cb15-1)$ # assigning an array and accessing an element based on string key

    [](#cb15-2)$ awk ''BEGIN{student["id"] = 101; student["name"] = "Joe";

    [](#cb15-3) print student["name"]}''

    [](#cb15-4)Joe

    [](#cb15-5)

    [](#cb15-6)$ # checking if a key exists

    [](#cb15-7)$ awk ''BEGIN{student["id"] = 101; student["name"] = "Joe";

    [](#cb15-8) if("id" in student) print "Key found"}''

    [](#cb15-9)Key found

    ```


