    [](#cb57-7)$ # same as: sed -E ''s/[^:]+/X/3''

    [](#cb57-8)$ # replace only third field with ''X''

    [](#cb57-9)$ echo ''foo:123:bar:baz'' | awk ''{print gensub(/[^:]+/, "X", 3)}''

    [](#cb57-10)foo:123:X:baz

