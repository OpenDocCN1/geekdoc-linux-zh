    这里是一些使用基于正则表达式的字段分隔符的示例。传递给 `-F` 或 `FS` 的值被视为字符串，然后转换为正则表达式。因此，你需要使用 `\\` 而不是
    `\` 来表示反斜符字符。好消息是，对于同时也是正则表达式元字符的单字符，它们将作为字面字符处理，你不需要对它们进行转义。


    ```

    [](#cb88-1)$ echo ''Sample123string42with777numbers'' | awk -F''[0-9]+'' ''{print
    $2}''

    [](#cb88-2)string

    [](#cb88-3)$ echo ''Sample123string42with777numbers'' | awk -F''[a-zA-Z]+'' ''{print
    $2}''

    [](#cb88-4)123

    [](#cb88-5)

    [](#cb88-6)$ # 注意这里使用 \\W 来表示 \W

    [](#cb88-7)$ echo ''load;err_msg--\ant,r2..not'' | awk -F''\\W+'' ''{print $3}''

    [](#cb88-8)ant

    [](#cb88-9)

    [](#cb88-10)$ # 等于：awk -F''\\.'' ''{print $2}''

    [](#cb88-11)$ echo ''hi.bye.hello'' | awk -F. ''{print $2}''

    [](#cb88-12)bye

    [](#cb88-13)

    [](#cb88-14)$ # 统计每行输入的元音数量

    [](#cb88-15)$ printf ''cool\nnice car\n'' | awk -F''[aeiou]'' ''{print NF-1}''

    [](#cb88-16)2

    [](#cb88-17)3

    ```


    > ![warning](img/file1.svg) `FS` 的默认值是单个空格字符。因此，如果你将输入字段分隔符设置为单个空格，那么它将与你在上一节中讨论默认拆分方式相同。如果你想覆盖这一行为，可以在字符类内部使用空格。


    ```

    [](#cb89-1)$ # 等于：awk ''{print NF}''

    [](#cb89-2)$ echo ''   a   b   c   '' | awk -F'' '' ''{print NF}''

    [](#cb89-3)3

    [](#cb89-4)$ # 这里有 12 个空格字符，因此有 13 个字段

    [](#cb89-5)$ echo ''   a   b   c   '' | awk -F''[ ]'' ''{print NF}''

    [](#cb89-6)13

    ```


    > ![warning](img/file1.svg) 如果设置了 `IGNORECASE`，它也会影响字段分割。但字段分隔符为单个字符的情况除外，可以使用字符类来规避此问题。


    ```

    [](#cb90-1)$ echo ''RECONSTRUCTED'' | awk -F''[aeiou]+'' -v IGNORECASE=1 ''{print
    $1}''

    [](#cb90-2)R

    [](#cb90-3)

    [](#cb90-4)$ # 当 FS 为单个字符时

    [](#cb90-5)$ echo ''RECONSTRUCTED'' | awk -F''e'' -v IGNORECASE=1 ''{print $1}''

    [](#cb90-6)RECONSTRUCTED

    [](#cb90-7)$ echo ''RECONSTRUCTED'' | awk -F''[e]'' -v IGNORECASE=1 ''{print $1}''

    [](#cb90-8)R

    ```


    ## 输出字段分隔符


    `OFS` 特殊变量控制输出字段分隔符。`OFS` 用于传递给 `print` 函数的多个参数之间的字符串。当由于更改字段内容而需要重构 `$0` 时，也会使用它。`OFS`
    的默认值是单个空格字符，就像 `FS` 一样。不过没有命令行选项，你必须直接修改 `OFS`。


    ```

    [](#cb91-1)$ # 打印第一和第三字段，OFS 用于连接这些值

    [](#cb91-2)$ # 注意使用逗号来分隔 print 参数

    [](#cb91-3)$ awk ''{print $1, $3}'' table.txt

    [](#cb91-4)brown mat

    [](#cb91-5)blue mug

    [](#cb91-6)yellow window

    [](#cb91-7)

    [](#cb91-8)$ # 相同的 FS 和 OFS

    [](#cb91-9)$ echo ''goal:amazing:whistle:kwality'' | awk -F: -v OFS=: ''{print
    $2, $NF}''

    [](#cb91-10)amazing:kwality

    [](#cb91-11)$ echo ''goal:amazing:whistle:kwality'' | awk ''BEGIN{FS=OFS=":"}
    {print $2, $NF}''

    [](#cb91-12)amazing:kwality

    [](#cb91-13)

    [](#cb91-14)$ # FS 和 OFS 的值不同

    [](#cb91-15)$ echo ''goal:amazing:whistle:kwality'' | awk -F: -v OFS=- ''{print
    $2, $NF}''

    [](#cb91-16)amazing-kwality

    ```


    这里是更改字段内容后打印 `$0` 的示例。


    ```

    [](#cb92-1)$ echo ''goal:amazing:whistle:kwality'' | awk -F: -v OFS=: ''{$2 =
    42}''

    [](#cb92-2)goal:42:whistle:kwality

    [](#cb92-3)$ echo ''goal:amazing:whistle:kwality'' | awk -F: -v OFS=, ''{$2 =
    42}''

    [](#cb92-4)goal,42,whistle,kwality

    [](#cb92-5)

    [](#cb92-6)$ # 记得开头/结尾的空格在默认 FS 下会被修剪

    [](#cb92-7)$ echo ''   a   b   c   '' | awk ''{$NF = "last"}''

    [](#cb92-8)a last

    ```


    有时你想用新的 `OFS` 打印 `$0` 的内容，但并不想更改字段内容。在这种情况下，你可以将字段值赋值给自己，以强制重构 `$0`。


    ```

    [](#cb93-1)$ # 没有变化，因为没有触发重构

    [](#cb93-2)$ echo ''Sample123string42with777numbers'' | awk -F''[0-9]+'' -v OFS=,
    ''{$1}''

    [](#cb93-3)string

    [](#cb93-4)$ # 将字段赋值给自身

    [](#cb93-5)$ echo ''Sample123string42with777numbers'' | awk -F''[0-9]+'' -v OFS=,
    ''{$1=$1}''

    [](#cb93-6)string42with777numbers

    ```


    ## 操作 NF


    `NF` 值也会重构 `$0`。


    ```

    [](#cb94-1)$ # 减少字段

    [](#cb94-2)$ echo ''goal:amazing:whistle:kwality'' | awk -F: -v OFS=: ''{NF--}''

    [](#cb94-3)goal:amazing

    [](#cb94-4)$ # 增加字段

    [](#cb94-5)$ echo echo ''goal:amazing:whistle:kwality'' | awk -F: -v OFS=: ''{NF++}''

    [](#cb94-6)goal:amazing:whistle:kwality:

    ```


    `FS` 允许定义输入分隔符。相比之下，`FPAT`（字段模式）允许定义字段由什么组成。


    ```

    [](#cb95-1)$ s=''Sample123string42with777numbers''

    [](#cb95-2)$ # 定义连续数字为字段

    [](#cb95-3)$ echo "$s" | awk -v FPAT=''[0-9]+'' ''{print $1}''

    [](#cb95-4)2

    [](#cb95-5)$ # 定义连续字母为字段

    [](#cb95-6)$ echo "$s" | awk -v FPAT=''[a-zA-Z]+'' -v OFS=, ''{$1}''

    [](#cb95-7)string

    ```


    `FPAT` 通常用于包含分隔符字符的 `csv` 输入。例如，当字段包含嵌入的逗号时。


    ```

    [](#cb96-1)$ s=''eagle,"42",frog''

    [](#cb96-2)$ # 仅使用逗号作为分隔符是不够的

    [](#cb96-3)$ echo "$s" | awk -F, ''{print $2}''

    [](#cb96-4)"42

    ```


    对于这种简单的 `csv` 输入，`FPAT` 帮助定义以双引号开头结尾或包含非逗号字符的字段。


    ```

    [](#cb97-1)$ s=''eagle,,frog''

    [](#cb97-2)$ # 使用 * 代替 + 以允许空字段

    [](#cb97-3)$ echo "$s" | awk -v FPAT=''"[^"]*"|[^,]*'' ''{print $2}''

    [](#cb97-4),

    ```


    > ![warning](img/file1.svg) 以上方法并不适用于所有的 `csv` 文件，例如当字段包含转义引号、换行符等时。此类情况请参考 [stackoverflow:
    如何使用 awk 高效地解析 CSV?](https://stackoverflow.com/q/4542053/408252)。你也可以使用 Perl、Python、Ruby
    等语言，它们自带标准的 `csv` 解析库，或者可以轻松访问第三方解决方案。还有专门的命令行工具，如 [xsv](https://github.com/BurntSushi/xsv)。


