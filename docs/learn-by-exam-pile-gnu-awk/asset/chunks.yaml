  trans: "\n\n```bash\nawk -v IGNORECASE=1 -v RS='error:' 'NR==1' report.log\nblah\
    \ blah \n# when RS is a single character\nawk -v IGNORECASE=1 -v RS='e' 'NR==1'\
    \ report.log\nblah blah Error: s\nawk -v IGNORECASE=1 -v RS='[e]' 'NR==1' report.log\n\
    blah blah \n```\n\n> ![warning](img/file1.svg) 文本文件的默认换行符在不同平台之间有所不同。例如，从网上下载的文本或源自\
    \ Windows 系统的文件通常以回车符和换行符结尾。因此，对于此类文件，你可能需要使用 `RS='\\r\\n'`。有关详细的讨论和解决方法，请参阅 [stackoverflow:\
    \ Why does my tool overwrite itself and how do I fix it?](https://stackoverflow.com/q/45772525/4082052)。\n\
    \n## 输出记录分隔符 (Output record separator)\n\n特殊变量 `ORS` 用于输出记录分隔符。`ORS` 是在每次调用 `print`\
    \ 函数时添加到末尾的字符串。`ORS` 的默认值是一个换行符，这与 `RS` 相同。\n\n```bash\n# 将 NUL 记录分隔符改为点和换行符\n\
    printf 'foo\\0bar\\0' | awk -v RS='\\0' -v ORS='.\\n' '1'\nfoo.\nbar.\n\ncat msg.txt\n\
    Hello there.\nIt will rain to-\nday. Have a safe\nand pleasant jou-\nrney.\n#\
    \ 此处 ORS 为空字符串\nawk -v RS='-\\n' -v ORS= '1' msg.txt\nHello there.\nIt will rain\
    \ today. Have a safe\nand pleasant journey.\n```\n\n> ![info](img/file0.svg) 注意\
    \ `$0` 变量是在移除由 `RS` 匹配的尾部字符后赋值的。因此，你无法直接用 `sub` 等函数操作这些字符。对于不自动剥离记录分隔符的工具（如 `perl`），之前的示例可以通过\
    \ `perl -pe 's/-\\n//' msg.txt` 来解决。\n\n很多时候，你需要根据输入记录的内容或其他条件来更改 `ORS`。三元运算符\
    \ `cond ? expr1 : expr2` 经常用于此类场景。下面的示例假设输入是均匀整除的，如果不是这种情况，你必须添加更多逻辑。\n\n```bash\n\
    # 在这里也可以 RS 代替 \"\\n\"\nseq 6 | awk '{ORS = NR%3 ? \"-\" : \"\\n\"} 1'\n1-2-3\n\
    4-5-6\n```\n\n> ![info](img/file0.svg) 如果输入的最后一行没有以输入记录分隔符结束，那么在使用 `print` 时，它可能会被加到输出中，因为\
    \ `ORS` 会被追加在末尾。\n\n```bash\n# 此处输入的最后一行没有以换行符结束\n# 但在使用 'print' 时会通过 ORS 被添加\n\
    printf '1\\n2' | awk '1; END{print 3}'\n1\n2\n3\n```\n\n## 正则 RS 和 RT (Regexp\
    \ RS and RT)\n\n如前所述，传递给 `RS` 的值被视为字符串字量量然后转换为正则表达式。这里是一些示例。\n\n```bash\n# 将输入记录分隔符设置为一个或多个数字字符\n\
    # 打印包含 'i' 和 't' 的记录\nprintf 'Sample123string42with777numbers' | awk -v RS='[0-9]+'\
    \ '/i/ && /t/'\nstring\nwith\n\n# 类似于 FS，传递给 RS 的值是字符串字面量\n# 然后被转换为正则表达式，因此这里需要用\
    \ \\\\ 而不是 \\\nprintf 'load;err_msg--ant,r2..not' | awk -v RS='\\\\W+' '/an/'\n\
    ant\n```\n\n> ![info](img/file0.svg) 如果 `RS` 从输入开始处匹配，则第一条记录将为空。然而，如果 `RS` 匹配到输入文件的最后一个字符，则最后一条不会有空记录。这与\
    \ `FS` 在匹配到最后一个字符时的行为不同。\n\n```bash\n# 第一条记录为空，最后一条记录为换行符\n# 将 'echo' 改为 'printf'\
    \ 查看变化\necho '123string42with777' | awk -v RS='[0-9]+' '{print NR $0}'\n1 [string]\n\
    2 [with]\n3 [4]\nprintf '123string42with777' | awk -v FS='[0-9]+' '{print NF}'\n\
    4\nprintf '123string42with777' | awk -v RS='[0-9]+' 'END{print NR}'\n3\n```\n\n\
    特殊变量 `RT` 包含了由 `RS` 匹配的文本。该变量会在每个输入记录处更新。\n\n```bash\n# 打印记录号和该记录的 RT 值\n# 最后一条记录\
    \ RT 为空，因为它以数字结尾\necho 'Sample123string42with777' | awk -v RS='[0-9]+' '{print\
    \ NR, RT}'\n1 123\n2 42\n3 777\n4 \n```\n\n## 段落模式 (Paragraph mode)\n\n作为一个特殊情况，当\
    \ `RS` 设置为空字符串时，一个或多个连续的空行被用作记录分隔符。考虑以下示例：\n\n```bash\ncat programming_quotes.txt\n\
    Debugging is twice as hard as writing the code in the first place.\nTherefore,\
    \ if you write the code as cleverly as possible, you are,\nby definition, not\
    \ smart enough to debug it by Brian W. Kernighan\nSome people, when confronted\
    \ with a problem, think - I know, I will\nuse regular expressions. Now they have\
    \ two problems by Jamie Zawinski\nA language that does not affect the way you\
    \ think about programming,\nis not worth knowing by Alan Perlis\nThere are 2 hard\
    \ problems in computer science: cache invalidation,\nnaming things, and off-by-1\
    \ errors by Leon Bambrick\n```\n\n这是一个按段落处理输入的示例。\n\n```bash\n# 打印包含 'you' 的段落\n\
    # 注意最后一条记录后有一个空行\nawk -v RS= -v ORS='\\n' '/you/' programming_quotes.txt\nDebugging\
    \ is twice as hard as writing the code in the first place.\nTherefore, if you\
    \ write the code as cleverly as possible, you are,\nby definition, not smart enough\
    \ to debug it by Brian W. Kernighan\n\nA language that does not affect the way\
    \ you think about programming,\nis not worth knowing by Alan Perlis\n```\n\n在处理自定义记录分隔符时，最后的空行是一个常见问题。你可以处理输出以移除它，或者添加逻辑来避免额外的行。这里是针对上述示例的一种解决方法。\n\
    \n```bash\n# 此处 ORS 保持为默认换行符\n# 未初始化的变量 's' 在第一次匹配时为空\n# 之后 's' 将提供空行分隔\nawk -v\
    \ RS= '/you/{print s $0; s=\"\\n\"}' programming_quotes.txt\nDebugging is twice\
    \ as hard as writing the code in the first place.\nTherefore, if you write the\
    \ code as cleverly as possible, you are,\nby definition, not smart enough to debug\
    \ it by Brian W. Kernighan\n\nA language that does not affect the way you think\
    \ about programming,\nis not worth knowing by Alan Perlis\n```\n\n段落模式不等同于使用 `RS='\\\
    n\\n+'`，因为当 `RS` 为空时 `awk` 会执行更多操作。详细信息请参阅 [gawk manual: multiline records](https://www.gnu.org/software/gawk/manual/html_node/Multiple-Line.html#Multiple-Line)。重要的要点在文中引用并用示例说明。\n\
    \n> 然而，`RS = \"\"` 和 `RS = \"\\n\\n+\"` 之间存在重要的区别。在第一情况下，输入数据文件开头的换行符会被忽略\n\n"
