  pgno: 75
- img_proc: true
  md: '# The TCP/IP Model 41


    source and destination IP addresses. This process goes on until the Network Interface
    layer breaks the information down into manageable packets (Ethernet frames) for
    transmission across the network.


    ![](img/b8864f367e279929da7f8395589b04dd_76_0.png)


    Figure 2.2 The encapsulation process in the TCP/IP model.


    When the Ethernet frames reach the remote host, the reverse of the encapsulation
    process occurs, known as decapsulation. Here, header information is removed by
    the relevant layer and passed to the next highest layer, starting with the Network
    Interface layer. Eventually the data reaches the application running on the remote
    host, as the user intended.


    # The Protocols of the TCP/IP Model


    Each layer of the TCP/IP model adheres to a different set of rules for communication.
    These are the protocols that are used at each of the layers to ensure that peer-to-peer
    communication occurs correctly between hosts. This section lists the protocols
    that are in operation for each of the layers.'
