  md: '# Question 5


    +   You have a star topology network using a central hub and have noticed that
    the number of collisions is very high. Which device would you install to reduce
    the number of collisions?

    - A. Bridge

    - B. Hub

    - C. Switch

    - D. Repeater


    Answer C is correct. A switch only forwards packets to the port containing the
    destination host, and would reduce the network traffic, which in turn, would reduce
    the number of collisions. Answer A is incorrect because this device is used to
    connect LANs together and forwards packets based on the destination MAC address.
    Answer B is incorrect because this device would be the cause of the high collision
    rate, due to the fact that it forwards packets to all ports instead of just the
    port containing the host with the destination address. Answer D is incorrect because
    this device is used to connect network segments by simply boosting the signal.


    # Question 6


    +   In an Ethernet II frame, what is the preamble field used for?

    - A. To determine the type of data being sent

    - B. To provide synchronization between the sender and the receiver

    - C. To provide error checking

    - D. To detect collisions


    Answer B is correct. The preamble field provides synchronization between the sender
    and the receiver. Answer A is incorrect because the type field contains this information.
    Answer C is incorrect because the CRC field contains this information. Answer
    D is incorrect because this is carried out by the network access method (CSMA/CD).'
