    Net Media Table: IPV4

    | Device | IP Address | Mask | Flags | Phys Addr |

    |---|---|---|---|---||

    | hme0 | systema | 255.255.255.255 | | 08:00:20:e4:4de |

    | hme0 | dell14 | 255.255.255.255 | | 00:b0:d0:e7:9f:f2 |

    | hme0 | ultra0 | 255.255.255.255 SP | | 08:00:20:b3:41:1b |

    | hme0 | 224.0.0.0 | 240.0.0.0 | SM | 01:00:00:00:00 |


    The flags entry in the preceding output consists of a number of values.

    These are described in the following list:


    +   - S—A static entry that is not subject to the limit specified in the

    ip_ire_arp_interval variable. Static entries persist until the next reboot.

    - P—A published entry that is advertised to other systems.

    - M—A mapped entry indicating that this is a multicast entry.

    - U—An unresolved or incomplete entry.


    The previous code shows the ARP entry for the local system is a static

    entry and is published to other hosts. The multicast entry (224.0.0.0) is also

    static and contains the M flag.


    Table 3.1 shows all the options for the arp command.


