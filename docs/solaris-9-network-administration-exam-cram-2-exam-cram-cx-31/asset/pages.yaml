    100 BASE-T4 operates over distances of about 100 meters. Answer B is incorrect
    because 100BASE-FX is implemented on fiber-optic cable, not twisted pair. Answer
    C is incorrect because100BASE-TX uses two pairs of wires, not four. Answer D is
    incorrect because 100BASE-X is a term often used to describe 100BASE-FX and 100BASE-TX.


