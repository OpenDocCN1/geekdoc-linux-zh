  md: '# Chapter 4


    Answer D is correct because the file /etc/nodename contains a system''s canonical
    hostname. Answer A is incorrect because /etc/inet/hosts is used to provide IPv4
    address-to-hostname mapping. Answer B is incorrect because /etc/inet/netmasks
    is used to associate IPv4 network masks with IPv4 network numbers. Answer C is
