  md: '# Chapter 11


    Note that an additional macro has been added to the dhcpab table. This table is
    described in greater detail later in this chapter.


    An advantage of using the ASCII file of datastore is that the tables are easily
    viewed, just like any other file. The contents of the dhcpab file at this point
    in the configuration process are shown here:


    ```

    ultra10# cat /var/dhcp/SUNfiles1_dhcpab

    # SUNfiles1_dhcpab

    #

    # Do NOT edit this file by hand -- use dhtamn(1M) or dhcpmgr(1M) instead

    ```


    ```

    Localemli6223146933137617348145:IncludeLocale::=192.168.28.28 \

    LeaseItem-b860:DNSServer=192.168.28.28 \

    192.168.28.0:mi068031625823578018255:Subnet=255.255.255.0 \

    Router=192.168.28.28:192.168.28.255:

    ```


    Note that the ultra10 macro has been defined so that it provides standard setup
    information for clients, such as the locale, the default lease time, DNS information
    and so on.


    The network macro (192.168.28.0) contains a subnet mask. If this value is not
    specified on the command line, the /etc/inet/netmasks file is automatically consulted.


    # The dhcp_network File


    The next step in the manual configuration of the DHCP server is to add the range
    of IP addresses the server is going to be responsible for allocating to clients.
    The dhcp_network file is used to contain the range of addresses.


    A separate file is created for each network that is specified with the -n option
    to the dhcpconfig command. The example used in this section specifies the network
    192.168.28.0. In the repository directory, there is a file called SUNfiles1_192_168_28_0.
    The filename is based on the datastore type and the IP address of the network
    it represents. When the file is created initially, it looks like this:


    ```

    ultra10# cat SUNfiles1_192_168_28_0

    # SUNfiles1_192_168_28_0

    #

    # Do NOT edit this file by hand -- use pntamn(1M) or dhcpmgr(1M) instead

    ```


    Note that there are no IP addresses for the DHCP server to manage yet. You add
    these in the next section, by using pntamn.'
