  md: '# About the Technical Reviewers


    **Philip LaVoie** is a CSCA and SCNA working for Dow Jones & Company, Inc. Not
    believing system administration ends with the operating system and hardware, he
    has experience programming Java, PERL, PHP, P, C++, and PostScript. With a love
    for his wife Kate and an affinity for logic and detail, Phil maintains and designs
    Oracle and MySQL databases and is a long-time supporter of Linux and free software.


    **Ross Brunson** is currently the director of Linux/Unix education for The Training
    Camp and an LPI-US (Linux Professional Institute) board member. He has the following
    certifications: LPICI, SCNA, LCI, LCA, Linux+, CCNA, MCSA, MCP-I, MCSE4, MCT,
    and Inet.


    He began his career in the U.S. Army in the 1980s working with battlefield simulation
    systems running on Unix platforms. Before joining The Training Camp, Ross authored
    several books about UNIX/Linux Integration with Window, including the *Linux and
    Windows 2000 Integration Toolkit.*


    Ross began his formal training and consulting career with Learning Tree International
    as a courseware technical editor and his area''s second-highest scoring instructor.


    After a number of years conducting TCP/IP, Unix, Linux, and Networking courses
    for Learning Tree, Mastering Computers of Scottsdale and other companies, he took
    a courseware and development position at Computer Associates developing and delivering
    Windows 2000 and Linux courses for many USA and International companies.


    Ross then took a position with Thomson Learning''s Clair certification and courseware
    division as the Director of Courseware Development and Instruction. He built an
    excellent instructor force spanning 13 countries and 110 instructors in little
    over a year, delivering many “train-the-trainers” to current and prospective instructors
    in the U.S. and overseas. Ross has conducted certification seminars at four consecutive
    Linuxworld shows, with over 2,500 people attending and testing as a result of
    his team''s efforts.


    He lives in Coeur d''Alene, Idaho, with his wife, baby daughter, and dogs and
    enjoys canoeing, fishing, and hiking in between teaching and consulting gigs.'
