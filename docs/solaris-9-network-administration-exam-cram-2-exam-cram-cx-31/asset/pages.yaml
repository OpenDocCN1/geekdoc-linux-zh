  md: '# Chapter 8


    This chapter carries on from the previous chapter and covers multipathing with
    IPv6 and a mechanism for enabling IPv6 interfaces to communicate over an IPv4
    network. This is known as tunnelling. The chapter also looks at troubleshooting
    IPv6.


    # IPv6 Multipathing


    IP multipathing was introduced in Chapter 5, “IP Multipathing.” To use multipathing
    with IPv6, the setup is very similar to that of IPv4, although there are some
    important differences. The most notable are that the test addresses are created
    on the same network interface, such as eth0, without the need for additional logical
    interfaces, and that the test address can also be used for normal operation. With
    IPv4 setup, the test address is used only to enable the in.multipathd process
    to probe its status.


    Like IPv4, IPv6 multipathing can be set up via a command line or through the use
    of configuration files.


    > Remember if you set up multipathing on the command line, the configuration will
    be lost on the next reboot. To make your changes persist across reboots, you must
    use configuration files so that multipathing is implemented each time the system
    reboots.


    # Using Configuration Files


    To use IP multipathing with existing IPv6 interfaces, you simply edit the relevant
    /etc/hostname6.interface for the network interfaces you want to participate in
    multipathing and then reboot the system.


    To set up IPv6 multipathing for a system that has two interfaces—eth0 and eth1—and
    use a multipath group called ip6test, you would edit the files for /etc/hostname6.eth0
    and /etc/hostname6.eth1 and add the following entry to each:


    +   - failover group ip6test up


    > Using the configuration files to configure IPv6 multipathing assumes that the
    IPv6 interfaces already exist—that is, they have already been configured for normal
    use. This process merely modifies the interface''s functionality to participate
    in multipathing.'
  merge: -1
