  md: 'Answer B is correct because the file /etc/inet/ntp.conf is the configuration
    file that is created when the NTP server is initially configured and contains
    an entry that defines the drift file''s location. Of course, after changing the
    file, the NTP server would have to be restarted. Answer A is incorrect because
    /etc/inet/ntp.server is the template file that is copied to /etc/inet/ntp.conf
    to configure an NTP server. Answer C is incorrect because /var/ntp/ntp.drift is
    the default location for the drift file, which is specified in the configuration
    file. Answer D is incorrect because /etc/inet/ntp.client is the template file
    that is copied to /etc/inet/ntp.conf to configure an NTP client.


    # Question 6


    +   At which run level does NTP get started?

    - A. S

    - B. 1

    - C. 2

    - D. 3


    Answer C is correct because NTP is started at run level 2. The startup script
    is located in /etc/rc2.d/S74ntpd.


    # Question 7


    +   Which command is used to query the NTP process and can also turn on the debugging
    facility?

    - A. ntpq

    - B. xntpdc

    - C. xntpd

    - D. ntpdate


    Answer B is correct because the xntpdc command is used to query the NTP daemon
    process, xntpd. Answer A is incorrect because the ntpq command is used to query
    an NTP server, not running the daemon process for a particular server. Answer
    C is incorrect because xntpd is the NTP daemon process that is queried when you
    run xntpdc. Answer D is incorrect because ntpdate is used by an NTP client to
    initially obtain the time from an NTP server when the client starts up.'
