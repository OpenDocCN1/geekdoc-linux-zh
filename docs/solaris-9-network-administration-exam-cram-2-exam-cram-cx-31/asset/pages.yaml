    The fields are described here:


    +   * Symbol Name—The name of the symbol.


    +   * Code—A unique code assigned to the symbol. The code number must be unique
    within the category.


    +   * Type—The entry’s data type.


    +   * Granularity—The number of instances. For example, a symbol with a data type
    of IP Address and a granularity of 2 means that the entry must contain 2 IP addresses.


    +   * Max—The maximum number of values. For example, a symbol with a data type
    of IP Address, granularity of 2 and maximum of 2 can contain a maximum of 2 pairs
    of IP addresses.


    +   * Description—A textual description of the symbol.


