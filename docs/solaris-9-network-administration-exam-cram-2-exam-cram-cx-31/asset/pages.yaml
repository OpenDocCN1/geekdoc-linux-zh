- img_proc: true
  md: '# Chapter 11


    This chapter introduces the Dynamic Host Configuration Protocol (DHCP) and explains
    basically how it works, what it is used for, and how to configure a server and
    client.


    # DHCP Fundamentals


    DHCP allows the automatic assignment of network parameters, such as IP addresses,
    to a number of hosts or devices. Previously, networks were smaller and contained
    a number of hosts that used static addresses. These networks were easy to manage
    and administer, with the proliferation of laptops and network devices, coupled
    with the increase in user mobility, the administrator could not cope with the
    demand for short-term address management. DHCP addresses this issue by managing
    ranges of IP addresses, which can be allocated as required. When an address is
    no longer needed by a client, it is released and becomes free to be allocated
    to another client.


    # Why Use DHCP?


    DHCP facilitates the distribution and allocation of IP addresses dynamically,
    from a central location, the DHCP server. When a client is configured to use DHCP,
    it automatically obtains a short-term lease of an IP address when it boots up.
    If the same computer moves to another network, it is automatically assigned a
    new IP address relevant to that network, without the need for an administrator
    to manually configure the network interface.


    Without the use of DHCP, all IP addresses would have to be manually configured,
    a task that would quickly become unmanageable in today''s large network environments.


    # What Does a DHCP Server Do?


    A DHCP server manages a range of IP addresses. When a request is received from
    a booting client, known as a DHCPDISCOVER, the server responds with an offer of
    an IP address to lease from the server for a finite period of time, known as a
    DHCPPOFFER. The client can receive multiple offers if there are a number of DHCP
    servers on the network (as long as the servers all manage a different range of
    IP addresses). The client then selects an offer to receive, which is passed back
    to the server in the form of a DHCPREQUEST message. The server finally sends a
    DHCPPACK message to confirm the lease. The process that runs on a DHCP server
    is called dhcpd.'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# What Does a DHCP Client Do?


    A DHCP client is responsible for obtaining sufficient information to enable it
    to configure the network, interface so that network communication can occur. The
    client runs a process called dhcpmgr, which listens for a response from a DHCP
    server, handles the renewing or relinquishing of a lease for an IP address, and
    configures the network interface when an IP address has been assigned to the client,
    after checking that no other host on the network is using the assigned IP address.


    # Configuring a DHCP Server


    DHCP server configuration consists of two steps: configuring the server and starting
    it. There are two ways of configuring the server: a command-line method that uses
    the dhcpconfig command and the use of a graphical utility. The dhcpconfig command
    method is the fastest to configure a server, but it requires more detailed knowledge
    of the process and is more advanced, whereas the dhcpmgr utility is easier to
    use, validates the input values as they are entered, and uses default values automatically—unlike
    dhcpconfig, where the values must be specified.


    # dhcpmgr


    The dhcpmgr command runs in an X Windows environment, such as CDE, and is located
    in the /usr/sadm/admin/bin directory.


    The following steps describe the server configuration process when you use the
    dhcpmgr graphical utility:


    +   1. Start the dhcpmgr utility by running the following command in the background
    in any window:

    ultra08# /usr/sadm/admin/bin/dhcpmgr &


    The following window appears, enabling you to configure either a DHCP server or
    a BOOTP relay server. A BOOTP relay server is one that acts on behalf of a DHCP
    server and forwards requests from a DHCP client onto a DHCP server. These steps
    concentrate on configuring a DHCP server, so click the Configure as DHCP Server
    button and then the OK button to do this, as shown in Figure 11.1.'
  merge: -1
  pgno: 240
