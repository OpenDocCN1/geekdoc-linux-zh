  md: "# The pntadm Command\n\nThe pntadm command is used to manage the DHCP network\
    \ table, specifically to add, modify, or delete IP addresses that the DHCP server\
    \ is going to manage; to add or remove networks that come under the control of\
    \ the DHCP server; and to inspect the network tables themselves.\\nWait, let me\
    \ re-read the text: The most common use for this command is to add the range of\
    \ IP addresses that the DHCP server is responsible for allocating to clients.\
    \ Each address has to be added manually to the table, which is one reason why\
    \ this method of configuring a DHCP server is well suited to the use of scripts\
    \ to loop through a defined block of numbers, eliminating the need to add each\
    \ one manually.\n\nThe following command adds the IP address 192.168.28.31 to\
    \ the 192.168.28.0 network table. It also identifies a hostname (alpha_31), which\
    \ will automatically be added to the local /etc/inet/hosts file:\n\n command uses\
    \ the default configuration information, such as the data-store type and the repository\
    \ directory. The following command is identical to it, but instead of accepting\
    \ default values, it specifies them on the command line:\n\nThe database contains\
    \ an IP address to manage that looks like this:\n\nThe manual pages for the pntadm\
    \ command and for the dhcp_network file describe the full range of options and\
    \ the file format.\n\n```\nultra10# pntadm -A 192.168.28.31 -h alpha_31 192.168.28.0\n\
    ```\n\n```\nultra10# pntadm -r SUNfiles -p /var/dhcp -A 192.168.28.31 -h alpha_31\\\
    n192.168.28.0\n```\n\n```\nultra10# cat /var/dhcp/SUNfiles1_192_168_28_0\\n# SUNfiles1_192_168_28_0\\\
    n#\n# Do NOT edit this file by hand -- use pntadm(IM) or dhcmpgr(IM) instead\\\
    n192.168.28.31/000000192.168.28.0I7336363792865379861IUNKNOWN\n```\n\n# The dhcptab\
    \ Table and dhtadm\n\nThe dhcptab is used to store the configuration parameters,\
    \ which will be passed to clients that use DHCP. The parameters are stored as\
    \ macros in this table, where symbols can also be created to hold specific values.\
    \ A symbol functions in a similar way to a variable.\\n\nThe dhcptab should not\
    \ be edited manually; use either the DHCP manager(dhcmpgr) or the dhtadm command.\
    \ This section describes the use of the dhtadm command."
