  md: '# Chapter 11


    ```

    # dhtadm -P

    Name Type Value

    ================ ====

    192.168.28.0 Macro :Subnet=255.255.255.0: \

    Router=192.168.28.28:Broadcast=192.168.28.255:

    ltra10 Macro :Include:Locale:Timeserver=\\n192.168.28.28:LeaseTime=8640:LeaseNeg=DNSdomain=xyz.com:DNSserver=\\n192.168.28.28:

    Locale Macro :UTCoffst=0:

