    +   * Grade Exam—When you have completed your exam, you can click Grade Exam to
    end your exam and view your detailed score report. If you have unanswered or marked
    items remaining, you are asked whether you would like to continue marking your
    exam or view the exam report.


    # Seeing Time Remaining


    If your practice test is timed, the time remaining is displayed on the upper-right
    corner of the application screen. It counts down the minutes and seconds remaining
    to complete the test. If you run out of time, you are asked whether you want to
    continue taking the test or end your exam.


    # Getting Your Examination Score Report


    The Examination Score Report appears when the Practice Exam mode ends—as a result
    of time expiration, completion of all questions, or your decision to terminate
    it.


    This screen provides a graphical display of your test score, with a breakdown
    of scores by topic domain. The graphical display at the top of the screen compares
    your overall score with the PrepLogic Exam Competency Score. The PrepLogic Exam
    Competency Score reflects the level of subject competency required to pass the
    particular vendor''s exam. Although this score does not directly translate to
    a passing score, consistently matching or exceeding this score does suggest that
    you possess the knowledge needed to pass the actual exam.


    # Reviewing Your Exam


    From Your Score Report screen, you can review the exam that you just completed
    by clicking the View Items button. You can navigate through the items, viewing
    the questions, your answers, the correct answers, and the explanations for those
    questions. You can return to your score report by clicking the View Items button.'
