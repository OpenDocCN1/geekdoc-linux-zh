- img_proc: true
  md: '# Configuring a Caching-Only DNS Server


    A caching-only DNS server is much simpler to set up and contains no zone data
    files, except for the root domain file—named.ca (which should be manually copied
    to the server during the initial configuration)—and the loopback reverse resolution
    file. The local server is always the master for this conceptual zone. A typical
    caching-only configuration file, /etc/named.conf, is shown here:


    ```

    directory "/var/named"; named.ca

    cache named.local;

    master 0.0.127.in-addr.arpa

    ```


    Note that the named.ca root domain file should be manually copied from the primary
    DNS server during the initial configuration.


    # Configuring a DNS Client


    A DNS client uses the DNS servers to carry out resolution. DNS servers are also
    configured as DNS clients because they can also issue queries to be resolved.
    The client configuration process consists of two separate steps: one to configure
    the system to use DNS as a mechanism for name resolution and the second to identify
    the DNS servers that should be contacted to carry out the resolution. The first
    step involves the file /etc/nsswitch.conf, and the second involves the file /etc/resolv.conf.
    Both are covered in the following sections.


    # /etc/nsswitch.conf


    This file is the name switch file that allows the use of flat files or other name
    services (such as NIS, NIS+, or LDAP) to resolve various queries. For DNS purposes,
    there is only one entry in this file of interest: the hosts entry. When a system
    is installed with Solaris 9, the default hosts entry uses only the flat files
    for name resolution, namely /etc/inet/hosts. To change this entry to include DNS,
    modify the entry to the following:


    ```

    hosts:    files dns

    ```'
  merge: -1
  pgno: 225
- img_proc: true
  md: 'Solaris provides a number of switch templates, one of which is /etc/nswitch.dns.
    This file can simply be copied to /etc/nswitch.conf so that DNS resolution can
    apply. Be careful, though, if another name service is already in use (such as
    NIS) because this would overwrite the current configuration file and cause NIS
    problems. Read any exam question thoroughly to see whether any other name service
    is running before contemplating your answer.


    The order of the entries in the switch file is important because DNS entries could
    be masked by entries in the local hosts file. A Rogue entry in the hosts file
    could prevent DNS from being used to look up an IP address. You can also include
    a conditional statement that interprets the result of the query and takes a specific
    action based on the code returned from the query. There are four possible return
    codes, shown in Table 10.3.


    # Table 10.3 Name Resolution Return Codes


    | Code | Description |

    | --- | --- |

    | NOTFOUND | The required hostname entry was not found. |

    | SUCCESS | The required hostname entry was found and resolved. |

    | TRYAGAIN | The service was busy. Trying again might prove successful. |

    | UNAVAIL | The service did not respond. |


    Two actions can be taken after the return code has been interpreted, namely continue
    or return. The continue action enables the query to try the next resolution method
    in the hosts: entry of the file, whereas the return action does not use; it simply
    stops and the process fails.


    As an example, consider what would happen if you had the following hosts: entry
    in your /etc/nswitch.conf file:


    +   * hosts: files [NOTFOUND=return] dns


    The result is that if a hostname could not be resolved with the /etc/inet/hosts
    file, then the process would stop and not use DNS at all.


    > You should be prepared for various scenarios involving the /etc/nswitch.conf
    file. There are often questions that ask you to identify the resolution steps
    that would take place based on different hosts: entries. Make sure you understand
    the return codes and actions.'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# /etc/resolv.conf


    This file specifies the DNS servers that the client can use to resolve hostnames/IP
    addresses. A sample /etc/resolv.conf is shown here with the most popular options:


    ```

    domain xyz.com

    search xyz.com

    nameserver 192.168.28.28; Primary DNS server

    nameserver 192.168.28.72; Secondary DNS server

    ```


    The domain entry identifies the DNS domain name. The search entry identifies the
    domain name to append to queries that were not specified as fully qualified, such
    as if you queried the host sales rather than sales.xyz.com. The next two entries
    specify the IP addresses of two DNS servers that will attempt to resolve the query.
    You can enter up to three nameservers, although it is normal to place the server
    that is physically nearest to you at the top so that it is always tried first.


    > If there are no nameserver entries, or if the file /etc/resolv.conf does not
    exist, the client tries to use its own loopback address to resolve the query.


    # Troubleshooting


    Some basic Solaris utilities can be used to troubleshoot DNS problems. This section
    shows how to deal with the most common problems.


    # Error Messages


    The first place to look for DNS server error messages is /var/adm/messages. All
    errors relating to the DNS server are written to this file. The following extract
    that there is a configuration error in /etc/named.conf (normally a bracket or
    semi-colon has been omitted), and that the expiry time might need to be increased
    to at least 1 week, because it is currently:


    ```

    Jun 6 18:03:51 ultra1 named[597]: [ID 295310 daemon.error] \

    /etc/named.conf:4: syntax error near ''''

    Jun 6 18:03:51 ultra1 named[597]: [ID 295310 daemon.warning] db.xyz: \

    WARNING SOA expire value is less than 7 days (432000)

    Jun 6 18:03:51 ultra1 named[597]: [ID 295310 daemon.warning] xyz.rev: \

    WARNING SOA expire value is less than 7 days (432000)

    Jun 6 18:03:51 ultra1 named[597]: [ID 295310 daemon.warning] named.local: \

    \

    WARNING SOA expire value is less than 7 days (432000)

