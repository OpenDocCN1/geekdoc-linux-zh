  md: '# Causing the in.named Daemon to Reread Its Configuration Files


    In a similar way to the inetd daemon, you can make in.named reread all its configuration
    files, without having to stop and start the daemon process itself. The advantage
    of taking this action is that you don''t lose the information held in cache. To
    make the process reread its configuration files, send in.named the HUP signal,
    as shown here:


    ```

    ultra10# kill -HUP in.named

    ```


    The following messages are written to the /var/adm/messages file to confirm that
    the action has been carried out:


    +   - Jun 6 18:06:29 ultra10 named[598]: [ID 29531 daemon.notice] \ reloading
    nameserver

    - Jun 6 18:06:29 ultra10 named[598]: [ID 29531 daemon.notice] \ Ready to answer
    queries.


    # Using ndc


    The ndc utility can be used to monitor and modify the DNS server and provides
    an alternative to sending various signals to the in.named process. It can be used
    either directly from the command-line prompt, or interactively. ndc provides much
    greater control over a DNS server from within a single utility, which enables
    you to stop and start the server, change or disable the debug levels, and examine
    the current status, among other things. Run the ndc command and type help to see
    a list of options. The following session shows an example of use of ndc specifying
    the help and status options:


    ```

    ultra10# help -or. /h if you need help.

    ndc> help

    (builtin) start - the server

    (builtin) restart - stop server if any, start a new one

    getpid

    status

    stop

    exec

    reload [zone] ...

    reconfig [-expired] (just sees new/gone zones)

    dumpdb

    stats [clear]

    trace [level]

    trace

    querylog

    crylog

    help

    quit

    dc> status

    ```'
