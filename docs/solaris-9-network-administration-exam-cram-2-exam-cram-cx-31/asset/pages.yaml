    for each network interface participating in IP multipathing. /etc/inet/hosts should
    also contain meaningful names that the interfaces do not have to be referred to
    by IP addresses.


    Each network interface must have a unique address, so if necessary, you will have
    to assign local addresses to each interface. This was described in'
