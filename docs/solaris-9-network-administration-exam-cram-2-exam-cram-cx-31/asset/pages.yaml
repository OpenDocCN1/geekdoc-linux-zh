    # Setting Up an NTP Client


    To configure a system as an NTP client, the configuration file template /etc/inet/ntp.client
    needs to be copied to /etc/inet/ntp.conf. This file doesn''t normally need to
    be edited, as shown here:


    ```

    # cat /etc/inet/ntp.client

    # ident @(#)/ntp.client 1.3   00/07/17 SMI"

    #n# /etc/inet/ntp.client

    # An example file that could be copied over to /etc/inet/ntp.conf; it

    # provides a configuration for a host that passively waits for a server

    # to provide NTP packets on the ntp multicast net.

    #

    ```


    multicastolient 224.0.1.1


    The file contains only one entry by default, which uses the default multicast
    address to find NTP servers.


    After you have configured the ntp.conf file, start the xntpd daemon as follows:

    # /etc/init.d/xntpd start


    > When the /etc/init.d/xntpd script is run to start the NTP daemon, the ntpdate
    command is run to set the time initially. See the online manual page for ntpdate
    for a detailed description of this command.


    ![](img/b8864f367e279929da7f8395589b04dd_299_0.png)


    # The NTP Daemon


    The daemon that controls NTP is xntpd and is started via the startup script /etc/rc2.d/S74xntpd.'
