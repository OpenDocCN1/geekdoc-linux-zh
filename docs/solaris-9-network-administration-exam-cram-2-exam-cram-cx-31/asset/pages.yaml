  md: '# Domain Name System (DNS) 193


    # telnet


    You can easily test whether the in.named process is accepting requests by using
    the telnet command. DNS uses port 53, so connect to this port. If you establish
    a connection, it is working; if you dont, the process isn''t running or there
    is a problem with it. The following code shows a telnet session to port 53, which
    connects successfully. Use the Ctrl + ] key to return to the telnet prompt and
    quit.


    ```

    ultra5# telnet ultra10 53

    Trying 192.168.28.28...

    Connected to ultra10.

    Escape character is ''^''.

    ^

    telnet> close

    Connection to ultra10 closed.

    ```


    # nslookup


    The nslookup command is useful for testing the DNS process. nslookup can be used
    as a single query command, or interactively where a number of additional functions
    can be carried out.


    It is always a useful test to look up a host that you know is not present in your
    /etc/hosts file, but you know exists on the network. The nslookup command returns
    the resolved information as well as the DNS server used to execute the query,
    as shown here:


    ```

    ultra5# nslookup systemb

    Server: ultra10.xyz.com

    Address: 192.168.28.28

    ```


    ```

    Name: systemb.xyz.com

    Address: 192.168.28.127

    ```


    You can also test another server, as a secondary DNS server, using the nslookup
    command. The following output shows the interactive use of nslookup to resolve
    the same hostname as the preceding example:


    ```

    ultra5# nslookup

    Default Server: ultra10.xyz.com

    Address: 192.168.28.28

    ```


    ```

    > server ultra5.xyz.com

    Default Server: ultra5.xyz.com

    Address: 192.168.28.29

    ```


    ```

    > systemb

    Server: ultra5.xyz.com

    Address: 192.168.28.29

    ```


    ```

    Name: systemb.xyz.com

    Address: 192.168.28.127

    > #

    ```'
  merge: -1
  pgno: 228
- img_proc: true
  md: '# Chapter 10


    Note that the interactive nslookup facility requires a ctrl + d keystroke to exit
    to the command prompt.


    # Taking a Snapshot of the DNS Database


    If there are problems with the DNS server, then taking a snapshot of the DNS database
    might help to diagnose the cause. You can take a snapshot of the database, which
    is cached in the system memory, and write it to an ASCII file for later examination.
    The snapshot is stored in the file /var/named/named_dump.db and can be useful
    for finding errors in zone files, for example.


    To take a snapshot, enter the following command as root from the command line:


    ```

    ultra10# pkill -INT in.named

    ```


    The action is logged in the /var/adm/messages file as shown here:


    ```

    Jun 06 22:44:00 ultra10 named[173]: [ID 295310 daemon.notice] \

    dumping nameserver data

    Jun 06 22:44:00 ultra10 named[173]: [ID 295310 daemon.notice] \

    finished dumping nameserver data

    ```


    # Debugging the in.named Daemon


    To debug the in.named process, you can force it to provide a greater amount of
    output. Debugging is disabled by default, but you can initiate it and increase
    the debug level incrementally by running the following command a number of times:


    ```

    ultra10# pkill -USR1 in.named

    ```


    Each time you send an in.named US1 signal, the debug level is increased, producing
    more output. Debug output is stored in the file /var/named/named.run.


    The following output extracts the debug output while the nslookup command is being
    run. It demonstrates how the additional output provides more detailed information
    about how the resolution process is working:


    ```

    ultra10# cat /var/named/named.run

    Debug level 1

    Version = in.named BIND 8.2.4 Sat Apr 6 14:44:58 PST 2002

    Generic = 5.9-May 2002

    confile = /etc/named.conf

    Debug level 2

    dagram from [192.168.28.28].32829, fd 23, len 44

    ```'
  merge: -1
