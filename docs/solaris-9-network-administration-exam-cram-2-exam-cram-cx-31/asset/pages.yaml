  md: '# Network Interface Layer Protocols


    Protocols of the Network Interface layer also include those of the Hardware layer
    because the Hardware layer is seen as being incorporated into the Network Interface
    layer. The following protocols operate at the Network Interface layer:


    +   - IEEE 802.3 Ethernet including CSMA/CD—The standard network access method
    used in Ethernet networks.

    - IEEE 802.4 Token Bus—A network access method used in a bus topology, which also
    utilizes a token passing mechanism.

    - IEEE 802.5 Token Ring—A network access method used primarily in a ring topology,
    which utilizes a token passing mechanism.

    - Serial Line Internet Protocol (SLIP)—A protocol used for serial communication
    between two machines that have been configured to talk to each other, such as
    a dialup connection to an Internet service provider (ISP).

    - Point-to-Point Protocol (PPP)—A protocol used for serial communication, such
    as a dialup connection to an ISP is preferred over SLIP because it can share a
    line with other users and provides error detection—facilities not provided with
    SLIP.


    # Internet Layer Protocols


    Protocols in use at the Internet layer include the following:


    +   - Address Resolution Protocol (ARP)—A protocol used to map a 32-bit IP address
    to a 48-bit Ethernet address.

    - Reverse Address Resolution Protocol (RARP)—A protocol used to map a 48-bit Ethernet
    address to a 32-bit IP address.

    - Internet Protocol (IP)—A protocol that handles connectionless delivery of datagrams
    across the network.

    - Internet Control Message Protocol (ICMP)—An integral part of IP that is used
    to send error and control messages to other hosts on the network.

    - Various Internet Security protocols (IPSEC)—A collection of protocols that provides
    additional security to data traveling across networks.


    > Each of the protocols listed here are discussed in more detail in Chapters 3
    and 4.'
