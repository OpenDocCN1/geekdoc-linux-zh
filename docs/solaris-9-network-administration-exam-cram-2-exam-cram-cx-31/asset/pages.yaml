  md: '# IPv6-Over-IPv4 Tunnels


    During the transition period from IPv4 to IPv6, there are going to be occasions
    where two hosts on a network are configured with IPv6 addresses, but the intervening
    hosts and routers are part of an IPv4 network. This section describes how to use
    a tunnel to overcome this problem.


    # What Is an IPv6-Over-IPv4 Tunnel?


    An IPv6-over-IPv4 tunnel is a mechanism by which IPv6 datagrams can be transported
    over an IPv4 network. The sender and the receiver both support IPv6 (and IPv4),
    but the hosts and routers along the path takes support only IPv4. As an example,
    consider encryption as an analogy. Only the sender and the intended recipient
    know how to get at the data, such as your credit card details. While this sensitive
    information is transported across the Internet, for example, the actual data is
    not accessible and is passed on to the destination, where it is extracted correctly.
    With an IPv6-over-IPv4 tunnel, the data is encapsulated into IPv4 datagrams at
    the sender side, and then transported across the network as normal IPv4 datagrams.
    When the datagram reaches the destination, the IPv6 data is extracted (decapsulated).


    # Configuring a Tunnel


    This section describes how to configure an IPv6-over-IPv4 tunnel between two hosts
    (ultra0 and systema), each having an hme0 network interface.

    The following steps describe how to create the tunnel.


    +   1. A new IPv4 logical interface needs to be configured on both systems.

    On the host systema enter the following:


    ```

    ultra0# ifconfig hme0 addif 192.168.23.23 up

    Created new logical interface hme0:1

    ```


    On the host systema enter the following:

    systema# ifconfig hme0 addif 192.168.24.24 up

    Created new logical interface hme0:1


    +   2. On host ultra0, define the IPv6 tunnel and configure it to join the two
    IPv4 logical interfaces just created, as follows:


    ```

    ultra0# ifconfig ip.tun inet6 plumb

    ultra0# ifconfig ip.tun inet6 tsrc 192.168.23.23 tdst 192.168.24.24 up

    ```'
