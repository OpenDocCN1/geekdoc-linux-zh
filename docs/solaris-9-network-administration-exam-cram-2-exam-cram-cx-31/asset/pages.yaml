- img_proc: true
  md: '5. The created interface identifier needs to be converted back to hexadecimal.
    Also, add the colon (:) characters as separators. This will give a final interface
    identifier of


    ```

    a000:2ff:feb3:4153

    ```


    The unique interface identifier forms only 64 bits of the 128-bit IPv6 address.
    If this was a link-local IPv6 address, using the fec format prefix, the final
    autoconfigured IPv6 address would be


    ```

    fec0:0000:0000:0000:0a00:2ff:feb3:4153

