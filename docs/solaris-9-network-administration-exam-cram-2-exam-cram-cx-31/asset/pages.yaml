    The variant of Unix developed by AT&T Bell Labs. Solaris is based on System V
    Unix Release 4.


    # server


    A computer system that provides services to other systems on a network.


    # TCP/IP model


    A protocol stack that enables devices to communicate across a network. The TCP/IP
    model is a four-layer model comprising the Network Interface (including hardware-layer),
    Internet, Transport, and Application layers. The structure is hierarchical, with
    each layer performing a specific function.


    # SOA (Start Of Authority) resource record


    Resource record used in the Domain Name System (DNS) file to identify the start
    of the zone data and define default parameters for the whole world.


    # Transmission Control Protocol (TCP)


    # stateful protocol


    Both the sending and receiving hosts monitor a connection and exchange status
    information as part of the data exchange, providing greater reliability, but because
    of the extra overhead, greater. TCP is an example of a stateful protocol.


    A connection-oriented, reliable, and stateful protocol that operates at the Transport
    layer of the TCP/IP model. It is used on networks where a guaranteed delivery
    service is required. TCP implements a guaranteed delivery service through the
    use of acknowledgments and error checking/retransmission mechanisms.


    # stateless protocol


    # unicast address


    Neither the sending nor receiving hosts monitor the state of a communications
    link and both operate independently of the other, unlike stateless protocols where
    there is


    An IP address used to communicate with a single host on a network.'
  merge: -1
  pgno: 405
- img_proc: true
  md: '# unreliable protocol


    Each exchange of data is not acknowledged, so packets can be lost. Applications
    using an unreliable protocol normally handle data loss within the application
    and not rely on the network. UDP is an example of an unreliable protocol.


    # User Datagram Protocol (UDP)


    A connectionless, unreliable, and stateless protocol that operates at the Transport
    layer of the TCP/IP model. It was designed for applications that do not require
    a reliable transport mechanism, primarily because the application carries out
    any error checking and delivery guarantee.


    # vendor identifier (VID)


    The second (rightmost) 24 bits of an Ethernet address that are assigned and managed
    by the vendor and must be unique within the vendor organization. The VID is used
    with the company identifier (CID) to form an Ethernet address.


    # wide area network (WAN)


    A network that spans a large geographical area and can be used to interconnect
    departmental local area networks (LANs), or different locations in a city or state.
    A WAN makes use of third-party service providers and telecommunications companies
    to provide the connection. Data transfer rates are typically slower than that
    on a LAN. Frame relay is an example of a WAN technology.


    # zone


    The extent of the authority of a DNS name server.


    # zone file


    A data file used in the domain name system (DNS) relevant to a particular zone.
    The file identifies configuration information and hostname resolution details
    for domains and systems that come under the authority of the zone.


    # zone transfer


    The process by which secondary DNS name servers are updated from the primary DNS
    server to synchronize the data.'
