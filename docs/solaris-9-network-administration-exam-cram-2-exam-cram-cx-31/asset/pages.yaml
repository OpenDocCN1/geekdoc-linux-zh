    # Troubleshooting the DHCP Server


    When problems occur on a DHCP server, it is worth checking whether the server
    itself is functioning before assuming the DHCP configuration is at fault. Use
    standard Solaris commands to verify that the server is working, such as ping,
    ifconfig, and snoop.


    You can also stop and start the DHCP server process, in.dhcpd, as described in
    Chapter 11, "Basic DHCP.” can often solve a number of problems, particularly when
    the process has hung and is not responding to client requests, or when you are
    using either the binary or nisplus format for the DHCP datastore, neither of which
    is human readable.


    # Error Messages


    There are a number of reasons why a DHCP client might be unable to obtain an IP
    address from a DHCP server. Table 12.2 lists some of the more common errors encountered,
    along with a brief explanation of what the cause of the error is and also the
    required resolution. Note that the IP addresses will be different from those shown
    here.


    | Table 12.2 Common DHCP Error Messages |

    | Message | Description | Resolution |

    | No IP addresses on 192.168.28.0 network | All the IP addresses that are managed
    by DHCP are in use for the specified network. | Use **dhcmgr** or **dhcpconfig**
    to create additional IP addresses to allocate to clients. |

    | Client: 01800208E48CE is trying to renew 192.168.28.32, an IP address it has
    not leased | The IP address held by the server for this client does not match
    the IP address specified by the client. This is often caused by a client''s record
    being deleted while the IP address is still in use. | Use **dhcmgr** or **pntadm**
    to view the network table and correct. |'
  merge: -1
  pgno: 279
- img_proc: true
  md: '# Table 12.2 Common DHCP Error Messages (continued)


    | Message | Description | Resolution |

    |---|---|---|n| Offer expired for client: 192.168.28.32 | The DHCP made an offer
    of an IP address, but the client did not respond in time. | The cache offer timeout
    on the DHCP server may be set too low. Increase the value using dhcpmgr. |

    | 192.168.28.32 currently marked as unusable | The IP address has been marked
    in the network table as unusable. | Use dhcpmgr or pntadm to make the address
    usable. |

    | There is no 192.168.28.0 dhcp-network table for DHCP client''s network | A client
    is requesting an IP address, but the DHCP server cannot find the network table
    for the address because the network table has been deleted. | Re-create the network
    table using dhcpmgr or dhcpconfig. |

    | DHCP network record for 192.168.28.32 is unavailable, ignoring request ICMP
    ECHO reply to OFFER candidate: 192.168.28.32, disabling | The specified IP address
    is not present in the network table. The IP address is already in use. The server
    carries out this check before finally allocating the IP address to the client.
    | Use dhcpmgr or pentadm to view the table and create the record if necessary.
    You need to establish whether the specified address should be managed by DHCP,
    or whether it is a static IP that is outside the scope of DHCP addresses. |


