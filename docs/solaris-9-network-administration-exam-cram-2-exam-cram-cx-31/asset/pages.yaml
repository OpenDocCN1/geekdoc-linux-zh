  md: '# Chapter 10


    is connected to the Internet, because it could provide an intruder with additional
    information. A sample entry is shown here:


    ```

    mailmaster IN HINFO Enterprise-450 Solaris-9

    ```


    +   Text (TXT)—This record provides textual comments about the DNS server. For
    security purposes, it is not recommended to include this type of record, especially
    if the server is connected to the Internet, because it could provide an intruder
    with additional information. A sample entry is shown here:


    ```

    mailmaster IN TXT "Connected directly to 192.168.23.23 firewall"

    ```


    +   Well-Known Services (WKS)—This record describes the well-known services that
    are supported by a protocol on a particular server. For security purposes, it
    is not recommended to include this type of record, especially if the server is
    connected to the Internet, because it could provide an intruder with the necessary
    information to attack the server. Most sites do not use this record, but you should
    be aware of its existence. A sample entry is shown here:


    ```

    mailmaster IN WKS 192.168.28.78 TCP (smtp rpc)

    ```


    +   Pointer (PTR)—This type of record is used for reverse hostname—that is, when
    you want to find the IP address for a specified hostname. Typically, zone files
    used for reverse resolution append the .rev extension to the filename so that
    they are easily distinguishable. A special zone is used for reverse resolution,
    namely in-addr.arpa. The two sample entries shown here are equivalent, one using
    a relative address and one using the full address:


    ```

    68 IN PTR mailmaster

    68.28.168.192.in-addr.arpa. IN PTR mailmaster

    ```


    Note that the first entry includes the host portion of the address because the
    remainder is automatically inserted. The second address is specified in full,
    but you should note that it is entered in reverse order with the in-addr.arpa.
    domain name appended to it, including the trailing-(dot).


    # Configuring a Secondary DNS Server


    The configuration of a secondary DNS server is similar to that of a primary DNS
    server, although there are some important differences:'
