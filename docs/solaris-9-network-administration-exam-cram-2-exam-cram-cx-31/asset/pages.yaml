  md: '# Zones


    A zone represents the extent of the authority of a name server. A single DNS name
    server might manage a single domain, or it might include a number of subdomains.
    A DNS name server maintains its own zone files, which are referenced when a resolution
    request is received from a client. Figure 10.1 shows a conceptual picture of an
    organization, xyz.com—this is the domain name that would be registered on the
    Internet. There are four subdomains: accounts, marketing, systems, and staff.
    The top-level domain and the accounts subdomain are part of the same zone of authority;
    the other three subdomains are located in their own zone of authority.


    ![](img/b8864f367e279929da7f8395589b04dd_213_0.png)


    **Figure 10.1** DNS zones of authority.


    If a query is received for a host in the systems.xyz.com subdomain, it is passed
    to the DNS server responsible for the zone. The server responsible for xyz.com
    does not answer the DNS request because it is outside the server''s authority.


    # DNS Server Types


    There are a number of DNS server types, which carry out different functions within
    the DNS namespace. The most common types are root, primary, secondary, caching-only,
    and forwarding servers:


    +   * *Root—These servers maintain the data about the top-level domains. There
    are currently 13 root servers on the Internet. A list of the root servers can
    be obtained on the Web from http://ftp.rs.internic.net/domain/named.root.*


    +   * *Primary—Every DNS zone requires a primary server to act as the master.
    There is normally only one primary server in a zone. You can have*'
  merge: -1
  pgno: 213
- img_proc: true
  md: 'more than one, but there is a corresponding administration overhead and a greater
    risk of errors. Primary servers specifically:


    +   - Specify the delegation of authority for subdomains.


    +   - Are the place where all changes are made to the zone, such as the addition
    of a secondary server.


    +   - Are the authoritative servers for the specific zone.


    +   - Provide updates to secondary servers and synchronize the information held
    on them.


    +   - *Secondary*—These servers act as a backup for the primary server and are
    updated, through zone transfers, by the primary server. There can be multiple
    secondary servers in a domain.


    +   - *Caching-only*—DNS servers cache the information they receive on domains
    for which they have no authority. A caching-only server does not have any authority
    for any domain, providing only cached information about the most commonly accessed
    namespace queries. Caching-only servers reduce the overhead of a secondary server
    because there are no zone transfers from the primary server.


    +   - *Forwarding*—A forwarding server is used when a query requires off-site
    resolution; that is, it can''t be resolved by the local DNS servers because it
    is remote.


    Forwarding servers have the following features:


    +   - Handle all remote queries.


    +   - They build up a cache of remote queries, so that frequently used queries
    can be answered very quickly.


    +   - They are simple to set up—a directive in the configuration file is all that''s
    needed.


    +   - If the forwarder fails to respond with an answer, the local DNS server proceeds
    to contact remote servers itself, unless the forward only directive is used, which
    prevents local name servers from contacting remote servers.


    ![](img/b8864f367e279929da7f8395589b04dd_214_0.png)


    Two terms that could come in the exam are **recursive DNS** and **Iterative DNS**.
    Recursive DNS refers to a query that is sent to a DNS server, and if it is not
    resolved locally, the server will contact further servers until it is resolved.
    In other words, "Here''s a query—you do all the work." With iterative, if a query
    is not resolved by the DNS server, either the address of another DNS server to
    try is returned or an error message returned, but no further searching is carried
    out by the server. In other words, "Here''s a query—give me your best answer and
    I''ll do all the work."'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# Name Resolution


    DNS resolution is done in several steps, all of which are transparent to the DNS
    client making the request. The following list outlines the steps to resolving
    a client request.


    +   1. A client issues a command, or query, that requires name-to-address resolution,
    such as ping com.com.


    +   2. The name service switch file, /etc/nswitch.conf, is referenced for the
    search order and name service to use. This file determines whether not DNS is
    used. The following entry


    ```

    hosts:      dns

    ```


    signifies that the local /etc files should be searched first and then DNS should
    be used if the local files do not provide the resolution.


    +   3. Assuming the local /etc/inet/hosts file did not answer the query, the local
    DNS server is consulted.


    +   4. The client consults the file /etc/resolv.conf to determine the IP addresses
    of up to three name servers to contact.


    +   5. The client sends a recursive DNS query to the server. This means that DNS
    will continue to recurse the query if it doesn''t have the information itself.
    The local DNS server will contact remote servers on the client''s behalf.


    +   6. The local DNS server checks its own cache to see whether the query has
    been resolved recently. If it can''t resolve the query itself, it sends an iterative
    request to one of the root DNS servers. The iterative request states that the
    root server should simply return any information it has and not pursue the query
    itself. The local DNS server will continue to try to resolve the query, not the
    root server.


    +   7. The root server normally responds with the IP address of another server
    to contact. This server is sent an iterative request. The response is the IP address
    that resolves the query, the IP address of another server to try, or an error
    message stating that no information could be found.


    +   8. The process continues until, eventually, the IP address is returned to
    the local DNS server, and subsequently returned to the client. If the IP address
    cannot be found, an error message is issued to the client.'
  merge: -1
  pgno: 215
- img_proc: true
  md: '# Configuring a Primary DNS Server


    To configure a DNS server, you must first gather the necessary information to
    be able to provide a service. This includes:


    +   - The names and IP addresses of root servers, if connected to the Internet.
    If your organization is not connected to the Internet, then you still need to
    know the names and addresses of root servers for the organization.


    +   - The names and IP addresses of any DNS servers to which authority is delegated—in
    other words, subdomains that are not part of the zone of responsibility for this
    server.


    +   - Hostnames and IP addresses of all hosts for which this server is going to
    be the authority. This information is used when name-to-address resolution is
    required.


    +   - Reverse lookup information for all hosts for which this server is going
    to be the authority. This information is used when address-to-name resolution
    is required.


    The .named process is started at boot time to provide DNS services. The startup
    script that initializes DNS is `/etc/rc2/s2inetsvc`. The process is started only
    if the configuration file, `/etc/named.conf`, is present. `/etc/named.conf` is
    the main configuration file for a DNS server and does not exist by default: It
    must be created manually. `/etc/named.conf` does the following:


    +   - Identifies the DNS server and its function (that is master, slave, cache,
    and so on).


    +   - Specifies the zones of authority for the server.


    +   - Specifies the pathname of the file that contains details of the root servers.


    +   - Contains security information for the zones of authority so that restrictions
    can be enforced to limit zone transfers of data to secondary servers, for example.


    +   - Specifies the pathnames of the zone data files.


    > You should note that in the `/etc/named.conf` file, domain names do not contain
    a trailing . (dot) in the zone name. The trailing dot is required in the zone
    file itself, but not in this file. Inserting the dot in this file is a common
    mistake.


    ![](img/b8864f367e279929da7f8395589b04dd_216_0.png)'
  merge: -1
  pgno: 216
- img_proc: true
  md: "# Chapter 10\n\nA sample /etc/named.conf file is shown here for a master DNS\
    \ server:\n\n```\nultra10# cat /etc/named.conf\noptions {\n  directory \"/var/named\"\
    ;\n}\nnacl \"slaves\" {\n  192.168.28.0/24 };\n}\n\nzone \".\" in {\n  type hint;\n\
    \  file \"named.ca\";\n}\n\nzone \"xyz.com\" in {\n  type master;\n  file \"db.xyz\"\
    ;\n  allow-transfer {\\slaves\";\n}\n\nzone \"28.168.192.in-addr.arpa\" in {\n\
    \  type master;\n  file \"xyz.rev\";\n}\n\nzone \"0.0.127.in-addr.arpa\" in {\n\
    \  type master;\n  file \"named.local\";\n}\n```\n\nNote the following about the\
    \ preceding code:\n\n+   - Under the options directive, a directory is specified,\
    \ /var/named. This is the default location for all the data files for the DNS\
    \ server.\n- A special domain called . (dot) identifies the root DNS servers and\
    \ the filename that contains their names and addresses—the default filename to\
    \ use for this is named.ca, although any meaningful name can be used if you wish.\
    \ Note that the type for this entry is hint because the DNS server connects one\
    \ of the root servers listed in this file to obtain a current list of root servers,\
    \ which is then held in the server's cache. The filename is not consulted again\
    \ until the cached list reaches its expiry time, when the data is refreshed.\n\
    - This is a master (primary) DNS server, as depicted by the type master directive\
    \ for each of the files listed. A secondary DNS server would have each of these\
    \ values set to slave.\n- An access control list has been created that uses the\
    \ aliases, which is referred to later in the file. It enables IP addresses to\
    \ be grouped together for ease of reference."
  merge: -1
  pgno: 217
