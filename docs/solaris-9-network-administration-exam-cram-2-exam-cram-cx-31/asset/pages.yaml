  md: '# Chapter 1


    The first part of this chapter is a stepping stone to the rest of the book. It
    introduces some of the fundamental building blocks of a local area network (LAN)
    and the hardware used in creating one. The second part of this chapter concentrates
    on Ethernet, the most prevalent network protocol in use today, ending sections
    on gathering network statistics and troubleshooting problems that may be encountered
    on an ethernet network.


    The exam often contains a few questions that require you to match a number of
    working elements with their associated descriptions, so knowledge of the terms
    introduced here, and in the Glossary, is an easy way to gain an extra point, but
    you have to get all right to get the point.


    ![](img/b8864f367e279929da7f8395589b04dd_37_0.png)


    # Network Topologies


    The topology of a network refers to how the physical layout is organized—that
    is, how the nodes on the network are physically wired together. Some topologies
    are cheaper than others; some require more maintenance; and some have single points
    of failure, making them less reliable and robust. When designing a network, it
    is important to consider how big the network is going to be, the levels of traffic,
    and whether any failover requirements exist. Each of these aspects influences
    the decision of which topology to use. The following sections describe some of
    the more common topologies.


    # Bus Topology


    In a bus topology, hosts are connected to a single cable—also known as a backbone—that
    runs through an area. Each end of the bus is terminated to avoid data signals
    being reflected back along the network. This type of configuration makes maintenance
    difficult because the network cabling must be disconnected to add a new connection.
    The bus itself is also a single point of failure—a fault on the bus renders the
    whole network unusable—but it is a cheap option and easy to install for smaller
    networks. The bus topology is normally used in broadcast networks, allowing only
    one host to transmit at a time. Figure 1.1 shows an example of a typical bus configuration.'
  merge: -1
  pgno: 37
- img_proc: true
  md: '![](img/b8864f367e279929da7f8395589b04dd_38_0.png)


    Figure 1.1 A bus configuration.


    # # Star Topology


    The *star* topology is the most common topology, mainly because it is cheap to
    install and easy to maintain. The hosts are connected to a central *hub*, which
    enables new hosts to be added without the need to interrupt the network''s functionality.
    The number of hosts, or nodes, that can be used in a star network is limited by
    the number of connections on the central hub, although multiple hubs can be connected
    together to form larger networks. As with the bus configuration, a single point
    of failure, the hub itself does exist. Figure 1.2 shows an example of a simple
    star network.


    ![](img/b8864f367e279929da7f8395589b04dd_38_1.png)


    Figure 1.2 A star configuration.'
  merge: -1
