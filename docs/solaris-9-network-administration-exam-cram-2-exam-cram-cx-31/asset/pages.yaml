  md: '# Exam Prep Questions


    # Question 1


    ```

    Which two protocols operate at the Transport layer of the TCP/IP model?

    Choose 2.

    - A. ICMP

    - B. TCP

    - C. IP

    - D. UDP

    - E. HTTP

    ```


    Answers B and D are correct because TCP and UDP are both protocols that operate
    at the Transport layer of the TCP/IP model. Answers A and C are incorrect because
    ICMP and IP are both protocols that operate at the Internet layer of the TCP/IP
    model. Answer E is incorrect because HTTP is a protocol that operates at the Application
    layer of the TCP/IP model.


    # Question 2


    ```

    Which of the following are characteristics of UDP? Choose 2.

    - A. UDP has a high overhead.

    - B. UDP is designed for applications that require a reliable Transport Layer
    mechanism.

    - C. UDP is designed for applications that run on reliable networks.

    - D. UDP is a connectionless, stateless, and unreliable protocol.

    ```


    Answers C and D are correct because UDP is designed for applications that run
    on reliable networks and it is a connectionless, stateless, and unreliable protocol.
    Answer A is incorrect because UDP has a low overhead. Answer B is incorrect because
    TCP, not UDP, is designed for applications that require a reliable Transport layer
    mechanism.'
