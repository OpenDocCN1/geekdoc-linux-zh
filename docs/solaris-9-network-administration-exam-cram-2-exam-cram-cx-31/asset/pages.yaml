    the IPv6 multipathing mechanism. Answer A is incorrect because this would modify
    the IPv4 network and not the IPv6 interface. Answer C is incorrect because IPv6
    multipathing does not require the interface to be marked as deprecated. Answer
    D is incorrect because the syntax is wrong— the interface name must be entered
    immediately following the syntax ifconfig com- mand, as the first argument.


