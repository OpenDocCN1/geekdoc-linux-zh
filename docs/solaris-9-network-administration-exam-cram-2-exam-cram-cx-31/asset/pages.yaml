  md: '# Question 3


    +   In an IP datagram header, what does the flag field DF mean?

    - A. Indicates that this datagram is a fragment.

    - B. Identifies the location of the fragment in the datagram.

    - C. Indicates that this datagram should not be fragmented.

    - D. Indicates that the flag is not used.


    Answer C is correct because the use of the DF flag indicates that the IP datagram
    should not be fragmented. The main reason for this is that the destination is
    not capable of reassembling the fragments. Answer A is incorrect because this
    is the description of the MF flag. Answer B is incorrect because the location
    of a fragment in an IP datagram is identified by the fragment offset field. Answer
    D is incorrect because this flag field is used.


    # Question 4


    +   This protocol is used at the Internet layer of the TCP/IP model to send control
    and error messages. Which protocol is being described?

    - A. IP

    - B. ICMP

    - C. TCP

    - D. UDP


    Answer B is correct because the Internet Control Message Protocol (ICMP) sends
    control and error messages at the Internet layer of the TCP/IP model. Answer A
    is incorrect because IP is a protocol that handles connectionless delivery and
    fragmentation at the Internet layer of the TCP/IP model. Answers C and D are incorrect
    because TCP and UDP are Transport layer protocols.


