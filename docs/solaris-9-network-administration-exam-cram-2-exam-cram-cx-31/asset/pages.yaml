  md: '# IPv4 Routing


    Terms you''ll need to understand:


    +   - Classless Interdomain Routing (CIDR)

    - Default route

    - Dynamic route

    - Distance vector routing protocol

    - IP forwarding

    - Link-state routing protocol

    - Router Discovery Protocol (RDISC)

    - Router Information Protocol (RIP)

    - Route table

    - Static route


    Concepts you''ll need to master:


    +   - Explain the purpose and usage of routing types (direct and indirect), routing
    schemes (static and dynamic), and routing protocol types (autonomous systems,
    interior routing protocols, and exterior routing protocols).

    - Given a routing table example, describe table entries, identify the routing
    table search order, and associate a network name to a network number.

    - Explain how to configure static and dynamic routing, and the configuration of
    routing at boot time.

    - Describe the operation of CIDR.

    - Given a routing scenario problem, troubleshoot the router configuration and/or
    network names and select a resolution.'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'Routing is fundamental to any TCP/IP network because it provides the facil-ity
    to forward datagrams to hosts on a different network. When networks are connected
    together, there must be a mechanism to route data packets to the other networks.
    Routing accomplishes this. Routing occurs at the Internet layer of the TCP/IP
    model.


    # Routing Types


    Solaris uses a memory-based table to store information on how to route packets
    to different destinations. There are two types of route—direct and indirect:


    +   *Direct*—A direct route exists when two (or more) hosts are connected to the
    same physical network and the two hosts can exchange information without any other
    device involved. If you wrote a letter, for exam-ple, to your next neighbor, you
    would simply deliver the letter to the house; there would be no need to involve
    the postal system.


    +   *Indirect*—An indirect route exists when two (or more) hosts are not con-nected
    to the same physical network. For communication to take place, an intermediate
    device is required that is connected to both the source and destination networks.
    If you wrote a letter, for example, to a friend in another state, you would use
    the postal system to deliver the letter because the postal system knows how to
    get the letter to the destination and can do so efficiently.


    The routing table is populated with entries that determine how to forward packets
    to the destination. The entries can be either static or dynamic, as described
    here:


    +   *Static*—Static routes, as the name implies, are permanent entries in the
    routing table. These entries can only be removed manually. A number of static
    routes are added to the routing table when a system boots; these are for networks
    that are directly connected to the installed network inter-faces, the multicast
    address, and the loopback address. You can add other static routes to non-local
    networks by using the command line, but they do not persist across reboots of
    the system and have to be added again when the system comes back up. A disadvantage
    of static routes is that, because of the fixed nature of these routes, communication
    with the des-tination host or network can be lost by the failure of the device
    being used to route the packets.'
  merge: -1
  pgno: 143
- img_proc: true
  md: 'Dynamic—Dynamic routes, as the name implies, can change depending on information
    provided by processes as in-route and in-disc, both of which are discussed later
    in this chapter. The routing table is updated regularly with information about
    networks that can be reached—this information is received from other routers advertising
    known routes on the network. Dynamic routing has the advantage of providing resilience
    when more than one route exists between two destinations, because if one becomes
    inaccessible, the other is used automatically. Using dynamic routing, routers
    advertise on the network about networks they know about. Other hosts on the network
    “listen” to these advertisements and update their own routing tables according
    to the latest information.


    # # Types of Routing Protocol


    When describing types of routing protocols, it is first necessary to understand
    the concept of an autonomous system. Autonomous systems are best defined as collections
    of routers and networks that come under a common administrative control. An autonomous
    system could comprise a routing domain, such as a university campus. It is also
    sometimes called a routing domain and is identified by a globally unique 16-bit
    number—assigned by the Internet Corporation for Assigned Names and Numbers (ICANN).
    The 16-bit number is often called an Autonomous System Number (ASN). There are
    two types of routing protocols: interior routing protocol and exterior routing
    protocol:


    +   - Interior routing protocol—Interior routing protocols are used to route packets
    within an autonomous system, such as the departments of an organization. Two protocols,
    Routing Information Protocol (RIP) and Open Shortest Path First (OSPF), are the
    most common examples of IGPs, and have the following characteristics:


    +   - Routing Information Protocol (RIP)—RIP is a distance-vector protocol that
    uses the number of hops to calculate the path to the destination. Using RIP, the
    entire routing table is passed to the closest neighbor, by default every 30 seconds.
    The process continues until each node contains the same network information, making
    it much slower to propagate changes to the route configuration because the entire
    routing table is transmitted each time a change occurs. RIP works well in smaller
    networks, but for larger networks, it can greatly increase the network traffic
    and affect the network''s performance.'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'Open Shortest Path First (OSPF)—OSPF is a link-state protocol that maintains
    a complex knowledge of the network topology. Information concerning the state
    of the network is exchanged between routers by a link-state advertisement (LSA).
    OSPF uses other information in addition to hop counts to determine the best route
    to a destination. A major difference from RIP is that when changes occur, it is
    not the entire routing table that is sent to other hosts, but only the changed
    part. As soon as a change is detected, the LSA is triggered, which means routing
    tables can be updated to reflect the change more quickly than they would with
    RIP.


    Exterior routing protocol—Exterior routing protocols are used to route packets
    between autonomous systems, such as between organizations or universities. The
    two main exterior routing protocols are Exterior Gateway Protocol (EGP) and Border
    Gateway Protocol (BGP):


    Exterior Gateway Protocol (EGP)—EGP is used to exchange routing table information
    in a network of autonomous systems. Each router polls its neighbor at regular
    intervals (approximately every five minutes) and the neighbor''s response consists
    of its entire routing table, which is similar to what happens with RIP. The routing
    table contains known routers and the addresses that the routers know about. Also
    included is a cost metric so that the optimal available route can be used for
    exchange data. The latest version of EGP is EGP-2, although EGP has been largely
    replaced by the Border Gateway Protocol (BGP) described next.


    Border Gateway Protocol (BGP)—BGP is a more recent exterior routing protocol from
    EGP and, like EGP, is used to exchange routing table information between autonomous
    systems. Like the interior routing protocol OSPF, BGP exchanges only the routing
    table changes, and not the entire routing table, as EGP makes use of Classless
    InterDomain Addresses (CIDR), which are described later in this chapter and allow
    more addresses to be assigned within the network than are available with IPv4.
    The latest version of BGP is BGP-4, which allows the metrics assigned to a route
    to be configured by the network administrator.


    # The Routing Table


    At the heart of IPv4 routing is the route table, which contains a number of entries
    detailing how to get to various destinations. The route table is'
  merge: -1
  pgno: 145
