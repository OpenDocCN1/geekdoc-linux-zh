  md: '# Broadcast IPv4 Addresses


    There is a class E IPv address type where the first octet is 240 or above. This
    address class is currently reserved and cannot be assigned for normal use on a
    Solaris system.


    A broadcast address is one in which data is transmitted to all systems on the
    LAN at the same time, using a reserved host address for each network. In binary,
    the host address is all 1s; in decimal it is 255. The default broadcast addresses
    for each unicast IPv4 address type are as follows:


    +   * Class A—The leftmost octet identify the network address, for example 10.
    The default broadcast address for this network is 10.255.255.255.


    +   * Class B—The leftmost two octets identify the network address, for example
    172.16. The default broadcast address for this network is 172.16.255.255.


    +   * Class C—The leftmost three octets identify the network address, for example
    192.168.1. The default broadcast address for this network is 192.168.1.255.


    The broadcast address 255.255.255.255 is a special kind of broadcast address because
    it refers to all hosts on all networks, not just the hosts on your own particular
    network. Using this address is not recommended because you can flood the network
    with excessive, unwanted traffic, especially if a host is connected to the Internet.


    # Subnets and Network Masks


    A network address can be subdivided into a number of smaller networks, called
    subnetworks. The reasons that an organization might want to do this include the
    following:


    +   * To provide additional security by limiting access to a subnetwork of hosts


    +   * To make better, more effective use of the assigned IPv4 address range


    +   * To divide administrative domains into smaller logical units


    +   * To reduce the network traffic by isolating subnetworks


    +   * To associate a subnetwork with a specific organizational department, based
    on geographical location, or function within the organization'
