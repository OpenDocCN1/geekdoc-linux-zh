    \ D. dhcpagent\n E. pntadm |\n\nAnswers A and C are correct because dhcpconfig\
    \ is a command-line utility used to configure a DHCP server and dhcpmgr is a graphical\
    \ (GUI) utility used to carry out the same process. Answer B is incorrect because\
    \ in.dhcpd is the process that runs on a DHCP server when it has been configured.\
    \ Answer D is incorrect because dhcpagent is the process that runs on a DHCP client\
    \ when it has been configured. Answer E is incorrect because pntadm is a command\
    \ that manages the DHCP network table and is typically used to add, modify, or\
    \ remove IP addresses managed by DHCP.\n\n# Question 2\n\n| Which file would be\
    \ created on a client with hme0 network interface to enable it to use DHCP with\
    \ a dynamically assigned hostname when it is rebooted |\n A. /etc/default/dhcpagent\n\
    \ B. /etc/dhcp.hme0\n C. /etc/hostname.hme0\n D. /etc/inet/dhcpsvc.conf |\n\n\
    Answer B is correct because you would create the file /etc/dhcp.hme0 to enable\
    \ DHCP with a dynamically assigned hostname. Answer A is incorrect because /etc/default/dhcpagent\
    \ is the file that controls the behavior of the dhcpagent process on a DHCP client.\
    \ Answer C is incorrect because /etc/hostname.hme0 is the file that is used to\
    \ configure the primary network interface and would be used only if a specific\
    \ hostname were being specified, not a dynamically assigned one. Answer D is incorrect\
    \ because /etc/inet/dhcpsvc.conf is the DHCP server configuration file."
