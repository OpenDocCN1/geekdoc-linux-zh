- img_proc: true
  md: '# Chapter 5


    A further feature of Sun Trunking is that it supports load balancing across the
    physical interfaces that make up the trunk, or fat pipe. It distributes the network
    traffic, however, according to a trunking policy, an algorithm determines the
    transmission path—a policy is selected by the system administrator when trunking
    is configured. Sun Trunking supports four trunking policies: MAC, Round robin,
    IP destination, and IP source/IP destination.


    > Sun Trunking supports load balancing on outbound traffic only. There is no load
    balancing on inbound traffic.


    ![](img/b8864f367e279929da7f8395589b04dd_135_0.png)


    # MAC


    This is the default policy used for Sun Trunking and the preferred one to use
    when the interfaces connect to a switch. Remember that the switch must be capable
    of supporting trunking. This policy uses the last three bits of both the source
    and destination ethernet addresses to ensure the data is evenly distributed across
    the available physical interfaces. This policy is the best to use when a large
    number of clients is being supported.


    # Round Robin


    This policy uses each physical interface of the trunk, in turn, to evenly distribute
    the traffic. It is the preferred policy to use when a server is connected to another
    server (that is, not through a switch), which is also known as a back-to-back
    configuration. This policy is ideal for data warehousing, where large amounts
    of data are transferred between servers, and also for backup servers, where a
    fast connection is required to back up a number of servers to a central backup
    server.


    # IP Destination


    This policy uses the four bytes of the destination IP address to determine which
    physical interface is used for transmission. It is the preferred policy to use
    when a server has multiple clients that are connected to the same router.


    # IP Source/IP Destination


    This policy is the preferred policy to use if the system is part of a cluster—for
    example, where multiple logical (or virtual) interfaces are used for a physical
    interface. The policy uses the four bytes of both the source and destination IP
    addresses to determine which physical interface is used for transmission. If a
    failure occurs on a given interface, the logical IP address will failover to a
    physical interface on a different system in the cluster, providing much higher
    availability.'
  merge: -1
