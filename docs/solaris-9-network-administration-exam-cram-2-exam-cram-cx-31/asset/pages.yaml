  md: "# Chapter 4\n\nThe Internet Protocol (IP) is delivered with the Solaris 9 release\
    \ as part of the operating system kernel and operates at the Internet layer of\
    \ the TCP/IP model. This chapter concentrates on the fundamental aspects of IP,\
    \ including the address structure, subnetworkworking, and how to configure and\
    \ troubleshoot network interfaces.\n\n> Since the emergence of IPv6, there has\
    \ been a tendency to describe the existing functionality as IPv4. You should be\
    \ aware that IP, on its own, without a version descriptor, refers to IPv4.\n\n\
    # The Internet Layer Protocols\n\n+   IP consists of the following protocols:\n\
    \n\n≥ IP—The Internet Protocol which has two main functions:\n  - The delivery\
    \ of datagrams across the network. The delivery mechanism is connectionless because\
    \ there is no direct connection made between the sender and the receiver.\n  -\
    \ The splitting up of application data into smaller units, based on the maximum\
    \ transfer unit (MTU) of the network interface, to fit into an Ethernet II frame.\
    \ This is known as *fragmentation*. IP also handles the reassembly of these fragments,\
    \ after they have been transmitted across the network, in ethernet frames.\n\n\
    +   ≥ IGMP—The Internet Group Management Protocol, which enables a computer to\
    \ advertise its multicast group membership to routers on the network.\n\n≥ ICMP—The\
    \ Internet Control Message Protocol, an integral part of IP that is used to send\
    \ error and control messages to other hosts on the network. ICMP communicates\
    \ using IP and is often used as an invaluable means of diagnosing network problems.\n\
    Some of the more common ICMP messages include:\n\n  ≥ Echo request—The request\
    \ sent by the `ping` command.\n  ≥ Echo reply—The reply from a `ping` command.\n\
    \  ≥ Destination unreachable—No route to the specified destination host (or port)\
    \ can be found.\n  ≥ Network unreachable—No route to the specified network can\
    \ be found."
