  md: '# Chapter 4


    +   - Loose source routing—Specifies a list of routers that must not be missed.

    - Record route—Specifies that each router must append its own IP address.

    - Timestamp—Specifies that each router must append its own IP address and also
    append a timestamp.


    An IPv4 datagram consists of a header and some data. The data portion of the datagram
    can consist of a TCP segment, a UDP datagram, an ICMP message, or an IGMP message.


    # Interface Configuration


    System and network administrators regularly use three main network interface configuration
    files. The use of configuration files enables changes, or additions, to persist
    across reboots so that the network interfaces are auto-configured when the system
    goes through the boot process. These files are


    +   - /etc/hostname.<interface>

    - /etc/inet/hosts

    - /etc/nodename


    # /etc/hostname.<interface>


    The Solaris installation program configures the primary network interface for
    you. It does this by creating the necessary /etc/hostname.<interface> file. For
    example, if your system has an h0 primary interface, the file /etc/hostname.hme0
    is created and populated with either the hostname or IPv4 address that is associated
    with the interface. When the system reboots, the startup script, /etc/rc.d/S30network.sh,
    configures and enables the interface.


    # /etc/inet/hosts


    The /etc/inet/hosts file provides IPv4 address-to-hostname mapping, so that you
    don''t have to always specify a host by its IPv4 address. It allows normal names
    to be assigned, such as ultra10 or server1. This file also allows aliases and
    comments, permitting a system to have several names.'
