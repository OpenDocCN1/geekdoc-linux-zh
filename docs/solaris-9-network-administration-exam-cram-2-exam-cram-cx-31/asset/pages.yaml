  md: '# The TCP/IP Model


    ARP and RARP are protocols that actually operate between the Network Interface
    layer and the Internet layer, but are generally described as Internet layer protocols.


    # Transport Layer Protocols


    The Transport layer includes the following two protocols:


    +   - Transmission Control Protocol (TCP)—A connection-oriented, stateful, and
    reliable protocol used to exchange data between hosts on a network.


    +   - User Datagram Protocol (UDP)—A connectionless, stateless, and unreliable
    protocol used to exchange data between hosts on a network—the reliability is provided
    by the network itself or the application.


    TCP and UDP are discussed in more detail in Chapter 9.


    # Application Layer Protocols


    A number of protocols are in use at the Application layer, some of which are listed
    here:


    +   - Telnet—Terminal communication between two hosts on a network.


    +   - FTP—The File Transfer Protocol, used for copying files between hosts on
    a network.


    +   - SMTP—Simple Mail Transfer Protocol, used for email transfer.


    +   - POP3—Post Office Protocol version 3, used to allow the remote retrieval
    of email, from the Internet for example.


    +   - DNS—Domain Name System, used to resolve addresses to hostnames. DNS is discussed
    in Chapter 10, “Domain Name System (DNS).”


    +   - DHCP—Dynamic Host Configuration Protocol, used to assign IP addresses to
    hosts automatically. DHCP is discussed in Chapter 11, “Basic DHCP.”


    +   - HTTP—Hypertext Transfer Protocol, used to access data via a Web browser.'
