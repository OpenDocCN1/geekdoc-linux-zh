  md: '# Exam Prep Questions


    # Question 1


    | Which of the following is the ethernet broadcast address used in ARP and RARP
    requests?

    | A. 255.255.255.255

    | B. 08:00:20:11:aa:01

    | C. ff:ff:ff:ff:ff

    | D. 224.0.0.0 |


    Answer C is correct. ff:ff:ff:ff:ff is the ethernet broadcast address used in
    ARP and RARP requests. Answer A is incorrect because this represents a netmask.
    Answer B is incorrect because this is an example of a specific ethernet address
    that would identify a single interface. Answer D is incorrect because this represents
    an IP address used for multicast messages.


    # Question 2


    | Which of the following describes the function of ARP?

    | A. It is used to map a 32-bit IP address to a 48-bit ethernet address.

    | B. It is used to map a 48-bit ethernet address to a 32-bit IP address.

    | C. It is used to map a 32-bit ethernet address to a 48-bit IP address.

    | D. It is used to map a 48-bit IP address to a 32-bit ethernet address.


    Answer A is correct. ARP maps a 32-bit IP address to a 48-bit ethernet address.
    Answer B is incorrect because this describes the function of RARP, not ARP. Answers
    C and D are incorrect because an ethernet address is 48 bits long and an IP address
    is 32 bits long. These answers identify the incorrect lengths.'
  merge: -1
