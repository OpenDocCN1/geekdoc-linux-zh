    \ primary DNS server when the secondary server is configured and started for the\
    \ first time.\n\nThe status of this server for all zone entries in /etc/named.conf\
    \ is slave, except for the root domain.\n\nThere is an extra entry in the /etc/named.conf\
    \ file that identifies the master-server IP address. This specifies from where\
    \ the zone files are to be copied.\n\nIn the previous section, domain xyz.com\
