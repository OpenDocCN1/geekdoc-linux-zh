  md: '# Chapter 4


    3. Reboot the system and the network interface is automatically configured.


    The configuration is permanent and persists across subsequent reboots of the system.


    Sometimes, such as when a company reorganizes, it becomes necessary to change
    a system''s hostname. There are two ways of achieving this:


    +   Run the sys-config command, which will reset the system to its “as-manufactured”
    state and shut down. When you start the system again, you have to re-enter the
    configuration information that was entered when the Solaris operating system was
    installed. You can assign a new hostname at this point. You should note that this
    command does not affect the file systems and data held on disks; only the system
    identification is affected.


