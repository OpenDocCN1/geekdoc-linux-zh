    |---|---|---|

    | -a | arp -a or arp hostname | Displays all entries, or a single entry. |

    | -d | arp -d hostname | Deletes a single entry from the ARP cache. |

    | -t <file> | arp -t file | Adds multiple entries to the cache. Entries must be
