    consulted when the exchange of data between two hosts is required. The netstat
    -r command is used to view the entries in the route table. The following example
    shows the route table for the hostname ultra10:


    ```

    ultra10# netstat -r

    Routing Table: IPv4

    Destination    Gateway         Flags Ref Use  Interface

    ultra-net       ultra10         U      1   177 hme0

    multicast       ultra10         U      1     0 hme0

    sparc-net       ultra-r1         UG    255 hme0

    localhost       localhost       UH     3   635 lo0

