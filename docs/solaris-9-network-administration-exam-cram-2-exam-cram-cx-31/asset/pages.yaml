    # # Reverse Address Resolution Protocol (RARP)


    RARP provides the opposite service to ARP in that it is used when the ethernet
    address is known and the IP address is needed.


    RARP requests are most commonly sent by diskless clients and JumpStart clients
    during bootup. A diskless client contains no local storage and knows only its
    own ethernet address. A JumpStart client contains local storage, uses the ethernet
    address to locate the JumpStart boot server (to start a remote installation of
    the Solaris operating environment). The client uses the RARP protocol to broadcast
    this ethernet address and asks for the corresponding IP address.


    The following output from the sniff command shows a client that is booting. The
    client issues a RARP request to attempt and find its IP address. The server that
    is listening for RARP requests responds. The items of interest are in bold:


    ```

