  md: 'You can see that, depending on which level of detail is required, you can either
    obtain simple, higher-level information, or detailed information about all protocols
    that were used to complete the operation (in this case, a single ping command).


    > snoop can generate a lot of output and will, by default, continue to capture
    packets until you press Ctrl+C (^C) or run out of disk space. Alternatively, you
    can use the -e <maxcount> option on the command line to specify that snoop should
    quit after capturing <maxcount> packets. You should be familiar with the various
    options of snoop. Consult the online manual page for further information.


    It is not always convenient or manageable to display the packet capture results
    to the screen. Instead, you can save the results to a file for offline analysis.
    To do this, use the -o <filename> option of snoop. The saved file will not be
    human readable, but you can load it back into snoop later using the -i <filename>
    option as shown here:


    ```

    # snoop -dme -o /tmp/file.out

    ```


    Then, to read the contents of the saved output file, use the following command:


    ```

    # snoop -i /tmp/file.out

    ```


    If you want to save the information to a text file that can be read like any other
    file, simply redirect the output as follows:


    ```

    # snoop -v dme >> /tmp/snooptmp

    ```


    # ddd


    The ndd utility is used to inspect, and modify if necessary, the network driver
    parameters. Many of the network protocols are implemented as drivers. The main
    ones we are concerned about in this book, however, are arp, tcp, udp, ip (ipv6),
    icmp (icmpv6), and hme/le/afe (depending on the type of ethernet interface installed).


    > Any changes you make to driver parameters using ndd on the command line are
    only until the next reboot. If you want to make the changes permanent, the specific
    ndd commands must be included in a system startup script, as /etc/rc2.d/S69inet,
    or one of your own customized scripts in the /etc/rc2.d directory.


    The ? option to display all the parameters for a given driver, although it is
    typically preceded by a \ character to escape the ? from the shell. Otherwise
    it might be interpreted as a special shell character. As an example, consider
    the hme driver as shown here:'
  merge: -1
