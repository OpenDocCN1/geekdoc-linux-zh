  md: '# Practice Exam #2 Answer Key 353


    then edited to meet the requirements of the local network. Answers A and B are
    incorrect because these files do not exist. Answer C is incorrect because the
    file, /etc/inet/ntp.client, is the template file used by an NTP client to create
    its configuration file.


    # Question 58


    The correct answer is C. The sixth octet, FFFF, in the address indicates that
    an embedded IPv4 address is present in the IPv6 address. Answer A is incorrect
    because c0a8 is the hexadecimal representation of the first 16 bits of the IPv4
    address 192.168. Answer B is incorrect because 1507 is the hexadecimal representation
    of the second 16 bits of the IPv4 address 21.7. The embedded IPv4 address occupies
    the rightmost 32 bits of the IPv6 address. Answer D is incorrect because 0000
    is used as padding.


    # Question 59


    The correct answer is D. The dhcpmgr utility can be found in the directory /usr/sadm/admin/bin.
    Answers A and B are incorrect because the dhcpmgr utility is not found in these
    directories. Answer C is incorrect because /usr/sadm/admin/dhcpmgr is a directory
    containing the Java, and library files required to run dhcpmgr. The utility itself
    is not found in this directory.


    # Question 60


    The correct answer is B. TCP uses a congestion window on the sending side to manage
    the flow of data. If congestion is detected, the size of the congestion is halved
    to reduce the amount of data that is sent across the network. When acknowledements
    are received from the receiving host, the congestion window is doubled in size
    to allow a greater number of packets to be sent across the network. Answer A is
    incorrect because the congestion window is not halved in size when acknowledements
    are received; it is doubled in size. Also, the congestion window is doubled in
    size when congestion is detected; it is halved in size. Answers C and D are incorrect
    because they are not features of the congestion window.'
