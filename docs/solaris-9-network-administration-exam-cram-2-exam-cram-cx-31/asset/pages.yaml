    +   - Classroom Training—Sun offers classroom training, computer-based training,
    and online training that you will find useful to help you prepare for the exam.
    The course SA-399 is the specific course that is most relevant to this exam. The
    classes are quite expensive, although they offer a condensed form of learning
    to help you reinforce your Solaris knowledge. The exam is closely related to the
