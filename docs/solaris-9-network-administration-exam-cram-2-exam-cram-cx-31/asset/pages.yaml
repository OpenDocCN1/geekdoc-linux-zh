- img_proc: true
  md: 'Destination—The destination host or network.


    Gateway—The host or router that is being used to deliver data to an indirectly
    connected destination. When this field displays -, then the destination is on
    the same physical network and therefore a direct route is already known.


    Flags—The status of the route and some characteristics of the route.

    Valid values for this item are as follows:


    +   D—Denotes a route that was dynamically created by an ICMP redirect.


    +   G—Denotes that the route is to a gateway.


    +   H—Denotes that the route is to a host rather than a network.


    +   U—Denotes that the route is up and available.


    If the -a option to netstat was used, some additional flags are also displayed,
    which can be any of the following:


    +   A—Denotes combined routing and address resolution entries.


    +   B—Denotes a broadcast entry.


    +   L—Denotes a local address.


    Ref—This field shows the number of routes that use this network interface.


    +   Use—The number of packets that have used this route.


    Interface—The network interface that is used on the outgoing path to the destination
    host or network.


    When you try to contact another system, whether it is on the local network or
    remote, the routing algorithm carries out a search of the route table in a specific
    order:


    +   1. The local network is first checked for a match to see whether the destination
    host is directly connected. If a successful match is found, then the data is passed
    through the local network interface for delivery.


    +   2. The route table is checked to see whether there is an IP address match
    in the destination field. If a successful match is found, the data is forwarded
    to the IP address designated in the gateway field for route.


    +   3. The route table is checked to see whether there is a network number match
    in the destination field. If a successful match is found, the data is'
  merge: -1
  pgno: 147
- img_proc: true
  md: '# IPv4 Routing 113


    forwarded to the router that is associated with the route. This is not the final
    destination, so the router will have to forward the data on either the destination
    network or another router.


    +   4. The route table is checked to see whether a default route entry is present.
    If the entry exists, then the data is passed to this address for delivery.


    +   5. No route has been found for the data, so an appropriate ICMP message is
    returned, such as Destination network is unreachable.


    # # /etc/inet/networks File


    The /etc/inet/networks file is used to associate network numbers with names, similar
    to the /etc/inet/hosts file that associates host addresses to hostnames. It is
    a convenient way to refer to networks by familiar Names, instead of remembering
    numerous IP addresses. The following is a sample /etc/inet/networks file:


    ```

    ultra10# cat /etc/inet/networks

    ultra-net      192.168.28.0

    tech-net       192.168.42.0

    sysadmin-net  192.168.66.0

    market-net    192.168.145.0

    ```


    If you need to add static routes to the routing table, then using this file enables
    you to use the familiar names—instead of the IP addresses—to add the route entries.


    > The file /etc/networks is a symbolic link to /etc/inet/networks and is included
    for BSD compatibility. The actual file is /etc/inet/networks, so be aware of this
    because it is a frequent exam question.


    ![](img/b8864f367e279929da7f8395589b04dd_148_0.png)


    # # Static Route Configuration


    Static routes are permanent entries that do not change. They can be configured
    in two ways: manually using the route command, or through the use of two configuration
    files, /etc/defaultrouter and /etc/gateways. This section covers the use of the
    route command. The configuration files are discussed later in this chapter.'
  merge: -1
