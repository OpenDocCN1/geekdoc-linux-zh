  md: '# Question 5


    You have a client that is going to use DHCP as its means of obtaining an IP address.
    The client has an hme0 network interface and is going to specify a particular
    hostname to use—ultra99. Which of the following entries would you add to the /etc/hostname.hme0
    file to achieve this?


    +   A. ultra99

    B. dhcp ultra99

    C. hostname ultra99

    D. inet ultra99


    Answer D is correct because the file /etc/hostname.hme0 would have the entry inet
    ultra99 added to it to request the use of hostname ultra99. Answer A is incorrect
    because the entry ultra99 would specify the hostname, but would not use DHCP to
    configure the interface. Answers B and C are incorrect because these entries are
    invalid for this file.


    # Question 6


    Which option to the dhcpconfig command is used to initially configure a DHCP server?


    +   A. -D

    B. -N

    C. -U

    D. -C


    Answer A is correct because the -d option is used to initially configure the DHCP
    service on a server. Answer B is incorrect because the -N option is used to define
    a network that the DHCP server is to manage. Answer C is incorrect because the
    -u option is used to unconfigure a DHCP server. Answer D is incorrect because
    the -c option is used to convert an existing datastore to a different format.'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# Question 7


    When a DHCP client is booted, it sends a message to locate a DHCP server and request
    an IP address. Which of the following message types is sent, response, by the
    DHCP server with details of an IP address that is available to be leased?


    A. DHCPPREREQUEST

    B. DHCPPACK

    C. DHCPOFFER

    D. DHCPDISCOVER


    Answer C is correct because the DHCPOFFER message type is returned by a DHCP server
    offering an IP address for the client to lease. Answer A is incorrect because
    the DHCPREQUEST message type is sent by the DHCP client in response to a DHCPOFFER
    server. This request accepts the offer made by the DHCP server. Answer B is incorrect
    because the DHCPPACK message type is sent by the DHCP server acknowledging the
    client''s acceptance of an offer. Answer D is incorrect because the DHCPDISCOVER
    message type is sent by a booting DHCP client to locate a DHCP server and request
    an IP address.'
  merge: -1
  pgno: 265
