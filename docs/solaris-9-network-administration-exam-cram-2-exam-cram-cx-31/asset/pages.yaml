  md: 'Chapter 1, "Local Area Networks," introduced some fundamental networking concepts
    you need to understand to progress through the rest of this book. This chapter
    builds on the previous one and describes the TCP/IP network model, which is the
    most commonly used family of protocols across the Internet. The TCP/IP model is
    a layered model. In this chapter, you''ll see how the layers fit together to provide
    a complete communication service as well the protocols that are used in each layer
    of the model.


    The ISO/OSI 7 Layer Reference Model is not discussed in any detail in this exam
    as it is not specifically required for the Solaris 9 Network Administrator exam.
    It is assumed, however, that the reader possesses a basic familiarity with this
    model, for comparison purposes only. This chapter contains a small section outlining
    the differences between the two models, and the "Need to Know More" section at
    the end of this chapter identifies a reference for additional reading about the
    ISO/OSI Reference Model.


    ![](img/b8864f367e279929da7f8395589b04dd_71_0.png)


    # The TCP/IP Protocol Stack


    The TCP/IP model is an example of a protocol stack, that is, a number of protocols
    that work together in a well-defined hierarchy, to provide communications between
    devices on a network, and is the mechanism used by the Solaris operating environment.
    You saw in the previous chapter that a protocol is a set of rules that govern
    how data communication takes place. A protocol stack, such as this, is hierarchical
    in the overall structure of the model itself. The structure contains a number
    of layers, each carrying out a separate function, and each function is subjected
    to certain rules about how the function is executed—the protocol.


    A protocol stack has the following properties:


    +   * Each layer exists to carry out a specific function.

    * Each layer is present on both the sending host and the receiving host.

    * Each layer communicates with its opposite number (peer) on another host, following
    well-defined procedures.

    * Each layer on a host is independent of the other layers on the same host; the
    relationship is with its peer layer on another host—the application layer on host
    A is a peer of the application layer on host B, for example.


    So, for communication to take place between two hosts, there are a number of sequential
    steps that must be followed; think of these steps as the layers.'
  merge: -1
  pgno: 71
- img_proc: true
  md: '# The TCP/IP Model


    There are several advantages in using a layered model:


    +   - The format of the data, how the data is actually transmitted, the transport
    mechanism used, and the route taken by the data are broken down into several functions
    (layers), thereby simplifying the issue of communicating across a network.


    +   - Standards exist, allowing a common approach to be taken by hardware and
    software suppliers.


    +   - Modifications can be made to one of the layers without affecting the whole
    model because each layer is independent of the other layers.


    +   - The modular structure of the layers makes resolution of problems easier
    because a problem will point to a specific layer or function.


    Consider this simple example:


    When you write a letter to someone (this is the application), you are interested
    only in the letter getting there in one piece and the response is (the Transport
    layer). You don''t have any interest in which specific route the delivery takes
    (the Internet layer), or in which postman delivers the letter (the Network Interface
    layer)—that is the responsibility of the postal service or courier (the Application
    layer).


    # The Layers of the TCP/IP Model


    The TCP/IP model was developed by the U.S. Department of Defense (DoD) in the
    late 1970s. A number of standards have been defined for this model and are listed
    in Request For Comments (RFC) documents. These documents describe the architecture
    and use of the various protocols and layers. The RFCs are listed and can be retrieved
    on the Web at http://www.ietf.org/rfc.html. For example, RFCs 0760 and 0761 describe
    the DoD standard Internet Protocol (IP) and standard Transmission Control Protocol
    (TCP), respectively.


    The TCP/IP model is described as a four-layer model that functions on a common
    hardware platform. The four layers are Application, Transport, Internet, and Network
    Interface. This model has also been commonly described as a five-layer model,
    which treats the hardware layer as a separate layer. This discrepancy arises as
    a result of interpretation, depending on whether the Physical layer is treated
    as part of the Network Interface layer or not.'
  merge: -1
