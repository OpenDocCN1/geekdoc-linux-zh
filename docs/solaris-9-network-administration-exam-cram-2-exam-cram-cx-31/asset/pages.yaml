    You might be asked for alternative ways of finding an ethernet address. The commands
    netstat -i and arp -a also display of ethernet addresses. The local system''s
    ethernet address can also be found using the dmesg command and looking in the
    /var/log/messages file, both of which contain messages from the most recent system
    reboot.


    ![](img/b8864f367e279929da7f8395589b04dd_56_0.png)


    # Collision Rates


    A collision is said to have occurred when more than one host on a network tries
    to send a packet at the same time.


    The netstat -i shows the current level of usage for all ethernet interfaces on
    the local system. To determine the collision rate, apply the following formula:


    ([collisions]) × 100 / total number of output packets


    The following example shows the result of running netsat -i:


    ```

    # netstat -i

    Name Mtu Net/Dest Address Ipkts Ierrs Opckts Oerrs Collis Queue

    lo0 8232 loopback localhost 10156 0 10156 0 0 0

    hme0 1500 ultra0 ultra0 14835 0 209364 0 0 0

    ```


    Applying the formula, you would calculate the collision rate as follows the affected
    fields appear as bold text in the previous code:


    (21840 × 100) / 209364 = 10.43


    The result of 10.43 means that 1 in 10 packets being sent across the network is
    resulting in a collision. For an ethernet network running at 10Mbps, the collision
    rate should not be higher than 5%, and it should not be higher than 10 for one
    running at 100Mbps. The numbers in the previous equation were taken from a network
    running at 10Mbps, indicating that a performance problem is being caused by faulty
    or poor network cabling or by the network having too many hosts connected to the
    segment.


    > Remember from earlier in this chapter that a switch forwards only to the port
    on which the host is connected, like a hub, which forwards to all the connected
    ports. Implementing a switch instead of a hub in busy networks with high collision
    rates can drastically improve the performance of the network by reducing the amount
    of network traffic and hence reducing the collision rate.


    ![](img/b8864f367e279929da7f8395589b04dd_56_1.png)'
  merge: -1
