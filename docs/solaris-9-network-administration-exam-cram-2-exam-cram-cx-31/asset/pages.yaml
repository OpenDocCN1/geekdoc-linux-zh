  md: '# Advanced Dynamic Host Configuration Protocol (DHCP) 251


    | Problem Description | Problem Resolution |

    |---|---|

    | The requested hostname has not been configured in the network table for the
    required network. | Use dhcpmgr or pntadm to check the network table and, if necessary,
    add the required hostname. |

    | The DNS server has not been configured to receive updates from the DHCP server.
    | Check the DNS configuration file, /etc/named.conf. There should be an allow-update
    statement with the DHCP server''s IP address. |

    | The DHCP server that has offered an IP address does not know the DNS domain
    name. | On the DHCP server, check the macro that is processed. The DNSdomain symbol
    should contain the correct domain name. |

    | The client is specifying the hostname in FQDN format. | Solaris 9 DHCP does
    not support FQDN format for hostnames. Modify the DHCP request to a short name.
    |


    # # Obtaining a Lease Manually


    When a client is unable to use the normal dynamic mechanism to obtain a lease
    for an IP address, it is worthwhile trying to obtain a lease manually. Use the
    following ifconfig command to do this for a client with hme0 interface: ultra50#
    ifconfig hme0 dhcp


    Verify that lease has been obtained by using the ifconfig command to view the
    interface status. There should now be an IP address assigned to the interface.


    # # Checking Client Status


    At any time you can check the current status of the DHCP client by using the ifconfig
    command on the network interface being managed by DHCP. Execute the following
    command to examine the status of the hme0 interface:


    ```

    ultra5# ifconfig hme0 dhcp status

    Interface State Sent Recv Declined Flags

    hme0 BOUND 2 2 0

    (Began, Expires, Renew) = (06/24/2003 00:41, 06/25/2003 00:41, 06/24/2003 \ 13:03)

    ```


    The State field shows that the interface is BOUND to an address. The lease information
    gives details of when lease for the IP address was assigned, when it will expire,
    and when it can be renewed.'
