  md: '# Local Area Networks 29


    # Exam Prep Questions


    # Question 1


    +   Your network is configured with a central hub that has cables coming from
    it to each host on the network. Which type of network topology is being described?

    - A. Ring

    - B. Bus

    - C. Star

    - D. VLAN


    Answer C is correct because a star network is configured with a central hub that
    has cables coming from it to each host on the network. Answer A is incorrect because
    this topology consists of hosts connected to each other in a loop, with each host
    connecting to its adjacent neighbors. Answer B is incorrect because this topology
    has a single spur, with hosts connected at regular intervals. Answer D is incorrect
    because this topology normally represents multiple networks using a single, central
    intelligent switch. It comprises multiple star networks.


    # Question 2


    +   A host that provides network resources to other hosts on the network is known
    as which of the following?

    - A. Client

    - B. Server

    - C. Router

    - D. Bridge


    Answer B is correct. A server provides network resources to other hosts on the
    network. Answer A is incorrect because this type of host uses the resources provided
    by a server. Answer C is correct because this device is used to connect networks
    together and forwards packets based on IP address. Answer D is incorrect because
    this device is used to connect networks together and forwards packets based on
    the MAC address.'
  merge: -1
  pgno: 64
- img_proc: true
  md: '# Question 3


    Your network is classified as a 10BASE-T network. What is the network media and
    speed of the network?

    * A. Coaxial cable running at 10Mbps

    * B. Twisted-pair cable running at 10Mbps

    * C. Twisted-pair cable running at 100Mbps

    * D. Fiber-optic cable running at 10Mbps


    The correct answer is B because 10BASE-T refers to a twisted pair cable running
    at 10Mbps. Answer A is incorrect because the classification would be 10BASE-2
    or 10BASE-5. Answer C is incorrect because this would be a 100BASE specification.
    Answer D is incorrect because fiber-optic cable runs at a minimum of 100Mbps.


    # Question 4


    Which of the following gigabit network classifications are implemented using fiber-optic
    cable? Choose 2.

    * A. 1000BASE-T

    * B. 1000BASE-X

    * C. 1000BASE-SX

    * D. 1000BASE-LX

    * E. 1000BASE-CX


    Answers C and D are correct because fiber-optic cable is used to implement both
    1000BASE-SX and 1000BASE-LX. Answer A is incorrect because this type of network
    is implemented using Cat-5 twisted-pair cable. Answer B is incorrect because 1000BASE-X
    refers to three implementations and one of them is 1000BASE-CX, which uses copper
    cabling. Answer E is incorrect because this type of network is implemented using
    standard copper cable.'
  merge: -1
