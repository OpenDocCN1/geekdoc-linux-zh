    # Ethernet Interface Statistics


    Various statistics about ethernet interfaces can be displayed to show which ethernet
    interfaces are installed on the local system, the number of packets or frames
    being sent or received, and whether any errors are being encountered. The following
    sections describe each of these:


    # Displaying Installed Ethernet Interfaces


    Use the ifconfig -a command to display all ethernet interfaces that are present
    on the local system. This includes physical and pseudo interfaces, such as the
    loopback device. Remember that, if you run this command as a non-root user, the
    ethernet addresses will not be displayed. The following example shows the result
    of running ifconfig -a as a root on a system with one physical interface installed,
    namely home0:'
