  md: '# Uninstalling a DHCP Server


    If DHCP is no longer required, or you wish to remove the DHCP server from your
    system, you can use the dhcpconfig command to uninstall the server and optionally
    remove the host entries and the DHCP database tables as shown here:


    ```

    ultra1# dhcpconfig -U -h -f

    ```


    The options are described here:


    +   * -u— This is the option to uninstall the DHCP server.

    * -f— This sub-option states that no confirmation of the operation is required.
    If this sub-option is omitted, you get a confirmation message to reply to before
    the DHCP server is removed.

    * -x— This sub-option removes the DHCP database tables.

    * -h— This sub-option removes the host entries that were added for each managed
    IP address.


    The following example shows how to uninstall a DHCP server, omitting the -f option,
    so that the confirmation message is displayed:


    ```

    ultra1@# dhcpconfig -U -x -h

    Unconfigure will stop the DHCP service and remove the DHCP configuration

    - file.

    are you SURE you want to unconfigure the DHCP server? ([Y]/N):

    DHCP server shutdown.

    Deleted the server macro from dhcp own.

    Deleted table for network 192.168.28.0.

    Deleted the dhcp own.

    Deleted the DHCP configuration file.

    ```


    The first thing the command does is to stop the server process. The DHCP database
    tables are then removed, along with the host entries, and finally the configuration
    file is removed.


    > Note that the host entries are removed from the local /etc/inet/hosts file because
    this option was specified when the DHCP server was initially configured.


    # Configuring a DHCP Client


    The DHCP client configuration procedure is much simpler than that of the DHCP
    server, where most of the work has to be done. If you elected to use'
  merge: -1
