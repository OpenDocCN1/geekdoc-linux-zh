- img_proc: true
  md: '258 Chapter 13


    Time is a critical part of operating in a networked environment, particularly
    when so many time-critical applications are in operation. This chapter describes
    the Network Time Protocol (NTP), which achieves the best possible time synchronization
    among all machines connected to a network.


    # NTP Fundamentals


    Computers have to maintain a clocking mechanism to be able to maintain the time,
    although it''s not very accurate. In a Sun system, the non-volatile RAM (NVRAM)
    keeps time when Solaris is not running, and when the system starts up, the time
    value is copied into a counter that the Solaris 9 kernel uses. For most Ultra-based
    systems, the counter is 64 bits in length. The clock is not very accurate because
    it relies on an oscillator generating interrupts that need to be processed by
    the CPU, so if the CPU is busy, this could be delayed and cause *drift* (explained
    later).


    ![](img/b8864f367e279929da7f8395589b04dd_293_0.png)


    The 32-bit counter present in older systems is scheduled to reach its limit of
    values in the year 2038. The 64-bit counter will not reach its limit of values
    for about 300 million years. Unix time started at midnight, January 1, 1970.


    It is commonly thought that NTP is used to synchronize the system clock at different
    hosts in a network. This is not what NTP does; it is actually the mechanism by
    which all systems on a network try to get as close as possible to having the correct
    time. For example, if there are three NTP servers on the network, all acting as
    peers to each other, they calculate, between them, which is the best time source—having
    agreed, all three servers synchronize to that source.


    NTP operates in a hierarchy, *strata*, *stratum* levels ranging from 1–15, where
    a *stratum-1* server is the most accurate and reliable, and is connected to a
    reference source, such as a GPS signal, or a UTC (coordinated universal time)
    source (based on GMT). A few servers provide the time for many clients, which
    of may be servers for others and so on.


    ![](img/b8864f367e279929da7f8395589b04dd_293_1.png)


    > A time reference source, such as a GPS signal clock, is referred to as a *stratum-0*
    server. Clients do not synchronize to these servers; they synchronize to the *stratum-1*
    server that is connected to the reference clock.'
  merge: -1
  pgno: 293
- img_proc: true
  md: 'NTP has a wide variety of uses within the Solaris operating environment.

    The Following are instances of where it is used:


    +   * File system times—When a file is created or modified, an accurate timestamp
    is needed to know when it happened. This is particularly important in shared file
    systems.


    +   * Network management tools—These need accurate timestamping to report the
    exact time an event occurred. The network management master system might also
    be a remote computer, so the time needs to be synchronized.


    +   * Security breaches—To track and investigate a security breach on a computer
    network, accurate time recording is essential to identify exactly when specific
    events occurred so that a complete chronological audit can be made.


    +   * Billing applications—The time is critical when an application is billing
    a customer based on time, such as for telephone usage.


    +   * Financial applications—Some financial services have a legal responsibility
    for extremely accurate timekeeping.


    +   * Encryption and key management—Secure applications often use time value to
    create part of the key used to encrypt the data. This value has to be accurate
    so that the receiving host can decrypt the data, again based on the time.


    NTP uses the User Datagram Protocol (UDP) to communicate between servers and clients
    using well-known port number 123. Using UDP is preferable with NTP because there
    are no retries if a synchronization fails (as there would if TCP was used), which
    could flood a network with traffic if a number of clients went down.


    A number of terms to be described before you configure NTP:


    +   * Reference clock—A clock that is known to be accurate because it follows
    a respected signal, such as GPS, or a UTC clock.


    +   * Resolution—This is the smallest time increment a clock can make (compare
    to a domestic watch, where the resolution is one second).


    +   * Precision—This is the smallest time increase that a computer program can
    make.'
  merge: -1
  pgno: 294
- img_proc: true
  md: '+   Accuracy—This refers to how closely a clock follows a time reference, such
    as a GPS signal, or UTC reference clock.


    +   Reliability—This refers to the length of time that a clock can remain accurate.


    +   Drift—This refers to the variations in frequency that make clocks have different
    time. NTP contains a standard location for a drift file, `/var/lib/ntp.drift`,
    which stores the offset for the oscillator, allowing it to be taken into account
    to produce more accurate time.


    +   Jitter—This refers to the fact that different oscillators have different frequencies
    and produce discrepancies when time is measured repeatedly. Jitter is effectively
    the difference in drift between a number of oscillators. Jitter is also the condition
    that database administrators experience when the time is not synchronized across
    the environment, particularly with distributed databases.


    # NTP Configuration


    The main NTP daemon, ntpd, reads its configuration file, `/etc/inet/ntp.conf`,
    when it starts up. The contents of the configuration file determine whether the
    system is a client or a server and also the address of the time server. This section
    describes the configuration options, as well as how to configure an NTP server
    and an NTP client.


    NTP can be configured in a number of ways:


    +   The local system can be used as the reference time.


    +   Another server on the local network can be used as the reference time source.
    This is preferred if you need to have all systems on the local network synchronized—it
    might not be the correct time, but all the systems can be synchronized at the
    same time.


    +   A server on the Internet can be used as the reference time source. A list
    of publicly available NTP servers can be found on the Web at `www.ntp.org.`.


    +   A broadcast time signal, as a GPS signal, can be used as the reference time
    source. This requires the installation of an interface card in the host to be
    configured. The IP address of the server, specified in the configuration file
    is of the form `127.127.t.u`, where `t` is an integer that represents the clock
    type and `u` is an integer that indicates the unit number within the clock type.'
  merge: -1
  pgno: 295
- img_proc: true
