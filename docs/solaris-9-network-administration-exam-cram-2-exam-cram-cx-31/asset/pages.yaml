  md: '# Chapter 5


    With the demand for greater bandwidth and higher availability increasing all the
    time, Sun provides two products that satisfy these demands: IP Multipathing (IPMP),
    which provides a failover detection and repair facility for network interfaces,
    and Sun Trunking, which provides increased bandwidth by allowing the aggregation
    of multiple network interfaces.


    # Configuring Multipathing


    IP multipathing (IPMP) is delivered as part of the Solaris 9 operating environment
    and provides a failover mechanism for network interfaces, allowing an alternate
    network interface to dynamically assume the address of a failed interface and
    handle the network traffic until the failed interface is restored to operational
    status. IPMP also delivers increased throughput by balancing the load across the
    interfaces. IPMP has the following features:


    +   - Failover detection—IPMP detects when a network interface has failed and
    switches the network access to an alternate network interface. This is called
    failover.


    +   - Repair detection—In addition to detecting the failure of a network interface,
    IPMP also detects when a failed network interface has been repaired and is operational
    again. The network access is restored to the original network interface. This
    is called failback.


    +   - Load balancing—IPMP provides load balancing of outbound traffic across multiple
    network interfaces to achieve a higher throughput rate, but net-traffic must be
    going to multiple destinations.


    A number of requirements need to be satisfied before IPMP can be used:


    +   - You must be running Solaris 8, release 10/00 or later. Even though this
    book is based on Solaris 9, you might have other systems running earlier versions
    of the Solaris operating environment. Check the contents of the /etc/release on
    your system to confirm the version and release that is installed.


    +   - There must be more than one physical network interface installed to allow
    IPMP to function in a meaningful way. IPMP can be implemented on a system with
    a single network interface, but this would normally be done to gain extra status
    information, or to prepare the system for the addition of a second network interface.


    +   - A test address must be configured for each network interface that uses IPMP.
    This address is not used for normal operations, but is used to probe the interface
    as part of the failure detection facility.'
  merge: -1
  pgno: 127
- img_proc: true
  md: 'Each interface participating in IPMP must be configured to be a member of the
    same multicast group.


    Each network interface present in the system must be configured with a unique
    ethernet address. This includes those interfaces that may not be part of the multipathing
    group.


    # in.mpathd Daemon


    The in.mpathd daemon process detects both interface failures and when failed interfaces
    have been repaired. It does this in two ways:


    +   It sends and receives ICMP echo messages (known as probes) via the IPMP logical
    interface to other hosts connected to the network. Five failed probes constitutes
    a failure and ten consecutive responses constitutes a repaired interface.


    +   It monitors the internal flag IFF_RUNNING on the interface. This flag is defined
    as part of IP and can be seen when running ifconfig -a command.


    If either of these two methods reports a failure, then the interface can be considered
    failed. Conversely, both methods have to report the interface as operational before
    it is marked as repaired.


    When in.mpathd daemon starts up, it reads default information from the file /etc/default/mpathd.
    This file contains three variables that are used to determine the standard behavior
    of the daemon. The standard /etc/default/mpathd file that is delivered with Solaris
    9 is as follows:


    ```

    #pragma ident "@mpathd.dfl 1 2    00/07/17 SMI"

    #

    # Time taken by mpathd to detect a NIC failure in ms. The minimum time

    # that can be specified is 100 ms.

    #

    FAILURE_DETECTION_TIME=10000

    #

    # Failback is enabled by default. To disable fallback turn off this option

    FALLBACK=yes

    #

    # By default only interfaces configured as part of multipathing groups

    # are tracked. Turn off this option to track all network interfaces

    # on the system

    #

    TRACK_INTERFACES_ONLY_WITH_GROUPS=yes

    ```


    The three variables in the above file are'
