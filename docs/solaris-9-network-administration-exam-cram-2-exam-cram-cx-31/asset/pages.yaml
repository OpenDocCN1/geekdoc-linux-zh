  md: '# Introduction


    Welcome to Solaris 9 Network Administrator Exam Cram 2. This book will help you
    get ready to take—and pass—the Sun Certified Network Administrator for the Solaris
    9 Operating Environment (CX-310-044) exam required to obtain the Sun Certified
    Network Administrator for Solaris 9 certification. This chapter discusses Sun''s
    certification program in general and how the Exam Cram 2 can help you prepare
    for the Solaris 9 certification exam. It doesn''t matter whether this is the first
    time you''re going to take the exam or you''ve taken it previously; this book
    is going to give you the necessary information and techniques to obtain certified
    status.


    Exam Cram 2 books help you understand and appreciate the subjects and materials
    you need to pass Solaris certification exams. The books are aimed strictly at
    test preparation and review. They do not teach everything you need to know about
    a topic. Instead, they present and dissect the questions and problems that you''re
    likely to encounter on the test.


    Nevertheless, to completely prepare yourself for any Solaris test, I recommend
    that you begin by taking the self-assessment included in this book, which immediately
    follows this introduction. The self-assessment tool will help you evaluate your
    knowledge base against the requirements for a Solaris 9 Network Administrator
    under both ideal and real circumstances.


    Based on what you learn from the self-assessment exercise, you might decide to
    begin your studies with some classroom training or by reading one of the network
    administration guides available from Sun and third-party vendors. I strongly recommend
    that you install, configure, and play around with Solaris 9 and other software
    on which you''ll be tested. You need at least two Sun workstations because many
    networking aspects need to be tested, and beats hands-on experience and familiarity
    when it comes to understanding the questions you are likely to encounter on a
    certification test. Book learning is essential, but hands-on experience is the
    best teacher of all!'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# The Sun Certified Network Administrator for Solaris 9 Certification


    The certification program currently includes one exam, the Sun Certified Network
    Administrator for the Solaris 9 Operating Environment (Exam 310-044) exam. The
    exam covers local area networks, the TCP/IP Model, Address Resolution Protocol
    (ARP) and Reverse Address Resolution Protocol (RARP), basic Internet Protocol
    version 4 (IPv4) configuration, with IPv4, Multipathing with IPv4, Internet Protocol
    version 6 (IPv6), the Transport layer, Domain Name System (DNS), Dynamic Host
    Configuration Protocol (DHCP), and Network Time Protocol (NTP).


    To become a certified network administrator, you must already be a Sun Certified
    System Administrator, having passed the exams for any of the Solaris releases,
    2.5, 2.6, 7, 8, or 9. This is a prerequisite that must be satisfied before you
    take the Solaris 9 network administrator exam. The exam itself consists of 64
    questions, and you have 105 minutes to complete the exam. You must attain a pass
    mark of 70% to pass the exam.


    The questions on the exam will be one of the following types:


    +   - Multiple choice, single answer (only a single answer is correct).


    +   - Multiple choice, multiple answers (multiple answers are correct and you
    have to get them all to score the point).


    +   - Multiple match (drag-and-drop style, where a number of terms are displayed
    along with a number of answers—you have to use the mouse to drag the correct answer
    and drop it in the corresponding term).


    +   - Free response (where you have to enter the required command on the keyboard
    in a space provided).


    It is not uncommon for the entire network administrator certification process
    to take six months, and many individuals find that they must take the test more
    than once to pass it. The primary goal of the Exam Cram 2 series is to make it
    as possible, given proper study and preparation, to pass the exam on the first
    try.


    Although certification is associated with a particular version of the Solaris
    Operating Environment, there is no requirement to recertify. After a Solaris version
    becomes obsolete, however, being certified on that version will have'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Introduction xxii


    little value, so it would be in your best interest to work on the certification
    for the next version of Solaris. Also, unfortunately there is no upgrade exam
    for the Network Administrator certification, unlike the Sun Certified System Administrator
    certification, where a single upgrade exam can be taken to become certified on
    the next Solaris version.


    In the past, Sun has used the certification requirements and test objectives from
    the previous version as a starting point for the next version. So after you''ve
    been certified on a version of Solaris, you should be very familiar with most
    of the test objectives for certification in the next version of Solaris. Only
    about 15–20% of objectives seem to have changed between Solaris 8 and Solaris
    9, the majority of those in the IPv6 section and the DHCP section..


    The best place to keep tabs on Sun''s certification program is on the Sun Web
    site. The current URL for Sun''s Network Administrator program is http://training.sun.com/US/certification/solaris/netadmin.html.
    Sun''s certification Web site changes frequently, so if this URL fails to work,
    then try using the Search tool on Sun''s main Web site, http://www.sun.com, using
    keywords such as "certification" or "network administrator" as the search string.
    This will help you to find the latest and most accurate information about the
    company''s certification programs.


    # Taking a Certification Exam


    Each test you take costs $150.00 (£100 in the U.K.), whether you pass or fail.
    If you fail, the next attempt will also cost the same amount. In the United States
    and the U.K., tests are administered by Thomson Prometric.


    The first thing you have to do is purchase an examination voucher from Sun Educational
    Services. In the U.S., you can contact Sun Education Services at 1-800-422-8020
    and in the U.K. you can contact them at 01276-416520. This requires that you use
    a credit card. The voucher can be used for one year from the date of purchase.


    Next, contact Thomson Prometric to register for the exam. In the U.S., their telephone
    number is 1-800-795-3926, and in the U.K. it is 0800-5928873. You can also use
    the Thomson Web site at http://2test.com.


    To schedule an exam, call at least one day in advance. To cancel or reschedule
    an exam, you must call at least one day before the scheduled test time; otherwise
    you might still be charged the full fee. When calling Thomson Prometric, please
    have the following information ready for the telesales staff member who handles
    your call:'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Introduction


    +   * Your Thomson Prometric number, if you have previously taken exams with Thomson.

    * Your name, organization, mailing address, and social security number.

    * The name of the exam you want to take.

    * The number of the Sun voucher you purchased (this information might not be required
    the Thomson Prometric staff member may already have it).


    An appointment confirmation will be sent to you by mail if you register more than
    five days before an exam, or will be sent by fax if there are fewer than five
    days before the exam. A Candidate Agreement letter, which you must sign to take
    the examination, will also be provided.


    On the day of the test, try to arrive at the testing center at least 15 minutes
    before the scheduled time. You must supply two forms of identification, one of
    which must be a photo ID.


    All Sun exams are closed book. You are not permitted to take anything into the
    testing area, although you will be provided with a pen and some blank paper (which
    you must leave behind when you''ve finished). I recommend you review the most
    critical information about the test you''re taking just before the test. (Exam
    Cram 2 books provides a brief reference—The Cram Sheet, located inside the front
    of this book—that lists the essential information from the book in distilled form.)
    You will have some time to compose yourself or write some important facts down
    on the paper. There is a sample orientation test that you can do before your first
    exam; it''s worth doing if this is the first time you''ve been to a Thomson Prometric
    testing center as it familiarizes you with the layout and functions that will
    be available to you during the test. The sample orientation test is not part of
    the actual exam—your time doesn''t start until you click on the option to start
    the exam itself.


    After you are in the test center, sitting at the computer, relax and stay calm.
    You cannot do any more reading now, so take a deep breath and read the first question.


    I cannot stress enough how important it is to read a question at least twice before
    selecting an answer. Even though Sun does not deliberately pose "trick" questions,
    you could rush in and answer the question because you''ve already seen an answer
    that appears to be good. This is probably the most common cause of exam failure:
    not reading the question properly. Make sure you understand how many answers are
    required for a question. In a multiple choice question with multiple answers,
    Sun normally states how many'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Introduction xx


    answers required—the question often ends with a sentence that says, “Choose 2,”
    for example. If you''re not sure of the answer, try to eliminate as many “definitely
    wrong” answers as you can, so that in the event of having to guess, you have reduced
    the odds significantly in your favor. There''s no penalty for getting an answer
    wrong, or not attempting a question, so you should try to answer all the questions.


    When you complete a Solaris 9 certification exam, the testing software tells you
    whether you''ve passed or failed. Results are broken down into several topical
    areas. Regardless of whether you pass or fail, I recommend that you keep the detailed
    report that test administrator prints for. You can use the report to help you
    prepare for a re-take (if necessary), and even if you pass, the report shows areas
    you need to review to keep your skills fresh. If you do need to retake an exam,
    you have to call Thomson Prometric and schedule a new test date—of course this
    unfortunately means paying the fee again.


    # Tracking Certification Status


    Sun maintains a database that indicates the exams you have passed and your corresponding
    test scores. The database is accessible via Sun''s web site at http://training.sun.com/US/certification/certmanager/index.html.
    You use your Thomson Prometric ID to log in to certmanager, where you have to
    assign a password if this is the first time you''ve accessed this facility. Verify
    and update, if necessary, your personal information. You can view your certification
    status. Official certification normally takes anywhere from four to six weeks
    (but is generally within 30 days), so not expect to receive your certificate immediately.
    The exam results will normally be available in certmanager after about 4 working
    days, so you can view the status online much sooner. After you have completed
    certification, you will receive a package with a Welcome Kit that contains a number
    of elements:


    +   - A Network Administrator for Solaris 9 certification, suitable for framing


    +   - A logo sheet, which includes camera-ready artwork for use on letterheads,
    business cards, and so on


    +   - A Sun Certified Network Administrator lapel pin


    Many people believe that the benefits of certification go well beyond the perks
    that Sun provides to newly anointed members of this elite group. More and more
    job listings require applicants to have a Solaris certification, and many individuals
    who complete the program can qualify for increases in pay'
