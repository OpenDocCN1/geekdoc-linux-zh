    Notice that each parameter listed also contains permission information, such as
    whether you can inspect the value or change it as well. The link_speed parameter
    is frequently the cause of problems, particularly with older network interfaces.
    Newer interfaces can autosense whether the network is running at 10Mbps or 100Mbps,
    for example, and set this parameter automatically. Older interface cards, however,
    might be hardwired to 10Mbps, so a problem occurs when you connect to a 100Mbps
    network. The following example shows how to inspect two values that provide useful
    information: link_speed and autoneg_cap. The first shows a value of 0 because
    it is running at 10Mbps (the value would be 1 if it was running at 100Mbps). The
    second identifies whether the interface can automatically negotiate the link speed,
    meaning it can set itself to whatever the network is running at. In this case,
    note that the value of 1 indicates that this interface can set the value depending
    on the network:


    ```

    # ndd /dev/hme link_speed

    0

    # ndd /dev/hme autoneg_cap

    1

    ```'
