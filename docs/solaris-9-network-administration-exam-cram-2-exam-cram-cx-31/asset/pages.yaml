    # Troubleshooting the DHCP Client


    The majority of problems will be found on a DHCP client involve a DHCP server
    that cannot be reached or is not responding, or a problem with the configuration
    of the DHCP server itself.


    The main troubleshooting tools available to the administrator include the following
    actions:


    +   - Run the server process in debug mode (detailed in the preceding section).

    - Run the client process (dhcpagent) in debug mode to view additional messages.'
