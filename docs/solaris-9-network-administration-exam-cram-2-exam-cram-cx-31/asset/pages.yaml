- img_proc: true
  md: '# Network Time Protocol (NTP) 265


    The startup script for NTP resides in the /etc/rc2.d directory, so it is start-
    wen the system enters level 2. The file /etc/init.d/xntpd is the same file, as
    the two are hard linked. This is confirmed by listing the inode of both files
    as shown in the following:


    ```

    # ls -i /etc/rc2.d/S74xntpd /etc/init.d/xntpd

    90358 /etc/init.d/xntpd 90358 /etc/rc2.d/S74xntpd

    ```


    Notice that both of the files have the same inode number of 90358. Either of these
    two scripts can be used to start and stop the xntpd daemon.


    When the daemon is started, it reads from a configuration file /etc/inet/ntp.conf,
    which contains a number of configuration options and also determines whether the
    machine is a client or a server.


    ![](img/b8864f367e279929da7f8395589b04dd_300_0.png)


    The xntpd daemon functions like this:


    +   1. NTP servers advertise on the network every 64 seconds, using the multicast
    address 224.0.1.1. The advertisement lets other systems know that this system
    is an NTP server.

    2. When a server receives a request packet from a client, which also contains
    the client''s time, it replies by inserting the correct time into the packet and
    returns it to the client.

    3. The client compares this packet with what it has received and adjusts its clock
    accordingly. A client waits for several responses from a server (or a number of
    servers) before synchronizing its clock, so it can take up to about five minutes
    for an NTP client to synchronize with an NTP server.


    # Using ntpq to Identify Other NTP Servers


    The ntpq command is an NTP query program that can be used to determine whether
    any NTP peer servers are on the network. The following example shows how to run
    the command:


    ```

    # ntpq

    tpq> peers

    *LOCAL(0)    LOCAL(0)     3 1 64 64 377 0.000 0.000

    -10.03

    224.0.1.1     0.0.0.0     16 - 64 0 0.000 0.000

    -16000.0

    ```'
