  md: '# Troubleshooting Routing


    Routing problems are notoriously difficult to resolve, particularly when routers
    that are external to your organization—such as on the Internet—are used. As an
    administrator, though, you can verify that your configuration has been set up
    correctly and also demonstrate that the routers within your organization are working
    as expected. This section outlines some of the utilities that can be used, such
    as ping, netstat, and traceroute.


    # Verifying the Configuration


    You should confirm the system being used as a router is configured correctly.
    Start by running the `ifconfig` a command to verify that the network interfaces
    have been configured correctly. If the interfaces are marked UP and RUNNING, then
    also check the IP addresses, the network masks, and the broadcast addresses. If
    the network mask is incorrectly set, the broadcast address will also be wrong.
    You can rectify this by checking the `/etc/inet/netmasks` file.


    You should also verify that the `/etc/inet/hosts` and `/etc/inet/networks` files
    contain the correct IP addresses and names, as well as the contents of each network
    interface configuration file—that, those files starting with `/etc/hostname.<xxx>`,
    where `<xxx>` represents the specific interface.


    # ping


    The `ping` command is extremely useful for testing the reachability of other hosts
    on the network. Use this command to check that you can reach another system on
    the local network—this demonstrates connectivity to the network. You should also
    ping the default gateway. If this fails, the default gateway could be down, but
    also check the `/etc/defaultrouter` file to make sure you have entered the correct
    IP address or hostname.


    # netstat


    The `netstat` command is used with the `-r` option to view the routing table entries.
    It is often preferable, when diagnosing problems, to use the `netstat -rn` command,
    so that only IP addresses are displayed, rather than host and network names.'
  merge: -1
