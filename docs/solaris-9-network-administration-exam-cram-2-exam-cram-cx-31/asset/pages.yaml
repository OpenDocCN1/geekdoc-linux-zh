  md: '# Question 61


    The correct answer is A. The application layer handles the formatting of data
    and any conversions that are necessary. Answer B is incorrect because the Internet
    layer handles the routing of packets and fragmentation/reassembly. Answer C is
    incorrect because the Network Interface layer handles the transmission of ethernet
    frames across the network. Answer D is incorrect because the Transport layer handles
    the end-to-end communication and does not deal with data formatting.


    # Question 62


    The correct answer is B. The ring network topology is one where hosts are connected
    in a ring formation, and each host is connected only to its adjacent neighbors.
    Answer A is incorrect because a bus topology involves all hosts being connected
    to a single backbone cable. Answer C is incorrect because the star topology involves
    hosts being connected to a central hub. Answer D is incorrect because a VLAN topology
    involves the use of a central intelligent hub or switch and functions in a similar
    way to multiple star topology networks.


    # Question 63


    The correct answer is A. The in.arpd daemon will start at boot time only if the
    /tftpboot directory exists. Answers B, C, and D are incorrect because these directories
    do not exist.


    # Question 64


    The correct answers are A and D. Logical interfaces can cause performance bottlenecks
    because they all use the same physical ethernet interface. They can also slow
    down the system boot process because each logical interface has to be configured
    at boot time. Answer B is incorrect because logical interfaces provide additional
    resources at a much lower cost because there is no need to purchase additional
    physical ethernet interfaces. Answer C is incorrect because logical interfaces
    are not an administration overhead; they allow central administration on a single
    host.'
