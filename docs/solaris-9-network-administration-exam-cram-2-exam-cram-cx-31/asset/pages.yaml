  md: '# Chapter 10


    Domain name system (DNS) is the mechanism by which IP addresses are resolved from
    domain names and vice versa. The primary use for DNS is on the Internet, where
    it resolves hostname to its relevant IP address. For example, you could navigate
    to Sun''s Web site by typing in www.sun.com. After you type in this DNS name,
    Internet DNS servers resolve this to Sun''s IP address, which is returned to your
    computer so that you navigate to it. This chapter describes the basics of DNS:
    how to configure a server and a client as well as how to troubleshoot DNS problems.


    > You wouldn''t need DNS if you only communicated with a small number of hosts
    on your local network. The /etc/hosts hosts file would contain the necessary information
    to resolve IP addresses from hostnames.


    # DNS Fundamentals


    DNS works in a hierarchical fashion with the root at the top. Queries cascade
    through the branches until a server is found that can provide a resolution. The
    collection of machines that use DNS is called the namespace. The namespace is
    made up of a number of domains, each consisting of a number of machines that contain
    information about hosts, or of other servers that might contain the required information.
    The domains are organized in a similar way to a Unix file system, which is an
    inverted tree, with a root at the top and numerous branches extending from the
    root.


    # Top-Level Domains


    If you are connected to the Internet, then the root domain is the highest level
    of domain, identified by a . (dot). It is often called the “Nameless root” and
    acts as a placeholder for the top-level domains that are administered centrally
    by the Internet Assigned Numbers Authority (IANA). When you specify a URL, such
    as www.sun.com, the last word (furthest right) is the top-level domain, in this
    case com, which identifies the domain as a commercial organization. Top-level
    domains are broken down into organizational and geographical structures. Table
    10.1 shows the most popular organizational top-level domains.'
  merge: -1
  pgno: 211
- img_proc: true
  md: '| Table 10.1 Organizational Top-Level Domains |

    | Domain Name | Description |

    | --- | --- |

    | com | Commercial organizations (mainly U.S. based) |

    | org | Non-commercial or non-profit organizations |

    | edu | Educational organizations, such as schools and universities |

    | net | Networking organizations and Internet Service Providers (ISPs) |

    | mil | US Military domain names |

    | gov | Government departments and organizations |

    | int | International organizations, such as NATO, for example |


    Geographical domains are assigned to each country, normally with two letters relating
    to the country. Table 10.2 shows some of the geographical top-level domains.


    | Table 10.2 Geographical Top-Level Domains |

    | Domain Name | Description |

    | --- | --- |

    | ca | Canada |

    | de | Germany |

    | es | Spain |

    | fr | France |

    | jp | Japan |

    | uk | United Kingdom (Great Britain) |

    | us | United States |


    # # Second-Level Domains


    Second-level domains come below the top-level domains and are administered by
    the organizations themselves. In the domain name www.sun.com, for example, sun
    is the second-level domain name and is administered by Sun Microsystems. An organization
    is free to split its second-level domain into further subdomains, if required,
    and so delegate responsibility of the subdomains to specific departments or sections.
    There is a restriction, however, that a complete domain name, including all its
    subdomain names and the top-level domain name (known as a *Fully Qualified Domain
    Name* — FQDN), cannot be longer than 255 characters. Also, each single domain
    name cannot be longer than 63 characters.'
  merge: -1
