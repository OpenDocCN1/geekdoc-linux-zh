  md: '# Chapter 4


    The file /etc/netmasks is a symbolic link to /etc/inet/netmasks and is included
    for Berkeley Software Distribution (BSD) compatibility. The actual file is /etc/inet/netmasks;
    be aware of this because it is a frequent exam question.


    The /etc/inet/netmasks file is referenced when the system boots up to establish
    network masks for the network interfaces installed in the system. At the single
    user level, the startup script /etc/rcS.d/S30network.sh first references this
    file, and later on run level 2, the startup script /etc/rc2.d/S72inetsvc recalculates
    the network mask in case a naming service is running.


    # Subnetting a Network


    So far, you''ve seen the default network masks are assigned to the relevant classes
    of IPv4 addresses. Sometimes it is necessary to divide your network into a number
    of smaller networks. You can do so by specifying your own network mask to create
    a number of smaller networks with fewer hosts on each one.


    As an example, take the class C network 192.168.28.0: The default network mask
    is 255.255.255.0. Suppose you want to split this network into 16 smaller networks,
    each comprising 14 usable hosts (because the first address is the network itself
    and the last address is the broadcast address). The network mask to use to do
    this is 255.255.255.240. What you''re effectively doing is allocating some of
    the host address space to the network. Table 4.1 shows how this network address
    would break down into its separate subnets, as well as the usable addresses that
    each subnet creates.


    | Table 4.1 Dividing a Class C Network Address |

    | Network Address | Addressable Hosts Range | Broadcast Address | Network Mask
    |

    | --- | --- | --- | --- |

    | 192.168.28.0 | 192.168.28.1–192.168.28.14 | 192.168.28.15 | 255.255.255.240
    |

    | 192.168.28.16 | 192.168.28.17–192.168.28.30 | 192.168.28.31 | 255.255.255.240
    |

    | 192.168.28.32 | 192.168.28.33–192.168.28.46 | 192.168.28.47 | 255.255.255.240
    |

    | 192.168.28.48 | 192.168.28.49–192.168.28.62 | 192.168.28.63 | 255.255.255.240
    |

    | 192.168.28.64 | 192.168.28.65–192.168.28.78 | 192.168.28.79 | 255.255.255.240
    |


    (continued)'
