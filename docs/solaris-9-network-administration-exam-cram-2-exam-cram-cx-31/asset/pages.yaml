- img_proc: true
  md: '# Chapter 12


    JumpStart is a facility provided with the Solaris OE that allows the operating
    environment to be installed automatically on numerous hosts. The JumpStart process
    is not discussed in this book because it is part of the Solaris 9 system administrator
    certification, a prerequisite for the exam covered in this book. It is therefore
    assumed that the reader is already familiar with JumpStart. This chapter describes
    how to perform advanced DHCP functions such as configuring DHCP server to support
    JumpStart clients and troubleshooting both the DHCP server and client.


    # JumpStart and DHCP


    The DHCP server can be configured so that a JumpStart client can use DHCP, rather
    than the traditional JumpStart mechanism using RARP, when it boots up. Using the
    DHCP method is advantageous because DHCP packets pass through a router, eliminating
    the need for a client to have a JumpStart server present on the same subnet—a
    boot subnet as the client is currently required under standard JumpStart procedures
    because the RARP protocol used by clients does not pass through a router.


    > JumpStart with DHCP is currently supported only on Intel and Ultra workstations.
    The boot PROM version must be at least 3.25 on an Ultra workstation. If these
    requirements are not met, the client cannot perform a DHCP boot. There is often
    an exam question that asks for the minimum requirements.


    # Symbols and Macros


    The add_install_client script, which is provided with the Solaris OE, is used
    to register JumpStart clients on the JumpStart configuration server. The -d option
    to this script specifies that the client is a DHCP client. At point of running
    the script, your JumpStart server should already be configured, but there are
    a number of symbols that need to be configured before the DHCP server can support
    the JumpStart client. The following example uses the host ultra10 as the JumpStart
    server and adds support for the SUNW.Ultra5_10 platform.


    ```

    ultra10# ./add_install_client -d s ultra10:/export/install -c ultra10:\n/export/jumpstart
    -p ultra10:/export/install SUNW.Ultra5_10 sun4u

    copying reboot to /tftboot

    ```


    To enable SUNW.Ultra5_10 in the DHCP server,

    add an entry to the server with the following data:


    +   Install server (SintNM) : ultra10

    Install server IP (SintIP4) : 192.168.28.28'
  merge: -1
  pgno: 269
