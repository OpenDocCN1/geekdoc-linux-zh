  md: '# Chapter 8


    # Question 3


    +   Why would you need to configure an IPv6-over-IPv4 tunnel?

    - A. To allow IPv4 hosts to communicate over an IPv6 network.

    - B. To allow IPv6 hosts to communicate over an IPv4 network.

    - C. To connect an IPv6 network to an IPv4 network.

    - D. To provide an additional network path for IPv4 hosts on the network.


    Answer B is correct because IPv6-over-IPv4 tunnel is used to allow IPv6 hosts
    to communicate with each other through the use of an IPv4 network. Answer A is
    incorrect because an IPv6-over-IPv4 tunnel does not allow IPv4 hosts to communicate
    over an IPv6 network which has been introduced to aid the transition from IPv4
    to IPv6. Answer C is incorrect because an IPv6-over-IPv4 tunnel is not used to
    connect networks; it is used to allow IPv6 hosts to communicate over an IPv4 network.
    Answer D is incorrect; IPv4 hosts do not make use of an IPv6-over-IPv4 tunnel.
    The purpose of the tunnel is to allow IPv6 hosts to communicate with each other
    within the existing IPv4 network.


    # Question 4


    +   You are creating an IPv6-over-IPv4 tunnel, called ip.tunz. To make the tunnel
    configuration persist across reboots, which configuration file would you create?

    - A. /etc/hostname.ip.tunz

    - B. /etc/hostname6.hme0

    - C. /etc/hostname6.ip.tunz

    - D. /etc/hostname.hme0


    Answer C is correct because the configuration file /etc/hostname6.ip.tunz would
    be used to create a permanent tunnel called ip.tunz. Answer A is incorrect because
    the configuration file /etc/hostname.ip.tunz would refer to an IPv4 interface.
    Answer B is incorrect because the configuration file /etc/hostname6.hme0 is the
    file that would be used to configure a primary network interface with IPv6. It
    would not be used for an IPv6-over-IPv4 tunnel. Answer D is incorrect because
    the configuration file /etc/hostname.hme0 would be used to configure the primary
    network interface for use with IPv4.'
