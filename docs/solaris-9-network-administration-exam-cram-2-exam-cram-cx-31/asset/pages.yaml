  md: '# TCP and UDP 165


    When TCP establishes a connection, it carries out what is called a three-way handshake,
    in which the sending host sends a syn (synchronize) message, and then the receiver
    sends an acknowledgement (ACK) of the syn and also sends a syn message of its
    own. The sender receives the syn and the ACK and sends a final ACK. The sender
    can now start to send data. Figure 9.1 shows how this works.


    ![](img/b8864f367e279929da7f8395589b04dd_200_0.png)


    **Figure 9.1** Three-way handshake.


    Some examples of applications that use TCP are Telnet, FTP, HTTP, and the Solaris
    r commands, such as login and rsh.


    # TCP Header


    TCP uses segments as its basic unit of transfer, as IP uses datagrams and ethernet
    uses packets. A TCP header consists of a number of 32-bit words (4 bytes). The
    header must be a minimum of 5 words or 20 bytes, and contains a number of fields
    that control the delivery of the data across the network. The format of the TCP
    segment header is shown in Figure 9.2.


    The following are TCP header fields:


    +   - Source Port—Identifies the TCP application program on the sending side.


    +   - Destination Port—Identifies the TCP application program on the receiving
    side.'
  merge: -1
