    Also, it is interesting to note that in the first packet, the ARP: Target hardware
    address is set to z?, indicating that it is unknown, but several packets later,
    this value has been set to the remote system''s ethernet address as it has been
    provided in the response.


    # ARP Cache


    ARP stores its responses in a cache, so that the information is available if it
    is required again. The cache stores this information for only up to 20 minutes
    by default, as can be seen by inspecting the contents of the ip_ire_arp_interval
    variable, using the ndd command as shown in the following:


    ```

    # ndd /dev/ip ip_ire_arp_interval

    120000

    ```


    The value 120000 is in microseconds and equates to 20 minutes.


    There are two types of ARP messages:


    +   - Solicited—An unsolicited ARP message means that a specific ethernet address
    was asked for by a host.


    +   - Unsolicited—An unsolicited ARP message is information stored about a host
    that issued an ARP request.'
