- img_proc: true
  md: 'Identifier—This field is a 16-bit identification field. If a datagram is fragmented
    into a number of frames, the same identifier is used so that the fragments can
    be correctly reassembled at the destination.


    Flags—This 3-bit field consists of an unused bit and two flag fields, DF and MF.
    The DF bit (Do not Fragment), if set, is an instruction to routers not to fragment
    the data, normally because the destination is not able to reassemble the pieces.
    The MF bit (More Fragments) is set when there are more fragments to follow. Only
    the last fragment will see this bit set to 0.


    Fragment offset—This 13-bit field identifies the location of the fragment in the
    IPv4 datagram.


    Time to live—The maximum number of routers through which the data can pass. Each
    router decrements the value by one until it reaches zero, when it is discarded.
    TCP sets this value by default to 64, whereas UDP sets it to 256. You can see
    the current values by using the ndd command as shown here:


    +   - The TCP value:

    # /dev/tcp ipv4_ttl

    64


    +   - The UDP value:

    # /dev/udp ipv4_ttl

    255


    Protocol—This field identifies the Transport layer protocol to which the datagram
    should be delivered. A value of 6 indicates TCP, whereas a value of 17 indicates
    UDP. These values are listed in the protocols file—/etc/inet/protocols.


    Header checksum—This field verifies the integrity of the datagram header to ensure
    it has not been corrupted. Note that the checksum applies only to the header and
    does not include the data.


    Source IP address—The IPv4 address of the system sending the datagram.


    Destination IP address—The IPv4 address of the final destination system that will
    receive the datagram.


    Options—This field contains optional information and may not always be present.
    This field can contain five options and will always end on a 32-bit boundary,
    using padding if necessary:


    +   - Security—Specifies the datagram''s security level.


    +   - Strict routing—Specifies the entire path to be followed.'
  merge: -1
