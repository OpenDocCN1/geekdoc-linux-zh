  md: '# ping


    The ping command (ping stands for Packet Internet Groper), although relatively
    basic, is an extremely useful utility for checking the reachability of a host
    on the network. If the alive response is received, the ethernet interface is responding
    and you can quickly check that the host is contacted across the network. When
    network problems occur, you can also send a continuous ping to an unreachable
    host so that you know when the network becomes available again.


    # netstat


