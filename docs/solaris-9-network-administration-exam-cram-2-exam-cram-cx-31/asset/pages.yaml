    # Logical Interfaces


    Logical interfaces, also known as virtual interfaces, enable you to assign more
    than one IPv4 address to a single network interface, and each IPv4 address can
    be of a different unicast class. It is a very simple way to make a single system
    appear as many systems. You might want to use logical interfaces when


    +   A Web server requires multiple URLs to appear to have multiple Web resources


    +   An application server runs multiple applications, where each application requires
    a dedicated IP address or hostname'
  merge: -1
  pgno: 113
- img_proc: true
  md: "# Fundamental IPv4 79\n\n+   > You are running a high-availability failover\
    \ mechanism where a logical interface can act as a failover for another network\
    \ interface\n\nEach logical interface that is configured is assigned its unique\
    \ IPv4 address and a unique hostname, and appears as if it is a completely separate\
    \ network interface.\n\nThe main advantages of using logical interfaces\n\n+ \
    \  > Cost—There is no need to purchase additional network cards.\n\n+   > Administration—With\
    \ everything on a single system, rather than multiple systems, the administration\
    \ overhead is reduced.\n\n+   > Appearance—Your department appears to be much\
    \ larger than it really is.\n\nThe disadvantages are\n\n+   > Network load—Even\
    \ though the appearance of multiple interfaces might look good, logical interfaces\
    \ are actually tied to a specific physical network interface, so the network traffic\
    \ could increase, creating potential network problems.\n\n+   > Startup overhead—When\
    \ a system boots, each interface, including logical interfaces, is configured\
    \ and enabled, so if a number of logical interfaces are operational, the boot\
    \ time will increase significantly.\n\n# Configuring a Logical Interface\n\nA\
    \ logical interface is configured using the same command (ifconfig) that is used\
    \ to configure a physical network interface. For example, in a system with a physical\
    \ interface hme0, the first logical interface is named hme0:1, the hme0:2, and\
    \ so on.\n\nTo view the current network interface configuration, enter the ifconfig\
    \ -a command as follows:\n\n```\n#ifconfig -a\nlo0: flags=1000849,LOOPBACK,RUNNING,MULTICAST,IPv4>\
    \ mtu 8232 index 1\n  inet 127.0.0.1 netmask ff000000\nhme0: flags=1000843,BROADCAST,RUNNING,MULTICAST,IPv4>\
    \ mtu 1500 index 2\n  inet 192.168.28.28 netmask fffffff broadcast 192.168.28.255\n\
    \  ether 0:20:5b:34:13\n```\n\nTo create a logical interface hme0:1, with an IPv4\
    \ address of 192.168.28.128, use the following command:\n\n```\n#ifconfig hme0:1\
    \ plumb 192.168.28.128 up\n```"
