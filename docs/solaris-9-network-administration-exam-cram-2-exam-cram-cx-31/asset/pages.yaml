    # Troubleshooting NTP


    Problems with NTP, such as when a server is not responding to client requests,
    are best diagnosed by viewing log messages and using the snoop utility. Also,
    the ntp4date and ntpdate programs can aid you in troubleshooting NTP, especially
    by examining the current status of the NTP process (ntppd) and the NTP server
    itself. Each of these is described in the following sections.


    # Log Messages


    NTP logs messages via syslog and writes them to /var/adm/messages. Look in this
    file for NTP-related messages. The following extract of messages shows what happens
    when a client starts up and runs ntpdate to set the initial time, and then synchronizes
    with a time server:


    ```

    Apr 16 15:24:31 ultra ntpdate[432]: [ID 318594 daemon.notice] \

    no server suitable for synchronization found yet

    Apr 16 15:24:31 ultra ntpdate[432]: [ID 147394 daemon.notice] \

    trying tll1 for multicast server synchronization

    Apr 16 15:24:22 ultra ntpdate[440]: [ID 558275 daemon.notice] \

