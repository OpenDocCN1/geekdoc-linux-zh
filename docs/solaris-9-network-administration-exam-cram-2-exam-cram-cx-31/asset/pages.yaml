  md: "If your DNS server is not connected to the Internet, then you should create\
    \ a named.ca similar to the one shown in this section, with the names and IP addresses\
    \ of the root DNS servers for your organization. This will allow organizationwide\
    \ DNS queries to be resolved.\n\n# # Zone Files\n\nAt least one zone is specified\
    \ in the master configuration file /etc/named.conf, along with the location of\
    \ the relevant zone file. The actual name and IP address details of the hosts\
    \ for which the DNS server has authority are stored in the zone file. Zones are\
    \ used to distribute authority, which is particularly useful in large organizations,\
    \ where the delegation of zones makes the process of keeping the information up\
    \ to date much easier and more manageable.\n\nInformation in the zone file is\
    \ stored in a particular format, known as resource records. Each resource record\
    \ serves a specific purpose.\n\nResource records exist within the zone files of\
    \ a server and contain all of the information pertaining to the zone of authority.\
    \ There are a number of resource record types, each having special meaning and\
    \ a number of keywords. The more common types are detailed in the following list:\n\
    \n+   * Start Of Authority (SOA)—This marks the start of the zone data and defines\
    \ parameters for the entire zone. This entry must be present in a zone file. A\
    \ typical SOA entry follows:\n\n```\n@ IN SOA master.xyz.com. root.master.xyz.com.\
    \ (\n    2003061001; Serial Number\n    10800; Refresh timer - 3 hours\n    1800;\
    \ Retry - 30 minutes\n    604800; Expiry - 1 week\n    43200); Minimum TTL - 12\
    \ hours\n```\n\nThe following notes apply to this entry:\n\n+   * The @ symbol\
    \ is a placeholder for the domain name, in this case xyz.com.\n\n+   * The record\
    \ is of the class IN, Internet class.\n\n+   * master.xyz.com identifies the primary\
    \ DNS server.\n\n+   * root.master.xyz.com identifies the email contact address\
    \ for messages. Note that there is no @ symbol after the email name because this\
    \ symbol is used as already described."
  merge: -1
  pgno: 220
- img_proc: true
  md: "# Chapter 10\n\nThe serial field is important because secondary DNS servers\
    \ use it to detect any changes that have been made to the zone and update their\
    \ own copies of the data files via a zone transfer. When the administrator makes\
    \ a change to the zone data, this value should be increased. A popular method\
    \ of maintaining the serial number is to use the current date, in the form YYYYMMDD\
    \ with two digits on the end that can be incremented by the administrator each\
    \ time a change is made. This allows 100 updates to be made each day. You can\
    \ choose any method to maintain the serial number, such as starting at 1 and incrementing\
    \ each time a change is made, but it is imperative that the secondary DNS servers\
    \ detect the change and update accordingly.\n\nThe refresh timer, currently set\
    \ to 3 hours, is the time at which a secondary server attempts to refresh its\
    \ database from the primary DNS server. At this time, the primary server's serial\
    \ number value is checked, and if it has been changed, the secondary server needs\
    \ to update its database.\n\nThe retry entry specifies how long a secondary server\
    \ should wait before retrying a failed contact to the primary DNS server.\n\n\
    The expiry entry, set to 1 week, stipulates how long a secondary DNS server's\
    \ database can remain valid if no updates have been received. After this time,\
    \ if there have been no updates, the secondary server updates its database from\
    \ the primary DNS server.\n\nThe minimum time-to-live (TTL), set to 12 hours,\
    \ specifies how long a hostname remains valid in the cache. After this time, the\
    \ entry is discarded.\n\nEverything after the ; (semicolon) character on each\
    \ line is a comment and is not part of the configuration.\n\nName Server (NS)—This\
    \ lists the name servers for the zone and also includes any subdomains that have\
    \ been delegated to other DNS servers. A typical NS entry follows:\n\n```\nxyz.com\
    \         IN NS       master.xyz.com.\n                IN NS       slave.xyz.com.\n\
    sales.xyz.com   IN NS       saleserv.xyz.com.\n```\n\nIn this entry, sales.xyz.com\
    \ subdomain has been delegated to the DNS server saleserv.xyz.com.\n\nAddress\
    \ (A)—This is where the hostnames and IP addresses are listed for the zone, the\
    \ functionality being similar to a /etc/hosts file. The following sample entries\
    \ identify a host test and a host named fulltest:"
