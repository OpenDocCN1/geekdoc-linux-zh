  md: '# Exam Prep Questions


    # Question 1


    +   How often do NTP servers advertise on the network?

    - A. Every minute

    - B. Every 5 seconds

    - C. Every 15 seconds

    - D. Every 64 seconds


    Answer D is correct because NTP servers advertise every 64 seconds. This obviously
    makes A, B, and C incorrect.


    # Question 2


    +   You are configuring an NTP client. Which template file will you copy to become
    your configuration file?

    - A. /etc/inet/ntp.keys

    - B. /etc/inet/ntp.client

    - C. /var/ntp/ntp.drift

    - D. /etc/inet/ntp.conf


    Answer B is correct because /etc/inet/ntp.client is the template file that you
    would copy to create the configuration file. Answer A is incorrect because /etc/inet/ntp.keys
    is the file used to contain authentication entries and is not a template file
    for NTP client configuration. Answer C is incorrect because /var/ntp/ntp.drift
    is the default location for the drift file. Answer D is incorrect because the
    /etc/inet/ntp.conf file is the location of the configuration file, that is, where
    the template file is copied to, by default. This file does not exist until the
    correct template file is copied to create it.'
