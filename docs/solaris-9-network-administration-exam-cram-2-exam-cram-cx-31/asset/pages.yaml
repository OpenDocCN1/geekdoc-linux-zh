- img_proc: true
  md: '# Chapter 5


    FAILURE_DETECTION_TIME=10000—This is the time in milliseconds (10 seconds) that
    it takes in.multipath to detect an interface failure. It can be tuned as required,
    higher or lower, but the minimum is 100 milliseconds (0.1 seconds).


    FAILBACK=yes—This option is enabled by default and allows the automatic failback
    of a repaired interface. Change this value to “no” if you do not want automatic
    failback.


    TRACK_INTERFACES_ONLY_WITH_GROUPS=yes—This option is enabled by default and means
    that in.multipath monitors only those interfaces that belong to a multicast group.
    You can change this value to no to monitor all network interfaces on the system,
    but the interfaces must all have unique ethernet addresses.


    The only method of detection to which FAILURE_DETECTION_TIME variable in the /etc/default/multipath
    file applies is the sending of ICMP messages; It doesn’t apply to the monitoring
    of the IFF_RUNNING flag.


    ![](img/b8864f367e279929da7f8395589b04dd_129_0.png)


    As part of the repair detection mechanism, in.multipath continues to send ICMP
    echo requests to a failed network interface, so that it can determine if it becomes
    operational again.


    group failure is said to have occurred if it appears that all the interfaces in
    a multipath fail at the same time, or if none of the hosts respond to the ICMP
    messages. In this instance, in.multipath flushes its list of hosts to probe and
    tries to find new targets instead.


    in.multipath process determines the hosts to probe dynamically; you cannot figure
    them. Routers are chosen as targets for probing—if there are no routers, nonrouting
    hosts are arbitrarily chosen. You should ensure there is at least one other system
    on the network to allow probing to take place.


    ![](img/b8864f367e279929da7f8395589b04dd_129_1.png)


    # Using Configuration Files


    Configuration files can be used to configure IPMP, which can then be activated
