  md: '# Chapter 1 "Local Area Networks" in the section, "Assigning a Port-Based Ethernet
    Address."


    For this example, assume a system with two network interfaces, hme0 (hostname
    ultra10, IP address 192.168.28.28) and hme1 (hostname ultra10_1, IP address 192.168.28.30),
    and the multicast group is called ultra.


    The first thing to do is make note of the current configuration by using ifconfig
    -a command as shown in the following example. Do this before making any changes
    in case you need to restore it.


    ```

    # ifconfig -a

    lo: flags=1000849<UP,LOOPBACK,RUNNING,MULTICAST,IPv4> mtu 8232 index 1

    inet 127.0.0.1 netmask ff000000

    hme0: flags=1000843<UP,BROADCAST,RUNNING,MULTICAST,IPv4> mtu 1500 index 2

    inet 192.168.28.28 netmask fffffffff broadcast 192.168.28.255

    etther 08:20:b3:41:53

    hme1: flags=1000843<UP,BROADCAST,RUNNING,MULTICAST,IPv4> mtu 1500 index 3

    inet 192.168.28.38 netmask fffffffff broadcast 192.168.28.255

    ether 08:20:b1:40:55

    ```


    To make life easier, add the IP addresses and hostname details to /etc/hostname
    for each of the logical interfaces that will be used as test addresses. In this
    example, use ultra0_mp and 192.168.28.29 for hme0, and ultra10_1_mp and 192.168.28.31
    for hme1.


    To configure IPMP, you need to edit both of the configuration files, /etc/hostname.hme0
    and /etc/hostname.hme1, so that they look like the following:


    ```

    # /etc/hostname.hme0

    ultra10 netmask + broadcast group ultra up \

    addif ultra0_deprecated netmask + broadcast + -failover up

    #

    # /etc/hostname.hme1

    ultra10_1 netmask + broadcast group ultra up \

    addif ultra10_1_deprecated netmask + broadcast + -failover up

    ```


    > The deprecated option means that the interface should not be used for normal
    operations, and the -failover option means that this address is not to be used
    as a failover when a failed interface is detected. This is only a test address
    for in.mpathd to use for failure and rapid detection.


    ![](img/b8864f367e279929da7f8395589b04dd_130_0.png)


    Reboot the system and then run ifconfig -a to verify that the configuration has
    been successful:


    ```

    # ifconfig -a

    lo: flags=1000849<UP,LOOPBACK,RUNNING,MULTICAST,IPv4> mtu 8232 index 1

    inet 127.0.0.1 netmask ff000000

    hme0: flags=1000843<UP,BROADCAST,RUNNING,MULTICAST,IPv4> mtu 1500 index 2

    inet 192.168.28.28 netmask fffffffff broadcast 192.168.28.255

    groupname ultra

    ether 08:20:b3:41:53

    ```'
