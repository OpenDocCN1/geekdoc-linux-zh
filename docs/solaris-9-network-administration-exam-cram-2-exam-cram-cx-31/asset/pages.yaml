  md: '# Testing Your Exam Readiness


    Whether you attend a formal class on a specific topic to get ready for an exam
    or use written materials to study on your own, some preparation for the Solaris
    certification exam is essential. At $150.00 U.S. (£100 U.K.) a try, pass or fail,
    you want to do everything you can to pass on your first attempt. That''s where
    studying comes in.


    I have included in this book several practice exam questions for each chapter,
    as well as two sample tests, so if you don''t score well on the chapter questions,
    you can study now and tackle the sample tests at the end of the book. The score
    needed to pass the exam is 70%. But if you don''t earn a score of at least 75%
    on the sample tests included in this book in Chapters 14 and 16, I recommend that
    you investigate other practice test resources available via the Web—locate these
    using your favorite engine.


    For a given subject, consider taking a class if you''ve tackled self-materials,
    and failed anyway. If you can afford the privilege, the opportunity to interact
    with an instructor and fellow students can make all the difference in the world.
    For information about Sun classes, visit the Training Web site at http://training.sun.com/US/catalog/courses.


    If you can''t afford to take a class, visit the Sun Training Web site anyway,
    because it includes free questions. Even if you can''t afford to spend money,
    you should still invest in low-cost practice exams from commercial vendors, because
    they can help you assess your readiness to pass a test better than any other tool.
    Check with www.unixcert.net for other available resources.


    +   6. Have you taken a practice exam on your chosen subject? [Yes or No]


    If you answered yes—and scored 75% or better—you are probably ready to tackle
    the real thing. If your score isn''t above this crucial threshold, keep at it
    until you reach that barrier. If you answered no, obtain all the free and low-budget
    practice tests you can find (or afford) and get to work. Keep at it until you
    can comfortably break the passing threshold.


    > When it comes to assessing your test readiness, there is no better way to take
    a good-quality practice exam and pass with a score of 75% or better. When preparing
    myself, I always aim higher (80%), to allow for some extra contingency.'
  merge: -1
