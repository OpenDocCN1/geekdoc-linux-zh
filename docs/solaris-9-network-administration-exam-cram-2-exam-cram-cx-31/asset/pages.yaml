  md: '# Configuring IPv6 Logical Interfaces


    Logical interfaces can be created in IPv6, just as in IPv4. To configure a log-
    IPv6 interface hme0:3, for example, with an IPv6 address of fe80::1111:abcd, enter
    the following command:


    ```

    ifconfig hme0:3 inet6 plumb fe80::1111:abcd/10 up

    ```


    The /10 at the end of the IPv6 address specifies that the address uses the first
    10 bits as the format prefix, making the address a link-local unicast address.


    To remove an IPv6 logical interface, the same procedure is used as with IPv4.
    The following command removes the hme0:3 logical interface created in the previous
    example:


    ```

    ifconfig hme0:3 inet6 down unplumb

    ```


    > NOTE You must always specify the inet6 argument when configuring or removing
    an IPv6 interface. If you omit this argument, the system will assume it is an
    IPv4 interface and will carry out the required operation on the relevant IPv4
    interface.'
  merge: -1
