  md: '# Question 3


    +   What function does the SinstPTH symbol have when configuring a DHCP server
    to support JumpStart clients?

    * A. It is the IP address of the JumpStart install server.

    * B. It is the path to the installation image on the install server.

    * C. It is the hostname of the JumpStart install server.

    * D. It is the path to the JumpStart configuration file.


    Answer B is correct because the SinstPTH symbol contains the path to the installation
    image on the install server. Answer A is incorrect because this refers to the
    SinstIP symbol. Answer C is incorrect because this refers to the SinstNM symbol.
    Answer D is incorrect because this refers to the SumpsCF symbol.


    # Question 4


    +   When a DHCP client boots up, it sends a message to locate a DHCP server and
    request an IP address. What type of message is this?

    * A. DHCPDISCOVER

    * B. DHCPOFFER

    * C. DHCPREQUEST

    * D. DHCPACK


    Answer A is correct because a DHCPDISCOVER message is sent by a DHCP client to
    request an IP address. Answer B is incorrect because the DHCPOFFER message is
    sent by the DHCP server in response to a DHCPDISCOVER message. It includes the
    offer of an IP address for the lease. Answer C is incorrect because the DHCPREQUEST
    message is sent by the DHCP client to accept an offer made by a DHCP server. Answer
    D is incorrect because the DHCPACK message is sent by the DHCP server to the client
    to confirm the leasing of an IP address.'
