  md: '# Question 7


    | What are the two parts of an ethernet address called? Choose 2 |

    | A. PID |

    | B. CID |

    | C. BID |

    | D. VID |

    | E. SID |


    Answers B and D are correct. The CID is the company identifier, an assigned portion
    of the ethernet address. The VID is the vendor-specified identifier and is administered
    by the vendor, who assigns a unique value to this portion of the ethernet address.
    Answers A, C, and E are invalid because they have no relevance to ethernet addresses.


    # Question 8


    | Which command is used to capture packets on the network? |

    | A. ping |

    | B. netstat |

    | C. snonoop |

    | D. ndd |


    Answer C is correct. The snonoop command is used to capture packets on the network.
    Answer A is incorrect because the ping command is used to test the reachability
    of another host. Answer B is incorrect because the netstat command provides network
