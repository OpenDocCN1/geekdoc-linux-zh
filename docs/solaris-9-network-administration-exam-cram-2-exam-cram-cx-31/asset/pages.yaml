    \ mtu 1500 index 2\n inet6 fe80::a00e:ffff:feb3:4153/10\n```\n\n# IPv6 Configuration\
    \ on a Router\n\nIPv6 interfaces are defined in the same manner as a router as\
    \ for a non-router, as described in the previous section.\n\nTo configure your\
    \ system as an IPv6 router, create the configuration file /etc/inet/ndpd.conf.\
    \ The file needs at least one entry, which turns on router advertisements. Enter\
    \ the following into the file:\n\n```\nifdefault AdvAdvertisements on\n```\n\n\
    Further entries can be added to the configuration file to advertise prefixes.\
    \ The following example entries advertise a global and site-local prefix for the\
    \ 192.168 network:\n\n```\nprefix 200:0:ca8::/64      hme0\nprefix fe80:0:0:ca8::/64\
    \   hme0\n```\n\nReboot the system. When the system starts up, it will be configured\
    \ as an IPv6 router, and as well as running the neighbor discovery protocol daemon\
    \ in.ndpd, it will also be running the IPv6 routing daemon in.ripngd."
