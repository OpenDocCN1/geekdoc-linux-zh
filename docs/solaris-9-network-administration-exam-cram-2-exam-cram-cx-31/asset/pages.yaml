    # # TCP Flow Control


    TCP is not only reliable protocol, able to guarantee the delivery of data through
    an acknowledgement and retransmit mechanism; it also regulates the flow of data
    at both the sender and receiver side. The flow control mechanism is known as a
    sliding window because it is variable and can change in size according to how
    many packets have been received and processed. The window dictates how much data
    can be read-ahead; the window reduces when data can''t be processed fast enough
    by the local application, and increases when the local application processes data
    at the rate it''s being transferred.


    # # Window Advertisements (Receiver)


    The receiving side sends a window advertisement back to the sender, along with
    an acknowledgement. This tells the sender how many more bytes can be sent before
    the sender has to wait for further acknowledements. Figure 9.3 shows how the receiving
    station controls how many bytes are sent and'
  merge: -1
  pgno: 202
- img_proc: true
  md: 'manages the flow of data between the two hosts. Notice that as the window moves
    through the packets to send, the size of the window varies according to how many
    acknowledements have been received. In Figure 9.3 (a), the window size is set
    to 4, but in (b), some acknowledements have obviously not been received, hence
    the window size is reduced. As acknowledements are received, Figure 9.3 (c) shows
    the window size increasing, allowing the sender to transmit more packets.


    ![](img/b8864f367e279929da7f8395589b04dd_203_0.png)


    Figure 9.3 TCP sliding window using window advertisements.


    Note from Figure 9.3 that the sending window is constantly updated with the current
    size of the window and, as time progresses, the window slides along (varying in
    size), dictating how many packets can be sent—hence the name, sliding window.


    # Congestion Window (Sender)


    The sending side also manages the flow of data across the network by adjusting
    the amount of data it can send according to the number of segments that have recently
    been acknowledged or lost. Congestion is identified by the sending side in the
    form of lost packets. When this occurs, the sending halves the size of the congestion
    window, allowing less data to be transmitted (and thereby easing the congestion).
    When acknowledgements are received for segments recently sent, it is an indication
    that the congestion has cleared, so the congestion window doubles in size, allowing
    more data to be sent.'
