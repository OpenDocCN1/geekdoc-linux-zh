    +   * Time Exceeded—A response has not been received within a specified time.


    # # IP Addresses


    IPv4 addresses are logical and are assigned by the network administrator, unlike
    ethernet addresses, which are physical addresses relating to a network component.
    An IPv4 address is 32 bits long, consisting of four octets, each of eight bits.
    IPv4 addresses are represented in decimal, using what is called *notation*; where,
    each octet is separated by a dot (.). An example of an IPv4 address is 192.168.28.25.


    An IPv4 address is used to identify a host on the network, through a combination
    of network number and host number within the network number. The preceding example
    represents host number 25 on network 192.168.28, but as you''ll see in the following
    subsections, the portion of the IP address assigned to the network varies according
    to its class.


    IPv4 uses three types of addresses: unicast, multicast, and broadcast.


    # # Unicast IPv4 Addresses


    An IPv4 unicast address is used for one-to-one communication, that is, when a
    single host communicates with another single host. There are three classes of
    IPv4 address—class A, B, and C—which are assigned depending on the size of your
    network and the number of hosts that need to be addressed:


    +   * Class A—Used for the largest networks, it permits 16,777,214 addressable
    hosts. In a class A network, the first eight bits of the IPv4 address define the
    network portion, and the first (leftmost) bit is always 0 (binary). This produces
    128 possible class A networks (1–127), although the 127.0.0.0 network cannot be
    used because this contains the reserved loopback address. An example of a class
    A IPv4 address is 47.20.16.8 (the network is 47 and the host is 20.16.8).


    +   * Class B—Used for large- and medium-sized networks, it permits 65,534 addressable
    hosts. In a class B network, the first sixteen bits of the IPv4 address define
    the network portion, and the first two (leftmost) of'
  merge: -1
  pgno: 100
- img_proc: true
  md: '# Chapter 4


    bits are always 10 (binary). This produces 16,384 class B networks. The remaining
    sixteen bits are used to identify the hosts. An example of a class B IPv4 address
    is 145.212.8.15 (the network is 145.212 and the host is 8.15).


    +   Class C—Used for smaller networks, it permits 254 addressable hosts. In a
    class C network, the first 24 bits of the IPv4 address define the network portion,
    and the first three (leftmost) of these bits are 110 (binary). This produces 2,097,152
    class C networks (192–223). The remaining 8 bits are used to identify the hosts.
    An example of a class C IPv4 address is 215.156.18.185 (the network is 215.156.18
    and the host is 185).


    > The IANA (Internet Assigned Numbers Authority) reserved a range of IPv4 addresses
    in class for private networks that will not be connected to the Internet. These
    networks have no routing established and can be used by private individuals or
    companies for their local networks. The ranges of private IPv4 addresses are defined
    in RFC 1918. The reserved are


    +   - Class A—10.0.0.0–10.255.255.255

    - Class B—172.16.0.0–172.31.255.255

    - Class C—192.168.0.0–192.168.255.255


    Figure 4.1 shows the three classes of IPv4 unicast addresses in binary format,
    along with the relevant ranges applicable to each class.


    ![](img/b8864f367e279929da7f8395589b04dd_101_0.png)


    For each IPv4 network address that is assigned, without respect to its class,
    both the first and last host addresses are reserved and cannot be used as operational
    IPv4 addresses because they represent the network itself (the first address) and
    the broadcast address (the last address). For example, if you are assigned the
    network 192.168.28.0 then the address 192.168.28.0 is the network itself and 192.168.28.255
    is the default broadcast address. This is why a class C network address, for example,
    permits only 254 addressable hosts, instead of the 256 that you might expect from
    eight bits.'
