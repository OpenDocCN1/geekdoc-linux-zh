    # Duplicate Address Detection


    One of the features of autoconfiguration is that of a duplicate address detection
    facility. This runs before an IPv6 address is assigned to ensure the address is
    unique. Duplicate address checking is carried out regardless of whether stateful
    or stateless autoconfiguration is used to assign the IPv6 address.


    The procedure works by sending a neighbor solicitation message to the network
    on which the address is going to be assigned. A neighbor advertisement will be
    received back from any systems that are using the address in question. If no response
    is received, it is assumed that the address is available to be used, and the assignment
    takes place.


    # Implementing IPv6


    IPv6 is implemented at system boot by the script /etc/rc2.d/s69inet. This script
    determines whether the system is a router or a host, and starts the relevant processes.
    This section describes the IPv6 processes and how to configure IPv6 interfaces.


    # Neighbor Discovery Protocol (NDP)


    The neighbor discovery protocol (NDP) is implemented in IPv6 to provide the following
    facilities:


    +   * Address autoconfiguration—Enables a host to automatically configure an IPv6
    address for a network interface.


    +   * Address resolution—Enables a host to determine the ethernet address of a
    neighbor, giving the neighbor''s IPv6 address. (The interface identifier of the
    IPv6 address is based on the ethernet address.)'
  merge: -1
  pgno: 177
- img_proc: true
  md: '# Basic IPv6 143


    +   - Neighbor unreachability detection—Enables a host to determine that a neighbor
    is no longer reachable. This is important when the neighbor is acting as a router,
    so a different route can be found.


    +   - Duplicate address detection—Enables a host to determine that the IPv6 address
    it wants to assign is not in use by another interface on the network.


    +   - Parameter discovery—Enables a host to learn network parameters of a neighbor,
    such as the maximum transfer unit (MTU).


    +   - Prefix discovery—Enables a host to discover the address prefixes for destination
    systems attached to the network. This information is used to find which destination
    hosts are on the local network and which are only accessible via a router.


    +   - Router discovery—Enables a host to locate routers that are attached to the
    local network.


    The daemon process that implements NDP is in.ndpd and is started at boot time
    by the startup script /etc/rc.d/s69inet. The script tests to see whether the system
    is acting as a router by checking for the existence of the configuration file
    /etc/inet/ndpd.conf. If the file is present, the system is assumed to be an IPv6
    router, if not, an IPv6 host.


    Routing in IPv6 is carried out by the in.rip6d process, which is initiated from
    the startup script /etc/rc.d/s69inet. This process is started only if the system
    is assumed to be an IPv6 router; that is, if the configuration file /etc/inet/ndpd.conf
    exists.


    ![](img/b8864f367e279929da7f8395589b04dd_178_0.png)


    # IPv6 Configuration on a Non-Router


    IPv6 addresses can be configured automatically with the autoconfiguration facility,
    or manually with the ifconfig command at the command-line. The two options can
    be described as follows:


    +   - Automatic—To enable IPv6 on a network interface facility, create the file
    /etc/hostname6.<interface> where <interface> corresponds to the specific network
    interface to be configured, such as hme0 as shown here:


    ```

    ultra10# touch /etc/hostname6.hme0

    ```


    Now reboot the system and the interface will be configured automatically.'
  merge: -1
  pgno: 178
- img_proc: true
  md: "# Chapter 7\n\n> Manual—To manually assign an IPv6 address to a network interface,\
    \ such as hme0, use the ifconfig command with IPv4, but you must specify the inet6\
    \ family to indicate that this is an IPv6 configuration. Note that the assignment\
    \ does not persist across reboots of the system. The following piece of code initializes\
    \ a link-local IPv6 address fec::abcd on the hme0 interface:\n\n```\nultra10#\
    \ ifconfig hme0 inet6 fec::abcd\n```\n\nThe file /etc/inet/ipnodes is used in\
    \ IPv6 to associate IPv6 addresses with interface names, similar to the function\
    \ of /etc/inet/hosts for IPv4 interfaces. Unlike /etc/inet/hosts, there is no\
    \ symbolic link from /etc/inet/ipnodes to /etc/ipnodes, so don't be tricked if\
