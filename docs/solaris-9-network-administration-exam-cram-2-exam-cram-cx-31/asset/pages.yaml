  md: '# Assessing Your Readiness for Exam 310-044


    In addition to the general exam-readiness information in the previous section,
    other resources are available to help you prepare for the exam. Two good sites
    are www.solariscentral.org and www.solarisguide.com. The tek-tips forum at www.tek-tips.com
    has a forum relating to Sun certification and contains others'' useful comments
    about the Sun certification exams. Also, it is well worth consulting the newsgroups—comp.unix.solaris
    and comp.sys.sun.admin—available via news services or via Google Groups. These
    are excellent places to ask about topics you are having trouble understanding
    and get good answers, or simply to observe the questions that others ask. The
    Sun Blueprints program at www.solaris.com/blueprints provides many in-depth articles
    on various Solaris topics as well.


    One last note: I can''t stress enough the importance of hands-on experience in
    the context of exams. As you review the material for the exam, you''ll realize
    that hands-on experience with Solaris 9 commands, tools, and utilities is invaluable.


    # Onward, Through the Fog!


    After you''ve assessed your readiness, undertaken the right background studies,
    obtained the hands-on experience that will help you understand the products and
    technologies at work, and reviewed the many sources of information to help you
    prepare for the test, you''ll be ready to take a round of practice tests. When
    your scores come back high enough to get through the exam, you''re ready to go
    for the real thing. The Introduction of this book includes information about obtaining
    vouchers and scheduling the exam. If you follow my assessment regime, you''ll
    not only know what you need to study, but when you''re ready to make a test date
    at Prometric. Good luck!'
