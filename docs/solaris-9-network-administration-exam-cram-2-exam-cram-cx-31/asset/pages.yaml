  md: '# Router Discover Protocol (RDISC)


    The RDISC protocol is used to provide default routes between a host and the routers
    on the network. The daemon process that is run to discover routers is in.rdisc.
    In a similar way to in.routed, in.rdisc has two forms of execution: one for routers
    and one for non-routers. A router advertises its presence on the network every
    10 minutes (600 seconds) by default using the local multicast address (224.0.0.1),
    although this value can be changed. A non-router listens to the advertisements
    and populates its routing table with the default route entries. The in.rdisc process
    is started from the startup script /etc/rc2.d/s69init, only if the following conditions
    are satisfied:


    +   - The system has multiple network interfaces configured.

    - The files /etc/defaultrouter and /etc/notrouter are not present.

    - The network interfaces are not being managed by the Dynamic Host Configuration
    Protocol (DHCP).


    There are several advantages in using RDISC:


    +   - Resilience can be added to the network because of the existence of multiple
    default routes.

    - The default routes remove the need for multiple, often unnecessary, route entries,
    creating a smaller route table.

    - RDISC is not tied to any particular routing protocol, such as RIP; it is independent.

    - RDISC uses a multicast address rather than a broadcast address, resulting in
    less network traffic.


    > Routers running the RDISC protocol still need to run a routing protocol, such
    as RIP. RDISC only provides a default route from a host to a router; it does not
    advertise routers as a routing protocol does.


    A non-router runs the in.rdisc process with the -s option to request information
    from routers on the network, as shown here:


    ```

    ultra10# /usr/sbin/in.rdisc -s

    ```


    A router uses the -r option to the in.rdisc command to cause it to advertise its
    presence on the network every 600 seconds by default. You can modify the


