    # Multicast IPv4 Addresses


    A multicast address is one where data is transmitted from a single host to a number
    of specific hosts at the same time, and it is referred to as a class D IPv4 address.
    This differs from the unicast address, where data is sent to a single host, in
    that it applies to a group of hosts that are associated with the multicast address—that
    is, they belong to the same multicast group. A multicast address might be used
    for example, to distribute an online newsletter to a list of subscribed hosts,
    or to update mobile addresses. An IPv4 multicast address is 32 bits long, like
    all other IPv4 addresses, the first (leftmost) four bits are always 1110 (binary),
    making the first octet in the range 224–239. The remaining 21 bits make up the
    multicast address for a specific group. The most common multicast address used
    by Solaris 9 is 224.0.0.1, which references a multicast group comprising all hosts
    on this subnet. The three octets (0.0.1) are mapped to the lower three octets
    of the ethernet multicast address for the network interface, so if your ethernet
    address is 08:00:20:4b:1e:52, the ethernet multicast address will be 08:00:20:00:00:01.'
