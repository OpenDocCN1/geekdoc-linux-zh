  md: '# 216 Chapter 11


    ![](img/b8864f367e279929da7f8395589b04dd_251_0.png)


    Figure 11.20 DHCP Manager window.


    A configuration file is created when you run the server configuration utility.
    This file is located in /etc/inet/dhcpvsc.conf and should not be edited by hand.
    The configuration file created during this session is shown here:


    ```

    ultra0@ cat /etc/inet/dhcpvsc.conf

    DAEMON_ENABLED=TRUE

    RUN_MODE=server

    RESOURCE=SUNwfiles

    PATH=/var/dhcp

    CONVER=1

    HOSTS_RESOURCE=files

    ```


    > The DHCP server configuration file, /etc/inet/dhcpvsc.conf, was stored in /etc/default/dhcp
    in previous Solaris releases. In an exam question, it could be an option that
    distracts you from the correct answer.


    # dhcpconfig


    The dhcpconfig utility is intended for use by more advanced system administrators
    and lends itself well to configuration using scripts. It is command-line tool
    for configuring the DHCP server and is a much quicker way of creating the server
    than using the graphical utility, dhcpmgr. Specifically, dhcpconfig provides options
    to'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# Basic Dynamic Host Configuration Protocol (DHCP) 217


    +   - Configure a new DHCP server.

    - Convert an existing datastore to a different format, making the new format ready
    for use.

    - Import data from other DHCP servers and export data to other DHCP servers.

    - Unconfigure an existing DHCP server, with additional options to remove host
    entries and the DHCP database files.


    > > NOTE In previous releases of Solaris, dhcpconfig was a menu-driven utility.
    This has changed with Solaris 9, where it is now a command-line utility. Also,
    an additional datastore format, binary files (SUNbinary), was released with Solaris
    9—previous releases had only two formats, text files (SUNfiles) and NIS+ table
    (SUNnisplus).


    Configure the DHCP server, you must first define the datastore type and the directory
    to be used for storing the database files. Additionally, you can specify a DNS
    domain name and a DNS server. The following example shows the command which configures
    a DHCP server to use a text datastore (SUNfiles), with /var/dhcp being the repository
    directory (-p option). It also identifies the DNS domain (-d option) and a DNS
    server (-a option) and that the local /etc/inet/hosts (-h option) is to store
    hostname and IP addresses:


    ```

    ultra10@ dhcpconfig -D -r SUNfiles -p /var/dhcp -d xyz.com -a 192.168.28.20 -h
    filesnCreated DHCP configuration file.

    Created dhcptab.

    Added ''Local'' macro to dhcptab.

    Added server macro to dhcptab - ultra10.

    DHCP server started.

    ```


    Note that the messages received on the screen as the configuration proceeds let
    you know what is happening. The configuration file /etc/inet/dhcpsvc.conf is created
    along with the dhcptab. Two macros have been defined in the table and the server
    process, in.dhcpd, is now running.


    This server doesn''t actually do anything at this point because it is not managing
    any specific network and does not have a list of IP addresses under its control.
    This is done next.


    Use the dhcpconfig command again to specify the network for which the DHCP server
    is going to provide a service. The following example also uses a single router,
    specified with the -t option:


    ```

    ultra10@ dhcpconfig -N 192.168.28.0 -t 192.168.28.28

    Added network macro to dhcptab - 192.168.28.0.

    Created network table.

    ```'
