  md: '# Question 8


    There are four NTP servers present on your network, and each is configured with
    a different stratum level between 1 and 4. Which stratum level is deemed the most
    reliable?


    +   - A. 1

    - B. 2

    - C. 3

    - D. 4


    Answer A is correct because the lower the stratum level, the more reliable the
    clock. Stratum level 0 servers are normally reference sources, such as a GPS signal.
    A stratum level 1 server would normally be directly connected to a reference source.'
