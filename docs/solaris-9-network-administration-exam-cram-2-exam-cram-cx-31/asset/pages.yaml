    This book treats the TCP/IP model as a four-layer model because the Sun Microsystems
    objective for this exam mentions only four layers—the inference is that the Hardware
    layer is integrated into the Network Interface layer. Figure 2.1 shows the hierarchical
    nature of the TCP/IP model layers as well as each layer''s position in the hierarchy.


    | Application Layer |

    | Transport Layer |

    | Internet Layer |

    | Network Interface Layer |

    | Hardware Layer |


    Figure 2.1 The TCP/IP model layer hierarchy.


    # Network Interface Layer


    As you can see from Figure 2.1, the Network Interface layer is the lowest in the
    TCP/IP hierarchy and provides the communication service to the Internet layer.
    The Network Interface layer prepares data packets received from the Internet layer
    into suitably sized packets for transmission across the physical network. Also,
    it receives packets from its peer layer on another host and passes them up to
    the Internet layer. Addressing at this layer is based on the MAC address. Specifically,
    this layer does the following:


    +   - Handles the transmission of data across the physical network.

    - Assembles data for transmission into Ethernet frames. (Ethernet frames are discussed
    in Chapter 1.)

    - Detects errors through the use of the Cyclic Redundancy Check (CRC) field in
    the Ethernet frame.'
