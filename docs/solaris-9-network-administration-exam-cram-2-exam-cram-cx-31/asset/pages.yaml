  md: '# How to Use the Software


    PrepLogic is designed to be user friendly and intuitive. Because the software
    has a smooth learning curve, your time is maximized because you start practicing
    with it almost immediately. PrepLogic Practice Exams, Preview Edition, has two
    modes of study: Practice Exam and Flash Review.


    Using Practice Exam mode, you can develop your test-taking abilities as well as
    your knowledge through the use of the Show Answer option. While you are taking
    the test, you can expose the answers with detailed explanations of why answers
    are right or wrong. This helps you better understand the material presented.


    Flash Review mode is designed to reinforce exam topics rather than quiz you. In
    this mode, you are shown a series of questions but no answer choices. You can
    click a button that reveals the correct answer to each question and a full explanation
    for that answer.


    # Starting a Practice Exam Mode Session


    Practice Exam mode enables you to control the exam experience in ways that actual
    certification exams do not allow. To begin studying in Practice Exam mode, you
    click the Practice Exam radio button from the main exam customization screen.
    This enables the following options:


    +   * The Enable Show Answer button—Clicking this button activates the Show Answer
    button, which allows you to view the correct answer(s) and a full explanation
    for each question during the exam. When this option is not enabled, you must wait
    until your exam has been graded to view the correct answer(s) and explanation
    for each question.


    +   * The Enable Item Review button—Clicking this button activates the Item Review
    button, which allows you to view your answer choices. This option also facilitates
    navigation between questions.


    +   * The Randomize Choices option—You can randomize answer choices from one exam
    session to the next. This makes memorizing question choices more difficult, by
    keeping questions fresh and challenging longer.


    On the left side of the main exam customization screen, you are presented with
    the option of selecting the preconfigured practice test or creating your own custom
    test. The preconfigured test has a fixed time limit and number of questions. Custom
    tests allow you to configure the time limit and the number of questions in your
    exam.'
  merge: -1
  pgno: 395
