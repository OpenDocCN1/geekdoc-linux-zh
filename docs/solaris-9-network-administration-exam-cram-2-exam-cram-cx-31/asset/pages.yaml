  md: '# Chapter 3


    This chapter introduces two protocols that operate between the Network Interface
    layer and the Internet layer of the TCP/IP model—ARP and RARP. These protocols
    are used to provide address resolution between ethernet and IP addresses. This
    chapter explores what these protocols are and how they work, as well as the files
    they reference.


    # Address Resolution Protocol (ARP)


    ARP is used to map a 32-bit IP address to a 48-bit ethernet address. As you saw
    Chapter 1, "Local Area Networks," an ethernet frame contains the sending and receiving
    ethernet addresses. If two systems need to communicate across a network, otherwise
    the ethernet frame will not be delivered to the correct recipient, very much like
    what would happen if you sent a letter to someone but left the address blank.\
    ARP uses the broadcast mechanism to try and find a host''s ethernet address. The
    only information that ARP possesses, at this point, is the IP address so basically
    it sends a request to all stations on the local network, asking, "Who has the
    IP address 192.168.0.1?" The receiving station that has been assigned the relevant
    IP responds with its own ethernet address.


    The following fragment of output from the snoop command shows a remote host that
    is booting. Initially, it doesn''t respond, but when its network interface has
