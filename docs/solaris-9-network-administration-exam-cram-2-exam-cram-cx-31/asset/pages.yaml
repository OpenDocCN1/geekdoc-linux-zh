  md: '# Domain Name System (DNS) 183


    > A number of zone files are specified, along with the locations of the data files.
    The allow-transfer directive makes use of the access control list slaves so that
    zone can be transferred to only servers that are on the specified network, in
    this case 192.168.28.x. It enforces security so that an unauthorized host cannot
    obtain the name and address information.


    > The zone file 28.168.192.in-addr.arpa refers to the reverse lookup file for
    the zone. The domain in-addr.arpa is a conceptual domain used for reverse resolution—that
    is, IP address-to-hostname. It is frequently used for authentication purposes
    to verify the identity of a remote host.


    There are no forward references allowed in the /etc/named.conf file, so any definitions
    must be set up before they are referenced. You might get a question showing an
    invalid configuration file where a reference is used before it is defined.


    ![](img/b8864f367e279929da7f8395589b04dd_218_0.png)


    # The named.ca File


    The named.ca file contains the list of root servers. This file is particularly
    important if your DNS server is connected to the Internet it contains the names
    and IP addresses of the servers managing the top-level domains, such as com and
    gov, for example. The file is managed by IANA and is globally accessible. Periodically—say,
    every two months—this file should be checked on the Internet to see whether any
    changes have been made, and downloaded to keep it up to date.


    The list of root servers can be obtained from ftp://ftp.internic.net/domain/named.root.


    The current file looks like this:


    ```

    ultra1# cat /var/named/named.ca

    ; This file holds the information on root name servers needed to

    ; initialize cache of Internet domain name servers

    ; (e.g. reference this file in the .cache )

    ; configuration file of BIND domain name servers).

    ```


    ```

    ; This file is made available by InterNIC

    ; under anonymous FTP as

    ; file /domain/named.root

    ; on server FTP.INTERNIC.NET

    ```


    ```

    ; last update: Nov 5, 2002

    ; related version of root zone: 2002110501

    ```


    ```

    ; formerly NS.INTERNIC.NET

    ; 3600000 IN NS A.ROOT-SERVERS.NET.

    A.ROOT-SERVERS.NET. 3600000 A 198.41.0.4

