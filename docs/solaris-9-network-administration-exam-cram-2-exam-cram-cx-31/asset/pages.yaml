  md: '# 262 Chapter 13


    > The clock types are listed in the template server configuration file /etc/inet/ntp.server.


    # Setting Up an NTP Server


    To configure a system as an NTP server, the configuration file template /etc/inet/ntp.server
    needs to be copied to /etc/inet/ntp.conf. This file should be edited to suit your
    own configuration requirements. /etc/inet/ntp.server contains a valid list of
    clock types as well as configuration parameters. The parameters are shown in the
    following example:


    ```

    # /etc/inet/ntp.server

    # ident "@#)ntp.server 1.6    00/07/17 SMI"

    # /etc/inet/ntp.server

    # An example file that could be copied over /etc/inet/ntp.conf and

    # edited; it provides a configuration template for a server that

    # listens to an external hardware clock, synchronizes the local clock,

    # and announces itself on the NTP multicast net.

    ```


    This is the external clock device. The following devices are recognized by xntpd
    3-5.93e:


    | XType Device | RefID | Description |

    |---|---|---|

    | # 1 local | LCL | Undisciplined Local Clock ... (Truncated output) |


    ```

    # * All TrueTime receivers are now supported by one driver, type 5.

    # Types 15 and 25 will be retained only for a limited time and may

    # be reassigned in future.

    # Some of the devices benefit from "fudge" factors. See the xntpd

    # documentation.

    server 127.127.XType.@ 0 prefer

    fudge 127.127.XType.@ stratum 0

    ```


    ```

    broadcast 224.0.1.1 ttl 4


    enable auth monitor

    driftfile /var/ntp/ntp.drift

    statsdir /var/ntp/ntstats/

    filegen peersstats file peersstats type day enable

    filegen loopstats file loopstats type day enable

    filegen clockstats file clockstats type day enable

    keys /etc/inet/ntp.keys

    trustedkey 0

    requestkey 0

    controlkey 0

    ```'
  merge: -1
  pgno: 297
- img_proc: true
  md: 'The parameters of interest are described here:


    +   - server 127.127.Xtype.0 prefer—The IP address of the preferred NTP server.
    To configure a local undisciplined clock as the server, you would change this
    to 127.127.1.0. The prefer option is used when multiple servers are defined, to
    define a preference weighting for the order in which servers are referenced. An
    undisciplined clock is one that does not get its time from a reliable source,
    like a GPS signal. It is used to synchronize systems on a network with the same
    time, which is not necessarily absolutely correct.


    +   - fudge 127.127.Xtype.0 stratum 0—The fudge option is used for special configuration
    options. For example, it can be used to change the stratum level of a reference
    clock: The lower the stratum level, the more reliable the source.


    +   - broadcast 224.0.1.1 ttl 4—This is the multicast address that the server
    uses to broadcast to the network. The ttl 4 parameter specifies that the broadcast
    will time out in 4 seconds.


    +   - enable auth monitor—The authentication and monitoring facility.


    +   - driftfile /var/ntp/ntp.drift—The default location of the drift file.


    +   - statsdir /var/ntp/ntpstats/This is the default location of the directory
    containing NTP statistics.


    +   - filegen entries—These (optional) three entries generate daily NTP statistics
    and are as follows:


    +   - loopstats—Each update of the local clock is recorded.


    +   - peerstats—Enables the recording of NTP peer server statistics and updates
    from peer NTP servers.


    +   - clockstats—Collects statistics from the clock driver, that is, the soft-ware
    controlling a reference clock.


    +   - keys /etc/inet/ntp.keys—The default location for the key file if authentication
    is used.


    +   - key entries—These three entries define secure identifiers providing a mechanism
    for NTP clients and servers to authenticate each other (this is described fully
    in RFC 1305). The three entries are as follows:


    +   - controlkey—Specifies a key identifier between 1 and 65535 that is used to
    authenticate commands issued to the ntpq program.


    +   - requestkey—Specifies a key identifier between 1 and 65535 that is used to
    authenticate commands issued to the ntppd program.'
  merge: -1
  pgno: 298
- img_proc: true
  md: '► trustedkey—Specifies the key identifiers that are trusted for commands issued
    to the ntpq xntpd commands. The values in this entry should be the same as those
    for the controlkey and requestkey entries.


    After you have configured the ntp.conf file, create an empty drift file at the
    location specified in the configuration file and then start the xntpd daemon as
    follows:


    ```

    # /etc/init.d/xntpd start

