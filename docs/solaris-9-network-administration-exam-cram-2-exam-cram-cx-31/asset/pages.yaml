    - D. ifconfig hme0 addif 192.168.5.5 up


    Answer D is correct because the command ifconfig creates a logical interface using
    the next available logical interface number and the IPv4 address 192.168.5.5.
    Answer A is incorrect because this command, it will configure a logical interface,
    specifically states which logical interface to use. In this case, it could destroy
    and replace an existing logical interface. Answer B is incorrect because the syntax
    is wrong. In this answer, the hme0:1 logical interface is being specified, as
