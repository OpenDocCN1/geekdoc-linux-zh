  md: '# The TCP/IP Model 39


    # Internet Layer


    The Internet layer resides above the Network Interface layer, is responsible for
    the routing of data to the destination host, and tries to ensure that the most
    efficient route is taken. IP addresses are used at this layer, unlike the Network
    Interface layer, where MAC addresses are used. This layer uses a routing table
    to find the next host on the network that is on the route to the destination.
    This might be the actual destination node, or the nearest gateway. Data packets
    at this layer are called IP packets. Chapter 4, “Fundamental IPv4,” and Chapter
    7, “Basic IPv6,” discuss the IP protocol and addressing in more detail.


    # Transport Layer


    The Transport layer is responsible for the end-to-end delivery of the data through
    the use of


    +   - Sequencing of packets so that receipt of packets can be verified.

    - Acknowledgements so that the sending host can verify that each packet has arrived
    at its destination.

    - Flow control so that network congestion can be handled effectively.


    The Transport layer is located above the Internet layer and provides a more reliable
    service. The Network Interface layer, for example, might encounter a CRC error,
    indicating that a data packet was corrupted—this layer would flag the error, but
    wouldn''t request a retransmission of the failed packet; the Transport layer would
    handle this. This layer is discussed in more detail in Chapter 9, “TCP and UDP.


    # Application Layer


    The Application layer is the top layer of the TCP/IP model and interacts with
    the running processes that make use of network communications. Examples of network
    communication processes are Telnet, File Transfer Protocol (FTP), Dynamic Host
    Configuration Protocol (DHCP), Domain Name System (DNS), Network File System (NFS),
    and of course, the web browser.


    Specifically, this layer does the following:


    +   - Handles the data format—For example, a Unix system is communicating with
    an IBM system, the Unix system encodes in ASCII (American Standard Code for Information
    Interchange), whereas IBM'
