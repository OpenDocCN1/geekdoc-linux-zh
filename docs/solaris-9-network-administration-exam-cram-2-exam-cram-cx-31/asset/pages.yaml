  md: '# Ring Topology


    The ring network is a configuration in which the hosts are connected in a loop.
    Each host is directly connected to its two adjacent hosts, one on either side.
    This topology offers slightly better resilience than bus or star topologies because
    a single failure results only in a degradation of the network; it takes two cable
    breaks, in separate segments, before any hosts become disconnected from the network.
    Figure 1.3 shows an example of a simple ring configuration.


    ![](img/b8864f367e279929da7f8395589b04dd_39_0.png)


    Figure 1.3 A ring configuration.


    Two rings can also be used to provide added resilience. The Fiber Distributed
    Data Interface (FDDI) is the most common example of this, in which the second
    ring continues to function if the primary ring fails.


    # Mixed Topologies


    Networks commonly use more than one topology because it is more practical and
    cost effective; this is called a mixed topology. For example, a department might
    use a bus configuration as its main backbone but have multiple star networks connecting
    the hosts in each section. In universities, dual-ring networks, such as FDDI,
    are used as the backbone. Figure 1.4 shows how a mixed configuration may be used.'
  merge: -1
  pgno: 39
- img_proc: true
  md: '![](img/b8864f367e279929da7f8395589b04dd_40_0.png)


    **Figure 1.4** An example of a mixed configuration.


    # # Virtual LAN Topologies


    Virtual local area networks (VLANs) have become more popular, but they require
    the use of an intelligent central switch or hub. *VLANs* are similar in functionality
    to having multiple star networks, but in this case, they all use the same physical
    switch as the central hub. A VLAN is created by assigning specific ports on the
    central hub to separate networks. The hosts on each VLAN communicate with each
    other as if they were on the same physical network segment. An advantage of the
    VLAN concept is that the network traffic on one VLAN is separate from the network
    traffic on another VLAN, making more efficient use of the available bandwidth.
    A further advantage is that hosts can be moved between VLANs without requiring
    any hardware configuration. Of course, the central switch, or hub, remains a single
    point of failure. Figure 1.5 demonstrates how an intelligent hub can be used to
    create two separate VLANs, (the hosts are shaded and labeled to show to which
    network they belong).'
  merge: -1
  pgno: 40
- img_proc: true
  md: '![](img/b8864f367e279929da7f8395589b04dd_41_0.png)


    Figure 1.5 An example of a VLAN configuration.


    # # Network Devices


    Assembling the necessary hardware is the first step in setting up every network.
    This differs depending on the size and complexity of the network, but this section
    provides some fundamental descriptions of the more common network devices.


    # # Network Adapters


    The *network adapter* is usually a card installed into a server or workstation
    to enable the host to connect to the network. Some computer systems come with
    an *integrated* network adapter, which means it is built on the main motherboard.
    Different network adapters are available depending on the type of network and
    the type of connection media. For example, ethernet and token-ring networks require
    different network adapters, as do twisted-pair and fiber-optic cable media. The
    different types of cable media are summarized in a later section. Every network
    adapter, whether in a Solaris workstation or a PC, is supplied with a unique 48-bit
    address, known as the *media access control (MAC) address*, which is described
    in the section “Ethernet” later in this chapter.


    # # Repeaters


    A *repeater* is used in computer networks to extend the length of a segment of
    the network. Cable media has defined maximum lengths that the cable can be. When
    longer distances are used, the electrical signals passed down the cable become
    distorted because of electrical noise and resistance from the cable itself, causing
    errors to appear on the network. The repeater acts as a'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# Local Area Networks


    booster for the electrical signal so that hosts situated farther away can still
    receive good-quality signals. In an ethernet network, you can connect a maximum
    of four repeaters, enabling five segments to appear as a single cable.


    # Hubs


    A hub, or shared hub, is similar to a repeater but has many more ports—indeed,
    it is sometimes referred to as a multiport repeater. Whereas a repeater merely
    extends the network segment with only two connectors, a hub is used in a star
    topology network to connect a number of hosts. When the hub receives a signal,
    it is regenerated to all the other ports on the hub. Larger LANs normally use
    multiple hubs connected to a central backbone (see Figure 1.4 earlier in this
    chapter for an example of a mixed configuration using a backbone and several star
    networks). Collision rates can be higher using hubs because each signal is repeated
    to each port, which creates a greater amount of network traffic.


    # Switches


    A switch can be thought of as an intelligent hub. It is a multiport device, similar
    to a hub, used as part of a star network. The main difference is that signals
    are not repeated to each port; instead, a signal is repeated only on the destination
    port, based on the MAC address of the destination host. This greatly reduces the
    amount of network traffic that is generated and enables multiple data paths to
    be established and used simultaneously without the high collision rates of a hub.
    If a broadcast data packet is received, it is replicated on all the ports of the
    switch. The switch is also a central part of VLAN networks, where ports can be
    configured to belong to separate virtual networks. Previously, this would have
    been achieved only through the use of a separate hub for each network. Figure
    1.6 shows the before-and-after view of the advantages of using an intelligent
    switch in this way.


    # Bridges


    A bridge is a device that connects a LAN to another LAN that uses the same protocol,
    such as ethernet. It can have multiple ports, with each port connected to a separate
    LAN. It determines whether to forward a packet based on the MAC address. When
    a data packet is received, the bridge constructs a dynamically maintained forwarding
    table of MAC addresses and forwards the packet to the network containing the address.
    If the destination MAC address is not known, the packet is forwarded to all networks'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'connected to its ports. If a MAC address is not in the forwarding table, it
    is automatically added.


    Before After


    ![](img/b8864f367e279929da7f8395589b04dd_43_0.png)


    **Figure 1.6** An example showing the advantages of an intelligent switch.


    # Routers


    A router is a device—but can also be software—that determines part of the route
    a packet needs to to reach its destination. A router is connected to a minimum
    of two networks and is used to determine which direction a packet takes, based
    on either static route definitions or dynamic information obtained from the network
    itself. Today, routers also act as security devices, where specified traffic can
    be either allowed through the router or blocked, depending on the security policy
    that is implemented. Routers are also frequently used as firewalls to protect
    company networks from unauthorized intruders on the Internet. The router determines
    whether to forward a data packet based on the IP address, unlike the bridge, which
    uses the MAC address.'
  merge: -1
  pgno: 43
- img_proc: true
  md: '# Gateways


    A gateway is often described as being synonymous with a router, but this is not
    entirely accurate. Similar to a router, the gateway connects networks together,
    but unlike a router, it can connect networks of different types. Networks connected
    by a router use a common protocol, whereas networks connected by a gateway can
    use different protocols. It is this capability that has led to gateways being
    called protocol converters.


    > Be sure you understand the differences between a bridge, router, and gateway.
    You might be asked to differentiate between them.


    ![](img/b8864f367e279929da7f8395589b04dd_44_0.png)


    # Network Media


    The media used in a network configuration refers to the medium used to convey
    packets of data between hosts on the network. The most common form of network
    media today is cable, which is covered in the next section. Wireless networks
    are also beginning to increase in popularity, but these are not discussed in this
    book because they are not relevant to the Sun Certified Network Administrator
    Exam for Solaris 9. The Institute of Electrical and Electronics Engineers (IEEE,
    pronounced eye triple E) is a professional body responsible for the majority of
    network media standards.


    # Network Cables


    Cables used in a network configuration carry electrical or light signals to enable
    a host to communicate with another host. There are three major cable types in
    use today: coaxial, twisted-pair, and fiber-optic.


    # Coaxial


    This type of cable was the mainstay of earlier ethernet networks before the introduction
    of twisted-pair and fiber-optic cables. Coaxial cable uses a central core that
    is insulated and wrapped into a conductive cladding. All of this is then wrapped
    into an outer plastic casing. Coaxial cable is still used in environments with
    electromagnetic interference because it is well-insulated. The two types of coaxial
    cable are thick and thin. Thick cable is used for distances up to 500 meters,
    and thin is used for distances up to 185 meters. Coaxial cable uses a special
    connector at each end of the cable, called'
  merge: -1
  pgno: 44
- img_proc: true
  md: '# Chapter 1


    a terminator. Terminators possess the same resistance as the cable itself and
    effectively absorb the signals, preventing them from reflecting back along the
    cable.


    # Twisted-Pair


    Twisted-pair is the most commonly used cable for LANs and consists of four pairs
    of twisted wire, all wrapped into a plastic insulator. The two types of twisted
    cabling are shielded twisted-pair (STP) and unshielded twisted-pair (UTP). An
    STP cable has a metallic shield surrounding the four pairs of wires, providing
    much better resistance to electromagnetic interference. STP is also more expensive,
    so it is used only in environments in which electromagnetic noise levels are high.
    A UTP cable has no such shield.


    # Fiber-Optic


    Unlike coaxial and twisted-pair cables, fiber-optic signals are sent as light
    waves. These have a much higher capacity because greater bandwidth is available.
    Fiber-optic networks can span larger geographical areas compared to the other
    cables. The two main modes of fiber-optic are single mode fiber (SMF), in which
    only one signal can be sent along the cable at a time, and multimode fiber (MMF),
    in which multiple signals can be sent along the cable simultaneously at different
    angles of reflection. Fiber-optic cables are popularly used as backbones in larger
    campus networks, with FDDI being the most common.


    # IEEE Ethernet Standards


    The IEEE has developed and maintained a number of media standards for use with
    its 802.3 (ethernet) network type. Which one you use for your network depends
    on the following factors:


    +   > The physical distance the network has to cover

    > Security requirements of the media itself

    > The cost of the media and of installing it

    > Whether the media is supported by current technologies


    The following sections describe the various IEEE media standards along with their
    properties, capacities, and distances where appropriate.


    # 10BASE Types


    The 10BASE family of media types has a maximum capacity of 10Mbps and uses baseband
    signaling. The properties of each is described in the following:'
  merge: -1
  pgno: 45
- img_proc: true
  md: '10BASE-2—Thin coaxial cable that was the most popular, and cheapest, implementation
    prior to the introduction of twisted-pair. 10BASE-2 networks have a distance limit
    of 185 meters. The 2 in the designation is rounded up to 200 meters.


    10BASE-5—A thick (half inch) coaxial cable was the first media type to be used
    in the ethernet standard of 1980. This cable was quite inflexible, although still
    cheap to install given it provided electrical shielding, too. It was frequently
    used as backbone cabling with a maximum distance of 500 meters.


    10BASE-T—The most widely used cable for desktop connections, this was the first
    twisted-pair specification introduced in 1990. Hubs and switches are used to interconnect
    network segments, unlike the coax cable connections, which could be connected
    directly using BNC connectors. Two pairs of twisted wires are used, one for receiving
    and one for sending over a distance of approximately 100 meters.


    # 100BASE Types


    The 100BASE family of media types has a maximum capacity of 100Mbps and uses baseband
    signaling. The properties of each are as follows:


    +   100BASE-TX—Twisted-pair cabling using two pairs of wires. It enables the use
    of both STP and UTP but can be implemented only on CAT-5 cabling. The maximum
    distance is approximately 100 meters.


    +   100BASE-T4—Twisted-pair cabling using four pairs of wires. Although CAT-5
    cabling is normally used, it enables the use of both CAT-3 and CAT-4 UTP cabling:
    one pair for receiving, one pair for sending, and two bidirectional pairs. The
    maximum distance is approximately 100 meters.


    +   100BASE-FX—Fiber-optic cabling consisting of two multimode fibers. The optional
    full-duplex mode enables a maximum distance of 2000 meters for a network segment.
    Fiber is inherently more secure because the signal cannot be tapped easily; it
    is also nonconductive, making it immune to hazards such as lightning.


    # 1000BASE Types


    The 1000BASE family of media types has a maximum capacity of 1000Mbps and uses
    baseband signaling. The properties of each is described in the following:'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# Chapter 1


    +   > 1000BASE-T—IEEE Standard 802.3ab, a subset of the 802.3 Ethernet standard,
    was introduced in 1999. This standard is Gigabit Ethernet over four pairs of UTP
    CAT-5 cabling. Sun''s implementation of 1000BASE-T supports distances up to 100
    meters.


    +   > 1000BASE-X—IEEE Standard 802.3z, a subset of the 802.3 Ethernet standard,
    was standardized in 1998. This standard provides Gigabit Ethernet over single-
    and multimode fiber-optic cable, as well as one using copper wire. This standard
    refers to three implementation types—namely 1000BASE-SX, 1000BASE-LX and 1000BASE-CX,
    which are described next.


    +   > 1000BASE-SX—This uses short wavelength lasers to send data on fiber-optic
    cable. Sun''s implementation of this standard supports distances of 300 meters
    (using MMF 62.5-micron fiber) and 550 meters (using MMF 50-micron fiber).


    +   > 1000BASE-LX—This uses long wavelength lasers to send data on fiber-optic
    cable. Sun''s implementation of this standard supports distances of 550 meters
    (using MMF 62.5- and 50-micron fiber) and 3,000 meters (using SMF 9-micron fiber).


    +   > 1000BASE-CX—This uses copper cables to connect short distances up to 25
    meters. It is primarily used in computer rooms, specifically within wiring cabinets
    to connect networking equipment in close proximity.


    # Network Access Methods


    This section describes the two most commonly used network access methods: collision
    detection (CSMA/CD) and token ring. Also mentioned here is a middle-ground method
    called token bus.


    # CSMA/CD


    Carrier sense multiple access with collision detection is the most commonly used
    method in ethernet networks and is described in the IEEE 802.3 Ethernet standard.
    Since ethernet relies on broadcasts, any of the hosts connected to the network
    can transmit at any time, but the CSMA part listens to the network to see whether
    anyone else is transmitting. If the network is empty, the host starts sending
    its data; if it''s busy, it waits for a random time before trying again. Having
    started sending, the CD part of the protocol detects whether any other host starting.
    If it detects activity, a collision'
  merge: -1
  pgno: 47
- img_proc: true
  md: 'is said to have occurred and both hosts stop sending, wait a random time, and
    then try again. The random time is based on time slots, which are usually set
    to 512-bit times, which is 51.2 microseconds (the time it would take to send 512
    bits). The number of time slots increases exponentially if further collisions
    occur, thereby reducing the chances of another collision. If a host fails to send
    a data packet 10 times, the number of time slots to wait is fixed at 1,023. If
    it fails 16 times, it gives up and reports a failure. The algorithm used to determine
    how long a host waits before trying to retransmit is called binary exponential
    backoff.


    CSMA/CD-based networks perform very well on lightly loaded networks, but they
    suffer higher collision rates when the network is heavily loaded. This leads to
    more retransmissions of data and, hence, worse performance.


    # Token-Ring


    The token-ring access method, described in the IEEE 802.5 standard, is used mainly
    in IBM environments in which a token travels around the network in a predetermined
    order. If a host has data to send, it inserts its data onto the network when it
    has the token. Token-ring networks perform very well when the network is heavily
    used because there are no collisions and only one host sends data at a time. The
    disadvantage of using token-ring networks is that performance is not very good
    when the network is lightly loaded because each host has to wait for the token
    to reach it.


    # Token Bus


    The token bus access method, described in the IEEE 802.4 standard, uses a bus
    topology, but also implements a token passing system that is similar to the token-ring
    access method. One main difference, however, is that because a broadcast medium
    is used, all packets are received by all hosts. The token bus method also supports
    four classes of priority, enabling a host to send its highest-priority data first.
    As with token-ring networks, each host can send only a finite amount of data before
    relinquishing the token to the next host.


    # Ethernet


    Ethernet was originally implemented by Xerox in the early 1970s. Because it was
    successful, DEC, Intel, and Xerox collectively defined a standard for 10Mb ethernet
    in 1978. This formed the basis for the IEEE 802.3 definition,'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'which was specified in 1985. The following are three major elements of an ethernet
    network:


    +   * Packets—Also called frames, these are the units of data that are sent across
    the network.


    +   * Hardware—The cables, connectors, and computer circuitry that actually transfers
    the data between hosts on an ethernet network.


    +   * CSMA/CD—The network access method that controls the flow of frames across
    the network.


    The two types of ethernet in use today are the original DEC, Intel, and Xerox
    standard (also called DIX, named after the initial letters from each company and
    known as Ethernet II) and the IEEE 802.3 ethernet. Some differences exist between
    the two, primarily in the composition of the frames, which are discussed in the
    next section.


    # Ethernet Frames


    An ethernet frame is the basic unit of data transfer in ethernet networks. It
    contains a destination address, the sender (or *source*) address, other control
    information, and the actual data itself.


    # Ethernet Addresses


    Hardware vendors providing network components use assigned starting ranges and
    globally unique MAC or hardware addresses (discussed below) to guarantee a component
    can be individually addressed, both within the local machine and on the network.


    The ethernet address is a 48-bit address typically displayed in hexadecimal as
    12 numbers in groups of two octets separated by colons. An example of an ethernet
    address is `00:00:20:23:41:53`. Here, you can see that the third octet is 20 because
    it contains 8 bits of the address. Ethernet addresses are assigned in two portions,
    each consisting of 24 bits, or three octets. The first three octets are the company
    identifier (CID), which is assigned and administered by the IEEE, and the second
    is a unique vendor-supplied identifier (VID). Sun Microsystems uses the CID `00:01:20`
    for most of its systems, the exceptions being `00:0b:be` and `00:03:ba` for SunBlade
    systems. A non-Sun example is 3Com, which uses `00:10:4b` as its CID. Figure 1.7
    summarizes how an ethernet address is assigned.'
  merge: -1
  pgno: 49
- img_proc: true
  md: '# Local Area Networks


    Sun 08:00:20:b3:41:53


    ![](img/b8864f367e279929da7f8395589b04dd_50_0.png)


    3COM 00:10:4b:e4:da:3c


    Figure 1.7 Components of an ethernet address.


    Two forms of addressing can be used with the IEEE ethernet specification. The
    default is host-based addressing, in which the ethernet address is obtained from
    the hardware itself, and the other option is port-based addressing, in which a
    locally assigned ethernet address is specified instead of the hardware address.
    This latter method is described later in this chapter, in the section "Assigning
    a Port-Based Ethernet Address."


    > On the exam, you could be asked to identify the CID or VID of an ethernet address
    and how many bits make up each portion. Make sure you are familiar with these
    values.


    ![](img/b8864f367e279929da7f8395589b04dd_50_1.png)


    Ethernet uses three types of addresses:


    +   Unicast—A system sends a message to another single system, using the unique
    ethernet address to identify the recipient.


    +   Multicast—A system sends a message to a subset of systems on the network.
    When using a multicast address, the first three octets identify whether the address
    is a multicast address and the last three octets identify the actual multicast
    group.


    +   Broadcast—A system sends a message to all systems on the network. A reserved
    ethernet address of ff:ff:ff:ff:ff:ff is used as the broadcast address in which
    all 48 bits are set to 1.


    # Ethernet Frame Composition


    An Ethernet II frame comprises a number of fields containing the necessary information
    to transmit and receive data. Figure 1.8 shows a graphical representation of an
    Ethernet II frame.'
  merge: -1
  pgno: 50
- img_proc: true
  md: '# Chapter 1


    | 8 bytes | 6 bytes | 6 bytes | 2 bytes | 46-1500 bytes | 4 bytes |

    | Preamble | Dest Address | Source Address | Type | Data | FCS/CRC |


    **Figure 1.8** The fields of an Ethernet II frame.


    Each of the fields comprising an Ethernet II frame is described here:


    +   * **Preamble**—This field consists of 8 bytes, the first 7 bytes of which
    contain a long sequence of alternating 1 and 0 bits. It is used for synchronization
    and tells the destination host that a frame is starting. The final byte of the
    preamble is called the *start frame delimiter* and signifies the actual start
    of the ethernet frame. This bit sequence is `1010011`. Together, these two items
    make up the preamble of any ethernet frame.


    +   * **Destination address**—The ethernet address of the host being sent the
    message. This would normally be a host''s ethernet address, but it could also
    be a broadcast address intended for every host on the network, or a multicast
    address intended for a specific group of hosts. The ethernet address is 48 bits
    long (6 bytes).


    +   * **Source address**—The ethernet address of the sending host. This ethernet
    address is also 48 bits long (6 bytes).


    +   * **Type**—This field describes the kind of data contained within the data
    field. Examples are IP, ARP, RARP, and IPv6.


    +   * **Data**—The actual data being transmitted.


    +   * **FCS/CRC**—This is the checksum that is used to ensure the message arrived
    without corruption. The frame check sequence (FCS) or cyclic redundancy check
    (CRC) value is calculated before the message is transmitted. The receiving host
    recalculates the value, and if they match, the transmission has been successful.
    If they don''t, the frame is in error and discarded.


    Ethernet II frames differ from IEEE 802.3 frames primarily in the fourth field.
    In Ethernet II, this field is a type field, identifying the type of data being
    carried in the data field. In IEEE 802.3 frames, however, this field is a length
    field, specifying the length in bytes of the data field. Because networks might
    be carrying Ethernet II and IEEE 802.3 frames, the format can be easily identified
    by the value of this fourth field. In Ethernet II'
  merge: -1
  pgno: 51
- img_proc: true
  md: 'frames, the value of this field is greater than 1536, whereas in IEEE 802.3
    frames, the length must be less than 1500. The Ethernet II frame format is typically
    used in a TCP/IP environment.


    # Maximum Transfer Units


    An Ethernet II frame can be a maximum of 1518 bytes long, but the maximum transfer
    unit (MTU) is 1500 bytes because the MTU refers to the maximum size of the data
    field that can be transmitted in a single ethernet frame. An ethernet frame that
    is fully populated is broken down as follows:


    +   - 6 bytes for the destination address

    - 6 bytes for the source address

    - 2 bytes for the type of frame

    - 1500 bytes for the data itself

    - 4 bytes for the error checking CRC


    Conversely, an Ethernet II frame has a minimum size of 64 bytes. This is broken
    down as follows:


    +   - 6 bytes for the destination address

    - 6 bytes for the source address

    - 2 bytes for the type of frame

    - 46 bytes for the data itself

    - 4 bytes for the error checking CRC


    If an ethernet frame contains a data field with less than 46 bytes of data, padding
    is added until it is equal to the specified minimum.


    > NOTE The minimum and maximum sizes do not include the preamble field. This field
    is used only for synchronization and does not form part of the actual frame.


    As you have just seen, the maximum size of an ethernet frame is 1518 bytes, of
    which 1500 bytes can be data. If the data to be transmitted exceeds the MTU, it
    is automatically fragmented, meaning it is split up into 1500-byte pieces to fit
    into an ethernet frame. For example, 3050 bytes of data would be split into three
    separate ethernet frames for physical transmission across the network. The first
    two frames would each contain 1500 bytes of data, and'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# Chapter 1


    the last one would contain the remaining 50 bytes of data. Each fragment contains
    all the headers that would be expected in an ethernet frame and is a self-contained
    unit.


    The MTU for a physical ethernet interface is 1500 bytes. A loopback device is
    a pseudo-device that allows a host to send frames to itself and is identified
    by the interface name lo0. The MTU for loopback devices is 8232 bytes.


    ![](img/b8864f367e279929da7f8395589b04dd_53_0.png)


    # Frame Errors


    When sending ethernet frames across a network, errors can occur due to various
    causes, ranging from faulty network cards to electrical interference on the network
    itself. Table 1.1 lists some of the more common error conditions encountered on
    ethernet networks and offers a description of possible causes.


    | Error | Description/Cause |

    | --- | --- |

    | Bad CRC | Each ethernet frame contains a CRC—a checksum that can be calculated
    to ensure the frame has been received correctly. If the CRC value calculated by
    the receiving host does not match the value in the FCS/CRC field of the ethernet
    frame, the frame has been corrupted in some way during transmission and is discarded
    by the receiving host. The cause of this could be electrical interference on the
    network or a faulty network device. |

    | Jabber | An ethernet frame is received that is longer than the MTU. It is normally
    due to a faulty network card, where the card is continually detecting a collision
    on the network and sending a jamming signal. This kind of error can bring a network
    to a virtual standstill, so the offending card should be removed from the network
    at the earliest opportunity. |

    | Runt | An ethernet frame is received that is less than the required minimum
    of 64 bytes. These are often caused by collisions on the network or bad wiring.
    |

    | Long frame | An ethernet frame is received that is greater than the MTU of 1518
    bytes and less than 6000 bytes. This error is usually caused by faulty hardware
    on the system that sent the frame. |

    | Giant frame | An ethernet frame is received that is greater than 6000 bytes
    long. This error is normally caused by faulty hardware on the system that sent
    the frame. |'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# Assigning a Port-Based Ethernet Address


    Earlier in this chapter, I mentioned that host-based addressing is the default
    method used for obtaining the ethernet address. This is where the address is obtained
    from the hardware itself. In cases in which obtaining the address from the hardware
    is impossible or you are creating a multihomed host containing several physical
    interfaces (using a Quad Fast ethernet card, for example), port-based addressing
    is necessary. Therefore, a locally assigned, unique ethernet address has to be
    provided for the device so it can participate in network communication.


    To assign the ethernet address locally, you need to inspect, and modify if necessary,
    the EEPROM values, namely local-mac-address.


    The default value of this variable is false, meaning that port-based addressing
    is disabled. Verify this by logging in as root and using the eeprom or prtconf
    command as follows:


    ```

    # eeprom local-mac-address?

    local-mac-address?=false

    ```


    or


    ```

    # prtconf -pv | grep local-mac-address?

    Local-mac-address? ''false''

    ```


    The value of this variable needs to be modified to true. Do this as follows:


    ```

    # eeprom local-mac-address?=true

    ```


    > You can also use the Openboot PROM commands to view and set the same variable.
    With the system at the ok prompt, enter the printenv command to see all variables.
    The value can also be changed if you use the set command.


    You can assign a locally defined ethernet address to an interface using the ifconfig
    command with the ether switch. The seventh bit of the ethernet address denotes
    whether the address is globally or locally assigned. If the bit is not set (0),
    the address is global; if it is set (1), the address is local. This changes the
    CID of the Sun ethernet address from 08:00:20 to 0a:00:20. The VID of the part
    address should be locally assigned, ensuring that it is unique on the local network.
    Some use the VID, a sequence of their own, such as 00:00:01 and so on. The following
    example shows the commands to set (and verify) the hme0 interface to a locally
    assigned ethernet address.'
