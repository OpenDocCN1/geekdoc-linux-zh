    Notice that the dhtadm -P command results in the same output as the cat command,
    for example, to view the file sunfiles_dhcpab. The dhcpab table is readable only
    because an ASCII file based datastore type is being used.


    > Any changes that are made to the dhcpab table need to be read by the DHCP server.
    Remember that a SIGHUP (-HUP) needs to be sent to the in.dhcpd process that it
    rereads the dhcpab table and implements any changes that have been made.


    The most common dhtadm options are


    +   - -A—Use this option to add and define a symbol or macro to the table.

    - -M—Use this option to modify an existing symbol or macro in the table.

    - -D—Use this option to delete an existing symbol or macro from the table.

    - -P—Use this option to print (view) the contents of the dhcpab table.


    # Starting and Stopping the DHCP Server


    The DHCP server is started at boot time by the startup script /etc/rc.3/S34dhcpd.
    The in.dhcpd process starts only if the configuration file /etc/inet/dhcppsv.conf
    exists and if the DAEMON_ENABLED variable in the configuration file is set to
    TRUE.


    To stop a running DHCP server, enter the following command:


    ```

    ultra10# /etc/rc.3/S34dhcpd stop

    ```


    This cleanly shuts down the DHCP server manually.


    To start the DHCP server manually, enter the following command:


    ```

    ultra10# /etc/rc.3/S34dhcp start

    ```'
