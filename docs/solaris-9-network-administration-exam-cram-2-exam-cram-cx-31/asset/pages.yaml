  md: '# Exam Prep Questions


    # Question 1


    | Which command displays the status of IPv6 interfaces only |

    | A. ifconfig -a

    | B. ifconfig -a IPv6

    | C. ifconfig -a inet6

    | D. ifconfig -a ip6 |


    Answer C is correct because the command ifconfig -a inet6 displays the status
    of IPv6 interfaces, ignoring IPv4 interfaces. Answer A is incorrect because ifconfig
    -a displays the status of all interfaces, both IPv4 and IPv6. Answer B and D are
    incorrect because the arguments IPv6 and ip6 are invalid and not part of the syntax.


    # Question 2


    +   - A. Longer header formats provide a greater amount of information contained
    within the header.

    - B. IPv6 provides expanded addressing, increasing the address size from 32-bit
    addresses to 128-bit addresses.

    - C. Quality of service allows a sequence of packets to be labeled for priority
    handling.

    - D. Extension headers have been removed to allow the primary header to be processed
    more efficiently.

    - E. IPv6 addresses can be automatically assigned with the new autoconfiguration
    feature.


    Answer B, C, and E are correct because IPv6 addresses have expanded from 32 bits
    in IPv4 to 128 bits in IPv6. Also, IPv6 provides a quality of service feature
    that allows a sequence of datagrams that require priority handling to be identified.
    The addition of autoconfiguration enables IPv6 addresses to be assigned automatically.
    Answer A is incorrect because the IPv6 header has been simplified; the number
    of fields has been reduced. Answer D is incorrect because extension headers have
    been added to IPv6 to improve routing performance. Additional information can
    be contained within the datagram that is intended for the recipient, so each router
    the datagram passes through'
