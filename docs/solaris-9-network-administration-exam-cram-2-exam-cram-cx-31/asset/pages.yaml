    Answer A is correct because the command ifconfig -a inet6 verifies the sta- tus
    of IPv6 network interfaces. It does not show the status of any IPv4 inter- faces.
    Answer B is incorrect because the syntax of the ifconfig command is wrong. The
    first argument must be a valid command option, such as -a, or a network interface,
    such as hme0. Answer C is incorrect because the syntax is wrong. Answer D is incorrect
    because there is no such network family as ip6.'
