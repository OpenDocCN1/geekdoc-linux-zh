  md: '# ARP and RARP


    The in.arpd daemon is started by the /etc/rc3.d/S16boot script. Prior to Solaris
    9, in.arpd was started by a default script, namely, /etc/rc3.d/S15ifs. Make sure
    you are not tricked by this if it appears in a question on the exam.


    When an incoming RARP request is received from the client, the server process
    refers to two files to satisfy the request. The first is /etc/ethers, which contains
    the ethernet address and the corresponding hostname. The second file is /etc/inet/hosts,
    which contains the hostname and the corresponding IP address. Because it references
    both of these files, in.arpd is capable of resolving the IP address from the ethernet
    address provided by the client. It is the IP address that is returned to the client.


    The file /etc/hosts is a symbolic link to /etc/inet/hosts. The link has been retained
    for compatibility with Berkeley Software Distribution (BSD) versions of Unix.
    You should be aware that this link exists.


    If you encounter problems with a client that is failing to locate its IP address,
    you can use the snoop command to monitor RARP packets and you can also run in.arpd
    with the -d option to obtain additional debug messages. The following from running
    in.arpd -d, shows the messages that are displayed when the server does not know
    the ethernet address:


    ```

    /usr/bin/in.arpd:[1] device hme0 ethernetaddress 8:0:20:b3:41:53

    in.arpd:[1] device hme0 subnet mask 192.168.0.28

    in.arpd:[1] device hme0 subnet mask 255.255.255.0

    in.arpd:[3] starting rarp service on device hee0 address 8:0:20:b3:41:1b

    in.arpd:[3] RARP_REQUEST for 8:0:20:88:48:de

    in.arpd:[3] could not map hardware address to IP address

    in.arpd:[3] RARP_REQUEST for 8:0:20:88:48:de

    in.arpd:[3] could not map hardware address to IP address

    in.arpd:[3] could not map hardware address to IP address

    ```


    This code shows what happens on the server. The client, however, receives a different
    message—the following is displayed repeatedly because it is not receiving a response
    from the server:


    Timeout waiting for ARP/RARP packet


    The error is normally due to one for the client has entered incorrectly


    +   * The ethernet address for the client has entered incorrectly

    /etc/ethers.'
