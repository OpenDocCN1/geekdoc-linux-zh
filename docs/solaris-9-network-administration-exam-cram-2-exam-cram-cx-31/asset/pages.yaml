    # Standard PrepLogic Practice Exams, Preview Edition, Options


    The following list describes the function of each of the buttons you see across
    the bottom of the screen:


    > NOTE Status Depending on the options, some of the buttons will be grayed out
    and inaccessible—or they might be missing completely. Buttons that are appropriate
    are active.


    +   - Exhibit—This button is visible if an exhibit is provided to support the
    question. An exhibit is an image that provides supplemental information necessary
    to answer a question.

    - Item Review—This button leaves the question window and opens the Item Review
    screen, from which you can see all questions, your answers, and your marked items.
    You can also see correct answers listed here, when appropriate.

    - Show Answer—This option displays the correct answer, with an explanation why
    it is correct. If you select this option, the current question is not scored.

    - Mark Item—You can check this box to flag a question that you need to review.
    You can view and navigate marked items by clicking the Item Review button (if
    it is enabled). When your exam is being graded, you are notified if you have any
    marked items remaining.'
