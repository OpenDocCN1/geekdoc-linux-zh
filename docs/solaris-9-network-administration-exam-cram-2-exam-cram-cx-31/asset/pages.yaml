  md: "# Chapter 1\n\nSun Microsystems does not generally advise customers to set\
    \ these parameters manually because Solaris 9 is already optimized for most situations.\
    \ Using ndd on the command line is useful for testing problem resolution and should\
    \ be made only when it has been verified that a change has been successful. Make\
    \ sure you always have a backup of any system script that you created.\n\nAnother\
    \ useful example is the system script /etc/rc2.d/s69inet (which is a hard link\
    \ to /etc/init.d/inetint), in which the ndd command is used to either enable or\
    \ disable the forwarding of IP requests, depending on whether the host is a router.\
    \ The relevant fragment of this script is shown here to demonstrate the use of\
    \ ndd in a script (setting the parameter to i enables forwarding, whereas ii disables).\
    \ I have highlighted, in bold, the two lines that set the following parameter:\n\
    \n```\nif [ ! -f /etc/notrouter -a $numdhcp -eq 0 -a \\\n  (( $numptifs -gt 2\
    \ -o -f /etc/gateways \\)) ]; then\n  fi\n\n# Machine is an IPv4 router: turn\
    \ on ip_forwarding, run\n# in.routed, and advertise ourselves as a router using\
    \ router routing\n# discovery.\necho 'Machine is an IPv4 router.'\n/usr/sbin/ndd\
    \ -set /dev/ip ip_forwarding 1\n  -f /usr/sbin/bin.in.routed ] && /usr/sbin/in.rdisc\
    \ -s\n  -f /usr/sbin/bin.in.rdisc && /usr/sbin/in.rdisc -r\n```\n\n```\nelse\n\
    \  # Machine is an IPv4 host: if router discovery finds a router\n# then we rely\
    \ on router discovery. If there are no routers\n# advertising themselves through\
    \ router discovery\n# run in.routed in quiet mode. In both cases, turn off\n#\
    \ ip_forwarding.\n/usr/sbin/ndd -set /dev/ip ip_forwarding 0\nif [ -f /usr/sbin/bin.in.rdisc\
    \ && /usr/sbin/in.rdisc -s ]; then\n  echo 'Starting IPv4 router discovery.'\n\
    elif [ -f /usr/sbin/bin.in.routed ]; then\n  /usr/sbin/in.routed -q\n  echo 'Starting\
    \ IPv4 router daemon.'\n  fi\n```"
