  md: '# Chapter 9


    TCP and UDP are the two main protocols that operate at the Transport layer of
    the TCP/IP model. The Transport layer provides an end-to-end service for application
    data—that is, from the source to the destination.TCP and UDP are both delivered
    as part of the Solaris operating system kernel.


    ![](img/b8864f367e279929da7f8395589b04dd_199_0.png)


    # TCP


    The Transmission Control Protocol (TCP) is a connection-oriented, state, and reliable
    protocol that handles the delivery of data packets across a network. Packets can
    be routed via different destinations, and TCP also handles the reassembly of packets
    at the destination end. It is typically used for larger volumes of data that need
    to be exchanged between hosts. TCP has the following features:


    +   * Virtual circuit—Both the sending and receiving host must establish a connection
    before data transmission can commence. This connection is called a virtual circuit
    because it is a logical connection, not a physical one.


    +   * Full-duplex—TCP connections allow data to be transferred in both directions
    at the same time, increasing the amount of data that can be carried on the network
    at a given time. The application views a TCP connection as two paths moving in
    opposite directions. Full-duplex also makes use of piggybacking, where control
    information, such as acknowledgments, are sent inside data segments traveling
    in the opposite direction. This reduces the amount of traffic on the network.


    +   * Streams—An application passes data to TCP for transmission as a stream of
    bytes. TCP divides the stream into segments, which comprise a header, containing
    control information (discussed in the next section) and data.


    +   * Buffers—TCP uses both input and output buffers to regulate the flow of traffic
    between the sending and receiving hosts. The default value for the maximum size
    of the buffers is 1MB (1048576 bytes). This parameter can be viewed, or tuned,
    by using the ndd command as shown here:


    ```

    # ndd /dev/tcp tcp_max_buf

    1048576

    ```


    *'
  merge: -1
