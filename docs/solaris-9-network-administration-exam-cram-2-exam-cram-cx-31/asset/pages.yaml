  md: '# 116 Chapter 6


    Static routes created with the route command at the command line are permanent
    entries, but do not exist across reboots of the system. If static routes are required
    to persist across reboots, then use the configuration files /etc/defaultroute
    (for a default static route) or /etc/gateways (for other static routes). Alternatively,
    create a startup script containing the route commands, which will be executed
    each time the system reboots.


    The route monitor command can be used to see any changes that are made to the
    routing table. When you run this command, it informs you straight away of the
    changes. The following example code shows the addition and subsequent deletion
    of a route.


    ```

    ultra10# route monitor

    got message of size 124

    RTM_ADD: Add Route: len 124, pid: 368, seq 0, errno 0, flags:<UP,GATEWAY, \\DONE,STATIC

    locks: inits:

    sockaddrs:<DST,GATEWAY,NETMASK>

    192.168.28.0 192.168.29.1 255.255.255.0

    got message of size 124

    RTM_DELETE: Delete Route: len 124, pid: 369, seq 1, errno 0, flags:<UP, \\GATEWAY,

    DONE,STATIC

    locks: inits:

    sockaddrs:<DST,GATEWAY,NETMASK>

    192.168.28.0 192.168.29.1 255.255.255.0

    ```


    The manipulation of routing table entries can become quite complex when you have
    to deal with numerous IP addresses. A simpler way of doing this is to use the
    /etc/inet/networks file to assign names to the networks and the /etc/inet/hosts
    file to assign names to the router interfaces.


    In the previous examples, you could add the following entries to

    /etc/inet/networks:


    ```

    networkA   192.168.28.0

    networkB   192.168.29.0

    networkC   192.168.30.0

    ```


    and add the following entries to /etc/inet/hosts:


    ```

    192.168.28.1   routerA

    192.168.29.1   routerBtoA

    192.168.29.2   routerBtoC

    192.168.30.1   routerC

    ```


    Now, to add the route from network B to any host on network A,

    using the following route command:


    ```

    ultra10# route add networkA routerBtoA

    add net networkA: gateway routerBtoA

    ```'
