- img_proc: true
  md: '# Configuration Files


    Two configuration files can be used to assign static routes: /etc/defaultrouter
    and /etc/gateways. Both of these files are described in this section:


    +   * /etc/defaultrouter—This file normally contains a single IP address or hostname
    that identifies the default path that data should take when transmitted across
    the network. The default route is used when no other specific route is identified
    for the destination. Hostnames are used only if the relevant entry exists in the
    /etc/inet/hosts file. Although this file usually contains only one entry, multiple
    entries are permitted, one per line.


    The use of default routes has some distinct advantages. These are


    +   * The existence of the /etc/defaultrouter stops the routing daemon (in.routed)
    and the dynamic router discovery daemon (in.rdisc) from starting when the system
    is booting. The startup script /etc/rc2.d/S69inet contains the check for the existence
    of /etc/defaultrouter.


    +   * Using a single default route entry reduces the processing overhead because
    the routing table is smaller.


    +   * Using multiple default route entries adds some resilience so that a potential
    single point of failure is avoided.


    The use of default routes, however, has a few disadvantages, too:


    +   * When using a single default route entry, a single point of failure is created,
    impacting the network connectivity if the default router becomes unavailable.


    +   * The /etc/defaultrouter file must be present on every system. You can''t
    use a naming service to manage this file centrally because it is read during the
    system startup process, before any naming service processes are running. On larger
    networks that change frequently, management of /etc/defaultrouter can incur a
    significant administrative overhead.


    +   * /etc/gateways—This file is an optional file that is read at system startup
    when the routing daemon (in.routed) starts up. It provides an alternative way
    of adding static routes. Each entry in the /etc/gateways file has the following
    format:


    ```

    net host <destination> gateway <gateway> metric <hopcount>

    passive | active

    ```'
  merge: -1
  pgno: 152
- img_proc: true
  md: 'The fields are described here:


    +   - net host—Using either net or host will identify whether the route is to
    a specific host or to a network. This precedes the address or name of the destination
    host or network.


    +   - <destination>—The IP address, (or hostname or network name) of the destination,
    either a host or a network.


    +   - gateway—This precedes the address, or name, of the gateway to be used.


    +   - <gateway>—The IP address or hostname or the router to be used as the gateway.


    +   - metric—This precedes the <hopcount> value.


    +   - <hopcount>—The number of hops taken to reach the destination.


    +   - passive | active—Use either passive for a static route or active for a dynamic
    route.


    A typical entry for the /etc/gateways file that adds a static route to the networkA
    via the router routerA, which takes two hops, is shown here:


    ```

    net networkA gateway routerA metric 2 passive

    ```


    # Dynamic Route Configuration


    Dynamic routing, in contrast to static routing, where routing information is exchanged
    with other routers on the network. Entries in the routing table can change dynamically
    depending on the current status of the network. The protocols that are bundled
    with the Solaris 9 operating environment are Routing Information Protocol (RIP)
    versions 1 and 2 as well as the Router Discovery Protocol (RDISC).


    # Routing Information Protocol Version 1 (RIPv1)


    RIP is a distance vector protocol, where the best route to use is calculated by
    the fewest hops taken to reach the destination. Each hop denotes a point where
    another router is used to forward a packet. The hopcount refers to the total number
    of hops taken to reach the final destination.'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# IPv4 Routing 119


    The number of hops required to reach a destination does not reflect the physical
    distance between two systems or networks; it merely reflects the number of routers
    that need to be used to deliver the data—the fewer hops required, the less a cost.


    A number of routes might be available to use between two hosts, but RIP will keep
    a record of only the one that takes the fewest hops to reach. The dynamic nature
    of this protocol means that if an intermediate router becomes unavailable, then
    the best route can be modified to use the next best route.


    RIP employs a number of features that help it cope with quickly changing networks:


    +   - Maximum hopcount—RIP has a limit of 15 hops to prevent data traveling around
    the network endlessly. the hopcount is incremented each time it passes through
    a router. If this value reaches 16 or more, the host is deemed unreachable.


    +   - Hold down timers—When a router receives information about a failed router,
    a hold down timer starts. This prevents the receipt of further updates, which
    could result in an inconsistent network state. The time delay allows the network
    to stabilize with the new information before it calculates a new best route. If
    a router has not yet received the failed router update, it continues to advertise
    the route as operational; the hold down timer prevents these invalid updates from
    being acted upon.


    +   - Split horizons—This feature prevents a router from sending an update back
    to the same place it came from. For example, if Router A sends an update to router
    B, Router B is prevented from advertising the information back to router A. Without
    this feature, two routers could become involved in an endless loop of information
    exchange.


    +   - Update triggers—When a change to the network occurs, either because a new
    route has been found or an existing route has become unavailable, a router advertises
    this information immediately instead of waiting for the next scheduled advertisement—by
    default every 30 seconds.


    +   - Route poisoning—When a route becomes unavailable, an update is triggered
    by the router to advertise the route with a hopcount of 16. This advertises the
    route as unreachable, making the other routers remove the route entry from the
    route table. In this way the failed route will not be used.'
  merge: -1
  pgno: 154
- img_proc: true
  md: '# The Routing Daemon


    The daemon process that manages routing script /sbin for Solaris 9 is called in.routed.
    It is started at boot time by the startup script /etc/rc2.d/S6inet (which is a
    hard link to /etc/init.d/inetinit). Both routers and non-routers can run the in.routed
    process: Routers advertise their routing table entries to other hosts every 30
    seconds, whereas non-routers learn the available routes by accessing the advertisements
    provided by other routers on the network.


    The time interval of 30 seconds between router advertisements is fixed and cannot
    be configured by the administrator.


    The following are the most popular options for running this daemon:


    +   -q-Runs the daemon in “quiet” mode. Non-routers use this option to prevent
    the routing table from being advertised.


    +   -s-Runs the daemon in “speaking” mode, so that the routing table is broadcast
    (advertised) to other hosts every 30 seconds. This is the option for router users.


    +   -t-Used in conjunction with the -q or -s options, this option causes all actions
    to be logged to the standard output. The following command starts the daemon process
    on a router and logs all activity to standard output.


    +   -v <logfile>-Used to log (with a timestamp) changes made to the routing table.
    The <logfile> location must also be entered. The following command starts the
    daemon process on a router and logs all changes to the file /var/log/route.log.


    ```

    ultra10# /usr/sbin/in.routed -v /var/log/route.log

    ```


    When running the daemon, in.routed the logfile that is specified must be created.
    The process does not automatically create it.


    The in.routed process is started at boot time if the files /etc/defaultrouter
    and /etc/notrouter are not present. The /etc/notrouter file is used to prevent
    a system with more than one network interface card from being treated as a router
    automatically.'
  merge: -1
  pgno: 155
