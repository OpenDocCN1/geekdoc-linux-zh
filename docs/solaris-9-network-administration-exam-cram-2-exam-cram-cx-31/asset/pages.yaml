    # Question 6


    +   Which of the following are advantages of using logical interfaces? Choose
    2.

    - A. They are cheaper because there is no need to purchase additional network
    cards.

    - B. Administration is easier because everything is done on a single system, rather
    than on multiple systems.

    - C. They provide hardware resilience in case the physical interface fails.

    - D. They enhance network performance by reducing network traffic.


    Answers A and B are correct because the logical interfaces are cheaper. There
    is no need to purchase additional network cards, and the administration overhead
    is reduced because everything can be done on a single system, rather than on multiple
    systems. Answers C and D are incorrect because they are false; logical interfaces
    do not provide any hardware resilience because they are tied to the physical interface,
    and they can also increase the amount of network traffic because logical interfaces
    use the same physical interface.


    # Question 7


    +   Which of the following are reserved private network ranges of IP addresses
