    # Variable Length Subnet Mask (VLSM)


    The previous section showed how a network can be divided into a number of smaller
    networks, but they were all the same size. Now you''ll see how to divide a network
    into a number of smaller networks, but each will be a different size and, consequently,
    have a different network mask. You can divide a single network, have this way
    by using a number of network masks, known as variable length subnet masks (VLSM).


    Although you might wonder why anyone would want to do this, it could much better
    use of the available IPv4 addresses.


    As an example, imagine a company with a large accounting department (for example,
    125 people), the medium-sized HR department, and a medium-sized administration
    marketing department (for example, 60 in each). With your class C network (192.168.28.0),
    you can divide this network into three smallnetworks, one with 126 addressable
    hosts and two further with 62 addressable hosts in each. Table 4.2 shows how this
    network address would break down into the three separate subnetworks, as well
    as the usable host addresses each subnet creates.'
