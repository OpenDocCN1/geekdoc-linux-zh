- img_proc: true
  md: '# Question 5


    | Which type of unicast address would you use if the address needs to be routed
    through the Internet? |

    | A. Aggregatable global address |

    | B. Link-local address |

    | C. Loopback address |

    | D. Site-local address |


    Answer A is correct because an aggregatable global unicast address is the type
    that can be routed through the Internet. Answer B is incorrect because a link-local
    address is used to provide communication between single hosts on a local link
    and cannot be routed. Answer C is incorrect because a loopback address is used
    by an IPv6 system to send datagrams to itself. Answer D is incorrect because a
    site-local address can be routed only through an intranet and is limited to the
    same site. It cannot be routed externally through the Internet.


    # Question 6


    | In an IPv6 datagram header, what does the Payload length field describe? |

    | A. The length of the data portion of the datagram |

    | B. The length of the data and IPv6 header |

    | C. The length of the data, IPv6 header, and extension headers, if present |

    | D. The length of the data and any extension headers, but not the IPv6 header
    itself |


    Answer D is correct because the Payload length field of an IPv6 header identifies
    the length of the data and any extension headers that follow the IPv6 datagram
    header, but not the IPv6 header itself. Answers A, B, and C are incorrect because
    the Payload length field contains the length of the data and extension headers
    only, not the IPv6 header.'
  merge: -1
