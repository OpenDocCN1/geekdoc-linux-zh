    \ {\n  directory \"/var/named\";\n}\n\nzone \".\" in {\n  type hint;\n  file \"\
    named.ca\";\n}\n\nzone \"xyz.com\" in {\n  type slave;\n  file \"db.xyz\";\n \
    \ masters { 192.168.28.28 };\n}\n\nzone \"28.168.192.in-addr.arpa\" in {\n  type\
    \ slave;\n  file \"xyz.rev\";\n  masters { 192.168.28.28 };\n}\n\nzone \"0.0.127.in-addr.arpa\"\
    \ in {\n  type master;\n  file \"named.local\";\n}\n```\n\n> Each DNS server is\
    \ always the master for the loopback reverse resolution zone (0.0.127.in-addr.arpa)\
    \ because it refers to the local loopback address. This would not be copied from\
    \ a primary DNS server. You should be aware of this case you you have to analyze\
    \ a /etc/named.conf file in the exam.\n\nNote that the root domain file, named.ca,\
    \ is not automatically copied from the primary DNS server; it should be manually\
    \ copied once during the configuration."
