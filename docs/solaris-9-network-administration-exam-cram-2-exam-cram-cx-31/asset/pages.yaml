  md: '# The /etc/inet/netmasks File


    For any given IPv4 address, or range of addresses, it is necessary to able to
    calculate the network portion of the address. The file /etc/inet/netmasks exists
    for this purpose, to associate IPv4 address masks with IPv4 network numbers. The
    entries in this file are permanent and persist across system reboots.


    > Entries in /etc/inet/netmasks are normally in decimal notation. Even though
    you can specify the network mask in hexadecimal (for example ffffffff) by using
    ifconfig command, you must prefix hexadecimal addresses with 0x when making permanent
    entries in this file. You might be asked about the format of entries in the /etc/inet/netmasks
    file.


    Each IPv4 unicast address class has a default network mask associated with it.
    They are as follows:


    +   - Class A—Default network mask is 255.0.0.0.

    - Class B—Default network mask is 255.255.0.0.

    - Class C—Default network mask is 255.255.255.0.


    A network mask is 32 bits long—the same as an IPv4 address. If you convert the
    network mask to binary, you will see that it consists of a number of contiguous
    1s (255 in decimal is equal to 11111111 in binary) followed by a number of contiguous
    0s. It is the 1s portion of the mask that determines the network part of the IPv4
    address. You''ll see that for a class C IPv4 address, the default network mask
    is 255.255.255.0, indicating that the first 24 bits of the mask are 1s and the
    last 8 bits are 0s.


    > You can assign a network mask that does not consist of contiguous 1s, such as
    255.255.254.128 (11111111 11111111 11111100 in binary), but this is not normally
    done because it increases the complexity of administering the network address
    space.


    The format of entries in the /etc/inet/netmasks file is:


    ```

    <network number>      <network mask>

    ```


    The host portion of entries is entered as 0 and the separator character can be
    spaces or tabs, so for a system with an IPv4 address of 172.16.24.56 (class B),
    the entry is as follows:


    ```

    172.16.0.0      255.255.0.0

    ```'
  merge: -1
  pgno: 104
