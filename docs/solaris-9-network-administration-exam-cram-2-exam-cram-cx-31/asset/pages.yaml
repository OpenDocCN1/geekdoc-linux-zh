  md: '# traceroute


    Use the traceroute command to follow the path to the remote host you are trying
    to reach. The traceroute command sends three probes at 5-second intervals to each
    router that is encountered along the path. If any of these return asterisks, then
    it means there has been no response from the router, which can assist greatly
    with identifying where the problem is located. The following example traceroute
    output demonstrates a problem:


    ```

    ultra10# traceroute www.mobile-ventures.net

    Tracing route to mobile-ventures.net [209.67.50.203]

    over a maximum of 30 hops:

    1  9 ms     8 ms    8 ms 10.25.0.1

    2 13 ms     8 ms     8 ms gsr0-st.blueyonder.co.uk [62.30.65.1]

    3 12 ms    12 ms   12 ms 172.18.6.69

    4 14 ms    13 ms   12 ms tele1-at-pos.telewest.net [194.117.136.2]

    5 13 ms    13 ms   12 ms pos50402-grsr2-linux.cableinet.net

    * [194.71.154.190]

    6 12 ms    12 ms   11 ms zcr1-so-5-0-0.Londonintw.cw

    * [166.63.222.37]

    7 85 ms    83 ms    85 ms * * *

    8 80 ms    78 ms    80 ms * * *

    ```


    This output demonstrates that the trace was successful through the routers provided
    in the U.K. by ISP (entries 1 thru 6) and that the problem occurs when the next
    router following the international gateway in London is probed (entry 7). This
    information could be useful to the ISP if you raise a trouble ticket to report
    the problem, but it clearly shows that the problem is not on your own local network.'
  merge: -1
