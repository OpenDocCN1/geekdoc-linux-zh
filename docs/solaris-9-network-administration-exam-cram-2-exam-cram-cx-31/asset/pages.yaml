    ETHER: Packet 5 arrived at 14:35:1.14

    ETHER: Packet size = 64 bytes

    ETHER: Destination = ff:ff:ff:ff:ff:ff, (broadcast)

    ETHER: Source = 8:00:20:8e:48:de, Sun

    ETHER: Ethertype = 8035 (RARP)

    ```'
