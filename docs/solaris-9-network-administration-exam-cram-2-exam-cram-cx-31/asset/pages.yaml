    # How to Prepare for the Exam


    At a minimum, preparing for Solaris 9 exams requires you to obtain and study the
    following materials:


    +   - The Solaris 9 documentation in printed form, on CD-ROM as delivered with
    Solaris 9, or on the Web at http://docs.sun.com. You can also download the documentation
    CD-ROM from Sun''s Web site.


    +   - The test exam objectives and sample questions on the Sun certification Web
    page (http://training.sun.com/US/certification/solaris/netadmin.html).


    +   - This Exam Cram 2 book. It''s the first and last thing you should read before
    taking the exam.


    Also, you''ll find any or all of the following materials useful in your quest
    for Solaris 9 network administration expertise:


    +   - Hands-on Experience—Obtain a copy of Solaris 9 from Sun''s Web site (http://www.sun.com).
    Ideally, you need at least two (networked) workstations to be able to replicate
