- img_proc: true
  md: "# Input/Output Errors\n\nIn the previous section, the netstat -i command was\
    \ used to show the level of usage of ethernet interfaces on the network. This\
    \ command is also used to detect input and output errors. Collisions, as you have\
    \ seen, are a network-related problem, whereas input and output errors are specific\
    \ to the local system and the cause could be one of the following:\n\n+   - A\
    \ faulty network interface card\n- A faulty port on a hub or switch\n- A faulty\
    \ network connection\n- A duplicate IP address, meaning another host on the network\
    \ is using the same IP address as the local host (although you would normally\
    \ see a message to this effect in the console window or the /var/adm/messages\
    \ file)\n\n+   - A software fault (you might have one of these problems, which\
    \ produces precisely the same symptoms as a hardware fault, but requires an operating\
    \ system patch to cure)\n\n# Troubleshooting Ethernet Problems\n\nSolaris provides\
    \ a number of network utilities that can be used to troubleshoot an ethernet interface.\
    \ This section describes the utilities ifconfig, ping, netstat, snoop, and ndd.\
    \ When used together, they can diagnose the majority of network-related problems.\n\
    \n# ifconfig\n\nAs root, use the ifconfig -a command to verify the status of all\
    \ installed ethernet interfaces, as shown in the following:\n\n```\n#ifconfig\
    \ -a\nlo0: flags=1000849UP,LOOPBACK,RUNNING,MULTICAST,IPv4 mtu 8232 index 1\n\
    \    inet 127.0.0.1 netmask fffffffff00\nhme0: flags=1000843UP,BROADCAST,RUNNING,MULTICAST,IPv4\
    \ mtu 1500 index 2\n    inet 192.168.1.28 netmask fffffffff broadcast 192.168.1.255\n\
    \    ether 8:0:20:b3:41:53\n```\n\nAs shown in the preceding code, you can use\
    \ the flags= to verify that the ethernet interface is up and running and that\
    \ the netmask is correct for the specific interface IP address. Problems such\
    \ as this can often be encountered when an ethernet interface has been manually\
    \ configured incorrectly."
  merge: -1
