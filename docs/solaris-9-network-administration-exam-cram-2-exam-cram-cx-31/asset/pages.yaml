  md: '# IPv4 Routing 115


    Note that the hosts on network A can communicate with hosts on network B or network
    C, only if they use router 1 as an intermediate gateway. The connection to network
    C is not so apparent because it relies on router 1 forwarding data to router 2—that
    is, it would take three hops for a host on network A to communicate with a host
    on network C, namely host on network A to router 1, router 1 to router 2, and
    router 2 to host network C.


    Also, the hosts on network B can communicate with hosts on network A only if they
    use router 1 as an intermediate gateway. Similarly, the hosts on network B can
    communicate with hosts on network C only if they use router 2 as an intermediate
    gateway.


    If a host were to be added to network B, for example, then a static route would
    be added for both network A and network C, using router 1 and router 2 as gateways,
    respectively. The commands to add these routes would be


    ```

    ultra10# route add 192.168.28.0 192.168.29.1

    add net 192.168.28.0: gateway 192.168.29.1

    ultra10# route add 192.168.30.0 192.168.29.2

    add net 192.168.30.0: gateway 192.168.29.2

    ```


    When a host on network B sends a packet to a host on network A for example, it
    is passed to the router interface 192.168.29.1 for delivery. If the same host
    on network B sends a packet to a host on network C, it is passed to the router
    interface 192.168.29.2 for delivery.


    To delete the route to the network 192.168.30.0, enter the following command:


    ```

    ultra10# route delete 192.168.30.0 192.168.29.2

    delete net 192.168.30.0: gateway 192.168.29.2

    ```


    If the route to network A changes from 192.168.29.1 to 192.168.29.55, for example,
    enter the following command to modify the route:


    ```

    ultra10# route change 192.168.28.0 192.168.29.55

    change net 192.168.28.0: gateway 192.168.29.55

    ```


    For hosts on network A, all communications will pass through router 1, using the
    IP address 192.168.28.1, so it would be easier to create a default route as follows:


    ```

    ultra10# route add default 192.168.28.1

    add net default: gateway 192.168.28.1

    ```'
