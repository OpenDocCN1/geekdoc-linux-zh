  md: '# About the Author


    John Philcox is owner and director of Mobile Ventures Limited, a computer consultancy
    based in Cheltenham, Gloucestershire, in the United Kingdom, specializing in Unix
    systems and networks. He has more than 20 years experience in IT; 15 of those
    with SunOS and Solaris environments. He is a certified Solaris administrator,
    as well as a professional member of the Institution of Analysts and Programmers
    and the Institute Management of Information Systems, both in the U.K. John is
    also a member of Usenix and SAGE. He has worked in a number of large multi-vendor
    networks in both the public and private sectors of business.


    John was the author of *Solaris System Management* (New Riders Publishing, ISBN:
    073571018X) and a contributing author of *Solaris 9 System Administration Training
    Guide* (Exam CX-310-014 and CX-310-015) (Que Publishing, ISBN: 0789729229).


    John has also been a technical editor/reviewer on the following books:


