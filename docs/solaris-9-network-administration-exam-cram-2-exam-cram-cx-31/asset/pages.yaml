  md: '# Question 3


    +   Which of the following describes to map a 32-bit IP address to a 48-bit ethernet
    address?

    - A. It is used to map a 32-bit IP address to a 48-bit ethernet address.

    - B. It is used to map a 48-bit ethernet address to a 32-bit IP address.

    - C. It is used to map a 32-bit ethernet address to a 48-bit IP address.

    - D. It is used to map a 48-bit IP address to a 32-bit ethernet address.


    Answer B is correct. RARP maps a 48-bit ethernet address to a 32-bit IP address.
    Answer A is incorrect because this describes the function of ARP, not RARP. Answers
    C and D are incorrect because an ethernet address is 48 bits long and an IP address
    is 32 bits long. These answers identify the wrong lengths.


    # Question 4


    +   Which of the following configuration files are consulted by the RARP daemon?

    - A. /etc/inet/netmasks

    - B. /etc/inet/hosts

    - C. /etc/ethers

    - D. /etc/inetd.conf

    - E. /etc/bootparams


    Answer B and C are correct. /etc/inet/hosts and /etc/ethers are the configuration
    files consulted by the RARP daemon. Answer A is incorrect because /etc/inet/netmasks
    is used to associate IPv4 network masks with IPv4 network numbers. Answer D is
    incorrect because /etc/inetd.conf is the configuration file for the inetd daemon,
    which is the Internet services daemon. Answer E is incorrect because /etc/bootparams
    contains client boot information.'
