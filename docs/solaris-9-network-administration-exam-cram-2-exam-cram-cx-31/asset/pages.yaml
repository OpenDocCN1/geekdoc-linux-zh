    # Question 3


    | Which IPv6 address type involves an address assigned to a number of interfaces,
    with IPv6 datagrams being delivered to the nearest interface member, rather than
    to all interfaces that have the address assigned? |

    | A. Anycast |

    | B. Broadcast |

    | C. Multicast |

    | D. Unicast |


    Answer A is correct because the anycast address type involves an address being
    assigned to a number of interfaces, but the datagrams are delivered to the nearest
    member with the address assigned. Answer B is incorrect because broadcast addresses
    are not used in IPv6. Answer C is incorrect because a multicast address involves
    an address assigned to a number of interfaces, but the datagrams are delivered
    to all members with the address assigned. Answer D is incorrect because a unicast
    address involves a single address assigned to a single interface and is used when
    a host communicates with another host on the network.


    # Question 4


    | Which of the following IPv6 addresses is invalid? |

    | A. fe80:0000:0000:0a00:20ff:feb3:4153 |

    | B. fe80:0:0:0:0a00:20ff:feb3:4153 |

    | C. fe80:0000::0a00:20ff:feb3:4153 |

    | D. fe80::a000:20ff:feb3:4153 |


    Answer C is correct because the IPv6 address fe80:0000:0a00:20ff:feb3:4153 makes
    use of the double colon (::) character twice. This can be used only once in an
    IPv6 address. Answers A, B, and D are incorrect because all are valid IPv6 addresses.'
  merge: -1
