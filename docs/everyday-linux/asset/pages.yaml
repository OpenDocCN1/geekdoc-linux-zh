- pgno: 173
  md: 'GFTP is easy to use, but it may require a little getting used to. It makes
    use of a variety of services. They aren’t complicated, but there are a lot of
    them, so it can take a little while to become accustomed to using GFTP. After
    you do, though, you’ll be able to use an incredibly versatile and powerful FTP
    program. We are first going to concern ourselves with the menu bar at the top
    of the GFTP screen. We’ll then look at the rest of the GFTP screen.


    # **FTP**


    The first menu is the FTP menu. When you click on this menu, you are presented
    with four different options: ascii, binary, options, and quit. The last one is
    obvious—click on it to exit the program.


    The first two, ascii and binary, refer to the *transfer method*, that is, how
    GFTP is going to attempt to transfer the files that you download and upload. All
    text files should be transferred using the ascii mode; other files should be transferred
    in binary mode. You may not encounter problems if you attempt to transfer binary
    files in ascii mode, but it’s best to be on the safe side. The mode that you’re
    currently transferring in is lited on the left side.


    You’ll probably spend some time in the options menu.


    There are four tabs in the options section. The first is the general tab. Following
    it are the FTP proxy and HTTP proxy tabs and finally the Local Hosts tab. The
    general tab is probably the only one you’re going to change. The final three are
    used for network purposes, so if you’re not on a network, you should leave these
    tabs alone. If you are on a network, you should only fill in this information
    as directed by a network administrator.


    In the General section, you will be able to put in your e-mail address, the program
    you use to view files (the “view program”), the program you use to edit files
    (the “edit program”), and other miscellaneous details.


    Your e-mail address is the password sent when you log in as an anonymous user.
    Many people don’t like to type their real e-mail addresses because some sites
    will collect the addresses and put them in mailing lists. These lists are sold
    and used by commercial companies to send unsolicited commercial e-mail (UCE),
    or “spam.” I usually give a false address.


    The view and edit programs should be specified with their full path and file-name,
    unless the program is already in the path. (Such as gedit.)


    The other checkboxes that are available are fairly self-explanatory. These'
  merge: -1
  img_proc: true
- pgno: 174
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_174_0.png)


    # **Figure 9-5**

    The options menu in GFTP.


    options will not change any of the files that you download or set formats that
    could restrict your use of GFTP, so you can experiment with these safely.


    One of the fill-in boxes does deserve some special attention. The “Max KB/S” will
    allow you to specify the maximum transfer rate possible during transfers. On occasion,
    when you transfer files between your computer and local servers, files may be
    transferred so quickly that errors in the transfer occur, damaging the contents
    of your file. If you find that this happens to you, you should set this according
    to the speed of your modem. If you have a 56k bps modem, you would set the “Max
    KB/S” rate to 5.6. Generally, you can always divide your modem speed by ten and
    put it into this box.'
  merge: -1
