- pgno: 271
  md: '# ### Adding Additional Slides


    You may add a new slide to your presentation by clicking “insert slide” from the
    presentation menu, or from the top menu by clicking “insert” and “slide.” The
    slide will be labeled “slide two” and you may move between slide one and two by
    clicking the tabs directly below your slide. If your new slide has many of the
    attributes of another slide you have created, you may make a copy of the slide
    by clicking “duplicate slide” from the presentation menu.


    When you insert a new slide, the “insert slide” window pops up and you can choose
    from an assortment of slide layouts, or you may choose a blank slide. Each layout
    has a brief description of text and image placement. You can always change the
    layout of the slide by clicking “modify slide” from the presentation toolbar.


    # ### Sorting Your Slides


    You can easily rearrange the order of your slides by clicking on the slide view
    icon. This small icon is located on the right border of your Star Desktop and
    has four tiny boxes in it.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_271_0.png)


    **Figure 14-23**

    Sorting Slide Order.'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'When you use slide view, all your slides will appear on the desktop and you
    can click on them and drag them to the order you wish to use. You can also delete
    slides when in this window by simply right clicking on the slide to be deleted
    and then selecting "delete slide" in the pop up window.


    # ## Viewing Your Presentation


    When you are through with your presentation and would like to view it, right-click
    over the first slide and choose “slide show.” You will see a full screen view
    of your slides.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_272_0.png)


    To advance from one slide to the next, just place your mouse over the image and
    click. When all of the slides have been displayed you will get a prompt to “click
    to end presentation.”


    # ## Additional Presentation Options


    Star Office gives you some additional options to help with your presentation.
    There are some additional small buttons near the one to organize your slides.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# Everyday Linux


    The Drawing view is the default and the one you generally work in when you are
    creating a presentation.


    Outline view will show the slide as a preview and the text from all of the slides
    in an outline form.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_273_0.png)


    *Outline Form.*


    You can toggle the slide preview on or off. Outline form is useful for printing
    out the presentation in word processor form.


    Notes view will allow you to view each slide on a separate page with room beneath
    for adding additional notes.


    This mode is very useful for speakers. You add text by simply clicking in the
    box beneath the slide.


    Handouts mode will display several slides on a page.


    You can arrange the slides any way you like and print them out to use as handouts.'
  merge: -1
  img_proc: true
