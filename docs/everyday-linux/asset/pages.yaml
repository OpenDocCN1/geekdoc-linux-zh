  md: '# Window


    Clicking on window will drop down a menu that will allow you to cascade or tile
    all open WordPerfect windows. You may also choose to minimize or close all windows
    from this menu. Finally, you will see a list of all open WordPerfect windows and
    you may select individual windows from that list.


    # Help


    WordPerfect 8 comes with a fairly extensive array of help for the new user. From
    the control window, click on help. The drop down menu will allow you to choose
    to either search for a help topic or see help contents. If you choose contents
    you will have a window that comes up and allows you to choose from various topics.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_282_0.png)


    # Figure 15-5

    Help Menu.


    From the help contents window, you may choose from various help topics, or you
    may choose glossary if there is a term you do not understand. There are also menu
    commands or bars to learn about the various commands and tools in WordPerfect
    8. You may also choose search to search the help areas for a specific topic. The
    menus work like a browser, so you can click on the topics like links on a webpage.'
  merge: -1
  img_proc: true
