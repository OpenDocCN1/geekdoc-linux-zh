- pgno: 419
  md: '# everyday

    Linux


    Kathy Miles

    Ethan Metzger


    > Your complete "everyday" guide to Linux and its key desktop applications!


    Until now, if you wanted to get productive with Linux, you’d have to buy one book
    for Linux, and another for each of your key Linux desktop applications. With **Everyday
    Linux**, one book covers it all!


    You’ll find easy, hands-on instructions for installing and configuring any current
    version of Linux, with extra step-by-step help for Red Hat Linux, the world’s
    #1 Linux distribution. No matter which Linux you’re running, **Everyday Linux**
    demonstrates exactly how to set up your hardware and multimedia devices, connect
    to the Internet, send email, manage your files, maintain your system, and a whole
    lot more.


    Then, once you’re comfortable in the Linux environment, **Everyday Linux** will
    grow with you—helping you master today’s most powerful Linux desktop software,
    including StarOffice™, WordPerfect®, The Gimp for graphics, Netscape and other
    Internet applications, even Linux games!


    # Master all this, and more!


    +   + Installing Linux and configuring it to meet your personal needs

    +   + Working with both the GNOME desktop and the command line interface

    +   + Efficient day-to-day system administration and maintenance

    +   + Organizing, finding, and managing your files


    +   + Getting productive with StarOffice: Writer, Calc, Impress, and more

    +   + Using The Gimp and other Linux graphics tools

    +   + Importing files from Windows® systems

    +   + Configuring Linux multimedia

    +   + Games on Linux: finding, playing, and optimizing them


    # About the Authors


    KATHY MILES and ETHAN METZGER have been collaborating on diverse projects for
    more than four years, including work to support a community-based Internet service
    provider. KATHY is a columnist for the *Daily Local News* in West Chester, Pennsylvania.
    She has been working with Linux for over four years and UNIX for the past seven
    years. ETHAN has been working with UNIX for five years and Red Hat Linux for two.




    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_419_0.png)


    ISBN 0-13-071762-1'
