- pgno: 311
  md: "# Making Changes to Existing Cards\n\nAfter you have created entries to your\
    \ address book, you can go back and edit an entry if needed or update information.\
    \ To do so, click on “modify.” The same window used to create an entry will pop\
    \ up. You can click on the tabs and edit whatever information you need to. To\
    \ have the changes take effect immediately, click “apply.”\n\n# Saving Your Address\
    \ Book\n\nWhen you are through adding or modifying entries to your address book,\
    \ you will need to save it. You can click on “save.” and you will be prompted\
    \ for a name and location. You should save your address book in your home directory,\
    \ rather than a more public directory.\n\n# Finding a Card\n\nWe’ve all suffered\
    \ the inability to remember a name or phone number. GNOME Address Book will allow\
    \ you to search for a string of information. You can search for part of a name,\
    \ series of numbers, street name, etc. To begin a search, click on the “find”\
    \ button.\n\nFill in the information you want to search for and click “ok.”\n\n\
    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_311_0.png)\n\n**Figure 16-13**  \n*Searching\
    \ for Data.*"
