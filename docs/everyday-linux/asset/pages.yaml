    # ## Selecting a Printer and Printing a Document


    Before you print any documents you must first select a printer for WordPerfect
    8 to use. Click "file" and then "print".


    When the print window pops up, choose "select" near the top right of the window.
    The "select printer" dialog box will pop up.


    The dialog box will list whatever printers are connected to your system (our screenshot
    doesn''t list printers because there were none connected). Choose a printer from
    this box and then click ok.'
