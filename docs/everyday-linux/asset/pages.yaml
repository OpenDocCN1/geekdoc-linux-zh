    # ### Killing Processes


    All programs have the potential to “hang”, that is, to stop running or freeze.
    In Linux, there are two ways to take care of this problem. The first is to right-click
    the program in question and then click on the option labeled “nuke.” This sends
    a “kill” to the program (which is running as a *process*), and it terminates immediately.


    The second way is to do this from the command line. We must use two commands to
    do this, however. The first is the `ps` command. This is an older command (which
    you can kind of tell because it’s so short) that stands for “list processes.”


    Each time you run a program on your computer in Linux, it is assigned a number.
    This is known as its process number, and when you do a listing of all the processes
    using the `ps` command, you will see a list of numbers followed by the commands
    that are running. This list might look something like this:


    ```

    ```

    PID      TT     TIME     COMMAND

    11008    p1     0:00.12  -bash (bash)

    11037    p1     0:00.21  slirp -P

    11040    p6     0:00.12  -bash (bash)

    11139    p6     0:00.02  ps

    ```

    ```


    The PID is the process ID number. TT is an abbreviation for TTY, and it tells
    which terminal you’re on. (I have processes running on tty1 and tty6.) STAT tells
    the status of the program running—you really don’t need to worry too much about
    this, but the man page for `ps` will tell you what the letters and symbols mean.
    TIME is the CPU time that the process is taking up, and COMMAND tells which command
    is running.


    For example purposes, let’s suppose that my `slirp -P` is hung and will not terminate
    using normal termination commands. To kill it, I would use the `kill` command.
    The syntax for the `kill` command is as follows: `kill [ -#] [ pid]`. You don’t
    have to include the `kill` level if you don’t want to, but it does serve a purpose,
    which we’ll get to after we kill the `slirp` process. The pid is the process ID
    number; in this case, the pid is 11037. To kill the process, then, we’d simply
    type `kill 11037`. The process will then terminate, and `slirp` will no longer
    be running.'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'The numbers that are associated with the `kill` command (the `[-#]` in the
    syntax) are used as “termination signals.” A termination signal can tell a process
    how to terminate. In addition, termination signals can “hit harder” than a regular
    `kill` command, so if you have problems getting a process to terminate, you can
    use a stronger termination signal to kill the process.


    The most commonly used termination signal is `-9`, which is used to kill not only
    the process that you specify, but all processes that it spawns; in other words,
    you are killing a parent process and its children. In my process list above, which
    I gleaned from a telnet session to my ISP, you noticed I was running `bash` twice.
    When you run a command interpreter, you also run programs from the command interpreter.
    So a child process of the `bash` shell that I’m running might be the slrp command
    below it.


    To kill both of them, I would type `kill -9 11008`. This says, “kill the process
    ID 11008 and all of the processes spawned underneath it.” This includes the slrp
    process, 11037.


    In addition to using these two commands, `ps` and `kill`, you have at your disposal
    two other programs—`top` and `gtop`. `Gtop` is the `GNU` version of `top`, and
    it runs graphically—it’ll probably be easier to use, and you’ll find that it is
    likely more convenient than using the command line version.


    `Top` is little more than a glorified version of `ps`. It will list all of the
    processes on the computer that are presently running. You can look at individual
    users or all of the users at once if you so desire. You will be able to kill processes,
    *renice* them (change their priority), and see how they draw upon system resources.
    Both `top` and `gtop` are very useful tools, and you’ll probably prefer using
    them to play with processes instead of `ps` and `kill`.


    # Making Minicom Usable for Everyone


    One of the first things we mentioned about using the command line was in Chapter
    Five, when we mentioned `Minicom` as an alternative connection program for users
    who had a text-based Internet or BBS connection. Unfortunately `Minicom` isn’t
    usable by anyone but `root` when you installed Red Hat Linux. If you’ve got a
    lot of users on the system or you just want to be able to dial into a text-based
    connection, you should follow this procedure to allow everyone to use `Minicom`.


    To do this, you must be `root`. If you’re using your personal account, you can
    simply use the `su` command to become `root`.'
  merge: -1
