- pgno: 371
  md: "# Shisen-Sho\n\nShisen-Sho looks quite similar to Mahjongg and uses the same\
    \ set of tiles. The goal is to remove all the tiles by clicking on like pairs\
    \ with the mouse. Tiles may be removed if they can be connected with no more than\
    \ three straight lines. More documentation may be found by choosing “help” on\
    \ the Shisen-Sho screen.\n\n![](img/92fb6d8ad19de3b3470ba95c7b71b82e_371_0.png)\n\
    \nFigure 20-15  \n*Shisen-Sho.*\n\n# Snake Race\n\nThose who do not suffer from\
    \ herpophobia will enjoy guiding the ever growing-snake around the board, munching\
    \ on the fruit. The object is to eat all the fruit without running into walls,\
    \ the evil red ball, or yourself (and as the snake grows this gets pretty tricky!).\
    \ There are several skill levels to choose from. Guide your hungry snake by using\
    \ the arrow keys."
  merge: -1
  img_proc: true
- pgno: 372
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_372_0.png)


    Figure 20-16 Snake Race.


    # Other Games


    As Linux grows in popularity, more and more games will become available. There
    are additional games which are available now, some for free and some commercially.
    One additional free game we thought worth mentioning was xjig.


    # Xjig


    If you like jigsaw puzzles you will fall in love with xjig. Xjig takes a .gif
    image and creates a jigsaw puzzle out of it. You may specify the number of pieces
    and even create a double-sided puzzle if you like!'
  merge: -1
  img_proc: true
- pgno: 373
  md: 'Xjig does not come with Red Hat, but is available as an RPM package from the
    Red Hat website. You can download it and install it with GnorPM. Instructions
    for using GnorPM and installing new programs are in the “Maintaining Your System”
    chapter.


    Xjig unfortunately uses a command-line interface, but you can work around this
    by creating an applet in GNOME. Instructions for this are available in the GNOME
    chapter.


    The commands used for xjig are available in the man pages. From a terminal, type
    “man xjig.” You must do this after you have installed the program. We use an example
    of creating a medium-sized puzzle.


    This was the original image. We created the puzzle by going to a command line
    and typing this command:


    ```

    **xjig -file puzzle.gif -side n -w 16 -h 26**

    ```


    The result was a jigsaw puzzle like the one in Figure 20-18. Of course, the color
    original looked much better!


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_373_0.png)'
  merge: -1
  img_proc: true
- pgno: 374
  md: "![](img/92fb6d8ad19de3b3470ba95c7b71b82e_374_0.png)\n\n**Figure 20-18**\n*Xjig*\n\
    \n> **Tip**\n> \n> Remember the images must be in .gif format. Whenever I select\
    \ an image to make a puzzle, I name it puzzle.gif. This prevents a lot of puzzle\
    \ images taking up diskspace and it makes the applet possible, as it is always\
    \ looking for the same file name.\n\nYou need to start with an image that is roughly\
    \ the same size as you want the puzzle to be. Starting with a small image and\
    \ trying to create a large puzzle will lead to poor image quality. Try enlarging\
    \ the image to the size you want the puzzle to be. If it looks OK, the puzzle\
    \ will be all right."
  merge: -1
  img_proc: true
- pgno: 375
  md: '# Railroad Tycoon II


    Loki Games (www.lokigames.com) and Pop Top Software have teamed up to provide
    Linux gamers with Railroad Tycoon II. This is a commercial game that allows you
    to assume the role of a railroad mogul. Your goal is to be smarter and better
    than everyone else in the railroad industry.


    There are over seventy-five scenarios that include building the transcontinental
    railroad in the 1800s, to supplying allied forces during WWII to establishing
    an electric railroad through the Swiss Alps. You can play alone or against dozens
    of computer opponents or even against friends on a local area network or Internet.


    The game provides stunningly realistic maps and graphics. The maps are actual
    maps and the financial models are detailed and logical. The game comes with a
    tutorial so it is not difficult to learn how to play.


    # Installing Railroad Tycoon


    To install Railroad Tycoon, you must be root, but you need not run X-Windows as
    root. Instead, we offer a safer way to install the game. Put the Railroad Tycoon
    CD into your CD-ROM and then open a terminal window. Type in this command to mount
    your CD-ROM:


    ```

    ```

    su-c/mount

    /dev/cdrom

    /mnt/cdrom

    ```

    ```


    Now type in this command:


    ```

    `su -c ./setup.sh`

    ```


    The su -c command tells the computer to execute the command as root. You will
    be asked for the root password. Type it in and hit Enter. The reason we suggest
    using this command is because it only executes one command and makes mistakes
    less likely to happen. The ./setup.sh is the file on the CD-ROM that you want
    to run to start the install. Once you type in the root password, an install window
    will pop up.


    The first window which comes up asks you which parts of Railroad Tycoon you would
    like to install. The movies can be run off the CD and do not need to be installed
    on your computer. They take up a good deal of space and if you do'
  merge: -1
  img_proc: true
