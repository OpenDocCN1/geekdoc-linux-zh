- pgno: 206
  md: '# Star Office Auto Pilots


    You can get a good start to using Star Office by using the auto pilots. These
    will guide you through creating a document, webpage or other project. To access
    the auto pilots, click "file" and then "auto pilot." Another menu will allow you
    to choose document, webpage, spreadsheet, etc. As an example, we will choose to
    create an agenda from the auto pilot.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_206_0.png)


    **Figure 11-7**

    Using Auto Pilot to Create an Agenda


    The auto pilot begins by asking you some basic layout questions about your agenda.
    When you have answered them, click "next."


    Auto pilot will continue asking you questions about your agenda. Keep clicking
    "next" until you have all the information you want in your agenda. When you are
    through, click "create." Your agenda will be created and opened in Star Office.
    You can then fill in additional information and finally save your document.


    # Working with Star Office Templates


    Templates are preformatted documents. Star Office provides you with a large selection
    of templates to work with. Templates are also used by Star''s auto pilots to help
    you create documents and other projects. To view the various templates there are
    to choose from, click "new" and then "from template." When the win-'
  merge: -1
