    Scroll down through the list and see if your printer is there. If you find your
    printer, double-click on it and it will appear at the top portion of the window
    under “installed printers.” There is an existing choice of “generic printer.”
    Click once on your printer in the upper window and then click “test page.”


    If you do not find your printer in the existing printer drivers, just try the
