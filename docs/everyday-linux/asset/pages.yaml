- pgno: 324
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_324_0.png)


    # The GIMP


    Just about anything you''d want to do with a graphic can be done by the GIMP.
    So extensive is the program that several entire books have been devoted to it.
    We''ve tried to cover the basics here, the more common things you might want to
    do. If you like to do things with graphics, you might consider either buying a
    book or browsing the tutorials and documentation at http://gimp.org. There seems
    to be no end to the creative things that GIMP can do and more things get added
    all the time. A basic version of stable GIMP comes with Red Hat''s CD. From GIMP''s
    website you will find links to add-on brushes, plug-ins, patterns, script-fus,
    and more.


    GIMP, which stands for GNU Image Manipulation Program, is a freely distributed
    program that is often compared to Adobe''s Photoshop. My opinion is that GIMP
    is better because it is distributed under the GNU license. ${}^{a}$ GIMP can be
    used for retouching photos, image composition, creating awesome logos and many
    other things.


    *For more information about the GNU public license, see Appendix.'
  merge: -1
  img_proc: true
- pgno: 325
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_325_0.png)


    Figure 18-1 GIMP Main Menu.


    At first glance the GIMP main menu might not look very impressive, but don’t be
    misled. Additional controls show up via left mouse-click over the image. Again,
    a three button mouse is preferable with GIMP.


    The main menu shows tool choices and foreground and background colors, as well
    as menu choices at the top (“file” and “Xtras”). The default fore- ground/background
    colors are black and white. If you hold your mouse over one of the tools, text
    will appear to tell you what that tool is.


    # GIMP’s Menus


    As mentioned earlier, GIMP does so many things that it is simply impossible to
    cover it in a single chapter (a multi-volume book might be better!). A pop-down
    menu of operations is brought up by right-clicking over the image. You will see
    that there are sub-menus as well. Here are some of the more commonly used operations
    found under the following menu headings.'
  merge: -1
  img_proc: true
- pgno: 326
  md: '# File Menu


    +   *   *New*—creates a new image window.

    +   *   *Open*—loads an existing image.

    +   *   *Save*—saves current image.

    +   *   *Save as*—saves current image under new specifications.

    +   *   *Preferences*—allows user to define certain preferences.

    +   *   *Close*—closes current window.

    +   *   *Quit*—closes all GIMP windows and exits program.

    +   *   *Mail*—allows user to mail image if mail programs is installed.

    +   *   *Print*—prints current image.


    # Edit Menu


    +   *   *Cut*—cuts current selected area from image.

    +   *   *Copy*—copies selected area to clipboard.

    +   *   *Paste*—pastes from clipboard to current selected image.

    +   *   *Paste into*—pastes from clipboard into current selection.

    +   *   *Clear*—clears current selection (does not save to clipboard).

    +   *   *Fill*—fills selected area with background color.

    +   *   *Stroke*—draws line following selection outline using foreground color.

    +   *   *Undo*—undoes last operation (preferences can be set for multiple undo).

    +   *   *Redo*—returns previously cancelled operation.'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'Select Menu


    There are various choices here such as Invert, All, None, Toggle, Sharpen, and
    more. All of these involve operations on selected areas of an image.


    View Menu


    * Zoom in—displays a close-up view of image or selected area.

    * Zoom out—is the opposite of zoom in.

    * Zoom—displays a set of zoom ratios to choose from.

    * Toggle rulers—displays or hides a set of rulers around the image.

    * Toggle guides—displays or hides guides.

    * New view—opens another window of current image.

    * Shrink wrap—changes size of window to fit current zoom settings.


    Image Menu


    Colors


    * Equalize—brightens dark images or improves contrast.

    * Invert—inverts colors in the image.

    * Posterize—reduces number of color levels in the image.

    * Brightness/Contrast—sets levels for the image or selected area.

    * Hue/Saturation—sets levels for hue, lightness and saturation.


    Channel Ops


    * Duplicate—duplicates the current image along with layers.

    * Offset—offsets selected layer in “X” or “Y” direction.

    * RGB—converts image to RGB format.

    * Grayscale—converts image to grayscale.

    * Indexed—converts image to indexed color, such as 256.

    * Resize—resizes image to specifications within original image.

    * Scale—resizes entire image.'
  merge: -1
  img_proc: true
- pgno: 328
  md: 'Save Palette—saves current color palette used in indexed images.


    Transform—crops and rotates layers and images.


    # Layers Menu


    +   - Layers and Channels—brings up layers and channels dialogue window.

    +   - Raise Layer—raises current layer above next higher layer.

    +   - Lower Layer—lowers current layer below next lower layer.

    +   - Anchor Layer—affixes a floating layer to current layer.

    +   - Merge Visible Layers—merges all layers marked as visible.

    +   - Mask to Selection—creates a selection based on current layer''s mask.


    # Tools Menu


    This menu provides access to the tools found in the main GIMP window. We have
    also included a screenshot of the tool icon.


    Rect Select—allows you to select a rectangular sized area of an image.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_328_0.png)


    Ellipse Select—allows you to select an elliptical area of an image.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_328_1.png)


    Free Select—allows a selection based on the path of the cursor.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_328_2.png)'
  merge: -1
  img_proc: true
- pgno: 329
