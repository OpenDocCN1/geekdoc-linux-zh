    # Shell Scripting


    Fans of the batch file in DOS will be pleased to know that they can recreate a
    few good memories using *shell scripts*. For those of you less familiar with the
    good old days in which DOS was king and all else was subversive, let’s take a
    small look at batch files.

    You are probably familiar with the autoexec.bat file in your C:\ directory if
    you run Windows. This is a file that is automatically executed (hence "autoexec")
    every time your computer starts. Its analog is the file .bashrc (or whatever else
    your shell executes when you log in). What the autoexec.bat file does is run a
    few programs or checks when you start your computer. It might install a terminate-stay-resident
    program (a TSR program) that will check for viruses or a program called “doskey”
    that will allow you to page through a list of commands you’ve typed in. It may
    also make sure that your file listings are sorted every time you type in the dir
    command.

    However, you can also create your own batch files that will perform other tasks.
    A popular one was called “move.bat.” Moving a file involves copying a file from
    one location on the hard drive to another and then removing it from the first
    location. MS-DOS versions before 6.0 did not have a move command; you would have
    to copy a file from one location to another and then delete it manually. (The
    move command copies a file and then deletes it.) Some users, myself included,
    found the lack of a move command to be slightly annoying, so we created a batch
    file that would perform the same tasks.

    You can do the same thing in Linux. This is called *shell scripting*. The shell
    scripting language is very powerful and can be complex. However, we’ll create
    a simple shell script right here.

    First, make sure that you’re using a terminal. You’ll see the terminal prompt
    noted above, though it will be your username in the prompt, not mine.'
