  md: 'this isn''t usually suggested, as it''s not going to save you scads of room
    and eliminates the choice of future users, it''s entirely possible.


    **Querying a Package** —If you''re interested in the contents, size, or description
    of an installed package on your system, you should right-click it, and then click
    on the Query option. You''ll find out about the package, what files are contained
    in it, and how much space it takes up.


    Space-conscious users will probably want to periodically review the packages installed
