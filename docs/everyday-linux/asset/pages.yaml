- pgno: 124
  md: '# CHAPTER

    7


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_124_0.png)


    # Managing

    Your Files


    With most of your setup complete, it’s time to start managing your files. As the
    owner of this computer, you are effectively the systems administrator for your
    Linux system. You should be able to quickly and effectively fix problems. To do
    this, you need a good knowledge of the file system and the File Hierarchy Standard
    (abbreviated FHS). In this chapter, you should learn how the file system works—that
    is, how files are referenced and recognized, how to use some of the tools for
    working with the filesystem that come with Linux, and the locations of special
    files such as logs or configuration files.


    # The Filesystem Structure


    For users of MS-DOS, the filesystem (sometimes abbreviated “fs”) will be more
    familiar than to users of Windows9x. Microsoft patterned DOS after UNIX, so many
    of the conventions are similar. Those of you with no experience with DOS won’t
    have to become used to the differences, however.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# ### The File Browser


    The file browser is relatively simple to use. The buttons are intuitive and the
    design is easy to follow. We don''t need to say too much about it, but we include
    a screen shot and some information about various features here.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_125_0.png)


    **Figure 7-1**

    *Your file manager will look something like this.*


    The first five buttons are similar to those on a web browser like Netscape. The
    back button will take you to the directory you were using previously. The up button
    will place you one level up on the directory tree, and the forward button will
    carry you from your present location to where you were before you pressed the
    back button. The home button will bring up the display of your home directory,
    and the rescan button will refresh the display in case you made any changes to
    the files in question during the use of the file browser.'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'Perhaps the more interesting buttons are those labeled *icons*, *brief*, *detailed*,
    and *custom*. These buttons control how the files are displayed on your system.
    If you don''t really need to know anything about the files, you can leave it at
    the icon display. More detailed displays are shown when you click on the other
    three buttons. (They also take up less space than the icons, so you''ll be able
    to see more files at one time.)


    If you want to change how the file browser operates, you can do so from the Preferences
    menu. The preferences menu is also pretty intuitive, and you normally don''t need
    to change them. For these reasons, we''re going to move on from the file browser
    and examine the files and directories you see in it more closely.


    To start the file browser, simply double-click on the "Home Directory" icon at
    the top of your desktop.


    # ### Files


    Files in Linux serve as many purposes as they do in any other operating system.
    There are special kinds of files specific to a Linux system that are not present
    in other operating systems, the same way there are in any other operating system.
    We''ll take a look at some of these files and others as we learn about the files
    in the filesystem.


    # ### Naming Conventions


    Filenames in Linux usually contain no spaces in them. Words are often separated
    by dashes (-) or underscores (_). Filenames usually consist of a filename and
    an *identifying extension*. The extension is denoted by a period and then three
    or four letters.


    For instance, if you had taken a picture of your deck and loaded it onto your
    system via a scanner, the name of the file might be called "deck.jpg" or "deck.jpeg."
    The format of the file is JPEG—a specific picture format. Old DOS conventions
    allowed eight characters for a filename and three for an extension, so JPEG was
    abbreviated as "jpg" UNIX systems didn''t employ those restrictions, so JPEG files
    usually had a .jpeg extension.


    Common extensions are .txt or .text (text files), .htm or .html (hypertext markup
    language files), .jpg or .jpeg (JPEG picture files), .gif (Graphic Image Files),
    .tif or .tiff (tagged image file format), .mpg or .mpege (MPEG file format),'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'and others. Many systems administrators create directories with a .d extension
    to ensure that it is obvious that they are directories, not just files.


    Filenames in UNIX can contain any of the 127 standard ASCII characters. This includes
    spaces and some special escape characters, though it is not recommended that you
    use spaces or those escape characters when naming files. If you encounter a filename
    with spaces in it, you usually have to use single quotes to read the file, if
    you''re accessing it from the command line. (More on this when we reach the command-line
    interface.)


    Filenames can be up to 256 characters long. Linux is a case-sensitive operating
    system, so Filename.txt is different than filename.txt is different than FILE-NAME.TXT
    is different than FileNaMe.TXT.


    # ## Plaintext vs. Binary Formats


    Plaintext files are those that you can read by opening them up in a plaintext
    editor. Binary files are files that are not plaintext. Binary files include not
    only programs, but also images, HTML documents, movies, sound files, and some
    system files, among others.


    It is commonly thought that the words *binary file* refer exclusively to executable
    programs. This is not the case, though your Linux system will store programs in
    directories called /bin or /usr/local/bin or /sbin and others. Bin is the abbreviation
    for binary.


    # ## Extensions and Associations


    In Windows, even the earlier Windows 3.1x, various extensions were associated
    with programs. For instance, if you had a program that would open every kind of
    picture format known to man, you would make associations from the extensions .jpg,
    .jpeg, .gif, .tiff, .png, .xbm, and others to this program. Every time you double-click
    on a file with one of those extensions, the program you have associated with it
    will try to open it.


    The same is true for GNOME. (This will **not** work from the command line.) However,
    in GNOME, associations are referred to as "mime types." You can find a list of
    these mime types by clicking on the control center icon (the toolbox) on your
    panel. There is a category labeled “MIME Types” in the control center. If you
    click on it, a list will appear and you will be able to add, edit, or remove any
    of your associations.'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'Some of these mime types are used for interaction with the Internet, so be
    judicious about editing them. Netscape overrides your definitions with its own,
    but other programs may not. If you modify them, you could impair a program''s
    ability to read data.


    Most programs that you install will include their own mime type definitions when
    you install them, so you won''t need to make or edit them very often.


    The extensions are important because this is how GNOME identifies what kind of
    a file you wish to open. If you simply named the picture file of a page or two
    previous “deck” and double-clicked it, GNOME wouldn''t know what program to open
    it with. (It would, however, ask you what you wanted to open the file with.) By
    calling it “deck.jpeg” you tell GNOME that you want to open the file with Electric
    Eyes (or some other image file viewer).


    # Hidden Files


    Files are hidden when you place a period in front of the filename. Many system
    files are hidden because you usually don''t need to edit them or remove them yourself.
    Since you can set access permissions on your files, you don''t need to hide them
    to prevent other users from reading them. Hiding files is useful if you''re not
    going to be using them very much and don''t want to see them in the directory
    listing.


    If you create a file called “test.txt,” you can hide it by renaming it to “.test.txt.”


    # Creating Files


    You have a number of programs at your disposal which will create a number of different
    files for you. GNUMeric, for instance, is a spreadsheet program. GEdit is a text
    editor that will allow you to create your own text files. The GIMP allows you
    to create your own images. To create a file, simply open a file editor (of any
    type), modify the file, and save it.


    # Removing Files


    To remove files from the file browser, you should right-click the file and then
    click on “delete.” There is a safeguard built straight into GNOME called interaction—you
    will have to click “yes” to say that you want to delete the file. This ensures
    that you don''t remove files that you want to keep.'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'Make sure that you really do want to remove a file when you click on delete.
    This action cannot be undone, unless you’ve made a backup somewhere else. There
    is no “Recycle Bin” to save you.


    # Directories


    Users of Windows9x know directories as “folders.” A directory is a term in this
    context that refers to a file listing. The word *directory* has a number of uses
    in computer contexts. It can refer to mailing lists, for instance, or your address
    book.


    # Your Home Directory


    Your home directory is where the bulk of your files will be stored. GNOME will
    store its configuration files in your home directory and the layout of your desktop.
    Enlightenment will store its configuration in your home directory. If you enable
    “profiling” in Netscape, your user profile will be stored in your home directory.
    Any files that you create should be stored in your home directory.


    Your home directory is also relatively unimportant to the operation of the system.
    That means that you can perform a number of experiments on it without danger to
    the rest of the system. And since you probably haven’t installed too much software
    or created too many files, you don’t stand to lose much if you end up removing
    any files.


    Your home directory is located in the /home directory under your username. The
    root user’s home directory is located at /root.


    If you look at your desktop, there is an icon there labeled “home directory.”
    If you double-click it, the file browser will appear and jump straight to your
    home directory. This file browser is very similar to the Windows Explorer, so
    getting used to it should be no problem. It supports a number of different file
    operations (copy, move, delete, properties, etc.) for as little or as much control
    over them as you would like.


    There are also several different styles of viewing—you can choose from a very
    basic icon view to a very detailed view or create your own custom viewing. When
    we look at some of the file properties, you might want to have this window open
    at the same time.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# ## Other Directories


    Obviously many other directories exist. You might create a few yourself to store
    scripts or letters in.


    However, there are also a number of special directories which you should be aware
    of. When we discuss the File Hierarchy Standard, we''ll talk more about these
    directories.


    # ## The Path


    Perhaps one of the harder concepts for users new to the filesystem to grasp is
    that of the *path*. A path is a collection of directories. It doesn''t group the
    directories into a system the way a directory groups files, however. Instead,
    the path is stored in an *environment variable*. An environment variable is a
    setting that is defined every time you log in to the system.


    The path tells the computer where to look for commands. It is tedious to type
    in a directory and the command name every single time you would like to run a
    command, say `/usr/games/Fortune`. It''s far easier just to type “fortune” and
    have an amusing message pop up. What we want to do is add the directory `/usr/games`
    to the path.


    It is important to note that Linux does not search through the current directory
    to find commands. This is a small change from the MS-DOS path convention, which
    will search through your current directory to find commands. When you are in a
    command line interface, you should use the following syntax to run a command from
    your current directory: `./commandname`. The “./” tells Linux that you wish to
    use the current directory.


    We will talk about setting the path when we look at special files on your Linux
    system.


    # ## The Directory Tree


    You will sometimes hear directories referred to as the *directory tree*. The filesystem
    is organized as a directory tree. You might find an apt comparison in your family
    tree, though the directory tree is a little different, since it only requires
    one *parent directory* to have a *child directory* or a *subdirectory*. A parent
    directory may have an unlimited number of subdirectories, for all intents and
    purposes.'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'Each “branch” of your directory tree is separated by a forward slash (/). The
    root directory is the beginning of the directory tree and is denoted by a simple
    forward slash (//). Don’t confuse this with the home directory of the root user,
    which is denoted by /root.


    This means that every directory has at least two names. One is the name that the
    parent directory calls it. For instance, you might create a directory named “test.d”
    in your home directory. Your home directory—the parent—knows the directory as
    test.d, but the system knows the directory as /home/username/test.d. (Username
    is a generic term used instead of your username.) When you attempt to change directories
    within the command line, you usually have to use the system name of the directory
    unless you are in a parent directory of a subdirectory.


    Directories are recursive in nature, so a “grandparent directory” can access some
    child directory by naming first its parent directory and then the child. For instance,
    you found that you needed to add another directory in the test.d directory you
    created a little while ago. You called this one another_test.d. If you are in
    your home directory, you can access the directory you just created by naming it
    as “test.d/another_test.d” (without the quotes, of course).


    When we looked at running commands from the “current directory,” we noted that
    the current directory is given the generic name “./”. Any current directory can
    be called by this name. Any parent directory can be called by a generic name,
    too: “./.”


    The file browser’s GUI (graphical user interface) illustrates the directory tree
    very well, though it doesn’t explain what happens at the system level. When you
    begin to use the command-line interface more, operations at the system level become
    more important. The directory tree will become more familiar then.


    # Hidden Directories


    Directories are hidden the same way files are, and this is usually done for directories
    containing system files. If you prefer to use the text-based e-mail program called
    elm, it will create its own directory in your home directory called “elm.”


    If you wish to hide a directory, rename it and place a period at the beginning.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# **Creating Directories**


    You can create directories in a variety of ways. We’ll discuss the command line
    option later. As discussed when we were customizing GNOME to your liking, you
    can create new directories right on your desktop by right-clicking the desktop,
    highlighting “new” and clicking on “directory.”


    You can also create new directories from the file browser. To do this, make sure
    that you are in the directory you wish to create a subdirectory under. (Note that
    you must have write permission to a directory to create a subdirectory in it.
    Usually you only have write permission to your home directory.) Click on “File”
    at the top and highlight “new.” Click on directory. Supply the pertinent information,
    and a new directory will be created for you.


    # **Removing Directories**


    You can remove directories the way you remove files—right-click the directory
    in question, and click on delete. This is an interactive process—you’ll have to
    tell GNOME that you really do want to delete this directory.


    Again, exercise caution when going about deleting directories—you can’t undo this,
    either.


    # **Mount Points**


    One of the more interesting aspects of Linux is that each mount point is recognized
    as a directory. When you mount a drive or use a partition, you reference it by
    a system directory. In both Windows and DOS, this was accomplished by the use
    of “drive letters.” Every drive is associated with a letter and its own equivalent
    to the root file system on a Linux machine.


    In some ways, this Microsoft invention is convenient. File storage is often-times
    easier to understand and more readable. The advantage of the Linux system, however,
    is that it is completely transparent to the user. This allows you to include mount
    points from almost anywhere—even other computers—without users knowing where the
    files are located. It presents a view of your system that is simple to understand
    and requires little to no outside knowledge of the hardware on your system. This
    is a very specific design principle designed so users don’t have to understand
    much of the system to use it.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# ## Special Files


    Linux makes use of several different kinds of special files. Often you may have
    to modify these files in order to set certain preferences, such as your path.


    # ### RC Files


    The first group of files we should talk about are called “RC files,” named after
    the extension or suffix they usually have. Examples of these files are “.bashrc,”
    “.pinerc,” “.cshrc,” and others.


    RC files usually control preferences for programs or your shell. Pine, a text-based
    mailing program, reads a control file called .pinerc to set preferences, such
    as message width, quoting marks, your real name, your domain name, and a host
    of others. The file .bashrc controls how the Bourne-Again shell (bash) operates
    by setting environment variables such as the path, the terminal type (or emulation),
    user defined aliases and commands, and many other options. (Bash is the default
    shell for Linux users.)


    Let’s examine a sample .bashrc file with a path statement in it and dissect it
    line by line:


    ```

    PATH=$PATH:$HOME/bin::/bin:/usr/contrib/bin:/usr/bin:$HOME:

    $HOME/bin/c:/usr/sbin:/usr/local/bin:/usr/local/lib/interlink/bin:/usr2/home/help/bin:/usr/games

    export PATH

    ```


    When using a variable in a statement, you refer to it using a dollar sign ($).
    When setting a variable, such as PATH, you do not use the dollar sign. So PATH=$PATH
    says, “Set the path equal to what it is already.” This is useful if you don’t
    want to lose the preset path.


    Every directory listed in a path is separated by a colon (:). You specify each
    directory in a path by the full system name.


    The variable for your home directory is called $HOME. This is a preset variable
    that you usually cannot change. When using the command line, the shorthand for
    this variable is the tilde and a forward slash (~/).


    So when we write PATH=$PATH:$HOME/bin, we set the path equal to the old path and
    add on the /bin directory in your home directory. You can break down each of these
    different directories the same way.'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'The export command is one that you can run from the command line, but probably
    won''t very often. For our purposes, we''ll be using it from the .bashrc file
    or something similar, though you can use it to set other variables if you need
    to. What the export command tells the computer to do is to finalize the setting.
    It will ensure that your path is set.


    If you''re not sure of what other directories to put into your path, don''t follow
    the following directions. You will likely figure them out as you become more familiar
    with your system. But you probably don''t need to modify your path in any way.
    When the root user installs more programs, he may have to modify the global path—the
    one assigned to every user if he doesn''t have a path defined in the .bashrc file—so
    that users can make use of the programs he installs. This file is usually located
    in /etc/bashrc.


    To edit your .bashrc file, you need to open up your home directory. More than
    likely, the file browser is not set up to display hidden files, so you will need
    to change the preferences.


    To change the preferences, click on “edit.” At the bottom of the edit menu is
    an option conveniently labeled “preferences.” Click it. The first tab on this
    screen deals with how you display files; click on “show hidden files” to display
    hidden files. Then click OK or Accept and your home directory will probably become
    much more populated. (You can follow this same procedure to stop displaying hidden
    files if you desire.)


    After changing your preferences, a longer file listing will appear. Double-click
    the file called .bashrc. When the window asking you which application to use to
    edit the file appears, you should open the folder labeled “Applications” and click
    on “GEdit.” The GNU Editor will appear with the contents of your .bashrc file
    in it. You may edit this at your pleasure.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_134_0.png)


    The .bashrc file is used only by the Bourne-Again shell, not by any others. Many
    different shells exist (such as the C Shell, the Korn Shell, the restricted shell,
    and so on), and they each use a different RC file to set environment variables
    and other preferences. Since the default shell is bash, we have supplied the method
    for editing its RC file. You may see files like .cshrc or .kshrc in your directory—these
    may be files for other shells.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# Configuration Files


    There are other configuration files as well. These usually have extensions of
    .cfg or .conf. Most of the global configuration files reside in the /etc directory.
    You would find the configuration for LILO here under the filename lilo.conf. If
    you use the lynx web browser, you would find its configuration file under lynx.cfg.


    It is important that you know the existence of these files, but it is equally
    important that you not edit them without understanding the contents of the file
    and what editing them means. If you mess up (the technical term is “corrupt” or
    “FUBAR”) lilo.conf, your computer may not boot properly. Without a boot disk,
    it would be impossible to get into the system.


    Global configurations are found here as well. If your users do not set their own
    paths, for instance, you will find RC files in this directory which provide a
    global path for them. These files are usually not hidden. The global .bashrc file
    is listed under .bashrc, for instance.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_135_0.png)


    The /etc directory contains most of the files your system requires to run. You
    can explore this as both a root user and as a regular user, so use your regular
    user to look at the contents of files (some are not accessible, such as user lists
    or password files) and to poke around. This will minimize the risk of damaging
    any files as your Linux system requires to operate. When you need to modify files,
    use the root user and exercise extreme caution. Make backups of configuration
    files by copying them and adding an extension of .bak.


    # Lock Files


    Lock files are special files used by Linux to see whether you are running a program
    more than once. When you run a program, a lock file is created for that program.
    If you suspend the program or try to start it again, you will be informed that
    the program is already running.


    These are usually stored in the /tmp directory and are deleted when you exit the
    program or kill the process. Your first encounter with a lock file will probably
    come when you use Minicom. If the modem is either in use or hasn''t been reset
    properly, you''ll get a message that says, "/dev/modem is locked" when you attempt
    to start the program.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# **The File Hierarchy Standard**


    The File Hierarchy Standard, or FHS for short, is a system that standardizes the
    names of certain directories that contain important information. The computer
    industry requires more than a little standardization to make up for the differences
    in education of its members. By standardizing where most of the major files go,
    all systems administrators regardless of educational background or understanding
    of Linux or UNIX have a specific map of where files need to go.


    This provides newer administrators a guide by which they can plan the lay-out
    of a system; older administrators will appreciate the regularity of the standard.


    The standard itself is quite lengthy and complicated. We''ll include a brief summary
    of it here, however, and supply further references for your perusal.


    +   - /bin The /bin directory contains program files that are available to all
    users. These are typically considered “essential.”


    +   - /boot The /boot directory contains static files used by the boot loader.
    You may want to create a partition for this directory when you install your system—it
    will add a little extra protection for these files.


    +   - /dev All of your device files are stored in the /dev directory. These range
    from hard drives, to SCS1 devices, the CD-ROM, floppy drive, and many, many others.


    +   - /etc The FHS calls this directory “Host-specific configuration information.”
    It’s where most of your configuration files that are used for the system are stored.
    Both _conf and _rc files are located in this directory. These are usually global
    configurations.


    +   - /etc/X11 Your X-Window System configuration files are stored in this directory.


    +   - /etc/opt When you install commercial programs, their configuration files
    are stored in this directory.


    +   - /home User directories are stored in the /home tree. This is labeled “optional”
    in the FHS, but most users of Linux prefer to have one. If you have a single-user
    system, you may not wish to include it.


    +   - /lib The /lib directory stored shared files and kernel modules. (A kernel,
    as one actor put it, is the “brains” of your operating system.) These files are
    essential. Users usually don’t access these files directly—the programs'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'that they use do. (The **GIMP**, for example, makes extensive use of GTK+ libraries
    stored in this directory.)


    +   - **/mnt** This is the directory for the mount points of temporary file systems.

    +   - **/opt** You usually store commercial programs here.

    +   - **/proc** Process and kernel information is stored in this directory. Some
    users may wish to make a *partition* for this directory.

    +   - **/root** This is the home directory for the root user; it is optional.
    (Most root users don''t get a lot of personal attention.)

    +   - **/sbin** System program files were once stored in the */etc* directory.
    They are now stored in the */sbin* directory (which stands for "system binaries").

    +   - **/tmp** The system will make use of this directory to store temporary files
    and lock files.

    +   - **/usr** Most user files are stored here. The */usr* directory tree has
    a hierarchy of its own. (You can read about it at the FHS web page listed at the
    back of the book.)

    +   - **/var** The */var* directory holds important system information such as
    logs or cached files. The */var* directory also has its own hierarchy which is
    listed on the FHS web page.


    This is just a small summary of the File Hierarchy Standard of organizing your
    file system. You probably won''t have to create any of these directories yourself,
    but the information is useful when you want to add directories to your path.


    When you install Linux, you may also find that some of these files, such as those
    stored in the */boot* directory, are quite vital to your system. Some users create
    extra partitions for these files. (A partition for the */boot* directory would
    need to be around sixteen megabytes.)


    # Using Midnight Commander


    *Midnight Commander* is a text-based file management tool. You probably won''t
    use this too much unless you find yourself using the command line frequently.
    This is an incredibly powerful tool with myriad options.'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'For the moment, you probably only need to concern yourself with the navigation
    principles of Midnight Commander. That alone will allow you to take advantage
    of many different options. It will also allow you easy access to experimenting
    with your system.


    When you start Midnight Commander, you will be presented with a window on both
    the left and right sides of your screen. They are identical. To switch between
    these two windows, press your tab key. You can maintain two different file listings
    at once this way.


    To move up or down in your file listing, use the up- and down-arrow keys. When
    you want to enter a directory, press the Enter key. The parent directory is noted
    by the ../ we spoke of earlier in the chapter; the current directory is denoted
    by ./ .


    At the bottom of the screen, the numbers 0–9 are listed. These correspond to “F-keys,”
    which are the ones labeled F1–F12 at the top of your keyboard. You can use each
    of these F-keys to perform the associated task. (Next to each number is an operation,
    such as copy, delete, view, and so on.)


    To invoke Midnight Commander from the command line, type mc and press the enter
    key.


    # In Summary


    While we haven’t covered every single aspect of the Linux file system, this chapter
    serves as a brief introduction to it. Most users won’t need much more information—others
    may be interested in learning more. You can find a lot of the information you
    seek on the Internet through various pages. Make sure to check the back of the
    book for more information.


    You can always learn more about the file system by experimenting with it. It’s
    usually pretty hard to damage the system when you’re using your own user, so have
    fun and explore a little bit. You can’t remove any files but your own, so don’t
    worry about running around in the file system.'
  merge: -1
  img_proc: true
