- pgno: 192
  md: '# Finding Something in a File


    It is easy to find a word or phrase in your file by using the find command. Just
    click on the find icon to bring up the “find” window. When the find box pops up
    you can type in what you want to search for. You can also check whether you want
    GEdit to search from where the cursor is, or from the beginning or end of document.
    You can also check whether or not you want GEdit to be case sensitive.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_192_0.png)


    **Tip**

    Linux is generally case sensitive. This means that Linux would see Ball.gif and
    ball.gif as two separate files. Most Linux applications make this distinction
    also. It actually comes in handy if you name all your directories with capital
    letters, as they will appear at the beginning of the list.'
  merge: -1
  img_proc: true
- pgno: 193
  md: "# Find and Replace\n\nGEdit also allows you to find and replace things in your\
    \ files. This can be particularly useful when you find you've used a wrong name\
    \ or something in a long file. To begin search and replace, click “edit” and “replace.”\
    \ The window that pops up looks quite like the earlier “find” window. Below the\
    \ line for what you want to search for, however, is a line for what you want to\
    \ replace it with.\n\nPerhaps you've written a long letter to your Great Aunt\
    \ Martha and since you want to borrow a good deal of money from her, you have\
    \ inquired several times about her pet cat. Then, for good measure you've run\
    \ on for a bit about the merits of pet cats. It is only after you're finished\
    \ with the letter that you realize that Aunt Martha has a pet spider. Easy: just\
    \ find cat and replace with spider (never mind the part about spidermip!).\n\n\
    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_193_0.png)\n\n**Figure 10-12**  \n*Find\
    \ and Replace.*"
