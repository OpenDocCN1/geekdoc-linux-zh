- pgno: 72
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_72_0.png)


    # CHAPTER

    4


    # GNOME


    Now that we''ve finished the basic configuration of your system and logged in
    using a personal account, it''s time to start personalizing your experience with
    Linux. At the moment your desktop looks pretty sparse and bland, nothing to be
    excited about.


    In the course of this chapter, you will learn how to make use of the various themes
    that come with GNOME and your window manager, Enlightenment. We''ll have the desktop
    looking much more spruce than it does now.


    We''re also going to learn how to add application launchers to the desktop and
    how to make good use of the panel at the bottom of your screen. We''ll even add
    one if you''d like, and customize the one you''ve already got running.


    But first, you need to know more about exactly what GNOME is.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# **What Is GNOME**

    **(and What Are Desktop Systems?)**


    GNOME stands for "GNU Object Modeling Environment." GNOME is a desktop system
    for the X-Window System. Many other desktop systems exist, but GNOME has moved
    to the forefront of the available options because of its usability and technical
    capabilities. (When you had the chance to install various components, you could''ve
    chosen KDE instead of GNOME. KDE is another desktop system.)


    GNOME is one of the first desktop systems to catapult Linux to a more user-friendly
    level by combining features of both the Microsoft Windows and the Macintosh operating
    systems.


    A desktop system is a program that the X-Window System uses to organize various
    shortcuts and programs. Desktop systems come with different features. GNOME, for
    instance, comes with "paneling" (among other features). Panels are much like the
    Windows 95 Start bar that shows a list of your running programs. It is important
    to realize that the desktop system controls a variety of features. One of the
    more common and useful features employed is the "drag-and-drop" feature, which
    allows you to move a file from your file manager to the desktop simply by clicking
    on it and dragging the icon to the desktop. This feature is fairly commonplace
    in widely used operating systems, but until recently, Linux did not support this
    feature. It was inconvenient at best and incredibly aggravating.


    The desktop system also controls how the desktop looks by using desktop themes.
    There are separate themes in Linux for both desktops and windows; this is a big
    change from Windows, which uses the same theme to control the look and feel of
    both the desktop and your windows.


    Red Hat Linux also comes equipped with a number of window managers in addition
    to the GNOME desktop system.


    # **What Is a Window Manager?**


    A window manager is a program that manages the look and feel of the windows open
    on a desktop. The default window manager for Red Hat is called Enlightenment.
    Others exist; among these are After Step and Another Level.'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'Enlightenment is the most popular, mostly due to its adaptability and ease
    of use.


    We''ll look at configuring Enlightenment later in this chapter. Among the items
    we''ll look at are various window themes, desktop backgrounds, how your windows
    will act, some special effects, sound, and shortcut options that bind some mouse
    clicks to the keyboard.


    You should not confuse window managers and desktop systems. A desktop system manages
    your *desktop environment*. A window manager controls how the windows look and
    act when you interact with them.


    # ## Personalizing GNOME


    Now that you''re using your own account, it''s time to add your own personal touches.
    In this section, we describe customizing GNOME so that you can use different themes,
    backgrounds, or window managers.


    The first step to customizing GNOME is to click on the toolbox on the bottom panel.
    This is the GNOME configuration utility, also known as the control center.


    When the control center pops up, you will notice a nice long list of options on
    the right side. At this point we''re concerned with the category labeled “Desktop.”
    There are four options here: “Background,” “Screensavers,” “Theme Selector,” and
    “Window Managers.”


    See Figure 4-1 for what the control center looks like.


    # ### Background


    To configure the background, simply click on the background option. You will be
    able to use either a solid or gradient colored background, or you can browse for
    pictures on your computer. GNOME can display backgrounds from almost every image
    type, so you won''t have to convert your files to use them for backgrounds.


    Once you have finished customizing your background, hit the “Try” button. It will
    apply your changes so you can see if you like them or not. If you don''t, press
    “Revert” and they''ll be restored to normal. Otherwise, hit “Apply” to keep the
    changes and click “Accept.”'
  merge: -1
  img_proc: true
- pgno: 75
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_75_0.png)


    # Figure 4-1


    The GNOME Control Center.


    If you find another picture sometime that you like on the Internet, you''ll be
    able to change your background. And other backgrounds will be made available with
    new releases of Red Hat Linux, so keep an eye on the upgrades.


    # Screensavers


    You have a lot of choices when it comes to screen savers. GNOME allows you to
    preview the selected screensaver (though some will have problems), so scroll through
    until you find one you like. You use the bottom buttons for screensavers'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'the same way you used them for backgrounds. (Clicking “Try” really won’t do
    anything, however.)


    My personal favorite is Boboule.


    Like the background images, more screensavers are being packaged with Red Hat
    Linux every time it’s released. You’ll want to keep an eye on upgrades and various
    packages that you can download using the GnoRPM utility. (See Chapter Six for
    a discussion of GnoRPM and downloading upgrade files.)


    # ### Theme Selector


    The theme selector allows you to get rid of the rather drab default color scheme
    that comes with GNOME. Make good use of the preview box. You’ll appreciate being
    able to see what each looks like before trying it out.


    You can also use your own font scheme if you’d like. Most themes come with a default
    font in use, but these are occasionally not up to par. Some may be too small or
    simply don’t match very well. Uncheck the “use default font” box if you’d like
    to specify one. (The box below will become active, that is, it will no longer
    be “grayed out.” Click on this box to choose from a list of available fonts and
    sizes.)


    If you’re particularly adventurous, you can also use what are called “pixmaps”
    to further customize the look and feel of your windows. A sample theme called
    “pixmap” comes with GNOME to show you how it looks. (It’s one of my favorite themes,
    incidentally.)


    Make sure to apply and accept the changes you’ve made. You can always try them
    out before you do to make sure you like them.


    The theme selector here will control how your desktop and certain aspects of your
    windows look—but it won’t change some of the features that we’re going to change
    when we configure Enlightenment.


    # ## Window Managers


    In this section you can add, remove, or configure various window managers. Though
    you’ll probably only see Enlightenment in the list, you do have some others. Since
    Enlightenment is the default window manager and probably the best available, we
    won’t worry about the others for now. (If you consult the references list at the
    back of this book, you will find search engines that will find various window
    managers for you. When we talk about system upkeep we also touch on this subject
    again.)'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'What you’ll probably want to do is click on the button marked “Run Configuration
    Tool for Enlightenment.” The new pop-up window allows you to customize how Enlightenment
    works. The screen itself looks like this:


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_77_0.png)


    **Figure 4-2**

    Enlightenment’s Configuration Editor.


    # ## Configuring Enlightenment


    There are a number of categories to choose from that you can use to make modifications.
    Most of these are self-explanatory, but a few do require some comment.


    # ### Desktops


    Your desktop is your working environment—it’s where windows open, where icons
    are placed, and where you interact with the computer. This section is where you
    can modify how your desktops “work”—what properties they have.


    Unlike Windows or the Macintosh OS, the X-Window System makes use of multiple
    desktops. If you examine the panel at the bottom of the screen, you will notice
    that there'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'is a space where there are four squares. If you click on each of them, a fresh
    and likely empty desktop will appear. (It will have its own panel and desktop
    icons, however.) This is what is meant by multiple desktops.


    This is *not* the same as having more than one monitor attached to your computer.
    Some operating systems (Windows included) will allow for “multiple desktops” by
    using another monitor. In Linux, you can have many, many desktops (as many as
    2048!) using only one monitor.


    In the desktops category, you can select the dimensions of your extra desktops—that
    is, will you have a two-by-two grid or more or less? You can also select how many
    layers of these desktop grids you want—up to 32 of them.


    If you want to change between desktops without clicking on the squares below,
    you can enable what is called “Edge Flip Resistance.” When you bring your mouse
    down to the edges of a desktop, it will “flip over” to the next. You can adjust
    the sensitivity with the little bar below.


    # Behavior


    One of the more annoying idiosyncrasies of the X-Window System—at least for those
    who are more familiar with Windows 95 or Windows 98—is the concept of *window
    focus*.


    When you start running a program in X-Windows, the focus isn’t automatically adjusted
    to the program. If you click on the main menu button and then “run program,” you’ll
    notice that you can’t type in a program name unless you click on the window first.
    This is because the focus has not been shifted to the window yet. You’ll have
    to click on it before you can type anything in the window.


    In the “Behavior” window, you will be able to modify how the focus shifts every
    time you “mouse over” (move your mouse over) a window or start a program. Set
    it to your liking.


    # Audio


    If you want to use sound effects while running Enlightenment, click yes; otherwise,
    click no.


    These sounds are relatively elementary, consisting mostly of beeps; users more
    accustomed to the waveform sounds (waveforms are the same as .wav files) of Windows
    may be somewhat disappointed in the array of sounds available.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# Special Effects


    Leaving this customization at defaults is just fine. If you want to enable any
    of the special effects listed here, just click on them.


    # Backgrounds


    Not only will GNOME provide you with the chance to change your back-ground, so
    will Enlightenment. Enlightenment comes with some prepackaged background pictures
    (quite pretty pictures, if I might add my opinion) and some rather simple graphics
    to choose from. You can also use a blank background if you''d like.


    You''ll notice if you use these backgrounds that the one you selected in the control
    center will conflict with the one you select here. If you''d rather use the one
    you selected in Enlightenment, tell GNOME not to use a background at all.


    # Themes


    Enlightenment also provides stylized themes with special cursors and win-dow modifications
    that you can experiment with. Themes can greatly enhance the look of your windows.
    Several come with Enlightenment, but you can get many, many more.


    The prime place for themes is www.themes.org. Themes.org is a wonderful place
    to get absolutely free and stunningly gorgeous themes. The site is packed with
    other graphics information, too, so if you''re looking for development infor-mation,
    you''ll be able to find it here, too.


    If you''re interested in installing new themes, look at Chapter Six, which talks
    about maintaining your system. Read the section entitled, “Adding Eye Candy.”


    # Shortcuts


    Enlightenment also offers several command-key shortcuts that you can mod-ify,
    add to, or remove. If you find using mice rather pesky and annoying, you might
    *bind* a few commands to shortcut keys. (For instance, a default shortcut is to
    use Alt-F1 to move to the first desktop. Alt-F2 will move to the second, and so
    on.)'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# # Finishing the Configuration


    After you''ve finished modifying Enlightenment''s configuration to your liking,
    accept the changes and close it out. This covers much of your personalization
    of the GNOME desktop system, but we''ve still a few more subjects to consider.


    # # Adding Desktop Applications


    If you made certain disks user-mountable, you noticed that new icons appeared
    on your desktop. If you want to add your own, you should right-click on the desktop.
    Mouse over to “new” and click on “launcher.” A *launcher* is the Windows equivalent
    of a shortcut.


    After clicking on ‘launcher,’ a new window will pop up. You should see two tabs,
    one labeled “basic” and the other “advanced.” You won''t need to make any changes
    to the advanced tab. In the basic tab, you should fill in the categories appropriately.


    +   * **Name** *Type* in the name that you want to show up on your desktop. This
    doesn''t need to be the actual command name.

    +   * **Comment** *Type* any comments here that you have about the launcher.

    +   * **Command** This is where you''ll write the command line for the program.
    If the program is in a directory in your path, just type in the command; otherwise,
    you''ll need to specify a path. (Since we haven''t covered the Linux file system,
    we haven''t really discussed paths yet. Don''t worry if this sounds confusing.)

    +   * **Type** You are creating either a directory or an application launcher.
    If you want to run a program, switch this from directory to application.

    +   * **Icon** The X-Window System comes with a variety of icons pre-installed.
    You can choose from them or from one that came with the program.

    +   * **Run in Terminal** If this program is a text-based program, you should
    *enable run in terminal.* Otherwise, leave this unchecked. (Unchecked options
    are usually gray.)


    # # Customizing Your Panel


    Some users prefer to leave their desktops relatively uncluttered and would rather
    include these programs either as *applets* (small applications) on their panel
    or as launchers on their main menu. This process is fairly simple and'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'might be considered if you really don’t like all of those icons on your desktop.
    There are many, many ways of modifying your panel. They are highly customizable.
    We’ll cover some of the basics here and point you in the direction of more resources.
    We would like to be able to add applets and applications to the panel. It’s sometimes
    also nice to have more than one panel on the screen to avoid clutter. And you’ll
    also probably want to change its position or make it hide when your mouse isn’t
    hovering over it.


    # Changing the Main Menu


    The main menu comes preset with several different applications built into it.
    However, over the course of your use of Linux, you will likely download or install
    many other applications. It is obviously somewhat tedious to click on the main
    menu, then “run program” every time you want to use them, so we want to be able
    to add them to the main menu (or perhaps to the panel itself). Doing so is very
    simple. Click on the main menu, and go to the submenu labeled “Settings.” There
    is a program listed called “Menu Editor.” Click it. Using the menu editor is fairly
    simple. There are essentially two kinds of menus available—the system menu and
    the user menu. Unless you are logged in as root, you will not be able to modify
    the system menu. (Modifications to the system menu affect all users.)


    You will notice several buttons at the top of the screen which will allow you
    to add a submenu and launchers to your menu. Simply click their respective buttons
    and fill in the pertinent information. The information is exactly the same as
    the information you would supply for adding launchers or directories to your desktop,
    and the format is similar.


    After you finish filling in the information, click the save button at the bottom
    of the form. This is very important, since the new submenus and applications are
    not automatically added when you close the program. You must save them first.


    # Adding (or Removing) More Panels


    If you so desire, you can add more panels. There are two types of panels: *edge
    panels* and *corner panels*. Edge panels will take up the entire edge of your
    screen; corner panels will take up more space as you add more applets or launchers
    to the panel.'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'To create a new panel, right-click on one of your existing panels. Click on
    “add new panel” and select either a corner panel or an edge panel. It will automatically
    orient itself on your screen, and it will have nothing in it. We’ll learn how
    to put stuff there momentarily.


    If you find that the new panel is inconvenient or has lost its use, simply right-click
    that panel and find “remove this panel.” Click that, and it’s history. Unfortunately,
    you cannot recover panels, so be careful when removing them. It’s usually not
    a whole lot of work to put them back together, but it can be annoying. Initially,
    you cannot remove the first panel, since one must be running at all times. Once
    you add a panel, however, the default panel can be deleted. It’s not a good idea
    to delete it.


    # ## Adding and Removing Applets


    *Applets* are simply “small applications” which run directly on the panel. You
    can use applets to monitor system usage, the time of day, or to provide eye candy
    and other pointless wastes of system resources and your time. (Helps writer’s
    block, though.)


    To add an applet, right-click on the panel you want to add it to. Find the “add
    applet” submenu and mouse over it. Four or five different other submenus will
    appear. You can add a variety of applets from these menus. Experiment with them
    and decide which you need and which you don’t.


    To remove any applet, simply right-click the applet and click “remove applet”
    from the submenu.


    A personal preference is the “Life” applet, which plays the game of life (not
    the board game, but the colonization game) right on panel. It can provide hours
    of entertainment in addition to becoming a convenient distraction when you have
    better things to be doing (such as writing a book, for instance).


    # ## Adding Launcher Applications to Your Panel


    To add a launcher to your panel, right-click the panel. Then click on “add launcher.”
    The same screen will appear that came up when we added a launcher to the desktop;
    you can follow the exact same steps to fill in the information as provided above
    in “Adding Desktop Applications.”


    Remove a launcher the same way you would remove an applet; right-click the launcher
    and click “remove launcher.”'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Adding Drawers to Your Panel


    If you have a number of applets or launchers on your panel that go together, you
    can create a *drawer* for them to go in. To create a drawer, you simply right-click
    the panel and click "add drawer."


    A new screen will appear which asks for information about the drawer. You should
    fill in the fields appropriately, since all drawers have the same default icon.
    If you don''t provide a name or comment for the drawer, when you mouse over it,
    nothing will appear and you may not know what''s contained in it.


    To "open" a drawer, click on it. A submenu of sorts will appear with all of the
    applets or launchers in the drawer. At the end of the drawer is an arrow; you
    can "close" the drawer by clicking on this arrow or on the drawer itself.


    Drawers, like panels, have properties you can change. They are similar to the
    properties of a panel, so we''ll look at them at the same time. To change the
    properties of a drawer, right-click the drawer icon and click on "properties."
    You can remove a drawer by right-clicking on it, too.


    # Changing the Properties of Your Panel


    Panels have a variety of properties associated with them. We''ll look at a couple
    here. To change the properties of a panel, click on the panel. Near the bottom
    of the submenu is an option called "this panel properties." Click on it (make
    sure that you don''t change the global properties yet).


    Your panel can operate in a number of ways. At the end of your panel are two arrows.
    These are called *hidebutton arrows*. When you click them, the panel will disappear,
    leaving an arrow behind that you can click on that will allow you to expand the
    panel again. However, these arrows take up space, and when you maximize windows,
    they will not cover the arrows.


    If this poses a problem, you can remove the check in "enable hidebutton arrows."
    You will still be able to collapse your panel, but there will no longer be arrows
    available. Instead, you''ll simply have a couple of buttons on either end, thinner
    than the arrows. (So they''ll take up less space.)


    You can also have your panel "hide" when your mouse pointer is moved off of it.
    This will create more space on your desktop.


    You may also want to change the orientation of your panel. To do this, you can
    either modify the position from the properties or use your middle mouse button.
    (If you chose to emulate a three-button mouse in your installation, you'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# 4 GNOME


    should click on the left and right mouse buttons simultaneously instead.) To move
    it with the mouse, click on the panel with the middle mouse button and move it
    to the location you desire. Otherwise, modify the properties and click on the
    location you want.


    When you''re done, press the "apply" button and then click "OK."


    # Modifying Global Panel Properties


    You should have noticed when you right-clicked your panel that there was an option
    to modify global panel properties. These are properties that apply to all panels,
    regardless of their position, type, or make up.


    Most of these are self-explanatory and likely tangential to your understanding
    of how to use GNOME. If you want to further customize your panels, however, you
    should use the options here. You will be able to modify how your icons look when
    depressed, how much space a hidden panel will consume on the screen, and other
    such properties.


    # Changing Drawer Properties


    Changing drawer properties is very simple. The properties are almost exactly the
    same as panel properties. If you right-click a drawer and then click on "properties,"
    a menu will appear with all sorts of fun goodies to play with.


    You''ll notice the same information that you input when you created the drawer;
    you can change this if you like. You can modify the hide/button arrows for your
    drawer as well.


    # All Done!


    Well, you''ve successfully navigated through most of the major points of personalizing
    your experience with GNOME. Now it''s time to start configuring your machine for
    use with your hardware, like your modem and your printer. We''re also going to
    examine other systems administration tasks, such as adding accounts and using
    the Linux Configurator. After that we''re going to examine the file system and
    how to manage the many files that will seem to spontaneously appear on your computer,
    and then look at the command-line interface.'
  merge: -1
  img_proc: true
- pgno: 85
  md: <!-- no content -->
