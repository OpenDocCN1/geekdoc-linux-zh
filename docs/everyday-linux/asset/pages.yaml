- pgno: 312
  md: '# Tracking Time with GNOME Time Tracker


    GTimeTrack is a useful tool for keeping track of the amount of time you spend
    on various projects.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_312_0.png)


    Figure 16-14


    To begin using GTimeTrack you must create a project file. Click on the “new” icon
    and you will be asked to name your project. Give it a name and then click “ok.”


    You can add additional information about your project, as well as log in the time
    you spent on the project each day, by clicking on “props.”


    Fill in a brief description of the project and then fill in the amount of time
    you spent that day. Click “apply.”


    You can use the timer on GTimeTracker to keep track of the time you spend on your
    project. Just click the “timer” button to start the timer. When you are through
    and want to add up your time, click “file” and “save configuration file.” You
    will see the time added to the previous amount of time spent.


    GTimeTracker allows you to enter as many projects as you like. When you have multiple
    projects you need only select the one (by clicking on it) you wish to track time
    on and then click on “timer.”'
  merge: -1
  img_proc: true
