- pgno: 189
  md: '# Fonts and Styles


    As of this publication, GEdit will not allow you to use more than one font or
    style in a file. Though it’s possible this will change in future releases, GEdit
    is intended to be a text editor rather than a word processor.


    To change the font that is being used, click “settings” and “preferences.” From
    the preferences window, click on the “document” tab. You will see the font listed
    that is currently being used. To change it, click “select.” From the font selection
    window, you can choose a font and its style, such as bold or italic. On the right,
    you can choose the size of the font. On the bottom of this window, you can see
    an example of what the font looks like and how large it will be. When you have
    selected a font, click “ok.” This will change all existing and future text to
    this selection.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_189_0.png)


    **Figure 10-7**

    *GEdit Preferences.*'
  merge: -1
  img_proc: true
- pgno: 190
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_190_0.png)


    Figure 10-8  *Selecting a Font in GEdit.*


    # # Spell Checking Your File


    GEdit provides an easy way to spell check your file. Click “plugins” and “spell
    check.” GEdit will pop up a spell check window and list misspelled words as it
    finds them in the file. It will list a word and then list an alternative spelling
    suggestion. To the right are the actions you can take. If you want to replace
    the word with one of the alternatives, just click on the alternative and then
    click “replace.” If you want GEdit to accept the word as a correctly spelled work,
    click “accept.” If you want an incorrectly spelled word to just be ignored, click
    “skip.” If there are no alternatives, and you know the correct spelling of a work,
    click insert and type in the correct word.


    You can set some preferences with GEdit’s spell check by clicking on the config
    ure tab of the spell check window. In the special configuration window you can
    specify minimum number of letters in a word to check, special characters in words
    to ignore (such as @ in e-mail addresses,) and other parameters.'
  merge: -1
  img_proc: true
