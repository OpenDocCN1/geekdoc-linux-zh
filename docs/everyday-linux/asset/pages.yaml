    synopsis of some of the commands:


    +   - **open (-u) [server]** The open command will open an FTP connection to the
    server that you specify. For instance, you can use open ftp.ccil.org to open an
    FTP connection to that server. The -u option tells NCFTP that you want to specify
    your own username instead of using the anonymous user. This is useful if you''re
    connecting to an FTP server on which you have an account.

    +   - **close** When you''re done with the FTP session, you can close it. This
    won''t close the program itself, just the connection, so you can connect to other
    FTP sites with the open command.

    +   - **quit** When you''re completely done with all of your FTP sessions, use
    the quit command to close the program. If you are connected when you type in quit,
    NCFTP will disconnect you.

    +   - **get, mget [filename]** The get command will download files from a server.
    If you want to get more than one file at once, you must use the mget (multiple
    get) command.'
