- pgno: 194
  md: '# Faxing


    There are several fax programs in use for Linux, but most of them are front ends
    to the basic fax programs. The fax program works on a command line and can be
    a bit cryptic, which is why the front ends are there. Ksendfax is a nice “point
    and click” front end to fax and we will cover that.


    The efax rpm package is the easiest way to get the fax program installed, and
    it is possible you already have it installed. You can check to see if efax is
    installed by bringing up a terminal (such as xterm) and typing:


    ```

    rpm -q efax

    ```


    If efax is installed, you’ll get back something like:


    ```

    efax-0.9-4

    ```


    If it is not installed, read our chapter on adding programs and using GnoRPM to
    find and install the package. You also want to have ksendfax installed, so check
    to see if it is and if not, then install it.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_194_0.png)


    Figure 10-13 Ksendfax.'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'Ksendfax uses your modem, of course, to send a fax. By default you need to
    be root to access the modem, so from an xterm or other terminal, enter the following
    to start ksendfax as root:


    ```

    su -c ksendfax

    ```


    Click “options” and “preferences” and add the following line to the “Send Fax”
    field. You will only need to do this one time.


    ```

    fax send ''@@Phone'' ''@@FName''

    ```


    When you have added the line, click “ok.”


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_195_0.png)'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# # Sending a Fax


    You should save whatever file you want to send as a fax as a text file. From the
    main ksendfax window, either type in the name of the file you want to send (including
    path) or click on the browse button to move through directories and find your
    file.


    In the box for “Fax no.” type in the telephone number with area code. If you wish,
    you can fill out the other boxes for Dest. Name and so forth. You only need to
    give ksendfax a phone number.


    When you are ready to send the fax, click on the send fax icon, which is the small
    envelope icon at the top of the window. If you are unsure which icon, just hold
    your mouse over the icon for a few seconds and a small box will appear with the
    name of the icon.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_196_0.png)


    **Figure 10-15**

    Selecting a File to Fax.'
  merge: -1
  img_proc: true
