    \n**Figure 18-5**  \n*Fuzzy Icon*.\n\nBeziel Select—selects odd-shaped area by\
    \ clicking and moving the mouse.\n\n![](img/92fb6d8ad19de3b3470ba95c7b71b82e_329_1.png)\n\
    \n**Figure 18-6**  \n*Beziel Icon*.\n\nIntelligent Scissors—is yet another selection\
    \ tool, but is not fully developed in the current version of GIMP.\n\n![](img/92fb6d8ad19de3b3470ba95c7b71b82e_329_2.png)\n\
    \n**Figure 18-7**  \n*Intelligent Scissors*.\n\nMove—allows selected area of an\
    \ image to be moved.\n\n![](img/92fb6d8ad19de3b3470ba95c7b71b82e_329_3.png)\n\n\
    **Figure 18-8**  \n*Move Icon*.\n\nZoom—allows zoom in and out of an image. Left-click\
