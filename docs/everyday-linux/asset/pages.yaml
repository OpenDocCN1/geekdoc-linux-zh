- pgno: 209
  md: 'First, you might want to give Star Office some information about yourself,
    as it uses this information as defaults in some templates. Pull up the options
    dialog window and click “general” and then “user data.” Fill in the areas on the
    right with your personal and professional information.


    Tell Star Office where you want to keep your projects folders. By default, Star
    Office will keep them in the desktop’s “Work” folder, but you may keep them anywhere
    you like. To specify a location, in the options dialog window, click “general”
    and then “paths.”


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_209_0.png)


    # **Figure 11-11**

    *Star Office Options.*


    In the default window in the right, click on “my documents.” Now click on “edit”
    below and you will be able to type in a path. I simply use a documents directory
    in my home directory, so my path would be /home/kmiles/documents. Note that I
    had to first create the “documents” directory. Once you type in the path where
    your work will be saved, click “default.” This will make Star Office always look
    in this folder when you want to save something. You can also change the paths
    of other functions.


    Another option you might want to configure would be mail if you want Star Office
    to send and retrieve mail.


    To configure mail, pull up the options dialog window and choose “internet” and
    then “mail/news.” You need an Internet service provider in order to have email.
    You will also need to know what the incoming and outgoing mail servers are for
    your provider. Ask the help desk of your provider if you are not sure what'
