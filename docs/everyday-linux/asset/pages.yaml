    # Netscape


    Netscape for Linux is almost exactly the same as it is for Windows. The look and
    feel is just a little different, but the preferences and other properties are
    fundamentally the same. For that reason, we won''t cover too much material with
    Netscape other than setting up mail and news preferences.


    To configure Netscape Mail and News, you first need to open up Netscape. When
    it has finished loading, click on the top menu item labeled "edit." Then click
    on the menu option "Preferences." This will open the preferences window in Netscape,
    which is where you can change what your mail options are.


    There is a rather long list of preferences. We simply want to look at the mail
    and newsgroup preferences for now. Figure 9-1 shows the preferences menu with
    the options open to mail and news groups. The first item we want to look at is
    configuring the mail servers.


    # Netscape Mail


    When you look at the mail preferences, there are essentially four different areas
    that you need to fill in. One is the incoming mail server. You also need an outgoing
    mail server. Finally, you should fill in your username and password.


    **Incoming Mail Server**—The incoming mail server usually operates using a POP3
    or IMAP protocol. You might see "POP server" instead of incoming mail server used
    in some versions of Netscape or during your travels on the World Wide Web. The
    incoming mail server is the server that receives your e-mail.


    What this means in plainer English is that there is a computer used to receive
    e-mail from the Internet. This is known as the incoming mail server, and it will
    store your e-mail until you pick it up and delete it from the server. It is essentially
    a post office with many different post office boxes. When you check your e-mail,
    your username acts as the post office box number and your password acts as the
    key. You take your mail out of the box, close it, and lock it. This is the computer
    equivalent to downloading your mail and logging out of the incoming mail server.'
  merge: -1
