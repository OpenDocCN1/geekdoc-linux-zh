- pgno: 333
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_333_0.png)


    *Pencil*—allows you to draw freehand. You choose the size or type you want from
    the brush dialogue window. To access this, right click over the image, then “dialogues”
    then “brushes.” Pencil color is by default the foreground color.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_333_1.png)


    *Brush*—GIMP comes with a good selection of brushes and there is an immense selection
    which you can add on. If you double-click over the brush icon, an option window
    will appear which will allow you to select the amount of fade to paint with. It
    is just a small window with a slide bar to choose degree of fade and an option
    to choose incremental fade.'
