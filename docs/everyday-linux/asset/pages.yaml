- pgno: 106
  md: 'Linuxconf is organized into two sections: config and control. The config section
    allows you to modify the configured status of your system. The control section
    allows you to perform several actions on components on the system. Most of your
    configuration will be in the config section, so we cover only subtopics under
    that section here. The control section is more or less self-explanatory when you
    go through each of its operations.


    Obviously this is not a step-by-step guide of how to use the Linux Configurator.
    Experimentation with Linux is one of the best ways of learning how to use the
    system, and the sheer number of tasks you can perform with linuxconf makes writing
    a simple guide to it nearly impossible.


    # Networking


    Typically you won''t have to make many changes to the networking section. If you
    switch ISPs or find that your current network data is outdated, some of the settings
    will need to be changed. These are typically service-dependant, however, so you
    will need someone from technical support or the network administrator to help
    you with the changes.


    One other item that you may find convenient to change in this category is the
    hosts file. If you find that you''re accessing another system frequently using
    a telnet prompt or something similar, you can add an entry in the hosts file that
    will make an "alias" of sorts. Then you could use some shorthand abbreviation
    for that system. For instance, I have a line in my local hosts file that reads


    ```

    164.107.42.62  stdsun    stdsun.cis.ohio-state.edu

    ```


    Rather than typing in "stdsun.cis.ohio-state.edu" every time I want to access
    the system, I can type in "stdsun" instead.


    # Users Accounts


    If you encounter the need to trim the number of users on your system, expand or
    limit access privileges, or disable accounts for whatever reason, you''re going
    to do it all from here. You will also be able to add users to different groups
    or even create new groups for them to become a member of. And, of course, if your
    system grows, you''ll add users from here, too.'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'By editing user preferences, you can set the command interpreter (shell), the
    days until the account expires (useful if someone simply needs to grab files from
    your computer remotely), how long until the password expires, and so on.


    # File Systems


    Most of the information that you’re going to be concerned with here will be related
    to mounting and unmounting drives or adding new ones. Unless you’re on a LAN,
    you won’t need to use the networked file system (nfs) volume settings.


    From here you will be able to mount and unmount drives, set file system quotas
    (so that users cannot exceed a certain amount of space in their personal directories),
    and work with your swap and other partitions. (You will notice its analogue in
    the control category, labeled “Mount/Unmount Filesystems.”)


    # Modifying Boot Loader Properties


    It’s usually suggested that you not modify the boot loader properties, since doing
    so can result in an unbootable system. However, you might become relatively bored
    of the labels “linux” and “dos” to boot parts of your system, or using a boot
    disk may simply become troublesome.


    If you modify the boot loader, you’ll have a couple chances to back out of making
    changes if your courage melts like wax once you’ve finished. If you do make changes,
    however, and they result in an unbootable system, make sure that you have a boot
    disk on hand. It will also help if you have an installation CD for your other
    operating system (if you’re dual booting).


    In this section, I won’t go into any procedures for installing LILO (if you didn’t
    install it to begin with). But I will talk about a couple of the terms you’ll
    run into.


    One of them is the *boot image*. The boot image is the information that LILO will
    use to boot into Linux. Normally, the boot image for Red Hat is stored in /boot/vmlinuz.
    (So when presented with the option for an image, this is the value you’d put in.)


    Another important term is *master boot record*. This is the first sector on the
    primary master hard drive. Installed in this sector is a very small program which
    tells the computer a little bit about the operating system(s) on the computer.
    It is into this sector that the boot loader (LILO) should be installed. Normally
    the'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'master boot record (or MBR for short) is on the partition /dev/hda. When asked
    where to install the boot loader, that''s the partition you should choose.


    You can also configure LILO to boot into other operating systems besides Linux.
    There are two separate subtopics under the boot loader section for boot-ing into
    a Linux system or an “other” system. You will need to know which par-tition the
    other operating system is installed on to boot from it.


    The *label* associated with a drive is the label that you’ll type at the LILO
    Boot: prompt that appears when you start your computer. For instance, the default
    label for your Red Hat Linux system is “linux.” When the LILO prompt appears,
    you’ll type in “linux” to start the Linux system. The default Windows label is
    “dos,” and that’s what you’ll type when you want to get into the Windows system.
    You can change these labels to a more inventive nomenclature if you’d like.


    # Leaving the Linux Configurator


    When you’ve finished making modifications in linuxconf, you should click on the
    “quit” button below the list on the left. When you do this, a new page will appear
    on the right, telling you that the system is out of sync with the present configuration.
    Linuxconf will then offer to rectify the situation.


    To accept its offer, click on the “activate changes” button. Once the changes
    are activated, linuxconf will exit. If there are any errors during the synchron-ization
    of the system, you’ll be notified and given the chance to review them. Depending
    on the nature of the errors, you may be asked to take some action to fix them,
    which usually involves either skipping a command or killing a process.


    # Maintaining the System


    These activities are largely confined to initial systems administration and some
    relatively basic maintenance activities. Performing upgrades and other miscel-laneous
    systems maintenance is covered in the next chapter, where you’ll learn about backup
    systems, adding eye candy to your computer and configuring additional devices
    you might add to your computer. The next chapter will also be the first time you
    use the su command and the command-line, though the full-blown introduction to
    the command-line won’t appear until Chapter Eight.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Before We Go On


    You''ll want to log out of the root user account. Since your personal account
    has been added to the wheel group, you won''t need to use the root account as
    much as you used to. When you''ve logged out of the root user account, you should
    log back in using your personal account, unless it''s time for a break. The next
    chapter is mostly conceptual information, but the following chapter will introduce
    you to working with your files.'
  merge: -1
