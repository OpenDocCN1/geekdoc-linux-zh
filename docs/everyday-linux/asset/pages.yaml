- pgno: 300
  md: '# CHAPTER

    16

    Scheduling and Productivity


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_300_0.png)


    In this chapter we will cover some various miscellaneous programs which can add
    to productivity. They are assorted utilities for calculating, notetaking, scheduling
    and so forth. We think you will find them useful.


    # GNOME Calculator and Kcalc


    GNOME provides a calculator with a good variety of functions on it. To open it
    click the GNOME foot, and then from the utilities menu click “simple calculator.”
    One advantage of the GNOME calculator is that you have the option under “file”
    to “copy.” This copies whatever is in the display window. You can then paste the
    value into an editor and print.


    There is another calculator under the KDE menus in utilities. We liked this one
    better because you can configure a few things, but both calculators work very
    well.


    To configure Kcalc, just click on the Kcalc button to the left of the display
    screen.'
  merge: -1
  img_proc: true
