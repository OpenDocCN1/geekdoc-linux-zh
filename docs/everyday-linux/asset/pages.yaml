- pgno: 321
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_321_0.png)


    Figure 17-6

    Editing Toolbox.


    # Xpaint


    Xpaint is a drawing program as well as a basic image editor and it is found under
    the Another Level menus. Xpaint is best used for doing simple diagrams and drawings,
    though it is quite capable of loading large images.


    To begin a drawing, click once and hold on “file.” Then choose “new canvas” or
    “new with size” if you want to specify size. You may open an existing drawing
    or image by choosing “open” or, if you have an image in the clipboard, choose
    “load clipboard.”


    When the image is opened a toolbar will appear at the bottom and top of the screen.
    The bottom of the screen contains color palettes. If you have a three-button mouse
    you may make use of the middle button as a second color. Using the left mouse
    button, choose a color on each palette. When you paint or use a filled shape feature,
    you may use the middle mouse button to get your second color.


    Xpaint offers some image enhancement features under “filter” and some resizing
    and crop features under “image.” From the original window you can'
  merge: -1
  img_proc: true
- pgno: 322
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_322_0.png)


    **Figure 17-7**

    *XPaint*


    change tools, choosing from a brush, airbrush, straight line, shape, etc. Double-clicking
    on the brush, airbrush, text, and fill tool icon will allow you more choices for
    that tool.


    Mistakes may be corrected in two different ways. If you have made a small mistake
    you may simply choose “undo” under “edit.” If you’ve really bungled the project
    and want to start over again from the original (if there was one), you may choose
    “file” and then “revert.” When choosing revert, the window you have been working
    in will close (without saving) and a new window will pop up with the original.


    When you are finished with your image or drawing, click “file” from the image
    window and then “save” or “save as.”


    Additional drawing programs are part of both StarOffice and GIMP. See the respective
    chapters for more information.'
  merge: -1
  img_proc: true
