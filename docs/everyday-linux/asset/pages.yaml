- pgno: 182
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_182_0.png)


    # CHAPTER

    10


    Text Viewers

    and Editors

    for Linux


    There are times when you don’t need a big full-featured word processor to write
    a simple text file. There are a number of very good text editors, some of which
    have some very useful features. It’s a matter of personal preference as to which
    one you use. Since some of these programs have the same features, we thought it
    would be convenient to define what they are at the beginning rather than be repetitious.


    # Common Editor Features


    +   **Open**—opens a file, generally limited to .txt and .html files.

    +   **Save**—saves the file you currently have open.

    +   **Save as**—will allow you to save the file under a different file name.

    +   **Close**—closes the file you have open. Most programs will prompt you to
    save any changes you have made.

    +   **Exit**—closes the entire program and all opened files. You will be prompted
    if there are any unsaved changes to files which are open.'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'Print—prints the file that is open if you have a printer configured.


    Cut—removes whatever text is highlighted.


    Copy—copies selected text into a buffer so that it may be pasted elsewhere.


    Paste—inserts whatever text was copied to a buffer. This will usually work between
    programs, meaning text copied from one program can be pasted to another program.


    Find—finds a text pattern or phrase in a file.


    Find Again—locates additional occurrences of a specified text pattern or phrase.


    Replace—finds one pattern and replaces it with another.


    Select All—selects all text in file.


    Undo—undoes previous operation.


    Redo—cancels whatever change was undone.


    Word Wrap—will automatically move the word to the next line when the last word
    of a line is too long. This prevents a word from being "chopped" in two.


    New Window—opens a new window of the program.


    # Text File Viewer


    Text File Viewer is found under the main GNOME menus in the Utilities sub-menu.


    Text File Viewer is at this time strictly for viewing text and html files. It’s
    a "no frills" program, but it opens, displays and saves files quickly.


    There are only a few features with this program. You cannot edit files or change
    them in any way except to save them under a different file name. It does allow
    you to find words, letters or even phrases in a file.


    You are also able to open up multiple windows, which can make comparing several
    files much easier.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_184_0.png)


    Figure 10-1

    Text File Viewer.


    # # Advanced Text Editor


    The Advanced File Editor (also known as Kwrite) can be found by choosing “KDE
    menus,” then “applications,” and then “Advanced Text Editor.” Kwrite will open
    text (.txt) and .html files.


    The program is very intuitive and similar in layout to the other text editors
    we talk about. There are pop-down menus for file, edit, bookmarks, options, and
    help. There is extensive documentation if you choose “contents” under help.


    Kwrite has all of the common features mentioned previously plus some additional
    ones.


    One of the features which we found very useful was bookmarks. This feature allows
    you to mark areas in a file. The bookmarks are not saved with the file, so they
    are lost once the file is closed.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# # GEdit


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_185_0.png)


    It could well be argued that GEdit is closer to a full-featured word processor
    than it is to a text editor. GEdit can be found in the main GNOME menu under "applications."


    GEdit has all of the features mentioned at the beginning of this chapter, plus
    many more you will likely find useful. GEdit will open .txt and .html files. The
    program will open multiple files, and they are listed to the left of the main
    window. To access the files listed on the left, just click on the file name.


    GEdit has some additional features worth mentioning. Most of them are under the
    menu heading "plugins."'
  merge: -1
  img_proc: true
- pgno: 186
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_186_0.png)


    # Figure 10-3


    GEdit.


    If you need to know some statistics about a file, click “Plugins” and then “word
    count.” A small window will pop up and tell you the number of characters, words
    and paragraphs.


    There are plugins for spell check, version control and browse (for HTML files).


    A very useful feature of GEdit is “find in files.” This will search multiple files
    (whichever ones are open at that time) for a phrase or word. As an example, we
    took three files and searched them for the word constellation.


    GEdit will split the window and then list the occurrences where it found the word
    or phrase it was searching for. It will list the file it found it in, plus the
    line number and sentence. It will also list total number of times it found what
    it was looking for.


    If you make multiple errors in a file, you might find the “revert” feature under
    “file” useful. Revert will pull up the most recently saved version of the file
    you have been working on.


    Because GEdit is an open source project, it is likely that even more features
    will be added to the program over time.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# ## Opening and Saving Files in Gedit


    To open a file in GEdit, just click on the “open” button. Using the pop up window,
    you can move around your directories and choose a file to open. Then click “ok.”
    Your file will be opened in a GEdit window and you can edit it. To work on a new
    file, just click “new.”


    When you are through editing your file you will want to save it. If it is an existing
    file and you want to keep the same file name and format, just click “save.”


    If you want to save your file under a different name, click “file” and “save as.”
    With the pop up window, you can give your file a new name.


    There are no automatic file extensions in GEdit, you must type in the extension
    you want to use, such as .txt or .html. For example, if you opened a text file
    and then added html tags for use on a website, you would want to save it as html.
    Just use the “save as” window and give the file name an html extension rather
    than .txt.'
  merge: -1
  img_proc: true
