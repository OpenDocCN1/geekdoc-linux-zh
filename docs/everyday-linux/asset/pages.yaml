  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_285_0.png)


    If the file you select to open is not a WordPerfect file, you will be asked to
    provide a “filter” to open it with. This just means you need to tell WordPerfect
    what type of file you want to open. It might be a text file (.txt), or it might
    be an HTML file. WordPerfect will also open files from Windows’ word processors.
    Unfortunately, WordPerfect cannot open StarOffice documents.


    When you want to save a file you have the option of saving it under the original
    filename (if it had one) or choosing a new filename. To use the old filename,
