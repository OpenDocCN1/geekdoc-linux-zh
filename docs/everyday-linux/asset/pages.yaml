- pgno: 165
  md: 'At present, the only major web browser available for Linux is Netscape Communicator.
    (The browser is actually Netscape Navigator, which usually comes in a package
    with Netscape Communicator. The Communicator is a suite of tools.) The makers
    of Opera are hard at work at finalizing a release of Opera for Linux, however.
