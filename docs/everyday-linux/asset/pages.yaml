- pgno: 334
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_334_0.png)


    # Figure 18-21

    Brush Icon.


    To choose the size and type of brush you want you must right click over the image
    then choose “dialogues” and then “brushes.”


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_334_1.png)


    # Figure 18-22

    Brush Selection.


    There are calligraphic brushes, fuzzy and sharp edged circles of various sizes,
    as well as an assortment of other patterns you may “paint” with. Once you choose
    the brush you want, you may set parameters for mode, opacity and spacing. If in
    doubt of these options, just try the defaults.


    Eraser—works opposite pencil and brush, removing areas. Choose size of area to
    be removed by using the brush dialogue window. You may also choose whether you
    want a hard or incremental edge to the eraser by double clicking on the eraser
    icon.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_334_2.png)


    # Figure 18-23

    Eraser Icon.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_334_3.png)


    # TIP


    > If you are working on an image with layers, the eraser will only remove areas
    from the layer on top, thus revealing the layer beneath.'
  merge: -1
  img_proc: true
- pgno: 335
  md: '**Airbrush**—I used to do a lot of scenic oil paintings and I soon found that
    I could achieve almost the same results digitally by playing with the airbrush
    tool on GIMP.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_335_0.png)


    What makes this tool so maneuverable is that if you double-click on it, you will
    get a tool options window that will allow you to adjust pressure and rate just
    like an actual airbrush.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_335_1.png)


    **TIP**


    This window actually comes up rather small. If you have trouble getting the pressure
    or rate you want, enlarge the window. This will increase the area of the slide
    bar and give you more precision.


    Once you select rate and pressure for the airbrush you may use the brush selection
    window to change size, type and other options for the airbrush.'
  merge: -1
  img_proc: true
- pgno: 336
  md: 'Clone—allows you to use one part of an image to paint over another area of
    the image. Sounds strange, yes, but it''s useful for cleaning up edges. To use,
    place the mouse over the area you want to use as a source and then press CTRL
    key and the left mouse button. Release both, then move to the area you want to
    paint over and hold only the left mouse button and drag the mouse over the area.
    Size is determined by brush size selected from brush dialogue window. Likewise,
    you may choose a pattern to paint with. To choose image or pattern, double-click
    on the clone icon.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_336_0.png)


    # **Figure 18-26**


    Clone icon.


    Convolver—allows you to blur or sharpen a specified area of an image rather than
    the entire image itself.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_336_1.png)


    # **Figure 18-27**


    Convolver icon.


    Double-clicking on the tool will open a tool options window.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_336_2.png)


    # **Figure 18-28**


    Blur/Sharpen Options.'
  merge: -1
  img_proc: true
- pgno: 337
  md: 'Here you may choose between blur and sharpen and adjust the degree of pressure.
    Using the brush selection window, you may choose size and other options for this
    tool.


    *Default Colors*—are actually your foreground and background colors.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_337_0.png)


    **Figure 18-29**

    *Foreground/Background Colors.*


    To change colors, double-click on either the foreground or background color blocks
    at the bottom of the main menu. The color selection window pops up separately.
    The narrow vertical bar shows a rainbow of hues. Click on the general color you
    want and a larger range of hues of that color will appear in the box on the left.
    Click on the color you want and click “close.” Alternatively, you may move the
    slide bars around on the right to choose a color.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_337_1.png)


    **Figure 18-30**

    *Color Selection Window.*'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# Filters Menu


    GIMP comes with an amazing set of filters. We will cover only a few of the more
    commonly used ones here. The best way to get to know the rest of them is to just
    experiment with them and read other tutorials.


    +   - *Artistic*—each of these filters can be adjusted, but try the defaults first.

    +   - *Apply Canvas*—makes image appear as if painted on canvas.

    +   - *Cubism*—makes image look more like impressionistic painting.

    +   - *Oilify*—makes image resemble an oil painting.

    +   - *Mosaic*—converts image into various sized tiles.

    +   - *Blur*—actually six different blur filters come with GIMP. Each of them
    changes an image to make it appear out of focus in one way or another. We mention
    the two most commonly used. Each has its own variables, but as with other tools,
    try the defaults first.


    +   - *Blur*—basic blur, useful for smoothing rough areas.

    +   - *Motion*—makes image appear to be moving to or away from viewer.


    Colors—are primarily for use on RGB images. They are used to modify the image’s
    existing colors in various ways. The best way to learn to maximize their use is
    to experiment with them.


    Alien Map—gives your image a psychedelic effect.


    Color Exchange—is very useful for replacing unwanted colors with another color.
    I found this particularly useful for cleaning up portrait images where stray colours
    had found their way into the image. I replaced the unwanted color with the color
    of a nearby pixel.


    To use this filter you must specify both the color to be replaced and the color
    replacing it. Colors are specified by a set of three RGB values. To get these
    numbers you can use the color picker tool. When you use this tool and click on
    the desired color, a small window will pop up with the RGB values of that color.
    You may then adjust the slide bars in the color exchange window to match.'
  merge: -1
  img_proc: true
- pgno: 339
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_339_0.png)


    **Figure 18-31**

    *Color Exchange Window.*


    # Combine


    Film— is a cute little filter I haven’t exactly found a practical use for, but
    find it fun to play with. It takes a series of images and joins them together
    to look like frames in a roll of film. Open the images you want to join and then
    choose “film” in the filter menu. A window will pop up and you can add and remove
    from a list of images which are opening in GIMP to create your film.'
  merge: -1
  img_proc: true
- pgno: 340
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_340_0.png)


    Figure 18-32

    *Film Filter.*


    *Distorts*—these filters create a variety of special effects on image.


    *Emboss*—does what its name implies, makes the image appear embossed into a piece
    of tin.


    *Ripple*—makes image appear as a reflection in rippled water.


    *Waves*—are similar to ripple but more like a reflection with the ripples emanating
    from the center of the image.


    *Edge-Detect*—a series of three filters, all of which do basically the same thing,
    detect edges in an image. This filter can be useful when used with other filters.


    *Enhance*—contains two very useful filters.'
  merge: -1
  img_proc: true
- pgno: 341
  md: '*Destripe*—removes stripes which tend to appear in scanned images.

    *Sharpen*—useful for sharpening scanned images.

    *Glass Effects*—two filters which are fun to play with.

    *Apply Lens*—makes center of image appear as in a convex lens.

    *Glass Tile*—makes image appear as if seen through glass tiles.

    *Light Effects*—my personal favorites!


    *FlareFx*—creates a flare on your image. You are able to choose the exact position
    you want your flare to be. You may not choose color. Best used with layers.


    *Sparkle*—finds the brightest points in an image and creates a starburst effect.


    *Supernova*—similar to flare except the Flare has spikes. You may also specify
    size, color, location and number of spikes.


    *Map*—these filters either tile an image in some manner or use one image as a
    source to change another.

    *Bump Map*—adds depth to an image. You need to choose some texture image and then
    map this to your other image.

    *Illusion*—divides image into a series of "spikes," creating an interesting illusion.

    *Make Seamless*—uses the center part of the image surrounded by a seamless array
    of the rest of the image.

    *Map to Object*—maps image to a plane or sphere with options for orientation,
    lighting and more.

    *Noise*—three filters which are variations on a theme of adding "noise" to an
    image. Basically they blur the image by varying degrees while also giving it a
    grainy effect.

    *Render*—a variety of filters which will achieve some interesting as well as useful
    effects.

    *Gfig*—almost a program in itself and currently a bit difficult to use, but future
    versions of GIMP will improve on Gfig''s usability. Gfig is used for drawing circles,
    curves, and outlines. For now, it is almost easier to use xpaint if you have to
    draw shapes and then save the image and open it with GIMP if you want to do further
    operations in the image.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_342_0.png)


    Figure 18-33

    *GFig*


    *Grid*—generates a grid over an image. You may adjust the number of pixels each
    square of the grid will be as well as the offset.


    # **Script-Fu Menu**


    Script-Fus are scripts installed in GIMP which perform various operations. They
    are especially useful when creating logos which would otherwise take many steps
    to create. GIMP comes with an assortment of Script-Fus and there are a myriad
    of others which you may download and install from gimp.org.


    # **Alchemy**


    *Clothify*—produces an effect similar to apply canvas.


    # **Animations**


    *Rippling*—makes image look as if it has ripples through it.'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# Décor


    +   * *Fuzzy Border*—gives image a fuzzy border.

    +   * *Old Photo*—one of my favorite effects in GIMP. This script takes an image
    and transforms it into a brownish antique photo.

    +   * *Coffee Stain*—produces a very real-looking coffee stain on an image.


    # Modify


    +   * *Add Border*—adds a border. You may specify color and size.

    +   * *Shadow*—takes image and adds shadow behind it, giving the image a 3D effect.
    There are two variations to this; drop shadow and perspective.


    # Render


    +   * *Line Nova*—turns the image into lines shooting from the center of the image.


    # Dialogues Menu


    +   * *Brushes*—select a size and type brush for use with paintbrush, pencil,
    eraser, and airbrush.

    +   * *Patterns*—select from a set of patterns which can be used with fill tool.

    +   * *Palettes*—select, create, and edit color palettes.

    +   * *Gradient Editor*—selects, creates, or edits a gradient.

    +   * *Layers and Channels*—is another way to access layers and channels window.

    +   * *Indexed Palette*—displays palette (only available for an indexed image).

    +   * *Tool Options*—opens tool options dialogue for currently selected tool.'
  merge: -1
  img_proc: true
- pgno: 344
  md: '# Creating a New Image


    To create a new image click “file” and then “new.” You will be prompted to specify
    image size and what color you would like the background to be. You may choose
    foreground or background colors, white or transparent. You may also choose whether
    you want the new image to be RGB (full color) or grayscale. The default is RGB.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_344_0.png)


    # Opening an Existing Image


    To open an existing image, click “file” and then “open.” The Load Image window
    will appear.


    Move around your directories in the left window and choose the specific file on
    the right. At this time GIMP does not have “preview image” options.'
  merge: -1
  img_proc: true
- pgno: 345
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_345_0.png)


    **Figure 18-35**

    *Opening an Image.*


    > **TIP**

    > Remember that Linux is case sensitive. GIMP (and most other programs) see Ship.jpg
    and ship.jpg as two distinct files. Generally, files beginning with uppercase
    letters and numbers are listed at the beginning.


    You may also use this window to create a directory, delete a file, or rename an
    image. These choices appear at the top of the Load Image window.


    # # Saving an Image


    The first thing you need to do when you want to save an image is decide what format
    you want to save your image in. This has a lot to do with what type of image you
    have. By understanding the image formats mentioned at the beginning of the Chapter
    Seventeen, you can get an idea of what format you should use.'
  merge: -1
  img_proc: true
- pgno: 346
  md: 'Once you know what format you want to save your image as, you can do whatever
    you need to do to prepare it for being saved. This might be nothing, and you can
    just right-click for the menu and select "file" and "save as."


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_346_0.png)


    # **Figure 18-36**

    *Saving a File.*


    You can type in a file name and choose the extension (file format) from the "determine
    file type" box. You could also choose "determine type by extension," however,
    if your image is not in the correct format, the save will fail.'
  merge: -1
  img_proc: true
- pgno: 347
  md: 'An example of getting an image prepared for saving would be an image you wanted
    to save as a .gif. This file format requires the image to be indexed. To index
    the colors of your image, simply choose “indexed” from the image menu. You may
    then save the image as a .gif.


    # # Cropping an Image


    Very often it is desirable to keep certain areas of an image and remove others.
    The crop tool is the easiest way to do this. Click on the crop icon from the main
    tool menu. Put the cursor where you want to begin cropping and then left-click
    and drag the mouse over the area of the image you want to keep.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_347_0.png)


    Figure 18-37

    Cropping an Image.'
  merge: -1
  img_proc: true
- pgno: 348
  md: 'For example, in this image of my cat, I wanted to have just her face in the
    image. I dragged the crop tool around just the area I wanted to keep. To do the
    actual crop, there will be a small crop dialogue box in which you may click "crop"
    or "close" to cancel the crop.


    # ## Adjusting Brightness and Contrast


    This is another common operation. Often an image is too dark and we want to lighten
    it up. To adjust brightness or contrast, the image must be in RGB format.


    To put your image in RGB format, simply right click and then choose "Image," "RGB."


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_348_0.png)


    To adjust brightness or contrast, right-click over the image and then choose "Image,"
    then "Colors," then "Brightness-Contrast."


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_348_1.png)


    **Figure 18-38** Brightness/Contrast Controls.


    As you move the slide bar to increase or decrease brightness or contrast, you
    will see the effect on the image itself. If you are completely dissatisfied with
    results and want to start over, simply click "cancel." If you are satisfied with
    the results, click "ok."'
  merge: -1
  img_proc: true
