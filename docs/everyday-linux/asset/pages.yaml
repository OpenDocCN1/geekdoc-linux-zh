- pgno: 166
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_166_0.png)


    # Figure 9-1


    *The mail server screen from the Netscape Preferences menu.*


    You can find out what your incoming mail server is by talking to a customer service
    representative at your Internet Service Provider.


    **Outgoing Mail Server** — On smaller systems, the outgoing mail server may have
    the same name as the incoming mail server. This simply means that the same computer
    handles both outgoing and incoming mail. The outgoing mail server is sometimes
    called the “SMTP Server,” and you may see it referred to as such in your version
    of Netscape or on the World Wide Web.


    The outgoing mail server handles all of the routing necessary for your e-mail
    to make it from your post office (the outgoing mail server) to another (another
    incoming mail server). It ensures that the e-mail you send makes it to the address
    that you specify.'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'If you’re not sure what your outgoing mail server is called, you should call
    your ISP to find out. They’ll be able to tell you what you need to know.


    **Username and Password**—Your username and password are your “box number” and
    “key” for your electronic mailbox. It’s how you access your email.


    In Netscape, you must supply your username. If you don’t want your password to
    be remembered, you should leave the password field blank. You’ll be prompted for
    your password every time you try to download your mail. Make sure that you don’t
    share your username or password with anyone, unless you really want someone else
    going through your e-mail.


    # Netscape News


    Many users who aren’t familiar with the Internet do not realize there is a vast
    array of newsgroups available on the Internet. Topics range from flame wars (see
    alt.flame), religion, abortion rights, to areas we’d rather not tread. You’ll
    be able to find almost anything you could wish to read on newsgroups. Music and
    TV fans will be delighted with the plethora of groups devoted to specific actors
    and actresses. You can even find a number of groups devoted to teaching you how
    to use programming languages or helping you with your new Linux system. This system
    of newsgroups is more commonly referred to as Usenet.


    Your ISP will have what is known as a *news server* to which you can connect and
    download messages available on newsgroups to which you are subscribed. All you
    need to supply is the name of the news server, which you can obtain by calling
    your ISP.


    To add a news server, simply click on the “Add” button. A new window will pop
    up, asking you for the address of the news server and which port you should connect
    to. Unless otherwise instructed by your ISP, you should leave the port at 119—this
    is the standard news port.


    When you first configure your newsgroup preferences, Netscape will assume that
    you have a news server attached to your machine, and will call this server “news.”
    You should add a new one, and set the new one as default. Then remove the one
    labeled “news,” unless you have set up newsgroups on your computer. You can use
    the edit button to correct any mistakes in entries that you’ve created.


    If you find that it takes too long to download messages from a newsgroup, you
    can tell Netscape to ask your permission before downloading more mes-'
  merge: -1
  img_proc: true
- pgno: 168
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_168_0.png)


    # Figure 9-2


    The Netscape News preferences.


    sages than you specify. In my news preferences, this number is set to fifty, since
    downloading fifty messages usually doesn''t take me too long.


    “Netiquette”—“Netiquette”is a term for the proper etiquette exercised on the Internet.
    This applies to all aspects of Internet use, but when dealing with Usenet, there
    are some specific things to know.


    You should keep in mind that in a public forum there are rules, even if they are
    broken quite often. It is never wise to engage in public flame wars unless the
    forum is specifically devoted to doing so (such as the alt.flame newsgroup I mentioned
    before). A flame war is a large series of messages between two or'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'more people which are inflammatory or composed of personal attacks. Flame wars
    scream, "I''m a pathetic Internet junkie who has no life and plenty of time to
    defend myself in front of people who couldn''t care less." Besides that, for those
    people who are truly interested in reading the newsgroup, flame wars take up quite
    a lot of space (it''s aggravating to download fifty messages and get only ten
    that are worth reading) and annoy almost everyone on the group.


    It is also wise to take some time to get the "feel" of a newsgroup before posting.
    This is known as "lurking," since you read messages but don''t post any to a newsgroup.
    Oftentimes, the posters to a group are "regulars" and have established a rapport
    that a clueless newbie poster might unbalance. This tends to upset people, and
    that poster might find himself ostracized for some time. For instance, I joined
    a mailing list some time ago that is devoted to discussing the writing of author
    Stephen Lawhead. The administrator and some others were engaging in some discussion
    about Greek grammar; knowing a little bit of it myself, I thought an appropriate
    introduction to the group would be to join the discussion. I was wrong; the administrator
    quickly reprimanded me via personal e-mail, and I have never posted there again,
    despite being a member of the list for several years.


    # Moderated vs. Unmoderated Newsgroups—Generally speaking, you should read moderated
    newsgroups.


    A moderated Usenet newsgroup is one that has a person filtering the various posts
    that come through the group. This person is known as the moderator, and he usually
    prevents unnecessary messages from getting through. This greatly reduces the amount
    of "Spam," or unsolicited commercial e-mail (UCE) and posts with no content other
    than flames.


    If you''re more daring, you can read and post to an unmoderated newsgroup. These
    groups tend to be far more rowdy and less organized. People are less willing to
    engage in thoughtful conversation and more apt to produce what are known as "clueless
    newbie posts." These involve pointless polls and one- or two-sentence opinions
    designed to generate debate. You can find the occasional jewel on an unmoderated
    newsgroup, and they can prove to be just as interesting (if not more so) as the
    moderated newsgroups.


    Some types of unmoderated newsgroups attract less Spam and flame wars than others,
    fortunately. You''ll be able to readily distinguish these, but a general clue
    is whether a newsgroup is devoted to helping the readers or to tending debates.
    Unmoderated debates often become flame wars.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# 9 Some Internet Applications 135


    # Opera


    The makers of Opera have not released a stable version of Opera for Linux at the
    time of this printing. It is worth noting, however, that Opera is a very small
    and fast alternative to the huge browsers available now.


    There are tech preview releases of Opera available at their web site (which can
    be found in the reference section in the back of the book). It’s well worth checking
    out, and it will be a force to be reckoned with when completed.


    # Lynx


    Lynx is a text-only browser, frequently used to avoid loading images and scripting.
    Since it’s completely text-based, it is incredibly fast. However, web page makers
    rarely design their pages to work well with text browsers, so Lynx usually doesn’t
    render web pages very well. Fortunately, the makers of Lynx have steadily increased
    support for features such as tables and frames.


    Lynx comes with Linux and almost all UNIX operating systems. It has been around
    for a long time and remains the choice of some systems administrators. People
    who are blind or cannot see well sometimes prefer to use Lynx; it cuts out much
    non-textual information and Braille keyboards work better.


    # FTP Programs


    FTP programs allow you to connect to what are known as FTP servers. FTP stands
    for file transfer protocol. There are several programs which use the file transfer
    protocol to send and receive files over the Internet. Among these are favorites
    such as NCFTP and GFTP.


    # NCFTP


    NCFTP is a program run from the command line, generally used because it allows
    download recovery. Just like a regular highway, the information superhighway is
    subject to traffic jams and crashes. Your download may be terminated or suspended
    before completion, and NCFTP will allow you to start where you left off.


    To run NCFTP, open a terminal window by clicking on the terminal icon on your
    panel. When the terminal screen comes up, type ncftp. A window will appear that
    looks a little like this:'
