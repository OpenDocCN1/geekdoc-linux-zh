- pgno: 350
  md: '# CHAPTER 19


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_350_0.png)


    # # Playing Audio and Video Files with Linux


    It seems incredible how much computers have changed in the past decade. They have
    changed from a simple command line interface to multimedia entertainment systems.
    Computing power now allows for playing all sorts of video and audio. All you need
    to know is which program plays the file type you want to see or hear.


    There are a number of programs available for Linux, but, as with other topics,
    we’ve chosen the programs which come with a boxed Red Hat install. You will likely
    find many other programs on the net which you might like to download and try.


    # ## Playing MP3 Formats


    # **XMMS (MP3 Player)**


    MP3s are growing in popularity each day. It is a format which reproduces music
    in CD quality. In fact this format may be copied to CDs. XMMS will play MP3s and
    the audio portion of Mpeg movies.


    315'
  merge: -1
  img_proc: true
- pgno: 351
  md: '# # 316 Everyday Linux


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_351_0.png)


    To open a file in XMMS, click on the up arrow with a bar underneath in the lower
    left row of buttons. A window will pop up which will allow you to move around
    directories and find your music files. Once you have selected a song and clicked
    “OK,” that window will close and the song will begin to play automatically.


    > Playing MP3s can be CPU intensive. You may notice that while playing an MP3,
    and opening another program (or doing some operation which takes CPU power) that
    the music breaks up. This will likely be noticed most on slower machines and not
    noticed at all on fast ones.


    # ## Playing Compact Disks


    There are numerous programs which will allow the user to play compact disks, but
    we have selected the more stable and intuitive ones.


    # ### CD Player


    Place your CD in the tray and start CD player from the GNOME “multimedia” menu.
    The controls of the program are not labeled but are intuitive. Their functions
    also appear as a small label when you hold your mouse over a button. An alternative
    controls menu will pop up if you click your right mouse button. (Make sure you
    are not over the actual control buttons!)'
  merge: -1
  img_proc: true
- pgno: 352
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_352_0.png)


    **Figure 19-2**

    *CD Player.*


    “Preferences” will allow you to change the way the program acts on startup and
    exit. You can also change colors and font.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_352_1.png)


    **Figure 19-3**

    *CD Player Preferences.*'
  merge: -1
  img_proc: true
- pgno: 353
  md: '# Kscd CD Player


    An alternative CD player can be found compliments of KDE. Click on "KDE menus"
    and then "multimedia." As with the player mentioned above, the controls are intuitive
    and there are labels which appear when the mouse is held over a button.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_353_0.png)


    **Figure 19-4**

    KDE''s CD Player.


    # Playing .wav Files


    # Media Player


    This little program can be found by clicking "KDE Menus" and then "multimedia"
    and selecting "media player." Media player will play only .wav files.


    Because they are large uncompressed files, usually only sound clips are saved
    as wav files.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_353_1.png)


    **Figure 19-5**

    Media Player Wav player.'
  merge: -1
  img_proc: true
- pgno: 354
  md: 'The controls for media player are quite intuitive and there are pop-up labels
    when you hold the mouse over a button. You will notice a few buttons (such as
    “eject media”) are grayed out. This is likely preparation for adding additional
    features such as playing CDs.


    As with most programs which run on Linux, you may open as many windows of media
    player as you like.


    # # Playing Midi Files


    # ## Kmid


    Mids are popular tunes and often played on websites. KMid can be found under “KDE
    menus” by selecting “multimedia” and then “Midi/Karaoke player.”


    The controls for KMid are intuitive, and there is also a menu bar across the top
    of the screen. KMid allows you to set up collections of your favorite tunes. You
    could, for example, put a group of holiday mids into a holiday collection, while
    keeping your favorite everyday mids in another collection. This saves a lot of
    opening of directories!


    KMid comes complete with instructions for playing songs and creating collections.
    It also has a “tips and tricks” section that is useful and informative.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_354_0.png)


    Figure 19-6

    *Knid midi player.*'
  merge: -1
  img_proc: true
- pgno: 355
  md: '# Sound Accessories


    # KMix—Sound Mixer


    There are numerous sound mixers available for Linux. We have chosen the one that
    has full features and also comes with documentation.


    KMix is a small but full-featured sound mixer for your computer''s multimedia
    programs. This will allow you to increase or reduce volume, bass, treble and more.
    It will also allow you to set recording levels if you are working with a microphone.


    There is a global volume control which will affect all sound-related programs.
    There are also separate volume controls for CD players, microphone, speaker and
    line-in.


    Where applicable, there are separate right and left (for speakers) controls. Generally,
    you will not need to make adjustments to the mixer for everyday use, but there
    are times when you will want to have such controls available.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_355_0.png)


    Figure 19-7

    KMix'
  merge: -1
  img_proc: true
- pgno: 356
  md: '# Video on Linux


    # AKtion! The Video Player


    At first glance this program might not look so impressive, but it is a real workhorse
    and handles numerous video formats. AKtion can be found by choosing the “KDE menus”
    and then “multimedia” and selecting “AKtion.”


    AKtion will handle five types of video format. The two most common are Quicktime
    Movie (.mov) and MPEG (.mpg). These are the two you will most likely be using,
    but AKtion will also handle .avi, .fli, and .fle formats.


    The control buttons of AKtion have pop-up labels when you hold the mouse over
    a button. Although there is good documentation, you will likely find all you need
    to do is open a video file and it will play automatically. You may also resize
    AKtion to be larger, but you will lose quality.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_356_0.png)'
  merge: -1
  img_proc: true
