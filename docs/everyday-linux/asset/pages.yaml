- pgno: 296
  md: 'When you are ready to print something, click “file” and “print.” You may also
    click on the little printer icon towards the left side of the toolbar. The print
    dialogue box will pop up and you can choose to print the entire document, or certain
    pages of the document. You can also specify how many copies you would like to
    print and whether you want high, medium or draft quality.


    Tip If you are just printing something to proofread, you could choose to print
    it in draft mode. The quality will not be as good but it will save ink and print
    faster. You might also choose to not print graphics which you can toggle on and
    off in the print dialogue box.


    # Converting Your Document to a Web Document


    WordPerfect 8 makes it quite easy to convert a document to one which can be used
    on the web. This can be very useful if you don’t know how to write in HTML. The
    first thing you will want to do is format your document so that it is able to
    be used on the web. Click “file” and then “Internet Publisher.” The Internet Publisher
    Dialogue box will pop up.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_296_0.png)'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'From this dialogue box choose “format as Web Document.” Another dialogue box
    will pop up warning you that WordPerfect 8 is about to convert your document for
    the web and you may lose some document formatting not transferable to HTML.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_297_0.png)


    # **Figure 15-22**


    *Web Conversion Warning.*


    If you have previously saved the document as a WordPerfect document, you will
    have a copy of the original formatting so you needn’t worry. Click “yes” to continue
    converting your document.


    You won’t notice much difference in your document just by looking at it in WordPerfect.


    Compare figure 15-23 to 15-18. You will notice that once the document has been
    converted, it will be opened in the Web Editor. The Web Editor looks a lot like
    a WordPerfect 8 document window, but the toolbars are different. You can find
    what the function of the various tools are by holding the mouse over the icons.


    When you are ready to save your document for the web, click “file” and “Internet
    Publisher” to open the dialogue box. Then choose “publish to HTML.” You will be
    prompted for a name to save your document as. After you have typed in a name,
    click “ok.”'
  merge: -1
  img_proc: true
- pgno: 298
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_298_0.png)


    **Figure 15-23**


    *Converted Document.*


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_298_1.png)


    If you want to see the HTML code itself, open your html file in a text editor
    or view such as Gedit.


    # **Creating a New Web Document**


    You can create a new HTML document with very little knowledge of HTML. Open the
    Internet Publisher Dialogue Box by clicking “file” and “Internet Publisher.” Choose
    “New Web Document.”

    You can create the web document much as you would any other document but you will
    have to know a bit about html to create anything other than a simple page. Hold
    the mouse over the various tools to find out what they do.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_299_0.png)


    Many tools, like inserting images and changing fonts, work the same way they do
    in the WordPerfect 5 document editor that you have been working with.


    > As with most programs which create web pages in a graphical environment, the
    code is rather sloppy. If you plan on creating large or multiple websites, we
    strongly suggest you get a book on HTML and learn to do it in an efficient manner.
    Sloppy HTML makes pages take a long time to load in a browser and might not look
    good in all browsers.


    When you have created a web document you will want to view it using Netscape to
    see how it will look in a browser. When you are satisfied with how your web document
    looks, you can upload it to your web server.'
  merge: -1
