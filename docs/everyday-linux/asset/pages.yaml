- pgno: 330
  md: 'Transform—has four options which can be selected by double-clicking on the
    icon and then choosing. Once you choose an option then you may select a region
    of an image to alter.


    Rotation—allows rotation (by dragging) of a selected region or entire image.


    Scaling—allows selected area of image to be enlarged or shrunk.


    Shearing—allows selected area of image to be "leaned" to one side or up/down.


    Perspective—allows selected region of image to be angled toward or away from you.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_330_0.png)


    Flip—allows flipping selection left/right or top/bottom. Choose which by double-clicking
    on icon to pull up tool options box.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_330_1.png)


    Text—allows text insertion into image. When you choose this icon and then click
    on an image, the text tools window pops up. Use this window to choose font and
    characteristics (bold, size, etc.). Text color will match foreground color on
    main tool menu. When you are satisfied, click ok. The text will appear on your
    image and you may move it to where you wish it to be.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_330_2.png)'
  merge: -1
  img_proc: true
- pgno: 331
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_331_0.png)


    **Figure 18-14**

    *Text Tools.*


    Color Picker—allows you to select a specific color in your image. Choose the tool
    and then move the mouse over your image until you are over the color you want,
    then click with left mouse button. The selected color will appear in the foreground
    color box of the main tool menu.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_331_1.png)


    **Figure 18-15**

    *Color Picker.*


    Bucket Fill—allows you to fill entire regions with a color or pattern. Double-clicking
    on the icon will bring up the bucket tool options where you may choose color fill
    or pattern fill and some other characteristics. When using color, the foreground
    color will be used. To use a pattern, select pattern fill from the options box.
    Whichever pattern selected will be used. To choose a pattern, see the section
    on patterns.'
  merge: -1
  img_proc: true
- pgno: 332
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_332_0.png)


    *Gradient Fill*—fills an area with a gradation of colors. Default is to use foreground
    to background color blend. Double-clicking on the icon will pop up the tool options
    window. This allows you to set many options for this tool, such as type of gradient
    (linear, radial, spherical, etc.). In addition, GIMP comes with some default gradients
    which you can access by right-mouse clicking for the main menu and then choosing
    “dialogs” and then “gradient editor.”


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_332_1.png)


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_332_2.png)'
