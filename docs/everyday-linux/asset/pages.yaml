- pgno: 365
  md: '# **XBoing II**


    If you are good at ping pong, you will probably like Xboing. This game provides
    you with rows of targets which you must hit and destroy with the ball you can
    bounce off your paddle. Use the mouse to initially release the ball, and then
    bounce it off the paddle by moving the mouse back and forth. You may also fire
    shots at the targets by clicking either right or left mouse button.


    # **XJewel**


    XJewel is a game where blocks with three colors each are dropped one at a time.
    The blocks will stack up and the objective is to clear space by lining up three
    or more of the same colors in a row or diagonally. Blank blocks will remove all
    of whatever color they land on. Move the blocks sideways with the arrow keys.
    Use the down arrow key to drop a block quickly. The arrow up key will rotate the
    colors on the block.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_365_0.png)


    # **Figure 20-8**

    XJewel.'
  merge: -1
  img_proc: true
- pgno: 366
  md: '# **XMLink**


    Here''s a game to ponder and play when you are thinking of doing something like
    compiling a kernel. Your goal is to assemble the links by color and so that they
    make a nice neat chain. Use your mouse to move the blocks around.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_366_0.png)


    **Figure 20-9**

    XMLink.


    # **KDE Games Menu**


    These games are available by choosing the “KDE menus” from the GNOME main menu
    and then choosing “games.”


    # **Sokoban**


    Sokoban is a cute game of strategy where the player has to move red rubies from
    one area to an end point. The rubies may only be pushed forward and only if the
    space directly in front of it is vacant.


    The easiest way to move around the play area is to use the arrow keys. To undo
    a move, click the right mouse button.


    There are multiple levels to the game. You must complete one level to move to
    the next.'
  merge: -1
  img_proc: true
- pgno: 367
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_367_0.png)


    # **Figure 20-10**

    * Sokoban.


    # **Mahjongg**


    The goal of Mahjongg is to remove all the tiles from the board. This is accomplished
    by using the mouse and clicking on matching tiles that are available for play.


    Tiles available for play are on the outside edges and do not have tiles on top
    of them.


    Mahjongg allows multiple undo moves.


    There is another Mahjongg game found under the main games menu, but we liked this
    one''s animation better!'
  merge: -1
  img_proc: true
- pgno: 368
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_368_0.png)


    Figure 20-11

    Mahjongg.


    # Minesweeper


    The goal of Minesweeper is to uncover all the squares without clicking on a bomb.
    There are ten bombs hidden under the squares which you need to flag. To uncover
    a square, click on the left mouse button. To flag a bomb use the right mouse button.


    Under some squares you will find a number. The number will tell you how many bombs
    are touching that square. You must deduce where the bombs are. For example, if
    you uncover a square with a number one, it means that it touches one bomb. This
    may mean above, below, sideways or diagonally.


    Some squares have no number, and when you click on that square, it will turn over
    all other unnumbered squares near it.'
  merge: -1
  img_proc: true
- pgno: 369
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_369_0.png)


    # Patience


    For those who like cards, Patience offers the classic Klondike as well as eight
    other solitaire games. There are some options, with rules for play and card decorations.


    There isn’t much for directions on playing the various games, so you must know
    beforehand how to play.


    # Reversi


    Reversi is a game of strategy. You play against the computer in this game. The
    board comes up with two red and two blue balls. The goal is to change the opponents’
    balls to your color. This is accomplished by using one of your balls to jump over
    the opponents’ balls which changes the opponent’s balls, to your color.


    Reversi comes with full documentation. Click on “help” and then “contents.” You
    will find rules of the game as well as some strategy hints.'
  merge: -1
  img_proc: true
