    If you created any directories in the course of this lesson and don''t think you''re
    going to need them, you can remove them in two ways. The first, and the one you''ll
    probably want to use more often, since it''s safer, is the rmdir command. To use
    it, the syntax is rmdir \[ directory\]. The other way is to use the rm command
    using the -r command line option. The syntax for that is rm -r \[ directory\].
    This is a more dangerous method because it will search through a directory and
