  img_proc: true
- pgno: 216
  md: 'The dialog window will show the word in question, and its suggestions (if it
    has any) for the correct spelling. On the right are buttons which allow you to
    "ignore," "ignore all," "replace," and "always replace." Ignore all will ignore
    all occurences it finds of that particular word in that document. Replace all
    will replace all occurences it finds of the misspelled word. You also have the
    choice to add a word to the dictionary.


    The other way to spelcheck is to do it as you type. By clicking "tools," "spellcheck,"
    and then "autospelcheck," you can see a misspelled word as soon as you type it.
    When you misspell a word, Star Office will place a squiggly red line underneath
    the word. You can then click on the word with the right mouse button and see suggestions
    for correct spelling, ignore all, or to add the word to the dictionary.


    Find and replace can be used to replace a word which is not misspelled with another
    word. Suppose you have written a personal letter to someone and then realize that
    you have used the wrong name and typed "Burgers" instead of "Burgess." If you
    have used the name multiple times, it can be very time consuming to go back through
    the document and hunt and replace the names. You will find it much easier to choose
    "edit" and then "find and replace."


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_216_0.png)


    # Figure 12-5

    Find and Replace.


    In the find and replace window, simply type in the word you want it to find and
    then the word you want to replace it with.


    You might also want to move blocks of text around and this also is quite easy.
    You can select the text by clicking the left mouse button at the beginning and'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'dragging the mouse to the end of the text, or you can use the shift key with
    the arrow keys. Place the cursor at the beginning of the text you want to select.
    Hold the shift key down and then copy entire lines by using the arrow down or
    up keys, or copy a character at a time by using the right and left arrow keys.
    The text you select will be highlighted.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_217_0.png)


    **Figure 12-6**

    Selecting Text.


    Now that the text is selected you may click “edit” and then “cut” or “copy.” Use
    cut if you want to move the text from where it is and paste it somewhere else.
    Use copy if you want to copy the text to another location. After doing that, place
    the cursor where you want to put the text and then click “edit” and “paste.”'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# ## Adding an Image to Your Document


    You can add images and clipart to any StarWriter document very easily. Place the
    cursor where you would like the image to be and then click “insert,” then “graphics,”
    and then “from file.”


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_218_0.png)


    **Figure 12-7**

    *Inserting a Graphic.*


    You will see a preview of the graphics you click on, and once the image is loaded
    into your document you can resize it or move it around to just where you want
    it.


    > > **tip**

    > >

    > > Remember that adding larger images will add to the size of the document. Adding
    two or three images can make a huge bulky document.


    # ## Information About Your Document


    You can find out information about your document by clicking “file” and then “properties.”
    You will notice there are five tabs across the top of the window that pops up.
    There are two sections of this pop-up window which you might find useful.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# 184 Everyday Linux


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_219_0.png)


    **Figure 12-8**

    *Document Properties.*


    General information will give you the document title (file name), location, size,
    and date created and modified. It will tell you who modified it, and what time
    they did so.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_219_1.png)


    **Figure 12-9**

    *Document Statistics.*'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'Clicking on the “statistics” tab will bring up quantitative information about
    your document. It will tell you how many pages, number of paragraphs, words and
    characters. It will also tell you how many lines your document has if you have
    been using line numbering.


    # # Printing Your Document


    We have already covered how to set up your printer in Star Office. When you want
    to print a document, simply click on the printer icon at the top of the screen.
    You can also click “file” and “print.”


    If you want to review your document before printing, click “file” and then “page
    preview.” StarWriter will show you a view of the entire page as it will look.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_220_0.png)


    *Page Preview.*'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'The print will likely be too small for you to see, but you will be able to
    see how many pages your document is and get an idea of how it will look printed.


    # ## Importing and Exporting Files


    StarWriter can import a wide range of documents including MS Word 95/97/2000,
    Excel, Lotus 1-2-3, Mac text, DOS text and much more. You should have no problem
    loading documents from a Microsoft operating system. Occasionally there can be
    some formatting recognition problems, but most of the time it works fine.


    To import a different format, click “file” and “open.” Usually StarWriter will
    recognize the format and use the correct filter to import. Sometimes it will,
    however, ask you for which filter to use. StarWriter will then pop up a list of
    filters from which you choose the correct document type.


    Likewise, StarWriter can export documents in a wide variety of formats. Use the
    “save as” feature and then choose the format you wish to save it as in the “file
    type” box. StarWriter makes it very easy to exchange documents with people using
    different operating systems and word processors.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_221_0.png)


    > If you need to give someone a file and you are in doubt as to what file types
    they can handle, you can always save as plain text (.txt). Just about any editor
    can open these files. Unfortunately, any formatting or images will be lost as
    plain text, but the text will be readable.


    # ## Using Auto Pilot to Import and Export Multiple MS Documents


    If you have a large number of MS Word documents, and/or templates which you would
    like to have imported and then exported as StarWriter (.sdw) documents and templates,
    there is an auto pilot which can do this automatically.


    Choose “file,” “auto pilot” and then “Microsoft Import.”


    The first screen that comes up just explains what this auto pilot does. Keep in
    mind, this does not delete any files, it just adds a copy of an MS Word docu-'
  merge: -1
  img_proc: true
- pgno: 222
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_222_0.png)


    Figure 12-11

    Using Auto Pilot to Import a Document.


    ment exported as a StarWriter document. You end up with two copies of the same
    document, one remaining an MS Word document and the other .sdw format. When you
    are ready, click “continue.”

    Here you are asked whether Auto Pilot should get both MS Word templates and Word
    documents. It also asks you to tell it which directory it should look in. Click
    on the little box to the right to browse and select a directory. On the left,
    you will also be asked whether it should include subdirectories. At the bottom
    of the window you are asked where Auto Pilot should put the exported documents.
    Again, you can click on the little box on the right to browse directories. When
    you are finished, click “continue.”'
  merge: -1
  img_proc: true
- pgno: 223
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_223_0.png)


    **Figure 12-12**

    Importing Multiple Documents.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_223_1.png)


    **Figure 12-13**

    Importing Multiple Documents.'
  merge: -1
  img_proc: true
