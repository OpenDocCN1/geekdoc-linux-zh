- pgno: 88
  md: 'To run the control panel program, click on the main menu button. Move to system
    and then "control panel." The window you see at left will open up.


    # # Setting up Your Modem


    We''re going to take some time out at the very beginning to set up your modem.
    In this day and age, it''s almost impossible to navigate your way through the
    computer world without some use of the Internet. And to get on the Internet, you
    need to use a modem. The modem is one of the most-used devices on the system,
    and one of the most basic devices that you and anyone else who uses your computer
    will want to use. That''s why we''re going to tackle setting it up first.


    # ## Compatibility


    As with most devices, you must first make sure that your modem is compatible with
    Linux. To do this, you should check Red Hat''s web site and look at the compatibility
    list. You can assume that your modem does **not** work if you have a combination
    modem/sound card (such as IBM''s MWave) or a modem specifically designed to work
    with Windows (most winmodems). Modems that require extra software to enable compression
    options probably won''t work either.


    Again, you should see if you can find a patch for your modem from your vendor
    or from a site like Sourceforge. If this fails, you should invest in a Linux-compatible
    modem. These are generally quite inexpensive—you should be able to buy a 33.6
    kbps modem for under forty dollars.


    # ## Using Modemtool


    To set up your modem, we''re going to access the modemtool command from the control
    panel. Open the control panel as directed above and then click on the icon that
    has a telephone on it.


    The window that comes up will look like the picture to the left of these paragraphs.


    The ports are labeled as TTY50, TTY51, TTY52, TTY53 for COM1, COM2, COM3, and
    COM4, respectively. You should select the port that matches the one on your modem.
    Then, click on okay to complete the setup.'
  merge: -1
  img_proc: true
- pgno: 89
  md: "![](img/92fb6d8ad19de3b3470ba95c7b71b82e_89_0.png)\n\n*Figure 5-2*  \n*The\
    \ modemtool screen.*\n\n# Setting up PPP\n\nMost users will want to be able to\
    \ connect to the Internet while using Linux. To do this, most users use a *PPP*\
    \ connection. PPP stands for *Point to Point Protocol*, and refers to a method\
    \ of communication between your computer and the one you are calling. (Users of\
    \ older Internet providers may have a *SLIP* connection.)\n\nMost major Internet\
    \ Service Providers (ISPs) such as America Online, CompuServe, the Microsoft Network,\
    \ Prodigy, Juno, and some free providers such as Netzéro provide software for\
    \ your computer that will allow you to con-"
  merge: -1
  img_proc: true
- pgno: 90
  md: 'nect to their services. Most of the time, this software does not work on Linux.
    You should call their support numbers to see if you can obtain this software for
    Linux or set up a connection without it.


    Other ISPs usually allow you to connect using a PPP connection program such as
    Dial-Up Networking for Windows. The equivalent in Red Hat Linux is known as the
    “PPP Dialer.” (I am always impressed at the creative names assigned these programs.)


    To run the network configuration tool, you should click on a different icon from
    the control panel. It’s the fourth one down, and it looks like a server with many
    different computers connected to it (though it’s admittedly a little difficult
    to make out). When the network configurator starts, this is what it will look
    like:


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_90_0.png)


    **Figure 5-3** *The Network Configuration Tool.*'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'The default configuration for ROUTING is probably going to work out just fine
    for you, so don''t change any of its settings unless your network administrator
    or ISP technical support representative tells you to. The other three buttons
    have information that you will need to change, however.


    # Names


    You won''t know any of this information off-hand, more than likely. The easiest
    way to get it is to call your network administrator or ISP and ask them what information
    you''ll need for each of the categories.


    Alternatively, if you are still running Windows, you can find the information
    from the Network Settings in the Control Panel. Getting the information should
    be easy—simply find the device labeled **TCP/IP -> Dialup Adapter**. Highlight
    it in the list that appears and click on properties. You should then go through
    each of the tabs and record the information. You''ll be able to transfer some
    of it to the fields in the Network Configurator, since the field names are the
    same.


    The NAMES tab supplies information that will allow your computer to find other
    computers on the Internet when connected to the host. If you don''t specify any
    settings here, you''ll probably get a lot of errors when you try to view web pages
    (to the effect that Netscape or whatever program you''re using cannot find the
    remote server).


    # Hosts


    Most of the time, you can leave this option alone. However, if you frequently
    access systems, you can create aliases for them here. As long as you have the
    IP address of the system, you can add a hosts entry.


    If you''re not sure of how to edit the hosts file, you shouldn''t worry about
    it now. Your network administrator or ISP may advise you to put some information
    in here.


    # Interfaces


    This isn''t the most complicated part of setup, but it is the most important.
    You will need to add a device to your system (usually **ppp0**) so that PPP will
    function properly if the device ppp0 is not already listed in the interfaces list.
    To do this, you should click on the Add button at the bottom of the window.'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'A new list of devices will come up. At the top is PPP; the list should contain
    others such as SLIP and Ethernet. Make sure that PPP is checked and click OK.
    A new window will appear, requesting information such as the phone number, login,
    and password. Put in all this information. There is also a section for “PAP Authentication.”
    You should consult your network administrator or ISP to see if you need to configure
    your system for use with PAP authentication. Most modern ISPs now use PAP authentication.


    You will notice a button labeled “Customize” near the bottom of the window that
    you entered the phone number and such information into. You may need to make modifications
    here. Click the customize button, and a new window will pop up. Here is a summary
    of the fields and information; if you need to modify them, you will likely need
    information from your ISP or network administrator.


    # Customizing Interfaces


    **Hardware**—These settings control how the modem itself operates. Hardware refers
    to the physical components of your computer, whereas software refers to the programs
    that run on your computer. This is why modems that use software to enable data
    compression are usually not compatible with Linux—the software does not work.


    Usually, you will not have to change any hardware settings. If you are having
    problems connecting, you may wish to turn off “hardware flow control.” You likely
    don’t need to change the line speed, but some modems will not work properly if
    you have this above 57600. You used modemtool to set the port, so you don’t need
    to change this field.


    **Communication**—These settings determine how your modem communicates with the
    remote computer (the one you are calling) and the local computer (the one used
    to make the call). Some modems may require a different initialization string than
    the one given.


    The initialization string sets up the modem for communication with your computer,
    telling it to reset, how long to wait between dialing individual digits in a phone
    number, whether to pick up the phone when you receive a call, and so on.


    Most modems will react just fine to the default ATZ; if that doesn’t work, try
    AT&f. (This resets the modem to the factory defaults.) You may also want to call
    your modem vendor or consult the instruction book to your modem. Most'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'vendors have at least two or three initialization strings on hand to give to
    you over the phone; they may also have them on their web sites or in the instruction
    manual for your modem. You can make a lot of different initialization strings,
    so you should play with the ones you have to see how they work.


    The communication settings also reflect a sort of “login script” that you will
    need to log in. This is set up in the form of “expect/send” statements. Your computer
    will expect a certain statement, such as “login:” and send a certain state- ment,
    such as your user name. It will do the same for your password. You should use
    the expect/send statements to compose a “login script” of sorts if your ISP requires
    that you use one.


    You should also make sure that all users can activate and deactivate this con-
    nection, unless you intend to allow only root to use it.


    **Networking**—You can leave these settings at default, unless instructed oth-
    erwise by your network administrator or ISP. They simply control a few network
    settings.


    **PAP Authentication**—If you need to use PAP Authentication, you should talk
    to your network administrator or ISP to find out what settings you should use
    in this situation. PAP stands for *Password Authentication Protocol*.


    # Done


    When you’re finished making the configuration changes, click on the button labeled
    “Done”. A new window will ask you if you want to save this configura- tion, and
    you should click Yes. For good measure, click “Save” at the bottom of your Network
    Configurator window.


    You must then activate your connection in order to use it.


    # Activating Your PPP Connection


    To activate your PPP connection, highlight the device you just created (proba-
    bly ppp0). Then click on the “activate” button at the bottom of the window. Your
    modem will immediately dial the number that you specified in the setup.


    Once you’ve connected, you won’t really know if your PPP connection is functioning
    properly because nothing happens. To check that you are connect- ed correctly,
    we will run a simple test. Click on the terminal icon on your panel. When the
    window comes up, type yahoo.com. If data begins appearing on your screen, you
    are successfully connected. To exit the program, hit CTRL-C.'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'What this program does is send small data packets (around 64 bytes apiece)
    to the Internet address you specified. If these packets are returned to you, ping
    will tell you that you''ve received the packages and include how much time it
    took for the transfer to take place. If your PPP connection is working properly,
    this transfer will occur. If not, when you abort the program, you will see a message
    telling you that some number of the packets were sent, and none were received.


    You can deactivate the connection by clicking on deactivate at the bottom of the
    Network Configurator window. Deactivating the interface will cause the modem to
    hang up.


    Connecting this way every time would be rather annoying. However, you don''t have
    to. GNOME has provided an applet that you can use to turn PPP on and off. It''s
    under the "Network" category on the "add an applet" menu. Alternatively, you can
    click on the main menu, go to "Internet" and click on "RH PPP Dialer," which will
    allow you to dial from whatever PPP devices are defined.


    # Other Connections


    Most Linux machines are also equipped for dialup access without using PPP. The
    most popular program that comes with Linux to do this is called "Minicom." Minicom
    operates much like Procomm Plus, which has been "out of print" for many years
    now. It''s not difficult to get used to the key commands, and the interface is
    reasonably user-friendly.


    Minicom also makes use of several security features, so that you can specify which
    users are permitted to access Minicom, for instance.


    To run Minicom, click on the main menu and go to "Internet." "Minicom" is an option
    there; click it and it will start up. To get help, hit CTRL-A and then Z. CTRL-A
    tells Minicom to come to attention and Z is the command for help. A help screen
    will appear which supplies you with the proper command set to use to open a dialing
    directory, edit entries, and dial numbers.


    While we could spend a bit of time working with Minicom, it is in your interest
    to learn to explore your system and learn a few things about it. Text-based dialup
    connections these days are rare and not often used, so spending a lot of time
    dissecting each individual command in Minicom would take up time bet-'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'ter spent elsewhere. However, in the event that dialup connections are still
    in

    use in your area, you now have the chance to get used to using a program and

    experimenting a little bit with your computer.


    If you want to make Minicom available to all users, you need to do some extra

    finagling. In Chapter Eight, we discuss the command-line interface and how

    you use it to set up Minicom for all users.


    # ## Troubleshooting Your Modem


    There are invariably some modems that have problems with Linux. These are usu-ally
    compatibility problems, though some are due to the default settings that Linux

    associates with the modem (using ATZ as an initialization string, for instance).


    The subject of modem troubleshooting would require another book entirely,

    however, we can leave you with a few pointers.


    If you''re using an external modem, make sure that it is on. Sounds stupid,

    yes, but a lot of problems can be caused this way. If you have lights on the front

    of your modem, consult your modem manual to see what they mean. There are

    some that should be lit when the modem is working properly. Your manual will

    be able to tell you which.


    Your modem manual may also supply you with some standard initialization

    strings to try in case ATZ doesn''t do the job. Every modem will respond to

    AT&F, which resets the modem to factory defaults (hence the "F"). However,

    that may not be enough for your modem to work; extra settings may need some

    tweaking. Your modem manufacturer can usually supply you with two or three

    strings tested to work with most operating systems and applications.


    Your modem manual will also have most of the “AT-commands” that you can

    use with your modem, and it will explain the meaning of each. More adventur-

    ous users can invent their own initialization strings to see if they''ll work.


    # ## All Finished


    Now that you''ve gotten your modem set up for use with PpP, you''ve got much

    more to look forward to. It''s time to start learning how to manage your files
    and

    how to work with the file system.'
  merge: -1
  img_proc: true
- pgno: 96
  md: "We're going to find out about most of the Internet applications later. Don't\
    \ worry. You'll soon be able to connect to your ISP and play around on the Internet\
    \ as you're wont.\n\n# ## Adding a Printer to Your Computer\n\nOftentimes the\
    \ most inexpensive printers are those which are built exclusively for Windows\
    \ 95 or 98. This is because most of the printer commands are interpreted by software\
    \ programs that come with the printer, not by the printer's hardware. In the event\
    \ that you can't find compatible software for your printer that will work on Linux,\
    \ you will need to install another printer.\n\nFortunately, this process is easy.\
    \ Remember, the control center is your friend. Click on the printer icon in the\
    \ control center. You'll see a box that looks something like this:\n\n![](img/92fb6d8ad19de3b3470ba95c7b71b82e_96_0.png)\n\
    \n**Figure 5-4**  \nThe printtool window."
  merge: -1
  img_proc: true
- pgno: 97
  md: 'The printer queues list tells you which printers you have installed on your
    system and what device they print to. In this case, I have an HP DeskJet 710 Series
    printer installed on the system. The letters PPA stand for Printer Port Architecture,
    and it is a proprietary printer driver that was not supported until very recently.
    This is an example of a printer''s software drivers being made available for use
    with Linux, even though they were restricted to use with Windows.


    More than likely your dialogue box will be empty—there won’t be any installed
    printers. So the first thing you need to do is actually add a printer. Click on
    the add button to do so. When you do, a new window will appear. From this window,
    you should simply add a local printer, unless you’re trying to configure a networked
    printer. If that’s the case, you should talk to your systems administrator about
    how to configure a networked printer. It will require a number of settings.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_97_0.png)


    When you click on the “Add” button, this is the window that appears. You’ll notice
    that “local printer” is depressed. If you need to connect to a networked printer,
    you should check to see what kind of system is running the printer. If it is a
    UNIX system, use the “Remote UNIX” option. If it’s run on a Windows NT or Windows
    95/98 machine, choose “SMB.” (SMB stands for “Samba,” which is a program that
    allows you to interface with Windows printers.) If you are on a NetWare network,
    choose the NetWare printer. Make sure to ask your network administrator for help
    if you’re going to configure a networked printer.'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'When you click the okay button, a new window appears that tells you which ports
    Linux could find a printer on. If it cannot find any, you won''t be able to install
    a printer. This may be an indication that you didn''t install the printer support
    component during the installation, or of a more serious hardware problem.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_98_0.png)


    # **Figure 5-6**

    *Editing an existing printer.*


    After you click okay on that window, the printer editor dialogue box will appear.
    This is the same window that appears when you highlight a currently installed
    printer above and press the edit button, so the procedure for editing a currently
    installed printer is the same as this one. A screenshot of the window is at the
    right. You can usually leave all of the information here at the default settings.
    The one that you will likely have to change to get your printer to work properly
    with Linux is the *Input Filter*. If you click on the input filter button a new
    window will appear, as shown in Figure 5-7.


    The input filter allows you to select a printer driver for use with your printer.
    A list of drivers appears on the left. You should choose the driver that most
    closely matches the printer that you own. Once you pick the appropriate driver,
    you should set the settings available on the left. A driver description appears
    at the upper right corner of the window.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_99_0.png)


    Here is a brief summary of the printer filter options:


    +   * **Resolution** The resolution that your printer uses determines how sharp
    the text appears on the printed page. Standard printers usually support only one
    resolution setting; if you install a laser printer or something along those lines,
    you may have multiple resolutions to choose from. It won''t hurt to use the highest
    resolution available, though it can slow down printing.


    +   * **Paper Size** The paper size is simply the standard size of paper that
    fits inside the printer. As long as you''re using a regular printer, you''ll want
    to choose “letter.” If you usually print on sheets of paper that are not 51/2″
    × 11″, you''ll want to choose the appropriate paper size from the list.


    +   * **Color Depth** The color depth simply allows you to choose whether or not
    your printer will print in color. Beyond this, it also allows you to set the default
    printing mode—whether you want to print using more ink or less. (Using more ink
    will produce better-looking printouts.)'
  merge: -1
  img_proc: true
- pgno: 100
  md: '+   • **Printing Options** The printing options are fairly straightforward.
    If you notice that your printer continually prints out an extra page at the end
    of a printout, you should make sure that “Send EOF” is not selected. If you notice
    that your regular text printing produces “stair-stepping” (when the text is not
    left-justified after reaching a hard return), you should click “Fix Stair-stepping.”
    If you use a driver that allows you to use PPA printers (such as the HP DeskJet
    710C series), you should not enable “Fast text printing.” The driver description
    will also contain information about which printing options you should use.


    +   • **Margins** If you have any special margins settings, you should set them
    here. Usually, you can leave these alone.


    +   • **Extra GS Options** Extra options should be used only if you need them
    to print. You should talk to your printer manufacturer to see what options you
    should supply. Again, the printer driver description may have a few listed for
    you to use.


    Once you’re done with the input filter, click the **OK** button. Then click **OK**
    to save the printer that you want to install, and you’ll be back at the main printer
    configuration screen. One of the first things you’ll want to do is print out some
    test pages. To do this, click on the “Tests” menu option.


    Once you’re convinced that your printer works, close the printer configuration.
    You’re all done. The process itself isn’t too difficult at all, is it?


    # # Configuring Sound


    Most users will wish to play sound and video media from their computers. Before
    you can do this, you need to configure your sound card for use with your system.
    Configuring sound is easy.


    First, click on the foot at the bottom of the screen. This brings up the main
    menu. On the main menu, click “Run program.” A new dialogue box will come up.
    Click on it, and type in the command `/usr/sbin/sndconfig`. This is a text-based
    utility, so it will appear in a terminal window on your screen. If it does not
    appear, click on the terminal icon on the panel at the bottom of your screen.
    Then type in `/usr/sbin/sndconfig` at the prompt.'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'Since you are running this from X-Windows, the program will tell you that you
    probably shouldn''t. It should be okay for you to go ahead and configure sound
    anyway. Press enter to move past this screen. To have the sound configuration
    program probe your computer for a sound card, press enter. If it can''t find a
    sound card in your computer, you will have to select it from a list of available
    cards.


    As a precaution, the configuration program will warn you that you''re about to
    overwrite some configuration files. Go ahead and overwrite them.


    The program will then play a sound sample. My copy of Red Hat has Linux Torvalds
    (the creator of Linux) saying, "Hi, I''m Linux Torvalds, and I pronounce Linux
    ''Lah-nux.'' " If you can''t hear the sample, you will want to make sure that
    your sound card is properly seated in your computer (it is if you heard sound
    in your other operating system) and that your speakers are plugged in. If you
    have a volume control on your speakers, you may need to turn this up more than
    usual to hear sounds in Linux. (This is because Windows pre-amplifies sound through
    its own volume mixer.) Make sure to confirm that you have heard it or that you
    haven''t.


    Once the program is finished, it will exit and the window will close. If you used
    the terminal icon on the panel to use the sound configuration program, you will
    be presented with another prompt. Type exit to quit the terminal.


    # # The Linux Configurator


    This is a brief introduction to the Linux Configurator, more often known as "linuxconf"
    because that is the command invoked to run it. Linuxconf is a very, very powerful
    tool, and you''re probably going to use it quite a bit over the course of your
    administration of Linux.


    Our first use of linuxconf is going to be to add additional users to your system.
    If you don''t think anyone but you is going to use your computer, then you could
    just add a test account if you wanted. Our second use will be to add your regular
    user account to the *wheel* group, to allow you to use the su command to run administrative
    programs without actually logging in as the root user. We''re also going to examine
    how to work with your disk drives to allow everyone to use them.'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'To open linuxconf, click on the main menu and go to “System.” In the system
    submenu is the linuxconf command. Click on it. If this is the first time you’ve
    run linuxconf, you may have an introductory screen. Click the “OK” button to get
    rid of it. This is what linuxconf will look like:


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_102_0.png)


    **Figure 5-8**

    The Linux Configurator, or linuxconf.


    # ## Adding Accounts


    Our first task is going to be adding an account to the machine.


    To add an account, scroll through the list on the left. There is a submenu labeled
    “user accounts” that you need to open up. In its sublist, click on the “user accounts”
    underneath the “Normal” subheading. A list of all of the current users on the
    system will appear—you should see your own user account and root, among several
    others (most of which you’ll never use).


    To add an account, you click on the add button at the bottom of the list. A new
    page will appear with a number of prompts to fill in, such as the login'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'name, the full name, the user''s group, supplementary groups, the home directory,
    the command interpreter, and the user id. **Here is a brief explanation of all
    of these categories and how you should fill them out:**


    +   * **Login name** Your login name is the name that you will input when the
    computer prompts for your login. It is best that you put in a login name that
    reflects your name. For instance, my login name is “emetsger.” John Smith might
    use a login name “jsmith” or “johns.” Outlandish names or handles are usually
    frowned upon for mainstream Internet purposes. So it’s probably not a good plan
    to call yourself jpapafunk or llamabo.

    +   * **Full Name** Just put your full name here.

    +   * **Group** For the moment, you can leave this at the default. When we discuss
    groups and permissions, you may wish to come back and add information here.

    +   * **Supplementary Groups** You can leave this blank, too.

    +   * **Home Directory** Your home directory is where your data files are stored.
    The default home directory is /home/login (where login is the login name that
    you provided above). Unless you want to store files in a special place, it’s best
    to leave this blank.

    +   * **Command Interpreter** For the moment, leave this at the default. Most
    users won’t need to worry about which command interpreter (also called a shell)
    they need to use. Until you are familiar with a command line interface, you won’t
    appreciate the differences between the options available.

    +   * **User ID** The user ID is a unique number associated with each user on
    the system. The root user’s ID is 0, and you are not allowed to set your user
    id to zero. You can leave this blank, and Red Hat will start your numbering at
    500. Some users prefer to have a special number for their own personal accounts,
    like 137 or something. If that’s what you’d like, go ahead and plug it in—as long
    as it’s not taken by another user, it’ll be fine.


    Once you’ve finished filling in this information, you can click “Accept” and the
    page will be replaced with a “Change Password” dialogue. **Type** in the password
    and click the Accept button. You will then be asked to confirm the password by
    typing it in again. Click the Accept button once more to complete the addition
    of the user.'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'The only two required fields are the Login Name and the Full Name. The remaining
    page will have a list of the current users on the system. To clear this, you can
    click "quit." First, however, we want to add your regular user to the wheel group,
    which will allow you to use the su command.


    # # Adding Your User to the Wheel Group


    To add your personal account to the wheel group you need to have the list of users
    on the screen. Find your own account and click on it. This begins the “user editing”
    process. You’ll notice that it looks quite similar—almost exactly the same, in
    fact—to the user creation page.


    To place yourself in the wheel group, you should modify the “Supplementary Groups”
    field. Type “wheel” in the field and then click on accept. That’s all it takes
    to add your personal account to any group on the system, not just the wheel group.
    A list of groups can be found by clicking on the arrow button next to the “Group
    (opti)” field.


    Now that we’ve added your user to the wheel group, we’re more or less finished
    with account editing. Click “quit” to close the user accounts page. Our next task
    is to make your floppy drive and your CD-ROM drive user-mountable so that any
    user can use them.


    # # Making Drives User-Mountable


    Before we actually explain the process, it would be a good idea to introduce the
    concept of mounting and unmounting drives. When we installed the Linux operating
    system, we had to specify *mount points* for each one of the partitions we created,
    and we explained that Linux recognizes each drive (be it a floppy drive, CD-ROM,
    or hard disk drive) as a part of the directory tree.


    # ## Mounting and Unmounting Drives


    When you make a drive accessible, this is known as *mounting* a drive. When you
    mount a drive, the files on it become available for general access (depending
    on what permissions you set on the drive when you mount it). Conversely, when
    you *unmount* a drive, you deny access to the drive—it’s as though it doesn’t
    actually exist on your computer.'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'When a drive is *user-mountable*, every user can mount and unmount the drive.
    Most of the time, only drives that make use of removable media, such as floppy
    disk drives, CD-ROM drives, or Zip and Jazx drives, are user-mountable. To make
    a hard drive user-mountable would allow any user to make the main files of the
    system unusable—it could crash the computer.


    # To Make a Drive User-Mountable


    This is the process that you’ll take to make a drive user-mountable.


    This time, we look for a category on the right called “File Systems.” A subtopic
    to “File Systems” is called “Access Local Volume.” Click on “Access Local Volume,”
    and a list will appear on the right, showing all of your drives and partitions;
    the floppy drive and CD-ROM are also listed, as are Zip drives and others you
    may have installed.


    First we’re going to make the floppy drive user-mountable. This is one of the
    more commonly used drives, and it also makes use of removable media. This gives
    us reason to make it user-mountable. What happens if it’s not user-mountable is
    that your users will have to ask you to mount the drive every time they need to
    read the contents of a floppy disk.


    The device name of your floppy drive is /dev/fd0. This is how the system knows
    your floppy drive. Click on the line where you see that device name. A new dialogue
    box appears on the right; this is known as the volume specification page.


    We’re interested in the “Options” tab. The first couple of tabs allow you to configure
    the floppy drive for use; since it’s already configured for use, we don’t want
    to change any of those settings. Click on the options tab and the options list
    appears; from this list, you should find “User mountable.” Click it, and then
    click on the Accept button. If you wish to make other drives available to your
    users, repeat this process for the other devices in the list (e.g., a CD-ROM,
    a CD writing device, a Zip drive, and so on). Make sure that you do *not* make
    hard drives user-mountable.


    # Other Functions of the Linux Configurator


    So far, we’ve really covered only three different functions of linuxconf. However,
    this is an incredibly versatile and powerful tool for systems administration.
    In this section, we go over some other common applications of linuxconf.'
