- pgno: 291
  md: 'If you just want to change size or attributes without changing the font you
    can do that also. To change font size or to make it bold, italics or underline,
    you can do this from the toolbar to the right of the font window. For example:
    to begin typing in bold type, just click the “B” icon and begin typing. When you
    are through, click the icon again and bold is turned off. There are additional
    attributes you can change from the font attributes window we mentioned above.


    If you want to change attributes of already existing text, simply highlight the
    text with your mouse and then right click and select “character.” The font attributes
    window will pop up and you can change fonts and/or attributes. See the next section
    on selecting text for more information.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_291_0.png)


    You can easily select larger areas of text. Place the cursor at the beginning
    of the text you want to select. Then click “edit,” “select” and choose from “sentence,”
    “paragraph,” “page,” or “all.” Once the text is selected, you can then right click
    and choose “character” to make changes.


    # Cut, Copy and Paste


    To cut text from a document, or to move it to a different location, you need only
    highlight the text you want to remove. Once you have selected the text, click
    “edit” and “cut.” You can also right click over the selected text and select “cut.”
    The text is removed from the document and placed in memory (sometimes called the
    “clipboard”). If you want to move the text to another place in the document, or
    another document, simply place the cursor where you want the text to be inserted
    and then either click “edit” and “paste” or right click with the mouse and choose
    “paste”


    If you want to copy, rather than cut text, highlight it and then click “edit”
    and “copy.” Likewise you can right click and choose “copy.” This action will leave
    the original selected text where it is at, and you can insert other copies wherever
    you like.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_291_1.png)


    It is very easy to copy and paste text from one document to another. Once the
    selected text is in memory, it can be pasted into any program which will accept
    text.'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# Spell-As-You-Go


    WordPerfect 8 has a very good spell checker which works as you type by underlining
    words it believes are misspelled. You can either check each word as it is marked
    as misspelled or you can finish your document and then go back through it. When
    you want to check a word marked as misspelled, right click over that word.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_292_0.png)


    Figure 15-16

    Spell-As-You-Go


    When you right click over the misspelled word you will see a small pop down menu.
    If WordPerfect finds correctly spelled words which are close matches to your misspelled
    word, you will see the possibilities. You may also choose to add a word which
    is correctly spelled, but WordPerfect does not recognize. The added word (and
    any other occurrences of it) is then considered correctly spelled. You may also
    choose "skip" and move on to the next word.'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# Adding an Image to Your Document


    It is very easy to add images or clip art to your documents. Place the cursor
    where you would like to insert or draw a picture. Click “insert,” then “graphics.”
    Then choose “from file” if you want to insert an existing image. Choose “draw
    picture” if you want to draw your own. This feature is available only with the
    commercial version of WordPerfect.


    If you choose to insert an image from a file, a window will pop up and you can
    move around your directories and choose the file you want.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_293_0.png)


    Figure 15-17 Insert an Image or Drawing


    > WordPerfect has no image preview. We suggest that you open GQView, or another
    image viewer. This will make it easier to choose the image you want to add to
    your document.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_293_1.png)'
