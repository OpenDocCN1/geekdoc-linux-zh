- pgno: 140
  md: '# CHAPTER

    ## 8


    # # The Command-

    Line Interface


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_140_0.png)


    After having made much reference to the command line throughout the course of
    this book, it is time to step back and take a look at it. Most users will find
    the command-line interface rather dull, unexciting, and complicated. However,
    there are some commands that cannot be run from inside the X-Window System and
    must rather be run from a terminal window. And you may find that the command line
    is more than just geekspeak or esoteric technobabble. It can be truly useful and
    interesting. Well, at least useful.


    The command-line interface usually seems quite technical and difficult to most
    users, even some of the more proficient UNIX users. But it is important that you
    be able to understand it conceptually, since that will allow you a measure of
    comfort using it. As they say, “Know thine enemy.”


    First, let’s introduce the terminal, since that’s how you will interact with the
    command line.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# ## What Is a Terminal?


    The terminal is sometimes called the “console.” (When we installed Linux, there
    was a component called “console multimedia.” This component contains programs
    that will play sound files and movies from the command line.) You will find that
    both of these terms, that is, terminal and console, are used imprecisely.


    Precisely speaking, defining a terminal isn’t the easiest of tasks. Monitors connected
    to a computer through a network are called terminals. Your library probably makes
    use of these terminals to hold its card-catalog database.


    The word *terminal* is also often used as shorthand for *terminal emulation*.
    Terminal emulation is essentially a keyboard “map” that a remote computer uses
    to ensure that what you type on the keyboard is what you see on the screen. (It’s
    called a *map* because it maps out the keys on the keyboard so that the terminal
    knows how to react when you press a button like the tab key, for instance.) Examples
    of such terminal emulations are VT-xxx (52, -100, -202, -220, and so on), ANSI,
    and others. The most commonly used text-based terminal is VT-100.


    We have been using the word “terminal” in the context of a window that allows
    you access to the command-line interface. This is sometimes called a *virtual
    terminal*, since you aren’t actually on a physical terminal on a network, like
    the terminals on our library network we described above.


    You should assume that we use the final definition of terminal, a virtual terminal,
    when the word is used unless otherwise indicated.


    # ## What Is the Command Line?


    Before you use the command line, it is helpful to know conceptually what it is
    and what it can do for you. It is relatively simple to give you a list of commands
    and say, “This is what they do, now go have fun.” But you will probably learn
    little from that kind of an example, and it is usually more comfortable to know
    a little bit about what you’re getting into before you go about doing so.


    So what we’d like to do now is point out a few things about the command line,
    such as what it actually is and what we do with it. Later we’ll look at why you’d
    even want it, if it seems so esoteric and scary.


    The term *command line* is given to describe the interface between you and the
    computer. It is called a “command-line interface” because you input *com-*'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'mands after a prompt on a *line* on your screen. That line is appropriately
    known as the *command line*.


    So that is what the command line *is*. What you can *do* with it is another matter
    entirely. You interact with your computer using the command-line interface; when
    the cursor sits there calmly blinking in silence, the computer is asking for some
    instruction. These instructions are given in the form of commands. Each command
    is assigned a name and performs a specific task. You''ll find commands that control
    your file listing, modifying files, removing others, creating text documents,
    comparing one file to another, and so on and so forth. You''ll find programs that
    will tell you about running programs, disk size, and myriad other administration
    activities. You''ll find programs that will assist you in navigating the filesystem
    or with finding other commands. The list is nearly endless, and so are the capabilities
    of the command line.


    # How to Use the Command Line


    When you click on your terminal icon on the panel, a new window will appear with
    a prompt at the top that looks something like this: `[ emetser@ localhost] ~ $`
    . This is known as the *command prompt*.


    You interact with the command line by typing in commands at the prompt. Since
    we''ve worked with the installation of Linux and a few of its many facets, you''ve
    used the command line for a variety of purposes. You''ve used the command line
    to set up the modem and your soundcard, for instance.


    Now it''s time to become familiar with a few of the more common commands used
    in Linux. These won''t make you a classy systems administrator or a UNIX guru,
    but you''ll be able to navigate your system much more proficiently.


    # A List of Commands


    | Command Name | Options | Description |

    |---|---|---|

    | apropos | [command] or [part of command] | This will find a man page for a command
    or keyword you type in. |'
  merge: -1
  img_proc: true
