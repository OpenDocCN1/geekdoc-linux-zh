    # Mounting Drives and Partitions


    So far, we have only mounted and unmounted drives or partitions from GNOME. While
    this process is quite simple—just use the drive configuration utility—you can
    also do it from the command line rather easily. You might find the command line
    version more useful if you wish to mount a drive from your regular user account.
    Logging back into root to use the disk configuration utility is annoying at best.


    To mount drives from the command line, we''re going to use the mount command.
    The basic syntax of mount is as follows: mount -t \[ type\] \[ device\] \[ mount
    point\]. There are several different types of drives that Linux supports. Here''s
    an incomplete list with their descriptions:


    +   *   **ext2** This is the basic Linux file system. All newer drives formatted
    under Linux will use this file system.

    +   *   **ext** This is the old Linux file system—it''s now obsolete, so you''ll
    only use it if you have an older Linux drive to mount.

    +   *   **vfat** Drives which make use of the FAT32 allocation table, such as
    those formatted under Windows98 and 2000, or Windows NT 4.0 and higher.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '124  Everyday Linux


    +   • msdos Drives compatible with MS-DOS and using the FAT16 allocation table
    should be mounted using the msdos type.

    +   • hfs Users who want to mount drives from their Macintosh computers should
    use the hfs file system.

    +   • iso9660 This is the type that you''ll use for your CD-ROM or CD recording
    device.


    These are the more common types that you''ll use, but you can also use types such
    as minix, bsd, and many others. Even OS/2 formats are supported.


    After the type comes the device. The device is simply a device profile stored
    in the /dev directory. We talked about how IDE and SCSI devices were named in
    Chapter Two, when we talked about the partition summary categories. If you''re
    not sure what devices are active on your system, you can always run the disk configuration
    utility or linuxconf to find out.


    The mount point is usually an empty directory stored in the /mnt directory. For
    instance, your mount point for the floppy drive is /mnt/floppy. For the CD-ROM,
    it''s /mnt/cdrom. You should create directories for the various drives you wish
    to mount; my Windows disk, for instance, is mounted on /mnt/win.


    So let''s go through the process of mounting a drive. I''m going to use one from
    my computer as an example. I dual boot, meaning that I''m running both Red Hat
    Linux and Microsoft Windows 98 on the same computer. When I use Red Hat, I have
    a few data files from Windows I still like to tool around with, so to take advantage
    of them I have to make sure that my Windows drive is mounted.


    To do this from the command line, I first make sure I''m the super user (by using
    the su command). I then type in mount -t vfat /dev/hdb1 /mnt/win. This translates
    to, "Mount a drive of type vfat with a device profile stored in /dev/hda1 at the
    mount point /mnt/win." A couple seconds later, the mount point has grown a directory
    tree with all of the information from my Windows drive in it.


    This is a simple process, though it might take you a little while to get used
    to. If you want to see what drives are mounted at the present time, simply type
    mount without any arguments. A list of the devices and mount points will appear.
    If you want to unmount a drive, you''ll use the umount command. The umount command
    is considerably easier to use than the mount command, which you''ll notice rather
    quickly. The syntax of umount is as follows: umount [ device ] or [ mount point
    ].'
