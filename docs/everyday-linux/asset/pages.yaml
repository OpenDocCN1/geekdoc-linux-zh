- pgno: 86
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_86_0.png)


    # # CHAPTER 5

    # Beginning Systems Administration


    We hope our forays into customizing GNOME have supplied you with some familiarity
    with the X-Window System. If you don''t feel too confident with the system yet,
    don''t worry too much. This section is designed to increase your confidence while
    using your Linux system as well as introducing basic systems administration.


    The first subject we want to deal with is that of using your modem. After that
    we look at configuring your printer. Then we want to look at using the Linux Configurator;
    our big example will be adding user accounts, though you should realize that the
    Linux Configurator is a program with a lot of different options.


    The first order of business is to log in, using the root account. If you want,
    you can customize how this account looks, too, before we begin setting things
    up. After that, it''s on to the modem and beyond!'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# The Control Panel—Your Friend


    Figure 5-1 is a picture of the control panel. The control panel is where we''re
    going to look at a number of different setup options, such as setting up the printer,
    setting the date and time, running your network configuration, and, of course,
    setting up the modem.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_87_0.png)


    *This is the control panel. Notice the icons on it, we make reference to these
    throughout this chapter.*'
