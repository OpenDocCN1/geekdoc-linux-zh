- pgno: 302
  md: '# Taking Notes with KJots


    You will find KJots under the utilities in the main KDE menu.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_302_0.png)


    Figure 16-3

    KJots.


    You can save your notes in a series of topics, called books by the program. Click
    “file” and “new book” to begin using KJots. Another little window will appear
    and you can give your book a name. You might want to use things like groceries,
    computers, meetings, phone calls, etc. as your topics. Each time you create a
    new book you must click “file” and “save book.”


    When you want to jot down a note to one of these topics, simply click on “books”
    and choose the topic you want. At the bottom type in a subject, and in the main
    window type in whatever notes you want.


    To add a new page to the book, just click “edit” and “new page.” You will stay
    in the same book, but will be able to type in a new subject and notes.


    You can use KJots to keep track of all sorts of things, and just think of the
    paper you will save!'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# GNOME Calendar


    GNOME provides an excellent way to keep track of daily, weekly and monthly events.
    Choose “calendar” from the GNOME applications menu.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_303_0.png)


    The calendar comes up with a day view. You can see the hour blocks on the left.
    You can add specific events during the day by clicking on the hour block and then
    typing in the event. To get an hourly calendar for a different day, simply double
    click on whatever day you want from the calendar on the right.


    You can add “to do” lists for any day by selecting that day and then clicking
    on the “add” button under the “to do” window at the bottom right. These will show
    up when you look at the weekly or monthly calendars.'
  merge: -1
  img_proc: true
