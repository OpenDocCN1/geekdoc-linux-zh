- pgno: 362
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_362_0.png)


    **Figure 20-4**

    *Gnibbles.*


    # Gnome Stones


    Gnome Stones is just like an old favorite video game, Boulderdash. The game involves
    moving about caves and other areas, and collecting the diamonds and avoiding the
    boulders. If you tunnel directly under a boulder, it will fall on you and kill
    you. You also must be careful to move quickly when tunneling near a stack of boulders
    as they will fall on you.


    You move around in Gnome Stones by using the arrow keys. You have a limited amount
    of time to get all the diamonds, and then you must find the exit and move on to
    the next level.'
  merge: -1
  img_proc: true
- pgno: 363
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_363_0.png)


    **Figure 20-5**

    Gnome Stones.


    # Gnotravex


    Gnotravex is a game of skill where you are given a board of nine spaces and nine
    blocks with four numbers on each. You must place all the blocks in the nine spaces
    so that all the numbers match up on all sides. With only nine spaces it isn''t
    too difficult, but the game allows for up to 36 blocks! Try that one!


    # GTali


    Gnome Tali is a GNOME version of the popular board game Yahtzee. It is more or
    less like poker with dice. The game comes with full instructions found by clicking
    "help."


    The game default is for one human to play against three computer characters. You
    may change the defaults to have additional human players or fewer computer characters.'
  merge: -1
  img_proc: true
