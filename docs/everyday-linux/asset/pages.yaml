- pgno: 162
  md: 'The first thing you should do is type **minicom -s** at the prompt. This tells
    Minicom to start up in a setup mode. You need to save the settings in a .dll file.
    The text menu that appears has this option available. Use your arrow keys to move
    through the list, and when you read the item that says, “Save config as a .dll”
    press the enter key. You can then exit Minicom.


    The next step is to make sure that all users can read and write to the modem device.
    To do this, type in **chmod 766 /dev/modem** at the prompt. This tells the computer
    to allow everyone to read and write to the modem device and gives full permissions
    to the owner (who is root).


    Then type **exit** to leave the superuser’s environment. You should be back to
    your regular user. To make sure, type **whoami**. Your username should appear.
    If it doesn’t, type in exit and check again. Repeat this process until your own
    username appears.


    Then you should be able to run Minicom, either by typing in the command **minicom**
    at the command prompt or by running it from the main menu’s “Internet” submenu.


    # # Why the Command Line?


    Since most of this is still probably not familiar to you, you might be asking
    yourself the purpose of the command-line interface. Aside from the obvious reason
    that the X-Window System requires it to operate, of course, the command-line interface
    is quite useful.


    The more familiar you get with the command line, the more efficient you will be
    at systems administration. You will also be able to correlate actions in the X-Window
    System to the same commands on the command line (finding files, for example, or
    editing some of your network settings).


    The command line is more technically oriented than the standard point-and-click
    method of adding users or editing the system profiles, but when you become proficient
    at using the command line, you’ll find that it takes you less time to make certain
    changes with the command line than it does using the X-Window System.


    Another good reason to have the command line available is that it is a fallback
    measure if the X-Window System fails. On rare occasions, you will find a bug somewhere
    in the system that might temporarily disable your graphics cards'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'ability to render the GUI environment of the X-Window System properly. Usually
    just typing startx will fix the problem, but if you have to reboot or edit a configuration
    file located in the /etc directory, you should know how to do it.


    Also, we shouldn’t forget that there are some commands which cannot be run solely
    from the X-Window System and must be run from the command line (such as Xconfigurator,
    or some of the console multimedia programs).


    # In Closing


    It’s also important that you feel comfortable with experimenting with the command-line
    interface. You can even create a test account for experimentation purposes; as
    long as you don’t use the root account, you can’t really damage the system severely.


    Experimentation is one of the best ways of learning how to use your Linux system.
    Some procedures are cookie-cutter in nature and require no improvisation; others,
    however, may require a more creative attack, and you can always experiment a little
    bit to see how things really work.'
