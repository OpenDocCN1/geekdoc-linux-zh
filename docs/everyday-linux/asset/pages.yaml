  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_198_0.png)


    # # CHAPTER 11


    # ## Star Office Basics


    # ### What Is Star Office?


    Star Office did a great service to the Linux community with a free office suite
    for Linux. Originally owned by a German company, Star Division, the office suite
    is now the property of Sun Microsystems. Since that time the office suite has
    been updated and remains free. Even more exciting news came in July 2000 when
    Sun announced that it was making Star Office Suite open source. This will likely
    lead to rapid additions and updates.


    There are many programs within the office suite such as a word processor, scheduler,
    presentation program, database program, spreadsheet and more. Entire books have
    been written on Star Office Suite so we will just familiarize you with the very
    basics so that you may get started using the office suite. If you find you like
    Star Office and want to learn more about what it can do, we would suggest purchasing
    one of the books on Star Office.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# Installing Star Office


    You can download Star Office from Sun Microsystems at http://www.sun.com/staroffice.
    It is a large download of about 100 megabytes. Though downloading it is free,
    because of the size, you might consider purchasing a CD with Star Office on it.
    You can purchase CDs from Sun Microsystems and many other places where software
    is sold.


    To install a downloaded version of Star Office, do the following from a program
    such as xterm:


    +   1. Because the file is compressed, untar it by typing: **tar zxvf filename**
    (where filename is the name of the file you downloaded).

    +   2. Change to the directory created by untarring the file: **cd directoryname**.

    +   3. Run the setup by typing: *./setup*.


    The remainder of the install is the graphical setup from Sun, it is very easy
    and just asks a few basic questions you will need to answer.


    To install from a CD:


    +   1. Place the CD in your CD-ROM and double click on the CD icon on your desktop.

    +   2. Change to the Linux directory.

    +   3. Change to the Office52 directory.

    +   4. Double-click on the setup file and this will start the graphical install.


    # Starting Star Office


    You can start Star Office two different ways. On a command line you need to tell
    Linux where Star Office is and what command to use to start the application. Assuming
    you have installed Star Office in your home directory, the path and command to
    use would be:


    ```

    `cd office52/`

    ```


    Hit enter and then type:'
  merge: -1
  img_proc: true
- pgno: 200
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_200_0.png)


    # **Figure 11-1**

    *Using Explorer to Look at the Star Office.*


    ```

    `.soffice &`

    ```


    Note that the "&" tells Linux to start the application and return the command
    line to the user.


    Also, you must be in your home directory to type this command.

    A simpler solution than worrying about command lines and paths is to create a
    launch button in your desktop panel.


    # ## Making a Launch Button to Start Star Office


    Rather than having to pop up a terminal window and type in a command every time
    you want to start Star Office, you might choose to make an applet launch button
    for your desktop panel. To do this, read the instructions for creating launch
    applets in Chapter Four.'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# Managing the Desktop


    Star Office is an integrated office suite, which means that it is designed so
    that individual components will work with each other. For example, you might create
    a spreadsheet with StarCalc and then wish to use the spreadsheet in a document
    in StarWriter. Because the components are integrated, you can do so without having
    to modify it.


    The main desktop is always available through an icon located at the bottom left
    of any Star window. When you have multiple windows open, you can switch between
    them by using the buttons below the desktop. The area that comes up on the desktop
    on start-up is the work area.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_201_0.png)


    Figure 11-2

    Star Office Desktop.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_202_0.png)


    # Hint


    You can customize the Star Desktop in many ways. Right-click once with your mouse
    on the desktop and a panel will pop up. Choose properties and you will see options
    for customization.


    There are two other areas which you can make appear, Explorer and the Beamer.


    # Explorer


    The explorer in Star Office organizes such things as mail, bookmarks, news-groups
    and files.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_202_1.png)


    **Figure 11-3**

    *Star Office Explorer.*'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'Bookmarks represent either links to websites on the Internet or locations within
    your file directories. You can even have a bookmark link to a place within a document.


    You can set up the mail so that Star Office will retrieve your e-mail. We will
    cover this in the section for StarMail.


    Explorer will allow you to view your directories and files on your computer.


    # Beamer


    The Beamer is a small window which will open and show you the contents of directories
    or graphics files listed in the Explorer window. Try double-clicking on "gallery"
    in Explorer. Now double click on "clipart." The contents of the directory will
    be displayed to the lower right, and thumbnails of the images will be displayed
    in the Beamer.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_203_0.png)


    **Figure 11-4** *Star Office Beamer.*'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# Tip


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_204_0.png)


    You can either hide or display the Explorer and/or Beamer on the Star desktop
    by clicking “view” and then “Beamer” or “Explorer.”


    # Adding a Printer to Star Office


    You will most likely want to print documents in Star Office, so you will need
    to install a printer. Even if you have already installed a printer on Red Hat,
    you will still need to add your printer to Star Office.


    From the main Star Office desktop, double-click on Printer Setup icon.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_204_1.png)


    File: /home/kmiles/office52/share/ngp/Xpdfaults


    # Figure 11-5


    *Printer Setup*'
