  md: This window summarizes what will be done, and where the new files will be placed.
    If this information is correct, click “import.” If something is not correct, just
    click “back” and correct the information. Once you click import, a new window
    will pop up and tell you how many files it found and show its progress at importing
    files. The window will disappear when all the files have been imported.
