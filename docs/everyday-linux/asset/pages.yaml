  md: 'Choose the file you want to open and click “open.” The file will then be opened
    in a WordPerfect 8 window. The backup will then be deleted.

    After the backup file has been opened you will see a warning window pop up which
    tells you that it is deleting the backup file. It also informs you that if the
    file had been password protected it is no longer and the password has also been
    deleted.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_289_0.png)


