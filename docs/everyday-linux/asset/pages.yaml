  md: 'Like the rm command, you’ll find that you don’t get any confirmation that the
    directory was actually created. So you’ll need to do another file listing to make
    sure that it’s there. (It will be, don’t worry.)


    To further our example, let’s assume for the moment that your father sends you
    a lot of pictures he’d like you to store on your system while he’s reformatting
    his hard drive—it’s information he doesn’t want to lose, but not enough to justify
    using a tape backup or something similar. You might want to make two pictures
    directories to hold his pictures and your own, so you would use the mkdir command
    to do so. However, now your original pictures directory might be inappropriately
    named—you’d like to rename it to “mypictures.”


    This is where the mv command comes in. The syntax for the mv command is `mv [
    source ] [ destination ]`. This command not only renames files, it can also move
    them. The syntax for both is the same. To change the name of your current pictures
    directory to “mypictures,” you would type in `mv pictures mypictures`. Again,
    you’ll get no confirmation, but you can do a directory listing to ensure that
    the directory was appropriately renamed.


    So you’ve received these pictures from your dad and created a directory for them
    called “dads\_pictures.” When you got them, though, you saved them to your home
    directory, and now you’ve got a slew of images in there that need to be copied
    to the “dads\_pictures” directory. Enter the cp command. Cp is short for “copy,”
    and its syntax is as follows: `cp [ source ] [ destination ]`. The difference
    between the cp and the mv commands is that mv will actually remove the file after
    copying it to its destination.


    To move all of the files with an extension .jpg, we use what is known as a *wild-card
    character*. A wildcard character is used to substitute for all of the other characters
    that match the argument you pass to a command. In this case, we’re passing all
    files with the extension .jpg to the command cp. The wildcard character is the
    asterisk (*), and we write “all of the files ending with .jpg” in computer lingo
    as “*.jpg”.


    So, let’s copy all of the files with a .jpg extension to the “dads\_pictures”
    directory we created. To do this, type `cp *.jpg dads_pictures`. There’s no real
    confirmation that this worked. However, unlike some of the commands we’ve looked
    at, using a simple ls command will not demonstrate that we’ve done the job.


    To look at the files in the “dads\_pictures” directory, you need to type the command
    `ls dads_pictures` rather than just `ls`. If there are files in the directory,
    then you know that you’ve done the job right and things are just fine.'
