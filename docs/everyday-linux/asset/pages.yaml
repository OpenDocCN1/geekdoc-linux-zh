    gimp will appear, and you''ll probably find exactly what you''re looking for.


    Once you find what you''re looking for, you can query the package, install it,
    or upgrade it, the same way you would if you were installing from a CD or another
    disk.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# **Stable vs. Unstable Releases**


    Normally, program updates are released frequently, but as we noted before, there
    are usually many bugs in the program, especially in the beginning stages. A release
    is said to be stable (or frozen) if the release has very few bugs or stability
    problems. If it still contains many major bugs or runs fitfully, it is said to
    be an unstable release.


    It is almost always best to use stable releases of software; this will prevent
    problems from eventually cropping up in your software. If you’re interested in
    seeing improvements in software, make sure you’ve got the earlier release backed
    up. Then install the newer, unstable release and see what the differences are.


    # # Backups


    You will find that your Linux system is incredibly stable and susceptible to few
    viruses and other calamities that befall many computers running Windows. (A majority
    of the hundreds of viruses created each month are geared towards systems running
    Windows9x. Most of the news-making e-mail viruses target computers that use Microsoft
    Outlook as the default mail program.)


    However, it is prudent to make backups of your data periodically. You will probably
    want to use Zip drives or tape backup systems to protect your data, but another
    option does exist which I’ll discuss briefly. (You’ll be able to find more information
    about it on the Internet.)


    This is what is known as a RAID disk array. There are six levels of RAID disk
    protection, each with varying characteristics. Smaller systems may make good use
    of a RAID-1 disk array, which uses a process known as *mirroring* to protect files.


    A RAID-1 disk array requires that you have two times the number of drives that
    you wish to protect. When you write to one disk, the same data is automatically
    written to the mirroring disk.


    Using a RAID array has both pros and cons. It is a very secure way of ensuring
    that you lose no data. In the event that one hard drive suffers from a “heat stroke”
    (it becomes overheated and loses data), the other drive is a ready backup. Unfortunately,
    it is also relatively slow—writing data twice consumes about twice as much time
    as writing it once.'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'Setting up a RAID-1 array is relatively easy, but you will need to have a special
    card for your computer and two hard drives of approximately the same size. Make
    sure that you total up the cost of the card and the second drive if you think
    about using a RAID disk array. Usually it comes out to about the same cost as
    a two gigabyte tape backup system.


    # ## Adding Eye Candy


    In Chapter Three, we discussed configuring themes for Enlightenment or grabbing
    new ones. There are other bits and pieces of eye candy you can get as well, such
    as extra screensavers or applets. Eye candy is occasionally considered a waste
    of time, but it improves the look of your desktop. Most users will find it quite
    useful, especially if you change your theme to fit your mood.


    Besides this, occasionally you''ll want to add a few themes for other users on
    the system too, so it''s not as though you''re working entirely for yourself.
    The extra applets and screensavers won''t hurt, either.


    # ### Themes


    The prime spot for themes is www.themes.org. You''ll be able to find others through
    searching the web, of course, but themes.org has about 2000 themes on hand, ready
    for download and installation. You''ll find plenty of searching power on themes.org,
    so you can find exactly what you''re looking for.


    Since the default window manager in GNOME is Enlightenment, you''re going to want
    to download themes that are compatible with Enlightenment. These themes have been
    given their own simple web site on themes.org; this is e.themes.org. Alternatively,
    you can simply click on the word "Enlightenment" at the themes.org main page.


    When you find the theme that you want to install, you need to download it. Normally,
    Netscape will ask you the location of where you would like to save the file that
    you''re downloading. If you wish to install a theme for every single user on the
    system, you must place it in what themes.org calls a "global repository" — a place
    where everyone can access the file. In Red Hat Linux, this global repository is
    located in the directory /usr/share/enlightenment/themes.


    When you download the file, you should save it there. If you cannot, you will
    need to copy the file from the present directory to the themes directory.'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'should also make sure that the permissions for the file allow everyone to use
    it. You can either change these by looking at the file properties through the
    file manager or use the process detailed in the next chapter.


    If you want to keep a theme all to yourself, you should save it in your own directory,
    under the .enlightenment/themes directory. In this case, you probably don’t need
    to change the permissions, and you won’t need to download the theme as root or
    mess with ownership or permissions.


    # **Applets**


    If you want to get more applets, you’ll probably want to use www.gnome.org as
    your source; it’s GNOME’s web page.


    From GNOME’s web page, you should be able to download new software by clicking
    on the “Get More Software” link at left. A software map will appear that will
    allow you to search through various categories, such as entertainment, system,
    core, etc., etc.


    Most of these files are tarred and gzipped, so you’ll need to make sure you read
    and understand the directions in the section of this chapter called “Tarred Files;
    Gzipped Files.” Each of the software packages will come with instructions about
    installation, which you’ll be able to read for yourself upon downloading them.


    # **And So On . . .**


    You will find that there are many other tasks that you will need to perform as
    an administrator. But you will also find that with regular checks and taking care
    not to mishandle the system, your Linux machine will run perfectly for as long
    as you own it.'
  merge: -1
  img_proc: true
