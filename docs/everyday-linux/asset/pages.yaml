  md: "![](img/92fb6d8ad19de3b3470ba95c7b71b82e_361_0.png)\n\n**Figure 20-3**  \n\
    *Playing Chess.*\n\n# Gnibbles\n\nGnibbles is an entertaining game involving a\
    \ wandering worm. The object of the game is to eat up the diamonds that appear\
    \ on the screen without crashing into the sides of the box surrounding your worm.\
    \ As play goes on, the worm gets longer, making it a new challenge not to crash\
    \ into yourself as well as the box sides. You use the arrow keys to move your\
    \ worm about the board.\n\nAs levels increase, so do the number of diamonds and\
    \ obstacles you must avoid.\n\nThere are several skill levels, ranging from “Nibbles\
    \ Newbie” to “Finger Twitching Good.”"
  merge: -1
