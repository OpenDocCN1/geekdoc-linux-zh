  md: '# File and Directory Manipulation


    If you don''t use the Midnight Commander as much as you can (it''s usually easier
    than navigating directories in a regular manner), you''ll need to know how to
    remove files and directories and make directories.


    There are several commands we''d like to look at: cd, ls, rmdir, mkdir, mv, and
    cp. These commands will allow you to navigate the directory tree and manipulate
    what files and directories are in it.


    Make sure that you''re in a terminal. The first step is to see what''s in your
    directory. To get a file listing, type `ls`. A series of files and directories
    will appear, though they''ll be in a short form, not the longer form we saw above.
    If you want to see your files distinguished from one another (executable files
    will be starred with an asterisk; directories will end in a forward slash), you
    can type `ls -FC`. This will force the listing to fit into columns (C) and produce
    a formatted output (F).


    This is your file listing. We created a file called “myfile” in the permissions
    section of this chapter—it should be listed here. It''s more or less wasting space,
    so we''d like to remove it. If you changed the ownership of the file to root,
    you''re going to have to change it back to your own user. (Type in su. Then follow
    the procedure for changing the owner of the file mentioned above. Type in exit
    when you''re done.)


    Once it''s your file again, or if you never changed the owner in the first place,
    we can remove it. To remove a file, you use the rm command. Its syntax is as follows:
    `rm [options] [filename]`. We have no options here, so we simply want to type
    in `rm myfile`. You will get no confirmation that the file is actually deleted.
    All that will happen is you''ll see another blank line appear. (If the file didn''t
    exist, you would get an error message to that effect, however.) To find out if
    the file is there or not, you''ll have to look at another file listing.


    Now let''s do something a little more exciting. Well, maybe a little more exciting.
    Many users will want to save pictures that they see on the Internet or that others
    send to them via e-mail. If you receive enough, it''s rather stupid to keep them
    all in the main directory—they''ll clog up your file listing and make it difficult
    to know what you''ve got stored there. To fix this problem we''ll create a pictures
    directory.


    To do so, we''ll use the `mkdir` command; its syntax is as follows: `mkdir [directory]`.
    Simply type in `mkdir pictures` to create the directory.'
