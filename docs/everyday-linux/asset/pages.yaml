- pgno: 226
  md: '# # CHAPTER

    # 13


    # # StarCalc


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_226_0.png)


    StarCalc is the spreadsheet portion of Star Office. Spreadsheets are useful for
    storing and organizing information. There are a number of templates which you
    can use for creating household budgets, car financing, loan and mortgage calculations,
    cash journals and even stocks manager. StarCalc can do more than just make spreadsheets
    however; it can graph the results, make calendars and more.


    # ## Spreadsheets


    # ### Creating and Saving Spreadsheets


    To begin a new spreadsheet, click “file,” “new” and “spreadsheet.”


    The empty rectangular areas are called cells. Click on one of the cells to begin
    entering data. To move across the row, use the tab key. To move to the cell below,
    use the enter key. You may also use the arrow keys to move around the spreadsheet.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_227_0.png)


    # Figure 13-1


    StarCalc Spreadsheet


    When you are finished with your spreadsheet and want to save it, click “file”
    and then “save.” The first time you save a spreadsheet, StarCalc will use the
    “save as” window. By default, StarCalc saves spreadsheets in its native format
    (.sdc). If you want to export your spreadsheet in another format so that you might
    view it in another spreadsheet program, use “save as” and choose from the document
    types window.


    StarCalc will both save and open Excel spreadsheets.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_228_0.png)


    **Figure 13-2**

    *Formatting a Cell.*


    # # Formatting Cells, Rows and Columns


    You may format an individual cell, or partial or entire rows or columns of cells.
    Format can include type numbers (percent, currency, scientific, etc.) font, borders,
    and more.


    To format a single cell, just click on the cell and then, from the menu at the
    top, click on “format,” then “cell.” When you are through formatting, press “ok.”
    This will affect only the cell which you had clicked on. If you add data to the
    cell and then hit enter, the next cell will revert back to whatever the previous
    formatting was.


    To format multiple cells, simply click on the first cell and then, while holding
    down the mouse button, drag over the cells you want to format. Then click “format,”
    and “cells.” You can also select the entire row or column for formatting by clicking
    on either the row number or column letter.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_229_0.png)


    # Figure 13-3

    Selecting Multiple Cells.


    # Totaling Columns of Numbers


    To total the cells in a column, simply click on the bottom cell of the column
    and then click the sum button. The sum button is the button which has \u03a3 as
    a symbol. Once you do that, two new buttons will appear in its place. One is a
    green check mark and the other a red “x.” If you want to have the sum of that
    column, click on the check mark, otherwise click on the red x to exit back to
    data entry.


    To total several columns, just click on the bottom cell of the first column and
    then drag it across the other columns. Then just click the sum button. You can
    also total rows in the same manner as you do columns.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# Making a Chart from Your Spreadsheet Data


    Charts often make it easier to see what''s going on with figures, and StarCalc
    makes it possible for you to graph your data in a chart that can be placed right
    on your spreadsheet.


    First, select the columns and rows you would like to make a chart from.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_230_0.png)


    **Figure 13-4** *Selecting Rows or Columns.*


    Once they are selected, click on the insert object button on the vertical toolbar.
    This is the toolbar which runs up and down to the left of your spreadsheet. When
    you do this, the cursor turns into a plus sign with a tiny chart attached to it.
    Choose a blank area on your spreadsheet, and then click and drag the cursor over
    the area where you want your chart to be. This will determine the initial size
    of your chart. When you release the mouse button, the auto format chart window
    will pop up.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_231_0.png)


    # Figure 13-5

    Adding a Chart.


    There are four parts to the auto format chart operation. You will be asked to
    choose what type of chart you would like to create and some specifics about it.
    There is a preview window on the left which will show you how your data will look.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_231_1.png)


    # Figure 13-6

    Formatting the Chart.'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'When you are finished formatting your chart, click "create" on the last window.
    Once you do this your chart will be created and appear on your spreadsheet where
    you may resize and position it.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_232_0.png)


    When you have your chart positioned where you want it, right-click and then choose
    "anchor." Then click on the chart to anchor it to the spreadsheet.


    # ## Creating a Calendar in StarCalc


    You can use StarCalc to create a monthly or yearly calendar which you can then
    customize or add events which you want to remember. To begin creating your calendar
    click "file," then "new," and "from template."'
  merge: -1
  img_proc: true
- pgno: 233
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_233_0.png)


    When the “new from template” window pops up, click on “miscellaneous” in the box
    on the left and then choose “month/year” calendar on the right. Click “more” to
    see a preview, and click “ok” to begin creating your calendar.


    After clicking “ok” to the “new from template” window, a new window will come
    up called “StarOffice Calendar.”


    You can choose either year or month. If you choose month, you will need to specify
    which month. To enter in events you want to remember, click “personal data.”


    Using this window, you can enter the event (a birthday, or some other special
    event you want to remember). Enter the day and month of the event and then click
    “insert.” You may enter as may events as you like. When you are done, click “ok.”
    StarCalc will create your calendar.


    You will notice that the calendar is divided up into rows and columns just like
    a spreadsheet. You can move around the calendar just as you do with a spreadsheet,
    using arrow keys to add events as needed.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_234_0.png)


    # **Figure 13-9**


    *Star Office Calendar.*


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_234_1.png)


    # **Figure 13-10**


    *Adding Data to the Calendar.*'
  merge: -1
  img_proc: true
- pgno: 235
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_235_0.png)


    # **Figure 13-11**

    *Created Calendar.*


    # ## Creating a Database Using StarBase


    StarBase is the portion of StarOffice used to create and manage databases. Databases
    are useful for handling addresses, inventories and any other type of list. Once
    you have a database of information, you can search through it easily as well as
    sort it in many different ways.


    Your database is created by using database tables. The tables look similar to
    the tables used in StarCalc worksheets but there are some differences in formatting
    and arrangement.


    # **Database Formats**


    There are quite a few different format types for databases. If you are just creating
    a database for your personal use, you could choose any type. However, if you'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'are going to be sharing the data, you will need to choose a format compatible
    with everyone who will be using it.


    One of the most widely used formats is dBase, most often used in the DOS/Windows
    environment. The ODBC format uses the SQL language and is the type used by Oracle,
    Sybase, Informix and other large databases. Text format is a last resort when
    there are no other options.


    # Creating a New Database


    It''s a good idea to put your database in a directory all its own, especially
    if you might create more than one database. Multiple databases in one directory
    can easily lead to tables getting intermingled and other problems.


    You can create a new directory using your directory explorer on your Red Hat desktop.
    Click "file" and then "new," and then choose "directory."


    A new window will pop-up and you can then type in the name of the new directory.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_236_0.png)


    **Figure 13-12**

    *Creating a New Directory.*'
  merge: -1
  img_proc: true
- pgno: 237
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_237_0.png)


    **Figure 13-13**

    *Naming the New Directory.*


    From your Star Office desktop, click "file," "new," and "database." The Properties
    of Database window will pop up.


    There are four tabs at the top of this window. The first tab is general properties
    and where you will give your database a name. Type the name into the field provided
    under general.


    Click on the “type” tab to select the format you want to use for the new database.
    Though there are several formats for databases, we are going to use dbase in our
    examples. Select dbase from the “database type” field and then below that, specify
    which directory your database will reside in.


    **TIP**


    Once you choose a type of database (dbase, ODBC etc) you will see the third tab
    in the window change to the format you choose.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_238_0.png)


    # **Figure 13-14**


    *Properties of Database.*


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_238_1.png)


    # **Figure 13-15**


    *Selecting the Database Format and Location.*'
  merge: -1
  img_proc: true
- pgno: 239
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_239_0.png)


    # **Figure 13-16**


    dBase Settings.


    Click on the "dBase" tab to choose settings for this type of database.


    The first option is to toggle on or off the setting for "Display inactive settings."
    You will not need to check this if it is the first time you created a database
    in StarOffice. What this does, if toggled on, is to show old records marked for
    deletion. Although StarBase never actually deletes old records, it will mark them
    as inactive.


    The second option is to toggle on long table names. In old versions of windows
    (and DOS) a filename could only be eight characters or less. If you want to use
    longer table names, toggle on this option.


    Beneath the above two options is an option for character set. Unless you have
    a specific need to change this, leave it set for the default.


    When you are done providing the information you need to, you will be able to click
    the "OK" box from the dialogue window. Then your new database will be created.
    It will not be of much use yet, since you have not created something to put data
    into. The next thing you will want to do is create a table.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_240_0.png)


    > Remember, we are using examples for a database done in dBase format. If you
    choose one of the other formats, there may be other information you will have
    to provide before the database can be created.


    # Creating a Table using the Table Design Tool


    All of your information is managed through tables. Each table contains a series
    of fields and records. Suppose you are creating a database of your postage stamp
    collection. You might have fields for stamp number, country of origin, condition
    and value. Each stamp is entered into its own record. When you clicked "ok" at
    the end of the "Database Properties" window described above, a screen came up
    on the desktop with four icons, one of which was "table."


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_240_1.png)


    **Figure 13-17**

    *Creating the New Database.*'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'Right-click over the table icon and select "new," then "table" and then "table
    design."


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_241_0.png)


    # **Figure 13-18**


    *Table Design.*


    In the first column (under "fields") type in the name of the field. We''ll call
    ours "stamp" for our stamp collector''s example. We will choose fields called
    "stamp," "issued (for date issued)," "country," "condition," "topic," and "value."


    > **TIP**

    > The name of the field cannot contain spaces, and it cannot be over ten characters
    in length. The Table Design tool will not allow you to type a space or a longer
    name.


    Under "field type" you need to tell the program what type of data you will enter
    in this field. The "stamp" field will have text, the "issue" will have a date,
    as will value, the other fields will have text. You select the field type from
    the drop down box in that box.'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'For each field you have the option of setting a maximum length for each record,
    default value, and an example of the format which should be used.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_242_0.png)


    **Figure 13-19**

    *Designing the Table.*


    The last thing you should do as you are creating your table is type something
    under the fourth field “description.” It is a good idea to do this because the
    field name alone may not give a good description of what is in the table. You
    may not remember a few months from now if you work with a lot of tables.


    Finally, save the table by clicking “file” and “save.”


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_242_1.png)


    > **Tip**

    > You may also create a table by using AutoPilot. Right-click over the table icon
    and select “new,” then “table,” and then “AutoPilot.” You need only follow the
    directions to create a table.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# **Importing a Table**


    It is very easy to import a table from an existing database. You need only copy
    the file to the directory where the database you want to use it in resides. The
    table will automatically be added to the table list.


    # **Adding Data to a Table**


    When you are ready to add data to your table you will need to open the explorer
    window until you can see your list of databases. Under each database you will
    see icons for forms, reports, queries and tables. If you already have created
    the tables, then there will be a small plus sign to the left of the tables icon.
    Expand the list by clicking on it.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_243_0.png)


    **Figure 13-20**


    *Selecting the Table.*'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'On the right, you will see the names of the tables in that directory. Select
    the one you want to use in your database and double-click on that table''s icon.


    Click on the record (you more likely would call this a cell) which you want to
    edit and then enter your data.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_244_0.png)


    # **Figure 13-21**


    *Entering Data.*


    Move around your table by using the tab key. A new row is added as soon as you
    enter data into the first record in a row.


    When you are finished adding data, click "file" and "close." Answer yes when you
    are asked whether you want to save changes.


    # **Editing and Deleting Data**


    No one is perfect and it is only a matter of time until you have the need to change
    or delete data in a record. Fear not, it is a simple thing to do.'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'To edit data in a record, simply click on that record. The contents of that
    record will be highlighted.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_245_0.png)


    # Figure 13-22

    *Editing Data in a Record.*


    If you want to change everything in that record, just begin typing. If you only
    want to change one character, double-click on that record and then move the cursor
    around and make your changes.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_245_1.png)


    > TIP

    > All the basic commands, such as Cut, Copy and Paste will work just as easily
    in your table as they do in a document. This can make it much easier to replicate
    data.


    To delete the contents within a record, click on the record and it will be highlighted.
    Then right-click over it and choose "cut." The contents of the record will be
    cleared.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# Changing a Table''s Appearance


    When you use StarCalc''s spreadsheets, you can make them look exactly as you like
    them, even flashy if that is what you desire. When you are working with databases
    however, you can only change a few things about the tables you create.


    Once you open a table for editing, right-click over one of the buttons to the
    left of the row and choose "table format."


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_246_0.png)


    **Figure 13-23**

    *Table Format.*


    This window will allow you to change the font, the font size and font attributes
    such as underline, bold, italics and others.


    You can also change the row height by right clicking on the button on the left
    of the row and choosing "row height."'
  merge: -1
  img_proc: true
- pgno: 247
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_247_0.png)


    Figure 13-24 Changing Row Height.


    When you change row height, it changes it for every row in the table so remember
    that increasing the height will take up a lot more space.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_247_1.png)


    **Tip**

    The default for row height is "automatic." You will have to uncheck this box if
    you want to set your own row height. When you uncheck automatic, you must remember
    the row will not adjust to a larger or smaller font size, you will have to do
    that yourself to make it fit.


    You can format a column by right-clicking over the button at the top of the column
    and choosing "column format."'
  merge: -1
  img_proc: true
- pgno: 248
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_248_0.png)


    # **Figure 13-25**


    Formatting a Column.


    There are two tabs on this window: "numbers" and "align." Under align, you can
    set alignment for left, right, center or justify. Changing alignment will only
    affect the column you have clicked on.


    You can change column width by right-clicking the button over a column and choosing
    "column width."


    Again, the default is automatic, which enlarges the width as the need arises.
    If you uncheck automatic, you will have to adjust the width if it is not wide
    enough.


    You have the option to hide a column. You might choose to do this if you are making
    the database part of a presentation, and do not want all your data to be visible.
    To hide a column, right click the button at the top of the column and choose "hide
    column." When you want to show a hidden column, simply right click the button
    at the top and choose "show" and then either the specific column you want to show,
    or choose "all." This will show all hidden columns.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_249_0.png)


    **Figure 13-26**

    *Changing Column Width.*


    # ### Sorting Data


    Perhaps the most important function of a database is to sort the data. When you
    add new records to the database, they are added at the bottom of the table and
    will need to be sorted with the existing records.


    You can sort data using one of the fields as the key. For example, in our stamp
    collection, suppose we want to sort data according to country. We can do this
    alphabetically either in ascending (A to Z) or descending (Z to A) order.


    Just click on the field button at the top of the column to highlight the entire
    column and then click either the "sort ascending" or "sort descending" button.


    You can do more complex sorting if you click the "sort" button, a button with
    a "Z" over an "A" to the right of the previously mentioned sort buttons. This
    will open the sort dialogue box.


    Using this box you can set a sort for several fields.'
  merge: -1
  img_proc: true
