- pgno: 384
  md: 'Click on "map" from the right side of the window and a window will appear on
    the left with a list of maps and time periods for you to choose from.


    The scenarios are authentic. For instance, choosing the Northeast US around 1955
    is a touch time. Competition was fierce and it was difficult to survive. On the
    other hand, choosing Canada about the same time was much more promising.


    You can keep track of your financial situation and see an annual company report.
    If the company is doing well, you can raise additional money by selling shares
    of the company. You are limited only by your sense of adventure and your business
    sense!


    # ## Heroes III


    Heroes III is another commercial game produced by Loki Games and New World Computing.
    It is set as an epic story of kings, traitors, castles and magic. You must command
    armies and battle evil hordes of monsters and men of dark deeds!


    # ### Installing Heroes III


    To install Heroes III, you must be root. You needn''t run X-Windows as root however.
    Bring up a terminal window and log in as root. Then type in:


    ```

    `mount /mnt/cdrom`

    ```


    Then type in:


    ```

    `cd /mnt/cdrom`

    ```


    and finally:


    ```

    `sh setup.sh`

    ```


    The install will now start and bring up a window asking you what parts of the
    game you want to install.


    When you have made your choices for installation, click "begin install." When
    the install is complete you will see another window.


    When the install is complete you will have the option to either begin playing
    Heroes III or to exit. Choose "exit" since you do not want to play the game while
    you are root.'
  merge: -1
  img_proc: true
