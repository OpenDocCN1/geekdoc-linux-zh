- pgno: 388
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_388_0.png)


    # **Figure 20-34**


    The tutorial will guide you through learning how to play the game, such as controlling
    armies, using spells and weapons and moving about. We don''t suggest trying to
    figure this one out by yourself unless you are very talent ed at learning games
    without reading about them first. The manual which comes with the game also provides
    a good amount of information.


    When you are ready to play the game, you will have a choice between single scenairo,
    multi-player or campaign mode.


    Single Scenario mode is played with one map against the computer. You are given
    a set of mission conditions and the winner is determined by who meets those conditions
    first.


    Multiplayer mode allows you to play against other humans on one computer, over
    a network or even over the Internet.


    Campaign mode are a series of linked scenarios marking climactic events in longer
    stories. Campaigns are played against the computer.'
  merge: -1
  img_proc: true
- pgno: 389
  md: '# **Scenario Selector**


    Before you start either a single player or multiplayer game you must choose which
    scenario you want to play and how difficult you''d like the game to be. You do
    this by using the Scenario Selector.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_389_0.png)


    **Figure 20-35**

    *Scenario Selector.*


    By clicking on "show available scenarios" you can see the entire list of all the
    scenarios you have to choose from. You will also see a description of the scenario.
    Towards the bottom of the Scenario Selector, you will see "player difficulty."
    The default is normal, you can set it for easier or more difficult.'
  merge: -1
  img_proc: true
- pgno: 390
  md: 'In this window you will also see the flags of your allies and the flags of
    your enemies. You will also see the conditions for victory and loss.


    When you have made your scenario choices, click "begin" to start the game.


    # Turns at Play


    On each "day" of the game, you can move your players and take certain actions.
    Each player takes a turn. If it is human versus computer, the computer will take
    a turn after the human. As you gain control of areas, they are added to your resources.
    The resources represent gold and raw materials which you may spend to improve
    areas under your control. The current date appears at the lower right corner of
    the Map screen.


    # Learning the Game


    As we mentioned earlier, it takes time to learn a game. Using the tutorial helps
    and so does reading the manual. The more you play, the better and more familiar
    you become with the game.'
  merge: -1
  img_proc: true
