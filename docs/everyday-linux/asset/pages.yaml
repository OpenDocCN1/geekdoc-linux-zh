- pgno: 392
  md: '# APPENDIX A


    # Resource List


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_392_0.png)


    This resource list will cover several different areas of resources. As stated
    in the introduction, this resource list is designed to point you to places you
    can go in case you run into a problem whose solution isn''t found in the pages
    of this book. Believe it or not, it happens. It additionally will point you to
    some pages that we looked at to research information we found in this book, so
    you can find more details if you want to investigate further.


    There are several sections to the resource list. In the *General* section, you''ll
    find Linux-specific search engines, projects related to Linux (such as GNOME or
    the GIMP), and home pages for Linux distributions. The *Maintenance* section will
    point you to several web pages and FTP sites that will allow you to download Red
    Hat packages or otherwise archived files for upgrading your software. In the *Visuals
    and Entertainment* section, we point you to a few places you can download various
    themes or play some games. The *Documentation* section includes sites that house
    help files, HOWTOs, and Frequently Asked Questions concerning Linux. It''s also
    going to have a few documents *about* Linux and Open Source as well. We included
    the *Miscellaneous* section to provide you with some general-purpose help with
    computers.'
  merge: -1
  img_proc: true
- pgno: 393
  md: 'Each of the resources listed is followed by either some commentary, a description,
    or both, just so that you know what you''re getting into when you access it. They''re
    organized alphabetically in each category, so you can find what you''re looking
    for reasonably quickly.


    # General


    +   **http://gedit.sourceforge.net**

    +   If you want to get some information, updates, and help with GEdit, a powerful
    editor made by the folks at GNU, you should visit this website.


    +   **http://www.corel.com**

    +   Users of the WordPerfect word processing program or Corel''s version of the
    Linux operating system will probably want to visit this page periodically. Corel
    releases versions of WordPerfect for Linux one or two versions behind that of
    its office suite. It''s a hefty download, but it is free of charge.


    +   **http://www.debian.org**

    +   *Debian* Linux is another popular distribution of the Linux operating system.
    There are warring factions in the Linux community dedicated to seeing Debian triumph
    over Red Hat (and vice versa), though the advantages of each usually put them
    in different fields of use. Debian is generally considered a little less user-friendly
    than Red Hat.


    +   **http://www.enlightenment.org**

    +   This is Enlightenment''s home page. You''ll be able to find updates, various
    applets, and themes from here.


    +   **http://www.gimp.org**

    +   Users of the GIMP will be glad to use this web page. It contains updates,
    plug-ins, and other various downloads you''ll find interesting. You should also
    be able to get a little technical support here if you need it.'
  merge: -1
  img_proc: true
- pgno: 394
  md: 'http://www.gnome.org

    This is the GNOME web site. You should periodically check this web site for information
    about the progress GNOME is making in the desktop world. It has news bytes and
    updates as well.


    http://www.google.com/linux/

    Google.com is a wonderful search engine that prioritizes results based on the
    number of links a page has pointing to it. It comes with a search engine specifically
    devoted to Linux, which you can find at this URL. You''ll be able to find web
    pages for virtually any application and packages or archives of almost any program
    available for any distribution of Linux.


    http://www.netscape.com

    When you want to get updates for Netscape, you can visit their home page here.
    Alternatively, you could find Netscape using GnoRPM. If you use the web site,
    you''ll find releases for Linux in the Browser Archive section.


    http://www.opera.com

    For the latest news and updates for Opera for Linux, you should visit their web
    site. Opera is fully featured and incredibly powerful. Yet somehow small. It looks
    like someone managed to code an efficient program for the first time in who knows
    how long. At the time of this writing, a full version of Opera was not available
    for Linux, but several “Tech Preview” releases were on the site.


    http://www.redhat.com

    This is the homepage for Red Hat Linux. The makers have provided an all-purpose
    page with a number of different resources for you to use, including some search
    capabilities and hardware support pages.


    http://www.sun.com

    Sun Microsystems make more than just computers, though that''s where their market
    lies. If you''re interested in using StarOffice, you can find links to it from
    their main page, however. StarOffice is a fully featured, Open Source suite of
    productivity tools that any office user will be delighted to have.


    Maintenance'
  merge: -1
  img_proc: true
- pgno: 395
  md: '**http://www.sourceforge.org**

    If you’re looking for a patch you just can’t find, or the drivers for your specific
    printer or modem haven’t been included in your distribution of Linux, you might
    be able to find them from here. Source Forge provides source code and plenty of
    information about how to go about installing new drivers or patches.


    **http://www.redhat.com/apps/support**

    In the event that you have any applications provided by Red Hat (while we’re thinking
    specifically of Red Hat Linux, the folks at Red Hat do make other software), you
    can find support for them at this web site.


    **http://www.redhat.com/support/hardware**

    Throughout the course of the book we told you to make sure that your hardware
    devices were compatible with Red Hat Linux. This is the web page with all of the
    hardware compatibility lists. It includes versions of Linux for several versions.


    **ftp://ftp.redhat.com**

    This is the Red Hat Linux FTP site. It houses all of the packages that accompany
    the standard Red Hat distribution.


    **ftp://ftp.debian.org**

    The Debian FTP site contains most of their packages, as well. If you’re interested
    in running Debian or using any of their packages, you should check this FTP site
    as well as their web page.


    # Visuals and Entertainment


    **http://e.themes.org**

    Since the default window manager for GNOME is Enlightenment, we thought it proper
    to include the web site for themes for Enlightenment. There are step-by-step instructions
    available from the site telling you how to install themes aside from those in
    this book.


    **http://www.bungie.com**

    The makers of Myth and its sequel, Myth II: Soulblighter. They have released a
    number of games for use with Linux. You should look at this sight if you’re interested
    in any of their offerings, which include a few other titles.'
  merge: -1
  img_proc: true
- pgno: 396
  md: '**http://www.bungie.net**

    This is Bungie’s contribution to the online gaming world, and a grand contribution
    it is. Visit the site for more information about how to get involved. Plenty of
    tutorial information is available.


    **http://www.idsoftware.com**

    Obviously the folks at Loki couldn’t provide you with some of their wonderful
    games without help from their more mainstream partners at id Software.


    **http://www.lokigames.com**

    This is the main web site for Loki Games. If you thought Linux was all bore, think
    again. Loki Games has been hard at work porting and developing games for use on
    your Linux machine. Go to their site to learn more about favorites such as *Civilization:
    Call to Power*, *Quake III Arena*, and *Descent3*.


    **http://www.themes.org**

    This is the general Themes web page – it has themes for use with almost any one
    of the window managers currently available for Linux.


    # Documentation


    **http://www.everydaylinux.com**

    At the time of this writing, the *Everyday Linux* web site was not fully developed.
    We anticipate that it will house the full contents of this printing, along with
    any revisions and additions later developed. We also hope to develop it into a
    full- fledged Linux database with plenty of information available for Linux users.


    **http://www.linuxdoc.org**

    This web site is your one stop shop for all Linux documentation. The quality of
    the documentation varies, as it’s provided by various authors, but you can usually
    find a HOWTO or FAQ available for whatever topic you’re looking for; be it setting
    up PPP or something more complicated, like using LDAP.'
  merge: -1
  img_proc: true
- pgno: 397
  md: 'http://www.opensource.org

    If you''re interested in learning more about the Open Source Initiative, this
    is the place to do it.


    http://www.pathname.com/fhs/2.0/fhs-toc.html

    This is the File Hierarchy Standard version 2.0 web site. We spoke of it briefly
    during the course of the book, adding a small disclaimer that you''d probably
    want to check the official web site for more information. Here it is.


    http://www.tuxedo.org/~esr

    This is the homepage of Eric Raymond. Aside from writing the forward to this book,
    he also started the Open Source web site and developed a number of projects for
    it. If you''re interested in reading any of his papers or commentaries (among
    the more famous are "The Halloween Documents" and "The Cathedral and the Bazaar"
    and the Jargon File), you can find them here.


    # Miscellaneous


    http://ragib.hypermart.net/linux

    This web site will provide you with a more detailed history of Linux than what''s
    given in the introduction. It''s not the most lengthy ever, but it will communicate
    the story well. It includes a few excerpts from emails written by Linus Torvalds,
    creator of Linux.


    http://www.zdweopedia.com

    If you''ve ever asked yourself what an acronym means (like CRT, TLA, and others),
    what your RAM does, or what the differences between a SCSI and IDE hard drive
    are, you would''ve loved to have known about this site. The ZDNet Weboopedia provides
    a searchable database that will provide you with definitions and short explanations
    of various computing terms. It''s a must have for anyone who''s interested in
    expanding his knowledge about computers.'
  merge: -1
  img_proc: true
