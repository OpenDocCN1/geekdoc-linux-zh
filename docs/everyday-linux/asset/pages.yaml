- pgno: 305
  md: '# ## Notes with KNotes


    KNotes can be found in the utilities submenu of the KDE menu. KNotes are a sort
    of cross between virtual stick-on notes and an alarm clock.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_305_0.png)


    **Figure 16-6**

    *KNotes.*


    The first thing you will likely want to do with your note is give it a date and
    time stamp. This can be accomplished by right-clicking on the note and selecting
    “insert date.”


    Type in whatever text you want to and then give your note a name.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_305_1.png)


    **Figure 16-7**

    *Adding a Date to your Note.*'
  merge: -1
  img_proc: true
- pgno: 306
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_306_0.png)


    Figure 16-8

    Renaming the Note.


    Do this by right-clicking on the note and choosing “operations,” and “rename.”
    A box will pop up and you can type in a name for your note.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_306_1.png)


    Under “operations” and “options” you can choose a different color for your note,
    as well as the font.'
  merge: -1
