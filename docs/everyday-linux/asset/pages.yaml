- pgno: 260
  md: "# ## Creating a Presentation Without a Template\n\nIf you would like to start\
    \ a presentation without using Auto Pilot you can do so by way of StarDraw. Either\
    \ double-click on the \"new drawing\" icon on the Star Office desktop, or click\
    \ \"file,\" \"new,\" and then \"drawing.\" When you see StarDraw you will find\
    \ it familiar, as it is used by Auto Pilot when creating a presentation.\n\n![](img/92fb6d8ad19de3b3470ba95c7b71b82e_260_0.png)\n\
    \n**Figure 14-9**  \n*StarDraw window.*\n\nWe will go through the construction\
    \ of several slides. We'll cover the basic tools that come with StarDraw. When\
    \ you are working on a presentation you have an additional menu screen on your\
    \ Star Desktop."
  merge: -1
  img_proc: true
- pgno: 261
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_261_0.png)


    # Figure 14-10

    Presentation Menu.


    This menu allows you to create additional slides or to select a layout of existing
    slides. If this toolbar is not visible, click on "view" and then "toolbars" and
    select "presentation." There is also an icon for making this menu appear and disappear.
    It is on the right hand side of the Star Desktop.


    # ## The Left Toolbar


    First, take a close look at the toolbar on the left side of the screen. These
    tools will allow you to do things like draw boxes, circles, cones, and lines and
    to set alignment and other effects. Each of the tools has its own set of options
    which you can view by holding the Shift key down and then clicking on the tool
    icon. For instance, looking at the options for the cube tool, you will see that
    you may also choose a sphere, pyramid, cylinder, torus, and more. When you see
    the option you want, simply click on it.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# **Zoom Ratio**


    There are times when it is helpful to get a closer look at an area in your drawing,
    or to get a view of the entire page. StarDraw provides numerous zoom views and
    several ways to achieve them.


    On the left toolbar, near the top, is an icon of a magnifying glass. Holding the
    shift key and clicking will show you the zoom options. Holding your mouse over
    each individual one will tell you how much the tool will zoom in or out. Choose
    one of these options, click on it, and then click on your image (pick the specific
    area if you are zooming in).


    The other zoom option is on the lower part of the StarDraw window. You''ll see
    the percentage of zoom displayed. The default is 27%. If you double-click on that
    percentage, a zoom options window will pop up.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_262_0.png)


    Figure 14-11


    *Zoom Options.*'
  merge: -1
  img_proc: true
- pgno: 263
  md: "You’ll be able to choose between 50% and 200%, page width, or you may choose\
    \ variable and set your own.\n\n# ### Adding Text\n\nIt is likely you will need\
    \ to add text to your drawing or presentation. To do so, click on the text icon\
    \ from the left toolbar.\n\n> **TIP**\n> \n> The options for text are “plain text,”\
    \ “text in a frame,” and “callouts.”\n> \n> The “callouts” is the ever famous\
    \ “text in a bubble” used by cartoonists.\n\nSelect which font you want to use\
    \ by clicking “format” and “character.” You may choose a font, its size, and some\
    \ other attributes. When you are through, click where on the image you want to\
    \ type text.\n\n![](img/92fb6d8ad19de3b3470ba95c7b71b82e_263_0.png)"
  merge: -1
  img_proc: true
- pgno: 264
  md: 'A dotted rectangle will appear and you may type in your text. When you are
    through, click somewhere outside of the dotted rectangle and the text will be
    anchored to the page.


    While the dotted box is surrounding your text, you may change other attribut-
    es. If you want to center your text, click on the alignment icon and select center.
    If you want to add color, just click on a color box at the bottom of the window.


    Any time you want to go back and change something about the text, it is pos- sible
    to do so. Just click over the text and the dotted box will reappear and you may
    then make changes. To delete the text, first click to make the dotted box appear
    and then hit the backspace key.


    # Adding an Image to the Slide


    To add an image to your slide, click “insert,” “graphics,” and “from file.” A
    window will pop up and allow you to navigate around directories and choose the
    image you wish to add. Then click “open,” and the image will appear on your slide.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_264_0.png)


    **Figure 14-13** Adding an Image.'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'You will see a dotted box around your image. To move the entire image around,
    simply place your mouse inside the box. The cursor will turn into a small crossed
    arrow. You can now move the image to where you want it on the screen. To resize
    the image vertically, click on one of the vertical dots and drag the mouse to
    the size you want. To alter size horizontally, click and drag on a dot on the
    top of bottom of the image. To maintain the ratio, use a dot on the corner of
    the image.


    # Arranging Things: Placing an Image Behind Text


    If you''ve already typed some text and then decide you want to place an image
    behind it, you can do so quite easily. Click on the text to make the dotted box
    appear. Now, from the top menu, click “insert,” “graphic,” and “from file.” An
    “insert graphics” window will appear.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_265_0.png)


    Figure 14-14

    *Inserting a Graphic.*


    You may move around directories and choose a graphic. There is a small preview
    window on the right side of this window. If you cannot see it, widen your Star
    Office main window. Choose an image and click “Open.”


    The image will appear over the text (hiding it) on your slide.


    To get the image to go behind the text, hold the shift and click on the arrange
    icon. Choose “send to back” and the graphic will be moved behind the text.'
  merge: -1
  img_proc: true
