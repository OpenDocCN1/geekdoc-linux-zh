    the program, the work area comes up with a new document. You can also click on
    the new document icon which looks like a small blank page with the corner turned
    down. It is the icon on the farthest left.


    If you want to open an existing document, click “file” and then “open,” or you
    can click the open file icon which is next to the new file icon.


    The open file window will display directories on the right side and the files
    in the selected directory on the left. To move up a directory, double click on'
