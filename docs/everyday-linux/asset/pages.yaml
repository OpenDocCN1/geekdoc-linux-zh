- pgno: 307
  md: '# Mailing Your Note


    One of the ingenious things you can do with KNotes is e-mail it to yourself or
    someone else. To e-mail your note, click on "operations" and then "mail note."


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_307_0.png)


    Figure 16-9 Mailing the Note.


    A window will pop up and ask you for an e-mail address and also a subject for
    your note. If you have already named your note, the name will be the default subject
    of the e-mail.


    # Setting an Alarm


    If you really want to make sure you don''t forget something, you can set an alarm
    on your note which will go off at a specific time to remind you. To set the alarm,
    right-click on your note and choose "operations" and "alarm."'
  merge: -1
  img_proc: true
- pgno: 308
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_308_0.png)


    **Figure 16-10**

    *Setting an Alarm.*


    You can use the arrows to set the date and time for the alarm to go off.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_308_1.png)


    The alarm will go by your system clock, so be sure that your system clock is set
    correctly!


    At the time of the alarm, your computer bell will beep three times.'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# **Adding and Deleting Notes**


    When you start up KNotes, whatever relevant notes you have created will appear
    on the screen. To create a new note, right-click on a note and select “operations”
    and “new note.”


    To delete a note, right-click on it and select “operations” and “delete note.”

    A window will pop up and ask you if you are sure you want to delete the note.

    If you''re sure, click “ok.”


    # **GNOME Address Book**


    The GNOME Address Book is very much like a virtual Rolodex. It will keep track
    of addressees, phone numbers and much more, and it will even sort it for you.
    You will find the Address Book under the GNOME applications menu.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_309_0.png)


    Figure 16-11

    GNOME Address Book.'
  merge: -1
