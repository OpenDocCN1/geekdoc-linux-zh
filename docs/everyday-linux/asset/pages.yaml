- pgno: 44
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_44_0.png)


    # CHAPTER 2

    # Installation


    You''re ready to install Red Hat Linux. As we go through the installation procedure,
    you''re going to become familiar with a few facets of the Linux operating system
    that will help you get used to configuring GNOME and working with your files or
    maintaining your system.


    You''ll find that the install program uses a few different conventions than you
    may be used to (of course, if you''re sufficiently new to computers, you might
    not be used to any at all). As we go through the installation, I attempt to explain
    these conventions in some detail so that you can make some decisions about the
    installation on your own. (Please don''t gasp, it''s really not becoming.) Of
    primary importance is that you realize that the first time is always the longest
    and most difficult, and the installation process becomes exponentially easier
    the more familiar you are with it.


    The installation will probably take forty-five minutes to an hour and fifteen
    minutes the first time you do it. Most of the time that you''re involved will
    be spent in making partitions; the bulk of the installation is spent actually
    installing the operating system. You''ll find that the installation is about as
    easy as installing Windows or a comparable operating system.'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'This chapter is organized in a step-by-step installation method with some commentary
    provided to help you make decisions. At the end of the chapter, a very rudimentary
    step-by-step instruction guide is provided in case you’re really not interested
    in reading through this chapter. Be warned, however, if you don’t take time to
    read this chapter for the first installation, you’ll be referring back to it at
    some point.


    # ### Booting into the Installation


    Your first concern is going to be whether you can boot from the CD-ROM or not.
    I assume for simplicity’s sake that the installation software is on a CD. If you
    bought Red Hat Linux from a store or borrowed it from a friend, it likely came
    on a CD. Linux is not available on floppy diskettes, but it could be on your hard
    drive. (The only reason it would be on your hard drive would be because you downloaded
    it from the Internet. Unless you have an incredibly fast Internet connection,
    this is highly unlikely, so we’ll stick with a CD-ROM installation.)


    The CD comes with all of the necessary information to boot up your computer and
    load Red Hat onto your machine. If you can’t boot from your CD-ROM, however, you’ll
    have to make a disk. If you can boot from your CD-ROM but presently don’t have
    that option enabled, you will need to contact your computer vendor or manufacturer
    to ask how to go about enabling it. Your computer manual may come with this information,
    too.


    # #### Making a Boot Disk


    In the making of this boot disk, I assume that you are presently running a version
    of Windows. This process will be slightly different if you are running MacOS or
    something similar.


    You should insert a floppy disk into your floppy drive. If it’s not already formatted,
    format it by opening up Windows Explorer. In the left window frame, you’ll notice
    a list of available folders. At the very top of this list, you should be able
    to see a list of your drives. Make sure that the floppy disk is inserted in the
    drive, and then right-click the drive labeled “3½ Floppy” and left-click the option
    labeled “Format.” Choose the full format and click the button labeled'
  merge: -1
  img_proc: true
- pgno: 46
  md: '"Start." When the format is complete, you should then turn your attention to
    your CD-ROM drive.


    Double-click the icon for your CD-ROM drive (it will be below the list of hard
    drives). On the right-hand side of your screen, a new list of files and folders
    will appear. Double-click the folder called "images." In this folder is a file
    called "boot.img." Drag it from that folder to your floppy drive. It will copy
    the file to your drive.


    When this process is complete, leave the disk in the drive. Click on the Start
    button and click on Shut Down. When the list of options comes up, click on "Restart"
    and then click "OK."


    # The Initial Screen


    Once your computer has booted up (be it to CD or disk), you will be presented
    with a screen that asks you how you''d like to install Red Hat Linux 6.2. There
    are a number of modes, but the one you''re going to want to use is graphical.
    To do so, simply press your enter key.


    The primary advantage of using the graphical installation is that you''ll have
    the ability to use your mouse. In the text installation this isn''t possible.
    If, for some reason, your monitor doesn''t work with the graphical installation,
    type in "text" and then press enter.


    The text and graphical installations are essentially the same, though the navigation
    principles to get through them both are somewhat different.


    # Navigating Your Way Through the Installation


    During the course of this chapter, I assume you''ve used the graphical installation.
    However, for your convenience, I provide information for navigation in both the
    graphical environment and the textual interface.


    # Graphics


    Navigation in the graphical environment is really, really easy. It''s point and
    click, point and click. The next buttons are the same as you would see in a typical
    Windows program installation. To fill in any fields, you simply have to click
    on them and then type the required information.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'If you simply don''t like your computer mouse, or enjoy making procedures harder
    than they need to be, you can also use the text-based interface navigation instructions
    that follow.


    # Text


    If you''re running the text install, you will probably have to navigate through
    the procedure entirely with your keyboard. This may seem rather inconvenient.
    And it is. That''s why we recommend using the graphical installation.


    To move forward to another option, press your tab key. If you want to move backward,
    press the alt (or meta) key in conjunction with the tab key. Use the enter key
    to select options (such as which hard drive you''ll install a partition on) and
    to press the buttons at the bottom of the screen.


    You''ll also notice that the last line of the screen has some F-key options, like
    F1, F5, F12, and so on. You can use them to navigate as well.


    # Initial Configuration


    The first configuration options you''re going to set involve basic settings, like
    what language you speak, which keyboard you use, and what kind of mouse is attached
    to your system.


    The first two are fairly simple. The defaults will probably work just fine. When
    you select your keyboard, you can fine-tune some settings, but you don''t need
    to. The help dialogue at the side of the screen will assist you with deciding
    which keyboard you should use. Most keyboards now do not come equipped with composition
    keys (so you can create international characters straight from the keyboard).


    The mouse, however, is a slightly more complicated matter. Linux is a UNIX derivative,
    and will make good use of a three-button mouse. If you don''t have a three-button
    mouse, you can choose to emulate a three-button mouse. To take advantage of the
    “third button,” you must press both the right- and left-hand mouse buttons at
    the same time.


    Another popular mouse feature with spotty support is the wheel. The wheel on most
    modern mice will allow you to conveniently scroll through pages of text in a document
    or on the World Wide Web. Lamentably, Linux itself does not'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'come equipped with support for the wheel on your mouse; however, various applications
    do.


    At the time of this writing, Linux also didn''t offer overwhelming support for
    USB devices. So if you''re using a USB mouse, you should probably buy a USB-to-PS/2
    adapter. They''re relatively inexpensive, and a local computer store should carry
    them. Drivers for most USB devices are presently being written, but almost none
    of them made it into the Red Hat Linux 6.2 distribution.


    # # The System Installer


    The most complicated bit of installation – and the longest – has arrived. There
    are a lot of steps to this part, so stay focused. (It''s easier if you have something
    with you to eat, drink, or read when your input isn''t needed.)


    # ## The Install Type


    The first major decision you''ll need to make is what installation type, *or class*,
    you want to use. There are four choices for you to make. I''ll explain them briefly
    here—you''ll notice somewhat similar explanations to the left in the help dialogue
    box.


    # ### Workstation with GNOME


    If you want to run the GNOME desktop with a minimum of fuss, you can choose this
    option. I recommend you use GNOME, regardless of what installation class you decide
    on–first, because it''s a phenomenal desktop tool, and second, because a godly
    portion of this book will be lost on you if you don''t.


    A *workstation* in this context is a computer that is not serving files to a network.
    Most home users are not in a capacity to be a server (to serve files), so a workstation
    class installation is more appropriate.


    GNOME is more or less becoming the standard to beat in the desktop environment.
    KDE, your other option, is close behind, however.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# **Workstation with KDE**


    If you''re more familiar with UNIX or Linux, and you prefer KDE over GNOME, feel
    free to pick this option.


    # **Server**


    In the event that you''re serving files on a network, maybe from your college
    dorm room or on a home LAN (local area network), you may want to try a server-class
    installation. This will install various extra programs that will allow other computers
    access to yours (this can pose security risks, of course).


    It''s not usually recommended that you use a server-class installation unless
    you''re fairly competent with Linux. “Fairly competent” means that you can do
    your own systems administration and security troubleshooting.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_49_0.png)


    The attraction of using these pre-defined installation classes is that they will
    simplify the installation process. They will eliminate your need to create your
    own partitions, and you won''t have to do much in the way of selecting components.


    The workstation classes won''t cavalierly wipe out any information on any drives
    that don''t already use Linux, but the server installation class will. It will
    format **all** of your drives and remove **all** of the information on them. This
    is another reason you should be quite wary of choosing the server installation
    class.


    # **Custom**


    This leaves us with the fourth and final installation class—the custom installation.
    The folks at Red Hat kindly suggest that if you''re new to Linux that you choose
    one of the workstation installation classes, and if that seems like a more appropriate
    route to you after reading about the custom installation class, then by all means
    choose it.


    If you haven''t guessed so from the tenor of that paragraph, it is my suggestion
    that you do use the custom installation class. The custom installation class is
    the only one that will allow you full autonomy over the installation—which **partitions**
    you want to create, how large you want them to be, in what format, and what packages
    you want to install.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'The custom installation class is easiest to use when you have a fairly large
    hard drive—one that''s around 4 GB or so. If you have an exceptionally small hard
    drive—in the neighborhood of a gigabyte or less, you may find simply using the
    GNOME workbench class easier.


    For the purposes of this installation, I assume that you have chosen the custom
    installation class. If you haven''t, some of these steps will not apply, and you
    can skip over them.


    # ## Creating Partitions


    The next order of business is the creation of partitions. In my early days of
    computing, mentioning partitions was scary stuff, and it still can be today. To
    combat whatever tremors may be knocking in your knees, we''re going to distill
    partitioning into its conceptual components. We''re also going to explain why
    in the world you''d want to mess around with them.


    This will likely take up some space in the book—if you''re not interested or already
    know enough about partitions to satisfy yourself, simply skip ahead.


    # ### What Is a Partition?


    It''s often helpful to think of computer terms by their physical equivalents.
    A partition in a room, for instance, is a barrier between one side and the other.
    It might separate two classrooms in a pinch or provide us with two smaller rooms
    instead of one really large one.


    In the computer sense, this concept is the same. A hard data partition is a magnetic
    barrier that separates data on one side of the hard drive from data on the other
    side. Partitioning is usually done to organize files and manage space. A 40-GB
    hard drive is like owning a farm—there''s a lot of acreage, but it''s pretty tough
    to manage. By partitioning up a hard drive, you reduce it into manageable pieces.
    The real estate equivalent would be building subdivisions.


    That, in a nutshell, is a partition and its use.


    # ### What Are the Advantages of Using Partitions?


    In most modern desktop computers, users have very little interaction with their
    computer on a relatively simplistic level. Windows users usually have a file manager
    which organizes everything quite prettily in nice neat rows and'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'columns. The data is already sorted, so there''s often not really an organization-

    al need for a partition.

    When you use Linux, you''ll have opportunities to work with the file system

    at a more basic level, known as the command line. Having partitions will help

    you sort out some details pertaining to your files.

    The main advantage, however, is data protection. When you install Linux, it''s

    relatively simple to keep your data safe. During the installation process (in
    the

    next step, you''ll see), you will be able to tell the program which partitions
    to for-

    mat. Formatting a partition will wipe out all the data on it. If you upgrade or

    reinstall Linux, you''ll find that you''ve got some files on the system that you
    don''t

    want to lose. If they are contained in a specially made partition, you won''t
    have

    to format the partition and lose the files.

    This means that the risk to your files is minimized during a second installa-

    tion or an upgrade. This is really quite handy.

    Another very large advantage is discussed in the next section.


    # Characteristics of Partitions


    Partitions typically have two main characteristics: size and format. The size
    of

    a partition is self-explanatory—it''s simply how large or small you want to

    make the partition. In the analogy of our room, it''s where you place the wall.

    The format, however, doesn''t have as logical an equivalent. Most personal

    computers run some version of Microsoft Windows. However, other operating

    systems, such as the Macintosh OS, BeOS, Linux, and others are used. Each of

    these operating systems uses a different file system, and therefore the files
    are

    in a different format. You might liken this to how one side of the room looks

    compared to the other.

    A computer running Windows typically cannot read files formatted under

    MacOS or Linux. Windows is one of the few operating systems, and the only

    one in wide use, that is so impaired.

    A great advantage of Linux is that it can read disks formatted under different

    operating systems. Linux supports many different formats, among them the

    MacOS, Windows, and other UNIX derivatives (such as MINIX, BSD, and so

    on). Support for these operating systems can be added dynamically using various

    upgrade tools provided by Red Hat, too, so if you have a hard drive or floppy

    disk formatted in who knows what, you can probably find support for it in Linux.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# ## Partition Peculiarities in Linux


    In Windows, partitions and hard drives are represented using *drive letters*.
    The first drive or partition is labeled "C:" and the letters climb alphabetically
    from there.


    This is not the case in Linux. Linux recognizes each partition or hard drive as
    a *directory*, so the inclusion of various hard drives or partitions on your system
    is seamless. This may seem a little different to you at first, but you''ll find
    that it''s sometimes quite useful. It allows for one root file system (a root
    file system is the very top of the directory tree—it''s like C:\ in Windows or
    MS-DOS, not several, for instance.


    It also allows you to have hard drives on other computers integrated seamlessly
    on yours, so accessing someone else''s computer appears to look exactly like accessing
    your own. All in all, it provides a balanced look and feel to your computer.


    # ## How Partitions Are Named in Linux


    This is a relatively important part that you probably don''t want to skip reading.
    The inner workings of the computer can sometimes be confusing, and this is what
    Linux uses to decide what to call your hard drive.


    Most desktop computers come outfitted with IDE or ATA hard drives. The alternative
    to IDE is known as SCSI, and we''ll talk about that in a moment. IDE hard drives
    are connected to the *IDE Controller* card in your computer. The controller card
    does just what it says—it controls all of the IDE devices, like your hard drives
    or CD-ROM attached to it.


    Each of the devices on an IDE controller is named by using a combination of letters
    and a number. Each device profile is stored in a directory on your system called
    /dev. And each device is given a name. IDE devices all begin with the letters
    “hd.” Each is then followed by an additional letter, determined by where the drive
    is on the controller, and a number, arbitrarily assigned when you create the partition.


    During the installation process, you''re going to need to know which your drive
    is called under Linux so that you know which parts to format and which to leave
    alone. This is of particular interest if you''re dual booting. Here is a rough
    idea of how you can know which drive on your system is which.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'There are both primary and secondary IDE devices. Each of these two classes
    is broken down into a “master” device and a “slave” device. A drive is primary
    or secondary, based upon where it is plugged in on the motherboard (which is what
    handles most of the information traffic in your computer).


    Each of the four possible devices that can connect to your IDE controller is assigned
    a letter; the primary master drive is given the letter “a,” the primary slave
    the letter “b,” the secondary master the letter “c,” and the secondary slave the
    letter “d.” Because the CD-ROM often has two different names (dev/cdrom and dev/hdc),
    you may find that the drives skip a letter—that is, you could have a “hdb” drive
    and then “hdd.”


    If you have two hard drives on your computer, the primary master is probably running
    Windows. If you plan on dual booting, make sure that you don’t modify the “hda”
    drive during the course of the installation.


    If you’re still not really certain by what name Linux knows your drive, you can
    gain additional hints by how large the hard drive is. A 10-GB hard drive might
    come up as having something like 9700 MB of hard drive space. If you want to install
    Linux on one that is substantially smaller, say 4 GB, you’ll notice one with 3900
    MB of space—that’s the one you want to go for.


    Each of your SCSI (often called “scuzzy”) devices is named with a similar convention.
    However, a SCSI controller operates by *chaining* your devices together. When
    you chain devices, you simply connect the first device in the chain (usually given
    the number 0) to the controller card. The second device is connected to the first
    and so on. Most SCSI controllers allow for eight devices on a chain, numbered
    0–7.


    SCSI devices are named with the prefix “sd” and the position it occupies on the
    chain. The first SCSI device is called “sda.” The second is known as “sdb,” and
    so on. These devices will also have numbers at the end.


    Again, if you’re not familiar with how your computer is put together, you can
    gain clues to which hard drive you want to format based upon the size of the drive.
    You can also open up the computer to see where everything goes together. As long
    as you don’t change anything, you won’t damage anything, and it will provide you
    with some good experience.


    # Understanding the Partition Table


    Now that you’ve either skipped over the part which helps explain partitions or
    read it, we can explain the partition table. As always, the friendly people at
    Red'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'Hat have included their own advice on the left side of the screen. It''s usually
    pretty good, so don''t be afraid to follow it.


    The right frame is where most of our concentration will lie. At the top of the
    screen is a partition summary, and below it is a hard drive summary.


    # The Partition Summary


    The partition summary displays information about partitions already created on
    your computer. It is located at the upper left side of your screen and usually
    takes up most of it. There are a number of different categories here that you
    should understand and know about.


    +   - **Mount Point** *A mount point* is the directory that Linux assigns to a
    partition or hard drive. When creating partitions, you must specify a mount point
    to locate the partition on the directory tree. If you include a Windows disk,
    for instance, you might use the mount point /mnt/win. Linux can use many, many
    different partitions, and we''ll discuss many of them when we begin creating partitions.


    +   - **Device** *The device* is the device name that we talked about in the previous
    section. Device names are supplied arbitrarily based upon a device''s connection
    inside the computer, and you will not need to supply them.


    +   - **Requested** When you create a partition, you must specify how large you
    want it to be. *The requested* category tells you how much space you''ve requested
    for use with the partition.


    +   - **Actual** After the partition is created, the actual barrier itself may
    take up more than the space you request. This is not always the case, however.
    *The actual* field will tell you how much space the partition presently takes
    up on the hard drive. The number in this field and that in the requested field
    usually do not differ by more than one megabyte.


    +   - **Type** *The type* of the partition is the format of the partition. You
    have the opportunity to supply four different partition types: Linux native, Linux
    swap, FAT16, and FAT32. Linux native is the type that you will use for all of
    your Linux data. A swap partition is a partition that “mirrors” the amount of
    random access memory on your computer. It allows you to use your hard drive in
    case your RAM becomes overloaded. The FAT options refer to the File Allocation
    Table systems used by Windows and MS-DOS. If you want to include a partition of
    greater than 2 GB'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'that''s compatible with Windows 98, make sure to use FAT32. If you''re running
    Windows 95 or lower, you should use FAT16.


    # ## The Drive Summary


    The drive summary contains information about the physical hard drives presently
    installed on your computer. It will list them in order, hda first, hdb second,
    and so on. You will notice in this list that you can skip letters, so hdd may
    follow hdb or even hda. The drive summary is under the partition summary. There
    are several categories that you should understand here, too.


    +   - **Drive Geometry** This information is fairly technical and relatively unimportant
    to your understanding of the installation. The drive geometry determines how much
    space is allocated for your hard drive. The drive geometry is composed of cylinders,
    heads, and sectors.


    +   - **Total** The total category tells you how much information your hard drive
    can hold in megabytes.


    +   - **Used** The used category tells you how much of the total space your partitions
    are taking up.


    +   - **Free** The free category is simply the difference between the total and
    the used space. You should use this category to decide how much space to allocate
    for partitions.


    # ### Working with the Partitions


    Directly below the partition summary is a group of buttons. One says “add,” another
    “delete,” and yet another “edit.” In the course of working with the partitions,
    you''re going to be deleting some partitions, adding others, and so on and so
    forth. These are the buttons that we use to accomplish these tasks.


    Your first task is to identify which hard drive you''re going to install Linux
    on. If you plan on dual booting using two hard drives, you''ll probably be installing
    it on either hcb or hdd—the primary slave hard drive or the secondary slave hard
    drive. If you do not plan on dual booting or if you plan on dual booting on a
    single drive, you''ll use the drive labeled hda. Preparing for each of the three
    procedures is described below.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Preparing to Dual Boot Using Two Drives


    If you''re going to dual boot using two drives, you will probably have several
    partitions already listed. I assume in this installation that you are installing
    Linux on the second hard drive, which will be hdb. If there are any existing partitions
    on this drive, they''ll be called “hdb1,” “hdb5,” and what have you. The numbers
    don''t necessarily have to go in order, so just pay attention to the “hdb” partitions
    in the partition summary.


    You will need to delete all of the partitions on that drive. To do so, simply
    click on a partition and then click on the delete button. It''s pretty simple.
    You must be warned, however, that deleting a partition will remove all of the
    data on the partition, and you won''t be able to get it back. To delete all of
    the hdb partitions, simply click on each of them and click on the delete button
    for each in turn. Each time you attempt to delete a partition, you will be asked
    to confirm your choice.


    # Preparing to Dual Boot Using One Drive


    If you''re going to dual boot using one drive, you probably won''t need to remove
    any partitions at all. You have a few partitions that were created when you installed
    your other operating system and you don''t want them, you can delete them using
    the procedure described above. These will be named using “hda” and then a number,
    however.


    Please remember that you cannot recover data from a partition that you''ve deleted,
    so use the delete button carefully!


    # Preparing to Single Boot


    You can single boot with as many drives as you''d like. The process that I describe
    here only removes the partitions on the first drive—if you want to make use of
    space on other drives, you should remove those partitions as well. Please realize
    that if you single boot, you''re going to destroy your previous system completely
    and utterly. If this sounds too risky, then you should dual boot.


    To single boot, that is, to boot using one operating system, you should remove
    all of the partitions on the first drive, that is, on the drive called “hda” by
    Linux. Click on each one of the partitions and then click on the delete key.'
  merge: -1
  img_proc: true
- pgno: 57
  md: "# ## Adding Linux Partitions\n\nEach of the previous preparations detailed\
    \ how to remove partitions and which ones you should remove. In this section,\
    \ we add some standard partitions that Linux uses. To do this, we’re going to\
    \ click on the *add* button.\n\nWhen you click on the add button, a new window\
    \ will pop up. In this window, you can specify the *mount point*, the *size*,\
    \ and the *type* of the partition that you wish to create. There are other characteristics\
    \ that we’re also concerned about, though.\n\nOne of these is the *grow to fill*\
    \ option. This option allows your partition to take up space beyond the size you\
    \ specify. I normally don’t use the grow to fill option, but it usually doesn’t\
    \ matter.\n\nAnother, perhaps more significant option, is called *allowable drives*.\
    \ This list will allow you to select which drives you can use to allocate space\
    \ for the partition. If you’re dual booting using two drives, you should make\
    \ sure that you use only the drive which you want the partition to be located\
    \ on, usually hdb.\n\n![](img/92fb6d8ad19de3b3470ba95c7b71b82e_57_0.png)\n\n>\
    \ Note \n> One of the conveniences offered by the installation program is a list\
    \ of common used partitions. Instead of having to type in the mount points, you\
    \ can simply scroll down a list of them. You should make good use of this list.\n\
    \n# ### Which Partitions Should I Add?\n\nAs explained in the note, there are\
    \ a number of partitions in a clickable list near the place where you specify\
    \ the mount point. You’ll want to add at least two of these and a swap partition.\
    \ We’ll summarize some partitions (some of which are on the list) and then explain\
    \ how to create a swap partition.\n\n+   - / *(the root partition)* The root partition\
    \ contains files that the computer uses to start up the system. You should allocate\
    \ at least 450 MB for this partition, but more is recommended. You may wish to\
    \ save this partition for last, so you can allocate space for other partitions\
    \ and leave plenty left over for the root partition.\n\n+   - /boot  The /boot\
    \ directory holds all of the data that Linux requires to boot into Linux. You\
    \ can generally allocate 16 MB for this partition and do just fine. This is a\
    \ convenient way to protect your boot information."
  merge: -1
  img_proc: true
- pgno: 58
  md: '+   • /usr This partition will store software that’s accessible to everyone
    who uses the computer. You should allocate about 500 MB to a gigabyte (1024 MB)
    of data for these files at a minimum.


    +   • /usr/local The files in this directory are non-commercial programs that
    you install. We create a partition for this to protect any programs that you install
    from being overwritten during an upgrade. This should have at least 500 MB of
    space. You may prefer to allocate more if you’re going to be installing a lot
    of programs.


    +   • /home This partition will store files specific to the users on the system.
    (Each user is given a directory called /home/username, where username is the login
    name that the user chooses.) The size of this partition will vary depending on
    the number of users who will make use of the system. If it’s very few, you can
    get away with 250 MB; if it’s a great number, you should have several gigabytes
    allocated.


    +   • /opt The /opt directory holds commercial programs. You still cannot find
    many commercial applications for Linux, so you might want to allocate about 500
    MB for this partition. If you have space to spare, it wouldn’t hurt to add another
    250 MB or so.


    +   • The Swap Partition The swap partition is the portion of the hard drive that
    Linux will use to complement your RAM. The size of this partition should be the
    amount of RAM you have in megabytes, or 127 MB, whichever is smaller. So if you
    have 64-MB of RAM, you should have a 64-MB swap partition. To create this partition,
    you need to specify the type as “Linux swap.”


    You may find it convenient to add other partitions. If, for instance, you want
    to have a drive readable by both Windows and Linux, you can create a partition
    with a mount point of /windows or something of type FAT32. You can then easily
    transfer data back and forth between the drives. This is, of course, only useful
    if you’re going to be dual booting using Windows.


    > Note

    > Make sure to write down the mount points and the device names of each of your
    partitions. If you have to reinstall Linux, you won’t have the mount point data.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# ## **Editing Partitions**


    If you have two hard drives, one of which is another format, you can also specify
    a mount point for that drive and Linux will automatically mount the drive when
    you boot up the computer. To specify a mount point, you must highlight the partition
    in question and then click the edit button.


    The only information you will be able to change within this dialogue box is the
    mount point. You can specify basically any mount point that you wish, but the
    naming convention is a little different.


    In Windows systems, each different directory in the directory tree is separated
    by a backward slash (\) when called by its *absolute pathname*. The absolute pathname
    is, for all intents and purposes, the full name of the directory or folder. In
    Windows, for instance, much attention is paid to the System folder, but its absolute
    pathname is C:\Windows\System.


    In Linux, folders are called directories and they are separated from one another
    by using a forward slash (/).


    When you name a mount point, you are specifying a directory where Linux will store
    the files in the partition. Each of the mount points will begin with a forward
    slash and then a combination of directories. Most hard drives are *mounted* in
    the /mnt directory, so if you have a hard drive with Windows on it, you could
    use a mount point of /mnt/windows. Alternatively, you could use /what-chama-cali
    or any other mount point you desire as long as it fits the naming convention specified
    by Linux.


    # ## **Selecting Partitions to Format**


    In the event that you are using a custom installation, you will be able to specify
    which partitions you want to format during the installation of packages. Initially,
    you should select all of them—only Linux-type partitions are listed, so you won''t
    endanger files anywhere else. Make sure that you also check the option, “Check
    for bad blocks during format.” This will take a little extra time, but it gives
    you the added benefit of ensuring that the drive is suitable to carry data.


    If you’re installing Linux for the second time, or using the upgrade option from
    the installation to upgrade to a new version of Linux, you should not specify
    those partitions on which you want to save data, such as the /usr/local partition.
    Make sure you have your list of partitions handy.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# **LILO Configuration**


    LILO stands for “Linux Loader,” and it is the program that Linux installs in the
    master boot record (MBR) which loads Linux. (Hence the name “Linux Loader.”) However,
    LILO will also boot to other operating systems like Windows or MacOS.


    Typically, you want to install LILO on the primary master drive’s boot record
    so the drive you specify should be hda. If you are dual booting using two physical
    hard drives, LILO may give you occasional problems. If that happens, you can simply
    reinstall Windows or your other operating system and make use of the boot disk
    that you’ll create during installation.


    If that sounds like a hassle, you should simply not install LILO and use the boot
    disk instead.


    If you are booting from a single drive or single booting, it is highly recommended
    that you use LILO. You can usually leave the information in this screen at the
    defaults, so you probably won’t need to change anything.


    # **Network Configuration**


    The next step is to set up any network devices that are present on your system.
    If you don’t have any, you won’t see this step, but if you use a device like a
    network card, Linux will probe for it and see what settings it should use.


    Normally the default settings will work just fine, since most companies will assign
    you information using a DHCP protocol that simply assigns you information dynamically,
    instead of statically. If you’re not sure what to put in here, you should call
    either your network administrator (if you’re on a LAN) or your Internet Service
    Provider to see what settings they recommend.


    Generally, you’re fine using DHCP and clicking Next.


    # **Time Zone**


    This is a fairly explanatory step. The only complication that could arise is if
    your computer sets itself to GMT (Greenwich Mean Time) and adjusts the time for
    your specific time zone. If it does, you should work with the UCT tab instead.


    To set your time, you can simply navigate the map on your screen (it will not
    appear if you’re using the text installation) and click on which time zone you
    use. If the time on your computer is already set using the BIOS, Red Hat will
    attempt to guess what time zone you’re in. It’s usually pretty accurate.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# ## Account Configuration


    The next step is to configure your account and the root user account. You will
    first have to specify a root user password. The length of the password must be
    greater than five characters for it to be valid, and you will have to type it
    in twice.


    You must then add an account for yourself. (Well, you actually don''t have to,
    but it''ll save you the hassle later on.) Near the middle of the screen is a form
    for you to fill out; simply supply a username, a full name, and your password,
    and the installation program will add the account for you. You should pick a username
    that is composed of your name; outlandish names or pseudonyms for mainstream Internet
    purposes are usually looked down upon. Suggestions would be a first initial and
    your last name, your three initials, or your first name and a last initial.


    Make sure to write down the root password so you won''t forget it. If you forget
    the password, you won''t be able to do any administrative tasks on the system
    (such as adding additional users, mounting drives, and so on) until you reset
    it in single-user mode. Once you''re sure that you know the root password, you
    should make sure that you destroy the paper that you wrote it down on. The root
    user is completely unrestricted and can cause irreparable damage to your system,
    so you don''t want the password falling into the wrong hands.


    # ## Authentication Verification


    You can usually leave these settings at the defaults. They''ll provide you with
    the maximum security on your system. If you are on a network and you''re not sure
    if your network takes advantage of the NIS server, you should ask your network
    administrator for assistance.


    # ## Selecting Components and/or Packages


    Now comes one of the longer parts of the installation. To fully customize your
    computer, you can choose software components or specific software packages to
    install on your computer.


    A component differs from a package insofar as it is *composed* of packages. I
    will not be describing specific packages—if you desire to choose specific packages,
    which will help you trim space if you''re running low or don''t want some'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'programs installed, you can find out about the individual packages by yourself.
    If you want to choose specific packages, click on the “choose individual packages”
    button at the bottom and click the Next button.


    Here is a sample component list with my commentary about why you would want to
    use each of the components:


    +   *   **Printer Support** Printer support will be necessary if you have a compatible
    printer to use with Red Hat. (If you’re not sure, you should consult the Red Hat
    web page for compatibility lists.) If you want to use a printer with Red Hat,
    check the box.


    +   *   **Mail / WWW / News Tools** These tools will allow you to send and receive
    e-mail, browse the web, and read online newsgroups. You should include this component
    if you’re going to be using the Internet.


    +   *   **Graphics Manipulation** This component will supply you with plenty of
    goodies. Users that view or edit graphics files (.gif, Jp(e/g, .tif(f), and so
    on) will want to include this component.


    +   *   **Networked / Dialup Workstation** If you are planning on connecting to
    a network through a network interface card (NIC) or through a dialup (this includes
    the Internet, not just local area networks), you should check the component that
    matches your setup. (Networked workstation for LANs, dialup workstation for computers
    that aren’t on LANs.) If you’ll be connecting both ways, install both components.


    +   *   **SMB (Samba) Connectivity** If you are a Linux user on a local-area network
    (LAN) that is composed of multiple platforms (such as Windows95, Windows98, etc.),
    you will probably need to print to printers on Windows machines. If this is the
    case, include this component.


    +   *   **IPX / Netware Connectivity** If you are on a local-area network powered
    by Netware, you will want to include this component.


    +   *   **Development** If you plan on writing programs on your Linux machine,
    you should click on the *development* component. This will allow you to program
    in such languages as Perl, C/C++, Python, TCL, and many others.


    If you don’t want to fool around with any of the components and have plenty of
    hard drive space, you can click on the “Everything” option to install all of Red
    Hat Linux on your computer. This kind of defeats the purpose of customization,
    though.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '**Note**


    Some packages require others to run. If you select individual packages and do
    not include all of the necessary packages, Red Hat Linux will inform you that
    you have *package dependency errors*. Fortunately, it will also resolve these
    issues for you.


    # ## X-Window System Configuration


    You now have to set up your computer for use with X-Windows. You will first be
    provided with a list of monitors.


    It''s important that you pick the right monitor from the list. Different monitors
    have different *refresh rates* which determine how often the image on the screen
    is updated. The higher the resolution, the higher the refresh rate, normally.
    Low refresh rates on high resolutions will make your screen flicker. But if your
    refresh rate is too high, you can cause your monitor to overheat and burn out
    the picture tube. The monitors in the list all have specifications pre-assigned
    to them from the manufacturer of the device, so you won''t damage your monitor
    if you choose one. If it''s not on the list, have Linux probe your monitor for
    its refresh rates. If it cannot find any, check in the manual for your monitor
    to see what refresh rates it suggests.


    After you select your monitor, you will need to select your graphics card. Pick
    this from the list. You will also have the opportunity to customize the resolution
    used in X-Windows. To do so, click on "customize" in the graphics card settings
    window.


    You will also have the chance to start the X-Window System to see if the monitor
    settings have taken effect and are right. If you''re confident that they''re okay,
    you can skip this step.


    # ## About to Install


    The installation program is about ready to install the operating system on your
    computer. Click "Next" to begin.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# # Installing Packages


    The first step that the installer will take is to format the Linux partitions
    you specified beforehand (see "Selecting Partitions for Format"). Then it will
    install the packages you selected in the "Selecting Components" dialogue.


    This can take quite a long time, especially if your hard drive is large or you''re
    installing a lot of different packages, so it might be a good time to get a bite
    to eat or otherwise take a break. This is the next-to-last step in the installation,
    but after it''s done we''ll have a little more work to do to get you up and running.


    # # Creating a Book Disk


    When the installation of all of the packages is complete, you will need to take
    out a floppy disk and label it (perhaps "Red Hat Linux Boot Disk" or something
    equally descriptive). Put it into the floppy drive and then click Next. Red Hat
    will format the floppy disk and place all of the necessary information on it to
    boot into Linux.


    Once this is done, you can remove the disk from the drive (unless you''re booting
    to Linux solely from a boot disk).


    # # You''re FINISHED!


    The installation program will then reboot your computer. Make sure that you remove
    the Red Hat Installation CD from the CD-ROM drive if you booted from the CD to
    install the software, otherwise the installation will begin again. (Don''t worry—if
    it does, just eject the CD and restart your computer.)


    You will then have the singular delight of watching your computer boot into a
    completely new operating system. We''re going to spend the next several chapters
    getting your computer completely set up for use with Linux and acclimating you
    to the wide variety of applications available for use with your system.


    Usually, at this point we suggest you take a small break, unless your brain isn''t
    fried by staring at a computer screen during the installation process. Learning
    the basics of Linux and GNOME can take a little while, and customizing everything
    to your whim isn''t always an instantaneous process. But it is a lot of fun.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Fast Installation Instructions


    As promised, I have collated the steps of the installation procedure and condensed
    them to a form that requires you to know basically nothing about the installation.
    It is highly recommended that you go through the installation at least once using
    the book before using this small outline.


    +   1. At the opening screen, press Enter.


    +   2. Choose your language from the list of available options.


    +   3. Configure your keyboard.


    +   4. Configure your mouse. It''s a good idea to emulate three buttons, since
    many applications in Linux use the third button. (Don''t emulate three buttons
    if you already have a three-button mouse.)


    +   5. Choose your installation method (class). If you are not using a custom
    installation class, skip to instruction 8. If you are installing Linux for the
    second time, it is highly recommended that you use a custom installation class—you
    might be able to save some of your old data this way.


    +   6. Create, Edit, and Delete the partition scheme to your liking. Make sure
    to write down the mount points and device names of all of the partitions.


    +   7. Select which partitions you want to format.


    +   8. Configure the Linux Loader (LILO).


    +   9. Configure your Network Settings.


    +   10. Configure the Time Zone.


    +   11. Choose the root password and add your own account.


    +   12. Configure the authentication options. The defaults are usually fine, but
    if you''re on a network, check with your systems administrator to see if you need
    to enable the NIS options.


    +   13. Select components or packages.


    +   14. Configure X-Windows for use with your monitor and graphics card.


    +   15. Wait for the installation program to format the partitions you selected
    and install the components you chose. Then create a boot diskette.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# CHAPTER

    3


    # The Basics

    of Use

    and Setup


    In this chapter, we present conceptual understanding of some key topics in the
    Linux Operating system. We won''t make any substantial changes to your user account
    or to the system itself during the course of this chapter, but we try to present
    a few procedures and concepts you will need to understand throughout the course
    of your use of Linux.


    We talk about logging into your machine and logging out, the concept of groups
    and permissions, the root user, and shutting down the computer.


    These are basic concepts and procedures that you''re going to use when you use
    Linux, and they will provide you with a few elementary "dos and don''ts" for when
    you just start out. If you re familiar with all the topics listed above, you probably
    don''t need to read this chapter-you can skip ahead to customizing your own account.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_66_0.png)'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# ## Logging In and Out of Your Account


    Linux is a true multi-user system, and therefore makes use of many different user
    accounts. We use the word “account” virtually the same way you would apply it
    to your various bank accounts. Each bank account has its own features specific
    to it. Similarly, each user has his own account, which he can modify to fit his
    own tastes. (Though you have a little more latitude with a user account on your
    Linux machine than you do with your bank accounts.)


    Windows is also a multi-user operating system, but it lacks a number of the security
    features that Linux provides. Rather than provide a genuine account, Windows basically
    provides you with a way to select different user profiles to tailor your experience
    with Windows.


    To access your account, you must log in to your computer. This is a fairly simple
    process. After the computer has rebooted, a screen will appear asking for your
    user name. Simply type in the one that you created during the installation and
    press the enter key. Then a new window will pop up asking for your password. Type
    this in, too, and press enter. Voila! You’ve just logged in. Pretty simple.


    **Note**: If you didn’t create your own user account, consult Chapter Five for
    the process. There are some basic systems administration procedures detailed there,
    among them how to create a new account.


    When you’ve logged in, you’ll see a pretty sparse desktop laid out before you
    and a relatively boring panel at the bottom of the screen. This is akin to the
    Windows “Start Bar.” In the next chapter we make this look a lot more exciting,
    but for the moment all we want to do is follow the procedure for logging out of
    the system.


    To log out, click on the stylized foot at the far left of the bottom panel. Near
    the bottom of the menu that appears is an option labeled “Log Out.” If you click
    it, a new menu will appear. You can just click okay.


    The screen that appeared when you booted up will reappear with a prompt asking
    you to please input your user name. That’s not necessary at the moment, since
    none of our tasks in this chapter require logging in.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# ## Groups and Permissions


    Groups and permissions are two of the most fundamental concepts of Linux, and
    unfortunately two of the most difficult concepts for the new user to grasp. I
    mentioned in the previous section that Linux offers considerably more security
    than Windows does for multi-user purposes.


    This is due in a great part to the system of groups and permissions. To understand
    groups and permissions, you must also understand that each user falls into at
    least one of three different classifications: *owner* or *user*, *group*, and
    *other*. Every file and directory on your system has *permissions* set which tell
    the computer whether or not a user is allowed to read a file, create one, or run
    a program.


    These permissions are organized into three groups of three permission bits: *read,
    write*, and *execute*. They are abbreviated r, w, and x, respectively.


    # ### The Owner Classification


    The owner classification refers to the owner of a file. You can become an owner
    of a file by creating one or having ownership of a file transferred to you. The
    owner is the only person who can change permissions to a file or directory.


    # ### The Group Classification


    The next classification is the group classification. Each file belongs to one
    owner. But the owner himself belongs to one or more *groups*. These groups may
    consist of many different users and for many different purposes. Most users, for
    instance, belong to the “users” group. Administrators might belong to the “adm”
    or “admin” group.


    An owner of a file can also allow members of his group certain access levels to
    the file. This is helpful if you have memories that need to be shared or programs
    that need to be restricted from other users.


    # ### Everyone Else (Other)


    Users who are not the owner of a file or in the owner’s group are called “other”
    users. In common parlance, this means “everyone else” who isn’t included in those
    other classifications.'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'Each of these users also has a certain access level to any given file, as determined
    by the owner of the file.


    # The Permission Bits


    Each classification is assigned certain permission bits. The three permissions
    assigned to a file or directory in each of the three classifications are the read,
    write, and execute bits. If the read bit is enabled, access is granted to view
    the contents of a file. If the write bit is enabled, access is granted to either
    create a file (in the case that write access is granted in a directory) or modify
    it (in the case that write access is granted on a file itself). If the execute
    bit is enabled, access is granted to either enter a directory or run a program.


    A combination of these three bits is assigned to each user classification to define
    who has what access to a file or directory. An owner, for instance, might be given
    both read and write permission, while his group has only read permission and everyone
    else is denied read and write permission.


    # Practical Application of Groups and Permissions


    If you haven’t guessed already, groups and permissions allow you extensive control
    over who can view files. Most Windows users don’t realize this, but their files
    aren’t remotely secure (unless you use an encryption program or password protect
    your documents). They’re openly available to anyone who uses the computer.


    Under Linux, you can more or less dictate who has the permission to look at your
    files. You can also organize users into various groups. This has a lot of practicality
    in the event that your system is quite large and needs to classify people according
    to groups. For instance, college students on computer machines at school are frequently
    placed in different groups than graduate students and faculty. Administration
    staff, as we already pointed out, are often placed in a separate group from regular
    users.


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_69_0.png)


    > **Note**

    > We haven’t covered how to change and modify groups and permissions yet. This
    is another topic that is covered in later chapters. Specifically, look at Chapter
    Eight.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# The Root User


    One of the main concerns, whether you’re very experienced with Linux or not, should
    be the root user. The root user is incredibly powerful, because the limits imposed
    by groups and permissions don’t apply to him. This means that the root user can
    change permissions for any file, read any file, write to any file, and execute
    any program on the system.


    The root user is sometimes called the “superuser” because users in the group wheel
    can become the superuser by using the su command. The root user handles almost
    all of the maintenance tasks for the entire system, such as making any hardware
    upgrades, most software upgrades, creating users and removing old ones, configuring
    hard drives, setting up network devices, and so on and so forth.


    When we look at basic systems administration, we’ll go over some of these topics
    in greater detail.


    # Shutting Down the Computer


    Only the root user or a user with appropriate permission can shut down the computer.


    The reason that we mention this now rather than elsewhere in the book is because
    many readers will stop reading at some point and decide to either explore the
    system on their own or will want to go to bed and turn off the computer. Doing
    so improperly can have poor effects on your computer.


    The basic procedure for shutting down your computer is as follows. First, log
    in as the root user, using the username of “root” and the password you specified
    during the installation process.


    Click on the stylized foot at the bottom of the screen and then click on logout.
    But instead of using the regular “log out” option, you should choose “Shut down.”
    Then click okay and your computer will halt.


    It’s important that you never shut down the computer by simply pressing the power
    button. This can damage your hard drive and floppy disks in your floppy drive.
    Always make sure that you shut down the computer using the procedure outlined
    here.'
  merge: -1
  img_proc: true
