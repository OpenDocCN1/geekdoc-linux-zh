- pgno: 358
  md: '# CHAPTER

    20


    ![](img/92fb6d8ad19de3b3470ba95c7b71b82e_358_0.png)


    # Games on Linux


    Red Hat comes with a number of games installed on it. We''ve covered some of the
    more popular ones. Some are controlled by mouse and others by the arrow keys.
    Many you have doubtless seen before on other operating systems.


    There are also a number of commercial games which you can purchase for Linux,
    including the ever popular Quake. Loki Software makes a number of good games for
    Linux and we have endeavored to give an overview of what they have to offer also.


    # Main Games Menu


    These games are available from the main GNOME menu under games.


    # Same Gnome


    Same GNOME is a rather easy but cute game, best suited for children though it
    seems to hold some amusements for adults. There are three types of balls and the
    object is to get a high score for eliminating balls. A single mouse click will
    eliminate all balls of the same type that touch either horizontally or vertically.'
  merge: -1
  img_proc: true
- pgno: 359
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_359_0.png)


    Figure 20-1  *Sane GNOME*


    The more balls eliminated with a click, the higher the score you get. Eliminating
    all the balls will get you a 1000 bonus points.


    To help you know how many balls will be eliminated by a mouse click, the affected
    balls animate when you hold the mouse over one of them.


    There are several “themes” of balls you can use to play the game. The illustration
    shows a screenshot of the planet theme. There are even some instructions for creating
    your own themes.


    # Aisle Riot


    Aisle Riot is a literal riot of solitaire games. The default is Klondike, but
    there are an additional thirty-one variations of solitaire including Canfield,
    Clock, Scorpion, Zebra, *Auld Lang Syne*, and more.'
  merge: -1
  img_proc: true
- pgno: 360
  md: '![](img/92fb6d8ad19de3b3470ba95c7b71b82e_360_0.png)


    Figure 20-2

    Aisle Riot.


    There is an extensive help area with instructions and strategy for each card game.


    There are a few options which the user can define, such as card decorations and
    font. Aisle Riot will allow the user to set up large fonts for those who might
    be visually impaired.


    # Chess


    For the chess buff, there is a chess game in Linux. Documentation of rules to
    play the game is scant, so you should know the basic chess moves.'
  merge: -1
