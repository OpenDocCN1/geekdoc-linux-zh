  md: '# Figure 2.6 Using Semaphores for Synchronization between Processes


    ![](img/5c85d865d33d2c2c3c815331ae6c6f4a_76_0.png)


    There are two types of semaphores available to a developer, unnamed and named.
    Unnamed semaphores can be used within the same process for thread synchronization.
    UNIX provides unnamed semaphores that can be accessed by multiple processes in
    which processes are children of the first process.


    Named semaphores are those that are normally accessed between multiple processes.
    A named semaphore accessed by one process can be accessed by another process by
    simply referring to the semaphore''s name. Because the name of the semaphore uniquely
    identifies it within the UNIX operating system, no additional semaphores bearing
    the same name can be created.


    # Programming Unnamed Semaphores in UNIX


    The semaphore system calls in this section comply with the POSIX standard. POSIX
    standard semaphores can be found on any POSIX-compliant UNIX operating system.
    The POSIX standard provides for unnamed semaphores. UNIX System V provides only
    named semaphores. All the semaphore system calls introduced can be found in the
    `semaphore.h` file.'
