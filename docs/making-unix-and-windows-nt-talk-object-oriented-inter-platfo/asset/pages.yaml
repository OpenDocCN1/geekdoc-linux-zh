    # The Producer-Consumer Problem Revisited


    A consistent problem with the consumer-producer systems introduced in Section
    2.4 and Sec- ond 2.5 is that the producer and consumer need to be initialized
    separately. Since both the consumer and producer accept command-line arguments
    that include a shared semaphore name and filename, they need to be started with
    the same command-line values; otherwise, communication does not exist. Another
    problem with starting the producer and consumer separately is that they need to
    be started in a particular order. The producer initializes the named semaphore
    when started, and the consumer opens the named semaphore when it is started. If
    the consumer is initialized before the producer, the named semaphore does not
    exist (the producer creates the named semaphore) and the consumer fails. A final
    problem with the previous producer-consumer systems is that the only way the consumer
    knows that its producer has exited is when the producer writes the "QUIT" command
    to the producer-consumer shared file. If the producer exits by some other method,
    such as receiving a signal, the consumer does not detect its termination and continues
    executing. For the multiple producer-single consumer problem, this could result
    in many threads running without producers, which wastes system resources.


    The ability to spawn processes alleviates the existing problems with the producer-consumer
    system. The producer-consumer system that best demonstrates the benefits of spawned
    processes is the multiple producer-single consumer system. The consumer process
    has knowledge of all producers since the shared file and semaphore name combination
    is passed on the command line for each producer with which communication takes
    place. Currently, the consumer creates a separate thread to communicate with each
    producer in the system. The consumer thread opens, but does not create, the shared
    named semaphore, the producer must create the named semaphore. To ensure the semaphore
    is created, the consumer spawns a producer, passing the semaphore and filename
    before it creates the producer''s consumer thread. After the producer is spawned
    and before the consumer thread opens the named semaphore, a short pause is needed
    to ensure that the producer has initialized the named semaphore.


    Even though the consumer spawns all appropriate producers, there is still no way
    of telling whether or not a producer has exited. Using XPCWaitPid and constructing
    it with the producer''s process ID, the consumer process can wait until the producer
    process exits. The consumer is informed of the producer, regardless of how it
    came about. The consumer can even detect what caused the producer to exit, using
    getStatusDefinition().

    The problem is that XPCWaitPid blocks the calling process. If the consumer spawns
    a producer and waits for it, no additional producers can be spawned. The solution
    is to create new threads that spawn the producer and wait for it to complete.
    By containing the spawning of producer processes within a separate thread, the
    main thread is not blocked and continues processing. Since the threads that spawn
    producers know when their producer is complete, the threads can send kill signals
    to their related consumer threads. Currently, the consumer threads are killed
    when the main thread processes "QUIT" from'
