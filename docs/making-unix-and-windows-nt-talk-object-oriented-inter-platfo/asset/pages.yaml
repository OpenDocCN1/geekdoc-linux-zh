  md: '# Initializing the Unnamed Semaphore


    The first system call, sem_init(), introduces a method to create and initialize
    unnamed semaphores. A semaphore must be created with an initial value that cannot
    be greater than SEM_VALUE_MAX defined in semaphore.h. Semaphores enter a "wait
    lock" state when the value of the semaphore is greater than 0, a lock can occur.
    When a lock occurs, the value of the semaphore is decremented by 1. When the lock
    is released, the semaphore is incremented by 1. In some cases, it is useful to
    have the semaphore''s initial value be greater than 1. An example is controlling
    the number of threads spawned by a program. If threads are spawned in a loop,
    the semaphore is locked for each spawned thread and no more threads are spawned
    when the semaphore reaches a value of 0. As each thread completes, the thread
    releases its lock and another thread is spawned from the loop as the semaphore''s
    value is increased.


    The sem_init() prototype is shown in the following code fragment. The first prototype
    stores the address of the semaphore into a variable pointing to a sem_t structure
    that is used in other semaphore operations. The second parameter is an indicator
    that specifies whether the unnamed semaphore can be shared between processes.
    The last parameter is the initial value of the semaphore; its value cannot be
    negative.


    ```

    int sem_init(sem_t *sem, int pshared, unsigned int value);

    ```


    # Initializing the Named Semaphore


    Named semaphores can be used by threads within the same process or shared by other
    processes on the same UNIX workstation. To share a semaphore, the semaphore must
    have a unique name with access to it. All processes accessing the named semaphore
    must know its name.


    A semaphore name is a character string constructed just like a pathname. The only
    requirement for the name is that it starts with a forward slash ("/") and there
    are no forward slashes in the string. For maximum portability, the name should
    not be longer than 14 characters. The name does not have to appear in the file
    system. However, like a path-name, the semaphore has a user ID, group ID, and
    permissions. The sem_open() system call creates semaphores.


    ```

    sem_t *sem_open(const char *name, int oflag)

    sem_t *sem_open(const char *name, int oflag, unsigned long mode, unsigned int
    value);

    ```


    The first prototype shown is for opening an existing semaphore with the name specified
    in the first parameter. The second prototype can open an existing semaphore, as
    well as create a new semaphore with a unique name. To open an existing semaphore
    using the first prototype, the oflag parameter must be set to 0. If the semaphore
    name exists and is accessible, sem_open() returns the address of the semaphore;
    otherwise, -1 is returned, indicating failure. The second prototype''s oflag parameter
    can contain two different values other than 0. These values are explained in Table
    2.9.'
