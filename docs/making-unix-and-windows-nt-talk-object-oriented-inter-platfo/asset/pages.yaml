    Remote Process Execution (REXEC) REXEC is an application that allows the user
    to remotely execute a process on a host connected to the network. REXEC uses TCP
    transport layer protocols for communication purposes. When a user attempts to
    execute a process on a remote machine using REXEC, the user''s username and password
    are authenticated. If the process requested could not be spawned, the user is
    notified; otherwise, the processes open up to two TCP communication channels.
    One channel is used for transmitting data to and from the remote application and
    the other channel is used for sending signals to the remote application. Currently,
    only UNIX supports REXEC connections, although both operating systems contain
    clients that can connect to UNIX workstations having REXEC enabled. Third-party
    Windows NT software is available to enable process spawning upon REXEC connections.


    # The Internet Address


    The Internet address is comprised of 32 bits and encompasses both a network address
    and a host address. The format of an IP address is Network Address + Host Address.
    Every host on a TCP/IP Internet must have a 32-bit IP address. The host address
    does not necessarily identify the host, but the host''s connection to network.
    Therefore, if the host moves to a different network, it must obtain a different
    IP address.

    IP addresses have four different formats, known as class A, class B, class C,
    and class D. Figure 4.2 illustrates the four formats of the 32-bit IP addresses.


    # Figure 4.2 IP Address Formats


    | Class A | | |

    | 0 | Network Address (7 bits) | Host Address (24 bits) |

    | Class B | | |

    | 10 | Network Address (14 bits) | Host Address (16 bits) |

    | Class C | | |

    | 110 | Network Address (21 bits) | Host Address (8 bits) |

    | Class D | | |

    | 1110 | Multicast Address (28 bits) |

    | Future Use | | |

    | 11110 | Future Use |'
