  md: '# Integrating Sockets with Windows 433


    # Event Definition

    Virtual Function Notified


    FD_ACCEPT

    Accept() is notified when a socket connection is buffered (TCP sockets only).


    FD_CONNECT

    Connect() is notified when a socket connects to its peer (TCP sockets only).


    FD_CLOSE

    Close() is notified when the connected socket is closed by its peer (TCP sockets
    only).


    Attach() events are locally ORed to contain all events that receive notification.
    It is important that the associated virtual functions for the events defined are
    overridden. Although, virtual functions not overridden perform their default task
    and, therefore, are not specialized for the application.


    Attach() and the overridable CAsyncSocket virtual functions, along with CAsync-Socket''s
    GetLastError(), are the only methods required for integration with XPCUdpSocket
    and XPCTcpSocket. Other CAsyncSocket methods that could be useful described in
    Table 5.24.


    # Table 5.24 Additional CAsyncSocket Method


    | CAsyncSocket Class Method | Definition |


    | Detach(); | Returns the socket file descriptor contained within the m_hSocket
    data member and sets m_hSocket to NULL. |


    | BOOL GetPeerName(CString &rPeerAddress, UINT &rPeerPort); | Returns the address
    and port number of the connected host. This method can only be used for TCP sockets.
    Returns TRUE for success; FALSE for failure. |


    | BOOL GetName(SOCK *pSockAddr, int *pSockAddrLen); | Returns the address and
    port number of the local socket. If the socket is a TCP socket and a connection
    has been made to a peer using connect(), this method provides the only means to
    retrieve the local address association by the system. Returns TRUE for success;
    FALSE for failure. |


