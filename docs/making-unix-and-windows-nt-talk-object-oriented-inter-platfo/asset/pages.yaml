  md: '# Chapter 1


    # Introduction


    # 1.1 The Need to Communicate


    Communication between two or more computers on the same network is not a new concept.
    Such communication has occurred since the early 1970s with the introduction of
    the ARPANET, the predecessor to the current Internet. The ARPANET was funded by
    the Department of Defense and was created as a means to ensure information stored
    on one machine could be retrieved from another machine in a different location
    in case of emergency.


    The distribution of information on machines in a network and the need for machines
    share information with other machines still exists today. In the days of the ARPANET,
    the networked machines were mainframes that ran compatible operating systems.
    The networks that evolved in the late 1970s and early 1980s were networks of workstations
    running UNIX. Soon Personal Computers (PCs) entered the picture, running Windows
    NT. Windows NT introduces many differences in comparison with UNIX, including
    the methods for storing and organizing memory, the file system layout, and the
    methods for spawning processes. Today, networks consist of a heterogeneous mix
    of UNIX workstations and Windows NT PCs. This mixed network introduces a complexity
    for machine-to-machine communication, since both operating systems organize information
    differently. This book will point out the differences in the two operating systems
    and explain how to design and create applications that communicate and take full
    advantage of features in both operating systems.'
  merge: -1
  pgno: 12
