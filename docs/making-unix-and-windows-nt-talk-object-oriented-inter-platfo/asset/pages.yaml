    \ investigated.\nWithin the UNIX operating system, an application can assume an\
    \ owner or group ID at runtime that differs from the user running the application.\
    \ The ID assumed at runtime is referred to as the effective ID. To determine whether\
    \ an application has owner or group ID the real user ID and effective user ID\
    \ need to be checked. The four system calls are used to accomplish this task.\
    \ They all return an ID, and take no parameters.\n\n# User ID System Calls\n\n\
    Table 2.5\n\n| Prototype | Purpose |\n|---|--|\n| unsigned short getuid() | Returns\
    \ the real user ID that the application is using. |\n| unsigned short getgid()\
    \ | Returns the real group ID that the application is using. |\n| unsigned short\
    \ getuid() | Returns the effective user ID that the application is using. |\n\
    | unsigned short getgid() | Returns the effective group ID that the application\
    \ is using. |\n\nWhen determining access to a pathname, the IDs returned from\
    \ the system calls are compared with the pathname's name and group ID returned\
