    # 2.5 Threading Applications in a UNIX Environment


    All of the example applications so far contain only one thread of execution. Programs
    using the procedure main() create a thread of control. The thread created by main()
    is referred to as the main thread of the program. UNIX provides the ability to
    add additional threads to an application. When a thread is spawned, it is said
    to be the child of a parent thread. Each thread executes simultaneously with all
    other threads in the program and with other threads from active programs. Each
    new thread shares all of the process''s global data with the other threads in
    the program. Even though the new thread shares the process''s global data, it
    does not share its attributes and calling stack, but has its own, allowing it
    to execute separately from other threads. Threads also inherit their parent thread''s
    signal mask. The parent thread''s pending signals are not inherited and, therefore,
    the thread does not process them.'
