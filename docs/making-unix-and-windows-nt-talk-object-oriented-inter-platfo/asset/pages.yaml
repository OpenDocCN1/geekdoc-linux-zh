    \ \" << globalMsg.filename << endl;\n}\n```\n\n# 2.7 Creating UNIX Daemon Processes\n\
    \nA daemon process is a process that executes in the background. A process executing\
    \ in the background does not monopolize the current shell. The daemon maintains\
    \ an active state, waiting for an event or a specific time interval to occur with\
    \ the goal of performing a task. Several daemons run on most UNIX systems. A common\
    \ one is the Internet daemon, which waits for processes external to the current\
    \ host to connect. The daemon validates the connecting process's permissions for\
    \ accessing the system, and if the permissions are valid, it spawns a new process\
    \ for communication purposes.\n\nBecause it is important for a daemon to remain\
    \ in an active state, a few \"tricks\" are performed to ensure a daemon process\
    \ does not terminate or become inactive. These tricks include the following:\n\
    \n**Preventing Signals from Stopping the Daemon Process** Because the daemon must\
    \ always be in an active state, the SIGSTOP signal is ignored.\n\n**Preventing\
    \ Daemon Termination Due to Loss of Terminal Control** The daemon must be executed\
    \ in the background. If it is executed in the foreground, it is tied to a terminal.\
    \ The terminal disconnects and dies, the daemon also dies. To execute a daemon\
    \ in the background after it has started in the foreground, a child process is\
    \ spawned and its parent process exits. Because fork() creates an exact duplicate\
    \ of the parent process, all that is required is that the parent forks and exits.\n\
    \nTo ensure that the terminal from which it was spawned does not affect the daemon,\
    \ I/O interrupts are caught and ignored. The terminal interrupts are sent via\
    \ SIGTOU (write to terminal) and SIGTTIN (read from terminal). A signal handler\
    \ of SIGIGN catches and ignores these signals.\n\n**Protecting the Daemon's Current\
    \ Working Directory** The UNIX keeps keeps working directory open during its life\
    \ span. Because a daemon is never supposed to die\n\n```\nint chdir(const char\
    \ *path);\n```\n\nchdir() takes one argument, a character string, that defines\
    \ the current working directory path. If chdir() is successful, 0 is returned;\
    \ otherwise, -1 is returned."
