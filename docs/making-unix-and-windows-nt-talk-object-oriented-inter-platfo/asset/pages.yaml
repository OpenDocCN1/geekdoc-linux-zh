  md: '# Appendix A


    # # The Sample Code and Files on CD-ROM


    The sample code on the companion CD-ROM is organized into two sections. One section
    is for all Windows NT Visual C++ code and the other is for UNIX. All the code
    has been compiled and tested on Windows NT 4.0 and Solaris 5.6 (Unix System V)
    machines. The compiler used on Windows NT is Visual C++ version 5.0 and Sun''s
    C++ compiler was used on the UNIX platform. It is the authors'' belief that all
    code will successfully compile and run on all versions the operating system and
    compiler equal to or greater than those listed above. If you encounter any problems
    executing the example code on future operating systems and/or compiler versions,
    please let the authors know (we would be even more interested in solutions to
    problems encountered). The authors can be contacted at unixnt@yahoo.com.


    The CD-ROM listings are organized by chapter and section within a given chapter.
    When creating projects within Visual C++, a directory is created within each project.
    Therefore a typical directory structure for a Windows NT project is as follows:


    ```

    chapterX\sectionY\projectZ

    ```


    Because an integrated development environment is not used on UNIX, the projects
    are located directly within the chapter or section directory. If the chapter or
    section contains only one main project, then it would be found in its given chapter
    or section directory with a single Makefile. If multiple projects are associated
    within a chapter or section, then each project has a separate Makefile related
    to building the given project. The Makefile is named'
