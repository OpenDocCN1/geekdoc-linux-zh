  md: '# Sending Signals


    With the UNIX signals defined, let''s introduce system calls that can process
    these signals. The system calls discussed can be found in the signal.h header
    file. The first-related system call, kill(), sends signals from one to another
    process and from one to a group of processes.


    ```

    int kill(int pid, int sig);

    ```


    The kill() system call takes two arguments, pid and sig. The pid parameter is
    the process ID to receive the signal and the sig parameter is the signal to send.
    If kill() is successful, 0 is returned; otherwise, -1 is returned. If the argument
    is 0, error checking is done on the value of pid, but no signal is sent. This
    is used to test the validity of the process ID defined by pid. If kill() returns
    a -1 in this case, pid is invalid. In total, pid can have five different types
    of values that control processes receive the signal.


    # Table 2.8 kill() System Call Signal Destinations


    | pid Value | Signal Destination |

    |--- |--- |

    | 0 | The signal is sent to all processes in the sender''s process group. |

    | -1 (sender is not the super user) | The signal is sent to all processes whose
    real user ID equals the effective ID of the sending process (see page 28 for an
    explanation of real and effective user IDs). |

    | -1 (sender is the super user) | The signal is sent to all processes other than
    the system processes. |

    | less than -1 | The signal is sent to all processes whose process group ID equals
    the absolute value of pid. |

    | Equal to the receiver process ID | The signal is only sent the specified process.
    This signal is only sent if the sender has the same effective ID as the receiver.
    |


    # Turning On an Alarm


    Another useful method of signaling a process is by setting an alarm. An alarm
    can be set using the alarm() system call.


    ```

    unsigned int alarm(unsigned int sec);

    ```


    The sec parameter is the number of seconds and the value returned is the amount
    of time previously remaining in the alarm clock of the calling process. If sec
    is set to 0, previously set alarm is cancelled. The seconds are decremented in
    real-time. When the number of seconds reaches zero, the SIGALRM signal is sent
    to the calling process. SIGALRM can be trapped by a user-defined signal handler.
    Alarms are set and handled within a single process.'
