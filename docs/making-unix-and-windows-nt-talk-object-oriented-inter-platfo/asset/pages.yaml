  md: '# 2.6 Spawning Processes


    The ability to spawn processes is important for interprocess communication. As
    future chapters unfold, it will become evident that spawning processes is also
    very important for platform communication. For processes to communicate with each
    other, there must be at least two in existence. If programmatic process creation
    were not available, all communication would have to be launched manually. If there
    were more than one process within the communication network, manually launching
    each process would be very time consuming. Message loss can occur if one process
    is sending information to another that has not yet been created. A process''s
    ability to spawn others ensures proper communication.


    When one process spawns another, the process spawning is referred to as the parent
    process and the process spawned is the child process. Under default conditions,
    the child process shares the resources of the parent process, including the following.


    +   * Real User ID

    * Real Group ID

    * Effective User ID

    * Effective Group ID

    * Process Group ID

    * Terminal Group ID

    * Root Directory

    * Current Working Directory

    * Signal Handling Settings

    * Resource Limits

    * All Attached Shared Memory Segments

    * Scheduler Class

    * File Mode Creating Mask


    A spawned process also shares all file descriptors with its parent. The file descriptors
    are not inherited. Instead, the child makes its own copies of the parent''s file
    descriptors. The parent must close file descriptors opened for the child so that
    both processes are not sharing the same file. If the parent does not close its
    file descriptors, any changes made by the process could affect the other. If both
    parent need to use the open files, semaphores should be used to ensure file access
    is synchronized. In addition to differing file descriptors, the child differs
    from the parent in other ways, including the following.


    +   * New process IDs are created for both parent and child.

    * The time left on an alarm clock signal is set to 0.

    * Pending parent signals are not inherited.

    * Asynchronous input or output operations are not inherited.


    One reason for spawning processes is to take advantage of distributed processing.
    If a large task needs to be done, multiple processes can be spawned, each completing
    a small part of the overall job. Because these processes are spawned at the same
    time, they run separately. The overall task is finished in a much shorter period
    because a single process runs synchronously and a distributed process runs asynchronously.'
  merge: -1
  pgno: 126
- img_proc: true
  md: '# Chapter 2: UNIX Building Blocks


    The same distributed systems can be written with threads. The advantage of using
    threads is less overhead associated with spawning a thread. The advantage of spawning
    processes is that they run separately from the parent process and can share the
    process''s global resources. There are additional advantages of spawning processes
    over spawning threads, including the following:


    +   * Processes can be killed more easily by sending a signal to their process
    ID.

    * Child processes are separate executables that can be updated without having
    to touch the parent process.

    * Child processes can continue to run, even if the parent process dies.

    * Child processes do not share their parent''s memory.

    * If a child process crashes, it does not take down its parent.


    The last advantage listed is similar to that of a detached thread (see “The Detached
    Attribute” on page 91). Detached threads also have the ability to run separate
    from their parent thread. However, unlike spawned processes, which have their
    own process ID, it is not easy to kill and control detached threads.


    A completely detached process shares none of its parent''s attributes and is not
    affected by outside signals or events. When process is called a daemon process.
    A daemon process runs in the background, waiting to perform a task at a given
    period of time or waiting for an event to occur. Since the daemon process needs
    to run all the time, it is important that no events outside an explicit kill (such
    as the receipt of a SIGKILL signal) interrupts the daemon process.


    The remainder of this section explains how to spawn children processes from a
    parent to accomplish the following goals:


    +   * Interprocess Communication

    * Distributed Task Processing

    * Creating Daemon Processes


    # Forking Processes


    The UNIX system call used to create children processes is fork().


    ```

    int fork(void);

    ```


    The parent process calls fork(). The child process is a copy of the parent process.
    Because the child process is a copy, it inherits many of the same attributes held
    by the parent. fork() is called once by the parent process, but returns twice
    — once for the parent and once for the child. If fork() fails, -1 is returned
    and the global variable errno is set to the error value that caused fork() to
    fail. If fork() is successful, it returns 0 to the child process and returns the
    child process''s process ID to its parent''s process ID, the system calls detailed
    in Table 2.21 can be used.'
