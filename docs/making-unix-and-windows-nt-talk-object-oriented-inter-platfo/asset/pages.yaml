  md: '# UNIX Semaphores


    After the consumer is initialized, it attempts to lock the semaphore. The consumer
    reads the data the producer writes. Because the producer releases the semaphore
    after completing writing to the file, the consumer is guaranteed to receive data
    when it achieves a lock. Data is removed from the file and the semaphore is released
    when the consumer finishes processing the data. Thus, the file is used as a First-In-First-Out
    (FIFO) queue in which data is taken off the queue in the order it is put on. The
    release of the semaphore allows a lock of the semaphore by the producer. The consumer
    waits for the producer to unlock the semaphore before it processes additional
    data from the file.


    # Figure 2.7 The Producer-Consumer Model Using Semaphores


    ![](img/5c85d865d33d2c2c3c815331ae6c6f4a_92_0.png)


    The producer must be started before the consumer because both the producer and
    consumer lock the semaphore when accessing the shared file. If the consumer is
    first, one of two things might happen. The named semaphore might not exist. The
    producer creates the semaphore and the consumer only accesses its address, so
    the consumer would fail if the semaphore does not exist. If the semaphore did
    exist, the consumer would get the lock first and find that there is no data in
    the file. Without a producer, the consumer continuously loops, locking the semaphore
    and finding no data in the file.


