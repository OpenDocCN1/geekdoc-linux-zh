    reading memory may try to access data that no longer exists.


    To protect the global memory, semaphores are used. Each time a thread accesses
    shared memory, it locks a semaphore. The semaphore is released when the thread
    completes its memory manipulation. The steps required for creating a threaded
    TCP server are the same as they are for creating a multiprocess TCP server, but
    the architecture for the multithreaded TCP server differs. The threaded TCP server
    architecture is displayed in Figure 5.9.'
