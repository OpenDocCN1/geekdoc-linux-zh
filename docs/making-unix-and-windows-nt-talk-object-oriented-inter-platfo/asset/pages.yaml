    # Closing the UDP Socket Connection


    When socket communication is completed, the socket file descriptor needs to be
    closed. Two system calls, close() and shutdown(), are used to close a socket connection.
    For UDP sockets, the close() closes the socket connection and returns immediately,
    even if there are pending messages on the socket. close() takes one parameter,
    the socket file descriptor. The close() system prototype is shown in Table 5.7.


    # Table 5.7 The close() System Call Prototype


    | Prototype |

    | int close(int socket) — UNIX, int closesocket(int socket) — Windows NT |

    | Return Values |

    | 0 indicates success., -1 indicates failure. |

    | UNIX Header File |

    | <unistd.h> |

    | Windows NT Header File |

    | <winsock2.h> |


    The shutdown() system gives more control over how the socket is terminated. Since
    sockets are a full-duplex transmission system (data can be received and sent simultaneously),
    shutdown() provides a means of closing only one part of the socket transmission
    system without affecting the other. shutdown() contains a how parameter that is
    used to specify how the socket shuts down. The possible values of the how parameter
    are as follows.


    +   - 0 — No more data can be received on the socket

    - 1 — No more data can be sent on the socket

    - 2 — No more data can be sent or received


    The shutdown() system call prototype is shown in Table 5.8.


    # Table 5.8 The shutdown() System Call Prototype


    | Prototype |

    | int shutdown(int socket, int howto); |

    | Return Values |

    | 0 indicates success., -1 indicates failure. |

    | UNIX Header File |

    | <socket.h> |

    | Windows NT Header File |

    | <winsock2.h> |'
