    # The Stock Market Position Tracking System Using XPCasyncTcpSocket


    The interface for the stock position tracking client using the XPCasyncTcpSocket
    remains the same as all other stock position tracking client examples. An addition
    is to the framework of this example. In the previous examples, the client published
    transaction messages and the server responded with the updated position record.
    In the example using XPCasyncTcpSocket, the client also acts as a server to a
    UNIX-based TCP client. The UNIX-based client is a price publishing client. For
    the purposes of clarity, a client application is any application that makes a
    connection. When the position tracking client receives a price, it not only displays
    the current ticker position, but also its current value. In the real world, it
    makes more sense for the price to be a server, whereby all position tracking clients
    connect to the price server as all price updates are sent to the connected clients.
    The position tracking client also acts as the connection point for the UNIX based
    price provider to illustrate the creation of both a client- and server-based application
    using XPCasyncTcpSocket. The architecture for the current version of the stock
    position client-price server is shown in Figure 5.15.'
