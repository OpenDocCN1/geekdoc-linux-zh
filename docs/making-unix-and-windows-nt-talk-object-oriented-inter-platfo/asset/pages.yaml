  md: "# Threading Applications in a UNIX Environment 97\n\nPOSIX threads are referenced\
    \ by their ID defined in the pthread_t structure. Joinable threads share the entire\
    \ address space of the parent process. By sharing the address space, these threads\
    \ can modify global variables and access open file descriptors. Thread creation\
    \ is dynamic, and therefore, it is unnecessary to define the number of threads\
    \ created prior to run time. It is also unnecessary to schedule thread creation.\
    \ Threads can be created at any point during runtime.\n\nThreads are created using\
    \ pthread_create() system call.\n\n```\nint pthread_create(pthread_t *tid, const\
    \ pthread_attr_t *attr, void\n    *(start_routine)(void *), void *arg);\n```\n\
    \nIf pthread_create() is successful, 0 is returned. The tid parameter points to\
    \ the ID of the thread. Threads contain attributes defined by pthread_attr_t.\
    \ A pointer to the attributes is passed to pthread_create(). If the value of attr\
    \ is NULL, the thread uses default attributes (see Table 2.10). The newly created\
    \ thread calls a function pointed to by start_routine(). This routine is the function\
    \ calls when it is created. The function takes a single void pointer as an argument.\
    \ If multiple values need to be passed to the thread function, they must be packed\
    \ into a structure, and that structure's address is passed to the thread. The\
    \ function pointed to by start_routine() returns a void pointer and is treated\
    \ as the return value for the thread. The final pthread_create() argument is the\
    \ parameter passed to the thread function. The thread function must cast the argument\
    \ received to its original type to correct the argument's value.\n\n# Waiting\
    \ for a Thread to Exit\n\nOnce a thread is created, it runs in its own stack space\
    \ separate from the stack space of the parent. The parent thread continues execution.\
    \ If the parent thread completes execution and exits, the threads spawned also\
    \ exit. To avoid unintended thread completion, POSIX offers a system call that\
    \ allows the parent thread to wait for normal thread completion. The pthread_join()\
    \ system call blocks the parent thread while waiting for children thread completion.\
    \ This system call can only be used with a joinable thread.\n\n```\nint pthread_join(pthread_t\
    \ tid, void **status);\n```\n\npthread_join() call suspends the parent thread\
    \ until the specified thread ID exits. The thread ID is passed to pthread_join()\
    \ using the thread parameter. If pthread_join() is successful, 0 is returned and\
    \ the status parameter is made available. The status parameter contains the return\
    \ value of the completed thread.\n\n# Exiting the Thread Routine\n\nA return from\
    \ the user-defined thread function can occur several ways. The function can finish\
    \ processing and return, it can explicitly exit, or a signal can be sent to the\
    \ thread that causes it to exit. To explicitly exit a thread, the pthread_exit()\
    \ system call is used.\n\n```\nvoid pthread_exit(void *status)\n```\n\npthread_exit()\
    \ terminates the thread. This system call does not return a value to its calling\
    \ thread, but returns a status to the parent thread. The status is a void pointer.\
    \ Memory being pointed can be a basic type (such as an int) or a complex object.\
    \ If the thread is not detached, the thread ID and its return status (specified\
    \ by the status parameter) are"
