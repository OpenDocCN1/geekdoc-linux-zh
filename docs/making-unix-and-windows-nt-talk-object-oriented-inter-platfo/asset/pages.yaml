  md: "# 172 Chapter 3: NT Building Blocks\n\nLpSecurityAttributes is a pointer to\
    \ the security attributes structure. This parameter can be null if child processes\
    \ are not created to inherit this event handler. Otherwise it is used to allow\
    \ or deny access to the event from owners of other processes.\n\nIf bManualReset\
    \ is false, the event will automatically be reset after it is set and processed.\
    \ If it is set to true, the event will remain set until it is explicitly reset\
    \ with a call to ResetEvent().\n\nIf bInitialState is true, the event is created\
    \ with the set state. If it is false, it is reset. The lpName is the name of the\
    \ event. A name is a string of characters up to MAX_PATH in length and cannot\
    \ include a back slash (\"\\\\\"). A name does not need to be specified if the\
    \ event is used only within the process that creates it. A name is required if\
    \ another process is to open it.\"\n\nOnce the event is created, another process\
    \ can open the event with either a call to CreateEvent() or OpenEvent(). In this\
    \ condition, CreateEvent() will return a valid handle, but GetLastError() will\
    \ return the error code. OpenEvent(), prototyped here, can only be used to open\
    \ an event created by a previous call to CreateEvent().\n\n```\nHANDLE OpenEvent(DWORD\
    \ dwDesiredAccess,\n    BOOL bInheritHandle,\nLPCSTR lpName);\n```\n\ndwDesiredAccess\
    \ specifies the access you'll need to the event. EVENT_ACCESS EVENT_MODIFY_STATE\
    \ enables setting or resetting the event's state. SYNCHRONIZE enables signaling\
    \ when the event occurs. All access rights are dependent on what is specified\
    \ in the security attributes structure when the event was created. If the process\
    \ calling OpenEvent() does not have adequate rights, the function fails.\n\nbInheritHandle\
    \ specifies whether the handle can be inherited by processes created by the calling\
    \ process. It cannot be null.\n\nCloseHandle(), SetEvent(), ResetEvent(), and\
    \ PulseEvent() are the remaining event handling functions, prototyped here.\n\n\
    ```\nBOOL CloseHandle(HANDLE hEvent);\nBOOL SetEvent(HANDLE hEvent);\nBOOL ResetEvent(HANDLE\
    \ hEvent);\nBOOL PulseEvent(HANDLE hEvent);\n```\n\nCloseHandle() is used to close\
    \ the event after the event processing is complete. SetEvent() and ResetEvent()\
    \ are used to set the event's state, as is PulseEvent(). The behavior of PulseEvent()\
    \ is similar to SetEvent(), and depends on the value of bManualReset when the\
    \ event was created. If bManualReset was true, PulseEvent() releases all threads\
    \ that are waiting on the event and resets the event. If bManualReset is false,\
    \ PulseEvent() releases only one waiting thread, if more than one are waiting,\
    \ and resets the event."
