  md: "# 216 Chapter 3: NT Building Blocks\n\nthread and create additional threads,\
    \ as needed. A process can create additional processes. These spawned processes\
    \ are called child processes and the calling process is the parent process. A\
    \ child process is given its own set of resources — primary thread, address space,\
    \ and so on — when it is created. A child process runs independently of its parent\
    \ process and can continue to run after the parent dies.\n\nA child process can\
    \ inherit some, but not all, NT objects that were created by the parent process.\
    \ The list of inheritable objects includes the following.\n\n+   - Handles returned\
    \ by `CreateFile()`, including handles to files, named pipes, serial communication\
    \ devices, and mailslots\n- Open handles to processes, threads, mutexes, and semaphores\n\
    - Environment variables\n- Current directory\n\nThe console and its I/O buffers,\
    \ unless the process is detached or a new console is created. The objects must\
    \ be created with the inheritable attribute set to true and the process spawned\
    \ with that attribute can be inherited (see `CreateProcess`). The child process\
    \ refers to the inherited object through the same handle as the parent process\
    \ uses. NT provides no mechanism to pass values from parent to child — the two\
    \ processes must do this either through the command line, within environment variables,\
    \ or by other interprocess communication means.\n\n# Programming NT Processes\n\
    \nThe Win32 system call for creating processes is `CreateProcess()`, listed here.\n\
    \n```\nBOOL CreateProcess(LPSTR lpApplicationName,\n                LPTSTR lpCommandLine,\n\
    \                LPSECURITY_ATTRIBUTES lpProcessAttributes,\n                LPSECURITY_ATTRIBUTES\
    \ lpThreadAttributes,\n                BOOL bInheritHandle,\n                DWORD\
    \ dwCreationFlags,\n                LPVOID lpEnvironment,\n                LPTSTR\
    \ lpCurrentDirectory,\n                LPSTARTUPINFO lpStartupInfo,\n        \
    \        LPPROCESS_INFORMATION lpProcessInformation);\n```\n\nThe first two parameters\
    \ are the application name and its command line. Both are null-terminated strings.\
    \ `lpApplicationName` is the name of the file to execute. This can include the\
    \ full pathname, including drive letter. The `.exe` extension is added if it is\
    \ not present. If the filename is given with no path information, the file is\
    \ searched for several different locations in the following order.\n\n+   - The\
    \ directory in which the currently running executable file resides\n- The current\
    \ directory for the parent process\n- The 32-bit Windows system directory (obtained\
    \ by a call to `GetSystemDirectory()`), called SYSTEM32, in the windows directory"
