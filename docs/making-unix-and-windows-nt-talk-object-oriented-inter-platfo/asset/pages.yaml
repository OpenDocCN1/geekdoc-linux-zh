  md: '# Advantages and Disadvantages of UNIX


    AT&T developed UNIX in the early 1970s and made the operating system code freely
    available. The success of UNIX was largely due to this free access. University
    research institutes, government bodies, and computer companies took advantage
    of the freely distributed system code and began developing utilities to further
    take advantage of the powerful operating system. Many different organizations
    with a range of needs have developed applications using UNIX for over 30 years.
    Consequently, the operating system, along with its utilities, has fine tuned to
    provide the best solutions to almost every problem presented. Thus, the biggest
    advantage of UNIX is its many years of use, during which the biggest faults and
    gaps have been resolved.


    UNIX was one of the first operating systems on which networking applications were
    developed. The Internet itself got its start on UNIX systems. Therefore, interprocess
    communication is not a new concept to UNIX, but one that has been around for a
    long time.

    UNIX is an open system and is regulated by the Open Group. Open systems are those
    that meet agreed specifications or standards. Therefore, programming on UNIX systems
    is standardized. All vendors who adopt the UNIX system create compatible UNIX
    operating systems. Thus, applications are more easily distributed and communication
    between workstations is possible even if the workstations contain UNIX operating
    systems developed by different vendors. The latest development of the Open Group
    is the POSIX standard. POSIX is the term used for the set of APIs (application
    program interfaces) that provide portability where operating system services are
    required. The POSIX standard is used throughout this book.


    Since UNIX was designed as a multi-user, multi-process platform for interconnected
    computers, security has been an integrated feature of the UNIX environment from
    the beginning. The Internet and UNIX community have forced vendors to become open
    about security issues and publish fixes when a security leak is found.


    UNIX has a history of long uptimes (times during which the operating system has
    not crashed) without having to reboot the system. Long uptimes are important for
    process communication, if the processes must be active to communicate. If the
    processes are in constant communication, downtime is unacceptable.


    UNIX is very scalable, since many vendors have written UNIX operating systems
    for a variety of platforms. The operating system can run on machines as diverse
    as low-end PCs to very powerful multiprocessor supercomputers. Thus, organizations
    can cost-effectively tailor their UNIX network.


    The main disadvantage of UNIX is from the user''s viewpoint. Although it is a
    very powerful operating system, executing commands is a complex task for the average
    computer user. Command execution involves entering the command at a UNIX command
    prompt. A GUI (graphical command interface) is not native to the UNIX environment.
    Another disadvantage of UNIX is that software applications are not as available
    as they are on Windows NT. Most developers of Windows NT-compatible software do
    not write UNIX versions.


    # Advantages and Disadvantages of Windows NT


    The main advantage of Windows NT is user awareness. Most users, including managers
    in decision making roles, are familiar with Microsoft''s products and are comfortable
    using'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# The Need to Communicate


    them. Windows NT provides a simple user-interface that requires little learning
    for a user to get immediate use of the applications.


    Windows NT is relatively inexpensive to set up. Windows NT installs on PCs that
    are currently priced under $1,000. Windows NT itself is priced for $700 for the
    basic setup. Setting up UNIX operating systems to be more expensive because they
    are usually installed on workstations that are priced at $5,000 or more. The UNIX
    operating system itself is also more expensive. PC versions of UNIX do exist and
    can reduce the cost of a UNIX machine. Windows NT is also relatively less expensive
    because Windows NT is not still a feature rich and does not contain many utilities
    as the UNIX operating system.


    More software is available for Windows NT than for UNIX. The software available
    is widely used and, therefore, inexpensive. Many corporations choose Windows NT
    because their users do not want to give up the variety of software available.


    Software vendors offer many development tools for Windows NT, ranging from basic
    scripting languages to C++. These tools can be used to more quickly create custom
    software that is both powerful and visually appealing.


    The two main disadvantages of Windows NT are the lack of freely available source
    code and the immutability of the operating system. With only one software developer,
    Microsoft, Windows NT lacks the diversification of development from UNIX has.
    Windows NT was first deployed in the early 1990s and, therefore, does not have
    the advantage of 30 years of development that UNIX enjoys. Due to the lack of
    openness and maturity, Windows NT presents many disadvantages, including the following.


    **Security** Although Microsoft provides security within Windows NT, they do not
    readily provide information on problems found or fixes available. Microsoft dismisses
    problems as "user errors." If you turn on a feature that was off by default, Microsoft
