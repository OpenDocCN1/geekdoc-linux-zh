  md: "# 170 Chapter 3: NT Building Blocks\n\n```\nint main (int argc, char* argv[])\n\
    {\n    char sBuf1[255];\n\n    if (argc < 1)\n    {\n        cout << \"Error:\
    \ Enter a directory name\" << endl;\n        return 0;\n    }\n\n    sprintf(sBuf1,\
    \ \"Processing directory: %s\", argv[1]);\n    cout << sBuf1<< endl;\n    return\
    \ (iReadDirectory(argv[1]));\n}\n```\n\nThe NT File System at its simplest level\
    \ provides a mechanism for storing and retrieving files and organizing files within\
    \ directories. It also provides a complex security system that, although robust,\
    \ can be cumbersome to use. The XPCFileStat class presented in this section encapsulates\
    \ the Win32 system call for accessing information about a file residing on NTFS.\n\
    \n# 3.3 NT Events\n\nNT provides a limited subset of the signals and signal handling\
    \ functions provided in UNIX. NT supports the UNIX signal() system call and six\
    \ signal handling constants — SIGABRT, SIGFPE, SIGILL, SIGINT, SIGSEV, and SIGTERM.\
    \ These are limited to program error handling and abnormal termination. For example,\
    \ if a program generates a floating point error, SIGFPE can be trapped. An error\
    \ handler can be jumped to use setjmp() and longjmp() instead of using the default\
    \ error handler, which causes the program to terminate. There is no mechanism\
    \ within the NT signal handling functions, however, for generating user-defined\
    \ signals and sending them to other threads or processes. NT provides a different\
    \ mechanism, Events,\n\n# Events Overview\n\nAn event is an NT object that has\
    \ two states — set and reset. It can be created by one process and subsequently\
    \ opened by another process. Each process can then set the event's state, thereby\
    \ signaling the other process that the event has occurred.\n\nEvents are commonly\
    \ used for one process or thread to notify another that a logical event has occurred\
    \ — a file is ready for processing, a user pressed a key, data has been entered\
    \ in shared memory, and like. The two processes open the same event — one waits\
    \ for the event to be set, while the other performs some processing. When the\
    \ latter is done, it"
