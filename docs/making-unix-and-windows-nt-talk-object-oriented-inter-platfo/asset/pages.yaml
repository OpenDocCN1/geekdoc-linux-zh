  md: '# UDP Vs. TCP Sockets 297


    sendto(). The application receiving the message has no idea about the message''s
    source before the message is originated. It, uses recvfrom() to receive the message
    and resolve the address of the source so that communication with the source can
    occur.


    Unlike UDP connectionless communication, TCP communication specifies a direct
    connection between the client and the server. Once the connection is achieved,
    messages can be sent bidirectionally without having to specify a specific address.


    To communicate using TCP sockets, a socket needs to be created and opened using
    the socket() system call. As UDP sockets, the protocol_family for TCP sockets
    is the Internet family specified by the AF_INET value. The protocol parameter
    for a TCP socket is the TCP protocol. The final TCP socket parameter, communication_type,
    is defined using SOCK_STREAM. SOCK_STREAM communication provides sequenced, reliable,
    and bidirectional-oriented streams.


    # Receiving TCP Socket Connections


    Because a client and server are connected using TCP sockets, communication can
    occur bidirectionally. It is not necessary to bind an Internet address and a port
    to socket for both the client and the server. Only the server needs to bind itself
    to the socket. When the client connects, a communication gateway is setup between
    the client and the server. The server uses bind() to associate itself to an address
    and port number. The address is created using an instance of the sockaddr_in structure
    and setting the structure''s sin_port data member to a unique port number and
    its sin_addr data member to the address. The client can bind to its own address
    and port number if it receives messages from other besides the connected server.
    By receiving messages from other processes, the client is acting as a server to
    other clients.


    At this point, TCP and UDP socket communication development diverge. Once the
    TCP/IP address is bound, UDP communication can take place. Additional steps are
    required for TCP communication. Although the server is bound to an address, it
    must tell the system that it is willing to receive connections. This is accomplished
    using the listen() system call. listen() specifies the number of incoming connections
    that can be queued while the server is processing them. The backlog queue can
    be set to a maximum of five incoming connections and is normally set to this maximum.
    In the time it takes to accept a connection, additional clients may attempt to
    connect and creates a backlog. By specifying a pending queue, there is time to
    accept all connecting clients before they are dropped. See Table 3.9 for the listen()
    system call specification.'
