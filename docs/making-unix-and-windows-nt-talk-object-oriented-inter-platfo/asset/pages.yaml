  md: '# 258 Chapter 4: Cross-Platform Communication


    Well-known system port numbers and the method to define application port numbers
    are discussed.


    Creating a Good Cross-Platform Design One of the most important steps in designing
    a cross-platform system (or any system, for that matter) is to first develop a
    good design. Section 4.5 poses questions that help the system designer in choosing
    the appropriate system setup. Choosing the appropriate system setup includes choosing
    the correct operating system platform, the dedicated communication protocol (UDP
    or TCP), and the correct method of cross-platform communication.


    Overview of Cross-Platform Methods Many different options are available to a system
    designer when developing a cross-platform system. These options are introduced
    in Section 4.6 and are covered throughout the remainder of this book.


    # 4.2 An Introduction to TCP/IP


    The Transmission Control Protocol and Internet Protocol (TCP/IP) came into existence
    as the result of a government-funded project started in the late 1960s and early
    1970s. This project was sponsored by the department of defense and was led by
    the Advanced Research Agency (ARPA). This agency developed the ARPANET that included
    a network of military, university, and research projects. This network was used
    to support computer science and military research projects. In the early 1970s,
    ARPA disbanded and the Defense Advanced Project Research Agency (DARPA), took
    over the project. DARPA''s work led to the development of TCP/IP in the early
    1980s. All computers connected to the ARPANET were converted to TCP/IP by January
    1983. Because of the growth of the ARPANET, the department of defense split it
    into two different networks — ARPANET and MILNET. MILNET was a network setup for
    military purposes, and the ARPANET was left for use as a network supporting the
    research and development of network-related applications. By the mid-1980s, the
    ARPANET became known as the Internet. One reason TCP/IP protocols became so widely
    used is DARPA''s decision to implement it on the UNIX operating system. It was
    not only implemented on a open system, the University of California at Berkeley
    was selected to freely distribute the TCP/IP code. Because of the availability
    of TCP/IP code, universities, research centers, and private sector companies quickly
    adopted it. Today, TCP/IP is the standard suite of data communication protocols
    for UNIX-based computers. It is also becoming a predominant communication protocol
    in Windows-NT operating systems. The TCP/IP protocol has many attractive features,
    including the following.


    +   - The TCP/IP is not vendor-specific. It is a standard and is made freely available.


    +   - It has been implement almost on every computer platform developed.


    +   - It can be used on both Local Area Networks (LANs) and Wide Area Networks
    (WANs)


    +   - It is the communication protocol with which the entire Internet global community
    communicates.'
