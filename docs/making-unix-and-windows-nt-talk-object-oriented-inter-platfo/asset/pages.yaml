  md: '# Glossary


    **Access Control Lists (ACL)** Entries in Windows NT that specify the access permission
    to be controlled and whether access is denied or allowed.


    **Address Resolution Protocol (ARP)** Allows a host on a LAN to broadcast a special
    packet asking each host with a specified Internet address to respond with its
    LAN address.


    **application layer** The seventh layer of the 7-layer OSI model. This layer contains
    a variety of protocols and applications that are commonly needed.


    **ARPA** The Advanced Projects Agency which developed the ARPANET, the precursor
    to the Internet.


    **ARPANET** The project funded by the Department of Defense for networking computers.
    The ARPANET is the pre-cursor of the Internet.


    **asynchronous sockets** An MFC wrapper around sockets that provides a working
    relationship between socket communication and Window event communication.


    **big endian** A byte-ordering scheme in which the least significant byte of a
    multi-byte data type comes first.


    **byte ordering** The method a machine orders the bytes of a multi-byte data type.


    **child process** A process spawned (created) from another process. The process
    that created the child is referred to as the parent.


    **client process** A process that connects to another process.


    **concurrent servers** Servers that invoke another process to handle the client''s
    request.'
  merge: -1
  pgno: 478
- img_proc: true
  md: '# 468 Glossary


    **contention scope** Refers to POSIX thread scheduling. The scheduling of POSIX
    threads can be at the user or kernel level.


    **cross-platform pipes** Bi-directional socket communication between two or more
    processes running on UNIX or Windows NT workstations by much of the low level
    socket communication is hidden and data is seemingly piped through the output
    of one process into the input of another.


    **cross-platform semaphore** A semaphore that can be accessed from a process running
    on either UNIX or Windows NT host.


    **cross-platform shared memory** A persistent memory segment that can be accessed
    from a process running on either UNIX or Windows NT host.


    **daemon process** A detached process that shares none of its parent''s attributes
    and is not affected by outside signals or events. This process runs in the background
    is “awakened” when accessed or at a specific time to execute a task.


    **DARPA** The Defense Advanced Project Research Agency which developed TCP/IP.


    **data frames** Sequential message transmissions with a distinct boundary. These
    messages are used by the data link layer of the 7-layer OSI model.


    **data link layer** The second layer of the 7-layer OSI model. This layer takes
    raw transmissions from the physical layer and transforms them into a line that
    appears free of errors.


    **deadlock** A condition that occurs when two or more threads or processes lock
    themselves out of a shared resource using a lock and unlock mechanism.


    **ephemeral port numbers** Port numbers assigned to UDP or TCP processes which
    are in use only for as long as the processes.


    **events** Windows NT’s two-state mechanism for programs to signal other programs.


    **exclusive resource** A shared resource such as file or shared memory which must
    be accessed by one process at a time.


    **FIFO** First-In First-Out queue.


    **File Transfer Protocol (FTP)** An application that is used for sending files
    from one system to another.


    **forking a process** The UNIX term for spawning a child process from a parent.


    **gateways** Systems that interconnect two networks and pass IP datagrams.'
  merge: -1
  pgno: 479
- img_proc: true
  md: '# Glossary 469


    **host name** An alias for an IP address.


    **inode** A UNIX structure which stores information about a file including where
    it is physically located.


    **inter-platform/cross-platform communication (XPC)** Two or more processes residing
    on different operating systems that communicate across a network.


    **inter-process communication (IPC)** Processes that can communicate on the same
    machine or two or more different machines.


    **internet address (IPv4)** An address comprised of 32 bits that contains both
    a network and host address. This address is used to locate the host machine to
    which send TCP/IP messages.


    **internet address (IPv6)** An address comprised of 128 bits that contains both
    a network and host address. This address is used to locate the host machine to
    which to send TCP/IP messages.


    **iterative servers** Servers that process clients within a single thread of execution.


    **kernel-level thread** A thread of execution that is controlled and scheduled
    by the operating system.


    **little-endian** A byte-ordering scheme in which the most significant byte of
    a multi-byte data type comes last.


    **multihomed hosts** Hosts that have multiple connections to two or more networks.


    **mutually exclusive** The ability for one and only one process to access an exclusive
    resource.


    **named semaphore** A semaphore that can be accessed by processes outside the
    one that creates it. The semaphore is accessed by an agreed upon name.


    **Network Interface Card (NIC)** A piece of hardware that connects a host machine
    to a network.


    **network layer** The third layer of the 7-layer OSI model. This layer is concerned
    with routing messages from the source to its destination.


    **Open Systems Interconnect (OSI) Model** A specification developed by the International
    Standards Organization for sending and receiving data over a computer network.
    The standard specifies seven layers of abstraction.


    **parent process** The top-level process within a group of related processes.'
  merge: -1
  pgno: 480
- img_proc: true
  md: '# 470 Glossary


    **physical layer** The first layer of the 7-layer OSI model. This layer is concerned
    with sending raw bits over a communication medium.


    **pipes** A method of inter-process communication in which one process communicates
    with another in a uni-directional method.


    **port number** 16-bit integers used by UDP and TCP protocols for associating
    data with a specific process running on a host machine.


    **preemptive multitasking operating system** An operating system that enables
    simultaneous execution of multiple threads from one or more processes.


    **presentation layer** The sixth layer of the 7-layer OSI model. This layer performs
    functions that are common to users'' needs. These functions are general solutions
    to communication problems.


    **publish and subscribe** A communication method in which one process sends a
    message with a specific publication tag and another process listens for messages
    containing a specific publication tag.


    **race Condition** A condition that occurs when one thread manipulates a shared
    resource at the same time the other is accessing it. This can lead to the unexpected
    results for the accessing thread.


    **Remote Procedure Call (RPC)** A method of accessing data from a remote server
    process by calling a procedure of that remote server process.


    **Remote Process Execution (EXEC)** An application that allows a user to remotely
    execute a process on a host connected to the network.


    **Reverse Address Resolution Protocol (RARP)** Servers that maintain a mapping
    between the Internet Address and the LAN address for each workstation on the network.


    **runtime signal** A notification to a running process that an event has occurred.


    **semaphore** An atomic operation that provides mutually exclusive access to a
    section of code between one or more cooperative programs.


    **server process** A process that accepts connections from one or more.


    **services** An NT process that run in the background and executes a task at a
    specified interval or when accessed.


    **session layer** The fifth layer of the 7-layer OSI model. This layer allows
    users on different machines to establish sessions between them.'
  merge: -1
  pgno: 481
- img_proc: true
  md: '# Glossary 471


    **shared memory** A by which two or more processes communicate with one another
    by storing and retrieving data from a location known to all processes involved.


    **socket communication** A means of bi-directional communication using either
    UDP or TCP protocols.


    **structure packing** An addition of padded bytes to a structure.


    **subnet address** A subdivision of available host addresses on sub-networks of
    the main network.


    **symbolic link** An indirect pointer to a UNIX file or directory where the UNIX
    directory entry contains the name of the pathname to which it is linked.


    **total cost of ownership** The amount of money it costs the firm to purchase
    and upgrade hardware as well as to develop and maintain custom software.


    **Transmission Control Protocol (TCP)** A data stream service that provides reliable,
    bi-directional, connection-oriented communication between two or more processes.


    **Transmission Control Protocol and Internet Protocol (TCP/IP)** A protocol for
    process-to-process communication over a network. This is what the Internet is
    based upon.


    **transport layer** The fourth layer of the 7-layer OSI model. This layer accepts
    data and formats the data for use in the next OSI network layer.


    **unnamed semaphore** A semaphore that can only be used within a single process.
    It is not visible outside the process that it creates.


    **User Datagram Protocol (UDP)** A datagram service that provides unreliable,
    bi-directional, connectionless communication between two or more processes.


    **user-level thread** A thread of execution that the operating system has no knowledge
    of it. These threads are managed and controlled by the calling process.


    **well-known ports** TCP and UDP socket ports that are reserved for particular
    applications. These well-known ports are detailed within RFC 1700.


    **zombie process** A UNIX child process which has completed and released all resources,
    but remains in existence while the operating system waits for the parent process
    to terminate it. This doesn''t occur because the parent process has died.'
