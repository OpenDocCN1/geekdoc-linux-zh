  md: '# 302 Chapter 5: Sockets — The Cross-Platform Communication Building Blocks


    # Choosing the Correct Prototype


    Choosing the correct prototype (UDP or TCP) is an important decision when designing
    interplatform communication architecture. It is important to look at the advantages
    and disadvantages of both protocols and then look at the features that are important
    in an interplatform communication system. Table 5.14 shows the advantages and
    disadvantages of the two protocols.


    # Table 5.14 Advantages and Disadvantages of UDP and TCP Protocols


    # UDP Advantages


    +   - Requires less code and therefore, produces smaller applications.

    - Does not rely on connecting to a host application at an address that might not
    exist.

    - If the destination to which socket messages are sent does not exist, the sending
    application does not fail, but continues processing.

    - Messages can be broadcast over a large series of addresses. (See "Sending Data
    Using the UDP Socket" on page 292 for more details

    - Message transmission occurs faster because UDP has less overhead than TCP. (TCP
    is built on top of UDP.)


    # TCP Advantages


    +   - Messages are guaranteed to be delivered in the order sent.

    - Once a connection has been established, less work is required by the programmer
    to send and receive messages.

    - Messages do not have size restrictions


    # UDP Disadvantages


    +   - Because UDP is a connectionless protocol, messages sent are not guaranteed
    to be received and messages received are not guaranteed to be in the same order
    sent. In fact, there is no direct knowledge that the message has been received
    at all.

    - Messages are restricted in size.


    # TCP Disadvantages


    +   - Since a connection is required for a client to send messages to its server,
    the client''s socket connection becomes invalid if the server dies. If the socket
    connection is lost, the running process''s performance can be adversely affected.


    Now that the advantages and disadvantages of the two protocols are known, application
    guidelines can be established when writing interplatform communication systems
    using sockets. The questions to consider are the following.


    +   - Will the application incorrectly relies on the server receiving messages
    if all sent are not received?

    - If the application relies on the server receiving messages sent by the client
    and no messages are missed or discarded, the TCP protocol should be used. Such
    an application might be transmitting real-time prices for a trading application.'
