    # Memory Management\n\nWin32 provides memory allocation functions in addition\
    \ to the memory functions in the C runtime library. The Win32 functions include\
    \ HeapAlloc(), VirtualAlloc(), and their corresponding freeing functions, others.\
    \ The popular functions in the C runtime library are malloc() and free() (along\
    \ with new() and delete in C++). In early versions of Windows, the memory manager\
    \ used a 16-bit segmented memory model, which imposed significant limitations\
    \ on using memory allocated by malloc(). Windows programs called LocalAlloc()\
    \ and GlobalAlloc() in the Windows SDK to work around the limitations. The advent\
    \ of Windows NT and a 32-bit virtual memory model eliminated the need for LocalAlloc()\
    \ and GlobalAlloc() (although both exist in Win32 for compatibility). HeapAlloc()\
    \ and VirtualAlloc() were used as their replacement. The result is that memory\
    \ created by malloc(new()) and HeapAlloc() can be used interchangeably. Adhering\
    \ to an ad hoc coding standard within the Windows programming community, the examples\
    \ in this book use HeapAlloc() to allocate memory passed to Win32 functions.\n\
