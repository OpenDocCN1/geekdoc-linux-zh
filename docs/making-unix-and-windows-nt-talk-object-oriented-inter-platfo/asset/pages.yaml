  md: '# Chapter 4


    # Cross-PlatformnCommunication


    # 4.1 Chapter Overview


    The goal of this chapter is to provide the reader with an understanding of the
    following.


    TCP/IP TCP/IP is the protocol stack used for all cross-platform communication
    methods discussed in this book. TCP/IP is the protocol stack of choice because
    it is available on both UNIX and Windows NT platforms. Section 4.2 introduces
    the TCP/IP and UDP/IP protocols, how they originated, their many benefits, and
    how they fit into the OSI communication model. Also explained is the composition
    of an Internet address and how it is resolved. Finally the newest TCP/IP and UDP/IP
    protocol is discussed, including why the standard was developed, its benefits,
    and how it will be used.


    UDP Vs. TCP Protocol Stacks The two communication protocols discussed within this
    book are UDP and TCP. Both can be used for cross-platform communication. Section
    4.3 discusses both protocols, how they are implemented in IPv4 (the current Internet
    protocol version) and IPv6, and their features.


    Network Port Number Two things must be known in order to communicate with another
    process — the machine on which the process is executing (the host) and the process’s
    communication channel (its port number). Section 4.4 introduces the concept of
    network port numbers.'
