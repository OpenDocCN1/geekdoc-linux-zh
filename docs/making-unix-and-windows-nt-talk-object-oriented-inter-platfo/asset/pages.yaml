    \n# The iReceiveMessage() Method of XPCTcpSocket\n\niReceiveMessage() takes three\
    \ parameters. The first parameter, _vMessage, is a pointer to a data structure\
    \ that holds the message received. The second parameter, _MessageSize, contains\
    \ the original size of the data structure receiving the message. The final parameter,\
    \ _iOption, specifies the option for receiving the message. By default, this option\
    \ is 0, meaning recv() suspends execution until all or part of a message is received.\
    \ The other available options are MSG_WAITALL or MSG_PEEK. (MSG_008 is also an\
    \ option, but is not covered in this book.) MSG_WAITALL option signals recv()\
    \ not to return until the number of bytes specified by the iMessageSize parameter\
    \ are received. This differs from iOption containing a value of 0 because recv()\
    \ returns as soon as data is available. UNIX System V has the MSG_WAITALL option\
    \ built in, but Windows NT does not. A method that acts like MSG_WAITALL is provided\
    \ for Windows NT and is discussed here. The third option, MSG_PEEK, returns a\
    \ message containing the number of bytes specified by _iMessageSize, but does\
    \ not remove the message from the socket. This means calls to iReceiveMessage()\
    \ can retrieve the same socket message. Unlike UDP sockets, MSG_PEEK does not\
    \ return the number of bytes available on the socket, because TCP sockets retrieve\
    \ all or part of a socket message, whereas UDP sockets must retrieve the entire\
    \ message.\n iReceiveMessage() returns the total number of bytes received. The\
    \ iReceiveMessage() method is shown in Listing 5.33. Operating system specific\
