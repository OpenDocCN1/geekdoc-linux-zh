  md: 'The backbone of many corporate computing systems since the early-to mid-eighties,
    has been the UNIX operating system. Corporations have invested millions of programming
    dollars to run core business applications on UNIX machines. In the early nineties,
    Microsoft Windows began making in-roads to these corporations, particularly on
    the desktop. The advent of NT made the foothold even stronger — not only as a
    mature desktop platform, but as a viable server alternative to UNIX as. Today,
    the corporate computing environment is predominantly a mix of UNIX and NT operating
    systems running on the same network.

    The problem that this heterogeneous environment presents to the application developer
    is an interesting one: How can you take advantage of the strengths of many operating
    systems to get the job done? A straight application port of core business applications
    from UNIX to NT is certainly not the answer as many more programming hours are
    lost re-implementing and re-testing perfectly applications. It makes more sense
    to modify a UNIX application to strictly a data server and recreate the user interface
    on NT that is already running on users'' desktops. More than one user interface
    application can be created that use the same UNIX data server.

    More importantly, new applications can be written that have components running
    on both systems that not only take advantage of the inherent strengths of each
    operating system, but also where core data resides. A common business example
    might be an intranet site that displays employee telephone numbers. The intranet
    server is a UNIX machine and the employee telephone list may be a Microsoft Excel
    document on NT maintained by the Human Resources department. How do you get updates
    of the telephone list from the Excel spreadsheet on NT to the intranet web page?
    A useful solution is to have components running on both operating systems. When
    a user wishes to view the phone list, UNIX asks the NT component if the current
    version is up-to-date. If it is, then is displayed. If not, the NT component uses
    Excel to create an HTML version of the document and transfers the file back to
    UNIX for the intranet server to send to its client. With this solution, users
    can continue to store data on the system they prefer the intranet server always
    has access to up-to-date information.

    The challenge to the application programmer has become making the UNIX and NT
    components “talk” to each other. Many resources are available which describe inter-process
    communication on a single UNIX or NT workstation, but few describe communication
    between'
  merge: -1
