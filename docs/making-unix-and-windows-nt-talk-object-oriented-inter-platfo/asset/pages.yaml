    # Connecting to a TCP Server


    The connect() system call is used to connect the TCP client to a TCP server. connect()
    attempts to make a connection with another TCP socket. The connected host is specified
    by its IP address. The client does not have to bind to a local address before
    calling connect(). Instead, connect() does the local address assignment. Once
    the client is connected, connect() does not be reissued. The connection remains
    until either the client or server explicitly terminates. connect() can also be
    used with UDP sockets. An application using UDP sockets can connect to its server
    but only can send messages to that server and receive messages from that. If the
    client-server association needs to be changed, connect() can be reassociated to
    another address. connect() can not be reissued for other address assignments using
    the TCP socket protocol. The connect() system call is detailed in Table 5.11 and
    takes three parameters.


    +   1. The socket file descriptor (s)

    2. The address to which the socket is connected (name)

