  md: '# Chapter 3: NT Building Blocks


    SERVICE_FILE_SYSTEM_DRIVER A file system driver.

    SERVICE_INTERACTIVE_PROCESS A Win32-based service process to interact with the
    desktop.


    dwStartType specifies when the service is to be started by NT. The possible values
    are listed in Table 3.11.


    # Table 3.11 Service Start Constants


    | Value | Meaning |

    | --- | --- |

    | SERVICE_BOOT_START | A device driver started by the operating system loader.
    Only valid for driver services. |

    | SERVICE_SYSTEM_START | A device driver started by the IoInitSystem() function.
    Only valid for driver services. |

    | SERVICE_AUTO_START | A service to be started by the service control manager
    automatically during system startup. |

    | SERVICE_DEMAND_START | A service to be started by the service control manager
    when a process calls the StartService() function. |

    | SERVICE_DISABLED | A service that can no longer be started. |


    dwErrorControl specifies the severity of the error if the service fails to start.
    Possible values are listed in Table 3.12.


    # Table 3.12 Error Control Constants


    | Error Constant | Meaning |

    | --- | --- |

    | SERVICE_ERROR_IGNORE | The startup program logs the error and continues. |

    | SERVICE_ERROR_NORMAL | The startup program logs the error and puts a message
    pop-up and continues. |

    | SERVICE_ERROR_SEVERE | The startup program logs the error and the system is
    restarted with the last-known configuration. |

    | SERVICE_ERROR_CRITICAL | The startup program logs the error, if possible, and
    the system is restarted with the last-known configuration. If the service fails
    again, startup fails. |


    lpBinaryPath is a pointer to a null-terminated string containing the fully-qualified
    pathname of the executable of the service.

    lLoadOrderGroup is a pointer to a null-terminated string that lists the load-ordering
    group of which the service is a member. A load-ordering group specifies the order
    in which a group of services are loaded by the SCM. This parameter can be null
    if the service is not a member of a load-ordering group.

    ldwTagId is pointer to a DWORD, where the ID of the load order group specified
    in lpLoadOrderGroup is returned. Use this ID to specify the order with which the
    service is to be started in a group. This is only used for driver services of
    the start types SERVICE_BOOT_START or SERVICE_SYSTEM_START.'
