  md: '# Threading TCP Sockets and Windows


    Threading TCP sockets within GUI applications is more complex than threading UDP
    sockets. A TCP socket does not send or receive messages until it is connected
    to either a client or server application. UDP sockets do not have the restriction
    of connecting to another host before processing messages. The connection restriction
    of TCP sockets plays a major role when sending messages from a Windows application
    interface and attempts to send the message before connection is established. If
    the user enters a message within a Windows application, the send fails. A good
    design does not allow a message to be sent until a connection is established.
    Protecting against unconnected TCP sockets involves disabling the Windows interfaces
    used for sending messages. Once the socket is connected, the Windows controls
    are enabled. If a Windows application is acting as a server, the connection is
    established when `Accept()` returns a new instance of `XPCTcpSocket`. The new
    instance of `XPCTcpSocket` contains the new socket descriptor used for client
    communication. If a Windows application is acting as a client, a connection is
    established when `vConnect()` returns fully.


    Not only the purpose of connection needing to be threaded, but the process of
    receiving socket data should also be threaded. Unlike UDP sockets, TCP sockets
    block processing while waiting to receive socket messages. Threading the receiving
    of TCP socket messages allows the user access to GUI functions without being blocked
    by `ReceiveMessage()`. The thread is passed a pointer to the Windows''s objects
    that are updated upon receipt of the host messages.


    Depending on the purpose of the application, threading TCP socket sends might
    also be desirable. It is not necessary to thread UDP sockets since a UDP socket
    message has a maximum length. (See Section 5.5 on how to receive the send buffer
    size for UDP sockets.) TCP sockets put no such restrictions on the size of messages
    sent. The message can be split into small pieces, with one piece being sent at
    a time, or the entire message can be sent at once. Regardless of how the TCP socket
    message is sent, the socket buffer fills up, `SendMessage()` blocks until space
    is made available on the TCP socket buffer. Space is made available when the host
    takes the message off the buffer by calling `Receive()`. If the application taking
    data off the socket is slower than the application putting data on the socket,
    the socket buffer can fill up. The process sending the data would be blocked.
    Once again, process blocking within a GUI application is not desirable. Therefore,
    in cases in which it is possible the socket buffer becomes full due to large amounts
    of data being sent, `SendMessage()` should also be threaded. The architecture
    for threading TCP client and server connections within a Windows application is
    shown in Figure 5.13.'
