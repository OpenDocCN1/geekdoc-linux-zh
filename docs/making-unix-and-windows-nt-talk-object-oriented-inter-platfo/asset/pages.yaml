    # Table 2.18 Signal Mask System Calls


    | Signal Prototype | Description |

    | --- | --- |

    | int sigmemset(sigset_t *set) | Initializes the signal mask to exclude all signals
    defined by the system. Returns 0 for success, -1 for failure |

    | int sigfillset(sigset_t *set) | Initializes the signal mask to contain all signals
    defined by the system. Returns 0 for success, -1 for failure |

    | int sigaddset(sigset_t *set, int signo) | Adds a specific signal, signo, to
    the signal mask, set. Returns 0 for success, -1 for failure |

    | int sigdelset(sigset_t *set, int signo) | Removes a specific signal, signo,
    from the signal mask, set. Returns 0 for success, -1 for failure |

    | int sigismember(sigset_t *set, int signo) | Checks whether a signal is part
    of the signal mask. Returns the signal ID if the signal, signo is in the signal
    mask. A value of 0 is returned if the signal is not in the signal mask |


    The signal mask of a thread is defined using pthread_sigmask(). This system call
    takes the signal mask defined by sigset_t and uses it as the signal mask for the
    thread. Using the pthread_sigmask(), the thread''s signal mask can be added in
    different ways, as are shown in Table 2.19.


    # Table 2.19 Values Used to Create the Thread''s Signal Mask


    | Thread Signal Mask Addition Definition | Description |

    | --- | --- |

    | SIG_BLOCK | The signal mask defined by sigset_t is added to the thread''s signal
    mask and the signals defined within sigset_t are blocked |

    | SIG_UNBLOCK | The signals defined within sigset_t are unblocked and the signals
    are removed from the thread''s current signal mask |

    | SIG_SETMASK | The signal mask defined by sigset_t replaces the current thread''s
    signal mask |'
