  md: "# Unlocking a Semaphore\n\nReleaseSemaphore() increments the semaphores count\
    \ by the specified amount thereby releasing it.\n\n```\nBOOL ReleaseSemaphore(HANDLE\
    \ hSemaphore,\n                    LONG l1ReleaseCount,\n                    LPLONG\
    \ lpPreviousCount);\n```\n\nhSemaphore is the handle to the semaphore, returned\
    \ from either CreateSemaphore() or OpenSemaphore(). 1ReleaseCount is the amount\
    \ to increment the semaphores count. 1pPreviousCount is a pointer to a LONG where\
    \ ReleaseSemaphore() will return the value of the semaphore's count prior to this\
    \ call. 1pPreviousCount can be null if it is not needed. The semaphore's count\
    \ was zero prior to a call to ReleaseSemaphore(), the semaphore is in a locked\
    \ or unsigned state. A call to ReleaseSemaphore() will unlock or set its state\
    \ to signaled.\n\n# Locking the Semaphore\n\nObtaining a semaphore's lock involves\
    \ calling the first of the two functions, WaitSingleObjectEx(), was used in XPCFileStat.\
    \ Here, we will use WaitSingleObject() because an asynchronous procedure call\
    \ is not needed to notify the caller that the semaphore is available. Instead,\
    \ the process blocks and waits until it is available.\n\n```\nDWORD WaitSingleObject(HANDLE\
    \ hHandle,\n                    DWORD dwMilliseconds);\n```\n\nWaitSingleObject()\
    \ accepts the handle to the semaphore in its first parameter and the length of\
    \ time to wait in its. INFINITE can be specified to prevent the function from\
    \ timing-out. WAIT_OBJECT_0 is returned if the semaphore is available. WAIT_TIMEOUT\
    \ is returned if it is not. WaitSingleObject() decrements the semaphore's count\
    \ before returning. If the resulting value is zero, the semaphore's state is changed\
    \ to unsignaled and the semaphore is locked.\n\n# Closing the Semaphore\n\nCloseHandle()\
    \ is used to close the handle to a semaphore. Once all handles are closed, CloseHandle\
    \ automatically destroys the semaphore.\n\n```\nBOOL CloseHandle(HANDLE hObject);\n\
    ```\n\nTrue or false is returned, depending on the success of the call. GetLastError()\
    \ will return the error code on failure.\n\n# XPCSemaphore Class\n\nThese NT functions\
    \ are encapsulated in XPCSemaphore class, presented here. Note that Microsoft's\
    \ Foundation Class has a CSemaphore class that provides wrappers to some of these\
    \ functions as well. Notably absent from MFC's CSemaphore is a method to wait\
    \ for the semaphore to be released. The definition of XPCSemaphore is shown in\
    \ the header file in List-3.16."
