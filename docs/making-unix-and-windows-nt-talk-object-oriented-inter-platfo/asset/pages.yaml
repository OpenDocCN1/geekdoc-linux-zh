    # Interplatform Socket Communication Problem #2: Byte Ordering


    The other data transferring problem deals with the way in which Windows NT and
    UNIX order bytes within multiple data types. Examples of multiple data types include
    the following: short, long int, float, and double. Windows NT uses a byte-ordering
    scheme known as little-endian, while UNIX operating systems use big-endian. In
    big-endian byte-ordering schemes, the most significant byte comes first; in little-endian
    byte-ordering, the most significant byte comes last. In instance, the byte ordering
    of big-endian and little-endian are reversed. If the data type contains only a
    single byte, such as a char, there are no discrepancies between the two byte-ordering
    schemes. If the data structure has more than one, such as a long int, differences
    are evident. The long int on Windows NT and UNIX contains four bytes. Figure 5.3
    illustrates the big-endian and little-endian representation for long int storing
    1055.


