  md: "# 434 Chapter 5: Socks — The Cross-Platform Communication Building Blocks\n\
    \ncreating and binding the socket does not block process execution. The only operation\
    \ that must be addressed is receiving UDP socket data. Therefore, only FD_READ\
    \ is defined for CASyncSocket events and only OnReceive() is overridden.\n\nWhen\
    \ defining OnReceive(), it is important that the data be processed by the main\
