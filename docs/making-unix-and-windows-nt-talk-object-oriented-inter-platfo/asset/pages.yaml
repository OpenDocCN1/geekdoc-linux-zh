  md: '# Spawning Processes


    Elements that are not inherited by the spawned process include the following:


    +   * Shared memory

    * Memory mappings

    * Timers

    * Outstanding asynchronous I/O operations

    * Signal handlers


    Several different version of exec() are displayed in Table 2.22.


    # Table 2.22 The exec() System Call Prototypes


    | exec() System Call Prototype | Description |

    | --- | --- |

    | execclp(char *filename, char *arg0, ..., char *argin, (char *)NULL); | Spawns
    a program, given the name of an executable and all its arguments. The arguments
    must minimally include argument 0 (the name of the program). All other arguments
    necessary for the program are specified in arg1 through argn. NULL indicates the
