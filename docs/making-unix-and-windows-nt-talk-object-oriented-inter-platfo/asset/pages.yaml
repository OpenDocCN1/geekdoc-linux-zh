  md: Spawning processes is useful for creating additional resource to complete a
    task, as well as for executing all processes required within a multiprocess communication
    system. Spawning processes in UNIX involves forking a copy of the original process
    or executing another process from within the copy of the original process. When
    the process is forked, the forked process is the child of the original process
    (the parent) and inherits all attributes of the original process. When a process
    is spawned, it waits until upon it completes. When it completes, the spawned process
    returns an exit code to the parent process. If the parent process does not wait
    for the child's exit status, the child process becomes a zombie. XPCWaitPid encapsulates
    the features involved with waiting and processing a child process. XPCWaitPid
    can also be used to ignore the return status of a child process, preventing the
    creation of a zombie.
