  md: '# Chapter 1: Introduction


    communication between them. In the 1980s and early 1990s, most networks consisted
    primarily of UNIX workstations. As Windows NT became more stable, it became a
    more widely used operating system for client solutions. The January 13, 1998 edition
    of Windows NT magazine reports that Microsoft accounted for 87 percent of client
    operating systems in 1997, whereas UNIX operating systems accounted for only one
    percent of those shipped. Soon, Windows NT workstations will become a part of
    most networks, if they have not already.


    The benefits of the UNIX and Windows NT operating systems provide valid reasons
    for running both within a single network. The UNIX workstations provide a stable
    and secure operating system on which applications that require a high degree of
    operating stability. UNIX also provides many built-in utilities that are not easily
    available on Windows NT. Lastly, since the UNIX operating system has been in existence
    for three decades, application source code that is related to the task at hand
    may be freely available. Having this source code could speed up development.


    Windows NT provides users with an easy-to-use, front-end interface. Also, many
    software packages are available that take existing needs into account. Finally,
    there are easy-to-use tools available for Windows NT that allow the developer
    to create visually appealing, easy-to-use applications in a short amount of time.
    Ease of development is an important consideration — especially if the system requirements
    constantly change, forcing the developer to reengineer the project.


    Having both UNIX and Windows NT workstations in a network creates the optimal
    solution. Windows workstations provide popular front-end interfaces, while UNIX
    workstations provide process stability and mature network systems development.


    As Windows NT matures, it will probably become more and more stable and eventually
    be suited for processes that demand continuous runtime. Even when day comes, many
    organizations will still have UNIX workstations applications that are suited for
    the job at hand. It doesn''t make sense to port a perfectly working application
    to a new operating system just because it is the latest and greatest on the network.
    This comes back to the old adage that "If it''s not broken, don''t fix it". The
    thing holds true for software.


    One of the biggest buzzwords in the current software industry is the "Total Cost
    of Ownership". The total cost of ownership refers to the amount of money it costs
    the firm to purchase and upgrade custom software. If a software application has
    to be rewritten on a new operating system, the cost of ownership goes up. Resources
    are taken away from new development to concentrate on rewriting an existing application.
    By taking advantage of a networked environment, the old applications can be updated
    so that they communicate to an interface running on the new operating system.
    The user''s view of the application appears to be running on the new operating
    system, although it is actually an interface to the same program running on the
    old operating system. By taking advantage of network programming, the cost of
    ownership for the original process is greatly reduced. Not only the application
    not need to be rewritten, it also does not need to be retested. (Although in the
    real world, verifying application stability is always a good idea.) If the application
    is rewritten, it must also be rewritten to ensure the result doesn''t perform
    differently than the original.


