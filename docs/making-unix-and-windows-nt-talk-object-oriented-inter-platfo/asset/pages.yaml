    \ user-level threads cannot take advantage of them. The inability to available\
    \ CPUs limits the parallel processing capability of multiple user-level threads.\n\
    \nKernel-level threads allow the kernel to treat each thread as a separate entity\
    \ for scheduling. Because the kernel schedules the threads, they compete for resources\
    \ with other processes and other kernel-level threads running on the same system.\
    \ The scheduling of kernel-level threads is almost as resource-intensive as scheduling\
    \ separate processes. However, threads can take advantage of multiple processors,\
    \ which provides more resource opportunities. Although sharing resources and synchronization\
    \ of kernel-level threads is less costly than user-level threads, they allow the\
    \ programmer to choose the type of thread to use.\n\nPOSIX refers to its thread\
    \ scheduling type as its contention scope. The scope of a thread can be at the\
    \ user or kernel level. Setting the POSIX's thread contention scope to PTHREAD_SCOPE_PROCESS\
    \ specifies the user-level thread. Setting the thread contention scope to this\
    \ definition specifies that the thread is scheduled and completes for resources\
    \ within its originating process. The contention scope defined by PTHREAD_SCOPE_SYSTEM\
    \ allows threads to be scheduled by the operating system. This POSIX thread is\
    \ a kernel-level thread. The thread defined as PTHREAD_SCOPE_SYSTEM competes for\
