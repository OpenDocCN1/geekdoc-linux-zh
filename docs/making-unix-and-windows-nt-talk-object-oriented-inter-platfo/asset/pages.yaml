  md: '# Table 3.3 WIN32_FILE_ATTRIBUTE_DATA Structure Members


    | Data Type | Structure Member | Description |

    | --- | --- | --- |

    | DWORD | dwFileAttributes | Bitmap of attributes |

    | FILETIME | ftCreationTime | Creation time |

    | FILETIME | ftLastAccessTime | Last read or write time |

    | FILETIME | ftLastWriteTime | Last write time |

    | DW | nFileSizeHigh | High order word of 64-bit file size |

    | DWORD | nFileSizeLow | Low order word of 64-bit file size |


    The dwFileAttributes member is a bitmap that bits set to indicate the file''s
    attributes, which are listed in Table 3.4.


    # Table 3.4 File Attribute Constants


    | Attribute | Description |

    | --- | --- |

    | FILE_ATTRIBUTE_ARCHIVE | The pathname is an archive file or directory. Use this
    attribute to mark files for backup or removal. |

    | FILE_ATTRIBUTE_COMPRESSED | The pathname is compressed. For a file, all data
    in the file is compressed. For a directory, compression is the default for newly
    created files and subdirectories. |

    | FILE_ATTRIBUTE_DIRECTORY | The pathname is a directory. |

    | FILE_ATTRIBUTE_HIDDEN | The pathname is hidden. It is not included in an ordinary
    directory listing. |

    | FILE_ATTRIBUTE_NORMAL | The pathname has no other attributes set. This attribute
    is valid only when used alone |

    | FILE_ATTRIBUTE_OFFLINE | The data in the pathname is not immediately available.
    The file data has been physically moved to offline storage. |

    | FILE_ATTRIBUTE_READONLY | The pathname is read-only. Applications can read from
    the file, but cannot write to it or delete it. |

    | FILE_ATTRIBUTE_SYSTEM | The file or directory is used by the operating system.
    |

    | FILE_ATTRIBUTE_TEMPORARY | The file is being used for temporary storage. File
    systems attempt to keep all of the data in memory for quicker access, rather than
    flushing the data back to mass storage. A temporary file should be deleted by
    the application as soon as it is no longer needed. |'
