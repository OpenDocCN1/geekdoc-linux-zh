    # # Choosing the Right Communication Protocol for the System


    Once the operating system for the client and server have been chosen, the next
    step is to determine the communication protocol for the cross-platform system.
    Use the following questions as a guide when choosing the right communication protocol
    for the task at hand.


    +   1. Is message delivery and message ordering critical for the system to operate
    correctly?

    If guaranteed message delivery and the ordering of messages is critical to the
    system''s effectiveness, TCP communication should be used. When communicating
    with the TCP protocol, a restriction exists that does not allow the clients to
    run if the server is not running. If the server is down, the clients cannot function.


    +   2. Is guaranteed message delivery unnecessary for system operation?

    If is more important to maintain the execution state of the client than have messages
    delivered to the server, UDP communication should be used. UDP is a connectionless
    protocol, meaning that the client never makes a connection with the server. Therefore,
    if the server does not exist, the client continues to run (The client might not
    function properly if the server does not exist, but the client still executes
    and does not crash). If the client sends messages, the messages are lost in virtual
    space. The downside of UDP communication is that message delivery is not guaranteed.
    Any delivery integrity must be maintained by the client and server applications.


