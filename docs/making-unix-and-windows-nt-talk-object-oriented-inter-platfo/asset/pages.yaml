    managed if it is encapsulated in a class and that class is used to create the
    process. The XPCProcess class encapsulates the Security Attribute structures for
    both the process and its primary thread, application name and command line, current
    directory, creation flags, startup information structure, the process information
    structure returned by CreateProcess(), the environment variable block (including
    a function to add environment variables to the block), and the inherit handles
    flag.'
