    # Closing the TCP Socket Connection


    Like UDP, when TCP usage is complete, the socket file descriptor needs to be closed
    so that its resources can be reused by other applications. The system calls close()
    (closesocket() in the case of Windows NT) or shutdown() can be used to terminate
    the socket connection (see Table 5.13). There are a couple of differences in closing
    a TCP versus a UDP socket.


    +   * Closing a socket using close() causes the operating system to attempt to
    send any bytes pending on the data stream before the socket is closed.

    * Multiple sockets need to be closed within servers using the TCP protocol. These
    sockets include the original socket opened for accepting connections from clients,
    as well as the socket created by accept() for communication with the connected
    client.'
