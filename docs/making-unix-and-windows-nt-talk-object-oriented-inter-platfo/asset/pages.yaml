    Another problem arises when a process receives a message and wishes to respond
    to the sending process. The receiving process must have knowledge of the sending
    process''s port number. The IP address of the sending process can easily be found
    by the receiver, since it is part of the IP datagram header. When the sending
    process sends a message, it requests an unused port number from the TCP service
    on its local machine. The port number is included in the message''s TCP header.
    As long as the TCP service does not reassign the port number to another process
    before the response is made, no conflict exists. The port assigned to UDP or TCP
    communicating processes are referred to as ephemeral port numbers (short-lived
    ports). TCP and UDP port numbers are reserved from 1-255 for various operating
    system services. Some operating systems reserve additional ports for privileged
    programs. Ephemeral ports also have a reserved range of port numbers.


    The TCP and UDP message headers contain both the source and destination port numbers.
    TCP ports are independent of UDP ports, because the IP datagram header specifies
    the protocol for the message. In other words, TCP port assignment does not overwrite
    UDP port assignment and vice versa.


