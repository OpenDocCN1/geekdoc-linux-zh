    The listing of the consumer program is shown in Listing 3.35. The producer program
    is unchanged from the version presented in Section 3.4.


    The consumer creates two threads for each producer — the consumer thread that
    processes the data passed to it from the producer, and an exit thread that waits
    on the consumer to exit.


    The main thread of the consumer initializes an XPThreadInfo object for each consumer
    thread and creates a consumer thread and an exit thread for each producer. It
    then goes into a processing loop in which it waits on an unnamed semaphore lock,
    mainSem. When this lock is obtained, it knows that a thread has entered data into
    the global variable globalMsg. It then waits for a lock on the semaphore threadSem,
    which protects globalMsg. When that lock is obtained, it reads the data in globalMsg,
    processes it, and releases the lock on threadSem.


    The consumer thread waits for the lock on the named semaphore created by the producer.
    When that lock is obtained, the thread knows that the producer has entered data
    in the source file. It reads the data from the file, deletes the data in the file,
    and releases the lock on the named semaphore. It waits for a lock on the semaphore
    threadSem, which protects globalMsg. When this lock is obtained, the data from
    the producer is written to globalMsg. The main thread signals that data is available
    by releasing the lock on mainSem.


    The exit thread waits for the consumer thread to exit. When it does, the exit
    thread decrements the counter of active threads. When the counter is zero, no
    more threads are active and the thread causes the program to exit.


    # Listing 3.35 Threaded Consumer Program


    ```

    #include <iostream.h>

    #include <string.h>

    #include <fstream.h>

    #include <iostream.h>

    #include "MultiProducer.h"

