    \n# The XPCAsyncTcpSocket Class Definition\n\nAsynchronously handling TCP socket\
    \ messages is more involved than asynchronously-handling UDP sockets. UDP sockets\
    \ have only one feature, receiving socket messages which can cause a process to\
    \ block. Therefore, receiving UDP messages needs to be handled asynchronously.\
    \ TCP socket messages have many features that cause a process to block. These\
    \ features include receiving and sending data, connecting to peer applications,\
    \ and receiving peer connections. Like XPAsyncUdpSocket, XPCAsyncTcpSocket inherits\
    \ CASyncSocket publicly.\nXPCAsyncTcpSocket also inherits XPCTcpSocket publicly.\n\
    \nUnlike UDP sockets, require both the client and server to be bound to a socket\
    \ port and address for sending and receiving data (this is due to UDP's connectionless\
    \ status), sockets are only bound to a port and address if they are receiving\
    \ client connections. If the application is connecting to a server, socket binding\
    \ is not necessary unless the actual connection binds the client's socket. Therefore,\
    \ encapsulating vBindSocket() of XPCTSocket within a method that binds the socket\
    \ and attaches the socket file descriptor to CASyncSocket is not desirable. Only\
    \ the applications accepting connections need to bind their socket and attach\
    \ their socket file descriptor to CASyncSocket. The flags used to attach TCP"
