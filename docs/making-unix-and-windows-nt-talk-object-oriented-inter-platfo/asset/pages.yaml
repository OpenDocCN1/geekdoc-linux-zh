  md: '# Figure 5.10 Architecture for Asynchronously Processing Multiple Socket File
    Descriptors


    ![](img/5c85d865d33d2c2c3c815331ae6c6f4a_410_0.png)


    select() allows asynchronous communication on any file descriptors, including
    socket file descriptors, I/O file descriptors, or any other file descriptors.
    select() is valid on both the UNIX and Windows operating systems. Before introducing
    select(), a few support macros also need introduction. These macros place file
    descriptors in a file descriptor set that is later used by select(). The file
    descriptor set is of type fd_set. These macros are located in the sys/types.h
    include file in UNIX and winsock2.h in Windows NT. The macros and their use are
    displayed in Table 5.21.'
  merge: -1
  pgno: 410
- img_proc: true
  md: "| Macro | Description |\n| --- | --- |\n| FD_ZERO(fd_set &fdset); | Clears\
    \ out (zeros out) a set of file descriptors pointed to by fdset. |\n| FD_SET(int\
    \ fd, fd_set &fdset); | Puts a file descriptor (fd) into a file descriptor set\
    \ (fdset). |\n| FD_CLR(int fd, fd_set &fdset); | Removes a file descriptor (fd)\
    \ from a file descriptor set (fdset). |\n| FD_ISSET(int fd, fd_set &fdset); |\
    \ Determines whether the file descriptor (fd) is in the file descriptor set (fdset).\
    \ Returns non-zero if the file descriptor is part of fdset or zero if not part\
    \ of fdset. |\n\nOnce the appropriate file descriptors are placed in file descriptor\
    \ sets using the macros listed in Table 5.21, select() can executed. select()\
    \ examines file descriptor sets to see if the file descriptors are ready for one\
    \ of three cases.\n\n```\nselect(int width, fd_set *readfds, fd_set *writefds,\
    \ fd_set *exceptfds, struct timeval *timeout);\n```\n\nThe first parameter, width,\
    \ specifies the maximum value of file descriptors contained within each of the\
    \ file descriptor sets, readfds, writefds, and exceptfds. The next three parameters\
    \ represent the file descriptor sets in which asynchronous notification is required\
    \ by the system. These file descriptor sets, in the parameter order presented,\
    \ include file descriptors ready for reading (readfds), writing (writefds) and\
    \ exceptional conditions pending (exceptfds). Any of the file descriptor sets\
    \ can be NULL, indicating that there are no file descriptors of interest for the\
    \ particular notification. select() returns, which replaces the file descriptor\
    \ set with a file descriptor subset. This subset of file descriptors consists\
    \ of those descriptors ready for the requested operation. select() returns the\
    \ total number of ready file descriptors from all file descriptor sets. The macro\
    \ FD_ISSET is used to determine which file descriptors have been returned for\
    \ a given operation. The select() parameter is a timeout value. This parameter\
    \ is of type struct timeval and can be found in the sys/time.h header file in\
    \ UNIX and the winsock2.h header file in Windows NT.\n\n```\nstruct timeval {\n\
    \  int tv_sec;  // Number of seconds\n  int tv_usec; // Number of microseconds\n\
    };\n```"
