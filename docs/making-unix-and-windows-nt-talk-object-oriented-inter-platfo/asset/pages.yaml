  md: '# Integrating Sockets with Windows 431


    places these events on the application''s message queue. Blocking by socket communication
    does not occur because socket communication events are not awaited; instead, the
    application is informed when such events occur. This feature enables sockets to
    be incorporated into GUI applications without hindering the Window application''s
    performance. Therefore, socket messages and window messages are asynchronously
    controlled with neither messaging framework blocking the other.


    When socket events are removed from the queue, the application must have a way
    to inform the operating system how to handle the event. CAsyncSocket handles the
    socket messaging events similar to the way in which Windows events are handled.
    CAsyncSocket defines virtual methods that are called upon receipt of specific
    events. By overriding these virtual functions, application-specific control can
    be achieved. Window controls, such as buttons, are contained within a class, CButton,
    which contains overridable virtual functions. The class calls all these functions
    when events occur, such as when the Click event is processed from the message
    queue. When a button is defined for an application, it is derived from CButton
    and its virtual OnClick event is overridden to perform tasks specific to the application.


    The use of overrideable virtual functions is the method CAsyncSocket uses to handle
    messaging. A class derived from CAsyncSocket can override the virtual event functions
    that are necessary for the application and perform the tasks specific to that
    application. If the virtual events are not overridden, the default actions defined
    by the base class are performed. Because the virtual event needed by the application
    need to be overridden, the overridable CAsyncSocket virtual event functions are
    defined in Table 5.22.


    # Table 5.22 CAsyncSocket Virtual Event Functions


    | Overridable Virtual Event Function | Definition |

    |---|---|n| On() | Notifies the socket listening for connections that are pending
    (TCP sockets only). |

    | OnClose() | Notifies the socket that a connection has terminated (TCP sockets
    only). |

    | OnConnect() | Notifies the socket that a requested connection has completed.
    (This event is called even if the requested connection fails. TCP sockets only).
    |

    | OnOutOfBandData() | Informs the socket that there is out-of-band data to be
    read on the socket. (This event is not covered in this book. TCP and UDP sockets).
    |

    | OnReceive() | Notifies the socket that data is available to be received (TCP
    and UDP sockets). |

    | OnSend() | Notifies the socket that it can send data (TCP sockets only). |'
