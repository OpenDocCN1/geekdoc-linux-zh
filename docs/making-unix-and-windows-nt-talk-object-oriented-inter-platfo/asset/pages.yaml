  md: "# 332 Chapter 5: Sockets — The Cross-Platform Communication Building Blocks\n\
    \nfile descriptor for close() (closesocket()) in Windows NT or shutdown(). These\
    \ systems are the starting points for the sockets for base class, PSocket, introduced\
    \ in this book. The socket is created in the constructor and closed in the destructor.\n\
    \nBefore PSocket is defined, it is important to include all options that can be\
    \ set for the socket prior to communication. These options allow socket to be\
    \ specified for the target application. Sockets contain a variety of options that\
    \ can be set. These options are set using the setsock-opt() system call to set\
    \ the options and the getsockopt() system call to get the socket options. These\
    \ options are defined in the sys/socket.h header file in UNIX and the winsock2.h\
    \ header file in Windows\n\n```\nint setsockopt(int socket, int len, int option_name,\
    \ const void\n    *option_value, int option_len);\nint getsockopt(int socket,\
    \ int len, int option_name, void *option_value,\n    *option_len);\n```\n\nIf\
    \ the system calls is successful, 0 is returned; otherwise, -1 is returned and\
    \ the system error code is set. This error code can be retrieved using the global\
    \ errno variable in UNIX systems and Windows NT. The socket parameter refers to\
    \ a file descriptor created using socket(). The level specifies the level at which\
    \ the socket is defined. For the purpose of this book, the levels are set at the\
    \ socket level (SO_SOCKET). Options can be set at other levels, but these are\
    \ very specialized and are not required for the purposes of this book. The option_name\
    \ parameter defines what option is set or retrieved. The option_value parameter\
    \ points to the value set for the option. If the option is a Boolean (meaning\
    \ the option can be turned on or off), an option_value of 0 disables the option\
    \ and an option_value of 1 enables the option. If the option requires an actual\
    \ value, the option_value is set to that value.\n\n```\nsetsockopt() sets the\
    \ option_value supplied for the option_name, getsockopt() retrieves the option_value\
    \ for the given option_name. The final argument, option_len, contains the size\
    \ of the data structure used for option_value. The various options that can be\
    \ set at Table 5.19.\n```\n\n# Table 5.19 Socket Options\n\n| Name | Values |\
    \ Protocols | Description |\n| SO_DEBUG | 0 — Option OFF 1 — Option ON | UDP or\
    \ TCP | Turns on the recording of debugging information. This option allows the\
    \ kernel to maintain a history of messages sent and received. |\n| SO_BROADCAST\
    \ | 0 — Option OFF 1 — Option ON | UDP | Permits the broadcasting of messages.\
    \ This option is only permitted on systems that provide the functionality of broadcast\
    \ messages. |"
