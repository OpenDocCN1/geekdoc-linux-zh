    # Sending Signals to Threads


    Not only do threads contain their own execution stack space, they can also define
    a signal mask. A signal mask is a group of signals that a process or thread can
    accept. A new thread inherits the calling thread''s signal mask, but the parent
    thread''s pending signals are inherited. The set of signals that can be contained
    within the thread''s signal mask can be found in Table 2.1. There are different
    methods of delivering signals to threads, including the following.


    # Asynchronous Delivery


    Synchronous Delivery The signal is delivered to the thread that caused the signal.


    Directed Delivery The signal is sent to a previously identified thread.


    Asynchronous signals are generated at an unspecified time and are not sent to
    a specific thread. In this case, the thread that does not have the signal block
    handles the received signal. If there are multiple threads that process the signal
    and the signal is unblocked, one is selected to handle the signal.

    If a thread causes an error, in turn, causes the kernel to generate a signal,
    the signal is sent directly to the offending thread. Signals sent in this manner
    are asynchronous signals.

    Finally, signals can be explicitly sent to a thread, using the thread''s ID. These
    are referred to as directed signals and are generated using the pthread_kill()
    system call.


    ```

    int pthread_kill(pthread_t thread, int sig)

    ```


    pthread_kill() parameters include the ID of the thread (thread) and the specified
    value (sig). If the value of sig is 0, a validity check is done for the existence
    of the target thread. If pthread_kill() is successful, it returns 0.


    By default, threads inherit their parent''s signal mask. It is also possible to
    create a signal mask unique to the newly created thread. Before spawning a thread,
    all signals within the signal mask should be blocked. Blocking the signals prevents
    the thread from missing them while the thread is being created. Threads do not
    inherit pending signals. Once the thread has been created, the signals can be
    unblocked. The thread can then receive any pending signals, as well as process
    new signals.'
