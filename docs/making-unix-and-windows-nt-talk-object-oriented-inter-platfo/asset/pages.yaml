    | WSTOPSIG(stat_loc) | If WSTOPPED returns a nonzero value, WSTOPSIG returns the
    signal that caused the process to stop. |

    | WIFCONTINUED(stat_loc) | Evaluates to a nonzero value if the child process has
    been signaled to continue. |

    | WCOREDUMP(stat_loc) | If WSIGNALED returns a nonzero value, WCOREDUMP evaluates
    to a nonzero value if the child process dumped a core image. |


    The options parameter is used to control the behavior of waitpid(). The options
    are defined in the sys/wait.h header file and can be logically OR together to
    create different definitions. These options are defined in Table 2.25.


    # Table 2.25 Options for waitpid()


    | Option | Definition |

    |---|---|

    | 0 | The status of the child is returned to waitpid() only if the child exits.
    The children specified by pid have already exited, their status is returned. |

    | WCONTINUED | The status of the child is returned to waitpid() if the child has
    been signaled to continue. If the children specified by pid have already been
    continued, their status is returned. |

    | WNHANG | Parent process execution is not blocked if the status of the child
    is not immediately available. |

    | WNOAIT | The child process returns status to its parent in a waitable state.
    |

    | WTRACED | The status of the child is returned to waitpid() if the child has
    been stopped. If the children specified by pid have already been stopped, their
    status is returned. |


    If waitpid() returns successfully, its value is equal to the process ID of the
    child whose status is reported. If a signal interrupts waitpid(), -1 is returned
    and the global errno variable is set to EINTR. If waitpid()''s options include
    WNOHANG and status is not available for the processes being tracked, 0 is returned.
    -1 is returned otherwise and errno is set to the appropriate error value.'
