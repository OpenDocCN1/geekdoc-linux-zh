  md: '# NETWORK PROGRAMMING


    Combine the power of the UNIX and Windows NT operating systems.

    This book provides an in-depth, object-oriented study of inter-platform communication
    between UNIX and Windows NT. It will enable you to:


    +   - Understand socket communication and threading on multiple operating systems.

    - Develop applications in a network of heterogeneous operating systems.

    - Take advantage of processes written on one operating system for use on another.

    - Understand how to integrate socket communication within a Windows NT graphical
    user interface application.


    Begin with an overview of the traditional software communication models, including
    the OSI model, the Internet Protocol version 4 (IPv4) and version 6 (IPv6), the
    Client-server model, and the Cross-platform client-server model.


    Then you get a definition of inter-platform communication described as a series
    of objects that are used to create more complex inter-platform objects. You will
    learn the appropriate use of semaphores, signals, threads, and synchronous and
    asynchronous sockets to:


    +   - Develop C++ objects for both platforms that encapsulate constructs that
    serve as the building blocks of inter-platform communication.

    - Employ UDP and TCP sockets to access functionality on either operating system.


    And you get C++ objects that can be inserted into your own applications. Each
    chapter includes design discussions, architecture drawings, and functioning systems
    illustrating how to adapt the author provided objects to your needs and to create
    your own cross-platform applications.


    R&D Books is an imprint of Miller Freeman.

    Other publications in the Miller Freeman family include:


    ![](img/5c85d865d33d2c2c3c815331ae6c6f4a_499_0.png)


    Mark Nadelson and Thomas Hagen have 25 years of experience in developing within
    UNIX, DOS/Windows and, more recently, Windows NT systems. Their work has included
    the development of network software for telecommunications, digital signal processing,
    internet programming, and financial institutions. It is in their development of
    mission critical applications for financial institutions, where legacy UNIX systems
    are wedded to Windows NT workstations, that they have honed their skills in inter-platform
    communications.


    ![](img/5c85d865d33d2c2c3c815331ae6c6f4a_499_1.png)


    $44.95 • ISBN 0-87930-584-3


    ![](img/5c85d865d33d2c2c3c815331ae6c6f4a_499_2.png)


    ![](img/5c85d865d33d2c2c3c815331ae6c6f4a_499_3.png)'
