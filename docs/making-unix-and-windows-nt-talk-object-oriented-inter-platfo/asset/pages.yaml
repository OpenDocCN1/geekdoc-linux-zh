  md: "# 196 Chapter 3: NT Building Blocks\n\nresources before exiting, so its use\
    \ is discouraged. Numerous attributes of a thread can be set, including its execution\
    \ priority, the processor on which it runs, and stacksize.\n\nThe call to create\
    \ a thread, CreateThread(), is prototyped. It creates a thread and returns its\
    \ handle. The handle is used in other Win32 calls to manipulate the thread. If\
    \ the call fails, the handle is null and a call to GetLastError() returns extended\
    \ error information.\n\n```\nHANDLE CreateThread(LPSECURITY_ATTRIBUTES lp,\n \
    \              DWORD dwStackSize,\n               LPTHREAD_START_ROUTINE lpStartAddress,\n\
    \               LPVOID lpParameter,\n               DWORD dwCreationFlags,\n \
    \              LWORD *lpThreadId);\n```\n\nThe first parameter, the security attribute\
    \ structure, contains the security descriptor and discretionary access lists.\
    \ These structures control what processes can access the thread (or more accurately,\
    \ what owners of processes can access the thread) and whether it is inheritable\
    \ by child processes the thread may spawn. This parameter can be set to null if\
    \ these features are not used.\n\nThe second parameter is the initial size of\
    \ the stack. NT increases the size of the stack, if needed, but an initial size\
    \ must be specified. If zero is specified, the stack size of the calling thread\
    \ is used.\n\nlpStartAddress is address of the function that will be called when\
    \ your thread begins. It is be lpParameter is the parameter that will be passed\
    \ to the thread function. This can be used as a pointer to a structure if your\
    \ application needs more than one parameter passed to the thread.\n\ndwCreationFlags\
    \ has two attributes — CREATE_SUSPENDED or zero. With CREATE_SUSPENDED, your thread\
    \ will be created but will not immediately execute. A later call to ResumeThread()\
    \ will schedule your thread for execution. This is useful for initializing a thread\
    \ before it runs. A value of zero will schedule the thread for execution immediately.\
    \ lpThreadID is a pointer to a double which a unique identifier for the thread\
    \ will be returned. threadID is from a handle in which it identifies the thread,\
    \ but cannot be used to manipulate it. Use threadID if another thread or process\
    \ needs to identify the thread, but not enable to call any functions that may\
    \ disrupt the thread, such as TerminateThread().\n\nThe function to execute the\
    \ thread is shown here.\n\n```\nDWORD WINAPI ThreadFunc(LPVOID lpData);\n```\n\
    \nlpData has the same value as lpParameter passed in CreateThread(). Use these\
    \ parameters to pass a single parameter or a structure to ThreadFunc()."
