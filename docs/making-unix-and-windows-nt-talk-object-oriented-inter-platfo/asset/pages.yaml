    # Interplatform Socket Communication Protocol #1:

    Structure Packing


    One problem deals with structure packing. By default, Windows NT packs its structures
    to the closest byte value divisible by 8. If a data structure contains a single
    long int (4 bytes), the operating system pads the structure with 4 additional
    "padding" bytes, and the entire data size becomes 8 bytes. Data structures are
    packed differently in the UNIX operating system. Let''s say the UNIX operating
    system packs to the nearest 4 bytes. A structure containing a single long int
    in this system has a size of only 4 bytes. If the data structure was passed from
    UNIX to NT, four bytes would be copied into a structure containing 8 bytes because
    the NT data structure is large enough to contain the data sent from the UNIX.
    If this situation is reversed and the process on the NT operating system sends
    the data to the process running on the UNIX operating system, a data corruption
    error occurs. A data structure with a size of only four bytes cannot accommodate
    one that has a larger size.


    When sending data structures between UNIX and Windows NT, structure packing and
    byte ordering become a major concern. Each operating system packs their structures
    differently. The type of UNIX operating system communicated dictates how the data
    structure must be packed. Under Solaris 5.6, data structures are packed to the
    size of the largest element within the data structure. If the largest element
    in the data structure of type long int, the data structure is packed to the nearest
    4 bytes. If the structure is not a multiple of 4, the remaining bytes are added
    as padding bytes. Table 5.1 displays the data packing under Solaris 5.6 based
    on the largest data element size.'
