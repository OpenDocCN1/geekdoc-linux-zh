  md: '# 220 Chapter 3: NT Building Blocks


    # Table 3.8 OpenProcess() Access Flags


    | Access | Description |

    |---|---|

    | PROCESS_ALL_ACCESS | All access to the returned process. |

    | PROCESS_CREATE_PROCESS | Used internally by NT. |

    | PROCESS_CREATE_THREAD | Allows the calling process to use the handle in CreateThread()
    function to create a thread in the process. |

    | PROCESS_DUP_HANDLE | Allows the calling process to use the handle in DuplicateHandle()
    to duplicate a handle. |

    | PROCESS_QUERY_INFORMATION | Allows the calling process to use the handle in
    GetExitCodeProcess() and GetPriorityClass() to read information from the process
    object. |

    | PROCESS_SET_INFORMATION | Allows the calling process to use the handle in SetPriorityClass()
    to set the priority class of the process. |

    | PROCESS_TERMINATE | Allows the calling process to use the handle in TerminateProcess()
    to terminate the process. |

    | PROCESS_VM_OPERATION | Allows the calling process to use the handle in VirtualProtectMemory()
    to modify the virtual memory of the process. |

    | PROCESS_VM_READ | Allows the calling process to use the handle in ReadProcessMemory()
    to read from the virtual memory of the process. |

    | PROCESS_VM_WRITE | Allows the calling process to use the handle in WriteProcessMemory()
    to write to the virtual memory of the process. |

    | SYNCHRONIZE | Allows the calling process to use the handle in any of the wait
    functions to wait for the process to terminate. |


    OpenProcess() can be used in situations that your program knows that another program
    is running, knows that process ID, and needs specific information about that program,
    such as when that process terminates. The handle returned from OpenProcess() can
    be used in any of the asynchronous wait functions, as WaitForSingleObject().


