  md: "# Creating NT Processes 219\n\nlpProcessInformation is a pointer to a PROCESS_INFORMATION\
    \ structure that is filled in by NT before CreateProcess() returns. The structure\
    \ is shown here.\n\n```\ntypedef struct _PROCESS_INFORMATION\n{\n    HANDLE hProcess;\n\
    \    HANDLE hThread;\n    DWORD dwProcessId;\n    DWORD dwThreadId;\n} PROCESS_INFORMATION\n\
    ```\n\nThe first two members are handles to the child process and its main thread.\
    \ Handles are used in all Win32 functions to manipulate the objects. The ID members\
    \ are to uniquely identify the process and its thread, but cannot be used to manipulate\
    \ it. Use these IDs if you need to give an identification value to another process,\
    \ but want to prevent it from calling a destructive function, such as TerminateThread()\
    \ or TerminateProcess().\n\nExitProcess is called by any process when it exits.\
    \ This is the preferred method to exit a process because it enables a clean shutdown\
    \ of the process and all threads.\n\n```\nVOID ExitProcess (UINT uExitCode);\n\
    \nuExitCode is the code for this process and all threads owned by this process.\
    \ The value in uExitCode is retrieved by a call to GetExitCodeProcess().\n```\n\
    \n```\nBOOL GetExitCode(HANDLE hProcess,\n    LWORD lpExitCode);\n```\n\nTerminate()\
    \ abruptly terminates a process and all its threads and should be used sparingly\
    \ because it does not allow a process or thread to clean up all allocated resources\
    \ before it ends.\n\n```\nBOOL TerminateProcess (HANDLE hProcess,\n    UINT uExitCode);\n\
    ```\n\nStartupInfo() copies the STARTUPINFO structure of the calling process to\
    \ the structure.\n\n```\nVOID GetStartupInfo (LPSTARTUPINFO lpStartupInfo);\n\
    ```\n\nOpenProcess() is used to open an existing process, given a process ID.\n\
    \n```\nHANDLE OpenProcess (DWORD dwDesiredAccess,\n    BOOL bInheritHandle,\n\
    \    DWORD dwProcessId);\n```\n\nThe first parameter specifies the access rights\
    \ that are needed by the calling process. The owner ID of the calling process\
    \ is checked against the Access Control List in the security descriptor of the\
    \ target process to see if the desired access is granted. If access is denied,\
    \ the call will fail. dwDesiredAccess can have a combination of the flags shown\
    \ in Table 3.8."
