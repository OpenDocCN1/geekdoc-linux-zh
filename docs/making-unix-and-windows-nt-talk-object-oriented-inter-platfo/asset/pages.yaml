  md: '# 414 Chapter 5: Sockets — The Cross-Platform Communication Building Blocks


    # 5.10 Integrating Sockets with Windows


    One of Windows''s greatest strengths is its GUI feature. Using GUI applications,
    the user can view information displayed in certain areas of the screen while leaving
    other areas unchanged. The different areas of the screen are referred to as windows.
    Thus far, all NT examples presented in this section have non-GUI applications.
    The user interfaces, which have been used, are console devices that prompt the
    user for input and output on the same device. For a stock trading and position
    keeping system, a console interface is not ideal. With a console interface, the
    user cannot view all of positions at one time. Instead, each position is written
    to the console interface upon stock trade execution. The same console is used
    to prompt the user for additional trades. Eventually, starts scrolling off the
    current window. Ideally, the Stock Market Position Tracking System user interface
    should be able to display all stock ticker positions in one area of the user interface
    and accept and execute stock trades in another area of the user interface. This
    is where NT GUI capabilities are helpful.


    A complexity occurs when attempting to integrate platform socket communication
    with Windows. The GUI interface should be available for user manipulation. The
    Windows has scrolling capabilities, the user should always be able to scroll the
    window to view the information within it. Unfortunately, process suspension occurs
    when sockets in their default state (TCP and UDP sockets), except connections
    (TCP sockets), and connect to other sockets (TCP sockets). Blocking execution
    in a Windows NT GUI applications also blocks users from manipulating the application''s
    interface. This section explores ways in which sockets can be integrated within
    Windows NT GUI applications without affecting Windows interfaces.


    # Threading UDP Sockets and Windows


    One method that can be used for integrating sockets within Windows is placing
    communication in a separate thread. (Threading sockets were discussed in Section
    5.9.) By placing socket communication in a separate thread, the primary thread
    handling Windows events continues to execute separate from the socket communication
    threads. Regardless of the socket protocol (UDP or TCP), the communication thread
    is passed a pointer to the Windows object that it is manipulating. This thread
    is used to place or retrieve data from the Window interface whose address is passed
    to the thread.


    A question arises as to which socket functions need to be threaded. Of the course,
    the socket communication can be threaded, but this situation might not be acceptable.
    The main thread might need access to the socket to send data when the user performs
    tasks within the Windows application. If the socket is completely contained in
    a thread, access to it by the main thread cannot be achieved. Therefore, only
    certain features of the sockets should be threaded. These features vary by protocol.


    Because UDP sockets are connectionless, creating and binding the socket are nonblocking
    operations and do not need to be threaded. Likewise, sending data through UDP
    sockets is a nonblocking operation. The blocking operation that does exist within
    UDP socket communication is receiving data. By default, the UDP socket blocks
    until the message is received. The threading of this operation is beneficial within
    GUI applications. When an application sends data, the thread retrieves the data
    and can display the data'
