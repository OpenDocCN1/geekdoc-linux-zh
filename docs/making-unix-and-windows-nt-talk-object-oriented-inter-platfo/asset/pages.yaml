  md: '# 64 Chapter 2: UNIX Building Blocks


    # Figure 2.5 Using Semaphores within Threads


    ![](img/5c85d865d33d2c2c3c815331ae6c6f4a_75_0.png)


    The second use of UNIX semaphores is synchronizing access to mutually exclusive
    resources between two or more programs running on the same system. Synchronization
    is needed when one program writes information to a file (such as a shared memory
    file) and another program reads the information. Semaphore access is queued in
    the order requested. When one process is finished with the semaphore, the next
    waiting process locks it. Synchronization using semaphores can also be useful
    for indicating that a process has completed a task. If the task is not complete,
    the processes remains in a wait state. When the process completes, a semaphore
    is unlocked indicating that the next process waiting can proceed. Figure 2.6 illustrates
    the use of semaphores between processes and shows how semaphore queues works.'
