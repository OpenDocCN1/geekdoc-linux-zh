    \nA signal is a notification to a running process that an event has occurred.\
    \ When an event occurs, a signal is generated and is delivered to the process.\
    \ The signal exists only from the time it was generated to the time it is delivered.\
    \ The process receiving the signal can perform one of the following actions.\n\
    \n+   * The process can ignore the signal (although some signals cannot be ignored).\n\
    * The process can let the default action associated with the signal take place.\n\
    * The process can perform an action that has been determined at design time.\n\
    \nOne of the benefits of sending and catching signals is that they can be used\
