  md: "```\n}\n// Catch any exceptions that are caused by the TCP socket related classes.\n\
    catch(XPCEException &exceptObject)\n{\n    cout << exceptObject.getException()\
    \ << endl;\n    return 0;\n}\n```\n\nThe system detailed in Listing 5.35 is capable\
    \ of reliably tracking stock positions. The uncertainty of UDP data transfer has\
    \ been overcome. Because the data is being transferred on TCP sockets, message\
    \ delivery is guaranteed (as long as the client and server remain connected).\
    \ Although the message delivery problem has been addressed, a new issue introduced.\
    \ The server can only process one client connection at a time. The acceptance\
    \ of connections and subsequent client communication is done within a loop in\
    \ the main thread of the server process. When a client connects, the main server\
    \ thread is dedicated to communicate with it. It is only when the client disconnects\
    \ that the server can communicate with a new client. This situation is not appropriate\
    \ for the Stock Market Tracking Position System because the original requirements\
    \ specify that multiple clients can communicate with the server at the same time.\
    \ Section 5.9 explores ways in which multi-client-server communication can occur\
    \ using reliable TCP sockets.\n\n# # 5.9 Multiple Connection Processing Using\
    \ Sockets\n\nMultiple connection processing is not an issue with regards to UDP\
    \ sockets. UDP sockets provide sending and receiving to from an unlimited number\
    \ of applications. UDP sockets can provide this feature because they are disconnected\
    \ and the socket file descriptor is tied to one particular client or server.\n\
    TCP sockets are connection-oriented. Each time a client connects to a server,\
    \ a new socket file descriptor is created and used for dedicated client-server\
    \ communication. The original socket file descriptor is retained to accept additional\
    \ client connections. It is necessary to create a separate execution state for\
    \ each socket file descriptor created for client communication.\n\n# # Spawning\
    \ Applications That Use TCP Sockets\n\nOne method used to create separate states\
    \ of execution is spawning processes. After the server accepts a client connection,\
    \ a new process is spawned, dedicated to communication with the client. This new\
    \ process uses the socket file descriptor created by accept() for all data transferred\
    \ with the client. This file descriptor is passed to the new process and the new\
    \ process exists as long as the connection remains. Once the connection is broken,\
    \ the process exits. The benefit of spawning processes is that the main process\
    \ is dedicated to accepting connections. The process spawned performs the actual\
    \ interplatform communication.\nThe steps required to create a multiprocess application\
    \ that accepts multiple client connections are the following."
