  md: "# Multiple Connection Processing Using TCP Sockets\n\nA non-NULL value for\
    \ the struct timeval parameter specifies the maximum time to wait for select(ret).\
    \ If the struct timeval parameter is NULL, select() blocks indefinitely. If a\
    \ timeout occurs before select(ret), select() returns 0, indicating no file descriptors\
    \ are available for processing. If select() fails, -1 is returned. The global\
    \ variable errno is set in the Unix operating system. WSAGetLastError() retrieves\
    \ the specific error in the Windows NT operating system.\n\nBy adding select()\
    \ to Example 5.1 (on page 287) both sockets, tcpSocket1 and tcpSocket2, can accept\
    \ client connections without blocking the other client connections. Example 5.2\
    \ (on page 398) illustrates the addition of the select() system call.\n\n# Example\
