    on the queue and creates a new socket to communicate with the connecting client.
    The new socket maintains the properties as the original. If no pending connections
    are on the queue and the socket is marked as blocking (“Sending Data Using the
    UDP Socket” on page 292 for details on blocking and nonblocking sockets), accept()
    suspends the current process and waits for additional connections.

    The new socket created by accept() is used for reading and writing client data.
    The original socket remains to accept additional connections. By creating a new
    socket for each connected client, the server can communicate to many clients at
    once. If a new socket is not created for every connection, only one client would
    be able to connect to the server, because the original socket would be monopolized
    by the client-server connection. The accept() system call is detailed in Table
