  md: '# 366 Chapter 5: Sockets — The Cross-Platform Communication Building Blocks


    transmission over UDP packets is not reliable. Just because the message is sent
    does not mean it will be received. In fact, because message transfer is connectionless,
    neither the client nor the server can ensure that messages are received, even
    if only one client is communicating. Reliable message transfer is an essential
    component of a stock position tracking system. A stock trader would not be happy
    if a trade is made that is never received.


    Unfortunately, unreliable message transfer, UDP is not the correct protocol for
    creating a Stock Market Position Tracking System. Section 5.8 discusses the creation
    of the XPCTcpSocket and applies it to the Stock Market Position Tracking System.
    The use of TCP sockets addresses the problem of unreliable message transmission
    because TCP sockets make a true connection between the client and server.


    # 5.8 Creating a TCP Socket Protocol Class


    Unfortunately, UDP sockets do not provide reliable transfer of data. This is an
    unacceptable flaw of the Stock Market Tracking System introduced in Section 5.7.
    When critical data is transferred, it must arrive at its destination. TCP sockets
    provide a solution to the message problem. The TCP socket specifies that client-server
    communication is connection-oriented. With connection-oriented communications,
    a true client-server connection must exist for data to be transferred. The client
    and server are guaranteed message arrival. If the connection does not exist, the
    client receives an error when sending data. This is different from UDP sockets.
    Client-server connections do not exist for UDP sockets. The UDP client sends a
    message using a port number and address, but has no idea whether the server exists.
    Because of peer existence is not obtainable, applications using UDP sockets are
    blind to binding. The application sending the message never receives an error
    informing it that the message is never received. Recall, that the order in which
    UDP messages arrives is not necessarily the same as the order. The TCP socket
    protocol guarantees that messages are received in the same order.


    The TCP sockets wrapper class introduced within this is XPCTcpSocket. XPCTcpSocket
    differs greatly the two classes that both inherit from XPCSocket and both construct
    a socket file descriptor by constructing HPCSocket with the protocol name and
    the port number used for communication. XPCTcpSocket constructs XPCSocket with
    a protocol type of TCP, unlike UDP for XPCUdpSocket construction. A TCP socket
    server is created using the following steps:


    +   - Creating the socket file descriptor (this is done when the inherited XPCSocket
    is constructed)

    - Binding to the designated port

    - Listening for incoming connections

    - Accepting new connections


    When a client connection is accepted, a new socket file descriptor containing
    the same attributes as the original is created and used for client communication.
    Only after the connection is accepted and the new socket file descriptor is created
    can socket messages be sent and received by the client. An XPCUdpSocket requires
    only a socket binding to, on the other hand, also listens for incoming connections
    and accepts the incoming connections.'
