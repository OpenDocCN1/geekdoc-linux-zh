  md: '# The readdir() System Call


    The readdir() function reads the contents of the directory pointed to by the DIR
    object contains an ordered sequence of all directory entries within a particular
    directory. The readdir() function returns a pointer to structure representing
    the directory entry at the current position in the directory stream and positions
    the directory stream to the next entry. This directory structure is called dirent.
    The member within dirent that contains the current pathname is char d_name[],
    a null-terminated string.


    When readdir() reaches the end of a directory stream, a null pointer is returned.
    If a file is removed or added to the directory after the most recent call to opendir(),
    readdir() return an “unknown” entry for that file. The prototype for opendir()
    is as follows.


    ```

    struct dirent *readdir(DIR *dirp);

    ```


    With the use of opendir(), readdir(), closedir(), any directory within a UNIX
    file system can be traversed. The example uses XPCFileStat to get statistics on
    the contents of a directory and determine whether subdirectories can be traversed.
    The example takes a starting pathname and traverses all accessible subdirectories
    within the directory until all files and subdirectories have been examined. Subdirectories
    are traversed using recursion. The directory parsing procedure takes a directory
    pathname as its argument. If another subdirectory is encountered within the current
    directory, the directory parser calls itself with the subdirectory’s name passed
    as the argument. Using this method, the directory tree is parsed left to right,
    top to bottom. Figure 2.2 illustrates the steps taken when parsing the example
    directory structure.'
