  md: "# 198 Chapter 3: NT Building Blocks\n\nThe priority boost of a thread is an\
    \ NT feature that automatically boosts a thread's priority when the operating\
    \ system determines that thread needs a higher priority. This is primarily used\
    \ for user interface applications where a GUI component has the focus. The thread\
    \ that controls is given a priority by the operating system as long as it has\
    \ the user's focus. This permits the component to react quickly when the user\
    \ manipulates it. SetThreadPriorityBoost() turns this feature on or off and GetThreadPriorityBoost()\
    \ returns its state. A true value turns off thread priority boost; false leaves\
    \ it on.\n\nSetThreadAffinityMask() tells NT on which processors the thread is\
    \ allowed to run. dwThreadAffinityMask is a bitmap that indicates processor to\
    \ use. A value of (binary 101) indicates processors and three. The thread will\
    \ run on only one of the specific processors.\n\n```\nDWORD SetThreadAffinityMask(HANDLE\
    \ hThread,\n                DWORD dwThreadAffinityMask);\n```\n\n```\nDWORD SetThreadIdealProcessor(HANDLE\
    \ hThread,\n                DWORD dwIdealProcessor);\n```\n\nSetThreadIdealProcessor()\
    \ tells NT which processor the thread would best run on. NT attempts to run the\
    \ thread on the specified processor, but will use a different one if it is busy.\
    \ ResumeThread(), SuspendThread(), and TerminateThread() are all used to control\
    \ the execution of a thread. ResumeThread() is used if the thread was created\
    \ in a suspended state, or if SuspendThread() was called. SuspendThread() will\
    \ suspend execution of the thread. SuspendThread() and ResumeThread() increment\
    \ and decrement, respectively, a count associated with the thread. If the count\
    \ is zero, the thread will execute. One or more calls to SuspendCall() will require\
    \ the same number of calls to ResumeThread() to resume execution of your thread.\n\
    \n```\nDWORD ResumeThread(HANDLE hThread);\n```\n\n```\nDWORD SuspendThread(HANDLE\
    \ hThread);\n```\n\n```\nBOOL TerminateThread(HANDLE hThread,\n              \
    \  DWORD dwExitCode);\n```\n\nAs mentioned earlier, use of TerminateThread() should\
    \ be avoided because it does not allow your thread to clean up any resources it\
    \ may have allocated, such as memory or semaphores. A better approach would be\
    \ to create an XPCEvent object to signal the thread to terminate itself.\n\nSwitchToThread()\
    \ and ExitThread() are both called from within the thread. Like Sleep() or SleepEx(),\
    \ SwitchToThread() is used to suspend processing of the current thread and allow\
    \ another thread to process. SwitchToThread() cannot be used if you need to specify\
    \ a minimum sleep time — use Sleep() or SleepEx, instead.\n\n```\nBOOL SwitchToThread(VOID);\n\
    ```\n\n```\nVOID ExitThread(DWORD dwExitCode);\n```"
