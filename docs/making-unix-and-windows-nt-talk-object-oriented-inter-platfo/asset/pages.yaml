  md: '# 148 Chapter 3: NT Building Blocks


    Creating Services are the equivalent of UNIX daemon processes. They run in the
    background of the NT machine, regardless of whether a user is logged in or not.
    See Section 3.7 for classes that encapsulate NT services.


    All classes in this chapter use Win32 system calls and are specific to Windows
    NT. They are not readily portable to non-Windows operating system.


    The examples used in each section are built upon C++ classes — presented here
    — are used in our forthcoming second volume for more sophisticated systems. They
    hide much of the complexity of Win32, and at the same time, enable the user to
    program whatever level of complexity may be required.


    # 3.2 NT File System


    At first glance, the organization of NT''s file system is the same as the MS-DOS
    file system — directories and all files on a disk designated by a drive letter.
    For example, c:\windows\system32\mfcs32.dll, where c: represents the disk drive,
    directory names winnt and system2 are separated by backslashes (\), and the filename
    (which includes a period and a three-letter extension) follows the last slash.
    In fact, NTFS supports three types of file systems. NT File System, or NTFS, is
    NT''s native file system. File Allocation Table (FAT) is DOS''s legacy file system.
    Protected Mode FAT (VFAT) supports long filenames and is readable by older MS-DOS
    systems. All basically the same naming conventions. NTFS and FAT allow mixed-case
    letters, spaces, and names for directories. FAT allows only eight alphanumeric
    characters and a three-character extension.


    Drives on other machines on the network are accessible via UNC (Universal Naming
    Convention). For example, \\hagan\cdrive\chapter3.txt, where the volume drive
    published on the machine has the directory containing a file chapter3.txt. Using
    Windows Explorer, you can map a UNC machine and volume to a drive on your PC.


    Although a file or directory on NTFS may appear the same as a file or directory
    on FAT, there are additional NTFS features available to the programmer or systems
    administrator. These features include file ownership and security attributes similar
    to, but more complex than those found in UNIX. For this reason, all of the examples
    presented in this chapter were run on NTFS. All will work on the other file systems,
    except that the NTFS attributes will not be available.


    With UNIX, there can be several types of NT files. These files are used for storing
    data, communicating with peripheral devices, and intermediating process communication.
    All file types are described in Table 3.1.


    # Table 3.1 NT File Types


    | File Type | Description |

    | --- | --- |

    | Data Storage File | Contains zero or more bytes of ASCII or binary data |

    | Mailsort | One-way FIFO for one or more applications to send data to one application
    on a network |

    | Directory | Contains the names and definitions of other file |'
