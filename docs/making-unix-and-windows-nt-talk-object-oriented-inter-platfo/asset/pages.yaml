  md: "# Example 5.2 Synchronous Socket Accepts\n\n```\n// Two instances of TCPcpSocket\
    \ are created one binding to PORT_NUM1\n// and the other to PORT_NUM2.\nXPcpSocket\
    \ tcpSocket1(PORT_NUM1);\nXPcpSocket tcpSocket2(PORT_NUM2);\n\n// The two sockets\
    \ are bound to their socket port number and address\ntcpSocket1.vBindSocket();\n\
    tcpSocket2.vBindSocket();\n\n// The two sockets listen for incoming connections.\n\
    tcpSocket1.vListen();\ntcpSocket2.vListen();\n\n// Loop forever accepting connections\
    \ from the two sockets\nwhile(1) {\n    // Suspend process executing until a client\
    \ connects.\n    XPcpSocket newSocket1 = tcpSocket1.Accept(iSocket1);\n\n    //\
    \ Suspend process execution until a client connects.\n    XPcpSocket newSocket2\
    \ = tcpSocket2.Accept(iSocket2);\n    ..\n}\n```\n\nThe previous code segment\
    \ is very reasonable. Two sockets are created, bound, and setup to listen for\
    \ incoming connections. When the loop is executed with each socket accept connections,\
    \ a problem occurs. If attempts are made to connect to tcpSocket2, these connections\
    \ are blocked until a connection is made with tcpSocket1. Likewise, tcpSocket1\
    \ connects, tcpSocket2 blocks additional connection attempts on tcpSocket1.\n\
    To this problem, the concept of asynchronous socket communication is introduced.\
    \ In this example, tcpSocket1 and tcpSocket2 accept connections in the order in\
    \ which they are executed. In asynchronous communication, the order of command\
    \ execution is no longer the rule. Instead, the order in which clients connect\
    \ dictates which socket, tcpSocket1 or tcpSocket2, accepts connections. To accomplish\
    \ asynchronous communication, the select() system call is introduced. The architecture\
    \ for asynchronous multiple socket file descriptors is shown in Figure 5.10."
