  md: '# UDP vs. TCP Sockets 303


    If it is important for the client and server to continue running regardless of
    whether the messages are received, the UDP protocol should be used. This situation
    might occur if the applications are sending system properties to a logging server.
    It is important for the applications to continue running to log all informational
    messages.


    +   - If the order of messages sent to the server by the client is important,
    the TCP protocol should be used. Message order would be important for applications
    keeping track of positions within a stock portfolio. If messages are not received
    in the correct order, a stock trader might think he or she is long on a stock
    position when, in fact, the position is short if all the buys come before the
    sells. The UDP protocol should be used if message ordering is not important.


    +   - Are there many peers require messages sent to them?


    Under certain conditions, there may be many client applications running on various
    machines in the network. When a server sends a message, the message must reach
    all of them. Such a client-server set up in which all clients require the information
    sent by the server is a price publishing for an investment bank. It is important
    that all client applications used by the stock traders are updated with the most
    current price published so that the traders know the value of their portfolio.


    In the case of one server sending data to multiple clients, the developer has
    two choices. If the server and network resources are sparse (low memory, small
    CPU, etc.) or development time is an issue, UDP broadcasting is a good choice
    (Seeing Using UDP Socket on page 292 for more information on socket properties).
    UDP broadcasting allows the server to send a message over a vast array of IP addresses.
    All clients listening for messages receive them. UDP is also a good choice if
    speed is important. UDP transmissions occur more quickly than TCP because UDP
    has less overhead. For applications such as audio-video or IP telephony transmissions,
    UDP is a good choice because it is quick and the loss of some data packets is
    acceptable. The upside to using the UDP protocol is that the overhead to send
    messages is very small, message transmissions are quick, and the development time
    is short. The downside is that communication is not guaranteed.


    The alternative for sending messages to multiple clients is via TCP communication.
    TCP communication requires that all clients be connected to the server. The connection
    guarantees that all clients receive messages sent from the server. The fact that
    overhead is required to maintain client-server connections over the network, managing
    the connections, and dealing with client disconnects. A design issue also arises.
    A mechanism must be in place that can send a message to all clients at the same
    time. This increases the complexity of the server.


    In conclusion, UDP sockets transmitting broadcast messages should be used if the
    system and network resources are sparse, development time is an issue, and guaranteed
    message delivery is not a priority. On the other hand, TCP sockets should be used
    if message delivery is critical to system performance. Beware that more care must
    be taken at design and development time to ensure server robustness.'
