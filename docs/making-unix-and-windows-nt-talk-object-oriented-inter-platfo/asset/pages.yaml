  md: '# 136 Chapter 2: UNIX Building Blocks


    Protecting the Daemon from Signals Sent to Its Process Group A Spawned process
    inherits its process ID from its parent process. Belonging to a process group
    can be dangerous for a daemon it would intercept signals to all processes within
    a particular process. The daemon must disassociate itself from its process group
    to prevent the receipt of unwanted signals. To disassociate, the daemon sets its
    process group ID equal to its ID, making it the leader of a new process.


    The system call setpgid() makes a process the leader of a new group. No arguments
    are required. setpgid() returns the value of the new process ID.


    ```

    setpgid(void);

    ```


    setpgid() has the additional benefit of dissociating the process from its inherited
    terminal, if it is not already the process group leader. Signals sent to a controlling
    terminal are sent to all processes that are members. Therefore, the process must
    dissociate itself from that controlling terminal. A problem arises if the process
    is already a group leader. Spawning the daemon with fork() does not dissociate
    the process from the controlling terminal. Because all forked processes have a
    parent, the new child process is a member of the parent''s process group. A subsequent
    call to setpgid() within the new child process guarantees that the process dissociates
    from its controlling terminal.


    Closing Unnecessary File Descriptors When a process is spawned, it inherits its
    parent''s open file descriptors. These file descriptors can be manipulated and
    inadvertently affect the daemon process. File descriptors are closed with the
    close() system call. close() takes a file descriptor as its argument and returns
    0 for success or -1 for failure. The maximum number of open file descriptors is
    defined by the macro NOFILE located in the sys/param.h header file.


    ```

    int close(int file_descriptor)

    ```


    Protecting the Daemon Process Creates Since the daemon can open all file descriptors
    and cannot use standard output or standard error to send output. Therefore, it
    must create its own files for logging errors or setting output values. If the
    daemon cannot access files it creates, errors could result leading to the daemon''s
    termination. If another process were to access the file and remove or change the
    file''s permissions, the daemon would be vulnerable. The umask() system call is
    used to create files that no other process than the daemon can manipulate.


    ```

    umask(int cmask);

    ```


    umask() changes the process''s file creation mask to the mask specified by cmask.
    The file creation mask can be set to the permission constants defined in Section
    2.2 (see Table 2.4 on page 26). By using 0 for cmask, files created by the daemon
    cannot be manipulated by any process other than the daemon.


