  md: '# 432 Chapter 5: Sockets — The Cross-Platform Communication Building Blocks


    Although CAsynSocket contains many of the features contained within CPUdupSocket
    and XPtcpSocket, it lacks others. The features missing include automatic socket
    file descriptor to address bind, exception handling for errors, ease of socket
    option manipulation, host name IP address resolution, and others. Only the CAsynSocket
    methods that are used in conjunction with CPUdupSocket and XPtcpSocket are discussed.


    The constructor of CAsynSocket takes no arguments. When a class inherits from
    CAsynSocket, it is constructed when the parent class is constructed. One CAsynSocket
    method that is useful for debugging socket-related problems is GetLastError().
    GetLastError is used to retrieve the specific error code that caused a CAsynSocket
    method to fail.


    ```

    static int GetLastError();

    ```


    Because CPUdupSocket and XPtcpSocket are used in conjunction with CAsynSocket,
    a method to associate the socket file descriptor created with CAsynSocket is needed
    to ensure that CAsynSocket''s virtual event methods are called when socket communication
    occurs. Attach() is used to associate a socket file descriptor to CAsynSocket.
    Attach() returns TRUE on success; FALSE on failure.


    ```

    BOOL Attach(HSocket, long lEvent = FD_READ | FD_WRITE | FD_0OB | FD_ACCEPT | FD_CONNECT
    | FD_CLOSE);

    ```


    Attach() completes two tasks. It takes a socket file descriptor, hSocket, and
    stores it in the m_hSocket (<variable name> is MFC''s naming convention for object
    data members) data member of CAsynSocket. The m_hSocket contains the socket file
    descriptor used by CAsynSocket for all socket communication, as well as socket
    event handling. By replacing the m_hSocket data member with the supplied socket
    file descriptor, socket events associated with the socket file descriptor can
    be handled asynchronously with regards to other Window events.


    Attach() also associates event callbacks with the supplied socket file descriptor.
    By default, all events are associated with the socket file descriptor. Depending
    on the goal of the socket communicating application, it might be more desirable
    to associate only those events that are needed by the socket file descriptor.
    The events that can be associated with a socket are described in Table 5.23.


    # Table 5.23 Attach Event Definitions


    | Event Definition | Virtual Function Notified |

    | FD_READ | OnReceive() virtual function is notified upon the arrival of data
    on the socket (TCP and UDP sockets). |

    | FD_WRITE | OnSend() is notified when the socket buffer is available for sending
    data (TCP and UDP socket). |

    | FD_0OB | OnOutOfBandData() is notified upon the arrival of out-of-band data
    (TCP and UDP socket). |'
