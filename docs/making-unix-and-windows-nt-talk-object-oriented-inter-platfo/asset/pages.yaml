    The third parameter, lpThreadAttributes is a pointer to a SECURITY_ATTRIBUTES
    structure. With other Win32 calls that create or open objects, the security structure
    includes a bheritable member that indicates whether the handling result can be
    inherited by a child process. It also includes the Security Descriptor, which
    includes Access Control Lists that determine whether of other processes can access
    this object. For processes, entries in an Access Control List allow or deny specific
    users to access your process via the OpenProcess() Win32 call, described in later.
    Generally, the Security Descriptor can be left null and the child process will
    have the same Descriptor as the parent process.


    The fourth parameter, lpThreadAttributes is also a pointer to a SECURITY_ATTRIBUTES
    structure, but this one is used for the primary thread of the child process. bInheritHandles
    indicates whether the inheritable handles in the parent process can be inherited
    by the child process. When set to true, all objects that you wish the child process
    to have created or opened with the object''s bheritable flag set to true, as well.


    dwCreationFlags is a bitmap combining one or more of the attributes listed in
    Table 3.7, logically ORed together.


    # ### Table 3.7 Process Creation Flags


    | Value | Meaning |

    | --- | --- |

    | CREATE_DEFAULT_ERROR_MODE | The child process not inherit the error mode of
    the parent process, rather CreateProcess() gives the new process the current default
    error mode. |

    | CREATE_NEW_CONSOLE | The child process is given a new console instead of inheriting
    the parent''s console. This flag cannot be used with the DETACHED_PROCESS flag.
    |

    | CREATE_NEW_PROCESS_GROUP | The child process is the root of a new process group.
