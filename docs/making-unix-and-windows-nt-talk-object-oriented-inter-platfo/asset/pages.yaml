  md: '# TCP/IP and the OSI Model


    The OSI model, presented in Chapter 1, describes the layers in a network. Figure
    4.1 shows TCP/IP fits into the OSI model.


    # Figure 4.1 TCP/IP within the OSI Model


    ![](img/5c85d865d33d2c2c3c815331ae6c6f4a_270_0.png)


    **The Physical Layer** The physical layer is comprised of the hardware interface
    that is used for communication. This hardware interface can be a UNIX workstation,
    or any other piece of hardware that can communicate using TCP/IP protocols.


    **The Data-Link Layer** The data-link layer is the physical connections that network
    the hardware together. This physical connection can be Ethernet, Token Ring LAN
    connections, phone line WAN connections, or satellite links.'
