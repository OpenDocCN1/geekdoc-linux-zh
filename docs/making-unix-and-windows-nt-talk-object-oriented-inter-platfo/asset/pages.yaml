  md: "sets the event, which informs the former that the shared resource is available.\
    \ (See Figure 3.1.)\n\n# Figure 3.1 Event Overview\n\n![](img/5c85d865d33d2c2c3c815331ae6c6f4a_182_0.png)\n\
    \nLike a file object, events have security attributes. Using a security attributes\
    \ structure, you can specify which users or groups can open an event your program\
    \ created. The C++ class presented in this section is a general-purpose event\
    \ creation and monitoring class.\n\n# Event Creation and Manipulation\n\nAn event\
    \ is created by calling the Win32 call, CreateEvent(), prototyped here.\n\n```\n\
    HANDLE CreateEvent(LPSECURITY_ATTRIBUTES lpSecurityAttributes,\n    BOOL bManualReset,\n\
    \    BOOL bInitialState,\n    LPCTSTR lpName )\n```\n\nCreateEvent() returns a\
    \ handle to the event object if it succeeds and zero otherwise. GetLastError will\
    \ then return the error code if CreateEvent() fails."
