  md: "# Defining the UDP Sockets Class\n\nThe XPCocket can be inherited by more specialized\
    \ socket classes. One of these specialized socket classes is XUDPSocket defines\
    \ a socket object that is built using the UDP protocols. This class also defines\
    \ methods for sending and receiving data. The constructor for this class calls\
    \ the constructor of XPCocket to create a datagram socket (SOCK_DGRAM) using UDP\
    \ protocols. Notice that all data members of XPCocket are protected. By inheriting\
    \ XPCocket, the protected data members become private to XUDPSocket. Thus, methods\
    \ of XUDPSocket can take advantage of the members of XPCocket. Of course, XUDPSocket\
    \ also has access to all public member functions of XPCocket as well. The XUDPSocket\
    \ contains the following features:\n\n+   * Creating and opening a UDP socket\n\
    * Sending data to a specified address and port\n* Binding to a specified address\
    \ and port and receiving data\n* Closing the UDP socket\n\nThe XUDPSocket is defined\
    \ in Listing 5.18. Operating system specific code is enclosed within #ifdef ...\
    \ #endif code.\n\n# Listing 5.18 The XUDPSocket Definition\n\n```\n#include <XPCocket.h>\
    \ // The definition for XPCocket\n\nclass XUDPSocket : public XPCocket\n{\npublic:\n\
    \    // The Constructor. Takes a socket communication port number as a parameter.\n\
    \    // This parameter, along with the specification of the UDP protocol, are\
    \ sent to\n    // the constructor of XPCocket to create the socket file descriptor.\n\
    \    XUDPpsocket(int _iPort) : XPCocket(\"udp\", _iPort) {\n\n    // The iSendReply\
    \ method is used to send a message to the address and port of\n    // an application\
    \ that most recently sent a message captured by the iReceiveMessage\n// method.\
    \ This method returns the total number of bytes sent.\n    int iSendReply(void\
    \ *_Message, int iMsgLen);\n\n    // The iSendMessage method sends a message to\
    \ a specified host name or ASCII IP\n// address using a user specified port. If\
    \ the port number is 0, the port\n    // number used to construct the XUDPdpSocket\
    \ is used. This method returns the\n// total number of bytes sent.\n    int iSendMessage(void\
    \ *_Message, int &iMsgLen, char *_sSendToHost, int _iPort = 0);\n```"
