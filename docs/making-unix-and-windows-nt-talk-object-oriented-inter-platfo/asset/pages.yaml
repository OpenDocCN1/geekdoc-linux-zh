    ```\n\nNT provides the means for one process to spawn and control the attributes\
    \ of a second process. This capability has numerous applications in cross-platform\
    \ communication, specifically controlling the order that processes startup. The\
    \ XPCProcess and XPCProcessAttribute classes encapsulate Win32 process functions\
    \ and provide a concise and easy to use object for creating and manipulating NT\
    \ processes.\n\n# 3.7 Creating NT Services\n\nThe NT equivalent of UNIX processes\
    \ is services. Service processes run in the background of any NT machine — workstation\
    \ or server. Services often have no user interface, usually only idle priority\
    \ class, and whenever NT is running regardless of a user being logged-on. Services\
    \ are used for various user-independent tasks, such as directory duplication and\
    \ publishing, and web-server publishing. A list of all services running on your\
    \ PC is provided in the Services applet of the Control Panel on the NT desktop."
