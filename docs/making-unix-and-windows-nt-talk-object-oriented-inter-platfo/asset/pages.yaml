    Receiving Data on the TCP Socket

    As UDP sockets, TCP sockets can receive messages using the recvfrom() system call.
    The difference in message recvfrom() with connection-oriented instead of connectionless
    sockets is message boundaries are ignored. Connectionless sockets discard bytes
    that won''t fit in the buffer, whereas connection-oriented sockets return the
    data as soon as it is available, regardless of message size. Although recvfrom()
    returns the address of the application that sent the message, this is not necessary
    for TCP sockets. accept() traps this information.

    A new system call, recv(), can be used with TCP sockets. The recv() system call
    is similar to recvfrom(), except that recv() does not store the sending application''s
    address. Like recvfrom(), recv() can be used with UDP sockets, but data sent that
    does not fit in the target'
