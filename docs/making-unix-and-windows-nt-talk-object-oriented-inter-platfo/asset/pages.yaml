    \ amount of time (in seconds) that the operating system can take before close()\
    \ returns. If the amount of time specified is 0, any remaining data is discarded\
    \ when the socket is closed. The linger structure is passed to setsockopt() to\
    \ set the linger option (encapsulated within the vSetLinger() method) and getsockopt()\
    \ to retrieve the current linger values (encapsulated within the vGetLinger()\
    \ method). Both methods, vSetLinger() and vGetLinger() are shown in List 5.17.\
