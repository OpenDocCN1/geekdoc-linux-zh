    # Table 5.25 Redefined Virtual Functions of XPCAsyncTcpSocket


    | XPCAsyncTcpSocket Redefined Virtual Function | AppClassPtr Method Called |

    |--- | --- |

    | OnAttach() | vProcessAttach() |

    | OnConnect() | vProcessConnect() |

    | OnClose() | vProcessClose() |

    | OnSend() | vProcessSend() |


    When a client connects to its server using the overridden `vConnect()` method,
    `OnConnect()` is called. If the connection is successful, `vProcessConnect()`
    is called and returns a pointer to the address of the client. If the connection
    fails, a NULL pointer is passed.


    After a server application executes the inherited `vlisten()` method, the socket
    is able to accept connections from client applications. When a client connects,
    `OnAttach()` is called. `OnAttach()` executes the inherited `vAttach()` method
    and returns a new file descriptor dedicated for client communication. Because
    the client is now connected, the original `XPCAsyncTcpSocket` class cannot be
    used for client communication because it still contains the original file descriptor.
    Therefore, a new instance of `XPCAsyncTcpSocket` must be created. This new instance
    does not bind the socket because the application has already bound its original
    socket and uses that for accepting additional client connections. Next, the new
    socket descriptor is attached to the new instance of `CAsyncSocket` with the `FD_READ`,
    `FD_WRITE`, and `FD_CLOSE` flags. Each instance of `XPCAsyncTcpSocket` is responsible
    for communicating with its connected client. Because the socket messages are being
    handled asynchronously, there is no need to thread the next TCP socket interactions.
    When a client successfully connects, `vProcessAttach()` is passed the address
    and port of the connecting client.


    The `OnClose()` virtual function is called when a connected client detaches from
    the server. `OnClose()` deletes the current instance of `XPCAsyncTcpSocket` from
    the heap because it is no longer needed. `vProcessClose()` is called for application-handling
    of socket disconnects.


    Socket-related errors are caught within the windows asynchronous callback threads.
    Instead of throwing an exception from `OnReceive()`, `OnConnect()`, `OnClose()`,
    `OnAccept()`, or `OnSend()` or letting the exception bubble up to the calling
    procedure, the exceptions are caught within the asynchronous methods and sent
    to the `vProcessError()` method of the defining class. This enables the class
    to process errors as the developer sees fit.


    Because `XPcpSocket` is inherited, the application developer can call its methods.
    The only method from `XPcpSocket` that is not re-used is `vConnect()`. `vConnect()`
    calls the socket system call which blocks execution until the server accepts the
    connection. Blocking of execution within a Windows application is not desirable
    as the user would lose access to the user-interface until `vConnect()` returned.
    In fact, if you attempt to the `connect()` system call within Windows application
    connection returns an error code of `WSAWODBLOCK`. This error indicates that `connect()`
    is a blocking operation. This error is more of a warning than an actual failure
    during execution due to the fact that `CAsyncSocket`'
