  md: '# Table 3.9 Service Access Values


    | Access Type | Description |

    | --- | --- |

    | SERVICE_ALL_ACCESS | All access rights. |

    | SERVICE_CHANGE_CONFIG | Allows ChangeServiceConfig() to change the service configuration.
    |

    | SERVICE_ENUMERATE_DEPENDENTS | Allows EnumDependentServices() to enumerate all
    services dependent on this service. |

    | SERVICE_INTERROGATE | Allows ControlService() to ask the service to report its
    status. |

    | SERVICE_PAUSE_CONTINUE | Allows ControlService() to pause or continue the service.
    |

    | SERVICE_QUERY_CONFIG | Enables QueryServiceConfig() to query the service configuration.
    |

    | SERVICE_QUERY_STATUS | Allows calling QueryServiceStatus() to ask the service
    manager about the status of the service. |

    | SERVICE_START | Allows calling StartService() to start the service. |

    | SERVICE_STOP | Allows calling ControlService() to stop the service. |

    | SERVICE_USER_DEFINED_CONTROL | Allows calling ControlService() to specify a
    user-defined control code. |

    | GENERIC_READ | Combines the following access types: STANDARD_RIGHT_READ, SERVICE_QUERY_CONFIG,
    SERVICE_QUERY_STATUS, and SERVICE_ENUMERATE_DEPENDENTS. |

    | GENERIC_WRITE | Combines the following access types: STANDARD_RIGHT_WRITE and
    SERVICE_CHANGE_CONFIG. |

    | GENERIC_EXECUTE | Combines the following access types: STANDARD_RIGHT_EXECUTE,
    SERVICE_START, SERVICE_STOP, SERVICE_PAUSE_CONTINUE, SERVICE_INTERROGATE, and
    SERVICE_USER_DEFINED_CONTROL. |


    dwType is the type of service required. It can be one of the values listed in
    Table 3.10.


    # Table 3.10 Service Type Constants


    | Value | Meaning |

    | --- | --- |

    | SERVICE_WIN32_OWN_PROCESS | A Win32-based service that runs in its own process.
    |

    | SERVICE_WIN32_SHARE_PROCESS | A Win32-based service that shares a process with
    other services. |

    | SERVICE_KERNEL_DRIVER | A dernel driver service. |'
