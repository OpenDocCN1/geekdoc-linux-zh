  md: '# 150 Chapter 3: NT Building Blocks


    handles file objects created by Win32 calls are inheritable to threads and processes
    that a process may spawn. This is not the case with low-level I/O calls.

    Most Win32 calls return zero if the function failed and nonzero otherwise. An
    error can be obtained by calling GetLastError() and an error message can be derived
    from the error code by calling FormatMessage().


    # XPCFileStat for NT


    The implementation of the XPCFileStat class for NT appears to be similar to the
    UNIX version presented in the previous chapter. The user of the class can obtain
    the same information about any pathname, including the following.


    +   * Determine whether a pathname is valid.

    * Determine whether the pathname is a file or directory.

    * Determine the size of the file.

    * Retrieve the permission attributes of the file or directory.

    * Retrieve the date that the pathname was created, last modified, and last accessed.

    * Determine the access rights the user has to the pathname.


    Although the class has the same features as its UNIX counterpart, the NT version
    is substantially different because it uses all Win32 calls instead of low-level
    I/O calls. The first of these Win32 calls are GetCurrentDirectory() and GetFileAttributesEx().


    # GetCurrentDirectory() Win32 Call


    GetCurrentDirectory() returns the pathname of the current working directory. This
    is usually the directory in which the program resides or the directory from which
    it starts.

    int GetCurrentDirectory(int nSize, char *FileName);


    The nSize parameter is the number of bytes in the output buffer. The cFileName
    parameter is a pointer to the output buffer. If the function succeeds, it returns
    the number of bytes written to the output buffer; if it fails, it returns zero.
    If cFileName is too small to hold the pathname, the size is returned. With two
    calls to GetCurrentDirectory(), you can determine the size of buffer needed for
    the first call, allocate a buffer, and call GetDirectory() a second time to get
    the directory. This technique is commonly used by Win32 programmers when a buffer
    size is not known at compile time.


    # GetFileAttributesEx() Win32 Call


    GetFileAttributesEx() returns all of the static information known about a file,
    including its attributes, creation time, last access time, last write time, and
    size. This information is returned in a structure called WIN32_FILE_ATTRIBUTE_DATA.
    The structures members are listed in Table 3.3.'
