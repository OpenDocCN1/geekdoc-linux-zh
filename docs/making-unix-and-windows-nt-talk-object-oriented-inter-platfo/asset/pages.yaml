  md: '# 334 Chapter 5: Sockets — The Cross-Platform Communication Building Blocks


    | Name | Values | Protocols Supported | Description |

    | --- | --- | --- | --- |

    | SO_ACCEPTCONN | 0 — False 1 — True | TCP | This option can be used only with
    getockopt() and is used to indicate whether the socket is enabled. |

    | SO_ERROR | Stores an integer value of the current error number stored | UDP
    or TCP | This option can be used only with getockopt() and is used to retrieve
    the last error related to the file descriptor. The error variable is cleared by
    the operating system after this call. |

    | SO_TYPE | SOCK_STREAM or SOCK_DGRAM | UDP or TCP | This option can be used only
    with getockopt() and is used to return the socket type |


    One additional socket option can be useful. This toggles the socket''s ability
    to block execution when sending or receiving messages, or accepting connections.
    By default, the system calls for sending and receiving socket information blocks
    process execution. The receiving application blocks until there is enough room
    on the socket descriptor for describing messages. A process blocks when it is
    waiting to accept client connections. This type of blocking with TCP sockets is
    sometimes useful to return immediately from the system call and not block if the
    socket conditions are not met immediately. The toggling of the blocking status
    of socket system calls is accomplished using ioctl() in UNIX and ioctl() in Windows.


    ```

    int ioctl(int socketfd, int request, char *args);

    int ioctl(int socketfd, int request, unsigned long *args);

    ```


    The socketfd parameter specifies the file descriptor being affected. The request
    argument takes a value FNBIO. FNBIO, defined in the winsock2.h header file in
    Windows NT sets or clears the nonblocking I/O flag for the socket file descriptor.
    The final parameter, args, is used to toggle the blocking functionality of the
    file descriptor. If the args parameter contains a value of 0, blocking is turned
    off. A value of 1 returns blocking back on.


    # The XPCSocket Class Definition


    The XPCSocket is the base class on which all other sockets are built. This class
    contains the ability to open and close a socket, as well as the ability to customize
    the socket before it is bound to a specific address or connected to another socket.
    Once the socket is connected, socket options can be set, but have no effect on
    the socket. Therefore, it makes sense to contain the creation and manipulation
    of a file descriptor in one class. The class is defined in Listing 5.14. Operating
    system specific code is encapsulated within a #ifdef ... #nendif code blocks.'
