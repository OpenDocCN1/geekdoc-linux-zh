    communicate, a new complexity arises. Multiple processes cannot interfere with
    one another and, therefore, they cannot easily share an address space for fear
    of memory corruption. Interprocess Communication (IPC) occurs when processes agree
    to the means of communication, and the operating system provides the facilities
    for communication. Processes using IPC can communicate'
