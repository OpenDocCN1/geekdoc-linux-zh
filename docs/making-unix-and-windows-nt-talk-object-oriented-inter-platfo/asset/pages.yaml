    # 1.3 The Traditional Client-Server Model


    The standard model for applications that communicate over a network is the client-server
    model. The server is an application that waits for a client application to contact
    it. When contact is made, the server does something for the client. The typical
    client-server model is as follows.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# The Cross-Platform Client-Server Model 9


    +   - The server is started on one system. After it initializes, it waits for
    client processes to connect and request a service.

    - The client is started on the same system as the server or on another system
    that is connected to the same network as the server. A user starts the client.
    When the client initializes, it connects to the server process and requests a
    service.

    - When the server process is contacted, it provides its service to the client
    and waits for the next client request to be issued.

    There are two types of servers that can be constructed: iterative servers and
    concurrent servers. An iterative server is a server that processes client requests
    within a single thread of execution. Additional client requests are not processed
    until the current request is complete. If the amount of time required to process
    a client''s request is significant or unknown, concurrent servers are used. Concurrent
    servers are those that invoke another process to handle the client''s request.
    The original server process is free to wait for additional requests without being
    monopolized by the current request. Examples of concurrent servers include web
    servers which are responsible for handling multiple client requests at once.


    # 1.4 The Cross-Platform Client-Server Model


    The traditional client-server model is a universal process communication model
    that can be used for interplatform communication. The interplatform client-server
    model is a more specialized client-server model. In the interplatform model, processes
    are known to exist on either Windows NT or UNIX platforms. Both clients and servers
    can exist on either of the operating systems. Today, most network configurations
    are comprised of homogeneous operating systems. This makes process communication
    easier because differences in operating systems are not taken into account when
    designing a networking system. The homogeneous client-server model is shown in
    Figure 1.3.


    # Figure 1.3 The Homogeneous Client-Server Model


