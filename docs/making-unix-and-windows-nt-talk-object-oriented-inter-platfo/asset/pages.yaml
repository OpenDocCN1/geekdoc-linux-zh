  md: "# Chapter 3: NT Building Blocks\n\n```\n// clean up and we're done\ndelete\
    \ event;\nreturn: 0;\n```\n\nThe producer opens the Win, modifies the file, sets\
    \ the event, and exits.\nChangeEvent encapsulates Win32 event functions, which\
    \ provide a means for one process to signal another that event has occurred. This\
    \ functionality is important for distinct processes to notify one another of specific\
    \ events. XPEvent can be used to call a user-defined callback function that will\
    \ be executed after the event has occurred.\n\n# 3.4 NT Semaphores\n\nThe Win32\
    \ API for NT provides a collection of semaphore functions that enable the application\
    \ developer to control access to shared resources between two or more processes.\
    \ A semaphore in NT provides the same capabilities as in UNIX — it can be locked\
    \ and unlocked to protect a shared resource. A thread or process can create a\
    \ semaphore, either named or unnamed, with an initial count greater than or equal\
    \ to zero. The semaphore is locked when its count is equal to zero and unlocked\
    \ or signaled when its count is greater than zero. The count can be increased\
    \ with a call to a release function and decreased with a lock. The primary differences\
    \ between NT semaphore and a UNIX semaphore are the calls to create and manipulate\
    \ it. As file system calls, NT has Win32 calls for semaphores that are specific\
    \ to only NT.\n\nA semaphore can be created and locked by one process to indicate\
    \ that it needs exclusive access to a shared resource, such as a file. When a\
    \ second process opens the semaphore, it will be locked — indicating the resource\
    \ is unavailable — until the first process unlocks the semaphore indicating the\
    \ resource is available. This sequence of waiting for a lock, locking, and unlocking\
    \ of a semaphore by the two processes protects the shared resource from being\
    \ accessed by both processes at the same time.\n\n# Programming Semaphores in\
    \ NT\n\nWith most Win32 calls, a handle to a semaphore is used to manipulate the\
    \ semaphore. A handle to the semaphore is returned when the semaphore is opened.\
    \ The first Win32 call specific to semaphores is CreateSemaphore(), prototype\
    \ here.\n\n```\nHANDLE CreateSemaphore(LPSECURITY_ATTRIBUTES lpSecurityAttributes,\n\
    \                               LONG lInitialCount,\n                        \
    \       LONG MaximumCount,\n                               LPCTSTR lpName);\n\
    ```\n\nCreateSemaphore() returns a handle to the semaphore object if it succeeds\
    \ and zero otherwise. GetLastError will then return an error code if CreateSemaphore()\
    \ fails.\\lpSecurityAttributes is a pointer to the semaphore attribute structure.\
    \ You can leave this parameter null if you will not be creating child processes\
    \ that need to inherit this semaphore handle. Otherwise, it is used to allow or\
    \ deny access to your semaphore from owners of other processes."
