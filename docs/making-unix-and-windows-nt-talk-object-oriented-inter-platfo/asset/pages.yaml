    physical layer is reached. The physical layer performs the actual message transmission
    to the receiving machine.

    Upon receipt of the message, the receiving machine strips off the message''s headers
    and translates the message back to its original form during each propagation the
    seven OSI layers. This is done until the message arrives at the receiving process.
    Figure 1.2 shows an example of how a message is transmitted using the OSI model.


