  md: '# Spawning Processes 121


    additional processes from being created. To prevent the creation of zombie processes,
    the parent can process the child exit signal, SIGCHILD. Even though the child
    is not turned into a zombie, the return status of the child process is lost. The
    SIGCHILD signal is ignored by default and, therefore, most programs do not ever
    process this signal. If the program explicitly sets a signal handler to ignore
    the signal, zombie processes can be avoided.


    When the parent process exits before its children, the parent process ID of the
    child is no longer valid. UNIX resolves the invalidity of the parent process ID
    by locating all children processes, zombie active, and resets the parent process
    ID to 1. The process ID of 1 is reserved for the init process. The init process
    is the first process to run on a UNIX system in multi-user mode and the init process
    never dies. The init process is responsible for allowing terminal access to user''s
    logging on to the system. The child process is never aware that its parent has
    exited, except that its parent process ID is set to 1.


    There are several different system calls that allow the parent to wait for the
    child. These system calls are defined in the sys/wait.h header file. waitpid()
    is the system call used for retrieving child status. There are other "wait" system
    calls, but waitpid() encapsulates all of their functionality.


    ```

    waitpid(int pid, int *stat_loc, int options);

    ```


    waitpid() suspends the calling process until its child changes execution status.
    The change in execution status can be any of the four statuses previously discussed.
    waitpid() waits for a process specified by the pid parameter. pid can be any of
    the values shown in Table 2.23.


    # Table 2.23 Values of the pid Parameter


    | pid Value | Description |

    | --- | --- |

    | -1 | Status is returned for any child process |

    | Greater than 0 | Status is returned for any child process whose group ID is
    equal to the calling process |

    | Less than -1 | Status is returned for any child process whose group ID is equal
    to the absolute value of pid. |


    The status of the child is returned to the location pointed to by the stat_loc
    parameter. If waitpid() is tracking process IDs of children who have already exited,
    waitpid() immediately returns. The return status can be examined using macros
    defined in Table 2.24. These macros take the value, not the address, of stat_loc
    as their parameter.


    # Table 2.24 Child Status Evaluation Macros


    | Macro | Definition |

    | --- | --- |

    | WIFEXITED(stat_loc) | Evaluates to a nonzero value for a normally terminated
    child. |

    | WEXITSTATUS(stat_loc) | If WEXITED returns a nonzero value, WEXITSTATUS returns
    the exit code of the child. |'
