    dwControlsAccepted is the type of control that the service currently accepts.
    By default, all services accept SERVICE_CONTROL_INTERROGATE. Other values for
    this parameter are listed in Table 3.15.


    # Table 3.15 Accepted Control Constants


    | Value | Description |

    | SERVICE_ACCEPT_STOP | The service can be stopped.

    | SERVICE_ACCEPT_PAUSE_CONTINUE | The service can be paused or continued.

    | SERVICE_ACCEPT_SHUTDOWN | The service can be shutdown. |


    dwCode specifies the error code when the service fails to startup or shutdown.
    This field should be set to NO_ERROR all other times.

    dCheckpoint is a value that the service uses to indicate that it has completed
    a step in a lengthy startup or processing operation. This value is passed back
    to the user-interface program to track the progress of the operation. This value
    is not used for any status other than start, stop, or continue operations.

    dWaitHint is the amount of time the service estimates a start, stopping, or pending
    operation will take, in milliseconds, before it makes the next call to the SetServiceStatus()
    function. If this time expires, the SCM can assume that an error has occurred.


