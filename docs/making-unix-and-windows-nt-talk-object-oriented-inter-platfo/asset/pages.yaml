    signal mask and scheduling parameters are saved via well. Setting the savemask
    parameter to a non-zero number is used to prevent the signal mask of the process
    from being lost when jumping to a different location in the program. When sigjmp()
    is called the first time, it returns 1 if savemask is non-zero, 0 if savemask
    is 0. On the second call to sigsetjmp() via a longjmp(), the return value is the
    value of the val parameter of longjmp(). If the val parameter is 0, sigsetjmp()
    returns 1.


    The longjmp() call restores the program environment corresponding to the env parameter
    saved by the initial call to sigsetjmp(). The second parameter is a value equal
    to the signal that the signal handler had to handle. Upon returning to the environment
    saved by sigsetjmp(), all global and static variables have the same values at
    the time of the longjmp() call. The values of local variables are undefined and,
    therefore, must be considered volatile.


    # Holding, Releasing, and Waiting for a Signal


    There are instances during program execution, as the processing of critical events,
    with interruption being due to signal handling. The prevention of handling a signal
    during program execution is referred to as “holding” the signal. Signals sent
    during the “hold” period are processed as the signal is “released.” The system
    call used for holding a signal is sighold(). To release a signal held by sighold(),
    the sigreleast() system call is used.


    ```

    int sigjmp(int sig);

    sighold(int sig);

    ```


    Theold() call takes one argument — the block (Table 2.7). Ifold() is successful,
    it returns a 0; otherwise, it returns a -1. The sigrelease() system call takes
    the same argument as sighold() and returns the same values. If multiple signals
    are blocked and subsequently released, sighold() and sigreleast() need to be called
    once for each signal.


    It might also be desirable to suspend a program’s thread and wait for the signal
    to be received. This method can be used on the event of a signal being sent (See
    Section 2.5, “Threading Applications in a UNIX Environment” on page 88, for more
    information on threads.). Execution runs when the awaited signal is received.
    The system call used to wait for a signal to be sent is sigpause().


    ```

    int sigpause(int sig);

    ```


    The sigpause() system call takes one argument — the awaited signal (Table 2.7)
    — returns a 0 upon success; otherwise, -1. When sigpause() is called, the signal
    for sigpause() is waiting to block the signal from being lost before pause() has
    the chance to wait for it. Once the signal is received, the signal blocking is
    released and the program continues execution. The unblocking of the signal by
    sigpause() is important in preventing a signal being missed between the pause
    and release of the signal. If the argument to sigpause() is 0, any signal sent
    to the process unblocks sigpause().


