  md: "# NT Threads 197\n\nThe following functions set and retrieve the thread's priority\
    \ and all take the thread's han-dle as the first parameter.\n\n```\n```cpp-plus\n\
    int GetThreadPriority (HANDLE hThread);\n\nBOOL SetThreadPriority (HANDLE hThread,\n\
    \    int nPriority);\n\nBOOL SetThreadPriorityBoost (HANDLE hThread,\n    BOOL\
    \ DisablePriorityBoost);\n\nBOOL GetThreadPriorityBoost (HANDLE hThread,\n   \
    \ BOOL pDisablePriorityBoost);\n\nSetThreadPriority() can take the values shown\
    \ in Table 3.6.\n```\n```\n\n# ### Table 3.6 Thread Priority Values\n\n| Priority\
    \ | Meaning |\n| --- | --- |\n| THREAD_PRIORITY_ABOVE_NORMAL | One point above\
    \ normal priority for the priority class. |\n| THREAD_PRIORITY_BELOW_NORMAL |\
    \ One point below normal priority for the priority class. |\n| THREAD_PRIORITY_HIGHEST\
    \ | Two points above normal priority for the priority class. |\n| THREAD_PRIORITY_IDLE\
    \ | A base priority level of one for IDLE_PRIORITY_CLASS, NORMAL_PRIORITY_CLASS,\
    \ or HIGH_PRIORITY_CLASS processes, and a base priority level of sixteen for REALTIME_PRIORITY_CLASS\
    \ processes. |\n| THREAD_PRIORITY_LOWEST | Two points below normal priority for\
    \ the priority class. |\n| THREAD_PRIORITY_NORMAL | Indicates normal priority\
    \ for the priority class. |\n| THREAD_PRIORITY_TIME_CRITICAL | A base priority\
    \ level of fifteen for IDLE_PRIORITY_CLASS, NORMAL_PRIORITY_CLASS, or HIGH_PRIORITY_CLASS\
    \ processes, and a base priority level of thirty for REALTIME_PRIORITY_CLASS processes.\
    \ |\n\nPriority classes are set at the process level. Priorities are adjusted\
    \ above and below the process' class with these values. Generally, THREAD_PRIORITY_NORMAL\
    \ is a good starting point and can be adjusted once the program is running and\
    \ needs fine-tuning. GetThreadPriority() returns the value set in SetThreadPriority()."
