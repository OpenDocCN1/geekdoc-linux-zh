  md: '# IPv6 addresses three problems with IPv4 An Introduction to TCP/IP 267


    +   1. IPv4 has a limited IP address space (32-bits in length).

    2. Many IPv4 operations are inefficient and are not used due to their overhead.

    3. Since IPv4 was introduced (late 1970s-early 1980s), a lot has been learned
    about data networks.


    The major design philosophy behind IPv6 is to increase the number of IP addresses
    allowed, to make the protocol simpler, and to make the protocol more efficient
    in its operations. Due to the expansion of the types of data being transmitted
    over the Internet, IPv6 has been decided to be complementary to other related
    protocols. These protocols support for voice, video, and other data traffic on
    the Internet.


    The IP address space for IPv6 is increased from 32-bits to 128-bits. 128-bits
    allows for a very large address space. The value of 128-bits was chosen to accommodate
    the long-term growth estimates of the Internet. The committee designing IPv6 used
    a series of criteria for predicting the growth of the Internet. These criteria
    included a combination of estimated population growth up to the number of Internet
    connections each person might be using. The number derived was a population of
    10 billion people with each person having up to 100 Internet connections. Since
    more and more devices are connecting to the Internet, such as automobiles, 100
    Internet connections per person is conceivable. The conclusion reached is that
    $^{128}$ Internet addresses are more than enough to accommodate future growth.


    The convention for writing IPv6 addresses is four-bit integers with each integer
    represented by each of the eight-part IPv6 address is clustered as a 16-bit integer,
    or four hexadecimal digits, separated by a colon. An example of an IPv6 IP address
    is shown in Figure 4.5.


    # Figure 4.5 Example IPv6 Address


    ```

    6391:F748:B279:5B31:3039:EC13:861D:D903

    ```


    At first, not all 128-bits will be used. Substituting 0s for address parts ignores
    the components that are not needed. A further shortening of the IP address is
    to substitute a double colon (::) for all address parts not needed. The IP address
    6391::EC13:861D:D903 translates to 6391:0:0:0:EC13:861D:D903. Only one double
    colon can be included in the IP address at a time.


    The IPv6 sepcification includes a backward compatibility format for IPv4 addresses.
    By including a double colon in front of the IPv4 address, the address can be routed
