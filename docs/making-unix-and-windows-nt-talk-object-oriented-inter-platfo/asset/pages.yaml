  md: '# 384 Chapter 5: Sockets — The Cross-Platform Communication Building Blocks


    +   1. An instance of XPcpSocket is created.


    +   2. The vbindSocket() method is called to bind to the socket port and address.


    +   3. The vlisten() method is called to listen and buffer connecting clients.


    +   4. The vaccept() method is called to retrieve client connections from the
    listen buffer and accept client connections.


    +   5. A new process is spawned dedicated client communication.


    Once the client connection is accepted, a new socket file descriptor is created
    via vaccept(). A new process is spawned and the new socket file descriptor is
    passed to it. The UNIX version of a TCP socket server forks a child process that
    is a duplicate of the parent. This spawned process can either be a new application
    that handles client communication or a call to a procedure within the original
    server process. (Recall that a forked process is actually a duplicate of the original.)
    If the spawned process is a procedure in the server process and not a new application,
    the address of the new XPcpSocket instance containing the new socket file descriptor
    must be passed on the command-line. The socket file descriptor can be passed directly
    to it. If the spawned process is a new application, the new socket file descriptor
    must be passed instead because C++ objects cannot be passed as application arguments.
    The Windows NT operating system does not have the feature of forking processes;
    instead, new processes can be spawned. Regardless of the operating system, the
    original TCP socket server loops and waits to accept additional client connections.
    This TCP server architecture using the XPcpSocket is illustrated in Figure 5.8.'
