    # System Call


    # Operating Systems


    # Description


    ```

    int gethostname(char *name, int namelen);

    ```


    WinNT and UNIX


    Returns the standard host name for the current processor in the name parameter
    with a length no greater than that specified by the namelen parameter. 0 is returned
    upon success and -1 is returned upon failure. The specific error can be retrieved
    via the WSAGetLastError() function call in Windows NT and via the errno global
    variable in UNIX.


    ```

    struct hostent *gethostbyaddr(char *addr, int len, int type);

    ```


    WinNT and UNIX


    Returns a pointer to a host structure based on an IP address lookup. The address
    must be of type in_addr. Because Internet addresses are being used, type must
    be AF_INET. The len parameter is the size of the internet address.


    ```

    struct hostent *gethostent(void);

    ```


    UNIX


    Returns a pointer to the next entry in the host database, opening the database
    if necessary.


    ```

    void sethostent(int stayopen);

    ```


    UNIX


    Opens the host database. If stayopen is nonzero the host database remains open
    during subsequent calls to gethostent().


    ```

    void endhostent();

    ```


    UNIX


    Closes the host database.


    To retrieve the host name using gethostbyaddr(), the IP address used must be of
    type in_addr. Fortunately, if the IP address is only available as an ASCII style
    address (Internet standard dot notation), system calls are provided that convert
    the ASCII style IP address into in_addr types. Likewise, system calls are provided
    that convert in_addr to ASCII style IP addresses. These system calls are located
    within the arpa/inet.h include file in the UNIX operating system and winsock2.h
    include file in the Windows NT operating system.'
