    # Pipes


    Pipes are a method of interprocess communication in which one process writes to
    its standard output and the other process reads from its standard input. Multiple
    pipe connections can be established between the two processes so that both processes
    can transmit and receive data using their standard input and output file descriptors.
    Pipes provide a convenient method to developers for establishing process-to-process
    communication.


    # Shared Memory


    Shared memory is a means by which two processes communicate with one another by
    storing and retrieving data from a location known by both processes. One process
    writes into shared memory and the other process extracts the data from shared
    memory. Shared memory is used like a First In, First Out (FIFO) queue. The advantage
    of using shared memory, as opposed to directly sending the data to the peer process,
    is that the processes write and read from shared memory independently of one another.
    In fact, the process extracting data from shared memory does not need to be running
    to allow the process writing to execute, and vice versa.


    # File Transfer Protocol (FTP)


    FTP is a well-known service that exists on both Windows NT and UNIX operating
    systems. FTP is a utility that allows users to transfer files from one system
    to another. The utility has many features. Some of the more important features
    include the following.


