    # Spawning a New Program with exec()


    To spawn a new program, the calling process must issue a form of the exec() system
    call. exec() overlays a new process image on top of an old process. The new process
    image is generated from an existing executable program. The process ID of the
    program does not differ from the process that called exec(). As shown in Figure
    2.12, the newly spawned program contains the same process ID and parent process
    ID as the original process. exec() does not create a new process, but spawns a
    new program that exists in context of the calling process. The program inherits
    the following attributes of the original processes when spawned using exec().


    +   * Scheduler class and priority

    * Process ID

    * Parent process ID

    * Process group ID

    * Time left until alarm

    * Current working directory

    * Root directory

    * File mode creation mask

    * Resource limits

    * File locks

    * Open file descriptors

    * Controlling terminal

    * Process signal mask

    * Pending signals'
