    \ The XPCsemaphore class encapsulates the NT Win32 semaphore functionality in\
    \ an object that includes all methods needed to manipulate the semaphore.\n\n\
    # 3.5 NT Threads\n\nA process is started with a single primary thread — the main\
    \ thread — and create additional threads as needed. All threads of a process address\
    \ space and other resources. By sharing resources, threads can be created quickly,\
    \ perform a task, and exit quickly — substantially quieter if they were separate\
    \ processes. Each thread maintains its own priority and set of structures that\
    \ NT uses to save the thread's context it is scheduled.\n\nNT is a preemptive\
    \ multitasking operating system. This enables simultaneous execution of multiple\
    \ threads from one or more processes. On a computer with more than one processor,\
    \ NT can execute as many threads as there are processors, all at the same time.\\\
    \ Sharing resources between threads has drawbacks. These drawbacks are the bugs\
    \ that are inadvertently when one thread is reading and writing to the same resource.\
    \ If one thread runs two threads independently, the bug may not appear until the\
    \ program has been running for several hundred hours in a production environment.\
    \ These kinds of bugs are referred to as race conditions. The XPCsemaphore and\
    \ XPCevent classes listed in the sections can be used to synchronize threads so\
    \ that race conditions do not occur. If improperly used, semaphores and events\
    \ can create other programming bugs such as deadlocks. Deadlocks occur when two\
    \ threads have locked themselves out of a shared resource. Neither thread can\
    \ access the resource because the other has locked it, perhaps in error. Judicious\
    \ use of the XPCsemaphore and XPCevent classes enables you to take advantage of\
    \ threads while avoiding deadlock and race pitfalls.\n\n# Programming Win32 Threads\n\
    \nAn thread is created with the Win32 call, CreateThread(), and terminated when\
    \ that thread calls ExitThread(). A thread can be terminated by another thread\
    \ with a call to TerminateThread(). TerminateThread() does not allow the thread\
    \ to clean up some of its"
