    # Broadcasting IP Datagrams


    Depending on the software implementation of TCP/IP protocols, broadcasting of
    IP datagram may be permitted. By encoding each the network field or host field
    bytes by a value of 11111111 binary, or 255 decimal, broadcast transmission can
    be used. With a broadcast transmission, an IP datagram can be transmitted to all
    networks and hosts on the network. For example, if a class B IP address class
    is used and the destination address is specified as 129.5.255.255, all hosts on
    network129.5 receives the message.


    The network or host field bytes can also be encoded with 0. A network address
    with a value of 0 indicates the message is sent to “this network.” A host address
    with a value of 0 indicates the message is sent to “this host.” Setting all 0s
    for the network address is useful if the host wishes to send the messages to all
    hosts within the network and does not know its IP address. All hosts receiving
    the message interpret the destination address as “this network.”


    # The Subnet Address


    The subnet address is a subdivision of available hosts addresses on subnets of
    the main network. Any Internet address class can be subdivided to provide space
    in the host address for a subnet and host ID. The host ID is a host that exists
    within the specified subnet address. Having subnets allows for further division
    with a network. An IP packet routed to a network with subnets goes through the
    following steps.


    +   1. The network ID is extracted from the IP datagram to route to the correct
    network.

    2. The network extracts the subnet ID from the IP datagram to route it to the
    correct subnet.

    3. The subnetwork extracts the host ID from the IP datagram and routes it to the
    correct host.


    The subnet address allows for more flexibility within the network. If there are
    200 hosts within a network, the network router has to know the location of all
    200 hosts. If any are added or removed, the network router must be informed of
    each change. To alleviate some management of the network router, some high-order
    bits of the host address space can be allocated for subnet addresses. The network
    route that sends messages to the subnet'
