    # The Scope Attribute: The Difference between User and Kernel Threads


    User-level threads run on top of the operating system. The kernel has no knowledge
    of these threads and these threads are managed and controlled by the calling process.
    The user-level threads exist in a package that redefines system calls that block.
    Since the process controls the threads, a system call that caused the process
    to block would inadvertently affect the threads. Blocking by another thread defeats
    the parallel processing benefit of threads. To overcome the problem of the blocking
    system calls, the user-level thread package provides new forms of the system calls
    that are nonblocking. Figure 2.8 illustrates the operation of a blocking system
    call for a user-level thread.


    Figure 2.8 User-Level Thread Processing


    ![](img/5c85d865d33d2c2c3c815331ae6c6f4a_101_0.png)


    The advantage of user-level threads is that they have very low overhead. The disadvantage
    is that they allow the thread handling system, not the operating system, to take
    control of switching execution from one thread to another. A more serious disadvantage
    is that user-level threads can share only the CPU used by the originating process.
