  md: '# # Chapter 3


    # # NT Building Blocks


    # ## 3.1 Chapter Overview


    This chapter describes the NT building blocks used for developing cross-platform
    communication applications. These building blocks are grouped into fundamental
    topics of the NT operating system.


    **The NT File System** Used for storing information in files and organizing files
    within directories. Provides access security to files and directories. See Section
    3.2 for classes that encapsulate file system parameters.


    **Event Signaling** Used for sending events to the same process or from one process
