    \ a Producer-Consumer Model Using Named Semaphores\n\nIn this classic scientific\
    \ model, the producer creates data and places a common area, such as a file. When\
    \ data is available, the consumer retrieves it and processes it. If no data is\
    \ available, the consumer waits for it to appear. The consumer can poll the producer's\
    \ data source for information and extract it when it is available. Polling for\
    \ data, however, is inefficient and CPU-intensive. If there are long delays before\
    \ data is available, the consumer wastes CPU time waiting for it. A solution might\
    \ be for the consumer to sleep for periods of time during each iteration of the\
    \ polling loop. This solution may not be timely enough. Therefore, the goal of\
    \ an effective consumer is the following method.\n\n+   - Process producer data\
    \ in an efficient non-CPU intensive method.\n- Process producer data in a timely\
    \ manner.\n\nUsing named semaphores is one way of producing an efficient producer-consumer\
