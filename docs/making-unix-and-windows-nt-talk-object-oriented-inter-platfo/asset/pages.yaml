    \n# Asynchronous File Processing Example\n\nThis example uses the XPCFileStat\
    \ class presented in the last section and XPCEvent here. The problem is a file\
    \ that needs to be processed by one program (the consumer) after it is modified\
    \ by another program (the producer). When the consumer starts up, it could use\
    \ an instance of XPCFileStat to determine the last write time of the file and\
    \ periodically check the last write time of the file to see if it has changed.\
    \ When the file is modified, the consumer then processes the file. As with the\
    \ UNIX example, this can be done by polling, albeit inefficiently. It also be\
    \ done by sleeping for a few seconds and waking up to check again. This solution\
    \ is less CPU-intensive, but does not allow the program to do any other processing\
    \ while it is waiting. A better solution would be to use XPCEvent to call a callback\
    \ method in the consumer to tell us when the file is available. Both programs\
    \ open an XPCEvent with the same name. The producer processes the file and sends\
    \ an event to the XPCEvent object. The consumer opens the event with a callback\
    \ and does whatever processing it needs to do while waiting for the event. When\
    \ the event occurs, the callback is called and the file is processed. This source\
    \ code for the consumer is shown in Listing 3.14."
