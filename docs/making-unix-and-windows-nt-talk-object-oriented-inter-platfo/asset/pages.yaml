  md: '# Threading Applications in a UNIX Environment


    A thread is created using a system call that spawns a separate state of execution
    within the program. The life span of a thread begins with a successful return
    from the system call that creates it. The thread ceases to exist when one of the
    following conditions occurs.


    +   - Normal completion of the thread is achieved.

    - The thread is explicitly exited using a thread-specific exit system call.

    - The parent of the thread is terminated.


    Threads allow a program to perform multiple tasks in parallel instead of serially.
    If only do threads run in parallel, they run in their own execution stack. Therefore,
    if one thread is blocking, the other threads are unaffected. If the process is
    not multithreaded, a blocking system call suspends process execution. Threads
    are very efficient to create, using a fraction of the CPU power required to create
    additional processes and are spawned more quickly than processes.


    Programming threads has challenges. Because threads run simultaneously and access
    global data, two threads could access the same memory address at the same time.
    If one thread reads the global variable and the other thread writes to the global
    data, an access error could occur. The threads need to be synchronized somehow,
    such as by using semaphores. The XPCemaphore object discussed in Section 2.4 will
    be great help in the task of protecting global data from multiple thread access.


    # # POSIX Threads


    POSIX threads, like POSIX semaphores, are portable among all systems that support
    POSIX. Although there are only UNIX thread packages available, the benefits of
    standardization and portability are too important to ignore.


    POSIX threads provide dynamic creation and destruction of threads. The exact number
    of threads a process contains does not need to be known until runtime. POSIX threads
    use attributes to detail the properties of the thread. Because the attributes
    are treated as one object, threads can inherit the same attribute object. If an
    attribute within the attribute object changes, all threads use that object change.


    # # POSIX Thread Attributes


    The POSIX standard allows the programmer to control attributes of spawned threads.
    These attributes are stored in a structure of type pthread_attr_t defined in the
    pthread.h file. Members of pthread_attr_t can be retrieved and set using a number
    of POSIX thread system calls. All attribute calls return 0 if they are successful.
    If an error occurs, a nonzero value is returned to the appropriate error.


    # # Initializing and Destroying Thread Attributes


    Before thread attributes can be retrieved and manipulated, an instance of pthread_attr_t
    must be initialized. This initialization is done using the pthread_attr_init()
    system call.


    ```

    int pthread_attr_init(pthread_attr_t *attr)

    ```


    The pthread_attr_init() function takes the address of a pthread_attr_t instance
    and returns the thread''s default attributes. The attribute defaults are displayed
    in Table 2.10.'
