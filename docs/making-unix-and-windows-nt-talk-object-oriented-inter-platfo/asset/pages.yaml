    # IPv6 Vs. IPv4 Datagrams


    The IPv6 specification made many changes to the IPv4 datagram. These changes are
    summarized as follows:


    +   * The version value is changed from 4 to 6.

    * The IPv4 Header Length field is removed.

    * The IPv4 Total Length field is replaced by the IPv6 Payload Length field. The
    Length field defines only the length of the data and not the header.

    * The IPv4 Type of Service field is eliminated and part of its functionality is
    replaced by the IPv6 Priority and Flow Label fields.

    * The Identification, Flags, and Fragement Offset fields from IPv4 are eliminated.
    Similar functions are included in optional IPv6 header extensions.

    * The IPv4 Protocol field is removed and replaced by another IPv6 extension header.

    * The IPv4 Time to Live is renamed to the Hop Limit Field.

    * The Header Checksum Field of IPv4 is eliminated. The vast majority of communication
    systems perform error checks at lower ISO network layers.

    * The IPv4 Options field is not used much and is awkward to implement. It has
    been removed in IPv6 and replaced with header extensions.'
