  md: '# 5.11 Conclusion


    Using UDP and TCP socket communication enables messages of all sizes that all
    types of data to be sent from one process to another. The basic architecture for
    creating UDP and TCP clients and servers are the same for UNIX and Windows NT.
    Before establishing socket communication, some basic information must be known.
    This information includes knowing the protocol be used, resolving the IP address
    of the host on which communication is running, and the socket port number of well-known
    services. Accessing protocol information is encapsulated within the XPCGetProtocol
    class. Resolving host to socket port information for well-known services is encapsulated
    within the XPGetService class.


    Before creating a socket system, the way in which the sockets are used should
    be established. The default behavior of sockets can be adjusted using methods
    encapsulated within XPSocket. XPSocket provides methods for adjusting many socket
    attributes. Some of these attributes include the following.


    +   * The size of the socket buffer for sending and receiving

    * The handling of pending data when the socket disconnects

    * Socket blocking or nonblocking


    Creating UDP and TCP communication protocols is encapsulated within the UDPSocket
    and TCPSocket respectively. Both classes inherit from XPSocket and can be used
    to create client-server applications on both UNIX and Windows NT. Using XPSocket
    can receive and send data from multiple clients because communication is not connection-oriented.
    UDP clients and servers have no knowledge of each other and, for, information
    can be received from any process communicating on a given socket port. Servers
    integrating TCPSocket are directly connected to their clients. To communicate
    with multiple clients at the same time, one of two methods can be used. The first
    method involves spawning a thread dedicated to communicating with each client.
    The second method involves creating multiple socket objects, each communicating
    on a different port. The select() system call provides a method for asynchronously
    selecting the TCPSocket object that the client used to connect. Combining the
    select() system call and multithreading enables multiple clients to communicate
    with the multiple socket processes.


    When integrating socket communication within Windows NT GUI applications, it is
    important not to interfere with the user''s access to the GUI controls. Under
    normal circumstances, receiving socket data blocks process execution, and the
    user loses access to the GUI controls. Two methods can be used to gain control
    of the GUI while still maintaining socket communication. The first method is multithreading
    socket data retrieval. While this is a workable solution, it adds complexity to
    the GUI process. If multiple threads are used, shared data must be protected using
    semaphores to prevent data corruption. The other method for integrating socket
    communication within a GUI application is using asynchronous sockets. Microsoft
    provides C++ libraries for integrating sockets into the Windows event queue. When
    socket events occur, such as connecting to hosts and receiving data, the message
    is queued within the main thread for manipulation of the user interface without
    affecting the user''s ability to gain access to the interface and without the
    complexity of multithreading and semaphores. The XPCAsyncUDPSocket and XPCAsyncTCPSocket
    classes inherit from UDPSocket and TCPSocket, respectively, and encapsulate the
    features of Windows asynchronous sockets.'
