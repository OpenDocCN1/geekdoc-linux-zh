  md: '# Catching a Signal


    There are two system calls used for catching signals, signal() and sigset(). Not
    only can these system calls catch signals, they can modify the handling of signals
    by the process.


    ```

    void *signal(int sig, void (*disp)(int))(*int);

    void *sigset(int sig, void (*disp)(int))(*int);

    ```


    Both system calls take two arguments, a signal value (see Table 2.7) and a function
    pointer to a user-defined global function. The function acts as a signal handler
    and is called by the operating system to do specific processing when the process
    receives the signal specified by sig. The value of the second argument can also
    be one of the predefined signal handlers, SIG_IGN or SIG_DFL. SIG_IGN tells the
    calling process to ignore the signal and SIG_DFL tells the calling process to
    perform the default action associated with a signal.


    If a signal handler is used and a signal is caught by the handler, execution is
    transferred to the handler. When the signal handler is complete, program execution
    continues at the point before the signal was caught. The difference between signal()
    and sigset() system calls becomes apparent when signal() sets its handler to SIG_DFL
    right before the user-specified signal handler is called so that the next time
    the signal is caught, the default action associated with the signal is taken.
    The signal() system call would need to be called each time the signal is received
    to prevent the default handler from being called. However, this prevention is
    not guaranteed. If the signal is reset before the signal() system call is re-executed,
    the signal action would take place.


    The sigset() system allevi this problem. The user-defined signal handler remains
    installed after a signal is processed when sigset() is used. There is no need
    to redefine the signal handler after the signal is caught, and there is no chance
    the signal handler would not be called. Because of this persistence, sigset()
    is used in the signal class introduced later in this section.


    # Changing Program Flow Due to Signal Processing


    By default, program execution returns to the next execution point after a signal
    being caught and processed by a signal handler. You can change this behavior.
    When a signal handler completes execution, it can "jump" to a predetermined location
    within the program. For example, if a program is blocking execution, alarm() can
    be used to send the SIGALRM signal after a predetermined number of seconds if
    the blocking persists. The signal handler for the SIGALRM signal would return
    to a point outside of the offending code so that program execution can continue.


    There are two system calls, sigsetjmp() and siglongjmp(), that together accomplish
    the task of jumping to a specified location in the program.


    ```

    int sigsetjmp(sig_jmp_buf env, int savemask);

    void siglongjmp(sig_jmp_buf env, int val);

    ```


    A program calls sigsetjmp() to set the return point after the signal handler has
    completed. The siglongjmp() call jumps to that position within the signal handler.
    The sigsetjmp() call saves the current process''s registers and stack environment
    and stores them in the env parameter. If the savemask parameter is non-zero, the
    process''s'
