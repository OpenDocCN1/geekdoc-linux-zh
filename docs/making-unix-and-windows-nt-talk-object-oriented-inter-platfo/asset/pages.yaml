    # Achieving Address Resolution


    Each device attached to a Local Area Network (LAN) is identified by a physical
    hardware address. Most physical addresses are assigned by the manufacturer to
    the Network Interface Card (NIC) chipped. LAN addresses can also be assigned when
    the NIC device is installed on the LAN. A problem occurs when relating the physical
    address on the LAN to a network TCP/IP address and vice versa. The problem is
    twofold.


    +   1. If the address of a host is known, how does the IP layer determine the
    address that corresponds to that host?

    2. When a new machine to the network initializes, it usually discovers its LAN
    address at startup during device configuration. It must also get its Internet
    address so it can communicate with other hosts. How is a new host informed of
    its Internet address?

    The problem is resolved using the Address Resolution Protocol (ARP). The ARP allows
    a host on the LAN to broadcast a special packet asking each host with a specified
    Internet address to respond with its LAN address. Each host on the LAN receives
    the message, but only the specified host responds. Can store the Internet address
    to LAN mapping for future communications.

    The second problem is resolved using the Reverse Address Resolution Protocol (RARP).
    One or more machines on the LAN are used as RARP servers. The RARP servers maintain
    a mapping between the Internet address and the LAN address for each workstation
    on the network. By storing the mappings in a central location, it frees up the
    individual workstation from being issued an Internet address before it is configured.
    When the workstation is initialized, it obtains its Internet address by broadcasting
    a RARP message throughout the network. The RARP message contains the workstation''s
    LAN address and asks for its corresponding Internet address. Each host on the
    network receives the RARP message, but only the RARP server responds.


    # Introduction to IPv6


    The Internet Protocol version 6 (IPv6) is the newest addition to the family of
    network protocols. The IP protocol discussed up this point has been Internet Protocol
    version 4 (IPv4). Because of the rapid expansion of hosts on the Internet, Internet
    addresses have been running out. IPv6 has been introduced to solve the shortcomings
    of IPv4 and allow for more Internet addresses.'
