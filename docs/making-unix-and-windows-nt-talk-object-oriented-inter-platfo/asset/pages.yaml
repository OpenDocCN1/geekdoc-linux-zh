    The first bits of the address specify the format type. The remainder of the address
    specifies the network address and the host address. The host address is also referred
    to as the local address or the HOST field.


    Class A addresses are used for networks that have a large number of hosts. The
    host ID field is 24 bits in length. Therefore, $2^{24}$ hosts can be identified
    for each network. There are 7 bits allocated for network IDs. This means that
    there can be up to 127 networks in the specified Internet.


    Class B addresses are used for networks that require an intermediate number of
    hosts and a large number of networks. In this configuration, 16 bits are assigned
    for host IDs and 14 bits are assigned for network IDs.


    Class C addresses allow for the maximum number of network IDs (21 bits) and the
    fewest host IDs (only 8 bits, or 256 hosts per network).


    Class D addresses are used for multicasting, which is a form of broadcasting within
    a limited area. Class D addresses are not covered in this book.


    The range of IP addresses that specify each Internet class is displayed in Table
    4.1.


    # Table 4.1 Class Identifying Network Values


    | TCP/IP Class | Network Address Values |

    |---|---|

    | Class A | 0–127 (0 and 127 are reserved) |

    | Class B | 128–191 |

    | Class C | 192–223 |

    | Class D | 224–254 |


    The Internet address is written as four decimal numbers, each separated by a decimal
    point. Each decimal digit encodes one of the 32-bit Internet address. An Internet
    address specified as 1.5.10.1 is a Class A Internet address that has a network
    ID of 1 and a host ID of 5.10.1. An example of a Class B address is 128.3.19.1,
    where 128 is the network ID and 19.1 is the host ID within the network. A Class
    C Internet address of 192.3.2.200 specifies a network ID of 192.3.2 and a host
    ID of 200. Finally, a Class D Internet address of 230.191.2.3 specifies a multicast
    group located on one or more physical networks. Table 4.2 displays the four IP
    class formats using dot notation.


    # Table 4.2 IP Address Dot Formats


    | TCP/IP Class | IP Address Format |

    |---|---|

    | Class A | Network_ID.Host_ID.Host_ID.Host_ID |

    | Class B | Network_ID.Network_ID.Host_ID.Host_ID |

    | Class C | Network_ID.Network_ID.Network_ID.Host_ID |

    | Class D | Not applicable (multicast group) |


