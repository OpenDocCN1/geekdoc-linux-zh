  md: "# NT Semaphores 183\n\nInitialCount is the initial count of the semaphore (i.e.,\
    \ the number of locks allowed before the semaphore is locked-out). MaximumCount\
    \ is the maximum number of locks that can be placed on the semaphore. InitialCount\
    \ must be less than or equal to MaximumCount and MaximumCount must be greater\
    \ than zero. To protect a shared resource, InitialCount and MaximumCount would\
    \ typically be set to 1. These parameters are ignored if you are trying to open\
    \ an existing semaphore, because the process that created it already set them.\n\
    \nlpName is the name of the semaphore. It is a null-terminated string that can\
    \ be up to MAX_PATH characters in length and can contain any character except\
    \ a backslash. If lpName matches an existing semaphore in the system, CreateSemaphore()\
    \ requests SEM_ACCESS (see Table 3.5) and returns the semaphore's handle. To open\
    \ an existing semaphore with restricted access rights, OpenSemaphore() is used.\
    \ If lpName matches an existing event, mutex, or file, CreateSemaphore() generates\
    \ an error.\n\nNamed semaphores are used when two processes need access to the\
    \ same semaphore. One process creates the semaphore with a name and the second\
    \ process opens it with the same name. Unnamed semaphores are typically used when\
    \ threads of the same process share a semaphore. One thread creates the semaphore\
    \ and passes a handle to the opened semaphore. To create an unnamed semaphore,\
    \ set lpName to NULL.\n\n# Opening a Semaphore\n\nCreateSemaphore() can be used\
    \ to open an existing semaphore, but OpenSemaphore() gives more control over access\
    \ rights.\n\n```\nHANDLE OpenSemaphore(DWORD dwDesiredAccess,\n              \
    \  BOOL bInheritHandle,\n                LPCTSTR lpName);\n```\n\ndwDesiredAccess\
    \ can have the following values.\n\n# Table 3.5 Semaphore Access Values\n\n| Access\
    \ | Description |\n|---|---|\n| SEMAPHORE_ALL_ACCESS | Enables all access functions\
    \ for the semaphore object. |\n| SEMAPHORE_MODIFY_STATE | Enables use of the semaphore\
    \ in ReleaseSemaphore() to modify the semaphore's count. |\n| SYNCHRONIZE | Enables\
    \ use of the semaphore in any of the wait functions to wait for the semaphore's\
    \ state to be signaled. (See WaitForSingleObject() in the following text.) |\n\
    \nbInheritHandle indicates whether the handle is inheritable by a process spawned\
    \ by the calling process. lpName is the name of the semaphore. It cannot be null\
    \ and has the same naming restrictions as the name parameter in CreateSemaphore()."
