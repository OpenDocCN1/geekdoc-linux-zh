  md: '# Table 2.9 oflag Values


    | flag Value | Description |

    |---|---|

    | O_CREAT | If the semaphore exists, sem_open() returns the address of the semaphore
    if it is accessible. In this case, the third and fourth parameters of sem_open()
    are ignored. If the semaphore does not exist, it is created and the address of
    the new semaphore is returned. |

    | O_CREAT | O_EXCL | The O_CREAT and O_EXCL flags, logically ORed together, for
    semaphore creation only. If the semaphore does not exist, a new one is created
    and its address is returned. If it exists, sem_open() returns -1. |


    If a new semaphore is created, the mode and value parameters of sem_open() are
    required. The values of mode are the same as permissions for a pathname. Table
    2.4 can be logically ORed together to create the appropriate semaphore permissions.
    Permissions to access the semaphore are specified for all processes with the same
    effective user ID, effective group ID, or to all other users. Careful consideration
    should be given when restricting semaphore to use processes with the same effective
    user or group IDs. Processes with different user or group IDs try to access the
    semaphore, sem_open() fails.


    The final parameter of sem_open() is the initial value of the semaphore. This
    value cannot be greater than SEM_VALUE_MAX. When the semaphore is locked, its
    value is decremented by 1. When the semaphore reaches 0, no additional semaphores
    may be locked. When the semaphore is unlocked, the value of the semaphore is increased
    by 1.


    # Generic Semaphore Operations


    Once a semaphore has been created, it can be used within a program. POSIX provides
    several system calls to lock, release, and remove named and unnamed semaphores.
    An additional system call retrieves the current value of the semaphore.


    The sem_wait() attempts to lock a semaphore that has a value of 0, it blocks until
    the value is greater than 0. When sem_wait() locks the semaphore, its value is
    decremented by 1. The sem_wait() prototype is shown in the following code fragment.
    -1 is returned if the system call is not successful and 0 is returned if the semaphore
    is successfully locked. A signal of type SIGINT interrupts the sem_wait() and
    causes a -1 to be returned.


    ```

    int sem_wait(sem_t *sem);

    ```


    Another way to lock - If the semaphore cannot be locked (it has a value of 0),
    sem_trywait() immediately returns -1 and sets the global errno to EAGAIN. If the
    semaphore can be locked, sem_trywait() decrements the semaphore by 1 and returns
    a 0, indicating success.


    ```

    int sem_trywait(sem_t *sem);

    ```


    The sem_post() releases (unlocks) the semaphore and increments the semaphore''s
    value by 1. If multiple processes are waiting to unlock the semaphore, the highest
    priority process releases its semaphore first. If multiple processes of the same
    priority are waiting to'
