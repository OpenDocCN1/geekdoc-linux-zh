  md: '# 466 Appendix A: The Sample Code and Files on CD-ROM


    makefile <project name>. To build the UNIX project, execute the following command
    at the command line:


    ```

    make -f <makefile name>

    ```


    All code related to a particular chapter and section is located directly within
    that chapter and section. One of the goals of this book is to present each chapter
    and section as a building block for the next chapter and section. Therefore, in
    later chapters and sections uses header and object files from applications in
    previous chapters and sections. To make things more convenient when compiling
    the Windows NT applications, commonly used header and object files are moved to
    their related chapter or section directory to avoid having to specify a particular
    project.


    # A.1 Compiling and Executing the Example Applications


    When placing the example code on a local machine, the directory structure must
    stay intact for the compiles to be successful. All UNIX projects contain a Makefile.
    The Makefile references header files, compiles source code, and links in object
    code based on a directory relative to the one specified by the ROOT_DIR environment
    variable. Therefore, the first step in compiling the UNIX applications is to set
    the ROOT_DIR environment variable to the top-level directory where the UNIX code
    is located. If the UNIX code was placed in the /home/book directory, then ROOT_DIR
    would need to be set to /home/book.


    The Windows NT projects contain workspace files denoted by <project name>.dsw.
    To open a project in Visual C+, File – Open Workspace from the menu and select
    the project. Compiling the application is simply a matter of choosing Build –
    Build from the main menu. Needed header and object files from previous chapters
    and sections are included within the project''s setting specifications. The header
    and object files are linked relative to the current project. Therefore it is important
    that the local directory structure remains the same as the one on the CD-ROM.


    Before executing the example applications, it is important that both the UNIX
    and Windows NT workstations are connected on the same network and each can be
    accessed by the other. When executing systems that have both a client and a server
    application, the server application must always be executed first unless the client
    automatically spawns its server.'
