  md: '# 1.2 The OSI Model


    Most network communication is built using part or all of the International Standards
    Organization (ISO) open systems interconnect (OSI) model. The OSI model uses the
    concept of layering. The OSI model is divided into different sections or layers,
    each addressing a specific need for communication purposes. Well-defined interfaces
    are provided between the layers. The OSI model uses seven layers with the following
    concepts applied to the development of the layers.


    +   * Each layer contains a different level of abstraction.

    * Each layer performs a well-defined function.

    * The information transmitted across each layer is minimal.

    * The layers do not overlap in functionality.


    Figure 1.1 displays the seven-layer model.


    # Figure 1.1 The OSI Seven-Layer Model


    | Application | 7 |

    |---||

    | Presentation | 6 |

    | Session | 5 |

    | Transport | 4 |

    | Network | 3 |

    | Data Link | 2 |

    | Physical | 1 |'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# 6 Chapter 1: Introduction


    # The Physical Layer


    The physical layer is concerned with sending raw bits over a communication medium.
    Design issues include ensuring a bit as 1 is received as a 1, and not as a 0.
    Design issues are mostly mechanical and electrical, including the following:


    +   - the number of volts used to represent a 1 and 0,

    - the number of microseconds a bit lasts,

    - the ability to transmit simultaneously in both directions at once,

    - the method by which the initial connection is established and released, and

    - the number of pins used for the network connector and the use of each pin.


    # The Data Link Layer


    The data link layer takes transmission from the physical layer and transforms
    it into a line that appears free of errors. The transformed transmission line
    is then sent to the next layer, the network layer. The data link layer accomplishes
    the error-free transformation by processing the transmission stream received by
    the physical layer into data frames. Data frames are sequential message transmissions
    with a distinct boundary. Typically, these data frames are a few hundred bytes
    in length. If the data link layer receives a data frame that is not well defined,
    it sends a message back to the source for retransmission. It is up to the network
    layer to solve problems caused by damaged, lost, or duplicate data frames. The
    final job of the data link layer is controlling traffic. A fast transmitter with
    messages, a traffic regulation mechanism is employed to inform the data source
    to slow down its transmission.


    # The Network Layer


    The network layer is concerned with routing messages from the source to its destination.
    This routing may be via static routing tables, routing dynamically based on load
    balancing, or other routing methods. Like the data link layer, this layer also
    has the responsibility of ensuring that there are not too many data packets being
    transmitted and received at once. Finally, this layer ensures that heterogeneous
    networks can intercommunicate. Because some networks may contain different specifications,
    it is up to this layer to overcome such differences.


    # The Transport Layer


    The basic job of the transport layer is to accept data from the session layer,
    split the data into smaller units if needed, and pass these data units to the
    network layer. The transport layer also ensures that all the data units arrive
    correctly at the receiving end. The transport layer creates a distinct network
    connection for each transport connection required by the session layer. The transport
    layer also determines the type of service to provide to the session layer. An
    example of this service is error-free, point-to-point communication, in which
    data packets are received in the order delivered. The transport layer is important
    because it is the lowest layer of the OSI model that provides reliable data transfer
    between two systems. This layer is a true source-to-destination layer. The transport
    layer is not responsible for establishing connections and sometimes multiple connections,
    it is also responsible for deleting network connections. Like the data link layer
    and network layer,'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# The OSI Model


    the transport layer is also responsible for controlling network traffic and contains
    a mechanism for regulating the speed at which data is transferred.


    # The Session Layer


    The session layer allows users on different machines to establish sessions between
    them. A session not only provides ordinary data transport, but also provides enhanced
    services that are useful in some applications. The services session layer provides
    the following.


    Dialog Control Management Sessions allow data traffic to go in both directions
    at the same time or in one direction at a time.


    Token Management At times, it is essential that both sides of the communication
    system do not attempt the same operation at the same time. The session layer provides
    tokens that can be exchanged. Only the side holding the token can perform the
    critical operation.


    Synchronization The session layer provides a means of synchronizing messages so
    the same message is not repeated. This is useful in case of system failure. When
    the system recovers, only the messages lost are resent.


    # The Presentation Layer


    The presentation layer performs functions that are common to users needs. These
    are general solutions to communication problems. Unlike the lower layers, which
    are concerned with passing bits, the presentation layer deals with the syntax
    and semantics of the information transmitted. An example is data encoded in a
    agreed-upon format. The features of the presentation layer allow names and numbers
    to be decoded from their communication representation, the user can view them
    in a more natural format. The presentation layer is also concerned with other
    types of syntax and encoding such as compressing data to decrease the number of
    bits sent on the network.


    # The Application Layer


    The final layer of the OSI model contains a variety of protocols and applications
    that are commonly needed. An example is file transfer, in which files are transmitted
    from one system to another. Since some operating systems have different file naming
    conventions and file organization, this layer addresses problems associated with
    file transfer. Other applications include e-mail, remote process execution, remote
    terminal access, and other general-purpose and special-purpose utilities.


    # Data Transmission using the OSI Model


    When a sending process attempts to transmit data to a receiving process, the sending
    process passes the data to the application layer. The application layer attaches
    an application header (AH) to the front of the message and gives the resulting
    item to the presentation layer. The presentation layer may format the data in
    various ways, attaching a presentation header (PH) to the message before it is
    sent to the session layer. The process of message translation and the addition
    of header and possibly footer attachments are repeated for each layer until the'
