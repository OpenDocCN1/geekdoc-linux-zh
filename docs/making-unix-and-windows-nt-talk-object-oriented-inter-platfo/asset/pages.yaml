- img_proc: true
  md: '# Chapter 3: NT Building Blocks


    The Services applet enables you to start and suspend processes by sending commands
    to the Service Control Manager (SCM). The SCM is responsible for maintaining a
    database of services and scheduling them to run.


    To create an NT service you must provide two entry-points to your program, in
    addition to main(). One of these entry-points is the actual service, called ServiceMain(),
    but you can call whatever you like. The second is a control and status handler,
    which responds to system requests, such as system shutdown, and reports back with
    status messages to the SCM. This second entry-point is often called Handler()
    or StatusHandler(). There are several Win32 function calls you must call to configure
    a service with the SCM, including calls to add the program to the SCM''s database
    and register your ServiceMain() and Handler() callbacks.


    # CreateService()


    The first Win32 function call for creating and managing services is CreateService()


    ```

    SC_HANDLE CreateService(SC_HANDLE hSCManager,

    LPCTSTR 1pServiceName,

    LPCTSTR 1pDisplayName,

    DWORD dwDesiredAccess,

    DWORD dwType,

    DWORD dwStartType,

    DWORD dwErrorControl,

    LPCTSTR 1pBinaryPath,

    LPCTSTR 1pLoadOrderGroup,

    DWORD 1pdwTagId,

    LPCTSTR 1pDependencies,

    LPCTSTR 1pServiceStartName,

    LPCTSTR 1pPassword);

    ```


    hSCManager is the handle to the SCM, which is obtained by a call to OpenSCManager().
    1pServiceName and 1pDisplayName are pointers to null-terminated strings that contain
    the name of the service being created and the name that is displayed in the Services
    applet. dwDesiredAccess is the access type needed. It can be one of the values
    listed in Table 3.9.'
