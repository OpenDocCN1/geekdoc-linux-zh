  md: '# Creating NT Services 239


    1pDependencies is a null-terminated array of null-terminated strings that the
    service names of all services that must be started before this service starts.
    If it is specified, the service has no dependencies.


    1pServiceName is a null-terminated string that lists the user or system account
    in which the service runs. If the service type is SERVICE_WIN32_OWN_PROCESS, an
    account name of the form DomainNameUserName can be used. If this parameter is
    null, CreateService() uses the local system account. If the service is a driver,
    this parameter is the name of the object that loads the service and can be left
    null.


    1pPassword is a pointer to a null-terminated string containing the password of
    the account name listed in 1pServiceName. If 1pServiceName is null, 1pPassword
    must be null, as well.


    CreateService() returns a handle to the service if it succeeds, zero otherwise.
    GetLastError returns the error code.


    # OpenSCManager()


    OpenSCManager() returns a handle to the SCM. This handle is used in CreateService()
    and OpenService().


    ```

    SC_HANDLE OpenSCManager(LPCTSTR 1pMachineName, LPCTSTR 1pDatabaseName, DWORD dwDesiredAccess);

    ```


    1pMachineName is a null-terminated string containing the name of the machine on
    which the desired SCM is located. If null, OpenSCManager() will return a handle
    to the manager on the local machine. 1pDatabaseName is a pointer to a null-terminated
    string containing the name of the SCM database to use. Currently, this parameter
    should be set to SERVICES_ACTIVE_DATABASE. If it is set to null, SERVICES_ACTIVE_DATABASE.
    dwDesiredAccess is the access type required. It can be a value listed in Table
    3.13.


    # Table 3.13 Service Manager Access Types


    | Access Type | Description |

    |---|---|

    | SC_MANAGER_ALL_ACCESS | Includes STANDARD_RIGHTS_REQUIRED, in addition to all
    the access types listed in this table. |

    | SC_MANAGER_CONNECT | Enables connecting to the service control manager. |

    | SC_MANAGER_CREATE_SERVICE | Enables calling of the CreateService() function
    to create a service object and add it to the database. |

    | SC_MANAGER_ENUMERATE_SERVICE | Enables calling of the EnumServices() function
    to list the services that are in the database. |

    | SC_MANAGER_LOCK | Enables calling of the LockServiceDatabase() function to acquire
    a lock on the database. |

    | SC_MANAGER_QUERY_LOCK_STATUS | Enables calling of the QueryServiceLockStatus()
    function to retrieve the lock status information for the database. |'
