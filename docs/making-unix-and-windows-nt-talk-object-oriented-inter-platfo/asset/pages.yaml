    # A Final Word on the UDP Version of the Stock Market Position Tracking System


    Congratulations! You have just survived the creation of the first interplatform
    communication system. Notice that the code performed the actual communication
    is only a small part of the overall program. The majority of the code is used
    for processing and storing positions and transactions. One thing to keep in mind
    is the operating system specific translation of the XPCTTransaction object to
    be transmitted. One obstacle to be overcome when transmitting data between UNIX
    and Windows NT system is converting big-endian numbers to little-endian numbers
    and vice versa. By converting the trade amount and the position value into XPEndian
    the big-endian and little-endian conversion problem is avoided.


    Another socket communication issue is byte packing. By keeping the data components
    of XPCTTransaction as character arrays and XPCEndian objects, the byte packing
    problem is avoided. Both UNIX and Windows NT pack byte-numbers to the nearest
    byte. Since the data members of XPCTTransaction are all character arrays (XPCEndian
    objects can be treated as character arrays) and a character is a byte, XPCTTransaction
    is packed to the nearest byte.


    Although an interplatform position tracking system has been developed, it is lacking
    points that make it an ideal system. Recall that an ideal position tracking system
    allows for communication from multiple clients. The specification also stipulates
    that the multi-client communication cannot affect performance with regards to
    the computing and transmission of positions. The system developed in Listing 5.25
    allows for multiple client connections. Because UDP sockets are connectionless,
    many clients can transmit data to the server. Unfortunately, the more clients
    that connect, the less reliable transaction transmission becomes. The server processes
    one transmission at a time. A client can not be processed until the transmission
    of the current client completes. If a client attempts transmission while another
    client is being processed, the client''s transmission message might be least because'
