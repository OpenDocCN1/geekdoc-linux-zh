  md: '# Table 2.21 Retrieving Process IDs


    | Process ID System | Description |

    | --- | --- |

    | Call Prototype | Retrieves the process ID of the current process |

    | int getpid(void) int getpid(void) | Retrieves the process ID of the parent of
    the current process |


    fork() has two uses. fork() can spawn a child process that is a copy of the parent.
    The copied process accomplishes a separate task while the parent process continues
    its original task. Creating processes that are copies of themselves serve different
    purposes. When spawning a duplicate process, the entry point to the duplicate
    process can be defined. This is similar to thread creation discussed in "Initializing
    and Destroying Thread Attributes" on page 89. Unlike thread creation, spawning
    a child process is much slower and cannot share the global memory of the original
    process. The process\u2019s global memory is not copied to or shared with the
    child process. The child can share the parent''s open file descriptors, signal
    handling settings, and other resources discussed previously.


    fork() can also spawn a daemon process as a copy of the parent. A fork()-spawned
    daemon process differs from the previously described copies in that the daemon
    "detaches" from its parent. The daemon runs in the background, waiting for events,
    and continues to run even when its parent process terminates. Figure 2.11 illustrates
    spawning a process that is a duplicate of the parent.


    # Figure 2.11 Spawning a Process That Is a Copy of the Parent


    ![](img/5c85d865d33d2c2c3c815331ae6c6f4a_128_0.png)


    The second use of fork() is to spawn a new program. Because fork() creates a copy
    of the parent, the only way to spawn a new program is to duplicate a system call
    that spawns the new program. A newly spawned program also shares the same attributes
    shared by a duplicate process. The system call that spawns new programs and the
    new program''s ability to share the parent''s resources are discussed further
    in this section. Figure 2.12 illustrates the spawning of a new program.'
