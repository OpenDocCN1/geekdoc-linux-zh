  md: '# # What’s on the CD-ROM?


    The sample code on the CD-ROM accompanies Making UNIX and Windows NT Talk is organized
    into two sections. One section is for the Windows NT Visual C++ code and the other
    is for UNIX code. All the code has been compiled and tested on Windows NT 4.0
    and Sun Solaris 5.6 (Unix System V) machines. The compiler used on Windows NT
    is Visual C++ version 5.0 and Sun''s C++ compiler was used on the UNIX platform.
    It is the authors’ belief that all code will successfully compile and run on all
    versions the operating system and compiler equal to or greater than those listed
    above.


    For more information on the CD-ROM, example code, directory structure, etc. —
    see Appendix A beginning on page 465.'
