    \ actual service code itself. You can combine these programs into one program\
    \ as long as these functions are provided and available from, say, command-line\
    \ options.\n\nThe install program calls OpenSCMManager() to get a handle to the\
    \ SCM, followed by CreateService() to install and configure the service. The uninstall\
    \ program makes calls to OpenSCMManager() and OpenService(), followed by a call\
