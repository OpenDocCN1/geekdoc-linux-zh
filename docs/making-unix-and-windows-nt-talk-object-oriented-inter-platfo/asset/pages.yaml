  md: '# Chapter 2: UNIX Building Blocks


    Within a UNIX directory structure, there can be several different types of UNIX
    files. These files are used for storing data, special handling for devices, and
    intermediate storage for interprocess communication. The various UNIX files types
    are displayed in Table 2.1.


    # Table 2.1 UNIX File Types


    | File Type | Description |

    | --- | --- |

    | Regular or ordinary file | Contains zero or more data bytes. |

    | Directory | Contains the names of other files. |

    | Character and block special file | I/O devices. |

    | FIFO | A first-in first-out queue, also known as a named pipe. |

    | Symbolic link | A file that contains a pathname to another file. |

    | Socket | A special type of file used for interprocess communication. |


    Applications can open both files and directories, but the methods used for opening
    and processing them is different. To correctly process a pathname, you must know
    the file type to which the pathname refers.

    Another important aspect of UNIX files and directories are security permissions.
    Permissions can be set so that can be read, write, executed, or some combination.
    What''s more, the permissions can be set separately for the owner of the file,
    users within the owner''s group, or all users who can access the file system.
    It is important to know whether a file or directory can be accessed by an application
    to avoid unpredictable results.


    # The XPCFileStat C++ Class


    XPCFileStat accesses the file system attributes discussed far to complete the
    following


    +   * Determine whether a given pathname is valid.

    * Determine whether a given pathname is a file, directory, or some kind of special
    file.

    * Compute the size of the file or directory.

    * Retrieve the permissions for the pathname.

    * Retrieve the time at which the pathname was last accessed, modified, and had
    its status changed.

    * Determine whether the user of the application can access the pathname.


    Before defining the class, it is important to introduce some UNIX system calls
    that return access pathname information. These system calls are `pathconf()`,
    `getcwd()`, and `stat()`.


    # The pathconf() System Call


    The `pathconf()` function returns the current value of a configurable limit or
