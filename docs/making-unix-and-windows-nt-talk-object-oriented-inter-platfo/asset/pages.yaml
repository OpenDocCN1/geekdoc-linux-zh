  md: 'processes running on separate workstations, and even fewer for processes running
    on differ- ent operating systems. This book provides a host of comprehensive solutions
    to this cross-platform communication dilemma.


    We begin with the basic building blocks needed to develop systems on each operating
    system — file attributes, sig- nals on UNIX and events on NT, semaphores, threads
    and processes. After the basics, net- work communication is introduced. IPv4 and
    IPv6 are explained and the benefits and drawbacks to UDP and TCP are covered.
    Socket communication is the final topic. A socket is the basic communication tool
    for cross-platform development.


    Throughout this book, each chapter presents a specific concept, develops complete
    examples using the C++ classes. Our goal was to take a concept and show it in
    a real application. A common shortcoming of many descriptions of socket programming,
    for example, is using the socket in the main thread of the application. Although
    this technique shows how to use a socket, most applications dont have this shortcoming
    and show sockets used in secondary threads, as well as semaphores to protect memory
    accessed by the different threads in a program. Where applicable, our objects
    are also used in a Windows graphical user interface example. Design diagrams are
    used throughout the book for descriptions of cross-platform concepts in a generic
    system, and for complex examples.


    We hope that you will find this book both informative and useful. The building
    blocks we develop here can be dropped directly into your program with no modifications.
    Although none of the programming concepts behind these building blocks are new,
    the ability to use them in a cross-platform context.


    UNIX and NT are both here to stay. Use this book to help you write programs that
    take advantage of both.'
