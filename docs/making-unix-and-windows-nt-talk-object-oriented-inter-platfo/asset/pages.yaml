  md: '# Figure 5.6 The System Architecture for the Stock Market Position Tracking
    System Using UDP Protocols


    ![](img/5c85d865d33d2c2c3c815331ae6c6f4a_366_0.png)


    The ideal stock tracking position system has the following features.


    +   * Communication with the position server from multiple clients without affecting
    position update performance

    * Reliable transmission of transactions and subsequent transmission of position
    updates


    When the client executes a transaction, a message is sent by the Windows-NT operating
    system over UDP sockets to the server. The server receives the message, casts
    it back to the original stock transaction structure, updates its internal stock
    position database, and returns the updated stock position to the client. The code
    for the Windows-NT client and UNIX server is displayed in Listing 5.24.


    # The Transaction Class


    Both the Windows-NT client and UNIX server use the following structure to transmit
    and receive stock transaction records. To simplify message transmission, the structure
    is comprised of single-byte character arrays. Structure packing and byte ordering
    is the same on UNIX as on Windows NT for single-byte character arrays. Therefore,
    no additional translation needs to occur when delivering or receiving the message.
    The methods of the class convert the byte arrays into their true types.'
