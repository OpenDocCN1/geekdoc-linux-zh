    \ belongs, and all other users. These are commonly referred to as owner, group,\
    \ and, respectively. The methods of XPFileStat retrieve these access rights are\
    \ iGetOwnerPermissions(), iGroupPermissions(), and iGetOtherPermissions(), respectively.\
    \ All users can read, write, execute, or combine of any two or three permissions.\
    \ The enumerated type ePermissions defines all combinations of these rights. The\
    \ access rights are stored in the st_mode member of the sStatBuf structure or,\
    \ more accurately, they are stored in the 007777 (octal) bits. Octal constants\
    \ defined in the sys/stat.h include file are used to extract and determine access\
    \ rights for specific user types. These constants are defined in Table 2.4.\n\n\
