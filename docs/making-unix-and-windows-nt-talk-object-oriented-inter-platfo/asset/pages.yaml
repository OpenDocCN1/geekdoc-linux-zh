  md: '# Threading Applications in a UNIX Environment 107


    The consumer shown in Listing 2.41 is significantly different. The consumer creates
    a thread for each producer. Each subsequent consumer thread must process data
    from its associated producer. The data is contained within the shared file specified
    by the producer. This shared file must be protected using the semaphore, which
    is also specified by the producer. Because the consumer needs knowledge of all
    of the producer''s semaphores and shared files, the consumer''s command line must
    include this information. The named semaphore and shared file are entered in pairs
    and the number of threads created corresponds to the number of semaphore-shared
    pairs.


    Before the threads are created, two unnamed semaphores are created. The first
    protects global data from being overwritten by each of the consumer threads. The
    second semaphore is used as an indicator to let the main thread know that new
    information has been placed in the global variable. The consumer unlocks this
    semaphore when data is available. The main thread waits for the semaphore to become
    available, locks and processes data. The main thread waits for data again waiting
    to lock the semaphore unlocked by a consumer thread when data is available.


    Each thread is created with default thread attributes. The thread is passed an
    object that encapsulates the two unnamed semaphores, the producer shared file,
    and a producer-consumer semaphore. Like the consumer in Section 2.4, each consumer
    waits to lock the semaphore. Once the semaphore is locked (due to the semaphore
    being unlocked when the producer writes to the shared file), the data is extracted
    from the file and the same semaphore is unlocked. Because the goal of the consumer
    is to collect data from multiple producers and process it in one location, each
    consumer needs to put its producer''s data in a location that can be processed
    by the main consumer. For this example, the central location is a global variable.
    The global variable is an object that contains the consumer''s message, as well
    as the name of the file from which the message was extracted (for the filename
    to be explained shortly.) This global variable is used by all consumers and must
    be protected by the unnamed semaphore passed to it. This semaphore is locked before
    data is copied to the global variable, and unlocked after it is copied. The unnamed
    semaphore for which the main thread is waiting is unlocked, allowing the main
    thread to process the global variable.


    The consumer threads are also created with a new signal. This mask contains the
    SIGUSR1 signal that is blocked before the consumer thread is created. The blocking
    of the signal prevents the SIGUSR1 signal from being missed before the thread
    is created. Once the thread is created, a signal handler is set up for the SIGUSR1
    signal, and the signal mask is unlocked.


    Before a producer exits, "QUIT" is written to its shared file. The consumer stores
    "QUIT", along with the producer''s shared file, in the global variable. When the
    main consumer thread processes "QUIT", it locates the thread that processes the
    producer''s file. When the thread exits, vsigThread() is used to send the SIGUSR1
    signal to the thread. The thread''s termination is processed by waitThread().
    SIGUSR1 causes the thread''s signal handler to be called. The signal handler calls
    pthread_exit(), passing a status object containing a status ID and message. This
    status is sent to the thread object via waitThread() and the status is displayed
    for the user. Each time a thread exits, the number of threads spawned (a value
    stored by the main thread) is decremented. Only when no consumer threads exist
    does the consumer process exit.'
