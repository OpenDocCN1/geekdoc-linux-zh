  md: '# 260 Chapter 4: Cross-Platform Communication


    The Network Layer layer contains the Internet Protocol (IP) communication definition.
    The IP layer provides a connectionless and unreliable message delivery system.
    The messages that the network layer delivers are in the form of datagrams. The
    IP datagrams are considered connectionless because each datagram is independent
    of all others. The ability to relate multiple datagrams with one message is provided
    by the upper OSI layers. Each IP datagram contains information so that it can
    be delivered and routed independently of other datagrams. This information includes
    the source address of the sending host and destination address of the receiving
    host.


    The IP layer is considered unreliable because it does not guarantee that an IP
    datagram is delivered or is delivered correctly. The IP layer computes and verifies
    a checksum based on its header. The header contains its source and destination
    address. If the checksum points an error, the message is discarded. The IP layer
    assumes that the upper OSI layers take care of any message retransmissions that
    require.


    The IP layer also handles fragmentation of messages. If a communication device
    receives a message that is too large to send to the next point in the network,
    the IP layer breaks the message into fragments and sends each fragment as an IP
    datagram. When fragmentation occurs, the IP layer duplicates the source and destination
    address into the new IP datagram. This allows each IP datagram to be transmitted
    independently of the others.


    If IP messages are being sent faster than the destination device can process,
    they are discarded. When this occurs, the IP layer is responsible for sending
    a message to the original source, informing it of transmission loading. This message
    increases the amount of data sent on the network.


    The Transport Layer The Transport describes the protocols that are used to send
    IP datagrams within the network. These protocols are TCP and UDP. TCP provides
    connection-oriented, reliable, full-duplex, byte-stream service between two communicating
    devices in the network. The UDP protocol provides unreliable connectionless datagram
    service. Section 4.3 for more information on UDP and TCP protocols.


    The Application Layer The session and presentation layers of the OSI Model are
    not include in the TCP/IP communication protocol. The application layer includes
    applications that give the user an interface for accessing the network using TCP/IP
    communication. One of the strengths of TCP/IP communication is that the applications
    are available on a wide variety of platforms, including UNIX and Windows NT. Some
    of the standard applications are the following.


    File Transfer Protocol (FTP) FTP is an application used to send files from one
    system to another. It provides features such as user authentication, directory
    listing, directory changing, and transferring data in both ASCII and binary format.
    FTP uses the TCP transport protocol for transmitting data from one application
    to another. Because TCP is used, data is reliable. TCP also handles duplex communication,
    meaning that data can be transferred to and from two workstations. When an FTP
    connection is established, two TCP communication channels are opened. One channel
    is used for user commands and responses and the other channel is used for transferring
    data.


    *'
