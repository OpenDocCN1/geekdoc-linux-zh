  md: '# Figure 2.4 Mutually Exclusive Access


    ![](img/5c85d865d33d2c2c3c815331ae6c6f4a_74_0.png)


    Operations that block and release access to critical sections of code must be
    atomic operations — operations that execute as one unit. This is important so
    that the CPU is not preempted (taken over by another operation) during a lock
    or release of a critical area. Without an atomic operation, a preemptive lock
    by another process would supercede the lock of the original process.


    The atomic operation discussed in this section is the semaphore. Waiting for and
    subsequently locking a semaphore is an atomic operation, as releasing it is semaphore.
    Semaphores represent a cooperative locking model — unless all code uses the semaphores
    to protect critical areas of code, the semaphore model will not work.


    Semaphores have a dual use within UNIX applications. The first is protecting critical
    areas of a program accessed by two or more of its threads. Threads (introduced
    in the next section) execute independently of each other and of the main program.
    If the program''s threads all access the same data structures, the data need to
    be protected from being overwritten or removed while another thread is accessing
    it. Figure 2.5 illustrates semaphores protecting critical data structures from
    being accessed at the samic time.'
