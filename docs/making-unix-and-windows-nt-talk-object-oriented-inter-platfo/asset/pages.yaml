    At this point, the Stock Market Position Tracking System meets two very important
    goals of the original application specification. The first is that client-server
    communication is stable and message delivery is guaranteed. The second is that
    multiple-client connections can be accepted, and therefore, multiple-user stock
    positions can be tracked at once. Only once the client disconnects from the server,
    the client''s current stock positions are lost. When the process communicating
    with the client dies, all memory within the process is free, including all position
    information. The next time a client connects using the same username, position
    information transmitted reflects only the current connection''s activity and no
    previous connection.


    # Threading Applications Using TCP Sockets


    Data is lost when server processes die because spawned processes do not share
    the resources of the original process. When a process dies, its memory is released.
    In an application like the Stock Market Position Tracking System, the loss of
    information creates a system that is incorrect. Creating-client-server server
    threads overcomes the problem of data loss.


    Threads within an application share all resources of the original application.
    The resources shared include memory stored on the heap. The thread can use this
    memory by accessing its global variables or by manipulating memory passed to the
    thread as arguments. By allowing threads to access memory of the original process,
    data stored by the thread is not lost when the thread exits.

    Because threads access global memory, the global memory must be protected from
    manipulation by multiple threads of execution. If two threads access global memory
    at once, memory corruption can occur. Such a scenario presents itself when one
    thread data'
