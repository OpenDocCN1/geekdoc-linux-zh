    \ default, close() returns immediately. The operating system attempts to deliver\
    \ any pending data available on the socket before it is terminated. If the linger\
    \ option is set, the amount of time allowed for pending data to be transferred\
    \ can be changed before close() returns. Unlike other socket options, which are\
    \ set using boolean values, the linger option involves setting the data members\
    \ within the linger data structure, struct linger (Table 5.19 for the linger structure).\
