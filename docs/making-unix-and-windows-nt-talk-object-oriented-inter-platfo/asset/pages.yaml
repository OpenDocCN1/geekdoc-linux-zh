  md: '# Simple Interplatform Communication Using Sockets 333


    | Name | Values | Protocols Supported | Description |

    |---|---|---|--|

    | SO_REUSEADDR | 0 — Option OFF<br>1 — Option ON | UDP or TCP | Under normal conditions,
    two or more applications cannot bind to the same port and address using bind().
    By setting this option, this rule is ignored. |

    | SO_KEEPALIVE | 0 — Option OFF<br>1 — Option ON | TCP | Connected sockets are
    kept alive by enabling transmission of messages. If the sending and receiving
    of messages fails, the connected socket is considered broken. |

    | SO_LINGER | Instance of struct defined in <sys/socket.h> on UNIX, <winsock2.h>
    on Windows | TCP | Setting this option causes the socket to linger when closing
    the socket using close(). Normally, close() returns immediately and the system
    attempts to deliver unset data. If SO_LINGER is set, the process is blocked until
    the data is transmitted or until the linger time expires. The linger time is defined
    within struct linger. This structure contains the following prototype:

    ```struct linger {

    /* on(0), off(1) */

    int l_ononoff;

    /* linger time in seconds */

    int l_linger;

    };

    ```nIf l_linger is set to 0, data remaining to be sent is discarded when the socket
    is closed. | SO_SNDBUF | An integer size value | UDP or TCP | Sets the buffer
    size for sending data. This is required only if the default send buffer size is
    not large enough. |

    | SO_RCVBUF | An integer size value | UDP or TCP | Sets the buffer size for receiving
    data. This is required only if the default receive buffer size is not large enough.
    |'
