  md: '# Creating a TCP Socket Protocol Class


    When the TCP socket setup is complete, messages can be received. The system used
    to call recv() TCP socket messages is recvv(). The UDP socket messages are received
    using recvfrom(). recvfrom() does not retrieve the socket message, it also captures
    the address of the application sending the message. The captured address can be
    used to send UDP replies. The retrieval of the IP address and port number is not
    necessary for XPCTcpSocket''s ReceiveMessage() method. accept(), while Accept(),
    captures the address of the client when the client connects, and the client and
    server are connected. Because the client and server are connected, the client''s
    address is not needed for sending replies.


    Not only does a TCP server receiving messages differ from that of a UDP server,
    a UDP client can send messages to a specified address (IP address and port number)
    once its socket file descriptor is created. The parameters of the iSendMessage()
    method within XCUdpSocket do not include the message to send but also the address
    of the receiver. To send messages XPCTcpSocket, the client must be connected to
    the server by calling connect(). connect() takes the IP address and port number
    of the server (see Section 5.3 for more information regarding the connection())
    and system call. Once a connection is is established, there is no need to include
    the address of the server. Because TCP sockets do not require the destination
    address, iSendMessage() uses instead of sendto(). sendto() can be used, but it
    is overkill. The destination parameter of sendto() is ignored when sending TCP
    messages. Unlike sendto(), send() does not take a socket address to determine
    the message''s destination. (See Section 5.3 for more information regarding the
    sending system call).


    # The XPCTcpSocket Class Definition


    The definition for XPCTcpSocket is shown in Listing 5.27. This class is used for
    creating both client and server socket applications. XPCTcpSocket contains the
    following features.


    +   - Socket creation

    - Socket binding

    - Listening for incoming client connections

    - Accepting incoming connections and creating new sockets for connection communication

    - Connecting to a TCP server

    - Sending messages to a TCP client and server

    - Receiving messages from a TCP client and server


    There are two constructors included for XPCTcpSocket. The first constructor takes
    a socket as its parameter and creates a TCP socket file using the port. The second
    constructor is used for creating XPCTcpSocket instances dedicated to client communication.
    This constructor is called when a client connects and a new socket file descriptor
    is created using accept(). This constructor takes a socket file descriptor and
    stores it in the private variable iSocket inherited from XPSocket. Since both
    constructors take an integer, their ambiguity is eliminated by making the first
    constructor a short int and the second a long int. All methods of XPCTcpSocket
    are discussed in detail following the XPCTcpSocket definition. Operating system
    specific code is enclosed within #ifdef ... #endif blocks.'
