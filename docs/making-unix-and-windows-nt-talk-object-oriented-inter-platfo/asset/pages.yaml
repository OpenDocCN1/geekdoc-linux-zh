  md: '# File Type Description


    Device I/O Reading from and writing to the system console and communication ports


    Named Pipe FIFO queue for reading and writing data between applications on a network


    Socket Special field for inter communication


    NT''s Win32 API provides functions for opening, reading, writing, and closing
    files of all types. Although file I/O can be performed with the same low-level
    I/O calls as UNIX, the same functions are more efficiently performed with Win32
    calls. One difference between the two is the value returned from a file open call.
    Win32 returns a handle to an NT operating system object, while the low-level I/O
    returns a file descriptor. — if you open a file with the Win32 call, you cannot
    read it or write it with the low-level I/O call. Table 3.2 lists the Win32 calls,
    the corresponding low-level I/O calls, and the file type on which the calls are
    used.


    | Win32 call | Low-Level I/O call | NT File Type |

    | --- | --- | --- |

    | CreateFile() | _creat(), _open() | Data Pipes (open) Devices Directories (open)
    Mailslots |

    | CloseHandle() | _close() | Data Pipes Devices Directories Mailslots |

    | CreateDirectory() | _creat(), _read() | Data Pipes Devices Directories Mailslots
    |

    | WriteFile() | _write() | Data Pipes Devices Directories Mailslots |


    Although the Win32 calls are not portable to other operating systems, they are
    preferred when working with NT because they are more efficient and more flexible.
    Additionally,'
