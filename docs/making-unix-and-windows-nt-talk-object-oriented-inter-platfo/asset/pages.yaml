- img_proc: true
  md: '# 68 Chapter 2: UNIX Building Blocks


    release its semaphore, the process waiting longest is first. sem_post() is reentrant
    with respect to signals and can be accessed by a signal-catching function.


    ```

    int sem_post(sem_t *sem);

    ```


    sem_getvalue() retrieves the current value of a semaphore at the time it was called.
    If the semaphore''s value changed between the time it is retrieved and the time
    it returns, sem_getvalue() does not reflect the new value.


    ```

    int sem_getvalue(sem_t *sem, int *sval);

    ```


    If the sem_getvalue() system call is successful, 0 is returned. The parameter
    sval contains the value of the semaphore. If another process or thread is attempting
    to lock the semaphore at the same time sem_getvalue() is called, a value of 0
    is returned in turn. If sem_getvalue() fails, -1 is returned.


    # Removing Unnamed Semaphores


    The sem_destroy() system call removes unnamed semaphores. A successful call to
    sem_destroy returns 0; otherwise, -1 is returned. If another process or thread
    is waiting for the semaphore, sem_destroy() fails and sets the global errno variable
    to EBUSY.


    ```

    int sem_destroy(sem_t *sem);

    ```


    # Removing Named Semaphores


    Two systems, sem_close() and sem_unlink(), are used to remove named semaphores.
    sem_close() deallocates any resources allocated by the process for semaphore.
    The semaphore is not removed by sem_close(), but becomes inaccessible to the current
    process. Because the semaphore was in a locked state at the time the process closed
    it, it would remain in a locked state for all other processes accessing the same
    semaphore. 0 is returned upon a successful sem_close() and -1 is returned for
    a failure.


    ```

    int sem_close(sem_t *sem);

    ```


    sem_unlink() is used to remove the semaphore. If other processes are using the
    semaphore, sem_unlink() does not destroy it. A semaphore is only removed when
    all processes have either called sem_close() on the semaphore, or the processes
    using the semaphore have exited. If other processes are using the semaphore, sem_unlink()
    does not block, but returns immediately with an error code of -1. If the call
    to sem_unlink() is successful, 0 is returned. If a semaphore is removed using
    sem_unlink() and a new semaphore using the same name is created with sem_open(),
    the new semaphore does not reference the old one.


    ```

    int sem_unlink(const char *name);

    ```


