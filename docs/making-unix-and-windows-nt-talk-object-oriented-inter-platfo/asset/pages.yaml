  md: "# Waiting on a Event\n\nAn event is signaled to a waiting process when the\
    \ event occurs and when the waiting process is in a waiting state. This waiting\
    \ state occurs by a call to WaitSingleObjectEx(), shown here.\n\n```\nDWORD WaitSingleObjectEx(HANDLE\
    \ hHandle,\n    DWORD dwMilliseconds,\n    BOOL bAlertable);\n```\n\nhHandle is\
    \ the handle to the event, dwMilliseconds is the time to wait for the event, and\
    \ bAlertable specifies whether an alert routine was previously specified by a\
    \ call to QueueUserAPC() to be called. WaitSingleObjectEx() is used for waiting\
    \ on many types of NT objects, including semaphores, threads, and processes. Win32\
    \ provides a call for waiting on a list of objects, WaitMultipleObjectsEx().\n\
    \n```\nDWORD WaitMultipleObjectsEx(DWORD nCount,\n    CONST HANDLE *pHandles,\n\
    \    BOOL bWaitAll,\n    DWORD dwMilliseconds,\n    BOOL bAlertable);\n```\n\n\
    pHandles is a pointer to an array of handles and nCount is the number of the handles\
    \ in the array. If bWaitAll is true, WaitMultipleObjectsEx() will return when\
    \ all handles have been signaled; if false, it will return when one has been signaled.\n\
    \nWin32 provides two more wait functions that are to be used if the calling thread\
    \ creates a window and must process window messages. MsgWaitForObjectsEx() and\
    \ MsgWaitForObjectEx() are preferred if your application creates and manages windows.\
    \ Since all examples presented here are console applications, WaitForObjectEx()\
    \ is used.\n\n# Processing an Event\n\nWaiting for an event to occur suspends\
    \ a program's process, which is not always desirable. You may wish to perform\
    \ other processing while waiting for the event to occur. The solution is to call\
    \ QueueUserAPC() which describes a callback routine to be called when the event\
    \ occurs. The use of QueueUserAPC() is described in the implementation of the\
    \ XPEvent class.\n\n```\nDWORD QueueUserAPC(APCFUNC pfnAPC,\n    HANDLE hThread,\n\
    \    DWORD dwData);\n```\n\npfnAPC is a pointer to a callback function. hThread\
    \ is a handle to the thread that is waiting on the event. dwData is a value that\
    \ is passed to the callback function.\n\n# XPEvent Implementation\n\nThe XPEvent\
    \ class definition is shown in Listing 3.10. Note that the CEvent class in Microsoft's\
    \ Foundation Classes (MFC) encapsulates event creation and manipulation functions."
