    # # The Hard Disk Layout


    Partitioning your hard disk divides a single disk into one or more logical sections
    or drives. The partition itself is a set of contiguous sectors on the disk that
    are treated as an independent disk. The partition table is the index on the disk
    that describes how the sections of the disk relate to the actual partitions.


    A long-standing argument exists about the need for multiple partitions. Most DOS
    and Windows users are used to having their entire hard disk, regardless of the
    size, represented as one filesystem. Although this might seem convenient for some
    users, it is not desirable in Unix or Linux


    By using multiple partitions, you can encapsulate your data and limit filesystem
    corruption. This limits the potential data loss. You can also increase disk efficiency.
    Depending on the purpose of your system, you can format different filesystems
    with different block sizes. If you have a lot of smaller files, you want smaller
    blocks.


    > > NOTE You can format different partitions using different filesystems—for performance
    reasons or in order to facilitate data sharing with other operating systems as
    Windows.


    Multiple partitions are also useful to limit data growth. This ensures that users
    who require extra disk space do not crash the system by consuming all available
    root space.


    Some constraints must be considered when planning your disk layout:


    +   - To prevent data loss and corruption, partitions must not overlap.


    +   - To maximize usage of the disk, there should be no gaps between partitions.'
  merge: -1
