    # Common Variables


    Any variable that can display its values using the following syntax:

    echo ${variable name}


    Thus the command

    echo $MAIL


    will show the mail directory, $HOME the home directory, and so on. To see a complete
    list of the environmental variables that are defined, you can use two commands—env
    and set. The displays can differ slightly (environmental variables versus local
    variables), for the most part the output of env is a subset of the output of set.
    Some of the variables that can include the following:


    +   - HOME—The directory you begin in, and where you end up typing any other parameters

    - LINES—Number of lines within the display before pausing (more)

    - LOGNAME—The username under which the current user is logged in

    - PWD—The present working directory, or where you are now

    - SHELL—Which interpreter you are using

    - TERM—The type of terminal, or emulation, in use

    - USER—Which rarely differs from LOGNAME but can if you are the user using a command
    such as su, which enables you to temporarily execute commands as another user


    # Note


    As a general rule, predefined system variables are always in uppercase.


    You can change the value of variables as needed or add your own to be referenced
    in programs or at the command prompt. For example, to create a variable called
    TODAY, use the following syntax:

    TODAY=wednesday'
