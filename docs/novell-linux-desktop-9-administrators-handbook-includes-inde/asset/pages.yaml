  md: '# CHAPTER 2: Installing Novell Linux Desktop 9


    You are prompted to enter, and verify, a password for the root user. Because this
    is the account that has the most power on the system, and the one that most people
    intent on inflicting harm to the system will attempt to access it, it is imperative
    that good password rules, such as mixing case and including non-alpha characters,
    be applied to this password. In addition to letters, digits, and blanks, the password
    can include the following characters: #*,:,;:-_+$%&|?{}. A command button titled
    Expert Options also appears on this screen and if you click it, you can choose
    between three encryption types:


    +   - DES (Linux default)—Restricted to eight characters; technically, you can
    type in as a long string as you want, but only the first eight characters are
    used in the hash.

    - MD5

    - Blowfish


    # Note


    These are three very different encryption-hashing functions. MD5 and Blowfish
    differ algorithmically, and both are harder to crack than DES because they use
    longer passwords. DES is the default because it offers the ability to interact
    with legacy systems as those that use NIS.


    After the root password is configured, the system next turns to network configuration.
    A scan is done for network interfaces, DSL connections, ISDN adapters, Modems,
    Proxy, and VNC Remote administration. You can accept the results (values) that
    are found and given on the summary screen, or make any changes to them before
    accepting. Upon clicking Next, the network configuration is written and you are
    offered the opportunity to test the Internet connection. This is useful if you
    want to download the latest release notes and updates, but you can also choose
    to skip this test.


    # Note


    The default network configuration model is automatic IP address configuration
    with DHCP.


    Three choices are offered for an authentication mode:


    +   - NIS—Network Information System—Select this option if you are using an NIS
    server to store information about your users.'
