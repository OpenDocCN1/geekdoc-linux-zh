- img_proc: true
  md: '# FIGURE 9.5


    The inittab shows a getty to start for each terminal session.


    ![](img/a66a597da3b52cd2cf8b35a8b972f497_251_0.png)


    After the system is up, the user(s) can now use it. There is a getty process running
    on each terminal that can log in that does not currently have a user (tty) for
    the user''s login name as assigned by the system administrator; this is the program
    responsible for printing the login prompt (get a tty) for the user''s login name
    when he attempts to log in.


    To log in, a user must use a valid login name as assigned by the administrator.
    Often the login is the user''s initials, first name, last name, or some combination
    of the initials or names. The user must also give a password for the login name,
    and the `/bin/login` utility accepts the password entered by the user and encrypts
    it using the same mechanism used by the `passwd` command to put the password in
    `/etc/passwd` file.


    If the encrypted values match, the password is correct. Otherwise, the password
    entered by the user is incorrect. The `login` command cannot decrypt the password
    after it has been encrypted. When the password is entered properly, the system
    updates the accounting and status information in `/var/run/utmp` and `/var/log/wtmp`
    .


    235'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# CHAPTER 9: Booting and Runlevels


    The /etc/profile shell script is run to set up the recurring variables for all
    users, and then the system runs files related to the shell in the /etc/profile.d
    directory. Following this, the system runs per-login configuration files and runs
    the user''s local login and startup files. If there are customization files within
    the home directory (such as .bashrc for BASH or .login for C shell), they are
    executed next; the user''s initial environment is configured, and the shell starts
    executing.


    # Understanding Runlevels


    Now we''ve walked through a standard boot, it is time to look at the key elements
    that were discussed—the first of which is the concept of runlevels. In a great
    many operating systems, there are only two runlevels—functioning and turned off
    (halted). In Linux, however, there are seven levels of functionality at which
    the operating system can run. These levels are shown in Table 9.1.


    # TABLE 9.1


    | RUNLEVEL | DESCRIPTION |

    |---|---|n| 0 | The system is down. |

    | 1 | Only one user is allowed in. |

    | 2 | Multiple users are allowed in, but without NFS. |

    | 3 | Multiple users and NFS. |

    | 4 | Is not used by default. |

    | 5 | Full multiuser environment with networking and X. |

    | 6 | Reboot. |


    The following paragraphs elaborate on each of the states a. bit.


    At level 0, the system is in a shutdown state requiring a manual reboot. This
    can be called a halt, or powerdown, as well as a shutdown. When changing to this
    level, files are synchronized with the disk and the system is left in a state
    in it is safe to power it off.


    Level 1 puts the system in single-user mode, and is known as administrator mode.
    This allows only one user (the root user) to access the system and prevents anyone
    else from getting in. Often, it restricts the login to only one terminal as well:
    the one defined as the console. This is the level to use when rebuilding the kernel
    and doing similar tasks.


    236'
  merge: -1
  pgno: 252
- img_proc: true
  md: 'Level 2 is multiple-user mode—allowing more than one user to log in at a time.
    This is the level at which background processes (daemons) start up and additional
    file systems (ro is always mounted), if present, are mounted. Network services
    are not enabled, and NFS is not running.


    Level 3, also known as network mode, is exactly the level 2 only with networking
    or NFS enabled. Another way to think of it is a non-graphical multiuser mode (identical
    to runlevel 5, but without the X Window System). When you choose Failsafe at the
    boot menu (shown in Figure 9.1), this is the mode you enter, as shown in Figure
    9.6.


    # FIGURE 9.6


    Booting to Failsafe brings the system up to Runlevel 3.


    ```

    Restoring the previous sound settingnStarting cups                           done

    Starting mail service (Postfix)                 done

    Loading kernel querty/as.map                     done

    Loading enable keyboard-shifter(1) latin1          done

    Starting unitecode                               done

    Loading module ext4_fs -v 6(trivial)           done

    Starting hardware scan on bootstart CRDM daemon  done

    Starting Device Group (dev)                      done

    Starting File Access Monitoring Daemon          done

    Master Resource Control: runlevel 3 has been  resolved

    Skipped services in runlevel 3:               smfs mfs powersaved

    Welcome to Mowell Linux Desktop 9 (i586)   Kernel 2.6.5.7-108-default (tty1):\linux
    login:

    Welcome to Mowell Linux Desktop 9 (i586)   Kernel 2.6.5.7-108-default (tty1):

    ux login:

    ```


    Level 4 is left to each vendor to define what he wants to define it, as if anything.


    Level 5 is traditionally thought of as a graphical multiuser mode. Here, the command
    prompt is available, and users are allowed to log in and use any of the environment.


    Level 6 represents a shutdown and automatic reboot: the same result as changing
    to runlevel 0 and rebooting the machine. It can be called a “warm boot” because
    power is never removed from the components, whereas runlevel 0 represents a “cold
    boot” because power must be turned off and then restored.'
  merge: -1
  pgno: 253
- img_proc: true
  md: '# CHAPTER 9: Booting and Runlevels


    # Note


    An easy way to summarize the runlevels is that 2, 3, and 5 are operational states
    of the computer—it is up and running, and users are allowed to conduct business.
    All other runlevels involve some sort of maintenance or shutdown operation preventing
    users from processing, with the exception of 4, which differs across implementations.


    Typing the command runlevel at a prompt will show two values: the runlevel and
    the current runlevel. For example,


    ```

    $ runlevel

    N 5

    $

    ```


    In this case, the current runlevel is 5, and the “N” means that there was no previous
    level (None). These values are derived by examining the /var/run/utmp log file,
    which keeps track of all changes. If this file is corrupt, or the values cannot
    be found within it, the only value returned is “unknown.”


    # Changing Runlevels


    An easy way to change the runlevel at which the machine is within the GUI is to
    choose Logout from the KDE menu. This brings up the prompt shown in Figure 9.7.


    Two commands can be used to change the runlevel that the machine is currently
    operating from the command line: shutdown and init. Both utilities reside in the
    /sbin directory. As a general, shutdown is always used to reduce the current runlevel
    to 0 or 1, whereas init is always used to raise it after performing administrative
    operations.


    init must be followed by a number (0–6) or the letters “S” and “s.” The numbers
    identify which runlevel to change to, and the “S” and “s” signify single-user
    mode. To change to runlevel 2, the command would be


    ```

    init 2

    ```


    # Note


    The telinit utility works the same as as init and can be used in place of it.
    It is just a link to init.'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# FIGURE 9.7

    You can choose to reboot or shutdown the system from the GUI.


    ![](img/a66a597da3b52cd2cf8b35a8b972f497_255_0.png)


    The shutdown utility offers a few more options. It informs all users currently
    logged in that the system is changing state and allows a time (delay) to be specified
    before the change takes place. Options that work with the utility are


    +   ■ -F to force fsck to run after the reboot (the default)


    +   ■ -f to prevent fsck from running after the reboot, thus creating a fast reboot


    +   ■ -h to halt after shutdown (level 0)


    +   ■ -k to send out a warning to all users but not really change state


    +   ■ -r to reboot after shutdown (level 6)


    +   ■ -t to specify the number of seconds before the change begins


    If no parameters are specified, the default runlevel shutdown attempts to go to
    level 0. An example of using the utility would be

    $ shutdown -h -t 3 now'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# CHAPTER 9: Booting and Runlevels


    This forces a change to runlevel 0 (-h) three seconds (-t) from the current time
    (now). Notice that a time must always be specified. If any other text followed
    the time, it would be interpreted as the warning message to send out to users.


    # Note


    You can also notify users using the write command to send a message to individual
    users or wall to write to all users and tell them of the upcoming shutdown.


    Finally, if you want to stop a shutdown after you have summoned it, but before
    it has begun, you can call shutdown once more with the -c (cancel) option.


    # Note


    By default, only the root user can run shutdown. You can create a file in the
    /etc directory named shutdown.allow to list all other users to be able to run
    the command.


    Three minor utilities also exist:


    +   - halt (which is similar to shutdown -h)

    - reboot (which links to halt)

    - poweroff (which also links to halt)


    Regardless of which command you use to shut the system down, you must use one
    of them to properly halt processes and close files. If you do not properly shut
    the system down, there is an excellent chance of corruption occurring within the
    filesystem.


    # The inittab File


    The main file for determining what takes place at different runlevels is the /etc/initab
    (initialization table) file. This file is colon delimited and divided into four
    fields. The first field is a short ID, and the second identifies the runlevel
    at which the action is to take place. (Blank means all.) The third field is the
    action to take place, and the last (fourth) field is the command to execute.'
  merge: -1
