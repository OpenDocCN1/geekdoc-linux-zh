  md: '# Finding Files on Your System


    If you had to think of an analogy for the find utility, it would be to the Swiss
    army knife in the real world, or to grep on steroids in the operating system world.
    This tool is capable of looking at all entries in the filesystem and displaying
    results that meet criteria. In many ways, it is the vast possibilities of the
    “criteria” you can specify allow this tool to be so powerful. The syntax is simply


    find [starting point] [criteria]


    The default starting point is the present working directory, but can be specified
    to be anything. Whatever starting point is used, the search will recursively move
    from there to all of its subdirectories.


    The criteria can be any of the options shown in Table 8.2.


    # TABLE 8.2

    Parameters for find


    | OPTION | PURPOSE |

    |---|--|

    | -atime days | Tests true if the file was accessed within the number of days
    specified. |

    | -ctime days | Tests true if the file was changed within the number of days specified.
    |

    | -exec command | Executes a command. You must specify that the command is for
    a group "{}" and continuing on "\;" |

    | -group name | Tests true if the file belongs to the specified group. |

    | -inum number | Tests true if the file has node number. |

    | -links number | Tests true if the number of links is equal to the specified
    number. |

    | -mount | Only looks on the local filesystem. |

    | -mtime days | Tests true only if the file was modified within the number of
    days specified. |

    | -name file | True only if matching the name given. |

    | -perm permission | True if matching the given permissions. |

    | -print | Prints the names of matching files. |

    | -size number | True if matching the number of blocks or characters. |

    | -type type | True if matching the specified type (d=directory, f=file, b=block
    file, c=character file). |

    | -user name | True only if owned by the named user |


