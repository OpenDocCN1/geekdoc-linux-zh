    # Using an Update CD


    Novell Desktop can be updated manually with a patch CD. Normally, when you install
    the CD into the caddy, NLD will recognize the patch CD is present and if you want
    to run it (see Figure 2.25). If the CD is not recognized, you can still start
    the installation manually. To do this, from the System menu, choose YaST, and
    then Software, and Patch CD Update.


    Once YaST begins, the installation source defaults to the CD, and you need only
    choose Next to begin the installation. Information about new updates is retrieved
    from the CD and you can select which patches/packages to install. Click Accept
    and the progress log will show the actions taking place. If there is more than
    one CD, you will be prompted to swap them as necessary.'
