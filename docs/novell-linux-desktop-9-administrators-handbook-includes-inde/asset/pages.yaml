  md: '# Administrative Services


    Two key administrative services are worth paying attention to: iManager and Patch
    Management. Each of these services is discussed in the following sections.


    # IMAN


    iManager utility is the administrative tool of the future. It replaces many of
    the standalone utilities that existed in previous versions of NetWare and allows
    the administrator the ability to work with a tool that is platform independent
    and web browser based.


    # NOTE


    One of the primary tools that iManager replaces for performing management tasks
    is ConsoleOne.


    iManager runs at port 2200, by default, and can be accessed from the NetWare 6
    Web Manager portal using the address HTTPS://{server IP address}:2200.


    # NOTE


    Although you can use either secure (HTTPS) or unsecure (HTTP) connection to access
    iManager, a secure connection is always recommended.


    When it opens, the main page has three functional frames:


    +   - Header Frame—Located at the top center, it contains these buttons: Home,
    Exit, Roles and Tasks, Configure, and Help.

    - Navigation Frame—Along the left side, it has the links that pertain to whichever
    button is chosen in the Header frame.

    - Main Content Frame—At the right side, it is the advanced administration area
    used for server management.


    iManager uses Role-Based Services (RBS) to customize its interface based on assigned
    administrative roles. Although you can customize and add more, there are five
    default iManager role categories that are applicable to most networks:


    +   - DHCP Management

    - DNS Management

    - eDirectory Administration—This can be customized further to container management,
    group management, and user management.'
  merge: -1
  pgno: 344
- img_proc: true
  md: '+   - iPrint Management—Nine tasks are available: Create Printer, Create Manager,
    Create Broker, Delete NDPS Object, Enable iPrint Access, Manage Printer, Manage
    Print Service Manager, Manage Broker, and Remote Print Manager Configuration.


    +   - License Management


    iManager uses Novell''s exeND Web platform and runs on the Apache Web Web Server
    for NetWare. It is also possible to use iManager “Simple” mode for compliance
    with federal accessibility guidelines. This mode offers the same functionality
    as “Regular” mode, but the interface is accessibility by those with disabilities.
    To use Simple mode, replace iManager.html with Simple.html in the URL.


    # PATCH MANAGEMENT


    No matter how great software is, there are always going to be situations that
    can occur and do show up until a particular set of circumstances exist. That set
    of circumstances can be anything from an abnormally high load of traffic, to hackers
    devoting all their time and energy to inflicting harm.


    As an administrator, it is critically important that you keep abreast of current
    patches and updated modules for your network. It is imperative that you understand
    that your network consists not only of the servers you administer, but also every
    workstation, laptop, and device that connects to your network.


    You can keep the servers up-to-date by checking the postings at http://support.novell.com.
    Select Product, Novell Linux Desktop, and you can find any available updates.
    Over time, patches are rolled into support packs, but not every patch is needed
    for every network. Patches and updates are also included in the Support Connection
    Library—a subscription CD regularly produced by Novell Technical Services and
    mailed.


    # TIP


    You can find patches and updates for your workstation applications by checking
    the sites of these vendors. Any network is only as strong as its weakest component,
    so you must keep all parts of the network updated and secure.'
  merge: -1
  pgno: 345
