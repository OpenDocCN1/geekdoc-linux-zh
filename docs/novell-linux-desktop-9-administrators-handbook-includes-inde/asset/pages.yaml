  md: '# CHAPTER 4: Working on the Command Line


    The simplest text processing utility of all is cat, a derivative from the word
    concatenate. By default, it will display the entire contents of a file on the
    screen (standard output). However, a number of useful options can be used with
    it, including the following:


    +   - b to number lines

    - E to show a dollar sign ($) at the end of each line (carriage return)

    - T to show all tabs as "^I"

    - v to show nonprinting characters except tabs and carriage returns


    +   - A to show the same as -v combined with -E and -T


    To illustrate the uses of cat, assume there is a four-line file named example
    with the following contents:


    ```

    How much wood

    could a woodchuck chuck

    if a woodchuck

    could chuck wood?

    ```


    To view the contents of the file on the screen, exactly as they appear in the
    preceding example, the command is


    ```

    cat example

    ```


    To view the file with lines numbered, the command, and the output generated will
    be


    ```

    cat -b example

    1 How much wood

    2 could a woodchuck chuck

    3 if a woodchuck

    4 could chuck wood?

    ```


    Note the inclusion of the tab characters that were not before, but were added
    by the numbering process. They are not truly in the file, but only added to the
    display, as can be witnessed with the following command:


    ```

    cat -Ab example

    1 How much wood$

    2 could a woodchuck chuck$

    3 if a woodchuck$

    4 could chuck wood$$

    ```


    The only nonprintable characters within the file are the carriage returns at the
    end, which appear as dollar signs.'
