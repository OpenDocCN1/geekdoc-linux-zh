- img_proc: true
  md: '# CHAPTER 4: Working on the Command Line


    The latter is often used, and favored by administrators, for the additional

    columns it adds to the display:


    ```

    $ ps -f

    UID PID CTIME TTY TIME CMD

    root 7054 7053 0 Oct12 ps -f 00:00:00 /bin/bash

    root 13745 7054 0 09:45 ps -f 00:00:00 ps -f

    ```


    There are four columns that were not there before. The first column

    ifies the user ID associated with the process. The third column is the

    Parent Process ID—showing which process reports back to. The fourth

    column identifies whether scheduling is involved, and the fifth column is the

    time at which the process started.


    # Note


    Notice when using f, the CMD now lists the entire command and not just the

    first portion, as was done with the other displays.


    These options can be combined with one another, and the most common

    combination is ef, which displays all processes in a full format.


    # Working with psstree and top


    Two commands that are closely related to ps offer slightly different views of

    t processes. The first of these is psstree, which will graphically depict the

    relationship between the processes beneath the children as shown in Figure 4.1.


    This graphically depicts the wherein main processes and shows

    where each process fits in—the process hierarchy.


    The second utility related to ps is top. Not only does it show the current

    processes, but it also stays and continually updates the display.

    Additionally, the top of the screen depicts information how many days

    the system has been, the number of users, memory and swap statistics,

    so on.


    When top is running, you can press any of the following keys to interact with

    it:


    +   - h—Help

    - q—Quit

    - s—Set the delay between updates (default is five seconds)

    - spacebar—Update rather than waiting for renewal interval

    - u—Display a single user'
