  md: '# CHAPTER 13: Living with Novell Linux Desktop


    Without much argument, it is the services that made NetWare a market leader. The
    following sections look at some of those services.


    # Directory Services


    Since the days Novell moved away from the bindery, one of the great strengths
    of NetWare has been its directory service—first known as NDS and now as Directory.
    The Directory delineates the boundaries of your network and is truly one of the
    most important services any network can offer.


    Often, icons of the globe are used in discussions of eDirectory, and this is for
    good reason. Given the scalability and robustness of eDirectory today, your network
    can easily span the world, and many do so.


    In its simplest form, you can think of eDirectory as an object-oriented, hierarchical,
    distributed—replicated—database. In reality, it is that and so much more. It holds
    data—called objects—within a logical tree structure.


    Each object is uniquely identified by the object name, or Common Name (CN) and
    an address that describes the location of the object within the tree, or Context.
    This combining the Common Name and Context creates what is known as the Distinguished
    Name. Mandatory and optional attributes are used to round out the description
    of the objects.


    There are four important benefits that eDirectory offers the network:


    +   -Discovery—The ability to search for objects or properties of objects.


    +   -Relationship—This allows information to become global, and all security can
    be managed across the network without the need to connect separately to each server
    requiring authentication at the network level instead of the server level.


    +   -Security—Rights can be granted to users or groups, and all security can be
    managed across the network within eDirectory—canceling the need to create a separate
    infrastructure. Every object within the tree can have an Access Control List (ACL)
    that holds information about which trustees have access to the object and the
    attributes for the object.


    +   -Storage—eDirectory can store data in its distributed database and protect
    it from corruption through fault tolerance and other features.


    The version of eDirectory have incremented rapidly over the years, with each successive
    version offering more features than its predecessors. To see the version you are
    currently running, you can query the DS module using the console commands VERSION
    or MODULE DS.


    324'
  merge: -1
  pgno: 340
- img_proc: true
  md: 'It has been said that eDirectory is “the heart and soul of NetWare.” In so
    many ways, that is true for it is not truly possible to have NetWare without eDirectory,
    but this service is only the tip of the iceberg as what NetWare offers, as the
    following sections illustrate.


    # Storage Services


    The need for local area networks sprang from a need for ways to share files and
    resources. To this day, NetWare still includes an outstanding network filing system
    offering the latest in file storage technology. Two key elements fall within this
    category: Novell Storage Services (SSS), and iFolder.


    Each of these is explored in the following sections.


    # NOVELL STORAGE SERVICES


    Novell Storage Services (SSS) is a 64-bit file storage and management system that
    uses free space from multiple storage devices to create an unlimited number of
    volumes. NSS can integrate with Novell Clustering Services to configure servers
    in a multimode cluster that enable resources to be dynamically transferred from
    one server to another on-the-fly.


    NSS uses five hierarchical components:


    +   - partitions—Segments of storage deposits configured for a specific operating
    system.

    - storage devices—Free space that can be gathered from unpartitioned areas of
    storage devices and organized into partitions.

    - storage devices—Hard drives, CD-ROM drives, and offline storage devices.

    - storage pools—A quantity of file system space that is obtained from one or more
    storage devices.

    - volumes—These can be logical volumes, traditional volumes, or read-only volumes.


    NSS uses overbooking (which allows the sum of the size of each volume in a partition
    to exceed the partition size) and journaling. The journaling keeps track of file
    system transactions and notes whether they are completed or undone to enable the
    file system to recover after a crash.


    # IFOLDER


    iFolder is the user interface tool that allows users to access applications and
    data through a Java-enabled web browser. iFolder lets you access your files'
  merge: -1
  pgno: 341
- img_proc: true
  md: '# CHAPTER 13: Living with Novell Linux Desktop


    from anywhere and at anytime across the Web. iFolder uses LDAP (Lightweight Directory
    Access Protocol) for user authentication and stores files in encrypted form.


    The iFolder Client can synchronize data (sending only the blocks of data that
    have changed between the local directory with the centralized iFolder server).
    The Client encrypts all files sent to and from the iFolder server and runs on
    Windows 95, 98, Me, NT, and 2000 works. After the user logs in, he sees iFolder
    icons on his desktop (a shortcut to his files) and in the Windows system tray
    (which offers access to iFolder user account information and configuration parameters).


    The iFolder Server runs on NetWare or Windows NT/200 and provides the infrastructure
    needed by the clients. It stores the encrypted files and uses LDAP for authentication
    purposes. Before users can start iFolder, you have to enable their User objects.
    This is done from the User Management button in the iFolder Management, and you
    can choose to grant permission to individuals or groups.


    # Print Services


    In the early days of networking, it used to be the case that you could run the
    wiring and set the network up in a short period of time, and then spend days trying
    to get the printing service to properly function. Those days are long gone.


    Novell iP is the latest tool for printing. Being well enabled, it allows mobile
    users to print from almost any remote locations to almost any printing devices
    through the Internet. The users just use their web browser to point, click, and
    print.


    iPrint builds on Novell Distributed Print Services (NDPS) and combines it with
    the Internet Printing Protocol (IPP) to perform a powerful service. It uses Secure
    Socket Layers (SSL) for secure encryption of all data and even allows non-Novell
    clients to print to NetWare printers.


    iPrint consists of the following software components:


    +   - Broker—Provides centralized management of print services for all the printers
    on the network.


    +   - Gateways—Handles communication between the Print Manager and the printer.


    +   - Printer Agent—Software that manages an individual printer.


    +   - Print Manager—Controls all printer agents installed on a server.'
  merge: -1
  pgno: 342
- img_proc: true
  md: 'Configuration is accomplished in only a few steps:


    +   1. Install iPrint on the Server

    2. Start iManager

    3. Create an NDPS Broker

    4. Create and Load an NDPS Manager

    5. Create NDPS Printers

    6. Configure NDPS for Automatic Installation on Workstations


    Printers are represented as icons on a map, and all redirection occurs in the
    background.


    # End User Services


    Virtual Office is a new service from Novell that lets administrators create personalized
    user portals. Those user portals are used by users to access their data and applications
    from a single website.


    Virtual Office allows you to create virtual teams on-the-fly for when you need
    a group working on a project to suddenly have access to resources through shared
    portals.


    The services are Java-based servlets or applications that are used to perform
    common network tasks


    +   * eGuide—Offers a simplified screen for accessing phone numbers and related
    user information from eDirectory.

    * E-mail and calendaring—Provides support for email applications and protocols
    as GroupWise, Microsoft Exchange, and the POP3 and IMAP protocols.

    * iPrint—As mentioned in the printing section earlier in this chapter, provides
    access to Internet printing.

    * NetStorage—Provides Internet-based access to file storage, including access
    to iFolder.

    * Password—Provides links to where users can change their eDirectory password.

    * ZENWorks—Provides integration with Novell ZENWorks for Desktops through the
    Virtual Office interface.'
