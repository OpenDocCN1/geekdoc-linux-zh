    The line, id:5:initdefault: is of great importance, as it identifies the default
    runlevel system will initially attempt to go after each block. The lines beneath
    identify at each runlevel, the shell script rc (beneath /etc/rc) is to—using a
    different variable for each level. This script looks for scripts within subdirectories
    of /etc/rc based on the runlevel. For example, there are /etc/rc0.d, /etc/rc1.d,
    and so on. Within directories are script files that start with an "S" or a "K."
    Scripts that start with "K" identify processes/daemons that must be killed when
    changing to this runlevel, and scripts starting with "S" identify processes/daemons
    that must be started when changing to this runlevel.


    # Note


    Startup and kill scripts are executed in numeric order.


    # Note


    The ‘s’entry runs the system’s initialization script before the runlevel scripts.


    The line, ca::ctrlaltdel:/sbin/shutdown -r -t 4 now defines what happens when
    Ctrl+Alt+Del is pressed. If the terminals get killed off, they are started up
    again thanks to the action of respawn. Other actions that can be specified


    +   - boot—To run at boot time

    - bootwait—To run at boot time and prevent other processes until finished

    - kbrequest—Send a request for keyboard action/inaction

    - off—Don’t run the command

    - once—Only run the command once

    - ondemand—Same as respawn

    - powerfail—Run in the event of a powerfailure signal


