- img_proc: true
  md: 'One of the best examples of this is the www service, which runs on port 80
    by default. If you make a website available to the world, using the Fully Qualified
    Domain Name (FQDN) of www.ds-technical.com, anyone in the world can enter that
    address and reach your site by making a call to port 80. On the other hand, if
    you want the site to be up, and accessible from anywhere, yet only used by your
    employees in the outbound, you can move the www service to not being used by anything
    else—15000, for example. Now, anyone entering www.ds-technincal.com will still
    be hitting port 80 and able to find the www service there. Your employees will
    use www.ds-technical.com:15000 and be able to operate as they would at a regular
    website.


    # Network Access


    You can limit access to your network host to explicitly named machines via the
    use of a hosts.allow file or a hosts.deny file; both of which reside in the /etc
    directory. The syntax within these files is the:


    daemon: group


    and they either limit who is allowed in (to those specifically named in the .allow
    file) or limit who cannot come in (to those specifically named in the .deny file).
    The use of such variables as ALL to indicate all services or ALL EXCEPT to indicate
    all a particular service are allowed in both files.


    By default, both files exist on a host, though their lines are commented out.
    To recap


    +   - hosts.allow is used to specifically list the names of other hosts that can
    access this machine through any of the /usr/sbin/tcpd services. Figure 11.10 shows
    the default copy of this file.

    - hosts.deny is used to specifically list the names of other hosts that cannot
    access this machine through the /usr/sbin/tcpd services.


    # Working with NFS, smb, and nmb


    These topics address sharing. The three components of this section have only a
    passing familiarity with each other, but all fall within the broad category of
    file/directory sharing.'
