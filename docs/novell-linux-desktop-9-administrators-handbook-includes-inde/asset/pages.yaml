    # Note


    jobs is a shell built-in command, not an actual executable; therefore, it only
    applies to jobs started by or running in the current shell.


    Jobs that were terminated (#3) do not appear, and jobs that have finished (#5)
    will only show up one time—the next time you press return in the shell after they
    have completed. (The next time jobs is run, #5 will not appear.) If the job is
    the most recent job that can run, or is running, a plus (+) will show only the
    job number of the processes. The -n references the job number brackets. The next
    most recent job is indicated by a minus sign (-). The wd information references
    the working directory.


    The -l option will add the PID numbers to the display, and the -p option can be
    used to show only the PID numbers of the processes. The -n option can be used
    to show only jobs that have been suspended.


    # fg


    A job that is running in the background can be brought to the foreground through
    the use of the fg command. The syntax for fg allows reference to a job using a
    percent sign (%) and the job number. For example, the following sequence starts
    a two-minute sleep sequence in the background, and then moves it into the foreground:


    ```

    $ sleep 120 &\n[5] 31206

