    # Creating Filesystems


    Formatting of the partitions is accomplished with the mkfs (in Make Filesystem)
    utility or mkreiserfs. mkfs is actually a wrapper program that drives other, filesystem-specific
    utilities named mkfs.ext2 (default), mkfs.reiserfs, and so on. The -t option tells
    which of these to execute. mkfs, by default, creates ext2 partitions, and mkreiserfs
    only creates reiserfs partitions.


    Because of these actions, you should use options with this to indicate the type
    of filesystem to make (-t), the device, size, and any options you want. For example,
    to format the newly created partition for DOS, the command


    ```

    $ mkfs -t msdos /dev/hda4 3040632

