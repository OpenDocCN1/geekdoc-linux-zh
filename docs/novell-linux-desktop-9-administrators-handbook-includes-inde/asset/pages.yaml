    # Changing Priorities


    When a process starts, it does so at a default priority of zero. This puts it
    on an even keel with all processes competing for attention from the CPU and other
    resources. The priorities for the processes can be changed through the use of
    two utilities, nice and renice.


    # nice


    Processes can be started at different priorities using the nice utility. There
    are forty different levels that nice can be used with (half negative and half
    positive), including


    +   - 19 (lowest priority)

    - 0 (default priority)

    - -20 (highest priority)'
