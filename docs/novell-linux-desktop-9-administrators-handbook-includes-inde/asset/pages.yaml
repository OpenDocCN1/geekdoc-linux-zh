    # is executed by the kernel on startup. It describes what

    # scripts are used for the different run-levels.

    #n# All scripts for runlevel changes are in /etc/init.d//

    #n This file may be modified by SuSEconfig unless CHECK_ITTABB

    # in /etc/sysconfig/suseconfig is set to "no"

    ```


    The default runlevel is defined here

    id5:initdefault


    ```

    # First script to be executed, if not booting in emergency (-b) mode

    sii::bootwait:/etc/init.d/boot


