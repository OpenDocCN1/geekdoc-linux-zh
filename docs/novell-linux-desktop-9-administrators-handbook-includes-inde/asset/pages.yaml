- img_proc: true
  md: '# What Is the Novell Linux Desktop?


    The book you hold in your hands is about Novell Linux Desktop—a desktop computing
    environment powered by the SUSE Linux operating system. This book describes how
    to use NLD, as well as how to administer it. Before you can truly be good at either
    of those, however, you need to understand what it is and the legacy that it comes
    from.


    This chapter offers a brief look at the history of Linux, and the product that
    you have chosen to adopt for your desktop.


    # Ancient History


    Long before there was Linux, there was Unix. The Unix operating system came to
    life more or less by accident. In the late 1960s, an operating system called MULTICS
    was designed by the Massachusetts Institute of Technology to run on GE mainframe
    computers. Built on banks of processors, MULTICS enabled information-sharing among
    users, although it required huge amounts of memory and ran slowly.


    Ken Thompson, working for Bell Labs, wrote a crude computer game to run on the
    mainframe. He did not like the performance the mainframe gave or the cost of running
    it. With the help of Dennis Ritchie, he rewrote the game to run on a DEC computer
    and, in the process, wrote an entire operating system as well. Several hundred
    variations circulated about how the system came to be named what it is, but the
    most common is that it is a mnemonic derivative of MULTICS (Multiplexed Information
    and Computing Service).


    In 1970, Thompson and Ritchie''s operating system came to be Unix, and Bell Laboratories
    kicked in financial support to refine the product in return for Thompson and Ritchie
    adding text-processing capabilities. A side benefit of this arrangement was that
    it enabled Thompson and Ritchie to find a faster DEC machine to run their new
    system.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# CHAPTER 1: What is the Novell Linux Desktop?


    By 1972, 10 computers were running Unix, and in 1973, Thompson and Ritchie rewrote
    the kernel from assembly language to C language—the brain-child of Ritchie. Since
    then, Unix and C have been intertwined, Unix''s growth is partially because of
    the ease of transporting the C language to other platforms. Although C is not
    as quick as an assembly language, it is much more flexible and portable from one
    system to another.


    AT&T, the parent company of Bell, was not in the computer business (partially
    because it was a utility monopoly at the time and under scrutiny the government),
    it did not actively attempt to market the product. Instead, AT&T offered Unix
    in source-code form to government institutions and universities for a fraction
    of its worth. This practice led to Unix eventually working its way into more than
    80 percent of the universities that had computer departments. In 1979, it was
    ported to the popular VAX minicomputers from Digital, cementing its way into universities.


    The breakup of the AT&T monopoly in 1984 enabled the former giant to begin using
    Unix openly. Although AT&T continued to work on the product and update by adding
    refinements, these unaffiliated individuals who received early copies of the operating
    system—and could interpret the source code—took upon themselves to make their
    own enhancements.


    Much of this independent crafting took place at the University of California,
    Berkeley. In 1975, Ken Thompson took a leave from Bell Labs and went to practice
    at Berkeley in the Department of Computer Science. It was there that he ran into,
    and recruited, a graduate student named Bill Joy to help enhance the system. In
    1977, Joy mailed out several free copies of his system modifications.


    While Unix was in-house at Bell, enhancements to it were noted as version numbers—Versions
    1 through 6. When AT&T began releasing it as a commercial product, system numbers
    were instead (System III, System V, and so on). The refinements at the university
    were released by Berkeley Software Distribution, or BSD (2BSD, 3BSD, and so on).
    Some of the significant enhancements to come from Berkeley include the vi editor
    and the C shell. Others include increased filename lengths; AT&T accepted 14 characters
    for filenames, and Berkeley expanded the limit to 25.


    Toward the end of the 1970s, an important moment occurred when the Department
    of Defense announced that its Advanced Research Projects Agency would use Unix
    and would build its version on the Berkeley software. This achievement gave Unix
    a national name and a feather in the cap of the Berkeley version. One of the demands
    on the operating system placed by the DOD for networking, and this moved further
    along the line of technological advancements.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# The History of Linux


    Bill Joy, in the meantime, left the campus setting and became one of the founding
    members of Sun Microsystems. The Sun workstations used a derivative of BSD as
    the Sun Operating System, or SunOS.


    In 1988, Sun Microsystems and AT&T rewrote Unix into System, release 4.0. Other
    companies, including IBM and Digital Equipment, fearful of losing their positions
    in the Unix marketplace, countered by forming a standards group to come up with
    a guideline for Unix. Both groups incorporated BSD in their guidelines but still
    managed to come up with different versions of System V.


    In April 1991, AT&T created a spin-off company called Unix Laboratories (USL)
    to market and continue development of Unix. Immediately, Nobel announced that
    would combine Unix with some of the features of NetWare''s connectivity. It finally
    came to market in November 1992, and in December of that same year, Nobel purchased
    all of USL from AT&T.


    In the early 1990s, Berkeley announced that it was in the business of providing
    education and was not a commercial software house—no more editions of BSD would
    be forthcoming. Sun, Microsystems, one of the largest providers of Unix in the
    world, quickly moved to the System V standards that had grown from enhancements
    to the original AT&T Unix. Sun''s commitment to System V was the birth of Solaris
    and the beginning of the end for SunOS, which still stumbled on for a while.


    # The History of Linux


    At the heart of every operating system is the kernel. The kernel is responsible
    for all low-level tasks and handles all system requests. You must have a kernel
    in order to have an operating system.


    In 1991, Linus Torvalds, a computer science student at the University of Helsinki,
    made freely available a kernel that he had written. The kernel he wrote mirrored
    many of the features of Unix and Minix—a version of Unix that was used in many
    university learning environments.


    Developers and programmers around the world took to the concept of an open-source
    operating system and quickly began writing and adding features. The kernel version
    quickly incremented from the 0.1.1 that was first made available to the 2.6.x
    versions available today. To this day, Linus Torvalds continues to oversee the
    refinement of the kernel.


    The GNU General Public License (GPL) that governs Linux continues to keep it open
    source and free to this day. To summarize the license, it states that every-one
    is given the same set of rights and anyone may make modifications as long as they
    make those available to all.'
  merge: -1
