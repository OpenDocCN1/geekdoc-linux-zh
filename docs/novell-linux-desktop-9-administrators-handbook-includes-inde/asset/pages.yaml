    # Creating Bootable Floppies


    As painful as it is to think about, every system runs a risk of being corrupted
    to the point at which it is no longer bootable. To prepare for this possibility,
    you should use YaST to create a set of boot (also known as *rescue*) floppy disks
    ahead of time.


    # NOTE


    There is an alternative to using the boot floppies. If you have the NLD CDs or
    DVD, and your system supports bootable drives, you can boot using the DVD or CD1.
    At the boot screen, select **Rescue System** and press **Enter**. Choose the desired
    language and press **Enter** and log in as root when prompted.'
