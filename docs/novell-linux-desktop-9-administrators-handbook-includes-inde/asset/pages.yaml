  md: '# CHAPTER 4: Working on the Command Line


    The asterisk is used to signify any and all; anything and nothing; alpha and omega.
    For example,


    ```

    ls s\*

    ```


    will find all entries (files and directories) within the current directory starting
    with the letter "s" and having any number of alphanumeric characters following—including
    none. Possible results it could generate in the display include


    ```

    s sa sam samp samp1 sample samples samples.gif

    ```


    Note that it finds "s" alone, and "s" with any number of entries following it.
    In contrast, the question mark is a placeholder for one character, and only one
    character. Using the same file possibilities, the following command


    ```

    ls s?

    ```


    will only find entries (files and directories) in the current directory starting
    with the letter "s" and having only one character following. The resulting display
    is generated


    ```

    sa

    ```


    If you want to find only five-letter entries beginning with "s," the command to
    use be


    ```

    ls s????

    ```


    To recap, the asterisk means all or none, the question mark always means one.
    These two wildcards are not mutually exclusive, and can be used in combination
    with one another as the needs arises. For example, to find only files with three-letter
    extensions, regardless of the filename, the command would be


    ```

    ls *.???

    ```


    To muddy the waters a bit, you can also use brackets [] to specify possible values.
    All the possible values must reside within the brackets and are used individually.
    For example,


    ```

    ls [de]*

    ```


    will find all entries that start with either "d" or "e" and have an unlimited
    number of characters following. To find only three-character entries that start
    with "d" or "e," the command would become


    ```

    ls [de]??

    ```


    The number of characters within the brackets can be virtually unlimited. Therefore,
    if you wanted to find all entries that start with a lowercase'
