    # NOTE


    Any user can use the passwd utility to change his password. Only the root user,
    however, can use it to change the password of another user.


    Notice that this method places the encrypted password in the /etc/passwd file
    itself and does not use the /etc/shadow file. Provided that the home directory
    exists, and the user is the owner of it, the user can now be an authenticated
    user.


    A utility provided with Linux (most vendors have their own utilities as well)
    to simplify this process is **useradd**. You must use options with the utility,
    and a key one is -D to display default settings. Here''s an example:


    # Note


    The useradd utility is intended for use when su to root. A typical user will get
    an error message when he attempts to use it.


    ```

    $ useradd -D

    GROUP=100

    HOME=/home

    INACTIVE=-1

    SHELL=/bin/bash

    SKEL=/etc/skel

    GROUPS=dialout,uucp,video,audio

    $

    ```


    These are the defaults that will be used when a new user is created with this
    utility. The defaults come from the text file /etc/login.defs. Therefore, the
    following sequence is possible:


    ```

    $ user kerby

    $ tail -1 /etc/passwd

    kerby:x:1002::/home/kerby:/bin/bash

    $ tail -1 /etc/shadow

    kerby:!12711:0:99999:7:::

    ```


