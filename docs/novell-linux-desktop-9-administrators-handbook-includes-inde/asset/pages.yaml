  md: '# Configuring Networking Services


    FIGURE 11.9

    The traceroute utility shows how hops must be made to reach a server.


    ![](img/a66a597da3b52cd2cf8b35a8b972f497_309_0.png)


    # Configuring Networking Services


    Within Linux, there is a superdaemon known as **init**, which is responsible for
    bringing up the services required at specific runlevels and maintaining the integrity
    of the system. The **init** daemon will start and stop other daemons such as the
    system logger (**syslogd**), the swapper (**kswapd**), and so on. One of the daemons
    it starts is a superdaemon over networking: **xinetd** (also known as the Extended
    Internet Services Daemon).


    The **xinetd** daemon is a replacement for **inetd** and that offers a vast improvement
    in security. The configuration options are now more modular. As an administrator,
    you should know that this daemon is a replacement for **xinetd** and can be downloaded
    from a number of sites and used in place of the original.


    # Note


    As a general rule, any process with a last character of "d" is a daemon.


    When started, the **xinetd** looks at its configuration file, **/etc/xinetd.conf**,
    and determines from what additional services it is responsible for; **xinetd.conf**
    provides the settings as well as the includes for the files in the **/etc/xinetd.d**
    directory—where the service files actually live. By default, this file exists
    on every whether it is used or not: If it is not used, most of the lines are commented
    out.


    293'
  merge: -1
  pgno: 309
- img_proc: true
  md: '# CHAPTER 11: Networking


    This file has the capability to call settings from other files and need not be
    self-contained. If you change any of the settings in this file, you must restart
    the xinetd the changes will be recognized. There are a number of ways to do this—including
    rebooting the system, starting and stopping networking, and so on. The simplest
    way of doing so, however, is to kill the xinetd daemon with


    ```

    /etc/rc.d/xinetd restart

    ```


    or


    ```

    /etc/rc.d/xinetd reload

    ```


    Then the daemon will restart—reading the configuration file when it does.


    # Note


    More information on the daemon can be found at http://www.xinetd.org/. The HowTo
    can be found at http://www.debianhowto.de/howtos/en/xinetd/c_xinetd.html.


    # The /etc/services File


    This file was mentioned earlier in this chapter, but its real usefulness is that
    it is checked to determine what particular service is to use. This ASCII file
    exists on every host by default, and divides the entries into three fields:


    +   - Service—Whatever name also appears in the /etc/xinetd.conf.


    # Tip


    Information about services that require starting/stopping is actually in separate
    files beneath the /etc/xinetd.d directory.


    +   - Port—What port to use.

    - Alias(s)—These are optional and constitute other names the service is known
    as.


    It is important to know that the ports appearing by default in the file are common
    port assignments for those services. An administrator can change the port a service
    is using for security, or other purposes. This still allows the service to run,
    but now requires the user using it to know of—and specify—the new port.'
  merge: -1
