    The result of the operation becomes


    | -rw-r-r- | 1 | root | root | 155 | Jul 19 16:48 sample |

    | -rw-r-r- | 1 | root | root | 12497 | Jul 19 16:39 snapshot01.gif |

    | -rw-r-r- | 1 | root | root | 17257 | Jul 19 16:50 snapshot02.gif |


    If the number of arguments you are giving becomes too long to be easily readable
    on the command line, or if you simply want to break up the entry by bit, you can
    use the backslash character to signify that you are continuing one line to the
    next. For example:


    ```

    ls -l sa* \ \

    *.gif

    ```


    # Tip


    The backslash actually prevents the newline from being interpreted by the shell,
    which is usually expressed as "escaping the newline." The backslash must be the
    last character on the line before the newline in order to work this way.


    If you were hundreds of such arguments, you would use the backslash following
    each entry to separate each. This would make entry easier to view and the command
    would not execute until the Enter key is pressed without preceded by a backslash.
    For example:


    ```

    ls -l sa* \ \

    *.gif \ \

    *.ead \ \

    *.txt \ \

    *.doc

    ```


