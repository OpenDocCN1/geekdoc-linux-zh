- img_proc: true
  md: '# Understanding What the Linux Kernel Is


    The following information is intended to provide a little more depth on what the
    Linux Kernel actually is. If you are experienced with other versions of Linux,
    but not NLD, you can skip this section and move on to Chapter 2, “Installing Novell
    Linux Desktop.”


    On the other hand, if you are new to Linux, you should read this section for there
    will be times when you need to have an understanding of how the operating system
    is working. This will allow you to tweak module parameters for performance or
    functionality. This is necessary when you add proprietary modules provided for
    specific devices (typically video and Ethernet cards), build your own kernels,
    and so on.


    # NOTE


    In some instances, you must build your own kernel in order to get proprietary
    modules working. Before doing so, however, you should check to verify that this
    will not void Novell’s commitment. It is possible that they will adhere to only
    supporting their own kernels as shipped.


    In order to understand how the Linux operating system works, it is helpful to
    understand the heart of it. The kernel is a software component of the operating
    system that acts as the system supervisor. The kernel provides all system services
    to the applications and commands users execute. This includes allocation of CPU
    time, memory management, disk access, and hardware interfaces. Users are not typically
    aware of the kernel functions as they are hidden from their view by the applications,
    such as the shell, that the user interacts with. The system administrator de-facto
    becomes familiar with the kernel as he does or she perform the jobs.


    When a system administrator executes a command as ps, the kernel accesses the
    system table to provide information regarding the currently running processes.
    More commonly, system administrators interact with the kernel to handle the installation
    of new hardware.


    Unlike other Unix implementations, the Linux kernel use of loadable modules to
    add new features or support for specific hardware. This provides the administrators
    with the flexibility to reconfigure their systems as required. Typical Unix implementations
    require the administrator to build a new kernel whenever a change is required
    to the kernel. Although some changes require building a new kernel, most do not.'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'Loadable modules are kernel components that are not directly linked or included
    in the kernel. The module developer compiles them separately and the administrator
    can insert or remove them from the running kernel. The scope of actual modules
    has grown considerably and now includes filesystems, Ethernet card drivers, tape
    drivers, PCMCIA, parallel port IDE, and many printer drivers. Using loadable modules
    is done using the commands listed in Table 1.1.


    # TABLE 1.1

    Loadable Module Commands


    | COMMAND | DESCRIPTION |

    | --- | --- |

    | lsmod | List the loaded modules |

    | insmod | Install a module |

    | rrmod | Remove a module |

    | modinfo | Print information about a module |

    | modprobe | Probe and install a module and its dependents |

    | depmod | Determine module dependencies |


    The commands affect the modules in the currently running kernel and will also
    review information available in the /proc filesystem. lsmod is used to list the
    currently loaded modules.


    The output of lsmod includes some header text identifying the different columns
    of data. Column one specifies the module that has been loaded, column two is the
    size of the module in bytes, column three indicates the number of references to
    the module, and column four specifies the modules that call this module.


    Removing a module with rrmod requires you to specify the module to be removed.
    The modinfo command is used to query information from the module file and report
    to the user. modinfo can be used to report


    +   - The module author

    - The module description

    - The typed parameters the module accepts'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Understanding What the Linux Kernel Is


    Bear in mind that many modules do not report any information at all. If the module
    author does not provide the information when the module is developed, there is
    nothing for modinfo to report. You can use the -a option to get as much information
    as possible, but some modules will report <none>.


    The depmod modprobe commands can also be used to load modules. Although the method
    previously reviewed can be tedious and frustrating, it is worthwhile to understand
    the relationships between the modules. depmod is used to determine the dependencies
    between modules.


    The /etc/modprobe.conf file is a text-based file that can be used to store information
    that affects the operation of depmod and modprobe. When modifying this file, remember:


    +   - Empty lines and all text on a line after a # are ignored.

    - Lines can be continued by the ending line with a backslash (\n- The lines specifying
    the module information must fall into one of the following:


    ```

    keep

    parameter=value

    options module symbol=value ...

    alias module real_name ...

    pre-install module command ...

    install module command ...

    post-install module command ...

    pre-remove module command ...

    remove module command ...

    post-remove module command ...

    ```


    In the preceding list, all values means that in the "parameter" lines will be
    processed by a shell, which "shell tricks," like wildcards and commands enclosed
    in back quotes, can be used during module processing. For example,

    path[misc]=lib/modules/1.1.5?

    path[net]=lib/modules/~uname -r


    These have the effect of values to the path to look for the system modules.

    Table 1.2 lists the legal/allowed parameters.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# CHAPTER 1: What is the Novell Linux Desktop?


    TABLE 1.2

    Allowed Configuration Parameters


    | PARAMETER | DESCRIPTION |

    |---|---|n| keep | If this word is found before any lines containing a path description,
    the default set of paths will be saved, and thus added to. Otherwise the normal
    behavior is to replace the default set of paths with those defined on the configuration
    file. |

    | depfile=DEPFILE_PATH | This is the path to the dependency file created by depmod
    and used by modprobe. |

    | path=SOME_PATH | The path parameter specifies a directory to search for the
    modules. |

    | path[tag]=SOME_PATH | The path parameter can carry an optional tag. This tells
    us a little more about the purpose of the modules in this directory and allows
    some automated operations by modprobe. The tag is appended to the path keyword
    enclosed in square brackets. If the tag is missing, the tag ignored. One very
    useful tag is boot, which can be used to mark all modules that should be loaded
    at boot. |

    | Options | Define options required for specific modules. |

    | Alias | Provides an alternate name for a module. |

    | pre-install module command | Execute a command prior to loading the module.
    |

    | install module command | Install the following module. |

    | post-install module command | Execute a command after the module is loaded.
    |

    | post-remove module command | Execute a command prior to removing the module.
    |

    | remove module command | Remove the named module. |

    | post-remove module command | Execute a command after the module has been removed.
    |


    If the configuration file is missing, or if any parameter is not overridden, defaults
    are assumed.'
