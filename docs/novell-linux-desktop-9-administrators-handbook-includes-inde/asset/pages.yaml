- img_proc: true
  md: '# Working with File Permissions and Ownership


    If you are changing a directory and want to recursively change all the entities
    beneath it, you can use the -R option.


    A cousin of the other utilities, chgrp, can be used to change the group associated
    with the entity. Once again, the -R option is available to recursively change
    all the files and subdirectories beneath a directory. The root user can make any
    group she wants, as long as she is the owner of the file and belongs to the group
    she is making the changes to.


    If you are root user and changing both the owner and group at the same time, you
    can use chown and separate the two values by a colon:


    ```

    # ls -l turbo

    -rw-rw- 1 edulaney root 14 Sep 6 22:22 turbo

    # chown kristen:business turbo

    # ls -l turbo

    -rw-rw-rw- 1 kristen business 14 Sep 6 22:22 turbo

    #

    ```


    The command will fail if either the owner or the group are not in existence. You
    can also use chown to only change the group by using the second part of the argument:


    ```

    # ls -l turbo

    -rw-rw-rw- 1 kristen business 14 Sep 6 22:22 turbo

    # chown users turbo

    # ls -l turbo

    -rw-rw-rw- 1 kristen users 14 Sep 6 22:22 turbo

    #

    ```


    # Access Control Lists


    The permissions throughout the operating system to secure files and directories
    can be loosely thought of as Access Control Lists (ACLs) for they define what
    can done with each entity. ACLs give per-user and per-group control over file/directory
    access and modification and liberate system administrators from having to create
    and manage a million special-purpose groups.


    # Note


    Linux ACLs are conceptually similar to NetWare ACL files.


    Using the getfacl utility to Get File ACL information, you see the exact information,
    only it is displayed slightly differently:


    ```

    $ getfacl turbo

    # file: turbo

    ```'
  merge: -1
