  md: '# # Introduction


    # # What Is Covered in this Book


    This book is divided into 13 chapters. Each chapter builds on the ones that have
    come before it.


    Chapter 1 explores just what the Novell Linux Desktop is and why you should consider
    it.


    Chapter 2 explains how to install Novell Linux Desktop. It also looks at ways
    to update it with service packs and keep it current.


    Chapter 3 explains the graphical interfaces. Two graphical desktop environments,
    GNOME and KDE, are included with NLD, and you can choose either or from which
    to interact.


    Chapter 4 introduces the command line—a source of great power in Linux—and introduces
    you to the most popular utilities that can be run from it.


    Chapter 5 introduces Yet Another Setup Tool (YaST). This interface simplifies
    configuration settings and provides a unified interface for many administrative
    tasks.


    Chapter 6 looks at hardware devices, such as printers, and how NLD interacts with
    them.


    Chapter 7 explains how NLD works with filesystems.


    Chapter 8 explains the files that exist in NLD and how to create and work with
    them.


    Chapter 9 discusses Boot, Initialization, Shutdown, and Runlevels.


    Chapter 10 focuses on Linux administration and the tasks you will likely face
    on a regular basis.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Introduction


    Chapter 11 looks at networking and how NLD interacts with other operating systems.


    Chapter 12 introduces security.


    Chapter 13 discusses how NLD interacts with other environments and how to use
    it in the real world.


    # What this Book Is Not


    This book is not designed to be a programmer’s guide or focus on such topics as
    kernel tweaking. Those are not part of the normal administrators role and thus
    not included in an *Administrator’s Handbook*. This is not a reference work for
    network theory, protocols, or architectures.


    This book focuses on the implementation of Novell Linux Desktop and the administration
    of it after that implementation.'
  merge: -1
