  md: '# Working with YaST


    One of the primary features differentiating Novell Linux Desktop from other implementations
    of Linux is its inclusion of YaST (Yet Another Setup Tool). This one-stop tool
    provides a convenient interface to virtually every aspect of system administration.
    The latest versions of the Desktop ship with the second version of this tool—YaST2.


    Mastering this one tool can save you a great amount of time (and often frustration)
    as it offers a simple, and convenient, interface to a number of configuration
    tasks. This chapter looks at a sampling of the administrative tasks that you can
    do with.


    NOTE


    The purpose of this chapter is to walk you through the features of YaST. Complex
    topics, such as adding users, creating groups, and so are mentioned in passing
    in this chapter as the YaST screens are shown, but they are covered in much more
    depth and detail in subsequent chapters.


    # Introducing YaST


    The YaST tool is available in Novell Linux Desktop as both a command-line interface
    and an X Window application. The command-line interface, regardless of which version
    (there are two) of YaST you are running, is an ncurses application. When YaST
    is as an X Window application, the appearance can differ based on whether you
    are using the first or second version of the tool—the first is ncurses based,
    and the second (YaST2) is Qt based.


    NOTE


    ncurses and QT are two C libraries containing standard functions that applications
    can use to perform terminal-oriented or graphical tasks. There are a number of
    other graphical libraries that people can use, but these are two of the most common.'
  merge: -1
  pgno: 139
- img_proc: true
  md: '# CHAPTER 5: Working with YaST


    Novell Linux Desktop 9 ships with YaST2 and still supports yast as a link. If
    you execute the command yast from the xterm or terminal command line, you will
    get the curses/terminal version. If you execute the command yast2 from the xterm
    or terminal command line and you are running the X Window System (the DISPLAY
    environment variable is set), you will get the graphical version.—on the other
    hand—start yast2 from the command line and you are running from a console login
    and the DISPLAY environment variable is not set, you will get the curses/terminal
    version. Last, if you start yast2 from the command line and you are running from
    a console login and the DISPLAY environment variable is set, you will get the
    graphical version on the target display.


    Most of this discussion focuses on the YaST version of the tool because of its
    ease of use and what''s most people will use in an X Window System environment
    (which is where administrators will typically be).


    The purpose of this tool is to provide a one-interface to most of the tasks an
    administrator must work with on a regular basis. Although the appearance of the
    text mode differs from that of the graphical mode, all the choices are available
    in both interfaces.


    # NOTE


    You should run yast/yast2 as root to perform system administration tasks. It is
    located in the /sbin directory, which is not in the default user''s PATH statement.


    Figure 5.1 shows the text-mode version of the tool upon startup. (You start by
    typing yast on the command line.)


    From the command line, you can type


    ```

    yast -h

    ```


    to see the help information available. You can also type


    ```

    yast -1

    ```


    to view a list of all available modules.


    In text mode, you can navigate through the menus and choices using the arrow keys
    (up and down) and the Tab key to move between boxes (Alt+Tab moves you from window
    to window). You can also use the spacebar to highlight items and Enter to choose
    them. You can press F9 to quit and F1 to bring up help (as shown in Figure 5.2).'
  merge: -1
