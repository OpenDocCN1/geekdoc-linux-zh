    # Creating Partitions


    Disks are partitioned for you during installation, and you should really only
    need to create additional partitions if you add new disks to your system. The
    primary tool to use in creating disk partitions is fdisk. The fdisk utility will
    divide the disk into partitions and write the partition table in sector 0 (known
    as the superblock). When run without parameters, fdisk brings up a menu of choices
    with which you can interact. You avoid the menu, however, and run fdisk with these
    options:


    +   - -l to list the partition tables

    - -v to print the version of fdisk only


    fdisk does not have a default device and displays a usage message if you try to
    start it without specifying a device. Also, you would never specify a partition
    to fdisk (sda1)—you can only specify devices because it is a disk partitioner.


    After the utility has started, entering m provides for help in the form of a menu:


    ```

    a toggle a flag

    b edit bdisk label

    c toggle the dos compatibility flag

    d delete a partition

    l1 list known partition types

    m print this menu

    a add a new partition

    o create a empty DOS partition table

    p print the partition table

    q quit without saving changes

    s create new empty Sun disklabel

    ```


