    # Working with grep


    The utility with the funny name (something common in Linux) is really an acronym
    for the function that it performs: “Globally look for Regular Expressions and
    then Print the results.” Layman’s terms, it is one of the most advanced search
    utilities you can use. In order to be proficient with it, however you must understand
    what a regular expression is and how to use it in searching for matches to a query.


    There are a number of rules for regular expressions, and these eight constitute
    the most important:


    +   Any non-special character will be equal to itself.

    Any special character will be equal to itself if preceded by a backslash (\).

    The beginning of the line can be signified by a caret (^), and the end of the
    line by a dollar sign ($).'
