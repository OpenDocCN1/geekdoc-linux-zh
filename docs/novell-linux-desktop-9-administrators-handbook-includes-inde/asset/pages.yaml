  md: '# CHAPTER 8: Working With Files


    For example, to find all files on the system, beginning with the root directory,
    that are named `grep`, you would use these specifications:


    ```

    $ find -name "grep"

    /usr/bin/grep

    ```


    Notice that the `-print` option did not need to be specified: This is the default
    action. Notice also, unlike `locate`, it found an exact match and not just entries
    that had the four letters somewhere in the name. If you want to find matches that
    are any of words, you need to use the asterisk (*) wildcard `find -name "*grep*")`.


    When you find the match, you can perform an action on it, such as obtaining a
    long list:


    ```

    $ find -name "grep" -exec ls -l {} \\

    -rwr-xr-x 1 root root 70652 Aug 11 1999 /usr/bin/grep

    ```


    # Note


    Be careful with the -exec option, as you can specify anything following it—including
    move, remove, and so on. The option -ok can be used in place of -exec to force
    a prompt before every action is taken.


    To find which files have been accessed, use the `-atime` option. If the number
    following is preceded by a plus sign (+), it returns entries in which the access
    day was more than the number given. If the number following is preceded by a minus
    sign (-),it returns entries in which the access day was less than the number given.
    For example, to find files beneath the current directory that have not been accessed
    for 10 days or more, specify +10:


    ```

    $ find -atime +10

    ```


    To find files that have been accessed within the last two days, specify `-2`:


    ```

    $ find -atime -2

    ```


    To find only directories beneath the current directory, specify `-d`:


    ```

    $ find -type d

    ```


    To find all files associated with user `edulaney`, use the following command:


    ```

    $ find -user edulaney

    ```


    The result will include directories and files that are visible and hidden.'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# Three Utilities of Note


    There are three utilities with specific purposes that can be very useful to an
    administrator in specific circumstances: xargs, tee, and touch. Each of these
    is covered in the following sections.


    # xargs


    To understand the power of the xargs utility, consider the find utility, which
    is limited in the results it can return to values within the filesystem structure.
    The only real text within the structure is the name of the entity and not the
    data itself. (The pointer points to that.) To illustrate, suppose that the user
    edaney put out a memo several months back on acceptable use of the company refrigerator
    in the break room. Since then, user edaney has quit the company and several new
    employees (who would benefit from knowing this policy) have joined. You want to
    find the file and reprint it.


    About the closest you can get to accomplishing this with find (and its results)
    would be


    ```

    $ find / -user edaney -type f -exec grep -i refrigerator {} \\

    stored in the refrigerator overnight will be thrown out $

    ```


    The f option must be used, or else errors will occur every time grep tries to
    search for a directory. In the case of the line there is no way of knowing what
    file it is contained in. The command


    ```

    find / -user edaney -type f -exec grep -i refrigerator {} \; -print

    ```


    will show the filename for any matches of the grep clause, but only after the
    results of the grep finish.


    Enter the xargs utility: Analogous to a pipe, it feeds output from one command
    directly into another. Arguments come into it are passed through no changes, and
    turned into input into the next command. Thus, the command can be modified to


    ```

    $ find / -user edaney -type f | xargs grep -i refrigerator

    home/edaney/fileone:stored in the refrigerator overnight will be

    thrown out $

    ```


    The desired file is indicated, and can now be found and printed for the new employees.'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# CHAPTER 8: Working With Files


    Food for thought: If xargs works like a pipe, why wouldn''t the following command
    suffice?


    ```

    $ find / -user edulaney -type f | grep -i refrigerator

    ```


    Answer: Because the grep operation would take place on the names of the files,
    not the content of the files. The xargs utility pipes the entire name (thus the
    contents) into the next command in succession (grep, in this case), not just the
    resulting filename.


    # tee


    There is a miscellaneous utility that stands alone and does not fit well with
    any direction: tee. This utility, as the name implies, sends output to two directions.
    The default for most processes is to write their output to the screen. Using redirection
    (>), you can divert the output to a file, but if you want to do?


    The tee utility enables to output to the screen and a file as well. The utility
    must always be followed by the name of the file that you want output to write,
    for:


    ```

    $ ps -f | tee example

    UID PID PPID STIME TTY TIME CMD

    root 19605 19603 0 Aug10 pts/0 00:00:34 bash

    root 30089 19605 0 Aug20 pts/0 00:00:00 vi fileone

    root 30425 19605 0 Aug23 pts/0 00:00:00 paste -d fileone

    filetool?

    root 32040 19605 0 Aug22 pts/0 00:00:00 cat

    root 1183 19605 0 Aug23 pts/0 00:00:00 awk -F: questions

    root 30778 19605 0 14:25 pts/0 00:00:00 ps -f

    ```


    ```

    $ cat

    UID PID PPID STIME TTY TIME CMD

    root 19605 19603 0 Aug10 pts/0 00:00:34 bash

    root 30089 19605 0 Aug20 pts/0 00:00:00 vi fileone

    root 30425 19605 0 Aug20 pts/0 00:00:00 paste -d fileone

    filetool?

    root 32040 19605 0 Aug22 pts/0 00:00:00 cat

    root 1183 19605 0 Aug23 pts/0 00:00:00 awk -F: questions

    root 30778 19605 0 14:25 pts/0 00:00:00 ps -f

    ```


    As illustrated, the output appears on the screen and is written to the file as
    well. This can be an extremely useful utility whenever a file is needed and you
    want to view the output.'
  merge: -1
  pgno: 244
- img_proc: true
  md: '# Three Utilities of Note


    # Note


    tee only copies standard output. It will not copy standard error.


    # touch


    Essentially three dates are associated with a file or entry: creation, modification,
    and access. Using the touch utility, you can change the access and modification
    time associated with a file:


    ```

    $ ls -l1 brio

    -rw-r-r- 1 root root 28 Aug 22 10:26 brio

    $ touch brio

    $ ls -l1 brio

    -rw-r-r- 1 root root 28 Aug 30 16:01 brio

    ```


    A few options can be used with the touch utility as well, as summarized in the
    following table:


    | Option | Purpose |

    | -a | Only changes the access time |

    | -m | Only changes the modification time |

    | -r | Uses the time/date associated with a reference file to make the change
    instead of the current time/date |


    An example of the latter would be


    $ ls -l1 tuesday wednesday

    -rw-r-r- 1 root root 85 Aug 22 10:26 tuesday

    -rw-r-r- 1 root root 85 Aug 29 13:08 wednesday

    $ touch tuesday -r wednesday

    $ ls -l1 tuesday wednesday

    -rw-r-r- 1 root root 85 Aug 29 13:08 wednesday

    -rw-r-r- 1 root root 85 Aug 29 13:08 wednesday


    # Note


    If you use the touch utility with the name of a file that does not exist, it will
    create the file with the current date and time and a size of 0.'
  merge: -1
