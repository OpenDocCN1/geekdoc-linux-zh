  md: '# Working with Filesystems


    The filesystem is what allows you to create, access, and work with files. An operating
    system without a filesystem is like a sandwich without bread—you still have something,
    but it can hardly be called a sandwich.


    Many of the files stored in a filesystem actually hold the utilities, startup
    scripts, and other binaries (including the kernel) that an operating system requires
    in order to start, run processes, and so on. Without a filesystem—or at least
    a disk partition (in embedded devices)—in which to store the kernel, you can''t
    boot.


    This chapter looks at the filesystem and the utilities used to work with it and
    the associated media. It sets the foundation for the following chapter, which
    focuses exclusively on how to work with files.


    # The Standard Disk Layout


    During the installation of Novell Linux Desktop, a number of directories are created
    to hold system files. By default, the file structure depicted in Figure 7.1 is
    created.


    Together, these directories adhere to the Filesystem Hierarchy Standard (FHS),
    which all implementations of Linux follow. Each of these directories is discussed
    in the following sections.'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# CHAPTER 7: Working with Filesystems


    FIGURE 7.1


    The standard directory layout after installing Novel Linux Desktop.


    ![](img/a66a597da3b52cd2cf8b35a8b972f497_190_0.png)


    # ## NOTE


    More information about the Filesystem Hierarchy Standard can be found at http://www.pathname.com/fhs/


    # # The Directory


    Everything begins at the root directory (/). This is the beginning directory of
    everything else becomes a subdirectory, or component beneath the root directory.
    It does not appear in Figure 7.1, per se, because all the entries that appear
    in figure are directories of it.


    When specifying locations and absolute addressing, you always start with the root
    directory; it is impossible to go back any further. The single and double period
    appear at the top of the listing in Figure 7.1 are shortcuts that appear in each
    directory. The single period (.) is a shortcut for the directory you are currently
    in, and the double period (..) is a shortcut for the parent directory of this
    directory. In the case of /, there is no parent directory for it, but the shortcut
    appears in the listing anyway.


    174'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# The bin Directory


    The bin directory holds the binaries (executables) that are essential to using
    the Linux operating system. A large number of the utilities discussed thus far
    are located here, including


    +   - cat

    - cp

    - date

    - gzip

    - ls

    - mkdir

    - mv

    - ps

    - rm

    - vi


    As a rule of thumb, the executable/binary files located in this directory are
    available to all users. Binary files that are not critical to the operation of
    the system or needed by all users are commonly placed in /usr/bin instead of here.


    # TIP


    If a disk, partition, or filesystem is corrupted, it won''t mount at boot time.
    In order to repair it, you need some core binaries, which are those stored in
    /bin and /sbin.


    # The boot Directory


    The boot directory houses the files needed to boot the system, as well as configuration
    files used by servers to start system services, as well the kernel. In some implementations,
    the kernel is stored in the / directory (a holdover from the days of Unix); but
    in newer versions, /boot is used. This directory contains all the files needed
    to boot (including the kernel and its configuration file) except the individual
    service configuration files.


    # THE dev Directory


    The dev directory holds the device definitions (known as nodes). When you drag
    a file to a graphical icon of the floppy drive on the desktop, it is'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# CHAPTER 7: Working Filesystems


    possible because a definition for the floppy drive is held in the /dev directory.
    A definition file is associated with every device, whether it is a terminal, drive,
    and so on. Their major and minor numbers tell the system what to address them
    and which drive to use.


    The first character of the permissions on files in this directory is either "b"
    or "c" to indicate how data is read—by block or by character. Typically devices
    that require constant interaction such as the mouse, terminal (tty), and such
    are character-based. Devices that read and write data in blocks—groups of bytes/characters
    instead of characters—such as floppy drives, memory (RAM and ROM), CD drives,
    and such are block based.


    Some of the entries you will find beneath are for the floppy, printer, and terminals.
    Examples include /dev/tty* for terminals, /dev/pty* for pseudoterminals used by
    network processes such as telnet, /dev/lp* for printers, /dev/fd* for floppies,
    and /dev/hd* for IDE disks.


    # The etc Directory


    In everyday language, "etc" is used to mean "and so on.\ In the Linux world, however,
    the etc directory is used to hold system and service configuration files that
    are specific to this machine. For example, DS Tech Corporation and Mercury Corporation
    can both install the same version of Linux on Intel-based machines at their sites.
    When they do, both will have root directories, both will have /bin directories
    with matching utilities in them, and so on.


    One major difference between the two machines will be the values that can be found
    in the /etc directory. The users who log on at DS Tech are not the same as those
    who can log on at Mercury; thus, information about user accounts are stored in
    /etc. The groups are not the same at the two organizations; again, those related
    files will be stored here. Other files include


    +   - motd—The Message of the Day file for displaying text when logging on

    - X11—A directory containing configuration information for the X Window System
    and graphical applications that use it

    - HOSTNAME—The name of the machine

    - hosts—a file that maps host names to IP addresses for other machines available
    through a network

    - SuSE-release—The version number of the server'
