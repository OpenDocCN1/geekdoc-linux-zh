  md: '# Working on the Command Line


    The lowest common denominator across all versions and implementations of Linux
    is the command line. This chapter provides you with the core set of skills that
    you must know in order to work effectively with any Linux implementation.


    # Basics of the Command Line


    To understand the command line and work there effectively, you must understand
    the processes that are taking place. Within Linux, the shell is the command interpreter.
    It takes commands that a user gives, processes them (or sends them to the appropriate
    utility/interacts with the kernel), and formats the finished results for the user.
    Thus, the shell is the mediator between the operating system and the user. Not
    only can it interpret commands, but it can also handle redirection (input and
    output), filename generation, some programming, variable substitution, piping,
    and a host of other services.


    A number of different shells (interpreters) are available, and different distributions
    include different combinations of choices with their operating systems. The simplest
    of all is the Bourne shell (sh), which is one of the earliest created for the
    Unix platform and it offers the smallest number of features. The Korn shell (ksh)
    is one of the first to expand on, sh, and it includes a larger number of options.
    The Bourne Again shell (bash) took'
  merge: -1
  pgno: 75
- img_proc: true
  md: '# CHAPTER 4: Working on the Command Line


    many of the features from Korn, and some new ones, and combined with sh, while
    trying to reduce deviations. The Z shell (zsh) is the largest shell of all and
    added a whole new set of features to the Korn shell.


    Not to be overlooked shells created to make the environment more friendly to those
    familiar with the C programming language. The first of these was the C shell (csh),
    which added C-like features to the interpreter and deviated greatly from the Bourne
    shell. It has been expanded by Tom''s C shell (tcsh).


    As a generalization, every distribution includes more than one shell for the user
    to choose from, but rarely do they include all the available shells. In many versions,
    there are three prevalent shells:


    +   - bash

    - tcsh

    - zsh


    Note


    All shells reside in the /bin directory, and the default can be specified for
    the user''s /etc/passwd file entry.The /etc/shells file lists the shells that
    each user can have as valid shell entries in /etc/passwd.


    There are slight deviations in the way each shell carries out its tasks, but all
    perform a core set of functions. Throughout this section, we will look at the
    core functions for all shells and discuss any relevant differences, as they apply.


    # Command-Line Interaction


    When a command is entered, the shell must determine if the command is for it (built-in,
    or internal) or not (external). If the command is an internal one, it does the
    processing and sends the output without further interaction being needed. If the
    command cannot be found within the shell itself, it is assumed to be an external
    utility (such as ls, cat, cal, and so on). The command syntax for external commands
    is always assumed to be


    ```

    {program name} {option(s)} {argument(s)}

    ```


    Although it is not always the case, usually there are three components that can
    be given to a command. The simplest command to give is simply the name of the
    utility, for example:


    ls'
