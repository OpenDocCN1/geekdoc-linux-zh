    | 7 | HPFS |

    | 82 | Linux Swap |

    | 83 | Linux Native |

    | 85 | Linux Extended |

    | 86 | NTFS |

    | 1b | Windows 95 FAT32 |


    At the very least, your Linux system will require the following:


    +   - A boot partition

    - A swap partition


    You can also have any other primary or extended partitions as desired. It is recommended
    that you use a primary partition for the boot partition. This ensures recovery
    in case of problems later, as only a small amount of data is lost.



    While running, Linux will swap pages of memory out to disk when the contents have
    not been used for some time. This is much slower than adding more physical memory.
    If you find your system is swapping a lot, it is time to add more memory.


    As discussed earlier, if necessary you can fit everything, in a single partition.
    However, this does limit how the filesystem is managed and the growth of the data
    within the filesystem. For example, if your user mailboxes are on the root filesystem
    and it fills up, the system will effectively hang.


    # NOTE


    All Linux distributions, including NLD, use swap partitions by default. You can
    use swap files, but they''re a last resort without adding disks to systems with
    free partitions.


    Despite the ability to run everything in one partition, this is not good practice.
    The filesystems listed in Table 7.2 are good candidates to be placed in their
    own partition.


