- img_proc: true
  md: '# Working with Processes


    In this section, you''ll learn about utilities used to manage a process and see
    how processes are utilized for all transactions. In the previous sections, many
    utilities and commands were discussed—each time one of them is issued, a process
    is started to run the utility, and as you will see in greater detail.


    # What Is a Process


    Crucial to understanding this section is knowing that a process is any instance,
    command, or utility in execution. When you issue the command ls, discussed earlier,
    a process is started to return the results.


    Even the shell which you are interacting is running as a process. When you give
    a command to be carried out, the shell will look to see if it can do without any
    outside help. (Assume that the command was really just an empty line: no utilities
    are needed to return another prompt.) If your shell cannot perform the command,
    it will call another process to perform the action. The other process is a child
    to your shell, which becomes a parent to the new process.


    When the child has completed performing its task, it returns its results to the
    parent, and then goes away. Because Linux is a multitasking operating system,
    there can be more than one child for any given parent. If the child cannot perform
    all the tasks on its own (think of compiling an annual report), the child might
    need to call one or more additional processes. When it does this, it becomes the
    parent to those child processes.


    Note


    Barring any restrictions coded into it, every process has the capability to be
    a parent or child, though many don''t.


    On a system, at any given time, there will be processes that you are running,
    there might be processes that others are running, and there will be processes
    that system itself is running. The latter are often daemons—services that are
    running without interaction to provide functionality to the operating system.
    Examples of services daemons can perform printing, running scheduled jobs, sending
    mail, monitoring run state, and so forth.'
  merge: -1
  pgno: 107
- img_proc: true
  md: '# CHAPTER 4: Working on the Command Line


    # Working with ps


    The ps command is the one key command for listing processes and process status.
    When run by itself (no options), ps will show the processes that you are currently
    running, with the last line being itself. (It is a running process as well.) For
    example,


    ```

    $ PID TTY TIME CMD

    19605 pts/0 00:00:34 bash

    30089 pts/0 00:00:00 vi

    30425 pts/0 00:00:00 paste

    32040 pts/0 00:00:00 cat

    1183 pts/0 00:00:00 awk

    30679 pts/0 00:00:00 ps

    $

    ```


    The first column is the process ID number—this is a unique number assigned to
    every process that executes. Each process created on the system is assigned an
    incremental ID by the system. This process ID is discarded when the process terminates.
    PIDs are not reused until the system reaches the maximum process ID defined on
    the system; at which point, the system begins reallocating process IDs with the
    lowest process ID not currently associated with a running process.


    The second column indicates the terminal with which the user responsible for the
    process is associated. This is because the default scope of ps is the current
    shell, not the current user. Users running multiple terminal sessions of xterms
    will only see the listing of processes spawned by the current shell, not all processes
    on the system associated with the current user.


    The third column indicates the amount of processor that the process is using.
    In many cases, processes can run quickly, idle, and so, and use very little time.
    A very high time reading can indicate a process that is dragging the performance
    of the system.


    The fourth column is the name of the (command) itself. In the first line, there
    is the shell—which must be there, or there would not be a user at all; The user''s
    shell is known as the session leader. The last line is the command that just executed.
    These entries are between other processes that the user is running.


    The ps utility has a number of options to make it more flexible. The -a option
    removes obvious choices. For example, you know that you must have a shell running
    or you would not be interacting with the system, so it''s really important to
    see that as others. Using the -a option, the display changes just slightly:'
  merge: -1
  pgno: 108
- img_proc: true
  md: '```

    $ ps -a

    PID TTY TIME CMD

    30089 pts/0 00:00:00 vi

    30425 pts/0 00:00:00 paste

    32040 pts/0 00:00:00 cat

    1183 pts/0 00:00:00 awk

    30685 pts/0 00:00:00 ps $

    ```


    # Note


    ps -a will show all processes associated with the current tty except the session
    leader. Also note that the PID associated with ps increments with every running,
    as each requires a new process. It does not increment by one, in this case, for
    several other processes ran (probably in the background) between the first and
    second run of ps.


    Using the -A or the -e option (or everything), it is possible to see every process
    running and not just linked to the current tty. There are several things to notice
    in the display that it produces. In no particular order, they are as follows:


    +   - Processes started when the system came up the lowest number PIDs (items
    1 through 19). As a general rule, these are mission-critical processes, and if
    they were not there, some or all of the system would be unusable.

    - Not all processes are tied to a terminal. If a question mark (?) is present,
    it indicates that the process is running on the system without terminal interaction
    and/or without terminal being default standard output.

    - For every terminal without a user, there is a getty, or mingety. This process
    starts and waits for a user to attempt to log. Even though no user is using tty
    through getty6, it is easy to see that six other terminals can be used. "getty"
    means "get tty”—wait to get login information from tty/terminal. "mingety" is
    "minimal getty." Most Linux systems use mingety or getty—getty.


    Other options that can be used to determine what information to display


    +   - 1 to display a long listing (thinking of 1 ls -1)

    - u to show username and related stats

    - f to show a full listing (add process, parent process, scheduling, and time
    information)'
