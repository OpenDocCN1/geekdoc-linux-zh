    - Subnet mask

    - Default gateway


    Note

    Technically, you need to configure IP and subnet. Gateway is optional and only
    needed if you want to move off your subnet.


    Each of these three values is examined in the following sections.


    # IP Address


    Every host on a TCP/IP network must have a unique IP address. An IP address is
    made up of values from a 32-bit binary number. Because it is next to impossible
    to memorize 32-bit binary numbers, IP addresses are usually written in the form
    of four decimal number octets. The first octet identifies the “class” of address
    that it is, which determines the number of hosts available on the network as shown
    in Table 11.2.


    Table 11.2

    Available Host IP Addresses

    | CLASS | ADDRESS | NUMBER OF HOSTS AVAILABLE | DEFAULT SUBNET MASK |

    | A | 01-126 | 16,777,214 | 255.0.0.0 |

    | B | 128-191 | 65,534 | 255.255.0.0 |

    | C | 192-223 | 254 | 255.255.255.0 |

    | D | 224-239 | Used only for multicasting and cannot be assigned to individual
    hosts |

    | E | 240-255 | Reserved addresses that cannot be issued |


    The first octet cannot 127 because 127.0.0.1 is reserved for a loopback address
    to always signify the current host. Depending on the class, the second through
    fourth octets are used to identify the network and the host.


    It is important to understand that the IP address must be unique within the realm
    of the network the host communicates with. If the host is connected only'
  merge: -1
