    # Maintaining Effective Backups


    Every system has the capability (sad to say) to crash. When it does, the operating
    system can be reinstalled from the media it came upon and you can start over.
    What cannot be reinstalled from that media is all the data you''ve created since
    the system was started up. Enter the lifesaving backups.'
