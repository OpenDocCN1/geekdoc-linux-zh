  md: '# Working with the Desktop Environments


    Although many administrators are perfectly content to work at the command line,
    Linux offers a number of excellent graphical interfaces to choose from based on
    the X Windows System. Novell Desktop Linux includes two of these: KDE and GNOME.
    During installation, you can choose which of the two you want to install, and
    you can add the other at any point after the installation (see Chapter 5, “Working
    with YaST”), if you choose to do so.


    Each desktop has its own set of equivalent applications, and you can even run
    applications for one desktop under the other if the right libraries are present.
    As mentioned in Chapter 2, “Installing Novell Linux Desktop 9,” KDE is the desktop
    environment that is most widely used by SUSE Linux, but Novell is leaning more
    toward GNOME on Novell Linux Desktop, and most new tools are written for it.


    In this chapter, we''ll first look at the GNOME interface and the elements of
    it. Following that, we''ll look at the KDE interface.


    # An Overview of GNOME


    During installation, you can choose either KDE or GNOME as the default desktop
    environment for your system. GNOME is chock-full of features, and Figure 3.1 shows
    the opening screen, whereas Figure 3.2 shows the Nautilus browser graphically
    depicting the computer.


    NOTE


    If both KDE and GNOME are installed, you can click on Session on the Novell Linux
    Desktop login screen and choose between GNOME Desktop or KDE Desktop. A third
    choice, Failsafe, also appears and is used for troubleshooting.'
  merge: -1
