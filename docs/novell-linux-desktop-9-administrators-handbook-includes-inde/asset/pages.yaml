  md: '# CHAPTER 9: Booting and Runlevels


    There must always be a minimum of two partitions: the filesystem itself (often
    referred to as root) and a swap partition. The swap partition is the memory and
    some hard drive space. The swap partition is always a minimum of the amount of
    RAM installed on the machine, but can be more. The ability to use a swap partition
    greater than the amount of installed RAM is known as using virtual memory.


    The menu.lst file can be edited and changed with any editor, and the options are
    immediately available at boot time. More information on GRUB can be found at:
    http://www.gnu.org/software/grub/grub.html.


    # Related Boot Files and Utilities


    There are a few files and utilities to be aware of discussing booting—the first
    of which is dmesg. This utility enables you to display boot messages generated
    by the kernel and the system startup process. By default, when you type in dmesg,
    the messages are displayed from the kernel''s message buffer to your screen. If
    there is a problem, however, and you want to save the messages for troubleshooting
    purposes, you can use this command:


    dmesg > {filename}


    The listing that is returned is lengthy, but it is important to check as it can
    be an invaluable aid in troubleshooting.


    As you look at the file on your system, notice the order of operations as the
    system comes up. Notice, as well, how the first line identifies the kernel version
    and vendor.


    Other files to be aware of


    +   * /var/log/messages

    * utmp

    * wtmp


    The first file, messages, is written to by cron and other processes (any process
    that uses syslog or klogd) and can be useful in troubleshooting problems. Some
    of the contents of this file are displayed by the dmesg command.


    The utmp and wtmp files are log files that act as counterparts of each other and
    exist in /var/run and /var/log, respectively. By default, when the system comes
    up, entries are written to utmp, and when the system goes down, entries are written
    to wtmp.'
