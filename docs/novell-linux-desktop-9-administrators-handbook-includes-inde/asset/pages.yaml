    TABLE 4.4 offers some examples and elaboration on each of the preceding rules.


    # TABLE 4.4

    Using Regular Expressions


    | RULE | CHARACTERS | SEARCH RESULT |

    |---|---||

    | 1 | c (any character without a special purpose) | Matches "c" anywhere within
    the line. |

    | 1 | apple | Matches "apple" within the line. |

    | 2 | $ | The end of the line (every line). |

    | 2 | \$ | Every line that contains a dollar sign. |

