  md: '# Managing User Accounts


    Note


    Managing users through YaST, the graphical interface, is discussed in the “Working
    with Security and Users” in Chapter 5.


    After an account has been created, you can manage and modify it manually or through
    the use of utilities. For example, if a user named Dulaney gets married, and her
    name changes to Karen Brooks, you can edit the passwd shadow files and change
    the first field of each kdulaney to kbrooks. Because the UID is in place, all
    files and those associated with her continue remain as well. The home directory
    can be renamed, and the change made in passwd and username match for administrative
    purposes.


    As another example, if Karen gets promoted to administration, it might be necessary
    to remove her from the users group and place her in the root group. This can also
    be accomplished by manually editing the /etc/passwd file and changing the GID
    field. Similar examples can be given, endlessly, for each field within the files.


    Note


    The usermod utility should be used by su or the root user.Typical users will get
    an error message when they attempt to use it.


    Just as useradd is intended to simplify the addition of users to the system—and
    avoid manual entries—usermod is meant to simplify changing existing values. Options/flags
    must be used with the utility, and these are the possibilities:


    +   - c to replace the descriptive text with a new value.

    - d to alter the home directory.

    - e to change the password expiration date.

    - f to set the inactive parameter.

    - G to change secondary group membership. More than one group can be given as
    list as commas separate entries.

    - g to change the GID.

    - -1 to change the login name.

    - -m (must be used with -d) to make the new home directory.

    - p to change the password.'
