    # Working with cd and pwd


    The **cd** command is used to change the directory you are working in. If you
    enter the command with no parameters, it will move you to whatever directory is
    defined by the HOME variable. If you specify any parameter with it, it is seen
    as denoting the directory you want to change.


    Some characters that can be of great use with **cd** are the single period (.)
    and double period (..). The former represents whatever directory you are currently
    in, whereas the latter represents the parent directory of the current one.


    The **pwd** utility shows the working directory—the one you are currently in.
    The same value that it returns is contained in the environmental variable PWD.'
