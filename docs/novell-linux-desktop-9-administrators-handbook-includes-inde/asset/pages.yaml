  md: '# Preface


    When Novell began purchasing leaders in the open source world, they committed
    to creating and releasing the best software offerings on the market. To this end,
    they refined the SUSE server, released Open Enterprise Server, and—best of all—brought
    an open source–friendly solution to the desktop with Novell Linux Desktop 9.


    This powerful operating system incorporates the best of the SUSE desktop with
    features of Xianian and the engineers at Novell. To say that it will meet your
    needs is an understatement akin to saying that a luxury car will take you to the
    grocery store—it will do that and so much more.


    This book is an administrators’ handbook, designed to be your reference to the
    operating system. It takes the stance that you are and/or have been a Novell administrator,
    and are probably new to Linux and open source. With that in mind, it walks through
    the elements of the operating system that you need to know in order to effectively
    manage it.


    This book contains overviews, installation procedures, configuration options,
    and reference materials—all that you should need in order to successfully incorporate
    Novell Linux Desktop into your environment and administer it. After you read this
    book, keep it on a shelf nearby and use it when you need to find reference information
    to make your job easier.'
  merge: -1
