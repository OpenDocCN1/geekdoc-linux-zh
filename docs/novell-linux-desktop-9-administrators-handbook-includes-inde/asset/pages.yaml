  md: '# Working with grep


    # Note


    You can also modify it to use a logical "or" (| |) to tell you the user has not
    come in yet if the operation fails:


    ```

    who | grep "karen" | echo "She has not come in yet"

    ```


    The | operator tests the return code from the previous portion of the command
    was a "success" and does something if not.


    The -c option is used to count the number of lines that would be displayed, but
