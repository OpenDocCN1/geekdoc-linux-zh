  md: '# Security


    This chapter discusses security and issues related to it. The Novell Linux Desktop
    is an extremely secure operating system, when administered appropriately, and
    can easily meet the needs of the most stringent computing environment.


    # Applying Common Sense


    Common sense is always the guiding factor when applying security to a system,
    to a network, or to the Internet. If you apply no security whatsoever, you run
    the risk of someone accessing your data who otherwise should not. They they do
    with the data after accessing it is anyone''s guess: They can use it to underbid
    you or steal trade secrets, they can mischievously delete it, or they can alter
    it in a myriad of ways.


    On the other hand, if you apply too much security to a system, you make it too
    difficult to use. For example, to prevent anyone from seeing the files on a system,
    simply unplug the system and smash the hard drive with a hammer. Although no one
    would disagree that it is overkill, it accomplishes the purpose.


    Somewhere between no security and total security resides a level of comfort that
    you must find and apply. That level depends on such factors as the value of the
    data you are securing, the type of access (local, remote, dial-in) that users
    use, and so on. That level of comfort can always be changing, as well being acted
    on by extraneous factors. For example, if you''ve just heard that another division
    in your company is having trouble with break-ins, you will want to increase your
    security, and so on.'
  merge: -1
  pgno: 319
- img_proc: true
  md: '# CHAPTER 12: Security


    Under all conditions, some commonsense rules should be applied:


    +   - Remember the entire environment is only as secure as its weakest component.
    For example, if you make NLD as secure as possible, yet store the user data files
    on a server that is not secure, you are not running a secure environment at all.

    - Secure the physical environment. If host machines are providing services and
    are not used by users in front of them, there is no reason why those machines
    need to be sitting in the middle of the office. Move those machines to secured
    wiring closets and reduce the risk of someone simply sitting down in front of
    them and accessing data.

    - Pay attention to ambient factors. Data does not get corrupted by system users—it
    can get corrupted by system failures—to reduce system failures—and hence potential
    data corruption—pay attention to such items as proper electrical leads (use an
    uninterruptible power supply—UPS), and don''t run over objects that cause electromagnetic
    interference (EMI), as fluorescent lighting or electric motors. Pay attention
    to motion conditions, and so on.

    - Before you install any software, verify that the software is clean. This can
    prevent you from adding rogue processes to a good machine. There are a number
    of ways in which you can attempt to do this: Verify the checksum to make that
    no corruption occurred during downloading (and download only from trusted sites),
    list the contents of a package and verify it what should be, and so on. The best
    method, is to install the software on a standalone machine and verify that it
    works before installing it on a production machine.


    # TIP


    Building applications from source code is also a good way of verifying their integrity.


    +   - Require all users to use passwords and create a suitable password policy.
    Make sure that those passwords are not just single characters (6–8 characters
    is a good minimum), and implement regular expirations. Remember that passwords
    are changed using the password command, and you can disable accounts by adding
    characters to the user''s entry in the /etc/passwd file.

    - Use shadow entries for passwords. This applies to both users and groups. Shadowing
    merely merges the passwords from files that can be accessed by all users into
    files that can only be accessed by the root user and adds additional security.
    Novell Linux Desktop, by default, uses shadowing, but it can always be reversed.'
  merge: -1
  pgno: 320
- img_proc: true
  md: '# Applying Common Sense


    +   - Routinely check the log files and make certain that only logins and logouts
    (which can be seen with last) are not suddenly showing odd times. If users start
    accessing the system at 3:00 in the morning when they have never done before,
    be certain to follow up and verify that it is indeed that user who is accessing
    the system and not someone else. While the subject, routinely check all log files—they
    are there for a purpose, and they can alert you early on situations you need to
    catch before they become uncontrollable.


    +   - Disable any accounts that need not be in current use. This is true for both
    user and group accounts and provides one less door by which entry can be gained.


    +   - Assign authentication to dial-in access. PPP is the most commonly used dial-in
    protocol on TCP/IP. It allows for authentication using PAP—the Password Authentication
    Protocol—which does not encrypt passwords and allows plain text to be sentleaving
    the door open for anyone snooping to intercept. Frankly, it also has the capability
    to authenticate with CHAP—Challenge Handshake Authentication Protocol—which encrypts
    the passwords and makes them much less valuable if intercepted.


    +   - Use TCP wrappers to reduce the traffic that you are allowing to come across
    the network: Novell Linux desktop tcp wrappers by default xineted. A wrapper (which
    has /etc/hosts.deny and /etc/hosts.allows) is a rule determining who can come
    in. Using a wrapper, you can reduce the allowed hosts that are local or only rule
    unknown hosts, or any other combination needed to meet your needs.


    +   - Regularly run a check to see which files have permissions SGID or SUID.
    There should be indisputable reason for their existence, and they should not exist
    at all. If a user cannot run a process as himself, what level of comfort do you
    giving him higher-level permissions to run jobs? What if the process should crash
    and he is left as user?


    +   - Verify correct usage of sudo through the configuration of the /etc/sudoers
    files. This provides a secure way of granting higher-level privileges to users.


    +   - Related to the preceding one—always use the minimal user and group ownership
    for any file or daemon that runs with SUID or SGID permissions, respectively.
    If a daemon can function properly without being owned by root, that ownership
    change should be made.


    +   - Use the secure (ssh) in place of telnet for remote logins. telnet (port
    23) uses plain text passwords, whereas ssh (port 22) uses encryption and provides
    more security. ssh, although not included with some releases, is included with
    Novell Linux Desktop.


    305'
  merge: -1
  pgno: 321
- img_proc: true
  md: '# CHAPTER 12: Security


    +   - Use an appropriate umask value to make default permissions for newly created
    files and directories as minimal as possible.


    The majority of these rules are discussed in the previous chapters or constitute
    common sense. Always think through the possibilities and the ramifications when
    considering adding security to a host or a network.


    # Working with iptables


    Although it is somewhat of a generalization, it can be said that ipfwadm goes
    with the Linux kernel 2.0.x and previous, and ipchains replaced it in 2.2.x. Although
    ipchains is still available—and still in many locations—iptables basically supersedes
    it as of 2.4.x.


    iptables is a generic implementation of packet filtering that can function in
    both stateful and stateless modes. More information on iptables can be found in
    the tutorial at http://iptables-tutorial.frozentext.net/


    # Host Security


    The best way to secure a host is to know everything about it. When you set up
    a host to provide web services, its purpose is to deliver content and pages to
    users. That host has no business providing DHCP addresses to clients—or even the
    ability to do so—in this situation.


    The /etc/xinetd.conf file holds a list of default services that are started on
    a host when networking is started. (Real service settings are in the files in
    the /etc/xinetd.directory.) Carefully audit the services that will start and verify
    that they will not jeopardize the system or the network by opening a door by which
    unwelcome guests can enter your system. Audit, and the log created by syslog to
    see what services are starting, and if they are encountering any problems forcing
    them to die off, restart, and so on.


    You should, as an administrator, regularly keep track of security-related developments
    and problems as they occur in the world and respond to them accordingly. For example,
    if your entire network is made up of the XYZ implementation of Linux and it is
    suddenly reported that versions of XYZ have a bug that provides an open door for
    anyone typing “wizard” at a login prompt, you had best know the situation and
    formulate a plan of response quickly.


    You can keep on top of security issues by monitoring your vendor’s site as well
    as those of CERT (originally an acronym for Computer Emergency Response Team)
    at www.cert.org. Now a division of Carnegie Mellon Software Engineering Institute,
    CERT had 3,734 reported incidents in 1998.'
  merge: -1
  pgno: 322
- img_proc: true
  md: '# Applying Common Sense


    that number almost tripled to 9,859. For 2003 (the last reporting period for which
    cert will issue incident numbers), that number escalated to more than 137,000.


    As the number of incidents reported has grown, so too has the number of vulnerabilities
    and related statistics. If you suspect a problem on your own network and need
    to contact CERT, you can do so via email at cert@cert.org or through regular mail
    at


    CERT Coordination Center

    Software Engineering Institute

    Carnegie Mellon University

    Pittsburgh, PA 15213-3890


    It is also highly recommended that you subscribe to the BUGTRAQ mailing list,
    which can be done by sending an email to listserv@securityfocus.com with a blank
    subject and in the body indicate "SUBSCRIBE BUGTRAQ,”


    When security problems are found, the most common solution is an update of the
    affected binaries. These are almost always available at the vendor''s site, and
    you will want to obtain and install them immediately. The only way to deal with
    a threat is to eliminate it as expeditiously as possible.


    # Note


    Whenever you make any changes to the system, you should always fully document
    what you have done in a method that you can readily refer back to should unforeseen
    problems occur. You should also complete backups before making any major changes.


    # User-Level Security


    If you give a root-level permissions to the whole network, the scope of the damage
    he can cause is equal to that of the whole network. If you give the user very
    limited permissions to only one machine, the amount of potential damage he can
    cause is severely limited. Although this repeats everything that has been discussed,
    it focuses on how to limit the user.


    One of the main methods to limit the user is to use the rule of always granting
    minimal permissions needed to do his job. It is always better to give someone
    not enough and then have to go back and give him a little more, than to give him
    too much and find out the hard way.


    As an example, using the rm command while intending to delete only a few files
    and inadvertently using recursive commands to delete too much can be an irreversible
    error. When that happens, the system administrator assured she had given fewer
    permissions and had those actions denied.'
  merge: -1
  pgno: 323
- img_proc: true
  md: '# CHAPTER 12: Security


    It is also important to place other limits on the users as well. You can limit
    such things as


    +   - The amount of storage space the users are allowed on the system. This is
    accomplished by implementing quotas.

    - The processes they can run. The ulimit -u command is used to place restrictions
    on this and will limit the maximum number of processes a single user can have
    at any one time.


    Tip


    The user default is 7,168.


    +   - Their memory usage. The ulimit -v command will allow you to specify a maximum
    amount of virtual memory that is available to a shell.


    Tip


    The default is unlimited.


    Note


    The ulimit specifications should be placed in /etc/profile to apply to all users.


    With ulimit, mentioned in several points in the preceding list, you can specify
    that values are either H (hard) or S (soft). If they are hard values, they can
    never be increased. If they are soft values—the default—they can be increased.
    Options that can be used with ulimit other those already listed include


    +   - -a to show all current limits

    - -f to specify the maximum size of files created by a shell

    - -t to specify the maximum CPU time that can be used (in seconds)

    - -n for the maximum number of open files. This setting can be viewed, but not
    set.


    Example of the command in action follows:


    ```

    # ulimit -a

    file size (blocks) 0

    data seg size (kbytes) unlimited

    file size (blocks) unlimited

    ```


    308'
  merge: -1
