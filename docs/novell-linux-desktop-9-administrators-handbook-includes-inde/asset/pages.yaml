  md: '# CHAPTER 11: Networking


    # SMB


    SMB stands for Server Message Block and is the protocol used for sharing resources
    on a Microsoft Windows-based network (Windows 95, 98, Windows NT, Windows 2000,
    and so on). The resources shared can be directories, printers, or other devices.
    In order for Linux to access shared resources on a Windows-based network (we will
    use NT as an example), it is necessary to have Linux communicating via the SMB
    protocol.


    Unfortunately, the SMB protocol was not native with many implementations of Linux,
    though it could almost be added. Samba is a free program that can be found at
    www.samba.org (from which you must first choose your country). Almost every major
    Linux distribution today—including Novell Linux Desktop—includes Samba and supports
    SMB. Figure 11.11 shows the protocol stack when SMB is used.


    FIGURE 11.11

    SMB runs in the Application/Service layer.


    | Application | SMB |

    |---|---|n| Session | NetBIOS |

    | Transport | TCP | UDP |

    | Network | IP |

    | Data Link |


    Samba makes the Linux host an SMB-client using values found in the /etc/samba/smb.conf
    file. When the Linux host is installed and configured, the Linux host (providing
    permissions are adequate) can access any shared SMB resources on the NT network:
    directory, printer, and so on.


    # Note


    Though the concept is the same, when you configure the shares, you must configure
    them separately. Printer shares are configured by setting up a path to the resource,
    whereas directory shares are configured using settings.'
