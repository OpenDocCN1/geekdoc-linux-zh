  md: '# Copying Text


    Text can be copied into the buffer to be reused or moved from one part of the
    file to another. As simplistic as it sounds, when you copy text, you leave the
    original where it is and make a duplicate elsewhere. However, when you move the
    text, take it from one location in the file and place it there. Whether you are
    copying or moving, the p command is always the counterpart of the operation; standing
    for print/put/place, it completes the operation.


    Unfortunately, the “c” mnemonic had already been used for change when vi was being
    created, and there weren’t a lot of other good choices left. Given that, Bill
    chose to use y for yank. Table 4.11 shows a series of key sequences that can be
    used for copying text.


    # TABLE 4.11


    Key Sequences for Copying Text


    | KEY SEQUENCE | RESULT |

    | --- | --- |

    | y | Yanks from here to the end of the line |

    | y) | Yanks the remainder of the sentence |

    | y| | Yanks the remainder of the paragraph |

    | y0 | Yanks from here to the beginning of the line |

    | yb | Yanks the previous word or part of a word |

    | yl | Yanks a single letter |

    | 7yl | Yanks the next seven letters |

    | yw | Yanks a single word |

    | 7yw | Yanks the next seven words |

    | yy | Yanks an entire line |

    | Y | The same as y |


    To do a copy operation, you move to the desired location in the file where the
    text should go, and then use the p command. To do a move operation, delete the
    text after yanking it, and then move to the desired location and use the p command
    to place the text where you want it.


    # Other Operations


    If there is one single command to commit to memory, it is u—undo command. This
    command will undo the previous action, and only the previous action. It has a
    counterpart—U—which will undo all previous actions to the'
