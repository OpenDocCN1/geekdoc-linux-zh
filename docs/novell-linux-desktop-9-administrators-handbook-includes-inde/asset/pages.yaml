  md: '# Troubleshooting Installation Problems


    After choosing Yes, you must give the root user password before you can go any
    further. Following this, an attempt will be made (often more than once) to restart
    the X server again. If the attempts are successful, the X server will start. If
    the attempts are unsuccessful, a dialog box will inform you that the X server
    is now disabled and encourage you to try configuration again.


    # Monitor Problems


    If there is a problem with the monitor, it will usually show up the first time
    you login, as illustrated by the dialog box in Figure 2.16.


    FIGURE 2.16


    An error indicates that the monitor is not properly configured.


    ![](img/a66a597da3b52cd2cf8b35a8b972f497_45_0.png)


    When you choose Yes, the SaX utility is started, as shown in Figure 2.17. There
    are several things to note in this figure—the first is that not all of the dialog
    box is present because of the inability to properly configure it for the monitor.
    Clicking the resize button does make it possible to work within the confines of
    the space available.


    The second thing to notice in the figure is that the monitor is identified as
    VESA. Monitors that cannot be recognized typically default to VESA.


    You can change the properties of the monitor to your actual monitor—model, resolution,
    and so on—then choose to accept that. You will be given the opportunity to test
    the configuration you have selected (see Figure 2.18), and then save it.


    You should never save a configuration without testing it. After you have done
    these steps, the new configuration will be active the next time the X server is
    restarted.'
