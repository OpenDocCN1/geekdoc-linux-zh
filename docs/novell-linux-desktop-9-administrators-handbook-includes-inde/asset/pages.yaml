- img_proc: true
  md: '# Booting and Runlevels


    # Walking Through a Normal Boot


    Assuming that there are no problems with the system, the following steps walk
    through the boot process from start to finish:


    +   1. When any machine is started, it first does a Power On Self Test (POST)
    to verify that internal parts and processes are working. This occurs regardless
    of any operating system.

    2. The boot loader for the operating system begins. With Novell Linux Desktop,
    it is GRUB. By default, it waits eight seconds (configurable in /boot/grub/menu.list)
    for you to press a key and identify another operating system or choice to boot,
    as shown in Figure 9.1. If no key is pressed, the default of Linux is loaded.


    > NOTE

    If you have any operating system other than NLD also installed, the choice will
    appear in the menu along with the three choices shown in Figure 9.1. If NLD is
    the only operating system installed, you should only see these three choices.'
  merge: -1
  pgno: 247
- img_proc: true
  md: '# CHAPTER 9: Booting and Runlevels


    FIGURE 9.1

    The boot menu displays.


    ![](img/a66a597da3b52cd2cf8b35a8b972f497_248_0.png)


    +   3. The screen changes to a splash screen, as shown in Figure 9.2. You can
    press F2 to see more information as the kernel is loaded from the hard drive,
    or floppy drive, or other specified location in memory. default, it is located
    within the /boot directory and exists in compressed state; as it loads into memory,
    it decompresses. Figure 9.3 shows the contents of this directory; the version
    number of the build is easy to identify on filenames.


    +   4. The kernel is booted, and messages are written to /var/log/messages.

    5. Modules, default and other, specified /etc/modprobe.conf are loaded. It is
    sometimes necessary to tweak this if devices are not recognized correctly or you
    use a specific behavior configured.


    +   6. The kernel passes control to the init daemon, which begins reading the
    /etc/initstab file. Because of this, the init daemon will always have a process
    ID of 1 and will be the parent of many other daemons.


    +   7. Normally, a check of the filesystem (fsck) is carried out and the local
    filesystem is mounted. Other operations can include mounting remote filesystems,
    cleaning up temporary files, and so on.'
