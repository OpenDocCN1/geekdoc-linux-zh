- img_proc: true
  md: '# CHAPTER 7: Working with Filesystems


    +   - You do not have to fully partition your disk.


    +   - Partitions cannot be moved, resized, or copied without the use of special
    software.


    When working with the disk drives, you must remember the naming convention used.
    All devices in a Linux system are represented as device files. These files are
    named with specific conventions to make it easier to identify the associated device.


    IDE hard disks are identified with the name /dev/hd followed by the letter "a,"
    "b," "c," or "d." The letter identifies the drive as the first disk on the IDE
    controller (a) or the second disk on the second IDE controller (d).


    SCSI disks are identified in a similar manner, except the device name is /dev/sd
    followed by a letter. These names, /dev/sda, refer to the entire disk.


    After the drive has been partitioned, a number is added to the device name. Primary
    partitions are numbered 1–4, and extended or logical partitions are numbered 5
    and higher.


    The partition table was originally written in the boot sector, and as this was
    a predefined size, there was a limit to four partition table entries. One partition
    referred to as primary partitions. One partition can be subdivided into logical
    partitions. The partition used to hold the logical partitions is called an extended
    partition. Various versions of Linux can impose limits on the number of partitions
    on a drive.


    Partitions must be labeled to identify the format of the data that will be subsequently
    written on them. This is important for mounting the partition or performing filesystem
    repairs. Each filesystem has a code associated with it, and is used by fdisk to
    specify the filesystem type.


    Some of the valid filesystem types are listed in Table 7.1.


    > NOTE


    You can obtain a current list of the filesystems available using the fdisk utility,
    and choosing m, and then l, or using the following command:

    fdisk -1 /dev/whatever


    This is discussed further in the "Working with Hard Disks" section later in this
    chapter.'
  merge: -1
