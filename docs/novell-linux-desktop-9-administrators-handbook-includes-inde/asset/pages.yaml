  md: '# CHAPTER 4: Working on the Command Line


    Looking at the variables on the system, you will find that more than PS1 exists.
    For example, earlier in this chapter, we discussed ending a line with a backlash
    to signify that you are not finished entering input. If we look at the sequence
    of events, and include prompts, it would look like this:


    ```

