  md: '# Understanding Printing


    To enable and disable printing from the command line, you can use the /usr/bin/enable
    and /usr/bin/disable commands, respectively. Each command must be followed by
    the name of the printer for which you are enabling/disabling. If you want the
    printer to finish what is in its queue but not accept any additional jobs, you
    can use /usr/sbin/reject followed by the printer name (the opposite of which is
    /usr/sbin/accept).


    # NOTE


    Under CUPS, enable and disable are symlinks to /usr/sbin/accept.


    The CUPS service can be stopped in two ways: using the command /etc/init.d/cups
    stop or rccps stop. The opposite of these actions is accomplished by using start
    in place of stop.


    # TIP


    Most of the utilities and commands discussed require you to be root in order to
    execute them.


    The lppasswd utility can be used to add a password to CUPS (for example, for your
    use with the Web Administration tools). If you enter the command by itself at
    the command line, you will be prompted to enter a password twice. The password
    you give must be at least six characters long and cannot contain your username;
    it must also contain at least one letter and number. Options that can be given
    at the command line are -g to specify a groupname and -a or -x to specify a username.
    For the Webadmin tools, you need to run the following command:


    ```

    lppasswd -g sys -a root

    ```


    to create the sys group and root user. You will be prompted for the password to
    use.


    One last item of note is that the file /var/log/cups/error_log is where error
    messages for the CUPS daemon are written. The access_log shows all access to the
    service. This can be useful in troubleshooting situations in which you need to
    ascertain why a printer is unavailable.


