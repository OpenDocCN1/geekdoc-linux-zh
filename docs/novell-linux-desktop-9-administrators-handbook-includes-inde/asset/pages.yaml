  md: '# CHAPTER 11


    # Networking


    This chapter focuses on the fundamentals of networking. In this chapter, you''ll
    learn about the TCP/IP networking protocol and how to configure it. This chapter
    builds on those concepts, and you''ll learn about some of the services that run
    on TCP/IP.


    # TCP/IP Background


    The Transmission Control Protocol/Internet Protocol (TCP/IP) is an industry-standard
    suite of protocols to be routable and efficient. TCP/IP was originally designed
    as a set of wide area network (WAN) protocols for the purpose of maintaining communication
    links and data transfer between sites in the event of an atomic/nuclear war. Since
    those early days, development of the protocols has passed from the hands of the
    government and has been the responsibility of the Internet community for some
    time.


    The evolution of these protocols from a small four-site project into the foundation
    of the worldwide Internet has been extraordinary. But despite than 25 years of
    work and numerous modifications to the protocol suite, the inherent spirit of
    the original specifications is still intact. TCP/IP has the following advantages
    over other protocols:


    +   An industry-standard protocol. Because TCP/IP is not maintained or written
    by one company, it is not proprietary or subject to as many compatibility issues.
    The Internet community as a whole decides whether a particular change or implementation
    is worthwhile.'
  merge: -1
  pgno: 291
- img_proc: true
  md: '# CHAPTER 11: Networking


    +   - A set of utilities for connecting dissimilar operating systems. Many connectivity
    utilities have been written for the TCP/IP suite, including the File Transfer
    Protocol (FTP) and Terminal Emulation Protocol (Telnet).


    +   - A scalable, cross-platform client-server architecture. Consider what happened
    during the initial development of applications for the TCP/IP protocol suite.
    Vendors were able to write their own client/server applications—for instance,
    SQL Server and Simple Network Management Protocol (SNMP). The specification for
    how to write applications was also up to public peril. Which operating systems
    would be included? Users everywhere were able to take advantage of the connectivity
    options promised through TCP/IP, regardless of the operating systems they were
    currently running.


    +   - Access to the Internet. TCP/IP is the facto protocol of the Internet and
    allows access to a wealth of information that can be found at thousands of locations
    around the world. To connect to the Internet, a valid IP address is required.


    # The Four Layers of TCP/IP


    TCP/IP maps to a four-layer architectural model. This model is called the Internet
    Protocol Suite and is broken into the Network Interface, Internet, Transport,
    and Application layers. Each of these layers corresponds to one or more layers
    of the OSI model, which it predates. The Network Interface layer corresponds to
    the Physical and Data Link layers. The Internet layer corresponds to the Network
    layer. The Transport layer corresponds to the Transport layer, and the Application
    layer corresponds to the Session, Presentation, and Application layers of the
    OSI model.


    Each of the four layers of the model is responsible for all the activities of
    the layers to it maps.


    The Network Interface layer is responsible for communicating directly with the
    network. It must understand the network architecture being used, such as token-ring
    or Ethernet, and provide an interface enabling the Internet layer to communicate
    with it. The Internet layer is responsible for communicating directly with the
    Network Interface layer.


    The Internet layer is primarily concerned with the routing and delivery of packets
    through the Internet Protocol (IP). All the protocols in the Transport layer must
    use IP to send data. The Internet Protocol includes rules for to


    229'
  merge: -1
  pgno: 292
- img_proc: true
  md: '# TCP/IP Background


    address and direct packets, fragment and reassemble packets, provide security
    information, and identify the type of service being used. However, because IP
    is not a connection-based protocol, it does not guarantee that packets transmitted
    onto the wire will be lost, damaged, duplicated, or out of order. The responsibility
    of higher layers of the networking model, such as the Transport layer or the Application
    layer. Other protocols that exist in the Internet are the Internet Control Message
    Protocol (ICMP), Internet Group Management Protocol (IGMP), and the Address Resolution
    Protocol (ARP).


    The Transport layer maps to the Transport layer of the OSI model and is responsible
    for providing communication between machines for applications. This communication
    can be connection based or non-connection based. The primary difference between
    these two types of communications is whether there is a mechanism for tracking
    data and guaranteeing the delivery of the data to its destination. Transmission
    Control Protocol (TCP) is the protocol used for connection-based communication
    between two machines providing reliable data transfer. User Datagram Protocol
    (UDP) is used for non–connection communication with no guarantee of delivery.


    The Application layer of the Internet Suite is responsible for all the activities
    that occur in the Session, Presentation, and Application layers of the OSI model.
    Numerous protocols have been written for this use, including Simple Network Management
    Protocol (SNMP), File Transfer Protocol (FTP), Simple Mail Transfer Protocol (SMTP),
    as well as many others.


    The interface between each of these layers is written to have the capability to
    pass information from one layer to the other.


    The interface between the Network Interface layer and the Internet layer does
    not pass a great deal of information, although it must follow certain rules. Namely,
    it must listen to all broadcasts and send the result of the data in the frame
    to the Internet layer for processing, and if it receives any frames that do not
    have an IP type, they will be silently discarded.


    The interface between the Internet layer and the Transport layer must be capable
    of providing each layer full access to such information as the source and destination
    addresses, whether TCP or UDP should be used in the transport of data, and all
    other available mechanisms for IP Rules and specifications for the Transport layer
    include giving the Transport layer the capability to change these parameters or
    pass parameters it receives from the Application layer down to the Internet layer.
    The most important thing to remember about all of these boundary layers is that
    they must use the agreed-upon rules for passing information from one layer to
    the other.'
