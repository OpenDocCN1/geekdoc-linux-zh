  md: '# Working with File Permissions and Ownership


    To see the value of umask, simply enter the command at a prompt:


    ```

    $ umask

    0022

    $

    ```


    With a umask value of 0022, the permissions assigned to new files now become 644
    (rw-r--r-), and for directories 755 (rwx-xr-x), as shown in Figure 8.3.


    # FIGURE 8.3


    Computing default permissions on newly created entries after subtracting the value
    of umask.


    | Files | Directories |

    | --- | --- |

    | 666-rw-r-rw- | 775 drwxrxr-x |

    | -022-----w-w- | -022-----w-w- |

    | 644-rw-r-r-- | 755 drwxrxr-x |


    You can change the value of umask by specifying a different value on the command
    line (umask 15, for example), and this value will be used for the session. The
    variable is defined in the login information, and will revert to its normal value
    at the beginning of each session.


    # Note


    While possible, administrators rarely want to set the umask temporarily. It is
    common to put an updated value in the .profile or .bashrc.


    # Tip


    If you are sharing files using Unix groups, it is common to set the umask to 0022
    so that the file is writable.


    # Changing Values


    To change permissions on a file or directory, you can use the chmod utility. The
    utility will accept either numeric or symbolic arguments. For example, to change
    the permissions of a file to allow all to read and write to it, you could write:


    ```

    $ ls -l turbo

    -rw-r-r- 1 root root 14 Sep 6 22:42 turbo

    ```'
