- img_proc: true
  md: '# Primary Protocols


    Six primary protocols are associated with TCP/IP:


    +   - Transmission Control Protocol (TCP)

    - User Datagram Protocol (UDP)

    - Internet Protocol (IP)

    - Internet Control Message Protocol (ICMP)

    - Address Resolution Protocol (ARP)

    - Internet Group Management Protocol (IGMP)


    # TRANSMISSION CONTROL PROTOCOL


    The first protocol that lives in the Transport layer is the Transmission Control
    Protocol (TCP). This protocol requires the establishment of a session before data
    is transmitted between two machines. TCP packets are delivered to sockets or ports.
    Because TCP uses a connection between two machines, it is designed to verify that
    all packets by a machine are received on the other end. If, for some reason, packets
    are lost, the sending machine resends the data. Because a session must be established
    and delivery of packets is guaranteed, there is additional overhead involved with
    using TCP to transmit packets.


    TCP requires a connection, or session, between two machines before any data is
    transferred. TCP exists within the Transport layer, the Application layer and
    the IP layer, providing a reliable and guaranteed delivery mechanism to a destination
    machine. Connection-based protocols guarantee the delivery of packets by tracking
    the transmission and receipt of individual packets during communication. A session
    is capable of tracking the progress of individual packets by monitoring when a
    packet is sent, indicating in what order it was, and by notifying the sender when
    it is received so that more can be sent.


    After the TCP session has been created, the machines begin to communicate just
    as people do during a phone call. During the initialization of a TCP session,
    often called the "three-way handshake," both machines agree on the best method
    to track how much data is to be sent at any time, acknowledgment numbers to be
    sent upon receipt of data, and when the connection is no longer necessary because
    all data has been transmitted and received. Only after this session is created
    does data transmission begin.


    To provide reliable delivery, TCP places packets in sequenced order and requires
    acknowledgments that these packets reached their destination before it sends new
    data. TCP is typically used for transferring large amounts of data, or'
  merge: -1
  pgno: 294
- img_proc: true
  md: '# TCP/IP Background


    when the application requires acknowledgment that data has been received. Given
    all the additional overhead information TCP needs to keep track of, the format
    of a TCP packet can be somewhat complex.


    TCP uses the concept of sliding windows for transferring data between machines.
    Sliding windows are often referred to in the Linux/UNIX environment as streams.
    Each machine has a send window and a receive window that it uses to buffer data
    and make the communication process more efficient. A window represents the subset
    of data currently being sent to a destination machine, and is also the amount
    of data being received by the destination machine. At first, this is redundant,
    but it really isn''t. Not all data is guaranteed to be received, so the packets
    must be kept track of on both machines. A sliding window enables a machine to
    send the data in a stream without having to wait for an acknowledgment for every
    single packet.


    # USER DATAGRAM PROTOCOL


    The second protocol that lives in the Transport layer is the User Datagram Protocol,
    or UDP. This protocol is a non-connection-based protocol and does not require
    a session to be established between two machines before data is transmitted. UDP
    packets are still delivered to sockets or ports, just as they are in TCP. But
    because UDP does not create a session between machines, it cannot guarantee that
    packets are delivered or that they are delivered in order or retransmitted if
    the packets are lost. Given the apparent unreliability of this protocol, some
    might wonder why a protocol like UDP was developed.


    Sending a UDP datagram has very little overhead involved. A UDP datagram has no
    synchronization parameters or priority options. All that exists is the source
    port, destination port, the length of the data, a checksum for verifying the header,
    and then the data.


    There are a number of good reasons to have a protocol that does not require a
    session to be established. For one, very little overhead is associated with UDP,
    such as track of sequence numbers, Retransmit Timers, Delayed Acknowledgment Timers,
    and retransmission of packets. UDP is quick and extremely streamlined functionally;
    it''s not guaranteed. This makes UDP perfect for communications that involve broadcasts,
    general announcements to the network, or real-time data.


    Another really good use for UDP is in streaming video and audio. Not only does
    the unguaranteed delivery of packets enable more data to be transmitted (because
    a broadcast has little to no overhead), but also the retransmission of a packet
    is pointless.


    279'
  merge: -1
  pgno: 295
- img_proc: true
  md: '# CHAPTER 11: Networking


    # INTERNET PROTOCOL


    A number of protocols are found in the Internet layer, including the most important
    protocol in the entire suite, the Internet Protocol (IP). This is probably the
    most important protocol because the Transport layer cannot communicate at all
    without communicating through IP in the Internet layer.


    The most fundamental element of the Internet Protocol is the address space that
    IP uses. Each machine on a network is given a unique 32-bit address called an
    Internet address, or IP address. Addresses are divided into five categories, called
    classes, that are discussed later in this chapter.


    IP receives in the form of packets from the Transport layer, from either TCP or
    UDP, and sends out data in what are commonly referred to as datagrams. The size
    of a datagram depends on the type of network being used, such as token-ring or
    Ethernet. If a packet has too much data to be transmitted in one datagram, it
    is broken into pieces and transmitted through several datagrams. Each of these
    datagrams has to then be reassembled by TCP or UDP.


    # INTERNET CONTROL MESSAGE PROTOCOL


    Internet Control Message Protocol (ICMP) is part of the Internet layer and is
    responsible for reporting errors and messages regarding the delivery of IP datagrams.
    It can also send "source quench" and other self-tuning signals during the transfer
    of data between two machines without the intervention of the user. These signals
    are designed to fine-tune and optimize the transfer of data automatically. ICMP
    is the protocol that warns you when a destination host is unreachable or how long
    it took to get to a destination host.


    ICMP messages can be broken down into two basic categories: the reporting of errors
    and the sending of queries. Error messages include the following:


    +   - Destination unreachable

    - Redirect

    - Source quench

    - Time exceeded


    ICMP also includes general message queries. The two most commonly used are the
    following:


    +   - Echo request

    - Echo reply'
  merge: -1
  pgno: 296
- img_proc: true
  md: '# TCP/IP Background


    The most familiar tool for verifying that an IP address on a network actually
    exists is the Packet Internet Groper (PING) utility. This utility uses the ICMP
    echo request and reply mechanisms. The echo request is a simple directed datagram
    that asks for acknowledgment that a particular IP address exists on the network.
    If a machine with this IP address exists and receives the request, it is designed
    to send an ICMP echo reply. This reply is sent back to the destination address
    to notify the source machine of its existence. The PING utility reports the existence
    of the IP address and how long it took to get there.


    # INTERNET GROUP MANAGEMENT PROTOCOL


    Internet Group Management Protocol (IGMP) is a protocol and set of specifications
    that allows machines to be added and removed from IP address groups, using the
    class D addresses. IP allow the assignment of class D addresses to groups of machines
    so that they can receive broadcast data as one functional unit. Machines can be
    added and removed from these units or groups, or they can be members of multiple
    groups.


    # Note


    Unicast messages are sent to one host. Multicast messages are sent to a number
    of hosts. Broadcast messages are those sent to all hosts. Understanding this distinction
    is helpful when discussing networking.


    # ADDRESS RESOLUTION PROTOCOL


    Unless IP is planning to initiate a full broadcast on the network, it must have
    the physical address of the machine to which it is going to send datagrams. For
    this information, it relies on Address Resolution Protocol (ARP). ARP is responsible
    for mapping IP addresses to the network to physical addresses in memory. This
    way, whenever IP needs a physical address for a particular IP address, ARP can
    deliver. But ARP''s memory does not last indefinitely, and occasionally IP will
    ask for an IP address that is not in ARP''s memory. When this happens, ARP has
    to go out and find one.


    ARP is responsible for finding a map to a local physical address for any local
    IP address that IP might request. If ARP does not have a map in memory, it has
    to find one on the network. ARP uses local broadcasts to find physical addresses
    of machines and maintains a cache in memory of recently mapped IP addresses to
    physical addresses. Although this cache does not last indefinitely, it enables
    ARP to not have to broadcast every time IP needs a physical address.


    281'
  merge: -1
  pgno: 297
- img_proc: true
  md: 'As long as the destination IP address is local, ARP simply sends a local broadcast
    for that machine and returns the physical address to IP. IP, realizing that the
    destination IP address is local, simply formulates the datagram with the IP address
    above the physical address of the destination machine.


    # Protocols and Ports


    The Transport layer uses port numbers to transfer data to the Application layer.
    These ports enable a host to support and track simultaneous sessions with other
    hosts on the network. There are over 65,000 definable ports, and Table 11.1 lists
    the most common assignments.


    TABLE 11.1

    Port Numbers Used by the Common Services


    | PORT | SERVICE | PURPOSE |

    |---|---|---|

    | 20,21 | FTP | Transfers files from one host to another |

    | 23 | Telnet | Connects to a host as if on a dumb terminal for administrative
    |

    | 25 | SMTP | Simple Mail Transfer Protocol |

    | 53 | DNS | Domain Name System |

    | 80 | WWW | The World Wide Web service |

    | 110 | POP3 | The Post Office Protocol (version 3) for retrieving email |

    | 119 | NNTP | The Network News Transfer Protocol |

    | 139 | NetBIOS | Used to translate Windows-based names to IP addresses |

    | 143 | IMAP | The Internet Mail Access Protocol, which can be used in place of
    POP3 |

    | 161 | SNMP | Simple Network Management Protocol |


    /etc/services file holds definitions for common ports. An ASCII file maps names
    to services. The Internet Assigned Numbers Authority (IANA) assigns lower number
    ports, but administrators might assign higher numbers freely.


    # TCP/IP Host Configuration


    To configure TCP/IP on a host, you must know/configure three values. The three
    needed values are'
