  md: '# FIGURE 2.2


    Upon first booting, there are a number of choices to choose from.


    ![](img/a66a597da3b52cd2cf8b35a8b972f497_31_0.png)


    +   **Boot from Hard disk**—This choice is the default, and the one to use if
