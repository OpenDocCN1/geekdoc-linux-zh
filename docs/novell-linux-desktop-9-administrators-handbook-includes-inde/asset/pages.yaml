    Options can be used with the umount utility


    +   - -a—Undo every entry in /etc/mtab.

    - -n—Undo but not update /etc/mtab.

    - -r—If the unload fails, remount it as read-only.

    - -t—Undo all entries of a specific file type.


    NOTE


    In most cases, the only filesystems that you would unmount while a system is active
