  md: '# Maintaining Filesystem Integrity


    After the filesystem has been created, you can gather information about it and
    perform troubleshooting using three tools: df, du, and fsck. The first two display
    information only, and do not allow you to make any any changes, and the latter
    can be a lifesaver in bringing a down system back up and operational once more.


    # NOTE


    df and du are user tools, whereas fsck is only used by system administrators and
    must be run in order to do anything useful.


    The df utility shows the amount of free disk across filesystems. A number of options/parameters
    can be used with the utility as well:


    +   - -a—All (include those that have 0 block)

    - -h—Display in “human-readable” form

    - -l—Local filesystems only

    - -m—List in MBs

    - -t—Only those filesystems of a particular type

    - -T—Show the filesystem type


    For example, the default output, and results with specified options, look like
    this:


    ```

    $ df

    Filesystem 1k-blocks Available Use% Mounted on

    /dev/hda1 1980969 573405 1305178 31% /

    /dev/hda3 587198 5212 566218 0% /home

    $ df -T

    Filesystem Type 1k-blocks Used Available Use% Mounted on

    /dev/hda1 ext2 1980969 573408 1305178 31% /

    /dev/hda3 ext2 587198 5212 566218 0% /home

    $ df -h

    Filesystem Size Used Avail Use% Mounted on

    /dev/hda1 1.9G 560M 1.2G 31% /

