  md: '# Copying and Moving Files and Directories


    Last, the -P option tells cp not to follow symlinks. The -p option clones ownership,
    permissions, and time stamps on copied files rather than using the user''s default
    permissions and the current time.


    # mv


    The move utility (mv) can be used for several operations. At the risk of being
    overly simplistic, this includes the ability to


    +   - Rename a file

    - Rename a directory

    - Move a file from one directory to another

    - Move a subdirectory from one directory to another

    - Move an entity to another partition or media


    The simplest operation is to rename a file in its current directory:


    ```

    $ ls -l file

    -rw-r--r--  1 root  root  85 Aug 22 10:26 fileone

    -rw-r--r--  1 root  root 16432 Aug 28 13:43 filetwo

    ```


    ```

    $ mv myfile filetree

    $ ls -l file

    -rw-r--r--  1 root  root  85 Aug 22 10:26 filetree

    -rw-r--r--  1 root  root 16432 Aug 28 13:43 filetwo

    ```


    The dates, permissions, and everything else associated with fileone stay with
    filetree. This is because when a file is moved within the same directory (or even
    on the same partition), all changes is the information about the name—no physical
    operation takes place; only the descriptor is changed. The move has become a simple
    rename operation.


    # Note


    As simplistic as it might sound, remember that when you copy a file, you leave
    the original intact and create something that did not exist before—thus a new
    set of attributes is created for the new entity. When you move a file, the default
    action is a rename—you are changing only the name of the original entity and creating
    nothing new.


    One way to put it in perspective is that if you copy a file that is 9MB in size,
    it will take longer than you copy a file that is 9 bytes in size. Move being used
    as a rename, it will take the same amount of time to do the operation regardless
    of the size of the file.'
