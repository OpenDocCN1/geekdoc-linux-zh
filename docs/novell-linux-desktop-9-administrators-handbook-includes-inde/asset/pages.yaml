  md: '# Inserting and Deleting


    Changing existing text is simple enough if there is already text there. Inserting,
    however, allows you to add to the text already there, and is the mode you go into
    when starting a new file. When working within a line, you can choose to insert
    or append, as well as open a new line above or below the current one. Table 4.8
    lists the possibilities.


