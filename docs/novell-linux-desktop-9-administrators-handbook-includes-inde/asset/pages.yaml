- img_proc: true
  md: '# CHAPTER 4: Working on the Command Line


    Under normal conditions, when Process C finishes, it will report back to Process
    B and go away. Process B will massage the data, report back to Process A, and
    go away. Process A will do whatever it needs to do with the data, and return it
    to the user''s shell and go away.


    For a non-normal condition, assume Process C has a glitch and Process C does not
    end after reporting back to Process B. It continues to run: This prevents Process
    B from ending because it has a child associated with it. We can assume that the
    user''s shell. Process B returns its values to Process A, like Process B, cannot
    end if it has a child associated with it. Because there is a glitch in Process
    C, three processes that are no longer continue to run.


    Yet another possibility for the glitch (and it would depend on how applications
    are written) is that Process B could go ahead and without Process C going away.
    Process A could do its task and go away as well. What happens in this instance
    is that Process C remains a process, but now it has nonexistent parents above
    it, and has no idea who reports to—it becomes a true runaway.


    To solve problems with erratic processes, there is the kill command. The utility
    works with the following syntax:


    ```

    kill [option] PID

    UID PID CIME TTY                 TIME CMD

