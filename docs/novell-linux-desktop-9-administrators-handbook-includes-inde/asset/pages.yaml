  md: '# # Installing Novell Linux Desktop 9


    It should come as little surprise that installing the Novell Linux Desktop (NLD)
    product is as straightforward and easy as using it. In this chapter, we will examine
    the system requirements for the operating system and walk through its installation.


    # ## Minimum System Requirements


    You can choose to install NLD in a number of different environments. For a standard
    installation, the requirements are


    +   - Pentium II+ 266MHz or any AMD64 or Intel EM64T processor

    - 128MB RAM

    - 800MB free hard drive space

    - 800x600 or higher resolution


    Though the preceding numbers are the minimum, the following requirements are more
    realistic for an environment you can be comfortable working within:


    +   - Pentium 3 1GHz processor

    - 512MB RAM

    - 20GB free hard drive space

    - 1024x768 or higher resolution

    - 100Mb/sec Ethernet card


    # ## Installing the Operating System


    Novell Linux Desktop is presently available in both the DVD and CD formats. With
    the exception of not needing to switch media with DVD (everything fits on a single
    disk)—and needing to do so'
