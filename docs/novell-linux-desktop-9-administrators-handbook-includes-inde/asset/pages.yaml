    # Finding Files on Your System


    With all the files on the system, and all the different subdirectories that exist,
    finding something you are looking for can sometimes be a daunting task. Thankfully,
    a number of utilities in Linux can help ease this burden. In this section, we
    will look at a few of the unique utilities and examine how you can use them to
    find what you are looking for.


    The utilities to be examined, in order, are


    +   - which

    - whereis

    - find


    The which command looks through the directories listed in your PATH statement.
    When it finds a match in a directory for a name you give, it immediately and reports
    what it found. How is this useful? Suppose there are 14 versions of grep on your
    system; which will tell you the first one it finds via the path search, and thus
    the one that is executed when you use the command.


    The following simple example illustrates this:


    ```

    $ grep

