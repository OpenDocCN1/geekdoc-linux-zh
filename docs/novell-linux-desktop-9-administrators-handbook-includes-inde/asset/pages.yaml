    # The home Directory


    This directory will hold subdirectories that are the home directories for users.
    For example, the files and directories created, owned, and used by edulaney located
    in /home/edulaney, which is known as his home directory.


    Each user home directory is used to provide him or her with a location where he
    or she can store files, as well as where individual configuration files can be
    found and accessed.


    Files are used to configure the environment for the user, such as .profile, .bashrc,
    and .bash_history are stored in the home directories.


    # NOTE


    For security reasons, there is not a /home/root directory. The home directory
    for the root user is /root.


    # The lib Directory


    Shared libraries needed by binaries (such as those in the /bin directory) are
    located in the /lib directory and subdirectories beneath it. /lib also holds static
    libraries used during compilation. Generally, the libraries contain binary functions
    that any applications can use during execution.


    # The media Directory


    The media directory is used for mounting removable media. Two subdirectories are
    created by default—cdrom and floppy. Other devices—such as dvd, dvdvrecorder,
    or cdrecorder might appear as well if they are installed.


