  md: '# Working with Processes


    FIGURE 4.1

    pstree utility graphically shows the relationship between processes.


    ![](img/a66a597da3b52cd2cf8b35a8b972f497_111_0.png)


    The columns show the standard PID information, as well as the amount of memory
    and the number of CPU processes being used.


    # Ending a Process


    Processes are started in a plethora of ways. They are started automatically as
    daemons, as well as started by the user in attempting to get a job done. Other
    processes start processes, and the list goes on in ways processes come to be.


    Under normal circumstances, a child acts on behalf of, and reports to, a parent.
    When the child is no longer needed, it goes away on its own accord. There are
    situations, however, in which processes become runaways—they are no longer needed,
    yet they continue to run and consume processes.


    A parent process cannot (or should) cease as long as child processes are associated
    with it. Given, a child process fails to cease keep a number of unneeded processes
    on a system. To illustrate, assume that a user''s shell calls another process
    (A), which cannot do everything needed, and thus it calls another (B), and in
    turn starts another (C).'
  merge: -1
