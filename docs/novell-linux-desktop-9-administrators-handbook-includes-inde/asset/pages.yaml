    # SWITCHING BETWEEN passwd AND shadow


    In the manual example for creating a new user, the encrypted password appears
    in the /etc/passwd file and not the /etc/shadow file. If you want to do manual
    additions, and will use /etc/shadow, the pwconv utility is irreplaceable. This
    utility reads the entire passwd file and converts new entries into shadow files.


    The opposite of pwconv is pwunconv u, which takes entries from the shadow file
    and places them in the appropriate format in the passwd file. As a final step,
    pwconv removes the shadow file completely.


    # THE SU UTILITY


    The entries in the passwd file represent valid accounts that can log in. Any user
    can sit at the system and give the correct username and password combination to
    log in as that user. Any user already logged in also use the su utility (su stands
    for substitute userID) to change identity to another if he knows the other user''s
    password. This creates a subshell, you, in which one user becomes another, and
    can revert to his identity by typing exit.


    Although there are dozens of harmful reasons why a user might want to become another,
    there are also very legitimate reasons why su. If su is called without an argument
    it tries to make the user superuser (root), needing the password for that account.
    Therefore, as an administrator, it is possible for you to log in as a typical
    user without root permissions and begin your day. The lack of root permissions
    can be a blessing as it can keep you from deleting entries you unintentionally,
    and so on. When a user comes up with a problem, you can use su to become root—with
    all rights and privileges as if you had logged in such—fix the user''s problem,
    and then exit back to your regular account again.


    # USING sudo


    Another utility, sudo, works the same as su but can be limited by entries in the
    /etc/sudoers configuration file. The entries in this file can limit which users
    can use sudo and even limit which actions sudo can perform in the new shell.


    Read the comments in the /etc/sudoers file to understand how to configure this
    file.'
