    # # Konqueror


    The Konqueror file manager, shown in Figure 3.12, is an object browser of sorts
    that allows you graphical access to all entities (file objects, http objects,
    network objects, network protocol objects, and so on). It automatically takes
    you to your home directory when it is accessed through the Home shortcut. In the
    upper-right corner, there are four button choices. The question mark is used to
    access help. The underline is used to minimize the window. The square is used
    to restore the window to its regular size. The X button is used to close the window.


    A number of icons appear below the menu bar. Starting from the left, the up arrow
    is used to take you to the next level; for example to /etc /etccups. The left
    arrow moves you back to where you were previously. The right arrow moves you forward
    (after you have gone back). The house icon takes you to your home directory. The
    circle icon reloads, or refreshes the display. The X stops loading the current
    page. To the right of these icons are for cutting, copying, pasting, printing,
    and changing icon sizes and views.


    A number of icons appear along the left frame. Starting from the top, the wrench
    icon allows you to configure the navigation area. The star shows your


