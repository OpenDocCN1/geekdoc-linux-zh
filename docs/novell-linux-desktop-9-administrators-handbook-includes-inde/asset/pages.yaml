    # # Working with Links


    The purpose of a link is to allow one file to be referenced by more than one name.
    There are any numbers of why you would want or need to do this, for example:


    +   - For historic purposes—Assume that you want to combine all the vendor information
    into a single file. In the past, marketing has always had a file in which similar
    information was kept and called vendor, whereas accounting kept in a file called
    contacts, and admin information was called references. When you create the single
    file, you can make it available by all three names so that all parties can find
    it as they formerly did.


    +   - To make the nonlocal local local—Assume that there is a template that all
    users are to use when making system modification requests. This file can exist
    in the root user''s home directory (/root), and a link created within each user''s
    home directory (/home/user) to make it appear as if it exists within their directory.


    The utility to create links is 1n. When you create a link, you are merely creating
    another pointer to an already existing entity; because this is the case, only
    one inode is used, not two. Because there is only one copy, you are also saving
    disk space.


    # Note


    When you link to a file to give others access, you must make certain that they
    have appropriate permissions to access the file, or you are defeating your purpose.'
