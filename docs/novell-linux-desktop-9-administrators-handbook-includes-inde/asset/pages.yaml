    Some examples of how these options can be used follow. For the first, assume that
    we want to get a long list (ls -1) of the subdirectories beneath the current directory
    and no interest in actual filenames. Within the output of ls -1, the first field
    shows the permissions of the entry. If the entry is a file, the first character
    is "-" and if it is a directory, it is "d." Thus, the command would be ls -1 |
    grep "^d"


