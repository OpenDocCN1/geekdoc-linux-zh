  md: '# Living with Novell Linux Desktop


    Novell Linux Desktop was designed to be the best open-source operating system
    on the market. Although it sounds like a lofty aspiration, it is an objective
    product not only meets, but also exceeds.


    NLD can function well as a desktop operating system on alone-system or in a network
    of almost any type. It seamlessly interacts with Novell-based networks such as
    those running OES (Open Enterprise Server) and SLES (SUSE Linux Enterprise Server),
    as well as networks running Microsoft-based servers and those running Unix and
    other variations of Linux as well.


    In this chapter, we will look at several different scenarios in which NLD can
    be deployed.


    # NLD as a Standalone Operating System


    The vast majority of this book discusses features of Novell Desktop that make
    it an excellent choice for the operating system on a standalone PC, such as a
    laptop computer. It includes OpenOffice.org for all your office applications,
    and support is included for the standard Microsoft Office file formats.


    Figure 13.1 shows the Office menu available with Novell Linux Desktop. Figure
    13.2 shows the main screen of the word processor.'
  merge: -1
