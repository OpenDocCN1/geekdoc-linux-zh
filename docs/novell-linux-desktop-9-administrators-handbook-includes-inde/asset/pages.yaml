  md: '# CHAPTER 13: Living with Novell Linux Desktop


    +   * ifup—Starts a preconfigured network interface

    * ifstatus—Displays the status of a preconfigured network interface

    * netstat—Displays network status information

    * ping—Displays echo messages to show whether or not a host can be reached

    * route—Displays the routing table

    * telnet—A utility for establishing a connection with a remote host

    * traceroute—Displays the route taken to reach a remote host


    # Miscellaneous Tools


    The following tools are useful when looking to solve a very specific problem or
    more information:


    +   * apropos—Returns a short summary of information from whatis

    * at—Allows you to schedule a job to run at a specified time

    * find—Locates a file based on given criteria

    * fuser—Used to monitor user access to files

    * info—Shows the help information available on a command

    * KFind—A graphical version of find

    * lsof—Lists open files

    * man—Displays the manual pages for a command/utility/file

    * whatis—Returns information about the utility or command

    * whereis—Lists all information it can find about locations associated with a
    file


    # Summary


    This chapter looked at the integration of Novell Linux Desktop with other environments.
    It discussed using NLD in a standalone environment as well as in a Windows-based
    network and a Novell-based network.'
