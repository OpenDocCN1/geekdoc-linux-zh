  md: '# Removing Files and Directories


    When files are no longer needed, they can be removed from the system with the
    rm (remove) command. Be careful using this command, for Linux offers no undelete
    command or function like found in other operating systems.


    ```

    $ ls -l file**

    -rw-r--r- 1 root root 85 Aug 22 10:26 fileone

    -rw-r--r- 1 root root 16432 Aug 28 13:43 filetwo

    $ rm fileone

    $ ls -l file**

    -rw-r--r- 1 root root 16432 Aug 28 13:43 filetwo

    $

    ```


    When used with the -i option, a prompt appears before each file to be deleted.
    Pressing Y deletes the file, and any other character skips the file.


    ```

    $ ls -i t**

    -rw-r--r- 1 root root 85 Aug 22 10:26 today

    -rw-r--r- 1 root root 16432 Aug 28 13:43 tuesday

    $ rm remove ''today?''

