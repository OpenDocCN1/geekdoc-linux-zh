    The shell interprets the quotation marks as meaning that the text within them
    should be taken as a single entry. The shell performs the operation given it and
    loses the quotes in the process. To get around this, you must use the backslash
    (\) to override the default meaning of the quotes:


    ```

    echo Evan says \"Hi\"

    ```


    Note that the backslash—literal—character must precede each incidence of the quotes,
    and is always only good for the character immediately following it.


    # Command History


    The bash keeps a list of commands that you give it and allows you to reuse those
    commands from the list rather than needing to retype them time. From the command
    line, you can use the up and down arrows to scroll through recent commands. You
    can also enter two bangs (!!) to rerun the very last command you gave.


    Note


    Many Unix/Linux geeks refer to the exclamation point as bang.


    Typing history shows all the commands that are stored, with an incrementing number
    on the left. Typing a single bang and one of those command numbers will rerun
    that command, as in !205.


    Note


    Instead of seeing the entire history list, you can choose to see only the most
    recent entries by following the history command with the number of lines you want
    to see, like this:


    ```

    history $

    history 10

    ```'
