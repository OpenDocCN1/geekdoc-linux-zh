  md: '# Basic Shell Tools


    Regardless of what type of network—if any—you install NLD into, there are a number
    of tools and commands that can help you interact with the network server from
    the command line. The majority of these have been mentioned throughout the book
    and are summarized here:


    +   * bg—Move a job to the background

    * cat—Displays the contents of a file

    * cd—Changes from the current directory to another

    * chgrp—Changes an entity''s group association

    * chmod—Changes an entity''s permissions

    * cp—Copies a file or directory

    * edquota—Creates quotas for users or groups

    * getfacl—Shows the Access Control List for a file

    * grep—Displays lines that contain the given string

    * head—Displays the beginning lines of a file

    * jobs—Displays a list of jobs running in the background

    * join—Combines columns from two files into a single display

    * kill—Ends a process

    * killall—Ends several processes

    * locate—Finds a file from the locateddb

    * ls—Lists files and directories on the system

    * mkdir—Makes directories

    * mv—Renames/moves a file or directory

    * nice—Starts at a priority other than the default

    * paste—Puts the contents of two files in a single display

    * ps—Shows the running processes

    * pstree—Graphically depicts the relationship between processes

    * pwd—Displays the current directory in absolute format

    * quotaoff—Turns off user/group quotas

    * quotaon—Turns on user/group quotas'
  merge: -1
