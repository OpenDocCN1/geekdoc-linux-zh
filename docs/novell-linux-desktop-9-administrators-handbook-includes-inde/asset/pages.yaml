- img_proc: true
  md: '# Working with File Permissions and Ownership


    These permissions are discussed in the following sections.


    # SUID


    The Set User ID permission is used when you have an executable file that a normal
    user would not be able to run, but must. For example, only the root user should
    be able to function xyz (start backups, restores, log in to other devices, and
    so on) because of the security ramifications, and if you need the users to run
    a shell script to perform this action you don''t have time to do personally?


    You can create the script as root and set the SUID permission such that whoever
    runs the script will become root within the framework of the script. Before and
    after the script, they are themselves, but the script runs as root.


    The numerical value of SUID is 4000, and it is added to the value of other permissions.
    When applied, it changes the “x” that would appear in the execute field for the
    owner’s permission to set an “s:


    ```

    $ ls -1 turbo2

    -rwxrwxx 1 root      542 Sep 9 20:02 turbo2

    $ chmod 4777 turbo2

    $ ls -1 turbo2

    -rwsrwxwx 1 root      542 Sep 9 20:02 turbo2

    ```


    Remember, the value of this permission is that the process runs as the owner of
    the person who created it (root in this case) and not as the person executing
    it. To do the same operation in symbolic format, the command would be


    ```

    chmod u+s turbo2

    ```


    # SGID


    Similar to SUID, the Set Group ID permission is used when you need the person
