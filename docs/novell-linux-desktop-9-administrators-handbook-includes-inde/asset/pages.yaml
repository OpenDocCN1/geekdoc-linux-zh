    # Creating and Managing Users


    During the installation of the operating system, at least one user (root/superuser)
    must be added to the system, and you are also prompted to add at least one user.
    The root user is the most powerful user on the system and literally able to do
    almost anything. It is almost always necessary to add additional users and modify
    variables associated with existing ones. Both tasks will be examined further in
    this section.


    You can add users at the command line or through YaST (which is discussed in the
    “Working with Security and Users” section in Chapter 5, “Working with YaST”).
    To understand what is involved, however, it is important to know the files the
    operating system uses to deal with users, regardless of the way in which you administer
    them. The first file of importance is the /etc/passwd file. Fields are delimited
    by colons, and an example reveal the following:


    ```

    root:x:0:0:root:/bin/bash

    bin:x:1:1:bin:/bin

    daemon:x:2:2:daemon:/sbin

    adm:x:3:4:adm:/var/adm

    lpx:x:4:7:1:/var/spool/lpd

    sync:x:5:0:sync:/sbin/bin/sync

    shutdown:x:6:11:shutdown:/sbin/shutdown

    halt:x:7:0:halt:/sbin/halt

    mail:x:8:12:mail:/var/spool/mail

    news:x:9:13:news:/var/spool/news

    ```'
