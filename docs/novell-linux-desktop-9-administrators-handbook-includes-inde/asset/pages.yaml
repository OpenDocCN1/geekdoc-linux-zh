    # Configuring Routes


    Three types of routes exist to help IP packets make their way to their final destination:


    +   - Host routes

    - Network/gateway routes

    - Default routes


    The purpose behind any route is to point the way for the data to find its target,
    and the tool to use with routes is simply the **route** utility. To add a route,
    use the **route add** command. To delete a route, use the **route del** command.'
