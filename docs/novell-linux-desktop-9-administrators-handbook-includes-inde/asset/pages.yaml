  md: 'Working with Hard Disks


    # NOTE


    The mkfs utility can be used to format floppy disks as well as hard drives, the
    utility fdformat is much simpler to use for the former.


    As stated previously, you can choose from a number of different filesystems that
    are supported in Linux. Regardless of the number, you can create two types of
    local, physical filesystems: traditional and journaling. Journaling filesystems
    that keep track of their pending actions and store them in a log file to ensure
    integrity and get the loss of data to crashes. Journaling filesystems include
    ReiserFS (the NLD default), and ext3.


    Traditional filesystems include ext2, vfat, and so on. You would only use vfat
    or msdos filesystems on systems where you have dual-booting Windows or embedded
    systems that only know about msdos.


    # TIP


    As a general rule for Novell Linux Desktop, use reiserfs—what the system uses
    by default—unless you have a compelling reason to go with something else.


    Virtual filesystems are hybrids that are only created by the system, with the
    exception of loopback filesystems (which are totally different from tmpfs and
    sysfs filesystems). Virtual filesystems are re-created each time the system boots
    and are used internally by the system for process, resource, shared memory, and
