  md: '# CHAPTER 8: Working With Files


    Note


    Links cannot cross filesystems because they refer to inodes, which are filesystem
    specific.


    # Symbolic Links


    To make a symbolic link, you must use the -s option with ln. A symbolic link is
    what one might equate with "shortcuts" in the Windows operating systems: small
    files that point to another file. The primary purpose for a symbolic link is to
    get around the shortcomings of hard links. As such, they allow users to directories
    and allow links to cross filesystems.


    To illustrate how a symbolic link is created, consider the following example:


    | $ ls -l | root root | 1024 Sep 22 23:57 | Desktop |

    | -rwxr-xr-x 1 | root | 81 Sep 23 00:25 | friday |

    | -rwxr-xr-r 2 | root | 194 Sep 24 15:09 | monday |

    | -rwxr-xr-r 2 | root | 194 Sep 24 15:09 | thursday |

    | -rwxr-xr-r 1 | root | 152 Sep 23 00:26 | tuesday |

    | -rwxr-xr-r 1 | root | 38 Sep 23 00:26 | wed |


    ```

    $ ln -s friday saturday

    $ ls -l

    drwx------ 5 | root | 1024 Sep 22 23:57 | Desktop |

    -rwxr-xr-x 1 | root | 81 Sep 23 00:25 | friday |

    -rwxr-xr-r 2 | root | 194 Sep 24 15:09 | monday |

    lrwxrwxrxrwx 1 | root | 6 Sep 24 15:49 | saturday -> friday |

    -rwxr-xr-r 2 | root | 194 Sep 24 15:09 | thursday |

    -rwxr-xr-r 1 | root | 152 Sep 23 00:26 | tuesday |

    -rwxr-xr-r 1 | root | 38 Sep 23 00:26 | wednesday

    ```


    There are several items to note about this transaction:


    +   * The link count on friday did not change.


    +   * The new file will always have the first column called "lrwxrxrxrwx" to indicate
    that it is a link.


    +   * The date and time on the new file are not equal to the old file, but instead
    are the current date and time—this is because a new file has been created (with
    its own inode).'
