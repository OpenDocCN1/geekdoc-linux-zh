    # Creating User Accounts at the Command Line


    Note


    Adding users through YaST, the graphical interface, is discussed in the “Working
    with Security and Users” section in Chapter 5.


    New users can be created manually or by using command-line utilities. To do so
    manually, simply append an entry to the /etc/passwd file. (It is strongly recommended
    that you make a backup copy of the file before changing.) You can leave the password
    field blank, and then assign a password using the passwd utility. If you leave
    it blank, it is a valid account without a password:


    ```

    $ cat >> /etc/passwd

    evan::504:100:EvanD:/home/evan:/bin/bash

    {press Ctrl+D}

    $ passwd evan

    New user password: {enter password}

    ```'
