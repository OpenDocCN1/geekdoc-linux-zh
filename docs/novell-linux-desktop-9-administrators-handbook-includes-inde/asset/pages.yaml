    # Background and Foreground


    When a process is started, the default is for it to run in the foreground. In
    the foreground, it becomes the only job you can work on and interaction is based
    on completion of the job. For example, when a user runs 1 ls -1, the display appears
    on his terminal, and he is unable to issue another command until ls is finished.


    To run a process in the background, simply add an ampersand (&) to the end—allows
    you to run more than one command at the same time. For example, the sleep command
    simply enables the process to wait a given number of seconds before anything else
    happens, and it can be used by itself as a means of illustration:


    ```

    $ sleep 90 &

    [5] 31168

    $ 31168

    ```


    The number that appears in the brackets is equal to the number of jobs currently
    have running in the background. The number following it (31168 in this case) is
    the process ID number of this job.


    Note


    The PID of the last job placed in the background can also be referenced as $!.
    The scope of this is the current shell; this will be different in each shell.


    Placing the job in the background allows the user to continue working and starting
    processes. If you must wait for a process to finish before starting another, the
    wait command, used with the PID of the process, can cease processing until the
    specified process finishes. For example,


    ```

    $ sleep 120 &

    [5] 31175

    $

    $ wait 31175

    ```'
