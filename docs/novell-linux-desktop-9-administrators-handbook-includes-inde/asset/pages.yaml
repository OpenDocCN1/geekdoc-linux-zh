    # # Understanding Printing


    Chapter 5 shows how to add a printer, but it does not go into detail on what transpires
    when you print. Knowing the basics behind printing operations is imperative to
    being able to diagnose and troubleshoot printing issues.


    In this section, we will walk through the basics of printing. We will examine
    the commands that can be used to administer and work with printers and print jobs.
    There are several ways in which this can come about, and we will start with the
    most simple models first and from there.


    NOTE


    Before installing any printer, you should verify that it is supported in Linux
    by checking the printer database at http://www.linuxprinting.org/


    157'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# CHAPTER 6: Working with Devices


    # Printing a File


    Let''s start the discussion by looking at the legacy method of printing and move
    up from there. Unix systems traditionally used a printing system that required
    a daemon called 1pd, which was used as the basis of the original Linux print subsystem
    and its descendant, LPrng. This daemon has been around, and is virtually unchanged
    in operation, since the early days of Unix. The first utility written to allow
    jobs to be submitted to the daemon on AT&T-based Unix was 1p. This utility still
    exists and is included in many versions of Linux, but is generally overlooked
    in favor of 1pr, which is a newer utility with more logical options and originated
    with BSD-based Unix.


    This discussion focuses on LPrng, CUPS, an alternative to LPrng (alternate printing/spooling
    method for Linux systems), is discussed later in this chapter. The disparities
    between the AT&T and BSD Unix printing subsystems was a big reason that CUPS came
    to.


    A user can choose to print a file in one of two ways:


    +   - From within a graphical interface

    - From the command line


    The simplest syntax to use from the command line is lpr {filename}


    So if you wanted to print a file named Saturday, the command would be lpr Saturday


    You must have a printer setup first for this to work. Otherwise, an error indicating
    that the scheduler is not responding will always result.


    When this command is issued, a number of other processes kick in. If the printer
    does not exist, the job will spool to nothing. Assuming that the printer does
    exist, after the print job is sent to the appropriate queue for a printer, the
    daemon removes the job from the printer and produces the finished output. As long
    as the file exists, entries for it remain in the spooler beneath /var/spool/1pd.'
  merge: -1
  pgno: 174
- img_proc: true
  md: 'Understanding Printing


    # NOTE


    A list of supported printers for Linux can be found at http://www.linuxprinting.org/.
    Although their presence in this list is reassuring, printers do not, technically,
    need to appear on this list in order to work well with Linux. Any PCL or PostScript
    printer, for example, will work with Linux with proper drivers.


    Once properly configured and functioning, the printing service in Linux runs very
    smoothly.


    # Formatting a File


    When discussing printing options, one utility to be aware of that is valuable
    for formatting is pr. The primary purpose of this utility (/usr/bin/pr) is always
    to convert the contents of a text file before sending the output to a printer.


    The output includes a default header with date and time of last modification,
    filename, and page numbers. The default header can be overwritten with the -h
    option, and the -1 option allows you to specify the number of lines to include
    on each page—with the default being 66. Default page width is 72 characters, but
    a different value can be specified with the -w option. The -d option can be used
    to double-space the output, and -m can be used to print numerous files in column
    format.


    # Moving Up to CUPS


    In newer Linux implementations, including Novell Linux Desktop and SUSE, CUPS
    (Common Unix Printing System) replaces much of the functionality of lpr/lpd. CUPS
    is a superset of lpr/lpd, not a subset. It introduces much new value, such as
    classes and detailed printer-oriented authentication. From an operations standpoint,
    however, there is great similarity:


    +   1. The user submits the job.

    2. The file is spooled—in this case, beneath /var/spool/cups/.

    3. The cupsd daemon formats the data in the spool and sends it to the printer.

    4. When the job is done printing, the daemon removes the files from the queue.


    159'
  merge: -1
  pgno: 175
- img_proc: true
  md: '# CHAPTER 6: Working with Devices


    The /etc/cups/cupsd.conf file or /etc/cups/cupsd.y2 sample file contains an enormous
    amount of narrative and comments that fully explain how to configure cups. Although
    space does not allow printing the file in its entirety here, it is highly recommended
    that you carefully walk through the file on your system and make that you understand
    the options available.


    The /etc/init.d/cups stop command is used to start the service, and the /etc/init.d/cups
    start command is used to manually start it. (Once configured, it should start
    automatically at boot using the startup script /etc/init.d/cups.)


    # Using the Add Printer Wizard


    In addition to using YaST (discussed in Chapter 5), you can also choose to install
    the printer using the Add Printer Wizard in KDE, as shown in Figure 6.10. To access
    this, click on the (N), and choose Control Center. In the Index, choose Peripherals,
    and then Printers. Next, select Add, and then choose Add Printer/Class.


    NOTE


    You can only add physical printers when logged in as root or using tools such
    as the Control Center in Administrator mode. In order to create systemwide printers,
    you need to be able to write to files owned by root in /etc/cups and to the spool
    directories.


    Yet another method for configuration is to use kprinter. This is accessed by pressing
    (N) for the KDE menu, and choosing Utilities, Printing, Printing Manager. This
    utility, shown in Figure 6.11, allows you to interact with all aspects of the
    printer configuration, including manage jobs. When you choose Add, it brings up
    the same Add Printer Wizard shown in Figure 6.10.


    Regardless of the method used to add the printer, a number of things happen when
    it successfully joins the system: /etc/cups/printers.conf.


    +   - A print queue is added to /etc/cups/printers.

    - A ppd file for the printer is placed in /etc/cups/ppd for settings.

    - The print queue is added to /etc/printcap.


    A network printer can be set up as easily, and it will support SMB (Standard Message
    Block—for printing from Windows-based clients), IPP (Internet Printing Protocol),
    and the LPD protocol previously discussed. Most of these options are available
    to you when choosing the printer type.'
