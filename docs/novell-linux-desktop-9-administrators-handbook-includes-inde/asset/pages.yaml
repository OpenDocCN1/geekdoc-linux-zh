  md: '# CHAPTER 9: Booting and Runlevels


    8. The system begins changing to the runlevel specified (as shown in Figure 9.4)
    by the initdefault parameter in inittab (runlevel 5 is the default—which is full
    multiuser mode with network and xdm). In doing it, it runs scripts (startup files
    associated with the current runlevel) beneath the /etc/rc.d directory (in this
    case, those in /etc/rc.d/rc5.d) and usually starts other processes/daemons such
    as a print server, cron, sendmail, and so on.


    FIGURE 9.4


    The OS loading completes.


    ![](img/a66a597da3b52cd2cf8b35a8b972f497_250_0.png)


    9. The terminals become active for login as getty is initiated for each, as shown
    in Figure 9.5. The boot process of the system is now finished.


    # Note


    If you are solely logging in xdm, you will never see the terminal login prompts
    unless you go to a different virtual console.


    234'
