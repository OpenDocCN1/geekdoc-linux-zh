    # jobs


    To see the jobs that you have running in the background, use the command jobs:


    ```

    $ jobs

    [1] Stopped      vi fileone (wd: ~)

    [2]- Stopped      paste -d '' filetwo (wd: ~)

    [4]+ Stopped      awk -F: questions (wd: ~)

