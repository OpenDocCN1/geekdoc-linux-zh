    # grep


    The first attempt to greatly enhance grep is grep—as in "file grep" or "fast grep."
    This utility was created during the days of Unix and prior to Linux. It enhanced
    grep by adding the ability to search for more than one item at a time (some that
    grep has gained since the -f option). The tradeoff for gaining the ability to
    search for multiple items was an inability to use regular expressions—never mind
    what the acronym stood for.


    Adding the additional functionality to grep, and facing the inability to use regular
    expressions here, grep still exists but is rarely used in place of grep. In fact,
    one of the options added to grep is -F, which forces it to interpret the string
    as a simple string and work the same way grep would. (The default action is -G
    for basic expressions.)


    # Note


    For most practical purposes, grep -F is identical to grep.


    # egrep


    The second attempt to enhance grep is egrep—as in "extended grep." This utility
    combined the features of grep with those of fgrep—keeping the use of regular expressions.
    You can specify multiple values that you want to look for within a file (-f),
    on separate lines (using uneven number of quotation marks), or by separating with
    the pipe symbol (|). For example,


    ```

    $ cat names

    ```


