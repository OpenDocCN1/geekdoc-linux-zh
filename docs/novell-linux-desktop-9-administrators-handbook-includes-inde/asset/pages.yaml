- img_proc: true
  md: '# CHAPTER 1: What is the Novell Linux Desktop


    Ray Noorda, one of the first CEOs of Novell, saw the value of the Linux operating
    system early on and formed another company—Caldera—to pursue opportunities there.
    This company eventually grew to purchase the SCO Group, and changed its name to
    SCO.


    In 2003, Novell purchased Ximian, a cutting edge Linux company formed by Miguel
    de Iaca and Rat Friedman—two visionaries in the Mono movement for an open-source
    platform. In 2004, Novell purchased SUSE—the biggest vendor of Linux in Europe.


    # The Novell Linux Desktop


    The Novell Linux Desktop (NLD) came into being by the incredibly stable SUSE Linux
    with elements from Ximian and other Novell products. Not only is it one of the
    best operating systems on the market today, but also one of its unique attributes
    is the inclusion of office productivity software from OpenOffice.org included
    along with support for the standard Microsoft Office formats.


    In addition to the items already mentioned, the Novell website lists the following
    features/selling points to consider during migration contemplation:


    +   * AutoYast automated installation tool

    * Familiar look and feel

    * Typical installation in under one hour


    Factor in that NLD also includes the following, and you can see the elasticity
    of the operating system to fit any needs:


    +   * Mozilla Firefox browser

    * Novell iFolder for file sharing and mobility

    * 2.6 Linux kernel

    * Acrobat Reader, Macromedia Flash Player, RealPlayer 10, and so much more


    This book looks at NLD and walks through the use and administration of it. Whether
    you are new to Linux, or just new to NLD, one thing is for certain: You''ll be
    delighted by your choice of a desktop operating system and astounded by all that
    it can do.'
  merge: -1
