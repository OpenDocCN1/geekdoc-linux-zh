  md: '# CHAPTER 4: Working on the Command Line


    # Searching for Text


    Another method of moving through the file besides using navigational keys is to
    perform a search. You can search the file for string values, and the screen containing
    the first occurrence of that string will become your current view of the file.


    Searches are initiated by pressing the slash key (/) and entering the string value
    to search for. As you enter the text sequence, the editor will move through the
    file looking for a match.


    When you have entered the search string, press Enter to signify that you are done.
    All searches automatically begin at the top of the document. To move the cursor
    to the next instance, use the n command (for next). To move backward through the
    file, use the N command.


    Two characters can be used with the search to specify where the located text must
    reside:


    +   - ^ to signify that the text must be at the start of the line

    - $ to signify that the text must be at the end of the line


    For example, to find the string "is" only if these two characters are the last
    characters on the line, the search syntax would be

    /is$


    You can also use many of the wildcard options present in grep and similar utilities:


    +   - \ to ignore the following character''s special value

    - [] to find multiple values

    - \< to find matches at the beginning of a word


    If you need to find values and change them, you can do so using the substitute
    command (s), with syntax resembles sed:

    :first_line, last_line s/old string/new string/


    For example, to change all occurrences of "speed" to "pace" in lines between the
    first and thousandth, the command is

    :1,1000 s/speed/pace/


    Note


    The question mark character (?) can be used to search backward through the file.'
