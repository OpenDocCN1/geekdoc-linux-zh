    with the following command:


    ```

    ls -z 2> myfile

    ```


    The problem is now that the error will be sent there, but the output (in the absence
    of an error) will appear on the screen. To send both output and errors to the
    same file, or to send errors to standard output (1), the command becomes


    ```

    ls -z > myfile 2&

    ```


    This states that the output is to go to a file named **myfile** and further that
    standard error (2) is to go to the same location as standard output (1). Another
    alternative is to send errors to one location and output to another, like this:


    ```

    ls -z > myfile 2>>errors

    ```


    Let''s look at the order of operations here: The shell creates two files (**myfile**
    and **errors**) with zero sizes (whether or not existed before). If the command
    is successful, the output goes to **myfile**. If the command is unsuccessful,
    the errors go to **errors**. If these were truly log files, the only other modification
    might be to append rather than create each time the operation is run:


    ```

    ls -z >> myfile 2>>errors

    ```'
  merge: -1
