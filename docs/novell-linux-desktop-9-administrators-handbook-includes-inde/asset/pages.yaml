  md: '# CHAPTER 8: Working With Files


    # STICKY BIT


    The last permission does not work as the other special permissions do. With a
    numeric value of 1000, its operations differ when applied to a directory versus
    a file. When applied to a directory, it prevents users from deleting files from
    folders that grant them the write permission unless they are the owner of the
    file. By default, any user who has write permission to a directory can delete
    files within that directory even if the user doesn''t have write permission to
    that file.


    When the sticky bit is applied to a file, the file becomes “sticky” (hence the
    name). The first time the file is run or accessed into memory, it stays loaded
    into memory or swap space so that it can run faster than if it had to be read
    from the drive.


    If the file is not executable, the last permission (“x” for the other category)
    becomes “T.” If the file is an executable file or a directory, the last bit becomes
    “t.”


    # Copying and Moving Files and Directories


    System administration would be so much easier if nothing ever moved or changed.
    Unfortunately, it is very rare for anything to stay static anymore, changes take
    place at a nonstop pace. Linux offers two powerful utilities for copying and moving
    files: cp and mv, respectively.


    # cp


    cp works with both files and directories and can move multiple entities at a time
    using wildcards. After the name of the utility, you must specify the source, followed
    by the target. The simplest use of all can be illustrated as follows:


    ```

    $ ls -l onefile

    ls: No such file or directory

    -rw-r--r- 1 root 85 Aug 22 10:26 fileone

    $ cp -l onefile

    -rw-r--r- 1 root root 85 Aug 22 10:26 fileone

    -rw-r--r- 1 edulaney users 85 Aug 30 16:18 onefile

    $

    ```'
