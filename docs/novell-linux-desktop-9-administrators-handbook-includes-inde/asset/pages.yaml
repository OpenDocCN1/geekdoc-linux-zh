- img_proc: true
  md: '# The mnt Directory


    The mnt directory is used to contain mountpoints (directories) for other filesystems
    or devices that are mounted. The entities that appear in this directory are never
    on this filesystem, but rather external resources that can be linked to and accessed
    from here. The external resources can be other filesystems, or devices.


    The devices will appear as directories with common names. The tmp-directory is
    intended to hold temporary files, but the use of /tmp is preferred. External filesystems
    are loaded—and thus appear beneath this directory—with the mount command and removed
    with the umount command.


    # The opt Directory


    The opt directory is used to hold optional (add-in) application software. Not
    all applications install themselves here, but when they do create a subdirectory
    to hold the binaries, libraries, configuration data, and documentation associated
    with that application using the application name. For example, if an application
    was named DEF, the directory it should create be /opt/DEF


    There is no requirement that third-party applications must write their values
    here, but it is traditional from the days of Unix. Some common subdirectories
    to find here


    +   - kde3—For the K Desktop Environment variables

    - MozillaFirefox and mozilla—For the browser

    - gnome—For desktop binaries, libraries, and such needed for this graphical interface

    - node1—For NNLS (Novell Nprise Linux Services) files


    # The proc Directory


    The proc directory is a virtual filesystem. A virtual filesystem is dynamically
    generated, transient, and created in memory at boot time (re-created each and
    every time you boot your system). /proc holds information about processes, the
    kernel, and system information.


    Processes are depicted as directories (see Figure 7.2)—each having permissions
    and variables associated with it. Other system information is most commonly depicted
    as files.'
