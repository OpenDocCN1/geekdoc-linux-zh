  md: '# CHAPTER 9: Booting and Runlevels


    +   - powerokwait—Wait until the power is okay before continuing

    - sysinit—Run before any users can log on

    - wait—Allow completion before continuing on


    The init daemon is responsible for carrying out changes that need to be taken
    in relation to runlevels. The init daemon is summoned by the init utility. (Remember,
    the init utility is also called by telinit and shutdown.)


    The init daemon is the first service to come alive upon a boot, and reads and
    executes entries in the /etc/inittab file. After completion, the init daemon stays
    active and spawns processes that are supposed to run but die off, as well as interacting
    with the log files (utmp and wtmp from beneath /var/ or /etc).


    If you modify the /etc/inittab file, the changes you make will not be active until
    the system reboots, or you run this command:


    ```

    init q

    ```


    # LILO and GRUB


    Two bootloaders are currently used in Linux and supported in NLD: LILO and GRUB.
    The Linux Loader enables Linux to coexist on your machine with other operating
    systems: Up to 16 images can be swapped back and forth to designate what operating
    system will be loaded on the next boot.


    Note


    NLD uses GRUB, by default, but can be configured to use LILO.


    By default, LILO boots the default operating system each time, but you can enter
    the name of another operating system at the BOOT prompt, or force the prompt to
    appear by pressing Shift, Ctrl, or Alt during the boot sequence. Entering a question
    (or pressing Tab) will show the available operating systems as defined in the
    /etc/lilo.conf file: This is a text file that can range from simple to complex
    based on the number of Oses you have. Changes can be made to the file and are
    active when you run /sbin/lilo.


    Different options can be used with the lilo command are:


    +   - b to specify the boot device

    - C to use a different configuration file'
