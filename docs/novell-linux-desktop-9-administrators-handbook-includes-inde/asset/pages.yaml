  md: '# CHAPTER 6: Working with Devices


    # Printing Utilities


    A number of utilities exist to work with various components of the printing service.
    The first to examine is lpc—the line printer control program. This utility can
    be used on any printer defined in either the printcap or lpd.conf files. To see
    an extensive list of all the options it offers, first start lpc by entering the
    command at the command prompt, and then type m for the menu at the lpc> prompt
    if you use LPRng, or a question mark (?) if you are CUPS. You can exit out of
    lpc pressing q for quit.


    The lpq utility is used to list jobs within the queue. Very similar to the status
    command within lpc, it gets its information directly from the daemon.


    # NOTE


    An older utility with the same basic functionality as lpq is lpstat. This utility
    is used to check the status of the lp service and queue. This works with LPRng,
    but not CUPS.


    The lprm utility is used to remove jobs from the queue. When used, it sends a
    request to remove the jobs, based on job number. If no job number is given, it
    attempts to remove the last job you submitted.


    The lpadmin utility is used for creating and manipulating printer and class queues—in
    brief, of the configuration you can do YaSt from the command line. A complement
    to this utility is lpoptions, which is used for setting any printer defaults from
    the command line. Some of the options that can be used with it include


    +   - -d To set the default printer

    - -h To specify the CUPS server

    - -p To set the destination and instance


    If you are sharing your printer across the network, there are a few other files
    that can be helpful, although they are not utilities such:


    +   - /etc/cups/cupsd.conf\u /etc/cups/cupsd.conf—This file holds the names of
    hosts that are allowed to access the printer in CUPS.

    - /etc/hosts.lpd—This file holds the names of hosts that are allowed to access
    the printer in LPRng.

    - /etc/hosts.equiv—This file holds the names of hosts allowed to access this machine
    (not just the printer) as if they were local.


    162'
