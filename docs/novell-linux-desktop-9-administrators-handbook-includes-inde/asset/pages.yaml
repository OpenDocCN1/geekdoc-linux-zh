  md: '# Working with Files


    This chapter focuses on working with files and builds upon the discussion of the
    Linux filesystem in the previous chapter. The topics addressed here de include
    how to create files, change their characteristics, modify permissions on them,
    and remove them.


    # Working with File Permissions and Ownership


    Permissions determine who can and cannot access files and directories, as well
    as what type of access the permission holders have. The first 10 characters of
    an ls -1 listing of any entity resemble the following:


    +   - rwxrwxwx


    The first character identifies the type of entity: "-" for a standard file, "d"
    for a directory, "b" for a block device (such as a tape drive), "c" for a character
    device, "l" for a link, or "p" for a pipe.


    The remaining nine characters can be broken into three groups, as shown in Figure
    8.1.


    FIGURE 8.1


    Permissions divide into three sections.


    ![](img/a66a597da3b52cd2cf8b35a8b972f497_219_0.png)'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# CHAPTER 8: Working With Files


    When a user attempts to access a file, the first check is to determine if the
    user is the owner of the file. If so, the first set of permissions apply. If the
    user is not the owner, a check is completed to see if the user is a member of
    the group owning the file. The second set of permissions applies. If she is not
    the owner of the file, and not a member of the owning group, the third set of
    permissions applies.


    # Standard Permissions


    The available permissions can be assigned to an entity—either owner, group, or
    other—are


    +   - r—To read a file. This is the only permission needed to copy a file as well.
    When applied to a directory, it grants the ability to read (see) the files within
    the directory.

    - w—To write a file. Writing allows you to change the contents, and overwrite
    files. When this permission is applied to a directory, you can delete and move
    files within the directory (even if you don''t specifically have write permission
    to an individual file).

    - x—To execute the file if it contains scripts or can otherwise be run by the
    system. On a directory, it allows you to change to a specific directory. When
    applied in conjunction with read on a directory, it allows you to search the directory.

    - -(dash)—Indicates the absence of a permission. For example, r-x would indicate
    that the user can read and execute, but cannot write.


    Thus, to summarize the 10 fields in the permissions, they are


    +   1. What type of entity (file, directory, and so on)

    2. Whether the owner can read

    3. Whether the owner can write

    4. Whether the owner can execute

    5. Whether the group can read

    6. Whether the group can write

    7. Whether the group can execute

    8. Whether others (not group or owner) can read

    9. Whether others can write

    10. Whether others can execute'
  merge: -1
  pgno: 220
- img_proc: true
