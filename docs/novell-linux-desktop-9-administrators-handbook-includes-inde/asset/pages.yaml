- img_proc: true
  md: '# CHAPTER 8: Working With Files


    In symbolic format, "u" signifies user, "g" is group, and "o" is other. You can
    choose to add to existing permissions:


    ```

    $ ls -1 turbo

    -rw-r-r- 1 root root       14 Sep 6 22:42 turbo

    $ chmod +6w turbo

    $ ls -1 turbo

    -rw-rw-rw- 1 root root       14 Sep 6 22:42 turbo

    $

    ```


    Or, you can specify exact permissions:


    ```

    $ ls -1 turbo

    -rw-r-r- 1 root root       14 Sep 6 22:42 turbo

    $ chmod equal=rw

    $ ls -1 turbo

    -rw-rw-rw- 1 root root       14 Sep 6 22:42 turbo

    $

    ```


    The plus sign (+) is used to add to the existing permissions, the minus sign(-)
    removes from existing permissions. The equal (=) ignores permissions and sets
    the value to whatever is specified. A -c option causes chmod to change the name
    of files that are changed, whereas -f cancels the display of any error messages.


    In conjunction with chmod, the chown utility can be used to change the owner of
    the entity. The syntax is

    `chown {new user} {entity}`


    Thus, to change the owner of a file, the sequence would be


    ```

    $ ls -1 turbo

    -rw-rw-rw- 1 root root       14 Sep 6 22:42 turbo

    $ chmod eduelaney turbo

    $ ls -1 turbo

    -rw-rw-rw- 1 eduelaney root       14 Sep 6 22:42 turbo

    #

    ```


    # Note


    Changing the owner does not change permissions or any other values, just as changing
    permissions did not change the owner, and so on. Only the root user can change
    the file''s ownership.'
  merge: -1
