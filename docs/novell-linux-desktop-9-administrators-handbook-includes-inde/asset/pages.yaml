  md: 'With GNOME, the clock appears in the upper right corner on what is known as
    the *panel*, and the menu options and hot buttons are along the top left of the
    screen by default. This is the normal location for the panel, but it can be easily
    changed by dragging it to the pop-up menu of either side of the screen or changing
    the properties.


    By right-clicking on the panel, you can choose to add or remove items from it.
    Figure 3.3 shows the pop-up menu of items that can be added to the panel, whereas
    Figure 3.4 shows the properties that can be configured for the panel.


    # FIGURE 3.3

    You can add additional items to the panel.


    ![](img/a66a597da3b52cd2cf8b35a8b972f497_55_0.png)


    The bottom panel, by default, shows the running applications and offers the ability
    to choose between them. In the rightmost corner is an icon of a desktop that you
    can click to hide all windows and show the desktop.


    The Programs menu, shown in Figure 3.5, holds the known applications.


    Of key importance on the System menu is the Administrator Settings choice. This
    opens the YaST (Yet Another Setup Tool) interface, as shown in Figure 3.6. This
    tool is thoroughly discussed in Chapter 5, “Working with YaST."'
