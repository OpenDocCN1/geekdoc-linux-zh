  md: 'Since the creation of egrep—again, in the days of Unix—most of the features
    have been worked into the version of grep included with Linux. Using the -E option
    with grep, you can get most of the functionality of egrep.


    # Note


    For most practical purposes, grep -E is identical to egrep.


    # Working with vi


    When vi came into being, it was a revolutionary application. This was in the early
    days of Unix, and the editors that came with the operating system were incredibly
    crude and difficult to manage. Many times, you could not see the line you were
    working on (with ed); instead, you would specify the line, specify the change,
    and ask to see the line printed to tell you if your change was correct.


    The vi editor (pronounced “v-eye”) was created by a graduate student named Bill
    Joy (later to become famous as one of the founders of Sun Microsystems). He created
    an editor that was visual—hence the “v”—and interactive—hence the “i.” With this
    editor, you can see the lines in the file and see the changes as you make them.


    # Note


    vi is a modal editor, and thus the same keys mean different things in different
    modes. For example, in command mode “enter insert mode.” i means the letter ‘i’.


    By today''s standards, vi is now considered to be crude—who wants to work with
    such an application when entities like WordPerfect and Microsoft Word exist? The
    answer is that you must know the basics of this editor because it is a powerful
    administrator’s tool. The following points are among its benefits:


    +   - Every version of Linux ships with this editor—you can be assured that it
    will reside on whatever machine you use.


    +   - It has very low overhead. When a system is damaged and configuration files
    must be modified before it can be brought up, you are often prevented from starting
    large applications. This minimal overhead because vi does not have the buttons
    or scrollbars in GUI (graphical user interface) applications.'
