    # # NLD in a Windows Environment


    With native SMB support, NLD can readily join an existing Windows-based network,
    whether that network is a workstation-only environment or one running Windows
    Server 2000/2003. The only issue that occasionally occurs in adding NLD to such
    is the configuration of the printer.


    The simplest method of doing so is to add the LPD service to the existing server
    (a simple selection in all current Microsoft operating systems). After this is
    done, the printer will be visible when scanning for it in Administrator Settings,
    Hardware, Printer, and it can be selected.


    TIP


    From the Linux side, the alternative is to run Samba on your system and use that
    to print directly to Windows printers regardless of whether they support LPD.


    # # NLD in a Novell Environment


    Since Novell is the company behind the Linux Desktop, it stands to reason that
    NLD can not function in an environment of Novell servers (NetWare, OES, or SUSE),
    but also it can excel. NLD can fully utilize such utilities and services as


    +   * ConsoleOne—This network-compatible Java-based tool allows you to quickly
    and easily administer the network resources from a browser.

    * iManager—This Web-based application can be used for managing, maintaining, and
    troubleshooting eDirectory from within your browser interface.

    * iMonitor—This tool offers monitoring and diagnostic capability within a Web
    browser to all servers in your eDirectory tree.

    * Remote Manager—The easiest way to think of this tool is to imagine you are sitting
    at the server console. Remote Manager gives you all the functionality that would
    be available at the server console within a web browser.'
