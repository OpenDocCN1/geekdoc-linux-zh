  md: '# Mounting and Unmounting


    There will always be a local filesystem, for it is upon that that Linux is installed.
    If the filesystem is large enough to hold everything you interact with, that is
    all you need. In most cases, however, the local filesystem is not sufficient to
    hold everything you need. If you run out of space on your system, you can add
    another disk, partition it, and mount those partitions to enable your system to
    access the new space.


    The mount command is used without parameters to show what filesystems are currently
    mounted (available). An example of the output would be


    ```

    /dev/hda1 / type ext2 (rw)

    /dev/hda3 /home type ext2 (rw)

    /dev/devpts /type devpts devpts (rw, gid=5,mode=620)

    /proc /type proc proc (rw)

    noname:(pid11973) /auto type nfs (rw)

    ```


    This reads from the dynamic file /etc/mtstab and relays the device, the mount
    point, the type of filesystem, and the permissions. (rw is read/write). In addition
    to read/write, filesystems can be mounted as read-only (ro), not allowing users
    (nouser), only to run to binaries (exec) or not (noexec), or controllable by all
    users of capable setting special id (nosuid), or interpret special devices on
    the filesystem (dev).


    The entries listed in the preceding output, and that are by default, appear in
    the /etc/fstab file—mentioned earlier in regard to the fsck utility. If there
    are additional filesystems you want to mount, you should add their entries to
    this file. The command mount a will read the fstab file and mount/remount all
    entries found within.


    If you do not have filesystems mounted, you can dynamically load other filesystems
    using the device name with the mount utility.


    For example, to mount the CD drive, the command is $ mount /mnt/cdrom


    And the entry added to mount looks like this:


    ```

    /dev/hdc on /mnt/cdrom type iso9660 (ro,noexec,nosuid,ndev)

    ```


    The mnt directory contains mount points, which are just Linux directories with
    meaningful names such as for the CD-ROM drive and floppy drives. Options that
    can be used with the mount command are'
