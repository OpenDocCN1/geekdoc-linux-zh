  md: '# FIGURE 12.10


    The default miscellaneous security settings.


    ![](img/a66a597da3b52cd2cf8b35a8b972f497_331_0.png)


    The true definition of backups is copies of your data stored on removable media.
    but they are not good if the system gets hit by fire. (You can copy files from
    one drive to another, but in recent times, the definition has become a bit broadened
    to include technologies such as clusters and such.)


    Although the removable media can be anything from floppy disks to DVD-RWs, most
    of the time, magnetic tapes are the preferred medium. Most tapes allow you to
    store several gigabytes of data and provide a cheaper, reusable medium than that
    other possibilities.


    One of the first things to realize is that one, used and over, and does not provide
    a good backup strategy. You need to use multiple tapes, to be able to recover
    in the event of the failure of one, and rotate them. You need to store copies
    in safe locations, including offsite (in case the entire building is blown away
    by a tornado). Logs should be kept of what is on each tape to allow you to quickly
    identify what is where there.'
  merge: -1
  pgno: 331
- img_proc: true
  md: '# CHAPTER 12: Security


    # Note


    It is important to understand the difference between backups and archives. Archives
    are files you copy from your system to store elsewhere and would not put back
    on the system if it crashes. Backups are files on the system that you need and
    would put back on if the system crashed.


    There are several strategies for how to back up the data to the tapes:


    +   - Daily—Copy all the files changed each day to a tape

    - Full—Copy all files

    - Incremental—Copy all files added or changed since the last full or incremental
    backup

    - Differential—Copy all files added or changed since the last full backup


    Most real backup plans use some combination of these types. For example, full
    backups are the best, but require the most time to run. For that reason, you might
    run a full backup every Sunday and an incremental every evening of the week, and
    then the incremental from Monday, the incremental from Tuesday, however, it will
    take quite a while to restore as you restore the full tape from Sunday, the one
    from Wednesday, and the one from Thursday (a total of five tapes).


    Another possibility would be to do a full backup on Sunday and a differential
    each night. The amount of time to do the differentials will get longer each night,
    but if the system crashes on Friday, you only need two tapes: Sunday''s full and
    Thursday''s differential.


    There are also two other types of backups recognized: copy and partial. A copy
    backup is simply a copy of a file to the media (thinking of copying one file to
    a floppy). A partial backup is just a copy of all the files within a single directory.


    Just as important as a good backup strategy and adherence to it is the knowledge
    that you can restore the data if you have to. This can only come from verifying
    that on a regular basis. Every so often, when a backup is completed, run a restore
    operation and verify that you can read back the data in its original form.


    316'
  merge: -1
  pgno: 332
- img_proc: true
  md: '# Utilities to Know


    Linux includes a number of utilities that can be used to do your backups: tar
    and cpio. The tar utility (tape archiver) will combine multiple files into a single
    file that can be copied to the media. The syntax for it is tar {options} {target_file}
    {source_files}


    Both the target file and source files can be paths (such as /dev/tape). The options
    include


    +   - c to create a new file

    - d to compare contents and display the differences between the target and source

    - f to specify a file

    - p to keep the permissions

    - r- to append to an existing file

    - t to show the names of the files in the tar file

    - u to only add files that are new

    - v to run in verbose mode

    - x to extract files


    Examples of common commands follow.


    To create a new tar file on the tape and do so in verbose mode

    t cvf /dev/tape {files}


    To extract/restore the files from the october.tar backup file

    t xf october.tar


    The cpio utility is used to copy in or out. There are three basic actions it can
    do, and one must be specified:


    +   - -i to extract from an archive

    - -o to make a new archive

    - -p to print/pass through the files


    Options that can be used with it are


    +   - d to create directories if they are needed

    - f to specify a file'
  merge: -1
  pgno: 333
- img_proc: true
  md: '# CHAPTER 12: Security


    +   - t to show the contents

    - u to overwrite existing files

    - v to run in verbose mode


    Some examples follow.

    To read from a tape and display them as it is operating (verbose mode)

    cpio -iv < /dev/tape


    The following example will find all files on the system starting with “ead” and
    copy them beneath the /home/ead directory, creating all the needed sub-directories
    in the process:

    find -name ead | cpio -pdv /home/ead


    # dd


    The device-to-device (dd) utility is used to copy a file from one device to another.
    It goes beyond that in functionality, however, for it can convert a file during
    the copy process from one format to another. It can convert from EBCDIC to ASCII
    (and reverse), change uppercase to lowercase (and reverse) as well, and must use
    arguments that include bytes, blocks, or keywords.

    The most common use for dd copying files to and from removable media, and you
    must use arguments that can include


    +   - bs--block file size

    - if--input file

    - of--output file


    # Related Utilities


    Backup utilities allow you to copy files from the system to the backup media,
    or vice versa. There are also utilities designed to reduce/compress data so that
    it takes up less space. The most common of these are gzip (to compress) and gunzip
    (to uncompress). The contents of the gzip file can be seen (without uncompressing)
    by using the zcat utility in place of cat.'
  merge: -1
