    A check will be done of the system, as shown in Figure 2.23, and you will be notified
    if there are any patches to download. If there are no new patches, you will be
    notified that the system is up-to-date, as shown in Figure 2.24.


    FIGURE 2.23

    A quick scan can be performed.


