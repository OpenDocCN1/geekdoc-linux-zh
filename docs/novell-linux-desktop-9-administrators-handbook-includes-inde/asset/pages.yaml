    root 30960 19605 0 14 pts/o          00:00:00 ps -f

    ```


    Thus to get rid of the cat process, the sequence would be


    This "politely" asks the process to terminate. It is polite because there are
    32 ways to kill a process (signals to send), and this is the safest method of
