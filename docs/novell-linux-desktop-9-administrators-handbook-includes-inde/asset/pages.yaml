    entries are users (such as ed나요) or individual services (such as ftp).


    Note


    If you modify this with a text editor, you must be careful to make the same modification
    in /etc/shadow, or you will lock out the user. This can be a fatal error if the
    account in question is for root.


    +   - The password—This can be an encrypted entry held within this field, or an
    “x.\” In the case of the latter, the single character merely indicates that the
    values are stored elsewhere—in the /etc/shadow file.


    Note


    Placing the passwords in the shadow file adds additional security. Everyone can
    read the passwd file, but only the root user can read the shadow file.


    +   - The numerical user ID (UID)—This is an incremental number unique for every
