    letter instead of a number (or other character), you could use “[[abcdefghijklmnopqrstuvwxyz]”.
    However, because this is a range, a much simpler way to signify it would be “[[a-z]”

    ls [a-z]*


    The ranges need not be a complete set (though complete sets are easier to specify),
    and you can jump around if needed. For example, if you only want to look for entries
