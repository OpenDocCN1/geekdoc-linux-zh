  md: '# Upgrading During Installation


    One of the benefits of choosing to test Internet connectivity during the installation—whether
    performing a graphical or text-based installation—is that a check is performed
    to see if updates are available for the system. If such updates are available,
    you will be notified, as shown in Figure 2.19.


    FIGURE 2.19

    You can choose to update the system during the installation.


    ![](img/a66a597da3b52cd2cf8b35a8b972f497_47_0.png)


    # Note


    The text-based updates are shown in this section because they are the most difficult
    to work through. The graphical updates follow the same steps and involve clicking
    Next or OK.


    Choosing to continue, by default, downloads the updates from http://update.novel.com/YOU
    and notifies you when the system is current, as shown in Figure 2.20.'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# CHAPTER 2: Installing Novell Linux Desktop


    FIGURE 2.20

    After the updates are downloaded/applied, the system is current.


    ![](img/a66a597da3b52cd2cf8b35a8b972f497_48_0.png)


    # # Keeping the System Current


    Every operating system has updates released for it occasionally. Depending on
    the operating system, these updates might be called patches, service packs, or
    something entirely different, and they usually fix problems that have been found
    and/or additional functionality to the operating system.


    In Novell Linux Desktop, you can keep the system up-to-date through two methods.
    Each of these methods is discussed in the sections that follow.


    # ## Using Online Update


    You can check for updates and keep the system current using YaST (Yet Another
    Setup Tool) interface. From the System menu, choose Administrator Settings. When
    the Center opens, choose Software (if it is not already selected), followed by
    Online Update. This brings up the dialog box shown in Figure 2.21.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# FIGURE 2.21


    The Online Update options.


    ![](img/a66a597da3b52cd2cf8b35a8b972f497_49_0.png)


    You can choose to manually select the patches to be applied (the default) or reload
    all patches from the server. If any patches are available, they are presented
    for you to select: Otherwise, you are notified that the system is up-to-date,
    as shown in Figure 2.22.


    # FIGURE 2.22


    The system is current, and there are no patches to apply.


    ![](img/a66a597da3b52cd2cf8b35a8b972f497_49_1.png)


    # Using Red Carpet


    Novell Linux Desktop also includes the Red Carpet utility to allow you to check
    for updates and keep the system current. To start this utility, from the System
    menu, choose Software Update.'
