    ```


    But the -c option is much quicker and more efficient by shaving an additional
    operation from the process. Other options can be used with grep


    +   - f uses a file to find the strings to search for.

    - -H includes in the display header of the filename from which the matching is
    (if applicable) appears at the beginning of each line, whereas -h prevents the
    header from appearing (the default).

    - -i to ignore case. If this did not exist, you would conceivably search for a
    text file for "Karen", "KAREN", and all variations thereof to find all matches.

    - -L prints filenames that do not contain matches, whereas -1 prints filenames
    that do contain matches.

    - -n to show line numbers in the display. This differs from numbering the lines
    (which n1 can do) because the numbers appear denote the numbering of the lines
    in the existing file, not the output.

    - -q quits all output and is usually just for testing return conditions.

    - -s prevents any errors that occur from displaying error messages. This is useful
    if you do not want stating that...

    - -v serves as the "not" option. It produces the opposite of what would not using
    it. For example, who | grep -v karen will show all users who are not karen.

    - -w forces the found display to match the whole word. This provides the best
    solution to the earlier discussion of finding "cat" but no derivatives thereof.

    - -x forces the found display to match the whole line.'
