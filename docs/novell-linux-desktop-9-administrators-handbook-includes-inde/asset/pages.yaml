    | KEY SEQUENCE | RESULT |

    | --- | --- |

    | a | Inserts text after cursor (append) |

    | A | Inserts text at the end of the current line |

    | i | Inserts text before cursor |

    | o | Opens a new line below the cursor |

    | O | Opens a new line above the cursor |

    | s | Removes the current letter and places you in insert mode—this is known as
    the “substitute” command |

    | S | Substitute mode for the whole line |


    Regardless of the method by which you enter insert mode, the means by which you
    leave this mode is by pressing Esc.


    Deleting text is accomplished by pressing x to delete a single character. It can
    also be preceded by a number to indicate how many characters to delete. For example:


    16x


    will delete the next 16 characters. To delete the character before the cursor,
    substitute the X command in place of x.


