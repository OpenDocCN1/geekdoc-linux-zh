  md: '# Working with Hard Disks


    # TIP


    The fact that a partition exists does not mean that it has to be usable.It must
    be formatted in order to be used.


    If you want, a primary partition (only one) can be further subdivided into extended
    partitions (known as logical drives). Again using DOS-style partitions, up to
    four logical drives can be created from a primary partition, but none of them
    are bootable by the operating system.


    # NOTE


    The maximum number of partitions you can have if all are primary is four.The maximum
    number of partitions you can have if mixing and matching primary and extended
    is three primary partitions and four logical drives (a grand total of seven).


    In actuality, the theoretical limit on SCSI disks is 15 partitions, and on IDE
    it is 6. The limitations mentioned previously are enforced with the DOS-style
    partition table used as a default.


    All partitions must be referenced in the /dev directory, and the first partition
    on the first disk is either


    +   - hda1—The first disk on the primary IDE controller (the first disk on the
    secondary IDE controller is hdc)

    - sda1—For SCSI


    The name of the device can always be broken into the four fields that each character
    stands for:


    +   1. The type of drive: h for IDE, or s for SCSI.

    2. The type of device: d for disk.

    3. The number of the disk expressed in alphabetical format: a for the first, b
    for the second, and so on. In mind that this is on a per-controller basis.

    4. The number of the partition. Numbers 1–4 are set aside for use on primary partitions,
    whether or not you have that many, and the logical drives start numbering with
    5.


    If you run out of room in the partition (or have not configured such), a swap
    file will always be created for the same purpose, but the use of the partition
