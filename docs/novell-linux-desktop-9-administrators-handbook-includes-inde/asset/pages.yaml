    +   - bzip2 (and its counterpart, bunzip2). You can see the contents of the file
    with bzcat and recover a damaged file with bzip2recover.

    - compress (and its counterpart, uncompress)


    # Summary


    This chapter focused on the topic of security. It looked at how common sense applies
    to all areas of this topic, and then examined settings that can be configured
    in YaST, as well as the importance of backups.'
