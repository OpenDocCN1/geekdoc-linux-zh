    # The Log Daemon


    Although individual applications can have their own logging features, there is
    a log service specifically running to add entries to the log files is the syslog—the
    system log daemon—which is spawned by the init daemon. When started, syslog reads
    the /etc/syslog.conf file to see what you want to monitor. Very descriptive in
    nature, each line consists of the item you want to monitor followed by a period
    (.) and the priority, whitespace, and the location of the log file.


    You can use a comma (,) to separate multiple entries. You can also use a semi-colon
    (;) to denote exceptions to the rule. This is the required syntax: item.priority;exceptions
    log_file


    # Note


    The syslog daemon reads the syslog.conf file by default. You can, however, modify
    the startup files so that syslog starts with the -f option, allowing you to use
    another configuration file in place of /etc/syslog.conf.


