  md: "# CHAPTER 3: Working with the Desktop Environments\n\n# Administering the KDE\
    \ Desktop\n\nUnder normal circumstances, you typically allow users to work with\
    \ the desktop and make any changes to it they want that can make them more productive.\
    \ The KDE Control Center is the most common way for users to configure their desktop\
    \ environment. It provides access to the Configure Desktop items discussed in\
    \ the previous section, as well as to the Appearance & Themes items, and many\
    \ more granular configurable items.\n\nUnder certain circumstances, you don't\
    \ want them to have the ability to make changes to certain elements. KDE uses\
    \ a number of text files to configure its environment, and it is possible to painstakingly\
    \ edit those for changes you want to make. A far better option, however, is to\
    \ use two utilities designed for such purpose:\n\n+   * The Kiosk Admin Tool\n\
    * The Config Editor\n\nBoth of these are fairly obscure configuration tools, and\
    \ the purpose of the following section is only to introduce you to their existence\
    \ and what can be done with them. The level of complexity of each requires a depth\
    \ of knowledge beyond the scope of this book.\n\n# The Kiosk Admin Tool\n\nAlthough\
    \ very rare, it is possible to use KDE in Kiosk mode in the most restrictive environments.\
    \ This is typically used by system administrators who want a number of systems\
    \ deployed to be similarly locked down, and can clone one configuration to a number\
    \ of machines since manually configuring kiosks is a very time-consuming undertaking.\
    \ \n\nThe KDE Kiosk Admin Tool can be started on the command line with the command\
    \ `kiostool`, and opens to the first screen in Figure 3.21.\n\nFigure 3.21 shows\
    \ the default profiles, and can be easily added using the Add New Profile button\
    \ on the right. This brings up the dialog box in Figure 3.22.\n\nThe power of\
    \ the tool lies in the Configure button, which allows you to store profiles under\
    \ a different directory and choose whether or not profiles are uploaded to a remote\
    \ server upon exit. Figure 3.23 shows the `kiostool` configuration. many aspects\
