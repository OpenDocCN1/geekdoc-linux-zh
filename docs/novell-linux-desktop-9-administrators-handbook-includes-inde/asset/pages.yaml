  md: '# CHAPTER 7: Working Filesystems


    The include directory holds C program header files, whereas lib offers libraries
    for the C-based programs. The local directory is a temporary holding facility
    used during installation, and the subdirectories beneath it should be empty.


    The bin directory (yet again) holds system-specific binaries. Most of the utilities
    in this subdirectory are related to managing the system from the standpoint of
    adding users and groups, as well as working with networking. These are noncritical
    utilities in that the system could function without them, and an administrator
    could manage without them as well; it would be more difficult, certainly possible.


    The share directory holds information specific to the machine for certain utilities,
    and it holds the directories for manual pages. Last, the src directory contains
    the operating system source code.


    # The var Directory


    The name var is derived from the word variable, and the data contained beneath
    this directory is fluctuating in nature. Typically, a number of subdirectories
    are used to hold dynamic files, such as spools, logs, and so on.

    The main directories to know among these


    +   - lock—Holds files that represent locks elsewhere on the system and per-service
    directories under /var/log/subsys that hold locks for those subsystems.


    +   - log—Used for log files such as those created by login and logout (wtmp),
    who is currently using the system (utmp), and those for mail, the spooler, and
    so on.


    +   - run—Files associated with the various processes running on the system. These
    contain the process ID of running processes and make it easy to terminate or restart
    those processes using the scripts in /etc/init.d.


    +   - spool—Spooled data waiting for processing (such as printing).


    # Other Directories


    Other directories can, or be created, and exist beyond the / directory. Those
    listed in the preceding sections are always present, and the ones that may be
    present:


    +   - install—As the name implies, it holds information about the installation,
    such as scripts, errors, and so on.'
