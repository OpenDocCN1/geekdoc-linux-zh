  md: '# Note


    Two types of links can be created: hard and symbolic. Both are examined in the
    following sections.


    # Hard Links


    The simplest of the two link types is the hard link. It is created by default
    with ln, and its can be illustrated as follows:


    ```

    $ ls -l

    drwx------ 5 root root 1024 Sep 22 23:57 Desktop

    -rw-r-r- 1 root root 81 Sep 23 00:25 Friday

    -rw-r-r- 1 root root 81 Sep 23 00:38 monday

