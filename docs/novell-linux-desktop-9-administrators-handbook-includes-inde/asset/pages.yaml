  md: 'A user can use only the negative numbers, meaning that the user can only lower
    a process and not raise it. You can also specify an increment (default is 10),
    with the -n option, that nice will use to change the priority over time. The root
    user (superuser) has the ability to give a negative increment, whereas users can
    only use the positive numbers to raise processes priority.


    # NOTE


    Negative values are confined to use only by the superuser.


    If only the nice command is given, it will show the scheduling priority used by
    default.


    # renice


    The nice utility can only be used when starting a process and cannot be used with
    a process already running. That is where the renice utility comes into play. The
    utility uses the same priorities available to nice and is followed by one of three
    options:


    +   -p for PIDs

    -g for a process group

