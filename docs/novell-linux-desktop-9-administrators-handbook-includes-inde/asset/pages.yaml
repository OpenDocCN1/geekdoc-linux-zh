    ```

    $

    ```


    This utility can be used for files and directories and allows the use of wildcards
    and regular expressions.


    Working in conjunction with getfacl is setfacl, which is used to Set File ACL
    information, and is thus a substitute for chmod. The following example sets the
    permissions on the turbo file equal to those on a file named slowmotion.


    ```

    $ getfacl slowmotion

    # file: slowmotion

    # owner: kristen

    # group: users

    user::rw-

    group:r-

    other::r-

    ```


    ```

    $ getfacl slowmotion | setfacl -set-file= turbo

    $ getfacl turbo

    ```


    ```

    # file: turbo

    # owner: kristen

    # group: users

    user::rw-

    group:r-

    other::r-

    ```


    ```

    $

    ```


    The benefit of setfacl over chmod is that it does a number of options—like that
    shown in the example—which are available only in it.


    # Special Permissions


    Three special permissions are used in rare circumstances. Read, write, and execute
    are always used (or their absence expressed), but sometimes you need to do a bit
    more with a file or directory. The three special permissions are


    +   - Set User ID (SUID)

    - Set Group ID (SGID)

    - Sticky bit'
