    +   - All numbers [0-9]

    - All letters and numbers [A-z0-9]

    - Not a number [10-9]

    - Not a letter [!A-z]


    # The Path Statement and Other Variables


    When you enter a command at the command prompt and the shell cannot find it internally,
    it must look for a utility by name externally. It does this by searching directories
    specified in the PATH variable, in the order they are listed, until it finds the
    first match. If no match is found after all listed directories have been searched,
    the result is an error message (“command not found”).


    # Note


    All Unix/Linux shells support internal variables that are typically known as environment
    variables. The most common of these is PATH, which is a colon-separated list of
    directories that the shell should search for commands.


    The way in which environment variables are set is shell-specific—bash, ksh, sh,
    and ash share one convention whereas csh and tcsh share another. This chapter—and
    this book—focuses on bash.


    65'
