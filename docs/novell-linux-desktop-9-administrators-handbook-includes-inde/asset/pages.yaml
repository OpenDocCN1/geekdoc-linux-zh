    # NFS


    NFS is the Network File System and the way in which partitions are mounted

    and shared across a Linux network. NFS falls into the category of being a

    Remote Call (RPC) service. NFS uses three daemons— nfsd,

    portmap, and rpc.mountd—and loads partitions configured in the

    /etc/exports file. This file exists on every host, by default, is empty.

    Within this file, you must specify the directories to be exported and the rights

    it to.


    # Tip


    The default copy of this file supplied with the system contains nothing but

    comments that point you to check the man page to find the syntax used within

    this file.


    296'
  merge: -1
  pgno: 312
- img_proc: true
  md: '# Working with NFS, smb, and nmb


    The NFS server can be started with the /etc/init.d/nfsserver command, and the
    daemons rpc.nfsd and rpc.mountd are spawned. rpc.nfsd is the service daemon, where
    rpc.mountd acts as the mount daemon.


    Problems with NFS generally fall into two categories: errors in the /etc/exports
    listings (fixed by editing and correcting them) or problems with the daemons.
    The most common problem involves not starting in the correct order. The portmap
    daemon must begin first, and the only daemon needed on a host that accesses shares
    does not offer any.


    # Note


    Shares can only be mounted through /etc/fstab or manually using the mount command.


    # NIS


    The Network Information Service (NIS) acts as a giant phone book, or Yellow Pages,
    to resources distributed across the network. NIS acts so much like a directory,
    in fact, most of the files and utilities use the letter yp as a carryover from
    when it was known. The three components of NIS are


    +   - Master server—There must be at least one running the ypserv program and
    holding the configuration files.

    - Slave servers—These are optional and used in small networks. When used, they
    act as intermediaries on behalf of the master server in processing requests.

    - Clients—These run the ybind program and retrieve data from the server.


    An NIS network is organized into domains with the /etc/defaultdomain file defining
    the domain and /etc/yp.conf holding the server address. Common resources mapped
    with NIS include user information (/etc/passwd), group information (/etc/group),
    and services (/etc/services), though you can add more.


    The number of utilities to know to with NIS are


    +   - ypdomainname—Shows the name of the NIS domain

    - ypmatch—Queries the key field of a map and shows the results

    - yppasswd—Changes the user password on the NIS server

    - yppoll—Shows the ID number of the NIS map

    - ypwhich—Shows the NIS server client uses'
