  md: '# Basics of the Command Line


    # Note


    PS1 is also usually followed by a space, to separate it from what the user types.

    You can see this if you type `echo \$PS1\`.


    Dissected into its components, PS1 is equal to the following:


    +   - The left bracket ([)

    - The name of the current user

    - The symbol (@)

    - The name of the current host

    - A space

    - The present working directory

    - The right bracket (])

    - The dollar sign ($)


    An example of this prompt would be

    `edulaney@server7 home$`


    The backslash (\ character is used to signify that a special value should be

    used. Different values that can be used for the prompt include those shown in

    Table 4.1.


    # TABLE 4.1

    Variables to Define the Prompt


    | VALUE | RESULT |

    |---|---|

    | \d | Current date |

    | \h | Name of host to first period |

    | \n | New line |

    | \s | Shell |

    | \t | Time |

    | \u | Username |

    | \W | Current directory |

    | \! | History number |

    | \# | Command number |

    | \$ | Default prompt—$ for standard users, and # for root |

    | \ | An actual backstroke (literal) |

