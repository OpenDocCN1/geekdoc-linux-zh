  md: '# CHAPTER 2: Installing Novell Linux Desktop


    +   **Rescue System**—This recovers a system with any installation, but simply
    checks the memory.

    **Memory Test**—This does not do really with corrupted boot files.


    To begin a standard install, choose Installation. If your system cannot be recognized
    meeting the minimal requirements, a text-based installation will begin (skip to
    the “Text-based Installs” section later in this chapter and continue from there).


    The License Agreement appears next. Scroll through the choices, and you can click
    either on the command button I Agree or the command button I Do Not Agree. If
    you choose the latter, the installation will not continue.


    # Note


    In addition to the two command buttons directly linked to the License Agreement,
    two others also appear stops the installation altogether, and Accept. These two
    command buttons remain throughout all the remaining screens (though on some, Accept
    is labeled as Cancel) and the rest of the installation. The Accept button is used
    to proceed to the next dialog screen, but nothing is really accepted until you
    confirm all your choices and settings on the last installation screen.


    After agreeing to the License Agreement, YaST2 identifies itself as “The Installation
    and System Administration Program,” and you must select your language. Your hardware
    is then analyzed, and you are given radio buttons allowing you to choose either
    GNOME or KDE for the default desktop. Neither is preselected, and you cannot choose
    to install both at this time, though you can always go back and do so at a later
    time.


    # Tip


    KDE is the traditional desktop used on SUSE systems, whereas GNOME is now preferred
    by Novell for internal use. If you are not familiar with either, and have no valid
    reason to select one or the other (such as being a site-wide desktop standard),
