  md: '# CHAPTER 7: Working with Filesystems


    # TIP


    Common way of using du is -s , which summarizes disk usage in the current directory.


    The grand utility in this category is fsck, the filesystem check utility. Not
    only will it check the filesystem, but also if errors are encountered, it can
    be used to correct them. The utility uses entries in the /etc/fstab file to tell
    it filesystems to check during startup if configured to run automatically. The
    -A option also tells the utility to use this file.


    # TIP


    fsck uses the sixth field in each /etc/fstab entry to identify the sequence which
    filesystems are checked when a Linux system boots. If this field contains ''0'',
    the filesystem will not be checked.


    # NOTE


    The /etc/fstab file is always read by fsck and related utilities but never written
    to. As an administrator, you need to update the file—placing each filesystem on
    its own line—when you want to make modifications to the operation of system utilities.


    When you run fsck, it acts as a wrapper program and runs the appropriate filesystem-specific
    utility based on the filesystem type information in /etc/fstab.


    # NOTE


    Filesystems should be unmounted before fscking them


    Running fsck-A in NLD generates the dialog shown in Figure 7.3.


    The first pass looks, among other things, at inodes. An inode is a table entry
    that contains information about a single file or directory disk space allocated
    to a file or directory. There are thousands of inodes on each partition, and the
    inodes are filesystem specific. For example, each filesystem has inodes numbered
    1, 2, 3, and so on.


