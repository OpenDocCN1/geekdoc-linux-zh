    Notice that the attributes related to the time of the new entry (friday) remained
    the same as those associated with monday and did not assume the current time—as
    would be with a copy operation. This is because there is only one file, even though
    the second column from the left indicates the link count for files: the number
    of ways this same set of data can be referenced. The link count has incremented
    from 1 to 2.


    Another way to verify that it the same data is to view the nodes. Every entity
    must have its own inode, as was discussed earlier. If, however, you have only
    one set of data and multiple ways of accessing it, all the access methods (names)
    share the same inode:


    ```

    $ ls -i

    18471 Desktop 18538 monday 18536 tuesday

    18535 friday 18538 thursday 18537 wednesday

    ```


    As you add links to the data, link count will increment, and as you remove links,
    the link count will decrement. The data that links point to will'
