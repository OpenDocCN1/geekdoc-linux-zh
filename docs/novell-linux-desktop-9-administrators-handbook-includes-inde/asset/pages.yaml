  md: '# CHAPTER 4: Working on the Command Line


    # Note


    Alternatively, the argument can be used without the options, like this:


    ```

    ls *.gif

    ```


    The number of arguments that can be given is not limited to one. Although there
    may be limitations on the number of parameters an individual utility will accept,
    typically you can string multiple requests together. For example, instead of specifying


    ```

    ls -l sa*

    ```


    as one command and then following it with


    ```

    ls -l *.gif

    ```


    you can accomplish the same operation with


    ```

    ls -l sa* *.gif

