- img_proc: true
  md: '# CHAPTER 11: Networking


    to three other machines, each of the three machines must have a unique value.
    If the host connects to the Internet, the address must be unique within the scope
    of the Internet.


    # Subnet Mask


    The subnet mask, to oversimplify, tells whether the network has been subdivided
    into smaller networks, or all the hosts can be found on one wire. The default
    value is based on the class of the network as shown in Table 11.2. If you deviate
    from this value, you are divying your possible hosts from one network to multiple
    networks. This allows you to better isolate and find your hosts, the trade-off
    is that you have fewer hosts available to use (a result of using some of your
    binary numbers to signify the network and leaving fewer for the host). Table 11.3
    illustrates this trade-off.


    It is important to understand that when a subnet value is used, limits the possible
    values that can be used for the IP address by taking away some of the bits (values)
    that could otherwise have used. For example, if you have a Class C of 201.1.1,
    and are not subnetting, the values that can be used in the fourth field are 1–254
    (made up of possible values from eight binary digits). On the other hand, if you
    are using a subnet of 192 (made by using two bits), six bits are left and you
    therefore have a maximum of 62 host addresses on two subnet ranges. The ranges
    that can be used: 65–126 and 129–190.


    # Default Gateway


    The default gateway is an optional field if you want to communicate beyond your
    subnet. It used to hold the IP address of the router. If a client connects to
    an ISP through a dial-up connection (such as a standalone Linux machine dialing
    from home), the ISP fills in this address.


    To summarize: the IP address must be unique for each host; all hosts on that subnet
    share the subnet value; and the default gateway is shared by every host that uses
    router to get beyond the local network.


    # Supplying Values


    The needed values for TCP/IP configuration can be entered manually each time you
    add a host to the network, or you can use the DHCP (Dynamic Host Configuration
    Protocol) service. With DHCP, you do not need to enter any values when adding
    new hosts to the network. A server hosting the DHCP Daemon (dhcpd) holds a range
    of addresses—known as a scope—and can “lease” IP addresses to clients. The lease
    duration is configurable—from a'
