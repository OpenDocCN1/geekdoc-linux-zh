- img_proc: true
  md: '# CHAPTER 4: Working on the Command Line


    There are several important things to know about the path:


    +   1. You can view your path by using the echo command:

    echo $PATH


    +   2. The path does not, by default, include the present directory. Thus, you
    can create an executable file in your home directory, see it right before you
    (with 1s), and when you type its name, you will be told that the command cannot
    be found. To circumvent this, you can give the full path to the file, add your
    home directory to your PATH variable, move the file to a directory in the path
    statement, or add the present directory variable (.) to the PATH variable.


    +   3. Entries within the path are separated by colons (:).


    +   4. The order of the PATH search should always include the most common directories
    where executables can be found first (the bin directories) and the user-specific
    directories (if any) at the end.


    To add another directory to your path, you can redefine the entire statement,
    or simply append the new directory with the command

    PATH=$PATH:{new directory}


    Thus to add the directory /home/edulaney to the path, the command would be

    PATH=$PATH:/home/edulaney


    Or you can add a variable that signifies you want the directory you are currently
    working in to be searched for the utility:

    PATH=$PATH:.


    # Note


    For security reasons, it is always recommended that you do not include the current
    directory in your path. If you do so, it will be at the end of the PATH statement—as
    shown in the preceding example—and not at the beginning.


    For example, if your current PATH is equal to

    /sbin:/usr/sbin:/usr/local:/root/bin:/usr/local/bin:/usr/bin, you want the new
    PATH to look like


    /sbin:/usr/sbin:/usr/local:/root/bin:/usr/local/bin:/usr/bin:../ and not'
