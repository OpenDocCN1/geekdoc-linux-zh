  md: '# Connecting Commands


    In all the examples thus far, the Enter key is used to inform the shell that you
    have given a command that needs to be processed. You are not, however, limited
    to giving the shell only one command at a time.


    Multiple commands, not connected to one another in any way, can be given on the
    same line as long as the semicolon (;) is used as a command separator. For example,
    it is possible to see all the files in the current directory and the current date
    by giving the following two commands in succession:


    ```

    ls

    date

    ```


    These are unrelated commands in that the output of the second has absolutely nothing
    to do with the output of the first. You can combine them on a single line with
    a semicolon between the two and get the same result:


    ```

    ls ; date

    ```


    The semicolon is a special character signaling that multiple commands are on the
    same line. This character allows you to break the whitespace on both sides of
    it (ls;date) while giving you the same result.


    If the commands do something in common—the output of one is to become the input
    of the next—they are connected using a pipe (|). For example, if a list of files
    within a directory is too long to fit on one screen, you can view a screen at
    a time by using this command:


    ```

    ls -1 | more

    ```


    Here the output of the ls -1 command becomes the input of the more command. If
    the first part of the entire command line fails, the second part cannot possibly
    be executed successfully.


    Note


    The second part of a failed pipe will always attempt to execute and fail, usually
    complaining that it has “no input.”


    # Wildcards


    Wildcards are used to signify other characters that the shell fills in. The two
    most common wildcard characters are the asterisk (*) and question mark (?). Although
    they are often confused, their meanings are different and can lead to completely
    different results.'
  merge: -1
