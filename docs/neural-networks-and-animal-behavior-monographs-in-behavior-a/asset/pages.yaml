  img_proc: true
- pgno: 222
  md: 'Another issue is that neural networks, with their flexibility and power in
    producing input-output maps, perhaps invite one to play around with different
    ingredients without a thorough understanding of model operation. It is important
    to proceed carefully by asking precise questions, starting with simple models
    that allow us to analyze and understand what goes on. Lack of understanding may
    be particularly risky in evolutionary simulations, especially when complex problems
    or network architecture require the evolutionary process to search in very large
    state spaces.


    Finally, we have seen in Chapters 3 and 4 that both learning theory and classical
    ethological theory are relatively consistent with neural network theory, whereas
    parts of the cognitive approach to animal behavior are more difficult to reconcile
    with neural network models. We have considered only a few cognitive models in
    this book, but they cannot be ignored because cognitive to input. The network
    definitely “processes information,” but it hardly manipulates symbols or concepts
    according to formal rules, as, for instance, a computer program does. Such nonsymbolic
    processing is nevertheless capable of recognizing stimuli and making decisions.


    If neural networks are not “cognitive,” in the narrow sense defined above, how
    can they deal with observations of animal behavior usually explained in terms
