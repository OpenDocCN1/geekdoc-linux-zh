    male call. After training on different histories, network responses were compared
    with the responses of real females. The network trained with the reconstructed
    evolutionary history of the species responded most similarly to today’s females.
    Although the nets with other histories evolved to recognize the present call just
    as well, they seem to do it in a different way that does not predict what real
    females do.


    # 5.5 CONCLUSIONS


    The study of behavioral evolution, together with the study of ontogeny, is the
    least developed area of neural network research. However, from the preceding it
    should be obvious that neural networks can provide insight into the evolution
    of behavior'
