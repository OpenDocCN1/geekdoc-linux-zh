    # ### 5.4.5 Example 2: Evolution of signal form


    Studies of signal evolution using neural network models have dealt with both visual
    (Enquist & Arak 1998) and acoustic (Philps & Ryan 1998, 2000) signals. Some of
    these results are described below. Neural networks allow us to study aspects of
    the evolution of signal form that are difficult to investigate with game theory
    or other approaches such as statistical decision making theory. Applications of
    standard game theory are often useful for predicting whether signaling will evolve
    or not and the cost of signals. However, this theory has been much less successful
    in predicting the form signals take. Why, for instance, are repeated signal elements
    and long tails so common? Application of neural network models opens up new possibilities
    for research. With neural network models we can study how sense organs and neural
    processing influence the evolution of signal form. In addition, we can take into
    account the many difficult problems of recognition that potentially can influence
    signal design (Section 3.3 and 3.4). Neural networks can also handle complex signals
    (many dimensions of variation), whereas game theory is most easily applied to
    one-dimensional or discrete signals.


