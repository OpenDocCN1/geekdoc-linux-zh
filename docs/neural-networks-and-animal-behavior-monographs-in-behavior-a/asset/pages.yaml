    # 4.8 CONCLUSIONS


    Neural networks are potentially powerful models of learning in animals, but much
    work is still needed to have a satisfactory theory of learning based on neural
    networks. Many learning phenomena so far have not been modeled. In several respects,
    learning in neural network is similar to learning in other successful models,
    such as the classical learning equation of Rescorla and Wagner (1972). Neural
    network models, however, offer a few advantages. A first one is that neural networks
    can smoothly exploit knowledge from both behavioral observations and neurobiology.
    Most learning theories, including contemporary ones, are based on observations
    of behavior only.


    A second advantage is that internal factors that govern learning can be given
    a concrete interpretation. Memory is defined in terms of connection weights, and
    learning is defined in terms of changes to connection weights. The mechanisms
    for weight change include local factors, depending, for example, on the activity
    of pre- and postsynaptic nodes, and often also global signals that selectively
    communicate information from other parts of the network to particular connections.
    Based on local and global factors, mechanisms of weight change can be tailored
    to account for various learning process.


    A third advantage is that a neural network model of learning inherits all the
    features of behavior systems that we covered in Chapter 3, including sensory processing,
    decision making and motor control. The learning mechanism is integrated with the
    behavior system simply as a different and clearly identifiable aspect of the operation
    of the same network. For instance, neural network models of learning may easily
    include a realistic handling of stimuli. One example is the effect of stimulus
    intensity on learning, which traditionally has been dealt with with ad hoc assumptions
    (see Section 4.3.1). Another example of this integration is that learning mechanisms
    can exploit the ability of networks as input-output maps to produce and communicate
    global signals that guide learning (see, e.g., the model of “attention” sketched
    earlier). Such networks are not part of the behavior map, in the sense that they
    do not produce observable behavior.


    There are, of course, challenges and problems with neural network models of learning.
    A major challenge is the diversity of findings and the complexity of learning.
    A particularly acute problem is retroactive interference, from which networks
    often suffer to a degree that is unrealistic—old information can be almost totally
    overwritten when new information is learned (McCloskey & Cohen 1989). Despite'
