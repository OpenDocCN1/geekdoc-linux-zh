    points in human-made devices such as a thermostat. For this reason, the set-point
    analogy has been judged misleading (Toates 1980, 1986). A further critique concerns
    the fact that the model operates solely based on *negative feedback*. *Feedback*
    refers here to the fact that the system, via specialized receptors, continuously
    compares the actual value of the controlled variable with a set point or ideal
    value. *Negative* refers to the fact that when a departure from the set point
    is sensed, an action is taken leading to a change that is opposite in sign. Negative
    feedback control is an important aspect of how animals achieve homeostasis, but
    not the only one (Toates 1986). For instance, chickens eat more during the hour
    before dusk (Hogan 1998). This does not reflect increased need but rather the
    anticipation that during the night the bird will not eat. Figure 3.23 shows a
    refined neural network model of drinking that can take into account information
    from many sources. We have included a temporary water store, the stomach, from
    which water is transferred to the rest of a body, as well as receptors (stomach
    stretch receptors) that can sense water in the stomach store and thereby inhibit
    drinking. Still other factors could be included if necessary. The model also has
    a “clock” component (i.e., a time-varying input with a period of 24 h). This provides
    time-varying input to the decision system and allows for circadian influences
    (see also Section 3.7.5.2).


    # 3.7.2 Choice among alternatives


    As already mentioned, the starting point for research into animal decision making
    is the basic observation that incompatible activities may be motivated simultaneously.
    A water hole may motivate both drinking and hunting in a lion, given that the
    animal is both hungry and thirsty, but hunting requires that the lion hides near
    the water, whereas drinking requires visiting the water. In ethology this is called
    a *conflict situation* (Hinde 1970; McFarland 1999; Tinbergen 1952), meaning conflict
    between tendencies to do incompatible things. In some species, a few fixed rules
    govern the resolution of such conflicts (Figure 3.24), but in most cases the animal’s
    internal state and the external conditions influence what decision is taken.


    Most theories of decision making appeal to the core notion that mutually incompatible
    activities inhibit each other (Hinde 1970; Tinbergen 1952). For instance, Baerend’s
    model in Figure 3.13 features mutual inhibition between incubation and escape
    behaviors. Despite its popularity, this mechanism seems to have been studied concretely
    only a few times (Amarri & Arbib 1977; Didday 1976; Ludlow 1980).'
