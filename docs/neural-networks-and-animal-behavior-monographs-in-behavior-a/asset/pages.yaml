  img_proc: true
- pgno: 142
  md: 'the interplay between nature and nurture? Why does behavior sometimes develop
    even without experience, whereas in other cases learning is crucial? A female
    frog, for example, spontaneously recognizes the call of conspecific males, but
    zebra finches (*Taeniopygia guttata*) need to learn what their conspecifics look
    like.


    A tentative definition of *learning* might be “changes in behavior caused by ex-perience.”
    For instance, an animal may hear a particular sound (say, leaves be-ing stepped
    over) immediately before seeing a predator. If such an experience occurs a number
    of times, most animals will become wary of the sound. An ex-perience, however,
    may change later behavior without this being immediately ap-parent. Merely seeing
    different objects for some time, for example, can facilitate later mastering of
    a discrimination between them (“perceptual learning”; see Sec-tion 4.4.2; Atneave
    1957; Gibson & Walk 1956). Thus a better definition of learn-ing is “changes in
    memory caused by experience,” whether or not such changes are immediately reflected
    at the level of behavior. In our terminology, we say that in learning models memory
    is included among state variables (variables that can change), and modifications
    in memory due to learning are described by suitable state-transition equations.
    In neural network models, memory and learning can be given a precise interpretations
    reflecting this definition. Memory is equal to con-nection weights, the analog
    of synapses in nervous systems. The memory state of a network is thus described
    by its weight matrices, and learning amounts to changes in the weights. In such
    models, learning thus entails the modification of existing connections, the last
    of the four phases of the development of nervous systems de-scribed in Section
    4.7. Nervous systems, however, may be plastic in additional ways (e.g., by birth
    and death of neurons; see Mareschal et al. 1996 for network models), making circuitry
    also a part of memory. Moreover, in both nervous sys-tems and neural networks,
    memories with a limited lifetime can be sustained as patterns of activity in the
    network. We have called these *regulatory states* to distin-guish them from memory
    structurally encoded in weights (Sections 1.2 and 3.7.5).


    # 4.2 GENERAL ASPECTS OF LEARNING


    Empirical research into animal learning is extensive (Dickinson 1980; Mackintosh
    1974, 1994; Mowrer & Klein 2001). Figure 4.1 illustrates an example of such studies,
    whereby an animal learns to turn in one direction at the end of a T maze as a
    consequence of food being available at end but not at the other. In this section
    we present a general approach to modeling empirical findings about learning in
    terms of changes in connection weights in neural network models. We start with
    a theoretical analysis of different factors that drive learning in nervous systems
    and neural network models. Based on such analysis, we discuss the abilities and
    biological realism of some neural network models of learning.


    # 4.2.1 Local and global factors in learning


    Let us begin with nervous systems. The factors that can cause synaptic changes
    may be usefully divided into “local” and “global” (Bienenstock et al. 1982; Intrator'
