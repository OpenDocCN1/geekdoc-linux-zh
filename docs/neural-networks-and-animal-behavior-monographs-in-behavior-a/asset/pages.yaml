    system, during the individual’s whole life span. This process starts very early
    in embryonic life and includes a diversity of processes, many not well understood.
    From a behavioral perspective, ontogeny is particularly challenging because at
    any time important changes may occur within the animal that are not expressed
    in behavior until a later time.


