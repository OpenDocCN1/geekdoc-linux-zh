- pgno: 185
  md: '# Chapter Five


    # Evolution


    In this chapter we tackle the evolution of behavior and nervous systems. All multi-cellular
    animals, with a few exceptions, have a nervous system. Phylogenetic studies suggest
    a single origin, which consequently must date back more than 500 million years.
    The nervous system offers an all-purpose machinery for receiving information and
    producing responses, allowing the organism to be much more flexible toward its
    environment. With a nervous system, organisms can move, perform all sorts of activities,
    communicate, generate internal responses such as heartbeat, gut movements and
    hormone secretions, and so on. Other solutions for doing some of these things
    exist, e.g., in bacteria, but never on the same scale. Clearly, the nervous system
    is a success story in evolutionary terms.


    We have shown in earlier chapters that neural network models naturally share many
    properties with nervous systems, essentially by virtue of a shared network structure.
    This suggests that neural networks can also help us to understand the evolution
    of behavior, as we attempt to show below. This chapter contains two parts that
    use neural networks in different ways. We consider first the general question
    of how behavior systems evolve. We show that neural networks fulfill many requirements
    for an evolving behavior system. We also discuss the material basis for such evolution
    and biases and constraints arising from the concrete implementation of behavior
    systems in terms of neural networks. In the second part of this chapter we show
    how neural network can be used to study specific evolutionary questions such as
    the evolution of communication and social behavior.


    Some of the issues discussed herein are poorly understood, and we explore ideas
    rather than provide established facts. Recall, for instance, that the relationship
    between genes and the nervous system is still not well understood (Chapter 4),
    nor do we know to what extent neural networks are helpful for understanding this
    and other issues of behavior evolution.


    # 5.1  THE EVOLUTION OF BEHAVIOR SYSTEMS


    How does a behavior systems evolve, and what features does evolution favor? This
    question ranges from the basic operations and abilities of animals to the adaptation
    of specific behavior patterns in a given species. Behavior evolution arises from
    the evolution of the nervous system, its receptors and sense organs and effectors
    such as the skeleto muscular apparatus. It is the flexibility and limitations
    of these systems that, together with selection pressures, determine the evolution
    of behavior.


    Before discussing what insights neural network models can provide, we ask what'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'general characteristics we expect to find in behavior systems produced by evolution.
    We start from the concept of a “look-up table” introduced in Chapter 1. The look-up
    table is an idealized behavior mechanism that stores the response to each possible
    stimulus as the value of a table cell (see Figure 1.3 on page 9). This is equivalent
    to the approach of game theory and optimization theory, which traditionally seek
    an independent, best response to each possible situation (Binmore 1987; Maynard
    Smith 1982; McNeill 1982; Section 1.3.2). We now ask: can such an idealized mechanism
    evolve? The answer is clearly no.


    A first reason is that an impossibly large memory would be required to store the
    table. Consider, for instance, a sense organ with just 1000 receptors (an insect
    eye can have up to 200,000, a human eye has about 100 million), with each receptor
    capable of being in only one of two states, “on” or “off.” Then there are 2$^{1000}$
    possible patterns of stimulation, each needing its own entry in the table. In
    contrast, estimates of the storage capacity of the human brain vary between 2$^{23}$
    and 2$^{52}$ bits (Crevier 1993), and the storage capacity of the genome is even
    more limited. The problem becomes even more acute if, as it is often the case,
    sequences of stimuli rather than single stimuli must be stored to take functional
    decisions.


    A second difficulty concerns how entries in a look-up table could be optimized.
    Evolution proceeds by trying out new solutions and retaining those innovations
    that are improvements. However, there are limits to the number of parameters that
    evolution can optimize because the combinations to be tried out are too many even
    with a modest number of parameters. The same argument applies to responses established
    through learning. A third problem is that reactions to novel stimuli are completely
    undetermined because corresponding table entries have not been under any selection.
    This is important because genuinely novel stimuli may appear during evolution
    and also because of the extreme variability of sensory data that arise from existing
    stimuli (Figure 3.3).


    From these arguments we conclude that only behavior mechanisms with a much coarser
    memory structure (fewer parameters) than a look-up table can evolve. For instance,
    we could have a small table where only the responses to some stimuli would be
    stored. Responses to other stimuli could then arise from stored responses according
    to some rule. In such a system, each memory parameter would affect responding
    to more than one stimulus, and responding to each stimulus would be governed by
    more than one parameter. Reactions to novel stimuli would be determined by the
    current content of the memory and its structure, i.e., the particular rules that
    produce responses based on stimuli and the content of memory.


    Besides making a system possible, limiting the number of memory parameters has
    other advantages. Selection favors those mechanisms that show some “intelligence”
    vis-à-vis reality. For instance, stimuli that are similar to one another often
    share some causal relationship with events in the outside world. An “intelligent”
    mechanism can detect and use such regularities, generalizing knowledge about familiar
    situations to novel ones. A look-up table is incapable of generalization because
    the response to each stimulus is independent of responses to other stimuli, however
    similar they might be. On the other hand, a behavior mechanism whose output is
    a continuous function of the input automatically displays generalization. That
    is, if S'' is a slight modification of S, then output to S'' will not be too different'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'from output to $S$. Lastly, limiting the number of parameters can also simplify
    the ontogeny of the system because fewer parameters have to be set.


    To summarize, we can view the problem of behavioral evolution as analogous to
    a fitting problem. When we fit a function to a set of points, we adjust function
    parameters to achieve the best fit according to some criterion. How well we can
    fit the points depends on what function we use. A polynomial of first degree ($a_0
    + a_1x$) can describe perfectly only straight lines (fitting $a_0$ and $a_1$),
    whereas a second-degree polynomial ($a_0 + a_1x + a_2x^2$) can describe both straight
    lines (with $a_2 = 0$) and quadratic shapes. In the case of evolution, the "points"
    to be fit are requirements on an animal’s behavior, and we can see selection as
    a fitting process that attempts to set genetically determined variables of the
    nervous system so that such requirements are satisfied as closely as possible.


    # 5.2 REQUIREMENTS FOR EVOLVING BEHAVIOR MECHANISMS


    Clearly, what behavior can evolve depends partly on the raw material evolution
    works with, i.e., on properties of nervous systems. Below we expand the remarks
    we made earlier by listing some properties of behavior systems that we think have
    been and still are crucial for the evolution of behavior. By *crucial*, we mean
    that these properties have allowed nervous systems to evolve from the simplest
    forms to the human brain, with a flexibility that makes it possible to fit any
    species’ needs. We also discuss to what extent these properties are found in neural
    network models and nervous systems.


    # 5.2.1 Flexibility and efficiency


    Perhaps the most important requirement of a general behavior mechanism is that
    it should be able to implement almost any behavior map, including maps that require
    regulatory states (Chapter 3). Only a system with such a flexibility would allow
    behavior to be tailored continuously by natural selection to fit prevailing circumstances.
    We have already seen in previous chapters that neural network models are very
    flexible. Memory parameters (weights) can be fitted to practically any needs,
    and network architecture can grow, shrink and alter patterns of connections. It
    has been proven mathematically that neural networks have excellent fitting properties;
    almost any map can be described with these models (Funahashi 1989; Haykin 1999;
    Hornik et al. 1989; McCulloch & Pitts 1943). The potential to build appropriate
    regulatory states allows the network to detect temporal patterns in sensory data
    and to organize behavior in time (Sections 3.5, 3.7.5 and 3.8).


    Flexibility also derives from the potential to add, modify or remove receptors,
    muscles and other effectors. We have already noted that network models, as well
    as nervous systems, can deal equally well with any kind of sensory information,
    provided that receptors exist that can transform stimulation into neural activity
    (Section 3.6; Wang et al. 1999). If a new receptor type becomes available during
    evolution, for instance, a neural network capable of learning can immediately
    exploit any new information that the receptor may provide, thus exploiting the
    po-'
