  md: 'gen 1951). The oystercatcher in Figure 3.6 is a classical example. In general,
    we may refer to such phenomena as response biases. We already saw in Section 3.3.1.2
    that biases exist favoring responding to more intense stimuli.


    We can model discriminations between similar stimuli by adding an input pattern
    s⁻, similar to s⁺, to which the network should not react. One instance is the
    input-output map in Figure 3.11, where s⁻ is a rearrangement of s⁺. This is a
    good model of fine discriminations along rearrangement dimensions such as sound
    frequency or light wavelength. Figure 3.10 shows the weights that result from
    training a network on this discrimination. Positive weights correspond to nodes
    where s⁺ is more intense and negative weights to nodes where s⁻ is more intense.
    However, the largest positive weights do not match s⁺ exactly: they are shifted
    away from s⁻. This means that maximum responding will not be at s⁺, as shown in
    Figure 3.12 (right). In terms of overlaps, responding to a test stimulus x should
    now be explained by taking into account its overlap with both s⁺ and s⁻. The latter
    tends to decrease responding to x. Peak shift arises because some stimuli along
    the dimension retain most of their overlap with s⁺ but overlap significantly less
    with s⁻. Peak shift can also be viewed as arising from interaction among memory
    parameters, since the same weights encode the reaction to both s⁺ and s⁻. In Chapter
    5 we will discuss the evolutionary relevance of this phenomenon.


    Response biases are also observed along intensity dimensions, when animals are
    trained to discriminate between two similar intensities. When S⁺ has a stronger
    intensity than S⁻, the generalization gradients is very similar to that obtained
    when S⁺ is discriminated from the background (indeed, the latter can be considered
    an S⁻ with very low intensity). However, if S⁻ is more intense than S⁺, the result
    is somewhat surprising. The generalization gradient now decreases rather than
    increases with intensity. This shows that it not intensity per se that control
    responding but the interference between memories along the intensity dimensions.


    Discriminations between stimuli of similar intensity can be modeled by picking
    s⁺ and s⁻ from the dimension in Figure 3.8 (right). We meet here one limitation
    of our model, namely, the two-layer network cannot realize the input-output map
    where s⁺ is less intense than s⁻. Technically, this happens because the three
    stimuli b, s⁺ and s⁻ lie on a line in the network''s input space (i.e., one of
    them can be written as a weighted sum of the other two; Section 2.3.1.1). Along
    such a line, the output of a two-layer network (or any linear network) is either
    ever-increasing, ever-decreasing or constant. Adding a layer of nonlinear nodes
    removes this limitation. The three-layer network solves the task easily and generalizes
    realistically, as shown in Figure 3.12. For completeness, we note that the three-layer
    network also reproduces the findings considered earlier (Ghirlanda & Enquist 1998).


    # 3.3.3 Comparison with other models


    Ethologists and psychologists have researched extensively how animals react to
    stimuli (Baerends & Drent 1982; Hinde 1970; Kalish 1969a,b,c,d; Lorenz 1981; Mackintosh
    1974). We can distinguish two closely related issues. The first deals with how
    stimuli are modeled; i.e., what is the input to the behavior mechanism? The second
    is how the behavior mechanism operates based on such input.'
