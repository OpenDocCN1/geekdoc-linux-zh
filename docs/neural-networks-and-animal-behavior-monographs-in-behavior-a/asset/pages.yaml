  md: 'using general-purpose programming languages such as Pascal, C, C++, etc. These
    have no knowledge of neural networks as such, yet simple neural network simulations
    can be implemented easily. For instance, to simulate a two-layer network with
    one output node, one needs simply two arrays of numbers to store the input and
    weight vectors, one number for the response, as well as the ability to compute
    weighted sums and define transfer functions. As an example, Listing 2.1 shows
    a complete C program that calculates the output of a two-layer network with a
    single output node and weights **W** = (1, 0, 1, 0) to the input **x** = (1, 1,
    1, 1). The program would not look too different in most other programming languages.
    People have also developed additions to the languages, called *libraries*, that
    allow programming of more complex simulations with little effort. Typically, these
    libraries provide data structures to represent various network architectures,
    as well as the ability to perform common tasks such as calculating network responses
    or gradient descent learning. Exploring such language extensions probably would
    be rewarding for readers with some programming experience or those who wish to
    start programming. Many neural network libraries are listed at http://www.faqsg.org/faqs/ai-faq/neural-nets/part5.


    Software for scientific computation is well suited for beginners wishing to simulate
    simple or moderately complex networks using a rather straightforward programming
    language. The key insight is that the operation of neural networks can be expressed
