  md: 'with other motivational factors such as fear or the bird’s experience with
    real eggs. As we argued in Section 1.4.3, it is not easy to see why models of
    this kind did not lead to more extensive use of neural network models.


    A rather different approach to stimulus control is taken by some models from cognitive
    psychology. Here we only have space to discuss the very popular notion that generalization
    is determined by the distances between the representations of stimuli in a “psychological
    space” (Shanks 1995; Shepard 1987; see also Section 1.3.5). Thus the closer two
    stimuli are represented, the greater generalization will occur between them. Distance
    in the psychological space has been related to the physical similarity between
    stimuli (i.e., more similar stimuli lie closer in the space), but modifications
    of distances owing to learning have been considered (Shanks 1995). One drawback
    of these theories is that at present they cannot predict how the psychological
    space looks (Staddon & Reid 1990). Rather, distances between representative points
    are fit to reproduce observed generalization (Nosofsky 1986; Shanks 1995; Shin
    & Nosofsky 1992). However, this does not always work. Intensity generalization,
    for instance, cannot be described satisfactorily in this way (Ghirlanda 2002).
    In a nutshell, the problem is that knowing whether stimulus S₁ is at a given distance
    from S₂ does not tell which one is more intense. Additional assumptions may be
    introduced to deal with intensity (such as appealing to “biases,” “attention”
    or “prominence” of different stimuli; Johannesson 1997; Nosofsky 1987, 1991),
    but the resulting model is no longer based on distance alone. Neural networks,
    in contrast, deal naturally with stimulus intensity, provided it is modeled realistically
    as larger activity of input nodes. The reader interested in this topic is referred
    to Ghirlanda (2002).


    In summary, ethological and psychological thinking contains many seeds for neural
    network models of behavior, whereas some other approaches are markedly different.
    The advantages that neural networks enjoy over similar or even formally equivalent
    models stem from their interpretation as models of nervous systems rather than
    black-box models or models of abstract cognitive processes. This interpretation
    pinpoints the importance of knowing exactly how a stimulus enters an organism
    and how it is processed. What a stimulus is and what its parts are have often
    been arbitrary, generating confusion about the power and limits of models such
    as equation (3.4) (Ghirlanda 2005). At the same time, many of the phenomena considered
    earlier arise from basic properties of network architectures, such as the distributed
    nature of processing. Consequently, bringing in just a little physiology can offer
    great rewards. For instance, to predict whether generalization along a stimulus
    dimension will be bell-shaped or monotonic, it is enough to know whether the dimension
    is perceived as a rearrangement or intensity gradient. We do not need to know
    in detail, say, the biochemistry of receptors. Such an origin from basic properties
    agrees with the observed generality of generalization phenomena across species
    and taxa (Ghirlanda & Enquist 2003). On the other hand, to explain why light wavelength
    generalization gradients in humans and pigeons show systematic differences, we
    would need to appeal to finer details of their visual apparatus, such as differences
    in photoreceptors and subsequent neural pathways.'
