    # 3.7.3  Stability of behavior


    Decisions, besides being taken, should also be reasonably stable. Imagine that
    our lion, which is both thirsty and hungry, decides to go to the water and drink.
    If the effect of drinking is simply to reduce thirst, as we may naively guess,
    thirst would quickly diminish below hunger. The animal would thus stop drinking
    and go hide, as required for hunting. However, after a short time hiding, thirst
    would have increased again because the animal drank very little, and the cycle
    would repeat. Another example is a lizard regulating body temperature by moving
    between shade and sun. If the lizard is too cold, it will go to the sun. But if
    it moves in the shade as soon as a comfortable temperature is reached, it will
    become cold again very soon and will need to go to back to the sun. The lizard
    would oscillate rapidly between sun and shade. Such instabilities, called *dithering*
    in engineering, are rarely observed in animals.


