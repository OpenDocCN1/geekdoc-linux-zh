    ![](img/4e7230a4ecf676d308ca85f3d2e65bae_195_1.png)


    Figure 5.3 A three-layer network can implement a smooth response profile (left)
    more easily than an abrupt change in response (right). The network had 10 input
    nodes, 5 hidden nodes and 1 output node. Input nodes could be stimulated (value
    of 1) or not (value of 0), and the network had to respond as a function of the
    number of active nodes ("cardinality"), as indicated by the solid line in each
    panel. Fitting consisted of 5000 iterations of simulated evolution (Sections 2.3.3
    and 2.5). All patterns of zeros and ones were used, but the fitting algorithm
    compensated for the different frequency of different cardinalities (e.g., there
    is only one pattern with 10 zeros or 10 ones but 252 patterns with 5 zeros and
    5 ones). Parameters of the node transfer function (equation 2.7 on page 36), including
    its slope, were also subject to evolution, to avoid any limitations in fitting
    ability that might have derived from an unsuitable choice of such parameters.


    biases and constraints derive from overlaps (Section 3.3). These can be understood
    by considering how overlaps vary when changing the input. In general, we can increase
    (decrease) the overlap of **x** with **W** by increasing any input $x_{i}$ corresponding
    to a positive (negative) weight. Moreover, the effect of changing $x_{i}$ depends
    on the magnitude (absolute value) of the weight. Thus, although the overlap is
    an idealization, it captures the key fact that a presynaptic neuron’s ability
    to influence the postsynaptic one depends on the strength and sign (excitatory
    or inhibitory) of the synapse. We continue with a number of particular examples
    of biases and constraints that can be traced back to properties of overlaps.


    # 5.3.3.1  Sharp thresholdes versus smooth changes


    Abrupt changes in responding (thresholds) are harder to implement than smooth
    changes. This is true in all networks in which the output is a continuous function
    of the input; e.g., multilayer feedforward networks. Figure 5.3 shows that 5000
    generations of simulated evolution can accurately fit the network to a straight
    line, whereas the fit to a step function is considerably worse. This constraint
    may be important because optimization theory often predicts step functions as
    solutions or even more difficult shapes such as stepwise functions. Note that
    a threshold could be built in the output node (Section 2.2.1.2), but such a network
    could not fit smooth functions at all and thus would have much narrower behavioral
    abilities.'
