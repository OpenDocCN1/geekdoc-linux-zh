- pgno: 229
  md: 'Gallistel 1990). This claim has given justification to ignoring the implementation
    level, leading to the most common style of cognitive modeling today. It follows
    that cognitive models typically consider just the ability to solve a problem but
    not, for instance, the speed and cost of the mechanism. However, all three matter
    in evolution. In network models, speed and cost are easily defined in term of
    number of processing steps and number of nodes and connections. In contrast, it
    is difficult to estimate the cost and speed of a cognitive model. For example,
    what is the time required to calculate a sine or a logarithm? We cannot answer
    this questions unless we know the material basis for these operations, and this
    invalidates Marr’s claim that cognition in terms of computation or formal procedures
    is independent of its physical implementation (Churchland & Grush 1999).


    Cognitive scientists such as Marr were inspired by computer science and artificial
    intelligence but there are obvious differences between how computer programs are
    developed and biological evolution. The development of a computer program involves
    all three of Marr’s levels, more or less as described by Marr. First, the problem
    is considered from an abstract point of view, then a program is written, and lastly
    a physical implementation of the program is created. The evolution of animal intelligence,
    on the other hand, is caused by changes at the level of physical implementation
    (Marr’s third level) or, more precisely, by changes to genes that control the
    development of the physical implementation. The result of evolution is also manifested
    at the physical level, whereas explanations in terms of algorithms (decision rules)
    or computations, when appropriate, are interpretations of the outcome of evolution.


    It follows from our discussion that to evaluate constraints and possibilities
    relative to the evolution of animal intelligence, we must consider the level of
    physical implementation. For instance, whether a problem is difficult or not depends
    on what is possible at the physical level, and whether the problem is complex
    at an abstract or algorithmic level may not always matter. Thus, to understand
    the evolution of cognitive abilities, we need to know how they relate to changes
    in neural architecture and functionality.


    ![](img/4e7230a4ecf676d308ca85f3d2e65bae_229_0.png)'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# **6.5 FINAL WORDS**


    Despite foreshadowing neural networks at least a few times (Section 1.4.3), students
    of animal behavior have for too long ignored their potentials as models of behavior.
    Our analysis suggests that neural networks can embody all elements of a behavior
    system and provide understanding both at the behavioral and the physiological
    levels. Although we focused on simple networks, these were shown to be powerful
    enough to encompass a wide array of behavioral phenomena. Complexity can be added
    in case of need: we do not endorse simplicity when misleading or wrong. Neural
    networks can also provide a common ground for discussion between different subjects
    and research programs. We also think, as it should be clear from the preceding
    section, that the relationship between neural networks and cognitive models needs
    to be explored much further, including possibly a reevaluation of what observations
    of animal cognition mean. Hopefully, these two modeling styles can be reconciled
    and together produce a better understanding of biological intelligence and its
    evolution.


    Perhaps we are too enthusiastic about neural networks, but we hope to have convinced
    the reader that these models should be investigated further and may represent
    a significant leap in our understanding of behavior, incorporating current progress
    in neuroethology without drowning in all the details of neurobiology.


    # **FURTHER READING**


