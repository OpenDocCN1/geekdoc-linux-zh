  md: 'regarding both general issues and particular problems. Neural networks seem
    to fulfill the requirements we can have on models of evolving behavior mechanisms.
    These models also provide understanding of some of the mysteries of behavior evolution.
    For instance, since even very simple networks are very capable, we can grasp better
    how efficient behavior can evolve gradually from sloppy behavior. Neural networks
    also provide insight into the links among genes, nervous systems and behavior.


    A number of studies have exploited neural networks to investigate the evolution
    of particular aspects of behavior. Even using simple networks, intriguing results
    have been obtained about, for instance, the occurrence of manipulation and the
    evolution of signal form. It is clear that many of such results cannot be obtained
    within either standard evolutionary game theory or using idealized behavior mechanisms
    such as the look-up table. Hopefully, these results are consequences of neural
    networks capturing essential properties of real behavior systems. This view is
    encouraged by the fact that neural network models are good models of many aspects
    of behavior, in particular, aspects crucial for evolution, such as reactions to
    novel stimuli (Section 3.3).


    Compared with traditional approaches, neural network models also have drawbacks.
    One is that they are relatively complex models. This means that, although formal
    mathematics could, in principle, be applied to study evolution of behavior with
    neural network models, in practice, we need to resort to computer simulation.
    A simulation is always about a particular choice of parameters and does not have
    the expressiveness of an analytical solution. Thus, to establish general results,
    extensive studies are needed that simulate evolution under many different conditions.
    It is also important to be careful in asking questions and choosing models to
    ensure that results are possible to understand and have some generality. To this
    aim, it is advisable to start with simple models.


    We want to end with a note of caution. This chapter is by necessity somewhat speculative
    because its subject is not well developed. We have tried to suggest potentials
    for neural networks in evolutionary studies of behavior, but we do not know to
    what extent neural networks will be a viable research strategy and for what kind
    of problems insights may be gained.


    # CHAPTER SUMMARY


    +   - Neural network models have most of the properties needed to study evolving
    behavior systems, such as flexibility and efficiency.

    +   - In evolutionary simulations, all properties of a neural network can be put
