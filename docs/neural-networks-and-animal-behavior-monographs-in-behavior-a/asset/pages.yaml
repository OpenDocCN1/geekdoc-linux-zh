    To understand how behavior sequences unfold, we need to know not only what response
    is produced at each instant of time but also how state variables change. These
    interactions lie at the heart of both biological reality and the state space modeling
    approach (Section 1.2). Consider the following example: when a male pigeon courts
    a female, she may respond behaviorally by displaying her interest. In addition,
    male courtship causes a series of internal changes, eventually resulting in the
    female producing and laying eggs (Lehrman et al. 1965). The female is not ready
    to reproduce when the male starts courting. Rather, visual stimulation from courtship
    leads to brain activity, including neurosecretions that ultimately cause the secretion
    of follicle-stimulating hormone (FSH) into the blood. FSH stimulates follicle
    growth and is accompanied by secretion of estrogen from the same tissue. Estrogen,
    in turn, affects the brain and makes the female prepared to copulate and take
    part in nest building, given appropriate external stimuli. Further interactions
    between external stimuli, the body and the brain lead to egg productions, egg
    laying and incubation. Experiments clearly have shown the importance of a courting
    male and that the female requires some amount of stimulation to start breeding.
    This arrangement makes functional sense because it safeguards the female from
    males that would court only briefly (perhaps because they are already paired with
    another female). It also shows how external and internal state variables together
    bring about functional behavior. Hormone levels in the brain and in the blood
    can be viewed here as regulatory states that build up with time. In general, it
    is important to view behavior and body physiology as a whole, keeping in mind
    that the brain causes physiological changes as well as overt behavior.


    In the following we apply the concepts introduced here to build neural network
    models of behavior. We focus on how external stimuli, body states and regulatory
    states control behavior, leaving the study of memory states to the next chapter.
