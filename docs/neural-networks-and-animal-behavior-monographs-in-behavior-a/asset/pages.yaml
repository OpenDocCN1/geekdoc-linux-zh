- pgno: 47
  md: '![](img/4e7230a4ecf676d308ca85f3d2e65bae_47_0.png)


    Figure 2.3 Responses of dark-adapted photoreceptors to a flash of light of 500
    ms. Left: A cranefly (Tipula) photoreceptor approaches a steady-state activity
    rather slowly (activity is expressed as proportion of peak activity). Right: A
    fleshly (Sarcophaga) photoreceptor reacts with a fast activity peak followed by
    lower steady-state activity (activity is expressed as proportion of maximum activity).
    Data from Laughlin (1981).


    # 2.1.2 The basic node model


    We now define mathematically network nodes and connections. Nodes in a network
    are indexed by integer numbers; a generic node is indicated by a lowercase letter
    such as $i$ or $j$. The activity of node $i$ is a (nonnegative) number written
    $z_{i}$. Its biological counterpart is the short-term average spiking frequency
    of a neuron or, for nonspiking neurons, the difference in electrical potential
    between the outside and inside of the neuron (see also Dayan & Abbott 2001; §1.2).
    The activities of all network nodes can be collected in an activity vector **z**:


    ```

    $$\mathbf{z} = \begin{pmatrix} z_1 \\ z_2 \\ \dots \\ z_N \end{pmatrix} \tag{2.1}$$

    ```


    where $N$ is the number of nodes. Nodes are connected to each other via weights,
    continuous numbers that correspond to the strength of biological synapses. The
    weight that connects node $j$ to node $i$ is written $W_{ij}$. To indicate compactly
    all weights in the network, we introduce the *weight matrix* **W**, which can
    be represented as an array with $N$ rows and $N$ columns:


    ```

    $$\mathbf{W} = \begin{pmatrix} W_{11} & W_{12} & \dots & W_{1N} \\ W_{21} & W_{22}
    & \dots & W_{2N} \\ \dots & \dots & \dots & \dots \\ W_{N1} & W_{N2} & \dots &
    W_{NN} \end{pmatrix} \tag{2.2}$$

    ```


    A first key assumption of neural network models is that node $j$ conveys to node
    $i$ an input equal to the product $W_{ij}z_{j}$. This models the biological fact
    that a presynaptic'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'neuron influences a postsynaptic one in a way that depends jointly on the presynaptic
    neuron''s activity and on the strength of the synapse. The total input received
    by node $i$ is written $y_{i}$ and is calculated as the sum of all the inputs
    received:


    $y_{i} = \sum_{j} W_{ij}z_{j}$ (2,3)


    where the index $j$ runs over all nodes in the network. Absence of a particular
    connection is expressed simply as $W_{ij} = 0$. Equation (2.3) is written more
    compactly as a relationship between vectors:


    $y = W \cdot z$ (2,4)


    where $y$ is the vector of all inputs, and $W \cdot z$ is the matrix product between
    $W$ and $z$. That is, $W \cdot z$ is simply a short way of writing the vector
    whose element $i$ is $\sum_{j} W_{ij}z_{j}$ (the application of matrix and vector
    algebra to neural networks is detailed in Dayan & Abbott 2001 and Haykin 1999).


    A second key assumption regards how input received by a node causes node activity.
    The function $f$ that expresses the relationship between node input and node activity
    is called the transfer function:


    $z_{i} = f(y_{i})$ (2,5)


    From a biological perspective, the transfer function embodies hypotheses about
    how neurons respond to input. In practice, however, the transfer function should
    also be easy to work with. The simplest transfer function is the identity function,
    by which node output equals node input:


    $f(y) = y$ (2,6)


    This function is used in mathematical analyses of neural network models because
    of its simplicity, but it has disadvantages if we recall that node activity should
    model the spiking rates or electrical potentials of neurons. Both these quantities
    are constrained within a range, and moreover, spiking rates cannot be negative.
    This results in curvilinear relationships between input magnitude and neuron activity
    (Figure 2.2) that are not captured by equation (2.6). It is also important that
    a network using only the identity transfer function can realize only a restricted
    set of input-output mappings (see Sections 2.2.1.1 and 2.3.1.1).


    A simple solution is to use logistic functions. Some examples are shown in Figure
    2.4. The output of a logistic function is always positive and less than 1; the
    latter can be interpreted as corresponding to the maximum activity of a neuron.
    Logistic functions have the form


    $f(x) = \frac{1}{1 + e^{-a(y-b)}}$ (2,7)


    where the parameters $a$ and $b$ may be set to approximate empirical transfer
    functions. By tuning them, it is possible to regulate node activity to null input
    and how steeply activity rises as input increases (Figure 2.4, see also Figure
    2.2). It is clear from Figure 2.2, however, that not even logistic functions satisfactorily
    describe all kinds of neurons and that especially to model receptors, different
    functions are needed. This issue will be taken up in Chapter 3.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '![](img/4e7230a4ecf676d308ca85f3d2e65bae_49_0.png)


    Figure 2.4 The logistic function, equation (2.7), for several choices of parameters.
    Note the similarity with the curves in the right part of Figure 2.2.


    The node model introduced so far is summarized in Figure 2.5 and formally by


    $z_{i}=f\left(\sum_{j} w_{j} z_{j}\right)$ (2.8)


    Accordingly, the operation of a whole network can be expressed symbolically as
    $\mathbf{z}=f(\mathbf{W} \cdot \mathbf{z})$. Obviously, this model is much simpler
    than neurons and synapses. Yet it has proven very useful to build models of behavior
    and nervous systems. In neural network studies, both simpler and more complex
    nodes are used, depending on the precise aim of the study. Simpler nodes sometimes
    are used to simplify mathematical analysis. An instance is a node having only
    two states, “active” and “inactive” (Amit 1989; McCulloch & Pitts 1943). More
    complex nodes have many uses, among which is to investigate neuron physiology.
    For instance, Bush & Sejnowski (1991) reconstructed from photographs the branching
    structure of a few neurons, and Lytton & Sejnowski (1991) simulated them as complex
    electrical networks, accurately reproducing the observed spiking patterns. A network
    with such complex nodes, however, would be very difficult to build and to understand.
    Moreover, we are not guaranteed to get a better model of behavior simply by including
    more detail. We still ignore which features of neurons are crucial for nervous
    system operation and which are less important (Graham & Kado 2003). Thus we will
    start with the basic node described earlier, and add complexity only when needed
    to model behavioral phenomena.


    # 2.1.3 More advanced nodes


    This section shows how the basic node can be developed to include additional features
    of neurons. It can be skipped at first reading because most of our network models
    will use the basic node described earlier. We start by asking how to calculate
    node activity in response to an input $y(t)$ that varies with time. The simplest
    possibility is to construe time as a succession of discrete *time steps* and to
    compute node activity at time $t+1$ from node input at time $t$ using equation
    (2.8):


    $z(t+1)=f(y(t))$ (2.9)'
  merge: -1
  img_proc: true
- pgno: 50
  md: '![](img/4e7230a4ecf676d308ca85f3d2e65bae_50_0.png)


    Figure 2.5 The basic node model. Node 1 receives input from nodes $2, \ldots,
    N$ through the weights $W_{12}, \ldots, W_{1N}$. The total input received is $y_1
    = \sum_{j=2}^N W_{1j} z_j$; it is passed through the transfer function $f$ to
    yield node activity $z_1$.


    The key feature of this equation is that node activity is determined solely by
    node input. The activity of neurons, on the other hand, may depend on factors
    such as the recent history of activity. In other words, neurons cannot instantly
    follow changes in input. For example, Figure 2.3 shows that a cranefly photoreceptor
    reacts with some delay to the onset of a light stimulus. This can be mimicked
    by letting $z(t+1)$ be a weighted average of $z(t)$ and $f(y(t))$:


    $z(t+1) = kf(y(t)) + (1-k)z(t)$ (2.10)

    Thus node activity in the next time step depends on current activity, as well
    as on current input, in a proportion given by the parameter $k$ ($0 < k < 1$).
    If $k$ is small, $z(t+1)$ tends to be close to $z(t)$; hence the node responds
    slowly to changes in input. Equation (2.10) is often written in terms of the change
    in activity from one time step to the next, $\Delta z(t) = z(t+1) - z(t)$. If
    we subtract $z(t)$ from both sides and write $1/k = \tau$, we get


    $\tau \Delta z(t) = f(y(t)) - z(t)$ (2.11)

    The parameter $\tau$ is called the time constant of the node: a smaller $\tau$
    means that $z(t)$ can change more quickly. Figure 2.6 shows that the cranefly
    photoreceptor is well described by equation (2.11), with $\tau = 35$ ms. Equation
    (2.11) is also an approximation to simple models of node dynamics in continuous
    time (the main difference is that, in continuous time, the increment $\Delta z(t)$
    is replaced by the time derivative $dz(t)/dt$).


    How is equation (2.10) related to equation (2.9)? If the input is constant, the
    value $z(t)$ calculated from equation (2.11) eventually reaches a steady state
    equal to the one predicted by the latter (which is the same as equation 2.5).
    The steady state is obtained by setting $\Delta z(t) = 0$ (no change), in which
    case equation (2.11) becomes identical to equation (2.9). The steady state is
    approached at a rate given by $\tau$; hence, if input changes on a time scale
    much longer than $\tau$, the two equations are equivalent. This justifies using
    equation (2.9) when we are not interested in short-term responses.


    We now show how further properties of neurons can be modeled by adding internal
    states. Our example is sensory habituation (or adaptation), shown in Figure 2.6.
    We introduce a single state variable $h$ that represents the level of habituation,
    and assume that the node receives an inhibitory input of $-h$:


    $\tau \Delta z(t) = f(y(t) - h(t)) - z(t)$ (2.12)'
  merge: -1
  img_proc: true
