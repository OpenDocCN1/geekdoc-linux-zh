    # ### 3.7.6 Comparison with control theory


    The analysis of decision making in animals owes much to *control theory*. In a
    typical control theory model, behavior is seen as part of a *control system* with
    a well-defined task such as maintaining homeostasis. Important ideas such as negative
    feedback or the need for stability of behavior arise very clearly as control problems
