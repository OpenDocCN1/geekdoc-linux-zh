    on the drive concept (Hinde 1970). Each behavior was assumed to be controlled
    by a single internal factor (“drive”) that builds up with time and is reset to
    a low value each time the behavior is elicited. Since then, a diversity of state-transition
    mechanisms has been identified, and pure drives are probably rare. Modeling of
    motivational state-transitions and behavior sequences have benefited largely from
    applications of control theory and systems theory, yielding the most refined approach
