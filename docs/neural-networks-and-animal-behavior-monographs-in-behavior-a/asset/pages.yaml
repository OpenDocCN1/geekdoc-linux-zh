  md: '# 2.2.1.3 General feedforward networks


    It is possible to build feedforward networks more powerful than perceptrons. For
    instance, we can add output nodes (Figure 1.9 on page 19). In studies of motor
    control, the output nodes may model motoroneurons that control individual muscles.
    In this case, the sequence of output patterns generated by the network would correspond
    to sequences of muscle contractions (Section 3.8.8). When modeling behavior, it
    is often more convenient to interpret the activity of each output node as the
    tendency to perform a particular behavior pattern. One way to decide which behavior
    is actually performed is to assume that the most active node always takes control.
    Alternatively, we may interpret the activity of a node as the (relative) probability
    that the corresponding behavior be performed. We will see in Section 3.7 that
    both rules can emerge from reciprocal inhibition between the output nodes (possibly
    in the presence of random factors).


    Feedforward networks can also be expanded with additional layers (Figure 1.9 on
    page 19). If $z_i$ is the $i$th layer of nodes, and $\mathbf{W}^{(i)}$ is the
    weight matrix from layer $i$ to layer $i + 1$, the operation of a general feedforward
    network may be summarized by $\mathbf{z}_{i+1} = f(\mathbf{W}^{(i)} \cdot \mathbf{z}_i)$.
    Such networks, often called *multilayer perceptrons*, can solve a wider range
    of problems than networks with only an input and an output layer. In fact, multilayer
    perceptrons are able to realize arbitrary input-output maps given enough hidden
    units and provided the node transfer function is nonlinear (Haykin 1999). For
    instance, the behavior map in Table 2.1, which is impossible for perceptrons,
    can easily be realized by simple multilayer networks such as those shown in Figure
    2.8. If the transfer function of hidden nodes is linear, it can be shown that
    a multilayer network is equivalent to one without hidden layers. The reason is
    that a single weight matrix is enough to perform any linear transformation between
    the input and output spaces. We will see in Section 3.4 that multilayer linear
    networks are nevertheless interesting to study. In Chapter 3 we will also use
    some nonlinear multilayer networks to model behavior that is too complex for linear
    networks.


    # 2.2.2 Recurrent networks


    Feedforward networks can realize any map with fixed input-output relationships
    but not maps in which the output to a given input depends on previous inputs.
    For instance, feedforward networks cannot distinguish the input sequences $\{\mathbf{x}_1,
    \mathbf{x}_2\}$ and $\{\mathbf{x}_2, \mathbf{x}_1\}$. The output to $\mathbf{x}_2$
    at the second time step will be the same in both cases because the output of a
    feedforward network is determined solely by the current input. Hence the time-processing
    abilities of feedforward networks are very limited. While some improvement is
    possible (Section 2.3.5), recurrent networks are a superior alternative to analyze
    input sequences and generate output sequences. The key architectural element in
    recurrent networks is *feedback loops, or recurrent connections*. This means that
    the activity of a node at a given time can be influenced by the activity of the
    same node at previous times. Usually this influence is mediated by the activity
    of other nodes at intervening times. In other words, while in feedforward networks
    only the weights serve as memory of the past, in recurrent networks'
