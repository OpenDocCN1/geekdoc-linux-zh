    # 3.4.2 Generalization along “difficult” dimensions


    Edges and lines are one example of important structures in the real world that
    are poorly represented at the level of receptors. Properties of a line such as
    its length, thickness and orientation can be derived only by combining information
    from many receptors. Consider, for instance, the image projected by a vertical
    line on a retina (suppose for simplicity that the line always falls at the same
    position on the retina). If we tilt the line even slightly, it will influence
    a whole new set of receptors and very few of the receptors previously affected.
    Thus a small change in the real world (or its projection onto the retina) has
    given rise to a big leap at the level of receptors. But this seems hardly to matter
    to animals. Animals generalize to different line orientations as smoothly as to
    changes in light wavelength or sound frequency (closed circles in Figure 3.16;
    note that line orientation is a rearrangement dimension).


    The networks employed so far generalize very poorly in this and similar situations
    (dotted line in Figure 3.16). The reason is that responding is based directly
    on the overlap of input activity patterns. To address this problem, we focus on
    a piece of sensory processing that is widespread in animals, i.e., spatially organized
    receptive fields. This means that neurons in a given layer do not receive input
    from all neurons in the preceding layer, nor from a random subset of them. Rather,
    each neuron often gathers input from spatially neighboring neurons. This kind
    of processing occurs, for instance, in the retina of vertebrates, where ganglion
