    emerged was that behavior is made up of combinations of fixed action patterns
    that are elicited and oriented by sensory information (Hinde 1970; Tinbergen 1951).


    Whether the ethological distinction between fixed action patterns and taxes is
    a useful and correct description of motor phenomena has generated some debate
    (Hinde 1970). Today the issue is outdated in light of much better knowledge about
    how motor control is exercised by the nervous system (see below). However, the
    distinction still makes sense at the behavioral level. The extent to which motor
    components are rigid or flexible determines the extent to which motor learning
    is possible, as well as whether the behavior patterns we observe appear precise
    or clumsy. The "style" of motor control in any particular species is the outcome
    of evolutionary processes. For instance, flexibility may be related to the environment
    a species lives in. Animals such as zebras, which live on smooth plains, have
    a limited number of gaits. In contrast, goats are much more flexible (the four
    legs can move almost independently of each other), reflecting their mountain habitat.


    The emphasis that classical ethology placed on the rigidity of motor patterns
    can be partly understood by ethologists'' interest in signal evolution. Signals
    often evolve out of other behaviors, in a process called *ritualization* (Eibl-Eibesfeldt
    1975, Hinde 1970, § 27.3, see also Chapter 5). This process is associated with
    significant alterations in motor control, often resulting in highly stereotyped
    behavior. For instance, components of preening have been the raw material for
    some courtship signals in ducks (Lorenz 1941). Preening can be directed toward
    the whole body, but signals evolved from preening have lost most of this flexibility
    and are always performed in exactly the same way. Another example is the highly
    stereotyped head-throw display of the godyne duck (mentioned above), which is
    derived from the takeoff leap. An observer usually can distinguish such behavior
    patterns from those that are guided by sensory information.'
