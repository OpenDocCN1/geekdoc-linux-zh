    Control theory is an extensively developed framework with both theoretical and
    practical sides. While the former addresses the general problem of how to control
    a system, employing concepts such as feedback and feedforward control, the latter
    covers the analysis of particular controlling devices. It is interesting to note
    that such devices sometimes have the structure of neural networks. For instance,
    the so called linear adaptive filters are the same as two-layer linear networks
    and can be used in homeostatic control and other applications (Kalman 1960; Widrow
    & Hoff 1960; Widrow & Stearns 1985; Wigner 1949). However, such an analysis of
    mechanism is less developed in applications of control theory to animal behavior.
    Here functional considerations dominate. The need for stable decisions, how to
    set thresholds for switching between activities and other important questions
    have been discussed thoroughly, but what mechanism is actually used by animals
    has been less considered. This has caused some debate over, for instance, whether
    concepts such as thresholds and decision boundaries are adequate for the study
    of animal behavior (McFarland 1974b; Toates 1980).'
