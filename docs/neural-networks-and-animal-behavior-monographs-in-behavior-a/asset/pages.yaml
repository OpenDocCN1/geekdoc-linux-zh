  md: '# ### 4.5.2 Learning


    *Learning* refers here to the processes that change the behavior map. Research
    into animal learning has produced refined and successful theories of learning
    mechanisms based on both external and internal factors. Many theories share similarities
    with neural network models. For instance, the models in Atkinson and Estes (1963),
    Brough (1975), Bush and Mosteller (1951), McLaren and MacKintosh (2000) and Rescorla
    and Wagner (1972) can all be cast within the neural network framework. As seen
    in Chapter 3, many popular models predict responding based on a weighted sum of
    “stimulus elements” that are assumed to be activated by environmental stimuli.
    In these models as in neural networks, learning proceeds by changes in the weights
    (often called *associative strengths* in psychology). The influential model by
    Rescorla and Wagner (1972) prescribes a rule for weight change identical to the
    $\delta$ rule (equation 2.38), although the activity of “stimulus elements” was
    restricted to the values 0 and 1 (see the preceding section):


    ```

    $\Delta W_{i}=\eta\left(d-\sum_{i} W_{i} x_{i}\right) x_{i}$

    ```


    Rescorla and Wagner were the first to apply equation (4.8) to behavioral modeling,
    showing that it can reproduce a number of learning phenomena such as acquisition,
    extinction, blocking and overshadowing. The first application to stimulus representation
