    critically on limitations to discrimination (Dittrich et al., 1993). Neural network
    models behave very realistically when faced with discrimination problems. Smaller
    differences between stimuli to be discriminated result in longer training time
    or inability to discriminate (Figure 5.5). In addition, adding resources such
    as receptors or inner nodes often makes discriminations easier. An advantage of
    neural networks is that such constraints emerge naturally from the network mechanisms
    rather than being simply assumed or implemented as a discrimination cost (as commonly
    done in game theoretical models of evolution).


    # 5.3.3.4 Biases among solutions


    If there are several alternative ways to gain a selective advantage by modifying
    behavior, particular features of the behavior mechanism may bias evolution to
    adopt one alternative rather than another. In neural network models, this corresponds
    to the ease whereby different solutions are found in simulated evolution (Section
    2.3.3). One example is offered by Calabretta et al. (2004). These authors used
    a three-layer feedforward network to discriminate among a few stimuli that could
    be projected at different positions on a model retina. The network had three output
    nodes. Two were used to control a two-segment arm in response to the stimulus.
    The other one was assumed to command a movement of the eye to the left or to the
    right, causing a shift of the stimulus image on the retina. The network was trained
    by simulated evolution to respond with a given movement of the arm to each stimulus.
    The evolved network solved the task by first moving the eye so that'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'the stimulus was centered on the retina and then reacting in a way appropriate
    to the stimulus. However, the network could have recognized the stimuli in all
    positions, as was proved in a simulation in which the eye could not be moved.
    Nevertheless, this second solution never evolved if the eye could be moved because
    it is more difficult to reach starting from an unorganized network (i.e., a finer
    organization of the weights is required).


    Another important class of problems where properties of behavior systems may bias
    evolution in particular directions is the evolution of signal form. The same information
    is potentially conveyed by a countless number of different signals, and how animals
    process sensory information seems a major determinant of form. Neural networks
    research on this problem is summarized in Section 5.4.5.


    # 5.3.3.5 Conclusions


    Earlier we provided a few examples of constraints and biases in neural networks.
    Other examples can be found in, for instance, Minsky and Papert (1969). Biases
    and constraints may also occur in decision making, receptors and effectors, as
    well as in the map from genes to networks. However, the existence of constraints
    should not change our basic conclusions that networks are very flexible and can
    implement most input-output maps and learning programs. Most constraints and biases
    are temporary, although some constraints (e.g., those related to stimulus intensity)
    may be very difficult to overcome.


    If real nervous systems have biases and constraints similar to neural network
    models, we expect a number of consequences for the evolution of behavior. A possible
    example of puzzling behavior that may be caused by constraints of the type just
    discussed is reactions to young. Evolutionary theory predicts that parents should
    only care for their own young or, in some circumstances, the young of kin (Trivers
    1972). However, adoption of unrelated young is not uncommon among animals (Redondo
    et al. 1995; Riedman 1982). Perhaps this is a difficult problem for evolution
    to solve because it requires opposite responses to very similar stimuli. A more
    aggressive and less caring behavior toward young in general may be easily associated
    with decreased care of own young. The alternative is a more caring behavior toward
    young in general. A telling example concerns gulls that frequently prey on chicks
    of conspecifics. Sometimes, when they bring to the nest a chick for food, they
    fail to kill it and end up adopting the chick instead (Graves & Whitin 1980; Parsons
    1971). We cannot prove that this behavior has evolved because of constraints in
    discrimination, but the possibility seems worth considering.


    # 5.4 EXPLORING EVOLUTION WITH NEURAL NETWORK MODELS


    We now change focus. So far we have discussed the evolution of behavior and nervous
    systems in general terms. In the rest of this chapter we will discuss how neural
    network models may be used to study the evolution of specific behavior programs,
    usually called *strategies*. Many arguments, as well as the “game of presence”
    example in Section 5.4.4, are based on Enquist et al. (2002).'
