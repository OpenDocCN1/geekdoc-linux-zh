    So far we have neglected several issues concerning the temporal relationship and
    duration of stimuli. Here we consider the basic findings that associative learning
    takes place only when external events occur in a particular order and within a
    short time interval from each other (see page 141; for some exceptions to the
    latter, see Section 4.2.3.1 and Mackintosh 1983; Roper 1983). It is obvious that
    a successful model of these findings must embody some form of time representation.
    Reasoning similarly to Section 3.4, we see that information about temporal relationships
    and duration of stimuli is, by definition, not available at the sense organs at
    a single instant of time. Thus some form of memory is necessary to make such information
