  md: '# **Chapter One**


    # **Understanding Animal Behavior**


    The subject of this book is animal behavior. What is animal behavior, and what
    does it mean to understand animal behavior? As we shall see in this chapter, there
    are several answers to these questions, depending on research tradition and what
    one intends to understand. At the same time, different theories of behavior have
    much the same scope:


    +   - They deal with how the animal as a whole interacts with its physical, ecological
    and social environment, in particular through reception of sensory stimulation
    and behavioral actions such as motor patterns, pheromone release, change in body
    coloration and so forth.

    +   - They want to explain, predict or control what animals do.

    +   - They consider situations in which internal factors such as memory and physiological
    states are not easily accessible.


    Besides our theoretical interests, there are great practical demands for knowledge
    of behavior. People who work with animals, such as zookeepers, farmers, animal
    trainers, veterinarians and conservationists, constantly need such knowledge.


    Ethology and comparative psychology are two major research traditions dealing
    with behavior. Within these disciplines, it has been and still is important to
    explore behavior as a function of external stimuli and readily observable factors
    such as species, age and sex. Internal factors such as physiological states and
    memory, on the other hand, are studied indirectly or inferred from observations
    of behavior, history of events and the passage of time. The reason for this difference
    is that in almost all situations in which we encounter animal behavior, it is
    relatively easy to monitor and control the external situation and to record behavior,
    but the access to internal factors is usually limited. However, ignoring internal
    factors undoubtedly has shortcomings. First, it is clear that external factors
    are not alone in causing behavior. An animal can react quite differently to the
    same piece of food, e.g., depending on hunger and memory of experiences with similar
    food items. Second, it is difficult to reconstruct behavior mechanisms from pure
    observations of behavior, and physiological knowledge about internal mechanisms
    may greatly facilitate the development of behavior models.


    But what is the proper compromise between the complexity of nervous system and
    body physiology and the need for understanding at the behavioral level? The role
    of internal factors in models of behavior has been and still is a matter of much
    discussion. The most famous of these debates is the confrontation between behaviorists,
    who attempted to avoid internal factors altogether, and cognitive psychologists,
    who instead encouraged theorizing about internal processes (Leahey'
  merge: -1
  img_proc: true
- pgno: 14
  md: '![](img/4e7230a4ecf676d308ca85f3d2e65bae_14_0.png)


    Figure 1.1 A newly hatched cuckoo chick dumps the eggs of its foster parents.
    The proximate causes of this behavior are not the same as its ultimate causes.
    The proximate explanation is that touch-sensitive receptors on the back of the
    chick elicit a behavior sequence that eventually results in eviction of the eggs.
    The ultimate, or evolutionary explanation is that chicks whose genes coded for
    this behavior survived better than chicks without such genes, since the former
    did not share the foster parents’ effort with foster siblings. Reproduced from
    Davies (1992) by permission of artist David Quinn.


    2004; Skinner 1985; Staddon 2001; see Section 1.3.5). We will discuss this issue
    at length in Chapter 6. In short, our position is that internal factors are vital
    for understanding behavior, but at the same time we side with behaviorists (and,
    of course, ethologists) in their focus on behavior and regard their contribution
    to the understanding of behavior as very significant.


    In this chapter we first consider the different kinds of explanations that have
    been considered for behavior. We then introduce the reader to major theories of
    behavior, focusing on their structure and the causal factors invoked to explain
    behavior. Finally, we introduce neural networks models, which we will explore
    in this book as a potential framework for understanding behavior.


    # 1.1 THE CAUSES OF BEHAVIOR


    In biology, two types of causal explanations are generally recognized: proximate
    and ultimate explanations (Baker 1938; Mayr 1961). Proximate explanations appeal
    to motivational variables, experiences and genotype as the cause of behavior.
    Ultimate explanations refer to selection pressures and other factors that cause
    the evolution of behavior. These two kinds of causal explanations are independent
    and complementary, serving different purposes: one cannot replace the other. To
    clarify this concept, Lorenz (1981; §1.6) offers the following example. The ultimate'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'cause of cars is, of course, traveling. If the engine breaks, however, the
    ultimate cause cannot start it again: we need to know how the engine works (proximate
    causes). Figure 1.1 gives another example of this distinction, in the context
    of behavior. Note that, in principle, we can learn independently about proximate
    and ultimate causes. However, the two are also related (since behavior is a result
    of evolution and influences evolution), and we probably will learn faster about
    one by also considering the other.


    A more detailed set of explanations was suggested Niko Tinbergen in defining the
    scope of ethology (Tinbergen 1963). Rather than distinguishing just between proximate
    and ultimate causes, he argued that four questions must be answered to understand
    behavior. These are usually summarized as follows:


    +   1. What causes a behavior to appear at a given moment and how does the behavioral
    machinery work?

    +   2. How does behavior develop during an individual’s lifetime?

    +   3. What is the evolutionary history of the behavior?

    +   4. How does the behavior contribute to survival and reproduction?


    The first two questions are about the proximate explanation. Splitting it in two
    allows us to study behavior mechanisms at one time separately from how they change
    with time, an advantage on which we will capitalize. Tinbergen’s third question
    aims at a description of evolutionary change and does not refer to any causal
    explanation. The fourth question, as it is expressed, does not strictly refer
    to a causal explanation but to so-called final or functional explanations. These,
    with a leap of logic, invoke the effects of a behavior (contribution to survival
    and reproduction) as the cause of the behavior itself. In practice, however, the
    fourth question often covers true causal studies of the outcome of evolution,
    i.e., studies of how natural selection and other factors can modify behavior in
    an evolving population. Additional discussion of explanations of animal behavior
    can be found in Alcock and Sherman (1994), Dewsbury (1992, 1999), and Hogan (1994a).
    In this book we consider three kinds of causal explanations closely related to
    Tinbergen’s:


    +   1. Motivation

    +   2. Ontogeny

    +   3. Evolution


    To us, understanding behavior means having answers to all of these questions,
    and this book is organized after this classification. The three explanations consider
    the causation of different phenomena and invoke different causes as follows.


    A motivational explanation refers to individual behavior, and the goal is to predict
    behavior from variables such as external stimulation and internal physiological
    states and to understand the behavior mechanism (Hogan 1994a). The term motivation
    refers to generally reversible and often short-term changes in behavior. An example
    is how animals use behavior to regulate food and water intake. Other examples
    include mechanisms of perception, decision making, motor control, etc. These topics
    are covered in Chapter 3.


    Ontogeny refers to the development of the behavior mechanism during an individual’s
    lifetime. The causes of ontogeny are the genotype and all the experi-'
  merge: -1
  img_proc: true
- pgno: 16
  md: '![](img/4e7230a4ecf676d308ca85f3d2e65bae_16_0.png)


    ences the individual has. The changes that occur include changes in the structure
    of the nervous system and memory changes, leading to generally long-term and less
    reversible changes in behavior (Hogan 1994a). Particular phenomena include learning,
    maturation, genetic predispositions and the development of the nervous system.
    Chapter 4 is dedicated to learning and other ontogenetic phenomena.


    Lastly, *evolution of behavior* (or any other trait) occurs in a population of
    individuals and is manifested by changes in the population''s gene pool (Futuyama
    1998). Causes of genetic changes include mutations, recombination, natural selection
    and chance. Selection may stem from the abiotic environment, from other species
    and from the behavior of conspecifics. These are the topics of Chapter 5. In species
    with culture, additional factors would have to be considered, but this is beyond
    the scope of this book.


    # 1.2  A FRAMEWORK FOR MODELS OF BEHAVIOR


    # 1.2.1 The behavior map: From motivational state to response


    Central to this book and a starting point for most of our discussions is the assumption
    that behavior can be described and predicted based on knowledge about relevant
    *motivational variables*. These are simply the variables that enter motivational
    explanations of behavior. For instance, feeding behavior may be caused by the
    presence of food stimuli in combination with hunger, as illustrated in Figure
    1.2. Research on behavior is partly about identifying motivational variables,
    and today, many are known, including physiological variables such as hormone levels
    and external variables such as the shape and color of objects, the structure of
    mating calls, etc. The collection of all motivational variables at a given time
    is the animal''s *motivational state*. A complete description of behavior assigns
    a behavioral response to each possible motivational state. Mathematically, we
    can express this notion'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'Table 1.1 How the behavior map enters different explanations of behavior.


    **Level of explanation**


    | | **Motivation** | **Ontogeny** | **Evolution** |

    | --- | --- | --- | --- |

    | **Question** | What are the properties of the behavior map? | How is the behavior
    map determined? | How does evolution change behavior maps? |

    | **Causes** | External stimuli and internal states | Genes, experiences | Environment
    (physical, biological, social), mutations, chance |

    | **Effects** | A behavioral response | A behavior map | Genetic code to develop
    a behavior map |

    | **Important states** | Internal states of the body and nervous system | Memory
    and nervous system connectivity | Gene frequencies and genotypes |


    with a function $m$ that establishes a mapping from the set of motivational states
    $\mathbf{X}$ to the set of responses $\mathbf{R}$. The latter contains the behavioral
    repertoire and other responses, such as hormone secretion. If we use **x** and
    **r** to refer to a single state and response, respectively, we can write


    ```

    **r** = m(**x**) (1.1)

    ```


    We will refer to $m$ as the *behavior map*. This expression may sound technical,
    but it actually refers to something familiar to all students of behavior. For
    instance, the concepts of stimulus-response relationship, decision rule or response
    gradient are all examples of behavior maps. That is, they can be all written in
    the form of equation (1.1) with appropriate choices of the input and output spaces
    and of the map function $m$. We use the expression behavior map for several reasons.
    First, it is not linked to any modeling tradition, but we can identify a behavior
    map in all theories of behavior. Second, the concept of behavior map provides
    a sharp definition of what we mean by “understanding behavior” at different levels
    of explanation (Table 1.1). Third, our book explores neural networks as behavior
    maps.


    The behavior map may be stochastic rather than deterministic. This means that
    a probability is assigned to each possible behavioral response rather than predicting
    exactly which one will occur. Whether true stochasticity occurs in behavior is
    a largely an unresolved problem (see, e.g., Dawkins & Dawkins 1974). Rather than
    attempting to solve this difficult issue, we note that stochastic factors may
    be included in the formalism above. For instance, we can include motivational
    variables that vary at random (Chapter 3).


    # **1.2.2 The state-transition equation: Changes in motivational state**


    In addition to knowledge of the behavior map, if we want to predict sequences
    of behavior, we also need to know how the motivational state changes with time.
    Such changes may reflect changes in the environment (e.g., in the availability
    of a given food source) or changes within the animal (e.g., altered hormone levels).
    This book'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'studies the impact of both external and internal factors. However, with respect
    to state changes, we are mainly interested in changes within the animal: first,
    because they are caused by processes in the animal whereas most changes to external
    states occur independent of the individual; and, second, because internal states
    allow the animal to organize its behavior in time and to detect temporal patterns
    in sensory input (Chapter 3).


    Formally, changes in state can be described by means of equations of the form


    \(\mathbf{x}(t+1) = \mathbf{M}(\mathbf{x}(t), \mathbf{r}(t))\) (1.2)


    This equation simply says that the state at time \(t + 1\) is a function of the
    state at time \(t\) and of the response of the system at time \(t\) (discrete
    rather than continuous time is considered for simplicity). In systems theory (Metz
    1977; Minsky 1969), equation (1.2) is known as a *state-transition equation*,
    whereas equation (1.1) is the system''s *response function*, or *output function*.
    Examples of state-transition equations will be seen below, as well as in later
    chapters.


    # ### 1.2.3 The behavior map in ontogeny and evolution


    In summary, motivational explanations consider the properties of a particular
    behavior map, i.e., how behavioral responses are caused by motivational states.
    A full understanding of motivational process also requires an understanding of
    motivational state transitions. Ontogenetic and evolutionary explanations of behavior
    deal with different causes and effects.


    In ontogenetic explanations, the effect is a behavior map, and the causes are
    an individual''s genes and experiences. Thus ontogeny considers how the map develops
    and changes during an individuals life. It also covers the nature-nurture issue.
    One can express mathematically the behavior map as a function of the genotype
    \(g\) and the history of experiences \(h\):


    \(m = f(g, h)\) (1.3)


    However, we prefer an approach based on state. An animal does not store its entire
    history; instead, its experiences result in a change to state variables \(W\)
    that determine the properties of the behavior map. Formally, we can write


    \(m = f(W)\) (1.4)


    Most models of ontogeny and learning, including those based on neural networks,
    are of this kind. Note that the state variables of ontogenetic process are different
    from those of motivational process. The most obvious state variable in ontogeny
    is memory, and learning is a key mechanism for memory changes (memory state transitions).
    The state transition equation may be complex and depend on current state, genotype,
    motivational state and response.


    Finally, to understand the genetic evolution of behavior, we have to consider
    evolutionary dynamics and a new class of state variables: the genes. Changes in
    gene frequencies and genotypes \(g\) are caused by the physical, ecological and
    social environment, as well as by mutations and other mechanisms that generate
    new genotypes. Evolution does not change the behavior map directly; the effect
    of genetic evolution is rather a genetic program for developing a behavior map.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# 1.2.4 Requirements on models of behavior


    In summary, to understand behavior we need ways of describing behavior maps and
    state-transition equations. Ideally, models of behavior should fulfill the following
    requirements:


    +   *   **Versatility**: We observe great diversity in behavior both between species
    and, on a less dramatic scale, within species. The basic structure of a general
    model of behavior should allow for a diversity of behavior maps to be formed.

    +   *   **Robustness**: Regardless what explanation we seek, the mechanisms should
    display some robustness; otherwise, behavior would be vulnerable to any genetic
    or environmental disturbance. Thus small disturbances should not cause any major
    changes in performance.

    +   *   **Learning**: Learning from experience is a general feature of animal
    behavior. The model should allow learning, which should integrate realistically
    with the behavior map.

    +   *   **Ontogeny**: The behavior system of an individual develops in a sequence
    of events in which genes, the developing individual and the environment interact.
    The structure of the model should allow for gradual development of a behavior
    map from scratch to an adult form.

    +   *   **Evolution**: For evolution to occur, genetic variation must exist that
    affects the development of behavior mechanisms. In a model, it should be possible
    to specify how genes control features of behavior maps and learning mechanisms.
    In addition, a model should allow the evolution of nervous systems from very simple
    forms to the complexities seen in, e.g., birds and mammals.


    # 1.3 THE STRUCTURE OF BEHAVIOR MODELS


    A diversity of behavior models exists, often developed for particular purposes
    such as the study of learning or perception. Important contributions to animal
    behavior theory come from the ethological tradition (McFarland 1974a; McFarland
    & Hous- ton 1981; Simmons & Young 1999) and from comparative psychology (Mackintosh
    1994) but also from neuroscience (Cacioppo et al. 2000; Gazzaniga 2000; Kandel
    et al. 2000) and computer science (Wilson & Keil 1999). Here we consider different
    modeling traditions from the point of view of model structure. By structure we
    simply mean the basic machinery of the model, e.g., how a motivational model generates
    the response from motivational variables. So far we have not provided any structures
    to the models we have considered. Adding structure to a model of behavior includes
    making assumptions about features of real animals, such as sense organs, central
    processes, memory, motor control and what are the available responses. What this
    means in practice will become clear in the following.


