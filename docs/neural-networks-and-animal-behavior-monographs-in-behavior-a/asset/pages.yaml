    # 3.2.2 More complex models


    In general, a neural network model of behavior includes one or several groups
    of input nodes modeling particular sense organs, an internal architecture with
    connections between receptors and effectors (direct or mediated by hidden nodes)
    and finally effectors modeling how the nervous system controls muscles and produces
    other physiological responses. There are many potentially useful choices of internal
    architecture. For instance, some weights might be fixed, whereas others could
    change with experience or as a consequence of maturation processes. It is often
    useful to have one or a few layers of fixed processing of the input, followed
    by a network with adjustable weights that can be modeled to respond flexibly to
    the processed patterns (Section 3.4). Another possible architectural element is
    an internal clock that allows the network to vary its sensibility to different
    inputs with time of day. The clock either could feed its activity to the network
    in the same manner as input nodes or could be built out of network nodes.'
