    Figure 3.36 Scheme of the neural circuit controlling the pyloric rhythm in the
    spiny lobster (*Pulmonarius*; based on Hooper 2003). AB: anterior burster neuron;
    PD: pyloric dilator neurons (2 cells); VD: ventricular dilator neuron; IC: inferior
    cardiac neuron; LP: lateral pyloric neuron; PY: pyloric neurons (8 cells). Empty
    arrows denote inhibitory synapses. Those originating from PD and VD (shaded) cause
    longer-lasting inhibition. Dashed lines indicate electrical synapses that shift
    the electrical potential of the postsynaptic cell toward that of the presynaptic
    cell. Connections that exist in both directions are drawn as a double-headed arrow.


    # 3.8.2 A biological example


    To exemplify how biological nervous systems exercise motor control, we turn to
    the stomatogastric ganglion in the spiny lobster and its control of the digestive
    tract. There are several rhythms active in the lobster digestive system that are
    involved in food intake and manipulation and in moving food within the digestive
    system. A well-studied rhythm is the pyloric rhythm of the spiny lobster (Hartline
    1979; Hartline & Gassie 1979; Hooper 2003; Mulloney & Selverston 1974). The pyloric
    rhythm controls the pylorus, a system of valves and sieve plates that helps to
    sort out food particles for further digestion. The circuit controlling the pylorus
    is made up of 13 motoneurons and one interneuron (Figure 3.36). There pyloric
    circuit has three main phases of activity. The AB neuron serves as a pacemaker.
    Because of its electrical coupling to the AB neuron, the PD neuron fires together
    with AB. Together they strongly inhibit the other cells in the network. AB and
    PD synapse on the pyloric dilator muscles, and when they fire, they open a valve
    from the gastric mill to the pyloric region. This allows food particles to flow
    into the pylorus. The LP neuron synapses on the lateral pyloric muscle. It is
    the first cell to recover from inhibition caused by AB and PD, and it fires causing
    the valve to close. The IC cell fires in phase with the LP cell and aids in closing
    of the valve. The LP neuron also inhibits the AB and PD neurons, which prevents
    them from firing again. In the final phase of the cycle the PY neurons recover
    from inhibition and start firing. These neurons control the pyloric muscles responsible
    for moving the sieve plates that sort out the food for further digestion. The
    VD cell often fires in phase with the PY cells, but its firing is not easily correlated
    with just one movement.


    **In summary**, this example shows how a rhythmic movement is produced through
    successive activity and inhibition of particular neurons. The valve from the gastric
    mill is first opened and then closed; then the sieve plates are moved. The pyloric
    network is controlled by many factors, including the endogenous bursting activity
    of the AB neuron, inhibitory connections, and the properties of individual cells.'
