- pgno: 52
  md: 'In describing neural networks, we retain notations used for behavior maps in
    general (Chapter 1). Input and output spaces can be defined by choosing some nodes
    as *input nodes* and others as *output nodes*. For instance, the former may model
    receptors and the latter motoroneurons (connected to muscles) or neurons that
    secrete hormones or other chemicals (Chapter 3). Nodes that are neither input
    nodes nor output nodes traditionally are called *hidden nodes*. We write network
    input vectors as $\mathbf{x}_1, \mathbf{x}_2$, etc. Greek indices refer to different
    inputs and Latin indices to particular nodes. Thus $x_{\alpha i}$ is the activity
    of input node $i$ elicited by the input $\mathbf{x}_{\alpha}$. Likewise, $r_{\alpha
    j}$ is the activity of output node $j$ in response to input $\mathbf{x}_{\alpha}$.
    The letters $y$ and $z$ will be still used, as above, for the input and output
    of a generic node, respectively.


    # 2.2.1 Feedforward networks


    Figure 1.9 on page 19 shows some feedforward networks. Stimuli external to the
    network are assumed to activate the network’s input nodes. This activation pattern
    is processed in a number of steps corresponding to node "layers." The activity
    in each layer is propagated to the next layer via a matrix of connections. Any
    number of layers may be present, although two- and three-layer networks are most
    common. Feedforward processing is an important organizational principle in nervous
    systems, e.g., in the way information from receptors reaches the brain. Although
    purely feedforward processing is rare, we shall see that these networks are helpful
    models of behavior. Moreover, feedforward networks are an important component
    of more complex architectures.


    # 2.2.1.1 The perceptron


    The first network architecture we consider is the so-called perceptron (Minsky
    & Papert 1969; Rosenblatt 1958, 1962). It consists of a single node receiving
    a number of inputs via a weight vector $\mathbf{W}$, as shown in Figure 1.9 on
    page 19. Owing to its simplicity, the perceptron is fully specified by a single
    equation:


    ```

    $r = f\left(\sum_{j} W_{j}x_{j}\right) = f(\mathbf{W} \cdot \mathbf{x})$    (2.15)

    ```


    (see equation 2.8, and note that in this simple case we need only one index to
    label weights). The perceptron can be interpreted in several ways. It can model
    a very simple nervous system, where a number of receptors are connected directly
    to an output neuron, or it can be a building block for larger systems. In his
    seminal work, Rosenblatt considered the $x_{j}$’s as the outputs of simple *feature
    detectors*, e.g., reporting about particular aspects of a visual scene (see the
    “analyzers” in Figure 1.11). The perceptron had to combine information about the
    presence or absence of individual features to reach yes-no decisions about the
    whole input pattern, e.g., about whether it belonged to some category. To this
    end, Rosenblatt used a transfer function assuming only the values 0 and 1 as follows:


    ```

    $f(y) = \begin{cases} 1 & \text{if } y > \theta \\ 0 & \text{otherwise}\end{cases}$    (2.16)

    ```'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Table 2.1 A behavior map, interpreted as a simple model of feeding, that
    cannot be realized by a perceptron with two input nodes and one output node. The
    first two columns, each split in two, provide the mathematical description and
    interpretation of inputs and outputs. The third column shows how to choose perceptron
    parameters to realize single input-output mappings. However, there is no set of
    parameters that can realize all four mappings.


    | Input | | Desired output | | Desired output obtained if: |

    | --- | --- | --- | --- | --- |

    | Values | Interpretation | Value | Interpretation | |

    | (0,0) | All black | 0 | Don’t eat | θ > 0 |

    | (0,1) | Black and white | 1 | Eat | W₂ > 0 |

    | (1,0) | White and black | 1 | Eat | W₁ > 0 |

    | (1,1) | All white | 0 | Don’t eat | W₁ + W₂ < θ |


    where $\theta$ is a number serving as a threshold: if the total input y = W ·
    x is above threshold, the output will be 1; otherwise, it will be 0. Rosenblatt
    also devised an algorithm to adjust the weights to correctly classify a set of
    input patterns into two categories. For instance, we could use this algorithm
    to solve the feeding control problem discussed on page 20.


    Perceptrons, however, cannot realize all behavior maps. Consider a perceptron
    with two input nodes that model photoreceptors and an output node whose activity
    is interpreted as eating a prey. Each receptor reacts with 0 when no or little
    light is captured and with 1 when a lot of light is captured, e.g., when light
    reflected from a white object reaches the receptor. The model organism meets two
    kinds of potential prey. All-white prey is unpalatable and should be ignored.
    We assume that the presence of white prey reflects enough light to the retina
    to always activate both receptors. The second kind of prey instead should be eaten.
    Its presence activates only one receptor (e.g., because it is smaller), resulting
    in two possible input patterns: (0,1) and (1,0). The required behavior map is
    shown in Table 2.1 and is known as the exclusive-or problem (XOR). The last column
    in the table shows how the three perceptron parameters, $W_1$, $W_2$ and $\theta$,
    must be chosen to realize each input-output mapping. For instance, the perceptron
    reacts to (0,1) if $W_1 \times 0 + W_2 \times 1 = W_2$ is larger than $\theta$
    (second table row). The problem is that the four conditions cannot all be satisfied
    by the same set of parameters: the sum $W_1 + W_2$ cannot be smaller than the
    positive number $\theta$ if each of $W_1$ and $W_2$ alone is bigger! The limits
    of perceptrons will be further discussed below (see also Minsky & Papert 1969).


    # 2.2.1.2 From perceptrons to behavior


    A few modifications make perceptrons more suitable for behavioral modeling, al-
    though their computational limitations are not removed. Rosenblatt’s threshold
    mechanism (equation 2.16) implies that the same input always yields the same output.
