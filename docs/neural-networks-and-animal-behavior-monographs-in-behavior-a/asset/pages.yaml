    # 2.3 ACHIEVING SPECIFIC INPUT-OUTPUT MAPPINGS


    The input-output map realized by a network depends, of course, on the values of
    the weights. In practice, much of the work with neural networks is concerned with
    setting weights. Up to now we have considered problems in which suitable weights
    could be found either by intuition or by using simple mathematics. In this section
    we describe some powerful weight-setting methods that can deal with more complex
    problems. In the next section we describe procedures that organize network weights
    in response to incoming input rather than seeking to achieve a particular input-output
    map.


    Weight-setting methods can be viewed either as models of real-world phenomena,
    i.e., how synapses change in nervous systems, or simply as a tool to build networks
    that handle a given task, without any additional claim. Here the focus is on the
    latter view, whereas Chapter 4 covers biological learning. Our goal is to build
    a network that produces a number *μ* of assigned input-output mappings:


    ```

    m(𝐱ₐ, 𝐖) = 𝐝ₐ      ∀α = 1, . . . , μ

    (2.21)

    ```


    where *m* is the input-output map realized by the network, **W** denotes all network
    weights, and **dₐ** is the desired output pattern to input **xₐ**. Equation (2.21)
    is a system of *μ* equations where the unknowns are network weights. The direct
    analysis of these equations is typically very challenging or plainly infeasible.
    The only case that can be treated thoroughly with simple mathematics is linear
    networks, i.e., networks in which all nodes have a linear transfer function, such
    as equation (2.6). We discuss this case (with a final note on networks with nonlinear
    output nodes) before presenting more general weight setting techniques.


    # 2.3.1 Setting weights in linear networks


    If the transfer function of all nodes is linear, weights satisfying equation (2.21)
    can be found by formal methods, or it can be proved that they do not exist. We
    start with a linear perceptron, equation (2.19), and with a single input-output
    mapping. This corresponds to equation (2.21) with *μ* = 1 and *m* (**x₁**, **W**)
    = **W** · **x₁**. In this case it is easy to check that the single requirement
    **W** · **x₁** = *d₁* is satisfied by a weight vector of the form


    ```

    𝐖 = 𝑐₁ 𝐱₁      (2.22)

    ```'
