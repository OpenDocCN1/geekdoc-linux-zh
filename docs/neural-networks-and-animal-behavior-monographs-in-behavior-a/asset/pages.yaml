    Figure 5.4 Reactions to equally reinforced stimuli of different intensities in
    animals and networks. Left: Rabbits were trained to react to tones of different
    intensities. Despite the fact that all stimuli were equally reinforced, the more
    intense ones elicited more responding (data from Scavio & Gomeziano 1974). Right:
    Simulation of the same experiment with a two-layer feedforward neural network.
    The stimuli employed are like the ones in Figure 3.8 (right). Stimulus intensity
    is measured as maximum node activity. The network was trained with reinforcement
    learning (Sections 2.3.4 and 4.2.2).


    # 5.3.3.2 *Effects of stimulus intensity*


    The ability to form input-output maps along intensity dimensions is limited in
    neural networks. We saw in Section 3.3 that neural network models reproduce realistically
    the reactions of animals to stimuli varying in intensity. For instance, both animals
    and neural network models usually react more strongly to more intense stimuli.
    Even after extensive training in which stimuli of different intensities are equally
    rewarded, animals continue to respond more to the more intense stimuli (Figure
    5.4). Thus it is difficult for animals to treat alike stimuli of different intensity.
    We also saw in Section 3.3 that a two-layer network, which entails a single overlap
    calculation, can only form a monotonic response gradient over intensity dimensions
    (i.e., either increasing or decreasing with intensity). A three-layer network
    can, in principle, overcome this limitation because it can fit with arbitrary
    precision any smooth function, given a large enough hidden layer. In practice,
    however, it seems very difficult to eliminate the bias (Figure 3.12). Moreover,
    there are practical limits to the number of nodes that can be used, and using
    a very large network is also likely to degrade generalization along other dimensions
    (see Chapter 6 of Haykin 1999).


    # 5.3.3.3 *Discrimination*


    The discrimination abilities of animals (or any mechanism) are, of course, limited,
    and discriminating between similar stimuli is more difficult than discriminating
    between different ones (Figure 5.5; Hanson 1959; Raben 1949). The evolution of
    some remarkable phenomena, such as camouflage and mimicry, seems to depend'
