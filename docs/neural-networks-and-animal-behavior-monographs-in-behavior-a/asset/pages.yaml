  md: '# ### 1.3.5 Cognitive models


    By *cognitive models* we mean models in the style of cognitive psychology and
    computer science (together often referred to as *cognitive science* as it emerged
    from the late 1950s until today (Creve r 1993; Leahey 2004; Wilson & Keil 1999)).
    The main feature of cognitive models is a strong focus on the representation and
    processing of information. Traditional cognitive science was aimed at humans,
    but today there is considerable research under the heading of animal cognition,
    including a journal by this name (Balda et al. 1998; Bekoff et al. 2002; Dukas
    1998a; Gallistel 1990; Mackintosh 1994; Pearce 1997; Shettleworth 1998). The classical
    research program of cognitive psychology argued that any intelligent organism
    or machine could be fully understood in terms of a program operating on stored
    information. Thus one could ignore what hardware is used practically, whether
    a computer or a brain (Neisser 1967).


    While the primary aim of cognitive models is to understand how the brain represents
    and processes information, they also predict behavior and are evaluated based
    on such predictions. In this respect, cognitive modeling is similar to animal
    learning theory (it could be argued that since the 1970s, the two fields have
    come progressively closer). The structure of cognitive models specifies both how
    memory is updated based on experiences (the state-transition equation) and how
    responses are decided on based on information stored in memory (the behavior map,
    or response function). Typically, memory is described in functional terms as internal
    representation of knowledge about the world, e.g., knowledge of locations, angles,
    velocities, conditional probabilities (e.g., Gallistel 1990). Decisions and memory
    updates are “computational” in the specific sense of manipulation of symbols,
    very much in the sense of formal mathematics. The following two examples illustrate
    these typical aspects.


    The first example is about the ability of desert ants, *Cataglyphis bicolor*,
    to navigate in the absence of clear landmarks (W ehner & Platt 1972; Wehner &
    Srinivasan 1981). After long and tortuous wanderings searching for food, these
    ants are capable of aiming for their nest following an approximately straight
    path. Gallistel (1990) has proposed that ants achieve this by constantly calculating
    the direction and distance to the nest. Such calculations are based on solar heading,
    obtained from the visual system; the speed whereby the ant moves, possibly obtained
    from the brain''s motor command; and the sun''s current azimuth. The latter is
    computed with the aid of an internal “solar ephemeris function” that describes
    the sun''s course and is based on an internal clock. These inputs allow the animal
    to compute its position in a coordinate system from which direction and distance
    to the nest subsequently are computed. The model is illustrated in Figure 1.7
    (further discussion in Chapter 6).


    A second example illustrates another cognitive approach, which considers that
    organisms live in an uncertain world and can learn about the world through observations.
    Many empirical studies have shown that animals and humans are sensitive to temporal
    correlations or contingencies apparent in their interaction with the outer world
    (Dickinson 1980; Mackintosh 1994; Shanks 1995). This has spawned the idea that
    the central nervous system operates as a “statistical machine” (Shanks'
