  md: 'The model by Blough (1975) combines features from the summation tradition

    and the gradent-interaction one. Blough assumed that every stimulus along a given

    dimension activates an array of "stimulus elements." In contrast to earlier sum-

    mation models, each stimulus activates many elements, and different stimuli induce

    partially overlapping activity patterns. Responding to a pattern of activity is
    still

    given by equation (3.4) but the $x_i$''s are continuous values corresponding to
    the de-

    gree to which element $i$ is active. Blough further assumed that each element
    has

    a "preferred" value along the dimension, to which activity is maximal. Element

    activity decreases in a smooth fashion as the actual stimulus value departs from
    the

    "preferred" one. The patterns of activity generated by this scheme along a contin-

    uous dimension match the stimuli in Figure 3.8 (left).


    Formally, Blough''s model is the same as the two-layer neural network consid-

    ered here. A key difference, however, lies in the interpretation of the "stimulus
    el-

    ements." Blough regarded them as a somewhat arbitrary abstract device, a price
    to

    pay to describe behavior accurately. This has lead to considerable criticism (Pearce

    1987, 1994). We have instead interpreted the "elements" as models of receptors,

    which gives them a concrete interpretation and establishes a general method to
    build

    input patterns. A first consequence is that the difference between discrete stimuli

    and continuous dimensions disappears. Every stimulus situation, not only contin-

    uous dimensions, is represented as an input pattern, just as it happens with real

    sense organs (Blough proposed instead to merge his model with Rescorla & Wag-

    ner''s summation model, resulting in one set of associative strengths for "within-

    stimulus" generalization and one set for "between-stimuli" generalization). More-

    over, the correspondence between network inputs and sense organ activity patterns

    allows the model to account for phenomena that require additional assumptions
    in

    formally identical models such as Blough''s and Rescorla & Wagner''s. Two exam-

    ples are intensity generalization (Section 3.3.1.2) and external inhibition (p.
    82).

    The former is often explained by introducing ad hoc explanations that favor re-

    sponding to intense stimuli, with only partial success (Ghirlanda 2002). The latter

    has sometimes been explained as an effect of attention. A third example is *summa-

