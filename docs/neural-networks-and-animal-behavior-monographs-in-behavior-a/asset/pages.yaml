  md: '+   2. Properties of the weights (synapses), e.g., their initial value and
    rules for weight change.

    +   3. Network architecture, including size and number of layers, as well as patterns
    of connectivity between layers or node groups; an alternative and more biologically
    realistic assumption would be that genes code for developmental rules that build
    network architecture.

    +   4. Properties of receptors, their numbers and organization into sense organs.

    +   5. Properties of the skeletomuscular apparatus and other effectors.


    Notwithstanding all these possibilities, most studies of neural network evolution
    have been concerned so far only with model genotypes that determine individual
    weights within a fixed architecture (Enquist & Arik 1993, 1998; Huber & Lenz 1996;
    Kamo et al. 1998; Nolﬁ & Floreano 2000; Phelps & Ryan 1998). From the point of
    view of the evolution of behavior mechanisms, this is perhaps the less interesting
    case because it limits evolution to developing behavior maps within a given structure
    rather than developing receptors, architecture, learning abilities and so forth.
    That the genes can code for individual network weights is often even unrealistic
    (see also Section 5.1). Organisms seem to have fewer than 100,000 genes, which
    must build the whole organism and not just the brain (Maynard Smith & Szathmáry
    1995). The number of synapses in the human brain, with $10^{10}$–$10^{11}$ neurons
    and perhaps an average of 10,000 synapses each, is of the order of $10^{14}$–$10^{15}$
    (Rolls & Stringer 2000). Clearly, the human genome cannot specify individual synaptic
    weights (Nolﬁ 2003; Rolls & Stringer 2000). This applies to many other organisms.
    In small neural networks, however, genes may determine individual synapses to
    a large extent.


    The literature offers a number of interesting studies of behavioral evolution
    based on neural networks. In Section 3.8 we described a study by Beer and Gallagher
    (1992) showing that a walking pattern actually seen in insects evolved spontaneously
    in a population of simulated insects whose locomotion was controlled by a neural
    network (see Figure 3.39 on page 123). Ispewert and coworkers provide further
    valuable examples (Ispewert 2001, 2003; Ispewert et al. 1998; Ispewert & Kojajabachian
    1999). One example concerns changes in locomotion associated with the transition
    from water to land habitats. Starting from a neural network model of swimming
    in the lamprey (page 122), Ispewert (2001) added front and hind legs, each pair
    controlled by a central pattern generator similar to the one present in the swimming
    model. This arrangement is found in salamanders, which can both swim (in the same
    style as lampreys) and walk. Moreover, salamanders are believed to be the living
    vertebrates closest to the ancestral animals that came on land. The network model
    was subject to simulated evolution with fitness given by efficient swimming and
    walking, after which it could swim and walk at different speeds (depending on
    the amount of input to the central pattern generators) and turn (if opposite sides
    of the body were given different input). The evolved network would swim, with
    limbs held close to the body as salamanders do, if the limb pattern generators
    were off and would walk with a salamander gait if all three pattern generators
    were switched on.'
