    in this way (Buonomano & Karmarkar 2002). Second, everything is remembered with
    equal weight, even unimportant things.


    Recurrent networks provide a superior alternative for temporal processing. These
    networks can build a more useful representation of input sequences than the simple
    bookkeeping of the past. Different recurrent architectures have been analyzed,
    e.g., networks with feedback between internal nodes (Elman 1990) or feedback from
    output nodes to internal nodes (Jordan 1986). Both features may be helpful, and
    both are important in nervous systems (Chapter 3). How can we establish a desired
    input-output map in a recurrent network? The question is difficult from the points
    of view of technique and biological realism alike. Gradient descent techniques
    may be applied that are conceptually like to the δ rule and back-propagation,
    but it is more difficult to calculate the error gradient (Doya 2003; Haykin 1999).
    The extension of random search techniques, on the other hand, is easier. We only
    need a performance function that considers *sequences* of inputs and outputs rather
    than single input-output mappings. Note, however, that the number of possible
    sequences grows exponentially with the number of time steps considered. Thus a
    naive extension of random search can be impractical. The very task of prescribing
    the correct output to every sequence of inputs can be prohibitive. Indeed, it
    is common that time-dependent tasks are not even phrased as an input-output map.
    For example, consider a network that must control a model arm so that it can reach
    toward objects. It would be practically impossible to analyze all possible input
    sequences'
