    # 6.4.2 Can neural networks account for animal cognition?


    A number of empirical findings have been offered as evidence of “cognitive” abilities
    in animals, such as concept formation, numerical abilities and manipulation of
    symbolic information (Balda et al. 1998; Belkoff et al. 2002; Shettleworth 1998).
    Alternative accounts of these findings, however, are rarely tested, and there
    is the possibility that standard neural networks may account for some or most
    observations of animal cognition. Let us consider an example of concept formation
    relative to the abstract concepts of “same” and “different,” as illustrated in
    Figure 6.3. Experiments have shown that some animal species can learn to discriminate
    pictures composed of identical elements from pictures composed of different elements.
    The animal is first trained, by instrumental conditioning, to respond to pictures
    of one kind only, e.g., to “same” pictures but not to “different” pictures. The
    animal is then tested with examples of “same” and “different” composed of picture
    elements that were never shown during training. If the animal continues to respond
    appropriately, this is taken as evidence that the discrimination was solved by
    using a concept of “same” and “different” rather than, say, simply by associating
    each training picture with the appropriate response (see Cook 2002; Delius 1994;
    and Wasserman 2002 for both data and details on experimental methods).'
