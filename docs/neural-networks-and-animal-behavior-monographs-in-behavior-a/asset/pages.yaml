  md: 'Although a shortcoming in this simple case, in more complex tasks this may
    be a blessing. We have observed already that gradient descent methods may reach
    unsatisfactory local minima of the error surface. Random search is less prone
    (though not immune) to this kind of failure because occasional large mutations
    may lead out of local minima. Random search methods, moreover, can mimic genetic
    evolution, thereby allowing us to study the evolution of behavior (Chapter 5).


    # 2.3.4 Learning from limited information (reinforcement learning)


    The weight-setting methods described so far are based on detailed knowledge of
    the desired behavior map. Here we describe techniques that require less information.
    For instance, it may be enough to know whether the output is correct or not. These
    techniques are often called *reinforcement learning* because they resemble instrumental
    conditioning experiments in animal psychology (Barto 2003; Sutton & Barto 1998;
    see Chapter 4). In these experiments, animals do not (obviously) know what behavior
    the experimenter wants to train but can track what actions are rewarded or punished
    (“reinforced”). Reinforcement learning in artificial systems usually is achieved
    by increasing the probability of actions that, in a given situation, are followed
    by positive consequences and decreasing the probability of actions followed by
    negative consequences. In a self-contained learning device, this clearly requires
    a mechanism that identifies an event as positive or negative, as we will discuss
    in Chapter 4.


    In our example task, reinforcement learning can be implemented as follows. First,
    network output must be interpreted as an action rather than as the probability
    of performing an action. This is achieved by using threshold transfer functions
    so that the output node is either active (interpreted as performing the action)
    or inactive. Moreover, we use a stochastic threshold node (equation 2.18) to generate
    variable output to the same input. This allows the network to try out different
    responses to the same stimulus, which is crucial to discover favorable responses.
    Let $\lambda=1$ if reinforcement has been received and $\lambda=0$ if not. Then
    the rule for changing the weights is


    ```

    $$

    \Delta W_{i}=

    \left\{

    \begin{array}{cc}

    \eta\left(r-\mathbf{W} \cdot \mathbf{x}\right)x_{i} & \text { if } \lambda=1 \\

    \eta\left(1-r-\mathbf{W} \cdot \mathbf{x}\right)x_{i} & \text { if } \lambda=0

    \end{array}

    \right. \tag{2.50}

    $$

    ```


    where $r=1$ if the action has been performed, and $r=0$ otherwise. To understand
    equation (2.50), note that both expressions have the same form of the $\delta$
    rule, with $r$ and $1-r$ taken as desired responses (Widrow et al. 1973). Thus
    if performing the action has lead to reinforcement, it is taken as a goal. This
    works also to suppress responses to a input, in which case not performing the
    action is reinforced.


    Now that network output is binary (react or not react), the $d_{i}$’s cannot be
    interpreted as desired outputs. Their interpretation is rather that $d_{i}$ is
    the probability that reinforcement will follow if the network responds to $\mathbf{x}$.
    Figure 2.12 shows the result of a simulation of equation (2.50). The outcome is
    that the network performs the action with probability $d_{i}$.


    If the reinforcement can take on a continuous range of values, say, between 0
    and 1, it is useful to combine the two parts of equation (2.50) into a single
    equation'
