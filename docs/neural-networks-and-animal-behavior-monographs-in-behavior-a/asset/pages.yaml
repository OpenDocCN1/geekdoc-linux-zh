    # 5.4.4 Example 1: Coevolution between signal senders and receivers


    This example describes how sender-receiver coevolution can be investigated with
    neural network models and also illustrates some of the general points discussed
    earlier regarding the interplay between behavior mechanisms and evolution.


    An important feature of social evolution is evolutionary conflicts of interest.
    Such a conflict exists when the expected reproduction or fitness of one individual
    could increase at the expense of other individuals (Enquist et al. 2002; Parker
    1979). For instance, a potential prey would benefit from the predator not attacking,
    a contestant from the opponent giving up or a busy female from males stopping
    courting her. These evolutionary conflicts may appear at first as just of theoretical
    interest because it is difficult to imagine how an individual can influence what
    others decide to do. However, many examples of successful manipulation of others''
    actions are known in nature. Larvae of the blue butterfly are a spectacular example,
    being able to persuade ants to carry them to the ant nest, where they feed on
    ant larvae and pupae (Hölldöbler & Wilson 1990).


    How can manipulation evolve and persist? To get some insight into this problem,
    we will consider a simple case of evolutionary conflict called the *game of presence*
    (Enquist et al. 2002). We first present this game and then analyze it with both
    standard game theory and simulated evolution of neural networks. There are two
    players, an actor and a reactor. The actor is either present (v = 1) or absent
    (v = 0) but has no choice of actions. The reactor, based on whether or not the
    actor is present, decides on an effort x (x > 0). This structure is depicted in
    Figure 5.6. In the presence of the actor, the reactor''s payoff is first increasing
    and then decreasing with x. The payoff to the actor of the reactor''s effort is
    ever-increasing with x. In the absence of the actor, providing an effort x > 0
    returns a negative payoff to the reactor. A simple formalization of this game
    is as follows:


    ```

    $$ \begin{aligned} F_{A}(x) = x \\ F_{R}(x) = \begin{cases} x - x^2 & v = 1 \\
    -x^2 & v = 0 \end{cases} \quad (5.2) \end{aligned} $$

    ```


    where $F_{A}$ is the payoff (fitness) to the actor, and $F_{R}$ is the payoff
    to the reactor. Note the conflict between the two players concerning the amount
    of effort x to be made by the reactor. Similar conflicts are widespread. For example,
    in sexual conflicts (Arnqvist & Rowe 2002; Gavrillets et al. 2001), a female (reactor)
    must trade off current investment in reproduction with future investment, whereas
    a male (actor) wants the female to invest maximally in the current reproduction
    (Chapman & Partridge 1996; Rice 1996). We will now present three theoretical analyses
    of this game given different assumptions about what strategies are available to
    actors and reactors.'
