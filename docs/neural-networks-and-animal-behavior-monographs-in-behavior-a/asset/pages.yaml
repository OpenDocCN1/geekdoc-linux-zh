  md: 'Can neural networks accomplish such behavior? In one sense, we know they can
    because networks can form almost any behavior map. The question is rather whether
    cognitive behavior emerges from either simulated evolution or biologically plausible
    models of learning processes. We do not know the answer to this question, but
    it would be premature to conclude that networks, even feedforward ones, cannot
    match animals’ abilities on this problem. It seems important to simulate the empirical
    studies with various types of networks, both feedforward and recurrent, to sort
    out the extent to which they are capable of “cognitive” behavior. If simple networks
    fail, we will conclude that they cannot account for certain “cognitive” abilities,
    and we will need to develop new theory. But if the networks can reproduce these
    results, we might reconsider our ideas about what goes on inside animals, e.g.,
    the extent to which symbolic manipulation is necessary for cognitive behavior.


    We can also sketch some interesting predictions that may come from a successful
    network model of the “same” and “different” problem. In fact, given what we know
    about generalization in networks (Section 3.3), we expect that the network would
    not respond in exactly the same way to all novel pictures. Although this might
    be interpreted as a failure to develop a “same” concept, we must also recognize
    that animals do make mistakes (e.g., successful conceptualization may be claimed
    based on 80% correct responses). We have seen a similar situation relative to
    perceptual constancy, where not all novel views of a familiar object are recognized
    with the same accuracy (Section 3.4.3). In a simple network model, performance
    on a novel picture should depend on its similarity to known pictures, and we thus
    expect the network to make most mistakes on those novel pictures that are less
    similar to the training ones. It would be very interesting to check whether this
    holds for animals as well, including humans. Would it imply that no “same” concept
    is formed?


    # 6.4.3 The problem of observability


    If neural networks can account for many skills that seem to require formal symbolic
    abilities, we face another important issue regarding the observability of internal
    processes. That is, how much can we learn about internal mechanisms from only
    observing behavior? In animal cognition and most of animal psychology, behavior
    is used as the only window into the animal. Neurobiology, in contrast, gains almost
    all its knowledge from studying the structure and operation of the nervous systems
    itself. Our neural network approach falls in between.


    Theoretical results from systems theory show that there are important limitations
    to what one can learn about a system’s inside from the outside (Kalman 1968; Luenberger
    1979; McFarland & Houston 1981; Polderman & Willems 1998). This is an acute problem
    for students of behavior. For instance, a number of studies have tried to distinguish
    between different types of memory models based on observations of behavior (e.g.,
    prototype and instance theories; see Pearce 1994; Shanks 1995). Whether this is
    even theoretically possible is an important question. For instance, finding out
    the memory mechanism of a neural network would be difficult from just exploring
    stimulus-response patterns. Let us make a concrete example using a famous study
    of dead reckoning in desert ants. Gallistel (1990) offers two'
