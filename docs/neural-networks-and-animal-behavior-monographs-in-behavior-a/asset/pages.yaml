    # ## 3.5 TEMPORAL PATTERNS


    Temporal patterns are a very relevant feature of the world. Duration, rhythm and
    other temporal structures are crucial, for example, in many visual and auditory
    displays used in animal communication. Different species of woodpeckers are an
    interesting example. They can be identified on the basis of their drumming, a
    rhythmic series of sounds caused by hammering against a resonant object such as
    a tree trunk. Drumming varies among species in duration, frequency and amplitude.
    Temporal patterns are also crucial for detecting movement (Simmons & Young 1999),
    which can have a number of uses, such as detecting prey or predators (Eweret 1985;
    Lettvin et al. 1959). How visual images move over the retina is important also
    when moving in the environment, e.g., for maintaining a straight course (Section
    3.5.1).


    Obviously, responding to temporal patterns cannot be based on sensory information
    at a single instant of time. A single hammering does not tell woodpecker species
    apart, nor does a single visual image tell whether an object is approaching or
    receding. Consequently, to make decisions based on temporal patterns, sensory
    processing beyond the level of receptors is needed. Somehow information about
    prior stimulation must be retained and made available to the decision mechanism.
    Perhaps the simplest example of time structure is a change in input. Imagine that
    an input signal x(t) is mostly constant but sometimes changes value from 0 to
    1 or vice versa. The network in Figure 3.19 reacts only to change and ignores
    periods of constant input. To see how this is achieved, notice that this network
    is derived from the network in Figure 2.8 on page 44. The modification is simply
    that now node 2 receives input from node 1 rather than from external stimuli.
    In this way, nodes 1 and 2 hold the values x(t) and x(t−1), respectively. Thus,
    reacting to a change is the same as reacting when exactly one of nodes 1 and 2
    is active, and this is what the network in Figure 2.8 was designed to do. By a
    small change in network organization, a temporal pattern has been transformed
    into a pattern of activity of nodes at the same time, which can be used for further
    processing and decision making.'
