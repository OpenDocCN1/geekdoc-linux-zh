    # 1.4 NEURAL NETWORK MODELS


    This book explores neural networks as models of behavior, also known as *artificial
    neural networks, connectionist networks or models, parallel distributed processing
    models and neurocomputers*. We call them neural network models or sometimes just
    neural networks or networks when the meaning is clear. To avoid confusion between
    model and reality, we talk of biological neural networks or nervous systems in
    connection with real animals. In this section we offer a brief introduction to
    neural network models; the next chapter covers them more thoroughly.


    The basic feature of neural network models is that they are inspired by biological
    neural networks. As an illustrative example, Figure 1.8 portrays part of the nervous
    system of a crayfish. It consists of neurons connected together, often in a way
    that is consistent across individuals, forming a network of interacting cells.
    Some neurons are *receptors*; i.e., they transform physical stimuli such as oscillating
    air pressure (sound) into electrical or chemical signals that are communicated
    to other neurons. Other neurons are *effectors*; i.e., they represent the output
    of the nervous system to the body. Some effectors are connected to muscles (motoneurons),
    whereas others secrete chemicals that affect other cells in the body. Neurons
    that are neither receptors nor effectors are generically called *interneurons*.
    Obviously, their organization is of paramount importance for nervous system operation.'
