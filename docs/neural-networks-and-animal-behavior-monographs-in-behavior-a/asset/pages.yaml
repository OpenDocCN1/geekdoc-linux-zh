  md: 'models for this ability. One model stores the ant’s position in Cartesian coordinates,
    the other in polar coordinates (Figure 6.4). In the figure we have also sketched
    a network model for this problem. For the sake of the argument, we assume that
    it can reproduce the ant’s behavior. Which model should we prefer? All do the
    job, which means that we cannot tell them apart by observing normal behavior.
    Perhaps we could experimentally fake the sun in impossible locations in the sky
    or introduce a second "sun" and see how both models and ants respond (note, however,
    that the cognitive models have no built-in mechanism for handling such unforeseen
    situations; the networks would at least do something based on the input they receive).
    We could also look inside the models. It is clear that the computational details
    are different. The network does not calculate sines and cosines but only weighted
    sums and transfer functions. The point of view of classical cognitive science
    would be that the models are identical at the computational level (i.e., they
    ultimately perform the same function; see below) and that the symbolic models
    would have to be preferred because they display the fundamental computation. Gallistel,
    discussing which cognitive model to prefer, suggests that the Cartesian model
    is more robust than the polar model when small errors are introduced. The network,
    on the other hand, probably could be made even more robust and have a richer set
    of states to describe the ant’s current position relative to the home burrow.
    The cognitive models, on the other hand, are potentially easier to understand,
    and they show clearly that the information available to the ant is sufficient
    for dead reckoning to be logically possible.


    # **6.4.4 Evolution**


    We must also ask how cognitive models and neural networks relate to evolution.
    Neural networks are a framework of great generality, capable of implementing practically
    any behavior map, and within which small changes usually have small effects. These
    properties may offer an understanding of how a behavior system can change and
    improve gradually during evolution (see Section 5.2.4). Cognitive models, on the
    other hand, usually focus on the end point or optimal solution to an evolutionary
    problem, and the structure of the model is not general but specific to that particular
    problem (apart from falling within the broad framework of symbolic computation).
    Consider again Gallistel’s model of dead reckoning in the desert ant (Figure 6.4).
    It is difficult imagine how the model looked before it got its final form and
    how it evolved from less perfect mechanisms. The main problem is that the model
    does not explain how the ant brain actually implements the assumed computations.
    Marr (1982), in his influential book, *Vision*, often cited as the most complete
    cognitive manifesto, argued that the operation of any intelligent mechanism (including,
    e.g., nervous systems and computers) should be understood at three levels. The
    highest level is the computational level of abstract problem analysis. It is followed
    by the algorithmic level, which is concerned with defining a particular formal
    procedure to solve a given problem. The last level concerns the physical implementation
    of the algorithm. An important aspect of this subdivision was that issues relating
    to a higher level were claimed to be independent of issues at lower levels (for
    a similar view directly concerned with animal behavior, see'
