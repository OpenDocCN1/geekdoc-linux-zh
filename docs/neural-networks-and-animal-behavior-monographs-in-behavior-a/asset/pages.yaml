  md: 'Second, neural network models can be used in simulations of evolution, as shown
    later in this chapter.


    # ### 5.3.3 The role of behavior mechanisms in evolution


    Earlier we saw that the basic design of behavior mechanisms provides a lot of
    potential for the evolution of behavior, but it is also likely that such mechanisms
    have biases and constraints that can influence evolution (Binmore 1987; Dukas
    1998a; Maynard Smith 1978; Maynard Smith et al. 1985; Stephens & Krebs 1986).
    There are at least two ways in which this may happen. First, mechanisms able to
    implement efficient behavior may not come cheap: if a mechanism is too costly
    to build and maintain, it will not be favored in evolution (Kamil 1998). Second,
    and the subject of this section, limitations and biases in information processing
    may make some behavior impossible or difficult to implement, or they may bias
    evolution in certain directions rather than others (Dawkins 1982; Dukas 1998b;
    Maynard Smith et al. 1985; Stephens & Krebs 1986). There are several reasons to
    expect such constraints and biases. A behavior system is subject to many demands.
    Selection is likely to favor a system that handles many situations efficiently,
    perhaps at the expense of perfection in particular cases. In addition, some shortcomings
    may derive from basic features of design that in practice cannot change (e.g.,
    that the nervous system consists of interconnected cells). This argument may also
    apply to particular levels of organization. For instance, a reptile brain may
    lack some innovations that prevent reptiles from developing a behavior that is
    possible in, say, birds. Unfortunately, the importance of any of these factors
    in evolution of behavior is not fully understood. We now consider some features
    of neural networks that may contribute to understand how biases and constraints
    of nervous systems may influence evolution.


    The most general biases and constraints are likely to emerge from the basic principles
    of network operation. Perhaps the most important principle is about how external
    stimuli, other motivational factors and memory interact to produce responses.
    In our models, the response of a node is an increasing function of the weighted
    sum of inputs:


    ```

    \( z = f\big( \sum_i W_i x_i \big) \) (5.1)

    ```


    We referred to this weighted sum earlier as the *overlap* between the weight vector
    **W** and the input vector **x** (Section 3.3). This calculation is a cornerstone
    of neural network models. The simplest network (receitors connected to one output
    node) involves only one overlap calculation, whereas in more complex networks
    (more outputs or layers, recurrence) responses are generated from many such calculations.
    Important features of the overlap are that it maps an arbitrary number of inputs
    onto one output and that it generalizes spontaneously (similar inputs yield similar
    outputs; Section 3.3). Moreover, by adjusting the weights, even a single overlap
    calculation can implement many input-output maps. Indeed, we saw in previous chapters
    that simple networks based on this computational principle can reproduce a host
    of behavioral phenomena. The latter often make apparent what'
