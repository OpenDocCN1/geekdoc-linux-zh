    & Cooper 1995; Kandel et al. 2000). By local factors we mean quantities that are
    naturally available at the synapse between two neurons. These include, for instance,
    the current strength of the synapse and the activity (or other state variables)
    of the pre- and postsynaptic neurons. By global factors we mean signals than bring
    to the synapse information that originates elsewhere in the network. Important
    aspects of a global factor are what neuron populations are affected and whether
    the factor affects each weight equally or has a more specific pattern of action
    (see below). Note that the terms *global* and *local* refer here to the *origin*
    of learning factors. All factors that influence a synapse ultimately must be “local”
    in the sense that they must be physically present at the synapse.


    The need for global factors arises from the fact that, in many cases, the information
    needed for successful learning is not naturally present locally. Behavioral data
    clearly demonstrate that local factors alone cannot be responsible for all types
    of learning. For instance, in the T maze in Figure 4.1, the crucial information
    is about which choice of arm leads to food. For learning to occur, the consequence
    of actions must be evaluated according to whether they lead to food, but this
    evaluation cannot take place entirely at the synapses that connect stimuli with
    responses. It is also clear that local and global factors need a suitable time
    structure. For instance, instrumental conditioning occurs only if rewards closely
    follow responses (see below).


