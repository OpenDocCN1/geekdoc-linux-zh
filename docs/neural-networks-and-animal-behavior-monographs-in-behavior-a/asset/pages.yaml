    # ## 3.2 BUILDING NEURAL NETWORK MODELS


    The aim of this chapter is to show how neural networks allow us to model all the
    various kinds of state variables considered above. In brief, external stimuli
    and body states are treated as identical and influence the network via input nodes
    that model external and internal sense organs. Regulatory states can arise from
    feed-back loops within the network that can build persistent activity in some
    nodes. Additionally, special variables may be included to model regulatory states
    other than nervous activity (e.g., hormones). Memory corresponds naturally to
    connection weights (we recall that in motivational models memory is considered
    as fixed parameters, whereas in models of learning and ontogeny memory is a state
    variable that can change, see Section 1.1).


    # ### 3.2.1 An introductory example


    In practice, building a neural network model includes choosing a network architecture,
    setting network weights and testing the model. To connect the model with reality,
    we also need an interpretation of input and output nodes. That is, we must know
    how to translate physical stimulus situations (including body states) into network
    inputs, and we must be able to decide whether network output agrees with observed
    behavior. To illustrate these topics, we start with a simple example that shows
    how a neural network can model a specific behavior: the discrimination between
    two visual stimuli. The latter are a cross and a rectangle, and the network should
    respond only to the cross. This can be accomplished by a feedforward network,
    as shown in Figure 3.2. The first part of the network is a model retina of 5 ×
    5 nodes on which the cross and the rectangle can be projected. The activity of
    input nodes is fed to a layer of 10 hidden nodes (the figure shows only 3 for
    simplicity), each connected with all input nodes. The network is completed by
    an output node connected with all hidden nodes. The activity of the output node
    is interpreted as the probability that the network responds to the stimulus.


    Although there are only two stimuli, the problem is not trivial because the same
    stimulus can yield many different input patterns. Figure 3.3 shows some retinal
    images obtained by projecting the cross in different positions on the retina.
    In most cases, the cross shape is blurred. Despite these complications, a network
    that responds to cross images but not to rectangle images can be obtained rather
    easily with the weight-setting algorithms introduced in Section 2.3, e.g., back-propagation
    or random search. We use the latter exactly as described in Sections 2.3.3 and
    2.5.3. The result is a behavior map that can respond properly to two kinds of
    stimulation, as shown in Figure 3.4.


    This simple example already hints at several important features of neural networks.
    One feature, already stressed a number of times, is the natural interpretation
    of the network as a model nervous system, comprising all steps from stimulus'
