    # 5.4.4.4 Complexity


    Based on the comparison between the look-up table and the smarter network, we
    may ask whether the behavior mechanism can be made so “intelligent” as to effectively
    abolish manipulation and restore the predictions of game theory. Will a more refined
    mechanics be better at avoiding manipulation? Perhaps, but the evolutionary consequences
    of intelligence may be mixed. For instance, to solve a problem with greater accuracy
    a more complex mechanism is usually needed. For example, eyes with more receptors
    allow for more accurate discrimination. How does such increased complexity affect
    reactions to novel stimuli? Are humans less susceptible to manipulation than,
    say, a snail? One may think that if a more complex mechanism evolves, it will
    inevitably be better than the mechanism from which it evolved. For example, one
    may add a bias-correcting device to the original mechanism. But such a new mechanism
    also will have its own biases. In general, while added complexity may function
    well in solving currently existing problems, it will not necessarily work better
    when faced with new problems. In fact, the opposite may be true because as complexity
    increases, the number of different stimuli the organism can perceive is also likely
    to increase, as well as the number of physiological and biochemical processes
    that are open to interference (Figure 5.10). An increase in complexity may also
    allow qualitatively different stimulation to be effective. For example, the ability
    of a mechanism to recognize patterns in time may favour signals that are variable
    in time over constant signals (Wachtmeister & Enquist 2000).'
