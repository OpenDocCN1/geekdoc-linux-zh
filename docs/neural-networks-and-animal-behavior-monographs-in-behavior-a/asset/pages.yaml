    In conclusion, traditional ethological and animal psychological thinking contains
    a number of seeds to neural network models, but the development of neural network
    theory has occurred mainly outside these disciplines. Neural network models still
    have not gained broad popularity in animal behavior research, but there is today
    a growing interest in neural networks, particularly among animal psychologists.


    # 1.4.4 The diversity of network models: Our approach


    To apply neural networks to animal behavior, we need to decide which particular
    models to use. This is not always easy. Neural network models come in many forms
    and purposes. There are biologically or psychologically motivated models with
    aims ranging from the very details of neural mechanisms to the highest mental
    functions in humans. There are models aimed primarily at machine intelligence
    and engineering applications with little concern for biological realism. The latter
    nevertheless can be of interest to modeling animal behavior for practical and
    theoretical reasons. In this book we try to use simple networks as long as they
    can account for the behavior we investigate. There are a number of reasons for
    this approach. First, complexity should not be introduced prematurely and without
    reason. We could try to include from the start all known details of nervous systems,
    but this would result in a model as difficult to understand as the real system.
    The only way to understand a complex structure is to start by abstracting pieces
    from it or study simplified models that are more readily analyzed. The crucial
    test of a simplified model is the extent to which it captures essential features
    of the behavior of real animals. If it does, then the fact that the model is neurally
    inspired rather than based on some other metaphor should be considered a bonus
    rather than a hindrance.


    Second, we need models of animal behavior that are easy to understand and practical
    to use. We also need for general models as opposed to specific to a particular
    behavior and a particular species. The subject of animal behavior covers species
    with a nervous system made up of a few cells to the complexity of primate brains,
    and we know that many behavioral phenomena are surprisingly general.


    Third, the differences between network models should not be exaggerated. Starting
    from a simple model such as Rosenblatt''s *perceptron*, we can add complexity
    gradually and in several ways. For instance, we can add more layers of nodes,
    recurrent connections and more complex node dynamics. We thus can obtain complex
    models gradually from simple ones and study how their properties change in the
    process. This is also relevant when studying the evolution from simple to complex
    behavior (Chapter 5).


    In practice, our approach means that multilayer feedforward networks operating
    in discrete time are our first choice of model. Indeed, most applications of neu-'
