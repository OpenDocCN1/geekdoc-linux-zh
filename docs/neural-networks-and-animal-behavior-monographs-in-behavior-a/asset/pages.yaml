- pgno: 127
  md: 'Neural networks allow us to address mechanism in addition to function. We have
    seen that simple neural networks can take decisions and maintain homeostasis without
    explicit consideration of thresholds or decision boundaries. Although neural network
    models of decision making are not well developed, we hope to have shown that they
    can potentially integrate results from control theory and ethology. Presently
    it is difficult to see whether a substantial amount of new knowledge will be generated
    or whether neural networks will simply be a more biologically realistic implementation
    of already known ideas. It is possible, however, to hint at several areas where
    neural network models could be particularly useful.


    Reactions to stimuli and decision making have often been considered separately.
    Note, for instance, that the control models in Figure 3.33 do not consider how
    the animal knows whether water is there or not. Neural networks can integrate
    mechanisms of reactions to stimuli with decision making. For instance, we may
    study why some stimuli are more effective than others. Such an integrated model
    of the processes from stimulus reception to decision making might also help us
    to understand why the nervous systems sometimes commands nonfunctional behavior.


    By providing a concrete implementation, neural networks also allow rigorous tests
    of intuitive ideas. For instance, one mechanism suggested to prevent dithering
    (rapid oscillation between activities) is a kind of short-term positive feedback.
    In other words, when an activity gains control, it is assumed to receive a “boost”
    in motivation to counter the possible decrease in relevant motivational factors
    (McFarland 1999). However, we have seen in Section 3.7.3 that decisions taken
    by mutual inhibition (another traditional idea) are already rather stable without
    any additional mechanisms.


    # ## 3.8 MOTOR CONTROL


    By *motor control* we mean how the nervous system and the skeleotomuscular apparatus
    contribute to behavior. It is well established today that motor control is exercised
    by circuits within the central nervous system, called *central pattern generators*,
    that produce autonomous motor patterns, usually in combination with central and
    peripheral control based on sensory feedback (Cohen & Boothe 2003; Dean & Cruse
    2003; Hinde 1970; Lorenz 1981). The idea of central pattern generators seems to
    have been suggested first by Graham Brown in 1918, who showed that cats deprived
    of sensory inputs could still produce coordinated stepping and even suggested
    a possible neural mechanism (Hill et al. 2003). However, some time passed before
    this view was accepted because early ideas about motor control were inspired by
    the view of animals as reactive, reflex-driven machines. Motor patterns were explained
    as chains of reflexes in which each movement creates appropriate sensory stimuli
    to elicit the next movement. For instance, walking was explained as a succession
    of reflexes triggered by changes in leg position, loading, and equilibrium signals
    during the step. We are not aware of any attempt to verify if such an arrangement
    could actually work, and empirical research has rejected this idea (Dean & Cruse
    2003). Erich von Holst was among the first to establish neurological evidence
    for central pattern generators (Von Holst 1937, reprinted in von'
