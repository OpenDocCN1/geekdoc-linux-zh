    number. The mutants and the initial network then are evaluated by means of a performance
    measure (often called *fitness*). The latter has been constructed so that it is
    maximized by desired behavior. The network yielding the highest performance is
    retained, and the process of mutation, evaluation and selection is repeated until
    a network capable of satisfactory performance is obtained or until one suspects
    that this will never happen. The basic algorithm can be modified in several respect,
    e.g., retaining more than one network from one iteration to the next or using
    different ways of generating mutants (which may include, e.g. changes in network
    architecture and node properties).


    To illustrate random search, we consider our example task, using equation (2.15)
    with a logistic transfer function (equation 2.7). We need to define a performance
    function that reaches its maximum value when the task is solved. Since network
    output is limited between 0 and 1, the quantity $|d_a - r_a|$ (absolute value
    of the difference between the actual and the desired output for a given input-output
    mapping) can vary between 0 and 1, with 0 being its desired value. Hence the desired
    value of the quantity $1 - |d_a - r_a|$ is 1, and this quantity increases as $r_a$
    gets closer to $d_a$. If we need to establish two input-output mappings, we can
    define a performance function as follows:


    ```

    $$ p(\mathbf{W}) = \sqrt{(1 - |d_1 - \mathbf{r}(\mathbf{x}_1)|)(1 - |d_2 - \mathbf{r}(\mathbf{x}_2)|)}
    $$

    (2.48)

    ```


    (the square root lets $p(\mathbf{W})$ increase at a similar rate over its entire
    range). The maximum value of $p(\mathbf{W})$ is 1 and is reached only if $r_1
    = d_1$ and $r_2 = d_2$. Equation (2.48) can be generalized easily to an arbitrary
    number $\mu$ of input-output mappings:


    ```

    $$ p(\mathbf{W}) = \sqrt[\mu]{\prod_{a=1}^{\mu}(1 - |d_a - \mathbf{r}(\mathbf{x}_a)|)}
    $$

    (2.49)

    ```


    Figure 2.11 shows the results from a simulation using the simplest random search
    algorithm, whereby a single mutant network is generated at each iteration. Compared
    with gradient descent (Figure 2.10), progress on the task is more irregular.'
