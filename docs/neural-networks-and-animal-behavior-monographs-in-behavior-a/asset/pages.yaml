- pgno: 87
  md: 'For instance, yellow appears to us as a color that cannot be split into components
    but actually is perceived by integrating signals from three kinds of photoreceptors.
    Figure 3.3 is a further example of how difficult it is to make sense of signals
    from receptors.


    The analogy between neural networks and nervous systems encourages us to consider
    perception in more detail. We will use the term *receptor space* to mean a network
    input space built with consideration of how sense organs receive stimulation.
    Most of the results below depend on a degree of realism in the construction of
    network inputs, but building a receptor space that models a given physical situation
    adequately is not always trivial. A basic fact is that only those aspects of physical
    stimuli that can be received can influence behavior. For instance, some animal
    species can perceive ultraviolet light, whereas others cannot. If we consider
    only the physical properties of light, we cannot understand why just some species
    can discriminate between light that differs only in its ultraviolet component.
    In general, we need to consider the sensitivity of individual receptors to physical
    characteristics of stimuli, as well as the arrangement of receptors in sense organs.
    Note also that thinking about receptors includes naturally the *index/context*
    in which a stimulus is presented as part of the stimulation received by the animal:
    a change in context is modeled simply as a change in stimulation.


    Studies of sensory physiology reveal both similarities and differences between
    the senses of different animal species (Coren et al. 1999; Gegenfurtner & Sharpe
    1999; Goldsmith 1990; Warren 1999; Zeigler & Bischof 1993). It is possible to
    highlight some basic similarities that can be used to build simple yet general
    models of how stimuli activate sense organs (see also Figure 2.2):


    +   * A receptor is usually maximally sensitive to a particular value along a
    stimulus dimension (e.g., light wavelength or sound frequency); receptor activity
    declines in an orderly fashion as physical stimulation departs from the value
    of maximum sensitivity.

    +   * One important exception is intensity dimensions: when a physical stimulus
    increases (decreases) in intensity, the activity of receptors sensitive to the
    stimulus also increases (decreases).

    +   * Since receptors have different characteristics (even within one sense organ),
    a given stimulus usually elicits a distributed activity pattern, with some receptors
    activated strongly, some mildly and some negligibly.

    +   * Even when stimulation is seemingly lacking, receptors usually are slightly
    active rather than being entirely silent (e.g., sound receptors in a quiet room).


