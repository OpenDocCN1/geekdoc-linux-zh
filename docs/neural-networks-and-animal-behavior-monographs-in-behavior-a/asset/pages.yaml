  md: '# 3.4 SENSORY PROCESSING


    The simple models analyzed so far do not show any clear separation between sensory
    processing and decision making. In two-layer feedforward networks, sensory processing
    and decision making come "as one package," whereas adding a third layer introduces
    some potential for separation. In nervous systems, except perhaps the simplest
    ones, neural layers immediately after receptors hold sensory information, whereas
    decision making occurs further away from the sense organs (Ewert 1980, 1985; Kandel
    et al. 2000; Simmons & Young 1999). In other words, a part of processing is independent
    of how the animal will ultimately react to the stimulus. Figure 1.8 illustrates
    a case with minimal sensory processing, whereas the processing of visual stimuli
    in humans is an extreme case in the other direction, built on many layers and
    with many parallel processing pathways (Kandel et al. 2000).


    Why aren''t decisions made directly based on information from sense organs? At
    first, this may sound paradoxical. All sensory information that the organism has
    available is already present at the level of receptors. Indeed, sensory processing
    leads to a decrease in information in the technical sense. The trick is that the
    activity patterns of receptors are transformed into patterns of activity in subsequent
    layers that are more useful for decision making (Haykin 1999). In fact, many properties
    of the real world are poorly represented by receptor activities. The same object
    can give rise to very different patterns of activity, wrongly suggesting that
    such patterns arise from different objects (Figure 3.3). Complex discriminations,
    such as the XOR problem encountered in Section 2.2.1.1, are also cases that benefit
    from processing of input patterns.


    In neurophysiological studies, many kinds of sensory processing can be found.
    Lateral inhibition is one example, whereby information about changes in stimulation
    is made available for decision making or further sensory processing. An important
    concept is that of receptive fields (Kandel et al. 2000; Simmons & Young 1999).
    This term refers to the part of a sense organ (or any other neural layer) where
    stimulation can excite a cell in a subsequent layer. For instance, a neuron might
    react only to stimulation falling on a restricted part of the retina, which thereby
    is called the neuron''s receptive field. In a more abstract sense, receptive field
    may also refer to those input patterns able to excite a neuron. Many kinds of
    receptive fields have been found in nervous systems (Hubel 1988; Kandel et al.
    2000). A famous example is orientation-sensitive cells in the cat''s visual cortex,
    discovered by Hubel and Wiesel (1962). Each of these cells is sensitive to the
    orientation of a line projected on a small portion of the retina, being maximally
    responsive to lines in a particular orientation.


    # 3.4.1 Processing by lateral connections


    Lateral connections are a particular form of recurrence that takes place between
    nodes in the same layer (Figure 3.14). Lateral connections, as well as feedforward
    and feedback ones, are clearly identifiable in nervous systems. Indeed, connections
    internal to an anatomically identifiable group of neurons is often more abundant
    than connection between different groups of neurons, e.g., in the cortex (Kandel'
