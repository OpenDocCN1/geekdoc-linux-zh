    particular courses (flying straight, turning, approaching the ground, etc.) create
    global movement patterns over the whole visual field, referred to as $flow$ $fields$
    (Simmons & Young 1999; Figure 3.20). For instance, in an animal with laterally
    placed eyes, moving straight produces the same flow field on both eyes, whereas
    turning produces opposite flow fields. Thus flow fields are an interesting example
    of a transformation from sensory information scattered over many receptors into
    simpler dimensions on which decisions can be taken more easily.


