    and the nature of the event paired with the stimulus, see Section 4.5). In systems
    theory terminology, equation (1.7) is a state-transition equation with associative
    strength as the state variable. To translate state into behavior, it is further
    assumed that the likelihood of responding to the stimulus is an increasing function
    of *V*:


    *Pr*(response) = *f*(*V*)


    In other words, *V* can be regarded as a tendency to respond. Note that this is
    the same problem of linking state to behavior that we discussed earlier in connection
    with motivational states.


    An interesting application of these models deals with the relative influence of
    several different stimuli on behavior. If stimulus 1, stimulus 2, and so on are
    present simultaneously, their total associative strength is assumed to be the
    sum of the associative strengths of the individual stimuli:


    *V*<sub>TOT</sub> = Σ<sub>*i*</sub> *V*<sub>*i*</sub>


    where *V*<sub>*i*</sub> is the associative strength of stimulus *i*, and the sum
    extends over all stimuli present on a given experimental trial. *V*<sub>*i*</sub>
    changes according to


    Δ*V*<sub>*i*</sub> = *η*(λ − *V*<sub>TOT</sub>)


