    of detailed models. If neural network models are to fulfill their promises, the
    future will contain simple, intuitive, general and practical models, as well as
    detailed models closer to real nervous systems.


    # # CHAPTER SUMMARY


    +   * “Behavior” is a legitimate level of analysis. It has theoretical importance
    in ethology, psychology, behavioral ecology and evolutionary biology and practical
    importance to many people working and living with animals in zoos, veterinary
    clinics, farms, etc.

    +   * Explaining behavior includes understanding how motivational factors control
    responding, how behavior develops during an individual’s lifetime and how evolution
    shapes behavior. Understanding of actual internal processes may also be important.

    +   * Most attempts to understand animal behavior have inferred models from behavioral
    observations and functional considerations. This is true for most of ethology,
    experimental psychology and cognitive psychology. A major exception is neuroethology,
    which studies how nervous systems generate behavior.

    +   * Neural network models offer a potential to develop models of behavior that
    are informed not only by behavioral observations but also by the actual structure
    of nervous systems. Can this result in increased knowledge about behavior? Our
    aim is to explore this question.

    +   * We have also touched on some fundamental issues about how to model behavior,
    from neurophysiology to “cognition.” One important issue is how to deal with animals’
    internal states. We will return to these issues throughout this book and in the
    concluding chapter.


