    (including receptors and effectors) and rules of weight change.

    +   - Neural network models can thus show the links between genetic evolution,
    nervous system evolution and the evolution of behavior. Today this research is
    by necessity somewhat speculative because we do not understand fully how genes
    code for nervous systems.

