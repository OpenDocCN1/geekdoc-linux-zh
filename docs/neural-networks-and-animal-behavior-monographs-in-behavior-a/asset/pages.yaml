    The reason for distinguishing between states of the nervous system and body states
    is that the latter can be treated similarly to external stimuli. Both external
    stimuli and body states, in fact, influence behavior via specialized receptors
    that transform various physical realities into neural activity. Internal senses,
    indeed, are as many as or more than external ones. Table 3.1, for instance, lists
    the senses known to exist in humans: more than half are internal. Modeling external
    stimuli and body states amounts thus to knowing how external and internal conditions
    stimulate the relevant sense organs. Just as not all sense are external, the nervous
    system does not produce only overt behavior. Internal responses include the control
    of internal organs and the secretion of hormones by specialized nerve cells. The
    conceptual components of behavior systems introduced so far are summarized in
    Figure 3.1.


    Memory and regulatory states differ from body states in one crucial aspect: their
    function is solely to regulate behavior. A body state such as water volume does
    influence behavior, but first of all water is there because of the physiology
    of the organism. States of the nervous system are important because they allow
    storage of information and structuring of behavior in time. Without them, behavior
    would be totally controlled by current input from the senses. For instance, responding
