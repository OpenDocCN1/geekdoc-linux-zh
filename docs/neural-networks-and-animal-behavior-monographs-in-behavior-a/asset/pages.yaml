- pgno: 107
  md: 'count is valid but incomplete. A more general description is that sensory processing
    transforms input patterns into patterns of activity in successive neural layers.
    Such transformations do involve "filtering out" (i.e., making neurons relatively
    insensitive to some stimuli or stimulus dimensions) but also have similarities
    with, for instance, principal component analysis and other signal analysis techniques
    (Field 1995; Haykin 1999). This includes emphasizing some stimulus dimensions
    at the expense of others, as well as building new dimensions that are not apparent
    in the raw input.


    Stimulus filtering is often thought to be accomplished by "feature detectors,"
    i.e., neurons that respond solely if a stimulus has a particular feature (Figure
    3.13; Simmons & Young 1999). In ethology, the concept was linked to the idea that
    animals respond based on "sign stimuli" identified by a particular feature or
    combination of features (Lorenz 1981; Tinbergen 1951). Figure 3.13 is a classical
    example. The idea that recognition in general is based on feature detectors is
    still a matter of lively debate in psychology and cognitive science (Field 1995;
    Schyns et al. 1998). Rolls and Deco (2002) show several network models based on
    feature detectors. It is clear from previous sections, however, that neural networks
    are very capable even without any feature detectors. This does not exclude the
    possibility that, in networks with three or more layers, patterns of processing
    may emerge (from training or evolution) that can be described as "feature detectors"
    (e.g., Kohonen 2001). However, these do not fully resemble the classical idea
    of, say, line and edge detectors. One example (borrowed from Arbib et al. 1998)
    comes from studies of the frog retina. Letvin et al. (1959) classified retinal
    ganglion cells (whose axons form the optic nerve) into four types. Type 3 cells
    were described as responding to small moving objects, and it is tempting to call
    them "prey detectors." A better description, however, is that these cells respond
    to a moving edge entering their receptive field, not to the presence of a prey
    within the receptive field. Further processing in the brain determines whether
    the frog snaps at the moving object or not. Similarly, cells of type 4 are better
    described as measuring dimming of the visual scene than as "predator detectors"
    (the link here is that predators coming from above often cast a shadow over the
    frog).


    In conclusion, we think that a better description of sensory processing is that
    it makes relevant information available to decision making and control of behavior.
    The receptive fields that have been found in network models and nervous systems
    seem to differ from the classical idea of feature detectors in several respects.
    First, they tend to be more general purpose. Type 3 cells in the frog retina,
    for instance, are important in the processing of all kinds of visual stimuli,
    not prey only. Second, they are not as sharply tuned. For instance, a "line detector"
    will react to various extents to many kinds of objects, although lines might be
    those stimuli to which the cell responds the most. Lastly, perceptual learning
    and other findings suggest that the nervous system may be more dynamic than implied
    by the idea of a fixed set of feature detectors (Chapter 4; Schyns et al. 1998
    and following commentaries).'
