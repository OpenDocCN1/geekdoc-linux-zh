    link a stimulus and a response (Guthrie 1935; Hull 1943; Mackintosh 1974), with
    stronger association yielding stronger responding. However, associations between
    stimuli have also been suggested. Classical conditioning, for instance, has been
    modeled as the building of an association between the CS and US rather than between
    the CS and the response (Mackintosh 1974; Pearce 1997; Tolman 1949). There are
    indeed empirical findings that support both types of associations (see, e.g.,
    Pearce 1997). We will not review this debate here; our purpose is rather to compare
    some of the existing ideas with what neural networks models suggest.


