    # 3.2.5 The receptor space


    Based on our subjective experience, it is tempting to assume that animals simply
    know what stimuli are there and have direct access to characteristics such as
    color, size and distance. Some models of behavior actually make similar assumptions
    (see Section 3.3.3). However, perception is often more complex than it seems.'
