    # 3.8.1 The analysis of behavior patterns


    Classical ethological theory of motor control was based on two concepts: *fixed
    action patterns* and *taxes* (Hinde 1970; Lorenz 1935, 1937; Tinbergen 1951).
    A fixed action pattern is, once elicited, generated within the animal and not
    guided by any sensory information. A taxis, on the other hand, is an orienting
    motor component controlled by sensory information. In terms of control theory,
    these concepts separate motor mechanisms that use sensory feedback from those
    that do not (McFarland 1971; see also Figure 1.6 on page 13). The classical example
    of a behavior with both a fixed action pattern and a taxis component is egg retrieval
    in the greylag goose (Figure 3.34). Ethologists also observed that fixed action
    patterns seem to be inborn, i.e., to develop without any specific experiences
    (Berridge 1994). In his famous study of courtship behavior in ducks, *Lorenz*
    (1941) even showed that such patterns seem as constant and species specific as
    skeletal bones and that they could be used to detect phylogenetic relationships.
    A remarkable example of such constancy is the "head throw" display of the goldeneye
    duck (*Bucephala clangula*), having a mean duration of 1.29 s and a standard deviation
    among individuals of only 0.08 s (Dane et al., 1959).


    Classical ethology defined fixed action patterns solely by the absence of a role
    of external stimuli in controlling the form of the behavior (Hinde 1970). This
    did not exclude the possibility of sensory feedback from receptors inside the
    animals, such as proprioceptors that provide information about muscle tension
    (Figure 3.35). In other words, although the idea of a centrally generated pattern
    got most attention, the importance of sensory feedback was also acknowledged.
    The view that'
