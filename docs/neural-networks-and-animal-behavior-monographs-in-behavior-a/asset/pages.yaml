  md: '# Chapter Four


    # Learning and Ontogeny


    This chapter deals with the ontogeny, or development, of behavior. Many factors
    and processes interact in behavioral development. Particularly important are those
    that create the nervous system and those that govern learning. The latter are
    here given special attention owing to their importance for behavior. We begin
    by discussing what learning and ontogeny are and how they relate to each other,
    to behavior and to the nervous system. We continue with a detailed section on
    neural network models of basic learning processes, such as classical conditioning.
    Learning is an extensively developed topic that we cannot cover in full. Our only
    intention is to show how neural network models can be applied to the study of
    learning. The chapter ends by considering the ontogeny of behavior in its broad
    sense.


    # 4.1 WHAT ARE LEARNING AND ONTOGENY?


    In Chapter 3 we considered what causes behavior to occur at a given moment, or
    how behavior mechanisms operate here and now. The behavior map was fixed, and
    we studied how stimuli and other motivational variables cause behavior. Memory
    (connection weights) and network wiring did not change. We started by asking how
    the presence of a peahen causes, or motivates, courtship behavior in a peacock.
    Whether the peacock courts or not depends on stimulation picked up by sense organs,
    in this case the eyes, on recognition mechanisms that are capable of determining
    whether a female is present or not and on internal variables such as hormone levels.
    The question was how all these factors operate and how they interact to cause
    behavior. When we consider ontogeny, we ask a different question: we want to know
    how a particular mechanism (behavior map) becomes established during an individual’s
    life and how experience and behavior are involved in this process (Chapter 1).
    In the peacock example, we want to know how the nervous mechanisms that allow
    female recognition become established in a peacock’s life.


    Ontogeny of behavior hosts many phenomena. Most researched is learning in its
    narrow sense, in particular, classical and instrumental conditioning (Mackintosh
    1974; Pearce 1997). Such phenomena, covered in Section 4.2, occur in response
    to changes in the environment and result in changes in how animals respond to
    stimuli. Although we dedicate to learning a specific section, it should be noted
    that learning is a part of ontogeny. Ontogeny in general refers to a diversity
    of processes starting very early in life and creating the behavioral machinery
    of the adult. There is a number of general issues in the study of ontogeny. How
    can the genes code for complex behavior, such as navigation in migratory birds?
    What is'
