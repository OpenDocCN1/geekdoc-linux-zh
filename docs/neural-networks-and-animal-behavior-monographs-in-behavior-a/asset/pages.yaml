    tential of improved sensory abilities. This would be much more difficult if large
    changes were required in the machinery downstream from the sense organs.


    In addition to flexibility, evolution also requires efficiency, meaning that the
    be- havior mechanism should be fast while being economical with resources such
    as receptors, nerve cells and connections. This is crucial to both simple and
    com- plex nervous systems and seems to follow naturally from a network architecture.
    Note that it is not obvious that a biological system should be fast. Physiological
    process are slow or very slow in comparison with, say, electronic processes. De-
    spite this, behavior systems are usually fast and can outperform computers in
    many tasks. The reason for this is that neural networks operate in parallel, i.e.,
    each node or neuron operates simultaneously with many others. Standard digital
    computers, by comparison, typically operate in a sequence, performing only a small
    number of operations at any given time. Consider, for instance, a three-layer
    feedforward network. The response to an input is determined in just two steps:
    the activity of input nodes causes the activity of inner nodes, which in turn
    causes output activ- ities. Each step comprises many operations, depending on
    the number of nodes and existing connections. Increasing the number of nodes or
    connections does not increase response time, but rather it increases the number
    of operations that are per- formed in each step. The result is still calculated
    in two steps. Compare this with, for instance, a decision tree, which operates
    sequentially and requires more time as the complexity of the problem (number of
    tree nodes to be examined) increases (Figure 5.1). In summary, parallel processing
    allows animals to react quickly to a range of problems and to recognize most objects
    at a glance. This is obviously an important benefit in situations that require
    rapid reactions. Similarly, economy with respect to resources is achieved by limiting
    the number of parts (connections and cells), using the same parts for many stimulus-response
    relationships (Figure 5.1). Despite this flexibility, neural networks and, it
    seems, behavior systems also have some limitations, addressed in Section 5.3.3.'
