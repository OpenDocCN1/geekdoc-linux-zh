    Figure 1.10 Rosenblatt’s (1958; 1962) perceptron, as depicted by Minsky & Papert
    (1969). Each $\varphi$ is assumed to be 0 or 1 depending on the result of a simple
    computation based on the state of a limited number of receptors. The summation
    unit $\Omega$ performs a weighted sum of the $\varphi$’s. If the sum is larger
