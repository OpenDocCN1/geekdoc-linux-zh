    # 5.4.4.1 The standard ESS solution


    Let us first solve the game as it stands. We have so far (deliberately) assumed
    that the reactor is the only player that has a choice of actions. The reactor
    strategy consists of two levels of effort, one to use when the actor is present
    and one when the actor is absent. We solve the game simply by finding the effort
    that maximizes the reactor''s payoff in these two cases. If the actor is present,
    the optimal effort is $x=0.5$. Actor and reactor then receive in return $0.5$
    and $0.25$, respectively. If the actor is absent, the optimal effort for the reactor
    is $x=0$. This solution is an equilibrium (no better response strategy exists),
    and it is also evolutionary stable because if the reactor''s strategy drifts away
    from the optimum, selection will return it to the optimal levels. We see that
    manipulation does not exist at the ESS. Indeed, manipulation can never be a part
    of an ESS because at equilibrium the reactor''s response must be the best one.
    Were it not, the reactor would have an incentive to change its strategy, and the
    system would not be at equilibrium.


    # 5.4.4.2 Many actor appearances and a look-up-table reactor


    The game just analyzed may seem so trivial as to not warrant a formal analysis.
    However, it nicely illustrates some of the problems of considering only equilibrium
    solutions (ESSs) and of simplifying too much. In reality, information about the
    presence or absence of the actor is not provided automatically to the reactor
    but must be inferred from sensory input. The presence or absence of the actor
    is detected by a mechanism that reacts to the stimulation or physical energy (e.g.,
    light or sound) that reaches the reactor. The actor must be recognized even when
    viewed from different distances and angles, in different light conditions and
    against different backgrounds. We considered such problems at length in Chapter
    3.


    An additional complication for the reactor is that the actor may take on a variety
    of appearances (Figure 5.7). Because such appearances give rise to different patterns
    of stimulation, they may elicit quite different reactions from the reactor. In
    game theory, it is common to restrict, consciously or unconsciously, the number
    of strategies considered, e.g., by limiting the number of appearances to the minimum
    needed to convey the relevant information or by considering variation along a
    single dimension only. Furthermore, strategies available to players are prescribed'
