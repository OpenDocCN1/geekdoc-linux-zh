    Papert (1969), *Perceptrons*, The MIT Press.


    els, however, are also rooted in mathematics, theories for intelligent machines
    and philosophy (Crevier 1993; Minsky 1969; Wang 1995).


    The development of neural network models started in earnest in 1943 when Warren
    McCulloch and Walter Pitts described how arbitrary logical operations could be
    carried out by networks of nodes (so-called formal neurons) that could either
    respond or not respond to an input, computed as the weighted sum of the activation
    state of other nodes in the network (McCulloch & Pitts 1943). This way of computing
    the total input to a node has stayed in practically all later neural network models.
    An important aspect of McCulloch and Pitts’ work was that neural processing could
    be formulated mathematically. Six years later, Donald Hebb published his famous
    book, *The Organization of Behavior*, which, among other things, includes a theory
    of how connection strengths between nerve cells may act as memory and how such
    memory may change as a consequences of experiences (Hebb 1949). Perhaps the first
    full-blown neural network model was designed and simulated on computers by Frank
    Rosenblatt (1958, 1962). His “perceptron” is depicted in Figure 1.10. An important
    aspect of Rosenblatt’s work was providing the perceptron with a learning algorithm
    that allowed it to solve a wide range of classification problems, whereby each
    of many input patterns should be assigned to one of two categories. Bernard Widrow
    and Marcian Hoff further developed learning algorithms introducing a general procedure
    for training two-layer networks (Widrow & Hoff 1960), to be known later as the
    $\delta$ rule (Section 2.3.2).


    The early enthusiasm for neural network models was subdued in 1969 by Minsky and
    Papert’s book, *Perceptrons*, pointing out some severe limitations of perceptrons.
    Perceptrons cannot solve all categorization problems, and some that are solvable
    in principle are very hard to solve in practice (Chapter 2). The authors also
    suggested that multilayer networks would suffer from similar limitations, but'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'this turned out to be incorrect. Minsky and Papert also acknowledged that recurrent
    networks (with feedback loops) could be much more capable (Chapters 2 and 3) but
    did not discuss them for several reasons. One was a desire to compare parallel
    computers (i.e. neural networks) with traditional serial computers; recurrent
    networks have both serial and parallel elements and thus were set aside. The perceptron
    was also chosen for its relative mathematical simplicity, which made a comprehensive
    analysis feasible. The book is nevertheless very interesting and contains many
    insights about neural networks that may also apply to biological nervous systems.


    The 1980s saw a series of important publications that inspired a new wave of research
    into neural network theory and applications. Efficient learning algorithms for
    multilayer networks were made widely known, such as the now-celebrated back-propagation
    algorithm, and it was shown that multilayer feedforward networks could overcome
    some limitations of perceptrons (Ackley et al. 1985; Haykin 1999; Rumelhart et
    al. 1986). Recurrent networks were also studied, and it was described how information
    could be stored in recurrent networks (Amit 1989; Cohen & Grossberg 1983; Hopfield
    1982). Kohonen (1982) also published his results on self-organizing maps, showing
    how simple learning rules could organize networks based on experience without
    external guidance. Crucial to the diffusion of neural networks into cognitive
    psychology was the two-volume book, *Parallel Distributed Processing: Explorations
    in the Microstructure of Cognition* edited by James McClelland and David Rumelhart
    (1986; Rumelhart & McClelland 1986).


    To date, the study of artificial neural network has generated an extensive body
    of theory (*e.g.,* Arbib 2003; Haykin 1999). Neural networks have proved to be
    a powerful explanatory tool applied to a wide variety of phenomena such as perception,
    concept learning, the development of motor skills, language acquisition in humans
    and studies of amnesia and brain damage (Arbib 2003; Churchland 1995; Churchland
    & Sejnowski 1992; McClelland & Rumelhart 1986). Recent progress has occurred along
    several lines. One is the study of more powerful and/or biologically realistic
    network architectures, *e.g.,* recurrent networks that can handle time (Elman
    1990; Jordan 1986). Fundamental areas of research are how networks can be trained
    to solve a specific task and how they can learn from experiences without explicit
    supervision. From the present perspective, an important issue is the development
    of more biologically realistic learning mechanisms. Many methods for training
    networks are not realistic because they are external to the network rather than
    built into the network itself, but significant improvements have been achieved
    (Chapters 2 and 4). This is one area that needs more research, and it is important
    to recognize that besides all the progress, a number of issues remain to be resolved.
    Other areas in need of further research are, for instance, the genetic control
    of network development and how unrealistic retroactive interference (new learning
    destroying earlier memories) can be tackled (French 1999).


    The preceding sketch of the history of neural network models is, of course, far
    from complete. The development of neural network models, for instance, has also
    benefited from the gains in our understanding of neurophysiology. Examples are
    the discovery of receptive fields in visual perception (Hubel & Wiesel 1962) and
    the study of learning in invertebrates (Kandel et al. 2000; Morris et al. 1988).
    There are also engineering applications that are of potentially great interest
    to biology and be-'
