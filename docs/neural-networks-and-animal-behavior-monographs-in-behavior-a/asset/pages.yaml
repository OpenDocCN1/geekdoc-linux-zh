    # ## 3.7 CENTRAL MECHANISMS OF DECISION MAKING


    Decision making refers here simply to the fact that an animal takes one behavioral
    action rather than another without implying consciousness or intent (McFarland
    1999). A simple view is that a behavior is performed whenever relevant causal
    factors are present. But a second thought, as well as empirical observations,
    reveals that decision making is a more difficult issue (Hinde 1970; McFarland
    1999; McFarland & Sibly 1975). A basic consideration is that animals can usually
    do only one thing at a time, whereas causal factors for incompatible behaviors
    may be present at the same time. A hungry and thirsty animal might have both food
    and water available, but it cannot eat and drink at the same time. In general,
    many activities are necessary for survival and reproduction, but only one or a
    few can be performed at any given time. Decision making is thus about structuring
    behavior in time in a sensible way, taking into account both the animal’s internal
    state and external conditions (McFarland 1999). In this section we aim to show
    that neural networks have natural abilities for animal-like decision making and
    can embody a number of ideas that have been developed within ethology, psychology
    and control theory (for reviews, see Baerends 1982; McFarland 1999; Shellwworth
    1998; Toates 2001). We begin by considering how a single decision is influenced
    by the animal’s internal state, as well as by external stimuli, and then we consider
    decisions among activities.


    # ### 3.7.1 Behavior and body states (homeostasis)


    The previous sections considered very simple decisions. The only causal factors
    were external stimuli, and the decision was whether to respond or not. Our models
    of such decisions were networks with a single output node, whose activity was
    taken as the probability of responding. Here we continue to discuss such simple
    decisions, but we introduce body states (internal stimuli) as additional causal
    factors. Decisions between different activities are considered later.


    Both body states and external stimuli are sensed by means of specialized receptors
    (Table 3.1). Thus to model body states we do not need new concepts but rather
    some knowledge of how they are sensed. One crucial difference, however, is that
    body physiology requires that variables such as water volume, body temperature,
    blood glucose level, etc. be maintained within strict bounds for life to continue.
    This is referred to as achieving homeostasis, and often behavior plays a crucial
    role. For instance, moving between sunlight and shade is a powerful way to regulate
    body temperature, on which animals such as reptiles rely extensively.'
