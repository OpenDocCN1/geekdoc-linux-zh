- pgno: 7
  md: '# Preface


    The aim of this book is to explore the potential of neural network models to explain
    animal behavior at the motivational, ontogenetic and evolutionary levels. Our
    focus is on understanding behavior based on principles of operation of nervous
    systems. Ethology, psychology and behavioral ecology have produced a large body
    of theory of behavior, but it is generally not formulated in terms of operation
    of the nervous system. The latter can be achieved, we will argue, with neural
    network models. We will focus on general principles rather than analyzing in detail
    specific nervous systems or neural structures. Thus, although nervous systems
    exhibit bewildering complexities, we will avoid them for the most part. The reason
    is that we want to explore how much understanding and predictive power can be
    gained by introducing general and basic consideration of nervous systems into
    models of behavior. There are also practical reasons for this choice. First, while
    empirical knowledge of nervous systems is increasingly detailed, we often do not
    know whether a given detail reflects a general and important principle or a less
    important contingency. Hence we prefer not to include too much detail before we
    have understood more general issues. Second, it is unlikely that we will ever
    know in detail the nervous system of more than a few species. Thus a useful theory
    of behavior should abstract as much as possible from features of particular nervous
    systems. Indeed, nervous systems differ in many respects across taxa (say, insects
    and mammals). If general principles of behavior exist, they must emerge from something
    other than either the gross architecture of the nervous system or its fine details.
    It is possible that our hopes will not be fulfilled and that simple neural networks
    may not prove satisfactory models of behavior. We keep an open mind on this possibility.
    This book will not decide this matter, but hopefully it will show that further
    exploration of neural network models of behavior is worthwhile.


    Our models will try to include (usually in simplified form) features that are
    common to most, if not all, nervous systems. The foremost such feature is, of
    course, that nervous systems are made of neurons wired together. We also will
    consider main facts of neuron physiology, how neurons interact, the properties
    of receptors and their organization in sense organs, and how the nervous system
    interfaces with the body. Using this knowledge to build models of behavior has
    not been a very common research strategy. Behaviorists, for instance, have held
    that inquiries into the mechanisms of behavior are just speculation. Cognitive
    psychologists, although in most ways opposite to behaviorists, have made an effectively
    similar claim that physiology can be ignored in the analysis of "intelligent behavior"
    and "cognition." In contrast, ethologists and some animal psychologists have considered
    behavior as the product of concrete biological mechanisms that can be investigated
    fruitfully.'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'One thread in this book is that some of this work anticipates important aspects
    of neural network models of behavior. Surprisingly, however, this has not led
    to widespread use of neural networks in animal behavior theory. We will try to
    remedy this situation and show the potentials of these models in many areas of
    animal behavior, from mechanisms of behavior to the evolution of behavior.


    In writing this book we had to explore some areas of research with which we had
    little experience. This has been very rewarding and has taught us about both animal
    behavior and neural networks. However, we cannot present a mature theory of behavior
    in terms of neural network models, nor can we cover in its entirety the existing
    literature. It is likely that we have neglected important work, and for this we
    apologize to the reader and the authors.


    # WHO SHOULD READ THIS BOOK?


    The reader we primarily have in mind is a student of animal behavior, but we hope
    that this book also will interest cognitive scientists, engineers and people working
    with neural networks in general who have an interest in animal behavior. This
    book, in fact, presents many concepts of animal behavior theory that are not widely
    known outside ethology and animal psychology, showing their connection with neural
    network models.


    # HOW TO READ THIS BOOK


    This book is organized in six chapters. Readers less interested in the mathematical
    aspects of neural network models (or very familiar with them) can skip most of
    Chapter 2. We advise them, however, to read at least the first section (excluding
    Section 2.1.3). Here follows an outline of the chapters.


    Chapter 1 starts by asking what it means to explain behavior, discussing the differences
    between motivational, ontogenetic and evolutionary explanations. We list some
    basic requirements for models of behavior and then introduce the reader to different
    modeling traditions. The difference between informational (black-box) models and
    physiological models is introduced. Lastly, we informally present artificial neural
    networks and outline their potentials as models of animal behavior.


    In Chapter 2 we offer a technical description of the most widely used kinds of
    neural networks. We consider models of individual nerve cells, feedforward networks
    and recurrent networks, as well as the methods developed to have networks perform
    specific tasks and to organize networks in response to inputs. Concrete examples
    of what networks can achieve are provided, as well as simple mathematical analysis
    of key properties. A final section introduces the reader to computer simulation
    of neural networks.


    In Chapter 3 we describe a general approach to modeling behavior and use it to
    develop neural network models of reactions to stimuli, motivation, decision making,
    behavior sequences and motor control. The approach includes realistic modeling
    of network inputs, based on knowledge of sensory physiology, and a conceptual
    boundary separating the brain from both the body and the external world (rather
    than a boundary between the individual and the external world, as often'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'done). We also compare networks with other approaches such as ethological and
    psychological theory and control theory.


    Chapter 4 considers some general questions about ontogeny, such as the role of
    genes in building brain networks and the material basis of memory. Mechanisms
    of learning are discussed, and various methods for updating network memory are
    considered. We present some applications of neural networks to learning and to
    ontogenetic phenomena such as classical and instrumental conditioning, perceptual
    learning and imprinting.


    Chapter 5 considers the evolution of behavior. Most theoretical studies of behavioral
    evolution assume few constraints on the phenotype. We discuss what neural networks
    can teach us about possible constraints on nervous systems and how such constraints
    may affect evolution. We present some concrete examples concerning the evolution
    of behavior used in animal communication.


    The final chapter, Chapter 6, summarizes what the exploration in this book has
    taught us about behavior and neural networks as a tool for understanding behavior.
    We compare neural network models with other approaches to behavior and consider
    some challenges that future research must address.


    # ACKNOWLEDGMENTS


    We are grateful to the publisher for inviting us to write this book and for editorial
    support during its realization. We thank the Department of Zoology of Stockholm
    University, where most of the work for this book has been carried out. Our research
    has been funded by the Swedish Research Council, the Tercentenary Fund of the
    Bank of Sweden, Marianne och Marcus Wallenbergs Stiftelse, and the Italian Ministry
    for Education, University and Research (through grants to Emannuale A. Iannini,
    Department of Experimental Medicine, University of L''Aquila, and Vincenzo Di
    Lazzaro, Institute of Neurology, Catholic University of Rome). SG has enjoyed
    encouragement and financial support from his family and girlfriend, as well as
    warm hospitality at the Institute for the Science and Technologies of Cognition,
    CNR, Rome. We have greatly benefited from tools developed by the free software
    community, including the GNU/Lix operating system, many GNU project tools and
    $\mathcal{B} \mathcal{T} \bar{E} \mathcal{X}$.


    Our understanding of the topics covered in this book has benefited greatly from
    discussions with many colleagues, especially Anthony Arak, Gianluca Baldassarre,
    Jerry Hagan, Liselotte Jansson, Björn Merker, Stefano Nolfi, Daniel Oso rio, Domenico
    Parisi and Peter Wallén. Michael Ryan and an anonymous reviewer provided useful
    comments on an earlier draft of the book.'
