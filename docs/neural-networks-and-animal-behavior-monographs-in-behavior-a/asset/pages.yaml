    # ### 4.7.3 Toward a general framework


    The preceding results are intriguing, but the ontogeny of behavior cannot depend
    only on refinement of connections within a fixed network architecture. Nervous
    systems can develop also in terms of, e.g., number and connectivity of nerve cells.
    For instance, in male zebra finches (*T. guttata*), connections from the HVC brain
    nucleus grow to the RA nucleus mainly between 25 and 60 days of age (Norden &
    Norderen 1988), during which period the young male memorizes the song of other
    males (Zeigler & Marler 2004). Today there is no general framework based on neural
    networks for modeling the ontogeny of behavior in its broadest sense (but see
    Chapter 5; Nolfi 2003). Here we sketch some possible research lines.


    The goal of a general neural network model of ontogeny is a relatively simple
    and intuitive account of animal development as it appears at the behavioral level
    of analysis. Particularly important is to account for how ontogenetic factors,
