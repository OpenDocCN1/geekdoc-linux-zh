    as follows (Barto 1995):


    $\Delta \mathbf{W}_{t}=\eta\left(\lambda(r-\mathbf{W} \cdot \mathbf{x})+\beta(1-\lambda)(1-r-\mathbf{W}
    \cdot \mathbf{x})\right) \mathbf{x}_{t}$ (2.51)


    If $\lambda=1$ or $\lambda=0$, this formula reduces to the upper or lower part
    of equation (2.50), respectively (but the learning rate for the lower part is
    $\eta \beta$ instead of $\eta$ ). If $\lambda$ has an intermediate value, $\Delta
    \mathbf{W}_{t}$ is a weighted sum of the two parts in equation (2.50), the weight
    being the parameter $\hat{\beta}$. It can be shown that equation (2.51), called
    the *associative reward-penalty rule*, performs best for small values of $\hat{\beta}$,
    e.g., 0.01 or 0.05. Nevertheless, the second part of equation (2.51) is important
    because it regulates weight changes when the action taken resulted in poor reinforcement.


    # 2.3.5 Learning about time


    So far we have discussed how to realize input-output maps with no time structure.
    Here we consider algorithms that can set weights so that desired output sequences
    are produced from given input sequences. We consider discrete time steps (Section
    2.2.2), and we write $\mathbf{x}(t)$, the input at time $t$.


    Different network architectures have been used to handle time. One idea is to
    maintain a feedforward architecture but to replicate the input layer so that it
    contains copies of the input at different times. This is called a *time-delay*
    network. Thus, if there are $N$ input nodes receiving the input $\mathbf{x}(t)$,
    the network would have a second set of $N$ nodes whose input is $\mathbf{x}(t-1)$,
    and so on (Figure 2.13, top). All techniques introduced to set weights in feedforward
    networks can be applied. For instance, a perceptron-like network may learn by
    the $\delta$ rule to react to the sequence $\{\mathbf{x}_{1}, \mathbf{x}_{2}\}$
    but not to $\{\mathbf{x}_{2}, \mathbf{x}_{1}\}$. This is impossible for a standard
    feedforward network (Section 2.2.2), but a time-delay network simply sees the
    two sequences as two different input patterns that thus can elicit different outputs.
    This simple approach to time, however, has a number of shortcomings. First, it
    may require a very large network. For instance, if we consider that signals in
    nervous systems propagate in millisecond times, we would need several hundred
    copies of the input layer to cover intervals of the order of $1 \mathrm{~s}$.
    It does not appear that nervous systems manage time'
