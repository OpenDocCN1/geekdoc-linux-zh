    # 3.3.1.3 Other dimensions


    Most empirical studies of generalization have dealt with either rearrangement
    or intensity dimensions. One exception is size generalization (Dougherty & Lewis
    1991; Grice & Saltz 1950; Magnus 1958; Mednick & Freedman 1960). An example is
    a series of circles that vary in size. Size generalization is peculiar to visual
    stimuli, although one could imagine similar dimensions for other senses. Size
    generalization gradients often are asymmetrical, with stronger responses to stimuli
    that are larger than $S^+$ (Ghirlanda & Enquist 2003). Our network model generalizes
    similarly, as shown in Figure 3.9.


    Sometimes stimuli are used that do not lie on a simple stimulus dimension. In
    ethology, for instance, animals often are presented with modifications of natural
    stimuli that vary along many dimensions (Figure 3.6). A strength of the receptor
    space approach is that predictions about responding can be generated for any stimulus,
    given that we can determine how it stimulates receptors. For instance, we can
    easily generate predictions about responses to stimuli that vary in both intensity
    and rearrangement relative to $S^+$. Another example of this flexibility is compound
    stimuli composed by adding or removing discrete stimuli. For instance, presenting
    $S^+$ together with a novel stimulus $A$ often produces a weaker response than
    presenting $S^+$ alone (external inhibition; Pavlov 1927; Pearce 1987). This can
    be explained by noting that an input pattern **a** (modeling stimulus A), to the
    extent that it differs from $S^+$, will activate mostly nodes linked to negative
    weights. Hence the vector that models the simultaneous presence of A and $S^+$
    will also provide more intense input to negative weights.


    # 3.3.2 Finer discriminations


    So far we have analyzed discriminations between a stimulus $S^+$ and its absence,
    or background B. Here we analyze generalization after introducing a “negative
    stimulus” $S^-$ that is similar to $S^+$. This means that animals respond to $S^+$
    but not to $S^-$ or B. The addition of a negative stimulus introduces new phenomena
    along both rearrangement and intensity dimensions. Let us first consider rearrangement.
    Extensive empirical data show that if $S^+$ and $S^-$ are close enough, generalization
    along the stimulus dimension is no longer symmetrical around $S^+$. The gradient
    remains bell-shaped but is shifted away from $S^-$. Maximum responding does occur
    at $S^+$ but at a stimulus more distant from $S^-$ (Hanson 1959). Psychologists
    have called this phenomenon peak shift (Hanson 1959; Mackintosh 1974). Ethologists
    too have noted that novel variants of familiar stimuli, referred to as supernormal
    stimuli, may elicit a stronger response than the familiar stimuli themselves (Tinber-'
