    # 3.4.3 Perceptual constancy


    *Perceptual constancy* refers to the ability of animals to respond similarly to
    the same physical stimulus despite the many patterns of receptor activity that
    the stimulus may produce (Figure 3.3). Constancy has been observed for many species
    and sensory modalities (Walsh & Kulikowski 1998). It is possible to imagine two
    different explanations. We consider vision for definiteness. The first possibility
    is that animals have had prior experiences of many different circumstances and
    have learned (or been selected) to respond with the same behavior to each of them.
    The second possibility is that sensory processing does some “magic” that compensates
    for changes in retinal images. The evidence suggests that constancy may emerge
    from a combination of these two possibilities (Walsh & Kulikowski 1998). Animals
    are often very good at recognizing transformed images of familiar objects, much
    better than a simple two-layer network. On the other hand, recognition is not
    always perfect. This is hardly surprising, since, in general, it is not possible
    to tell whether two retinal images come from the same object, without knowledge
    of the object’s structure. Recognition improves with experiences of transformed
    images, and some familiarity with the stimuli seems to be required. Even very
    familiar stimuli are recognized faster from typical viewpoints than from less
    typical ones (Walsh & Kulikowski 1998). In other words, although we are often
    amazed by constancy phenomena (especially if we have tried to program similar
    abilities in a computer), we must also recognize that animals do not always react
    in the same way to a familiar object in a new situation. For instance, the empirical
    data in Figure 3.16 show that pigeons trained to react to a vertical line do not
    react equally to all orientations of the line. This strengthens the idea that
    experience with relevant stimuli is a pow-'
