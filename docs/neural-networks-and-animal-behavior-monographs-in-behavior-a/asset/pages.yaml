- pgno: 189
  md: '# ### 5.2.2 Genetic control


    For genetic evolution to occur, behavior mechanisms must be under genetic control
    to some extent. Note that this does not exclude that learning and other experiences
    influence behavior. The genes may, for instance, specify a learning mechanism
    rather than exactly determine behavior. Behavior systems have the potential of
    being guided by both genetic information and experiences, and it appears that
    this control can shift rather quickly during evolution. For instance, some song
    birds develop their songs without any specific experiences, whereas others need
    a particular temporal arrangement of learning events (Catchpole & Slater 1995;
    Slater 2003). That neural networks can learn is well established, but only a handful
    of studies have explored the issue of genetic control of network features. Some
    of this work is discussed in Chapter 4 in the context of the ontogeny of behavior.
    Below we discuss some further studies investigating genetic control in the context
    of behavior evolution. This area, however, is not yet well developed.


    # ### 5.2.3 Already simple systems are powerful


    Even animals with small nervous systems, such as nematode worms, are capable of
    functional behavior. Neural network models clearly demonstrate, as seen in previous
    chapters, that already very simple networks have fundamental abilities such as
    generalization and decision making. If this were not the case, it would be difficult
    to explain how simple nervous systems (and thus also complex ones) could have
    evolved. It seems impossible that a complex system such as the fruit fly brain
    or crow brain could emerge without a more or less continuous evolution starting
    from much simpler system.


    # ### 5.2.4 Possibility of smooth incremental changes


    In the course of evolution, some simple nervous systems have evolved toward greater
    complexity. As just recalled, it is easier for evolution to proceed if there is
    no or only small phenotypic gaps owing to developmental constraints (Futuyma 1998).
    Neural network models suggest that nervous systems can change smoothly, for instance,
    by progressively adding more nodes or slowly changing connection patterns. For
    example, a genetic mutation causing the production of slightly more neurons could
    lead to slightly greater memory capacity. The evolution of predispositions such
    as those examined in Section 4.2.3 (see especially Figure 4.8 on page 140) could
    occur by gradual changes in the likelihood that particular groups of nodes are
    connected with each other. Moreover, the possibility for incremental changes makes
    it easier to evolve efficient behavior from crude behavior. The learning abilities
    of neural networks may also contribute to this by bringing the behavior of certain
    architectures closer to the optimal solution, thus amplifying the effects of genetic
    variation and exposing it to stronger selection—the Baldwin effect (Maynard Smith
    1987).


    It is also much easier to imagine a biological system that has some fault tolerance
    to evolve. A system without such tolerance would be rendered useless after any
    disturbance, genetic or environmental. As we have seen in Section 3.9, neural'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'network models have fault tolerance similar to nervous systems both with respect
    to damage per se and in their ability to compensate for damage by learning. Contrast
    this with, for example, a computer program that can be rendered completely ineffective
    after only minor faults such as a 1-bit change or an unexpected input. In summary,
    it appears that networks can often evolve by smooth changes, although constraints
    on this ability cannot be ruled out.


    # 5.2.5 Handling of novel situations


    We have already stressed the importance of responding properly to novel stimuli.
    Without such ability, an animal could not survive. This problem includes both
    stimuli that are similar to experienced ones and those that are very different.
    For instance, stimuli that are similar to one another often share some causal
    relationship with events in the outside world. Most neural network models generalize
    spontaneously, trying in novel situations responses that were appropriate in similar
    familiar situations. As analyzed in Section 3.3, these abilities are present even
    in very simple networks and stem from the distributed character of memory and
    input processing. In addition, animals have evolved general methods to cope with
    novelty, including exploratory behavior and avoidance behavior (Russell 1973).
    However, exactly how novel situations are detected and handled by nervous systems
    is not satisfactorily understood. We are not aware of any neural network model
    addressing this issue from a functional or evolutionary perspective (but see Section
    4.4.1).


    # 5.3 THE MATERIAL BASIS OF BEHAVIORAL EVOLUTION


    # 5.3.1 Evolution of nervous systems


    To study the evolution of behavior, it seems important to know what modification
    of behavior mechanisms mutations or new combinations of genes can produce. The
    question is complex because genes do not code for behavior directly. Rather, they
    control the ontogeny of the nervous system (including receptors and effectors)
    that, in turn, controls behavior. Comparative anatomical, physiological, biochemical
    and molecular studies of the nervous systems have revealed a number of changes
    whereby nervous systems evolve (Butler & Hodots 1996; Ghysen 2003; Nieuwenhuyss
    et al. 1998; Nishikawa 1997). In brief, these are as follows. On the basis of
    a highly conserved molecular machinery of embryonic development, the nervous system
    evolves through changes in both the number and structure of its parts, e.g., by
    duplications and subsequent differentiation. The pattern of connectivity between
    parts also evolves, e.g., when axons from one part “invade” another part or by
    loss of connections. The parts themselves evolve in a variety of ways. Most obvious
    are changes in size and number of neurons. Finer details of neural circuitry also
    evolve. Finally, nerve cells evolve through changes in their physiology, for instance,
    by changes in the properties of ion channels or synapses. This may result in the
    creation of new cell types, including new receptors. It has been suggested that
    many of these changes can be influenced by relatively simple mutational events
    that'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'control the development of the nervous system (Chapter 4; Butler & Hodgs 1996;
    Katz & Harris-Warrick 1999; Nishikawa 1997, 2002).


    The nervous system is evolutionarily conservative compared with other traits,
    including behavior, and major reorganizations are rare (Katz & Harris-Warrick
    1999; Nishikawa 1997). Anatomical differences are often small, even within large
    taxonomic groups, and often this holds also for circuit organization (Katz & Harris-Warrick
    1999). For instance, the basic neuronal organization for locomotion has been conserved
    in distantly related chordates (Kiehn et al. 1997). Thus evolution of behavior
    seems not to be based primarily on anatomical changes. Recent advances suggest
    instead that the material basis for evolution of species-specific behavior often
    consists of small changes to neuronal circuitry, potentially resulting in dramatic
    changes to behavior (Katz & Harris-Warrick 1999; Nishikawa 1997, 2002). These
    changes may involve details of how cells are connected but also properties of
    neurons. Of considerable interest here is the discovery of “multifunctional” networks
    (Katz & Harris-Warrick 1999), circuits that are able to produce different behavior
    patterns by small changes to some parameters, such as the number of ion channels.
    On the other end, anatomically different neural circuits seem to have evolved
    several times to solve similar problems, perhaps because there are only a few
    ways of solving a given problem within a network structure (Nishikawa 2002).


    The latter point suggests that referring to structural changes is not sufficient:
    we must also understand how these relate to behavioral function (on which selection
    operates). Such a link has been evidenced in a number of studies. For example,
    food-storing birds have larger hippocampal volumes than nonstoring species (Basil
    et al. 1996; Krebs et al. 1989), and in song birds, there is a correlation between
    size of song repertoire and volume of the HVC song control center (DeVoogd et
    al. 1993). The evolved complexity of motor pathways for singing in song birds
    is another example (Catchpole & Slater 1995; Nottebohm et al. 1976; Slater 2003).
    But it is evolutionary changes on a finer scale that should interest us most,
    e.g., changes in information processing, decision making or learning. Recent studies,
    for instance, of electric fish and prey capture in frogs (Nishikawa 1997) have
    demonstrated that adaptation of novel behavior, absent in ancestors, can be caused
    by small changes to neural circuitry, e.g., patterns of connections.


    Similar points to those we just made about the nervous system can also be made
    about receptors (sense organs) and effectors such as the skeletal-muscular apparatus.
    For instance, pigments in photoreceptors can shift their sensitivity to other
    wavelengths as a consequence of single genetic mutations and thus give rise to
    improved color vision (Goldsmith 1990; Katz & Harris-Warrick 1999; Wang et al.
    1999).


    # 5.3.2 Evolution of neural networks


    To study the evolution of behavior using neural network models, we need to make
    assumptions on how genes code for properties of a neural network. Network properties
    that may be put under genetic control are, for instance (Nolfi 2003; Nolfi & Floreano
    2000; Rolls & Stringer 2000):


    +   1. Transfer functions and other properties of nodes (neurons).'
  merge: -1
  img_proc: true
