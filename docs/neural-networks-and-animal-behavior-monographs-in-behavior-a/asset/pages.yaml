    We begin our discussion of neural network models of homeostasis with a simple
    model of drinking. Organisms constantly lose water, which must be replenished
    by drinking. Thus a network model of homeostatic drinking should explain how body
    water volume is maintained close to what is required by body physiology. The model
    is comprised of three nodes, as shown in Figure 3.21. Nodes 1 and 2 convey information
    about body water volume and availability of water to node 3. Similar to models
    presented earlier in this chapter, the activity of node 3 is assumed to correspond
    to the probability of drinking:


    Pr(drinking at time $t = z_{3}(t) = W_{31}z_{1}(t) + W_{32}z_{2}(t)$ (3.6)


    To turn this generic equation into a model of drinking, we need to be more specific
    about (1) how water volume changes with time, both when an organism drinks and
    when it does not drink, and (2) what are the internal and external stimuli that
    form the raw material for the decision to drink. Note that assumptions of this
    kind are needed in all models including body states as well as external stimuli.


    Let $v(t)$ denote body water volume at time $t$. We assume that water loss at
    any time is $-av(t)$ (proportional to water volume) and that drinking causes a
    gain in water at a constant rate $b$:


    $v(t+1) = \begin{cases} -av(t) & \text{if not drinking} \\ -av(t) + b & \text{if
    drinking} \end{cases}$ (3.7)


    Let us now consider network inputs. The model has two input nodes. Node 1 models
    a cell able to sense water deficits (Table 3.1). The node is assumed to operate
    as follows:


    $z_{1}(t) = \begin{cases} V - v(t) & \text{if } v(t) < V \\ 0 & \text{otherwise}
    \end{cases}$ (3.8)


    The parameter $V$ may be thought of as a set point for water level regulation,
    i.e., the ideal water level that should be maintained. We shall soon return to
    this concept. According to equation (3.8), node 1 is inactive if the organism
    has enough or more than enough water; otherwise, it is active in proportion to
    water deficit. Neurons with similar properties are thought to exist, for instance,
    in the central nervous system of mammals (Toates 2001; Table 3.1). Node 2 is a
    “water detector”; i.e., it is active if and only if water is accessible:


    $z_{2}(t) = \begin{cases} 1 & \text{water present} \\ 0 & \text{water absent}
    \end{cases}$ (3.9)'
