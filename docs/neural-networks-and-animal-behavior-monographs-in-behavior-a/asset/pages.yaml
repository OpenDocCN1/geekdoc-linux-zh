    # 4.7.1 Ontogeny of the nervous system


    The ontogeny of behavior has its material basis in the ontogeny of the nervous
    sys- tem. All the organization and specificity of behavior is due to the nervous
    system being highly structured rather than randomly assembled neurons. Our question
    is, then, what this "structure" consists of and how it is established during ontogeny.
    In essence, the structure, as discussed in Chapter 3, consists of a variety of
    cell types, including receptor and effector cells, as well as patterns of connections
    between cells. The latter are often intriguingly complex. There are connections
    within clus- ters of neighboring cells but also long-distance connections between
    different parts of the brain and connections with sense organs and muscles. Connections
    can be of different kinds, and neurons may also be sensitive to or produce hormones
    or neuromodulators with longer-lasting influence on other neurons or organs.


    Our knowledge about the ontogeny of nervous systems has improved consider- ably
    in recent years. We can roughly identify four steps in which the nervous sys-
