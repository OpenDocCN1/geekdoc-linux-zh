    # 4.7.2 Neural network studies of ontogeny


    Learning, in the sense of refinement of connections and thus the last stage of
    ontogeny, has always been the core area of neural network research. In comparison,
    only a few studies exist about the ontogeny of behavior in a broader sense (for
    reviews, see Elman et al. 1996; Nolli 2003). Most of these studies, moreover,
    are limited to tracking changes in network behavior that arise from changing the
    value of connections within a fixed network architecture. Thus they do not consider
    the birth and growth of neurons, how connections are formed and what controls
    such events. Problems studied with this approach include human language acquisition
    (Elman et al. 1996; Rumelhart & McClelland 1986a), perceptual learning (Kohen
    2001; McLaren & Mackintosh 2000) and imprinting (Bateson & Horn 1994; O''Reilly
    & Johnson 1994).


    Rumelhart and McClelland (1986a) present one the earliest neural network studies
    of a complex ontogenic process. Their aim was to model how children learning to
    speak English acquire the ability to form the past tense of verbs. A feedforward
    network received verb stems in input and was trained by back-propagation to produce
    the corresponding past tenses as outputs. Figure 4.27 shows the acquisition curves
    for regular and irregular verbs separately. Mastering of regular verbs displays
    a steady growth in performance. The ability to handle irregular verbs, on the
    other hand, shows a sudden drop after a number of training sessions. At this time
    the network seems to have "grasped" the relatively simple rule for constructing
    the past tense of regular verbs and uses the same rule, incorrectly, to handle
    irregular verbs. The performance on irregular verbs increases again as the network
    learns each verb on a case-by-case basis. This study has been discussed widely,
    and also criticized, as a model of grammar acquisition (Elman et al. 1996; Pinker
    & Ullman 2002). In the context of this book, the example is interesting because
    it suggests that complex learning sequences can arise from learning based on weight
    updates within a fixed network architecture (see below).


