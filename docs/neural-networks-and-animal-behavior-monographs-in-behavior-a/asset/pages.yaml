    \ Figure 2.6 shows that this simple model can accurately describe the habituating\
    \ photoreceptor of a fleshfly. Benda & Herz (2003) show that more complex kinds\
    \ of habituation can be described with simple models. Models with a few internal\
    \ variables have been developed also for other characteristics of neurons, such\
    \ as spontaneous activity (Wang & Rinzl 2003).\n\n# 2.2 NETWORK ARCHITECTURES\n\
    \nThe pattern of connections among nodes defines the *network architecture* that\
    \ is responsible for much of a network's properties. In the following we present\
    \ a number of architectures relevant to behavioral modeling. We will first consider\
    \ *feedforward networks*, so named because node activity flows unidirectionally\
    \ from input nodes to output nodes, without any feedback connections. *Recurrent\
