    students of behavior within ethology and psychophysics have dealt with it extensively
    (Baerends & Drent 1982; Hinde 1970; Lorenz 1981; Mackintosh 1974, 1994; Pearce
    1997; Tinbergen 1951). Ethologists often speak of “stimulus selection” and experimental
    psychologists of “stimulus control.” In practice, we usually know how'
