    # 3.8.4 Sensory feedback


    The control of motor patterns is of course not just endogenous. Behavior is typically
    in one way or the other oriented toward the outside world, and even a single motor
    pattern often includes sensory feedback that partly controls the movement. Such
    feedback may come from proprioceptors within the body or from receptors sensitive
    to external stimulation. An important role of feedback from proprioceptors and
    mechanical receptors is to compensate for errors or unusual load, thereby maintaining
    orientation or balance (Kandel et al. 2000). External receptors can also have
    a similar compensatory role, e.g., in maintaining orientation toward a moving
    prey. In general, empirical work shows that central pattern generation often interacts
    with sensory feedback (Cohen & Boothe 2003).


    An early study demonstrating both external and internal feedback control is prey
    capture in mantids (McFarland 1971; Mittelstaedt 1957). This behavior can be divided
    into an orientation phase and a strike phase. The mantid strikes with its forelegs
    at an angle (relative to the body) that is controlled by the angle to the prey.
    To determine the aim of the strike, the animal uses sensory information from the
    eyes, measuring the angle between head and prey, and information from proprioceptors,
    measuring the angle between body and head. The strike is not controlled by sensory
    feedback, corresponding thus to a fixed action pattern. The division into an orientation
    phase using sensory feedback and a strike or attack phase that is generated centrally
    is common to many species (McFarland 1971; Timbergen 1951).


    Entering sensory feedback into a neural network model of motor control is, at
    least in principle, easy. For instance, a network that generates the motor pattern
    necessary for flying could be integrated with a network that analyzes flow fields
    to control flying (Section 3.5.1). An interesting example is the pioneering study
    of Beer and Gallagher (1992), who developed a neural network to control walking
    in a simulated cockroach-like insect, shown in the left panel of Figure 3.39.
    The six legs were controlled by identical copies of a recurrent network (shown
    in the middle panel). The right panel shows how the six networks were connected
    with each other to form the complete walking control system. Important to the
    present discussion is that each network received sensory feedback from a proprioceptor
    that measured the angle between the leg and the body. Although simulated insects
    could walk without such feedback, the latter allowed better coordination and faster
    walking. Other network studies of locomotion in simulated animals and legged robots
    are reviewed by Beer et al. (1998); Ijspeert (2003) and Nolfi and Floreano (2000).


    The understanding of motor control in terms of neural networks is perhaps the
    best developed field of neural network research, and we cannot review all relevant
    studies here. We just want to state that a number of motor systems have been studied
    in detail and are well understood. These systems range from very simple, such
    as the three-neuron network that controls aerial respiration in the pond snail
    (*Lymnaea stagnalis*; Taylor & Lukowiak 2000), to rather complex, such as the
    control of swimming in lampreys (Grillner 1996; Grillner et al. 1995). The latter
    is'
