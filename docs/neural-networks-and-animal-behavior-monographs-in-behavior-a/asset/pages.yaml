    # 4.5 COMPARISON WITH ANIMAL LEARNING THEORY


    We have already seen in Chapter 3 some similarities and differences between neural
    networks and other models of behavior. With respect to learning, neural networks
    have many similarities with psychological theory of animal learning, but there
    are also important differences. Animal learning theory is one of the most developed
    subjects in animal behavior studies. It has developed almost exclusively based
    on observations and experimentation at the behavior level. However, learning involves
    also processes and states within the animal (learning mechanisms, memory). Consequently,
    learning theory holds a number assumptions about internal factors that have been
    inferred from observations of behavior. We now review some of these assumptions
    and relate them to corresponding ones in neural network models.


