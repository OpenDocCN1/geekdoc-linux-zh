    of timing in this network is as follows. The recurrent connections in subnetwork
    1 cause the pattern of activity in this network to change with time, even though
    the CS input is constant. The activity of subnetwork 1 encodes thus, implicitly,
    the time since CS onset as well as the identity of the CS. Such a time representation
    may be “read out” by strengthening or weakening specific connections. Suppose,
    for instance, that we wish the network to respond at time $t_0$ after CS onset.
    Owing to the recurrent connections, subnetwork 1 will be in a particular activity
