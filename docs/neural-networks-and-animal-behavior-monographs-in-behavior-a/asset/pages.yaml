    # 3.7.5.2 Circadian rhythms and “action-specific energy”


    In this section we illustrate two additional factors that can organize behavior
    in time. As a concrete example, we consider dustbathing, a characteristic behavior
    of many birds that serves to spread dust into the feathers and keeps them clean
    (see Section 4.7 for further details). The first factor is circadian control,
    meaning that a behavior is performed more often at some time of day than at others
    (see, e.g., Toates 1998 for an introduction to circadian rhythms). For example,
    chickens dust-bathe more often around midday, as shown in Figure 3.31. Circadian
    control may have a number of functions. One is to anticipate events (e.g., to
    go to a safe place before dusk). Another is to provide stability against environmental
    noise (e.g., not believing it is dusk if the sky is cloudy). Consideration of
    dustbathing and feeding in chickens shows that circadian rhythms can also decrease
    conflict between activities. Eating peaks at dawn and dusk and is stable during
    the day (about 5 min/hr). This makes functional sense, considering that the animals
    do not eat at night. Dust-bathing, as we have seen, shows a reversed pattern;
    it peaks around midday and is performed rarely at other times. Dustbathing is
    a time consuming activity; a bout takes almost 30 minutes in adults and is performed
    every other day. There seems to be no functional reason for dustbathing to be
    performed at a particular time, but the observed timing reduces conflict with
    feeding.'
