  md: 'some behavioral phenomena have so far benefited little from a cognitive approach
    either because it is difficult to know what is functional, because the computational
    content of a behavior is unclear (e.g., sleep) or because behavior is, in some
    conditions, not functional. Examples of the latter include biases in responding
    to stimuli and other features of decision making (Chapter 3).


    Cognitive models typically are intermediate between operational and physiological
    models. They aim at describing real mechanisms within the animal, at the level
    of symbolic information processing, but they are inferred from behavioral observations
    and functional arguments (Gallistel 1990; Leachey 2004). The extent to which this
    is legitimate is the subject of enduring debate. In contrast to the cognitive
    approach, most classical behaviorists held an extreme negative view and argued
    that assumptions about internal or mental variable were speculative and unscientific
    (Skinner 1985). For a critical examination of both positions, see Staddon (2001).


    # ## 1.3.6 Neuroethology


    Our overview of models of animal behavior would not be complete without mentioning
    neuroethology and similar research efforts (Ewert 1980; Ewert et al. 1983; Simmons
    & Young 1999). Neuroethology was born out of classical ethology as an effort to
    understand behavior based on detailed knowledge about the anatomy and physiology
    of nervous systems. It focuses on animals in general and usually on much simpler
    nervous systems than the human brain. It is hard to overrate the success of this
    research program. A number of behavior systems have been studied thoroughly. One
    example is studies of sensory processing and decision making in the frog retina
    and brain (Ewert 1980, 1985). Examples of other success stories are the motor
    control of swimming in the lamprey (Grillner et al. 1995) and pheromone searching
    in moths (Kennedy 1983).


    The purpose of neurophysiological models is not only to predict behavior but also
    to provide an understanding of how nervous systems operate. Pure neurophysiological
    models of behavior represent the opposite of pure black-box models. They are important
    because they give the real picture of behavior mechanisms. They are crucial for
    the neural network approach explored in this book by providing an important reference,
    independent of behavioral observations, of how to build models of behavior. To
    the student of behavior, the downside of neuroethological models lies in their
    complexity. Each model embodies many particular aspects of specific nervous systems,
    building on detailed knowledge that we are unlikely to ever have but for a few
    species. Complexity also makes these models impractical, in the sense that a considerable
    expertise is needed to understand each of them. Lastly, even the most detailed
    physiological and anatomical knowledge may not by itself reveal principles of
    operation. Today there is promising cooperation between neuroethology and neural
    network research. Research on visuomotor coordination in frogs and toads is a
    good example (Cervantes-Pérez 2003). Neural network research has produced tools
    that allow us to analyze findings from empirical neuroethology, including theory,
    modeling techniques and computer simulation techniques. These, however, have seldom
    been used to develop simplified models that provide intuitive understanding of
    basic principles of behavior.'
