  img_proc: true
- pgno: 199
  md: 'There are two common theoretical approaches for exploring the evolution of
    behavior (Grafen 1991). The first defines strategies in terms of behavioral variables
    (phenotypic variables) and assumes that evolution acts directly on such variables.
    For instance, when studying the evolution of fighting behavior, we could define
    strategies such as “fight if the value of the contested resource exceeds a threshold
    value; otherwise, give up” (Maynard Smith 1982). Such strategies are usually assumed
    to transmit directly from parent to offspring and sometimes to change slightly
    by mutation. The second way of modeling behavioral evolution is to assume a genetic
    machinery that codes for behavioral strategies. For instance, alternative strategies
    may be assumed to correspond to different alleles at a given genetic locus, or
    combinations of alleles at several loci (e.g., Futuyma 1998). Both approaches
    have provided substantial insight into the evolution of behavior, but applications
    of these methods generally do not take into account the ontogeny and operation
    of behavior systems. Neural network models make it possible to investigate how
    the latter may influence evolution and also to study how ontogenetic programs
    and behavior systems change during evolution.


    Today only a few evolutionary studies have used neural network models as behavior
    mechanisms. Most of these studies exploit networks as more biologically realistic
    mechanisms for recognition discrimination (Chapter 3). The problems considered
    include evolutionary conflicts and manipulation (Arak & Enquist 1995; Krakauer
    & Johnston 1995; Wachmeister & Enquist 2000), the evolution of mimicry (Holmgren
    & Enquist 1999), the evolution of signal form and responses to signals (Bullock
    & Clift 1997; Enquist & Arak 1994, 1998; Enquist & Leimar 1993; Johnston 1994;
    Kamo et al. 2002, 1998), reconstruction of signal evolution (Pelps 2001; Phelps
    & Ryan 1998), host-plant selection (Holmgren & Getz 2000), coy female behavior
    (Wachtmeister & Enquist 2000), evolution of camouflage (Merilaita 2003), foraging
    behavior (Holmgren & Getz 2000) and learning abilities (Rolls & Stringer 2000).
    The evolution of behavior based on neural networks is also studied in robotics,
    particularlly within so-called evolutionary robotics. For more information, readers
    are referred to Nolli and Floreano (2000).


    Below we first give a brief introduction to the modeling of adaptive behavior.
    Then we discuss how neural networks can be used to explore the evolution of behavior.
    The focus is on issues that are difficult to investigate with more standard methods.
    This is followed by a description of simulation techniques. The chapter ends with
    three examples describing how neural networks have been used to investigate particular
    evolutionary problem. The first example considers manipulation in interactions
    between senders and receivers, the second one is the evolution of signal form,
    and the third is a case study of evolution of male calling and female responses
    in a frog species.


    # ## 5.4.1 Standard approaches


    Optimization theory and game theory are today the most common frameworks for investigating
    the evolution of adaptive behavior (Houston & McNamara 1999; Krebs & Davies 1977,
    1987, 1991; Maynard Smith 1982; Maynard Smith & Price 1973; Parker & Maynard Smith
    1990). They consider strategies described in terms'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# CHAPTER 5


    of behavioral variables or, more generally, phenotypic variables. The purpose
    of these methods is to find and describe behavior that maximizes individual reproduction
    or some other measure of fitness. The evolutionary justification for such a focus
    on fitness maximization is the assumption that natural selection will favor changes
    in behavioral strategies until an end point is reached in which individuals cannot
    improve their reproduction by using an alternative achievable strategy (evolutionary
    equilibrium). Finding fitness-maximizing behavior can be done formally by means
    of an extensive mathematical toolbox (Grafen 1999; Houston & McNamara 1999; Maynard
    Smith 1982; Stephens & Krebs 1986), but more intuitive verbal arguments about
    which strategy is best or produces most offspring are also common.


    When an individual''s fitness does not depend on the behavior or strategies of
    others one speaks of *frequency-independent selection*, whereas when an individual''s
    fitness depend on what other individuals do the term *frequency-dependent selection*
    is used (Futuyma 1998). Frequency-independent selection is well illustrated by
    the evolution of flying, e.g., in the altrosss. The dominating selection pressures
    for the shape of the body and wings, as well as the control of flying, are the
    aerodynamics conditions at sea. It seems safe to assume that these selection pressures
    have remained the same during the whole evolution of altrattosses'' adaptation
    to life at sea. Evolution under frequency-independent selection is usually studied
    with optimization theory (Houston & McNamara 1999), under the assumption that
    evolution has been going on long enough to discover an optimal or near-optimal
    solution.


    Evolution under frequency-dependent selection is more complex because selection
    pressures change as a consequence of evolution. Fighting behavior is an example
    of behavior that evolves mainly under frequency-dependent selection. Consider,
    for instance, weaponry such as antlers and horns. Their success depends crucially
    on what weapons and defense tactics are used by other individuals. The invention
    of new weapons or defenses often triggers the evolution of counteradaptations
    that reduce their efficiency. Possible evolutionary end points under frequency-dependent
    selection are often studied through the application of *evolutionary game theory*
    (Eshel 1996; Houston & McNamara 1999; Maynard Smith 1982). The aim of such analysis
    is to find strategies (or sometimes a set of strategies, one for each type of
    player, such as, e.g., males and females) that will be maintained over time once
    they have become established in the population (a stable evolutionary equilibrium).
    Specifically, evolutionary game theory seeks *evolutionarily stable strategies*
    (ESSs) as solutions to evolutionary problems. According to the definition, a strategy
    $s^{*}$ is an ESS if, when used by all or almost all individuals in the population,
    it cannot be displaced by any alternative strategy $s \neq s^{*}$ used by a few
    individuals (Houston & McNamara 1999; Maynard Smith 1982). This requires first
    that $s^{*}$ reproduces at least as well as any $s$. This is usually referred
    to as a *Nash equilibrium*. To ensure stability, the ESS definition also requires
    that either $s^{*}$ has higher fitness than any alternative $s$, or if an alternative
    $s$ exists that initially has the same fitness as $s^{*}$, its fitness should
    become lower than the fitness of $s^{*}$ if the number of individuals using $s$
    increases.


    If evolutionary processes are indeed at a stable equilibrium, predictions about
    behavior under frequency-dependent selection can be obtained simply by asking'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'what is the end point of the evolutionary process (Houston & McNamara 1999;
    Maynard Smith 1982). However, for evolution to occur at all, strategies must exist
    out of equilibrium at least some of the time (Maynard Smith 1978). If these periods
    are brief, we may be justified in ignoring them and analyze behavior purely with
    game theory. However, there is also the possibility that some evolutionary processes
    never come to rest, with strategies in an almost continuous state of flux (Dawkins
    & Krebs 1979; Enquist et al. 2002). For instance, the coevolution between a prey
    species and a predator species may take the form of an *arms race*, i.e., a never-ending
    series of adaptions and counteradaptations (Aramids 2000; Dawkins 1982; Dawkins
    & Krebs 1979; Dieckmann et al. 1995; Slakrin & Maynard Smith 1979).


    Recent developments in evolutionary modeling have increased and modified our understanding
    of evolutionary stability (Dieckmann et al. 1995; Eshel 1983; Houston & McNamara
    1999; Leimar, in press). We now know that ESS analysis may not find all equilibria
    and that some potential ESSs are not reached during evolution by natural selection.
    In addition, it has also been realized that many evolutionary problems lack stable
    equilibria (Houston & McNamara 1999). This understanding has emerged from a more
    dynamical approach to evolutionary modeling, which also is necessary if we want
    to understand what phenotypes emerge when evolution proceeds out of equilibrium.
    Studying the dynamics of evolution requires tracking the small steps of evolution
    that occur in each generation. The last decade has seen considerable and exciting
    development of such dynamical theories, often called *adaptive dynamics* (Dieckmann
    & Law 1996; Geritz et al. 1998).


    # 5.4.2 How neural networks may contribute


    Neural networks may help us to study the evolution of behavior beyond the standard
    approaches just summarized. A characteristic of both the traditional ESS approach
    and more dynamical approaches is that they are based either on behavioral variables
    (decision rules) or on genetic variables assumed to determine behavior directly
    (the relation between these approaches is increasingly understood; see, e.g.,
    Hammerstein 1996; Leimar in press). Variables related to nervous system operation
    and ontology are rarely considered. The argument for using neural network models
    in evolutionary modeling is, of course, their biological realism, including features
    such as flexibility and efficiency but also biases and constraints. Another argument
    for using neural networks is their generality. The basic design of behavior mechanisms
    is essentially the same in most animals, and species-specific behavior evolves
    within a framework that can be covered by neural network models. Here follows
    a discussion of how neural networks may be used to explore the evolution of behavior.


    Let us first consider frequency-independent selection. Under such assumption,
    the evolutionary dynamics are relatively simple, and we expect improvements to
    accumulate over evolutionary time. Finding the optimal solution under the assumption
    that the behavior map is a network means that optimization is performed with respect
    to network variables such as connection weights and variables specifying the network
    architecture rather than with respect to behavior-level variables or de-'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'cisions rules. There are several ways to do this. One option is to use optimization
    theory to find neural networks that maximize fitness. We are not aware of any
    studies using this approach to study evolution. Alternatively, one could try to
    find solutions by an evolutionary simulation (see below) or some other dynamic
    approach. The two options may not always yield the same result. The former can
    locate optimal network strategies (given we can solve the optimization problem,
    of course), whereas the latter is sensitive to, for instance, the initial choice
    of network architecture, basins of attraction and local fitness maxima (Futuyma
    1998). Similar options are available for frequency-dependent selection. We could
    use standard evolutionary game theory and search for ESS networks, but no one
    has done this as far as we know. The other option is simulations of evolution,
    which in addition to evolutionarily stable behavior may also describe behavior
    that emerges in scenarios with continuous change and without any stability (see
    below). So what insight could be gained from such analyses? We have seen in this
    and earlier chapters that basic features of neural network operation entail a
    number of biases and constraints that potentially can influence evolution. Similar
    biases are likely to exist in animals, and this is a cornerstone of studies of
    the evolution of behavior based on neural networks. Let us consider a few examples.


    Neural networks show clearly that some input-output maps are more difficult (or
    impossible) to realize. Even when a map potentially can be implemented, biases
    in the behavior mechanism can still influence the direction of evolution. One
    example is offered by Holmgren and Getz (2000), who studied the evolution of host
    plant preferences in insects. The animals'' recognition system was modeled with
    a three-layer neural network, and an evolutionary simulation was set up in which
    the networks had to select, by means of sensory cues, those host plants that offered
    better nutrition to larvae. Although many host plants had the same quality, the
    networks often evolved to recognize only one kind of plant. This study suggests
    that specialist strategies are more common because they are more easily formed
    by nervous systems and therefore may evolve more easily than generalist strategies.


    Neural network models generalize spontaneously, responding with similar behavior
    to similar stimuli (Section 3.3). Generalization may also be important in many
    evolutionary problems; e.g., problems involving high-dimensional stimuli such
    as visual stimuli that are received via many receptors. Biases in behavior systems
    may have additional consequences for the evolution of social interactions. In
    this case, natural selection favors strategies that are sensitive to the behavior
    (or physiology or biochemistry) of others, allowing the individual to respond
    based on more information. However, if there are evolutionary conflicts of interests
    between individuals, selection would also favor social strategies that can exploit
    others, e.g., by taking advantage of biases in behavior mechanisms. This has consequences
