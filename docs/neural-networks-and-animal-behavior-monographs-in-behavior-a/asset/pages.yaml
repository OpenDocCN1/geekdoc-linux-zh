    # ## 3.6 MANY SOURCES OF INFORMATION AND MESSY INFORMATION


    The information relevant to a task often comes from many different sources. For
    instance, cues for navigation can come from magnetic fields, terrestrial landmarks
    and the position of celestial bodies such as the sun and stars. Moreover, the
    cues are not always present and sometimes are unreliable (e.g., the sky can be
    overcast). It has been suggested that animals may cope with such situations using
    “rules of thumb” or “simple heuristics” that consider only one or a few cues and
    discard information about others (Stephens & Krebs 1986). Our intuition suggests
    that rules of thumb are easier to realize than more complete strategies. For a
    neural network, however, it is not necessarily easier to discard information than
    to take it into account. Indeed, an important aspect of neural networks is that
    they make it easy to integrate all kinds of information. By means of different
    receptors, all sorts of external and internal events can be converted in the “universal
    currency” of neuron activity (Table 3.1). Moreover, recurrent connections allow
    the network to build up regulatory states that provide sensitivity to time patterns.
    Whether incoming information is precise or messy does not matter much. Networks
    are able to decide what is important or not, e.g., by lowering weights that convey
    input from unreliable sources.


    How these properties of neural networks can help us to understand behavior is
    illustrated by navigation in migratory birds. Suggestions of what information
    guides this extraordinary ability have been growing steadily. The list includes
    the above-mentioned cues, as well as smells, infrasounds, inertial, gravitational
    and Coriolis forces, and others (Alsteram 1993). At the same time, there has been
    a tendency to ask which one is “actually” used. But why not use all sources? A
    neural network can naturally integrate many kinds of information, given that it
    can be received. This also provides a more robust solution that would work even
    when some sources of information are unavailable. The mechanism could also be
    sensitive to the current reliability of sources. That biological navigation systems'
