    # **4.2.3.2** *Evolutionary flexibility*


    That learning results form suitable combinations of network architecture and local
    and global factors may yield some insight about the evolution of learning. Indeed,
    the same flexibility that applies to behavior maps also applies to mechanisms
    of learning, in particular to global signals (Figure 4.3). Thus, given that the
    network architecture is under genetic control, evolution can mold the global signal
    to produce a variety of adaptive learning mechanisms. The fact that many observations
    of learning can be categorized as either classical or instrumental conditioning
    is explained by functionality. An intriguing perspective is that global signals
    for learning may arise from networks that are capable of learning themselves.
    This can be important in order to account for such factors as “expectations” and
    “surprise.” It is an exciting possibility that most types of animal learning can
    be modeled with a proper combination of local and global factors, as discussed
    here. However, much more work is needed to fully evaluate this promise, and many
    biological learning phenomena have so far received little interest from neural
    network modeling.'
