- pgno: 43
  md: '# *Chapter Two*


    # Fundamentals of Neural Network Models


    This chapter contains a technical presentation of neural network models and of
    how they are rooted in neurophysiology. The aim is to provide the reader with
    a basic understanding of how neural network models work and how to build them.
    We begin with basic concepts of neurophysiology, which are then summarized in
    a simple mathematical model of a network node. We continue showing different ways
    to connect nodes into networks and discuss what different networks can do. Then
    we consider how to set network connections so that the network behaves as desired.
    We conclude with a section on computer simulation of neural networks.


    # 2.1 NETWORK NODES


    In Chapter 1 we saw that neural network models consist of interconnected nodes
    that are inspired by biological neurons. Nodes in a neural network model are typically
    much simpler than neurons, including only features that appear important for the
    collective operation of the network. A minimal set of such features may be summarized
    as follows:


    +   - Nodes can be in different states, including different levels of activity
    and possibly different values of internal variables.

    +   - Nodes are connected to each other, and through these connections, they influence
    each other.

    +   - The influence of a node on others depends on the node''s own activity and
    on properties of the connection (excitatory or inhibitory, weak or strong, etc.).


    Below we provide a basic sketch of how neurons operate (referring to Dayan & Abbott
    2001; Kandel et al. 2000; and Simmons & Young 1999 for further details) and then
    we introduce the simple node model that we will use throughout this book.


    # 2.1.1 Neurons and synapses


    Neurons can be of many different types and can interact in different ways (Figure
    2.1; Gibson & Connors 2003; Kandel et al. 2000; Simmons & Young 1999; Toledo-Rodriguez
    et al. 2003). Neurons have output pathways by which they influence other neurons
    and input pathways through which they are influenced. We begin by reviewing the
    operation of spiking neurons and their interactions through chemical synapses.
    Then we consider nonspiking neurons and interactions through electrical synapses
    and neuromodulators.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '![](img/4e7230a4ecf676d308ca85f3d2e65bae_44_0.png)


    Figure 2.1 Part of the neural network of the inferior occipital cortex of a rabbit
    of eight days. Uppercase letters label anatomically distinguishable cortical layers,
    lowercase letters label different neuron types. Drawing by Ramón y Cajal, reprinted
    from De Felipe & Jones (1989).


    The distinguishing feature of a *spiking neuron* is that it can generate electrical
    pulses called *spikes* or *action potentials*. These can travel along the neuron’s
    axon, an elongated branching structure that grows out of the cell body. Axons
    can reach out for distances between a few millimeters and up to tens of centimeters,
    thus enabling both short- and long-distance interaction between neurons. The numbers
    of these interactions are often staggering. For instance, each cubic millimeter
    of mouse cortex contains about $10^{5}$ neurons and an estimated 1 to 3.5 km of
    axons, whereby each neuron connects to about 8000 others (Braienberg & Schütz
    1998; Schütz 2003).


    Neurons connect to each other by structures called *synapses*. At a synapse, the
    axon of one neuron (called *presynaptic*) meets a *dendrite* of another neuron
    (called *postsynaptic*). Dendrites form a structure similar to the axon but usually
    shorter and with more branches. While axons are output pathways, dendrites are
    input pathways. When a spike traveling along the axon of the presynaptic neuron
    reaches a chemical synapse, it causes the release of chemicals (*neurotransmitters*)
    that can excite or inhibit the postsynaptic neuron, i.e., favor or oppose the
    generation of a'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'spike by altering the electrical potential of the neuron. The magnitude of
    this effect depends on the amount of neurotransmitter released by the presynaptic
    neuron, as well as on the sensitivity of the postsynaptic neuron to the neurotransmitter.
    Altogether, these factors determine the "strength" of a synapse, i.e., the extent
    to which the presynaptic neuron is capable of influencing the postsynaptic one.
    Fundamental work has related basic learning phenomena such as habituation and
    classical conditioning to changes in the number and efficacy of synapses rather
    than to changes in patterns of connections between neurons (Chapter 4; Kandel
    et al. 2000).


    The excitatory or inhibitory effect of the neurotransmitters released by the presynaptic
    neuron is transient. A simple picture of spiking neurons is that they keep track
    of excitatory and inhibitory inputs that arrive within a short time window, extending
    up to a few tens of milliseconds in the past. Whenever the balance of excitatory
    and inhibitory input within this time window overcomes a threshold, a spike is
    generated. Thus a neuron generates more spikes per unit time the larger the difference
    between excitatory and inhibitory input. Neuron activity is often expressed in
    terms of spike frequency, measured in Hertz (1 Hz = 1 spike per second). Physiology
    limits the spike frequency of most neurons to a maximum of a few hundred Hertz,
    although rates close to 1000 Hz can be observed in some neurons.


    It is often of great importance to know how neuron activity changes when input
    varies. This holds also for receptor cells that convert light, chemical concentrations,
    sound waves, etc. into signals that are passed on to other neurons. In general,
    neurons respond nonlinearly to change in input; i.e., increasing the input in
    fixed steps does not increase output by the same amount for every step (Figure
    2.2; Simmons & Young 1999; Torre et al. 1995; and Simmons & Young 1999 for reviews).


    As mentioned earlier, nonspiking neurons also exist. Their influence on other
    neurons depends continuously on the neuron’s electrical potential, e.g., through
    continuous changes in the rate of neurotransmitter release (Burrows 1979; Simmons
    & Young 1999). Likewise, chemical synapses are not the only way neurons interact.
    For instance, neurons may be joined by electrical synapses, or gap junctions.
    These allow neurons to exchange electric currents, thereby altering each other’s
    electrical potential without the occurrence of spikes. Electrical synapses are
    often found in invertebrate nervous systems or in sense organs in vertebrates
    (Simmons & Young 1999). Recently, they have been discovered in the cortex of mammals
    (Gibson & Connors 2003). Neurons also influence each other by releasing relatively
    long-lived substances, called neuromodulators, into the extracellular fluid. These
    can change the properties of neurons over large regions of the nervous system,
    sometimes for hours. For instance, some neurons may become more excitable and
    others less so (Dickinson 2003; Harris-Warrick & Marder 1991; Hasselmo et al.
    2003).


    The activity of neurons depends on internal factors as well as external input.
    For instance, neurons respond to changes in input with a characteristic delay
    (Figure 2.3, left). Furthermore, the response to a constant input is often not
    constant at all (Wang & Rinzel 2003). A neuron may habituate, i.e., decrease its
    output to constant input (Figure 2.3, right), or it may produce oscillating activity.
    Neurons may also be spontaneously active in the absence of any input, as will
    be considered in Section 3.8 relative to the generation of motor patterns.'
  merge: -1
  img_proc: true
