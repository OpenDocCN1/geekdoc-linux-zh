- pgno: 97
  md: 'A common approach is to assume that animals “know” what stimuli are present
    or absent; i.e., this information is directly available to the behavior mechanism.
    Based on this, it is often assumed that responding to a compound stimulus (e.g.,
    a light and a sound simultaneously present) arises as the sum of independent contributions
    from component stimuli (*summation model*). Thus responding to the simultaneous
    presence of three stimuli may be written as


    ```

    $$ r(1,2,3) = W_1 + W_2 + W_3 $$

    ```


    where $W_i$ is the contribution of element $i$. Responding when only stimuli 1
    and 2 are present would be given by $r(1,2) = W_1 + W_2$. This approach is followed
    in many psychological models of associative learning (Atkinson & Estes 1963; Rescorla
    & Wagner 1972); in this context, $W_i$ is called the *associative strength* between
    stimulus $i$ and the response. Summing contributions from different stimuli is
    also a prominent ingredient of several “cognitive” models of memory, such as *instance
    theory* (Chapter 3 in Shanks 1995). Ethologists used equation (3.3) as well, calling
    it the *law of heterogeneous summation* (Baerends & Kruijt 1973; Lorenz 1981;
    Seitz 1940–1941, 1943). In neural network terms, the model is equivalent to assuming
    that each input node only reacts to a given stimulus. Such a “detector” node would
    have an activity of 1 when the stimulus is present and of 0 when the stimulus
    is absent (Section 1.3.3). Thus equation (3.3) can be written as a two-layer network:


    ```

    $$ r = \sum_i W_i x_i $$

    ```


    where $x_i$ is 0 when stimulus $i$ is absent and 1 when it is present.


    A major problem of summation models is that they can handle only stimuli that
    can be broken up into discrete components. Generalization along continuous dimensions
    such as object size, sound frequency and light wavelength cannot be dealt with.
    The *gradient-interaction theory* of Spence (1937) and Hull (1943) instead deals
    with just such issues. Spence hypothesized that when a response is established
    to a stimulus having a given value along a continuous dimension, a “gradient of
    excitation” builds around it. Stimuli with different values on the dimension would
    thereby elicit a response proportional to the height of the gradient at that point.
    Nowadays this seems just an acknowledgment that generalization occurs, but generalization
    gradients had not yet been observed when Spence wrote! Spence used gradients as
    theoretical constructs to show that the interaction between an excitatory gradient
    around $S^+$ and an inhibitory one around $S^-$ could result in a shifted gradient,
    inducing animals to prefer to $S^+$ a stimulus more removed from $S^-$ than $S^+$
    itself (*transposition*). This predates by more than 20 years the observation
    of actual shifted gradients by Hanson (1959). Despite these successes, the main
    shortcoming of Spence’s theory, as well as his refinements proposed by Hull (1943,
    1949), is still that generalization is assumed rather than explained. The theory
    cannot predict why a given shape of the gradient is observed, e.g., why intensity
    generalization gradients are not bell shaped (Ghirlanda 2002). Moreover, the theory
    has a drawback complementary to those of summation models: it cannot deal with
    discrete stimuli!'
  merge: -1
  img_proc: true
