    For example, plumage coloration in birds often varies to a much greater extent
    within genera than do other morphological features such as beak, wing or body
    shape—a most useful fact to bird watchers. In some taxa there is also considerable
    intraspecific variation in signal form. All this diversity agrees with the preceding
    remarks, suggesting that instability is common in signal evolution. An interesting'
