  md: 'if **a** and **b** have *high activity on the same nodes*. Equation (3.1) applies
    also to two-dimensional patterns (the index $i$ merely identifies nodes and does
    not imply that they are arranged in any particular way). For instance, patterns
    that are close to each other in Figure 3.3 overlap more than patterns that are
    far away. In the following we will gain more familiarity with overlaps and see
    how they are used in practice.


    The reason why overlaps are useful can be summarized as follows. The reader may
    recall from Chapter 2 that a network node essentially computes the overlap between
    the input and weight vectors (equation 2.15 on page 40). In particular, the response
    of a two-layer network with a single output node is completely described in terms
    of the overlap between the input pattern and the weight vector. In turn, the weight
    vector can be expressed as a weighted sum of familiar patterns (Section 2.3.1).
    Thus the response to an input pattern can be predicted based on its overlap with
    familiar patterns without explicitly considering the network.


    # 3.3.1 Generalization gradients


    How animals react to stimuli often is explored by modifying the familiar stimuli
    along specific physical dimensions, such as sound frequency or light wavelength.
    Such tests are referred to as *generalization tests* and the resulting response
    curves over the dimension as *generalization gradients*. Generalization has been
    studied extensively in psychology (Kalish 1969a,b,c,d; Mackintosh 1974), ethology
    (Baerends & Drent 1982; Baerends & Kruijt 1973) and behavioral ecology (Enquist
    & Arak 1998; Ryan 1990). These empirical studies show that generalization is a
    fundamental phenomenon. The main features of generalization are independent of
    what species we study (e.g., human, rat, chicken, pigeon, goldfish or butterfly),
    what behavior system is engaged by the stimuli (e.g., hunger, thirst or sex),
    what sensory modality is probed (e.g., vision, sound or touch) and whether the
    response is learned or innate (Ghirlanda & Enquist 2003).


    Below we analyze our model along two important kinds of stimulus dimensions called
    *rearrangement* and *intensity* dimensions (details follow). These are the most
    empirically investigated dimensions and can be given a simple explanation on a
    receptor space. These two kinds of dimensions give very different results in animal
    experiments and therefore are a good test for models of stimulus control. The
    testing procedure is conceptually identical to studies of generalization in animals:
    a behavior map such as the one in Figure 3.7 is established, and then network
    responses to a set of test stimuli, modeling a particular empirical test, are
    observed.


    # 3.3.1.1 Rearrangement dimensions


    Varying stimulation along a "rearrangement dimension" means changing the *pattern*
    of stimulation while keeping total *intensity* unchanged (at least approximately).
    An example is variation in sound frequency. When frequency is either increased
    or decreased, the receptors in the ear most sensitive to the original frequency
    are less stimulated, whereas some other receptors get more active (Fay 1970; Galizio
    1985; Jenkins & Harrison 1960). For visual stimuli, the spatial distribution of
    stimulated'
