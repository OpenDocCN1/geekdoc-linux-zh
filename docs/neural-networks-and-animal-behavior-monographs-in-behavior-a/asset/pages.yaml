    # ## 3.7.4 Indecision


    Despite the overall stability of behavior, indecision is observed occasionally
    and has been studied extensively by ethologists (Hinde 1970). For instance, an
    animal may be uncertain whether to approach or avoid a familiar food in a novel
    environment. A few different outcomes are possible in similar conditions:


    +   1. The animal may oscillate between behaviors, e.g., first approaching and
    then retreating (a familiar thing to everyone who has attempted to feed half-tame
    animals).


    +   2. Components common to both behaviors may appear (e.g., walking would be
    appropriate to both approach and avoidance).


    +   3. A mix of components from either behavior can appear.


    +   4. A third behavior may surface that apparently has little to do with those
    in conflict (displacement activity).


    +   5. A few attempts may be necessary to switch between activities (e.g., a bird
    that has been resting for a while may make several attempts before actually taking
    off).


    These issues are complex and have not been studied with neural network models.
    We may speculate that at least some of these phenomena may occur in decision making
    networks of the kind shown in Figure 3.25. For instance, long transition times
    between activities can arise from inhibitory weights that are not much larger
    than 1. Similarly, if inhibition between nodes is weak, several nodes could be
    active simultaneously, at least for some time. This could explain the appearance
    of hybrid behavior patterns or of components of behavior common to more than one
    motivated activity. The classical ethological explanation of displacement activities
    may also be implemented in neural networks. The idea is that the two conflicting
    behaviors cancel each other by mutual inhibition, thus allowing the expression
    of'
