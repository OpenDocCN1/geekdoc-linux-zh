  md: '**W**$_{i}$ is the weight vector that conveys stimulation to output node *i*,
    the activity of the latter node is $z_i = \Sigma_j W_{ij}x_j$ (we use linear nodes
    for simplicity). For node 2 to implement Lubow’s attentional response, it should
    be highly active for novel stimuli and should lower its activity with mere exposure
    to the stimulus. It is surprisingly simple to achieve this. We assume that all
    weights W$_{2j}$ between the input neurons and the second output node are initially
    high, say, equal to 1, and subsequently change according to


    ```

    $\Delta W_{2i} = -\eta_2 z_2 x_i$

    ```


    A system with these properties has been called a “novelty detector” by Kohonen
    (1984) in the context of signal analysis. For a constant input pattern, the activity
    of node 2 is shown Figure 4.21. Note that equation (4.5) is identical to a $\delta$
    rule with 0 as desired response (see Section 2.3.2). This is a simple translation
    of Lubow’s idea that attentional responses are never reinforced and also means
    that we do not need to postulate a special learning rule for changes in attention.
    Note also that the rule does not need any global signal. If we add a positive
    term to equation (4.5), we get a model in which novelty recovers if a stimulus
    is not experienced for some time. One example is


    ```

    $\Delta W_{2i} = -\eta_1 z_2 x_i + \gamma(1-W_{2i})$

    ```


    where $\gamma > 0$. The term $1-W_{2i}$ approaches zero as W$_{2i}$ approaches
    1, which sets an upper limit to the novelty of a stimulus. Now we must specify
    how novelty or attention affects learning. We consider learning by the $\delta$
    rule for simplicity. We modify the standard $\delta$ rule by including novelty
    as a global signal able to affect the rate of learning as follows:


    ```

    $\Delta W_{li} = \eta_1 z_2 (\lambda-z_2)x_i$

    ```


    This is consistent both with Lubow’s theory and with the learning rate modulation
    present in most psychological models of latent inhibition. According to equation
    (4.7), learning proceeds faster for stimuli of higher novelty, as required to
    reproduce the phenomenon of latent inhibition (Figure 4.20).


    Several considerations can be made at this point. First, we refer the reader to
    Lubov (1989) for further details of conditioned attention theory. Second, we note
    that using a network model yields automatically a number of features observed
    in latent inhibition, e.g., generalization of latent inhibition and greater inhibition
    for more intense stimuli (because novelty decreases faster; see Lubow 1989). Lastly,
    we are not aware of specific physiological evidence bearing on our assumption
    that novelty affects learning as a global modulating factor. However, this hypothesis
    could be a starting point for research into animal behavior in response to novelty.
    For instance, the novelty node could inhibit output nodes to model the initial
    caution that most animals show in novel environments (Russell 1973).


