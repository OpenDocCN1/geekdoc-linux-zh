    The study of animal learning encompasses a number of phenomena and procedures.
    In addition to instrumental conditioning (see, e.g., Klein 2002; Mackintosh 1974;
    Pearce 1997; Skinner 1938) and classical conditioning (e.g., Klein 2002; Mackintosh
    1974; Pavlov 1927; Pearce 1997), other study areas include perceptual learning
    (e.g., Gibson 1969; Hall 2001), habituation and sensitization (Horn 1967; Klein
    2002), filial and sexual imprinting (Bolhuis 1991; Immelmann 1972; Lorenz 1935),
    song learning (Slater 2003; Thorpe 1958) and social learning (Hayes & Galef 1996).
    In addition, these broad categories include subcategories and host a variety findings.


    Neural networks may account for most of this diversity, although much work is
    still needed to explore these potentials. Some neural network applications of
    learning are based on local factors only (e.g., models of perceptual learning,
    Section 4.4, and habituation; Horn 1967; Kandel et al. 2000), but most applications
    also include a suitably designed global signal that interacts with local factors
    to cause weight changes. An illustrative example is the work on various types
