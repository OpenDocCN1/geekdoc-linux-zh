    of nervous systems and underlies their more sophisticated abilities. For instance,
    feedback is very common in the cerebral cortex, both within and between different
    cortical areas.


    The behavior of recurrent networks can be very diverse (Amit 1989; Dayan & Abbott
    2001; Hertz et al. 1991). In response to a constant input, a recurrent network
    may settle into a persistent pattern of activity (possibly a different one for
    different inputs), it may cycle repeatedly through a sequence of states, or it
    may exhibit irregular behavior. When the input varies in time, the network generally
    will not settle into one pattern of activity but will generate a sequence of output
    patterns, in principle of arbitrary complexity. Thus recurrent networks appear
    a promising tool to model time structures in animal behavior but also a tool that
    is not trivial to handle. In Section 2.3.5 we will show a few recurrent architectures
    and how to build a recurrent network with desired properties. In the following
