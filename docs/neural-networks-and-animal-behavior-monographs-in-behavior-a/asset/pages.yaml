  md: '# **3.8.3  Motor pattern generation in neural networks**


    We have already seen that neural networks can analyze sensory information and
    take appropriate decisions. Here we show how they can also model the control of
    movement. In animals, a behavioral response is the result of coordinated activity
    in many muscles. Essentially, motor control can be seen as a map from decisions,
    or central states, onto muscle activities via patterns of activity in motor neurons
    (Amirikian & Georgopoulos 2003; Flash & Sejnowski 2001). In contrast to sensory
    processing and decision making, where the mapping is from many inputs to few outputs,
    motor control is a map from few pattern-generating neurons to many motoneurons.
    To generate a given behavior, some muscles must contract and others relax. The
    extent of contractions and relaxations may also vary. Furthermore, motor acts
    almost always involve sequences of muscle coordinations, which require pattern
    generation over time. Indeed, much behavior consists of repeating the same elementary
    motor pattern many times. These behaviors include locomotion, chewing, many displays
    used in communication, breathing and the beating of the heart. Such cyclicity
    may be generated by an oscillating central pattern generator (Bullock 1961; Marder
    & Calabrese 1996), which in nervous systems can be driven by pacemaker neurons
    (Wang & Rinzel 2003) and/or on reciprocal inhibition among nerve cells (Hill et
    al. 2003). Many motor patterns are not repeated but still are generated over a
    period of time. Figure 3.37 illustrates how swallowing involves a centrally generated
    sequence of tightly control muscle coordinations.


    Figure 3.38 shows three simple examples of neural networks able to generate motor
    patterns. The first network models a simple behavior that consists of one single
    coordination of muscle activity (no sequences). For instance, stretching a limb
    involves contracting abductor muscles and relaxing adductors. Bending the limb
    involves the opposite action. In the network, a command signal (a decision made
    according to the mechanisms treated above) starts a pattern generator (here consisting
    of just one node and its connections to motoneurons) that activates two motoneurons.
    To stretch the limb, the motoneuron connected to the abductor muscle is stimulated,
    whereas the motoneuron connected to the adductor muscle is inhibited. The second
    network in Figure 3.38 shows how to extend the mechanism so that one motor command
    stretches the limb, and another bends it. Lastly, the third network in the figure
    shows how alternated stretching and folding can be generated by including an oscillator
    node within the pattern generator. If the oscillator node has a period of two
    time units, the limb will be stretched in one time unit and bent in the next,
    and then stretched again and so forth.


    From these examples, and with some imagination, one can see how a pattern generator
    connected to many motoneurons could coordinate the stretching and bending of many
    muscles, thereby allowing an animal to, for instance, swim or walk. An illustrative
    example is the network model of human walking developed by Prentice et al. (1998).
    The model consists of two networks with different functions, as suggested by behavioral
    data (see references in Prentice et al. 1998). The first network maps a constant
    input into alternated oscillatory activity of two output nodes. The constant input
    represents the decision to walk at a given speed, with stronger input meaning
    higher speed. The frequency of the oscillating output is the frequency of'
