  md: '# **2.3.2 Gradient descent methods ($\delta$ rule, back-propagation)**


    In this section and the next we introduce weight-setting methods that require
    a so-called objective function for their operation. These methods can work with
    non-linear networks of, in principle, arbitrary complexity. Indeed, the methods
    are very general and work with any input-output map with adjustable parameters
    (Mitchell 1996; Widrow & Stearns 1985). An *objective function* is simply a measure
    of network performance. It may indicate either how much the actual and desired
    maps differ (*error measure*) or how close they are (*performance measure*). It
    is a matter of convenience and partly of historical accident what measure is used
    in each particular case. If we use an error measure, the aim is to find weights
    that minimize it, whereas performance measures should be maximized. Setting weights
    in neural networks thus can be viewed as a function minimization or maximization
    problem (Aubin 1995; Widrow & Stearns 1985).


    While many measures of performance are in use (Section 2.3.3), the *squared error*
    is by far the most popular error measure. Relative to the task (2.21), it is defined
    as follows. We introduce first the error relative to the input-output pair (\mathbf{x}_{\alpha},
    \mathbf{d}_{\alpha}) by summing the squared deviations between desired and actual
    output for each output node:


    ```

    $$E_{\alpha}(\mathbf{W}) = \frac{1}{2} \sum_i (d_{\alpha i} - r_{\alpha i}(\mathbf{x}_{\alpha}))^2
    \tag{2.32}$$

    ```


    The notation $E_{\alpha}(\mathbf{W})$ emphasizes that the error is a function
    of the weights. The leading half serves merely to simplify notation later on.
    The square error relative to the whole task in equation (2.21) is defined as


    ```

    $$E(\mathbf{W}) = \sum_{\alpha} E_{\alpha}(\mathbf{W}) \tag{2.33}$$

    ```


    Clearly, the smaller the squared error, the closer we are to meeting the requirements
    of equation (2.21). Only when the squared error vanishes is the desired map established.


    We are now ready to illustrate *gradient descent* methods of error minimization.
    Let us consider a network with only two weights, $\mathbf{W} = (W_1, W_2)$, and
    let us assume that the squared error $E(W_1, W_2)$ relative to the task is known
    for every value of $W_1$ and $W_2$. The triplet $(W_1, W_2, E(W_1, W_2))$ can
    be represented as a point in a three-dimensional coordinate space. When the weights
    vary, so does $E(W_1, W_2)$, and the point describes a surface known as the *error
    surface* (Figure 2.9). This allows us to visualize the values of the error for
    different weight choices. The quickest way to decrease the error is to travel
    on the error surface in the direction where the slope downward is steepest. To
    find what weight changes correspond to such a direction, one considers the *gradient*
    vector relative to the surface. This is written $\nabla E(\mathbf{W})$ and is
    defined as the vector whose components are the (partial) derivatives of $E(\mathbf{W})$
    with respect to the weights:


    ```

    $$\nabla E(\mathbf{W}) = \begin{pmatrix}\frac{\partial E(\mathbf{W})}{\partial
    W_{11}}\\\vdots\\\frac{\partial E(\mathbf{W})}{\partial W_{NN}}\\\end{pmatrix}
    \tag{2.34}$$

    ```'
