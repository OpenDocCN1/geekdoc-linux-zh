    # 4.5.3 Responding after learning


    At the behavial level, the results of learning are studied by exploring changes
    in responding to stimuli. In this book we have drawn a clear conceptual distinction
    between the behavioral map (how responses are generated from stimuli) and learning
    (how the behavioral map is changed by experiences). It is important to note, however,
    that features of the behavioral map are also important when we study learning.
    For instance, we saw earlier that assuming different representations of stimuli
    can lead to different predictions about learning phenomena. This suggests that
    we cannot study learning separately from representation, as most of learning theory
    does.


