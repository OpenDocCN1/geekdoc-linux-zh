  md: '2.3.2.1 The delta rule


    To compute the squared error and its gradient, one needs to know the output to
    all inputs and how it changes when changing any weight. A real input-output mechanism
    may not have all this information. For instance, input-output pairs are necessarily
    experienced in a sequence, and to remember previous inputs and outputs requires
    a memory external to the network. Without this memory, the best one can do is
    to compute the error relative to the current input, equation (2.32), rather than
    the full squared error, equation (2.33). This leads to the best known applications
    of gradient methods to neural networks (in particular feedforward networks). Applied
    to networks without hidden nodes, the method is known as the \( \delta \) rule,
    thus named by McClelland and Rumelhart (1985) but known since Widrow and Hoff
    (1960) under the less appealing name of least-mean-squares algorithm. We begin
    with a single output node, in which case the instantaneous error is (we drop for
    simplicity the index \( a \) in equation 2.32):


    \( E = \frac{1}{2}(d - r)^2 \) (2.36)


    where \( r = \mathbf{W} \cdot \mathbf{x} \) is the response to \( \mathbf{x} \).
    To calculate the derivative \( \partial E/\partial W_i \), note first that the
    derivative \( \partial r/\partial W_i \) is simply \( x_i \). Hence


    \(\begin{align*} \frac{\partial E}{\partial W_i} &= -(d - r)\frac{\partial r}{\partial
    W_i} \\ &= -(d - r)x_i \end{align*}\) (2.37)


    Thus, following equation (2.35), each weight is incremented by


    \( \Delta W_i = \eta(d - r)x_i \) (2.38)


    which is the \( \delta \) rule. It is so called because the difference \( d -
    r \) was written \( \delta \) by McClelland and Rumelhart (1985), yielding the
    even simpler expression


    \( \Delta W_i = \eta\delta x_i \) (2.39)


    (having dropped the index \( a \), we recall that \( \mathbf{x} \) represents
    current input, i.e., one of the \( \mathbf{x}_a \)''s for which a desired output
    \( a_a \) must be established; likewise, \( \delta \) is the error relative to
    the current input).


    The \( \delta \) rule, it can be proved, will find a weight vector that, across
    the presentation of different inputs, keeps close to the one that minimizes the
    total squared error, provided the inputs are presented in random order and \(
    \eta \) is small enough (Widrow & Stearns 1985). Thus, in the case of networks
    without hidden layers, dealing with only one input at a time is not a serious
    restriction (because the error surface of these networks has a single minimum;
    see Widrow & Stearns 1985).


    A reason why the \( \delta \) rule is so popular is that equation (2.38) can be
    derived and understood intuitively without much mathematics as follows (Blough
    1975; extending Rescorla & Wagner 1972). The term \( d - r \) is the difference
    between desired and actual output, which is positive (negative) when actual responding
    is lower (higher) than desired responding and null when actual behavior matches
    desired behavior. That is, \( d - r \) has the same sign as the desired change
    in response. Moreover, its absolute value is larger the more actual output departs
    from desired output. Thus, it'
