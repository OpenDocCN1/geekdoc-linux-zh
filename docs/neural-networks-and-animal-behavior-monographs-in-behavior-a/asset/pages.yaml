    weights that are linked to more active input nodes, under the intuitive justification
    that these weights contribute most to an incorrect output to x.


    The δ rule can easily solve the example task introduced earlier. The solid lines
    in Figure 2.10 are learning curves (network output as a function of algorithm
    iterations) from a simulation that uses the δ rule to solve the task. The dotted
    lines show that full gradient descent (based on the complete squared error, equation
    2.33) solves the same task faster and more smoothly. The formula for full gradient
    descent is simply the δ rule formula summed over all input-output relationships:


    ```

    $$ \Delta W_{i} = \eta \sum_{\alpha} (d_{\alpha} - r_{\alpha}) x_{\alpha i} \quad
    (2.40) $$

    ```


    The δ rule can also be extended to a nonlinear output node, where r = f(W · x).
    Repeating the steps leading to equation (2.38), we get


    ```

    $$ \Delta W_{i} = \eta (d - r) f''(W \cdot x) x_{i} \quad (2.41) $$

    ```


    The only addition is the term f′(W · x). Actually, equation (2.38) can be used
    even when the output node is nonlinear (Hinton 1989). The δ rule can also be applied
    to networks with more output nodes. The weight matrix W is seen as made of weight
    vectors W₁, …, Wₐ, where Wⱼ connects the input nodes to output node j. Since these
    weight vectors are independent of each other, one simply applies the δ rule to
    each one, getting


    ```

    $$ \Delta W_{ij} = \eta (d_{j} - r_{j}) x_{i} \quad (2.42) $$

    ```


