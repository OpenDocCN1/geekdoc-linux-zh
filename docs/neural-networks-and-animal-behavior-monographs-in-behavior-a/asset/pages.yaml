    # ### 1.4.3 Neural network models in animal behavior research


    It may seem obvious that students of animal behavior should have embraced neural
    network models, but this has not been the case. The situation is rather the opposite.
    With some exceptions, neural network models have been ignored among ethologists,
    behavioral ecologists and animal psychologists. For instance, they are absent
    from most textbooks on animal behavior. The most important exception, of course,
    is neuroethologists (Cliff 2003; Simmons & Young 1999), but their focus is not
    primarily on general theories of behavior in the sense discussed in this chapter.
    Neural networks are now increasingly popular in neuroscience (e.g., Dayan & Abbott
    2001), where recent and important advances on our understanding of learning rely
    extensively on neural network models (Chapter 4).


    Of course, students of animal behavior have thought regularly about the neural
    machinery underlying behavior. For example, both Ivan Pavlov and Edward Thorndike
    speculated on the nervous structures behind their behavioral observations. The
    concept of connectionism, now often used as a label for neural network research,
    can also be traced back to these pioneers (Kandel et al. 2000; Morrow & Klein
    2001). Less often recognized are a number of network-like models by ethologists
    and animal psychologists (Baerends 1971; Brough 1975; Fentress 1976; Hinde 1970;
    Horn 1967; Sutherland 1959; Thompson 1965). Figure 1.11 shows three such models.
    Baerend''s (1971) model at top left is similar to Rosenblatt''s perceptron (Figure
    1.10) and continues the tradition of ethological summation models (Section 1.3.3).
    The response arises from the weighted sum of signals from “evaluation units” (*E*),
    which in turn analyze signals from receptors (*R*). The model by Brough (1975;
    discussed in Chapter 3) has a similar structure and also rediscovers Widrow and
    Hoff’s learning rule first published in 1960. Figure 1.11 also shows Thompson''s
    model from 1965. Its aim was to illustrate how generalization (similar responses
    to different stimuli) can arise from the fact that similar stimuli are processed
    by partially overlapping sets of neurons. This is a classical idea, present in
    Pavlov (1927), as well as in current neural network models (Chapter 3). The last
    model in the figure is Sutherland''s intriguing model from as early as 1959. It
    depicts a multilayer network with adjustable connections around the same time
    as Rosenblatt published his work on perceptrons (Sutherland 1959, 1964; Sutherland
    & Mackintosh 1971). It is interesting that these early efforts by biologists and
    psychologists developed with little or no contact with that part of the artificial
    intelligence community that in the same years actively pursued neural networks.'
