    # ### 1.4.1 Features of neural network models


    Neural network models have many features particularly appealing to students of
    behavior that we will try to communicate in this book. Here we provide a brief
    summary of such features, to be justified more fully in the following chapters.
    We first consider the list of requirements on page 7:


    +   * **Versatility:** Neural network models can implement practically any behavior
    map (Haykin 1999). A particular network may be fitted to many requirements, and
    additional flexibility is achieved by considering different network architectures.

    +   * **Robustness:** The operation of a neural network is seldom affected in
    major ways by damage to a small fraction of nodes or connections. The performance
    of each task is divided among many nodes, and memories are encoded over many connection
    weights (of course, this does not hold for very small networks or nervous systems).

    +   * **Learning:** Learning has been a prominent part of neural network research
    since its beginnings. Networks can learn by means of procedures that change connection
    weights either autonomously or under external guidance. From a physiological point
    of view, most training procedures have several or many unrealistic features, but
    progress in this area has been steady over the last few decades.

    +   * **Ontogeny:** Neural network models to date have not been applied system
    atically to problems of behavioral ontogeny. Some applications have been developed,
    with encouraging results (Chapter 4).'
  merge: -1
  img_proc: true
- pgno: 34
  md: '+   • Evolution: Various features of neural network models, such as architecture,
    learning rules and properties of connections and nodes, can be assumed to arise
    from different "genes." Computer simulations of behavioral evolution can be set
    up to investigate what networks evolve to solve particular tasks. Such investigations
    are still at their beginnings. One obstacle is that we still ignore a lot about
    how genes control nervous system development.


    Other features of neural network models are also relevant to modeling behavior:


    +   • Structural constraints: The structure of these models essentially is based
    on knowledge of the nervous system: it is not inferred from observations of behavior
    or from functional considerations. In this sense, neural network models are unique
    among models of behavior. Such constraints, when used properly, can greatly diminish
    the danger of introducing processes that cannot have a counterpart in biological
    nervous systems.


    +   • Parallel processing: Processing in neural network is mainly parallel rather
    than sequential, as in digital computers. This means that the processes from reception
    of stimuli to responses can occur in much fewer cycles of operation, each consisting
    of many thousands or millions of simultaneous computations. This is an important
    step toward matching the abilities of nervous systems to react very quickly in
    a large range of conditions.


    +   • Generalization: In new situations, animals show systematic generalization
    based on similar past conditions, and this is a crucial part of their ability
    to confront the world. As a consequence of their structure, many network models
    generalize naturally. This is a great advantage compared with models that either
    ignore generalization (Section 1.3.2) or simply assume that it occurs (Section
    3.3.3).


    +   • Definiteness and accessibility: Since neural network models are specified
    formally, they can be investigated in all details of operation. They can be studied
    with tools such as the theory of dynamical systems and computer simulations or
    in much the same ways as neurophysiologists study nervous systems. For instance,
    one can study what happens when a specific part of the network is damaged or removed.
    This can bring insight into network operation and can also be compared with lesion
    studies in nervous systems.


    +   • Unifying power: Neural network models can be applied to all aspects of behavior:
    processing of stimuli, central processing and motor control. Neural networks can
    learn, and the substrate of memory (connection weights) is clear. Most approaches
    to behavior, on the other hand, are geared toward specific aspects (e.g., perception
    or cognition) and may have problems at producing a unified theory of behavior.


