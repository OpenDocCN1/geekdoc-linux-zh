    \ effect of habituation. The latter can be seen by calculating steady-state node\
    \ activity arising from a constant input $y$. Setting $\\Delta z(t) = 0$ and $\\\
    Delta h(t) = 0$ in the preceding equations, we obtain two equations for the steady-state\
