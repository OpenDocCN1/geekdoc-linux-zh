    # ### 5.4.3 Simulation techniques


    How can we study behavioral evolution with neural network models? Sections 2.3.3
    and 2.5 provide a brief technical introduction and some examples. Most simulations
    are built around the following core steps:


    +   1. Create an initial population of networks.

    +   2. Calculate the fitness of all networks.

    +   3. Based on fitness, decide which networks “reproduce” and how much.

    +   4. Mutate some networks.

    +   5. If a stop criterion is fulfilled, end; otherwise, go to step 2.


    (We refer only to “networks,” but other traits such as morphology can be included.)


    In addition to this general procedure, a number of details have to be decided
    before a real simulation can be carried out. One is how mutants should be produced;
    i.e., what variables can mutate, and how exactly do they mutate? Other relevant
    details are the size of populations and the mode of reproduction. The simplest
    choice is a population size of two and asexual reproduction. The general procedure
    then takes the following form:


    +   1. Select an initial network (network 1).

    +   2. Calculate the fitness of network 1.

    +   3. Make a copy of network 1, called network 2.

    +   4. Mutate network 2.

    +   5. Calculate the fitness of network 2.

    +   6. Compare the fitness of networks 1 and 2.

    +   7. Retain the fitter network and label it network 1.

    +   8. If a stop criterion is fulfilled, end; otherwise, go to step 2.


    This simple algorithm can be developed along several lines to suit specific problems.
    One obvious extension is to use a larger network population. Using a population
    introduces a natural range of variability that is particularly important when
    simulating evolutionary games (frequency-dependent selection). In a population,
    mutations with higher fitness enter slowly, and adaptation to the social environment
    may require to confront a range of different phenotypes. It is also possible to
    consider sexual reproduction by defining how offspring networks are created from
    parent networks. The latter is not trivial because, as discussed in Section 5.3,
    we do not fully understand how genes code for nervous systems. Lastly, we may
    include'
