    # 3.5.1 **Optomotor responses in flies**


    Biologists often admire the ability with which animals perform complex tasks.
    Although some abilities may seem to require very specific engineering, we can
    also realize that general principles may be used and need not be reinvented. One
    such principle is that by tapping information from preceding neural layers we
    can often build a more useful representation that makes the task a little simpler.
    Consider an animal such as a fly, which needs to maintain a particular flight
    course relying on continuous feedback from its surroundings. We can study how
    the fly uses information from the environment by placing a tethered fly within
    a cylinder with vertical stripes (Figure 3.20). If the cylinder is rotated, the
    fly perceives a deviation from the intended course and responds to maintain course
    relative to the movement of the cylinder (Simmons & Young 1999). Such a transformation
    between visual input and flight control movements is called an *optomotor response*.


