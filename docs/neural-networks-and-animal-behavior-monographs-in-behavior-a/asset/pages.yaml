    Figure 3.40 Consequence of damage on rearrangement and size generalization in
    a two-layer neural network (Section 3.3.1). The network is tested before (continuous
    line) and after (dotted line) severing 4 of 25 weights (number 1, 7, 14 and 18
    in Figure 3.10).


    but can grow back even after *all* connections have been cut! In general, small
    nervous systems are sensitive to damage because each individual neuron and synapse
    makes a substantial contribution, indeed often a unique one. For instance, only
    one neuron in the pattern generator of the pond snail is capable of self-generated
    activity (see also Figure 1.8 on page 18 and Figure 3.36 on page 118). Large nervous
    systems, in contrast, exhibit various degrees of redundancy; i.e., workload is
    shared among many neurons with similar function. This is crucial to their robustness.
    Additionally, nervous systems do not passively accept damage, even when they cannot
    replace dead cells. Extensive reorganization (learning) may occur that can often
    compensate for the smaller amount of resources available after a lesion.


    Neural networks and nervous systems share many similarities in their behavior
    following damage. This essentially stems from their common network structure.
    We should emphasize at this point that so far have dealt with minimal models for
    simplicity. Clearly, these models, like small nervous systems, have little resistance
    to damage. Any damage to the networks in Figure 3.21 or Figure 3.25, for instance,
    would render them not functional. In these and other cases, however, we can use
    larger networks with the same patterns of connectivity. For instance, each node
    in Figure 3.21 could be replaced by many nodes. Such a model could function in
    essentially the same way while being more robust to damage. Resistance to damage
    improves quickly with network size. For instance, severing one or two connections
    in a two-layer network with 25 input units has only minor consequences on its
    ability to generalize (Figure 3.40). The reason is that, as in large nervous systems,
    the function of each node partially overlaps with the function of other nodes.


    The comparison of damage consequences in neural network models and nervous systems
    has proven very rewarding (e.g., Plaut & Shallice 1994). Network models of particular
    abilities such as memory or aspects of language in humans have been set up and
    then lesioned so as to mimic actual lesions. The networks often exhibit deficits
    comparable with those seen in nervous systems.'
