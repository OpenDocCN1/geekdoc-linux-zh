  md: '1985; McFarland 1999; Roper 1983). From a functional and evolutionary point
    of view, constraints and predispositions may ensure that animals learn the right
    thing and learn quickly when this is crucial.


    Constraints and predispositions are revealed in many studies. For instance, classical
    conditioning sometimes involves a response to the CS that differs from the response
    to the US. For example, a rat may freeze to a sound signaling shock but escape
    the shock itself. It often makes sense to freeze (to avoid detection) or become
    vigilant (find out were the predator is) in response to a stimulus predicting
    the presence of a predator rather than to flee. A neural network model of this
    finding would include a global signal that targets weights that connect the CS
    with a response not performed to the US.


    Other examples include experiments demonstrating that some associations can be
    learned, whereas others cannot. García and Koelling (1966) exposed rats to water
    with a novel taste (see also Domjan 1980). Rats from both groups then experienced
    either illness (induced) or an electric shock. Subsequent testing showed that
    rats could readily learn associations between taste and illness but not between
    illness and a compound of a flashing light and a clicking sound. The opposite
    result was obtained when an electric shock was used instead of induced illness.
    The results are summarized in Figure 4.6. Similar results were obtained by Shettleworth
    (1975, 1978), who tried to condition golden hamsters to perform a variety of behaviors
    using food and nest material as reinforcers (Figure 4.6). Behavior patterns such
    as “scrabble” and “open rear,” which are used in foraging and nest building, could
    be conditioned with these reinforcers but not “face washing” behavior, which is
    used to groom the face.


    Predispositions have also been seen in filial imprinting (Bolhuis & Hogan 1999;
    Horn 1985) and in observational learning of snake fear in monkeys (Mineka & Cook
    1988). In the latter case, naive laboratory-bred rhesus monkeys were shown a video
    of another monkey behaving fearfully in the presence of a variety of stimuli.
    The first monkey is subsequently exposed to these stimuli to look for evidence
    of acquired fear. These studies have indicated that monkeys who are not initially
    afraid of snakes will rapidly acquire an intense fear when they have watched another
    monkey behaving fearfully in response to a toy snake, whereas fear of other stimuli
    is acquired more slowly.


    A different example shows how learning sometimes is highly specialized to deal
    with particular problems. Generally, associative learning proceeds faster when
    the delay between the events to be associated is small; e.g., less than one minute
    is usually required for effective instrumental conditioning (Roper 1983). There
    is a functional reason for this. In most cases, the likelihood of a causal link
    between behavior and the reward quickly diminishes as time goes on. Bad food,
    however, is an exception because it may cause illness first several hours after
    ingestion. This fact seems to be reflected in taste-aversion learning, in that
    association between taste and illness is established even though the interval
    between them is several hours (Figure 4.7).


