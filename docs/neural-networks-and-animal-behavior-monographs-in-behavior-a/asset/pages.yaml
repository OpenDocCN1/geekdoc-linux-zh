    # 3.7.5 Organization of behavior in time


    Often behavior must have a certain organization in time to be functional (Section
    3.1). Animals have more specific needs than we have considered so far. For instance,
    the problem of feeding does not end with the decision to eat: a number of different
    activities (e.g., searching and handling food and swallowing) must be coordinated
    in a functional behavior sequence. In this section we show how a number of requirements
    on behavior sequences can be implemented by appropriately structuring the decision
    making mechanism.


    To understand behavior sequences, we must keep in mind that a behavioral response
    may partly change the motivational state that caused the response (Sections 1.2.2
    and 3.2.2). This may happen via two routes. First, behavior may cause a change
    in the external or internal environment that the animal perceives at a later time.
    For instance, drinking changes body water volume, which is one of the causal factors
    for drinking itself. Second, a state within the decision making mechanism can
    change. This is required, for instance, when a given behavior sequence must be
    performed in the absence of significant or reliable changes in stimulation. We
    have called such states *regulatory states* (Section 1.2). The simple decision
    maker examined above (Figure 3.25) already has regulatory states that are crucial
    to its abilities. The network, in fact, is not simply input-driven. For instance,
    in Figure 3.29, the input at *t* = 21 and *t* = 35 is identical, but the pattern
