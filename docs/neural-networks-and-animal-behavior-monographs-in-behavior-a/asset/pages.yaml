  md: 'in the field of neural networks until publication of the back-propagation algorithm

    by Rumelhart et al. (1986). For simplicity, we begin with a network with a single

    hidden layer. We write **V**, the weights from input to hidden nodes; **h**, the
    activities

    of hidden nodes; and **W**, the weights from hidden to output nodes. The activity
    of

    output node *k* is thus


    ```

    $$r _ { k } = f \bigg ( \sum _ { i } W _ { k i } h _ { i } \bigg ) \eqno ( 2 .
    4 3 )$$

    ```


    with


    ```

    $$h _ { i } = f \bigg ( \sum _ { j } V _ { i j } x _ { j } \bigg ) \eqno ( 2 .
    4 4 )$$

    ```


    Technically, the back-propagation algorithm can be obtained by calculating the

    derivative of the preceding equations with respect to the weights, and then using

    the gradient descent formula, equation (2.35). The algorithm, however, can also
    be

    described starting from the $\delta$ rule. Note first that the hidden and output
    layers form

    a two-layer network that we can train by the $\delta$ rule:


    ```

    $$\Delta \mathbf { W } _ { k i } = \eta f ^ { \prime } ( y _ { k } ) \delta _
    { k } h _ { i } \eqno ( 2 . 4 5 )$$

    ```


    where $y _ { k } = \sum _ { i } W _ { k i } h _ { i }$ is the input received by
    output node *k*, and $\delta _ { k } = d _ { k } - r _ { k }$. What

    we lack is a formula to change the weights between input and hidden nodes. It

    seems that we cannot use the $\delta$ rule again because for hidden nodes *we
    have no*

    *concept of a desired output*, which means that we cannot calculate a $\delta$
    term. The

    solution, with hindsight, is rather simple: the term $\delta _ { i }$, relative
    to hidden node *i*, is a

    weighted sum of the terms $\delta _ { k}$ relative to the output nodes, where
    the weight of $\delta _ { k }$ is

    exactly $W _ { k i }$, i.e., the weight linking hidden node *i* to output node
    *k* (Haklyn 1999;

    O''Reilly & Munakata 2000). Formally,


    ```

    $$\delta _ { i } = \sum _ { k } \delta _ { k } W _ { k i } \eqno ( 2 . 4 6 )$$

    ```


    Now that a $\delta$ term is defined, we can apply the $\delta$ rule as usual:


    ```

    $$\Delta \mathbf { V } _ { i j } = \eta f ^ { \prime } ( y _ { i } ) \delta _
    { i } x _ { j } \eqno ( 2 . 4 7 )$$

    ```


    where $y _ { i } = \sum _ { j } V _ { i j } x _ { j }$. Equations (2.45) and (2.47)
    are the back-propagation algo-

    rithm. The algorithm can be generalized easily to networks with more than one

    hidden layer using $\delta$ terms of later layers to define $\delta$ terms in
    earlier layers. This

    backward construction of $\delta$ terms gave the algorithm its name.


    # **2.3.3 Random search**


    Random search is an increasingly popular way of setting network weights, mostly

    because of its simplicity and power in many practical cases. Random search meth-

    ods are also called *genetic algorithms* or *evolutionary algorithms* for reasons
    that

    will soon be clear (Holland 1975; Mitchell 1996). The basic procedure is as fol-

    low s. From an initial network, typically with randomly set weights, some “mu-

    tants” are generated. Mutants differ from the initial network and from each other

    in a few weights, usually picked at random and modified by adding a small random'
