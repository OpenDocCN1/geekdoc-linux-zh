    # 3.9 CONSEQUENCES OF DAMAGE TO NERVOUS SYSTEMS


    Often limited damage to nervous systems leaves performance relatively unaffected.
    This is especially true when we compare nervous systems with the products of human
    engineering, say, a television. A further example is that of a computer program,
    which often can be broken by changing a single bit. Such resistance to damage
    is reached by several routes. Small biological neural networks can be severely
    affected by lesions but often can regenerate. The pond snail (*L. stagnalis*),
    for instance, breathes by a central pattern generator of just three neurons (Taylor
    & Lukowiak 2000). The circuit stops working properly if any of the connections
    is cut'
