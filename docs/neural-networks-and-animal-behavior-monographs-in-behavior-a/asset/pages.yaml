    We have seen in Chapter 2 that neural network theory provides an extensive toolbox
    for achieving memory changes in network models. To what extent do these techniques
    help us to understand how animals learn? This is a complex issue. Learning has
    always been the central topic of neural network research (Arbib 2003; Haykin 1999),
    but biological realism is not always a goal, especially in engineering applications.
    The analysis of neural network learning algorithms in terms of local and global
    factors can lead to insights into their biological plausibility. We can formalize
    the preceding argument by saying that the change \(\Delta W\) is a function of
    the current weight value \(W\), the activity or other state variables of the preceding
    node \(x\) and the subsequent node \(z\) (the local factors), and global signals
    \(\mathbf{g}\). This is illustrated in Figure 4.2 and formally by


    ```

    \[\Delta W \, = \, l(\mathbf{W}, x, z, \mathbf{g})\]

    ```


    where \(l\) is a suitable function. In nervous systems, the most important local
    factors that influence synaptic change appear to be the states of the pre- and
    postsynaptic neurons, in particular the state (membrane potential, ionic concentrations,
    etc.) of the presynaptic cell at the time the presynaptic cell fires (Dayan \&
    Abbot 2001 and references therein). In neural networks, global factors include
    all variables that influence weight updates but that do not belong to the two
    nodes and the connection between them. Global factors can control learning in
    several ways. The two main ones are what global information enters the local mechanism
    for weight update and to which weights the information is given (Figure 4.3).
    A global signal, in principle, can convey many kinds of information. It may originate
    from nodes in the neighborhood of the connection but also from nodes far away.
    Furthermore, the global signal may be the output of a single node (including a
    receptor), or it may result from processing within a whole network that gathers
    input from many nodes and receptors. The latter yields a very versatile system
    because it becomes possible to produce almost any map from node and receptor activities
    to global signals. The specificity of a global signal controls which connections
    are influenced, adding further flexibility to learning processes. For instance,
    a global signal may be delivered to nodes that control a particular behavior pattern
    but not to others.'
