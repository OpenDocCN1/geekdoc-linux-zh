    simulated evolution (Nolfi et al. 1994). Left: Each node grows an "axon" following
    genetic instructions, with amount of growth also influenced by node input. Center:
    The nodes whose axons touch are connected together. Right: The final network is
    obtained by eliminating isolated and nonfunctional nodes. The bottom nodes represent
    receptors, the top ones effectors. Reprinted from Nolfi and Floreano (2002), Evolutionary
    Robotics. The MIT Press.


    A few studies have considered genetic coding of network parameters other than
    the weights. For instance, Rolls and Stringer (2000) simulate evolution of network
    parameters in three kinds of networks that can learn on their own by modifying
    the weights: pattern-association networks (e.g., classical conditioning), autoassociative
    networks (e.g., short-term memory) and competitive networks (e.g., perceptual
    learning). A number of genes were assumed to control specific network properties,
    such as rules for the formation of connections, operation of neurons and learning.
    All three networks were subject to evolution with mutations and recombination.
    In each generation, the fitness of networks was calculated based on their ability
    to learn particular tasks. The learning ability of all three types of networks
    improved significantly during evolution.


    Nolfi et al. (1994), studying the evolution of navigation abilities in robots
    controlled by neural networks, encoded network architecture as follows (see also
    Nolfi 2003; Nolfi & Floreano 2000). The genotype explicitly coded the number of
    nodes and their position in a two-dimensional space, but connections resulted
    from growth of axons based on genetic instructions (Figure 5.2). The latter specified
    how long an axon would grow before branching and the direction of growth after
    branching. Stimulation received by a node could also affect growth. After a while,
    growth was stopped, and nodes whose axons touched were connected (there was no
    distinction between axons and dendrites in this model). Finally, the network was
    obtained by eliminating isolated nodes or node groups.


    In conclusion, understanding how evolution changes behavior is difficult because
    behavior is a complex product of gene action, developmental processes and nervous
    system operation. Our short discussion of brain evolution is not intended to provide
    an overview of this field but to show that neural network models can describe
    many of the structural and functional changes that are believed to be important
    in the evolution of nervous systems. Using neural network models, therefore, can
    lead to insight along several lines. First, we can gain intuitive insight by considering
    the evolution of behavior in simple model systems. Unfortunately, only a few studies
    have explored these issues, although the results suggest that neural network models
    are helpful in understanding the evolution of behavior and the nervous system.'
