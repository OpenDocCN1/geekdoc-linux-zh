    # ### 2.4 ORGANIZING NETWORKS WITHOUT SPECIFIC GUIDANCE


    So far we have considered how to establish a number of given input-output map-
    pings, but not all weight setting procedures are of this kind. Another possibility
    is to explore how weights develop when the network is exposed to sequences of
    inputs given a rule of weight change. For instance, experimental data or intuition
    about neurons and synapses may suggest a particular rule of weight change. We
    might then investigate whether the emerging weight organization resembles some
    feature of nervous systems. Alternatively, a rule of weight change may have been
    designed to produce a particular network organization, e.g., an input-output trans-
    formation that reduces noise in input patterns or enhances some of their features.
    In contrast with the preceding section, in these cases network organization emerges
    without specific feedback about whether a realistic or useful input-output map
    is being constructed. This has led to the term self-organization. It should be
    borne in mind, however, that whatever organization emerges depends crucially on
    the input fed to the network, in addition to properties of the network itself.


    It is especially interesting to consider rules of weight change based on informa-
    tion that could be available at the junctions between neurons. These may include,
    for instance, state variables of both neurons and variables that describe the
    state of the extracellular environment, such as abundance of neuromodulators.
    These remarks will be expanded in Section 4.2. We now show a few examples of how
    in- teresting organizations of the weights can emerge from the following simple
    rule:


    ```

    $\Delta W_{ij} = \eta(z_i - a)(z_j - b)$

    ```


    where $z_i$ and $z_j$ are the activities of the nodes connected by $W_{ij}$, whereas
    $a$ and $b$ are two constants. Equation (2.52) implies that $W_{ij}$ will increase
    if $z_i > a$ and $z_j > b$ or if $z_i < a$ and $z_j < b$ and decrease otherwise.
    We consider the network in Figure 2.14, with one output node that receives input
    from nodes arranged as a simple model retina. We feed this network with input
    patterns consisting of diffuse blobs of excitation (Figure 2.15, left) and apply
    equation (2.52) after each presen- tation. After repeating these steps a few hundreds
    times, we visualize the weights as a gray-scale image. Figure 2.15 shows three
    examples of how an initially ran- dom weight matrix can develop different organizations.
    The latter are often called *receptive fields* because they describe from which
    part of the retina a node receives input. Thus nodes with the receptive fields
    pictured in Figure 2.15 would react pref- erentially to images falling, respectively,
    on a well-delimited portion of the retina, on the left part of the retina, and
    anywhere on the retina but a specific portion. In a network with many such nodes,
    each one could react to stimuli on a different part'
