    So why are neural network models often absent from current animal behavior theory?
    One reason could be that neural network research emerged mainly from the artificial
    intelligence community, with a strong focus on humans rather than animals in general.
    To date, much more neural network research is concerned with humans than with
    other animals. For instance, James McClelland, one of the most productive scientist
    in the field, writes


    > Connectionist cognitive modeling is an approach to understanding the mechanisms
    of human cognition through the use of simulated networks of simple, neuronlike
    processing units. (McClelland 1999; emphasis added)


    Without a look to history, the focus on humans does not seem motivated because
    it easier to understand the neural basis of behavior in organisms less complex
    than humans. Differences between research traditions may also have hindered the
    development of neural network models of animal behavior. Most work in animal behavior
    is empirical, whereas neural network models emerged from a theoretical research
    community. Among students of animal behavior, the computer simulation techniques
    and formal mathematics that are so helpful in exploiting neural network models
    were not widely available. Terminological barriers might also have contributed.
    For instance, the term adaptive in biology is used strictly to indicate a trait
    that evolved because it increases individual reproduction (fitness). In engi-'
