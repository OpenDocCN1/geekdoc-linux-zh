    # # Systemssicherheit


    In der Startmaske ''Lokale Sicherheitskonfiguration'', die Sie unter ''Sicherheit
    und Benutzer'' aufrufen können, gibt es vier Punkte anzuwenden:

    Level 1 ist für Einzelrechner (vorkonfiguriert), Level 2 ist für Workstations
    mit Netzwerk (vorkonfiguriert), Level 3 ist für Server mit Netzwerk (vorkonfiguriert)
    und Benutzerdefiniert ist für eigene Einstellungen.


    Wenn Sie einen der ersten drei Punkte wählen, haben Sie die Möglichkeit, je nach
    Bedarf entsprechend vorkfigurierte Systemsicherheit zu übernehmen. Klicken Sie
    hierfür auf ''Beenden''. Unter ''Details'' haben Sie auch Zugang zu den einzelnen
    Einstellungen, die Sie auf Wunsch ändern können. Wenn Sie ''Benutzerdefiniert''
    wählen, gelangen Sie mit ''Weiter'' automatisch zu den verschiedenen Dialogen.
    Hier finden Sie bei der Installation vorgestellten Werte.


    +   1. ''Passworteinstellungen''


    Hier legen Sie fest, wie lang das Passwort für zukünftige Anwender mindestens
    bzw. maximal sein darf. Sinnvoll ist eine Zeichenanzahl von fünf bis acht. Ferner
    stellen Sie ein, wie lange und viele Tage vor Ablauf gewarnt werden soll (die
    Warnung erfolgt als Meldung beim Login der Textkonsole).'
