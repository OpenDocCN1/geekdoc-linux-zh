  md: '# Beispiel: Umgang mit Pfaden


    Ein weiteres Beispiel soll Ihnen veranschaulichen, wie Sie sich in der Verzeichnisstruktur
    Ihres SuSE-Linux-Systems bewegen können.


    +   - Wechsel mit cd in Ihr Home-Verzeichnis. Legen Sie ein weiteres Unterverzeichnis
    test2 über den mkdir test2 an.

    - Wechseln mit cd test2 nach und legen Sie ein Verzeichnis namens Unterverzeichnis
    an. Nutzen Sie die Expansionsfunktion, indem Sie nur Tab drücken, um den Rest
    der Zeichenkette zu ergänzen.

    - Sie befinden sich jetzt im Unterverzeichnis und sollen ohne Wechsel des Verzeichnisses
    das zuvor angelegte Testsicherung verschieben. Sie müssen dazu den Pfad zu den
    benötigten Dateien angeben. Vergessen Sie nicht den Punkt am Ende des Befehls
    mv ../test/Testsicherung ., welches das aktuelle Verzeichnis als Ziel der Verschiebung
    festlegt. Mit zwei Punkten gelangen jeweils eine ausgewene Datei in Ihr Verzeichnis.


    # Wildcards


    Weitere Vorteile der Wildcards sind die vier Zeichen. „Wildcards“ oder Jokerzeichen:


    +   ? Ersetzt genau ein beliebiges Zeichen.

    * Ersetzt beliebig viele Zeichen.


    [set] Ersetzt genau ein beliebiges Zeichen, außer in den eckigen Klammern angegebenen
    Zeichen (Zeichenkette „*set“).

    [set]] Umfasst genau ein beliebiges Zeichen, außer in den „set“ angegebenen.


    Haben Sie in Ihrem Verzeichnis die Dateien Testdatei, Testdatei2 und date und
    geben Sie ls Testdatei ein, dann erhalten Sie die Datei Testdatei und Testdatei2.
    Mit ls * erhalten Sie zusätzlich die Datei Testdatei.

    Der Befehl ls * zeigt Ihnen alle Spieldateien an, während Sie mit dem Joker-set
    jedes Zeichen ansprechen können, das als letzte Zeichen eine Zahl ist: Testdatei[1-9].

    Am wichtigsten ist immer der *-Joker: Durch seine Verwendung können Sie z. B.
    Dateien eines Verzeichnisses in anderes Verzeichnis kopieren oder löschen. Der
    Befehl rm *date* bspw. löscht alle Dateien in Ihrem Verzeichnis test, in deren
    Name die Zeichenfolge „date“ vorkommt.'
