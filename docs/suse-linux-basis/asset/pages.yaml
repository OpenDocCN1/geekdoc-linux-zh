  md: '# 4 KDE – Die Konfiguration


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_58_0.png)


    **Abbildung 4.5:** Der KDE Newsticker


    Alle verfügbaren Internetadressressen, von denen eine Nachrichtenabfrage möglich
    ist, finden Sie unter dem Reiter ''Nachrichtenquellen''. Möchten Sie die Einstellungen
    zu dieser Nachrichtenquelle ändern, welche Quelldatei, Symbol, Kategorie oder
    maximale Artikel, wählen Sie unter der Liste den Button ''Bearbeiten'' an; beim
    Hinzufügen von Nachrichtenquellen klicken Sie auf ''Hinzufügen''.


    Falls Sie nur für bestimmte Nachrichten interessieren, können Sie über den Reiter
    ''Filter'' Regeln definieren.


    Der letzte Reiter ''Einstellungen'' für den Lufttext bestimmt die Geschwindigkeit
    des Lauftextes, die Laufrichtung sowie für das Erscheinungsbild die Schriftart,
    Vordergrund-, Hintergrund- und Vorbehaltungsfarbe. Nur auf aktuelle Schlagzeilen,
    Symbole, endloser Lufttext bzw. hervorgehobene Schlagzeilen unter angezeigt werden
    sollen, definieren Sie im Abschnitt ''Verschiedenes''.


    **SOCKS** – Mit diesem Modul können Sie sich für einen SOCKS-Server oder Proxy
    eine KDE-Unterstützung einrichten.


    **Talk-Einrichtung** – Kommunizieren Sie über das Netzwerk mit anderen. Sie benötigen
    dazu den Talk-Daemon. Auf drei Registerkarten erhalten Sie umfangreiche Einstellungsmöglichkeiten:'
  merge: -1
  pgno: 58
- img_proc: true
  md: 'Nutzen Sie die Registerkarte ‘Meldung’, um das Meldeprogramm, welches Ihnen
    die Talkanfrage mitteilt und das zu startende Talkprogramm zu bestimmen. Ebenfalls
    können Sie sich akustisch darauf aufmerksam machen lassen, falls eine Talkanfrage
    vorliegt.


    Stellen Sie Ihren Anrufbeantworter nach Ihren Vorgaben ein, damit eingehende Talkanfragen
    Textnachrichten für Sie hinterlassen werden können, falls Sie die Anfrage einmal
    nicht entgegennehmen können.


    Unter ‘Weiterleitung‘ können Sie die Einstellungen vornehmen, um ankommende Talkanfragen
    auf andere Rechner weiterzuleiten.


    # Windows-Ressourcen – Dieses Modul erlaubt Zugriff auf freigegebene Laufwerke
    und Verzeichnisse in Netzwerken vorzunehmen. Um einen späteren Zugriff auf Daten
    zu erhalten, müssen Sie sich vorerst authentifizieren. Geben Sie dazu die erforderlichen
    Daten ein.


    Die Kombination eines Servers mit zugehöriger Authentifizierung nennt man „Zuordnung“.
    Wenn Sie auf eine Ressource klicken, für die eine Zuordnung existiert, wird KDE
    die Authentifizierung automatisch für Sie vornehmen. Haben Sie ein Passwort angegeben,
    werden Sie künftig


    # Achtung


    > Das Speichern von Passwörtern sollte aus Sicherheitsgründen vermieden werden;
    besonders in sicherheitsrelevanten Netzen.


    Achtung


    # Persönliche Einstellungen


    Unter diesem Menüpunkt befinden sich verschiedene Module, mit denen Sie KDE mit
    persönlichen Einstellungen Ihren Wünschen und Bedürfnissen anpassen.


    Land & Sprache In diesem Modul können Sie die Sprach-, Zahlen- und Datuminstellungen
    für Ihre Region vornehmen. Meist reicht ein Klick auf das passende ‘Land‘ und
    alle weiteren nötigen Einstellungen entsprechend gesetzt. Sollten Sie jedoch Einstellungen
    ändern wollen, können Sie diese unter ‘Zahlen’, ‘Währung‘ sowie ‘Zeit & Datum‘
    Ihren individuellen Vorgaben anpassen.'
