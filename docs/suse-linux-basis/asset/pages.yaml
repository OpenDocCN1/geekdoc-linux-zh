  md: '# Man-Pages


    Die Man-Pages sind der traditionelle Weg unter Unix, eine Beschreibung zur Anwendung
    von Programmen bzw. Befehlen sowie C-Funktionen zu erhalten. Dabei werden alle
    Parameter und Optionen erläutert, den Befehl präzisieren. Es gibt Man-Pages in
    deutscher Sprache (Paket man-pages-de), aber die englischen sind nicht unvollständiger
    sondern auch aktueller.


    Die Unterteilung erfolgt in den folgenden Bereichen, der grundsätzlich beim Aufruf
    der Man-Pages und in vielen Unix-Büchern angegeben wird:


    +   1. Benutzerkommandos

    2. Systemaufrufe

    3. C-Funktionen

    4. Dateiformate, Gerätedate

    5. Konfigurationsdateien

    6. Spiele

    7. Diverses

    8. Systemadministration

    9. Kernel


    n Neue Kommandos


    Der Aufruf der Man-Pages erfolgt über die folgenden Möglichkeiten:


    ```

    **Konsole** Im Textmodus folgt die folgende Syntax zum Aufruf der Man-Pages:

    man <Bereich> <Komando>; um das Kommando aus allen Bereichen anzuzeigen, mit der
    Option -r,-k wie z. B. man -k <Komando>.

    ```


    ```

    **Konqueror** zur Eingabe in das URL-Field: man</Komando>(<Bereich>)

    ```


    SUSE Hilfe können Sie in den verschiedenen Man-Pages nach Bereichen geordnet herumblättern
    oder nach Stichwörtern suchen. Sie finden die Man-Pages in den Themenbereich ''Kommandos
    / Funktionen'' unter ''Man-Pages''.'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# Info-Pages


    Info-Pages haben sich für komplexere Befehle etabliert und beschreiben nicht nur
    Optionen und Parameter, sondern erklären den Einsatz und die Anwendung der Befehle
    ausführlicher; meist anhand entsprender Beispiele. Standardmäßig werden Info-Pages
    mit dem Dateibetrachter Emacs bzw. dem Infoviewer (info) abgerufen.


    Konsole Sie haben zwei grundsliche Möglichkeiten:


    +   - info zeigt eine Liste der verfügbaren Info-Pages.

    - info -apropos <Komando> – Info-Pages zum Thema „Komando“

    - info <Komando> öffnet den Emacs mit der Beschreibung des Befehls, „Komando“


    Quellen geben sich in der URL-Field ein: info:/<Komando>. Im Browser können Sie
    die Links in gewohnter Weise durch klicken.


    SuSE Hilfe in der SuSE Hilfe (abschnitt SuSE Hilfe) finden Sie die Info-Pages
    in dem Themenbereich ‘Kommand / Funktionen’. Die Startseite ist eine Übersicht
    über Infoseiten, die in HTML-Version angezeigt werden.


    # Howtos


    Howtos sind ausführliche praxisbezogene Anleitungen zur Installation und Konfiguration
    unter Linux, die Sie im Verzeichnis /usr/share/doc/howto/ finden. Sie liegen in
    englischer und (umfangreich) in anderen Sprache vor. Für die HTML-Version benutzen
    Sie Paket hotodeh, Serie jedoch hotodeh, Serie doc.


    Im Verzeichnis docu/howto auf der ersten CD befinden sich aktuell zu deinem Redaktschluss
    der CD der wichtigsten HOWTO-Dateien. Es lohnt auch ein Blick in dieses Verzeichnis,
    da diese Dateien unkomprimiert sind und nach der Installation bequem gelesen können.


    Konsole Sie können sich die Howto-Texte über die Konsole mit dem Befehl less anzeigen
    lassen, wenn diese komprimiert sind. Sie können bsp. den Howto-Text zum Thema
    Linux-Installation anzeigen lassen wollen, dann geben Sie folgendes ein:


    ```

    /usr/share/doc/howto/de/DE-Installation-HOWTO.txt

    ```'
