  md: '# Während der Installation


    +   - Soll der Swap-Bereich in der primären oder erweiterten Partition eingerichtet
    werden?

    Der Swap-Bereich dient dem Auslagern von Daten aus dem Arbeitsspeicher (RAM) auf
    die Festplatte. So kann der Arbeitsspeicher den aktuellen Daten in vollem Umfang
    zur Verfügung halten. Falls mehrere Betriebssysteme einsetzen wollen, empfiehlt
    es sich, den Swap-Bereich in einer erweiterten Partition anzulegen. Die Anzahl
    der primären Partition sind generell beschränkt und sollten für andere Betriebssysteme
    freigehalten werden, insofern sollten Sie den Swap-Bereich in einer erweiterten
    Partition anzulegen.


    ```

    ./images/png/um_yast2_swap.png

    ```


    # Arbeiten mit Linux


    +   - Gibt es unter Linux Programme, die meine alten, unter Windows erstellten
    Dateien lesen können?

    Selbstverständlich können Sie unter Linux Ihre alten Dateien weiter nutzen. Standardprogramme
    wie StarOffice und GIMP kommen mit allen Dateiformaten - die Sie von früher kennen
    – zurecht; egal, ob es sich um Ihre Texte, Bilder, Grafiken, Video- oder Audiodateien
    handelt, SuSE Linux stellt immer ein adäquates Programm bereit, mit dem Sie problemlos
    Ihre Dateien bearbeiten können.


    ```

    ./images/png/um_datformate.png

    ```'
  merge: -1
  pgno: 11
- img_proc: true
  md: '+   Wo gibt es Programme für Linux?


    Ihr SuSE Linux bringt alle Programme, die Sie für Ihre Anwendungen und Ihre Arbeit
    brauchen, schon mit. Klicken Sie auf das SuSE-Menü links unten auf Ihrem Desktop
    und Sie werden überrascht sein, welche Programauswahl Sie zur Verfügung haben.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_12_0.png)'
  merge: -1
  pgno: 12
- img_proc: true
  md: '+   Wie formatiere ich eine Diskette für Linux?


    Am besten benutzen Sie den KDE Formatierer. Klicken Sie dazu auf das SuSE-Menü
    links unten auf Ihrem Desktop, wählen Sie ''System'' → ''Kleine Werkzeuge'' →
    ''KFloppy''. Sie haben jetzt die Wahl zwischen dem FAT-Format (für DOS/Windows)
    und dem Linux ext2-Dateisystem. Ansonsten gibt es noch die sog. mtools, zu denen
    Sie im Shell-Kapitel auf Seite 130 weitere Informationen finden.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_13_0.png)


    +   Wo finde ich Beschreibungen zur mitgelieferten Software und Hilfe den vielen
    Programmen?


    Klicken Sie auf den SuSE Hilfebutton. Ein Fenster öffnet sich auf Ihrem Desktop
    und die SuSE Hilfe steht Ihnen für alle Fragen zur Verfügung.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_13_1.png)


    +   Was ist ein virtueller Desktop?


    Manchmal sind auf einem Desktop so viele Fenster geöffnet, dass die Übersichtlichkeit
    darunter leidet. Dies Missstand gibt es nur unter Linux: Auf der Paneleiste sehen
    Sie die Icons mehrerer „virtueller“ Desktops, auf denen Sie beliebig viele Fenster
    Ihrer Wahl nach Ihren Bedürfnissen verteilen und öffnen können, ohne eine Fläche
    zu über-'
  merge: -1
  pgno: 13
- img_proc: true
  md: '![](img/7c7b5e54e6579952ad3fd8bde9e1a136_14_0.png)


    Wählen Sie dann einfach den Desktop, mit dem Sie im Moment arbeiten wollen.


    +   **Wo ist der Dateimanager?**

    Probieren Sie den Konqueror aus. Er ist nicht nur Dateimanager, sondern auch Webbrowser,
    Betrachter und viel mehr; wenn es um die Arbeit mit Dateien geht, ist er erste
    Wahl.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_14_1.png)'
