    \ Sie sind nach\nneuesten arbeitswissenschaftlich konstruiert und werden\nin manchen\
    \ Normen eher empfohlen. Dadurch lässt sich ein seitliches\nAbknicken des Handgelenkes\
    \ vermeiden.\n\n+   ■ Die Tastatur eines Notebooks kann wegen der zusammengeschobenen\n\
    Tasten nicht der Norm entsprechen. Ein Notebook ist deswegen als Ar-\beitsplatzgerät\
    \ abzulehnen, außer man schließt eine externe Tastatur (und\nMaus) an.\n\n# Meine\
    \ Maus lebt frei\n\nAufgrund des Siegeszugs der grafischen Benutzeroberflächen\
    \ wird man he-\nte quasi gezwungen, die Maus zu verwenden. Die intensive Benutzung\
    \ der\nMaus kann nicht Ermüdungen, sondern sogar Erkrankungen im Hand-Arm-\nSchulter-Bereich\
    \ verursachen. Ein Beispiel ist hier (zum letzten Mal) das so ge-\nnannte RSI-Syndrom\
    \ genannt. Die Gefahr steigt bei Verwendung einer „schlech-\nten“ Maus. Für die\
    \ ergonomische-Maus existieren noch keine Normen.\nOft wird ein PC mit Standard\
    \ verkauft. Diese sollte auf jedem Fall\nkritisch begutachten. Ist die Maus wirklich\
    \ tauglich, oder sollte man sie gegen\neine bessere ausstattung suchen? Lassen\
    \ sich mehrere Mäuse aufspacken und pro\biieren diese sich aus? Auf jedem Fall\
    \ dürfte das Kabel auch zu kurz sein.\nVerlangen Sie kulantelweise eine Verlängerung\
    \ von PC-Handcable. Es stellt\nd die Frage, inwieweit die persönliche Mausnutzung\
    \ trainiert ver-\ndenden kann. Professionelle Programme mit vielen Interaktionen\
    \ verzichten auf\nMausklicks. Die Benutzung von Tastaturkürzeln der Bildung der\
    \ Program-\\me muss zwar erelernt werden, man kann unter Umständen bis zu vier\\\
    mal schneller werden. Oft ist auch die Kombination Maus-Tastatur-Bedienung\nzu\
    \ empfehlen.\n\n+   ■ Die ergonomische Maus liegt in Ihrer Hand. Die Tasten sollten\
    \ ein-\\der nicht zu nahe und nicht zu klein sein. Mäuse gibt es inzwischen sogar\n\
    ur Kinderhände."
