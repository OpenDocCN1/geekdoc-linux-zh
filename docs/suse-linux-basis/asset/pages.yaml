    In manchen Ländern (Österreich, USA) ist der Internetzugang über das Fernkabelnetz
    weit verbreitet. Der Teleabel-Teilnehmer bekommt von der Kabelbestirma ein ‘Modem’,
    welches einerseits an das Fernsehen, andererseits mit 10Base-T (Twisted-Pair)
    Leitung an eine Netzwerkkarte im Computer angeschlossen wird. Dieses Modem stellt
    für den Computer eine Standleitung mit einer fixen IP-Adresse dar.'
