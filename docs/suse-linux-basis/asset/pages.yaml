  md: '> Hinweis

    Achtung bei Modellbezeichnungen: Im Zweifelsfall empfiehlt es sich, es mit einer
    ähnlichen Bezeichnung zu probieren, wenn Sie Ihr Modell in der Gerätliste nicht
    finden.


    In manchen Fällen ist jedoch eine absolut bu- bzw. nummergetreue Angabe unerlässlich,
    denn ähnliche Bezeichnungen lassen nicht immer auf auf Kompatibilität schließen.
    Leider versteht ähnlich bezeichnete Hardware oft nicht diesel Sprache!


    # Drucker


    Unter Linux werden Drucker über sog. „Druckerwarteschlangen“ angesprochen. Die
    zu druckenden Daten werden dabei in einer Druckerwarteschlange zwischengespeichert
    und durch den Druckerspool nacheinander dem Drucker geschickt.

    Meist liegen diese Daten nicht in einer Form vor, die direkt an den Drucker geschickt
    werden könnte. Die Grafik beispielsweise meistnormalerweise in einem Format umgewandelt,
    das der Drucker direkt ausgeben kann. Die Umwandlung in die Drucksprache erfolgt
    durch Druckerfilter, der vom Druckerspool zwischengeschaltet wird, dem Drucker
    ggf. umzuwandeln, dass sich der Drucker direkt ausgeben kann. Der Druckerfilter
    ist auch für das Layout und die länderspezifische Codierung zuständig.


    # Zur GDI-Drucker Problematik


    Für Drucker, die über keine der Protokoll Standarddrucksprachen angesprochen werden,
    sondern nur über ein proprietäres Protokoll hat sich die Bezeichnung „GDI-Drucker“
    eingebürgt. Solche Drucker sind normalerweise nicht unter Linux verwendbar, sondern
    nur dem Betriebssystem bzw. der speziellen Betriebssystemversion, für die der
    Hersteller einen Treiber zur Verfügung stellt. Für etliche GDI-Drucker gibt es
    mittlerweile Linux-Treiber, die allerdings nicht so problematisch sind, wie der
    Treiber für die Drucker, die der Standarddrucksprachen direkt weiterstehen. Weitere
    Informationen finden Sie im Supporttdatenbank-Artikel „GDI-Drucker“, den Sie unter
    dem Wort „GDI“ bzw. online unter http://sdb.suse.de/sdb/de/html/ke_printer-gdi.html
    erhalten.


    # Warteschllangen


    Normalerweise mehrere Druckerwarteschllangen benötigt:'
