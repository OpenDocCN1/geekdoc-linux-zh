- img_proc: true
  md: 'Einrichtung des Linux-Kernels – Falls Sie selbst einen Linux-Kernel übersetzen
    möchten, bietet KDE Ihnen eine grafische Oberfläche dazu. Hierzu müssen Sie natürlich
    die Quellecodes des Kernels besitzen (Paket kernel-source). Sie sollten genau
    wissen, was Sie tun, wenn Sie hier etwas ändern; dieses Modul ist daher eher etwas
    für die Experten!


    **Konsole** – Richten Sie in diesem Modul das Terminalprogramm von KDE ein, indem
    Sie für einzelne Registerkarte allgemeine Einstellungen vornehmen oder Farbschemata
    der Konsole bearbeiten.


    Unter dem Reiter ''Allgemein'' legen Sie fest, welches Programm als Standard-Terminal
    verwendet werden soll und bestimmen Sie die Position von Leisten und Rahmen oder
    das grundätzliche Layout der Schrift.


    Falls Sie eigene persönlichen Farben bevorzugen, können Sie unter dem Reiter ''Farbschema''
    Ihre persönlichen Lieblingsfarben zusammenstellen. Beachten Sie jedoch, dass die
    Lesbarkeit des Textes nach wie gegeben sein sollte.


    Im letzten Reiter können Sie angeben, welche Sitzungen gespeichert werden sollen.


    **Schriften-Installation** – Beim ersten Aufruf dieses Moduls erscheint ein Assistent,
    der Ihnen bei der Installation von Schriften hilfreich ist. Normalerweise brauchen
    Sie nicht viel zu ändern, da Standard Standarddeineinstellungen vorgegeben werden.


    **Sitzungsverwaltung** – Mit diesem Modul können Sie festlegen, ob nach der Anmeldung
    eine Bestätigung erfolgen oder bei der Anmeldung die Einstellungen der vorherigen
    Sitzung wiederhergestellt werden sollen.


    # # Webbrowser


    Das Menü enthält Module für die Einstellung des Konquerors als Webbrowser.


    +   * Cookies – Diese Daten dienen dem Speichern und Abrufen von Informationen
    über Ihren Rechner und zu Ihren Aktivitäten, von Webservern mit Hilfe von Browsern
    abzurufen. Hilreich sind sie beispielsweise, wenn sie in Ihren Einstellungen zu
    Internetseiten gespeichert werden, um nach nächsten Aufruf der Webseite nicht
    erneut bestimmte Einstellungen vornehmen zu müssen. Oft speichern und rufen Webseiten
    Informationen über ab, um Sie darüber zu informieren. Die abgerufenen Informationen
    werden für Statistiken verwendet oder einen Bannerwerbung für Sie zu platzieren.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_62_0.png)'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'Das Modul erlaubt Ihnen Regelungen festzulegen, die Verwendung von Cookies
    einschränken oder bei bestimmten Servern generell erlauben.


    **Erweitertes Web-Browser** – Mit diesem Modul können Sie die zwei zusätzlichen
    Funktionen des Konquerors aktivieren:


    Die Option „Internet-Stichwörter aktivieren‘ hilft Ihnen im Internet nach Namen
    wie Firmen, Persönlichkeiten oder Organisationen zu finden. So können Sie statt
    http://www.kde.org/ einfach „K Desktop Environment“ im URL-Feld des Konquerors
    eingeben. Die eingegebene Bezeichnung wird in eine URL übersetzt und aufgerufen.


    Im Abschnitt „Web-Kurzbefehle aktivieren“ finden Sie für die Abfragen bestimmter
    Suchmaschinen Kurzbefehle, die Sie auch individuell verändern können. Verändern
    Sie geben im URL-Feld des Konquerors den Kurzbefehl der Suchmaschine und durch
    einen Doppelklick getrennt, den gewünschten Suchbegriff ein. Ein Beispiel wäre:icq,
    wenn Sie nach „icq“ die Suchmaschine „google“ suchen.


    **Konqueror-Browser** – Rest in diesem Modul finden Sie die Browser-Funktionen
    des Konquerors. Die Einstellungsmöglichkeiten sind auf verschiedenen Registerkarten
    gruppiert:


    Unter dem Reiter „HTML“ bestimmen Sie u. a., ob bei Formularen ein automatisches
    Ausfüllen möglich und wie oft dies maximalchehen soll.


    Wählen Sie über „Erscheinungsbild“ die Schriften, deren Größe und Kodierung zur
    Darstellung der Webseiten aus.


    # **Achtung**


    Aktive Inhalte von Java-/JavaScript-Programme stellen ein Sicherheitsrisiko dar,
    auch wenn das mögliche Schadensausmaß nicht sehr groß ist. Nutzen Sie die Angabe
    von domain-spezifischen Einstellungen.


    # **Achtung**


    Stellen Sie ein, ob eingebettete „Java“-Programme in Webseiten ausgeführt werden
    dürfen. Sie können Einstellungen domain-spezifisch oder zur Laufzeit der Programme
    vornehmen.


    Legen Sie fest, ob eingebettete „JavaScript“-Programme in Webseiten ausgeführt
    werden dürfen.


    Auf der Karte „Plugins“ nehmen Sie die globale Aktivierung vor.


    **Netscape-Plugins** – „Plugins“ bieten die Möglichkeit, innerhalb des jeweiligen
    Browsers Inhalte von anderen Programmen wie z. B. Flash anzuzeigen. Diese können
    beim Start von KDE automatisch Plugins suchen lassen.'
  merge: -1
  pgno: 63
- img_proc: true
  md: 'Unter dem Reiter ''Plugins'' erhalten Sie eine detaillierte Auflistung Ihrer
    installierten Netscape-Plugins. Diese können auch von Konqueror genutzt werden.


    **Proxy-Server** – Nehmen Sie mit diesem Modul Einstellungen für den Proxy-Server
    vor.


    **Stilvorlagen** – Die die genannten „CSS"-Dateien enthalten Informationen, um
    die Darstellung von HTML-Seiten einheitlich zu gestalten. Dazu werden den einzelnen
    Stilelelementen wie Überschriften bestimmte Formatierungen zugeordnet.


    Die zu verwendende Stilvorlage bestimmen Sie über die Karte ''Allgemein''. Um
    auf der Karte ''Benutzerdefiniert'' die erstellte Stilvorlage zu nutzen, wählen
    Sie den Punkt ''Stilvorlage auf Kartekarte ''Benutzerdefiniert'' ...''.


    **User Agent** – Wenn Konqueror die Verbindung zu einer Web-Seite aufbaut, wird
    der einzige grundlegende Informationen zur Identifikation in Form eine „User Agent“-Anmeldung
    übertragen. Intelligente Web-Seiten werten diese Informationen aus, um den HTML-Code
    ihrer Seiten an den verwendeteneten Browser anzupassen. Dies ist nützlich, da
    es Unterschiede in der Arbeitsweise von Web-Browsern gibt.


    Einige Web-Server verweigern „ungeeeigneten“ Browsern die Verbindung, die Sie
    mit einer falschen „User Agent“-Anmeldung täuschen können.


