    \ Legen Sie Ihre CD. DVD in Ihr Laufwerk ein und klicken Sie mit der linken Maustaste\
    \ auf das Bild. Die CD wird eingebunden und der Inhalt über ein Konqueror-Fenster\
    \ angezeigt.\n* Auf meinem Desktop befindet sich kein CD-Piktogramm. Wie erstelle\
    \ ich eines?\nKlicken Sie mit der rechten Maustaste auf den Desktop. Wählen Sie\
    \ aus dem Menü den Punkt ‚Neu erstellen...‘ \rightarrow ‚CD-ROM...‘ aus. Ein Fenster\
    \ öffnet sich. Unter ‚Allgemein‘ können Sie den Namen des Piktograms auf dem Desktop\
