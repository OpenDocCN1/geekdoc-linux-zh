- img_proc: true
  md: 'Sollte die gesuchte Sprache nicht vorhanden sein, haben Sie wahrscheinlich
    das KDE-Sprachpaket nicht installiert. Der Name des Pakets beginnt mit kde3-i18n-
    und enthält zusätzlich ein Kürzel für die Sprache, z. B. für Deutsch, fr für Französisch
    usw. Ein Beispiel wäre kde3-i18n-de für das deutsche Paket.


    > > Tipp


    In der Voransicht des Moduls (am unteren Rand) sehen Sie, wie sich die von Ihnen
    gewählten Einstellungen auswirken.


    > > Tipp


    **Passwörter** Entscheiden Sie, ob Sie bei der Eingabe des Passwortes keine Anzeige
    oder einfache Zeichen anzeigen lassen wollen. Begrenzen Sie in jedem Fall die
    zeitliche Speicherung von Passwörtern.


    **Rechtschreibung** Wählen u. a. das zu verwendende Wörter, die Zeichenkodierung
    und das Programm, mit welchem Sie die Rechtschreibprüfung durchführen wollen.
    Alle Programme sowohl Aspell (KDE) als auch ISpell (Nicht-KDE-Programme) werden
    unterstützt.


    **Verschlüsselung** Dieser Bereich erlaubt die Einrichtung von SSL (engl. Socket
    Library), Zertifikaten, Authentifizierungen und die Einstellung sicherheitsrelevanter
    Aspekte. Für weitere Informationen beteiligen sich die ''Hilfe''.


    **Zugangshilfen** Wenn Fehlermeldungen nicht nur durch Klänge, sondern auch durch
    andere hörbare oder sichtbare Signale angezeigt werden sollen, können Sie diese
    in diesem Modul über die Karte ''Signal'' einstellen.


    Stellen Sie über die Karte ''Tastatur'' die Verzögerungen beim Tasteneinschlag
    ein. Sie verhindern beispielsweise eine Zeichenannahme über die Tastatur, wenn
    Sie nur eine Taste gedrückt halten.


    Möchten oder müssen Sie mit dem Nummernblock die Maus steuern, dann aktivieren
    Sie auf der Karte ''Maus'' den Punkt ''Maus mit Tastatur (Nummernblock) bewegen''.
    Zusätzlich haben Sie noch die Möglichkeit, Verzögerungen, Beschleunigungen, Wiederholungen
    etc. einzustellen.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_60_0.png)'
