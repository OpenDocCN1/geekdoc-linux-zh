  md: '# Platzierung


    Wenn neue Programmfenster erscheinen, kann Sawfish kontrollieren, wo und wie diese
    auf dem Desktop platziert werden. Die Standardeinstellung ist hier ''best-fit'',
    bei der Sawfish berechnet, welcher Position des Desktops am meisten verbleibende
    ''Leerfläche'' ist und versucht, das neue Fenster zu platzieren. Alternativ gibt
    es hier Einstellungen ''interactively'', die es dem Anwender überlassen, neue
    Fenster selbst zu positionieren.


    # Minihilfen


    Neben diversen Detailfunktionen lassen sich hier die Minihilfen von Sawfish konfigurieren.
    Minihilfen sind kurze Erläuterungen, die Sawfish mittels kleiner Sprechblasen
    anzeigt.


    # Tastenürzel


    Die Bedienung eines Fenstersystems mit der Tastatur ist besonders für den erfahrenen
    Nutzer hilfreich. Sawfish lässt alle Wünsche offen. In diesem Fenster können Sie
    nahezu jede Aktion eine Taste oder eine Tastenkombination zuweisen. Damit teilt
    Sawfish die Aktionen in verschiedene logische Gruppen ein; der Gruppenname sagt
    aus, auf welchen Bereich sich die Aktion bezieht. Sie finden beispielsweise in
    der Gruppe ''Window'' Aktionen wie das Maximieren, Verschieben oder Minimieren
    eines Fensters.


    # Verkleinern und Vergrößern


    Hier können Sie einstellen, wie Sawfish sich beim Minimieren bzw. Wiederstellen
    von Fenstern verhält. Zusätzlich können Sie festlegen, ob ein manuelles Ändern
    der Fenstergeometrie bei einem maximierten Programmfenster möglich ist.


    # Verschieben und Verändern


    Sie können den Fenstermanager so einstellen, dass er beim Verschieben eines Fensters
    lediglich ein Rechteck zeichnet. Diese Einstellung ist besonders bei weniger leistungsfähigen
    Computern bzw. Grafikkarten sinnvoll. Die gleiche Einstellung ist auch für das
    Vergrößern beim Verleinern von Fensterrahmen möglich. Weiterhin können Sie sich
    verschiedene Methoden zum ''Einrasten'' der Fenster anwenden. Wenn Sie beispielsweise
    die Einrastmethode auf ''magnetism'' stellen, wird der Rahmen des Fensters, das
    Sie gerade verschieben, direkt neben der Kante eines anderen Fensters einrasten,
    gerade als wäre der Fensterrahmen magnetisch.'
