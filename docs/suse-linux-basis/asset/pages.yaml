  md: 'Jedes Miniprogramm besitzt einen kleinen Pfeil oben, der ein Menü öffnet.

    Dort können Sie das Applet verschieben, entfernen oder einen Einstellungsdialog

    sofern vorhanden) aufrufen.

    Wenn Sie noch weitere dieser nützlichen Programme hinzufügen wollen, klicken Sie
    mit der rechten Maustaste auf eine freie Fläche und wählen ‚Hinzufügen‘ →

    ‚Miniprogramme‘.


    Die Fensterleiste – Sie können einfach und schnell zwischen verschiedenen geöffneten
    Anwendungen hin- und hersringen. Sie können die Programme z. B. nach Arbeitsflächen
    sortieren oder zusammengehörigen Fenster gruppieren. Wählen Sie im KDE-Kontrollzentrum
    den Menüpunkt ‚Erscheinungsbild‘ → ‚Fensterleiste‘ aus und informieren Sie sich
    über die Einstellungsmöglichkeit.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_36_0.png)


    Abbildung 3.3: Fensterleiste: Zeigt alle Fenster der aktiven Arbeitsfläche an.


    Der Umschalter KDE bietet Ihnen an, mit mehreren Arbeitsflächen zu arbeiten. Sie
    können bis zu 16. virtuelle Flächen einstellen, denen Sie sogar eigene Namen geben
    können.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_36_1.png)


    Abbildung 3.4: Drei unterschiedliche Umschalter


    Abbildung 3.4 zeigt den gleichen Umschalter (von links nach rechts) jeweils mit
    Nummernansicht, Voransicht und Namensansicht.


    Ein Klick mit der rechten Maustaste innerhalb des Umschalters öffnet ein Popup-Menü.
    Hier können Sie diese auswählen, ob Sie eine ‚Voransicht‘ wünschen oder Ihnen
    ‚Nummern‘ oder ‚Namen‘ lieber sind. Aktivieren Sie ‚Arbeitsflächenvorschauau aktivieren‘,
    erscheint daneben ein Pfeil. Beim Anklicken öffnet sich ein kleines Fenster, das
    die Arbeitsflächen als kleine Vorschau zeigt. So können Sie gezielt ein Fenster
    aktivieren.'
