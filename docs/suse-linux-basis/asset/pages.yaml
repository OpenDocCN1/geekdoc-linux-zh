- img_proc: true
  md: '# 7


    Wollen Sie eine neue Datei mit der sortierten Liste, müssen Sie die Ausgabe des
    sort-Befehls wieder in eine Datei lenken. Wenn Sie das nachvollziehen möchten,
    erstellen Sie in einem Editor eine unsortierte Liste Namensliste, und speichern
    Sie diese unter dem Namen liste im Verzeichnis test.


    Gehen Sie ins Verzeichnis und rufen Sie den Befehl sort < liste > sortierteListe
    auf. Sehen Sie sich sich mit die neue Liste an.


    Die Standard-Fehlerausgabe ist ebenfalls der Bildschirms. Wenn Sie diese diese
    in einer Datei mit "Fehler" umleiten möchten, geben Sie im Anschluss an den Befehl:
    2 Fehler. Wenn Sie > Ausgabe an sowohl die Standardausgabe sowie die Standardausgabe
    als die Fehlerausgabe. Wenn an Stelle einmal = zweimal >> benutzt, wird die Ausgabe
    an eine vorhandene Datei angehäng.


    # Archive und Datenkompression


    Nachdem Sie schon einige Dateien und Verzeichnisse angelegt haben, wenn wir uns
    mit dem Thema Archivierung und Datenkompression zu sind. Angenommen, Sie möchten
    das ganze Verzeichnis test in einer Datei zusammenpacken lassen, damit Sie diese
    auf Diskette als Sicherungskopie speichern oder per E-Mail verschicken können.
    Dazu benutzen Sie den Befehl tar (engl. tape archiver). Mit mit tar --help können
    Sie sich alle Optionen zu tar ansehen, die wichtigsten allerdings hier erklärenären:


    +   -c (engl. create) neues Archiv anlegen.


    +   -t (engl. table) Inhalt eines Archives anzeigen.


    +   -x (engl. extract) Archiv entpacken.


    +   -v (engl. verbose) zeigt während des Einpackens alle Dateien auf dem Bildschirm
    an.


    +   -f (engl. file) Damit können Sie einen Dateinamen für die Archivdatei wählen.

    Beim Packen muss diese Option immer als letztes angegeben werden.


    Arbeiten mit der Shell


    SuSE Linux - Basis 129'
