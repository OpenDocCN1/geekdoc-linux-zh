  md: '# Glossar


    # Account


    siehe Zugangsberechtigung.


    **ADSL** (engl. Asymmetric Digital Subscriber Line)

    Übertragungsverfahren, das Daten etwa mal 100 mal schneller als ISDN über das
    Telefonnetz überträgt.


    **AGP** (engl. Accelerated Graphics Port)

    Schneller Steckplatz für Grafikkarten. Basiert auf PCI, bietet eine um ein Vielfaches
    höherehere Bandbreite als dieser. AGP-Grafikkarten können im Gegensatz zu PCI-Modellen
    darüber hinaus des Rechners (ohne Umweg über den Prozessor) als Arbeitsspeicher
    zurückgreifen, um dort Grafikdaten auszulagen.


    **Arbeitsspeicher** (engl. memory)

    Physikalischer Speicher von begrenzter Kapazität, auf den relativ schnell zugriffen
    werden kann.


    **ATAPI** (engl. Advance Technology Attachment Packet Interface)

    Heutzutage wird es als IDE bezeichnet. Das EIDE „Advance“ stammt noch aus einer
    Zeit, als die Festplatten 10 MB groß und furchtbar langsam waren.


    # Backup


    Backup ist der englische Ausdruck für Sicherheitskopie. Solche Sicherungen sollte
    man sich regelmäßig, vor allem von wichtigen Daten, anlegen.


    # Bandbreite


    Maximale Übertragungsleistung eines Datenkanals.


    **Benutzerverzeichnis** (engl. home directory)


    siehe Home-Verzeichnis.'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# Betriebssystem (engl. operating system)


    Permanent auf einem Rechner im Hintergrund laufendes Programm, welches das grundlegende
    Arbeiten mit dem System überhaupt erst ermöglicht.


    # BIOS (engl. Basic Input Output System)


    Kleiner Baustein, der in den ersten Sekunden des Systemstarts die Initialisierung
    Hardwarekomponenten übernimmt. Dieser für den Computer essentielle Vorgang ist
    bei einem Linux-System dann beendet, wenn LILO erscheint.


    ```

    LILO

    ```


    # Bookmark


    Lesezeichen.


    # Booten (engl. bootstrap = Stiefelschlupf)


    Mit dem Booten wird der gesamte Startvorgang eines Systems vom Einschalten bis
    zum Moment, in dem das System dem Benutzer zur Verfügung steht, bezeichnet.


    # Browser


    Programm für Suche in bzw. Darstellung von Inhalten. Heutzutage meist für Programme
    verwendet, die Inhalte des World Wide Webs grafisch darzustellen.


    # Cache


    Im Verhältnis zum Arbeitsspeicher recht kleiner, aber auch schneller Zwischenpeicher.
    Im Cache werden z. B. aufgerufene Dateien abgelegt, die bei nachigem Bedarf nicht
    erst langwierig von der Festplatte geladen werden müssen.


    # Client


    Arbeitsstation in einem Computernetzwerk, die vom Server „bedient“ wird.


    # CPU (engl. Central Processing Unit)


    ```

    Prozessor.

    ```


    # Cursor


    Kleines Blockzeichen, das die Stelle der Eingabe markiert.


    # Daemon (engl. Disk and execution monitor)


    Im Hintergrund wachsendes Programm, das bei Bedarf in Aktion tritt. Artartige
    Daemonen beantworten z. B. FTP- oder HTTP-Anfragen oder koordinieren die Aktivitäten
    in den PCMCIA-Speätzen.'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# Dateisystem (engl. filesystem)


    Ordnungssystem für Dateien. Es gibt eine Vielzahl verschiedener Dateisysteme,
    die sich hinsichtlich ihrer Leistungsfähigkeit teilweise stark unterscheiden.


    # DDC (engl. Direct Display Channel)


    Standard für Kommunikation zwischen Monitor und Grafikkarte, um verschiedene Parameter
    z. B. den Monitornamen oder Auflösung an die Grafikkarte zu übermitteln.


    # DNS (engl. Domain Name System)


    System, das WWW- in TCP/IP-Adressen und umgekehrt übersetzt.


    # E-Mail (engl. electronic mail)


    Verfahren zur Übertragung von „elektronischen Briefen“ zwischen Benutzer eines
    lokalen Netzwerks bzw. dem Internet angeschlossenen System.


    # EIDE (engl. Enhanced Integrated Drive Electronics)


    Verbesserter IDE-Standard, der auch Festplatten mit einer Größe über 512 MB erlaubt.


    # Eingabeaufforderung (engl. prompt)


    Kennzeichnung einer textorientierten Shell für die Stelle, an der die Befehle
    für das Betriebssystem eingegeben werden können.


    # einloggen


    siehe Login.


    # Ethernet


    Welt verbreiteter Standard für Computer-Netzwerke mit räumlicher Ausdehnung.


    # EXT2 (engl. second extended filesystem)


    Das von Linux verwendete Standard-Dateisystem.


    # FAQ (engl. Frequently Asked Questions)


    Weit verbreitetes Synonym für Dokumente, die Antworten auf häufig gestellte Fragen
    enthalten.


    # Fenstermanager (engl. window manager)


    Auf dem Window System aufbauende Schicht, die vor allem für die Darstellung des
    Desktops zuständig ist. Es gibt eine Vielzahl von unterschiedlichen Fenstermanag,
    einer der populärsten z. B. kwm für KDE.'
  merge: -1
  pgno: 192
- img_proc: true
  md: '# freie Software


    sehe [GNU].


    # Firewall (engl. )


    „Feuerwand“, die ein lokales Netzwerk unter Verwendung verschiedener

    Sicherheitsmaßnahmen mit dem Internet verbindet.


    # FTP (engl. file transfer protocol)


    Auf [TCP/IP] umsetzendes [Protokoll] zum Transfer von Dateien.


    # GNU (engl. is Not Unix)


    GNU ist ein Projekt der Free Software Foundation (FSF). Ziel des „GNU

    Projects“, mit dem der Name Richard Stallman (RMS) engstuben verfrei-

    dist, ist die Schaffung eines „freien“, mit Unix kompatiblen Betrieb-

    systems; „frei“ meint weniger kostenfrei, als vielmehr Freiheit (engl.

    freedom) im dem Recht auf Quelltextes (engl. source), als des jeweiligen Pro-

    gramcodes, erhalten bleibt, bleibt jede Änderung ebenfalls nicht durch Verändern
    oder

    darf Software im Sinne dieser Freiheit nicht durch Verändern oder

    Hinzuzufügen von Programmcode eingeschränkt werden. Wenn dies sicher-

    tellt wird, erklärt das klassische GNU Manifesto in vielerlei-

    sicht (http://www.gnu.org/gnu/manifesto.html); juristisch abge-

    sichert wird die GNU Software der GNU General Public License, kurz

    „GPL“ (http://www.gnu.org/copleleft/gpl.html), 1, kurz „LGPL"

    (http://www.gnu.org/copleleft/lgpl.html).


    Im Zuge des „GNU Projects“ werden alle Unix-Hilfsprogramme neu

    wickelt und teilweise oder mit verbesserter Funktionalität ver-

    her. Aber auch komplexe Software-Systeme (z. B. der Emacs oder der

    glibc) sind Herzstücke des „Projects“.


    Der [Linux]-Kernel, der unter der GPL steht, profitiert von diesem „Pro-

    jekt“ (ins von den Tools), sollte damit aber nicht gleichgesetzt.


    # GPL (engl. GNU PUBLIC LICENSE)


    sehe [GNU].


    # Home-Verzeichnis (engl. home directory)


    Privates Verzeichnis im Linux-Dateisystem ( meist /home/

    <benutzername>), das einem bestimmten Benutzer gehört, der ein-

    ziger volle Zugiffsrechte auf hat.




    > ¹Früher „GNU Library Foundation'
  merge: -1
  pgno: 193
- img_proc: true
  md: '# Hostname


    Name eines Rechners unter Linux, unter dem er meist im Netzwerk zu erreichen ist.


    # HTML (engl. Hypertext Markup Language)


    Wichtigste ist World Wide Web verwendete Sprache zur Gestaltung von Inhalten.
    Durch HTML zur Verfügung gestellten Layout-Befehle definieren das Aussehen eines
    Dokuments, wie es von einem Browser dargestellt wird.


    # HTTP (engl. Hypertext Transfer Protocol)


    Zwischen Browsern und Internet-Servern verwendetes Übertragungsprotokoll zu HTML-Seiten
    im World Wide Web.


    # IDE (engl. Integrated Drive Electronics)


    Besonders in PCs unterer und mittlerer Preisklasse sehr verbreiteter Festplatten.


    # IRQ (engl. Interrupt Request)


    Von einer Hardwarekomponente oder einem Programm durchführte Anfrage an das Betriebssystem
    zur Zuweilung von Rechenkapazität.


    # Internet


    Weltweit, auf TCP/IP basierendes Computernetzwerk mit einer sehr großen Anzahl
    von Benutzern.


    # IP-Adresse


    Numerische, aus vier Punkte getrennte Blöcke bestehende Adresse (z. B. 192.168.10.1)
    zur Ansteuerung von Rechnern in TCP/IP-Netzwerken.


    # ISDN (engl. Integrated Services Digital Network)


    Digitaler, in Deutschland mittlerweile recht verbreiteter Standard u. a. zur schnellen
    Übertragung von Daten über das Telefonnetz.


    # Jokerzeichen


    Platzhalter für ein (Symbol: ''?'') oder mehrere (Symbol: ''*'') unbekannte Zeichen,
    vorzugsweise in Befehlen (insbesondere Sonderbefehlen) eingesetzt.


    # KDE (engl. K Desktop Environment)


    Äußerst benutzerfreundliche grafische Oberfläche für Linux.


    # Kernel


    „Kern“ des Linux-Betriebssystems, auf dem Programme und die meisten Treiber aufbauen.'
  merge: -1
  pgno: 194
- img_proc: true
  md: '# Konsole (engl. console, terminal)


    Frü gleichgesetzt mit dem Terminal, gibt es unter Linux sog. virtuelle Konsolen,
    die es erlauben, den Bildschirmen für mehrere unabhängige – parallele – Arbeitssitzungen
    zu verwenden.


    # LAN (engl. local area network)


    Computer-Netzwerk mit sehr geringer räumlicher Ausdehnung.


    # Lesezeichen (engl. bookmark)


    Meist persönliche, direkt im Browser zur Verfügung stehende Sammlung von Querverisen
    auf interessante Webseiten.


    # LILO (Engl. Loader)


    Kleines, im Bootsektor der Festplatte installierendes Programm, das Linux, aber
    andere Bootsysteme starten kann.


    # Link


    Querverweis auf andere Dateien, im Internet ebenso gebrauchlich wie im Linux-Dateisystem.
    Bei letzteren unterscheidet man zwischen „harten“ und „symbolischen“ Links. Während
    „harte“ Verknüpfungen auf Dateisystem verweisen, zeigt die symbolische Variante
    nur auf den jeweiligen Namen.


    # Linux


    UNIX-artiger, unter GPL (GNU License) frei vertriebener, Betriebssystemkern, nach
    seinem „Erfinder“ Linux Torvalds („Linus“ unix“) genannt. Obwohl sich diese Definition
    streng genommen nur auf den Kernel selbst bezieht, wird unter dem Begriff „Linux“
    meist das gesamte System inkl. Anwendungen etc. verstanden.


    # Login


    Anmeldung eines Benutzers an einem Computersystem bzw. Netzwerk, um zu diesem
    Zugang zu erhalten.


    # Logout


    Abmeldung eines Benutzers vom System.


    # Man-Page


    Traditionellerweise liegt die Dokumentation bei Unix-Systemen in „Man-Pages“ (auch
    „Manual-Pages“) vor, die mit dem Befehl man eingesehen werden kann.'
  merge: -1
  pgno: 195
- img_proc: true
  md: '# MBR (engl. master record)


    Physikalisch erster Sektor einer Festplatte, dessen Inhalt beim Start des Systems
    in den Arbeitsspeicher geladen und ausgeführt wird. Dieser Code lädt entweder
    das Betriebssystem von einer startfähigen Festplatten-Partition oder einen komplizierteren
    Bootloader, z. B. LILO.


    # Mount


    Einhängen von Dateisystemen im Verzeichnisbaum des Systems.


    # Multitasking


    Fähigkeit von Betriebssystemen, mehrere Programme gleichzeitig aus-zuführen.


    # MP3


    Sehr effizientes Kompressionsverfahren für Audio-Dateien, durch das die Größe
    im Gegensatz zu einer unkomprimierten Datei etwa um den Faktor 10 herabgesetzt
    werden kann.


    # Multiuser


    Möglichkeit von mehreren Benutzern, gleichzeitig mit dem System zu ar-beiten.


    # Netzwerk (engl. net, network)


    Zusammenschluss vieler Computer, meist durch Server und Clients realisiert.


    # NFS (engl. network file system)


    Protokoll zum Zugriff auf Dateisystem vernetzter Rechner.


    # NIS (engl. Network Information Service)


    System zur zentralen Verwaltung von Administrationsdaten in Netzwerk-ken. V. a.
    Benutzernamen und -passwörter können NIS netzwerkweit synchron gehalten werden.


    # Partition


    Logisch unabhängiger Teilbereich einer Festplatte, der ein jeweils unter unterschiedliches
    Dateisystem enthalten kann. Unter Windows als „Lauf-werke“ bezeichnet.


    # Pfad (engl. path)


    Eindeutige Beschreibung der Position einer Datei in einem Dateisystem.


    # Plug and Play


    Technologie zur automatischen Konfiguration von Hardwarekomponenten. Ressourcen
    wie z. B. IRQ, DMA und andere sollten vom System selbst-ständig konfiguriert und
    verwaltet werden.'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# Prompt


    Siehe Eingabeaufforderung.


    # Protokoll (engl. protocol)


    Definierter spezifischer Standard, der die Kommunikation sowohl auf Hardware-,
    Software-, als auch Netzwerk-Ebene regelt. Es existiert eine Vielzahl dieser Standards,
    weit verbreitete Beispiele sind z. B. HTTP und FTP.


    # Proxy


    Meist bei Internet-Anbietern platzierter Zwischenspeicher, der häufig angeforderte
    Inhalte in einer Datenbank ablegt, um weitere Rechner, diese Seite anfordern,
    direkt daraus zu versorgen. Dieses Verfahren kann nicht nur die Ladezeiten eines
    direkten Herunterladens reduziert, sondern auch die vorhandene Bandbreiten geschont.


    # Prozess (engl. process)


    Programme oder ausführbare Dateien laufen als Prozess ab und können in einer Shell
    beobachtet werden, z. B. mit top. Oft wird dieser Begriff synonym bzw. der Programme
    in Maschinprache verarbeitet und ausgeführt mit „Task".


    # Prozessor


    Der Prozessor ist das „Gehirn“ eines Computers, der die Befehle des Nutzers bzw.
    der Programme in Maschinprache verarbeitet und ausführt. Er führt die Kontrolle
    über das gesamte System und bringt die eigentliche Rechenleistung.


    # RAM (engl. Random Access Memory)


    siehe Arbeitsspeicher


    # Root


    Diejen Person, die in einem komplexen Rechnersystem bzw. -netzwerk Konfigurationen
    und Wartung übernimmt. Dieser Systemadministrator hat (meist eine einzige Person)
    Zugang zu allen Aspekten eines Rechnersystems (Root-Rechte).


    # SCSI (engl. Small Computer Systems Interface)


    Festplattenstandard, der insbesondere aufgrund hoher Geschwindigkeit insbesondere
    besonders auf Servern und Rechnern höherer Preisklasse Verwendung findet.'
  merge: -1
  pgno: 197
- img_proc: true
  md: '# Server


    Meist sehr leistungsfähiger Rechner, der anderen über ein Netzwerk ange-schlossene
    Rechner (Clients) Daten und Dienste bereitstellt. Darüber hinaus geht sich alle
    Programme, die man aufgrund ihrer Konstitution bzw. Verfügbarkeit als „Server“
    bezeichnet.


    # Shell


    Oftmals äußert flexible Eingabele für Befehle, nicht selten mit einer eigenen
    Programmiersprache ausgestattet. Beispiele für Shells sind bash, sh und tsh.


    # SMTP (engl. Simple Mail Transfer Protocol)


    Protokoll zum Transfer von E-Mails


    # SSL (engl. Secure Socket Layer)


    Verfahren zur Verschlüsselung von HTTP-Datentransfers.


    # Systemadministrator (engl. system administrator, root user)


    siehe Root


    # Task


    Siehe Prozess.


    # TCP/IP


    Kommunikationsprotokoll des Internets; findet zunehmend auch in lokalen Netzen
    Verwendung, die man dann als „Intranet“ bezeichnet.


    # Telnet


    Telnet ist das Protokoll und Kommando, um mit anderen Rechnern (engl. hosts) zu
    kommunizieren.


    # Terminal (engl. terminal)


    Früher die Bezeichnung für einen einen Zentralrechner angeschlossene Tastatur-Bildschirm-Kombination
    ohne eigene Rechenleistung, im Deutschen auch als Datenschutzgerät oder Datenstation
    bezeichnet. Auf Workstations auch zur Bezeichnung von Programmen benutzt, die
    ein echtes Terminal emulieren.


    # Treiber


    Zwischen Betriebssystem und Hardware stehendes Programm, das die Kommunikation
    zwischen diesen beiden Schichten „übersetzt“.'
  merge: -1
  pgno: 198
- img_proc: true
  md: '# Umgebung (engl. environment)


    Eine Shell stellt eine Umgebung zur Verfügung, in welcher der Benutzer temporär
    Einstellungen vornehmen kann. Diese Einstellungen sind zum Beispiel Pfadnamen
    zu Programmen, den Benutzernamen, aktuelle Pfad, das Aussehen der Prompts etc.
    Die Daten werden in einer Umgebungsvariablen gespeichert. Die Belegung der Umgebungsvariablen
    erfolgt z. B. durch die Konfigurationsdatei der Shell.


    # Umgebungsvariable (engl. environment variable)


    Ein Platz in der Shell. J Umgebungsvariable hat einen Namen, der in Großbuchstaben
    angegeben ist. Den Variablen werden, z. B. Pfadnamen, zugewiesen.


    # UNIX


    Betriebssystem, das vor allem auf Workstations in Netzwerken recht weit verbreitet
    ist. Seit Beginn der 90er Jahre ist UNIX in einer Freeware-Version für PCs erhältlich.


    # URL (engl. Uniform Resource Locator)


    Eindeutige Adresse im Internet, die sowohl den Typ (z. B. http://) ) als auch
    den Namen des Rechners beinhaltet (z. B. www.suse.de)


    # Verzeichnis (engl. directory)


    Verzeichnisse bauen die Ordnungsstruktur eines Dateystems auf. In einem Verzeichnis
    werden Datei- bzw. Verzeichnisnamen aufgelistet.


    # VESA (engl. Video Electronics Standard Association)


    Industriekonsortium, welches u. a. wichtige Video-Standards definierte.


    # Wildcard


    +   - siehe Jokerverzeichnis


    # Windowmanager


    +   - siehe Fenstermanager


    # Wurzelverzeichnis (engl. root directory)


    Das oberste Verzeichnis des Dateystems, das im Gegensatz zu allen Verzeichnissen
    kein übergeordnetes Verzeichnis mehr besitzt. Das Wurzelverzeichnis wird unter
    UNIX als ''/'' dargestellt.


    # WWW (engl. World Web Web)


    Auf dem HTTP-Protokoll basierender graphischer Teil des Internets, mit so genannten
    Web-Browsern angezeigt wird.


    # X11


    +   - siehe X Window System'
  merge: -1
  pgno: 199
- img_proc: true
  md: '# X Window System


    Das X Window System ist der De-Facto-Standard für grafische Oberflächen unter
    Linux. Im Gegensatz zu anderen Betriebssystemen, stellt es dabei nur die Grundlagen,
    beispielsweise den Kontakt zu Hardware her, auf dem das Fenstermanager, z. B.
    KDE, mit individuellen Oberflächen aufset.


    # YP (engl. yellow pages)


    siehe NIS


    # Zugangsberechtigung (engl. account)


    Die Einheit aus dem Benutzernamen (engl. login name) und dem Passwort (password).
    Die Zugangsberechtigung wird im Allgemeinen vom Systemadministrator eingerichtet.
    Dieser legt fest, zu welcher Benutzergruppe der neue Benutzer gerechnet wird und
    welche Rechte dem Rechnersystem daraus resultieren.'
