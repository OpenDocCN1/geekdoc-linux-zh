  md: 'Newsticker – Wenn Sie eine Internetanbindung besitzen, können Sie sich aktuell-le
    Nachrichten holen lassen; die Nachrichten werden dann als Lauftext in einem kleinen
    Miniprogramm dargestellt. Abschnitt Netzwerk auf Seite 48 geht ausführlich auf
    dieses nützliche Werkzeug ein.


    # Ausgewählte KDE-Anwendungen


    Es gibt mittlerweile eine Vielzahl an KDE-Anwendungen. Aus Platzgründen wir Ihnen
    nicht alle Programme im Detail vorstellen. Auswahl und Reihenfolge stellen daher
    keineswegs ein Qualitätskriterium dar.


    # Festplattenverwaltung


    Die beiden Systemprogramme kdf und quickdisk helfen Ihnen, auf Ihrem System verfügbaren
    Datenträger schnell und einfach ein- bzw. auszuhängen (engl. mount).


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_37_0.png)


    Abbildung 3.5: Übersicht über Ihre Datenträger mit kdf


    +   - quickdisk ist ein „Miniprogramm“, d. h. bindet sich in die Kontrollleiste
    ein. Beim Klick mit der rechten Maustaste öffnet sich das Icon, um die entsprechenden
    Datenträger ein- oder auszuhängen können. Wenn Sie eine grafische Übersicht möchten,
    Wählen Sie ‘KDiskFree starten''


    +   - kdf bzw. KDiskFree zeigt Ihnen analog zum df-Komando eine Übersicht Ihrer
    Datenträger an, die aus der Datei /etc/fstab entnommen wird. Das Fenster beinhaltet
    das Symbol des Datenträgers, den Typ, die Größe, den Mount-Punkt, den Belegung
    in Prozent und eine grafische Darstellung. So behalten Sie den Überblick.'
  merge: -1
