  md: '# Kommandos / Funktionen


    +   - ''Man-Pages'' – Die englischen „Man-Pages“ vom UNIX-Systems beschreiben
    Kommando und deren Optionen bzw. Parameter, welche das Kommando präzisieren (s.
    Abschnitt Man-Pages).


    +   - ''InfoPages'' – Die Hileseiten beschreiben u. a. Eingabetziele, Erklärungen
    und Beispiele zur Verwendung von komplexen Linux-Befehlen und Bibliotheken (s.
    Abschnitt Info-Pages).


    Suchen von Dokumenten im linken Fenster finden Sie die Reiter für ‚Suche‘ ‚Erweitert‘
    und ‚Inhalt‘ (9.2 auf Seite 165):


    +   - ''Suche'' – Bei Standardsuche brauchen Sie nur das gesuchte Stichwort einzugeben
    und darunter ‚Suche‘ zu aktivieren. Standardmäßig werden – soweit installiert
    und der Aufbau der Datenbank nicht explizit verhindert wird (s. Seite 39) – Paketbeschreibungen,
    alle SuSE Handbücher (Die Referenz, Netzwerk, Konfiguration, Die Programme), KDE-Hilfe
    und die Supportdatenbank (SDB) durchsucht.


    +   - Die Schaltfläche ‚Suche‘ hat sich nach Beteiligung an ‚Weiter‘ geändert.
    Wenn Sie diese betät, werden zusätzlich alle verbleibenden und verfügbaren Datenquellen
    durchsucht.


    +   - ''Erweitert'' – Über diese Registerkarte können Sie Ihre durch zwei Optionen
    präzisieren: Wenn Sie im Eingabefeld mindestens zwei Stichwörter wählen, können
    die (‚und‘ oder mindestens eines von beiden) Stichwörter im Dokument vorkommen.
    Über ‚Max. Ergebnisse‘ begrenzen Sie die Anzeige der Einträge auf Quelle, um einen
    Überblick über die gefundenen Einträge zu behalten oder lassen Sie sich alle Fundstellen
    der Dokumentationsquelle anzeigen. Wählen Sie beispielsweise ‚5‘ aus, werden Ihnen
    nur die fünf wichtigsten Einträge Ihrer Dokumentationsquelle angezeigt. Ihre Auswahl
    invertieren Sie über die Schaltfläche mit den zwei Pfeilen.


    Die angezeigte Liste können Sie erweitern bzw einschränken, indem Sie über die
    Schaltfläche mit dem Werkzeug den Index-Datenbanken für weitere Dokumentationsquellen
    anlegen bzw. löschen; vgl. 39.'
