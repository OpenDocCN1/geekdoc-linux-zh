  md: "# Einleitung\n\nBesonders für Linux-Rechner älteren Baujahs, die nicht über\
    \ genügend Ressourcen für die hardwareunabhängigen Darstellungssysteme verfügen,\
    \ sind Steuerungen über textbasierte Programme wichtig. In diesem Fall benutzen\
    \ Sie eine virtuelle Konsole, von der Ihnen im Textmodus sehr zur Verfügung steht.\
    \ Zum Wechsel zwischen den Konsolen drücken Sie die Tastenkombinationen Alt +\
    \ F1 bis Alt + F6. Die sechste Konsole ist X11 reserviert.\n\n# Einführung in\
    \ die Bash\n\nAuf der Taskleiste finden Sie ein Icon, das einen Monitor mit einer\
    \ Muschel (engl. shell) zeigt. Mit diesem Symbol öffnet sich das „Konsole“-Fenster,\
    \ in dem Befehle eingeben können. Es handelt sich dabei standardmäßig um eine\
    \ Bash (engl. Bourne again). Die Bash wurde vom GNU-Projekt entwickelt und ist\
    \ ein wohl verbreitetes Derivat der Bourne Shell (sh). Wenn Sie die Bash geöffnet\
    \ haben, sehen Sie in der Zeile den „Prompt\", der gewöhnlich den Benutzer- und\
    \ Renamen sowie den aktuellen Pfad beinhaltet, aber individuell konfiguriert werden\
    \ kann. Wenn der Cursor hinter diesem Prompt steht, können Sie direkt Befehle\
    \ an Ihr Computersystem schicken: \n\n```\ntux@eder:->\n```\n\n# Befehle\n\nBefehle\
    \ bestehen aus verschiedenen Bestandteilen. Zuerst kommt dann der Parameter oder\
    \ Optionen. Jeder Befehl wird ausgeführt, wenn Sie ls drücken. Vorher können Sie\
    \ problemlos die Kommandozeile editieren, Optionen oder Tippfehler korrigieren.\
    \ Eine der am häufig gebrauchten Befehle ist ls, den Sie alle oder mit genannten\
    \ Argumenten verwenden können. Geben Sie in der Konsole ls ein, wenn der Inhalt\
    \ des Verzeichnisses angezeigt wird, in dem sich befindet. Optionen werden durch\
    \ einen vorangestellten Bindestrich gekennzeichnet. Wenn Sie ls -l eingeben, wird\
    \ der Inhalt des Verzeichnisses in detaillierter Form angezeigt. Sie sehen neben\
    \ den Dateinamen das Erstellungsdatum der Datei, die Größe in Bytes und weitere\
    \ Angaben, die wir später eingehen werden. Eine der wichtigsten Optionen überhaupt,\
    \ die es zu sehr viele Befehle gibt, ist die Option --help. Wenn Sie z. B. ls\
    \ --help eingeben, werden Ihnen alle Optionen zum Befehl ls angezeigt."
  merge: -1
