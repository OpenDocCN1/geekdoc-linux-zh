- img_proc: true
  md: 'Dazu sendet es so ein genanntes „TERM“-Signal, welches Programm auffordert,
    sich selbst zu beenden. Hilft dies nicht weiter, gibt es noch einen nützlichen
    Parameter:


    # Optionen:


    +   -9 Sendet anstatt eines „TERM“- ein „KILL“-Signal, wodurch der Prozess vom
    Betriebssystem entfernt wird. Dies macht in nahezu allen Fällen den spezifizierten
    Prozessen den Garaus.


    ```

    killall [Option(en)] Processname

    ```


    Dieser Befehl funktioniert äquivalent zu kill, wobei eine des Prozess-Namens ausreicht,
    um alle so nennenden Prozesse zu „töten".


    # Netzwerk


    ```

    ping [Option(en)] Rechnername|IP-Adresse

    ```


    ping ist das Mittel schlechthin, um TCP-IP-Netzwerke auf ihre grundsätzliche Funktionsfähigkeit
    zu überprüfen. Das Tool sendet dabei ein Datenpaket an einen anderen Rechner der
    Anforderung, dies sofort wieder zurückzusenden. Klappt dies, zeigt ping eine entsprechende
    Meldung an, wodurch die grundsätzliche Übertragungsfähigkeit des Netzes sichergestellt
    wurde.


    # Optionen:


    +   -c Anzahl: Legt die Gesamtzahl der zu versenden Pakete fest, nach deren Versand
    sich das Programm beendet. Standardmäßig existiert keine Beschränkung.

    -f „Flood ping“: Sendet viele Datenpakete wie möglich. Nur von root ausführbarer
    Test, um Netzwerke zu testen.

    -i Wert: Legt das Intervall zwischen zwei Paketen in Sekunden fest, standardmäßig
    eine Sekunde.


    ```

    nslookup

    ```


    Zur Umwandlung von Domainnamen in IP-Adressen existiert das genannte Domain Name
    System. Mit diesem Tool lassen sich Anfragen an entsprechende Auskunftsdienste
    (DNS-Server) stellen.


    ```

    telnet [Option(en)] Rechnername oder IP-Adresse

    ```


    Telnet ist ein Internet-Protokoll, das die Arbeit auf anderen Rechnern („remote“)
    über ein Netzwerk ermöglicht.'
  merge: -1
