  md: "3. Es ist für das jeweilige Modell wenigstens eine Konfiguration in der Druckerdatenbank\
    \ eingetragen, die als problemlos funktionierend gilt.\n\nFür jede Konfiguration\
    \ sollte grundsätzlich mit dem YoST2-Testdruck ausgewertert werden, ob sie tatsächlich\
    \ funktioniert . Die YoST2-Testdatei liefert zusätzliche wichtige Informationen\
    \ zur jeweiligen jeweiligen Konfiguration.\n\n# Manuelle Konfiguration\n\nWenn\
    \ eine der Bedingungen für die automatische Konfiguration nicht erfüllt ist oder\
    \ wenn eine speziell individuelle Konfiguration gewünscht ist, muss die Konfiguration\
    \ mehr oder weniger manuell erfolgen.\n\n# Hardwareanschluss (Schnittstelle)\n\
    \nWenn der Drucker nicht erkannt wird, deutet dies darauf hin, dass der Druckeranschluss\
    \ auf Hardwareebene ohne manuelle Konfiguration funktioniert. Dann muss die Schnittstelle\
    \ konfiguriert werden. Ein nichtannter Drucker wird als „Andere (nicht bekannte)“\
    \ den verfügbaren Drucker aufgeführt. Klicken Sie auf „Konfigurieren“, wählen\
    \ Sie im folgenden Menü den Anschluss und klicken Sie auf 'Weiter'.\n\nDann sehen\
    \ Sie die zuhörige Schnittstelle:\n\n```\n/dev/lp0\t\\ist die erste parallele\
    \ Schnittstelle\n/dev/usb0\tist die Schnittstelle für einen USB-Drucker\n```\n\
    \nHierbei sollte unbedingt der entsprechende Test in YoST2 gemacht werden, zu\
    \ prüfen, ob der Drucker über die ausgewählte Schnittstelle überhaupt ansprechbar\
    \ ist. Klicken Sie auf 'Weiter'.\n\nWählen Sie nun Ihr Modell aus. Zu jedem Drucker\
    \ erhalten Sie über das Info-Button Informationen über die Unterstützung unter\
    \ Linux und wo im Falle von GDI-Druckern eventuell Linuxtreiber erhalten sind.\n\
    \nIst das Druckermodell in der Druckerdatenbank eingetragen, gibt es eine Auswahl\
    \ an generischen Ghostscript-Treibern für die Standarddruckrucker. Klicken Sie\
    \ dazu links auf ‘Generische Drucker'.\n\n# Hinweis\n\n> Fragen Sie ggf. beim\
    \ Hersteller des Druckers nach, welche Sprache Ihr Modell kann, oder zu welchem\
    \ Modell in der Druckerdatenbank Ihr Drucker hardwarekompatibel ist – d.h. der\
    \ Drucker müssen diese Drucksprache hardwarevermäßig „verstehen“ und nicht nur\
    \ durch zusätzliche Software emuliert.\n\nHinweis"
