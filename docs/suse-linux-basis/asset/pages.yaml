  md: '# Mehr oder Weniger


    Zwei kleine Programme ermöglichen Ihnen, Textdateien direkt in der Shell anzuschauen.
    Wir brauchen nicht einmal einen Editor starten. Zum Öffnen einer Datei Datei.txt
    geben Sie einfach less README.txt ein. Im Konsolenfenster wird nur der Text angezeigt.
    Mit der Letertaste kommen Sie immer eine Seite weiter, allerdings können Sie die
    Tasten ↑ ↓ benutzen, um sich im Text vorwärts oder rückwärts zu bewegen. Zum Beenden
    des Programms drücken Sie die Taste G.


    Das Programm erhielt seinen Namen nach dem Motto „Weniger ist mehr“ und kann nicht
    nur zum Lesen von Textdateien benutzt werden, sondern z. B. auch die Ausgabe von
    Befehlen benutzt. Lesen Sie sich dazu den Abschnitt Umleitungen auf dieser Seite.


    Neben lässt sich das ältere Programm mehr benutzen, allerdings ist es weniger
    komfortabel, da Sie vor- und zurückblättern.


    # Umleitungen


    Normalerweise ist die Standardausgabe in der Shell Ihr Bildschirm bzw. das Konsole-Fenster,
    die Standardeingabe erfolgt über die Tastatur. Wenn Sie die Ausgabe eines Befehls
    an ein Programm übergeben wollen, müssen Sie dazu eine sogenannte „Pipeline“ (Rohleitung)
    verwenden.


    Wenn Sie die Dateien im Verzeichnis test anzuschauen, geben Sie den Befehl ls
    test | less ein. Das Zeichen | erhalten Sie auf der deutschen Tastatur, im Alt
    und gleichzeitig die Taste mit dem Zeichen < und drücken. Sie sehen nun in der
    Konsole den Inhalt des Verzeichnisses test mit an angezeigt. Das hilft nur, wenn
    die normale Ausgabe ist zu unbersichtlich wird. Sehen Sie sich z. B. das Verzeichnis
    mit ls /dev an, dann sehen Sie im Fenster nur einen Teil des Inhaltes, welches
    stattdessen mit ls /dev | alle Dateien aulisten.


    Falls Sie die Ausgabe von Befehlen in einer Datei speichern wollen, würde der
    Befehl im Beispiel so: ls > Inhalt. Danach haben Sie eine neue Datei mit Namen
    „Inhalt“, die Dateien und Verzeichnisse in test enthält. Mit less können Sie sich
    die Datei anschauen.

    Umgekehrt können Sie eine Datei als Quelle für einen Befehl verwenden. Lassen
    Sie z. B. die Textzeilen Ihrer selbst geschriebenen Testdatei alphabetisch sortieren
    über sort < Testdatei. Die Ausgabe des Befehls erfolgt auf dem Bildschirm. Sie
    sehen nun den Text, den zuvor geschrieben haben, sortiert nach den Anfangsbuchstaben
    in jeder Zeile. Das kann sehr hilfreich sein, wenn Sie z. B. eine unsortierte
    Namensliste sortieren möchten.'
