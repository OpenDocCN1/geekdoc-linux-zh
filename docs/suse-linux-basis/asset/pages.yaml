- img_proc: true
  md: '# 26. Wie kann ich meine Platte defragmentieren?


    Linux hat ein intelligentes Dateisystem. Dieses Dateisystem macht ein Defragmentieren
    überflüssig, da es von vornehere fast keine Fragmente entstehen. Achten Sie darauf,
    dass Ihre Partitionen nicht mehr als 90% voll werden (df -h).


    # 27. Ich lese das etwas von Partitionieren – was ist das?


    Mit Partitionieren ist das Unterteilen der Platte in einzelne Teilbereiche gemeint.
    Windows oder MacOS in einer einzigen Partition. SuSE Linux in der Standardkonfiguration
    drei Partitionen (für die Bootdateien, eine für Linux selbst und eine Swappartition)


    # 28. Wie viel Platz brauche ich für Linux?


    Dies hängt davon ab, wie viele welche Pakete Sie installieren. Eine Standardinstallation
    mit Office benötigt etwa 1 GB. Um eigene Daten Platz zu besitzen, sind 2 GB empfeenswert.
    Wenn Sie alles installieren wollen, brauchen Sie je nach Version zwischen 3 GB
    und 6 GB.


    # 29. Ich brauche Platz für Linux, wie kann ich noch eine Platte dazugehen?


    Sie können unter einem Linux-System jedes Festplatten einbinden, um frei Partitionen
    von Festplatten Platz zur Verfügung zu haben. Wenn Sie mehr Platz benötigen, können
    Sie dort eine zusätzliche Festplatten-Partition „einhängen“ (engl. mount). Die
    genaue


    +   (a) Festplatte einbauen und Linux starten. Achten Sie die entsprechende Anleitung
    der Festplatte.

    (b) Als Benutzer root einloggen.

    (c) Partitionieren Sie mit z.B. fdisk als /dev/hdb1.

    (d) Formatieren Sie die Partition mit mke2fs /dev/hdb1.

    (e) Folgende Befehle eingeben:


    ```

    erde:-# cd /opt

    erde:/opt # mkdir /opt2

    erde:/opt # mount /dev/hdb1 /opt2

    erde:/opt # cp -axv . /opt2

    ```


    Überprüfen Sie nun sorgfältig, ob alle Daten kopiert wurden. Danach können Sie
    das Verzeichnis „wegschieben“ und einen neuen Mountpoint anlegen:'
