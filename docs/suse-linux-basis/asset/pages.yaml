  md: '# 6

    YaST2 - Konfigurationen


    ```

    ./../images/png/yast2_inst_medium.png

    ```


    **Abbildung 6.15:** *YaST2: Installationsquelle wechseln*


    die aktuelle Patchliste und alle zutreffenden rpms vom ersten Server in der Liste

    /etc/suseserver. Wenn Sie bestimmte Patches laden wollen, können Sie

    dem Aufruf zusätzlich Optionen mitgeben.

    Mögliche Optionen sind sich security, recommended, document, YaST2 und op-

    tional. security hot nur sicherheitsrelevante Patches, recommended hot

    die von SuSE empfohlenen Updates, document liefert Ihnen Mitteilungen zu

    den Patches vom FTP-Server, YaST2 liefert nur YaST2-Patches und optional

    liefert Updates von untergeordneter Wichtigkeit.

    Die Mitteilungen zu den Patches werden in /var/lib/YaST/patches/

    i386/update/X.Y/patches gespeichert. Sie können sie nur aus lesen.

    X.Y ist die jeweilige Version von SuSE Linux.


    Der Aufruf nach Download der Security-Patches lautet:


    ```

    erde:/root # yast2_online_update .auto.get security

    ```


    Jedes Mal, wenn Sie .auto aufrufen, wird normalerweise die Liste der

    FTP-Server nach /etc/suseserver geladen. Wenn Sie das abschalten wollen,

    mü Sie die Funktion in der Datei /etc/rc.config deaktivieren. Dazu set-

    zen Sie in der Zeile


    ```

    erde:/root # YAST2_LOADFTPSERVER="yes"

    ```


    yes auf no.

    Installieren können Sie die Patches nun mit


    SuSE Linux - Basis 115'
