- img_proc: true
  md: '![](img/7c7b5e54e6579952ad3fd8bde9e1a136_41_0.png)


    **Abbildung 3.9:** Dialogfenster zum Anlegen eines neuen Termins


    Falls Sie andere Gesprächsteilnehmer definieren möchten, klicken Sie auf den Reiter
    ''Teilnehmer''. Sie können jetzt den Namen und die E-Mail-Adresse eingeben. Hier
    lässt sich auch festlegen, welche Rolle ein Teilnehmer ausübt (Gesprächspartner/in,
    Organisator/in ...). Falls Sie in Ihrem Adressbuch Ihre Kollegen eingetragen haben,
    können Sie sich durch den Button ''Addressbuch... '' den Teilnehmer auswählen
    und E-Mail-Adresse automatisch eingefügt. Wenn Sie jetzt auf ''Übernehmen'' klicken,
    wird Ihr Termin in Ihrem Kalender eingefügt. Dieser Button lässt das Fenster noch
    offen, sodass Sie noch kleine Änderungen vornehmen können. Möchten Sie das Fenster
    schließen, klicken Sie auf ''OK''.


    Mit KOrganizer können Sie nicht nicht nur Termine speichern, sondern auch Aufgaben
    verwalten. Im Menü ''Aktionen'' finden Sie den Eintrag ''Neue Aufgabe''. Probieren
    Sie doch einfach mal die vielfältigen Möglichkeiten aus, die Ihnen KOrganizer
    bietet.'
