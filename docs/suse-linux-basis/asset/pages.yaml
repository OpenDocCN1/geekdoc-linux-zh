  md: 'SuSE Hilfe Komfortabler können Sie die Howto-Texte über die SuSE Hilfe lesen
    und vor allen Dingen durchsuchen lassen.


    # Kerneldokumentation


    Bei Fragen zu Problemen mit dem Kernel selbst ist das Verzeichnis /usr/src/linux/Documentation
    eine ergiebig Informationsquelle, welches nur dann vorhanden ist, wenn die Kernelquellen
    (Paket linux bzw. Paket kernel-source) installiert sind. Darüber hinaus finden
    sich viele wertvolle Hinweise in den einzelnen Unterverzeichnissen der Kernelquellen,
    sowie für die ganz Unnerschrockenen und Neugierigen in den Kernelquellen selbst.


    # Freie Bücher


    In Paket books, Serie doc (Dokumentation) sind einige Bücher im PostScript-Format
    enthalten, die Sie mit Paket gv, Serie gra (Alles rund um Grafik) betrachten oder
    ausdrucken können. Vor dem Ausdruck sollten Sie überlegen, ob es nicht nicht ökonomischer
    ist, ein solches Buch möglicherweise in deutscher Sprache käuflich zu erwerben.


    172 — Kerneldokumentation'
