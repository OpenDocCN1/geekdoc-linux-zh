  md: '# Die Desktopkonfiguration


    Über das GNOME-Kontrollzentrum (s. Abb. 5.6) können Sie sämtliche Erscheinungen
    für Ihren Desktop an einer Stelle vornehmen.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_72_0.png)


    Abbildung 5.6: Das GNOME-Kontrollzentrum


    # Arbeitsplatz


    **Bildschirmschoner** Ihnen stehen viele Bildschirmschoner zur Auswahl, einige
    davon mit 3D-Grafik-Unterstützung. Als Multitasking-Betriebssystem kann Linux
    mehrere Prozesse gleichzeitig ausführen, so dass Sie über den Regler „Priorität“
    Ihrem Bildschirmschoner entsprechende Rechenkapazität zuteilen können. Verfügt
    Ihr System über APM (engl. Advanced Power Management), können Sie über „Stromparmodus
    benutzen“ den Monitor nach einer vorgegebenen Zeit auch abschalten sondern.


    **Fenstermanager** GNOME ist nicht an einen bestimmten Windowmanager gebunden.
    In diesem Dialog können Sie aus einer Liste der Ihrem System vorhandenen Windowmanager
    einen auswählen. Die meisten Windowmanager benutzen ein mitgeliefertes Konfigurationsprogramm,
    das mit einem Klick auf „Konfigurationswerkzeug aufrufen“ gestartet werden kann.'
