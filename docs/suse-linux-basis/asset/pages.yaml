  md: '# Kopieren, Verschieben und Verknüpfen von Objekten Wählen Sie ‘Datei’ →


    ''Neues Fenster‘ um ein zweites Nautilus-Fenster erscheinen zu lassen.

    Durch Hin- und Verschieben können Sie nun mit der linken Maustaste Dateien kopieren.
    Ziehen Sie dagegen das Icon mit der rechten Maustaste, wird an einem Zielort ein
    kleines Menü erscheinen, mit Nautilus gefragt, ob Sie das Objekt dort „versieben“,
    „kopieren“, oder „verknüpfen“ wollen. Nautilus verwaltet den Bildschirmhintergrund
    sowie die Icons, die sich dort befinden. Natürlich können Sie eine Datei auf den
    Bildschirmhintergrund verschieben oder drei verknüpfen.


    Die Nautilus-Hilfe Im linken Teil des Fensters sehen Sie unter den Reiter ‘Hilfe’.
    Alle- und Informationsdokumente werden von Nautilus zusammengefasst, und in ein
    einheitliches HTML-Format gebracht. Wenn Sie die Hilfe-Reiter wählen, erscheint
    im linken Teil des Nautilus eine Zusammenfassung der verschiedenen Hilfe-Themen,
    in welcher eine Baumstruktur angezeigt wird. Wenn Sie eines der Themen aus wählen,
    wird in der rechten Seite des Fensters der Inhalt angezeigt.


    Ortsabhängige Notizen Im Bereich der Hilfe-Reiter finden Sie auf den Reiter ‘Notizen’.
    Sie können zu allem, was im rechten Teil des Fensters zu sehen ist, Notizen machen:
    Internetseiten, Verzeichnisse oder Bild-Dateien. Die Notizen werden immer zusammen
    mit dem Ort des dargestellten Inhalts gespeichert.


    Chronik Die Chronik speichert sämtliche besuchten Orte für den schnelleren späteren
    Zugriff. Sie ist auch über das Menü mittels ‘Gehe zu’ zu erreichen. Hier können
    Sie die aktuelle Chronik löschen (‘Chronik löschen’).


    Dateisystem Der Reiter ‘Baum’ dient als Hilfe, wenn Sie schnell Verzeichnis wechseln
    oder Dateien in andere Verzeichnisse verschieben wollen; er liefert eine übersichtliche
    Darstellung Ihrer Daträgerstruktur. Wie schon im Punkt Kopieren, Verschieben und
    Verknüpfen von Objekten erwähnt, können Sie auch hier durch einfaches Verschieben
    von Dateien Kopieroperationen auslösen.'
