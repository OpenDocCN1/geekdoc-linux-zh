  md: '# DMA-Modul


    Ein neues γaST2-Modul erlaubt es Ihnen, bei installiertem System den sog. „DMA-Modus“
    für Ihre Festplatte(n) und Ihre CD/DVD-Laufwerke zu aktivieren oder zu deaktivieren
    . DMA-Modi können die Leistungsfähigkeit bzw. die Geschwindigkeit der Datenübertragung
    in Ihrem System erheblich steigern.

    Der aktuelle Kernel von SuSE Linux aktiviert bei der Systeminstallation DMA automatisch
    für Festplatten und lässt ihn deaktiviert, da in der Vergangenheit mit standardmäßiger
    DMA–Aktivierung für alle Laufwerke des öften Probleme mit CD-Laufwerken aufgetreten
    sind. Sie nachträglich mit dem DMA-Modul für Ihre Laufwerke entscheiden, ob Sie
    DMA aktivieren oder nicht. Sollten z. B. bei Ihrem Festplattenbetrieb Probleme
    auftreten, kann es hilfreich sein, DMA zu deaktieren. Umgekehrt steigern Sie die
    Datenübertragungsrate Ihres Laufwerks, wenn Sie DMA aktivieren und das Laufwerk
    den Modus ohne unterstützt.


    > Hinweis

    > „DMA“ (= Direct Memory Access) bedeutet „Direkter Speicherzugriff“, d.h. Laufwerke
    können Ihre Daten direkt in den Arbeitsspeicher übertragen ohne den „Umweg“, über
    den die Prozesssteuerung.


    # Internet-Zugang


    # Grundlagen einer Internetverbindung


    Hier werden die wichtigsten Begriffe für Internetanbindung angesprochen und deren
    Zweck und Funktion kurz dargestellt.

    Alle Rechner im Internet bilden ein einzig großes Netzwerk, in dem unterschiedliche
    Betriebssysteme auf unterschiedlicher Hardware laufen. Damit beliebige Rechner
    miteinander kommunizieren können, muss ein allgemeines, verbindliches Kommunikationsprotokoll
    verwendet werden, über das die verschiedenen Betriebssysteme unabhängig von der
    jeweiligen Hardware ihre Daten austauschen können. Das leistet das Internet Protocol
    (IP) zusammen mit dem Transmission Control Protocol (TCP), dem User Datagram Protocol
    (UDP) und dem Internet Control Message Protocol (ICMP). Diese Protokolle bilden
    die gemeinsame „Sprache“ aller Rechner im Internet und die Kurzbezeichnung TCP/IP.'
  merge: -1
  pgno: 104
- img_proc: true
  md: 'Jeder Rechner im Internet hat eine Identifikationsnummer, die so genannte IP-Adresse,
    und nur über diese Nummer kann er via TCP/IP angesprochen werden. Normalerweise
    hat ein Rechner auch einen Klartextnamen, mit dem er in Anwendungsprogrammen bezeichnet
    wird. Um die IP-Adresse zu einem Klartextnamen zu bekommen, gibt es das Domain
    Name System (DNS). Dies ist ein spezieller Dienst, der genannte Nameserver bereitstellt,
    heißt Server (hier z. b. DNS-Server), ein Rechner oder Programm, der einen Dienst
    beansprucht, heißt Client.


    Unterhalb von TCP/IP gibt es verschiedene standardisierte Protokolle, welche TCP/IP-Daten
    der jeweiligen Übertragungsart zu übermitteln – zum Beispiel Verbindungen über
    Netzwerkkarte ist das Ethernet-Protokoll, bei Modem- und ISDN-Telefonverbindungen
    das Point to Point Protocol (PPP) und bei ADSL/TSL-Verbindungen das Point to Point
    Ethernet Protocol (PoE).


    Zum Aufbau einer Internetverbindung muss zuerst die Ethernet-, PPP-oder Verbindung
    und dann die TCP/IP-Verbindung zwischen dem eigenen Rechner und einem Internetprovider
    hergestellt werden.

    Oberhalb von TCP/IP gibt es verschiedene standardisierte Protokolle, um Daten
    passend zu der jeweiligen Anwendung übertragen zu können:


    +   - Das Hyper Transfer Protocol (HTTP) dient dazu, WWW-Seiten im Hyper Markup
    Language (HTML) Format zu übertragen

    - mit dem Simple Mail Transfer Protocol (SMTP) werden E-Mails an einen anderen
    Rechner verschickt und mit dem Post Office Protocol (POP3) können E-Mails bei
    Bedarf von einem Mail-Server heruntergeladen werden.

    - Um Daten zu übertragen, wird das File Transfer Protocol (FTP) verwendet.


    Damit verschiedene Anwendungsprogramme, z. B. ein WWW-Browser und ein E-Mail-Programm,
    die Internetverbindung zur selben nutzen können, wird jedoch Anwendung eine separate
    TCP/IP-Verbindung verwendet und große TCP/IP-Datenmengen in kleine Pakete zerlegt,
    so dass abwechselnd z. B. das HTTP-Pakete des WWW-Browsers über diesen TCP/IP-Verbindung
    und die SMTP- bzw. POP3-Pakete des E-Mail-Programs über andere TCP/IP-Verbindungen
    übertragen werden können.


    Da verschiedene Programme die sogenannte Internetverbindung benutzen, genü die
    IP-Adresse, alleine nicht, sondern unter Unterscheidung welche TCP/IP-Daten zu
    welchem Programm gehören, die so genannte Port-Nummer.


    Die Standarddienste wurden traditionell auf dem entsprechenden Server über folgende
    Port-Nummern angeboten:'
