  md: '# 5


    Dialogfelder Dialoge dienen der Interaktion mit dem Benutzer. Hier können Sie
    Einstellungen für alle GNOME kompatiblen Programme vornehmen, die Dialoge anzeigen.
    Im Rahmen ‘Dialoglayout‘ lässt sich einstellen, welche Ausrichtung die Dialogknöpfe
    (rechtsbündig, linksbündig, gleichmäßig) wird und ob die Knöpfe mit Tastatur gestellt
    werden. Im Rahmen ‘Dialogverhalten‘ können Sie einstellen, wie aufkommende Dialoge
    positioniert werden. Entweder wird diese Entscheidung vom Fenstermanager übernommen
    oder GNOME positioniert Dialoge generell in der Mitte des Bildschirms oder an
    der Position, an der sich der Mausiger befindet. Mit ‘Dialog über Anwendungsfenster
    platzieren‘ stellen Sie sicher, dass aufkommende Dialoge immer über dem aktuellen
    Anwendungsfensters geöffnet werden.


    GNOME Modi Optionen Die MDI (Multiple Document Interface) Optionen für Anwendungen
    interessant, die mehrere Dokumente gleichzeitig verwalten. Mit der Einstellung
    ‘Notizbuch’ werden mehrere Dokumente in einen darüber liegenden Reiter zusammengefasst.
    ‘Modal’ wird die gesamte Fläche eines Anwendungsfensters genutzt, weshalb mit
    ‘Fenster‘-Menüs auf ein anderes Dokument umgeschaltet werden muss, während ‘Eigenes
    Fenster‘ sich für jedes Dokument ein eigenes Fenster öffnet.


    # Multimedia - Klang


    Wählen Sie ‘Soundserver starten’, um den GNOME-Soundserver zu starten. Sie benötigen
    dazu eine Soundkarte. Mit ‘Känge für Ereignisse‘ lassen sich GNOME die Aktivitäten
    der Programme überwachen und in bestimmten Situationen Sounds ausgeben. Über den
    Reiter ‘Klangereignisse‘ können Sie bestimmen, bei welchen Ereignissen welcher
    Sound ausgegeben wird.


    # Peripherie


    Maus GNOME bietet einige Möglichkeiten, die Bewegung der Maus zu konfigurieren.
    Zunächst einmal können Sie Links im Rahmen ‘Maustasten‘ einstellen, ob Sie die
    Anordnung der Tasten für Rechts- oder Linkshänder haben wollen. Im Rahmen ‘Mausbewegung‘
    können Sie das Beschleunigungsverhalten der Maus einstellen, welche die Schiebereleiste
    ‘Schwelle‘ bestimmt, bei welcher Geschwindigkeit die Mausbeschleunigung einsetzt.


    Tastatur Stellen Sie hier Eigenschaften wie die Tastenwiederholungsrate oder die
    Dauer der Tastaturglocke ein.'
