  md: '# Dateien, Ordner und Verzeichnisse


    +   - Wo ist mein Laufwerk C:?

    Laufwerke sind Speicherkomponenten wie Floppy, CD-ROM und Festplatten. Vermutlich
    kennen Sie diese Laufwerke unter der Bezeichnung A;: C: oder D: Linux bezieht
    im Gegensatz zu Betriebssystemen wie Windows-sowie Win-dolsche Komponenten direkt
    in seinen Verzeichnisbaum ein. Das Linux-Dateisisystem kennt insofern keine Laufwerksbezeichungen
    wie C;, sondern nur Ordner (also Lagerorte), die der Benutzer mitteilen, wo sich
    seine Dateien befinden.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_15_0.png)


    +   - Was ist root?

    Root ist ein Strich! Der wichtigste Strich in der Computerwelt. Das Linux-Dateisystem
    stellt standardmäßig einen Verzeichnisbaum zur Verfügung, der mit einer Wurzel
    beginnt und in zahlreiche Äste zweigt. Diese Unterverzeichnisse heißen z. B. home
    (dort liegen die persönlichen Dateien des jeweiligen Benutzers) oder bin (hier
    liegen binäre Daten, imfall Programme). Diese Struktur, in der Dateibaurzel, wird
    als „root“ bezeichnet. Man spricht auch von „root directory“, weil man von hier
    aus in jedes Unterverzeichnis gelangen kann. Man könnte es auch Wurzelverzeichnis
    nennen, doch hat man sich für das einfache / entschieden. Dieser Strich kennzeichnet
    außerdem auch noch jeden Ordner, weil jeder Ordner selbst auch wieder die Wurzel
    für ein eigenes Dateisystem bilden kann.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '+   Wer ist root ?


    Root ist ein Benutzer im Mehrbenutzersystem Linux. Aber nicht irgend, sondern
    der mächtigste Benutzer auf Ihrem Rechner; gleichlich auch die Person mit der
    größten Verantwortung. Ein Hausmeister ist root für das gesamte Linuxsystem. Seine
    Aufgabe ist es, dafür zu sorgen, dass das System läuft, die Infrastruktur funktioniert,
    dass alle Programme auf dem neuesten Stand sind und kein „Hausbewohner“ seine
    Rechte überschreitet. Ein Hausmeister verfügt über einen Generalschlüssel zum
    Linuxsystem und kann Dinge ändern, die ihm als normaler Benutzer nicht heranzukommen.
    Root hat den umfassenden Zugriff auch auf das Hauptverzeichnis / alle Unterverzeichnisse.
    Deshalb nennt man ihn „root".


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_16_0.png)


    Sollten sich immer nur als root an Ihrem Rechner anmelden, wenn es wirklich nötig
    ist! Etwa einen neuen Nutzer einzurichten oder um Programme zu installieren. Sollte
    eine Aktion root-Rechte forfordern, werden Sie im Regfall darauf aufgefordert
    das root-Password, den Generalschlüssel, einzugeben.


    +   Was liegt wo auf meinem Rechner?


    Unter Linux gibt es einige wichtige Verzeichnisse. Die folgende Auflistung beschreibt
    die wichtigsten. Ein vollständiger Überblick liefert Ihnen Abbildung 7 auf Seite
    123.


    ```

    /home

    ```


    Heimatverzeichnis der einzelnen Benutzer. Hier liegen alle Ihre Daten, Einstellungen
    und alles, worauf Sie Zugriff haben sollen. Im Allgemeinen können diese Daten
    von allen gelesen, aber von niemand als dem Eigentümer verändert werden. Diese
    Voreinstellung kann natürlich jederzeit geändert werden. Weitere Informationen
    liefert Ihnen den Abschnitt Rechte im Dateisystem auf Seite 131.


    ```

    /root

    ```


    Heimatverzeichnis des Administrators root.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# /usr (Unix System Ressourcen)


    Aus diesem Verzeichnis holen sich viele Programme Dokumente, Informationen, Hilfstexte
    und andere wichtige Daten.


    # /bin und /sbin (ausführbare Programme)


    In diesen Verzeichnissen sind viele systemnahe Programme zu finden, welche zum
    Systemstart benötigt werden.


    # /opt (optionale Software)


    Kommerzielle Software oder sehr große Programme, die nicht zum System gehören,
    wie etwa KDE, Netscape, Mozilla usw. finden hier ihren Platz.


    # /etc (Konfigurationsordner)


    Hier sind Dateien zusammengefasst, die Konfigurationsinformationen für Ihren Rechner
    enthalten. Sie beinhalten z Informationen zur Internetbindung, zum Startmodus
    des Rechners oder einzelnen Programmen wie Backup (Datensicherung).


    # /boot (Ordner für den Systemstart)


    Dateien und Programme, die zum Systemstart benötigt werden, z. B. der Kernel.


    # Sonstige


    Daneben gibt es noch weitere Ordner, die Informationen zum System und den angeschlossenen
    Geräten enthalten:


    /lib und /usr/lib (Bibliotheken), /var (variable Daten), /proc (Prozesse), /media
    (austauschbare Datenträger wie Floppy, CD etc.) /dev (all angeschlossenen Geräte
    wie Drucker, Festplatten, Tastaturen etc.)


    Weitere Informationen finden Sie im Abschnitt Dateien und Verzeichnisse auf Seite
    123.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Von Passwörtern und Benutzern


    +   - Wies brauche ich ein Passwort? Passwort ist der Schlüssel zum Homeverzeichnis.
    Anders als andere Betriebssysteme ist Linux ein echtes Mehrbenutzersystem. Das
    bedeutet, SuSE Linux verwaltet nicht die Daten und Einstellungen der einzelnen
    Benutzer voneinander, unterschiedliche Benutzer können darüber hinaus auch gleichzeitig
    am selben Rechner arbeiten. Wenn Sie sich das vorstellen, Ihr Rechner hätte zwar
    zwei Tastaturen und zwei Bildschirme, könnten Sie und ein anderer Nutzer gleichzeitig
    an denselben Rechner arbeiten, ohne gegenseitig zu stören.


    In der Praxis würden sich Tastatur und Bildschirm im selben Raum stunden, also
    auch ein Netzwerk verbunden wären, was nicht einmal bemerken, dass ein zweiter
    Nutzer ebenfalls mit dem System arbeitet, so intelligent verteilt Linux die vorhandene
    Rechenleistung auf die angemeldeten Nutzer.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_18_0.png)


    Jeder Nutzer besitzt ein Verzeichnis, das nur ihm gehört, dort ist zu Hause. In
    seinem Homeverzeichnis werden alle seine Daten und alle von ihm vorgenommen Einstellungen
    zu seinen Programmen gespeichert, z. B. die Bookmarkliste des Browsers und das
    Adressbuch für das Mailprogramm. Dieser Bereich ist aus Sicherheitsgründen durch
    ein Passwort geschützt. Nur mit diesem Passwort ist der Zugang zu Ihren persönlichen
    Dateien möglich.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '+   ■ Wieso kann ich manche Daten lesen, aber nicht löschen?


    Weil Sie sich nicht das Recht dazu haben haben. Aufgrund der Eingabe Ihres Passwortes
    erkennt Ihr Computer nicht nur Ihr Homeverzeichnis, sondern auch die Ihnen als
    Benutzer eingeräumten Rechte, d.h. was Sie am Rechner tun dürfen und was nicht.
    Natürlich dürfen Sie in /etc die meisten Dateien anschauen, aber ändern darf sich
    nur der Systemadministrator. Verzeichnisse, die die Sicherheit und Stabilität
    des System betreffen, sind für Sie entweder nur lesbar oder ganz verschlossen.


    ```

    ./images/png/um_rechte.png

    ```


    Bei Sie den Daten in Ihren Homeverzeichnis können Sie selbst bestimmen, was Sie
    vor den Augen der anderer Nutzer verbergen wollen und was Sie zur gemeinsamen
    Bearbeitung freiggeben. Klicken Sie mit der rechten Maustaste auf die Datei und
    wählen Sie dann den Menüpunkt ‘Eigenschaften’. Sie können sogar ganz verstecken,
    indem Sie vor den Datenamen einen Punkt schreiben.


    +   ■ Wie kann ich Benutzer hinzufügen oder entfernen?


    Neue Benutzer werden von root angelegt. Wie Sie bereits wissen, müssen Sie sich
    immer dann als root (Systemadministrator) an Ihrem Rechner anmelden, wenn es etwas
    zu Administrieren gibt, wenn ein neuer Benutzer angelegt werden soll. Starten
    Sie als normaler Benutzer das YaST2 Kontzentrum, wählen Sie den Schlüssel ‘Sicherheit
    & Benutzer’ und geben Sie das root-Passwort ein. Im rechten Feld erscheint eine
    Auswahl von Möglichkeiten unter anderem der Punkt ‘neuen Benutzer anlegen’. Wenn
    Sie die Felder ausfüllen (Vorname und Nachname), wird ein neuer Benutzer angelegt
    und ein Passwort (Kennwort) hinterlegt.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'Bei der Eingabe eines Passwords müssen Sie Groß- und Kleinschreibung unterscheiden.
    Ein Passwort sollte mindestens fünf Zeichen lang sein und keine Sonderzeichen
    (z. B. Akzente) enthalten. Erlaubt sind die Zeichen #*,;-_+$%&/![] Leerzeichen
    und Ziffern von 0 bis 9 sind zweckmäßig, eine Länge von ca. 8 Zeichen zu wählen.
    Um sicherzustellen, dass das Passwort korrekt eingegeben wurde, muss es in einem
    zweiten Feld ohnezeichen wiederholt werden. Wichtig: Merken Sie sich das Passwort
    gut!


    Der sog. Benutzername (login) wird als Komponenten des gesamten Namens erzeugt.
    Sie können YaST2 einen Benutzernamen vorschlagen. Diese können Sie ändern oder
    selbst einen Namen eingeben. Der Name darf nicht Kleinbuchstaben (wie Umlaute),
    Ziffern und die Zeichen _ enthalten. Benutzernamen haben noch stärkere Beschränkungen
    als Passwörter.


    Wenn Sie mit Linux arbeiten, melden Sie sich mit diesem Benutzernamen und dem
    Passwort System an; dieser Vorgang des Anmelden wird auch beim Login bezeichnet.


    Wenn Sie einen Nutzer löschen wollen, wählen Sie den Punkt ''Nutzer anlegen und
    bearbeiten''. Wählen Sie den Nutzer aus und klicken auf ''löschen''.


    # Mounten, Shell und anderes


    +   - Was ist mount?


    Weil es mount gibt, können Sie eine Diskette oder CD nicht einfach aus dem Laufwerk
    nehmen. Selbst wenn diese Medien in das Laufwerk eingelegt werden, müssen sie
    erst gemountet, bevor sie gelesen werden können. Der Befehl mount führt einen
    Datenträger in den Dateibaum ein, mit umount kann dieser wieder entfernt werden
    (unter KDE wird diese Aktion im Hintergrund ausgeführt, etwa wenn Sie auf CD-Symbol
    klicken).


    Warum ist das so?

    Wie immer keine kleine Linuxhden als eigentlich praktisch. Linux ist es, welche
    Form von Datenträger Sie mounten wollen, ob Floppy, DVD, Festplatte oder ZIP-Laufwerk,
    alle werden beim System und wieder abemeldet. Ein System oder Arbeitsplatz, an
    dem viele Personen gleichzeitig arbeiten, ist dassofern wichtig, dass mehrere
    Benutzer und mehrere Programme auf den Dateibaum zugreifen können.'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'Stellen Sie sich einmal vor, jemand würde dort in der Firma die Schubladen
    austauschen, nur weil er für eine Stunde an Ihrem Schreibtisch arbeitet. Sie kommen
    zwischendurch zurück und suchen einen ganz wichtigen Vertragsentwurf, doch nun
    ist Ihre Schublade nicht mehr da. Aus diesem Grund müssen Sie solche „Schubladen“,
    die Laufwerke unseres Dateisystems, mounten und unmounten.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_21_0.png)


    +   ■ Warum kann ich meinem Rechner nicht einfach ausschalten?

    Doch das können Sie, nur wäre dieser Knockout nicht besonders nett. Es könnte
    ja sein, außer Ihnen ist noch ein zweiter Nutzer vernetzt an Ihrem Rechner arbeitet.
    Und denn noch nicht gespeicherte Daten sind in Gefahr, wenn Sie das System einfach
    ausschalten.


    Natürlich gilt das auch für Ihre eigenen Daten, wenn Sie sich aber ordnungsgemäß
    abmelden, haben Sie die Gewissheit, dass Ihre Daten sicher gespeichert sind. SuSE
    Linux ist bekannt für seine hohe Datensicherheit, warum diese Eigenschaft nicht
    nutzen?


    +   ■ Alles hört auf Kommando!

    In einem Linux-System kommt man immer über mehrere Wege zum Ziel. Das mag am Anfang
    etwas verwirrend sein, aber hat viele Vorteile. Soll eine Funktion ausfallen oder
    gesperrt sein, können Sie diesel Befehle dem Rechner auch anders mitteilen.


    So können Sie beispielsweise anstelle des Programmaurufs per Mausklick im Menü
    den Programmnamen auch über die Tastatur eingeben und das Programm trotzdem starten.
    Oder lassen Sie sich den Inhalt eines Ordners `ls` zeigen.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '![](img/7c7b5e54e6579952ad3fd8bde9e1a136_22_0.png)


    Eingegeben werden solche Befehle über die Textkonsole, ein unspektakuläres kleines
    Textfeld, über das der Computer fast vollständig gesteuert werden kann. Profis
    arbeiten gerne mit der Konsole, weil man hier Befehle zu einer langen Befehlskette
    zusammenfassen kann und dadurch am Ende schon fast etwas wie ein kleines Programm
    hat. Von Fall zu Fall ist das viel praktischer als mit der Maus zu arbeiten. Mehr
    zum Arbeiten mit der Konsole finden Sie weiter hinten in dem Kapitel Arbeiten
    mit der Shell.'
