  md: '# Sonstiges


    # Backup


    Mit dem neuen Backup-Modul haben Sie zum ersten Mal die Möglichkeit, mit YaSST2
    Backups Ihres Systems durchzuführen. Das Modul führt keine vollständigen Backups
    durch, sondern sichert nur Informationen über geänderte Pakete, systemkritische
    Bereiche und Konfigurationsdateien.

    Bei der Konfiguration können Sie bestimmen, welche Dateien gesichert werden sollen.
    Standardmäßig werden Informationen gespeichert, welche Pakete seit der letzten
    Installation geändert wurden. Zusätzlich können Sie Dateien speichern, welche
    Konfigurationsdateien in Ihrem `/etc/` oder Ihrem home-Verzeichnis gehören. Außerdem
    können weitere Systembereiche auf der Festplatte durch Partitionierungstabelle
    dem MBR hinzugefügt werden, die dann bei einer nötigen Restaurierung benutzt werden
    können.


    # Boot-Modus


    Der Boot-Modus wird normalerweise während der Installation festgelegt. Wenn Ihr
    SuSE Linux bootet, brauchen Sie hier nachräglich nichts zu ändern, es sei denn,
    Sie haben bislangan von Diskette gebootet und möchten von der Festplatte starten.


    > Hinweis

    Ändern des Boot-Modus im laufenden System ist nur für Experten zu empfehlen. Lesen
    Sie bei Bedarf im Referenz-Handbuch den Abschnitt LILO-Installation. Informationen
    über das Referenz-Handbuch finden Sie im Vorwort.

    Hinweis


    # Erstellen einer Boot-, Rettungs- oder Moduldiskette


    Mit dem YaST2-Modul (unter ‘System‘ zu finden) können Sie sich auf sehr verschiedene
    Art und Weise zweierlei unterschiedliche Bootdisketten, eine Rettungsdiskette
    und zweierlei verschiedene Moduldisketten erstellen. Die beiden Bootdisketten
    können bei Neueinstallation, falls Sie z. B. Probleme beim Booten von CD haben
    haben. Die Disketten sind eigentlich nicht für das Booten eines installierten
    Systems gedacht, mit einem kleinen Trick (siehe letzten Abschnitt) können Sie
    sie trotzdem dafür verwenden.'
  merge: -1
  pgno: 126
- img_proc: true
  md: '![](img/7c7b5e54e6579952ad3fd8bde9e1a136_127_0.png)


    # Abbildung 6.17: YaST2: Eine Boot-/Moduldiskette erstellen


    +   **Bootdisketten erstellen:

    Bei der Standard-Bootdiskette handelt es sich um diejenige, welche Sie auch im
    SuSE Linux Karten finden. Außerdem können Sie sich eine Bootdiskette für i386
    und ältere Cyrix-Prozessoren erstellen.


    +   **Rettungsdiskette erstellen:**\Schließlich gibt es noch die Rettungsdiskette,
    mit deren Hilfe Sie sich wieder Handlungszugriff auf Ihr System erhalten. Es wird
    ein „minimales Linux“ gestartet, das alle hilfreichen Tools enthält, mit dem Sie
    eventuell Probleme beseitigen können.


    +   **Moduldisketten erstellen:**\Wenn Sie zur Installation zusätzliche Module/Treiber
    für Ihre Hardware benötigen, z. B. Falls Sie über Netzwerk installieren, dann
    erstellen Sie sich eine dieser Disketten: Module für SCSI/RAID/EIDE und PCMCIA
    und ältere CD-ROM-Treiber (nicht für ATAPI) oder Netzwerk-Modul.


    Wählen Sie den entsprechenden Punkt in der Maske an, legen Sie eine (am besten
    neue bzw. formatierte) Diskette ein und klicken Sie auf ‚Weiter’, wird der jeweilige
    Inhalt auf die Diskette geschrieben.

    Die oben genannten Bootdisketten sind nicht zu verwechseln mit den Bootetten,
    die ein bereits installiertes System booten. Eine solche Diskette wird z. B. während
    der Installation erstellt und startet Ihr auf der Festplatte installiertes Linux,
    wenn Sie beim Rechner einlegtlegt.'
