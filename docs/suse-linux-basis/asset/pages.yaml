- img_proc: true
  md: '3. Evtl. werden noch einige Daten an den Drucker übertragen, obwohl der Druckauftrag
    aus der Warteschlange gelöscht ist. Alle Prozesse, die noch auf den Drucker zugreifen,
    können mit fuser beendet werden; für einen Drucker am Parallelport:


    ```

    erde: # fuser -k /dev/lp0

    ```


    Für einen USB-Drucker können:


    ```

    erde: # fuser -k /dev/usb10

    ```


    4. Setzen den Drucker komplett zurück indem Sie ihn einige Zeit vom Stromnetz
