  md: '![](img/7c7b5e54e6579952ad3fd8bde9e1a136_40_0.png)


    **Abbildung 3.8:** KOrganizer – der Terminplaner für KDE


    Im unteren Textfeld können Sie einen etwas ausführlicheren Text eingeben. Um Ihren
    Terminen eine gewisse Struktur zu geben, können Sie soannte Kategorien festlegen.
    Dazu brauchen Sie nur den Button ''Kategorien'' anklicken; ein Fenster öffnet
    sich, dem Sie die entsprechenden Einträge auswählen können. Falls ein solcher
    Eintrag existiert, tragen Sie in ''Kategorie bearbeiten'' den Namen ein und drücken
    ''OK''. Mit ''OK'' schließen Sie das Fenster.

    im Folgenden stellen wir vor, wie Sie effektiv einen Termin anlegen können. Rufen
    Sie dazu am besten im ''Aktionen''-Menü den Punkt ''Neuer Eintrag''.


    **Beispiel**


    Legen wir einen einfachen Termin an. Dazu tragen Sie im Feld ''Zusammenfassung''
    ein, worum es bei Ihrem Termin geht. Das Datum bestimmen Sie durch ''Anfangsdatum''
    bzw. ''Enddatum''. Falls eine Zeit sinnvoll erscheint, legen Sie die Zeit im Auswahlfeld
    ''Beginn'' bzw. ''Ende'' ein. Falls Sie keine Zeit festlegen wollen, aktivieren
    Sie einfach das ''Keine Zeit festlegt''.


    Wenn Sie sich an Ihren Termin erinnern lassen wollen, aktivieren Sie ''innerung''.
    Jetzt wird das nebenstehende Eingabefeld frei und Sie können bestimmen, ob Sie
    in Minuten, Stunden oder Tagen daran erinnert werden wollen. Im darunter liegenden
    Textfeld geben Sie die Details zu Ihrem Termin ein, und unter ''Kategorie'' verbessert
    die Übersichtlichkeit des Kalenders.'
  merge: -1
