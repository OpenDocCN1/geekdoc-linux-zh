- img_proc: true
  md: 'Zur Not können Sie aber mit der oben erstellten Bootdiskette eines bereits
    installierten System starten. Booten Sie hierfür von der Diskette, und wenn Sie
    aufgefordert werden, die erste CD einzulegen, brechen Sie den Dialog ab (um den
    Beginn einer Neuinstallation zu verhindern). Wenn Sie die folgenden Eingaben für
    Sprache und Tastatur machen, gelangen Sie in ein Menü, in Sie ''Installation /
    System'' starten können. Im nächsten Fenster erscheint dann ''Installiertes System
    booten''.


    # Zeitzone und Sprache auswählen


    # Zeitzone auswählen


    Unter ''System'' finden Sie im YaST2 Control Center den Button ''Zeitzone auswählen''.
    Die Zeitzone legen Sie während der Installation fest – hier haben Sie die Möglichkeit,
    eine nachträgliche Änderung vorzunehmen. Klicken Sie in der Länder-Liste einfach
    auf Ihr Land und wählen Sie ''Ortszeit'' oder ''GMT'' (engl. Greenwich Mean Time).
    Bei jedem Linux-System ist es üblich, ''GMT'' zu verwenden. Rechner mit weiteren
    Betriebssystemen wie z. B. Microsoft Windows verwenden die Ortszeit.


    # Sprache auswählen


    Unter ''System'' finden Sie im YaST2 Control Center den Button ''Choose Language''.
    Hier können Sie die Sprache für Ihr Linux-System einstellen, wenn nicht während
    der Installation geschehen. Die Sprache lässt sich hier auch nachträglich ändern.


    Die mit YaST2 vorgenommene Spracheausinstellung erstreckt sich systemweit – also
    auch für YaST2, YaST und den Desktop KDE 2.


    # Treiber-CD des Herstellers laden


    Mit diesem Modul können Sie Gerätetreiber von einer Linux-Treiber-CD, der Treiber
    für SuSE Linux enthält, automatisch installieren.


    Falls eine Neuinstallation Ihrer SuSE nötig sein sollte, können Sie nach der Installation
    mit Hilfe dieses YaST2-Moduls die notwendigen Treiber von der Hersteller-CD nachladen.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_128_0.png)'
