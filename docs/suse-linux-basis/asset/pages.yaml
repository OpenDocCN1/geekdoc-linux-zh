  md: "# Druckname\n\nGemeint ist hier der Name der,,Warteschlange“, der beim Drucken\
    \ ein-zugeben sein wird. Daher sollten nur kurze Namen aus Kleinbuchstaben und\
    \ evtl. Zahlen verwendet werden. Standardmäßig ist hier als erste-Warteschlange\
    \ lp eingestellt.\n\n# Konfiguration für Anwendungsprogramme\n\nAuf der Kommandoleiste\
    \ druckt man mit dem Befehl lpr -Plp Dateiname wobei Dateiname den Namen zu druckenden\
    \ Datei zu ers-zen ist. In diesem Fall wird die Standardwarteschlange lp verwendet.\
    \ Durch die Option -P wird die Warteschlange explizit bestimmt werden. Mit lpr\
    \ -Color Dateiname wird beziehungsweise die Warteschlange color verendet.\n\n\
    Anwendungsprogramme verwenden auch den lpr-Befehl zum Drucken. Konfi-gurieren\
    \ Sie daher in den Anwendungsprogrammen im Normalfall keinen Drucker, sondern\
    \ verwenden Sie die Warteschlangen, die Sie mit YaST2 einge-richtet und deren\
    \ Funktion Sie durch das Drucken der YaST2-Testseiten überprüft haben.\n\nWählen\
    \ Sie dazu im Anwendungsprogramm einen Namen einer Warteschlange, die Sie mit\
    \ YaST2 eingerichtet haben (z. B. lp oder color) oder geben Sie in ei-Maske des\
    \ Anwendungsprogramms das passende Druck-Kommando (z. B. lpr -Plp oder lpr -Color)\
    \ ein.\n\n# Mögliche Probleme\n\n+   * kommt es zu einer Störung in der Kommunikation\
    \ zwischen Rechner und Drucker so kann der Drucker mit den gesendeten Daten nicht\
    \ sinnvoll anfangen und es kommt zum Problem, dass Unmengen Papier mit sinlosen\
    \ Zeichen vollgedrückt wird.\n  1. Entnehmen Sie alle Papier bei Tintentstrahldruckern\
    \ bzw. öffnen Sie die Papierschicht, damit das Drucken aufhört.\n  2. Der Druckauft\
    \ erst dann aus der Warteschlange entfernt, nachdem er an den Drucker geschickt\
    \ wurde, der meist noch in der Warteschlange stehen. Auch durch einen Reboot wird\
    \ kein Druckauft aus der Warteschlange gelöscht. Prüfen Sie mit lpq oder lpc status\
    \ aus welcher Warteschlange gerade gedruckt wird und löschen Sie mit lprm den\
    \ Druckauft."
