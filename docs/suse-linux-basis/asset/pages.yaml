  md: '# Arbeiten mit der Shell


    Grafische Benutzeroberflächen gewinnen für Linux zunehmend an Bedeutung. Mausklicks
    lassen sich nicht immer alle Anforderungen des Alltags bewältigen. Hier bietet
    die Kommandozeile hohe Flexibilität und Effizienz Im ersten Teil dieses Kapitels
    erhalten Sie eine Einführung in den Umgang mit der Bash-Shell, anschließend eine
    Erklärung zum Konzept der Benutzerrechte unter Linux sowie eine Liste der wichtigsten
    Befehle und den Abschluss bildet der Texteditor vi.


    +   Einleitung ................................................................
    122

    Einführung in die Bash ........................................................
