  md: '# KDE – Der Desktop


    K Desktop Environment (oder kurz KDE) ist der Standard-Desktop bei SuSE Linux.
    Hier finden Sie alle Informationen, um mit Ihrem Desktopsystem optimal arbeiten
    zu können. Wir zeigen Ihnen die grafischen Elemente, gehen kurz auf einige Anwendungen
