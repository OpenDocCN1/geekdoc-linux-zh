  md: 'Abbildung 5.8: Die Toolbar eines Nautilus-Fensters


    Die ''Vor'' und ''Zurück'' Buttons ermöglichen Ihnen, in einem normalen Web-Browser
    zu navigieren. Der Button ''Rauf'' wechselt in die nächsthöhere Verzeichnene.
    ''Aktualisieren'' erzwingen die die Neustart der Ansicht. ''Suchen'' ermöglicht
    das Suchen von Dateien innerhalb der lokalen Ressourcen Ihres Rechen: Im unteren
    Textfeld geben Sie den Suchbegriff ein, der Button ''Finde'' startet die Suche.
    ''Web-Suche'' öffnet eine Suchmaschine, in der Sie nach im Internet suchen können.


    # Nautilus als Dateimanager


    Zooming, Bild- und Textvorschau, Bild- und Textansicht F der Ansatz, Dateien und
    deren Inhalte grafisch zu repräsentieren, führt fast zwangsläufig zur Frage, bei
    der Visualisierung mehr Inhalt oder mehr Übersicht sinnvollvoll ist. Mit variablen
    Zoomfunktionen hilft Nautilus Ihnen diesen Spagat zu meistern. Text- und Grafikdaten
    zeigen den Dateimanager generell eine verkleinerte Ansicht an, die bereits ausreichend
    wissen lässt, wie z. B. eine Textdatei anfängt oder sie ein Bild zeigt. Sehr praktisch
    ist hierbei, dass Sie sich in vielen Dateien vergrößern und verkleinern können:
    Der Anwender entscheidet. Klicken Sie auf ein Icon doppelt, öffnet der Dateimanager
    die Datei mit dem jeweils zugeordneten Programm; wenn es sich um eine Bild-Datei
    handelt, lädt Nautilus das integrierte Bildanzeige-Modul und wechselt zu einer
    Großansicht des Bildes. Auch hier können Sie die Zoomtasten verwenden, wenn etwa
    das Bild größer als Ihre Desktop-Auflösung ist.


    > Tipp

    Wenn Sie eine Textdatei als Icon darstellen, können Sie bereits die ersten Worte
    des Textes im Icon sehen. Vergrößern Sie nun die Ansicht und Sie sehen neben einer
    Vergrößerung der Icons ebenfalls mehr Text!


    Klicken Sie auf die Lupe zwischen den beiden + und - Buttons, gleichen Sie sich
    auf eine Zoomgröße von 100%, also die Originalgröße.


    Listenansicht Alternativ können Sie mit dem Button „Als Liste betrachten“ (neben
    den beiden Zoom-Icons) auf die Listendararstellung umschalten, welche bei sehr
    vielen Dateien praktischer ist.'
