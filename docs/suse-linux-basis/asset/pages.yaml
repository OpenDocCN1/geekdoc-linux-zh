  md: '+   - Um die Gefahr der Reflexblendung auf dem Bildschirm zu minimieren, sollten
    Bildschirm und Tastatur angeordnet sein, dass die Blickrichtung zu den Oberflächen
    parallel verläuft. Je weiter der vom Bildschirm entfernt wird, desto besser.


    +   - Der Bildschirm sollte nicht direkt unter einem Leuchtband, sondern versetzt
    oben aufgestellt werden. Die Blickrichtung sollte parallel zum Leuchtband verlaufen.


    # ## Schlag auf Schlag die Tastatur und die Handgelenke


    Schon länger ist bekannt, dass die von der Schreibmaschine abgeleiteten Anordnung
    der Tasten auf der Tastatur nicht unbedingt ergonomisch ist. Durch Tippen werden
    nicht die Finger oder Hände sondern Arme und Schulterbereich strapaziert. Spannungen
    sind die Folge. Die durch eine schlechte Tastatur erzeugte Belastung nimmt im
    Laufe der Zeit zu. Leider sind beim Tippen auftretende Mikro-Bewegungen schwer
    zu messen. Als Risikaktor ist hier vor allem RSI-Syndrom zu nennen. Die Tastatur
    ist zweifellos das am häufigsten gebrazte Eingabegerät des Computers. Desegen
    muss sie besonders gut konstruiert sein. Immer wieder wird von den Ergonomen kritisiert:
    Ein grundsliches Übel scheint aber das häufig zu kurze Kabel zu sein, das eine
    bequeme Platzierung verhindert. Es stellt sich die Frage wie viele Leute bereit,
    für einen PC DM 2 000 auszugeben, für die dazhörige Tastatur aber nur DM 20? Eigentlich
    sollten sie zu einer Tastatur gleich auch einem Verlängerungskabel mitkaufen.


    +   - Die Tastatur sollte zunächst einmal vom Bildschirm getrennt sein, sie ferner
    individuell bewegbar, jedoch aber standfeststellbar sein (genügend groß und gummierte
    Füße)


    +   - Die mittlere Tastereihe sollte nicht mehr als 30 mm über der Tischfläche
    liegen.


    +   - Vor der Tastatur sollte ein Platz für das Aufliegen der Hände vorhand sein.
    Falls keine eingebaute Tastaturhandballenauflage vorhanden ist, empfiehlt sich
    deren Anschaffung.


    +   - Die Beschriftung muss sich deutlich von der Farbe des Plastiks abheben und
    gut lesbar sein. Auch die Tastatur sollte keine intensive Farbtonung aufweisen
    und eine seidenmatte Oberfläche besitzen.


    +   - Für die Tastenkennzeichnung empfiehlt sich eine dunkle Schrift auf hellem
    Grund. Schwarze Tastaturen sind infern unergonomisch.


    SuSE Linux - Basis 159'
