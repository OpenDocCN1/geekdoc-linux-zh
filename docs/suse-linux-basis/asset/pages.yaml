  md: "# Die SuSE Linux-FAQ\n\nHier versuchen wir, Antworten auf die am häufigsten\
    \ gestellten Fragen zu geben\n(engl. Frequently Asked Questions).\n\n+   1. Nach\
    \ der Installation bekomme ich immer wieder die Fehlermeldung login:\n   Was mache\
    \ ich falsch?\n\nSie machen nichts falsch, die Installation ist abgeschlossen\
    \ und Sie können\nsich am Rechner mit Ihrem Benutzernamen (engl. username) und\
    \ Ihrem\nPasswort anmelden („einloggen“).\n\n+   2. Ich benutze meinen Computer\
    \ alleine, warum muss ich immer mich einloggen?\n\nLinux ist ein Multiuser-System.\
    \ Damit Linux weiß, wer am arbeitet, ist\ne Eingabe des Benutznamens (engl. username)\
    \ und des Passwortes nötig-\ntig. Übrigen: Arbeiten Sie nur dann als root, wenn\
    \ Sie am System An-\ndernderungen vornehmen wollen (Software installieren, konfigurieren\
    \ usw.)!\nFür den normalen Betrieb lassen Sie sich einen eigenen Benutzer an,\
    \ damit\nkönnen Sie an der Installation nichts versehentlich kaputtmachen.\n\n\
    +   3. Wo kann ich Infos über SuSE Linux bekommen?\n\nIn erster Linie lesen Sie\
    \ im Handbuch, was bei Installation oder Beson-\\derheiten von SuSE Linux trifft.\
    \ Die PDF-Datei kann auch im Paket\nsuseinux-reference_de in der Serie doc gefunden\
    \ werden (siehe\n/usr/share/doc/packages/suseinux-reference_de/). Dokumen-\ntationation\
    \ über Programme gibt es in /usr/share/doc/packages, Anlei-\ntenen gibt es in\
    \ „HowTos“ in /usr/share/doc/howto/ für deutsche,\nund in /usr/share/doc/howto/en\
    \ für die englischen „HowTos“. Lesen\nkönnen Sie diese z. B. mit\n\n```\nerde:\
    \ # /usr/share/doc/howto/de/DE-DOS-Linux-\nHOWTO.txt\n```"
  merge: -1
