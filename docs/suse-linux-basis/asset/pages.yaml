  md: '# Einleitung


    Relevant wird das Thema v. a. durch Inkrafttreten der Verordnung über Sicherheit
    und Gesundheitsschutz bei der Arbeit an Bildschirmgeräten (Bild- schirmarbeitsverordnung
    - BildarschVV). Sie wurde aufgrund einer EU-Richtlinie entwickelt und regelt die
    Mindestanforderungen, nach denen Bildschirm-plätze gestaltet werden müssen. In
    der Bundesrepublik Deutschland wären die Alt-Arbeitsplätze bis zum 31.12.1999
    nach den Forderungen der Verordnung anzupassen. Sicher ist dies in vielen Betrieben
    noch nicht erfolgt.


    # Die Arbeitsumgebung


    Würden Ergonomen die „Heimarbeitsplätze“ von Computernutzern systema- untersuchen,
    würden sie angesichts der kuriosesten Konstruktionen wah- scheinlich Verzweiflung
    und Tränen ausbrechen. Leider wird der Einzelne noch nicht durch eine Norm vom
    Kauf auf sogenannte „Spezialcomputerische“ abgelehten. Die oft auch für wenig
    Geld erwerbbaren Metallröhrengestelle mit „praktischen Rollen“ (= wenig Standfestigkeit),ergonomisch
    senkbarer Tas- taturablage“ (= mit Handbandenauflage),integrierten PC-Gehäusehalter
    und Drucker mit Papierhalterung“ (= wenig Ablagefläche und wenig Bein-freiheit)
    und „schwenbarer Mauslage“ (= instabel und zu kleine Arbeits-fläche) und „guter
    Sitz auf den Bildschirm“ (= (= zu nah, zu hoch gestellt) sind höchstens für den
    kurzzeitigen Gebrauch eines Computers zu verwenden. In professionellen Bildschirmarbeitsätzen
    haben diese keine Nuste verloren da sie die entsprechenden Normen in allen Punkten
    nicht erfüllen. Deswegen werden diese Computer-Mobile in den Katalogen professioneller
    Bübymöbel-steller vergleichbar suchen, denn achten auch indirekt durch die Einhaltung
    von Mindestnormen bei Firmenarbeitsätzen auf die Gesundheit der Beschäftigten.
    Man beachte – das Wort „Mindestnorm“ bedeutet, dass man es eigentlich noch besser
    könne.


    # Der gute Schreibstisch


    Eine falsche Tischhöhehe beansprucht Arm- und Rückenmuskulatur. Die daraus re-ultierende
    Zwangshaltung belastet vor allem die Wirbelsäule. Daneben kann zu wenig Freiheit
    eine unnatürliche Körperhaltung erzwingen und Durchblu- tungsörungen verursachen.


    150 — Einleitung'
