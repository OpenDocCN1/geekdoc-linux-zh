  md: '# Pakete / Programme


    +   ■ Paketbeschreibungen – Finden Sie kurze Beschreibungen zu allen Programpaketen
    von SuSE Linux, unabhängig davon, ob installiert oder nicht. Des Weiteren erhalten
    Sie hier einen Überblick über die verfügbaren Pakete und Informationen zu z. B.
    deren Speicherplatzverbrauch, falls Sie Programpakete nachinstallieren wollen.


    +   ■ ‘SUSE Programme’ – Hier erhalten Sie eine Einführung in Programme für die
    tägliche Arbeit mit dem PC (Office, E-Mail, Grafik etc.) — das SuSE-Handbuch „Die
    Programme“ im HTML-Format.


    +   ■ ‘KDE-Programme’ Aktivieren Sie diesen Eintrag, um zu allen KDE-Programmen
    Informationen abzurufen.


    +   ■ ‘/usr/share/doc/packages/ – Das klassische Linux-Dokumentationsverzeichnis
    mit den Dokumentationen zu den Programpaketen.


    # Installation / Hardware


    +   ■ ‘Referenz’ – Sie finden hier Grundlagen für Installation, Netzwerkkonfiguration,
    grafischen Benutzeroberfläche etc. — das SuSE Handbuch in elektronischer Form.


    +   ■ ‘SDB’ – Der Link führt zu lokal installierten Datenbank und bietet Lösungen
    für bereits bekannte Probleme (s. Abschnitt Support-Datenbank).


    +   ■ ‘HOWTOS’ – Sie finden hier praxisbezogene (meist englische) Anleitungen
    zu Installation und Konfiguration unter Linux (s. Abschnitt Howtos).


    # Konfiguration


    +   ■ ‘SuSE Konfiguration’ – Das Handbuch zur Konfiguration von KDE und SuSE Linux
    beinhaltet u. a. Modem-, Sound-, TV-Karten- und Scannerkonfiguration; dazu Informationen
    zur Systemverwaltung.


    +   ■ ‘SuSE Netzwerk’ – Die grundlegende Hilfe zur zur Konfiguration von Netzwerken:
    Intra- und Internet, Serverdienste (Apache, Proxy), sowie zu Sicherheitskonzepten.


    +   ■ ‘KDE-Hilfe’ Hier finden Sie alles rund um KDE wie Informationen zur Installation
    oder Konfiguration der grafischen Benutzeroberfläche.'
