  md: '# Willkommen


    Herzlichen Glückwunsch, dass Sie sich für SuSE Linux entschieden haben! Unsere
    Distribution ist nun einfacher zu installieren als je zuvor. Mit nur wenigen Klicks
    bereiten Sie die Installation vor, und nach etwa 15–20 Minuten ist das System
    installiert. Richten Sie dann noch Benutzer mit Passwort ein und legen Sie die
    Bildschirmauflösung fest. Schon können Sie mit SuSE Linux arbeiten. Auch die Konfiguration
    von SuSE Linux wurde weiter vereinfacht, wobei weiterhin die unterschiedlichen
    Program-Pakete an Ihren Wünschen angepasst und optimiert werden können.


    Dieses Buch und die darin beschriebene Software entbinden den durchschnittlichen
    Benutzer von der Notwendigkeit, irgendwelchen Linux-Freak zu leihen, zu mieten,
    anzuwerben oder zu stehlen, um Linux überhaupt erst installieren oder damit arbeiten
    zu können. SuSE Linux ist kraftvoll für den Freak, aber auch für den normalen
    Benutzer gleichermaßen intuitiv und einfach zu bedienen.


    Nach einer leicht verständlichen Einführung lernen Sie die grafische Oberfläche
    KDE besser kennen und erhalten Tipps zur Anpassung an Ihre persönlichen Bedürfnisse.
    Mit GNOME zeigen wir Ihnen eine weitere benutzerfreundliche Benutzeroberfläche.


    Danach erfahren Sie, wie Sie mit dem grafischen Allroundwerkzeug YaST2 Ihre Hardware,
    Ihren Internetzugang und Ihr System leicht einrichten und administrieren können.
    Das alles unter dem laufenden System, ohne letzte Neustarts..


    Am Ende finden Sie eine Beschreibung der Kommandozeilenbedienung, eine Einführung
    in das SuSE-Hilfesystem und eine Liste häufig gestellter Fragen und Antworten
    rund um SuSE Linux.'
  merge: -1
  pgno: 2
- img_proc: true
  md: 'Installationssupport - wir haben ihn, für Sie, für alle Fälle. Mitunter weichen
    Rechner von allgemein verbreiteten Spezifikationen ab. Unter Umständen kommt es
    dadurch bei der Installation zu Problemen, die mit kompetenter Hilfe jedoch schnell
    in den Griff zu bekommen. Dafür gibt es als besonderen Service den kostenfreien
    SuSE Installationssupport. In der Regel genü ein Blick in den SuSE Support Service
    unter http://support.suse.de. Dort finden Sie alle Informationen, Ansprechpartner
    und aktuelle Hinweise. Sollten Sie darunter keine Lösung finden, helfen wir Ihnen
    auch selbstverständlichständlich per E-Mail unter support@suse.de.

    Das Referenzhandbuch finden Sie im Paket suselinux-reference_de in der Serie doc.
    Dieses enthält zu vielen Themen (YaST-Module, Kernel, Netzwerk usw.) tiefergehende
    Informationen. Die PDF-Datei liegt unter /usr/share/doc/packages/suselinux-reference_de/.

    Für viele Frage- und Problemstellungen haben wir die Antworten und Lösungen schon
    gefunden. Wir stellen Ihnen in mehreren hundert Artikeln in unserer Support-Datenbank
    um die Uhr online unter http://sdb.suse.de/ zur Verfügung.

    Have a lot of fun!

    Ihr SuSE Team'
  merge: -1
