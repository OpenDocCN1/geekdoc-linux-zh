  md: 'Objekte mit Emblemen markieren Sie können alle Objekte in der rechten Hälfte
    des Fensters mit „Emblem“ ausstatten. Sie dienen dazu, eine Datei oder ein Verzeichnis
    zweckdienlich zu markieren. So gibt es beispielsweise. Symbole für „Entwurf“,
    „Wichtig“ oder „Persönlich“. Wenn Sie auf eine Datei oder Verzeichnis rechtsklicken
    und im sich öffnenden Popup-Menü „Eigenschaften zeigen“ wählen, öffnet sich der
    Dialog. Sie finden die drei Reiter „Grundlegend“, „Berechtigungen“ und „Emblem“.
    Wählen Sie, welche Embleme zusammen mit dem Objekt-Icon erscheinen. Sie können
    auch mehrere Embleme zuordnen. Die Änderungen werden augenblicklich umgesetzt.


    Anordnung, Position und Größe von Icons Im Gegensatz zu anderen Dateimanagern
    können Sie die visuelle Erscheinung von Icons individuell anpassen. Normalerweise
    übernimmt Nautilus „automatis Layout“ automatisch die Anordnung, Position und
    Größe von Icons. Sobald Sie eine der Dateien verschieben, wird der Dateimanager
    fragen, ob Sie in „manuelle Layout“ wechseln wollen. Wenn Sie sich auf „Umschalten“
    bestätigen, wird Nautilus keine automatischen Anpassungen mehr vornehmen.

    Eine weitere Möglichkeit, bestimmte Objekte hervorzuheben besteht darin, die Größe
    Icons zu ändern. Klicken Sie hierzu mit der rechten Maustaste auf Icon. Im erscheinenden
    Popup-Menü wählen Sie Icon strecken. Ein Rahmen mit vier Eckpunkten wird um das
    Icon eingeblendet. Wenn Sie nun mit der linken Maus dieser Eckpunkte ziehen, wird
    Nautilus die Grafik in Echtzeit vergrößern oder verkleinern. Sie können jederzeit
    die Originalgröße eines Icons wiederstellen, indem Sie nochmals mit der rechten
    Maustaste darauf klicken, und „Originalgröße wiederstellen“ wählen.


    # Nautilus und den Desktop konfigurieren


    Nautilus verwaltet die Icons innerhalb dieses Fensters und übernimmt auch die
    Steuerung über Objekte auf Ihrem Arbeitsplatz. Darüber können Sie den Hintergrund
    Ihres Desktops mit Farben und Mustern anpassen.


    Der Schwierigkeitsgrad Nautilus kennt zwei drei Schwierigkeitsgrade, mit denen
    er sich der Bedienung, vor allem bei den Konfigurationsoptionen dem Benutzer anpasst.
    Sie können die aktuelle Einstellung im Menüpunkt rechts oben „Hilfe“ ändern. Im
    Folgenden beziehen wir uns auf oben den Grad „Fortgeschrittene“. Im Schwierigkeitsgrad
    „Anfänger“ oder „Experten“ hingegen entsprechend mehr oder weniger Optionen angezeigt.'
