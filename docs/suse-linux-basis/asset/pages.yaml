  md: '# YaST2 - Konfigurationen


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_120_0.png)


    **Abbildung 6.13:** Gruppenverwaltung mit YaST2


    +   3. ‘Einstellungen für das Anmelden''

    Üblicherweise gibt es nach einem fehlgeschlagenen Anmeldeversuch eine Wartezeit
    von einigen Sekunden, bis eine erneute Anmeldung möglich ist. Seit dieser Übung
    ist es, einem „Password-Knacker“ das Leben zu erschweren. Zudem haben Sie die
    Möglichkeit, die Punkte ‚Aufzeichnung fehlgeschlagener Anmeldeversuche‘ und ‚Aufzeichnung
    erfolgregreicher Anmeldeversuche‘ zu aktivieren. Falls Sie mal einen Verdacht
    schöpfen sollten, dass jemand versucht, Ihr Passwort herauszufinden, können Sie
    die Einträge in den System-Logdateien unter /var/log kontrollieren.


    +   4. ‘Einstellungen für das Anlegen neuer Benutzer''

    Jeder Benutzer hat eine numerische und eine Benutzerbenkennung. Diese geschieht
    durch die Datei /etc/passwd und sollte möglichst eindeutig sein.

    Mit den Daten können Sie festlegen, welche Zahlenbereiche für den numerischen
    Teil der Benutzerbenennung vergeben werden, wenn Sie einen neuen Benutzer anlegen.
    Das Minimum von 500 für einen Benutzer ist sinnvoll und sollte nicht unterschritten
    werden.


    +   5. ‘Verschiedene Einstellungen''

    Bei ‚Einstellung der Dateirechte gibt es drei Auswahlmö: ‚Easy‘ ‚Sicher‘ und ‚Paranoid‘
    Den meisten Benutzern dürfte erstes ausreichen. Der YaST12-Hilfetext gibt Ihnen
    Auskunft über die drei Sicherheitsstufen.'
  merge: -1
  pgno: 120
- img_proc: true
  md: 'Die Einstellung ''Paranoid'' ist extrem restriktiv und sollte als Ausgangsba-
    für eigene Einstellungen eines Administrators dienen. Wenn Sie ''Para- noid''
    auswählen, müssen Sie bei der Verwendung einzelner Program- men mit Störungen
    rechnen. Sie werden nicht mehr die Rechte haben, auf verschiedene Dateien zuzreifen.
    Außerdem können Sie in diesem Dialog den Benutzer festlegen, der das Programm
    updatedb ter starten soll.


    Das täglich nach dem Booten automatisch ablaufende updatedb erzeugt eine Datenbank
    (locateddb), in der jeder Datei oder auf Ihrem Rechner gespeichert wird (locateddb)
    lässt sich mit dem Befehl locate durchsuchen. Wenn Sie ''Nobody'' wählen, kann
    jeder Benutzer Pfade in der Datenbank finden, die auch andere (unprivilegierte)
    Benutzer sehen würde. Wenn root angewählt ist, werden alle lokalen Dateien in-ziert,
    der root als Super-User alle Verzeichnisse listen darf.


    Ferner gibt es die Möglichkeit, den Punkt ''Das aktuelle Verzeichnis an dem Pfad
    des Benutzers root entfernen'' zu aktivieren. Dieser Punkt zu wählen ist empfohlen.
    Letztens gibt es keine Option ''Telnet Anmeldung für den Benutzer root deaktivieren''.
    Es ist empfohlen, diesen Punkt anzuwählen; falls nicht, kann ein Benutzer vom
    Netz auf Ihrem Rechner mit Telnet-Protokoll als root einloggen, wodurch das Root-Passwort
    auf dem Netz in unverschlüsselter Form sichtbar wird.


    Mit ''Beenden'' schließen Sie Ihre Sicherheitskonfiguration ab.


    # Software installieren/löschen


    Dieses Modul unter ''Software'' ermöglicht es, zusätzliche Software auf Ihrem
    Rechner zu installieren. Außerdem können Sie gewünschte Programme entfernt werden,
    z.B. um mehr freien Platz der Festplatte zu schaffen. Wenn Sie von CD installieren
    wollen, legen Sie bitte die erste CD in das Laufwerk.


    Im Dialog werden links die Paketserien angezeigt (kommerzielle Pakete der Serie
    pay angeboten), und auf der rechten Seite alle von Ihnen gewählten Serien angezeigt.
    Bereits auf Ihrem Rechner installierte Pakete sind mit einem gekennzeichnet. Das
    An- und Abwählen eines Pakets erfolgt durch Doppelklick oder durch Anwählen der
    Zeile und Klicken des Buttons ''Übernehmen''. Zur Installation ausgewählte Pakete
    werden ''X'' markiert und zu löschende Pakete mit d. Falls ein Paket zusätzliche
    Pakete benötigt, werden diese von YaST2 automatisch angewählt (Kennzeichnung a)
    oder Sie haben die Möglichkeit, aus mehreren in Frage kommenden Paketen eines
    auszuwählen.'
  merge: -1
  pgno: 121
- img_proc: true
  md: 'Haben Auswahl der Pakete, die Sie installieren und deinstallieren wollen, beendet,
    können Sie durch Klicken auf ''Extras'' → ''Einstellungen speichern oder laden''
    Ihre Paketauswahl in einer Datei speichern. Dabei wird immer die Information zur
    gesamt(!) installierten Software gespeichert. Wenn Sie dann später auf eine Diskette
    installieren, können sie bei Bedarf (z. B. Neuinstallation oder Update des Systems)
    verwenden, um Ihre Vorwahl zu wiederholen, ohne lange Pakete suchen zu müssen.
    Sie können einfach die Diskette während der Softwareinstallation ein und wählen.
    ''Extras'' → ''Einstellungen speichern oder laden'' berechnet den zusätzlichen
    Paketanz benötigten Speicherplatz. Falls der Speicherplatz nicht ausreicht, wird
    in einem Warnfenster darauf hingewiesen und Sie müssen eines oder mehrere Pakete
    abwählen. Wenn Sie den Dialog mit ''Abbrechen'' verlassen, wird Ihre Auswahl nicht
    gespeichert und keine Aktion ausgeführt. Mit ''OK'' wird die Installation und/oder
    das Löschen der Pakete gestartet. Im Installationsfenster können Sie den Fortgang
    der Aktionen im Fortschrittsbalken sehen. Alle Pakete werden verarbeitet, die
    die Installation von SuSEConfig abgeschlossen. Es ist normal, dass die Festplatte
    sehr aktiv wird.


    # Achtung


    Sie haben die Möglichkeit, installierte Pakete zum Löschen zu markieren (diese
    werden mit ''d'' gekennzeichnet). Beachten Sie dabei die Warnhinweise und löschen
    Sie keine Pakete des Linux-Grundsystems (Serie a).


    # Achtung


    # Installationsquelle wechseln


    Die Installationsquelle ist das Medium, auf dem die zu installierende Software
    zur Verfügung steht. Sie können von CD (der übliche Weg), von einem Netzwerkserver
    oder von Festplatte installieren. (Lesen Sie hierzu den ausführlichen YaST2-Hilfetext).

    Wenn Sie das Modul (zu finden unter ''Software'') mit ''Speichern und Beenden''
    verlassen, werden die Einstellungen gespeichert und gelten für die Konfigurationsmodule
    ''Pakete nachinstallieren/löschen'', ''Systemupdate'' und ''Boot- und Kernelkonfiguration''.
    Dieses Modul bietet aber auch die Möglichkeit, mit ''Installieren'' weiterzugehen,
    um Pakete nachzuinstallieren bzw. zu löschen.'
