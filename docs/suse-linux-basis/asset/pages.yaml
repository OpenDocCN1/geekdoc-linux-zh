  md: '# Umsteigen auf Linux


    Mit diesem Kapitel wenden wir uns vor allem an Umsteiger, die Linux zum ersten
    Mal einsetzen. Die Informationen sind nach dem Frage-Antwort-Prinzip aufgebaut
    und geben Auskunft zu den wichtigsten Punkten, die bei den den ersten Schritten
    mit Linux immer wieder auftauchen.


    Im Anhang dieses Buches finden Sie ein Glossar wichtiger Begriffe und eine häufig
    häufig Fragen zu SuSE Linux, die dieses Kapitel ergänzen. Wir setzen voraus, dass
    SuSE Linux im Rahmen einer Standardinstallation auf Ihrem Rechner aufgespielt
    ist. Daran orientieren sich die nachfolgenden Ratschläge und Antworten. Sollten
    Sie Ihr System bereits individuell angepasst haben, gelten die nachstehenden Ausführungen
    natürlich sinngemäß.


    +   - Während der Installation . . . . . . . . . . . . . . . . . . . 2

    - Arbeiten mit Linux . . . . . . . . . . . . . . . . . . . . . . . 2

    - Dateien, Ordner und Verzeichnisse . . . . . . . . . . . . . . 6

    - Von Passwörtern und Benutzern . . . . . . . . . . . . . . 9

    - Mounten, Shell und anderes . . . . . . . . . . . . . . . . . 11'
