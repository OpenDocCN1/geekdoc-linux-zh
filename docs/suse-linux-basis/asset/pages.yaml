  md: '+   - Besonders wichtig ist, dass das Bild flimmerfrei ist. Konkret heißt dies
    bei bei 15-Zoll-Monitoren mindestens 73 Hz. Empfohlen wird allerdings 85 Hz. Für
    größere Geräte, z. B. 21 Zoll 100 Hz.


    +   - Helligkeit und Kontrast sind nur justierbar. Die Schärfe der Zeichen soll
