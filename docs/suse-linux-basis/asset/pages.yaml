  md: '# Einleitung


    Um KDE nach Ihren Vorstellungen einzurichten, steht Ihnen das genannte KDE-Kontrollzentrum
    zur Verfügung. Seine Möglichkeiten sind so vielfältig, dass sie den Rahmen dieses
    Buches sprengen würden, werden uns daher auf einige wichtige Module konzentrieren.
    Das KDE-Kontrollzentrum erreichen Sie entweder direkt über das Symbol in der Kontrollleiste
    oder im K- bzw. SuSE-Menü über den Menüpunkt ‘Kontrollzentrum’. Nach dem Aufruf
    öffnet sich das Fenster wie in Abbildung 4.1.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_47_0.png)


    Abbildung 4.1: Das KDE-Kontrollzentrum


    Das Kontrollzentrum ist in eine Menüleiste sowie einen linken und einen rechten
    Bereich aufgeteilt. Im linken Bereich finden Sie die Menü angeklickt, werden dazu
    die Liste der Konfigurationsmodule. Wird im rechten Bereich die festgehaltenen
    Module mit einer Kurzinformation angezeigt. Mit einem weiteren Klick auf das Modul
    wird der Einstelldialog in den rechten Bereich geladen. Darunter angeordnet finden
    sich meist diese vier Schaltflächen:


    +   * ‘Hilfe’ – Zeigt einen kurzen Hygienetext an.

    * ‘Voreinstellungen benutzen’ – Stellt die Standardeinstellung wieder her.

    * ‘Anwenden’ – Wendet die vorgenommenen Einstellungen an.

    * ‘Zurücksetzen’ – Setzt Einstellungen auf den ursprünglichen Wert zurück.


    Die Menüleiste ist in folgende Menüs untergliedert:'
  merge: -1
  pgno: 47
- img_proc: true
  md: '+   ‘Datei’ – Schließen Sie das Kontrollzentrum über ‘Beenden’.


    +   ‘Ansicht’ – Wählen Sie das Aussehen des Kontrollzentrums: In ‘Modus‘ stellen
    Sie ein, mit dem der strukturierten ‚Baumansicht‘ oder der einfachen ‚Symbolansicht‘
    arbeiten möchten. Bei letzterer können Sie über ‘Symbolgröße‘ die Größe des angezeigten
    Symbol bestimmen.


    +   ‘Hilfe’ – In diesem Menüeintrag können Sie sich über ‘Inhalt‘ der Hileseiten
    des Kontrollzentrums anzeigen lassen oder erhalten über ‘Was ist das?’ einen Informationstext
    zum Symbol oder die Eingabezeile, die Sie anschließend mit der Maus anklicken.


    Des Weiteren können Sie über den Menüpunkt ‘Problembericht zu Bereich ...‘ für
    den Autor des Programms verbessern. Weitere Informationen über KDE und das Kontrollzentrum
    finden Sie unter den entsprechenden Einträgen.


    Wenn Sie sich einmal nicht genau wissen sollten, dass eine Einstellung bedeuten
    könnte, versuchen Sie es über einen ‘Tooltip‘. Drücken Sie die Tastenkombination
    +F1 und ein Klick auf das entsprechende Element zeigt den entsprechenden Helpfetext
    an.


    # Angeschlossene Geräte


    Beinhält ‘Druckerverwaltung’, ‘Maus’, ‘Smartcards’ und ‘Tastatur’.


    Maus Das Modul bietet Ihnen folgende Einstellungsmöglichkeiten:


    Der Reiter ‘Allgemein‘ definiert, ob Sie die Maus oder den Trackball als Links-
    oder Rechtschalter benutzen wollen, das Öffnen einer Datei oder eines Ordners
    durch Einfach- oder Doppelklick erfolgen soll oder über die Mauskontakt ändern
    bzw. die Änderung des Mauszeigers über Symbolen.


    Der Reiter ‘Erweitert’ beinhaltet u. a. die Einstellungsmöglichkeit für das Verhältnis
    beim Bewegen der Maus und des C auf dem Bildschirm (Zeigerbeschleunigung), wie
    schnell der zweite Mauslick auf den ersten folgen muss, um als Doppelklick verarbeitet
    zu werden sowie Zeilenänderung durch Betätigen des Scrollrades der Maus erfolgen
    soll (‘Mausrad erzeugt Bildlauf um’).


    Tastatur Sollten Sie mit mehreren Tastaturbelegungen arbeiten müssen, können Sie
    hier die entsprechende Belegung auswählen.'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'Unter dem Reiter ‘Erweitert’ können Sie den Nummernblock (Eintrag ‘Zahlenblockssperre‘
    bei KDE-Start) und die Tastenwiederholung einstellen.


    # Dateianzeige


    Das Menü beinhaltet die Module ‘Dateimanager’ und ‘Dateizuordnung’.


    **Dateimanager** Dieses Modul besitzt die Einstellungmöglichkeiten ‘Verhalten’,
    ‘Er-Erscheinungsbild’ und ‘Mülleimer’.


    Unter ‘Verhalten’ können Sie festlegen, ob Verzeichnisse in einem separaten Fenster
    geöffnet werden sollen. Hilreich ist die Option ‘Netzwerkkororgänge in einem Fenster
    anzeigen’. Sie „sammelt“ alle Vorgänge in einem einzigen, übersichtlichen Fenster.


    ‘Erscheinungsbild’ legt die Optik der Konfigur-Fenster (Schriftart, Schriftgröße,
    ...)


    Einstellungen zu Mülleimer finden Sie im gleichnam Reiter.


    **Dateizuordnung** Weisen bestimmten Programmen Datetypen zu – auch ‘MIME’-Typen
    (engl. Multipurpose Internet Mail Extension) welche sich auf Dateihänge in E-Mails
    beziehen. Zur Zuordnung helfen Regeln für die Erkennung einer Date, Beschreibung
    und Symbol werden eine Liste der Programme beim Öffnen des Datetyps. Alle Zuordnungen
    werden einen der Typ ‘application (Anwendungen), ‘audio’ (Audiodaten), ‘image’
    (Bilder), ‘inode’ (Sonderdateien), ‘message’ (Nachrichten), ‘print’ (Drucksystem),
    ‘text’ (Text) oder ‘video’ (Videodaten) zugeordnet und im Listenfeld unter ‘Bekannte
    Typen’ angezeigt.


    Die Funktionsmöglichkeiten im Überblick:


    Für die automatische Suche nach einem MIME-Typ geben Sie diesen Bezeichnung ‘Dateimanister’
    suchen ein (siehe Abb. 4.2 auf der nächsten Seite). Die manuelle Suche erfolgt,
    indem Sie mit einem Dopplick einen Typ öffnen und den zugeordnete MIME-Typen einsehen.


    Ein neuen MIME-Typ hinzuzufügen können Sie, wenn Sie auf ‘Hinzufügen’ im unteren
    Teil des Fensters klicken. Daraufhin eine eine kleine Dialogbox, in der Sie aus
    Auswahl die passende Kategorie auswählen und anschließend unter ‘Name’ einen Namen
    eingeben.


    Zum Editieren von MIME-Tips wählen Sie den Typ aus, den Sie verändern möchten
    (siehe Abb. 4.2 auf der nächsten Seite). Treffen Sie die entsprechende Auswahl
    aus der Liste der verfügbaren Datetypen; die zuhörigen werden im rechten Teil
    des Fensters angezeigt.'
