  md: '# Viele Wege führen zu YaST2


    Über das ‘K’- bzw. ‘SuSE’-Menü haben Sie mehrere Zugriffsmöglich zu YaST2: über
    das ‘Kontrollzentrum’, über ‘SuSE’ → ‘Administration’ → ‘Konfiguration’ und über
    ‘Einstellungen’. Oder wechseln in der Shell zum Benutzer root (sus root, dann
    das Root-Passwort eingeben) und geben ya2 ein.


    In dem K-Menü können Sie das Konfigurationsmodul, das Sie brauchen, direkt auswählen.
    YaST2 wird beim Start zuerst ein kleines Abfenster öffnen. Hier müssen Sie das
    Passwort für den Benutzer root (den Systemadministrator) eingeben. Die Konfiguration
    wird deshalb als Benutzer root durchgeführt, weil nur der Linux-Systemdateien
    verändern.


    Falls aus irgendeinem Grund doch nicht möglich sein sollte, YaST2 wie oben beschrieben
    aufzurufen, gibt es noch einen komplizierteren Weg, der nacheinander funktioniert.
    Geben Sie in der Shell unter der grafischen Oberfläche folgt:


    ```

    tuxerde--> xhost +

    erde:# # su -

    (Rootpasswort eingeben)

    erde:# export DISPLAY=:0.0

    erde:# # yast2

    ```


    Nach dem Bedienen von YaST2 sollten Sie dann mit exit vom Benutzer root wieder
    zum normalen Benutzer wechseln


    erde:# xhost -

    eben, um die Zugriffskontrolle für den X-Server wieder einzuschalten. Falls Sie
    die Sprache von YaST2 ändern wollen, klicken Sie im YaST2 Control Center auf ‘System’
    und auf ‘Choose language’ – wählen Sie dort Ihre Sprache aus, schließen Sie das
    YaST2 Control Center und starten Sie es dann nochmal neu.


    # Das YaST2 Control Center


    Zunächst erscheint das YaST2 Control Center. Im linken Bereich finden Sie die
    Einteilung in Hardware, Netzwerk/Grundlagen, Netzwerk/fortgeschritten, Sicherheit/Benutzer,
    Software und Sonstiges. Wenn Sie auf einen der Icons klicken, werden rechts die
    entsprechenden Inhalte aufgelistet. Klicken Sie beispielsweise auf ‘Sound’, so
    öffnet sich ein Fenster, in dem Sie die Konfiguration vornehmen können. Die Konfiguration
    erfolgt meist in mehreren Schritten. YaST2 führt Sie mit ‘Weiter’ durch alle Dialoge.'
