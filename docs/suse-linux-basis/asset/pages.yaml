  md: '# 21. Wo ist StarOffice?


    Sie finden StarOffice als Paket so_base zum Auswählen in der Serie pay. Die deutschen
    Sprachanpassungen sind im Paket so_de enthalten. Bitte benutzen Sie zur Installation
    ein Installationsprogramm YaSST, das Ihnen dann mitteilt, welche CD Sie einzulegen.


    # 22. Ich habe einen Fehler in SuSE Linux gefunden. Wo kann ich diesen melden?


    Überzeugen Sie sich davon, dass es wirklich ein Fehler im Programm ist und nicht
    nur ein Bedienungs- oder Konfigurationsfehler. Sehen Sie sich auch die Dokumentationen
    in /usr/share/doc/packages und /usr/share/doc/howto an. Wenn Sie Fehler bemerken
    und finden Sie im Internet dazu etwas über http://sdb.suse.de/sdb/html/ in der
    Datenbank. Geben Sie einen Stichwort oder arbeiten Sie über den Link „History“
    vor bzw..


    Sollte es sich als Fehler herausstellen, schicken Sie eine Beschreibung per E-Mail
    an feedback@suse.de.


    # 23. Wie kann ich Programme installieren?


    Programme, die auf den SuSE Linux-CDs enthalten sind, installieren Sie am besten
    mit YaST. Bitte beachten Sie, dass viele größere („Demos“) in der Serie zu finden
    sind.


    # 24. Ich habe ein Programm „nur“ im Sourcecode. Wie kann ich ihn installieren?


    Bei manchen braucht etwas „Know-how“, am Besten findet man in einem guten Linux-Buch
    – siehe http://www.suse.de/de/produkte/books/.


    Kurz: Archiv ausen mit tar xvzf name.tar.gz, die Datei INSTALL oder README lesen
    und befolgen. Meist sind die folgenden Befehle auszuführen: ./configure; make
    install.


    Bitte beachten Sie, dass für die Schritte der Kompilierung, sowie bei selbstkompilierten
    Programme keinen Installationssupport erhalten können.


    # 25. Wird meine Hardware unterstützt?


    Sehen Sie sich am besten in der Komponenten-Datenbank unter dem URL http://hardwiredb.suse.de
    bzw. http://cdb.suse.de nach nach.


    Auch ein less /usr/share/doc/howto/en/Hardware-HOWTO.gz kann Ihnen Auskunft geben.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_186_0.png)'
