  md: '# Funktionen der Bash


    Zwei wichtige Funktionen der Shell erleichtern Ihnen die Arbeit wesentlich:


    +   - Die History – Wenn Sie einen bereits eingegeben Befehl noch einmal aufzurufen,
    drücken Sie die Taste ⇧ so oft, bis der gewünschte Befehl angezeigt wird; zumwärts
    Blättern drücken Sie die Taste ⇩. Zum Editieren der Befehzeile bewegen Sie sich
    mit dem Cursor-Taste an die entsprechende Stelle und korrigieren Sie diese.


    +   - Expansionsfunktion – Sie ergänzt einen Dateinamen, falls dieser eindeutig
    identifiziert werden kann, nachdem Sie die ersten Buchstaben eingegeben haben.
    Wenn es mehrere Dateien mit den gleichen Anfangsbuchstaben gibt, erhalten Sie
    durch zweimaliges drücken der Taste Tab eine Auswahlliste.


    **Beispiel: Der Umgang mit Dateien**


    Sie wissen, wie ein Befehl arbeitet, welche Verzeichnisse unter SUSE Linux gibt
    und wie Sie in der Bash die Arbeit erleichtern können. Nun werden Sie Ihre Kenntnisse
    mit einem kleinen Übungsispiel umsetzen:


    +   1. Öffnen Sie eine Konsole in KDE durch Klick auf das Muschel-Icon.


    +   2. Geben Sie ls ein und sehen den Inhalt Ihres Home-Verzeichnisses.


    +   3. Legen Sie mit mkdir (engl. make directory) ein neues Unterverzeichnis mit
    dem Namen test an, indem Sie mkdir test eingeben.


    +   4. Rufen Sie den KEdit auf, indem Sie Alt+F2 drücken und in das Eingabefeld
    „edit“ klicken. Tippen Sie ein Zeichen ein und speichern die Datei unter dem Namen
    „Testdatei“ mit großer „T“, da Linux Groß- und Kleinschreibung unterscheidet.


    +   5. Lassen Sie sich wieder den Inhalt Ihres Home-Verzeichnisses anzeigen. Statt
    der normalen Eingabe von ls drücken Sie die Taste ⇧. Jetzt steht wieder ls am
    Prompt, und zum Ausführen des Befehls müssen Sie nur noch ↵ drücken. Sie sehen
    das neue Verzeichnis test in blauer Schrift und die Testdatei in schwarzer Schrift,
    Verzeichnisse werden immer blau dargestellt und Dateien immer schwarz.'
