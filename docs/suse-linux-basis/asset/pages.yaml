  md: 'Über die Checkbox ''ALSA starten'' kann das Starten von ALSA beim Boot des
    Rechners (de-)aktivieren. Zur Wiedergabe von Midi-Dateien sollten die Checkbox
    ''Sequencer starten'' aktiviert haben. Somit beim Laden der ALSA-Module den benötigten
    Soundmodul für die Sequencerunterstützung mitgeladen.


    Beim Aufruf von ''Beenden'' wird die Lautstärke und die Konfiguration aller bisher
    installierten Soundkarten gespeichert. Die Mixereinstellungen werden in der Datei
    /etc/asound.conf abgelegt und die ALSA-Konfigurationsdaten werden am Ende der
    Datei /etc/modules.conf eingetragen.


    # Konfigurieren Sie eine Soundkarte


    Wurden mehrere Soundkarten gefunden, wählen Sie über ''Liste der automatisch erkannt''
    Ihre gewünschte Karte aus. Mit ''Weiter'' gelangen Sie zum Punkt ''Setup''. Wird
    die Soundkarte nicht automatisch gefunden, wählen Sie den Punkt ''von der Liste
    wählen'' an und mit ''Weiter'' gelang man im Menü ''Manuelle Auswahl der Soundkarte''.


    # Manual Auswahl der Soundkarte


    Falls Ihre Soundkarte nicht automatisch erkannt wurde, wird eine Liste von Soundkartentrereibern
    und Soundkartenmodellen angezeigt, aus der Sie eine wählen können. Mit der Auswahl
    ''Alle'' können Sie die komplette Liste der unterstützten Soundkarten anzeigen.


    Sehen Sie gegebenfalls in der Dokumentation zu Ihrer Soundkarte nach, um die nötigen
    Informationen zu erhalten. Des Weiteren finden Sie auch eine Aufstellung von ALSA
    unterstützten Soundkarten mit den jeweils zugehörigen Soundmodulen unter /usr/share/doc/packages/alsa/cards.txt
    und http://www.alsa-project.org/~goemon/. Nach der Auswahl gelang man über ''Weiter''
    wieder ins Menü ''Setup''.


    # Erweiterte Optionen für die Soundkarte


    Hier kann man die einzelnen Optionen des Soundmoduls anpassen. Dazu markieren
    Sie die jeweilige zu editierende Zeile. Im Feld ''Mögliche Werte'' werden Ihnen
    Standardwerte für die Konfiguration vorgeschlagen. Verändern Sie die Standardwerte
    nur, wenn Sie absolut sicher sind. Ansonsten können Sie im im Eingabefeld die
    jeweiligen Parameter selbst übergeben.'
  merge: -1
  pgno: 97
- img_proc: true
  md: 'Werte können dezimal oder hexadeazimal angegeben werden. Im letzten Fall müssen
    Sie den Wert 0x voranstellen. Nach der Eingabe eines Werte für eine Option müssen
    Sie diesen mit dem Button ''Anwenden'' bestätigen. Beim Betätigen des Buttons
    ''Zurücksetzen'' werden alle Werte gelöscht. Eine Aufstellung der benötigten Optionen
    und die möglichen Parameter für den Soundcheck finden Sie unter /usr/share/doc/packages/alsa/INSTALL.


    # Grafikkarte und Bildschirm


    Die grafische Oberfläche wird als X11-System bezeichnet, bietet dem Benutzer die
    Basis für das Arbeiten innerhalb einer grafischen Umgebung, denn die grafische
    Benutzeroberfläche (wie z. B. der KDE-Desktop) setzt auf der grafischen Oberfläche
    auf. Die X11-Einstellungen sind in je verwendender Dateien gespeichert:


    +   - XFree86 3.x: /etc/XFree86Config

    - XFree86 4.x: /etc/x11/XFree86Config


    Die grafische Oberfläche wird normalerweise bereits während der Installation eingerichtet.
    Wenn Sie jedoch die Wege verbessern oder beispielsweise im System einen anderen
    Monitor anschließen wollen, haben Sie mit dem YoST-Modul die Möglichkeit dazu.
    Bei einer eventuellen Änderung wird die aktuelle Konfiguration gespeichert. In
    der Startmaske haben Sie dann zunächst die Möglichkeit, eine solche früher gesicherte
    X11-Konfiguration wiederherzustellen. Danach gelangen Sie in den gleichen Dialog
    wie bei der Installation von SuSE Linux..


    Sie haben die Wahl zwischen Textmodus und der grafischen Oberfläche. Für letzte
    werden die aktuelle Auflösung, die Fartie, die Bild-Wiederholfrequenz, Hersteller
    und Typ Ihres Monitors, falls dieser automatisch erkannt wurde, und gegebenfalls
    eine vorhandene 3D-Beschleunigung. Klicken Sie auf ''Ändern'', um zum Dialog,
    in dem Sie die Bildschirminstellungen vornehmen können, zu gelangen. Wenn Sie
    eine Grafikkarte mit 3D-Chip haben, können Sie darin die 3D-Beschleunigung aktivieren.
    Bei der Auswahl der Farben stehen Ihnen abhängig von der verwendeten Hardware
    die Einstellungen 16, 256, 32768, 65536 und 16,7 Millionen Farben zur Verfügung.
    8, 16 oder 24 Bit zur Verfügung. Für eine brauchbare Darstellung sollten Sie sich
    wenigstens 256 Farben einstellen.'
