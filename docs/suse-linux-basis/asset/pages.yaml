    +   - Neue Bildschirme in Deutschland sollten die CE-Kennzeichnung und europäische
    Normen erfüllen und Energiesparfunktionen.


    # Wie stelle ich meinen Bildschirm auf?


    Auch hier gilt: Ein falsch aufgestellter Bildschirm erzeugt bei der Arbeit eine
    Zwangshaltung die bekannten zur Erkrankung führen kann. Oft verhindert eine ausreichende
    Schreibtiefe eine sinnvolle Aufstellung des Bildschirms. Die natürliche Haltung
    des Kopfes und der Arme ist für eine Arbeit ausgerichtet die im wahrsten Sinne
    des Wortes vor uns liegt.'
