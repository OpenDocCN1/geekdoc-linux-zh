    # # Die Arbeitsmittel


    # ## Augen auf beim Bildschirmkauf!


    Schlechte Bildschirme können bei schon vorhandener schlechter Sehstärke diese
    Problematik verschlimmern. Neben Augenproblemen ergeben sich auch Verspannungen,
    Müdigkeit und viele Befindlichkeitsstörungen. Der Stand der Technik ist Trinit-
    oder Black-Matrix-Bildschirme sowie TFT-Flachbildschirme. Leider sind die Flachschirme
    noch relativ teuer. Es gibt unfängliche Normen, die die Lesbarkeit der dargestellten
    Information regeln. Bildschirme haben in Deutschland ein GS-Zeichen und erfüllen
    über hinaus auch noch andere – nicht zwingend vorgeschriebene Normen wie z. B.
    TCO 99 (strahlungsarm). Vor allem Kauf eines Bildschirms empfiehlt es sich, die
    vorhandenen Normen zu studieren, um keinen Fehler zu kaufen. Eines ist auch sehr
    sicher: Meist ist ein guter Bildschirm teuer. Die günstigen Röhrenbildschirme
    halten nichtwig. Sie behalten ihre Schärfe und für wenige Jahre.


    +   • Alle dargestellten Zeichen sollen in den Randbereiche und deutlich lesbar
    sein, eine Positivdarstellung (= dunkle Zeichen auf hellem Grund wie bei einem
    Buch) wird empfohlen.


    +   • Da die dargestellten Zeichen ausreichend genug sein müssen, zumindest für
    grafische Benutzeroberflächen (z. B. KDE) ein 17-Zoll-Monitor empfehlen. Bei CAD-,
    Layout- und Grafikbearbeitung sollten es 21 Zoll sein.'
