    # Benutzer- und Gruppenverwaltung


    # Neuen Benutzer anlegen


    Eine grundlegende Eigenschaft von Linux ist, dass es ein „Multi-User-System“ ist.
    Daher können mehrere Benutzer unabhängig voneinander an einem einzigen Linux-System
    arbeiten. Jeder hat seinen eigenen „Benutzer-Account“, bestehend aus einem Benutzer-bzw.
    Login-Name und einem persönlichen Passwort, mit dem er sich am System anmelt.
    Jeder hat ein persönliches Home-Verzeichnis, in dem private Dateien und Konfigurationen
    gespeichert werden. In diesem Modul, das unter „Sicherheit und Benutzer“ zu finden
    ist, können Sie bequem einen neuen Benutzer anlegen, indem Sie einfach die Eingabefeld
    ausfüllen und dann auf ‘Anlegen“ klicken. Die neue Person darf sich nun mit ihrem
    Login-Namen und Passwort auf dem Rechner anmelden.'
