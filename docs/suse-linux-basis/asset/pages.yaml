  md: '# Nautilus - der Dateimanager


    Nautilus ist der neue Dateimanager des GNOME Desktops mit vielen neuen Features
    und Erweiterungen.


    ```

    ./images/png/gnome_nautilus_main.png

    ```


    **Abbildung 5.7:** Nautilus


    # Erste Schritte


    In obiger Abbildung sieht man ein typisches Nautilus Fenster. Die linke Fensterhälfte
    zeigt ein Verzeichnis-Symbol, wie viele Objekte (sprich Dateien) sich darin befinden
    und wann die letzte Änderung erfolgte, während die rechte Fensterhälfte die einzelnen
    Objekte innerhalb des Verzeichnisses anzeigt.


    # Navigation


    Im Texteingabefeld „Ort“ können Sie sehen, in welchem Verzeichnis (oder URL, dazu
    später mehr!) Sie sich mit Ihrem Nautilus-Fenster bewegen. Betätigen Sie den ‚Heim‘
    Button in der Toolle oberhalb des Texteingabefeldes, wird Nautilus immer in den
    Ordner *Nautilus* innerhalb Ihres Heimatverzeichnisses wechseln.


    +   - Nautilus versucht – soweit möglich – von Ihnen gemachte Eingaben in das
    ‚Ort‘ Eingabefeld automatisch zu vervollständigen. Den Vervollständigungsvorschlag
    sehen Sie in Revers dargestellten Buchstaben. Drücken Sie einfach auf die Tab-Taste,
    wenn Nautilus Vorschlag richtig ist!'
