    # # Wichtige Linux-Befehle im Überblick


    In diesem Abschnitt möchten wir Ihnen einen Überblick über die wichtigsten Befehle
    Ihres SU Linux-Systems geben. Dabei werden wir der Grundbedeutung der einzelnen
    Kommandos auf einige Parameter eingehen, und wenn es sich anbietet, ein typisches
    Anwendungsbeispiel liefern.


    Um über die Details dieses Kommandos zu erfahren, können Sie zusätzliche Informationen
    mit dem Program man gefolgt von Befehl erhalten z. B.


    ```

    tux@erde: > man ls

    ```


    In diesen „Manual Pages“ können Sie sich mit den Bildlauften Bild ↑ ↓ abwärts
    vom Anfang bis Ende der Dokumentation bewegen. Beenden können Sie diesen Darstellungsmodus
    durch Drücken der Taste Q Durch Eingabe von man können Sie mehr über man-Befehle
    selbst erfahren.


    Falls Sie unsere Auflistung hinaus einem kompletten Überblick über die diversen
    Kommandozeilen interessiert sind, können wir Ihnen mit dem O''Reilly-Verlag erschienenen
    Buch „Linux in a Nutshell“ ans Herz legen. In der nachfolgenden Übersicht wird
