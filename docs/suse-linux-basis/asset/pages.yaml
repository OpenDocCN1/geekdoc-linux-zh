- img_proc: true
  md: 'Anwendungsbeispiele finden Sie im Abschnitt Archive und Datenbankenkompression
    auf Seite 129.


    # locate

    Mit locate kann man herausfinden, in welchem Verzeichnis sich eine spezifisierte
    Datei befindet. Zusätzlich können dabei auch `Jokerzeichen` verwendet werden.
    Das Programm arbeitet sehr schnell, da es nicht langsam im Dateisystem selbst,
    sondern in einer eigenen erstellten Datenbank sucht. Dies ist auch das Hauptproblem
    sehr flotten Kommandos, weil darin natürlich keine Dateien gelistet sein können,
    die nach der letzten Aktualisierung erstellt wurden.


    root [Option(en)] die Datenbank mit updatedb erstellt werden.

    updated [Option(en)]

    Mit diesem Befehl ist möglich, auf einfache Weise die benötigte Datenbank auf
    den aktuellsten Stand zu bringen. Damit möglichst alle Dateien erfasst werden,
    sollte das Programm als root aufgerufen werden. Aber bietet sich an, es durch
    einen angehängten Ampersand (&) in den Hintergrund zu versetzen, damit gleich
    weiterarbeitet werden kann (updatedb &).


    find [Option(en)]

    Mit dem Befehl finden Sie in einem bestimmten Verzeichnis nach einer Datei suchen.
    Das erste Argument bezeichnet das Verzeichnis, von dem aus die Suche gestartet
    werden soll. Die Option -name verlangt einen zu suchenden String, der Wildcards
    erlaubt. find findet sich im Gegensatz nicht in einer eigenen Datenbank nach Dateien,
    sondern durchsucht tatsächlich das angegebene Verzeichnis.


    # Inhaltsbefehle


    cat [Option(en)] Datei(en)

    cat gibt den Inhalt einer angegebenen Datei ohne Unterbrechung aus.


    +   Option:

    -n Nummeriert die Ausgabe am linken Rand.'
  merge: -1
  pgno: 149
- img_proc: true
  md: 'less [Option(en)] Datei (en)

    Dieser Befehl ermöglicht es, durch den Inhalt der spezifizierten Datei zu „wandern“.
    Beispielsweise können Sie mit [Bild] und [Bild] um eine halbe Bildschirmseite
    vor bzw. zurück springen, mit der Leertaste eine ganze nach vorne. Es ist möglich,
    mit [Pos] den Anfang bis das Ende der Datei zu navigieren. Mit [Q] kann dieser
    Ausgabemodus beendet werden.


    grep [Option(en)] Sucht Datei (en)

    grep ist dazu gedacht, ein bestimmtes Suchwort in den angegebenen Datei(en) zu
    finden. Hat es Erfolg, gibt es die Zeilen, in denen das Suchwort gefunden wurde,
    sowie den Namen der Datei aus.


    +   Optionen:

    - i Ignoriert Groß-/Kleinschreibung

    - l Gibt die Namen der jeweiligen Dateien, nicht aber die Textzeilen aus

    - n Zeigt zusätzlich Nummern der Zeilen, in denen sie fündig sind

    - l Listet Dateien, in denen das Suchwort nicht vorkommt


    diff [Option()] Datei2

    diff wurde geschaffen, um den Inhalt beliebiger gewählter Dateien zu vergleichen
    und in Form eine Liste von geänderten Zeilen auszugeben.


    Häufig wird es von Programmierern verwendet, die auf diese nur die Änderungen
    in Ihren Programmen, nicht aber den gesamten Quellentexte verschicken.


    +   Optionen:

    - q Meldet nur, ob ob sich die beiden angegebenen Dateien überhaupt in ihrem Inhalt
    unterscheiden.


    # Dateisysteme


    mount [Option(en)] [Gerät] Mountpoint

    Mit Hilfe Befehls können beliebige Datenträger in das Dateisystem „gemounted“
    werden. Darunter versteht man das Einbinden von Festplatten, CD-ROM- und anderen
    Laufwerken in ein Verzeichnis des Linux-Dateystems.'
  merge: -1
