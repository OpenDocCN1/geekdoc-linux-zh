- img_proc: true
  md: '```

    erde:/root # yast2 online_update .auto.install

    ```


    Dieser Aufruf installiert alle geholten Patches. Falls Sie eine Gruppe installieren,
    können Sie die gleichen Optionen verwenden bei .auto.get. Diese Methode hat den
    Vorteil, dass sich sich automatisieren lässt. Der Systemadministrator hat die
    Möglichkeit, die Pakete z. B. über Nacht herunterzuladen und morgens, die er benötigt
    zu installieren.


    # Update des Systems


    Dieses Modul ermöglicht es, Ihr System auf den aktuellen Stand zu bringen. Es
    werden mehrere Arbeitsschritte aufgerufen und YaST2 wird ermitteln, welche Pakete
    zu erneu sind. Falls gewünscht, können Sie für jedes Paket einzel entscheiden,
    ob ein Update erfolgen soll. Das Basissystem kann dann allerdings nicht neu werden,
    dazu muss vom Installationsmedium, z. B. von CD, gebootet werden. Beachten Sie
    bitte, dass ein Update umso problematischer wird, je älter die zugrundeelende
    liegende Version ist, die aktualisiert werden soll und/oder die Konfiguration
    der Pakete, die aktualisiert werden sollen, vom Standard abweicht. Bestweilen
    kann die Konfiguration unter Umständen nicht korrekt übernommen werden; dann sollte
    eine komplett neue Konfiguration erstellt werden. Eine bestehende Konfiguration
    sollte außerdem vor dem Update gesichert werden.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_125_0.png)


    Abbildung 6.16: YaST2: Update des Systems'
