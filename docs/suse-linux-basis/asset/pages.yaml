  md: '+   - DNS unter Port 53,


    +   - HTTP unter Port 80,


    +   - SMTP unter Port 25 und POP3 unter Port 110,


    +   - FTP unter Port 20 und 21.


    Nur wenn der Client die richtige Port-Nummer beim Server anspricht, kann er den
    passenden Dienst in Anspruch nehmen.


    # Hinweise zu allen Arten des Internetzugangs


    **Automatische Einwahl (Dial on Demand)**


    Wenn Sie in den YaST2-Modulen ‚Dial on demand‘ oder ‚Automatische Wahl‘ aktivieren,
    wird z. B. nach der Eingabe einer externen URL im Browser oder S beim Abholen
    von E-Mail die Internet-Verbindung automatisch aufgebaut. Nur wenn Sie eine so
    genannte Flatrate (Pauschtarif) für den Internetzugang haben haben, ist ‚Dial
    on demand‘ empfehlenswert. Durch diesen Prozesse, die im Hintergrund ablaufen
    (z. B. durch regelmäßigen Abholen von E-Mail), erfolgt eine häufige Einwahl in
    das Internet und erhöht die Telefonkosten.


    # Modem


    Im YaST2 Control Center finden sich unter ‚Netzwerk/Basis‘ die Modem-Konfiguration.
    Falls die automatische Erkennung fehlhlschlägt, wählen Sie die manuelle Konfiguration.
    In der sich öffnenden Maske als ‚Gerät‘ die Schnittstelle und bei ‚Modemname‘
    ein wählbarer Name für das Modem einzutragen.


    Wenn eine Telefonanlage zwischengeschaltet ist, müssen gegebenenfalls die Vorwahl
    für die Abschaltung (normalerweise Null; Dies erfolgt in der Bedienungsanleitung
    Ihrer Telefonanlage) eingragen. Sie können zwischen Ton- und Impulschwahl wählen,
    und ob der Lautsprecher angesch oder gewertet wird. Letzte Option sollte nicht
    verwendet werden, wenn Ihr Modem an einer Telefonanlage angeschlossen ist. Unter
    ‚Details‘ finden sich Einstellungen zur Baudrate und Initialisierungs-Strings
    für das Modem. Sollten Sie nur dann Änderungen vornehmen, wenn Ihr Modem nicht
    automatisch erkannt wurde und für die Datenübertragung speziell eingestellt werden
    muss. Dies ist vor allem bei ISDN-Terminaladaptern der Fall.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_106_0.png)'
