- img_proc: true
  md: 'Mit ls können Sie sich aber auch andere Verzeichnisse ansehen. Dazu übergeben
    Sie das anzuzeigende Verzeichnis als Parameter. Zum Anzeigen des Inhalts des Unterverzeichnisses
    Desktop z. b. ls -l Desktop.


    # Dateien und Verzeichnisse


    Effektiv mit der Shell zu arbeiten, gebraucht man Kenntnisse über die Datei- und
    Verzeichnis-Struktur unter Linux. Verzeichnisse sind Ordner, in denen Dateien,
    Programme oder auch Verzeichnisse abgelegt werden können. Das Wurzelverzeichnis
    ist in der Hierarchie ganz oben und wird mit „/“ angesprochen.


    Im Verzeichnis /home befinden sich die Verzeichnisse der einzelnen Benutzer, in
    denen ihre persönlichen Dateien ablegen werden. Die Abbildung 7 zeigt den Standard-Verzeichnisbaum
    unter Linux mit den Home-Verzeichnissenissen der Beispielbenutzer yxz, linux und
    tux. Der Verzeichnisbaum Ihres Linux-Systems ist funktionell gegliedert („Filesystemstandard“)
    und in der Tabelle 7.1 auf der nächsten Seiten erhalten Sie eine Kurzbeschreibung
    zu den Standardverzeichnissen unter Linux.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_132_0.png)'
