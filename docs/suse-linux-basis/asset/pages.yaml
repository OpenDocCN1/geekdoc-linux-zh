- img_proc: true
  md: 'Telnet heißt auch ein Linux-Programm, das genau dieses Protokoll umsetzt und
    ein Arbeiten an anderen Rechner ermöglicht, ohne di-rekt auf dem Gerät zu sitzen.


    # Achtung


    +   - Sie Telnet nicht über Netze, die von Dritten mitgehört werden könnten. Vor
    allem im Internet sollten verschlüsselte Übertragungsmethoden mit ssh benutzt
    werden, um die Gefahr eines Passwortmissbrauchs auszuschließen (siehe Manual-Page
    von ssh (man ssh)).


    # Achtung


    # Sonstiges


    ```

    passwd [Option(en)] [Benutzername]

    ```


    Mit diesem Kommando hat jeder Benutzer die Möglichkeit, sein eigenes Passwort
    zu ändern. Der Administrator root darf darüber hinaus das Codeword eines jeden
    Benutzers ändern.


    ```

    su [Option(en)] [Benutzername]

    ```


    Durch dies ist es möglich, den Benutzer-Login während einer Sitzung zu wechseln.
    Es wird sofort nach dem root-Passwort verlangt. Unter Angabe eines Benutzernamens
    und anschender Eingabe des zuhörigen Passwortes können diese Umgebung genutzt
    werden. Als root muss dieses Passwort nicht eingegeben werden, da mit Administratorrechten
    die Identität eines jeden Benutzers problemlos angenommen werden kann.


    ```

    halt [Option(en)]

    ```


    Um Datenverlust zu riskieren, sollten Sie Ihren Rechner immer mit diesem Programm
    herunterfahren.


    ```

    reboot [Option(en)]

    ```


    Funktioniert dies wie der halt-Befehl, allerdings mit sofortigem Neustart.


    ```

    clear

    ```


    Wenn Sie den Überblick über die Textzeilen der Konsole verlieren, können Sie die
    sichtbare Anzeige „löschen“. Der Befehl hat keine Optionen.'
  merge: -1
  pgno: 154
- img_proc: true
  md: '# Der Editor vi


    Die Bedienung des vi ist etwas gewöhnungsbedürftig. Er wird gegenüber allen anderen
    Editoren vorgezogen, weil er zum einen auf jedem UNIX-ähnlichen Betriebssystem
    zur Verfügung steht und bei Linux zum standardmäßigen Installationsumfang gehört;
    außerdem, wird seine Bedienung eindeutig ist und dadurch in der Regel keine Missverständnisse
    auftreten. Außerdem: wenn nichts geht, geht vi immer noch. Die nun folgende Kurzanleitung
    sollte Sie in die Lage versetzen, mit Hilfe vi z.B diverse Konfigurationsdateien
    zu editieren. Konzept: Der vi kennt 3 Betriebsarten (Modi):


    +   - Befehlsmodus (engl. command mode)

    Jeder Tastendruck wird als Teil eines Befehls interpretiert.


    +   - Einfügemodus (engl. insert mode)

    Tastruckbefehmodus werden als Texteingaben interpretiert.


    +   - Komplexbefehmodus (engl. last line mode)

    Für komplexere Befehle, die in der letzten Zeile editiert werden.


    Die wichtigsten Befehle des Befehlsmodus sind:


    +   i wechselt in Eingabemodus (Zeichen werden an der aktuellen Cursorposition
    eingegeben)

    a wechselt in Eingabemodus (Zeichen werden nach der aktuellen Cursorposition eingegeben)

    A wechselt in Eingabmodus (Zeichen werden am Ende der Zeile angehängt)

    R wechselt in Eingabemodus (überschreibt den alten Text)

    r wechselt zum Überschreiben eines einzelnen Zeichens im Eingabmodus

    s wechselt in Eingabemodus (das Zeichen, auf dem der Cursor steht, wird durch
    die Eingabe überschrieben)

    C wechselt in Eingabemodus (der Rest der Zeile wird durch den neuen Text ersetzt)

    O wechselt in Eingabemodus (nach der aktuellen Zeile wird eine neue Zeile eingefügt)

    O wechselt in Eingabemodus (vor der aktuellen Zeile wird eine neue Zeile eingefügt)


    Tabelle 7.2: Fortsetzung auf der nächsten Seite...'
  merge: -1
  pgno: 155
- img_proc: true
  md: 'x löscht das aktuelle Zeichen.


    dd löscht die aktuelle Zeile.


    dw löscht bis Ende des aktuellen Wortes.


    cw wechselt in den Eingabemodus (der Rest des aktuellen Wortes wird durch die
    Eingabe überschrieben).


    u nimmt den letzten Befehl zurück.


    J hängt die folgende Zeile an die aktuelle an.


    : wiederholt den letzten Befehl.


    w wechselt im Komplexbefehlsmodus.


    # Tabelle 7.2: Einfache Befehle des Editors vi


    Allen Befehlen kann eine Zahl vorangestellt werden, die angibt, auf viele Objekte
    sich der folgende Befehl beziehen soll. So können durch Eingabe von ''3dw'' Wörter
    auf einmal gelöscht werden. Durch Eingabe von ''10x'' erreicht man das Löschen
    von zehn Zeichen ab der Cursorposition, ''20dd'' löscht 20 Zeilen.


    Die wichtigsten Befehle des Komplexbefehlsmodus:


    +   :q! verlässt vi, ohne Änderungen zu speichern


    +   :w (datename) speichert unter (datename)


    +   :x speichert die geänderte Datei und verlässt den Editor


    +   :e (datename) editiert (lädt) (datename)


    +   :u nimmt den letzten Editierbefehl zurück


    # Tabelle 7.3: Komplexe Befehle des Editors vi


    Das Drücken der Taste (ESC) im Eingabemodus wechselt den Befehlsmodus.'
