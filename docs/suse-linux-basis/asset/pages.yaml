  md: '# Die Kontrollliste


    Die Kontrollliste erscheint nach dem Start von KDE standardmäßig am unteren Rand.
    Darin befindet sich das SuSE-Menü und diverse Icons zum schnellen Start von häufig
    benötigten Anwendungen, wie z. B. einer Shell, der Datei- und Webbrowser Konqueror
    u. a. Des Weiteren finden sich noch diverse „Miniprogramme“, die wir ihnen im
    Abschnitt Miniprogramm oder die Applets auf dieser Seite vorstellen werden.


    # Die Menüstrukturen von KDE und SuSE


    Die KDE-Pakete von SuSE werden mit zwei Menüs ausgeliefert: dem normalen und dem
    erweiterten SuSE-Menü. Das K-Menü ist das „traditionelle“ Menü; das SuSE-Menü
    ist wenig anders. Nach dem Start ist standardmäßig dieses Menü eingestellt. Im
    SuSE-Menü finden Sie natürlich alle KDE-Programme und noch etwas mehr. So können
    Sie z. B. alle GNOME- und X-Anwendungen finden. Folgende Rubriken stehen zur Auswahl:
    Entwicklung, Spiele, Grafik, Internet, Multimedia, Büroprogramm, Einstellungen,
    System und Dienstprogramm. Daneben finden Sie auch Einträge für die SuSELife,
    das Kontrollzentrum u. a. Möchten Sie sich ein Menü umschalten, können dies im
    Kontrollzentrum unter „Erscheinungsbild“ → „Menüeinstellungen“ vornehmen. Dort
    können Sie auch zusätzliche Menüs für die Startleiste einbinden, wie z. B. das
    Arbeitsmenü oder das Administratorenmenü. Diese bieten häufig benötigte Programme
    sowohl vom K- als auch vom SuSE-Menü erreichbar. Entscheiden Sie selbst, welche
    Struktur Sie zu bevorzugen ist.


    # Die Applets: Miniprogramme


    Die Kontrollliste kann noch mehr: sie bietet Platz für sogenannte Applets, die
    Sie dort einbetten können; z. B. können Sie die Uhr anzeigen lassen.


    ```

    ./images/png/kde2-kicker-applets.png

    ```


    **Abbildung 3.2:** Eine Auswahl von Miniprogrammen


    In Abbildung 3.2 sehen Sie von links nach rechts: Umschalt, Schnellstarter, Systemmonitor,
    Augen, Newsticker, Abschnitt der Kontrollliste und Uhr.


    26           Arbeiten mit KDE'
