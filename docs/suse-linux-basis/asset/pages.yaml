  md: '2. Programme, Ordner usw. können Sie auch direkt aus dem Conqueror heraus mit
    der linken Maustaste anklicken, gedrückt halten und auf der Kontrolleiste ablegen.


    # Ich möchte mehr über mein System erfahren. Wie kann ich das?


    Es gibt zwei Möglichkeiten: Drücken Sie die Tastenkombination Alt + F2 und geben
    Sie den Befehl ksysquery ein. Ein Fenster öffnet sich. Das so genannte „Sensor-Browser“
    auf der linken Fensterseite können Sie gezeigtes Überwachungsmodul anklicken und
    auf den Hauptfenster zurückziehen. Die andere Möglichkeit befindet sich im Kontrollzentrum.
    Unter „Informationen“ befinden sich alle Ressourcen und Geräte, die mit Ihrem
    Rechner verknüpft sind.


    # Wie kann ich Post-Script- oder PDF-Dateien anzeigen?


    Unter KDE gibt es ein Programm: KGhostview. Im Abschnitt DVI-, PostScript- und
    PDF-Betrachter auf Seite 29 erfahren Sie mehr darüber.


    # Wie kann ich Grafikkateien anzeigen?


    Durch das Programm Kview können Sie sie starten, indem Sie über das Menü „Datei“,
    „Öffnen“ und kview eingeben. Das Programm unterstützt eine Vielzahl von Grafik-formaten.


    # Wie kann meine WAV, MP3-Dateien abspielen?


    Ja, drücken Sie Alt + F2 und geben Sie noatun ein. Ein Fenster öffnet sich; über
    das Menü „Datei“, „Öffnen“ können Sie Ihre Audiodateien laden.


    # Wie kann ich eine Audio-CD abspielen?


    Legen Sie die Audio-CD ins Laufwerk ein, starten Sie das Programm noatun (Alt
    + F2) und noatun eingeben. Möglicherweise müssen Sie noch die Lautstärke nachregulieren.
    Dies können Sie mit dem Programm kmix tun.


    # Wie kann ich mich ins Internet einwählen?


    Über das Programm Kinetner. finden Sie eine ausführliche Beschreibung im Abschnitt
    Kinetner – der Weg ins WWW auf Seite 33.


    # Wie kann ich meine E-Mails lesen?


    Das Programm KMail hilft Ihnen dabei. Es wird ausführlich im Buch Die Programme
    beschrieben.'
