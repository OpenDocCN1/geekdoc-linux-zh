  md: 'Jede der Visualisierungs-Methoden können Sie einzel an- und ausschalten. Es
    können sowohl mehrere Methoden gleichzeitig aktiviert sein, welche alle einzel
    abgeschaltet werden.


    # Konfiguration von Sawfish


    Auch wenn GNOME mit vielen Windowmanag umgehen kann, eignet sich Sawfish ganz
    besonders für die Zusammenarbeit.


    +   - Geringer Speicherbedarf: Sawfish geht als besonders „schlankes“ Programm
    hervorragend mit den Ressourcen um, was auch eine hohe Arbeitsgeschwindigkeit
    auf Folge hat.

    - Nutzung von Themes: Das Look&Feel von Sawfish kann mittels Themen verändern,
    die Anordnung der Bedienelemente ist eingeschlossen.

    - GNOME Kompatibilität: Sawfish ist 100% GNOME kompatibel. Sawfish kann innerhalb
    des GNOME-Kontrollzentrums konfiguriert werden.


    Sawfish lässt sich über eigenes Kontrollzentrum einstellen. Wählen Sie dazu im
    GNOME-Kontrollzentrum unter „Arbeitsplatz“ → „Fenstermanager auswählen“ → „Konfiguration
    für Sawfish auf. Wir werden uns jedoch auf die Konfiguration innerhalb des GNOME-Kontrollzentrums
    konzentrieren.


    # Arbeitsplätze


    Ein Arbeitsplatz wird bei Sawfish in Zeilen und Spalten unterteilt. Wenn z. B.
    zwei Spalten und zwei Zeilen gewählt werden, wird der Arbeitsplatz in vier Ausschnitte
    unterteilt. Jeder Abschnitt hat dann die Größe eines kompletten Bildschirms. So
    kann man z. B. ein Fenster verkleinert in der Taskleiste darstellen, im Rahmen
    des Arbeitsplatzes in einen anderen Abschnitt bewegen. Ein Fenster über den Bildschirmrand
    hinaus, befindet sich der nicht mehr sichtbare daneben liegenden Abschnitt. In
    diesem Fenster können Sie ein, wie viele Arbeitsplätze Sawfish verwalten soll
    und wie viele Ausschnitte ein Arbeitsplatz enthält. Ebenso können Sie den Arbeitsätzen
    symbolische Namen geben und bestimmen, ob die Arbeitsplätze wechseln, wenn der
    Mausiger den Bildschirmrand berührt.'
