- img_proc: true
  md: '# Einführung


    Dieses Kapitel setzt voraus, dass Sie SuSE Linux erfolgreich installiert und den
    X-Server richtig eingerichtet haben. Ferner sollten Ihnen Begriffe wie root, mount-en
    usw nicht völlig fremd sein. Falls Sie hier noch Probleme haben, lesen Sie bitte
    im Installationshandbuch die entsprechenden Stellen nochmals nach. Noch ein Hinweis:
    KDE basiert auf einem einem funktionsfähigen X Window System, auf dem alle Desktopsysteme
    unter Linux laufen können. Eine sorgfältige Konfiguration erspart Ihnen spätere
    Frustrationen.


    # Die Geschichte hinter KDE


    Die Story hinter KDE hört sich wie ein modernes Märchen von Hollywood an: Ein
    frustrierter Tübinger Informatikstudent war es leid, unter Unix bzw. Linux die
    Oberflächen keine Konformität aufwiesen. Und entwickelte sich die wohl populärste
    grafische Benutzeroberberfläche für X Window Systeme: KDE. Dank konnte Matthias
    Ethric sicherlich nicht ahnen, was sein Aufruf in einer Newsgroupirken würde.
    Es wurden einige Freiwillige für sein Projekt „KDE Environment“ und fand auch
    Zugang. Bald wurde eine erste lauffähige Version erstellt und KDE wurde bekannter
    und beliebter. Verbesserungen folgten, das KDE-Projekt erreichte eine kritische
    Masse und entwickelte sich quasi zum Selbstläufer.

    Heute sind sich hunderte Programmierer auf der ganzen Welt damit beschäftigt,
    KDE noch besser zu machen.


    # Der erste Schritt


    Wenn KDE das erste Mal startet, erscheint er auf dem Bildschirm des Einrichtungsassistent.
    In fünf Schritten wählen Sie zuerst das Land bzw. die Sprache, das Systemverhalten
    (KDE, Unix, Windows, Apple OS), verschiedene Effekte und das Design der Oberfläche.
    Am Schluss können Sie das noch als Kontrollzentrum starten und KDE noch weiter
    Ihren Wünschen anpassen.

    Das Programm können Sie auch manuell starten, indem Sie Alt + F2 drücken, und
    kpersonalizer eingeben.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Hilfe


    Falls Sie über KDE einmal nicht wiederkommen sollten, können Sie jederzeit die
    F1 drücken oder im Menü des entsprechenden Programs den Eintrag ‘Inhalt...’ wählen.
    Das KDE-Hilfezentrum erscheint. Nach dem Start finden Sie auf der linken Seite
    ein Register mit den Registern ‘Inhalt’ und ‘Suchen’. Die bei den folgenden Unterkapitel
    beschreiben die jeweiligen inhaltenen Funktionen.


    # Inhalt


    Unter ‘Inhalt’ finden Sie verschiedene Dokumente, welche zu Programmen des KDE-Systems
    als zum Linux-System Informationen bereitstellen. Die Weiter finden Sie hier Man-(von
    Manual; Anleitungen) und auch Info-Seiten. Klicken Sie beispielsweise auf ‘Programhandbuch’,
    dann wird Ihnen die Menstruktur im K-Menü angezeigt. Sie finden hier weiter im
    Menüzweigen oder direkt im rechten Feld die Dokumentation zu Ihrer Auswahl. Über
    den Eintrag ‘Unix-Handbuchseiten’ finden Sie die ‘Man-Pages’. Diese Struktur ist
    geschichtlich bedingt in neu je nach Zählweise Abschnitte zu Sktionen unterteilt
    (Benutzerkomsystem, Aufrufe usw.). Ein K auf die entsprechende Sektion zeigt Ihnen
    alle Einträge. Wählen Sie den gewünschten Eintrag, um Informationen dazu zu erhalten.


    Informationen zu einem bestimmten Befehl erhalten Sie auch, indem Sie das Nummernzeichen
    # und den Namen des Befehls in das URL-Eingabefenster des Kon eingeben.


    # Arbeiten mit KDE


    Unter KDE existieren verschiedene Möglichkeiten, um Einstellungen zu verändern
    bzw. Daten, Anwendungen aufzurufen. Ihnen stehen dazu der KDE-Desktop, die Arbeitsflächen,
    Titel-, Fenster- und Kontrollleiste für Verfügung. Die einzelnen Möglichkeiten
    werden Ihnen in den nachfolgenden Ab-schritten vorgestellt.


    # Der KDE-Desktop


    Der Desktop ist unter KDE die zentrale Schaltstelle. Auf dem Desktop finden Sie
    nach dem Start verschiedene Icons, die Sie z.B. auf CD-ROM-, Disketten- oder Festplattenlaufwerke
    zugreifen, Dateien ablegen sowie Verweise auf Verzeichnisse und Dateien einfügen
    können.'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'Eigentlich ist der Desktop ein Ordner an Ihrer Festplatte. Er befindet sich
    in Ihrem Verzeichnis unter KDEdesktop. Alle hier abgelegten Dateien werden vom
    KDE über Ihren Desktop angezeigt. Wenn Sie den Pfad ändern können, erfahren Sie
    dies im Abschnitt Erscheinungsbild auf Seite 42.


    # Das Arbeitsflächenmenü


    Wie bei vielen Betriebssystemen können Sie auch KDE eine Menüleiste am oberen
    Rand positionieren. Wenn Sie diese anzeigen möchten, klicken Sie mit der rechten
    Maustaste auf den Desktop. Es erscheint ein Popup-Menü; wählen Sie den Eintrag
    ''Arbeitsflächenmenü aktivieren'' aus. Sie können durch einen einfachen Klicken
    auf die Menüleiste ein- bzw. ausstellen. Im Nachfolgenden geben wir Ihnen eine
    Übersicht über die enthaltenen Menüs und Möglichkeiten, um den Umgang mit KDE
    zu vereinfachen:


    +   ''Datei'' – Führen Sie einzelne Befehle aus, starten Sie Anwendungen, sperren
    Sie Ihren Bildschirmbild oder melden Sie sich ab.


    +   ''Neu'' – Legen Sie z. B. Verzeichnisse, Verknüpfungen zu FTP- bzw. WWW-Dateien
    an oder erstellen Anwendungen für schnellen Zugriff auf häufig benötigte Adressen
    oder Dateien. KDE verwaltet automatisch alle Lesezeichen aus anderen Browsern
    (derzeit Netscape und Mozilla).


    +   ''Lesezeichen'' – Verwalten Sie Ihre Lesezeichen („Bookmarks“). So haben Sie
    leicht Zugriff auf häufig benötigte Adressen oder Dateien.


    +   ''Arbeitsfläche'' – Sie können Fenster und Symbole anordnen bzw. ausrichten,
    den Hintergrund und die Arbeitsfläche einrichten, sowie die Menüleiste deaktivieren.


    +   ''Fenster'' – Lassen Sie alle Arbeitsflächen mit dem darauf geöffneten Anwendungen
    anzeigen.


    +   ''Hilfe'' – Nutzen Sie Hilfestellungen und Informationen zu KDE bzw. berichten
    Sie selbst über Probleme oder Wünsche.


    # Die Tititleiste


    Die Tititleiste ist der obere Streifen jedes Fensters und beinhaltet den Namen
    des Fensters und je nach Dekoration verschiedene Icons.'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'In der Decoration „KDE2“ zeigt sich z. B. folgender Aufbau der Tititleiste:
    Das Fenstermenü, das Anpymbol, das jeweilige Fenstername, das Minimier-, das Vergrößerungs-
    sowie das Schließsymbol. Teilweise kann auch vor dem Minimymbol noch ein Fragezeichen,
    das sogenannte „Was ist das?“-Symbol, erscheinen. Der Aufbau zeigt Abbildung 3.1.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_34_0.png)


    # Abbildung 3.1: Die Tititleiste eines KDE-Fensters in der Decoration KDE


    Weitere Funktionen erhalten Sie, welche sich mit der Maustaste auf die Tititleiste
    klicken. Ein Popup-Menü öff sich, in dem Sie Einstellungen zum aktuellen Fenster
    bzw. Layout aller Fenster finden. Es besitzt folgende Einträge:


    +   * ‘Verschieben‘ – Das folgt der Mausbewegung, bis Sie es mit einem Klicken
    auf die linke Maustaste „ablegen“.


    +   * ‘Größe‘ – Ändern Sie die horizontale und vertikale Ausrichtung des Fensters
    durch Bewegen der Maus, Sie mit einem Klicken auf die linke Maustaste die Größe
    besten.


    +   * ‘Minimieren‘ – Minimieren Sie das aktuelle Fenster. Die Anwendung wird nicht
    geschlossen, sondern als Symbol in der Fensterliste abgelegt. Um das Programm
    zu öffnen, aktivieren Sie die Anwendung über das Symbol in der Fensterliste.


    +   * ‘Maximieren‘ – Maximieren Sie das aktuelle Fenster. Die Anwendung wird jetzt
    bildschirmfüllend dargestellt. Durch ein erneutes Auswählen stellen Sie das ursprüngliche
    Fenster wieder her.


    +   * ‘Fensterheber‘ – Das aktuelle Fenster wird auf die Tititleiste verkleinert.


    +   * ‘Immer im Vordergrund‘ – Das aktuelle Fenster bleibt so lange im Vordergrund
    sichtbar


    +   * ‘Einstellungen speichern‘ – Sichert Ihre Vorgaben.


    +   * ‘Einrichten...’ – Öffnet ein Einstellfenster, in dem Sie die Eigenschaften
    und die Decoration der Fenster angeben können.


    +   * ‘Auf Arbeitsfläche‘ – Durch Auswahl eines Unternehmens können Sie das Fenster
    auf die jeweilige Arbeitsfläche verschieben.


    +   * ‘Schließen‘ – schließt das aktuelle Fenster.'
