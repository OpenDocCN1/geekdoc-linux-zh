- img_proc: true
  md: '![](img/7c7b5e54e6579952ad3fd8bde9e1a136_50_0.png)


    Abbildung 4.2: Das Editieren eines MIME-Typs


    Beim Klick auf einen MIME-Typ öffnet sich auf der rechten Seite einen Bereich,
    in dem Sie weitere Einstellungen vornehmen können:


    Unter dem Reiter ''Allgemein'' legen Sie das Icon, den Dateimuster und eine kurze
    Beschreibung fest. Programme, die diesen Typ verarbeiten können, legen Sie mit
    ''Hinzufügen'' an.


    Sofern das ausgewählte Programm ein KDE-Plugin ist, können Sie unter unter ''Einbetten''
    diese Aktion kontrollieren, d. h. ob die Datei in Konquerer eingebettet werden
    soll oder sich in einem separaten Fenster geöffnet wird.


    # # Energiekontrolle


    Mit Hilfe des Modules dieses Menüpunkt lassen sich die Energiefunktionen Ihres
    Rechners aktivieren. So können Sie bei Stromknappheit einen Befehl oder einen
    Klang ausführen. Moderne Rechner können z. B. nach einer Zeit der Inaktivität
    auf den Bereitschaftmodus geschaltet werden. Die Voraussetzung dafür ist eine
    APM-Unterstützung, welche in den heutigen PCs bereits standardmäßig enthalten
    ist.'
