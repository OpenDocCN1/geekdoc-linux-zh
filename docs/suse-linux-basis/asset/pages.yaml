  md: '# Sitzung speichern


    Wenn Sie das GNOME-Loginbild, bei den genannten „Splash-Screen“ beim Anmelden
    nicht sehen wollen, können Sie ihn deaktivieren. Des Weiteren kann auch der Abmeldedialog
    deaktiviert werden, der Sie beim Abmelden fragt, ob Sie die aktuelle Sitzung wiederherstellen
    wollen. Soll die Änderungen an der Sitzung, d. h. der aktuelle Desktopzustand
    und laufende Programme, beim Abmelden automatisch gespeichert werden, klicken
    Sie auf ‘Automatisch die Änderungen an der Sitzung speichern’


    # Umgang mit Dokumenten


    Vingestellt Editor Wenn Sie einen Texteditor benötigen, etwa beim Anklicken einer
    Textdatei auf dem Desktop, wird ein bestimmter Editor gestartet. Hier können Sie
    einstellen, welches Programm das sein soll. benötigt das Programm ein eigenes
    Terminalfenster, z. B. vi, klicken Sie auf ‘Terminal ausführen’


    Dateypen und Programme Anhand von MIME-Typen GNOME erkennen, welche Anwendung
    für welches Dateformat zu starten ist. Sie können MIME-Typen hinzuzufügen oder
    bestehende. Sie können zu jedem MIME-Typ ein „Suffix“ festlegen, anhand dieser
    die Datei identifiziert wird. Wenn Sie veranlassen wollen, dass Sie die LaTeX-Dokumente
    immer mit Emacs geöffnet werden, wählen Sie den MIME-Type ‘application/x-tex’
    und klicken auf ‘bearbeiten’. Im erscheinenden Dialog können Sie einstellen, welches
    Programm gestartet wird. Tragen Sie hier Emacs %f ein, um den Editor Emacs für
    diesen Typ zuzuordnen.


    Benutzer-Rückmeldung (engl. User Feedback) Ein größeres Programm in den Speicher
    geladen wird, kann durchaus mehrere Sekunden dauern, bis das Programmfenster tatsächlich
    angezeigt wird. Um den Benutzer darüber zu informieren, dass ein solcher Vorgang
    stattfindet, nutzt GNOME verschiedene Arten der „Rückmeldung:


    +   - Taskliste: In der Taskliste wird durch einen zusätzlichen Eintrag angezeigt,
    dass ein Programm geladen wird.

    - Sanduhr-Cursor: Der Mauscursor wird um eine kleine Sanduhr ergänzt, wenn ein
    Programm geladen wird.

    - Splash-Screen: Für jedes zu startende Programm wird ein kleiner Splash-Screen
    eingeblendet.

    - Animierter Stern: Auf dem Desktop wird links oben ein animierter Stern angezeigt,
    wenn ein Ladevorgang stattfindet.'
