- img_proc: true
  md: '6. Unsere „Testdatei“ soll nun mit dem Befehl mv (engl. move) in das Unterverzeichnis
    test verschoben werden. Zur Erleichterung der Eingabe nutzen wir die Expansionsfunktion:
    Geben Sie mv T und drücken Sie die Tabulator-Taste. Gibt es keine Datei mit diesem
