    und drücken zum Verschieben noch ↍


    7. Wenn Sie den Befehl ls eingeben, wird „Testdatei“ nicht mehr angezeigt.


    8. Um zu sehen, ob das Verschieben erfolgreich war, wechseln Sie mit dem Befehl
    cd in das Verzeichnis. Geben Sie ls ein; ihn sollte jetzt „Testdatei“ angezeigt
    werden. Durch die Eingabe von cd (engl. change directory) gelangen Sie wieder
    in Ihr Home-Verzeichnis.


    9. Sollten Sie eine Kopie der Datei benötigen, benutzen Sie den Befehl cp (engl.
    copy). Geben Sie cp Testdatei Testsicherung ein, um die „Testdatei“ in „Tellsicherung“
    zu kopieren. Mit dem Aufruf von ls werden Ihnen Dateien angezeigt.


    # Pfadangaben


    Zur Bearbeitung von Dateien oder Verzeichnissen muss immer der richtige Pfad angegeben
    werden. Dazu müssen Sie nicht den kompletten Pfad vom Wurzelverzeichnis angeben,
    sondern von Ihrem Verzeichnis ausgehen. Zusätzlich lässt sich Ihr Home-Verzeichnis
    mit ~ anspre. Das bedeutet, dass Sie mehrere Möglichkeiten haben, die Datei „Testdatei“
    im Verzeichnis aufzulisten: relativ durch die Eingabe von ls ~*/*

    Zum Einsehen von Home-Verzeichnisses anderer Benutzer, geben Sie ls ~ und den
    Benutzernamen ein. In der gewünschten Verzeichnisstruktur wäre ein Beispielmuster
    tux. Der Befehl ls ~t würde entsprechend den Inhalt des Home-Verzeichnisses von
    tux anzeigen.

    Ihr aktuelles Verzeichnis können Sie durch einen Punkt darstellen, höhere Pfadebenen
    durch zwei Punkte. Mit der Eingabe von ls .. wird Ihr Inhalt des Mutterverzeichnisses
    zum aktuellen Verzeichnis angezeigt, durch ls ../ der Inhalt des Verzeichnisses
    zwei Stufen in der Hierarchie höher.'
