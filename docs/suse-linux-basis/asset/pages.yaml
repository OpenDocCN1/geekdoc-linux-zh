  md: 'Richtiges Sitzen bedeutet, die Haltung zu wechseln. Dann werden über die Zeit
    hinweg immer wieder verschiedene Körperteile beansprucht. Im Prinzip ist viel
    eine Frage der richtigen Einstellung: Die Höhe Ihres Arbeitsstuhls ist optimal,
    wenn auf dem Arbeitstisch liegenden Unterarme einen rechten Winkel zum Oberarm
    bilden. An Ihren Füßen sollten Sie vollständig auf dem Boden stehen können, und
    Ober- und Unterschen sollten ebenfalls rechtwinklig sein. Alternativen zu herkömmlichen
    Sitzgelegenheiten bieten Gymnastikkühle und „Balancestühle“.


    Le ist nach ergonomischen Kriterien konstruierter Stuhl relativ teuer, aber die
    Investition in Ihre Gesundheit lohnt sich. Übrigens: Das deut-GS-Prüfsiegel zeigt
    nur, dass Mindestanforderung erfüllt sind. Das Sie-TÜ Rheinland – Ergonomie „geprüft“
    stellt mehr Anforderungen an einen Stuhl.


    Wichtige Merkmale eines guten Stuhls:


    +   * Rückenlehne, die bis unter die Schulterblätter reicht und deren Bewegungswiderstand
    individuell Regeln lässt.


    +   * Stütze für die Lendenwirbelsäule.


    +   * Sitzfläche ist ebenfalls variabel und kann sich nach vorne oder hinten neigen.


    +   * Lehne und Sitzfläche werden durch eine Automik in einem idealen Winkel gehalten.


    +   * Der Stuhl hat eine Federung, die das Gewicht beim Hinsetzen sanft auf-fängt.


    +   * Außerdem muss der Stuhl mindestens fünf Füße mit Rollen standfest sein und
    die Rollen beim Aufstehen abbremst.


    +   * Da die Menschen unterschiedlich groß sind und unterschiedliche Rumpf- und
    Beinlängen haben, ist eine Sitzhöhenverstellung unabding-bar (nach Norm 42 bis
    53 cm), ebenso sollte die Rückenlehne nach oben oder unten verschiebbar sein.


    +   * Luxus sind individuelle Einstellungsmöglichkeiten für eventuell vorhandene
    Armlehnen.


    +   * Erreichen Ihre Füße den Boden nicht, sollte eine Fußstütze vorhaben sein.'
