    ein Kabel mit Ihrer TV-Karte mitgeliefert, damit Sie den Ton auf den Audioeingang
    der Soundkarte legen können. Hier muss die Soundkarte bereits eingerichtet und
    der externe Eingang nicht mehr stummgeschaltet sein. Klicken Sie hierfür in der
    Maske auf ‚Ja‘ und seleieren Sie Ihre Soundkarte zu konfigurieren; vgl. Abschnitt
    Soundkarte auf Seite 86. Sie haben zudem die Möglichkeit, den Lautsprecherbereich
    direkt zu klemmen, ohne Soundkarte dazwischen – falls Sie den Sound nicht sowieso
    von woanders Sie ihn erhalten (z. B. externer SAT-Receiver) Es gibt auch TV-Karten
    ganz ohne Soundfunktion, z. B. für CCD-Kameras. In einem Fall ist keine Audiodekonfiguration
    nötig bzw. mwg. möglich.'
