    Sie auf ‚Hinzuzufügen‘ Falls Ihre TV-Karte nicht erkannt wurde, konfigurieren
    Sie die ‚andere, nicht erkannte‘ Karte, damit Sie zur manuellen Konfiguration.
    Mit dem Button ‚Bearbeiten‘ haben Sie die Möglichkeit, eine bestehende Konfiguration
    zu ändern.


    Der Dialog ‚Überblick‘ über die TV-Karten erscheint nach einem Klick auf ‚Bearbeiten‘
    oder gleich nach dem Start des Yoast2-Moduls, wenn Sie bereits eine oder mehrere
    TV-Karten installiert und konfiguriert sind. In diesem Dialog können Sie die Konfiguration
    jeder Karte bearbeiten oder ‚Hinzufügen‘ starten Sie die manuelle Konfiguration.


    In der Maske ‚Manuelle Konfiguration‘ wählen Sie zuerst den Typ TVkarte aus der
    Liste aus. Falls Sie einen Tunertyp wählen müssen, um eine funktionierende Konfiguration
    zu erhalten, wenn Sie sich nicht sicher sind, sollten Sie die Einstellungen erst
