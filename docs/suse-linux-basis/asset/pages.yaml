- img_proc: true
  md: '![](img/7c7b5e54e6579952ad3fd8bde9e1a136_123_0.png)


    # # Online-Update


    Das YaST-Online-Update ermöglicht die Installation von wichtigen Upgrades bzw.
    Auf dem SuSE-FTP-Server werden die entsprechenden „Patches“ zum Herunterladen
    beiggelegt. Die Installation der aktuellen Pakete kann vollautomatisch erfolgen.
    Mit „Manuelles Update“ haben Sie jedoch die Möglichkeit, selbst zu bestimmen,
    welche Patches in Ihr SuSE Linux System eingespielt werden.


    Nach einem Klick auf ‚Details‘ erhalten Sie Informationen über Ihr letztes Update
    und über die bereitliegenden Pakete. Details erfahren Sie nach Klick auf ‚Patch-Informationen
    anzeigen‘ Mit ‚Weiter‘ gelangen Sie zur Liste aller verfügbaren Patches (falls
    „Manuelles Update“ gewählt wurde), aus der Sie Ihre Auswahl treffen. Mit ‚Übernehmen‘
    oder Doppelklick aktivieren Sie die einzelnen Teile. Mit ‚Weiter‘ ‚Beenden‘ führen
    Sie das Online-Update zum Abschluss.


    # # Online-Update von der Konsole


    ```

    erde:/root # yast2 online_update .auto.get

    ```'
