- img_proc: true
  md: '> Hinweis

    GNOME kann zwar mit jedem Windowmanager arbeiten, aber nicht alle unterstützen
    GNOME. Wir empfehlen den 100-%tig GNOME kompatiblen Sowfish. Eine weitere Möglichkeit
    ist z. B. Enlightenment, mit dem man aufgrund seiner aufwendigen grafischen Effekte
    ganze Systeme richtig ausreizen kann.


    # Hintergrund Konfigurieren Sie den Hintergrund Ihres Desktops. Sie haben die
    Möglichkeit, ein Bild auszuwählen und auf verschiedene Arten in den Hintergrund
    zu setzen. Erscheint das Bild verzerrt, wählen Sie die Option ''Skaliert'' (Seitenverhältnis
    beibehalten). Alternativ können Sie auch einen Farbverlauf über den Desktop wählen.
    Rechts im Kasten ''Vorschau'' sehen Sie, wie der nicht eingestellte Hintergrund
    aussehen wird. Um die Einstellungen zu aktivieren, klicken Sie auf ''Übernehmen''.


    Panel Die Einstellungen zu den Innenheiten Panels können Sie hier anern. Die Beschreibungen
    zu den Einstellungen werden den Rahmen sprengen, daher möchten wir nur auf den
    Reiter ''Knöpfe'' verweisen, mit dem Sie die Icons auf dem Panel mit Kacheln hinterlegen
    können.


    Thema auswählen Eine Besonderheit von GNOME ist die Fähigkeit, das Aussehen Ihres
    Desktops mit Hilfe von „Themes“ komplett zu ändern. Wir haben eine Auswahl an
    freien Themes zusammengestellt. Diese finden Sie im Paket gtk-theme der Serie
    xwm (Windowmanager) und können Sie mit Hilfe von YaST installieren. Wenn GNOME
    das erste Mal starten, ein spezielles SuSE Thema eingestellt.


    # Benutzeroberchnittstelle


    Anwendungen Diese Optionen betreffen alle zu GNOME kompatiblen Anwendungen. Sie
    können hier das Verhalten von Menüs, der Werkzeugleisten und der Statuszeile einstellen.
    Fast alle GNOME-Menüs sind „abreißbar“, d.h. können sie zu einem allein stehenden
    Fenster machen.'
