  md: '# Setup


    Unter ''Schnelles automatisches Setup'' werden keine weiteren Konfigurations-schritte
    abgefragt und kein Testsound gestartet. Die Soundkarte ist fertig eingerichtet.


    Mit ''Normales Setup'' hat man die Möglichkeit, im folgenden Menü ''Lautstärke
    der Soundkarte'' die Ausgangslautstärke zu regeln und einen Testsound abzuspielen.


    Bei ''Erweitertes Setup'' hat man die Möglichkeit, Optionen zu ändern, gelang
    man in das Menü ''Erweiterte Optionen für die Soundkarte''. Hier kann man die
    Optionen der Soundkarte manuell anpassen.


    # Lautstärke der Soundkarte


    Unter dieser Testmode können Sie Ihre Soundkonfiguration testen. Mit den Buttons
    ''+'' und ''-'' stellen Sie die Lautstärke ein. Beginnen Sie bei etwa 10%, um
    wieder jeden Lautsprecher noch Ihr Gehör zu schädigen. Durch einen Klicken auf
    den Button ''Test'' sollte die Soundkarte zu hören sein. Falls nicht, regeln Sie
    die Lautstärke nach. Mit ''Weiter'' schließen Sie die Soundkonfiguration ab und
    die Lautstärke wird gespeichert.


    # Soundkonfiguration


    Mit der Option ''Löschen'' kann man eine Soundkarte entfernen. Vorhandene Einträge
    von bereits konfigurierten Soundkarten werden in der Datei /etc/modules.conf deaktiviert.
    Unter ''Optionen'' gelang man in das Menü ''Erweiterte Optionen für die Soundkarte''.
    Hier kann man die Optionen derkarte manuell anpassen. Im Menü ''Mixer'' ist es
    möglich, die Regeleinstellungen für Ein- und Ausgänge der Soundkarte zu konfigurieren.
    Mit ''Weiter'' werden die neuen Werte gespeichert und mit ''Zurück'' wieder auf
    die Standardeinstellungen zurückgesetzt. Bei ''Soundkarte hinzufügen...'' können
    Sie weitere Soundkarten integrieren. Findet YaST2 automatisch eine weitere Soundkarte,
    oder findet YaST2 keine Soundkarte, geht es direkt zur ''Manuelle Auswahl der
    Soundkarte''. Wenn Sie eine Creative Soundblaster Live oder AWE verwenden, können
    Sie über die Option ''Soundfonts installieren'' automatisch von der Original-Soundtreiber
    CD-ROM SF2-Soundfonts auf Ihre Festplatte kopieren. Diese werden im Verzeichnis
    /usr/share/sfbank/creative/ abgelegt.'
