  md: '# Um was geht es?


    Neben KDE, FVWM oder Windowmaker wurden Projekte gegründet, um die Bedienungsoberfläche
    zu vereinflichen und die Aspekte des Look&Feel zusammenzuführen. Dies beinhaltet
    mehr als als „nur“ die Fenster einer grafischen Oberfläche zu verwalten. Es sorgen
    so weitere Komponenten dafür, dass Anwendungen untereinander Daten austauschen
    können sowie dass ein einheitlicheslicheskonkonzept und Hilfesystem aufweisen.
    Durch Modularisierung können wiederverwendbare Programme in andere Anwendungen
    eingebunden werden, so dass für viele Anwendungen nicht jedes Mal das Rad erfunden
    werden muss. Eines dieser Projekte, GNOME (= GNU Network Object Environment),
    entstand im August 1997 mit der Zielsetzung, eine Grundlage für eine komplett
    freier Benutzeroberfläche zu entwickeln, welche auf komplett freier Software basiert.
    Um großer Anteilteil der weltweit verstreuten Entwickler wurde GNOME zu einem
    erfolgreichen Desktop und zu einer flexiblen sowie leistungsigen Entwicklungsumgebung.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_67_0.png)


    > Abbildung 5.1: Das GNOME Startlogo


    # GNOME starten


    SuSE bemüht sich, die Komponenten des GNOME-Desktops aktuell zu halten. Wenn Sie
    von SuSE mitgelieferte GNOME verwenden, dann erhalten Sie die jeweils aktuellsten
    Versionen des GNOME-Projekte in einer sinnv Vorkonfiguration. Sie starten GNOME,
    indem Sie bei grafischem Login die GNOME-Session auswählen oder den X-Server mit
    startx gnome aufrufen. Danach erscheint ein Logo, das Sie über den Startvorgang
    informiert.'
  merge: -1
  pgno: 67
- img_proc: true
  md: '# Der GNOME-Hilfebrowser


    Der GNOME-Hilfebrowser ist die zentrale Sammelstelle für die auf Ihrem Linux System
    gespeicherte Dokumentation. Wählen Sie ‚Programme‘ → ‘GNOME-Hilfe‘ um das Programm
    aufzurufen. Der Hilfebrowser ermöglicht neben GNOME spezifischen Dokumenten, das
    Ansehen von traditionellen Hilfeformaten wie Manual-Pages oder Info-Seiten.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_68_0.png)


    Die Bedienung ist ähnlich der eines normalen Web-Browsers: Mit Hilfe der Toolbar
    können Sie Lesezeichen anlegen sowie in den Seiten vor- und zurückblättern. Wenn
    Sie innerhalb von Programmen die Hilfe aufrufen, wird der Hilfebrowser ebenfalls
    angezeigt. Zusätzlich finden Sie auf der Startseite des Browsers noch die Auswahl
    ‘GNOME User’s Guide’, ein ausführliches Benutzerhandbuch für den GNOME-Desktop.


    # Das GNOME-Panel


    Das GNOME-Panel ist die Bezeichnung für die Kontrollliste und befindet sich am
    unteren Bildschirmrand, den Sie das erste Mal GNOME starten. Von hier starten
    Sie die Programme, mit denen Sie arbeiten und kontrollieren die verschiedenen
    Arbeitsplätze, die GNOME zur Verfügung stellt. Das zentrale Element der Kontrolliste
    ist das GNOME-Icon „Der Fuß“, welches sich ganz links in der Kontrolliste befindet.
    Klicken Sie darauf, um das GNOME-Startmenü zu öffnen, von dem aus Sie Anwendungen
    starten und verschiedene Einstellungen vornehmen können.'
  merge: -1
  pgno: 68
- img_proc: true
  md: 'Abbildung 5.3: Ein Ausschnitt des GNOME-Panels (Kontrollleiste)


    In den meisten Panels befindet sich rechts und links außen jeweils ein kleines
    Pfeil-Icon. Klicken Sie auf einen dieser Pfeile, um ein Panel verschwinden zu
    lassen.


    # Das GNOME-Startmenü


    Das GNOME-Startmenü verteilt sich in verschiedene Unterpunkte auf, von denen wir
    die wichtigsten kurz vorstellen möchten.


    +   - ‘Programme’: Diese Auswahl zeigt Ihnen sämtliche Programme, die auf Ihrem
    System zur Verfügung stehen. Zusätzlich werden Ihnen im Menü ‘SUSE‘ sämtliche
    Programme angezeigt, die auf Ihrem System installiert sind. Im Ordner ‘Konfiguration‘
    können Sie Ihren GNOME-Desktop auf Ihre Bedürfnisse anpassen.

    - ‘Favoriten‘ Dieser Ordner beherbergt die von Ihnen bevorzugten Anwendungen Sie
    können sich diese mit dem Meneditor zusammenstellen.

    - ‚SuSE-Menüs‘: Der Ordner enthält alle Programme Ihres System.

    - ‚Ausführen‘ Starten Sie schnell Programme.

    - ‚Bildschirm sperren‘ Der Bildschirmschoner wird gestartet und nur durch Eingabe
    des Benutzerpassworts kann der GNOME-Desktop freigegeben werden.

    - ‚Abmelden‘: Hier können Sie den GNOME-Desktop verlassen. Wählen Sie ‚Aktuelle
    Einstellungen speichern‘ um GNOME zu veranlassen, sich die Fensterfenster und
    gestarteten Programme zu ‚merken‘ um sie beim nächsten Start genau zu wiederherstellen
    zu können.


    # Die Konfiguration des Panels


    Ein besonders herauschendes Feature des GNOME-Panel ist dessen Konfigurierbarkeit.
    Wichtig ist zu wissen, dass es mehrere Arten von Panels gibt:'
  merge: -1
  pgno: 69
- img_proc: true
  md: 'Kantenpanel – Ein Kantenpanel zieht sich immer von einer zur gegenüberliegenden
    Kante. Wenn Sie GNOME das erste Mal starten, finden Sie ein Kantenpanel am unteren
    Bildschirmrand. Selbstverständlich kann sich dieses Panel auch senkrecht auf dem
    Desktop liegen, d. h. von der oberen zur unteren Bildschirmkante.


    Ausgerichtetes Panel – Ein solches Panel können Sie rechtsbündig oder zentriert
    an den Kanten des Arbeitsplatzes ausrichten.


    Gleitendes Panel – Dies sind ausgerichtete Panels, bei denen der Abstand zur Kante
    genau bestimmt werden.


    Freischwebendes Panel – Dies sind keine Kante gebunden und können beliebig positioniert
    werden.


    Menüpanel – Das Panel stellt die wichtigsten Menüs an der oberen Bildschirmkante
    zur Verfügung, über die schnell Anwendungsprogramme und Einstellungsmöglichkeiten
    des Desktops erreichen können.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_70_0.png)


    Abbildung 5.4: Ausschnitt aus dem Menüpanel


    Die Einstellungen zu den einzelnen Panelarten rufen auf, indem Sie auf eine leere
    Fläche im Panel rechtslicken. Wählen Sie in der Auswahl ''Panel'' → ''Eigenschaften''
    → ''Alle Eigenschaften''. Sie können ein Panel jederzeit in einen anderen Paneltyp
    verwandeln, indem Sie sich im Dialog den Menüpunkt ''Typ'' wählen.


    > Tipp

    Wenn Sie mit mehreren Panels gleichzeitig arbeiten möchten, können Sie ein neues
    Panel erzeugen, indem Sie auf eine leere Fläche im Panel rechtsklicken und ''Panel''
    → ''Panel erzeugen wählen.


    # Nützliche Helfer – die Panel Applets


    Für GNOME gibt es eine große Auswahl an sogenannten „Panel Applets“. Apps sind
    immer präsent ohne viel Platz zu verbrauchen. Sie können ein Applet zum Panel
    hinzuzufügen, indem Sie in eine leere Fläche im Panel rechtslicken und ''Panel''
    → ''Zum Panel hinzufügen'' → ''Applets''. Besonders interessante und wichtige
    Applets möchten wir Ihnen kurz vorstellen.'
