- img_proc: true
  md: 'Optionen:


    +   - r nur lesbar mounten (engl. read only).

    - t dateisystem Gibt Dateisystem an. Die gebraäuchlichsten sind: ext2 für Linux-Plattformen,
    mdsos

    vfat für das Windows-Dateisystem und iso9660 für CDs.


    Bei Laufwerken, die nicht in der Datei /etc/fstab definiert sind, muss auch der
    Typ des Geräts angegeben werden. Das Einhängen (engl. mount) kann in diesem Fall
    nicht von root vorgenommen werden. Falls das Dateisystem auch von anderen Benutzern
    gemountet wird, tragen Sie in der entsprechenden Reihe der Datei /etc/fstab die
    Option user (durch Kommata getrennt) ein und speichern Sie. Weitere Informationen
    entnehmen Sie bitte der Manual-Page von mount (man mount).


    ```

    mount [Option(en)] Mountpoint

    ```


    Dieser Befehl einet ein gemountetes Laufwerk als Dateisystem. Bevor Sie einen
    Datenträger aus dem Laufwerk entfernen, führen Sie diesen Befehl aus. Ansonsten
    besteht die Gefahr eines Datenverlustes! Sowohl mount als auch umount können im
    Regelfall von root ausgeführt werden. Ausnahme: In der Datei /etc/fstab wird für
    Laufwerk die Option user angegeben.


    # Systembefehle


    # Information


    ```

    df [Option(en)] [Verzeichnis]

    ```


    Der Befehl (engl. disk free), wenn ohne Optionen aufgerufen, zeigt eine Statistik
    über den gesamten, die belegten und den verfügb Speicherplatz auf allen gemounteten
    Laufwerken an. Wird ein Verzeichnis angegeben, so wird das Laufwerk, auf dem sich
    dieses befindet, in der Statistik angezeigt.


    Optionen:


    +   - H zeigt die Anzahl der belegten Blöcke in Gigabyte, Megabyte oder Kilobyte
    an in „menschenlesbarer“ Form (engl. human readable).

    - t Typ des Laufwerks (ext2, nfs usw).


    ```

    du [Option(en)] [Pfad]

    ```


    Dieses Kommando ohne Parameter gibt den Gesamtspeicherplatzverbrauch aller im
    aktuellen Verzeichnis enthaltenen Dateien an; sind Unterverzeichnisse vorhanden,
    auch deren Gesamtgröße.'
