  md: '# Installation


    Einfacher geht''s kaum: Im Optimalfall reichen wenige Klicks aus und SuSE-Linux
    ist komplett auf Ihrem Rechner installiert. Wenn bisher noch kein Linux-System
    auf Ihrem Rechner installiert ist, wird Ihre Festplatte automatisch partitioniert,
    ein eventuell installiertes Windows-System (9x/ME) verkleinert, eine Auswahl an
    Software installiert und Ihre Hardware automatisch eingerichtet. Sind Sie mit
    den Vorschlägen des Installationsprogramms YÖST2 nicht zufrieden oder haben Sie
    spezielle Ansprüche an Ihr System? Kein Problem, denn Sie können natürlich jeden
    Vorschlag zur Installation manuell ändern.


    +   - Wichtige Tipps vorweg – unbedingt lesen! ... 16

    - Erster Schritt: Die Sprachauswahl ... 16

    - Zweiter Schritt: Vorschläge annehmen ... 16

    - Dritter Schritt: Installation ... 18

    - Abschluss: Die Konfiguration ... 18'
  merge: -1
