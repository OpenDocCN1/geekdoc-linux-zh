  md: '# Gutes Licht für gute Arbeit


    Im Allgemeinen erreicht die Arbeitsplatzbeleuchtung annähernd eine Leuchstärke,
    wie wir sie im Freien antreffen. Dieser Unterschied fällt dem Menschen nicht auf,
    da der menschliche Wahrnehmungsapparat flexibel ist. Der Einfluss der Lichtverhältnisse
    auf die eigene Leistungsfähigkeit wird oft unterschätzt. Wenn es zu hell ist,
    kann man es zu dunkel, sich die Bildschirmdarstellung nicht gut erkennen. Eine
    falsche Beleuchtung verursacht eine Überbeanspruchung des visuellen Systems und
    in letzter Konsequenz Merkbeschädigungen und Überlastungssymptome.


    Inzwischen geht man davon aus, dass eine Kombination von Allgemebeleuchung und
    individueller Arbeitsbeleuchtung optimal ist. Für den Arbeitsplatz zu ist die
    Kombination aus lichtstarken Deckenlicht (500 Watt) und im Fall mit einer oder
    zwei Arbeitsplatzlicht zu empfehlen. Die in Büros gängigen Leuchstoffröhren für
    die Allgemebeleuchtung sollten durch individuelle Arbeitsplätze ergänzt werden.
    Die Beleuchtung sollte aber nicht zu stark und individuell regelbar sein. Ho Kontraste
    sollten vermieden werden. Vorsicht also bei starken Einzelplatzlicht verhält sich
    auch so, dass eine gute Beleuchtung sehr teuer ist, und die Mindestanforderungen
    an die Beleuchtung mit billigeren Lichtanlagen erfüllt werden können.


    +   * Einmal sollte die Möglichkeit gegeben sein, das Tageslicht überhaupt wahrzunehmen.
    Eine Sicht nach außen ist wichtig.

    * Als angenehm wird beurteilt, wenn die Allgemebeleuchtungsstärke nicht über 250
    lx (gefordert werden mindestens 500 lx, für ein Großraumbüro 1 000 lx).

    * Die individuelle Arbeitsplatzlicht sollte den Arbeitsbereich mit 500 - 750 lx
    ausstrahlen. Lichtquellen sind allerdings oft problematisch weil bei entsprecher
    Stärke einen zu großen Leuchdichteunterschied zur Allgemebeleuchtung erzeugen.
    Harmonische fließende Übergänge werden als angenemer empfunden.

    * Die Beleuchtung soll auf allen Fall flimmer- und flackerfrei sein. (Bei allen
    hellschwachen Leuchstoffröhren manchmal im Augenwinkel ein Flackern bemerken.)

    * Dunkle Schatten sollten vermieden werden.

    * Deckenlicht schräg seitlich von oben ausstrahlen, die Leuchtbänder sollten versetzt
    zum Bildschirm angeordnet sein. Die Blickrichtung bei Bildschirmarbeit sollte
    parallel zum Leuchtband folgen.


    SuSE Linux - Basis


    153'
