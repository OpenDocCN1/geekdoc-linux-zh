    ```


    Ohne Optionen aufgerufen, liefert jedes Kommando eine Tabelle aller „eigenen“,
    also von einem selbst gestarteten, Programme bzw. Prozesse zurück. Achtung, bei
    den Optionen zu diesem Befehl sollte kein Mindestricht vorangestellt werden.


    Optionen:


    aus List detailliert alle Prozesse unabhängig vom Besitzer


    ```

    kill [Option(en)] Prozess-ID

    ```


    Manchmal kommt es vor, dass sich Programm nicht mehr auf beenden lässt. Normale
    Wege mit dem kill-Befehl lassen sich nahezu alle Prozess-„Leichen“ anhand Ihrer
    Prozess-ID (siehe top bzw. ps) „töten“


    SuSE Linux - Basis 143'
