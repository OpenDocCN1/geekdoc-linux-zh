  md: "# Scanner\n\nWenn Sie Ihren Scanner angeschlossen und eingeschaltet haben,\
    \ sollte beim Start dieses YaST2-Moduls Ihr Scanner automatisch erkannt werden.\
    \ In diesem Fall erscheint der Dialog zur Installation des Scanners. Falls kein\
    \ Scanner erkannt wird, geht es weiter mit der manuellen Konfiguration. Wenn Sie\
    \ bereits einen oder mehrere Scanner installiert haben sollten, erscheint zunächst\
    \ eine Übersichtstabelle mit einer Liste vorhandener Scanner, die bearbeitet oder\
    \ gelöscht werden können. \n\nMit ‚Hinzufügen‘ können Sie ein neues Gerät einrichten.\n\
    \nAls Nächstes wird eine Installation mit Standard-Einstellungen durchgeführt.\
    \ Wenn die Installation erfolgreich war, erscheint eine entsprechende Meldung.\n\
    \nHun haben Sie die Möglichkeit, Ihren Scanner zu testen, indem Sie eine Vorlage\
    \ laden und dann auf ‚Test‘ klicken.\n\n# Scanner wurde nicht erkannt\n\nBeachten\
    \ Sie, dass nicht unterstützte Scanner automatisch erkannt werden können. Scanner,\
    \ die an einer anderen Maschine im Netzwerk betrieben werden, werden nicht erkannt.\
    \ Unterscheiden Sie zur manuellen Konfiguration zwischen einem USB-, SCSI- oder\
    \ Netzwerkscanner.\n\n+   * USB-Scanner: Hier muss der Hersteller bzw. das Modell\
    \ eingegeben werden. YaST2 versucht, USB-Module nachzuladen. Falls Ihr Scanner\
    \ nicht ist, kann es sein, dass die Module nicht automatisch geladen werden können.\
    \ In diesem Fall gehen Sie weiter in einen Dialog, dem Sie die Möglichkeit haben,\
    \ das USB-Modul „per Hand“ nachzuladen. Lesen Sie hierzu den YaST2-Hilfetext lesen.\n\
    * SCSI-Scanner: Geben Sie das Device an (z. B. /dev/sg0). Hinweis: Ein SCSI-Scanner\
    \ darf nicht im laufenden System angeschlossen oder ausgestckt werden. Fahren\
    \ Sie das System zuerst neu her.\n* Netzwerk-Scanner: Hier benötigen Sie die IP-Adresse\
    \ bzw. den Hostnamen.\n\nBei einem Netzwerk-Scanner können Sie einen anderen Scanner\
    \ verwenden, der an einem Rechner in Ihrem Netzwerk angeschlossen und als Netzwerk-Scanner\
    \ eingerichtet ist. Lesen Sie zur Konfiguration eines Netzwerk-Scanners den Supportdatenbank-Artikel\
    \ „Scanner unter Linux“ (http://sdb.suse.de/), Stichwortsu „Scanner“. Bei der\
    \ Wahl des Netzwerk-Scanners ist in sich der öffnende Hostname oder die IP-Adresse\
    \ des Rechners, an dem der Scanner angeschlossen ist, einzutragen."
