    sollten Sie so belassen, es sei denn, Ihr Rechner bzw. Server ist öffentlich zugänglich
    und Sie befürchten, dass jemand unerlaubt Aktion durchführen könnte.

    Wenn Sie ‘Stop‘ auswählen, bewirkt diese Tastenkombination ein Herunterfahren
    des Systems, bei ‚Ignorieren‘ bleibt diese Tastenkombination wirkungslos. Zweitens:
    Darf das System vom KDM (KDE-Display-Manager – das grafische Login) aus herunterfahren?
    ‘Nur Root’ (also der Systemadministrator), ‘Alle Nutzer’, ‘Nobody’ oder ‘Lokale
    Benutzer’? Wenn Sie ‘Nobody‘ auswählen, dann kann das System nur noch von der
    Textkonsole aus herunterfahren werden.'
