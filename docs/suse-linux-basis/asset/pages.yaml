- img_proc: true
  md: '# Wichtige Tipps vorweg – unbedingt lesen!


    Partitionen mit NT-Dateisystemen von Microsoft können bisher, da Microsoft die
    Spezifikationen dieser Dateisystem nicht offen gelegt hat, noch nicht von Linux
    verkleinert. Betroffen sind Windows NT, 2000 und XP, wenn Sie ein NTFS-Dateisystem
    verwenden. Bei vorkonfigurierten Rechner ist das der Fall.


    Wenn Sie einen Computer haben, auf dem eines dieser Systeme auf einer einzigen
    Partition installiert ist, wird beim Installieren von SuSE Linux das System unwiederbringlich
    gelöscht. Die ganze Festplatte wird von Linux formiert. In diesem Fall benötigen
    Sie Ihre Windows-Installationssoftware, um im Bedarf Ihr System wieder zu installieren.
    Wenn Ihr Windows mit dem Dateisystem NTFS vorinstalliert ist, aber Sie die Installations-CDs
    dabei besitzen, können Sie XP neu installieren und dabei „FAT32“ als Datesystem
    für XP wählen. Damit wird die Festplatte mit dem FAT-Dateisystem formiert, und
    dieses kann der Linux-Installation ohne Probleme verkleinert werden.


    Sollten Sie in Ihrem jedoch noch eine Partition haben (außer Laufwerk C: noch
    weitere Festplattenlaufwerke), kann SuSE Linux theoretisch problemlos auf einer
    der zusätzlichen Partitionen installieren. Wenn sich Daten auf der Partition befinden,
    auf die Sie Linux installieren wollen, sollten Sie diese allerdings vorher auf
    einer anderen Partition sichern.


    # Erster Schritt: Die Sprachauswahl


    Schalten Sie Ihren Rechner ein und legen Sie die CD 1 oder die DVD in das entsprechende
    Laufwerk. Als Erst erhalten Sie die Möglichkeit, die Sprache für Ihr aus auswählen.
    Die Spracheinstellung, die Sie wählen, wird automatisch für Ihr Tastaturlayout
    übernommen.


    # Zweiter Schritt: Vorschläge annehmen


    Linux überprüft jetzt als erstes Ihr System. Falls Sie schon ein Linux-Betriebssystem
    auf Ihrem Rechner installiert haben, werden Sie im nächsten Fenster gefragt, ob
    Sie SuSE Linux komplett neu installieren wollen, ein Update Ihres bisherigen Systems
    möchten oder ob Sie das auf Ihrer Festplatte befindliche System booten wollen.'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'Wenn bis bisher kein Linux auf Ihrem Computer installiert ist oder Sie ''Neuinstallation''
    gewählt haben, überprüft SuSE Linux jetzt Ihre komplette Hardware und listet das
    Ergebnis im Anschluss im so genannten ''Vorschlagsfenster'' auf (siehe Abb. 2.1
    auf der nächsten Seite). Sie sehen in diesem Fenster zusätzlich die Partitionierungsvorschläge
    (ggf. Windows-Verkleinerung) und die Installationsoptionen (Neuinstallation).
    Wenn Sie zum ersten Mal Linux installieren, sollten Sie diese Vorschläge annehmen
    – sie sind in der Regel sinnvoll gewählt. Folgende Meldungen und Vorschläge erscheinen
    nach dem Systemcheck:


    **Installationsmodus** ist hier "Neuinstallation" der Standardwert.


    **Tasturlayout** Das Tasturlayout wird nach der Sprache ausgewählt, die man im
    ersten Schritt angeibt.


    **Maus** der erkannte Mausertyp wird angegeben.


    **Partitionierungsvorschlag** hier wird eine sinnvolle Partitionierung vorgeschlagen.
    Falls sich Windows 9/ME auf der Platte befindet, wird angegeben, wie stark diese
    verkleinert wird.


    **Softwareauswahl** Ein Standardsystem mit Office-Paket ist hier vingestellt.


    **Boot Loader** Hier ist eingestellt, wo SuSE Linux den Bootmanager LILO installiert.
    Hier ist der Master Boot Record (MBR).


    **Zeiteinstellungen** Hier wird nach der Sprache eine Zeitzone des jeweiligen
    Landes eingestellt. Diese Einstellung muss natürlich häufig manuell geändert werden,
    da viele Sprachen in verschiedenen Ländern gesprochen werden und SuSE Linux ja
    (bisher noch) nicht erraten kann, in welchem Land Sie wohnen.


    Sie können jederzeit durch Klick auf die jeweiligen Parameter die von YoST gemachten
    Vorschläge ändern. Bei richtiger Hardware ist eine Änderung natürlich nicht sehr
    sinnvoll. Haben Sie einen Parameter geändert, können Sie jedes Mal wieder zur
    Auswahl zurück und können mit einem Klick auf ''Weiter'' die Installation mit
    den geänderten Werten fortsetzen.


    +   **Achtung**

    Falls Sie Änderungen an Bootloader-, Partitionier- oder Hardwareeinstellingen
    vornehmen, sollten Sie genau wissen, was Sie tun.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '![](img/7c7b5e54e6579952ad3fd8bde9e1a136_27_0.png)


    Abbildung 2.1: „Vorschlagsfenster“ Erkannte Hardward, Installations- und Partitionierungsvorschläge


    # Dritter Schritt: Installation


    Nun ist es so weit: wenn Sie im grünen Fenster ‚Ja‘ wählen, geht es los mit der
    Installation. Je nach Computerleistung haben Sie in ca. 15 Minuten ein fertig
    installiertes System mit einer Auswahl von ca. 350 Programmpeten. Während der
    Installation sehen sich Informationen zu einigen weiteren SuSE-Produkten. Sie
    können auch ‚Details‘ anklicken, um sich genauer über den Fortschritt der Installation
    zu informieren.


    # Abschluss: Die Konfiguration


    Nach Beendigung der Installation müssen Sie noch drei wichtige Einstellungen vornehmen,
    bevor Sie endgültig mit SuSE Linux arbeiten können: Zuerst müssen Sie für den
    Systemadministrator (normalerweise Sie!) – den genannten User „Root“ oder „Superuser“
    – ein Passwort festlegen.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '> Achtung

    Merken Sie sich unbedingt das Root-Passwort, da Sie nur als root Änderungen am
    System vornehmen oder Programme installieren können. Um nicht bei falschen Einstellungen
    Ihren Bildschirm zu beschädigen, achten Sie bitte auf die Spezifikationen Ihres
    Bildschirms und Ihrer Grafikkarte.


    Achtung


    Danach müssen Sie einen Benutzer anlegen und schließlich wird Ihnen der Bildschirm
    und die Grafikkarte angezeigt. Bei Bedarf können Sie die Grafikauflösung oder
    die Farbtiefe ändern. Nach dem folgenden Test der Grafikeinstellungen erhalten
