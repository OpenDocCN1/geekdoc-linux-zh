  md: '# System


    Das Menü behaltet Module, mit denen Sie das Systemverhalten einstellen.


    > Achtung

    Da die Einstellungen in den Modulen ‘Anmeldungsmanager‘ und ‘Datum & Zeit‘ für
    das gesamte System gelten, können Sie hier nur als root Änderungen vornehmen.


    Achtung


    Anmeldungsmanager – Mit diesem Modul können Sie den grafischen Anmeldevorgang
    von KDE einrichten. Verändern Sie das Aussehen des Begrüßungsbildschirms und stellen
    Sie u. a. Zug zum Anmeldungsmanager ein oder diesen herunter.


    Unter dem Reiter ‘Erscheinungsbild‘ stellen Sie das Aussehen des Anmeldebildschirms
    mit Begrüßungstext und Logo, den Stil der Sprache (dies ist unabhängig von der
    benutzerdefinierten Einstellung) oder definieren Sie eine zentrale oder genau
    zu bestimmende Position des Anmeldungsmanagers.


    Schriftart lässt Sie die Schriften wählen, welche der Anmeldungsmanager für die
    Begrüßungen und Benutzernamen verwenden soll.


    Möchten Sie für Ihren Anmeldebildschirm ein spezielles Hintergrundbild oder eine
    Farbabberung, so können Sie die Einstellungen dazu unter dem Reiter ‘Hintergrund‘
    vornehmen.


    Unter ‘Sitzungen‘ entscheiden Sie, welche Sitzungstypen Sie ‘KDE‘ oder ‘failsafe‘
    Ihnen im Anmeldungsmanager angezeigt werden sollen, von dem man und wo aus ein
    ‚Herunterfahren‘ des Rechners erlaubt sein wird. Des Weiteren können Sie bestimmen,
    welche Befehle bei „Halt“ oder „Neustart“ ausgeführt werden sollen.


    Der Reiter ‘Benutzer‘ stellt ein, welche der verfügbaren Benutzer vom Anmeldungsmanager
    angezeigt werden sollen.


    ‘Vereinfachung‘ legt unter anderem fest, dass Benutzer sich ggf. automatisch anmelden
    können.


    > Achtung

    Das Speichern von Passwörtern stellt ein Sicherheitsrisiko dar, vermeiden Sie
    daher diese Art von ‚Vereinfachung‘.


    Achtung


    Datum & Zeit – Legen Sie Systemdatum und -zeit sowie deren Zeitzone fest.'
