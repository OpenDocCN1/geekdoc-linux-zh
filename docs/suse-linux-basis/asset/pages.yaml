    # Weitere Informationen


    Details zum Drucken unter Linux und spezielle Problembehebungen finden Sie im
    „Referenz“-Handbuch, das auf Ihrem SuSE Linux 8.0 installiert ist, im Kapitel
    7 Druckerbetrieb. Betrachten Sie das Buch Seiten in Ihrer SuSE-Hilfe (der Rettungsole
    auf Ihrem KDE-Desktop) und klicken dort auf das Buch Ihre Referenz. Alternativ
    können Sie auch in Ihrem Browser das Verzeichnis \un/usr/share/doc/packages/suselinux-reference_de
    laden und die PDF-Dateien öffnen.


    Ausgangspunkt für Ihre Einrichtung bei Problemen ist der Supportdatenbank-Artikel
    „Drucker einrichten“, den Sie unter dem Stichwort „einrichten“ ohne online


    ```

    http://sdb.suse/sdb/de/html/jsmeix_print-einrichten.html\ erhalten.

    ```


    # Soundkarte


    YaST2 versucht beim Aufruf des Sound-Konfigurationstools Ihre Soundkarte automatisch
    zu erkennen. Sie können eine oder mehrere Soundkarten einrichten. Falls man mehrere
    Soundkarten verwenden möchte, wählen meist eine der zu konfigurierenden Karten
    aus. Mit dem Button ‚Konfigurieren‘ gelangen Sie unter Men Setup. Bereits konfigurierte
    Soundkarten unter ‚Soundkonfiguration‘ editieren. ‚Beenden‘ speichert die momentanen
    Einstellungen und schließt die Soundkonfiguration ab. Sollte YaST2 Ihre Soundkarte
    nicht automatisch erkennen, kann man über das Menü ‚Soundkonfiguration‘ mit dem
    Button ‚Soundkarte hinzufügen‘ zur ‚Manuellen Auswahl der Soundkarten‘ gelangen.
    In diesem ist es möglich, eine Soundkarte und das zugeige Modul selbst auszuwählen.'
