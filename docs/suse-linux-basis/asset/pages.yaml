    sich nicht oder alle senden lassen, könnte es zu B. B daran liegen, dass die automatische
    Erkennung des Tunertypes nicht gelang oder Sie einen falschen Tunertyp ausgewählt
    haben.


    Hier ‚Details‘ finden Sie die Expertenkonfiguration. Hier können speziell das
    Kernelmodul, als Treiber der TV-Karte läuft, und diesen Parameter auswählen. Auch
