- img_proc: true
  md: 'mcd a: a - wird Ihr aktuelles Verzeichnis.


    mmd a:test - erzeugt das Unterverzeichnis test auf der Diskette.


    mrd a:test - löscht das Unterverzeichnis test auf der Diskette.


    # Aufräumen


    Sie haben in diesem Crash-Kurs die wichtigsten Grundlagen im Umgang mit der Shell
    gelernt. Damit Ihr Heimat-Verzeichnis nicht zu unübersichtlich wird, sollten Sie
    die Dateien und -verzeichnisse nicht mit den Befehlen rm und rmdir wieder löschen.

    Im Anschluss dieses Kapitel finden Sie eine Liste mit den wichtigsten Befehlen
    und entsprender Kurzbesch.


    # Benutzerrechte


    Linux wurde von Anfang an als Multiuser-System konzipiert, also für die gleichzeitige
    Nutzung durch mehrere Anwender. Daraus ergeben sich einige wichtige Unterschiede
    zu Microsoftssystem Windows.

    Das wohlste Unterscheidungsmerkmal ist der Zwang, sich zu Beginn einer Arbeitssitz
    am System anzumelden. Dazu wird der Benutzer über einen eigenen „Benutzernamen“
    mit zugehörigen Passwort gewähristet, dass Unbefugte keinen Einblick in für sie
    gesperrte Inhalte erhalten können. größere Veränderungen am System, z. B. die
    Installation von Programmen, sind einem Benutzer in der Regel nicht oder nur beschränkt
    möglich. Nur root, der Administrator, verfügt über praktisch unbegrenzten Zugriff
    auf alle Dateien. Dieses Konzept unsichtig und nutzt sich nur bei Bedarf der „Allinin“
    als root einloggt, wird die Gefahr unbeabsichtigter Datenverluste stark eingrenzt:
    Da im Normalfall nur der Administrator Systemdateien löschen oder Festplatten
    formatieren kann, wird die Bedrohung durch Trojanische Pferde oder wesentlich
    eingegebene destrukt Befehle stark eingeschränkt werden.


    # Rechte im Dateisystem


    Gruätzlich gehört jede Datei im Linux-Dateisystem einem Benutzer und einer Gruppe.
    Jeder dieser beiden Seitenparteien, auch „Fremden“, können vom Besitzer Schreib-,
    Lese- sowie Ausführrechte zugewiesen werden.'
  merge: -1
  pgno: 140
- img_proc: true
  md: 'Als Gruppe werden Zusammenschlüsse von Benutzern mit bestimmten kollektiven
    Rechten bezeichnet. So ist eine solche Gruppe eine einem bestimmten Projekt arbeitende
    Arbeitsgruppe, nennen wir sie projekt3. Jeder Benutzer unter Linux ist Mitglied
    in mindestens einer Verwaltungseinheit, standardmäßig wird nur users eingetragen.
    Wir können nahezu beliebig Gruppen anlegen, allerdings ist nur root dazu. Jeder
    Benutzer kann mit dem Befehl herausfinden, in welcher Gruppe er Mitglied ist.


    # Rechte auf Dateien


    Betrachten wir die Rechtestruktur im Dateisystem genauer und beginnen mit den
    Dateien. Die Ausgabe von ls -l kann beispiweise so aussehen:


    ```

    -rw-r----- 1 tux projekt3 14197 Jun 21 15:03 Roadmap

    ```


    > Ausgabe 1: Beispielausgabe der Zugriffsrechte von Dateien


    Wie Sie anhand der dritten Spalte erkennen, gehört diese Datei dem Benutzer tux,
    als Gruppe projekt3 zugeordnet. Der Recht auf die Datei sehen zu können, betrachten
    wir die erste Spalte genauer.


    | Typ | Benutzer | Gruppen | Rechte für andere Benutzer |

    |---|---|---|---||

    | - | rw- | r-- | r-- |


    Die Spalte gliedert sich in ein führendes sowie neun in Detailgruppen aufgeteilte
    Zeichen. Der erste der Zeichen steht für den Typ des gelisteten Dateisystembestandes.
    Der Bindstrich zeigt, dass es sich um eine Datei handelt. Er könnte genauso aus
    wie ein Verzeichnis (d), ein Querverweis (l), ein Block (b) bzw. Charakter-Gerät
    (c) stehen.

    Die folgenden zwei Blöcke folgen einem einlichen Schema: Das sind jeweils zwei
    Zeichen an, ob die jeweilige Fraktion Leszugriff auf die Datei verfügt (r) oder
    nicht (-). Ein w in der mittleren Einheit symbolisiert, Schreibzugriff auf das
    jeweilige Objekt erlaubt, steht dort ein Bindstrich (-), so ist dies nicht möglich.
    Darüber hinaus könnte in der rechten Spalte ein x dargestellt sein, welches für
    einen Ausführungszugriff stünde. Da es sich um ein Beispiel für einen Text-, also
    nicht um eine ausführbare Datei handelt, kann auf diese exsekutiven Rechte verzichtet
    werden.'
  merge: -1
  pgno: 141
- img_proc: true
  md: 'In unserem Beispiel hat auch tux als Besitzer der Datei Roadmap sowohl Lesezugriff
    (r) als auch Schreibzugriff (w), kann sie aber nicht ausführen (kein x). Die Mitglieder
    der Gruppe projekt3 können die Datei nur lesen, aber verändern oder ausführen.
    Andere Benutzer haben keinen Zugriff auf diese. Benutzer kann mit dieser Sicherheitseinstellung
    dafür sorgen, dass nur autorisierte Personen (die Arbeitsgruppenmitglieder) die
    Datei lesen können und nur sie verändern können.


    # Rechte auf Verzeichnisse


    Wenden wir uns den Zugiffsrechte für Verzeichnisse zu, zu der Typ ist. Hier haben
    die einzelnen Rechte eine etwas andere Bedeutung. Ein kleines Beispiel zur Verdeutlichung:


    ```

    drwrxrwx-x   1 tux projekt3   35 Jun 21 15:15 Projektdaten

    ```


    **Ausgabe: 2:** Beispielaus der Zugiffsrechte auf Verzeichnisse


    Auch hier sind Besitzer (tux) und Benutzergruppe (projekt3) des Verzeichnisses
    Projektdaten leicht zu erkennen. Im Gegensatz zu den Datenrechten Recht im Dateisystem
    aus dem vorherigen Jahr bedeutet das gesetzte Lesrecht (r) jedoch, dass der Inhalt
    des Verzeichnisses angezeigt werden kann. Das Schreibrecht (w) steht darüber hinaus
    für die Berechtigung, neue Dateien anzulegen zu dürfen, das Exekutivrecht (x)
    erlaubt neben dem Benutzer auch die Mitglieder der Gruppe projekt3 im Verzeichnis
    Projektdaten wechseln (x), den Inhalt anzeigen (r) und Dateien anlegen dürfen
    (w). Alle übrigen Benutzer mit weniger Rechten ausgestattet, dürfen in das Verzeichnis
    wechseln (x) bzw. durchstöbern (r), jedoch keine Dateien ablegen (w) nicht gesetzt.


    # Dateberechtigungen anpassen


    # Ändern von Zugiffsrechte


    Die Zugiffsrechte einer Datei eines Verzeichnisses können vom Besitzer (und natürlich
    von root) mit dem Befehl chmod verändert werden, der zusammen mit Parametern für
    die zu ändernden Zugiffsrechte sowie die Namen der Datei eingegeben wird.


    Die beiden Parameter setzen sich zusammen


    +   1. den betroffenen Kategorien


    +   * u (english) - der Besitzer der Datei'
  merge: -1
  pgno: 142
- img_proc: true
  md: '+   * g (engl. group) – die Gruppe des Besitzers

    * o (engl. others) – sonstige Benutzer (wird kein Parameter angegeben, gelten
    die Änderungen für alle Kategorien)


    2. einem Zeichen für Entzug (-), Gleichsetzung (=) bzw. Hinzufügen (+)


    +   3. den bereits bekannten Abkürzungen für

    * r (engl. read) – lesen

    * w (engl. write) – schreiben

    * x (engl. execute) – ausführen


    sowie, durch Leerzeichen getrennt, für den bzw. den Namen der betroffenen Datei(en).


    Möchte nun z. B. der Benutzer tux in Beispiel 2 auf der vorherigen Seite anderen
    Benutzern den Schreibzugriff (w) auf das Verzeichnis Projektdaten gewähren, kann
    er dies den folgenden Befehl bewirken:


    ```

    tuxerde: > chmod+w Projektdaten

    ```


    Will er jedoch auch sich selbst das Schreibrecht entziehen, nimmt er das Kommando:


    ```

    tuxerde: > chmod go-w Projektdaten

    ```


    Um allen Benutzern das Anlegen einer Datei im Verzeichnis Projektdaten zu verbieten,
    schreibt man:


    ```

    tuxerde: > chmod -w Projektdaten

    ```


    Nun kann nicht einmal der Besitzer auf seine Datei schreiben, ohne das Schreibrecht
    vorher wiederherzustellen.


    # Ändern von Eigentumsrechts


    Weitere Kommandos, die die Eigentumsverhältnisse der Dateisystembestandsteile
    regeln, sind chown (Change Owner) und chgrp (Change Group). Der Befehl chown dient
    dazu, einen Besitzer angegebenen Benutzer zu ändern. Allerdings darf nur root
    diese Änderung vornehmen.


    Angenommen, die Datei Roadmap aus Beispiel 2 der vorherigen Seite soll nicht mehr
    tux, sondern dem Benutzer geekohören, so lautet der entsprechende Befehl – als
    root eingegeben:


    ```

    erde: # chown geeko Roadmap

    ```'
  merge: -1
