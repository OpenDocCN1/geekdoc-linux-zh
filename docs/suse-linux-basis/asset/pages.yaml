  md: '+   Zugluft (z. B. durch offene Fenster und Türen oder durch die Klimaanlage)
    sollte nicht über 0,1 bis 0,15 m/s liegen. Ein Zug auf einzelne Körperteile sollte
    vermieden werden.


    +   Eine Klimaanlage sollte individuell einstellbar sein. Es ist auf regelmäßige
    Wartung zu achten.


    +   Die Fenster sollten sich öffnen und Sonnenschutzeinrichtungen gegen Blendeneinwirkungen
    besitzen. Sonnlich kann die Raumtemperatur aufheizen. Auf äußende Sonnenschutzeinrichtungen
    geben den besten Schutz.


    +   Pflanzen können das Raumklima verbessern, sie sind daher von jedem Fall zu
    empfehlen. Sie erhöhen die relative Luftfeuchtigkeit und filtern Schadstoffe aus
    der Luft.


    # Zu viel Lärm macht Stress


    Lärm ist ein körperlicher Stressor, der psychischen Stress auslöst. Auch wenn
    er vermehrt wird, wird Lärm macht krank. Neben gesundheitlichen Beeinträchtigungen
    wie Schwerhörigkeit, vegetativen Störungen und psychischen Veränderungen beeinträchtigt
    Lärm über die Konzentrationsfähigkeit unserer Leistungsvermögens. Problematisch
    ist jedoch, dass eine Unzufriedenheit die Lärmbekämpfung unter Umständen sehr
    viel Geld kostet.


    Eine ruhige Arbeitsplatzumgebung för die Leistungsfähigkeit. Gerade Bildschirmarbeitsplätze
    zeichnen sich oft durch eine sogenannte „geistige Tätigkeit“ aus. Deswegen ist
    sich in den Normen z. B. für wissenschaftliche Tätigkeit oder Programmieren der
    maximale Schalldpegel mit 55 dB(A) angegeben. Der dB(A) stellen eine gewichtete
    Bewertung des Schalldrucks dar. Die soannte Filterkurve kommt der menschlichen
    Wahrnehmung am nächsten. Eine Erhöhung des Schalldruckpegels um 10 dB(A) empfindet
    man in der Regel als Verdopplung der Lautstärke.


    +   Da an Bildschirmarbeitsplätzen überwiegend geistisch gearbeitet wird, sollten
    von vornhere Arbeitsmittel eingesetzt werden.


    +   Der Grenzwert für Büroarbeit liegt maximal bei 55 dB(A). Bei besonders hohen
    geistigen Ansprüchen oder nötiger sprachlicher Verständung werden sogar 35 - 45
    dB(A) gefordert. Dies ist z. B. bei derbeitung, bei wissenschaftlicher Arbeit
    oder beim Programmieren der Fall.'
