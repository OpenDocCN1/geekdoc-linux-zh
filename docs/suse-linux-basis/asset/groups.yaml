    # Online-Update


    Das YaST-Online-Update ermöglicht die Installation von wichtigen Upgrades bzw.
    auf dem SuSE-FTP-Server werden die entsprechenden „Patches“ zum Herunterladen
    beigefü. Die Installation der aktuellen Pakete kann vollautomatisch erfolgen.
    Mit „Manuelles Update“ haben Sie jedoch die Möglichkeit, selbst zu bestimmen,
    welche Patches in Ihr SuSE Linux System eingespielt werden.


    Nach einem Klick auf ‚Details‘ erhalten Sie Informationen über Ihr letztes Update
    und über die bereitliegenden Pakete. Details erfahren Sie nach Klick auf ‚Patch-Informationen
    anzeigen‘ Mit ‚Weiter‘ gelangen Sie zur Liste aller verfügbaren Patches (falls
    „Manuelles Update“ gewählt wurde), aus der Sie Ihre Auswahl treffen. Mit ‚Übernehmen‘
    oder Doppelklick aktivieren Sie die einzelnen Teile. Mit ‚Weiter‘ ‚Beenden‘ führen
    Sie das Online-Update zum Abschluss.


    # Online-Update von der Konsole


    ```

    erde:/root # yast2 online_update .auto.get

    ```


    # 6

    YaST2 - Konfigurationen


    ```

    ./../images/png/yast2_inst_medium.png

    ```


    **Abbildung 6.15:** *YaST2: Installationsquelle wechseln*


    die aktuelle Patchliste und alle zutreffenden rpms vom ersten Server in der Liste
    /etc/suseserver. Wenn Sie bestimmte Patches laden wollen, können Sie dem Aufruf
    zusätzlich Optionen mitgeben.


    Mögliche Optionen sind security, recommended, document, YaST2 und optional. security
    hot nur sicherheitsrelevante Patches, recommended hot die von SuSE empfohlenen
    Updates, document liefert Ihnen Mitteilungen zu den Patches vom FTP-Server, YaST2
    liefert nur YaST2-Patches und optional liefert Updates von untergeordneter Wichtigkeit.


    Die Mitteilungen zu den Patches werden in /var/lib/YaST/patches/i386/update/X.Y/patches
    gespeichert. Sie können sie nur auslesen. X.Y ist die jeweilige Version von SuSE
    Linux.


    Der Aufruf nach Download der Security-Patches lautet:


    ```

    erde:/root # yast2_online_update .auto.get security

    ```


    Jedes Mal, wenn Sie .auto aufrufen, wird normalerweise die Liste der FTP-Server
    nach /etc/suseserver geladen. Wenn Sie das abschalten wollen, müssen Sie die Funktion
    in der Datei /etc/rc.config deaktivieren. Dazu setzen Sie in der Zeile


    ```

    erde:/root # YAST2_LOADFTPSERVER="yes"

    ```


    yes auf no.


    Installieren können Sie die Patches nun mit


    SuSE Linux - Basis 11


    ```

    erde:/root # yast2 online_update .auto.install

    ```


    Dieser Aufruf installiert alle geholten Patches. Falls Sie eine Gruppe installieren,
    können Sie die gleichen Optionen verwenden bei .auto.get. Diese Methode hat den
    Vorteil, dass sie sich automatisieren lässt. Der Systemadministrator hat die Möglichkeit,
    die Pakete z. B. über Nacht herunterzuladen und morgens, die er benötigt, zu installieren.


    # Update des Systems


    Dieses Modul ermöglicht es, Ihr System auf den aktuellen Stand zu bringen. Es
    werden mehrere Arbeitsschritte aufgerufen und YaST2 wird ermitteln, welche Pakete
    zu erneuern sind. Falls gewünscht, können Sie für jedes Paket einzel entscheiden,
    ob ein Update erfolgen soll. Das Basissystem kann dann allerdings nicht neu werden,
    dazu muss vom Installationsmedium, z. B. von CD, gebootet werden. Beachten Sie
    bitte, dass ein Update umso problematischer wird, je älter die zugrundegende Version
    ist, die aktualisiert werden soll und/oder die Konfiguration der Pakete, die aktualisiert
    werden sollen, vom Standard abweicht. Bestweilen kann die Konfiguration unter
    Umständen nicht korrekt übernommen werden; dann sollte eine komplett neue Konfiguration
    erstellt werden. Eine bestehende Konfiguration sollte außerdem vor dem Update
    gesichert werden.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_125_0.png)


    Abbildung 6.16: YaST2: Update des Systems


    # Sonstiges


    # Backup


    Mit dem neuen Backup-Modul haben Sie zum ersten Mal die Möglichkeit, mit YaST2
    Backups Ihres Systems durchzuführen. Das Modul führt keine vollständigen Backups
    durch, sondern sichert nur Informationen über geänderte Pakete, systemkritische
    Bereiche und Konfigurationsdateien.


    Bei der Konfiguration können Sie bestimmen, welche Dateien gesichert werden sollen.
    Standardmäßig werden Informationen gespeichert, welche Pakete seit der letzten
    Installation geändert wurden. Zusätzlich können Sie Dateien speichern, welche
    Konfigurationsdateien in Ihrem `/etc/` oder Ihrem home-Verzeichnis gehören. Außerdem
    können weitere Systembereiche auf der Festplatte durch Partitionierungstabelle
    dem MBR hinzugefügt werden, die dann bei einer nötigen Restaurierung benutzt werden
    können.


    # Boot-Modus


    Der Boot-Modus wird normalerweise während der Installation festgelegt. Wenn Ihr
    SuSE Linux bootet, brauchen Sie hier nachräglich nichts zu ändern, es sei denn,
    Sie haben bisher von Diskette gebootet und möchten von der Festplatte starten.


    > Hinweis

    > Ändern des Boot-Modus im laufenden System ist nur für Experten zu empfehlen.
    Lesen Sie bei Bedarf im Referenz-Handbuch den Abschnitt LILO-Installation. Informationen
    über das Referenz-Handbuch finden Sie im Vorwort.


    # Erstellen einer Boot-, Rettungs- oder Moduldiskette


    Mit dem YaST2-Modul (unter ‘System‘ zu finden) können Sie sich auf sehr verschiedene
    Art und Weise zweierlei unterschiedliche Bootdisketten, eine Rettungsdiskette
    und zweierlei verschiedene Moduldisketten erstellen. Die beiden Bootdisketten
    können bei Neueinstallation, falls Sie z. B. Probleme beim Booten von CD haben.
    Die Disketten sind eigentlich nicht für das Booten eines installierten Systems
    gedacht, mit einem kleinen Trick (siehe letzten Abschnitt) können Sie sie trotzdem
    dafür verwenden.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_127_0.png)


    # Abbildung 6.17: YaST2: Eine Boot-/Moduldiskette erstellen


    - **Bootdisketten erstellen:**

    Bei der Standard-Bootdiskette handelt es sich um diejenige, die Sie auch bei der
    Installation finden.

    - **Rettungsdiskette erstellen:**

    Schließlich gibt es noch die Rettungsdiskette, mit deren Hilfe Sie Zugriff auf
    System erhalten.

    - **Moddisketten erstellen:**

    Wenn Sie zur Installation zusätzliche Module benötigen, erstellen Sie diese Disketten.


    Die oben genannten Disketten sind nicht zu wechselnn mit den Disketten, die ein
    installiertes System starten.


    # Zeitzone und Sprache auswählen


    # Zeitzone auswählen


    Unter ''System'' finden Sie im YaST2 Control Center den Button ''Zeitzone auswählen''.
    Die Zeitzone legen Sie während der Installation fest – hier haben Sie die Möglichkeit,
    eine nachträliche Änderung vorzunehmen. Klicken Sie in der Länder-Liste einfach
    auf Ihr Land und wählen Sie ''Ortszeit'' oder ''GMT'' (engl. Greenwich Mean Time).
    Bei jedem Linux-System ist es üblich, ''GMT'' zu verwenden. Rechner mit weiteren
    Betriebssystemen wie z. B. Microsoft Windows verwenden die Ortszeit.


    # Sprache auswählen


    Unter ''System'' finden Sie im YaST2 Control Center den Button ''Choose Language''.
    Hier können Sie die Sprache für Ihr Linux-System einstellen, wenn nicht während
    der Installation geschehen. Die Sprache lässt sich hier auch nachträglich ändern.


    Die mit YaST2 vorgenommene Spracheseinstellung erstreckt sich systemweit – also
    auch für YaST2, YaST und den Desktop KDE 2.


    # Treiber-CD des Herstellers laden


    Mit diesem Modul können Sie Gerätetreiber von einer Linux-Treiber-CD, der Treiber
    für SuSE Linux enthält, automatisch installieren.


    Falls eine Neuinstallation Ihrer SuSE nötig sein sollte, können Sie nach der Installation
    mit Hilfe dieses YaST2-Moduls die notwendigen Treiber von der Hersteller-CD nachladen.

