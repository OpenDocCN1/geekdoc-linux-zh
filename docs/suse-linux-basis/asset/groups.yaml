- md: "\n![](img/7c7b5e54e6579952ad3fd8bde9e1a136_0_0.png)\n\n# SuSE Linux\n\n BASIS\n\
    \n# 1. Auflage 2002\n\nCopyright ©\nDieses Werk ist geistiges Eigentum der SuSE\
    \ Linux AG.\nEs darf als Ganzes oder in Auszügen kopiert werden, vorausgesetzt,\
    \ dass sich dieser\nCopyrightvermerk auf jeder Seite befindet.\n\nAlle in diesem\
    \ Buch enthaltenen Informationen wurden mit größter Sorgfalt zusammengestellt.\
    \ Jeden können fehlerhafte Angaben nicht völlig ausgeschlossen werden.\nSuSE Linux\
    \ AG, die Autoren und die Übersetzer haften nicht für eventuelle Fehler und deren\
    \ Folgen.\n\nDie in diesem Buch verwendeten Soft- und Hardwarebezeichnungen sind\
    \ in vielen Fällen eingetragene werden ohne Gewährleistung der freien verwendbarkeit\
    \ benutzt. Die SuSE Linux AG richtet sich im Wesentlichen nach den Schreibweisen\
    \ der Hersteller. Die Wiedergabe von Waren- und Handelsnamen usw. in diesem Buch\
    \ (auch ohne besondere Kennzeichnung) berechtigt nicht zur Annahme, dass solche\
    \ Namen (im Sinne der Warenzeichen und Markenschutz-Gesetzgebung) als frei zu\
    \ betrachten sind.\n\nHinweise und Kommentare richten sich ggf. an documentation@suse.de\n\
    \nAutoren: Jörg Dippel, Stefan Dirsch, Matthias Eckermann, Carsten Fischer, Klaas\
    \ Freitag,\nGerd Knorr, Holger Herterich, Johannes Meixner, Siegfried Olschner,\
    \ Marcus Schäfer,\nJesko Schneider, Arvin Schnell, Adrian Schröter, Gabriele Stratner\n\
    Redaktion: Antje Faber, Dennis Geider, Roland Haidl, Jana Jaeger, Edith Parzfall,\n\
    Peter Reinhart, Marc Rührschneck, Thomas Schreitle, Martin Sommer, Rebecca Walter\n\
    Layout: Manuela Piotrowski, Thomas Schreitle\nSatz: LaTeX\n\nDieses Buch ist auf\
    \ 100% chlorfrei gebleichtem Papier gedruckt.\n\n# Willkommen\n\nHerzlichen Glückwunsch,\
    \ dass Sie sich für SuSE Linux entschieden haben! Unsere Distribution ist nun\
    \ einfacher zu installieren als je zuvor. Mit nur wenigen Klicks bereiten Sie\
    \ die Installation vor, und nach etwa 15–20 Minuten ist das System installiert.\
    \ Richten Sie dann noch Benutzer mit Passwort ein und legen Sie die Bildschirmauflösung\
    \ fest. Schon können Sie mit SuSE Linux arbeiten. Auch die Konfiguration von SuSE\
    \ Linux wurde weiter vereinfacht, wobei weiterhin die unterschiedlichen Program-Pakete\
    \ an Ihren Wünschen angepasst und optimiert werden können.\n\nDieses Buch und\
    \ die darin beschriebene Software entbinden den durchschnittlichen Benutzer von\
    \ der Notwendigkeit, irgendchen Linux-Freak zu leihen, zu mieten, anzuwerben oder\
    \ zu stehlen, um Linux überhaupt erst installieren oder damit arbeiten zu können.\
    \ SuSE Linux ist kraftvoll für den Freak, aber auch für den normalen Benutzer\
    \ gleichermaßen intuitiv und einfach zu bedienen.\n\nNach einer leicht verständlichen\
    \ Einführung lernen Sie die grafische Oberfläche KDE besser kennen und erhalten\
    \ Tipps zur Anpassung an Ihre persönlichen Bedürfnisse. Mit GNOME zeigen wir Ihnen\
    \ eine weitere benutzerfreundliche Benutzeroberfläche.\n\nDanach erfahren Sie,\
    \ wie Sie mit dem grafischen Allroundwerkzeug YaST2 Ihre Hardware, Ihren Internetzugang\
    \ und Ihr System leicht einrichten und administrieren können. Das alles unter\
    \ dem laufenden System, ohne letzte Neustarts.\n\nAm Ende finden Sie eine Beschreibung\
    \ der Kommandozeilenbedienung, eine Einführung in das SuSE-Hilfesystem und eine\
    \ Liste häufig gestellter Fragen und Antworten rund um SuSE Linux.\n\nInstallationssupport\
    \ - wir haben ihn, für Sie, für alle Fälle. Mitunter weichen Rechner von allgemein\
    \ verbreiteten Spezifikationen ab. Unter Umständen kommt es dadurch bei der Installation\
    \ zu Problemen, die mit kompetenter Hilfe jedoch schnell in den Griff zu bekommen.\
    \ Dafür gibt es als besonderen Service den kostenfreien SuSE Installationssupport.\
    \ In der Regel genü ein Blick in den SuSE Support Service unter http://support.suse.de.\
    \ Dort finden Sie alle Informationen, Ansprechpartner und aktuelle Hinweise. Sollten\
    \ Sie darunter keine Lösung finden, helfen wir Ihnen auch selbstverständlich per\
    \ E-Mail unter support@suse.de.\nDas Referenzhandbuch finden Sie im Paket suselinux-reference_de\
    \ in der Serie doc. Dieses enthält zu vielen Themen (YaST-Module, Kernel, Netzwerk\
    \ usw.) tiefergehende Informationen. Die PDF-Datei liegt unter /usr/share/doc/packages/suselinux-reference_de/.\n\
    Für viele Frage- und Problemstellungen haben wir die Antworten und Lösungen schon\
    \ gefunden. Wir stellen Ihnen in mehreren hundert Artikeln in unserer Support-Datenbank\
    \ um die Uhr online unter http://sdb.suse.de/ zur Verfügung.\nHave a lot of fun!\n\
    Ihr SuSE Team\n\n# Inhaltsverzeichnis\n\n- 1 Umsteigen auf Linux . . . . . . .\
