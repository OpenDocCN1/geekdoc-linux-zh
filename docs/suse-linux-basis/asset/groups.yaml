  - '[PAGE 57]


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_57_0.png)


    Abbildung 4.4: KDE-Systemnachachrichten


    Möchten Sie ein externes Abspielprogramm nutzen, aktivieren Sie das Kästchen für
    ‘Externen Spieler verwenden‘ und wählen Sie das entsprechende Programm über das
    Verzeichnis-Symbol aus.


    # Netzwerk


    Hier nehmen Sie alle netzwerkrelevanten Einstellungen vor.


    **Email** – In diesem Modul können Sie einige Benutzerinformationen wie Name,
    Organisation, E-Mail-Adresse und Antwortadresse eintragen. Ferner können Sie Ihr
    bevorzugtes E-Mail-Programm angeben.


    **Einstellungen** – Um das Verhalten von KDE-Programmen in Verbindung mit dem
    Internet und Netzwerken zu testen, können Sie hier einfache Netzwerkeinstellungen
    vornehmen z. B. Überschreitungen vornehmen.


    **LAN-Browser** – Mit diesem Modul können Sie den LAN-Informationsserver Liste
    einrichten; Veränderungen können Sie aber nur als root vornehmen.


    **Newsticker** – Mit diesem Modul richten Sie das Miniprogramm KTicker ein. Dazu
    bieten Ihnen hier Registerkarten weitere Möglichkeiten:

    ‘Allgemein’ können Sie, wenn Sie eine Maus mit Scrollrad angeschlossen haben,
    die Empfindlichkeit des Rades und die Häufigkeit der Nachrichtenab bestimmen sowie
    ob der Lauftext teilweise verlangsamt angezeigt werden soll.'
  - '[PAGE 58]


    # 4 KDE – Die Konfiguration


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_58_0.png)


    **Abbildung 4.5:** Der KDE Newsticker


    Alle verfügbaren Internetadressressen, von denen eine Nachrichtenabfrage möglich
    ist, finden Sie unter dem Reiter ''Nachrichtenquellen''. Möchten Sie die Einstellungen
    zu dieser Nachrichtenquelle ändern, welche Quelldatei, Symbol, Kategorie oder
    maximale Artikel, wählen Sie unter der Liste den Button ''Bearbeiten'' an; beim
    Hinzufügen von Nachrichtenquellen klicken Sie auf ''Hinzufügen''.


    Falls Sie nur für bestimmte Nachrichten interessieren, können Sie über den Reiter
    ''Filter'' Regeln definieren.


    Der letzte Reiter ''Einstellungen'' für den Lufttext bestimmt die Geschwindigkeit
    des Lauftextes, die Laufrichtung sowie für das Erscheinungsbild die Schriftart,
    Vordergrund-, Hintergrund- und Vorbehaltungsfarbe. Nur auf aktuelle Schlagzeilen,
    Symbole, endloser Lufttext bzw. hervorgehobene Schlagzeilen unter angezeigt werden
    sollen, definieren Sie im Abschnitt ''Verschiedenes''.


    **SOCKS** – Mit diesem Modul können Sie sich für einen SOCKS-Server oder Proxy
    eine KDE-Unterstützung einrichten.


    **Talk-Einrichtung** – Kommunizieren Sie über das Netzwerk mit anderen. Sie benötigen
    dazu den Talk-Daemon. Auf drei Registerkarten erhalten Sie umfangreiche Einstellungsmöglichkeiten:'
- md: '

    Nutzen Sie die Registerkarte ‘Meldung’, um das Meldeprogramm, welches Ihnen die
    Talkanfrage mitteilt und das zu startende Talkprogramm zu bestimmen. Ebenfalls
    können Sie sich akustisch darauf aufmerksam machen lassen, falls eine Talkanfrage
    vorliegt.


    Stellen Sie Ihren Anrufbeantworter nach Ihren Vorgaben ein, damit eingehende Talkanfragen
    Textnachrichten für Sie hinterlassen werden können, falls Sie die Anfrage einmal
    nicht entgegennehmen können.


    Unter ‘Weiterleitung‘ können Sie die Einstellungen vornehmen, um ankommende Talkanfragen
    auf andere Rechner weiterzuleiten.


    ## Windows-Ressourcen – Dieses Modul erlaubt Zugriff auf freigegebene Laufwerke
    und Verzeichnisse in Netzwerken vorzunehmen. Um einen späteren Zugriff auf Daten
    zu erhalten, müssen Sie sich vorerst authentifizieren. Geben Sie dazu die erforderlichen
    Daten ein.


    Die Kombination eines Servers mit zugehöriger Authentifizierung nennt man „Zuordnung“.
    Wenn Sie auf eine Ressource klicken, für die eine Zuordnung existiert, wird KDE
    die Authentifizierung automatisch für Sie vornehmen. Haben Sie ein Passwort angegeben,
    werden Sie künftig


    ## Achtung


    > Das Speichern von Passwörtern sollte aus Sicherheitsgründen vermieden werden;
    besonders in sicherheitsrelevanten Netzen.


    Achtung


    ## Persönliche Einstellungen


    Unter diesem Menüpunkt befinden sich verschiedene Module, mit denen Sie KDE mit
    persönlichen Einstellungen Ihren Wünschen und Bedürfnissen anpassen.


    ### Land & Sprache In diesem Modul können Sie die Sprach-, Zahlen- und Datuminstellungen
    für Ihre Region vornehmen. Meist reicht ein Klick auf das passende ‘Land‘ und
    alle weiteren nötigen Einstellungen entsprechend gesetzt. Sollten Sie jedoch Einstellungen
    ändern wollen, können Sie diese unter ‘Zahlen’, ‘Währung‘ sowie ‘Zeit & Datum‘
    Ihren individuellen Vorgaben anpassen.


    Sollte die gesuchte Sprache nicht vorhanden sein, haben Sie wahrscheinlich das
    KDE-Sprachpaket nicht installiert. Der Name des Pakets beginnt mit kde3-i18n-
    und enthält zusätzlich ein Kürzel für die Sprache, z. B. für Deutsch, fr für Französisch
    usw. Ein Beispiel wäre kde3-i18n-de für das deutsche Paket.


    > Tipp

    In der Voransicht des Moduls (am unteren Rand) sehen Sie, wie sich die von Ihnen
    gewählten Einstellungen auswirken.


    > Tipp


    **Passwörter** Entscheiden Sie, ob Sie bei der Eingabe des Passwortes keine Anzeige
    oder einfache Zeichen anzeigen lassen wollen. Begrenzen Sie in jedem Fall die
    zeitliche Speicherung von Passwörtern.


    **Rechtschreibung** Wählen u. a. das zu verwendende Wörter, die Zeichenkodierung
    und das Programm, mit welchem Sie die Rechtschreibprüfung durchführen wollen.
    Alle Programme sowohl Aspell (KDE) als auch ISpell (Nicht-KDE-Programme) werden
    unterstützt.


    **Verschlüsselung** Dieser Bereich erlaubt die Einrichtung von SSL (engl. Socket
    Library), Zertifikaten, Authentifizierungen und die Einstellung sicherheitsrelevanter
    Aspekte. Für weitere Informationen beteiligen sich die ''Hilfe''.


    **Zugangshilfen** Wenn Fehlermeldungen nicht nur durch Klänge, sondern auch durch
    andere hörbare oder sichtbare Signale angezeigt werden sollen, können Sie diese
    in diesem Modul über die Karte ''Signal'' einstellen.


    Stellen Sie über die Karte ''Tastatur'' die Verzögerungen beim Tasteneinschlag
    ein. Sie verhindern beispielsweise eine Zeichenannahme über die Tastatur, wenn
    Sie nur eine Taste gedrückt halten.


    Möchten oder müssen Sie mit dem Nummernblock die Maus steuern, dann aktivieren
    Sie auf der Karte ''Maus'' den Punkt ''Maus mit Tastatur (Nummernblock) bewegen''.
    Zusätzlich haben Sie noch die Möglichkeit, Verzögerungen, Beschleunigungen, Wiederholungen
    etc. einzustellen.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_60_0.png)


    ## System


    Das Menü behaltet Module, mit denen Sie das Systemverhalten einstellen.


    > Achtung

    Da die Einstellungen in den Modulen ‘Anmeldungsmanager‘ und ‘Datum & Zeit‘ für
    das gesamte System gelten, können Sie hier nur als root Änderungen vornehmen.


    Achtung


    Anmeldungsmanager – Mit diesem Modul können Sie den grafischen Anmeldevorgang
    von KDE einrichten. Verändern Sie das Aussehen des Begrüßungsbildschirms und stellen
    Sie u. a. Zugang zum Anmeldungsmanager ein oder diesen herunter.


    Unter dem Reiter ‘Erscheinungsbild‘ stellen Sie das Aussehen des Anmeldebildschirms
    mit Begrüßungstext und Logo, den Stil der Sprache (dies ist unabhängig von der
    benutzerdefinierten Einstellung) oder definieren Sie eine zentrale oder genau
    zu bestimmende Position des Anmeldungsmanagers.


    Schriftart lässt Sie die Schriften wählen, welche der Anmeldungsmanager für die
    Begrüßungen und Benutzernamen verwenden soll.


    Möchten Sie für Ihren Anmeldebildschirm ein spezielles Hintergrundbild oder eine
    Farbfärbung, so können Sie die Einstellungen dazu unter dem Reiter ‘Hintergrund‘
