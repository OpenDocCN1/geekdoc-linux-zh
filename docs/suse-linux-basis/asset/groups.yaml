    **Abbildung 6.9: YaST2: Hardwareinformationen anzeigen


    Hinter ‘Details’ finden Sie Möglichkeiten für speziellere Einstellungen, an denen
    Sie nichts verändern sollten, wenn Sie sich nicht auskennen. Dort befindet sich
    eine Liste an Standardgruppen, aus der Sie auswählen können, den Home-Verzeichnis-Pfad,
    der hier verändert werden kann, ebenso die Benutzerkennung (ID) und eine Auswahlleiste
    für Login-Shells. Unten gibt es noch die Möglichkeit, zusätzliche Benutzerzugehörigkeit
    zu definieren. Wenn der neue Benutzer Zugriff auf das Modem haben soll, muss für
    ihn „dialout“ und „uucp“ (engl. unix to unix copy program) eingetragen sein.


    # **Bearbeiten und Anlegen von Benutzern**


    Nach dem Aufruf dieses Konfigurations-Tools öffnet sich die Maske „Verwaltung
    von Benutzern und Gruppen“. Zunächst haben Sie die Wahl, ob Benutzer oder Gruppen
    bearbeiten wollen. Die Gruppenverwaltung entspricht dem Modul „Gruppen bearbeiten
    und anlegen“ und wird dort beschrieben.


    Für eine komfortable Benutzerverwaltung stellt YaST2 Ihnen eine Liste aller Benutzer
    zur Verfügung. Wenn ein gelöschter werden wird, klicken Sie ihn einfach in die
    Liste an, so dass die Zeile dunkelblau erscheint und klicken Sie dann auf „Lschen“.
    Für das „Hinzufügen“ gehen Sie vor, wie bei „Neuen Benutzer anlegen“ beschrieben,
    ebenso beim „Bearbeiten“, wo sich hinter ‘Details’ die Bearbeitungsmöglichkeiten
    befinden.'
  - '[PAGE 117]


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_117_0.png)


    Abbildung 6.10: Neuen Benutzer anlegen mit YaST2


    # Neue Gruppe anlegen


    Das Anlegen einer neuen Gruppe ist mit YaST2 sehr einfach zu handhaben. Lesen
    Sie sich hierzu den YaST2-Hilfetetext an. Wenn Sie ihn im unteren Eingabefeld
    die Mitglieder der neuen Gruppe angeben, achten Sie bitte darauf, dass die Benutzernamen
    bzw. Login-Name ohne Leerzeichen hinter dem Komma eingetragen werden müssen. YaST2
    schlägt eine Gruppen-ID vor, die Sie einfach unternehmen können.


    # Gruppen bearbeiten und anlegen


    Nach dem Aufruf des Moduls öffnet sich die Maske „Verwaltung von Benutzern und
    Gruppen“. Zuerst haben Sie die Wahl, ob Sie Benutzer oder Gruppen bearbeiten wollen.
    Die Benutzerverwaltung entspricht dem Modul „Bearbeiten und Anlegen von Benutzern“
    und wird dort beschrieben.

    Für eine komfortable Benutzerverwaltung stellt YaST2 eine Liste aller Gruppen
    zur Verfügung. Soll eine gelöscht werden, so klicken Sie diese einfach in der
    Liste an, sodass die Zeile dunkelblau erscheint und klicken Sie auf „Löschen“.
    Für das „Hinzufügen“ und „Bearbeiten“ gehen Sie vor, wie bei „Neue Gruppe anlegen“
    beschrieben.'
- md: "\n![](img/7c7b5e54e6579952ad3fd8bde9e1a136_118_0.png)\n\nAbbildung 6.11: Benutzerverwaltung\
    \ mit YaST2\n\n## Systemssicherheit\n\nIn der Startmaske 'Lokale Sicherheitskonfiguration',\
    \ die Sie unter 'Sicherheit und Benutzer' aufrufen können, gibt es vier Punkte\
    \ anzuwenden:\nLevel 1 ist für Einzelrechner (vorkonfiguriert), Level 2 ist für\
    \ Workstations mit Netzwerk (vorkonfiguriert), Level 3 ist für Server mit Netzwerk\
    \ (vorkonfiguriert) und Benutzerdefiniert ist für eigene Einstellungen.\n\nWenn\
    \ Sie einen der ersten drei Punkte wählen, haben Sie die Möglichkeit, je nach\
    \ Bedarf entsprechend vorkfigurierte Systemsicherheit zu übernehmen. Klicken Sie\
    \ hierfür auf 'Beenden'. Unter 'Details' haben Sie auch Zugang zu den einzelnen\
    \ Einstellungen, die Sie auf Wunsch ändern können. Wenn Sie 'Benutzerdefiniert'\
    \ wählen, gelangen Sie mit 'Weiter' automatisch zu den verschiedenen Dialogen.\
    \ Hier finden Sie bei der Installation vorgestellten Werte.\n\n- 1. 'Passworteinstellungen'\n\
    \nHier legen Sie fest, wie lang das Passwort für zukünftige Anwender mindestens\
    \ bzw. maximal sein darf. Sinnvoll ist eine Zeichenanzahl von fünf bis acht. Ferner\
    \ stellen Sie ein, wie lange und viele Tage vor Ablauf gewarnt werden soll (die\
    \ Warnung erfolgt als Meldung beim Login der Textkonsole).\n\n![](img/7c7b5e54e6579952ad3fd8bde9e1a136_119_0.png)\n\
    \nAbbildung 6.12: Neue Gruppe anlegen mit YaST2\n\n- 2. 'Einstellungen für den\
    \ Systemstart'\n\nIn dieser Maske geht es um zweierlei. Erstens: Wie soll die\
    \ Tastenkombination Ctrl Alt+Ent interpretiert werden?\nÜblicherweise bewirkt\
    \ dies eine auf der Textkonsole einen System-Neustart. Das sollten Sie so belassen,\
    \ es sei denn, Ihr Rechner bzw. Server ist öffentlich zugänglich und Sie befürchten,\
    \ dass jemand unerlaubte Aktionen durchführen könnte.\nWenn Sie ‘Stop‘ auswählen,\
    \ bewirkt diese Tastenkombination ein Herunterfahren des Systems, bei ‚Ignorieren‘\
    \ bleibt diese Tastenkombination wirkungslos. Zweitens: Darf das System vom KDM\
    \ (KDE-Display-Manager – das grafische Login) aus herunterfahren? ‘Nur Root’ (also\
    \ Systemadministrator), ‘Alle Nutzer’, ‘Nobody’ oder ‘Lokale Benutzer’? Wenn Sie\
    \ ‘Nobody‘ auswählen, dann kann das System nur noch von der Textkonsole aus herunterfahren.\n\
    \n![](img/7c7b5e54e6579952ad3fd8bde9e1a136_120_0.png)\nAbbildung 6.13: Gruppenverwaltung\
    \ mit YaST2 (img/7c7b5e54e6579952ad3fd8bde9e1a136_config)\n\n- 3. 'Einstellungen\
    \ für Anmeldung'\n\nÜblicherweise gibt es nach einem fehlgeschlagenen Andeversuch\
    \ eine Wartezeit von einigen Sekunden, bis eine erneute Anmeldung möglich ist.\
    \ Seit dieser Einführung ist es, „Password Hacker“ zu erschweren. Zudem haben\
    \ Sie die Möglichkeit, ‚Aufzeichnung fehlgeschlagener Andeversuche‘ und ‚Aufzeichnung\
    \ erfolgreicher Andeversuche‘ zu aktivieren. Falls Sie mal Verdacht haben sollten,\
    \ dass jemand versucht, Ihr Passwort herauszufinden, können Sie Einträge in den\
    \ Systemdateien unter /var/log kontrollieren.\n\n- 4. 'Einstellungen für neue\
    \ Benutzer'\n\nJeder Benutzer hat eine numerische ID und eine Benutzerkennung.\
    \ Dies geschieht durch die Datei /etc/passwd und sollte möglichst eindeutig sein.\
    \ Mit den Daten können Sie festlegen, welche Bereiche vergeben werden, wenn Sie\
    \ einen neuen Benutzer anlegen. Das Minimum von 500 für einen Benutzer ist sinnvoll\
    \ und sollte nicht unterschritten werden.\n\n- 5. 'Verschiedene Einstellungen'\n\
    \nBei ‚Einstellung der Rechte‘ gibt es drei Auswahl: ‚Easy‘ ‚Sicher‘ und ‚Paranoid‘.\
    \ Den meisten Benutzern dürfte erste reichen. Die YaST gibt Ihnen Auskunft über\
    \ die drei Sicherheitsstufe.\n\nDie Einstellung 'Paranoid' ist extrem restriktiv\
    \ und sollte als Ausnahme für einen dienen. Wenn Sie diese auswählen, müssen Sie\
    \ bei der Verwendung einzelner Programme mit Störungen rechnen. Sie werden nicht\
    \ mehr Rechte haben, auf verschiedene Dateien zuzreifen. Außerdem können Sie in\
    \ diesem Dialog den Benutzer festlegen, der täglich nach dem Booten automatisch\
    \ eine Datenbank (locatedb) erzeugt, in der jede Datei auf Ihrem Rechner gespeichert\
    \ wird. Diese lässt sich mit dem Befehl locate durchsuchen. Wenn 'Nobody' gewählt,\
    \ kann jeder Benutzer Pfade in der Datenbank finden, auch andere unprivilegierte\
    \ Benutzer. Wenn root angewählt ist, werden alle lokalen Dateien gelistet.\n\n\
    Ferner gibt es die Möglichkeit, den Punkt 'Das aktuelle Verzeichnis dem Pfad des\
    \ Benutzer entfernen' zu aktivieren. Dieser Punkt zu wählen ist empfohlen. Letztens\
    \ gibt es die Option 'Telnet Anmeldung für Benutzer root deaktivieren'. Es ist\
    \ empfohlen, diesen Punkt anzuwählen; falls nicht, kann ein Benutzer vom Netz\
    \ auf Ihrem Rechner mit Telnet als root einloggen, wodurch das Root-Passwort in\
    \ unverschlüsselter Form sichtbar wird.\n\nMit 'Beenden' schließen Sie Ihre Sicherheitskonfiguration.\n\
    \n## Software installieren/löschen\n\nDieses Modul unter 'Software' ermöglicht\
    \ es, zusätzliche Software auf Ihrem Rechner zu installieren. Außerdem können\
    \ gewünschte Programme entfernt werden, um mehr freien Platz der Festplatte zu\
    \ schaffen. Wenn Sie von CD installieren wollen, legen Sie bitte die erste CD\
    \ in das Laufwerk.\n\nIm Dialog werden links die Paketserien angezeigt (kommerzielle\
    \ Pakete der Serie pay), und auf der rechten Seite alle von Ihnen gewählten Serien\
    \ angezeigt. Bereits auf Ihrem Rechner installierte Pakete sind mit i gekennzeichnet.\
    \ Das An- und Abwählen eines Pakets erfolgt durch Doppelklick oder durch Anwählen\
    \ der Zeile und Klicken des Buttons 'Übernehmen'. Zur Installation ausgewählte\
    \ Pakete werden 'X' markiert und zu löschende Pakete mit 'd'. Falls ein Paket\
    \ zusätzliche Pakete benötigt, werden diese von YaST2 automatisch angewählt (Kennzeichnung\
    \ a) oder Sie haben die Möglichkeit, aus mehreren in Frage kommenden Paketen eines\
    \ auszuwählen.\n\nHaben die Auswahl der Pakete, die Sie installieren und deinstallieren\
    \ wollen, beendet, können Sie durch Klicken auf 'Extras' → 'Einstellungen speichern\
    \ oder laden' Ihre Paketauswahl in einer Datei speichern. Dabei wird immer die\
    \ Information zur aktuell(!) installierten Software gespeichert. Wenn Sie dann\
    \ später auf eine CD installieren, können Sie diese bei Bedarf (z. B. Neuinstallation\
    \ oder Update des Systems) verwenden, um Ihre Vorwahl zu wiederholen, ohne lange\
    \ Pakete suchen zu müssen. Sie können einfach die CD während der Softwareinstallation\
    \ einwerfen. 'Extras' → 'Einstellungen speichern oder laden' berechnet den zusätzlich\
    \ benötigten Speicherplatz. Falls der Speicherplatz nicht ausreicht, wird in einem\
    \ Warnfenster darauf hingewiesen und Sie müssen eines oder mehrere Pakete abwählen.\
    \ Wenn Sie den Dialog mit 'Abbrechen' verlassen, wird Ihre Auswahl nicht gespeichert\
    \ und keine Aktion ausgeführt. Mit 'OK' wird die Installation und/oder das Löschen\
    \ der Pakete gestartet. Im Installationsfenster können Sie den Fortgang der Aktionen\
    \ im Fortschrittsbalken sehen. Alle Pakete werden verarbeitet, was die Installation\
    \ von SuSEConfig abschließt. Es ist normal, dass die Festplatte sehr aktiv wird.\n\
    \n Achtung\n\nSie haben die Möglichkeit, installierte Pakete zum Löschen zu markieren\
    \ (diese werden mit 'd' gekennzeichnet). Beachten Sie dabei die Warnhinweise und\
    \ löschen Sie keine Pakete des Linux-Grundsystems (Serie a).\n\n Achtung\n\n##\
    \ Installationsquelle wechseln\n\nDie Installationsquelle ist das Medium, auf\
    \ dem die zu installierende Software zur Verfügung steht. Sie können von CD (der\
    \ übliche Weg), von einem Netzwerkserver oder von Festplatte installieren. (Lesen\
    \ Sie hierzu den ausführlichen YaST2-Hilfetext).\n"
