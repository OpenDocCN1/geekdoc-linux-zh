    - Nautilus versucht – soweit möglich – von Ihnen gemachte Eingaben in das ‚Ort‘
    Eingabefeld automatisch zu vervollständigen. Den Vervollständigungsvorschlag sehen
    Sie in Revers dargestellten Buchstaben. Drücken Sie einfach auf die Tab-Taste,
    wenn Nautilus Vorschlag richtig ist!

