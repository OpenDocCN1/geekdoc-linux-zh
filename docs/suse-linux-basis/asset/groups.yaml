  mdcn: '

    您可以单独开启或关闭每种可视化方法。可以同时激活多种方法，并对它们进行逐一关闭。


    # Sawfish 配置


    尽管 GNOME 可以处理许多窗口管理器，但 Sawfish 特别适用于协作。


    - 低内存占用：Sawfish 作为一个特别“轻量级”的程序，对资源的利用非常出色，这同时也保证了极高的运行速度。

    - 主题使用：可以通过主题更改 Sawfish 的视觉效果（Look&Feel），包括控制元素的排列布局。

    - GNOME 兼容性：Sawfish 与 GNOME 100% 兼容。Sawfish 可以在 GNOME 控制中心内进行配置。


    Sawfish 可以通过自己的控制中心进行设置。为此，请在 GNOME 控制中心中选择“工作区” → “选择窗口管理器” → “配置 Sawfish”。不过，我们将重点侧重于在
    GNOME 控制中心内部的配置。


    # 工作区


    在 Sawfish 中，工作区被划分为行和列。例如，如果选择了 2 列 2 行，工作区就会被分为四个区域。每个区域的大小相当于整个屏幕。这样，你可以将一个缩小的窗口显示在任务栏中，并将其移动到工作区范围内的另一个区域。如果窗口超出了屏幕边缘，它将位于相邻的不可见区域中。在此窗口中，您可以设置
    Sawfish 管理多少个工作区以及每个工作区包含多少个区域。同样，您还可以为工作区命名符号名称，并决定当鼠标指针碰到屏幕边缘时是否切换工作区。


    # 外观


    在此处您可以设置 Sawfish 的图形主题，这涉及窗口框和窗口控制元素。此外，还可以对字体以及随附主题“Mono”的设置进行调整。


    > 提示

    > 借助 Sawfish 自带的程序 `sawfish-themer`，可以交互式地创建 Sawfish 主题。


    # 焦点行为


    焦点行为决定了窗口如何变为激活。在 `enter-exit` 设置下，当鼠标指针位于窗口区域内时，即可获得焦点。`enter-only` 的区别在于，当指针离开窗口区域时，窗口仍保持焦点；只有当指针移动到另一个窗口的区域时，新窗口才会获得焦点。在第三种设置
    `click` 中，只有当指针位于窗口区域内且用户通过鼠标点击确认保持焦点时，窗口才会获得焦点。此外，还有更多关于窗口折叠和焦点行为细节设置选项。如果启用
    `Shade-Hover` 模式，当鼠标指针位于标题栏时，折叠的窗口会自动打开。


    # 声音


    在此界面，可以为 Sawfish 管理的事件（例如最大化时显示为图标等）分配音效。关联的音频文件格式应为 WAV。


    # 难度等级


    Sawfish 自身的配置可以分两个阶段进行。在 `Novice`（新手）设置下，将隐藏一些可能会困扰初学者的设置。`Intermediate`（中级）是本手册参考的设置，提供了大部分配置选项，仅去除了非常特殊的设置，这些设置将在
    `Expert`（专家）模式下解锁。


    # 放置


    当新程序窗口出现时，Sawfish 可以控制它们在桌面上的何处以及如何放置。默认设置为 `best-fit`（最佳适应），Sawfish 会计算桌面哪个位置剩余“空白区域”最多，并尝试放置新窗口。或者可以选择
    `interactively`（交互式）设置，允许用户自行为新窗口定位。


    # 微帮助


    除了各种详细功能外，此处还可以配置 Sawfish 的微帮助。微帮助是 Sawfish 通过小气泡显示的简短说明。


    # 快捷键


    使用键盘操作窗口系统对资深用户非常有帮助。Sawfish 满足所有需求。在此窗口中，您可以为几乎每个操作分配一个按键或组合键组合。Sawfish 将操作划分为不同的逻辑组；组名说明了操作所属的范围。例如，在
    `Window`（窗口）组中，您可以找到最大化、移动或最小化窗口的操作。


    # 缩小与放大


    在此处您可以设置 Sawfish 在最小化或恢复窗口时的行为。此外，您可以规定是否允许在最大化的程序窗口上手动更改窗口几何形状。


    # 移动与更改


    您可以设置窗口管理器，使其在移动窗口时仅绘制一个矩形。这种设置对于性能较低的计算机或显卡特别有用。在放大窗口框时也可以进行相同的设置。此外，您可以应用不同的窗口“吸附”方法。例如，将对齐方法设置为
    `magnetism`（磁性），窗口框将具有磁性。


    # 对齐窗口


    “对齐窗口”部分允许您个性化处理窗口的方式。这里将通过一个简单的示例来解释此功能的用途：


    - 首先启动 GNOME 控制中心并选择“对齐窗口”。

    - 现在启动应用程序 GNOME。

    - 点击“添加”。

    - 左侧列显示一个目录、包含多少个对象以及最后修改时间。在终端中，人们经常需要更改键盘布局，因此当鼠标进入窗口区域时，更改此应用程序的焦点是有意义的。为此，请将
    `fokus-mode`（焦点模式）选择切换。

    - 因为经常需要终端程序，我们想给它一个不同的外观。为此，请将 `framestyle` 设置为任意的 Sawfish 主题。

    - 点击“确定”应用更改。从现在起该功能将影响所有新启动的终端应用程序。


    # Nautilus - 文件管理器


    Nautilus 是 GNOME 桌面的新文件管理器，具有许多新功能和扩展。


    ```

    ./images/png/gnome_nautilus_main.png


    **图 5.7:** Nautilus


    # 初步


    在上方图中，可以看到典型的 Nautilus 窗口。左侧窗口部分显示目录符号、包含多少对象（即文件）以及最后修改时间，而右侧窗口部分显示目录内的单个对象。


    # 导航


    在“位置”文本输入框中，您可以查看使用 Nautilus 窗口时在哪个目录（或 URL，稍后介绍）中。


    - Nautilus 尝试尽可能自动补全您在“位置”输入框中的输入。补全建议将以反向字母的形式显示。如果 Nautilus 的建议正确，只需按下 Tab 键即可！点击文本输入框上方工具栏中的主页按钮，Nautilus
    将始终切换到主目录下的 Nautilus 文件夹。


    '
