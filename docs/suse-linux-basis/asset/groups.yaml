    # 在线更新 (Online-Update)


    YaST 在线更新允许安装重要的升级，或者在 SuSE FTP 服务器上提供相应的“补丁”（Patches）供下载。当前软件包的安装可以全自动进行。然而，通过“手动更新”，您可以自行决定哪些补丁被应用到您的
    SuSE Linux 系统中。


    点击“详细信息”后，您将获得有关上次更新的信息以及可用软件包的信息。点击“显示补丁信息”后可以了解更多细节。点击“下一步”，您将进入所有可用补丁的列表（如果选择了“手动更新”），您可以在从中进行选择。通过点击“确定”或双击可以激活各个部分。点击“下一步”然后点击“完成”即可完成在线更新。


    # 从控制台进行在线更新


    ```

    erde:/root # yast2 online_update .auto.get

    ```


    # 6

    YaST2 - 配置


    ```

    ./../images/png/yast2_inst_medium.png

    ```


    **图 6.15:** *YaST2: 切换安装源*


    从列表 `/etc/suseserver` 中的第一个服务器获取当前的补丁列表和所有相关的 rpm。如果您想加载特定的补丁，可以在调用时额外提供选项。


    可能的选项有 `security`, `recommended`, `document`, `YaST2` 和 `optional`。`security`
    包含安全相关的补丁，`recommended` 包含 SuSE 推荐的更新，`document` 提供来自 FTP 服务器的关于补丁通知，`YaST2` 仅提供
    YaST2 补丁，而 `optional` 提供低优先级的更新。


    补丁通知存储在 `/var/lib/YaST/patches/i386/update/X.Y/patches` 中。您只能读取它们。X.Y 是对应 SuSE
    Linux 的相应版本。


    下载安全补丁后的调用命令为：


    ```

    erde:/root # yast2_online_update .auto.get security

    ```


    每当您调用 `.auto` 时，通常会根据 `/etc/suseserver` 加载 FTP 服务器列表。如果您想关闭它，必须在文件 `/etc/rc.config`
    中禁用该功能。在以下行中：


    ```

    erde:/root # YAST2_LOADFTPSERVER="yes"

    ```


    将 `yes` 设置为 `no`。


    现在可以使用以下命令安装补丁：


    SuSE Linux - Basis 11


    ```

    erde:/root # yast2 online_update .auto.install

    ```


    此调用将安装所有获取的补丁。如果您安装一个组，可以在 `.auto.get` 时使用相同的选项。这种方法的优点是它可以被自动化。系统管理员可以在例如夜间下载软件包，并在早晨安装他们需要的包。


    # 更新系统


    此模块允许您将系统更新到最新状态。将调用多个工作步骤，YaST2 将确定哪些软件包需要更新。如果需要，您可以对每个软件包单独决定是否进行更新。但是，基础系统可能无法变为新的，这必须从安装介质（例如
    CD）启动。请注意，要更新的基础版本越旧，或者要更新的软件包的配置偏离标准越远，更新的问题就越棘。某些情况下，配置可能无法正确采用；此时应该创建一个全新的配置。此外，在更新之前应该对现有配置进行备份。


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_125_0.png)


    图 6.16: YaST2: 更新系统


    # 其他


    # 备份


    通过新的备份模块，您第一次可以使用 YaST2 对系统进行备份。该模块不执行完整备份，而是备份已更改软件包、系统关键区域和配置文件的信息。


    在配置时，您可以确定要备份哪些文件。默认情况下会存储自上次安装以来更改的软件包信息。此外，您可以存储属于 `/etc/` 或您的主目录的配置文件。此外，还可以通过分区表向
    MBR 添加硬盘上的其他系统区域，以便在需要恢复时可以使用它们。


    # 启动模式


    启动模式通常在安装期间确定。当您的 SuSE Linux 启动时，后续不需要更改此处，除非您之前是从软盘启动且现在想从硬盘启动。


    > 注意

    > 在运行的系统中更改启动模式仅建议专家操作。如有需要，请阅读参考手册中的“LILO 安装”章节。关于参考手册的信息可以在前言中找到。


    # 创建启动、救援或模块磁盘


    通过 YaST2 模块（在“系统”下找到），您可以以多种方式创建两种不同的启动磁盘、一个救援磁盘和两种不同的模块磁盘。如果在从 CD 安装时遇到问题，这些磁盘实际上用于启动已安装系统，通过一个小技巧，您仍然可以使用它们。


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_127_0.png)


    # 图 6.17: YaST2: 创建启动/模块磁盘


    - **创建启动磁盘：** 启动磁盘是您在安装时找到的。

    - **创建救援磁盘：** 此外，还有一个救援磁盘，它可以帮助您访问系统。

    - **创建模块磁盘：** 如果您的安装需要额外的模块，可以创建这些磁盘。


    上述磁盘用于启动已安装的系统。


    '
