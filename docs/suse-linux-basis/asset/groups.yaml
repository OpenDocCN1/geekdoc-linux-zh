- md: '

    Abbildung 5.8: Die Toolbar eines Nautilus-Fensters


    Die ''Vor'' und ''Zurück'' Buttons ermöglichen Ihnen, in einem normalen Web-Browser
    zu navigieren. Der Button ''Rauf'' wechselt in die nächsthöhere Verzeichene. ''Aktualisieren''
    erzwingt den Neustart der Ansicht. ''Suchen'' ermöglicht das Suchen von Dateien
    innerhalb der lokalen Ressourcen Ihres Rechner: Im unteren Textfeld geben Sie
    den Suchbegriff ein, der Button ''Finde'' startet die Suche. ''Web-Suche'' öffnet
    eine Suchmaschine, in der Sie nach im Internet suchen können.


    ## Nautilus als Dateimanager


    Zooming, Bild- und Textvorschau, Bild- und Textansicht – der Ansatz, Dateien und
    deren Inhalte grafisch zu repräsentieren, führt fast zwangsläufig zur Frage, bei
    der die Visualisierung mehr Inhalt oder mehr Übersicht sinnvoll ist. Mit variablen
    Zoomfunktionen hilft Nautilus Ihnen diesen Spagat zu meistern. Text- und Grafikdaten
    zeigen der Dateimanager generell eine verkleinerte Ansicht an, die bereits ausreichend
    wissen lässt, wie z. B. eine Textdatei anfängt oder sie ein Bild zeigt. Sehr praktisch
    ist hierbei, dass Sie sich in vielen Dateien vergrößern und verkleinern können:
    Der Anwender entscheidet. Klicken Sie auf ein Icon doppelt, öffnet der Dateimanager
    die Datei mit dem jeweils zugeordneten Programm; wenn es sich um eine Bild-Datei
    handelt, lädt Nautilus das integrierte Bildanzeige-Modul und wechselt zu einer
    Großansicht des Bildes. Auch hier können Sie die Zoomtasten verwenden, wenn etwa
    das Bild größer als Ihre Desktop-Auflösung ist.


    > Tipp

    > Wenn Sie eine Textdatei als Icon darstellen, können Sie bereits die ersten Worte
    des Textes im Icon sehen. Vergrößern Sie nun die Ansicht und Sie sehen neben einer
    Vergrößerung der Icons ebenfalls mehr Text!


    Klicken Sie auf die Lupe zwischen den beiden + und - Buttons, gleichen Sie sich
    auf eine Zoomgröße von 100%, also die Originalgröße.


    Listenansicht Alternativ können Sie mit dem Button „Als Liste betrachten“ (neben
    den beiden Zoom-Icons) auf die Listendarstellung umschalten, welche bei sehr vielen
    Dateien praktischer ist.


    ## Kopieren, Verschieben und Verknüpfen von ObjektenW Wählen Sie ‘Datei’ → ''Neues
    Fenster‘ um ein zweites Nautilus-Fenster erscheinen zu lassen. Durch Hin- und
    Verschieben können Sie nun mit der linken Maustaste Dateien kopieren. Ziehen Sie
    dagegen das Icon mit der rechten Maustaste, wird an einem Zielort ein kleines
    Menü erscheinen, mit Nautilus gefragt, ob Sie das Objekt dort „verschieben“, „kopieren“,
    oder „verknüpfen“ wollen. Nautilus verwaltet den Bildschirmhintergrund sowie die
    Icons, die sich dort befinden. Natürlich können Sie eine Datei auf den Bildschirmhintergrund
    verschieben oder drei verknüpfen.


    Die Nautilus-Hilfe Im linken Teil des Fensters sehen Sie unter den Reiter ‘Hilfe’.
    Alle- und Informationsdokumente werden von Nautilus zusammengefasst, und in ein
    einheitliches HTML-Format gebracht. Wenn Sie den Hilfe-Reiter wählen, erscheint
    im linken Teil des Nautilus eine Zusammenfassung der verschiedenen Hilfe-Themen,
    in welcher eine Baumstruktur angezeigt wird. Wenn Sie eines der Themen aus wählen,
    wird in der rechten Seite des Fensters der Inhalt angezeigt.


    Ortsabhängige Notizen Im Bereich der Hilfe-Reiter finden Sie auf den Reiter ‘Notizen’.
    Sie können zu allem, was im rechten Teil des Fensters zu sehen ist, Notizen machen:
    Internetseiten, Verzeichnisse oder Bild-Dateien. Die Notizen werden immer zusammen
    mit dem Ort des dargestellten Inhalts gespeichert.


    Chronik Die Chronik speichert sämtliche besuchten Orte für den schnelleren späteren
    Zugriff. Sie ist auch über das Menü mittels ‘Gehe zu’ zu erreichen. Hier können
    Sie die aktuelle Chronik löschen (‘Chronik löschen’).


    Dateisystem Der Reiter ‘Baum’ dient als Hilfe, wenn Sie schnell Verzeichnis wechseln
    oder Dateien in andere Verzeichnisse verschieben wollen; er liefert eine übersichtliche
    Darstellung Ihrer Daträgerstruktur. Wie schon im Punkt Kopieren, Verschieben und
    Verknüpfen von Objekten erwähnt, können Sie auch hier durch einfaches Verschieben
    von Dateien Kopieroperationen auslösen.


    Objekte mit Emblemen markieren Sie können alle Objekte in der rechten Hälfte des
    Fensters mit „Emblem“ ausstatten. Sie dienen dazu, eine Datei oder ein Verzeichnis
    zweckdienlich zu markieren. So gibt es beispielsweise Symbole für „Entwurf“, „Wichtig“
    oder „Persönlich“. Wenn Sie auf eine Datei oder Verzeichnis rechtsklicken und
    im sich öffnenden Popup-Menü „Eigenschaften zeigen“ wählen, öffnet sich der Dialog.
    Sie finden die drei Reiter „Grundlegend“, „Berechtigungen“ und „Emblem“. Wählen
    Sie, welche Embleme zusammen mit dem Objekt-Icon erscheinen. Sie können auch mehrere
    Embleme zuordnen. Die Änderungen werden augenblicklich umgesetzt.


    Anordnung, Position und Größe von Icons Im Gegensatz zu anderen Dateimanagern
    können Sie die visuelle Erscheinung von Icons individuell anpassen. Normalerweise
    übernimmt Nautilus „automatis Layout“ automatisch die Anordnung, Position und
    Größe von Icons. Sobald Sie eine der Dateien verschieben, wird der Dateimanager
    fragen, ob Sie in „manuelle Layout“ wechseln wollen. Wenn Sie sich auf „Umschalten“
    bestätigen, wird Nautilus keine automatischen Anpassungen mehr vornehmen.

    Eine weitere Möglichkeit, bestimmte Objekte hervorzuheben besteht darin, die Größe
    der Icons zu ändern. Klicken Sie hierzu mit der rechten Maustaste auf das Icon.
    Im erscheinenden Popup-Menü können Sie die Größe anpassen. Sie können auch verschiedene
    Zoomgrößen wählen, um die Icons besser zu sehen.


    ## Nautilus und den Desktop konfigurieren


    Nautilus verwaltet die Icons auf Ihrem Arbeitsplatz. Darüber können Sie den Hintergrund
    Ihres Desktops mit Farben und Mustern anpassen.


    Nautilus kennt drei Schwierigkeitsgrade, mit denen sich die Bedienung anpasst.
    Sie können die aktuelle Einstellung im Menü oben „Hilfe“ ändern. Im Folgenden
    beziehen wir uns auf den Grad „Fortgeschritten“. Im Schwierigkeitsgrad „Anfänger“
    werden hingegen mehr oder weniger Optionen angezeigt.


    Die Präferenzen Im gleichen Menü, indem Sie die Einstellungen einstellen, erreichen
    Sie den Präferenzen-Dialog


    - ‘Erscheinungsbild’ – Hier können Sie verschiedene Einstellungen am Aussehen
    der Ansichten und der in verwendeten Schriftarten ändern. Besonders wichtig: Schalten
    Sie die Option ‘Glättete Grafik verwenden’, wenn Nautilus Ihrem System zu viel
    verbraucht. Die Funktionen, um Bilder und Icons zu vergrößern, werden mit Hilfe
    eines komplexteren Algorithmus benutzt, um eine höhere Qualität beim Zoomen zu
    erhalten.

    - ‘Ordneransichten’ – Hier wählen Sie, ob ein Doppel- oder Einfachklick startet.
    Wenn Sie wollen, dass jedes Mal ein neues Fenster öffnet, wenn Sie ein Objekt
    anklicken, aktivieren Sie die entsprechende Funktion im Rahmen ‘Fensterverhalten’.

    - ‘Suche’ – Dies bezieht sich auf die Web- als auch auf die ‘normale’ Suche. Sie
    können verschiedene Einstellungen für Suchgeschwindigkeit und zur Auswahl der
    Suchmaschine für die Web-Suche machen.

    - ‘Seiten-Panele’ – Hier können Sie einstellen, welche der Reiter im linken Teil
    des Fensters erscheinen.

    - ‘Navigation’ – Stellen Sie Ihre Startseite für Nautilus ein. Dies kann eine
    Webseite oder ein Verzeichnis sein. Falls um ins Internet zu gelangen, falls Sie
    einen Proxy-Server benutzen, aktivieren Sie die entsprechenden Einstellungen im
    Rahmen ‘Proxy-Einstellungen’ und aktivieren Sie die Checkbox ‘HTTP-Proxy verwenden’.
    Nautilus bietet eine Reihe von eingebauten Lesezeichen, die z. B. zu Linux-Distributoren
    und Dienstleistern gehören. Möchten Sie diese deaktivieren, abschalten Sie die
    Checkbox ‘Eingebaute Lesezeichen nicht einfließen lassen’.

    - ‘Geschwindigkeit Komfort’ – Nautilus kann für Objekte der Art Grafik, Text oder
    auch Sound Ansichten generieren. Verständlich, dass dies ziemlich viel Rechenzeit
    benötigt, z. B. um die Icon-Ansicht einer Textdatei zu erstellen. Hier können
    Sie die entsprechenden Funktionen abschalten, falls sie nicht benötigt werden.

