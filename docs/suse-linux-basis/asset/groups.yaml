    - Besonders wichtig ist, dass das Bild flimmerfrei ist. Konkret heißt dies bei
    15-Zoll-Monitoren mindestens 73 Hz. Empfohlen wird allerdings 85 Hz. Für größere
    Geräte, z. B. 21 Zoll 100 Hz.


    - Helligkeit und Kontrast sind nur justierbar. Die Schärfe der Zeichen soll nicht
    durch unterschiedliche Helligkeits- oder Kontrasteinstellungen unterschiedlich
    sein.


    - Selbstverständlich ist, dass das Bild verzerrungsfrei ist und keine Farbfehler
    aufweist.


    - Um Reflexblendungen zu vermeiden, ist eine gute Spiegelung der Bildschirmoberfläche
    zu empfehlen.


    - Der Bildschirm soll frei dreh- und neigbar sein. Eine Höhenverstellbarkeit wird
    empfohlen.


    - Farbdstellung führt zu einer besseren Aufnahme der dargestellten Information.
    Die Darstellung von Farben kann auch zu einer Beanspruchung der Augen führen.
    Nicht unterschiedliche Farben werden von der Linse unterschiedlich gebrochen.
    Für rote Farben sind wir weitsichtig, für blaue kurz. Ältere Bildschirme weisen
    oft Konvergenzfehler auf, d. h. dass die drei Strahlen der Bildschirmröhre nicht
    mehr exakt justiert sind; dadurch entstehen z. B. bei Buchstaben des Wortes farbige
    Ränder.


    - Die vom Bildschirm ausgehende elektromagnetische Strahlung soll möglichst gehalten
    werden. Die Einhaltung der schwedischen Norm MPR II wird empfohlen. TCO 99 ist
    im Moment hierfür die strengste Norm.


    - Neue Bildschirme in Deutschland sollten die CE-Kennzeichnung und europäische
    Normen erfüllen und Energiesparfunktionen besitzen.


    ## Wie stelle ich meinen Bildschirm auf?


    Auch hier gilt: Ein falsch aufgestellter Bildschirm erzeugt bei der Arbeit eine
    Zwangshaltung, die zu den bekannten Erkrankungen führen kann. Oft verhindert eine
    ausreichende Schreibtiefe eine sinnvolle Aufstellung des Bildschirms. Die natürliche
    Haltung des Kopfes und der Arme ist für eine Arbeit ausgerichtet, die im wahrsten
    Sinne des Wortes vor uns liegt.


    Ergomen haben für den so genannten Seh- und Greifraum eigene Richtlinien entwickelt.
    Diese lehnen z. B. die oft vorhandene seitlich versetzte Bildschirmplatzierung
    ab. Eine Ausnahme ist hier nur eine seltene Benutzung des Bildschirms. Ein Grund
    für diese Aufstellpraxis ist die Tatsache, dass die geforderte Mindestgröße von
    60 cm Schreibtiefe bei einem großen Bildschirm und bei der Verwendung von Arbeitsvorlagen
    nicht ausreicht. Oft wird der Bildschirm – wie in vielen PC-Handbüchern bildlich
    dargestellt – auf das Rechnergehäuse gestellt. Dies führt ebenfalls zu einer unnatürlichen
    Körperhaltung. Beobachten Sie sich doch einmal beim Lesen. Schauen Sie geradeaus
    oder am liebsten nach unten.


    Schulter, Tastatur und Bildschirm sollten linear ausgerichtet sein. Man sieht
    auch direkt auf den Bildschirm. Eine Regel, die aber nicht immer und zwangsweise
    umgesetzt werden sollte.


    - Im Effekt sollte der Arbeitsplatz individuell eingestellt werden. Flexibilität
    ist das Schlagwort. Also wären leicht verschiebbare, schwenkbare und im Idealfall
    in den Tisch senkbare Bildschirmabstände individuell gefordert.


    - Ein angenemer Abstand, der der Bildschirmnutzer und seine Augen schweifen lässt.
    So können sich die Augen zwischendurch auf eine andere Entfernung einstellen.


    - Wenn von einer Vorlage abgetippt, sollte sich diese in derselben Entfernung
    wie der Bildschirm befinden. So wird häufiges Wechseln der Entfernungsfokussierung
    vermieden.


    - Zwischen dem direkten Arbeitsbereich, das ist der Bildschirinhalt und den unmittelbar
    angrenzenden Flächen, das ist z. B. das Bildschirmgehäuse, sollte der Leuchtdichteunterschied
    nicht größer als 3:1 sein. Deswegen sind in Büros das Gehäuse der Geräte nicht
    tief-schwarz. Die Unterschiede zwischen dem Arbeitsbereich und der Umgebung sollten
    nicht größer als 10:1 sein.


    - Auch glänzende Flächen erzeugen große Leuchtdichteunterschiede. Deswegen sind
    Büromöbel nicht in grellen Farben erhältlich und haben eine matte Oberfläche.


    - Um die Gefahr der Reflexblendung auf dem Bildschirm zu minimieren, sollten Bildschirm
    und Tastatur angeordnet sein, dass die Blickrichtung zu den Oberflächen parallel
    verläuft. Je weiter der vom Bildschirm entfernt wird, desto besser.


    - Der Bildschirm sollte nicht direkt unter einem Leuchtband, sondern versetzt
    oben aufgestellt werden. Die Blickrichtung sollte parallel zum Leuchtband verlaufen.


    ## Schlag auf Schlag die Tastatur und die Handgelenke


    Schon länger ist bekannt, dass die von der Schreibmaschine abgeleiteten Anordnung
    der Tasten auf der Tastatur nicht unbedingt ergonomisch ist. Durch Tippen werden
    nicht die Finger oder Hände sondern Arme und Schulterbereich strapaziert. Spannungen
    sind die Folge. Die durch eine schlechte Tastatur erzeugte Belastung nimmt im
    Laufe der Zeit zu. Leider sind beim Tippen auftretende Mikro-Bewegungen schwer
    zu messen. Als Risikaktor ist hier vor allem RSI-Syndrom zu nennen. Die Tastatur
    ist zweifellos das am häufigsten gebrautzte Eingabegerät des Computers. Deswegen
    muss sie besonders gut konstruiert sein. Immer wieder wird von den Ergonomen kritisiert:
    Ein grundsliches Übel scheint aber das häufig zu kurze Kabel zu sein, das eine
    bequeme Platzierung verhindert. Es stellt sich die Frage, wie viele Leute bereit
    sind, für einen PC DM 2 000 auszugeben, für die dazhörige Tastatur aber nur DM
    20? Eigentlich sollten sie zu einer Tastatur gleich auch ein Verlängerungskabel
    mitkaufen.


    - Die Tastatur sollte vom Bildschirm getrennt sein.


    - Die Tastatur sollte nicht mehr als 30 mm über der Tischfläche liegen.


    - Falls keine Tastaturauflage vorhanden ist, empfiehlt sich eine.


    - Die Beschriftung der Tastatur muss sich deutlich von der Farbe des Plastiks
    abheben und lesbar sein.


    - Die Tastatur sollte eine matte Oberfläche aufweisen.


    - Die Tastatur kann nicht ergonomisch sein.


    - Der Tastweg sollte 2-4 mm betragen und der Druckpunkt soll gut spürbar sein.


    - Bei Vieltiern sind 50-80 g Tastendruck zu empfehlen.


    - Auf regelmäßige Erholungspausen achten.


    - Außerdem ist das Erlernen des 10-Finger-Systems von Vorteil, da hier die Last
    auf alle Finger verteilt wird.


    - Geteilte oder individuell teilbare Tastaturen sind zwar gewöhnungsbedürftig,
    aber durchaus eine überlegene Alternative. Sie sind arbeitswissenschaftlich konstruiert
    und werden in manchen Normen eher empfohlen. Dadurch lässt sich seitliches Abknicken
    des Handgelen vermeiden.


    Auf Aufgrund des Sieges der grafischen Benutzeroberflächen wird man heute quasi
    gezwungen, die Maus zu verwenden. Die intensive Nutzung der Maus kann Ermüdungen
    oder sogar Erkrankungen im Hand-Arm-Schulter-Bereich verursachen. Ein Beispiel
    ist hier (zum letzten Mal) das so genannte RSI-Syndrom. Die Gefahr steigt bei
    Verwendung einer „schlechten“ Maus. Für die ergonomische Maus existieren noch
    keine Normen. Oft wird ein PC mit Standard verkauft. Diese sollte auf jedem Fall
    kritisch begutachten. Ist die Maus wirklich tauglich, oder sollte man sie gegen
    eine bessere austauschen? Lassen sich mehrere Mäuse aufsteigen und probieren?
    Auf jeden Fall dürfte das Kabel auch zu kurz sein. Verlangen Sie kulanterweise
    eine Verlängerung vom PC-Hand. Es stellt sich die Frage, inweit die persönliche
    Mausnutzung verbessert kann. Professionelle Programme mit vielen Interaktionen
    verzichten auf Mausklicks. Die Benutzung von Tastaturkürzeln muss zwar erelernt
    werden, man kann unter Umständen bis zu viermal schneller werden. Oft ist auch
    die Kombination Maus-Tastatur-Bedienung zu empfehlen.


    Die ergonomische Maus liegt in Ihrer Hand. Die Tasten sollten nicht zu nah und
    nicht zu klein sein. Mäuse gibt es inzwischen sogar für Kinderhände.

