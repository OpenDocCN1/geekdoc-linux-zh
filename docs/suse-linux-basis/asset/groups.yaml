    \ 122\n- Einführung in die Bash ........................................................\
    \ 122\n- Benutzerrechte ...................................................................\
    \ 131\n- Wichtige Linux-Befehle im Überblick ...................................\
    \ 135\n- Der Editor vi .....................................................................\
    \ 146\n\n# Einleitung\n\nBesonders für Linux-Rechner älteren Baujahs, die nicht\
    \ über genügend Ressourcen für die hardwareunabhängigen Darstellungssysteme verfügen,\
    \ sind Steuerungen über textbasierte Programme wichtig. In diesem Fall benutzen\
    \ Sie eine virtuelle Konsole, von der Ihnen im Textmodus sehr zur Verfügung steht.\
    \ Zum Wechsel zwischen den Konsolen drücken Sie die Tastombombinationen Alt +\
    \ F1 bis Alt + F6. Die sechste Konsole ist X11 reserviert.\n\n# Einführung in\
    \ die Bash\n\nAuf der Taskleiste finden Sie ein Icon, das einen Monitor mit einer\
    \ Muschel (engl. shell) zeigt. Mit diesem Symbol öffnet sich das „Konsole“-Fenster,\
    \ in dem Sie Befehle eingeben können. Es handelt sich dabei standardmäßig um eine\
    \ Bash (engl. Bourne again). Die Bash wurde vom GNU-Projekt entwickelt und ist\
    \ ein wohl verbreitetes Derivat der Bourne Shell (sh). Wenn Sie die Bash geöffnet\
    \ haben, sehen Sie in der Zeile den „Prompt\", der gewöhnlich den Benutzer- und\
    \ Renamen sowie den aktuellen Pfad beinhaltet, aber individuell konfiguriert werden\
    \ kann. Wenn der Cursor hinter diesem Prompt steht, können Sie direkt Befehle\
    \ an Ihr Computersystem schicken: \n\n```\ntux@eder:->\n```\n\n# Befehle\n\nBefehle\
    \ bestehen aus verschiedenen Bestandteilen. Zuerst kommt dann der Parameter oder\
    \ Optionen. Jeder Befehl wird ausgeführt, wenn Sie ls drücken. Vorher können Sie\
    \ problemlos die Kommandozeile editieren, Optionen oder Tippfehler korrigieren.\
    \ Eine der am häufig gebrauchten Befehle ist ls, den Sie alle oder mit genannten\
    \ Argumenten verwenden können. Geben Sie in die Konsole ls ein, wenn der Inhalt\
    \ des Verzeichnisses angezeigt wird, in dem Sie sich befinden. Optionen werden\
    \ durch einen vorangestellten Bindestrich gekennzeichnet. Wenn Sie ls -l eingeben,\
    \ wird der Inhalt des Verzeichnisses in detaillierter Form angezeigt. Sie sehen\
    \ neben den Dateinamen das Erstellungsdatum der Datei, die Größe in Bytes und\
    \ weitere Angaben, auf die wir später eingehen werden. Eine der wichtigsten Optionen\
    \ überhaupt, die die es sehr viele Befehle gibt, ist die Option --help. Wenn Sie\
    \ z. B. ls --help eingeben, werden Ihnen alle Optionen zum Befehl ls angezeigt.\n\
    \nMit ls können Sie sich aber auch andere Verzeichnisse ansehen. Dazu übergeben\
    \ Sie das anzuzeigende Verzeichnis als Parameter. Zum Anzeigen des Inhalts des\
    \ Unterverzeichnisses Desktop z. b. ls -l Desktop.\n\n# Dateien und Verzeichnisse\n\
    \nEffektiv mit der Shell zu arbeiten, gebraucht man Kenntnisse über die Datei-\
    \ und Verzeichnis-Struktur unter Linux. Verzeichnisse sind Ordner, in denen Dateien,\
    \ Programme oder auch Verzeichnisse abgelegt werden können. Das Wurzelverzeichnis\
    \ ist in der Hierarchie ganz oben und wird mit „/“ angesprochen.\n\nIm Verzeichnis\
    \ /home befinden sich die Verzeichnisse der einzelnen Benutzer, in denen ihre\
    \ persönlichen Dateien abgelegt werden. Die Abbildung 7 zeigt den Standard-Verzeichnisbaum\
    \ unter Linux mit den Home-Verzeichnissen der Beispielbenutzer yxz, linux und\
    \ tux. Der Verzeichnisbaum Ihres Linux-Systems ist funktionell gegliedert („Filesystemstandard“)\
    \ und in der Tabelle 7.1 auf der nächsten Seiten erhalten Sie eine Kurzbeschreibung\
    \ zu den Standardverzeichnissen unter Linux.\n\n![](img/7c7b5e54e6579952ad3fd8bde9e1a136_132_0.png)\n\
    \n| Pfad | Beschreibung |\n| :--- | :--- |\n| / | das Wurzel-Verzeichnis (engl.\
    \ root directory), Beginn des Verzeichnisbaums |\n| /home | die (privaten) Verzeichnisse\
    \ der Benutzer-Dateien |\n| /dev | deviceHardware-Komponenten repräsentieren |\n\
    | /etc/init.d | wichtige Dateien zur Systemkonfiguration (Skripte) |\n| /usr/bin\
    \ | allgemein zugängliche Kommandos, die bereits zum Hochfahren des Systems benötigt\
    \ werden |\n| /usr/sbin | Kommandos, die dem Systemverwalter vorbehalten sind\
    \ |\n| /sbin | Kommandos, die dem Systemverwalter vorbehalten sind und zum Hochfahren\
    \ des Systems benötigt werden |\n| /usr/include | Header-Dateien für den C-Compiler\
    \ |\n| /usr/include/g++ | Header-Dateien für den C++-Compiler |\n| /usr/share/doc\
    \ | verschiedene Dokumentationsdateien |\n| /usr/share/man | die Hilfe-Texte (Manual-Pages)\
    \ |\n| /usr/src | die Kernel-Quellen |\n| /usr/src/linux | temporäre Dateien |\n\
    | /tmp | große temporäre Dateien |\n| /var/tmp | beherbergt sämtliche Anwendungsprogramme\
    \ |\n| /var | Konfigurationsdateien (z. B. von /usr gelinkt) |\n| /var/log | Protokolldateien\
    \ |\n| /var/adm | Systemverwaltung |\n| /lib | Shared Libraries (für dynamisch\
    \ gelinkte Programme) |\n| /proc | das Prozessdatesystem |\n| /usr/local | optionale\
    \ Software |\n| /opt | größere Systeme |\n\nTabelle 7.1: Standardverzeichnisse\
    \ unter Linux\n\n# Funktionen der Bash\n\nZwei wichtige Funktionen der Bash erleichtern\
    \ die Arbeit:\n\n- History: Wenn Sie den Befehl aufzurufen, drücken Sie die Taste.\n\
    - Expansionsfunktion: Wenn es keine Datei mit diesem Buchstaben gibt, ergänzt\
    \ Shell die Zeichenkette. \n\n**Umgang mit Dateien**\n\nSie wissen, wie die Shell\
    \ arbeitet, welche Verzeichnis erleichtern:\n\n1. Um den Inhalt des Verzeichnisses\
    \ anzuzeigen, nutzen Sie `ls`.\n2. Um den Inhalt zu sehen, müssen `ls` eineben.\n\
    3. Legen Sie mit `mkdir` (engl. make directory) ein neues Unterverzeichnis an.\n\
    4. Um zu sehen, ob das Verschieben erfolgreich war, wechseln Sie mit dem Befehl\
    \ `cd` (engl. change directory) das Verzeichnis.\n5. Sollten Sie eine Kopie der\
    \ Datei benötigen, benutzen Sie den Befehl `cp` (engl. copy).\n\n\n\n"
  mdcn: '


    # 使用 Shell 操作


    图形界面对于 Linux 来说变得越来越重要。鼠标点击并不总是能满足日常生活中的所有需求。在这里，命令行提供了高度的灵活性和效率。在本章的第一部分，您将获得关于如何操作
    Bash Shell 的介绍，随后是对 Linux 下用户用户权限概念的解释，以及一份最重要的命令列表，最后是文本编辑器 vi 的介绍。


    - 引言 ................................................................ 122

    - Bash 简介 ........................................................ 122

    - 用户权限 ................................................................... 131

    - 重要的 Linux 命令概览 ................................... 135

    - vi 编辑器 .....................................................................
    146


    # 引言


    特别是对于旧型号的 Linux 计算机，由于它们没有足够的资源运行硬件无关的显示系统，基于文本的程序控制至关重要。在这种情况下，您将使用虚拟控制台，它在文本模式下非常可用。使用组合键
    Alt + F1 到 Alt + F6 可以在不同控制台之间切换。第六个控制台留给 X11 使用。


    # Bash 简介


    在任务栏上，您可以找到一个显示带有外壳（英语 shell）的显示器的图标。点击此符号将打开“控制台”窗口，您可以在其中输入命令。默认情况下它是 Bash（英语
    Bourne again）。Bash 是由 GNU 项目开发的，是 Bourne Shell (sh) 的一种流行的变体。当您打开 Bash 后，您会在行中看到“提示符”（Prompt），它通常包含用户名和主机名以及当前路径，但可以进行单独配置。当光标位于此提示符后面时，您可以直接向您的计算机系统发送命令：


    ```

    tux@eder:->

    ```


    # 命令


    命令由不同的部分组成。首先是参数或选项。当您按下 `ls` 时，会执行该命令。在此之前，您可以轻松编辑命令行、纠正选项或拼写错误。最常用的命令之一是 `ls`，您可以使用它或带指定的参数使用它。在控制台中输入
    `ls` 即可显示您当前所在目录的内容。选项以前加连字符为标记。如果您输入 `ls -l`，将以详细的形式显示目录内容。除了文件名之外，您还会看到文件的创建日期、字节大小以及我们稍后将讨论的其他信息。最重要的选项之一（很多命令都有这个选项）是
    `--help`。如果您输入 `ls --help`，将向您显示 `ls` 命令的所有选项。


    通过 `ls`，您也可以查看其他目录。为此，您将要显示的目录作为参数传递。例如，要显示子目录 Desktop 的内容，请输入 `ls -l Desktop`。


    # 文件与目录


    要有效地与 Shell 工作，需要了解 Linux 下文件和目录结构的知识。目录是用于存放文件、程序或其他目录的文件夹。根目录位于层级结构的顶端，通过“/”进行访问。


    `/home` 目录中包含每个用户的目录，其中存放着他们的个人文件。图 7 显示了 Linux 下的标准目录树，带有示例用户 yxz、linux 和 tux
    的家目录（Home）。您的 Linux 系统的目录树在功能上是划分的（“文件系统标准”），在下一页的表格 7.1 中，您将获得 Linux 下标准目录的简要描述。


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_132_0.png)


    | 路径 | 描述 |

    | :--- | :--- |

    | / | 根目录（英语 root directory），目录树的起点 |

    | /home | 用户文件的（私有）目录 |

    | /dev | 代表设备硬件组件 |

    | /etc/init.d | 系统配置的重要文件（脚本） |

    | /usr/bin | 启动系统时已需要的通用命令 |

    | /usr/sbin | 供系统管理员保留的命令 |

    | /sbin | 供系统管理员保留且启动系统所需的命令 |

    | /usr/include | C 编译器的头文件 |

    | /usr/include/g++ | C++ 编译器的头文件 |

    | /usr/share/doc | 各种文档文件 |

    | /usr/share/man | 帮助文本（手册页） |

    | /usr/src | 内核源码 |

    | /usr/src/linux | 临时文件 |

    | /tmp | 大的临时文件 |

    | /var/tmp | 存放所有的应用程序 |

    | /var | 配置文件（例如，从 /usr 链接） |

    | /var/log | 日志文件 |

    | /var/adm | 系统管理 |

    | /lib | 库（用于动态链接程序） |

    | /proc | 进程文件系统 |

    | /usr/local | 可选软件 |

    | /opt | 较大的系统 |


    表格 7.1：Linux 下标准目录


    # Bash 功能


    Bash 的两个重要功能简化了工作：


    字体 历史（History）：当您调用该命令时，按下按键。

    - 扩展功能：如果没有带有该字母的文件，Shell 将补全字符串。


    **文件操作**


    您知道如何与 Shell 工作，哪些目录可以简化操作：


    1. 要显示目录内容，请使用 `ls`。

    2. 要查看内容，需要 `ls` 位于一级。

    3. 使用 `mkdir`（英语 make directory）创建一个新的子目录。

    4. 要查看移动是否成功，请使用命令 `cd`（英语 change directory）切换目录。

    5. 如果您需要文件的副本，请使用命令 `cp`（英语 copy）。


    '
