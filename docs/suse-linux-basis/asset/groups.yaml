  - '[PAGE 134]


    # Funktionen der Bash


    Zwei wichtige Funktionen der Shell erleichtern Ihnen die Arbeit wesentlich:


    +   - Die History – Wenn Sie einen bereits eingegeben Befehl noch einmal aufzurufen,
    drücken Sie die Taste ⇧ so oft, bis der gewünschte Befehl angezeigt wird; zumwärts
    Blättern drücken Sie die Taste ⇩. Zum Editieren der Befehzeile bewegen Sie sich
    mit dem Cursor-Taste an die entsprechende Stelle und korrigieren Sie diese.


    +   - Expansionsfunktion – Sie ergänzt einen Dateinamen, falls dieser eindeutig
    identifiziert werden kann, nachdem Sie die ersten Buchstaben eingegeben haben.
    Wenn es mehrere Dateien mit den gleichen Anfangsbuchstaben gibt, erhalten Sie
    durch zweimaliges drücken der Taste Tab eine Auswahlliste.


    **Beispiel: Der Umgang mit Dateien**


    Sie wissen, wie ein Befehl arbeitet, welche Verzeichnisse unter SUSE Linux gibt
    und wie Sie in der Bash die Arbeit erleichtern können. Nun werden Sie Ihre Kenntnisse
    mit einem kleinen Übungsispiel umsetzen:


    +   1. Öffnen Sie eine Konsole in KDE durch Klick auf das Muschel-Icon.


    +   2. Geben Sie ls ein und sehen den Inhalt Ihres Home-Verzeichnisses.


    +   3. Legen Sie mit mkdir (engl. make directory) ein neues Unterverzeichnis mit
    dem Namen test an, indem Sie mkdir test eingeben.


    +   4. Rufen Sie den KEdit auf, indem Sie Alt+F2 drücken und in das Eingabefeld
    „edit“ klicken. Tippen Sie ein Zeichen ein und speichern die Datei unter dem Namen
    „Testdatei“ mit großer „T“, da Linux Groß- und Kleinschreibung unterscheidet.


    +   5. Lassen Sie sich wieder den Inhalt Ihres Home-Verzeichnisses anzeigen. Statt
    der normalen Eingabe von ls drücken Sie die Taste ⇧. Jetzt steht wieder ls am
    Prompt, und zum Ausführen des Befehls müssen Sie nur noch ↵ drücken. Sie sehen
    das neue Verzeichnis test in blauer Schrift und die Testdatei in schwarzer Schrift,
    Verzeichnisse werden immer blau dargestellt und Dateien immer schwarz.'
  - '[PAGE 135]


    6. Unsere „Testdatei“ soll nun mit dem Befehl mv (engl. move) in das Unterverzeichnis
    test verschoben werden. Zur Erleichterung der Eingabe nutzen wir die Expansionsfunktion:
    Geben Sie mv T und drücken Sie die Tabulator-Taste. Gibt es keine Datei mit diesem
    Buchstaben im Verzeichnis, ergänzt Shell die Zeicenkette „testdatei“, sonst müssen
    Sie weitere Buchstaben eingeben und zwischendurch die Tabulator-Taste betätigen.
    Setzen Sie ihn hinter der ersetzten Zeicenkette ein Leerzeichen, schreiben test
    und drücken zum Verschieben noch ↍


    7. Wenn Sie den Befehl ls eingeben, wird „Testdatei“ nicht mehr angezeigt.


    8. Um zu sehen, ob das Verschieben erfolgreich war, wechseln Sie mit dem Befehl
    cd in das Verzeichnis. Geben Sie ls ein; ihn sollte jetzt „Testdatei“ angezeigt
    werden. Durch die Eingabe von cd (engl. change directory) gelangen Sie wieder
    in Ihr Home-Verzeichnis.


    9. Sollten Sie eine Kopie der Datei benötigen, benutzen Sie den Befehl cp (engl.
    copy). Geben Sie cp Testdatei Testsicherung ein, um die „Testdatei“ in „Tellsicherung“
    zu kopieren. Mit dem Aufruf von ls werden Ihnen Dateien angezeigt.


    # Pfadangaben


    Zur Bearbeitung von Dateien oder Verzeichnissen muss immer der richtige Pfad angegeben
    werden. Dazu müssen Sie nicht den kompletten Pfad vom Wurzelverzeichnis angeben,
    sondern von Ihrem Verzeichnis ausgehen. Zusätzlich lässt sich Ihr Home-Verzeichnis
    mit ~ anspre. Das bedeutet, dass Sie mehrere Möglichkeiten haben, die Datei „Testdatei“
    im Verzeichnis aufzulisten: relativ durch die Eingabe von ls ~*/*

    Zum Einsehen von Home-Verzeichnisses anderer Benutzer, geben Sie ls ~ und den
    Benutzernamen ein. In der gewünschten Verzeichnisstruktur wäre ein Beispielmuster
    tux. Der Befehl ls ~t würde entsprechend den Inhalt des Home-Verzeichnisses von
    tux anzeigen.

    Ihr aktuelles Verzeichnis können Sie durch einen Punkt darstellen, höhere Pfadebenen
    durch zwei Punkte. Mit der Eingabe von ls .. wird Ihr Inhalt des Mutterverzeichnisses
    zum aktuellen Verzeichnis angezeigt, durch ls ../ der Inhalt des Verzeichnisses
    zwei Stufen in der Hierarchie höher.'
- md: '

    # Beispiel: Umgang mit Pfaden


    Ein weiteres Beispiel soll Ihnen veranschaulichen, wie Sie sich in der Verzeichnisstruktur
    Ihres SuSE-Linux-Systems bewegen können.


    - Wechsel mit cd in Ihr Home-Verzeichnis. Legen Sie ein weiteres Unterverzeichnis
    test2 über den mkdir test2 an.

    - Wechseln mit cd test2 nach und legen Sie ein Verzeichnis namens Unterverzeichnis
    an. Nutzen Sie die Expansionsfunktion, indem Sie nur Tab drücken, um den Rest
    der Zeichenkette zu ergänzen.

    - Sie befinden sich jetzt im Unterverzeichnis und sollen ohne Wechsel des Verzeichnisses
    das zuvor angelegte Testsicherung verschieben. Sie müssen dazu den Pfad zu den
    benötigten Dateien angeben. Vergessen Sie nicht den Punkt am Ende des Befehls
    mv ../test/Testsicherung . , welches das aktuelle Verzeichnis als Ziel der Verschiebung
    festlegt. Mit zwei Punkten gelangen jeweils eine ausgewene Datei in Ihr Verzeichnis.


    # Wildcards


    Weitere Vorteile der Wildcards sind die vier Zeichen. „Wildcards“ oder Jokerzeichen:


    - ? Ersetzt genau ein beliebiges Zeichen.

    - * Ersetzt beliebig viele Zeichen.

    - [set] Ersetzt genau ein beliebiges Zeichen, außer in den eckigen Klammern angegebenen
    Zeichen (Zeichenkette „*set“).

    - [set]] Umfasst genau ein beliebiges Zeichen, außer in den „set“ angegebenen.


    Haben Sie in Ihrem Verzeichnis die Dateien Testdatei, Testdatei2 und date und
    geben Sie ls Testdatei ein, dann erhalten Sie die Datei Testdatei und Testdatei2.
    Mit ls * erhalten Sie zusätzlich die Datei Testdatei.

    Der Befehl ls * zeigt Ihnen alle Spieldateien an, während Sie mit dem Joker-set
    jedes Zeichen ansprechen können, das als letzte Zeichen eine Zahl ist: Testdatei[1-9].

    Am wichtigsten ist immer der *-Joker: Durch seine Verwendung können Sie z. B.
    Dateien eines Verzeichnisses in anderes Verzeichnis kopieren oder löschen. Der
    Befehl rm *date* bspw. löscht alle Dateien in Ihrem Verzeichnis test, in deren
    Name die Zeichenfolge „date“ vorkommt.


    # Mehr oder Weniger


    Zwei kleine Programme ermöglichen Ihnen, Textdateien direkt in der Shell anzuschauen.
    Wir brauchen nicht einmal einen Editor starten. Zum Öffnen einer Datei Datei.txt
    geben Sie einfach less README.txt ein. Im Konsolenfenster wird nur der Text angezeigt.
    Mit der Letertaste kommen Sie immer eine Seite weiter, allerdings können Sie die
    Tasten ↑ ↓ benutzen, um sich im Text vorwärts oder rückwärts zu bewegen. Zum Beenden
    des Programms drücken Sie die Taste G.


    Das Programm erhielt seinen Namen nach dem Motto „Weniger ist mehr“ und kann nicht
    nur zum Lesen von Textdateien benutzt werden, sondern z. B. auch die Ausgabe von
    Befehlen benutzt. Lesen Sie sich dazu den Abschnitt Umleitungen auf dieser Seite.


    Neben lässt sich das ältere Programm mehr benutzen, allerdings ist es weniger
    komfortabel, da Sie vor- und zurückblättern.


    # Umleitungen


    Normalerweise ist die Standardausgabe in der Shell Ihr Bildschirm bzw. das Konsole-Fenster,
    die Standardeingabe erfolgt über die Tastatur. Wenn Sie die Ausgabe eines Befehls
    an ein Programm übergeben wollen, müssen Sie dazu eine sogenannte „Pipeline“ (Rohleitung)
    verwenden.


    Wenn Sie die Dateien im Verzeichnis test anzuschauen, geben Sie den Befehl ls
    test | less ein. Das Zeichen | erhalten Sie auf der deutschen Tastatur, im Alt
    und gleichzeitig die Taste mit dem Zeichen < und drücken. Sie sehen nun in der
    Konsole den Inhalt des Verzeichnisses test mit an angezeigt. Das hilft nur, wenn
    die normale Ausgabe ist zu unbersichtlich wird. Sehen Sie sich z. B. das Verzeichnis
    mit ls /dev an, dann sehen Sie im Fenster nur einen Teil des Inhaltes, welches
    stattdessen mit ls /dev | alle Dateien aulisten.


    Falls Sie die Ausgabe von Befehlen in einer Datei speichern wollen, würde der
    Befehl im Beispiel so: ls > Inhalt. Danach haben Sie eine neue Datei mit Namen
    „Inhalt“, die Dateien und Verzeichnisse in test enthält. Mit less können Sie sich
    die Datei anschauen.

    Umgekehrt können Sie eine Datei als Quelle für einen Befehl verwenden. Lassen
    Sie z. B. die Textzeilen Ihrer selbst geschriebenen Testdatei alphabetisch sortieren
    über sort < Testdatei. Die Ausgabe des Befehls erfolgt auf dem Bildschirm. Sie
    sehen nun den Text, den zuvor geschrieben haben, sortiert nach den Anfangsbuchstaben
    in jeder Zeile. Das kann sehr hilfreich sein, wenn Sie z. B. eine unsortierte
    Namensliste sortieren möchten.


    # 7


    Wollen Sie eine neue Datei mit der sortierten Liste, müssen Sie die Ausgabe des
    sort-Befehls wieder in eine Datei lenken. Wenn Sie das nachvollziehen möchten,
    erstellen Sie in einem Editor eine unsortierte Liste Namensliste, und speichern
    Sie diese unter dem Namen liste im Verzeichnis test.


    Gehen Sie ins Verzeichnis und rufen Sie den Befehl sort < liste > sortierteListe
    auf. Sehen Sie sich sich mit die neue Liste an.


    Die Standard-Fehlerausgabe ist ebenfalls der Bildschirms. Wenn Sie diese diese
    in einer Datei mit "Fehler" umleiten möchten, geben Sie im Anschluss an den Befehl:
    2 Fehler. Wenn Sie > Ausgabe an sowohl die Standardausgabe sowie die Standardausgabe
    als die Fehlerausgabe. Wenn an Stelle einmal = zweimal >> benutzt, wird die Ausgabe
    an eine vorhandene Datei angehäng.


    # Archive und Datenkompression


    Nachdem Sie schon einige Dateien und Verzeichnisse angelegt haben, wenn wir uns
    mit dem Thema Archivierung und Datenkompression zu sind. Angenommen, Sie möchten
    das Verzeichnis test in einer Datei packen, damit Sie diese auf Diskette speichern
    oder per E-Mail verschicken. Dazu benutzen Sie den Befehl tar. Mit tar --help
    können Sie alle Optionen erklären:


    - -c (engl. create) neues Archiv anlegen.

    - -t (engl. table) Inhalt eines Archives anzeigen.

    - -x (engl. extract) Archiv entpacken.

    - -v (engl. verbose) zeigt während Einpackens alle Dateien an.

    - -f (engl. file) Damit Sie einen Dateinamen wählen.


    Arbeiten mit der Shell

    SuSE Linux


    Um nun das Verzeichnis mit allen Dateien in ein Archiv mit dem Namen test.tar
    zu packen, brauchen wir auf jeden Fall die Optionen -c und -f. Da wir den Fortschritt
    beim Archivieren mitfolgen wollen, geben wir auch die Option -v an. Gehen Sie
    mit cd in Ihr Home-Verzeichnis, wo sich das Verzeichnis befindet. Die Eingabe
    lautet nun: tar -cvf test.tar. Schauen Sie sich nach den Inhalt an: tar -tf test.tar.
    Übrigens bleibt das Verzeichnis unverändert auf Ihrer Festplatte. Um das Archiv
    wieder auszupacken, müssen Sie tar -xvf test.tar eingeben. Tun Sie das bitte nicht,
    wenn wir noch die Archivdatei komprimieren wollen, um Speicherplatz zu sparen.

    Dazu empfiehlt sich das weit verbreitete gzip, gzip test.tar. Wenn Sie nun ls
    eingeben, sehen Sie, die Datei test.tar verschwunden ist und stattdessen eine
    Datei test.tar.gz existiert. Diese Datei ist kleiner und lässt sich daher besser
    verschicken.

    Und sollen Sie das Archiv im Verzeichnis test2 kopieren. Sie dazu die Archivdatei
    mit cp test.tar.gz in test2 wechseln wechseln mit cd test2 das Verzeichnis. „Entpacken“
    der gepackten Archivdatei mit dem Ende .gz wird der Befehl gunzip genutzt, so
    dass die Eingabe gunzip test.tar.gz lautet. Wir erhalten die Datei test.tar, die
    noch mit tar -xvf test.tar aufgelöst werden muss. „Entpacken“ des gepackten Archives
    können Sie auch gleich zum tar-Befehl die Option -z hinzufügen und das Archiv
    mit tar -xvzf test.tar.gz auspacken.


    Durch Eingabe von ls sehen Sie, dass Sie ein neues Verzeichnis mit dem gleichen
    Inhalt wie Ihr Home-Verzeichnis haben.


    # mtools


    Die mtools sind ein Satz von Befehlen, mit denen man auf MS-DOS-Dateisystem arbeiten
    kann. Das ist für die Arbeit mit Disketten-Laufwerken wichtig. Das Laufwerk kann
    unter MS-DOS als a: angesprochen werden. Die Befehle ähnel denen unter MS-DOS,
    allerdings mit vargestellten:


    - mdir a: - zeigt den Inhalt der Diskette im Laufwerk a.

    - mcopy a:Testdatei a: - kopiert die Datei Testdatei auf die Diskette.

    - mdel a:Testdatei - löscht Testdatei auf a:

    - mformat a: - formati Disketten im MS-DOS-Format mit Hilfe des Befehls fformat.

    '
  mdcn: '


    # 示例：处理路径


    另一个示例将向您展示如何在您的 SuSE Linux 系统的目录结构中导航。


    - 使用 `cd` 切换到您的主目录。通过 `mkdir test2` 创建另一个子目录 `test2`。

    - 使用 `cd test2` 切换该目录，并创建一个名为 `Unterverzeichnis` 的目录。通过仅按 `Tab` 键使用扩展功能来自动补全字符串的剩余部分。

    - 现在您位于子目录中，需要在不切换目录的情况下移动之前创建的备份 `Testsicherung`。为此，您必须指定所需文件的路径。不要忘记命令 `mv ../test/Testsicherung
    .` 末尾的点，它将当前目录设置为移动的目标。通过使用两个点，可以将一个选定的文件分别移动到您的目录中。


    # 通配符 (Wildcards)


    通配符的进一步优势是这四个字符。“Wildcards”或通配符字符：


    - ? 替换任意一个字符。

    - * 替换任意数量的字符。

    - [set] 替换任意一个一个字符，但方括号内指定的字符除外（字符字符串“*set”）。

    - [set]] 包含任意一个字符，但“set”中指定的字符除外。


    如果您在目录中有文件 `Testdatei`、`Testdatei2` 和 `date`，并输入 `ls Testdatei`，您将获得 `Testdatei`
    和 `Testdatei2`。通过 `ls *` 您还将获得文件 `Testdatei`。

    `ls *` 命令将向您显示所有通配文件，而您可以使用通配符集匹配最后一个字符为数字的任何字符：`Testdatei[1-9]`。

    最重要的始终是 `*` 通配符：通过使用它，您可以将一个目录中的文件复制到另一个目录或删除。例如，命令 `rm *date*` 会删除您 `test` 目录中所有名称中包含字符串“date”的文件。


    # 更多或更少


    两个小型程序允许您直接在 Shell 中查看文本文件。我们甚至不需要启动编辑器。要打开文件 `Datei.txt` 文件，只需输入 `less README.txt`。控制台窗口将只显示文本。使用方向键可以一直向下翻页，但您可以使用
    `↑` 和 `↓` 键在文本中向前或向后移动。按 `G` 键退出程序。


    该程序以“少即是多”为格言命名，不仅可以用于读取文本文件，还可以用于命令输出。相关内容请阅读本页的“重定向”部分。


    此外可以使用较旧的程序 `more`，但它没有那么方便，因为您无法向前和向后翻页。


    # 重定向


    通常情况下，Shell 中的标准输出是您的显示器或控制台窗口，标准输入通过键盘进行。如果您想将一个命令的输出传递给程序，则必须使用所谓的“管道”（Pipeline）。


    要查看 `test` 目录中的文件，请输入命令 `ls test | less`。在德语键盘上，通过同时按下 `Alt` 和带有字符 `<` 的键来获取符号
    `|` 符号。您现在会在控制台中查看到 `test` 目录的内容。这仅在普通输出过于混乱时才有用。例如，使用 `ls /dev` 查看目录，您在窗口中只能看到内容的一部分，而通过
    `ls /dev | all` 则可以列出所有文件。


    如果您想将命令的输出保存到文件中，示例中的命令将是：`ls > Inhalt`。之后您将有一个名为“Inhalt”的新文件，其中包含 `test` 中的文件和目录。您可以使用
    `less` 查看该文件。

    相反，您可以使用文件作为命令的源。例如，通过 `sort < Testdatei` 让您自己编写的测试文件的行按字母顺序排序。命令的输出将在屏幕上显示。您现在可以看到之前编写的文本，它们已根据每行的首字母进行了排序。这在例如需要排序未排序的名称列表时非常有帮助。


    # 7


    如果您想创建一个带有排序列表的新文件，则必须将 `sort` 命令的输出重新重定向到文件中。如果您想理解这一过程，请在编辑器中创建一个无序列表 `Namensliste`，并将其保存为
    `test` 目录下的 `liste`。


    进入该目录并调用命令 `sort < liste > sortierteListe`。使用 `less` 查看新列表。


    标准错误输出也是屏幕。如果您想将这些错误重定向到名为“Fehler”的文件，请在命令后输入：`2 Fehler`。使用 `>` 将输出同时重定向到标准输出和标准错误输出。如果在该处使用
    `>>` 而不是 `>`，则输出将追加到现有文件中。


    # 存档与数据压缩


    在您已经创建了一些文件和目录之后，我们来看存档和数据压缩的主题。假设您想将 `test` 目录打包到一个文件中，以便将其保存到磁盘上或通过电子邮件发送。为此您使用
    `tar` 命令。


    - -c (engl. create) 创建新存档。

    - -t (engl. table) 显示存档内容。

    - -x (engl. extract) 解包。

    - -v (engl. verbose) 在处理时显示所有文件。

    - -f (engl. file) 指定文件名。


    使用 Shell

    SuSE Linux


    现在要将目录中的所有文件打包成名为 `test.tar` 的存档，我们至少需要 `-c` 和 `-f` 选项。由于我们要跟踪存档过程，我们加上 `-v` 选项。使用
    `cd` 进入该目录。现在的输入为：`tar -cvf test.tar`。使用 `tar -tf test.tar` 查看内容。这对硬盘上的目录保持不变。要解压存档，您必须输入
    `tar -xvf test.tar`。如果我们想压缩存档文件以节省空间，请不要这样做。

    推荐使用广泛的 `gzip`，即 `gzip test.tar`。现在输入 `ls`，您会看到 `test.tar` 文件消失了，取而代之的是一个 `test.tar.gz`。该文件更小，因此更容易发送。

    现在应该将存档复制到 `test2`。您使用 `cp test.tar.gz test2`。使用 `cd test2` 进入目录。解包以 `.gz` 结尾的压缩文件使用
    `gunzip` 命令，因此输入为 `gunzip test.tar.gz`。我们得到了 `test.tar` 文件，它仍需 `tar -xvf test.tar`
    解析。您也可以直接为 `tar` 命令添加 `-z` 选项并解包压缩存档：`tar -xvzf test.tar.gz`。


    通过输入 `ls` 您将看到有一个与主目录内容相同的新目录。


    # mtools


    `mtools` 组可以操作 MS-DOS 文件系统的命令。这对于磁盘驱动器的工作非常重要。在 MS-DOS 下可以通过 `a:` 调用驱动器。这些命令与
    MS-DOS 下的命令相似，但显示如下：


    - mdir a: - 显示驱动器 `a:` 磁盘的内容。

    - mcopy a:Testdatei a: - 将文件 `Testdatei` 复制到磁盘上。

    - mdel a:Testdatei - 删除 `a:` 上的 `Testdatei`。

    - mformat a: - 使用 `fform` 命令以 MS-DOS 格式格式化磁盘。


    '
