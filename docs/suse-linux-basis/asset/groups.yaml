    在 Konqueror 中调用“设置”条目 $\rightarrow$ 将出现“设置 Konqueror”。在“代理服务器”下，您可以输入相关设置。


    # 常见问题解答


    - 我如何访问 CD/DVD？

    您的 KDE 桌面面上有一个带有 CD 图像的图标。将您的 CD/DVD 插入驱动器，然后用左键点击该图像。CD 将被挂载，内容将通过 Konqueror
    窗口显示。


    - 我的桌面上没有 CD 图标。我该如何创建一个？

    在桌面上点击右键。从菜单中选择“新建...” $\rightarrow$ “光驱 CD-ROM...”。会弹出一个窗口。在“常规”下，您可以更改桌面上图标的名称。在“设备”下，您可以设置您的
    CD 或 DVD 驱动器设备。


    - 我可以将控制栏放在任何地方吗？

    可以的。用左键点击一个区域并拖动到任意边缘。释放鼠标后，控制栏将移动到那里。


    - 我想要独立的控制栏。可以吗？

    可以。在现有控制栏的区域上点击右键。选择“添加” $\rightarrow$ “扩展” $\rightarrow$ “依赖控制栏”。会打开一个控制栏。现在您可以通过
    Konqueror 将文件或文件夹拖到那里。或者在栏上点击右键，从“添加”菜单项中选择相应的项目。


    - 我如何将程序等添加到控制栏中？

    这里有两种方法：

    1. 在控制栏的区域上点击右键。会弹出一个弹出菜单。选择“添加” $\rightarrow$ “按钮”，您将看到 K 菜单中出现的条目。现在您可以将您喜好的类别“添加此菜单”放置到控制栏上。或者直接点击一次选择所需的程序。在这两种情况下，控制栏上都会出现相应的图标。

    2. 您也可以直接从 Conqueror 中用左键点击程序、文件夹等，按住并将其拖到控制栏上。


    # 我想了解更多关于我的系统信息。我该如何做？


    有两种方法：按下组合键 Alt + F2 并输入命令 `ksysquery`。会弹出一个窗口。在窗口左侧的所谓“传感器浏览器”中，您可以点击显示的模块并将其回主窗口。另一种方法在控制中心中。在“信息”下，包含了所有与您的计算机关联的资源和设备。


    # 我如何显示 PostScript 或 PDF 文件？


    在 KDE 中有一个程序：KGhostview。在第 29 页的 DVI、PostScript 和 PDF 查看器章节中，您可以获得更多信息。


    # 我如何显示图形文件？


    您可以通过菜单输入“文件”、“打开”并输入 `kview` 来启动它。该程序支持多种图形格式。


    # 我如何播放我的 WAV、MP3 文件？


    可以，按下 Alt + F2 并输入 `noatun`。会弹出一个窗口；通过“文件”、“打开”菜单加载加载音频文件。


    # 我如何播放音频 CD？


    将音频 CD 插入驱动器，启动程序 `noatun` (Alt + F2) 并输入 `noatun`。您可能还需要调整音量。您可以使用 `kmix` 程序完成此。


    # 我如何连接互联网？


    通过 Kinetner 程序。详细描述请参阅第 33 页的“Kinetner – 通往 WWW 之路”章节。


    # 我如何阅读邮件？


    KMail 程序可以帮到您。在《程序》一书中会有详细描述。


    # 更多信息


    如果您需要更多关于 KDE 的信息，一定可以在以下网站之一找到答案：


    - http://www.kde.org KDE 官方网站。

    - http://www.konqueror.org 关于 Konqueror 程序的所有信息。

    - http://il8n.kde.org KDE 国际化。

    - http://kde.themes.org 关于 KDE 设计、主题等的一切信息。

    - http://artist.kde.org 关于 KDE 图标、剪贴画等的一切信息。

    - http://lists.kde.org 关于 KDE 所有主题的邮件列表列表。

    - http://bugs.kde.org 在这里可以找到所有 KDE 的错误。

    - http://www.gnupg.org 加密软件。


    # KDE – 配置


    在本章中，我们将向您展示如何使用控制中心更改外观，以及如何配置文件管理器、网络浏览器等……


    | 主题 | 页码 |

    | :--- | :--- |

    | 引言 | 38 |

    | 连接的设备 | 39 |

    | 文件显示 | 40 |

    | 电源角色 | 41 |

    | 外观 | 42 |

    | 信息 | 46 |

    | 声音 | 46 |

    | 网络 | 48 |

    | 个人设置 | 50 |

    | 系统 | 52 |

    | 浏览器 | 53 |


    # 引言


    在本章中，我们将向您展示如何使用控制中心更改外观，以及如何配置文件管理器、网络浏览器等……


    控制中心被分为一个栏以及左侧和右侧区域。在左侧区域找到配置。在右侧通常会有这些按钮：


    - 帮助：显示一段文本。

    - 使用预设：恢复默认设置。

    - 应用：应用已更改的设置。

    - 重置：恢复到原始值。


