    ```


    Dieses kleine Programm gibt bei Aufruf die aktuelle Systemzeit aus. Darüber hinaus
    ist es möglich, die Systemzeit als root durch diesen Befehl zu verändern. Details
    hierzu sind in der Manual nachzulesen (Manual-Page of date (man date)).


    ## Prozesse


    ```

    top [Option(en)]

    ```


    Durch top erhält man einen schnellen Überblick über die gegenwärt laufenden Prozesse.
    Durch Druck der Taste h wird eine Seite mit Erklärungen der wichtigsten Optionen
