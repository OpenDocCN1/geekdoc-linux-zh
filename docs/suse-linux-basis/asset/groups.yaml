    # 8


    Im Grunde genommen ist die Auswahl des richtigen Tisches sehr einfach. Er soll
    möglichst breit und tief sein. Dazu wäre eine individuelle Einstellung der Tischhöhe
    optimal. Luxus sind Arbeitstische, an denen zwischen Sitzen und Stehen wechseln
    kann die Tischplatte (z. B. besonders bequem per Knopfdruck) zu Stehpult macht,
    ein Wechsel zwischen den Belastungsformen Sitzen und Stehen bringt Entlastung.


    +   - Die flexible Anordnung von Arbeitsmitteln benötigt eine Tischplatte von
    mindestens 160 x 80 cm.

    - Für das Arbeiten werden Arbeitsplätze mit mehreren verketteten Platten empfohlen.

    - Die Tischhöhe muss bei höverstellbaren Tischen 72 cm betragen, höverstellbare
    Tische müssen mindestens von 68 bis 72 cm verstellbar sein. Eine verstellbare
    Höhe ist in Deutschland nicht vorgeschrieben, ergonomisch sinnvoll.

    - Die DIN-Norm fordert für bestimmte Arbeitsaufgaben wie. B. für CAD-Aritsplätze
    mehr Breite. Ein Wechsel zwischen Bildschirm und Arbeit mindestens 200 cm.

    - Die Einraumbreite muss mindestens 60 cm betragen. Erfahrungsgemäß ist die nach
    der Norm zur Verfügung stehende Befreiheit allerdings klein.

    - Bei der Verwendung von großen Bildschirmen sollten 100 oder sogar 120 cm tiefe
    Fläche benutzt werden.

    - Die Tischoberfläche sollte Farben vermeiden und reflexionsarm sein (deswegen
    sind viele Möbel aber nur in dezentem Grau erhältlich).


    # Richtig Sitzen auf dem richtigen Arbeitsplatz


    Sitzen in einem Arbeitsstuhl erzwingt eine statische Dauerhaltung als das „Lümmeln“
    in einem Erholungszustand. Ständiges falsches Sitzen, wie etwa nach vorne gebegt
    oder verdreht, beeinflchtigt die Atmungs- und Verdungsorgane. Es führt zu vorzeitiger
    Ermüdung, Durchblungsstörungen und durch die hohe Belastung der Wirbelsäule und
    Bandscheiben zu Rückenschmerzen. Im Extremfall können bei jahrelanger falscher
    Belastung sogar Muskel- und Skeletterkrankrankungen auftreten.


    Eronomie am Arbeitsplatz


    SuSE Linux - Basis 151'
