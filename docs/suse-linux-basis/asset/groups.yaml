    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_118_0.png)


    图 6.11：使用 YaST2 进行用户管理


    ## 系统安全


    在“本地安全配置”启动界面中（您可以在“安全与用户”下访问到该界面），有四个点需要应用：

    级别 1 适用于单机电脑（已预配置），级别 2 适用于带网络的工作站（已预配置），级别 3 适用于带网络的服务器（已预配置），而“自定义”则用于自行设置。


    如果您选择前三个点之一，则可以根据需要采用相应的预配置系统安全设置。为此请点击“完成”。在“详细信息”下，您也可以访问各个设置，并根据需要进行更改。如果您选择“自定义”，点击“下一步”将自动进入不同的对话框。在这些，您将看到安装时推荐的默认值。


    - 1. ‘密码设置’


    在此处，您可以规定未来用户密码的最小和最大长度。设置为五到八个字符是有意义的。此外，您还可以设置在过期前多少天以及多久发出警告（警告将作为消息在登录文本控制台时）。


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_119_0.png)


    图 6.12：使用 YaST2 创建新组


    - 2. ‘系统启动设置’


    此界面涉及两个方面。首先：应该如何解释 Ctrl Alt+Ent 组合键？

    通常情况下，这会导致文本控制台的系统重启。您应该将其保持原样，除非您的计算机或服务器是公开访问的，且您担心有人执行未经授权的操作。

    如果您选择“停止”，该组合键将导致系统关闭；如果选择“忽略”，该组合键将无效。其次：系统是否允许从 KDM（KDE 显示管理器 – 图形化登录界面）关机？是“仅限
    Root”（即系统管理员）、“所有用户”、“匿名”还是“本地用户”？如果您选择“匿名”，则系统只能从文本控制台关机。


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_120_0.png)

    图 6.13：使用 YaST2 进行组管理 (img/7c7b5e54e6579952ad3fd8bde9e1a136_config)


    - 3. ‘登录设置’


    通常在登录尝试失败后会有几秒钟的等待时间才能再次登录。引入此机制增加了“密码黑客”的难度。此外，您还可以启用“记录失败的尝试”和“记录成功的尝试”。如果您怀疑有人在尝试破解您的密码，可以检查
    /var/log 下系统文件中的条目。


    - 4. ‘新用户设置’


    每个用户都有一个数字 ID（UID）和一个用户标识符（用户名）。这是通过 /etc/passwd 文件实现的，并且应该尽可能唯一。通过这些数据，您可以规定在创建新用户时分配哪些范围。对于用户来说，最小值为
    500是有意义的，且不应低于此值。


    - 5. ‘其他设置’


    在‘权限设置’中，有三个选择：“简单”、“安全”和“偏执”。对于大多数用户来说，第一个可能足够了。YaST 会为您提供关于这三个安全级别的信息。


    ‘偏执’设置是极其严格的，应仅作为例外使用。如果您选择了此项，在使用某些特定程序时可能会遇到干扰。您将不再拥有访问不同文件的权限。此外，您可以在此对话框中指定用户，该用户将在每天启动后自动创建一个数据库
    (locatedb)，该数据库存储了您计算机上的每个文件。可以使用 `locate` 命令进行搜索。如果选择了‘匿名’，则任何用户（包括其他非特权用户）都可以在数据库中找到路径。如果选了
    root，则将列出所有本地文件。


    此外，还可以激活‘从用户路径中移除当前目录’这一项。建议选择此项。最后，有‘禁用用户的 Telnet 登录’选项。选择此处完成安全配置。


    ## 安装/删除软件


    “软件”下的模块允许您在计算机上安装额外的软件。此外，可以删除程序以腾出磁盘空间。如果您想从 CD 安装，请将光盘放入驱动器。


    在对话框中，左侧显示软件包（pay），右侧显示您选择的所有软件包。计算机上已安装的软件包标记为 i。选择或取消软件包的方法是双击该行并点击‘确定’。要安装的软件包标记为
    X，要删除的软件包标记为 d。如果软件包需要额外的包，YaST 会自动选择它们（标记为 a），或者您也可以从候选软件包中进行选择。


    '
