    + F2 drücken und dann xterm eingeben. Damit Sie „Terminal“, in dem Sie Befehle
    eingeben können.


    # 6. Ich finde Programme im KDE nicht.


    Sie können alle Programme von einem Terminalfenster (xterm, s. o.) aus starten,
    indem Sie den Programnamen gefolgt von


    # 7. Was ist ein Mirror? Warum soll ich die Sachen nicht von ftp.com ziehen?


    Da es viele Anwendungen gibt, die selbst Zeit als Server brauchen, wäre er sehr
    schnell überlastet. Deswegen gibt es einen anderer FTP-Server, der ein „Spiegelbild“
    des SuSE-Servers behält. Ein solcher Server wird auch als „Mirror“ genannt. Man
    sollte sich immer an einen Mirror in der Nähe (d.h. gleiches Land) wenden, der
    Download geht dann auch schneller. Eine Liste finden Sie z. B. auf http://www.suse.de/de/support/download/ftp/.


    # 8. Ich finde keine .exe-Dateien. Wo sind die ganzen Programme?


    Unter Linux sind ausführbare Dateien ohne Datei-,Erweiterung. Die meisten Programme
    befinden sich in /usr/bin und /usr/X116/bin.


    # 9. Woran erkennt man ausführbare Dateien?Mit dem Befehl


    ls -l /usr/bin sehen Sie z. B. alle ausführbaren Dateien im Verzeichnis /usr/bin
    in roter Farbe. Diese erkennt sich auch am ''x'' in der ersten Spalte


    ```

    -rwxr-xr-x  1  root      64412 Jul 23 15:23 /usr/bin/ftp

    ```


