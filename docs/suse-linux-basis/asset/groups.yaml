    Unter dem Reiter ‘Erweitert’ können Sie den Nummernblock (Eintrag ‘Zahlenblockssperre‘
    bei KDE-Start) und die Tastenwiederholung einstellen.


    # Dateianzeige


    Das Menü beinhaltet die Module ‘Dateimanager’ und ‘Dateizuordnung’.


    **Dateimanager** Dieses Modul besitzt die Einstellungmöglichkeiten ‘Verhalten’,
    ‘Er-Erscheinungsbild’ und ‘Mülleimer’.


    Unter ‘Verhalten’ können Sie festlegen, ob Verzeichnisse in einem separaten Fenster
    geöffnet werden sollen. Hilreich ist die Option ‘Netzwerkkororgänge in einem Fenster
    anzeigen’. Sie „sammelt“ alle Vorgänge in einem einzigen, übersichtlichen Fenster.


    ‘Erscheinungsbild’ legt die Optik der Konfigur-Fenster (Schriftart, Schriftgröße,
    ...)


    Einstellungen zu Mülleimer finden Sie im gleichnam Reiter.


    **Dateizuordnung** Weisen bestimmten Programmen Datetypen zu – auch ‘MIME’-Typen
    (engl. Multipurpose Internet Mail Extension) welche sich auf Dateihänge in E-Mails
    beziehen. Zur Zuordnung helfen Regeln für die Erkennung einer Date, Beschreibung
    und Symbol werden eine Liste der Programme beim Öffnen des Datetyps. Alle Zuordnungen
    werden einen der Typ ‘application (Anwendungen), ‘audio’ (Audiodaten), ‘image’
    (Bilder), ‘inode’ (Sonderdateien), ‘message’ (Nachrichten), ‘print’ (Drucksystem),
    ‘text’ (Text) oder ‘video’ (Videodaten) zugeordnet und im Listenfeld unter ‘Bekannte
    Typen’ angezeigt.


    Die Funktionsmöglichkeiten im Überblick:


    Für die automatische Suche nach einem MIME-Typ geben Sie diesen Bezeichnung ‘Dateimanister’
    suchen ein (siehe Abb. 4.2 auf der nächsten Seite). Die manuelle Suche erfolgt,
