    # Der Editor vi


    Die Bedienung des vi ist etwas gewöhnungsbedürftig. Er wird gegenüber allen anderen
    Editoren vorgezogen, weil er zum einen auf jedem UNIX-ähnlichen Betriebssystem
    zur Verfügung steht und bei Linux zum standardmäßigen Installationsumfang gehört;
    außerdem, wird seine Bedienung eindeutig ist und dadurch in der Regel keine Missverständnisse
    auftreten. Außerdem: wenn nichts geht, geht vi immer noch. Die nun folgende Kurzanleitung
    sollte Sie in die Lage versetzen, mit Hilfe vi z.B diverse Konfigurationsdateien
    zu editieren. Konzept: Der vi kennt 3 Betriebsarten (Modi):


    +   - Befehlsmodus (engl. command mode)

    Jeder Tastendruck wird als Teil eines Befehls interpretiert.


    +   - Einfügemodus (engl. insert mode)

    Tastruckbefehmodus werden als Texteingaben interpretiert.


    +   - Komplexbefehmodus (engl. last line mode)

    Für komplexere Befehle, die in der letzten Zeile editiert werden.


    Die wichtigsten Befehle des Befehlsmodus sind:


    +   i wechselt in Eingabemodus (Zeichen werden an der aktuellen Cursorposition
    eingegeben)

    a wechselt in Eingabemodus (Zeichen werden nach der aktuellen Cursorposition eingegeben)

    A wechselt in Eingabmodus (Zeichen werden am Ende der Zeile angehängt)

    R wechselt in Eingabemodus (überschreibt den alten Text)

    r wechselt zum Überschreiben eines einzelnen Zeichens im Eingabmodus

    s wechselt in Eingabemodus (das Zeichen, auf dem der Cursor steht, wird durch
    die Eingabe überschrieben)

    C wechselt in Eingabemodus (der Rest der Zeile wird durch den neuen Text ersetzt)

    O wechselt in Eingabemodus (nach der aktuellen Zeile wird eine neue Zeile eingefügt)

    O wechselt in Eingabemodus (vor der aktuellen Zeile wird eine neue Zeile eingefügt)


