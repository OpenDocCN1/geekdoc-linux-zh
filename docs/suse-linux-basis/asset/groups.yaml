- md: '

    ## Gutes Licht für gute Arbeit


    Im Allgemeinen erreicht die Arbeitsplatzbeleuchtung annähernd eine Leuchstärke,
    wie wir sie im Freien antreffen. Dieser Unterschied fällt dem Menschen nicht auf,
    da der menschliche Wahrnehmungsapparat flexibel ist. Der Einfluss der Lichtverhältnisse
    auf die eigene Leistungsfähigkeit wird oft unterschätzt. Wenn es zu hell ist,
    kann man es zu dunkel, sich die Bildschirmdarstellung nicht gut erkennen. Eine
    falsche Beleuchtung verursacht eine Überbeanspruchung des visuellen Systems und
    in letzter Konsequenz Merkbeschädigungen und Überlastungssymptome.


    Inzwischen geht man davon aus, dass eine Kombination von Allgemebeleuchung und
    individueller Arbeitsbeleuchtung optimal ist. Für den Arbeitsplatz ist die Kombination
    aus lichtstarken Deckenlicht (500 Watt) und im Fall mit einer oder zwei Arbeitsplatzlicht
    zu empfehlen. Die in Büros gängigen Leuchstoffröhren für die Allgemebeleuchtung
    sollten durch individuelle Arbeitsplätze ergänzt werden. Die Beleuchtung sollte
    aber nicht zu stark und individuell regelbar sein. Hohe Kontraste sollten vermieden
    werden. Vorsicht also bei starkem Einzelplatzlicht; es verhält sich auch so, dass
    eine gute Beleuchtung sehr teuer ist, und die Mindestanforderungen an die Beleuchtung
    mit billigeren Lichtanlagen erfüllt werden können.


    - Einmal sollte die Möglichkeit gegeben sein, das Tageslicht überhaupt wahrzunehmen.
    Eine Sicht nach außen ist wichtig.

    - Als angenehm wird beurteilt, wenn die Allgemebeleuchtungsstärke nicht über 250
    lx (gefordert werden mindestens 500 lx, für ein Großraumbüro 1 000 lx).

    - Das individuelle Arbeitsplatzlicht sollte den Arbeitsbereich mit 500 - 750 lx
    ausstrahlen. Lichtquellen sind allerdings oft problematisch, weil sie bei entspre
    Stärke einen zu großen Leuchdichteunterschied zur Allgemebeleuchtung erzeugen.
    Harmonische fließende Übergänge werden als angenemer empfunden.

    - Die Beleuchtung soll auf allen Fall flimmer- und flackerfrei sein. (Bei allen
    hellschwachen Leuchstoffröhren manchmal im Augenwinkel ein Flackern bemerken.)

    - Dunkle Schatten sollten vermieden werden.

    - Deckenlicht schräg seitlich von oben ausstrahlen, die Leuchtbänder sollten versetzt
    zum Bildschirm angeordnet sein. Die Blickrichtung bei Bildschirmarbeit sollte
    parallel zum Leuchtband folgen.


    SuSE Linux - Basis

    153


    - Ob Beleuchtung als angenehm empfunden wird, hängt von der Farbtemperatur und
    Lichtfarbe des Lampenty ab. Es werden die Lichtfarben warm- oder neutralweiß empfohlen.

    - Der Lichtbedarf hängt nicht nur von der Arbeitsaufgabe sondern auch vom Alter
    ab: Ältere Menschen brauchen mehr Licht. Dass ältere Menschen nur eine kleine
    Lampe in der Wohnung brennen lassen, hat auch nichts mit dem Lichtbedarf zu tun,
    sondern mit der Tatsache, dass Strom gespart wird.

    - Der tageslichtna Bildschirmarbeitsplatz setzt optimale Abschirmung gegen Direkt-
    und Reflexblendung voraus, insbesondere, wenn der Blick direkt oder im 45°-Winkel
    zum Fenster herausgeht. Die eingebauten Blendschutzvorrichtungen sollten individuell
    einstellbar sein. Aber auch künstliche Beleuchtung auf dem Bildschirm kann Reflexblendung
    verursachen.


    ## Prima Klima hier


    Das Raumklima bestimmt in starkem Maß unser Wohlbefinden. Ist es zu kalt, zu warm,
    zu zugig oder zu trocken, kommt es häufiger zu Problemen. Bei geringer relativer
    Luftuchtigkeit können Augen, trockene Schleimhäute und höhere Anfälligkeit für
    Erkältungskrankheiten die Folgen. Kompliziert wird es, wenn Personen in einem
    Raum arbeiten, die sich an unterschiedliche Temperaturen gewöhnt haben. Wichtig
    für das Wohlbefinden ist die Einhaltung von optimalen Grundwerten für die Temperatur,
    die Luftfeuchtigkeit und zusätzlich die Vermeidung von starker Luftbewegung. Dabei
    sollten die Arbeitsmittel selbst nicht dazu beitragen, die Temperatur zu erhöhen.


    - Für sitz oder leichte Tätigkeiten wird eine Raumtemperatur von 20 bis 22°C empfohlen.
    Im Sommer sollte die Temperatur höchstens 26 °C betragen, dieser Wert soll bei
    hohen Temperaturen für kurze Zeit überschritten werden.

    - Es ist zu beachten, dass nicht nur Menschen, sondern auch andere Geräte Wärme
    und das Raumklima beeinflussen. Dies sollte soweit als möglich reduziert werden.

    - Die Luftfeuchtigkeit sollte zwischen 40 (manchmal 50) als Prozent liegen und
    kontrolliert werden. V. a. durch Heizungen wird dieser Wert beeinflusst.

    - Zugluft (z. B. durch offene Fenster und Türen oder durch die Klimaanlage) sollte
    nicht über 0,1 bis 0,15 m/s liegen. Ein Zug auf einzelne Körperteile sollte vermieden
    werden.

    - Eine Klimaanlage sollte individuell einstellbar sein. Es ist auf regelmäßige
    Wartung zu achten.

    - Die Fenster sollten sich öffnen und Sonnenschutzeinrichtungen gegen Blendeneinwirkungen
    besitzen. Sonnenlicht kann die Raumtemperatur stark aufheizen. Äußere Sonnenschutzeinrichtungen
    geben den besten Schutz.

    - Pflanzen können das Raumklima verbessern, sie sind daher von jedem Fall zu empfehlen.
    Sie erhöhen die relative Luftfeuchtigkeit und filtern Schadstoffe aus der Luft.


    ## Zu viel Lärm macht Stress


    Lärm ist ein körperlicher Stressor, der psychischen Stress auslöst. Auch wenn
    er vermehrt wird, macht Lärm krank. Neben gesundheitlichen Beeinträchtigungen
    wie Schwerhörigkeit, vegetativen Störungen und psychischen Veränderungen beeinträchtigt
    Lärm die Konzentrationsfähigkeit unseres Leistungsvermögens. Neben gesundheitlichen
    Beeinträchtigungen wie Schwerhörigkeit, vegetativen Störungen und psychischen
    Veränderungen beeinträchtigt Lärm die Konzentrationsfähigkeit unseres Leistungsvermögens.
    In vielen Fällen führt Lärm zu Unzufriedenheit. Eine ruhige Umgebung ist für die
