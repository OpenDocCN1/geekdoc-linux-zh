    ```

    killall [Option(en)] Processname

    ```


    Dieser Befehl funktioniert äquivalent zu kill, wobei ein des Prozess-Namens ausreicht,
    um alle so nennenden Prozesse zu „töten".


    ## Netzwerk


    ```

