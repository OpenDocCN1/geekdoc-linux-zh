  mdcn: '


    ## /usr (Unix 系统资源)


    许多程序从此目录获取文档、信息、帮助文本和其他重要数据。


    ## /bin 和 /sbin (可执行程序)


    在这些目录中可以找到许多与系统相关的程序，它们是系统启动时所需的。


    ## /opt (可选软件)


    商业软件或不属于系统的大型程序（例如 KDE、Netscape、Mozilla 等）存放在此处。


    ## /etc (配置文件夹)


    这里汇总了包含您的计算机配置信息的文件。它们包含了关于网络连接、计算机启动模式或单个程序（如备份）的信息。


    ## /boot (系统启动目录)


    系统启动所需的文件和程序，例如内核 (Kernel)。


    ## 其他


    此外，还有其他文件夹包含有关系统和已连接设备的信息：


    /lib 和 /usr/lib（库文件）、/var（可变数据）、/proc（进程）、/media（可移动介质，如软盘、CD 等）/dev（所有连接的设备，如打印机、硬盘、键盘等.）


    更多信息请参阅第 123 页的“文件与目录”章节。


    ## 关于密码和用户


    -   我为什么需要密码？密码是访问主目录（Home directory）的钥匙。与其他操作系统不同，Linux 是一个真正的多用户系统。这意味着 SuSE
    Linux 独立管理每个用户的数据和设置，此外不同的用户还可以同时在同一台计算机上工作。想象一下，您的计算机有两个键盘和两个显示器，您和另一位用户同时在同一台电脑上工作，且互不干扰。


    在实践中，键盘和屏幕位于同一个房间内，因此也是通过网络连接的，您甚至察觉不到有第二个用户也在使用系统，Linux 会智能地将现有的计算资源分配给已登录的用户。


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_18_0.png)


    每个用户都拥有一个仅属于他自己的目录，那里是他的“家”。在主目录中，存储了所有的所有的数据以及对程序进行的所有设置，例如浏览器的书签列表和邮件程序的地址簿录。出于安全考虑，该区域受密码保护。只有通过此密码才能访问您的个人文件。


    -   为什么我能读取某些数据但不能删除？


    因为您没有相应的权限。通过输入密码，计算机不仅能识别您的主目录，还能识别赋予您作为用户所需的权限，即您在计算机上可以做什么以及不能做什么。当然，您可以查看
    `/etc` 中的大多数文件，但只有系统管理员可以修改它们。涉及系统安全和稳定性的目录对您来说要么是只读的，要么完全锁定。


    ```

    ./images/png/um_rechte.png

    ```


    对于您主目录中的数据，您可以自行决定向其他用户隐藏哪些内容，以及开放哪些内容供共同编辑。右键点击该文件，然后选择“属性”菜单项。您甚至可以通过在数据名称前加一个点来完全隐藏它。


    -   我该如何添加或删除用户？


    新用户由 root 创建。如您所知，每当有需要管理的事或需要创建新用户时，您必须以 root（系统管理员）身份登录计算机。以普通用户身份启动 YaST2 控制中心，选择“安全与用户”密钥并输入
    root 密码。在右侧字段中会出现一系列选项，其中包含“创建新用户”项。填写字段（名和姓）后，将创建一个新用户并设置密码。


    在输入密码时，必须区分大小写。密码长度应至少为五个字符，且不包含特殊字符（例如重音符号）。允许的字符有 `#*,;-_+$%&/![]`，空格以及 0 到
    9 的数字；建议选择约 8 个字符的长度。为了确保密码输入正确，必须在第二个字段中不带符号的情况下重复一遍。重要：请牢记密码！


    所谓的用户名（登录）是作为整个名称的一部分生成的。您可以为 YaST2 建议一个用户名。您可以更改它或输入自己的名称。名称不能包含小写字母（如变音符号）、数字和字符
    `_`。用户名的限制比密码更严格。


    当您使用 Linux 时，请使用此用户名和密码登录系统；这一过程也称为登录（Login）。


    如果您想删除用户，请选择“创建和编辑用户”。选择该用户并点击“删除”。


    ## 挂载、Shell 及其他


    -   什么是 mount（挂载）？


    因为有了挂载，您不能直接从驱动器取出软盘。它必须先被挂载才能被读取。无论是软盘、硬盘、CD 还是 USB 闪存——所有介质在 Linux 中都必须先挂载才能访问。这是通过
    `mount` 命令完成的。


    为什么是这样？


    在 Linux 系统中，始终可以通过多种路径到达目标。这在开始可能有些困惑，但有很多益处。如果某个功能失效或被锁定，您可以通过其他方式告知计算机执行这些命令。


    想象一下，如果有人仅仅因为不能从驱动器取出抽屉就更换抽屉。它们必须先挂载才能被读取。无论是软盘、硬盘、CD 还是 USB 闪存——所有介质在 Linux 中都必须先挂载才能访问。这是通过
    `mount` 命令完成的。


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_21_0.png)


    -   为什么我不能简单地关闭计算机？


    您可以关闭，只是这种日常操作并不特别友好。可能除了您之外，还有另一位用户正连接在您的计算机上工作。如果您直接关闭系统，尚未保存的数据将面临危险。


    当然，这同样适用于您自己的数据，但如果您按正常退出，就可以确保您的数据是安全的。SuSE Linux 以高数据安全性而闻名，为什么不利用这一特性呢？


    -   一切听从命令！


    在 Linux 系统中，始终可以通过多种路径到达目标。这在开始可能有些困惑，但有很多益处。如果某个功能失效或被锁定，您可以通过其他方式告知计算机执行这些命令。


    例如，您不需要在菜单中通过点击鼠标启动程序，也可以通过键盘输入程序名称，这同样可行。或者您可以使用 `ls` 命令显示文件夹的内容。


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_22_0.png)


    '
