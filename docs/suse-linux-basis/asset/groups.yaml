    如果您的扫描仪未被识别，则该设备可能不受支持。然而，有时即使是支持的扫描仪无法识别。在这种情况下，手动选择扫描仪可能对您有所帮助。如果您可以在制造商和型号列表中找到您的扫描仪，请直接选择它——如果找不到，请务必通过“取消”（Abbrechen）来查找。关于在
    Linux 下运行的扫描仪信息，请参阅 http://cdb.suse.de、http://sdb.suse.de 或 http://www.mostang.com/sane。


    ## 注意


    只有在您确定的情况下，才应对扫描仪进行手动分配。错误的选择可能会导致您的硬件损坏。


    注意


    ## 故障排除


    如果您的扫描仪未被识别，可能存在以下原因：


    - 扫描仪不受支持。您可以在 http://www.suse.de/sdb 找到一个与 Linux 兼容的设备列表。

    - 您的 SCSI 控制器未正确安装。

    - 你的 SCSI 接口存在终接问题。

    - 您的 SCSI 线超过了允许长度。

    - 您的扫描仪带有 Linux 不支持的 SCSI-Light 控制器。

    - 您的扫描仪可能损坏。


    ## 注意


    > 对于 SCSI 扫描仪，严禁在系统运行期间连接或拔掉设备。请先关闭您的计算机。


    注意


    关于扫描的更多信息，请参阅《Die Programme》（Die程序）一书中的“Kooka – 新的扫描程序”章节。


    ## TV 卡


    在启动并初始化此 Yoast2 模块后，首先会显示“设置 TV 卡”对话框。如果您的 TV 卡被自动识别，它将在此处显示。用鼠标点击该行并点击“添加”。如果您的
    TV 卡未被识别，请配置“其他，未识别的”卡，以便您进入手动配置。通过“编辑”按钮，您可以更改现有配置。


    点击“编辑”或在启动 Yoast2 模块后（如果您已经安装并配置了一个或多个 TV 卡），将出现“TV 卡概览”对话框。在此对话框中，您可以编辑每个卡的配置，或通过“添加”开始手动配置。


    在“手动配置”界面中，首先从列表中选择 TV 卡类型。如果您必须选择一种调谐器类型才能获得有效的配置，且您不确定，则应先将设置保持为“默认（已识别）”并确定它们是否有效。如果部分或所有内容无法发送，可能是因为调谐器类型的自动识别失败，或者您选择了错误的调谐器类型。


    在“细节”处，您可以找到专家配置。在这里，可以专门选择作为 TV 卡驱动运行的内核模块以及该参数。您还可以检查 TV 卡驱动程序的所有属性。在此处选择要处理的参数并输入新值。通过“应用”将采用新值，通过“重置”将接受默认值。


    在“TV 卡，音频”对话框中，您可以进行相应的设置，以便您可以使用电脑看电视。通常，TV 卡会随带一根电缆，以便您将声音放置在声卡的音频输入上。此时，声卡必须已经设置好，且外部输入不再处于静音。请在此界面上点击“是”并选择要配置的声卡；请参见第
    86 页的“声卡”部分。此外，您还可以直接锁定扬声器区域，而不通过声卡——假设您本来就从其他地方获取声音（例如外部卫星电视接收器）。也有完全没有音频功能的
    TV 卡，例如用于 CCD 相机。在这种情况下，不需要或在某些情况下无法进行音频配置。


    ## DMA 模块


    一个新的 YaST2 模块允许您在已安装的系统中为您的硬盘和 CD/DVD 驱动器启用或禁用所谓的“DMA 模式”。DMA 模式可以显著提高系统的性能或数据传输速度。


    SuSE Linux 的当前内核在系统安装时会自动为硬盘启用 DMA，并保持禁用状态，因为在过去，对所有驱动器启用默认 DMA 经常会导致 CD 驱动器出现问题。稍后可以通过
    DMA 模块为您的驱动器决定是否启用 DMA。例如，如果您的硬盘运行出现问题，禁用 DMA 可能会有所帮助。相反，如果您启用 DMA 且驱动器支持该模式，则会提高磁盘的数据传输速率。


    > 提示

    > “DMA”（= Direct Memory Access）意味着“直接内存访问”，即磁盘可以直接将数据传输到内存中，而无需经过进程控制的“迂路路”。


    ## 互联网接入


    ### 互联网连接的基础


    这里将介绍了互联网连接的关键术语，并简要说明了它们的目的和功能。

    互联网上的所有计算机构成了一个巨大的网络，不同的操作系统在其中运行。为了让互联网上的任何计算机相互通信，必须使用通用的协议，即互联网协议 (IP) 以及传输控制协议
    (TCP)、用户数据报协议 (UDP) 和互联网控制消息协议 (ICMP)。


    互联网上的每台计算机都有一个标识号，即所谓的 IP 地址，且仅通过此号码就可以通过 TCP/IP 进行访问。通常，一台计算机还有一个文本名称，可以在应用程序中对其进行标识。为了将
    IP 地址转换为文本名称，有了域名系统 (DNS)。这是一个提供名称服务的特殊服务，称为服务器（例如 DNS 服务器）；请求该服务的计算机或程序称为客户端。


    在 TCP/IP 之下，有多种标准协议用于根据传输类型传输 TCP/IP 数据——例如，网络连接使用以太网，调制解调器和 ISDN 链路使用点对点协议 (PPP)，ADSL
    连接使用点对以太网 (PoE)。


    建立互联网连接，必须首先建立以太网、PPP 连接，然后在本地计算机与互联网提供商之间建立 TCP/IP 连接。

    在 TCP/IP 之上，有多种标准协议可以根据需要传输数据：


    - 超文本传输协议 (HTTP) 用于传输 HTML（超标记标记语言）格式的 WWW 页面

    - 通过简单邮件传输协议 (SMTP) 将电子邮件发送到另一台计算机，并通过邮局协议三 (POP3) 在需要时从邮件服务器下载电子邮件

    - 为了传输数据，使用了文件传输协议 (FTP)


    为了让不同的应用程序（例如 Web 浏览器和电子邮件程序）能够共同使用同一个互联网连接，实际上每个应用程序实际上都使用一个独立的 TCP/IP 连接，并将大量的
    TCP/IP 数据拆分成小数据包，以便交替传输，例如浏览器的 HTTP 包通过此 TCP/IP 连接传输，而电子邮件程序的 SMTP 或 POP3 包则通过其他
    TCP/IP 连接传输。


    '
