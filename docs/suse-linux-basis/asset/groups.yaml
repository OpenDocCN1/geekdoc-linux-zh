    Die Fähnchen stehen symbolisch für die Sprache der Dokumentationskontexte. Wählen
    Sie aus der Liste der möglichen Quellen eine aus, in denen nach dem Stichwort
    gesucht werden sollen, indem Sie das Kästchen vor der jeweiligen Quelle markieren.
    Haben Sie alle Einstellungen vorgenommen, betätigen Sie ‘Suche’. Nach Themenbereichen
    gegliedert, erhalten Sie rechts die Suchergebnisse.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_177_0.png)


    **Abbildung 9.3:** Die inhaltliche Suche


    - * ‘Inhalt’ – Hier finden Sie die Themenbereiche der Startseite aufgelistet (s.
    Abb. 9.3). Sie können sich die zu jedem Themenbereich den Dokumentationsquellen
    anschauen, indem Sie auf den Themenbereich mit der Maus klicken; durch erneutes
    Klicken schließen Sie den Themenbereich wieder. Aktivieren Sie eine Dokumentationsquelle,
    öff sich im rechten Fenster der zugehörigen Text. Zusätzlich erhalten Sie nur
    hier die ‘Lernhilfen’ zu KDE, unter denen Sie Begriffserklärungen für eine eindeutige
    Zuordnung von verwendeten Begriffen und Objekten im Umgang mit der KDE-Hilfe finden.
    Um weitere Dokumentationsquellen zu installieren, klicken Sie auf ‘Nicht installierte
    Dokumentation’ und wählen Sie aus dieser Liste die entsprechenden Dokumentationspakete
    aus.


    168 SuSE Hilfe


    ## KDE-Hilfe


    Die KDE-Hilfe ist zwar in deutscher Sprache verfügbar, aber einige Texte stehen
    nur in englischer Sprache zur Verfügung. Sie enthält Informationen zu KDE sowie
    deren Programme und zur Konfiguration der grafischen Oberfläche. Die KDE-Hilfe
    ist vollständig in der SuSE Hilfe integriert (s. Abb. 168). Falls Sie das ursprüngliche
    „KDE Hilfezententrum“ bevorzugen, können Sie es über den Rettungsring (ohne Geeko!)
    bzw. über ''Hilfe'' im ''K-Menü'' starten.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_178_0.png)


    **Abbildung 9.4:** Die Startseite der KDE-Hilfe


    ## Support-Datenbank


    Für viele Frage- und Problemstellungen haben wir die Antworten und Lösungen schon
    gefunden. Wir stellen diese in einer Vielzahl von Artikeln in unserer Support-Datenbank
    rund um die Uhr zur Verfügung: http://sdb.suse.de.


    Neben diesem Online-Angebot ist der Inhalt der Support-Datenbank auch im Paket
    sdb_de, Serie doc auf Ihrer SuSE Linux-CD enthalten. Sie können die Artikel mit
    jedem Browser lesen.


    Tipp

    > Zum schnellen Starten und Suchen eignet sich in der URL-Zeile des Konors Befehl
    sdb: gefolgt von dem gesuchten Stichwort.


    Tipp


    ## Man-Pages


    Die Man-Pages sind der traditionelle Weg unter Unix, eine Beschreibung zur Anwendung
    von Programmen bzw. Befehlen sowie C-Funktionen zu erhalten. Dabei werden alle
    Parameter und Optionen erläutert, den Befehl präzisieren. Es gibt Man-Pages in
    deutscher Sprache (Paket man-pages-de), aber die englischen sind nicht unvollständiger
    sondern auch aktueller.


    Die Unterteilung erfolgt in den folgenden Bereichen, der grundsätzlich beim Aufruf
    der Man-Pages und in vielen Unix-Büchern angegeben wird:


    - 1. Benutzerkommandos

    - 2. Systemaufrufe

    - 3. C-Funktionen

    - 4. Dateiformate, Gerätedate

    - 5. Konfigurationsdateien

    - 6. Spiele

    - 7. Diverses

    - 8. Systemadministration

    - 9. Kernel

    - 10. Neue Kommandos


    Der Aufruf der Man-Pages erfolgt über die folgenden Möglichkeiten:


    ```

    **Konsole** Im Textmodus folgt die folgende Syntax zum Aufruf der Man-Pages:

    man <Bereich> <Komando>; um das Kommando aus allen Bereichen anzuzeigen, mit der
    Option -r,-k wie z. B. man -k <Komando>.

    ```


    ```

    **Konqueror** zur Eingabe in das URL-Field: man/<Komando>(<Bereich>)

    ```


    SUSE Hilfe können Sie in den verschiedenen Man-Pages nach Bereichen geordnet herumblättern
    oder nach Stichwörtern suchen. Sie finden die Man-Pages in den Themenbereich ''Kommandos
    / Funktionen'' unter ''Man-Pages''.


    ## Info-Pages


    Info-Pages haben sich für komplexere Befehle etabliert und beschreiben nicht nur
    Optionen und Parameter, sondern erklären den Einsatz und die Anwendung der Befehle
    ausführlicher; meist anhand entsprender Beispiele. Standardmäßig werden Info-Pages
    mit dem Dateibetracher Emacs bzw. dem Infoviewer (info) abgerufen.


    Konsole Sie haben zwei grundsliche Möglichkeiten:


    - info zeigt eine Liste der verfügbaren Info-Pages.

    - info -apropos <Komando> – Info-Pages zum Thema „Komando“

    - info <Komando> öffnet den Emacs mit der Beschreibung des Befehls, „Komando“


    Quellen geben sich in der URL-Field ein: info:/<Komando>. Im Browser können Sie
    die Links in gewohnter Weise durchklicken.


    SuSE Hilfe in der SuSE Hilfe (abschnitt SuSE Hilfe) finden Sie die Info-Pages
    in dem Themenbereich ‘Kommand / Funktionen’. Die Startseite ist eine Übersicht
    über Infoseiten, die in HTML-Version angezeigt werden.


    ## Howtos


    Howtos sind ausführliche praxisbezogene Anleitungen zur Installation und Konfiguration
    unter Linux, die Sie im Verzeichnis /usr/share/doc/howto/ finden. Sie liegen in
    englischer und (umfangreich) in anderen Sprache vor. Für die HTML-Version benutzen
    Sie Paket hotodeh, jedoch hotodeh, Serie doc.


    Im Verzeichnis doc/howto der ersten CD befinden sich aktuell die wichtigsten HOWTO-Dateien.
    Es lohnt auch ein Blick in dieses Verzeichnis, da diese Dateien unkomprimiert
    sind und nach der Installation bequem gelesen können. Konsole Sie können die Howto-Texte
    über die Konsole mit dem Befehl less anzeigen, wenn diese komprimiert sind. Sie
    können bsp. den Howto-Text zum Thema Linux-Installation anzeigen wollen, dann
    geben Sie folgendes ein:


    ```

    /usr/share/doc/howto/de/DE-Installation-HOWTO.txt

    ```


    SuSE Hilfe können Sie die Howto-Texte über SuSE Hilfe lesen und nach Dingen durchsuchen.


    ## Kerneldokumentation


    Bei Fragen zu dem Kernel selbst ist das Verzeichnis /src/linux/Documentation eine
    Quelle, welche nur vorhanden ist, wenn die Kernelquellen (Paket kernel-source)
    installiert sind. Darüber hinaus finden sich viele wertvolle Hinweise in den Unterverzeichnissen
    der Kernelquellen, sowie für alles um den Kernel selbst.


    ## Freie Bücher


    In Paket books, Serie doc (Dokumentation) sind einige Bücher im PostScript-Format
    enthalten, die Sie mit Paket gra (Alles um Grafik) betrachten oder drucken können.
    Vor dem Ausdruck sollten Sie überlegen, ob es nicht einfacher ist, solches Buch
    in deutscher Sprache zu erwerben.


    ## Die SuSE Linux-FAQ


    Hier versuchen wir, Antworten auf die häufigsten gestellten Fragen zu geben (engl.
    Frequently Asked Questions).


    - 1. Nach der Installation bekom ich immer wieder die Fehlermeldung login: Was
    mache ich falsch? Sie machen nichts falsch, die Installation ist abgeschlossen
    und Sie können sich am Rechner mit Ihrem Benutzern (engl. username) und Ihrem
    Passwort anmelden („einloggen“).

    - 2. Ich benutze meinen Computer alleine, warum muss ich mich einloggen? Linux
    ist ein Multiuser-System. Damit Linux weiß, wer arbeitet, ist die Eingabe des
    Benutznamens (engl. username) und des Passwortes nötig. Übrigen: Arbeiten Sie
    nur als root, wenn Sie am System Änderungen vornehmen wollen (Software installieren,
    konfigurieren usw.). Für den normalen Betrieb lassen Sie sich eigenen Benutzer,
    damit Sie an der Installation nichts kaputtmachen.

    - 3. Wo kann ich Infos über SuSE Linux bekommen? In erster Linie lesen Sie im
    Handbuch, was bei der Installation Besonderheiten von SuSE Linux trifft. Die PDF-Datei
    kann auch im Paket suux-reference_de in der Serie doc gefunden werden (siehe /usr/share/doc/packages/suseux-reference_de/).
    Dokumentation über Programme gibt es in /usr/share/doc/packages, Anleitung gibt
    es in „HowTos“ in /usr/share/doc/howto/ für deutsche und in /usr/share/doc/howto/
    für die englischen „HowTos“. Lesen können Sie diese mit:


    ```

    erde: /usr/share/doc/howto/de/DE-Linux-HOWTO.txt

    ```


    ## Wo kann ich unter besondere Tipps oder Hilhilfe bekommen?


    Geben Sie im Konquerer den Pfad /usr/share/doc/sdb/de/html/index.html ein. Dort
    können Sie unsere SDB-Datenbank mit vielen Tipps und Hilfe einsehen. Falls der
    Pfad nicht existiert, installieren Sie zuerst die Pakete sdb und sdb_de (Serie
    doc). Im Internet finden Sie unsere Supportdaten mit den letzten Aktualisierungen
    unter http://sdb.suse.de/sdb/de/html.


    ## Wie kann ich unter KDE Befehle eingeben?


    Drücken Sie auf ''K'' → ''Werkzeuge'' → ''Terminal''. Sie können auch das Alt
    + F2 drücken und dann xterm eingeben. Damit Sie „Terminal“, in dem Sie Befehle
    eingeben können.


    ## 6. Ich finde Programme im KDE nicht.


    Sie können alle Programme von einem Terminalfenster (xterm, s. o.) aus starten,
    indem Sie den Programnamen gefolgt von...


    ## 7. Was ist ein Mirror? Warum soll ich die Sachen nicht von ftp.com ziehen?


    Da es viele Anwendungen gibt, die selbst Zeit als Server brauchen, wäre er sehr
    schnell überlastet. Deswegen gibt es einen anderen FTP-Server, der ein „Spiegelbild“
    des SuSE-Servers behält. Ein solcher Server wird auch als „Mirror“ genannt. Man
    sollte sich immer an einen Mirror in der Nähe (d.h. gleiches Land) wenden, der
    Download geht dann auch schneller. Eine Liste finden Sie z. B. auf http://www.suse.de/de/support/download/ftp/.


    ## 8. Ich finde keine .exe-Dateien. Wo sind die ganzen Programme?


    Unter Linux sind ausführbare Dateien ohne Date-Erweiterung. Die meisten Programme
    befinden sich in /usr/bin und /usr/X11/bin.


    ## 9. Woran erkennt man ausführbare Dateien?


    Mit dem Befehl ls -l /usr/bin sehen Sie z. B. alle ausführbaren Dateien im Verzeichnis
    /usr/bin in roter Farbe. Diese erkennt sich auch am ''x'' in der ersten Spalte


    ```

    -rwxr-xr-x  1  root      64412 Jul 23 15:23 /usr/bin/ftp

    ```


    ## 10. Ich möchte Linux wieder entfernen, wie geht das?

    '
