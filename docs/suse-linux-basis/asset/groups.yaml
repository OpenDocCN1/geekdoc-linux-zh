    **终端** – 在此模块中设置 KDE 的终端程序，通过对单个选项卡进行通用设置或编辑控制台配色方案。


    在“常规”选项卡下，您可以指定使用哪个程序作为默认终端，并确定工具栏和框架的位置或字体的基本布局。


    如果您偏好个人颜色，可以在“配色方案”选项卡下组合您个人喜爱的颜色。但请注意


