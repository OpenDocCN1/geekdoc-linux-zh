    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_110_0.png)


    Abbildung 6.4: YaST2: ISDN-Konfiguration


    # Netzwerkkarte


    Mit Hilfe von YaST2 können Sie unter ''Netzwerk/Basis'' Ihre Netzwerkkarte den
    Einsatz im (lokalen) Netzwerk einrichten. Zunächst haben Sie die Möglichkeit,
    zwischen ''Automatische Adressvergabe (mit DHCP)'' und ''Konfiguration der statischen
    Adresse'' zu wählen.


    +   * ''Automatische Adressvergabe (mit DHCP)

    DHCP (Dynamic Host Configuration Protocol) sorgt dafür, dass ein Computer automatisch
    eine IP-Adresse von einem DHCP-Server übermittelt bekommt. Die Netzwerkkonfiguration
    folgt automatisch. Verwenden können Sie diese Funktion nur dann, wenn es in Ihrem
    Netzwerk einen DHCP-Server gibt.'
  - '[PAGE 111]


    +   ‘Konfiguration der statischen Adresse’


    Dies ist die konventionellere Methode. Geb Sie hier Ihre IP-Adresse ein. Unter
    ‚Subnetzmaske‘ ist bereits eine Netzwerkmaske eingetragen, die in den Standardfällen
    passt – andernfalls muss sie noch noch angepasst werden. Erfragen Sie diese Daten
    bei Ihrem Systemadministrator.


    Wenn Sie auf ‘Beenden‘ klicken, gelangen Sie weiter zum nächsten Maske. Nun wird
    die Schnittstelle, an der Ihre Netzwerkkarte angeschlossen ist, und die automatisch
    erkannte Hardware angezeigt, falls Sie eine PCI-Karte besitzen. Bei ISA- und ISA-PnP-Karten
    müssen Sie vorher eine manuelle Auswahl treffen. Sie können auch die Einstellungen
    bearbeiten oder die Konfiguration einer Netzwerkkarte löschen oder weitere Karten
    hinzuzügen. Mit ‘Weiter‘ erhalten Sie einen Überblick über die konfigurierten
    Netzwerkkarten. Mit ‘Beenden’ schließen Sie die Installation.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_111_0.png)


    **Abbildung 6.5: YaST2: Konfiguration der Netzwerkkarten**


    # Kabelmodem


    In manchen Ländern (Österreich, USA) ist der Internetzugang über das Fernkabelnetz
    weit verbreitet. Der Teleabel-Teilnehmer bekommt von der Kabelbestirma ein ‘Modem’,
    welches einerseits an das Fernsehen, andererseits mit 10Base-T (Twisted-Pair)
    Leitung an eine Netzwerkkarte im Computer angeschlossen wird. Dieses Modem stellt
    für den Computer eine Standleitung mit einer fixen IP-Adresse dar.'
