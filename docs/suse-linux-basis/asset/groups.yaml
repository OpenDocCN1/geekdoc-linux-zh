    \ die entsprechenden Normen in allen Punkten nicht erfüllen. Deswegen werden diese\
    \ Computer-Mobile in den Katalogen professioneller Bübymöbelsteller vergleichbar\
    \ suchen, denn achten auch indirekt durch die Einhaltung von Mindestnormen bei\
    \ Firmenarbeitsätzen auf die Gesundheit der Beschäftigten. Man beachte – das Wort\
    \ „Mindestnorm“ bedeutet, dass man es eigentlich noch besser könne.\n\n# Der gute\
    \ Schreibstisch\n\nEine falsche Tischhöhehe beansprucht Arm- und Rückenmuskulatur.\
    \ Die daraus resultierende Zwangshaltung belastet vor allem die Wirbelsäule. Daneben\
    \ kann zu wenig Freiheit eine unnatürliche Körperhaltung erzwingen und Durchblustörungen\
    \ verursachen.\n\nIm Grunde genommen ist die Auswahl des richtigen Tisches sehr\
    \ einfach. Er soll möglichst breit und tief sein. Dazu wäre eine individuelle\
    \ Einstellung der Tischhöhe optimal. Luxus sind Arbeitstische, an denen zwischen\
    \ Sitzen und Stehen wechseln kann die Tischplatte (z. B. besonders bequem per\
    \ Knopfdruck) zu Stehpult macht, ein Wechsel zwischen den Belastungsformen Sitzen\
    \ und Stehen bringt Entlastung.\n\n- Die flexible Anordnung von Arbeitsmitteln\
    \ benötigt eine Tischplatte von mindestens 160 x 80 cm.\n- Für das Arbeiten werden\
    \ Arbeitsplätze mit mehreren verketteten Platten empfohlen.\n- Die Tischhöhe muss\
    \ bei höverstellbaren Tischen 72 cm betragen, höverstellbare Tische müssen mindestens\
    \ von 68 bis 72 cm verstellbar sein. Eine verstellbare Höhe ist in Deutschland\
    \ nicht vorgeschrieben, ergonomisch sinnvoll.\n- Die DIN-Norm fordert für bestimmte\
    \ Arbeitsaufgaben wie. B. für CAD-Aritsplätze mehr Breite. Ein Wechsel zwischen\
    \ Bildschirm und Arbeit mindestens 200 cm.\n- Die Einraumbreite muss mindestens\
    \ 60 cm betragen. Erfahrungsgemäß ist die nach der Norm zur Verfügung stehende\
    \ Befreiheit allerdings klein.\n- Bei der Verwendung von großen Bildschirmen sollten\
    \ 100 oder sogar 120 cm tiefe Fläche benutzt werden.\n- Die Tischoberfläche sollte\
    \ Farben vermeiden (deswegen sind viele Möbel aber in dezentem Grau erhältlich).\n\
    \n# Richtig Sitzen auf dem Arbeitsplatz\n\nSitzen in einem Arbeitsstuhl erzwingt\
    \ eine statische Dauerhaltung als das „Lümmeln“ in Erholungszustand sowie die\
    \ hohe Belastung der Wirbelsäule und Bandscheiben Im Extremfall können bei jahrelanger\
    \ falscher Belastung Muskel- und Skeletterkrankungen auftreten.\n\nRichtiges Sitzen\
    \ bedeutet, die Haltung zu wechseln. Dann werden über die Zeit hinweg immer wieder\
    \ Körperteile beansprucht. Im Prinzip ist viel eine Frage der richtigen Einstellung:\
    \ Die Höhe Ihres Arbeitsstls ist optimal, wenn auf dem Arbeitstisch liegen Unterarme\
    \ einen rechten Winkel zum Oberarm bilden. An Ihren Füßen sollten Sie vollständig\
    \ auf dem Boden stehen, und Ober- und Unterschen sollten ebenfalls rechtwink sein.\
    \ Alternativen zu herkömmlichen Sitzgelegenheiten bieten Gymnastikale und Balancestühle.\n\
    \nLe nach ergonomischen Kriterien konstruierter Stuhl relativ teuer, aber die\
    \ Investition in Ihre Gesundheit lohnt sich. Übrigens: Das GS Prüfsiegel zeigt\
    \ nur, dass Mindestanforderung erfüllt sind. Das TÜ Rheinland – Ergonomie „geprüft“\
    \ stellt mehr Anforderungen an einen Stuhl.\n\nWichtige Merkmale eines guten Stuhls:\n\
    \n- Rückenlehne, die bis unter die Schulterblätter reicht und deren Bewegungswiderstand\
    \ individuell lässt.\n- Stütze für die Lendenwirbelsäule.\n- Sitzfläche ist ebenfalls\
    \ variabel und kann sich nach vorne oder hinten neigen.\n- Lehne und Sitzfläche\
    \ werden durch eine Automik in einem idealen Winkel gehalten.\n- Der Stuhl hat\
