  - '[PAGE 76]


    Jede der Visualisierungs-Methoden können Sie einzel an- und ausschalten. Es können
    sowohl mehrere Methoden gleichzeitig aktiviert sein, welche alle einzel abgeschaltet
    werden.


    # Konfiguration von Sawfish


    Auch wenn GNOME mit vielen Windowmanag umgehen kann, eignet sich Sawfish ganz
    besonders für die Zusammenarbeit.


    +   - Geringer Speicherbedarf: Sawfish geht als besonders „schlankes“ Programm
    hervorragend mit den Ressourcen um, was auch eine hohe Arbeitsgeschwindigkeit
    auf Folge hat.

    - Nutzung von Themes: Das Look&Feel von Sawfish kann mittels Themen verändern,
    die Anordnung der Bedienelemente ist eingeschlossen.

    - GNOME Kompatibilität: Sawfish ist 100% GNOME kompatibel. Sawfish kann innerhalb
    des GNOME-Kontrollzentrums konfiguriert werden.


    Sawfish lässt sich über eigenes Kontrollzentrum einstellen. Wählen Sie dazu im
    GNOME-Kontrollzentrum unter „Arbeitsplatz“ → „Fenstermanager auswählen“ → „Konfiguration
    für Sawfish auf. Wir werden uns jedoch auf die Konfiguration innerhalb des GNOME-Kontrollzentrums
    konzentrieren.


    # Arbeitsplätze


    Ein Arbeitsplatz wird bei Sawfish in Zeilen und Spalten unterteilt. Wenn z. B.
    zwei Spalten und zwei Zeilen gewählt werden, wird der Arbeitsplatz in vier Ausschnitte
    unterteilt. Jeder Abschnitt hat dann die Größe eines kompletten Bildschirms. So
    kann man z. B. ein Fenster verkleinert in der Taskleiste darstellen, im Rahmen
    des Arbeitsplatzes in einen anderen Abschnitt bewegen. Ein Fenster über den Bildschirmrand
    hinaus, befindet sich der nicht mehr sichtbare daneben liegenden Abschnitt. In
    diesem Fenster können Sie ein, wie viele Arbeitsplätze Sawfish verwalten soll
    und wie viele Ausschnitte ein Arbeitsplatz enthält. Ebenso können Sie den Arbeitsätzen
    symbolische Namen geben und bestimmen, ob die Arbeitsplätze wechseln, wenn der
    Mausiger den Bildschirmrand berührt.'
  - '[PAGE 77]


    # Aussehen


    An dieser Stelle können Sie das grafische Thema von Sawfish einstellen, das die
    Fensterrahmen und Fensterkontrollelemente betrifft. Zusätzlich lassen sich die
    Schriftart sowie Einstellungen zum mitgelieferten Thema „Mono“ vornehmen.


    > Tipp

    Mit Hilfe des bei Sawfish mitgelieferten Programmes sawfish-themer kann man interaktiv
    Themes für Sawfish erstellen.


    # Fokusverhalten


    Das Fokusverhalten bestimmt, wie Fenster aktiv werden. Bei der Einstellung ‘enter-exit’
    erhält ein Fokus jeweils, wenn der Mausiger sich innerhalb der Fensterfläche befindet.
    ‘Enter-only’ unterscheidet sich dadurch, dass das Fenster Fokus beibehält, wenn
    der Mausiger die Fensterfläche ver. Erst wenn der Zeiger über die Fläche eines
    anderen Fensters bewegt, erhält das neue Fenster den Fokus. Bei der dritten Einstellung
    ‘click’ erhält ein Fenster nur den Fokus, wenn der Mausiger innerhalb der Fensterfläche
    befindet und der Anwender mit Mausklick den Fokusherhalt bestätigt. Weitere Einstellungsmöglichkeiten
    für das Einrollen von Fenstern und Details zum Fokusverhalten stehen ebenfalls
    zur Verfügung. Wenn der „Shade-Hover“ Modus aktiviert ist, werden eingengerollte
    Fenster automatisch geöffnet, wenn sich der Mausiger in der Tititleiste befindet.


    # Klang


    In diesem Bildschirm können von Sawfish verwaltete Ereignisse (z. B. Maxime, als
    Icon darstellen etc.) mit Soundeffekten belegt werden. Die zugeordneten Sounddateien
    mit der Dateiendung WAV sein.


    # Schwierigkeitsgrade


    Die Konfiguration des Sawfish selbst kann in zwei Stufen erfolgen. Bei der Einstellung
    ‘Novice’ werden eine Reihe von Einstellungen ausgeblendet, die den Anfänger eher
    verwirren könnten. ‘Intermediate’, die Einstellung, auf sich dieses Handbuch bezieht,
    bietet die meisten Konfigurationsmöglichkeiten und lässt nur noch sehr spezielle
    Einstellungen weg, welche schließlich im ‘Expert’ Modus freigeschaltet werden.'
  - '[PAGE 78]


    # Platzierung


    Wenn neue Programmfenster erscheinen, kann Sawfish kontrollieren, wo und wie diese
    auf dem Desktop platziert werden. Die Standardeinstellung ist hier ''best-fit'',
    bei der Sawfish berechnet, welcher Position des Desktops am meisten verbleibende
    ''Leerfläche'' ist und versucht, das neue Fenster zu platzieren. Alternativ gibt
    es hier Einstellungen ''interactively'', die es dem Anwender überlassen, neue
    Fenster selbst zu positionieren.


    # Minihilfen


    Neben diversen Detailfunktionen lassen sich hier die Minihilfen von Sawfish konfigurieren.
    Minihilfen sind kurze Erläuterungen, die Sawfish mittels kleiner Sprechblasen
    anzeigt.


    # Tastenürzel


    Die Bedienung eines Fenstersystems mit der Tastatur ist besonders für den erfahrenen
    Nutzer hilfreich. Sawfish lässt alle Wünsche offen. In diesem Fenster können Sie
    nahezu jede Aktion eine Taste oder eine Tastenkombination zuweisen. Damit teilt
    Sawfish die Aktionen in verschiedene logische Gruppen ein; der Gruppenname sagt
    aus, auf welchen Bereich sich die Aktion bezieht. Sie finden beispielsweise in
    der Gruppe ''Window'' Aktionen wie das Maximieren, Verschieben oder Minimieren
    eines Fensters.


    # Verkleinern und Vergrößern


    Hier können Sie einstellen, wie Sawfish sich beim Minimieren bzw. Wiederstellen
    von Fenstern verhält. Zusätzlich können Sie festlegen, ob ein manuelles Ändern
    der Fenstergeometrie bei einem maximierten Programmfenster möglich ist.


    # Verschieben und Verändern


    Sie können den Fenstermanager so einstellen, dass er beim Verschieben eines Fensters
    lediglich ein Rechteck zeichnet. Diese Einstellung ist besonders bei weniger leistungsfähigen
    Computern bzw. Grafikkarten sinnvoll. Die gleiche Einstellung ist auch für das
    Vergrößern beim Verleinern von Fensterrahmen möglich. Weiterhin können Sie sich
    verschiedene Methoden zum ''Einrasten'' der Fenster anwenden. Wenn Sie beispielsweise
    die Einrastmethode auf ''magnetism'' stellen, wird der Rahmen des Fensters, das
    Sie gerade verschieben, direkt neben der Kante eines anderen Fensters einrasten,
    gerade als wäre der Fensterrahmen magnetisch.'
  - '[PAGE 79]


    # Zusammenpassende Fenster


    Der Abschnitt ‚zusammenpassende Fenster‘ erlaubt Ihnen, den Umgang mit Programmen
    zu individualisieren und genauestens anzupassen. Über den Titel im Rahmen eines
    Fensters kann Sawfish Anwendungen eindeutig identifizieren. Anhand eines kleinen
    Beispiels soll hier hier erläutert werden, für was man diese mächtige Funktion
    nutzen kann:


    +   * Starten Sie zuerst das GNOME-Kontrollzentrum und wählen Sie ‘zusammenpassende
    Fenster‘ in den Konfigurationseinstellungen nach Sawfish.

    * Starten Sie nun die Anwendung GNOME-Terminal als dem GNOME-Panel.

    * Klicken Sie auf den Button ‘Hinzufügen‘ im GNOME-Kontrollzentrum.

    * Die linke Spalte im erscheinenden Fenster bestimmt, anhand welcher Eigenschaft
    ein Fenster zugewiesen wird. Als Vorgabe steht hier ‘Name’, wodurch Sawfish nun
    der Titleiste zu erkennen. Der Mauscursor wandelt sich in ein kleines Fadenkreuz.
    Ziehen Sie das Kreuz in die Titleiste des GNOME-Terminals und klicken Sie einmal.
    Terminal’ erscheint im Eingabefeld links neben dem ‚Erfassen‘-Button.

    * Jetzt können Sie im unteren Bereich Aktionen oder Eigenschaften festlegen, die
    nur die ausgewählte Anwendung betreffen. In einem Terminal muss man oft Tastatureingaben
    verändern; es ist daher sinnvoll, den Fokus dieser Anwendung so zu ändern, sobald
    sich die Maus innerhalb der Fensterfläche befindet. Stellen Sie hierzu die Auswahl
    ‚fokus-mode‘ auf ‘enter-exit’ ein. Selbst wenn Sie den globalen Fokus auf ‘click’
    gesetzt haben, wird das Terminalfenster beim Start alle diesen Fokus-Modus haben.

    * Weil die Terminal-Anwendung häufig benötigt wird, möchten wir ihr ein anderes
    Aussehen verleihen. Stellen Sie hierzu die Auswahl ‘framestyle’ auf ein beliebiges
    Sawfish-Thema Ihrer Wahl. Ab sofort verwendet die Terminal-Anwendung dieses Thema,
    unabhängig davon, welches Thema eingestellt ist.

    * Klicken Sie auf ‘Ok’ im GNOME-Kontrollzentrum, um die Änderungen zu übernehmen.
    Die Funktion wirkt sich ab jetzt auf alle neu gestarteten Terminal-Anwendungen
    aus.'
