    # Prima Klima hier


    Das Raumklima bestimmt in starkem Maß unser Wohlbefinden. Ist es zu kalt, zu warm,
    zu zugig oder zu trocken, kommt es häufiger zu Problemen. Bei geringer relativer
    Luftuchtigkeit können Augen, trockene Schleimhäute und höhere Anfälligkeit für
    Erkältungskrankheiten die Folgen. Kompliziert wird es, wenn Personen in einem
    Raum arbeiten die sich an unterschiedliche Temperatur gewöhnt haben. Wichtig für
    das Wohlbefinden ist die Einhaltung von optimalen Grundwerten für die Temperatur,
    die Luftfeuchtigkeit und zusätzlich die Vermeidung von starker Luftbewegung. Dabei
    sollten die Arbeitsmittel selbst nicht dazu beitragen, die Temperatur zu erhöhen.


    +   • Für sitz oder leichte Tätigkeiten wird eine Raumtemperatur von 20 bis 22°C
    empfohlen. Im Sommer sollte die Temperatur höchstens 26 °C betragen, dieser Wert
    soll bei hohen Temperaturen für kurze Zeit überschritten werden.


    +   • Es ist zu beachten, dass nicht nur Menschen, sondern auch andere Geräte
    Wärme und das Raumklima beeinflussen. Dies sollte soweit als möglich reduziert
    werden.


    +   • Die Luftfeuchtigkeit sollte zwischen 40 (manchmal 50) als Prozent liegen
    und kontrolliert werden. V. a. durch Heizungen wird dieser Wert beeinflusst.'
