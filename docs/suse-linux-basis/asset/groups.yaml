    # locate

    Mit locate kann man herausfinden, in welchem Verzeichnis sich eine spezifisierte
    Datei befindet. Zusätzlich können dabei auch `Jokerzeichen` verwendet werden.
    Das Programm arbeitet sehr schnell, da es nicht langsam im Dateisystem selbst,
    sondern in einer eigenen erstellten Datenbank sucht. Dies ist auch das Hauptproblem
    sehr flotten Kommandos, weil darin natürlich keine Dateien gelistet sein können,
    die nach der letzten Aktualisierung erstellt wurden.


    root [Option(en)] die Datenbank mit updatedb erstellt werden.

    updated [Option(en)]

    Mit diesem Befehl ist möglich, auf einfache Weise die benötigte Datenbank auf
    den aktuellsten Stand zu bringen. Damit möglichst alle Dateien erfasst werden,
    sollte das Programm als root aufgerufen werden. Aber bietet sich an, es durch
    einen angehängten Ampersand (&) in den Hintergrund zu versetzen, damit gleich
    weiterarbeitet werden kann (updatedb &).


    find [Option(en)]

    Mit dem Befehl finden Sie in einem bestimmten Verzeichnis nach einer Datei suchen.
    Das erste Argument bezeichnet das Verzeichnis, von dem aus die Suche gestartet
    werden soll. Die Option -name verlangt einen zu suchenden String, der Wildcards
    erlaubt. find findet sich im Gegensatz nicht in einer eigenen Datenbank nach Dateien,
    sondern durchsucht tatsächlich das angegebene Verzeichnis.


    # Inhaltsbefehle


    cat [Option(en)] Datei(en)

    cat gibt den Inhalt einer angegebenen Datei ohne Unterbrechung aus.


    +   Option:

    -n Nummeriert die Ausgabe am linken Rand.'
