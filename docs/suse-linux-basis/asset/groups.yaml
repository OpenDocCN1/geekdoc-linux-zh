    http://sdb.suse.de/sdb/html/thallma_cmodem_dhcp.html

    erhalten können.


    # ADSL/T-DSL


    Beachten Sie bitte, dass die Konfiguration Ihres ADSL-Zugangs eine erfolgreiche
    Konfiguration Ihrer Netzkarte voraussetzt. Zur Zeit sind mit YaST wenige Netzwerke
    eingerichtet, die auf dem Point-to-Point-over-Ethernet-Verfahren (PPPoE) sind.
    Die automatische IP-Adressvergabe findet dabei nicht mit dem DHCP-Protokoll statt.
    Daher dürfen Sie nicht ‘Automatische Adressvergabe (mit DHCP)’ verwenden. Vergeben
    Sie stattdessen eine statische ‘Dummy-IP-Adresse’, z. B. 192.168.22.1 ist eine
    gute Wahl. Im Feld ‘Standardgateway-maske’ sind nur Platzhalter. Sie müssen für
    ein Einzelplatzsystem keinen Eintrag in das Feld 255.255.255 eingragen. Achten
    Sie unbedingt darauf, dass Sie für ein Einzelplatzsystem nur Platzhalter machen.
    Die Werte für ‘IP-Adresse’ Ihres Rechners und ‘Subnetzmaske’ haben für den Verbindungsaufbau
    keine Bedeutung und werden nur zur Aktivierung der Netzwerkkarte benötigt. Das
    YaST2-Modul zur Konfiguration von ADSL, zu finden unter ‘Netzwerk/Basis’, ist
    für PPPoE ADSL-Zugang geeignet, der typischerweise in Deutschland vorkommt, wird
    aber nicht ‘out of the box’ unterstützt – vgl. nach http://www.adsl4linux.de/infos/).
    In der Maske geben Sie die Mitbenutzerkennung und das persönliche Kennwort ein.
    Geben Sie an, welches Interface eingestellt ist (in der Regel ist es eth0). Als
    ‘Idletime’ sind 60 Sekunden empfehlenswert – das bedeutet, wenn die Verbindung
    automatisch abgebrochen wird, wenn kein Datenfluss mehr stattfindet. Mit ‘Beenden’
    schließen Sie den Vorgang ab.


    YaST2 - Konfiguration


    SuSE Linux — Basis


    103


    Um ‘Dial on demand’ (vgl. Seite 97) nutzen zu können, müssen Sie bei Einzelplatzsystemen
    auf jeden Fall DNS (Nameserver) konfigurieren. Die meisten Provider unterstützen
    heute die dynamische DNS-Vergabe, das heißt beim Verbindungsaufbau wird eine aktuelle
    IP-Adresse des Nameserver übergeben. Dennoch muss in Ihrem Einzelplatzsystem in
    diesem Dialog ein Platzhalter für einen DNS-Server eingetragen werden, z. B. bei
    192.168.22.99 geeignet. Falls Sie den Nameserver nicht dynamisch zugewiesen bekommen,
    müssen Sie hier die IP-Adressen des Nameserver Ihres Providers eintragen.


    Empfehlenswert ist folgender Link:

    http://www.ads14linux.de/infos/

    Hier finden Sie neben vielen Informationen rund um ADSL auch Hinweise auf Informationsquellen
    zu den in Österreich verwendeten ADSL-Varianten (PPTP).


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_113_0.png)


    **Abbildung 6.6: YaST2: ADSL-Konfiguration**


    Verfahren Sie für T-DSL wie bei ADSL.

    Für Ihre T-DSL-Konfiguration benötigen Sie folgende Daten: Anschlusskennung, T-Online-Nummer,
    Mitbenutzerkennung und Ihr persönliches Kennwort. Entnehmen Sie die Informationen
    aus Ihrem T-DSL-Anmeldezettel.


    # E-Mail


    Das Konfigurationsmodul für die Maileinstellungen wurde aktuellen Anforderungen
    angepasst. Es wird neben sendmail jetzt auch postfix zum Senden von Mails unterstützt.
    Im Konfigurationsdialog, der sich unter ‘Netzwerk/Erweitert‘ befindet, wählen
    Sie im ersten Dialog Ihren Verbindungstyp auf:


    104 Hardware


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_114_0.png)


    Abbildung 6.7: YaST2: T-DSL-Konfiguration in Deutschland


    - ‘Rechner mit permanenter Netzverbindung''

    Hierbei handelt es sich um eine so sogenannte „Standleitung“, wie sie häufig in
    Firmen oder sonstigen Institutionen, die viel mit dem Internet arbeiten, zu finden
    ist. Die Verbindung zum Internet steht permanent, ist also auch keine Einwand
    nötig. Dieser Punkt gilt jedoch für Mitglieder eines lokalen Netzwerks, in dem
    es keine permanente Internet-Verbindung gibt, jedoch ein zentraler Mailserver
    zum E-Mail-Versand verwendet wird.

    - ‘Rechner mit temporärer Netzverbindung (Modem oder ISDN)’

    Dies betrifft die vielen Benutzer, die zu Hause einen Rechner haben, der kein
    Netzwerk angehört, der aber gelegentlich in das Internet gehen – Einwahl über
    das Modem, T-DSL/ADSL oder ISDN.

    - ‘Keine Netzverbindung’

    Wenn Sie keine Internetzugang haben und kein Netz angehören, können Sie keine
    Internetverbindung nutzen. In der Maske geben Sie die Mitbenutzerkennung und das
    persönliche Kennwort ein. Geben Sie an, welches Interface eingestellt ist (in
    der Regel ist es eth0). Als ‘Idletime’ sind 60 Sekunden empfehlenswert – das bedeutet,
    wenn die Verbindung automatisch abgebrochen wird, wenn kein Datenfluss mehr stattfindet.
    Mit ‘Beenden’ schließen Sie den Vorgang ab.

