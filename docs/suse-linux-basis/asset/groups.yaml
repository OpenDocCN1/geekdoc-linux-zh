    在“插件”（Plugins）选项卡下，您可以查看已安装的 Netscape 插件的详细列表。这些插件也可以被 Konqueror 使用。


    **代理服务器** – 使用此模块对代理服务器进行设置。


    **样式表** – 这些上述“CSS”文件包含用于统一 HTML 页面显示的信息。为此，将为标题等单个样式元素分配特定的格式。


    您可以通过“常规”（Allgemein）选项卡确定要使用的样式表。要在“自定义”（Benutzerdefiniert）选项卡上使用创建的样式表，请选择“在‘自定义’选项卡上使用样式表...”项。


    **用户代理 (User Agent)** – 当 Konqueror 建立网页连接时，将“User Agent”标识的形式传输唯一的身份识别信息。智能网页会评估这些信息，以使其
    HTML 代码适应所使用的浏览器。这很有用，因为不同的 Web 浏览器工作方式存在差异。


    一些 Web 服务器会拒绝“不合适”浏览器的连接，而您可以通过伪造错误的“User Agent”标识来欺骗它们。


    # 4


    KDE – 配置


    # GNOME – 桌面


    GNOME (= GNU Network Object Model Environment) 是除 KDE 之外第二个流行的桌面系统。在本章中，我们将描述如何使用
    GNOME 以及根据您的喜好和需求对其进行定制。


    - 它是关于什么的？ . . . . . . . . . . . . . . . . . . . . . . . . . . 58

    - GNOME 帮助浏览器 . . . . . . . . . . . . . . . . . . . . . . 59

    - GNOME 面板 . . . . . . . . . . . . . . . . . . . . . . . . . . . 59

    - 桌面配置 . . . . . . . . . . . . . . . . . . . . . . . . . . 63

    - Sawfish 配置 . . . . . . . . . . . . . . . . . . . . . . . . . . 67

    - Nautilus - 文件管理器 . . . . . . . . . . . . . . . . . . . . . 71

    - 更多信息 . . . . . . . . . . . . . . . . . . . . . . . . . . 77


    # 它是关于什么的？


    除了 KDE、FVWM 或 Windowmaker 之外，还成立了一些项目来简化用户界面并整合外观（Look&Feel）方面的特征。这不仅仅是管理图形界面的窗口。其他组件确保了应用程序之间可以交换数据，并具有统一的整体概念和帮助系统。通过模块化，可以将复用程序集成到其他应用程序中，这样许多应用程序就不需要每次都发明轮子。其中一个项目
    GNOME (= GNU Network Object Model Environment) 诞生于 1997 年 8 月，目标是开发一个基于完全自由软件的完全自由用户界面的基础。对于全球绝多数开发者来说，GNOME
    已成为一个成功的桌面和一个灵活且强大的开发环境。


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_67_0.png)


    > 图 5.1：GNOME 启动标志


    #  GNOME


    SuSE 致力于保持 GNOME 桌面组件的最新性。如果您使用 SuSE 提供的 GNOME，您将获得带有合理预配置的 GNOME 项目的最新版本。您可以通过在图形登录时选择
    GNOME 会话或通过 `startx gnome` 调用 X 服务器来启动 GNOME。之后将出现一个标志，告知您启动进程。


    # GNOME 帮助浏览器


    GNOME 帮助浏览器是存储在您的 Linux 系统上的文档的中央集合。选择“程序”→“GNOME 帮助”来启动该程序。帮助浏览器除了查看 GNOME 特定文档外，还可以查看传统的帮助格式，如手册页（Manual-Pages）或
    Info 页。


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_68_0.png)


    操作类似于普通的 Web 浏览器：可以通过工具栏创建书签并在页面之间前后翻页。当在程序内部调用帮助时，也会显示帮助浏览器。此外，在浏览器的主页上您还可以找到“GNOME
    用户指南”选项，这是一份关于 GNOME 桌面的详细用户手册。


    # GNOME 面板


    GNOME 面板是控制列表的名称，当您第一次启动 GNOME 时，它位于屏幕底部。从这里启动您要操作的程序。


    （注：原文中存在大量重复的段落，根据指令“不要重复输出原文”，此处仅保留核心描述并翻译。）

