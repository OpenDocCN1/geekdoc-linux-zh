  mdcn: "\n\n- DNS 位于 53 端口，\n- HTTP 位于 80 端口，\n- SMTP 位于 25 端口，POP3 位于 110 端口，\n\
    - FTP 位于 20 和 21 端口。\n\n只有当客户端在访问服务器时使用正确的端口号，它才能调用相应的服务。\n\n## 关于所有类型互联网接入的说明\n\
    \n### 自动拨号 (Dial on Demand)\n\n如果您在 YaST2 模块中激活“按需拨号”或“自动拨号”，那么例如在浏览器中输入外部 URL\
    \ 或在收发邮件时，系统将自动建立互联网连接。只有当您拥有互联网流量包（套餐/Flatrate）时，才建议使用“按需拨号”。由于这些过程在后台运行（例如通过定期获取邮件），会导致频繁接入互联网并增加电话费用。\n\
    \n## 调制调器\n\n在 YaST2 控制中心中，位于“网络/基础”下可以找到调制调器配置。如果自动识别失败，请选择手动配置。在弹出的窗口中，在“设备”处选择接口，并在“调制调器名称”处为调制调器输入一个可选的名称。\n\
    \n如果中间连接了电话交换机，可能需要输入断开时的拨码（通常为 0；请参考您的电话交换机用户说明）。您可以选择音调拨号或脉冲拨号，以及是否开启或计费扬声器。如果您的调制调器连接在电话交换机上，则不应使用最后一种选项。在“详细信息”下可以找到调制调器的波特率和初始化字符串。仅当调制调器未被自动识别且需要针对数据传输进行特殊设置时，才进行更改。这在\
    \ ISDN 终端适配器上尤为常见。\n\n![](img/7c7b5e54e6579952ad3fd8bde9e1a136_106_0.png)\n\n\
    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_107_0.png)\n\n## 图 6.3：YaST2 调制调器配置\n\
    \n接下来是 ISP（互联网服务提供商）选择。您可以选择所在国家的预设供应商，或点击“新建”手动输入 ISP 参数：拨号名称和连接名称（例如所选供应商的名称）、电话号码（提供商的号码）以及您的用户名。在“密码提示”下，您可以输入密码，或者如果出于安全考虑想防止密码保存在硬盘上，请勾选“始终询问”选项。在下一步操作中，您可以将输入的供应商设为默认值。如果您有多个调制调器，可以在此处为每个供应商指定一个默认调制调器。如果激活“自动选择”，每当您启动互联网应用程序时，系统都会自动建立连接。只有在您拥有流量包时才应使用此功能（参见上一页的*自动选择\
    \ (按需拨号)*）。\n\n在“详细信息”下，您可以激活更多要点：\n\n- “连接丢失时重连” – 如果连接意外中断，调制调器将尝试重新重新拨号。\n\
    - “连接期间更改 DNS” – 这通常是默认设置。\n\n## ISDN\n\n- “在（秒）后中断” – 您可以确定在没有数据流的情况下多长时间后中断连接（例如，如果您忘记关闭连接——此处建议设置为\
    \ 180 秒）。点击“下一步”或“完成”结束配置。\n\n您可以在“网络/基础”下找到 ISDN 配置。如果您的 ISDN 卡自动识别成功，将进入 ISDN\
    \ 连接的参数设置。在以下情况下，需要为“自己的电话号码”提供相关信息：\n\n- 1. 这里的 ISDN 卡直接连接到 NTBA（电信的电话插座）：存在一个所谓的“MSN”——这是电信为您的接入提供的电话号码（无需输入前区码！）。即使输入了错误内容，应该仍能工作，因为网络运营商（例如电信）应当使用与您的\
    \ ISDN 接入关联的 MSN。\n\n- 2. ISDN 卡连接到电话交换机上：\n    - (a) 电话交换机内部端口使用 Euro-ISDN/EDSS1\
    \ 协议（通常用于家庭使用的“小型”电话交换机）：这些电话交换机具有内部 S0 总线，并为连接的设备使用内部电话号码。在这种情况下，请使用内部号码作为 MSN。更多信息请参阅电话交换机文档。只要开启了该\
    \ MSN 的权限，根据电话状况可能的任何 MSN 都可以工作。\n    - (b) 电话交换机内部端口使用 Euro-ISDN/EDSS1 协议（通常用于家庭使用的“小型”电话交换机）：这些电话交换机具有内部\
    \ S0 总线，并为连接的设备使用内部电话号码。\n\n"
