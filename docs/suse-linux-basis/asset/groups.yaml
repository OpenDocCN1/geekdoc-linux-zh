  - '[PAGE 47]


    # Einleitung


    Um KDE nach Ihren Vorstellungen einzurichten, steht Ihnen das genannte KDE-Kontrollzentrum
    zur Verfügung. Seine Möglichkeiten sind so vielfältig, dass sie den Rahmen dieses
    Buches sprengen würden, werden uns daher auf einige wichtige Module konzentrieren.
    Das KDE-Kontrollzentrum erreichen Sie entweder direkt über das Symbol in der Kontrollleiste
    oder im K- bzw. SuSE-Menü über den Menüpunkt ‘Kontrollzentrum’. Nach dem Aufruf
    öffnet sich das Fenster wie in Abbildung 4.1.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_47_0.png)


    Abbildung 4.1: Das KDE-Kontrollzentrum


    Das Kontrollzentrum ist in eine Menüleiste sowie einen linken und einen rechten
    Bereich aufgeteilt. Im linken Bereich finden Sie die Menü angeklickt, werden dazu
    die Liste der Konfigurationsmodule. Wird im rechten Bereich die festgehaltenen
    Module mit einer Kurzinformation angezeigt. Mit einem weiteren Klick auf das Modul
    wird der Einstelldialog in den rechten Bereich geladen. Darunter angeordnet finden
    sich meist diese vier Schaltflächen:


    +   * ‘Hilfe’ – Zeigt einen kurzen Hygienetext an.

    * ‘Voreinstellungen benutzen’ – Stellt die Standardeinstellung wieder her.

    * ‘Anwenden’ – Wendet die vorgenommenen Einstellungen an.

    * ‘Zurücksetzen’ – Setzt Einstellungen auf den ursprünglichen Wert zurück.


    Die Menüleiste ist in folgende Menüs untergliedert:'
  - '[PAGE 48]


    +   ‘Datei’ – Schließen Sie das Kontrollzentrum über ‘Beenden’.


    +   ‘Ansicht’ – Wählen Sie das Aussehen des Kontrollzentrums: In ‘Modus‘ stellen
    Sie ein, mit dem der strukturierten ‚Baumansicht‘ oder der einfachen ‚Symbolansicht‘
    arbeiten möchten. Bei letzterer können Sie über ‘Symbolgröße‘ die Größe des angezeigten
    Symbol bestimmen.


    +   ‘Hilfe’ – In diesem Menüeintrag können Sie sich über ‘Inhalt‘ der Hileseiten
    des Kontrollzentrums anzeigen lassen oder erhalten über ‘Was ist das?’ einen Informationstext
    zum Symbol oder die Eingabezeile, die Sie anschließend mit der Maus anklicken.


    Des Weiteren können Sie über den Menüpunkt ‘Problembericht zu Bereich ...‘ für
    den Autor des Programms verbessern. Weitere Informationen über KDE und das Kontrollzentrum
    finden Sie unter den entsprechenden Einträgen.


    Wenn Sie sich einmal nicht genau wissen sollten, dass eine Einstellung bedeuten
    könnte, versuchen Sie es über einen ‘Tooltip‘. Drücken Sie die Tastenkombination
    +F1 und ein Klick auf das entsprechende Element zeigt den entsprechenden Helpfetext
    an.


    # Angeschlossene Geräte


    Beinhält ‘Druckerverwaltung’, ‘Maus’, ‘Smartcards’ und ‘Tastatur’.


    Maus Das Modul bietet Ihnen folgende Einstellungsmöglichkeiten:


    Der Reiter ‘Allgemein‘ definiert, ob Sie die Maus oder den Trackball als Links-
    oder Rechtschalter benutzen wollen, das Öffnen einer Datei oder eines Ordners
    durch Einfach- oder Doppelklick erfolgen soll oder über die Mauskontakt ändern
    bzw. die Änderung des Mauszeigers über Symbolen.


    Der Reiter ‘Erweitert’ beinhaltet u. a. die Einstellungsmöglichkeit für das Verhältnis
    beim Bewegen der Maus und des C auf dem Bildschirm (Zeigerbeschleunigung), wie
    schnell der zweite Mauslick auf den ersten folgen muss, um als Doppelklick verarbeitet
    zu werden sowie Zeilenänderung durch Betätigen des Scrollrades der Maus erfolgen
    soll (‘Mausrad erzeugt Bildlauf um’).


    Tastatur Sollten Sie mit mehreren Tastaturbelegungen arbeiten müssen, können Sie
    hier die entsprechende Belegung auswählen.'
- md: '

    Unter dem Reiter ‘Erweitert’ können Sie den Nummernblock (Eintrag ‘Zahlenblockssperre‘
    bei KDE-Start) und die Tastenwiederholung einstellen.


    ## Dateianzeige


    Das Menü beinhaltet die Module ‘Dateimanager’ und ‘Dateizuordnung’.


    **Dateimanager** Dieses Modul besitzt die Einstellungmöglichkeiten ‘Verhalten’,
    ‘Erscheinungsbild’ und ‘Mülleimer’.


    Unter ‘Verhalten’ können Sie festlegen, ob Verzeichnisse in einem separaten Fenster
    geöffnet werden sollen. Hilreich ist die Option ‘Netzwerkkororgänge in einem Fenster
    anzeigen’. Sie „sammelt“ alle Vorgänge in einem einzigen, übersichtlichen Fenster.


    ‘Erscheinungsbild‘ legt die Optik der Konfigur-Fenster (Schriftart, Schriftgröße,
    ...)


    Einstellungen zu Mülleimer finden Sie im gleichnamigen Reiter.


    **Dateizuordnung** Weisen bestimmten Programmen Datetypen zu – auch ‘MIME’-Typen
    (engl. Multipurpose Internet Mail Extension) welche sich auf Dateihänge in E-Mails
    beziehen. Zur Zuordnung helfen Regeln für die Erkennung einer Date, Beschreibung
    und Symbol werden eine Liste der Programme beim Öffnen des Datetyps. Alle Zuordnungen
    werden einen der Typ ‘application (Anwendungen), ‘audio’ (Audiodaten), ‘image’
    (Bilder), ‘inode’ (Sonderdateien), ‘message’ (Nachrichten), ‘print’ (Drucksystem),
    ‘text’ (Text) oder ‘video’ (Videodaten) zugeordnet und im Listenfeld unter ‘Bekannte
    Typen’ angezeigt.


    Die Funktionsmöglichkeiten im Überblick:


    Für die automatische Suche nach einem MIME-Typ geben Sie diesen Bezeichnung ‘Dateimanister’
    suchen ein (siehe Abb. 4.2 auf der nächsten Seite). Die manuelle Suche erfolgt,
    indem Sie mit einem Dopplick einen Typ öffnen und den zugeord MIME-Typen einsehen.


    Ein neuen MIME-Typ hinzuzufügen können Sie, wenn Sie auf ‘Hinzufügen’ im unteren
    Teil des Fensters klicken. Daraufhin eine eine kleine Dialogbox, in der Sie aus
    Auswahl die passende Kategorie auswählen und anschließend unter ‘Name’ einen Namen
    eingeben.


    Zum Editieren von MIME-Tips wählen Sie den Typ aus, den Sie verändern möchten
    (siehe Abb. 4.2 auf der nächsten Seite). Treffen Sie die entsprechende Auswahl
    aus der Liste der verfügbaren Datetypen; die zuhörigen werden im rechten Teil
    des Fensters angezeigt.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_50_0.png)


    Abbildung 4.2: Das Editieren eines MIME-Typs


    Beim Klick auf einen MIME-Typ öffnet sich auf der rechten Seite einen Bereich,
    in dem Sie weitere Einstellungen vornehmen können:


    Unter dem Reiter ''Allgemein'' legen Sie das Icon, den Dateimuster und eine kurze
    Beschreibung fest. Programme, die diesen Typ verarbeiten können, legen Sie mit
    ''Hinzufügen'' an.


    Sofern das ausgewählte Programm ein KDE-Plugin ist, können Sie unter unter ''Einbetten''
    diese Aktion kontrollieren, d. h. ob die Datei in Konquerer eingebettet werden
    soll oder sich in einem separaten Fenster geöffnet wird.


    ## Energiekontrolle


    Mit Hilfe des Modules dieses Menüpunkt lassen sich die Energiefunktionen Ihres
    Rechners aktivieren. So können Sie bei Stromknappheit einen Befehl oder einen
    Klang ausführen. Moderne Rechner können z. B. nach einer Zeit der Inaktivität
    auf den Bereitschaftmodus geschaltet werden. Die Voraussetzung dafür ist eine
    APM-Unterstützung, welche in den heutigen PCs bereits standardmäßig enthalten
    ist.


    ## Erscheinungsbild


    Dieses Modul bietet Ihnen eine Vielzahl von Einstellungsmöglichkeiten zu Ihrem
    KDE-System. Folgende Module sind verfügbar: ''Arbeitsfläche'', ''Bildschirmschon'',
    ''Design-Verwaltung'', ''Farben'', ''Fensterdekoration'', ''Fenstereigenschaft'',
    ''Fensterleiste'', ''Hintergrund'', ''Kontrollleiste'', ''Programmstart-Anzeige'',
    ''Schriftart'', ''Symbole'' und ''Tastenzeordnung''.


    - Hinweis

    Bedenken Sie bei Änderungen am Erscheinungsbild die Anforderungen an Ihren Rechner:
    Wählen Sie einen Stil mit vielen Farnuancen und Hintergrundgrundlagen, benötigen
    Sie entsprechende Recleistung.


    - Hinweis

    Die Dialoge sind selbstklärend; wir werden allerdings einige wichtige Module herausfinden.


    **Arbeitsfläche** Unter ''Erscheinungsbild'' können Sie die Optik der Arbeitsfläche
    anpassen. Hier können Sie das Hintergrundbild, die Farben der Schrift festlegen.


    **Bildschirmschon** In diesem Modul können Sie die Zeit für den Bildschirmschoner
    einstellen, nach der der Bildschirm ausgeschaltet wird.


    **Design-Verwaltung** Hierüber können Sie verschiedene Themes für Ihr System auswählen
    und verwalten.


    **Farben** In diesem Modul können Sie die Farben für Fenster, Menüs und andere
    grafische Elemente anpassen.


    **Fensterdekoration** Hier können Sie das Aussehen der Fensterleisten und Rahmenen
    ändern.


    **Fenstereigenschaft** In diesem Modul lässt sich das Verhalten von Fenstern festlegen,
    z. B. wie sie sich öffnen oder verhalten sollen.


    **Fensterleiste** Hier können Sie die Funktionen und das Aussehen der Fensterleiste
    konfigurieren.


    **Hintergrund** In diesem Modul können Sie die Hintergrundbilder für Ihre Desktopoberflächen
    festlegen.


    **Kontrollleiste** Hier können Sie die Einstellungen für die Systemleiste vornehmen.


    **Programmstart-Anzeige** Damit können Sie festlegen, welche Programme beim Start
    des Systems angezeigt werden.


    **Schriftart** Hier können Sie die Schriftart für das gesamte System definieren.


    **Symbole** In diesem Modul können Sie die Symbole für Icons und Anwendungen anpassen.


    **Tastenzeordnung** Hier können Sie die Tastbelegung für verschiedene Funktionen
    konfigurieren.

    '
  mdcn: '


    在“高级”选项卡下，您可以设置数字小键盘（KDE启动菜单中的“数字键锁定”项）和按键重复。


    ## 文件显示


    该菜单包含“文件管理器”和“文件关联”模块。


    **文件管理器** 此模块具有“行为”、“外观”和“回收桶”设置选项。


    在“行为”下，您可以确定是否在单独的窗口中打开目录。“在窗口中显示网络操作”选项非常用，它会将所有操作“收集”在在一个单一且清晰的窗口中。


    “外观”决定了配置窗口的视觉效果（字体、字号、...等）。


    关于回收桶的设置可以在同名的选项卡中找到。


    **文件关联** 将特定的数据类型分配给特定的程序——包括与电子邮件附件相关的“MIME”类型（英文：Multipurpose Internet Mail
    Extension，即多用途互联网邮件扩展协议）。通过文件识别规则、描述和符号可以帮助进行关联；在打开数据类型时，会显示程序列表。所有关联都会归类为 `application`（应用程序）、`audio`（音频数据）、`image`（图像）、`inode`（特殊文件）、`message`（消息）、`print`（打印系统）、`text`（文本）或
    `video`（视频数据），并在“已知类型”列表框下显示。


    功能概述：


    如需自动搜索 MIME 类型，请在“文件管理器搜索”中输入该名称（请见下一页图 4.2）。通过双击打开一个类型并查看相应的 MIME 类型可以进行手动搜索。


    如需添加新的 MIME 类型，可以点击窗口底部的“添加”。随后会弹出一个小型对话框，您可以在其中选择合适的类别，随后在“名称”下输入一个名称。


    如需编辑 MIME 类型，请选择您想要更改的类型（请见下一页图 4.2）。从可用数据类型列表中做出相应选择；相关项将在窗口右侧显示。


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_50_0.png)


    图 4.2：编辑 MIME 类型


    点击 MIME 类型后，右侧会打开一个区域，您可以在其中进行更多设置：


    在“常规”选项卡下，您可以设置图标、文件模式和简短描述。通过“添加”设置可以处理此类型的程序。


    如果所选程序是 KDE 插件，您可以在“嵌入”下控制此操作，即文件是应该嵌入到 Konquerer 中，还是在单独的窗口中打开。


    ## 能量控制


    通过此菜单项的模块，可以激活计算机的能量管理功能。这样，您可以在电力短缺时执行命令或播放声音。现代计算机可以在一段时间未活动后切换到待机模式。前提是支持 APM，这在今天的电脑中已作为标准包含。


    ## 外观


    此模块为您的 KDE 系统提供了大量的设置选项。可用模块包括：“桌面”、“屏幕保护程序”、“设计管理”、“颜色”、“窗口装饰”、“窗口属性”、“标题栏”、“背景”、“控制面板”、“程序启动显示”、“字体”、“图标”和“按键布局”。


    - 注意事项

    在更改外观时，请考虑您的计算机的要求：选择一个具有许多颜色变化和背景底的样式，需要相应的计算性能。


    - 注意事项

    对话框本身是直观易懂的；但我们将介绍一些重要的模块。


    **桌面** 在“外观”下，您可以调整桌面的视觉效果。在这里您可以设置背景图片和字体颜色。


    **屏幕保护程序** 在此模块中，您可以设置屏幕保护程序的时间，屏幕将在该时间后关闭。


    **设计管理** 通过此您可以为您的系统选择并管理不同的主题（Themes）。


    **颜色** 在此模块中，您可以调整窗口、菜单和其他图形元素的颜色。


    **窗口装饰** 在这里您可以更改标题栏和框的外观。


    **窗口属性** 在此模块中可以定义窗口的行为，例如它们应该如何打开或运行。


    **标题栏** 在这里您可以配置标题栏的功能和外观。


    **背景** 在此模块中，您可以为您的桌面表面设置背景图片。


    **控制面板** 在这里您可以对系统栏进行设置。


    **程序启动显示** 通过此您可以设置系统启动时显示哪些程序。


    **字体** 在这里您可以定义整个系统的字体。


    **图标** 在此模块中，您可以调整应用程序和应用程序的图标。


    **按键布局** 在这里您可以配置各种功能的按键布局。


    '
