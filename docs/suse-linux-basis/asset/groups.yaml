    在此菜单项下有多个模块，您可以通过这些模块根据个人喜好和需求调整 KDE。


    ### 国家与语言 在此模块中，您可以为所在的地区设置语言、数字和日期。通常情况下，只需点击相应的“国家”即可设置所有其他必要设置。但如果您想更改设置，可以在“数字”、“货币”以及“时间与日期”下根据您的个人要求进行调整。


