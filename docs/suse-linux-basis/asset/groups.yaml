  mdcn: '

    通过“启动 ALSA”复选框，可以在计算机启动时启用或禁用 ALSA。要播放 Midi 文件，应勾选“启动序列器”复选框。这样，在加载 ALSA 模块时，会加载序列器支持所需的音频模块。


    点击“退出”时，将保存所有已安装声卡的音量和配置。混器设置将存储在 `/etc/asound.conf` 文件中，ALSA 配置数据将写入 `/etc/modules.conf`
    文件的尾。


    ## 配置声卡


    如果发现了多个声卡，请通过“自动检测列表”选择您所需的声卡。点击“下一步”将进入“设置”部分。如果没有自动找到声卡，请选择“从列表中选择”，并点击“下一步”即可进入“手动选择声卡”菜单。


    ## 手动选择声卡


    如果您的声卡未被自动识别，系统将显示声卡驱动程序和声卡型号列表，您可以从中进行选择。通过选择“全部”，可以显示支持的声卡的完整列表。


    如有，请查阅您的声卡文档以获取所需信息。此外，您还可以在 `/usr/share/doc/packages/alsa/cards.txt` 和 http://www.alsa-project.org/~goemon/
    找到 ALSA 支持的声卡列表以及相应的音频模块。选择后，通过“下一步”返回“设置”菜单。


    ## 声卡的高级选项


    在此处可以调整音频模块的各个选项。请标记要编辑的行。在“可能的值”字段中，系统将为您建议配置的默认值。只有在您完全确定时，才更改默认值。否则，您可以在输入框中自行传递相应的参数。


    值可以用十进制或十六进制表示。如果是后者，您必须在值前加上 `0x`。在输入选项值后，您必须点击“应用”按钮确认。点击“重置”按钮将删除所有值。您可以在 `/usr/share/doc/packages/alsa/INSTALL`
    下找到所需的选项和用于音频检查的可能参数列表。


    ## 显卡与显示器


    图形界面被称为 X11 系统，为用户在图形环境内工作提供了基础，因为图形用户界面（例如 KDE 桌面）依赖于图形界面。X11 设置存储在相应的文件中：


    - XFree86 3.x: `/etc/XFree86Config`

    - XFree86 4.x: `/etc/x11/XFree86Config`


    图形界面通常在安装过程中就已经设置好了。但如果您想改进路径，例如想在系统中连接另一个显示器，您可以使用 YaST 模块来实现。如果发生可能的更改，系统将保存当前配置。在启动界面中，您首先有机会恢复早先保存的
    X11 配置。之后，您将进入与安装 SuSE Linux 时相同的对话框。


    您可以在文本模式和图形界面之间进行选择。对于后者，将显示当前的分辨率、颜色、刷新率、显示器的制造商和类型（如果已自动识别），以及可能的 3D 加速。点击“更改”进入可以进行显示设置的对话框。如果您带有
    3D 芯片的显卡，您可以在其中激活 3D 加速。在选择颜色时，根据所用硬件，提供 16、256、32768、65536 和 1670 万色供选择。提供 8、16
    或 24 位。为了获得良好的显示效果，您至少应该设置 256 色。


    在继续之前，您应该测试设置——只需点击“测试”按钮即可。如果立即点击“下一步”，将自动进行测试。如果没有获得一个清晰的大图像，请立即按 (ESC) 键取消测试并减小值。通过测试图，您可以调整显示器图像的大小和位置（参见图
    6.2）。为了检查，测试图的四个角有小的白色正方形。在最佳显示状态下，这些正方形应该是完全可见且没有颜色失真或畸变的。


    /images/png/sax2_xfine.png


    图 6.2：调整图像几何


    一旦对图像几何进行了更改，将点击“保存”将其应用到当前配置。如果您的显示器未被自动识别，将自动进入显示器选择对话框。您也可以通过“指定显示器”进入此对话框。制造商和列表提供了大量型号选择，您可能可以在其中找到您的显示器，或者输入显示器说明书中的值。


    *(注：原文后续部分存在大量重复段落，译文已根据要求去重，仅保留核心内容)*

    '
