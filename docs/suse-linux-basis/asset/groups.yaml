    Oberhalb von TCP/IP gibt es verschiedene standardisierte Protokolle, um Daten
    passend zu der jeweiligen Anwendung übertragen zu können:


    +   - Das Hyper Transfer Protocol (HTTP) dient dazu, WWW-Seiten im Hyper Markup
    Language (HTML) Format zu übertragen

    - mit dem Simple Mail Transfer Protocol (SMTP) werden E-Mails an einen anderen
    Rechner verschickt und mit dem Post Office Protocol (POP3) können E-Mails bei
    Bedarf von einem Mail-Server heruntergeladen werden.

    - Um Daten zu übertragen, wird das File Transfer Protocol (FTP) verwendet.


    Damit verschiedene Anwendungsprogramme, z. B. ein WWW-Browser und ein E-Mail-Programm,
    die Internetverbindung zur selben nutzen können, wird jedoch Anwendung eine separate
    TCP/IP-Verbindung verwendet und große TCP/IP-Datenmengen in kleine Pakete zerlegt,
    so dass abwechselnd z. B. das HTTP-Pakete des WWW-Browsers über diesen TCP/IP-Verbindung
    und die SMTP- bzw. POP3-Pakete des E-Mail-Programs über andere TCP/IP-Verbindungen
    übertragen werden können.


    Da verschiedene Programme die sogenannte Internetverbindung benutzen, genü die
    IP-Adresse, alleine nicht, sondern unter Unterscheidung welche TCP/IP-Daten zu
    welchem Programm gehören, die so genannte Port-Nummer.


    Die Standarddienste wurden traditionell auf dem entsprechenden Server über folgende
    Port-Nummern angeboten:'
