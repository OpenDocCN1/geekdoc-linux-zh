    # Rechte auf Verzeichnisse


    Wenden wir uns den Zugiffsrechte für Verzeichnisse zu, zu der Typ ist. Hier haben
    die einzelnen Rechte eine etwas andere Bedeutung. Ein kleines Beispiel zur Verdeutlichung:


    ```

    drwrxrwx-x   1 tux projekt3   35 Jun 21 15:15 Projektdaten

    ```


    **Ausgabe: 2:** Beispielaus der Zugiffsrechte auf Verzeichnisse


    Auch hier sind Besitzer (tux) und Benutzergruppe (projekt3) des Verzeichnisses
    Projektdaten leicht zu erkennen. Im Gegensatz zu den Datenrechten Recht im Dateisystem
    aus dem vorherigen Jahr bedeutet das gesetzte Lesrecht (r) jedoch, dass der Inhalt
    des Verzeichnisses angezeigt werden kann. Das Schreibrecht (w) steht darüber hinaus
    für die Berechtigung, neue Dateien anzulegen zu dürfen, das Exekutivrecht (x)
    erlaubt neben dem Benutzer auch die Mitglieder der Gruppe projekt3 im Verzeichnis
    Projektdaten wechseln (x), den Inhalt anzeigen (r) und Dateien anlegen dürfen
    (w). Alle übrigen Benutzer mit weniger Rechten ausgestattet, dürfen in das Verzeichnis
    wechseln (x) bzw. durchstöbern (r), jedoch keine Dateien ablegen (w) nicht gesetzt.


    # Dateberechtigungen anpassen


    # Ändern von Zugiffsrechte


    Die Zugiffsrechte einer Datei eines Verzeichnisses können vom Besitzer (und natürlich
    von root) mit dem Befehl chmod verändert werden, der zusammen mit Parametern für
    die zu ändernden Zugiffsrechte sowie die Namen der Datei eingegeben wird.


    Die beiden Parameter setzen sich zusammen


    +   1. den betroffenen Kategorien


    +   * u (english) - der Besitzer der Datei'
  - '[PAGE 143]


    +   * g (engl. group) – die Gruppe des Besitzers

    * o (engl. others) – sonstige Benutzer (wird kein Parameter angegeben, gelten
    die Änderungen für alle Kategorien)


    2. einem Zeichen für Entzug (-), Gleichsetzung (=) bzw. Hinzufügen (+)


    +   3. den bereits bekannten Abkürzungen für

    * r (engl. read) – lesen

    * w (engl. write) – schreiben

    * x (engl. execute) – ausführen


    sowie, durch Leerzeichen getrennt, für den bzw. den Namen der betroffenen Datei(en).


    Möchte nun z. B. der Benutzer tux in Beispiel 2 auf der vorherigen Seite anderen
    Benutzern den Schreibzugriff (w) auf das Verzeichnis Projektdaten gewähren, kann
    er dies den folgenden Befehl bewirken:


    ```

    tuxerde: > chmod+w Projektdaten

    ```


    Will er jedoch auch sich selbst das Schreibrecht entziehen, nimmt er das Kommando:


    ```

    tuxerde: > chmod go-w Projektdaten

    ```


    Um allen Benutzern das Anlegen einer Datei im Verzeichnis Projektdaten zu verbieten,
    schreibt man:


    ```

    tuxerde: > chmod -w Projektdaten

    ```


    Nun kann nicht einmal der Besitzer auf seine Datei schreiben, ohne das Schreibrecht
    vorher wiederherzustellen.


    # Ändern von Eigentumsrechts


    Weitere Kommandos, die die Eigentumsverhältnisse der Dateisystembestandsteile
    regeln, sind chown (Change Owner) und chgrp (Change Group). Der Befehl chown dient
    dazu, einen Besitzer angegebenen Benutzer zu ändern. Allerdings darf nur root
    diese Änderung vornehmen.


    Angenommen, die Datei Roadmap aus Beispiel 2 der vorherigen Seite soll nicht mehr
    tux, sondern dem Benutzer geekohören, so lautet der entsprechende Befehl – als
    root eingegeben:


    ```

    erde: # chown geeko Roadmap

    ```'
  - '[PAGE 144]


    Weitgehend selbsterklärend ist auch chgrp, der die Gruppenzugehörigkeit einer
    Datei ändert Dabei ist zu beachten, dass der Datei-Besitzer Mitglied in einer
    Gruppe muss, den er als neu zu bestimmen wünscht. So könnte beispielsweise unser
    Benutzer 1 auf Seite 132 durch die folgende Eingabe die Gruppe der Datei Projektdaten
    auf projekt4 ändern, wenn sie Mitglied in dieser Gruppe ist. Für root stellt diese
    Einschränkung kein Problem dar.


    ```

    tux@erde: > chgrp projekt Projektdaten

    ```


    # # Wichtige Linux-Befehle im Überblick


    In diesem Abschnitt möchten wir Ihnen einen Überblick über die wichtigsten Befehle
    Ihres SU Linux-Systems geben. Dabei werden wir der Grundbedeutung der einzelnen
    Kommandos auf einige Parameter eingehen, und wenn es sich anbietet, ein typisches
    Anwendungsbeispiel liefern.


