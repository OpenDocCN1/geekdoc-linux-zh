- md: '

    - Die Finger sollten entspannt auf den Tasten liegen können.

    - Die Maus sollte nahe neben der Tastatur liegen. Hier haben der Linkshänder einen
    Vorteil, denn auf der rechten Seite der Tastatur liegen zwischen Buchstabentasten
    und Maus mehrere Funktionstasten und der numerische Tastaturblock. Diese verlängern
    den Greifweg. Wenn Sie Linkshänder sind, kaufen Sie sich eine Maus für Linkshänder;
    oder das Lernen von Tastaturcodes entlastet den ganzen Arm. Und durch ein vernünftiges
    präventiertes Arm-Schulter-Bereich kann kurzzeitige Überlastungen besser bewältigen.

    - Das Kabel sollte lang genug sein, evtl. muss eine Verlängerung erwben werden.


    - Die Maus braucht eine vernünftige Unterlage, um gut zu funktionieren; besorgen
    Sie sich ein gutes Mauspad.

    - Achten Sie auf jeden Fall auf den Maustreiber. Gute Mäuse haben Maustreiber
    mit vielfältseitigen Funktionen. Man kann z. B. die Cursorbewegung je nach Bedarf
    justieren oder den verschiedenen Mäusen Sonderbefehle zuordnen. Evtl. kann der
    Doppelklick mit dem Maustreiber auf die mittlere Taste gelegt werden.


    - Außerdem: Stellen Sie auf jeden Fall die Beschleunigungs- und die Dopplicickeinstellung
    der Maus individuell ein. Manche Personen arbeiten mit der Maus nur mit dem Handgelenk
    heraus, andere möchten dem ganzen Unterarm mitarbeiten.


    - Eine Alternative zur Maus ist ein Trackball. Hier bewegen sich in einem feststehenden
    Gehäuse eine Kugel zur Steuerung des Mauszeigers. Die Bewegungen im Hand-Arm-Bereich
    sind gegenüber der Maus reduziert.


