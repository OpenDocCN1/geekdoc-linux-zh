    # 6


    根据您的提供商信息，在配置网卡时，请在“自动分配地址（通过 DHCP)”和“静态地址配置”之间进行选择。大多数提供商使用 DHCP。静态 IP 地址通常用于提供商的商业套餐。在这种情况下，提供商已为您分配了一个固定的
    IP 地址。请务必查看关于电缆调制解器设置和配置的支持数据库文章，您可以在此处获取相关信息：


    ```

    http://sdb.suse.de/sdb/html/kngu_cmodem.html

    以及

    ```


    ```

    http://sdb.suse.de/sdb/html/thallma_cmodem_dhcp.html

    ```


    # ADSL/T-DSL


    请注意，ADSL 访问配置取决于网卡是否配置成功。目前使用 YaST 配置的基于点对以太网（PPPoE）协议的网络较少。在这种情况下，自动 IP 地址分配不是通过
    DHCP 协议进行的。因此，您不能使用“自动分配地址（通过 DHCP）”。请分配一个静态的“虚拟 IP 地址”，例如 192.168.22.1 是一个不错的选择。在“默认网关掩码”字段中仅保留占位符。对于单机系统，不需要在
    255.255.255 字段中输入内容。请务必确保单机系统仅使用占位符。计算机的“IP 地址”和“子网掩码”值对于建立连接没有意义，只需激活网卡。位于“网络/基础”下的
    ADSL 配置 YaST2 模块适用于典型的 PPPoE ADSL 访问，但并非“开箱即用”（参见 http://www.adsl4linux.de/infos/）。在界面中输入用户名和个人密码。指定设置了哪个接口（通常是
    eth0）。建议将“空闲时间”设为 60 秒——这意味着当没有数据流时，连接将自动断开。点击“完成”结束操作。


    YaST2 - 配置


    SuSE Linux — 基础


    103


    为了使用“按需拨号”（参见第 97 页），在单机系统上您必须配置 DNS（名称服务器）。大多数提供商现在支持动态 DNS 分配，这意味着在建立连接时会传递名称服务器的当前
    IP 地址。尽管如此，在您的单机系统对话框中仍必须输入 DNS 服务器的占位符，例如 192.168.22.99 是合适的。如果不是动态分配名称服务器，则必须在此处输入提供商的名称服务器
    IP 地址。


    推荐以下链接：

    http://www.ads14linux.de/infos/

    在这里除了许多关于 ADSL 的信息外，还可以找到关于奥地利使用的 ADSL 变体（PPTP）的信息来源提示。


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_113_0.png)


    **图 6.6：YaST2：ADSL 配置**


    T-DSL 的操作与 ADSL 相同。

    您的 T-DSL 配置需要以下数据：连接标识、T-Online 号、用户名和您的个人密码。请从您的 T-DSL 登录单中获取信息。


    # 电子邮件


    邮件设置配置模块已根据最新需求进行了调整。除了 sendmail，现在还支持使用 postfix 发送邮件。在位于“网络/高级”下的配置对话框中，请在第一个对话框中选择您的连接类型：


    104 硬件


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_114_0.png)


    图 6.7：YaST2：德国的 T-DSL 配置


    - ‘具有永久网络连接的计算机’

    这指的是所谓的“专线”，常见于公司或其他经常使用互联网的机构。到的连接是永久的，因此无需担心。然而，此点适用于本地网络的成员，该网络没有永久的互联网连接，但使用中央邮件服务器发送电子邮件。

    - ‘具有临时网络连接的计算机（调制解调器或 ISDN）’

    这涉及许多家里拥有计算机的用户，不属于任何网络，但偶尔访问互联网——通过调制解调器、T-DSL/ADSL 或 ISDN 拨号。

    - ‘无网络连接’

    如果您没有接入互联网且不属于网络，则无法使用互联网连接。在界面中输入用户名和个人密码。指定设置了哪个接口（通常是 eth0）。建议将“空闲时间”设为 60
    秒——这意味着当没有数据流时，连接将自动断开。


