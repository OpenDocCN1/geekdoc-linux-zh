    „Drucker einrichten“, den Sie unter dem Stichwort „einrichten“ ohne online


    ```

    http://sdb.suse/sdb/de/html/jsmeix_print-einrichten.html\ erhalten.

    ```


    # Soundkarte


    YaST2 versucht beim Aufruf des Sound-Konfigurationstools Ihre Soundkarte automatisch
    zu erkennen. Sie können eine oder mehrere Soundkarten einrichten. Falls man mehrere
    Soundkarten verwenden möchte, wählen meist eine der zu konfigurierenden Karten
    aus. Mit dem Button ‚Konfigurieren‘ gelangen Sie unter Men Setup. Bereits konfigurierte
    Soundkarten unter ‚Soundkonfiguration‘ editieren. ‚Beenden‘ speichert die momentanen
    Einstellungen und schließt die Soundkonfiguration ab. Sollte YaST2 Ihre Soundkarte
    nicht automatisch erkennen, kann man über das Menü ‚Soundkonfiguration‘ mit dem
    Button ‚Soundkarte hinzufügen‘ zur ‚Manuellen Auswahl der Soundkarten‘ gelangen.
    In diesem ist es möglich, eine Soundkarte und das zugeige Modul selbst auszuwählen.'
  - '[PAGE 96]


    # Setup


    Unter ''Schnelles automatisches Setup'' werden keine weiteren Konfigurations-schritte
    abgefragt und kein Testsound gestartet. Die Soundkarte ist fertig eingerichtet.


    Mit ''Normales Setup'' hat man die Möglichkeit, im folgenden Menü ''Lautstärke
    der Soundkarte'' die Ausgangslautstärke zu regeln und einen Testsound abzuspielen.


    Bei ''Erweitertes Setup'' hat man die Möglichkeit, Optionen zu ändern, gelang
    man in das Menü ''Erweiterte Optionen für die Soundkarte''. Hier kann man die
    Optionen der Soundkarte manuell anpassen.


    # Lautstärke der Soundkarte


    Unter dieser Testmode können Sie Ihre Soundkonfiguration testen. Mit den Buttons
    ''+'' und ''-'' stellen Sie die Lautstärke ein. Beginnen Sie bei etwa 10%, um
    wieder jeden Lautsprecher noch Ihr Gehör zu schädigen. Durch einen Klicken auf
    den Button ''Test'' sollte die Soundkarte zu hören sein. Falls nicht, regeln Sie
    die Lautstärke nach. Mit ''Weiter'' schließen Sie die Soundkonfiguration ab und
    die Lautstärke wird gespeichert.


    # Soundkonfiguration


    Mit der Option ''Löschen'' kann man eine Soundkarte entfernen. Vorhandene Einträge
    von bereits konfigurierten Soundkarten werden in der Datei /etc/modules.conf deaktiviert.
    Unter ''Optionen'' gelang man in das Menü ''Erweiterte Optionen für die Soundkarte''.
    Hier kann man die Optionen derkarte manuell anpassen. Im Menü ''Mixer'' ist es
    möglich, die Regeleinstellungen für Ein- und Ausgänge der Soundkarte zu konfigurieren.
    Mit ''Weiter'' werden die neuen Werte gespeichert und mit ''Zurück'' wieder auf
    die Standardeinstellungen zurückgesetzt. Bei ''Soundkarte hinzufügen...'' können
    Sie weitere Soundkarten integrieren. Findet YaST2 automatisch eine weitere Soundkarte,
    oder findet YaST2 keine Soundkarte, geht es direkt zur ''Manuelle Auswahl der
    Soundkarte''. Wenn Sie eine Creative Soundblaster Live oder AWE verwenden, können
    Sie über die Option ''Soundfonts installieren'' automatisch von der Original-Soundtreiber
    CD-ROM SF2-Soundfonts auf Ihre Festplatte kopieren. Diese werden im Verzeichnis
    /usr/share/sfbank/creative/ abgelegt.'
- md: '

    Über die Checkbox ''ALSA starten'' kann das Starten von ALSA beim Boot des Rechners
    de-)aktiviert werden. Zur Wiedergabe von Midi-Dateien sollten die Checkbox ''Sequencer
    starten'' aktiviert sein. Somit wird beim Laden der ALSA-Module das benötigte
    Soundmodul für die Sequencerunterstützung mitgeladen.


    Beim Aufruf von ''Beenden'' wird die Lautstärke und die Konfiguration aller bisher
    installierten Soundkarten gespeichert. Die Mixereinstellungen werden in der Datei
    /etc/asound.conf abgelegt und die ALSA-Konfigurationsdaten werden am Ende der
    Datei /etc/modules.conf eingetragen.


    ## Konfigurieren Sie eine Soundkarte


    Wurden mehrere Soundkarten gefunden, wählen Sie über ''Liste der automatisch erkannt''
    Ihre gewünschte Karte aus. Mit ''Weiter'' gelangen Sie zum Punkt ''Setup''. Wird
    die Soundkarte nicht automatisch gefunden, wählen Sie den Punkt ''von der Liste
    wählen'' an und mit ''Weiter'' gelang man im Menü ''Manuelle Auswahl der Soundkarte''.


    ## Manual Auswahl der Soundkarte


    Falls Ihre Soundkarte nicht automatisch erkannt wurde, wird eine Liste von Soundkartentrereibern
    und Soundkartenmodellen angezeigt, aus der Sie eine wählen können. Mit der Auswahl
    ''Alle'' können Sie die komplette Liste der unterstützten Soundkarten anzeigen.


    Sehen Sie gegebenfalls in der Dokumentation zu Ihrer Soundkarte nach, um die nötigen
    Informationen zu erhalten. Des Weiteren finden Sie auch eine Aufstellung von ALSA
    unterstützten Soundkarten mit den jeweils zugehörigen Soundmodulen unter /usr/share/doc/packages/alsa/cards.txt
    und http://www.alsa-project.org/~goemon/. Nach der Auswahl gelang man über ''Weiter''
    wieder ins Menü ''Setup''.


    ## Erweiterte Optionen für die Soundkarte


    Hier kann man die einzelnen Optionen des Soundmoduls anpassen. Dazu markieren
    Sie die jeweilige zu editierende Zeile. Im Feld ''Mögliche Werte'' werden Ihnen
    Standardwerte für die Konfiguration vorgeschlagen. Verändern Sie die Standardwerte
    nur, wenn Sie absolut sicher sind. Ansonsten können Sie im im Eingabefeld die
    jeweiligen Parameter selbst übergeben.


    Werte können dezimal oder hexadezimal angegeben werden. Im letzten Fall müssen
