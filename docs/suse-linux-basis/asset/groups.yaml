    ## SuSE Hilfe


    Die SuSE Hilfe starten Sie über den Rettungsring (mit dem integrierten Gecko)
    auf der Kontrollleiste der KDE-Oberfläche oder über den Eintrag „SuSE Hilfe“ –
    nachdem was installiert wurde – im K- oder SuSE-Menü; vgl. Abb. 9.1.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_173_0.png)


    Abbildung 9.1: Die Startseite der SuSE Hilfe


    Natürlich kann die SuSE Hilfe auch von „Nicht-KDE-Benutzern“ über einen beliebigen
    Browser angezeigt werden. Dazu muss allerdings das Paket apache, Serie n installiert
    werden; vgl. Abschnitt Software installieren/löschen auf Seite 112


    Starten Sie die SuSE Hilfe außerhalb von KDE auf einer Konsole durch die Eingabe
    von hilfe oder in einem Browser Wahl Ihrer URL:

    http://localhost/hilfe/index.de.


    > Hinweis

    > Für die HTML-Version der SuSE Hilfe als „Dokumentationsserver“ wird das Paket
    inf2htm benötigt. Eine Anleitung zur Konfiguration des Filesystems als Dokumentationsserver
    im Intranet finden Sie unter /usr/share/doc/packages/susehelp/README.


    > Hinweis


    ## Die Arbeit mit der SuSE Hilfe


    Im Nachfolgenden beschreiben wir Ihnen wie Anfragen in der SuSE Hilfe gestellt
    werden sowie die verschiedenen Dokumentationsquellen. Dabei nehmen Sie die Einstellungen
    für Suche jeweils im linken Fensterteil vor; im rechten Teil erhalten Sie die
    Liste mit Links zu den gefundenen Dokumenten. Diese Liste ist standardmäßig für
    Dokumentationsquelle auf zehn Einträge beschränkt und nach Wichtigkeit geordnet.


    Zur Konfiguration der SuSE Hilfe lesen Sie den Abschnitt Einleitung auf Seite
    39.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_174_0.png)


    Abbildung 9.2: Die erweiterte Suche


    Starten Sie die SuSE Hilfe außerhalb von KDE auf einer Konsole durch die Eingabe
    von hilfe oder — Sie........... an, um einen über über die gefundenenen zu behalten.


    Suchen von Dokumenten im linken Fenster finden Sie die Reiter für ‚Suche‘ ‚Erweitert‘
    und ‚Inhalt‘ (9.2 auf Seite 165):


    - ''Suche'' - Bei Standardsuche brauchen Sie nur das gesuchte Stichwort einzugeben
    und darunter ‚Suche‘ zu aktivieren. Standardmäßig werden – soweit installiert
    und der Aufbau der Datenbank nicht explizit verhindert wird (s. Seite 39) – Paketbeschreib,,
    SuSE Handbücher (Die Referenz, Netzwerk, Konfiguration, Die Programme), KDE-Hilfe
    und die Supportdatenbank (SDB) durchsucht.


    - Die Schaltfläche ‚Suche‘ hat sich nach Bete an ‚Weiter‘ geändert. Wenn Sie diese
    betät, werden zusätzlich alle verbleibenden und verfügbaren Datenquellen durchsucht.


    - ''Erweitert'' - Über diese Registerkarte können Sie Ihre durch zwei Optionen
    präzisieren: Wenn Sie im Eingabefeld mindestens zwei Stichwörter wählen, können
    die (‚und‘ oder mindestens eines von beiden) Stichwörter im Dokument vorkommen.
    Über ‚Max. Ergebnisse‘ begrenzen Sie die Anzeige der Einträge auf Quelle, um einen
    Überblick über die gefundenen Einträge zu behalten oder lassen Sie beispielsweise
    ‚5‘ aus, werden Ihnen nur die fünf wichtigsten Einträge Ihrer Dokumentationsquelle
    angezeigt. Ihre Auswahl invertieren Sie über die Schaltfläche mit den zwei Pfeilen.


    Die angezeigte Liste können Sie erweitern bzw einschränken, indem Sie über die
    Schaltfläche mit dem Werkzeug den Index-Datenbanken für weitere Dokumentationsquellen
    anlegen bzw. löschen; vgl. 39.

