- md: '

    # MBR (engl. master record)


    Physikalisch erster Sektor einer Festplatte, dessen Inhalt beim Start des Systems
    in den Arbeitsspeicher geladen und ausgeführt wird. Dieser Code lädt entweder
    das Betriebssystem von einer startfähigen Festplatten-Partition oder einen komplizierteren
    Bootloader, z. B. LILO.


    # Mount


    Einhängen von Dateisystemen im Verzeichnisbaum des Systems.


    # Multitasking


    Fähigkeit von Betriebssystemen, mehrere Programme gleichzeitig auszuführen.


    # MP3


    Sehr effizientes Kompressionsverfahren für Audio-Dateien, durch das die Größe
    im Gegensatz zu einer unkomprimierten Datei etwa um den Faktor 10 herabgesetzt
    werden kann.


    # Multiuser


    Möglichkeit von mehreren Benutzern, gleichzeitig mit dem System zu arbeiten.


    # Netzwerk (engl. net, network)


    Zusammenschluss vieler Computer, meist durch Server und Clients realisiert.


    # NFS (engl. network file system)


    Protokoll zum Zugriff auf Dateisystem vernetzter Rechner.


    # NIS (engl. Network Information Service)


    System zur zentralen Verwaltung von Administrationsdaten in Netzwerken. V. a.
    Benutzernamen und -passwörter können NIS netzwerkweit synchron gehalten werden.


    # Partition


    Logisch unabhängiger Teilbereich einer Festplatte, der ein jeweils unter unterschiedliches
    Dateisystem enthalten kann. Unter Windows als „Laufwerke“ bezeichnet.


    # Pfad (engl. path)


    Eindeutige Beschreibung der Position einer Datei in einem Dateisystem.


    # Plug and Play


    Technologie zur automatischen Konfiguration von Hardwarekomponenten. Ressourcen
    wie z. B. IRQ, DMA und andere sollten vom System selbst konfiguriert und verwaltet
    werden.


    # Prompt


    Siehe Eingabeaufforderung.


    # Protokoll (engl. protocol)


    Definierter spezifischer Standard, der die Kommunikation sowohl auf Hardware-,
    Software-, als auch Netzwerk-Ebene regelt. Es existiert eine Vielzahl dieser Standards,
    weit verbreitete Beispiele sind z. b. HTTP und FTP.


    # Proxy


    Meist bei Internet-Anbietern platzierter Zwischenspeicher, der häufig angeforderte
    Inhalte in einer Datenbank ablegt, um weitere Rechner, diese Seite anfordern,
    direkt daraus zu versorgen. Dieses Verfahren kann nicht nur die Ladezeiten eines
    direkten Herunterladens reduziert, sondern auch die vorhandene Bandbreite geschont.


    # Prozess (engl. process)


    Programme oder ausführbare Dateien laufen als Prozess ab und können in einer Shell
    beobachtet werden, z. b. mit top. Oft wird dieser Begriff synonym bzw. der Programme
    in Maschinprache verarbeitet und ausgeführt mit „Task".


    # Prozessor


    Der Prozessor ist das „Gehirn“ eines Computers, der die Befehle des Nutzers bzw.
    der Programme in Maschinprache verarbeitet und ausführt. Er führt die Kontrolle
    über das gesamte System und bringt die eigentliche Rechenleistung.


    # RAM (engl. Random Access Memory)


    siehe Arbeitsspeicher


    # Root


    Die Person, die in einem komplexen Rechnersystem bzw. -netzwerk Konfigurationen
    und Wartung übernimmt. Dieser Systemadministrator hat (meist eine einzige Person)
    Zugang zu allen Aspekten eines Rechnersystems (Root-Rechte).


    # SCSI (engl. Small Computer Systems Interface)


    Festplattenstandard, der insbesondere aufgrund hoher Geschwindigkeit insbesondere
    besonders auf Servern und Rechnern höherer Preisklasse Verwendung findet.


    # Server


    Meist sehr leistungsfähiger Rechner, der anderen über ein Netzwerk angeschlossene
    Rechner (Clients) Daten und Dienste bereitstellt. Darüber hinaus geht sich alle
    Programme, die man aufgrund ihrer Konstitution bzw. Verfügbarkeit als „Server“
    bezeichnet.


    # Shell


    Oftmals äußert flexible Eingabe für Befehle, nicht selten mit einer eigenen Programmiersprache
    ausgestattet. Beispiele für Shells sind bash, sh und tsh.


    # SMTP (engl. Simple Mail Transfer Protocol)


    Protokoll zum Transfer von E-Mails


    # SSL (engl. Secure Socket Layer)


    Verfahren zur Verschlüsselung von HTTP-Datentransfers.


    # Systemadministrator (engl. system administrator, root user)


    siehe Root


    # Task


    Siehe Prozess.


    # TCP/IP


    Kommunikationsprotokoll des Internets; findet zunehmend auch in lokalen Netzen
    Verwendung, die man dann als „Intranet“ bezeichnet.


    # Telnet


    Telnet ist das Protokoll und Kommando, um mit anderen Rechnern (engl. hosts) zu
    kommunizieren.


    # Terminal (engl. terminal)


    Früher die Bezeichnung für einen einen Zentralrechner angeschlossene Tastatur-Bildschirm-Kombination
    ohne eigene Rechenleistung, im Deutschen auch als Datenschutzgerät oder Datenstation
    bezeichnet. Auf Workstations auch zur Bezeichnung von Programmen benutzt, die
    ein echtes Terminal emulieren.


    # Treiber


    Zwischen Betriebssystem und Hardware stehendes Programm, das die Kommunikation
    zwischen diesen beiden Schichten „übersetzt“.


    # Umgebung (engl. environment)


    Eine Shell stellt eine Umgebung zur Verfügung, in welcher der Benutzer temporär
    Einstellungen vornehmen kann. Diese Einstellungen sind zum Beispiel Pfadnamen
    zu Programmen, den Benutzernamen, aktuelle Pfad, das Aussehen der Prompts etc.
    Die Daten werden in einer Umgebungsvariablen gespeichert. Die Belegung der Umgebungsvariablen
    erfolgt z. B. durch die Konfigurationsdatei der Shell.


    # Umgebungsvariable (engl. environment variable)


    Ein Platz in der Shell. J Umgebungsvariable hat einen Namen, der in Großbuchstaben
    angegeben ist. Den Variablen werden, z. B. Pfadnamen, zugewiesen.


    # UNIX


    Betriebssystem, das vor allem auf Workstations in Netzwerken recht weit verbreitet
    ist. Seit Beginn der 90er Jahre ist UNIX in einer Freeware-Version für PCs erhältlich.


    # URL (engl. Uniform Resource Locator)


    Eindeutige Adresse im Internet, die sowohl den Typ (z. B. http://) ) als auch
    den Namen des Rechners beinhaltet (z. b. www.suse.de)


    # Verzeichnis (engl. directory)


    Verzeichnisse bauen die Ordnungsstruktur eines Dateystems auf. In einem Verzeichnis
    werden Datei- bzw. Verzeichnisnamen aufgelistet.


    # VESA (engl. Video Electronics Standard Association)


    Industriekonsortium, welches u. a. wichtige Video-Standards definierte.


    # Wildcard


    - siehe Jokerverzeichnis


    # Windowmanager


    - siehe Fenstermanager


    # Wurzelverzeichnis (engl. root directory)


    Das oberste Verzeichnis des Dateystems, das im Gegensatz zu allen Verzeichnissen
    kein übergeordnetes Verzeichnis mehr besitzt. Das Wurzelverzeichnis wird unter
    UNIX als ''/'' dargestellt.


    # WWW (engl. World Wide Web)


    Auf dem HTTP-Protokoll basierender graphischer Teil des Internets, mit so genannten
    ...


    # X1


    - siehe X


    # X System


    Das grafische Windowsystem für Unix-ähnliche Betriebssysteme.


    # Y (engl. yellow)


    siehe Fehler


    # Wurzelverzeichnis (engl. root directory)


    Das oberste Verzeichnis des Dateystems, das im Gegensatz zu allen Verzeichnissen
    kein übergeordnetes Verzeichnis mehr besitzt. Das Wurzelverzeichnis wird unter
    UNIX als ''/'' dargestellt.

