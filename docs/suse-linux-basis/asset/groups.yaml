    > 提示

    每个小组件（Applet）都有自己的配置选项和设置对话框。通过在小组件上右键，不仅可以将其移动或从面板移除，还可以进入这些配置对话框。


    - 桌面概览（Desktopübersicht）：您可以将桌面分为多个工作区域。为了快速访问各个界面，有一个桌面概览小组件。此外，您可以通过点击小组件中的箭头来访问程序。这将显示包含所有工作区域和正在运行程序的列表。

    - 任务列表（Taskliste）：为了管理当前运行工作区域上的程序，任务列表将程序显示为可点击的按钮。通过左点击确定哪个程序处于激活状态，通过右键可以触发不同的操作，例如结束程序或最小化/最大化窗口。


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_71_0.png)


    图 5.5：任务列表


    - 处理器和内存负载显示：此小组件让您一目了然系统状态。通过三个彩色条显示处理器、内存和交换内存的占用率。

    - GNOME 天气：此小组件向您显示世界上几乎每个地方的精确天气数据。必须保持永久 Internet 连接。


    在基础配置中，GNOME 已经提供了许多满足日常需求的小组件。如果您需要更多小组件，可以从网上下载。


    ## 桌面配置


    通过 GNOME 控制中心（见图 5.6），您可以在一处对桌面的所有外观进行设置。


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_72_0.png)


    图 5.6：GNOME 控制中心


    ## 工作空间


    **屏幕保护程序**：有许多屏幕保护程序可供选择，其中一些支持 3D 图形。作为一个多任务操作系统，Linux 可以同时执行多个进程，因此您可以通过“优先级”滑块为您的屏幕保护程序分配相应的计算能力。如果您的系统支持
    APM（英语高级电源管理），您可以通过“使用节电模式”在指定时间关闭显示器。


    **窗口管理器**：GNOME 不绑定到特定的窗口管理器。在此对话框中，您可以从系统现有的窗口管理器列表中选择一个。大多数窗口管理器使用随附的配置程序，可以通过点击“调用配置工具”来启动。


    > 提示

    虽然 GNOME 可以与任何窗口管理器配合，但并非所有的管理器都支持 GNOME。我们推荐 100% 兼容 GNOME 的 Sowfish。另一种方法是 Enlightenment，由于其复杂的图形效果，可以用它充分发挥整个系统的性能。


    ## 背景


    配置您的桌面背景。您可以选择一张图片并以各种方式将其设置为背景。如果图片显示变形，请选择“缩放”选项（保持比例）。或者，您也可以为桌面选择一种颜色渐变。在右侧的“预览”框中，您可以看到未设置前的背景外观。如需激活设置，请点击“应用”。


    ## 面板


    您可以在这里更改面板内容的设置。由于设置的描述文字将超出范围，因此我们只想向您介绍“按钮”选项卡，通过该选项您可以用磁贴填充面板上的图标。


    ## 选择主题


    GNOME 的一个特点是能够通过“主题（Themes）”完全更改桌面的外观。我们收集了一系列免费主题。这些主题可以在 xwm（窗口管理器）系列的 gtk-theme
    包中找到，并可以使用 YaST 进行安装。当 GNOME 首次启动时，将设置一个特殊的 SuSE 主题。


    ## 用户界面


    ### 应用程序


    这些选项影响所有兼容 GNOME 的应用程序。您可以在此处设置菜单、工具栏和状态栏的行为。几乎所有的 GNOME 菜单都是“可拆分的”，即它们可以脱变成一个独立的窗口。


    ### 对话框


    对话框用于与用户进行交互。在这里，您可以为所有显示对话框的 GNOME 兼容程序进行设置。在“对话框布局（Dialoglayout）”框架下，可以设置对话框按钮的对齐方式（右对齐、左对齐、均匀）以及是否可以使用键盘控制。在“对话框行为（Dialogverhalten）”框架下，您可以设置弹出对话框的位置。该决定可以由窗口管理器接管，或者由
    GNOME 将对话框框位于屏幕中央或鼠标所在的位置。通过“将对话框置于应用程序窗口之上”，可以确保弹出对话框始终在当前应用程序窗口上方打开。


    ### 模式


    这些选项影响所有兼容 GNOME 的应用程序。您可以在此处设置菜单、工具栏和状态栏的行为。几乎所有的 GNOME 菜单都是“可拆分的”，即它们可以变成一个独立的窗口。


