    图 5.8：Nautilus 窗口的工具栏


    “前进”和“后退”按钮允许您在普通的网络浏览器中导航。“上级”按钮切换到上一级目录。“刷新”强制重新加载视图。“搜索”功能允许您在计算机的本地资源中进行文件搜索：在底部的文本框中输入搜索词，点击“查找”按钮开始搜索。“网络搜索”将打开一个搜索引擎，您可以在其中搜索互联网上的内容。


    ## Nautilus 作为文件管理器


    缩放、图像和文本预览、图像和文本视图——这种通过图形化表示文件及其内容的方法几乎不可避免地会导致一个问题，即视觉化更多内容还是提供更多概览性更有意义。Nautilus
    通过可变的缩放功能帮助您在这之间平衡。文件管理器通常对文本和图形数据显示缩小后的视图，这已经足够提供信息，例如文本文件是如何开始的，或者它显示了什么图片。非常实用的是，您可以对许多文件进行放大和缩小：由用户决定。双击图标，文件管理器将用相应的关联程序打开文件；如果是图像文件，Nautilus
    将加载内置的图像查看模块并切换到图像的大视图。在这里，您也可以使用缩放键，例如当图像大于桌面分辨率时。


    > 提示

    > 如果您将文本文件显示为图标，您可以在图标中看到文本的前几个字。现在放大视图，您在看到图标放大的同时也能看到更多文本！


    点击 + 和 - 按钮之间的放大镜图标，将缩放比例调整为 100%，即原始大小。


    列表视图 另一种方法是，可以使用“以列表形式查看”按钮（两个缩放图标旁边）切换到列表显示，在文件非常多时，这种显示方式更实用。


    ## 对象的复制、移动和链接


    选择“文件” → “新建窗口”以出一个第二个 Nautilus 窗口。现在通过拖动和移动，您可以使用鼠标左键复制文件。相反，如果用右键拖动图标，目标位置将出现一个小型菜单，询问
    Nautilus 您是想在该处“移动”、“复制”还是“链接”对象。Nautilus 管理桌面以及位于那里的图标。当然，您可以将一个文件移动到桌面背景，或者链接三个文件。


    Nautilus 帮助 在窗口的左侧部分，您可以看到“帮助”标签页。Nautilus 汇总了所有和信息文档，并将其转换为统一的 HTML 格式。选择“帮助”标签页时，Nautilus
    的左侧会出现各种帮助主题的摘要，并以树形结构显示。当选择其中一个主题时，窗口的右侧将显示内容。


    位置笔记 在帮助标签页区域，您可以找到“笔记”标签页。您可以对窗口右侧看到的所有内容制作笔记：网页、目录或图像文件。笔记将始终与所显示内容的位置一起存储。


    历史记录 记录存储了所有访问过的位置，以便日后快速访问。您也可以通过菜单中的“转到”访问它。在这里您可以删除当前历史记录（“清除历史记录”）。


    文件系统 “树”标签页在您想要快速切换目录或将文件移动到其他目录时提供帮助；它提供了您的磁盘结构的清晰表示。正如在“复制、移动和链接对象”一点中提到的，您在这里也可以处通过简单地移动文件来触发复制操作。


    标记带徽章的对象 您可以为窗口右半部分的所有配备“徽章”。它们用于有目的地地标记文件或目录。例如，有“草稿”、“重要”或“个人”等符号。如果您右键点击文件或目录并在弹出的菜单中选择“显示属性”，将打开对话框。您会找到“基本”、“权限”和“徽章”三个标签页。选择哪些徽章随对象图标一起。您也可以分配多个徽章。更改将立即生效。


    图标的布局、位置和大小 与其他文件管理器不同，您可以个性化调整图标的视觉外观。通常，Nautilus 的“自动布局”会自动处理图标的布局、位置和大小。一旦您移动其中一个文件，文件管理器就会询问您是否想切换到“手动布局”。如果您确认“切换”，Nautilus
    将不再进行自动调整。

    突出特定对象的另一种方法是更改图标的大小。为此，请右键点击图标。在弹出的弹出菜单中，您可以调整大小。您也可以选择不同的缩放大小以便更好地查看图标。


    ## 配置 Nautilus 和桌面


    Nautilus 管理桌面上的图标。通过此，您可以使用颜色和图案调整桌面。


    Nautilus 具有三种难度级别，可据此调整操作。您可以通过顶部的“帮助”菜单更改当前设置。下文指的是“高级”级别。而在“学者”级别，显示的选项会多或少。


    偏好设置 在相同的菜单中，通过设置设置进入偏好对话框


    - “外观” – 在这里您可以对视图和使用的字体进行各种设置。特别重要的是：如果 Nautilus 消耗过多资源，请关闭“使用平滑图形”选项。放大图像和图标的功能使用了复杂的算法以获得更好的缩放质量。

    - “文件夹视图” – 在这里选择是双击还是单击启动。如果您希望在每次点击对象时都打开新窗口，请激活“窗口行为”框架下的相应功能。

    - “搜索” – 这涉及网络搜索以及“普通”搜索。您可以对搜索速度和网络搜索引擎的选择进行设置。

    - “侧边栏” – 在这里您可以设置窗口左部分显示哪些标签页。

    - “导航” – 设置 Nautilus 的主页。这可以是一个网页或目录。如果是为了连接互联网且您使用代理服务器，请激活“代理设置”框架下的相应设置，并勾选“使用
    HTTP 代理”。Nautilus 提供了一系列内置书签，例如指向 Linux 发行版和服务提供商。如果您想禁用这些，请取消勾选“不包含内置书签”。

    - “速度舒适度” – Nautilus 可以为图形、文本或声音类型的对象生成视图。可以理解，这需要大量的计算时间，例如为文本文件创建视图。如果不需要，您可以在关闭相应功能。


    '
