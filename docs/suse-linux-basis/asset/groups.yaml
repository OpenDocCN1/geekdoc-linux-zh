    etwas Falsches ein, sollte es trotzdem funktionieren, denn Netzbetreiber (z. B.
    die Telekom) sollte im Falle er Ihrem ISDN-Anschluss zugeordnete MSN verwenden.


    +   2. Die ISDN-Karte ist an eine Telefonanlage angeschlossen:'
  - '[PAGE 109]


    +   (a) Das Protokoll der Telefonanlage für die internen Anschlüsse Euro-

    ISDN/EDSS1 (in der Regel bei „kleinen“ Telefonanlagen für den

    Hausgebrauch): Diese Telefonanlagen haben einen internen S0-Bus

    und verwenden für die angeschlossenen Geräte interne Rufnummern. Verwenden Sie
    in einem solchen Fall die interne Rufnummer

    als MSN. Weitere Informationen entnehmen Sie der Dokument-

    tation Telefonanlage. Irgendeende der gemäß Telefonanlage mög-\lichen MSNs müssen
    funktionieren, sofern für diese MSN der Zugriff

    auf freigeschaltet ist. Im Notfall funktioniert weiterhin auch eine

    eine einzelne Nummer.


    +   (b) Das Protokoll der Telefonanlage für die internen Anschlüsse ist 1TR6

    (das ist normalerweise noch bei „größen“ Telefonanlagen in Fir-

    den Fall): Die MSN heißt hier, „EAZ“ und ist üblicherweise die

    Durchwahl. Bei der Linux-Konfiguration ist normalerweise nur die

    letzte Fiber der EAZ einzutragen. Im Notfall probieren Sie die Ziffern

    1 bis 9.


    Im Folgenden entscheiden Sie sich für einen Wechselmodus: ‘Manuell, Auto-

    tomatisch’ oder ‘Aus’. Lesen Sie bitte Seite 97 zum Wechselmodus ‘Auto-

    matisch’. Wählen Sie sich nach ‘Manuell’, dann können Sie sich nach-

    her z. B. bequem per Konferenz oder im Internet einwählen. In der Shell

    wählen Sie sich ein mit /usr/sbin/isdnctl/isdnctrl dial ipp00 und mit

    /usr/sbin/isdnctrl hangup ipp00 sie wieder auf. Hier sind

    ner können einstellen, wie viele Sekunden die Verbindung automatisch-

    abgebrochen werden soll, wenn keine

    60 Sekunden zu empfehlen. In diesem Zusammenhang steht auch ‘ChargeHUP’,

    welches bei Aktivierung wirkt, dass dieses automatische Auflegen vor der

    nächsten zu zahlenden Gebühühreneinheit erfolgt. Das funktioniert jedoch nicht

    mit Provider.


    Es empfiehlt sich dringend, den Punkt ‘ISDN-System beim Booten initialisieren’

