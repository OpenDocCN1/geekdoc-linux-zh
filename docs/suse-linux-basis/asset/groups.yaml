    Konsole den Inhalt des Verzeichnisses test mit an angezeigt. Das hilft nur, wenn
    die normale Ausgabe ist zu unbersichtlich wird. Sehen Sie sich z. B. das Verzeichnis
    mit ls /dev an, dann sehen Sie im Fenster nur einen Teil des Inhaltes, welches
    stattdessen mit ls /dev | alle Dateien aulisten.


    Falls Sie die Ausgabe von Befehlen in einer Datei speichern wollen, würde der
    Befehl im Beispiel so: ls > Inhalt. Danach haben Sie eine neue Datei mit Namen
    „Inhalt“, die Dateien und Verzeichnisse in test enthält. Mit less können Sie sich
    die Datei anschauen.

    Umgekehrt können Sie eine Datei als Quelle für einen Befehl verwenden. Lassen
    Sie z. B. die Textzeilen Ihrer selbst geschriebenen Testdatei alphabetisch sortieren
    über sort < Testdatei. Die Ausgabe des Befehls erfolgt auf dem Bildschirm. Sie
    sehen nun den Text, den zuvor geschrieben haben, sortiert nach den Anfangsbuchstaben
    in jeder Zeile. Das kann sehr hilfreich sein, wenn Sie z. B. eine unsortierte
    Namensliste sortieren möchten.'
  - '[PAGE 138]


    # 7


    Wollen Sie eine neue Datei mit der sortierten Liste, müssen Sie die Ausgabe des
    sort-Befehls wieder in eine Datei lenken. Wenn Sie das nachvollziehen möchten,
    erstellen Sie in einem Editor eine unsortierte Liste Namensliste, und speichern
    Sie diese unter dem Namen liste im Verzeichnis test.


    Gehen Sie ins Verzeichnis und rufen Sie den Befehl sort < liste > sortierteListe
    auf. Sehen Sie sich sich mit die neue Liste an.


    Die Standard-Fehlerausgabe ist ebenfalls der Bildschirms. Wenn Sie diese diese
    in einer Datei mit "Fehler" umleiten möchten, geben Sie im Anschluss an den Befehl:
    2 Fehler. Wenn Sie > Ausgabe an sowohl die Standardausgabe sowie die Standardausgabe
    als die Fehlerausgabe. Wenn an Stelle einmal = zweimal >> benutzt, wird die Ausgabe
    an eine vorhandene Datei angehäng.


    # Archive und Datenkompression


    Nachdem Sie schon einige Dateien und Verzeichnisse angelegt haben, wenn wir uns
    mit dem Thema Archivierung und Datenkompression zu sind. Angenommen, Sie möchten
    das ganze Verzeichnis test in einer Datei zusammenpacken lassen, damit Sie diese
    auf Diskette als Sicherungskopie speichern oder per E-Mail verschicken können.
    Dazu benutzen Sie den Befehl tar (engl. tape archiver). Mit mit tar --help können
    Sie sich alle Optionen zu tar ansehen, die wichtigsten allerdings hier erklärenären:


    +   -c (engl. create) neues Archiv anlegen.


    +   -t (engl. table) Inhalt eines Archives anzeigen.


    +   -x (engl. extract) Archiv entpacken.


    +   -v (engl. verbose) zeigt während des Einpackens alle Dateien auf dem Bildschirm
    an.


    +   -f (engl. file) Damit können Sie einen Dateinamen für die Archivdatei wählen.

    Beim Packen muss diese Option immer als letztes angegeben werden.


    Arbeiten mit der Shell


    SuSE Linux - Basis 129'
  - '[PAGE 139]


    Um nun das Verzeichnis mit allen Dateien und Unterverzeichnissen in ein Archiv
    mit dem Namen test.tar zu packen, brauchen wir auf auf jeden Fall die Optionen:
    -c und -f. Da wir den Fortschritt beim Archivieren mitverfolgen wollen, geben
    wir auch die Option -v an, die sonst nicht notwendig wäre. Gehen Sie sich mit
    cd in Ihr Home-Verzeichnis, wo sich das Verzeichnis befindet. Die Eingabe lautet
    nun: tar -cvf test.tar. Schauen Sie sich nach den Inhalt der Archivdatei an: tar
    -tf test.tar. Übrigens bleibt das Verzeichnis test mit allen Dateien und Verzeichnissen
    unverändert auf Ihrer Festplatte. Um das Archiv wieder auszupacken, müssen Sie
    tar -xvf test.tar eingeben. Tun Sie das bitte nicht ein, wenn wir noch die Archivdatei
    komprimieren wollen, um Speicherplatz zu sparen.

    Dazu empfiehlt sich das weit verbreitete gzip, gzip test.tar. Wenn Sie nun ls
    eingeben, sehen Sie, die Datei test.tar verschwunden ist, und stattdessen eine
    Datei test.tar.gz existiert. Diese Datei ist kleiner und lässt sich daher besser
    verschicken per E-Mail oder passt leichter als eine Diskette.

    Und sollen Sie das Archiv im Verzeichnis test2 kopieren. Sie dazu dazu die Archivdatei
    mit cp test.tar.gz in test2 wechseln und wechseln Sie mit cd test2 das Verzeichnis.
    „Entpacken“ der gepackten Archivdatei mit dem Ende .gz wird der Befehl gunzip
    genutzt, so dass die Eingabe gunzip test.tar.gz lautet. Wir erhalten die Datei
    test.tar, die noch mit tar -xvf test.tar aufgelöst werden muss. „Entpacken“ des
    gepackten Archives können Sie auch gleich zum mit tar-Befehl die Option -z hinzuzufügen
    und das Archiv mit tar -xvzf test.tar.gz auspacken.


    Durch Eingabe von ls sehen Sie, dass Sie ein neues Verzeichnis mit dem gleichen
    Inhalt wie Ihr Home-Verzeichnis haben.


    # mtools


    Die mtools sind ein Satz von Befehlen, mit denen man auf MS-DOS-Dateisystem arbeiten
    kann. Das ist für die Arbeit mit Disketten-Laufwerken wichtig. Das Laufwerk kann
    unter MS-DOS als a: angesprochen werden. Die Befehle ähnel denen unter MS-DOS,
    allerdings mit vargestellten:


    +   - mdir a: - zeigt den Inhalt der Diskette im Laufwerk a.

    - mcopy a:Testdatei a - kopiert die Datei Testdatei auf die Diskette.

    - mdel a:Testdatei - löscht Testdatei auf a:

    - mformat a: - formatiert Disketten im MS-DOS-Format mit Hilfe des Befehls fformat.'
- md: "\n[content]\nmcd a: a - wird Ihr aktuelles Verzeichnis.\n\nmkdir a:test - erzeugt\
    \ das Unterverzeichnis test auf der Diskette.\n\nrmdir a:test - löscht das Unterverzeichnis\
    \ test auf der Diskette.\n\n# Aufräumen\n\nSie haben in diesem Crash-Kurs die\
    \ wichtigsten Grundlagen im Umgang mit der Shell gelernt. Damit Ihr Heimat-Verzeichnis\
    \ nicht zu unübersichtlich wird, sollten Sie die Dateien und -verzeichnisse nicht\
    \ mit den Befehlen rm und rmdir wieder löschen.\nIm Anschluss dieses Kapitel finden\
    \ Sie eine Liste mit den wichtigsten Befehlen und entsprender Kurzbesch.\n\n#\
    \ Benutzerrechte\n\nLinux wurde von Anfang an als Multiuser-System konzipiert,\
    \ also für die gleichzeitige Nutzung durch mehrere Anwender. Daraus ergeben sich\
    \ einige wichtige Unterschiede zu Microsoft-System Windows.\nDas wohlste Unterscheidungsmerkmal\
    \ ist der Zwang, sich zu Beginn einer Arbeitssitz am System anzumelden. Dazu wird\
    \ der Benutzer über einen eigenen „Benutzernamen“ mit zugehörigen Passwort gewährt,\
    \ dass Unbefugte keinen Einblick in für sie gesperrte Inhalte erhalten können.\
    \ Größere Veränderungen am System, z. B. die Installation von Programmen, sind\
    \ einem Benutzer in der Regel nicht oder nur beschränkt möglich. Nur root, der\
    \ Administrator, verfügt über praktisch unbegrenzten Zugriff auf alle Dateien.\
    \ Dieses Konzept ist sicher und nutzt sich nur bei Bedarf der „Allin“ als root\
    \ einloggt, wird die Gefahr unbeabsichtigter Datenverluste stark eingrenzt: Da\
    \ im Normalfall nur der Administrator Systemdateien löschen oder Festplatten formatieren\
    \ kann, wird die Bedrohung durch Trojanische Pferde oder wesentlich eingegebene\
    \ destrukt Befehle stark eingeschränkt werden.\n\n# Rechte im Dateisystem\n\n\
    Gruätzlich gehört jede Datei im Linux-Dateisystem einem Benutzer und einer Gruppe.\
    \ Jeder dieser beiden Seitenparteien, auch „Fremden“, können vom Besitzer Schreib-,\
    \ Lese- sowie Ausführrechte zugewiesen werden.\n\nAls Gruppe werden Zusammenschlüsse\
    \ von Benutzern mit bestimmten kollektiven Rechten bezeichnet. So ist eine solche\
    \ Gruppe eine einem bestimmten Projekt arbeitende Arbeitsgruppe, nennen wir sie\
    \ projekt3. Jeder Benutzer unter Linux ist Mitglied in mindestens einer Verwaltungseinheit,\
    \ standardmäßig wird nur users eingetragen. Wir können nahezu beliebig Gruppen\
    \ anlegen, allerdings ist nur root dazu. Jeder Benutzer kann mit dem Befehl herausfinden,\
    \ in welcher Gruppe er Mitglied ist.\n\n# Rechte auf Dateien\n\nBetrachten wir\
    \ die Rechtestruktur im Dateisystem genauer und beginnen mit den Dateien. Die\
    \ Ausgabe von ls -l kann beispiweise so aussehen:\n\n```\n-rw-r----- 1 tux projekt3\
    \ 14197 Jun 21 15:03 Roadmap\n```\n\n> Ausgabe 1: Beispielausgabe der Zugriffsrechte\
    \ von Dateien\n\nWie Sie anhand der dritten Spalte erkennen, gehört diese Datei\
    \ dem Benutzer tux, als Gruppe projekt3 zugeordnet. Der Recht auf die Datei sehen\
    \ zu können, betrachten wir die erste Spalte genauer.\n\n| Typ | Benutzer | Gruppen\
    \ | Rechte für andere Benutzer |\n|---|---|---|---|\n| - | rw- | r-- | r-- |\n\
    \nDie Spalte gliedert sich in ein führendes sowie neun in Detailgruppen aufgeteilte\
    \ Zeichen. Der erste der Zeichen steht für den Typ des gelisteten Dateisystembestandes.\
    \ Der Bindstrich zeigt, dass es sich um eine Datei handelt. Er könnte genauso\
    \ aus wie ein Verzeichnis (d), ein Querverweis (l), ein Block (b) bzw. Charakter-Gerät\
    \ (c) stehen.\nDie folgenden zwei Blöcke folgen einem einlichen Schema: Das sind\
    \ jeweils zwei Zeichen an, ob die jeweilige Fraktion Leszugriff auf die Datei\
    \ verfügt (r) oder nicht (-). Ein w in der mittleren Einheit symbolisiert, Schreibzugriff\
    \ auf das jeweilige Objekt erlaubt, steht dort ein Bindstrich (-), so ist dies\
    \ nicht möglich. Darüber hinaus könnte in der rechten Spalte ein x dargestellt\
    \ sein, welches für einen Ausführungszugriff stünde. Da es sich um ein Beispiel\
    \ für einen Text-, also nicht um eine ausführbare Datei handelt, kann auf diese\
    \ exsekutiven Rechte verzichtet werden.\n\nIn unserem Beispiel hat auch tux als\
    \ Besitzer der Datei Roadmap sowohl Lesezugriff (r) als auch Schreibzugriff (w),\
    \ kann sie aber nicht ausführen (kein x). Die Mitglieder der Gruppe projekt3 können\
    \ die Datei nur lesen, aber verändern oder ausführen. Andere Benutzer haben keinen\
    \ Zugriff auf diese. Benutzer kann mit dieser Sicherheitseinstellung dafür sorgen,\
    \ dass nur autorisierte Personen (die Arbeitsgruppenmitglieder) die Datei lesen\
    \ können und nur sie verändern können.\n\n# Rechte auf Verzeichnisse\n\nWenden\
    \ wir uns den Zugiffsrechte für Verzeichnisse zu, zu der Typ ist. Hier haben die\
    \ einzelnen Rechte eine etwas andere Bedeutung. Ein kleines Beispiel zur Verdeutlichung:\n\
    \n```\ndrwxr-xr-x   1 tux projekt3   35 Jun 21 15:15 Projektdaten\n```\n\n**Ausgabe:\
    \ 2:** Beispielaus der Zugiffsrechte auf Verzeichnisse\n\nAuch hier sind Besitzer\
    \ (tux) und Benutzergruppe (projekt3) des Verzeichnisses Projektdaten leicht zu\
    \ erkennen. Im Gegensatz zu den Datenrechten Recht im Dateisystem aus dem vorherigen\
    \ Jahr bedeutet das gesetzte Lesrecht (r) jedoch, dass der Inhalt des Verzeichnisses\
    \ angezeigt werden kann. Das Schreibrecht (w) steht darüber hinaus für die Berechtigung,\
    \ neue Dateien anzulegen zu dürfen, das Exekutivrecht (x) erlaubt neben dem Benutzer\
    \ auch die Mitglieder der Gruppe projekt3 im Verzeichnis Projektdaten wechseln\
    \ (x), den Inhalt anzeigen (r) und Dateien anlegen dürfen (w). Alle übrigen Benutzer\
    \ mit weniger Rechten ausgestattet, dürfen in das Verzeichnis wechseln (x) bzw.\
    \ durchstöbern (r), jedoch keine Dateien ablegen (w) nicht gesetzt.\n\n# Dateberechtigungen\
    \ anpassen\n\n# Ändern von Zugiffsrechte\n\nDie Zugiffsrechte einer Datei eines\
    \ Verzeichnisses können vom Besitzer (und natürlich von root) mit dem Befehl chmod\
    \ verändert werden, der zusammen mit Parametern für die zu ändernden Zugiffsrechte\
    \ sowie die Namen der Datei eingegeben wird.\n\nDie beiden Parameter setzen sich\
    \ zusammen:\n\n1. den betroffenen Kategorien\n   - u (english) - der Besitzer\
    \ der Datei\n   - g (engl. group) – die Gruppe des Besitzers\n   - o (engl. others)\
    \ – sonstige Benutzer (wird kein Parameter angegeben, gelten die Änderungen für\
    \ alle Kategorien)\n\n2. einem Zeichen für Entzug (-), Gleichsetzung (=) bzw.\
    \ Hinzufügen (+)\n\n3. den bereits bekannten Abkürzungen für\n   - r (engl. read)\
    \ – lesen\n   - w (engl. write) – schreiben\n   - x (engl. execute) – ausführen\n\
    \nsowie, durch Leerzeichen getrennt, für den Namen der Dateien.\n\nMöchte nun\
    \ allen Benutzern das Verzeichnis Projektaten gewähren, kann er dies den folgenden\
    \ Befehl:\n\n```\nchmod o+w projektaten\n```\n\nWill er jedoch sich selbst das\
    \ Schreibrecht entziehen, nimmt er:\n\n```\nchmod u-w projektaten\n```\n\nUm allen\
    \ Benutzern das Verzeichnis Projektaten zu verbieten, schreibt man:\n\n```\nchmod\
    \ o-w projektaten\n```\n\n# Ändern von Eigentumsrechte\n\nWeitere Kommandos, die\
    \ Eigentumsverhältnisse regeln, sind chown (Change Owner) und chgrp (Change Group).\
    \ Der Befehl chown dient dazu, einen Benutzer zu ändern. Allerdings darf root\
    \ diese Änderung vornehmen.\n\nAngenommen, die Datei Roadmap aus Beispiel 2 soll\
    \ nicht mehr tux, sondern dem Benutzer geek gehören, so lautet der entsprechende\
    \ Befehl:\n\n```\nchown geek Roadmap\n```\n\n# Wichtige Linux-Befehle im Überblick\n\
    \nIn diesem Abschnitt möchten wir Ihnen einen Überblick über die wichtigsten Befehle\
    \ Ihres Systems geben. Dabei werden wir die Grundbedeutung der einzelnen Kommandos\
    \ auf einige Parameter eingehen, und wenn es sich anbietet, ein typisches Anwendungsispiel\
    \ liefern.\n\nUm über die Details dieses Kommandos zu erfahren, können Sie zusätzliche\
    \ Informationen mit dem Program man gefolgt von Befehl erhalten z. B.\n\n```\n\
    man ls\n```\n\nIn diesen „Manual Pages“ können Sie sich mit den Bildlauften ↑\
    \ ↓ abwärts vom Anfang bis Ende der Dokumentation bewegen. Beenden Sie diesen\
    \ Darstellungsmodus durch Drücken der Taste Q. Durch Eingabe von man können Sie\
    \ mehr über man-Befehle selbst erfahren.\n[/content]\n"
