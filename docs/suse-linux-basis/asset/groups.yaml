    & Benutzer’ und geben Sie das root-Passwort ein. Im rechten Feld erscheint eine
    Auswahl von Möglichkeiten unter anderem der Punkt ‘neuen Benutzer anlegen’. Wenn
    Sie die Felder ausfüllen (Vorname und Nachname), wird ein neuer Benutzer angelegt
    und ein Passwort (Kennwort) hinterlegt.'
  - '[PAGE 20]


    Bei der Eingabe eines Passwords müssen Sie Groß- und Kleinschreibung unterscheiden.
    Ein Passwort sollte mindestens fünf Zeichen lang sein und keine Sonderzeichen
    (z. B. Akzente) enthalten. Erlaubt sind die Zeichen #*,;-_+$%&/![] Leerzeichen
    und Ziffern von 0 bis 9 sind zweckmäßig, eine Länge von ca. 8 Zeichen zu wählen.
    Um sicherzustellen, dass das Passwort korrekt eingegeben wurde, muss es in einem
    zweiten Feld ohnezeichen wiederholt werden. Wichtig: Merken Sie sich das Passwort
    gut!


    Der sog. Benutzername (login) wird als Komponenten des gesamten Namens erzeugt.
    Sie können YaST2 einen Benutzernamen vorschlagen. Diese können Sie ändern oder
    selbst einen Namen eingeben. Der Name darf nicht Kleinbuchstaben (wie Umlaute),
    Ziffern und die Zeichen _ enthalten. Benutzernamen haben noch stärkere Beschränkungen
    als Passwörter.


    Wenn Sie mit Linux arbeiten, melden Sie sich mit diesem Benutzernamen und dem
    Passwort System an; dieser Vorgang des Anmelden wird auch beim Login bezeichnet.


    Wenn Sie einen Nutzer löschen wollen, wählen Sie den Punkt ''Nutzer anlegen und
    bearbeiten''. Wählen Sie den Nutzer aus und klicken auf ''löschen''.


    # Mounten, Shell und anderes


    +   - Was ist mount?


    Weil es mount gibt, können Sie eine Diskette oder CD nicht einfach aus dem Laufwerk
    nehmen. Selbst wenn diese Medien in das Laufwerk eingelegt werden, müssen sie
    erst gemountet, bevor sie gelesen werden können. Der Befehl mount führt einen
    Datenträger in den Dateibaum ein, mit umount kann dieser wieder entfernt werden
    (unter KDE wird diese Aktion im Hintergrund ausgeführt, etwa wenn Sie auf CD-Symbol
    klicken).


    Warum ist das so?

    Wie immer keine kleine Linuxhden als eigentlich praktisch. Linux ist es, welche
    Form von Datenträger Sie mounten wollen, ob Floppy, DVD, Festplatte oder ZIP-Laufwerk,
    alle werden beim System und wieder abemeldet. Ein System oder Arbeitsplatz, an
    dem viele Personen gleichzeitig arbeiten, ist dassofern wichtig, dass mehrere
    Benutzer und mehrere Programme auf den Dateibaum zugreifen können.'
  - '[PAGE 21]


    Stellen Sie sich einmal vor, jemand würde dort in der Firma die Schubladen austauschen,
    nur weil er für eine Stunde an Ihrem Schreibtisch arbeitet. Sie kommen zwischendurch
    zurück und suchen einen ganz wichtigen Vertragsentwurf, doch nun ist Ihre Schublade
    nicht mehr da. Aus diesem Grund müssen Sie solche „Schubladen“, die Laufwerke
    unseres Dateisystems, mounten und unmounten.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_21_0.png)


    +   ■ Warum kann ich meinem Rechner nicht einfach ausschalten?

    Doch das können Sie, nur wäre dieser Knockout nicht besonders nett. Es könnte
    ja sein, außer Ihnen ist noch ein zweiter Nutzer vernetzt an Ihrem Rechner arbeitet.
    Und denn noch nicht gespeicherte Daten sind in Gefahr, wenn Sie das System einfach
    ausschalten.


    Natürlich gilt das auch für Ihre eigenen Daten, wenn Sie sich aber ordnungsgemäß
    abmelden, haben Sie die Gewissheit, dass Ihre Daten sicher gespeichert sind. SuSE
    Linux ist bekannt für seine hohe Datensicherheit, warum diese Eigenschaft nicht
    nutzen?


    +   ■ Alles hört auf Kommando!

    In einem Linux-System kommt man immer über mehrere Wege zum Ziel. Das mag am Anfang
    etwas verwirrend sein, aber hat viele Vorteile. Soll eine Funktion ausfallen oder
    gesperrt sein, können Sie diesel Befehle dem Rechner auch anders mitteilen.


    So können Sie beispielsweise anstelle des Programmaurufs per Mausklick im Menü
    den Programmnamen auch über die Tastatur eingeben und das Programm trotzdem starten.
    Oder lassen Sie sich den Inhalt eines Ordners `ls` zeigen.'
  - '[PAGE 22]


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_22_0.png)


    Eingegeben werden solche Befehle über die Textkonsole, ein unspektakuläres kleines
    Textfeld, über das der Computer fast vollständig gesteuert werden kann. Profis
    arbeiten gerne mit der Konsole, weil man hier Befehle zu einer langen Befehlskette
    zusammenfassen kann und dadurch am Ende schon fast etwas wie ein kleines Programm
    hat. Von Fall zu Fall ist das viel praktischer als mit der Maus zu arbeiten. Mehr
    zum Arbeiten mit der Konsole finden Sie weiter hinten in dem Kapitel Arbeiten
    mit der Shell.'
- md: '

    ## Installation


    Einfacher geht''s kaum: Im Optimalfall reichen wenige Klicks aus und SuSE-Linux
    ist komplett auf Ihrem Rechner installiert. Wenn bisher noch kein Linux-System
    auf Ihrem Rechner installiert ist, wird Ihre Festplatte automatisch partitioniert,
    ein eventuell installiertes Windows-System (9x/ME) verkleinert, eine Auswahl an
    Software installiert und Ihre Hardware automatisch eingerichtet. Sind Sie mit
    den Vorschlägen des Installationsprogramms YST2 nicht zufrieden oder haben Sie
    spezielle Ansprüche an Ihr System? Kein Problem, denn Sie können natürlich jeden
    Vorschlag zur Installation manuell ändern.


    - Wichtige Tipps vorweg – unbedingt lesen! ... 16

    - Erster Schritt: Die Sprachauswahl ... 16

    - Zweiter Schritt: Vorschläge annehmen ... 16

    - Dritter Schritt: Installation ... 18

    - Abschluss: Die Konfiguration ... 18


    ## Wichtige Tipps vorweg – unbedingt lesen!


    Partitionen mit NT-Dateisystemen von Microsoft können bisher, da Microsoft die
    Spezifikationen dieser Dateisysteme nicht offen gelegt hat, noch nicht von Linux
    verkleinert. Betroffen sind Windows NT, 2000 und XP, wenn Sie ein NTFS-Dateisystem
    verwenden. Bei vorkonfigurierten Rechnern ist das der Fall.


    Wenn Sie einen Computer haben, auf dem eines dieser Systeme auf einer einzigen
    Partition installiert ist, wird beim Installieren von SuSE Linux das System unwiederbringlich
    gelöscht. Die ganze Festplatte wird von Linux formiert. In diesem Fall benötigen
    Sie Ihre Windows-Installationssoftware, um im Bedarf Ihr System wieder zu installieren.
    Wenn Ihr Windows mit dem Dateisystem NTFS vorinstalliert ist, aber Sie die Installations-CDs
    dabei besitzen, können Sie XP neu installieren und dabei „FAT32“ als Datesystem
    für XP wählen. Damit wird die Festplatte mit dem FAT-Dateisystem formiert, und
    dieses kann der Linux-Installation ohne Probleme verkleinert werden.


    Sollten Sie in Ihrem jedoch noch eine Partition haben (außer Laufwerk C: noch
    weitere Festplattenlaufwerke), kann SuSE Linux theoretisch problemlos auf einer
    der zusätzlichen Partitionen installieren. Wenn sich Daten auf der Partition befinden,
    auf die Sie Linux installieren wollen, sollten Sie diese allerdings vorher auf
    einer anderen Partition sichern.


    ## Erster Schritt: Die Sprachauswahl


    Schalten Sie Ihren Rechner ein und legen Sie die CD 1 oder die DVD in das entsprechende
    Laufwerk. Als Erst erhalten Sie die Möglichkeit, die Sprache für Ihr System auszuwählen.
    Die Spracheinstellung, die Sie wählen, wird automatisch für Ihr Tastaturlayout
    übernommen.


    ## Zweiter Schritt: Vorschläge annehmen


    Linux überprüft jetzt als erstes Ihr System. Falls Sie schon ein Linux-Betriebssystem
    auf Ihrem Rechner installiert haben, werden Sie im nächsten Fenster gefragt, ob
    Sie SuSE Linux komplett neu installieren wollen, ein Update Ihres bisherigen Systems
    möchten oder ob Sie das auf Ihrer Festplatte befindliche System booten wollen.


    Wenn bis bisher kein Linux auf Ihrem Computer installiert ist oder Sie ''Neuinstallation''
    gewählt haben, überprüft SuSE Linux jetzt Ihre komplette Hardware und listet das
    Ergebnis im Anschluss im so genannten ''Vorschlagsfenster'' auf (siehe Abb. 2.1
    auf der nächsten Seite). Sie sehen in diesem Fenster zusätzlich die Partitionierungsvorschläge
    (ggf. Windows-Verkleinerung) und die Installationsoptionen (Neuinstallation).
    Wenn Sie zum ersten Mal Linux installieren, sollten Sie diese Vorschläge annehmen
    – sie sind in der Regel sinnvoll gewählt. Folgende Meldungen und Vorschläge erscheinen
    nach dem Systemcheck:


    **Installationsmodus** ist hier "Neuinstallation" der Standardwert.


    **Tasturlayout** Das Tasturlayout wird nach der Sprache ausgewählt, die man im
    ersten Schritt angibt.


    **Maus** der erkannte Mausertyp wird angegeben.


    **Partitionierungsvorschlag** hier wird eine sinnvolle Partitionierung vorgeschlagen.
    Falls sich Windows 9/ME auf der Platte befindet, wird angegeben, wie stark diese
    verkleinert wird.


    **Softwareauswahl** Ein Standardsystem mit Office-Paket ist hier eingestellt.


    **Boot Loader** Hier ist eingestellt, wo SuSE Linux den Bootmanager LILO installiert.
    Hier ist der Master Boot Record (MBR).


    **Zeiteinstellungen** Hier wird nach der Sprache eine Zeitzone des jeweiligen
    Landes eingestellt. Diese Einstellung muss natürlich häufig manuell geändert werden,
    da viele Sprachen in verschiedenen Ländern gesprochen werden und SuSE Linux ja
    (bisher noch) nicht erraten kann, in welchem Land Sie wohnen.


    Sie können jederzeit durch Klick auf die jeweiligen Parameter die von YST2 gemachten
    Vorschläge ändern. Bei richtiger Hardware ist eine Änderung natürlich nicht sehr
    sinnvoll. Haben Sie einen Parameter geändert, können Sie jedes Mal wieder zur
    Auswahl zurück und können mit einem Klick auf ''Weiter'' die Installation mit
    den geänderten Werten fortsetzen.


    **Achtung**

    Falls Sie Änderungen an Bootloader-, Partitionierung- oder Hardwareeinstellungen
    vornehmen, sollten Sie genau wissen, was Sie tun.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_27_0.png)


    Abbildung 2.1: „Vorschlagsfenster“ – Erkannte Hardware, Installations- und Partitionierungsvorschläge


    ## Dritter Schritt: Installation


    Nun ist es so weit: wenn Sie im grünen Fenster ‚Ja‘ wählen, geht es los mit der
    Installation. Je nach Computerleistung haben Sie in ca. 15 Minuten ein fertig
    installiertes System mit einer Auswahl von ca. 350 Programpaketen. Während der
    Installation sehen sich Informationen zu einigen weiteren SuSE-Produkten. Sie
    können auch ‚Details‘ klicken.


    ## Abschluss: Die Konfiguration


    Nach Beendigung der Installation müssen Sie noch wichtige Einstellungen vornehmen,
    bevor Sie endgültig mit SuSE arbeiten können.


    Achtung

    Falls Sie Änderungen an Bootloader-, Partitionier- oder Hardwareeinstellungen
    vornehmen, sollten Sie genau wissen, was Sie tun.


    Nach der Konfiguration können Sie den Bildschirm neu starten. Bei Bedarf können
    Sie noch Einstellungen vornehmen.


    Viel Spaß mit SuSE Linux!

    '
  mdcn: '


    ## 安装


    过程几乎再简单了：在理想情况下，只需点击几次，SuSE-Linux 就会完全安装在您的计算机上。如果您的计算机上尚未安装任何 Linux 系统，程序将自动对您的硬盘进行分区，缩小可能已安装的
    Windows 系统（9x/ME），安装一系列软件并自动配置您的硬件。如果您对 YST2 安装程序的建议不满意，或者对您的系统有特殊要求，没问题，因为您当然可以手动修改任何安装建议。


    - 题前的重要提示——务必阅读！... 16

    - 第一步：选择语言 ... 16

    - 第二步：接受建议 ... 16

    - 第三步：安装 ... 18

    - 结束：配置 ... 18


    ## 题前的重要提示——务必阅读！


    由于微软尚未公布这些文件系统的规范，目前 Linux 尚无法缩小带有微软 NT 文件系统的分区。如果您使用 NTFS 文件系统，受影响的包括 Windows
    NT、2000 和 XP。预配置的计算机通常属于这种情况。


    如果您拥有一台计算机在单个分区上安装了上述任一系统，那么在安装 SuSE Linux 时，该系统将被不可恢复地删除。整个硬盘将由 Linux 格式化。在这种情况下，您需要
    Windows 安装软件以便在需要重新安装系统。如果您的 Windows 预装了 NTFS 文件系统，但您拥有安装 CD，可以重新安装 XP 并选择“FAT32”作为
    XP 的文件系统。这样硬盘将以 FAT 文件系统格式化，Linux 安装就可以毫无问题地缩小它。


    但如果您在系统中还有其他分区（除 C 盘外的其他硬盘驱动器），SuSE Linux 理论上可以顺利地安装在其中一个额外分区上。不过，如果要在打算安装 Linux
    的分区上有数据，您应该先将其备份到另一个分区中。


    ## 第一步：选择语言


    启动您的计算机，并将 CD 1 或 DVD 放入相应的驱动器。首先，您将获得选择系统语言的机会。您选择的语言设置将自动应用于您的键盘布局。


    ## 第二步：接受建议


    Linux 现在首先会检查您的系统。如果您已经在计算机上安装了 Linux 操作系统，下一个窗口中会询问您是想完全重新安装 SuSE Linux、对现有系统进行更新，还是启动硬盘上的系统。


    如果到目前为止计算机上尚未安装 Linux，或者您选择了“新安装”，SuSE Linux 现在将检查您的完整硬件，并将结果列在所谓的“建议窗口”中（见下页的图
    2.1）。在此窗口中，您还将看到分区建议（可能包括 Windows 缩小建议）和安装选项（新安装）。如果您是第一次安装 Linux，应该接受这些建议——它们通常是经过合理选择的。系统检查后会出现以下消息和建议：


    **安装模式**：此处的默认值为“新安装”。


    **键盘布局**：键盘布局将根据第一步中指定的语言进行选择。


    **鼠标**：此处显示识别出的鼠标类型。


    **分区建议**：此处建议一个合理的分区方案。如果磁盘上存在 Windows 9/ME，将指定其缩小的程度。


    **软件选择**：此处设置了带有 Office 软件包的标准系统。


    **引导加载程序（Boot Loader）**：此处设置了 SuSE Linux 安装引导管理器 LILO 的位置。这里是主引导记录 (MBR)。


    **时间设置**：此处将根据语言设置相应国家的时区。此设置显然需要经常手动更改，因为许多语言在不同的国家被使用，而且 SuSE Linux（目前）无法猜测您住在哪个国家。


    您可以随时通过点击相应的参数来更改 YST2 提供的建议。在硬件正确的情况下，更改通常没有太大意义。如果您更改了某个参数，可以每次都返回选择界面，并点击“继续”以使用更改后的值继续安装。


    **注意**

    如果您对引导加载程序、分区或硬件设置进行更改，您应该准确了解自己在做什么。


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_27_0.png)


    图 2.1：“建议窗口”——已识别的硬件、安装和分区建议


    ## 第三步：安装


    现在到了这一步：如果您在绿色窗口中选择“是”，安装将开始。根据计算机的性能，您将将在约 15 分钟后获得一个安装完成的系统，其中包含约 350 个软件包。在安装期间，会显示有关其他几个
    SuSE 产品的信息。您也可以点击“详细信息”。


    ## 结束：配置


    安装完成后，在最终开始使用 SuSE 之前，您还需要进行一些重要的设置。


    注意

    如果您对引导加载程序、分区或硬件设置进行更改，您应该准确了解自己在做什么。


    配置完成后，您可以重启屏幕。如有需要，您可以再次进行设置。


    祝您使用 SuSE Linux 愉快！


    '
