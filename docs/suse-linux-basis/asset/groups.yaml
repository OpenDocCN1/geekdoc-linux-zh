  - '[PAGE 110]


    Die vorgewählten Punkte ''Dynamische IP-Adressenvergabe'' und ''Dynamische DNS-Vergabe''
    sorgen dafür, dass während der Verbindung vom Provider zugewiesene IP-Adresse
    und der Name-Server übermittelt werden, was im Normalfall nötig ist. Unter ''RückrufEinstellungen''
    sollte Rückruf nicht konfiguriert angewählt sein, denn die anderen Möglichkeiten
