    SuSE Linux - Basis ix


    ## Umsteigen auf Linux


    Mit diesem Kapitel wenden wir uns vor allem an Umsteiger, die Linux zum ersten
    Mal einsetzen. Die Informationen sind nach dem Frage-Antwort-Prinzip aufgebaut
    und geben Auskunft zu den wichtigsten Punkten, die bei den ersten Schritten mit
    Linux immer wieder auftauchen.


    Im Anhang dieses Buches finden Sie ein Glossar wichtiger Begriffe und eine häufig
    häufig Fragen zu SuSE Linux, die dieses Kapitel ergänzen. Wir setzen voraus, dass
    SuSE Linux im Rahmen einer Standardinstallation auf Ihrem Rechner aufgespielt
    ist. Daran orientieren sich die nachfolgenden Ratschläge und Antworten. Sollten
    Sie Ihr System bereits individuell angepasst haben, gelten die nachstehenden Ausführungen
    natürlich sinngemäß.


    - Während der Installation . . . . . . . . . . . . . . . . . . . 2

    - Arbeiten mit Linux . . . . . . . . . . . . . . . . . . . . . . . 2

    - Dateien, Ordner und Verzeichnisse . . . . . . . . . . . . . . . . . . . . .
    . . . 6

    - Von Passwörtern und Benutzern . . . . . . . . . . . . . . . . . . . . 9

    - Mounten, Shell und anderes . . . . . . . . . . . . . . . . . . . . 11


    ## Während der Installation


    - Soll der Swap-Bereich in der primären oder erweiterten Partition eingerichtet
    werden?

    Der Swap-Bereich dient dem Auslagern von Daten aus dem Arbeitsspeicher (RAM) auf
    die Festplatte. So kann der Arbeitsspeicher den aktuellen Daten in vollem Umfang
    zur Verfügung halten. Falls mehrere Betriebssysteme einsetzen wollen, empfiehlt
    es sich, den Swap-Bereich in einer erweiterten Partition anzulegen. Die Anzahl
    der primären Partition sind generell beschränkt und sollten für andere Betriebssysteme
    freigehalten werden, insofern sollten Sie den Swap-Bereich in einer erweiterten
    Partition anzulegen.


    ./images/png/um_yast2_swap.png


    ## Arbeiten mit Linux


    - Gibt es unter Linux Programme, die meine alten, unter Windows erstellten Dateien
    lesen können?

    Selbstverständlich können Sie unter Linux Ihre alten Dateien weiter nutzen. Standardprogramme
    wie StarOffice und GIMP kommen mit allen Dateiformaten - die Sie von früher kennen
    – zurecht; egal, ob es sich um Ihre Texte, Bilder, Grafiken, Video- oder Audiodateien
    handelt, SuSE Linux stellt immer ein adäquates Programm bereit, mit dem Sie problemlos
    Ihre Dateien bearbeiten können.


    ./images/png/um_datformate.png


    - Wo gibt es Programme für Linux?

    Ihr SuSE Linux bringt alle Programme, die Sie für Ihre Anwendungen und Ihre Arbeit
    brauchen, schon mit. Klicken Sie auf das SuSE-Menü links unten auf Ihrem Desktop
    und Sie werden überrascht sein, welche Programauswahl Sie zur Verfügung haben.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_12_0.png)


    - Wie formatiere ich eine Diskette für Linux?

    Am besten nutzen Sie KDE. Klicken Sie auf das SuSE-Menü links unten auf Ihrem
    Desktop und wählen Sie ''System'' → ''Werkzeuge'' → ''Formatierung''. Sie haben
    nun zwischen FAT (für Windows) und ext2 (für Linux) die Wahl.


    - Wo finde ich Programme für Linux?

    Ihr SuSE Linux bringt alle Programme, die Sie für Ihre Anwendungen und Ihre Arbeit
    brauchen, schon mit. Klicken Sie auf das SuSE-Menü links unten auf Ihrem Desktop
