    # GNOME – Der Desktop


    GNOME (= GNU Network Object Model Environment) ist neben KDE das zweite populäre
    Desktopsystem. In diesem Kapitel beschreiben wir, wie Sie mit GNOME arbeiten können
    und es Ihren Wünschen und Bedürfnissen anpassen.


