    - 使用大显示器时，应使用至少 120 cm 的深度表面。\n- 桌面应避免（颜色）（因此许多家具有深灰色可选）。\n\n# 正确坐姿\n\n在办公椅上坐会迫使人处于静态持续姿势，而不是“瘫坐”，这增加了脊柱的负担。在极端情况下，长期错误压力会导致肌肉和骨骼疾病。\n\
