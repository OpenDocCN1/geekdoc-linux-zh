  mdcn: "\n\n![](img/7c7b5e54e6579952ad3fd8bde9e1a136_0_0.png)\n\n# SuSE Linux\n\n\
    \ 基础版\n\n# 2002年版\n\nCopyright ©\n本作品为 SuSE Linux AG 的知识产权。\n可以完整或部分地复制本书书，前提是每页都必须注有此版权声明。\n\
    \n本书中包含的所有信息均经过了严谨的编制。但无法完全排除出现错误信息的可能。\nSuSE Linux AG、作者及翻译者对任何错误及其后果不承担责任。\n\
    \n本书中使用的软件和硬件名称在许多情况下为注册商标，不保证其具有自由可用性。SuSE Linux AG 基本上遵循了制造商的拼写方式。书中列出的商品和商业名称等（即使没有特殊标记）并不意味着这些名称（在商标法和品牌保护法意义上）可以被视为自由使用的。\n\
    \n如有提示或意见，请发送至：documentation@suse.de \n\n作者：Jörg Dippel, Stefan Dirsch, Matthias\
    \ Eckermann, Carsten Fischer, Klaas Freitag,\nGerd Knorr, Holger Herterich, Johannes\
    \ Meixner, Siegfried Olschner, Marcus Schäfer,\nJesko Schneider, Arvin Schnell,\
    \ Adrian Schröter, Gabriele Stratner\n编辑：Antje Faber, Dennis Geider, Roland Haidl,\
    \ Jana Jaeger, Edith Parzfall,\nPeter Reinhart, Marc Rührschneck, Thomas Schreitle,\
    \ Martin Sommer, Rebecca Walter\n布局：Manuela Piotrowski, Thomas Schreitle\n排版：LaTeX\n\
    \n本书采用 100% 无氯漂白纸打印。\n\n# 欢迎\n\n感谢您选择 SuSE Linux！我们的发行版现在比以往任何时候都更容易安装。只需点击几次即可准备好安装，大约\
    \ 15–20 分钟即可完成系统安装。然后设置带有密码的用户并确定屏幕分辨率。您就可以开始使用 SuSE Linux 了。SuSE Linux 的配置也得到了进一步简化，同时仍然根据您的需求对不同的软件包进行调整和优化。\n\
    \n本书以及其中描述的软件让普通用户不再需要借用、租赁、招募或偷取“Linux 极客”来安装或使用 Linux。SuSE Linux 对极客来说功能强大，但对普通用户来说同样直观且易用。\n\
    \n在简单易懂的介绍之后，您将更深入了解 KDE 图形界面，并获得针对您个人需求的调整建议。通过 GNOME，我们向您展示另一个用户友好的界面。\n\n之后，您将学习如何使用图形全能工具\
    \ YaST2 轻松地配置和管理您的硬件、互联网连接和系统。这一切都在系统运行期间完成，无需最后的重启。\n\n在最后，您将找到命令行操作的说明、SuSE\
    \ 帮助系统的介绍以及围绕 SuSE Linux 的常见问题解答。\n\n安装支持——我们为您提供支持，以应对各种情况。有时计算机会偏离通用规范，这可能导致安装过程中出现问题，但在专业帮助下可以快速解决。为此，我们提供了免费的\
    \ SuSE 安装支持服务。通常情况下，只需查看 http://support.suse.de 下的 SuSE 支持服务即可。在那里您可以找到所有信息、联系人和最新的提示。如果您在那里没有找到解决方案，我们当然也会通过邮件\
    \ support@suse.de 为您提供帮助。\n您可以在 doc 系列中的 `suselinux-reference_de` 包中找到参考手册。它包含了许多主题（YaST\
    \ 模块、内核、网络等）的深入信息。PDF 文件位于 `/usr/share/doc/packages/suselinux-reference_de/`。\n\
    对于许多问题和挑战，我们已经找到了答案和解决方案。我们在支持数据库中提供了数百篇文章，通过 http://sdb.suse.de/ 全天候在线提供。\n祝您用得愉快！\n\
