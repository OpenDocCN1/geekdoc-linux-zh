- md: "\n![](img/7c7b5e54e6579952ad3fd8bde9e1a136_85_0.png)\n\nAbbildung 5.9: Hintergründe\
    \ und Embleme\n\n## Hintergründe und Embleme via Drag'n Drop!\n\nWählen Sie sich\
    \ im Hauptmenü eines Nautilus 'Bearbeiten' → 'Hintergründe und Embleme'. Im erscheinenden\
    \ Dialog können Sie zwischen 'Mustern', 'Farben' und den bereits besprochenen\
    \ 'Embleme' auswählen. Zie Sie mit dem BrushedMetal im Bildschirmhintergrund und\
    \ lassen Sie es dort 'fallen'. Die Änderungen werden sofort sichtbar. So verfahren\
    \ Sie mit jedem Auswahl immer ein 'Reset'-Symbol finden. Wenn Sie dies in ein\
    \ Bildschirmelement ziehen, werden die ursprünglichen Einstellungen wiederhergestellt.\
    \ Ziehen Sie Embleme auf Dateien oder Ordner, um diese damit auszustatten.\n\n\
    Nautilus-Themes: Nautilus' optische Erscheinung kann komplett verwandelt werden.\
    \ Nautilus Themes beziehen neben grafischem Design der Bedienelemente ebenfalls\
    \ Icons für übliche Objekte wie Ordner oder Textdateien. Wählen Sie 'Bearbeiten'\
    \ → 'Erscheinungsbild ändern', damit öffnet sich der 'Themenwähler-Dialog'. Klicken\
    \ Sie eines der Themen, um es anzuwenden.\n\nReiffolge der Objektinformationen:\
    \ Zusammen mit den Icons zeigt immer spezifische Informationen unterhalb eines\
    \ Objekts an (vielleicht müssen Sie die Detailstufe erhöhen, um alle Informationen\
    \ zu sehen). Angen, Sie arbeiten mit Kollegen an einem Projekt: Vielleicht wäre\
    \ es denn statt Größe, Typ und Modifikationsdatum die Gruenzugehörigkeit und die\
    \ Besitzrechte anzuzeigen. Im Dialog, der erscheint, wenn 'Bearbeiten' → 'Iconunterschriften'\
    \ wählen, können Sie die Reihenfolge und die angezeigten Informationen jederzeit\
    \ ein.\n\nNautilus — der Dateimanager\n\n## Weiterführende Informationen\n\n-\
    \ http://www.gnome.org\n- http://developer.gnome.org/\n- http://www.gtk.org/\n\
    - http://gtk.themes.org/\n\nDie Homepage des GNOME-Projekts. Umfangreiche Dokumentation\
    \ zur GNOME-konformen Programmierung. Homepage des GIMP Toolkits (GTK). Riesige\
    \ Sammlung an GTK-Themen.\n\nSie finden häufig gestellte Fragen und entsprechende\
