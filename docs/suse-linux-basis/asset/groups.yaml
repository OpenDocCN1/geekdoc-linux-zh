    Newsticker – Wenn Sie eine Internetanbindung besitzen, können Sie sich aktuell-richten
    holen lassen; die Nachrichten werden dann als Lauftext in einem kleinen Miniprogramm
    dargestellt. Abschnitt Netzwerk auf Seite 48 geht ausführlich auf dieses nützliche
    Werkzeug ein.


    ## Ausgewählte KDE-Anwendungen


    Es gibt mittlerweile eine Vielzahl an KDE-Anwendungen. Aus Platzgründen können
    wir Ihnen nicht alle Programme im Detail vorstellen. Auswahl und Reihenfolge stellen
    daher keineswegs ein Qualitätskriterium dar.


    ## Festplattenverwaltung


    Die beiden Systemprogramme kdf und quickdisk helfen Ihnen, auf Ihrem System verfügbaren
    Datenträger schnell und einfach ein- bzw. auszuhängen (engl. mount).


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_37_0.png)


    Abbildung 3.5: Übersicht über Ihre Datenträger mit kdf


    - quickdisk ist ein „Miniprogramm“, d. h. bindet sich in die Kontrollleiste ein.
    Beim Klick mit der rechten Maustaste öffnet sich das Icon, um die entsprechenden
    Datenträger ein- oder auszuhängen können. Wenn Sie eine grafische Übersicht möchten,
    wählen Sie ‘KDiskFree starten’.


    - kdf bzw. KDiskFree zeigt Ihnen analog zum df-Komando eine Übersicht Ihrer Datenträger
    an, die aus der Datei /etc/fstab entnommen wird. Das Fenster beinhaltet das Symbol
    des Datenträgers, den Typ, die Größe, den Mount-Punkt, die Belegung in Prozent
    und eine grafische Darstellung. So behalten Sie den Überblick.


    Wenn Sie mit der rechten Maustaste auf einen Eintrag klicken, öffnet sich ein
    Popup-Menü. Hier können Sie dann den Datenträger mittels ''Gerät mount'' in Ihr
    System einbinden oder durch ''Gerät unmount'' entfernen. Der Menüpunkt ''Dateimanager
    öffnen'' startet ein neues Fensterster mit dem Inhalt des Datenträgers.


    ## DVI-, PostScript- und PDF-Betrachter


    Mit den wichtigsten Formaten unter Linux sind DVI und PostScript. Diese lassen
    sich sehr bequem mit dem DVI-Betrachter kdvi bzw. dem PostScript- und PDF-Betrachter
    khostview ansehen. Beide Programme sind recht intuitiv aufgebaut. Die Abbildung
    3.6 zeigt das Fenster von KDVi.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_38_0.png)


    **Abbildung 3.6:** KDvi beim Anzeigen eines Dokumentes


    Eine der Fähigkeiten dieser Betrachter ist die Einbettung in ein Konquerorfenster.
    Das macht es sehr einfach, Dateien anzuzeigen, ohne das entsprechende Programm
    neu zu starten. In khostview (siehe Abbildung 3.7 auf der nächsten Seite, S. 30)
    können Sie ein beliebig PostScript- oder PDF-Dokument laden und sich anzeigen
    lassen. Rufen Sie hier ''Datei'', ''Öffnen'' auf und wählen Sie das entsprechende
    Dokument aus.


    Im ''Ansicht''-Menü können Sie zwischen verschiedenen Darstellungen wählen, in
    welcher Größe das Dokument dargestellt werden soll.

    Falls Sie die Darstellung um 90 Grad drehen wollen, bietet es sich an, einen Blick
    in das Untermenü ''Ausrichtung'' von ''Ansicht'' zu werfen.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_39_0.png)


    Abbildung 3.7: KGhostview beim Anzeigen eines Dokumentes


    ## Terminverwaltung mit KOrganizer


    Mit der Anwendung KOrganizer können Sie Ihre Termine verwalten und sich an Geburtstagstage
    und wichtige Termine erinnern lassen. Zudem können Sie Aufgaben definieren und
    ihren Fortschritt festhalten. Das Programm finden Sie im Paket kdepim3. Installieren
    Sie es ggf. mit YaST2.


    Sie können das Programm starten, indem Sie die Tasten Alt + F2 drücken und im
    Eingabefeld organizer eingeben.


    Wenn Sie einen neuen Termin anlegen wollen, dann klicken Sie im ''Aktionen''-Menü
    auf ''Neuer Termin''. Ein Fenster erscheint, in dem Sie alle allgemeinen Daten
    zum Termin sowie eventuelle Gesprächnehmer festlegen können. Falls sich ein Eintrag
    z.B. wöchentlich wiederholt, können Sie dies im Reiter ''Eintrag wiederholen''
    entsprechend einstellen. Dazu muss allerdings das Feld ''Wiederholender Termin''
    aktiviert sein.


    Unter dem Reiter ''Allgemein'' tragen Sie eine ''Zusammenfassung'' ein, legen
    Anfangs- und Enddatum sowie Start und Endzeit fest. Sie können sich auch an Ihren
    Termin erinnern lassen. Aktivieren Sie dazu nur das Feld ''Erinnerung'' und legen
    Sie die Zeit fest, zu der KOrganizer Sie an den Termin erinnern soll.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_40_0.png)


    **Abbildung 3.8:** KOrganizer – der Terminplaner für KDE


    Im unteren Textfeld können Sie einen etwas ausführlicheren Text eingeben. Um Ihren
    Terminen eine gewisse Struktur zu geben, können Sie sogenannte Kategorien festlegen.
    Dazu brauchen Sie nur den Button ''Kategorien'' anklicken; ein Fenster öffnet
    sich, dem Sie die entsprechenden Einträge auswählen können. Falls ein solcher
    Eintrag existiert, tragen Sie in ''Kategorie bearbeiten'' den Namen ein und drücken
    ''OK''. Mit ''OK'' schließen Sie das Fenster.


    Im Folgenden stellen wir vor, wie Sie effektiv einen Termin [anlegen]... (Hinweis:
    Text hier unvollständig im Original)

    '
  mdcn: '


    Newticker – 如果您拥有互联网连接，就可以获取实时新闻；新闻将以滚动文本的形式在一个小型微程序中显示。第 48 页的“网络”（Netwerk）章节将详细介绍这一实用工具。


    ## 选定的 KDE 应用


    目前有大量的 KDE 应用。由于空间限制，我们无法向您详细介绍所有程序。因此，选择和顺序并不代表质量标准。


    ## 磁盘管理


    `kdf` 和 `quickdisk` 这两个系统程序可以帮助您快速、方便地挂载或卸载（英语为 mount）系统上可用的磁盘。


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_37_0.png)


    图 3.5：使用 kdf 您的磁盘概览


    - quickdisk 是一个“微程序”，即它集成在系统栏中。右键点击图标时会打开一个菜单，以便您挂载或卸载相应的磁盘。如果您想查看图形概览，请选择“启动
    KDiskFree”。


    - kdf 或 KDiskFree 类似于 `df` 命令，向您显示从 `/etc/fstab` 文件中提取的磁盘概览。窗口包含磁盘符号、类型、大小、挂载点、占用百分比以及图形化表示。这样您就可以掌握全局了。


    当您对某个条目点击右键时，会弹出一个弹出菜单。在这里，您可以通过“挂载设备”将磁盘连接到您的系统中，或通过“卸载设备”将其移除。“打开文件管理器”菜单项将启动一个显示该磁盘内容的新窗口。


    ## DVI、PostScript 和 PDF 查看器


    Linux 下最重要的格式是 DVI 和 PostScript。您可以使用 DVI 查看器 `kdvi` 以及 PostScript 和 PDF 查看器 `khostview`
    非常方便地查看它们。这两个程序的结构都非常直观。图 3.6 显示了 KDVi 的窗口。


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_38_0.png)


    **图 3.6：** 显示文档时的 KDvi


    这些查看器的功能之一是可以嵌入到 Conqueror 窗口中。这使得在无需重新启动相应程序的情况下显示文件变得非常简单。在 `khostview` 中（参见下页第
    30 页的图 3.7），您可以加载并显示任意 PostScript 或 PDF 文档。点击“文件”、“打开”并选择相应的文档。


    在“视图”（Ansicht）菜单中，您可以在不同的显示模式之间进行选择，决定以什么大小显示文档。

    如果您想将显示旋转 90 度，建议查看“视图”下的“取向”（Ausrichtung）子菜单。


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_39_0.png)


    图 3.7：显示文档时的 KGhostview


    ## 使用 KOrganizer 管理日程


    通过 KOrganizer ，您可以管理日程，并在生日和重要日期时收到提醒。此外，您还可以定义任务并记录其进度。该程序位于 `kdepim3` 软件包中。如有需要，可以使用
    YaST2 安装它。


    您可以通过按下 Alt + F2 键并在输入框中输入 `organizer` 来启动程序。


    如果您想创建一个新日程，请点击“操作”（Aktionen）菜单中的“新日程”。将弹出一个窗口，您可以在其中设置日程的所有常规数据以及可能的会话人员。如果某个条目例如每周重复，您可以在“重复日程”（Eintrag
    wiederholen）选项卡中进行相应设置。不过，这需要激活“重复日程”字段。


    在“常规”（Allgemein）选项卡下，您输入“摘要”（Zusammenfassung），设定开始和结束日期以及开始和结束时间。您还可以设置日程提醒。只需激活“提醒”（Erinnerung）字段并设定
    KOrganizer 提醒您的时间即可。


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_40_0.png)


    **图 3.8：** KOrganizer – KDE 日程表


    在底部的文本框中，您可以输入更详细的内容。为了给您的日程一定的结构，您可以定义所谓的“类别”。您只需点击“类别”按钮；会打开一个窗口，您可以在其中选择相应的条目。如果存在此类条目，请在“编辑类别”中输入名称并按“确定”。点击“确定”关闭窗口。


    接下来我们将向您介绍如何有效地[创建]一个日程……（注：原文在此处文本不完整）


    '
