  - '[PAGE 42]


    # Kinternet – der Weg ins WWW


    Um im Internet surfen oder via E-Mail Nachrichten senden und empfangen zu können,
    müssen Sie ein Modem oder eine ISDN- bzw. Ethernet-Karte an Ihren Computer anschließen
    und unter SuSE Linux ein. Das geschieht mit Hilfe des Installations- und Konfigurationsstools
    YaST2. Sobald Sie das jeweilige Gerät entsprechend konfiguriert haben, können
    Sie mit dem Programm Kinternet den Internet starten.


    KDE lässt beim Start Kinternet, das Programm überprüft selbstständig, ob eine
    Internetverbindung hergestellt werden kann. Falls dies möglich ist, erscheint
    das Icon des Programms rechts oben im KDE-Panel als Stecker. Hier ist eine Übersicht
    über die Symbole und ihrer Bedeutung:


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_42_0.png)


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_42_1.png)


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_42_2.png)


    Momentan besteht keine Verbindung zum Internet.


    Verbindung wird gerade aufgebaut.


    Die Verbindung wurde hergestellt.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_42_3.png)


    Momentan besteht keine Verbindung zum Internet, sie wird aufgebaut, sobald Daten
    aus dem Internet angefordert werden.


    Es werden Daten vom oder Internet übertragen.


    Wenn Sie mit der ersten Maustaste auf das Kinternet-Icon klicken, erscheint das
    Menü, mit dessen Hilfe Sie Kinternet leicht konfigurieren und die Datenverbindung
    zu Ihrem konfigur können. Die Konfiguration des Zugangs über einen von Ihnen gewählten
    Provider geschieht mit YaST. Es gibt Kinternet noch eine weitere Features, die
    Sie nutzen können, etwa den Proxy-Server WWW-Offline. Dabei handelt es sich um
    einen Zwischenspeicher für alle WWW-Seite (unabhängig davon, welchen Web-Browser
    Sie benutzen). Er ermöglicht Ihnen, bereits geladene Seiten zu betrachten, ohne
    Sie sich erneut ins WWW einwählen müssen.


    Ebenso werden Webseiten, die Sie offline angefordert haben, automatisch heruntergeladen,
    wenn Sie wieder online gehen. Wenn Sie diese Features nicht wollen, muss das Paket
    wwoffle, Serie (Netzwerk) installiert sein. Darüber hinaus Sie sich in Ihrem Web-Browser
    den Proxy


    ```

    localhost, Port 8080,

    ```


    eintragen; unter Netscape Navigator ''Erweitert'' → ''Proxies''.'
- md: '

    Im Konqueror rufen Sie den Eintrag ‚Einstellungen‘ $\rightarrow ‚Konqueror einrichten‘
    erscheinen. Unter ‚Proxy-Server‘ können Sie die Einstellungen eintragen.


    # Häufig gestellte Fragen und Antworten


    - Wie kann ich auf eine CD. DVD zugreifen?

    Auf Ihrem KDE-Desktop befindet sich ein Piktogramm mit einem CD-Bild. Legen Sie
    Ihre CD. DVD in Ihr Laufwerk ein und klicken Sie mit der linken Maustaste auf
    das Bild. Die CD wird eingebunden und der Inhalt über ein Konqueror-Fenster angezeigt.


    - Auf meinem Desktop befindet sich kein CD-Piktogramm. Wie erstelle ich eines?

    Klicken Sie mit der rechten Maustaste auf den Desktop. Wählen Sie aus dem Menü
    den Punkt ‚Neu erstellen...‘ $\rightarrow ‚CD-ROM...‘ aus. Ein Fenster öffnet
    sich. Unter ‚Allgemein‘ können Sie den Namen des Piktograms auf dem Desktop ändern.
    Unter ‚Gerät‘ richten Sie den Geräten Ihres CD- bzw. DVD-Laufwerks ein.


    - Kann ich die Kontrolleleiste wo platzieren?

    Ja, natürlich. Klicken Sie mit der linken Maustaste auf eine Fläche und ziehen
    Sie an einen beliebigen Rand. Nachdem Sie die Maustaste loslassen haben, wird
    die Kontrolleiste dorthin verschoben.


    - Ich möchte eine separate Kontrolleiste haben. Geht das?

    Ja. Klicken Sie mit der rechten Maustaste auf eine Fläche der vorhandenen Kontrolleiste.
    Wählen Sie ‚Hinzufügen‘ $\rightarrow ‚Erweiterung‘ $\rightarrow ‚Abhängige Kontrolleiste‘.
    Es öffnet sich eine Kontrolleiste. Jetzt können Sie über den Konqueror Dateien
    oder Verzeichnisse dorthin ablegen. Oder klicken Sie mit der rechten Maustaste
    auf die Leiste und wählen Sie aus dem Menüpunkt ‚Hinzufügen‘ die entsprechenden
    Angebote aus.


    - Wie füge ich Programme o. in die Kontrolleiste ein?

    Hier gibt es zwei Möglichkeiten:

    1. Klicken Sie mit der rechten Maustaste auf eine Fläche der Kontrolleiste. Es
    öffnet sich ein Popup-Menü. Wählen Sie ‚Hinzufügen‘ $\rightarrow ‚Knopf‘ aus und
    sehen Sie die Einträge, die im K-Menü erscheinen. Jetzt können Sie Ihre bevorzugte
    Rubrik ‚Dieses Menü hinzufügen‘ auf die Kontrolleiste ablegen. Oder wählen Sie
    das gewünschte Programm auf einen Klick direkt an. In beiden Fällen erscheint
    auf der Kontrolleiste das entsprechende Symbol.

    2. Programme, Ordner usw. können Sie auch direkt aus dem Conqueror heraus mit
    der linken Maustaste anklicken, gedrückt halten und auf die Kontrolleiste ablegen.


    # Ich möchte mehr über mein System erfahren. Wie kann ich das?


    Es gibt zwei Möglichkeiten: Drücken Sie die Tastenkombination Alt + F2 und geben
    Sie den Befehl ksysquery ein. Ein Fenster öffnet sich. Das so genannte „Sensor-Browser“
    auf der linken Fensterseite können Sie gezeigtes Überwachungsmodul anklicken und
    auf das Hauptfenster zurückziehen. Die andere Möglichkeit befindet sich im Kontrollzentrum.
    Unter „Informationen“ befinden sich alle Ressourcen und Geräte, die mit Ihrem
    Rechner verknüpft sind.


    # Wie kann ich Post-Script- oder PDF-Dateien anzeigen?


    Unter KDE gibt es ein Programm: KGhostview. Im Abschnitt DVI-, PostScript- und
    PDF-Betrachter auf Seite 29 erfahren Sie mehr darüber.


    # Wie kann ich Grafikkateien anzeigen?


    Durch das Programm Kview können Sie sie starten, indem Sie über das Menü „Datei“,
    „Öffnen“ und kview eingeben. Das Programm unterstützt eine Vielzahl von Grafikformaten.


    # Wie kann ich meine WAV, MP3-Dateien abspielen?


    Ja, drücken Sie Alt + F2 und geben Sie noatun ein. Ein Fenster öffnet sich; über
    das Menü „Datei“, „Öffnen“ können Sie Ihre Audiodateien laden.


    # Wie kann ich eine Audio-CD abspielen?


    Legen Sie die Audio-CD ins Laufwerk ein, starten Sie das Programm noatun (Alt
    + F2) und noatun eingeben. Möglicherweise müssen Sie noch die Lautstärke nachregulieren.
    Dies können Sie mit dem Programm kmix tun.


    # Wie kann ich mich ins Internet einwählen?


    Über das Programm Kinetner. finden Sie eine ausführliche Beschreibung im Abschnitt
    Kinetner – der Weg ins WWW auf Seite 33.


    # Wie kann ich meine E-Mails lesen?


    Das Programm KMail hilft Ihnen dabei. Es wird ausführlich im Buch Die Programme
    beschrieben.


    # Weiterführende Informationen


    Falls Sie mehr Informationen zu KDE benötigen, werden Sie auf einer der folgenden
    Web-Seiten sicherlich fündig werden:


    - http://www.kde.org Die Seite für KDE.

    - http://www.konqueror.org Alles über das Programm Konqueror.

    - http://il8n.kde.org Internationalisierung von KDE.

    - http://kde.themes.org Alles rund um Designs, Themen usw. für KDE.

    - http://artist.kde.org Alles rund um Icons, Cliparts usw. für KDE.

    - http://lists.kde.org Mailinglisten zu allen Themen von KDE.

    - http://bugs.kde.org Alle Fehler von KDE finden hier ihren Platz.

    - http://www.gnupg.org Verschlüsselungssoftware.


    # KDE – Die Konfiguration


    In diesem Kapitel zeigen wir Ihnen, wie Sie mit Hilfe des Kontrollzentrums das
    Erscheinungsbild ändern, und wie Sie Dateimanager, Webbrowser und vieles mehr...


    | Thema | Seite |

    | :--- | :--- |

    | Einleitung | 38 |

    | Angeschlossene Geräte | 39 |

    | Dateanzeige | 40 |

    | Energierolle | 41 |

    | Erscheinungsbild | 42 |

    | Informationen | 46 |

    | Klänge | 46 |

    | Netzwerk | 48 |

    | Persönliche Einstellungen | 50 |

    | System | 52 |

    | Webbrowser | 53 |


    # Einleitung


    In diesem Kapitel zeigen wir Ihnen, wie Sie mit Hilfe des Kontrollzentrums das
    Erscheinungsbild ändern, und wie Sie Dateimanager, Webbrowser und vieles mehr...


    Das Kontrollzentrum ist in eine Leiste sowie einen linken und rechten Bereich
    aufgeteilt. Im linken Bereich finden Sie die Konfiguration. Im rechten Bereich
    befinden sich meist diese Schaltflächen:


    - Hilfe: Zeigt einen kurzen Text an.

    - Voreinstellungen benutzen: Stellt die Standardinstellung her.

    - Anwenden: Wendet die vorgenommenen Einstellungen an.

    - Zurücksetzen: Setzt auf den ursprünglichen Wert zurück.

