    > Hinweis

    Achtung bei Modellbezeichnungen: Im Zweifelsfall empfiehlt es sich, es mit einer
    ähnlichen Bezeichnung zu probieren, wenn Sie Ihr Modell in der Gerätliste nicht
    finden.


    In manchen Fällen ist jedoch eine absolut bu- bzw. nummergetreue Angabe unerlässlich,
    denn ähnliche Bezeichnungen lassen nicht immer auf auf Kompatibilität schließen.
    Leider versteht ähnlich bezeichnete Hardware oft nicht diesel Sprache!


    # Drucker


    Unter Linux werden Drucker über sog. „Druckerwarteschlangen“ angesprochen. Die
    zu druckenden Daten werden dabei in einer Druckerwarteschlange zwischengespeichert
    und durch den Druckerspool nacheinander dem Drucker geschickt.

    Meist liegen diese Daten nicht in einer Form vor, die direkt an den Drucker geschickt
    werden könnte. Die Grafik beispielsweise meistnormalerweise in einem Format umgewandelt,
    das der Drucker direkt ausgeben kann. Die Umwandlung in die Drucksprache erfolgt
    durch Druckerfilter, der vom Druckerspool zwischengeschaltet wird, dem Drucker
    ggf. umzuwandeln, dass sich der Drucker direkt ausgeben kann. Der Druckerfilter
    ist auch für das Layout und die länderspezifische Codierung zuständig.


    # Zur GDI-Drucker Problematik


    Für Drucker, die über keine der Protokoll Standarddrucksprachen angesprochen werden,
    sondern nur über ein proprietäres Protokoll hat sich die Bezeichnung „GDI-Drucker“
    eingebürgt. Solche Drucker sind normalerweise nicht unter Linux verwendbar, sondern
    nur dem Betriebssystem bzw. der speziellen Betriebssystemversion, für die der
    Hersteller einen Treiber zur Verfügung stellt. Für etliche GDI-Drucker gibt es
    mittlerweile Linux-Treiber, die allerdings nicht so problematisch sind, wie der
    Treiber für die Drucker, die der Standarddrucksprachen direkt weiterstehen. Weitere
    Informationen finden Sie im Supporttdatenbank-Artikel „GDI-Drucker“, den Sie unter
    dem Wort „GDI“ bzw. online unter http://sdb.suse.de/sdb/de/html/ke_printer-gdi.html
    erhalten.


    # Warteschllangen


    Normalerweise mehrere Druckerwarteschllangen benötigt:'
  - '[PAGE 92]


    +   Vchiedene Drucker werden über verschiedene Warteschlangen angesprochen.


    +   Für jede Warteschlange kann der Druckerfilter individuell konfiguriert werden.
    Also werden verschiedene Warteschlangen für denselben Drucker verwendet, um verschiedene
    Konfigurationen zu benutzen.


    Bei Schwarzweiß-Druckern (z.B. die meisten Laserdrucker) ist eine Standardkonfiguration
    ausreichend, aber bei Farb-Tintenstrahlruckern werden normalerweise mindestensstens
    zwei Konfigurationen - also zwei Warteschlangen - benötigt.


    +   Eine „lp“-Standardkonfiguration, mit der Drucker schnell und kostengünstig
    Schwarzweißdruck liefert, eine Warteschlange mit Namen 1p sollte es immer geben,
    denn das ist der traditionelle Name der StandardWarteschlange.


    +   Eine „color“-Konfiguration bzw. Warteschlange für Fardruck.


    # Konfiguration mit YaST2


    Wählen Sie in YaST2 unter ‘Hardware’ den Punkt ‘Automatische Druckerkennung’.
    Erscheint Ihr Drucker in der Liste der verfügbaren Drucker, klicken Sie auf ‘Konfigurieren’.
    Um der Konfiguration eines bereits eingerichteten Drucker zu wählen Sie unterhalb
    der Liste der eingereten Drucker ‚Bearbeiten‘ Wenn Sie keine Druckerkennung durchführen
    lassen wollen oder von vorhin wissen, dass Sie einen Drucker manuell hinzufügen
    wollen, klicken Sie auf ‘Hardware auf Drucker bearbeiten’. Dort können Sie bestehende
    Konfigurationen verändern oder einen neuen manuell einrichten, indem Sie auf ‘Hinzufügen‘
    klicken.


    # Automatische Konfiguration


    YaST2 ermöglicht eine automatische Konfiguration des Druckers, wenn folgende Bedingungen
    erfüllt sind:


    +   Der parallele Anschluss wird automatisch korrekt eingerichtet und der daran
    angeschlossene Drucker wird automatisch erkannt.


    +   In der Druckerdatenbank befindet sich die Identifikation des Druckmodells,
    die YaST2 bei der automatischen Hardwareerkennung erhalten hat. Da die Identifikation
    von der Modellbezeichnung verschieden sein kann, kann das Modell unter Umständen
    manuell ausgewählt werden.'
- md: "\n3. Es ist für das jeweilige Modell wenigstens eine Konfiguration in der Druckerdatenbank\
    \ eingetragen, die als problemlos funktionierend gilt.\n\nFür jede Konfiguration\
    \ sollte grundsätzlich mit dem YoST2-Testdruck ausgewertert werden, ob sie tatsächlich\
    \ funktioniert. Die YoST2-Testdatei liefert zusätzliche wichtige Informationen\
    \ zur jeweiligen Konfiguration.\n\n## Manuelle Konfiguration\n\nWenn eine der\
    \ Bedingungen für die automatische Konfiguration nicht erfüllt ist oder wenn eine\
    \ speziell individuelle Konfiguration gewünscht ist, muss die Konfiguration mehr\
    \ oder weniger manuell erfolgen.\n\n## Hardwareanschluss (Schnittstelle)\n\nWenn\
    \ der Drucker nicht erkannt wird, deutet dies darauf hin, dass der Druckeranschluss\
    \ auf Hardwareebene ohne manuelle Konfiguration funktioniert. Dann muss die Schnittstelle\
    \ konfiguriert werden. Ein nichtannter Drucker wird als „Andere (nicht bekannte)“\
    \ den verfügbaren Drucker aufgeführt. Klicken Sie auf „Konfigurieren“, wählen\
    \ Sie im folgenden Menü den Anschluss und klicken Sie auf 'Weiter'.\n\nDann sehen\
    \ Sie die zuhörige Schnittstelle:\n\n```\n/dev/lp0\tist die erste parallele Schnittstelle\n\
    /dev/usb0\tist die Schnittstelle für einen USB-Drucker\n```\n\nHierbei sollte\
    \ unbedingt der entsprechende Test in YoST2 gemacht werden, zu prüfen, ob der\
    \ Drucker über die ausgewählte Schnittstelle überhaupt ansprechbar ist. Klicken\
    \ Sie auf 'Weiter'.\n\nWählen Sie nun Ihr Modell aus. Zu jedem Drucker erhalten\
    \ Sie über den Info-Button Informationen über die Unterstützung unter Linux und\
    \ wo im Falle von GDI-Druckern eventuell Linuxtreiber erhalten sind.\n\nIst das\
    \ Druckermodell in der Druckerdatenbank eingetragen, gibt es eine Auswahl an generischen\
    \ Ghostscript-Treibern für die Standarddruckrucker. Klicken Sie dazu links auf\
    \ ‘Generische Drucker'.\n\n## Hinweis\n\n> Fragen Sie ggf. beim Hersteller des\
    \ Druckers nach, welche Sprache Ihr Modell kann, oder zu welchem Modell in der\
    \ Druckerdatenbank Ihr Drucker hardwarekompatibel ist – d.h. der Drucker müssen\
    \ diese Drucksprache hardwarevermäßig „verstehen“ und nicht nur durch zusätzliche\
    \ Software emuliert.\n\nHinweis\n\n## Druckname\n\nGemeint ist hier der Name der\
    \ „Warteschlange“, der beim Drucken einzugeben sein wird. Daher sollten nur kurze\
    \ Namen aus Kleinbuchstaben und evtl. Zahlen verwendet werden. Standardmäßig ist\
    \ hier als erste Warteschlange lp eingestellt.\n\n## Konfiguration für Anwendungsprogramme\n\
    \nAuf der Kommandoleiste druckt man mit dem Befehl `lpr -Plp Dateiname` wobei\
    \ Dateiname den Namen zu druckenden Datei zu ersetzen ist. In diesem Fall wird\
    \ die Standardwarteschlange lp verwendet. Durch die Option -P wird die Warteschlange\
    \ explizit bestimmt werden. Mit `lpr -Color Dateiname` wird beziehungsweise die\
    \ Warteschlange color verwendet.\n\nwendungsprogramme verwenden auch den lpr-Befehl\
    \ zum Drucken. Konfigurieren Sie daher in den Anwendungsprogrammen im Normalfall\
    \ keinen Drucker, sondern verwenden Sie die Warteschlangen, die Sie mit YaST2\
    \ eingerichtet haben und deren Funktion Sie durch das Drucken der YaST2-Testseiten\
    \ überprüft haben.\n\nWählen Sie dazu im Anwendungsprogramm einen Namen einer\
    \ Warteschlange, die Sie mit YaST2 eingerichtet haben (z. B. lp oder color) oder\
    \ geben Sie in die Maske des Anwendungsprogramms das passende Druckkommando (z.\
    \ B. `lpr -Plp` oder `lpr -Color`) ein.\n\n## Mögliche Probleme\n\n- Wenn es zu\
    \ einer Störung in der Kommunikation zwischen Rechner und Drucker kommt so kann\
    \ der Drucker mit den gesendeten Daten nicht sinnvoll anfangen und es kommt zum\
    \ Problem, dass Unmengen Papier mit sinlosen Zeichen vollgedrückt wird.\n  1.\
    \ Entnehmen Sie alle Papier bei Tintentstrahldruckern bzw. öffnen Sie die Papierschicht,\
    \ damit das Drucken aufhört.\n  2. Der Druckauft wird erst dann aus der Warteschlange\
    \ entfernt, nachdem er an den Drucker geschickt wurde, der meist noch in der Warteschlange\
    \ stehen. Auch durch einen Reboot wird kein Druckauft aus der Warteschlange gelöscht.\
    \ Prüfen Sie mit lpq oder lpc status aus welcher Warteschlange gerade gedruckt\
    \ wird und löschen Sie mit lprm den Druckauft.\n\n3. Evtl. werden noch einige\
    \ Daten an den Drucker übertragen, obwohl der Druckauftrag aus der Warteschlange\
    \ gelöscht ist. Alle Prozesse, die noch auf den Drucker zugreifen, können mit\
    \ fuser beendet werden; für einen Drucker am Parallelport:\n\n```\n# fuser -k\
    \ /dev/lp0\n```\n\nFür einen USB-Drucker können:\n\n```\n# fuser -k /dev/usb10\n\
    ```\n\n4. Setzen den Drucker komplett zurück indem Sie ihn einige Zeit vom Stromnetz\
    \ trennen. Danach legen Sie das Papier wieder ein und schalten den Drucker an.\
    \ Nun sollte der Drucker Ruhe geben.\n\n## Weitere Informationen\n\nDetails zum\
    \ Drucken unter Linux und spezielle Problembehebungen finden Sie im „Referenz“-Handbuch,\
    \ das auf Ihrem SuSE Linux 8.0 installiert ist, im Kapitel 7 Druckerbetrieb. Betrachten\
    \ Sie das Buch Seiten in Ihrer SuSE-Hilfe (der Rettungsole auf Ihrem KDE-Desktop)\
    \ und klicken dort auf das Buch Ihre Referenz. Alternativ können Sie auch in Ihrem\
    \ Browser das Verzeichnis `/usr/share/doc/packages/suselinux-reference_de` laden\
    \ und die PDF-Dateien öffnen.\n\nAusgangspunkt für Ihre Einrichtung bei Problemen\
    \ ist der Supportdatenbank-Artikel „Drucker einrichten“, den Sie unter dem Stichwort\
    \ „einrichten“ ohne online finden:\n\nhttp://sdb.suse.com/de/drucker_einrichten.html\n"
  mdcn: "\n3. 对于每个模型，打印机数据库中至少有一条被认为运行良好的的配置。\n\n对于每种配置，原则上都应该通过 YoST2 测试打印来评估其是否实际有效。YoST2\
    \ 测试文件提供了有关相应配置的额外重要信息。\n\n## 手动配置\n\n如果无法满足自动配置的任一条件，或者需要特殊的个性化配置，则必须多或少手动进行配置。\n\
    \n## 硬件连接（接口）\n\n如果无法识别到打印机，说明打印机接口在硬件层面上无需手动配置即可工作。在这种情况下，必须配置接口。未定义的打印机将作为“其他（未知）”列在可用打印机列表中。点击“配置”，在接出的菜单中选择接口并点击“确定”。\n\
    \n然后您将看到相应的接口：\n\n```\n/dev/lp0\t是第一个并行接口\n/dev/usb0\t是 USB 打印机的接口\n```\n\n在此，必须在\
    \ YoST2 中进行相应的测试，以检查打印机是否可以通过所选接口进行响应。点击“确定”。\n\n现在选择您的模型。通过信息按钮，您可以获取有关在 Linux\
    \ 下支持情况的信息，以及对于 GDI 打印机，可能从哪里获取 Linux 驱动程序。\n\n如果打印机模型已在打印机数据库中，则有一组用于标准打印机的通用\
    \ Ghostscript Driver。点击左侧的“通用打印机”。\n\n## 注意事项\n\n> 必要时请咨询打印机制造商您的模型支持什么语言，或者您的打印机与打印机数据库中的哪个模型硬件兼容——这意味着打印机必须在硬件上能够“理解”这种打印语言，而不仅仅是通过额外的软件进行仿真。\n\
    \n注意\n\n## 打印名称\n\n这里指的是打印时需要输入的“队列”名称。因此，应仅使用小写字母和可能的数字的短名称。默认第一个队列设置为 `lp`。\n\
    \n## 应用程序配置\n\n在命令行中，使用命令 `lpr -Plp 文件名` 进行打印，其中 `文件名` 应替换为要打印的文件名。在这种情况下，将使用默认队列\
    \ `lp`。通过选项 `-P` 可以显式指定队列。使用 `lpr -Color 文件名` 则使用 `color` 队列。\n\n应用程序也使用 `lpr`\
    \ 命令进行打印。因此，通常情况下不要在应用程序中配置打印机，而是使用您通过 YaST2 设置的队列，并通过打印 YaST2 测试页验证这些队列的功能。\n\
    \n为此，在应用程序中选择您通过 YaST2 设置的队列名称（例如 `lp` 或 `color`），或在应用程序的界面中输入相应的打印命令（例如 `lpr\
    \ -Plp` 或 `lpr -Color`）。\n\n## 可能的问题\n\n- 如果计算机与打印机之间的通信出现故障，打印机可能无法有效处理发送的数据，导致出现打印大量带有无意义字符的纸张的问题。\n\
    \  1. 对于喷墨打印机，请取出所有纸张或打开纸盒层以停止打印。\n  2. 打印任务在发送到打印机后才会从队列中删除，此时它通常仍在队列中。即使是重启也不会从队列中删除打印任务。使用\
    \ `lpq` 或 `lpc status` 检查正在从哪个队列打印，并使用 `lprm` 删除打印任务。\n\n3. 即使打印任务已从队列中删除，可能仍有一些数据传输到打印机。所有仍在访问打印机的进程都可以用\
    \ `fuser` 终止；对于并行端口的打印机：\n\n```\n# fuser -k /dev/lp0\n```\n\n对于 USB 打印机，可以使用：\n\
    \n```\n# fuser -k /dev/usb10\n```\n\n4. 通过将打印机断电一段时间来完全重置打印机。之后重新放入纸张并开启打印机。现在打印机应该恢复正常。\n\
    \n## 更多信息\n\n关于 Linux 下打印的细节和特定的故障排除，请参阅安装在您的 SuSE Linux 8.0 上的“参考”手册第 7 章“打印机运行”。查看您的\
    \ SuSE 帮助（您 KDE 桌面上的救援光）中的书籍，并点击那里的“您的参考”。或者，您也可以在浏览器中加载目录 `/usr/share/doc/packages/suselinux-reference_de`\
    \ 并打开 PDF 文件。\n\n遇到问题时，配置的起点是支持数据库文章“设置打印机”，您可以通过关键词“设置”在离线状态找到它：\n\nhttp://sdb.suse.com/de/drucker_einrichten.html\n\
    \n"
