    # Erscheinungsbild


    Dieses Modul bietet Ihnen eine Vielzahl von Einstellungsmöglichkeiten zu Ihrem
    KDE-System. Folgende Module sind verfügbar: ''Arbeitsfläche'', ''Bildschirmschon'',
    ''Design-Verwaltung'', ''Farben'', ''Fensterdekoration'', ''Fenstereigenschaft'',
    ''Fensterleiste'', ''Hintergrund'', ''Kontrollleiste'', ''Programmstart-Anzeige'',
    ''Schriftart'', ''Symbole'' und ''Tastenzeordnung''.


    +   * Hinweis

    Bedenken Sie bei Änderungen am Erscheinungsbild die Anforderungen an Ihren Rechner:
    Wählen Sie einen Stil mit vielen Farnuancen und Hintergrundgrundlagen, benötigen
    Sie entsprechende Recleistung.


    +   * Hinweis

    Die Dialoge sind selbstklärend; wir werden allerdings einige wichtige Module herausfinden.


    **Arbeitsfläche** Unter ''Arbeitsfläche'' definieren Sie das vertikale Ausrichten
    der Arbeitsfläche, das Anzeigen von versteckten Daten oder Aktivieren der Menüleiste.
    Sie können sich eine Vorschau anzeigen lassen für bestimmte Daten (z. B. HTML).
    Die wichtigste Einstellung ist hier die Pfade für KDE, welche z. B. für die Arbeitsfläche.


    Unter ''Erscheinungsbild'' wählen Sie Schriftgröße, Standardschriftart, die farbliche
    Darstellung des Normaltextes und das passende Hintergrundfarbe oder oder Dateinamen
    unterstreichen werden sollen.


    Falls Sie mehrere Arbeitsflächen benötigen, werden Sie unter ''Anzahl der Arbeitsflächen''
    fündig. Hier können Sie die Anzahl und die Namen einstellen.


    +   * Tipp Zum Wechsel zwischen Arbeitsflächen, drücken Sie die Taste Strg und
    eine Funktionstaste Fx, wobei „x“ für die Nummer der Arbeitsfläche steht oder
    benutzen Sie Strg+Tab.


    **Bildschirmschoner** Um einen Bildschirmschoner einzuschalten, aktivieren Sie
    das Feld ''Bildschirmschon einschalten''. Jetzt können Sie die aus der Liste einen
    nach Ihrem Geschmack passenden auswählen. Um weitere Einstellungsmöglichkeiten
    von jeweiligen Bildschirmschoner zu bekommen, klicken Sie auf ''Einrichten''.'
  - '[PAGE 52]


    Design-Verwaltung Das Modul bietet die Möglichkeit, sog. „Themes“ (das Desktop)
    hinzuzufügen, selbst zu erstellen, zu speichern oder zu entfernen. Unter dem Reiter
    ‚Installation‘ können Sie aus einer Liste ein Theme auszuwählen. Unter dem Reiter
    ‚Inhalt‘ können Sie eine Feineinstellung vornehmen, welche Elemente (Farben, Klänge,
    Symbole, ...) verwendet werden sollen. Wenn Sie mehr Informationen zu diesem Theme
    erhalten möchten, wählen Sie den Reiter ‘Über‘.


    ![](img/7c7b5e54e6579952ad3fd8bde9e1a136_52_0.png)


    Abbildung 4.3: Farbanpassungen Ihres Desktops


    Farben Hier können Sie das Farbschema Ihres KDE-Desktops ändern bzw. individuelle
    Farbanpassungen durchführen (s. Abb. 4.3), welche von den meisten KDE-Programmen
    übernommen werden. In der Liste werden Ihnen einige Farbschemata ebenfalls angeboten.
    Klicken Sie auf einen, wird die Änderung im oberen Anzeigenfenster dargestellt.


    Fensterdekoration In diesem Modul können Sie die Dekoration des Fensterändern
    und der Titelleiste vornehmen. In der Liste finden Sie einige vielsprechende.
    Klicken Sie auf einen Eintrag, werden jedoch Dekorationsmodul die zwei folgenden
    Reiter (‘Knöpfe’ ‘Einrichten [...]’) aktiviert. Dort können Sie ggf. Ihre Feineinstellungen
    vornehmen. Probieren Sie die vielfältigen Designmöglichkeiten einmal.


    Fenster-Eigenschaften In diesem Modul können Sie das Verhalten von Fenstern einstellen,
    wenn Sie diese anklicken, verschieben oder deren Größe ändern. Beachten Sie, Falls
    Sie einen anderen Fenfenmanager als KWin (Punkt ‘Fensterdekoration’, ‘KDE2 (Standard)’)
    wählen, die Einstellungen u. U. nicht wirksam sein können.'
  - '[PAGE 53]


    Fensterleiste In diesem Modul wählen Sie, die geöffneten Anwendungen der aktuellen
    oder aller Arbeitsflächen in der Fensterleiste angezeigt werden. Außerdem können
    Sie den Knopf für das Mini-Programm Fensterleiste in der Fensterleiste anzeigen
    lassen, zusammenhängende Filter gruppieren oder geöffnete Programme nach Arbeitsflächen
    sortieren. Sie sollten sich zur besseren Übersicht die ‚Programmsymbole‘ anzeigen
    lassen.


    # Hintergrund Weisen Sie in diesem Modul Ihren Arbeitsflächen einen gemeinsamen
    Hintergrund, verschiedene Hintergründe oder Farbverläufe


    Für das Zuweisen von Hintergründen oder Farbverläufen wählen Sie Arbeitsflächen
    aus der Liste aus. Rechts davon sehen Sie die jeweilige Vorschau; darunter finden
    Sie die Reiter ‚Hintergrund‘ ‚Hintergrundbild‘ ‚Erweitert‘ und ‚Optimierung‘.


    Unter ‚Hintergrund‘ können Sie einen Modus einstellen, z. B. ein Muster, einen
    senkrechten oder waagerechten Farbverlauf usw. Die entsprechenden Farben finden
    Sie darunter.


    Der Reiter ‚Hintergrundbild‘ legt einen oder mehrere Hintergrundbilder Ihres Desktops
    fest. Sie können hier auch einen Modus (zentriert, gekachelt, usw.) anpassen.
    Möchten Sie diese Möglichkeiten nicht nutzen, wählen Sie ‚Kein Hintergrundbild‘
    aus.


    Unter ‚Erweitert‘ können Sie eine Überlagerung Ihres Hintergrundbildes vornehmen
    lassen. Es stehen hier mehrere Optionen (waagerechte, senkrechte, pyramidale Überlagerung)
    zur Verfügung. ‚Optimierung‘ stellt Einstellungen für Speicheroptimierungen bereit
    (für Experten).


    # Kontrolleiste In diesem Modul können Sie Ihrer Kontrolleiste („Kicker“) die
    Größe und das Aussehen einrichten. Sie finden in dem Modul ein Register mit verschiedenen
    Karten:


    Unter ‚Position‘ können Sie die Position der Kontrolleiste (links, rechts, oben,
    unten), den Stil (sehr klein, klein, mittel, groß) und die Größe der Kontrolleiste
    einstellen.


    Falls Sie die Kontrolleiste automatisch verbergen möchten, können Sie dies im
    Reiter ‚Ausblenden‘ vornehmen.


    Erscheinungsbild‘ zeigt verschiedene Hintergründe für bestimmte Menüs fest. Hier
    müssen Sie zuerst das Kästchen ‚Hintergrundkacheln aktivieren‘ auswählen; danach
    können Sie alle anderen Spezialmenüs aktivieren oder deaktivieren.'
- md: '

    Der Reiter Menüs’ legt fest, wie das Layout des K-Menüs aussehen soll, d.h. welche
    zusätzlichen Einträge verwendet werden sollen. Des Weiteren können Sie noch ein
    Schnellanzeiger-Menü integrieren, das Menü-Zwischenspeicher und noch andere Kleinigkeiten
    einstellen.


    Für die Miniprogramme können Sie über die Kontrolliste über den Reiter ‚Miniprogramm‘
    den Sicherheitsstatus angeben. Sie können auf zwei Arten starten: intern oder
    extern. Die interne ist der externen vorzuziehen, allerdings bei unsauberen programmierten
    Miniprogrammen zu Stabilitäts- oder Sicherheitsproblemen. Wählen Sie den entsprechenden
    Sicherheitsstatus hier aus.


    Der letzte Reiter heißt ‚Erweiterungen‘ und dient dazu, zusätzliche Fensterlisten
    einzustellen, wie z. B. die Position, das automatische Ausblenden oder Ausblendköpfe
    vorhanden sein sollen.


    ## Programmstart-Anzeige

    Um zu sehen, dass ein Programm gestartet wird, können verschiedene Einstellungen
    in diesem Menü vorgenommen werden.


    Schalten Sie ‚Aktivitätsanzeige bei Programmstart‘ ein, um eine Rückmeldung zu
    erhalten, die in Ihrem Mausiger ausgegeben bekommt. Entscheiden Sie beim Weiteren,
    ob diese Rückmeldung als Blinkeneffekt bzw. wie lange die Programmstart-Anzeige
    aktiv sein soll.


    Die Ausgabe der Rückmeldung, wenn ein Programm gestartet wurde, kann auch in der
    Kontrolliste erfolgen, indem Sie ‚Anzeige‘ in der Fensterliste aktivieren. Auch
    hier können Sie einstellen, wie lange die Programmstart-Anzeige aktiv sein soll.


    ## Schriften

    Sollten die voreingestellten Schriften Ihrer Benutzeroberfläche nicht zeigen,
    dann können Sie hier die Schriftarten an Ihre Bedürfnisse anpassen: Wählen Sie
    ‚Auswählen‘ neben der zu verändernden Schriftart. Im Dialog wählen Sie die Schriftart,
    den Schriftstil und die Schriftgröße ein und bestätigen Sie Ihre Einstellungen
    mit ‚OK‘.


    Stil ist die Art, wie Knöpfe, Listen, Menüs u. Ä. dargestellt werden. In der Liste
    sind einige vordefinierte Beispiele verfügbar. Falls Sie keine Style von GNOME/GTK
    benutzen möchten, klicken Sie auf ‚GTK-Design importieren...‘ Ein Fenster öffnet
    sich, das durch die Installation führt.


    ## Symbole

    Das Modul erlaubt Ihnen die Darstellung der Symbole für Ihre Arbeitsfläche auszuwählen.
    Sie können außerdem Effekte angeben, die auf Symbole angewendet werden sollen.


    # KDE – Die Konfiguration


    Im Reiter ‚Design‘ wählen Sie, ob Sie Symbole in einer Darstellung mit weniger
    Farben oder in Echtfarben mit mehr Abstufungen bevorzugen. Sie können auch ein
    weiteres Design über ‚Neues Design‘ einspielen.


    Unter ‚Erweitert‘ entscheiden Sie, ob Sie Effekte für Symbole bzw. verschiedene
    Symbolgrößen in den verschiedenen Listen bzw. Arbeitsflächen definieren.


    ### Tastenzuordnung

    Wenn Ihnen die bisherige Tastaturbelegung nicht zusagt, können Sie in diesem Modul
    verschiedene Tastaturkürzel für Aktionen und Programme definieren:


    - Unter ‚Allgemeine Tastenkürzel‘ werden die allgemeinen Tastaturkombinationen
    für Ihren Desktop zuweisen. In der Liste können Sie einer Aktion einen Kurzbefehl
    zuweisen, z. B. ruft standardmäßig die Kombination von Alt und F2 das Fenster
    ‚Befehl ausführen‘ auf.

    - ‚Tastenkürzel-Serien‘ definiert die Kurzbefehle für Wechsel auf einen anderen
    Desktop oder die Verschiebung eines Fensters auf einen Desktop.

    - Der Reiter ‚Tastenkürzel für Einzelprogramme‘ legt für verschiedene Aktionen,
    die in den Programmen häufig auftreten, bestimmte Tastenkombinationen fest, wie
    z. B. Kopieren, Einfügen usw.


    # Information


    Wenn Sie Informationen über Ihr System einsehen möchten, nehmen Sie sich für die
    einzelnen Module ein wenig Zeit. Die Informationen, die Sie hier finden, stammen
    zum Großteil aus dem /proc-Verzeichnis. Die Einträge sind selbstklärend und zeigen
    i.d.R. hardwarespezifische Informationen. So können Sie leicht überprüfen, ob
    bestimmte Geräte von Linux ordnungsgemäß angesprochen werden.


    # Klänge


    In diesem Modul können Sie die verschiedenen Einstellungen für Ihre Soundkarte
    definieren.


    **Audio-CD** – Dieses Modul dient zum Einrichten des Ein- und Ausgabemoduls für
    Ihre Audio-CDs. Der Aufruf erfolgt durch die Eingabe von audiocd/: in der URL-Zeile
    des Kon.


    Einstellungen können vorgenommen werden zum automatischen Erkennen von Audio-CDs,
    zur Fehlerkorrektur, zu den Dateiformaten „Ogg-Vorbis“ und „MP3“ sowie zur Anbindung
    an eine Musikdatenbank im Internet.


    MIDI — Wählen Sie für das Abspielen von Midi-Dateien diejenigen aus, die Sie zum
    Abspielen verwenden möchten.


    Im ersten Abschnitt können Sie die aktuelle Lautstärke als Standard speichern
    oder gespeicherte Lautstärken laden sowie gewählte Einstellungen beim Start von
    KDE über „Lautstärke-Einstellungen beim Anmelden automatisch laden lassen“.


    Im Abschnitt „Einstellungen für Hardware“ legen Sie bei „Maximale Anzahl gezählter
    Geräte“ fest, wie viele Soundkarten beim Start suchen und bei „Maximale Anzahl
    getesteter Geräte für Mixer“ wie viele Geräte auf Ihrer Soundkarte gesucht werden
    sollen.


    Signalton — Statt Systemnachrichten können Sie sich auch einen Signalton ausgeben,
    zu dem Sie in diesem Modul die Lautstärke, Höhe und Dauer einstellen können.


    Soundserver — Mit diesem Modul können Sie die Soundklänge von KDE einrichten,
    mit dem Sie MP3-Dateien usw. anhören können.


    Systemnachrichten — Um bei Eintritt eines bestimmten Ereignisses benachrichtigt
    zu werden bzw. zu dokumentieren, können Sie in diesem Modul die Einstellungen
    vornehmen:


    - Aktivieren Sie „Benachrichtigungen anzeigen“, um eine Meldung zu erhalten.

    - Wählen Sie für bestimmte Ereignisse, die Sie dokumentieren möchten, die Option
    „In Logdatei speichern“.

    - Stellen Sie hier ein, wie lange die Meldung angezeigt werden soll.

    - Wählen Sie einen Signalton aus, wenn Sie eine akustische Rückmeldung möchten.

    - Stellen Sie die Lautstärke, Höhe und Dauer des Signaltons im Modul ein.

    - Wählen Sie das Programm, das für die Meldungen verwendet werden soll.

