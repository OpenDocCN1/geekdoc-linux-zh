  - '[PAGE 1]


    # 1. Auflage 2002


    Copyright ©

    Dieses Werk ist geistiges Eigentum der SuSE Linux AG.

    Es darf als Ganzes oder in Auszügen kopiert werden, vorausgesetzt, dass sich dieser

    Copyrightvermerk auf jeder Seite befindet.


    Alle in diesem Buch enthaltenen Informationen wurden mit größter Sorgfalt zusammengestellt.
    Jed können fehlerhafte Angaben nicht völlig ausgeschlossen werden.

    SuSE Linux AG, die Autoren und die Übersetzer haften nicht für eventuelle Fehler
    und deren Folgen.


    Die in diesem Buch verwendeten Soft- und Hardwarebezeichnungen sind in vielen
    Fällen eingetragene; werden ohne Gewährleistung der freien verwendbarkeit benutzt.
    Die SuSE Linux AG richtet sich im Wesentlichen nach den Schreibweisen der Hersteller.
    Die Wiedergabe von Waren- und Handelsnamen usw. in diesem Buch (auch ohne besondere
    Kennzeichnung) berechtigt nicht zur Annahme, dass solche Namen (im Sinne der Warenzeichen
    und Markenschutz-Gesetzgebung) als frei zu betrachten sind.


    Hinweise und Kommentare richten sich ggf. an documentation@suse.de


    Autoren: Jörg Dippel, Stefan Dirsch, Matthias Eckermann, Carsten Fischer, Klaas
    Freitag,

    Gerd Knorr, Holger Herterich, Johannes Meixner, Siegfried Olschner, Marcus Schäfer,

    Jesko Schneider, Arvin Schnell, Adrian Schröter, Gabriele Stratnerner

    Redaktion: Antje Faber, Dennis Geider, Roland Haidl, Jana Jaeger, Edith Parzfall,

    Peter Reinhart, Marc Rührschneck, Thomas Schreitle, Martin Sommer, Rebecca Walter

