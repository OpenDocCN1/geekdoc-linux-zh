    \ anzupassen. Sicher ist dies in vielen Betrieben noch nicht erfolgt.\n\n# Die\
    \ Arbeitsumgebung\n\nWürden Ergonomen die „Heimarbeitsplätze“ von Computernutzern\
    \ unters untersuchen, würden sie angesichts der kuriosesten Konstruktionen wahrscheinlich\
