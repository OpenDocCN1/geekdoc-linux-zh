    + 11. Ich brauche Firewall, Masquerading, Mail- und WWW-Server. Hilft mir Ihr
    Installationssupport dabei?


    Nein.


    Der Installationssupport hilft Ihnen dabei, Linux prinzipiell zum Laufen zu bekommen.
    Für Themen, die über den Installationssupport hinausgehen, gibt es im Handel gute
    Bücher über hervorragende Dokumentationen in /usr/share/doc/packages und /usr/share/doc/howto/DE-NET3-HOWTO.txt.


    + 12. Wie kann ich auf meine CD zugreifen?


    Sie müssen die CD erst mit dem mount-Befehl „mounten“. Informationen zu diesem
    Befehl finden Sie im Abschnitt Dateibefehle auf Seite 141.


    Sie müssen die CD erst „unmounten“. Dies geht mit dem Befehl umount. Weitere Informationen
    hierzu im Abschnitt Dateibefehle auf Seite 142 zu finden. KDE brauchen Sie nur
    mit der rechten Maustaste auf das CD-ROM-Icon klicken und dann „Laufwerk-Einbindung
    lösen“ auswählen.


    Falls YaST läuft, bestehen Sie bis heute.


    + 14. Wie kann ich mir den freien Platz im Linux anzeigen lassen?


    Mit dem Befehl df -hT, siehe auch Abschnitt Systembefehle auf Seite 142.


    + 15. Wie kann ich in Linux „Cut-and-Paste“ machen?


    Ja.


    Wollen Sie „Cut-and-Paste“ im Textmodus nutzen, muss dazu der gpm laufen. Im X
    Window und im Textmodus ist: Markieren durch Drücken und Ziehen der linken Maustaste,
    Einfügen mit der mittleren Maustaste. Die rechte Maustaste meist in den Programmen
    eine besondere Funktion. Falls Sie keine mittlere Maustaste haben, drücken Sie
    beide gleichzeitig.


    + 16. Muss ich unter Linux auch von Viren haben?


    Nein.


    Unter Linux gibt es keine ernst zu nehmenden Viren. Zudem könnten Viren, wenn
    Sie nicht als Root aufgerufen werden, keinen großen Schaden an dem System verursachen.
    Die einzigen Virenscanner, die es unter Linux dienen, Mails nach Windows-Viren
    abzusuchen (falls Linux als Router oder Server fungiert).


    ## 17. Muss ich einen Kernel selbst kompilieren?


    Nein, das ist in allen allgemeinen Fällen nicht notwendig!

    Der Kernel ist inzwischen so umfangreich, dass er auch 800 Optionen gibt, die
    man bei der Konfiguration zu berücksichtigen hat! Das ist unmöglich, alle verschiedenen
    Konfigurationen mit allen ihren Auswirkungen zu beherrschen, raten wir ungeübten
    Benutzern dringend zur Neukompilierung des Kernels ab. Wenn Sie es dennoch tun,
    tun Sie es auf eigenes Risiko – wir können in diesem Fall keinen Installationssupport
    anbieten!


    ## 18. Was ich mit Systemmodulen sehen?


    Geben Sie als root in einem Terminalfenster folgenden Befehl ein:


    ```

    root: # tail -f /var/log/messages

    ```


    Weitere interessante Programme in diesem Zusammenhang sind: top, procinfo und
    xview.


    Die Meldungen beim Booten können Sie mit


    ```

    root: # less /var/log/boot.msg

    ```


    ## 19. Ich kann mit telnet nicht in meinem Rechner einloggen. Ich bekomme immer
    die Antwort „Login incorrect".


    Wahrscheinlich versuchen Sie, sich als root einzuloggen. Das geht aus Sicherheitsgründen
    nicht über das.

    Legen Sie mit YaST einen normalen Benutzer an; mit diesem können Sie sich dann
    anmelden. Danach wechseln Sie mit su zu root-Benutzer. Viel besser und sicherer
    ist es jedoch, anstelle von dem Programm ssh zu benutzen; da sich verschlüsselte
    und somit nicht abhörbare Verbindungen verwendet. Sie finden dieses Programm in
    der Serie sec.


    ## 20. Wie komme ich mit Linux ins Internet?


    Dazu gibt Ihnen das Kapitel KInternet – der Weg ins WWW auf Seite 33 Auskunft.


    ## 21. Wo ist StarOffice?


    Sie finden StarOffice als Paket so_base zum Auswählen in der Serie pay. Die deutschen
    Sprachanpassungen sind im Paket so_de enthalten. Bitte benutzen Sie zur Installation
    ein Installationsprogramm YaST, das Ihnen dann mitteilt, welche CD Sie einzulegen.


    ## 22. Ich habe einen Fehler in SuSE Linux gefunden. Wo kann ich diesen melden?


    Überzeugen Sie sich davon, dass es wirklich ein Fehler im Programm ist und nicht
    nur ein Bedienungs- oder Konfigurationsfehler. Sehen Sie sich auch die Dokumentationen
    in /usr/share/doc/packages und /usr/share/doc/howto an. Wenn Sie Fehler bemerken
    und finden Sie im Internet dazu etwas über http://sdb.suse.de/sdb/html/ in der
    Datenbank. Geben Sie ein Stichwort oder arbeiten Sie über den Link „History“ vor
    bzw.


    Sollte es sich als Fehler herausstellen, schicken Sie eine Beschreibung per E-Mail
    an feedback@suse.de.


    ## 23. Wie kann ich Programme installieren?


    Programme, die auf den SuSE Linux-CDs enthalten sind, installieren Sie am besten
    mit YaST. Bitte beachten Sie, dass viele größere („Demos“) in der Serie zu finden
    sind.


