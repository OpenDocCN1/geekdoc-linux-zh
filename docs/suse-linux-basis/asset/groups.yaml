  - '[PAGE 100]


    # YaST2 - Konfiguration


    Sie können sicherheitshalber erstmal eine Standardauflösung wählen: Markieren

    Sie hierzu den Punkt ''Vesa'' und die Werte 640x480. Der Vesa-Modus ist aller-

    dings auf 75 Hz Bildwiederholrate limitiert. Auf modernen Monitoren liegt eine

    anenehme Bildwiederholrate zwischen 75 und 90 Hz. Manche sind Darstellungsfehler
    durch Hardwarelimitierungen vorgegeben. Alternativ haben Sie die

    möglichkeit, eine eventuell andere Treiberdiskette zu verwenden. Klicken

    Sie hierzu auf ''Treiberdiskette'', legen Sie die Diskette vom Monitor-Hersteller
    ein

    und bestätigen Sie mit ''OK''. Bei Gelingen erscheinen die Monitordaten dann in

    der Auswahlwahliste.


    # Maus


    Mit diesem YaST2-Modul haben Sie die Möglichkeit, Ihre Maus funktionstüchtig

    zu machen. Falls die automatische Erkennung felschlägt, öffnet sich die Maske

    für die manuelle Konfiguration. Die Dokumentation zu Ihrer Maus können Sie\eineine
    Beschreibung des Typs entnehmen.

    Wählen Sie aus der Liste im YaST2-Fenster aus. Dies bezerkstelligen sich

    mit den Pfeiltasten ⇧ und ⇩. Der richtige Mauspunkt markiert ist, best-

    tigen Sie den entweder mit der Tastenkombination Alt + ⊕ oder mit Tab und

    anschließender Bestätigung mit ↵

    Wechseln Sie nun mit der Tabulator-Taste bis Button ''Test'' und drücken ↵

    Jetzt sollte sich Ihre Maus über den Bildschirm bewegen. Falls es nicht

    funktioniert, haben Sie eventuell einen falschen Maustyp ausgewählt. Wählen Sie

    dann am besten einen anderen Typ und wiederholen Sie den Versuch.


    # Tastatur


    Das Tastatur-Modul befindet sich in ''System''. Das gewünschte Tastatur-Layout

    entspricht in der Regel der gewählten Sprache. Im Testfeld sollten Sie die Ein-

    stellen, ausprobieren, z. B. auf die Umlaute (ä, ö und ü) korrekt wiedergegeben

    werden, oder der Buchstabe ''ß'' oder das genannte Pipe-Symbol ''|''. Auch die

    Buchststaben ''z'' und ''y'' sollten überprüft werden, da diese bei amerikanischen

    Tastatur andersherum liegen.


    SuSE Linux - Basis 91'
  - "[PAGE 101]\n\n# Scanner\n\nWenn Sie Ihren Scanner angeschlossen und eingeschaltet\
    \ haben, sollte beim Start dieses YaST2-Moduls Ihr Scanner automatisch erkannt\
    \ werden. In diesem Fall erscheint der Dialog zur Installation des Scanners. Falls\
    \ kein Scanner erkannt wird, geht es weiter mit der manuellen Konfiguration. Wenn\
    \ Sie bereits einen oder mehrere Scanner installiert haben sollten, erscheint\
    \ zunächst eine Übersichtstabelle mit einer Liste vorhandener Scanner, die bearbeitet\
    \ oder gelöscht werden können. \n\nMit ‚Hinzufügen‘ können Sie ein neues Gerät\
    \ einrichten.\n\nAls Nächstes wird eine Installation mit Standard-Einstellungen\
    \ durchgeführt. Wenn die Installation erfolgreich war, erscheint eine entsprechende\
    \ Meldung.\n\nHun haben Sie die Möglichkeit, Ihren Scanner zu testen, indem Sie\
    \ eine Vorlage laden und dann auf ‚Test‘ klicken.\n\n# Scanner wurde nicht erkannt\n\
    \nBeachten Sie, dass nicht unterstützte Scanner automatisch erkannt werden können.\
    \ Scanner, die an einer anderen Maschine im Netzwerk betrieben werden, werden\
    \ nicht erkannt. Unterscheiden Sie zur manuellen Konfiguration zwischen einem\
    \ USB-, SCSI- oder Netzwerkscanner.\n\n+   * USB-Scanner: Hier muss der Hersteller\
    \ bzw. das Modell eingegeben werden. YaST2 versucht, USB-Module nachzuladen. Falls\
    \ Ihr Scanner nicht ist, kann es sein, dass die Module nicht automatisch geladen\
    \ werden können. In diesem Fall gehen Sie weiter in einen Dialog, dem Sie die\
    \ Möglichkeit haben, das USB-Modul „per Hand“ nachzuladen. Lesen Sie hierzu den\
    \ YaST2-Hilfetext lesen.\n* SCSI-Scanner: Geben Sie das Device an (z. B. /dev/sg0).\
    \ Hinweis: Ein SCSI-Scanner darf nicht im laufenden System angeschlossen oder\
    \ ausgestckt werden. Fahren Sie das System zuerst neu her.\n* Netzwerk-Scanner:\
    \ Hier benötigen Sie die IP-Adresse bzw. den Hostnamen.\n\nBei einem Netzwerk-Scanner\
    \ können Sie einen anderen Scanner verwenden, der an einem Rechner in Ihrem Netzwerk\
    \ angeschlossen und als Netzwerk-Scanner eingerichtet ist. Lesen Sie zur Konfiguration\
    \ eines Netzwerk-Scanners den Supportdatenbank-Artikel „Scanner unter Linux“ (http://sdb.suse.de/),\
    \ Stichwortsu „Scanner“. Bei der Wahl des Netzwerk-Scanners ist in sich der öffnende\
    \ Hostname oder die IP-Adresse des Rechners, an dem der Scanner angeschlossen\
    \ ist, einzutragen."
- md: '

    Wenn Ihr Scanner nicht erkannt wurde, ist das Gerät wahrscheinlich nicht unterstützt.
    Manchmal werden jedoch doch unterstützte Scanner nicht erkannt. Hier hilft Ihnen
    gegebenenfalls die manuelle Scanner-Auswahl. Wenn Sie in der Hersteller- und Modellliste
    Ihren Scanner identifizieren können, wählen Sie ihn einfach ein – falls nicht,
    finden Sie ihn lieber über „Abbrechen“. Informationen zu Scannern, die mit Linux
    funktionieren, finden Sie unter http://cdb.suse.de, http://sdb.suse.de oder http://www.mostang.com/sane.


    ## Achtung


    Die manuelle Zuordnung des Scanners sollten Sie nur dann vornehmen, wenn Sie sich
    sicher sind. Bei einer falschen Auswahl könnte Ihre Hardware Schaden nehmen.


    Achtung


    ## Troubleshooting


    Wenn Ihr Scanner nicht erkannt wurde, sind folgende Ursachen möglich:


    - Der Scanner wird nicht unterstützt. Unter http://www.suse.de/sdb finden Sie
    eine Liste mit Geräten, die zu Linux kompatibel sind.

    - Ihr SCSI-Controller ist nicht korrekt installiert.

    - Es gibt Terminierungs-Probleme mit Ihrer SCSI-Schnittstelle.

    - Ihr SCSI-Kabel überschreitet die zulässige Länge.

    - Ihr Scanner hat einen SCSI-Light-Controller, der von Linux nicht unterstützt
    wird.

    - Ihr Scanner könnte defekt sein.


    ## Achtung


    > Bei einem SCSI-Scanner darf das Gerät auf keinen Fall im laufenden System angeschlossen
    oder ausgestickt werden. Fahren Sie bitte zuerst Ihren Rechner herunter.


    Achtung


    Weitere Informationen zum Scannen finden Sie im Kapitel „Kooka – Das neue Scanprogramm“
    im Buch Die Programme.


    ## TV-Karte


    Nach dem Start und der Initialisierung dieses Yoast2-Moduls erscheint zunächst
    der Dialog ‚Einrichtung der TV-Karte‘ Wenn Ihre TV-Karte automatisch erkannt wird,
    wird sie hier nicht angezeigt. Markieren Sie die Zeile mit Mausklick und klicken
    Sie auf ‚Hinzuzufügen‘ Falls Ihre TV-Karte nicht erkannt wurde, konfigurieren
    Sie die ‚andere, nicht erkannte‘ Karte, damit Sie zur manuellen Konfiguration.
    Mit dem Button ‚Bearbeiten‘ haben Sie die Möglichkeit, eine bestehende Konfiguration
    zu ändern.


    Der Dialog ‚Überblick‘ über die TV-Karten erscheint nach einem Klick auf ‚Bearbeiten‘
    oder gleich nach dem Start des Yoast2-Moduls, wenn Sie bereits eine oder mehrere
    TV-Karten installiert und konfiguriert sind. In diesem Dialog können Sie die Konfiguration
    jeder Karte bearbeiten oder ‚Hinzufügen‘ starten Sie die manuelle Konfiguration.


    In der Maske ‚Manuelle Konfiguration‘ wählen Sie zuerst den Typ TVkarte aus der
    Liste aus. Falls Sie einen Tunertyp wählen müssen, um eine funktionierende Konfiguration
    zu erhalten, wenn Sie sich nicht sicher sind, sollten Sie die Einstellungen erst
    einmal auf ‚Standard (erkannt)‘ lassen und festlegen, ob sie funktionieren. Falls
    sich nicht oder alle senden lassen, könnte es zu B. B. daran liegen, dass die
    automatische Erkennung des Tunertypes nicht gelang oder Sie einen falschen Tunertyp
    ausgewählt haben.


    Hier ‚Details‘ finden Sie die Expertenkonfiguration. Hier können speziell das
    Kernelmodul, als Treiber der TV-Karte läuft, und diesen Parameter auswählen. Auch
    lassen sich alle Ihres TV-Karten-Treibers kontrollieren. Wählen Sie hierfür die
    zu bearbeitenden Parameter aus und geben Sie den neuen Wert ein. Mit ‚Anwenden‘
    werden die neue übernommen und ‚Zurücksetzen‘ werden die Standardwerte angenommen.


    In dem Dialog ‚TV-Karte, Audio‘ können Sie die entsprechenden Einstellungen vornehmen,
    damit Sie auch mit dem Computer fernsehen können. Normalerweise wird dies durch
    ein Kabel mit Ihrer TV-Karte mitgeliefert, damit Sie den Ton auf den Audioeingang
    der Soundkarte legen können. Hier muss die Soundkarte bereits eingerichtet und
    der externe Eingang nicht mehr stummgeschaltet sein. Klicken Sie hierfür in der
    Maske auf ‚Ja‘ und seleieren Sie Ihre Soundkarte zu konfigurieren; vgl. Abschnitt
    Soundkarte auf Seite 86. Sie haben zudem die Möglichkeit, den Lautsprecherbereich
    direkt zu klemmen, ohne Soundkarte dazwischen – falls Sie den Sound nicht sowieso
    von woanders Sie ihn erhalten (z. B. externer SAT-Receiver) Es gibt auch TV-Karten
    ganz ohne Soundfunktion, z. b. für CCD-Kameras. In einem Fall ist keine Audiodekonfiguration
    nötig bzw. mw. möglich.


    ## DMA-Modul


    Ein neues YaST2-Modul erlaubt es Ihnen, bei installiertem System den sog. „DMA-Modus“
    für Ihre Festplatte(n) und Ihre CD/DVD-Laufwerke zu aktivieren oder zu deaktivieren.
    DMA-Modi können die Leistungsfähigkeit bzw. die Geschwindigkeit der Datenübertragung
    in Ihrem System erheblich steigern.


    Der aktuelle Kernel von SuSE Linux aktiviert bei der Systeminstallation DMA automatisch
    für Festplatten und lässt ihn deaktiviert, da in der Vergangenheit mit standardmäßiger
    DMA–Aktivierung für alle Laufwerke des öften Probleme mit CD-Laufwerken aufgetreten
    sind. Sie können nachträglich mit dem DMA-Modul für Ihre Laufwerke entscheiden,
    ob Sie DMA aktivieren oder nicht. Sollten z. B. bei Ihrem Festplattenbetrieb Probleme
    auftreten, kann es hilfreich sein, DMA zu deaktieren. Umgekehrt steigern Sie die
    Datenübertragungsrate Ihres Laufwerks, wenn Sie DMA aktivieren und das Laufwerk
    den Modus ohne unterstützt.


    > Hinweis

    > „DMA“ (= Direct Memory Access) bedeutet „Direkter Speicherzugriff“, d.h. Laufwerke
    können Ihre Daten direkt in den Arbeitsspeicher übertragen ohne den „Umweg“, über
    den die Prozesssteuerung.


    ## Internet-Zugang


    ### Grundlagen einer Internetverbindung


    Hier werden die wichtigsten Begriffe für Internetanbindung angesprochen und deren
    Zweck und Funktion kurz dargestellt.

    Alle Rechner im Internet bilden ein einzig großes Netzwerk, in dem unterschiedliche
    Betriebssysteme auf unterschiedlicher Hardware laufen. Damit beliebige Rechner
    miteinander kommunizieren können, muss ein allgemeines, verbindliches Kommunikationsprotokoll
    verwendet werden, über das die verschiedenen Betriebssysteme unabhängig von der
    jeweiligen Hardware ihre Daten austauschen können. Das leistet das Internet Protocol
    (IP) zusammen mit dem Transmission Control Protocol (TCP), dem User Datagram Protocol
    (UDP) und dem Internet Control Message Protocol (ICMP). Diese Protokolle bilden
    die gemeinsame „Sprache“ aller Rechner im Internet und die Kurzbezeichnung TCP/IP.


    Jeder Rechner im Internet hat eine Identifikationsnummer, die so genannte IP-Adresse,
    und nur über diese Nummer kann er via TCP/IP angesprochen werden. Normalerweise
    hat ein Rechner auch einen Klartextnamen, mit dem er in Anwendungsprogrammen bezeichnet
    wird. Um die IP-Adresse zu einem Klartextnamen zu bekommen, gibt es das Domain
    Name System (DNS). Dies ist ein spezieller Dienst, der genannte Nameserver bereitstellt,
    heißt Server (hier z. b. DNS-Server), ein Rechner oder Programm, der einen Dienst
    beansrucht, heißt Client.


    Unterhalb von TCP/IP gibt es verschiedene standardisierte Protokolle, welche TCP/IP-Daten
    der jeweiligen Übertragungsart zu übermitteln – zum Beispiel Verbindungen über
    Netzwerkkarte ist das Ethernet-Protokoll, bei Modem- und ISDN-Telefonverbindungen
    das Point to Point Protocol (PPP) und bei ADSL-Verbindungen das Point to Point
    Ethernet (PoE).


    Zum Aufbau einer Internetverbindung muss zuerst die Ethernet-, PPP- oder Verbindung
    und dann die TCP/IP-Verbindung zwischen dem eigenen Rechner und einem Internetprovider
    hergestellt werden.

    Oberhalb von TCP/IP gibt es verschiedene standardisierte Protokolle, um Daten
    passend zu der jeweiligen übertragen zu können:


    - Das Hyper Transfer Protocol (HTTP) dient dazu, WWW-Seiten im Hyper Markup Language
    (HTML) Format zu übertragen

    - mit dem Simple Mail Transfer Protocol (SMTP) werden E-Mails an einen anderen
    Rechner verschickt und mit dem Post Office Protocol (POP3) können E-Mails bei
    Bedarf von einem Mail-Server heruntergeladen werden.

    - Um Daten zu übertragen, wird das File Transfer Protocol (FTP) verwendet.


    Damit verschiedene Anwendungsprogramme, z. B. ein WWW-Browser und ein E-Mail-Programm,
    die Internetverbindung zur selben nutzen können, wird jedoch jede Anwendung eine
    separate TCP/IP-Verbindung verwendet und große TCP/IP-Datenmengen in kleine Pakete
    zerlegt, so dass abwechselnd z. B. die HTTP-Pakete des WWW-Browser über diese
    TCP/IP-Verbindung und die SMTP- bzw. POP3-Pakete des E-Mail-Programs über andere
    TCP/IP-Verbindungen übertragen werden können.


    Da verschiedene Programme die sogenannte Internetverbindung benutzen, genü die
    IP-Adresse, alleine nicht, sondern unter Unterscheidung welche TCP/IP-Daten zu
    welchem Programm gehören, die so genannte Port-Nummer.


    Die Standarddienste wurden traditionell auf dem entsprechenden Server über folgende
    Port-Nummern angeboten:

