    使用 `fdisk` 删除 Linux 分区；您可能需要先调用 `fdisk`；然后使用 MS-DOS 软盘启动，并在 DOS 下执行 `fdisk /MBR`
    命令。


    + 11. 我需要防火墙、地址转换（Masquerading）、邮件服务器和 WWW 服务器。你们的安装支持能帮我吗？


    不。


    安装支持帮助您让 Linux 基本上运行起来。对于超出安装支持范围的主题，市面上有很好的书籍，此外可以在 `/usr/share/doc/packages`
    和 `/usr/share/doc/howto/DE-NET3-HOWTO.txt` 中找到优秀的文档。


    + 12. 我如何访问我的 CD？


    您必须先用 `mount` 命令对 CD“挂载”。有关该命令的信息，请参阅第 141 页的文件命令章节。


    您必须先对 CD 进行“卸载”。这可以使用 `umount` 命令完成。更多信息请参阅第 142 页的文件命令章节。在 KDE 中，您只需右键点击 CD-ROM
    图标，然后选择“取消驱动器”（Laufwerk-Einbindung lösen）。


    如果 YaST 运行，您可以坚持。


    + 14. 我如何显示 Linux 中的可用空间？


    使用 `df -hT` 命令，另请参阅第 142 页的系统命令章节。


    + 15. 我如何在 Linux 中进行“剪切粘贴”（Cut-and-Paste）？


    可以。


    想在文本模式下使用“剪切粘贴”，必须运行 `gpm`。在 X 窗口和文本模式下：按住并拖动鼠标左键进行标记，点击鼠标中键粘贴。右键在大多数程序中具有特殊功能。如果您没有中键，请同时按下两个键。


    + 16. 我在 Linux 下也需要担心病毒吗？


    不需要。


    Linux 下没有正规的病毒。此外，如果您不是以 `root` 身份运行，病毒可能无法对系统造成太大伤害。Linux 下唯一的病毒扫描程序是用于扫描邮件中的
    Windows 病毒（如果 Linux 作为路由器或服务器运行）。


    ## 17. 我必须自己编译内核吗？


    不需要，在所有通用情况下都不是必要的！

    内核现在已经非常庞大，配置时甚至有 800 个选项需要考虑！要掌握所有及其影响的各种配置是不可能的，我们强烈建议不熟悉的不要重新编译内核。如果您坚持要这样做，请自担风险——在这种情况下我们无法提供安装支持！


    ## 18. 我如何查看系统模块？


    在终端窗口中以 root 身份输入以下命令：


    ```

    root: # tail -f /var/log/messages

    ```


    与此相关的其他感兴趣程序还有：`top`、`procinfo` 和 `xview`。


    启动时的信息可以通过以下命令查看：


    ```

    root: # less /var/log/boot.msg

    ```


    ## 19. 我无法通过 `telnet` 登录我的电脑。一直得到“Login incorrect”（登录错误）的回复。


    您可能正尝试以 `root` 身份登录。出于安全考虑，这样做是不行的。

    使用 YaST 创建一个普通用户；可以使用该用户登录。之后使用 `su` 切换到 `root` 用户。但更好更安全的方法是使用 `ssh` 程序；因为它使用了加密且不会被窃听的连接。您可以在
    `sec` 系列中找到该程序。


    ## 20. 我如何通过 Linux 互联网？


    请参考第 33 页的章节“KInternet – 通往 WWW 的路”。


    ## 21. StarOffice 在哪里？


    您可以在 `pay` 系列中找到名为 `so_base` 包进行选择。德语语言包包含在 `so_de` 包中。请使用 YaST 安装程序进行安装，它会告诉您插入哪个
    CD。


    ## 22. 我在 SuSE Linux 中发现了一个错误。我可以在哪里报告？


    请确认这确实是程序错误，而不仅仅是操作或配置错误。请查看 `/usr/share/doc/packages` 和 `/usr/share/doc/howto`
    中的文档。如果您注意到了错误，可以在互联网的 http://sdb.suse.de/sdb/html/ 数据库中查找相关信息。输入关键词或通过“History”（历史）链接进行查找。


    如果证明是错误，请通过邮件向 `feedback@suse.de` 发送描述。


    ## 23. 我如何安装程序？


    包含在 SuSE Linux CD 中的程序，最好使用 YaST 安装。请注意，许多大型程序（“Demos”）可以在相关系列中找到。


    ## 24. 我有一个程序“只有”源代码。我如何安装它？


    有些程序需要一些“专业知识”，最好的方法是在良好的 Linux 书籍中找到——参见 http://www.suse.de/de/produkte/books/。


    ## 25. 我的文件系统受支持吗？


    请注意，许多大型程序（“Demos”）可以在系列中找到。


    ## 26. 我如何对我的磁盘进行碎片整理？


    由于 Linux 不产生碎片，因此文件系统不需要碎片整理。


    ## 27. 我正在分区，文件系统是什么？


    使用 `fdisk` 是可以分区的。


    ## 28. 我运行 Linux 需要多少空间？


    这取决于您需要多少包。


    ## 29. 我需要 Linux 空间，我该如何分区？


    使用 `disk` 和 YaST 来获取空间。


    ## 30. 我的电脑崩溃了，我可以安全地按下重置键吗？


    如果您的电脑对鼠标或键盘没有反应，并不意味着整个电脑都崩溃了。可能只是某个程序阻塞了鼠标和键盘，所有其他程序仍在运行。如果电脑可以从外部访问（串口终端、网络），可以仍然登录并使用
    `killall` 终止干扰进程。如果您没有这种可能，请尝试通过 `Str + (Alt) + F2` 进入另一个控制台，并在那里终止进程。如果计算机对任何按键都没有反应，请等待至少
    10 秒发生磁盘访问后，然后再按下重置键。


    '
