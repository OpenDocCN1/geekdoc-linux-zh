    在“会话”下，您可以决定在登录管理器中显示哪些类型的 `KDE` 或 `failsafe`（安全模式）会话，以及允许何时从从何处“关机”计算机。此外，您还可以确定在“停止”或“重启”时执行哪些命令。


    “用户”选项卡设置登录管理器应显示哪些可用用户。


    “简化”等项规定了用户在必要时可以自动登录。


