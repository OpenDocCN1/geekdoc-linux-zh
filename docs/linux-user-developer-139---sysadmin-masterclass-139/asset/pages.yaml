  md: '# # Cubiedboard 2


    Is the Cubiedboard 2 the Raspberry Pi killer we waited for?

    ## REVIEW


    # # Technical specs


    +   * **Operating System**: Android 4.2 pre-loaded in NAND Flash

    * **Processor**: Allwinner A20 dual-core ARM

    * **Graphics**: ARM Mali-400 dual-core graphics

    * **Memory**: 1GB DDR3, 4GB NAND flash storage

    * **Dimensions**: 10.5cm x 80.1mm x 12mm

    * **Weight**: 45g

    * **GPIO**: 2 x 48-pin headers on underside, featuring SPI, I2C, UART, Video,
    CSI, FMI, DAC, VGA, GPIO, UART-TP

    * **Connectivity**: 100Mbps Ethernet, USB Host, USB OTG, Receiver, Headphones

    * **Expansion**: 1x Micro SD, SATA interface


    As well as analogue audio output, the Cubiedboard 2 includes line-in, and SPDIF
    digital via the GPIO header


    While the silkscreen suggests a second card slot, the Cubiedboard 2 instead features
    a 4GB NAND flash module


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_78_0.png)


    # Two 48-pin GPIO headers break out almost every feature of the A20 chip


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_78_1.png)


    performance from the reasonably-high Mali-400 graphics is fantastic with plenty
    of support for alternative systems.


    The Allwinner A20 is an ARM7 processor, a generation behind the Raspberry Pi ARM
    BCM2835, and as a result any ARM-compatible distribution can be installed on the
    Cubiedboard.


    Notably, we used Cubiedboard for testing our ARM em priorities


    Using the Cubiedboard for various distributions - we made a Raspberry-inspired
    Debian for our purpose of review - thanks


    The dual-core processor is fantastic for keeping the system responsive and has
    a dramatic impact on multi-threaded applications: the faster processor is capable
    of compressing a large file in zip in half the time, and this is reduced to a
    quarter by using the more powerful-aware gpio application to run the action across
    CPU cores.


    Using the Cubiedboard as a general-purpose computer, it is entirely possible.
    The performance is closer to a normal desktop than the off-shelf Raspberry Pi.
    Granted, the Cubiedboard


    # Also consider


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_78_2.png)


    A20-OLinuX-Micro-4GB (£55 around)


    A fully-featured design, the OLinuX-Micro uses the Allwinner A20 chip as the Cubiedboard
    does and has even more features with dual-band WiFi, LED controller, 160 GPIO
    pins and a noise-interference shielded case. See olinux.com.


    2 is twice the price of the pocket-friendly Pi, but at roughly four times the
    real-performance and far more connectivity, it''s an investment worth making.


    The only drawback of the Cubiedboard is the location of the GPIO headers on the
    bottom, rather than the top, like the Pi. The PCB, but such a layout helps keep
    cables out of sight in finished projects - especially when coupled with many other
    cases available.


    # Summary


    Although the stock Android installs it under a breeze, the Cubiedboard 2 is a
    very adaptable platform. Processor is compatible with - and in some cases, the
    test performance for non-Linux OS connected via speed SATA storage is undeniably
    fast. For those who have outgrown the Pi, it''s a logical upgrade.


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_78_3.png)


    Raspberry Pi

    £35-ish for quite a low-cost ARM-based board. The Raspberry Pi is around half
    the price of the Cubiedboard but it cuts corners nicely. It''s not quite a match
    for the Allwinner A20, but it offers connectivity as standard. raspberrypi.org


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_78_4.png)


    More information

    cubiedboard.org


    79 | www.linuxux.co.uk'
