  md: '# On the DVD

    Welcome to Linux User & Developer DVD


    # Editor''s picks


    **Tails 0.23** The ultra-secure distro will soon be getting a 1.0 release, with
    0.23 being their first development release of the series. Its popularity has increased
    in the last year due to the concerns with privacy on the internet.


    **Webconverter** This Firefox-based distro just proves how versatile open source
    software can be. Creating a lightweight and secure web-kiosk distro could only
    really be possible on a Linux environment.


    **Universal Media Server** We''ve been a list fork based on the development of
    PS3 Media Server grinding to a halt, especially with the trouble we''ve had on
    newer setups. UMS is its spiritual successor, with devs from the old version on
    board and working on feas.


    # Complete index


    **Ubuntu 14.04 LTS Beta 2** The final beta leading up to the big releases, Ubuntu
    14.04 is shaping up to be one of the most stable releases of Ubuntu with a sneak
    of what to expect thanks to this development release.


    **OpenMandriva 2014.0** Here''s another beta, this time of OpenMandriva. Based
    on Mandrake - this spin brings back some of the Mandriva and tools to resemble
    a more classic-style Mandrake.


    **Tails 0.23** The latest version of the most secure distro, with automatic routing
    built into its apps to make sure that everything you do is in perfect secrecy
    and privacy.


    **Webconverter 24.0** The web kiosk built upon Linux and Firefox is a great shortcut
    to get your net cafe, reception area or university student connected to the internet
    for all to use without fear of abuse.


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_96_0.png)


