    to get a more reasonable file size, saving some of these items for your production
    service.


    # gulp-load-plugins


    www.npmjs.com/gulp-load-plugins

    This fantastic plugin requires to specify and require each plugin individually
    into Gulp. The plugin can read the JSON file associated with the project and scope
    of dependencies contained within and automatically assign them to a global scope
    on your behalf.


    # Gulp-plugins in


    # 15 Gulp-repository


    While Gulp does not have a plugin, a client-side application has created from
