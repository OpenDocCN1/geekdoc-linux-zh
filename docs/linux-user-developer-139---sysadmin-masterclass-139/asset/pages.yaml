    FEATURE


    Being a system administrator is sometimes strange and difficult: nobody knows
    you exist until there problem occurs, and then you''re immediately blamed. Your
    number priority is to ensure that users or developers have access to systems they
    are managing.


    SAs are often also called network administrators, system engineers, UNIX gurus,
    and, lately, DevOps. One thing is to be sure: this profession is a busy job and
    rarely changes day by day.


    # ## Working with log files


    Becoming an SA takes some time, but you don''t have to be a technical wizard.
    You just need enough knowledge and training to be able to work on a busy server
    without being hacked, which is a rule that will get you twice and cut no once.


    Log files are an essential part of every Linux system. As an SA it''s very good
    practice to watch log files on a daily basis, especially when you are administering
    a large server. Check logs status to identify and detect potential problems or
    bottlenecks. Here are three of the most important...


    # ## What does an administrator do?


    If you ask five system administrators (SA) to define what they do, you will get
    five different answers. This happens because system administrators handle a wide
    variety of tasks.


    Becoming a Linux administrator can take around two years of full-time experience.
    The most critical task of an administrator is defining and interpreting log practices
    and them.


    Strictly speaking, a system administrator is responsible for the smooth operation
    of one or more machines. Each machine usually runs a number of services, some
    more critical than others, and may have a number of users or developers using
    them.


    It is also useful and critical for the system administrator to have the Internet
    or web available at all times. Websites are usually a reflection of the reliability
    of the company, so it''s a responsibility that matters highly priority.


    +   - As an essential part of Linux systems, it''s good practice to watch log
    files daily


    +   1 /var/syslog

    This is the system log file. It is the first log file that you should look when
    searching for errors or other information. It contains three types of messages:
    errors, warnings, and information. Syslog automatically keeps the last seven log
    files compressed. Use nano or tail /var/syslog


    +   2 /var/log/apache2

    The directory contains two log files that are related to the Apache server. The
    log records all requests processed by the apache web server. It is used for generating
    server statistics and diagnostic messages and errors that occurred while Apache
    was processing a HTTP request. If you have a problem with a website, look for
    information. Virtual domains usually save their own accesslog and errorlog files
    separately in their definition.


    +   3 /var/log/debug

    This file contains debugging and warning messages. Keep in mind that the kind
    of data written in each log file is defined by syslog settings. Syslog replaces
    and improves the original syslog service. Its configuration file is /etc/syslog.conf
    and you should have root permissions to make changes to it.


