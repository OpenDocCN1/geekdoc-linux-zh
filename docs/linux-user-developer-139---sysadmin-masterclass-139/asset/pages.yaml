  md: '# Tutorial


    # Get Started with Gulp.js


    # LinuxDeveloper


    with edit v4.0.0


    # Get started with Gulp.js


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_51_0.png)


    Explore the many benefits of using Gulp.js task runner in your web projects to
    help streamline your workflow and optimise your code


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_51_1.png)


    # Installing Gulp


    Node.js is a platform built on Chrome''s JavaScript runtime for easily building
    fast, scalable applications. Node.js uses an event-driven, non-blocking I/O model
    that highlights and is efficient, perfect for data-intensive real-time applications
    that run across distributed devices.


    # 01 Install Node


    Before you begin exploring Gulp.js, you will first need to satisfy the most important
    requirement, which is to install Node. Simply head over to node.js and download
    and install the application onto your development machine. This is all a very
    quick and painless process, taking no time at all.


    # 02 Install Gulp


    Once installed, you now have access to the Node Package Manager (npm), which we
    use to install Gulp as a global package on your system. With the terminal or command
    prompt window, use the git repository. github.com/gulp/gulp to install Gulp on
    your machine.


    # 03 Save the dependency


    Now you will need to create a package.json file within your project directory.
    A simple command has changed. If you are using npm from the terminal, you need
    to install gulp as a dependency for your project, which will update the package.json
    file for you.


    # 04 Ready to gulp


    After you have initialized and installed Gulp as a dependency, the reference to
    the dependency is also automatically added to the package.json file as a requirement.
    Any other user or development machine with shared access to this json file can
    install the same dependencies quickly and easily.


    # NODE JS ON THE ROAD


    The chances are quite high that in any web project, you deal with more than one
    CSS or JavaScript file. We have overheads when we use networks which can cause
    delays in delivering them to the user. They may also not be as optimized as they
    should be, perhaps leading to console errors or software glitches.


    Gulp is a free open source JavaScript task runner powered by Node.js, which has
    quickly gained traction in the web development community. Unlike existing task
    runners on the market, Gulp makes the process of building and automating tasks
    simpler.


    Using a task runner can make any of the CSS processors such as Sass or LESS to
    streamline how you write stylesheets, or as coffeescript for your JavaScript files.
    The task runner can compile these into the


    formats for daily. It can then iterate over your directories and combine pref
    files into one file, minifying it in the process, while keeping them unminified.


    The additional benefit of a task runner is that it can handle multiple files and
    only select tasks when a file or structure has changed. This reduces the necessity
    to run any task each time you edit.


    Let''s also add to ability to run your code validation and tests the file and
    now you should start to see the real power behind implementing a task runner journey.


    If you have some exposure to JavaScript, you can get started with Gulp.js in a
    matter of moments and add it to your projects. Let''s take a look at how it is
    to work and create your own task dependencies.


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_51_2.png)


