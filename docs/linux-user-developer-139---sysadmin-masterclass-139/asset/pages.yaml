  md: '# Tutorial an XLborg tilt controller


    # Build an XLborg tilt controller


    Use the accelerometer in PiBorg''s small and affordable XLborg device to turn
    your Pi into a game controller...


    +   - Python 2.7

    - [www.python.org/doc](http://www.python.org/doc)

    - PiBorg XLborg

    - [www.pborg.org/xlborg](http://www.pborg.org/xlborg)

    - Pygame

    - [www.pygame.org/docs](http://www.pygame.org/docs)


    If you saw last issue you might remember the Doodleib, a massive remote-controlled
    tank of vehicle movement and built by PiBorg, add-ons for the Raspberry Pi. This
    month we were looking at XLborg, a board to help you movement determine direction,
    and other things. At under $16, it''s a bargain too, featuring a three-axis accelerometer,
    it''s also equipped with a three-axis digital compass. tilt controller and mock
    up a simple demo to show how you could integrate it into your Pygame-powered games.


    01 Install the XLborg

    Installing the XLborg onto your Raspberry Pi couldn''t be easier. It simply sits
    directly over your GPIO pins and covers the board facing your Raspberry Pi. PiBorg
    has made the software inside an installation script that manages the process of
    installing the required drivers and libraries for your Pi.


    02 Download the software

    Download the directory for your projects in your home folder by typing: ~/xlborg,
    enter the directory (with ~/xlborg) and download the package with:


    ```

    git clone https://www.pborg.org/downloads/examples.zip

    unzip examples.zip

    make the install.sh script executable with chmod +x install.sh

    Finally, run ./install.sh and reboot your Pi once the installation has finished
    to initialise.

    ```


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_65_0.png)


    www.pborg.org


    03 Inspect and test the library

    Whenever you''re dealing with a new piece of hardware or a software library to
    abstract a particular process, it''s worth looking the library to see how it works.
    The XLborg library is XLborg.py and it contains well commented code that demonstrate
    the main functionality on the board. The library is easy to run to print the sensor
    results to the terminal. Run it with python XLborg from the terminal to ensure
    everything''s working. Move your Pi around to ensure the accelerometer reading
    changes correctly. See troubleshooting page at www.pborg.org/xlborg/troubleshoot


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_65_1.png)


    Above The XLborg is a tiny device that''s bigger than the Raspberry Pi''s GPIO
    pins


    Below The board features both a three-axis accelerometer and a three-axis magnetometer
    it can measure tilt and orientation


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_65_2.png)


    04 Start the script

    All well you''ll be seeing read-outs from XLborg.py when you move the Raspberry
    Pi around. Now we know how everything works, we can start your script


    www.linuxuser.co.uk'
