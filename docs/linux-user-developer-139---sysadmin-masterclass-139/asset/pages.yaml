    \ {\n        recording = false;\n\n        var clip = http.get(streamRL, function(response)\
    \ {\n          console.log('Listening to', this.showRadio, '.', this.name);\n\
    \          var fileName = this.dir + '/recordings/' + this.name + '.' + this.extension;\n\
    \          var wstream = fs.createWriteStream(fileName, {\n            mode: 0o666\n\
    \          });\n\n          this.showRecording = true;\n\n          response.on('data',\
    \ function(chunk) {\n            wstream.write(chunk);\n          });\n\n    \
    \      response.on('end', function() {\n            console.log('Finished listening\
    \ to', this.name, ', and preparing to convert:');\n            wstream.end();\n\
    \n            this.showRecording = false;\n            this.timerSet = false;\n\
    \n            var convert = spawn('ffmpeg', ['-i', fileName, extension, fileName\
    \ + fileName + '.mp3']);\n            convert.on('close', function(code) {\n \
    \         });\n        });\n      }\n    });\n  });\n```\n\n![](img/32a6be5c33a95bbca024ee8ba7c0a36e_42_0.png)"
