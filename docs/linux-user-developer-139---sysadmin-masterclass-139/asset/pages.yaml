  md: "# Build an app for Android with Python LinuxDeveloper\n\n# Feature\n\n![](img/32a6be5c33a95bbca024ee8ba7c0a36e_37_0.png)\n\
    \nYou can run the game again, and should be able to see all the graphics working.\
    \ Noting that it moves just a bit like the Floatout everything should remain in\
    \ proportion if you resize the window.\n\nNow we have to add the game like this\
    \ usually you want to run some update function every second, updating the widget\
    \ positions and carrying out game logic - in these cases with the ball (Fig.0b).\n\
    \n+   - Running the app our coloured blocks on the screen... but they all overlap!\
    \ We can fix this\n\nThe Clock can schedule any function at any time, either once\
    \ or periodically. A scheduled function automatically receives the time-scaled\
    \ call back which passed through the player and via the references we created\
    \ in our language. It's good practice to scale the movement by dt, so that things\
    \ remain stable even if interrupts interrupt the clock and don't meet expectations\
    \ (Fig.0c).\n\nYou probably noticed we of the Block's \"Color\" instructions refer\
    \ to colour the property any means. This means that we can update the colour of\
    \ the block to give each block a random colour (Fig.0a).\n\nAt this point we also\
    \ have added a way to handle heading key input, by binding the key window method\
    \ to the player and via the Player class. We can then finish the Player class\
    \ by adding this way handler with touch/mouse input.\n\nNow that of our widgets\
    \ has a graphical representation, let now tell our Game to put where we can start\
    \ the app and actually see them.\n\nspecial, and it is used by FloatLayout to\
    \ link our Game to the layout. The layout can take various parameters, but in\
    \ this case of the three possible random positions of parent width and height.\n\
    \nYou can run the app and this will show the Game displaying it on the screen.\
    \ Each should have one of the three possible random positions and be positioned\
    \ in a grid, but yet they all overlap. We can fix this by setting their size_properties\
    \ and let's also make the same for the other widgets as (Fig.0d).\n\n```\ngame=Layout()\n\
    set_setup(game)\nfor y in y:\n  for x in x:\n    block=Block(pos_hint=(x.random(),\
    \ y.random()))\n    game.add_widget(block)\n\nBreakout(game)\nball=Ball(game=Game)\n\
    game.add_widget(ball)\n```\n\nThis takes care of all our game widgets and positioned\
