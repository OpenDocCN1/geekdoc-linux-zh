  md: '# Create flowcharts with yEd


    # 10 Making decisions


    So far, processes worked in one line. Sadly, it is not as simple as this in real
    systems — usually, one or more decisions are recorded in order to achieve the
    final result. Flowcharts visualise this via the diamond-shaped element that is
    generally used as a ''node'' for design.


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_33_0.png)


    # 13 References


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_33_1.png)


    # 11 Entry points


    Processes tend to have one or more points. Analysis is simplified greatly if they
    are shown as part of the diagram. Entry points are visualised as the starting
    points and various vertices differ different shapes — the one on the left is more
    commonly used.


    > You should not attempt to squeeze large processes into one huge chart


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_33_2.png)


    accessed the layout menu. Laying engines will pop up with a dialog with extra
    settings for fine-tuning their behaviours. Fans of Japanese colouring gradients
    will be delighted to find ToolColor Graph offers a ready-made colour Graph to
    show the start and end of the gradient, which will be applied to your chart on
    click.


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_33_3.png)


    # 12 Termination points


    Some types of analysis require information about the end points of the process.
    Termination points should be highlighted with the corresponding symbol. It signifies
    that work ends at this particular point and should not be traversed.


    # 13 References for all


    You should not attempt to squeeze large processes instead, use the off-page reference
    to inform you that the work will continue on another page. Of course, don''t forget
    to add in another off-page reference in order to specify the point clearly as
    well.


    # 14 Add wires


    State transitions are shown with lines, which are created by edges. Defining a
    line is accomplished by clicking an element once, and dragging the mouse button
    out while the line is held. Then simply drop the mouse on the target element.


    # Fancy-looking charts


    Computer-aided flowcharting provides users with a large variety of options that
    can make charts look so much better. yEd will willingly rearrange your charts
    using a group of well-established algorithms. These can be


    # 16 More


    yEd creates direct connections by default — some layouts may modify them to become
    indirect if it is helpful to your internal operation. Curve and bezier edges are
    available — clicking one of them selects as default for new connections.


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_33_4.png)


    34 | linuxuser.co.uk'
