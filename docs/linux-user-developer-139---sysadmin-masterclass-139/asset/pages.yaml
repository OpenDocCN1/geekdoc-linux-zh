  md: '# FAQ What is the VideoCore graphics core stack?


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_69_0.png)


    # What is the VideoCore graphics core stack?


    # Broad and the Raspberry Pi Foundation opened new code for the Raspberry Pi –
    but why does this matter?


    One day I go around the Raspberry Pi website and I see the VideoCore graphics
    stack and There are multiple parts of this that I don''t understand. What is a
    graphics core, and is it like a graphics chip?


    In essence, the Raspberry Pi does not have as many processors as the SoC. Its
    architecture includes a lot of features on single chips. Hence the ''system''
    is part of the graphics core and the Raspberry Pi handles the graphical processing
    for the system.


    Okay, so the VideoCore is the brand name or model of something?


    Yes, it''s that the Raspberry chipset is used in the Raspberry Pi, though they
    were originally used in mobile phones. There are many types of VideoCore chips,
    however the one in the Raspberry Pi is known as BCM2835. The numbers are not all


    The name Broad sounds familiar, where might I have heard of it in relation to
    the PI?


    Well, it was supplied by the Raspberry Pi, and Eben Upton is an employee of Broadcom;
    he''s the main creator and a pretty prominent figure in the history of the Raspberry
    Foundation that backs and supports the PI.


    So is the Raspberry Pi Foundation part of Broadcom? No. While Eben Upton works
    for Broadcom and is a founder of the Raspberry Pi Foundation, the Foundation is
    an independent charity completely separate from Broadcom. They have a good relationship;
    they have an excellent deal on the chips that Eben''s invention


    Is there anything that''s particularly special about the VideoCore that they would
    use? Well it''s quite powerful, and has 1080p video decoding for high-quality
    content while still being relatively under-powered compared to similar PCs or
    systems.'
