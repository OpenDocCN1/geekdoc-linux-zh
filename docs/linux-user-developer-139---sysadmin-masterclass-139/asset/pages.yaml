    # TUTORIAL


    # 01 Understanding SonQube Architecture


    Before we get started with installation, let''s try and understand SonQube architecture
    and the various components. SonQube has three main components: the SonQube server,
    the database and the analyzer. The analyzer that actually interacts with your
    source code and data (note that there may be more than one analyzer invoked but
    later). The web-based frontend renders the results to you in a comprehensive format.
    These components work in close collaboration, making SonQube robust and scalable.
    It is even possible to install these components on different servers to balance
    load.


    # 02 Database Installation


    The first step during installation is to install the database. SonQube supports
    all the major databases out there, including MySQL, Oracle, PostgreSQL, and Microsoft
    SQL server. In this tutorial we will use MySQL. You can install the standalone
    version of MySQL or use the open source web hosting stack such as LAMP/MAMP/WAMP
    server (which approach may not be the best for enterprise installations due to
    performance issues, and we would prefer a dedicated SQL server in this case).
    Just make sure your MySQL is running. After the installation, you will need to
    configure the ''sonar.properties'' file to store the data generated by analyzers.


    # 03 SonQube Installation


    Next step is the web server. Once you have the package you downloaded from SonQube
    website and you''re to the ''sonar.properties'' file in the ''conf'' folder. Configure
    the connection to MySQL server, making sure all other connections are correct.
    Then, change the connection in the ''sonar.properties'' file to match your MySQL
    database name as the one you''ve created. Also, update the credentials for the
    user you created. With everything understood now, we are able to enable a connection
    between database and SonQube. You can choose to modify the values in properties
    file, but make sure the database connects to the changes.


