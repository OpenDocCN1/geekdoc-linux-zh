    \ 'wednesday', 'thursday', 'friday', 'saturday'],\n  checkingTime: undefined,\n\
    \  timeAllowance =\n};\n\nfunction recordShow(show) {\n  var this = show;\n\n\
    \  var playlist = http.request(this.playlist.url, function(res) {\n    var PLS\
    \ = '';\n\n    res.on('data', function(chunk) {\n      PLS += chunk;\n    });\n\
    \n    res.on('end', function() {\n      var streamRL = PLS.split('PLS ')[1];\n\
