  md: '# Tutorial Record slow-motion videos with the Raspberry Pi


    # Record slow-motion videos with the Raspberry Pi


    # The updated Raspberry Pi firmware to record slow-motion videos with the camera
    module


    # What you''ll need


    +   - Latest Raspberry image

    raspi.org/downloads

    - Raspberry Pi camera board

    - Internet connection


    The Raspberry Pi camera has been an interesting little add-on for the Raspberry
    Pi, allowing people to have better quality for projects that require picture and
    video. The functionality of the camera is always being enhanced and now we have
    a way to record slow-motion video. With this you can create clips as slow as 25
    fps with all the control as you have with the normal camera functions. At the
    time of writing, our Raspberry Pi Python module doesn''t allow the access to slow-motion
    functions.


    01 The firmware updater

    The first thing you need to do is sure you update the firmware on your Raspberry
    Pi. Boot into Raspberry and open the Terminal. To install the firmware updater,
    simply run the following command. For newer versions of Raspberry, it will likely
    be already installed.


    ```

    $ sudo apt-get install rpi-update

    ```


    # Slow-mo Learn how to record multiple types of slow-motion videos for yourself


    # Video player Allow your Raspberry Pi to play back the video to get the full
    effect


    # High frame rate Play it at normal speed for high frame rate video projects


