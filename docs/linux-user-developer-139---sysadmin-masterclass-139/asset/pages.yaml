    # STEP 2: Open or install Brasero


    Brasero is the most popular open source-

    disc. If it''s not already installed on

    y, locate it in your repository and

    install it. Open the project and select ''Burn''

    image from the Projects tab on the left.


    # STEP 3: Burn your disc image


    On the Imaging Burn Setup-menu, click the first

    box - ''Click here to select a disc image'' -

    and navigate to the ISO you just on your hard

    drive. Once selected, ensure you''ve got a CD or DVD

    writable disc inserted and click ''Create image''.'
