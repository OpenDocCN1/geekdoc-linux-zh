  md: '# Aber SailBot


    # The autonomous Raspberry Pi-powered

    yacht built by British students from

    ates worldwide


    +   - How did you get into making and racing autonomous sailboats?

    - Dan Clark: it was the opportunity to work with robotics that attracted me to
    it and then when the opportunity came to have a chance to build something like
    this, I jumped at the chance.


    +   - Louis Taylor: The department does a lot of research into autonomous sailing
    and we actually build something for the IRS (International Robotics SailBot) competition.


    +   - Which competitions have you been in so far with Aber SailBot?

    - Dan Clark: Last summer we joined SailBot 2013, which was in Massachusetts, USA.
    We then entered the Raspberry Pi Championship, which was held in the North of
    France. This year, we are going to do some more competitions again, but in different
    places.


    +   - Louis Taylor: Our first year was in SailBot 2014, in California, USA, and
    next year the Raspberry Pi Championship is in Ireland, Galway.


    +   - Are you particularly looking forward to one over the other?

    - LT: I think we still have a lot of work to finish. We want to learn more about
    the Raspberry Academy by the first few points [to place].


    +   - What chose you the Raspberry Pi as a way to power your SailBot?

    - LT: We needed some sorts of hardware for the boat to be somewhat low to fit
    inside the boat. We wanted the freedom to choose pretty much any technology we
    wanted. Raspberry Pi lets us do that because it''s running a full Linux operating
    system. I mean we could develop software on


    Linux laptops, debug on the laptop and then put it on the Pi and it would work
    instantly. Essentially we wanted something powerful but simple for electronics.


    DC: We already know how to use it, so it saved us from learning anything that''s
    particularly new.


    Had you used the Raspberry Pi as electronics before the Aber SailBot?

    - LT: Yes, we used it on the Beagleboard,


    The Raspberry Pi is one of the reasons for the SailBot, what did that come about?

    - LT: Last year we went to Cambridge to meet the Raspberry Pi Jam, where we met
    the founding members of the Raspberry Pi Foundation - there was us and our team
    who needed some money and some help to get to the end till we found the Foundation.


    DC: At that point we were uncertain about whether we could actually go the competition
    or not. We didn''t have enough money to get ourselves out to Boston. With so much,
    we were not sure what to do. We had a boat that worked, but mostly.


    You''re working on a special version of the SailBot, will it be ready for the
    competitions this year?

    - LT: Yes, at the moment, we''ve been working on the hardware and other work we''ve
    done for a few months. Now it is finishing, and we have to do some real work on
    the boat. So essentially we''re going to work full-time over the next couple of
    weeks.


    DC: Will it be ready to sail, at least partially in the next two weeks?

    - LT: At this point we can stop doing hardware and focus more on the electronics.


    Once the second iteration of the SailBot is complete, what will be the fate of
    the project?

    - DC: It''s a research project to an extent. We had a few ideas of scientific
    papers we would like to write, and that would help us to implement the experiments
    we need to do.


    - Also we have two plans for our software, because the electronics and control
    systems in them are almost identical. We will use the same code for both boats
    and until so we can use it for one or the other.


    What else have you hoping for the Raspberry Pi for?

    - LT: We are still working on the team, so it was a little thing to pick up and
    use video to finish the design. We''re thinking about doing another similar project,
    maybe a Raspberry Pi project.


    Do you have any other projects you want to do in the future for the Raspberry
    Pi related?

    - DC: For a long time we wanted to do a quadcopter that''s Raspberry-powered.


    Finally, what''s your current state in sponsorship?

    - LT: We are actively looking for sponsorship; our current main sponsors are QinetQ,
    ARM and Kano computing, but we still need you. For more information on how to
    sponsor us visit the Aber SailBot website.


    Dan Clark, a first-year student at Aetherbury is studying computer science with
    artificial intelligence


    Louis Taylor is a first-year student studying physics and artificial intelligence,
    first year totals


    Like it! We are interested in the autonomous sailboats. Dawn Robotics for Raspberry
    Pi dawnrobotics.com


    Further reading: To learn about Aber SailBot visit our website at www.abersail.com'
