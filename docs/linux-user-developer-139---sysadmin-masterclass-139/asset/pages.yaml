    # gulp-sass


    www.npmjs.com/gulp-sass

    This plugin will convert your Syntactically Awesome Stylesheets into processed
    CSS files. Combined with the task, your files can be interpreted as they have
    been updated or altered with error callback methods that can be built into the
    workflow process.


    # gulp-imagemin


    www.npmjs.com/gulp-imagemin

    Images and digital assets can be too large network resources, the cause of slow
