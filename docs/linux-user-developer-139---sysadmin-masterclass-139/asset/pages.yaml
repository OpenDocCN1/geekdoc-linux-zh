    13 Camera modes

    While you can use the monitor mode for keeping an eye on a location, it''s not
    particularly good for proper surveillance. Mark your camera and click Edit to
    open up the Monitor configuration and find the drop-down function list.


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_29_3.png)


    12 Preview camera

    You can preview what the camera sees by clicking on its name in the main interface.
    This will launch a pop-up with an image of the camera is currently pointed at;
    at least you may


    15 Play back events

    ZoneMinder keeps data in images; there''s video only a series of images that will
    make up a video once. The monitor interface changes when set to record or motion
    detection, with the fully property record and viewing. The detection events events
    you in a separate pop-up window, skipping between each event and playing them
    by frame.


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_29_4.png)


    14 Record difference

    There are multiple modes that ZoneMinder uses for viewing and recording.


    16 Networked cameras

    USB cameras are nice and easy to set, they''re not specifically practical for
    a surveillance-level operations. ZoneMinder supports specific networked cameras
    though, which are listed in the wiki we linked to the resources. These can be
    connected similarly to the normal cameras are.


    > It''s compatible with a range of devices and doesn''t require you to change
    physical media with being stored


