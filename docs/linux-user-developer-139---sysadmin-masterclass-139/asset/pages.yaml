    \ it. With this, we can add new shows whenever we like and leave Node to work\
    \ out what to do by editing our JSON file.\n\n#  03 Timing\n\nTo keep Douglas\
    \ Adams in an illusion, lunchtime double so. When dealing with timed events in\
    \ computing, it's always better to extend functions without adding new ones, as\
    \ that can get messy, so let's instead take each day as it comes. The function\
    \ checkTimes is what we'll use. It's a list of five times that we record after\
    \ we load the JSON file. Its job is to take the defined times, compare them against\
    \ the current system time and decide whether or not we should be recording or\
    \ not.\nnYou'll notice that we can also use the (getDay) method to determine the\
    \ day of the week, but instead we'll reference an array days using the index of\
    \ getDay(0). This allows us to determine the days in our JSON file\n\n# archiver.js\n\
    \n# On the disc\n\n```\nvar http = require('http');\nvar fs = require('fs');\n\
    var spawn = require('child_process').spawn;\n\nfunction millis(milliseconds) {\n\
