  md: '# Your view

    Ubuntu phones, Raspberry Pi, Ubuntu 14.04 beta 2


    # LETTERS


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_94_0.png)


    # Android Magazine


    With more and more Android features being merged back into the kernel, it''s becoming
    easier to develop for one of the most popular operating systems around. With 25
    billion app downloads, and over 100 million Android devices, there''s a wide variety
    of folks ready to consume apps. For a more Android driven approach check out our
    sister mag Android Magazine, the publication dedicated to the platform. With news
    and reviews to keep you up to date on everything else as well as tutorials on
    developing and hacking your hardware. Find out more at www.littleregreenrobot.co.uk


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_94_1.png)


    The Software Center in Ubuntu could still use some improvements


    # Ubuntu


    Few changes have been made to Ubuntu 14.04 beta 2, although the users may only
    notice changes in the interface. For example, you can now change the size of icons
    in the Launcher without losing the menus, giving users more space on the desktop.
    This is not a big change. Ubuntu Software Center still has issues encountering
    the same problem as many versions in the past. Sometimes it freezes when trying
    to fetch software packages and in some cases you need to start from the beginning.
    Every way, once a user has installed all the applications, you dont to use it
    every day and expect nothing.


    to have been further promoted the content in it. We think our Ubuntu will be the
    best one for a while, though without any ill-advised new features and a much better
    focus on stability.


    In my opinion, the full version of Ubuntu 14.04 LTS will be like Ubuntu 10.10
    from many years ago. It doesn''t seem to change that much.


    It''s excellent that the Raspberry Pi Foundation is taking its extra money and
    giving it to schools around the world. We know if the Raspberry Pi has sold more
    than the expected, but it''s great to see the reach of their education mission.


    # Education Pi


    Jake Long


    The Raspberry Pi Foundation has always said that the Pi has sold beyond their
    initial expectations, and they''ve been


    +   Get funding to help children up to 18 years old how to use the Raspberry Pi


    using the money to foster and increase awareness of the Pi. Its missions are currently
    for folks with a good education proposal, and they are making children of every
    age of 18. They''re not limiting it to computing, so as long as you''re teaching
    kids you can make use of the tool.


    As you''ve pointed out these some are very minor changes, and mainly to the interface.
    We share your concerns with the software centre though, especially as the main
    changes made to it since its inception


