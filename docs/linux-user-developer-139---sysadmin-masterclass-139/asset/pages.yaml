  md: "# # Build an Xbox tilt controller\n\n![](img/32a6be5c33a95bbca024ee8ba7c0a36e_66_0.png)\n\
    \nwith the core XAlgo functionality. Open new text editor file and save as xalgo_app.py.\
    \ We first need to initialise the XAlgo in our script with XAlgo.Init().\n\nto\
    \ suppress the print function to save using through terminal with new line:\n\n\
    +   - XAlgo.optimum = XAlgo.NoPrint\n\nAll we do need to create a variable that\
    \ will catch the accelerometer readings. We will do this with the following line:\n\
