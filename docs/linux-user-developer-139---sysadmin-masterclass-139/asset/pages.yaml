  md: '# Review


    # Cubieboard 2


    +   - Two full-power USB 2.0 ports are broken out as standard, along with a USB
    OTG port near the Ethernet connector


    +   - The Cubieboard''s stand out feature is a SATA 2.0 connector, complete with
    5V header and bundled power and data cable


    +   - A dual-core AllWinner A20 ARM Cortex-A7 gives the Cubieboard 2 a lot of
    power


    +   - With a total of 1GB of DDR3 RAM, it''s clear the board is designed to outclass
    the Raspberry Pi


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_77_0.png)


    # MINI PC


    # Cubieboard 2 £52.95 /$99


    With a dual-core processor, SATA connectivity and plenty of GPIO, the Cubieboard
    2 Raspberry Pi killer is positioned to be?


    The Cubieboard was originally introduced as a Raspberry Pi competitor in September
    2012 as a limited production run. A follow-up design improves the original AllWinner
    A20, a dual-core Cortex-A7 chip board launched mid-way through last year, the
    board had been hard to come in the UK - an issue now resolved thanks to a distribution
    partnership between Cubieboard and low-power computing.


    Flipping the board reveals a pair of dual-inline 48-pin male headers, playing
    host to the Cubieboard''s GPIO connectivity and including everything from I2C
    and SPDIF digital audio to digital and video outputs as well. The board has HDMI
    support and often have impressive features but fall short on the software side.


    Unpacking the Cubieboard 2, it''s easy to see how it improves on the Pi. With
    a non-identical footprint, the board packs in considerably more ports: two USB
    2.0-On-the-Go (OTG) ports, a 10/100Mbps Ethernet connector, an on-board ifra receiver,
    input and output jacks for audio, an HDMI connector, and more impressively, a
    SATA 2.0 connector and 5V header capable of driving a 2.5-inch drive with speeds
    up to 3 GB/s.


    The board also falls short on the 8GB of NAND flash storage. The Cubieboard''s
    OS includes a microSD card slot, with MicroSD Adobe Flash support and other tweaks
    that suggest the board would make an excellent smart TV-top box.


    Sadly, there are some glitches to find here. A large sub-set of the software available
    on Google Play wont install on the Cubieboard due to compatibility issues, which


    78 www.linuxuser.com'
