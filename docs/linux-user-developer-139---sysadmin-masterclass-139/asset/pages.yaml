    Always be nice to people - especially developers - and run tests on a development
    machine before you deploy anything. Most important of all, though never make changes
    to a production server on Friday afternoon after your weekend!


    **Which is the most important piece of advice you can give me?**

    Get the fundamentals right and everything. Don''t try to cover every detail until
    you build a new system or put a new practice in place, nail the basics and the
    rest follow.


    **What is IPv6?**

    IPv6 was developed by IETF (Internet Engineering Task Force) and its purpose is
    to solve the forthcoming problem of IPv4 exhaustion. It uses 128-bit addresses,
    offering more than 3x10^38 times as many as IPv4.


