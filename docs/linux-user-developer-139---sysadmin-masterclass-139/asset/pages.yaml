    # TCP/IP


    TCP/IP is a family of protocols that helps the internet operate. From the name
    TCP/IP comes most well-known, TCP and IP stands for Transmission Control Protocol;
    its main characteristic is that it is a reliable protocol, which makes that it
    ensures the delivery of each packet. IP stands for Internet Protocol. The main
    characteristic of IP is that it is not a reliable protocol, which allows program
    applications to use IP by their own error-checking code.


    Every IP network has an IP address to link to its local network, it needs a network
    mask (subnet) and one or more servers (for translating an IP address to a human-readable
    format) to communicate with devices beyond your local network, the IP of a device
    that acts as the default gateway the network device sends a packet when it does
    not know, where to send it.


    # Databases


    Databases are everywhere and it is a big advantage for an SA to understand them.
    The two popular kinds of databases are relational and NoSQL. Relational databases
    store their data in tables that are defined and organised according to relational
    modeling. SQL database query language features of a schema of a relational database
    is not designed NoSQL is designed for the web and flexible data structures, like
    JSON components in popular NoSQL databases.


    You may wonder why you might use NoSQL database as MongoDB instead of a traditional
    DBMS like MySQL Oracle or PostgreSQL is generally better for data that changes
    frequently, where the schema might change as well. NoSQL offers more flexibility.


    Creating a database usually involves many tasks including installation, backup
    and restore, optimisation, replication user management. An SA can be turned into
    a database administrator SA starting with MySQL.


