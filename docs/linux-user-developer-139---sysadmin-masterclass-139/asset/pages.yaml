  md: "# Callback hell\n\nJavaScript is asynchronous in its execution.\nThis aspect\
    \ of the language makes it great for handling operations that require to be executed\
    \ independent of one another at the same time and not interfere with other variables,\
    \ yet use a set of common patterns. However, as programs get larger, we end up\
    \ with callbacks, callbacks calling callbacks, making the thing rather messy.\n\
    So, what can we do about it? We could try to make use of Node's synchronous methods\
    \ and have everything in an order that aspect to minimize the necessity for callbacks\
    \ (like what you'd write with Python) but do so cheats off the usefulness of Node's\
    \ asynchronous nature; or we write our programs with modularity in mind, so that\
    \ each function is made of smaller functions that execute individually; we can\
    \ reduce the number of callbacks to have to maintain, while keeping the app async\
    \ in its nature.\n\n```\nconsole.log(\"Conversion of \" + thisShow.name + \" complete.\"\
    );\nfs.unlink(fileName, function(err) {\n  if(err) {\n    console.log(err);\n\
    \  }\n});\n});\nsetTimeout(function() {\n  clip.alert();\n  minToMillis(thisShow.duration)\
    \ + (minToMillis(thisShowTolerance) *= 3));\n  clip.end();\n});\n\\});\n```\n\n\
    chunk (a buffer) we received added to the PL variable, building up the request\
