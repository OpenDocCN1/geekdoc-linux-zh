  md: '# Create flowcharts with yEd


    Communicate information about how processes work with ease


    # TUTORIAL


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_34_0.png)


    # 17 Select multiple elements


    Groups of flowchart elements can be made to relate to one another. This by using
    group selection. Simply hold the left mouse button and drag the pointer to ''open
    a selection rectangle. All elements inside will be selected when the mouse button
    is released.


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_34_1.png)


    # 22 View charts options


    yEd is ideal for Unix, Windows, Mac OS and other java-capable systems. Most web
    browsers can launch a version of the product too, just visit the download page
    and click the ''Launch'' button to get started.


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_34_2.png)


    # 20 UML to go


    Flowcharts are ideal for small and medium-sized processes. Very large systems
    can be represented by this compact element introduced in UML notation. yEd supports
    them via a special tool panel that can be accessed from the element pane via the
    UML header.


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_34_3.png)


    # 23 Export charts


    Finished charts should be exported to a common format. This is achieved by clicking
    File/Export. yEd will pop up a dialog permitting you to select the file format
    and name. After that, you will be required to enter a sequence number.


    # 18 Align elements


    Once elements are selected, yEd can arrange them to connect to one another automatically.
    The tools found in Edit>Align elements should not be unhappy with results, rest
    assured that they can be undone by pressing Ctrl+Z at any time.


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_34_4.png)


    # 24 Print a chart


    It is easier if the materials are available on paper. Click the small Print icon
    to enable you to create charts made up of multiple pages that are logged together.
    The mode can be selected by entering a number into any of the ''Poster'' fields.


    # 19 Lock your views


    By lock your flowchart will be displayed in a medium zoom mode that is like any
    other dialog. Click the Save and Load icons in the toolbar to open the relevant
    dialog, yEd''s native file format goes by the name of graphis, and should be used
    for storing charts that


    # 21 Save charts


    Flowcharts can be saved and loaded like any other document. Click the Save and
    Load icons in the toolbar to open the relevant dialog, yEd''s native file format
    goes by the name of graphis, and should be used for storing charts that will be
    edited again at a later date.


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_34_5.png)


