    ## REVIEW


    ### Jitsi

    More than just a VoIP client, Jitsi can handle all of your instant messaging as
    well.


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_74_0.png)


    The options in Jitsi cover a wider variety of ways to customise your experience.


    ### Interface

    A pretty standard interface really, Jitsi is not particularly aesthetically pleasing
    but the job and logic is wisely laid out. Codes are listed in traditional fashion
    with little group to manage them, and the menu system is fairly straightforward,
    having been labelled well. It is very plain though but that''s a hard thing to
    find.


    ### Customizability

    Jitsi is highly customizable, with options for just about every facet of the software—either
    editing the way the actual VoIP and the connections work, behaviour and chat,
    it is really easy to get it working exactly as you want with in-depth menu system.


    ### Codecs

    Like Ekiga, Jitsi has a huge list of codecs and a handful of videos to make sure
    you can call the VoIP services in perfect needs. These are easily changeable,
    although you''ll have to dig into them.


    ### Extras

    One of the major features of Jitsi is that as well as SIP server connections,
    it can also connect to many services such as XMPP, Facebook and Google Hangouts.
    It also supports video and audio XMPP, making the extra out a bit more flexible
    and generally more.


    ### Overall

    Jitsi is really quite excellent, with effortlessly focusing on the areas that
    need the most work, while items as the interface is not overdeveloped, resulting
    in good balance of function and usability.


    ## QuteCom

    With development seemingly stalled, this is relatively old old software able to
    stand up to the newer offerings?


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_74_1.png)


    There are few codecs available in QuteCom, but otherwise customised is pretty
    high.


    ### Interface

    The QuteCom name is a bit of a giveaway to the framework it''s written in, and
    design of it is quite a KDE interface. In fact, it has possibly the nicest interface
    of any app here. It''s useful, simple and looks like a professional VoIP client.


    ### Customizability

    QuteCom has a decent selection of customise options for the interface, chat and
    functions of the software. Each section is itself flexible, advanced, with an
    entirely dedicated make to sure that rookies don''t kick the wrong box when trying
    something something.


    ### Codecs

    The smallest selection of codecs available in QuteCom. This could probably be
    adding a few more options to the list. However its status in development means
    that they never happens. There is at least a major codec, so you can do some of
    tweaking and optimisation.


    ### Extras

    Qute has nothing more than the VoIP options, no extra IMs or the Ekiga-style account.
    It has a profile for each account set up, this adds a bit to the functionality
    of the overall. Hopefully if development pick up again, something is interesed.


    ### Overall

    Qute isn''t as well as the other apps as we first expected, it is lacking in customizability,
    codecs and extras which means it doesn''t really stand out from the rest of the
    crowd.


