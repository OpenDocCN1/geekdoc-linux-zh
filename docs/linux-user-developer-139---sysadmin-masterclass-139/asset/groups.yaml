    # Create flowcharts with yEd


    Communicate information about how processes work with ease


    # TUTORIAL


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_32_0.png)


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_32_1.png)


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_32_2.png)


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_32_3.png)


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_32_4.png)


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_32_5.png)


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_32_6.png)


    # 01 Download yEd


    yEd is a semi-commercial product. Because of this, it is not included in most
    distribution repositories and must be obtained manually. This can be done easily
    by visiting the URL www.yworks.com/en/products/yed_download and then clicking
    the link labelled ''yEd for Linux''.


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_32_7.png)


    # 04 Getting started


    32-bit_setup_all.run -install time to


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_32_8.png)


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_32_9.png)


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_32_10.png)


    # 05 Representing work steps


    Processes can be represented when they are broken down into individual works.
    Each of these is displayed as a rectangular box. These can be found in the drawer
    of yEd. Use drag and drop order to bring the element into your document.


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_32_11.png)


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_32_12.png)


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_32_13.png)


    # 02 Install yEd


    Your browser will download a file called ''yEd-3.1.2_32-bit_setup.sh''. It must
    be marked as executable by adding the necessary attributes via chmod +x. After,
    execute it by entering ''./yEd-3.1.2_32-bit_setup.sh'' on a command line to start
    the actual wizard.


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_32_12.png)


    # 08 Abstract processes


    One of the most common criticisms against diagrams of this type is information
    overload caused by having too many details. This can be adjusted by introducing
    an abstract process element: it represents a complex process where internal details
    currently are not important.


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_32_15.png)


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_32_16.png)


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_32_17.png)


    # 06 Adjust object properties


    Click an object to select it. The property window on the bottom-right side of
    the screen will display its attributes. All elements have a Text property, which
    can be changed to modify the text that is displayed on top of the component.


    # 03 Start yEd


    Leave all settings as they are and click ''Next'' to complete the installation.
    The icon can be accessed by selecting ''yEd'' from the Ubuntu desktop. Its blue
    symbol is likely to appear fuzzy on high-resolution displays. Click the symbol
    to start it.


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_32_16.png)


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_32_17.png)


    # 04 Getting started continued


    After yEd starts, it will display its ''Getting started'' wizard. It permits you
    to open existing files and can be used to create a new document. Click ''New''
    to start working on your new flowchart - the program will morph into the figure
    shown at the top of.


    # 07 Add more elements


    Flowcharts will obviously consist of more than one object, simply drag in elements
    from the toolbar on the right-hand side. Controls can be dragged along a large
    variety of ''helpers'' that are displayed automatically.


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_32_20.png)


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_32_21.png)


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_32_22.png)


    # 09 Collect Input


    Some processes should be highlighted using a special symbol, designating an operation
    that cannot be completed without input. You can use the ''input'' box in the flowchart
    component list, simply drag and drop to add it into your form.


    33 www.linux.co.uk'
