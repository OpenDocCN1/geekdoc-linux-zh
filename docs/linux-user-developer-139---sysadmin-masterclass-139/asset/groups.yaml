    > 模仿微软对选择的“消除”可能会对我们的社区造成损害


    - 社区的另一部分观点认为这是同样的——“消除选择”正成为微软、苹果和 Google 等大公司日益要求的重点，作为他们的焦点，而我们也正试图模仿他们的方法。


    FerD:


    在 Linux User，我们会发表一篇名为《Linux 用户的万物理论》的文章。我认为正如我们所见，有理由认为 Gnome Shell 正被项目中的一些具有影响力的成员驱动，以消除选择为目的。一些像
    William Mcann 和 Day 这样优秀的项目领导者用他们自己的话来说，他们在对“品牌呈现”和“一致的视觉外观”发表意见时，拒绝了关于用户定制化和恢复功能的请求，或在讨论中表示异议，当涉及到他们认为“没必要”或“对
    [Gnome Shell] 身份极端有害”的事情时。而 KDE 和 Ubuntu 则因此变得与众不同甚至更好。当然，你可以辩称这是一种通过“以彼还彼”来与微软和苹果竞争操作系统市场的尝试，但如果这是由公司驱动的，而不是由日益限制的操作系统选择驱动，那么没有人是真正的赢家。


    幸运的是，Mcann 和 Day 不像第一个 Gnome 项目那样，他们克服了阻碍。Gnome 项目现在正朝着一个主要限于 St Shell 以及少数其他成员的方向发展。我相信他们的强硬手段可能已经推远了许多持不同意见的同事，但我们需要
    Linux 社区的用户——来确保这些力量存在，并且实际上在塑造任何主流发行版“Linux 操作系统”安装的软件项目和核心社区中，占据权力和影响力地位。硬件的寒冬远不是我们面临的最大威胁。


