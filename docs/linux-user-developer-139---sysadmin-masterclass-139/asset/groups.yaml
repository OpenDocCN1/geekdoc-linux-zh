  - '[PAGE 2]


    # Welcome


    # to 139 of Linux User & Developer


    # Get cheaper every issue


    Rob Zetsloot studied at university, using Python to model complex simulations
    in class. After a brief stint in a padded cell, he moved on to create a CCTV system,
    which tests Valgrind registrations and tables through the events from our Linux
    User Raspberry Pi.


    +   >> Build apps for Android

    >> Create FOSS flow charts

    >> Make your own CCTV system

    >> Become a system administrator


    Tom Hanna has been in the business since before. Serving as a journalist, tutor,
    speaker and author he has seen every aspect of mobile era evolve firsthand. This
    issue shows us how to make key flowcharts using the excellent Inkscape-based tool.


    Alexander Tyler is a graduate in Physics, but spends his time mastering Python
    cross-platform framework, Kivy. He is also a contributor to InKivy at tutorkivy.net.
    Incoding feature charts – it’s essential reading.


    Sean Tracy is a creative technologist at least right living on the south coast.
    He spends a lot of time living with Linux, Raspberry Pi and Arduino. Sean brings
    another excellent project to the table. On pages 44-47, this issue shows how to
    build an internet radio stream recorder and decoder.


    Jon Masters is a kernel developer who has been working for Linux for 18 years,
    since he graduated university at the age of 13. Jon joins us in Manchester, where
    he works for a large enterprise venture. You can find his interview in Column
    on pages 16-17.


    Gareth Halfreep is our resident expert and brings us the latest developments from
    all over the open world. On page 10, Gareth is our chief editor who reviews Kububind
    2 and Firewall Control & Dispatch (from page 78).


    Welcome to the latest edition of Linux User, and the UK’s favourite open source
    Linux magazine.


    I still haven''t decided what I want to do when I grow up, but I''m committed
    to computers at a very early age. Technology has been exposed since I was a lad,
    so there''s no better sense of time to focus on a career in tech.


    Starting with new and exciting trends is half the battle to stay on top of the
    technology. We explore many of the skills, tools and rules of the role and it
    should help you decide if you''ve got what takes.


    Keeping up with new and exciting trends is hard. Python is still growing exponentially
    in popularity and no programmer worth can afford to have it missing from their


    One of the best things to happen to Python lately is Kivy, the framework making
    programming for iOS and Android easier than before. Alexander Tyler shows how
    to make an Android app and deploy it to Google Play starting on page 36. Forget
    presenting the next reality – it’s all about coding the next Flappy Bird. Minecraft
    these...


    > Russell Burns, Editor


    # Get in touch with the team:

    luxuser@imagine-publishing.com


    Facebook: Linux User & Developer


    Twitter: @linuxuserimageshopco.uk


    Buy online


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_2_0.png)


    Visit us for more news, opinions, tutorials and reviews:


    # www.linuxuser.co.uk


    Issue 139'
