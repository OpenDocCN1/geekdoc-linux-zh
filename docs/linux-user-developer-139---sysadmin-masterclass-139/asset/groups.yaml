    # 视频播放器、游戏和其他发行版正利用此为树莓派优化软件


    ## 预期内容


    VideoCore 开放了哪些内容？


    实际的项文档以及配套的堆栈。这让开发者能够完全访问 ARM。与 VideoCore 的所有通信都是通过一个充当驱动程序的代码二进制块（blob）完成的；而这是可以被有效地绕过的。


    这并不是原本这么设计的。在过去的 18 个月里，更多的硬件被开放了，社区对这些 VideoCore 文档的需求非常迫切。它使用了开源发行版。


    这些应用程序可以利用驱动程序来提高它们的性能。


    这意味着 VideoCore 的驱动程序是开源的吗？


    不完全是，因为它并没有以这种方式使用驱动程序。二进制块是一个源码驱动程序，Linux 内核通过与之通信来访问 VideoCore。


    好的，所以堆栈现在开放了，我们可以使用它们。


    为了给树莓派创建驱动程序，其他暂停了 Android 树莓派移植的开发者被鼓励再次开启这些途径。现在，视频播放器、游戏等可以使用它为树莓派优化软件。XBMC
    在其代码库中考虑了树莓派，在不久的将来在树莓派上的运行效果会好得多。


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_70_0.png)


    # Quake 竞技


    为什么二进制块没有开源？


    二进制块非常局限，树莓派通过为它开发适当的驱动程序会得到更好的服务。


    那么我们为什么想要它呢？


    硬件可以看到 VideoCore 的工作原理以及它是如何使用数据的，从而允许开发开源驱动程序。这意味着驱动程序和操作系统为 VideoCore 做得更好。


    > 我觉得，这些听起来都很有趣，这是值得研究的吗？


    你在这件事上搞错了，视频播放器和移植版永远不需要触碰——这并不是重点，但正如下所示，从长远来看这对树莓派的体验将非常有帮助。


    # Android


    为什么你们不为所有硬件都做这个？


    在没有完成所有硬件的情况下，你能做的优化非常有限，而且优化是非常耗时的。你无法获得如今这种驱动程序类型和组合，而这原本是驱动程序的大部分好处。


    # 我们距离使用开源驱动程序还有多远？


    好消息，驱动程序基本上已经创建完成，并发布了用于它们的的自定义内核。这是由树莓派基金会促的，他们为第一个在树莓派上运行 Quake 的人设立了 10,000
    美元的奖励。要实现这一点，你需要将代码发布到树莓派并创建一个用于全开源项目的自定义内核。获者 Simon Hall 仅用一个月就完成了。


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_70_1.png)


    在 18 个月前，我们在树莓派上推出了 Razroid。这项将 Android 移植到树莓派的雄心勃勃的任务非常，但如果没有对 VideoCore 的访问权限，它只能止于此。也许这将是最后一个持久的项目，因为我们能够制作出更好的树莓派移植版。


    # XBMC


    媒体中心软件在树莓派上一直运行良好，但始终有改进和优化的空间。例如，界面的卡顿可能会解决，整个系统的加载速度可以更快。


    树莓派是开源的，对吧？为什么图形堆栈不是？


    树莓派并不是专门的开源的，至少它是。


