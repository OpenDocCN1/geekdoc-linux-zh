    # FAQ: Updating andistribution


    Q: How can I update my distro?

    A: Some distributions include a version updater as Ubuntu. They will usually prompt
    you when an update is available, where it will update while keeping your files
    and settings. Others do not process this, so you''ll need to backup your files
    and install the version of the distro.


    Q: I''m on an LTS and the upgrade prompt is not showing?

    A: Open the Manager and click Settings. Go to the Updates tab and look for the
    entry with ''Notify me of a new Ubuntu version'' and change it to ''Any new version''.


    Q: Am I able to downgrade to a previous version?

    A: Not really, it would be dangerous to actually try to downgrade the packages
    back to a prior state. The best solution is to perform a full backup in case you
    need to.


