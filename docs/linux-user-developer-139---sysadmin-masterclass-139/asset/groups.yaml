    ## 两个 48 针 GPIO 引脚引出了 A20 芯片几乎所有的功能


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_78_1.png)


    性能不错的 Mali-400 显卡表现非常出色，并且对替代系统提供了充分的支持。


    Allwinner A20 是一款 ARM7 处理器，比树莓派 ARM BCM2835 旧一代，因此任何兼容 ARM 的发行版都可以安装在 Cubiedboard
    上。


    值得注意的是，我们使用 Cubiedboard 测试了我们的 ARM 优先级。


    使用 Cubiedboard 各种发行版——为了评测目的，我们制作了一个受树莓派启发的 Debian——感谢。


    双核处理器对于保持系统响应非常出色，并对多线程应用程序有巨大影响：更快的处理器能够在一半时间内压缩大型 zip 文件，而通过使用更强大的感知 gpio 应用程序跨
    CPU 核心运行该操作，这一时间可以缩短到四分之一。


    将 Cubiedboard 作为通用计算机是完全可能的。它的性能比市售的树莓派更接近普通桌面级。承认 Cubiedboard 的 PCB，但这种布局有助于在完成的项目中隐藏电缆——尤其是与许多其他可用外壳配合时。


    ## 同样考虑


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_78_2.png)


    A20-OLinuX-Micro-4GB（约 55 英镑）


    这是一个功能齐全的设计，OLinuX-Micro 使用与 Cubiedboard 相同的 Allwinner A20 芯片，具有更多功能，如双频 WiFi、LED
    控制器、160 个 GPIO 引脚和噪声屏蔽外壳。访问 olinux.com。


    它的价格是便价 Pi 的两倍，但实际性能大约是四倍，且连接性强得多，是一项值得的投资。


    Cubiedboard 的唯一缺点是 GPIO 引脚位于底部，而不是像 Pi 那样位于顶部。


    ## 总结


    尽管原生 Android 安装非常轻松，但 Cubiedboard 2 是一个非常有适应性的平台。处理器兼容——且在某些情况下，通过速度 SATA 存储连接的非
    Linux 系统的测试性能无疑极快。对于那些已经用习惯树莓派的人来说，这是一个逻辑上的升级。


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_78_3.png)


    树莓派

    约 35 英镑，一个相当低成本的 ARM 板板。树莓派的价格是 Cubiedboard 的一半左右，但它在某些方面做了缩减。它无法完全比拟 Allwinner
    A20，但提供了标准的连接性。raspberrypi.org


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_78_4.png)


    更多信息

    cubiedboard.org


    79 | www.linuxuser.co.uk


    # PiFace & Display


    板载红外意味着它可以用于几乎任何远程控制项目。


    三路导航按钮是基于菜单项目的极佳输入。


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_79_0.png)


    底部的五个按钮完成了输入选项。


    大型 16x2 数字 LCD 占据了 PiFace & Display 的正面


    # 硬件

    # 22 英镑


    树莓派是嵌入式设计的理想设备，从键盘和显示器控制它可能很困难。


    + 优点

    极其轻松地访问目录


    + 缺点比零件更贵，且缺乏 TFT 替代方案


    由曼彻斯特大学的研究员 Andrew Robinson 领导的团队设计，PiFace & Display 显示了它的意义：它为用户提供了输出的灵活性，这种位图显示非常愉快。


    设备背后的团队努力开发了一系列用 Python 编写的示例应用程序，初始演示可以从 RasPi 添加你自己的项目。PiFace C&D 以 PCB 的形式连接到通用输出引脚上，同时提供了以太网端口。这种适配在
    Model A 上有点松动，会增加 GPIO 连接器的压力。


    PiFace&D 的设计非常聪明：五个触控开关位于底部，且间距为四行。此外，还提供了红外使用。


    ## 评测


    ## 技术规格


    - **显示器**: 背光 16x2 数字 LCD

    - **按钮**: 5x 触控开关（底部），1x 三路开关（顶部）

    - **额外输入**: 红外接收器

    - **连接性**: 标准使用的 GPIO 端口

    - **尺寸**: 82mm x 60mm x 30mm

    - **重量**: 23g

    - **语言**: Python

    - **兼容性**: 树莓派 Model A、Model B、Model B Revision 2


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_80_0.png)


    - 板板位于树莓派的 GPIO 引脚上，但未提供对未使用引脚的轻松访问

    - 大多数 Pi 端口可以通过显示器板访问，但 CSI 和 DSI 线缆需要仔细布线


    固定可以让板板在树莓派单元上保持稳定，但会导致短手册的晃动，显示 Pi 的 IP 地址、CPU 温度和内存使用百分比。其他 Python 程序变得有点复杂：一个下载天气预报，另一个跟踪选定的服务器，另一个玩国际象棋游戏。每个示例代码都提供了一个完全运行的设置，使用板板上的导航开关。许多软件包通过菜单系统工作，每项物品在下载中都包含一个菜单以便快速制作菜单，PiFace
    允许你在没有硬件的情况下调整文本。PiFace 并不完美。它覆盖了整个 GPIO 引脚，留下了几个可用引脚，这意味着任何要在板板上使用其他硬件的人将使用顶部的连接，或使用像
    3.99 英镑的 PiStack 扩展板。


    价格有点高。来自美国的适配套件导航开关和红外接收器对手超过了 77 英镑。对于其他更多的人，消费者可以拥有 PiFace Mini Kit 形式的全彩触摸屏显示器——尽管两者都不是最好的，但优秀的软件软件包胜于
    PiFace。


    > Gareth Hoffmann


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_80_1.png)


    ## 总结


    PiFace & Display 非常接近：低功耗、高可见性，并带有优秀的支持软件和示例代码库，它是初学者入门项目的最佳方式。与竞争对手相比，它便宜一点，在
    Model A 板上非常不合适。


    ## 同样考虑


    PiFace Mini Kit


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_80_2.png)


    PiFace Mini Kit 为树莓派增加了一个触摸屏显示器。与 PiFace 相比，Mini PiFT 提供了更高的分辨率。它还提供可选的触控控制：piface.com


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_80_3.png)


    Adafruit 蓝白色键盘套件


    PiFace 的更便宜替代品提供了许多相同功能，并包含 16x2 LCD 以及键盘。与 PiFace 相比，它是一个更简单的无需焊接的解决方案，并且是竞争对手中最便宜的组合：adafruit.com


    '
