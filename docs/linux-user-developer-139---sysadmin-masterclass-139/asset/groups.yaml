    # Review VoIP software


    # Ekiga


    A GNOME classic that offers its own service, this is a true Skype alternative
    or a limited SIP client?


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_73_0.png)


    +   The Ekiga account is unique in this group test, and is quick and straightforward
    to set up


    The interface is incredibly simple, offering only the bare essentials outnumber
    the contact list, chat windows and initial menus. It makes it easy enough to navigate
    at least, showing a decently filtered list of contacts and basic text editing
    for that itself.


    # Customizability


    Ekiga doesn''t have the widest array of customisations, allowing you to perform
    tweaks here and there to the audio and video without much effort of the way to
    the main SIP servers. This is possibly part of making the application easier to
    use, however with the options it does, it doesn''t go enough.


    # Codecs


    What lies in general customizability, Ekiga makes up in sheer number of available
    codecs. You can customise your client for any type of connection or make sure
    to get the best balance of quality and bandwidth from that all.


    # Extras


    While Ekiga doesn''t offer a way to connect to other IM services, the Ekiga SIP
    account is a very nice addition for those who want to quickly get away from Skype
    and doesn''t have the means of setting up a dedicated SIP account - or finding
    a good online alternative.


    > Ekiga is a perfectly piece of software, but it''s nothing more than that. With
    a bit more customizability on board it could be one of the best, especially with
    the addition of the Ekiga account.


    # Linphone


    The VoIP client available for every device and operating system ever, is the Linux
    version worth getting?


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_73_1.png)


    +   Linphone has a nice, modern interface that could be mistaken for an official
    KDE app


    # Interface


    Having many versions to work with Linphone''s advantage, having a modern interface
    that wouldn''t look out of place as an official KDE app. It keeps simple, with
    separate tabs for contact, history and the dialogue to call a real number. Menu
    items are few but a wide array of options.


    # Customizability


    Like Ekiga, Linphone is low on the custom options. It offers a little more control
    over how you handle the SIP servers at least, along with some customising parts
    of the user interface. However, there are a lot of options that we see everywhere
    in the group test.


    # Codecs


    Comparatively a low amount of codecs, offering around ten variety to customise
    your audio experience. While it does have some of the major ones, it offers the
    fine-tuning that other VoIP clients offer. With the somewhat customisable options,
    you''ll be able to get a call as perfect as you want.


    # Extras


    There''s no extra Linphone accounts or ability to connect to separate IM accounts,
    leaving Linphone strictly way to call and talk with contacts via a preconfigured
    SIP server. That may be all you need, it''s nice to open on down applications
    and consolidate ways to talk on many systems.


    # Overall


    Linphone is compared to how you can use it, compared to all the other apps bringing
    something extra to the table, it''s the advantage of being uniform across many
    platforms, but that matters to a few.'
