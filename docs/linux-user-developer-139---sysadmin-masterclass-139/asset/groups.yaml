    学生、老师和家长一起学习树莓派


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_7_0.png)


    > “想象一下，一旦我们移除现有的课程，可能会发生巨大的变化，”Beale 说，“由于移除了现有课程的障碍，在短短几年内，我们可以让 11 岁的孩子能够使用名为
    Scratch 的 MIT 工具编写简单的 2D 动画。他们就可以为智能手机编写自己的应用程序。”


    这显示，在第一年或第二年，可以在不接触机器的情况下教导计算。“老师不需要立即教编程——这是一个误导，”他说，“我们需要以一种学生不需要在深入水平上掌握的方式——让他们享受其中。我们作为一个组织正在做的是展示计算作为一个学科是丰富、创造且跨学科的。它是关于避免好莱坞式的、人们坐在电脑前黑客的刻板印象，这才是重要的是。”


    解决各种问题的树莓派正在制作一个


