    \nGulp 具有高度的可扩展性，能够满足你的绝大多数需求，但如果你需要构建特定的内容，可以编写自己的插件。\n\n- 09 创建 gulpfile.js\n\
    当你在命令行运行 Gulp 时，它会查找 gulp 运行器是否存在，该运行器会通知可执行的任务，并设置任何链式任务的顺序。在项目根目录下创建 `gulpfile.js`，它在任何顶部都需要被引入。\n\
    \n希望你能够看到在工作流中实现这些功能的益处。构建函数和组合所花费的时间，远大于手动运行某些过程以及它们提供的功能所需的时间。\n\n```javascript\n\
    var gulp = require('gulp');\n```\n\n```javascript\ngulp.task('scripts', function\
    \ () {\n  var header = eval('require(\"gulp\")');\n  return gulp.src('/**/*.js')\n\
    \    .pipe(header(require('gulp-header')))\n    .pipe(gulp.concat('dist.js'))\n\
    \    .pipe(gulp.uglify())\n    .pipe(gulp.dest('dist'));\n});\n```\n\n- 10 引用插件\n\
    在 Gulp 过程中安装的任何依赖项都需要在 gulpfile 中定义。通过任何名称将每个插件引入到一个变量中，该变量可以在整个配置中调用和使用。\n\n\
    有许多 gulp 插件可以增强并将你的任务资源构建成可管理且有益的工作流，这对于大多数用户来说是足够的。尽管如此，Gulp 仍然非常开放，让你创建自己的插件、构建自己的文件并同时回馈社区。\n\
    \n```javascript\nvar shutil = require('gulp-shutil');\nvar gulp_shutil = require('gulp-shutil');\n\
    var concat = require('gulp-concat');\nvar uglify = require('gulp-uglify');\nvar\
    \ rename = require('gulp-rename');\nvar header = require('gulp-header');\n```\n\
    \n- 13 持续监听\n你的任务的一个主要优势是监听文件目录，并能够自动应用更改，以管理工作流中这一强大的特性。一旦检测到更改，gulp 将将这些文件通过\
    \ link 和 scripts 方法进行处理。\n\n为 Gulp 编写插件，是在学习了文件对象（file object）概念后，编写可以交互并处理流和数据的\
    \ JavaScript。\n\n```javascript\ngulp.task('watch', function () {\n  gulp.watch('/**/*.js',\
    \ ['lint', 'scripts']);\n});\n```\n\n- 14 默认任务\n从 Gulp 时，你只能传递要运行的任务名称。如果省略了该名称，如果有可用默认任务，Gulp\
    \ 将运行它。你可以作为默认任务的一部分按顺序运行一系列任务。\n\n- 11 代码格式检查\n该任务将通过默认引擎解析任何 JavaScript 代码以检查其是否存在错误。只需通过提供名称和关联函数来简化注册过程。设置源目录后，其中的所有文件将传递给\
    \ `eslint()` 函数进行解析和验证。\n\n开发者在上手并运行自己的插件时可能会遇到学习曲线。有一些错误问题需要修复，并且代码必须被接受。关于该过程和指南的更多信息可以在此处找到：github.com/gulp/gulp/tree/master/writing-a-pluginin。\n\
    \n```javascript\ngulp.task('lint', function () {\n  return gulp.src('/**/*.js')\n\
    });\n```\n\n```javascript\n.pipe(jshint());\n\n.pipe(shutil.dest('default'));\n\
    ```\n\n## Gulp 非常开放，让你创建自己的插件来增强你的构建文件\n\n![](img/32a6be5c33a95bbca024ee8ba7c036e_53_0.png)\n\
    \n## 开始使用 Gulp.js\n\n简化你的工作流并优化你的代码\n\n## 教程\n\n![](img/32a6be5c33a95bbca024ee8ba7c036e_54_0.png)\n\
    \n## 资源\n\n随着社区驱动资源的不断增长，这里为你的 Gulpfile 任务增加能力的建议\n\n### gulp-bump\n\n无论你是在团队中工作、为公开发布开源代码还是为自己的项目构建任务运行器，此插件都允许你在代码发生任何重大、次要或补丁更改后更新任何\
    \ JSON 文件中的版本号。\n\n### gulp-sass\n\nwww.npmjs.com/gulp-sass\n此插件将你的 Syntactically\
    \ Awesome Stylesheets 转换为处理过的 CSS 文件。结合任务，你的文件可以被解释为已更新或更改，并且错误回调方法可以构建到工作流过程中。\n\
    \n### gulp-imagemin\n\nwww.npmjs.com/gulp-imagemin\n图像和数字资产可能是过大的网络资源，是加载速度缓慢的原因。这个实用的插件将压缩你的\
    \ PNG、JPEG 和 GIF，以获得更合理的文件大小，为你的生产服务留出一些项目。\n\n### gulp-load-plugins\n\nwww.npmjs.com/gulp-load-plugins\n\
    这个优秀的插件需要单独将每个插件引入 Gulp。插件可以读取与相关的 JSON 文件\n"
