    Linux 或 FOSS（自由开源软件）的替代方案吗？目前 Ubuntu 的情况如何？


    这涉及到互联网的很多方面。Ubuntu 手机目前的情况有点奇怪；显然，在年底之前他们可能会推出某些硬件，但具体是什么目前还不清楚。至于其他 FOSS 替代方案，市面上出的
    FirePhone 可以胜任。不过，它们的性能比高端 Android 手机低，数量并不多。


