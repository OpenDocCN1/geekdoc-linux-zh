    \ and let's also make the same for the other widgets.\n\n```python\ngame = Layout()\n\
    set_setup(game)\nfor y in y:\n  for x in x:\n    block = Block(pos_hint=(x.random(),\
    \ y.random()))\n    game.add_widget(block)\n\nBreakout(game)\nball = Ball(game=Game)\n\
    game.add_widget(ball)\n```\n\nThis takes care of all our game widgets and positioned\
    \ and sized in the game. Since the Player and Ball use the references to set their\
    \ properties, we'll be able to move them by just setting their position update.\
    \ The Ball also uses an extra property to remain rectangular, but the alternative\
