    \ 变量运行。当 `game_over` 为 False 时，循环将每隔 30 秒运行一次，直到用户使用 Escape 键或 CTRL-C 退出。我们将启动循环，确保\
    \ `game_over` 为 False 然后编写内部代码。\n\n```python\ndef main_loop():\n    game_over\
    \ = False\n    while not game_over:\n        for event in pygame.event.get():\n\
    \            if event.type == pygame.QUIT:\n                game_over = True\n\
    \            if event.type == pygame.KEYDOWN:\n                game_over = True\n\
