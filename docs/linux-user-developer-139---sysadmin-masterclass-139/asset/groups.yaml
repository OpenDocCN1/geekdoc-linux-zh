    # ## Ekiga


    Originally known as GnomeMeeting, Ekiga is a VoIP and IM service that enables
    you to talk and send instant messages via a preconfigured SIP server. It also
    has its own SIP account system, giving you the freedom to sort out if you are
    switching from another VoIP service.


    **Download: bit.ly/1lews4A2**


    # ## Linphone


    Linphone is a VoIP and video client that is absolutely everywhere, allowing you
    to connect to a SIP server of your choice or a pure siphon software application.
    It''s available for just about every desktop and mobile environment so if you
    like it you don''t need to go anywhere without it.


    **Download: bit.ly/1k9noFt**


    # ## Jitsi


    Jitsi is more of an all-in-one chat and talk service, with standard SIP services
    we''re looking for SIP while also handling IM and video from many other channels
    and services. It''s in development, so new services and features are added regularly.


    **Download: bit.ly/1DE9pp**


    # ## QuteCom


