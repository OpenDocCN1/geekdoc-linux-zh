    # 问题与解答


    您的所有问题都已解决


    问/答


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_90_0.png)


    # 双声道收听


    你好。由于某种原因，我其中一个文件夹里的所有音乐文件都重复了；也就是说，文件变得很大，并且内部包含了两次音轨。也许是我在恢复备份时操作失误了。


    无论如何，我有一个问题：是否有任何 runpeg 或类似的工具可以剪辑我的 MP3 文件？如果每个 MP3 文件的长度超过 50 秒，我需要缩短它们的单独长度。


    我熟悉 Audacity，但有几百个音频文件，那样会花费太长时间。如果对此有任何帮助，将不胜感激。


    David


    你遇到的这个问题看起来很奇怪，但你是对的，ffmpeg 的的确有一种方法可以对目录中的任何 MP3 进行批量处理——尽管我们需要创建一个脚本来处理它。


    CentOS 非常优秀，但有些地方很棘手


    除了备份数据外，最好的方法是先解密驱动器。你会在 Windows 上找到很多工具，在 Linux 上找到 UltraDrag，它们的效果最好，但正规的备份没有良好的替代品。


    # Curl 到 FTP


    在 CentOS 6.9 中，我曾使用 curl 脚本将文件发送到 FTP 服务器。现在我需要将许多文件发送到 FTPS 服务器（FTP SSL 端口）。我发现在这个版本的
    FTP 服务器中，FTP 方法不会向 FTPS 服务器请求身份验证，因此它不需要安全性，导致 FTPS 服务器继续以不安全模式运行，或者可能会失败。


    我遇到了一个问题，Curl 似乎无法与 FTPS 工作，当我让它工作时，要么是这样。以下是我为了让它运行的尝试：


    ```

    # curl ftpps -U 21:servername.com

    ```


    为用户 ''useraccount'' 输入主机密码：


    ```

    curl: (1) Unsupported protocol: ftps

    ```


    ...以及


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_90_1.png)


    执行命令后支持无交互地工作。虽然 FTPS 不在 curls 的配置列表中，但正如你提到的，它只是该方法的扩展。你可以尝试不同的方法来让它工作，这里有两个例子：


    你知道有任何其他实现方式的命令行工具吗？


    ```

    # sudo curlftps -tlsv -o ssl_control -no no_verify_host -no no_verify_peer -o
    allow_other_user:mdp|mountpoint

    ```


    或者你可以：


    ```

    # mp3split tool 不解码音频文件，以下操作为了更快

    ```


    其中一个生效了——告诉我们是哪一个。


