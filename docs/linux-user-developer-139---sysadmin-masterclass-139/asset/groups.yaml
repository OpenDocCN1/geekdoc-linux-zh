  mdcn: "\n\n# Linux User 树莓派聚会 (Raspberry Jam)\n\n![](img/32a6be5c33a95bbca024ee8ba7c0a36e_58_0.png)\n\
    \n# 每个技能总有人们可以学习，并参与其中\n\n 帮助编程\n\n“你能帮我设置我的树莓派吗？”在我们活动开始不久，一个男孩向我们问道。虽然大厅里有树莓派，Linux\
    \ 教室还有 15 台，但参与者们自带了硬件。我们意识到，这位爱好者只是想学习树莓派，并将其用于浏览互联网以外的内容。\n\n我们首先询问他想用他的树莓派做什么；他想做一些酷的东西，比如一个给学习者的图形化语言。这点燃了火花，我们看到它的维度不断扩展。随着一只正在运行并后空翻滚的狗，他指向桌面上的\
    \ IDLE 开始编写一些 Python；到当天结束时，他带着一个小脚本回家了，这个可以提供\n\n教人们更多关于如何使用树莓派编程和制作是一个一贯的主题，这是由\
    \ Alan O'Donoghue（Twitter 上的 @tknetworkchat）构思的。这是一个快速发展的网络，支持学生、开发者和爱好者——我们能学到比树莓派基金会更多的东西。\n\
    \nLinux User 的树莓派聚会无疑也不同，这种活力和热情与席卷南方的略显阴沉的天气形成了鲜明对比。当我们正坐着演示如何在树莓派上使用 Scratch\
    \ 或 Python 时，每个技能水平的人总能找到可以提升自己的地方。\n\n![](img/32a6be5c33a95bbca024ee8ba7c0a36e_58_1.png)\n\
    \n# Linux 用户教室\n\n 凭借由我们的主赞助商 CPC 提供的 15 台树莓派，Linux User 能够完全接管 RNL 培训学院的一间教室，提供树莓派平台的课程。\n\
    \nJim Darby 组织了一场关于树莓派的水下操作课程，随后是 Martin O'Harnon 关于编写 Minecraft 代码的长时间教学课程。该框架涵盖了方方面面：从安装操作系统到制作吸引了大量青少年参与者的游戏。\n\
    \nAlan Braun 随后进行了关于制作树莓派和 Arduino 驱动机器人的课程，并介绍了用于摄像板的 PiCamera 纯视觉模块，他花费了一个小时教授如何使用\
    \ Python 让他们的树莓派板发挥出最佳性能。\n\n> 上方，父母和孩子们在我们的课程中手拉手在一起，在过程中学习了 Python。\n\n59 www.linuxuser.com\n\
    \n# 教程：Linux User 树莓派聚会\n\n![](img/32a6be5c33a95bbca024ee8ba7c0a36e_59_0.png)\n\
    \n上方是展位、项目，以及为所有参加聚会的人提供的免费使用的树莓派。\n\n# 满当当的日程\n\n 中午，我们在普尔尔的 RNLI 学院开始了活动。早晨在后台忙忙碌碌完成布置后，我们都准备就绪，迎接下午的树莓派乐趣与学习。带有所有商户的展厅区域有一个小区域，供不同的演讲者在全天中穿进行简短演讲。这从一个关于\
    \ Minecraft Pi 的 15 分钟演讲开始，意乎不用，它吸引了所有 16 岁以下的人的注意力，以及更少的人。\n\n全天中，我们的演讲和课程不断切换，以便各种参与者可以休息并与其他爱好者聊天。在场的孩子们学会了在现场的树莓派上用\
    \ Scratch 玩游戏，并玩了展示的各种机器人。一些更先进的机器人和项目为下一个树莓派项目提供了灵感。\n\n# 亲爱的 Linux User\n\n\
    只是想写封短信，非常感谢你们在普尔组织树莓派聚会。我跟我那 11 岁的儿子一起去的，他觉得非常有趣，所以我们今天一整天都在他在免费抽奖中赢到的树莓派上玩 Scratch！真是非常棒的一天——我们已经在期待下一次活动了！\n\
    \n树莓派涵盖了从新手（NOOBs）到老手，在树莓派爱好者 Jim Marsden 等其他人的注视下，这里聚集了各年龄段的人，他们来到聚会是为了初次体验树莓派的魅力，而其他人则在各个展位旁聊天和学习。一些人在卖树莓派的附加组件和套件，另一些人在展示他们最新的项目。\n\
    \n到目前为止，当天最受欢迎的活动是由 Martin O'Donoghue 管理的 Minecraft 课程。孩子们和成人围在树莓派周围，学习他们如何以他们从未想过的方式改变和黑进世界。从屏幕上一个简单的“hello\
    \ world”消息开始，以一个彩虹结束。\n\n此致，\nPaul & Alex\n\n60 www.linuxuser.co.uk\n\n# Linux\
    \ User 树莓派聚会\n\n![](img/32a6be5c33a95bbca024ee8ba7c0a36e_60_0.png)\n![](img/32a6be5c33a95bbca024ee8ba7c0a36e_60_1.png)\n\
    \n上方：抽奖活动筹集了超过 500 英镑，将捐赠给树莓派基金会和 RLU。\n右侧：每个人都有事做，无论你是在制作还是玩。\n下方：参加活动的孩子学会了如何在\
    \ Scratch 中创建游戏，还玩了遥控机器人。\n\n![](img/32a6be5c33a95bbca024ee8ba7c0a36e_60_2.png)\n\
    \n# 人们正在学习开源哲学这太棒了\n\n![](img/32a6be5c33a95bbca024ee8ba7c0a36e_60_3.png)\n\n由玩家们一步步创建。当活动结束人们开始离开房间时，一位母亲带着她的女儿走向我们。“请问，下载了\
    \ Minecraft 之后该做什么？”不，意思是树莓派版本不仅是免费的，而且得到了 Mojang 的充分支持。让人们学习开源的哲学这太棒了。”\n\n整个下午，我们都在卖门票用于慈善；由于\
    \ The Pi Hub 等公司的慷慨，我们筹到了 500 英镑给树莓派基金会和 RLU。我们所有的 Linux User 在活动结束时度过了愉快的时光，并希望下次见到。\n\
    \n# 我们的赞助商\n\n- CPC: www.cpc.co.uk\n- The Pi Hub: www.thepihub.com\n- Primoron:\
    \ www.primoron.com\n- Dawn Robotics: www.dawnrobotics.co.uk\n- Little British\
    \ Robot: www.littlebritishrobot.co.uk\n- Phenoptix: www.phenoptix.com\n- PIBorg:\
    \ www.piborg.com\n\n![](img/32a6be5c33a95bbca024ee8ba7c0a36e_60_4.png)\n\n61 www.linuxuser.co.uk\n\
    \n# 桅杆 SailBot 是一个由树莓派驱动的、由英国学生建造的帆艇。桅杆高 1.5 米！放置在船体周围的传感器将信息反馈给树莓派以辅助导航。玻璃船体包含了驱动\
    \ SailBot 需要的所有电子设备以防止被水损坏。\n\n# 组件列表\n\n- 1x 树莓派\n- 1x 玻璃体\n- 1x Arduino Uno\n\
    - 1x Xbee 模块\n- 1x 带外天线的 GPS\n- 1x 罗盘\n- 1x 自制传感器\n\n![](img/32a6be5c33a95bbca024ee8ba7c0a36e_61_0.png)\n\
    \n# Aber SailBot\n\n自动驾驶树莓派驱动-由全球学生建造的帆艇\n\n- 你们是如何开始制作自动驾驶帆船的？\n- Dan Clark:\
    \ 与机器人合作的机会吸引了我，当建造这种东西的机会出现时，我抓住了。\n- Louis Taylor: 部门对自动驾驶进行了大量研究，我们实际上参加了 KRS（国际机器人）竞赛。\n\
    \n- 目前参加过哪些比赛？\n- Dan Clark: 去年我们参加了在美国马萨诸塞的 SailBot 2013。然后我们参加了在法国北部举办的树莓派大赛。今年我们将再次参加比赛，但地点不同。\n\
    - Louis Taylor: 我们的第一年是在加利福尼亚的 SailBot 2014，明年的树莓派大赛在爱尔兰的戈尔。\n\n- 你们特别期待其中一个吗？\n\
    - LT: 我认为我们还有很多工作要完成。我们想通过树莓派学院学习更多。\n\n- 是什么让你们选择树莓派作为驱动 SailBot 的方式？\n- LT:\
    \ 我们需要某种硬件来放入船内。我们想要选择任何技术的自由。树莓派让我们实现了这一点，因为它运行完整的 Linux 操作系统。我的意思是，我们可以在笔记本电脑上开发软件，在笔记本电脑上调试，然后放到树莓派上，它就会立即工作。本质上，我们需要一种强大但又简单的电子设备。\n\
    - DC: 我们已经知道如何使用它，所以节省了我们学习任何新东西的时间。\n\n- 在参加 SailBot 之前用过树莓派作为电子设备吗？\n- LT: 是的，我们在\
    \ Beagleboard 用过。\n\n- 树莓派是 SailBot 的原因之一，它是如何产生的？\n- LT: 去年我们去剑桥参加树莓派聚会，在那里我们遇到了树莓派基金会的创始成员——我们和团队需要一些资金和帮助来坚持，直到我们发现了基金会。\n\
    - DC: 在那个时候，我们不确定是否真的能去比赛。我们没有足够的钱去波士顿。面对这么多困难，我们不知道该怎么办。我们有一艘基本上能运行的船。\n\n- 你们正在制作一个特殊版本的\
    \ SailBot，它能参加今年的比赛吗？\n- LT: 是的，目前我们已经在硬件上工作了几个月了。现在正在收尾，我们必须在未来两周内全职工作。\n- DC:\
    \ 它在未来几周内至少可以部分航行吗？\n- LT: 在这一点，我们可以停止做硬件并更多地关注电子设备。\n\n- 一旦 SailBot 的第二个迭代完成，项目的命运将如何？\n\
    - DC: 在某种程度上，这是一个研究项目。我们有几个想写的科学论文的想法，这将帮助我们实施需要执行的实验。\n- 此外，我们对软件有两个计划，因为它们中的电子设备和控制系统几乎相同。我们将为两艘船使用相同的代码，这样我们就可以用于其中一个或另一个。\n\
    \n- 你们对树莓派还有什么期待？\n- LT: 我们仍然在团队中工作，所以这是一个可以拿起的小东西，并使用视频完成设计。我们正在考虑做另一个类似的项目，也许是一个树莓派项目。\n\
    \n- 你们未来还想做哪些与树莓派相关的项目？\n- DC: 长期以来，我们想做一个树莓派驱动的无人旋翼器。\n\n- 最后，你们目前的赞助情况如何？\n\
    - LT: 我们正在积极寻找赞助；我们目前的主要赞助商是 QinetQ、ARM 和 Kano computing，但我们仍然需要你。有关如何赞助我们的更多信息，请访问\
    \ Aber SailBot 网站。\n\n"
