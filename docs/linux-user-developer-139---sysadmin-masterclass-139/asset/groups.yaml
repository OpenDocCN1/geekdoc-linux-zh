    ## Tutorial Control your CCTV system with ZoneMinder


    Monitor sensitive areas with a number of individually controlled webcams grouped
    by area or zone


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_27_0.png)


    Add local and networked webcams from a variety of manufacturers to cut down on
    cabling and expense Remotely monitor locations and even look at individually created
    events when motion detecting


    ## Control your CCTV system with ZoneMinder


    ### Advisor

    Rob Zwelo models complex systems and is a developer proficient in Python, Django
    and Haskell. Welcome to experimenting with computing


    ## Keep track of what''s going on with most advanced CCTV servers around


    Security can be a major concern for many people. Whether it is for a business
    or in your own home, CCTV cameras can be excellent for anything unwanted. Most
    systems are extremely easy to use with proprietary software that you don''t have
    control of. This is where ZoneMinder comes in. ZoneMinder is a suite that allows
    you to set up, record and control a complete CCTV system. It is compatible with
    a range of devices and you don''t require to change any physical media ever being
    recorded. Keeping an eye on your property is easy when you use ZoneMinder. Having
    a remote camera in a nursery or chicken coop can help you monitor vulnerable people
    or animals when you''re not there. In this tutorial we''ll show you how to set
    it up so you can surveil your property.


    ## Resources

    ZoneMinder www.zoneminder.com

    Compatible cameras


    ## Control of CCTV system with ZoneMinder

    Keep track of what''s going on with one of the most advanced CCTV servers


    TUTORIAL


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_28_0.png)


