    # # PiFace Control & Display


    Controlling the RasPi away from a keyboard can be tricky – until now


    REVIEW


    # Technical specs


    +   **Display:** Backlit 16x2 alphanumeric character LCD

    **Buttons:** 5x tactile switches (base), 1x three-way navigation switch (top)

    **Additional Inputs:** Infra-red receiver

    **Connectivity:** GPIO port pins used as standard

    **Dimensions:** 82mm x 60mm x 30mm

    **Weight:** 23g

    **Language:** Python

    **Compatibility:** Raspberry Pi Model A, Model B, Model B Revision 2


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_80_0.png)


    +   - The board sits on the Pi''s GPIO header, but doesn''t provide easy access
    to unused pins


    +   - Most Pi ports are accessible with the display-fitted board, the CSI and
    DSI cables need careful routing


    A securing keeps the board stable on Raspberry Pi B units, but Model As lead to
    wobble


    # The central control of the PiFace is every


    as of the process from short download-only manuals, displays Pi''s IP address,
    the temperature of the CPU and the percentage of memory used.

    Other Python programs get a little more complicated: one downloads a weather forecast,
    another tracks trains to and from selected servers, and another plays a game of
    chess. Each example code provides a fully-operational setup, using the navigation
    switch on the board to pick out your text-by-letter-a process that becomes tedious
    when used, but is ideal for short and frequently-used tasks.


    Many of the packages work via a menu system, and every item has a menu included
    in the download for quickly making your menus, and a PiFace C0 emulator allows
    you to tweak your text from the board without having the hardware.

    The PiFace C0 isn''t perfect. The board covers the entire GPIO header, leaving
    a few pins available, meaning anyone who wants to use other hardware with the
    board will need to use their connections on top or to make use of a device like
    the £3.99 PiStack expansion board.


    The price, is a little high. A rival-on from the US-based adapter kit navigation
    switch and infra-receiver costs more than £77. For others even more, consumers
    can have a full-colour and touch-sensitive display in the form of the PiFace Mini
    Kit - although neither of them is best, the excellent software bundle is the PiFace
    C0.


    > Gareth Hoffmann


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_80_1.png)


    # Summary


    The PiFace & Display is very close to: low power, high visibility and with an
    excellent library of supporting software and example code, it''s the best way
    for beginners to get started with the project. It''s a little cheap compared to
    the competition, and is fit awkward on a Model A board.


    # Also consider


