    # SonQube stands out for its robustness


    Navigate to the ''bin'' folder and then to the folder corresponding to your project
    before executing the ''sonar-scanner'' with the ''start'' argument. If this is
    your first time using SonQube, open your browser at http://localhost:9000, find
    the address and port and can change the connection in ''sonar.properties'' file.
    From now on, use that address and port for your projects.


    With Ant, and so on. We plan to analyze a Maven Python project for example. Download
    and install the SonQube Runner inside the folder where your SonQube resides -
    this is to make sure all SonQube files are kept in the same place. If you would
    like to analyze using the <SonarQube Runner>, you will need to edit the ''sonar.properties''
    file with the connection strings and credentials. This should correspond to the
    ''sonar.properties'' file you created earlier. Create new environment variables
    and set the <SonarQube Runner> folder path. Also add <SonarQube Runner/bin> to
    your system path. This allows you to run the scanner from any folder in the system.


    # 04 Analyzers


    Analyzers serve as the bridge between the project to be analyzed and SonQube database.
    So, naturally there are different analyzers available for project types, eg. Maven
    analyzer for Maven projects, SonQube tasks for projects


