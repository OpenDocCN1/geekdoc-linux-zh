    ## 17 配置无线摄像头


    许多无线摄像头在连接到以太网时会使用 DHCP 分配 IP 地址。如果你尝试在 Windows 模式下配置它但不起作用，请进入设置并使用：


    ```

    ipconfig /all [Network Address]

    ```


    这应该能帮助你找到它的位置。然后你应该能够访问摄像头内的设置来更改密码并在 Wi-Fi 上设置静态 IP。


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_30_3.png)


    ## 18 添加无线摄像头


    一旦你获得了摄像头的 IP 地址，在返回 ZoneMinder 之前，确保它已开启并连接到无线网络。点击“添加新监控”并将源类型更改为远程（remote）”。将功能设置为你需要的任何。


    ## 19 摄像头


    让协议使用 HTTP，方法使用“简单（Simple）”。你需要使用以下格式输入摄像头的连接详情：


    ```

    [username]:[password]@[IP Address]

    ```


    将端口设置为设备的正确端口，并锁定摄像头的路径。这有时是 timesminder.com。


    ## 21 创建区域


    摄像头可以分配到不同的组。使用此功能的一个好方法是为你想关注的特定区域创建组。点击主页面下方的监控（Monitor）字段。点击“新建（New）”创建一个组并将摄像头分配给它们。


    ## 22 更多操作


    ZoneMinder 是一个强大的工具，作为 CCTV 或监控事物的一部分，你可以做很多事情。例如，你可以设置邮件服务器在有活动时发送邮件。它有一个移动设备界面。Google
    Play 商店提供 ZoneMinder 应用。


