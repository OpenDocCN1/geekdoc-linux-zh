    pygame.quit()\n```\n\n完成后，保存脚本并运行它，树莓派将将在屏幕上移动球——如果球向直接方向移动，“减号”尊重右侧的加速度计代码进行翻转后我们就完成了。\n\
    \n```python\nif __name__ == '__main__':\n    try:\n        main_loop()\n    except\
