    # 在光盘上

    欢迎使用 Linux 用户与开发者 DVD


    # 编辑精选


    **Tails 0.23** 这个极高安全的发行版即将发布 1.0 版本，0.23 是该系列的首个开发发行版。由于人们对互联网隐私的关注，它的流行程度在过去一年中有所增加。


    **Webconverter** 这个基于 Firefox 的发行版证明了开源软件是多么多功能。只有在 Linux 环境下，才可能创建一个轻量且安全的网络自助终端发行版。


    **Universal Media Server** 我们之前基于 PS3 Media Server 开发的列表分支（fork）已经停滞了，特别是我们在较新的设备上遇到了很多麻烦。UMS
    是它的精神继 most，旧版本的开发人员已加入并正致力于开发新功能。


    # 完整索引


    **Ubuntu 14.04 LTS Beta 2** 作为大发布前的最后一个测试版，Ubuntu 14.04 正在成为 Ubuntu 最稳定的发行版之一，通过这个开发版本，我们可以窥见未来预期的内容。


    **OpenMandriva 2014.0** 这是另一个测试版，这次是 OpenMandriva 的。它基于 Mandrake —— 这个衍生版本带回了一些
    Mandriva 的元素和工具，使其类似于经典风格的 Mandrake。


    **Tails 0.23** 这个最安全发行版的最新版本，其应用内置了自动路由功能，以确保你所的一切都处于完美的秘密和隐私保护。


    **Webconverter 24.0** 这个基于 Linux 和 Firefox 构建的网络自助终端是一个极佳的选择，可以让你的网吧、接待区或大学生连接到互联网供大家使用，而无需担心被滥用。


