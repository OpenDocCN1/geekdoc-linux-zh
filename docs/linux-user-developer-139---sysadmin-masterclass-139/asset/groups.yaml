    find a lot of tools on Windows and UltraDrag on Linux that will pass with with
    the best results, but there is no good substitute for a proper backup.


    # Curl to FTP


    In CentOS 6.9 I used a curl script to send files to an FTP server. Now I need
    to send many files to an FTPS server (FTP SSL port). I found that in this version
    of the FTP server, the FTP method does not request authentication from FTPS server,
    then it doesn''t require security, so the FTPS server continue in insecure mode,
    or it might fail.


    I''m having an issue that Curl doesn''t seem to work with FTPS and when I get
    it to work it''s either here. Here''s what I''ve tried to make it work:


    ```

    # curl ftpps -U 21:servername.com

    ```


    Enter host password for user ''useraccount'':


    ```

    curl: (1) Unsupported protocol: ftps

    ```


    ...and


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_90_1.png)


    Supported to work with no interaction once you execute the command. While FTPS
    is not in the configuration list for curls, as in you''ve mentioned it''s just
    an extension of the method. You could try a different method to get it working,
    here''s a couple of examples:


    Do you know any command line tool for the other way of doing it?


    ```

    # sudo curlftps -tlsv -o ssl_control -no no_verify_host -no no_verify_peer -o
    allow_other_user:mdp|mountpoint

    ```


    Or you could:


    ```

    # mp3split tool does not decode audio files, the following is to be a bit faster

    ```


    One of them worked - let us know which.


