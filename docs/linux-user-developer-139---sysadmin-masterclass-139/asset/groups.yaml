    # Security vulnerability in OpenSSL discovered


    Heartbleed affects SSL/TLS encryption, allowing attackers to easily access sensitive
    data on servers


    On 7 April 2014, a major bug was announced for OpenSSL 1.0.2-beta and many versions
    of the 1.0.1 line. The bug affects the implementation of TLS Heartbeat Extension
    and allows for 64 Kb of memory to be exposed every heartbeat. This is a running
    without leaving a trace; in these versions of OpenSSL, a lot of sensitive information
    can potentially be obtained without any detection.


    "We attacked from outside, without leaving a trace," explained Heartbleed, a website
    set up to educate people about the Heartbleed vulnerability. We were able to retrieve
    privileged credentials or details from ourselves secrets we used for X509 certificates,
    sending instant messages, and easily business documents and communication.


    According to data from a recent Survey, Heartbleed affected 66 per cent servers.
    The news of the bug caused many of the servers to lose their least-most features
    and purposes to ensure fix. A fix was quickly created, and to the now of the problem
    a lot of sysadmins had to learn about the importance of security updates.


    Apparently, the Heartbleed bug has been present in OpenSSL since 2001, however
    there was no way to know whether or not anyone with malicious intent discovered
    the flaw and used it during the time that it was active in the software.


    The cause of the bug - as mentioned above - was an issue in implementation purely
    created by human error. It was traced back to Dr Robin Segelmann who spoke to
    the Sydney Morning Herald about


    what happened: I was on improving OpenSSL and submitted numerous bug fixes and
    added new features," he said, "In one of the features, unfortunately, I missed
    a variable containing length-".


    This mistake got through the review process and entered the stable release. The
    Electronic Frontier Foundation, who champions the HTTPS protocol, which protects
    the user of forward secrecy, it is clear that forward secrecy is necessary to
