    成为 Linux 管理员可能需要大约两年的全职经验。管理员最关键的任务是定义和解释日志实践并执行它们。


    严格来说，系统管理员负责一台或多台机器的顺利运行。每台机器通常运行许多服务，其中某些服务比其他更关键，并可能有许多用户或开发者在使用。


    对于系统管理员来说，随时保持互联网或 Web 的可用也是有用且至关重要的。网站通常反映了公司的可靠性，因此这是一项高度优先的责任。


    - 作为 Linux 系统的基本部分，每天查看日志文件是一个良好的习惯


    - 1 /var/syslog

    这是系统日志文件。当你搜索错误或其他信息时，你应该查看的第一个日志文件。它包含三类型的消息：错误、警告和信息。Syslog 会自动保留最后七个压缩过的日志文件。使用
    nano 或 tail /var/syslog


    - 2 /var/log/apache2

    该目录包含两个与 Apache 服务器相关的日志文件。记录了 apache Web 服务器处理的所有请求。它用于生成服务器统计数据，以及 Apache 在处理
    HTTP 请求时发生的诊断信息和错误。如果你的网站有问题，请查找此类信息。虚拟域名通常在自己的定义中分别保存其访问日志 accesslog 和错误日志 errorlog。


    - 3 /var/log/debug

    此文件包含调试信息和警告消息。请记住，每个日志文件中写入的数据类型由 syslog 设置定义。Syslog 替换并改进了原始的 syslog 服务。它的配置文件是
    /etc/syslog.conf，你需要 root 权限才能对其进行更改。


