    > Emulating Microsoft''s ''eradication'' of choice could do damage to our community


    +   Another part of the community is that this is the same — the "eradication
    of choice" is increasingly demanded by big corporations like Microsoft and Apple
    and Google as their focus, and try to emulate their approach


    FerD:


    Right here at Linux User, we''d place a piece called "Linux User''s Theory of
    Everything" and I think there''s a case for the Gnome Shell being being driven
    by just us to eradicate choice, among some influential members of the project,
    as we''ve seen. Some good project leaders like William Mcann and Day are in their
    own words, as they opined about "brand presence" and "consistent visual appearance"
    refusing requests or dissenting in discussions regarding user customisation and
    the restoration of features, when it comes to things they deemed "unnecessary"
    or "extremely detrimental to the identity of the


    [Gnome Shell], The KDE and Ubuntu are then like no other or better. Sure, you
