  mdcn: "\n\n# 树莓派领域第一 14 页\n\n每期都为编码人员和创客者提供的必备月度指南\n\n# LinuxUser\n\nwww.linuxuser.co.uk\n\
    \n# 4 种发行版与开发者 Live 启动 DVD\n\n# 系统管理员大师课\n\n使用 SonarQube 分析代码\n\n今天就开始学习核心技能，开启\
    \ Linux 新职业\n\n# 树莓派专访：Clive Beale\n\n> “在政府对 ICT 教师的支持方面，我认为远未足够”\n\n# 制作 CCTV\
    \ 监控系统\n\n如何使用 ZoneMinder 守护您的家庭安全\n\n# 为 Android 开发应用\n\n使用 Kivy 和 Python 开发并部署\
    \ Android 应用\n\n# 实用型树莓派\n\n录制慢动作视频 << 使用 XLoborg 获奖产品 Aber Sailor 进行控制 <<\n\n\
    # 别精彩内容\n\n- 语音过 IP 应用超级测试\n- 快速创建流程图\n- 自动化网络开发任务\n\n# Cubieboard 2\n\n它真的是它所称的“树莓派杀手”吗？\n\
    \n第 139 期 £5.99\n\n# 顶级托管。\n顶级支持。\n\n- 可靠、高可用性的 Linux 托管\n- 企业级基础设施，极具竞争力的价格\n\
    - 优质 24/7/365 专家技术支持\n- 英国私有数据中心\n- 安全托管 – ISO 27001 认证\n- 快速响应支持查询\n- 获奖托管公司\n\
    \n![](img/32a6be5c33a95bbca024ee8ba7c0a36e_1_0.png)\n\n获取正确的托管解决方案。立即联系 CWCS！\n\
    \n访问我们的网站：WWW.CWCS.CO.UK\n致电我们：0115 740 1234\n电子邮箱：INFO@CWCS.CO.UK\n\n# 欢迎\n\n\
    阅读《Linux User & Developer》第 139 期\n\n每期都更便宜\n\nRob Zetsloot 曾在大学学习过，并使用 Python\
    \ 在课堂上进行复杂的模拟建模。在短暂的入闭室经历后，他转创建一个一套 CCTV 系统，该系统通过我们 Linux User 树莓派的事件测试 Valgrind\
    \ 注册表和表格。\n\n- 为 Android 开发应用\n- 创建开源（FOSS）流程图\n- 制作你自己的 CCTV 系统\n- 成为系统管理员\n\n\
    Tom Hanna 以前就开始了该行业。作为一名记者、导师、演讲者和作者，他亲眼见证了移动时代的方方面演变。本期向我们展示了如何使用基于 Inkscape\
    \ 的优秀工具制作关键流程图。\n\nAlexander Tyler 是物理学毕业生，但他花时间掌握 Python 跨平台框架 Kivy。他还是 tutorkivy.net\
    \ 上 InKivy 的贡献者。编码特性图——这是必读内容。\n\nSean Tracy 至少是一个居住在南岸的创意技术人员。他花费大量时间与 Linux、树莓派和\
    \ Arduino 打交道。Sean 为我们带来了另一个优秀项目。在第 44-47 页，本期展示了如何构建一个网络广播流媒体录制器和解码器。\n\nJon\
    \ Masters 是一位内核开发者，他为 Linux 工作了 18 年，从他 13 岁大学毕业开始。Jon 在曼彻斯特加入了我们，他在那里一家大型企业风险公司工作。你可以在第\
    \ 16-17 页的专栏中找到他的采访。\n\nGareth Halfreep 是我们的驻场专家，为我们带来了整个开源世界的最新进展。在第 10 页，Gareth\
    \ 是我们的主编，评审了 Cubieboard 2 和防火墙控制与调度（从第 78 页开始）。\n\n欢迎阅读《Linux User》最新版本，英国最受欢迎的开源\
    \ Linux 杂志。\n\n我还没有决定长大后做什么，但我很小就致力于计算机了。从我还是孩子起就接触到了技术，所以现在是专注于技术职业的绝佳时机。\n\n\
    从这些新颖且令人兴奋的趋势开始，是保持技术领先的一半成功。我们探索了该岗位的许多技能、工具和规则，这应该帮助你判断自己是否具备条件。\n\n跟上新颖且令人兴奋的趋势是很的。Python\
    \ 的流行程度仍在呈指数级增长，任何有价值的程序员都无法承受在技能列表中缺失它。\n\nPython 最近发生的最好的事情之一是 Kivy，这个让为 iOS\
    \ 和 Android 编程比以前更简单的框架。Alexander Tyler 从第 36 页开始展示如何制作 Android 应用并将其部署到 Google\
    \ Play。忘记展示下一个现实吧——关键在于编写下一个 Flappy Bird。玩 Minecraft 这些吧……\n\n> Russell Burns，编辑\n\
    \n# 与团队联系：\nlinuxuser@imagine-publishing.com\n\nFacebook: Linux User & Developer\n\
    \nTwitter: @linuxuserimageshopco.uk\n\n在线购买\n\n![](img/32a6be5c33a95bbca024ee8ba7c0a36e_2_0.png)\n\
