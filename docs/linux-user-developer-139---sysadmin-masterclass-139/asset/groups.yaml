    # Top 5 security tools


    Security is one of the most important parts of an SA''s job, mastering the tools
    that will help you be an effective administrator


    # Nmap


    Nmap is an open source tool that supports port scanning, OS detection and version
    detection. Nmap is particularly useful for examining the status of your network.


    # Nessus vulnerability scanner


    Nessus is a vulnerability-scanning program that can scan for default passwords,
    detect attacks against the TCP/IP stack, identify vulnerabilities and open mail
    relay. This is a great place to start.


    # SQLMap


    SQLMap is an open source penetration testing tool for detecting and exploiting
    SQL injection flaws. SQLMap supports MySQL, Oracle, DB2, SQLite and can be used
    to quickly take down databases. SQLMap should be an essential part of your arsenal.


    # John the Ripper password cracker


    Weak passwords are the number one threat to the Linux administrator to check and
    protect their Linux machines. John the Ripper utility checks if a password is
    easy to crack by using brute force method, the first port of a cracker.


    # Telnet


    The main benefit of using telnet (type may help) to see its area manually to see
    the raw data of connection. Telnet to connect to a site is better for troubleshooting
    because you see raw HTML output, so you can get a better grasp on the issue.


    # Web servers


    As mentioned, the most popular web servers are Apache and Nginx. Apache is the
    most successful famous open source project whereas Nginx (pronounced Engine X)
    is a web server that was developed by Igor Sysoev in 2002. The difference between
    the two is that Apache is a process-based server, which means each connection
    requires a separate thread, while Nginx handles many requests per process without
    having to spawn many processes. Nginx is very low when serving static files while
    being extremely fast. The configuration files of Nginx are also much simpler than
    those of Apache.


    Apache supports .htaccess files that provide a way to make configuration changes
    on a per-directory basis. Containing one or more configuration directives, is
    placed in a practical document directory and the directives apply to that directory
    and its subdirectories. .htaccess files are essential for the functionality of
    Apache. The good equivalent rewrite rules in Nginx are fewer and less complex
    than those used in an .htaccess file.


    # Scripting


    Scripting can help you write relatively small programs that communicate with a
    database, extract data from logs, sends email to report unhappy happens to a Linux
    system, and so on. It can be useful for a system administrator but the most popular
    are Perl, Python and Ruby. Choosing only one of them is difficult but you cannot
    go wrong with any one of them.


    Perl was popular before 2000 and it can still be useful, whereas Python and Ruby
    are very capable. If you want to play safe, Python, as it continues to explode
    in popularity.


    Apache and Nginx are currently the most popular web servers in today


