    ## 测评


    ### Jitsi

    Jitsi 不仅仅是一个 VoIP 客户端，它还可以处理你所有的即时消息。


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_74_0.png)


    Jitsi 的选项涵盖了更广泛的自定义体验方式。


    ### 界面

    界面其实非常标准，Jitsi 在美学上并不特别出色，但功能和逻辑布局得很明智。代码以传统方式列出，几乎没有进行分组管理，菜单系统非常直观且标签良好。尽管它非常朴素，但这种风格在现在很难得了。


    ### 可定制性

    Jitsi 具有高度的可定制性，软件的几乎每个方面都有选项——无论是编辑实际 VoIP 和连接的方式，还是行为和聊天，通过深入的菜单系统，可以很容易地让它完全按照你的想法运行。


    ### 编解码器

    像 Ekiga 一样，Jitsi 拥有巨大的编解码器列表和一些视频，以确保你可以根据完美需求调用 VoIP 服务。这些都可以很容易更改，尽管你必须深入研究它们。


    ### 额外功能

    Jitsi 的主要功能之一是除了 SIP 服务器连接外，还可以连接许多服务，如 XMPP、Facebook 和 Google Hangouts。它还支持视频和音频
    XMPP，让额外功能更加灵活且通常更多。


    ### 总体

    Jitsi 真的非常出色，能够毫不费地专注于最需要改进的领域，而界面等项目并没有过度开发，实现了功能与易用性的良好平衡。


    ## QuteCom

    开发似乎已经停滞，这款相对老旧的软件还能竞争得过较新的产品吗？


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_74_1.png)


    QuteCom 中可用的编解码器很少，但其他方面的自定义程度相当高。


    ### 界面

    QuteCom 的名字稍微暗示了它所编写的框架，其设计非常有 KDE 界面风格。事实上，它可能是这里所有应用中界面最好的。它实用、简单，并且看起来像一个专业的
    VoIP 客户端。


    ### 可定制性

    QuteCom 为界面、聊天和软件功能提供了不错的自定义选项选择。每个部分本身都是灵活且先进的，并有完全专门的设置以确保新手在尝试某些操作时不会点错方框。


    ### 编解码器

    QuteCom 可用的编解码器选择最少。这可能可以通过向列表添加更多选项来实现。然而，它的开发状态意味着这永远不会发生。它至少有一个主要的解码器，因此你可以进行一些微调和优化。


    ### 额外功能

    Qute 除了 VoIP 选项外别的无，没有额外的即时消息（IM）或 Ekiga 式的账户。它为每个设置的账户准备了配置文件，这为整体功能增加了一些内容。希望如果开发再次恢复，有人感兴趣。


    ### 总体

    Qute 并没有我们最初预期的比其他应用那么好，它在定制性、编解码器和额外功能方面存在缺失，这意味着它并没有从其他群体中脱颖而出。


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_74_2.png)


    75 www.linuxuser.co.uk


    ## 测评

    ## VoIP 软件


    ### 简评：对比与结论


    | 特性 | Ekiga | Linphone | Jitsi | QuteCom |

    | :--- | :--- | :--- | :--- | :--- |

    | **界面** | 一个简单且易于操作的界面 | 界面在不同版本中非常统一一致 | 一个良好的、关注软件其他功能的界面 | 一个漂亮的界面，在 KDE 中不显突兀
    |

    | **界面** | 不易更改，但是一个可以接受的选项 | 在 SIP 连接方面提供更好的控制 | 高度可定制，几乎每个功能都容易编辑 | 具有相当的可定制性
    |

    | **可定制性** | 有大量的编解码器可以调优语音方式 | 编解码器不是最多，但主要的都有 | 像 Ekiga 一样，它有大量的编解码器供使用 | 编解码器很少，是组中最少的
    |

    | **代码** | 账户是列表很好的补充 | 比基础 SIP 账户拥有更多功能 | 除了标准 SIP，它还使用 RTP 传输媒体 | 希望能在标准 VoIP
    功能上进行扩展 |

    | **额外功能** | 短期内不错的客户端，但整体较差 | 与本组其他产品相比，用途非常有限 | 一个非常优秀的软件，有很多方式 | Qute 近年的开发缺失意味着它需要维护
    |

    | **总体** | | | | |


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_75_0.png)


    ## 本组测试获胜者是：

    ### Jitsi

    通过 Ekiga、第三方网站甚至在自己的家庭服务器上设置，获取 SIP 账户会变得更容易。Jitsi 是无论你如何设置，表现最好的应用。你不需要使用 SIP
    来连接他人；它可以成为一个满足你任何联系需求的全功能聊天和即时消息客户端。


