    WebScaleSQL promises significant improvements over stock MySQL


    Facebook, Google, Twitter and LinkedIn have joined forces to launch a MySQL fork
    that improves production-ready of the above standard - the aforementioned companies
    have been working on it for some time to scale from millions of users into the
    billions.


    “Our goal in launching WebScaleSQL is to ensure the MySQL community can work more
    together in order to produce the aspects that are most important to us; the companies
    believe a more integrated system of knowledge-sharing will help the companies
    leverage the features that are greatly needed in large-scale environments.


    # DEVELOPMENT


    # Facebook launches Hack language


    Foundation offers cash for binary-blob driver alternative


    In addition to the launch of WebScaleSQL, its collaborative scalable database
    fork, Facebook has released a programming language dubbed Hack.


    Designed to integrate seamlessly with PHP, Hack works with the company''s high-performance
    virtual machine HHVM - aims for performance while offering the fast development
    cycle of PHP.


    supported by static typing, Hack is a language for PHP developers that one can
    offer significantly improved performance and new features including deata, nullable
    types and type aliases.


    “We have had a great success,” reported Julien Veragu of the implementation. We
    have migrated our entire PHP codebase to Hack, and are expecting more ports for
    an existing codebase to Hack, which are available on the official website at hacklang.org.


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_9_1.png)


    branch of MySQL with the promise that WebScaleSQL will always track the production-ready
    needs of upstream.


    “We reached a MySQL-5.6 for this reason, and it is that we pushed for the changes
    and the features from MySQL-5.7 to see a path forward for us, the companies that
    need them"


    Changes around due to user feedback, including the creation of a new feature for
    performance testing and automated test suite from MySQL includes clause of boosted
    performance through better buffer pooling,


    support for NDB interval query, and features designed for scalability including
    sub-query support and super_read_only.


    “We will be doing our best, so that everyone in the MySQL community will be able
    to talk about what they want and what we can deliver, working with each group
    that joined the project. All constructive feedback is welcome, and we are expanding
    the number of groups to drive changes.”


    Binaries will be provided, as the WebScaleSQL team has explained, with compilation
    left up to the users. At present, GNU/Linux x86_64 are supported, with the requirement
    of at least GL 4.7 or equivalent.


    Our collaboration has failed to so, we know we''re not the only who are trying
