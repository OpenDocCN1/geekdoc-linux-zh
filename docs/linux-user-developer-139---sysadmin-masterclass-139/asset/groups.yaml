    # MOZILLA


    # Eich steps down as

    Mozilla CEO


    Equal rights foster itself on tenure


    The Mozilla Corporation, the wholly-owned business arm of not-for-profit Foundation,
    gained its chief executive officer in Brian Eich - only to leave less than two
    weeks later following public calls for boycott and his dismissal.


    Eich, co-founder of Mozilla and inventor of the language, quickly rose as the
    Corporation''s chief officer and was appointed to the role of CEO. In April, he
    left both the position and the Mozilla board following the disclosure of a $1,000
    donation he had made in support of Prophet Muhammad, which would have gotten him
    banned for life.


    With Mozilla pride itself itself on inclusiveness, many of its supporters and
    employees were dismayed at Eich''s appointment. "Mozilla pride itself on being


    held to a standard itself, and that ''we didn''t live up to it,'' Chuck Baker
    said in a statement that Eich released. "I know many community members are hurt
    and angry, and that''s right: because we deserve better."


    > "I''ve resigned as CEO and I''m leaving Mozilla to focus on my family, like
    problems from other angles," Eich said on his personal blog.


    Firefox is now on track. Thanks to all who have supported me, and to all my colleagues
    at conferences and around the world. I will be less online, but still around."


    Unclear on the future, Mozilla has not yet chosen who Eich''s successor will be
    at the time of writing.


    # SECURITY


    # Full Disclosure

    under new

    management


    The Full Disclosure mailing list has reopened under new management, days after
    it shut down by co-founder John Gordon Carver.


    Many of us in the security community, were shocked by John''s abrupt termination
    of the Full Disclosure list last month. Gordon Lyon, creator of Metaphor,


    > "I immediately wrote to John after hearing. He was well with me but surprised.
    '' If you want to start a replacement, go for it!'' After some time searching
    about how to do it personally (despite all its flaws), I''ve decided to do so!"


    The list is being built from scratch. To subscribe, visit map.org/mailman/list/fulldisclosure.


    # OPEN SOURCE


    # Continuity''s Loom

    Open source license for cluster management software


    Continuity has officially released a cluster management package dubbed an open
    source license.


    Designed to make clusters accessible through deployment tools, Continuity keeps
    management of hardware and software stacks - which Continuity provides - simple
    as Linux, Apache, MySQL and Hadoop. It serves Apache Hadoop clusters that are
    comprised of thousands of nodes.


    "We started with simple scripts. But scripts needed many - they required a lot
    of setup, there no central management tracking of available clusters, and the
    scripts to be changed when we moved from


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_11_0.png)


    one to another," the company changed in its initial launch strategy. "Combining
    scripts and Chef recipes, we were able to get one-button use, but it became extremely
    complex."


    "We''ve been developing using Continuity Loom for almost a month and we were noticing


    +   ■ Continuity''s Loom is designed to make management of clusters as simple
    as possible, and is now published under the Apache License 2.0


    +   ■ We believe that by using Continuity Loom for others, the open developer
    community can benefit from it, so we''re making it available for everyone to use."


    Loom''s source code, licensed under the Apache License 2.0, can be downloaded
    from continuity.github.io/loom.


