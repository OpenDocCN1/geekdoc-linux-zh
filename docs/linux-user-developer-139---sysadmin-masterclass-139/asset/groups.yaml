    # How to become a Linux system administrator


    Equip yourself with the skills you need to start a new career in Linux


    FEATURE


    ## Sysadmin FAQ


    Some of your most frequently asked questions answered...


    **Is system administration a 24/7 job?**

    In theory yes, but in practice obviously it''s not the case. If you''re following
    the advice in this feature and are doing your job properly, though you should
    be able to sleep at night.


    number of Linux systems by propagating changes of a configuration file to any
    number of systems quickly and conveniently. They are called configuration management
    systems and you should learn at least one of them if you value your sanity!


    Always be nice to people - especially developers - and run tests on a development
    machine before you deploy anything. Most important of all, though never make changes
    to a production server on Friday afternoon after your weekend!


    **Which is the most important piece of advice you can give me?**

    Get the fundamentals right and everything. Don''t try to cover every detail until
    you build a new system or put a new practice in place, nail the basics and the
    rest follow.


    **What is IPv6?**

    IPv6 was developed by IETF (Internet Engineering Task Force) and its purpose is
    to solve the forthcoming problem of IPv4 exhaustion. It uses 128-bit addresses,
    offering more than 3x10^38 times as many as IPv4.


    **Which are the two most important tasks of a system administrator?**

    If you start now, you''re probably barking up the wrong tree, but just to be sure,
    it''s backup and security. These are the bare fundamentals - get these right and
    you''re pointing in the right direction.


