    ## 使用 yEd 创建流程图


    ## 10 决策


    到目前为止，流程是单行运行的。遗憾的是，在现实系统中并没有这么简单——通常为了实现最终结果，会记录一个或多个决策。流程图通过菱形元素将此视觉化，该元素通常被用作设计的“节点”。


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_33_0.png)


    ## 13 引用


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_33_1.png)


    ## 11 入口点


    流程倾向于拥有一个或多个点。如果将它们显示为图表的一部分，分析将大大简化。入口点被可视化为起点，不同的顶点具有不同的形状——左侧的更为常用。


    > 你不应该尝试将大型流程挤进一个巨大的图表中


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_33_2.png)


    访问布局菜单。布局引擎将弹出一个对话框，提供额外的设置以精调它们的行为。日本式渐变颜色的爱好者将非常高兴地发现 ToolColor Graph 提供了一个现成的彩色图表来显示渐变的开始和结束位置，点击后它将应用到你的图表中。


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_33_3.png)


    ## 12 终止点


    某些类型的分析需要关于流程终点的信息。终止点应该用相应的符号突出显示。它表示工作在此特定点结束，且不应被跨越。


    ## 13 全部的引用


    你不应该尝试将大型流程挤进去，相反，请使用页外引用来告知你工作将在另一页继续。当然，不要忘记再次添加另一个页外引用以明确指定该点。


    ## 14 添加连线


    状态转换通过线显示，线由边缘创建。定义一条线的方法是点击一次元素，并在按住鼠标按钮的同时向拖拖。然后只需将鼠标释放在目标元素上。


    ## 华丽的图表


    计算机辅助流程图为用户提供了大量的选项，可以让图表看起来好得多。yEd 会乐意使用一组成熟的算法重新排列你的图表。这些算法可以：


    ## 16 更多


    yEd 默认创建直接连接——如果对你的内部操作帮助，某些布局可能会修改它们变为间接连接。曲线和贝塞尔边缘可用——点击其中一个即可将其设置为新连接的默认值。


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_33_4.png)


    34 | linuxuser.co.uk


    ## 使用 yEd 创建流程图


    轻松交流关于流程如何工作的信息


    ## 教程


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_34_0.png)


    ## 17 选择多个元素


    流程图元素组可以被相互关联。这通过使用组选择来实现。只需按住左鼠标键并移动指针以“打开选择矩形”。当释放鼠标键时，内部的所有元素将被选中。


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_34_1.png)


    ## 22 查看图表选项


    yEd 是 Unix、Windows、Mac OS 以及其他支持 Java 的系统的理想选择。大多数网络浏览器也可以启动该产品的版本，只需访问下载页面并点击“启动”按钮即可开始。


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_34_2.png)


    ## 20 UML 进


    流程图适用于中小型流程。非常大的系统可以用 UML 符号中引入的这种紧凑元素来表示。yEd 通过特殊的工具面板支持它们，该面板可以通过元素面板中的 UML
    头部访问。


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_34_3.png)


    ## 23 导出图表


    完成的图表应该导出到通用格式。这通过点击文件/导出来实现。yEd 将弹出一个对话框，允许你选择文件格式和名称。之后，你将被要求输入序列号。


    ## 18 对齐元素


    一旦元素被选中，yEd 就可以自动排列它们以相互连接。在编辑>对齐元素中找到的工具结果应该不会令人失望，放心，它们是可以撤销的。


    img/32a6be5c33a95bbca024ee8ba7c0a36e_34.png)


    ## 24 打印图表


    如果材料在纸面上会更简单。点击小打印图标允许你创建由多个页面组成的图表。模式可以通过输入一个数字来选择。


