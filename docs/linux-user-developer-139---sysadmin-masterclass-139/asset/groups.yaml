    # OpenELEC 4.0 Beta 2


    最全功能的媒体 PC 发行版得到了重大升级，这应该让所有人受益。


    # 测评


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_82_0.png)


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_82_1.png)


    设置和信息非常深入且丰富，允许你自定义发行版中的几乎所有选项。


    安装后，一个极其简洁的欢迎指南将引导你完成设置选择。


    ## 有足够的速度提升和界面改进值得期待


    对于这个发行版来说，这一直比必要的稍微复杂。一方面，它保持了极轻量化，所有版本的 OpenELEC 镜像都小于 200 MB。另一方面，它违背了 XBMC
    让一切易于使用的其他哲学。到目前为止这一点还没有改变，目前没有迹象表明这是最终发布版本前的计划事项。我们真的需要寻找可以利用它的硬件，例如用户媒体 PC。


    ### 尝试运行

    一旦你终于设法搞定了 OpenELEC 的安装，享受它将绝对是一种乐趣。得益于其最新的驱动选择和包选择，OpenELEC 能够充分利用更多可用的资源。这在树莓派上尤为明显。虽然它可以在
    Broadcom 芯片上播放 1080p 内容，但在开始动作时，问题在播放上尤为明显，而且主性能似乎没有受到一点点影响，但也影响了播放问题。


    到目前为止，得益于 XBMC 13 的优化，许多此类问题已经得到了平滑，甚至让你几乎没有任何阻碍。随着最近 VideoCore IV 的开放，我们预计将看到更多针对性的优化，这些优化可能不会出现在
    XBMC 14 版本中。在标准硬件上，你不会看到它与 OpenELEC 有太大区别。在所有平台上，你会注意到连接略有延迟，并将 UPnP-Player 的更多播放选项作为主要关注。因此，OpenELEC
    似乎在这一点是一个赢家，在开发期间平台运行时的变化还没有达到我们在完整版本中预期的那种程度，因此在 4.0 达到目标时可能会有一些新功能出现。然而，它可能并不值得等待，我们仍然希望看到一些真正且更好的安装方法，以解决我们遇到的实际问题。


    ## 总结

    OpenELEC 再次证明它是那些需要它的人的极佳解决方案。我们希望看到在某些设备上的进展，它通过 OpenELEC 呈现的 XBMC 质量和选择得到了改进。


