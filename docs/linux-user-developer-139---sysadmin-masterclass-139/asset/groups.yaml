  mdcn: "\n\n## 使用 Python 构建 Android 应用\n\n精通 Kivy，这一优秀的跨平台应用框架\n\n## 特性\n\n实际上有一种更简单的方法来完成所有这些——我们可以使用上次上次介绍的\
    \ Kivy 语言。它有一种在组件画布（canvas）上绘制的特殊语法，我们可以在每个组件形状上绘制：\n\n```kv\n<Player>\ncanvas:\n\
    \  rgb: 1, 1, 1\n  Rectangle:\n    pos: self.pos\n    size: self.size\n```\n\n\
    > 一旦你掌握了基础技巧，你就不受限于任何类型的应用程序……想象力是唯一的限制\n\n```python\nfrom kivy.app import App\n\
    from kivy.uix.widget import Widget\nfrom kivy.uix.floatlayout import FloatLayout\n\
    from kivy.uix.modalview import ModalView\n```\n\n![](img/32a6be5c33a95bbca024ee8ba7c0a36e_36_0.png)\n\
    \n```kv\n<Ball>\ncanvas:\n  rgb: 0, 0.5, 0\n  Rectangle:\n    pos: self.pos\n\
    \    size: self.size\n```\n\n```python\n_version = '0.1' # 后用于 Android 编译\nclass\
    \ BreakoutApp(App):\n    pass\nBreakoutApp().run()\n```\n\n![](img/32a6be5c33a95bbca024ee8ba7c0a36e_36_1.png)\n\
    \n```kv\n<Block>\ncanvas:\n  rgb: 0, 0.1, 0.1\n  Rectangle:\n    pos: self.x,\
    \ self.y\n    size: self.width, self.height\n```\n\n```python\nfrom kivy.properties\
    \ import ListProperty, NumericProperty, StringProperty\n```\n\n画布的声明并不清晰，除非我们可以将任何指令作为\
    \ kivy 编写。如果你不这样做，canvas 仍然不是像画布特有的特殊语法那指令。指令具有可以设置的不同属性，如 pos 和 size，你可以查看 Kivy\
    \ 文档以了解各种可能性。\n\n```python\nclass Game(FloatLayout):\n    blocks = ListProperty([])\n\
    \    player = ObjectProperty()\n    ball = ObjectProperty()\n```\n\n```python\n\
    class Ball(Widget):\n    pos_hint = NumericProperty(0.5)\n    pos_hint_y = NumericProperty(0.5)\n\
    \    size = NumericProperty(None)\n    velocity = ListProperty([0.1, 0.5])\n```\n\
    \n这里的巨大优势在于，即使我们使用了 kivy 语言，我们仍然能够自动检测引用的 Kivy 属性，并在组件移动或缩放画布时自动跟踪它们，画布指令会自动跟随。\n\
    \n```python\nclass Player(Widget):\n    def __init__(self, **kwargs):\n      \
    \  super(Player, self).__init__(**kwargs)\n        with self.canvas:\n       \
    \     Color(1, 0, 0, 1) # r, g, b, a\n            Rectangle(pos=self.pos, size=self.size)\n\
    ```\n\n```python\nclass Block(Widget):\n    color = ListProperty([1, 0, 0])\n\n\
    from kivy.graphics.context_instructions import Color\nfrom kivy.graphics.vertex_instructions\
    \ import Rectangle\n```\n\n![](img/32a6be5c33a95bbca024ee8ba7c0a36e_36_2.png)\n\
    \n## 使用 Python 构建 Android 应用\n\n## 特性\n\n![](img/32a6be5c33a95bbca024ee8ba7c0a36e_37_0.png)\n\
    \n你可以再次运行游戏，应该能看到所有图形都在工作。注意，它只移动了一点点，如果你缩放窗口，一切都将保持比例。现在我们必须这样添加游戏，通常你希望每秒运行某些更新函数，更新组件的位置并执行游戏逻辑——在这些情况下，对于小球来说。\n\
    \n- 运行屏幕上彩色的块应用……但它们都重叠了！我们可以修复这个问题。Clock 可以在任何时间调度任何函数，执行一次或周期性执行。调度的函数会自动接收通过\
    \ player 和通过我们创建的引用传回的时间缩放。通过 dt 缩放移动是一个好习惯，这样即使中断了时钟且不符合预期，事物也能保持稳定。\n\n你可能注意到\
    \ \"Color\" 指令指的是颜色属性。这意味着我们可以更新块的颜色，给每个块分配一个随机颜色。\n\n此时此刻，我们还添加了处理按键输入的方法，通过将按键方法绑定到\
    \ player 并通过 Player 类来实现。我们现在可以通过添加此带有触摸/鼠标输入的处理程序来完成 Player 类。\n\n现在我们的组件有了图形化表示，现在告诉我们的\
    \ Game 在哪里我们可以启动应用并实际看到它们。特殊的，它被 FloatLayout 用于将我们的 Game 链接到布局中。布局可以接受各种参数，在这种情况下，是父级宽度和高度可能的随机位置。\n\
    \n你可以运行应用，这将显示显示在屏幕上的 Game。每个都应该具有随机位置之一并以网格形式定位，但它们仍然都重叠了。我们可以通过设置它们的大小属性来修复这个问题，让我们对其他组件执行同样的操作。\n\
    \n```python\ngame = Layout()\nset_setup(game)\nfor y in y:\n  for x in x:\n  \
    \  block = Block(pos_hint=(x.random(), y.random()))\n    game.add_widget(block)\n\
    \nBreakout(game)\nball = Ball(game)\n```\n\n这里的优势在于...（此处省略）你可以运行应用，这将显示显示在屏幕上的\
    \ Game。每个都应该具有随机位置之一并以网格形式定位，但它们仍然都重叠了。我们可以通过设置它们的大小属性来修复这个问题，让我们对其他组件执行同样的操作。\n\
    \n（注：由于原文在结尾处似乎有截断或重复，译文已根据提供的逻辑片段进行了对齐）\n\n所以，你可以运行代码来玩你简单的俄罗斯块块游戏。\n\n"
