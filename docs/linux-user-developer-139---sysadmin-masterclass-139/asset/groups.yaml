    # 使用 yEd 创建流程图


    将鼠标悬停在工具栏的某个符号上，以接收有关其角色的更多信息的提示框。


    yEd 调板窗口包含了程序支持的所有原始元素的小轮廓。


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_31_0.png)


    使用概览窗口（overview window）在太大到无法放入一个屏幕的流程图中跟踪你的位置。


    你的实际图表将在工作区域汇，工作区域位于屏幕中间。


    # 使用 yEd 创建流程图


    Tam Hann 自 Palm III 时代起一直活跃在该行业。作为一名导师、演讲师和技术书籍作者，他比任何时候见过市场的每一个方面。


    ## 熟悉 yEd，它是用于交流流程信息的最佳流程图工具之一


    大多数现实世界中的互动倾向于遵循或或少有固定的计划。以过程被正式定义的方式将这些过程视觉化，可以很容易地改进。此外，只有在建立标准的情况下，才能定义对标准的偏离。


    这种视觉语言的韧性可以归因于多种因素：流程图由相对简单直接的形状组成。这使其成为一种通用语言的理想选择，非专家和专家都能阅读。编辑流程图是非刚性的。添加新功能和路径就像添加线一样简单，而在大多数情况下，这需要完全重绘。


    在过去的几年里，已经建立了各种标准。自此以后，流程图的演变和改进比任何时候都多。它们已经比任何时候都更好地演进和改进。流程图已经成功地以各种方式展示了过程的演变。流程图可以以各种方式展示，这种方式是过程的视觉化语言。流程图可以教你以各种方式。流程图可以教你创建美观且有用的图表。


    ## 资源 (Resources)


    [yEd](http://www.yed.com)![](img/32a6be5c33a95bbca024ee8ba7c0a36e_31_1.png)


    # 使用 yEd 创建流程图


    轻松地交流流程信息


    ## 教程 (TUTORIAL)


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_30_0.png)


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_32_1.png)


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_32_2.png)


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_32_3.png)


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_32_4.png)


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_32_5.png)


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_32_6.png)


    # 01 下载 yEd


    yEd 是一个免费工具。因为它没有包含在大多数发行版中，必须通过网站手动获取。


    ## 02 安装 yEd


    下载名为 yEd.tar.gz 的文件。它必须被标记为可执行 `chmod +x`。然后运行 `./yEd.tar.gz`。


    ## 03 启动 yEd


    yEd 启动后，它将显示启动向导。它允许你打开现有文件并用于创建新文档。点击“新建（New）”开始创建你的流程图——程序将变为图中所示界面。


    ## 04 启动向导继续


    yEd 启动后，它将显示启动向导。它允许你打开现有文件并用于创建新文档。点击“新建（New）”开始创建你的流程图——程序将变为图中所示界面。


    ## 05 表示过程


    流程图显然由多个对象组成，只需从右侧的工具栏拖入元素即可。


    ## 06 调整对象属性


    点击对象以选择它。屏幕右下角的属性窗口将显示其属性。所有元素都有文本（Text）属性，可以通过更改它来修改顶部显示的文本。


    ## 07 添加更多元素


    流程图显然由多个对象组成，只需从右侧的工具栏拖入元素即可。控件可以沿着自动显示的各种“辅助工具”进行拖动。


    ## 08 抽象过程


    对图表最常见的批评之一是细节过多导致的信息过载。这可以通过引入抽象过程来调整。


    ## 09 收集输入


    某些过程应该使用特殊符号突出显示，指定没有输入无法完成的操作。你可以使用流程图组件列表“输入（input）”框，只需拖放即可添加到你的表单中。


