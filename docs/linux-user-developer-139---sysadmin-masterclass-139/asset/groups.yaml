    # 开源


    06 新闻 | 16 观点 | 94 信函


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_5_0.png)


    # 教育


    # 政府在计算领域的投入足够吗？


    英国计算教育方式的重大变革正在进行中——但树莓派教育专家 Clive Beale 透露，政府的实际投入与其言论并不符。


    从九月开始，英国的每位计算老师都必须成为精练的程序员。他们的编程水平需要达到足够高，以便向年仅五岁的儿童传授知识。这不会太早了吗？Clive Beale 表示，树莓派基金会认为教师需要理解并消除计算的神秘感的这种教育发展理念其实是媒体的误解。不仅如此，一些政家也搞错了。


    在与 Beale 谈话时，你对计算机首次进入学校以来，英国IT教学方式面临的最大变化有一个清晰的视角和常识判断。Beale 支持政府的目标，即以一种不依赖
    PowerPoint 或 Microsoft Word 等教学包的方式来教授该学科，但他对联合政府实施该的方式持保留态度。考虑到新的计算国家课程——这门学科仅在八个月后就会引入——政府似乎在挥舞魔棒，却未能无中变出兔子。这很大程度上归因于投资的匮。


    “他们所做的是给像 BCC - 学校计算特学会 (ICAS) 这样的组织提供资金，这些组织收交了 50,000 英镑，因此他们提供了‘代码年’并对老师进行了早期培训。但这只是给少数几个机构提供了少额资金，并为需要执行这一新课程的老师提供支持，这为什么会失败呢？”


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_5_1.png)


    Clive Beale，树莓派基金会教育总监。


    www.linuxuser.co.uk


    # 新闻

    Linux 社区最新

    开源


    # 失落的一代？


    随着学生将开始学习计算基础并进行编程，不可避免会出现这样代人——那些错过了早期接触能为以后生活带来益处的孩子。


    但正如树莓派基金会教育成就总监 Clive Beale 所说，这些是不可避免的。“新学科和技术出现时会发生什么，”他说，“侄子每分钟能打 60 个字，而我只能打两个——这虽然是夸张，但你明白我的意思”。


    “15 年后，英国儿童将具备很高的计算机素养，并且都懂计算，这将导致大学和公司处理问题的方式发生变化，使我们不得不重新思考，”Beale 说，“我们需要重新思考那些可能成为常态的基础，并教计算机如何……”


    > 想象一下，一旦我们移除现有的课程，可能会发生巨大的变化。


    计算机科学学位面临一个选择：找一份高薪工作，或者从每月 21 英镑起步。


    让这变得非常奇怪的是，这些问题很早就被报道了。1997 年，当时英国计算机学会（BCS）的主席 Ron McQuie 表示：“务必为我们的教室配备所需的机器，这样我们就能有清晰的思路并有效地教学，给老师和学生更多的自由和机会（更不用说支出了）”


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_6_0.png)


    他第一次被问及他正在赋予什么生命以至于他不得不发言。他并不是委员会的成员，但他说这种“廉价”的计算课程对某些人来说（其中一些人为树莓派基金会工作），是为什么他们没有达到相应的水平；而对于其他被排除在外的人来说，又是什么？


    但比其他任何事物，树莓派成为了学校老师的首选。为了部署他们的即插技能，树莓派基金会一直在开发教师可以在课堂上使用的资源。老师需要一些时间来建立所需的知识，以便对他们被要求的学科领域充满信心。


    教育，树莓派是看到课程中计算部分的关键


    # 蓄积势头


    对 Beale 来说，他有信心在基金会的帮助下，将建立一个基础。“计算实际上是新的，因为它已经没有被教过多久了，”他说，“有 20 位老师对这门新课程感兴趣，并投入几百万英镑，这很容易，但是，情况比这要复杂得多”。


    当教学面临多年来的忽视时，这种影响会一直追溯到早期。计算往往由不同学科教授，而且大多数的编程通常是无结构化的。在课程结束时，没有资格证明可以帮助她，而相似性形成了，教学大纲在没有学生参与的情况下经过了测试。ICT（信息包技术）成了常态。


    在英国提出计算这一想法是 Geoffrey Charles Elick 在 2011 年提出的。他在爱丁堡国际电视节上与 McQuie 谈话，他们讨论了如何构建新形式的媒体。他看到教育科学专家
    Michael Gozel 看中了其中的机会，他在 2017 年 1 月的演讲中描述了他对小学课程元素新基础的愿景。该课程被废弃了，取而代之的是计算。在他看来，让孩子用计算术语分析问题同时应用抽象、算法和数据表示的原则和概念是非常重要的。


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_6_1.png)


