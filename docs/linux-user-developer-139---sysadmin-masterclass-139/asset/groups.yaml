    # # Stephenson''s Rocket simplifies SteamOS


    # ## Better hardware support than the real


    Developer Johei, also known as ''direct'', has released a modified installer for
    Valve''s SteamOS distribution which greatly improves the platform''s compatibility

    In still, SteamOS forms the centre of Valve''s programme to allow companies to
    build consoles instead of PC parts. yet its hardware support has been chosen by
    companies - a problem which has now been fixed by Stephenson''s Rocket, named
    after the famous engine.

    Added by others, including Valve engineers,'' custom installers support almost
    all networking including Wi-Fi dual-boot the system and the ability to update
    the underlying operating system without waiting for Valve''s frequent releases.

    SteamOS also includes support for installing onto a virtual machine for testing,
    that can be difficult to achieve using Valve''s official installer.

    The Stephenson''s Rocket installer, which builds on a previous project as We SteamOS,
    can be downloaded from directhex.github.io/steam-installer.


