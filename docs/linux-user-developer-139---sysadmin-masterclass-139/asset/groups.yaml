    ## 必备 DNS 工具


    互联网最重要的部分是域名系统（DNS），它将一个或多个 IP 地址与域名连接起来并具有树形结构。没有 DNS 无法运行。


    常用的命令是 nslookup、host 和 dig——这三个都具有相同的功能。你应该查阅手册学习不同的参数。为了获取关于 linux 信息，你可以尝试：


