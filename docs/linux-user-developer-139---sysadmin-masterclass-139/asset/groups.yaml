    # 探索如何从 GPIO 引脚读取数据，准备好使用 Python 和树莓派与世界交互


    # 为什么选择 Python？


    它是树莓派的官方语言。你可以在 www.raspberrypi.org/ 上阅读相关。


    上次，我们查看了 GPIO 树莓派，通过输入/输出引脚发送信号。与上篇文章一样，我们关注的是硬件，而不是侧重于你可以用于从电压中收集数据的 Python。当你在读取电压时，你总是需要考虑噪声。树莓派虽然坚固，但并非无不可摧。你始终应该考虑到环境和你的树莓派之间存在某些问题，这会限制你可用的引脚。


    如果引脚悬空，它们将处于浮空状态，并可能会拾取环境中存在的任何杂散电压。在这种情况下，这通常来自附近物体的电磁性。除非引脚物理连接到地或电压，否则它默认被拉高或拉低。因此，你需要一个电阻连接到高或低电平上。树莓派具有在软件内部定义这些状态的能力。当你设置通道
    `pull_up_down` 为高电平或低电平时，你无法直接测量电压或电流。你需要使用某种形式的模数转换器将任何模拟信号转换为可测的数字信号。树莓派包含一个通道，当按钮被按下低电平或高电平时它会返回高电平。你可以用它来测试你是否实际测量了环境变量。通过一个从通道读取信号到特定值的内置函数，你将得到
    1 或 0，True 或 False。因此，你可以根据函数的返回值或布尔值做出决策。


