    # News


    The latest in the Linux community


    # OPEN SOURCE


    # HARDWARE


    # Linux calendar


    # Nvidia announces Jetson K1


    Tegra-based micro to take on the Raspberry Pi


    # Penguicon


    +   » Westin Southfield, Michigan

    » USA

    » 2014-penguicon.org


    2nd - 4th May


    As its name suggests, Penguicon includes plenty of Linux material for beginners
    and experts alike, but also includes tracks on ecological matters, science features
    and videography over its three-day run.


    # LinuxTag


    +   » Der Station, Berlin

    » Germany

    »linuxtag.org


    8th - 10th May


    Held at the same time and in the same venue as DConJ, the world''s largest Android
    developer event, LinuxTag enters its 18th year with over 80 tracks for multi-conference
    pass, but with student scholarships available for free entry.


    # Open Source Day


    +   » Hotel Marriott, Warsaw

    » Poland

    opensourceday.pl


    13th - 14th May


    As one of the biggest open source events in Central and Eastern Europe, confirmed
    speakers include Werner Knoblich and regional director Phil Andrews, and Edsriet
    Stanley Doch.


    # LinuxCon Japan


    +   » Chinkan-so Hotel, Tokyo

    » Japan


    20th - 22nd May


    The Linux Foundation''s premier event for Japan and Asia-Pacific countries, LinuxCon
    Japan aims at fostering co-operation with the Linux community and is open to all,
    including everyone.


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_10_0.png)


    The Nvidia Jetson K1 includes the company''s latest Tegra system-on-chip and plenty
    of connectivity


    Graphics Nvidia has announced its entry into the hotly hobby hobby market with
    the Jetson K1, a single-board computer (SoC) based on the Tegra K1 system-chip.


    As well as four ARM Cortex-A7 cores plus a lower-power Cortex-A53, which allows
    the main cores to shut down when the system is performing lightweight background
    tasks, it features 192 graphics processing cores based on the same technology
    as the company''s Kepler desktop graphics.


    The result is a powerful SoC which can only run the mobile-backend OpenGL


    ES graphics also support the full-OpenGL 4.4 and Direct 11 APIs, when paired with
    a compatible operating system. The processor supports hardware offloading parallel
    processing tasks to the GPU.


    The Jetson K1 includes 2GB of RAM, a 16GB eMMC storage module, on-board GPU, and
    various interfaces such as HDMI, USB, and RS232. A general purpose interface also
    offers additional functions like I2C, UART, SPI, CSI, and DisplayPort.


    UK pricing and availability have not been confirmed at the time of writing, but
    Nvidia is taking orders in North America priced at $192 (around £116 excluding
    VAT).


