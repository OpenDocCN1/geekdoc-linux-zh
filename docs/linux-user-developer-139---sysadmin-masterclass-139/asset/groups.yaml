    # Create flowcharts with yEd


    Tam Hann has been in the industry since the days of the Palm III. As journalist,
    tutor, speaker and author of technical books, he has seen every aspect of the
    market more than once


    # Get to grips with yEd, one of the best flowcharting tools for communicating
    information about processes work


    Most real-world interactions tend to follow a more or less rigid schedule. Visualising
    these processes in ways that processes have been formally defined can be easily
    improved. Furthermore, deviations to the standard can be defined only if a standard
    is established.


    The resilience of this visual language can be put down to a variety of factors:
    flowcharts are made up of relatively simple and straightforward shapes. This makes
    them ideally suited as a common language, which can be read by both non-experts
    and experts alike. Editing a flowchart is non-rigid. Adding new features and paths
    is as easy as adding a line and what would require a complete redraw in most cases.


    During the last few years, a large variety of standards have been established.
    Flowcharts have evolved and improved more than ever since. They have managed to
    outline multiple advanced forms of visualisation such as the once-hyped Nassi
    Scheiderman diagrams, which were rescued to the use of the Austrian government.


    Cutting a short story: flowcharts can be considered the lingua franca of process
    visualisation. This tutorial will teach you how to create good-looking and useful
    diagrams.


    # Resources


    yEd http://www.yworks.com/products/yed_download.html


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_31_1.png)'
