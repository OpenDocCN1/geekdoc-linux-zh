    # 如何成为 Linux 系统管理员


    # 特性


    # 前 5 大安全工具


    安全是系统管理员（SA）工作最重要的部分之一，掌握能够帮助你成为高效管理员的工具非常重要。


    # Nmap


    Nmap 是一个开源工具，支持端口扫描、操作系统检测和版本检测。Nmap 在检查你的网络状态时特别有用。


    # Nessus 漏洞扫描器


    Nessus 是一个漏洞扫描程序，可以扫描默认密码、检测针对 TCP/IP 栈的攻击、识别漏洞和开放的邮件代理。这是一个非常好的起点。


    # SQLMap


    SQLMap 是一个用于检测和利用 SQL 注入漏洞的开源渗透测试工具。SQLMap 支持 MySQL、Oracle、DB2 和 SQLite，并可用于快速攻破数据库。SQLMap
    应该是你工具箱中不可或缺的一部分。


    # John the Ripper 密码破解器


    弱密码是 Linux 管理员检查和保护 Linux 机器的首要威胁。John the Ripper 工具通过使用暴力破解法（破解器的第一道口）来检查密码是否容易破解。


    # Telnet


    使用 telnet（类型可能有所帮助）的主要优势在于可以手动查看其区域以查看连接的原始数据。使用 Telnet 连接到站点更有于故障排除，因为你可以看到原始
    HTML 输出，从而对问题有更好的掌握。


    # Web 服务器


    如所述，最流行的 Web 服务器是 Apache 和 Nginx。Apache 是最成功的著名开源项目，而 Nginx（读作 Engine X）是由 Igor
    Sysoev 在 2002 年开发的 Web 服务器。两者的区别在于 Apache 是基于进程的服务器，这意味着每个连接都需要单独的线程，而 Nginx 在每个进程中处理许多请求而无需启动许多进程。Nginx
    在提供静态服务时资源消耗极低且速度极快。Nginx 的配置文件也比 Apache 简单得多。


    Apache 支持 .htaccess 文件，这提供了一种按目录进行配置更改的方法。它包含一个或多个配置指令，放置在实际的文档目录中，这些指令适用于该目录及其子目录。.htaccess
    文件对于 Apache 的功能至关重要。Nginx 中的等效重写规则比 .htaccess 文件使用的少且不那么复杂。


    # 脚本编写


    脚本可以帮助你编写较小的程序，与数据库通信、从日志中提取数据、发送电子邮件报告 Linux 系统发生的不良事件等。这对于系统管理员非常有用，但最流行的是 Perl、Python
    和 Ruby。只选择其中一个是困难的，但选择其中任何一个都不会错。


    Perl 在 2000 年以前非常流行，现在仍然很有用，而 Python 和 Ruby 都非常强大。如果你想稳妥起见，请学习 Python，因为它的人气正在持续增长。


    Apache 和 Nginx 是目前最流行的 Web 服务器。


    # 如果你想稳妥起见，请学习 Python，因为它的人气正在持续增长。


