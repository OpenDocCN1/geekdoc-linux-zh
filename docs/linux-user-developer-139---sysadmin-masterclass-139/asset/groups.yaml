    ## 01 Set LAMP server


    sudo adduser www-data

    You also need to make sure that Apache is not disabled by CGI by using the following
    command,

    ZoneMinder requires CGI to operate.

    sudo a2enmod cgi


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_28_1.png)


    ## 01 Setup LAMP server


    You need LAMP stack on your ZoneMinder server before you go any further. We''ll
    be installing it under an Ubuntu-based system, packages will be similarly named
    wherever you are. First get tasksel package:

    sudo apt-get install tasksel


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_28_2.png)


    ## 07 First camera


    If you''re using a wired/USB webcam, plug it into your system with ZoneMinder.
    You can check to make sure it is seen by the system by going to the terminal and
    typing the command below. This will list all connected USB devices.

    ls


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_28_3.png)


    ## 04 Configure MySQL


    You''ll need to change the configuration file for MySQL to start a delay. Open
    the property file:

    sudo nano /etc/init.d/zoneminder

    After vim -f, add a line that says ''sleep 15''. Save the file and exit.


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_28_4.png)


    ## 08 Camera details


    We need to make sure you know the specs for the cameras that ZoneMinder requires.
    Luckily, it''s very useful to find this out. Just type in:

    video2info /dev/videoX -q

    Where X is the number of camera assigned to, start with 0. Note the resolution
    and formats to:


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_28_5.png)


    ## 02 Install LAMP


    From here you can install LAMP with:

    sudo apt-get install lamp-server

    Go through the setup process, including a root password for your MySQL database
    and it should be all finished. If you''re using a server it may have this already
    installed and set up for you.


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_28_6.png)


    ## 05 Configure Apache


    Link ZoneMinder configuration file to where to look. You can do this with:

    sudo nano /etc/apache2/conf-etc/

    and then restart apache:

    sudo systemctl restart apache2 force-reload

    This will make the changes effective in the next steps.


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_28_7.png)


    ## 09 Start ZoneMinder


    Now you''re ready to start using ZoneMinder. Open a browser and go to:

    http://localhost/zm

    it''s on a remote server or another system on the LAN, enter the IP address or
    name of zm. Here you can begin to add cameras.


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_28_8.png)


    ## 03 Install ZoneMinder


    Now you can install ZoneMinder with FFmpeg so you can record and keep log of your
    videos. Do with this:

    sudo apt-get install ffmpeg

    For now, use the default settings. We can add these if you wish to have email
    alerts.


    ## 06 Finish up


    You need to set up a user with permissions for ZoneMinder:


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_28_9.png)


