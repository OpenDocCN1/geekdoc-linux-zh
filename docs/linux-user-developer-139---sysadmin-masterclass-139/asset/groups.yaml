    特辑专题


    ## 系统管理员常见问题解答 (FAQ)


    这里是对你最常提问题的解答……


    **系统管理是一份 24/7 全天待命的工作吗？**

    理论上是的，但实践中显然并非如此。不过，如果你遵循本专题中的建议并妥善工作，那么你晚上应该可以睡个好觉。


    通过将配置文件的更改快速方便地传播到任意数量的系统来管理 Linux 系统数量。它们被称为配置管理系统，如果你重视自己的精神健康，应该至少学习其中一种！


    始终对他人保持友好——尤其是开发者——并且在部署任何内容之前，先在开发机上运行测试。最重要的一点是，千万不要在周末前的周五下午对生产服务器进行任何更改！


    **你能给我的最重要的建议是什么？**

    打好基础，一切都会好。在构建新系统或实施新实践之前，不要试图涵盖每一个细节，攻克基础，其他将随之至。


    **什么是 IPv6？**

    IPv6 由 IETF（互联网工程任务组）开发，其目的是解决即将到来的 IPv4 地址耗尽问题。它使用 128 位地址，提供的容量是 IPv4 的 $3\times10^{38}$
    倍以上。


    **系统管理员最重要的任务是什么？**

    如果你现在才开始，你可能找错方向了，但保险起见，是备份和安全。这些是最基础的——搞定这些，你就找对了方向。


    **Puppet 和 Chef 是什么？我应该使用它们吗？**

    Puppet 和 Chef 可以帮助你管理大型……


    还有其他其他可以对我有用的通用建议吗？


