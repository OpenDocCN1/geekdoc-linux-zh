    \      self.direction = 'right'\n    elif keypoint == 'left':\n      self.direction\
    \ = 'left'\n\n  def on_touch_up(self, *args):\n    self.direction = 'none'\n```\n\
    \nThe idea is here as in the first tutorial, we can use the widget to add to the\
