    # 02 Update the firmware


    Updating the firmware is very straightforward; back in the terminal just you use:


    We''ve told it to make a video at 640 x 480 resolution, to film it at 90 frames
    per second and do so for five seconds. This is the maximum resolution for this
    speed of video.


    +   $ sudo rpi-update


    And it should automatically download and install all the necessary files. Once
    it is finished, reboot your Raspberry Pi to activate the new firmware


    # 06 Other recording modes


    As well as being able to record at 90 frames per second, you can go down to 60.
    You cannot change the resolution, so it''s to stick to 640 x 480 for 90 fps or
    60 fps for the time limit.


    # 03 Alternate update


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_64_2.png)


    Problems have been known to occur with the firmware update and there are two main
    ways you can try and fix them. First of all, try updating Rasp with apt-get update.
    If that doesn''t work, try using the firmware update like:


    +   $ sudo UPDATE_SELF=rpi-update


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_64_3.png)


    # 07 Playing it back


    Although you have the means to record it, it can''t play it. You can either grab
    the video from the SD card, or play it using VLC using the command, which should
    have no trouble viewing the file.


    +   $ sudo apt-get install vlc


    # 04 Camera setup


    If you''re just using a new installation of Raspian, you''ll need to make sure
    that the module is enabled. Make sure that you''ve plugged in the camera while
    it''s off, and then in the LXTerminal use:


    # 08 Other uses


    If you plan to use the slow-motion function, you can use it if it''s intended.
    Video editors like Kali can increase the playback speed, and you can also view
    them in VLC at normal speed.


    +   $ sudo raspi-config


    # 09 Final warnings


    Doing this slow-motion video - even at the low resolution of using - is taxing
    on the processor. Try to capture clips while using it and definitely not a lot
    of them in rapid succession


    # 05 First tests


    We can now do a test of the slow-motion capabilities by using the:


    ```

    $ ffmpeg -w 640 -h 480 -fps 90 -t 500 -o slowvideo.h264

    ```


