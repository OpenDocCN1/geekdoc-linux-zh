    # 17 Configure wireless camera


    A lot of wireless cameras will use DHCP to assign an IP address when connected
    to the ethernet. If you try to configure it in Windows Mode and it''s not working,
    go to set it up and then use


    ```

    ipconfig /all [Network Address]

    ```


    This should help you find out where it is itself. You should then be able to access
    the settings within the camera to change password and set a static IP on the Wi-Fi


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_30_3.png)


    # 18 Add wireless webcam


    Once you have the IP address of the webcam you make sure it''s turned on and connected
    to the wireless before heading back to ZoneMinder. Click on Add New Monitor and
    change the source type to remote. Set the function to whatever you wish,


    # 19 Webcam


    Make the protocol use HTTP and the method Simple. You will need to enter the connection
    details for the webcam using


    ```

    [username]:[password]@[IP Address]

    ```


    Set the port to the correct port of your device and lock the path for your camera.
    This is sometimes timesminder.com


    # 21 Create zones


    Cameras can be allocated to different groups. A good way to use this feature is
    to create groups for any specific areas you''re like to keep an eye on. Click
    on the Monitor field below on the main page. New, and create a group to assign
    cameras to them.


    # 22 More to do


    ZoneMinder is a powerful tool and you can do much with it as part of CCTV or keeping
    an eye on things. You can set up an email server to send when there''s an activity
    for example. There''s an interface for mobile devices. ZoneMinder apps available
    on the Google Play Store.


    # 20 Storage concerns


    If you continue to record events and locations, you''ll run out of space. A quick
    and easy way to fix this is have ZoneMinder record over itself from the beginning


