    # 新闻

    Linux 社区最新动态


    # 开源


    ![](img/32a6be5c33a95bbca024ee8ba7c0a36e_8_0.png)


    # 开源


    随着树莓派基金会（Raspberry Foundation）将其数千台售价 35 英镑的控制器送往学校，越来越多的年轻人将接触到开源软件的乐趣。Beales
    表示，为树莓派创建的程序对学生来说至关重要。


    “我们对开源充满热情，并喜欢看到孩子们使用它，”Beales 说，“向孩子们介绍它非常容易，他们使用起来也很。这不仅仅关乎成本，还关乎创造力，而这对我们来说非常重要。”


    树莓派通过向 VideoCore IV 图形库贡献代码以及在 Linux 内核下发布了完整的图形驱动程序，为 Scratch、WebKit、XBC 和 Python
    等开源项目做出了贡献。


    “社区认同这些事情，这正是我们与众不同的地方，”Beales 说，“有一种感觉，就是当我们在刚开始时，社区也来到了那里。正是这种在正确的时间出现在正确的地方的感觉让树莓派变得与众不同。大家聚在一起，开源是这一切得以运作的关键。”


    树莓派通过资源支持教师，让他们能够与网络中的学生和学校开展工作。我们将树莓派送往学校并扩大团队，我们非常忙碌，为代码俱乐部（Code Club）提供资源。团队不得不每隔几周就介入一次——“我们在机器人方面需要资源——这正是引起他们兴趣的，”Beale
    说。


    # 齐力协心


    资金缺乏的一个副作用是老师们之间产生了一种同舟共济的感觉。他们互相帮助，参加树莓派大聚会（Raspberry Pi Jambrees）并分享想法。最重要的是，他们为树莓派发现，所有人都参与其中，并有一种动力驱动他们为学生建立俱乐部。


    他们会说：“我们需要获得认证和鼓励，以便在同行之间传播他们的知识。”


    树莓派让这种方法成为可能。David 和 David Brain 都注意到计算机计算领域的感知差距，认为需要脱离仅仅作为技术消费者的角色。


    有了树莓派，就有了真正的自由。树莓派有了大量的曝光机会，并走向了全球，”Beale 说，“它是其中一个让人想要去摆弄的东西，这与 Mac 或 PC 非常不同——那些昂贵的设备，有些人会害怕分配问题。现在，我们是解决方案的一部分——树莓派可以让理解变得简单，而且从观点来看这很重要。只需
    30 英镑，你就能得到一台电脑，并拍下学生进入家的照片。什么样的事情是有趣的，而且完全没有后顾之忧。墨西哥的孩子说，如果你没有能力，你就做不到这一点。


    通过释放每个人的头脑，每个人都有机会发光——这会产生连锁效应，然后有了 A Level 级的计算机科学课程，即使只有两三个没有先验知识的学生。


    运行课程的人可以在 A Level 级别通过树莓派和计算机为他们提供帮助。但我们现在处于这样一种境地，他们运行的前提是他们无法获得更多了。


    树莓派基金会正在通过资金帮助他们扭转。我们希望向教师传达一个信息：计算既是一种思维方式，也同样编码——它完全关乎抽象和完成任务，”Beale 说，“这真的非常有帮助，这也是我们喜欢它的原因，一种解决问题的特殊方式。计算机插拔式教学（Computer
    Unplugged，unplugged.org）非常棒——这是一个资源展示了如何在不使用电脑的情况下教孩子——免费学习专栏。


    学习这些的孩子将变得更加自信并准备好阶段，开始在压力下获得自由。”


    “你不能强迫他们，”Beale 说，“但在五、六岁时，你想要让他们接触这些概念。我们不想教给孩子的是恐惧。很容易理解我们为什么我们需要计算机。如果我们能让计算机成为一种像平常一样的技能，那么我们就破解了它。”


