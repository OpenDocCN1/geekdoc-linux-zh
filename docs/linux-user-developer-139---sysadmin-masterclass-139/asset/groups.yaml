    # 统计学


    强烈建议系统管理员了解一些统计知识。R 是一种非常好的统计语言，但并不容易学习，它有很多优点：它可以用于 UNIX 脚本 (CRAN)，具有处理数据列表的卓越能力、高级的统计功能、连接数据库的能力以及作为一种编程语言。你不需要学习所有内容，但拥有许多功能的软件是非常用的。我们使用
    R 处理日志文件分析以检测攻击尝试。如果日志文件来自原始转储，你需要监控 "GET /SA" 攻击以及 "GET /node=add HTTP/1.0","GET
