    \ blocks on the screen... but they all overlap! We can fix this The Clock can\
    \ schedule any function at any time, either once or periodically. A scheduled\
    \ function automatically receives the time scale back passed through the player\
    \ and via the references we created. It's good practice to scale the movement\
    \ by dt, so that things remain stable even if interrupts interrupt the clock and\
    \ don't meet expectations.\n\nYou probably noticed the \"Color\" instructions\
    \ refer to the color property. This means that we can update the colour of the\
    \ block to give each block a random colour.\n\nAt this point we also have added\
