  md: '# WHAT''S NEW IN

    LINUX

    MINT?


    **Paul O''Brien** delves into Linux Mint''s development; how it''s grown to be
    used by millions of people and what''s new for the community-led distro


    +   * L

    +     inux Mint might not get a whole host of column inches compared to the distributions
    it''s based on (Ubuntu, and therefore Debian), but with millions of users it''s
    one of the most popular available. Linux Mint started life back in August 2006,
    with version 1.0 (code-named ''Ada'') taking the form of a quick experimental
    distro containing feature ideas that founder Clem Vefeivre had discussed in online
    reviews. The experiment was well received, with new users offering up a number
    of feature requests to augment Clem''s own ideas and improvements. By the time
    version 2.2 ''Bianca'' landed in February 2007, the project had gained significant
    traction and it was clear that its aspirations should be that Mint would compete
    with the very best distros available.

    +   * The reason that Linux Mint grew hugely in popularity right from day one
    was that the development team listened to its loyal community from the start and
    continued to do so through a period of frequent releases and huge growth (the
    same community-focused mantra applies to this day). A crucial point in the history
    of Mint came with the release of GNOME 3. The team were initially unsure as to
    the future of the distro as the GNOME update did not align with Mint''s goals.
    The team ultimately chose to fork GNOME Shell to create Cinnamon, an alternate
    desktop environment that, while not requiring GNOME itself to be installed, stays
    true


    # TIMELINE


    +   * **27 AUGUST 2006**

    +     The first version of Linux Mint is released, based on Kubuntu 6.06. Version
    1.0 ''Ada'' will be the only version of the Mint distribution to offer only a
    KDE desktop environment option.

    +   * **8 JUNE 2008**

    +     The first ''LTS'' (Long Term Support) version of Linux Mint arrives with
    version 5 ''Elyssa''. Based on Ubuntu 8.04, the release offers several variations
    and multiple desktop environments, including Fluxbox.

    +   * **18 MAY 2010**

    +     As quickly as it appeared, the Fluxbox desktop environment makes its last
    appearance in a Linux Mint distro with version 9 ''Isadora''. Xfce remains as
    the ultra-light environment offering.


    ![](img/fb76008333fb7aef815b136f9f1afe5f_27_0.png)'
