  md: "# Tutorial Erlang\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_51_0.png)\n\n\
    Above\nA part of the `hw` project initialisation process that illustrates how\
    \ you can use Cowboy in order to develop a web application in Erlang\n\n```\n\
    ```code\n$ wget https://raw.githubusercontent.com/ninenines/erlang/master/erlang.mk\n\
    $ make -f erlang.mk bootstrap-rel\n$ make\n```\n```\n\nFigure 2 shows some of\
    \ the results you will get on your screen after executing the previous commands.\
    \ So far, you have created the skeleton of a new Erlang project and a dump shell\
    \ script that you can run as `.rel/hw/_rel/release/console` to make sure that\
    \ everything is fine.\n\nand will be the first thing that you will need to download\
    \ when developing a project that uses Cowboy. You can find more information about\
    \ the Erlang build system at https://github.com/ninenines/erlang.mk.\n\nBut first\
    \ you will need to create a directory that will keep all the files of the project\
    \ – in this case the name of the project is `hw`, so the directory name will also\
    \ be `hw`, which you can create by executing the `mkdir` `hw` command. Then you\
    \ will need to execute `cd hw` to actually go into that directory.\n\nNow follow\
    \ the next steps in order to create a new Erlang project that will use Cowboy:\n\
    \nNow it’s time to actually install Cowboy by making changes to the Makefile.\
    \ The final version of the Makefile will be as follows:\n\n```\n```code\nPROJECT\
    \ = hw\nPROJECT_DESCRIPTION = A Hello World program\nPROJECT_VERSION = 0.1.0\n\
    \nDEPS = cowboy\ninclude erlang.mk\n```\n```\n\nAll the work is done by the `DEPS\
    \ = cowboy` line, which will order the build system to download and install Cowboy.\
    \ Then you will need to create a new file named `hw.app.src` inside the `src`\
    \ directory (if it is not already there – you can see `hw.app.src` by looking\
    \ at the source code that accompanies this tutorial). Now, if you execute the\
    \ make utility, the build system will take care of the rest! If the last line\
    \ of the output is `release-1.tar.gz successfully created` you are good so far.\n\
    \nNext, you will need to edit some of the existing files in order to define the\
    \ URLs that your web app will support, as well as adding the required Erlang code\
    \ that implements the desired functionality of the web app. First, you will edit,\
    \ `src/hw.app.erl`. Figure 3 shows the final version of the `/src/hw.app.erl`\
    \ file – this is the first place you should visit for finding out more about the\
    \ list of supported URLs as well as the port number the Cowboy server will listen\
    \ to. However, we are not done yet, as we will have to create a plain HTTP handler\
    \ for the URL:\n\n```\n```code\n$ make new t=cowboy_http m=hw_handler\n```\n```\n\
    \nPlease make sure that the name of the handler is in sync with the name you defined\
    \ in the `hw.app.erl` file.\n\nLast, you will have to open the `src/hw_handler.erl`\
    \ Erlang file, which was created by the previous command, in order to change the\
    \ implementation of the `handle()` function. After editing, the implementation\
    \ of the `handle()` function of the `hw_handler.erl` module should be as follows:\n\
    \n```\n```code\nhandle(Req, State=#{state()}) ->\n    {ok, Req2} = cowboy_req:reply(200,\n\
    \        Req) =\n```\n```\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_51_1.png)\n\
    \nAbove The Erlang code of the `/src/hw.app.erl` file, which is the most important\
    \ file of the app, because this is where you define the supported URLs of the\
    \ web app"
