  md: "# The presented application will display the UNIX epoch time on a web browser\
    \ using a separate URL\n\n```\n```html\n[[<<\"content-type\">>, <<\"text/plain\"\
    >>].\n<<<\"Hello World and Cowboy!\">> ,Req),\n(ok, Req2, State).\n```\n```\n\n\
    As you can see, this is where you define the message the /URL will display. Execute\
    \ the **make** command and run the next command:\n\n```\n```bash\n$ ./rel/hw_release/bin/hw_release\
    \ console\n```\n```\n\nPlease note that the full path and the name of the executable\
    \ are based on the name of the project, so if you've named yours differently,\
    \ you should adjust the previous command accordingly.\n\nNow visit [http://127.0.0.1:1200/](http://127.0.0.1:1200/)\
    \ in order to see the web app in action or use wget to watch the contents of the\
    \ index.html file, which should be 'Hello World and Cowboy!'. The next section\
    \ will create an application that supports two different URLs, so keep reading!\n\
    \n# Create a simple web application\n\nThe presented application will display\
    \ the UNIX epoch time on a web browser using a separate URL – the application\
    \ will support two URLs in total and a third bonus URL that catches everything\
    \ else.\n\nAs you did before, you'll need to create a new Erlang project that\
    \ will use Cowboy – the name of the project will be epoch, so please go ahead\
    \ and create the *root* directory for the project by executing the **mkdir epoch**\
    \ shell command.\n\nNow, create a project similar to the project from the previous\
    \ section before continuing. If you have trouble doing so, reread the previous\
    \ section carefully.\n\nSo, after having a project that supports just one URL,\
    \ it is time to start making changes to the files of the epoch project. However,\
    \ before that, execute **make distclean** in order to clean up any unnecessary\
    \ files and make sure that the epoch web application will use port number 1300\n\
    \n![](img/fb76008333fb7aef815b136f9f1afe5f_52_0.png)\n\n**Above** The Erlang code\
    \ of the epoch_handler.erl module – its most important function is the **handle()**\
    \ function that allows you to display the UNIX Epoch time in your browser\n\n\
    on the local machine. The most interesting part of the project is where you define\
    \ the different routes that will be handled by Cowboy:\n\n```\n```erlang\nRoutes\
    \ = [[{'_',\n\t[\n\t\t['/',  root_handler,  []],\n\t\t['epoch', epoch_handler,\
    \ []],\n\t\t['/ [...]', cowboy_static, {priv_file,\n\tepoch, \"static/error.html\"\
    }]\n\t}] ]\n```\n```\n\nAfter defining the **Routes** variable, you should write\
    \ the **Dispatch = cowboy_router:compile(Routes)** statement in order for Cowboy\
    \ to actually activate the routes. Please note that the '_' at the beginning of\
    \ the routes is for the web application to work on any host. The first route will\
    \ catch the / URL and will just display a text message. The second route catches\
    \ the **/epoch** URL and returns the current time in the UNIX epoch format. Each\
    \ time you refresh the page, the output gets updated. The last route will catch\
    \ all URLs that do not match any of the previous rules and is a static rule that\
    \ presents an HTML webpage on your browser that contains an error message – the\
    \ last route does not require the implementation of a handler because it uses\
    \ the **cowboy_static** handler that is defined by Cowboy. Here, you just have\
    \ to tell Cowboy where to find the HTML page you want to display. Please do not\
    \ forget to create the **error.html** page and put it inside the */priv/static*\
    \ directory; create the two modules for the two other routes and implement them\
    \ – in this case the implementation of the two rules can be found in the **root_handler.erl**\
    \ and **epoch_handler.erl** files that are located in the **src** directory. The\
    \ Erlang code for the implementation of **root_handler.erl** is similar to the\
    \ Erlang code found in the **hw_handler.erl** file you saw in the previous section.\n\
    \nFigure 4 shows the implementation of the Erlang function that returns the UNIX\
    \ epoch time that can be found in **epoch_handler.erl**, as well as the rest of\
    \ the\n\n# Why are web apps important?\n\nWeb applications are important because\
    \ they consume most of the internet traffic. This means that they must be developed\
    \ to be *fast*, *robust*, *fault-tolerant* and *able to scale up*. Although Erlang\
    \ fits all these requirements, it is not used very frequently for creating web\
    \ apps, mainly because web developers do not know Erlang and functional programming\
    \ in general.\n\nThe longer the performance of a website, the happier the visitors\
    \ will be, which means that web apps are important and should be developed carefully.\
    \ Additionally, a good web app would require fewer hardware upgrades and less\
    \ maintenance.\n\nLast but not least, if you are a developer who can create such\
    \ well-behaved applications, you will always have things to do and it would be\
    \ easier for you to choose to develop what interests you the most! So, *well-behaved\
    \ web apps* will make the whole internet traffic faster, more secure. This means\
    \ that if the websites of a company use a good web app, the internet presence\
    \ of the company will be better and more visitors will stay on its website.\n\n\
    # Yawls web server\n\nYawls is another web server that is particularly good at\
    \ serving web apps with dynamic content. As it is written in Erlang, Yawls is\
    \ multithreaded by design and can work concurrently very efficiently.\n\nYawls\
    \ works in two modes: *regular* mode, where it operates as a regular web server,\
    \ and *embedded* mode, where it can run in an Erlang application. You can find\
    \ more information about Yawls at [http://yawls.hyber.org/](http://yawls.hyber.org/)."
