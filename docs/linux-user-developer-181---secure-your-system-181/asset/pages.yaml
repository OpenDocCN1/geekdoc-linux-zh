  md: '# # Review  Free software


    ![](img/fb76008333fb7aef815b136f9f1afe5f_89_0.png)


    # ## BashStyle-NG 10.0


    Customise command-line settings via a GUI


    If you''ve ever come to customise your Bash prompt and, it being a while since
    the last time you''ve probably had to Google for the command, perhaps you''ve
    wished for an easy GUI way to do it? You''ll have dismissed that fancy and contradictory
    notion - after all, a GUI for Bash? - but here we present a GUI config that handles
    not just Bash settings, but Readline, Vim, nano and Git. Installation went smoothly
    once we''d added the Python configobj package to our test machine (it''s in the
    Debian/Ubuntu repositories, as well as via pip). For Bash, most of the settings
    are for prompts and colours. There''s a selection of predefined prompts; custom
    colours; a GUI for customising the prompt; and colour highlighting in grep. Extras
    include a customised cd, which can create directories on the fly; a tab completion
    blacklist (for blocking out backup files); and history settings. The Git settings
    - name, email, default editor, output colours - will be handy for new and occasional
    users. Have a dig through the other features of the package, like octal and temperature
    conversions. This is a niche piece of software, but some users will find it indispensable.


    ![](img/fb76008333fb7aef815b136f9f1afe5f_89_1.png)


    Above  Click a colourful icon and the GUI turns a more old-school grey for changing
    app parameters


    +   - **Pros**

    +       Takes away the burden of remembering all of the config file, shell variables
    and command-line settings


    +   - **Cons**

    +       Even if you like GUIs, it may seem as much trouble to open and use as
    looking for the config file option


    **Great for...**  Quick config changes without diving into the man pages

    http://bit.ly/BashStyle


    # ## Mutt 1.8.3


    Fast, efficient management of emails is a few commands away


    ![](img/fb76008333fb7aef815b136f9f1afe5f_89_2.png)


    Those of us ancient enough to remember when email wasn''t a smartphone app, but
    rather the main use of the internet, grew up with command-line clients like Elm
    and its clones Pine and Mutt. The move away from command-line clients has led
    to no gain in productivity, and with Mutt seeing a steady growth in improvements
    in the last two years, now could be the time for a revisit (or a first discovery).

    It''s one of the most efficient ways of dealing with a heavy email load. We need
    much more than a half-page review to tell you about the power of Mutt, so open
    the Newbie guide on the Mutt wiki, which also links to excellent third-party tutorials,
    then the


    full HTML manual. There is a list of shortcuts across the top line, which changes
    by context, as you''ll see after you arrow down to one of your mails and open
    it by pressing Enter. Mutt''s power comes not just with practice of the basic
    commands, but in chaining them together to speed up tedious filing options.

    Remember, those minutes spent hunting through menus in the likes of Gmail or Evolution
    and clicking checkboxes to move, archive or delete emails - all add up. Spend
    the time instead learning a few commands, and you can whizz through tasks without
    your fingers leaving the keyboard. And when you''ve shelved into your server -
    or your Raspberry Pi - you''ll be able to fire off an email, or work through the
    /var/mail/ files in an instant.


    +   - **Pros**

    +       Productive shortcuts, context-specific settings; keyboard macros automate
    complex tasks


    +   - **Cons**

    +       Plenty to learn, but the Mutt slogan is ''All mail clients suck. This
    one just sucks less!''


    **Great for...**

    Finally get on your e-mail mountain''s under control

    www.mutt.org'
