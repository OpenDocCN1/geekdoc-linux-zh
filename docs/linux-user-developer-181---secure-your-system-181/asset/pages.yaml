    \ files, as comparing current logs with the archive can help you detect nefarious\
    \ activity. At the same time, you can’t retain log files indefinitely, as they\
    \ can take a large amount of space over a period of time.\n\n# Manage log files\n\
    \nYou can use logrotate for easy management of log files. It supports automatic\
    \ rotation, compression and mailing of log files and can be configured by editing\
    \ the /etc/logrotate.conf file. The logrotate utility enables you to define the\
    \ frequency of rotation, whether weekly or monthly, and the number of log\n\n\
    files to be used for each log. You can also set different parameters for different\
    \ log files and define whether a log is to be rotated based on its size, and the\
    \ period for which a rotated log file is to be stored.\n\nFor example, if the\
    \ rotation is set to 10 for the output.log file, the logrotate utility will automatically\
    \ create output1.log, output2.log and so on until output10.log, while the latest\
    \ logs will be stored in output.log. The man page has more details and you can\
    \ find detailed instructions and examples easily on the internet as the utility\
    \ has been around for ages.\n\nAnother popular tool is logcheck. It is designed\
    \ to periodically scan all the logs – it starts the scan where it left off last\
    \ time, saving crucial time. The highly configurable tool lets you define the\
    \ frequency of checks, the log files to be checked, what is considered normal\
    \ and not, and where to email the alerts. You must define the normal behaviour\
    \ which the tool can ignore, otherwise you’ll be inundated with alerts.\n\n# Search\
    \ log files\n\nAnother important tool in the arsenal of log watchers is swatch.\
    \ It works by looking for the specified regular expressions and promptly informs\
    \ you when a match is found.\n\nThe user invoking swatch must create a ~/.swatchrc\
    \ file which describes the ignore and watcher directives as well as the notification\
    \ email address. The watcher entry is a list of keywords that you want to be alerted\
    \ about as soon as a match is found. You must be familiar with regular expressions\
    \ to get the most out of swatch. Also, your system must be configured to send\
