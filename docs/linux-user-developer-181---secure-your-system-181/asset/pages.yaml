- pgno: 20
  md: 'gaining access to the machine by compromising your password or installation
    of malicious script, an attempt made to gain root access such that more harmful
    operations can be carried out. A rootkit is a script or program designed to gain
    unlawful root access for nefarious purposes.


    One of the most popular rootkit scanners is chkrootkit. You can easily install
    it from the terminal with the `sudo apt install chkrootkit` command. Once installed,
    you can invoke it with the `sudo chkrootkit` command. The tool is designed to
    scan your machine for a host of known rootkits and malware. Run the `chkrootkit
    -l` command for a list of all the tests the utility runs by default. Keep in mind
    that the process can take some time, depending on your system configuration and
    available resources.


    A common trick adopted by rootkits is opening ports, which would allow an attacker
    entry into your system. You can scan your system for open ports using the `nmap`
    utility. You can scan for ports by specifying a range or scan all of them with
    `nmap -p 1-65535 localhost`. The full range of `nmap`''s capabilities are too
    vast for us to list here. Refer to the manual (use `man nmap` for details on getting
    the most out of it).


    As a further precaution, you must also install the ClamAV app, which can detect
    trojans and viruses. If your setup involves Windows and Linux machines, it''s
    also recommended to install Linux Malware Detect, a malware scanner for Linux
    which even allows users to submit suspected malware for review.


    # IDENTIFY ISSUES


    # Security auditing with Lynis


    Formerly known as *rkhunter*, Lynis is one of the most popular security auditing
    tools for Linux. Although favoured by sysadmins, it''s a must-have tool if you''re
    running a server or allow remote access through SSH while its ease of use and
    simplicity of operation can also help home users.


    Lynis will study the config files of the installed applications, report user accounts
    without passwords, check firewall rules, identify expired SSL certificates, and
    much more. In all, the tool will run hundreds of tests on the host machine, but
    it doesn''t require any extra software. Rather than automatically addressing problems,
    it generates a report listing all the identified issues and provides tips on how
    to harden the system more effectively.


    You can grab the latest version of Lynis with `git clone https://github.com/CISOfy/lynis`,
    which will fetch the latest version into the *lynis* directory. The tool doesn''t
    require any installation, so you can begin using it by switching into the *lynis*
    directory and running the `./lynis_audit_system` command. When running the scan,
    Lynis will output the result of every performed test to the screen, but you must
    interpret the result yourself and take appropriate actions.


    ![](img/fb76008333fb7aef815b136f9f1afe5f_20_0.png)


    ![](img/fb76008333fb7aef815b136f9f1afe5f_20_1.png)


    ![](img/fb76008333fb7aef815b136f9f1afe5f_20_2.png)


    # 04

    Customise rules



    Gufw enables you to tweak the default rules, which comes in handy especially when
    you are running a service on a non-default port. Switch to the Simple tab, which
    is similar to the Preconfigured tab but instead of a drop-down list of apps, it
    allows you to manually specify the port number for the service. You can either
    add a specific port (23) or a range of ports (11200:11299).


    # 05

    More customisation



    The Advanced tab is useful if you need to make minute customisations as per your
    requirements – for example, if you only wish to allow the SSH service from computers
    within a particular IP address range over a particular interface. Since the firewall
    matches traffic against rules in ascending order, you can also manually give your
    custom rule a number to specify its position in the list of firewall rules.


    # 06

    Watch incoming traffic



    One particularly useful feature of Gufw is the live listening report. After you''ve
    added the rules, switch to the Report tab that list all traffic along with other
    relevant information such as the protocol, port, IP address and application. You
    can use this info to adjust the rules particularly for incoming traffic. Then
    there''s the Log tab which keeps track of Gufw''s activity and helps identify
    any suspicious activity.'
