- pgno: 64
  md: 'Minecraft map. Nearby, children learn about the evolution of programming via
    Jacquard looms and early computer-keyboard card readers, and experience the rare
    pleasure of learning to program through a means more tactile than a keyboard.


    # Tech culture


    Artists, we note, pick up the playfulness in a lot of maker projects, but also
    the learning elements seem to run more deeply. We discuss this with Ross Dalziel,
    who says that he does that *self-consciously*.


    Ross tells us that he has “gravitated to the maker world” more and more over the
    past five years. “What I liked about maker culture was that it reminded me of
    the more traditional, *pre-internet* making [when I was] one of those people who
    would *skulk* about in Maplins looking at the catalogue.”


    “*Previously*, for Ross “*tech* was not the whole story.” Discussing a project
    some years ago [Disclaimer: the reporter, Richard Smalley, was a contributor]
    at FACT, Liverpool’s Foundation for Art and Creative Technology, he recalls: “*The
    technology* was subtle. I really wanted to get FACT growing things. The sensors
    and Arduinos were extensions to this [...] I see *tech* as just a part of *nature*,
    a part of the *culture* – things that we’ve *dug up*, but had to *process*.”


    Domestic Science, the artists collective made up of Dalziel, Glenn Bottler from
    Barlow-in-Furness, and MudLab co-founder Hwa Young Jung, say they are self-conscious
    about technology. “*Interested not just in using it, but in participating in the
    culture rather than just exploiting it*.”


    Dalziel’s stand at the MakeFest is demonstrating an *interactive text adventure*
    based on a *Cockle board* – an ESPIG66-based device developed with *ShrimpPing!*’s
    *Cefn Hoile*, who got involved in the game design and group decisions. The game
    is the result of an *unusual set of constraints* from an *Arts Council commission*
    for *The Hadrian’s Cavalry* 2017 exhibition, a *touring project across ten museums
    along the Hadrian’s Wall site to engage people in the exhibitions*: “*The brief
    was for a low-cost solution*,” says Dalziel and it drove “*multiple visits across
    sites, with game sites off-grid, with no mobile reception*. I [We] *discovered
    the idea of a mobile app*,” recalls Dalziel. “*The result was a text adventure
    game which allows young people to experience a playful world based upon Hadrian’s
    Cavalry. It uses tags and the game state is recorded on an RFID tag to carry between
    the sites. The tech is “hidden in a way, becoming artefacts in the museum*,” Dalziel
    explains. “*You must look around, carrying the story in your head [as you do with
    a story in a book], rather than looking down at a phone screen all of the time.
    Tags prompts it along, with game state in a hand-held object*.”


    ![](img/fb76008333fb7aef815b136f9f1afe5f_64_0.png)


    ![](img/fb76008333fb7aef815b136f9f1afe5f_64_1.png)


    > “*People just see the surface of tech culture, but there’s a rich layer underneath
    that needs publicising*”


    # Text first


    Dalziel has been a fan of *text adventures* (also known as *interactive fiction*)
    from an early age. He wrote *text adventures* on a *ZX Spectrum*, first with a
    friend helping with the *programming side*, then with the *Quill* software. “*Later,
    when I found a Spectrum emulator, I spent a long evening with Quill trying to
    recreate that same adventure, giving up at the same point that I had when I was
    12*!”


    Another *text adventure project involves “interactive non-fiction*. Here, participants
    at events across the *North West* this summer create *text games* using the *Twine*
    software, which takes their inputs from *internet data, APIs and various webpages*.
    The games will be put in an *arcade cabinet*. In *September*, a *workshop for
    practitioners* will be held in *Liverpool*, for *artists and game designers* to
    be able to create their own projects. This blend of old and new, of *learning
    and play*, can be seen in the *steampunk costumes* that are out in force at every
    *Liverpool MakeFest* and the hammering from *The PatternCraft tables*. “*People
    just see the surface of tech culture, but there’s a rich layer underneath that*”'
