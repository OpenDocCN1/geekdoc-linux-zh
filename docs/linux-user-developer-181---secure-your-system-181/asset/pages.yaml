  md: '# Erlang


    # Program in Erlang: Start developing web apps


    Learn how to develop robust web applications and web servers in Erlang


    ![](img/fb76008333fb7aef815b136f9f1afe5f_49_0.png)


    **Mihalisp Tsoukalos**


    is a UNIX administrator, a programmer (UNIX & IOS), a DBA and a mathematician.


    He has been using Linux since 1993.


    You can reach him at @matsouk (Twitter) and http://www.mtsoukalos.eu.


    # Resources


    +   - A recent Erlang installation

    +   www.erlang.org

    +   - Your favourite text editor

    +   - A web browser

    +   To taste the web applications that you develop


    ![](img/fb76008333fb7aef815b136f9f1afe5f_49_1.png)


    This is another tutorial in the Erlang series – its subject is the development
    of web applications and web servers in Erlang. In order to follow the examples
    of this tutorial, you will need a modern web browser as well as a recent Erlang
    installation.


    The good thing is that you can follow this tutorial without having to run your
    own web server, because you can test most of the presented examples locally using
    web servers written in Erlang that come with the Erlang web application.


    So, this tutorial will talk about WebSockets, Cowboy, MochiWeb and how you can
    use them for talking to a web browser and creating your own HTTP servers. Apart
    from the required theory, this tutorial includes handy and easy-to-understand
    Erlang code that will permit you to demystify the challenging areas Erlang web
    development. Nevertheless, in order to take full advantage of this tutorial, you
    will have to write your own Erlang code and create your own web applications and
    web servers.


    This is the last tutorial in the Erlang series, so now it would be a good time
    to review all previous Erlang tutorials and start writing your own unique, interesting
    and handy Erlang applications! Erlang code might look difficult to write at first,
    but offers so many hard-to-find advantages that it’s definitely worth a try!


    In the last few years, various types of web apps take most of the internet traffic.
    So, this tutorial will show you how to write web apps in Erlang in order to take
    advantage of the unique Erlang characteristics that give you the opportunity to
    create robust and distributed applications very simply.


    As the web is asynchronous, concurrent and requires fast responses, Erlang is
    a perfect candidate for participating in the whole web experience.


    This tutorial will be a gentle and easy-to-follow introduction to the capabilities
    of Erlang that can help you create powerful web applications and web servers.


    # About web applications


    If you are not familiar with web applications, you might be wondering what one
    is. A web application (or web app for short) is a client-server software application
    where the client part runs on a web browser. Webmail, instant messaging services,
    online stores and many other kinds of applications are web applications. So, the
    rest of this tutorial will teach you how to create such applications where the
    server part is developed in


    ![](img/fb76008333fb7aef815b136f9f1afe5f_49_2.png)'
  merge: -1
  img_proc: true
- pgno: 50
  md: "Erlang and the client part is displayed on your favourite web browser.\n\n\
    Erlang allows you to quickly write a simple web server that can be used for testing\
    \ your web apps and discovering any connectivity issues between your machine and\
    \ the one that will host the web app. Therefore, this section will present a simple\
    \ Erlang module that will implement a naive web server that just prints the ‘Hello\
    \ World!’ message all the time. However, using such a simplistic Erlang web server\
    \ on production systems might not be the best choice.\n\n# Create a web server\
    \ for testing\n\nThe name of the Erlang module will be *naiveWS* and will be saved\
    \ as *naiveWS.erl*. You can see its Erlang code in **Figure 1**, which is mainly\
    \ a simplistic concurrent TCP server.\n\n```\n```\n2> naiveWS:open_connection(1200).\n\
    <0.64.0>\n```\n```\n\nThe *naiveWS:open_connection()* function requires just one\
    \ parameter, which is the port that the web server will use. Therefore, you can\
    \ start the web server by executing the following command in the Erlang shell\
    \ after compiling *naiveWS.erl*:\n\n```\n```\n$ wget 127.0.0.1:1200/\n```\n```\n\
    \nUsing the *wget* utility to test the web server is as simple as executing the\
    \ next command:\n\n```\n```\n--2017-05-29 10:12:08--\nhttp://127.0.0.1:1200/\n\
    Connecting to 127.0.0.1:1200... connected.\nHTTP request sent, awaiting response...\
    \ 200\nOK\nLength: 12 [text/html]\nSaving to: ‘index.html’\n\nindex.html     \
    \         100%[===========================>]       12  --.-KB/s    in 0s\n\n2017-05-29\
    \ 10:12:08 (2.86 MB/s) - ‘index.html’ saved [12/12]\n```\n```\n\nThe generated\
    \ output will verify that the web server works as expected.\n\nThe contents of\
    \ the *index.html* file are the following, which means that both the web server\
    \ is working and the desired message was delivered successfully:\n\n```\n```\n\
    Hello World!\n```\n```\n\nIf the web server was not working, the output of the\
    \ *wget* command would have been similar to the following:\n\n```\n```\n--2017-05-29\
    \ 10:20:10-- http://127.0.0.1:1200/\nConnecting to 127.0.0.1:1200... failed:\n\
    Connection refused.\n```\n```\n\n```\n```erlang\n-module(naiveWS).\n\nopen_connection(Port)\
    \ ->\n    spawn(fun() -> {ok, Socket} = gen_tcp:listen(Port, [{active, false}]),\n\
    \        loop(Sock) end).\n\nloop(Sock) ->\n    {ok, Conn} = gen_tcp:accept(Sock),\n\
    \    Handler = spawn(fun() -> handle(Conn) end),\n    gen_tcp:controlling_process(Conn,\
    \ Handler),\n    loop(Sock).\n\nhandle(Conn) ->\n    gen_tcp:send(Conn, reply(\"\
    Hello World!\\r\\n\")),\n    gen_tcp:close(Conn).\n\nreply(Str) ->\n    B = list_to_binary(Str),\n\
    \    [\"Status: 200 OK[\\r\\n\" | \"Content-Type: text/html;[\\r\\n\" | \"Content-Length:\
    \ \" ++ Str ++ \"\\r\\n\"],\n    [Size(B), B]].\n```\n```\n\n**Above** The Erlang\
    \ code of *naiveWS.erl* that implements a very simple yet concurrent web server\
    \ using *gen_tcp:listen()* and *spawn()*\n\nHowever, as you will see in a while,\
    \ there exist three other Erlang projects – MochiWeb, Yaws and Cowboy – that are\
    \ more suitable for developing HTTP servers. This tutorial will use MochiWeb later\
    \ on due to its simplicity and Cowboy because it has many capabilities and is\
    \ very well supported by its developers. Nevertheless, both Cowboy and Yaws have\
    \ more capabilities than MochiWeb.\n\n# Use Cowboy, an HTTP server\n\nWritten\
    \ in Erlang, Cowboy is a small and efficient HTTP server for Erlang, OTP and Elixir\
    \ projects. Cowboy supports many kinds of handlers, including REST, WebSockets\
    \ and HTTP ones. Although this tutorial is not about Cowboy, it will deal with\
    \ its installation process in the next section because you might find it a little\
    \ perplexing if you are not used to installing external Erlang modules. You can\
    \ find more information about Cowboy at https://github.com/ninenines/cowboy and\
    \ at the website of Nine Nines: https://ninenines.eu.\n\n> > As the whole process\n\
    > > will be pretty complex, you\n> > will need a build system to\n> > make your\
    \ life easier: in this\n> > case, the Erlang.mk tool\n\n# The Hello World! program\n\
    \nEnough with the theory – it is now time to learn how to install Cowboy and watch\
    \ it in action!\n\nThis section will present a simple web app in order to better\
    \ understand how the whole Erlang with Cowboy thing works. As the whole process\
    \ will be pretty complex, you will need a build system to make your life easier\
    \ – in this case the build system will be the Erlang.mk tool."
