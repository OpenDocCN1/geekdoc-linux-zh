  md: "# # Tutorial\n## Erlang\n\nthe module code. This is an exciting Erlang function\
    \ for many reasons. The first reason is that in order to calculate the UNIX epoch\
    \ time in Erlang, you will need to call `erlang:timestamp()` and use the first\
    \ two of the three returned values in order to calculate the UNIX epoch time and\
    \ save it to the `Epoch_time` variable.\n\nThen, you construct the string that\
    \ you want to send to the Cowboy `req:reply()` function and store it to the `TextToSend`\
    \ variable.\n\nAlthough what you see in this tutorial is the final version of\
    \ the application, don't try to implement everything all at once because your\
    \ code will most likely contain various types of errors – it is considered a good\
    \ practice to create an dummy function for each route that will print a message\
    \ in order to make sure that the route configuration of your project is correct\
    \ and then start implementing and testing the routes one by one.\n\nFigure 5 shows\
    \ the Erlang code of the `./src/root_handler.erl` file, which should present no\
    \ surprises.\n\n> > “You do not have to visit all directories or edit every one\
    \ of the included files: Erlang.mk automatically generates most of them 3”\n>\
    \ \n> `handler.erl` file, which should present no surprises. Figure 6 shows three\
    \ screenshots from the output of the web app when accessed from a browser, but\
    \ you can still test the web app using command-line utilities such as wget and\
    \ curl. The lead image of this tutorial (see p50) shows the full directory structure\
    \ of the epoch project without including the project files, in order to better\
    \ understand the complexity behind the project, which is hidden in order to make\
    \ your life easier. The good thing is that you do not have to visit all directories\
    \ or edit every one of the included files because Erlang.mk automatically generates\
    \ most of them.\n\n# ### About MochiWeb\n\nMochiWeb is an Erlang library that\
    \ allows you to create lightweight HTTP servers. Although Cowboy is more powerful\
    \ than MochiWeb, there are times that you might need something lighter and may\
    \ consider MochiWeb. So, in the next section you will learn how to configure MochiWeb\
    \ in order to serve a simple webpage.\n\nYou can get MochiWeb by executing the\
    \ following command in your Linux terminal:\n\n```\n$ git clone git://github.com/mochi/mochiweb.git\n\
    cd mochiweb\nCloning into 'mochiweb'...\nremote: Counting objects: 2632, done.\n\
    remote: Total 2632 (delta 0), reused 0 (delta 0), pack-reused 2632\n```\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_53_0.png)\n\
    \nAbove The Erlang code of the root_handler.erl module that handles all requests\
    \ for the /URL\n\n`Receiving objects: 100% (2632/2632), 1.28 MiB | 603.00 KiB/s,\
    \ done.`\n`Resolving deltas: 100% (1681/1681), done.`\n\nYou are now free to use\
    \ MochiWeb!\n\n# ## Serving the 'Hello World!' page\n\nThis section will show\
    \ how to program MochiWeb to serve the 'Hello World!' page. This simple example\
    \ will help you better understand how MochiWeb works. You can create a new project\
    \ named hwmochi from inside the mochiweb directory by executing the following\
    \ command:\n\n```\n$ make app PROJECT=hwmochi\n```\n\nThen, you will have to go\
    \ to the hwmochi directory that is located outside of the mochiweb directory by\
    \ executing the cd ./hwmochi command. Executing\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_53_1.png)\n\
    \nAbove The three possible outputs of the epoch web application – each one represents\
    \ a different Cowboy route that the developer should define and implement"
