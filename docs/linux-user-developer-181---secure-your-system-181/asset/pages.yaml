  md: '# **INTERVIEW LINUX MINT**


    # # The people''s distro


    Linux Mint has grown from a cool idea for a domain name to the most community-focused
    Linux distros. After another Mint release has been plucked from the development
    fields, we speak to its founder Clément "Clém" Lefebvre


    ![](img/fb76008333fb7aef815b136f9f1afe5f_11_0.png)


    ![](img/fb76008333fb7aef815b136f9f1afe5f_11_1.png)


    **Clément Lefebvre**

    is the Linux Mint project

