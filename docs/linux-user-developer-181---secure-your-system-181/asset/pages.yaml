- pgno: 28
  md: '# AT A GLANCE

    ## New developments in Mint 18.2


    +   *   **Better Bluetooth**

    +       Bluetooth support is much improved in 18.2 with the addition of the Blueberry
    UI.

    +   *   **New display manager**

    +       Mint 18.2 ditchs MDM and uses LightDM as the display manager with support
    for X, Wayland and more.


    +   *   **Slick greeter**

    +       18.2 includes the LightDM-powered, HiDPI-ready ''Slick'' greeter, a fork
    of Unity greeter.

    +   *   **Mint-Y polish**

    +       Mint 18 introduced the new Mint-Y, Arc-based theme; 18.2 adds further
    visual polish and new backgrounds.


    +   *   **Updated environments**

    +       Cinnamon is updated to version 3.4, MATE to 1.18, KDE to Plasma 5.8.7,
    Xfce to 4.12.

    +   *   **Linux kernel options**

    +       Kernel versions 4.6, 4.8 and 4.10 are available directly from the Mint
    Update kernel management utility.


    ![](img/fb76008333fb7aef815b136f9f1afe5f_28_0.png)


    to the interface features the users liked in GNOME Shell. The stated purpose of
    Linux Mint is to produce a ''modern, elegant and comfortable operating system
    which is both powerful and easy to use''. As a ready-to-use distro, Mint is second
    to none. It''s bundled with full multimedia support including proprietary codecs
    for Flash, MP3 and DVD playback. Although contentious among some in the Linux
    community, it does provide for an optimum user experience. A wide range of apps
    are included as standard in the spirit of being ready to go out of the box, including
    LibreOffice, Firefox, Thunderbird, VLC and GIMP.

    Mint is often considered a good Linux distribution for new Windows converts, particularly
    when using the Cinnamon desktop environment, and this is further strengthened
    by the inclusion of Wine, the Windows compatibility layer, by default. ''Mint4win''
    allows Linux Mint to be installed directly from Windows, just as the ''Ububi''
    equivalent does on Ubuntu. This is a particularly useful tool as it requires no
    re-partitioning of the main system drive. As Linux Mint is based on Debian and
    Ubuntu, it provides over 30,000 packages as well as one of the best software managers
    available. Reliability is noteworthy thanks to a conservative approach to software
    updates and a unique Update Manager also known as ''mintUpdate'', which is part
    of the ''MintTools'' suite. The update manager


    is designed to prevent inexperienced users from installing updates that are unnecessary
    or require a certain level of technical knowledge to install by assigning updates
    a safety level (from 1 to 5), based on the stability and necessity of the update.

    Also included in MintTools is mintinstall, a software manager to install .mint
    files or packages from the Ubuntu and GetDeb repositories. Other historically
    included tools are mintMenu, a handy system-wide menu; mintBackup, a backup tool;
    mintUpdate, an update manager; mintHammy, a basic parental control tool; mintDesktop,
    a desktop config tool; and mintWelcome, the floating welcome screen.

    The first version 18.x release of Linux Mint was a significant milestone in the
    distribution''s life. The underlying base was updated to Ubuntu 16.04 LTS, while
    the Cinnamon and MATE desktops in particular were refined - following an evolutionary
    path rather than opting for radical change, providing some welcome stability in
    a world where, for Ubuntu in particular, turbulence now dominates as the distro
    makes the switch away from Unity. Looking back to Linux Mint''s roots, installation,
    use and stability are better than ever, providing a welcome experience for users
    making the leap from Windows. The new Mint-Y theme was first previewed with the
    ''Sarah'' release, before being tuned and refined based on user feedback (of course,
    this is Mint!).


    ![](img/fb76008333fb7aef815b136f9f1afe5f_28_1.png)


    # DESKTOP ENVIRONMENT

    ## What''s new in Cinnamon 3.4


    Cinnamon 3.4 was released in May this year and has now made its way to the latest
    Linux Mint release (it can also be installed on other distros). Although primarily
    a bug fix and performance release, the new version adds a number of new features
    including a desktop grid; multi-process improvements; wildcard support in file
    search; desktop actions in panel launcher; additional screensaver config options;
    better configuration of mice acceleration and sensitivity; and manage systemd-units
    and lightdm-settings support in system settings (important as Mint 18.2 moves
    to LightDM). A new website - https://cinnamon-spices.linuxmint.com is available
    for Spices: themes, applets, desklets and extensions for Cinnamon. Nearly 300
    are currently available, allowing extensive customisation of the Cinnamon experience.


    # **7 SEPTEMBER 2010**

    LMDE is an alternative version of Linux Mint that comes with a Debian base. LMDE
    is implemented as a rolling release distribution and not tied to a specific release
    schedule.


    # **26 MAY 2011**

    Linux Mint 11 ''Katya'' is the last version to feature specific images for x64
    support. These are rolled into the main images for all subsequent releases as
    the platform becomes more widely used.


    # **26 NOVEMBER 2011**

    The first version of Mint with the MATE desktop appears in version 12 ''Lisa'',
    together with Cinnamon''s predecessor, ''GNOME 3 with MGE''. MATE is effectively
    the spiritual successor to GNOME 2.'
