  md: '# Feature


    # Secure your system


    # QUICK TIP

    Mount manually


    One of the first things to do on a new Linux system is to disable auto-mount of
    portable devices such as USB sticks.


    ![](img/fb76008333fb7aef815b136f9f1afe5f_21_0.png)


    +   * **Right** Your system log files can be classified into four broad categories:
    application logs, event logs, system logs and service logs

    +   * **Across** After completing the scans, Syn1s will provide a number of suggestions
    that you can incorporate to improve system security


    The security of a Linux machine involves more than mere installation of software.
    It requires active participation to monitor the log files and other reports generated
    by the host of tools and apps deployed. You must also interpret the reports and,
    where necessary, take further steps to deter attackers. Unless you''re willing
    to do all this, you''ll quickly end up with a machine that''s host to all manner
    of suspect activity. But don''t panic. You can help yourself by automating a number
    of these tasks.


    # Automate system monitoring


    A network analyser, often referred to as a sniffer, is a program that collects
    and gathers all network traffic. You can use it to determine if a malicious entity
    is attacking or has attacked your network. When your machine is set in promiscuous
    mode, the network interface will collect all network passing through that interface.


    You can use the ngrep tool to watch your network in real time. It even enables
    you to separate packets based on specific parameters. The simplest way to use
    it is to run the ngrep command in the terminal to watch all traffic passing through
    the network. If you''ve never used the tool before, it''s best to study the output
    of ngrep, initially. Later on you can begin playing around with different filters,
    which allow you to focus on packets based on host, type, protocol or direction
    (of traffic). You can use: grep port_number > /tmp/ngrep-log||le to dump the traffic
    details to a log file and study it later.


    # Create cron jobs


    Cron is a time-based scheduler which you can use to run defined operations at
    a specific time and date. It is commonly used to perform routine tasks such as


    ![](img/fb76008333fb7aef815b136f9f1afe5f_21_1.png)


    backups. Every scheduled operation is referred to as a cron job. You can create
    such cron jobs to ensure your system isn''t compromised by scheduling lynis and
    chkrootkit to be run daily. You can create cron jobs using: crontab -e. This opens
    the crontab file in a text editor where you can then add tasks. The syntax of
    a cron job is: minutes hours day month day_of_week. That is, you can define the
    minute, hour, day, month, day of the week when each task should be run. It''s
    best to schedule chkrootkit to run daily. You can configure it to run at 1am everyday
    by adding the following to the crontab file:


    ```

    0 1 * * * /usr/sbin/chkrootkit -2>&l | chmodkit_log

    ```


    # Work with log files


    Your Linux system, the myriad applications and tools, and many everyday operations
    such as software management all generate log files. These are useful for three
    main reasons. They can help you troubleshoot system problems, such as the reason
    why a software installation failed. Next, logs can serve as an early'
