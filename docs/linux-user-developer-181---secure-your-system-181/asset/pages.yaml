  md: 'from files. For example, if we type the command:


    ```bash

    $ ls > files_in_directory.txt

    ```


    This will create a new file called files_in_directory.txt that contains the output
    of the ls command. If such a file exists already, then it will be overwritten.
    If instead we want to append the output to the end of an existing file, then we
    can use `>>` instead of `>`:


    ```bash

    $ echo ''These are the files in the directory:'' > files_in_directory.txt

    $ ls >> files_in_directory.txt

    ```


    ![](img/fb76008333fb7aef815b136f9f1afe5f_38_0.png)


    ![](img/fb76008333fb7aef815b136f9f1afe5f_38_1.png)


    ![](img/fb76008333fb7aef815b136f9f1afe5f_38_2.png)


    ![](img/fb76008333fb7aef815b136f9f1afe5f_38_3.png)


    We can also read input in from a file, using the `<` connective. For example,
    we might be interested to know how many lines there are in Herman Melville’s Moby
    Dick:


    ```bash

    $ echo -n "The number of lines in ''Moby Dick'' is " > mobystats.txt

    $ cat moby10b.txt wc -l >> mobystats.txt

    $ echo -n "The number of lines in ''Moby Dick'' containing the word ''Queequeg''
    is " >> mobystats.txt

    $ cat moby10b.txt grep Queequeg | wc -l >> mobystats.txt

    $ cat mobystats.txt # Prints out the contents of the file ''mobystats.txt''


    The number of lines in ''Moby Dick'' is 23244

    The number of lines in ''Moby Dick'' containing the word ''Queequeg'' is 246

    ```


    ![](img/fb76008333fb7aef815b136f9f1afe5f_38_4.png)


    ![](img/fb76008333fb7aef815b136f9f1afe5f_38_5.png)


    ![](img/fb76008333fb7aef815b136f9f1afe5f_38_6.png)


    ![](img/fb76008333fb7aef815b136f9f1afe5f_38_7.png)


    # There’s more than one way to skin a cat.


    In the last example, we used the command `cat` to print out the contents of a
    file. This is quite a versatile command; if you run it on its own, all it does
    is print the input back out to output again:


    ```bash

    $ cat

    Hello, world!

    Hello, world!

    ```


    This is sometimes useful if you want to write a small amount of text directly
    into a file, without opening up a text editor:


    ```bash

    $ cat > hello.py

    print("Hello, world!")

    <Ctrl+D>

    $ cat hello.py

    print("Hello, world!")

    ```


    Reading and writing to files are two important use cases of the `cat` command,
    but its original intended use was for `concatenating` files (that’s where the
    name comes from). If we pass in multiple filenames as arguments to `cat`, then
    it will concatenate the files together and print out the result:


    ```

    ```bash

    $ echo ''HAMLET: Do you see yonder cloud that\''s almost in shape of a camel?''
    > line1.txt

    $ echo ''POLONIUS: By the mass, and ''tis like a camel, indeed.'' > line2.txt

    $ echo "HAMLET: Methinks it is like a weasel." > line3.txt

    $ cat line1.txt line2.txt line3.txt > dialogue.txt

    $ cat dialogue.txt

    HAMLET: Do you see yonder cloud that''s almost in shape of a camel?

    POLONIUS: By the mass, and ''tis like a camel, indeed.

    HAMLET: Methinks it is like a weasel.

    ```

    ```


    The commands we have met so far allow us to create and delete new files and directories
    and to read and write text files without leaving the terminal. The commands themselves
    are fairly modest, but when we combine them with pipes and file redirects, we
    are able to use them to accomplish useful work. Experiment with the commands and
    techniques we have covered so far and see what you can do with them. In the next,
    Linux Essentials tutorial, we shall meet some new more powerful commands, and
    we’ll introduce scripting, in which we create files to tell the computer to run
    a number of commands in succession.


    Above It is instructive to think of more complicated commands as though they were
    data flowing along a pipeline'
  merge: -1
  img_proc: true
