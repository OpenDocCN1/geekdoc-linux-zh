    \ to external services such as Gmail.\n\nOnce configured, you can use swatch to\
    \ monitor a number of logs for essential keywords.\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_22_0.png)\n\
    \n**Storage quotas**\n\nFor multi-user systems, you should enable quotas and limit\
