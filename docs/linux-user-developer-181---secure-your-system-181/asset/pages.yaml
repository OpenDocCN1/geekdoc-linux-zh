  md: '# Say hello to Pop!_OS, a creator-focused distro


    System76 stops waiting for Ubuntu to add extra features and announces its own
    spin


    Based on Ubuntu, Pop!_OS (pronounced “Pop OS”) is a minimalist operating system
    with a streamlined installation. The aim is to enable creators to just create,
    giving them a quick start and the collection of tools they need to get the job
    done.


    But what sort of creators? Specifically, those working on artificial intelligence,
    3D modelling, makers working on inventions, and even computer science students.


    Supporting the operating system is a community, which at the time of going to
    press is busy planning a development roadmap, opening discussion forums (there’s
    a conversation starting in the subreddit, /r/pop_os) and a code of conduct. Contributors
    to the project are welcome as long as contributions adhere to a specific process.


    Chatting to community members on Reddit, community manager Ryan Sipes explained
    how Pop!_OS will be the default operating system for System76 hardware in future.
    “This will be our default OS. For the


    17.10 release you will be able to choose between Pop!_OS 17.10 and Ubuntu 16.04
    (LTS). This is all part of taking more control over the product we produce. We
    waited three years on Unity 8, and we no longer want to wait on another company
    to implement the features our customers and community are asking for.”


    Currently in alpha (1.62GB, available from https://system76/pop), the first stable
    release of Pop!_OS is expected to appear in October 2017.


    ![](img/fb76008333fb7aef815b136f9f1afe5f_10_0.png)




    # Ubuntu Core on Compute Module


    It’s goodbye Unity, hello Internet of Things!


    Canonical’s refocusing on the Internet of Things has been confirmed with the news
    that Ubuntu Core OS is now available for the Raspberry Pi Compute Module 3. The
    aim is to give IoT manufacturers the opportunity to embrace Linux and create cost-effective
    devices with ease.


    The Compute Module 3 (CM3) is a more compact, general-purpose version of the Raspberry
    Pi 3. Resembling a stick of RAM, it can be slotted into suitable devices with
    a DDR2 SODIMM connector. With 1GB of RAM, a 1.2GHz quad-core CPU and 4GB eMMC


    flash storage, it’s ideally suited to embedded smart home products.


    Mike Bell, EVP of IoT and Devices at Canonical says: “ […] With CM3, the development
    of everything from an edge router to […] digital signage solution has become more
    convenient and affordable […] as easy as developing a custom snap for your specific
    needs.”


    Digital signage firm Screently highlighted its support for this joint venture,
    noting that Ubuntu Core with CM3 marries its design specifications with robust
    hardware.




