    +   - Above: There was a strong theme of interaction at the event, with many maker
    activities to take part in involving old and new crafts


    needs publicising," says Daizzi\el. “The importance of cultural knowledge and
    history that events like maker fairs don’t always have the best opportunity to
    show.


    “It’s weird that people think that tech is fixed and new things – fresh copper
    and breadboards – but there’s hundreds of people’s work behind every chip,” says
    Daizzi\el, reissuing the culture and history behind every bit of circuitry. “Me,
    Glenn and Iiva (the Domestic Science team) are super-fans of tech. Some artists
    use technical culture. We’re more inspired by it. We want to change our practices.”


    He gives an example of the benefits of deeper involvement in a local makerspace.
    People turn up at DoES (Liverpool’s co-working and maker space) and “Get time
    on the laser cutter, then leave. I try to put something back in [as well as] getting
    something out – forming better relationships. We can ask deeper questions and
    get a more nuanced understanding of tech, for better work down the line.”


    # ### Code Club


    Naturally, amid all of the traditional skills, coding and computing hardware still
    feature strongly at MakeFest: there are coding drones, tinkering with robots and
    a range of Arduino shields on sale. Many Pi-based desktops could be seen running
    Scratch or Python, but what really caught our eye was a hybrid of the two: EduBlocks,
    featuring a Scratch-like interface to drag blocks of Python-based code to build
    a program, which can then be switched to a view of the full Python code. It was
    co-created by 13-year old Joshua Lowe, founder and CEO of All About Code, and
    finalist in the BT Young Pioneer Award category of the Tech 4 Good awards. (Discover
    more at http://edublocks.org)


    Education – and play – are important, but in a disaster situation, more fundamental
    needs must be met first. Makers are even helping there (see Interview, right).
    If your Raspberry Pi and Arduino are gathering dust, and you need inspiration,
    get out to a maker event near you – for creativity, fun [...] and the learning
    is a bonus.




    # ## Interview: Dr Laura James, Field Ready


    Many visitors left MakeFest talking about the stand for Field Ready (www.fieldready.org),
    an NGO which focuses on humanitarian supplies that are made in the field. We spoke
    to Dr Laura James, its co-founder and engineering lead.


    # ### What does taking 3D printers to disaster scenes enable that couldn’t be
    done before?


    We can make what’s needed on the ground, meeting immediate needs for local communities
    or aid workers. In Haiti, we met midwives with no sterile supplies left, using
    pieces of string to tie off umbilical cords where a sterile closure was needed.
    In Nepal, clinics damaged by the earthquake were left short of basic medical equipment.


    Aid workers operate in unpredictable settings, and can find themselves needing
    to join unusual pipe sizes in strange configurations. [...] Field Ready, together
    with the university team, have created an app which allows the user to input the
    sizes of pipes that need to be and automatically generates a 3D model of a tailored
    pipe connector, ready for 3D printing.


    # ### We’ve seen the open source way of working influencing many areas outside
    of software...


    We’ve learned that we cannot solve all the design challenges we encounter in the
    field ourselves, even with brilliant teams of engineers and designers on the ground.
    So we have formed a cross-sector community, ‘humanitarian makers’ made up of hundreds
    of technologists, designers and aid workers, and which is an increasingly useful
    forum to find solutions, share information and find volunteers.


    # ### Are your designs available for other organisations to print out in the field?


    Yes, we share our designs openly for others to reuse. You’ll find collections
    on Thingiverse: (http://bit.ly/FRTthingiverse) and we use 3D-pressa for more detailed
    instructions. Our designs are generally CC-BY (Creative Commons Attribution licensed).
    We’ve heard from others reusing our designs, such as a project 3D-printing our
    tectopic design in Gaza, and sometimes they feed back improvements.


    # ### Are there areas where you’re still looking for help from the maker community?


    We’re always happy to welcome more humanitarian makers and are planning new programs
    for engagement in testing coming up later this year. Sign up at www.humanitarianmakers.org.'
