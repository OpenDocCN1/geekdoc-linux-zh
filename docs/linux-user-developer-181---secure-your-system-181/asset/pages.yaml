- pgno: 81
  md: '# ## **GNOME Boxes**


    Not quite the box of tricks you might be expecting


    ![](img/fb76008333fb7aef815b136f9f1afe5f_81_0.png)


    For some distributions, Boxes offers the Express Install option to preconfigure
    the VM, for example by creating a user


    # ### Usability


    This virtualiser has a very approachable interface. To create a new virtual machine,
    you can either enter the URL from which the application will fetch an image and
    boot off it or point it to a locally available ISO. The application, however,
    offers extremely limited customisability options so you can only adjust the amount
    of RAM and maximum disk size it can occupy.


    # ### Advanced features


    If Boxes finds other libvirt-managed VMs on the computer, you’ll get an option
    to import them. It can also clone VMs and enables you to take snapshots with a
    single click that you can then rename and revert to with ease. Also, you can also
    point Boxes to a remote VNC server or oVirt and libvirt brokers.


    # ### Native hardware support


    Embedded in the VMs Preferences menu is the option to connect to devices on the
    host, including the webcam and any attached USB devices. When toggled, the device
    shows up in the output of the dmesg command on the guest, like they should. However,
    only the USB drives connected to the host worked as advertised and appeared inside
    the VM without issues.


    # ### Integration with the host


    Once the VM is up and running, Boxes behaves pretty decently. The sound works
    inside the VMs without any issues and you can also copy and paste text between
    the host and VM. However, there’s no such option for conducting file transfers.


    # ### Overall


    Boxes is a very user-friendly option that supports all the essential features
    to help a virtualisation débutante experience the essential features of virtualisation
    without any of its hassles.


    ![](img/fb76008333fb7aef815b136f9f1afe5f_81_1.png)


    # ## **QEMU**


    The Vulcan’s virtualiser, which is a crude solution but effective


    ![](img/fb76008333fb7aef815b136f9f1afe5f_81_2.png)


    While it’s well documented, grappling with CLI utilities to create and control
    virtual machines isn’t everyone’s cup of tea


    # ### Usability


    QEMU has a rich set of features, but these come at the cost of usability. The
    application is essentially a command-line utility and a typical install dumps
    a huge subset of qemu-prefixed tools for emulating different architectures. Front-ends
    like Qemu Launcher and AQEMU do a good job of providing a graphical interface
    to many of QEMU’s advanced options.


    # ### Advanced features


    You can save and restore QEMU VMs without any issues. It also supports the emulation
    of various architectures, from 32-bit machines to SPARC and PowerPC. Besides its
    impressive hardware virtualisation features, QEMU can also do user-mode emulation
    to run apps created for one platform on an entirely different one.


    # ### Native hardware support


    QEMU VMs can interface with many types of physical hardware on the host, including
    audio interfaces and all types of USB devices. But this isn’t one of its strongest
    suits. Instead, you can use QEMU to emulate various kinds of peripherals for its
    wide range of supported architectures.


    # ### Integration with the host OS


    You can share folders from the host with the guest running inside QEMU, although
    you’ll have to mount them inside the guest manually. But that’s about all the
    integration you can expect, as there’s no support for sharing clipboards to copy
    and paste text or files between the virtual guest and the host.


    # ### Overall


    QEMU tips the scales in terms of advanced features, but barely registers on the
    usability scale. This is why it’s best suited for advanced virtualisation campaigners
    looking for flexibility.


    ![](img/fb76008333fb7aef815b136f9f1afe5f_81_3.png)'
