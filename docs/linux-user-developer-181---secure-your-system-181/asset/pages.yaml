  md: '# Review


    # Desktop virtualisers


    # In brief: compare and contrast our verdicts


    | | GNOME Boxes | QEMU | VirtualBox | Virt-manager |

    |---|---|---|---|---|

    | Usability | Easy to use, but with limited options to customise the virtual hardware.
    7 | Essentially a command line utility that first-timers can use via third-party
    graphical UIs. 5 | Uses a very approachable graphical interface that’ll appease
    all kinds of users. 8 | There’s barely a learning curve thanks to the intuitive
    VM creation wizard. 8 |

    | Advanced features | Can’t manage to rival the leaders in terms of features,
    but covers the basics. 7 | The number of advanced features is one area where the
    maturity of QEMU shines through. 8 | There’s no dearth of features here, though
    some require the proprietary extensions. 8 | This will woo advanced users with
    its extensive controls over virtual hardware. 7 |

    | Native hardware support | Boxes failed to connect any hardware on the host besides
    USB drives. 5 | The ability to interface with the host’s hardware is a clear weak
    spot for QEMU. 6 | Enables you to use all kinds of hardware attached to the host
    with ease. 8 | The commonly used peripherals on the host can also be used inside
    the VM. 8 |

    | Integration with the host OS | Sound inside the VM and copy and paste work without
    any issues. 7 | QEMU doesn’t offer much in terms of integration besides the ability
    to share folders. 6 | Besides clipboard and folder sharing, the Seamless mode
    deserves praise. 8 | Integration is one of the few areas where Virt-manager offers
    limited functionality. 7 |

    | Overall | If you use a GNOME desktop, it wouldn’t hurt to take Boxes for a spin.
    6 | Don’t begin your virtualisation adventures with QEMU, but it’s something to
    aspire to. 6 | Manages to edge out the competition even without the closed source
    component. 8 | Virtually as good as VirtualBox but without the shadow of proprietary
    extensions. 7 |


    # AND THE WINNER IS...


    # VirtualBox


    This is one of those group tests where the numbers are a little misleading. As
    per the ratings, VirtualBox manages to edge past Virt-manager. But if you use
    the Open Source edition of VirtualBox (sans the closed source extensions) you’ve
    got a real good battle on your hands. In several areas, like CLI support which
    is very useful for managing VMs from the terminal and provisioning machines from
    within scripts, virt-manager gives VirtualBox a run for its money. Then there’s
    customising the virtual hardware, which is a virt-manager specialty. For instance,
    in addition to the number of CPUs, virt-manager enables you to specify a CPU model
    for the guest from its large collection of supported models, from Pentium 3 and
    Opteron G5 to Haswell, Westmere and more. We’re also impressed by virt-manager
    being quite intuitive to use and scaling well, which makes it ideal for a large
    demographic.


    However, after a few lacklustre updates, VirtualBox once again picked up its game
    by incorporating parallelisation features. VirtualBox also boosts impressive VM
    performance and is packed with features.


    ![](img/fb76008333fb7aef815b136f9f1afe5f_83_0.png)


    The closed source extensions are a small price to pay for VirtualBox’s impressive
    features


    True, some of its really useful desktop-centric features depend on the closed
    source extension pack, but it’s a small price to pay from a pragmatic point of
    view.


    That said, while VirtualBox takes the crown, we’d still advise readers to give
    virt-manager a shot. If it does everything you need from a desktop virtualiser,
    then there’s really no need for anything else. In that sense, even GNOME users
    shouldn’t bypass Boxes just because it’s a simulation application compared to
    the others – it probably does enough to meet most users’ requirements.


    Mayank Sharma'
