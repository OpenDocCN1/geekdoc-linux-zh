  md: "# Review\n\nDebian 9\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_85_0.png)\n\
    \n![](img/fb76008333fb7aef815b136f9f1afe5f_85_1.png)\n\n# # **DISTRO** Debian\
    \ 9\n\n> *Above If the all-inclusive DVD seems like overkill, Debian also releases\
    \ various live CDs for different desktop environments, such as Xfce, MATE and\
    \ Plasma*\n\n> > The latest Debian release is an embodiment of all that the distribution\
    \ stands for – stability and longevity\n\n+   RAM\n+   1GB\n+   \n+   Storage\n\
    +   10GB\n+   \n+   Specs\n+   1GHz Pentium 4 processor\n+   \n+   Supports ten\
    \ major architectures such as ARM, 32- and 64-bit AMD/Intel\n+   \n+   Available\
    \ from www.debian. org/releases/stable\n\nAs one of the oldest surviving Linux\
    \ distros, Debian is a testament to the most endearing quality of the Linux ecosystem\
    \ – collaboration. The project works on three branches of development – Stable,\
    \ Testing and Unstable – and packages move from one to the next, as they mature.\
    \ The latest Stable release is the product of over two years of gruelling testing,\
    \ and the end result is an incredibly stable and reliable distro.\n\nAlong from\
    \ its slow-cooking release policy and vast software repositories, another feature\
    \ that distinguishes Debian from its peers is its software\n\npolicy. The distro\
