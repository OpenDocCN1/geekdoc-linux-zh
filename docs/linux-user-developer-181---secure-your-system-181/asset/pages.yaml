    \ From this moment on, any trainee will be able to connect to the internet and\
    \ to any open port on the Web Security Dojo domain, but they won't have connectivity\
    \ between them. Feel free to experiment with nwfilter rules (Again, see Resources).\n\
    \nFrom within your RAWADA VDI server, you can easily access any VM via its virtual\
    \ serial console. This will help you recover access to the VM in case the SPICE\
    \ connection stops working. This is described in the documentation (see Resources).\
    \ However, don't forget to set up the VM accordingly by adding \"console=ttyS0\"\
    \ to the grub.conf (/etc/default/grub on Debian-based systems) to make sure the\
    \ system will spawn a serial console on /dev/ttyS0 every time it boots up.\n\n\
    # Connection via virtual serial console\n\n# A bumpy road ahead of us ...\n\n\
    This is a great VDI project to start with. It is easy to install and set up and\
    \ can be deployed quickly. However, it still has important flaws (as of this writing)\
    \ that we hope will be fixed in upcoming releases. The database authentication\
    \ mechanism lacks pseudorandom per-user salt generation; the SPICE protocol is\
    \ not encrypted by default using a TLS channel (although, using TLS may decrease\
    \ the VDI performance). A pseudorandom four-character temporary password is also\
    \ generated to protect the remote SPICE connection to the desktop, which renders\
    \ RAWADA VDI prone to brute-forcing attacks. But for our testing purposes it is\
    \ perfect: you can start using it in order to deploy a whole pen-testing multi-user\
    \ environment. And for all those flaws we just mentioned, well, there's always\
    \ the possibility to create a git pull request! So, what are you waiting for?\
    \ Time to get involved and get training!\n\n> *Above Capture-the-flag scenarios\
    \ can be deployed using RAWADA VDI within minutes; whether web pen-testing or\
    \ binary exploitation, the sky is the limit!*"
