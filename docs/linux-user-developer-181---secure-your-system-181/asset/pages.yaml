    \n# Ensemble forecasting\n\nBecause the weather is a chaotic system, yet it's\
    \ impossible to measure the initial conditions of temperature, wind speed, humidity\
    \ and so on with infinite accuracy, long-range weather forecasting is tricky.\
    \ However, ensemble forecasting offers a partial solution because the weather\
    \ isn't always equally erratic. The approach involves solving the equations with\
    \ lots of slightly different values of the initial conditions and assigning a\
    \ confidence factor depending on how well they agree.\n\nAbove Chaoscope enables\
    \ you to play with the strange attractors – themselves fractal images – which\
    \ describe chaotic systems"
