    # Secure your system


    ![](img/fb76008333fb7aef815b136f9f1afe5f_19_0.png)


    To secure your machines, you must adopt a two-pronged strategy against potential
    attacks. The first involves preparing against intruders by installing a firewall
    and adopting better password policies. But this alone isn''t enough. It''s one
    thing to lock all the windows in your house, but you must still make sure no one
    got in before you closed them.


    # Secure logins


    Trusting passwords to hold all your data is foolhardy. To prevent unauthorised
    access to your machine, you can add an extra layer of authentication. One of the
    easiest methods is by using the Google Authenticator service, which issues a time-based
    authentication token to supplement the existing password challenge.


    You can configure the utility for all configured users on your Linux machine,
    and each will receive the OTP on their configured Android devices. Unless a user
    enters the token that quickly expires, they can''t log in. If you''ve configured
    your machine to allow remote logins, you can also configure Google Authenticator
    to work with SSH.


    To implement this multi-factor authentication with Google Authenticator, you''ll
    need the Google Authenticator PAM module. PAM stands for ''pluggable authentication
    modules'' - a mechanism for plugging different forms of authentication into a
    Linux computer.


    # Stronger passwords


    The libpam-pwquality tool is another such module that you can use to improve your
    passwords. Open the


    > Unless a user enters the token that quickly expires, they can''t log in


    /etc/pam.d/common-password file in your favourite text editor and identify the
    line that reads password [success=1 default=ignore] pam_unix.so obscure sha512.
    Add the minlen parameter to the end of the line if you want users to choose passwords
    with a minimum-length password [success=1 default=ignore] pam_unix.so obscure
    sha512 minlen=8.


    If you similarly want to ensure that users choose passwords with a mix of upper/lower-case
    letters and special characters, throw in parameters such as [credit=3 credit=2
    credit=2], which forces users to respectively use three lower-case letters, two
    upper-case letters and two digits. You can install it using the sudo apt install
    libpam-pwquality command from the terminal.


    # Check for rootkits


    The password tricks discussed here, coupled with using a firewall and regular
    system updates, are a good start to protecting your system, but hackers often
    employ other means to do you harm. A common attack strategy used by attackers
    is privilege escalation, wherein after


    # HOW TO

    Use the Gufw firewall


    ![](img/fb76008333fb7aef815b136f9f1afe5f_19_1.png)


    # 01 Enable the firewall


    Gufw is the graphical front-end for UFW, the uncomplicated firewall, which is
    one of the simplest front-ends for iptables. Fire up Gufw and change the Status
    toggle to On to enable the firewall. Gufw includes three profiles: public, office
    and home. The default is the home profile that denies all incoming traffic and
    allows all outgoing traffic. This will let you surf the internet without any issues.


    ![](img/fb76008333fb7aef815b136f9f1afe5f_19_2.png)


    # 02 Define policies


    You can alter the incoming and outgoing policies by selecting one of the three
    options in their respective drop-downs. The Allow option will allow traffic without
    asking any questions. The Deny option will silently discard packets, while the
    Reject option also sends an error packet to the sender. A good idea is to deny
    all incoming connections and then selectively enable the ones you wish to allow.


    ![](img/fb76008333fb7aef815b136f9f1afe5f_19_3.png)


    # 03 Preconfigured rules


    After you''ve set the policy for traffic, you can define specific rules for allowing
    traffic for individual apps and services. To create a rule, switch to the Rules
    tab and click on the ''Add'' button. Use the Application pull-down in the Preconfigured
    tab to select the application you want to allow and Gufw will define the most
    effective rule for that app. Then press the ''Add'' button to append the new rule.'
