    \ block.FLOWER_CYAN)\n```\n```\n\nAlong with working with blocks one at a time,\
    \ you can also work with a whole group of blocks together as one unit. For example,\
    \ you can create an entire wall of ten stone blocks with the following code.\n\
    \n```\n```\nmc.setBlocks(x, y, z, x+10, y, z, block.STONE.id)\n```\n```\n\nYou\
    \ can do the reverse and use the method getBlocks(), with a starting point and\
    \ end point, to get a list of block IDs for the blocks within that region. You\
    \ can then go through each one and do whatever action you want to program.\n\n\
    Along with creating and placing blocks, you can also interact with them in a more\
    \ direct manner. This is handled through events. An event occurs when a block\
    \ is hit by one of the players within a given world. You can get the details for\
    \ a given event through the following code.\n\n```\n```\ncurr_event = mc.events.\
    \ pollBlockHits()\n```\n```\n\nThis event object contains several properties that\
    \ you can access to see what is happening. The first property is the type of event.\
    \ Currently, the only event implemented is BlockEvent.HIT. The location of the\
    \ block affected by the event is available from the pos property. If it is important\
    \ for the kind of interactivity that you want to code, you can even find out which\
    \ face of the block was hit from the _face property. If you are in a multiplayer\n\
    \ngame, you can find out which player caused the event with the .entityId property.\
    \ You can have a block only act if a particular player hits a particular block\
    \ on a particular face. This can be put to great use in puzzle-type games.\n\n\
    To get a better look at all of the work you have been doing, you can play with\
    \ the camera settings in order to change your viewpoint into your Minecraft world.\
    \ You can use the following code to set the camera to a given location:\n\n```\n\
    ```\nmc.camera.setPos(x, y, z)\n```\n```\n\nIf you happen to be in a multiplayer\
    \ game and you want to have the camera follow one particular player, you can use\
    \ the following command to do just that.\n\n```\n```\nmc.camera.follow(playerID)\n\
    ```\n```\n\nYou’ll have to find the ID of the player in question first. Once the\
    \ camera is set, you can change the mode with the method mc.camera.setFixed().\
    \ You can reset it to the usual mode with the method mc.camera. setNormal(playerID).\n\
    \nTwo final methods that will be very useful allow you to save and restart sessions.\
    \ Before embarking on some extravagant test, you can use the following code to\
    \ save a checkpoint:\n\n```\n```\nmc.saveCheckpoint()\n```\n```\n\nYou can then\
    \ reset your world to this checkpoint with the next command:\n\n```\n```\nmc.restoreCheckpoint()\n\
    ```\n```\n\nThis way, you can really go wild with the ability to instantly undo\
    \ any damage that you caused. Hopefully this article has whetted your appetite\
    \ enough to dive into our Minecraft coding series (turn to page 72).\n\n# # What\
    \ else can you do?\n\nWhat we’ve covered here is a subset of the full API available\
    \ within the Minecraft world. If you want to instantly use code you’ve developed\
    \ within the Pi version, there are two projects you should investigate. Canarymod\
    \ and RaspberryJcice are add-ons that you can install in your Minecraft server.\
    \ You can then run your Python code directly, using the same API. To move beyond\
    \ this, you’ll need to install a couple of items. The first is a server that will\
    \ host the worlds that you wish to work with. You also need to install a separate\
    \ API in order to allow your server to be affected by your Python code. Once these\
    \ are installed, you can start to work with the API. For example, the following\
    \ code will teleport your player character.\n\n```\n```\nfrom mcpi.minecraft import\
    \ Minecraft\nmc = Minecraft.create()\nmc.player.setRelPos(x, y, z)\n```\n```\n\
    \nAs you can see, the actual methods used may vary a bit from those used in the\
    \ Pi version. Of course, other methods, such as setBlock() and getBlock() operate\
    \ the same way they do in the Pi version. There are many different Minecraft servers\
    \ available for you to work with. Two that you may have heard of are bukkit and\
    \ spigot. To use Python as a scripting language, in both cases, you’ll also need\
    \ to install a plug-in in order to have your Python code to run and use the Python\
    \ API. With all of this extra capability, you also have lots of extra scripting\
    \ language options. For example, because the core of the Minecraft server is written\
    \ in Java, you can use a Jython plug-in to allow you to write scripts that can\
    \ interact directly with the Java objects within the server. If you wanted to\
    \ use both your Pi and a PC-based server, you can have your Raspberry Pi connect\
    \ to the server. The Python console can connect with code like the following.\n\
    \n```\n```\nmc = Minecraft.create('192.168.1.1', 4711)\n```\n```\n\nThen, your\
    \ Python code will run within the world on the PC-based server. This really becomes\
    \ fun when you have a whole team of people working together (or against each other)\
    \ in a large single world. This is actually something to keep in mind. On a PC-based\
    \ server, the world is physically larger, meaning that your position values can\
    \ range to much larger values than those available if you are on a Pi-based server."
