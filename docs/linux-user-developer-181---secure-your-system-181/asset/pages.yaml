    system is at risk. As a further precaution, you can also disable or uninstall
    services that you don’t need. For instance, if you only have a single machine
    at home and haven’t configured it for printing, you don’t need CUPS or the Samba
    services.

    Another trick to employ is to opt for encryption. Most Linux distros nowadays
    allow you to encrypt your home folder during installation itself. You can also
    optionally use apps such as zu4uCrypt to configure encryption on your current
    installation.

    It’s important to not use dictionary words nor keywords such as qwerty or god111
