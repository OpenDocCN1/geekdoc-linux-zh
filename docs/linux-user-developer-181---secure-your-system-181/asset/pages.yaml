    even these changes should be enough to set your mind at peace.

    The first step is to choose the right distro. Sounds rather silly, but there’s
    a reason why you should give serious thought before settling on any Linux distro.
    You must consider whether the distro has a dedicated team working on pushing regular
    bug fixes and security updates. This is important, because in recent years many
    security weaknesses in popular Linux


