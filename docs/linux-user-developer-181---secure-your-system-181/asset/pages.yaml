  md: "# About WebSockets\n\nWebSockets are part of the HTML5 standard and have nothing\
    \ to do with Erlang. However, WebSockets offer bidirectional asynchronous sockets\
    \ that allow browsers to communicate with the external world, which also includes\
    \ programs written in Erlang! Being asynchronous means that WebSockets send data\
    \ out without necessarily waiting for a response. As Erlang is also asynchronous\
    \ by design, WebSockets are a perfect way to communicate with Erlang programs.\n\
    \nWhen developing an Erlang application that uses WebSockets, you need three components\
    \ for things to work: a web browser that will run some of the code, an Erlang\
    \ application (A) that executes some Erlang code and another Erlang application\
    \ (B) that can communicate with the WebSockets protocol. Erlang application A\
    \ contains the logic of the web app, whilst will do and the necessary Erlang code\
    \ for communicating with a database and so on. Erlang application B is what transfers\
    \ messages from Erlang application A to WebSockets and vice versa.\n\nYou can\
    \ find the RFC document for the WebSockets protocol at https://tools.ietf.org/html/rfc6455.\n\
    \nanother webpage named /hello_mochi to our application, which requires the editing\
    \ of the /.src/hwmochi_web.erl file we created earlier:\n\nThe most interesting\
    \ code of hwmochi_web.erl is the code that handles what the new supported URL\
    \ will do:\n\n```\n```erlang\n[\"hello_mochi\" ] ->\n    Req:respond({200, [{\"\
    Content-Type\", \"text/html\"}],\n        \"<h2 style='\\color:#057;'>Hello MochiWeb!</\n\
    h2>\\n\"});\n```\n```\n\n**Figure 7** shows the full Erlang code of the /.src/hwmochi_web.erl\
    \ file – most of it is automatically generated! **Figure 8** shows what a web\
    \ browser will display on the screen when served by the aforementioned Erlang\
    \ module. Please note that MochiWeb automatically generates a /hello_world URL\
    \ that you can delete if you want.\n\nYou can change the port number your HTTP\
    \ server will listen to by editing the /.src/hwmochi_sup.erl file. The next output\
    \ from the grep command shows the file and the line with the relevant code:\n\n\
    ```\n```bash\n$ grep -n 8080 ./src/*\n…/src/hwmochi_sup.erl:44:  web = web_specs(hwmochi_web,\
    \ 8080),\n```\n```\n\nAs you will understand by looking at the structure of MochiWeb\
    \ projects and Cowboy projects, they are very similar, which makes the lives of\
    \ the developers much simpler. You can find more information about MochiWeb at\
    \ https://github.com/mochi/mochiweb, but only practice will make you better at\
    \ using MochiWeb!\n\nSo, is it worth it learning Erlang just to create web applications?\
    \ The answer is without a doubt yes!\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_54_0.png)\n\
    \n*Above The Erlang code of useMochi.erl, where you tell MochiWeb which URLs it\
    \ will support*\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_54_1.png)\n\nmake\
    \ on this directory will compile the dummy project and allow you to start it by\
    \ executing the ./start-dev.sh script. So far you have a web server that listens\
    \ to port number 8080, which you can test by executing wget http://127.0.0.1:8080\
    \ in your Linux terminal. This will create an index.html file with the following\
    \ HTML code:\n\n```\n```html\n<!html>\n<head>\n<title>It Worked!</title>\n</head>\n\
    <body>\n    hwmochi running.\n</body>\n</html>\n```\n```\n\nThe previous code\
    \ can be found in the static HTML page /priv/www/index.html. So, we should now\
    \ make things a little more interesting. What we will do in a while is add\n\n\
    *Above The output from useMochi.erl, which implements a simple HTTP server using\
    \ the MochiWeb Erlang module*"
