  md: "# Tutorial\n\n# Linux essentials\n\n+   **Everything is a file**  \n+   Part\
    \ of the philosophy behind UNIX-like systems is that *everything is a file*. Even\
    \ the text that you type into a command prompt is treated like a file. Commands\
    \ like `grep` and `wc` do not terminate until they reach the end of their input\
    \ file. If you are typing input at the terminal instead, use `Ctrl+D` to mark\
    \ the end of input.\n\npower of the command line becomes apparent when we combine\
    \ two or more commands together using a device called a 'pipeline'. For example,\
    \ one way to count the number of files in the working directory is to run the\
    \ command:\n\n```\n$ ls | wc -l\n```\n\nIt's worth dissecting this in order to\
    \ see what each component does. The `ls` command is one we have seen already:\
    \ it prints out a list of all the files in the working directory. `wc` is short\
    \ for 'word count': `wc` is a completely separate program that takes in text as\
    \ input and returns the number of words, the number of lines and the number of\
    \ characters. If we use the command switch `-l`, then `wc` returns only the number\
    \ of lines of input.\n\nConnecting these two commands is the 'pipe' character,\
    \ `|`. The pipe means 'take the output of the previous command and pass it in\
    \ as input to the next command'. In this case, the output of `ls` is a line-by-line\
    \ list of the files in the working directory. The command `wc -l` counts the number\
    \ of lines in the output, which is the same as the number of files.\n\n# The UNIX\
    \ philosophy\n\nThe core command-line toolchain used by Linux is modelled on the\
    \ commands from the UNIX operating system, which dates from the early 1970s. UNIX\
    \ was designed to be both as lightweight and as powerful as possible; this goal\
    \ was eventually crystallised into the 'UNIX philosophy', which was summarised\
    \ in 1994 by Doug McIlroy as follows:\n\n> “Write programs that do one thing and\
    \ do it well. Write programs to work together. Write programs to handle text streams,\
    \ because that is a universal interface.”\n\nsuiated to scripting at the command\
    \ line. It means that UNIX programs are essentially boxes like the one in **Figure\
    \ 2** that take in some text as input and return some text as output. As we will\
    \ see, we can use the pipe character to combine these boxes together, as in **Figure\
    \ 3**.\n\nWe can combine more than two boxes together, if we want. To illustrate\
    \ this, let us introduce a new program, `grep`. This acts as a filter that prints\
    \ out only those input lines that match a certain pattern. For example, suppose\
    \ we wanted to count the number of files in a directory whose filename contained\
    \ the word 'email':\n\n```\n$ ls\nemail01.txt email02.txt email03.txt\nnobly10b.txt\
    \ work01.txt work02.txt\n\n$ ls | grep email\nemail01.txt\nemail02.txt\nemail03.txt\n\
    \n$ ls | grep email | wc -l\n3\n```\n\nHere, there are three files in the directory\
    \ whose name contains the pattern 'email'. The command `ls | grep email` will\
    \ print out those files that match the pattern 'email'. If we then pipe that output\
    \ through `wc -l`, we get the number of files in the directory whose name contains\
    \ the pattern 'email'. See **Figure 4** for an illustration of this combined command.\n\
    \n# Tying up the loose ends\n\nWhat happens to input and output at the 'ends'\
    \ of the pipe? To find out, let's try running the command `grep tuna` on its own;\
    \ you should now be able to type in words and press Enter. You may type a word\
    \ containing the pattern 'tuna', then it will be printed back; otherwise, nothing\
    \ will be printed. Press `Ctrl+D` to exit and go back to the command line.\n\n\
    ```\n$ grep tuna\ntuna\ntuna\nherring\nmackerel\nfortuanely\nfortunately\n```\n\
    \nIn this case, the input for `grep` comes from what is called 'standard input'\
    \ or `stdin`, and the output goes to 'standard output' or `stdout` (see **Figure\
    \ 5**). By default, `stdin` means text that the user types directly on to the\
    \ command line, while `stdout` means text that is printed out to the console.\
    \ Here, `grep tuna` matches the input lines 'tuna' and 'fortuanely', so prints\
    \ those lines out again, but it does not match the lines 'herring' or 'mackerel',\
    \ so it does not print out those lines.\n\nInstead of reading `stdin` and writing\
    \ `stdout` to and from the console, we can read and write to and\n\n# “Using pipelines\
    \ and file redirects, we are able to use modest commands to accomplish useful\
    \ work”\n\nThe first two parts of the philosophy are very similar to certain schools\
    \ of thought in programming, which mandate that functions or methods should be\
    \ as universal as possible, and should only do one thing. Indeed, we can see the\
    \ whole toolchain of UNIX programs as a specialised programming language – when\
    \ we come to talk about scripting, this will become even more apparent.\n\nThe\
    \ third part of the philosophy – that programs should handle text streams – makes\
    \ less sense in a general programming environment, but it is perfectly"
