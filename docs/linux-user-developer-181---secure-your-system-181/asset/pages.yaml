- pgno: 23
  md: '# Secure your system


    So far, we have discussed a number of tools and

    practices that you can adopt to secure your system

    and prevent attacks, but there’s still plenty more that

    you can do, depending on whether you’re interested

    in protecting your server or your network, or even a

    home workstation.


    The entire gamut of available solutions can very well

    lead to a troubling case of paralysis from analysis,

    which is why we listed some of the best protective

    tools. But there’s still more that various other projects

    and entities are working on to protect your machine

    from harm.


    ![](img/fb76008333fb7aef815b136f9f1afe5f_23_0.png)


    Below Nmap Front End (NmapFE) is a well designed and stable GUI

    that allows you to control almost every aspect of Nmap.


    The Linux Security Modules (LSM) framework

    allows the Linux kernel to support a variety of security

    modules to implement mandatory access control (MAC).

    SELinux and AppArmor are two of the most popular

    LSMs on Linux. While the former allows you to define

    the activities which can be performed by each user,

    process or daemon, AppArmor can be used to restrict

    each installed program using application-specific

    profiles. Container vendor Docker is also working on

    another LSM called Landlock, although it’s still at the

    nascent stage.


    Apart from these, there are a large number of

    updates that ship with each new Linux kernel which

    fix many identified issues to keep you safe. On top of

    that, the Kernel Self Protection Project was started to

    provide additional layers of security to the Linux kernel.

    You can also tweak a number of parameters on your

    kernel to bolster the security. Run **sysctl** – for a

    list of current kernel settings. You can save these to a

    file with: sysctl -a > /sysctl1.settings, which will

    enable you use the file for reference or comparisons

    if you make any changes.


    You can change these settings on your running kernel

    by editing the /etc/sysctl.conf file. On Linux Mint, the

    file already exists and contains a number of these

    settings, but they are disabled by default.


    One of the biggest risks to system security is from

    untested and unknown applications and you must

    take precautions to protect your system from such

    programs. One way to do that is through sandboxing.


    # HOW TO  Encrypt files with zuluCrypt


    ![](img/fb76008333fb7aef815b136f9f1afe5f_23_1.png)


    ![](img/fb76008333fb7aef815b136f9f1afe5f_23_2.png)


    ![](img/fb76008333fb7aef815b136f9f1afe5f_23_3.png)


    **01** **Encrypt individual files**

    Head to ZC > Encrypt A File. In the

    dialog box that pops up, click the button

    adjacent to the Source field and navigate

    to the file that you wish to encrypt. Then

    enter a password in the text box labelled

    Key. zuluCrypt will use this information to

    create a file with the same name, with the

    .zc extension at the end. Once a file has

    been encrypted, make sure you delete its

    original version.


    **02** **Decrypt files**

    Head to ZC > Decrypt A File. Point

    to the encrypted file in the Source field and

    after the location of the unlocked file in the

    Destination field. Now enter the password

    with which you encrypted the file and click

    the Create button. When it’s done, the

    decrypted file will be created in the specified

    destination. To lock the file again, encrypt it

    by following the outlined procedure outlined in

    Step 1.


    **03** **Create encrypted files**

    If you need to protect a number of

    files that you access frequently, a better

    approach is to file them inside encrypted

    storage areas. To create an encrypted

    storage device within a file, head to Create >

    Encrypted Container In A File. Then enter

    the name and complete parts of the directory

    along with its size, depending on the number

    of files it’ll house and the available space on

    your disk.


    ![](img/fb76008333fb7aef815b136f9f1afe5f_23_4.png)'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'This involves providing a compartmentalised environment to a script or app,
    so that the larger part of your installation remains protected.


    # Sandbox with chroot


    The oldest sandboxing tool in Linux, chroot can be used to change the root directory
    for a process. This prevents apps inside a chroot jail from accessing other directories
    or files. Containers such as Docker can similarly be used to run isolated application
    instances.


    If you''re spooked by the prospect of performing too many tasks to feel secure
    while connecting to the internet, consider using Subgraph OS. Based on Debian,
    the distro has been designed from the ground up, with a focus on security and
    privacy. It ships with a hardened Linux kernel, along with out-of-the-box sandboxing
    for applications, firewall and proxy.


    Despite all these tools, you must understand that attaining a completely secure
    system is an unachievable goal. This is because the process would require you
    to, in the words of Linus Torvalds:


    > "Unplug the network cable and instantiate draconian measures for physical security."
    There''s no golden rule for security that applies in every case, and even if there
    were, it would have been cracked already.


    Security is something that needs to be worked on and personalised. With the combined
    weight of all the tools discussed, you''ll get the three essential ingredients
    for good system security – prevention, protection and detection – and that''s
    the best anyone can hope for.


    ![](img/fb76008333fb7aef815b136f9f1afe5f_24_0.png)


    # HARDEN YOUR SYSTEM


    # Automated security hardening


    Security hardening involves poorly configured systems, from a security point of
    view, being identified and made to conform to security standards. This applies
    to the different layers of a system such as the network, where it''ll enable the
    firewall. On the software level, hardening involves removing packages with known
    issues, allowing only signed packages to be installed and so on.


    Ansible is a popular hardening tool that does all of the above and more. Note,
    however, that you''ll still need to update packages and install security updates
    manually. To install Ansible and run:


    ```

    pip install ansible

    ansible-galaxy install git+https://git. openstack.org/openstack/ansible-hardening

    ```


    # QUICK TIP


    # Encrypt files


    You can use the -x switch with Vim to encrypt the contents of the file so that
    others can''t read it unless they know the key phrase used for encryption.


    ![](img/fb76008333fb7aef815b136f9f1afe5f_24_1.png)


    # 04 Volume type


    When you click ''Create'', zuluCrypt pops up another window. Besides specifying
    a password, you''ll have to select a Volume Type from the pull-down menu. TrueCrypt
    or VeraCrypt volumes work best if you want to share the encrypted volume between
    Linux, Windows and macOS computers. For the other values such as the cipher and
    file system for the encrypted volume, you can safely stick with the default options.


    ![](img/fb76008333fb7aef815b136f9f1afe5f_24_2.png)


    # 05 Mount volume


    Before you can store files inside this encrypted volume, you''ll first have to
    decrypt and mount it. Head to Open > Volume Hosted in a File. Use the file button
    in the pop-up window to navigate to the encrypted container file. You can optionally
    enter the mount name for the file, else just enter the password and click ''Open''.
    Once your volume is mounted, it''ll appear in your file system like any other
    mounted file system.


    ![](img/fb76008333fb7aef815b136f9f1afe5f_24_3.png)


    # 06 Unmount after use


    You can now create directories within this mounted location and create files,
    just like you would on any regular mounted device. When you''re done, left-click
    on the mounted volume in the zuluCrypt interface and select ''Unmount''. This
    will unmount and encrypt the volume and all you''ll have once again is the single
    encrypted file with illegible content. Mount the file again following the procedure
    in **Step 5** to reveal its contents.'
  merge: -1
  img_proc: true
- pgno: 25
  md: "# Column\n\n# The problem of random\n\n# How random is your random?\n\nRandomness\
    \ lies at the heart of security. It can no longer be left to chance – it’s time\
    \ to pay attention\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_25_0.png)\n\n**Richard\
    \ Moulds**  \nis the general manager of Whitewood Security and is a 20-year veteran\
    \ of the security market with a focus on the deployment challenges associated\
    \ with cryptography.\n\n**R**andom numbers are really important. They’re used\
    \ in most computer processes. Mostly it doesn’t really matter if they are truly\
    \ random, but in some cases it’s a big deal. When it comes to statistical modelling,\
    \ gaming and security they need to be provably random. The most extreme requirement\
    \ for random numbers comes from cryptography. Random numbers are used to make\
    \ cryptographic keys where lack of randomness makes them easier to crack. But\
    \ making perfectly random numbers is much harder than you would expect.\n\nAny\
    \ applications that use SSL/TLS or SSH for network encryption, need true random\
    \ numbers. The same applies to PKI-based applications with digital signatures,\
    \ and specialist crypto applications, such as payments and cryptocurrencies that\
    \ are tightly regulated with strict compliance requirements. Weak keys not only\
    \ create vulnerabilities but are also extremely expensive to replace.\n\nBut where\
    \ do random numbers come from? Usually, the operating system. Whether an application\
    \ needs just a few bytes or many megabytes of perfect random or ‘nearby’ random\
    \ numbers, it all comes from the same place. Just like in your home, everything\
    \ that uses water generally gets it from the same water supply irrespective of\
    \ its need for quality or dealing size (see illustration, above). In short, critical\
    \ security applications compete with more mundane tasks for\n\n> “The problem\
    \ is that software doesn’t naturally act randomly”\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_25_1.png)\n\
    \n**/dev/random**  \nQuality flow: Delivers random numbers only if sufficient\
    \ entropy has been captured – otherwise it stops\n\n**/dev/urandom**  \nPoor quality\
    \ flow: Delivers random numbers irrespective of how much entropy has been captured\n\
    \nrandomness, which can be a serious issue if randomness becomes a scarce resource.\n\
    \nIt’s strange to think that randomness might be exhausted. The problem is that\
    \ software doesn’t naturally act randomly. Software is deterministic: it’s preprogrammed\
    \ and fundamentally predictable. Software-based random number generators are typically\
    \ called either pseudorandom number generators (PRNGs) or deterministic random\
    \ bit generators (DRBGs) – but both names imply something less than true randomness.\
    \ They use well-known algorithms to extrapolate relatively few random ‘seeds’\
    \ into large amounts of ‘random’ numbers. No matter how well a software PRNG is\
    \ designed, it can’t create\n\nrandomness itself. An analogy is an audio amplifier\
    \ that makes a song louder but not better.\n\nIf a PRNG is poorly seeded, the\
    \ output risks becoming predictable. Another analogy is dealing a pack of playing\
    \ cards. The PRNG is equivalent to the process of dealing the deck, whereas providing\
    \ the random seed equates to shuffling the deck; the randomness of the deal is\
    \ entirely dependent on the quality of the shuffle. PRNGs may suffer from error-prone\
    \ implementation or even intentional backdoors, but their core security depends\
    \ entirely on the randomness of the seeding process.\n\nLinux has two PRNGs; they\
    \ are similar but differ in one important way. The more secure of the two is /dev/random,\
    \ which is reseeded every time a random number is requested. As a safety measure,\
    \ /dev/random is only enabled if there is enough randomness to reseed it, which\
    \ in turn can lead to a big performance hit. The alternative PRNG, /dev/urandom\
    \ (the ‘u’ stands for ‘unblocking’), will supply ‘random’ numbers regardless of\
    \ whether it has been well seeded or not. Since /dev/urandom is always available,\
    \ it’s a popular but potentially unwise choice for developers.\n\nThis dependence\
    \ on reseeding raises obvious questions. Is there a reliable source of seeds and\
    \ how can you prove they’re truly random? How often does the PRNG need to be reseeded\
    \ to stay random? And how can you tell if something goes wrong and your random\
    \ numbers stop being random? Unfortunately, there are no reliable answers.\n\n\
    26"
  merge: -1
  img_proc: true
- pgno: 26
  md: 'The primary difference between good and bad randomness is entropy, the statistical
    measure of disorder. Data that has no bias, correlations or patterns is said to
    have high entropy. An 8-bit number might contain 5.2 bits of effective entropy.
    But entropy is only part of the quest for randomness. Random numbers must also
    be completely unpredictable. The digits of the number Pi (3.415926535897932384...)
    may appear random and do contain statistical entropy but are easily predicted.
    Proving randomness requires knowledge of how the data was originally generated
    and what sources of entropy were used.


    Fortunately, our world is full of entropy. But harnessing it for computer systems
    is not so simple. Developers have invented numerous ways to scavenge natural entropy
    from the physical world, the only place where it actually exists. Some capable
    user activity such as mouse movements and keyboard clicks, noise from microphones
    and even motion in lava lamps using cameras. Linux monitors the computer hardware
    for disk drive interrupts, CPU counters and timing jitter. None of these signals
    are perfectly random, but when combined they can approximate to acceptable randomness.


    Lack of entropy or attacks that corrupt entropy sources can be undetectable and
    to mitigate these threats, dedicated hardware devices can be used as supplementary
    entropy sources. Examples include USB tokens, hardware security modules (HSMs),
    embedded CPU features (e.g. Intel’s rdrand) and smart cards. These can really
    help, but the challenge is that specialist hardware raises its own issues. For
    example, USB tokens might be prohibited in corporate data centres and adding any
    sort of additional hardware might be impossible in public cloud or hosted environments.
    Particularly in highly virtualised environments or on resource- constrained IoT
    devices, we have a double whammy. Local entropy sources are likely to be poor
    and yet it’s hard or impossible to add extra hardware. Particularly in the case


    of containers and virtual machines, the absence of physical users and devices,
    such as hard drives, means that entropy gathering might depend entirely on poor-quality
    sources such as interrupts and counters.


    Virtualisation is a great concept from a DevOps perspective, but the hypervisor
    can create a virtual firewall for entropy, separating the virtual world where
    applications need randomness from the physical world where entropy actually exists.
    The lack of entropy in a virtualised environment becomes more serious when VMs
    are replicated as snapshots. Each snapshot can contain a copy of the same collected
    entropy and the same internal state of the software PRNGs – effectively the deck
    of cards is being copied after it has been shuffled. This makes frequent reseeding
    even more important.


    It’s inevitable that random number generation across the multitude of applications
    and devices in a typical enterprise is a picture of inconsistency and unknowns.
    The ability to source entropy is different for each application instance. The
    use of different server hardware, different operating system versions and presence
    (or absence) of individual users all introduce inconsistencies in the availability
    of entropy and therefore the quality of key generation – always a bad thing in
    the context of security. It creates areas of invisible weakness that attackers
    can exploit and it casts doubt on compliance assertions.


    The reality is that random number generation can best be described as a ‘local
    best effort’:


    +   *   If it were possible to generate keys, test their randomness and simply
    reject the ones that aren’t random, we could work around deficiencies in entropy
    gathering – but poor randomness is not something that can be easily detected.

    +   *   Entropy starvation can’t be addressed in a reactive way.

    +   *   Approaches to improve randomness mean that high-quality entropy sources
    must be architected into security systems from the outset and made widely available.
    In short, true random number generation needs to become a standard of due care.
    ■


    # Entropy on tap


    ![](img/fb76008333fb7aef815b136f9f1afe5f_26_0.png)


    Instead of relying solely on local entropy sources at each application instance,
    it is possible to deliver entropy over the network as a remote service. A shared
    entropy source can provide entropy on demand to many application instances that
    require an entropy boost. This service-oriented model enables local entropy levels
    to be monitored and maintained such that PRNGs within Linux are frequently and
    well seeded irrespective of what hardware the OS runs on, what virtualisation
    layers exist and whether or not there is user activity.


    The result is that /dev/random no longer blocks and /dev/urandom is sufficiently
    well seeded to be considered to be a true random number generator. The advantage
    is that applications and OS require no modifications. Applications continue to
    request random numbers and the OS continues to gather local entropy. The availability
    of supplementary entropy acts rather like a vitamin supplement – bringing assurance
    and consistency across populations of application instances.


    Network delivery of entropy relies on a secure communications channel and the
    ability to generate random seeds at volumes sufficient to service an entire data
    centre or fleet of IoT devices. It’s also important to establish high levels of
    confidence in the quality of that entropy and for this reason vendors will typically
    turn to quantum mechanics. Quantum-based entropy sources exploit random behaviour
    at the subatomic level. This behaviour is fundamentally random. In terms of deployment
    options, solutions exist as public cloud services and as on-premise systems to
    establish in-house, private entropy services.


    Over time it’s possible that network-based entropy services will be considered
    as a basic requirement for secure data centres. As a threat utility, entropy-as-a-service
    mitigates the threat of entropy starvation in virtualised environments and other
    situations where the availability of entropy is either unreliable, of poor quality
    or simply unknown. It’s an attempt to ensure that all application instances have
    access to true random numbers independently of the hardware and physical environment
    and that they can therefore generate keys of the highest security.


    You can try entropy-as-a-service for free by signing up with www.getnetrandom.com
    – download the Linux agent and automatically start streaming true quantum entropy.'
