  md: '# Fun with fractal geometry and chaos theory


    Join us on a journey of discovery into the bizarre, beautiful and infinite world
    of fractals and chaos


    ![](img/fb76008333fb7aef815b136f9f1afe5f_43_0.png)


    **Above** If the two-dimensional Mandelbrot set is fascinating, its 3D cousin
    the Mandelbulb is even more captivating


    According to the charity National Numeracy, it''s socially acceptable in the UK
    to admit that you can''t do maths, and it''s even seen by some as a badge of honour
    in marking you out from mad scientists, nerds and the socially inept. It''s perhaps
    not too surprising, therefore, that the UK is only 26th in the international league
    table for maths, as published by the OECD. This is surely a depressing statistic
    since skills in maths are essential for the individual''s everyday life and employment
    opportunities, as well as the country''s performance in the international marketplace.


    While we feel confident that Linux users are among the more numerically literate
    in society, we have less confidence that many of our readers actually find maths
    exciting. It doesn''t have to be that way, though. To further your voyage of discovery,
    therefore, and to prove that maths can indeed be fun, we''re introducing a branch
    of mathematics that can be truly fascinating and which you can delve into either
    by programming or by using a variety of free software. This branch of maths is
    fractal geometry and the closely related field of chaos theory. If this is new
    to you, prepare to be amazed.


    # Fractal geometry


    Fractal geometry is a relatively new branch of maths which can trace its origins
    back to the 1960s, when mathematician Benoît Mandelbrot posed the question "How
    long is the coast of Britain?" It transpires that the answer to the question depends
    on the length of the ruler you use to measure it – the shorter the ruler, the
    longer the coastline. This is because a coastline, like lots of natural forms,
    has ever more detail at smaller scales. The'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'mathematical term for this is self-similarity at multiple scales and is a simple
    definition of a fractal. With real-world objects, this self-similarity runs out
    of steam at the molecular and atomic levels, but a true mathematical fractal exhibits
    either exact or approximate self-similarity at all levels. In other words, it
    goes on forever as you continue to zoom in on it.


    The first fractals were devised before the term fractal geometry was coined and
    were only recognised as such when mathematicians turned their attention to fractals
    in the 1960s and 1970s. A classic example is the Sierpinski gasket, a type of
    fractal that is referred to as an iterated function system (IFS) fractal. It’s
    easily generated with just a few lines of code. Start off with a solid (ie, filled
    in) equilateral triangle. Now, by joining the centre points of the three edges,
    divide it into four smaller equilateral triangles and remove the centre one. Next,
    do the same with the three remaining solid triangles, dividing them each into
    four smaller triangles and removing the centre one. Continue in this way until
    you get an effect you find pleasing or until you get bored, but bear in mind that
    to get a true Sierpinski gasket you’d have to continue forever.


    Moving on from the Sierpinski gasket, you might like to delve into other IFS fractals
    including the Sierpinski carpet, the Sierpinski pentagon, the Koch snowflake and
    the dragon curve; you’ll find no shortage of information online. And if you fancy
    some 3D solid modelling, there are even three-dimensional versions of some of
    these fractals, including the Sierpinski pyramid and the Menger sponge.


    Alternatively, there’s plenty of free and sometimes open source Linux software
    that can generate these and other IFS fractals. A good starting point would be
    the IFS Fractal plug-in for the free GIMP imagine manipulation package (https://www.gimp.org),
    which you’ll find in the image window menu under Filters > Render >


    ![](img/fb76008333fb7aef815b136f9f1afe5f_44_0.png)


    it’s not at all obvious that this process will generate genuine fractals. What’s
    more, this process produces fractals that are infinite in their nature but which
    have a degree of unpredictability as you zoom in on them.


    The most famous escape-time fractal is surely the Mandelbrot set – let’s see how
    it’s generated. Generating the Mandelbrot set involves working with complex numbers.
    As a quick reminder, these are numbers that have a real and an imaginary part;
    for example, 2 + 0.5i where i is the square root of minus 1. If this is still
    a mystery to you, we’ll have to leave you to read up on the subject, but it’s
    really not as difficult as you might fear.


    # Picturing the Mandelbrot set


    To generate an image of the Mandelbrot set, we need to carry out a test on all
    complex numbers (actually, you only need to consider points between -2.0 and +0.5
    on the real axis and between -1.2i and +1.2i on the imaginary axis), marking the
    results on the complex plane. The test is simple: Start with zero, square it,
    and add the complex number being tested. If the result has a modulus of two or
    more (the modulus is the distance from the zero point on the complex plain), then
    the point isn’t in the Mandelbrot set. If it’s less than two, do the same again;
    that is, take that result, square it and add the value being tested. Again, if
    the result has a modulus of two or more, it isn’t in the Mandelbrot set; but if
    it’s less than two, carry on the calculation again and continue in this way. Some
    points, those that aren’t in the Mandelbrot set, soon exceed a modulus of two
    and head off towards infinity. Other points, those that are in the Mandelbrot
    set, remain close to zero however many times you repeat this operation (in practice,
    though, an arbitrary number of iterations, commonly 20, is used).


    > Writing code to draw the Mandelbrot set is simple enough, although providing
    a user interface to allow zooming is a bit trickier


    **Nature > IFS Fractal.** In addition to generating very geometrical-looking IFS
    fractals, this software also lets you experiment with less regular fractals which,
    although rigorously defined, can produce apparently natural forms such as trees
    and plants.


    While IFS Fractals might make attractive images and have the appeal of the infinite,
    it’s not exactly surprising that they are self-similar at all levels of magnification
    given the way they are generated. However, as we turn our attention to the escape-time
    fractal, although we repeat some mathematical function over and over again,'
