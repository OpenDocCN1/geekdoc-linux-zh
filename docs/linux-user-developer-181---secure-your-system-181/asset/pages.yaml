- pgno: 86
  md: "![](img/fb76008333fb7aef815b136f9f1afe5f_86_0.png)\n\nAbove The latest release\
    \ features some key changes to default software, such as MariaDB replacing MySQL\
    \ and an updated version of GNU PG (2.1)\n\n> As a result of its long testing,\
    \ Debian doesn't feature cutting-edge software, but even that is a good thing\
    \ for the Linux ecosystem\n\nDebian release marks a return of the two beloved\
    \ Mozilla applications as the dispute was finally resolved. Mozilla conceded that\
    \ Debian's changes and updates to its products conformed with Mozilla's exacting\
    \ quality standards. The trademark dispute which led to the birth of Iceweasel\
    \ was also resolved with the release of Firefox logo under a free licence. \n\n\
    The release also features some changes that are especially relevant for existing\
    \ users. Network interface cards (NICs) are now named using BIOS/firmware and\
    \ slot number. Your Ethernet and wireless cards, for instance, will now be named\
    \ as ens0 or wlP3s0 respectively. This is significant if you have scripts that\
    \ reference a NIC by name, as you will have to edit these to provide the new names.\n\
    \nFor administrators, the release ships with MariaDB, which replaces MySQL as\
    \ the default database server. Security is a key focus of the latest release:\
    \ Debian 9 features the modern branch of the popular security app GNU PG. Although\
    \ now deprecated, the older version of GNU PG is still available for users as\
    \ gnupg1; however, the newer branch brings with it improved smartcard support\
    \ and better defaults for generating keys. While support for UEFI-enabled machines\
    \ was introduced in the previous release, Debian 9 live images now also support\
    \ UEFI-booting. The distro can now be configured such that the X display system\
    \ no longer requires root privileges to run. To use the feature, however, you\
    \ will need logind, libbam-systemd and the gdm3 display manager. \n\nThe latest\
    \ release also features upgrades to underlying software such as the Linux kernel,\
    \ desktop environments and everyday applications such as LibreOffice. As a result\
    \ of its long testing, Debian doesn't feature cutting-edge software, but, in a\
    \ sense, even that is a good thing for the Linux ecosystem as otherwise users\
    \ would have no reason to venture near the likes of Ubuntu, Mageia, Mint and the\
    \ others.\n\nYou can use this month's cover disc to try the Xfce version; GNOME\
    \ is the default desktop environment, but there's also the option of MATE. The\
    \ latest release marks a shift to a graphical installer as the default, but you\
    \ can still opt for a curses-driven installation. Out of the box, the distro offers\
    \ enough applications to serve home users and hobbyists. If you have a more specific\
    \ use in mind, you will have to flesh out the distro.\n\nShashank Sharma\n\n#\
    \ Pros\n\nThe gruelling testing produces an incredibly robust and stable distro,\
    \ which can be used for any purpose due its vast repos.\n\n# Cons\n\nIt features\
    \ older versions of software than its peers. Try Testing or Unstable if you're\
    \ interested in the cutting-edge.\n\n# Summary\n\nDedicated to its late founder\
    \ Iain Murdock, Debian 9 builds on the past releases. The long testing results\
    \ in install-and-forget stability in a robust distro and don't mind the dated\
    \ packages as a result of its slow release cycle, there's no beating Debian.\n\
    \n![](img/fb76008333fb7aef815b136f9f1afe5f_86_1.png)"
