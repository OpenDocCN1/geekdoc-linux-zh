    # **INTERVIEW LINUX MINT**


    # # The people''s distro


    Linux Mint has grown from a cool idea for a domain name to the most community-focused
    Linux distros. After another Mint release has been plucked from the development
    fields, we speak to its founder Clément "Clém" Lefebvre


    ![](img/fb76008333fb7aef815b136f9f1afe5f_11_0.png)


    ![](img/fb76008333fb7aef815b136f9f1afe5f_11_1.png)


    **Clément Lefebvre**

    is the Linux Mint project

    leader and a former developer

    at Ericsson. He fronts the

    most popular community-led

    Linux distribution on the

    second largest user base

    for a desktop Linux distro

    (unofficially, as concrete stats

    are hard to come by) after the

    company-backed Ubuntu.


    Above While still based on Ubuntu 16.04 LTS, Linux Mint Cinnamon is the latest
    flagship distro from the Mint ecosystem


    > “ There''s been a flurry of activity on the Linux Mint website (www.linuxmint.com)
    in recent days as a succession of blog posts herald the release of four spins
    of Linux Mint 18.2 Sonya (reviewed, p32), one of which uses its officially supported
    desktop environment, Cinnamon, while the others are MATE, KDE and Xfce. This release
    adds a host of features (See What''s New in Linux Mint?, p28), such as better
    Bluetooth support and a new display manager, LightDM. During this hectic time,
    we spoke to Clément ''Clém'' Lefebvre about the progress of the freshest distro
    around.


    How did Linux Mint come to be and what is its aim?

    I started in 2006. I was writing for http://linuxforums.org and I wanted to host
    some of my articles myself. I needed a domain name and I chose ''linuxmint.com''.
    It was short and it conveyed the idea of freshness and technology that just works.
    That''s where the name came from: it was the domain name for a collection of articles,
    reviews and tutorials dedicated to Linux.


    At the same time, I had been reviewing distributions for a while and tinkering
    with a lot of things, so I had good knowledge of how they worked and what I liked
    or didn''t really like in each one of them. At some stage I got something out
    and I wrote a bit about it on linuxmint.com. I was surprised by the feedback I
    got and a few months later it was clear people were more interested in that little
    project than in my articles.


    There was no plan to create a new distribution initially, and certainly not one
    that could rival the likes of Microsoft Windows, Apple macOS or even the established
    Linux distros. People showed interest in what I was doing and so I responded to
    that. By the time version 2.1 came out, the goal had changed and this was no longer
    an experiment. It had a large audience, it worked really well and it gave people
    something they couldn''t find elsewhere. I'
