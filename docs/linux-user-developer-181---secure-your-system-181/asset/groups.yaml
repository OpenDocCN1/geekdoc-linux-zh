    ## GNOME Boxes

    它并不是你可能预期的那种“百宝箱”


    ![](img/fb76008333fb7aef815b136f9f1afe5f_81_0.png)


    在某些发行版中，Boxes 提供“快速安装”选项，用于预配置虚拟机，例如创建用户。


    ### 易用性

    这款虚拟化软件拥有非常友好的界面。要创建新的虚拟机，你可以输入 URL，应用将从中获取镜像并以此启动，或者指向本地可用的 ISO 文件。然而，该应用提供的自定义选项非常有限，你只能调整
    RAM 数量和其可占用的最大磁盘大小。


    ### 高级功能

    如果 Boxes 在计算机上发现其他由 libvirt 管理的虚拟机，你会获得导入它们的选项。它还可以克隆虚拟机，并允许你一键创建快照，之后可以轻松重命名并回滚到该快照。此外，你可以将
    Boxes 指向远程 VNC 服务器或 oVirt 和 libvirt 代理。


    ### 原生硬件支持

    在虚拟机的偏好设置菜单中，内置了连接宿主机的选项，包括摄像头和所有连接的 USB 设备。切换该选项后，设备会像预期那样出现在客户机 dmesg 命令的输出中。然而，只有连接到宿主机的
    USB 驱动器如宣传那样正常工作，并毫无问题地出现在虚拟机内部。


    ### 与宿主机的集成

    一旦虚拟机启动并运行，Boxes 表现相当不错。虚拟机内的声音工作正常，没有问题是，而且你还可以在主机和虚拟机之间复制粘贴文本。然而，没有进行文件传输的选项。


    ### 总体评价

    Boxes 是一个用户友好的选择，支持所有基本功能，帮助虚拟化新手体验虚拟化的核心功能，而无需面对其中的麻烦。


    ![](img/fb76008333fb7aef815b136f9f1afe5f_81_1.png)


    ## QEMU

    Vulcan 的虚拟化软件，这是一个粗糙但有效的解决方案。


    ![](img/fb76008333fb7aef815b136f9f1afe5f_81_2.png)


    虽然文档完善，但使用 CLI 实用工具来创建和控制虚拟机并非人人乐事。


    ### 易用性

    QEMU 拥有丰富的功能集，但这以牺牲易用性为代价。该应用本质上是一个命令行工具，典型安装会倾倒大量以 qemu- 为前缀的工具子集，用于模拟不同的架构。像
    Qemu Launcher 和 AQEMU 这样的前端很好地为 QEMU 的许多高级选项提供了图形界面。


    ### 高级功能

    你可以毫无问题地保存和恢复 QEMU 虚拟机。它还支持模拟各种架构，从 32 位机器到 SPARC 和 PowerPC。除了令人印象深刻的硬件虚拟化功能外，QEMU
    还可以进行用户模式模拟，以在完全不同的平台上运行为另一个平台创建的应用程序。


    ### 原生硬件支持

    QEMU 虚拟机可以与宿主机上的许多类型物理硬件交互，包括音频接口和各种 USB 设备。但这并不是它最擅长的领域。相反，你可以使用 QEMU 为其广泛支持的架构模拟各种类型的外设。


    ### 与宿主操作系统的集成

    你可以将主机上的文件夹共享给在 QEMU 中运行的客户机，尽管你必须手动在客户机内挂载它们。但这几乎就是你能预期的所有集成，因为没有支持在虚拟客户机和主机之间复制粘贴文本或文件的剪贴板共享功能。


    ### 总体评价

    在高级功能方面，QEMU 占据了优势，但在易用性方面几乎未得分。这就是为什么它最适合那些寻求灵活性的高级虚拟化爱好者。


    ![](img/fb76008333fb7aef815b136f9f1afe5f_81_3.png)


    ## VirtualBox

    其“功能全能”的方法赢得了众多粉丝。


    ![](img/fb76008333fb7aef815b136f9f1afe5f_82_0.png)


    - VirtualBox 中可用的虚拟网络基础设施是虚拟化中最有趣的功能之一


    ### 易用性

    VirtualBox 使用简短的向导引导用户自定义虚拟机的基本元素。创建后，你可以选择开机或调整其虚拟硬件的设置。虚拟机设置窗口包含有用的选项，例如为虚拟机手动选择半虚拟化接口的能力。


    ### 高级功能

    该应用功能极其丰富。它可以对虚拟机进行快照和克隆，你还可以相对轻松地导入和导出虚拟设备。VirtualBox 还可以进行端口转发，让你能在虚拟机内运行服务器。然而，对于其某些高级功能，如磁盘映像加密，你需要依赖专有扩展模块。


    ### 原生硬件支持

    这是 VirtualBox 的另一个亮点。它支持 SSD 和光盘的直通模式，并且是少数让虚拟机内的应用使用主机 3D 硬件的选项之一。其 USB 支持让你能够访问主机上的各种外设，你可以运行高分辨率的虚拟机，并将其分布在连接到主机的多个监视器上。


    ### 与宿主操作系统的集成

    使用 VirtualBox，你可以共享剪贴板和文件夹，并可以配置为自动挂载。值得一提的是其无缝模式，在这种模式下，你可以让虚拟化的应用程序与主机桌面上的应用程序并排运行。


    ### 总体评价

    凭借其独特的高级功能和易用性的结合，VirtualBox 提供了足够的内容，以满足经验丰富的和非经验丰富的用户。


    8


    ## Virt-manager

    在顶尖行列中表现出色，但 Red Hat 的产品有很多值得推荐之处。


    ![](img/fb76008333fb7aef815b136f9f1afe5f_82_1.png)


    - 虽然 virt-manager 主要创建 KVM 虚拟机，但它也可以管理 Xen 和 LXC 容器


    ### 易用性

    Virt-manager（全称为虚拟机管理器）使用相当直观的向导来创建新的虚拟机。该应用覆盖的范围足够广，让系统调优者有充分的空间个性化他们的虚拟机，同时使用合理的默认值帮助初次用户顺利操作。该应用的主界面显示所有虚拟机的列表，如果其中有一个在运行，它还会显示其实时资源使用统计。


    ### 高级功能

    Virt-manager 应用为某些硬件部件提供细粒度控制，这将吸引高级用户。它可以克隆虚拟机并在一台主机与另一台主机之间迁移它们，你还可以导入 QEMU
    写时复制图像。


    ### 原生硬件支持

    在虚拟机内部，声音开箱即用，显示器可以扩展至全屏。该虚拟化还支持连接 USB 设备的能力，包括可移动驱动器、摄像头和连接到主机的蓝牙设备，所有设备都能在客户机中无缝工作，没有任何问题。


    ### 与宿主操作系统的集成

    一旦你在主机和客户虚拟机内部都安装了 spice-vdagent，你就可以在虚拟机和主机之间复制粘贴文本。然而，你无法以相同方式移动文件，并且与 VirtualBox
    不同，没有额外的客户机扩展或类似的扩展来启用此类功能。


    ### 总体评价

    Virt-manager 拥有你想要的所有常用功能。这些功能通过直观的界面展现，使该应用无论用户技能水平如何，都让人愉悦地使用。


    7


    ## 评测

    ### 桌面虚拟化软件

    #### 简评：比较我们的结论


    | | GNOME Boxes | QEMU | VirtualBox | Virt-manager |

    |---|---|---|---|---|

    | 易用性 | 易于使用，但自定义虚拟硬件的选项有限。 7 | 本质上是一个命令行实用工具，初学者可通过第三方图形 UI 使用。 5 | 使用非常易上手的图形界面，可满足所有类型的用户。
    8 | 得益于直观的虚拟机创建向导，几乎没有学习曲线。 8 |

    | 高级功能 | 在功能方面无法与领导者竞争，但涵盖基础功能。 7 | QEMU 的成熟度在高级功能数量这一领域得到了体现。 8 | 这里功能并不匮乏，尽管有些需要专有扩展。
    8 | 这将以其对虚拟硬件的广泛控制吸引高级用户。 7 |

    | 原生硬件支持 | 除了 USB 驱动器外，Boxes 未能连接主机上的任何硬件。 5 | 与主机硬件交互的能力是 QEMU 的一个明显弱点。 6 | 让你能够轻松使用连接到主机的各种硬件。
    8 | 主机上常用的外设也可以在虚拟机内使用。 8 |

    | 与宿主操作系统的集成 | 虚拟机内的声音和复制粘贴工作正常，没有任何问题。 7 | 除了共享文件夹的能力外，QEMU 在集成方面提供的并不多。 6 |
    除了剪贴板和文件夹共享，无缝模式值得称赞。 8 | 集成是 Virt-manager 提供功能有限的少数领域之一。 7 |

    | 总体评价 | 如果你使用 GNOME 桌面，不妨让 Boxes 试试看，没有坏处。 6 | 不要用 QEMU 开始你的虚拟化之旅，但它是值得追求的目标。
    6 | 即使没有闭源组件，它也能略胜一筹。 8 | 几乎与 VirtualBox 一样好，但没有专有扩展的阴影。 7 |


    ## 获胜者是...

    ### VirtualBox

    这是那种分数有点误导人的团体测试。根据评分，VirtualBox 勉强领先于 Virt-manager。但如果你使用 VirtualBox 的开源版本（不含闭源扩展），你就拥有一场真正的激烈较量。在许多领域，如
    CLI 支持，这对从终端管理虚拟机和从脚本内供应机器非常有用，virt-manager 让 VirtualBox 难以招架。还有定制虚拟硬件，这是 virt-manager
    的专长。例如，除了 CPU 数量之外，virt-manager 允许你从其庞大的支持模型集合中为客人指定 CPU 模型，从 Pentium 3 和 Opteron
    G5 到 Haswell、Westmere 等。我们也对 virt-manager 的使用直观性及其良好的扩展性印象深刻，这使其适合庞大的人群。


    然而，在几次表现乏力的更新之后，VirtualBox 通过整合并行化功能再次找回了状态。VirtualBox 还提升了令人印象深刻的虚拟机性能，并功能丰富。


    ![](img/fb76008333fb7aef815b136f9f1afe5f_83_0.png)


    闭源扩展为 VirtualBox 令人印象深刻的功能所支付的代价很小。


    诚然，其一些真正有用的以桌面为中心的功能依赖于闭源扩展包，但从实用主义的角度来看，这是一个很小的代价。


    话虽如此，尽管 VirtualBox 夺得桂冠，我们仍建议读者尝试 virt-manager。如果它能做到你需要桌面虚拟化软件做到的一切，那么真的不需要其他任何东西。在这个意义上，即使是
    GNOME 用户也不应仅仅因为 Boxes 是模拟应用（相对于其他）就绕过它——它可能足以满足大多数用户的需求。


    Mayank Sharma

