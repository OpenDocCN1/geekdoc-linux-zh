    # Column


    # Python


    # Build with Minecraft


    This issue, we will look at how to use Python to do really cool things within
    Minecraft on your Raspberry Pi


    ![](img/fb76008333fb7aef815b136f9f1afe5f_77_0.png)


    **Joey Bernard**

    is a true renaissance man. He splits his


    time between building


    furniture, helping


    researchers with


    scientific computing


    problems and writing


    Android apps.


    # Why

    Python?


    It''s the official

    language of the

    Raspberry Pi.

    Read the docs at

    www.python.org/doc


    # Minecraft has been a huge

    gaming environment for

    some time now. What

    many Minecrafters may


    not know is that there is a version of

    the Minecraft server that runs on

    Raspberry Pi. Even fewer may know

    that there is a Python engine buried

    down in there that you can write

    code for and get it doing some really

    weird and wonderful things. This

    issue, we''ll look at how to get started

    writing Python code and interacting

    with your Minecraft world.

    We''ll assume you have a Pi 3 to

    work on for the rest of this article.

    The first step is to get Minecraft


    installed on your Raspberry Pi,

    although it''s built in to the latest

    version of the Raspbian OS. To install

    Minecraft, use the command:


    ```

    sudo apt-get install

    minecraft-pi

    ```


    You can start up Minecraft from

    either the desktop Programming

    menu or a Terminal window with the

    minecraft-pi command. You

    can then click on ‘Start Game’ and

    then ‘Create New’ to get a new

    world up and ready. If you wanted

    to use Minecraft in the usual way,

    you could stop here and go start

    building in this new world. But we''ll

    be programming it!


    In order to write Python code

    within this new world you created,

    you need to open a Python console:

    open Programming > Python 3 (IDLE).

    Let''s start off with a simple Hello

    World program:


    ```

    from mcpi.minecraft import

    Minecraft

    ```


    ```

    mc = Minecraft.create()

    mc.postToChat("Hello World")

    ```


    The first step is to import the

    Minecraft class, and then

    instantiate a new object connected

    to the current game. The last line

    displays the text ‘Hello World’ in the

    chat window. If you are using the

    Shell console, each line of Python

    code gets executed as soon as you

    hit Enter. If you have longer chunk

    of code you want to write, you can

    open a file to write your code into.

    Then, you can have the entire block

    executed when you save the file and

    then hit F5 to run it.


    > “You can interact with blocks

    > which make up the world”


    The first thing you will likely want

    to do is to interact with your player

    character within the game. You can

    got your character''s position with

    code like the following:


    ```

    curr_pos = mc.player.getPos()

    ```


    The returned position object

    contains values for x, y and z.

    You could also do simultaneous

    assignment to three variables so that

    you get the three separate values

    immediately. Along with getting the

    current position, you can set the

    position of your character with the

    following command:


    ```

    x, y, z = mc.player.getPos()

    mc.player.setPos(x+100, y, z)

    ```


    This jumps the player character 100

    spaces to the side. In the Minecraft

    world, the directions along the

    ground are labelled by x and z,

    whereas the y coordinate gives you

    a location up and down into the air.

    Be careful with that y coordinate.


    You may end up teleporting far up

    into the sky and then plummeting

    back down to the ground. Don''t

    forget about gravity.


    Along with the ability to move

    your character, you can interact with

    blocks which are what make up the

    world you are inhabiting. The most

    basic method available is the

    setBlock() method. For example,

    the following code would place a

    stone block beside you:


    ```

    mc = mc.getPos()

    mc.setBlock(x+1, y, z+1, 1)

    ```


    The parameters are the x, y and

    z locations values, along with an

    ID indicating what kind of block is

    to be created. The most common

    blocks are:


    +   •  0 air

    +   •  1 stone

    +   •  2 grass

    +   •  3 dirt


    While you could use these raw ID

    numbers, there is a block class that

    provides an easier way to work with

    Minecraft blocks. You could do the

    same setBlock() command from

    above with the following code.


    ```

    from mcpi import block

    mc.setBlock(x+1, y, z+1,

    block.STONE_id)

    ```


    There are equivalent parameters

    for the other types of blocks

    available. There are also other

