    # 树莓派项目


    # Jannis Hermanns


    是 www.pimopel.com 的软件工程师，他放弃了风筝冲浪和篮球的爱好，转而照顾一群孩子和树莓派。


    # 喜欢吗？


    毫不意外，对 Mac 的怀旧情感和当代创客运动的维恩图有一个交集，其中充满了项目。Jannis 最喜欢的之一是 März Jonasson 的 NESMAC，这是一台内部装有树莓派的老款
    Macintosh Classic（https://youtube.com/PtPbUlf8）。


    # 延伸阅读


    为了了解采访中提到的 gitbox 和 weatherbox 项目，或者 Jannis 的任何项目，请访问他的网站：https://janni.is。在他的
    Ghost 博客上，你可以找到关于乐高经典 Macintosh 的完整介绍。你还可以在推特上关注他：@jannis。


    # 乐高经典 Macintosh


    这款用乐高重建的老式 Mac 是当代技术与童年怀旧感的迷人结合


    ## 什么启发了你的项目？


    我的几乎所有副项目都源于解决某个痛点。在过去，那大多是软件——从 2000 年代初期名为 S9y 的博客软件开始，到最近的一款名为 Gym Hero 的 iOS
    健身追踪应用 [...]。乐高经典 Macintosh 是我的第一个硬件项目，它始于我住在柏林并骑自行车上班，我想要一个厨房小显示屏来告诉我天气情况。我买了两个小显示屏和一个树莓派，让它们分别显示客厅的二氧化碳浓度和露台的当前温度。然后我意识到，这对我早上决定是否穿上优雅的雨中骑行服帮助不大。


    ## 你当时挑选那个特定的电子墨水显示器是怎么考虑的？


    由于我需要更大的屏幕空间来显示当天的天气状况，我研究了适合树莓派的显示类型。虽然有很棒的高 PPI 彩色显示屏，但我选择了电子墨水显示器 [...] 厨房天气显示屏只需要每隔一分钟更新一次，而缺乏颜色使得设计信息展示方式更加简单。电子墨水显示器的巨大优势在于其无干扰性；它们看起来不像电脑，而且在黑暗中不会发光。那简直完美
    [...]。我实际上买了两种不同尺寸的，并在这个项目中使用了较小的那个。另一个是 Waveshare 的 4.3 英寸显示屏，我已经开始计划围绕它制作另一个稍大一点的乐高经典
    Macintosh。


    > 我在两个月里每隔一个晚上工作一次


    ## 你能告诉我们你构思出的远程更新屏幕解决方案吗？


    树莓派上运行着几个微型应用程序，负责获取数据，还有一个每分钟更新显示数据的应用程序。因此树莓派基本上是自给自足的；没有外部实体更新屏幕。它自己做所有工作。代码部署非常容易，可以远程完成
    [...] 因为设备由 resin.io 管理，它是免费的层级。


    ## 项目中最具挑战性的部分是什么？


    什么是最容易的：找到时间。我在两个月里每隔一个晚上工作一次，当时家人都在睡觉（这样他们就不会因为我用乐高玩耍而在厨房评判我）。这通常意味着每次对项目工作 30
    分钟到两小时。其余的都很简单，但当然这 mostly 是因为我是个程序员。对于编程新手来说，这个项目的整个软件部分会花更长的时间——但这是完全可以实现的，不要害羞。既然你现在知道我的名字，你可以[让我]帮你。


    ## 如果人们想尝试你的项目，你会给他们什么建议？


    获取一个树莓派 Zero W。它自带 Wi-Fi 和蓝牙，所以你不需要在那里进行任何焊接。另外，因为你无法在互联网上发布几块乐高积木的图片，尤其是如果你是把它们
    Dredeld 进去的人。正如我们在该项目中学到的，互联网上有 AFOL（乐高成年粉丝），他们会轻视你的能力，如果你切积木 [...] 会严厉地评判你。


    ## 你最终使用了哪个基础镜像？


    我使用了 resin.io 的善心人士提供的 resin/raspberrypi-python:2.7。在我的 GitHub 账户上，你可以找到一个预配置的
    docker 镜像 – https://bit.ly/ePaperDockerfile – 用于配合我在此项目中使用的嵌入式艺术家电子墨水显示器显示数据。


    ## 你在你朋友的屏幕上显示的是什么？我们是否窥探到你将 Gym Hero 应用添加到树莓派上？


    它目前显示他女儿的天数年龄、当天的降水概率、当前的体感温度，以及当天的最低最高温度。由于我是和我的伙伴 Jannik 一起制作 Gym Hero 应用的，而他收到乐高
    Mac 作为生日礼物，它还显示前一天我们在应用中销售了多少健身计划。


    ## 在完成经典 Macintosh 之后，什么激发了你的兴趣？


    它是我喜爱的树莓派商店 Pinoroni（https://shop.pinoroni.com）推出的一款新设备。这是一款名为 Unicorn HAT HD
    的 16x16 RGB 像素矩阵，即插即用——只需将其插入树莓派 [...]。在你等待 Unicorn HAT HD 邮寄到货期间，你可以试用我用 Unicorn
    HAT 模拟器写的[它 [...]（https://github.com/jany/icunicorn-hat-sim）。[...] 目前，我制作了一个小的
    gitbox，允许你用网页浏览器将 GIF 拖放到上面。下一步是把它变成 weatherbox，显示 16x16 的动画像素艺术，展示当天的天气（晴天、多云、雨天等）。又是天气。直到这次采访，我才意识到我对天气如此着迷。


