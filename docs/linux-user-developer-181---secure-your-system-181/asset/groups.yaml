    我从 2006 年开始。当时我为 http://linuxforums.org 写作，我想自己托管我的一些文章。我需要一个域名，我选择了 ''linuxmint.com''。它很短，并且传达了新鲜感和即开即用的技术理念。名字就是这样来的：它原本是用于一系列致力于
