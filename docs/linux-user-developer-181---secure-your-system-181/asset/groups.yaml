    \n```\n```\nwoolBlockGreenType = 5\n#Black wool is blockID 15\nwoolBlockBlackType\
    \ = 15\n\npixelArt = []\n\npos = mc.player.getPosition()\nx = pos.x\ny = pos.y\
    \ + 7\n#8 blocks above ground\nz = pos.z\n```\n```\n\nCreating pixel art in Minecraft\
    \ can be quite therapeutic, but placing the blocks down one-by-one can also be\
    \ incredibly time-consuming. However, by using Python and a handy little 'for'\
    \ loop or two, we can create scripts to automatically build prefabricated pixel\
    \ art directly into our Minecraft worlds.\n\nIf you're using Minecraft Pi edition\
    \ on a Raspberry Pi, no additional software is necessary. We've also put together\
    \ a number of tools to ensure this hack works on Linux, with a retail version\
    \ of Minecraft. Therefore as a prerequisite, we assume you've installed McPiFoMo\
    \ from our previous three issues. McPiFoMo includes MCPiPy by 'jlep' and 'bluepillRabbit'\
    \ of MCPiPy.com, and Raspberry Jam developed by Alexander Pruss.\n\nIn this tutorial\
    \ we're going to use Python to create an array that'll build blocks in rows and\
    \ columns, to produce some pixel art. You'll need to keep your block ID list to\
    \ hand, so you can select a range of blocks matching the colours you desire. We're\
    \ going to be using wool for the choice here, but you're welcome to use any blocks\
    \ that meet your purpose.\n\nAll Python scripts should be saved in the directory\
    \ `~/home/minecraft/mcppy/`, regardless of whether you're running Minecraft Pi\
    \ edition or retail Linux Minecraft.\n\n# 01 Setting up the code\n\nHere's the\
