  mdcn: "\n\n优质随机性与劣质随机性的主要区别在于**熵**，即无序性的统计度量。没有偏差、相关性或模式的数据被认为具有高熵。一个8位数字可能包含5.2位有效熵。但熵只是追求随机性的一部分。随机数还必须是完全不可预测的。圆周率Pi（3.1415926535897932384...）的数字可能看起来随机并包含统计熵，但很容易被预测。证明随机性需要了解数据最初是如何生成的以及使用了哪些熵源。\n\
    \n幸运的是，我们的世界充满了熵。但将其应用于计算机系统并非如此简单。开发者发明了多种方法从物理世界——熵实际存在的唯一地方——收集自然熵。一些 capable\
    \ 用户活动，如鼠标移动和键盘点击，麦克风噪音，甚至使用相机检测熔岩灯的运动。Linux 监控计算机硬件，包括磁盘驱动器中断、CPU 计数器和时序抖动。这些信号都不是完全随机的，但当它们组合在一起时，可以近似达到可接受的随机性。\n\
    \n缺乏熵或破坏熵源的攻击可能无法被检测到，为了缓解这些威胁，可以使用专用硬件设备作为补充熵源。例子包括 USB 令牌、硬件安全模块（HSM）、嵌入式 CPU\
    \ 特性（例如 Intel 的 rdrand）和智能卡。这些确实有帮助，但挑战在于专用硬件会带来其自身的问题。例如，企业数据中心可能禁止使用 USB 令牌，而在公共云或托管环境中添加任何额外硬件可能都是不可能的。特别是在高度虚拟化环境中或资源受限的物联网设备上，我们面临双重打击。本地熵源很可能质量很差，而且很难或不可能添加额外硬件。\n\
    \n特别是对于容器和虚拟机而言，由于缺乏物理用户和设备（如硬盘），熵的收集可能完全依赖于低质量的来源，例如中断和计数器。\n\n从 DevOps 的角度来看，虚拟化是一个伟大的概念，但\
    \ hypervisor 可以为熵创建一个虚拟防火墙，将应用程序需要随机性的虚拟世界与熵实际存在的物理世界隔离开来。当虚拟机作为快照复制时，虚拟化环境中缺乏熵的问题变得更加严重。每个快照可能包含相同收集的熵副本和软件\
    \ PRNG 的相同内部状态——这实际上是在牌堆洗牌后复制牌堆。这使得频繁重新播种变得更加重要。\n\n在典型企业中的众多应用程序和设备之间生成随机数，其不一致性和未知性是不可避免的。每个应用程序实例获取熵的能力不同。使用不同的服务器硬件、不同的操作系统版本以及个体用户存在（或缺失）都会引入熵可用性的不一致，从而影响密钥生成的质量——在安全背景下，这始终是一件坏事。这创造了攻击者可以利用的隐蔽弱点区域，并让人质疑合规性声明。\n\
    \n现实是，随机数生成最好被描述为一种“本地尽力而为”：\n\n-  如果可能生成密钥、测试其随机性并简单地拒绝那些不随机的密钥，我们可以绕过熵收集方面的缺陷——但糟糕的随机性并不是容易检测到的。\n\
    -  熵饥饿无法以被动反应的方式解决。\n-  改进随机性的方法意味着必须在最初就将高质量熵源架构化到安全系统中，并使其广泛可用。简而言之，真正的随机数生成需要成为标准尽职注意义务的一部分。\n\
    \n## 随需而取的熵\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_26_0.png)\n\n而不是仅仅依赖每个应用程序实例的本地熵源，可以通过网络作为远程服务提供熵。共享熵源可以根据需求向许多需要增强熵的应用程序实例提供熵。这种面向服务的模型使得本地熵水平可以被监控和维护，从而无论操作系统运行在什么硬件上、存在什么虚拟化层以及是否有用户活动，Linux\
    \ 内的 PRNG 都能频繁且良好地播种。\n\n结果是 /dev/random 不再阻塞，而 /dev/urandom 被充分播种到可以被视为真正的随机数生成器。优点在于应用程序和操作系统无需修改。应用程序继续请求随机数，操作系统继续收集本地熵。补充熵的可用性有点像维生素补充剂——为应用程序实例群体带来确定性和一致性。\n\
    \n通过网络交付熵依赖于安全的通信通道以及能够生成足够随机种子的能力，以满足整个数据中心或物联网设备群的需求。建立对该熵质量的高度信心也很重要，出于这个原因，供应商通常会转向量子力学。基于量子的熵源利用亚原子水平的随机行为。这种行为本质上是随机的。就部署选项而言，解决方案以公共云服务和本地私有系统形式存在，以建立内部的私有熵服务。\n\
    \n随着时间的推移，基于网络的熵服务可能会被视为安全数据中心的基本要求。作为一种威胁工具，即开即用的熵（entropy-as-a-service）缓解了虚拟化环境和其他熵可用性不可靠、质量差或未知情况下的熵饥饿威胁。这是为了确保所有应用程序实例都能独立于硬件和物理环境访问真正的随机数，从而能够生成最高安全性的密钥。\n\
    \n您可以通过注册 www.getnetrandom.com 免费试用即开即用的熵服务——下载 Linux 代理并自动开始流式传输真正的量子熵。\n\n#\
    \ LINUX MINT 有什么新变化？\n\n**Paul O'Brien** 深入探讨 Linux Mint 的开发；它是如何成长为被数百万人使用的，以及这个社区主导的发行版有什么新变化。\n\
    \n-   Linux Mint 可能没有获得与其基于的发行版（Ubuntu，因此是 Debian）相媲美的大量篇幅报道，但凭借数百万用户，它是目前最受欢迎的发行版之一。Linux\
    \ Mint 始于 2006 年 8 月，1.0 版本（代号为 'Ada'）是一种快速实验性发行版，包含创始人 Clem Vefeivre 在在线评测中讨论的功能理念。该实验反响良好，新用户提供了许多功能请求以补充\
    \ Clem 自己的想法和改进。到 2007 年 2 月 2.2 版本 'Bianca' 发布时，项目已获得重大关注，显然其目标应该是让 Mint 与当时可用的最佳发行版竞争。\n\
    -   Linux Mint 从一开始就迅速获得巨大 popularity 的原因是开发团队从一开始就倾听其忠诚社区的反馈，并在一频繁发布和巨大增长的时期持续这样做（同样的社区关注口号至今适用）。Mint\
    \ 历史上的一个关键时刻是 GNOME 3 的发布。团队最初对发行版的未来感到不确定，因为 GNOME 更新与 Mint 的目标不一致。团队最终选择分叉 GNOME\
    \ Shell 以创建 Cinnamon，这是一个替代桌面环境，尽管它本身不要求安装 GNOME，但它保持真实\n\n## 时间线\n\n-   **2006\
    \ 年 8 月 27 日**\n    Linux Mint 的第一个版本发布，基于 Kubuntu 6.06。1.0 版本 'Ada' 将是 Mint 发行版中唯一仅提供\
    \ KDE 桌面环境选项的版本。\n-   **2008 年 6 月 8 日**\n    Linux Mint 的第一个“长期支持”（LTS）版本随 5\
    \ 版本 'Elyssa' 到来。基于 Ubuntu 8.04，该发行版提供多种变体和多个桌面环境，包括 Fluxbox。\n-   **2010 年 5\
    \ 月 18 日**\n    Fluxbox 桌面环境像它出现得那样迅速，最后一次出现在 Linux Mint 发行版中，即 9 版本 'Isadora'。Xfce\
    \ 仍然作为超轻量级环境提供。\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_27_0.png)\n\n"
