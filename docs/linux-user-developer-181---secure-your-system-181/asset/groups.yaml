    quarter, 36% of all malware was targeting Linux (WatchGuard Threat Report Q1 2017).
    This was mostly IoT devices, but that''s hardly surprising given the number of
    products hitting the market that can''t be patched post-release and are sitting
    there waiting to be hacked. This free ride needs to end. These companies need
    to invest in the open source software they use or be named and shamed out of business.


    While the IoT situation is lamentable, on the desktop side we''ve got you covered
    with our feature on securing your system (p18): we go into everything from disabling
    unused services to security auditing and automating system monitoring to sandboxing.
    We also take a fresh (sorry) look at Linux Mint development (p28) and an interview
