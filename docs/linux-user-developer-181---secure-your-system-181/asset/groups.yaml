  - '[PAGE 7]


    # OpenSource


    08 News & Opinion | 12 Interview | 96 FileSilo


    ![](img/fb76008333fb7aef815b136f9f1afe5f_7_0.png)


    # SECURITY


    # MEPs push for EU-wide backdoor ban


    Can European Union legislation protect encryption?


    Combating crime and terrorism has long been the rationale presented by governments
    to increase surveillance powers. But when it comes to encryption, there is a problem:
    encryption works or it does not. There are no half measures.


    It’s an issue that is on the mind of a group of MEPs, who have proposed amended
    regulation to the European Parliament that forbids encryption backdoors for the
    purposes of law enforcement. In its draft report, the Committee on Civil Liberties,
    Justice and Home Affairs says that advances in technology have outpaced data protection
    provisions, resulting in the proposed amendments to the 2002 ePrivacy regulations.
    If passed, these would impact the UK’s intention to block end-to-end encryption
    (E2EE) from being used by apps such as WhatsApp.


    The draft report states: “The providers of electronic communications services
    shall ensure that there is sufficient protection in place against unauthorised
    access or alterations to the electronic communications data, and that the confidentiality
    and safety of the transmission are also guaranteed by the nature of the means
    of transmission used, or by state-of-the-art end-to-end encryption of the electronic
    communications data. Furthermore, when encryption of electronic communications
    data is used, decryption, reverse engineering or monitoring of such communications
    shall be prohibited.”


    Responding to the draft report, Jim Killock, executive director of Open Rights
    Group, told us: “The Committee’s call to protect our digital security is very
    welcome, particularly at a time when there is increasing international pressure
    for companies to be compelled to weaken the security of encrypted products. The
    UK already has these powers, which need to be subject to rigorous tests and open
    legal challenge so they are not misapplied, putting all of us at risk.”


    Providing backdoors into encrypted communications would be the responsibility
    of the developers, who so far have been resistant to pressure from governments.
    Not only does such a possibility have privacy implications, there is also a strong
    chance that it could impact the digital economy. However, the argument from governments
    demanding these backdoors is a strong one. How better to battle domestic terrorism
    than find out exactly what suspects are discussing online and who their contacts
    are? In an age of regular terror attacks, these powers, it is argued, are necessary.
    This debate is likely to be played out in public over the coming months as the
    European Commission reviews the draft, and the German, French and British governments
    make their objections. And consider the Brexit situation: if existing EU laws
    will be incorporated into British law via the Great Repeal Bill, could we see
    encryption backdoors by the back door?


    ![](img/fb76008333fb7aef815b136f9f1afe5f_7_1.png)


    > Above Will the EU block encryption backdoors, or cave in to pressure from national
    governments?'
  - '[PAGE 8]


    # HARDWARE


    # Two new Linux laptops from Entroware


    UK manufacturer unveils 13-inch and 17-inch Linux Ubuntu notebooks


    Does the world need more Ubuntu laptops? UK manufacturer Entroware (www.entroware.com)
    certainly thinks so, releasing a pair of Ubuntu 17.04 notebooks in late June,
    with a choice of features.


    First is the Apollo, a 13.1-inch slimline notebook in the MacBook Air tradition.
    The most basic version (E330 inc VAT) features a Pentium 4415U 2.3GHz dual-core
    CPU, although Core i3, i5 and i7 Intel Kaby Lake processors are also available.
    The baseline 4GB RAM and 500GB HDD can also be upgraded, while graphics are controlled
    by Intel HD Graphics. An LTE-enabled network card can also be selected.


    Also new is the hybris, which starts from £810. The default option for this is
    a Core i5 processor, 4GB DDR4 RAM, a 500GB hard drive and Intel HD Graphics. All
    of this can be upgraded as above, of course, with an Nvidia GeForce GTX 1050 4GB
    also among the options.


    Ubuntu 17.04 is installed by default on both laptop models, although 16.04 LTS
    is also available. But why Ubuntu? Entroware’s accounts and technical support
    manager Mike Wilson tells us that it’s really down to customer satisfaction.


    “Ubuntu […] has proven itself to be a staple in the Linux desktop market, through
    years of stability, familiarity and ease of use. Coupled with the LTS releases
    and fast implementation of upstream updates, we are able to produce newer hardware
    to compete with the rest of the consumer IT market.”


    “But isn’t it simpler to just install Ubuntu on a Windows laptop? “In the majority
    of cases, unfortunately, no. Some hardware vendors use components with poor Linux
    support, which can be problematic. This could mean that the customer would spend
    a lot of time trying to get their machine to work, if they are even able to do
    so.”


    To overcome this, Wilson says Entroware’s approach is to source hardware to minimise
    compatibility issues, as well as bundle lifetime software support for each computer
    sold there. “Entroware’s support for Linux doesn’t end there. “Additionally, we
    help out the community by sponsoring events ( OggCamp), supporting distributions
    (Ubuntu MATE) and sponsoring Linux media (Late Night Linux).”


    # TOP FIVE

    Unity projects


    ![](img/fb76008333fb7aef815b136f9f1afe5f_8_0.png)


    +   **1 Yunit – the Unity 8 fork**

    +   While it failed to gain universal popularity, Unity certainly has its fans
    and many developers are collaborating on a new fork, Yunit. So far they’ve begun
    publishing Debian unstable releases for 64-bit systems. Yunit is also collaborating
    with the UBports project (below) for Ubuntu Touch devices. Find out more at https://yunit.io.


    +   **2 UBports saves Touch**

    +   Supporting Ubuntu phone and tablet devices and developing a presence on core
    devices (such as the Google Nexus 5 2015 edition), the team at https://ubports.com
    are doing a great job in keeping the Ubuntu Touch mobile OS alive.


    ![](img/fb76008333fb7aef815b136f9f1afe5f_8_1.png)


    +   **3 Plasma Unity theme**

    +   Switched to KDE Plasma and feeling sad about Unity’s demise? Thanks to the
    KDE Store’s “Loki and Feel” section it’s simple to install a Unity theme, known
    as the United Desktop. This theme runs on KDE Plasma 5.9.


    +   **4 Dash to Dock Unity**

    +   Finally, the popular GNOME extension Dash to Dock has been receiving many
    new contributions since Unity’s retirement was announced. Among the features to
    beported are the launcher backlight and expose. Transferring to GNOME has become
    even less painful.


    +   **5 United GNOME theme**

    +   Amazingly, several Unity themes are already available. Most notable is the
    United 8-based United GNOME, available on GitHub, offering a faithful recreation
    of the desktop environment. As with many GNOME themes, United GNOME requires the
    GNOME Tweaks Tool for installation.'
