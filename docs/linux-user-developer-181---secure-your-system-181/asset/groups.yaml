    working on the Apple MacBook Pro,” Lefebvre says that Linux Mint doesn’t make
    money on partnerships, or at least not much money. “It’s not really part of our
    business model. We’re not a manufacturer, it’s not what we like doing and it’s
    probably not something we’d be good at. If we wanted to make money with laptops,
    we’d brand a cheap mass-produced laptop, something you could buy anywhere else.”


    However, Lefebvre is ecstatic about the work Linux Mint has done with Compulab
    on the MintBox (see p31): “These units are unique: we’ll remember them all our
