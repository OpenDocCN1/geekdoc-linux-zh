  - '[PAGE 28]


    # AT A GLANCE

    ## New developments in Mint 18.2


    +   *   **Better Bluetooth**

    +       Bluetooth support is much improved in 18.2 with the addition of the Blueberry
    UI.

    +   *   **New display manager**

    +       Mint 18.2 ditchs MDM and uses LightDM as the display manager with support
    for X, Wayland and more.


    +   *   **Slick greeter**

    +       18.2 includes the LightDM-powered, HiDPI-ready ''Slick'' greeter, a fork
    of Unity greeter.

    +   *   **Mint-Y polish**

    +       Mint 18 introduced the new Mint-Y, Arc-based theme; 18.2 adds further
    visual polish and new backgrounds.


    +   *   **Updated environments**

    +       Cinnamon is updated to version 3.4, MATE to 1.18, KDE to Plasma 5.8.7,
    Xfce to 4.12.

    +   *   **Linux kernel options**

    +       Kernel versions 4.6, 4.8 and 4.10 are available directly from the Mint
    Update kernel management utility.


    ![](img/fb76008333fb7aef815b136f9f1afe5f_28_0.png)


    to the interface features the users liked in GNOME Shell. The stated purpose of
    Linux Mint is to produce a ''modern, elegant and comfortable operating system
    which is both powerful and easy to use''. As a ready-to-use distro, Mint is second
    to none. It''s bundled with full multimedia support including proprietary codecs
    for Flash, MP3 and DVD playback. Although contentious among some in the Linux
    community, it does provide for an optimum user experience. A wide range of apps
    are included as standard in the spirit of being ready to go out of the box, including
    LibreOffice, Firefox, Thunderbird, VLC and GIMP.

    Mint is often considered a good Linux distribution for new Windows converts, particularly
    when using the Cinnamon desktop environment, and this is further strengthened
    by the inclusion of Wine, the Windows compatibility layer, by default. ''Mint4win''
    allows Linux Mint to be installed directly from Windows, just as the ''Ububi''
    equivalent does on Ubuntu. This is a particularly useful tool as it requires no
    re-partitioning of the main system drive. As Linux Mint is based on Debian and
    Ubuntu, it provides over 30,000 packages as well as one of the best software managers
    available. Reliability is noteworthy thanks to a conservative approach to software
    updates and a unique Update Manager also known as ''mintUpdate'', which is part
    of the ''MintTools'' suite. The update manager


    is designed to prevent inexperienced users from installing updates that are unnecessary
    or require a certain level of technical knowledge to install by assigning updates
    a safety level (from 1 to 5), based on the stability and necessity of the update.

    Also included in MintTools is mintinstall, a software manager to install .mint
    files or packages from the Ubuntu and GetDeb repositories. Other historically
    included tools are mintMenu, a handy system-wide menu; mintBackup, a backup tool;
    mintUpdate, an update manager; mintHammy, a basic parental control tool; mintDesktop,
    a desktop config tool; and mintWelcome, the floating welcome screen.

    The first version 18.x release of Linux Mint was a significant milestone in the
    distribution''s life. The underlying base was updated to Ubuntu 16.04 LTS, while
    the Cinnamon and MATE desktops in particular were refined - following an evolutionary
    path rather than opting for radical change, providing some welcome stability in
    a world where, for Ubuntu in particular, turbulence now dominates as the distro
    makes the switch away from Unity. Looking back to Linux Mint''s roots, installation,
    use and stability are better than ever, providing a welcome experience for users
    making the leap from Windows. The new Mint-Y theme was first previewed with the
    ''Sarah'' release, before being tuned and refined based on user feedback (of course,
    this is Mint!).


    ![](img/fb76008333fb7aef815b136f9f1afe5f_28_1.png)


    # DESKTOP ENVIRONMENT

    ## What''s new in Cinnamon 3.4


    Cinnamon 3.4 was released in May this year and has now made its way to the latest
    Linux Mint release (it can also be installed on other distros). Although primarily
    a bug fix and performance release, the new version adds a number of new features
    including a desktop grid; multi-process improvements; wildcard support in file
    search; desktop actions in panel launcher; additional screensaver config options;
    better configuration of mice acceleration and sensitivity; and manage systemd-units
    and lightdm-settings support in system settings (important as Mint 18.2 moves
    to LightDM). A new website - https://cinnamon-spices.linuxmint.com is available
    for Spices: themes, applets, desklets and extensions for Cinnamon. Nearly 300
    are currently available, allowing extensive customisation of the Cinnamon experience.


    # **7 SEPTEMBER 2010**

    LMDE is an alternative version of Linux Mint that comes with a Debian base. LMDE
    is implemented as a rolling release distribution and not tied to a specific release
    schedule.


    # **26 MAY 2011**

    Linux Mint 11 ''Katya'' is the last version to feature specific images for x64
    support. These are rolled into the main images for all subsequent releases as
    the platform becomes more widely used.


    # **26 NOVEMBER 2011**

    The first version of Mint with the MATE desktop appears in version 12 ''Lisa'',
    together with Cinnamon''s predecessor, ''GNOME 3 with MGE''. MATE is effectively
    the spiritual successor to GNOME 2.'
  - '[PAGE 29]


    # THE X-TRAAAPPS


    ![](img/fb76008333fb7aef815b136f9f1afe5f_29_0.png)


    # Pix


    An image browser, viewer, organiser and editor with support for digital camera
    importing, slide shows, image renaming, image conversion and duplicate removal.
    Plus a plug-in system for extensions.


    ![](img/fb76008333fb7aef815b136f9f1afe5f_29_1.png)


    # Xplayer


    A powerful media player that can read many file formats. The app supports DVD
    playback, TV out, full-screen mode, keyboard control, subtitles and, like Pix,
    an extensible plug-in system.


    ![](img/fb76008333fb7aef815b136f9f1afe5f_29_2.png)


    # Xed


    This text editor replaced Gedit and Puma in Mint 18. While a simple editor, Xed
    has more features than most, including syntax highlighting, remote file editing,
    file comparison, file history, plug-in customisation and a tab-based UI.


    The update story once again received major updates for version 18. For shell lovers,
    the apt command gained compatibility with the Debiant tool of the same name. On
    the GUI side, Update Manager enjoyed some big improvements, with a choice of three
    broad settings for updates: the safe option, to offer only stable updates; the
    default option, which installs stable updates but also offers updates that could
    affect stability; and the ''throw caution to the wind and update everything''
    option, if you''re not scared of breaking things. The kernel update utility in
    Mint is a real highlight, eclipsing anything on offer from other distributions,
    allowing you to easily install and test newer kernels. Linux Mint 18.1 ''Serena''
    represented a small update to the original release.


    > > July 2017 sees the release of Linux Mint 18.2 ''Sonya'', a long-term support
    release which will be supported until 2021


    Cinnamon 3.2 added yet further polish, the included X app received small UI tweaks
    and – you guessed it – software update and installation were also refined. That
    the login screen display manager, MDM, received some of the most notable technical
    improvements speaks volumes.


    July 2017 sees the release of Linux Mint 18.2 ''Sonya'', a long-term support release
    which will be supported until 2021. Mint 18.2 is available with Cinnamon, MATE,
    KDE or Xfce desktop environments and is once again based on Ubuntu 16.04.


    Linux Mint 18.2 ''Sonya'' includes a number of new features and improvements in
    the base system, as well as additional changes within each supported desktop environment.
    For regular Bluetooth users, the new Blueberry user interface is a huge boon.
    Aside from the vastly improved user interface, Blueberry adds a stack switcher,
    support for OBEX file transfers out of the


    box (enabling you to easily send files to your computer from a Bluetooth device
    such as a phone or tablet) and an option to change the Bluetooth name of your
    computer. A lot of work has been put into the included X-apps for the latest release.
    Xed, the text editor, has had significant improvements to its user interface.
    Smart side and bottom bars, a dark theme, line sorting, keyboard and mouse-driven
    zoom, regex search, simplified tab switching and improved word wrap accessibility
    also feature, making the application more powerful than ever before. Xplayer,
    the media player, has also received improvements to its user interface. The UI
    is more compact thanks to the playback controls and seek bar being placed on the
    same line and the status bar being removed. Keyboard shortcuts are improved and
    extended and, as in Xed, the ability to favour dark themes has been added. The
    previously somewhat buggy on-screen display is fixed, too. Improved keyboard shortcuts
    are now included in the Pix image utility, which also receives a little visual
    polish. The Reader PDF tool has undergone a more extensive redesign and also gains
    touchscreen support, particularly useful if you''re using Mint on a convertible
    machine – you''ll now be able to swipe your finger across the screen to quickly
    browse through pages and even pinch to zoom in or out.


    The update to Cinnamon 3.4 for the latest release is accompanied by a rewrite:
    from-scratch Cinnamon Spices website. The goal of the rewrite was much more than
    a simple cosmetic overhaul – the project focused both on improved security and
    a drive to guarantee better quality and compatibility than ever before. This does


    # TIMELINE


    +   - 22 MAY 2012

    +   Version 13 ''May'' of Linux Mint is the first to offer the GNOME Shell fork
    Cinnamon as a default desktop environment. MATE (which was added in version 12),
    KDE and Xfce are also offered.

    +   - 29 MAY 2013

    +   Since version 16 ''Olivia'', all the flavours with differing desktop environments
    share the same common codebase. Version 15 is based on Ubuntu 13.04 and offers
    Cinnamon, MATE, KDE and Xfce.

    +   - 31 MAY 2014

    +   Version 17 ''Olivia'' is the first to support point sub-releases. The naming
    convention also seems to have changed, retaining girls'' names, but not incrementing
    the letter of the alphabet used for point releases from 17.2.'
