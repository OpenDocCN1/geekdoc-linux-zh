    # Pi Project


    # Jannis Hermanns


    is a software engineer at www.pimopel.com who traded his hobbies of kitesurfing
    and basketball for a bunch of kids and Raspberry Pis.


    # Like it?


    Not surprisingly, the Venn diagram of nostalgia for Macs and contemporary maker
    creates an intersection that''s packed with projects. One of Jannis'' favourites
    is März Jonasson''s NESMAC, which is an old Macintosh Classic with a Raspberry
    Pi inside (https://youtube.com/PtPbUlf8).


    # Further reading


    To stay informed about the gitbox and weatherbox project mentioned in the interview,
    or any of Jannis''s projects head to his website: https://janni.is. On his Ghost
    blog you''ll find a complete write-up of the LEGO Macintosh Classic. You can also
    follow him on twitter: @jannis.


    # LEGO Macintosh Classic


    This recreation of an old Mac in LEGO is a heady mix of contemporary technology
    and childhood nostalgia


    ## What inspires your projects?


    Pretty much all of my side projects are born from scratching an itch. In the past,
    that has been mostly software – starting with a blogging software called S9y in
    the early 2000s and more recently an iOS fitness tracking app called Gym Hero
    [...]. The LEGO Macintosh classic was my first hardware project, and it started
    because I live in Berlin and take the bicycle to work, I wanted to have a little
    display in the kitchen that tells me what the weather would be like. I purchased
    two small displays and a Raspberry Pi and made them display the carbon dioxide
    level in the living room and the current temperature on my patio. I then realised
    that this doesn''t help me much in the morning when I have to decide whether or
    not to wear my elegant cycle-in-the-rain suit.


    ## What was the thinking behind picking that particular e-paper display?


    Since I needed more screen real estate to display the weather conditions for the
    day, I looked into what kind of displays are available for the Pi. Even though
    there are great, high-PPI colour displays, I opted for an e-paper display [...]
    The weather condition kitchen display only needed to update every other minute
    while the lack of colour made it easier to design how the information is displayed.
    The great strength of e-paper displays is how unobtrusive they are; they just
    don''t look like a computer and they don''t glow in the dark. And that''s just
    perfect [...]. I actually purchased two different sizes and used the smaller one
    for this project. The other is a 4.3-inch display from Waveshare and I''ve already
    begun planning to build another, slightly larger, LEGO Macintosh classic around
    it.


    > I worked on it every other night for two months


    ## Can you tell us about the solution you came up with for updating the screen
    remotely?


    There''s a couple of tiny applications running on the Pi that take care of fetching
    the data, and one that updates the data that is displayed every minute. So the
    Pi is pretty much self-sufficient; there is no external entity updating the screen.
    It does all the work itself. The deployment of code is very easy and can be done
    remotely [...] Because the device is managed by resin.io, it''s free, tier.


    ## What was the most challenging part of the project?


    What one''s easy: to find the time. I worked on it every other night for two months,
    when the family was asleep (so they couldn''t judge me for playing with LEGO in
    the kitchen). This usually involved working on the project for 30 minutes to two
    hours at a time. The rest was straightforward, but of course that''s mostly because
    I''m a programmer. For someone who''s new to programming, the whole software part
    of this project will take a little longer – but it''s very much doable, don''t
    be shy. And now that you know my name, you can [ask me] to help you.


    ## If people want to have a go at your project, what tips would you give them?


    Get a Raspberry Pi Zero W. It comes with Wi-Fi and Bluetooth on board, so you
    don''t have to do any soldering there. Also, so you can''t post images of several
    LEGO bricks on the internet, especially if you''re the one who Dredeld into them.
    As we learned through this project, there are AFOL (adult fans of LEGO) on the
    internet with will belittle your abilities and judge you harshly if you cut bricks
    [...].


    ## Which base image did you use in the end?


    I used resin/raspberrypi-python:2.7 provided by the fine folks at resin.io. On
    my GitHub account you can find a docker image – https://bit.ly/ePaperDockerfile
    – that is preconfigured for displaying data with the embedded-artist''s e-paper
    display that I used for this project.


    ## What were you writing on your friend''s screen? Did we spy your Gym Hero app
    being added to the Pi?


    It currently displays the age of his daughter in days, the precipitation probability
    for the day, the current perceived temperature, as well as the minimax for the
    day. And since I made the Gym Hero app together with my buddy, Jannik, who received
    the LEGO Mac as a birthday gift, it also display how many workout plans we sold
    in the app the day before.


    ## What has sparked your interest since finishing the Macintosh Classic?


    It''s a new device by my favourite Raspberry Pi shop: Pinoroni (https://shop.pinoroni.com).
    It''s a 16x16 RGB pixel matrix called the Unicorn HAT HD that''s ready to use
    – just plug it onto your Pi [...]. While you wait for your Unicorn HAT HD to arrive
    in the mail, you can try [it out [...] with a Unicorn HAT simulator I wrote (https://github.com/jany/icunicorn-hat-sim).
    [...] So far, I''ve built a little gitbox that allows you to drag a GIF onto it
    with your web browser. The next step is turning it into weatherbox that displays
    16x16 animated pixel art showing you the weather for the day (sunny, cloudy, rainy,
    and so on). There it is again, the weather. I had no idea I''m obsessed with weather
    until this interview.

