    This involves providing a compartmentalised environment to a script or app, so
    that the larger part of your installation remains protected.


    # Sandbox with chroot


    The oldest sandboxing tool in Linux, chroot can be used to change the root directory
    for a process. This prevents apps inside a chroot jail from accessing other directories
    or files. Containers such as Docker can similarly be used to run isolated application
    instances.


    If you''re spooked by the prospect of performing too many tasks to feel secure
    while connecting to the internet, consider using Subgraph OS. Based on Debian,
    the distro has been designed from the ground up, with a focus on security and
    privacy. It ships with a hardened Linux kernel, along with out-of-the-box sandboxing
    for applications, firewall and proxy.


    Despite all these tools, you must understand that attaining a completely secure
    system is an unachievable goal. This is because the process would require you
    to, in the words of Linus Torvalds:


    > "Unplug the network cable and instantiate draconian measures for physical security."
    There''s no golden rule for security that applies in every case, and even if there
    were, it would have been cracked already.


    Security is something that needs to be worked on and personalised. With the combined
    weight of all the tools discussed, you''ll get the three essential ingredients
    for good system security – prevention, protection and detection – and that''s
    the best anyone can hope for.


    ![](img/fb76008333fb7aef815b136f9f1afe5f_24_0.png)


    # HARDEN YOUR SYSTEM


    # Automated security hardening


    Security hardening involves poorly configured systems, from a security point of
    view, being identified and made to conform to security standards. This applies
    to the different layers of a system such as the network, where it''ll enable the
    firewall. On the software level, hardening involves removing packages with known
    issues, allowing only signed packages to be installed and so on.


    Ansible is a popular hardening tool that does all of the above and more. Note,
    however, that you''ll still need to update packages and install security updates
    manually. To install Ansible and run:


    ```

    pip install ansible

    ansible-galaxy install git+https://git. openstack.org/openstack/ansible-hardening

    ```


    # QUICK TIP


    # Encrypt files


    You can use the -x switch with Vim to encrypt the contents of the file so that
    others can''t read it unless they know the key phrase used for encryption.


    ![](img/fb76008333fb7aef815b136f9f1afe5f_24_1.png)


    # 04 Volume type


    When you click ''Create'', zuluCrypt pops up another window. Besides specifying
    a password, you''ll have to select a Volume Type from the pull-down menu. TrueCrypt
    or VeraCrypt volumes work best if you want to share the encrypted volume between
    Linux, Windows and macOS computers. For the other values such as the cipher and
    file system for the encrypted volume, you can safely stick with the default options.


    ![](img/fb76008333fb7aef815b136f9f1afe5f_24_2.png)


    # 05 Mount volume


    Before you can store files inside this encrypted volume, you''ll first have to
    decrypt and mount it. Head to Open > Volume Hosted in a File. Use the file button
    in the pop-up window to navigate to the encrypted container file. You can optionally
    enter the mount name for the file, else just enter the password and click ''Open''.
    Once your volume is mounted, it''ll appear in your file system like any other
    mounted file system.


    ![](img/fb76008333fb7aef815b136f9f1afe5f_24_3.png)


    # 06 Unmount after use


    You can now create directories within this mounted location and create files,
    just like you would on any regular mounted device. When you''re done, left-click
    on the mounted volume in the zuluCrypt interface and select ''Unmount''. This
    will unmount and encrypt the volume and all you''ll have once again is the single
    encrypted file with illegible content. Mount the file again following the procedure
    in **Step 5** to reveal its contents.'
  - "[PAGE 25]\n\n# Column\n\n# The problem of random\n\n# How random is your random?\n\
    \nRandomness lies at the heart of security. It can no longer be left to chance\
    \ – it’s time to pay attention\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_25_0.png)\n\
    \n**Richard Moulds**  \nis the general manager of Whitewood Security and is a\
    \ 20-year veteran of the security market with a focus on the deployment challenges\
    \ associated with cryptography.\n\n**R**andom numbers are really important. They’re\
    \ used in most computer processes. Mostly it doesn’t really matter if they are\
    \ truly random, but in some cases it’s a big deal. When it comes to statistical\
    \ modelling, gaming and security they need to be provably random. The most extreme\
    \ requirement for random numbers comes from cryptography. Random numbers are used\
    \ to make cryptographic keys where lack of randomness makes them easier to crack.\
    \ But making perfectly random numbers is much harder than you would expect.\n\n\
    Any applications that use SSL/TLS or SSH for network encryption, need true random\
    \ numbers. The same applies to PKI-based applications with digital signatures,\
    \ and specialist crypto applications, such as payments and cryptocurrencies that\
    \ are tightly regulated with strict compliance requirements. Weak keys not only\
    \ create vulnerabilities but are also extremely expensive to replace.\n\nBut where\
    \ do random numbers come from? Usually, the operating system. Whether an application\
    \ needs just a few bytes or many megabytes of perfect random or ‘nearby’ random\
    \ numbers, it all comes from the same place. Just like in your home, everything\
    \ that uses water generally gets it from the same water supply irrespective of\
    \ its need for quality or dealing size (see illustration, above). In short, critical\
    \ security applications compete with more mundane tasks for\n\n> “The problem\
    \ is that software doesn’t naturally act randomly”\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_25_1.png)\n\
    \n**/dev/random**  \nQuality flow: Delivers random numbers only if sufficient\
    \ entropy has been captured – otherwise it stops\n\n**/dev/urandom**  \nPoor quality\
    \ flow: Delivers random numbers irrespective of how much entropy has been captured\n\
    \nrandomness, which can be a serious issue if randomness becomes a scarce resource.\n\
    \nIt’s strange to think that randomness might be exhausted. The problem is that\
    \ software doesn’t naturally act randomly. Software is deterministic: it’s preprogrammed\
    \ and fundamentally predictable. Software-based random number generators are typically\
    \ called either pseudorandom number generators (PRNGs) or deterministic random\
    \ bit generators (DRBGs) – but both names imply something less than true randomness.\
    \ They use well-known algorithms to extrapolate relatively few random ‘seeds’\
    \ into large amounts of ‘random’ numbers. No matter how well a software PRNG is\
    \ designed, it can’t create\n\nrandomness itself. An analogy is an audio amplifier\
    \ that makes a song louder but not better.\n\nIf a PRNG is poorly seeded, the\
    \ output risks becoming predictable. Another analogy is dealing a pack of playing\
    \ cards. The PRNG is equivalent to the process of dealing the deck, whereas providing\
    \ the random seed equates to shuffling the deck; the randomness of the deal is\
    \ entirely dependent on the quality of the shuffle. PRNGs may suffer from error-prone\
    \ implementation or even intentional backdoors, but their core security depends\
    \ entirely on the randomness of the seeding process.\n\nLinux has two PRNGs; they\
    \ are similar but differ in one important way. The more secure of the two is /dev/random,\
    \ which is reseeded every time a random number is requested. As a safety measure,\
    \ /dev/random is only enabled if there is enough randomness to reseed it, which\
    \ in turn can lead to a big performance hit. The alternative PRNG, /dev/urandom\
    \ (the ‘u’ stands for ‘unblocking’), will supply ‘random’ numbers regardless of\
    \ whether it has been well seeded or not. Since /dev/urandom is always available,\
    \ it’s a popular but potentially unwise choice for developers.\n\nThis dependence\
    \ on reseeding raises obvious questions. Is there a reliable source of seeds and\
    \ how can you prove they’re truly random? How often does the PRNG need to be reseeded\
    \ to stay random? And how can you tell if something goes wrong and your random\
    \ numbers stop being random? Unfortunately, there are no reliable answers.\n\n\
    26"
  md: "\n## Secure your system\n\nSo far, we have discussed a number of tools and\
    \ practices that you can adopt to secure your system and prevent attacks, but\
    \ there’s still plenty more that you can do, depending on whether you’re interested\
    \ in protecting your server or your network, or even a home workstation.\n\nThe\
    \ entire gamut of available solutions can very well lead to a troubling case of\
    \ paralysis from analysis, which is why we listed some of the best protective\
    \ tools. But there’s still more that various other projects and entities are working\
    \ on to protect your machine from harm.\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_23_0.png)\n\
    \nBelow Nmap Front End (NmapFE) is a well-designed and stable GUI that allows\
    \ you to control almost every aspect of Nmap.\n\nThe Linux Security Modules (LSM)\
    \ framework allows the Linux kernel to support a variety of security modules to\
    \ implement mandatory access control (MAC). SELinux and AppArmor are two of the\
    \ most popular LSMs on Linux. While the former allows you to define the activities\
    \ which can be performed by each user, process or daemon, AppArmor can be used\
    \ to restrict each installed program using application-specific profiles. Container\
    \ vendor Docker is also working on another LSM called Landlock, although it’s\
    \ still at the nascent stage.\n\nApart from these, there are a large number of\
    \ updates that ship with each new Linux kernel which fix many identified issues\
    \ to keep you safe. On top of that, the Kernel Self-Protection Project was started\
    \ to provide additional layers of security to the Linux kernel. You can also tweak\
    \ a number of parameters on your kernel to bolster the security. Run **sysctl**\
    \ for a list of current kernel settings. You can save these to a file with: `sysctl\
    \ -a > /sysctl1.settings`, which will enable you to use the file for reference\
    \ or comparisons if you make any changes.\n\nYou can change these settings on\
    \ your running kernel by editing the /etc/sysctl.conf file. On Linux Mint, the\
    \ file already exists and contains a number of these settings, but they are disabled\
    \ by default.\n\nOne of the biggest risks to system security is from untested\
    \ and unknown applications and you must take precautions to protect your system\
    \ from such programs. One way to do that is through sandboxing.\n\n### HOW TO:\
    \ Encrypt files with zuluCrypt\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_23_1.png)\n\
    \n![](img/fb76008333fb7aef815b136f9f1afe5f_23_2.png)\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_23_3.png)\n\
    \n- **01 Encrypt individual files**\n  Head to ZC > Encrypt A File. In the dialog\
    \ box that pops up, click the button adjacent to the Source field and navigate\
    \ to the file that you wish to encrypt. Then enter a password in the text box\
    \ labelled Key. zuluCrypt will use this information to create a file with the\
    \ same name, with the .zc extension at the end. Once a file has been encrypted,\
    \ make sure you delete its original version.\n\n- **02 Decrypt files**\n  Head\
    \ to ZC > Decrypt A File. Point to the encrypted file in the Source field and\
    \ point to the location of the unlocked file in the Destination field. Now enter\
    \ the password with which you encrypted the file and click the Create button.\
    \ When it’s done, the decrypted file will be created in the specified destination.\
    \ To lock the file again, encrypt it by following the outlined procedure outlined\
    \ in Step 1.\n\n- **03 Create encrypted files**\n  If you need to protect a number\
    \ of files that you access frequently, a better approach is to file them inside\
    \ encrypted storage areas. To create an encrypted storage device within a file,\
    \ head to Create > Encrypted Container In A File. Then enter the name and complete\
    \ parts of the directory along with its size, depending on the number of files\
    \ it’ll house and the available space on your disk.\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_23_4.png)\n\
    \nThis involves providing a compartmentalised environment to a script or app,\
    \ so that the larger part of your installation remains protected.\n\n### Sandbox\
    \ with chroot\n\nThe oldest sandboxing tool in Linux, chroot can be used to change\
    \ the root directory for a process. This prevents apps inside a chroot jail from\
    \ accessing other directories or files. Containers such as Docker can similarly\
    \ be used to run isolated application instances.\n\nIf you're spooked by the prospect\
    \ of performing too many tasks to feel secure while connecting to the internet,\
    \ consider using Subgraph OS. Based on Debian, the distro has been designed from\
    \ the ground up, with a focus on security and privacy. It ships with a hardened\
    \ Linux kernel, along with out-of-the-box sandboxing for applications, firewall\
    \ and proxy.\n\nDespite all these tools, you must understand that attaining a\
    \ completely secure system is an unachievable goal. This is because the process\
    \ would require you to, in the words of Linus Torvalds:\n\n> \"Unplug the network\
    \ cable and instantiate draconian measures for physical security.\" There's no\
    \ golden rule for security that applies in every case, and even if there were,\
    \ it would have been cracked already.\n\nSecurity is something that needs to be\
    \ worked on and personalised. With the combined weight of all the tools discussed,\
    \ you'll get the three essential ingredients for good system security – prevention,\
    \ protection and detection – and that's the best anyone can hope for.\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_24_0.png)\n\
    \n## HARDEN YOUR SYSTEM\n\n### Automated security hardening\n\nSecurity hardening\
    \ involves poorly configured systems, from a security point of view, being identified\
    \ and made to conform to security standards. This applies to the different layers\
    \ of a system such as the network, where it'll enable the firewall. On the software\
    \ level, hardening involves removing packages with known issues, allowing only\
    \ signed packages to be installed and so on.\n\nAnsible is a popular hardening\
    \ tool that does all of the above and more. Note, however, that you'll still need\
    \ to update packages and install security updates manually. To install Ansible\
    \ and run:\n\n```\npip install ansible\nansible-galaxy install git+https://git.openstack.org/openstack/ansible-hardening\n\
    ```\n\n### QUICK TIP\n\n#### Encrypt files\n\nYou can use the -x switch with Vim\
    \ to encrypt the contents of the file so that others can't read it unless they\
    \ know the key phrase used for encryption.\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_24_1.png)\n\
    \n- **04 Volume type**\n  When you click 'Create', zuluCrypt pops up another window.\
    \ Besides specifying a password, you'll have to select a Volume Type from the\
    \ pull-down menu. TrueCrypt or VeraCrypt volumes work best if you want to share\
    \ the encrypted volume between Linux, Windows and macOS computers. For the other\
    \ values such as the cipher and file system for the encrypted volume, you can\
    \ safely stick with the default options.\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_24_2.png)\n\
    \n- **05 Mount volume**\n  Before you can store files inside this encrypted volume,\
    \ you'll first have to decrypt and mount it. Head to Open > Volume Hosted in a\
    \ File. Use the file button in the pop-up window to navigate to the encrypted\
    \ container file. You can optionally enter the mount name for the file, else just\
    \ enter the password and click 'Open'. Once your volume is mounted, it'll appear\
    \ in your file system like any other mounted file system.\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_24_3.png)\n\
    \n- **06 Unmount after use**\n  You can now create directories within this mounted\
    \ location and create files, just like you would on any regular mounted device.\
    \ When you're done, left-click on the mounted volume in the zuluCrypt interface\
    \ and select 'Unmount'. This will unmount and encrypt the volume and all you'll\
    \ have once again is the single encrypted file with illegible content. Mount the\
    \ file again following the procedure in **Step 5** to reveal its contents.\n\n\
    ## The problem of random\n\n### How random is your random?\n\nRandomness lies\
    \ at the heart of security. It can no longer be left to chance – it’s time to\
    \ pay attention.\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_25_0.png)\n\n**Richard\
    \ Moulds** is the general manager of Whitewood Security and is a 20-year veteran\
    \ of the security market with a focus on the deployment challenges associated\
    \ with cryptography.\n\n**R**andom numbers are really important. They’re used\
    \ in most computer processes. Mostly it doesn’t really matter if they are truly\
    \ random, but in some cases it’s a big deal. When it comes to statistical modelling,\
    \ gaming and security they need to be provably random. The most extreme requirement\
    \ for random numbers comes from cryptography. Random numbers are used to make\
    \ cryptographic keys where lack of randomness makes them easier to crack. But\
    \ making perfectly random numbers is much harder than you would expect.\n\nAny\
    \ applications that use SSL/TLS or SSH for network encryption, need true random\
    \ numbers. The same applies to PKI-based applications with digital signatures,\
    \ and specialist crypto applications, such as payments and cryptocurrencies that\
    \ are tightly regulated with strict compliance requirements. Weak keys not only\
    \ create vulnerabilities but are also extremely expensive to replace.\n\nBut where\
    \ do random numbers come from? Usually, the operating system. Whether an application\
    \ needs just a few bytes or many megabytes of perfect random or ‘nearby’ random\
    \ numbers, it all comes from the same place. Just like in your home, everything\
    \ that uses water generally gets it from the same water supply irrespective of\
    \ its need for quality or dealing size (see illustration, above). In short, critical\
    \ security applications compete with more mundane tasks for\n\n> “The problem\
    \ is that software doesn’t naturally act randomly”\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_25_1.png)\n\
    \n- **/dev/random**\n  Quality flow: Delivers random numbers only if sufficient\
    \ entropy has been captured – otherwise it stops\n- **/dev/urandom**\n  Poor quality\
    \ flow: Delivers random numbers irrespective of how much entropy has been captured\n\
    \nrandomness, which can be a serious issue if randomness becomes a scarce resource.\n\
    \nIt’s strange to think that randomness might be exhausted. The problem is that\
    \ software doesn’t naturally act randomly. Software is deterministic: it’s preprogrammed\
    \ and fundamentally predictable. Software-based random number generators are typically\
    \ called either pseudorandom number generators (PRNGs) or deterministic random\
    \ bit generators (DRBGs) – but both names imply something less than true randomness.\
    \ They use well-known algorithms to extrapolate relatively few random ‘seeds’\
    \ into large amounts of ‘random’ numbers. No matter how well a software PRNG is\
    \ designed, it can’t create randomness itself. An analogy is an audio amplifier\
    \ that makes a song louder but not better.\n\nIf a PRNG is poorly seeded, the\
    \ output risks becoming predictable. Another analogy is dealing a pack of playing\
    \ cards. The PRNG is equivalent to the process of dealing the deck, whereas providing\
    \ the random seed equates to shuffling the deck; the randomness of the deal is\
    \ entirely dependent on the quality of the shuffle. PRNGs may suffer from error-prone\
    \ implementation or even intentional backdoors, but their core security depends\
    \ entirely on the randomness of the seeding process.\n\nLinux has two PRNGs; they\
    \ are similar but differ in one important way. The more secure of the two is /dev/random,\
    \ which is reseeded every time a random number is requested. As a safety measure,\
    \ /dev/random is only enabled if there is enough randomness to reseed it, which\
    \ in turn can lead to a big performance hit. The alternative PRNG, /dev/urandom\
    \ (the ‘u’ stands for ‘unblocking’), will supply ‘random’ numbers regardless of\
    \ whether it has been well seeded or not. Since /dev/urandom is always available,\
    \ it’s a popular but potentially unwise choice for developers.\n\nThis dependence\
    \ on reseeding raises obvious questions. Is there a reliable source of seeds and\
    \ how can you prove they’re truly random? How often does the PRNG need to be reseeded\
    \ to stay random? And how can you tell if something goes wrong and your random\
    \ numbers stop being random? Unfortunately, there are no reliable answers.\n"
  mdcn: "\n## 保护你的系统\n\n到目前为止，我们已经讨论了许多你可以采用的工具和实践方法，以保护你的系统并防止攻击，但根据你是想保护你的服务器、网络，甚至是家用工作站，你仍然还有大量可以做的事情。\n\
    \n所有可用解决方案的全集很容易导致因分析过多而产生的焦虑瘫痪，这就是为什么我们列出了一些最好的防护工具。但仍有许多其他项目和机构正在努力保护你的机器免受损害。\n\
    \n![](img/fb76008333fb7aef815b136f9f1afe5f_23_0.png)\n\n下方的 Nmap 前端 (NmapFE) 是一个设计精良且稳定的图形用户界面\
    \ (GUI)，允许你控制 Nmap 的几乎所有方面。\n\nLinux 安全模块 (LSM) 框架允许 Linux 内核支持多种安全模块以实施强制访问控制\
    \ (MAC)。SELinux 和 AppArmor 是 Linux 上最受欢迎的两个 LSM。前者允许你定义每个用户、进程或守护程序可以执行的操作，而 AppArmor\
    \ 可以使用特定于应用程序的配置来限制每个已安装的程序。容器供应商 Docker 也在开发另一个名为 Landlock 的 LSM，尽管它仍处于起步阶段。\n\
    \n除此之外，随着每个新 Linux 内核发布的更新中都有大量修复，修复了许多已识别的问题，以确保你的安全。在此基础上，内核自我保护计划 (Kernel Self-Protection\
    \ Project) 已启动，旨在为 Linux 内核提供额外的安全层。你還可以调整内核的多个参数以增强安全性。运行 **sysctl** 可查看当前内核设置的列表。你可以使用以下命令将这些设置保存到文件：`sysctl\
    \ -a > /sysctl1.settings`，这将使你能够将该文件用于参考或比较，如果你进行任何更改的话。\n\n你可以通过编辑 `/etc/sysctl.conf`\
    \ 文件来更改运行中的内核设置。在 Linux Mint 中，该文件已经存在并包含其中许多设置，但默认情况下它们是被禁用的。\n\n系统安全面临的最大风险之一来自未经测试和未知的应用程序，你必须采取预防措施来保护系统免受此类程序的侵害。实现这一目标的一种方法是通过沙箱化\
    \ (sandboxing)。\n\n### 如何操作：使用 zuluCrypt 加密文件\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_23_1.png)\n\
    \n![](img/fb76008333fb7aef815b136f9f1afe5f_23_2.png)\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_23_3.png)\n\
    \n- **01 加密单个文件**\n  前往 ZC > 加密文件 (Encrypt A File)。在弹出的对话框中，点击“源 (Source)”字段旁边的按钮，并导航到你想要加密的文件。然后在标记为“密钥\
    \ (Key)”的文本框中输入密码。zuluCrypt 将使用此信息创建一个同名文件，结尾带有 .zc 扩展名。文件加密后，请确保删除其原始版本。\n\n\
    - **02 解密文件**\n  前往 ZC > 解密文件 (Decrypt A File)。在“源 (Source)”字段中指向加密文件，并在“目标 (Destination)”字段中指向解锁文件的位置。现在输入你用于加密文件的密码，然后点击“创建\
    \ (Create)”按钮。完成后，解密后的文件将在指定的目标位置创建。若要再次锁定文件，请按照第 1 步中概述的流程对其进行加密。\n\n- **03 创建加密文件**\n\
    \  如果你需要保护多个经常访问的文件，更好的方法是将其存放在加密存储区域中。要在文件内创建加密存储设备，请前往 创建 (Create) > 文件中的加密容器\
    \ (Encrypted Container In A File)。然后输入名称，完成目录的部分路径及其大小，这取决于它将容纳的文件数量以及你磁盘上的可用空间。\n\
    \n![](img/fb76008333fb7aef815b136f9f1afe5f_23_4.png)\n\n这涉及到为脚本或应用提供一个隔离的环境，从而保护你安装的大部分系统。\n\
    \n### 使用 chroot 进行沙箱化\n\nLinux 中最古老的沙箱化工具 chroot 可用于更改进程的根目录。这可以防止 chroot 监狱内的应用访问其他目录或文件。类似地，像\
    \ Docker 这样的容器也可以用于运行隔离的应用程序实例。\n\n如果你因为感到连接互联网时需要执行太多任务才能感到安全而有些不安，可以考虑使用 Subgraph\
    \ OS。基于 Debian 的该发行版是从底层设计的，专注于安全和隐私。它附带一个加固的 Linux 内核，以及开箱即用的应用程序沙箱化、防火墙和代理功能。\n\
    \n尽管有所有这些工具，你必须理解，实现一个完全安全的系统是一个无法实现的目标。这是因为，用 Linus Torvalds 的话说，这个过程要求你：\n\n\
    > “拔掉网线并对物理安全实施严酷的措施。”没有适用于所有情况的安全黄金法则，即使有，它也早已被破解。\n\n安全是需要持续工作和个性化的。通过结合讨论过的所有工具的权重，你将获得良好的系统安全的三个基本要素——预防、保护和检测——这是任何人都能期望的最多。\n\
    \n![](img/fb76008333fb7aef815b136f9f1afe5f_24_0.png)\n\n## 加固你的系统\n\n### 自动安全加固\n\
    \n安全加固涉及从安全角度识别配置不当的系统并使其符合安全标准。这适用于系统的不同层，例如网络，在那里它将启用防火墙。在软件层面，加固涉及移除存在已知问题的软件包，仅允许安装签名软件包等等。\n\
    \nAnsible 是一个流行的加固工具，执行上述所有操作及更多。然而请注意，你仍然需要手动更新软件包和安装安全更新。要安装并运行 Ansible：\n\n\
    ```\npip install ansible\nansible-galaxy install git+https://git.openstack.org/openstack/ansible-hardening\n\
    ```\n\n### 快速提示\n\n#### 加密文件\n\n你可以使用 Vim 的 -x 开关来加密文件内容，这样除非知道用于加密的短语，否则其他人无法读取它。\n\
    \n![](img/fb76008333fb7aef815b136f9f1afe5f_24_1.png)\n\n- **04 卷类型**\n  当你点击“创建\
    \ (Create)”时，zuluCrypt 会弹出另一个窗口。除了指定密码外，你还必须从下拉菜单中选择一个卷类型 (Volume Type)。如果你想将加密卷在\
    \ Linux、Windows 和 macOS 计算机之间共享，TrueCrypt 或 VeraCrypt 卷效果最好。对于加密卷的其他值，如加密算法和文件系统，你可以安全地坚持使用默认选项。\n\
    \n![](img/fb76008333fb7aef815b136f9f1afe5f_24_2.png)\n\n- **05 挂载卷**\n  在你可以将文件存储在这个加密卷中之前，你首先必须解密并挂载它。前往\
    \ 打开 (Open) > 托管在文件中的卷 (Volume Hosted in a File)。使用弹出窗口中的文件按钮导航到加密容器文件。你可以选择性地输入文件的挂载名称，否则只需输入密码并点击“打开\
    \ (Open)”。一旦你的卷被挂载，它将像其他任何已挂载的文件系统一样出现在你的文件系统中。\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_24_3.png)\n\
    \n- **06 使用后备机**\n  现在你可以在这个挂载位置内创建目录和文件，就像在任何常规挂载设备上一样。完成后，在 zuluCrypt 界面上左键点击已挂载的卷并选择“卸载\
    \ (Unmount)”。这将卸载并加密卷，再次出现的只是一个内容无法识别的单一加密文件。按照 **步骤 5** 中的流程再次挂载该文件以显示其内容。\n\n\
    ## 随机性的问题\n\n### 你的随机性有多随机？\n\n随机性位于安全的核心。它不能再靠运气——是时候予以关注了。\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_25_0.png)\n\
    \n**理查德·穆尔德斯 (Richard Moulds)** 是 Whitewood Security 的总经理，拥有 20 年安全市场从业经验，专注于与密码学相关的部署挑战。\n\
    \n**R**andom numbers 真的非常重要。它们用于大多数计算机处理中。大多数情况下，它们是否真正随机并不重要，但在某些情况下则至关重要。在统计建模、游戏和安全方面，它们需要是可证明的随机数。对随机数最极端的要求来自密码学。随机数用于生成加密密钥，如果缺乏随机性，它们将更容易被破解。但制造完全随机的数字比你想象的要困难得多。\n\
    \n任何使用 SSL/TLS 或 SSH 进行网络加密的应用程序，都需要真正的随机数。基于 PKI 的数字签名应用程序以及专业加密应用程序，如支付和加密货币（这些领域受到严格监管并有着严格的合规要求）也是如此。弱密钥不仅会产生漏洞，而且更换成本极高。\n\
    \n但随机数从哪里来？通常是操作系统。无论应用程序只需要几个字节，还是需要完美的或“附近”随机数的许多兆字节，它们都来自同一个地方。就像在你家里一样，所有使用水的设备通常都从同一个供水系统获取水，无论其对水质或处理量的需求如何（见上文插图）。简而言之，关键的安全应用程序与更普通的任务竞争\n\
    \n> “问题是软件不会自然地表现出随机性”\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_25_1.png)\n\
    \n- **/dev/random**\n  优质流：仅在捕获了足够的熵时才提供随机数 – 否则它会停止\n- **/dev/urandom**\n  低质量流：无论捕获了多少熵，都会提供随机数\n\
    \n随机性，如果随机性成为一种稀缺资源，这可能是一个严重的问题。\n\n认为随机性可能会耗尽这很奇怪。问题是软件不会自然地表现出随机性。软件是确定性的：它是预编程的，从根本上说是可预测的。基于软件的随机数生成器通常被称为伪随机数生成器\
    \ (PRNG) 或确定性随机位生成器 (DRBG) – 但这两个名称都暗示了低于真正随机性的东西。它们使用众所周知的算法，将相对少量的随机“种子”外推为大量的“随机”数字。无论软件\
    \ PRNG 设计得多好，它本身无法创造随机性。一个类比是一个让歌曲更大声但不更好的音频放大器。\n\n如果 PRNG 种子不佳，输出就有变得可预测的风险。另一个类比是发一副扑克牌。PRNG\
    \ 相当于发牌的过程，而提供随机种子等同于洗牌；发牌的随机性完全取决于洗牌的质量。PRNG 可能遭受易错的实现或甚至是故意留下的后门，但其核心安全完全取决于种子过程的随机性。\n\
    \nLinux 有两个 PRNG；它们相似，但在一个重要方面有所不同。两者中更安全的 是 /dev/random，它每次请求随机数时都会重新播种。作为一种安全措施，只有当有足够的随机性重新播种时，/dev/random\
    \ 才会启用，这反过来又可能导致严重的性能下降。另一种 PRNG，/dev/urandom（“u”代表“非阻塞”），无论它是否播种良好，都会提供“随机”数字。由于\
    \ /dev/urandom 始终可用，它成为开发人员一种流行但可能不明智的选择。\n\n这种对重新播种的依赖提出了明显的问题。是否有可靠的种子来源？如何证明它们是真正随机的？PRNG\
    \ 需要多久重新一次播种才能保持随机？如果你知道某事出了问题并且你的随机数不再随机，如何察觉？不幸的是，没有可靠的答案。\n\n"
