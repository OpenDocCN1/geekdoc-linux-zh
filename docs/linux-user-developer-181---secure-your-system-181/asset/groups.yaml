  - "[PAGE 37]\n\n# Tutorial\n\n# Linux essentials\n\n+   **Everything is a file**\
    \  \n+   Part of the philosophy behind UNIX-like systems is that *everything is\
    \ a file*. Even the text that you type into a command prompt is treated like a\
    \ file. Commands like `grep` and `wc` do not terminate until they reach the end\
    \ of their input file. If you are typing input at the terminal instead, use `Ctrl+D`\
    \ to mark the end of input.\n\npower of the command line becomes apparent when\
    \ we combine two or more commands together using a device called a 'pipeline'.\
    \ For example, one way to count the number of files in the working directory is\
    \ to run the command:\n\n```\n$ ls | wc -l\n```\n\nIt's worth dissecting this\
    \ in order to see what each component does. The `ls` command is one we have seen\
    \ already: it prints out a list of all the files in the working directory. `wc`\
    \ is short for 'word count': `wc` is a completely separate program that takes\
    \ in text as input and returns the number of words, the number of lines and the\
    \ number of characters. If we use the command switch `-l`, then `wc` returns only\
    \ the number of lines of input.\n\nConnecting these two commands is the 'pipe'\
    \ character, `|`. The pipe means 'take the output of the previous command and\
    \ pass it in as input to the next command'. In this case, the output of `ls` is\
    \ a line-by-line list of the files in the working directory. The command `wc -l`\
    \ counts the number of lines in the output, which is the same as the number of\
    \ files.\n\n# The UNIX philosophy\n\nThe core command-line toolchain used by Linux\
    \ is modelled on the commands from the UNIX operating system, which dates from\
    \ the early 1970s. UNIX was designed to be both as lightweight and as powerful\
    \ as possible; this goal was eventually crystallised into the 'UNIX philosophy',\
    \ which was summarised in 1994 by Doug McIlroy as follows:\n\n> “Write programs\
    \ that do one thing and do it well. Write programs to work together. Write programs\
    \ to handle text streams, because that is a universal interface.”\n\nsuiated to\
    \ scripting at the command line. It means that UNIX programs are essentially boxes\
    \ like the one in **Figure 2** that take in some text as input and return some\
    \ text as output. As we will see, we can use the pipe character to combine these\
    \ boxes together, as in **Figure 3**.\n\nWe can combine more than two boxes together,\
    \ if we want. To illustrate this, let us introduce a new program, `grep`. This\
    \ acts as a filter that prints out only those input lines that match a certain\
    \ pattern. For example, suppose we wanted to count the number of files in a directory\
    \ whose filename contained the word 'email':\n\n```\n$ ls\nemail01.txt email02.txt\
