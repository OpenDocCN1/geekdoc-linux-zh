    # Secure your system


    So far, we have discussed a number of tools and

    practices that you can adopt to secure your system

    and prevent attacks, but there’s still plenty more that

    you can do, depending on whether you’re interested

    in protecting your server or your network, or even a

    home workstation.


    The entire gamut of available solutions can very well

    lead to a troubling case of paralysis from analysis,

    which is why we listed some of the best protective

    tools. But there’s still more that various other projects

    and entities are working on to protect your machine

    from harm.


    ![](img/fb76008333fb7aef815b136f9f1afe5f_23_0.png)


    Below Nmap Front End (NmapFE) is a well designed and stable GUI

    that allows you to control almost every aspect of Nmap.


    The Linux Security Modules (LSM) framework

    allows the Linux kernel to support a variety of security

    modules to implement mandatory access control (MAC).

    SELinux and AppArmor are two of the most popular

    LSMs on Linux. While the former allows you to define

    the activities which can be performed by each user,

    process or daemon, AppArmor can be used to restrict

    each installed program using application-specific

    profiles. Container vendor Docker is also working on

    another LSM called Landlock, although it’s still at the

    nascent stage.


    Apart from these, there are a large number of

    updates that ship with each new Linux kernel which

    fix many identified issues to keep you safe. On top of

    that, the Kernel Self Protection Project was started to

    provide additional layers of security to the Linux kernel.

    You can also tweak a number of parameters on your

    kernel to bolster the security. Run **sysctl** – for a

    list of current kernel settings. You can save these to a

    file with: sysctl -a > /sysctl1.settings, which will

    enable you use the file for reference or comparisons

    if you make any changes.


    You can change these settings on your running kernel

    by editing the /etc/sysctl.conf file. On Linux Mint, the

    file already exists and contains a number of these

    settings, but they are disabled by default.


    One of the biggest risks to system security is from

    untested and unknown applications and you must

    take precautions to protect your system from such

    programs. One way to do that is through sandboxing.


    # HOW TO  Encrypt files with zuluCrypt


    ![](img/fb76008333fb7aef815b136f9f1afe5f_23_1.png)


    ![](img/fb76008333fb7aef815b136f9f1afe5f_23_2.png)


    ![](img/fb76008333fb7aef815b136f9f1afe5f_23_3.png)


    **01** **Encrypt individual files**

    Head to ZC > Encrypt A File. In the

    dialog box that pops up, click the button

    adjacent to the Source field and navigate

    to the file that you wish to encrypt. Then

    enter a password in the text box labelled

    Key. zuluCrypt will use this information to

    create a file with the same name, with the

    .zc extension at the end. Once a file has

    been encrypted, make sure you delete its

    original version.


    **02** **Decrypt files**

    Head to ZC > Decrypt A File. Point

    to the encrypted file in the Source field and

    after the location of the unlocked file in the

    Destination field. Now enter the password

    with which you encrypted the file and click

    the Create button. When it’s done, the

    decrypted file will be created in the specified

    destination. To lock the file again, encrypt it

    by following the outlined procedure outlined in

    Step 1.


    **03** **Create encrypted files**

    If you need to protect a number of

    files that you access frequently, a better

    approach is to file them inside encrypted

    storage areas. To create an encrypted

    storage device within a file, head to Create >

    Encrypted Container In A File. Then enter

    the name and complete parts of the directory

    along with its size, depending on the number

    of files it’ll house and the available space on

    your disk.


    ![](img/fb76008333fb7aef815b136f9f1afe5f_23_4.png)'
