    ## 树莓派


    ### 树莓派的 Raspbian 发行版最新更新带来了 Scratch 2.0 的改进


    新功能包括支持更便捷 GPIO 访问的离线版 Scratch 2.0


    随着最新 Raspbian 系统更新，树莓派爱好者们又有了新的玩具。该更新提供了离线 Scratch 2.0 支持，通过增强 GPIO 支持实现物理计算功能，并新增了图标和
    Thonny IDE。


    虽然自定义图标为树莓派桌面增添了新的精致感，但 Thonny IDE 带来了一种在 Python 中编程的全新优秀方式，并让用户终于可以抛弃 IDLE。


    然而，最大的新闻是能够离线使用 Scratch 2.0。作为 Scratch 1.4（使用 Squeak 语言）的功能强大升级版本，Scratch 2.0
    得益于树莓派团队与 Adobe 的合作。2016 年末，发布了新版 Pepper Flash 插件，兼容 Chromium 并能够


    > LED、蜂鸣器以及来自按钮和传感器的输入可以轻松地整合到 Scratch 项目中


    ![](img/fb76008333fb7aef815b136f9f1afe5f_9_0.png)


    如上所示，除了离线版 Scratch 2.0，该更新还增加了 Thonny，这是一款面向初学者的 Python IDE


    在 Raspbian Jessie 上运行。为了应对 Scratch 2.0 需要互联网连接的问题，最新的 Raspbian 让本地 Flash 代码和 Electron
    协同工作，作为打包为应用的本地网页。这欺骗了 Scratch 2.0，使其在树莓派实际上不在线时误以为在线！


    Scratch 之前的限制也已得到解决。“我们知道人们希望将 Scratch 用于物理计算，而以前从 Scratch 访问 GPIO 引脚总是有点棘手，”树莓派基金会用户体验工程师
    Simon Long 说道。虽然在 Scratch 1.4 中是可能的，但在 Scratch 2.0 中这一功能得到了改进，使得 LED、蜂鸣器以及来自按钮和传感器的输入可以轻松地整合到
    Scratch 项目中。Scratch 2.0 还包含自定义代码块、精灵克隆和外设交互。对于 Scratch 的粉丝来说，这意味着探索基于图块的开发工具所提供潜力的无数种新方法。


    ## 恶意软件


    ### Linux 恶意软件增多，针对旧漏洞


    这次轮到 systemd 了


    2017 年 1 月，发现了一个 Linux 漏洞，一旦被利用，网络攻击者将获得目标电脑或服务器的 root 权限。近六个月后，又一个令人惊讶的漏洞被揭露。


    “这次，该漏洞允许通过利用 systemd-resolved 初始化守护程序（via TCP）执行恶意代码。由软件工程师 Chris Coulson 发现，该漏洞目前在
    Ubuntu 17.04 和 16.10 中已被 Canonical 修复。Red Hat 报告称该漏洞不影响其操作系统，而 Debian 则表示 systemd-resolved
    服务已禁用。


    追溯该漏洞至 2015 年，Coulson 写道：“恶意 DNS 服务器可以通过返回特制的 TCP 有效负载来利用这一点，欺骗 systemd-resolved
    分配一个过小的缓冲区，随后向其末尾之后写入任意数据。”


    那么 Linux 所谓的对恶意软件的免疫性如何呢？“简而言之，不免疫——这是过去的一项声明，在移动计算和智能家居设备时代已不再相关。”


    随着 Linux 使用量的增加，专门针对该操作系统定制恶意软件的风险也在增加。我们之前已看到利用 Linux 服务器发行版漏洞的问题以及桌面安全问题。庆幸的是，这些问题已相对迅速地被修复。然而，Linux
    在物联网硬件中使用量的增长为黑客打开了另一扇大门。


    2017 年第一季度，WatchGuard 报告称 Linux 是 36% 恶意软件攻击的目标。请保持警惕，并确保安装那些更新！


    ## 向 Pop!_OS 问好，一款面向创作者的发行版


    System76 不再等待 Ubuntu 添加额外功能，并宣布推出其自研版本


    基于 Ubuntu，Pop!_OS（发音为“Pop OS”）是一款极简主义操作系统，拥有流畅的安装体验。其目的是让创作者专注于创作，为他们提供快速启动以及完成工作所需的工具集。


    但指的是哪类创作者？具体包括从事人工智能、3D 建模、从事发明创造的创客，甚至计算机科学学生。


    支持该操作系统的是一个社区，在截稿时正忙于制定开发路线图，开放讨论论坛（subreddit /r/pop_os 中已有一场对话正在展开）以及行为准则。只要贡献符合特定流程，项目欢迎任何贡献者。


    与 Reddit 上的社区成员交谈时，社区经理 Ryan Sipes 解释说，Pop!_OS 未来将成为 System76 硬件的默认操作系统。“这将作为我们的默认操作系统。在
    17.10 版本发布中，你将可以在 Pop!_OS 17.10 和 Ubuntu 16.04（LTS）之间进行选择。这都是为了更多地掌控我们生产的产品。我们在
    Unity 8 上等待了三年，我们不再希望等待另一家公司来实现我们的客户和社区所要求的功能。”


    目前处于 Alpha 阶段（1.62GB，可从 https://system76/pop 获取），Pop!_OS 的首个稳定版本预计于 2017 年 10
    月发布。


    ![](img/fb76008333fb7aef815b136f9f1afe5f_10_0.png)


    ## 树莓派计算模块上的 Ubuntu Core


    再见 Unity，你好物联网！


    Canonical 对物联网的重心转移已得到证实，因为 Ubuntu Core OS 现已支持树莓派计算模块 3。其目标是让物联网制造商有机会拥抱 Linux，轻松创建高性价比设备。


    计算模块 3（CM3）是树莓派 3 的更紧凑、通用版本。它看起来像一条 RAM 内存条，可以插入带有 DDR2 SODIMM 接口的合适设备中。凭借 1GB
    内存、1.2GHz 四核 CPU 和 4GB eMMC 闪存存储，它非常适合嵌入式智能家居产品。


    Canonical 物联网与设备部执行副总裁 Mike Bell 表示：“[…] 借助 CM3，从边缘路由器到 […] 数字标牌解决方案的开发变得更加便捷和实惠
    […] 只需为你的特定需求开发自定义 snap 即可。”


    数字标牌公司 Screently 强调其对该合资项目的支持，指出带有 CM3 的 Ubuntu Core 将其设计规格与坚固的硬件相结合。


    ## Top 10

    *（日均浏览量，2017 年 5 月 31 日至 6 月 30 日）*


    1. Linux Mint

    2. Debian

    3. Manjaro Linux

    4. Antergos

    5. Ubuntu

    6. openSUSE

    7. TrueOS

    8. Fedora

    9. deepin

    10. Zorin OS


    ## 本月


    - 稳定版本发布 (22)

    - 开发中 (8)


    Mint 和 Debian 仍然是最流行的发行版，其中 Debian 9 “Stretch” 促使下载量足够多，使得 Manjaro 需要追赶很多。


    ## 亮点


    **Debian**

    如前所述，Debian 9 “Stretch” 带来了一种全新的感觉，恢复了 Mozilla Firefox 和 Thunderbird，并改善了构建网络的安全性。Debian
    9 还包括对 UEFI 的改进支持，使其成为可以安装在现代硬件上的操作系统 – 参阅我们的评测，第 98 页


    **Manjaro Linux**

    这个用户友好的 Arch Linux 版本刚刚发布了一个新的稳定更新（2017-06-20），更新了 Thunderbird、LibreOffice、Haskell、Python，以及
    Chromium 和内核。很高兴看到开发持续进行！


    **TrueOS**

    将 FreeBSD 与 Lumina 桌面相结合，TrueOS（前身为 PC-BSD）被定位为“快速、安全、现代的操作系统”。它还拥有 OpenZFS 文件系统和
    PersonaCrypt 加密，以实现完全稳定性。


    最新可用的发行版：fileiso.co.uk


    ## 采访 LINUX MINT


    ### 人民的发行版


    Linux Mint 从一个酷炫的域名创意发展成为最注重社区的 Linux 发行版之一。在又从开发田野中采摘了一个新的 Mint 发布版本后，我们与创始人
    Clément "Clém" Lefebvre 进行了对话


    ![](img/fb76008333fb7aef815b136f9f1afe5f_11_0.png)


    ![](img/fb76008333fb7aef815b136f9f1afe5f_11_1.png)


    **Clément Lefebvre**

    是 Linux Mint 项目负责人，前 Ericsson 开发者。他是仅次于公司支持的 Ubuntu 的第二大桌面 Linux 发行版用户群（非官方，因为具体统计数据难以获取）所领导的最受欢迎社区
    Linux 发行版。


    如上所示，虽然仍基于 Ubuntu 16.04 LTS，Linux Mint Cinnamon 是 Mint 生态系统中最新的旗舰发行版


    > 最近几天，Linux Mint 网站（www.linuxmint.com）上活动频繁，一系列博客文章宣布了 Linux Mint 18.2 Sonya
    四个版本的发布（评测见第 32 页），其中一个使用其官方支持的桌面环境 Cinnamon，其他分别是 MATE、KDE 和 Xfce。此次发布增加了许多功能（见“Linux
    Mint 中的新功能？”第 28 页），例如更好的蓝牙支持和新的显示管理器 LightDM。在这段忙碌的时间里，我们与会谈 Clément ''Clém''
    Lefebvre，了解这款最新发行版的进展情况。


