    ![](img/fb76008333fb7aef815b136f9f1afe5f_12_0.png)


    Above The Mint development team worked with Compulab on a series of tiny PCs.
    The fanless MintBox mini PC is the smallest at 10.8cm long


    as achievements.” Even if the margin on the Compulab boxes is low, it’s not been
    about the money for Lefebvre, it’s simply something he is thoroughly enjoyed doing.
    And in terms of whether they’ll ever manage to make their own laptops, he seems
    both a little wistful and aspirational on the subject: “If we do one day, they’ll
