    which, after six months of work, finally completes the migration to GTK+. Yes,
    the entire suite of applications and components are now GTK3+ only! Other improvements
    in the new MATE release include support; much improved accessibility; updates
    to the Caja file manager; an upgraded MATE panel; additional format support in
    the Engrampa archive manager and the return of the MATE Calculator!


    The Xfce flavour of Linux Mint has more minor updates this time round, primarily
    limited to an updated version of the Whisker application launcher menu and an
    upgrade to the xfwm4 window manager, which brings Xyner support, cursor scaling
    on zoom and various other fixes and improvements.


    Plasma 5.8 makes its debut in the KDE release of Sonya. Marking the first release
    of Plasma with LTS support, 5.8 features an all-new login and lock screen designed
    to match the look and feel of the main KDE experience. Wallpaper plug-ins can
    now be shown on the lockscreen for the first time. KDE''s applets have been updated
    to improve their efficiency. Plasma Discover (the ''KDE Software Store'') has
    been overhauled, multi-screen support is enhanced and RTL language support is
    significantly extended.


    As well as receiving security updates until 2021 as a LTS release, until 18.x
    future versions of Linux Mint will use the same package base as version 18.x,
    simplifying the upgrade process.


    How mainstream is Mint? Well, as you may be aware, Linux has had something of
    a starring role in the hit TV show Mr. Robot. Characters have discussed GNOME
    vs KDE, GNOME 2 and Kali Linux have put in an appearance – Season 3 is set to
    feature Linux Mint. Keep an eye out!


