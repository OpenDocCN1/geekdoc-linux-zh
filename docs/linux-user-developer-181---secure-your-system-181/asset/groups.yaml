    ![](img/fb76008333fb7aef815b136f9f1afe5f_88_0.png)


    Above The Control Center, a holdover from Mandrake/Mandriva lineage, provides
    single-point access to various system config tools, such as networking and firewall


    > The upside to the long gestation period is that Mageia 6 ships with a bunch
    of fresh features and performance improvements.


    out of the box, the tool''s straightforward and intuitive design make it ideal
    for users with limited or zero understanding of the underlying package management
    principles. Unfortunately, Mageia no longer provides a direct menu entry to launch
    the software management app. You must click Menu > Tools > System Tools > Mageia
    Control Center and then click Install and Remove Software to launch rpmdrake.
    You can also launch the software app from the aesthetically designed Welcome Screen.


    While rpmdrake - the graphical software management utility - still relies on urpmi
    for resolving dependencies, the developers are also working on DNF dracora, an
    alternate app to act as front-end for the DNF system, but it won''t be available
    anytime soon. The Mageia project is also heavily invested in collaborating with
    Fedora''s COPR project which aims to provide a PPA-style system for building third-party
    package repositories.


    With Mageia 6, all the apps have been ported to Plasma 5, the successor to KDE
    4 desktop. The distro has finally dropped support for Lilo and Grub Legacy and
    only offers Grub 2 as the bootloader, but you can still continue to use the others
    if upgrading from an existing installation. Users running Mageia 5 can upgrade
    to Mageia 6 if they first install all updates available for 5, but they must then
    use the DVD release of the distro, not one of the live images. The primary reason
    for the delays was bugs in the installer, but we didn''t encounter any in our
    test installs on a physical machine nor as a VirtualBox guest. But the distro
    isn''t entirely bug-free. If you wish to enable parental controls, you can do
    so using the Control Center, but the behaviour is erratic and results in crashes.
    Similarly, while the distro allows creation of snapshots such that you can roll
    back to a previous state in case of a misconfigured system, the feature results
    in frequent crashes. The individual live images only offer a handful of everyday
    office, internet and multimedia apps. But users have access to thousands of additional
    packages through the Core, Nonfree and Tainted repositories. Proprietary drivers
    for hardware components such as wireless and graphics cards are offered through
    the Nonfree repository while multimedia codecs and other packages that may infringe
    on copyright, patent or other laws are relegated to the third repository. Note
    however that of the three, only Core is enabled by default.


    @Shashank Sharma


    # Pros


    Determined developers coupled with a vast user community make Mageia a desirable
    everyday desktop distribution.


    # Cons


    The long and frequent delays that have plagued the project for the past two releases
    are a concern.


    # Summary


    A largely stable release that builds on the many changes introduced with Mageia
    5 and is an able distro for everyday use. The final release could be a perfect
    desktop for new and experienced users looking for a configurable system; and doesn''t
    require two many resources.


    8'
  - '[PAGE 89]


    # # Review  Free software


    ![](img/fb76008333fb7aef815b136f9f1afe5f_89_0.png)


    # ## BashStyle-NG 10.0


    Customise command-line settings via a GUI


    If you''ve ever come to customise your Bash prompt and, it being a while since
    the last time you''ve probably had to Google for the command, perhaps you''ve
    wished for an easy GUI way to do it? You''ll have dismissed that fancy and contradictory
    notion - after all, a GUI for Bash? - but here we present a GUI config that handles
    not just Bash settings, but Readline, Vim, nano and Git. Installation went smoothly
    once we''d added the Python configobj package to our test machine (it''s in the
    Debian/Ubuntu repositories, as well as via pip). For Bash, most of the settings
    are for prompts and colours. There''s a selection of predefined prompts; custom
    colours; a GUI for customising the prompt; and colour highlighting in grep. Extras
    include a customised cd, which can create directories on the fly; a tab completion
    blacklist (for blocking out backup files); and history settings. The Git settings
    - name, email, default editor, output colours - will be handy for new and occasional
    users. Have a dig through the other features of the package, like octal and temperature
    conversions. This is a niche piece of software, but some users will find it indispensable.


    ![](img/fb76008333fb7aef815b136f9f1afe5f_89_1.png)


    Above  Click a colourful icon and the GUI turns a more old-school grey for changing
    app parameters


    +   - **Pros**

    +       Takes away the burden of remembering all of the config file, shell variables
    and command-line settings


    +   - **Cons**

    +       Even if you like GUIs, it may seem as much trouble to open and use as
    looking for the config file option


    **Great for...**  Quick config changes without diving into the man pages

    http://bit.ly/BashStyle


    # ## Mutt 1.8.3


    Fast, efficient management of emails is a few commands away


    ![](img/fb76008333fb7aef815b136f9f1afe5f_89_2.png)


    Those of us ancient enough to remember when email wasn''t a smartphone app, but
    rather the main use of the internet, grew up with command-line clients like Elm
    and its clones Pine and Mutt. The move away from command-line clients has led
    to no gain in productivity, and with Mutt seeing a steady growth in improvements
    in the last two years, now could be the time for a revisit (or a first discovery).

    It''s one of the most efficient ways of dealing with a heavy email load. We need
    much more than a half-page review to tell you about the power of Mutt, so open
    the Newbie guide on the Mutt wiki, which also links to excellent third-party tutorials,
    then the


    full HTML manual. There is a list of shortcuts across the top line, which changes
    by context, as you''ll see after you arrow down to one of your mails and open
    it by pressing Enter. Mutt''s power comes not just with practice of the basic
    commands, but in chaining them together to speed up tedious filing options.

    Remember, those minutes spent hunting through menus in the likes of Gmail or Evolution
    and clicking checkboxes to move, archive or delete emails - all add up. Spend
    the time instead learning a few commands, and you can whizz through tasks without
    your fingers leaving the keyboard. And when you''ve shelved into your server -
    or your Raspberry Pi - you''ll be able to fire off an email, or work through the
    /var/mail/ files in an instant.


    +   - **Pros**

    +       Productive shortcuts, context-specific settings; keyboard macros automate
    complex tasks


    +   - **Cons**

    +       Plenty to learn, but the Mutt slogan is ''All mail clients suck. This
    one just sucks less!''


    **Great for...**

    Finally get on your e-mail mountain''s under control

    www.mutt.org'
  - '[PAGE 90]


    # VIRTUAL TABLETOP GAME VIEWER


    # Rolisteam 1.8.2


    Can''t make it to a friend''s tabletop game session? Join them remotely


    ![](img/fb76008333fb7aef815b136f9f1afe5f_90_0.png)


    > It started with a post on the French-language Ubuntu forum, asking for help
    porting some


    Dungeons & Dragons software, which turned out to be written with Qt, and in short
    order was running on Ubuntu 7.10. Nearly a decade later, Rolisteam not only compiles
    easily under GNU/Linux, but has grown and improved considerably, and is translated
    into several European languages. It''s about more than D&D, working as an efficient
    way of playing any tabletop game between remote players, as it facilitates viewing
    all of the necessary character sheets, maps and so on, across the internet.


    The wiki and other (multilingual) documentation does cover everything, but you
    will need to dig


    through it to get a complete picture. Given that most Dungeons & Dragons devotees
    put a lot of time into their setups, this won''t put many off. One user, usually
    the game master, sets up as server - or host - and the other players connect to
    them by server address; the port (default: 6660) needs to be open.


    "The goal is to make Rolisteam-managed RPG games as good as RPG games around your
    table," says the homepage. All the components are there: character sheets; sharing
    of maps and pictures; vector mapping; dice rolling and secret dice rolling; chat;
    and ambient music (a mixed blessing). Rolisteam even has a built-in Twitter bot
    that you can call with tweets like #roll 5d10; you can also run the DiceParser
    locally in game viewer.


    # Pros


    Covers just about everything you need for a tabletop game with nifty vectorial
    mapping


    # Cons


    Ad hoc network connections can be problematic for any app - look out for firewall
    issues


    # Great for...


    Getting a tabletop on for D&D when you can''t get together


    www.rolisteam.org


    # CODING EDITOR


    # TKE 3.1


    A friendly, feature-full code editor without the bulk


    ![](img/fb76008333fb7aef815b136f9f1afe5f_90_1.png)


    Another text editor? It''s easy to start a text editor project, but it takes real
    drive to keep one going through several versions, so it''s worth taking a look
    at what TKE has to offer. It has syntax highlighting for 85 languages to hand
    multi-cursor/multi-selection support, and quick navigation through code with the
    Bird''s Eye text viewer. TKE is written in Tcl, with a minimalist Tk GUI.


    While installation was easy enough, and syntax highlighting and other features
    worked across many languages that we tried, there were some problems opening files:
    We experienced lock-ups of several seconds, or ''File does not exist'' messages
    when other editors had no problems. We acknowledge that our test machines can
    throw up anomalies of their own and suggest, given that all else was fine, that
    readers download TKE themselves and give it a go.


    While Tcl''s Tk toolkit may be familiar to you - it''s used in many Python projects,
    and fairly widely with other scripting languages - you might not be familiar with
    the Tcl language. A quick browse through the well-organised source files may pique
    your interest enough for you to try it out in your next scripting project. Extended
    use of TKE should convince you further.


    ![](img/fb76008333fb7aef815b136f9f1afe5f_90_2.png)


    Above TKE is a code editor with plenty of useful features that aren''t obscured
    by loads of cruft


    # Pros


    At last, a powerful code editor without the bloat of IDEs or the all-or-nothing
    embrace of Vim) and Emacs!


    # Cons


    Some lock-ups and it sits in a difficult niche between simpler editors like nano,
    and fully-fledged IDEs


    # Great for...


    A not so generally robust Tcl use for Sunblime Text


    http://tke.af.net'
