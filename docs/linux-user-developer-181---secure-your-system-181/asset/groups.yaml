    \ AWS relaunched with S3, SQS and EC2. The three original services launched as\
    \ ‘Amazon Web Services’ still underpin the core system functionality today with\
    \ file storage, messaging queues and server instances.\n- **NOVEMBER 2010**: All\
    \ Amazon sites hosted on AWS. Surprisingly, it took nearly four years for Amazon\
    \ to migrate its own services to the AWS platform, but that move did show huge\
    \ confidence in the project.\n- **APRIL 2013**: Amazon offers certification. Engineers\
    \ working with AWS services can complete Amazon certification in a range of areas,\
    \ providing professional validation of their AWS skills.\n- **APRIL 2015**: AWS\
    \ turns first $265 million profit. Amazon is never shy of investing huge sums\
    \ of money before eventually turning a profit; AWS took nearly ten years to break\
    \ even.\n- **DECEMBER 2016**: AWS London region launched. AWS now offers many\
    \ of its services out of London, with the city joining Frankfurt and Ireland as\
    \ a European location.\n"
  mdcn: "\n## 关于 WebSockets\n\nWebSockets 是 HTML5 标准的一部分，与 Erlang 没有任何关系。然而，WebSockets\
    \ 提供了一种双向异步套接字，允许浏览器与外部世界（包括用 Erlang 编写的程序！）进行通信。所谓异步，是指 WebSockets 发送数据时无需等待响应。由于\
    \ Erlang 在设计上也是异步的，因此 WebSockets 是与 Erlang 程序通信的完美方式。\n\n在开发使用 WebSockets 的 Erlang\
    \ 应用程序时，你需要三个组件才能使一切正常运行：一个运行部分代码的 Web 浏览器、一个执行一些 Erlang 代码的 Erlang 应用程序（A），以及另一个能够与\
    \ WebSockets 协议通信的 Erlang 应用程序（B）。Erlang 应用程序 A 包含 Web 应用的逻辑，以及执行数据库通信等任务所需的 Erlang\
    \ 代码。Erlang 应用程序 B 负责将消息从 Erlang 应用程序 A 传输到 WebSockets，反之亦然。\n\n你可以在 https://tools.ietf.org/html/rfc6455\
    \ 找到 WebSockets 协议的 RFC 文档。\n\n为我们的应用程序添加一个名为 /hello_mochi 的新网页，这需要编辑我们之前创建的 /.src/hwmochi_web.erl\
    \ 文件：\n\nhwmochi_web.erl 中最有趣的代码是处理新支持的 URL 行为的代码：\n\n```erlang\n[\"hello_mochi\"\
    \ ] ->\n    Req:respond({200, [{\"Content-Type\", \"text/html\"}],\n        \"\
    <h2 style='color:#057;'>Hello MochiWeb!</h2>\\n\"});\n```\n\n图 7 展示了 /.src/hwmochi_web.erl\
    \ 文件的完整 Erlang 代码——其中大部分是自动生成的！图 8 展示了上述 Erlang 模块提供页面时，Web 浏览器在屏幕上显示的内容。请注意，MochiWeb\
    \ 会自动生成一个 /hello_world URL，如果你愿意可以删除它。\n\n你可以通过编辑 /.src/hwmochi_sup.erl 文件来更改\
    \ HTTP 服务器监听的端口号。下一条 grep 命令的输出显示了包含相关代码的文件和行：\n\n```bash\n$ grep -n 8080 ./src/*\n\
    …/src/hwmochi_sup.erl:44:  web = web_specs(hwmochi_web, 8080),\n```\n\n通过查看 MochiWeb\
    \ 项目和 Cowboy 项目的结构你就会发现，它们非常相似，这使得开发者的生活简单了许多。你可以在 https://github.com/mochi/mochiweb\
    \ 找到更多关于 MochiWeb 的信息，但只有实践才能让你更擅长使用 MochiWeb！\n\n那么，仅为了创建 Web 应用程序而学习 Erlang\
    \ 值得吗？答案毫无疑问是值得的！\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_54_0.png)\n\n_Above\
    \ useMochi.erl 的 Erlang 代码，在此处你告诉 MochiWeb 它将支持哪些 URL_\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_54_1.png)\n\
    \n在此目录下运行 make 将编译这个示例项目，并允许你通过执行 ./start-dev.sh 脚本来启动它。目前，你拥有一个监听 8080 端口的 Web\
    \ 服务器，你可以通过在 Linux 终端中执行 `wget http://127.0.0.1:8080` 来测试它。这将创建一个 index.html 文件，包含以下\
    \ HTML 代码：\n\n```html\n<!html>\n<head>\n<title>It Worked!</title>\n</head>\n<body>\n\
    \    hwmochi running.\n</body>\n</html>\n```\n\n上述代码可以在静态 HTML 页面 /priv/www/index.html\
    \ 中找到。因此，我们现在应该让事情变得稍微有趣一点。我们稍后将做的是添加\n\n_Above useMochi.erl 的输出，它使用 MochiWeb\
    \ Erlang 模块实现了一个简单的 HTTP 服务器_\n\n## LINUX 环境下的 AMAZON WEB SERVICES\n\n**Peter\
    \ O'Brien** 深入探究了驱动 Amazon 服务功能的强大基础设施，这些基础设施通过 Amazon Web Services (AWS) 在 Linux\
    \ 平台上开放给公众，以满足个人及企业的各种托管需求。\n\n如果你想在云端托管服务——无论是网站、数据库、文件还是任何通过网络访问的内容——都有大量选项可供选择。在决定使用哪项服务时，你会综合考虑诸多因素，如价格、性能、可靠性和声誉。就声誉而言，很少有服务比\
    \ Amazon Web Services (AWS) 更受人尊重，且这并非毫无道理。Amazon 的网站最近一次宕机是什么时候？如果它能承载其接收到的海量流量并保持规模运行，那么它很可能也能满足你的需求。传统上，高昂的成本是许多人使用\
    \ AWS 的门槛，但近期的变化使得试用该服务变得比以往任何时候都更容易。\n\nAmazon Web Services 已经存在多年，尽管它经历过——并仍在经历——持续的变更和改进。该公司最初于\
    \ 2002 年推出，愿景是开放 Amazon 的技术和产品数据，使第三方能够构建自己的应用程序。这一概念在 2003 年得到细化，提出了构建零售运营所用基础设施的提案，将其作为“基础设施即服务”产品提供，这有可能为公司提供额外的收入来源。该想法得到了验证，自\
    \ 2006 年 3 月全面推出以来，AWS 呈现巨大增长，预计 2017 年为 Amazon 带来约 130 亿美元的净利润。\n\n除了 AWS 提供的庞大且互操作性强的服务范围外，其关键优势之一在于它位于许多不同的地理位置。该服务在北美提供六个区域，在南美、欧洲（包括伦敦）以及亚太地区各提供六个区域。对于希望向全球用户提供服务的公司而言，这一点极具价值，同时借助在地理上偏远位置托管服务和数据的能力，也提供了弹性。此外，每个区域都有多个“可用区”，由一个或多个独立的数据中心组成，每个数据中心都有独立的电源和连接。这些可用区被刻意彼此隔离，以防止故障在区域间扩散。AWS\
    \ 还在全球提供 54 个“边缘”网络接入点，可用于将内容托管在更接近客户的位置。\n\nAWS 服务通常按需使用，并按使用量收费（尽管可以通过预留资源获得折扣）。新用户可享受免费套餐选项，该选项为\
    \ AWS 的许多服务提供免费的基础级别服务。目前，该公司在多种技术领域提供超过 70 种服务，并通过功能强大的 RESTful API 进行访问，访问权限由\
    \ IAM（身份与访问管理）控制，IAM 位于 AWS 的核心，允许对访问进行极其精细的控制。\n\n> “若要预先了解您正在构建的系统成本，AWS 提供了一个简单的成本计算器”\n\
    \n![](img/fb76008333fb7aef815b136f9f1afe5f_56_0.png)\n\n_Above AWS 控制台提供了访问大量\
    \ AWS 服务的入口，同时也包括计费和支持服务。_\n\nAWS 庞大基础设施及其按使用付费模式的一个关键优势在于，它提供了快速扩展已配置资源的能力。如果你管理的服务器工作负载在所需资源方面波动较大，或者你希望处理突发的流量涌入，AWS\
    \ 是一个不错的选择。理解 AWS 工作原理的最佳方法是将服务视为一组模块。每项服务独立运行，因此你可以从众多可用的产品中选择满足你需求的产品。然而，尽管这些服务完全独立，但它们被设计为彼此具有良好的互操作性，共享诸如公共\
    \ API、命名约定、前述 IAM 认证系统及连接概念等属性。虽然 Amazon 提供了广泛的 Web 服务，允许你控制基础设施的各个方面，但除非你选择使用，否则你不必使用它们——该公司还为多种编程语言提供了工具和库，以及一个功能齐全的管理控制台，再次，服务是单独呈现的，但共享许多常见的界面概念。\n\
    \n### 控制成本\n\n使用 AWS 等云服务的一个主要担忧是成本。如果你超出了免费套餐，或者你的基础设施突然扩展，你需要支付多少费用？如何预先了解你正在构建的系统成本？AWS\
    \ 提供了一个简单的成本计算器，帮助你预测价格，但首先需要理解几个关键概念。价格（可能因地区而异）使用诸如时间（例如服务器在线小时数）、容量（如数据传输量）、计数（在使用消息队列等服务时）或时间-空间（如数据在一段时间内的存储量）等指标。虽然成本可能令人担忧，但\
    \ AWS 提供了优秀的工具来管理支出。除了计费功能外，AWS“成本管理器”（Cost Explorer）允许你深入分析支出的去向，而强大的计费警报（由用于监控整个\
    \ AWS 系统的“CloudWatch”系统驱动）可以让你在成本超过预定义限额时收到通知。安全性始终是一个主要关注点，也是公司转向 AWS 的另一个原因。该公司对服务的访问（包括物理数据中心和网络本身）进行严格控制、监控和审计。你可以确信其内部秩序井然，并提供了确保你也能做到同样的工具。除了使用身份与访问管理\
    \ (IAM) 对 AWS 资源创建非常精细的权限外，你还可以对数据应用 ACL 类型的权限（并确保数据静态加密），配置 VPC（虚拟私有云）以将你的资源与其他虚拟网络或互联网隔离。此外，你可以配置安全组以提供控制进出服务器流量的虚拟防火墙，并在启动虚拟服务器时指定密钥对，该密钥对用于加密登录信息，确保只有拥有私钥的人才能访问你的实例。\n\
    \n![](img/fb76008333fb7aef815b136f9f1afe5f_56_1.png)\n\n### 时间线\n\n- **2003 年底**：提出了如今我们所知的\
    \ AWS。虽然该公司当时无法预料 AWS 增长得有多快，但 Amazon 意识到向他人提供自身的弹性基础设施将具有价值。\n- **2006 年 3 月**：AWS\
    \ 随 S3、SQS 和 EC2 重新推出。这三个作为“Amazon Web Services”推出的原始服务，至今仍支撑着核心系统功能，涵盖文件存储、消息队列和服务器实例。\n\
    - **2010 年 11 月**：所有 Amazon 站点托管在 AWS 上。令人惊讶的是，Amazon 花了将近四年时间才将自己的服务迁移到 AWS 平台，但这一步显示了对该项目的巨大信心。\n\
    - **2013 年 4 月**：Amazon 提供认证。使用 AWS 服务的工程师可以在多个领域完成 Amazon 认证，为其 AWS 技能提供专业验证。\n\
    - **2015 年 4 月**：AWS 实现首个 2.65 亿美元利润。Amazon 从不敢于在最终盈利之前不投入巨额资金；AWS 花了将近十年时间才实现收支平衡。\n\
    - **2016 年 12 月**：AWS 伦敦区域推出。AWS 现在从伦敦提供其许多服务，该市加入了法兰克福和爱尔兰，成为欧洲的一个服务位置。\n\n"
