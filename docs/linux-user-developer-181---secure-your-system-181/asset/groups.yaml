    # For the 10%


    I was interested to read Dr Nikoalias Hedberg''s letter [L&D180] to, pH4) an only
    finding 10% of L&LD relevant to him. I am not quite a “10 by percent (’f’ I were
    I probably wouldn’t buy the magazine, but it''s great he gets so much out of that
    small percentage), but I would like to see some more noob-friendly content in
    my monthly hit of Linux-verse stuff. We’re not all professional programmers, and
    I’d like to dabble.


    Dan Jacobs


    Chris: Thanks, Dan. As I said to the good doctor Hedberg, we do cater for a wide
    range of readers and no level does tend to start at around the enthusiast level.
    Our last survey indicated that most of our readers have been using Linux and computers
    for a number of years (or decades in some cases). However, we’ve taken on board
    what you and


    others have said and are introducing a Linux Essentials series at the front of
    tutorials (see p36, if you haven’t spotted it already).

    We’re kicking things off with an intro to Bash. (You may have heard it referred
    to as “the terminal”, which conjures up something dark and mysterious.) Bash is
