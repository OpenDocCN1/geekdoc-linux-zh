    \ LibreOffice、Firefox、Thunderbird、VLC 和 GIMP。\n\nMint 通常被视为初学者的良好 Linux 发行版，特别是使用\
    \ Cinnamon 桌面环境时，而默认包含 Wine（Windows 兼容性层）则进一步增强了这一优势。“Mint4win”允许直接从 Windows 安装\
    \ Linux Mint，这与 Ubuntu 中的“Ubiquity”安装程序功能类似。这是一个特别有用的工具，因为它无需对主系统驱动器进行重新分区。由于\
    \ Linux Mint 基于 Debian 和 Ubuntu，它提供超过 30,000 个软件包以及市面上最好的软件管理器之一。其可靠性值得注意，这得益于对软件更新的保守策略以及一个名为“mintUpdate”的独特更新管理器，它是“MintTools”套件的一部分。该更新管理器旨在防止\
    \ inexperienced 用户安装不必要的更新或需要特定技术知识才能安装的更新，方法是基于更新的稳定性和必要性为更新分配一个安全级别（从 1 到 5）。\n\
    \nMintTools 中还包含 mintinstall，这是一个用于从 Ubuntu 和 GetDeb 仓库安装 .mint 文件或软件包的管理器。其他历史上包含的工具包括\
    \ mintMenu，一个方便的全局菜单；mintBackup，一个备份工具；mintUpdate，一个更新管理器；mintHammy，一个基本的家长控制工具；mintDesktop，一个桌面配置工具；以及\
    \ mintWelcome，一个浮动欢迎屏幕。\n\nLinux Mint 的第一个 18.x 版本是该发行版发展历程中的一个重要里程碑。其底层基础更新为\
    \ Ubuntu 16.04 LTS，特别是 Cinnamon 和 MATE 桌面经过精炼——遵循进化路径而非选择激进的变革，在一个动荡的世界中（尤其是对于正在从\
    \ Unity 转换的 Ubuntu 而言）提供了一些令人欢迎的稳定性。回顾 Linux Mint 的根源，安装、使用和稳定性比以往任何时候都更好，为从 Windows\
    \ 跨过来的用户提供了良好的体验。新的 Mint-Y 主题首先在“Sarah”版本中预览，随后基于用户反馈进行了调整和精炼（当然，这正是 Mint 的特色！）。\n\
    \n![](img/fb76008333fb7aef815b136f9f1afe5f_28_1.png)\n\n# 桌面环境\n## Cinnamon 3.4\
    \ 的新特性\n\nCinnamon 3.4 于今年五月发布，现已进入最新的 Linux Mint 版本（也可以安装在其他发行版上）。虽然主要是一个修复错误和提升性能的版本，但新版本添加了许多新功能，包括桌面网格、多进程改进、文件搜索中的通配符支持、面板启动器中的桌面操作、额外的屏幕保护程序配置选项、更好的鼠标加速和灵敏度配置，以及在系统设置中管理\
    \ systemd 单元和支持 lightdm 设置（由于 Mint 18.2 转向 LightDM，这一点很重要）。一个新的网站 - https://cinnamon-spices.linuxmint.com\
    \ 现已可供 Spices 使用：包括 Cinnamon 的主题、小部件、桌宠和扩展。目前约有 300 个可用，允许对 Cinnamon 体验进行广泛的自定义。\n\
    \n### 2010 年 9 月 7 日\nLMDE 是 Linux Mint 的一个替代版本，基于 Debian。LMDE 实现为滚动发布发行版，不绑定于特定的发布时间表。\n\
    \n### 2011 年 5 月 26 日\nLinux Mint 11 'Katya' 是最后一个包含特定 x64 支持镜像的版本。随着平台使用越来越广泛，这些镜像已整合到后续所有版本的主镜像中。\n\
    \n### 2011 年 11 月 26 日\n带有 MATE 桌面的第一个 Mint 版本出现在 12 'Lisa' 版本中，同时还有 Cinnamon\
    \ 的前身“GNOME 3 with MGE”。MATE 实际上是 GNOME 2 的精神继承者。\n\n# 额外应用\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_29_0.png)\n\
    \n## Pix\n\n一个图像浏览器、查看器、组织器和编辑器，支持数码相机导入、幻灯片放映、图像重命名、图像转换和重复项删除。此外还有插件系统以支持扩展。\n\
    \n![](img/fb76008333fb7aef815b136f9f1afe5f_29_1.png)\n\n## Xplayer\n\n一个强大的媒体播放器，可以读取多种文件格式。该应用支持\
    \ DVD 播放、电视输出、全屏模式、键盘控制、字幕，并且像 Pix 一样具有可扩展的插件系统。\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_29_2.png)\n\
    \n## Xed\n\n这款文本编辑器在 Mint 18 中取代了 Gedit 和 Puma。虽然是一个简单的编辑器，但 Xed 比大多数编辑器功能更多，包括语法高亮、远程文件编辑、文件比较、文件历史、插件自定义和基于标签的界面。\n\
    \n对于版本 18，更新故事再次进行了重大更新。对于喜欢 shell 的用户，apt 命令获得了与同名 Debian 工具的兼容性。在图形界面方面，更新管理器（Update\
    \ Manager）享受了一些重大改进，提供三种广泛的更新设置选择：安全选项，仅提供稳定更新；默认选项，安装稳定更新但也提供可能影响稳定性的更新；以及“放下谨慎并更新所有内容”选项，如果你不怕搞坏东西的话。Mint\
    \ 中的内核更新工具是一个真正的高光亮点，超越了其他发行版提供的任何工具，允许你轻松安装和测试较新的内核。Linux Mint 18.1 'Serena'\
    \ 代表了原始版本的一个小型更新。\n\n> 2017 年 7 月发布了 Linux Mint 18.2 'Sonya'，这是一个长期支持版本，将得到支持直至\
    \ 2021 年\n\nCinnamon 3.2 增加了更多的润色，包含的 X 应用接收了小的界面调整，而且——你猜对了——软件更新和安装也得到了精炼。登录屏幕显示管理器\
    \ MDM 接受了一些最显著的技术改进，这说明了问题的严重性。\n\n2017 年 7 月发布了 Linux Mint 18.2 'Sonya'，这是一个长期支持版本，将得到支持直至\
    \ 2021 年。Mint 18.2 提供 Cinnamon、MATE、KDE 或 Xfce 桌面环境，并且再次基于 Ubuntu 16.04。\n\nLinux\
    \ Mint 18.2 'Sonya' 在基础系统中包含了许多新功能和改进，并且在每个支持的桌面环境中也进行了额外的更改。对于常规蓝牙用户来说，新的 Blueberry\
    \ 用户界面是一个巨大的福音。除了大幅改进的用户界面外，Blueberry 还增加了协议切换器、开箱即用的 OBEX 文件传输支持（使您可以轻松地从蓝牙设备（如手机或平板电脑）向计算机发送文件）以及更改计算机蓝牙名称的选项。在最新版本中，对包含的\
    \ X 应用投入了大量工作。文本编辑器 Xed 在用户界面方面有了重大改进。智能侧边栏和底边栏、深色主题、行排序、键盘和鼠标驱动的缩放、正则表达式搜索、简化的标签切换以及改进的换行可访问性等功能，使该应用比以往任何时候都更强大。媒体播放器\
    \ Xplayer 也在用户界面方面进行了改进。由于播放控制和进度条位于同一行，且状态栏被移除，界面更加紧凑。键盘快捷键得到改进和扩展，并且与 Xed 一样，增加了对深色主题的偏好支持。之前存在一定\
    \ bug 的屏幕显示也已修复。Pix 图像工具现在包含改进的键盘快捷键，并得到了一点视觉润色。Reader PDF 工具经历了更广泛的重新设计，并增加了触摸屏支持，特别是如果您在可转换机器上使用\
    \ Mint 时非常有用——现在您可以用手指在屏幕上滑动以快速浏览页面，甚至可以通过捏合操作进行放大或缩小。\n\n最新版本的 Cinnamon 3.4 更新伴随着一次重写：从零开始构建的\
    \ Cinnamon Spices 网站。重写的目标不仅仅是简单的外观大修——该项目专注于提高安全性，并确保比以往更好的质量和兼容性。这\n\n# 时间线\n\
    \n- 2012 年 5 月 22 日\n  - Linux Mint 13 'May' 版本是第一个将 GNOME Shell 分支 Cinnamon 作为默认桌面环境提供的版本。还提供了\
    \ MATE（在版本 12 中添加）、KDE 和 Xfce。\n- 2013 年 5 月 29 日\n  - 自版本 16 'Olivia' 起，所有不同桌面环境的版本共享相同的共同代码库。版本\
    \ 15 基于 Ubuntu 13.04，提供 Cinnamon、MATE、KDE 和 Xfce。\n- 2014 年 5 月 31 日\n  - 版本 17\
    \ 'Olivia' 是第一个支持点更新（point sub-releases）的版本。命名约定似乎也已改变，保留女孩的名字，但 17.2 及以后的点更新不再使用字母表中的下一个字母。\n\
    \n"
