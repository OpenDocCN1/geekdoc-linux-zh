    \ 100% (1681/1681), done.\n```\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_53_0.png)\n\
    \n**图注** 处理所有 /URL 请求的 root_handler.erl 模块的 Erlang 代码\n\n现在您可以自由使用 MochiWeb！\n\
    \n### 提供 'Hello World!' 页面\n\n本节将展示如何编程 MochiWeb 以提供 'Hello World!' 页面。这个简单的例子将帮助您更好地理解\
    \ MochiWeb 的工作原理。您可以通过在 mochiweb 目录内部执行以下命令创建一个名为 hwmochi 的新项目：\n\n```bash\n$\
    \ make app PROJECT=hwmochi\n```\n\n然后，您需要通过执行 cd ./hwmochi 命令进入位于 mochiweb 目录外部的\
