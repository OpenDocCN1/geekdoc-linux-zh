    Cinnamon 的整体感知中起着重要作用。朝着“一切只需正常工作”这一既定目标取得的进展，随着此版本的发布又近了一步。


    Linux Mint 18.2 的 MATE 版本搭载了 MATE 桌面 1.18 版，经过六个月的工作，终于完成了向 GTK+ 的迁移。是的，整套应用程序和组件现在仅支持
