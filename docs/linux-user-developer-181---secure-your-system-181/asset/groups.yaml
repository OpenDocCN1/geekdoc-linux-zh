  mdcn: '

    以下

    如果你是订阅者，你每个月都应该收到一封友好的欢迎时事通讯。我们还在为定期发布关于Linux世界动态的新闻通讯做准备，并且很快就会推广注册。


    ![](img/fb76008333fb7aef815b136f9f1afe5f_94_0.png)


    你是否有可能通过 Zinio 找到我的新订阅并将其以某种方式重新关联起来？


    **米凯尔·斯特恩维斯松**


    **克里斯：** 哎呀。很抱歉，米凯尔。很高兴你仍然是订阅者。我已将你的问题转给数据库管理员，确保我们修正那个字段，并每月通过友好的时事通讯欢迎回来。不幸的是，你并非个例。我们有几位读者投诉说，他们并未申请却被加入了订阅者名单，或者新订阅者刚注册就被标记为已失效！结果不太好，但据我了解，大多数情况下这是因为账户信息从
    Imagine Publishing 迁移到 Future plc 系统所导致的。过去八个月，该公司经历了一个类似“博格化”的过程，双方系统或以某种方式被废弃、转移或合并。希望我们能顺利度过，但如果遇到问题，请使用官方渠道，发送邮件至
    linuxuser@futurenet.com，我们会不断替你催促。


    ## 向 Knoppix 致敬


    我欣赏了你们的《发行版工具包完全指南》[LU&D#179，第18页]，但看到 Knoppix 被安排在该专题的末尾，我感到有些失望。如果不提及 Knoppix，就无法全面介绍
    Live CD。它现在常常被人遗忘，但它在概念上（甚至在代码层面）是所有 Live CD 的基础。


    **菲尔·伊瓦泰罗**


    **克里斯：** 你说得对。实际上，我们的光盘编辑尼尔·博斯威克提醒我们，应该以赞美之词来谈论这款久负盛名的 Live 发行版，因为他年纪够大，说起第一次使用它时便会两眼放光。（我在办公室以前叫他“灰白的博斯威克”，直到他发现后，我也开始变得灰白，并意识到这其实没那么好笑。）


    Knoppix（www.knopper.net）再过几个月就将满16岁，我们必须向它的创造者克劳斯·克诺珀致敬，他意识到可以将 Linux 软件放在修复盘上，并使其在大多数机器上启动，以执行故障排除任务。鉴于微软此前对
    Linux 的敌意，许多 Windows 用户因其功能正常的操作系统而欠了一位手持 Knoppix 的“白骑士”式 Linux 朋友的感激之情，这就颇具讽刺意味。对于不了解的人，除了作为展示软件产品演示的极佳方式外，Knoppix
    还是出色的 Windows 恢复光盘，可用于多种任务，包括读取、写入和恢复多种文件系统、编辑注册表、创建系统备份以及扫描恶意软件。


