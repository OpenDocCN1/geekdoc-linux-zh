    impressive hardware virtualisation features, QEMU can also do user-mode emulation
    to run apps created for one platform on an entirely different one.


    ### Native hardware support

    QEMU VMs can interface with many types of physical hardware on the host, including
    audio interfaces and all types of USB devices. But this isn’t one of its strongest
    suits. Instead, you can use QEMU to emulate various kinds of peripherals for its
    wide range of supported architectures.


    ### Integration with the host OS

