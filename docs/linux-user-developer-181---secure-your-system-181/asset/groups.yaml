    ## 内存与调度器工作


    被称为 TLB（转换预取缓冲区）。TLB 在微处理器核心执行过“页表遍历”后，会在核心内部存储虚拟地址（VA）到物理地址（PA）的转换信息，该遍历操作基于代表正在运行的进程（在内核中称为“任务”）所使用的虚拟内存区域（VMA）的页表。当发生进程切换时，必须确保新的进程看不到过时的转换数据，因此会执行
    TLB“失效”操作。在传统上，这在 x86 架构上（与现代替代方案，如 64 位 ARM 相比）开销较大，但随着 TLB 中启用 PCID（进程上下文 ID）标签支持，开销已减小，这使得两个不同地址空间的转换可以独立共存而互不冲突。


    其中最引人关注的问题之一是，林纳斯（Linus）是否会决定合并 RISC-V 架构的初始补丁。我们在上一期中讨论了 RISC-V。新架构的启用补丁第 4 版由
    Palmer Dabbelt 发布，其中整合了迄今为止收到的所有现有反馈意见。虽然支持尚不完整（它没有为特定的真实“机器”提供实际驱动程序），但它构成了后续启用实际平台的基础。截至本文撰写时，该补丁尚未被合并到
    Linux 4.13 的林纳斯代码树中。


    Jérôme Glisse 发布了他在缓存一致设备内存（CDM）方面的另一轮迭代工作，这建立在他之前关于 HMM（异构内存管理）的工作之上。CDM 的理念是为
    Linux 提供一种通用的手段来处理“一致性”内存——也就是说，表现为普通 RAM 且其内容可以在不同设备和核心之间共享而不同步的内存——这些内存存在于即插即用适配器中，例如某些未来的显卡和服务器中的工作负载加速器模块。


    AMD 团队已发布了其安全内存加密（SME）和安全加密虚拟化（SEV）补丁的更新。SME 可以通过页表将“单个内存页标记为加密。被标记为加密的内存页在从 DRAM
    读取时会自动解密。”这项技术允许用户（尤其是数据中心运营者）确保数据不仅在静态时（在磁盘上）加密，甚至在离开微处理器时也始终处于加密状态。因此，可以在运行支持
    SEV 的虚拟机的最终用户与 AMD（通过芯片中构建的各种附加功能）之间建立信任链，使得托管该 VM 的数据中心公司无法洞察正在运行的 VM 内存的内容。我期待在我的云
    VM 中拥有这样的功能。


    Nicolas Pitre 正在开发一个“调度器精简”补丁系列，旨在“[使] 可以配置掉调度器的某些部分，如截止时间和实时调度器类”。Linux 调度器代码决定了系统何时从运行一个进程（在内核中称为任务）切换到另一个。


    在现代多核系统中，可能有很多进程实际上在同时运行，但现在甚至很少有足够多的 CPU 核心来同时执行每个任务。相反，多任务处理的错觉是通过调度器快速在一个进程和另一个进程之间切换来实现的。Nico
    旨在使精简调度器代码以用于非常小的嵌入式系统成为可能，在这些系统中，一些常规功能并不是必需的。例如，市场上一些较大的 IoT 设备可能就是这样。


    本月最后，我想花一点时间请求大家提供您希望在未来的问题中深入涵盖的内核开发主题的输入。如果您有一个渴望看到本栏目涵盖的热点问题，请通过推文或写信至 linuxuser@futureret.com
    联系我们。


    ![](img/fb76008333fb7aef815b136f9f1afe5f_16_0.png)


    ![](img/fb76008333fb7aef815b136f9f1afe5f_17_0.png)


    ## 保护您的系统


    阅读孙子的著作只是应对那些试图危害您 Linux 机器的人的第一步。Shashank Sharma 揭示了你接下来需要做什么。


    Reddit 上有一个完整的线程在讨论来自《哈利·波特》书的阿拉斯托·“疯眼”·穆迪教授是否曾说过那句口头禅：“保持警惕！”无论这句话应归谁所有，如果你关心保护你的
    Linux 安装，无论是作为家庭用户还是系统管理员，采纳这种座右铭都是明智的。


    你用来防御威胁的所有操作范围都分布在接下来的几页中。我们将指导你围绕机器创建数字护城河，以阻止入侵者。这包括使用 KeePass2 等密码管理器，使用安全登录，使用
    ClamAV 检测特洛伊木马、病毒和恶意软件等。我们还将展示你如何通过自动化许多基本任务来简化生活，例如使用 Nmap 等工具监控端口的扫描器，并实施 logcheck
    和 logrotate 等工具来理解由各种应用和服务生成的所有日志。沿途我们将帮助你部署 rootkit 检查器，讨论各种密码强化措施以及更多内容。最后，我们将讨论致力于使
    Linux 对服务器和网络更加安全的项目，以及使内核更加健壮的努力。


    虽然本特性使用 Linux Mint（在封面光盘中），但这里讨论的所有工具同样可以轻松地用于任何流行的发行版，如 CentOS、Fedora、Mageia、Ubuntu、Debian
    等。


    但首先，从第一步开始。这些是你必须并且可以采用的保护机器的技巧。如果你有兴趣保护亲戚的桌面（他们用它来浏览互联网以获取日常娱乐或世界政治新闻），即使这些更改也应该足以让你放心。


    第一步是选择正确的发行版。听起来可能有点傻，但在决定使用任何 Linux 发行版之前认真思考是有原因的。你必须考虑该发行版是否有一个专门的小组致力于推动定期的
    bug 修复和安全更新。这很重要，因为在近年来，许多流行的 Linux 应用和服务（如 Samba）中的安全弱点已被发现，除非你修补这些漏洞，否则你的系统处于风险之中。作为进一步的预防措施，你还可以禁用或卸载你不需要的服务。例如，如果你家里只有一台机器并且没有配置打印，你就不需要
    CUPS 或 Samba 服务。


    另一个要采用的技巧是选择加密。如今大多数 Linux 发行版允许你在安装过程中加密你的主文件夹。你也可以选择使用 4crypt 等应用来为当前安装配置加密。


    重要的是不要使用字典单词或诸如 qwerty 或 god111 等关键字作为你的密码。最安全的选项是确保定期重置密码，你可以编程你的系统以拒绝用户以前使用过的密码：


    在接下来的几页中，你将发现有用的提示，有时还有详细的说明，介绍如何将许多这些原则应用到你的 Linux 安装中，除此之外还有你可以用来挫败攻击者的其他高级工具和技巧。


    ![](img/fb76008333fb7aef815b136f9f1afe5f_18_0.png)


    ![](img/fb76008333fb7aef815b136f9f1afe5f_19_0.png)


    为了保护你的机器，你必须针对潜在攻击采取双管齐下的策略。第一部分涉及通过安装防火墙和采用更好的密码策略来防备入侵者。但仅此还不够。锁好家里所有的窗户是一回事，但你仍必须确保在你关上窗户之前没有人进来。


    ### 安全登录


    信任密码来保护你所有的数据是愚蠢的。为了防止未经授权访问你的机器，你可以增加一层身份验证。最简单的方法之一是使用 Google Authenticator
    服务，它颁发基于时间的身份验证令牌以补充现有的密码挑战。


    你可以为你的 Linux 机器上所有配置的用户配置此实用程序，每个用户都将在其配置的 Android 设备上收到 OTP。除非用户输入那个快速过期的令牌，否则他们无法登录。如果你已配置你的机器以允许远程登录，你还可以配置
    Google Authenticator 与 SSH 配合工作。


    为了使用 Google Authenticator 实现这种多因素身份验证，你需要 Google Authenticator PAM 模块。PAM 代表“可插拔身份验证模块”-
    一种将不同形式的身份验证插入 Linux 计算机的机制。


    ### 更强的密码


    libpam-pwquality 工具是你可以用来改进密码的另一个此类模块。在你最喜欢的文本编辑器中打开 `/etc/pam.d/common-password`
    文件，并识别读取为 `password [success=1 default=ignore] pam_unix.so obscure sha512` 的行。如果你希望用户选择具有最小长度的密码，请在该行末尾添加
    `minlen` 参数，例如，`password [success=1 default=ignore] pam_unix.so obscure sha512
    minlen=8`。


    如果你同样希望确保用户选择包含大小写字母和特殊字符混合的密码，请加入诸如 `[credit=-1 credit=-1 credit=-2]` 的参数，这将分别强制用户使用一个小写字母、一个大写字母和两个数字。你可以使用终端中的
    `sudo apt install libpam-pwquality` 命令安装它。


