    从一个大于零的种群数量（例如 0.1）开始，你会发现，当增长常数大于 1 但小于 3 时，种群数量会增加到一个最大值，随后在该点达到稳定。较高的增长率对应的最终数值更大。然而，当增长常数刚刚超过
    3 时，会出现截然不同的行为模式。此时不再有一个单一的最终种群数量，而是在不同世代之间在若干数值间振荡。这种现象被解释为“繁荣与萧条”（boom and bust）现象，即奇数代种群数量过大，环境无法支撑，导致高死亡率，而这种死亡率会反映在下一代的种群数量中。接下来，尝试
    3.5 的增长率，你会发现最终种群数量在四个不同的数值间振荡；而在更高的增长率下，你可能会发现最终种群数量在 8、16 或更多数值间振荡。不过，这种状态并不会永远持续。当增长率达到约
    3.7 时，最终种群数量会在不同的数值间剧烈波动，这看起来像是混沌，但“混沌”一词在此处有着完全不同的含义。对于增长常数的较小取值，如果你以不同的初始种群数量开始，最终种群数量都会收敛到相同的数值或数值组。但在混沌区域并非如此。如果你以初始种群数量
    0.101 代替 0.1 开始，虽然初期增长相同，但很快就会走上完全不同的路径——图 2 中的最后一张图展示了这一点。事实上，无论两个起始值多么接近，最终结果总会发散。初始种群数量
    0.1001 的增长曲线会在更长的时间内镜像初始种群数量 0.1 的增长曲线，但最终它也会发散。这就是“对初始条件的超敏感性”这一短语的含义，它限制了我们模拟某些自然现象（最典型的是天气）向未来延伸太长时间的能力。


    到目前为止，在讨论混沌理论时，我们看了一些方程并将它们可视化为简单的折线图，但还没有看到能与曼德博集合（Mandelbrot set）相媲美的事物。这一切即将改变，因为我们即将发现分岔图（bifurcation
    diagram）。以下是生成它的方法，同样，这是一个简单的编程练习。仅使用初始种群数量的一个值，计算增长率从 1 到 4 范围内对应的最终种群数值（尽管 1
    到例如 2.5 的区域并不是特别有趣）。我们将最终种群定义为种群稳定后的数值，实现这一目标的最佳方法是丢弃最初几代，也许是前 150 代。然后，将最终种群数值对增长率绘制成
