    # AWS for Linux


    # Getting started as a host


    AWS provides a number of ways to host web servers within its system, from high-end
    EC2 instances to the bargain-basement Lightsail product


    ![](img/fb76008333fb7aef815b136f9f1afe5f_57_0.png)


    # EC2 / Lightsail


    Originally announced in November for the main US region, but now available more
    widely (including in the London region), Lightsail is Amazon’s defence against
    providers such as Linode or DigitalOcean (see p63) who offer ultra-cheap hosting.
    Lightsail starts at $5 a month, with the first month free. Costs scale up as storage,
    memory, bandwidth allowance and CPU power increase, but tiers are typically in
    line with rivals. Creating a Lightsail instance is easy. The control panel is
    separated from the main AWS administrative interface and setup is as simple as
    choosing an instance size, selecting a region and availability zone, defining
    a SSH key pair and an optional launch script before finally choosing either a
    bare OS (Ubuntu or Amazon Linux) or a prepared stack such as WordPress, LAMP and
    Magento and so on. Press the ‘Create’ button and your instance will start. After
    which you can configure the firewall, take snapshots and view various metrics.
    A web-based SSH console is also provided. You can assign a static IP to your instance,
    which is floating – if you spin up a new instance, you can change where the IP
    points on the fly. Static IPs are free as long as they’re attached to an instance.


    # Understanding the EC2 process helps comprehend how Lightsail is working behind
    the scenes


    EC2 (Elastic Compute Cloud), EC2 servers are created using Amazon Machine Images,
    AMIs (pronounced ‘armies’), which can be created and managed manually or selected
    from the AWS Marketplace. When creating an instance in EC2, a huge number of different
    instance types are available, each with different numbers of vCPUs (virtual CPUs),
    memory, storage types, network speeds and optimisations. Of course, the higher
    the...


    > The Lightsail product is designed to be accessible and, as such, has a stripped
    down console – a good starting point with AWS!'
  - '[PAGE 58]


    # Microsoft Azure


    There are only a handful of players approaching AWS''s scale in the market – one
    of those is Microsoft, with its Azure platform. Microsoft Azure was announced
    in October 2008 and, like Amazon''s service, has grown hugely thanks in part to
    Linux. Azure offers over 600 services, including virtual machines, serverless
    applications, file storage, database services and messaging systems. Azure is
    available in 38 regions around the world, two of which are based in the UK.


    the spec you choose, the more you will pay. Some instance types have local storage
    (e.g, the i3.large instance is a powerful type with a 475GB SSD attached) while
    others use EBS (Elastic Block Storage). EBS provides persistent block storage
    for your instance, automatically replicated within your availability zone to protect
    against hardware failure. Magnetic, SSD and high-performance versions are available
    – again, of course, with varying costs. After selecting your machine type, you''ll
    be prompted to configure an IAM role (that is, who has access) and also which
    VPC you wish the machine to be in. A VPC is a virtual private cloud dedicated
    to your AWS account. One is created by default, but you can create multiple VPCs.
    After your EC2 instance is created, it will be assigned an IP for external access
    (subject to your security group config), or you can assign it an ''Elastic IP''
    which, as the name suggests, is an IP that can be assigned to any instance. Understanding
    the EC2 process helps to comprehend how Lightsail is working behind the scenes.
    Each size of Lightsail instance is equivalent to an EC2 instance, storage in Lightsail
    is a specific size of EBS volume, the static IP is an Elastic IP, and the preconfigured
    OS or application stacks are AMI images. The benefit of Lightsail is a fixed cost,
    a barrier to entry to AWS for many users. What if you have resources in both Lightsail
    and other AWS services – can they communicate? Yes: in your Lightsail configuration
    you''ll see an option for ''VPC peering'' which enables intercommunication between
    Lightsail (which has set up another ''hidden VPC'' behind the scenes) and your
    configured VPC.


    # Choose your database


    Once you''ve got a web server up and running, the next thing you''ll want to think
    about is a database. As is often the case with AWS, there are a lot of different
    offerings to ponder. If you''re looking for a traditional relational database
    on a managed service, you''ll want to use Amazon RDS (Relational Database Service)
    which offers many of the most popular relational database engines. If you''re
    building a data warehouse, Amazon Redshift might be what you need. Amazon DynamoDB
    provides a high-performance NoSQL database and


    # Database engines supported


    +   01 MySQL

    +   MySQL is one of the most widely used databases worldwide and forms a key component
    of the LAMP stack.


    +   02 Aurora

    +   Aurora is AWS''s high-performance, customised version of MySQL, and is fully
    compatible with no code changes required.


    +   03 MariaDB

    +   Like Aurora, MariaDB is an enhanced, drop-in replacement for MySQL. It is
    maintained by the original developers of MySQL.


    +   04 PostgreSQL

    +   Postgres is a complex, extensible, object-relational database management system,
    with excellent support for advanced data types and functions.


    +   05 Oracle

    +   The Oracle database, which is closed source, is a business heavyweight and
    its care is required for many companies migrating their data into RDS.


    +   06 Microsoft SQL Server

    +   Microsoft SQL Server is the platform of choice for many Windows-based developers
    – all versions are offered by AWS, from ''Web'' upwards.


    Amazon Elasticache provides in-memory caching via Memcached or Redis. You can
    host on your own EC2 instances too, but you won''t then enjoy the managed nature
    of the Amazon services. One final option is third-party companies that host databases
    within the AWS cloud, such as the IBM-backed compose.io. Amazon RDS is incredibly
    useful because it takes away most of the difficult or tedious management tasks
    of a relational database. First and foremost, RDS manages backups, patching, automatic
    failure detection and recovery. RDS can automatically provision high availability
    with multiple instances in multiple availability zones, providing peace of mind
    with minimal effort. If you roll your own server, you are forced to scale instance
    sizes to increase the server power, but RDS allows you to increase CPU, memory
    and storage independently. Best of all, RDS is very cost-competitive with setting
    things up yourself – so why wouldn''t you? The only thing RDS doesn''t provide
    is shell access to the server although you probably shouldn''t need it. You can
    use the tools you''re familiar with to manage the RDS database, as well as benefiting
    from being within AWS with CloudWatch monitoring, VPC-based security and multiple
    region availability.


    ![](img/fb76008333fb7aef815b136f9f1afe5f_58_0.png)


    ![](img/fb76008333fb7aef815b136f9f1afe5f_58_1.png)


    ![](img/fb76008333fb7aef815b136f9f1afe5f_58_2.png)


    ![](img/fb76008333fb7aef815b136f9f1afe5f_58_3.png)


    ![](img/fb76008333fb7aef815b136f9f1afe5f_58_4.png)


    # QUICK TIP


    Snapshot backups

    If you are running Lightsail instances, you can manually Snapshot as required
    for backup. AWS also supply an ''auto snapshot'' template, for simple daily snapshots
    and a custom retention period.'
  - "[PAGE 59]\n\n# AWS for Linux\n\n# File storage\n\nAmazon S3 (Simple Storage Service)\
    \ was an original AWS product offering, but now forms part of a suite of file\
    \ storage products\n\n+   ## QUICK TIP\n+   ### Command-line tools\n+   \n+  \
    \ As well as providing connectivity via APIs and management via the web console,\
    \ AWS provides powerful yet accessible command-line tools in the form of aws-cli\
    \ and aws-shell.\n\nWhen AWS first launched, the S3 storage service was the headline\
    \ offering. Before then, if you needed online storage you'd provision it in chunks\
    \ – maybe get a server with a few terabytes of storage and when you ran out of\
    \ space, get another one. S3 changed that by employing the now familiar model\
    \ of only charging for what you use – and being very competitive when doing so.\
    \ Amazon S3 is a simple object store. It is secure, 99.99999999% durable and scales\
    \ past tens of trillions of objects. S3 is ideal for backup and recovery, tiered\
    \ archive or user-driven content (like photos, videos, music and files). Objects\
    \ are uploaded and retrieved using the AWS APIs, or exposed directly to the internet\
    \ via Amazon's CDN (content delivery network) service, CloudFront. S3 objects\
    \ can be automatically distributed between availability zones and regions, and\
    \ versioning can be employed to add extra resilience to the platform. Although\
    \ S3 pricing is extremely competitive, you may find yourself uploading objects\
    \ that you don't need to access very often – for example, if you are using the\
    \ service for backup. In order to save costs in this kind of\n\nscenario, Amazon\
    \ offers an \"infrequent access\" tier of S3. This costs approximately half the\
    \ price of regular S3 for the storage itself, but each request to the object will\
    \ be considerably more expensive. For objects that are required even less frequently,\
    \ Amazon offers a special version of S3 called 'Glacier'. Although it is very\
    \ cheap, retrieving data from Glacier is much slower. Data retrieval is divided\
    \ into three tiers, which can take from a few minutes to several hours. Alongside\
    \ EBS for attached instance storage and S3 for resilient object storage, Amazon\
    \ offers Amazon EFS (Elastic File System) which provides simple, scalable file\
    \ storage for use with Amazon EC2 instances in the AWS Cloud (or, via VPC peering,\
    \ Lightsail instances). EFS delivers a file system that grows and shrinks capacity\
    \ automatically, and provides high throughput with consistently low latencies.\
    \ EFS is designed for high availability and durability, and provides performance\
    \ for a broad spectrum of workloads and applications, including big data and analytics,\
    \ media processing workflows, content management, web\n\n# ## HOW TO\n### AWS\
    \ Elastic Beanstalk\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_59_0.png)\n\n\
    +   ### 01\n+   #### Deploy Beanstalk\n+   With Elastic Beanstalk, you can deploy,\
    \ monitor and scale an application quickly and easily. To deploy an existing web\
    \ app, you will need to create an application source bundle and create a new Beanstalk\
    \ application. If you want to create a Beanstalk deployment using an existing\
    \ Git repository, then you can do so using the CLI tools. A number of sample applications\
    \ are also included so you can try out the process.\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_59_1.png)\n\
    \n+   ### 02\n+   #### Source bundle\n+   An application source bundle consists\
    \ of a single ZIP or WAR file, less than 512MB, containing your application's\
    \ source code. This will be automatically deployed by Elastic Beanstalk. Your\
    \ source should be in the root directory and you can also include an `extensions`\
    \ directory containing one or more Elastic Beanstalk `.config` YAML configuration\
    \ files, for configuring environment options.\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_59_2.png)\n\
    \n+   ### 03\n+   #### Name and platform\n+   In the first step of the Elastic\
    \ Beanstalk process, you're prompted to provide an app name of up to 100 characters.\
    \ Next, you select the platform your code runs on – sample platforms include Python,\
    \ Ruby, Tomcat, Go, Java, Node, PHP, Packer and .NET as well as several Docker\
    \ options and generic Docker containers. After selecting a sample app or uploading\
    \ your code, you can create your app here or configure options."
  md: "\n# AWS for Linux\n\n## Getting started as a host\n\nAWS provides a number\
    \ of ways to host web servers within its system, from high-end EC2 instances to\
    \ the bargain-basement Lightsail product.\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_57_0.png)\n\
    \n## EC2 / Lightsail\n\nOriginally announced in November for the main US region,\
    \ but now available more widely (including in the London region), Lightsail is\
    \ Amazon’s defence against providers such as Linode or DigitalOcean (see p. 63)\
    \ who offer ultra-cheap hosting. Lightsail starts at $5 a month, with the first\
    \ month free. Costs scale up as storage, memory, bandwidth allowance, and CPU\
    \ power increase, but tiers are typically in line with rivals.\n\nCreating a Lightsail\
    \ instance is easy. The control panel is separated from the main AWS administrative\
    \ interface, and setup is as simple as choosing an instance size, selecting a\
    \ region and availability zone, defining a SSH key pair and an optional launch\
    \ script, before finally choosing either a bare OS (Ubuntu or Amazon Linux) or\
    \ a prepared stack such as WordPress, LAMP, and Magento, and so on. Press the\
    \ ‘Create’ button and your instance will start. After which you can configure\
    \ the firewall, take snapshots, and view various metrics. A web-based SSH console\
    \ is also provided. You can assign a static IP to your instance, which is floating\
    \ – if you spin up a new instance, you can change where the IP points on the fly.\
    \ Static IPs are free as long as they’re attached to an instance.\n\n### Understanding\
    \ the EC2 process helps comprehend how Lightsail is working behind the scenes\n\
    \nEC2 (Elastic Compute Cloud): EC2 servers are created using Amazon Machine Images\
    \ (AMIs), which can be created and managed manually or selected from the AWS Marketplace.\
    \ When creating an instance in EC2, a huge number of different instance types\
    \ are available, each with different numbers of vCPUs (virtual CPUs), memory,\
    \ storage types, network speeds, and optimizations. Of course, the higher the\
    \ spec you choose, the more you will pay. Some instance types have local storage\
    \ (e.g., the i3.large instance is a powerful type with a 475GB SSD attached),\
    \ while others use EBS (Elastic Block Storage). EBS provides persistent block\
    \ storage for your instance, automatically replicated within your availability\
    \ zone to protect against hardware failure. Magnetic, SSD, and high-performance\
    \ versions are available – again, of course, with varying costs. After selecting\
    \ your machine type, you'll be prompted to configure an IAM role (that is, who\
    \ has access) and also which VPC you wish the machine to be in. A VPC is a virtual\
    \ private cloud dedicated to your AWS account. One is created by default, but\
    \ you can create multiple VPCs. After your EC2 instance is created, it will be\
    \ assigned an IP for external access (subject to your security group config),\
    \ or you can assign it an 'Elastic IP' which, as the name suggests, is an IP that\
    \ can be assigned to any instance. Understanding the EC2 process helps to comprehend\
    \ how Lightsail is working behind the scenes. Each size of Lightsail instance\
    \ is equivalent to an EC2 instance, storage in Lightsail is a specific size of\
    \ EBS volume, the static IP is an Elastic IP, and the preconfigured OS or application\
    \ stacks are AMI images. The benefit of Lightsail is a fixed cost, a barrier to\
    \ entry to AWS for many users. What if you have resources in both Lightsail and\
    \ other AWS services – can they communicate? Yes: in your Lightsail configuration\
    \ you'll see an option for 'VPC peering' which enables intercommunication between\
    \ Lightsail (which has set up another 'hidden VPC' behind the scenes) and your\
    \ configured VPC.\n\n> The Lightsail product is designed to be accessible and,\
    \ as such, has a stripped-down console – a good starting point with AWS!\n\n##\
    \ Microsoft Azure\n\nThere are only a handful of players approaching AWS's scale\
    \ in the market – one of those is Microsoft, with its Azure platform. Microsoft\
    \ Azure was announced in October 2008 and, like Amazon's service, has grown hugely\
    \ thanks in part to Linux. Azure offers over 600 services, including virtual machines,\
    \ serverless applications, file storage, database services, and messaging systems.\
    \ Azure is available in 38 regions around the world, two of which are based in\
    \ the UK.\n\n## Choose your database\n\nOnce you've got a web server up and running,\
    \ the next thing you'll want to think about is a database. As is often the case\
    \ with AWS, there are a lot of different offerings to ponder. If you're looking\
    \ for a traditional relational database on a managed service, you'll want to use\
    \ Amazon RDS (Relational Database Service) which offers many of the most popular\
    \ relational database engines. If you're building a data warehouse, Amazon Redshift\
    \ might be what you need. Amazon DynamoDB provides a high-performance NoSQL database,\
    \ and Amazon Elasticache provides in-memory caching via Memcached or Redis. You\
    \ can host on your own EC2 instances too, but you won't then enjoy the managed\
    \ nature of the Amazon services. One final option is third-party companies that\
    \ host databases within the AWS cloud, such as the IBM-backed compose.io. Amazon\
    \ RDS is incredibly useful because it takes away most of the difficult or tedious\
    \ management tasks of a relational database. First and foremost, RDS manages backups,\
    \ patching, automatic failure detection, and recovery. RDS can automatically provision\
    \ high availability with multiple instances in multiple availability zones, providing\
    \ peace of mind with minimal effort. If you roll your own server, you are forced\
    \ to scale instance sizes to increase the server power, but RDS allows you to\
    \ increase CPU, memory, and storage independently. Best of all, RDS is very cost-competitive\
    \ with setting things up yourself – so why wouldn't you? The only thing RDS doesn't\
    \ provide is shell access to the server, although you probably shouldn't need\
    \ it. You can use the tools you're familiar with to manage the RDS database, as\
    \ well as benefiting from being within AWS with CloudWatch monitoring, VPC-based\
    \ security, and multiple region availability.\n\n### Database engines supported\n\
    \n- **01 MySQL**\n  - MySQL is one of the most widely used databases worldwide\
    \ and forms a key component of the LAMP stack.\n- **02 Aurora**\n  - Aurora is\
    \ AWS's high-performance, customized version of MySQL, and is fully compatible\
    \ with no code changes required.\n- **03 MariaDB**\n  - Like Aurora, MariaDB is\
    \ an enhanced, drop-in replacement for MySQL. It is maintained by the original\
    \ developers of MySQL.\n- **04 PostgreSQL**\n  - Postgres is a complex, extensible,\
    \ object-relational database management system, with excellent support for advanced\
    \ data types and functions.\n- **05 Oracle**\n  - The Oracle database, which is\
    \ closed source, is a business heavyweight, and its care is required for many\
    \ companies migrating their data into RDS.\n- **06 Microsoft SQL Server**\n  -\
    \ Microsoft SQL Server is the platform of choice for many Windows-based developers\
    \ – all versions are offered by AWS, from 'Web' upwards.\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_58_0.png)\n\
    ![](img/fb76008333fb7aef815b136f9f1afe5f_58_1.png)\n![](img/fb76008333fb7aef815b136f9f1afe5f_58_2.png)\n\
    ![](img/fb76008333fb7aef815b136f9f1afe5f_58_3.png)\n![](img/fb76008333fb7aef815b136f9f1afe5f_58_4.png)\n\
    \n## Quick Tip\n\n**Snapshot backups**\nIf you are running Lightsail instances,\
    \ you can manually Snapshot as required for backup. AWS also supply an 'auto snapshot'\
    \ template, for simple daily snapshots and a custom retention period.\n\n# AWS\
    \ for Linux\n\n## File storage\n\nAmazon S3 (Simple Storage Service) was an original\
    \ AWS product offering, but now forms part of a suite of file storage products.\n\
    \n### Quick Tip: Command-line tools\n\nAs well as providing connectivity via APIs\
    \ and management via the web console, AWS provides powerful yet accessible command-line\
    \ tools in the form of aws-cli and aws-shell.\n\nWhen AWS first launched, the\
    \ S3 storage service was the headline offering. Before then, if you needed online\
    \ storage you'd provision it in chunks – maybe get a server with a few terabytes\
    \ of storage and when you ran out of space, get another one. S3 changed that by\
    \ employing the now familiar model of only charging for what you use – and being\
    \ very competitive when doing so. Amazon S3 is a simple object store. It is secure,\
    \ 99.99999999% durable, and scales past tens of trillions of objects. S3 is ideal\
    \ for backup and recovery, tiered archive, or user-driven content (like photos,\
    \ videos, music, and files). Objects are uploaded and retrieved using the AWS\
    \ APIs, or exposed directly to the internet via Amazon's CDN (content delivery\
    \ network) service, CloudFront. S3 objects can be automatically distributed between\
    \ availability zones and regions, and versioning can be employed to add extra\
    \ resilience to the platform. Although S3 pricing is extremely competitive, you\
    \ may find yourself uploading objects that you don't need to access very often\
    \ – for example, if you are using the service for backup. In order to save costs\
    \ in this kind of scenario, Amazon offers an \"infrequent access\" tier of S3.\
    \ This costs approximately half the price of regular S3 for the storage itself,\
    \ but each request to the object will be considerably more expensive. For objects\
    \ that are required even less frequently, Amazon offers a special version of S3\
    \ called 'Glacier'. Although it is very cheap, retrieving data from Glacier is\
    \ much slower. Data retrieval is divided into three tiers, which can take from\
    \ a few minutes to several hours.\n\nAlongside EBS for attached instance storage\
    \ and S3 for resilient object storage, Amazon offers Amazon EFS (Elastic File\
    \ System) which provides simple, scalable file storage for use with Amazon EC2\
    \ instances in the AWS Cloud (or, via VPC peering, Lightsail instances). EFS delivers\
    \ a file system that grows and shrinks capacity automatically, and provides high\
    \ throughput with consistently low latencies. EFS is designed for high availability\
    \ and durability, and provides performance for a broad spectrum of workloads and\
    \ applications, including big data and analytics, media processing workflows,\
    \ content management, web development, and more.\n\n## How To: AWS Elastic Beanstalk\n\
    \n![](img/fb76008333fb7aef815b136f9f1afe5f_59_0.png)\n\n- **01 Deploy Beanstalk**\n\
    \  - With Elastic Beanstalk, you can deploy, monitor, and scale an application\
    \ quickly and easily. To deploy an existing web app, you will need to create an\
    \ application source bundle and create a new Beanstalk application. If you want\
    \ to create a Beanstalk deployment using an existing Git repository, then you\
    \ can do so using the CLI tools. A number of sample applications are also included\
    \ so you can try out the process.\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_59_1.png)\n\
    \n- **02 Source bundle**\n  - An application source bundle consists of a single\
    \ ZIP or WAR file, less than 512MB, containing your application's source code.\
    \ This will be automatically deployed by Elastic Beanstalk. Your source should\
    \ be in the root directory, and you can also include an `extensions` directory\
    \ containing one or more Elastic Beanstalk `.config` YAML configuration files,\
    \ for configuring environment options.\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_59_2.png)\n\
    \n- **03 Name and platform**\n  - In the first step of the Elastic Beanstalk process,\
    \ you're prompted to provide an app name of up to 100 characters. Next, you select\
    \ the platform your code runs on – sample platforms include Python, Ruby, Tomcat,\
    \ Go, Java, Node, PHP, Packer, and .NET as well as several Docker options and\
    \ generic Docker containers. After selecting a sample app or uploading your code,\
    \ you can create your app here or configure options.\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_59_3.png)\n"
  mdcn: "\n# Linux 上的 AWS\n\n## 作为托管方的入门指南\n\nAWS 提供了多种方式在其系统内托管 Web 服务器，从高端的 EC2\
    \ 实例到价格低廉的 Lightsail 产品。\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_57_0.png)\n\
    \n## EC2 / Lightsail\n\nLightsail 最初于 11 月在美东主区域发布，但现在已更广泛可用（包括伦敦区域）。Lightsail\
    \ 是亚马逊针对 Linode 或 DigitalOcean 等提供超廉价托管服务（参见第 63 页）提供商的防御措施。Lightsail 的起步价格为每月\
    \ 5 美元，首月免费。随着存储、内存、带宽配额和 CPU 功率的增加，成本会随之上升，但其等级通常与竞争对手持平。\n\n创建 Lightsail 实例非常简单。控制面板与主\
    \ AWS 管理界面分离，设置过程很简单：只需选择实例大小，选择区域和可用区，定义 SSH 密钥对和可选的启动脚本，最后选择裸操作系统（Ubuntu 或 Amazon\
    \ Linux）或预配置的软件栈，例如 WordPress、LAMP 和 Magento 等。点击“创建”按钮后，你的实例就会启动。之后，你可以配置防火墙、创建快照并查看各种指标。还提供了基于\
    \ Web 的 SSH 控制台。你可以为实例分配静态 IP，这是浮动的——如果你启动新实例，可以随时更改该 IP 指向的位置。只要静态 IP 附着在实例上，它们就是免费的。\n\
    \n### 理解 EC2 流程有助于理解 Lightsail 在后台的工作机制\n\nEC2（Elastic Compute Cloud）：EC2 服务器使用\
    \ Amazon 机器映像（AMIs）创建，这些映像可以手动创建和管理，也可以从 AWS 市场选择。在 EC2 中创建实例时，有众多不同的实例类型可供选择，每种类型都有不同的\
    \ vCPU（虚拟 CPU）数量、内存、存储类型、网络速度和优化选项。当然，选择的规格越高，支付的费用就越多。某些实例类型具有本地存储（例如，i3.large\
    \ 是一种强大的类型，附带 475GB SSD），而其他类型则使用 EBS（Elastic Block Storage）。EBS 为你的实例提供持久的块存储，并在你的可用区内自动复制以保护硬件故障。提供磁磁盘、SSD\
    \ 和高性能版本——当然，价格各不相同。选择机器类型后，你将配置 IAM 角色（即谁有权访问）以及机器所在的 VPC。VPC 是专用于你的 AWS 账户的虚拟私有云。默认情况下会创建一个，但你也可以创建多个\
    \ VPC。EC2 实例创建后，会分配一个用于外部访问的 IP（取决于你的安全组配置），或者你可以为其分配一个“弹性 IP”，顾名思义，这是一种可以分配给任何实例的\
    \ IP。理解 EC2 流程有助于理解 Lightsail 在后台的工作机制。每种大小的 Lightsail 实例都相当于一个 EC2 实例，Lightsail\
    \ 中的存储是特定大小的 EBS 卷，静态 IP 是弹性 IP，预配置的操作系统或应用程序栈是 AMI 映像。Lightsail 的好处是固定成本，它是许多用户进入\
    \ AWS 的门槛。如果你同时在 Lightsail 和其他 AWS 服务中有资源，它们之间可以通信吗？可以：在 Lightsail 配置中，你会看到一个“VPC\
    \ 对等连接”选项，它启用 Lightsail（在后台设置了另一个“隐藏 VPC”）与你配置的 VPC 之间的相互通信。\n\n> Lightsail 产品旨在易于访问，因此拥有简化版的控制台——是\
    \ AWS 的良好起点！\n\n## Microsoft Azure\n\n市场上只有少数几家厂商接近 AWS 的规模——其中之一就是拥有 Azure 平台的微软。Microsoft\
    \ Azure 于 2008 年 10 月发布，与亚马逊的服务一样，部分得益于 Linux，其规模也大幅增长。Azure 提供超过 600 种服务，包括虚拟机、无服务器应用程序、文件存储、数据库服务和消息系统。Azure\
    \ 在全球 38 个区域可用，其中两个位于英国。\n\n## 选择你的数据库\n\n一旦 Web 服务器启动并运行，接下来你要考虑的就是数据库。就像 AWS\
    \ 上常见的情况一样，有很多不同的选择需要考虑。如果你在寻找基于托管服务的传统关系型数据库，你需要使用 Amazon RDS（Relational Database\
    \ Service），它提供了许多最流行的关系型数据库引擎。如果你正在构建数据仓库，Amazon Redshift 可能正是你需要的。Amazon DynamoDB\
    \ 提供高性能的 NoSQL 数据库，Amazon Elasticache 通过 Memcached 或 Redis 提供内存缓存。你也可以在自己的 EC2\
    \ 实例上托管，但那样你就无法享受亚马逊服务的托管性质。最后一个选项是在 AWS 云内托管数据库的第三方公司，例如由 IBM 支持的 compose.io。Amazon\
    \ RDS 极其有用，因为它消除了关系型数据库大多数困难或繁琐的管理任务。首先，RDS 管理备份、补丁、自动故障检测和恢复。RDS 可以自动通过多个可用区中的多个实例来提供高可用性，从而以最小的努力带来安心。如果你自己搭建服务器，被迫通过扩展实例大小来增加服务器功率，但\
    \ RDS 允许你独立增加 CPU、内存和存储。最重要的是，与自建相比，RDS 在成本上非常有竞争力——那你为什么不使用它呢？RDS 唯一没有提供的是服务器的\
    \ shell 访问权限，尽管你很可能不需要它。你可以使用熟悉的工具来管理 RDS 数据库，同时享受在 AWS 内的优势，如 CloudWatch 监控、基于\
    \ VPC 的安全性和多区域可用性。\n\n### 支持的数据库引擎\n\n- **01 MySQL**\n  - MySQL 是全世界使用最广泛的数据库之一，也是\
    \ LAMP 软件栈的关键组件。\n- **02 Aurora**\n  - Aurora 是 AWS 高性能定制版 MySQL，完全兼容，无需代码更改。\n\
    - **03 MariaDB**\n  - 与 Aurora 类似，MariaDB 是 MySQL 的增强型直接替代方案。由 MySQL 的原始开发者维护。\n\
    - **04 PostgreSQL**\n  - Postgres 是一个复杂的、可扩展的对象关系数据库管理系统，对高级数据类型和函数提供了 excellent\
    \ 支持。\n- **05 Oracle**\n  - Oracle 数据库是闭源的商业重量级选手，许多将数据迁移到 RDS 的公司需要仔细对待。\n- **06\
    \ Microsoft SQL Server**\n  - Microsoft SQL Server 是许多基于 Windows 的开发者的首选平台——AWS\
    \ 提供从“Web”版开始的所有版本。\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_58_0.png)\n![](img/fb76008333fb7aef815b136f9f1afe5f_58_1.png)\n\
    ![](img/fb76008333fb7aef815b136f9f1afe5f_58_2.png)\n![](img/fb76008333fb7aef815b136f9f1afe5f_58_3.png)\n\
    ![](img/fb76008333fb7aef815b136f9f1afe5f_58_4.png)\n\n## 快速提示\n\n**快照备份**\n如果你正在运行\
    \ Lightsail 实例，可以手动创建快照以备备份。AWS 还提供“自动快照”模板，用于简单的每日快照和自定义保留期。\n\n# Linux 上的 AWS\n\
    \n## 文件存储\n\nAmazon S3（Simple Storage Service）原本是 AWS 的产品提供之一，但现在已成为一套文件存储产品的一部分。\n\
    \n### 快速提示：命令行工具\n\n除了通过 API 提供连接和通过 Web 控制台进行管理外，AWS 还以 aws-cli 和 aws-shell 的形式提供强大且易用的命令行工具。\n\
    \n在 AWS 最初推出时，S3 存储服务是主打的亮点。在此之前，如果你需要在线存储，你会分块供应——也许获得一台具有几 TB 存储的服务器，当空间用完时，再获得另一台。S3\
    \ 通过采用现在熟悉的模式改变了这一点——只为你使用的部分收费——并且在此方面具有极强的竞争力。Amazon S3 是一个简单的对象存储。它是安全的，耐用性为\
    \ 99.99999999%，并能扩展到数万亿个对象。S3 非常适合备份和恢复、分层归档或用户驱动的内容（如照片、视频、音乐和文件）。对象通过 AWS API\
    \ 上传和检索，或通过亚马逊的内容分发网络（CDN）服务 CloudFront 直接暴露给互联网。S3 对象可以在可用区和区域之间自动分布，并且可以使用版本控制来增加平台的额外弹性。虽然\
    \ S3 的价格极具竞争力，但你可能会发现上传了那些不需要经常访问的对象——例如，如果你使用该服务进行备份。为了在这种场景下节省成本，亚马逊提供了 S3 的“低频访问”层。这对于存储本身的价格大约是常规\
    \ S3 的一半，但对每个对象请求的费用会贵得多。对于更不常需要的对象，亚马逊提供了一种称为“Glacier”的 S3 特殊版本。虽然它非常便宜，但从 Glacier\
    \ 检索数据的速度慢得多。数据检索分为三个层，可能需要几分钟到几小时不等。\n\n除了用于附加实例存储的 EBS 和用于弹性对象存储的 S3 外，亚马逊还提供\
    \ Amazon EFS（Elastic File System），它为 AWS Cloud 中的 Amazon EC2 实例（或通过 VPC 对等连接的\
    \ Lightsail 实例）提供简单、可扩展的文件存储。EFS 提供自动增长和缩小容量的文件系统，并以始终较低的延迟提供高吞吐量。EFS 专为高可用性和耐用性而设计，为包括大数据和分析、媒体处理工作流、内容管理、Web\
    \ 开发等在内的广泛工作负载和应用提供性能。\n\n## 如何操作：AWS Elastic Beanstalk\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_59_0.png)\n\
    \n- **01 部署 Beanstalk**\n  - 使用 Elastic Beanstalk，你可以快速轻松地部署、监控和扩展应用程序。要部署现有的\
    \ Web 应用程序，你需要创建应用程序源束并创建新的 Beanstalk 应用程序。如果你想使用现有的 Git 仓库创建 Beanstalk 部署，可以使用\
    \ CLI 工具。还包括一些示例应用程序，以便你可以试用该流程。\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_59_1.png)\n\
    \n- **02 源束**\n  - 应用程序源束由单个小于 512MB 的 ZIP 或 WAR 文件组成，包含你的应用程序源代码。这将由 Elastic\
    \ Beanstalk 自动部署。你的源代码应位于根目录中，你还可以包括一个 `extensions` 目录，其中包含一个或多个用于配置环境选项的 Elastic\
    \ Beanstalk `.config` YAML 配置文件。\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_59_2.png)\n\
