    ## 硬件


    ## MintBox 机器


    Compulab 与 Linux Mint 团队之间的紧密合作推出了一系列微型 PC，它们预装了 Mint 即可使用。基于 Compulab 的 fitel
    迷你 PC，有三种不同的 Mintbox 变体可供选择——高端的由 Intel i5 驱动的 MintBox 2，中端的由 AMD A10 驱动的 MintBox
    Mini Pro 以及低端的基于 AMD A4 的 MintBox Mini。尽管售价相对较高，但由于其口袋大小的尺寸、完全无风扇运行、良好的性能以及——当然——与
    Linux Mint 出色的硬件兼容性，这些机器广受好评。


    ### 2015年4月10日


    LMDE 2 Betsy 是基于 Debian 的 Mint 系统的当前版本，基于 Debian Jessie，再次采用滚动发布计划。LMDE2 提供 MATE
    或 Cinnamon 版本。


    ### 2016年6月30日


    在 18 “Sarah” 版本发布之前，曾提供 OEM 版本和无编解码器版本。OEM 版本因维护顾虑而被取消；编解码器选择现已集成到主要镜像中。


    ### 2017年7月2日


    Linux Mint 的最新版本 18.2 “Sonya” 继续基于 Ubuntu 16.04，并提供增量更新和顺畅的升级路径。所有 18.x 版本均为 LTS
    版本。


    ![](img/fb76008333fb7aef815b136f9f1afe5f_31_0.png)


    > *上方* 除了 Cinnamon 之外，该发行版还推出了基于 MATE、Xfce 和 KDE 桌面环境近期发布的版本


    ## 发行版


    ## Linux Mint 18.2 Beta


    与对其前身的大动荡形成鲜明对比的是，Linux Mint 平静地提供了又一个出色的发行版


    - **内存** 16GB

    - **存储** 20GB

    - **规格** 1GHz 处理器和 HD 显卡

    - 可从 www.linuxmint.com/download.php 获取


    Linux Mint 无论是作为项目还是产品，随着每次发布都在不断成熟。事实上，最近几次发布如此稳固，以至于该项目似乎发布 beta 版本仅仅是为了遵循软件发布生命周期政策的例行公事。本次发布也不例外，它像之前的版本一样，基于经过彻底测试的
    Ubuntu 16.04 LTS 发行版，符合 Mint 坚持使用 LTS Ubuntu 基础的新政策。Mint 已用 LightDM 取代其 MDM 显示管理器，LightDM
    具有前瞻性，因为它支持包括 Wayland 和 Mir 在内的不同显示服务器。LightDM 驱动 Mint 的新问候程序 Slickit，该程序支持 HiDPI
    分辨率。此外，默认情况下，Mint 启用了允许访客用户登录而无需输入密码的功能 - 如果你对此感到不安，可以更改设置。蓝牙支持也进行了全面更新，配置应用程序
    Blueberry 拥有刷新后的界面。它现在开箱即支持 OBEX，因此与连接设备的文件传输就像在其他地方一样正常工作。你还可以使用 Blueberry


    ![](img/fb76008333fb7aef815b136f9f1afe5f_32_0.png)

    ![](img/fb76008333fb7aef815b136f9f1afe5f_32_1.png)


    上方 你可以使用 OEM 安装选项来配置新计算机，然后用户可以在首次启动时进行自定义


    以更改计算机名称，这之前需要进入终端进行操作。


    最有趣的变化在于更新管理器。Mint 重新制定了其更新过滤策略，使更新过程更安全、更简单，特别是对于被其他发行版的大量更新困扰的 Linux 初学者。Mint
    根据更新对系统的影响对它们进行分类。大多数被标记为 1 级或 2 级，这些不会破坏系统。影响多个应用程序的更新为 3 级，而内核和其他核心组件的更新为 4
    级。该应用程序有一个详细的文档部分，解释了这一关键领域。在用户级别光谱的另一端，新的 mintupdate-tool 将帮助经验丰富的用户通过 cron 任务和脚本安排更新。


    Mint 18.2 使用 Cinnamon 3.4，提供了几个有用的新功能。长期用户会欣赏对齐、排序和更改桌面图标大小的功能。在幕后，开发人员将设置守护程序的不同插件分离到它们自己的进程中。这不仅使它们更容易跟踪，而且有助于桌面的整体稳定性，因为行为异常的插件不再会导致整个桌面崩溃。


    你可以通过添加一系列小部件、桌面和主题来定制你的 Mint 安装。这些附加组件统称为“spices”，可在 Cinnamon Spices 网站 (https://cinnamon-spices.inxi.com.int)
    上获取，该网站已从头重新设计。你可以使用新集成的社交工具在网站上探索和过滤 spices，然后手动下载它们或使用系统设置中的相关配置工具自动安装。


    反映 Mint 成年的另一个方面是其核心实用程序集合，名为 X-Apps。这些本质上是流行 GNOME 应用程序的分支，现在以桌面无关的方式维护，以确保无论桌面环境如何都能获得一致的体验。从文本编辑器（Xed）和图像查看器（Xviewer）到
    PDF 阅读器（Xreader）和媒体播放器（Xplayer），都有相应的 X-App。它们随 Mint 18 首秀，并且在这里都经过了进一步的调整和更新。


    Linux Mint 18.2 将在 2021 年前接收安全更新。2018 年前推出的新 Mint 版本将使用与 Linux Mint 18 相同的软件包基础，这使得升级到点版本变得安全且简单。


    Mayank Sharma


    ## 优点


    一个精炼的桌面发行版，既稳定又直观，可以相对轻松地进行自定义。


    ## 缺点


    它基于 Ubuntu LTS 发行版，这意味着它随附的是较旧的 4.8.0-5.3 内核。


    ## 总结


    如果你一直在等待事情稳定下来再加入 Mint 18 的行列，那么不用再等了。18.2 中的变化，即更新管理器策略和将桌面插件分离到各自进程中，进一步巩固了其稳定性的声誉。


