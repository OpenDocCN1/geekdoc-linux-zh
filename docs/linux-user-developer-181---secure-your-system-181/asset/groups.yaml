    \ 上找到有关 Erlang 构建系统的更多信息。\n\n但首先，你需要创建一个目录来保存项目的所有文件——在这种情况下，项目名称为 `hw`，所以目录名称也将是\
    \ `hw`，你可以通过执行 `mkdir hw` 命令来创建它。然后，你需要执行 `cd hw` 以实际进入该目录。\n\n现在请按照以下步骤创建一个将使用\
    \ Cowboy 的新 Erlang 项目：\n\n```bash\n$ wget https://raw.githubusercontent.com/ninenines/erlang/master/erlang.mk\n\
    $ make -f erlang.mk bootstrap-rel\n$ make\n```\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_51_0.png)\n\
    \n**上方** 展示了 `hw` 项目初始化过程的一部分，说明了如何使用 Cowboy 在 Erlang 中开发 Web 应用程序\n\n图 2 显示了你执行上述命令后屏幕上得到的部分结果。到目前为止，你已经创建了一个新的\
    \ Erlang 项目的骨架和一个倾倒的 shell 脚本，你可以运行 `.rel/hw/_rel/release/console` 来确保一切正常。\n\n\
    现在是时候通过修改 Makefile 来实际安装 Cowboy 了。Makefile 的最终版本如下：\n\n```makefile\nPROJECT =\
    \ hw\nPROJECT_DESCRIPTION = A Hello World program\nPROJECT_VERSION = 0.1.0\n\n\
    DEPS = cowboy\ninclude erlang.mk\n```\n\n所有的工作都由 `DEPS = cowboy` 这一行完成，这将指示构建系统下载并安装\
    \ Cowboy。然后你需要在 `src` 目录中创建一个名为 `hw.app.src` 的新文件（如果它尚不存在——你可以通过查看随本教程提供的源代码来看见\
    \ `hw.app.src`）。现在，如果你执行 make 实用程序，构建系统将负责其余的工作！如果输出的最后一行是 `release-1.tar.gz successfully\
