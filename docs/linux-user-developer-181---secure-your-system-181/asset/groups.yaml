    So far we’ve looked at fractal geometry and we’ve looked at chaos theory. It’s
    a valid question, though, to ask why we’ve chosen to bundle these two apparently
    separate branches of maths together. We’re not going to get embroiled in a formal
    mathematical treatment of this question but we will, nevertheless, highlight a
    number of amazing facts that show that there’s more in common between fractals
    and chaos than is apparent at first sight.


