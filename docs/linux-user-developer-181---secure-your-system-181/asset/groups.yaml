    - **NoScript**: Disables all scripts such as Flash, Java, JavaScript and other
    executable content on a web page. It enables you to create a whitelist of trusted
    websites, like your bank, but takes getting used to.

    - **WOT**: Web of Trust maintains a list of trusted websites. For each website
    you visit, a green icon indicates a trustworthy site, yellow tells you to be cautious
    and red indicates potential danger.

    - **BetterPrivacy**: SOS are ''super-cookies'' that can contain more detailed
    information, including your browsing preferences. With BetterPrivacy you can choose
    to delete LSOS at fixed time intervals.

