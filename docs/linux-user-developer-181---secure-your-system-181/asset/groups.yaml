    # 5 Tips from the pros


    01 **Optimise your website images**

    When uploading your website to the internet, make sure all of your images are
    optimised for web use! Try using jpegmini.com software; or if using WordPress,
    install the EWWW Image Optimizer plugin.


    02 **Host your website in the UK**

    Make sure your website is hosted in the UK, not just for legal reasons! If your
    server is located overseas, you may be missing out on search engine rankings on
    google.co.uk – you can check where your site is based on www.check-host.net.


    03 **Do you make regular backups?**

    How would it affect your business if you lost your website today? It is essential
    to always make your own backups; even if your host offers you a backup solution,
    it''s important to take responsibility for your own data and protect it.


    04 **Trying to rank on Google?**

    Google made some changes in 2015. If you''re struggling to rank on Google, make
    sure that your website is mobile-responsive! Plus, Google now prefers secure (HTTPS)
    websites! Contact your host to set up and force HTTPS on your website.


    05 **Avoid cheap hosting**

    We''re sure you''ve seen those TV adverts for domain and hosting for £1! Think
    about the logic... for £1, how many clients will be jam-packed onto that server?
    Surely they would use cheap £20 drives rather than £1k+ enterprise SSDs! Try to
    remember that you do get what you pay for!


