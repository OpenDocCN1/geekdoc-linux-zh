  mdcn: "\n# 教程\n\n## Linux 基础\n\n- **一切皆文件**\n  类 UNIX 系统背后的哲学之一就是*一切皆文件*。甚至你在命令提示符中输入的文本也被当作文件处理。像\
    \ `grep` 和 `wc` 这样的命令不会终止，直到它们读完输入文件的末尾。如果你正在终端中输入，请使用 `Ctrl+D` 来标记输入的结束。\n\n\
    \  当我们使用一种称为“管道”的设备将两个或多个命令组合在一起时，命令行的强大功能便显现出来。例如，统计当前工作目录中文件数量的一种方法是运行以下命令：\n\
    \n  ```bash\n  $ ls | wc -l\n  ```\n\n  拆解并研究这个命令很有价值，可以看到每个部分的作用。`ls` 是我们已经见过的命令：它打印出工作目录中所有文件的列表。`wc`\
    \ 是 'word count'（单词计数）的缩写：`wc` 是一个完全独立的程序，它接收文本作为输入，并返回单词数、行数和字符数。如果我们使用命令行开关\
    \ `-l`，则 `wc` 仅返回输入的行数。\n\n  将这两个命令连接起来的是“管道”字符 `|`。管道意味着“获取前一个命令的输出并将其作为下一个命令的输入传递”。在这种情况下，`ls`\
    \ 的输出是按行列出的工作目录中的文件列表。命令 `wc -l` 计算输出中的行数，这等于文件的数量。\n\n## UNIX 哲学\n\nLinux 使用的核心命令行工具链是以\
    \ UNIX 操作系统的命令为模型构建的，该系统可追溯至 1970 年代初。UNIX 的设计旨在既轻量又强大；这一目标最终凝结为“UNIX 哲学”，Doug\
    \ McIlroy 在 1994 年将其总结如下：\n\n> “编写程序只做一个事情，并做好它。编写能够协同工作的程序。编写处理文本流程序，因为这是一个通用接口。”\n\
