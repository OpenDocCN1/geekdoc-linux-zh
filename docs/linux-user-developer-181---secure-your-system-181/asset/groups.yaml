    KDE 体验的外观和感觉。壁纸插件现在首次可以在锁定屏幕上显示。KDE 的小部件已更新以提高其效率。Plasma Discover（“KDE 软件商店”）已重新设计，多屏支持增强，RTL
    语言支持显著扩展。


