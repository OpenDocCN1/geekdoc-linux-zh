    ## 欢迎阅读 Linux User & Developer 第 181 期


    ### 本期内容

    - 保护你的系统，第 18 页

    - 最新 Linux Mint 开发动态，第 28 页

    - 面向 Linux 的 AWS，第 56 页


    ![](img/fb76008333fb7aef815b136f9f1afe5f_2_0.png)


    欢迎来到英国和北美最喜欢的 Linux 和 FOSS 杂志。上个季度，36% 的所有恶意软件都针对 Linux（WatchGuard 2017 年第一季度威胁报告）。其中大多数是物联网设备，但考虑到市面上大量产品发布后无法打补丁且在那里等待被黑客利用的情况，这并不令人惊讶。这种免费搭乘的情况需要结束。这些公司需要投资其使用的开源软件，否则就要被点名批评，直至倒闭。


    虽然物联网的现状令人遗憾，但在桌面方面，我们通过关于保护系统的大型专题为你提供了全面覆盖（第 18 页）：我们从禁用未使用的服务到安全审计、自动化系统监控以及沙箱化，无所不包。我们还对
    Linux Mint 的开发进行了一次全新的审视（第 28 页），并访谈了它的创始人（第 12 页）。对于动手派，我们有来自利物浦创客节的报道，以及内容丰富的
    Pi 版块（从第 69 页开始）；对于开发者，则有一份关于如何充分利用 AWS 的综合指南。除了我们常规的全部内容，包括虚拟化软件的团体测试（第 81 页）外，我们还为初学者启动了
    Linux 基础系列（第 36 页），并在第 44 页尝试了娱乐数学。这是一期内容丰富的杂志，请尽情享用！


    Chris Thornett，主编


    与团队联系：linuxuser@futuresnet.com

