    \nAnother text editor? It's easy to start a text editor project, but it takes\
    \ real drive to keep one going through several versions, so it's worth taking\
    \ a look at what TKE has to offer. It has syntax highlighting for 85 languages\
    \ to hand multi-cursor/multi-selection support, and quick navigation through code\
    \ with the Bird's Eye text viewer. TKE is written in Tcl, with a minimalist Tk\
    \ GUI.\n\nWhile installation was easy enough, and syntax highlighting and other\
    \ features worked across many languages that we tried, there were some problems\
    \ opening files: We experienced lock-ups of several seconds, or 'File does not\
    \ exist' messages when other editors had no problems. We acknowledge that our\
    \ test machines can throw up anomalies of their own and suggest, given that all\
    \ else was fine, that readers download TKE themselves and give it a go.\n\nWhile\
    \ Tcl's Tk toolkit may be familiar to you - it's used in many Python projects,\
    \ and fairly widely with other scripting languages - you might not be familiar\
    \ with the Tcl language. A quick browse through the well-organised source files\
    \ may pique your interest enough for you to try it out in your next scripting\
    \ project. Extended use of TKE should convince you further.\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_90_2.png)\n\
    \nAbove TKE is a code editor with plenty of useful features that aren't obscured\
    \ by loads of cruft\n\n## Pros\nAt last, a powerful code editor without the bloat\
    \ of IDEs or the all-or-nothing embrace of Vim and Emacs!\n\n## Cons\nSome lock-ups\
    \ and it sits in a difficult niche between simpler editors like nano, and fully-fledged\
    \ IDEs\n\n## Great for...\nA not so generally robust Tcl use for Sublime Text\n\
    \nhttp://tke.af.net\n"
  mdcn: "\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_88_0.png)\n\n控制台中部上方（Above The\
    \ Control Center）是来自 Mandrake/Mandriva 血统的遗留功能，它提供了对各种系统配置工具（如网络和防火墙）的单点访问。\n\n\
    > 漫长的孵化期的好处在于，Mageia 6 配备了许多新的功能和性能改进。\n\n开箱即用方面，该工具简单直观的设计使其非常适合对底层包管理原理了解有限或完全不了解的**用户**。不幸的是，Mageia\
    \ 不再提供直接启动软件管理应用程序的菜单入口。你必须点击 菜单 > 工具 > 系统工具 > Mageia 控制中心，然后点击 安装和卸载软件 来启动 rpmdrake。你也可以从美观设计的欢迎屏幕启动该软件应用。\n\
    \n尽管 rpmdrake —— 图形化软件管理工具 —— 仍然依赖 urpmi 来解决依赖关系，但开发者也在致力于 DNF dracora，这是一个作为\
    \ DNF 系统前端的替代应用程序，但它不会很快可用。Mageia 项目也在大力投入与 Fedora 的 COPR 项目合作，该项目旨在为构建第三方软件包仓库提供类似\
    \ PPA 的系统。\n\n在 Mageia 6 中，所有应用程序都已移植到 Plasma 5，这是 KDE 4 桌面的继任者。该发行版最终放弃了对 Lilo\
    \ 和 Grub Legacy 的支持，仅提供 Grub 2 作为引导加载程序，但如果你是从现有安装升级，你仍然可以继续使用其他引导加载程序。Mageia\
    \ 5 的用户如果先安装所有可用的 5 版更新，就可以升级到 Mageia 6，但他们必须使用发行版的 DVD 版本，而不是实时镜像之一。延迟的主要原因是安装程序中的\
    \ bug，但在我们在物理机器上进行的测试安装以及作为 VirtualBox 客户机的安装中，我们没有遇到任何 bug。但该发行版并非完全无 bug。如果你希望启用家长控制，你可以通过控制中心进行操作，但行为不稳定并导致崩溃。同样，虽然该发行版允许创建快照，以便在系统配置错误时可以回滚到之前的状态，但该功能会导致频繁崩溃。各个实时镜像仅提供少数日常办公、互联网和多媒体应用程序。但用户可以通过\
    \ Core、Nonfree 和 Tainted 仓库访问数千个附加软件包。硬件组件（如无线网卡和显卡）的专有驱动程序通过 Nonfree 仓库提供，而多媒体编解码器以及其他可能侵犯版权、专利或其他法律权利的软件包则被归类到第三个仓库。请注意，在这三个仓库中，只有\
    \ Core 默认是启用的。\n\n@Shashank Sharma\n\n## 优点\n坚定的开发人员结合庞大的用户社区，使 Mageia 成为理想的日常桌面发行版。\n\
    \n## 缺点\n过去两个发行版一直困扰着项目的漫长且频繁的延迟令人担忧。\n\n## 总结\n这是一个相当稳定的发行版，建立在 Mageia 5 引入的众多变更之上，是一个适合日常使用的可靠发行版。最终版对于寻求可配置系统且不需要太多资源的新手和有经验的用户来说，可能是一个完美的桌面。\n\
    \n8\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_88_0.png)\n\n## 免费软件评论\n\n###\
    \ BashStyle-NG 10.0\n通过图形界面自定义命令行设置\n\n如果你曾经想要自定义 Bash 提示符，而且由于距离上次操作已经很久，你大概不得不去谷歌搜索相关命令，也许你会希望有一种简单的图形界面方式来做到这一点？你会认为这个花哨且自相矛盾的想法不可行——毕竟，Bash\
    \ 的图形界面？——但这里我们展示了一个图形界面配置工具，它不仅处理 Bash 设置，还处理 Readline、Vim、nano 和 Git。一旦我们在测试机器上添加了\
    \ Python configobj 包，安装过程就很顺利（该包在 Debian/Ubuntu 仓库中可用，也可通过 pip 安装）。对于 Bash，大多数设置用于提示符和颜色。有一组预定义提示符；自定义颜色；自定义提示符的图形界面；以及\
    \ grep 中的颜色高亮。额外功能包括自定义 cd（可以即时创建目录）、制表符补全黑名单（用于屏蔽备份文件）；以及历史记录设置。Git 设置 - 姓名、电子邮件、默认编辑器、输出颜色\
    \ - 对于新手和偶尔的用户会很有用。挖掘该包的其他功能，如八进制和温度转换。这是一个小众软件，但一些用户会发现它是不可或缺的。\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_88_0.png)\n\
    \n上方 点击一个彩色图标，图形界面会变得更老式的灰色，以更改应用程序参数\n\n-   **优点**\n    消除了记住所有配置文件、shell 变量和命令行设置的负担\n\
    -   **缺点**\n    即使你喜欢图形界面，打开和使用它可能看起来和寻找配置文件选项一样麻烦\n\n**适合...** 无需深入查阅 man 页面即可进行快速配置更改\n\
    http://bit.ly/BashStyle\n\n### Mutt 1.8.3\n高效快速地管理电子邮件只需几条命令\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_88_0.png)\n\
    \n那些足够古老以至于记得电子邮件不是智能手机应用程序，而是互联网主要用途的我们，是在 Elm 及其克隆 Pine 和 Mutt 等命令行客户端长大的。远离命令行客户端的转变并未带来生产力的提升，而\
    \ Mutt 在过去两年中稳步增长改进，现在可能是重新审视（或首次发现）它的时机。\n\n这是处理繁重电子邮件负载最有效的方式之一。我们需要远超半页的评论来告诉你\
    \ Mutt 的强大功能，所以请打开 Mutt wiki 上的新手指南，它也链接到优秀的第三方教程，然后是完整的 HTML 手册。顶部有一行快捷键列表，它会随着上下文变化，如你将看到的那样，当你用箭头向下移动到其中一封邮件并按\
    \ Enter 键打开它时。Mutt 的强大之处不仅在于练习基本命令，还在于将它们串联起来以加快繁琐的归档操作。\n\n请记住，花在 Gmail 或 Evolution\
    \ 等应用程序的菜单中搜索以及点击复选框以移动、归档或删除电子邮件的那些分钟——所有这些都累积起来。相反，花时间学习几条命令，你就可以手指不离键盘地快速完成任务。并且当你已经将邮件归档到服务器（或你的\
    \ Raspberry Pi）时，你可以瞬间发出一封电子邮件，或处理 /var/mail/ 文件中的内容。\n\n-   **优点**\n    高效的快捷键，上下文特定的设置；键盘宏自动化复杂任务\n\
    -   **缺点**\n    有很多需要学习的地方，但 Mutt 的口号是“所有邮件客户端都很糟糕。这一个只是糟糕得少点！”\n\n**适合...**\n\
    最终让你控制好自己的电子邮件堆积如山的情况\nwww.mutt.org\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_89_0.png)\n\
    \n## 虚拟桌面游戏查看器\n\n### Rolisteam 1.8.2\n无法参加朋友的桌面游戏会话？远程加入他们\n\n> 它始于一篇法语 Ubuntu\
    \ 论坛的帖子，寻求移植一些\n\nDungeons & Dragons 软件的帮助，结果发现该软件是用 Qt 编写的，很快就在 Ubuntu 7.10 上运行了。近十年后，Rolisteam\
    \ 不仅在 GNU/Linux 下易于编译，而且已显著成长和改进，并翻译成几种欧洲语言。它不仅仅关乎 D&D，作为一个高效的方式，让远程玩家之间玩任何桌面游戏，因为它促进了通过互联网查看所有必要的角色卡、地图等。\n\
    \nwiki 和其他（多语言）文档涵盖了一切，但你需要挖掘它们以获得完整的图景。鉴于大多数 Dungeons & Dragons 爱好者在设置上投入了大量时间，这不会让很多人却步。一个用户，通常是游戏主持人，设置为服务器\
    \ - 或主机 - 其他玩家通过服务器地址连接他们；端口（默认：6660）需要打开。\n\n“目标使 Rolisteam 管理的 RPG 游戏如同你桌边的\
    \ RPG 游戏一样好，”主页上说。所有组件都齐备：角色卡；地图和图片共享；矢量映射；掷骰子和秘密掷骰子；聊天；以及环境音乐（喜忧参半）。Rolisteam\
    \ 甚至有一个内置的 Twitter 机器人，你可以用像 #roll 5d10 这样的推文调用；你也可以在游戏查看器中本地运行 DiceParser。\n\n\
    ## 优点\n涵盖了桌面游戏所需的一切，具有巧妙的矢量映射功能\n\n## 缺点\n临时网络连接可能对所有应用程序都有问题 - 注意防火墙问题\n\n##\
    \ 适合...\n无法聚首时进行 D&D 桌面游戏\n\nwww.rolisteam.org\n\n## 代码编辑器\n\n### TKE 3.1\n友好、功能齐全且无臃肿的代码编辑器\n\
    \n![](img/fb76008333fb7aef815b136f9f1afe5f_89_0.png)\n\n又一个文本编辑器？开始一个文本编辑器项目很容易，但需要真正的动力才能让它通过几个版本持续下去，因此值得看看\
    \ TKE 有什么可提供。它支持 85 种语言的语法高亮，提供多光标/多选择支持，并可通过 Bird's Eye 文本查看器快速导航代码。TKE 用 Tcl\
    \ 编写，具有极简主义的 Tk 图形界面。\n\n虽然安装相当容易，而且语法高亮和其他功能在我们尝试的许多语言中都能正常工作，但在打开文件时有一些问题：我们遇到了几秒钟的锁定，或者当其他编辑器没有问题时出现“文件不存在”的消息。我们承认我们的测试机器可能会产生自身的异常，并建议读者鉴于其他一切都正常，自行下载\
    \ TKE 并尝试一下。\n\n虽然 Tcl 的 Tk 工具包你可能很熟悉——它用于许多 Python 项目，并广泛用于其他脚本语言——但你可能不熟悉 Tcl\
    \ 语言。快速浏览一下组织良好的源文件可能会激起你足够的兴趣，让你在下一个脚本项目中尝试它。扩展使用 TKE 应该让你更加信服。\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_90_0.png)\n\
    \n上方 TKE 是一个拥有许多有用功能的代码编辑器，且不被大量无用部分所掩盖\n\n## 优点\n终于，一个强大的代码编辑器，没有 IDE 的臃肿，也不是像\
    \ Vim 和 Emacs 那样全有或全无的拥抱！\n\n## 缺点\n一些锁定，且它处于比 nano 等更简单的编辑器和功能完备的 IDE 之间的一个困难利基市场\n\
    \n## 适合...\nSublime Text 的并非普遍稳健的 Tcl 替代\n\nhttp://tke.af.net\n\n"
