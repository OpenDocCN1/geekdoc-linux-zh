    # 评测


    Debian 9


    ![](img/fb76008333fb7aef815b136f9f1afe5f_85_0.png)


    ![](img/fb76008333fb7aef815b136f9f1afe5f_85_1.png)


    ## Debian 9


    > *上图 如果认为全包 DVD 有点过分，Debian 还为不同的桌面环境发布了各种实时 CD，例如 Xfce、MATE 和 Plasma*

    >

    > 最新的 Debian 发行版是发行版所代表的核心价值的体现 – 稳定性和长期可用性


    | 规格 | 详情 |

    | :--- | :--- |

    | 内存 | 1GB |

    | 存储 | 10GB |

    | 要求 | 1GHz Pentium 4 处理器 |

    | 支持 | 包括 ARM、32 位和 64 位 AMD/Intel 在内的十大主要架构 |

    | 获取方式 | www.debian.org/releases/stable |


    作为最古老的生存下来的 Linux 发行版之一，Debian 是 Linux 生态系统中最令人喜爱特质 – 协作 – 的见证。该项目在三个开发分支上运作 –
    稳定版（Stable）、测试版（Testing）和不稳定版（Unstable） – 软件包随着成熟从一个分支移动到下一个分支。最新的稳定版发行版是经过两年多残酷测试的产物，最终结果是一个极其稳定和可靠的发行版。


    除了其慢速烹饪般的发布策略和庞大的软件存储库外，使 Debian 区别于其同行另一特性是其软件政策。该发行版仅包含在自由软件许可证下发布的应用程序。专有编解码器、硬件设备（如打印机和显卡）的驱动程序被归入非自由软件存储库，该存储库默认未启用。


    正因为 Debian 中软件包含必须满足严格的技术要求，所以在十多年里，它没有捆绑两个最受欢迎的开源应用程序：Mozilla Firefox 浏览器和 Thunderbird
    邮件客户端，而是用重新品牌化的 Iceweasel 和 Icedove 取而代之。最新的


    ![](img/fb76008333fb7aef815b136f9f1afe5f_86_0.png)


    上图 最新发行版包含一些默认软件的关键变更，例如用 MariaDB 替代 MySQL，以及更新版本的 GNU PG (2.1)


    由于漫长的测试过程，Debian 不包含尖端软件，但从某种意义上来讲，这对 Linux 生态系统也是一件好事


    Debian 发行版标志着这两个备受喜爱的 Mozilla 应用程序的回归，因为争议最终得到解决。Mozilla 承认 Debian 对其产品的修改和更新符合
    Mozilla 严格的质量标准。导致 Iceweasel 诞生的商标争议也随着 Firefox 标志在自由许可证下的发布而得到解决。


    该发行版还包含一些对现有用户特别相关的变更。网络接口卡 (NIC) 现在使用 BIOS/固件和插槽号进行命名。例如，您的以太网和无线网卡现在将分别命名为 ens0
    或 wlP3s0。如果您有按名称引用 NIC 的脚本，这一点很重要，因为您需要编辑这些脚本以提供新名称。


    对于管理员而言，该发行版附带 MariaDB，它取代 MySQL 成为默认数据库服务器。安全是最新发行版的关键关注点：Debian 9 配备了流行的安全应用
    GNU PG 的现代分支。虽然旧版本的 GNU PG 现在已弃用，但仍作为 gnupg1 提供给用户；然而，较新的分支带来了改进的智能卡支持和生成密钥的更好默认设置。虽然对启用
    UEFI 的机器的支持是在上一个发行版中引入的，但 Debian 9 的实时镜像现在也支持 UEFI 启动。该发行版现在可以配置为 X 显示系统不再需要 root
    权限即可运行。但要使用此功能，您需要 logind、libbam-systemd 和 gdm3 显示管理器。


    最新发行版还包括底层软件的升级，例如 Linux 内核、桌面环境和日常应用程序，如 LibreOffice。由于漫长的测试过程，Debian 不包含尖端软件，但从某种意义上来讲，这对
    Linux 生态系统也是一件好事，否则用户就没有理由去尝试像 Ubuntu、Mageia、Mint 和其他发行版了。


    您可以使用本月的封面光盘来试用 Xfce 版本；GNOME 是默认桌面环境，但也有 MATE 的选项。最新发行版标志着向图形安装程序的转变成为默认选项，但您仍然可以选择基于
    curses 的安装方式。开箱即用，该发行版提供了足够的应用程序供家庭用户和爱好者使用。如果您有更具体的用途，您将不得不扩展该发行版。


    Shashank Sharma


    ### 优点


    残酷的测试产生了一个极其健壮和稳定的发行版，由于其庞大的存储库，可用于任何用途。


    ### 缺点


    它配备的软件版本比其同行旧。如果您对尖端功能感兴趣，请尝试测试版或不稳定版。


    ### 总结


    献给其已故创始人 Iain Murdock，Debian 9 在过往发行版的基础上构建。长期的测试带来了即装即忘的稳定性在一个健壮的发行版中，不要介意由于缓慢的发布周期而过时的软件包，没有比
    Debian 更好的了。


    ![](img/fb76008333fb7aef815b136f9f1afe5f_86_1.png)


    # Mageia 6 Plasma RC


    ![](img/fb76008333fb7aef815b136f9f1afe5f_87_0.png)


    **上图** 该项目提供了一个全包的仅安装 DVD 镜像，以及几个针对不同桌面环境（如 Plasma 和 MATE）的实时可安装 ISO


    ## Mageia 6 Plasma RC


    | 规格 | 详情 |

    | :--- | :--- |

    | 内存 | 最低 512MB 内存；最佳性能需 2GB |

    | 存储 | 极简安装需 5GB 磁盘空间 |

    | 要求 | 任何 AMD、VIA 或 Intel 处理器 |

    | 获取方式 | www.mageia.org/en/downloads |


    备受期待且严重延误的 Mageia 6 承诺成为一个精彩的新发行版，如果 RC（候选版）是任何征兆的话


    与其前作在开发中花费了一年多时间一样，Mageia 6 也面临了过度的延误。随着 alpha 版本在 2016 年 3 月发布，beta 版本在 7 月发布，发布候选版（本文评测对象）终于在
    2017 年 5 月底揭晓。最终版本原本计划在 RC 之后约两周发布，但目前尚未得知何时最终公布。


    尽管开发人员在延迟问题上受到了一些用户的批评，但延误进一步证明了他们致力于发布极其稳定和可用产品的决心。长期孕育期的好处是，Mageia 6 附带了一堆新功能并拥有更好的性能。


    '
