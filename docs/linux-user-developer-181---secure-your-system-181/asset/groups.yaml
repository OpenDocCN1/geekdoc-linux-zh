    # Feature Liverpool MakeFest


    SHOW REPORT


    # LIVERPOOL • SCIENCE • TECHNOLOGY • CRAFTS MAKEFEST


    As the festival celebrating creativity, invention and gadgetry reaches its third
    year, **Richard Smedley** joins the buzzing crowds


    > **KEYINFO**

    > Make fests and Maker faires are where creatives and techies get together to
    show off their projects to each other and the public.

    > Liverpool’s event is a free annual one-day festival supported by Liverpool Central
    Library and run by volunteers.


    Over the last few years the maker scene has not just brought free and open source
    values to hardware and the emerging world of IoT, it has unleashed a wave of creativity
    and brought in thousands of people, young and old, to engage playfully with technology.
    With this in mind, LU&SD attended the third Liverpool MakeFest, one of the most
    fun-filled events on the tech calendar. We also took the opportunity to speak
    to local artist Ross Daziel about the role of arts in technology and the maker
    community, who describes himself as “an artist inspired by maker culture” that
    has been changed by the “hackspace and open source culture of programming and
    hardware.” But more on this later.

    Held again in the Liverpool Central Library, with its elegant neoclassical facade
    opening onto a modernised interior – and a contrasting world of books, technology
    and elaborately costumed steampunks – the Liverpool MakeFest is a feast for the
    eyes as well as the brain. Here can be seen every facet of the UK’s strong and
    growing maker movement.

    As well as the usual range of fab labs available at educational sites across Merseyside,
    Liverpool is blessed with two makerspaces. DoES (Do Extrastordinary Stuff!) is
    a long-time supporter of MakeFest, showing a range of projects. Liverpool Make,
    already expanded to two spaces, is running an Indiegogo campaign to raise funds
    for “Make Liverpool Weid”, to “bring open-access welding to the people of Liverpool”.

    Many of the makerspaces and hackspaces present vigorously promote traditional
    crafts, which are also shown and even taught on many stands – from guitar making
    and jewellery from junk, to sewing and working with smart fabrics. Old and new
    crafts blended seamlessly and young visitors responded by taking to the traditional
    and the high-tech with equal enthusiasm.


    # Thus one journeys to the stars


    Near the entrance, visitors’ attention has traditionally been grabbed by a full-sized
    Dalek, but this year it had to compete with an array of rockets and DIY satellite
    chat, from North Wales-based maker, Jo Hincliffe.

    From there, we follow two flights of staircases across the ceiling-height open
    atrium and up on to the roof to telescopes set up by the local astronomy society.
    Moving down the electromagnetic spectrum, we find representatives of the local
    amateur radio group – where a culture of learning and making for yourself predates
    home computing by decades, yet radio amateurs continue to adapt to new technology
    building software defined radios or having retro fun transmitting Morse code over
    the internet.

    What united many of the diverse maker stands across five floors of the library,
    were the numerous hands-on events. Everywhere families and children were trying
    things out, having fun and learning to love the creative possibilities of technology.
    Education met technology in several unlikely ways, such as Gemma Latham’s PatternCraft,
    which links textiles, code and Minecraft, using a homemade device to read cards
    hand-punched by children (and many eager adults) visiting the stand. Python code
    builds the cards’ 8x8 patterns on a


    64'
