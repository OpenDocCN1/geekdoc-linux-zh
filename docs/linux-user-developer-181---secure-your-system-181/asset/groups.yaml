    Mint 有多主流？嗯，如你可能所知，Linux 在热门电视剧《黑客军团》中扮演了重要角色。角色们讨论过 GNOME 与 KDE、GNOME 2 和 Kali
    Linux 曾亮相——第三季计划将呈现 Linux Mint。保持关注！


    ![](img/fb76008333fb7aef815b136f9f1afe5f_30_1.png)

