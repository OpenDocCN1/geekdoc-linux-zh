    \ web app"
  md: "\n# Erlang\n\n## Program in Erlang: Start developing web apps\n\nLearn how\
    \ to develop robust web applications and web servers in Erlang\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_49_0.png)\n\
    \n**Mihalisp Tsoukalos**\n\nis a UNIX administrator, a programmer (UNIX & IOS),\
    \ a DBA and a mathematician.\n\nHe has been using Linux since 1993.\n\nYou can\
    \ reach him at @matsouk (Twitter) and http://www.mtsoukalos.eu.\n\n### Resources\n\
    \n- A recent Erlang installation\n- www.erlang.org\n- Your favourite text editor\n\
    - A web browser\n- To taste the web applications that you develop\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_49_1.png)\n\
    \nThis is another tutorial in the Erlang series – its subject is the development\
    \ of web applications and web servers in Erlang. In order to follow the examples\
    \ of this tutorial, you will need a modern web browser as well as a recent Erlang\
    \ installation.\n\nThe good thing is that you can follow this tutorial without\
    \ having to run your own web server, because you can test most of the presented\
    \ examples locally using web servers written in Erlang that come with the Erlang\
    \ web application.\n\nSo, this tutorial will talk about WebSockets, Cowboy, MochiWeb\
    \ and how you can use them for talking to a web browser and creating your own\
    \ HTTP servers. Apart from the required theory, this tutorial includes handy and\
    \ easy-to-understand Erlang code that will permit you to demystify the challenging\
    \ areas Erlang web development. Nevertheless, in order to take full advantage\
    \ of this tutorial, you will have to write your own Erlang code and create your\
    \ own web applications and web servers.\n\nThis is the last tutorial in the Erlang\
    \ series, so now it would be a good time to review all previous Erlang tutorials\
    \ and start writing your own unique, interesting and handy Erlang applications!\
    \ Erlang code might look difficult to write at first, but offers so many hard-to-find\
    \ advantages that it’s definitely worth a try!\n\nIn the last few years, various\
    \ types of web apps take most of the internet traffic. So, this tutorial will\
    \ show you how to write web apps in Erlang in order to take advantage of the unique\
    \ Erlang characteristics that give you the opportunity to create robust and distributed\
    \ applications very simply.\n\nAs the web is asynchronous, concurrent and requires\
    \ fast responses, Erlang is a perfect candidate for participating in the whole\
    \ web experience.\n\nThis tutorial will be a gentle and easy-to-follow introduction\
    \ to the capabilities of Erlang that can help you create powerful web applications\
    \ and web servers.\n\n## About web applications\n\nIf you are not familiar with\
    \ web applications, you might be wondering what one is. A web application (or\
    \ web app for short) is a client-server software application where the client\
    \ part runs on a web browser. Webmail, instant messaging services, online stores\
    \ and many other kinds of applications are web applications. So, the rest of this\
    \ tutorial will teach you how to create such applications where the server part\
    \ is developed in Erlang and the client part is displayed on your favourite web\
    \ browser.\n\nErlang allows you to quickly write a simple web server that can\
    \ be used for testing your web apps and discovering any connectivity issues between\
    \ your machine and the one that will host the web app. Therefore, this section\
    \ will present a simple Erlang module that will implement a naive web server that\
    \ just prints the ‘Hello World!’ message all the time. However, using such a simplistic\
    \ Erlang web server on production systems might not be the best choice.\n\n##\
    \ Create a web server for testing\n\nThe name of the Erlang module will be *naiveWS*\
    \ and will be saved as *naiveWS.erl*. You can see its Erlang code in **Figure\
    \ 1**, which is mainly a simplistic concurrent TCP server.\n\n```erlang\n-module(naiveWS).\n\
    \nopen_connection(Port) ->\n    spawn(fun() -> {ok, Socket} = gen_tcp:listen(Port,\
    \ [{active, false}]),\n        loop(Socket) end).\n\nloop(Sock) ->\n    {ok, Conn}\
    \ = gen_tcp:accept(Sock),\n    Handler = spawn(fun() -> handle(Conn) end),\n \
    \   gen_tcp:controlling_process(Conn, Handler),\n    loop(Sock).\n\nhandle(Conn)\
    \ ->\n    gen_tcp:send(Conn, reply(\"Hello World!\\r\\n\")),\n    gen_tcp:close(Conn).\n\
    \nreply(Str) ->\n    B = list_to_binary(Str),\n    [\"Status: 200 OK\\r\\n\" |\
    \ \"Content-Type: text/html;\\r\\n\" | \"Content-Length: \" ++ Str ++ \"\\r\\\
    n\"],\n    [Size(B), B]].\n```\n\n**Above** The Erlang code of *naiveWS.erl* that\
    \ implements a very simple yet concurrent web server using *gen_tcp:listen()*\
    \ and *spawn()*\n\nThe *naiveWS:open_connection()* function requires just one\
    \ parameter, which is the port that the web server will use. Therefore, you can\
    \ start the web server by executing the following command in the Erlang shell\
    \ after compiling *naiveWS.erl*:\n\n```bash\n2> naiveWS:open_connection(1200).\n\
    <0.64.0>\n```\n\nUsing the *wget* utility to test the web server is as simple\
    \ as executing the next command:\n\n```bash\n$ wget 127.0.0.1:1200/\n--2017-05-29\
    \ 10:12:08--\nhttp://127.0.0.1:1200/\nConnecting to 127.0.0.1:1200... connected.\n\
    HTTP request sent, awaiting response... 200 OK\nLength: 12 [text/html]\nSaving\
    \ to: ‘index.html’\n\nindex.html              100%[===========================>]\
    \       12  --.-KB/s    in 0s\n\n2017-05-29 10:12:08 (2.86 MB/s) - ‘index.html’\
    \ saved [12/12]\n```\n\nThe generated output will verify that the web server works\
    \ as expected.\n\nThe contents of the *index.html* file are the following, which\
    \ means that both the web server is working and the desired message was delivered\
    \ successfully:\n\n```html\nHello World!\n```\n\nIf the web server was not working,\
    \ the output of the *wget* command would have been similar to the following:\n\
    \n```bash\n--2017-05-29 10:20:10-- http://127.0.0.1:1200/\nConnecting to 127.0.0.1:1200...\
    \ failed:\nConnection refused.\n```\n\nHowever, as you will see in a while, there\
    \ exist three other Erlang projects – MochiWeb, Yaws and Cowboy – that are more\
    \ suitable for developing HTTP servers. This tutorial will use MochiWeb later\
    \ on due to its simplicity and Cowboy because it has many capabilities and is\
    \ very well supported by its developers. Nevertheless, both Cowboy and Yaws have\
    \ more capabilities than MochiWeb.\n\n## Use Cowboy, an HTTP server\n\nWritten\
    \ in Erlang, Cowboy is a small and efficient HTTP server for Erlang, OTP and Elixir\
    \ projects. Cowboy supports many kinds of handlers, including REST, WebSockets\
    \ and HTTP ones. Although this tutorial is not about Cowboy, it will deal with\
    \ its installation process in the next section because you might find it a little\
    \ perplexing if you are not used to installing external Erlang modules. You can\
    \ find more information about Cowboy at https://github.com/ninenines/cowboy and\
    \ at the website of Nine Nines: https://ninenines.eu.\n\n> As the whole process\
    \ will be pretty complex, you will need a build system to make your life easier:\
    \ in this case, the Erlang.mk tool\n\n### The Hello World! program\n\nEnough with\
    \ the theory – it is now time to learn how to install Cowboy and watch it in action!\n\
    \nThis section will present a simple web app in order to better understand how\
    \ the whole Erlang with Cowboy thing works. As the whole process will be pretty\
    \ complex, you will need a build system to make your life easier – in this case\
    \ the build system will be the Erlang.mk tool and will be the first thing that\
    \ you will need to download when developing a project that uses Cowboy. You can\
    \ find more information about the Erlang build system at https://github.com/ninenines/erlang.mk.\n\
    \nBut first you will need to create a directory that will keep all the files of\
    \ the project – in this case the name of the project is `hw`, so the directory\
    \ name will also be `hw`, which you can create by executing the `mkdir hw` command.\
    \ Then you will need to execute `cd hw` to actually go into that directory.\n\n\
    Now follow the next steps in order to create a new Erlang project that will use\
    \ Cowboy:\n\n```bash\n$ wget https://raw.githubusercontent.com/ninenines/erlang/master/erlang.mk\n\
    $ make -f erlang.mk bootstrap-rel\n$ make\n```\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_51_0.png)\n\
    \n**Above** A part of the `hw` project initialisation process that illustrates\
    \ how you can use Cowboy in order to develop a web application in Erlang\n\nFigure\
    \ 2 shows some of the results you will get on your screen after executing the\
    \ previous commands. So far, you have created the skeleton of a new Erlang project\
    \ and a dump shell script that you can run as `.rel/hw/_rel/release/console` to\
    \ make sure that everything is fine.\n\nNow it’s time to actually install Cowboy\
    \ by making changes to the Makefile. The final version of the Makefile will be\
    \ as follows:\n\n```makefile\nPROJECT = hw\nPROJECT_DESCRIPTION = A Hello World\
    \ program\nPROJECT_VERSION = 0.1.0\n\nDEPS = cowboy\ninclude erlang.mk\n```\n\n\
    All the work is done by the `DEPS = cowboy` line, which will order the build system\
    \ to download and install Cowboy. Then you will need to create a new file named\
    \ `hw.app.src` inside the `src` directory (if it is not already there – you can\
    \ see `hw.app.src` by looking at the source code that accompanies this tutorial).\
    \ Now, if you execute the make utility, the build system will take care of the\
    \ rest! If the last line of the output is `release-1.tar.gz successfully created`\
    \ you are good so far.\n\nNext, you will need to edit some of the existing files\
    \ in order to define the URLs that your web app will support, as well as adding\
    \ the required Erlang code that implements the desired functionality of the web\
    \ app. First, you will edit `src/hw.app.erl`. Figure 3 shows the final version\
    \ of the `src/hw.app.erl` file – this is the first place you should visit for\
    \ finding out more about the list of supported URLs as well as the port number\
    \ the Cowboy server will listen to. However, we are not done yet, as we will have\
    \ to create a plain HTTP handler for the URL:\n\n```bash\n$ make new t=cowboy_http\
    \ m=hw_handler\n```\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_51_1.png)\n\n\
    **Above** The Erlang code of the `src/hw.app.erl` file, which is the most important\
    \ file of the app, because this is where you define the supported URLs of the\
    \ web app\n\nPlease make sure that the name of the handler is in sync with the\
    \ name you defined in the `hw.app.erl` file.\n\nLast, you will have to open the\
    \ `src/hw_handler.erl` Erlang file, which was created by the previous command,\
    \ in order to change the implementation of the `handle()` function. After editing,\
    \ the implementation of the `handle()` function of the `hw_handler.erl` module\
    \ should be as follows:\n\n```erlang\nhandle(Req, State=#{state()}) ->\n    {ok,\
    \ Req2} = cowboy_req:reply(200,\n```\n"
  mdcn: "\n# Erlang\n\n## 使用 Erlang 编程：开始开发 Web 应用程序\n\n了解如何在 Erlang 中开发健壮的 Web 应用程序和\
    \ Web 服务器\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_49_0.png)\n\n**Mihalisp\
    \ Tsoukalos**\n\n是一名 UNIX 系统管理员、程序员（UNIX 和 IOS）、数据库管理员数学家。\n\n自 1993 年以来，他一直在使用\
    \ Linux。\n\n你可以通过 Twitter 账号 @matsouk 或访问 http://www.mtsoukalos.eu 与他联系。\n\n###\
    \ 资源\n\n-   最近安装的 Erlang\n-   www.erlang.org\n-   你喜欢的文本编辑器\n-   一个 Web 浏览器\n\
    -   为了品尝你开发的 Web 应用程序\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_49_1.png)\n\n\
    这是 Erlang 系列教程中的另一个教程，其主题是 Erlang 中 Web 应用程序和 Web 服务器的开发。为了遵循本教程中的示例，你需要一个现代的\
    \ Web 浏览器以及最近安装的 Erlang。\n\n好的方面是，你可以在不运行自己的 Web 服务器的情况下跟随本教程，因为你可以通过本地测试使用 Erlang\
    \ 编写的 Web 服务器来测试大多数给出的示例，这些服务器随 Erlang Web 应用程序一起提供。\n\n因此，本教程将讨论 WebSockets、Cowboy\
    \ 和 MochiWeb，以及如何使用它们与 Web 浏览器通信并创建自己的 HTTP 服务器。除了必要的理论之外，本教程还包括方便且易于理解的 Erlang\
    \ 代码，这些代码将帮助你解开 Erlang Web 开发中难以理解的部分。尽管如此，为了充分利用本教程，你必须编写自己的 Erlang 代码并创建自己的\
    \ Web 应用程序和 Web 服务器。\n\n这是 Erlang 系列教程的最后一篇，所以现在是一个回顾之前所有 Erlang 教程并开始编写你自己的独特、有趣且方便的\
    \ Erlang 应用程序的好时机！Erlang 代码一开始可能看起来很难编写，但它提供了许多难以找到的优势，绝对值得一试！\n\n在过去几年中，各种类型的\
    \ Web 应用占据了大部分互联网流量。因此，本教程将向你展示如何使用 Erlang 编写 Web 应用，以利用 Erlang 的独特特性，这些特性使你能非常轻松地创建健壮且分布式的应用程序。\n\
    \n由于 Web 是异步的、并发的且需要快速响应，Erlang 是参与整个 Web 体验的理想候选者。\n\n本教程将对 Erlang 的功能进行温和且易于跟随的入门介绍，这些功能可以帮助你创建强大的\
    \ Web 应用程序和 Web 服务器。\n\n## 关于 Web 应用程序\n\n如果你不熟悉 Web 应用程序，你可能会问什么是 Web 应用程序。Web\
    \ 应用程序（或简称 web app）是一种客户端-服务器软件应用程序，其中客户端部分运行在 Web 浏览器上。网络邮件、即时消息服务、在线商店以及其他许多类型的应用程序都是\
    \ Web 应用程序。因此，本教程的其余部分将教你如何创建此类应用程序，其中服务器部分使用 Erlang 开发，客户端部分显示在你喜欢的 Web 浏览器上。\n\
    \nErlang 允许你快速编写一个简单的 Web 服务器，可用于测试你的 Web 应用程序并发现你的机器与托管 Web 应用程序的机器之间的任何连接问题。因此，本节将介绍一个简单的\
    \ Erlang 模块，该模块实现了一个朴素的 Web 服务器，它始终打印‘Hello World!’消息。然而，在生产系统上使用如此简单的 Erlang\
    \ Web 服务器可能不是最佳选择。\n\n## 创建用于测试的 Web 服务器\n\n该 Erlang 模块的名称为 *naiveWS*，将保存为 *naiveWS.erl*。你可以在\
    \ **图 1** 中看到它的 Erlang 代码，这主要是一个简单的并发 TCP 服务器。\n\n```erlang\n-module(naiveWS).\n\
    \nopen_connection(Port) ->\n    spawn(fun() -> {ok, Socket} = gen_tcp:listen(Port,\
    \ [{active, false}]),\n        loop(Socket) end).\n\nloop(Sock) ->\n    {ok, Conn}\
    \ = gen_tcp:accept(Sock),\n    Handler = spawn(fun() -> handle(Conn) end),\n \
    \   gen_tcp:controlling_process(Conn, Handler),\n    loop(Sock).\n\nhandle(Conn)\
    \ ->\n    gen_tcp:send(Conn, reply(\"Hello World!\\r\\n\")),\n    gen_tcp:close(Conn).\n\
    \nreply(Str) ->\n    B = list_to_binary(Str),\n    [\"Status: 200 OK\\r\\n\" |\
    \ \"Content-Type: text/html;\\r\\n\" | \"Content-Length: \" ++ Str ++ \"\\r\\\
    n\"],\n    [Size(B), B]].\n```\n\n**上方** 是 *naiveWS.erl* 的 Erlang 代码，使用 *gen_tcp:listen()*\
    \ 和 *spawn()* 实现了一个非常简单但并发的 Web 服务器\n\n*naiveWS:open_connection()* 函数只需要一个参数，即\
    \ Web 服务器将使用的端口。因此，在编译 *naiveWS.erl* 后，你可以通过在 Erlang 外壳中执行以下命令来启动 Web 服务器：\n\n\
    ```bash\n2> naiveWS:open_connection(1200).\n<0.64.0>\n```\n\n使用 *wget* 实用程序测试\
    \ Web 服务器就像执行下一个命令一样简单：\n\n```bash\n$ wget 127.0.0.1:1200/\n--2017-05-29 10:12:08--\n\
    http://127.0.0.1:1200/\nConnecting to 127.0.0.1:1200... connected.\nHTTP request\
    \ sent, awaiting response... 200 OK\nLength: 12 [text/html]\nSaving to: ‘index.html’\n\
    \nindex.html              100%[===========================>]       12  --.-KB/s\
    \    in 0s\n\n2017-05-29 10:12:08 (2.86 MB/s) - ‘index.html’ saved [12/12]\n```\n\
    \n生成的输出将验证 Web 服务器按预期工作。\n\n*index.html* 文件的内容如下，这意味着 Web 服务器正在工作并且期望的消息已成功传送：\n\
    \n```html\nHello World!\n```\n\n如果 Web 服务器没有工作，*wget* 命令的输出将与以下内容类似：\n\n```bash\n\
    --2017-05-29 10:20:10-- http://127.0.0.1:1200/\nConnecting to 127.0.0.1:1200...\
    \ failed:\nConnection refused.\n```\n\n然而，稍后你会看到，还有另外三个 Erlang 项目——MochiWeb、Yaws\
    \ 和 Cowboy——更适合开发 HTTP 服务器。由于 MochiWeb 的简洁性，本教程稍后将会使用 MochiWeb，并且因为 Cowboy 具有许多功能并受到其开发人员的极佳支持，所以也会使用\
    \ Cowboy。尽管如此，Cowboy 和 Yaws 都比 MochiWeb 拥有更多的功能。\n\n## 使用 Cowboy，一个 HTTP 服务器\n\
    \nCowboy 是用 Erlang 编写的，它是 Erlang、OTP 和 Elixir 项目的小型高效 HTTP 服务器。Cowboy 支持多种类型的手处理器，包括\
    \ REST、WebSockets 和 HTTP。虽然本教程不是关于 Cowboy 的，但下一节将讨论其安装过程，因为如果你不习惯安装外部 Erlang 模块，你可能会发现这有点令人困惑。你可以在\
    \ https://github.com/ninenines/cowboy 以及 Nine Nines 的网站 https://ninenines.eu 上找到有关\
    \ Cowboy 的更多信息。\n\n> 由于整个过程会相当复杂，你需要一个构建系统来让你的生活更轻松：在这种情况下，是 Erlang.mk 工具\n\n\
    ### Hello World! 程序\n\n理论到此为止——现在是时候学习如何安装 Cowboy 并观察其实际运行效果了！\n\n本节将展示一个简单的 Web\
    \ 应用程序，以便更好地理解 Erlang 和 Cowboy 的整体工作方式。由于整个过程会相当复杂，你需要一个构建系统来让你的生活更轻松——在这种情况下，构建系统将是\
