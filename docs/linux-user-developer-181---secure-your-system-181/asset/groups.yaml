    decided to focus on that project and to keep making it better with every new release.
    It has grown over since and although the goal never really changed, I think the
    principles behind it have remained the same.


    # Has the vision for Mint changed in its over ten years of existence?


    The mission is the same. In 2006, although it could definitely be improved for
    novice users, I strongly believed Linux was already the best desktop operating
    system for many of us. Ubuntu was the best distribution, so by adding improvements
    to it my main goal was simply to do better and better with each new release. This
    is still true today: we’ve focused on ourselves, on what we want to achieve and
    what people need, and our primary goal is to always publish a better release.


    One key principle is for things to work out of the box. Whether you’re a novice
    or an experienced user, everybody likes features to just work. If you have to
    tinker with something to make it work, it should either be fixed or removed.


    Another key principle is that you, the user, are central and nothing is more important
    than your user experience. When it runs on your computer, Linux Mint isn’t ‘our’
    operating system; it’s yours. It needs to work for you. Of course, free software
    and licensing is important to us, and so are other philosophical aspects, but,
    unlike a few other distributions, pragmatism is key. We’re not here to lecture
    anyone: our primary goal is to empower our users.


    # You spoke out against some Linux distros spreading fear, uncertainty and doubt
    (FUD) about Linux Mint last year. How’s your FUD quota these days?


    I’ve no time or patience for it and I tell my team not to react to it. Although
    FUD aims at harming your reputation, it usually has the opposite effect and contributes
    to a project’s growth. First, once people understand what’s going on they show
    a lot of support and actively start to deter it. Second, it makes a lot of people
    react and, all of a sudden everybody’s talking about you, even outside the Linux
    community and the audience you would normally reach. We’ve seen significant increases
    in growth with each large FUD campaign that has hit us.


    Now, with that said, it’s also an issue for us of course because it’s a huge motivational
    blow. [...] FUD hits and reminds us how dark, nasty and bored some people are.
    [...] When we see FUD, our priority is to ignore it. What’s most at risk is a
    loss of motivation or a waste of time, two of the most essential resources needed
    during each development cycle. We only react to FUD when we really need to, and
    on these rare occasions we make sure to name and shame people who helped to spread
    it.


    Do you think the popular Linux distros are starting to build too many walls between
    each other?

    No, I don’t think so. The only thing I’m a bit worried about lately is Snap. I
    don’t think it’s okay for distributions to rely on an underlying Ubuntu Store.
    I’m also worried to see it disappear overnight. [...] Other than that, I don’t
    really see it that way.


