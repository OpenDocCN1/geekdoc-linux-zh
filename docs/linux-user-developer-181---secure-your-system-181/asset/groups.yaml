    \n  除了从控制台读取 `stdin` 和写入 `stdout`，我们还可以从文件读取和写入。例如，如果我们输入命令：\n\n  ```bash\n  $\
    \ ls > files_in_directory.txt\n  ```\n\n  这将创建一个名为 files_in_directory.txt 的新文件，其中包含\
    \ `ls` 命令的输出。如果该文件已存在，它将被覆盖。如果我们想将输出追加到现有文件的末尾，则可以使用 `>>` 而不是 `>`：\n\n  ```bash\n\
    \  $ echo 'These are the files in the directory:' > files_in_directory.txt\n \
    \ $ ls >> files_in_directory.txt\n  ```\n\n  ![](img/fb76008333fb7aef815b136f9f1afe5f_38_0.png)\n\
    \n  ![](img/fb76008333fb7aef815b136f9f1afe5f_38_1.png)\n\n  ![](img/fb76008333fb7aef815b136f9f1afe5f_38_2.png)\n\
    \n  ![](img/fb76008333fb7aef815b136f9f1afe5f_38_3.png)\n\n  我们还可以使用 `<` 连接符从文件读取输入。例如，我们可能想知道赫尔曼·梅尔维尔的《白鲸记》（Moby\
    \ Dick）有多少行：\n\n  ```bash\n  $ echo -n \"The number of lines in 'Moby Dick' is\
    \ \" > mobystats.txt\n  $ cat moby10b.txt | wc -l >> mobystats.txt\n  $ echo -n\
    \ \"The number of lines in 'Moby Dick' containing the word 'Queequeg' is \" >>\
    \ mobystats.txt\n  $ cat moby10b.txt | grep Queequeg | wc -l >> mobystats.txt\n\
    \  $ cat mobystats.txt # 打印出文件 'mobystats.txt' 的内容\n\n  The number of lines in\
    \ 'Moby Dick' is 23244\n  The number of lines in 'Moby Dick' containing the word\
    \ 'Queequeg' is 246\n  ```\n\n  ![](img/fb76008333fb7aef815b136f9f1afe5f_38_4.png)\n\
    \n  ![](img/fb76008333fb7aef815b136f9f1afe5f_38_5.png)\n\n  ![](img/fb76008333fb7aef815b136f9f1afe5f_38_6.png)\n\
    \n  ![](img/fb76008333fb7aef815b136f9f1afe5f_38_7.png)\n\n## 条条大路通罗马（处理问题有多种方法）。\n\
    \n在最后一个示例中，我们使用命令 `cat` 来打印文件的内容。这是一个相当多功能的命令；如果你单独运行它，它所做的只是将输入重新打印到输出中：\n\n\
    ```bash\n$ cat\nHello, world!\nHello, world!\n```\n\n如果你想直接将少量文本写入文件，而不打开文本编辑器，这有时很有用：\n\
    \n```bash\n$ cat > hello.py\nprint(\"Hello, world!\")\n<Ctrl+D>\n$ cat hello.py\n\
    print(\"Hello, world!\")\n```\n\n读取和写入文件是 `cat` 命令的两个重要用例，但其原始用途是用于 `concatenating`（连接）文件（这就是其名称的来源）。如果我们向\
    \ `cat` 传递多个文件名作为参数，它将连接这些文件并打印出结果：\n\n```bash\n$ echo 'HAMLET: Do you see yonder\
    \ cloud that\\'s almost in shape of a camel?' > line1.txt\n$ echo 'POLONIUS: By\
    \ the mass, and 'tis like a camel, indeed.' > line2.txt\n$ echo \"HAMLET: Methinks\
    \ it is like a weasel.\" > line3.txt\n$ cat line1.txt line2.txt line3.txt > dialogue.txt\n\
    $ cat dialogue.txt\nHAMLET: Do you see yonder cloud that's almost in shape of\
    \ a camel?\nPOLONIUS: By the mass, and 'tis like a camel, indeed.\nHAMLET: Methinks\
    \ it is like a weasel.\n```\n\n到目前为止，我们遇到的命令允许我们创建和删除新文件和目录，并在不离开终端的情况下读写文本文件。这些命令本身相当简单，但当我们将它们与管道和文件重定向结合时，我们就能够使用它们来完成有用的工作。实验一下我们目前涵盖的命令和技术，看看你能用它们做什么。在下一个\
    \ Linux 基础教程中，我们将遇到一些新的更强大的命令，并且我们将介绍脚本编写，在这个过程中，我们创建文件来指示计算机依次运行一系列命令。\n\n*将更复杂的命令视为沿管道流动的数据是有益的*\n\
    \n“使用管道和文件重定向，我们能够使用简单的命令来完成有用的工作”\n\n哲学的前两部分与编程中的某些流派非常相似，这些流派规定函数或方法应尽可能通用，并且只做一件事。事实上，我们可以将整个\
    \ UNIX 程序工具链视为一种专用的编程语言——当我们讨论脚本编写时，这一点将变得更加明显。\n\n哲学的第三部分——程序应处理文本流——在通用编程环境中意义较小，但非常适合命令行下的脚本编写。这意味着\
    \ UNIX 程序本质上是像**图 2**中那样的盒子，它们接收一些文本作为输入并返回一些文本作为输出。我们将看到，可以使用管道字符将这些盒子组合在一起，如**图\
    \ 3**所示。\n\n"
