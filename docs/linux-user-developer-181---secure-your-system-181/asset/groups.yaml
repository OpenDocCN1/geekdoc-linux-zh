    \n## 安全\n\n### 欧洲议会议员推动全欧盟范围的“后门”禁令\n\n欧盟立法能否保护加密技术？\n\n长期以来，打击犯罪和恐怖主义一直是政府增加监控权力的说辞。但就加密技术而言，存在一个问题：加密要么有效，要么无效。没有半吊子的措施。\n\
    \n这是某些欧洲议会议员关注的问题，他们已向欧洲议会提出修订法规的提案，禁止出于执法目的设立加密后门。在题为《公民自由、正义和内政委员会》的草案报告中，指出技术进步已超过数据保护条例的规范，因此提出了对\
    \ 2002 年电子隐私条例的修订。如果通过，这将影响英国阻止像 WhatsApp 等应用使用端到端加密（E2EE）的意图。\n\n草案报告指出：“电子通信服务提供商应确保有足够的保护措施，以防止未经授权访问或修改电子通信数据，并确保传输的保密性和安全性由所使用的传输手段的性质或最先进的电子通信数据端到端加密来保证。此外，当使用电子通信数据加密时，应禁止对这类通信进行解密、逆向工程或监控。”\n\
    \nOpen Rights Group 的执行主任 Jim Killock 回应这份草案报告时告诉我们：“委员会呼吁保护我们的数字安全，这一点非常值得欢迎，特别是在国际社会越来越施压要求公司削弱加密产品安全性的时候。英国已经拥有这些权力，需要对其进行严格测试和公开的法律挑战，以防止其被滥用，从而让所有人都面临风险。”\n\
    \n为加密通信提供后门将是开发者的责任，而目前为止，开发商一直抵制政府的压力。不仅这种可能性涉及隐私问题，它还有很大可能会影响数字经济。然而，要求这些后门的政府的论点是很强的。除了找出嫌疑人在线讨论的内容及其联系人外，还有什么更好的方式来打击国内恐怖主义吗？在恐怖袭击频繁的当下，有观点认为这些权力是必要的。在未来几个月里，随着欧盟委员会审查草案，以及德国、法国和英国政府提出反对意见，这场辩论很可能会在公众面前上演。考虑到英国脱欧的情况：如果现有的欧盟法律通过《大废除法案》纳入英国法律，我们是否会看到加密后门通过“后门”进入？\n\
    \n![](img/fb76008333fb7aef815b136f9f1afe5f_7_1.png)\n\n> 上方图片：欧盟将阻止加密后门，还是屈从于国家政府的压力？\n\
    \n## 硬件\n\n### Entroware 推出两款新的 Linux 笔记本电脑\n\n英国制造商推出 13 英寸和 17 英寸的 Linux Ubuntu\
    \ 笔记本\n\n世界需要更多的 Ubuntu 笔记本电脑吗？英国制造商 Entroware (www.entroware.com) 显然认为需要，他们在\
    \ 6 月下旬发布了一对 Ubuntu 17.04 笔记本，提供多种功能选择。\n\n第一款是 Apollo，一款 13.1 英寸的轻薄笔记本，沿袭 MacBook\
    \ Air 的传统。最基础版本（含税 330 英镑）配备 Pentium 4415U 2.3GHz 双核 CPU，但也可选择 Core i3、i5 和 i7\
    \ Intel Kaby Lake 处理器。默认的 4GB 内存和 500GB 硬盘也可以升级，图形由 Intel HD Graphics 控制。还可以选择支持\
    \ LTE 的网络卡。\n\n新推出的另一款是 hybris，起价为 810 英镑。默认配置包括 Core i5 处理器、4GB DDR4 内存、500GB\
    \ 硬盘和 Intel HD Graphics。当然，以上所有配置都可以升级，选项还包括 Nvidia GeForce GTX 1050 4GB。\n\n\
    这两款笔记本电脑模型默认安装了 Ubuntu 17.04，但也可以选择 16.04 LTS。但为什么要选 Ubuntu？Entroware 的会计和技术支持经理\
    \ Mike Wilson 告诉我们，这主要取决于客户满意度。\n\n“Ubuntu [...] 通过多年的稳定性、熟悉度和易用性，已被证明是 Linux\
    \ 桌面市场的支柱。加上 LTS 版本和上游更新的快速实施，我们能够生产更新的硬件来与其他消费级 IT 市场展开竞争。”\n\n“但是在 Windows 笔记本电脑上安装\
    \ Ubuntu 不是更简单吗？” “不幸的是，在大多数情况下，并不是。一些硬件供应商使用了 Linux 支持不佳的组件，这可能会带来问题。这意味着客户可能要花大量时间尝试让机器正常工作，如果他们甚至能做到的话。”\n\
    \n为了解决这个问题，Wilson 表示 Entroware 的方法是采购硬件以最大限度减少兼容性问题，并为每台售出的电脑捆绑终身软件支持。“Entroware\
    \ 对 Linux 的支持并未止步于此。此外，我们通过赞助活动（如 OggCamp）、支持发行版（如 Ubuntu MATE）和赞助 Linux 媒体（如\
    \ Late Night Linux）来帮助社区。”\n\n## TOP 五\nUnity 项目\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_8_0.png)\n\
    \n- **1 Yunit – Unity 8 的分叉版本**\n  虽然 Yunit 未能获得普遍欢迎，但 Unity 确实有它的粉丝，许多开发人员正在合作开发一个新的分叉版本\
    \ Yunit。迄今为止，他们已开始为 64 位系统发布 Debian 不稳定版本。Yunit 还在与 UBports 项目（见下文）合作，用于 Ubuntu\
    \ Touch 设备。更多详情请访问 https://yunit.io。\n\n- **2 UBports 拯救了 Touch**\n  支持 Ubuntu\
    \ 手机和平板设备，并在核心设备（如 Google Nexus 5 2015 版）上建立存在感，https://ubports.com 的团队正在出色地维持\
    \ Ubuntu Touch 移动操作系统。\n\n![](img/fb76008333fb7aef815b136f9f1afe5f_8_1.png)\n\n\
    - **3 Plasma Unity 主题**\n  切换到 KDE Plasma 后对 Unity 的消亡感到难过吗？得益于 KDE 商店的“Loki and\
    \ Feel”部分，安装 Unity 主题变得很简单，该主题被称为 United Desktop。此主题运行在 KDE Plasma 5.9 上。\n\n\
    - **4 Dash to Dock Unity**\n  最后，自 Unity 退役宣布以来，流行的 GNOME 扩展 Dash to Dock 已收到许多新的贡献。即将移植的功能包括启动器背光和\
    \ expose。转到 GNOME 的过程变得没那么痛苦了。\n\n- **5 United GNOME 主题**\n  令人惊讶的是，已经有多个 Unity\
    \ 主题可用。最著名的是基于 United 8 的 United GNOME，可在 GitHub 上获取，提供了对桌面环境的忠实重现。与许多 GNOME 主题一样，United\
    \ GNOME 需要安装 GNOME Tweaks Tool。\n\n"
