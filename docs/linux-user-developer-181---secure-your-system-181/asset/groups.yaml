    ## 特性


    ## AWS for Linux


    ## 迈向无服务器化


    无服务器概念显然具有前瞻性。将复杂的应用程序拆分为微服务可以带来许多好处


    我们之前讨论的所有 AWS 服务都是传统的服务器概念。然而，最近亚马逊一直在大力推广“无服务器”模式。顾名思义，无服务器计算允许您构建和运行应用程序和服务，而无需管理服务器基础设施。Amazon
    CloudFront 处理事件。Amazon API Gateway 使开发人员能够轻松创建、发布、维护、监控和保护 API：它可以处理数十万并发的 API
    调用，并处理流量管理、授权和访问控制、监控以及 API 版本管理。API Gateway 是暴露 Lambda 所提供功能性的绝佳方式。Amazon SNS（Simple
    Notification Service，简单通知服务）和 Amazon SQS（Simple Queue Service，简单队列服务）提供进程间消息传递。SNS
    是一种用于解耦分布式微系统元素的发布/订阅消息系统，而 SQS 是一种通用的消息队列服务。AWS Step Functions 使您可以使用可视化工作流协调分布式应用程序和微服务的组件。从每个执行独立功能的单个组件构建应用程序，使您可以快速扩展和更改应用程序。Step
    Functions 是一种可靠的方式来协调组件并逐步执行应用程序的功能。Amazon Kinesis 使收集、处理和分析实时流数据变得轻而易举，从而促成及时洞察，使您能够对新信息做出快速反应。Kinesis
    让您能以成本效益的方式处理流数据，并灵活选择最适合应用程序需求的工具。借助 Kinesis，您可以将应用程序日志、网站点击流等实时数据摄取到数据库中，或使用这些数据构建自己的实时应用程序。


    那么，这在现实中可能是什么样子呢？想象一下，你有一些托管在 S3 中的网站代码，通过 CloudFront 提供服务。当用户点击页面上的某个功能时，这可能会向
    API Gateway 端点发起 REST API 调用，从而触发一个 Lambda 函数，从数据库（RDS、DynamoDB 或类似产品）检索信息，并通过
    API 网关返回给应用程序进行渲染。由于应用程序智能逻辑运行在 Lambda 函数中，您只需在函数执行期间为使用的资源付费——一旦完成，微服务实际上就消失了。AWS
    基础设施允许这些请求以巨大规模发生，在需要时提供巨大的容量，而在其他时间则保持节俭。


    ## 代码与交付


    您可能不会感到惊讶，有一系列服务可以帮助您管理和部署应用程序代码。AWS CodeCommit 提供安全且可扩展的 Git 仓库用于存储代码。AWS Codepipeline
    是一个持续集成和交付流水线，用于在每次变更时构建、测试和部署代码。AWS CodeStar 将许多 AWS 工具整合到一个统一的 UI 中，以便在一个地方轻松管理软件开发。它还完全集成了
    Atlassian JIRA 用于问题跟踪，以及一系列 AWS 工具，包括 Elastic Beanstalk——用于自动部署 AWS 基础设施（如 EC2
    实例、S3 存储桶和弹性负载均衡器）的编排服务。Amazon AWS 是一个极其先进的企业级产品，但通过面向初学者和爱好者的入门级服务（如 Lightsail）、深思熟虑的管理控制台、慷慨的免费套餐以及详尽的文档，它也是一个易于上手且乐趣十足的工具。


