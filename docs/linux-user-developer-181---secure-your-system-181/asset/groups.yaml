    3.65 上方的混沌区域。然而，很明显混沌并不会永远持续。事实上，在混沌再次恢复之前，有三条明显的秩序主导的带状区域。


    > 上方 这个简单的种群增长模型根据增长率的不同表现出截然不同的行为


    # 混沌理论


    ![](img/fb76008333fb7aef815b136f9f1afe5f_47_0.png)


    上方 分岔图被称为混沌的图景


    对混沌理论的讨论现在将我们带入奇异吸引子（strange attractor）的奇特世界。在数学上，吸引子是一个系统演化至的一个或多个值。因此，对于增长率小于
    3 的简单种群模型，吸引子是单个值；而对于略大于 3 的值，吸引子是成对的数值。长话短说——毕竟这只是分形和混沌的入门介绍——混沌系统的吸引子就是数学家所称的奇异吸引子，如果你绘制奇异吸引子，会发现它是一个分形图像。如果你更深入地探索混沌理论，可能会受到启发去阅读有关奇异吸引子的资料，但即使你没有完全理解它们，绘制奇异吸引子也是生成无限多复杂图像的一种有趣方式，并由此进一步强调这些数学领域令人震惊的本质。第一步是使用现成的软件，我们推荐
    Chaoscope，它是免费的，你可以从 http://www.chaoscope.org 下载。


    # 相互联系


    到目前为止，我们研究了分形几何和混沌理论。不过，为什么会选择将这两个看似独立的数学分支结合在一起，这是一个合理的问题。我们不会陷入对这个问题进行正式数学论述的困境，但尽管如此，我们将强调一些令人惊叹的事实，这些事实表明分形与混沌之间的共同点比第一眼看到的要多。


    一些令人惊叹的事实表明，分形与混沌之间的共同点比第一眼看到的要多


    第一个联系可能你已经注意到了。分形和混沌的一个共同点是两者都涉及同一种数学函数。这种函数被称为迭代函数（iterative function），它涉及对一个值执行某种数学函数，然后反复对结果执行相同的操作。其他许多联系则出乎意料得多。


    让我们想象一个高度放大的曼德博集合图像。现在考虑两个点，代表两个复数，一个位于曼德博集合内部（通常显示为黑色），另一个位于边界之外（通常显示为彩色）。这两个数几乎可以相同，也许只在第
    n 位小数上有所不同，但当执行迭代函数时，一个趋向于无穷大，而另一个则保持在零附近。换句话说，存在对初始条件的超敏感性——这正是混沌系统的定义。


    现在我们将分岔图置于聚光灯下——字面意义上的聚光灯。它可以被视为混沌的图像，但如果我们放大它的部分区域，就会发现它本身就是一个分形图像。


    但我们把最惊人的共同特征留到了最后。如果你将完整的曼德博集合图像直接显示在分岔图图像的下方，但分岔图的绘制方向与通常显示相反，即数字沿水平轴从左到右递减，你会发现一些令人惊讶的事情。如果你缩放分岔图，使得直到第一个分岔（即分裂）的部分占据了与曼德博集合主心形区域相同的水平空间，你会注意到其他特征也对齐了。特别是，你会发现分岔图中第一个和第二个分岔之间的部分与曼德博集合的第一个圆形
    bulb 对齐，第二个和第三个分岔之间的部分与第二个 bulb 对齐，等等。你还会发现，分岔图中秩序在混沌区域内回归的部分，对应于主曼德博集合“天线”上的曼德博集合的小副本。这些事实难道不足以让你相信数学真的可以是令人惊叹的吗！


    ![](img/fb76008333fb7aef815b136f9f1afe5f_48_0.png)


    上方 许多植物具有分形形式，但像罗马花椰菜（Romanesco broccoli）这样明显的情况很少见


    ![](img/fb76008333fb7aef815b136f9f1afe5f_48_1.png)


    # 集合预报


    因为天气是一个混沌系统，而又不可能以无限精度测量温度、风速、湿度等初始条件，所以长期天气预报很困难。然而，集合预报提供了解决方案，因为天气并不总是同样地多变。这种方法涉及用许多略有不同的初始条件值求解方程，并根据它们的一致程度分配置信系数。


    上方 Chaoscope 允许你玩弄奇异吸引子——它们本身是分形图像——这些吸引子描述了混沌系统


