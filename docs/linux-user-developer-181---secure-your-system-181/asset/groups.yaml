    **Mikael Stenvesson**


    **Chris:** Oh, dear. Sorry about that, Mikael. I''m glad you are still a subscriber.
    I''ve sent your issue to the keeper of the database to make sure that we flip
    that field and welcome you every month with a friendly newsletter. Unfortunately,
    you aren''t the only one. We''ve had a number of readers either complaining about
    being put on the subscriber list when they weren''t or new subscribers being marked
    as lapsed which they had just signed up for! Not a good result, but I''m told
    that in most cases this is because of the migration of account information from
    Imagine Publishing to Future plc''s system. The company can now gong through somewhat
    of a ''Borging process'' in the last eight months, where systems on either side
    have been


    discarded, transferred or merged in some fashion. Fingers crossed, we appear to
    be coming up the other side, but if you experience problems use the official channel,
    but email us linuxuser@futurenet.com and we''ll keep nudging people for you.


    # # A tip of the hat to Knoppix


    I enjoyed your Total Distro Toolkit [LU&D#179, p18], but I was disappointed to
    see Knoppix relegated to the back of the feature. You can''t cover live CDs without
    including Knoppix. It tends to be forgotten these days but it is the base on which
    all live CDs are built, in concept if not in code.


    **Phil Iwatairo**


    **Chris:** It''s a fair cop. We were actually reminded by Neil Bothwick, our disc
    editor, that we should be talking about the venerable live distro in glowing terms
    as he''s old enough to get all dusty-eyed about the first time he used it. (I
    used to call him Bothwick the Grey in the office until he found out and then I
    started going grey myself and realised it wasn''t that funny.)


    Knoppix ([www.knopper.net](http://www.knopper.net)) will be 16 years old in a
    few months, so we must tip our hats to its creator, Klaus Knopper, who realised
    he could put Linux software on a repair disk and get it to boot on most machines
    for troubleshooting duties. Given Microsoft''s previous animosity towards


    ![](img/fb76008333fb7aef815b136f9f1afe5f_94_1.png)


    Above Knoppix has been pronounced dead so many times it probably deserves a Monty
    Python sketch, but it''s very much alive and released its latest version, 8.0,
    at CeBIT earlier this year


    Linux, it''s ironic that many a Windows user owes his functioning operating system
    to a Linux buddy white-knighth in with Knoppix in hand. For those not aware, as
    well as being a really useful way to present software product demos, Knoppix makes
    a great Windows recovery CD for all sorts of duties, including reading, writing
    and restoring many types of file systems, editing the Registry, creating system
    backups and scanning for nasties.


