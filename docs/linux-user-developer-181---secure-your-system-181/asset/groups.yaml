    While IFS Fractals might make attractive images and have the appeal of the infinite,
    it’s not exactly surprising that they are self-similar at all levels of magnification
    given the way they are generated. However, as we turn our attention to the escape-time
    fractal, although we repeat some mathematical function over and over again, it’s
    not at all obvious that this process will generate genuine fractals. What’s more,
    this process produces fractals that are infinite in their nature but which have
    a degree of unpredictability as you zoom in on them.


    The most famous escape-time fractal is surely the Mandelbrot set – let’s see how
    it’s generated. Generating the Mandelbrot set involves working with complex numbers.
    As a quick reminder, these are numbers that have a real and an imaginary part;
    for example, 2 + 0.5i where i is the square root of minus 1. If this is still
    a mystery to you, we’ll have to leave you to read up on the subject, but it’s
    really not as difficult as you might fear.


    ## Picturing the Mandelbrot set


    To generate an image of the Mandelbrot set, we need to carry out a test on all
    complex numbers (actually, you only need to consider points between -2.0 and +0.5
    on the real axis and between -1.2i and +1.2i on the imaginary axis), marking the
    results on the complex plane. The test is simple: Start with zero, square it,
    and add the complex number being tested. If the result has a modulus of two or
    more (the modulus is the distance from the zero point on the complex plane), then
    the point isn’t in the Mandelbrot set. If it’s less than two, do the same again;
    that is, take that result, square it and add the value being tested. Again, if
    the result has a modulus of two or more, it isn’t in the Mandelbrot set; but if
    it’s less than two, carry on the calculation again and continue in this way. Some
    points, those that aren’t in the Mandelbrot set, soon exceed a modulus of two
    and head off towards infinity. Other points, those that are in the Mandelbrot
    set, remain close to zero however many times you repeat this operation (in practice,
    though, an arbitrary number of iterations, commonly 20, is used).


    > Writing code to draw the Mandelbrot set is simple enough, although providing
    a user interface to allow zooming is a bit trickier


    An image of the complete Mandelbrot set appears as the top-left picture in **Figure
    1** and it''s immediately obvious that this isn''t a simple geometric figure.
    And it just gets better. As you zoom in on areas near the perimeter of the Mandelbrot
    set, as we did to create the other pictures in **Figure 1**, more and more detail
    comes to light and the infinite intricacy and zigzag patterns unlike IFS fractals,
    you''ll never see exactly the same patterns at ever greater zoom levels, but you
    see the same sorts of star bursts, spirals and zigzag patterns and a few times,
    there''s a good chance that you''re seeing something that nobody has ever seen
    before.


    Writing code to draw the Mandelbrot set is simple enough, although providing a
    user interface to allow zooming is a bit trickier. In fact, while zooming would
    have to be achieved just by filling in cells to define an area of the complex
    plane, it''s an easy job to produce an Excel spreadsheet with a simple macro to
    do the job. While writing your own software would be an interesting and educational
    exercise, if you just want to generate impressive images of the Mandelbrot set,
    you''d be better off getting your hands on some software. One of the most respected
    Linux packages is called Gnofract4d <http://edyoung.github.io/gnofract4d/> and
    it''s free. As well as the Mandelbrot set, it allows you to explore the closely
    related Julia set; plus there''s the option to define your own formulae, which
    provides the opportunity to investigate any imaginable escape-time fractal. And
    if you want to explore 3D fractals (both IFS and escape-time), the free Mandelbulber
    package (<http://www.mandelbulber.com>) is what you need.


    ## Chaos theory


    Chaos theory concerns systems that are described as having super-sensitivity to
    initial conditions – let''s see what this means in practice. A very simple mathematical
    model of the growth of a biological species such as a fruit fly is represented
    by the formula $\mathbf{x}^{\text{t+1}}=a\ \mathbf{x}^{\text{t}}(1-\mathbf{x}^{\text{t}})$,
    where $\mathbf{x}^{\text{t}}$ is the population in the current generation, $\mathbf{x}^{\text{t+1}}$
    is the population in the next generation, and $a$ is a growth rate. The population
    is what mathematicians call ''normalised to 1'', so all values will be between
    0 and 1, but it can always be converted to a real-world population by multiplying
    by a constant. If you want to try this model out for a few generations, you can
    easily do so with a few lines of code or an Excel workbook to get graphs like
    the ones reproduced in **Figure 2**.


    > "A common factor between fractals and chaos is that both involve the same sort
    of mathematical function"


    - **Fractal landscapes**

    Because so many natural forms – including mountains, coastlines, clouds and trees
    – have fractal properties, this enables the production of computer-generated images
    that look realistic while requiring only a small amount of data. This technique
    has been used in film production, e.g. when an alien-looking sci-fi landscape
    is required, and it''s commonplace in games production.

