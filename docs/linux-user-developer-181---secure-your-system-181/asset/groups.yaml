    # Modelling the Mac


    To get the dimensions of the Macintosh Classic correct, Hermann used a prototype
    made from his children''s LEGO and worked up a 3D model in LEGO''s Digital Designer
    software ([http://ldd.lego.com].)


    # Components list


    +   - LEGO Digital Designer

    +   - LEGO bricks

    +   - e-paper display by Embedded Artists

    +   - Raspberry Pi Zero (but suggest Pi Zero W now)

    +   - Power supply

    +   - Tiny retro Macintosh stickers

    +   - Dremel

    +   - Cables (male-to-female)


    # With added dongle


    The whole project is powered by a Raspberry Pi Zero, which has had a low-profile
    Wi-Fi dongle added for remotely updating the system.


    # Docker base


    As the mini-Macintosh Classic was a gift to a friend, Jannis used a Docker base
    image from resin.io to set up the Raspberry Pi and enable him to remotely update
    the information, if needed. The display currently shows such information as the
    age of his friend''s daughters in days, the chance of rain and the current temperature.


    # E-paper on display


    Jannis used a 2.7-inch e-paper display from Embedded Artists, which posed a few
    challenges, one being that the display board was much bigger than the display.


    ![](img/fb76008333fb7aef815b136f9f1afe5f_70_2.png)


    ![](img/fb76008333fb7aef815b136f9f1afe5f_70_3.png)


    **Far left** The Raspberry Pi Zero W was yet to be launched when Jannis started
    his project, which is why there''s a USB Wi-Fi dongle attached to the Pi Zero
    board in this photo. If you''re trying this project now, he recommends using just
    the Pi Zero W


    **Left** The project wasn''t all plain sailing: Jannis had to pull out a Dremel
    when he realised that he''d created a model that was exactly one brick too wide'
