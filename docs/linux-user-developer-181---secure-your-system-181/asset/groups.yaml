    ## 克莱姆的完美笔记本


    近几个月来，克莱姆·勒费弗尔（Clem Lefebvre）提到了硬件“合作及 Linux Mint 笔记本生产”的可能性，但这一设想尚未实现，因此我们询问了他心目中完美的
    Mint 笔记本或 Mint 盒子是什么样的。


    “嗯，这取决于用户群体。对许多人来说，完美的笔记本既便宜又拥有高配置。[...] 对我来说，价格不是很重要，完美的笔记本是我享受操控的对象，配有我喜爱使用的键盘和屏幕。我长期以来都很喜欢索尼
    TZXP，目前我则喜欢使用苹果 MacBook Pro 进行工作，”勒费弗尔表示，Linux Mint 从合作伙伴关系上并没有赚取什么利润，或者至少不是很多。“这真的不是我们商业模式的一部分。我们不是制造商，这不是我们喜欢做的事情，而且我们可能也不擅长做这个。如果我们想通过笔记本赚钱，我们会为一款廉价的批量生产笔记本贴牌，那种你在任何地方都能买到的产品。”


    然而，勒费弗尔对 Linux Mint 与 Compulab 在 MintBox 上的合作（见第 31 页）感到极其兴奋：“这些设备是独一无二的：我们终生都会自豪地将它们视为成就。”尽管
    Compulab 盒子的利润率很低，但这对于勒费弗尔来说并不是关于金钱的问题，他只是纯粹地享受这个过程。至于他们是否有一天能制造自己的笔记本，他在这一点上似乎既充满憧憬又略带怀旧：“如果我们有一天做到了，它们可能会非常特别，非常令人兴奋，我希望它们也能相当独特。”


    ![](img/fb76008333fb7aef815b136f9f1afe5f_12_0.png)


    上方：Mint 开发团队与 Compulab 合作开发了一系列微型电脑。无风扇的 MintBox 迷你电脑尺寸最小，长仅 10.8 厘米。


    他决定专注于该项目，并在每个新版本中不断完善它。自成立以来，它不断成长，尽管目标从未真正改变，但我认为其背后的原则保持不变。


    ## Mint 在存在十多年期间，其愿景是否发生了变化？


    使命依然相同。2006 年，尽管对于新手用户来说 Linux 显然还有改进空间，但我坚信 Linux 已经是很多人最好的桌面操作系统。Ubuntu 是最好的发行版，因此通过在其基础上添加改进，我的主要目标仅仅是随着每个新版本的发布做得越来越好。这在今天依然成立：我们专注于自身，专注于我们要实现的目标以及用户的需求，我们的首要目标始终是发布一个更好的版本。


    一个关键原则是让功能开箱即用。无论你是新手还是经验丰富的用户，每个人都喜欢功能直接可用。如果你必须通过折腾才能让某样东西工作，那么它要么被修复，要么被移除。


    另一个关键原则是，你，作为用户，是核心，没有任何东西比你的用户体验更重要。当它运行在你的电脑上时，Linux Mint 不是“我们的”操作系统；它是你的。它必须为你工作。


    > 当它运行在你的电脑上时，Linux Mint 不是“我们的”操作系统，它是你的。它必须为你工作。


    当然，自由软件和许可对我们来说很重要，其他哲学层面也是如此，但与少数其他发行版不同，实用主义是关键。我们不是为了说教任何人：我们的首要目标是赋能我们的用户。


    ## 去年你公开反对了一些 Linux 发行版对 Linux Mint 散布恐惧、不确定性和怀疑（FUD）。这些天你的 FUD 配额如何？


    我没时间也没耐心去理它，我告诉我的团队不要去回应。虽然 FUD 旨在损害你的声誉，但它通常会产生相反的效果，并有助于项目的增长。首先，一旦人们明白发生了什么，他们会表现出大量的支持，并积极着手遏制这种行为。其次，它会让很多人做出反应，突然间所有人都在谈论你，甚至是在
    Linux 社区和通常能触达的受众之外。每次遭遇大规模的 FUD 攻势，我们都观察到增长率的显著上升。


    话虽如此，这当然也是我们面临的问题，因为它是一个巨大的打击。[...] FUD 袭来时，提醒了我们有些人是多么阴暗、恶毒和无聊。[...] 当我们看到 FUD
    时，我们的首要任务是忽略它。面临最大风险的是动力的丧失或时间的浪费，这是每个开发周期中最需要的两种基本资源。我们只在真正需要时才回应 FUD，在这些罕见的情况下，我们会确保点名并谴责那些帮助传播
    FUD 的人。


    **你认为流行的 Linux 发行版是否正在彼此之间筑起太多壁垒？**


    不，我不这么认为。我最近唯一稍微担忧的是 Snap。我不认为发行版依赖底层的 Ubuntu 商店是可以接受的。我也担心它可能一夜之间消失。[...] 除此之外，我真的不那样看。


    ## 分支与交叉


    Linux Mint 的 X-Apps 是 GNOME 应用的分支（见下文“X-Apps 的哲学”）


    ![](img/fb76008333fb7aef815b136f9f1afe5f_13_0.png)


    注：文本编辑器 Xed 是 MATE 的 pluma 的分支，而 pluma 本身又是 Gedit 2 的分支。


    如今，标准更多地是由势头而非共识强加的，但我不能抱怨最终产品的质量，并且我很高兴看到越来越多的技术变得通用并被大多数发行版采用。其中很多来自 GNOME 和
    Fedora 开发者，我个人对此表示欢迎。GNOME 本身正变得越来越像一个产品，其组件在自身环境之外的适用性越来越低。这对其他项目是一个问题（X-App
    部分解决了这个问题，见左侧），但这也是 GNOME 自身的改进，并极大地启发了他人。


    在我们这边，我们正在开发越来越多的跨发行版项目。这对所有人都有帮助。当然它帮助了其他发行版，但这也帮助我们的项目获得势头、bug 报告、拉取请求以及整体更好的质量。无论是
    Cinnamon、X-Apps、新的 Slack 登录界面还是 Blueberry……我们做的许多事情都被他人使用，而这些其他发行版的开发者也在使这些项目更加成功方面发挥着作用。


    **Spices 网站（用于 applet、desklet 和主题）背后的思路是什么？**


    Spices 是 Cinnamon 的插件：applets（放置在面板上的小组件）、desklets（放置在桌面上的小组件）、主题（改变 Cinnamon
    外观）和扩展（改变 Cinnamon 的工作方式）。你可以在系统设置内部安装 Spices，但我们需要一个网站让人们能够评论和“点赞”Spices。一个 Spice
    获得的点赞越多，其分数就越高，Cinnamon 用户在列表中看到的排名就越靠前。


    我们请克莱姆解释 X-Apps 项目的开发理念，这是一个为 GTK 桌面环境开发通用应用程序的项目：


    > “X-App 项目的想法是开发一套通用的库、工具和应用程序，它们不仅能在特定的桌面环境中很好地工作，而且能在所有环境中很好地工作。”


    鉴于 Linux Mint 支持四种桌面环境（其中三种基于 GTK：Cinnamon、MATE 和 Xfce），且每个环境都相当不同，X-App 项目使 Mint
    能够减少对 GNOME 应用程序的依赖，因为 GNOME 应用程序专注于与 GNOME Shell 的集成并遵循特定于 GNOME 的用户界面指南。


    这种方法还有其他好处：“X-App 也是跨发行版的，因此在 Linux Mint 之外获得了势头，”克莱姆说。“从开发角度来看，这使得 Linux Mint
    团队能够针对改进和新功能进行工作，这些功能的受众远大于只针对单个桌面或单个版本的情况。”


    **你们是否考虑过为第三方 Spices 采用随意付费模式，就像 Elementary OS 那样？**


    没有。首先，我不确定这是否适用于 Spices。它们是针对我们 API 的开源实现，使用 JavaScript 编写。其次，我们通过包括 GitHub 代码审查的流程自行分发它们。第二，我不倾向于将商业方面和开发混合在一起。我们的模式是免费分发软件，并吸引那些对自己所做事情充满激情的开发者。我们与那些乐在其中且动机非商业化的人合作。我们不悬赏，我们不让人道捐款决定设计方向，在所有涉及金钱的地方，我们都确保它不会干扰我们的关系以及开发者工作的方式。甚至我们“支付”开发者的方式也是这样设计的，使得他们所做的与他们收到的金钱之间没有直接关系。我们不希望金钱来规定甚至影响我们要做什么；我们希望事情发生是因为开发者想要做它，或者因为团队的决策。


    **是否有任何用户建议成为了让你当时感到惊讶的功能？**


    是的，当然。在每个开发周期中都是如此。从来没有一个版本是“完全”按照我们计划的功能集发布的。我们经常推迟计划在开发周期结束时未准备好的一部分内容（我们有一个很长的待实现的好点子积压），我们也包括在周期期间刚好落地且突如其来的实现和新功能。这种情况总是发生……总有人说点什么。


    ## X-Apps 的哲学


    ![](img/fb76008333fb7aef815b136f9f1afe5f_13_1.png)


    上方：Xviewer 分支自 GNOME 的 Eye of GNOME，并正在快速发展。在 18.2 版本中，其工具栏重新设计，现在支持深色主题。


