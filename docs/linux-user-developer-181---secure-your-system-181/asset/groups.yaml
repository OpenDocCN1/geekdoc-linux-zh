    or we see something we like and it inspires us, or somebody comes to us with an
    idea or even an implementation, and we find it great, and it gets in.


    It doesn''t really matter whether something was planned or not. If it''s great,
    it doesn''t matter where it comes from, it gets in. If it''s not ready, unless
    it''s necessary, it doesn''t matter how long it''s been planned, it''s removed
    and postponed for another release. What matters is that each new release is better
    than the previous one.


    # The idea of a laptop edition of Mint has been hanging about for years, but still
    seems popular (http://bit.ly/LaptopMint). Has that changed your approach to development
    in recent years?


    Yes and no. Our core audience remains the same and we''re dedicated to what we
    do. We know who we are, and who our users are. We''ve no interest in working on
    anything else or focusing on mobile devices. I don''t think we''ll ever have a
    ''laptop edition''. That said, we need to acknowledge changes in the hardware
    industry and respond to growing demand when it comes to trends and new components.
    For instance, we''ve seen the emergence of HIDPI screens, touch screens and accelerometers,
    so we do our best to support these new technologies the best we can.


    # Linux Mint is an obvious choice for a gamer''s OS. What''s your feeling on Linux
    gaming?


    I''d like to see more editors commit to supporting Linux as a platform. Valve,
    along with technologies such as Unity, has made this much easier than before and
    a gaming studio can now target Steam OS and provide its games to Linux users.
    All it takes is a little increase in testing and support. It''s a real pleasure
    to see quality studios such as Paradox Interactive pioneer that move and I hope
    many other AAA games editors will follow.


    # How has development changed for you?


    Development is more and more exciting; we''re using amazing development tools
    (I''ve a really soft spot for Git here) and communication tools. There''s a great
    ambience within the team. It''s hard to give you a number because there''s no
    such thing as ''being part of the team''; I can definitely think of names and
    start enumerating, but people invest more or less time than others, focus on different
    aspects depending on their tastes and motivations. There''s currently 21 people
    in our development slack team, so I guess that''s the upper limit and we''ve got
    less than 20 developers. Then again, most of what we do works outside of Mint
    so we get contributions from other distributions and also from our community.


    # How do you balance the pressures of such a massive project with life outside
    of ''work''?


    Oh, that''s easy. You just don''t sleep! No, I think that''s something you improve
    over time. I''m disciplined when it comes to commitment and ambition. I make sure
    we don''t take more than we can chew. We never give ETAs, we never talk about
    projects we''re not sure we complete or features we''re not sure to deliver. At
    times we had to make tough calls to prioritise what we wanted and to define who
    we really were and what was important to us. The decisions to discontinue our
    LXDE edition or to stick to LTS ([Ubuntu releases]) come to mind for instance.
    These aren''t easy to make, but they help us grow and they help us work on what
    we really want to achieve.


    And then of course there''s experience. This project is more than ten years old,
    so many aspects got automated and there''s a certain routine to it. We''re learning
    all the time, about our distribution of course and how to improve it, but also
    very much about ourselves, how we work, how we do things and we improve that a
    lot too.


    From a personal point of view, I''m still working late at night and there''s no
    such thing as a weekend or a holiday without a computer, but I can''t complain.
    I love what I do, who I do it with and who I do it for. I can''t wait to do more
    so it''s not really ''work'', I guess. You also get better at managing motivation,
    passion and productivity, better at identifying what''s important, what''s urgent,
    how to tackle issues.


    ![](img/fb76008333fb7aef815b136f9f1afe5f_14_0.png)


    Above Support for Bluetooth is improved in Linux Mint 18.2 and transferring files
    via Bluetooth (using the OBEX protocol) now works out of the box


    ![](img/fb76008333fb7aef815b136f9f1afe5f_14_1.png)


    Left: You know you''ve made it when Mr. Robot, the hit techno-thriller, wants
    to use your distro on-screen. Clém Lefebvre has hinted that Linux Mint will make
