    # 分形几何与混沌理论的乐趣


    加入我们，开启一段发现之旅，探索分形与混沌那个奇异、美丽且无穷的世界。


    ![](img/fb76008333fb7aef815b136f9f1afe5f_43_0.png)


    **上方图片** 如果二维的曼德博集合（Mandelbrot set）令人着迷，那么它的三维近亲曼德博尔布（Mandelbulb）则更加引人入胜。


    据慈善机构“国家读写能力协会”（National Numeracy）称，在英国承认自己不会做数学在社交上是可以被接受的，甚至有些人将其视为一种荣誉，用以将自己与疯狂科学家、书呆子以及社交笨拙的人区分开来。因此，英国在国际数学排名中仅列第
    26 位（由经济合作与发展组织 OECD 发布）也就不足为奇了。这无疑是一个令人沮丧的统计数据，因为数学技能对于个人的日常生活、就业机会以及国家在国际市场上的表现至关重要。


    虽然我们确信 Linux 用户是社会中对数字较为精通的人群之一，但对于我们的读者中有多少人真正觉得数学令人兴奋，我们的信心就不那么足了。不过，情况未必如此。为了进一步拓展你们的发现之旅，并证明数学确实可以很有趣，我们介绍了一个真正迷人的数学分支，你可以通过编程或使用各种免费软件深入探索。这个数学分支就是分形几何，以及与之密切相关的混沌理论领域。如果你对此感到陌生，请准备好惊叹吧。


    ## 分形几何


    分形几何是数学中一个相对较新的分支，其起源可以追溯到 20 世纪 60 年代，当时数学家贝努瓦·曼德博（Benoît Mandelbrot）提出了一个问题：“英国的海岸线有多长？”事实证明，这个问题的答案取决于你用来测量的尺子的长度——尺子越短，海岸线就越长。这是因为海岸线像许多自然形态一样，在更小的尺度上拥有越来越多的细节。这在数学术语中称为“多尺度自相似性”，也是分形的简单定义。对于现实世界的物体来说，这种自相似性在分子和原子层面会耗尽，但真正的数学分形在所有层级上都表现出精确或近似的自相似性。换句话说，当你不断放大时，它会永远持续下去。


    最初的几种分形是在“分形几何”这个术语被创造之前就被设计出来的，直到数学家在 20 世纪 60 年代和 70 年代将目光转向分形时，它们才被正式认可。一个经典的例子是谢尔宾斯基垫（Sierpinski
    gasket），这是一种被称为迭代函数系统（IFS）分形的分形类型。它只需几行代码就能轻松生成。首先，从一个实心的（即填充的）等边三角形开始。现在，通过连接三条边的中点，将其分成四个较小的等边三角形，并移除中间的那个。接下来，对剩下的三个实心三角形做同样的操作，将它们各自分成四个较小的三角形并移除中间的那个。以这种方式继续，直到你获得一种你觉得令人愉悦的效果，或者直到你感到厌烦为止，但要记住，要获得一个真正的谢尔宾斯基垫，你必须永远持续下去。


    从谢尔宾斯基垫出发，你可能会想深入研究其他 IFS 分形，包括谢尔宾斯基地毯（Sierpinski carpet）、谢尔宾斯基五边形（Sierpinski
    pentagon）、科赫雪花（Koch snowflake）和龙曲线（dragon curve）；你会发现网上有大量的相关信息。如果你想要尝试一些三维实体建模，甚至还有一些分形的三维版本，包括谢尔宾斯基站（Sierpinski
    pyramid）和门格海绵（Menger sponge）。


    或者，有很多免费的有时甚至是开源的 Linux 软件可以生成这些以及其他 IFS 分形。一个好的起点是免费图像操纵软件包 GIMP（https://www.gimp.org）的
    IFS Fractal 插件，你可以在图像窗口菜单下的“滤镜 > 渲染 > 自然 > IFS Fractal”中找到它。


    ![](img/fb76008333fb7aef815b136f9f1afe5f_44_0.png)


    **上方图片** 当你放大曼德博集合时，你会看到更多的细节，并且这个过程会永远持续下去。


    除了生成看起来非常几何化的 IFS 分形外，该软件还允许你实验不太规则的分形，这些分形虽然定义严谨，但可以产生看似自然的形式，如树木和植物。


    虽然 IFS 分形可能生成令人愉悦的图像并具有无穷的魅力，但鉴于其生成方式，它们在所有放大级别上都表现出自相似性也就不足为奇了。然而，当我们把注意力转向逃逸时间分形（escape-time
    fractal）时，尽管我们反复执行某个数学函数，但该过程会生成真正的分形这一点并不显而易见。更重要的是，这个过程产生的分形本质上是无限的，但当你放大它们时，它们具有一定程度的不可预测性。


    最著名的逃逸时间分形无疑是曼德博集合——让我们看看它是如何生成的。生成曼德博集合涉及对复数的运算。快速回顾一下，复数是具有实部和虚部的数；例如，2 + 0.5i，其中
    i 是 -1 的平方根。如果这对你来说仍然是一个谜，我们只能建议你自行阅读相关主题，但实际上它并没有你想象的那么难。


    ## 描绘曼德博集合


    要生成曼德博集合的图像，我们需要对所有复数（实际上，你只需要考虑实轴上 -2.0 到 +0.5 之间以及虚轴上 -1.2i 到 +1.2i 之间的点）执行测试，并将结果标记在复平面上。测试很简单：从零开始，将其平方，然后加上正在测试的复数。如果结果的模（modulus，即复平面上距离零点的距离）大于或等于
    2，那么该点不在曼德博集合中。如果它小于 2，则再次执行相同的操作；也就是说，取该结果，将其平方并加上正在测试的值。同样，如果结果的模大于或等于 2，它就不在曼德博集合中；但如果它小于
    2，则再次执行计算并以此方式继续。有些点，那些不在曼德博集合中的点，很快就会超过模 2 并趋向无穷大。其他点，那些在曼德博集合中的点，无论重复多少次此操作，都会保持在零附近（不过，在实践中，通常会使用任意次数的迭代，通常为
    20 次）。


    > 编写代码绘制曼德博集合并不难，虽然提供允许放大的用户界面会稍显棘手。


    完整的曼德博集合图像出现在 **图 1** 的左上角，一眼就能看出这不是一个简单的几何图形。而且它只会越来越好。当你放大曼德博集合边缘附近的区域时（正如我们在创建
    **图 1** 中的其他图片时所做的那样），越来越多的细节会显现出来，与 IFS 分形不同，无限精细的锯齿图案意味着你永远无法在更高等级的放大中看到完全相同的图案，但你会看到类似星爆、螺旋和锯齿图案的东西，并且偶尔，你很可能会看到别人从未见过的景象。


    编写代码绘制曼德博集合并不难，虽然提供允许放大的用户界面会稍显棘手。实际上，虽然放大只需要通过填充单元格来定义复平面上的某个区域来实现，但创建一个带有简单宏的
    Excel 电子表格来完成这项工作也是轻而易举的事。虽然编写自己的软件会是一个有趣且有教育意义的练习，但如果你只是想生成令人印象深刻的曼德博集合图像，最好还是使用现成的软件。最受尊敬的
    Linux 软件包之一是 Gnofract4d <http://edyoung.github.io/gnofract4d/>，它是免费的。除了曼德博集合外，它还可以让你探索密切相关的朱利亚集合（Julia
    set）；此外，还有定义自己公式的选项，这提供了研究任何可想象的逃逸时间分形的机会。如果你想探索三维分形（包括 IFS 和逃逸时间），免费的 Mandelbulber
    软件包（<http://www.mandelbulber.com>）是你所需要的。


    ## 混沌理论


    混沌理论研究那些被描述为对初始条件具有超级敏感性的系统——让我们看看这在实践中意味着什么。一个简单的生物物种（如果蝇）生长数学模型由公式 $\mathbf{x}^{\text{t+1}}=a\
    \mathbf{x}^{\text{t}}(1-\mathbf{x}^{\text{t}})$ 表示，其中 $\mathbf{x}^{\text{t}}$
    是当前世代的种群数量，$\mathbf{x}^{\text{t+1}}$ 是下一世代的种群数量，而 $a$ 是增长率。种群被数学家称为“归一化到 1”，因此所有值都在
    0 和 1 之间，但总是可以通过乘以常数转换为现实世界的种群数量。如果你想在这个模型中尝试几代人的情况，你可以很容易地通过几行代码或 Excel 工作簿来做到这一点，从而获得类似
    **图 2** 中重现的图表。


    > “分形和混沌之间的一个共同因素是，两者都涉及同一种类型的数学函数”


    - **分形景观**

    由于许多自然形式——包括山脉、海岸线、云和树——都具有分形特性，这使得能够生成看起来真实但只需少量数据的计算机生成图像。这种技术已被用于电影制作，例如当需要外观像外星人一样的科幻景观时，它在游戏制作中也很常见。


