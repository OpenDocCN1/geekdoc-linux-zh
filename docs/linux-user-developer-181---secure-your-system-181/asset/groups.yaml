    通过攻破您的密码或安装恶意脚本来获取对机器的访问权限，尝试获得 root 访问权限，从而可以执行更具危害性的操作。Rootkit 是一种旨在为恶意目的获取非法
    root 访问权限的脚本或程序。


    其中最受欢迎的 rootkit 扫描器之一是 chkrootkit。您可以使用 `sudo apt install chkrootkit` 命令轻松地在终端中安装它。安装完成后，您可以使用
    `sudo chkrootkit` 命令调用它。该工具旨在扫描您的机器上已知的一系列 rootkit 和恶意软件。运行 `chkrootkit -l` 命令可以获取该工具默认运行的所有测试列表。请记住，根据系统配置和可用资源的不同，此过程可能需要一些时间。


    Rootkit 常用的一种技巧是打开端口，这将允许攻击者进入您的系统。您可以使用 `nmap` 实用程序扫描系统中的开放端口。您可以指定一个范围来扫描端口，也可以使用
    `nmap -p 1-65535 localhost` 扫描所有端口。`nmap` 的全部功能过于庞大，无法在此一一列举。请参阅手册（使用 `man nmap`
    获取有关充分利用该工具的详细信息）。


    作为一种进一步的预防措施，您还必须安装 ClamAV 应用程序，它可以检测特洛伊木马和病毒。如果您的设置涉及 Windows 和 Linux 机器，还建议安装
    Linux Malware Detect，这是一款针对 Linux 的恶意软件扫描器，甚至允许用户提交可疑恶意软件以供审查。


    ## 识别问题


    ### 使用 Lynis 进行安全审计


    Lynis 以前被称为 *rkhunter*，是 Linux 上最流行的安全审计工具之一。尽管深受系统管理员的喜爱，但如果您正在运行服务器或通过 SSH 允许远程访问，它也是一项必备工具；其易用性和操作的简便性也可以帮助家庭用户。


    Lynis 将研究已安装应用程序的配置文件，报告没有密码的用户账户，检查防火墙规则，识别过期的 SSL 证书，等等。总体而言，该工具将在主机上运行数百项测试，但它不需要任何额外软件。它不会自动解决问题，而是生成一份报告，列出所有已识别的问题，并提供有关如何更有效地加强系统安全的建议。


    您可以通过 `git clone https://github.com/CISOfy/lynis` 获取 Lynis 的最新版本，这将把最新版本获取到 *lynis*
    目录中。该工具不需要安装，因此您可以进入 *lynis* 目录并运行 `./lynis_audit_system` 命令开始使用。在运行扫描时，Lynis
    会将每个执行测试的结果输出到屏幕上，但您需要自己解释结果并采取适当的措施。


    ![](img/fb76008333fb7aef815b136f9f1afe5f_20_0.png)


    ![](img/fb76008333fb7aef815b136f9f1afe5f_20_1.png)


    ![](img/fb76008333fb7aef815b136f9f1afe5f_20_2.png)


    ## 04 自定义规则


    Gufw 允许您调整默认规则，这在您使用非默认端口运行服务时特别有用。切换到“简单”选项卡，它与“预配置”选项卡类似，但不同于应用程序的下拉列表，它允许您手动指定服务的端口号。您可以添加特定端口（23）或端口范围（11200:11299）。


    ## 05 更多自定义


    如果您需要根据需求进行细微调整，高级选项卡非常有用——例如，如果您只希望允许特定 IP 地址范围内的计算机通过特定接口访问 SSH 服务。由于防火墙按升序匹配流量规则，您还可以手动为您的自定义规则分配一个编号，以指定其在防火墙规则列表中的位置。


    ## 06 监控传入流量


    Gufw 的一个特别有用的功能是实时监听报告。添加规则后，切换到“报告”选项卡，该选项卡列出了所有流量以及其他相关信息，如协议、端口、IP 地址和应用程序。您可以使用这些信息来调整规则，特别是针对传入流量。此外还有“日志”选项卡，它跟踪
    Gufw 的活动，有助于识别任何可疑活动。


    ## 功能


    ### 保护您的系统


    **快速提示**

    **手动挂载**


    在新的 Linux 系统上要做的事情之一，是禁用 USB 闪存盘等可移动设备的自动挂载。


    ![](img/fb76008333fb7aef815b136f9f1afe5f_21_0.png)


    - **右侧**：您的系统日志文件可以分为四大类：应用程序日志、事件日志、系统日志和服务日志

    - **横向**：完成扫描后，Lynis 将提供若干建议，您可以将其纳入以改进系统安全性


    Linux 机器的安全不仅仅是安装软件的问题。它需要积极参与，以监控由众多工具和应用生成的日志文件和其他报告。您还必须解释这些报告，并在必要时采取进一步措施来威慑攻击者。除非您愿意做所有这些工作，否则您的机器很快就会成为各种可疑活动的宿主。但不要恐慌。您可以通过自动化其中一些任务来提供帮助。


    ### 自动化系统监控


    网络分析器（通常称为嗅探器）是一种收集和捕获所有网络流量的程序。您可以使用它来确定是否有恶意实体正在攻击或已经攻击您的网络。当您的机器设置为混杂模式时，网络接口将收集通过该接口传递的所有网络流量。


    您可以使用 ngrep 工具实时监视您的网络。它甚至允许您根据特定参数分离数据包。使用它的最简单方法是在终端中运行 ngrep 命令来监视通过网络传递的所有流量。如果您以前从未使用该工具，最好最初先研究
    ngrep 的输出。稍后您可以开始尝试不同的过滤器，这些过滤器允许您基于主机、类型、协议或方向（流量方向）聚焦于特定数据包。您可以使用：`ngrep port_number
    > /tmp/ngrep-log` 将流量详情转储到日志文件中，以便稍后研究。


    ### 创建 cron 作业


    Cron 是一个基于时间的调度器，您可以使用它在特定时间和日期运行定义的操作。它通常用于执行例行任务，如备份。每个计划操作都称为 cron 作业。您可以创建这样的
    cron 作业，通过安排 lynis 和 chkrootkit 每天运行，以确保您的系统未被入侵。您可以使用 `crontab -e` 创建 cron 作业。这会在文本编辑器中打开
    crontab 文件，然后您可以添加任务。Cron 作业的语法为：分钟 小时 日 月 星期。也就是说，您可以定义每个任务应运行的分钟、小时、日期、月份和星期几。最好安排
    chkrootkit 每天运行。您可以在 crontab 文件中添加以下内容，将其配置为每天凌晨 1 点运行：


    ```

    0 1 * * * /usr/sbin/chkrootkit > /tmp/chkrootkit_log 2>&1

    ```


    ![](img/fb76008333fb7aef815b136f9f1afe5f_21_1.png)


    ### 处理日志文件


    您的 Linux 系统、众多的应用程序和工具，以及许多日常操作（如软件管理）都会生成日志文件。这些文件有三个主要用途。它们可以帮助您排除系统故障，例如软件安装失败的原因。其次，日志可以作为安全事件的早期预警系统。从安全角度来看，如果您确信您的系统已被入侵，日志可以帮助您进行取证调查。


    只有当您熟悉系统在正常操作期间日志的样子时，才能依赖日志来确定某些事情出了问题。至关重要的是能够区分正常活动与有人试图攻击系统。只有当您不仅收集日志，还定期研究它们时，才能做到这一点！


    在处理日志时，您还必须针对诸如日志记录频率等各种因素制定完善的策略。您还应定期备份日志文件，因为将当前日志与存档进行比较可以帮助您检测恶意活动。同时，您不能无限期地保留日志文件，因为随着时间推移，它们可能会占用大量空间。


    ### 管理日志文件


    您可以使用 logrotate 轻松管理日志文件。它支持日志文件的自动轮换、压缩和邮件发送，并可以通过编辑 /etc/logrotate.conf 文件进行配置。logrotate
    实用程序允许您定义轮换频率（每周或每月）以及每个日志使用的日志文件数量。您还可以为不同的日志文件设置不同的参数，并定义日志是否根据其大小进行轮换，以及轮换日志文件的存储周期。


    例如，如果 output.log 文件的轮换设置为 10，logrotate 实用程序将自动创建 output1.log、output2.log，依此类推，直到
    output10.log，而最新的日志将存储在 output.log 中。手册页有更多详细信息，由于该工具已存在很长时间，您很容易在互联网上找到详细的说明和示例。


    另一个流行工具是 logcheck。它旨在定期扫描所有日志——它从上次的停止处开始扫描，节省了宝贵的时间。该高度可配置的工具允许您定义检查频率、要检查的日志文件、什么被认为是正常的以及什么不是，以及将警报发送到何处。您必须定义工具可以忽略的正常行为，否则您将被警报淹没。


    ### 搜索日志文件


    日志监视员武器库中的另一个重要工具是 swatch。它通过查找指定的正则表达式并在找到匹配项时立即通知您来工作。


    调用 swatch 的用户必须创建一个 ~/.swatchrc 文件，该文件描述忽略和监视指令以及通知电子邮件地址。监视器条目是当找到匹配项时您希望收到警报的关键字列表。为了充分利用
    swatch，您必须熟悉正则表达式。此外，如果您希望电子邮件发送到 Gmail 等外部服务，您的系统必须配置为同时向本地用户和互联网域发送邮件。


    配置完成后，您可以使用 swatch 监视多个日志中的关键关键字。


    ![](img/fb76008333fb7aef815b136f9f1afe5f_22_0.png)


    **存储配额**


    对于多用户系统，您应启用配额并将用户限制在固定的磁盘空间量内。这可以防止如果用户账户被入侵时的滥用情况。


    ![](img/fb76008333fb7aef815b136f9f1afe5f_22_1.png)


    ![](img/fb76008333fb7aef815b136f9f1afe5f_22_2.png)


    ## 必备浏览器扩展


    当然，下载扩展时必须谨慎。幸运的是，Firefox 和其他 Web 浏览器有几种有用的扩展可用。


    - **HTTPS Everywhere**：适用于 Firefox、Chromium、Opera 和许多其他浏览器，它确保与网站的所有通信都经过 SSL
    加密。

    - **Ghostery**：此扩展禁用了 Facebook 和 Google 等网站上的跟踪器，使得即使您离开网站后数据也不会被收集，这正日益成为常态。

    - **NoScript**：禁用网页上的所有脚本，如 Flash、Java、JavaScript 和其他可执行内容。它允许您创建受信任网站的白名单，例如您的银行，但需要适应。

    - **WOT**：Web of Trust 维护着一个受信任网站的列表。对于您访问的每个网站，绿色图标表示可信网站，黄色提示您要谨慎，红色表示潜在危险。

    - **BetterPrivacy**：SOS 是包含更详细信息（包括您的浏览偏好）的“超级 Cookie”。使用 BetterPrivacy，您可以选择以固定时间间隔删除
    LSOS。


    '
