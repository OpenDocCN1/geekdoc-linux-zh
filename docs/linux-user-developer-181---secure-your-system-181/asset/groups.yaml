    # 教程


    # Linux 基础


    ![](img/fb76008333fb7aef815b136f9f1afe5f_35_0.png)


    **约翰·戈尔斯 (John Gowers)**


    是一名大学编程与计算机科学导师。他喜欢在他能接触到的每个设备上安装 Linux，并日常使用终端命令和 Shell 脚本。


    ## 资源


    本教程中我们将使用的大多数工具在任何 Linux 发行版上都是标准的。但你可能需要安装 `wget` 命令。


    ### 第一步：在终端中使用管道、grep 和 cat


    掌握 Linux 终端可能会让人望而却步，但一旦掌握，你会发现效率大幅提升。


    如果你是 Linux 用户，你以前可能使用过终端，哪怕只是一两次，你可能也深入接触过 Shell 脚本的世界；终端是 Linux 的核心。虽然我们应当庆祝如今可以在不接触终端的情况下在
    Linux 系统中完成大量工作这一事实，但如果你掌握了终端和 Shell 脚本，你就解锁了一个强大工具，它能让你更高效并让你对计算机拥有更大的控制权。使用终端比使用图形用户界面的学习曲线更陡峭，但它并不比学习一门编程语言更难，你会发现这份努力是值得的。


    在这个教程系列中，我们将探讨如何使用 Shell 脚本和终端来改进你的工作流程并自动化常规任务。我们将从最基础的内容开始，迅速构建到更高级的主题。


    成为终端大师的第一步是在你的系统上打开终端。在不同的发行版上操作方式不同，我们无法在这里提供全面的说明。找一个名为“终端”（Terminal）或“控制台”（Console）或类似名称的应用程序并打开它。如果你看到一个带有提示符和闪烁光标的窗口，如上图
    1 所示，那么你就做对了。


    要在终端中使用，我们在闪烁的提示符处输入命令并按 Enter。试着输入 `pwd` 并按 Enter。这个命令会显示当前终端所在工作目录的文件路径。现在输入
    `ls` 并按 Enter。你应该会看到该目录中所有文件的列表。最后，我们将使用 `echo` 命令来发送问候语。`echo` 是一个将您选定的文本行打印回终端的命令：


    ```bash

    $ echo ''Hello, world!''

    Hello, world!

    ```


    如果一切看起来都工作正常，让我们开始吧！


    ## 在终端中导航


    为了开始使用终端，我们将创建一个新目录（文件夹）进行实验。创建新目录的 Linux 命令是 `mkdir`。输入 `mkdir sandbox` 并按 Enter；这将创建一个名为
    `sandbox` 的新目录。


    ![](img/fb76008333fb7aef815b136f9f1afe5f_35_1.png)


    创建该目录后，我们需要进入它。使用 `cd` 命令更改目录。如果我们想进入新的 `sandbox` 目录，我们输入：


    ```bash

    $ cd sandbox

    ```


    如果你再次输入 `pwd` 并按 Enter，你会看到现在你已经在 `sandbox` 目录内部了。


    我们将 `mkdir` 称为“命令”，但它实际上本身就是一个程序。事实上，终端的基本操作模式是：当用户输入一个程序名称时，运行该程序。程序可以在命令行中接受参数（例如，`mkdir
    sandbox` 中的 `sandbox`），这些参数会影响其行为。


    正如我们稍后所见，这些程序可以组合在一起，形成一种强大的语言，其中程序扮演命令的角色。我们可以使用这种语言编写脚本来自动化重复性任务。


    我们的新目录目前为空。事实上，如果我们现在在命令行输入 `ls` 并按 Enter，我们不会得到任何输出。为了演示各种命令，让我们在该目录中创建一些文件。我们将使用
    `touch` 命令创建一些空文件：


    ```bash

    $ touch email01.txt email02.txt email03.txt

    $ touch work01.txt work02.txt work03.txt

    $ ls

    email01.txt email02.txt email03.txt

    work01.txt work02.txt work03.txt

    ```


    如果需要，我们可以使用 `rm` 命令删除文件：输入 `rm work03.txt` 以删除该文件。


    通过 `touch` 创建的文件是空的。如果我们想要有内容的文件，我们需要使用不同的工具。如果你愿意，可以使用文本编辑器创建自己的文件进行实验，但在本教程中，我们将使用
    `wget` 命令从互联网获取文本文件。


    有可能你的系统上没有安装 `wget`。试着在命令行输入 `wget`：如果你收到“命令未找到”的错误，那么你需要使用你的发行版包管理器来安装它。


    ## 组合命令


    安装 `wget` 后，输入 `wget https://www.gutenberg.org/files/2701/old/moby10b.txt` 并按
    Enter。这将从在线公共领域存储库下载小说《白鲸记》的文本。你可以使用相同的命令下载万维网上的任何文件。你可能想再次输入 `ls`，以确保这个文本文件现在就在你的工作目录中，与我们刚才使用
    `touch` 创建的其他文件在一起。


    如果我们想要删除一个目录，可以使用 `rm` 命令。但是请注意，这只对空目录有效：


    ```bash

    $ mkdir new

    $ touch new/file.txt

    $ rmdir new


    上图 Linux 可用的终端模拟器有各种尺寸和颜色。你的系统上可能安装了不止一个


    $ rmdir: failed to remove ''new'': Directory not empty

    ```


    为了删除包含文件的目录，我们可以使用 `rm -rf`。例如：


    ```bash

    $ rm -rf new

    $ ls

    email01.txt email02.txt email03.txt

    moby10b.txt work01.txt work02.txt

    ```


    这是使用 `rm` 程序的一种新方式。`-rf` 部分被称为“开关”或“命令行选项”，它使 `rm` 以不同但相关的方式运行。每当你在 Linux 命令中看到一两个破折号后跟一个或多个字母时，你看到的就是命令行开关。`-rf`
    包含两个字母，实际上是两个独立的命令行开关：`r` 告诉程序递归地删除目录及其中的所有文件，而 `f` 是“强制”的缩写。如果你省略 `f` 并写 `rm
    -r new`，那么 `rm` 有时会提示你询问是否真的想要删除这些文件。如果你确信自己不会误删错误的东西，你可以使用 `rm -rf` 来节省一些时间。


    大多数 Linux 命令都有可以改变其行为的开关。例如，`echo -n` 打印短语时不在末尾换行。到目前为止，我们看到了单个命令的例子，但命令行的真正威力在我们组合两个或更多命令时才会显现出来。


    ## UNIX 是一个 IDE


    有一种观点认为“UNIX 是一个 IDE”。其想法是，通过在一个或多个终端中运行命令，你可以复制在更高级的 IDE（如 Eclipse）中看到的相同功能。你可以在终端中运行
    `nano` 和 `vi` 等编辑器，以及 `gdb` 和调试器等编程工具。如果你再添加一些 Shell 脚本来连接它们，你就可以在不离开终端的情况下高效编程。


