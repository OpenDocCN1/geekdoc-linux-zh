    In recent months, Clem Lefebre has mentioned a possibility of a hardware “partnership
    and the manufacturing of Linux Mint laptops” but that hasn’t materialised yet,
    so we asked him what his idea of the perfect Mint laptop or Mint box was.


    “Well, it depends for who. For many people the perfect laptop is cheap and has
