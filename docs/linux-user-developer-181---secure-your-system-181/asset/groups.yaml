  - '[PAGE 2]


    # Welcome to issue 181 of Linux User & Developer


    # This issue


    +   » Secure your system, p18

    +   » Latest Linux Mint development, p28

    +   » AWS for Linux, p56


    ![](img/fb76008333fb7aef815b136f9f1afe5f_2_0.png)


    Welcome to the UK and North America''s favourite Linux and FOSS magazine.

    Last quarter, 36% of all malware was targeting Linux (WatchGuard Threat Report
    Q1 2017).

    This was mostly IoT devices, but that''s hardly surprising given the number of
    products hitting the market that can''t be patched post-release and are sitting
    there waiting to be hacked. This free ride needs to end. These companies need
    to invest in the open source software they use or be named and shamed out of business.

    While the IoT situation is lamentable, on the desktop side we''ve got you covered
    with our feature on securing your system (p18): we go into everything from disabling
    unused services to security auditing and automating system monitoring to sandboxing.

    We also take a fresh (sorry) look at Linux Mint development (p28) and an interview
    with its founder (p12). For the tinkerers, we''ve a report from MakeFest in Liverpool
    as well as a packed Pi section (from p69) and for developers there''s a comprehensive
    guide to getting the most out of AWS. As well as all our regular pickings, including
    a group test on virtualisers (p81), we''ve kick-started a Linux Essentials series
    for newcomers (p36) and on p44 we''ve dabbled in recreational maths. It''s a packed
    issue so tuck in!

    Chris Thornett, Editor


    # Get in touch with the team: linuxuser@futuresnet.com


    Facebook: facebook.com/LinusxUserK

    Twitter: @linusxermag

    FileSi filessi@futuresnet.com


