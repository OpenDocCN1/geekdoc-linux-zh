    ## 内核专栏


    在 Linux 4.12 发布，且针对将成为 Linux 4.13 的内核合并窗口开启之际，Jon Masters 总结了 Linux 内核的最新动态


    ![](img/fb76008333fb7aef815b136f9f1afe5f_15_0.png)


    Jon Masters 是一位 Linux 内核黑客，自 13 岁首次上大学以来，从事 Linux 相关工作已超过 22 年。Jon 居住在马萨诸塞州剑桥市，为一家大型企业
    Linux 供应商工作，在那里他正在推动创建用于节能 ARM 架构服务器的标准。


    **L**inus Torvalds 宣布了 **Linux 4.12 的发布，并在他的公告邮件中** 反思道：“4.12 只是单纯地慢”，他指出这是“历史上较大的发布之一，我认为只有
    4.9 的最终提交数量比它多”。而 4.9 之所以庞大，部分原因是 Greg [Kroah-Hartman] 宣布它是一个 LTS [长期支持 – 接收数年的更新]
    内核。正如 Linus 也说的，没有什么特别“奇怪”的地方可以解释其体积，只是大量的持续开发旨在改进 Linux。


    4.12 的差异化统计数据中有几个具体的怪癖脱颖而出，例如新上游化 AMD “Vega” 图形支持的大量头文件，但除了那个巨大的更改 [补丁集的一半] 外，其他修改包括典型的核心内核、架构和驱动程序变更，这在其他任何
    Linux 发布中都很常见。


    就纯数字而言，Linux 4.12 在仅仅九周前的 4.11 基础上增加了超过一百万行代码。Linux Weekly News [LWN] 有一个极好的总结，按雇主和开发者类型
    [那些有薪水的与那些没有特定关联并在业余时间进行内核工作的] 分解了贡献。你可以在 https://lwn.net/Articles/726817 找到他们对
    4.12 构成的总结。


    查阅 Linux Kernel Newbies 的总结以获取详细的补丁列表也可能很有趣：https://kernelnewbies.org。


    4.12 内核包含许多我们在之前几期中详细介绍过的新功能。特别是，对 USB-C 的支持意味着现在将可以使用 Linux 笔记本电脑既作为电源 [power
    source] 又作为汇流点 [power consumer]，由启用最新 USB-C 协议中新的电源传输 [PD] 功能的特殊驱动程序控制。我个人期待着实验
    ‘topm’ [Type-C 端口管理器]。我也对新的 ‘BFO’ [预算公平排队] I/O 调度器感兴趣，笔记本电脑和桌面用户可能会喜欢它。I/O 调度器处理向磁盘（如
    NVMe 固态硬盘）发出 I/O 操作，而 BFO 偏向于交互式桌面应用程序。I/O 调度器可以在启动时设置，在某些桌面上可能会设为默认值。


    Ted Ts’o 宣布了“2017 维护者和内核峰会的下一步和计划”。内核峰会是年度活动，核心内核开发者聚集在一起——通常与 Linux 基金会活动或 Linux
    Plumbers 会议同地举行，而今年则与基金会在布拉格举行的欧洲开源峰会同地举行——以反思内核开发的情况，解决紧迫问题，并思考未来一年的某些重大目标。


    今年将采用稍作修改的流程来确定谁有资格参加内核峰会。那些拥有新颖且有趣话题的人应查看 http://bit.ly/KSummitDiscuss。


    ## 合并窗口来临


    随着 4.12 的发布，针对将成为 4.13 的‘合并窗口’ [内核开发周期开始时允许破坏性更改的时间段 – 大约两周] 也开启了。许多功能已经合并，截至本文写作时，合并仍处于早期阶段。将在
    4.13 中落地的新功能将包括许多幕后功能，它们以微妙的方式增强用户体验。这些包括对 ACPI 的修改以支持 NV-DIMM [非易失性 RAM，特别是影响此类
    RAM 的运行时错误]，对内核处理服务器中 NUMA [非统一内存访问] 的部分进行重构，以解决自 Linux 3.10 以来悄悄引入的性能回归，以及对服务器和笔记本电脑系统进行许多
    x86 架构调整。后者包括几乎完成启用 Intel 5 级分页 [支持 56 位内存 – 以今天标准来看是疯狂的数量] 的补丁，以及处理进程上下文切换 [从一个运行进程切换到另一个]
    的优化。传统上，当发生进程切换时，有必要向所有可能正在运行线程或与该进程共享内存的处理器发出信号，让它们应该使特殊内部缓存失效


