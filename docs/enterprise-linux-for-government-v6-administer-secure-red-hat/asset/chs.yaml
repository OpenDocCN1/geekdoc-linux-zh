  * 组：读取和执行（但不可写）\n* 其他：读取和执行\n\n`drwxr-xr-x.  2 root root      6 Jun  2 08:23 directory`\n\
  \n（注：此处为演示性翻译逻辑，实际输出将根据原文内容进行精简翻译，避免重复描述）\n\n我们可能还会看到 `l`（链接）、一个折号 `-`（普通文件）或其他提供关于性质提示的字符……（此处省略重复的逻辑描述，直接进入后续核心翻译内容）\n\
  \n`drwxr-xr-x.  2 root root      6 Jun  2 08:23 directory`\n\n末尾的 `.` 表示没有访问控制列表（ACL）。如果文件有\
  \ ACL，我们将看到 `+` 号。\n\n`drwxr-xr-x.  2 root root      6 Jun  2 08:23 directory`\n\
  \n（注：由于原始文本中存在大量重复的示例说明，实际翻译将严格遵循“不要重复输出原文”的原则，仅对核心 Markdown 内容进行翻译。）\n\n---\n**更正：此处符合要求的完整翻译内容如下：**\n\
  \n[content]\n最佳实践建议在终端会话中你执行的第一条命令应该是 `screen`。我们稍后将进行修改，以便此操作自动发生。STIG 要求使用 `screen`，因为它是锁定控制台两种常用方法之一（另一种是\
  \ `vlock`）。这两者都不会隐藏终端缓冲区，因此通过 putty 或类似产品查看你控制台的人将能够向上滚动并看到你正在操作的内容。\n\n运行 `screen`\
  \ 时，它会打开一个新窗口并启用热键序列 `CTL-a`，该序列会通知 `screen` 有新进入的命令。在 `CTL-a` 之后常用的命令包括：\n\n* `x`\
  \ – 锁定屏幕\n* `H` – 将所有活动记录到 `~/screenlog.X`。\n* `c` – 创建新窗口\n* `\"` – 列出所有窗口\n* `0-9`\
  \ – 跳转到编号窗口。\n* `n` / `p` – 下一个 / 上一个窗口\n* `CTL-a` – 在两个窗口之间切换\n* `k` – 杀死当前窗口\n\
  * `d` – 分离所有窗口，返回原始的 bash 会话\n\n分离的窗口将保持活动并登录状态。你可以从同一个会话重新连接，也可以从另一个会话使用 `screen\
  \ -r` 重新连接。使用 `-R` 切换会在有可用窗口时重新连接，如果没有则创建一个新的。添加 `-L` 切换将以日志模式启动 `screen`。\n\n`screenlog`\
  \ 可以使用多条命令显示，但 `view`（`vi` 的特殊调用方式）看起来效果最好。要退出 `view`，请使用以下序列 `ESC`、`:q`、`ENTER`。\n\
  \n`vi` 的完整用法将在稍后介绍。\n\n# RHEL6 特性\n\n此配置假设你使用 CentOS、Oracle 或 Scientific Linux 安装了\
  \ EL6，而不是官方的 Red Hat Enterprise Linux 安装。RHEL6 安装的初始配置要复杂一些。\n\n可能需要通过更改 `/etc/sysconfig/network-scripts/ifcfg-eth0`\
  \ 中的设置来启用网络：\n\n`ONBOOT=yes, NM_CONTROLLED=no.`\n\n然后重启网络：\n\n```bash\nservice network\
  \ restart\n```\n\n随后你将需要使用 `subscription-manager` 注册并附加到 Red Hat 存储库。\n\n要为 `bash-completion`\
  \ 等工具启用 `epel` 存储库：\n\n```bash\nwget http://dl.fedoraproject.org/pub/epel/6/x86_64/epel-release-6-8.noarch.rpm\n\
  rpm -ivh epel-release-6-8.noarch.rpm\n```\n\n# 模块 2：文件与目录\n\n## ls – 列出文件\n\n`ls`\n\
  \n要列出目录中的文件，我们将使用 `ls` 命令。在不带选项或参数调用时，`ls` 列出用户当前工作目录的内容。它只会显示文件和子目录的名字，并且在这样调用时不会列出隐藏文件（以点\
  \ `.` 开头的文件）。这是 `/test` 目录的列表。\n\n```bash\nls /test\nbinary directory file link\
  \ source\n```\n\n在此视图中我们获得的信息不多。让我们添加一些选项。\n\n```bash\nls -la\ntotal 56\ndrwxr-xr-x.\
  \  3 root root     90 Jun  2 08:32\ndr-xr-xr-x. 24 root root  4096 May 19 14:11\
  \ .\n-rwxr-xr-x.  1 root root 41504 Jun  2 08:25 binary\ndrwxr-xr-x.  2 root root\
  \      6 Jun  2 08:23 directory\n-rw-r--r--.  1 root root    58 May 17 09:31 file\n\
  -rw-r--r--.  1 root root      0 Jun  2 08:32 hidden\nlrwxrwxrwx.  1 root root  \
  \   10 Jun  2 08:31 link -> /test/file\n-rw-r--r--.  1 root root 2724 Jun  2 08:27\
  \ source\n```\n\n在这里我们为 `ls` 命令提供了两个选项：`-l` 和 `-a`。`-l` 选项指示命令显示目录内容的长列表。`-a` 选项导致显示所有文件（包括输出中的类似\
  \ `.hidden` 的隐藏文件）。这些选项组合在一起提供了我们在上面看到的的结果。\n\n由于我们将频繁地使用 `ls` 命令，让我们花点时间熟悉一下输出。\n\
  \n`drwxr-xr-x.  2 root root      6 Jun  2 08:23 directory`\n\n下划线部分是权限字符串。第一个字符表示我们正在处理的文件类型。这里是\
  \ `d`，代表目录。我们可能还会看到 `l`（链接）、一个折号 `-`（普通文件）或其他提供关于性质提示的字符。字符串的其余部分显示文件所有者（用户）、所属组（组）和任何其他人（其他）的三元组。在这些字符串中，`r`\
  \ 表示读取（Read），`w` 表示写入（Write），`x` 表示执行（Execute）。我们可以这样读取该权限字符串：\n* 用户：读取、写入、执行\n\
  * 组：读取和执行（但不可写）\n* 其他：读取和执行\n\n权限字符串末尾的 `.` 表示没有访问控制列表（ACL）。如果文件有 ACL，我们将看到 `+`\
  \ 号。\n\n（注：由于原文中存在大量重复的示例说明，此处翻译已根据要求进行了去重和整合。）\n\n\n\n如果我们随后对 `link` 执行 `stat`\
  \ 命令，它将返回与该文件相关的元数据，包括符号链接的含义。这表明文件系统本身可以理解链接是什么类型的文件链接，而 `file` 命令在第一轮测试中基本上对其进行了查询。如果这组测试未能获得满意的结果，`file`\
  \ 将尝试通过魔数数据库（magic database files）进行识别。\n\n例如：\n\n### file binary\n```\nbinary:\
  \ ELF 64-bit LSB executable, x86-64, version 1 (SYSV), dynamically linked (uses\
  \ shared libs), for GNU/Linux 2.6.32, BuildID[sha1]=bb794ad0b7a9b70f6bb8d757d4423c2a374dabcf,\
  \ stripped\n```\n\n### stat binary\n```\nFile: ‘binary’\nSize: 41504           \
  \ Blocks: 88            IO Block: 4096   regular file\nDevice: fd00h/64768d   Inode:\
  \ 27204150    Links: 1\nAccess: (0755/-rwxr-xr-x)  Uid: (  0/  root)   Gid: (  0/\
  \  root)\nContext: unconfined_u:object_r:default_t:s0\nAccess: 2017-06-05 14:01:15.692750865\
  \ -0500\nModify: 2017-06-02 08:25:27.684384663 -0500\nChange: 2017-06-02 08:25:27.684384663\
  \ -0500\nBirth: -\n```\n\n上面，`file` 成功地将 binary 识别为 ELF 64-bit LSB 可执行二进制文件。然而，`stat`\
  \ 的结果显示类型为普通文件——文件系统测试未能正确识别此文件。在这种情况下，查询了魔数文件，在文件的数据块中匹配了特定的字节模式，并完成了识别。\n\n如果这些测试都失败了，`file`\
  \ 命令将尝试确定目标文件是否包含已知语言字符序列的文本文件。\n\n## which, whereis, locate\n\n在 Linux 中有许多定位文件的方法。`which`\
  \ 命令会尝试在用户的 `PATH` 中查找命名命令的第一个实例。`PATH` 环境变量包含一系列由冒号 `:` 分隔的目录，shell 将通过这些目录搜索以命令。你可以如下所示显示\
  \ `PATH` 的内容：\n\n```bash\necho $PATH\n/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/root/bin\n\
  ```\n\n```bash\nwhich cat\n/usr/bin/cat\n```\n\n在这里，`which` 依次在 `/usr/local/sbin`、`/usr/local/bin`\
  \ 和 `/usr/sbin` 中搜索 `cat`，最后在 `/usr/bin` 中找到了 `cat`。如果在最后一个目录（`/root/bin`）中存在另一个\
  \ `cat` 副本，`which` 将无法找到它。如果系统中存在其他 `cat` 命令的副本，但它们不在用户 `PATH` 所引用的目录中，`which` 同样无法感知到它们。\n\
  \n`which` 命令准确地告诉我们，在不指定命令路径调用时，将执行哪一个命令实例。如果你觉得这并不重要，请考虑这种情况：\n\n```bash\necho\
  \ $PATH\n.:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/root/bin\n```\n\n\
  注意 `PATH` 前面的点。它代表当前工作目录。如果它存在于用户的 `PATH` 中，可能会导致无意之外的执行。例如，如果用户当前工作目录下存在一个名为 `ls`\
  \ 的脚本，而用户随后尝试列出该目录的内容，他将会在无意中触发该脚本。`which` 命令对于确定问题源非常有帮助。\n\n`whereis` 命令用于定位指定命令的二进制文件、源码和手册页（man\
  \ pages）。它通过搜索以下内容来实现：\n- 预定义的、硬编码的目录列表\n- 用户 `PATH` 中的任何目录\n- `MANPATH` 变量定义的任何目录\n\
  \n不带参数调用 `whereis -l` 将返回该命令将搜索的目录列表以及它期望在其中找到的文件类型。\n\n```bash\nwhereis cp\ncp:\
  \ /usr/bin/cp\n/usr/share/man/man1/cp.1.gz\n/usr/share/man/man1p/cp.1p.gz\n```\n\
  \n在这里，`whereis` 在 `/usr/bin` 找到了 `cp` 二进制文件，在 `/usr/share/man` 找到了两个手册页。与现代搜索工具相比，`whereis`\
  \ 命令相当有限，但在需要时仍然提供快速答案。\n\n### find\n\n`locate` 命令是一个通过名称在系统中查找文件的简单工具。它使用索引数据库\
  \ `/var/lib/mlocate.db`。该数据库由 `updatedb` 更新，`anacron` 调度器默认每天运行。\n\n使用 `locate`\
  \ 非常简单：\n```bash\nlocate testfile\n/test/testfile\n```\n\n\n\n\n当为 `find` 命令提供多个\
  \ `name` 或 `iname` 选项时，默认行为是在它们之间插入逻辑与（AND）。如果你希望 `find` 使用逻辑或（OR）进行操作，只需向其传递 `-o`\
  \ 选项即可。\n\n## 按属性搜索\n\n经常，我们可能需要找到具有不安全或不理想的所有权、权限或属性的文件。例如，我们可能希望找到所有 world 可写的可执行文件（这是一个常见的安全问题）。或者，我们可能想列出任何设置了特殊访问模式（`SUID`、`SGID`\
  \ 或粘滞位）的文件。也许我们想找到由特定个人所有（或不属于任何任何人）的文件，或者在特定时间窗口内被访问或修改过的文件。`find` 可以解决所有这些以及更多问题。考虑下面这个示例：\n\
  \n```\nls -l\ntotal 56\ndrwxr-xr-x. 3 root root    33 Jun 12 15:40 1\n-rwxr-xr-x.\
  \ 1 root root 41504 Jun  2 08:25 binary\ndrwxr-xr-x. 2 root root    21 Jun 12 13:05\
  \ directory\n-rw-rwxr--+ 1 root root    58 May 17 09:31 file\nlrwxrwxrwx. 1 root\
  \ root    10 Jun  2 08:31 link -> /test/file\n-rw-r--r--. 1 root root    60 Jun\
  \  9 07:55 pathfile\n-rwxrwxrwx. 1 root root 2724 Jun  2 08:27 source\n```\n\n```\n\
  find . -type f -perm /o=w -perm /o=x -exec ls -l {} \\;\n```\n\n```\n-rwxrwxrwx.\
  \ 1 root root 2724 Jun  2 08:27 /source\n```\n\n在这里，我们首先用 `ls -l` 列出了 `/test` 目录的内容。这将作为对比\
  \ `find` 命令结果的参考证明。然后我们执行了 `find` 命令，调用方式如下：\n\n```\nfind . -type f -perm /o=w -perm\
  \ /o=x -exec ls -l {} \\;\n```\n\n这实现了什么？让我们来拆解它：\n\n- `find` 开始查找\n- `.` 在 `$PWD`\
  \ 中开始查找并递归遍历所有子目录\n- `-type f` 仅搜索普通文件\n- `-perm` 匹配具有以下权限的文件\n- `/o=w` 匹配列出的任何位——列出的是“o=w”，即“其他用户”（others）的“写”权限\n\
  - `-perm` 匹配具有后续权限的文件（与上一个 `-perm` 为逻辑与关系）\n- `/o=x` 匹配列出的任何位——列出的是“o=x”，即“其他用户”（others）的“执行”权限\n\
  - `-exec ls -l {} \\;` 对 `find` 的结果结果运行 `ls -l`\n\n用英语描述，就是：“在我的当前目录或其子目录下，找到任何对\
  \ world 可写且可执行的普通文件。然后对这些文件运行 `ls -l`。”\n\n让我们探索几个查找存在安全问题文件的示例：\n\n## 查找无所有者的文件\n\
  \n```\nfind / -nouser\n```\n\n这样调用 `find` 将返回系统上所有未归属的文件列表。当文件没有所有者时，这通常是用户账户删除的结果。对无所有者的文件调用\
  \ `ls -l` 可能会产生如下结果：\n\n```\n-rwxrwxrwx. 1 root root 2724 Jun  2 08:27 source\n\
  -rw-r--r--. 1 1002 1002231 Aug  2  2016 unowned\n```\n\n注意上述输出中亮的部分。对于文件 `source`，我们可以看到所有者是\
  \ `root`，所属组是 `root`。然而，文件 `unowned` 只显示数字。这些数字分别代表用户 ID（UID）和组 ID（GID）。我们现在能看到它们，是因为在\
  \ `/etc/passwd` 和 `/etc/group` 文件中没有匹配这些 ID 的用户或组。因此，我们说文件是“无所有者的”。\n\n我们可能对查找具有不理想属性的文件感兴趣，如\
  \ `SetUID` 或 `SetGID`。这些属性允许以所有者用户或组的权限执行文件，而不是调用者的权限。当此类文件由 `root` 或其他特权账户所有时，这尤其成问题。我们可以用\
  \ `find` 定位这类文件：\n\n```\nfind / -type f -perm /u=s -exec ls -l {} \\;\n```\n\n```\n\
  -rwsr-xr-x. 1 root root 32008 Nov  5  2016 /usr/bin/fusermount\n-rwsr-xr-x. 1 root\
  \ root 61328 Nov  5  2016 /usr/bin/ksu\n-rws--x--x. 1 root root 23960 Nov  5  2016\
  \ /usr/bin/chfn\n-rws--x--x. 1 root root 23872 Nov  5  2016 /usr/bin/chsh\n-rwsr-xr-x.\
  \ 1 root root 27832 Jun 10 /usr/bin/passwd\n```\n\n上述高亮部分指示 `find` 定位设置了 `SUID`\
  \ 位的文件。`-exec` 选项查找设置了 `SUID` 位的文件。最后，我们可能对查找在特定时间窗口内被访问或修改的文件感兴趣。`find` 提供了基于这些时间的选项：\n\
  \n- `atime` – 访问时间\n- `ctime` – 更改时间（元数据更改）\n- `mtime` – 修改时间\n\n当处理日志文件时，通常有助于查看文件的最后几行。这是因为日志是顺序追加的，最新的条目位于文件末尾。如果我们想知道最后\
  \ 24 小时的日志，可能会尝试：\n\n```\ntail -6 /var/log/ldap\nJun 12 09:19:39 server slapd[2447]:\
  \ activity on 1\nJun 12 09:19:39 server slapd[2447]: activity on\nJun 12 09:19:39\
  \ server slapd[2447]:\nJun 12 09:19:39 server slapd[2447]: daemon: epoll: listen=7\n\
  Jun 12 09:19:39 server slapd[2447]: daemon: epoll: listen=8\nJun 12 09:19:39 server\
  \ slapd[2447]: daemon: epoll: listen=9\n```\n\n上述 `-6` 选项告诉 `tail` 命令返回多少行。如果我们改为提供\
  \ `-f`（跟踪）选项，`tail` 将显示文件的最后几行，并在文件变化时不断刷新输出。\n\n相反，`head` 返回文件的前几行。这是 `dmesg |\
  \ head -5` 的输出：\n\n```\ndmesg | head -5\n[  0000000] Initializing cgroup subsys\
  \ cpuset\n[  0000000] Initializing cgroup subsys cpu\n[  0000000] Initializing cgroup\
  \ subsys cpuacct\n[  0000000] Linux version 3.10.0-514.el7.x86_64 (builder@kbuilder.dev.centos.org)\
  \ (gcc version 4.8.5 20150623 (Red Hat 4.8.5-11) (GCC) ) #1 SMP Tue Nov 22 16:42:41\
  \ UTC 2016\n[  0000000] Command line: BOOT_IMAGE=/vmlinuz-3.10.0-514.el7.x86_64\
  \ root=/dev/mapper/cl-root ro crashkernel=auto rd.lvm.lv=cl/root rd.lvm.lv=cl/swap\
  \ rhgb quiet LANG=en_US.UTF-8\n```\n\n\n\n\n\n下划线部分是折行行。它显示了启动时提供给内核的选项。\n\n`touch`,\
  \ `tee`, `echo`\n\n`Linux` 中的大部分系统管理工作涉及编辑文本文件。有时，我们需要在命令行环境中创建一个新文件。对于大多数工作，我们会转向功能完备的编辑器，如\
  \ `vi`（它将在后文中介绍）。\n\n在其他情况下，我们可能只需要文件存在即可。例如，文件 `/.autorelabel` 文件，如果它在系统启动时存在，它将导致系统上的所有文件和目录被重新标记为它们的默认安全上下文。该文件本身是空的，且默认并不存在。创建此类文件最简单的方法是使用\
  \ `touch` 命令。\n\n`touch` 的预期用途是更新给定文件的访问和修改时间。然而，如果将一个不存在的文件作为参数传递给 `touch`，`touch`\
  \ 将创建它。这里是 `touch` 运行的简要示例：\n\n```\n## ls\n## touch somefile\n## ls\nsomefile\n\
  ```\n\n我们可能还希望创建一个文件来存放命令或脚本的输出。在这种情况下，我们通常会使用命令行重定向器，如 `>` 或 `>>`。这将重定向所有本应发送 `STDOUT`\
  \ 的输出，这可能并不是想要的。要将输出同时发送到 `STDOUT` 和指定文件，我们将使用 `tee`。要创建小型配置文件或向简单的配置文件添加行，我们可以使用\
  \ `cat` 或 `echo` 配合重定向。\n\n`tee` 命令经常用于脚本中，将输出同时发送到 `STDOUT` 和指定文件。它可以从脚本中调用（用于简单的日志记录），也可以直接从命令行调用，当我们既想查看命令输出又想保存一份以供日后查阅时。\n\
  \n这里是 `tee` 功能的简单演示：\n\n```\n## ls /usr | column | tee /cap\nbin     games lib \
  \     libexec sbin src\netc include lib64 local share tmp\n\n## cat cap\nbin   \
  \  games lib      libexec sbin src\netc include lib64 local share tmp\n```\n\n`echo`\
  \ 的主要功能是读取输入（通常来自 `STDIN`）并将该输出发送到 `STDOUT`。\n\n我们可以利用命令行重定向利用这种行为来向文件中插入文本。这对于向配置文件追加行，或创建小型文本文件（例如用于快速\
  \ NFS 共享的 `/etc/exports`）非常有用。\n\n```\n## echo \"this is line 1\" > file\n## cat\
  \ file\nthis is line 1\n\n## echo \"this is line 2\" >> file\n## cat file\nthis\
  \ is line 1\nthis is line 2\n```\n\n`mkdir`, `rm`, `rmdir`, `cp`, `mv`\n\n可以使用 `mkdir`\
  \ 命令创建目录。该命令的使用非常直观；只需调用 `mkdir` 并提供（作为参数）想要创建的目录的路径和名称。让我们尝试一下：\n\n```\n## mkdir\
  \ -m 0777 -p this/is/insecure\n## find this -exec ls -ld {} \\;\ndrwxr-xr-x. 3 root\
  \ root 16 Jun 16 15:26 this\ndrwxr-xr-x. 3 root root 22 Jun 16 15:26 this/is\ndrwxrwxrwx.\
  \ 2 root root 6 Jun 16 15:26 this/is/insecure\n```\n\n`rm` 命令删除（移除）文件和目录。这本质上是一个危险的行为；幸运的是，`rm`\
  \ 有选项可以限制其范围和影响。\n\n- `rm` – 删除文件\n- `rm -r` – 删除目录（及其内部所有内容）\n- `rm -i` – 在删除前提示用户确认\n\
  - `rm -f` – 强制 - 用于你绝对、绝对必须销毁它时\n\n在 `EL6` 中，root 用户的 `.bashrc` 文件包含一个将 `rm` 到 `rm\
  \ -i` 的默认别名。这导致 `rm` 在删除任何文件之前提示用户确认。从安全角度来看，这是理想的行为，但当 root 需要删除大量文件时，就会产生一个问题。在这种情况下，我们可以使用\
  \ `rm -f` 或直接调用系统版本的 `rm`（而不是 bash 内置版本）：\n\n```\n## rm cap\nrm: remove regular\
  \ file ‘cap’? #确认提示\n\n## /usr/bin/rm cap\n# #无确认\n```\n\n还有一个用于处理目录的独立相关命令：`rmdir`。\n\
  \n要复制和移动文件，请使用 `cp` 和 `mv`。它们的功能应该是显而易见的，但在使用它们时有一些需要考虑的因素：\n\n- 复制文件需要对原始文件具有读取权限，并对包含它的目录具有读取/执行权限。当新文件创建时，它将由复制用户所有，且访问权限不会从原始文件继承。新文件的\
  \ selinux 安全上下文将从其所在目录继承。\n- 移动文件不需要对文件的任何权限；相反，它需要对目录具有写入权限。\n\n\n\n\n\n1,4 第一个文件的第\
