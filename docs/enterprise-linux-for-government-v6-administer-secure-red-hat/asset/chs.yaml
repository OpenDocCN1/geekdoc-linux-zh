  \n\n我们现在需要安装 `bash-completion`。`bash-completion` 功能未随 EL6 分发，但在 EL7 中包含。它是使用 `bash`\
  \ 时最实用的工具之一，因为它可以自动补全命令或建议可能的补全项。为了获取它，我们需要配置 `yum` 去一个名为 Extra Packages for Enterprise\
  \ Linux（EPEL）的另一个仓库中查找软件。这通过 `yum install epel-release` 实现。这会创建一个文件 `/etc/yum.repos.d/epel.repo`，该文件告诉\
  \ `yum` 去哪里查找软件。然后我们可以安装 `bash-completion`：\n\n```bash\nyum -y install bash-completion\n\
  ```\n\n为了获得 `bash-completion` 的好处，你需要注销（`exit`）并重新登录。\n\n在标准的 RHEL6 中，这稍微复杂一些；请参见本模块末尾的“Red\
  \ Hat 特定”。\n\n## 在 bash 中输入\n\n在 `bash` 提示符下有很多技巧可用；其中许多在后面会介绍，但有几个是你现在应该知道的。\n\n\
  你可以使用向上向下方向箭头访问之前的命令。你只需通过方向键回到适当的位置并输入即可编辑命令。你可以通过 `CTL-a` 或 `CTL-e` 跳到行的开头或结尾。你可以通过输入\
  \ `CTL-c` 停止正在运行的命令。你也可以用这样终止当前的输入行。\n\n你还可以发布命令历史，它将显示带有前置数字的历史文件。你只需通过输入一个感叹号（称为\
  \ bang `!`）后跟数字（中间没有空格）即可重新执行该命令。两个感叹号 `!!` 将重新执行上一个命令。感叹美元符号 `$!` 将重新执行上一个命令的参数。\n\
  \n下面我们运行了 `ping` 来测试与服务器的连接性，用 `CTL-c` 终止 ping，然后使用 `ssh !$` 为远程服务器建立终端会话。\n\n```bash\n\
  ## ping 192.168.1.155\n\nPING 192.168.1.155 (192.168.1.155) 56(84) bytes of data.\n\
  64 bytes from 192.168.1.155: icmp_seq=1 ttl=64 time=0.964 ms\n64 bytes from 192.168.1.155:\
  \ icmp_seq=2 ttl=64 time=0.205 ms\n^C\n\n--- 192.168.1.155 ping statistics ---\n\
  2 packets transmitted, 2 received, 0% packet loss, time 1733ms\nrtt min/avg/max/mdev\
  \ = 0.205/0.584/0.964/0.380 ms\n\n## ssh !$\nssh 192.168.1.155\nFIPS mode initialized\n\
  ```\n\n## 重定向与管道\n\n大小写是非常重要的：对于 Linux 来说，`File`、`file`、`FILE` 和 `filE` 是四个不同的东西。按照通用习惯，大多数事物都是小写的。\n\
  \n通常一个命令产生的输出超过单个屏幕能够容的内容，或者产生了我们希望作为另一个命令输入的的输出，或者我们想要将其保存到文件中。为了适应这一点，我们使用重定向。\n\
  \n最简单的重定向是管道——用竖线 `|` 表示。管道接收一个命令的输出并将其作为下一个命令的输入。例如，使用 `ls /etc | less` 列出 `/etc/`\
  \ 目录的内容产生大量文本。`less` 命令允许我们一次查看一页文本。\n\n管道的另一个用法是“通过 `grep` 管道”。`grep` 是一个可以找到包含正则表达式的行的命令。以后会有更多内容要说。现在我们只看命令的输出，它将会显示。\n\
  \n如果我们想将命令的输出保存到文件中，可以使用大于符号 `>` 进行重定向。这会将输出置于文件中，如果文件不存在则创建它，如果文件已存在则覆盖任何内容。例如，如果你想将命令的输出保存到文件，你将执行\
  \ `command > file`。注意 `bash` 在执行开始时打开所有文件和命令，因此 `cat > file` 在开始之前打开并清空该文件。结果是文件将被清空。\n\
  \n要将 `command` 的输出添加到文件中，使用双大于符号 `>>`，它将追加到文件末尾：`command >> file`。如果你只使用单个大于号，它将覆盖文件。如果你在单个大于号前面没有使用命令，即\
  \ `; > file`，将通过用空覆盖来擦除文件内容。\n\n你可以将多个重定向组合起来产生所需的结果。如果你想要一个包含输出的文件，你可以：`command\
  \ > file`。在这个示例中，分号隔开了两个命令，它们的运行方式就像它们在单独的行一样。\n\n## 特殊虚拟文件\n\nUnix 风格系统有几个特殊的虚拟文件：\n\
  \n- `/dev/null`：黑洞、垃圾桶，数据进入后永不返回的地方。不需要的输出可以重定向到这里。它也可以用作无物的源：`cat /dev/null > file1`\
  \ 将把 `file1` 的内容替换为空，使其变空。`> file1` 等于此。\n- `/dev/random`：高质量随机数据源，由系统硬件收集的熵产生。在比熵产生更快的情况下可以读取它。\n\
  - `/dev/urandom`：低质量随机数源。使用系统熵的伪随机数生成器。对于加密目的来说足够。\n- `/dev/zero`：无限的 0 源。用于创建一个空文件。注意这些不会显示。\n\
  \n## 标准流\n\n在 `bash` 中有三个“标准流”。这些是流入和流命令的数据流。每个流都有一个称为“文件描述符”的：\n\n- `STDIN` (0)：命令的输入，来自终端或管道。\n\
  - `STDOUT` (1)：命令的结果。\n- `STDERR` (2)：命令的任何错误信息。\n\n在大多数情况下 `STDOUT` 显示在终端上或传递到重定向。`STDERR`\
  \ 默认显示在终端上，调用重定向。标准流可以使用相应的描述符进行重定向：\n\n- `command 2> errorfile`：将命令的 `STDERR` 重定向到\
  \ `errorfile`\n- `command 2> /dev/null`：将命令的 `STDERR` 发送到空洞\n- `command 2>&1 > file`：将命令的\
  \ `STDERR` 重定向到 `STDOUT`，然后将其传递到 `file`。\n    - 这也可以写成 `command > file 2>&1` 或 `command\
  \ &> file`\n- `command 0< file`：使用 `file` 的内容作为命令的 `STDIN`\n    - 通常缩写为 `command\
  \ < file`\n\n## 执行控制\n\n你还可以让第二个命令的执行取决于第一个命令的成功：\n\n- `cmd1 && cmd2`：只有当 `cmd1`\
  \ 成功时才会运行 `cmd2`。\n- `cmd1 || cmd2`：只有当 `cmd1` 以错误码退出时才会运行 `cmd2`。\n\n所有进程（命令只是进程）退出时带有一个代码。按照约定，0\
  \ 表示成功无错误，所有其他表示错误。最后一个退出码存储在特殊变量 `$?` 中，可以通过 `echo $?` 显示。\n\n命令可以通过附加一个和符号在后台运行：`yum\
  \ update &`。\n\n有时你只是想得到一个干净的终端来输入。这可以通过 `CTL-l` 或通过执行 `clear` 命令来实现。也可能发生由于尝试打印不可打印字符而混淆了终端。这通常是尝试显示二进制编码文件的结果，`reset`。\n\
  \n\n\n\n\n最佳实践建议在终端会话中你执行的第一条命令应该是 `screen`。我们稍后将进行修改，以便此操作自动发生。STIG 要求使用 `screen`，因为它是锁定控制台两种常用方法之一（另一种是\
  \ `vlock`）。这两者都不会隐藏终端缓冲区，因此通过 putty 或类似产品查看你控制台的人将能够向上滚动并看到你正在操作的内容。\n\n运行 `screen`\
  \ 时，它会打开一个新窗口并启用热键序列 `CTL-a`，该序列会通知 `screen` 有新进入的命令。在 `CTL-a` 之后常用的命令包括：\n\n* `x`\
  \ – 锁定屏幕\n* `H` – 将所有活动记录到 `~/screenlog.X`。\n* `c` – 创建新窗口\n* `\"` – 列出所有窗口\n* `0-9`\
  \ – 跳转到编号窗口。\n* `n` / `p` – 下一个 / 上一个窗口\n* `CTL-a` – 在两个窗口之间切换\n* `k` – 杀死当前窗口\n\
  * `d` – 分离所有窗口，返回原始的 bash 会话\n\n分离的窗口将保持活动并登录状态。你可以从同一个会话重新连接，也可以从另一个会话使用 `screen\
  \ -r` 重新连接。使用 `-R` 切换会在有可用窗口时重新连接，如果没有则创建一个新的。添加 `-L` 切换将以日志模式启动 `screen`。\n\n可以使用多条命令显示\
  \ `screenlog`，但 `view`（`vi` 的特殊调用方式）看起来效果最好。要退出 `view`，请使用以下序列 `ESC`、`:q`、`ENTER`。\n\
  \n`vi` 的完整用法将在稍后介绍。\n\n# RHEL6 特性\n\n此配置假设你使用 CentOS、Oracle 或 Scientific Linux 安装了\
  \ EL6，而不是官方的 Red Hat Enterprise Linux 安装。RHEL6 安装的初始配置要复杂一些。\n\n可能需要通过更改 `/etc/sysconfig/network-scripts/ifcfg-eth0`\
  \ 中的设置来启用网络：\n\n`ONBOOT=yes, NM_CONTROLLED=no.`\n\n然后重启网络：\n\n```bash\nservice network\
  \ restart\n```\n\n随后你将需要使用 `subscription-manager` 注册并附加到 Red Hat 存储库。\n\n要为 `bash-completion`\
  \ 等工具启用 `epel` 存储库：\n\n```bash\nwget http://dl.fedoraproject.org/pub/epel/6/x86_64/epel-release-6-8.noarch.rpm\n\
  rpm -ivh epel-release-6-8.noarch.rpm\n```\n\n为了安全合规，你还应该通过 `chkconfig rhnsd off`\
  \ 禁用 Red Hat 自动更新。或者，你可以在 `/etc/sysconfig/rhn/up2date` 中设置 `retrieveOnly=1` 来允许下载但不安装。\n\
  \n# 模块 2：文件与目录\n\n## ls – 列出文件\n\n`ls`\n\n要列出目录中的文件，我们将使用 `ls` 命令。在不带选项或参数调用时，`ls`\
  \ 列出用户当前工作目录的内容。它只会显示文件和子目录的名字，并且在这样调用时不会列出隐藏文件（以点 `.` 开头的文件）。这是 `/test` 目录的列表。\n\
  \n```bash\nls /test\nbinary directory file link source\n```\n\n在此视图中我们获得的信息不多。让我们添加一些选项。\n\
  \n```bash\nls -la\ntotal 56\ndrwxr-xr-x.  3 root root     90 Jun  2 08:32\ndr-xr-xr-x.\
  \ 24 root root  4096 May 19 14:11 .\n-rwxr-xr-x.  1 root root 41504 Jun  2 08:25\
  \ binary\ndrwxr-xr-x.  2 root root      6 Jun  2 08:23 directory\n-rw-r--r--.  1\
  \ root root    58 May 17 09:31 file\n-rw-r--r--.  1 root root      0 Jun  2 08:32\
  \ hidden\nlrwxrwxrwx.  1 root root     10 Jun  2 08:31 link -> /test/file\n-rw-r--r--.\
  \  1 root root 2724 Jun  2 08:27 source\n```\n\n在这里我们为 `ls` 命令提供了两个选项：`-l` 和 `-a`。`-l`\
  \ 选项指示命令显示目录内容的长列表。`-a` 选项导致显示所有文件（包括输出中的类似 `.hidden` 的隐藏文件）。这些选项组合在一起提供了我们在上面看到的的结果。\n\
  \n由于我们将频繁地使用 `ls` 命令，让我们花点时间熟悉一下输出。\n\n`drwxr-xr-x.  2 root root      6 Jun  2 08:23\
  \ directory`\n\n下划线部分是权限字符串。第一个字符表示我们正在处理的文件类型。这里是 `d`，代表目录。我们可能还会看到 `l`（链接）、一个折号\
  \ `-`（普通文件）或其他提供关于性质提示的字符。字符串的其余部分显示文件所有者（用户）、所属组（组）和任何其他人（其他）的三元组。在这些字符串中，`r` 表示读取（Read），`w`\
  \ 表示写入（Write），`x` 表示执行（Execute）。我们可以这样读取该权限字符串：\n* 用户：读取、写入、执行\n* 组：读取和执行（但不可写）\n\
  * 其他：读取和执行\n\n权限字符串末尾的 `.` 表示没有访问控制列表（ACL）。如果文件有 ACL，我们将看到 `+` 号。\n\n`drwxr-xr-x.\
  \  2 root root      6 Jun  2 08:23 directory`\n\n下划线部分是权限字符串。第一个字符表示我们正在处理的文件类型。这里是\
  \ `d`，代表目录。我们可能还会看到 `l`（链接）、一个折号 `-`（普通文件）或其他提供关于性质提示的字符。字符串的其余部分显示文件所有者（用户）、所属组（组）和任何其他人（其他）的三元组。在这些字符串中，`r`\
  \ 表示读取（Read），`w` 表示写入（Write），`x` 表示执行（Execute）。我们可以这样读取该权限字符串：\n* 用户：读取、写入、执行\n\
  * 组：读取和执行（但不可写）\n* 其他：读取和执行\n\n权限字符串末尾的 `.` 表示没有访问控制列表（ACL）。如果文件有 ACL，我们将看到 `+`\
  \ 号。\n\n`drwxr-xr-x.  2 root root      6 Jun  2 08:23 directory`\n\n下划线部分是权限字符串。第一个字符表示我们正在处理的文件类型。这里是\
  \ `d`，代表目录。我们可能还会看到 `l`（链接）、一个折号 `-`（普通文件）或其他提供关于性质提示的字符。字符串的其余部分显示文件所有者（用户）、所属组（组）和任何其他人（其他）的三元组。在这些字符串中，`r`\
