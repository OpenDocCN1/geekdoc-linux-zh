  \ 组成，UID 4001\n    4. `Paul` – UID 4002，shell 为 `vim`\n9. 为 `Nick` 提供 `vnc` 访问。\n\
  10. 允许 `Kate` 和 `Mike` 使用 `sudo`。\n11. 限制直接登录到 `tty1`。\n12. 配置从类电脑通过证书登录你的新机器。\n\
  13. 在第二个硬盘上使用逻辑卷创建一个 200 MB 的交换文件。将其永久添加到交换空间中。\n14. 配置 `aide` 每天晚上 11 点运行。\n15.\
  \ 配置 `yum` 删除所有元数据和缓存，并每周创建一个缓存。\n    1. 如果电脑关机，任务将在下次开机时运行。\n16. 系统必须是最新的。\n  \
  \  1. 如果有新内核，应将其安装为默认内核\n    2. 旧内核必须保持可用且可启动\n17. 将 `cron` 和 `batch` 的使用限制为 `root`、`Kate`\
  \ 和 `Mike`。\n    1. 如果创建了新用户，不应授予其 `cron` 或 `batch` 权限。\n18. 配置 `ntp` 使用指定的 NIST\
  \ 服务器或其他服务器。\n19. 配置你的新机器发送日志。\n20. 禁止对你的机器 `ping`。\n21. 在第二个硬盘上创建两个 400 MB 的分区。\n\
  22. 这些分区之一应用于 `web` 服务。\n    1. 挂载在 `/new-web`\n    2. 带有标签\n    3. 通过设备而非名称挂载。\n\
  \    4. 创建内容为 \"This is a test\" 的 `index.html`。\n    5. `index.html` 仅应对来自你的子网可见。\n\
  23. 为开发者创建一个共享目录 `/home/code`。\n    1. 允许 `developers` 组的所有成员（`Nick` 除外）对 `code`\
  \ 读写权限。\n    2. `Nick` 只有读取权限。\n    3. 用户不应删除他人的文件。\n    4. 在 `code` 中创建的任何新文件或目录应\n\
  \        1. 属于创建者和 `developer` 组\n        2. 具有适当的权限。\n\n\n\n内核模块可以在运行时添加到内核中，存储在\
  \ `/lib/modules` 中。这些目录中的所有文件都不应为组可写或世界可写。如果发现这些目录中的任何文件为组可写或世界可写，请修正其权限。\n\n###\
  \ 23. 验证所有世界可写目录均已设置粘滞位（Sticky Bits）\n当目录设置了所谓的“粘滞位”时，只有给定文件的所有者才能从目录中删除该文件。如果没有粘滞位，任何对目录具有写访问权限的用户都可以删除该目录中的任何文件。设置粘滞位可以防止用户删除彼此的文件。在目录没有理由设置为世界可写的情况下，更好的解决方案是移除该权限而不是设置粘滞位。\n\
  \n### 24. 确保所有文件都属于一个组\n如果任何文件不属于某个组，则应调查其缺乏组所有的原因。随后，应当删除这些文件或将其分配给适当的组。\n\n无所属的文件并不直接意味着安全问题，但它们通常是某些异常的迹。它们可能是由入侵者引起、错误的软件安装或草稿软件删除引起，或者是未能删除已删除账户的所有文件引起的。应该修复这些文件，以免它们在将来创建账户时引发问题，并应发现且解决原因。\n\
  \n### 25. 确保所有世界可写目录均属于系统账户\n本地分区中所有世界可写的目录都应属于 `root` 或另一个系统账户。如果任何世界可写目录不属于系统账户，应对此进行调查。随后，应当删除这些文件或将其分配给适当的组。\n\
  \n### 26. 确保 /etc/grub.conf 中未禁用 SELinux\n在启动时禁用主要的主机保护功能（如 `SELinux`）将阻止其在启动时限制系统服务。此外，这增加了它在系统运行期间保持关闭状态的概率。\n\
  \n### 27. 确保 SELinux 状态为强制（Enforcing）\n`SELinux` 状态在系统启动时应设置为 `enforcing`。\n\n将\
  \ `SELinux` 状态设置为 `enforcing` 可确保 `SELinux`能够将可能被破坏的进程限制在安全策略范围内，该策略旨在防止它们对系统造成破坏或进一步提升权限。\n\
  \n### 28. 配置 SELinux 策略\n`SELinux` 目标策略（targeted policy）适用于通用桌面和服务器，以及许多许多其他角色的系统。\n\
  \n其他策略（如 `mls`）提供了额外的安全标记和更强的限制，但与许多通用用例不兼容。\n\n### 29. 验证只有 root 拥有 UID 0\n如果除\
  \ `root` 以外的账户的 `UID` 为 `0`，应对此错误配置进行调查，并移除 `root` 以外的账户或更改它们的 `UID`。\n\n### 30.\
  \ 设置引导加载程序密码\n在启动过程中，引导加载程序负责启动内核执行并为其传递选项。引导加载程序允许选择不同的内核——可能位于不同的分区或介质上。x86 系统的默认\
  \ Red Hat Enterprise Linux 引导加载程序称为 `GRUB`。它可以传递给内核的选项包括单用户模式（提供无需任何身份验证的 root 权限）以及禁用\
  \ `SELinux` 的能力。为了防止本地用户修改启动参数危及安全，请使用密码保护引导加载程序配置，并确保配置文件的权限设置正确。\n\n### 31. 验证\
  \ iptables 已启用\n应当启用 `iptables` 服务。\n\n### 32. Rsyslog 日志发送到远程主机\n如果系统日志对于检测恶意活动有用，则有必要将日志发送到远程服务器。攻破机器\
  \ `root` 账户的入侵者可能会在管理员看到日志之前，删除指示系统受到攻击的日志条目。\n\n然而，建议在发送到 `loghost` 的同时，也在本地主机上存储日志，特别是当\
  \ `rsyslog` 配置为使用 `UDP` 协议通过网络发送消息时。`UDP` 不保证可靠交付，中等繁忙的站点偶尔会丢失日志消息，特别是在高流量期间（这可能是攻击的结果）。此外，远程\
  \ `rsyslogmessages` 默认不通过任何方式进行身份验证，因此攻击者很容易向中央日志服务器引入伪造消息。此外，某些问题会导致网络连接中断，这将阻止消息发送到中央服务器。出于所有这些原因，最好将日志消息同时存储在中央和每个主机上，以便在需要时进行关联。\n\
  \n除了这些其他指令外，可以通过添加或更正以下行之一（适当替换 `loghost.example.com`）配置系统将其日志转发到特定的日志服务器。协议的选择取决于系统环境；虽然\
  \ `TCP` 和 `RELP` 提供了更可靠的消息传递，但它们可能在所有环境中都不支持。\n\n### 33. 启用 rsyslog 服务\nRed Hat\
  \ Enterprise Linux 6 默认提供 `syslog` 风格的日志。\n\n### 34. 禁用 xinetd 服务\n可以禁用 `xinetd`\
  \ 服务。\n\n### 35. 卸载 xinetd 包\n可以卸载 `xinetd` 包。\n\n### 36. 禁用 telnet 服务\n可以使用以下命令禁用\
