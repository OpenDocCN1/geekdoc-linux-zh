- "# 政府级企业 Linux v6：Red Hat 系列 Linux 版本 6 管理与安全指南\n\n\n\n![](img/cover.jpeg)\n\n\n\
  \n![](img/image_17-resized-399-103.jpg)\n\n\n\n\n\n\n\n\n\n\n\n\n# README.md\n\n\
  ## 关于本书\n本书及其配套材料既可用于自学，也可用于课堂教学。虽然本书是专门为美国政府机构的 Enterprise Linux 版本 6 设计的，但此处教授的原理适用于任何在安全意识环境中运行任何\
  \ Linux 版本的的人。\n\n《政府级企业 Linux》最初是一门为支持美国国民卫队的数据库和系统管理员开设的课程。像 Linux 世界的许多事物一样，为特定小基市场开发的工具发现了其他用途。课程的开发演变成了书籍的编写。这催生了\
  \ JANUS 技术学院计划（JANUS Technical Academy Program），该计划目前正在开发涵盖一系列信息主题的课程。我们预计在 2019\
  \ 年为管理员提供专业认证路径。如果您对成为 JANUS 认证 Linux 管理员感兴趣，请发送电子邮件至：academy@janusresearch.com。\n\
  \nJANUS 技术学院根据这些材料提供现场或远程培训。我们还可以提供定制课程开发。如需更多信息，或如果您想成为学术合作伙伴并在您的课堂中使用本课程，请联系 JANUS\
  \ Research Group。\n\n## 入门\n本书旨在在旁边有电脑的情况下阅读，边读边打字。完整的实验设置指南以及所有所需的脚本和文件可以在此处找到：\n\
  \nhttps://github.com/janustechacademy/EL6.\n\n该处还有《实验指南》和《命令摘要》的可打印版本。我们发现，在工作时持有纸质版是最好的。\n\
  \n## 作者\nJohn Timaeus 和 Russell Overton 自古以来一直是 IT 管理员、顾问和讲师。他们目前都与国民卫队签约。\n\n##\
  \ 错误\n我们知道书中存在一些错误；在如此规模的书书中，这些是不可避免的。尽管我们很想归咎别人，但这些完全是我们自己的错。报告请至：academy@janusresearch.com。\n\
  \n## 致谢\n感谢所有帮助我们完成这一过程的人。\n\n- Damon Leavit，我们的课程经理，他给了我们把这一切整合在一起的灵感。\n- David\
  \ Sales，我们的老板，他提供了所需的时间资源来实现这一目标。\n- Reno's Argenta Cafe，负责我们的饮食。\n- 特别感谢：April\
  \ 和 Amanda，她们在整个过程中让我们保持了（某种程度上的）理性。\n\n至少我们没有比开始时更疯狂。\n\n# 模块 0：Linux 简介\n\n##\
  \ 什么是 Linux？\n在这门课中，你将使用几台计算机工作。除了可能的访问终端外，所有计算机都将运行 Linux，这是一种在 1991 年开发的免费开源软件。它是类\
  \ Unix 的，但不是 UNIX™。如果您使用过其他 UNIX 系统，将看到许多相似之处，但您需要意识到，从初始化过程到文件系统层级，很多事情都是不同的。\n\
  \nLinux 操作系统是通过使用 Linux 内核（或核心进程）来定义的。有数百种变体——称为发行版或“distros”——它们都共享相同的内核。有些专门用于\
  \ Web 服务器、防火墙、温控器或手机（Android 手机运行 Linux）。我们将使用来自红帽企业 Linux（Red Hat Enterprise Linux）家族的操作系统。红帽家族中有几个版本是你应该了解的：\n\
  \n- **Fedora** – 红帽的免费版本。由红帽公司拥有，但不受支持。它的发布周期很快，通常处于前沿状态。每个版本仅维护一两年。\n- **Red Hat\
  \ Enterprise Linux (RHEL)** – 非免费版本。由红帽公司拥有并支持。您需要付费支持。其维护周期保证至少 10 年。发布周期较慢，因为\
  \ RHEL 的重点是稳定性。\n- **CentOS** – 另一个免费版本。对 RHEL 源代码的直接编译（红帽根据 GNU 许可发布）。编译期间可能会更改一些小的选项，并移除红帽品牌。没有通过社区付费的支持。\n\
  - **Oracle Linux** – Oracle 的定制发行版；免费下载，但提供付费支持。带有一个名为 Unbreakable Enterprise Kernel\
  \ 的替代内核，在性能和硬件支持方面有一些增强。\n\n其他基于 RHEL 的发行版包括 Rosa、Scientific Linux、Fermi Linux、SME\
  \ Server，以及 EulerOS 和 Inspur K-UX（这些确实符合 UNIX™，但那是另一个故事）。截至 2018 年初，企业 Linux 家族的当前版本是\
  \ 7.5。本课程针对上一个版本的最新稳定版本：Enterprise Linux 6.9，它将支持到 2020 年 11 月。从现在起，我们将操作系统简单称为\
  \ EL6。如果你愿意将其读为红帽、CentOS 或 Oracle Linux，请随意。\n\n可以通过 `cat /etc/redhat-release` \
  \ EL 版本，详情请使用 `uname -a`。\n\n## 用户与组\n在深入研究操作系统的细节之前，我们首先需要对环境进行一些适应。\n\n用户账户分配给最终在\
  \ Linux 环境中操作的个人。根据安全最佳实践，每个用户应关联一个用户账户，大部分工作应在该账户下进行。默认，这些账户存在于系统本地数据库，但在某些环境中，它们可能存储在集中授权服务器上（LDAP\
  \ 或 Active Directory 实现就是示例）。在创建用户账户时，会记录一些基本信息。这些信息是：\n\n\n\n\n\n*   **用户名 (A username)**\
  \ – 这有时被称为“login name”、“logname”或“login”。它是在系统上标识用户的唯一账户名称。它可能简单到只是单个小写字母字符串（例如“jsmith”），也可能包含其他字符（如\
  \ `john.smith34`）。与 Linux 多数事物一样，用户名是区分大小写的。\n*   **用户 ID (A userid)** – 缩写为 `UID`，`userid`\
  \ 是系统内部用于识别目的的数字。例如，根账户（root account）的 `UID` 始终为零 (0)。在大多数现代 Linux 系统中，userid 在创建账户时自动分配，并从\
  \ 501 开始。随着用户在系统中添加或删除，这些数字可能会被循环使用。`UID` 应该对用户账户是唯一的，但在某些情况下，它们可以被分配给多个账户。这并不是一种安全的做法。\n\
  *   **密码 (A password)** – 密码是只有个人用户才知道秘密字符字符串或短语，旨在提供某种身份证明。可以实施各种规则来控制密码的复杂性、安全有效期。虽然可以在没有密码的情况下创建账户（事实上，这是默认行为），但用户在没有密码或机制的情况下无法登录。该账户仍然拥有文件，并在本文介绍范围之外以其他方式使用。出于任何原因，都绝不要与任何人共享密码。管理员不需要用户的密码，也不应向其索要。\n\
  *   **主组 (A primary group)** – 用户账户可以根据共享功能（销售、会计等）或位置（办公室、总部）或管理员认为适当的任何其他因素关联到组。虽然用户账户可以分配给许多组，但总会有一个唯一的组，即主组，它具有优先级。在\
  \ EL6 系统上，任何新用户的默认主组将是一个新创建的组，其名称与登录名相同，该组仅包含该新用户，而不包含其他用户（例如，新用户 `js` 默认对应名为 `jsmith`\
  \ 的新主组）。与用户一样，组也有唯一的数字标识符，我们称之为组 ID（Group IDs），或 `GIDs`。\n*   **主目录 (A home directory)**\
  \ – 这是一个用于存放用户特定文件的目录。例如，控制用户环境某些部分的配置文件将存储在这里。这也是用户在成功登录后会被引导进入的目录。用户通常对其主目录及其内部创建的文件具有完全控制权。\n\
  *   **Shell (A shell)** – 我们稍后会更详细地介绍 shell，但现在请理解，这些是接收用户输入并允许他们操作操作系统的程序。解释 shell\
  \ 最简单的方法是，它是“你正在输入的那个东西”。\n\n综上所述，这些信息定义了 EL6 系统上的用户。\n\n回到组的概念；组是允许分配权限的额外点。如果没有组，我们将很难控制哪些个人应该访问系统上的文件和资源。想象一下，仅使用用户名来控制系统上每个文件、进程和设备的访问。访问控制将迅速变得庞大且难以维护。组提供了一种识别具有相似需求和访问要求的用户集的方法，通过实施这些组，我们可以极大地简化安全系统的管理。\n\
  \n用户在创建账户时，总是会被分配到至少一个组——一个为他们创建的主组。也可能加入其他组。这些额外的成员关系每一个将被称为“附加组”（secondary groups）。\n\
  \n## 内核与 Shell (Kernel and Shell)\n\n内核是系统的核心引擎。它负责直接操作处理器、内存和磁盘等硬件，以及网卡（NIC）和主机适配器（HBA）等硬件。\n\
  \n内核完全控制操作系统，并在启动时加载到系统内存的特殊受保护区域。运行在系统上的其他程序在一个称为“用户空间”（user space）的内存区域运行，并使用系统调用向内核请求操作。\n\
  \n用户不会直接与内核交互。相反，我们有种称为 shell 的专门程序，它们作为我们的命令解释器。shell 将接收我们的命令并将其翻译为内核的请求，以代表我们执行操作。\n\
  \n在 EL6 中，默认 shell 是 Bourne Again SHell，即 `bash`。在典型的登录场景中，用户向登录程序提供用户名和密码，然后登录程序调用内核启动用户指定的\
  \ shell 并将其放入主目录。当用户登录时，他们会看到类似的内容：\n\n```\n[user@host ~]$\n```\n\n这是 shell 提示符，或者，考虑到\
  \ `bash` 作为默认 shell 的极高普及率，它通常也被称为“bash 提示符”。它代表了用户名、主机名以及用户当前占据的目录（也称为“当前工作目录”，或\
  \ `PWD`）。美元符号 `$` 表示非特权用户或非 root 用户。如果我们以 root（全能的超级用户账户）身份登录，通常会看到这个：\n\n```\n\
  [root@host ~]#\n```\n\n井号 `#` 表示 root 的存在。\n\n## 目录与路径 (Directories and Paths)\n\
  \n尽管 Linux 生态系统中提供了大量的图形化环境和程序，但 EL6 的核心是一个命令行驱动的操作系统。这意味着，从用户的角度来看，操作系统看起来像这样：\n\
  \n```bash\n[root@ELG ~]# ls\nbin dev cgroup home lib64 lost+found mnt proc root\
  \ srv selinux tmp usr var\n```\n\n对于新用户来说，这种环境可能很难理解。然而，我们可以说，上面的输出向我们展示了目录列表。在接下来的章节中，我们将简要讨论目录是什么，以及文件和目录是如何结构的。\n\
  \n关于目录到底是什么可以写很多内容，但为了教学目的，我们将它们视为：\n\n*   一系列命名的容器\n*   按层次结构组织\n*   能够包含文件和目录\n\
  \n虽然管理员可以创建任何目录结构，但某些目录是 EL6 中存在的或者是默认存在的。\n\n我们将从由斜杠 `/` 的根目录开始。根目录的功能类似于树的根。所有其他目录都从根向外生长。\n\
  \n```\n/\nvar\n  sub1\n    sub1a\n  sub2\nusr\n  sub1\n```\n\n当其他文件系统被挂载时，它们将被挂载到根文件系统的某个目录下。如果我们需要描述任何文件的位置，可以通过描述从根目录（/）开始的路径来实现。下一节将更详细讨论路径。\n\
  \n### 路径 (Pathing)\n\n任何文件的路径都可以从根目录描述（称为“绝对路径”），也可以从用户的当前工作目录描述（称为“相对路径”）。使用上面的目录布局，`/var`\
  \ 下子目录 `sub1a` 的路径可以描述为：\n\n*   从任何地方的绝对路径：`/var/sub1/sub1a`\n*   从 `/var` 的相对路径：`sub1/sub1a`\n\
  *   从 `/var/sub1` 的相对路径：`sub1a`\n\n注意上面示例中的两个相对路径前面没有 `/`。这是因为路径开头的斜杠表示路径从根目录开始。考虑以下命令字符串，它使用了用于“切换目录”的命令\
  \ `cd`：\n\n```bash\ncd sub1/sub1a\n```\n\n\n\n\n\n此命令的效果完全取决于用户在目录结构中的当前位置（当前工作目录或\
  \ `PWD`）。上述命令可能会：\n\n*   进入 `/etc/sub1/sub1a`（如果 `PWD` = `/etc`）\n*   进入 `/var/sub1/sub1a`（如果\
  \ `PWD` = `/var`）\n*   失败（如果 `PWD` 不包含名为 `sub1` 的目录）\n\n在路径开头加上斜杠会使路径看起来像：`/sub1/sub1a`。这告诉系统从根目录（`/`）开始查找名为\
  \ `sub1` 的目录，然后在该目录下查找 `sub1a`。我们从之前的结构图中可以看出，该目录并不存在。此路径是一个绝对路径，因为它从根目录开始，但方向是错误的。这里有一个有效的路径：\n\
  \n```\n/etc/sub1/sub1a\n```\n\n此路径始终将我们带到 `/etc/sub1` 下的 `sub1a` 目录，无论调用该路径时用户的\
  \ `PWD` 是什么。\n\n每个目录都存在两个特殊条目。它们是：\n\n* `.` 一个点。它代表它所在的目录。\n* `..` 两个点。它们代表此目录的上一级目录。\n\
  \n我们可以通过一个简单的示例来更好地演示这一点。`pwd` 命令将返回用户的当前工作目录。让我们利用它进一步探索这一概念：\n\n### pwd\n```\n\
  /test/1/2\n```\n\n### cd .\n### pwd\n```\n/test/1/2\n```\n在这里，我们调用了 `cd` 来切换目录到\
  \ `.`。由于 `.` 是我们所在位置的代称，`cd` 命令只是成功地将我们留在了原本所在的地方。\n\n### pwd\n```\n/test/1/2\n\
  ```\n\n### cd ..\n### pwd\n```\n/test/1\n```\n\n### cd ../../\n### pwd\n```\n/\n\
  ```\n在这里，我们使用 `cd ..` 从 `/test/1/2` 移动到父目录 `/test/1`。然后我们使用 `cd ../../` 从 `/test/1`\
  \ 向上移动两个目录到达 `/`。\n\n## 标准目录\n\n文件系统层次结构标准（FHS）为 Unix 和 Linux 中的许多文件类型和目录定义了一套标准的名称、位置和权限。其意图是在不同发行版之间提供一致的工作和开发环境。例如，人们预期无论平台如何，都能\
  \ `/etc` 中找到配置文件，在 `/dev` 中找到设备文件。\n\n以下信息直接来自 FHS v2.3：\n\n* `/bin` – 基础命令二进制文件\n\
  * `/boot` – 引导加载程序的静态文件\n* `/dev` – 设备文件\n* `/etc` – 主机特定系统配置\n* `/lib` – 基础共享库和内核模块\n\
  * `/media` – 可移动介质的挂载点\n* `/mnt` – 临时挂载文件系统的挂载点\n* `/opt` – 附加软件包\n* `/sbin` – 基础系统二进制文件\n\
  * `/srv` – 本系统提供的服务数据\n* `/tmp` – 临时文件\n* `/usr` – 次级体系\n* `/var` – 可变数据\n\n此外还有几个特殊目录，它们本身不包含文件，但会像文件一样向用户暴露内核级信息。这些包括：\n\
  \n* `/proc` – 包含运行中的进程\n* `/cgroup` – 限制资源使用的控制组\n* `/dev` – 物理和虚拟设备\n\n## 发布命令\n\
  \n在命令行操作系统环境中工作要求操作员发布语法上正确的指令。Linux 对格式不正确的指令可能相当不宽容，通常会导致执行失败。或许更令人担忧的是一种情况：一个格式错误的命令不幸地成功执行了某些并非我们意图之的操作。\n\
  \nLinux 中的命令字符串可以分为三个主要部分：\n\n* 命令 – 这是我们调用的程序。\n* 选项 – 这些是修改被调用程序默认行为的修饰符。它们通常像这样：`-ef`、`-la`、`-v`\
  \ 或者这样：`--line-numbers`、`--name`\n* 参数 – 这是命令的目标。\n\n它们由空格分隔。换句话说，当 shell 在命令字符串中看到空格时，它假设我们已经完成了该部分的指令并移动到了另一个部分。\n\
  \n让我们简要探索一下。如果我们不带选项或参数直接调用 `ls` 命令，它会执行以下操作：\n\n```\nls\nbin     dev     lab  \
  \    lib64       misc  opt    sbin    sys  var\nboot    etc    lab.tar  lost+found\
  \  mnt     proc  selinux  tmp  web\ncgroup  home  lib      media       net    root\
  \  srv      usr\n```\n\n在这里，`ls` 返回了用户当前工作目录下的文件列表。我们可以通过提供选项更改命令的行为。让我们尝试使用 `-l`（长格式）和\
  \ `-a`（显示所有文件）：\n\n```\nls -la\ntotal 36\ndrwxr-xr-x  5 user root 4096 Oct 27 10:00\
  \ .\ndrwxr-xr-x 20 user root 4096 Oct 27 09:58 ..\n-rw-r--r--  1 user root    0\
  \ Oct 27 10:00 .hidden\n-rw-r--r--  1 user root   45 Oct 27 10:00 bin\ndrwxr-xr-x\
  \  2 user root 4096 Oct 27 10:00 dev\n-rw-r--r--  1 user root   45 Oct 27 10:00\
  \ bin\ndrwxr-xr-x  2 user root 4096 Oct 27 10:00 dev\n-rw-r--r--  1 user root  \
  \ 45 Oct 27 10:00 bin\ndrwxr-xr-x  2 user root 4096 Oct 27 10:00 dev\n-rw-r--r--\
  \  1 user root   45 Oct 27 10:00 bin\ndrwxr-xr-x  2 user root 4096 Oct 27 10:00\
  \ dev\n-rw-r--r--  1 user root   45 Oct 27 10:00 bin\n```\n*(注：此处示例输出存在重复，，翻译时已按原文逻辑处理)*\n\
  )*\ndrwxr-xr-x  2 user root 4096 Oct 27 10:00 dev\n-rw-r--r--  1 user root   45\
  \ Oct 27 10:00 bin\ndrwxr-xr-x  2 user root 4096 Oct 27 10:00 dev\n-rw-r--r--  1\
  \ user root   45 Oct 27 10:00 bin\ndrwxr-xr-x  2 user root 4096 Oct 27 10:00 dev\n\
  -rw-r--r--  1 user root   45 Oct 27 10:00 bin\n```\n*(注：此处示例输出存在重复，，翻译时已按原文逻辑处理)*\n\
  *(修正：)*\n```\ndrwxr-xr-x  2 user root 4096 Oct 27 10:00 dev\n-rw-r--r--  1 user\
  \ root   45 Oct 27 10:00 bin\ndrwxr-xr-x  2 user root 4096 Oct 27 10:00 dev\n-rw-r--r--\
