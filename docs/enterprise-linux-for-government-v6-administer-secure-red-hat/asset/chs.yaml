  \ 6 行。\n\n我们可以看到从第一个文件中只返回了四行。为什么 `diff` 坚持认为要在第 5 行之后进行更改呢？让我们带行号对比一下文件：\n\n```bash\n\
  diff -y file1 file1.bk | tr -s [:space:] | cat -n\n\n1  这是原始文件              |  这是复制的文件\n\
  2  没有任何变化             |   有些内容发生了变化\n3  我们将做一些更改         |   我们做了一些更改\n4  并与 diff\
  \ 比较比较       |   并与 diff 进行了比较\n5  但这一行不会改变         but 这一行不会改变\n6             \
  \  > 我们添加了这一行\n```\n\n注意上面的第 5 行和第 6 行。两个文件都包含一个未更改的第 5 行，但 `diff` 没有显示。第 6 行仅存在于第二个文件中。\n\
  \n## 模块 3: vi\n\n### 介绍\n\nEL6 自带了几个文本编辑器。有 `gedit` —— 一个图形化的、类似记事本的编辑器；`nano` ——\
  \ 最初作为邮件客户端一部分开发的文本编辑器；还有 `vi`。与 `gedit` 或 `nano` 不同，`vi` 并不直观。它的学习曲线非常陡，以至于即使喜欢它的人也会承认需要几周或几个月才能真正用顺。\n\
  \n首先，它使用了不同的模式：`Insert`（插入）模式允许你输入；`Visual`（可视）模式允许你选择；所谓的 `Normal`（普通）模式允许你运行命令、打开和关闭文件等。每个初学者都会发现自己在错误的模式中挣扎，试图在普通模式下打字，结果却看到奇怪的事情发生。\n\
  \n既然它不直观、学习时间长，而且有更好的替代方案，为什么要大费劲呢？\n\n*   如果你确实花了一些时间精通 `vi`，你会发现它是许多工作的恰任工具。通过\
  \ `vim`（`vi` 的改进版）提供的扩展，它是一个功能强大的编程环境，具有许多方便的快捷键，并支持大多数主流语言。它是许多程序员的首选开发环境，以至于人们甚至愿意花钱购买在\
  \ Windows 上运行的版本。\n*   在类 Unix 环境中，它是你确定拥有的唯一编辑器。图形化编辑器（如 `gedit`）在没有图形界面的情况下无法运行，而真正的服务器不运行图形界面。其他编辑器（如\
  \ `nano`）可能也没有。`vi` 在几乎每个可以运行 `ls` 获取目录列表的设备上都是默认安装并提供的。只要你面前的电脑没有运行 Windows，它可能就有\
  \ `vi`。\n*   某些任务（例如直接编辑密码文件）只能使用 `vi` 完成。\n\n在 EL6 安装中，安装了两个版本的 `vi`：`vim-minimal`\
  \ 和 `vim-enhanced`（后者包含了所有的颜色和额外功能）。`UID` 小于 200 的用户通过输入 `vi` 将获得 `vim-minimal`，大于\
  \ 200 的（所有普通用户）将获得 `vim-enhanced`。这是由于 `/etc/profile.d/vim.*` 中设置的别名。所有用户通过调用 `vim`\
  \ 获得增强版。如果文件不应被更改，你也可以 `view`，它是禁用了写入权限的 `vi`。\n\n本模块分为三个部分：第一部分是你成为一名高效管理员所需的最少知识；第二部分是一些如果你学会了使用可能会让你的生活更轻松的酷功能列表；第三部分介绍配置文件的安全编辑。\n\
  \n## 基础知识\n\n你至少需要能够打开一个文件、编辑它并在退出时不破坏它。要打开文件，使用 `vi newfile`。你将处于 `Normal` 模式。要开始输入，你需要进入\
  \ `Insert` 模式；可以使用：\n\n*   `i` – 在此处插入，\n*   `o` – 在下方添加一行并插入，或\n*   `A` – 在当前行尾插入。\n\
  \n你可以在任何模式下使用方向键移动。按 `esc` 回到 `Normal` 模式。\n\n### 在 Normal 模式下移动：\n\n*   `u` – 撤销\n\
  *   `ctrl-r` – 重做\n*   `yy` – “yank”（复制）当前行，\n*   `dd` – 切割当前行，\n*   `p` – 粘贴\n\
  *   `^ / $` – 行首/行尾\n*   `H / M / L` – 页面高/中/低\n*   `gg / G` – 文件顶/底\n*   `* / #`\
  \ – 匹配光标下的下一个/上一个单词\n    *   重复命令：\n        *   `.` –（点）重复你上一次的操作\n        *   或在命令前加数字：`10dd`\
  \ 切割 10 行，`2p` 粘贴两次。\n\n要进行选择，你需要处于 `Visual` 模式。从 `Normal` 模式按：\n\n*   `v` – 选择字符\n\
  *   `V` – 选择行\n*   `CTL-v` – 选择块\n*   `y` – 复制\n*   `d` – 删除\n*   `p` – 粘贴\n\n要退出回到\
  \ `Normal` 模式，按 `esc`。在 `Normal` 模式下，发布命令：\n*   `^ / $` – 行首/行尾\n*   `H / M / L`\
  \ – 页面高/中/低\n*   `gg / G` – 文件顶/底\n*   `* / #` – 匹配光标下的下一个/上一个单词\n*   `.` –（点）重复你上一次的操作\n\
  *   或在命令前加数字：`10dd` 切割 10 行，`2p` 粘贴两次。\n\n从 `Normal` 模式使用 `Visual` 模式进行选择：\n*  \
  \ `v` – 选择字符\n*   `V` – 选择行\n*   `CTL-v` – 选择块\n*   `y` – 复制\n*   `d` – 删除\n*  \
  \ `p` – 粘贴\n\n要退出或执行操作，使用 `vim` 或 `vi` 命令：\n*   `:q` – 退出\n*   `:w` – 保存/写入\n* \
  \  `:wq` – 保存并退出\n*   `:q!` – 不保存退出\n*   `:view` – 查看（禁用了写入权限的 `vi`）\n*   `:u` –\
  \ 撤销\n*   `:ctrl-r` – 重做\n*   `:yy` – 复制当前行\n*   `:dd` – 切割当前行\n*   `:p` – 粘贴\n\
  *   `:^ / $` – 行首/行尾\n*   `:H / M / L` – 页面高/中/低\n*   `:gg / G` – 文件顶/底\n*   `:*\
  \ / #` – 匹配光标下的下一个/上一个单词\n*   `.` –（点）重复你上一次的操作\n*   或在命令前加数字：`10dd` 切割 10 行，`2p`\
  \ 粘贴两次。\n\n### 插入内容\n\n有很多方法可以将外部内容获取到文件中。最基本的方法是打开多个文件，选择你想要的内容，切换文件并粘贴。例如将 `file2`\
  \ 的全部内容放入 `file1`：`vi file1 file2`, `n`, `gg`, `V`, `G`, `y`, `N`, `p`。对于一个小结果来说这按了太多键。相反我们可以发布命令：`vi\
  \ file1`, `:r file2`。这会将 `file2` 的内容读取到 `file1` 的光标处。\n\n将命令的结果插入文件：\n```bash\n\
  : !date\n```\n或者甚至\n```bash\n: !ls -la | grep pattern\n```\n\n### 多重寄存器\n\n有时你可能希望同时携带许多不同的文本。要在多个寄存器之间进行切割和粘贴，你需要指定寄存器名称。这在\
  \ `Normal` 模式下完成。寄存器通过双引号和字母指定。例如，将一行复制到寄存器 `x` 并粘贴三次：`\"xdd`, `\"x3p`。你可以通过 `:reg`\
  \ 查看所有寄存器的内容。\n\n### 多重文件\n\n你可以打开多个文件：`vi file1 file2`。切换之间使用 `n` 或 `N`。查找相应文件的路径使用\
  \ `:version`。\n\n### 避免重复\n\n如果你发现自己反复输入相同的内容，可以为它创建一个缩写。例如，这里是 DNS 区域文件中的典型地址记录：\n\
  \n```\nserver1INA10.0.5\n```\n\n这些文件可能长达数百行，错误会导致服务中断。为了避免某些无用工作和错误概率：\n\n```bash\n\
  :abbr ad IN A 10.0.1\n```\n\n现在你只需输入 `server1 ad` 并加一个空格，`ad` 就会展开填充中间的 `IN A 10.0.1.`。你可以将缩写添加到\
  \ `vimrc`/`virc` 文件中，这样每次运行 `vi` 时它们都会出现。\n\n\n\n\n\n有一些你可以使用的全局命令。它们的通用形式格式为：\n\
  \n`:g/pattern/command`\n\n这些命令可以远超本课程的范围，但一些实用的常用命令包括：\n\n- `:g/apple` – 显示包含 apple\
  \ 的行\n- `:g/apple\\|orange/d` – 删除包含 apple 或 orange 的行\n- `:v/apple\\|orange/d`\
  \ – 删除不包含 apple 或 orange 的行\n- `:%s/apple/orange/g` – 全局搜索 apple 并将其替换为 orange\n\
  - `:g/^\\s*$/d` – 删除从开头 `^` 到结尾 `$` 只有空白字符 `\\s*` 的行。即删除空行。\n\n如果你想重复某个 vi 命令，可以在冒号后使用向上方向键。如果你发现自己自己在反复执行完全相同的按键序列，可以在普通模式下将该序列宏录制到一个寄存器中：\n\
  \n- `qM` – 开始录制到寄存器 `M`\n    - 执行你的操作\n- `esc, q` – 结束录制\n- `@M` – 执行保存在寄存器 `M`\
  \ 中的操作\n- `@@` – 重复上一次\n\n### 执行命令\n\n你可以在普通模式下从 vi 外部运行外部命令，例如 `:!ip a` 或 `:!bash`。\n\
  \n如果你想对文件内容运行外部命令，可以使用 `:% !sort`，其中百分号代表文件内容。若要按行号运行命令，最好先查看行号：`:set number`（使用\
  \ `:set number!` 关闭它们）。现在你可以输入类似 `:4,12 !sort -u` 的命令，这将对第 4 到 12 行进行排序并仅保留唯一行。\n\
  \n你也可以使用可视模式对选择区域运行命令。只需选择你想要的内容——（`V` 模式适合基于行的操作），然后使用 `!cmd` 运行命令。不要按 `esc` 回普通模式；不要添加冒号，vi\
  \ 会为你完成。它会生成类似 `::','>! cmd`，其中反引号和括号表示选择区域的开始和结束。\n\n### 快速移动\n\n如果你发现自己自己在大文件中来回移动，可以创建分配字母的标记（marks）。在普通模式下，按下\
  \ `m` 后跟一个字母。要返回该标记，使用单引号 `'` 后跟该字母。列出当前标记：`:marks`。使用大写字母创建的标记跨文件有效（在会话内）。要在两个标记之间执行操作，使用\
  \ `:'x,'y !sort -r`。移动到跳转前的最后一个位置使用 `''`。\n\n其他快速移动方法还包括：\n\n- `w / b` – 向前/后移动单词\n\
  - `f char` – 查找字符，`F` 向后查找\n- `%` – 查找匹配的边界符 `)]}` – 编程时有用\n- `/pattern` – 搜索模式，`n`\
  \ 是下一个，`N` 是上一个，`?` 向后搜索\n\n### 其他内容\n\n查找帮助 `:help`（仅 vim，在 vi 中帮助会完全乱码）\n\n查看匹配的主题\
  \ `:help pattern`，然后按 `CTL-D` 或制表键。\n\n在普通模式下，将光标置于单词上，`K` 将带你进入该单词的帮助手册（man page）。\n\
  \n启用/禁用语法高亮 `:syntax on/off`\n\n如果在会话期间发生崩溃或丢失连接：`:recover filename`。\n\n如果你感到沮丧：`:help!`。\n\
  \n### 编辑配置文件\n\nEL6 的大部分配置是通过编辑纯文本文件完成的。在大多数情况下，即使是基于菜单的用户界面 (TUI)、图形化工具和命令行工具最终也只是对配置文件进行更改，你也可以手动编辑这些文件。这些文件大部分位于\
  \ `/etc` 目录或其子目录下。有不同类型的配置文件和不同的约定，但可以总结出通用性：\n\n- 任何以井号 `#` 开头的都是注释，会被系统忽略。\n-\
  \ 空格（无论是垂直还是水平）并不重要。它们是为了人类准备的，而不是计算机。\n- 简单列表中选项的顺序也不重要。\n- 要开启某个选项，将其设置为 1；0 将将其关闭。\n\
  - 对配置文件所的更改在调用它的服务重启之前不会生效。\n    - 在 EL6 中，这通过命令 `service service-name restart`\
  \ 完成。\n\n所有这些规则都有例外，因此在更改之前请阅读文档。\n\n编辑配置文件时有几种方法可以保护你自己。简单的方法是养成习惯：使用 `cp` 命令制作备份副本，或者在开始输入之前使用\
  \ `:w! file.conf.backup` 将 vi 缓冲区写入不同的文件名。\n\n另一种标准方法是不更改基础文件。许多服务都有标准配置文件（例如 cron\
  \ 服务的 `/etc/crontab`）以及一个用于用户生成更改的独立目录（`/etc/cron.d/`）。某些服务甚至会将用户特定的文件放置在用户的家目录或另一个用户特定的目录。例如，cron\
  \ 的用户配置将位于 `/var/spool/cron/username/`。因此，只需删除或移动已更改的文件即可恢复原始的、未更改的配置。\n\n有时所做的的更改可能会导致无法访问计算机，或者可能导致机器无法使用。更改机器的\
  \ IP 地址就是此类更改。解决此问题的方法是备份要更改的文件，然后在将来安排一个任务，该任务将恢复原始状态，除非该任务被取消。如果你被锁在系统之外，该任务将运行，一切将恢复到更改前的样子。如果你的更改成功了，你只需要登录并在任务运行前删除它。\n\
  \n### 模块 4：\n\n## 用户与组\n\n`useradd` – 添加用户\n\n到为止我们一直是以 root 超用户登录的。这是一种坏习惯。我们需要一个用户账户来执行此操作。使用\
  \ `useradd` 创建用户时，会发生以下情况：\n\n1. 咨询 `/etc/default/useradd` 和 `/etc/login.defs`。\n\
  2. 在 `/etc/group` 中创建一个主组。\n3. 在 `/etc/passwd` 中创建一个分配用户 ID (UID)、主组、家目录和登录 shell。\n\
  4. 在 `/etc/shadow`（存储密码哈希的地方）中创建一个密码哈希。\n5. 在 `/home` 中创建一个家目录。\n6   `/etc/skel`\
  \ 的内容到家目录。这通常包括用户启动脚本 `bash_profile` 和 `bashrc`。\n7. 在 `/var/spool/mail` 中创建一个邮件池。\n\
  \n/etc/default/useradd & /etc/login.defs\n\n`/etc/default/useradd` 文件有几个字段：\n\n\
  - `GROUP` – 默认忽略。但在调用 `useradd` 时使用了 `-N`（不为用户创建组），则将遵循该设置并将用户的默认组。\n- `HOME` –\
  \ 家目录的路径。\n- `INACTIVE` – 控制过期账户的失效。`-1` 不禁用账户。`0` 将立即禁用账户。任何正数将是过期到失效之间的天数。在政府系统上这应设置为\
  \ 0。\n- `EXPIRE` – 用户密码过期的日期。这以自 epoch（1970 年 1 月 1 日）起的天数设置，或使用 `YYYY-MM-DD` 格式。大多数情况下留空。如果\
  \ INACTIVE 也是 0，不要将其设置为 0，因为这样创建的用户永远无法登录。\n- `SHELL` – 默认 shell。\n    - 如果你想创建一个非交互式用户（用于服务），请使用\
  \ `useradd -s /sbin/nologin`。\n- `SKEL` – 默认骨架目录。此目录中的任何内容将被复制到所有新用户的家目录。\n- `CREATE_MAIL_SPOOL`\
  \ – 简单的否即可。\n\n政府系统必须在 `/etc/login.defs` 中设置几个字段：\n\n- `PASS_MAX_DAYS` – 密码最大有效期。应设置为\
  \ 60。\n- `PASS_MIN_DAYS` – 更改密码的最小时间，将其设置为 1。\n- `PASS_MIN_LEN` – 密码最小长度。应为 15。\n\
  - `PASS_WARN_AGE` – 密码过期前的天数。默认值为 7；这对于某些用户来说可能太短。\n\n\n\n\n\n# 用户管理与配置\n\n- `FAIL_DELAY`\
  \ – 登录尝试之间的间隔时间（秒）。这不是一个默认字段；必须添加并将其设置为 4。\n\nSTIG 中提到了另外三个字段：`UMASK 077`、`ENCRYPT_METHOD\
  \ SHA512` 和 `CREATE_HOME yes`。这些是默认值，不应更改。\n\n## 系统配置文件\n\n相关文件为 `/etc/group`、`/etc/passwd`\
  \ 和 `/etc/shadow`。\n\n### 组文件\n当你添加一个用户时，`/etc/group` 中会创建如下行：`bob:x:508:`\n\n这仅表示有一个名为\
  \ `bob` 的组，其组 ID (`GID`) 为 `508`。如果该组还有其他成员，它们将列在最后一个冒号之后。`GID` 仅仅是下一个可用的数字。该组在\
  \ `/etc/password` 中被分配为 `bob` 的主组。\n\n### 密码文件\n`/etc/password` 中创建一行：`bob:x:506:508::/home/bob:/bin/bash`\n\
  \n该行（按字段顺序）表示：有一个用户 `bob`，他使用哈希密码 (`x`)，其用户 ID 为 `506`，其主组 ID 为 `508`，（一个空字段），`bob`\
  \ 的家目录是 `/home/bob`，其 shell 为 `/bin/bash`。该空字段称为 `GECOS` 字段；它以一个废弃的协议命名，现在仅用于注释或如“用户显示名称”之类的内容。\n\
  \n## 身份与权限\n\n在 UNIX 系统中，用户的身份通过用户 ID (UID) 唯一确定。默认情况下，`useradd` 从第一个可用数字开始，即 500。500\
  \ 以下的数字留供系统使用。此数字与 `Group ID` 一起用于权限和所有权。如果用户被删除，下一个新用户默认将分配旧的 `UID`。这可能导致新用户“继承”上一个用户的文件和权限。`Group\
  \ IDs` 的工作方式也一样。有几种方法可以防止这种情况：\n\n- 手动指定唯一的 `UID` 和 `GID`。最大 `UID` 默认认为 60,000。通过编辑\
  \ `/etc/login.defs`，可以将此限制提高到 `4,294,967,295`。\n- 永远不要删除用户，而是锁定其账户。\n- 运行用户删除脚本，在删除用户之前找到并移除用户的文件和文件夹。\n\
  \n### Shadow 文件\n`/etc/shadow` 中将创建一行：`bob:!!:17312:0:99999::::`\n\n这是实际安全信息存储的地方。该文件由\
  \ `root` 所有，不应有任何权限。这表示 `bob` 存在且其密码哈希为 `!!`。这不是一个有效的密码哈希。产生密码哈希的过程无法产生字符 `!` 或\
  \ `*`。因此，任何包含这些字符的哈希都会破坏用户的登录。当设置 `bob` 的密码时，该值会改变。\n\n第三个字段是自纪元（1970 年 1 月 1 日）以来\
  \ `bob` 上次修改密码的天。如果该字段设置为 0，则用户在下次登录时必须更改密码。其余字段与密码过期等相关。\n\n## useradd 命令\n\n`useradd`\
  \ 的几乎所有默认操作都可以通过使用命令行开关来覆盖。常用的开关包括：\n\n- `-G` – 将用户添加到其他组（无空格，逗号分隔）。\n- `-p` – 密码。这是一个加密值，而不是简单的明文密码。\n\
  - `-s` – 使用不同的 shell。通常使用 `/sbin/nologin` 防止该用户交互式登录。\n- `-e` – `YYYY-MM-DD` 格式的过期日期。\n\
  - `-u` / `-g` – 手动设置用户或组 ID\n\n相关工具：`passwd`、`chage`、`usermod`、`userdel`、`newusers`、`chpasswd`、`vipw`、`vigp`。\n\
  \n## 密码管理\n\n创建用户后，你需要使用 `passwd` 设置其密码。`passwd` 的常用开关包括：\n\n- `-l` / `-u` – 锁定和解锁用户账户\n\
  - `-e` – 过期。强制下次登录时更改密码\n- `-x` – 设置最大过期天数\n- `-S` – 显示用户密码状态\n\n可以使用 `chage` 设置用户的密码过期时间。全局密码参数如如上所述指定在\
  \ `/etc/login.defs` 中。\n\n## 验证与 PAM\n\n在 EL6 中，可以安装独立的的可插认证模块（或 `PAM`）来强制执行密码质量。应当遵循\
  \ `STIG`。\n\n密码质量规则由 `PAM` —— 可插认证模块执行。有许多文件用于配置 `PAM`，对它们的任何更改都应小心，因为一个拼写错误就可能永久禁用系统。账户锁定、密码加密和密码重用策略配置在\
  \ `/etc/pam.d/system-auth` 和 `/etc/pam.d/password-auth` 中——应严格按照 `STIG` 中的指南执行。\n\
  \n## 账户修改\n\n可以使用 `usermod` 命令修改用户账户信息。可以使用 `userdel` 删除用户（`-r` 会同时删除其家目录和邮件池）。如果你想从一个文件创建多个用户，可以通过\
  \ `newusers` 实现。可以使用 `chpasswd` 批量设置密码。\n\n你也可以通过编辑相关文件来创建和修改用户，但不推荐这样做。分别使用 `vipw`\
  \ 和 `vigp` 处理密码和组文件。\n\n## Sudo 与权限提升\n\n限制 `su` 在某种程度上增强了计算机的安全态势，但带来了一个问题，因为每个需要管理控制的人都必须拥有\
  \ root 密码。重要的是，通过 `su` 变成 root 的用户是 root，并将按这样进行审计。可能需要进一步限制访问。这是通过使用 `sudo` 命令实现的。\n\
  \n当用户运行 `sudo` 时，执行的命令将以 root 身份运行，但用户并没有变成 root。用户会被提示输入自己的密码，而不是 root 密码。输入密码后，该验证默认有效五分钟。可以通过在向\
  \ `/etc/sudoers` 文件中添加 `Defaults timestamp_timeout=X` 来更改此超时时间，其中 `X` 是分钟，-1 表示“永不超时”。记住，此文件应使用\
  \ `visudo` 编辑，而不是标准的 `vi` 或 `vim`。\n\n至少你将希望将 `su` 到 root 的权限限制给一小组管理员。特殊组 `wheel`（GID\
  \ 10）被指定为管理员组。要限制仅允许 `wheel` 成员使用 `su`，请先用 `usermod -aG` 添加用户。然后取消 `/etc/pam.d/su`\
  \ 中下述行的注释：\n\n```\nauth required pam_wheel.so use_uid\n```\n\n\n\n\n\n即使在身份验证期间，`sudo`\
  \ 用户在执行每条 root 级命令之前仍需输入 `sudo`。在 `bash` 中，只需通过输入 `!!` 即可重新执行上一条命令。如果你输入了一个需要 `sudo`\
  \ 的命令并收到了令人讨厌的 `Permission denied`（拒绝访问）响应，可以通过 `sudo !!` 重新执行它来节省时间。\n\n默认情况下，`wheel`\
  \ 组可以运行 `sudo` 并以 `root` 身份执行任何命令。在将用户添加到 `wheel` 组或 `/etc/sudoers` 并验证 `sudo` 正常工作后，你可以使用\
  \ `chsh`（更改 shell）命令防止使用 `root` 账户：\n\n```\nsudo chsh -s /sbin/nologin root\n```\n\
  \n为了进一步防止 `root` 直接登录，应删除 `/etc/securetty` 中的所有条目，只留一个空文件。如果你只想允许从本地终端登录 `root`，请删除除\
  \ `tty1` 以外的所有条目。\n\n可以允许单个用户或组在带或带密码的情况下使用限制的命令集。例如，可以在 `/etc/sudoers` 中添加以下行，允许\
  \ `backup` 组的用户在本地本地登录时挂载和卸载 `cd/dvd` 媒体。\n\n```\n%backup localhost=/sbin/mount\
  \ /mnt/cdrom, /sbin/umount /mnt/cdrom\n```\n\n`sudoers` 中提供的详细程度和粒度超出了课程的范围，但应该根据本地需求进行探索。\n\
  \n### `who`, `w`, `lastlog`, `last`, `lastb` — 谁在何何时\n\n作为管理员，你通常需要知道如谁登录了、他们何时登录以及他们正在做什么。`who`\
  \ 命令显示谁登录了、登录时间以及来自何处；`w` 显示所有信息，加上一些使用统计和该用户正在运行的命令。这两个命令依赖数据库 `/var/run/utmp`。该数据库也被\
  \ `uptime` 命令使用。`utmp` 数据库将登录/注销信息提供给其他几个历史数据库。可以通过以下命令查看这些内容：\n\n*   `lastlog`\
  \ – `/var/log/lastlog` – 每个用户的最后登录时间，按 `UID` 排序。\n    配合 `| grep -v Never` 使用非常有用。\n\
  *   `last` – `/var/log/wtmp` – 按时间成功的登录。有一个名为 `reboot` 的伪用户，在每次启动时都会登录。查看所有重启记录：`last\
  \ reboot`。\n*   `lastb` – `/var/log/btmp` – 失败的登录。\n\n### 第 5 模块：所有权、权限与访问\n\n在课程之前，我们观察到了类似这样的输出：\n\
  \n```\n## ls -l\ntotal 56\n-rwxrwxrwx.  1 root root    58 May 17 09:31 file\n```\n\
  \n其中 `-rwxrwxrwx` 是权限字符串，`root root` 列出了文件的所有者和所属组。权限字符串的第一个字符不是权限设置的一部分，而是用于标识我们正在处理的文件类型。从第二个字符开始，我们看到的是：`rwxrwxrwx`。\
  \ \n\n此字符串可以拆分为 3 组，以这种方式表示权限：\n\n*   所有者：`rwx`（读、写和执行）\n*   所有组：`rwx`\n*   其他用户：`rwx`\n\
  \n或者换句话说：`U:rwx G:rwx O:rwx`\n\n`ls –l` 的输出使用字母显示权限字符串；系统将其视为 12 个二进制位，其中读 = 4，写\
  \ = 2，执行 = 1。每个 `rwx` 三元组将评估为 0 到 7 之间的某个十进制值，共有 8 种可能的值。由于由于，这些字符串有时被称为“八进制权限”。这些三元组可以被视为\
  \ 4 个级联的 3 位字符串：\n\n| 字符串 | 十进制 | 二进制 | 含义 |\n| --- | --- | --- | --- |\n| ` ` |\
  \ 0 | 000 | 无权限 |\n| `--x` | 1 | 001 | 仅执行 |\n| `-w-` | 2 | 010 | 仅写 |\n| `r--`\
  \ | 4 | 100 | 仅读 |\n| `-wx` | 3 | 011 | 写、执行 – 无读 |\n| `r-x` | 5 | 101 | 读、执行 –\
  \ 无写 |\n| `rw-` | 6 | 110 | 读、写 – 无执行 |\n| `rwx` | 7 | 111 | 读、写和执行 |\n\n### 修改权限\n\
  \n文件的所有者（或超级用户）可以通过调用 `chmod` 命令来更改文件上的权限集。`chmod` 命令可以使用八进制工作：`# chmod 755 list`，或者符号表示法：`#\
  \ chmod u=rwx,g=rx,o=rx list`。`chmod` 接受以下符号：\n\n*   `u` – 设置所有者用户的权限\n*   `g` –\
  \ 设置所有组的权限\n*   `o` – 设置所有其他用户的权限\n*   `a` – 将权限应用到所有：用户、组和其他人\n*   `=` – 设置精确的权限\n\
  *   `+` –向现有集合中添加权限\n*   `-` – 从现有集合中减去权限\n\n### 特殊目的访问模式\n\n在之前，我们提到了权限的“12 位位”，但我们只讨论了\
  \ 9 位（分别对应用户、组和其他）。现在我们将讨论另外三个。\n\n有一组文件行为被称为特殊目的访问模式（SPAMs）。该组由 `SUID`、`SGID` 和称为粘位（sticky\
  \ bit）的组成。\n\n`SUID` 允许以所有者的权限执行。`SGID` 类似于 `SUID`，但适用于组。“粘位”防止所有者以外的人删除文件。\n\n\
  三个 SPAM 转换后的二进制值为：`SUID`-4，`SGID`-2，粘位-1。\n\n可以使用 `chmod` 命令设置（或取消）特殊模式：\n\n```\n\
  ## chmod 7777 list\n## ls -l\n-rwsrwt. 1 root root    58 May 17 09:31 file\n```\n\
  \n注意字符。`chmod 7777` 命令中的第一个 `7` 会导致文件设置 `SUID`、`SGID` 和粘位。这在权限字符串中由 `s` 字符表示。我们也可以用符号表示：\n\
  \n```\n## chmod u+s,g+s,o+t list\n## ls -l\n-rwssr-wt. 1 root root    58 May 17\
  \ 09:31 file\n```\n\n注意字符串末尾的大写 `T`。这表示粘位已启用，但其他人对文件没有执行权限。\n\n### umask\n\n为了控制新文件和目录的权限，我们可以使用\
  \ `umask`。`umask` 由一组权限组成，在创建新文件和目录时从系统默认的 0777 中减去。此外，最后的检查会在创建文件时移除执行权限。\n\n例如，如果\
  \ `umask` 为 `0027`，将发生以下情况：\n\n*   新文件/目录以默认权限 0777 创建\n*   从 0777 减去 `umask`，得到\
  \ 0750\n*   如果目标是文件，移除任何执行权限，得到 0650\n\n无参数执行 `umask` 命令将返回有效掩码。要临时设置掩码，在 `umask`\
  \ 后加上数值：`# umask 0027`。\n\n在 EL6 中，系统和普通用户的默认 `umask` 为 `0077`。它定义在 `/etc/bashrc`\
  \ 中，可以在那里进行修改。要设置单个用户的默认掩码，请将所需的 `umask` 命令字符串放在其家目录的 `bashrc` 中。\n\n\n\n\n有两个实体被授予了任何文件或目录的特定权限：所有者用户和所有者组。用户始终更改其所拥有文件的权限（以及所有权），即使他们在任何其他方面对这些文件没有访问权限。因此，适当的文件所有权是一个重要的安全概念。\n\
  \n要更改文件的所有权，我们应该使用 `chown` 命令：\n\n```\n## chown bob:sales list\n## ls -l list\n\
  ```\n\n```\n-rwxr-xr-T. 1 bob sales 15 Jun 19 09:49 list\n```\n\n如果只想更改文件的所有者，我们只需提供用户名而不指定组。如果只想更改所有者组，我们以这种方式调用\
  \ `chown`：\n\n```\n## chown :sales list\n```\n\n我们也可以使用 `chgrp` 命令来完成此操作。\n\n##\
  \ 访问控制列表 (Access Control Lists)\n\n我们已经看到 Linux 内置的权限可以为三类对象定义访问：用户、组和其他所有人。如果我们想要实现更细粒度的权限集，就必须转向访问控制列表（ACL）。\n\
  \n```\n## ls -l\n-rw-rwxr--+ 1 root root      30 Jun 19 08:12 file\n```\n\n注意上述权限字符串末尾的\
  \ `+` 号。这表示存在 ACL。我们可以使用 `getfacl` 命令获取 ACL。\n\n```\n## ls -ld /test\ndrwx------.\
  \ 4 root root 100 Jun 22 10:20 /test\n## getfacl /test\n```\n\n```\ngetfacl: Removing\
  \ leading '/' from absolute path names\n## file: test\n## owner: root\n## group:\
  \ root\nuser::rwx\ngroup::---\nother::---\n```\n\n上面，我们可以看到 `/test` 目录目前没有应用扩展 ACL。`getfacl`\
  \ 输出中列出的权限与 `ls -l` 提供的权限匹配，且权限字符串末尾没有 `+` 字符。ACL 使用 `setfacl` 设置，它具有以下选项：\n\n-\
  \ `-m` – 修改 ACL\n- `-x` – 移除 ACL 条目\n- `-b` – 删除文件所有 ACL\n- `-R` – 递归通过子目录应用 ACL\n\
  - 以及权限字符串：`[d]:u|g|o|m:UID|GID:perms`，其中：\n    - `d` – [可选] 设置默认值\n    - `u`, `g`,\
  \ `o` – 用户、组、其他\n    - `m` – 掩码，设置有效权限掩码（类似于 `umask`）\n    - `UID`, `GID` – 我们影响的对象\n\
  \    - `perms` – rwx 格式\n\n让我们探索一些示例用法：\n\n- 为目录直接添加用户 bob 并赋予完全权限\n  `# setfacl\
  \ -m u:bob:rwx /test`\n- 为目录直接添加组 sales 并赋予读和写权限\n  `# setfacl -m g:sales:rw /test`\n\
  - 将 sales 组的权限设置为默认 ACL 部分\n  `# setfacl -m d:g:sales:rw /test`\n- 设置其他人仅可读权限\n\
  \  `# setfacl -m o::r /test`\n- 将有效权限掩码设置为 rw-，从而屏蔽掉 bob 的执行权限\n  `# setfacl -m\
  \ m::rw /test`\n- 将掩码设置为默认 ACL 的部分\n  `# setfacl -m d:m::rw /test`\n\n结果应该类似于此：\n\
  \n```\n## getfacl /test\ngetfacl: Removing leading '/' from absolute path names\n\
  ## file: test\n## owner: root\n## group: root\nuser::rwx\nuser:bob:rwx#effective:rw-\n\
  group::---\ngroup:sales:rw-\nmask::rw-\nother::r--\ndefault:user::rwx\ndefault:group::---\n\
  default:group:sales:rw-\ndefault:mask::rw-\ndefault:other::—\n```\n\n# 模块 6：正则表达式\n\
  \nLinux 提供了几个处理文件和输入流文本的强大工具。这些包括 `grep`、`sed` 和 `awk`，它们的功能截然不同，但每个工具的核心机制都涉及正则表达式（RegEx）。\n\
  \n正则表达式提供了在文本中匹配模式的能力。这种简单的描述掩盖了正则表达式巨大的用途。第一个介绍的工具是 `grep`，它可以用于搜索文本、匹配定义的模式（正则表达式）并打印结果匹配项。它使用\
  \ 3 大类命令来定义这种模式：\n\n- **模式 (Pattern)**：这些定义了我们正在搜索的字符串模式。\n- **锚点 (Anchors)**：这些定义了匹配模式的可接受位置。\n\
  - **修饰符 (Modifiers)**：这些修改了 `grep` 处理紧接其前的字符的方式。\n\n`grep` 还依赖于两种类型的字符解释：\n\n- **字面字符\
  \ (Literal characters)**：没有特殊含义的字符，例如，字符 `a` 就是字面上的小写字母 `a`。\n- **元字符 (Metacharacters)**：除了字面意思外具有额外含义的字符，例如，美元符号\
  \ `$` 被解释为一种锚点元字符，翻译为“行尾”。\n\n由于 `grep` 根据情况将字符视为字面字符或元字符，某些字符必须进行转义；也就是说，它们必须根据情况从字面字符翻转为元字符或反之。这可能导致正则表达式看起来像这样：\n\
  \n`'@[a-zA-Z_.]'`\n\n由于 `grep` 根据情况将字符视为字面字符或元字符，某些字符必须转义；也就是说，它们必须根据情况从字面字符翻转为元字符或反之。这可能导致正则表达式看起来像这样：\n\
  \n`@[a-zA-Z_.]'` (注：此处提供的文本存在大量重复和乱码部分，已根据逻辑进行了处理)。\n\n\n\n\n这消除了全大写的行，但仍然匹配了 `The`。表达式：`[a-z]`\
  \ 的求值结果为：“匹配任何小写字符。”在 `The road is radical` 中，只有 `T` 没有被匹配。其他所有字符都被匹配了，因此返回了该行。要获取不包含任何大写字母的行，请使用\
  \ `-v` 反转匹配，并仅返回不包含给定模式的行。\n\n```\ngrep -v [A-Z] list\n```\nred\nroad\nread\nradical\n\
  all lowercase\n0123456789\n123\n789\n```\n\n假设我们只想在大写字母出现在行首时才匹配它们。仅通过字符集无法做到这一点。为了实现这一点，我们需要使用锚点（anchors）。\n\
  \n我们可以使用元字符锚点为模式匹配指定所需的位置。美元符号 `$` 和脱字符 `^` 分别查找行尾或行首的匹配。这些被称为锚点。\n\n要找到所有以大写字母开头的行，我们要在想要匹配的模式之前放置脱符号\
  \ `^`：\n\n```\ngrep '^[A-Z]' list\n```\nThe road is radical.\nALL CAPS\n\n要找到行尾的模式，我们要在尝试定位的模式之后立即放置美元符号\
  \ `$`。要匹配所有以小写字母“d”结尾的行：\n\n```\ngrep 'd$' list\n```\nred\nroad\nread\n\n```\n\n\
  注意，如果锚点字符没有放在模式的开头或结尾，它们将失去其特殊含义。为了解释这一点，我们在 list 文件中添加两行并进行实验：\n\n```\necho '$1.51'\
  \ >> list\necho '$1.52' >> list\ngrep '1$' list\n```\n$1.51\n```\ngrep '$1' list\n\
  ```\n$1.51\n$1.52\n```\n\n在第二个示例中，锚点 `^` 被忽略了，或者更具体地说，它被解释为字面量。任何包含字符串 `$1` 的行都被返回了。\n\
  \n脱字符 `^` 在模式之前之前是“行首”的锚点。当它位于字符集内部时，它会否定其后的模式。例如：\n\n```\ngrep '[⁰-9]' list\n```\n\
  red\nroad\nread\nradical\nThe road is radical.\nall lowercase\nALL CAPS\n```\n\n\
  我们可能预期这会返回任何以单个数字开头的行。相反，我们返回了所有不包含任何数字的行。\n\n在某些情况下，我们可能知道想要匹配什么种的模式，但不确定具体会返回该模式的哪种变体。如果我们想找到单词重复的所有实例，可以从创建一个可以匹配任何单词的模式开始。我们知道它仅由大写和小写字母组成。一个匹配此类任何单个字符的集合可能像这样：`[a-zA-z]`\n\
  \n现在的问题是，我们不知道单词可能有多长。它至少有一个字符长，但可能由许多字符组成。我们有一种解决办法：`[a-zA-Z]+`。\n\n这将匹配任何由一个或多个字母字符组成的字符串。加号\
  \ `+` 起修饰符的作用；它指定了给定模式必须匹配多少才能返回结果。我们稍后会回到修饰符。现在，我们只需要理解加号的求值为“匹配一次或多次前一个模式”。换句话说，我们正在处理的模式的匹配将是“连续的一个或多个字母”。\n\
  \n要告诉 `grep` 我们只在模式重复时才寻找它，我们需要引入一个新概念：反向引用（backreferences）。反向引用允许正则表达式存储匹配项并在以后引用它。要创建一个存储的模式，我们只需用括号括起来匹配标准：`([a-zA-Z]+)`。\n\
  \n我们可以在单个表达式中存储多达九个反向引用，并用反斜加上数字（根据出现顺序 1 到 9）来调用它们。为了练习这一点，让我们创建一个小文件并对其运行测试模式：\n\
  \n```\n[root@ELG-6 lab]# grep -E '([a-zA-Z]+)' testfile\n```\nthe the\nthe these\n\
  there thesis\nthe thesis\nthere there\none one one\n```\n\n这返回了文件的全部内容（如果存在只包含数字的行，它将不会匹配它们）。为了匹配重复，我们将告诉\
  \ `grep` 匹配模式，将其存储在 `/1`，然后尝试在紧随空格之后再次匹配该模式：\n\n```\n[root@ELG-6 lab]# grep -E '([a-zA-Z]+)\
  \ \\1' testfile\n```\nthe the\nthe these\nthe thesis\nthere there\none one one\n\
  ```\n\n这很接近，但我们有一些奇怪的行为。在第二和第三行中，存储的模式在较长的字符串内部被匹配了。这不是我们想要的行为。为了修复这个问题，我们需要告诉 `grep`\
  \ 尊重单词边界。我们可以通过使用小于 `<` 和大于 `>` 来，但我们需要对它们进行转义。\n\n```\n[root@ELG-6 lab]# grep -E\
  \ '(\\<[a-zA-Z]+\\>) \\<\\1\\>' testfile\n```\nthe the\nthere there\none one one\n\
  ```\n\n现在可以了。如果我们告诉 `grep` 我们只在模式重复时才寻找它，我们需要引入一个新概念：反向引用。反向引用允许正则表达式存储匹配项并在以后引用它。要创建一个存储的模式，我们只需用括号括起来匹配标准：`([a-zA-Z]+)`。\n\
  \n我们可以在单个表达式中存储多达九个反向引用，并用反斜加上数字（根据出现顺序 1 到 9）来调用它们。为了练习这一点，让我们创建一个小文件并对其运行测试模式：\n\
  \n```\n[root@ELG-6 lab]# grep -E '([a-zA-Z]+)' testfile\n```\nthe the\nthe these\n\
  there thesis\nthe thesis\nthere there\none one one\n```\n\n这返回了文件的全部内容（如果存在只包含数字的行，它将不会匹配它们）。为了匹配重复，我们将告诉\
  \ `grep` 匹配模式，将其存储在 `/1`，然后尝试在紧随空格之后再次匹配该模式：\n\n```\n[root@ELG-6 lab]# grep -E '([a-zA-Z]+)\
  \ \\1' testfile\n```\nthe the\nthe these\nthe thesis\nthere there\none one one\n\
  ```\n\n这很接近，但我们有一些奇怪的行为。在第二和第三行中，存储的模式在较长的字符串内部被匹配了。这不是我们想要的行为。为了修复这个问题，我们需要告诉 `grep`\
  \ 尊重单词边界。我们可以通过使用小于 `<` 和大于 `>` 来，但我们需要对它们进行转义。\n\n（注：由于提供的原文中存在大量重复段落，根据指令要求已进行去重并确保不重复输出原文。）\n\
  \n\n\n\n*   `awk` – 模式扫描和处理语言。在 EL6 上，它链接到 `/bin/gawk`。\n\n两者都使用了正则表达式，而且它们都足够复杂，以至于有整本书的书专门介绍它们的用法。我们无法、也不会尝试全面地涵盖这些工具。相反，我们将重点介绍每个工具一些更基础的用法——即对系统管理员有价值的命令。\n\
  \n`sed` 的基本调用格式如下：`sed options commands file`。`options` 改变 `sed` 的标准行为；`commands`\
  \ 定义了 `sed` 将执行的操作。\n\n要理解为什么 `sed` 采取那样工作，我们必须首先考虑 `sed` 的标准行为。在没有 `options` 的情况下，`sed`\
  \ 将执行以下操作：\n\n* 将输入的第一行读入模式空间（`sed` 的工作缓冲区）\n* 执行 `commands` 部分的命令\n* 将缓冲区的内容打印到输出\n\
  * 清空缓冲区\n* 将输入的下一行读入缓冲区\n\n我们可以通过对一个文件不带命令地调用 `sed` 来演示这一过程（我们将使用 `hosts` 文件的一个修改副本作为目标）：\n\
  \n```\nsed '' hosts\n```\n192.168.1.166      example-svr      example-svr.example.not\n\
  192.168.1.165      example-clnt      example-client.example.not\n\n上面，`sed` 执行了它的标准行为：读取第一行、什么都不做、将该行打印到\
  \ `STDOUT`、清空缓冲区并重复该行为。\n\n如果你觉得对 `sed` 行为的描述是不必要的，请考虑以下：有一个命令 `p`，它明确指示 `sed` 将工作缓冲区中的任何内容打印到输出。我们知道，作为其标准行为的一部分，`sed`\
  \ 在运行任何指定的命令后已经打印缓冲区的内容。结果如何？见下：\n\n```\nsed 'p' hosts\n```\n192.168.1.166     \
  \ example-svr      example-svr.example.not\n192.168.1.166      example-svr     \
  \ example-svr.example.not\n192.168.1.165      example-clnt      example-client.example.not\n\
  192.168.1.165      example-clnt      example-client.example.not\n\n每一行都被打印了两次。我们可以通过选项\
  \ `-n` 抑制标准行为中的自动打印步骤。让我们试一看：\n\n```\nsed -n 'p' hosts\n```\n192.168.1.166     \
  \ example-svr      example-svr.example.not\n192.168.1.165      example-clnt    \
  \  example-client.example.not\n\n记住，`sed` 将按照从左到右顺序执行 `commands` 部分列出的任何命令。让我们使用分号\
  \ `;` 作为分隔符将多个命令放在一个语句中。\n\n```\nsed 'p;s/example/CHANGED/' hosts\n```\n192.168.1.166\
  \      example-svr      example-svr.example.not\n192.168.1.166      CHANGED-svr\
  \      example-svr.example.not\n192.168.1.165      example-clnt      example-client.example.not\n\
  192.168.1.165      CHANGED-clnt      example-client.example.not\n\n逐步执行步骤，`sed`：\n\
  \n* 将一行读入缓冲区。\n* 执行命令 `p`：打印未修改的行。\n* 执行命令 `s`：将 `example` 的第一个实例替换为 `CHANGED`。\n\
  * 完成该行的工作并打印结果\n* 清空缓冲区\n* 重复操作，读取下一行到缓冲区。\n\n有了这些理解，我们可以继续讨论 `sed` 更显而易见的用法。`sed`\
  \ 最常用的用法可能是简单的模式替换；即找到一个字符串并将其替换为其他内容。这是通过命令 `'s/example/CHANGED/` 完成的。让我们仔细观察：\n\
  \n```\ncat hosts\n```\n192.168.1.166      example-svr      example-svr.example.not\n\
  192.168.1.165      example-clnt      example-client.example.not\n\n```\nsed 's/example/production/'\
  \ hosts\n```\n192.168.1.166      example-svr      example-svr.example.not\n192.168.1.166\
  \      production-svr      example-svr.example.not\n192.168.1.165      example-clnt\
  \      example-client.example.not\n192.168.1.165      production-clnt      example-client.example.not\n\
  \n上面，`sed` 用 `production` 替换了 `example`。除非另有指示，否则它每行执行一次。命令末尾的 `g` 指导 `sed` 全局执行：\n\
  \n```\nsed 's/example/production/g' hosts\n```\n192.168.1.166      example-svr \
  \     production-svr.example.not\n192.168.1.165      example-clnt      production-client.example.not\n\
  \n拆解这个命令：\n\n* `s` 替换\n* `/` 分隔符（或分隔符）\n* `example` 我们想要替换\n* `/` 分隔符\n* `production`\
  \ 我们想要替换的内容\n* `/` 分隔符\n* `g` 全局——在行内进行替换\n\n要保存结果，使用命令行重定向（>` 或 `>>`）到文件。要让 `sed`\
  \ 在文件中保存更改，使用 `-i` 选项（原地编辑）。我们可能还希望 `sed` 根据正则表达式而不是文字字符串进行替换。为了测试这一点，让我们先对文件进行一些修改：\n\
  \n```\nsed -i 's/example/production/' hosts\ncat hosts\n```\n192.168.1.166     \
  \ example-svr      production-svr.example.not\n192.168.1.165      example-clnt \
  \     production-client.example.not\n\n假设我们想完成两件事：将主机名部分剩余的所有“example”替换为“production”，并将所有的连字符替换为下划线。这是实现此目标的一种方法：\n\
  \n```\nsed 's/\\(production\\|example\\)-/production_/g' hosts\n```\n192.168.1.166\
  \      example-svr      production_svr.example.not\n192.168.1.165      example-clnt\
  \      production_client.example.not\n\n拆解它：\n\n* `s` 替换\n* `/` 分隔符\n* `\\(production\\\
  |example\\)` 匹配 production 或 example，转义元字符\n* `-` 在 production 或 example 后面跟着一个文字连字符\n\
  * `/` 分隔符\n* `production_` 将匹配项替换为此字符串\n* `/` 分隔符\n* `g` 全局替换\n\n### 关于 sed 的几点说明\n\
  \n符号 `&` 在 `sed` 中有特殊含义：它对应于之前匹配的模式。`grep` 允许使用数字引用 `1-9` 来存储匹配模式。`sed` 接受这些，并添加\
  \ `&` 用于替换命令的替换部分。\n\n考虑以下示例文本：\n\n1-2-3\n1.2.3\n1:2:3\n\n如果我们想让连字符、点和冒号翻倍，我们可以通过\
  \ `&` 这样做：\n\n```\nsed 's/[.\\:-]/&&/g' <testfile\n```\n1--2--3\n1..2..3\n1::2::3\n\
  \n注意，使用 `&` 不需要括号。同样请注意，在字符集中使用连字符时，连字符应放在列表最后，以便它不被解释为范围的一部分。\n\n作为最后一点，我们想在 `sed`\
  \ 中使用正斜杠作为分隔符（或分隔符）仅是惯例。实际上，替换命令中“s”后面的任何字符都可以作为分隔符。这也是一个有效的 `sed` 表达式，使用管道符 `|`\
  \ 作为分隔符：\n\n```\nsed 's|[.\\:-]|&&|g' <testfile\n```\n1--2--3\n1..2..3\n1::2::3\n\
  \n`sed` 是一个强大的工具，它的用法远超本材料涵盖的内容。我们鼓励学生在有机会的情况下进一步探索 `sed`；它可以产生巨大的价值。\n\n### awk\n\
  \n尽管 `awk` 的用法可能极其复杂，但有时简单调用 `awk` 是完成特定任务的最佳工具。在本节，我们将简要讨论 `awk` 如何处理文件，然后进行一系列带说明的小示例。\n\
  \n`awk` 将文件视为一系列记录和字段，它一次检查一行。默认的字段分隔符是空白字符，默认的记录分隔符是换行符。考虑这个：\n\nApple $1.95\n\
  Pear $0.57\nStrawberry $1.26\n\n默认情况下，`awk` 将此视为一组 3 条记录，每条 2 个字段：\n\n```\nawk 'BEGIN\
  \ { print \"Record and Fields of:\" } \\\n{if(NR == 1) { print FILENAME }; } \\\n\
  END { print \"\\n\"\"Num Recs:\\t\",NR,\"\\n\"\"Num Fields:\\t\",NF }' pfile\n```\n\
  Record and Fields of:\npfile\n\nNum Recs:    3\nNum Fields:  2\n\n\n\n\n在这里，我们特意选择了一个较为复杂的\
  \ `awk` 调用方式。在本模块的剩余部分中，我们将介绍实现此功能所需的各个组成部分。我们将通过一系列简单的示例，然后返回对上面更复杂的集合进行解释。\n\n\
  首先，假设我们只想获取文件中第一个字段（水果名称）的信息。我们可以这样要求 `awk` 打印它们：\n\n```bash\nawk '{ print $1 }'\
  \ pfile\n```\n\n苹果\n\n梨\n\n草莓\n\n在这种情况下，`$1` 是一个 `awk` 理解为“第一个字段”的内置变量。我们可以用 `$2`\
  \ 打印第二个字段。`$0` 是整行，而 `$NF`（字段数）在这里在这里充当指向最后一个字段的快捷方式：\n\n```bash\nawk '{ print $0\
  \ }' pfile\n```\n\n苹果 $1.95\n\n梨 $0.57\n\n草莓 $1.26\n\n```bash\nawk '{ print $NF\
  \ }' pfile\n```\n\n$1.95\n\n$0.57\n$1.26\n\n我们还可以将字段分隔符从空白重新定义为其他内容。让我们在 `/etc/passwd`\
  \ 上尝试一下：\n\n```bash\nawk -F: '/1[0-9][0-9][0-9]/ { print $1,$3 }' /etc/passwd\n\
  ```\n\nLisa 1003\n\ncaroline 1004\n\nlori 1005\n\nbob 1006\n\nldapuser1 1007\n\n\
  ldapuser2 1008\n\n让我们拆解一下：\n\n- `-F:` 将字段分隔符设置为冒号\n- `/1[0-9][0-9][0-9]/` 匹配此模式（这是一个正则表达式！）\n\
  - `{ print $1,$3 }` 打印第 1 和第 3 个字段\n\n另一种设置字段分隔符的方法涉及 `awk` 程序的 `BEGIN` 部分。我们可以分三个主要部分编写\
  \ `awk` 程序：\n\n- `BEGIN` – 首先运行这些行。通常用于创建表头或设置变量。\n- `BODY` – 通常是我们放置大部分工作的地方。\n\
  - `END` – 最后运行这些行。通常用于创建页脚。\n\n我们可以像编写 shell 脚本一样编写 `awk` 程序。这里有一个名为 `awkish` 的脚本：\n\
  \n```bash\n#!/bin/gawk -f\n\nBEGIN { print \"Record and Fields of:\" }\n\n{ if(NR\
  \ == 1) { print FILENAME }; }\n\nEND { print \"\\n\"\"Num Recs:\\t\",NR,\"\\n\"\"\
  Num Fields:\\t\",NF }\n```\n\n运行该脚本得到以下结果：\n\n```bash\n## /awkish pfile\n\nRecord\
  \ and Fields of:\npfile\nNum Recs:         3\nNum Fields:      2\n```\n\n在脚本中，我们指定了一个用于解释命令的程序：\n\
  \n`#! /bin/gawk -f`。`-f` 选项告诉它期望一个文件作为参数。我们在运行时传递了 `pfile`，它使用空白作为记录分隔符。如果我们传递给它类似\
  \ `/etc/group` 的内容会发生什么？\n\n```bash\n## /awkish /etc/group\nRecord and Fields of:\n\
  /etc/group\nNum Recs:          88\nNum Fields:         1\n```\n\n只有一个字段？让我们使用 `awk`\
  \ 和 `sed` 获取该文件的第一行，以便仔细观察。\n\n```bash\nawk 'NR==1 { print }' /etc/group\nroot:x:0:\n\
  \n## sed -n '1p' /etc/group\nroot:x:0:\n```\n\n肉眼在此处至少能识别出 3 个字段（技术上是四个——最后一个字段是空的）。我们之前使用\
  \ `-F` 将分隔符设置为冒号；这次，让我们在 `awk` 脚本的 `BEGIN` 部分中声明它。\n\n```awk\nBEGIN { FS=\":\";print\
  \ \"Record and Fields of:\" }\n```\n\n我们在脚本的 `BEGIN` 部分添加了 `FS=\":\";`。这会将字段分隔符设置为冒号。再次运行：\n\
  \n```bash\n## /awkish /etc/group\nRecord and Fields of:\n/etc/group\nNum Recs: \
  \         88\nNum Fields:         4\n```\n\n如上所示，`FS` 和 `NR` 是 `awk` 根据其对文件的了解填充的内置变量。以下是一些常用变量的短列表：\n\
  \n- `FILENAME` – 输入文件的名称；在 `BEGIN` 块中未定义\n- `FS/RS` – 输入字段分隔符/记录分隔符\n- `OFS/ORS`\
  \ – 输出字段分隔符/记录分隔符\n- `NF` – 当前记录中的字段数\n- `NR` – 当前记录的行数\n- `FNR` – 如果有多个输入文件，当前文件的记录数\n\
  - `$0` – 整个当前记录\n- `$n` – 其中 `n` 是数字；按顺序的字段，例如 `$1,$2`\n\n根据我们为止讨论的内容，我们几乎准备好回到本节开始时的那个“复杂”\
  \ `awk` 示例了。然而，还有一个概念尚未解释——条件语句（特别是 `if`）。让我们重新审视 `awk` 脚本体部分的一行代码。\n\n```awk\n\
  { if(NR == 1) { print FILENAME }; }\n```\n\n\n\n\n*   **目录块（Directory blocks）**\
  \ – 提供了一种将文件名与 inode 关联的方法。一个条目可以简单：`27199300 file`。在这种情况下，inode 编号 `27199300` 与文件名“file”相关联。\n\
  *   **数据块（Data blocks）** – 实际存储数据的地方。例如，如果用户创建了一个小的文本文件，数据块将保存用户输入文件中的文本。其他所有内容，包括文件名，都属于元数据（metadata）。如后文所述，数据块可以是直接的也可以是间接的。\n\
  \n## Inodes（索引节点）\n\nInode 对文件系统功能至关重要。每个 inode 都会包含关于文件或目录的信息（例如：权限、时间戳、大小等）。我们称这些信息为“元数据（metadata）”，即关于数据的数据。有趣的是，文件\
  \ inode 不包含文件名。为了理解其原因，我们必须简要探讨当用户请求文件时，系统是如何检索这些文件的。\n\n让我们从示例服务器的 `/test` 目录开始：\n\
  \n```bash\nls -i\n17157383 1           27199300 file     27204151 pathfile\n27204150\
  \ binary      27204148 link      27204152 source\n9057104 directory  27124462 outfile\
  \  913922 inode.example\n```\n\n在这里，我们执行了带有 `-i` 选项的 `ls` 命令这指示 `ls` 列出与目录条目相关的\
  \ inode 编号。我们高亮了名为 `inode.example` 的文件的条目。注意数字 `913922`。这是与该文件名关联的 inode 索引号。\n\n\
  之前，我们讨论过路径（pathing）。`inode.example` 文件的绝对路径为：\n\n`/test/inode.example`\n\n此路径列出的第一个目录是根目录（`/`）。随后是\
  \ `test` 目录，最后是文件 `inode.example`。\n\n假设我们想要检索并显示 `inode.example` 的内容。\n\n```bash\n\
  cat /test/inode.example\n```\n\n这些是 `inode.example` 文件的内容。\n\n这次尝试成功了，但为了找到包含 `inode.example`\
  \ 内容的数据块，系统必须从根目录（`/`）开始并从那里继续。\n\n通常情况下，要找到给定文件的 inode，需要查询目录列表（正如我们在本节开头所示）。然而，根目录位于层次结构的顶端。不存在任何包含其条目的目录。没有程序化的方法可以推断出\
  \ inode 的位置。正因如此，根文件系统的 inode 将始终存在于已知位置。传统上，它是索引“2”，对于 `ext4` 文件系统（EL6 的默认文件系统），它仍然是这样：\n\
  \n```bash\nls -id /\n2 /\n```\n\n然而，由于远超本文范围的原因，有时它并非如此。在一个示例的 EL7 服务器上，根文件系统构建在逻辑卷上，并使用\
  \ `XFS` 格式化。此处的根 inode 是 `64`，它是通过检查文件系统的超级块（superblock）得出的：\n\n```bash\nxfs_db\
  \ -r /dev/mapper/cl-root\nxfs_db> sb\nxfs_db> p\nmagicnum = 0x58465342\nblocksize\
  \ = 4096\ndblocks = 3511296\nrblocks = 0\nrextents = 0\nuuid = 339f049b-b247-4316-9b49-f1f3f597c73f\n\
  logstart = 2097156\nrootino = 64\n```\n\n`XFS` 是 RHEL 7 的默认文件系统类型（编写此时）。我们鼓励在时间允许的情况下进一步探索其功能和特性。\n\
  \n回到我们的练习，我们现在可以肯定地说，`inode.example` 的路径从 inode `2` 开始。让我们仔细观察：\n\n```bash\nstat\
  \ /\nFile: '/'\nSize: 4096            Blocks: 8           IO Block: 4096   directory\n\
  Device: fd00h/64768d   Inode: 2            Links: 26\nAccess: (0555/dr-xr-xr-x)\
  \  Uid: (  0/root)   Gid: (  0/root)\nAccess: 2017-07-24 09:52:52.691988591 -0500\n\
  Modify: 2017-07-25 10:47:47.61970862 -0500\nChange: 2017-07-25 10:47:47.61970862\
  \ -0500\n```\n\n在这里我们可以看到此文件名为 `/`，并且是一个目录。我们可以看到大小、inode 编号、权限以及其他一些细节。注意这一行：\n\
  \n`Access: (0555/dr-xr-xr-x)`\n\n我们会对对其进行更仔细的观察，但目前知道该字符串代表文件级权限就足够了。为了检索 `inode.example`，系统首先检索了文件的\
  \ inode。\n\n\n\n\n上面的目录列表显示了两个文件。使用 `/usr/bin/rm` 命令删除了“原始”文件 `inode.example`。另一个列表仅显示了\
  \ `newfile`，它现在的链接计数为 1。随后调用了 `cat` 命令显示 `newfile` 的内容，返回如下：\n\n```\nThese are the\
  \ contents of the inode.example file.\n```\n\n这证明硬链接并没有创建我们所理解的新文件。相反，它们为现有文件创建了额外的目录项。\n\
  \n硬链接很有用，但它们也有局限性。最重要的一点是它们不能跨文件系统边界。我们不会期望文件系统 `FOO` 中的 `inode 103` 包含文件系统 `BAR`\
  \ 中 `inode 103` 的内容。这是因为文件系统使用 inode 号来跟踪自己的内容，而不是其他系统。可以通过链接引用另一个文件系统中 inode 的内容。这种链接被称为“符号”链接。\n\
  \n## 符号链接\n\n符号链接是一种文件，其内容仅包含指向某个其他文件的指针。我们可以通过这种方式创建一个：\n\n```\nln -s /path/to/original\
  \ /path/to/created/link\n```\n\n让我们以此来“重新创建”上一节中的 `inode.example` 文件：\n\n```\n##\
  \ ls\nnewfile\n\n## ln -s /test/itest/newfile /inode.example\n\n## ls -l\ntotal\
  \ 4\nlrwxrwxrwx. 1 root root  19 Jun 16 11:20 inode.example -> /test/itest/newfile\n\
  -rw-r--r--. 1 root root 124 Jun 16 08:35 newfile\n```\n\n在上面的示例中，我们使用 `ln -s` 创建了一个名为\
  \ `inode.example` 的符号链接（它指向同一目录下的 `newfile`）。仔细观察输出的这部分：\n\n```\ninode.example ->\
  \ /test/itest/newfile\n```\n\n该字符串表示，当 `inode.example` 被引用时，它将尝试返回 `/test/itest/newfile`。让我们尝试不同的列表：\n\
  \n```\n## ls -i\n27228260 inode.example  913922 newfile\n```\n\n注意 inode 号是不同的。与硬链接不同，符号链接不直接引用\
  \ inode。它们不能这样做；如果这样做，它们就无法跨文件系统边界。由于这个原因，系统会创建一个新的 inode，但它只包含一个指向系统上其他地方资源的指针（通过一个简单的路径）。\n\
  \n这种行为的一个有趣结果是，如果我们现在选择删除 `newfile`，`inode.example` 仍然存在（它被一个独立的 inode 跟踪）。\n\n\
  尝试读取 `inode.example` 的内容将失败并返回错误：`No such file or directory`（没有此类文件或目录）。\n\n如果我们随后创建一个名为\
  \ `newfile` 的文件并将其存储在原始文件的相同位置，链接将再次生效——尽管它现在指向了一个完全不同的文件。\n\n## 创建文件系统\n\n要创建一个文件系统，必须存在一个可以可以将文件系统放置其上的设备。虽然某些类型的文件系统可能纯存在于\
  \ RAM 中，但我们将重点关注基于磁盘的实现。要查看可用硬盘的列表，我们可以使用 `lsblk`：\n\n```\n## lsblk\nNAME      \
  \                    MAJ:MIN RM  SIZE RO TYPE MOUNTPOINT\nsda                  \
  \         8:0    0   40G  0 disk\n├─sda1                        8:1    0   500M\
  \  0 part /boot\n└─sda2                        8:2    0 39.5G  0 part\n├─vg_server-lv_root\
  \ (dm-0)     253:0   0 35.6G  0 lvm  /\n└─vg_server-lv_swap (dm-1)    253:1   0\
  \     4G  0 lvm  [SWAP]\nsr0                           11:0     1 1024M  0 rom\n\
  db                            8:16    0   10G  0 disk\n└─sdb1                  \
  \      8:17    0     1G  0 part\n```\n\n在上述输出的加亮部分，我们可以看到两个块硬盘及其分区的列表。它们是 `sda (sda1,sda2)`\
  \ 和 `db (sdb1)`。你可以将其读为：`磁盘顺序，字母顺序 (a=第 1 块硬盘，b=第 2 块硬盘)`。硬盘 `db` 只有一个分区 `sdb1`。看起来我们在设备上有一些空闲空间。让我们用\
  \ `fdisk -l` 验证：\n\n```\n## fdisk -l /dev/sdb\nDisk /dev/sdb: 10.7 GB, 1073741824\
  \ bytes\n64 heads, 32 sectors/track, 10240 cylinders\nUnits = cylinders of 2048\
  \ * 512 = 1048576 bytes\nSector size (logical/physical): 512 bytes / 512 bytes\n\
  I/O size (minimum/optimal): 512 bytes / 512 bytes\nDisk identifier: 0x2c99a74\n\
  Device Boot     Start         End   Blocks  Id System\n/dev/sdb1               \
  \                1     2048      3 Linux\n```\n\n上面的输出确认了存在可用空间。这是通过从设备大小中减去分区块计数和大小得出的。使用\
  \ `parted /dev/sdb` 后接 `print free` 可以更直接地找到此信息。让我们完成创建一个新的 1 GB 分区的步骤（使用 `fdisk`）。要在此创建一个新分区，调用\
  \ `fdisk /dev/sdb`。注意，在该程序中完成的更改在选择 `w`（写入）选项之前不会生效。如果在任何时候，你觉得在该程序中犯了错误，请立即按 `q`（退出）退出且不保存。按\
