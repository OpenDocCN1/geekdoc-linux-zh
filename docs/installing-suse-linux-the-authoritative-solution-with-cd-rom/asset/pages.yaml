- img_proc: true
  md: '# APPENDIX B


    # # Troubleshooting SuSE Linux


    Under real-world conditions, things fail. Systems that are designed to work don''t.
    There is a good chance that your SuSE Linux installation has gone smoothly and
    you''ve run into no snags at all; I tip my hat to you and wish you the best on
    your continued Linux journey.


    On the other hand you may have a problem that has stalled your installation or
    some component on your machine will not configure properly. The information that
    follows by no means a “cure-all”; it is a brief discussion of possible problems
    that can arise during or after your installation.


    I have attempted to give you some “primer” information on troubleshooting and
    also various online references that may help you. I have found that no matter
    how big the problem is, if I stay calm and use logic, I can whittle the problem
    down to size. Persistence pays.


    # ## Large Hard Disks


    Large hard disks have posed a problem for quite some time, particularly because
    the 1024 cylinder limit of the BIOS has hindered quite few people. Fortunately,
    some resolutions are on the horizon.


    If you have attempted an install and rebooted your machine only to find the boot
    process stopping at L, LI, or IL?/IL-, remain calm. A few things can cause this.
    The simplest problem could be that /boot/boot.b file might need to be moved; the
    worst problem could be a disk media failure.


    The 1024 cylinder limitation is a classic problem and with the ever-increasing
    number of large disks (+8.4GB) on the market,'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# 172 Appendix B: Troubleshooting SuSE Linux


    the need to address this type of problem grows on a daily basis. There is an article
    on LBA (Logical Addressing), which remaps your disk geometry to alleviate cylinder
    limitation problem. See http://freebsd.yourbox.net/tutorials/multi-os/limits.html
    for details. LBA must be supported in your computers for BIOS to.


    As a solution to the 1024 cylinder problem, the LILO program has been enhanced.
    LILO version 0.214.2 now supports “big disks.” The 1024-cylinder limit has been
    removed by a patch that uses the EDD bios extensions and supports up to 2TB disks.
    For more details on how this will solve your problems, http://www.freshmeat.net.


    # SCSI Hard Disks


    SCSI disks should not give you a problem, if they do, here are a couple ways out.
    With the upgraded linuxrc, it no longer required to choose a kernel; the install
    program for it. If you are booting from a disk, you might want to follow this
    procedure in making the boot disk.


    Follow the steps in Chapter 2, “Installing SuSE Linux,” and create a standard
    SCSI boot disk. This SCSI image may not suit your needs, so find the correct image
    and use the following commands (from a DOS prompt):


    ```

    > dosutils/rewrite disk=scsi01 (standard image)

    > copy use\images\scsix.ikr a:\linux

    ```


    This will create the primary SCSI image and then overwrite any additional information
    in the copy process. Remember that you must make the standard image first.


    Another problem could occur when installing on a system with a SCSI disk. If you
    have an Adaptec 2940 controller and the system hangs on boot (that is, it will
    not initialize ID0), yet it starts with no problem with the boot disk, the problem
    could lie in the controller BIOS. If your Adaptec controller has a BIOS version
    of 1.23, switch off the Sync-Negotiating feature of the controllers’ BIOS. Always
    check your final settings.


    # Zip and Jaz drives


    Zip and Jaz drives utilize the parallel port (ppa) drivers in the kernel. As the
    driver is compiled and loaded properly, you should experience few problems. Do
    not try to use a Zip drive and printer at the same time. The Zip drive is recognized
    as /dev/sda (SCSI device), and the printer requires the Ip module to operate.
    If you plan to use a Zip or a Jaz drive in addition to a printer, you must have
    two available LPT ports. You also have to manage the module loading so prior to
    the Ip module. For more information on this, see http://suse.de/sdb/en/html/mantel_1.html.
    For the Jaz drive HOWTO, point your browser to http://www.linuxdoc.org/HOWTO/Jaz-Drive-HOWTO.html.'
  merge: -1
  pgno: 182
- img_proc: true
  md: '# Video Cards


    Video cards have been and always will be a rough issue. Until the video card manufacturers
    figure out that Linux is a viable solution, support will be slim.


    There are a few cards to watch out for—they may work, or they may not. The SIS
    6326, for one, has a few problems with the stepping feature in the graphic acceleration
    process. Fortunately, SuSE has a remedy for it—point your browser to http://sdb.suse.de/sdb/en/html/cep_sis_6326.html.


    Also read through the text for information on how to edit your config file. If
    you''re unsure of the card you are using, you can always check the hardware database
    at http://cdb.suse.de/cdb_english.html to see if it is supported. For the details
    on other card(s) refer to http://sdb.suse.de/sdb/en/html/unsupp_graphic.html.
    The information you find there is the most current that SuSE has online.


    # Sound Cards


    Sound cards represent a special problem because they are touchy and finicky when
    it comes to configuration. You can diagnose the hardware aspect of this problem
    with a few commands, which will let you know whether the system recognizes the
    card. Issue the following at the command line:


    ```

    dmeg | less

    ```


    This will enable you to examine the boot process and to verify that the card was
    recognized by the system. You can use the command


    ```

    tail /var/log/messages

    ```


    to get the same results.


    If you have verified that your card works (in Windows or DOS), be sure to properly
    document the running settings. Linux should use the same I/O ports and IRQ as
    when used in Windows or DOS.


    You can use the following command to show the current available IRQs on the system:


    ```

    cat /proc/interrupts

    ```


    Check your sound card specs. This will help you establish whether the IRQ is being
    used by another device.


    Issue this command to show all the I/O port addresses:


    ```

    cat /proc/ioports

    ```


    This can also help you determine a conflict of resources problem. Make sure that
    you are referencing the sound card manufacturer''s information.'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# 174 Appendix B: Troubleshooting SuSE Linux


    This command lists all the dma channels:


    cat /proc/dma


    You can find the sound HOWTO at http://www.linuxdoc.org/HOWTO/Sound-HOWTO.html#toc4.


    # Network Interface Cards


    Network cards (NICs) are a snap to configure, and most of the drivers are available
    in the kernel that is installed by SuSE Linux. One problem that I have found is
    with PCI card configuration. It is an isolated case, but I will note it for some
    of others. The BIOS setting on older machines that were initially built when the
    10Base ISA cards were popular might require a change in PCI settings. PCI cards
    are allocated IRQs and IOS automatically. This means that if the PCI setting are
    set on legacy compatibility, the system will recognize the card but not allocate
    IR for it, or it will assign IRQ0 or 255, which are not valid addresses. When
    the setting is adjusted to PCI PnP configuration, the problem should go away.
    More detailed information can be obtained at http://csdesis.gsfc.nasa.gov/linux/misc/irq-conflict.html.
    Check out the database at sdb.suse.de/qbi-bin/sdbsearch_en.q7stichwort=PCI.


    If you have problems with an ISA card(s), you''ll need to use the same commands
    outlined in the previous Sound section. This will help you determine if you have
    system conflicts or other problems. Again, you will need the card specifications
    in front of you.


    # Laptops and Notebooks


    If you are a user and have installed SuSE, you might find a few things different—notably,
    PCMCIA configuration problems. If you face a situation that requires diagnosis,
    this could help.


    Linuxre automatically probes for a PCMCIA device post-install and attempts to
    set up the device at that time. You will also be asked which device you want to
    use; otherwise, you will choose PCMCIA, and YaST will attempt to configure the
    PCMCIA device. When you restart the machine, boot process fails to start the PCMCIA
    device, stating "eth0 device not found," or the device initializes and then etc/route
    fails. The problem is caused because Linuxre and YaST are trying to do the same
    job. Unknown to the other, each program has tried to configure the PCMCIA device.


    You must return to YaST and select Network Configuration and deselect the PCMCIA
    device that YaST set up (under base configuration). Do not remove any figures
    already there. Next you will need to edit the /etc/pcmcia/network.opts file—SuSE
    looks for its network information regarding PCMCIA devices. Add your IP address,
    netmask, broadcast, and network information. Also add your hostname and nameservers
    to complete the task.'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# Troubleshooting SuSE Linux 175


    If you experience a hang when the system is booting and tries to initialize the
    PCM DEVICE, check out this support tip at http://sdb.suse.de/sdb/en/html/mnened-6.3_pcmia-start.html.


    You''ll also have to go without sound on your laptop due to the PCI technology
    gap. The sound drivers and configuration tools are for ISA type PnP. If you are
    trying to develop a kernel version, this could solve your sound-dilemma—did it
    for me. In the run 2.3.34 kernel version, and the drivers necessary for my particular
    card are included in the kernel package. Do some research to find out the manufacturer
    of the card and the specifications. You may want to refer to the Open Sound Web
    site at http://www.4front-tech.com/linux.html.


    # Modems


    Diagnosing a failed ppp connection can be an irritation, but the wdial program
    that comes with SuSE is pretty versatile. If the tool cannot autoconfigure your
    modem, then there''s a good chance that you have a failed modem or a resource
    conflict. Use the commands to verify the IRQ and the I/O port, and make sure that
    you have determined where the modem is supposed to be located at ttyS0 and ttyS1,
    which corresponds to the works on the Windows setting COM1 and COM2. Verify the
    COM port and use the same one under SuSE Linux (ttyS0/S1/S2). You can find an
    excellent HOWTO on modems at http://www.linuxdoc.org/HOWTO/Modem-HOWTO.html.


    In most cases, a modem could be your only way to connect to the Internet. Make
    sure that the modem you''re using is Linux compatible, or external. Until recently,
    the idea of using a Winmodem, (this type of modem) is usually cheaper in price
    due to its operating characteristics, software driven, which consumes valuable
    CPU cycles (in the process) was the question. Now that the idea that Winmodems
    are not for Linux is diminishing. A few sites are dedicated to developing Open
    source drivers for Winmodems. The Linmodem site, at http://www.linmodems.org/,
    goes in-depth on the rationale of use and some of the hurdles that must be overcome.
    Or, try the Winmodems site, at http://www.o2.net/~-gromitko/winmodem.html, for
    some interesting highlights on the deficiencies surrounding Winmodems. Additional
    information is there as well on compatibility and availability drivers.


    # Troubleshooting Software Problems


    Software problems can crop up anytime. Although most Open Source software packages
    are quite useful in the normal configuration, you will have to verify your contents,
    adjust makefile configurations to suit your system(s), and possibly trace shared
    libraries to find a problem.


    If you run into problems with software operation, try using the RPM package manager
    to help (if the software is .rpm packaged). Use this command to verify the installation
    status of all .rpm packages:


    ```

    rpm -Va

    ```'
  merge: -1
  pgno: 185
- img_proc: true
  md: '# 176 Appendix B: Troubleshooting SuSE Linux


    This is a good idea to do immediately after installing the system because it will
    ensure that all packages are installed and warn you of missing files and those
    that fail the dependency checks.


    In some cases you will want to install or remove a package, but RPM will complain
    that dependencies will not be met or be broken. This can happen when the package
    that you are installing is looking for a specific file name and version, and although
    your system might have the file, it could be an updated version. This also can
    happen when you are removing a package that is linked to another file or library.
    If you are sure that the file exists, and use this current one to install or upgrade:


    ```

    rpm -Uvh --nodeps <filename>.rpm

    ```


    Use this command to remove a package with broken dependencies:


    ```

    rpm -e --nodeps <filename>.rpm

    ```


    If you decide to remove a package and it breaks some dependencies, note that it
    could cause problems for the other application, and in some instances it will
    render the associated package useless. Be sure that if you use the --nodeps command,
    replacement of the primary package will be mandatory.


    Many other .rpm commands can be accessed by typing this at the command line:


    ```

    man rpm

    ```


    # Resolving Package Dependency Problems


    If you happen to run into a situation where the software cannot be installed due
    to a dependency problem, the RPM program should complain and tell you what the
    failed component(s) are. The trick is finding the right solution without trying
    to browse the whole Web. You can find this type of information on the rpmfind.net
    Web site, http://www.rpmfind.net. When you look at the package selections, they
    will indicate which files and libraries are supplied and also the files that are
    required (prerequisite) for the package to work on the system. For further diagnostics,
    you can use this command:


    ```

    ldd <option> | <filename>

    ```


    For more information on how to trace linked libraries, use this command:


    ```

    man ldd

    ```


    # Internet Connectivity Problems


    If you are using SuSE Linux, odds are you will be in some type of network environment.
    Whether there is a dial-up connection to the Internet or a full-time 24x7 aDSL
    connection, somewhere, wherever you''re connected.


    The small office/home office (SOHO) is becoming increasingly popular. You may
    have several computers that you want to share a single connection to the Internet.
    IP (IPChains) masquerading could be the simple answer, as you learned in Chapter
    10,'
  merge: -1
  pgno: 186
- img_proc: true
  md: '# Troubleshooting SuSE Linux 177


    “Managing the Network Setup.” If you decide not to use the firewalling capabilities
    (packet filtering) in SuSE, you can still use the mastering features of IP Chains.


    Issue the following commands to activate IP Chains on a dial-up connection device
    ppp0:


    ```

    ipchains -P forward DENY

    ipchains -A forward -i ppp0 -j MASQ

    echo 1 > /proc/sys/net/ipv4/ip_forward

    ```


    Issue these commands on machines connected with Ethernet card defined as eth0:


    ```

    ipchains -P forward DENY

    ipchains -A forward -i eth0 -j MASQ

    echo 1 > /proc/sys/net/ipv4/ip_forward

    ```


    For additional resources on IP Chains and masquering, refer to the HOWTO documents
    at http://www.linuxdex.org/HOWTO/IPCHAINS-HOWTO.html.


    Firewalling could be your only option, in this often hostile environment. Packet
    filtering can be enabled easily (Chapter 11). Any further discussion of firewall(s)
    is outside the scope of this text. Refer to these resources for more information:


    ```

    http://metalab.unc.edu/LDP/HOWTO/Firewall-HOWTO.html

    http://sites.inka.de/sites/linux/freefire-1/index.en.html

    http://www.rustcorp.com/linux/ipchains/

    http://fwtk.netimages.com/main.html

    http://www.obtuse.com/juniper/

    http://www.ifi.uniz.ch/ikm/SINUS/firewall/

    ```


