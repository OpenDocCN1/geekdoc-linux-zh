  md: '# 106 Chapter 9: Tailoring a Custom Kernel


    Choose Save and Exit to save your current selections.


    Issue the command make dep to ensure that all dependencies have been met—this
    should run pretty quickly.


    The next commands can be issued as a set, which will allow you to get up and stretch
    and grab a cup of coffee. If you prefer, however, you can issue them one at a
    time. I will list them individually for:


    +   * make bImage—Compiles the kernel file bImage

    * make modules—Creates driver modules

    * make modules_install—Installs modules in /lib/modules

    * depmod -Searches for modules in all directories specified in the configuration
    /etc/modules.conf


    The optional command to automate this procedure is as follows:

    make bImage modules modules_install


    The command will perform each of the listed commands in succession. If you have
    a Pentium processor machine, this process will take approximately one hour or
    less.


    > To take full advantage of the optional command set, include the command make
    bzimage. This will convert the bzimage, the compiler made, to vmlinuz. The System.map
    file and vmlinuz will be copied to the (/root) directory, and this command will
    also need you to link /boot/vmlinuz and /boot/System.map to the root directory
    for this to work. (See Figure 9.4).


    You will need to copy the System.map file from /usr/src/linux/arch/i386/boot and
    the bzimage file from /usr/src/linux. The make bzimage command offers a better
    way of handling things. You can choose not to link the / and /boot directory,
    and then you can manually copy the files to /boot.


    As a friendly reminder, always run the lilo command after installing a new kernel.


