  md: '# Performing the Building Process 103


    > NOTE


    If you are wondering whether you have the correct compiler installed for the kernel
    you intend to build, take a look at the README contained in the kernel source.
    It will specify what type of compiler is required.


    # Latest Kernel Source


    The need for support drives kernel development. Before recompiling, be sure to
    verify that you are using the latest stable version available. This will ensure
    that you are equipped with current drivers and options that can make SuSE Linux
    system usable. To find the latest source, point your browser to http://www.kernel.org/pub/linux/kernel/v2.2.


    The source files can be obtained in two compression formats: linux-2.2.xx.tar.gz
    and linux-2.2.xx.tar.bz2. The bz2 format files are smaller in size due to the
    compression method. A fully decompressed kernel in either format will take up
    about 68MB of space; make sure you have enough room in /usr/src. Your next step
    will require you to switch to your super-user account, log out and log in as root.
    Now you can download the source; if you use ftp, I recommend using the ftp:kernel.org.


    Download the source into the /usr/src directory. The current source directory
    should be linux-2.2.13.SuSE, and it can be left alone for now. There are several
    ways to decompose files—I will show my favorites methods. Issue the following
    command(s), (dependent on the compression format) at the CLI.


    ```

    gzip -dc linux-2.2.xx.tar.gz | tar -xvf-

    bunzip2 -cd linux-2.2.xx.tar.bz2 | tar -xvf-

    ```


    Now you have a new linux directory set up and ready for action.


    > WARNING


    Do not remove (delete) the present kernel image and System.map file from the /boot
    directory. If necessary, rename the files with the .old file. If you delete these
    files and the new kernel fails to compile, you might have a problem getting everything
    running again.


    # Applying Kernel Patches


    You may opt to forgo the complete source download and obtain the patch that will
    upgrade your current kernel. Patches can be found in the same directory as the
    source files, listed as patch-2.xx.gz. Download your patch into the /usr/src directory.
    If the patch is generic (no acl or pre-patch series), the filename must be “linux”;
    rename the file accordingly. To rename the file issue the following at the command
    line


    ```

    mv linux-2.2.13.SuSE linux

    ```'
