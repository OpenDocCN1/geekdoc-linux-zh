  md: '# Hardware Component Requirements 3


    | Processor Type | Name | Compatibility |

    |---|---|---|

    | Pentium | Pentium MMX | Yes |

    | Pentium | PentiumPro II Celeron PIII | Yes |


    AMD Pentium Processors


    +   - K5 K6 K6-2 (K5 may have FPU problems)

    - Pentium K6-3 (Yes)

    - Athlon K-7 (Yes, overheating problems and CPUid)


    # Cyrix Processors


    6x86 Cyrix MX/MXII


    Intel has made a name for itself, and the market shows. The new Pentium Xeon chips
    are extremely fast and UNIX/Linux-compatible. With clock speeds up to 733MHz and
    a 133MHz bus, the Pentium III is a real “smoker.”


    You will note from Table 1.1 that every Pentium produced (except the 80286) is
    compatible with SuSE Linux 6.3. For high-end servers, which run multiple Intel
    processors (such as the Pentium Pro and Xeon processors), support built the generic
    kernel. As Intel matures, SMP technology will also increase to help you stay on
    the bleeding edge of technology.


    More information on Intel processors can be found at http://www.intel.com.


    Advanced Micro Devices (AMD) has made an inroads for itself in the CPU production
    market by offering a less expensive processor. As you can see, 99% of AMD K-Series
    CPUs are compatible with SuSE Linux 6.3.


    Another AMD processor, the K5, is a “maybe” due to that, in certain cases, the
    FPU function is not up to par with Intel. If you plan to run graphics and 3D rendering,
    this may cause problems down the line. The entire K6 series represents no problem
    when it comes to compatibility. AMD''s new K7 Athlon processor is also compatible.
    For the budget-minded, this offers a great solution.


    For more information and details on the AMD processors point your browser to http://www.amd.com.


    Cyrix and Linux Cyrix chips are generally compatible. Today’s computer market
    has a fair amount of these CPUs in circulation. Their offer is limited to the
    6x86 series. The 6x86 has two configurations, the MI and MII, the only difference
    being, the MII chip contains an MMX type instruction set. With the latest kernel
    version, the processor should do well–the main complaint is that CPU runs hot
    under constant load (with background processes, for example).


    SuSE Linux/Cyrix 6x86 HOW-TO on run into any problems, you can search for additional
    details at http://www.cyrix.com. In addition, you can find a http://balsa/linux/cyrix/p11.html.
    on optimization at http://waugg.erols.com/'
  merge: -1
