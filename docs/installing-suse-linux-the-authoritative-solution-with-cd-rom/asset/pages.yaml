    # Notebook (Laptop) Installation


    Computing has moved beyond the stationary PC unit and has gone mobile, bringing
    a new dimension to high-performance computing.


    Think of it: carrying the power of a UNIX network machine in a small notebook-size
    bag. A few years ago, this seemed amazing. Corporate representatives would come
    to your workplace lugging this big (and heavy), oversized briefcases containing
    8086 processors that ran at 25MHz. These machines would hook up to a telephone
    line and communicate with the mainframe computer, making changes, modifying files,
    and correcting errors all from these portable computers. This was cutting edge.
    Today I have a notebook with more computing power than a room full of 1950 punch-card
    processors.


    More than this, my notebook runs on SuSE Linux. If by my fingertips the processing
    capabilities of a UNIX mainframe-type machine used in big business. If this isn''t
    horsepower, I don''t know what is!


    Some roadblocks have hindered the progress of Linux on the mobile scene. The X
    Window system was almost impossible to get running because of the lack of cooperation
    with chipset manufacturers. PCMCIA drivers were unavailable and problems with
    I/O and IRQ functions.


    SuSE Linux 6.3 helps users clear of the old hurdles. With the SuSE Advanced Configuration
    Tool (SaX), Xfree86 Linux 3.3.5, and the Linux v2.2 kernel, laptop installation
    is easier than ever.


    Most newer notebook (laptops) have a CD-ROM install, or at least one that is swappable
    with the floppy disk unit. This allows the easy installation of Linux with the
    CD media. Some older units (and some newer) utilize PCMCIA technology to support
    additional peripherals such as CDs and floppy drives. SuSE Linux supports most
    PCMCIA devices, although not all. Remember, the mobile Linux scene has a greater
    distance to travel. Work in progress will only get better with time.'
