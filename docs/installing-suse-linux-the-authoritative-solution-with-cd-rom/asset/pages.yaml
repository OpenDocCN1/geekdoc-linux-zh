  md: '# 18 Chapter 2: Installing SuSE Linux


    # Network Installation (FTP)


    SuSE Linux can also be installed by means of the FTP method. I wouldn''t suggest
    this unless you have a high-speed network connection, such as DSL, ISDN, T1, or
    cable access, however. Using FTP on a PPP dial causes you and your ISP some problems,
    unless your ISP is really generous. For an example, I received a few warnings
    about excess connection times from my ISP. It didn''t matter to them, even after
    I told them I was downloading a complete Linux distribution. Then again, I always
    think that everyone knows Linux.


    This method is similar to the NFS install: Load your kernel modules, continue
    with the install, and choose SuSE Linux as your source media. You would need to
    obtain the address to the FTP server of your choice. The SuSE Linux FTP program
    uses anonymous login features and username protocols.


    Copy the required directories (as stated earlier), and begin your local install.


