  md: '# CHAPTER 13


    # Securing the Network


    We all have run into the problem of how to implement network security. In many
    cases, security is a low-key issue that''s seldom talked about and grossly underestimated.
    Why is security important? For one thing, humans are curious—and this has led
    to the development of things such as light bulbs and telegraph communications,
    it also has created dynamite and other types of explosives. Now the curious nature
    of humans, connect a few computers, and tell someone he has only limited access
    to certain things—pow! Security risk city.


    Until recently, security breaches were to occur only on big sites, such as university
    computer networks, military sites, or places that contained information that is
    “worth something.” School of thought must be re-addressed. With the volume of
    computers on the Internet or a local intranet, the potential of breaches and compromises
    also increases. The average computer user will not worry about what he or she
    can or not get it to, just as long as normal use is not hindered.


    # Determining Your Vulnerabilities


    Determining your vulnerabilities is crucial to the installation of SuSE Linux.
    Some of the keys are these factors. Will you the following?


    +   * Internal network connectivity (intranet, VPN)

    * External network connectivity (WAN, Internet)

    * Inbound inbound connections (telnet, ftp, ssh)

    * File sharing (NFS, Samba)

    * Limited access to network (via login = user/group level)

    * Router Applications'
  merge: -1
