  md: '# CHAPTER 1


    # Assessing the Platform


    The Linux kernel has made significant progress in the last two years. The problem
    of hardware detection and compatibility has been reduced, although not totally
    eliminated. SuSE Linux is also striving to stay on the cutting edge of Linux technology,
    so the current distribution contains one of the latest kernel versions, 2.2.13.
    This in and of itself should indicate that SuSE Linux is extremely serious about
    performance computing. In addition, all the latest device drivers are included,
    which means that typical installation problems are decreased.


    It''s a given that Linux can take on many tasks. Making sure that you have the
    right platform to support those tasks is critical. Due to the rise in popularity,
    Linux boxes are used for the following, just to name a few:


    +   - Web servers

    - Routers

    - Mail servers

    - Print servers

    - IP masquerading boxes

    - Firewalls

    - Workstation applications


    Each of these environments requires certain resources. The SuSE Linux 6.3 distribution
    includes the v2.2 kernel, which supports symmetrical multiprocessing giving that
    the capability to distribute workload evenly among two or more CPUs. This version
    also contains software to support Beowulf Clustering, parallel virtual machines
    (PVMs), and other cutting-edge technology. Obviously, a good look at hardware
    is in order.'
  merge: -1
  pgno: 11
- img_proc: true
  md: "# Hardware Component Requirements\n\nLinux has a reputation for being capable\
    \ of running in a low hard disk space and in low memory environments. Recent improvements\
    \ and a proven track record have upped the ante. Putting more applications and\
    \ graphical interfaces in place requires more than hard disk space, thus requiring\
    \ an appropriate increase in memory. The old 286 with 4MB of memory will not support\
    \ a GUI environment.\n\nSuSE understands that, in addition to businesses, personal\
    \ computing stands to gain greatly from the Linux explosion. For that reason,\
    \ SuSE Linux is designed to run on standard Intel-PCs and all the subsequent possible-component\
    \ clones. All PC hardware components are not created equal, of course; there is\
    \ always the potential for a snag. As hardware manufacturers become more aware\
    \ that Linux is not going to disappear from the face of the computing scene, they\
    \ will have a competing reason to provide more support for hardware such as video\
    \ cards, sound cards, modems, and net-\nworking gear.\n\nThe GUI environment is\
    \ gaining more influence in the Linux camp, largely because some users utilized\
    \ a windowed-type graphical interface prior to coming Linux. Although the command\
    \ line interface (CLI) remains the favorite among veteran Linux users, GUI tools\
    \ and applications are developed in abundance. These programs are larger than\
    \ their text-based equivalents, which can use more system resources. This, has\
    \ had a significant effect on processor type and speed, hard disk space, and RAM\
    \ memory.\n\nFollowing is a review of essential hardware components, their differences,\
    \ techn-\n advances, their functions, and their level of compatibility with SuSE\
    \ Linux.\n\nFor reference, I have separated the component groups and make note\
    \ of hardware components that may (or may not) cause problems during your installation.\n\
    \n# Processors\n\nLinux was originally written as an operating system that could\
    \ utilize the features of the Intel 80386. As we went on, the use of IA-32 processors\
    \ (including Intel’s 80486, Pentium, PentiumPro, and Pentium II-III; Xenon; AMD’s\
    \ 5x86, K5, K6, and K-2; and Cyrix’s 6x86 series) have posted little or no problem\
    \ to the backward compatibility and unique similarities between the processors.\n\
    \nIn Table 1.1, you will find a list of processors and their compatibility with\
    \ SuSE Linux 6.3.\n\n| Table 1.1 Processors and Compatibility |\n| Processor Type\
    \ | Name | Compatibility |\n| --- | --- | --- |\n| Intel Processors | 286 | No\
    \ |\n| i80486SX | 386SX 386DX 486SLC | Yes |\n| i80486DX | 486DX 486SX 486DX2&4\
    \ | Yes |"
  merge: -1
  pgno: 12
