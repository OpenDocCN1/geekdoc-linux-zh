  md: '# 16 Chapter 2: Installing SuSE Linux


    +   - Required kernel modules are loaded into Ramdisk, commonly SCSI modules.
    (This is a new feature.)

    - The root filesystem is remounted to the physical hard disk, and init processes
    start.


    On the other side, the big selections of SCSI kernels (in the Linuxrc/YaST program)
    no longer exists. Only the basic kernels—i386, Pentium, SMP, APM, and Pentium
    Optimized—are listed for choice. Changes have been made for the expert user also;
    for more details, see /sdb.suse.de/sb/en/html/adrian_6_3_boot.html. The main menu
    of Linuxrc enables you to make some adjustment to your settings. You can modify
    keyboard and screen settings, and kernel modules offer the choice of alternate
    kernel images, depending on hardware used. System information will confirm if
    all hardware parameters are detected and modules are loaded properly. You can
    select start Installation/System if you''re ready, or End/Reboot if something
    is missed or forgotten.


    As mentioned in Chapter 1, “Assessing the Platform,” when you use an (E)IDE or
    ATAPI CD-ROM unit, no special drivers are required.


    # SCSI KERNELS MODULE


    Due to the change in the boot process, the selection of SCSI modules has been
    eliminated. With more than 200 possible kernel images to choose from, the process
    is now handled by the hardware detection features in Linuxrc.


    # Network Installation


    Network installs can be tricky, say the least. If you want to utilize this method,
    make sure that you or your system administrator is familiar with the technique
    and has all the pertinent network information required to complete the task.


    # Directories Required for Network Type Installation


    The following directories are required to install SuSE Linux. See Figure 2.2.

    All the other directories are optional. If you have room available on the hard
    disk and you want to sample a good variety of Linux software applications, you
    can copy the complete directory structure.


    # Installation via Linked Network Interface (NFS)


    Businesses are moving away from the “dumb terminal” technology and are refitting
    with networked PCs. For example, Burlington Factory is switching off the old terminals
    and upgrading to Linux powered PCs. The principle is to put the maximum amount
    of resources in the user’s control, requiring less maintenance exposure. You,
    too, might be in that state of growth or might have a working network with a similar
    PC environment.


    The networked machines on which you’re installing SuSE Linux might not be equipped
    with CD-ROM units. NFS may be your choice of install protocol.'
