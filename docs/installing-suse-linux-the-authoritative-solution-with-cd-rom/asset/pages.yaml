  md: '# 80 Chapter 7: SuSE Communication Features


    If you need to configure Wvdial from the command line for some reason, you can
    invoke the configuration features by typing this command while using the root
    or superuser account:


    wvdialconf <config file location>


    Be sure to have the correct address to the DNS servers for your ISP. You can obtain
    this information from the ISP''s DNS department. It is imperative that at least
    one IP address is added to the DNS servers input screen if you have more than
    one IP address (some ISPs will give you a primary and secondary address to input).
    Without this information in /etc/resolv.conf, you will not be able to access the
    network.


    # Adding a Network Interface


    If you are planning to set up multiple mediums, such as the Digibord or Stallion
    types of multimethod, you will need to set up different interface options for
    them. You can use the point-to-point (PPP) scheme and start with ppp0/ppp1, and
    add more as required. You can do this with the YaSt utility via the Integrate
    Hardware into System and Configure PPP Network selections.


    # Automatic Redial


    If you are familiar with Linux in general, you''ll know it contains a feature
    that will redraw your dial in case the connection is broken. This enhancement
    is built into the Wvdial program. This feature is useful if your ISP shuts off
    your connection after a period of time, or if your phone line quality is bad and
    you have a problem negotiating a clean connection. After configuring Wvdial, you
    can connect to your service by issuing this command while using the root or superuser
    account:


    wvdial


    > If you invoke Wvdial from an xterm session or on the console, it will not automatically
    move into the background, i.e. your prompt will not return until the Wvdial program
    is terminated. If you would like to continue working, starting a different xterm
    or CLI session, issue this command when starting Wvdial:


    ```

    wvdial &

    ```


    The Wvdial utility will dial up in the background, and you can continue working.
    When necessary, return the program to the foreground and shut down the dial with
    Ctrl+C. Then wvdial will state, "Caught signal #2, exiting gracefully..."


    For additional information and updates concerning wvdial, you can consult the
    site at http://www.worldvisions.ca/wvdial/index.html.'
