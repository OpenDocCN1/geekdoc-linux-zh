  md: '# 140 Chapter 12: Keeping Your System Up to Date


    With everyone in a panic about Y2K, I felt reasonably sure that my Linux machines
    would not be affected by the arrival of the year 2000. Returning home at a little
    after 1 a.m., I found everything to be in order. I woke the next morning and started
    X and pulled up my favorite file manager, FileRunner. To my surprise, the file
    dates 1000 rather than 2000—yikes! I mumbled and groaned with my my wife, "Check
    and see if they have a new version." Enough, the FileRunner Web page showed that
    the author had released an upgraded version that handled the datechange problem,
    three days prior to January 1. This Open Source program was free of charge, so
    the maintenance of the program is voluntary. The diligence to detail is evidence
    of a different outlook on performance.


    # The Importance of Updating Your Software


    The issue of updating your software could extend to the factor of security. All
    Linux applications are not produced by the same individuals, so there might be
    small inconsistencies that allow users uninvited (and authorized) privileges.
    There are teams of experts whose daily task is to find flaws in Linux applications.
    One of these groups is the X-Force (http://xforce.iss.net.about.php3).


    For more information, see Chapter 13, "Securing the Network."



    If you have a single machine that is not connected to other computer(s) or the
    Internet, and if all the operations operate properly for you, then updating the
    software might be moot for you. In most cases, SuSE Linux has been chosen to facilitate
    a network connection for one or more computers. In this case, updates are generally
    required.


    # Getting Updates from SuSE.com


    Where you get your updates is just as important as the upgrade process itself.
    If you cannot trust the source, the upgrade is not an upgrade. I recommend getting
    updated files from ftp.suse.com, to help some of the safety concerns. This ftp
    site is supported by SuSE, and the rpm software has MD5 checksum capabilities.


    The MD5 algorithm is needed for digital signature applications, in which a large
    file must be "compressed" in a secure manner before being encrypted with a private
    (secret) key using a public-key system like RSA. This will help determine whether
    a file has been modified from its original state. With SuSE Linux, you have plenty
    of options: using the rpm package format, installing binaries, or building from
    source. As long as you are familiar with how your system is configured, you''ll
    have no problems.


    The whole debate about performing updates is this: How can I be sure that I have
    received the most current files? Some distributions have highly intelligent package
    management. In terms of interactive and flexible updating, I would not consider
    a Su system to be no. 1, although a strong no. 2 certainly is feasible. Again,
    the multifaceted YaST will be your interface. All you need to do is bring up the
    YaST1 menu and select First/Install Packages and then Install Packages. Figure
    12.1 shows the YaST'
