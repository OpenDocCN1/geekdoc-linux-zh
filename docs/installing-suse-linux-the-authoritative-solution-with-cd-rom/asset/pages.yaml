    a significant number of Linux users. Some of the complexities surrounded the hardware
    compatibility issue. When Linux was not in the mainstream (or headlines) of computing,
    the hardware vendors turned a deaf ear to the small group of "hacker-types" and
    continued their alliance with proprietary software companies. As you read this,
    however, the tide has turned; the rushing waves are now hitting the Linux shores
    with hurricane force. Video hardware companies are now releasing the software
    source code for their components so that the growing Linux community can purchase
    their products.


    SuSE takes a step forward in helping you get the X Window system configured quickly.
    Some distributions enable their installation with a script that sets up the video
    configuration file—this includes the mouse, video card, and monitor. One hitch
