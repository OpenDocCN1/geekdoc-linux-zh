    # Overview of Network Services


    In this section, you will see how to configure some of the common services that
    are included in the SuSE Linux distribution. These services include email server
    configuration, Samba, and IP-Mapping setups, and all this can be done with the
    YaST1 utility.


    Configurations such as sendmail.cf file will not contain a lot of information
    on how to generate the sendmail file, but the necessary information required by
    YaST1 will get your email server serving.


    I will quickly cover the principles behind NFS and NIS; these subjects are extensive
    and beyond the scope of this installation test. The NFS/NIS overview is designed
    to give you insight into the reasons why (or why not) you want to implement these
    services on your machine.


    Let''s start with the sendmail configuration.


    # Configuring Sendmail with YaST1


    Configuring sendmail with YaST1 is quick and simple. Without the YaST1 utility,
    generating a sendmail configuration file is extremely difficult for all the most
    seasoned email administrators. SuisseConfig has two configurations available to
    assist you. You can use the TCP/IP protocol via Simple Mail Transfer Protocol
    (SMTP) or by using UNIX-to-Unix Copy Protocol (UUCP). The TCP/IP method is used
    more often when mail is sent or delivered to a remote machine. UUCP is better
    suited to deliver on local host server. Meanwhile, find that this will not work
    on a UNIX-Windows-based environment because the Samba package relies on the TCP/IP
    protocol to transfer its data. The following instructions outline the YaST1 parameters
    needed to get sendmail up and running for you.


    If you did not set up the parameters for sendmail during the initial installation
    run, you can have SuisseConfig generate the sendmail configuration file by answering
    **yes** in the YaST1 selection field SENDMAIL_TYPE. If you elect to write your
    own configuration from scratch, answer **no** in this field.'
  merge: -1
  pgno: 131
- img_proc: true
  md: 'You will have to tell sendmail where the local mail will be stored, or who
    will be the recipient. Use the SENDMAIL_LOCALHOST option. If your local hostname
    is abc.xyz.com, for example, then input, localhost abc.xyz.com. If there are more
    recipients, add the other names separated by whitespace.


    If you handle traffic for incoming mail from the Internet to a common address,
    such as www.109.org, and the host machine is esther.109.org, then in SENDMAIL_LOCALHOST
    put localhost.109.org (without the quotes) in that field.


    If you would like to send your mail under any name than appears on the mail header,
    use the option FROM_HEADER. You can change the name from esther.109.org to arthur.109.org
    if you''d like.


    If the mail is not delivered locally, sendmail will request the DNS name that
    the mail can be delivered by SMTP. However, in general, SMTP mail servers are
    reliable, occasionally circumstances such as slow connections or high volumes
    of network traffic can cause them to fail. If this happens, your mail can''t get
    through. You can opt to use another SMTP mail host that can receive the output
    and deliver it for you. The SENDMAIL_SMARTHOST option will work for that. You''ll
    need to input the name of the smart host in this manner, smtp:mail.xyz.net in
    the option field. It is a good idea for those who do not have a permanent connection
    to the Internet and who use their ISP''s SMTP server. If you have a UUCP connection
    and would like to use the smart host option, input ucp:duq.xyz.net in the option
    field.


    Depending on your connection, a DNS resolver may not be available. If this is
    the case, sendmail will look for a valid email address and exchange it for a fully
    qualified domain name (FQDN). If the DNS is not resolved, the mail will go undelivered.
    If you would like sendmail to ignore this DNS feature, and if you are sure that
    the email address(s) is correct, answer yes to the SENDMAIL_NOCANONIFY option.


    You can have sendmail started up the boot sequence, and the program has the capability
    to check for mail at predetermined times, which you can set. The -bd argument
    for sendmail initializes the daemon and opens smtp port 25. If you have a fair
    amount of daily mail, you can have sendmail check the queue at specific intervals.
    The -q25 argument checks /var/spool/mailqueue every 25 minutes. If you have a
    permanent connection, you may want to connect to the network and issue the command
    sendmail -q, which will send and retrieve all your mail. If you like, you can
    place the command sendmail -q in the crontab and have the system check once a
    day. To modify the startup options, use the SENDMAIL_ARGS option.


    You should note that sendmail has a built-in tendency to send your mail imme immediately.
    This may not be possible for those who are mobile and who connect once or twice
    a day. If you set the SENDMAIL_EXPENSIVE option to yes, the mail will wait for
    you to issue the command sendmail -q after any of your daily posts.'
  merge: -1
  pgno: 132
- img_proc: true
  md: '# Configuring Internet Services


    The option fields listed previously are common and can be modified quickly to
    suit your needs. This is in no way a complete synopsis of the sendmail program
    or its features; for more detail, type man sendmail at the command prompt for
    additional information. Sendmail also has an extensive Web site located at http://www.sendmail.org/.
    This site has all the latest information about the program, as well as downloads
    of newer (where applicable) versions. Other sites help you configure sendmail
    from scratch—the sendmail.cf generator, at http://www.harker.com/gen.sendmail.cf/index.html.
    More email administrator tools are located at http://www.webmin.com/webmin.


    # DHCP Configuration


    Dynamic Host Configuration Protocol (DHCP) is a network protocol that gives administrators
    control from a central point and automates the assignment of Internet Protocol
    (IP) addresses in an organization''s network.


    Using the Internet''s TCP/IP protocol, each machine that must connect to the Internet
    needs a unique IP address. You may have multiple computer users; if computers
    moves to some other location in another part of the network, a new IP address
    is entered. DHCP lets network administrator supervise and assign IP addresses
    from a central point, and automatically sends a new IP address when a computer
    is plugged into a different place in the network.


    If you would like to start the DHCP server, use the START_DHCP option and answer
    yes.


    Due to the amount of variables involved in configuring the DHCP client, I advise
    you to look at http://sd.suse.de/de/html/katlist.NETDHCP.html. This SuSE support
    gives more details than I can provide in this overview. In addition, the DHCP
    HOWTO is another great resource.


    # NFS File System (NFS)


    The Network File System is a client/server application that gives a computer user
    an opportunity to view and, in some cases, store and update file(s)on a remote
    computer as though they were on the user’s own computer.


    NFS is designed to support a UNIX/Linux filesystem. It also will support filesystems
    as MS-DOS.


    The need for distributed file resources and the element of filesystem security
    will determine the advantage or disadvantage of using this type of system. You
    may want to provide this type of service if a significant number of your users
    are remote from a central location during the day, and you would like them to
    access to the files.


    If you intend to run the NFS server, these parameters must exist: START_PORTMAP
    [yes]without the portmapper daemon running, rpc.mountd (mount) and rpc.nfsd (filesystem)
    will not start, and NFS will not operate.'
