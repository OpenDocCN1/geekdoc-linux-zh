  pgno: 174
- img_proc: true
  md: '# Analyzing the Network 165


    Take caution in the use of harden_suse because it can disable most of your services
    that are required for daily use.


    Run scheduled and unscheduled network security audits with the scanning and vulnerability
    tools. You will have a better outlook and more confidence if you have a part of
    your normal tasks.


    There are a few other ways to monitor your system: One of these is to use SuSE''s
    temporary watch program, which logs temporary files that may be opened by an intruder
    during a compromise. You can do roughly the same thing as temp-watch by issuing
    your command:


    ```

    lsof | less

    ```


    This displays all open files through the pager utility called less.


    # Reporting Security Issues


    How will you know when your system has been compromised? A daily examination of
    the logs is essential. If you don''t monitor the logs, intruders can have free
    reign. If the intruder is you, the traces of activity might not be seen in a one-time
    incident. You, or whoever is in charge of security, should become acquainted with
    your system so that small changes in system operation will alert you. SuSE gives
    you the capability to decrease or increase your mail frequency. Go YaST1, choose
    Configuration File, select MAIL, and then answer with All. This makes all log
    systems to the specified user. You can also logcheck or watchdog, which are available
    at http://www.rpmfind.net.


    You will need a point of contact (that may be you) and a game plan to recover
    from a compromise. It is also good to build a relationship with your local ISP
    in case you need help tracking down an intruder. A host of resources on the Web
    will help you prepare for an attack or compromise. One good site is NetworkICE,
    located at http://www.81gm.org/


    # Resolving Security Compromises


    This could be the hardest issue to address in the security arena. When your network
    has been compromised, what do you do?


    The first thing that might come to mind is tracking the intruder who did it and
    where it came from, unless the cracker is careless or you have noticed his presence
    and allowed him to build a track record that will stand in court. (Of course,
    that is only an option if that person-happens to be in the same country as you
    reside.)


    Recovering from a compromise is complex, and sometimes it''s impossible without
    salvaging files and sanitizing the system with a reinstall. If trojan programs
    have been deployed in your network and you are not sure what to do, call for help.
    An excellent coverage of root_compromise is detailed by the Department of Defense
    at http://www.cert.mil/techtips/root_compromise.htm. Or, visit the FBI Computer
    Crimes Web page, at http://www.fbi.gov/nipc/compromise.htm.'
