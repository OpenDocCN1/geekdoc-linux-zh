  md: '# CHAPTER 11


    # Sound for SuSE Linux


    Sound—what a wonderful thing. The computing experience is enhanced to a certain
    extent by its presence, and the recent sound driver development has brought sound
    to more Linux boxes than ever.


    As a quick refresher, here’s why the drivers for sound cards have taken so long
    to incorporate into the distribution(s). Sound card initialization occurs on the
    kernel level. The drivers must be built into the kernel, or a loadable module
    must be supplied to activate the card. Because the Linux platform was designed
    as a UNIX clone and connectivity, and because filesystem flexibility was paramount,
    the sound drivers were not high on the priority list. Now that Linux has crested
    the mount of viability, new tasks—including sound—must be handled.


    The capability to interface with sound devices is no longer focused on playing
    CDs or providing sound effects on games. The issue of telephony has created a
    new frontier. Linux is a network operating system by design—what better way to
    take advantage of its natural capability and expand its reach further. Without
    the facilities to record and reproduce sound, Linux will not grow at a linear
    rate.


    The use of ISA for sound cards was predominant a few years ago. The trend recently
    has shown that the PCI-type cards are becoming the standard, and the ISA cards
    are destined to be phased out soon. The good thing in the fact that the computer
    automatically allocates the I/O and IRQ resources.


    The ISA cards that started out with a jumper-type setting evolved to ISA PnP-enabled
    cards. The Plug and “Pray” card'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# 132 Chapter 11: Sound for SuSE Linux


    sometimes posed configuration problems due to an internal setting sometimes conflicts
    with another device. Fortunately, the isnapp tool helps find the PnP card and
    supply some configuration information. Later sections in this chapter review the
    use of this tool. Please see the section "Theapntools Utility."


    Quite a few sound development projects are in the works. The two dominant projects
    are Open Sound System (OSS) and Advanced Linux Sound Architecture (ALSA). OSS/Free
    drivers are incorporated in the kernel, the ALSA carries as prebuilt modules.
    I''ll give you an overview of each driver set.


    # Open Sound System (a.k.a. OSS)


    Hannu Savolainen led the effort to develop sound drivers compatible with Linux.
    First called Voxware, the name changed to Ultra Sound System (USS). As driver
    development, Savolainen joined the 4Front Technologies team, a company that markets
    a proprietary sound system for the UNIX platform. Working full-time with 4Front,
    Savolainen aided the maintainer Alan Cox. Cox who is known for the ''ac'' kernel
    patches, keeps quite busy in kernel development for sound drivers. More information
    concerning his progress can be found at http://www.4front-tech.com/ossfree/index.html.


    The kernel-supplied version of the OSS is called OSS/Free, otherwise known as
    the Linux Sound System. The main site is located at http://www.linux.org/uk/OSS
    and contains valuable information on issues concerning setup and compatibility.


    4Front provides sound drivers for various UNIX/Linux applications. SuSE is kind
    enough to provide a demo copy of the Open Sound 3.9.2 drivers in the Pay section,
    under the heading opsdmp. More information on Open Sound System can be found at
    http://www.opensound.com.


    One project, hosted by MIT, is called Csound. This effort is diverse and includes
    great tutorials and a maine of current documentation. The Web is located at http://mitpress.mit.edu/e-books/csound/frontpage.html.


    There are other groups working on sound reproduction. Groups like the GNOME and
    Enlightenment teams at http://www.uk.gnome.org/white-papers/esd/. Their efforts
    have been ceaseless, and improvements continue on a daily basis. For detail on
    the project, see http://www.gnome.org.


    # Using the Open Sound Drivers


    You can imagine the frustration of having a "working" sound card, installing SuSE
    Linux, and suddenly rendering the card inoperative. You have a couple choices:
    to purchase the commercial drivers available from 4Front, or recompile the kernel
    and use the OSS/Free drivers. I must say the OSS package is easier to install
    and configure. The only tradeoff is that if you want to keep it, you must pay
    for it ($20), and you do not receive the source code.'
