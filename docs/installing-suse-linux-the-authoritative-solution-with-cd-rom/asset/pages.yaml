  md: 'For more help with setting up a modem with Minicom, point your browser to http://howto.tucows.com/LinuxGuide/linux-ppp.html.
    For additional help setting up modems, go to http://www.linuxudoo.org/HOWTO/PPP-HOWTO-14.html#manual.


    # ISA Plug-and-Play Modem Setup


    The ISA plug-and-play card was designed to reduce the conflicts caused by different
    devices using the same I/O or IRQ. The premise behind the card operation was that
    if the computer system (BIOS) or the operating system could configure the device
    (modem, sound card, or video card), the use of jumpers would be eliminated. With
    other operating systems, this might have proved convenient, but with the Linux
    kernel, some of these devices are still problematic.


    Some newer modems use a plug-and-play type of configuration. This causes problems
    when the Su Linux kernel hardware detection fails to locate the modem in question.
    If your machine is equipped with one of these goodies, you''ll need to do a little
    bit before it''s recognized by the system.


    Setting up your modem should not take long—just follow along and you should be
    able to connect shortly. Included in this distribution is a tool kit called isapnpools,
    which includes the pndump and isapnp utilities. These utilities help locate and
    configure plug-and-play devices. To start the process of setting up the modem,
    you''ll need to use pndump. This nifty tool probes the ISA devices on your computer.
    To start, access the command line or terminal, and issue this command:


    ```

    pndump ~ /etc/isapnp.conf

    ```


    This will produce a file called isapnp.conf in the /etc directory. You can load
    your favorite editor, locate the device parameters, and uncomment the appropriate
    values (I/O and IRQ). The card should be acknowledged during the next reboot.


    > WARNING: If you use an ISA plug-and-play device, some cards don''t seem to follow
    the ISA-PnP implementation standard that has been established—this can cause unforeseen
    problems. Automatic configuration and administration of PnP resources by the BIOS
    should not be used under Linux. It''s recommended that you deactivate the ISA
    plug-and-play feature in your BIOS.


    Your isapnp.conf file will be read automatically on reboot. If the correct lines
    have been uncommented, you should be able to configure your modem through YaST.
    Be mindful, that some of the ISA-PnP modems are Winmodems (bad-news items)—check
    to make sure they''re not. For additional information on plug-and-play configuration,
    the SuSE Web site at http://sdb.suse.de/sdb/en/html/rb_isapnp.html. The official
    home page for the isapntools is http://www.roestock.demon.co.uk/isapnpfaq.txt.'
