  md: '# Boot Loader Problems


    LILO (LINuxLoader) is a group of programs designed to move information to and
    from hard disk boot sectors. This information is kept in a configuration file
    whose whole purpose is to supply lilo data to write to the boot sector. Remember
    that LILO does not perform any function at boot time. The mounts implied by the
    configuration file need to be in effect only when the BIOS calls LILO, not at
    boot time. The default configuration file is /etc/lilo.conf.


    If LILO is not installed and configured properly, you could be stuck with a machine
    that will not boot up.


    Here are some of the reasons that LILO will not fully initialize:


    +   * L—Indicates that the BIOS loaded and started LILO. The second stage of the
    process is incapable of loading because /boot/boot.b is not found. This was caused
    by a physical problem with the disk or the disk parameters are incorrect (geometry).

    * LI—Indicates that the second stage of the boot has been recognized (/boot/boot.b
    file located), but it might be incorrectly positioned (that is, the 1024 cylinder
    limit could be exceeded). This is also when files are moved or renewed and LILO
    is not reinstalled.

    * LIL—Indicates that the second stage of the boot process started, but the descriptor
    table cannot access the file. Out-of-parameter positioning of the boot file or
    a physical disk geometry exists.

    * LIL?—Indicates that the first and second stage of the boot has been recognized,
    but the address at which it is located is incorrect. Again, the problem is caused
    when the boot files are moved or renewed without reinstalling LILO, or it could
    be caused by a failed disk.

    * LIL—Indicates that the descriptor table in the map file could be corrupted,
    or that files were moved or renewed without invoking the lilo command to reinstall
    the map file.


    If any of these happen to you, do not panic. The built-in rescue system on the
    SuSE Linux CD will help you. Reset your BIOS to boot to the CD-ROM. After Linux
    starts, go to the main menu and select Boot Installed System. This rescue system
    provides a kernel image to boot up, and it allows you to get back into your system
    and make repairs if necessary. This rescue system will not save you from a /boot.b
    file located beyond the 1024 cylinder boundary, though. If you don''t have a bootable
    CD-ROM, then the boot disk will serve the same purpose. Additional detail on boot
    problems can be found at http://sdb.suse.de/sdb/en/html/keylist.LILO.html and
    http://linux.com/support/newsitem.php?sid=8&aid=6316.'
