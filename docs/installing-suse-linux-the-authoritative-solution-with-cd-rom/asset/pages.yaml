    # Enforcing Network Security


    If you are the sole user on your network, the task of enforcing network security
    is as critical as if you had 100 users. The habits that you build will be either
    asset or a liability. Security is a state of mind rather than a state of operation.
    If you are successful in enforcing good security, then you most likely will keep
    a well-tuned network.


    SUSE Linux 6.3 comes with a package called firewall. The package is not a firewall
    per se—it''s more like a smart packet filter built with the iptchains program.
    To get this working, you will need to read the instructions in the /etc/rc.config
    and edit the file accordingly. This will give you a pretty nice start on getting
    a full-fledged, custom firewall script up for industrial strength.


    SUSE upgraded the startup script, so everything initializes at boot time; check
    your version with the command:


    ```

    rpm -q firewall

    ```


    The current version is firewall-1.4. If you experience problems with firewall
    initialization during boot, download the update package at http://www.suse.de/en/support/download/updates/63_update.html.


    To stay on top of security issues in general, check out the site: http://xforce.iss.net.


    Besides the fact that you may be protected by a firewall, if it becomes necessary
    to allow some type of connection to your network, you will have to establish a
    trust. A trusted relation can be built using ssh (secure shell), or PKI (public
    key infrastructure) methods. Rather than allowing any type of connection, this
    trust method works on'
