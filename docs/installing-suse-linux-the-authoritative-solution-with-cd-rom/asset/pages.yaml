  md: '# CHAPTER 12


    # # Keeping Your System Up to Date


    All who have spent a significant amount of time in the computer industry have
    run into the problem of outdated software applications. The story is the same
    everywhere, just the names are changed to protect the unyielding.


    A few years ago, I experienced a problem with a program that supplied warranty-coding
    numbers based on a specific ID. The operating system was UNIX (a good point),
    which utilized a proprietary software application (possibly a bad thing) that
    needed serious modifications to the warranty-coding program. Over a two-year span,
    I worked with the regional representative and talked with the company’s programming
    adviser, recreating the scenario in which the program failed to respond correctly.
    He was sympathetic and told me that the programmers were working on a fix and
    that the problem should be solved in the next version update. When the upgrade
    came, I waited with b breath, hoping that the problems had been rectified. Low
    and behold, the update contained new coding options, but all the problematic codes
    remained in the system, adding insult to injury.


    This scenario will not be found in SuSE Linux. The programmers responsible for
