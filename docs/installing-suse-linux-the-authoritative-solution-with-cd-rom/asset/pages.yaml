  md: '# 164 Chapter 13: Securing the Network


    The latest SAINT version, 1.5BETA1, was released in early January 2000. If you
    want to stay on the leading edge of security, grab a copy from the previous URL.
    This version runs without a hitch in SuSE Linux.


    # Security Risks to Avoid


    The main idea in security is fire prevention rather than damage control. The best
    way to secure it is to limit the internal threats by laying down specific policies
    and procedures around network activity. Check and prune access levels, and run
    a tiger program to alert you of any internal changes. By the way, SuSE also comes
    with a package called secheck, which is a tiger-type program. This program makes
    daily, weekly, and monthly security checks.(Although I prefer TARA, you''ll have
    to figure out which best suits your needs.) Keep in mind that the Web contains
    information about how to gain root to UNIX/Linux systems, so take care with internal
    users.


    The key to solving the social engineering compromise is to keep tabs on usernames
    and changing passwords frequently. Educate others so that the important information
    is not released without some type verification. Establish a policy and procedure
    for information exchange that is secure. If an account is terminated, delete the
    user and all associated files (not just the /home directory).


    Closing unused ports and turning off services that are not required will help
    batten the hatches as well. SuSE Linux comes with a hardening script, called harden_suse.
    This script is interactive; you will be greeted with the screen shown in Figure
    13.6.


    ![](img/e140cb30051378468280d532cc3eccef_174_0.png)


    Figure 13.6


    harden_suse system hardening script.'
