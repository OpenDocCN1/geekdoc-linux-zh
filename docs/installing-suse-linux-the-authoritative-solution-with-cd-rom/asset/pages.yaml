    In the past, Linux support for all hardware was spotty—some components worked,
    and others did not. The hard disk install was born out of necessity because SCSI
    drivers were still in the early stages, and some proprietary CD-ROMs were useless.
    Now, driver support for Linux is linear. As products are made, the support is


    Your choice for hard disk install may rest on the following factors:


    +   1. You have a large disk with room on it, with a sizable DOS partition to
    spare, and decide to copy SuSE to it.

    2. You have few machines on which you would like to run Linux, and you have no
    network connection and no CD-ROM units installed on them. Note: Format disks as
    DOS partitions.


    ```

    \dump

    dump\suse

    dump\suse\a1

    dump\suse\images

    dump\suse\setup

    ```


    Be sure to copy the initrdsk.gz and the correct kernel for your system. Copy those
    to the \dump\suse\images directory.


    Copy the CD-ROM file \suse\setup\inst-img and \suse\setup\loadlin.exe to \dump\suse\setup.'
