    # Managing the Network Summary


    This chapter helped you define the services and features that you will run on
    your SuSE Linux machine. With many optional services to provide, narrowing down
    the choices can be the hardest part. We''ve looked at information that can help
    you identify the configuration file(s) and some of the parameters to work with.
    You have received directions on how to start a service, or you have been guided
    to an information source that will help to get network service configured. You
    also got an overview of some of the most widely used network filesystems and a
    brief look at the NIS protocol that helps network administrators provide their
    users with a transparent (seamless) work environment. The FTP client section was
    not actually a configuration issue, but it may represent a significant utility
    in the daily arsenal of tools. Finally, we presented some information on the firewall
    programs and configuration of a small home or business network, giving multiple
    computers access to the Internet via one SuSE Linux machine. This should help
    you get out of the network box and allow you to cruise down the Information Super
    Highway. Happy trails!'
