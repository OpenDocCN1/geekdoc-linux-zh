    # Modems


    Modems are another means of connecting to a network. Whether they are analog dialup
    modems or ISDN modems, Linux supports a variety of them and work well with most
    hardware-controlled modems. If your modem is a WinModem or a type that relies
    on a software driver to operate, it will not be of any use to you. If you intend
    to connect by modem (possibly a DSL or cable modem), Chapter 7 will show you.'
