  md: '# Problem Logging into SuSE Linux 61


    # BUILDING A RESCUE DISK


    If you need to rescue your system and your machine is not equipped with a bootable
    CD-ROM drive, or if your CD-ROM malfunctions, the only way to proceed is to build
    a rescue disk. This disk should be used in conjunction with the standard boot
    disk to load the rescue system into a RAM disk. This disk is not the same as the
    standard boot disk used to start the system. You''ll likely have to build this
    disk on another machine. If it is UNIX/Linux machine, insert the CD and mount
    the CD-ROM drive. To make this, use the following command:


    ```

    # dd if=/cdrom/disks/rescue of=/dev/fdb0

    ```


    Or, issue this command from a Windows or DOS machine:


    ```

    D>:dosutils\rewrite disks\rescue

    ```


    # Damaged or Partially Installed


    Sometimes the installation or update will not proceed. You might get a prompt
    similar to this, "Free list corrupt (1753864)—contact support@redhat.com." One
    noted problem from the RPM database being corrupted. To solve this, first make
    a backup of the directory /var/lib/rpm, and then run this command:


    ```

    #rpm --rebuilddb

    ```


    You might find yourself facing a bad superblock problem when the system starts
    to initialize. The file integrity checking system will attempt to correct minor
    inconsistencies, but if the integrity cannot be restored in a normal fashion,
    the system will halt and prompt you with the reason why. If this happens, you
    will have to run the effsck utility to correct the file system problem.


    # CAUTION


    When you run the e2fsck utility, you will have to specify which partition (device)
    you want to check. If the file system is mounted, unmount it—the prompt will tell
    you that serious damage can occur if you don''t. This is a fact! Issue this command:


    ```

    # umount /dev/hda1or appropriate designation>

    ```


    Then continue the process.


    If you encounter problems with LuxLoader, point your browser to http://sdb.suse.de/sdb/en/html/kgw_lilo_linear.html
    and http://sdb/suse/de/sdb/en/html/1024_Zylinder.html for more details on what
    can happen with the boot-loader.'
