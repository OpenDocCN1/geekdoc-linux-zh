  md: "# Selecting the Installation Media\n\nStarting the SuSE install begins with\
    \ a few preparatory steps. The SuSE CD is bootable, if your computer's BIOS will\
    \ support that function. Most newer machines will have no problem.\n\nIf your\
    \ system lacks boot capability, you will need to do the following.\n\n+   1. Using\
    \ an UNIX/Linux system:\n   Be sure to have root or superuser (su) privileges.\
    \ Then insert CD #1, mount the device, and locate the boot image file on the CD.\
    \ Now insert a blank floppy and use the dd command to write the image to the floppy\
    \ disk. Issue the following command:\n   `dd if=/cdrom/disks/ide of=/dev/fd0`\n\
    \n> For installing on non-Pentium machines, do not use the \"ide\" disk image.\
    \ Use this command for building your bootdisk:\n\n```\n```dd if=/cdrom/disks/bootdisk\
    \ of=/dev/fd0```\n```\n\n+   2. Using DOS:\n   Make sure that you are in a DOS\
    \ environment, not using the command.com feature to shell out to an MS-DOS box.\
    \ Issue the following command after inserting the SuSE CD:\n   `D:\\setup`n  \
    \ Follow the instructions, and \"root\" chooser. Voila! Your boot disk is finished.\
    \ (Do not create a \"root\" disk, however, because this version of SuSE does not\
    \ require it.)\n\n+   3. Using the rawwrite program:\n   If you have previous\
    \ Linux experience, you will be familiar with the rawwrite program. This is another\
    \ feature that enables you to build a boot disk from an image on the CD-ROM from\
    \ a DOS environment. With the CD inserted, you should find the rawwrite program\
    \ in the `/utils/rawwrite` directory. The image files are located in the `/use/images`\
    \ directory. The boot images have the extension .ikr. While in the `/utils/rawwrite`\
    \ directory, use this command:\n\n```\n```E:\\utils\\rawwrite\\rawwrite disks\\\
    ide```\n```\n\n+   4. Using SCSI images:\n   SCSI images are a bit more complicated.\
    \ You'll need to create the standard image with this command:\n   `E:\\utils\\\
    rawwrite\\rawwrite disks\\scsi02`\n   Then overwrite the standard image with the\
    \ kernel image you require:\n   `E:\\copy use\\images\\scsiXX.ikr a:\\linux`\n\
    \   This ensures that all the necessary files are copied to the disk, that the\
    \ standard image files are written, and that special files are added during the\
    \ overwrite process."
