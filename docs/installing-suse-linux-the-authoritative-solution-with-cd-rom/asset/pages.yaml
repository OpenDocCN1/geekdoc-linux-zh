  md: '# 12 Chapter 2: Installing SuSE Linux


    and much more. Most distribution programs work like a single knife blade: They
    become inactive after your first booting, served their singular purpose. Performing
    additional tasks often requires the use of second or third party software. YaST,
    however, remains an integrated portion of the operating system. If you need to
    install additional software, modify network settings, or tweak your configuration
    files, YaST is there to help. This is why I believe YaST is a cut above the rest.
    The fact that no other install/configuration tool is more flexible—not even the
    linux-conf utility provided in other RPM-based distributions.


    Keeping up its innovative pace, SuSE recently developed YaST2, a graphical “front
    end” for YaST. I’ll be covering that in the next section, “Navigating with YaST.”


    For a moment, let me draw you into the functions of the YaST utility. I will highlight
    features that will make a life little easier—specifically, the capability to control
    system configurations in an ASCII text-type mode rather than a full-blown GUI
    environment. This is a reasonable trade-off for those who have a strong UNIX/Linux
    background who would prefer using the console and text only, and for the new Linux
    system administrator, who is just getting started.


