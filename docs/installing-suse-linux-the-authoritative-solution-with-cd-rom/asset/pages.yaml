  md: '# CHAPTER 3


    # # Hard Disk Partitioning


    The partitioning process is the most important part of a successful installation.
    Partitioning dictates how you will allocate user space, how much software can
    (or cannot) be installed, and how much you can grow without making any changes
    to your disk structure.


    I subscribe to a few mailing lists, and questions always arise when someone asks,
    "How do I partition my disk(s) for maximum efficiency?" You''ll get a three or
    four different answers because you might partition your disk one way and the guy
    in another shop might have a whole different method.


    Effective partitioning comes down to this: experience. No one works the best.
    The key is to meet the need of your specific environment. This chapter is designed
    to help you build a solid installation and work out some of the bugs in space
    allocation. I''ll take for granted the fact you''ve partitioned disks in the past,
    moving the basics to some of the advanced principles before effective partitioning.


    Linux currently utilizes two filesystems. The EXT2 filesystem is capable of handling
    high-throughput data transfer, supports long filenames, and has built-in error
    checking and tolerance features. This filesystem also allows permissions settings,
    which give the system administrator control over who uses what. Swap is, a filesystem
    in data is transferred from memory space to disk space, which is specially allocated
    and uses filesystem type 82. The native Linux filesystem, type 83, is distinguished
    by the kernel and increases system efficiency by clearing the swap data without
    sorting through the standard data code. This feature in itself has enabled Linux
    to move beyond the average operating systems.'
  merge: -1
