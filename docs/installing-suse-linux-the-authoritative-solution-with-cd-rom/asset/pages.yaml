  md: '# # APPENDIX A


    # # Finding Help Online


    Linux came to life on the Internet. For that reason, you will find an abundance
    of documentation and help available online. SuSE Linux also provides an extensive
    database of support-related questions. The beauty of the support database (SDB)
    is that you can install the relatively complete system, along with the htdig search
    engine, on your machine. The SDB package is available on the CD-ROM.


    The SuSE Web site contain up-to-date information on problems encountered during
    installation. The database expands as the distribution is used. SuSE also has
    a pretty active support group, and it seems as the information obtained through
    online, email and telephone technical support problem resolution has been transferred
    to the Web site database. This site is the best place to find additional information
    on special problems or objects not discussed in this book.


    In every Linux distribution, there are known problems. For version 6.3 problems,
    go to http://sdb.suse.de/sdb/en/html/bugs63.html.


    Other support offerings can be accessed from the main page of the Web site, at
    http://www.suse.com.


    Community involvement for the Linux kernel and application development is strong.
    You will have to find your channel of communication, whether a users group meeting
    or your favorite IRC channel. You might already be involved in some capacity as
    well; isolation can be a terrible thing when you are in the midst of a problem
    that you cannot seem to fix.'
  merge: -1
  pgno: 177
- img_proc: true
  md: '# Join a Mailing List


    By joining a mailing list, you can keep up to date on the growth of Linux. I subscribe
    to a few mailing lists that target problems on Linux; two of my favorites are
    Basic Linux Training, at bl@list.com, and Linux Admins, at linux-admin@vger. rutgers.edu.


    You can even configure your NNTP service to download the current mailing lists
    to such as comp.os.linux.answers, comp.os.linux.help, and comp.os.linux.security.
    This is just for starters, of course: The smoke has finally cleared the incredible
    explosion of Linux interest, and you can find information in quite a few places.


    SuSE offers a number of mailing lists you can subscribe to. These lists include
    subjects such as announcements, database applications, and general user discussions.
    You can subscribe to the list by going to http://www.suse.com/Maillist/index_en.html,
    and choosing one of the current lists.


    If you''re interested in kernel development, you can try http://www.kt.linuxcare.com.
    Or, if you are interested in research and engineering, try Scientific Application
    on Linux, at http://gd/twien.ac.at:8050/index.html. Likewise, if you are cluster
    building, you can browse the Beowulf Project, at http://www.beowulf.org. In addition
    the Linux in Hi-Performance Computing Web site is located at http://www.cs.berkeley.com/~mdw/linux/hpc.html.


    Some other for online help in the form of Internet relay chat (IRC) channels on
    the Internet. SuSE does not have a dedicated IRC channel, so if you prefer to
    get an answer from someone, be prepared to sift through a bunch of other. Some
    options include servers such as under.net and org.openprojects.org, as well as
    a host of others. I seldom visit the IRC channels as #linux, or #linepeople, but
    when push comes to shove, I''ll bite the bullet to some information. Don''t get
    me wrong—I have a lot of respect for the operators on the IRC, but I''ll find
    the flurry of information way beyond my pace.


    Here''s the catch: If you use IRC, understand that your specific question may
    not be answered. This might not necessarily be because everyone is ignoring you,
    though—it could be that no one has the answer. I have seen a few people leave
    the channel with the thought, “They didn''t want to help me!” Still, I''ve solved
    a couple problems by simply watching the questions and answers of others. Give
    it a try.


    # Linux Users Groups


    Linux users groups (LUG) are springing up all across the United States and Europe.
    These groups are organized for the furthering of the Linux operating system and
    for general users. These meetings cover topics such as networking, firewall configurations,
    and desktop utilities. The goal is for the community to share in itself, which
    also fosters a sense of unity.'
  merge: -1
  pgno: 178
- img_proc: true
  md: '# Additional Reference Resources 169


    Unfortunately, including a list of users groups would take up more than a hundred
    pages. Instead, this section gives you a few good URLs to find a group near you.
    Most LUGs have a local meeting place and a mailing list dedicated to their members.
    Contact the group closest to you, and get to know some of the people in your community
    that are involved in Linux.


    For starters, visit the one sponsored by the LinuxMail, at http://linuxnews.com/programs/usergroup/list.
    Another good site is http://www.linux.com/search.html. This URL leads to a search
    engine—just type your location information, and it will indicate the closest LUG
    in your area. The Yahoo! LUG listing is also available at http://clubs.yahoo.com/clubs/suselinuxusers.


    Becoming part of the Linux community is what stirs the interest of other users—find
    a group in your area and you''ll see what I mean. I have used Linux for nearly
    4 years, and I find that I am always learning and growing. Finding help also means
    finding friends.


    Some LUGs (including the one through http://www.ecn.purdue.edu/PLUG/Installfest/)
    have installfests, times when you can join your software and hardware and get
    everything running—well, as close as possible.


    One LUG that I had the chance to attend was putting together special interest
    groups (SIGs) for programming, security, and other pertinent issues. Joining a
    LUG will not only give you a better idea of how to use Linux on a personal basis,
    but it might give you a chance to meet people who are using Linux in a larger
    environment.


    # Additional Reference Resources


    The SuSE Web site, at http://www.suse.com, includes more than just installation
    information. The database and online help system found here are representative
    of a strong service background. You will find solutions to problems that date
    back to version 4.2, both answers for problems that seem isolated and tricky ones
    that are fairly common.


    Information on the Linux software and the ReFS filesystem is documented in the
    database. Booting problems, PCMCIA diagnostics, and many other time-consuming
    procedures have been worked out as well, and simple solutions are provided in
    the support text. On the whole, SuSE has the right foot forward in the area of
    support documentation.


    The Linux Documentation Project (LDP) Web site, located at http://metalab.unc.edu/LDP,
    is the largest repository of information pertaining to the Linux operating system.
    The included HOWTOs contain the collective knowledge of the community, and this
    LDP is supported by users of Linux. If you take a moment to read the LDP Manifesto
    (at http://www.linux.org/manifesto.html), you''ll have a clearer understanding
    of who does what and how.'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# 170 Appendix A: Finding Help Online


    You can also use the LDP to identify and resolve problems. In addition to the
    SuSE support database, this might be a critical stop on your information trail.
    This vast range of subject material can be helpful in getting your system running
    properly.


    The Linux Weekly News site, http://lwn.net, also brings the important Linux issues
    to the frontend. This site is a great resource when you are searching for current
    trends and subjects. This site also maintains interesting links that span the
    Linux world.


    Linux Today, at http://www.linxtoday.com, is always jammed-packed with the latest
    Linux news. This site is sure to have everything for you, including recent Linux
    opportunities, security posts, and weekly summary. You can have all the major
    posts and summaries sent to you (as I do), for convenience.


    The most visible (and most referenced) site is Slashdot, at http://slashdot.org.
    This Web is a stockpile of current information that also features editorials nowhere
    else on the Internet. It is a large news site that focuses on concerns within
    the Open Source computing community.


    The LinuxJournal, at http://www.linuxjournal.com, is another wonderful place to
    visit and search for past articles. I subscribe to the magazine and, I''m always
    impressed on how the staff writers are able to cover in one issue. You can search
    the archives based on keywords and subjects.


    System administrators should look to http://www.samag.com. This site is focused
    toward UNIX system administrators, but some of the information and article are
    relevant to Linux as well, including the Linux Rookery. Take a look at this site
    if you are into big iron stuff.


    You can keep yourself up to date by watching http://www.linux.org.uk/cgi-bin/portaloo/.
    This portal has links to several high traffic sites that can help you sift out
    information you need. There''s also http://www.linuxlinks.com/ and the portal
    page at Penn State, http://www.math.psu.edu/morris/deptpage/portals.


    Of course, new portals and Web sites pop up every day. The rapid increase in popularity
    will continue to compel this phenomenal explosion called Linux.


    The resources on the Internet, mailing lists, and IRC channels are not the only
    places to find good help, of course. You might find other means or avenues of
    assistance on your own. Whatever you do, have fun!'
  merge: -1
