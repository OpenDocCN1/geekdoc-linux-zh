  md: '# 60 Chapter 5: Booting into SuSE Linux for the First Time


    To use the rescue system, you must build a rescue disk (unless you have a bootable
    CD). With a bootable CD-ROM drive, cold-boot the system and follow Linuxre to
    the Main menu; then select Start Installation/System. Choose Load rescue system
    from CD; the screen shows the rescue system loading into a RAM disk. When this
    is loaded, you can begin the task of rescuing the system. The rescue system does
    not require you to have a root password. You will be able to access three virtual
    terminals (called consoles), using the Alt+F1 through F3 keys. The Alt+F4 key
    combination enables you to view log messages from the kernel and also syslog.


    The rescue system includes vital maintenance tools such as fdisk, mkfs, shut-down,
    mount, and ummount, just to name a few.


    When you''re inside the system, you must mount the file systems /mnt as a mount
    point. You must identify the /(root) and /usr (user) file systems (such as /dev/hda1
    and /dev/hda3). Mount them using the command:


    ```

    #mount /dev/hda1 /mnt

    #mount /dev/hda3 /mnt/usr

    ```


    You are now ready to start rescuing your system. This operation could entail file
    editing, however, and no file editor is contained in the rescue system. You must
    issue this command:


    ```

    #mnt/usr/bin

    ```


    This command grants you access to editors such as vi and joe. The rescue system
    also contains the networking tools ifconfig, netstat, and route for network diagnosis.


    > NOTE\If you cannot access the CD-ROM drive, use the option Load Rescue System
    from Disk, and insert the rescue disk into the disk drive.


    When you''re inside the system, you can edit the /etc/passwd file to remove the
    password marker (X), as follows:


    ```

    root:x:0:0:root:/bin/bash

    root::0:0:root:/bin/bash

    ```


    Restart the system. Root now can log in without a password. You should update
    the password as soon as possible; see Chapter 8 for details.'
