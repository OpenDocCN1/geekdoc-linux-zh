  md: '# Determining Your Vulnerabilities 151


    servers are being set up with the assistance of qualified security professionals.
    The race to get sites up and running is phenomenal—and in this race, true preparation
    is not considered. These weaknesses is what system crackers (I will refer to them
    as “black hats”) are looking for. On the opposite side of this issue are community
    of hackers whose goal is to find the breaks, holes, and vulnerabilities in the
    software before a system is compromised (these are the “white hats”). Performing
    tests prior to a compromise is key because the noted vulnerability can be fixed,
    tightening security. Sometimes the lines seemed blurred between black and white,
    it’s a benefit to have this type of security enforcement in place.


    Through your experience, you’ve found that Linux is not affected by the normal
    virus that attacks other operating systems currently in use. It’s a warm, fuzzy
    feeling when you can sit back and not worry everyone else is infected or waiting
    for it. Be warned, though: Linux in general is not affected by virus attacks,
    but plenty of other things will cause chaos in system operations.


    Consider this scenario: With improper configuration, a “black hat” can connect
    to your system, gain root access install software (root kit) that will allow him
    or her to return to your machine unhindered, and then utilize your machine as
    a source of attack or any other operating he she may want to. Think of this in
    multiplied numbers, as boxes go online all over the world unsecured—scary!


    When your machine is “owned” (by the intruder), the system can be used to hide
    programs—Remote Access Trojans (RATs) that are ready to map keystores or password
    files and then mail them to a specific email address. Or, if your system could
    be used in a coordinated network attack. Imagine trying to explain to your service
    provider why you are not the culprit in a distributed network attack that emanated
    from your IP address.


    ![](img/e140cb30051378468280d532cc3eccef_161_0.png)


    > The statistics speak for themselves: Seventeen trojan-type programs were written
    in 1999, approximately 81 were built in 1998, and, at count, 156 new trojans were
    created in 1999.


    The list in Table 15.1 shows existing trojans and the ports that communicate.
    In most cases, the lower ports are used by trojans, which steal passwords and
    either mail the passwords to attackers or hide them in a predetermined, compromised
    directory.


    The problem associated with RATs and password-stealing trojans is detection: Keeping
    a constant vigil on the system logs and knowing which ports are open could be
    your only safeguard. All the trojans listed here do not affect UNIX/Linux systems—my
    intent is to show the amount of effort put behind network compromise and intrusion.
    If you operate in a mixed-platform environment, this might help you identify other
    possible problem areas.'
