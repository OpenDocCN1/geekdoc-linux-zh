  md: '# 158 Chapter 13: Securing the Network


    # Analyzing the Network


    Every machine on a network may need some type of tweaking and tuning to make sure
    that it is security-ready. Even the best systems can use a little work—nothing
    is perfect.


    Consider this example: A couple of years ago, I had an account with a Web-hosting
    provider that included a shell account, by which I could use ftp to upload my
    HTML files onto the server. I enjoyed the service and the account because I was
    using a Linux-based machine. I somehow gained access to the /directory, however—I
    was surprised that I could do so, and I graciously returned to my/home directory,
    desiring to stay in good standing with the provider and feeling like I just peeked
    through someone''s bedroom window. Several days later, nudged by curiosity, I
    attempted to try the same—I was now unable to access /bin, /sbin and as I had
    done previously. If I had an intruder, I could have “owned” on my first visit.
    Obviously, the permissions were not set correctly. I signed up for service shortly
    after the server provider had gone online.


    The responses from tech support were almost nonexistent, which indicated that
    they were almost completely overwhelmed with work. It was evident that after my
    accident-break, someone was able to watch and monitor administrative logs and
    resolve the permissions problem, limiting my access to critical files. I can see
    this happening in a lot of places, particularly high-volume Web-hosting providers
    that allow thousands of shell accounts on their servers, missing vital configuration
    specs that give root access to a supposed friendly account.


    How do you eliminate problems like these? How can you analyze your network and
    make it harder for someone to compromise it? Computers help to automate tasks,
    a good majority of people have been lulled to sleep, believing that their firewalls
    and automatic auditing tools make their networks impenetrable. Each new break
    proves them wrong. Why is there a continued lack of security?


    If you own a house, you have responsibilities such as landscaping, plumbing, and
    general maintenance duties. The work could be significant, if you hired a gardener,
    a plumber, and a handyman to do the work. If you wanted the best for your home,
    you''d invest. Or, you might be pretty good with tools and a good-sized toolbox
    and the right books so when something breaks, you can fix it. If you are serious
    about security, you''ll do one of two things: use all the tools that come with
    SuSE Linux and stay briefed on security issues, or hire someone to do it. If neither
    choice is made, then your house is destined to be ruined in some way.


    # Using Other Methods


    If you have decided to take matters into your own hands, here are some pointers.

    The first thing you should do is expose all the weak passwords on your system.
    SuSE come with a program called John the Ripper, which is similar to the famous
    Crack program, although with a number of different features. To crack your password
    file, simply issue this command (as root or superuser):'
