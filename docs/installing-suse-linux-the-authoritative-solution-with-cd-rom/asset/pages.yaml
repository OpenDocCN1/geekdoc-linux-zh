    In 1999, The CERT Coordination Center (part of the Survival Systems Initiative
    at the Software Engineering Institute, located at Carnegie Mellon University)
    identified a new type of trojan attack. The Distributed Denial of Service (DDoS)
    attack is a trojan-based attack taken to a new level. For information, point your
    browser to http://www.cert/incident_notes/IN-99-07.html or http://www.icsa.net/html/communities/ddos/index.shtml.


    There are other types of threats that can come from non-local (remote) sources
    on the Internet. Buffer overflow attacks are considered an effective way to compromise
    security on Linux platforms. The problem is due to errors in C program files.
    You will notice that existing applications may require a patch due to vulnerability
    to a buffer overflow attack. For more details on how buffer overflows can affect
    your system, see http://www.infosecuritymag.com/may99/news.htm, and also, http://www.insecure.org/stf/smashstack.txt.


    These are a few examples to show that security is a big issue. Your Internet presence
    come at a cost: a watchful eye and a knack for detail.


    Here are some other URLs that can provide helpful information on how to keep your
    system secure:

    Linux security HOWTO: http://www.linux.org/HOWTO/

    Security-HOWTO.html

    Linux security home page: http://www.ecst.csuchico.edu/~jmurphy/

    Bugtrap: http://www.mit.edu:8008/melenaus/bt/

    Cert''s documentation on trojan horses: http://www.cert.org/advisories/

    CA-99-02-Trojan-Horses.html


    # Vulnerabilities on the Local Intranet


    The greatest security threat does not come from the outside world. If you happen
    to support some type of Web presence, hopefully you will not allow undeterred
    traffic into your network. The simple checks and balances inherent in SuSE Linux,
    as pass-'
  merge: -1
  pgno: 166
- img_proc: true
  md: '# Determining Your Vulnerabilities 157


    word requirements and the like, slow the rate of outside intrusion. Consider the
    network, however: Users are assigned passwords and have prolonged access to the
    network. This is where the highest potential threat comes from.


    The issue of password protection is important. Some people will receive a password
    and, for convenience, will write it down and put it in a “safe place,” such as
    the bottom of the keyboard, or there could be multiple users who know the others''
    password. This will easily break down good security measures—I have worked in
    places where security has been compromised for these very reasons.


    The worst-case scenario may be similar to this: Your intranet computer systems
    previously thought to be isolated from the outside world become accessible through
    carelessness and back doors. Your R/D department develops a major new product
    in secret using the internal network, but “black hats” creep in, sniff around,
    and find the unreleased product, snatch the information, and either sell the details
    to the competitor or blackmail the enterprise.


    Before the end of this chapter, I will give you some options to look at, and more
    resources that you will use in the area of intranet security. First, though, let’s
    look at a few areas of concern, starting with the internal threats.


    # Internal Vulnerabilities


    Internal vulnerabilities usually are generated from unverified information exchanges.
    It could be easier to get a password to a system from a live person than trying
    to gain network access and crack the password file. If the intruder uses this
    method, he has realized that people, in general, want to be helpful—if given the
    opportunity, they will try to help out as much as possible.


    Consider a scenario like this: A caller contacts an account holder (employee)
    and represents himself as tech support. He then states that the call is only a
    courtesy, that some files will be moved during the night shift and that his are
    affected. The caller may ask if this is going to pose a problem for them; the
    employee answers no, and the caller inquires and requests the username and password.
    In an attempt to help, the person divulges this information, and your systems
    are now compromised. This is called “social engineering”—getting someone to the
    front door is always better than breaking in.


    Another threat is an employee or account holder who has been terminated; they
    may have left under less agreeable circumstances, or they might feel that they
    must exact some type of revenge. If proper steps are not taken, your system will
    become again compromised from inside.


    There are other means of internal compromises, including “shoulder surfing”—observing
    keystrokes and input by another user. On the basic mentality of social engineering
    concepts, point your browser to http://packetstorm.securfy.com/docs/social-engineering/soc_eng2.html.'
