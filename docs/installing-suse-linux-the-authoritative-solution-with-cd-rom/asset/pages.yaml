  md: '# YaST Package Handling Methodology 35


    # RPMS AND SECURITY


    RPMs are convenient to use, but you should be aware of some concerns. You must
    install RPMs as root (superuser) to have the necessary write permissions. This
    poses a threat to system security. Some people might not consider it as such,
    however, or regard this as trivial. Here are the facts, though:


    The RPM installer operating on the root account now has full read-write access
    to your system. This opens a potentially hazardous security hole, and you may
    unknowingly swap system binaries and libraries, rendering some other applications
    useless. In addition, in the worst case, you might install a Trojan program that
    could compromise the integrity of your system.


    For this reason, MD5 checksum capabilities have been included in the package manager.
    I will show you how to verify the packages in the Changing/Creating Configuration
    section of this chapter. Where you get your software is highly important—see Chapter
    13, "Securing the Network." The life of your system depends on it.


    To assist in the smooth installation of packages, interfaces such as gnoRPM and
    xrpm have been designed. Still, no matter how fancy these tools are, they are
    overshadowed by YaST. For a tool to be effective, you must want to use it. YaST
    has helped with the task of partitioning and formatting the disk, and stands ready
    to guide you through the task of package selection and disk use management (a
    feature that is by itself its weight in gold).


    With any computer system, software management is a critical area. Large or small
    systems can afford the cost of incorrectly installed or improperly configured
    software. Guaranteed, nothing is foolproof, lessening the odds of failed application
    is the goal of every serious developer. Using RPMs makes the job of installing
    more livable.


    For those who have not used RPMs recently, the package manager has had some upgrades
    applied to it. The current version is 3.0.3. The features included in the 3.0
    version consist of multiple package installation, which reduces the chance of
    unverified package dependency failures, and the ability to check for the proper
    amount of disk prior to installation.


    However, there are two implementations of YaST which handles the basic (hard-core)
    tasks. Installing the system with the original YaST may prove to be educational,
    so again familiarity is the essential element.


    The age-old problem during first-time installation is knowing what package(s)
    to select and what is really necessary. This might seem to be an issue resolved
    for those who are becoming acquainted with the fundamentals of Linux installations,
    yet I continue to answer questions raised issues brought up on mailing lists to
    the selection of packages—and no really specific answers are ever given. The main
    reason for these'
