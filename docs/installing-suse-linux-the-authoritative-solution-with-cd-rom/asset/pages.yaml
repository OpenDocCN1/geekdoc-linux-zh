    # CD Installation


    Whether you use the bootable CD or the boot disk option, a cursory reboot will
    be required. If you immediately strike the Enter key, the familiar boot prompt
    will appear. If you strike any other key besides Enter, the system will wait for
    additional input, mount instructions, or boot arguments. Figure 2.1 briefly outlines
    the installation sequence.


    ```

