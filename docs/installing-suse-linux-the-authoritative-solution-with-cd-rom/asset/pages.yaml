  md: '# 102 Chapter 9: Tailoring a Custom Kernel


    The simplicity of building a new kernel is refreshing. You can choose to use the
    basic text-based configuration utility or the menu type configuration tool. An
    X Window interface is easy to use, if that''s your preference.


    The main reason I have become familiar with the issue of compiling kernels is
    on need. I needed to get a piece of hardware running on my Linux system, so I
    was faced with the proposal of keeping a useless piece of hardware or taking the
    challenge of customizing my kernel. I have found over the course of time, that
    this step has helped me more than I could have imagined. I have been able to get
    systems up and running in situations, if I had lacked the ability. I might have
    erroneously thought that Linux was not as capable or flexible as the other operating
    systems. My laptop runs the development kernel 2.3.34, which gives me some capabilities
    (sometimes a surprise) that have yet to be incorporated into the stable kernel
    tree. So, getting acquainted with the process will only enhance your future installs.


    # WARNING


    > Remember, the stable kernel version is 2.2. I do not recommend experimenting
    with the development kernel because these can be quite unstable. Development kernels
    are not guaranteed to successfully compile or to perform with your current hardware
    configuration.


    I have noticed on mailing lists the increased interest in kernel compiling, and
    I don''t believe this is coincidence. Once when you get a router, firewall, workstation,
    or computer that has dial-up capabilities in one box? You can connect multiple
    machines to the Internet from one dial-up account and then enable simple firewall
    rules to protect your LAN from intruders. The items that operating system charge
    for are built right into the Linux kernel.


    There are plenty of other reasons to “roll your own” kernel, but those should
    be for starters—the complete list would take up a whole page or two.


    # Performing the Building Process


    Whether you decide to include or exclude components in customizing your kernel,
    you will have to be careful to read all the kernel options before you start. I
    recommend accessing the Kernel-HOWTO for details, including questions that you
    are not addressed in this text. You can find HOWTO at /usr/doc/howto/en/html/Kernel-HOWTO-2.html.


    It is not feasible to cover every step of the kernel build process because there
    are factors that only you can qual or determine. Building the kernel should not
    be a rushed process. A general overview of commands which are used in the building
    process are outlined in the section “Tailoring the Kernel Components.”'
