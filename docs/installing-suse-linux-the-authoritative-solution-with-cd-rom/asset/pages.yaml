  md: '# 92 Chapter 8: Managing Users and Groups with YaST


    # CLI Commands for User Accounts


    Although YaST can perform many of the administrative tasks required by a system
    owner, there is no substitute for the command-line user management utilities.
    These can be used to change passwords and other vital user information quickly,
    and you will not have to invoke YaST or sort through a menu selection. I have
    mentioned the usadd and userdel commands previously, but I will list them in this
    section.


    +   - useradd—Adds a user and creates a work environment for the new user (bash
    shell)

    - userdel—Deletes a user account, including the /etc/passwd and /etc/shadow files

    - chfn—Changes the full name field

    - chsh—Changes the login shell environment

    - passwd—Changes the user password


    Be mindful that normal users can use these commands to change the content of their
    accounts. If this is a problem, you can limit non-root users by using the chmod
    command. Change all the commands so that root has access only.


    If you intend it to change a username and you are unable to use YaST, type the
    command vip to edit the /etc/passwd file. For editing groups, type the command
    vig at the command line. If you are not familiar with the vi editor, use your
    favorite editor and load the password or group file by its filename (/etc/<filename>).


    # Group Management


    Using groups as a means to control file access has in practice for a while in
    UNIX-type environments. Users must be assigned to at least one group, and that
    group might require that others in the same group have the ability to read or
    write to the same file. In a multiuser environment to allow access to specific
    people—this enhances security and system manageability. The groups are defined
    by their actual name, and the group information is contained in the file /etc/group.
    Group 8.4 shows an example of the group structure.


    You will note that group information is straightforward: group name is listed;
    next is the password placeholder, represented by (x), the numerical ID number
    (0); and list the members of that group. The main concerns are the name of the
    group and the numerical classification that you or the system assigns to that
    group.


    # CAUTION


    Do not delete or modify any group settings until you are familiar with group structures.
    The system creates groups such as root, wheel, tys, and daemon for operational
    purposes, so it''s not wise to change or add to this file prematurely. Establish
    your working groups, and then delete the unneeded ones accordingly.


    When you name groups, do not use arbitrary names; keep the naming convention (standard)
    to help you and any other administrator figure out the group listings.'
  merge: -1
