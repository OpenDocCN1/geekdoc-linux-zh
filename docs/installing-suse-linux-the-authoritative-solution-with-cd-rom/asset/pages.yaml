  md: '# 74 Chapter 7: SuSE Communication Features


    connecting to a computer. The transfer of data over the telephone line created
    an interesting situation, however: the telephone system spoke a different language
    than the computer. The phone system and the computer system needed a translator.
    Thus, the modem was invented.


    A modem is a device that converts data from one form into another, as from form
    usable in telephone-type transmissions. The computer processes digital signals
    that the modem translates to analog signals, then are conveyed across the phone
    lines. This small device relies on the Point-to-Point Protocol (PPP), as a method
    for communicating between two computers using a serial-type interface, typically
    a personal computer connected by phone line to a server.


    As an example, X X server provider provide you with a PPP connection that the
    provider''s server can respond to your requests. The server then passes your requests
    to the Internet and in turn, forwards your requested responses back to you. PPP
    uses the Internet protocol (IP), which sometimes is considered a member of the
    Open Systems Interconnection (OSI) reference model, PPP provides Layer 2 (data
    link layer) service. It packages your TCP/IP packets and forwards them to the
    server, where they actually can be distributed via the Internet. This is a model
    of the basic dial-type connection. The maximum connection speed is (at this point)
    around 56Kbps, depending on the phone connection and the line quality.


    Today computing has moved far beyond the 4800 or 9600 baud rate methods that previously
    prevailed when I started using BBS services. My current connection is a high-speed
    cable modem that transfers information at least 600kbps. Telephone service providers
    can supply even 1.5Mbps on a standard telephone line. DSL technologies use untapped
    digital-only bandwidth available on current telephone lines at one time provided
    log telephone service alone. SDN, DSL, cable and even satellite connectivity solutions
    around well, and the advent of the "wireless" LAN is upon. Check out the Wireless
    LAN and Linux resource page at http://www.hp.com/personal/Jean_Tourr1/Linux/)
    Every day, another network of connection seems to be added to the list.


    How will the multitude of connection protocols protect your SuSE Linux system?
    Well, I have good news: The distribution will help you to connect and configure
    any type of dialup or full-time network connection.


    Of course, how you connect to a network will be an important factor. In the past
    few years, modem connections have been used for a major portion of applications.
    Quite a few companies relied on this type of technology. Although it was a reliable
    form of communication, it was extremely time consuming. For example, two companies
    that I worked for used modem connections to upload and retrieve information from
    offices out of state. Because of slow connection speeds, the network transaction
    took late at night or very early in the morning. The MIS department has opportunity
    to transfer files, and configure the system without interrupting the corporate
    work routine. By comparison, the modem speeds available today help transfer data
    and continue working throughout the day.'
