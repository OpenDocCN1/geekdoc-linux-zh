  md: '# Partitioning Your Disk


    The fdisk utility supports various types of partition formats. The ones shown
    are type 83, which is Linux native (ext2), type 82, Linux swap and type 5, which
    is an extended partition. Extended partitions, as SuSE calls them logical partitions,
    are used quite often, since the fdisk utility can allocate only 4 primary partitions.
    If you have a large disk, there''s a good chance you will create a sizable extended
    partition.


    As you allocate space on the disk, keep in mind the software applications you''ll
    need to load and possibly some database server or user space for home directories.
    Note the prompts at the bottom of the menu. Using the keys will give you access
    to system help (F1), specify filesystem type (F3), delete (F4), or create new
    partitions (F5). The F6 gives you full access (not just the header) to errors
    found by the fdisk program.


