  md: '# 124 Chapter 10: Managing the Network Setup


    You''ll also need to enable the option NFS_SERVER; this service will start rpc.mounted
    and rpc.nfsd.


    If you would like NFS to convert the user IDs and the group IDs, select the NFS_SERVER_UGID
    [yes] option. Another setting, the REEXPORT_NFS [yes] option, can also be adjusted
    through YaST1. If you want to re-mount NFS directories, use this option.


    Details on setting up an NFS environment are located at http://metalab.unc.edu/mdw/HOWTO/NFS-HOWTO.html.


    The Network Information System (NIS) is a network and administration system for
    smaller networks. It masks the network operation (for different machines) and
    offers a seamless network environment. By design, it is intended for use on local
    area networks (LANs).


    As with NFS, NIS uses the client/server model and the Remote Procedure Call (RPC)
    interface for communication between hosts, so the portmapper daemon must be running
    using NIS.


    As a note, NIS was originally called Yellow Pages, but someone had already trademarked
    name, so it was changed to Network Information System.SE Linux refers to NIS as
    "YP" (Yellow Pages).


    To create a YP (NIS) configuration through the YaST1 utility, select CREATE_YP_CONF
    [yes].


    To identify the domain name for the YP (NIS) server, use the option YP_SERVER
    <server-name.com>. The domains for the YP (NIS) host(s) should be entered in the
    YP_DOMAINNAME field.


    If your system is configured for name resolution, you can also use YP (NIS) to
    resolve the queries for hostnames by using the option NIS_FOR_RESOLVING and to.


    If you will use YP (NIS) as a service on your network, check the HOWTO for NIS,
    located at http://metalab.unc.edu/mdw/HOWTO/NIS-HOWTO.html, for extensive detail
    on the inner workings of this type of service. You have obvious security issues
    to consider. The system must be capable of reading /etc/passwd, /etc/shadow, and
    /etc/groups over the network connection. There are a of merits to the system.
    You will ultimately weigh the cost/risk benefits and then proceed accordingly.


