    ![](img/e140cb30051378468280d532cc3eccef_169_0.png)


    **Figure 13.1** Password Cracking Utility.


    "John" Password Cracking Utility.


    The first password was cracked in approximately 30 seconds. Good passwords work;
    weak ones don''t!


    SuSE includes another tool that is a preemptive password verifier. If you have
    a doubt concerning a user password, utilize the program called vpass. If you use
    cracklib to qualify an okay password, or it will return "ERRNO <reason>" and let
    you know whether the password is too short, all lowercase, or what not. This issue
    command:


    ```

    echo <user name> vpass -u

    ```


    This small program is worth its weight in gold. When admin have a moment during
    the day, checking a few users and emailing them to the situation is called proactive
    security.


    Your next move will be to check for root compromise capability. Although SuSE
    sets the permissions in post-install, you want to find out if there is any way
    that one inside can obtain root access. You''ll need to pick up Tiger Animal Research
    Assistant (TARA) for this. This is an upgrade to the TAMU tiger program, which
    is a set of scripts that will scan your system for security problems, especially
    root access problems. This program is not included in the SuSE distribution, so
    you''ll have to download it from http://home.arc.com/tara/index.html.


    After you have downloaded the tartal, extract it into a secure directory, preferably
    not root. Run make and make install, and then run the program. You might never
    know what is open on your system unless you really look for it, and TARA will
    help identify potential threat areas. (See Figure 13.2.)


