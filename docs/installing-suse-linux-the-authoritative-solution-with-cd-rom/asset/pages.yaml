  md: '# Mission Critical Disk Partitioning


    In the future, companies and large corporations likely will decide to utilize
    Linux as a server solution. With this in mind, kernel developers have integrated
    advanced features into the generic v2.2 package. Most of the improvement have
    been tested and used in UNIX systems for a while, so the growth of Linux has somewhat
    overrun its maturity. The object now is to implement the existing applications
    into the current kernel versions.


    Staying on the bleeding edge of technology. SuSE has incorporated some additional
    filesystem features beyond RAID support, which is standard in all v2.2 kernels.
    With the Linux platform reaching enterprise levels, there has been a swell of
    requests to support a faster, more flexible filesystem and new ways to construct
    disk space in business environments. SuSE Linux has added to the 6.3 version management
    programs which are in the developmental stages. The first is ReiserFS, and the
    second is the Logical Volume Manager (LVM) program. ReiserFS is maturing at a
    rapid pace, and LVM support is built into the v2.3 development kernel, indicates
    that it may be a part of the upcoming 2.4 release kernel. Each of which will provide
    big businesses increased efficiency.


    # RAID Arrays


    RAID (for Redundant Array of Inexpensive Disks) ensures that information is consistent
    by spreading it across several disks, using techniques such as RAID Level 0 (disk
    striping). This method provides no mirroring benefits (in case of a disk crash),
    but it does decrease disk latency, which speeds up data transfer rates.


    RAID level 1 (disk mirroring) helps achieve redundancy and recoverability from
    hard crashes.


    RAID and disk setup fall beyond the scope of this discussion. You can find more
    information at http://metalab.unc.edu/pub/Linux/ALPHA/linux-ha/High-Availability-HOWTO.html,
    http://www.vogoninternational.com.


    There are also resources that will help with specific types of RAID application.
    Software RAID and hardware RAID HOWTOs are located at http://www.linux.org/il/LDP/HOWTO/mini/Software-RAID.html
    and, for SCSI applications using the DPT Smartcache controllers, at http://www.linuxux.org/HOWTO/mini/DPT-Hardware-RAID.html.


    # Reiserfs


    The Reiserfs filesystem has journaling capabilities check integrity checks performed
    by the efsck program after an unexpected shutdown, features resizing, and uses
    a balanced tree algorithm to minimize the average number of disk accesses. There
    have been some significant successes in the development of reiserfs, especially
    the journaling aspect. See the press release at http://devlinux.com/projects/reiserfs.'
