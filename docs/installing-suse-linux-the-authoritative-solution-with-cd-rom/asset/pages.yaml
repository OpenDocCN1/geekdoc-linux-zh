- img_proc: true
  md: '# 8 Chapter 1: Assessing the Platform


    # Sound Cards


    Sound cards such as Sound Blaster and Sound Blaster Live are other popular components.
    In the past, drivers for sound cards have been as scarce as video card drivers.
    This, too, is changing as sound card vendors are enticing more requests for Linux-supported
    drivers. At this time, however, SuSE does not support PCI cards. The sound driver
    packages available on SuSE must be configured and initialized to operate; this
    will be reviewed in Chapter 11, "Sound for SuSE Linux."


    # Printers


    Printers can range from a small inkjet type to a networked form printer. Both
    Postscript and DeskJet printers are supported. Getting your local or remote printer
    going will be covered in Chapter 8, "Managing Users and Groups with YaST"


    # Monitors


    Monitors, whether as small as 14-inch or as large as 21-inch, should pose no problems
    with SuSE Linux. You would do well to have the monitor''s specs handy, but if
    not, the video detection utility will help. I strongly recommend that you use
    the specs available in case you have a monitor that is not listed on SuSE''s hardware
    database.


    # COMPATIBILITY CONCERNS


    An increasing number of computer users are trying Linux for the first time, or
    updating to a different distribution. Although all of them run on the Linux kernel,
    include or exclude certain hardware supports. I hope you have a clearer idea of
    what it will require to extract the maximum performance from your system and SuSE
    6.3.


    You may be installing over another distribution or building a new box to test
    SuSE. All the information on hardware is current and reflects most of the leading-edge
    technologies. Hopefully this chapter refreshed your memory on certain things while
    also bringing to light other pointers. Linux still has some ground to cover before
    all the hardware on the market is compatible. Until then, hardware will need to
    be scrutinized, and every effort must be made to identify and catalog the components
    of each box.


    For big business, it might prove easier to find the right hardware combination
    and clone it. This will eliminate some of the headaches involved in deploying
    a new operating system.


    Portable users will be impressed (as I was) with the ease of installing and running
    SuSE. Configuring all the components is a snap.


    Simply put, the ease of installation is narrowing, and Linux is easier to install
    than ever before. Finding the right distribution for you may be only a few keystrokes
    and mouse clicks away. If you have some reason to question compatibility of certain
    hardware components with SuSE Linux 6.3, point your browser to http://cdb.suse.de.cdb_english.html.'
