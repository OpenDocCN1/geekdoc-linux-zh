  md: '# Dialup Networks


    # # Cable Modem Setup


    Cable Internet has taken the industry by storm. Although it competes with high-profile
    telephone companies, it has drawn a substantial following. What better than have
    Internet access and cable TV at the same time? The bandwidth limitations are real,
    but unless you are in need of a dedicated T1 line or require connectivity for
    a VPN that carries a large amount of secure traffic, cable connectivity may be
    just the ticket. If you''re presently using cable, you already know the benefits.
    You have the advantage of high-speed data transfers and no dial-up connection
    problems to deal with, you are always online, ready to go. There is one element
    of cable I am still weary about, though the shared bandwidth factor. In Figure
    7.5, NetWatch shows you your surrounding traffic.


    ![](img/e140cb30051378468280d532cc3eccef_91_0.png)


    # Figure 7.5


    Viewing network traffic on do not support Linux as a viable platform, although
    this only due to the fact that their staff might not have the skills to help the
    growing Linux community. During my installation, I installed my laptop and configured
    it to boot Windows. The whole thing went smoothly—I had a fast Windows machine,
    so I proceeded to set up Linux on my gateway box.


    Most cable modem installations require a network interface card, which connects
    to the cable modem itself. Not involved in the actual configuration. Most cable
    modems have a built-in self-configuring feature, for this: You are residing on
    a common network, where the responsibility of IP address allocation is up to the
    company''s network. Therefore, the cable modem must “talk” to the modem to validate
    your connection. The only thing that is left is the selection of a quality network
    card(s).'
