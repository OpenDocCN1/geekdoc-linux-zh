    # Deleting Users


    The F5 key deletes the user account. This is performed by the script /usr/sbin/userdel.local,
    which deletes the entries from /etc/passwd and /etc/shadow, but leaves the /home/<username>/
    directory.


    A few words of caution: Before you delete the user account, it is better to disable
    the account. This will keep the person from using the account while the file maintenance
    is being performed (deletion of all account reference from the system). Disabling
    the account can help if the person has left suddenly and might return in the near
    future or is on a medical leave. To disable an account, you''ll need to invoke
    your favorite editor and replace the user''s password placeholder (x) with an
    asterisk (*).


    # NOTE


    If the user has left owning root, immediately change the root password, but do
    not disable the account, for obvious reasons.


    If you are certain that the user will not return, delete the account and flush
    the system of all the user''s files by searching the system with the find command,
    as follows:


    ```

    # find / -user <username>

    ```


    Depending on system size and user files generated, this could take a while. Running
    this during off-peak times will help speed up the process. After locating the
    files associated with the user, make sure that all are removed. This should include
    all mailboxes, mail aliases, print jobs, and cron or at jobs that still exist.'
