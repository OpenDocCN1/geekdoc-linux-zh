    # FTP Programs


    File Transfer Protocol (FTP), an Internet protocol, is designed to exchange files
    between computers on the Internet. There is a multitude of excellent FTP programs
    in the Open Source camp; we will look only at two of them: NCftp and wget.


    # NCftp FTP Client


    NCftp is an enhanced version of the FTP program. It automates many of the login
    steps necessary with FTP and adds its own special features.


    For example, when logging into a remote site, NCftp automatically sends the username
    and password for anonymous access to you. Most NCFTP commands are identical to
    the standard FTP commands. This means the same commands are used for moving files,
    changing directories, listing directory contents, and so on as you would use in
    FTP program.


    NCftp has a neat feature that retains information on the last directory that you
    accessed on a FTP site; the next time you log into that site, it will be placed
    back at that directory automatically. NCftp is a lifesaver if you download a lot
    of files.


    The official NCftp site is located at http://www.ncftp.com. More information,
    such as the FAQ on NCftp, is available at http://www.ncftp.com/ncftppd/doc/faq/


    # Wget FTP Client


    The wget utility is a network utility for retrieving files from the Internet using
    HTTP and FTP. This tool has many features to retrieve large files or mirroring
    Web or FTP sites easily.


    The wget utility is flexible in nature and performs a vast array of tasks. To
    get more insight on how wget can help you, see http://www.ln.cornell.edu/public/COMP/info/wget/wget_toc.html.
    This site contains information on daily use and client configuration.


    # Firewall Configurations


    A firewall is a group of related programs, installed on a network gateway server,
    that protects the data and resources of a private network from from other networks.


    The firewall program that is provided by SuSE it is clearly defined as “an intelligent
    packet filter” that is assisted by the IP Chain program, which takes'
