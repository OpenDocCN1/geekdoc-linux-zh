  md: '# 82 Chapter 7: SuSE Communication Features


    Getting this setup working normally takes just a few minutes. I''ll give you a
    list-type overview of the process, however because systems may vary.


    +   1. Start YaST1 and access System Administration.

    2. Select Integrate Hardware into System, and assign card(s) type and parameters.

    3. Select Network Configuration, and input network address information from your
    cable company.

    4. Restart the computer, and you should be ready to go.


    This is a simple example of how cable modems can be set up, although some other
    factors are involved in setting up a cable modem. If the cable requires the DHCP
    protocol, you will have to install the client software from series n, called dhclient.
    For further information on DHCP setup, access the documentation available on your
    installed system by typing at the command line one of the following:


    man dhclient


    or


    man dhclient.conf

    man dhclient.leases


    For information on the configuration file content try this:


    man dhclient.conf

    man dhclient.leases


    Several articles cover the development and use of cable-type technologies. One,
    called First Principles, can be found at http://www.ozemail.com.au/-firstpr/bband.
    In the addition, the current Cable Modem HOWTO is located at http://www.oswg.org/oswg-nightly/oswg/en_US.ISDN_0859-1/articles/Cable-Modem/Cable-Modem.html.
    The HOWTO above is current, providing extensive and in-depth details that cannot
    be covered by the scope of this chapter. If you happen to run into some sort of
    hangup, this is the first place to look for a solution.


    # ISDN Interface Setup


    Integrated Services Digital Network (ISDN) is a highly touted method of networking
    until the DSL and cable revolution. The ISDN technology utilized dialup type access
    and per-minute and per-charge miles. This type of high-speed network connection
    was economical enough for the average household or small business, though.


    Thus, ISDN''s tenure as the ideal type of connection was short-lived when BISDN
