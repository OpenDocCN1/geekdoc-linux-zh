    So, read on — and dazzle your friends with your command-prompt finesse. When they
    ask you how and where you figured out all those commands, just smile and mumble
    something about the voices in your head — and of course, keep this section dog-eared
    and within within reach of your computer.


    # # Linux Commands by Function


    Because every command serves a specific purpose, organizing these tools into groups
    according to their individual functions isn''t difficult. If you know what you
    need to do but do not know which command does the job, flip through this section
    to start your search. From here, you can dig further by referencing pages and
    other information (online sites and reference books, for example) or by looking
    in this book''s index for further coverage.


    To access a man page, type **man command** at a command prompt. For example, **ls**
    shows you the help information for the file listing command.'
