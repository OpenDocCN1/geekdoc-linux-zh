  md: '# Files and file system


    No matter which operating system you''re using, it''s hard to do anything without
    being able to find your way through and work with the file system. The following
    utilities help you find your way:


    # File organization


    Boxing, packing, sorting, shipping — I''m always shuffling files around on my
    system. File organization commands provide tools for moving files and file system
    units around:


    ```

    cp, dir, ln, mkdir, mv, pwd, rename, rm, rmdir, shred

    ```


    # File attributes


    Files are like candy bars. The wrappers provide information about the ingredients,
    size, and package date — all descriptive of the tasty nugget inside. (Perhaps
    the wrapper is even childproof.) Files keep all wrapper information in an *inode*.
    Along with the capability to change file inode information, these commands can
    return data about the content of the file:


    ```

    chage, chattr, chgrp, chmod, chown, file, stat, sum, touch, wc

    ```


    # File filters


    A file filter enables you to change the contents of one file and process them
    for a new result. To sort the contents of the password file alphabetically, for
    example, you can type the command `/etc/passwd`. Here are a few of the tools available
    for multulsing into data into something meaningful:


    ```

    cmp, colrm, column, comm, csplit, cut, iff, diff3, expand, fmt, fold, join, look,
    merge, paste, rev, sort, split, strings, tr, expend, uniq, uuencode, uodecode

    ```


    # File locators


    Where, oh where my file be? These commands help you locate files in Linux''s monster
    tree-structure file system:


    ```

    find, locate, which

    ```


    # File utilities that deserve their own category


    Although some may argue that these utilities are just commands, others can argue
    that the ceiling of the Sistine Chapel is *just a painting*. These commands sport
    short names, even though nothing about them is simple or powerless.'
  merge: -1
  pgno: 372
- img_proc: true
  md: '# Part VI: Appendixes


    These commands are industrial-strength data-manipulation tools. You need just
    a few minutes to get the basics, and a lifetime to master the tools. If you manage
    the ability to wrangle these beauties, you achieve respected geek status:


