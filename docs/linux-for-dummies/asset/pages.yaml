  md: '# Chapter 16: Checking the Linux File System 295


    # Checking the file system


    Whenever you shut down your machine, you can use the -f option to skip the file
    system check after the machine comes up. Even if you do this every time, Linux
    enables you to get away with only a set number of times before it decides to take
    over and do a check anyway. However, I recommend not using -f because you never
    know when a failure could occur. Checking the file system costs you an extra minute
    or so in boot time, although it can save you panicked hours of trying to revive
    a damaged machine later.


    You can also manually check file systems by using the e2fsck command:


    +   **1. Type df to see whether the item that you want is checked.**


    The df command lists the partitions and media in addition to some statistics about
    them. You may, for example, see what''s shown in Figure 16-3.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_316_0.png)


    | Filesystem | Size Used Avail Use% Mounted on |

    | --- | --- | --- | --- | --- |

    | /dev/sda1 root | 2037948 | 1551600 | 27% | |

    | /dev/sda1 | 101082 | 6222 | 95048 | 7% | /boot |

    | root[localhost root] | 13070 | 0 | 13070 | 0% | /dev/shm |


    +   **2. If the item is unmounted and not vital for the system, such as a CD-ROM
    file of pictures, type unmount point (specifying a particular point) to remove
    it from the file system.


    If you want to check a portion of the file system that''s vital for the running
    of your Linux machine (/ and /bin, for example), you must boot with rescue disks
    so that you can unmount these directories to check. (Rescue disks are special
    boot disks that you use in emergencies, such as when your system isn''t booting.)
    Refer to Chapter 5 for more information.) This task is a huge pain! Luckily, Linux
    checks the directories that are crucial for the system while it''s booting so
    you don''t need to do manually.


    +   **3. Type e2fsck /dev/device (specifying a particular device) to run the check.


    This step can take a while. Table 16-5 shows five options you might be interested
    in adding. If you decide to use an option, use the format e2fsck /dev/device (specifying
    any options and a particular device).'
  merge: -1
