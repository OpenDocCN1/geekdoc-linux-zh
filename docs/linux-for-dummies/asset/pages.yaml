  md: '# 114 Part II: Internet NOW


    Some ISPs provide their own proprietary software that you must install on your
    PC to connect to the Internet. The software they provide is likely to run only
    on Windows. Several free dial-up services do not work with Linux because of this
    fact. The proprietary software medd with the operating system to ensure that banner
    advertising isn''t hidden or that you dialed in for only a specified duration.


    If you''re shopping for an ISP, consider these questions:


    +   - Can you get local dial-up numbers across the country and around the world?
    If you travel often need Internet access from different cities, this service is
    a handy saver.

    - Does it provide technical support for Linux? If you''re planning on running
    Linux, this consideration is an important one.

    - Can you get a recommendation? Ask a friend. An ISP''s best friend is an endorsement
    from a satisfied customer.

    - Will you have trouble dialing in? Although a subscriber-to-line ratio of 7-to-1
    (an average of seven or fewer subscribers per line) or better isn''t an entirely
    accurate measure, it should help you avoid busy signals. Hey, it doesn''t hurt
    to ask.


    # Information you need from your ISP


    Most reputable ISPs provide you with a customer information sheet after you sign
    up for its services. This sheet should include the following information at the
    minimum:


    +   - Local telephone dial-in numbers

    - User login name

    - User login password

    - E-mail address

    - E-mail outbound host or Simple Mail Transport Protocol (SMTP) server

    - E-mail inbound host or Post Office Protocol (POP) server

    - News host


    With this information, you can establish an Internet connection by using your
    Linux system.'
