    case, all terms refer to ways in which you can control, refine, or modify basic
    commands or programs to make them what you want. Again, where distinctions and
    clarifications may be needed, I provide them!


    # Three Presumptuous Assumptions


    They say that making assumptions makes a fool of the person who makes them and
    of the person about whom those assumptions are made.(And just who are they, anyway?
    I assume I know, — never mind.) Even so, practicality demands I make a few assumptions
    about you, gentle reader:


    +   - You can turn your computer on and off.

    - You know how to use a mouse and a keyboard.

    - You want to install, configure, and use a Linux system because you''re curious
    or interested or it''s your job to do so.


    You don''t need to be a master logician or a wizard in the arcane art of programming
    to use this book, nor do you need a Ph.D. in computer science. You don''t even
    need a complete or perfect understanding of what''s going on in your computer''s
    innards.'
