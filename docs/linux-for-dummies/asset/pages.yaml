  md: '# Chapter 8: Surfing the Web and Managing E-Mail 133


    # Shifting Mozilla into Gear


    After you fine-tune your Internet vehicle, you can take it for a road test. In
    this section, I cover some righteous maneuvers with your Mozilla browser.


    # Steering the monster


    Mozilla is your viewing window into the wonderful World Wide Web. Mozilla''s primary
    purpose is to fetch Web pages on your command, download all their graphics and
    related files into your computer''s memory, and, finally, render the page for
    your interactive viewing pleasure.


    If you''re used to using Internet Explorer or Netscape, using Mozilla should be
    a snap. It has all the familiar navigation tools, such as an address bar; Back,
    Forward, Reload, and Stop buttons; and a feature that stores links to your favorite
    Web sites (bookmarks).


    Mozilla, like Netscape, also has a Sidebar feature — press F9 to add and remove
    it — which you can use to find sites related to the one you''re visiting, search
    for a word or phrase on the Internet, access bookmarked Web pages, or access a
    Web page you recently visited (via the History option). The pane at the bottom
    of the Mozilla browser window contains a few buttons that allow you quick access
    to Navigator, Mail & Newsgroups, Composer, and Address Book, and so does the Window
    menu.


    # Perusing newsgroups


    Although e-mail is usually directed at an individual, you can think of newsgroups
    as public-message bulletin boards where people with similar interests come together
    to discuss a topic. Newgroups are also great places to find technical support.


    With the newsgroup server information that your ISP provided, follow these steps
    to access the world''s largest cork board:


    +   1. Choose Window Mail & Newsgroups.


