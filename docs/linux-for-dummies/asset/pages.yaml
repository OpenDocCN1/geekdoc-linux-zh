  md: '# Calculations with OpenOffice.Org Math


    There''s nothing like trying to type a math or science report and having to either
    use multiple lines to show your equations or write them in hand. OpenOffice.org
    Math is a great solution to this problem. You can create your equations and more
    in there and insert them in any of your OpenOffice.org documents. Whether you''re
    a middle school student or a professional engineer, OpenOffice.org Math just may
    thrill you.


    Many OpenOffice.org Math functions are different from what you''re used to if
    you have looked at all the other OpenOffice.org programs. However, in many ways
    this program is less complex than some, thanks to its special-purpose nature.
    Keep in mind that it''s not a calculation program. It''s for laying out complex
    formulas on paper. However, you can insert these formulas into OpenOffice.orgorg
    Calc for some interesting cross-program work.


    # Starting it up


    To start OpenOffice.org Math in the distributions I cover in this chapter, do
    the following:


    +   * In Fedora Core 1, select: Choose Main Menu➣Office➣OpenOffice.org Math.


    +   * In Mandrake Linux 9.2, go to: Choose Main Menu➣Office➣OpenOffice.org Math.


    +   * In SuSE Linux 9.0, go to: Choose Main Menu➣Office➣OpenOffice Suite. When
    the Templates and Documents – New Document window appears, double-click on Formula
    to open a new OpenOffice.org Math document, or browse to the file you want to
    edit.


    # Taking a tour of OpenOffice.org Math


    Before you proceed, take a look at the GUI layout shown in Figure 14-7.


    Close the Selection dialog box by clicking the small X in the upper-right corner
    of its window. Keep things as uncluttered as possible. You can get it back at
    any time by choosing View➣Selection.Main toolbar.'
