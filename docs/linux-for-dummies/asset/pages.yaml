- img_proc: true
  md: 'Wildcards are characters that represent one or more characters. Table 10-5
    lists the wildcards you have available when working with files and directories.


    | Table 10-5 Wildcards for File and Directory Manipulation |

    | Character | Name of Character | Purpose |

    | ? | Question mark | Stands for a single missing character |

    | * | Asterisk | Stands for a group of characters |

    | [] | Square brackets | Allows you to specify a range or group of characters
    |


    Suppose that you have a directory with the following short file listing:

    afile cfile filefile file2 filefile

    bfile file1 file2 file3 filebfile


    Table 10-6 shows how you can use wildcards to access those files:


    | Table 10-6 Using Wildcards to Access Files |

    | If You Type... | Then You Get |

    | ls ?file | afile, bfile, cfile. |

    | ls file? | file1, file2, and file3. |

    | ls file* | file1file, file2file, leafile, file1, file2, file3, and filefile.
    |

    | ls *file | afile, cfile, filefile, file2file, leafile, bfile, and filefile.
    |

    | ls file[1-3] | file1, file2, and file3. |

    | ls file[1-3]* | file1, file2, file3, file1file, and file2file. |

    | ls file[1,a]* | file1, filefile, and leafile. |


    You may also find filename and command completion useful. The bash shell (the
    default Linux shell, see Chapter 11) has a feature that completes a filename for
    you. If you''re working at the command prompt and typing a long filename, press
    the Tab key does the rest. You can also complete commands by pressing the Tab
    key. You may have to type enough letters, however, to make the item unique so
    that nothing else can come up during the completion.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_193_0.png)'
  merge: -1
