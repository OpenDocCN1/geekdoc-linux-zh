  md: '# Chapter 15: Multimedia Wow!


    # 263


    Figure 15-6: The Mandrake 9.2 looks for Mozilla''s Opening dialog box.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_284_0.png)


    The Open It With radio button. The Mozilla download manager dialog box opens.
