  md: '# So, where did Linux come from?


    To understand Linux, you need to take a peek at its rich heritage. Although programming
    of the Linux core was started in 1991, the design concepts were based on the time-tested
    Unix system.


    university, but both Unix and the hardware it ran on were prohibit expensive.
    A Unix version called Minix was available for free, but it didn''t meet his needs.
    So, as a computer student, Torvalds studied Minix and set out to write a new version
    himself. In his own words (recorded for posterity on the Internet), this work,
    "just a hobby, won''t be big and professional like gue."


    Unix was developed by Bell Laboratories in the early 1970s. The original architectures
    of Unix created it when there were few operating systems, with the desire to have
    one shared data, programs, and resources both efficiently and securely — something
    wasn''t available at that time. From there, Unix evolved into many different versions,
    and its current family tree is so complicated it looks like a kduzu infestation!


    In 1991, Torvalds was a computer science student at the University of Helsinki
    in Finland. He wanted an operating system that was like the Unix system he had
    grown fond of the


    Writing an operating system is no small task. Even six months of hard work, Torvalds
    made very little progress toward the general utility of the system. He posted
    what he had to the Internet, and found that many people shared his interest and
    curiosity. Before long, some of the brightest minds around the world were contributing
    to Linux''s project by adding enhancements or fixing bugs (errors in the code).


    Linux has been accused of being "just another operating system." On the surface,
    it may appear so, but if you look deeper, you can see that this isn''t so. The
    Linux project is a flagship leading the current trend toward open source and (as
    freedom, no free beer) software within the computing industry. A rock-solid operating
    system because of the model under which it is (and continues to be) developed,
    Linux represents much that is good and pure in software development.


    Two fundamental distinctions separate Linux from the rest of the operating system
    pack:


    +   - Linux is licensed under the unique and ingenious GNU General Public License,
    which you can read about in the next section.


    +   - Linux is developed and maintained by a worldwide team of volunteer programmers,
    working together over the Internet.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# Part I: Getting Your Feet Wet


    Linux is great for many reasons, including the fact that the folks who built it
    from the ground up wanted it to be


    +   - Multuser: More than one user can be logged in to a single computer at one
    time.


    +   - Multiprocess: True pre-emptive multitasking enables the operating system
    core to efficiently juggle several programs running at once. This is important
    for providing multiple services on one computer.


    +   - Multiform: Linux currently runs on 24 platforms (hardware types), including
    Intel-based PCs, Digital/Compaq Amiga, PowerPC-based Apple Macintosh, Sun SPARC,
    Amiga, and StrongARM-based computers.


    +   - Interoperable: Linux plays nice with most network protocols (languages)
    and operating systems, allowing you to interact with users and computers running
    Microsoft Windows, Unix, Novell, Mac OS 9 and OS X, and other niche groups.


    +   - Scalable: As your computing needs grow, you can rely on Linux to grow with
    you. The same operating system can run on a desktop computer or a very large,
    industrial strength server system.


    +   - Portable: Linux is mostly written in the C programming language. C is a
    language created specifically for writing operating system-level software and
    can be readily ported (translated) to run on new computer hardware.


    +   - Flexible: You can configure the Linux operating system as a network host,
    router, graphical workstation, office productivity PC, home entertainment computer,
    file server, Web server, cluster, or just about any other computing appliance
    you can think of.


    +   - Stable: The Linux kernel (the operating system itself) has achieved a level
    of maturity that makes most software developers envious. It''s not uncommon to
    hear reports of Linux servers running for years without crashing.


    +   - Efficient: The modular design of Linux enables you to include only those
    components that you need to run your desired services. Even older Pentium computers
    can utilize Linux and become useful again.


    +   - Free! To most people, the most intriguing aspect of Linux is the fact that
    it''s often free. How (the capitalists murmur) can anyone build a better mousetrap
    with no incentive of direct monetary return?


    In this chapter, I intend to answer that last question for you. I also hope to
    paint a picture of the open source software development model that created Linux.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Anatomy of an Open Source Software Project


    Linux isn''t a product. Linux is an organic part of a software ecosystem.


    —Michael Robinson, Netrinsics


    To the casual observer (and some corporate IT decision-makers), Linux appears
    to be a freak mutation — a rogue creature randomly generated by anarchy. However,
    after all, can something so complex and discipline-dependent as a computer operating
    system be developed by a loosely knit band of volunteer computer geeks from around
    the world?


    Just as science is constantly attempting to classify and explain everything in
    existence, technology commentators are still trying to understand how this open
    source model can create superior software. Often, the reasons have much to do
    with the usual human desire to fill a need with a solution. When a programmer
    in the Linux world wants a tool, the programmer simply writes one or bands together
    with other people who want a similar package to write it together.


    # GNU who?


    Imagine — software created out of need rather than projected profit. Even though
    Unix ultimately became expensive proprietary software, the ideas and motives for
    its creation were originally based on need. What people usually refer to in the
    singular as the *Linux operating system* is actually a collection of software
    tools that were created with the express purpose of solving specific computing
    problems.


    Linux also wouldn''t be possible without the vision of a man whom Steven Levy
    (author of *Hackers*) refers to as The Last of the Great MIT AI-LAB Hackers. This
    pioneer and advocate of *freedom* software is Richard Stallman.


    The Massachusetts Institute of Technology (MIT) has long held a reputation for
    nurturing the greatest minds in the technological disciplines. In 1984, Stallman,
