    some plug-ins. To view which plug-ins are installed, choose Help About Plug-ins.


    The general rule for plug-installation is to move the required file, which usually
    has a .so extension, into the plugin directory, located below the Mozilla installation.
    A likely place for the default Fedora Core 1 installation is /usr/lib/mozilla-1.4.1/plugins.


    To associate a file with a program or plug-in, choose Edit Preferences to open
    the Preferences window, and in the Navigator category, click Helper Applications.
    The File Types pane appears, as shown in Figure 8-6.


