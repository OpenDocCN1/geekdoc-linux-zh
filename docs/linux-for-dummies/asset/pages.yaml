  md: '# 182 Part III: Getting Up to Speed with Linux


    Shells equipped to perform certain functions. Most of these features have evolved
    over time to assist the command-line jockey with a myriad of tasks. Although I
    only scratch the surface here, you''re encouraged to read the man page for bash
    because it''s likely one of the more complete and read-man pages in existence.
    You can read all about how to use man pages (the online Help system in Linux)
    in the ''Help!'' section, later in this chapter.


    # Playing the Shell Game


    You need a way to tell the computer what you want it to do. In Linux, one of the
    ways to communicate with the computer is something called the shell. A shell isn''t
    a graphical thing; it''s the sum total of the commands and syntax you have available
    to you to do your work.


    The shell environment is rather dull and boring by graphical desktop standards.
    When you start the shell, all you see is a short prompt, as a $, followed by a
    blinking cursor awaiting your keyboard entry. In a moment, I show you a couple
    of methods for accessing the shell.


    The default shell used in Linux is the bash. This work environment is based on
    the original Unix shell, which is called the Bourne and is also referred to as
    sh. The term bash stands for the Bourne again shell. The bash comes with most
    Linux distributions.


    If you installed your Linux distribution to log in to a graphical desktop, as
    GNOME or the KDE environment, you''re likely not looking at a shell prompt. You
    interact with your computer via a mouse. You can start a bash session from the
    GUI desktop in a couple ways.


    The quickest method to activate a bash session is to click the computer icon on
    the GNOME panel, located at the bottom of your screen, or in Fedora Core, choose
    Main Menu>System Tools>Terminal. If successful, you should be looking at a screen
    similar to the one in Figure 11-1.


    The prompt may include some helpful information. For example, if you''re logged
    in as evan on the machine deepthink in Fedora Core 1, your prompt looks similar
    to this:


    ```

    [evan@deepthink evan]$

    ```


    Before surveying a few of the shell capabilities, I need to tell you about another
    method for starting a shell session. First of all, notice that your shell prompt
    is merely inside a window that is your GUI desktop. Suppose you want to start
    a shell session in a character-only or text environment.'
