    # # Resizing partitions safely with FIPS


    Probably the most common free disk partition modification program out there is
    FIPS (First nondestructive Interactive Partition Splitting program). Most Linux
    installation media contains this program, and your DVD is no exception.


    On the Fedora Core 1 DVD or the first CD — that comes with this, FIPS is in the
    /dosutils directory. In that directory, you find two subdirectories for FIPS —
    /fips15 and /fips20. The /fips20 directory contains the most recent version of
    FIPS and its documentation.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_48_1.png)


    As the name implies, FIPS enables you to modify your disk partitions without destroying
    existing data or operating systems. Again, be sure to make a backup of your existing
    files and important data before using FIPS!


    > I highly recommend that you read through the documentation on the DVD — or CD
    — before attempting to use FIPS. You''ll find it in the /dosutils/fipsdocs/fips.faq
    file.


    FIPS does not work on NTFS partitions. If you''ve used NTFS, you will need to
    purchase Partition Magic to resize those partitions, or a separate hard drive
    you can start from scratch with Linux.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_48_2.png)


