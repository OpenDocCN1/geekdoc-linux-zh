  md: '# 312 Part IV: Sinking Your Teeth into Linux


    More often than not, the updates include fixes for bugs or security issues.

    Exploring this tool is highly recommended if you want to keep your Linux system
    secure.


    # Finding New Software


    One of the fun things about a new setup is hunting down software to add to it.
    The best place to start is usually right there on your distribution medium (DVDs,
    usually). You know that everything on there is compatible with your system. From
    there, you''re smart to go to the distribution''s Web site, such as www.redhat.com,
    www.suse.com, or www.mandrake.com. There, you can find updated versions of goodies
    you already have, security fixes, bug fixes, and more.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_333_0.png)


    Looking for a specific piece of software? Do a quick Web search to see whether
    it has a home page. It''s the safest bet, and you get the latest version.


    After you venturing into the big, bad world, you need to be a bit more careful.
    Although viruses, worms, and other nasties aren''t as prevalent in the Linux world
    as they are in the Windows world, you still don''t want to be sloppy. If you''re
    not careful, you can download a tampered version of a program, and then you may
    end up in a world of hurt! I have compiled a list of places to start when you''re
    looking for new software:


    +   - www.rpmfind.net

    - linux.tucows.com

    - www.zdnet.com


    This list isn''t as short as you think after you started digging. Also check out
    Chapter 2 for more options. Enjoy!'
