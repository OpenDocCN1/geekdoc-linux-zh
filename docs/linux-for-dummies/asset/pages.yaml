  md: '# Chapter 1: Getting Acquainted with Linux


    # Who''s in charge of Linux anyway?


    As an open source project evolves, various people emerge as leaders. The leader
    is often known as the project''s benevolent dictator. A person who becomes benevolent
    dictator has probably spent more time than anyone else on a particular problem
    and often has some unique insight. Normally, the words democratic and dictator
    are never paired in the same sentence, but the open source model is a very democratic
    process that endorses the reign of a benevolent Torvalds.


    Linus Torvalds is still considered the benevolent dictator of the Linux kernel
    (the operating system''s core). He ultimately determines what features are added
    to the kernel and what features aren. The community trusts his vision and discretion.
    In the event that he loses interest in the project, or the community decides that
    he has gone senile, a new leader will emerge from amongst the very competent people
    working with him.


    # Einstein was a volunteer


    Someone is a volunteer or donates their time to a project isn''t necessarily providing
    a second-rate effort or working on weekends and holidays. In fact, any human resource
    expert will tell you people who choose to do a job of their own free will produce
    the highest quality products.


    The volunteers who contribute to open source projects are often leaders in their
    field who depend on community collaboration to get useful work done. The open
    source concept is no stranger to the scientific community. The impartial peer-review
    process that open source projects foster is critical in validating something as
    technically correct.


    Those who paint the open source community as copyright violators and often misunderstand
    or outright ignore these vital issues. Open source programmers are very proud
    of their work and are also very concerned about their copyrights, not wanting
    their work to be stolen by others — hence licenses such as the GPL. This concern
    creates an atmosphere with the greatest respect for copyright. Those who claim
    that they are just being “open source” when they steal other people''s hard work
    are grossly misusing the term to soothe their consciences.


    Many have pointed out that if copyright is violated in open source, it is easy
    to tell. Watch the news and notice how often large software corporations are convicted
    of stealing other people''s code and incorporating it into their own work. Tracking
    down such copyright violations is incredibly difficult in a closed source scheme.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_36_0.png)'
