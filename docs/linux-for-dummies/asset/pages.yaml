  md: '# Archiving and compressing


    Although disk space isn''t as much of a premium it once was, bandwidth and backup
    media still are. Subsequently, this group provides a potpourri of tools for compacting
    and organizing data for storage:


    ```

    ar, bzip2, compress, cpio, dump, gunzip, gzexe, gzip, restore, tar, uncompress,
    unzip, zcat, zcmp, zip

    ```


    # Built-in bash commands


    Some commands don''t seem to exist if you try to look up their help information
    in the man pages, and the commands don''t show up as files on your system. Remember,
    as you type commands at the prompt, you''re communicating with a type of program
    called a shell. (In my case, it''s bash, the default Linux shell.) The shell has
    a set of commands, included in the fol-lowing list, that you can use to communicate
    with:


    ```

    alias, bg, cd, export, fg, history, Jobs, logout, set, source, test, umask, unalias,
    unset

    ```


    If you try to view the man page entry for some of these commands, you''ll find
    instead that the help information for BASH BUILTINS loads. To search through this
    massive manual, press the forward slash (/) key to open the man search interface,
    and then type the name of the command you want to search for. The interface stops
    at the first spot where the term is found. If you want to try again, press the
    N key to proceed to the next occurrence of the word.


    When you''re digging around for help on a command, you can call on an inter-esting
    range of shell commands for assistance:


    ```

    apropos, info, man, manpath, type, whatis,딨, which

    ```


    Locating details about the command-prompt options of a command is a never-ending
    pursuit. The man page system provides some helpful guides at your fingertips for
    rapidly finding this detailed information.


    # Communication


    As a system administrator, you find these utilities useful for providing information
    about your users and communicating with them:


    ```

    finger, wall, write, who

    ```'
