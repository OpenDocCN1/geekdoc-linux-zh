- img_proc: true
  md: '# Don''t Just Turn Off the Machine!


    Even when you''re not tapping anything into the keyboard or clicking any buttons,
    Linux is still running along in the background and doing lots of housekeeping
    chores. Some of these chores may involve swapping cache and memory data to and
    from the fixed disk. When you deprive your computer of its power, it may not be
    able to complete its transaction.


    You may need to recondition yourself from the bad habits of older versions of
    Windows (for example, shutting down the computer when you''re done). A Linux computer
    doesn''t need to be turned off after use; rather, just log out and perhaps turn
    off your monitor. The next time you want to use the computer, you rather not go
    through the arduous boot process.


    At times, however, you may want to turn off your Linux machine. Perhaps you need
    to add new hardware, the power company is turning off the power to your house,
    or you''re going on vacation for a few weeks and just want to save on your electric
    bill. Regardless of the reason, you must shut down Linux in an orderly manner.


    You can use one of these methods to shut down Linux properly:


    +   - If you''re in the GUI, log out of your account using the main menu''s Log
    Out option, and then click the display manager option that says, strangely enough,
    Shut Down.


    +   - If you have a command prompt open, enter the halt command at the shell prompt
    (#) followed by the root password, and Linux shuts itself down and tells you when
    it''s all right to turn off the machine.


    +   - If you have a command prompt open, enter the reboot command, and Linux goes
    through the motions of shutting itself down and immediately reboots the machine.


    +   - If you have a command prompt open, entering shutdown -r now is the most
    traditionally accepted method. The shutdown command optionally allows you to send
    messages to logged-in users and determine how long until the shutdown takes place.
    Another method is the poweroff command, which is an alias to the previously mentioned
    halt command.


    If you accidentally cut the power to your Linux box, take heart; all is not lost.
    Chances are that you can reboot your computer and pick up where you left off.
    However, you may have to pay for your error by waiting during a quick file system
    check while the machine makes sure that nothing was damaged. This process is similar
    to the one in Windows, where, if you power off incorrectly, the operating system
    performs a Scandisk operation.'
  merge: -1
