  md: "# Troubleshooting the Boot\n\nThe emergency boot disk you create for your system\
    \ and a rescue disk are subtly different. A boot disk still requires the capability\
    \ to access your Linux installation on your hard disk, whereas the rescue disk\
    \ does not. The rescue boot disk simulates your hard disk in what is called a\
    \ RAM disk, holding the files entirely in memory. The benefit of this disk is\
    \ that you can perform necessary system surgery without requiring utilities that\
    \ are part of the installed system; everything you need is part of the rescue\
    \ disk.\n\nThe DVD — or the first CD — in your Fedora Core distribution doubles\
    \ as a rescue disk. To enter rescue mode:\n\n+   1. When the first disk loads,\
    \ type linux rescue at the boot prompt.\n   This action begins booting the system\
    \ into maintenance mode.\n2. Select your language and press Enter.\n3. Select\
    \ your keyboard type and press Enter.\n   The rescue system does its thing for\
    \ a while, perhaps a minute or two on a slow system.\n4. When asked if you want\
    \ to start the network interfaces, answer No unless you know there is something\
    \ you need to download.\n5. At the Rescue screen, select one of the three options\
    \ offered, and \"then press Enter.\"\n   Your three options are\n* Continue: The\
    \ rescue interface will track down your installed Fedora Core system for you.\
    \ Make a note of where it says it will mount the files so you know which directories\
    \ contain.\n* Read-Only: The same as Continue, but you will not be able to make\
    \ any changes to your hard drive installation.\n* Skip: Don't bother trying to\
    \ locate the filesystem, just give me a prompt!\n   I will assume that you chose\
    \ Continue.\n\n+   6. In the next screen, make a note of the command that the\
    \ rescue interface gives you to help your file navigation easier, and then press\
    \ Enter.\n   You now have access to the rescue interface. This is a command-line\
    \ setup, so if you've never delved into Linux at the command line yet, it's time\
    \ to do! Appendix A has a handy reference of commands you can use for a variety\
    \ of purposes if you want a good starting place."
