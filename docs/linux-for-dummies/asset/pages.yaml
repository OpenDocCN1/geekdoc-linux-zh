- img_proc: true
  md: '# # Cluttering the desktop with icons


    KDE allows you to alter applets and programs appear on your Panel, and on your
    desktop. Managing these shortcuts is a simple operation after you understand how
    it works.


    # Adding a program to the desktop


    The Panel has only so much room. Maybe you would rather have your program shortcuts
    lined up on the desktop as you do in Windows. To add one of these shortcuts, follow
    these steps:


    +   1. Click the Main Menu button to open the KDE main menu.

    2. Open the submenu containing the program for which you want to make a shortcut.

    3. Select the program for which you want to make a shortcut.

    4. Drag the program to the desktop.


    For example, if you want to add The GIMP, you open the Graphics submenu.


    Don''t open the program. For example, to add The GIMP, you move your mouse to
    the program and click and hold the mouse button.


    A little piece-of-paper graphic follows your mouse pointer until you release the
    mouse button, at which point you''re asked whether you want to add the shortcut
    to the desktop but not remove it from the menu (Copy Here); add the shortcut to
    the desktop and remove it from the menu (Move Here); or an obvious shortcut that
    looks more like a Windows shortcut (Link Here). After you make your selection,
    your new shortcut is added to the desktop.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_226_0.png)


    If you''re not happy with where desktop icon is placed, click it and then drag
    it to a new location.


    # Removing a program from the desktop


    If you want to remove one of the programs from the desktop, just right-click the
    icon you want to remove and choose Delete. The icon vanishes from the Panel or
    desktop. That''s it!


    # # Prettying Up Your Desktop


    You may be familiar with the ability to install desktop themes under Microsoft
    Windows. A theme in the desktop world refers to color schemes, images, and sounds
    applied to all portions of the desktop — window borders,'
  merge: -1
