    Linux allows you to use spaces and other characters in filenames that you may
    or not be able to use in filenames on other operating systems. However, Linux
    applications may stumble when they encounter file or directory names containing
    spaces. Usually, a safe bet is to stick with alphanumeric characters and avoid
    spaces and odd characters, such as question marks and exclamation points.


    # # How Do I Stop Scripting Screw-Ups?


    A script contains a series of commands to perform a task (usually repeatedly)
    to save you from typing all those commands at a prompt, one line at a time. If
    you have trouble with a script, follow this advice:


    +   - Make sure that spelling or syntax errors aren''t causing the problems. Remember
    that most things in Linux are case sensitive, so a simple slip of the Shift key
    can make an entire script nonparametric


    +   - If a script contains several sections to perform different tasks, try commenting
    out all lines except for one task. If the script works for the specific task,
    uncomment one line at a time and run the script between each edit. When you encounter
    your first error, you probably have a good idea of where the error occurred and
    how to make an appropriate correction.


    +   - Start when you write any script from scratch. Make sure that the script
    works before you start doing fancy stuff. If a recent addition causes the script
    to fail, you know where the problem resides.


    +   - Verify variables for any values on which your script may depend. The echo
    statement in the script displays the contents of any variables you use. You may
    need to use echo at several places in your script so that you can watch what happens
    to the values of those variables. (Refer to Chapter 11 for more information on
    variables.)'
