  md: '# 334 Part V: The Part of Tens


    # “I Think I’m in Linux, but Don’t Know What to Do!”


    Two different screens tend to cause panic to folks new to Linux. The first of
    these screens, shown in Figure 19-1, is in fact a sign that you installed the
    software and booted the machine successfully! Jump for joy! It''s just that you''re
    booting into the command-line environment rather than the GUI environment. If
    you reach a screen similar to the one shown in Figure 19-1, the computer is asking
    you to log in with the username for an account and a password that you created
    during the installation process.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_355_0.png)


    Figure 19-1: A Linux command-line login prompt.


    TIP If you created only the root account, you can log in there as root. After
    you enter the username and password, you will find yourself at the screen shown
    in Figure 19-2, which just happens to be the second spot where people get worried.
    If you see this screen, you have not only booted into Linux, but you''re also
    logged in and using the machine! Give yourself a good pat on the back.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_355_1.png)


    Figure 19-2: Logged in the Linux command line.'
