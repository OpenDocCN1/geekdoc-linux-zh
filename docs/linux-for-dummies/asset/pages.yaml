  md: '# Chapter 9


    # Cool Internet Tools


    +   **In This Chapter**

    - Getting the message out instantly

    - Browsing with other Web browsers

    - Mail, mail, and more mail

    - Exchanging files quickly with FTP


    > In case you haven''t heard, the Internet is not a superhighway.

    —Bill Washburn, Internet World magazine


    The Internet is a vast network of computers that spans the globe. Many different
    types of computers and operating systems work together to allow you access to
    information across the Internet. Linux, along with its related Unix operating
    system, has long supported and worked with the Internet. Practically all the different
    services available on the Internet are available from your Linux desktop.


    When Fedora Core 1 is installed using the Personal Desktop option, several Web
    browsers, mail programs, and instant messaging tools are installed in your Linux
    system. In this chapter, I introduce you to some tools you can use to access different
    services on the Internet, such as accessing Web sites, with e-mail, investigating
    newsgroups, and utilizing FTP.


    Your Linux system has other tools in addition to the applications I mention here,
    and I suggest that you take the time to explore these tools. You may find that
    an application I don''t cover works better for you. Also, if you don''t like any
    of the Internet-related tools in your Linux system, you can always find lots more
    on the Internet and install them on your Linux system. But those are topics for
    Chapters 17 and 19.


    # Instant Messaging


    Instant messaging between people is like using a telephone — except that you type
    your conversation rather than speak it. In addition, you can simultaneously'
  merge: -1
  pgno: 164
- img_proc: true
  md: '# 144 Part II: Internet NOW


    hold multiple instant messaging conversations without the need for additional
    connections to the Internet. America Online (AOL) provides one popular instant
    messaging service, named AOL Instant Messenger, or AIM. Others are ICQ and MSN.
    A wide variety of computer operating systems, including Linux, support these various
    services. Kit and Gaim are two instant messaging software packages that are installed
    by default on your Fedora Core 1 system when you select the Personal Desktop installation
    option. Because Gaim supports more than just a single instant messaging (IM),
    I cover this one in detail. It supports only AIM.


    In other distributions, if you select the GNOME desktop during installation, Gaim
    is installed. If you select KDE during installation, Kit is installed in the system.
    If you select GNOME and KDE, Gaim and Kit are both installed. In Fedora Core,
    however, both are installed by default, although Gaim is the main selection.


    # Gaim


    You can launch Gaim by choosing Main Menu<Internet<Instant Messenger to open the
    application shown in Figure 9-1. After the application starts, you need to enter
    your current IM account, or screen name, or create a new screen name. Gaim supports
    AIM, ICQ, MSN, and even more services.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_165_0.png)


    For a quick start, if you''re now an AIM user, enter your screen name and password
    and click the Sign On button. Make sure that your Internet connection is already
    established before you use the AIM service.


    If you use types of messaging services other than AIM, or if other users want
    to use this same instance of Gaim, you need to use the Account Editor to set things
    up (unless you give them their own login, which is the best solution):'
