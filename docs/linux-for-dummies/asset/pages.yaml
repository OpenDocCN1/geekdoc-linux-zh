    system doesn''t contain any operating systems and you don''t have any of your
    system''s documentation, you can resort to the screen as your computer starts.
    On some systems, the video information is displayed as the computer boots. You
    may have to reboot several times to read the information if it goes by too fast.
    Also, systems display the PCI components and their settings as the system is starting
    up. You may need to reboot several times to gather all the information.


    **Access the Basic Input/Output System (BIOS) information.** Stored in a small
    area of memory and retained by a battery, this is sometimes referred to as (Complementary
    Metal-Oxide Semiconductor) CMOS, which indicates the type of computer chip that
    can store and retain information. The amount of information stored in the BIOS
    can be very little to quite a lot. Some newer systems may display several screens
    of information about the computer''s hardware.'
