  md: '# Chapter 14: Word Processing and More with OpenOffice.org


    # Ruler


    Directly below the Object bar in a default OpenOffice.org setup is the ruler.
    All modern word processors offer this item, which marks out the margins and tabs,
    for example of your document in the measuring system of your choice. To change
    which system you want to use, right-click the ruler to open the Measurements pop-up
    dialog box.


    # Your document


    Oh, yeah — that big, blocked-off white space takes up most of the window. That''s
    where you work on your documents! Just click there and start typing. You can also
    access Formatting pop-up menu by right-clicking in the document section.


    OpenOffice.org Writer supports the following formats (and more): its own "text"
    format (.SXW), Microsoft Word 95, 6.0, 97, 2000, and XP (.DOC), Rich Text Format
    (.RTF), Text (.TXT), and Web Page (.HTML).


    # # Spreadsheets with OpenOffice.org Calc


