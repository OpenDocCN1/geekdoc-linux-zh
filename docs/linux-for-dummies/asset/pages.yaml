  md: '# Chapter 2: Prepping Your Computer for Linux


    # # Partitioning from scratch for a dual boot


    If you plan to take a fresh hard drive and install both Windows and Linux on it,
    be is sure to install Windows first. While you''re going through the installation,
    you will be asked to partition your drives. Your hard drive can have three primary
    partitions and one extended partition. Inside that extended partition, you can
    have up to 12 logical partitions.


    Make sure that you leave either a whole extended partition of at least 3GB available
    for Linux, or least part of an extended partition with a minimum of two logical
    partitions available inside, for a total size of at least 3GB.


    Make a note of the partition you leave open. You''ll need this information later.


