  md: '# Chapter 19: Eleven Troubleshooting Tips


    # # I Want to Use Multiple Screen Resolutions


    Do you want or need to swap between resolutions in the GUI? Suppose that you want
    to use 1024 x 768, but work on Web pages and want to be able to see how they look
    in a browser at 800 x 600 or even 640 x 480. You can set up your Linux machine
    to do it, but you need to edit a text file. Type the following line at a command
    prompt to locate this on your distribution:


    ```

    find / -name "XF86Config*"

    ```


    You may find multiple versions. For example, you may find XF86Config and XF86Config-4.
    If you have both, you need to edit XF86Config-4. To change your screen resolution
    settings now, follow these steps:


    +   1. Exit the GUI.

    If you boot into the GUI by default, type init 3 at a command prompt to leave
    the GUI for rot. If you have to, type startx to get into the GUI, click the GNOME
    footprint or KDE K Icon and choose Log Out.


    +   2. Log in as root.

    If you''re not logged in from the root account (and you normally shouldn''t be),
    log in as root to edit this file.


    +   3. Change to the directory containing the file.

    You probably type cd /etc/X11 for this step.


    +   4. Make a backup copy of the file.

    You type either cp XF86Config XF86Config.old or cp XF86Config-4.old to make the
    backup.


    +   5. Open the file in your favorite text editor.


    +   6. Jump to the end of the file.

    This file can be a long one, and the text you want is close to the end.


    +   7. Move up through the file until you see this text:

    Section "Screen"


    +   8. Look beneath the section header for a line similar to this one:

    Subsection "Display"


    +   9. Look beneath this section header for a line similar to this one:

    Modes "1024x768"'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# 338 Part V: The Part of Tens


    10. Add to the line the other modes you want to use, using the following line
    as an example:


    ```

    Modes "-1024x768" "-800x600" "-640x480"

    ```


    Be sure not to go beyond your monitor''s capabilities. Check your monitor''s documentation
    to see what it can handle if you want to raise the resolution.


    11. After you finish making changes, save and close the file.


    Now you can return to the GUI. Out of root and back into the account you usually
    use, and then type one of the following commands:


    +   - startx: If you don''t normally boot into the GUI

    - init 5: If you normally boot into the GUI


    You can change resolutions after they''re set up (as shown in the preceding section)
    by pressing the key combination Ctrl+Alt-Plus, where Plus is the plus (+) sign
    on your number pad — you can''t use the sign on the main keyboard for this one.
    If you''re using a keyboard without a number pad, you have to edit the file as
    shown in the preceding section and move your preferred resolution to the beginning
    of the list. Then, if you''re already in the GUI, log out and log back in.


    # # My GUI Is Hung and I''m Stuck!


    One quick solution to this problem is the key combination Ctrl+Alt+Backspace.
    If this doesn''t do the trick, your system is in really bad shape! Try to switch
    to a virtual terminal by using Ctrl-Alt-F5. If this key combination also does
    nothing, you need to reboot the machine.


