    +   4. Replace each of the `<?>` entries with the letters and numbers for your
    formula.

    When I change `matrix[<?> # <?> ## <?> # <?>]` to `matrix(A # B ## C # D)`, I
    see the result shown in Figure 14-11.

    5. Continue adding components to the formula until you are finished.

    Suppose that you want to multiply the matrix by 3. You press Enter to go down
    to the next line, right-click to display the pop-up menu, and choose Unary/Binary
    Operators<a Times by b. This choice adds the phrase `<?> times <?>` beneath the
    matrix code. If you erase this phrase and use it as a guideline, you end up with


    ```

    3 times matrix(A # B ## C D)

    ```


    This line gives the result shown in Figure 14-12. I could go on, but now that
    you''re eager to start with your own explorations!

    OpenOffice.org Math supports (among others) its own format (.SXM) and MathML 1.01
    (.MathML), which isn’t a program. *MathML* is a standard, similar to HTML for
    working on the Web, and 1.01 is a specific version of this standard. For this
    particular version of MathML, see `www.w3.org/TR/REC-MathML/`. The main standard
    page is available at `http://www.w3.org/Math/`. If you need to add formulas to
    Web pages, this site is quite an interesting read!'
