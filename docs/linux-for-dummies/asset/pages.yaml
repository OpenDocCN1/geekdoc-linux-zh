  md: '# 18 Part I: Getting Your Feet Wet


    It would be impossible to account for every possible installation of every Linux
    distribution. Okay, maybe not impossible, but you would need a forklift to bring
    your Linux For Dummies book home from the bookstore if I did. Consequently, I
    try to summarize the concepts needed to install any Linux distribution into this
    one book without detailing each. As you can imagine, this is a bit of a challenge!


    I chose Fedora Core 1 as the sample distribution because Red Hat has become a
    recognized Linux standard, and its Fedora Core project is specifically aimed at
    home and small business users who cannot afford or have no need to purchase higher-level
    products. Even better, if you use Red Hat Enterprise Linux (RHEL) in your office
    or organization, Fedora Core is a proving ground for the technologies that will
    make their way into RHEL.


    In addition to Red Hat coverage, I also include information about two other popular
    distributions: in particular, Mandrake and SuSE. I certainly do not wish to discount
    Slack and Debian because these are very powerful distributions. I just feel that
