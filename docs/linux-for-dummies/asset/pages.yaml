  md: '# Chapter 10: Manipulating Files and Directories 173


    # File Managers


    Tired of typing stuff at the command prompt? If you prefer, the GUI contains a
    bunch of file managers for you. A file manager is a program, such as Windows Explorer,
    enables you to dig through and manipulate your files and directories with your
    mouse rather than at the command prompt. In this section, I take you on a tour
    of the file managers that, by default, come with popular Linux distributions.


    In both GNOME and KDE, the file managers can do more than just work with your
    files. Have some fun and experiment with the programs covered in this section!


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_194_0.png)


    # Sailin'' with Nautilus


    In the GNOME desktop environment (andwhere in Fedora Core 1), the default file
    manager is Nautilus. You can find this by double-clicking the Home icon on your
    desktop. Figure 10-2 shows an example of what you can see with Nautilus in a default
    Fedora Core 1 GNOME setup.


    The workings of this file manager should seem similar to those you''re used to
    in other operating systems. If you like to have the full file system tree available
    in a pane on the left, you can change the default setup by following these steps:


    +   1. Choose the Information drop-down list box.


    The list box expands, displaying your options.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_194_1.png)


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_194_2.png)'
  merge: -1
