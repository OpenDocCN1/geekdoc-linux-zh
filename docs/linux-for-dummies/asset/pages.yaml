  md: '# 90 Part I: Getting Your Feet Wet


    # The Log Out too!


    After you choose the Log Out option on the main menu, the screen darkens somewhat
    and the Are Sure You Want to Log Out? dialog box opens. To use this box, follow
    these steps:


    +   1. If you want GNOME to remember which items you have open and return to its
    current state after you log back in, make sure that you select the Save Current
    Setup check box.

    2. Click Log Out, Shut Down, or Restart the Computer to set the appropriate action
    into motion, or click Cancel if you don''t want to do any of them.

    3. Click OK to go through with your choice or Cancel if you change your mind.


    These options do the following:


    +   * Log Out: Closes GNOME and returns to the command prompt.

    * Shut Down: Shuts the machine down and then off. You must be able to enter the
    root password (the password for the root user) to use this option.

    * Restart the Computer: Shuts the machine down and then brings it back up. You
    can use this option only if you know the root password.


    # The Panel


    Along the bottom of your GNOME desktop is a long bar with icons on it. It''s the
    Panel. Because this bar is neatly divided into sections, take a look at what''s
    in each section from left to right. On the far left side of the Panel is the GNOME
    Main Menu button (refer to Figure 6-1), which opens the appropriately named menu.


    As you continue your journey to the right, you run into the standard set of Bluecurve
    GNOME tools (refer to Figure 6-1). You can reach all these items through the main
    menu, but they''re placed on the Panel so that you can find them quickly and easily:


    +   * Mozilla: The Worldplanet-with-a-mouse icon. It launches the Mozilla Web
    browser if you''re using Red Hat Linux; if not, it''s a red dinosaur.

    * Evolution: Just to the right of the Mozilla button; launches an e-mail and calendar
    program.

    * OpenOffice.org Writer: Resembles two pieces of paper and opens the OpenOffice.org
    Writer word processing program.'
