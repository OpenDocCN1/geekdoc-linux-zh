  md: '# 110 Part II: Internet NOW


    following list, I briefly examine a few popular Linux-friendly options that may
    be available to you:


    +   **Cable modems:** Many cable television companies have expanded their product
    lines to include Internet access over their cable infrastructure. When you subscribe
    to a cable Internet service, the installation technician provides you with a special
    device, called a cable modem, along with a standard network adapter. The technician
    then installs the network adapter into your computer and connects the cable modem.
    If cable Internet connectivity is available in your area, it provides the best
    cost-to-bandwidth ratio available. In other words, the service is likely to cost
    more than a dial-connection, a cable connection can reach speeds 50 times faster
    than a 56 Kbps modem dial-up account and typically costs only about twice as much.


    You may have to configure your Linux machine to work with cable Internet service
    on your own. Most cable companies don''t get technical support for Linux. The
    following Web page provides a document that fills you in all the details:

    `www.linuxdoc.org/HOWTO/Cable-Modem/index.html`


    +   **Integrated Services Digital Network (ISDN):** Not too long ago, ISDN was
    one of the only residential high-speed options. It appeared when 28 Kbps was all
    about that if you could milk from the copper strands that connected your telephone
    to the telephone company. ISDN is still available and promises a speedy 128 Kbps
    — as long as you''re within 3.4 miles of the telephone company''s central office.
    You need two special devices to use ISDN: a terminal adapter (an ISDN modem) and
    a network adapter. The Red Hat Network Configuration tool includes support for
    ISDN setups.


    +   **Digital Subscriber Line (DSL):** DSL works much like ISDN in that it carries
    data to your telephone jack in a digital format. DSL is popular because it provides
    a faster connection with lower installation and service costs than ISDN, and it
    utilizes the existing copper telephone wiring provided by your telephone company.
    A DSL connection requires additional hardware, which your Internet Service Provider
    (ISP) should provide. The Red Hat Network Configuration tool includes support
    for DSL.

    Note that several variants of DSL exist:

    * IDSL (over an ISDN line)

    * Symmetric Digital Subscriber Line (SDSL)

    * Asymmetric Digital Subscriber Line (ADSL)

    * Generic DSL (XDSL)'
