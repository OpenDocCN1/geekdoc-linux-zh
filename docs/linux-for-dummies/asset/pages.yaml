    # Installing SuSE


    Of all the latest and greatest distributions claiming to be better than all the
    rest, SuSE has made the most dramatic leap in providing a truly simple Linux evaluation
    system. You can download the live evaluation version from the Web site (www.suse.com/us/download/suse_linux)
    and burn it to a CD. After you boot from this CD, you''re prompted with the typical
    installation questions: which types of keyboard and mouse you have and which type
    of video hardware, for example.


    Notice that one important and necessary setup step is omitted: how not to partition
    and format your hard disk. Omitting such an important step seems goofy, don''t
    you think? Well, the folks at SuSE didn''t forget to include this step; rather
    it comes in an ingenious feature to keep you from nuking your existing operating
    system while trying to see what Linux thing is all. Intrigued?


    If you pay close attention when the CD is initially loading into memory, you may
    see a message regarding file system detection. Here''s the scoop: The CD isn''t
    installing Linux to your hard drive. If you recall, the title of this distribution
    states Evaluation in its wording. SuSE has drastically reduced the time gap between
    wanting to use Linux and being able to interact with a usable system, by booting
    a virtual system that utilizes your computer''s memory, any available existing
    file system volumes, and the directories and files already on the CD.'
