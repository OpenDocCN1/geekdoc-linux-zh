    # Word Processing with OpenOffice.Org Writer


    Word processors are almost required equipment these days. Kids use them to write
    letters to their grandparents. Grandparents use them to write letters to their
    grandkids. If you''re working on the great American novel or a school book report,
    OpenOffice.org Writer has all the best features you find in the other word processing
    packages you have used in the past.


    # Starting it up


    To start OpenOffice.org Calc in the distributions I cover in this chapter, do
    the following:


    +   In Fedora Core 1: Choose Main Menu-Office-OpenOffice.org Writer. Or, you can
    click the OpenOffice.org Writer button on your panel.


    +   In Mandrake Linux 9.2: Choose Main Menu-Office-Wordprocessor-OpenOffice.org
    Writer.


    +   In SuSE Linux 9.0: Choose Main Menu-Office-Word processor.'
