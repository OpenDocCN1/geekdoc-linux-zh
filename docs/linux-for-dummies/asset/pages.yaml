  md: "# # Linux For Dummies,\n 5th Edition\n\n# ## Accessing and Removing CDs\n\n\
    | Distribution | Commands/Actions |\n|---|---||\n| Red Hat and Mandrake | Accessing\
    \ | If you're in the GUI, Red Hat should see the CD automatically as it's inserted.<br><nIf\
    \ you're at a command prompt, issue `mount /mnt/cdrom`. | |\n| | Removing | If\
    \ you're in the GUI, right click on the CD icon on your desktop, and then Select\
    \ Eject.<br><nIf you're at the command line, utilize `mount /mnt/cdrom` to remove\
    \ the CD from your myfile, and then manually eject it. | |\n| SuSe | Accessing\
    \ | You might have to try a few things to figure out exactly to use in SuSE.<br><nOn\
    \ the command line, start by trying `/media/cdrom`. If this doesn't work, then\
    \ the simplest method is to try `mount -t is09660 /dev/device/media/cdrom`, where\
    \ device is hda, hdb, hdc, and so on until it works - make a note of the results\
    \ so you can use this again later. If you get to hdg and it's not working, then\
    \ something else is wrong.<br><nIf you're not in the GUI, type `mount /media/cdrom`\
    \ before you eject the CD. | |\n\n# ## The vi Editor\n\n| Keystroke(s) | Initial\
    \ Cursor Position | Result |\n|---|---||\n| A | One space before the place you\
    \ want to add text | vi inserts Insert mode directly after the cursor's position.\
    \ |\n| ## | Anywhere in the (first) line you want to cut | vi cuts the entire\
    \ line(s). |\n| #dl | Directly on top of the (first) character you want to delete\
    \ | vi deletes the specified characters. |\n| #dd | Anywhere in the (first) line\
    \ you want to delete | vi deletes the entire line(s). |\n| P | Directly where\
    \ you want the text to appear | vi copies the buffered text into the document.\
    \ |\n| u | Anywhere in the file | vi undoes what you last did. |\n| #x | Directly\
    \ on top of the (first) character you want to cut | vi deletes the specified characters\
    \ into the buffer. |\n| #yy | Anywhere in the (first) line you want to copy |\
    \ vi copies the specified line(s) into the buffer. |\n\nCopyright © 2004 Wiley\
    \ Publishing, Inc. All rights reserved.\nItem 4310-5.\nFor more information about\
    \ Wiley Publishing, call 1-800-762-2974.\n\n# For Dummies: Bestselling Book Series\
    \ for Beginners\n\n![](img/e40c80c470cf7ea45bb6271fce82ad29_3_0.png)"
