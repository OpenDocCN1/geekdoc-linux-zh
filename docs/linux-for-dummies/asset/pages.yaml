  md: '# Part III: Getting Up to Speed with Linux


    See those vertical bars between various Panel entries? Hover your mouse pointer
    over them, and the pointer changes into a two-headed arrow. You can drag those
    vertical bars left and right to expand and contract various parts of your panel.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_225_0.png)


    # Configuring an applet


    Some applets have options that let you customize how they behave. Others are more
    boring and just do the same thing no matter what would you prefer. To check which
    configuration and other options are available for your applet, follow these steps:


    +   1. **Right-click the applet and examine the shortcut menu.** This shortcut
    menu is different from applet to applet. In fact, there doesn''t seem to be any
    real consistency in the menu options! (And not every applet even has a shortcut
    menu) Look for entries such as Preferences, Settings, and the word *Configure*.

    2. **Select the appropriate item from the shortcut menu.** If you use a Configure
    or Preferences dialog box, make your changes and click Apply to see how that affects
    your applet without closing the dialog box. You may see more than one configuration
    dialog box or submenu, as is the case for the KNewsTicker.

    3. **Alter the selections in the dialog box to customize this applet''s behavior.**
    Experiment as much as you want. Just remember that you can always go back and
    change the settings or remove the applet from your panel later.

    4. **Close the dialog box.** In a Preferences dialog box, click OK to close the
    window. Settings dialog boxes typically have a button, aptly named Defaults, that
    enables you to restore your defaults.


    # Removing an applet


    You have room for only so many applets. And, if you''re like me, you probably
    don''t want to have every bit of free space cluttered with icons. To remove an
    applet from the Panel, follow these steps:


    +   1. **Right-click the Panel on an empty slot.**

    2. **Choose Remove...** The series of submenus opens, and you finally are looking
    at a list of the applets you now have on your Panel.

    3. **Choose the applet you want to remove from the Panel.** The applet is no longer
    on your panel.'
  merge: -1
