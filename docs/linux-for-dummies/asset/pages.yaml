  md: '# Author''s Acknowledgments


    Dee-Ann, as usual, has lots of people she''d like to thank. First off, thanks
    to John "maddog" Hall for giving her the opportunity to take over this book''s
    evolution. He was too busy leading Compaq''s UNIX Software Group, acting as Executive
    Director for Linux International, and sitting on the board of advisors for Cair
    Linux/GNU certification to the fifth edition.


    Second, thanks to the folks at LANrights for all of their hard work on the two
    previous editions. Third, thanks to Melanie Hoag, and Evan Blomquist for their
    strong efforts on the last two editions as well. Finally, of course, to the editors
    and staff at Wiley Publishing, Inc. Without them and their guidance, this book
    would not exist or continue to improve over time.


    Most of all, I''d like to thank the readers who contacted me with their questions,
    suggestions, and concerns. I apologize to anyone who got lost in the great delug
    of e-mail and didn''t get an answer; but please trust that, at the very least,
    when I dug your e-mail out from the pile three months later, I filed it away as
    one more thing to consider in the next edition. It''s reader participation that
    keeps books like this improving over the years, and it''s my goal to continue
    refining Linux For Dummies to keep it the best desktop Linux book available.


    > — Dee-Ann LeBlanc'
