  md: '# Chapter 10: Manipulating Files and Directories 175


    You do the same to copy, except that you click the item and then hold down the
    Ctrl key while you drag and drop.


    # **Deleting files and directories**


    To use Nautilus to delete either a file or a directory from the file system, follow
    these steps:


    +   1. **Browse to the file or directory''s location.**


    +   2. **Select the file or directory.**


