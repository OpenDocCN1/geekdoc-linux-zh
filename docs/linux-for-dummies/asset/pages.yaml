  md: '# # Chapter 15


    # # Multimedia Wow!


    In This Chapter


    +   - Listening to music

    - Using, recording to, and ripping from CDs

    - Creating and modifying high-powered graphics with The GIMP

    - Watching movies

    - Using Windows tools and formats


    > The price of freedom is responsibility, but it''s a bargain, because freedom
    is priceless.


    —Hugh Downs


    In these days of computing in noisy Technicolor, it doesn''t feel like a computer
    unless you can make it sing and dance. This used to be a weak point for Linux,
    but these days there''s little that I can''t do on my Linux desktop machine. From
    listening to CDs to watching QuickTime movies, you can just do about anything.
    Sometimes it just takes a bit of elbow grease to get things working.


    Time to take a trip on the wild side and get your Linux box doing the macarena.


    # # Some Preliminaries


    Because legal complications surround a number of multimedia programs and their
    use in countries like the United States of America, some multimedia capabilities
    had to be removed from Red Hat Linux. However, these capabilities are still available
    if you know where to look — and if you''re in a legal jurisdiction that allows
    listening to MP3s, watching DVDs, or other touchy subjects under patent laws and
    the DMCA.'
  merge: -1
  pgno: 278
- img_proc: true
  md: '# Part III: Getting Up to Speed with Linux


    If you are in an area where it is legal to use these technologies in Linux and
    open source, you need to enable the necessary features. Start by using the command
    to become the root user (type - root). Then, use your favorite text editor as
    discussed in Chapter 13 to open the file /etc/sysconfig/rhn/sources for editing.


    Go to the end of the file and add the following text (where this is all on a single
    line):


    ```

    yum livna-stable-fcl http://rpm.livna.org/fedora/1/i386/

    yumstable

    ```


    Right click over the updater icon on the right hand of your panel, and click Exit.
    Then, select the main menu=System Tools<Red Hat Network Alert icon. When the updater
    icon is back in place, click it, and now when you navigate to the point where
    you see "channels" for updates, the livna archive is included.


    However, this action only makes it possible to update what''s already installed.
    You also want to be able to add items you haven''t installed yet, so now open
    the file /etc/yum.conf for editing in your favorite text editor. Add the following
    lines at the bottom, where the URL is all on one line (rather than broken up as
    it appears below):


    ```

    [livna-stable]

    name=Livna.org Fedora Compatible Packages (stable)

    baseurl=http://rpm.livna.org/fedora/$releasever/$basearch/yum

    /stable

    [fedora-us]

    name=Fedora us The Non Red Hat Fedora packages (stable)

    baseurl= http://download.fedora.us/fedora/fedora/$releasever

    /basearch/yum/stable

    ```


    After you have saved this file, you are ready to proceed through the rest of this
    chapter.


    # Checking Your Sound Card


    Before you can listen to those tunes, you have to make sure that your sound card
    is working properly. After the configuration issues are dealt with, you can move
    on to the fun stuff. These days, some people dont buying stereos because they
    can listen to CDs from their computer. There''s plenty of support for this under
    Linux. Internet radio and downloading tunes are also popular regardless of what
    operating system you''re using. Read on to find out more!'
  merge: -1
  pgno: 279
- img_proc: true
  md: '# Chapter 15: Multimedia Wow!


    # # Testing and configuring sound


    The first time that you booted Fedora Core, you were asked to listen to a test
    sound. If you answered that you had, Linux and your sound card are getting along
    fine. If you don''t remember this step or it didn''t pass the first time, I show
    you how to walk through the test again just to make sure. Then I show you where
    to find your audio mixer.


    ## Testing your sound and making it work

    To your sound, select the appropriate tool for your distribution:


    +   - In Fedora Core 1: Choose Main Menu-System Settings-Soundcard Detection.

    - In Mandrake Linux 9.2: Choose Main Menu-Configuration-Hardware-HardDrive. Wait
    for the wizard to detect your hardware, and then select the entry under the Sound
    Card item.

    - In SuSE Linux 9.0: Select the SuSE menu, and then choose System-Configuration-YaST-Hardware-


    For Fedora Core, after you enter your root password, the Audio Devices dialog
    box opens (see Figure 15-1). Click the Play Test button, and you should hear a
    series of guitar strings. If you hear nothing, click No; if you do hear something,
    click Yes.


    Figure 15-1: The Fedora Core Audio Devices box.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_280_0.png)


    If your sound isn''t working, your card may not be supported. The following strategies
    can help you to track down a potential solution:


    +   - Proceed to the manufacturer''s Web site and locate the page for the specific
    card that you have. This page often has a link to technical support, drivers,
    and downloads. If it does, follow these links and see whether a *driver* (the
    piece of software that tells your operating system how to talk'
  merge: -1
  pgno: 280
- img_proc: true
  md: '# Part III: Getting Up to Speed with Linux


    to each piece of hardware) is available for your card in Linux. If drivers are
    listed by kernel version — the version of the Linux core that you''re using —
    type uname -r to see your version number and then choose the closest driver that
    you can. You might also have to try the central support page on that site if there
    isn''t one dedicated to the hardware in question.


    +   Search on www.google.com for the make and model of your card, plus the word
    Linux. For example, I might search for

    Yamaha YMF-744B Linux


    You might be lucky enough to find a nice, simple solution to your problem. Or,
    you might find one that requires you to have a degree in Geekspeak. If so, see
    the Web sites that I mention in Chapter where to go for help you can understand.


    +   Two sound-related projects in Linux also be able to help you. One is Advanced
    Linux Sound Architecture (ALSA), which you can find at www.alsa-project.org/.
    The other is Open Sound System (OSS) at www.opensound.com/. There''s also the
    Linux Sound & MIDI site at http://linux-sound.org.


    # Finding your audio mixer


    After you have your sound working, you might want to adjust the base volume or
    mixer settings like you can in Microsoft Windows. These tools are available at
    the following:


    +   Mandrake Linux 9.2: Choose Main Menu-Multimedia-KMix.

    Fedora Core 1: Choose the main menu and then choose Sound-Volume Control to see
    the mixer shown in Figure 15-2.

    SuSE Linux 8.2: Choose the SuSE (lightning bolt) menu, and then choose Administration-YaST2
    Modules-Hardware-Sound. Then click the Volume button.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_281_0.png)'
  merge: -1
  pgno: 281
- img_proc: true
  md: '# Listening to CDs


    In Red Hat Linux, many music CDs will start up on their own when you insert them
    in the drive if you''re in the GUI. If that CD is registered in the CDDataBase
    (CDDB), the title and the song names load so that you can see what you''re listening
    to. (CDDataBase is one of the services that tells your media players what the
    name of your CD is and what songs are on; find more at www. gracenote.com/) What
    you''ll see looks similar to Figure 15-3.


    Figure 15-3:

    The Red Hat

    Linux CD

    Player with an album

    loaded and

    playing.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_282_0.png)


    If you close this application without clicking the Stop button, the CD will actually
    continue playing. You can stop it by opening the program again and clicking Stop.


    If CDDB doesn''t recognize your CD, you can add it to the database by clicking
    the Open Track Editor button (to the far left beneath the CD display) to open
    the CDDB Track Editor dialog box shown in Figure 15-4.


    Figure 15-4:

    The GNOME

    CD Player''s

