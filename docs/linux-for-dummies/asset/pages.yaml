  md: '# Chapter 15: Multimedia Wow! 269


    # # Burning CDs


    A CD burner is a great way to make data backups (especially if it''s a rewriteable),
    save and share your digital photos, put together multimedia memento scrapbooks,
    and more. Many tools are available that allow you to burn CDs under Linux. I''ve
    used the one that comes with Fedora Core 1, which is xdroast.


    This tool may not be installed by default. It''s on your DVD (or CD 2 in the Fedora
    Core 1 set). See Chapter 17 for how to install new software.


    To start this program, use System ToolsCD Writer. Many of confusing windows open.
    The best advice is to give a glance over them and clicking away until the tool
    itself opens. Then, click the Setup button; in the resulting window, you should
    see your CD burner listed amongst the hardware. Clicking the CD Settings tab brings
    you to one of the items you might want to edit if you''re a CD burning whiz (Figure
    15-12).


    Then, click the HD Settings tab to bring you to one of the items that you actually
    need to edit (check out Figure 15-13). In the Path box, type /tmp. Then click
    Add to this directory in list of temporary storage options. Unless you are a wiz
    with CD burning and have a ton of things that you want to configure, click Save
    Configuration. If you know what else you want to do, take your time! After you''ve
    finished with all your setup tasks, click the Save Configuration button again
    if you''ve made any changes, and then click OK.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_290_0.png)


    Figure 15-12: X CD Roast at its CD Settings dialog box.'
  merge: -1
  pgno: 290
- img_proc: true
  md: '# 270 Part III: Getting Up to Speed with Linux


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_291_0.png)


    X CD Roast offers two options. You can duplicate an existing CD or create one
    from scratch. Both of these choices offer you an attractive simple interface for
    going through the steps of reading in the CD''s contents, editing them if desired,
    and then writing the results onto another CD.


    Figure 15-13: X CD Roast at its HD Settings dialog box.


    > TIP The Tucows download site has a whole section for grabbing Linux multi-media
    tools. Check out http://linux.tucows.com/media.html.


    # Blocking pop-up ads


    The Radio-Locator site gives me another topic for discussion. Every time that
    you click a link there, you will have to deal with pop-up ads. Want to get rid
    of them? In Mozilla, you can do so by choosing Tools>Popup Manager>About Popup
    Blocking. A dialog box opens whether you want to block pop-ups and then configure
    how this works. Click Yes, and the Preferences


    dialog box opens to the Popup Windows tab. The defaults here are fine, or you
    could explore this area more thoroughly. Notice that the ability to allow pop-ups
    from certain sites because there are actually useful pop-ups out there.


    After you''re finished setting this up, click OK. Suddenly, no more pop-ups!'
  merge: -1
