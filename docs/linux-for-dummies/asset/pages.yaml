    # Zen and the Art of Linux Configuration


    Anyone can use Linux, but to become a true Linux master requires an intimate knowledge
    of your system''s internal mechanics. This task may seem daunting when you consider
    that Linux is the sum of many different software subsystems, each written by different
    programmers with different backgrounds and beliefs regarding problem solving.
    Fortunately, software developers to comply with a few universal truths.


    One of these truths is that mortals must be able to configure a program. You can
    define a computer program as a series of instructions that directs the computer
    to perform a specified task. You can''t change any instructions that are hard-coded
    into the program (unless, of course, you made the required changes to the source
    code and recompile the program). As you can imagine, the slightest variance in
    program use requires the handwork of a skilled programmer.'
  merge: -1
  pgno: 124
- img_proc: true
  md: '# Part I: Getting Your Feet Wet


    # File types


    Most Linux subsystems are composed of at least the following types of files:


    +   - **Executable file:** This is most likely a binary file that speaks only
    the language of the computer, like an .exe file in Windows.

    - **Configuration file:** A simple text file you can view and alter with your
    favorite text editor.


    *Executable files* read directives from the configuration files to know how to
    behave. Because the executable must understand the directives in the configuration
    files, you must RTFM (Read The Fine Manual) before doing any heavy lifting in
    a configuration file.


    Providing details on the configuration files themselves is beyond the scope of
    this book. Instead, I cover handy tools that you probably prefer to use over a
    text editor any day.


    # Configuration tools


    Linux comes with a number of configuration tools at both the command line and
    within the GUI environment. In the following sections, I take a look at what comes
    with the three major distributions covered in this book. If you want to know more,
    see your distribution''s documentation.


    # Red Hat and Fedora Core tools


    The Fedora Core distribution of Linux contains many configuration tools in the
    graphical and command-line environments. At the command line, Red Hat has made
    sure that all of their specialized tool names, for convenience, start with the
    text `redhat-config`. For example, `redhat-config-network` lets you work with
    your network settings (see Figure 6-12).


    You can make use of the Red Hat package management program (rpm) to find which
    configuration tools you have installed by typing the following line at the command
    line:


    ```

    rpm -qa | grep redhat-config

    ```


    Not all these tools have a command-line component. Some try to open GUI windows
    after you type their names, and if they can''t do so, they don''t work.'
