  md: '# 156 Part III: Getting Up to Speed with Linux


    # # Listing directory contents


    One of the most basic skills any computer user needs is the ability to see what''s
    where in her file system. In Linux, you use the ls (short for list) command to
    do this by itself with no options — special extras that let you control the behavior
    of a command — all the command tells you is which files and directories are in
    the specified directory.


    Suppose that you''re at the base of the Fedora Core directory tree (which is referred
    to as the root, or /). The ls lists the contents of the current directory by default.
    So, if you type ls at the command prompt in the root directory, you see the following
    output, which lists all subdirectories inside the root:


    ```

    bin dev home lib misc opt root tmp var

    boot etc initrd lost+found mnt proc sbin usr

    ```


    But this is only the tip of the iceberg for the ls command. The ls command has
    a bunch of options you can mix and match to get the results you need. I list the
    most interesting of these options in Table 10-1. Remember: Linux is case sensitive;
    when an item is shown in uppercase, it must be used in uppercase, and vice versa.


    | Table 10-1 | ls Options |

    | Option | Purpose |

    | -a | Displays all files, including hidden files (files whose names start with
    a period) |

    | -c | Displays the last time the file was changed |

    | @hycolor | Color codes items by type |

    | -1 | Displays a long format file listing |

    | -R | Displays the contents of the directories in this directory |

    | -S | Lists the files by size |

    | -t | Lists the files according to how long ago they were changed |

    | -u | Lists the files according to how long ago they were accessed |


    In this table, -a and -l are far by the most commonly used options. If you''re
    in a brand-new home directory and type ls, you see nothing. However, if you'
  merge: -1
