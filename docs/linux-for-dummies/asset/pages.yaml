    +   - cancel, lp, lpq, lpr, lprrm, lpstat, ltest


    # System control


    These commands provide system-wide information and control. Normal users can run
    many commands to obtain system information; however, commands that actively change
    the configuration of the system need to run while you''re logged in as root or
    have utilized the su command to temporarily become the superuser.


    # Kernel module handling


    You may sometimes need to add kernel support for an additional device (software
    or hardware). If this need arises, you have a limited number of choices: You can
    either rebuild the kernel or install a loadable kernel module. Although rebuilding
    a kernel doesn''t exactly require a Ph.D. in nuclear science, consider it a time-consuming
    nuisance that it''s best to avoid. The following commands enable you to include
    the kernel support you need while the system is running, without having to rebuild
    the entire thing from scratch:


    ```

    depmod, insmod, lsmod, modprobe, rmodmod

    ```


    # Processes


    Most of your system activity requires processes. Even when your system appears
    idle, a dozen or so processes are running in the background. These commands enable
    you to check under the hood to make sure that everything needs to be running is
    running and that you''re not overheating or taxing resources:


    ```

    at, atq, batch, crontab, env, fuser, kill, killall, nice, pidof, pkill, ps, pstree,
    renice, sleep, top, usleep, watch

    ```'
