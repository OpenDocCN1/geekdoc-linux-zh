    The rest is more details, and I will help you with those!


    # How This Book Is Organized


    This book contains six major parts, arranged in an order to take you from Linux
    installation and configuration through keeping a Linux system up and running,
    not purring like a cat in the sun! Most parts contain three or more chapters or
    appendices, and each chapter or appendix contains modular sections. Whenever you
    need help or information, pick up this book and start anywhere you like, or use
    the Table of Contents and the index to locate specific topics or keys.


    Following is a breakdown of the book''s six parts and what you find in each one.


    # Part 1: Getting Your Feet Wet


    This part sets the stage and includes an overview and introduction to the terms,
    techniques, and software components that make Linux the raging tiger that is so
    ready, willing, and able to do its thing. To be a little more specific, I start
    out with a Linux overview that explains what Linux is, where it came from, and
    how it works. Next, I tackle the various tasks and activities involved in preparing
    for and installing Linux on a PC. If you''re not a diehard Fedora Core 1, I also
    cover what''s involved in installing Mand and SuSE. After that, I tell you how
    to give the Linux not to get rid of it by any means, but rather, to fire up your
    brand-new system to reach the heights of computing ecstasy (at least, I hope it''s
    good for you as it usually is for me!) Finally, I help you explore standard Linux
    tools and interfaces, work with accounts, and get the skinny on various aspects
    of distribution-related Linux tools.


    # Part 11: Internet NOW


    In this part, you explore the issues involved in connecting a Linux system to
    the Internet, including configuring a modem, managing a dial-up connection to
    an Internet Service Provider (or ISP), and configuring various Internet protocols
    involved to make your Internet connection work. You also go through the details
    involved in configuring and using a Web browser and setting up and using an e-mail
    client and newsreader.'
