    # Avoiding root


    The root user, also known as the superuser or just root, has access to anything

    and everything on the machine. No matter how you sets things up, you can''t

    keep the root account out of any area. The root user also has access to all

    commands and devices. Many Linux beginners figure that they may as well

    use the root account because it''s so convenient.


    However, for good reasons, you shouldn''t use the root account for

    everyday:


    +   - You don''t always need root-level access.

    - Root-level access is as much of a curse as it is a blessing. If you mess up
    as

    a user, you mess up only the stuff in your account. If you mess up as the

    root user, you can wipe out everything — all the files on the entire Linux

    system!

    - Don''t think that can happen to you? Many experienced Linux administra-

    tell stories about the day they made a fatal typo or weren''t

    paying attention to what they were doing when they were logged in root.

    - If you send e-mail or news posts as root for anything other than serious

    administrative business, people think that you don''t know what you''re

    doing or are showing off.

    - Root comes with too much temptation. The superuser can read other\people''s
    e-mail messages and files, which introduces a few tiny ethical

    issues. Many Linux distributions give you a nasty red background when

    y''re in the root account so that you don''t forget.


