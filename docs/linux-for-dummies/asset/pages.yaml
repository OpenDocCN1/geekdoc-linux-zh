  md: '# 216 Part III: Getting Up to Speed with Linux


    # Editing text


    You have a number of ways you can edit text in the vi editor. You can do it the
    old-fashioned way by entering Insert mode and manipulating the text by using the
    Delete key, Insert key, and more from your keyboard. However, vi has even fancier
    options available. To use any of these options, follow these steps:


    +   1. Press Esc to enter Command mode from any mode you may be in.

    The layout of this screen looks familiar (refer to Figure 13-1).

    2. Use the arrow keys to properly position the cursor for the option to work.

    Table 13-1 explains proper cursor positioning.

    3. Press the key or sequence of keys that tells vi what you want to do.

    Table 13-1 shows one group of commands you may want to use.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_237_0.png)


    | Table 13-1 Commonly Used in vi Editing Commands |

    | Keystroke(s) | Initial Cursor Position | Result |

    |---|---|---|n| A | One space before the place you want to add | vi enters Insert
    mode directly after the cursor''s position. |

    | P | Directly where you want the text to appear | vi places in the document a
    copy of the previously copied text. |

    | #0 | Anywhere directly above where you want the new line to appear | vi adds
    a blank line or below the cursor''s position and then enters Insert mode with
    the cursor within that blank line. |

    | #r | Directly on top of the (first) character you want to replace | vi replaces
    the current character if it''s just as r (where _ is the character to replace
    the item) or replaces # of characters, including the current one, with _ |

    | #yl | Directly on top of the (first) character you want to copy | vi copies
    the specified characters into the buffer. |

    | #yy | Anywhere within the (first) line you want to copy | vi copies the specified
    lines(s) into the buffer. |

    | u | Anywhere in the file | vi undoes what you last did. |'
