    # Tweaking the GUI''s Innards


    Behind GNOME and KDE lurks the X Window System, or "X." X provides the skeletal
    GUI structure and functionality. GNOME and KDE make use of this skeleton to provide
    you with a pleasant GUI environment. Whenever you configure hardware or basic
    GUI features like resolution, you actually work with X, and not GNOME or KDE.
    In this section, I introduce you to the critical components of X and point you
    to some useful X configuration tools.


    The /etc/init/XF86Config file contains your X configuration. Although this file
    is just a normal text file, the format is complicated and confusing. Rather than
    make you work with this file by hand, the various Linux distributions provide
    a number of tools. The following table can help you identify tool or tools you
    can use to change your X configuration for a few different distributions:


    | Linux Distribution | Tool |

    |---|---|

    | Red Hat | Xconfigurator and redhat-config-xfree88 |

    | SuSE | sax and sax2 |

    | Mandrake | drax |


    The X Window System searches for the XF86Config in several places, reading the
    first one it finds. The filename XF86Config-4 takes precedence over XF86Config
    in the distributions where it occurs, so if you find both, go with XF86Config-4.'
  merge: -1
