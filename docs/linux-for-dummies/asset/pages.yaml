  md: '# # Introduction


    Welcome to the fascinating world of open source software that is Linux. In this
    book, I introduce you to the wonders of the Linux operating system, originally
    created as a labor of love by Linus Torvalds in the early 1990s. My goal is to
    initiate you into the rapidly growing gang of Linux users and enthusiasts by rewriting
    the rules for the operating system marketplace.


    If you have contemplated switching to Linux but find the prospect too forbidding,
    you can relax. If you can boil water or set your alarm clock, you too can become
    a Linux user. (No kidding!)


    When this book appeared in its first edition, Linux was an emerging phenomenon
    that was neither well known nor understood. In this edition — for a new generation
    of Linux users — so much is available that I have steered this particular title
    toward what Linux is and how you can make the best use of it on your desktop.
    To that end, these pages contain various online resources, tips, and tricks —
    as well as more general instruction.


    I keep the amount of technobabble to a minimum and stick with plain English as
    much as possible. Besides plain talk about Linux installation, boot-up, configuration,
    and tuning, I include lots of examples, plus lots of detailed instructions to
    help you build and manage your very own Linux machine with a minimum of stress
    or confusion.


    I also include with this book a peachy DVD-ROM that contains Fedora Core 1.


    # # About This Book


    At time, Red Hat renamed its consumer-level Linux product to the Fedora Project.
    Throughout the course of this book, I have tried my best to refer to the consumer-level
    product as Fedora Core, and the commercial versions you have to buy as Red Hat
    Enterprise Linux. You''ll probably see the product referred to as the Fedora Project
    in the news, on the Web, and elsewhere, but, you can rest assured that the different
    terms, as used in this book, are referring to the same product.'
  merge: -1
