    +   - Software versions: Different distributions may use different versions of
    the kernel (the core of the operating system) and other software packages. Open
    source projects are dynamic and release new versions regularly, as opposed to
    the often sluggish development cycle of traditional software.


    +   - Package managers: Even though one Linux program should be able to run on
    any distribution, called package managers keep track of the software on your system
    and ensure that you have all the required supporting software as well. Distributions
    are usually dependent on one particular package manager. Chapter 15 provides more
