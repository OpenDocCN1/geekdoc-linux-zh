  md: '# Chapter 7: Connecting to the Internet


    Typical residential connection service ranges from 128 Kbps to 1.0 Mbps.

    For an example of DSL, visit the following Web page:

    `www.linuxdoc.org/HOWTO/DSL-HOWTO/index.html`


    +   * Dial-up modems: the dial-up modem is still widely used. It translates the
    digital signal from the computer into an analog signal required for transmission
    from the wall jack to the telephone phone. Because the modem utilizes existing
    voice beyond the telephone service, you don''t need any special setup beyond subscribing
    to an ISP. Red Hat includes support for modem setup.


    Because most people who aren''t hooked up through a network connected either DSL
    or dial-up modems, I had to decide which one to cover. Throughout the rest of
    this chapter, I guide you through step-by-step setting up your Linux workstation
    to connect to the Internet by using a dial-up modem. Like any good guide through
    a deep, dark forest, I point out the slippery parts of the trail as I go. If you''re
    using DSL, the process is similar.


    # Creating Your Internet-O-Matic


    > Sara, could you connect me with Goober down the fillin'' station''

    —Andy Griffith


    If only it were that simple. Fortunately, the good folks at Red Hat provided a
    few tools that reduce the complexity of networking with Linux. It''s not that
    networking has changed, but rather that many of its details have been abstracted
    so that you just have to click here and press a key there. Not long ago, configuring
    dial-up networking on a Linux machine was nothing short of debugging a defective
    Goldberg contraption.


    # Then come broadband


    Before I focus on dial-up modem configuration, a few words regarding the broadband
    options (DSL and cable) are in order. The word broadband has a technical definition,
    but I just use it to mean high-speed Internet access. Although a high-speed dial-up
    modem can typically transmit information at speeds up to 56 kilobits (thousand
    bits) per second, broadband connections. Nowadays, the Web contains lots of images
    and multimedia elements, and enjoying these features through a dial-up line and
    a 56 kbps modem is similar to drinking a cold glass of water with an eyedropper
    when you''re dying of thirst.'
