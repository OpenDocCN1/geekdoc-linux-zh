  md: '# "My system never booted properly"


    If you have just installed your system and it isn''t booting properly, I suggest
    that you try reinstalling Linux from your DVD or CDs. If that doesn''t work, try
    booting from the special boot floppy you created during installation. Your computer''s
    hard drives may be misconfigured, a common problem with hand-me-down computers
    that have obviously been Frankenstein, and pieced together. (Symptoms include
    unnatural bolts from the side of the case or entrails dangling from empty drive
    bays.) If your computer still doesn''t work, you have a hardware incompatibility
    or configuration issue, and helping you debug it is beyond the scope of this book.
    I recommend that you find a friend or neighbor who understands PC hardware and
    can help you diagnose your hardware''s health. Another valuable resource is your
    local Linux Users Group. In most cities, active groups often gather for installfests
    where you can take your computer for some friendly and expert advice.


    # "I could swear I saw an error while it was booting"


    Some boot problems appear as the kernel initializes the system. Logs of information
    scroll as the Linux computer boots, which makes it hard for you to catch specific
    pieces (especially if your machine is really fast). Fortunately, most Linux distributions
    keep a log in the form of a text file. This log contains a record of what happened
    during the boot process. Table 5-1 lists where you can find this information in
    several popular Linux distributions.


    | Table 5-1 | Log File Locations in Linux Distributions |

    | Distribution | Log File Locations |

    | Mandrake | /var/log/boot.log, /var/log/dmesg, /var/log/messages |

    | Fedora Core | /var/log/boot.log, /var/log/dmesg, /var/log/messages |

    | SuSE | /var/log/boot.msg, /var/log/messages |


    Type **dmesg** at a command prompt and press Enter to get your boot information
    to come back at any time. You can also use **dmesg | less** to ensure that it
    doesn''t scroll past you again. (Note that this command is two commands in one.)
    If you run `dmesg` by itself, it scrolls through the initialization messages,
    probably off the screen. The `less` command is another command that displays one
    screen full of messages at a time. The vertical bar that glues these commands
    together is a **pipe**. See Chapter 11 for more information.'
  merge: -1
