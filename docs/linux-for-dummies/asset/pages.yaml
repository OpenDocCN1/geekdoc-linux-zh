  md: '# 48 Part I: Getting Fedora Feet Wet


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_69_0.png)


    Figure 3-6: The Installation Type screen.


    Four options are available under Installation Type:


    +   **Personal Desktop:** This option performs an installation for personal desktop
    or laptop and installs a graphical interface. If your system already contains
    a copy of Linux, the default for the Personal Desktop installation is to remove
    any existing Linux-related partitions and use all the remaining free, unpartitioned
    disk space. If you choose this default, any non-Linux partitions, such as OS/Windows,
    remain untouched. After installation, you can boot to Linux and your other existing
    operating system or systems.


    +   **Workstation:** This option installs the graphical interface (X Window System)
    and the desktop manager(s) of your choice, much like the Personal Desktop installation,
    but also includes tools for software developers and system administrators.


    +   **Server:** This option is designed for a basic Linux-based server for file
    and print sharing and Web services. You can also enable other services and choose
    to install a graphical environment. When you select this option, the default disk-partitioning
    scheme is to remove ALL partitions ON ALL hard drives. This means that ALL partitions
    and operating systems of any type, Linux and others, are removed, and all drives
    are erased.


    +   **Custom:** This option enables the flexibility to retain your existing operating
    systems and configuration options. This option enables you to choose the packages
    or applications/roles you want to install, the size of your disk partitions, and
    how you want the system to boot.'
