  md: '# Chapter 18

    A Secure Linux Box Is a Happy Linux Box


    In This Chapter


    +   - Implementing strong passwords

    - Keeping your system up to date

    - Pluggingging security holes

    - Using the System Logs Viewer

    - Securing your system by using best practices


    > I am Inspector Clauseau, and I am on official police business.

    —Inspector Clauseau


    Security is a buzzword that you can''t escape. Anywhere you read about the Internet,
    you see reports of break-ins, threats by new viruses, dire warnings about the
    security of your systems. In some ways, this hype is necessary to keep people
    on their toes. The biggest problems you get with security — whether it''s in your
    home, at work, or on a computer somewhere — happen when you get lazy.


    You don''t leave the front door of your house open when you go to work, do you?
    How leaving it shut and locked but with a few mice, big windows open? The problem
    is that many people do this every day with their computers, and they don''t even
    know it! In this chapter, I take a look at where your open doors and windows are
    and what you can do to secure them.


    Every user''s actions affect your overall system security. If your family members
    or officmates need access to your Linux machine, take the time to sit down and
    explain the facts of secure life to them. They can then apply this information
    to the other computers they use, because these issues aren''t specific to Linux.'
