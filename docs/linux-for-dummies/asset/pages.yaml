  md: '# 206 Part III: Getting Up to Speed with Linux


    fonts, icons, sound effects, and more — part of a single, centralized entity.
    Many people are happy to find out that themes are available in the Linux world
    too.


    # Downloading themes


    A large number of themes is available on the Internet for both GNOME and KDE.
    To find and grab these themes for your own use, follow these steps:


    +   1. Point your Web browser to http://themes.freshmeat.net.

    You''re taken to the Themes Web site, where any number of GUI customization items
    is offered.


    +   2. If the Section drop-down list box isn''t already selected, select it and
    choose Themes.

    You''re taken to the Themes section of the site.


    +   3. For GNOME themes, click GTK; for KDE themes, click KDE.

    This action brings you to the appropriate section, ensure that you choose themes
    that work with your system.


    +   4. For GNOME, select the GTK 2.X area; for KDE, select KDE 3.X.

    Now you''re in the section for the latest versions of GNOME or KDE.


    +   5. Browse and choose the theme you want to try.

    You can use the Sort Order drop-down list box to change the order in which the
    items are displayed. Keep your eye out for the requirements that go with the theme.
    Some themes require additional "engines" (software-that runs behind the scenes),
    and you want to avoid installing them if you''re uncomfortable with finding and
    adding software at this point. You''re safe if it mentions Metacity — that''s
    part of the Fedora Core GNOME GUI.


    +   6. After you have chosen your theme, click its name to the theme-specific
    page.

    There, you can find any comments someone has about the theme.


    +   7. Scroll down if necessary and click the link under Tar/GZ.

    Your browser asks for specifics on where you want to place the file. If you want
    to use this theme only for yourself, place it in your home directory or a subdirectory
    within your home. If you want to share the theme with others, place it in a directory
    that everyone can reach — make one, and set its permissions appropriately.


    In the next sections, I cover how to set this new theme as your current theme.'
