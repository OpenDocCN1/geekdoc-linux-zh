    Computing novices often marvel at the keyboard dance Linux experts typically perform.
    Sure, these experts know about modern advances, such as the mouse and graphical
    interface, but these keyboards prefer the home keys and find that they can work
    faster with the keyboard. It takes some time to reach this level of proficiency,
    but every expert is a novice at one time, and any novice can become an expert
    by delving into the various commands available and getting plenty of practice.


    In this appendix, you will find the commands listed by themes, according to what
