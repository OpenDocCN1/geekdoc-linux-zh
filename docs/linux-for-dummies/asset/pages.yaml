    > Whom computers would destroy, they must first drive mad.


    —Anonymous


    Any computing old-timers speak fondly of the command line. Others who developed
    their skills by pointing and clicking refer to the command line as some antiquated
    tool used by crusty old-timers. The truth is that most skilled computing professionals
    recognize the merits of both the graphical user interface (GUI) and the command-line
    interface (CLI). You must understand that the command line provides a powerful
    lever for operating your computer. If you ever watch over the shoulder of a skilled
    Linux geek, you notice that, after logging in, it doesn''t take long to start
    tapping seemingly cryptic instructions on a command line.


    In this chapter, I explore the Linux program that provides the CLI, which is called
    the bash shell. Although many shells are available for Linux, bash is the most
    common, and for good reason. Basically, the creators of bash rolled all the good
    features of the other shells into one program.


    Each shell has its own way of handling commands and its own additional set of
    tools. I start by explaining what a shell really is, and when you understand that,
    you''re ready to get down and dirty with bash. I specifically verify what you
    can do with some of the best features of the bash shell. Then, I continue with
    working at the command prompt and get into bash shell interior decorating.'
