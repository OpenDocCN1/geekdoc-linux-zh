  md: "# Part III: Getting Up to Speed with Linux\n\n# Ripping music tracks from CDs\n\
    \nThis is another topic that's impossible to cover without at least acknowledging\
    \ that both ethics and legal issues are involved. I'm not going to get into legalities\
    \ here, but my personal ethics are that it's fine to rip (copy) music off my own\
    \ CDs for my own use. If I want to pull my favorite songs off CDs that I purchased\
    \ and set them up so I can listen to them collectively in a random playlist, I\
    \ don't see a problem with this. However, doing this and then taking the CD back\
    \ for a refund is theft.\n\nSo, with that, a number of music ripping programs\
    \ are available in Linux. I cover Sound Juicer, which is included on any machine\
    \ with GNOME installed. You open Sound Juicer by choosing Main Menu→More Sound\
    \ & Video Applications→Sound Juicer Ripper. Figure 15-8 shows this tool.\n\n![](img/e40c80c470cf7ea45bb6271fce82ad29_287_0.png)\n\
    \nTo rip songs from a CD that you already have inserted\n\n+   1. For each song\
    \ that you don't want to rip, uncheck the Extract check box, next to the song.\n\
    \   The check mark disappears for each song that you want to digitize.\n2. Select\
    \ Edit→Preferences.\n\nThe Preferences dialog appears, as shown in Figure 15-9."
