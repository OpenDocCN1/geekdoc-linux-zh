  md: '# 264 Part III: Getting Up to Speed with Linux


    Now try a trickier one, like Radio-Locator. Not only does this site offer stations
    in formats that may not work under Linux, but it''s also a bit confusing. I recommend
    that you do the following:


    +   1. Under the Search portion, select how you want to drill down to the station
    that you want to listen to.


    Choose from format, frequency, U.S. state, Canadian province, or advanced search.
    I tend to pick format, so I''ll use that for an example.


    +   2. Under Available Radio Station Formats, select which type of station you''re
    looking for.


    Stations are sorted by their content type.


    +   3. Under the section for your Format, look to the table beneath the featured
    stations.


    It''s the left-most column that you''re interested in. Many of the stations here
    have blank entries, but some have lightning bolts.


    +   4. If there is a lightning bolt next to the station that you want, click it.


    Stations played in a format that you have already told the browser is handled
    by XMMS or another tool start playing automatically. If this is the case, you''re
    finished with this process.


    +   5. Otherwise, click the station''s call sign if it''s marked as a link.


    This action brings you to the station''s own page. If the call sign isn''t marked
    with a link, the station isn''t online.


    +   6. Look for Listen online link and click it.


    This action should open the station''s streaming feed. If your machine supports
    this feed, it will play automatically.


    If you keep running into stations that your media player won''t support, you need
    to add some software. See the section “Watchin'' Movies!'' later in this chapter
    for how to add Mplayer.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_285_0.png)


    # Listening to downloaded music


    Downloading music off the Internet is a fun activity. A lot of people like to
    pretend that it''s both legal and ethical, when in fact it''s often theft. I leave
    that ethical issue between you and your belief system of choice, but my mine ethics
    says that it''s theft, I''m going to focus on showing you music that you''re welcome
    to download. Legally and ethically! Take a look at strategies for finding such
    music, along with how to listen to it.'
  merge: -1
  pgno: 285
- img_proc: true
  md: '# Chapter 15: Multimedia Wow!


    One place to find such material is on a band''s own Web site. Many groups today
    realize that offering free downloads of their work is a great PR move — if people
    love the sample songs, they''re more likely to go out and buy the album. For an
    example, I use one of my own favorite bands, Evanescence (www.evanescence.com/).


    Evanescence, like many other bands, has its page done mostly with Macromedia''s
    Flash tool. Mozilla will tell you that you can''t view the content without the
    right plug-in, so Evanescence, like many other bands, has its page done mostly
    with Macromedia''s Flash tool. Mozilla will tell you that you can''t view the
    content without the right plug-in, so first you''ll have to get the plug-in in
    Flash. To download and then install this plug-in, perform the following steps:


    +   1. Point your browser to http://macromedia.mplug.org.

    2. Click the link that best represents your physical location.

    This takes you to the Macromedia site with the latest versions of their Flash
    player, in the most friendly formats available.

    3. Click the flash-plugin link next to Fedora Core 1.

    A Save As box opens.

    4. Navigate to your preferred save location and then click Save.

    The file downloads.

    5. Open a command line terminal.

    6. Use the cd command to go to the directory where you stored the file.

    7. Use the su command to go in root access.

    8. Type rpm -ivh filename.

    If you receive an error, you may need to install an RPM from your DVD or CD called
    compat-libtdc++. You can install this library by typing yum install compat-libtdc++
    and pressing Enter.

    9. Choose your browser and then relaunch.


    +   10. Browse to www.evanescence.com.

    If the plug-in doesn''t load, choose the site version that doesn''t rely on the
    particular plug-in in question (if there''s one available).


    Now, to see whether you can listen to any music here, click the Music link. The
    songs are in the Flash window on the left. you have the option of clicking real
    for RealPlayer, windows for Windows Media Player, or lyrics to see the words for
    this song.'
  merge: -1
