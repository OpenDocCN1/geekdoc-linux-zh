  md: '# Chapter 17: Adding Software to Linux


    have etcbackup.tgz in your home directory, when you unpack you end up with the
    directory ~/etc, containing the entire archive''s contents.


    If you''re not sure about the file''s internal structure, you can check by typing
    tar tvf filename.tar | more.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_328_0.png)


    You can also use the shortcut tar -xvfz etcbackup.tgz and skip using gunzip.


    # bzip2, the gzip alternative


    There''s a new kid on the block when it comes to compressing files in Linux. That
    kid is bzip2. You use this program exactly the same way you use gzip, except that
    its files have the extension .bz2. To compress mysong.mp3 using this (usually)
    more efficient program, you type bzip2 mysong.mp3 and get the file mysong.mp3.bz2.
    To uncompress it, you use bunzip2, so you type bzip2 mysong.mp3.bz2.


    You can also use this command in conjunction with tar to create files in .tar_bz2.
    I haven''t seen any “B-Balls” with a .tbz2 extension yet, but I suppose it''s
    only a matter of time.


    # Revving Your RPMs


    For a long time, keeping track of what was installed on your Linux machine was
    a bit of a nightmare. Problems cropped up especially when the time came to install
    new software. If a program relied on a specific version of another tool to be
    installed and didn''t work because you didn''t have that tool, you could spend
    ages trying to figure out what the problem was.


    Red Hot to the rescue The folks at Red Hat Linux wrote the Red Hat Package Manager
    (RPM), and number of other high-profile Linux distributions now include this.
    You can tell that it''s meant for use with the package manager by its .rpm extension.
    What makes RPMs so special? An .rpm file contains more than just the package itself:
    This type of file also holds information about the package it contains, which
    other packages it depends on, and more.


    When you install an RPM (or when the installer adds during the installation process),
    the additional package information is added to a central RPM database. Your system
    knows exactly which software you have, which packages are dependent on which other
    packages, and other information.'
