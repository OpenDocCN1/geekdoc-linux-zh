  md: '# # Chapter 14


    # # Word Processing and More with OpenOffice.org


    **In This Chapter**


    +   - Installing the OpenOffice.org suite

    - Word processing with OpenOffice.org Writer

    - "Spreadsheets" with OpenOffice.org Calc

    - Presenting with OpenOffice.org Impress

    - Drawing with OpenOffice.org Draw

    - Formulating with OpenOffice.org Math


    > Words fly, writing remains.

    — Spanish proverb, from *Dictionary of Proverbs*, by Delfín Carbonell Basset


    These days, just about everyone who has a computer has at least one office suite
    at their fingertips. If they''re Microsoft Windows users, this suite is probably
    Microsoft Office, although it may be another worthy contender, as Corel WordPerfect
    Office. Undoubtedly, everyone has told you that the biggest problem with Linux
    is a lack of software: “It has no good office suites,” for example.


    I have good news for you. They''re wrong. A number of office suites are available
    (see the “Tip” below) but what I cover is the one that has gobbled up market share
    like nobody''s: OpenOffice.org. This suite comes with Calc (a spreadsheet), Draw
    (diagrams and figures), Impress (for presentations), Math (a word processor for
    writing mathematical formulas), and Writer (for word processing).


    After figuring out how to use one of the programs in this suite, you may be happy
    to find that the others are designed in the same fashion. Menus and features work
    across each of the programs. You can even save files in Microsoft format, if you
    need to share them with people using it — and you can edit the ones you send to
    you too.'
  merge: -1
  pgno: 244
- img_proc: true
  md: '# 224 Part III: Getting Up to Speed with Linux


    That''s enough about OpenOffice.org. Let''s actually use it!


    Other suites available for Linux users are the OpenOffice.org relative StarOffice
    (www.sun.com/staroffice), Anywhere Office (www.vista source.com/products), KOOffice
    (www.koffice.org), and GNOME Office (http://www.gnome.org/gnome-office/).


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_245_0.png)


    # Installing OpenOffice.Org


    Many distributions install this office suite by default, but that doesn''t mean
    it''s already on your system. Before you start the huge download unnecessarily,
    see whether you already have OpenOffice.org installed:


    +   - In Fedora Core 1: Look at your Panel. If the OpenOffice.org Writer, Impress,
    and Calc icons discussed in Chapter 6 are not there, you don''t have OpenOffice.org
    installed.


    +   - In Mandrake Linux 9.2: Choose Main MenuOffice->Wordprocessors and see whether
    any OpenOffice.org items are listed. If not, you have it installed.


    +   - In SuSE Linux Professional 9.0: Choose Main MenuOffice and see whether Office
    Suite is listed. If not, OpenOffice.org isn''t installed.


    If you don''t have OpenOffice.org installed, you can do so by using your distribution''s
    package-management tools (see Chapter 17). If you can''t stand the thought of
    not having the latest version, you can start up for any of the OpenOffice.org
    applications (OpenOffice.org Writer, for, for example) and choose Help->About
    OpenOffice.org to see which version you have. Then, point your Web browser to
    www.openoffice.org. The latest version is mentioned on the front page. If this
    version isn''t what you have and want the latest one, read the following section
    to find out how to proceed.


    # Getting the software


    To acquire OpenOffice.org from the Web, follow these steps:


    +   1. Open your favorite Web browser.

    The default browser in Fedora Core is Mozilla.


    +   2. Go to the URL www.openoffice.org.

    It''s the home page for the OpenOffice.org project.


    +   3. Click Downloads to open the OpenOffice.org downloads page.

    Note that this Web site changes frequently, so don''t be surprised if its organization
    has changed since the time I wrote this.'
  merge: -1
  pgno: 245
- img_proc: true
  md: '# Chapter 14: Word Processing and More with OpenOffice 225


    +   4. Click the Software and Information link to jump to the New Software Items
    section.


    +   5. Click the OpenOffice.org version selection.


    This action takes you to the OpenOffice.org version Download Sites section.


    +   6. Locate the subsection labeled The Application.


    +   7. Click Linux.


    This action opens the location selector. (Did you notice that you can get this
    office suite for other operating systems too?— even Windows!)


    +   8. Look within the table for your particular country.


    The Linux section is the center column.


    +   9. Click one of the download server choices offered for your country or the
    nearest country.


    If you have problems with this server, try another one within your country or
    a nearby country. Try to stay at least on the same continent.


    +   10. When the Downloading dialog box opens, select where you want the file
    to go and then click Save.


    I typically create in my home directory a directory named Downloads and put all
    my new software in there. After you click Save, the Download Manager dialog box
    opens. It tells you how much of the file you have downloaded, how long this download
    should take. OpenOffice.org is a huge file. Even if you''re on broadband, it takes
    more than ten minutes to download. In the meantime, feel free to browse elsewhere
    on the Web or read further into this book.


    After the download is complete, proceed to the following section.


    # Installing the software


    After you have OpenOffice.org downloaded, you need to unpack the software and
    run the automated installation program, as outlined in the following steps:


    +   1. Open the File Roller.


    Choose Menu ❖ Accessories ❖ File Roller.


    +   2. Click Archive, and then browse to the directory containing the software
    you just downloaded.


    The Open Archive dialog box opens. Browse as you would in any other GUI file manager.


    +   3. Select the file you want to uncompress, and then click OK to access the
    package''s contents.'
