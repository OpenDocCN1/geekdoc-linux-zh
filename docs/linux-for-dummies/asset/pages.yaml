  md: "# Chapter 14: Word Processing and More with OpenOffice.org 243\n\n# Using the\
    \ AutoPilot Presentation wizard\n\nThis discussion of OpenOffice.org Imp gives\
    \ me a good chance to introduce you to AutoPilot. When working on any document\
