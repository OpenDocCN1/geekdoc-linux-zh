    # Software holes


    When someone is already in your system — whether or not''re allowed to be there
    — you have additional security concerns to keep in mind. One of these involves
    what software you have on the machine. Believe it or not, each piece of software
    is a potential security hole. If someone can get a program to crash in the right
    way, they can get greater access to your system than they should. It''s a very
    bad thing!


    One way to close software holes is to remove all programs you don''t need. You
    can add them later, if necessary. How exactly this task depends on the package-management
    scheme your distribution runs. The following steps work at the command prompt
    in Red Hat and all other distributions that use RPM.


    To remove all programs you don''t need, follow these steps:


