    Most environment variables are established for you by the system administrator
    or perhaps the shell itself. These variables are mostly read by programs, and
    you don''t need to change their variables. However, you may want to alter the
    value of some environment variables. For example, in Table 11-1, the first entry,
    HISTSIZE, Determines the number of lines of command-line history that are kept
    on file. You may remember the discussion, earlier in this chapter, of re-executing
    a command from yesterday (refer to the section "Accessing your command history"
    earlier in this chapter). By setting a higher number for HISTSIZE, you can save
    an even longer list of previously executed commands.


    # # Storing and retrieving variables'' values


    To assign a value to a variable, you just use the variable name followed by an
    equals sign (=) followed by the value to store:


    ```

    VariableName=Value

    ```


    To retrieve the value being represented by that variable, you need to precede
    the variable name with a dollar sign ($). Look at a variable, created by the shell,
    that determines what your prompt looks like. This variable is named PS1. First,
    you view the value being held by PS1:


    ```

    echo $PS1

    ```


    You likely see something like the following line:


    ```

    \[u@\ \W\$

    ```


    Each of the characters preceded by a backslash represents a special instruction
    to the shell to return specific information when the shell is referenced. See
    Table 11-2 for examples of special slash-characters you can use in customizing
    your prompt.'
