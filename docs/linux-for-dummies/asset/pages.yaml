  md: '# Chapter 10


    # # Manipulating Files and Directories


    **In This Chapter**


    +   - Encountering Linux file types

    - Managing Linux file permissions

    - Maneuvering through the file system

    - Working with file system contents

    - Referring to multiple files at once using wildcards


    > There is no need to do any homework at all. After the first four years, the
    dirt doesn''t get any worse.


    > —Quentin Crisp


    There''s no avoiding it. At some point, you have to work with the files and directories
    in your system. Fortunately, after you get familiar with the rules and commands,
    you feel more comfortable (even if you find yourself being reminded from time
    to time of working in good old MS-DOS). Because many people find that working
    at the command line is easier when dealing with files, in this chapter I cover
    both the typed commands and the graphical tools you have at your disposal.


    # # Comprehending File Types


    You find lots of different file types out there in the Linux world. By types,
    I''m not referring to extensions, such as .exe or .doc. Linux sees everything
    within its file system — even directories — as "files." As a result, assigning
    a type to a file is merely a Linux machine''s way of keeping track of what''s.
    In the following sections, I show you how to see what''s in your file system,
    describe each of the file types used in Linux, and explain how to figure out what
    type you''re looking at.'
  merge: -1
