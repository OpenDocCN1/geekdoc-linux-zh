  md: '# Chapter 16


    # Checking Out the Linux

    File System


    +   **In This Chapter**

    * Discovering the root directory and subdirectories

    * Discerning partitions from directories

    * Adding removable media to the file system

    * Caring for your file system

    * Accessing shared files on Windows computers


    > I have an existential map. It has “You are here” written all over it.

    > —Steven Wright


    One of the most frustrating things about learning a new operating system can be
    figuring out where it keeps files. Rather than keep all important system files
    in a single directory, such as the C:\Windows directory in Microsoft Windows,
    Linux follows the lead of its Unix cousins and spreads out a bit more. Although
    the Linux and Windows setups involve different methods, they are both logical.
    They also require that you understand where to look.


    Another issue you come across is adding new media— hard drives, floppy disks,
    CD-ROMs, DVD-ROMs, zip disks, USB keychain and thumb drives, and more— to the
    existing file system. In this chapter, I focus on how the file system is organized
    and other handy topics, such as how to access data on the floppy disk.


    # Introducing the Linux File System


    Linux may be all by itself on your hard drive, or maybe it''s sharing your hard
    drive with another operating system, such as Microsoft Windows. All the hard drive
    space you allocated for Linux during the installation process is'
  merge: -1
  pgno: 306
- img_proc: true
  md: 'your Linux file system. Because you''re running your own Linux machine, you
    must be familiar with how it''s put together — especially the sections that are
    dangerous to mess with!


    The Linux file system is deeply layered; it consists of lists of directories and
    subdirectories. Most of the internal information in an operating system, as Microsoft
    Windows, is hidden away in the Windows directory. In Linux, however, this information
    is scattered around a bit wider and for good reason: Lots of files are involved!
    After you come to understand Linux, however, you will see that it maintains a
    logical order to where it keeps things.


    # Meet the root directory


    Everything in the Linux file system is relative to the root directory, which is
    referred to as / and is the file-system base, a doorway into all your files. The
    root directory contains a mostly predictable set of subdirectories. Each distribution
    varies slightly, but certain standards exist to which they all conform. The standards
    keep us all sane.


    Rather than flood you with everything at once, I start by talking about just the
    items that are really off. Table 16-1 lists standards and some of the more common
    extras. An asterisk (*) at the end of a description indicates that you shouldn''t
    mess with this directory unless you have a specific reason because it contains
    files that are very important to the functioning of your system.


    | Table 16-1 Standard / Contents in Linux |

    | Directory | Standard that everyone needs to use at any time* |

    | /bin | The commands that everyone needs to use at any time* |

    | /boot | The information that boots the machine, including your kernel* |

    | /dev | The device drivers for all the hardware that your system needs to interface
    with* |

    | /etc | The configuration files that your system and many of its software packages
    use* |

    | /home | The home directories for each of your users |

    | /lib | The code that many programs (and the kernel) use* |'
  merge: -1
  pgno: 307
- img_proc: true
  md: '# Chapter 16: Checking Out the Linux File System 287


    | Directory | Contains |

    | /mnt | The spot where you add temporary media, such as floppy disks and CD-ROMs
    |

    | /opt | The location that many people decide to use for installing new soft packages,
    such as word processors and office suites |

    | /root | The superuser''s (root user''s) home directory |

    | /sbin | The commands the system administrator needs access to*

    | /tmp | The place where everyone stores everything temporary files |

    | /usr | The programs that machines can share between them |

    | /var | The data that changes frequently, such as log files and your mail |


    Some of these directories have some equally important subdirectories, so I dig
    a bit deeper now.


    # Meet the /etc subdirectories


    Although the exact subdirectories that exist in /etc can change from distribution
    to distribution, the following two are fairly standard:


    +   - The /etc/X11 directory contains configuration details for the X Window System
    (X), which runs your Graphical User Interface (GUI). See Chapter 12 for more on
    the GUI.

    - The /etc/opt directory contains configuration files for the programs in the
    /opt directory, if you decide to use it.


    # Meet the /mnt subdirectories


    You may or not have any subdirectories in /mnt by default. Typically, however,
    you have at least the following:


    +   - The /mnt/floppy directory is used for adding a floppy disk to your file
    system.

    - The /mnt/cdrom directory is used for adding a CD-ROM to your file system.


    In the " Media to Your File System" section, later in this chapter, I show you
    how to add these items.'
  merge: -1
  pgno: 308
- img_proc: true
  md: '# 288 Part IV: Sinking Your Teeth into Linux


    # Meet the /usr subdirectories


    The /usr directory is often referred to as its own miniature file system hierarchy.
    This directory has lots of important or interesting subdirectories, as shown in
    Table 16-2. An asterisk (*) at the end of a description indicates that you need
    to leave that directory alone unless you have good reason to change with it —
    after you gain lots of experience with Linux and know exactly what changes you
    need to make — so that you don''t accidentally alter your system in order to function
    correctly. An important thing to remember about this segment of the file system
    is that many Linux users often use /usr to store programs that can be shared with
    other machines.


    | Table 16-2 Standard /usr Subdirectories |

    | Subdirectory | Contents |

    | /usr/X11R | The files that run the X Window System* |

    | /usr/bin | The commands that aren''t essential for users but are useful* |

    | /usr/games | The games that you install on your system, except for those you
    can choose to place in /opt |

    | /usr/include | The files that the C programming language needs for the system
    and its programs* |

    | /usr/lib | The code used by many of the programs in this /usr subhierarchy*
    |

    | /usr/local | The programs and other items that you want to keep locally, even
    if you''re sharing everything else in /usr |

    | /usr/sbin | The commands that aren''t essential for administrators but are useful*
    |

    | /usr/share | The information that you can use on any Linux machine, even if
    it''s running incredibly different hardware from what this one is running* |

    | /usr/src | The source code that you use to build the programs on your system
    |


    # Partitions versus Directories


    One very important thing you must understand about the Linux file system is that
    it may not all be on one single hard drive or hard drive partition. If you'
  merge: -1
  pgno: 309
- img_proc: true
  md: 'have dealt with this point during the installation, you probably already know
    it. But maybe you have sidestepped this issue by using one of the installation
    methods that does things for you automatically.


    What is really liable to confuse people is partitions and directories tend to
    blend together. In the Microsoft Windows world, if you use separate drives or
    partitions, you have a specific letter designation for each one. The primary hard
    drive is C, the next is D, and so on. Under Linux, each of these drives and partitions
    quietly blends together.


    If you partitioned your hard drives on your own, you know that you need to specify
    a mount point — which is like an empty spot in a puzzle, where the outside partition
    or media can be plugged into the rest of the file system — for each partition.
    In the case of a hard drive partition, the mount point isn''t in the /mnt part
    of the file system. It''s in the root directory — maybe /boot or / or /usr. You
    literally attach permanent items, such as hard drives and partitions, right into
    the file system. Linux doesn''t want to know or cares about whether the directories
    or files are all on one drive or on multiple drives. It just wants to do its thing.
    Don''t worry: You do have reliable designations that are related to 3 in the scheme
    of hardware you can find your drive. See Table 16-3 for a breakdown of popular
    designations.


    | Designation | Description |

    | --- | --- |

    | /dev/cdrom | CD-ROM drive |

    | /dev/fd0 | Floppy drive 1 |

    | /dev/fd1 | Floppy drive 2 |

    | /dev/hda | First IDE hard drive |

    | /dev/hda1 | First IDE hard drive, first primary or extended partition |

    | /dev/hda2 | First IDE hard drive, second primary or extended partition |

    | /dev/hdb | Second IDE hard drive |

    | /dev/hdb1 | Second IDE hard drive, first primary or extended partition |

    | /dev/hdb2 | Second IDE hard drive, second primary or extended partition |

    | /dev/sda | First SCSI hard drive |

    | /dev/sda1 | First SCSI hard drive, first primary or extended partition |'
  merge: -1
  pgno: 310
- img_proc: true
  md: '# 290 Part IV: Sinking Your Teeth into Linux


    Linux see USB devices as SCSI devices. After you plug in your USB keychain or
    thumb drive, you can add it to the filesystem with the designation /dev/sda1.


    You probably see a pattern by now. A hard drive has a three-letter designation:


    +   - An IDE drive''s designation starts with /dev/hd, the first drive of your
    type is a, the second is b, and so on. The third IDE drive looks like this: /dev/hdc.

    - A SCSI drive''s designation starts with /dev/sd, the first drive of your type
    is also a, the second is b, and so on. The third SCSI drive looks like this: /dev/sdc.


    The number that follows the three-letter designation represents your partitions.
    I cover partitioning your hard drive in Chapter 2.


    In Figure 16-1, I break down this concept, hopefully making it a bit more accessible.
    In this case, the user created three partitions for Linux. The first IDE drive
    is a single partition, allocated for the root partition. The second IDE drive
    is broken into two partitions. The first was given /usr; and the second, /var.


    | | Linux |

    |---|---|

    | A: Floppy | /mnt/floppy Floppy |

    | B: CDROM | /mnt/cdrom CDROM |

    | First IDE drive | C: | /dev/hda1/ | First IDE drive |

    | Second IDE drive | D: | E: | /dev/hdb1/usr | /dev/hdb2/var | Second IDE drive
    |

    | First partition | Second partition | First partition | Second partition |


    **Figure 16-1:** Linux versus Windows in handling partitions and hard drives.


    If you move around the file system, you can''t tell of which directories are on
    which drive. The prompt, doesn''t change based on which drive each directory is
    on; the commands used for moving around the file system don''t care about the
    underlying hard drive or drives.'
  merge: -1
