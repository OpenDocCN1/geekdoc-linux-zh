  md: '# 170 Part III: Getting Up to Speed with Linux


    # Reading a long file listing


    A long format file listing (ls -l) is quite easy to read after you get a handle
    on each of the elements within it. I go through the following example — line by
    line — in the following sections:


    ```

    total 20

    drwx-xr-- 2 dee dee 4096 Jul 29 07:48 .

    drwxr-xr-x 5 root root 4096 Jul 27 11:57 .

    -rw-r--r-- 1 dee dee 24 Jul 27 06:50 .bash_logout

    -rw-r--r-- 1 dee dee 230 Jul 27 06:50 .bash_profile

    -rw-r--r-- 1 dee dee 124 Jul 27 06:50 .

    -rw-r--r-- 1 dee dee 0 Jul 29 07:48 lsfile

    ```


    # Line One


    ```

    total 20

    ```


    The first line specifies how many blocks (a unit of file system usage) the files
    in this directory use.


    You can find out how large the blocks are on a particular partition by typing
    dump2fs -h partition, where partition is the device information for that part
    of the directory. To get the list of partitions on your system, you type df. For
    an example, you can type dump2fs -h /dev/hd1 for the first partition on your first
    IDE hard drive.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_191_0.png)


    # Line Two


    ```

    drwx------ 2 dee dee 4096 Jul 29 07:48 .

    ```


    The first letter is a d, so it immediately tells you that this entry is a directory.
    Now, move to the permissions. Only the first triad has anything turned on its
    owner, so the owner (that''s d) is allowed to view the contents of the directory
    (thanks to the r), write to files in the directory (thanks to the w), and run
    programs in the directory (thanks to the x). No one in the group (including dee),
    can do any of these tasks in /home/dee. After this entry is case 2. Then you have
    the user who owns this item, dee, and the group that owns this item, also dee.
    Next is the size (directories often show 4096 bytes, but can be larger if the
    directories contain a large amount of data). Then comes the creation or last date
    and time. Last, you see the item name. This period, which stands for the current
    directory, so the first entry tells you about /home/dee itself.


    # Line Three


    ```

    drwxr-xr-x 5 root root 4096 Jul 27 11:57 .

    ```


    Once again, the first letter is a d, so you''re looking at a directory. As for
    the permissions, the first triad refers to the root user, who has all three (rwx)'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# Chapter 10: Manipulating Files and Directories


    enabled, so that root can do anything she wants to do in /home. The second triad
    is r-x, so anyone in the group (also root, in this case) can read the contents
    of /home and execute programs in there. The third triad is identical to the second,
    the same rules apply to everyone else. This item has links, and it''s owned by
    the user root and the group root. After the size and creation/modification date
    and time comes the name of the item. . stands for directory above this, so the
    second entry tells you about /home.


    Okay, the root user can do anything she wants in the Linux file system. If you''re
    using a Red Hat Linux-distribution such as Fedora Core, every user has her group
    with same name as the user account; other distributions, such as SuSE, have all
    assignments assigned to the group.


    # Lines Four, Five, and Six


    ```

    -rw-r--r 1 dee dee 24 Jul 27 06:50 .bash_logout

    -rw-r--r 1 dee dee 230 Jul 27 06:50 .bash_profile

    -rw-r--r 1 dee dee 124 Jul 27 06:50 .bashrc

    ```


    Now you get to the files, which you can recognize by the dash (-) as the first
