  md: '# Installing and Using Wine


    And there''s Wine (www.winehq.org), a complete rebuild of Microsoft Windows 98
    functionality that runs under Linux. Wine is in many ways the everything in the
    previous section. However, it''s a free and very complicated project, it''s not
    quite as friendly as the commercial versions. It''s kind of the others but with
    all the makeup and hairrspray removed.


    Some Linux distributions offer Wine RPMs directly on their installation CDs. If
    yours doesn''t, you can get an RPM from http://sourceforge.net/project/showfiles.php?group_id=6241,
    which you can find by following the Wine download links for. Locate your distribution
    in the list and then get the latest RPM for that distribution. It may take a while
    for the download to complete. This is an entire re-implementation of Microsoft
    Windows after all!


    After you have the file downloaded, access a command line terminal and use the
    su command to make the root user. Then, type rpm -ivh wine[TAB] (where [TAB] means
    you press the Tab key) to install the program.


    You''ll probably find useful to return to the Web site soon, at www.winehq.org/site/docs/wine-user/index.
    This is where the Wine documentation is.


    The first thing that you must do before you are able to use Wine is, of course,
    configure it. Fortunately, graphical tools are available to help you out. On the
    same page where you downloaded the main package, go to the bottom and find winesetup
    RPM. Download this and install it as root. Then type exit to return to being a
    normal user and type winesetup to start the tool (See Figure 15-20).


    Stick with the defaults until you reach the Look and Feel section. Then you''ll
    probably want to choose Windows 98 so you don''t feel like you''ve completely
    returned to the Stone Age! Click Finish and the tool will do its thing, setting
    up everything necessary for Wine to do its job.


    Now comes the fun part — trying to run your old Windows software. You don''t really
    run Wine, but Instead, first install the Windows software you want to run and
    then invoke Wine whenever you need to use something from the Windows world. To
