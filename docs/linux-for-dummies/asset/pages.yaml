  md: '# Part III: Getting Up to Speed with Linux


    # Moving through the file system


    Linux has two commands you may find useful for moving around in the file system.
    The first of these lets you see exactly where you are. You may think that you
    wouldn''t need a command like this unless your location is obvious? After all,
    Many Linux distributions, however, have the habit of giving you a prompt like
    the following:


    ```

    $dee@myhost dee$

    ```


    This prompt tells you that your login name is dee, and that the machine you''re
    on is myhost. The directory you''re in, however, is /home/dee, not just dee. Linux
    uses this format mostly because the full location can get pretty huge: A prompt
    showing the path can take up half the line or. To see exactly where you are, type
    pwd.


    You move through the file system with the cd (change directory) command. If you''re
    in the /home/dee directory and you want to go to the temporary directory (/tmp),
    you type cd /tmp.


    Another thing you need to be aware of — and that can save you lots of typing —
    is that you can change file system locations in two ways:


    +   **Type the thing.** If you''re in /home/dee and you want to switch to the
    subdirectories files, you can type cd /home/dee/files. You have another way to
    do it, though.


    +   **Type a relative location.** If you know where you are and you want to go
    relative to where you are, you can use the *relative* location rather than type
    the whole thing. For example, to switch to the files subdirectory of /home/dee
    from inside /home/dee, you can just type cd files. The cd command understands
    you''re already in /home/dee, so it looks for the files directory inside.


    Maybe you''re logged in as root and checking up on a few different directories.
    You''re in /home/dee and you want to go to /home/raph. You can either type cd
    /home/raph or cd ..raph. Remember that the .. always refers to the directory that
    contains the one you''re in. Using ..raph tells the cd command to back up one
    directory (into /home) and then move forward to root.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_181_0.png)


    Just want to change your own home directory? Type cd ~ and get there immediately!
    In fact, you can just type cd with nothing else if you want. If you want to change
    to your own text subdirectory (maybe it''s /home/raph/text), you could type ~/text.'
  merge: -1
