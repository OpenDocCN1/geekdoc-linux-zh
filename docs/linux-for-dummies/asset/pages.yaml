    # Other preferences


    Other preferences you may want to check out before you start Mozilla include


    +   Privacy & Security:** Network security has become a very big issue for everybody
    connected to the Internet. Although the typically nontechnical media often sensationalizes
    this issue, security should still be a consideration for all users of the Internet.
    Every time you send an e-mail or click a Web site, you''re exchanging information
    across a network. Although you don''t need to sleep over it, you should be conscious
    of every request you make on the Internet. Even though completely securing your
    information is impossible, you can feel reasonably safe that your exchanged internet
    information is safe because of the default options that Mozilla provides. The
    Popup Windows section (Figure 8-5) for how to keep these annoyances from cluttering
    your screen.


    +   Advanced:** This category provides options that affect the entire Mozilla
    user environment. Options include whether you want to enable Java applets or XSL
    Web pages. This area is also where you can flush your cache and establish your
    proxy settings:


    +   - **Cache:** Visiting a site entails establishing a network connection with
    the site and downloading the Web document and included images for viewing on your
    browser. Browser *caches* (stores) this on your local hard drive. By doing so,
    your browser doesn''t have to retrieve the same information from the Internet
    again and again for sites you frequent. This option enables you to set limits
    on this local storage space. You can also manually clear your cache here.'
