    | -y | Answers Yes to all questions regarding whether things should be fixed |


    # Leaving spare room


    One of the most insidious problems that all computer users run into time to time
    is a lack of disk space. The scope of this problem really depends on a number
    of things. The primary issue is that, if your root partition becomes 99 or 100
    percent full, you need to use emergency rescue techniques (refer to Chapter 5)
    to boot the machine and clean it out. That''s no fun, is it?


    In the beginning, you''re probably not in danger of filling the drives, unless
    you barely had enough room to install Linux in the first place. However, over
    time, you may forget about watching the drives for remaining space. Even experienced
    administrators run into this problem, so certainly you do too! Save yourself the
    worry and make sure that you know how to get regular updates about how full your
    partitions are. To access the drive updates, follow these steps:


    +   1. Log in to the account you tend to use the most.

    2. On the icon bar, click the Menu button.

    3. Choose Accessories Text Editor.

    The text editor displays the contents of your home directory.

    4. Click the Open button. In the Selection field, type .bash_profile and press
    Enter.

    The contents of the .bash_profile are displayed in the text editor window.

    5. Use the mouse or the arrow keys to place the vertical insertion bar on a blank
    line at the end of the file.'
