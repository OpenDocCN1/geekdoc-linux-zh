    triads for these are r--. Anyone in the dee group can view the contents of these
    files, and everyone on the entire system can too. Each file has only one line,
    a different size (in bytes) and was created at the same time — in the case, when
    the account itself was created. The names for these files are .bash_logout, .bash_profile,
    and .bashrc.


    # Line Seven


    ```

    -rw-r--r- 1 dee dee 0 Jul 29 07:48 lsfile

    ```


    This item is also a file. You can tell because the first character is a dash.
    Because its first two triads are identical (rw-), the owner (dee) and members
    of the group (dee) can both view the file''s contents and change them. Everyone
    else, can only read the contents the last triad is r--. Only one link exists,
