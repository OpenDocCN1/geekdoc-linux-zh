  md: '# Part III: Getting Up to Speed with Linux


    # Variables versus environment variables


    The first thing I need to make clear is that the bash shell has two classes of
    variables:


    +   - Variables: A variable can be referenced in a program or shell session, but
    it''s visible and available to only that session or program.

    - Environment variables: An environment variable can also be referenced by the
    shell or program. However, it has the added behavior of having its value copied
    to any other program or shell that is created from its environment.


    You can usually tell at a glance the difference between a variable and an environment
    variable in bash. The normal convention is to name local variables in all lowercase
    or in mixed-case characters. An environment variable, however, is usually always
    in uppercase letters.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_211_0.png)


    # Checking out commonly used environment variables


    The bash shell has many environment variables. You may be amazed at the range
    of items these variables store. The handy thing is, if something is stored in
    a variable, you can change it to suit your needs! In Table 11-1, I list the environment
    variables you are most likely to want to work with.


    | Environment Variable | Purpose | Value |

    | --- | --- | --- |

    | HISTSIZE | Determines the number of previously typed commands that are stored.
    | Number of commands |

