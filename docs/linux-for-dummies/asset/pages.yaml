  md: '# Chapter 19: Eleven Troubleshooting Tips 335


    What do you do from here? Anything you want. Surf through this book for commands
    you want to run. Type startx to start up the GUI.


    # # I Don’t Want to Boot into This!


    Are you booting into the command-line environment when you only want to use the
    GUI? Or, are you finding that you''re already booting into the GUI and you would
    rather boot to that nice, clean, black-and-white command-line screen? You''re
    not stuck with either of these options. You can change them at any time.


    # ## Changing your boot environment "permanently"


    The word *permanently* is in quotes in the heading because you can, of course,
    go back and change this later, if you want. *Permanently* just refers to the fact
    that you have made this change, every time you boot the system, it automatically
    goes into the preferred environment until you change it.


    To make this change, you need to edit what''s called a *runlevel*. I can''t be
    certain which Linux distribution you''re using, so I cover the most generic method
    for accomplishing this task:


    +   1. Log in as the root user.

    2. If you''re in the GUI, open a terminal window.

    3. Type ls /etc/inittab and press Enter.

    4. Type cp /etc/inittab /etc/inittabold to make a backup.


    The terminal window is typically offered as an icon on the Panel in both GNOME
    and KDE. It usually looks like a little computer screen.


    If this file exists, proceed to Step 4. If not, then it may be stored in a different
    location in your Linux distribution. Type *find / -name inittab* to hunt down
    where it is in your file system. If you track down inittab in a directory other
    than */etc*, be sure that you change the directory path appropriately for the
    rest of this sequence.


    Now, if something happens while you''re editing the *inittab* file, you can always
    restart fresh with the old version.'
  merge: -1
  pgno: 356
- img_proc: true
  md: '# 336 Part V: The Part of Tens


    5. Open the inittab file in your preferred text editor.


    Some Linux text editors are covered in Chapter 13.


    6. Scroll down until you find a line similar to the following:


    ```

    5:initdefault:

    ```


    This line appears near the top of the file. What you''re interested in here is
    the number. In most mainstream Linux distributions, the number 5 tells Linux to
    boot into the GUI, and the number 3 tells Linux to boot into the command line.
    In the preceding example, therefore, I boot into the GUI.


    7. Change the number in this line.


    If it''s a 5, change it to 3, and vice versa. Make sure that all colons and other
    items are left properly in place, or your machine will have problems booting loader.


    8. Save and exit the file.


    The changes go into effect the next time you reboot the system.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_357_0.png)


    If you end up having problems booting the system, in current Linux distributions
    (including the one that comes with this book) your installation can be used as
    an emergency boot disk. Check your documentation for information about the distribution
    you''re using if it''s not Red Hat 10.


    # Changing your boot environment just for now


    At any time, you can have your Linux box switch between full command-line mode
    and GUI mode. The instructions I give here assume that you''re using one of the
    mainstream Linux distributions that have a runlevel of 3 for the command-line
    mode and 5 for the GUI. Type `runlevel` on the command line: If you see a 3 or
    a 5, you''re fine, but if you see any other number, check your distribution''s
    documentation to find out which runlevel corresponds to the full command-line
    session with networking and which is for the full GUI session.


    To switch between modes, do the following:


    +   - To change from the GUI login to the command-line login, open a terminal
    window and type (as root) `init 3`.


    +   - To change from the command line login to the GUI login, type (as root) `init
    5`.'
  merge: -1
