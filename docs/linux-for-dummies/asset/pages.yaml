  md: '# # Chapter 6


    # # Dip in Those Toes


    +   In This Chapter

    * Checking out the faces of Linux

    * When to use and not use root

    * Setting up to print

    * Configuration tools à la carte


    > > A bus station is where a bus stops.

    A train station is where a train stops.

    On my desk, I have a workstation. ...


    —Steven Wright


    One of the great things about Linux is that you can customize the environment
    to fit your needs and your style. You can choose to use a "standard, out-of-the-box"
    look, or you can be unique. Whichever way you decide to go, you can always go
    back to the original settings or choose a different look.


    A base, or typical, Linux installation provides you with an elegant and capable
    system that certainly give you all the necessary elements you need for work or
    for fun. However, you may want to explore the various configuration options and
    tools to mold Linux to your personal preferences and needs.


    In this chapter, I provide an overview of common configuration options — from
    system-level configuration to customizing individual user environments. Modular
    design, one of the great strengths of Linux, enables you to customize your system
    in any way you want and for any computing need. Along the way, I point into the
    dark corners of the file system, where the configuration files lurk. I also introduce
    you to helpful configuration tools so that you don''t have to get your hands dirty
    with these often cryptic files.'
