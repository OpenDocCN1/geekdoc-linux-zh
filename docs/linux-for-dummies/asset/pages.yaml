  md: '# Chapter 16: Checking Out the Linux System 293


    # # Formatting disks


    A floppy disk often comes as a blank slate or formatted for Windows or Macintosh.
    If the disk is a blank slate, no computer can use it for any-thing. No computer
    running any operating system can store data on a blank floppy disk. A disk must
    have a file system on it to store information within that file system''s format.
    That''s formatting a disk is all about: building a file system. You can either
    format a disk from the command prompt or use a GUI tool to do it. I cover both
    methods in case here you''re not using GNOME, KDE, or the graphical environment.


    # ## Formatting at the command prompt


    To format the floppy at the command prompt so that Linux can recognize it as a
    Linux disk, follow these steps:


    +   1. Place the floppy in the disk drive.

    2. Type this line:

    `mkfs2fs /dev/fd0`


    Technical information about the information being written to the disk scrolls
    past. After the light on the floppy drive turns off, you can either eject the
    disk or mount it onto the file system (as I discuss in the section “Adding media
    temporarily,” earlier in this chapter) and use it.


    # ## Formatting in GNOME


    To format a floppy in GNOME so that Linux can recognize it as a Linux disk, follow
    these steps:


    +   1. On the icon bar, click the Main Menu button.

    In default GNOME and KDE setups, the Main Menu button in the lower-left is a footprint
    in GNOME or a big K in KDE. If you installed Fedora Core 1, the Main Menu button
    is the Red Hat fedora icon in both GNOME and KDE.

    2. Choose System Tools: Floppy Formatter.

    The Floppy Formatter dialog box opens, as shown in Figure 16-2.

    3. Place the floppy disk in the floppy drive.

    4. Make sure that the File System Type drop-down list box is set to Linux Native
    (ext2). (Refer to Figure 16-2).

    5. Make sure that the Floppy Density drop-down list box is set to High Density
    3.5 (1.44 MB). (Refer to Figure 16-2.)


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_314_0.png)'
