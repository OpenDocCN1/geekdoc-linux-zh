    # Haggling with Permissions


    Take a look at some format file listings on your machine by typing -l within a
    directory. If you find yourself scratching your head, don''t worry. The "Comprehending
    File Types" section, earlier in this chapter, gives you a feeling for the first
    letter on each line, but nine more characters are attached to that item before
    you get to the next column. This group of nine is the set of permissions (also
    called a permission set) for the file or directory. Linux, Unix, and Mac OS X
    use permissions as a way of providing file and directory security by giving you
    the means to specify exactly who can look at your files, who can change them,
    and even who can run your programs. You need this capability when you have a bunch
    of different users on the same machine, networked to the world.


    # Checking out the triads


    Each permission set consists of three triads. Each of the triads has the same
    basic structure but controls a different aspect of what you can use. Consider
    the long format listing for /home/dee in the following code:'
