    | \# | Prints the number of commands you have used during the current shell session.
    |

    | \$ | Prints a $ for user accounts or a # for the superuser. |

    | \d | Prints the date in the following format: day month. |

    | \h | Prints the name of the machine you''re logged in to. |

    | \n | Moves down to the next line. |

    | \s | Prints bash for the bash shell. |

    | \t | Prints the time in 24-hour format. |

    | \u | Prints your username. |

    | \w | Prints the lowest current directory level. |

    | \W | Prints the entire current directory. |


    Okay, on with the example; to change your shell prompt to something more amusing,
