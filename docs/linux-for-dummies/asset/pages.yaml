  md: '# Part II: Internet NOW


    # Beware of devices posing as modems


    I try to save you from some frustration — and your computer from the rounded end
    of your ball-peen hammer. Many Linux newbies have become irritated by not being
    able to communicate with their internal modems. "After all," the newbie reasons
    "the same hardware worked when I was running Microsoft Windows."


    Well, here''s the story: Several years ago, hardware manufacturers developed a
    device, called a software modem, in an effort to reduce hardware costs. The idea
    was to trim some responsibility from the modem and relegate these tasks to the
    CPU through the operating system. The result was an inexpensive interface card
    that routed signals to proprietary software that operated only under Microsoft
    Windows. In short, these soft modems, also known as WinModems, are not really
    modems, but rather, are telephone cable interfaces to Windows.


    +   - The packaging refers to the device as a Win Modem or designates that it
    works with only Windows.

    - Windows recognizes your modem, but Linux doesn''t.

    - The model number shows you

    - The model number has a HCF, HSP-, or HSF- in front of it.


    The following list shows methods you can use to determine whether you have a software
    modem:


    In short, if you determine that you have a software modem, Linux simply doesn''t
    work with it. For the adventurous out, the Lin Modem project (linmodems.org) has
    successfully Linux writers to work with a few of these software modems. I encourage
    you to get involved in this type of project, if you''re so moved. These explorers
    drive the wonderful world of freedom software, which Linux is a prominent part
    of.


    The bummer in all this is, although you saved a few bucks by buying with a software
    modem, you most likely need a real modem to use with Linux (unless you have a
    LinMod).


    I strongly advise searching the modem-compatibility list to determine whether
    your modem is a good buddy with Linux. You can use the money you ultimately save
    in headache to buy a real modem.


    Don''t let high speed providers discourage you from using Linux with your services.
    Just because they don''t support Linux directly doesn''t mean that the technology
    doesn''t work with Linux. TCP/IP (the set of traffic rules for the Internet) was
    developed for the Unix operating system, from which Linux descends. The irony
    is that most broadband support provided by ISPs is for Windows, which was never
    intended for use such a network, less TCP/IP-network support for Windows was added
    to the software much later.


    If you have the luxury of dual-booting to Windows, your ISP can help you install
    your broadband connection, and then you can tinker with Linux connected as you
    have the time and inclination. I point to sites that can help configure your broadband
    connection in the section "Internet Connectivity 101," earlier in this chapter.'
  merge: -1
