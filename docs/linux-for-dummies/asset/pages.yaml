    # It''s all fun and games until something doesn''t work


    In a perfect world, the dial-up configuration steps in the preceding section would
    work 100 percent of the time. Red Hat has truly hidden all the mystery that has
    traditionally surrounded dial-up networking. Unfortunately, in many situations
    (mostly related to modems and hardware), a simplified configuration doesn''t work.
    If you cannot connect to the Internet after you followed these steps, I recommend
    that you access a copy of the Modem-HOWTO from the Linux Documentation Project
    (www.tldp.org). This written treatment is updated often and includes a wealth
    of information and reference resources for configuring your modem on a Linux computer.


    # Turning to TCP/IP


    > It''s a good thing.

    —Martha Stewart


    You can make it all the way to the Internet without one single mention of Internet
    Protocol (IP) numbers. This ease in configuration demonstrates the progress that
    renders Linux easier to use. However, TCP/IP is still humming away in the background,
    carrying digital information for you in all its complex and robust glory.


    Transmission Control Protocol/Internet Protocol (TCP/IP) is a set of rules for
    moving information from one point to another. These TCP/IP delivery rules are
    similar to the methods that a parcel service, such as UPS, use to move packages.
    Each package contains a label with a destination, return address, and content
    that is important to the sender or receiver. Using this address, the package carrier
    can make a decision about how to route the package. Each routing decision shuttles
    the package closer to its intended destination until it arrives. The network component
    that provides this routing information is known as, strangely enough, a router.'
  merge: -1
  pgno: 140
- img_proc: true
  md: '# 120 Part II: Internet NOW


    Every computer on a TCP/IP network requires a distinct IP number. You can use
    one of two methods — static or dynamic — to assign this number to your computer:


    +   **Static:** You assign a static IP when you configure the machine, and the
    number remains same until you change it. Servers and other computers that are
    required to continuously serve the network usually have static IP numbers. (Seasoned
    networking professionals usually administer static IPs.)


    +   **Dynamic:** Typically, dial-up Internet users or workstations that aren''t
    continuously logged in to the network use dynamic IP numbers. If your computer
    is configured to obtain an IP number dynamically, the computer requests an IP
    number from another network host computer configured as a *Dynamic Host Configuration
    Protocol (DHCP)* server has authority for range of IP numbers that it can assign
    as trusted computers. The DHCP server also provides other handy services, such
    as dishing out DNS, gateway, and routing information that you''re otherwise required
    to know and stitching all this information into those cryptic and sometimes elusive
    configuration files.


    You can be thankful, along with the dial-up networking tools provided with your
    Red Hat distribution, services your ISP provides, perform these geeky functions
    for you transparently.


    The IP number looks like this to your computer (remember that the computer stores
    information in the form of *ones* and *zeros*):


    ```

    11010011001010111101010100100

    ```


    Ouch — do your eyes hurt? Is this any better?


    ```

    1101001.1001010.11110101.011000100

    ```


    Hardly. What about this?


    ```

    209.148.245.100

    ```


    The last example is a decimal representation of the first binary example. It''s
    known as an IP number, and every computer on the Internet requires a unique one.


    The *IP number* is the mailing address for your information packages. Granted,
    the casual cybestrian doesn''t keep a list of friends'' IP numbers. Instead,'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# Chapter 7: Connecting to the Internet


    use more familiar names. The Internet uses an ingenious method, called the Domain
    Name System (DNS), to resolve names into IP numbers.


    A domain registrar is a company that provides the authority for the popular, top-level
    domains of .com, .org, and .net. By registering a unique domain with one of these
    designated organizations, you can become the authority for your own network domain.
    Linux also comes with a free software package, called BIND, that provides the
    tools you need to become part of the Domain Name System.


    # Putting IP to work on your network


    The ping command is akin to a submarine using sonar to detect other objects in
    the ocean. Sonar sends out a ping signal, which reflects off a hard surface. By
    measuring the amount of time between sending the ping and the ping''s return,
    the submarine''s engineer can determine whether an object is out there and how
    far from the submarine that object.


    The ping command in Linux provides information similar to what sonar provides.
    If you connect the Internet to be your ocean, you can determine, by pinging, what
    other network computers exist and also how long it takes for your ping to return.


    Another fun command is traceroute, which allows you to see all the routing points
    your package touches on its way to a destination. Simply type the command traceroute
    hostname. The hostname can be either a valid DNS name or IP address of a computer
    on the network. After a few moments, you receive a list of all computers between
    you and the designated hostname.


    The ping and traceroute utilities determine whether your network connection is
    working. Whereas ping reveals whether another network host is available, traceroute
    provides a trail to that host. For example, if your Web browser can''t seem to
    find a particular site, you can jump out to a shell prompt and run a traceroute
    command to the site to determine where the hol-up is.


    Latency, or the amount of time it takes for a signal to travel, on the Internet
    has little to do with physical distance. Rather, factors such as network traffic,
    bandwidth, and network hardware all contribute to a slow latency. These factors
    determine whether a ping to your neighbor''s computer takes longer than pinging
    a host at the South Pole.'
  merge: -1
  pgno: 142
- img_proc: true
  md: '# Part II: Internet NOW


    # Checking whether an address exists with ping


    To use the ping command in Linux, you must have an object in mind that you want
    to ping, which is usually another host computer that is connected to the network.
    You can ping an IP number of another host or a hostname if your DNS is working
    correctly.


    For example, you can ping the Yahoo! site. Jump to a command prompt and typing
    the following command:


    ```

    ping www.yahoo.com

    ```


    The ping line, as shown in Figure 7-5, provides information about what the ping
    is doing. If the host is unreachable, you receive a line that provides some useful
    data — namely, the last item on the line: time=. This number is the time, in milliseconds
    (ms), that it takes for the signal from your computer to get to the destination
    computer and return. Lower numbers are better. For an Ethernet, a ping time of
    1 ms to 3 ms is an acceptable response time from another machine on the same local
    net. For dial-up connections, expect somewhere around 150 ms. When you start seeing
    ping times climbing to 900 ms or higher, some serious network traffic likely sits
    between you and your target host.


    The ping command lets you know immediately whether a network is between you and
    the host that manages the Yahoo! Web site. Although these widely varying times
    may indicate a network problem, ping doesn''t provide much more information than
    that. To flush out more of the problem, you can use the traceroute command.


    # Tracking the path of your packets with traceroute


    The traceroute utility enables you to map the route that your IP packets are taking
    from your computer to their intended destination. Just because you may not be
    able to visit your favorite Web site doesn''t mean that the Web site is down.
    It might simply mean that a link along your route is down. A significant router
    or conduit going down (basically, crashing) is like traffic congestion on your
    morning commute because of a pile-up.'
  merge: -1
