    # # Putting Linux distributions in perspective


    Just so you know that I''m not using any special smoke and mirrors, here''s a
    description of the system I used to evaluate these distributions:


    +   - Intel Pentium III 450MHz processor (not exactly a fighter jet these days—not
    even a passenger jet)

    - 256MB RAM

    - 6GB IDE hard drive

    - ATI 128RT video adapter

    - PS2 mouse and keyboard


    In both systems I surveyed (Mandrake and SuSE), I elected to use the entire disk
    setup and choose to install the recommended software rather than get fancy with
    software selections. Essentially, I was after the fewest possible keystrokes,
    mouse clicks, and brain cycles to get Linux up and running on my system.


    Both Linux distributions proved exceedingly simple to install. In the past, Linux
    installation was fraught with partition pains and cryptic decisions, those days
    appear to be gone.'
