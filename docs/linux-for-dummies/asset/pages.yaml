  md: '# Part IV: Sinking your Teeth into Linux


    # NFS shared directory directory


    You first need to tell NFS to share the directory containing your music archive.
    You may want to make this its own partition, or even a separate hard drive, depending
    on how many users you actually have and how much space you expect them to use.
    I assume that the archive is in /home/bob/Music. Adjust the directory accordingly
    for your needs.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_319_0.png)


    Red Hat Linux offers a GUI NFS server configuration tool. See Chapter 17 for how
    to use the software management system to add it.


    To set up a shared directory, follow these steps:


    +   1. Log in to the machine with the music archive as root.

    2. Open the file /etc/exports in your preferred text editor.

    3. Type this as line:


    ```

    /home/bob/Music networkaddress(rw,root_squash)

    ```


    This is the Network File System (NFS) central configuration file. By default,
    it''s empty.

    This line ensures that the /home/bob/Music directory and all its subdirectories
    are sharable between all the computers in networkaddress. If the outside computers
    access this share, they can both read and write to their directories.

    The format of networkaddress is important here. It can be any one of the following:


    +   * A single full IP address: You can have a copy of this line for each individual
    machine if you want to allow it, rather than merge them into one line.

    * A single machine''s full name and domain information: This takes the form host.domain.extension.

    * All the machines in a domain: This takes the form *.domain.extension.

    * The entire network IP information: This takes the form network/netmask.


    Inside the parentheses, you set the rules for access. In this case, rw refers
    to read-write access so that both can play the music in the directory and save
    their own music files to it. The root_squash part means that root cannot use this
    shared directory. Although you can remove this item, you should leave it alone.
    The root account has lots of high-level permissions, and you want to limit its
    capability to move from one machine to another as much as possible.


    +   4. Save and exit the /etc/exports file.'
