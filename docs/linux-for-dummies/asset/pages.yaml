  md: '# 262 Part III: Getting Up to Speed with Linux


    Notice the white, right-facing triangles pointing to Show Advanced Disc Options
    and Show Advanced Track Options. You can click these to expand the amount of information
    displayed in the dialog box. After you''re finished entering the information about
    your CD, click Save to store the data.


    The button to the right of the Track Editor is Open Preferences. Clicking this
    brings up the dialog box shown in Figure 15-5. Here, you can tell the CD player
    how to behave when you start and end the program. After you make your changes,
    click Apply Change and then Close.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_283_0.png)


    # Listening to Internet radio


    Listening to radio stations in Linux is not always the simplest thing in the world,
    but thankfully, these days it''s not as hard as it is used to be. Because of various
    laws, patents, and licensing problems, some formats like MP3 are not always supported
    out of the box. The best way to see what you''re set up to support right now is
    to simply try and listen. After you''re sure that your sound is set up properly,
    you can try many Web sites with the Mozilla browser.


    +   **SHOUTCast** for finding links to thousands of online stations, at www.shoutcast.com/


    +   **Radio-Locator** for finding "regular" radio stations offering online versions,
    at www.radio-locator.com/


    The first place to try is SHOUTCast. This site is the most likely to work with
    a Linux system. When you find a station that you want to listen to, click the
    Tune In! button. Because this is probably your first time doing this, you receive
    a dialog box similar to that shown in Figure 15-6.'
