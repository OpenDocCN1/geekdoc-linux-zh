  md: '# Creating and modifying graphics with The GIMP


    The GIMP is a graphics program that''s considered in many ways equivalent to Adobe
    Photoshop. Many don''t consider The GIMP the friendliest program on the planet,
    but at the very least, it has enough features to keep you busy for weeks experimenting!
    To open The GIMP, access the main menu and then choose Graphics->Gimp.


    When you start The GIMP for the first time, you have to walk through its user
    setup routine:


    +   1. In the Welcome dialog box, click Continue.

    The Personal GIMP Directory dialog box opens.


    +   2. In the Personal GIMP Directory dialog box, click Continue.

    Before you proceed, if you''re curious, you can click on the various sub-directories
    and files that will be created during The GIMP setup process. Doing so gives you
    information about what each file and subdirectory is for. After you click Continue,
    the User Installation Log dialog box opens.


    +   3. In the User Installation Log dialog box, click Continue.

    The box instructs you to read through and look for installation errors. It''s
    worth a quick scroll-through, but I''ve never run into problems, especially on
    a package-managed system, such as RPM (see Chapter 17). After you click Continue,
    the GIMP Performance Tuning dialog box opens.


    +   4. Alter the value in the Tile Cache size text box if you want to restart
    how much memory The GIMP lets you take up.

    The default is just fine for most people, but if you work with large, heavily
    detailed images, you may need to raise the value. You can do this if you have
    a lot of RAM on your system (128MB or more). On the other hand, if you really
    work with small items, you can lower the value.


    +   5. If your home directory is on a drive without approximately 500MB of free
    space (a conservative value to be safe), change the value in the Swap Directory
    text box to another location, such as /tmp/username.'
  merge: -1
  pgno: 292
