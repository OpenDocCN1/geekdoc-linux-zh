- img_proc: true
  md: '# Adding Media to Your File System


    The items in /mnt, such as /mnt/floppy and /mnt/cdrom, are temporary media — disks
    you must add to the file system if you want to work with them and remove them
    after you''re done. Although this task may sometimes be done automatically (some
    distributions — including Fedora Core 1 — tools in the GUI that automatically
    mount a CD-ROM after you close the drive), you must often mount a CD-ROM manually.
    But you can pretty easily do it as outlined in the following section.


    # Adding media temporarily


    Rarely do you want to keep removable media (floppy disks, CD-ROMs, and Zip disks)
    always in the drive. If you do, you probably don''t always save the same disk,
    so you need a way to tell Linux that you inserted removable media and where. You
    can do so by using the mount command at the command prompt or in a command-prompt
    window in the GUI by following these steps:


    +   1. Make note of whether you''re trying to access a floppy or a CD-ROM.

    The newest Linux distributions have a handy feature that automatically mounts
    a CD-ROM after you place it in the drive — if you''re in the GUI. Although not
    all distributions have this feature, the one I include with this book does. When
    a CD-ROM, floppy disk, or hard drive is mounted, the contents of the media are
    then accessible to Linux.

    2. If the media is a floppy, type ls /mnt/floppy; if the media is a CD-ROM, type
    is /mnt/cdrom.

    If the directory does not exist, you need to create it. If youre not sure about
    the existence of the directory, navigate to the /mnt directory and use the ls
    command to display the contents. To create a directory, use the mkdir command
    as follows: mkdir /mnt/location (specifying the location).

    3. If it''s a floppy disk, make note of the operating system the disk comes from.

    Table 16-4 shows which operating system corresponds to which type label.

    4. Put the command together in the following format, and at a command prompt,
    type the:

    mount -t type /dev/device /mnt/location


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_312_0.png)'
  merge: -1
  pgno: 312
- img_proc: true
  md: '# Part IV: Sinking Your Teeth into Linux


    You need to replace italicized words with specific information. To mount a floppy
    disk that you put together under Windows XP, for example, type this line:

    mount -t vfat /dev/fd0 /mnt/floppy


    where fd0 is the type of device. (USB keychains and thumb drivers also tend to
    come pre-formatted with vfat.) fd0 is the way Linux refers to the floppy drive
    — sort of how Windows refers to the floppy drive as A::.

    fd0 and A: are part of the operating system definitions.


    | Table 16-4 File System Types That Your Floppy Disk Can Contain |

    | Type | Description |

    | --- | --- |

    | ext2 | Linux |

    | mdsos | Windows 3.11 or earlier |

    | vfat | Windows 95 or later |

    | hfs | Macintosh |


    If you''re mounting a CD-ROM, try using the command as follows:

    mount -t iso9660 /dev/cdrom /mnt/cdrom


    You may be able to just use mount /mnt/cdrom in some distributions. For a Linux
    floppy disk, you can skip the type stuff and just mount /mnt/floppy or mount /dev/fd0
    /mnt/floppy.


    To remove the CD-ROM or floppy disk from the file system, type this line:

    mount /mnt/location


    Do not remove a floppy disk without correctly unmounting it, or you may wind up
    with missing data! Although you don''t need to worry about losing data with CD-ROMs,
    you often cannot remove the disk until you unmount it. And you can''t unmount
    an item if you''re already in it, so make sure that you''re not in any directories
    before you attempt to mount the media.


    If you have both Windows and Linux set up on your computer and can boot from either
    operating system (a dual-boot setup), you can mount your Windows partition while
    you''re in Linux! This technique is a great way to transfer files back and forth,
    if you need to. See your distribution''s documentation for information about mounting
    a Windows partition.'
