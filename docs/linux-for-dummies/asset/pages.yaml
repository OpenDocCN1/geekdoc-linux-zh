    In distributions such as Red Hat Enterprise and Fedora Core, both

    user and group are the same by default (you would have owner dee and

    group dee, for example). This isn''t always the case, however, as you see from

    the preceding code listing, which has owner dee and group users. Various

    Linux distributions have their own philosophies about this issue.


    As the root user, you can create new groups or add users to groups:


    +   - To create a group, you use groupadd groupname, specifying the name

    of the group you want to create (for example, groupadd labteam).

    - To add a user to an existing group, use usermod -G group user,

    specifying the name of the group to which to add the user and the user

    you want to add to this group (for example, type usermod -G labteam dee).


    # Changing permissions


    Permissions and ownerships are assigned to all files during the installation

    process. From there, every directory and file you create has permissions\assigned
    to it automatically (what these default permissions are depends

    on your Linux''s distribution settings). But you may not the per-

    missions that are already in place. Maybe you want to change them

    to your data more secure or even more accessible. In the listing in the

    preceding section, for example, I don''t see the need for everyone on the

    system to be able to view the contents of lsfile. So, I can use the chmod

    (change) command to deal with this issue in the format chmod new

    permissions filename, where newpermissions indicates that you want

    to change the existing permissions for whatever file you specify as file-

    name. For example, you type chmod newpermissions lsfile

    at the command prompt.


    You can express the newpermissions component in two different ways: by

    the letters or by the numbers, as described in the following sections.'
