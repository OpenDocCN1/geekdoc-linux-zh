  md: '# The command line


    The Linux command-line interface provides a quick and fast way of entering commands
    and executing actions. Even if you are mostly a "GUI person," after you get the
    hang of using the command line, you discover that it''s faster to perform some
    tasks at the command line than with a mouse in the GUI environment. However, if
    you prefer to a GUI interface as your working environment, you can easily open
    a terminal window, which is a command-prompt window, to perform your command-driven
    tasks.


    When you installed Fedora Core 1, it gave you a graphical login by default. Other
    versions may give you the option of choosing a graphical or command-line login.
    If you don''t have a graphical login, when you start up, your screen is mostly
    black with few lines of text displaying the Linux distribution, the name of your
    machine, and a blinking line. To log in to Linux at a command prompt, follow these
    steps:


    +   - Type your account name and press Enter.

    The system responds with a password prompt.


    +   - Enter your password at the prompt and press Enter to send the password to
    the operating system.


    For security purposes, the password isn''t displayed on the screen. After you
    have successfully logged in to Linux, the command prompt points to your default
    location, which is your home directory.


    Most Linux distributions have quite a flexible command-line interface and allow
    you to use the arrow keys to move the cursor and the Backspace and Delete keys
    to remove text. One difference between the Linux command line and other interface
    command lines, as with in Windows, is that Linux commands are case sensitive.
    The Linux command line also has an autocompletion feature for commands. If you
    type the first few characters of a command, type part of and press Tab to complete
    the rest of the command automatically. If you hear a beep when you press Tab,
    more one command is available that starts with the same sequence of characters.
    To see the list of matching commands, press a few more characters and press Tab
    again. To autocomplete the command you want, type a few more characters and press
    Tab again.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_106_0.png)


    The trick to using the Tab key for autocompletion is to type just enough of the
    command so that the typed characters are unique to the command.


    Most Linux distributions also keep a running history of the most recently used
    commands. To access the history list, press the up-arrow key on your keyboard.
    As you continue to press the up-arrow key, you step through the most recently
    entered commands in reverse chronological order. If you'
