    # # Watchin'' Movies


    These days, you can watch many kinds of movies on your computer. Whether it''s
    a Flash animation, a DVD, or a movie trailer, you''ve got the tools that you need
    right at your fingertips (or just a click away). You might have even installed
    some already while trying to access other multimedia features. Here are some of
    the tools of the trade.


    Watching a DVD in Linux is a bit of a legal quagmire if you live in the U.S. The
    Digital Millennium Copyright Act (DMCA) and other issues make it tricky for any
    open source program to navigate the licensing maze when it comes to movies that
    are encoded or protected in various fashions. However, not all DVDs have such
    countermeasures enabled: There are DVDs that Americans can watch under Linux with
    no trouble. (Note that I say watch, and not copy pirate.)


    For more on the DMCA and the problems it causes, see anti-dmca.org.


    Perhaps the best media player out there for the Linux community is mplayer. You
    can fetch the latest version of this tool by doing the setup described in the
    earlier section "Some Preliminaries" and then typing (as root) at the command
    line:


