  md: '# Manually working with RPMs


    Working with RPMs on the command line can seem daunting at first, especially if
    you type `man rpm` and look at the help materials. So many options! Don''t worry;
    you need to know only a short selection of the available options. The remaining
    options are things you can experiment with later—after you feel you have the basics.


    # Installing an RPM by hand


    The most common RPM task is installing a new package, which you do by typing `rpm
    -ivh packageName` (where `i` refers to Install, `v` means Verbose, and `h` means
    Hash, to show progress with `#` characters). If your system doesn''t have the
    necessary items for this program to run properly, you will see an error message
    identifying the package you need or the name of the file. The important thing
    is usually the version number. The file `gnome-linuxconf-0.65-1.i1386` refers
    to the program `gnome-linuxconf`, version 65-1 or `.65.1`, for a personal computer.


    If you type `rpm -ivh gnome-linuxconf-0.65-1.i1386`, it may just go fine (in which
    case, you see a line of hash marks (#), and then you return to the command prompt),
    or you may see the error message:


    > Error: failed linuxconf > 1.17 is needed by gnome-linuxconf-0.65-1


    This error message tells you the following information:


    +   - The package `gnome-linuxconf` requires the `linuxconf` package to be installed
    before it can properly installed.

    - The version of `linuxconf` that needs to be installed is `linuxconf-1.17` or
    newer.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_329_0.png)


    Installing a new version of an RPM you already have? You type `rpm -Uvh` instead.
    The `U` stands for Update, and the `vh` portion is identical to that of `ivh.


    # Checking your RPMs by hand


    Sometimes, you need a bit of information. Similar commands exist for getting data
    about RPMs that are already installed and those that aren''t installed. The main
    difference is the option `-p`—yes, `p`, which stands for `package`. Think of it
    this way: if you don''t have the RPM installed yet, you have to open its packaging.
    If you do have installed, you don''t have to deal with any packaging.


    To read the informational blob about an RPM you haven''t installed yet, you need
    to find out about another RPM option, `-i`. This option enables you to read the
    "about" information stored in the RPM. If you want to see this information for
    a package that you haven''t installed yet, you type `rpm -qip`'
