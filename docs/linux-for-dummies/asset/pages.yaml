  md: '# 184 Part III: Getting Up to Speed with Linux


    # ## Which login am I in?


    One of the most confusing concepts about Linux shells is that you''re continually
    moving in and out of them. Each time you log in, you open a shell instance — a
    specific shell with its settings. If you''re logged in twice on two different
    virtual terminals, therefore, you have two shells going. If you change the settings
    in one of them, those settings don''t apply to the other. However, if you make
    the changes permanent, any new shells you open may have the new settings.


