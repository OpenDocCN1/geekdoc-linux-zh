    The mtools suite of utilities provides a nice way to transfer information to your
    Microsoft friends. Although Linux has native support for Microsoft Windows and
    DOS file systems, your Microsoft cohorts don''t have access to Linux (ext2 and
    ext3) file systems. To keep everyone happy, you can'
