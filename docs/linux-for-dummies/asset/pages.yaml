  md: '# # Chapter 17: Adding Software to Linux


    To install or remove a package, follow these steps:


    +   1. Open the package manager (if you haven''t already) by clicking the Main
    menu button and then choosing System Settings>Add/Remove Packages.

    In default GNOME and KDE settings, the Main Menu button in the lower-left is a
    footprint in GNOME or a big X in KDE. If you installed Fedora Core 1, the Main
    Menu button is the Red Hat fedora icon in GNOME.

    2. Select Install Software if you want to add, or select Remove Software if you
    want to delete.

    3. Click the Install or Remove link to the right of the package group containing
    the item you want to work with.

    The Remove dialog box shows only one list of packages. In the Install dialog box
    are two sections: Installed Packages and Packages Not Installed. Use the check
    boxes to pick and choose the packages you want to add or remove, depending on
    what you''re trying to do.

    4. Click Install Packages or Remove Packages to close the dialog box and begin
    the package installation or removal.

    The program walks you through the addition or removal process. First, the tool
    makes sure that either you''re not removing another program depends on, or that
    you have added anything this new program depends on. Then, you''re directed to
    insert the DVD-ROM into the drive as necessary.

    5. Return to Step 2 if you''re not finished removing and installing packages.

    6. Click Update to proceed to the installations and removals you''ve requested,
    and then click the X in the upper-right corner to close the dialog box.


    # # Updating Your Machine


    Red Hat Linux includes a tool called update, which allows you to see what new
    versions of your software might be available, and then automatically get and install
    them for you. You can find this tool in GUI on the right side of the panel, next
    to the date. The icon is a round button that has three different appearances,
    as follows:


    +   - Blue with a check mark — nothing is available.

    - Red with an exclamation point — there are updates available.

    - Green with arrows pointing left and right — the tool is in the process of synchronizing
    with the update servers.


