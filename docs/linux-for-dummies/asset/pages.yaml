  md: '# 316 Part IV: Sinking Your Teeth into Linux


    +   - Consider the source. If your warning came directly from your distribution
    security mailing list or from a well-known, trusted security Web site, then this
    is something to heed. However, if it''s just a forward from a friend, take it
    with a grain of salt.


    Although you can''t plug some holes until you find them — such as the items pointed
    out in security notifications — others come prepackaged. The natural thing to
    wonder when you''re reading about a security hole in the shrink-wrapped version
    of a Linux distribution is, “Why, if they''re known holes, weren''t they plugged
    up in the first place?” It''s a good question. The answer is that the people building
    the Linux distributions don''t know exactly what you, in particular, want to do.
    Do they better to meet the security needs of average users, which isn''t exactly
    right for everyone. But rest easy because this issue is much easier to deal with
    than you may think.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_337_0.png)


    Mandrake and SuSE also offer update e-mail lists and software tools. Check their
    Web sites and documentation to find more!


    # Network holes


    On a Linux server or workstation, you must not have any network services running
    that you don''t intend to use. To understand why, you first need to comprehend
    how these services work. Every network service listens to an assigned place leading
    to the outside world. For example, if you are running a Web server, it''s listening
    to port 80. You can think of a port as an apartment number. Whenever a person
    wants to look at one of your Web pages, they point their browser toward your Web
    server, typically named something like www.myserver.org. This name represents
    the street you live on. Along with a name, this server has an IP address, which
    is something like 172.16.3.9. This number represents the street address assigned
    to your apartment building. The apartment building is full of doors leading to
    various network services. Apartment (port) 80 always leads to the Web server —
    unless you set up differently. (Don''t change the port you want people to have
    a hard time getting to it.)


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_337_1.png)


    You can see in the /etc/services file which port corresponds to network service.


    You can have a certain amount of security protecting each port, just like an apartment
    door. You may have just a bit of security, like a normal key lock. Or, you may
    have a deadbolt, a combination lock, and other gizmos protecting the point of
    entry. This is where the metaphor begins to break down. You''re not likely to
    decide that a particular apartment hasn''t anyone gone in or out. With a computer''s
    network services, however, this situation is important to consider. If you don''t
    run an FTP server, for example, ports 20 and 21 functioning just provides more
    doors through which potential intruders can attack.'
  merge: -1
