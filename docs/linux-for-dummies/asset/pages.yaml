  md: '# # Packaging Linux: The Distribution


    What people call a *Linux distribution* is actually the culmination of the GNU
    project''s tools, the Linux kernel, and any number of other open source (and closed
    source) software projects that sprang up along the way.


    Robert Young, cofounder and current chairman of Red Hat, has coined an analogy
    comparing Linux to ketchup. Essentially, the operating system called Linux, with
    the GNU tools, Linux kernel, and other software, is a freely available commodity
    that, like ketchup, different distributors can package and label in different
    containers. Anyone is encouraged to package and market the stuff, even though
    the ingredients are fundamentally the same.


    Linux is a complex, malleable operating system, and thus it can take on many appearances.
    The greatest Linux advancement in recent years has been making it easier to install.
    After all, the tools that enable the casual PC user to Install Linux originally
    weren''t available. Companies like Red Hat saw this as an opportunity to add value
    to an existing product, and the concept took off like gangsters.


    To draw on the ketchup analogy, various distributions of Linux have a slightly
    different flavor or texture; your distribution preference may be spicy, mild,
    thick, or gooey. However, you can rest assured that any of the following distributions
    have the same Linux and GNU heart and soul. Each short description includes a
    Web address where you can find more information about each project:


    +   **Debian GNU/Linux**: This distribution is one of the oldest and a recognized
    favorite among advanced technical circles. Historically, it''s relatively difficult
    to install. The Debian team works closely with the GNU project and is considered
    the most "open" of the Linux distributions. An easier to install (and use) distribution
    with Debian underneath is Xandros.


    ```

    www.debian.org

    www.xandros.com

    ```


    +   **Mandrake**: This distribution demonstrates the power of the GPL by allowing
    this competing company to stand on the shoulders of giants. Mandrake was originally
    based on Red Hat Linux, something that simply could not happen in a closed source
    environment, but which has since become an excellent solution in its own right.


    ```

    www.mandrakelinux.com

    ```


    +   **Red Hat and Fedora**: Red Hat claims the prize for successfully mass marketing
    the Linux operating system. Red Hat has validated Linux by packaging the GNU and
    Linux tools in a familiar method of distribution'
