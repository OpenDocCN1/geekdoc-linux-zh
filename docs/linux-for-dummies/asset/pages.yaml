    TIP You can move and rename at the same time. You can move /home/mike/text into
    /home/mike/textfiles while renaming it grocerlist, all from /home/mike by typing
    mv text textfiles/grocerlist.


    # Getting rid of the junk


    In any operating system, cleaning out your files occasionally is a good idea.
    If you don''t, you''re on the road to having no space left, which is definitely
    no fun. Linux has two different commands for deleting. One is rm (short for remove).
    If you use this command by itself, it deletes files. For example, If you type
    rm ~/test.tif, the test.tif file may be deleted without question, or you may see
    the following line, depending on how your distribution has the rm command set
    up:


    ```

    rm: remove ''test.tif?''

    ```


    Press N or Enter to cancel the operation. Otherwise, press Y to delete the file.
    Linux contains a number of options, as shown in Table 10-3, that you can use to
    make the rm command behave according to your preferences. The default preferences
    may differ between your root account and your user accounts.


    | Table 10-3 | Options for rm |

    |---|---|n| -d | Removes a directory, even if it''s not empty |

    | -f | Removes items without asking for confirmation |

    | -i | Asks for confirmation before removing anything |

    | -r | Continues into subdirectories and removes items there too |

    | -v | Prints status information during the removal process |


    You can use these options individually or in combinations. If you use the -d option,
    you can use rm to remove a directory as well as a file. For example, if you want
    to delete /home/mike/textfiles, you type rm -d textfiles from inside /home/mike.
    This command removes both the directory and its contents, but you may be prompted
    for each item, depending on how your distribution has rm set up. You can override
    either behavior (prompting or no prompting) with the proper flags. If you type
    rm -df textfiles, you don''t have to answer any questions; if you type rm -if
    textfiles, you do.'
