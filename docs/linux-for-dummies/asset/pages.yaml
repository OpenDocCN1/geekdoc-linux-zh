    type ls -a, you may see something like this because of the hidden files

    those starting with periods):


    ```

    .. .bash_logout .bash_profile .bashrc

    ```


    What are the first two entries? The first entry — the single dot — always refers

    to "right here." It points to the directory you''re in. (Don''t worry if this
    stuff

    does''t make any sense to you at the moment. As you work with other com-

    mands and get more familiar with Linux, it makes sense.) The second part of

    t line (the two dots) refers to the parent directory, or the directory one level

    from where you are. For almost all user home directories (for example,

    /home/dee), the parent is /home, I discuss file system structure in more detail

    in "Working with the File System," later in this chapter.


    If you type -l in this same brand-new home directory, you get nothing,

    just like you do when you typed ls.


    Type one of the most commonly used combinations and you get much more

    information. If you type ls -la, for example, you will see something similar

    the following:


    ```

    drwx------ 22 dee 4096 Jul 29 07:48 .

    drwxr-xr-x 5 root 4096 Jul 27 11:57 .

    -rw-r--r-- 1 dee 24 Jul 27 06:50 .bash_logout

    -rw-r--r-- 1 dee 230 Jul 27 06:50 .bash_profile

    -rw-r--r-- 1 dee 124 Jul 27 06:50 .bashrc

    ```


    You may find some parts of this format easy to understand, at a glance, than

    others. The first item in each list (the part with the dashes and dashes)

    for example, the drwx------ in the first line) is the permission set assigned

    to the item. Briefly, permissions define who can read the file, change it, or
    run

    it''s a program. You can read more about permissions in "Haggling with

    Permissions," later in this chapter. The second item in the first line (in this

    case, 2), is the number of links to the item.


    A link is a file listing pointing to another file, making a kind of short-\cut.
    Use two kinds of links in Linux and Unix:


    +   Soft link: this link is like a Windows shortcut in the link points back

    to the original file, and anything you do to the link points to the original

    Erase the original file, and the link remains, but it becomes unusable.

    The link is broken without the original file.


    +   Hard link: this link doesn''t have a counterpart in the Windows world. A

    hard link isn''t just a shortcut; it''s another instance of the file itself. The

    data in file is saved in only one place, but you can edit either the

    original or the link, and the edit is saved for both instances of the file.

    errase the original, and the file still exists as long as the link is. It''s

    like two doors to the same room!


