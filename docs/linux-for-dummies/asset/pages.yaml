  md: '# Chapter 12


    # Gettin’ Gooey with the GUIs


    In This Chapter


    +   - Adding applets to the Panel

    - Adding programs to the desktop

    - Downloading and setting up themes

    - Configuring the X Window System


    The X Window System (or X) opens a world of possibilities. X is, in general, a
    set of applications that work together to provide a graphical interface. Some
    applications draw windows, some manage the look and feel of the interface, and
    others handle other aspects of the graphical world for you. In the Linux world,
    you can configure all these aspects, which is where many people start to get overwhelmed.


    In Chapter 6, I introduce the two major players in the Linux GUI market: GNOME
    and KDE. In this chapter, you get a chance to alter the GUI''s behavior to suit
    your own needs. For example, if you have a hard time reading text in those small
    command-prompt windows in the GUI, you can make both the windows and their fonts
    larger. A wealth of things can be changed too, so read on and take a look.


    > If something goes terribly wrong in the GUI and you need to exit in a hurry,
    press Ctrl+Alt+Backspace. This key combination does one of things. If you boot
    into the GUI, it collapses your GUI session and takes you to the GUI login prompt.
    However, if you boot to the command line, this key combination collapses the GUI
    immediately, taking you to the command line.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_220_0.png)


    However, press Ctrl+Alt+Backspace only in an emergency. This key combination doesn''t
    cleanly stop the programs involved. You''ll end up with all kinds of bits and
    pieces of programs, files, and more on your system.'
