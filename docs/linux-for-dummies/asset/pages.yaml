  md: '# Chapter 18: A Secure Linux Box Is a Happy Linux Box 35


    Most Linux applications and other Linux software programs are distributed by way
    of the Internet. In fact, the development cycle of new (and updates to) Linux
    software revolves around the Internet for file exchange, e-mail, and forum newsgroup
    discussions. Make sure that you and other users of your Linux system are comfortable
    with the Web sites that are used and visited. You need to develop a list of trusted
    sites that you provide with the information you need and are not misleading in
    their presentation. As a starting point, you can trust all the Web sites referenced
    in this book I have accessed them. If either you or a user of your Linux system
    is unsure whether you can trust a particular Web site, do some research and perhaps
    ask others for your opinions.


    # Plugging Security Holes


    As the person in charge, your job is to make sure that this computer stays intruder-free.
    In addition to making sure that you do all the same things a user would do for
    both user accounts and the superuser (root) account, no matter which Linux distribution
    you are running, you must keep up-to-date with security problems.


    Every operating system has security issues. You can''t escape them. The people
    who manage to avoid break-in problems are those who stay informed and apply fixes
    whenever they appear. Almost Linux distributions offer the ability to find out
    and grab fixes. If the instructions aren''t in your documentation, they''re on
    the distributors'' Web sites.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_336_0.png)


    In the case of Fedora Core, you have the Red Hat Network (RHN) icon in the lower-right
    corner of your panel as discussed in Chapter 17. One of the major reasons your
    RHN icon turns red is for security updates. Be sure to install these!


    When you get a warning message — or find one on a Web site — about a particular
    piece of software, follow the following questions in mind:


    +   - **Are you using this program?** You potentially receive warnings about everything
    that comes with the distribution. You can determine whether the warning pertains
    to you in a number of ways, depending on the distribution and the package. A quick
    way of telling whether you''re using a program is to type man program, where program
    is the name of the application. If the package is installed, you see the help
    information for it; the help information isn''t installed unless the program is.


    +   - **Are you the same version of the program you''re been warned about?** You
    may be using an older or newer version. You have to read the warning message carefully
    to see what range of versions it covers. If it doesn''t mention one, you should
    assume that the warning applies to you.'
