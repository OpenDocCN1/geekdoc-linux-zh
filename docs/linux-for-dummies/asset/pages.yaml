    during your last session. Note that the Location text box holds the Web site you
    are transported to whenever you click the Home button on the browser. The following
    options allow you to personalize your browser with some additional personal preferences:


    +   - History: The History text box enables you to designate how many days you
    want your browser to remember where you have been. You can click the Clear History
    button to clear the history manually at any time.


    +   - Languages: No, this option doesn''t automatically translate the content
    of a Web page into the preferred language. Rather, some Web page authors provide
    their Web pages more than one language. If it''s an option, this merely lets you
    decide language preference.


    +   - Helper Applications: In this table, you designate applications to import
    special file types. An example is a .pdf file, which requires the Adobe Acrobat
    Reader in order to view it. You specify the application and optional arguments
    that need to be passed to the program.


    +   - Smart Browsing: With this option, you can set the characteristics of the
    What''s Related tab, which is on the Sidebar (located in the left pane of the
    browser window). The What''s Related tab provides a drop-down menu listing sites
    that may be related to the displayed Web site.


    +   - Internet Search: Search engines have an integral part of Web browsing. To
    accommodate this, Mozilla can integrate your favorite search engine into your
    browser. You can click the drop-down button under Default Search Engine and choose
    your preference.


    +   - Tabbed Browsing: This reflects the latest craze in Web browser capabilities.
    It allows you to have multiple surfing destinations, all in one window, and change
    between them by clicking tabs.


    +   - Downloads: Mozilla provides you with a helpful download manager that lets
    you watch the progress of multiple files, all in a single window. You can even
    see the last items you downloaded.


    # E-mail and newsgroup preferences


    The Composer category (Figure 8-3) allows you to set preferences for the editor
    when you compose e-mail messages, the Mail & Newsgroups category (Figure 8-4)
    is where you provide your cosmetic e-mail preferences—although if you''re using
    Core I from the DVD or CDs that come with this book, see the Evolution section
    to find out how to make that of e-mail client as well.'
