  md: '# 84 Part I: Getting Your Feet Wet


    Before I delve into the innards of Linux configuration, I take a brief tour of
    the various Linux interfaces. Whatever Linux configuration you choose or whatever
    applications you use, you find that you can do almost anything, no matter what
    Linux "looks like." After I have spent some time discussing the faces of Linux,
    I cover user accounts and the root account a bit. You see why you should create
    a user account for yourself and for others who use your Linux system.


    # The Interfaces


    Linux has two interface types: the command-line interface and the graphical user
    interface (GUI). If you use other computer systems, such as Windows or the Macintosh,
    you''re already familiar with a GUI interface. Most Linux distributions include
    different versions of the GUI, and you can configure all aspects of the graphical
    interface.


    If you have been using computers for many years, you may also be familiar with
    a command-line interface. The initial release and early development of Linux was
    all command-line oriented; GUI interfaces only became popular and powerful on
    Linux. One important factor when choosing between a command-line interface and
    a GUI is speed. If you plan to compile programs or perform other processor-intensive
    tasks that tend to slow down your machine, running the GUI will add to the speed
    problem, especially if you don''t have a fast computer. However, if you have a
    new computer with a gigahertz or two of power, tons of memory, and a big hard
    drive, speed won''t be a problem.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_105_0.png)


    Remember that even with gobs of power and speed, the more applications or services
    you run at the same time, the more the overall speed of any one of the running
    applications is reduced.


    Readability can also be a big issue when choosing between the GUI and the command
    prompt. If you have a hard time reading text in those small command-prompt windows
    from within the GUI, you can make the windows and the font bigger, or you can
    work directly with the command prompt outside the GUI. In this case, you may or
    not want to close the GUI.


    The two biggest GUI contenders for Linux are GNOME and KDE. Because Fedora Core
    1 comes with this and this distribution is backed by Red Hat — which has its own
    versions of GNOME and KDE, called Bluecurve — I Every Linux distribution customizes
    the interface to some degree. I''m as explicit as possible in pointing out when
    you''re looking at something that''s specific to Red Hat (Bluecurve GNOME) and
    when it''s not (just GNOME).'
