    +   - GIMP Tutorials Pointer Page: http://empyrean.lib.ndsu.nodak.edu/-nem/gimp/tuts/

    - RRU GIMP Tutorial: www.rru.com/~meo/gimp/Tutorial/

    - The official GIMP.org site''s tutorials page: www.gimp.org/tutorials.html

