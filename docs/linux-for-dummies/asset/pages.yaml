    and rpm -qip gnome-linuxconf. The file-listing command is quite handy if you''re
    looking for a configuration file!


    You can see a list of every RPM you have installed by typing rpm -qa, where the
    -a option stands for all (and tends to be used in conjunction with only a few
    options, such as -q for queries). A number of packages are out there; type rpm
    -qa | more so that you can look at just one screen at a time. On the other hand,
    if you''re curious about whether you have a particular installed, type rpm -q
    short_package_name.


    # Removing an RPM by hand


    One of the best things about RPM is its ability to remove an application completely.
    When you remove an RPM, you can be sure that you removed all of the application
    files, except perhaps for configuration files it may create backups of, just in
    case you need them later. To delete an RPM from your file system and the RPM database,
    you type rpm -e short_package_name.


