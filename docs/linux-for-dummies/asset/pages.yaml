    # Troubleshooting Your IM Connections


    If you have been using AIM or MSN with other operating systems, after your Linux
    system has successfully connected to the IM service, you see your buddy lists
    and any buddies connected. If you''ve never used AIM or MSN, you can now set up
    buddy lists. Buddy lists contain the usernames of people you want to communicate
    with through the instant messaging service. Your buddy list lets you know when
    your "buddies" are online and available to receive an instant message.


    If you''re using ICQ, your buddy list isn''t stored on the Internet for you. This
    list is stored on your machine and not in a central location online.


    Sometimes, your Linux system is unable to properly connect to the IM service.
    When this happens, an error message pops up on your screen and indicates a failure
    to connect. You may be unable to connect to the IM service for several reasons:'
  merge: -1
  pgno: 167
- img_proc: true
  md: '# Chapter 9: Cool Internet Tools


    +   - You may have entered the wrong password for your IM account or chosen the
    incorrect IM account name.


    +   - Your computer may not be connected to the Internet. Try opening Mozilla
    or another Web browser to see whether you can get to a Web site, which tells you
    whether you''re connected to the Internet.


    +   - If you can open a Web site but can''t get IM to work, the IM system may
    be unavailable. This problem occurs at times because of maintenance of the IM
    service or an excessive amount of traffic on the Internet or on the IM service.


