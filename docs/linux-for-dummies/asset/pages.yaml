  md: '# 202 Part III: Getting Up to Speed with Linux


    Adding a program to the Panel

    If you have a program you end up using often, you can add it to your panel by
    following these steps:


    +   1. Click the Main Menu button and browse to the program you want to add to
    the bar.

    ''t open the program. Just point to the menu item with your mouse pointer.

    2. Right-click the program and choose Add This Launcher to Panel.

    An icon for this program appears on your Panel.


    After you have a program on the Panel, you can run the program just by clicking
    its icon.


    Removing a program from the Panel

    If you want to remove one of the programs on the Panel, just right-click the icon
    you want to remove and choose Remove from Panel from the shortcut menu that appears.
    The icon vanishes from the Panel. That''s it!


    Adding a program to the desktop

    The panel has only so much room. Maybe you would rather your program shortcuts
    lined up on the desktop as you do in Windows. To add a program to the desktop,
    follow these steps:


    +   1. Click the Main Menu button to open the GNOME main menu.

    2. Browse to the submenu containing the program you want to add to the desktop.

    For example, if you want to add The GIMP, you open the Graphics submenu.

    3. Select the program you want to add to the desktop.

    Don''t open the program — just move your mouse pointer to it. For example, to
    add The GIMP, you move your mouse to the words The GIMP so that they''re highlighted.

    4. Click the program name and drag it to the desktop.

    Be sure to drag this item to the side (not up through the menu). A little piece-of-paper
    graphic follows your mouse pointer until you release the mouse button. After you
    do so, your new shortcut is added to the desktop.


    If you''re not happy with where a desktop icon is placed, click it and then drag
    it to a new location.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_223_0.png)'
