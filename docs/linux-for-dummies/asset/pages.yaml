    # # Lying pipes


    Another bash shell feature enables you to connect commands so that the output
    of one becomes the input for the next. This feature is referred to as a *pipe*.
    Suppose that you want to look over the details of all files in the /etc directory
    in long-listing format. If you type `ls -la /etc` to do so, a massive listing
    appears, and much of the information scrolls right past you. Although you can
    back up a bit by pressing Shift+PageUp, you may not be able to see everything.


    To see the information, you can do one of two:


    +   - Send the data to a file with redirection by typing like `ls -la /etc > ~/etcclisting`
    and review the contents of ~/etcclisting with your favorite editor.

    - Pipe the output to the `more` command. This command ensures that text doesn''t
    show more screen at a time. It waits until you press the spacebar before showing
    you the next screen. Many Linux users find this command quite useful.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_216_0.png)


    To pipe the output to `more`, type `ls -la directory_path | more`, where `directory_path`
    is the directory for which you want to list the contents. The `|` symbol (on which
    the keyboard looks like two vertical bars stacked on top of each other rather
    than just one solid line) tells bash that you want to use a pipe.


    The more utility is a *pager*. There''s another utility that behaves like more,
    but has additional features and ability. Guess what it''s called? It''s called
    *less*. The *less* utility allows you to scroll information forward and backward
    and search for keywords. So, *less* can be used in place of *more*. At least in
    this example, *less* is better than *more*'
