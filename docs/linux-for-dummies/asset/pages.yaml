    # Making new directories


    As you add more and more files to your home directory and elsewhere, you realize
    that you need to organize them before you get completely buried and can''t find
    anything quickly. Directories are the perfect tools for filling this need. Again,
    you can create new directories in Linux with the `mkdir` command and use it in
    more than one way. If you''re in `/home/mike` and want to create the directory
    `/home/mike/pictures`, you can type `mkdir pictures`. If you need to create a
    directory outside your home directory with files to share with others, you type
    `mkdir /tmp/pictures`. This is a perfect use for those hard and soft links, since
    you''ll want to keep a copy of those files in your own home directory. The contents
    of your `/tmp` directory are removed pretty regularly!


    # Moving, renaming, and deleting files and directories


    One of the facts of life is that things change. Suppose that you create a file
    named text one day. Then, the next day, you have a pile of text files and need
    to make a new directory for them. You make the new directory and move the files
    into it. Or, suppose that you make a filename generic and you can''t tell the
    difference between text and text5 at a glance. You may need to rename them. Fortunately,
    Linux has commands to do all these things easily.


    # Moving and renaming


    You need to be careful if you''re using the root account. Renaming, moving, or
    deleting system files can wreak total havoc! This is just one more reason that
    ignorant people prefer not to use root at all unless they have to.


    You use the `mv` command for both moving and renaming. To move a file from one
    location to another, you type `mv originlocation newlocation`, where `originlocation`
    is the directory in which the file starts, and `newlocation` is where you want
    to move the file. Suppose that you want to move the file `/home/mike/text` into
    the directory `/home/mike/textfiles`. When you''re inside `/home/mike`, you type
    `mv text textfiles`. This command is the same as typing `mv /home/mike/text /home/mike/textfiles
    or even mv mv /home/mike/text /home/mike/textfiles/text`. If you make the destination
    name of the name of an existing directory, the `mv` command assumes that you want
    to put the file into that directory with the same name.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_183_0.png)'
  merge: -1
