  md: '# # Chapter 4


    # # Installing Other Distributions


    # ## In This Chapter


    +   - Touring the Linux distribution countryside

    - Demystifying Mandrake

    - Getting to know SuSE


    The Linux distribution refers to the “packaging” that wraps up the free operating
    system everyone has to know as Linux. At the core of all distributions are the
    same components: the Linux kernel and the GNU utilities. Just as many other commodity
    products are packaged and delivered differently to accommodate various recipients
    and applications, Linux is also packaged differently to provide for a variety
    of target users.


    After our earlier discussions, you should understand that Linux is more than just
    some newfangled program. Linux is a fully equipped workshop of software tools
    and building materials that can be used to construct any of a wide spectrum of
    computing solutions. Developing the killer Linux distribution has been the Holy
    Grail of the Linux community. This ultimate distribution would provide all the
    support and capability that the preschooler, the housewife, and the crotchet old
    computer science professor would need to harness the power available with GNU/Linux.
    Although the competition to create the perfect distribution continues, you don''t
    need to do much research to determine which distribution is right for your needs.


    In this chapter, I survey two more of the most popular and easiest-to-install
    distributions. Although I don''t have the space to cover every installation in
    detail, I hope to point out some of the shiny chrome — or notable, characteristics
    that these distributions have to offer.'
  merge: -1
  pgno: 84
- img_proc: true
  md: '# Distribution Geography


    More than 200 different Linux distributions are now available. Furthermore, a
    dozen or so new distributions are created each year and rapidly faded, either
    from a lack of publicity or perhaps because the innovative features pro-vide simply
    aren''t popular enough to draw a loyal following.


    Although all distributions provide the same software and can ultimately-produce
    the same configurations, seeing various countries tend to gravitate toward one
    distribution over another is interesting. For example, SUSE is from Germany and
    has a large contingent of supporters in Europe; TurboLinux is popular in Japan;
    Red Flag Linux is a favorite in China; Connectiva goes over well in Spanish-speaking
    countries; and Red Hat, with its new Fedora Core, maintains a high profile in
    the United States.


    Regardless of your choice and curiosity, most Linux distributions have matured
    to the point where you can be confident that your installation will be successful.


    # Finding various distributions


    Every major distribution has its own Web site. After you''re there, hunt around
    for a download link. Of course, most companies that distribute Linux would rather
    have you purchase a boxed set of their products.


    Pay for free software, you say? Preposterous! Buying free software is not such
    a bad deal, when you think about it. When you purchase a distribu-boxed set (when
    one is available, you can''t do this with Fedora Core), you receive a tremendous
    value. You not only get some nicely bound books to scribble in and dog-ear (as
    well as some telephone or online support), but you also help support companies
    to develop better service and support for your free software.


    Okay, both purchasing your Linux distribution and downloading it for free (in
    most cases) are legitimate options, both ethically and legally. How often does
    life come easily these days? If you don''t have the band-width to do all of this
    downloading, or just get uneasy at the thought of burning your own CDs and DVDs,
    there are some places you can turn in order to pick up the media on the on cheap
    without giving yourself a headache.


    The site www.linuxiso.org offers a ton of distributions for downloading, for example.
    Armed with your DVD-ROM or CD-ROM burner and a high-speed Internet connection,
    you can download and burn your own CD Linux distribu-tions all day long, for both
    yourself and for sharing with friends (again, legally).'
  merge: -1
  pgno: 85
- img_proc: true
  md: '# Chapter 4: Installing Other Distributions


    However, I want to emphasize that a high-speed Internet connection is necessary
    because a CD image is typically in the 650MB range. So just imagine how large
    a DVD image would be! A DVD contains around seven CDs'' worth of information!


    If you haven''t tangled with broadband yet, don''t despair. You can still get
    your evaluation distribution on CD or DVD, and you can even purchase CDs and DVDs
    on cheap off of eBay (and legally too). Just ask a Linux geek: Linux geeks are
    plentiful these days and usually hook you up with a CD or two—they''re just happy
