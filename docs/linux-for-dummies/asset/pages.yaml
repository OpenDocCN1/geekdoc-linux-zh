  md: '# Part IV: Sinking Your Teeth into Linux


    # # Choosing Secure Passwords


    The first line of defense from intruders is the collection of passwords used on
    your system. For each account you have set up on your system, the passwords must
    be strong and difficult to figure out. If even one of the accounts has a weak
    password, you may be in some trouble. Amazingly enough, in 70 percent of the cases
    where unauthorized individuals gained access to systems, the password for an account
    was the word password itself! When choosing good passwords, follow these rules:


    +   - Don''t use any part of your name.

    - Don''t use the names of friends, loved ones, or pets.

    - Don''t use birthdays, anniversaries, or other easily guessed dates.

    - Don''t use dictionary words.

    - Don''t keep your password written down near your computer, unless it''s buried
    in something else, such as writing it in an address.

    - Don''t tell anyone your password. If someone needs to access specific files,
    give the person an account and set up permissions and groups properly so that
    they can do.

    - Do use a mix of lowercase letters, capital letters, and numbers.

    - Do ensure that your password contains a minimum of eight characters.

    - Do use acronyms made from sentences, such as having the password M8ydnit to
    stand for "My eight year old dog''s name is Tabby."


    Every person on your system needs to follow these rules, including you! Consider
    keeping a sheet of paper with these rules next to the machine.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_335_0.png)


    I can''t stress this advice enough: Never give out your password. Make sure that
    the people using your machine understand this. You can always find alternative
    methods to accomplish a task without giving out your password. If someone wants
    to use your machine, make an account for that person. Then they can have their
    own password!


    # # Updating Software


    All users can download and install new software. Of course, the programs they
    install are limited to the user''s own permissions. The thing to be careful of
    here — with any operating system — is that you don''t get a version of a program
    that has been tampered with or is even an all-out fake trying to trick folks into
    installing it.'
  merge: -1
