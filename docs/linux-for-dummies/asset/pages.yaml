  md: '# 166 Part III: Getting Up to Speed with Linux


    Although each triad is often different from the others, the internal structure
    of each one is made up in the same way. Focus specifically on how to read one
    triad before looking at the set of them. Each triad includes three characters:


    +   - The first character is either an r or a dash. The r stands for read permission.
    If r is set, the triad allows the entity stands for (user, group, or other) to
    view the directory or file contents.

    - The second character is either a w or a dash. The w stands for write permission.
    If w is set, the triad allows the entity stands for add or edit items to, or in,
    this directory or file.

    - The third character is either an x or a dash. The x stands for execute permission.
    If x is set, the triad allows the entity stands for run programs contained in
    this directory or to run the particular program in this file.


    In all cases, if the d sits in place of r, w, or x, the triad does not allow the
    entity to read, write, or execute permission.


    The following sections describe owners and groups in more detail.


    # Beware of owners


    You may have noticed that when I talk a great deal about owners (users) and groups
    in Linux. Every file and directory has both of these components: a user from /etc/passwd
    file that''s assigned as its owner and a group from /etc/group assigned as the
    group.


    Although an everyday user probably doesn''t need to change file ownership, the
    root user does regularly. If you add the file comments, for example, for /home/tom
    while you''re logged on as the superuser (another term for the administrator,
    who is the person who owns the root account), root owns that file. The user can''t
    change it unless you have set the last triad''s permissions to allow the other
    folks (those who aren''t the file''s owner or in the specified group) to read
    and write to file. But this method is a pretty sloppy way of doing things because
    the whole idea of permissions is to reduce access, not to give everyone access.
    Instead, remember to change the file''s owner to the tom. You do this with the
    chown (change owner) command. For ownership over tom. Then tom can work with this
    file and even change its permissions to something he prefers.


    # Hanging out in groups


    Groups are more interesting to work with than owners. You use groups to allow
    the root user to assign to multiple users the ability to share certain file system
    areas. For example, in many versions of Linux, all users are added to a group
    named users. Then, rather than a long format file listing such as the'
