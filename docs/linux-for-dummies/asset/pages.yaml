  md: '# # Chapter 7


    # # Connecting to the Internet


    +   **In This Chapter**

    * Understanding common Internet connection methods

    * Setting up your Internet connection

    * Connecting to your Internet Service Provider (ISP)

    * Understanding enough TCP/IP to be dangerous


    You may already be connected to the Internet if you''re on a machine that''s connected
    to a LAN and configured the networking during installation. To test this, open
    up a Web browser and try to go to an outside Web site (like www.redhat.com). If
    it works, you''re up! No need for this chapter. read on.


    In this chapter, I slash a trail through the networking jungle and help you link
    your Linux machine to the rest of the world. However you choose to connect, configuring
    your Linux computer to connect to the Internet has never been easier. Red Hat
    provides you with a graphical tool to help you configure your Internet connection
    in a snap. In this chapter, I explain how to configure your modem, and after you''re
    connected, I show you how to mingle with the Linux community by using a few cool
    tools.


    But, first, a little background.


    # # Internet Connectivity 101


    Every Internet surfer is on a quest to find open lanes on the information superhighway.
    Telephone, cable, and satellite television companies are now jockeying for a strategic
    position to fill your future Internet-connection needs. In the'
  merge: -1
