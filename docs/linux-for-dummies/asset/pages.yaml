  md: '# 340 Part V: The Part of Tens


    Fear not. You have a way around this problem! First, you need to reboot your machine.
    While it''s rebooting, it reaches a boot loader, whether it''s a graphical boot
    loader or a command-line boot loader. This boot loader is either GRUB or LILO.
    If you''re using the DVD-ROM that came with this book, it''s GRUB (unless you
    went out of your way during installation to specifically choose LILO).


    If you''re not sure, don''t worry. Just try the GRUB option first, and then try
    the LILO one:


    +   - GRUB: At the GRUB boot screen, press E, which takes you to a configuration
    file. Use the arrow keys to go to the line starting with kernel, and press E again
    to edit that line. At the end of the line, add the word single, press Enter to
    put the change into place, and then press B to boot the machine.

    - LILO: At the LILO boot prompt, type linux single.


    In both cases, the machine boots to a prompt. If it asks you for a login, type
    root and press Enter. It doesn''t ask you for a password. Now''s your chance to
    change the root password to one you can remember. Type passwd, and then enter
    the new password twice as directed. When you''re done, type reboot and boot the
    machine normally.'
