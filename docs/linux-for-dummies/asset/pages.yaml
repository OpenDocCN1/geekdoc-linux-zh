- img_proc: true
  md: '# 124 Part II: Internet NOW


    Each line of your traceroute results represents a hop. This command helps illustrate
    the concept I explain earlier in this chapter, of packets being routed, handed
    off to carriers along the way to move your package closer to its destination.
    Each hop is a physical machine that reads your packet address and forwards it.
    You also notice a latency time associated with each hop. You can identify heavy
    network congestion, or a weak router along the way, by identifying the relatively
    larger numbers in the list.


    Sometimes, especially when you''re troubleshooting, the reason that you can''t
    access your intended Web site, you perform a traceroute that times out somewhere
    along the way. This situation usually indicates that a "traffic accident" has
    occurred somewhere along the Information superhighway. Give it a few minutes and
    try again. TCP/IP is an amazingly robust networking protocol that was designed
    to reroute packets efficiently in the event of a failed network segment.


    If, as you get close to your own network, your traceroute command abruptly stops
    and doesn''t tell you anything, a firewall may be in the way, blocking that information
    from being shared.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_145_0.png)'
