    # Wildcards, or Legal Cheating


    Working at the command prompt implies lots of typing. This becomes painfully obvious
    if you want to deal with a bunch of files and have to type their names one by
    one. Fortunately, you don''t have to do that. You have wildcards at your disposal.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_192_0.png)'
  merge: -1
