    # # Them Dad-Gum Browser Plug-Ins


    Do you ever get irritated at those Web sites that insist that you download a plug-in,
    or additional piece of software, just to view the site? The difference between
    a plug-in and an external program is: A plug-in displays the results in the browser,
    and an external program runs outside the browser. Although these plug-ins are
    annoying if you''re just looking for some basic information, they can provide
    some pretty cool stuff, such as streaming video and music through your Web browser.


    Plug-ins provide browser capabilities extensions, that interface with the browser
    to provide nonstandard features, such as sound and video. The digital age is still
    in its infancy, so the industry hasn''t yet adopted these multimedia formats as
    standard. In turn, the developers have chosen not to build support into the Mozilla
    browser. Rather, the plug-in architecture enables developers to innovate without
    requiring the supporting browser to know what to do with newly emerging media
    formats.'
