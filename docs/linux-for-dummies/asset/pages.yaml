  md: '# Chapter 12: Gettin'' Gooey with the GUIs 211


    Additional X configuration tools come with every Linux distribution. They''re
    not as easy to use as those just listed, but if you need them, here they are:


    +   - XF86Setup: A popular, graphical X Window System setup tool. It uses a simple
    GUI, so it can run on any VGA setup and has a useful graphical interface for configuring
    X. Note that VGA is just an older graphics standard and has fewer capabilities
    than the SVGA cards that are common in most personal computers today.

    - xf86config: A text-based X configuration tool.


    If you really enjoy experimenting with GUIs and fiddling with them, you can do
    a number of things. Go to www.linHuxdoc.org and read the various X Window System
    and XFree86-related HOWTO files. Some are quite technical, but some are a bit
    more friendly, and you may be surprised by just how much you can tweak the Linux
    GUI. You can also find www.gnome.org and www.kde.org, and dozens of other useful
    sites out there.


