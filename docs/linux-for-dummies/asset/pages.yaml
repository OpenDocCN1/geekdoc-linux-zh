  md: '# Chapter 11: Working without the GUI


    +   - who: The who command is related to the whoami command, but it plays not
    only who owns the session, but also the controlling terminal and date logged along
    with every other user logged in to system.


    +   - uname: You can find out about the system you''re running by using the uname
    command. Try adding the -a option on the end for information regarding your kernel
    version and when it was compiled.


    +   - pwd: Knowing whom you''re logged in as is only part of the system— knowing
    where you are. As you find out in Chapter 10, much of navigating Linux is in working
    with files and directories. Unless you''re an astral traveler, you can likely
    be in one place at any time. In the Linux file system, this place is known as
    the current working directory. To determine your current working directory, type
    pwd.


    # # Help!


    The man page system is the electronic manual for Linux (man is short for manual),
    designed to provide users with a convenient reference to all the detailed command
    information. This information includes command prompt options, file formats, and
    function usage.


    The syntax for drawing a man page is man <command name>.


    Don''t know the command you''re looking for or need basic information using the
    man page system? Just type man to get started.


    # # Tracking memory and disk space


    Other useful information for inquiring minds is how much memory and disk space
    is being used. The df command returns a list of all your mounted partitions and
    how much space is used and available of each one. With as many commands, you can
    see terse listing of helpful options by including the -help option on the end
    of the command. Use the df -help command to determine which command option you
    use to display the information in a more familiar byte-size, rather than block-size,
    number (-h).


    That''s all fine and good, but perhaps you''re running out of disk space and you
    want to find some files to delete, or at least know where your space is being
    used. The du command simply returns the number of blocks allocated in the current
    working directory. If you include an argument of a directory path, du returns
    that directory and all subsequent directories, listing the number of blocks used
    in each one.


    I don''t want to overwhelm you right now, but if you type the command top, you
    can see a second-by-second update of how your system is allocating'
