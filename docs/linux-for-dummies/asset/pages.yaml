    a university, I decided that it was time to get hold of my finances, and a spreadsheet
    was the way to do it. These days, I use spreadsheets to keep track of my “time
    card” when I''m consulting or contract work, to help me manage project teams and
    other tasks. I''m sure that you have your favorite uses for spreadsheets. Let''s
    take a look at OpenOffice.org Calc so that you can get to work.


    # # Starting it up


    To start OpenOffice.org Calc in the distributions I cover in this chapter, the
    following:


