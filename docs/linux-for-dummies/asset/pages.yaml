    # Presentations with OpenOffice.org Impress


    Most people would rather eat glass than speak in front of a group of people. Still,
    if you have to, you may as well have some cool presentation software to back you
    up. This program is what I use when I speak at conferences. (I use it when my
    clients want me to send in my presentation in Microsoft PowerPoint Format. Shh!
    Don''t tell— they don''t know the difference!) Give OpenOffice.org Impress a chance
    to impress you.


    # Starting it up


