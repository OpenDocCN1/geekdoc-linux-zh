  md: '# Chapter 15: Multimedia Wow!


    From now on, anytime you start The GIMP, this is what you''ll see unless you close
    some of the dialog boxes — which The GIMP kindly remembers that you closed the
    next time. The GIMP is an incredibly complex program, with entire books written
    for the people who really want to use it heavily. Great starters for working with
