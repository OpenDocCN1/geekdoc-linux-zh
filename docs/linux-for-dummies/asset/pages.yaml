    # Getting Prehistoric with vi


    People tend to have a love-hate relationship with vi. Some think of

    vi as a wonderful, efficient, fast-moving tool (usually, those who know how

    use it); others find it cryptic and confusing. Whether you love it or hate it,

    y can''t get around the fact that if something is wrong with your Linux com-\puter,
    may be the only editor you have access to. The entire program

    is small enough to fit on a single floppy disk — a rare thing these days! Suggest

    that you take the time to get familiar with vi and then try out other editors

    and which one you like best.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_235_0.png)


    Many text editors are available in the Linux world. You probably already have

    vi, pico, emacs, and medit on your system, which you use from the com-\mand prompt.
    If you prefer the GUI, you can use gedit (GNOME default),

    edit, and kedit (KDE default). Each of these editors has a different set of

    features and a different look and feel. Drastic differences exist among the var-\ious
    non-GUI editors.


    # Opening files


    Because vi is a text-based text editor, opening a file is straightforward.

    You just type vi filename with the name of the particular

    file you want to, and the file opens. If the file''s content already exists,

    y can see it in the file. Otherwise, you get a blank screen, as shown in

    Figure 1-3.


