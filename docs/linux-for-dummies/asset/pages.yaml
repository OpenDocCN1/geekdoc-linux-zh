  md: '# Chapter 18: A Secure Linux Box Is a Happy Linux Box


    Linux manages incoming connections in two different ways. The first involves individual
    programs. You can control these using the tools I describe in the section, “Software
    holes,” later in this chapter. The second method of managing incoming connections,
    however, involves a central program that watches many ports. This program answers
    the door when a network client — maybe an FTP client — comes knocking and starts
    the program that handles the service.


    Red Hat, Mandrake, and SuSE Linux all come with security settings you can adjust
    just before and after installation. In Red Hat Linux 10, you can access this by
    choosing Menu>System Settings>+Security Level to open the tool shown in Figure
    18-1.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_338_0.png)


    Your options are Enable Firewall and Disable Firewall. If you have your computer
    directly connected to the Internet — and most computers are — make sure to use
    Enable Firewall. The only time that you should not have this firewall(s) is place
    when your machine(s) are behind a strong firewall already, or you have a critical
    application that won’t work otherwise. For just one application, that’s one high
    risk!


    These strategies work for any firewall, including the ones available in Mandrake
    and SuSE.


    To poke holes in the firewall, you need to work with the lower two sections of
    the dialog. After you have done this, you have access to two different boxes with
    options. Do not select as a trusted device the hardware that connects you to the
    Internet! If you do, you may as well not bother using a firewall! On the other
    hand, if you have a modem connecting you to the Internet and an Ethernet card
    connecting you to other machines in your house, you can select the Ethernet card
    and mark it as Trusted if you trust the folks in your house.'
  merge: -1
  pgno: 338
- img_proc: true
  md: '# 318 Part IV: Sinking Your Teeth into Linux


    If those people have sloppy security on their internal machines, however, you
    may not want to make them trusted either.


    A better approach is to use the Allow Incoming check boxes. If you set up a Web
    server on your machine and want to let people access it, select the check box
    next to WWW (HTTP). The same advice applies if you set up an FTP server (in this
    case, you want to select the FTP check box) or if you''re trying to let someone
    connect securely via SSH (select the SSH check box) or to your computer. I talk
    more about SSH in a moment. If you want to receive e-mail, you definitely need
    to select the Mail (SMTP) check box to allow it.


    When you''re done fiddling with your security options, click OK to activate and
    close the dialog box.


    # The Secure Shell game (SSH)


    One cool thing about Linux is that you can connect to your account from any-where,
    as long as you have the right software (and the machine you''re connecting to
    isn''t behind some kind of firewall). Most people tell you to use the *telnet*
    program to do this, but I beg you not to. Do not open the *telnet* port in your
    security settings. It sends information across the Internet in raw, text that
    anyone can snoop across.


    Before you can connect either in or using SSH, you have to set up **keys**. These
    keys are complex bundles of encrypted stuff based phrases. Think of them as the
    extra deadbolt on the door to each of your accounts, where the normal password
    is the regular lock. First you install the deadbolt (analogous to creating your
    SSH keys) and then use it (analogous to logging in using SSH).


    The cool thing is Fedora Core is set up to do this for you so that you don''t
    have to worry about it. All you have to do in Fedora Core 1 to enable ssh-into
    your Linux box is read the section, "Network hosts," earlier in this chapter,
    and select the SSH check box. This does the firewall to open up that steel door
    it has blocking any access to the *network* port that SSH needs to use. Make the
    changes and that''s it!


    In order to SSH into this machine from the outside, you''ll need to know its name
    or IP address. The IP address is pretty quick to get. Open up a command line window
    and type `/sbin/ifconfig`. Ignore the section labeled with lo; this refers to
    your own machine and is only used for internal networking purposes. In that section,
    find the *inet* addr entry. What follows is the part labeled eth0. What you''re
    looking for is your machine''s IP address, in the format xxx.xxx.xxx.xxx; for
    example, 192.168.1.90.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_339_0.png)'
