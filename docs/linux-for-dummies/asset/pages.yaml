    # Sharing Files by Using NFS


    If you install multiple Linux computers on a network, you may want to share a
    partition or section of the file system between two or more of them. You can accomplish
    this by using the Network File System (NFS), which comes with almost all Linux
    distributions by default. Fortunately, Red Hat Linux 10 comes with a GUI tool
    that helps you to set up this service.


    Today, a common home use for NFS is sharing music files from CDs that you purchased
    across multiple Linux computers. The rest of this section focuses on this use
    as an illustrative example.'
