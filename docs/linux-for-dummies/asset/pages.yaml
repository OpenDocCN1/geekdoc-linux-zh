  md: '# # Chapter 17


    # # Adding Software to Linux


    In This Chapter


    +   * Recognizing tarballs, RPMs, and compressed files

    * Creating tarballs and archives

    * Compressing files

    * Opening tarballs, archives, and compressed files

    * Installing and removing RPMs


    > I will make you shorter by the head.

    —Queen Elizabeth


    When you start using a new operating system, one of the most frustrating things
    is trying to figure out all the goofy file extensions. The Windows world has .exe
    and .zip. The Macintosh world has .bin and .hqx. What about the Linux world? It
    certainly has its fair share of bizarre extensions; but really, they make a great
    deal of sense after you know the programs that make them. In this chapter, you
    find out all about .tar, .gz, .tar.gz, .tgz, .bz2, and .rpm. Anyone up for a game
    of Scrabble with alphabet soup?


    # # Getting Tarred and Feathered


    The Linux and Unix worlds are full of strange terms. If someone comes to you out
    of the blue and starts talking about tarballs, you probably get a mental image
    of sticky, smelly balls of tar, maybe be rolled in feathers. Yet a tarball is
    something you run into regularly in the Linux world, especially when you''re looking
    for software or you need to save yourself some space. A tarball is a bunch of
    files (and possibly directories) packaged together in a tar file and then compressed
    by using the gzip utility.'
  merge: -1
  pgno: 324
- img_proc: true
  md: '# Thunder and tar-nation


    Long time ago, in a galaxy far, away, most data backups were done on tapes. Large
    installations still use tapes, but this practice is getting more and more rare
    among home users because users'' needs aren''t as complex as in a corporate setting.
    The tar (Tape ARArchive) program''s job is to grab a set of directories and preserve
    everything about them, including their permissions, where they were in the file
    system, and more.


    You have many more options these days for backups, but plenty of reasons to use
    tar are still around. Trying to make a backup of your home directory on CD? Want
    to have a single compressed file that contains all your word processing documents?
    You use tar whenever you want to group a bunch of files and directories into a
    single file.


    More often than not, you need the tar command to open a file ending with .tar
    extension that you may have downloaded. To open an archive, use the command in
    the format tar -xvf filename. For example, perhaps you created the file mydocs.tar
    and saved it to another drive so that you could clear out in your home directory.
    To restore these items to your home directory, you must first type cd ~ (~ is
    a useful shortcut for your home directory), and then type tar -xvf mydocs.tar
    to see output similar to the following:


    +   .docs/doc1.txt

    .docs/doc2.txt

    .docs/doc3


    Then, when you do a directory listing, you find that you now have a home subdirectory
    named ~docs that contains the files doc1.txt, doc2.txt, and doc3. Some useful
    options to use with tar when dealing with existing tar files are listed in Table
    17-1.


    | Table 17-1 | tar Extraction Options |

    |---|---|

    | -f | Operates on a specific archive file. |

    | -k | For a file that already exists in the same location, doesn''t replace it
    with the same filename from the archive. |

    | -t | Lists what is in the archive. |

    | -v | Gives verbose output, meaning that you see everything that''s going on.
    |

    | -w | Asks for confirmation before extracting each file. |

    | -x | Extracts files from an archive. |'
  merge: -1
  pgno: 325
- img_proc: true
  md: '# Chapter 17: Adding Software to Linux 305


    Although you mostly need to open tarballs and tar files, from time to time you
    want to create a tarball or a tar file. Usually, the format you use in this case
    is tar -cvf filename.tar list_of_items, where filename is the name of the archive
    you want to create and list_of_items is a spaceseparated list of the files and
    directories you want to package. For example, if you want to archive only parts
    of your home directory, you can type tar -cvf homefiles.tar docs scripts, where
    docs (~/docs), data (~/data), and scripts (~/scripts) are all names. Because you
    include -v for verbose, you get a long list of every individual file that''s being
    added. (I''m a bit paranoid and like to make sure that I''m adding what I really
    want to add!) See Table 17-2 for a list of useful archive-creation-options.


    | Table 17-2 tar Creation Options |

    | Option | Purpose |

    | -f | Operates on a specific archive file. |

    | -k | Doesn''t overwrite the old versions of files if you''re adding newer ones.
    |

    | -p | Doesn''t just store relative path names (for example, ~/docs); stores absolute
    path names (for example, /home/dee/). |

    | -r | Adds files to an existing archive. |

    | -u | Adds files to an existing archive file only if they''re newer than their
    previous versions that are already in the archive; erases previous versions. |

    | -v | Gives verbose output, meaning that you want to see everything that''s going
    on. |

    | -w | Asks for confirmation before adding each file. |

    | -z | Automatically gzips the archive to create a tarball. |


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_326_0.png)


    If you want to check out an alternative to tar, type man pax to see another powerful
    tool at your disposal.


    # gzip it up


    Hard drives may be getting cheaper, but you always have to worry about running
    out of space. You''re probably used to use WinZip and all .zip files out there
    in the Windows world for compressing files or storing groups of files to other
    people. In the Linux world, you see lots of files that end in .gz, for gzip.'
  merge: -1
  pgno: 326
- img_proc: true
  md: '# 306 Part IV: Sinking Your Teeth into Linux


    The gzip utility isn''t as tricky as tar. To compress a file, you type gzip filename,
    and you end up with filename.gz. When you want to decompress a file, you use gzip''s
    cousin, gunzip, in the same manner. So, if you want to open dogpic, when you decompress
    a .gz file, you type gunzip dogpic.gz. The important thing to know is that you
    decompress a .gz — the original file goes away. So, you have no more dogpic.gz;
    just dogpic — although you could have named the file dogpic.jpg so you could see
    which format the image file was in. Be sure to make a copy of the compressed version
    if you want to keep it around, although you can just make another one at any time.


    # Rolling the ball


    Now that you know all about tar and gzip, what''s with all this talk about tarballs?
    As you imagine, a .tar file can get pretty busy with all those individual files
    and directories in. Typically, after you archive something, you compress it. You
    may have even noticed an option in Table 17-2 (the -z option) that allows you
    to compress your archive automatically after it''s created.


    Red Hat Linux comes a program named File Roller that enables you to work with
    tarballs in a GUI Click the Main Menu button to open the Main Menu and then choose
    Accessories<<File Roller.


    In default GNOME and KDE settings, the Main button in the lower-left corner is
    a footprint in GNOME or a big K in KDE. If you installed Fedora Core 1, the Main
    button is the Red header icon in GNOME.


    To create a tarball, you first tar the items you want to archive, and after that
    action is completed, gzip the resulting archive file. Suppose that you want to
    save all configuration files in /etc, just in case bad happens. Make sure that
    you''re logged in as root for this; you need read permissions for every file in
    /etc, and not all the files are accessible to general users. (Aren''t you glad?)
    An alternative is to utilize tar''s -z option, as mentioned earlier, in a format
    such as tar -cvfz backup.tar.gz /etc (Yes, that''s .tgz — it''s shorthand for
    .tar.gz).


    WinZip can open tarballs with no problem on a Windows box!


    When it''s time to open a tarball, you first gzip it and then unpack it — oops,
    that can get confusing because there is no undo command. To open etcbackup.tgz,
    you first type gunzip etcbackup.tgz, which leaves you with the file etcbackup.tar.
    Then, you type tar -xvf etcbackup.tar. You should be aware of one little issue,
    though. When you unpack a .tar file, it typically creates all its subdirectories,
    starting wherever you are. So, if you


