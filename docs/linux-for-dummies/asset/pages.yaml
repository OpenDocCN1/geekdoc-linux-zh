    # Saving files


    Just about every text and document editor has at least two different ways of saving
    a file. The first way involves saving and closing the document. In v1, you save
    and close the document by following these steps:


    +   1. Press Esc to enter Command mode from any mode you may now be in.

    The layout of this screen looks similar to the screen shown earlier, in Figure
    13-1.

    2. Type ZZ to save and close the file.

    The file closes, and you return to the command prompt.


    The second method of saving a file involves saving without closing. To save a
    file and keep working on it in v1, follow these steps:


    +   1. Press Esc to enter Command mode from any mode you may now be in.

    The layout of this screen looks similar to the one shown earlier, in Figure 13-1.

    2. Type : (a colon) to enter Ex mode.

    The bottom of the screen changes slightly, looking similar to Figure 13-1.

    3. Press w and then Enter.

    w stands for write (or save). You''re now back in the file in Command mode.


    > TIP

    Do you want to close the file without saving changes? In the preceding steps,
    follow the first two steps, and when you get to Step 3, type qf rather than w.


