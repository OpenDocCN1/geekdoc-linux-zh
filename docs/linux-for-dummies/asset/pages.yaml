    # Using the SuSE evaluation version


    If you have an operating system on your computer, the SuSE evaluation version
    detects what file system is and borrows some space to write serial files of its
    own. The information kept in these files includes usernames, passwords, and hardware
    information about your computer. By establishing a virtual system, you don''t
    have to make any critical decisions about partitioning and disk formatting that
    could ultimately trash your existing system.


    After performing this virtual installation, you can simply drop the SuSE 8.2 Evaluation
    CD in the caddy and boot it whenever you want to run Linux. Note that you wouldn''t
    want to use this evaluation CD for any serious work with Linux. You would instead
    want to make a full and permanent installation to your hard drive. You notice
    quickly that your SuSE evaluation tends to run slowly accessing a CD-ROM drive
    takes much longer than accessing the average hard drive. Mouse clicks and keystrokes
    feel sluggish. Just remember that it is intended for only evaluation purposes.
    The upside is that the distribution is a remarkable one and likely provides the
    quickest way to see a full Linux graphical workstation in action with the least
    amount of computer knowledge required.


    SuSE has created a powerful, central tool for installation and configuration:
    called YaST2 (a descendant of YaST, which is an acronym for Yet Another Setup
    Tool). Following a few prompts and mouse clicks, the SuSE evaluation CD installs
    in fewer than 15 minutes (see Figure 4-2).


    After the evaluation is booted and running, you will see several menu options,
    including the SuSE tour, a browser link to the SuSE home page, a link to free
    installation support, and a couple links that provide additional information for
