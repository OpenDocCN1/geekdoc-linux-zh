    Mandrake, created in 1998 with the goal of creating an easy and intuitive installation
    for everyone, specializes in ease of use for both server and home/office installations.
    To accomplish this objective, the creators of Mandrake focused on the goal of
    making an easy transition from your Microsoft Windows or Mac skies to Linux. Having
    a system that resembles what you are used to working with greatly shortens your
    Linux learning curve.


    If you like strong user communities, Mandrake has many dedicated supporters. Check
