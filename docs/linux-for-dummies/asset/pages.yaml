  md: '# About the Author


    Dee-Ann LeBlanc, RHCE (Red Hat Certified Engineer), RHCI (Red Hat Certified Instructor),
    and RHCX (Red Hat CertifiedExaminer), is a writer, course developer, instructor,
    and trainer who specializes in Linux. She is the gaming industry editor for LinuxWorld
    magazine, and the author of numerous books on Linux and other computer topics,
    including an upcoming title from O''Reilly & Associates. Dee-Ann is also a regular
    contributor to Computer User magazine and a founding member of the AnswerSquad
    (www.answersquad.com), an online computer help service. When Dee-Ann isn''t teaching
    classes for Red Hat and others, developing course materials, writing technical
    non-fiction or fantasy fiction, chatting about Linux online or at conferences,
    or trying in one way or another to save the world, she hikes with her dogs and
    experiments on her husband Rob with new recipes. See the latest that Dee-Ann''s
    up to at www.Dee-AnnLeBlanc.com. (Contact Dee-Ann at dee@renaisoft.com.)'
