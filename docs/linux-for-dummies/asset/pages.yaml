    same: Remove from Panel and Move. Common entries for the top portion are Help
    and About. The rest of the items are either configuration options (see Step 2)
    or special applet features, such as the ability to copy the date from the Clock
    applet.


    +   2. Choose Preferences from the shortcut menu.

    Not every applet has a Preferences dialog box. If this one does, the dialog opens
    when you choose this option, and whichever configuration this applet has displayed.


    +   3. Alter the selections in the Preferences dialog box to customize your applet''s
    behavior.

    Now you get to have some fun. Make changes so that what this applet can do. Each
    applet has its own set of features, so I cannot do a general walkthrough here.
    Remember that you can always go back and change the settings or remove the applet
    from your panel later.


    +   4. Click Close to put your changes into effect and close the dialog box.

    An option available for all applets is to choose Move from the bottom of the shortcut
    menu. This action allows you to move the applet to another spot on the Panel.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_222_0.png)


