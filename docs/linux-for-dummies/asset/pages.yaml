  md: '# 196 Part III: Getting Up to Speed with Linux


    # Altering the Shell Environment


    You can change several configuration files to alter your bash environment. Each
    of the following files is text and can be edited with any available editor. You
    can simply alter or add the settings you want in each of these files:


    +   - /etc/profile: The system-wide settings. When any user logs in to a bash
    session, this file is read first.

    - .bash_profile: The user-specific login settings, run after the /etc/profile
    file is evaluated.

    - .bashrc: The subshell configuration file that is read each time a subshell instance
    is created. A subshell is called every time a new program is executed. This file
    merely provides another level of shell configuration for this event.

    - .bash_logout: The file that is evaluated when a user logs out of a bash session.
    This file is handy for deleting temporary work files or other housekeeping you
    may want to perform after closing shop for the day.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_217_0.png)


    Note that these last three files are kept in a user''s home directory and are
    hidden, the dot at the beginning of the filename indicates.


    If you experiment with these files, create a separate user account so that you
    can do whatever you want without messing up your login. This adviceicing goes
    for /etc/profile. You can damage everyone''s logins with this one! To create a
    separate /etc/profile, you can make a backup by typing cp /etc/profile /etc/profile.original.
    Then, edit /etc/profile knowing you can always delete it with the rm command and
    use the mv command to rename /etc/profile.original to /etc/profile.


    # Your Handy Command Toolkit


    Now that you have a little more respect for command prompt and what it can do,
    you''re ready to take a look at a few commonly used tools.


    # "I''m lost"


    Want to know whom you logged in as last? Or, perhaps you have chanced upon a terminal
    with no user nearby. A few key commands can give you information about who and
    where you are:


    +   - whoami: By typing whoami on the command line, you can find out to whom the
    current shell belongs.'
  merge: -1
