    # Removable hard drives


    One way to handle multiple operating systems is the removable rack hard drive.
    The installation entails placing a special carriage into one of your computer''s
    hard drive bays. This setup can be installed in most computers by an experienced
    individual or a qualified technician.


    After this component is installed, you can place individual hard drives into the
    carriage, plugging them in and pulling them out as you might with a CD-ROM you
    wouldn''t want to just yank one out in the middle of doing something on your machine!
    Using a removable hard drive setup allows you to have separate Windows drive and
    Linux drive. When you''re using Windows and switch to Linux, shut down Windows
    and pull the drive out. You replace it with the Linux drive and boot as though
    the Linux drive were always there.


    If you''re nervous about managing multiple operating systems and don''t have room
    for a second hard drive in the machine, this is a great alternative. You need
    to make sure that your existing hard drive fit in the rack, as well as the new
    one, and it''s wise to buy more than one loading chassis (used to slide the drive
    into the rack) so you can leave your drives in the chassis when they''re not in
    the machine.


    For more information, PC Hardware in Nutshell from O''Reilly & Associates.


    If you need to computer hardware, I strongly recommend that you seek assistance
    or have a technician install an additional hard drive or removable rack setup.
