- img_proc: true
  md: '# 194 Part III: Getting Up to Speed with Linux


    Almost Linux utilities that require input and output have been plumbed with the
    following common interfaces: stdin (standard in), stdout (standard output), and
    stderr (standard error). By having a common method to feed input to a program
    or read data from the output of a program, you can glue utilities together into
    sophisticated solutions.


    # Redirecting command output


    I discuss redirecting command output here because it''s by far the most common
    form of information detouring. One example of output redirection involves telling
    a command to send its results to a file rather than the screen, as you probably
    have been used to seeing. Start in familiar territory by typing `ls -la ~` and
    pressing Enter, to produce something like the following:


    ```

    total 20 2 sue users 4096 Oct 30 07:48

    drwx-xr-x 5 root 4096 Oct 30 11:57

    -rw-r-- 1 sue users 24 Oct 30 06:50 .bash_logout

    -rw-r-- 1 sue users 230 Oct 30 06:50 .bash_profile

    -rw-r-- 1 sue users 124 Oct 24 06:50 .bashrc

    -rw-rw-r 1 sue users 0 Jan 2 07:48 wishlist

    ```


    Want to send this information to a file instead? You can use the > redirection
    operator to tell bash to send the data into a file instead of onto your screen.
    Enter the following command to send the information to a file named listing:


    ```

    ls -la ~ listing

    ```


    Note that nothing displays on the screen, as you would normally expect. That''s
    because the shell rerouted the output to a file named listing. To verify that
    the directory listing is there, enter the following command:


    ```

    cat listing

    ```


    The cat command displays the contents of the listing file.


    Note that if you type `ls -la ~ > listing`, the data is overwritten, meaning the
    file''s contents are wiped out and replaced with the new output. You can avoid
    this situation by using `>>` as your redirection operator, which tells bash to
    append the command''s output to the end of the specified file. If you type `ls
    -la >> listing` in the same directory after making any changes, the contents of
    listing are as follows:'
  merge: -1
