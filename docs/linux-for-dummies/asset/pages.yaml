    # Deleting text


    The vi editor has a large collection of commands that are useful for deleting
    text. You can use the Backspace or Delete keys, course, but many other options
    are available too. To use the vi deletion features, follow these steps:


    +   1. Press Esc to enter Command mode from any mode you may now be in.

    The layout of this screen looks similar to the one shown earlier, in Figure 13-1.

    2. Use the arrow keys to properly position the cursor for the option to work.

    See Table 13-2 for an explanation of proper cursor positioning.

    3. Press the key or sequence of keys that executes what you want to do.

    Table 13-2 shows some commands you may want to use.


    | Keystroke(s) | Initial Cursor Position |

    |---||

    | #dd | Anywhere within the (first) line you want to delete |

    | #dw | Anywhere within the (first) word you want to delete |

    | p | Anywhere within the line on which you want to paste in the lines that you
    "yanked" with #y |

    | #x | Directly on top of the (first) character |

    | #y | Anywhere within the line on which you want to "yank" (copy) the specified
    number of lines into the vi "clipboard" (called a buffer), and then delete them
    (where # is the same number both times) |


    A # indicates if you include a number, the command works on more than one item.'
