  md: '# Linux Dummies, 5th Edition


    Think of this book as a friendly, approachable guide to tackling terminology and
    the Linux retinue of tools, utilities, and widgets. Although Linux isn''t terribly
    hard to figure out, it packs a boatload of details, parameters, and administratia
    (administrative trivia, Unispeak). You need to wrestle details into shape while
    you install, configure, manage, and troubleshoot a Linux-based computer. Some
    sample topics you find in this book include the following:


    +   - Understanding where Linux comes from and what it can do for you

    - Installing the Linux operating system

    - Working with a Linux system to manage files and add software

    - Setting up Internet access and surfing the Web

    - Customizing your Linux system

    - Managing Linux security system and resources


    Although it may seem, at first glance, years of hands-on experience, tons of trial
    and error, advanced computer science training, and intense dedication, take heart!
    It''s not true! If you can yourself find your office, you can certainly build
    a Linux system that does what you want. The purpose of this book isn''t to turn
    you into a full-blown Linux geek (that is the ultimate state of Linux enlightenment,
    of course); it''s to show you the ins and outs you need to master in order to
    build a smoothly functioning Linux system and to give you the know-how and confidence
    to use it.


    # How to Use This Book


    This book tells you how to install, configure, and customize a Linux system. Although
    you can do most things in Linux these days by pointing and clicking, you may still
    want to try using Linux at the command prompt — where you typed detailed instructions
    to load or configure software, access files, and other tasks. In this book, input
    appears in monospaced type like this:


    ```

    rmdir /etc/bin/devone

    ```


    When you type Linux commands or other related information, be sure to copy the
    information exactly as you see it in the book, including upper- and lowercase
    letters, because that''s part of the magic that makes Linux behave properly.


    A failure to follow instructions can have all kinds of unfortunate, unseemly,
    or unexpected effects. If you don''t know exactly what you''re doing at the command
    prompt, don''t experiment for the sake of exploration — you may come to regret
    your carefree departure from my instructions!


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_23_0.png)'
