  md: '# Chapter 2: Prepping Your Computer for Linux


    # Assessing Your Computer


    Most hardware these days works just fine with Linux. Sometimes, if you have the
    very latest whiz-bang video card or some other fancy new type of electronics,
    there might be trouble, so if you''re an early-adapter sort of person, you''ll
    want to go to your distribution''s hardware compatibility list and make sure you''re
    covered. Fedora Core''s list is available at http://hardware-redhat.com/hcl/.
    Hardware does not need to be listed as Certified. Supported will just do fine.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_52_0.png)


    If you''re new to computers or aren''t familiar with hardware definitions and
    details, you can find a lot of information on the Internet. (One good Web site
    is www.tomhardware.com)


    If your hardware isn''t listed, don''t panic. You might not be able to use the
    very latest-generation video card, but you will be able to use it as a generic
    SVGA at the very least. All is not lost. In fact, sometimes older hardware is
    off the lists but is still supported. Often you''re better off with slightly older
    hardware than with the latest and greatest. If you can''t find your hardware listed,
    do a Web search on the make and model of the hardware, plus the word linux.


    Sometimes you''ll find drivers that have been released for your hardware after
    this particular version of Linux came out. Make sure that you''ve obtained these
    drivers before installing Linux, whether you download them and save them onto
    a floppy disk, or they come on a floppy or CD with the hardware itself.


    Also, try to have your computer manuals (especially the ones for your video card
    and monitor) handy just in case you need them in order to answer a question asked
    by the installer — most people won''t have to deal with this at all, but some.
    At the very least, make sure that you know exactly what video card you have in
    your machine. You might find this information on your receipt, or you can track
    this down by making smart use of your existing Windows installation. I''ll show
    you how in a moment.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_52_1.png)


    If you don''t want to deal with this right now, skip to the section "Finally,
    Preparing for Your Installation" later in this chapter. Then, if the installer
    needs additional information from you later, you can either find what you need
    on the Internet or boot back into Windows and do your detective work before re-starting
    the installation.'
