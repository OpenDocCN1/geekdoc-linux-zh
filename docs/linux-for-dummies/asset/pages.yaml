    - Samba: The best way to integrate Linux servers with Windows users. Samba lets
    your Linux machine masquerade as a Windows server so that Windows users can grab
    files and print documents hassle-free.

    - Apache Web Server: The world''s most popular (or least, most frequently used)
    Web server software.

    - Games!: Tons of games; enough to help you procrastinate for weeks!

    - OpenOffice.org: A full-featured and popular office suite.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_376_0.png)


    If you don''t have a DVD-ROM drive, send the coupon in the back of this book to
    receive the CD set. (See coupon for details.)


    # # System Requirements


    Make sure that your computer meets the following minimum system requirements.
    If your computer doesn''t match up to most of these requirements, you may have
    problems with the contents of the DVD-ROMs:'
  merge: -1
  pgno: 376
- img_proc: true
  md: '# 356 Part VI: Appendixes


    +   - A PC with an Intel-compatible Pentium-class processor: I recommend a 400MHz
    Pentium II or better for using Graphical mode, and a 133MHz Pentium or better
    for Text mode.

    - MS-DOS 6.02 or Microsoft Windows 3.1 or later: These systems conveniently help
    you set up your system, but you can install it from a Linux bootable floppy disk
    without needing DOS or Windows, if you prefer.

    - At least 64MB of total RAM installed on your computer for text mode: You need
    at least 64MB of RAM for Text mode, and at least 128MB is recommended for Graphical
    mode. (Linux can handle as much RAM as you can fit into a typical PC, and is more
    almost always better than.)

    - At least 650MB (the barest minimum) of hard drive space: I recommend 2.5GB and
    as much as 5GB if you want to install all the software from the DVD-ROM. You need
    less space if you don''t install every program, but you should go ahead and make
    5GB of space available, to give yourself more options.

    - A DVD-ROM drive — double-speed (2x) or faster: The faster the DVD-ROM drive,
    the faster your installation experience.

    - Just about any VGA monitor: Just about any monitor works, but you want one that''s
    capable of displaying at least 256 colors or grayscale.

    - A keyboard and a mouse: You need both items so you have a way to communicate
    with your Linux system and tell it what to do!

    - A 3½inch floppy drive: You have to create an emergency boot disk for your Linux
    system. (And although I hope that you never need one, you may thank your lucky
    stars that you have one, if you ever need one.) With this tool in your PC, you
    can also use it to boot from a floppy disk, if you ever need to do.

    - A modem with a speed of at least 55,000 bps (optional): Again, the faster your
    Internet connection, the less time it takes to update your installation to the
    most recent versions. Use a cable modem for my Internet connection, and like the
    increased speed when it comes to dealing with the many and varied sources of Linux
    software and updates online.


    If you need more information on PC basics, check out PCs For Dummies, 9th Edition,
    by Dan Gookin (published by Wiley Publishing, Inc.).


    # Using the DVD-ROM


    You can take either of two basic approaches to using the Fedora Core installation
    DVD-ROM. I cover each one in separate step-by-step lists. I tell you in this section
    how to pick which set of instructions to follow. The two ways to use this DVD-ROM
    are shown in this list:'
  merge: -1
  pgno: 377
- img_proc: true
  md: '# Appendix B: About the DVD-ROM 357


    +   * If you can boot from your DVD-ROM drive (which probably means that you have
    a newer PC), follow the instructions in the following section.

    * If you can''t boot from your DVD-ROM drive, for whatever reason, follow the
    instructions in the section "Booting from a Linux floppy disk," a little later
    in this chapter. Choosing this option means that you boot from a Linux boot floppy
    disk, with the DVD that came with this book already inserted into your DVD-ROM
    drive. (To enable this approach, please check out the instructions in Chapter
    2.) The floppy disk handles the the beginning of the process and then turns the
    rest of the installation over to the DVD-ROM.


    # Booting from the DVD-ROM


    To install items from the DVD-ROM to your hard drive, follow these steps:


    +   1. Insert the DVD-ROM into your computer''s DVD-ROM drive.

    2. Reboot your PC.

    As long as your PC is configured to boot from the DVD-ROM, this step starts the
    Linux installation process for you automatically.


    Congratulations! The Linux installation process is now under way. For the rest
    of the gory details on this fascinating task, please consult Chapter 3. If you
    had to order the CD-ROMs, then boot with the first CD for the same effect as booting
    with the DVD.


    # Booting from a Linux floppy disk


    To install the items from the DVD-ROM to your hard drive with a boot disk (I show
    you how to make one in Chapter 2), follow these steps:


    +   1. Insert the DVD-ROM into your computer''s DVD-ROM drive and insert a bootable
    Linux floppy disk into your computer''s floppy drive. See the instructions in
    Chapter 2 for creating a bootable Linux floppy disk.

    2. Reboot your PC.

    This step starts the Linux installation process for you automatically.


    Congratulations! The Linux installation process is now under way. For the rest
    of the gory details on this fascinating task, please consult Chapter 3.


    And some people say that installing Linux is hard! What could be easier than this?
    On the other hand, if all you want to do is investigate the contents of'
  merge: -1
  pgno: 378
- img_proc: true
  md: "# 358 Part VI: Appendixes\n\nthe Linux installation DVD-ROM, simply insert\
    \ it into your machine's CD-ROM drive. After that, you can browse through the\
    \ DVD-ROM's contents right there in Windows. The contents are described in the\
    \ following section.\n\n# What You n Find in Fedora Core 1\n\nHere's a summary\
    \ of the software on the DVD-ROM, arranged by directory organization. If you use\
    \ Windows, the DVD-ROM interface helps you navigate the DVD-ROM easily; you can\
    \ use most of its contents only if you already have Linux installed.\n\nThe contents\
    \ of the DVD consist of all six CD-ROMs worth of material for Core 1. Not all\
    \ of the software is installed automatically. You find out in Chapter 3 how to\
    \ customize what's added. Aside from that, the DVD has useful tools and a handy-duty\
    \ README file that explains precisely what you find. The directory structure may\
    \ look similar to the following (except for lacking my handy annotations, of course):\n\
    \n```\n/mnt/redhat\n    --> RedHat -- binary packages, incl:\n        --> RPMS\
    \ -- OS, GUIs, Apache, etc.\n        --> base -- info on release 10\n        \
    \    -- used by install process\n            -- source code for the packages\n\
    \            -- in RPMS\n    --> images -- boot & ramdisk images\n    --> dosutils\
    \ -- DOS install utilities\n    --> isolinux -- boot files\n    --> README --\
    \ general read me file\n    --> RELEASE-NOTES -- current info about release 10\n\
    \    --> RPM-GPG-KEY -- GPG sigs for Red Hat pkgs\n```\n\n![](img/e40c80c470cf7ea45bb6271fce82ad29_379_0.png)\n\
    \nBoth CDs include GPG signatures, allowing the installer to check the contents\
    \ of the files against the stored security data to make sure that the files haven't\
    \ changed. (The assumption is that all changes would be for the worse, such as\
    \ Trojan horses or viruses.) Thus, signatures provide a way to make sure everything\
    \ is safe and wholesome for your computer!\n\n# If You've Got Problems (Of the\
    \ DVD-ROM Kind)\n\nI tried best to locate programs that work on most computers\
    \ with the minimum system requirements, as Red Hat did for its operating system.\
    \ Alas,"
  merge: -1
  pgno: 379
- img_proc: true
  md: '# Appendix B: About the DVD-ROM 359


    your computer may differ, and some programs may not work properly for some reason.


    The two likeliest problems are that you don''t have enough memory (RAM) for the
    programs you want to use or that you have other programs running that are affecting
    the installation or running of a program. If you see error messages Not enough
    memory or Setup cannot continue, try one or more of the following methods and
    then try your software again:


    +   - Close all running programs. The more programs you''re running, the less
    memory is available to other programs. Installers also update files and programs;
    if you keep other programs running, the installation may not work properly.


    +   - In Linux, close your GUI environment and run demos or installations directly
    from shell. The interface itself can tie up system memory or even conflict with
    certain kinds of interactive demos. Use the command prompt to browse files on
    the DVD-ROM and launch installers or demos.


    +   - Have your local computer store add more RAM to your computer. This step
    is, admittedly, a drastic and potentially expensive one on the price of RAM at
    the time. If you have a modern PC with less than 64MB of RAM, adding more memory
    can really help the speed of your computer and enable more programs to run at
    the same time.


