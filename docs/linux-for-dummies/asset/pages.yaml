  md: '# Chapter 11: Working without the GUI


    If you want to display exactly what you have specified, use single quotes to create
    a literal text string. For example, type the following line at a command prompt:


    ```

    echo ''Hello, my name is $USER''

    ```


    Kinda goofy, huh? Take a look at a different kind of string that the shell interprets
    differently: an interpolated string. An interpolated value is one in which the
    shell interprets special characters before processing the value. Rather than use
    single quotes, this time you use the same example with double quotes:


    ```

    echo "Hello, my name is $USER"

    ```


    Notice what the output is this. Rather than display the exact text provided, the
    shell replaces the variable name, designated with a dollar sign, with the actual
    value stored in that variable.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_214_0.png)


    Why do I use single quotes in the PS1 example? The items with the backslashes
    (\) are interpreted one way or another. However, if you use double quotes with
    PS1 they are interpreted only once, so that item lists directory in changes only
    the first time. With a single quote, the variables are interpreted every time
    you do something.


    If you''re going to play around with environment variables, I recommend that you
    start by using the methods I describe in this section. After you have decided
    that you''re comfortable with any changes you have made, you can make your changes
    permanent by opening the ~/.bash_profile file and adding the same text there.
    The next time you log in, the changes go into effect. I tell more about making
    changes permanent in an upcoming section.


    Don''t be too discouraged if you don''t understand all this variable stuff right
    now. As you become more proficient with Linux, you should explore shell scripting.
    Shell scripting is the art of creating programs with just the shell. Most Linux
    and Unix administrators speak script language and I speak our native tongues.


    # Using Redirection and Pipes


    Redirection and pipes facilitate the flow of information. A pipe is exactly what
    it sounds like: It directs the output of one program to the input of another program.
    A pipeline may consist of several utilities that are plumbed together by pipes.
    At each end of this pipeline is, optionally, a redirection.'
  merge: -1
