  md: '# 174 Part III: Up to Speed with Linux


    # 2. Select Tree.


    Nautilus now gives you the same two-panel layout with click-and-drag functionality
    you find in Microsoft Windows Explorer.


    TIP The default Nautilus setup varies according to which Linux distribution you''re
    using. In some distributions, this tree panel is set up by default.


    # Browsing your files


    Moving through the file system is pretty easy in Nautilus after you have the tree
    open lets you do a lot of drag and drop stuff. The main thing you need to keep
    in mind is that your directories are on the left (if you have activated the side
    pane and both activated and selected the Tree tab), and your files are on the
    right. You can do the following file management tasks in Nautilus:


    +   - Open a directory on the left: To open a directory within the left pane,
    locate it in the list and click the right-facing arrow next to it. The arrow pivots
    to point down, and if subdirectories exist, they''re now listed beneath the current
    directory.

    - Open a directory on the right: To open a directory within the right pane, locate
    it in the window and double-click it. Linux automatically displays the files in
    this directory.

    - View a directory''s contents: To view the files in a directory, click the directory''s
    icon or the name in the left panel, and its contents appear in the right pane.

    - Look at files and run programs: To view a file''s contents or run a program,
    double-click the item in the listing.


    TIP Are you getting too much information about each file or not enough? Experiment
    with the View Dropdown list box in the upper-right side of the Nautilus window;
    the options include View As Icons (the default), View As List, or View As. The
    first two items pull up a view on the right that gives you different amount of
    information about the files and directories. The third item opens the View As
    Other dialog box, which allows you to set the default behavior for the current
    folder or to alter which programs are opened for file types.


    # Copying and moving files


    You can copy and move items using two different methods in Nautilus (assuming
    you have activated the side pane and activated the tree view). The first is by
    using the usual drag-and-drop method you''re probably familiar with Windows or
    the Mac OS — but only within the right pane — and the other is by using the program''s
    menus. To move a file by the drag-and-drop method, click the file you want to
    move in the listing on the right. Then drag it to the folder you want to drop
    it into within the left pane.'
