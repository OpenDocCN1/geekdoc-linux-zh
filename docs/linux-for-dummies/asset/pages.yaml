- img_proc: true
  md: '# 168 Part III: Getting Up to Speed with Linux


    # Permissions by letters


    One method of telling Linux how you want to change a set of permissions is to
    use letters. You have two groups of characters to use here. The first group consists
    of


    +   - u for user

    - g for group

    - o for other, or everyone

    - a for all (or uago have the same effect)


    The second group consists of the familiar characters that Linux uses for the permission
    triad: r, w, and x. (See "Checking out the triads," earlier in this chapter.)
    Next, you have the operators, which are characters that tell chmod relative to
    the triad you are referring to:


    +   + to add a permission

    - to remove a permission

    - to set the permissions to the exact value


    Now that you have all the pieces, you can begin putting them together. Start with
    the example chmod newpermissions lsfile. Your goal here is to allow no users —
    outside of yourself or your group members — to view the contents of lsfile. From
    this clue, you know that you''re referring to the third triad (the o). Permission
    to determine whether people can view the contents of a file or directory is the
    r position, and the operator used to take away permission is the dash (-). So,
    you chmod o-r lsfile. The deed is done: None of the users in the o (other) group
    can view the contents of lsfile. It is really that easy!


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_189_0.png)


    You can change multiple triads at the same time in a couple of different ways.
    For example, if you want to change lsfile so that only the owner (dee) can read
    its contents, you type chmod go-r lsfile to change both the group and other settings
    simultaneously. Even more complex, if you want to make sure that only the file''s
    owner can read, write, or run that file, you type chmod go-rwx lsfile.


    Technically, you can even type the full set of permissions, if you want. If you
    want both the owner and group to be read lsfile, but only the owner to be able
    to write to it, you can chmod rw-r----- lsfile.


    # Permissions by numbers


    Another method that Linux users commonly use to change permissions is numbers.
    Because this format is used all over the place in Linux documentation, from books
    to courses to manual pages and online references, I truly thought that I should
    include the information for you here — even though it''s a bit technical.'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# Chapter 10: Manipulating Files and Directories 169


    To put it simply, permission numbers allow you to deal with just a raw octal number
    — octal is a numbering system in base 8, meaning that you only use the numbers
    0 to 7 instead of 0 to 9, which is the more familiar base 10 system. The nice
    thing is you don''t need to know more than that about octal in order to use this
    method.


    Look at the following permission set:


    ```

    -rw-rw-r--

    ```


    In the following list, the preceding line of code is broken into its triads:


    +   - Triad 1: rw-

    - Triad 2: rw-

    - Triad 3: r --


    In each position in each triad, the important thing to notice is whether a letter
    or a dash is there. The numeric values for each possible item are


    +   - Every r is worth 4

    - Every w is worth 2

    - Every x is worth 1

    - Every is worth 0


    Each triad keeps its own total. All you need to do is adds the values. So, in
    the case of the sample permission set, you have the results shown in Table 10-4:


    | Table 10-4 | Results of Sample Permission Set |

    |---||

    | Triad | Conversion to Numbers |

    | rw- | 4+2+0=6 |

    | rw- | 4+2+0=6 |

    | r -- | 4+0+0=4 |


    The numeric permission set is basically set so that the value for the first triad
    is the first number, the second value is the second number, and the third triad
    is the third number. The permission set rw-rw-r-- works up to 664.


    If you know exactly what you want to change your permissions to, you use the format
    chmod permissions file with numbers for the permissions. For example, to change
    the lsfile''s permission to rw-------, you type chmod 600 ls1file.'
  merge: -1
  pgno: 190
