  md: '# Chapter 19


    # Eleven Troubleshooting Tips


    In This Chapter


    +   - Dealing with frozen installations

    - Changing your boot environment

    - Recovering when you see some black-and-white text screen!

    - Escaping a hung GUI

    - Using multiple resolutions


    Troubleshooting is like reading a mystery novel. You have some facts, symptoms,
    and details, but you don''t know whunit. You have to take whatever information
    you have, work with that data, weigh the various possibilities, and then narrow
    them to a single suspect. Finally, you need to test your theory and prove that
    your suspect is the guilty party.


    Troubleshooting problems in Linux (or any operating system) can encompass many
    hardware and software issues. Whether the operating system, the hardware, or a
    service is giving you fits, you can use some basic troubleshooting techniques
    to start your investigations:


    +   **Document the problem.** Write down all and symptoms that the system is showing,
    including actions you can and can''t do. Jot down any information you see in error
    messages.


    +   **Examine the Linux log files.** You can find most of these in the /var/log
    directory. Look for the word "error".


    +   **Compare your problem system with a working system.** Sometimes, comparing
    configuration files and settings may uncover the problem or narrow the possibilities.


    +   **Check connections.** Check to make sure that all hardware is connected properly
    and powered on. Verify that all cables and connections are attached properly and
    are at the correct specifications.'
  merge: -1
  pgno: 350
- img_proc: true
  md: '# 330 Part V: The Part of Tens


    +   - **Remove new hardware.** Remove any hardware that you have changed or added
    recently (before the problem started) and see whether the problem disappears.
    If so, you can probably conclude that the new or changed hardware is the culprit.


    +   - **Reduce the number of active programs.** Stop running unnecessary services
    and applications that aren''t related to the problem at hand. You may easily figure
    out what''s happening if other services and applications aren''t getting in the
    way.


    +   - **Check to see whether the problem is reproducible.** Does the same sequence
    of events happen when you try to print to a color printer, nothing happens. If
    nothing happens every time you attempt to print, the problem is reproducible.
    If instead, sometimes your information is printed and at other times isn''t, the
    problem pattern isn''t the same and isn''t reproducible — or is caused by something
    more complicated than just clicking one button. Unfortunately, problems that are
    nonreproducible are more difficult to resolve because no set of pattern re-creates
    those problems.


    After you come up with a solution, take a few minutes to document the situation.
    Note the symptoms of the problem, its cause, and the solution you implement. The
    next time you encounter the same problem, you can call on your notes for a solution
    rather than reinvent the wheel.


    ![](img/e40c80c470cf7ea45bb6271fce82ad29_351_0.png)


    If you don''t have any problems to troubleshoot (yet), document your environment
    before you do. You may want to print some of this information because a future
    problem may prevent you from accessing your files. For a list of lists to document,
    see the section Conquering Configuration Problems, later in this chapter. You
    should also back up your data files regularly (no matter what!) and back up system
    files to tape or removable media if you have the option.


    In this chapter, I cover some points to ponder and tips to try whenever you encounter
    problems with Linux.


    # The Linux Installer Froze


    When you''re installing Linux, the installation may just freeze. If it does, wait
    a bit and make sure that the installation program really froze. (Sometimes, the
    software takes a while to process information.) If the software looks like it
    has frozen, there''s no harm in rebooting your computer and starting over — just
    as you would with any operating system installation. Sometimes, you can reboot
    and never have that problem again. Other times, the problem may happen twice in
    a row and then be fine the third time. Be sure to try several times before giving
    up.'
