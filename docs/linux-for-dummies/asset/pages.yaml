  md: '# 198 Part III: Getting Up to Speed with Linux


    resources, such as memory, and to which processes. Enjoy it as long as you\like,
    and just press Q to exit when you''re done.


    # Clearing the screen


    The clear and reset commands are handy to know about when you''re

    working in a shell. The clear command simply wipes the bash screen clean.

    Don''t worry; it''s not deleting any files or changing and settings—it''s just

    tidying up so that you can start new stuff to the screen again.


    The reset command is a little more interesting. Suppose that you try listing a

    binary file to the screen with the cat command. After the computer finishes

    puk the result of executing the cat command on a binary file, you may get

    lucky and still be able to read your prompt. More likely, your prompt has

    rendered into box characters of no special meaning, and typing on the keyboard

    gives you more of the same. To get back to normal, just type reset and press

    Enter. Note that it doesn''t look like you''re typing the word reset, but rest

    assured that the computer understands the series of characters and, after a

    couple seconds, restore your shell environment to your native language.


    # What''s cookin''?


    A few more status commands can help you keep tabs on your system:


    +   - While top is useful for watching what''s happening, the ps command

    lets you take a snapshot of what''s happening on the system. This com-

    mand returns statistics on all of your processes, or even every process on

    y system.


    +   - kill: One handy use of virtual terminals and the ability to start a shell
    ses-\sion is the ability to sneak up from behind and kill a process that is misbe-\having.
    (It sounds much harsher than it really is.) The kill command is

    usually executed (no pun intended) with the following parameters:

    ```kill -signal process_id```


    +   - signal is a number that indicates the message you want to send to

    the process. Not all messages are designed to destroy the process: Some

    graciously request that the process stops what it''s doing and returning the

    resources to the kernel. The deadly signal is -9, the equivalent of vapor-

    izing the process from the system regardless of the process''s intentions.

    - killall: The killall command, related to the kill command, allows

    y to kill a process based on the name of the command that''s running

    tprocess. For example, I at time I routinely jumped to a virtual-

    and entered killall netscape because some bugs in the software

    emed to run amok. This problem hasn''t

    occur lately, with all the work being poured into Mozilla.'
