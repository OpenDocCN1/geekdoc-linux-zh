    # Linux: Revolution or Just Another Operating System?


    Contrary to popular belief, penguins are not the salvation of modern technology.
    Neither do they throw parties for the urban proletariat.


    > —Anonymous


    Author note: Cute . . . obviously Anonymous has never been to a Linux convention!

    Before going any further, I need to get some terminology out of the way.


    Tux is the formal name of the mascot penguin that represents Linux. Rumor has
    it that Linux''s creator, Linus Torvalds, is rather fond of these well-dressed
    inhabitants of the Antarctic.


    An operating system is the software that runs your computer, handling all of the
    interactions between you and the hardware. Whether you''re writing a letter, calculating
    a budget, or managing your recipes on your computer, the operating system provides
    the essential air that your computer breathes. Furthermore, an operating system
    isn''t just one program; it consists of hundreds of smaller programs and utilities
    that allow us humans to use a computer to do so useful. You then run other programs
    on top of the operating system, like a word processor, to get everything done.


    In recent technological history, Linux has evolved from water cooler techie chatter
    to a rock-solid solution for the business enterprise. The same software that was
    once dismissed as rogue is now being adopted and promoted by industry leaders
    such as IBM, Hewlett-Packard, Motorola, and Intel. Each of these computer manufacturers
    has, in some way, determined that Linux provides value for their customers (as
    well as for their own operations). The only viable company that has publicly denounced
    Linux is Microsoft. Note that one doesn''t have to look very far to conclude that
    Microsoft running scared from the threat that Linux poses to its personal computer
    operating system monopoly.'
  merge: -1
