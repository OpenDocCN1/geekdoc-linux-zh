    \ — from Business Cards to Presentation. In this case, select the latter to the\
    \ AutoPilot Presentation dialog box shown in Figure 14-5.\n\n![](img/e40c80c470cf7ea45bb6271fce82ad29_264_0.png)\n\
    \nTo use this wizard, follow these steps:\n\n+   1. Leave the Empty Presentation\
    \ option selected (unless you have a template you need to work from) and click\
    \ Next.\nnThe Select a Slide Design dialog box appears.\n2. If you want your presentation\
    \ ultimately to appear on something other than a computer screen, adjust the Select\
    \ an Output option to its Medium setting.\n Your choices are Screen, Overhead\
    \ Sheet, Slide, and Paper.\n3. After you have made your selection, click Next\
    \ to continue.\nThe Slide Transition and Presentation Type drop-down list box\
    \ to try the various transitions.\n4. Use the Effect drop-down list box to try\
    \ the various transitions.\n Impress animates these transitions for you as long\
    \ as the Preview box is checked."
