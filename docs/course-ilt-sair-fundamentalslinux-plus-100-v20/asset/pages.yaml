    \ you can do\nman /.5 or even man /cd/foo/bar.1.gz.\n\n# OPTIONS\n\n+   -C config_file\n\
    Specify the man.conf file to use; the default is\netc/man.conf. (See man.conf(5)).\n\
    -M path\nSpecify the list of directories to search for man\npages. If no option\
