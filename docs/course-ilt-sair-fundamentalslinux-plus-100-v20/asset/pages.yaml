  md: "# GNU Applications 7-23\n\n![](img/b0ea5e4a55ee6767fff087672e71c505_208_0.png)\n\
    \n+   * What is GNU?\n* What is Available?\n  * GCC\n  * Bash\n  * GNU Emacs\n\
    * How to Get It\n\n# GNU APPLICATIONS\n\nLinux is basically an operating system\
    \ kernel. Without a beneficial suite of applications, Linux would be almost useless.\
    \ Fortunately, the GNU Project, part of the Free Software Foundation, is dedicated\
    \ to providing a free operating system protected under the GNU GPL (General Public\
    \ License).\n\n![](img/b0ea5e4a55ee6767fff087672e71c505_208_1.png)\n\n# What Is\
    \ GNU?\n\nThe GNU Project was started in 1984 by Richard Stallman to provide a\
    \ free operating system to the computing community. Although GNU software is free,\
    \ it can come with a price. Free refers to the source code of the software, according\
    \ to legal ideas be explained later, must remain open to the public.\n\nGNU software\
    \ is kept open by a manipulation of the United States copyright law and through\
    \ the creation of the GNU GPL. According to the Copyleft, the GPL is sometimes\
    \ called, it would be illegal to create any proprietary software based on GPL\
    \ code. GPL software can be distributed for a fee, provided that the source code\
    \ is distributed along the software.\n\nAt the time of Linux's creation, the GNU\
    \ kernel, the Hurd, was not yet complete. Linux was used as a drop-in replacement,\
    \ creating GNU/Linux, more commonly referred to simply as Linux. The GNU Project\
    \ continues its work on the Hurd, which is nearly complete, but its fate is uncertain\
    \ due to the popularity of Linux."
  merge: -1
  pgno: 208
- img_proc: true
  md: '# What Is Available?


    Almost every possible tool or application designed for a Unix system can be found
    in GNU form. There are also some tools that are GNU originals. These tools cover
    a wide range of uses, from Groff, a document-formatting application based on Troff,
    GNU Image and Manipulation Program (GIMP), designed to be similar to the Adobe
    Photoshop program. Three of the most useful tools are GCC, the Bash shell, and
    GNU Emacs.


    # GCC


    GNU Compiler Collection (GCC) is a collection of compilers and front ends for
    most of the popular languages. Languages that can be compiled by GCC include C,
    C++, Fortran, and Java. A compiler is one of the most basic and necessary utilities
    for an operating system; without this, other applications cannot be created.


    # Bash


    Bash (Bourne Again Shell) is the GNU shell that was originally written for use
    in the complete GNU system, but it is extensively used in GNU/Linux systems. It
    is substantially improved, when compared to the original Bourne Shell (sh), and
    it includes features from both the C Shell (sh) and Korn Shell (ksh).


    # GNU Emacs


    GNU Emacs is basically an editor but has other abilities as well. It can be used
    to edit HTML or source code by using one of its content-sensitive major modes,
    or it can edit any plain text document. Emacs can also be used to read e-mail
    or surf the World Wide Web. The number of possibilities when using Emacs is almost
    unlimited.


    # How to Get It


    One of the easiest ways to acquire GNU-based software is to go to the official
    GNU Web site at www.gnu.org. It has information about everything related to GNU
    products, including help with access and installation of GNU programs and access
    to a few hundred available GNU software titles. These software titles come with
    instructions designed to make the often daunting task of installing an application
    in Linux more bearable.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_209_0.png)'
  merge: -1
  pgno: 209
- img_proc: true
  md: "# Non-GNU Applications\n\n+   - BSD Applications\n- The Artistic License\n\
    - Shareware Licensing\n  - Problems with shareware\n- Multiple Licensing\n- Commercial\
    \ Software\n- Public Domain Software\n\n# NON-GNU APPLICATIONS\n\nGNU applications\
    \ are a portion of what is available for Linux. Commercial software, shareware,\
    \ modified BSD applications, and public domain software are all outside the realm\
    \ of the GPL. They are governed by several different licenses or combinations\
    \ of licenses. Understanding a program's license can provide insight about what\
    \ that can be done with the program. Licenses basically deal with distribution,\
    \ ownership, modification, and generated profit. Licenses allow programs to be\
    \ copied and distributed for free but not sold, while some have restrictions.\n\
    \n![](img/b0ea5e4a55ee6767fff087672e71c505_210_0.png)\n\n# BSD Applications\n\n\
    At first look, BSD applications seem to be unrelated to the Linux OS. BSD has\
    \ a unique licensing method that has helped to form many of the Linux applications\
    \ available today. Behind the GPL, the BSD License is the second most common license\
    \ in the open source world. It is liberal in regards to distribution and use of\
    \ protected software. In actuality, the BSD License only ensures that the original\
    \ copy of a program is protected. For example, all programs derived from BSD code\
    \ must contain the following line: *Copyright (c) The Regents of the University\
    \ of California. All rights reserved.* This is basically the only restriction\
    \ on the use of BSD-licensed software.\n\nThis license has provided many of its\
    \ GNU applications. Because the BSD License only pertains to the original BSD\
    \ software, anything derived from it can be licensed in any way the user chooses.\
    \ Many GPL-licensed programs were BSD-licensed at one time. It is possible for\
    \ other platforms to absorb BSD applications and make them their own. Microsoft\
    \ Windows did this by modifying the Ping and Traceroute BSD programs. Under the\
    \ BSD License, it is legal to create an existing program, modify it, and sell\
    \ it for a profit, as long as the original copyright is maintained. Proponents\
    \ of the strict GPL often find the BSD License to be easier on programmers who\
    \ derive code from existing software.\n\n![](img/b0ea5e4a55ee6767fff087672e71c505_210_1.png)"
  merge: -1
  pgno: 210
- img_proc: true
  md: '# The Artistic License


    The Artistic License was developed to be a middle ground between the GPL and the
    BSD License. Many users find the GPL to be restrictive on derived code, and they
    see the BSD License as providing no artistic control for owners. The Artistic
    License combines the good aspects of both to a strong licensing method. The license
    prevents changes other than minor bug fixes or patches to the software without
    the owner''s consent. In addition, alterations to the original code must be documented
    for public evaluation. The software can be openly distributed and offered in binary
    or source form, no fee to be charged for reasonable transport medium fees.


    Licensed software can be included in commercial distributions as the licensed
    software is not the main application and no changes are made to it. Perl is a
    big proponent of the Artistic License and recommends that all of Perl''s programmers
    use it. Because of this, many Perl programs are governed by this license, and
    it is included in Linux distributions. It is unclear how this license reality
    is protecting software. Some aspects could leave loophole problems if the Artistic
    License becomes a leading software license.


    # Shareware Licensing


    Shareware encompasses a large portion of the software available to be downloaded.
    It plays a smaller role in Linux than other operating systems, but is still found
    on many Linux sites. Shareware is not governed by a universal license. For most
    purposes, shareware is basically closed source software that may be distributed,
    usually in binary form, at no cost. Only the owner is allowed to charge for the
    product. Licensing on each program may vary dramatically. Each owner produces
    his or her own license for the product, which is always available to download.


    Companies wanting to reduce the high cost of production and distribution often
    use shareware to sell their products. Users distribute the software across the
    Web for the owner. The software usually is a trial version, a sample of the fully
    registered version to register for a free within within a certain time from installation
    to receive all the features of the program. For example, VMware, a popular platform
    emulator, is available free of charge as a trial version. After 30 days, the program
    must be registered or it will stop functioning. By using this method, software
    companies can freely distribute software without packaging, transport mediums,
    or hard copy documentation, and they still acquire the money for the full version
    of the software.


    # Problems with shareware


    There are problems with this method. Many program registrations involve a simple
    keyword that is placed on the menu and unlocks the full version of the software.
    Most of these keys code have been cracked, and many of them are available from
    various sites on the Web. These breaches of the shareware license are unavoidable
    and impossible to track, driving many software companies out of the shareware
    business. Shareware still plays a large role in the Windows and MS-DOS world because
    most software is distributed in binary form; source code is rarely included for
    a program on these platforms. However, in the Linux community, shareware has been
    almost totally reduced to game demonstrations and advertisements.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_211_0.png)'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# Multiple Licensing


    Owners have the right to determine which license(s) will apply to their work.
    Some owners will license an unregistered software as shareware, and for a small
    fee, release the source code to the registered users with an Artistic License.
    In this way, the program has licensing for both shareware and the Artistic License,
    which can be determined by the owner. The user would essentially be paying for
    a new license. Perl offers multiple licensing to its programmers in the form of
    either the GPL or the Artistic License. Perl programmers can then choose which
    license their program(s) will be. It is important to know which license a program
    runs. Multiple licensing can cause two identical programs to be governed by different
    licenses.


    Many packages contain components governed by different licenses. For example,
    the Red Hat server package contains both commercial and GPL licensed applications.
    It is legal to duplicate, alter, and distribute the GNU applications, but the
    Red Hat server portion of the package can be used only by that specific user.
    Many software packages are available in differently licensed versions. The Linux
    Qt libraries, which are used to build the K Desktop Environment, are available
    for free with a restrictive license or commercially with more relaxed terms.


    # Commercial Software


    Commercial software makes up the majority of the Windows world, but in the Linux
    community, it is a relatively small portion of the total software available. Commercial
    software generally has the most restricted licenses. Software is purchased in
    binary format (almost always closed source), and no distribution or resale is
    allowed. The program is used as it was created, and the author has control over
    development and distribution. Of all the licenses, commercial licenses are the
    most rigid and heavily enforced. Microsoft Windows is a primary user of the commercial
    license. No source code for Windows or any of its legitimate applications is ever
    released. Microsoft has incredibly tight security protecting its source codes,
    and not even a segment of the Windows code has been leaked.


    Commercial software can be a benefit to an OS, if it is kept in balance with free,
    open source software loses its developmental power. Because most open source software
    is written at no cost by users, development progresses at a constant rate. Commercial
    software companies develop intermittently. One company releases software, then
    another makes dramatic improvements and releases a new version, and so on. Essentially,
    commercial technology and open source programming remain approximately even, but
    they move at different paces. Sometimes users are drawn in by new commercial products
    with extensive advertising and forget the freeware programs that offer the same
    features.


    # Public Domain Software


    Public domain software is software that is not governed by any licenses. Users
    can manipulate, distribute, or sell the software. There is no owner of public
    domain software, and no user or group has control over any of it. The retrieval
    of public domain software is not possible. Once a program enters the public domain,
    it is forever free to the world. For this reason, public domain software must
    always be checked. Suspiciously free software may not be public but actually pirated
    software made available illegally. Many software companies avoid public domain
    software for this reason.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_212_0.png)


    SAIR Linux and GNU Certification -- Fundamentals/(Linux/'
  merge: -1
  pgno: 212
- img_proc: true
  md: "# Printing Process\n\n+   * Overview of Printing\n* Application\n* Printer\
    \ Control Programs\n    * lpr. lpq. iprm. lpc\n* Filters\n    * PostScript\n \
    \   * Magicfilter\n    * Plain text\n* The Printer Daemon\n\n![](img/b0ea5e4a55ee6767fff087672e71c505_213_0.png)\n\
    \n# PRINTING PROCESS\n\nPrinting in Linux is accomplished through the daemon.\
    \ Most applications do not deal with the daemon directly by using the same programs\
    \ a user employs to interact with the daemon. Most applications generate a PostScript\
    \ file, which they send to the printer via the `lpr` command.\n\n# An Overview\
    \ of Printing\n\nThe printing process is a chain of programs, scripts, and filters\
    \ that starts with an application and ends with the printer control daemon, lpd.\
    \ The user can print a file at any level of this chain, though root access is\
    \ needed for the lowest levels.\n\n# Application\n\nMost printing begins with\
    \ the application. Printing plain text, as what might be generated by text-based\
    \ applications like Pine and Vi, is simple. The application simply sends its output\
    \ to `lpr`.\n\nPrinting from GUI applications is more difficult. Output from these\
    \ programs usually involves multiple font sizes, types, and graphics. Since most\
    \ printers have a proprietary page description language, there must be some kind\
    \ of universal language to which print filters can convert for each printer to\
    \ understand. This language is PostScript, which is described in more detail in\
    \ the Filters section below.\n\n# Printer Control Programs\n\nThe next level in\
    \ the printing process involves printer control programs, which can be used to\
    \ add and remove files from the print spool, as well as check and manipulate the\
    \ status of the printer. It is important to understand that these programs do\
    \ not perform any of these tasks themselves. Instead, they request the print daemon\
    \ (`lpd`) perform each task."
  merge: -1
