  md: '# Keyboard


    In the keyboard section, the first question is what type of key map to use. Next,
    the model of the keyboard is required, followed by the keyboard layout.


    # Mouse


    When configuring the mouse, Turboxcfg first probes to identify the mouse, but
    may not detect serial mice. Turboxcfg then selects the protocol for the mouse
    that was detected during the probe. If this is not correct, select the proper
    mouse, and check any applicable options. Finally, Turboxcfg asks for the number
    of buttons on the mouse.


    # Video card


    First, the user is asked if the video card should be probed. In most cases this
    is safe, but it may cause some systems to lock up. Turboxcfg will then present
    a list of video cards. If the card was probed, the detected card will be highlighted;
    otherwise, the card must be selected manually. The amount of video memory is selected
    next.


    # Monitor


    There are two steps in configuring the monitor. First, select the manufacturer
    from the given list, then select the model number.


    # Display modes


    To configure the video modes, select the color depth from the list. After selecting
    color depth, choose the resolution to use.


    # Font path


    The font path option provides a means for setting the default path for the X Window
    fonts. There are two options available, accept defaults or configure manually.
    Using accept defaults will set the font path to default values. The configure
    manually option will let the user set the path to each individual font.


    Two more options should be used once configuration is complete. First, the Test
    X Configuration option starts the X Window System to test the configuration. Finally,
    the Write Configuration option will will the configuration if it is working properly.'
