    # MEMORY


    Every computer comes with a certain amount of physical memory, usually referred
    to as main memory or RAM. The term memory identifies data storage that comes in
    the form of chips, and the word storage is used for memory that exists on tapes,
    disks and CDs. Some computers also use virtual memory, which expands physical
    memory onto a hard disk.


    Memory is used to store information for many different purposes, and each purpose
    uses various types of memory. This is because hard drives and secondary storage
    units are so much slower than RAM, (about 2 million times slower). This means
    that the processing of data is much slower.


    Providing adequate memory to a computer system will cause less data to be transferred
    to the hard disk during processing. This will result in a faster computer. If
    enough memory is provided, data will not have to move between the hard disk and
    the CPU during processing. Secondary storage units will only be used to retrieve
    the initial processing data. This will allow the computer to run at its optimum
    speed.


    # RAM


    Random Access Memory (RAM) serves as the primary memory for a computer (main memory).
    When a program is started it is loaded into RAM to be processed/run. There are
    several types of RAM, each differing in physical size, speed, and insertion slot
    requirements. All variants of RAM fit in one of the following two categories:
    SIMM and DIMM.'
