  md: "# Desktop Environment\n\n+   * Gnome\n  - Gnome panel\n    - Menus, applets,\
    \ launchers, drawers, other applications\n  - Gnome desktop\n  - Gnome applications\n\
    * KDE\n  - KDE panel\n  - KDE desktop\n  - KDE software\n    - KDE Control Center,\
    \ libraries\n\n# DESKTOP ENVIRONMENT\n\nGnome and KDE are the two most popular\
    \ desktop environments. A desktop environment is more than a polished look for\
    \ the X window. An environment includes many pre-packaged utilities such as file\
    \ managers, organizational tools, Internet tools, configuration tools, word processors,\
    \ and many more. The desktop environment attempts to make the X window environment\
    \ a user-friendly work space.\n\nA window manager, on the other hand, is simply\
    \ a GUI interface, a subset of a desktop environment. There are numerous choices\
    \ of window managers available to X window users. Just a few of these window managers\
    \ are: Afterstep, Enlightenment, FVVM, ICEWM, Sawfish, and gwm. Some users prefer\
    \ to use a window manager instead of a full desktop environment.\n\nGnome and\
    \ KDE are explained in more detail in the following sections. The user should\
    \ visit **www.gnome.org** or **www.kde.org**, the official Gnome and KDE Web sites,\
    \ in order to get the look and feel of each of the window managers.\n\n# Gnome\n\
    \nGnome\nnGnome is a fully configurable desktop environment. It provides the ability\
    \ for Gnome-compliant applications to be integrated into a stable, interactive\
    \ environment for running and developing programs.\n\nGnome is multi-faceted;\
    \ it provides a configurable panel for the user, a desktop, and many applications.\
    \ The Control Center can configure all of the aspects of a Gnome session. The\
    \ software libraries that comprise Gnome are used by developers to create Gnome\
    \ applications. This allows for desktop environment completely integrated with\
    \ other software.\n\nFigure 6-12 is a screen shot of a Gnome session. It will\
    \ provide a graphical guide to the explanation of Gnome's different parts:"
  merge: -1
