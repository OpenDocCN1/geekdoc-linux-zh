  md: "# Creating a Password 4-7\n\n# Creating a Password\n\n+   * Creating a Password\
    \ When Adding a User\n* Changing a Password With passwd\n* Constructing a Safe\
    \ Password\n* System Password Parameters\n  * Minimum length\n  * Limitations\
    \ on repeated characters\n  * Minimum password character difference\n  * No dictionary\
    \ words\n* User Password Parameters\n  * Never familiar term, write down a password,\
    \ or reuse\n\n# CREATING A PASSWORD\n\nMany security issues arise when multiple\
    \ users have access to information on a networked system. Two examples are that\
    \ the system must be protected from potentially malicious people and that each\
    \ user has the right to keep data private. In a multiuser networking OS, Linux\
    \ must implement strict security measures. One of these is its file permission\
    \ system. However, the fundamental defense against system intrusion is the use\
    \ of passwords. A password is a security measure that is difficult to overcome.\
    \ It is a piece of information that should be known only to the user, and its\
    \ purpose is to authenticate the.\n\n# Creating a Password When Adding a User\n\
    \nPasswords are created when new user accounts are added and can be changed by\
    \ the user or the system administrator at any time with the passwd command. To\
    \ create a password when adding a new user, issue the useradd command as root.\
    \ The system will request various information, and the last step will be to set\
    \ the password. This sequence will be similar to the following:\n\n```\nChanging\
    \ password for user\nEnter the new password (minimum of 5, maximum of 8 characters)\n\
    Please use a combination of upper and lower case letters and numbers.\nNew password:\n\
    Re-enter password:\nPassword changed.\n```\n\nThe user will have to enter a password\
    \ twice, because the password is not shown when it is entered. This ensures that\
    \ it was entered identically both times and that the user did not type the password\
    \ incorrectly. Following this step, the user should be able to access the account."
  merge: -1
  pgno: 84
- img_proc: true
  md: 'NOTE: If Network Information System (NIS) is being used to share information
    within a network, ypasswd must be used and work the same as passwd. The NIS master
    server must also run /var/passwd/make to update the databases on all connected
    computers with the new user information.


    # Changing a Password With passwd


    The passwd command is used by the system administrator or a regular user to change
    an account''s password. When invoked by a user, passwd will change only that user''s
    password. As root, passwd to change the password for any user by typing passwd
    user.


    When passwd is invoked, a sequence similar to the following occurs:


    +   - Changing password for user

    - Enter old password:

    - Enter new password:

    - Re-type new password:

    - Password changed.


    This sequence is similar to that of adding a new user, the user is prompted to
    enter the old password. This is another security precaution against unauthorized
    users. For example, if this security measure did not exist and a terminal was
    left unattended, anyone could use it to change your password, come back later,
    and gain access to the system. When changing someone else''s password as root,
    there will be no prompt to enter the old password.


    # Creating a Safe Password


    A password is a considerable barrier to protect against intruders. The individual
    who creates a password determines the strength of the barrier. Keeping information
    safe from others is not only an important personal concern, it can also be an
    important corporate or legal concern. Choosing a password that may be easy to
    guess or steal puts that user''s information and the entire network at risk. For
    reason, there are parameters that both the system administrator and the user should
    follow to ensure that passwords are secure.


    > NOTE: It is important to never share a password with anyone, not even the system
    administrator. If possible, refrain from writing a password down where it could
    be easily found and exploited.


    # System Parameters


    The following are a parameters that the system administrator can set, which will
    prevent the use of certain passwords. When a user attempts to change his her password,
    the new password is run through the selected parameters for authentication. If
    it does not pass, the user must choose another password.


    +   - Minimum length - A password must have a minimum number of characters. The
    more characters a password has, the more difficult it is to decode.


    +   - Limitations on repeated characters - This prevents users from entering simple
    passwords of repeated characters.


    +   - Minimum password character difference - This keeps users from changing only
    one or two characters in their passwords when a change is necessary.


    +   - Dictionary words - This prevents the use of words that would be found in
    a dictionary. In many cases, someone attempting to compromise the security of
    a system will run a program that will attempt to log in with a dictionary file
    supplying passwords.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_85_0.png)'
  merge: -1
  pgno: 85
- img_proc: true
  md: '# User Password Parameters


    There are also precautions individual users can take when creating a password,
    to decrease chances of someone guessing or cracking that password. The following
    three practices are good habits:


    +   - One should never use a password with which he or she could easily be associated,
    such as a social security number, a mother''s maiden name, a license plate number,
    or a favorite color. Never work around this rule by simply spelling one of these
    backward.

    - Never write down a password or put it in an e-mail. It should be easy to remember
    but impossible to guess.

    - Try not to use the same password for different situations, such as applications
    and online registrations.


    It may seem difficult to choose a password that succeeds in overcoming these basic
    restrictions; however, there is an almost infinite number of possible passwords
    available by using all available characters with standard Linux passwords. Even
    if one combined the dictionaries of 10 major languages and did various permutations
    on all the words, the total number of generated words would be only 5,000,000.
    That leaves a substantial number of secure passwords from which to choose.'
  merge: -1
  pgno: 86
