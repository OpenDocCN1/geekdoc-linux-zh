  md: '# Module 7 — Linux Applications


    Pressing <ESC-CTRL-S> will open a search for a regular expression. To search for
    the phrase linux, like <ESC-CTRL-S> linux, the cursor will move to the place in
    the current file where linux is first found. If no instances are found, an error
    message is returned. An incremental search is performed by typing <CTRL-S> again.
    The search will move the cursor to the first expression starting with l, then
    to the expression beginning with li, followed by lin, and so on, until the word
    linux is located.


    Cutting and pasting


    There are two types of text cutting in Emacs: deleting and killing. When text
    is deleted, it is removed completely from the Emacs program. However, when text
    is killed, it is placed in the kill ring, which is a buffer that can be pasted
    back in the file.


    To delete a character, the <CTRL-D> command is used, while delete an entire word,
    the <META-D> command is used. Killing uses different commands. To kill a line,
    use the <CTRL-K> command. Pressing <CTRL-K> once will leave an empty line. To
    kill the entire line and the linefeed, <CTRL-K> twice. Once text has been placed
    in the kill ring, it may be retrieved by pressing <CTRL-Y> as many times as necessary,
    ever going as far as the beginning of the Emacs session.


    # Regions


    In Emacs, a region is a section of text. This may be as long as the entire file
    or as short as a single character. Special commands are used when manipulating
    regions. To mark the beginning or end of a region, the <CTRL-SPACE> command is
    used. After marking a place in the file with this, a user can move the cursor
    to the point where he or she wishes the region to enter and enter the <CTRL-SPACE>
    command. This is the point of insertion.


    With the mark and point, a user can copy or kill the region. <META-W> will copy
    the region to the kill ring, while <CTRL-W> will cut the region to the kill ring.
    The <CTRL-Y> command will paste the region.


    A user is also able to print the region in Emacs by marking a region and pressing
    the <META-X> key, the command line will become available. Type-region 4 in the
    command line to send the region to the print spooler.


    # Windows


    An Emacs session may be broken into many horizontal windows. The current window
    has the focus and the window that is edited by the user. By pressing <CTRL-X>
    <2>, a new window will open with the same file in it. To split the window into
    two new windows, press <CTRL-X> <2> In order to split a window along the vertical
    axis, use <CTRL-X> <3>. To change the current window, click with the mouse in
    a window; press <CTRL-X> <o> or <CTRL-X> <p> to move to the next window or the
    previous window, respectively.


    To open a new window with a specific file, <CTRL-X> <2> <4> [filename]. A window
    may be closed in two ways: with <CTRL-X> <0> or <CTRL-X> <l>. The <CTRL-X> <0>
    command will close the current window, while the <CTRL-X> <l> command will close
    all windows except the current one.


    # Major modes


    Modes in Emacs are customized Emacs sessions that may be loaded at the beginning
    of a session or during the session. They are useful for binding certain keys to
    functions and commands that are specific to the file being edited. For example,
    this is a text mode for editing English text


    ![](img/b0ea5e4a55ee6767fff087672e71c505_193_0.png)'
