    +   - Choose the version of Xfree that you wish to install


    ![](img/b0ea5e4a55ee6767fff087672e71c505_397_2.png)'
  merge: -1
  pgno: 397
- img_proc: true
  md: '# Step 21 Identify Monitor


    +   - Identify the monitor you are using

    - If your monitor is not listed, use a generic monitor setting that conforms to
    the settings of your monitor


    ![](img/b0ea5e4a55ee6767fff087672e71c505_398_0.png)


    # Step 22 Choose Resolution


    +   - Choose the resolution and screen size you prefer


    ![](img/b0ea5e4a55ee6767fff087672e71c505_398_1.png)


    # Step 23 Test X Configuration


    +   - Test your configuration to make sure that X runs properly


    ![](img/b0ea5e4a55ee6767fff087672e71c505_398_2.png)'
