  md: '# Module 7 — Linux Applications


    The 1 and $ in the command above tell the computer to run the command from the
    first line (1) to the last line in the file ($). By typing s, the substitution
    command is invoked. The syntax specifies that the first field after s is the text
    to search for, and the second field will be the replacement text. The g at the
    end of the command informs the program to replace text throughout an entire line.


    # Configuration of Vi


    There are options that may be passed to Vi at the start of the program. A short
    description of the more useful commands is listed in Table 7-1. A complete list
    may be found in the vim (1) man page.


    | Option | Function |

    |---|---|n| -g | If Vi has been installed with GUI support, this option will enable
    the GUI support. |

    | -m | Opens Vi in read-only mode, disabling the saving of any files. |

    | -x | Uses encryption when writing a file. This option will prompt for an encryption
    key. |

    | -- | Typing after this option will tell Vi that any text after this will be
    considered a file name. |


    Table 7-1. Options Available to Vi


    The Vi program allows the user to save configurations in the .exrc file. By placing
    this file in a user''s directory, Vi will read it for configuration of the Vi
    session. Each directory may have its own Vi configuration. To configure Vi, the
    set command is used. This command may be used either throughout the .exrc file
    or during Vi session. This command is used by typing set [option]. These options
    usually have an abbreviated behavior which may be used in place of the full option
    name (represented in Table 7-2 in parentheses). The commonly used set options
    are described in Table 7-2:


    | Option | Function |

    |---|---|n| autointent (ai) | Auto-indentation of text enabled. To delete an indentation,
    type <CTRL-d>. |

    | ignorecase (ic) | When searching, the case of text is ignored. |

    | number (nu) | Line numbers are displayed for each line. |

    | tapstop (ts) [NN] | Tab length is set. To tab length of eight spaces, use set
    tabstop=8 or set ts=8. |

    | window=[NN] | Total number of lines displayed at once is set. set window=30
    will limit the screen to a length of 30 lines. |

    | wrapscan (ws) | Searches are wrapped around the beginning of a file, instead
    of stopping when the end of a file is reached.|


    Table 7-2. Commonly Used Set Options


    A sample .exrc file is shown below:


    +   * set number

    * ignorecase


    This .exrc file configures Vi to show line numbers and to ignore case when searching.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_191_0.png)'
