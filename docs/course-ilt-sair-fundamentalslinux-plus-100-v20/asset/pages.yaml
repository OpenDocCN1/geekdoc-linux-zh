  md: "# Point-to-Point Protocol\n\n+   * Encapsulation\n* Link Control Protocol\n\
    * Network Control Protocol\n  * domain yourdomain.com\n  * auth\n  * username\n\
    \  * lock\n* Options\n* Alternate Ways to Start pppd\n* PAP/CHAP\n\n# POINT-TO-POINT\
    \ PROTOCOL\n\nPoint-to-Point Protocol (PPP) is used to transmit datagrams through\
    \ a serial connection medium. Although PPP provides an easy connection between\
    \ hosts, one of its most common uses is connection to the Internet via dial-up\
    \ modem. It is similar to Serial Line Internet Protocol (SLIP) but has added features\
    \ like error correction and automated login. Besides TCP/IP, it also supports\
    \ many other protocols like Novel's IPX/SPX suite and Appletalk.\n\nPPP consists\
    \ of three main components: encapsulation, Link Control Protocol, and Network\
    \ Control Protocol.\n\n# Encapsulation\n\nPPP encapsulation can be used for multiplexing\
    \ various network layer protocols simultaneously over the same connection. It\
    \ is compatible with most commonly used hardware.\n\n# Link Control Protocol\n\
    \nLink Control Protocol is used to control the functions of a link, such as encapsulation\
    \ and checking the limits on packet size or misconfiguration errors. It can also\
    \ determine if the link is functioning properly and can terminate a link when\
    \ required. In addition, the Link Control Protocol can be used for authentication\
    \ and data compression.\n\n# Network Control Protocol\n\nThe Network Control Protocol\
    \ handles the problems of network layer protocols, such as assigning and managing\
    \ IP addresses. Although PPP can use multiple network layer protocols at the same\
    \ time, there is an individual Network Control Protocol for every network layer\
    \ protocol.\n\nLinux provides the PPP services through a daemon called pppd, which\
    \ is usually located in /usr/sbin directory."
  merge: -1
  pgno: 238
- img_proc: true
  md: 'The configuration file for pppd is stored as /etc/ppp/options, and the default
    settings in this file are listed in Table 8-2:


    | Settings | Function |

    | domaindomain.com | Name of a domain |

    | auth | Authentication of user is required |

    | hostname | Name of local host is used for authentication |

    | lock | File is locked in UUCP style |


    Table 8-2. Default Settings for pppd Configuration


    There are several options of pppd that can be added to the configuration file
    according to the needs of the connection.


    pppd is used to establish a PPP connection and controls most of the PPP functions.
    If the connection is static, pppd can be started from the command line with the
    command:


    ```

    $ pppd /dev/ttys0 38400 crtsacts default

    ```


    If the connection is dynamic, then use the command:


    ```

    $ pppd /dev/ttyys0 38400 crtsacts IP_address

    ```


    When this command is executed, pppd accepts any IP address assigned to it by the
    remote host.


    # Options


    The options in Table 8-3 are also important:


    | Options | Function |

    | /dev/ttys0 | The serial port that pppd should use |

    | 38400 | The speed in bps |

    | crtsacts | Hardware hand shaking has to be used on the connection |

    | defaultroute | Local IP address has to be used for the connection |


    Table 8-3. Other Important Options for pppd


    crtsacts and defaultroute cannot be used with a dynamic connection, but /dev/ttys0
    and 38400 can be used with either type of connection.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_239_0.png)'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# Alternate Ways to Start pppd


    pppd can also be started using a program called dip (Dial-up Protocol driver).
    Another alternative is to use a chat or dial program to start the daemon and connect
    automatically. The chat makes the connection, and ppp configures it. All the details,
    such as telephone number, username, and password, should be specified when starting
    a connection. This information can be entered at the command line, but it may
    make the command line too complex. All this information is stored in files called
    chat and can be retrieved by using the -f option and the file with the name chat.


    Users can start a PPP program after logging into the shell. To start it from the
    user account, the `/usr/sbin/pppd` file has to be setuid-root because root privileges
    are required. This can be done using the command `chmod u+s/usr/sbin/pppd`.


    # PAP/CHAP


    One of the authentication protocols, Password Authentication Protocol (PAP) and
    Challenge Handshake Authentication Protocol (CHAP) can be used to start PPP automatically.


    Using PAP, the identity of the remote machine is established with a two way handshake.
    After the connection is established, the user sends a username/password pair to
    the host and waits for an acknowledgement. This is done only at the start of the
    connection and never again. The host evaluates the username/password sent by the
    user and sends an acknowledgement if it is correct; if it is incorrect, the connection
    is terminated. The disadvantage of PAP is that the passwords are sent over the
    link in clear text form, providing no protection from playback or trail-and-error
    attacks.


    Using CHAP, the identity of the remote machine is established with a three-way
    handshake. After the connection is established, the host sends a challenge message
    to the user, who responds by sending a value calculated with a one-way hash function.
    The host then compares this value to the expected value. If they match, an acknowledgement
    is sent; if they do not match, the connection is terminated. This is done at the
    start of the connection and then at regular intervals, in order to provide protection
    against playback or trial-and-error attacks. In this way, the exposure time to
    an attack is limited. A disadvantage of CHAP, because the authentication is done
    according to values known by both the peer and the host, is that the values are
    stored in both locations, and the password must be available in plain text form.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_240_0.png)'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# Basic Commands for Networking


    +   ping


    +   - Used to troubleshoot or check output of another computer


    +   - Interpreting output


    +   traceroute


    +   - Used to follow path from one computer to host computer


    +   - Interpreting output


    # BASIC COMMANDS FOR NETWORKING


    ![](img/b0ea5e4a55ee6767fff087672e71c505_241_0.png)


    Depending on the protocol setup of a network, certain tools and commands are necessary
    to perform system checks. Simple commands such as ping and traceroute are useful
    because they can be used to analyze a network. These work for systems within a
    local setting or on networks all over the world.


    # ping


    One of the most common networking commands, ping, is used to troubleshoot or check
    the status of other computers on the Internet. The ping command sends out Internet
    Control Message Protocol (ICMP) ECHO_REQUEST packets to the host being tested
    and waits for the host to return ICMP_RESPONSE packets. Although some packets
    become lost in the network, the output of ping will show at least some response
    received, if the host is active. If the host is off-line, the output will show
    a 100 percent packet loss. In addition, ping will report the amount of time for
    the packet to make the round trip from the originating computer to the host computer
    and back to the originating computer. The command usage is as follows:


    ```

    ping [URL or IP address of host] [-dfnqvr] [-c count]

    [-i wait] [-l preload] [-p pattern] [-s packetsize]

    ```


    The IP address in the command line is for the host computer that the user is trying
    to reach or troubleshoot. If a host name is used, ping will attempt to resolve
    it into its IP address using the Domain Name System (DNS) server. The available
