- img_proc: true
  md: '# Network Devices 10-51


    Bandwidth is an indication of the scope of frequencies employed by a transmission
    signal. Higher bandwidths allow for faster transmission of data. Although a medium
    may operate at a given bandwidth, the actual bandwidth may be substantially less.
    For example, the bandwidth of a T1 line is supposed to be 1.54 Mbps, however transmission
    speeds are usually less. This is often due to the use of the line by multiple
    users or differences in the transfer rates of the actual data media between the
    line and the user. Implementing higher quality networking devices and hardware
    designed for higher transfer rates would increase bandwidth and speed up the network.
    In high traffic situations where available bandwidth is limited, another phenomena
    that can slow down a network is the occurrence of packet collisions. Packet collisions
    occur when two systems try to send data over a network at the same time and the
    packets collide, resulting in data being garbled. To prevent this, one can increase
    the size of data packets, place fewer devices on each hub, or implement a switch
    instead of a hub. A final source of bandwidth is high network usage at a given
    time. It is not unusual for a network to experience periods of high usage; however,
    if this is a constant problem and is significantly slowing down the network, one
    may need to make adjustments to compensate for the increased traffic, as physically
    diversifying the network.


    # Infrared


    Infrared devices send and receive data using the infrared portion of the spectrum.
    This is done without wires, using the same technology that is used to send signals
    between a television and a remote control. Infrared communication is gaining popularity
    along with wireless communication, and is already used in a number of PCs and
    peripheral devices. There are several existing applications such as linking notebooks
    and PCs for data transfer, wireless mice and keyboards, optical mice, and wireless
    LANs.


    SAIR Linux and GNU Certification -- Fundamentals/Linux+'
