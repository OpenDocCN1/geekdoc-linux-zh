  md: '# Mouse Options


    When configuring the mouse, the mouse protocol and the mouse port are required.
    In the protocol section, you can select IntelliMouse, Logitech, or MouseMan, depending
    on the type of mouse being used. An auto option is also present. If the user is
    unsure of the type of mouse, auto is a safe option. However, caution should be
    used when selecting auto, as it may only work for PS/2 and bus. If a 2-button
    serial mouse is installed, it may be compatible with MouseMan or Mouse protocol.
    Mouse wheels may be compatible with IntelliMouse. After the protocol, the port
    should be selected. Port selection can be based on the protocol. For instance,
    if the PS/2 port should be chosen as well. If a serial port is selected, then
    serial ports /dev/tty0-/dev/tty3 (COM1-4) should be chosen. Additional options
    are available, as providing three-button mice emulation and setting the baud rate.


    # Keyboard


    The Keyboard menu allows you to select the model (type of keyboard), layout (language),
    and behavior. Examples of behavior are using both shift keys to change a group
    or <ALT-CTRL> to change a group. Keyboards are standard devices and should not
    be troublesome to configure.


    # Video Card


    In the Card options, use the server option to select which brand and type of graphics
    card is to be installed on the system. A list is provided that the setup can recognize.
    For the video card it can be picked from the list or automatically detected using
    video selection. Examples of servers are MONO, SVGA, and Mach8. Each should also
    supply the amount of video RAM that is on the card. The card can be probed to
    find out hardware information, but this may cause it to lock up.


    # Monitor


    There are two different ways to configure the monitor. The values for the horizontal
    and vertical refresh rates can be specified directly or selected from one of the
    default options available. Most monitors should be listed, but some monitors may
    require the ranges to be specified. Use caution before deciding on a setting.
    If the refresh rates are set to invalid ranges, damage can occur.


    # Modeslection


    Under deselection, the user can decide the resolution and color depth for the
    system. The resolution may range from 320 x 200 to 1600 x 1200 dots per inch (dpi).
    The color depth in pixels (bpp) can also be specified. The options are 8, 16,
    24 and 32 bpp. The higher the bpp, the more colors that can be displayed; the
    higher the resolution, the sharper the images.


    # Other


    In the Other menu, there are miscellaneous options which may include Hotkey (<CTRL-ALT-BACKSPACE>,
    which kills the X server), Allow Video Mode Switching, and Video Mode. The Hotkey
    and Video Mode are usually selected by default.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_42_0.png)


    SAIR Linux and GNU Certification -- Fundamentals/Linux'
