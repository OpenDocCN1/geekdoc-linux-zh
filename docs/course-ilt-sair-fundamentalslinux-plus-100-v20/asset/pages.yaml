  md: 'GNU GPL, advantages. GPL software is open to peer review. As a result, faulty
    assumptions are usually identified and corrected. Tens of thousands of developers
    share the same development environment, allowing quick and easy sharing of ideas
    and implementations over the Internet.


    GNU GPL, limitations. One limitation of the GNU GPL is those whose new source
    code, but attempt to make the code unclear. Another limitation of GNU GPL is the
    question of how much documentation to include with the source code. Finally, feel
    that the GPL restricts the use of free software by not allowing it to be embedded
    into other software products.


    GNU GPL, uniqueness. GPL stands out from other software licenses because it keeps
    software intact, allows it to mature over many years, and prevents any one entity
    from controlling the software.


    GPL, GNU General Public License, also called copyleft, is a detailed document
    describing the freedom to use software.


    GPL, keeping free software. The GPL attempts to maintain free software by mandating
    that all code, including source, must be included in any redistribution of the
    software, and any new code added to the software must be included in the redistribution.


    GPL, response to users. Acting from self-interest, many different developers,
    over time, contribute to GPL software. This public process leads to code review,
    bug fixes, and improved features that benefit the needs of all users.


    graphic mode filters. Printer filters may be attached to the printfile to automatically
    select PostScript or a graphic-mode format for the printer.


    graphic-mode printing. In graphic mode printing, the CPU spends the instructions
    for printing each pixel of an image.


    graphic mode. The organization of video memory in the number of X and Y pixels,
    plus the number of colors per pixel.


    graphic resolution. The number of X and Y pixels plus the amount of information
    for each pixel (pixel depth).


    GUI. User Interface.


    GUI utilities, disadvantages. Not all commands are supported in the GUI, and some
    GUI utilities perform multiple commands without feedback or undo operations.


    GUI utility, trade-off. Although convenient, these GUI configuration utilities
    perform multi-step operations without informing the user; they may interfere with
    other configurations.


    GUI, starting. A script started celui will run the server and window manager from
    the command line, if xdm is not running.


    h switch. Suppresses the header, or job control page, that shows the user name
    and file name. If the printer is not directly connected, this switch is required.


    Halloween memos. A very favorable interval Microsoft analysis of what is called
    the open source movement, but which is really an analysis of GNU GPL software.


    help information, paging. Sometimes there is more information than will fit on
    a single screen and information scrolls off the top of the screen. Pipe the output
    to a pager utility, such as more or less.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_376_0.png)


    SAIR Linux and GNU Certification -- Installation and Certification'
