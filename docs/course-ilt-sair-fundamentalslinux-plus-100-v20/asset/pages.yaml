  md: "# Understanding Partitions\n\n![](img/b0ea5e4a55ee6767fff087672e71c505_52_0.png)\n\
    \n+   * Types of Partitions\n  * Linux native partition(s)\n  * Swap partition(s)\n\
    * Boot and Root Partitions\n  * The boot partition\n  * The root partition\n\n\
    # UNDERSTANDING PARTITIONS\n\nF0.2.40\n\nA partition is a logical section of a\
    \ disk that is prepared for a particular operating system to store its data. Every\
    \ operating system uses at least one partition. A Linux system will work with\
    \ a single partition, this configuration is rare. More commonly, Linux uses a\
    \ swap partition and any number of file system partitions. Below are the different\
    \ types of partitions used on a Linux system.\n\n![](img/b0ea5e4a55ee6767fff087672e71c505_52_1.png)\n\
    \n# Types of Partitions\n\nLinux partitioning tools are quite versatile, allowing\
    \ for many different types of partitions to be created. A typical Linux machine\
    \ will use two types of partitions:\n\n+   * Type 83 - Linux Native\n* Type 82\
    \ - Linux Swap\n\n# Linux native partition(s)\n\nLinux native partitions are type\
    \ 83. The type refers to code used in fdisk or other tools that identify the type\
    \ of partition. There needs to be at least one native partition on a given machine,\
    \ but there can be more. The native partition where a file system is created and\
    \ Linux installations or other files are stored. Several important points need\
    \ to be made about Linux native partitions:\n\n+   * To install Linux on a machine,\
    \ there must be a native partition.\n* The native partition type must be 83.\n\
    * The partition works best if it is between 1 and 1024 cylinders of the drive."
  merge: -1
  pgno: 52
- img_proc: true
  md: '# Swap partition(s)


    Swap partitions are type 82. The purpose of swap partitions is to provide a dedicated
    disk area for virtual memory. Linux uses swap space to store unused memory contents.
    This allows the system to run more programs than any physical memory could contain,
    or gives the impression that they are running simultaneously. However, a computer
    that consistently runs too many programs will suffer performance problems from
    swapping out too much information to the drive.


    Regardless of how much memory is in a system, a swap partition is always desirable.
    In systems with 16 MB or less memory, though, a swap partition is necessary. Use
    a maximum of 128 MB for swap space with pre-2.4 kernel configurations. Some distributions
    recommend using more than 128 MB with 2.4 kernel versions due to improved handling
    of processes and swap.


    # Boot and Root Partitions


    # The boot partition


    Many system administrators prefer to have separate boot and root partitions. Often,
    primarily to contain the kernel image and some recovery utilities, a 20 to 50
    MB boot partition is used.


    A boot partition must be type 83, or Linux native, and be a primary partition.
    While a logical partition could be used for boot, it can cause system complications.
    If using earlier versions of LILO, the boot partition should be contained between
    cylinder 1 and 1024 of the drive. For later versions of LILO, simply replace the
    option linear with lba32; this will allow users to place the boot partition anywhere
    on the drive. The results vary.


    # The root partition


    The root, or forward slash (/), partition is where the bulk of the Linux system
    will be installed. It is preferable to make this a primary partition, although
    it can be a logical partition. Often machines are configured with only two partitions:
    root and swap. The root partition then contains the boot partition information,
    typically in the /boot directory. Although it is not standard for a machine to
    contain only two partitions, Linux is flexible enough to adapt to any needed configuration.
    When all three partitions are present, the root partition is used to store all
    files not on the boot partition. Installing all files (full installation) between
    1.5 GB and 4 GB is required, depending on the Linux distribution.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_53_0.png)'
  merge: -1
  pgno: 53
