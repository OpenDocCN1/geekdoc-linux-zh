  md: '# LAB 05-01 - DOT (.) AND DOTDOT (..)


    # Purpose


    This lab is designed to provide some experience with the dot (.) and dotdot (..)
    directories. The intent of this lab is to provide some insight into what . and
    .. are as well as examine the purpose for the various links to directories. Finally,
    this lab will explore disk space allocation of directories.


    # Lab Duration


    5 to 10 minutes.


    # Overview


    In Linux and most Unix-like environments, every newly created directory will by
    default come with two directories inside, the dot (.) and the dotdot (..). There
    are most likely many computer users who have used either of these two directories
    without being aware of it. For example, cd .. is a commonly used command for changing
    directories to the directory one level above the current directory. Here, .. is
    of course to the command, and would be the name of the directory. The only thing
    that makes this command unique is the name of the dotdot (..).


    Let us now examine the contents of a directory. The following output was obtained
    using the ls command. The directory listed here is on a 1.44MB floppy disk.


    total 5


    | 2 drwxr-xr-r-- | 2 root | root | 1024 Apr 24 16:14 |

    | 471425 drwxr-xr-x-- | 6 root | root | 4096 Mar 30 13:36 .. |

    | 11 --rw-r-r-- | 1 root | root | 0 Apr 24 16:14 file01 |

    | 12 -rw-r-r-- | 1 root | root | 0 Apr 24 16:14 file02 |

    | 13 --rw-r-r-- | 1 root | root | 0 Apr 24 16:14 file03 |

    | 14 -rw-r-r-- | 1 root | root | 0 Apr 24 16:14 file04 |

    | 15 --rw-r-r-- | 1 root | root | 0 Apr 24 16:14 file05 |

    | 16 --rw-r-r-- | 1 root | root | 0 Apr 24 16:14 file06 |


    0 Apr 24 16:14 file06nThe third line gives information about the .. directory.
    The first number in the list is the inode number for this directory followed by
    the type of file and permissions for the directory. The 6 in this list is the
    number of links to this directories, and the next two are the owner and the group
    to which this directory belongs. The 4096 represents the size of the file or directory
    in bytes, which is 4K for this. The last two entries in the list are the creation
    date and the name of the file.


    An interesting fact about the file system on this floppy is that it was created
    with only 16 inodes. It would seem odd that the dotdot (.) has an inode number
    of 471425, and also that the dotdot (..) directory has six links. The reason for
    the number of links and inodes can be found by examining the next higher directory.
    By comparing the contents of this directory to the contents of the floppy directory
    it is evident that the inode and link count for the dot directory is the same
    as those for the dotdot directory in the floppy directory. A few exercises will
    help to discover why this is so.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_146_0.png)


    SAIR Linux and GNU Certification -- Fundamentals/+'
