  md: 'There is a difference between interrupting and suspending the process. A process
    can be suspended by pressing <CTRL-Z>, and it can be restarted. The user gets
    the following message in the standard output:


    +   [1] Stopped yes > /dev/null


    # Restarting background programs


    To restart the job in the foreground, use the command:


    ```

    $ fg

    yes > /dev/null

    ```


    The prompt will not reappear if the yes program is still running. To kill the
    yes program, use the <CTRL-C> sequence. This sequence will kill the present program.


    The job in the background cannot be suspended by using <CTRL-Z>. First, put the
    job in the foreground with fg, then stop it with <CTRL-Z>.


    The user may be running multiple jobs in the background, in which case the following
    command can be used to move the job in the foreground, when 2 is the job number.


    ```

    $ fg %2

    ```


    The job control parameter of the set terminal (stty) utility can also be used
    to restrict the background job. The command given below stops the background job,
    if it tries to send the output to the terminal:


    ```

    $ stty tostop

    ```'
