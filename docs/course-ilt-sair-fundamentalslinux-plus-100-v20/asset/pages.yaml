  md: "Private Networks\n\n# Private Networks\n\n+   - Security\n- Tunneling\n- IPSEC\n\
    \  - pluto\n  - leftfirewall/rightfirewall\n  - conn\n  - leftid/rightid\n  -\
    \ left/right\n  - leftrsasigkey/rightrsasigkey\n  - leftsubnet/rightsubnet\n \
    \ - auto\n  - leftnextop/rightnextop\n\n![](img/b0ea5e4a55ee6767fff087672e71c505_266_0.png)\n\
    \n# PRIVATE NETWORKS\n\nToday and more information is being sent over the Internet.\
    \ Most of this data is not encrypted, making it easily accessible to an outside\
    \ party. As more businesses connect their internal networks to the Internet, a\
    \ greater opportunity exists for hackers to gain access and compromise data. As\
    \ the world becomes more interconnected, the need for a secure means of communication\
    \ increases.\n\n![](img/b0ea5e4a55ee6767fff087672e71c505_266_1.png)\n\nHistorically,\
    \ businesses needing to connect with a distant office were faced with two options.\
    \ Businesses would either institute a private network in which they ran the lines\
    \ themselves, or they would lease dedicated lines. By owning or leasing the network\
    \ lines, businesses access to the network, which ensured reliability and, most\
    \ importantly, security. However, the rise of the Internet has provided a relatively\
    \ cheap medium to transport information over distances. While the Internet is\
    \ less expensive, the trade-off is that the structure of the Internet makes it\
    \ inherently insecure.\n\n# Security\n\nThe protocol of the Internet, and most\
    \ internal networks, is TCP/IP. The Transmission Control Protocol (TCP) portion\
    \ controls the layout and format of the data. The Internet Protocol (IP) portion\
    \ controls data delivery. The path taken by the packet is not definite and is\
    \ subject to change due to traffic, broken routers, and other technicalities.\
    \ IP delivers data using the path available. After the packet is sent, the sender\
    \ has no control over the path taken by the data packet.\n\nAs more users and\
    \ companies connect to the Internet, new access points, bandwidth, and routers\
    \ are added to handle the additional traffic. Routers deliver data to a new router\
    \ or computer and have the capacity to re-route data to another location if there\
    \ is a network malfunction or excessive traffic. Therefore, the route taken by\
    \ data is not definite, is subject to re-routing through seemingly illegal paths.\
    \ In fact, data from the same source may take entirely different paths to a destination.\
    \ Hence, there is little control over which location the system data might pass\
    \ through. With unknown routes over different networks, the potential for someone\
    \ to monitor data increases.\n\n![](img/b0ea5e4a55ee6767fff087672e71c505_266_2.png)"
  merge: -1
  pgno: 266
