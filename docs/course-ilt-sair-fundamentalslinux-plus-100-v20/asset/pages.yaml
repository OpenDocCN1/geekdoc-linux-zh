  md: '# Concepts Related to X (Client/Server Model)


    # Concepts Related to X (Client/Server Model)


    +   * X Window Client Server Model


    +   * Uses client server model of application management

    * User can run remote applications

    * X server does not perform any real computing

    * Directly controls input, output via keyboard, mouse, display

    * X clients use applications provided by X server

    * Clients and server communicate through X protocol


    ![](img/b0ea5e4a55ee6767fff087672e71c505_152_0.png)


    # CONCEPTS RELATED TO X (CLIENT/SERVER MODEL)


    ![](img/b0ea5e4a55ee6767fff087672e71c505_152_1.png)


    The X Window System, sometimes referred to as X, is a network-enabled windowing
    system for Unix and Unix-like systems (including Linux), which was developed in
    the 1980s at MIT. X has several features that make it unique. One feature is that,
    unlike the windowing systems of other operating systems such as Mac OS or Windows
    9x, it is not an integral part of the operating system. Instead, it is an application
    that is layered on top of the operating system. In other words, it is possible
    to have a fully functional Linux system without using the X Window system at all.
    However, GUIs are easier for most users, those migrating from Windows.


    # X Window Client/Server Model


    The X Window uses a client/server model of application management. The advantage
    of the client/server model is that a user can run remote applications and have
    those applications displayed on the monitor.


    The X server does not perform any real computing as conventional servers do. Instead,
    it is responsible for directly controlling the display and managing all input
    and output via the keyboard, mouse, or display. The X clients, on the contrary,
    are the applications which use the services provided by the X server to display
    their output. The clients and servers communicate using the X protocol.'
  merge: -1
  pgno: 152
- img_proc: true
  md: '![](img/b0ea5e4a55ee6767fff087672e71c505_153_0.png)


    # Figure 6-1. Local and Remote Clients


    X clients can be operated either locally or remotely. A local X client runs on
    the same machine as the X server, while a remote X client runs on a machine other
    than the server. Suppose a user decides to run an X program remotely. He or she
    starts the program on another system on the network and tells it to use the X
    server running on his or her system for the console. By doing this, the X client
    sends its output to the X server running on the machine, and, in turn, it gets
    mouse and keyboard input from the X server. Running an application on a remote
    system is advantageous when the local machine does not have enough computing power.
    In such cases, the local system would run the X server, the X client could run
    on a powerful machine such as a mainframe, and the output can still be viewed
    on the local machine.'
  merge: -1
