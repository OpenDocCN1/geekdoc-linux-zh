    # The kill command


    Suppose, for example, a user noticed that system performance has slowed tremendously.
    The user might find a particular program that has been running earlier in the
    day due to a large amount of memory. The user might find that they thought they
    had closed the program. In order to free up the system resources, the user would
    need to kill the process. This is done with the kill command. To use the kill
    command on a process, a user must know that processes PID and have ownership of
    the process. After using top ps to obtain the PID of the offending process, the
    user would issue the kill command with the PID as the argument. For example, to
    kill a process with PID 3744, the user would enter:


    ```

    kill 3744

    ```


    If some reason the process was not killed and still appears to be running, the
    user would use the -9 signal. It immediately kills the process rather than sending
    the TERM signal, the default signal for the kill command.


    ```

    kill -9 3744

    ```'
  merge: -1
