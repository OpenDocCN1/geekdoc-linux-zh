  md: 'LILO command. By running the LILO program, the configuration and the boot program
    are copied into the MBR for subsequent system boot.


    LILO label field. The label argument specifies multiple OS images at boot time
    from which the user may select.


    Linux in-house warranty service. Millions of people use Linux without warranty
    service. The key is to develop a staff of qualified individuals, who will provide
    the warranty service in-house through skill and use of Internet resources.


    Linux memory requirements. The exact amount of required RAM depends on the applications
    run; it can be as little as 4 MB or as much as the onboard can hold.


    Linux origins. Linux is the result of 20 years of GPL software evolution that
    has recently been packaged and configured by various vendors.


    Linux shell. Serves as the command-interpreter provides command-line editing,
    program execution, and flow control in the execution of shell scripts.


    Linux subsystems. The major Linux sub-systems are kernel, network, init, daemons,
    login, shells, and the X Window system.


    Linux warranty service. Although Linux does not include a warranty, there are
    many companies that provide continuing maintenance services for Linux thereby,
    in effect, offering a warranty service.


    Linux, installation steps. (1) Boot program; (2) Partition hard disk; (3) Format
    partitions; (4) Dearchive software; (5) Configure boot-sequence; (6) Set up X11.


    Linux, shutting down. (1) Type <CTRL-ALT-DEL> at the console to shut down and
    reboot the system; (2) become superuser and use the halt, reboot, or shutdown
    commands; (3) become superuser and switch run levels with the init 0 command.


    Linux, user interface. Linux is a layered system; GUI programs depend upon lower-level
    shells to execute commands. Not all commands are implemented with GUI.


    local initialization files. Local files are found in the user''s home directory
    and override global settings.


    locate. Interprets its argument as some part of a file name or as path name to
    a file, and as a result, it displays all path names containing the argument.


    locate, design tradeoff. Locate provides quick time by reading a database of path
    and file names, but the database will not reflect recent changes made to the file
    system.


    logger command. Command with which the user can import a message into the log
    file.


    logging out. Use the end-of-file character, <CTRL-D>, or the shell commands exit
    or logout.


    lpc command. Queries the print server for information on one or more printers.
    The superuser can use ipc to stop and start the server as well as clean the print
    queue.


    lpq command. Queries the local or remote server for pending print requests, depending
    on the printcap description of the printer location.


