  md: '# B-4 Appendix B — Glossary


    disk divisions. Linux requires at least two partitions, one for the swap space
    and the other for the root system. If Linux searches the hard disk with another
    OS(s), more partitions may be required.


    disk partitions. Firmware uses partitions to divide the hard disk and present
    partitions to one or more operating systems as volumes.


    domain name service. A server that translates computer names to IP addresses.


    dot debate. Use of the dot character in the current directory may lead to a security
    problem, where non-existent system programs request and save user passwords.


    ELF (Executable and Linking Format). A binary format developed by UNIX System
    Laboratories.


    facilities. Messages are directed with a facilities label, indicating the type
    of daemon message (mail, telnet, lpr, etc.) and the priority of the message (emergency,
    warning, debug, etc.).


    find, design trade-off. The find command searches the complete directory structure
    from the starting point to each leaf. This requires tens of thousands of file
    queries, and as a result, the program runs slowly. Unlike locate, the command
    will perform an up-to-date search.


    format documentation. The file format of the man pages describes the role of each
    field in control or initialization file and which programs read or write each
    file.


    free software. Free software is generally open source, and it may be used, modified,
    copied, redesigned and shared with others. Free software also refers to how the
    software is distributed, not the viewing of the source code. Some forms of free
    software are binary-only copies that are not redistributed.


    free software business model. Businesses do well selling GPL software because
    they have switched their focus from a fee-for-product model to a fee-for-service
    model. The service can be a product in the form of reconfigured or improved software,
    as well as traditional service. The business expenses just as much, if not more,
    income can be generated through distribution of the lower cost software, which
    should lead to an extensive advantage for future service.


    free product. GPL software creates a community of programmers who freely share
    ideas to improve the software, and the software generally evolves into a product
    of better quality than any one individual or sub-group could have created by them.


    free software, professional use. GPL software allows the computer professional
    to exploit a highly evolved set of software tools that can greatly improve productivity,
    especially when compared to traditional software environments.


    free software, long-term commercial use. Although it requires thinking outside
    of the box, commercial users of free software are able to achieve a higher level
    of productivity through implicit cooperation in software development.


    FTP. File Transfer Protocol.


    gateway. A router or other host that has a second network interface connected
    to the Internet.


    global initialization file. Global file settings are found in /etc and affect
    all users, but they have low-priority default settings.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_375_0.png)'
  merge: -1
