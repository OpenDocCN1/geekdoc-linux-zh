  md: '# 42 Module 8 — Networking


    In general, data sent over the Internet is not encrypted, and any hacker between
    the sender and receiver may access the data using a sniffer or other network monitoring
    device. Hacker might also use a man-in-the-middle attack, which refers to a user
    who configures his computer to act like another router or host through which the
    packet passes on its way to the receiver. As data passes, hacker can possibly
    monitor vital information.


    A proxy server such as SOCKS may be used to limit a hacker''s access to a particular
    site. However, SOCKS does not protect information transmitted across the Internet.


    # Tunneling


    Tunneling is the practice of using a public network, such as the Internet, to
    carry private network traffic. The tunnel is the probable data path. Several protocols
    create a stream of encapsulated data that follows the best set path through the
    Internet to its destination. Tunneling raises the four key issues:


    +   - Authenticity - Ensures the source is actually the person sending and not
    someone standing in the middle.

    - Access - Only authorized systems may connect to the host.

    - Integrity - Ensures the data is not tampered with.

    - Confidentiality - No uninvited person reads the data as it travels across the
    Internet.


    Several products are available that create a tunnel or encrypted communications
    between stations or networks. The following software creates an encapsulated stream
    of data between two locations.


    # IPSEC


    Download FreeSwan IPSEC at www.freeswan.org. The file can also be accessed directly
    at ftp.xs4all.nl/pub/crypto/freeswan. Decompress the file and enter the /freeswan
    subdirectory. FreSwan looks for the kernel in the /usr/src/linux directory. If
    the kernel image is elsewhere, move it to this location.


    Before running FreSwan, an existing kernel should be working and a backup copy
    should be made. Enter the newly created FreSwan subdirectory and run one of the
    following:


    +   - make menudo- Corresponds to the make menuconfig command for compiling kernels.

    - make xgo- Uses Xcurses.

    - make ngo- Runs the text based configuration.

    - make oldgo- Uses the old kernel''s settings.


    The newly compiled kernel must be saved. Even if no modifications are made, the
    kernel image must be saved for the KLIPS additions to take effect. However, once
    the script finishes, LILO handles the rest of kernel compilation (modules and
    installation). Reboot to run to load the kernel. Reboot the machine and choose
    the kernel that has the IPSEC additions.


    The next step is configuring the IPSEC kernel for tunneling. Using a text editor,
    modify the /etc/ipsec.conf. The simplest type of connection forms the basis for
    the other connections. Creating a tunnel involves specifying the IP address encryption
    key generation.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_267_0.png)'
