  md: "# Xterm\n\n+   Using Xterm\n- -leftbar\n  - Displays scroll bar on left side\
    \ of screen\n- -sl var\n  - How many lines to save that have scrolled off the\
    \ screen\n- -f\n  - Forces Xterm to start in Tektronix mode\n- -title [name]\n\
    \  - Specifies the title Xterm window\n\n# XTERM\n\nXterm is a terminal emulator\
    \ used within the X11 environment. The Xterm emulator is capable of simulating\
    \ the DEC VT102, VT220, and Tektronix 4014 terminals. Xterm provides the user\
    \ with a standard command line interface, allowing users to run programs and applications\
    \ that would not normally function in the X11 environment. Some programs that\
    \ were not created for use with X11 will not work without the simulated environment\
    \ that Xterm creates.\n\nIf a user chooses to work with the Windows system, a\
    \ terminal emulator is required to use a large number of the commands and utilities\
    \ available in the Linux OS. Although X11 provides an efficient and user-friendly\
    \ computing environment, the command line is still the most frequently used interface\
    \ of the OS. Xterm is one of the most widely used utilities for X Windows.\n\n\
    # Using Xterm\n\nUsing multiple virtual terminals creates a work environment that\
    \ is similar to several simultaneous login sessions, all except all on one display.\
    \ To start using Xterm, type xterm in the run program box (or another Xterm window)\
    \ and press <ENTER>.\n\nXterm uses the standard command line syntax:\n\n```\n\
    $ xtterm [-option]\n```\n\nThe Xterm environment functions almost exactly as the\
    \ standard command line. Users can enter a command at the Xterm prompt, and any\
    \ output that the command might produce is displayed within the same Xterm window."
  merge: -1
  pgno: 206
- img_proc: true
  md: 'Most of the Xterm options are invoked through the command line. The common
    options are shown in Table 7-9 are generally used for configuring the behavior
    of the emulator:


    | Option | Function |

    |---|---|

    | -left | When using this option, Xterm will display the scroll bar on the left
    side of the screen. |

    | -sl var | Here, var is a user-specified variable that indicates how many lines
    to save when have scrolled off the top of the screen; 64 is the default value
    for var. |

    | -t | Forces Xterm to start in Tektonix mode. |

    | -title [name] | Name specifies the title Xterm window.


    Table 7-9. Options Used to Configure Xterm


    The Xterm preferences menu can also be used to configure some of the Xterm options.
    Access the preferences menu by:


    +   * Clicking on settings in the menu bar.

    * Selecting preferences from this new menu.

    * Pressing <CTRL> and right clicking on the Xterm window.

    * Selecting preferences from the popup menu.


    From this menu users can change almost every aspect of Xterm''s appearance, including
    font type, font size, and color. Users can even specify a background image for
    the window. These options allow for a great deal of customization. The preferences
    menu can be more efficient than using command line options to modify the appearance
    of the window.


    The options listed above are just a few of the many configuration options used
    in Xterm. For a complete list of options and descriptions, read the Xterm man
    page.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_207_0.png)'
