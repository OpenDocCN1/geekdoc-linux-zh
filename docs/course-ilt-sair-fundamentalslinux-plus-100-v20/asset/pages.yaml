  md: '# Emacs


    The Emacs program is an extensible text editor, as well as a Lisp interpreter.
    To run Emacs, the command emacs at a command line prompt. This may be used with
    options (at the end of this section) or with a file name as an argument. For example,
    emacs filename.txt will open the Emacs program with the filename.txt file loaded
    from a disk or in a new named filename.txt.


    The Emacs commands are composed of combinations of <CTRL> and <META>, which is
    represented by either <ALT> or <ESC>. If a user''s keyboard supports the <ALT>
    key, then the <META> will refer to <ALT>. Otherwise, <ESC> will function as the
    <META> key. There are differences in the keystrokes. For example, if the <META-H>
    is serving as <ALT> and <h> keys then the command will be executed by pressing
    <ALT> and <h> simultaneously. If <META> is represented by <ESC>, the command may
    be executed by pressing and releasing <ESC>, then <h>.


    The Emacs screen is composed of three parts: the text buffer, the mode line, and
    the command line. The text buffer is where the file is. The mode line gives information
    about the file, such as which line the cursor is on, mode of the current buffer,
    and the name of the file in use. The command line is a section of area that allows
    arguments to be passed to commands.


    # Opening, saving, and closing files


    The <CTRL-X> is the base for many operations in Emacs. To open a file under Emacs,
    the <CTRL-X> <CTRL-F> command is used. When this is issued, a prompt appears on
    the command line for file name to open. In addition, Emacs performs file completion
    and may display a list of available selections when the <TAB> key is pressed.


    To save a file, the <CTRL-X> <CTRL-S> command is used. This will automatically
    save the file, unless it is a new file. If the file is new, the program will prompt
    the user to enter a file name on the command line. To save to other than the current
    file, use the <CTRL-X> <CTRL-W> command. For example, if a user is working on
    a named file filename.txt, then use the command <CTRL-X> <CTRL-W> filetwo.txt
    and write to the information to a named file


    Emacs is closed by pressing the <CTRL-X> <CTRL-C> command. If the buffers are
    not saved, the user will not have to save the file, but this must be specified
    by the user by typing yes or no.


    # Movement


    Moving in Emacs is done with characters, words, lines, or screens. To move one
    character up, down, or right, use the <CTRL-P>, <CTRL-N>, <CTRL-B>, and <CTRL-F>
    commands, respectively.


    The <META> keys are used to move the cursor to the beginning and end of a word.
    <META-B> will move the cursor to the beginning of a word, while <META-F> will
    move the cursor to the end of the word.


    It is possible to jump to the beginning or end of a line. To move to the beginning
    of a line, press <CTRL-A>. To move the cursor to the end of a line, press <CTRL-E>


    To move screen, use the <META-V> command to move back one screen and <CTRL-V>
    to move forward screen.


    # Searching


    There are two searching methods in Emacs: regular expression and incremental searching.
    A regular expression search is a method that searches for an entire expression
    at one time. One looks for matching expressions in the searched criteria.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_192_0.png)


    SAIR Linux and GNU Certification -- Fundamentals/Linux+'
