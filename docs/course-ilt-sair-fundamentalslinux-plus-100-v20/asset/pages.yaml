  md: 'volumes. Partitions seen from the perspective of the OS. A volume could be
    an entire hard disk, a hard disk partition, or a logical partition within an extended
    partition.


    **w command.** Provides a summary of the system state, on which terminals users
    are logged in, and from which network host they logged in. The w command provides
    more of an overview of the system.


    **who command.** Displays a list of logged in users and on which terminals they
    logged in.


    **WYSIWYG (What You See Is What You Get).** In word processing, the text is displayed
    as it is entered.


    X file. A symbolic link to an instance of the X server that matches the video
    adapter.


    X server. The video driver for the X11 system. It accepts logical commands from
    the window manager and transforms these requests into the screen display.


    X11 architecture, five components. X server, display manager, widget library,
    window manager, and GUI applications.


    X11 configuration files. Found in /etc/X11 on newer distributions; otherwise,
    they are found in /usr/local/X11R.


    X11 programs. Usually found in /usr/X11R/bin.


    Xconfigurator. Found only on Red Hat systems, and it does not include mouse configuration.
    A separate utility, mouseconfig, must be used to set up the mouse.


    xdm. Provides a graphic login screen, runs the login process, and starts the X
    server and window manager.


    X86_VGA16. The lowest denominator video driver. Although it works with all adapters,
    its low 640x480 16 color resolution is not acceptable for GUI applications.


    **X86config** Generally, users do not use this command-line version for X configuration.
    There are many pages of text, lists of items to read, and items identified by
    their position within a list. However, this program reads an external file for
    the list of available X servers, so it tends to be up-to-date than any GUI configuration
    tools.


    **X86config.eg file.** Provides a template of sections that can be configured
    for system specific options, including the mouse, video adapter, and monitor.


    xinfo utility. X version of info; it is essentially the same program as info.
    A menu bar was added to xinfo, but its buttons change depending upon which level
    of the hierarchy the program is visiting.


    **xman utility.** X window of man. It offers significant improvement over man
    by displaying the table of contents for each man section.


    X Window system. Graphical user interface consisting of an X server and client
    applications.


