- img_proc: true
  md: 'To deselect a pattern, press the <-> or <| key to open the deselect dialogue
    box and enter the same patterns chosen in the selecting process.


    NOTE: Typing a single <*> in the dialog box will choose all files.


    # Basic file operation


    The following outlines the steps taken to create a new directory and to copy,
    move, rename, delete, and change the ownership of files with MC.


    F5- Copying a file <


    To copy a file from one directory to another, first select a desired file or group
    of files and press either <F5> or click the F5 function tab at the bottom of the
    main interface. Use the dialogue box that appears to specify the directory into
    which the files should be copied. MC will copy all selected files into the designated
    location. Remember, the entire operation can be cancelled at any time by pressing
    <ESC> twice.


    F6- Moving and renaming a file


    Moving and renaming files are essentially the same function. To move or rename
    a file, place the cursor on the file name and type the new name.


    F7- Making a new directory


    To create a new directory, press <F7>. This will provide a dialogue box; in this
    box, type the desired directory and hit <RETURN>. The newly created directory
    will be visible in the directory panel.


    F8- Deleting a file


    To delete a file, select a file and press <F8> or click on the F function tab
    at the bottom of the screen. The program will ask for confirmation. Confirm the
    deletion and MC will delete the file.


    To cancel the operation for any reason, press <ESC> twice.


    Changing ownership of a file


    To change the group or the owner of a file, press <CTRL-X-O>, which will open
    a dialogue box. Use the dialogue box to change the ownership of the file.


    # Midnight Commander''s Gnome Interface


    This is a brief review of file operations in Gnome Midnight Commander (GMC). Gnome
    must be running in order to use this file manager. See the end of this section
    for file managers that will work under other desktop managers.


    GMC allows users to perform directory navigation and file handling operations
    and provides a user-friendly GUI for MC.


