  md: "# Creating, Modifying, and Deleting Groups\n\n+   * Creating Groups\n  * Adding\
    \ with groupadd\n  * Editing the /etc/group file\n* Modifying Groups\n  * Modifying\
    \ with groupmod\n  * Other methods\n* Deleting Groups\n  * Using groupdel\n  *\
    \ Other methods\n\n# CREATING, MODIFYING, AND DELETING GROUPS\n\n# Creating Groups\n\
    \nTo do these, or any other functions within this section, the user must have\
    \ root access.\n\n# Adding with groupadd\n\nThe easiest way to add groups to a\
    \ system is to use groupadd. This utility creates a new group based on the parameters\
    \ that are given in the command line. For example, to add the group users, enter\
    \ the following command line:\n\n```\n$groupadd -g [gid] users\n```\n\nThis line\
    \ creates the group users, and the -g flag tells the command to assign the group\
    \ ID that is specified right after the parameter.\n\nOther command line include:\n\
    \n+   * The -r flag, given by Red Hat, creates a system account with the first\
    \ available group ID that is lower than 499. By using the -g flag, the user can\
    \ disable this.\n* The -f flag issues an error message if the group that is being\
    \ created already exists, and then refuses to add or modify it.\n\n# Editing the\
    \ /etc/group file\n\nGroups can also be added by editing the /etc/group file.\
    \ A user can open this directory in any text editor, and then add or modify the\
    \ desired group(s). The following is a typical format for a line in the /etc/group\
    \ file:\n\n```\ngroup:password:gid:members\n```\n\n![](img/b0ea5e4a55ee6767fff087672e71c505_87_0.png)"
  merge: -1
