  md: "# Hardware Basics\n\n+   * System Board\n* CPU\n* Memory\n* Storage Devices\n\
    * I/O Devices\n  * Mouse, modem, printer peripherals\n* Putting It All Together\n\
    \n# HARDWARE BASICS\n\n# System Board\n\nThe system board, also called a motherboard,\
    \ is the circuit board that houses the electronic components and chips necessary\
    \ for a computer to function. It usually contains:\n\n+   * CPU (central processing\
    \ unit)\n* RAM (random access memory)\n* Bus\n * Communication ports\n* IDE controller\n\
    * Different cards for devices\n\nThe system board ties all of these parts together\
    \ and allows them to interact to accomplish different tasks. An input signal from\
    \ a device is sent through a bus to its destination where it is interpreted and\
    \ executed accordingly.\n\n# CPU\n\nThe CPU, or microprocessor, controls the actions\
    \ of the computer by interpreting instructions logically and controlling data\
    \ flow. Any instructions are sent through the CPU to be processed and executed\
    \ correctly. Software uses the CPU to process its instructions.\n\nThere are many\
    \ kinds of processors. PCs can have CISC-based (Complex Instruction Set Code)\
    \ architecture processors like Intel, Cyrix, AMD, and others. Alpha, PowerPC,\
    \ and MIPS have the RISC (Reduced Instruction Set Code) architecture."
  merge: -1
  pgno: 307
- img_proc: true
  md: '# Memory


    Random Access Memory (RAM) serves as the computer''s primary memory source and
    stores data on a short-term basis for easy access; this reduces the time it takes
    an application to access the data or program. However, if data is not saved, it
    will be lost once the computer is turned off (either intentionally or accidentally).
    RAM is connected to the system board through slots (for SIMM or DIMM RAM).


    # Storage Devices


    Data can be stored directly to a device or written onto removable media. Some
    typical secondary storage devices are:


    +   - Hard drives

    - Tapes

    - CD-R/CD-RW

    - DVD-R/DVD-RAM

    - Floppy disks

    - Zip disks


    Hard drives are the main, local storage devices; they can be in various sizes
    to meet storage needs. They can be internal (IDE) or external (SCSI). Systems
    can be backed up at regular intervals. The back-ups made can be stored on a variety
    of media. Tapes can hold the most data while CD-Rs and CD-RWs have become increasingly
    popular. Multiple CDs may be used to back up a system at minimal cost because
    each CD can hold up to 700 Mb. DVD-Rs can hold over 4 Gbs of material while DVD-RAMs
    can hold almost twice much; DVD RAMs are also re-writable. Floppy disks can hold
    a relatively small amount (only about 1.44 to 2.88 Mb but can still be useful
    for small programs and files. Zip disks fall between floppies and CD-Rs -- they
    can hold from 100 to 250 Mb of data.


    # I/O Devices


    I/O (input/output) devices receive and send data. The monitor is a good example
    of an output device; a keyboard is an input device. A printer is a peripheral
    that functions as an output device. Other I/O devices include:


    +   - Mouse

    - Modem

    - Printer


    These devices operate independently of each other, allowing each computer I/O
    subsystem to exploit its full range of capabilities.


    # Peripherals


    Peripherals are any devices connected to the computer that are not internal components;
    they can be I/O devices (like printers and scanners) or perform auxiliary functions
    (i.e. external hard drives and CD-ROMs).


    ![](img/b0ea5e4a55ee6767fff087672e71c505_308_0.png)'
  merge: -1
  pgno: 308
- img_proc: true
  md: '# Putting It All Together


    A computer''s components must all work together, even to accomplish a menial task
    such as typing in a text editor. The keyboard is the primary input device; when
    something is typed, the data is sent to the operating system which in turn routes
    data to the active program. The graphics card and monitor work concurrently to
    update the screen as actions occur. The program takes this information and then
    puts it in RAM, where it awaits further instructions from the CPU. Once the input
    is saved, it is taken out of RAM and written to the appropriate storage device
    (either the hard disk or a removable storage device like a floppy disk).'
  merge: -1
  pgno: 309
- img_proc: true
  md: "# The System Board 10-7\n\n# The System Board\n\n+   * Software Components\
    \ of the System Board\n  * Firmware\n  * BIOS\n  * CMOS\n* Hardware Components\
    \ of the System Board\n  * Peripheral slots\n  * Memory slots\n  * Processor slots\n\
    \  * System board form factor\n\n# THE SYSTEM BOARD\n\nThe system board, or motherboard,\
    \ is the heart of any computer. It is a fairly large, generally 6 inches by 12\
    \ inches or larger, and contains many slots into which cards, memory, or power\
    \ connectors may be mounted. System boards come in many variations whose type\
    \ can be determined by either examining the board's physical dimensions, power\
    \ connectors, or physical layout.\n\n# Software Components of the System Board\n\
    \nFirmware\nA system board's firmware is a set of software instructions contained\
    \ on an EPROM. EPROM stands for Erasable, Programmable, Read Only Memory. In earlier\
    \ computers, firmware was contained on a PROM, which is similar to an EPROM but\
    \ can only be written to once. Today, the primary use of firmware is storing the\
    \ BIOS.\n\nBIOS\nThe BIOS is a simple operating system that controls the operation\
    \ of the system board itself. BIOS stands for Basic Input Output System. The BIOS\
    \ performs tasks as POST (Power On Self Test) and other diagnostics. Generally,\
    \ in the BIOS is not modifiable. However, the data can be modified in certain\
    \ circumstances, when a BIOS upgrade is required it is non-volatile, meaning that\
    \ even if power is lost the data in the BIOS is still safe. The BIOS also allows\
    \ users to make changes to their computers, like setting a hardware-level password\
    \ or changing the boot device. These user-definable parameters are stored in the\
    \ CMOS."
  merge: -1
  pgno: 310
- img_proc: true
  md: '# CMOS


    The CMOS (Complementary Metal Oxide Semiconductor) stores information used by
    the BIOS on boot and during operation. The CMOS is volatile memory. It requires
    a battery to be installed in the system board so if the power is lost or the computer
    is unplugged any information stored there will be safe. While this may create
    a crude solution, it allows any mistakes made while modifying the BIOS to be undone
    by simply removing the battery from the system board. The CMOS battery is easily
    identified on the system board as is only one and looks like a large watch battery.


    # Hardware Components of the System Board


    The following sections will list and describe most of the buses and slots encountered
    when dealing with PCs


    # Peripheral slots


    These are normally used to connect devices to the system board as modems and soundcards.


    | Peripheral Slot | Function |

    | --- | --- |

    | ISA | Industry Standard Architecture. The ISA slot was devised to provide a
    common architecture for all peripherals. ISA provides a 16 bit, 8MHz connection
    to the system bus and has a maximum bandwidth of 6MBs |

    | EISA | Extended Standard Architecture. EISA is an upgrade to ISA but never gained
    a strong presence in the PC market. It is twice as fast as ISA. ISA cards work
    in EISA slots. Types for EISA are the same as ISA |

    | VESA Local Bus or USB | Video Electronics Standards Association. VB was designed
    to give advantage to PC video cards, though it is typically used today. The USB
    has given us 32 bit, 33 MHz connection to the system bus. |

    | MCA | Micro Channel Architecture. MCA offers a full feature set including 32
    bit bus and Plug-and-Play compatibility. MCA and PCI were developed to replace
    ISA. IBM was the main force behind MCA''s development and was backed by Intel.
    Until recently, the adoption rate of MCA was not in any PCs |

    | PCI | Peripheral Interconnect. PCI is the most used peripheral slot today. PCI
    operates at 32MHz and has a 32 bit connection to the system bus, giving a maximum
    transfer rate of 132 MB/s. PCI devices are used for everything from video cards
    to disks and controllers |

    | 64 Bit PCI | As the name suggests, this is a 64 bit version of PCI. With 64
    bit PCI slots are becoming more prevalent, especially in high-end servers. This
    slot operate at either 32 or 66MHz, giving a maximum transfer rate of 528MB/s.
    Types for 64 bit PCI include Ultra/100 PCI and other high-bandwidth devices |

    | AGP | Accelerated Graphics Port. AGP is the current standard video adapter;
    it offers cards a significant speed advantage over AGP cards can directly access
    system RAM or is an extension of its own RAM. AGP dynamically shares the system
    bus with other buses, allowing the maximum performance for the entire while preventing
    AGP from consuming the entire RAM. AGP comes in many versions from AGP 1x to AGP
    6x with 32 bits wide and operates at least 64MHz. Current AGP is the fastest with
    a maximum transfer rate of 1.06GB/s. AGP is used exclusively for graphics devices
    |

    | AMR | Audio Modem Router. AMR was designed to offer a cheap way to connect sound
    devices and modems to the system board. It is a relatively new set and has yet
    to gain popularity. Its typical uses include modems and sound cards |

    | IDE | Stands for Integrated Drive Electronics. The IDE bus is just an extension
    of the PCI bus and is used to connect devices as CDROMs or hard drives. There
    are several IDE speed grades; the fastest is ATA100 which can send data to the
    system bus at 100Mbps. Other IDE modes include ATA33 and ATA66. It is common to
    find references to IDE modes to UDMA; for example UDMA3 is the same as ATA33 |


    Table 10-1. Peripheral Slots


