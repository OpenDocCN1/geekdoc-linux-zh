  md: '# Flexibility


    Linux offers a great deal of flexibility. Users have a choice among many shells,
    or programs that interface and relay information between the user and the kernel.
    When someone types to a command line, the user is actually talking to the shell.
    Typically, Linux distributions are equipped with at least four shells: the C shell,
    the Bourne Again Shell, the shell, and the Korn shell. The shell define the ways
    commands are input and used. The ability to change shells at any time makes Linux
    a very versatile OS. Users have the ability to customize their environments. On
    remote computers, users can change everything from the shell they use to the look
    of the prompt and sign on.


    Linux has incorporated a graphical user interface, the X Window system, or X11,
    that includes many features found in commercial systems. X11 is great for novice
    as well as advanced users. Multi-user features are available that allow configurations
    and desktops to be kept regardless of the terminal used. X11 is composed of a
    server, connecting X11 clients, and software that allows the two to interact with
    users. A window manager is a program that defines the feel of the interface between
    the user and the X Window system. Desktop screensavers, customizable toolbars,
    and an extremely large number of applications make X11 a great addition to any
    Linux system.


    # Customizing and Configuring


    Compiling a Linux device is one of the most powerful customizations of a system.
    Everything from the file systems, to supported devices, to the way the system
    runs, is configurable when the kernel is compiled. Linux kernels arrive as source
    code that must be compiled into binary format (the format used by computers).
    During compilation, drivers and compatibility issues can be specified. If a computer
    is using an NFS server, this must be specified when the kernel is compiled. In
    this way, a computer with a hard drive and minimal resources can use Linux efficiently
    if the kernel is compiled with only the functions the computer will need. There
    is no need to recompile a kernel that does things the computer will never utilize.
    An unnecessarily large kernel can take up valuable space on a hard drive. A kernel
    compiler for X Window is now available that provides an easy-to-manage window
    and pull-down menus for unique customizing for every Linux system.


    # Different Distributions for Different Users


    Linux has taken many forms through different distributions. Companies have packaged
    features, applications, and configurations with the standard Linux kernel and
    sold on easy-to-install CD-ROMs. These distributions are aided by the GPL, so
    they are also free of charge on many sites across the Internet. The companies
    make money not by selling the OS, but by selling support, documentation, and hard
    copy transport media like CD-ROMs. Because the distributions tend to be very large,
    modern users may find buying the distribution on CD-ROMs much more expensive than
    downloading the software from the Internet. Each distribution is different but
    equally customizable. Commands and the style of the system may vary between distributions,
    so many users try different versions to see which one fits their needs. Some of
    the distributions are aimed towards new users, while others require more knowledge.


    # Security


    It is possible to create a very secure operating system using Linux. Security
    in Linux may require a little more knowledge than in other operating systems;
    however, that extra knowledge can make Linux more secure than any other OS server.
    Because Linux is open source, patches and fixes are found quickly. Most of the
    time, within a day after a problem is discovered, a patch has been made available
    to the public.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_22_0.png)


    SAIR Merit Linux and GNU Certification -- Fundamentals+Linux+'
