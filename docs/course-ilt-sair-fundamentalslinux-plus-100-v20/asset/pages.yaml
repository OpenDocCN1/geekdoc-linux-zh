    # Lab 05-01 Questions and Answers


    +   1. Why did the link count for the dot (.) directory increase by 1 when you
    created the test directory?


    That is because the . directory inside the test directory and the . directory
    in the parent directory share the same inode. The link count that is shown is
    actually the link count to the inode.


    +   2. If you create any new directory and examine it, can you see the dot (.)
    and dotdot..) directories. Why is the link count for the dot (.) directory 2 if
    there are no subdirectories in this newly created directory? Why is this true
    for every new created directory?


    The link count for the . directory is the link count for the inode that this node
    and the . directory is another. All and file and directory names are, in reality,
    just pointers to inodes. This reinforces the idea that the inode is the actual.


