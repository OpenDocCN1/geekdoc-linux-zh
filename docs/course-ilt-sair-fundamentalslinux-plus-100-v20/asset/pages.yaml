  md: "# Browsers\n\n+   * Netscape Communicator\n    * Navigator\n    * Mail and\
    \ news\n    * Address book\n    * HTML composer\n* Lynx\n    * Options and printing\n\
    * Other Browsers\n    * Mosaic\n    * Mozilla\n    * Opera\n    * w3m\n\n# BROWSERS\n\
    \nA browser is a program designed to access data on the Internet. Some of the\
    \ smaller, simpler browsers can only access and FTP data. However, browsers such\
    \ as Netscape Communicator and its successor Mozilla have access to many Internet\
    \ resources, including mail and news. Although it is becoming dated, Netscape\
    \ remains the most popular Linux browser.\n\n# Netscape Communicator\n\nNetscape\
    \ Communicator is composed of four programs: Navigator (a Web browser), Messenger\
    \ (a mail and news client), Address Book, and Composer (a Web page editor). The\
    \ key to Communicator is the interconnectivity of the four programs. The ability\
    \ of Navigator to interconnect with Messenger allows users to compose an e-mail\
    \ with one click on an e-mail address, clicking on a URL, when using any of the\
    \ other three programs, will cause Navigator to appear with the URL displayed.\n\
    \n# Navigator\n\nNetscape is the most common Internet browser for a Linux system,\
    \ although there are other browsers available, such as Lynx or Mosaic. The main\
    \ reason for the popularity of Netscape is that it is currently the only fully\
    \ functional browser available for Linux today.\n\nNetscape is available free\
    \ of charge through Netscape's Web site, www.netscape.com, although it is not\
    \ free GPL software.\n\nBelow is a screen shot of the Netscape Navigator browser.\
    \ Although there are many versions, the layout has not changed significantly;\
    \ if a user is familiar with one version, using another is not difficult."
  merge: -1
  pgno: 198
- img_proc: true
  md: '# Module 7 — Linux Applications


    ![](img/b0ea5e4a55ee6767fff087672e71c505_199_0.png)


    Figure 7-1. Netscape Navigator


    # Mail and news


    Within the Netscape Communicator software package, a graphical program called
    Messenger allows the user to send and receive e-mails, as well as view post articles
    to newsgroups. The ability for Messenger to be interconnected with the Address
    Book and Navigator allows the user to share information, such as hyperlinks, bookmarks,
    and e-mail addresses. When a user receives an e-mail or a news article, if there
    are links or e-mail addresses included in the message, a simple click on the link
    will automatically open Navigator, if not already open, and display the link.
    In addition, if an e-mail address is clicked, the e-mail address will become the
    outgoing card for a new e-mail. The address can also be placed in the Address
    Book by selecting Add to Address Book from the context menu. Since there is no
    need to copy and paste information to and from different non-compatible programs,
    the use of the software bundle makes e-mail and news management simple.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_199_1.png)


    Figure 7-2. Netscape Communicator'
  merge: -1
  pgno: 199
- img_proc: true
  md: '# Address book Browsers 7-15


    The address book program within Netscape Communicator allows the user to organize
    accumulated e-mail addresses. Through this program, a user can manage e-mail addresses
    in several different ways. Addresses can be sorted into different folders according
    to group the address belongs, such as family members or co-workers. In addition
    to the organization of people, the interconnectivity with the address book and
    the mail program allows the transfer of e-mail addresses without having to copy
    and paste interface between the two programs.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_200_0.png)


    Figure 7-3. The Netscape Address Book


    # HTML Composer


    Incorporated within Netscape Communicator is a simple program for the creation
    and modification of Web pages. Composer provides a graphical interface for editing
    Web pages and is similar to a word processor. In addition, Composer allows the
    user to publish the Web pages directly onto a server without having to go through
    another program, such as FTP client.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_200_1.png)


    Figure 7-4. Web Page Composer

    SAIR Linux and GNU Certification --- Fundamentals/Linux+'
