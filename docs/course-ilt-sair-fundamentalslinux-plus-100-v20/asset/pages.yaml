    \ that accompany it will be covered in this section, as as the mouse, keyboard,\
    \ and video card. As all X configurations are not the same, the configuration\
    \ will be discussed in general terms. It is recommended that the user have hardware\
    \ specifications readily available. Improper specifications may result in damage\
    \ to the hardware.\n\nX relies on a master configuration file, XF86Config that\
    \ controls the display. The configuration file may be in one of the following\
    \ directories:\n\n```\n/etc/X11/\n/usr/X11R6/lib/X11/\n```\n\nBefore X can run,\
    \ the configuration file must be set for the system. Some distributions now configure\
    \ the X server as part of the installation, but this can be subverted to allow\
    \ X to configure at a later time. There are several ways to configure X, such\
    \ as through the use of configuration programs provided with: xf86config and XF86Setup.\
    \ Both programs allow the user to modify the default settings using different\
    \ methods for the keyboard, mouse, video card, monitor, and miscellaneous options.\
    \ xf86config uses a command-line interface which asks for more technical questions;\
    \ XF86Setup uses an easily navigated graphical interface, which is somewhat less\
    \ technical. It is started by giving the following command as root:\n\n```\n$\
    \ XF86Setup\n```\n\nAt the top of the screen are are a number of different sections\
