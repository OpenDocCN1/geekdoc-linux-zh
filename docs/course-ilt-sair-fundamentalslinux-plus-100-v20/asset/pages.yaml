  md: "# Module 4 — Linux Sessions\n\n# Key Sequences (Shortcuts) in Linux\n\n+  \
    \ * Key Sequences in Command-Line Editing\n  * Modifying key binding\n* Kernel\
    \ Key Mappings\n  * Mapping syntax\n  * Re-mapping sequences to other keys\n\n\
    # KEY SEQUENCES (SHORTCUTS) IN LINUX\n\nA key sequence is a combination of keys\
    \ that acts as a shortcut for executing commands and performing certain actions.\
    \ They are sometimes used as a quicker means of shifting states or carrying out\
    \ operations.\n\nKey sequences can be made up of keys that do not start with an\
    \ ASCII value in the range of 0x20 to 0x7e. This means the ASCII value of the\
    \ first character in the sequence must not be a printable ASCII value. In this\
    \ case there may be more than two combinations in the sequence. The ASCII value\
    \ of the second key in the sequence is also a non-printable ASCII value. The range\
    \ 0x20 to 0x7e is the printable range of ASCII characters specified in hexadecimal.\
    \ The ASCII values of some of the common ASCII control characters are shown in\
    \ Table 4-1:\n\n| DEC | HEX | CHAR | Symbol | Meaning |\n|---|---|---|---|--|\n\
    | 0 | 0 | ^@ | NULL | Null |\n| 1 | 1 | ^A | SOH | Start of Heading |\n| 2 | 2\
    \ | ^B | STX | Start of Text |\n| 3 | 3 | ^C | ETX | End of Text |\n| 24 | 18\
    \ | ^X | CAN | Cancel |\n| 27 | 18 | ^[ | ESC | Escape |\n\nTable 4-1. ASCII Values\
    \ for Control Characters\n\nKey sequences are used by many Linux programs. Different\
    \ applications may use key sequences to accomplish the same task. Other combinations\
    \ may be the same in all the applications."
  merge: -1
