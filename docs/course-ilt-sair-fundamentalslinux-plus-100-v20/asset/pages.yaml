  md: '# Log Files


    +   - Common Log Files

    - Swatch and Logcheck


    # LOG FILES


    Log files contain all of the important information that is constantly being processed
    by a system. Log files store information about hardware and software problems,
    as well as information about when users attempt to gain illegal access to the
    system or use programs they should not. Log files are generally located in the
    /var/log/ directory. However, that is dependent on the particular system and administrator’s
    preferences. Table 5-25 contains a list of some of the common log files within
    /var/log/ and the type of information they hold.


    | Log File | Information |

    |---|-|

    | boot.msg | Information during boot of the system |

    | httpd.access_log | Successful access attempts to the httpd daemon (Web site)
    |

    | httpd.error_log | Unsuccessful access attempts to the httpd daemon (Web site)
    |

    | messages | Extra logging information, such as kernel and login messages |

    | maillog | Mail errors and configuration issues |


    Table 5-25. Common Log Files


    Because this is a large amount of information, a utility called logrotate rotates
    these log files, ensuring all of the hard disk space is not used. To find information,
    look at the log files regularly. If too much time passes, some of the important
    information, such as people trying to gain illicit access, will have disappeared.
    There will be no record of anything happening to the system, thus no signal to
    fix a problem.'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# Swatch and Logcheck


    Another drawback to log files is that they can become quite huge and physically
    looking through the logs may not be feasible. This is one of the main reasons
    people do not view log files often; it is hard to distinguish what is needed among
    so much information. However, there are tools to help with this task, such as
    swatch logcheck.


    swatch is an active monitoring tool, which has many ways to inform the administrator
    of potential problems. logcheck uses keywords provided by its configuration file
    to periodically check log files for unusual activity. logcheck will notify the
    administrator if anything is discovered.'
  merge: -1
