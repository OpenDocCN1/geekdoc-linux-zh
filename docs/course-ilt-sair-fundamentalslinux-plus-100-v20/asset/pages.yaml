    # FINDING HELP WITH LINUX


    ![](img/b0ea5e4a55ee6767fff087672e71c505_139_0.png)


    With the spread of Linux as a viable operating system, support for Linux users
    is available from many places. The free software philosophy of Linux has spawned
    a community of users who share solutions to problems, in addition to sharing software.


    # man Pages


    Manual pages, commonly called man pages, are the most accessible medium for Linux
    help and are included in every distribution of Linux. By typing man pages followed
    by the name of the command the user needs help with, a user can find a wealth
    of information to help with usage, command-line parameters, and the command''s
    various options.


    Man pages can be a valuable reference. Many Linux commands have numerous options
    associated with them, so it can be difficult to remember each option''s function.
    Each distribution may also have its own addition of pages to the programs in the
    core Linux distribution. For example, any new Red Hat distributions will likely
    come with man pages as part of the installed program. Private users also also
    begun to include man pages with their programs. It has become the standard for
    most distributions of software.


    Understanding the information in the man pages can be challenging for new users,
    especially if they are not familiar with Linux terminology and terminal commands.
    The man pages usually contain the sections NAME, SYNOPSIS, DESCRIPTION, OPTIONS,
    and SEE ALSO. These sections are constant among all the man pages, so it is important
    to understand the information contained in each.


    # A man page and its fields


    Here is an example from a man page about the man command:'
  merge: -1
  pgno: 139
