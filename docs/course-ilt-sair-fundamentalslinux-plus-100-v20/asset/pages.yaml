  md: '# Hardware Requirements


    The various hardware components that are often used to set up a LAN are shown
    in Table 8-1:


    | Component | Function |

    |---|---n| Repeaters | A repeater is a device used to amplify a signal and transmit
    it to a destination. |

    | Switch | A switch is a device that links different components to the network
    and selects a path to transmit the data to its destination. |

    | Hub | A hub is a device to which all the computers, servers, printers, and other
    peripherals are connected to form a network. |

    | Router | A router decides where the data has to be sent. |

    | Patch cable | Patch cables are often used to connect network cards to hubs,
    etc. |

    | Network Card | A network card is a device used to connect the computer to the
    network. |


    Table 8-1. LAN Components


    # Network Files


    The files that need to be edited when configuring a LAN are /etc/hosts and /etc/resolv.conf.
    These can be edited with a text editor such as Pico, Vi, or Emacs.


    /etc/hosts


    On a small LAN, DNS may be problematic. Instead, names, IP addresses, and aliases
    of all the connected systems may be entered in the file /etc/hosts. This file
    is used to resolve the system''s name to its IP address. By default, this file
    contains the name and address of the looping device, the local host:


    ```

    127.0.0.1         localhost.localdomain  localhost

    208.244.233.2       peak.lucasfilm.com      peak

    208.244.233.112     lake.lucasfilm.com

    208.244.233.34      plain.lucasfilm.com

    ```


    The gethostbyname() function is used to search for a host by its name, and the
    gethostbyaddr() function is used to search for a host by its address.


    /etc/resolv.conf


    This file lists the DNS servers that will be used to resolve host names. It contains
    the name of the host, the address of its server name, and a list of names to search
    for the resolved name.


    This is an excerpt from the /etc/resolv.conf file:


    ```

    search lucasfilm.com

    nameserver 64.41.207.52

    nameserver 64.41.207.52

    ```


    ![](img/b0ea5e4a55ee6767fff087672e71c505_230_0.png)'
