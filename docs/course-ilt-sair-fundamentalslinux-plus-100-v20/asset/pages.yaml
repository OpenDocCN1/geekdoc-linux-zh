- img_proc: true
  md: '# Modifying Groups


    # Modifying with groupmod


    Functioning similarly to groupadd, groupmod is another command line utility. By
    running it, the root user modifies entries in the /etc/group file. For example,
    the command


    ```

    $ groupmod [-g gid ] [-n name ] group

    ```


    serves to rename an existing group. It also modifies the group ID, if the user
    desires. If not, the user can simply omit this parameter. However, by changing
    the group ID, the user orphans all the files owned by that particular group, since
    these are bound by the same ID number, not by the group name. When this happens,
    all files belonging to a changing group will become grouppless until the user
    either changes UIDs one at a time, or uses the chown command to recursively change
    ownership to the new group.


    # Other methods


    In addition to using groupdel, the user can also edit the /etc/group file as described
    above. The same advisory about the orphaning of files also applies here.


    # Deleting Groups


    # Using groupdel


    groupdel is another command-line utility for group management. By running the
    following command, the user removes the specified group and all contents found
    in it.


    ```

    $ groupdel [group name]

    ```


    # Other methods


    Again, the user can edit the /etc/group file in order to remove any unwanted group(s).'
