  md: '10-22 Module 10 — Hardware


    # SCSI


    +   * SCSI vs. IDE/ATA

    * Different Types of SCSI

    * SCSI Signaling Methods

    * SCSI Cabling and Connectors

    * SCSI Host Adapters

    * SCSI Bus Configuration


    # SCSI


    Small Computer Systems Interface (SCSI), pronounced skuzzy, is a standard for
    connecting peripherals to a computer by using a standard hardware interface. SCSI
    became an ANSI standard in 1986 but it had existed many years before. In 1979,
    a disk drive manufacturer named Shugart developed a new drive interface called
    Shugart Associates Systems Interface (SASI) that used logical addressing instead
    of the traditional means of physical addressing. After several failed attempts
    to get SCSI standardized, ANSI committee X3.T39.2 was formed in 1982. The committee
    added the ATN signal to the bus and created the message protocol. After these
    changes, SASI was known as SCSI. In the second generation of SCSI, SCSI-2. Later
    that year, SCSI became an ANSI standard as X3.131-1986. After several years of
    work, SCSI-2 became an official ANSI standard.


    SCSI supports many types of devices including hard drives, CD-ROM drives, CDRW
    drives, scanners, tape drives, magneto-optical drives and many more. Although
    SCSI devices are more expensive than their IDE/ATA counterparts, the performance
    that is gained is well worth the cost.


    This section will compare different aspects of SCSI and IDE/ATA, explain the different
    types of SCSI and show how to configure SCSI hardware. Although every possible
    SCSI configuration can not be shown in a single module, the information presented
    should be sufficient for the administrator to successfully configure a SCSI bus
    and devices.


    # SCSI vs. IDE/ATA


    Usually the first question people ask when they are presented with the option
    of using SCSI instead of IDE/ATA is why? There are several reasons why SCSI is
    a better choice in many situations. SCSI drives have better seek times and spin
    faster than IDE/ATA drives (currently, 15000 rpm vs. 7200 rpm). The fastest SCSI
    (Ultra 320) can operate up to 320 MB/s while the fastest IDE/ATA bus (ATA100)
    operates at only 100 MB/s. These factors allow SCSI to operate much faster than
    IDE/ATA.'
