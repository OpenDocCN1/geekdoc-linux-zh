  md: '# 1-14 Module I — What Linux?


    # Reliable Releases


    Unix servers boast the highest levels of reliability currently available. Servers
    running Linux have recently shown to be as reliable as large Unix servers. Many
    Linux servers boast uptimes (time in which the server has not crashed) in months
    or even years. Because Linux is open source and many developments are made by
    users, there is no corporate pressure to release new applications or upgrades
    by a certain date. Many Linux applications are first released as Beta versions,
    which are early releases of an application for testing by users. This provides
    invaluable program testing before it is officially released. If too many bugs
    are found, the stable version will not be released until the bugs are fixed.


    # The ext2 File System


    Linux utilizes the ext2 file system, which is much more powerful than other common
    file systems. Fragmentation, or the splitting of a single file onto different
    locations on a hard disk, is almost nonexistent in ext2 file systems. Having a
    highly fragmented disk, where files have been broken into smaller fragments and
    are stored in multiple locations around a hard disk, can greatly reduce efficiency.
    Constant creation and deletion of files often leaves file fragments ungrouped
    and forces the computer to search harder and longer to find needed files.


    Files are arranged in blocks that function like a file system, allowing the computer
    to find and use data. Ext2 reserves some blocks for the root account; normally,
    five percent of the blocks are reserved. This allows the administrator to recover
    easily from situations where processes fill up file systems. This prevents system
    lockdowns and gives the administrator ability to kill harmful processes when the
    system is overflowing with user data. The ext2 file system also keeps a constant
    check on itself. File systems give the status clean when there is a proper mount.
    However, an unclean file system is possible. For instance, if power is abruptly
    cut off from a computer, the file systems will be unmounted, on that file system
    check increases. When there is an unclean file system, the kernel runs a file
    system check When the counter reaches its maximum, a file system check is forced.
    As well as unclean file systems are checked. This prevents bad data on a read-only
    drive from slipping past the system check, which could possibly force the system.


    # The Server Influence


    Linux was originally built as a server, not a desktop OS. Because of this, when
    users are given accounts their abilities can be limited. Only the root account
    may alter system file systems and have master access. This prevents the possibility
    of damage that can be done once accidentally or purposely by users. Accounts in
    Linux are usually broken into groups. These groups are set up with certain restrictions
    and allowances unique to the purpose of the group. Root is always a group by itself,
    it has no restrictions and can read and write to any section of the drive. In
    a business atmosphere, users have access to their information and applications,
    but their group is denied access to other information. This is one of the powers
    of Linux, the ability to designate access. Accidents can be avoided by using the
    root account only for system administration. Mistypings and misspellings will
    not result in direct consequences if they are not made by the root account. Most
    administrators use a regular user account for all of their day-to-day tasks.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_21_0.png)'
  merge: -1
