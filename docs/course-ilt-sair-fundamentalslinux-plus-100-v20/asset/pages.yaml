  md: "# Installation Options\n\n# Installation Options\n\n+   Choosing How to Install\n\
    - GUI install\n  - Easier way to install packages\n  - Choose tasks rather than\
    \ individual packages\n- Text mode install\n\n+   What to Install\n- Compilers\n\
    \  - Used when installing a large amount of software\n- Servers\n  - Needs proper\
    \ file and mail server or Web server applications\n\n# INSTALLATION OPTIONS\n\n\
    ![](img/b0ea5e4a55ee6767fff087672e71c505_50_0.png)\n\nThe previous section covered\
    \ the various steps necessary to install Linux. This section discusses the configuration\
    \ of Linux and the many options available.\n\nA key aspect of Linux is the ability\
    \ to install packages suited to individual user requirements. Packages are sets\
    \ of tools and utilities which vary in size and capabilities. Some examples of\
    \ packages are GCC, C, Perl, and Python. Packages are usually specific and relevant\
    \ to the different uses of the computer, such as graphic design or networking\
    \ capabilities. Unlike other operating systems, which install all of the available\
    \ packages at one time, Linux allows the user to choose which packages to install\
    \ at the time of installation. This saves space on the hard drive by removing\
    \ unnecessary packages. The user could choose to do a full install. However, this\
    \ is discouraged, because it often results in the installation of unnecessary\
    \ packages and wasted disk space.\n\n# Choosing How to Install\n\nIt is better\
    \ to have user install Linux distributions from a Command Line Interface, or Text\
    \ Mode. Most users who start on a text mode install learn the power and simplicity\
    \ of running servers without the X environment overhead. For less experienced\
    \ users, the GUI method is preferable.\n\n# GUI install!\n\nNearly every distribution\
    \ of Linux offers some sort of GUI method. Notable exceptions are Debian and Slackware,\
    \ although some Debian derivatives offer minimal or extensive GUI methods for\
