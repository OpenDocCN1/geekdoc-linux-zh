    # INSTALLATION


    F0.9.10

    Many configuration problems can occur during the installation process of Linux,
    such as incorrect LILO

    configuration, problems booting the installation media, or software/hardware configuration
    issues. A few

    problems that may occur are discussed below.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_285_1.png)


    # Distributions


    Choosing the appropriate distribution of Linux is the most important step in the
    installation process.

    The Linux operating system has a variety of distributions offering different features
    and support. There

    are basic Linux distributions, designed to be used either in low-end situations
    or in a networked

    environment. There are novice distributions, which contain graphical installation
    programs. Finally,

    there are expert distributions that require a great deal of computer experience
    but allow for customizing

    the operating system to the most minute detail.


    # Creating a Boot Disk


    During the installation process, it is advisable to create a boot disk, which
    will prove indispensable

    for diagnosing and recovering a failing system. If a problem occurs during the
    initial boot process, a boot

    disk will be the only way to fix it, unless a bootable CD-ROM or a Linux system
    on other

    hard drive be used. Usually, Linux distributions provide a way to create a boot
    disk during the

    installation process.


    # System Requirements


    Like other operating systems, Linux has a few requirements of which the user should
    be aware. Some of

    these requirements are:


    +   * 4MB RAM (At least 16MB RAM for an installation with X Window)'
  merge: -1
  pgno: 285
- img_proc: true
  md: '# Installation 9-5


    # Multi-Booting


    Linux can coexist with many other operating systems, including DOS and Windows,
    although using multiple OSs can require repartitioning (resizing) or adding another
    hard disk. Tools are available to repartition the disk in both Linux and DOS.
    In Linux, GNU Parted does this, while in DOS the FIPS utility can be used. Commercial
    resizing packages, as Partition Magic, are also available. The disk partitioning
    has been performed, booting the operating systems from the hard drive requires
    the configuration and use of a boot manager, with LILO.


    +   * 3.5" floppy drive for boot disks

    * a minimum 100 MB of hard disk space


    # LILO


    The Linux Loader (LILO) is a kernel boot manager that relies on data from the
    computer''s BIOS to work. It resides on a hard disk MBR, in an actual disk partition,
    or on a floppy. The Basic Input/Output System (BIOS) is a program that a computer
    microprocessor uses to control the functions of the computer, including the keyboard,
    display screen, disk drives, or serial communications. The BIOS also manages initial
    data flow between the operating system and attached hardware devices, such as
    the hard drive. After the BIOS has completed its task, the LILO program takes
    over and provides a middleman for booting the actual operating systems. LILO can
    be used as the main manager for a system, because it is able to load Linux, Win98,
    OS/2, and several other operating systems with relative ease.


    Problems occur when trying to boot Linux from hard drive using LILO; some installation
    programs may make erroneous assumptions about the disk partition layout. In this
    situation, LILO will need to be reinstalled. If a boot disk was created during
    installation, edit the /etc/lilo.conf so LILO directs the correct kernel to boot
    the system.


    > NOTE: Remember that the lilo.conf program must be re-run manually every time
    an image is changed and every time the configuration file has been edited. If
    LILO is not re-run, the system could be unstable and might not properly boot.


    Another problem can arise after LILO has been installed is the system may be booting
    an operating system other than Linux. By pressing <TAB> at the LILO prompt, the
    label names of the configured boot systems will be presented. Type the name of
    the system to boot and press <ENTER>. The example /etc/lilo.conf contains entries
    for Linux and DOS. Like most scripts and configuration files in Linux, any text
    after a sign (#) is treated as a comment and is not parsed by LILO.


    ```

    boot = /dev/hda           # The master boot record or the root partition

    delay = 10              # Sets an interaction delay (in tenths of a second)

    vga = 0                # This is optional. e.g., vga=1 will provide an 80x50 console

    # linear                 # Uncomment to solve some geometry problems


    # default operating system image to boot, in this case, is Linux

    image = /dev/mlinux # The location of the Linux kernel file is specified

    root = /dev/hda1        # Specifies the root partition

    label = Linux            # This is the label of the image (any text string may
    be used)

    read-only               # Initially, the root filesystem should be mounted ro

    ```


    ![](img/b0ea5e4a55ee6767fff087672e71c505_286_0.png)


    SAIR Linux and GNU Certification -- Fundamentals/Linux+'
  merge: -1
