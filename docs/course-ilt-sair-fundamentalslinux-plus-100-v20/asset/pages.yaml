  md: '# The Appeal of Linux I-13


    # The Appeal of Linux


    +   * Stability

    * Customizing and Configuring

    * Reliable Releases

    * Different Distributions for Different Users

    * The ext2 Filesystem

    * Security

    * The Server Influence

    * Ownership and Permissions

    * Flexibility


    ![](img/b0ea5e4a55ee6767fff087672e71c505_20_0.png)


    # THE APPEAL OF LINUX


    Linux has made advances in the operating system world that would have been thought
    impossible only a few years ago. Linux boasts some of the best performance features
    seen on any OS. Its open source philosophy allows Linux to continue to evolve
    without the constraints of commercial production; new software can be developed
    rapidly. Linux''s flexibility and security are results of this philosophy. Any
    time a bug is found, programmers can recognize and patch the problem within days
    or even hours, which allows Linux to be one of the most secure operating systems
    available. Bugs are found and fixed by the user as the software companies, which
    also contributes to Linux''s stability. Linux is also set up like a server; having
    multiple users, multitasking, and multiprocessing is not a problem. Linux users
    can receive all these features for free.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_20_1.png)


    # Stability


    Linux''s stability means that the OS keeps running even if an application crashes.
    Applications are run independently and can be shut down without consequence to
    the system. An application crash in certain OS frequently requires a reboot because
    the actual OS is affected. When an OS is affected by a program crash, fragments
    of corrupt data prevent the operating system from running properly. This protects
    the operating system from application errors. Linux is designed not to crash;
    a reboot should be needed only after kernel changes or hardware reconfiguration.
    Almost all upgrades can be done without shutting down because most changes can
    be implemented while the OS runs.


    PO.1.60'
  merge: -1
