    # Memory slots


    As the name suggests, memory slots are where memory can be inserted. There are
    five types of memory slots in use today which are grouped into three memory module
    types: DIMM, SIMM, and RIMM. Table 10-2 lists and describes the common memory
    slot types.


    | Memory Slot | Function |

    |---|---|n| 184 Pin DIMM | This slot accepts DDR SDRAM, DDR Double Rate Synchronous
    RAM theoretically offers twice the bandwidth of regular SDRAM, but in real-world
    tests offers only about 50 to 60 percent more bandwidth. DDR SDRAM comes primarily
    in two variants, PC100 and PC200. These numbers reflect the maximum theoretical
    bandwidth of each type. For example PC1600 RAM has a maximum theoretical throughput
    of 1.6GBs. |

    | 184 Pin RIMM | This slot accepts Rambus RAM. Rambus is a significant departure
    from other memory technology and favors high speed and low bus width. Most systems
    support Rambus RAM offer two channels that are 16 bits wide and run at 400MHz.
    Current Rambus chips have a maximum theoretical throughput of 3.2GBs. Rambus chips
    are easily identified by the presence of heat spreaders on the Rambus chips. This
    gives them a distinct appearance similar to a ruler. |

    | 168 Pin SIMM | The 168 pin SIMM accepts other PC66, PC100, or PC133 RAM. This
    is by the most common RAM in use today. The numbers in names of different RAM
    grades for this slot signify the speed at which the RAM is rated to operate. 66MHz
    for PC66, 100MHz for etc. PC133 RAM has a theoretical maximum throughput of 1.08GBs.
    The other speed grades scale back in n linear manner. |

    | 72 Pin SIMM | This is an older technology not used on current systems. 72 pin
    SIMM slots accept such as EDO or Fast Page RAM. No current processors are designed
    to use this technology; it is certain to become obsolete. |

    | 30 pin SIMM | This slot was used in x86 system boards and is now basically obsolete.
    |


