  md: '# 6-26 Module 6 — The X Window System


    ![](img/b0ea5e4a55ee6767fff087672e71c505_175_0.png)


    Figure 6-12. Screen Shot of Gnome Desktop


    # Gnome panel


    The Gnome panel is a bar that resides (by default) along the bottom of the screen.
    There are six different parts to a Gnome panel: menus, applets, launchers, drawers,
    special objects, and hiding areas. The menu is located on the left side with a
    Gnome footprint as the icon. There is an applet next to the menu that is used
    to launch applications from a command line inside the panel. Three launchers are
    present on the right of that applet, followed by a special object used for navigating
    the different screens in Gnome. On the right side of the panel is a clock applet
    and two amusement applets: the Game of Life and Wanda Fish.


    To configure the panel, right click on any free space on the panel. A menu will
    appear with an option to configure and/or add different applications to the panel.


    # Menus


    A menu in a Gnome panel links to applications and folders. The main menu in Gnome
    cannot be removed, although other menus can be added and then subsequently removed.
    The main menu is traditionally located on the left side of the panel and can be
    configured through the Gnome Control Center.


    # Applets


    An applet is a program that runs completely within the panel. A clock applet is
    a clock. In Gnome, there is a default clock applet that displays the time (in
    12-hour, 24-hour, or Unix format) and the date. There are preconfigured applets
    that come with Gnome that can be installed through Gnome''s installation process
    or by the user at a separate time.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_175_1.png)'
  merge: -1
  pgno: 175
- img_proc: true
  md: '# Launchers


    Launchers are like applets that reside on the panel, providing links to applications
    or directories. To add a launcher, the user must have permission to execute the
    application that will be started by the launcher. Options that can be passed to
    the program when an application is started can be configured into the launcher.
    Other options for a launcher include which icon will represent it, if and where
    documentation for the application can be found, a name and comment for it.


    # Drawers


    A drawer is an extension of the panel. A drawer is best described as another panel
    attached to the original panel. Drawers can do everything that the panel can do,
    such as contain applets and launchers. They are mainly used to extend the capabilities
    of a panel which previously limited by size.


    # Other applications


    Special objects are those applications that do not fall into any other group.
    They are usually highly specialized and perform actions that are not possible
    through other applets. For instance, a logout special object is used to log out
    of the X Window system. There are also special objects for running programs, moving
    through the different desktops in Gnome, and locking the screen.


    The hiding arrows will slide the entire panel to one side of the screen, hiding
    it from view. This allows for more desktop space. Pressing the arrow again will
    extend the panel across the screen.


    # Gnome desktop


    The programs running under Gnome will reside on the desktop. In the picture of
    the Gnome session, the desktop shows the Gnome Control Center and the GIMP (GNU
    Image Manipulation Program). Desktops may be configured through the Control Center.
    Different configurations specify various qualities of a desktop, such as how the
    background will appear, and how many virtual desktops the environment has.


    The Gnome desktop can also contain links to programs and directories. These links
    are attached to the user and move around the different virtual desktops. Thus,
    if a user has a link to the Gnome File Manager on or his desktop, that link will
    be present on all the virtual desktops that the user has, the program that is
    started by that link will not move from one virtual desktop to another.


    # Gnome applications


    A wide variety of Gnome applications are available, from text editors and word
    processors to Web browsers and instant messaging clients. Some of these are still
    under development, nearly all can be used. Most Linux applications can be run
    with Gnome, even KDE applications, though these programs will not have the integration
    features of Gnome programs.


    The Gnome Control Center is an invaluable tool. Through this graphically driven
    program it is possible to configure all aspects of a Gnome session. This is a
    screen shot of the Control Center.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_176_0.png)'
  merge: -1
  pgno: 176
- img_proc: true
  md: '# 6-28 Module 6 — The X Window System


    ![](img/b0ea5e4a55ee6767fff087672e71c505_177_0.png)


    Figure 6-13. Gnome Control Center


    The Control Center, as shown in Figure 6-13, can configure the desktop, which
    all applications which control file types, multimedia, peripherals of the system,
    the session, and the user interface.


    Some other applications that come with Gnome are a file manager, audio file programs,
    character maps, and a large range of applets that are used for monitoring the
    system, amusement, and utilities.


    # KDE


    KDE is another freely available desktop environment. It has many of the functions
    as Gnome, such as a desktop panel and a Control Center, as well as its own collection
    of software. KDE describes itself as a network transparent, contemporary desktop
    environment.


    The KDE environment is composed of three parts: the KDE Panel, the Desktop, and
    the software libraries and applications that are part of the K Desktop Environment.


    # KDE panel


    The KDE panel resides along the bottom of the screen by default, with the ability
    to launch applications, holds menus for a user, and run applets like a clock and
    virtual desktop navigator. Figure 6-14 is a screen of the KDE panel:


    ![](img/b0ea5e4a55ee6767fff087672e71c505_177_1.png)


    Figure 6-14. KDE Panel


    The main menu is a stylized Icon which appears on the far left of the bottom panel
    by default. It holds many links to configure KDE, as well as links to the majority
    of the applications that are pre-installed. These menus hold launchers, called
    kdelinks, for other applications. All the links that are used in KDE are front-ends
    for text files that appear in the user''s KDE directory. These links can be configured
    to include the name of the program or device that will be loaded, comments, the
    path to the program or device, as well as other options, such as an icon and size
    of the window in which the program will appear.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_177_2.png)'
  merge: -1
  pgno: 177
- img_proc: true
  md: 'Kdelinks for applications can also be added by dragging an icon from the KDE
    file manager to the panel. All links can be configured to pass options and comments
    to applications when started.


    # KDE desktop


    The KDE desktop holds links to programs and devices. To add a link for a program
    to the desktop, right click on the desktop and select New then Program. Another
    way to do this is to drag an application from the file manager to the desktop,
    creating a link on the desktop.


    KDE supports virtual desktops. These are extra consoles that the user can switch
    between but only view one at a time. This allows more desktop space for the user
    when having just one desktop.


    The desktop also supports the KDE taskbar. This taskbar displays icons for applications
    currently running, whether it is minimized or not. This is a useful tool for keeping
    track of applications when several are open.


    # KDE software


    The KDE software is composed of several parts: the applications that come with
    KDE for user productivity, applications that are used to configure the system,
    and the underlying software libraries that are used to build KDE and to build
    software for KDE.


    KDE applications are varied. There is KOffice, which is an office suite designed
    to produce documents and presentations. Other software released with KDE includes
    graphic manipulation software, games and toys, for file management software, and
    the KDE Control Center.


    # KDE Control Center


    The KDE Control Center is the main program used to configure KDE. Through this
    application, the user can change system settings and the appearance of the KDE
    session. System information may also be obtained here. Figure 6-15 is a screen
    shot of the KDE Control Center:


    ![](img/b0ea5e4a55ee6767fff087672e71c505_178_0.png)


    Figure 6-15. KDE Control Center


    SAIR Linux and GNU Certification -- Fundamentals/Linux'
  merge: -1
  pgno: 178
- img_proc: true
  md: 'The Control Center configures applications, input devices, and keyboard bindings,
    as well as system interaction with the network. Window behavior, sound, and the
    desktop are also configurable from the KDE Control Center.


    # Libraries


    The underlying libraries for KDE are the Qt libraries. These are libraries released
    by Troll Tech, a company from Norway. Because KDE is built upon these libraries,
    Qt is needed for installation of KDE. The version of Qt that is needed depends
    on the version of KDE that is being installed. See the KDE Web site at www.kde.org
    for specifications on which version of Qt is needed for installation.'
