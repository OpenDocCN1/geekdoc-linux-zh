  md: '# LAB 01 - LOCATING LINUX RESOURCES ON THE WEB


    # Purpose


    This lab will familiarize the user with various Web sites that contain Linux documentation.


    # Lab Duration


    5 to 10 minutes.


    # Overview


    Although most free distributions of Linux do not come with much documentation
    or technical support hotlines, there is a wealth of information about Linux (and
    anything having to do with Linux) on the Internet. The key to accessing the proper
    documentation for a specific problem is knowing where to look. Simply entering
    Linux in your favorite search engine will return millions of results, most of
    which will be irrelevant to your specific problem. Better way to approach questions
    you might have about Linux, as a beginner, is by either looking for sites that
    specialize in frequently asked questions or reading Linux newsgroups and message
    boards.


    # Lab Exercises


    +   1. Familiarize yourself with the site www.linuxdoc.org. This site contains
    HOWTOs and documentation ranging from the most basic Linux commands to complex
    networking and administration tools. It may be particularly helpful to look at
    the FAQ-HOWTO at the following address: www.linuxdoc.org/FAQ/Linux-FAQ/

    2. Connect and navigate the site www.elin.com/. Find the support page at www.elin.com/support/
    This page contains some very helpful Web-based tutorials that take a user through
    some common and not so common command usage.

    3. Connect and navigate the site www.linuxlookup.com/. This site has a broad range
    of user services, including a broad range of useful tips as well as links to Linux
    news and products. This site also has some helpful documentation for Linux newcomers.

    4. A site which best outlines the motivations and significance of the open source
    software movement may be found at www.gnu.org/. This site gives a historical account
    of the state of GNU/Linux systems. This site also outlines the differences between
    the GNU GPL, copyleft, and free software, which are all concepts and terms upon
    which the Linux and OpenSource movements were constructed.'
