  md: '# Fast and wide SCSI


    The two adjectives, fast and wide will appear in the names of many of the SCSI
    modes. Fast SCSI isn''t a mode of SCSI, instead it refers to devices that use
    a technique to achieve a higher clock than 5 MHz (the original speed of SCSI-1).
    Since all the SCSI modes since Ultra SCSI operate at speeds greater than 5 MHz,
    the word ''fast'' has been dropped from the names of the newer modes. Wide SCSI
    is also not a mode, it refers to devices that operate over a 16-bit bus instead
    of the original 8-bit bus. It has also been dropped from the names of the newer
    modes since Ultra2 operates an 8-bit bus.


    While these different type of SCSI may seem confusing, they are really not. Over
    time, the two biggest impacts on performance, bus speed and width, have increased.
    The main difference between the modes is one or both of these two numbers. The
    bus speed and width along with the maximum throughput and signaling type of each
    mode are listed in Table 10-7:


    | Mode | Bus Width | Signaling | Bus Speed | Bus Throughput |

    |---|---|---|---||

    | Regular SCSI | 8-bit | SE or HVD | 5 MHz | 5 MB/s |

    | Wide SCSI | 16-bit | SE or HVD | 5 MHz | 10 MB/s |

    | Fast SCSI | 8-bit | SE or HVD | 10 MHz | 10 MB/s |

    | Fast Wide SCSI | 16-bit | SE or HVD | 10 MHz | 20 MB/s |

    | Ultra SCSI | 8-bit | SE or HVD | 20 MHz | 20 MB/s |

    | Wide Ultra SCSI | 16-bit | SE or HVD | 20 MHz | 40 MB/s |

    | Ultra2 SCSI | 8-bit | LVD or HVD | 40 MHz | 40 MB/s |

    | Wide Ultra2 SCSI | 16-bit | LVD or HVD | 40 MHz | 80 MB/s |

    | Ultra3 SCSI | 16-bit | LVD | 40 MHz | 160 MB/s |

    | Ultra160 SCSI | 16-bit | LVD | 40 MHz | 160 MB/s |

    | Ultra160+ SCSI | 16-bit | LVD | 40 MHz | 160 MB/s |

    | Ultra320 SCSI | 16-bit | LVD | 80 MHz | 320 MB/s |


    Table 10-7. SCSI Speed Comparison


    # SCSI Signaling Methods


    The signaling method is the physical way data is transmitted over a cable. While
    it may be easy to think of data as always binary digits, when data is transmitted
    it is actually stored as electronic charges. Since, these charges are susceptible
    to various types of magnetic interference, different signaling methods work better
    under different conditions. Over the years, SCSI has supported three different
    signaling methods, SE, HVD and, LVD, and the newest, LVD is the only signaling
    method that is supported by newer devices, it is important to recognize all three
    signaling methods so that the right cabling is used and properly connected to
    a newer bus.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_328_0.png)'
  merge: -1
  pgno: 328
- img_proc: true
  md: '# Single Ended (SE) signaling


    Single Ended (SE) signaling is the oldest type of signaling used for transferring
    data between SCSI devices. SE signaling was the first standard SCSI signaling
    method since it is inexpensive and relatively easy to implement. SE signaling
    uses a single wire to transmit a signal. A positive voltage over the wire represents
    a logical one and zero voltage represents a logical zero. SE was the signaling
    method of choice for many years; however, SE signaling is highly susceptible to
    interference. If the bus speed is, the amount of interference SE increases. If
    the length of the cable is increased, the amount of interference SE will also
    increase. Because of these physical limitations SE can not run at the high speeds
    required by today''s SCSI devices. Most new devices will operate in SE mode to
    retain backward compatibility with older devices, they will not be able to operate
    at their maximum speeds.


    # High Voltage Differential (HVD) signaling


    High Voltage Differential (HVD) signaling was developed to overcome the physical
    limitations of SE signaling. HVD uses a pair of wires to transmit a signal. Both
    wires will transmit zero voltage to represent a zero. One of the wires transmits
    a positive voltage while the other transmits the opposite voltage. By taking the
    difference between these two voltages, the receiving will be less susceptible
    to interference, however, due to high costs and the physical incompatibility with
    SE, HVD never caught on.


    # Low Voltage Differential (LVD) signaling


    As the speed of SCSI devices continued to increase and the popularity of HVD remained,
    a new signaling method was developed that combined the best attributes of SE and
    HVD and was physically compatible with SE. Low Voltage Differential (LVD) was
    defined in the SPI-2 specification and is the current standard for SCSI signaling,
    LVD never had the problem with high costs that plagued HVD and it is safe to mix
    SE and LVD devices on the same bus. Furthermore, most new LVD devices support
    SE mode for backward compatibility and are sold as LVD/SE or LVD/MSE (m for multimode)
    devices.


    # SCSI Cabling and Connectors


    There are several types of cables that are needed for different SCSI configurations.
    Different cables are needed for wide and narrow configurations and different cables
    are needed for internal and external SCSI buses. Also, although SE and LVD are
    physically compatible, the quality of SE cables is insufficient to LVD. For this
    reason, LVD cables are usually marked LVD or LVD Compliant.


    The various types of cables and connectors will be discussed in this section.
    In addition, illustrations will be provided for the different types of connectors.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_329_0.png)'
  merge: -1
  pgno: 329
- img_proc: true
  md: '# External cabling


    The construction of external cables is very different than internal cables. External
    cables are exposed to a larger number of factors that can cause corruption than
    internal cables since the PC case shields internal cables from most interference.
    External cables must have their own shielding to protect the data from interference.
    For this reason, external cables are also shielded cables. The cost of the extra
    shielding external SCSI cabling to be significantly more expensive than internal
    cabling.


    External cables use twisted pair cabling that is similar, however, to 10base7
    cabling.


    # Internal cabling


    Internal SCSI cables are ribbon cables similar to ATA/IDE cables. However, due
    to the faster speed of the newest SCSI devices, internal cables for devices that
    are Ultra2 or faster and LVD are twisted ribbons, or Twist-N-Flat cables, similar
    to the standard flat cable.


    # Narrow SE cabling or A cables and connectors


    There are five types of cables used for connecting narrow SCSI devices using SE
    signaling. These 50 pin cables used for connecting narrow SCSI devices using SE
    are known as A cables. Three of these cable types are used for internal connections
    and two are used for external connections. These cables and the connectors that
    they use are outlined below:


    +   - External Centronics A cable: This cable was introduced in the SCSI-1 specification.
    Instead of pins, this cable uses flat connectors (the same type of connection
    is used by a parallel printer cable between the printer and the cable). It is
    used to connect older external SE devices to narrow buses. Uses Centronics style
    Alternative-2 external connectors:


    ![](img/b0ea5e4a55ee6767fff087672e71c505_330_0.png)


    Figure 10-3. Male Centronics 50 pin Alternate-2 A Connector


    +   - External High Density A cable: This cable was introduced in the SCSI-2 specification.
    It is used for newer external SE devices that have high density (HD) Alternative-1
    external connectors.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_330_1.png)


    Figure 10-4. High Density 50 pin Alternate-I A Connector


    Some SCSI-1 devices also support a 50 pin cable with a D-shell connector. However,
    finding a SCSI host adapter with this type of connection is hard. It one of these
    drives must be attached to a computer, a cable adapter should be used instead.
    This connector is similar to the D-shell connector used on a VGA or serial cable:


    ![](img/b0ea5e4a55ee6767fff087672e71c505_330_2.png)


    SAIR Linux and GNU Certification -- Fundamentals/Linux+'
