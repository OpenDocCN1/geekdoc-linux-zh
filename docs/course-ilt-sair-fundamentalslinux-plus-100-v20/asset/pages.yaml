  md: '# Maneuvering in the X Display 6-19


    Two options in the tasklist can be confusing:Close Window and Kill Application.
    Close asks the client to close the window but leave other windows of the same
    application running. In programs such as Netscape, where many windows may be open
    at once, this can be useful for leaving Netscape running while closing one window
    of program. The Kill Application option can be used to kill all instances of a
    program. This is useful if the program has locked up or crashed.


    # Virtual Screens


    Another useful (and sometimes irritating) aspect of the X Window system is the
    virtual screen. The virtual screen allows the user to set up a screen bigger than
    the available display size, giving more room for displaying windows without cluttering.
    Navigation the user needs only to move the mouse to any side of the screen, and
    the screen will scroll in that direction. However, virtual desktop and virtual
    screen can have some problems interacting, so this should be taken into consideration
    before choosing to set a virtual screen.


    Virtual desktops are implemented by the window manager. When an application is
    not on the current desktop, the X server does not have to do any drawing for it,
    and it is not wasting video memory. Virtual screens, however, are implemented
    by the X server. A part of the screen that is out of view is still being drawn
    by the X server, even though it is invisible to the user. This can waste CPU time
    and video memory. For reason, most users prefer virtual desktops.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_168_0.png)'
