  md: "# GUI Administration Tools 6-31\n\n# GUI Administration Tools\n\n+   * Linuxconf\n\
    \  * Modules\n  * Interfaces\n  * Turbo Tools\n  * YaST and YaST2\n\n# GUI ADMINISTRATION\
    \ TOOLS\n\nF0.6.80 Performing administrative duties using the command line interface\
    \ (CLI) can be cumbersome. Graphical user interfaces (GUIs) simplify basic system\
    \ use by providing an easily understood format. System administration can be simplified\
    \ in the same way. Administrators are faced with many time-consuming tasks each\
    \ day. In the past, most administrators were forced to manually add users and\
    \ edit configuration files. Now these tasks can be accomplished using some form\
    \ of GUI tool, such as Linuxconf, the TurboLinux tools, and YaST.\n\n# Linuxconf\n\
    \nLinuxconf is a great administration tool that is compatible with Red Hat, Slackware,\
    \ SuSE, Caldera, and Debian. Most command-line administrative functions, such\
    \ as networking, user accounts, and system services, are readily available through\
    \ Linuxconf.\n\nOne version of Linuxconf exists as an easily navigated toolbar\
    \ for X, as shown in Figure 6-16.\n\n![](img/b0ea5e4a55ee6767fff087672e71c505_180_0.png)\n\
    \n> Figure 6-16. Linuxconf's X Interface"
  merge: -1
  pgno: 180
- img_proc: true
  md: '# Module 6 — The X Window System


    Each button controls a different aspect of the administration process. From left
    to right, they runlevel, time and date, printers, network configuration, modems,
    system configuration, kernel daemon management, and help systems.


    # Modules


    Linuxconf utilizes modules, which makes it easy to extend its control to new programs.
    Users may develop a configuration menu for their program and add to Linuxconf.
    This makes Linuxconf both versatile and scalable. There are modules available
    for many new programs. Adding the modules requires the user to use the setup.sh
    script, which makes the needed directory and sets up the required files. shellmod,
    which is a module as well as a stand-alone program, is the core of Linuxconf package
    and is the application used to build new modules. Some scripting knowledge is
    required, however, it is not difficult to design easy-to-use modules for Linuxconf.


    # Interfaces


    Linuxconf provides four different interfaces: command-line tools (using Ncurses),
    a GUI (using GTK+), and a web tool (using Java). The text and CLI interfaces are
    also useful tools they can be used remotely. The approach to system administration
    can be beneficial in configuring multiple machines with different settings. All
    machines connected to the web may be set up to allow remote administration. For
    example, if a system of machines had individual names like term1, term3, they
    could be set up with Linuxconf''s web interface and accessed separately.


    # Turbo Tools


    TurboLinux comes equipped with a collection of system administration utilities
    collectively known as the Turbo Tools. While Linuxconf uses many modules connected
    by a central program, the Turbo Tools are not connected to one central application.
    The 13 standard TurboTools are found in /usr/sbin. They are all text-based (using
    S-Lang), so they must be run in a terminal. The mouse is not available, so menus
    are navigated primarily by the arrow keys (see Figure 6-17).


    ![](img/b0ea5e4a55ee6767fff087672e71c505_181_0.png)


    Figure 6-17. TurboLinux Interface'
  merge: -1
  pgno: 181
- img_proc: true
  md: 'Turbo Tools consist of configuration programs designated for a specific aspect
    of a system. For example, sound configuration is controlled by turbosoundcfg.
    There is a tool for every part of the system. The standard tools consist of:


    | Turbo Tool | Configuration for |

    |---|-|

    | turboapachecfg | Apache Web server |

    | turbofptcfg | FTP; users, logins, accessibility |

    | turbonetcfg | Network configuration |

    | turbopipcfg | Configuration of Plug and Play Devices (PnP) |

    | turboprintcfg | Printers |

    | turbosoundcfg | Sound devices, setups |

    | turbousercfg | Account maintenance (adding, removing, etc.) |

    | turboffsyscfg | File system management |

    | turbohw | Hardware devices (Detecting and configuring) |

    | turbopkgkg | RPM Package Management |

    | turboppppcfg | PPP dialup configuration (Point to Point Protocol) |

    | turboservice | Current running services (updated process manager) |

    | turbotimecfg | Time and date configuration |


    **Table 6-4. Turbo Tools List and Their Purposes**


    Like Linuxconf, it is possible to add new configuration tools. It is much simpler
    to add to the Turbo Tools to configure Linuxconf, because there is no module system,
    only a number of independent tools. The only setup is installing the new configuration
    tool into /usr/sbin and running it.'
  merge: -1
  pgno: 182
- img_proc: true
  md: '# Module 6 — The Window System


    # YaST and YaST2


    Yet another Setup Tool (YaST) is part of SuSE''s administration. It combines the
    look and style of the Turbo Tools interface with the centralization of Linuxconf.
    The YaST program itself controls all aspects of system administration. Figure
    6-18 is a screen shot of the YaST interface.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_183_0.png)


    Figure 6-18. YaST Interface


    With the advent of Linuxconfx and X system administration utilities, SuSE has
    been forced to update YaST. Many users find command line or X interfaces to be
    easier.


    YaST2, unlike its predecessor, relies on X. Its window system is easy to navigate
    and provides a great detector/installer. On a general SuSE system, YaST2 looks
    somewhat like Figure 6-19:


    ![](img/b0ea5e4a55ee6767fff087672e71c505_183_1.png)


    Figure 6-19. YaST2 Interface'
