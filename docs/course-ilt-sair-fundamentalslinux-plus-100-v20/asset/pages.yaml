  md: '# LAB 05-02 - NAVIGATING THE FILE SYSTEM


    # Purpose


    The purpose of this lab is to give the user experience navigating the file system
    and finding files in that.


    # Lab Duration


    20 to 30 minutes.


    # Overview


    Navigating the Linux file system is done primarily with the change directory (cd)
    command. There are two basic ways to use cd. The user can either specify an absolute
    path to the directory they want to change into or use a relative path. Absolute
    paths can be illustrated with the following scenario.


    Suppose the user''s present working directory is /home/user. In /home/user there
    is a subdirector named stuff. To change into the stuff directory, the user could
    type cd /home/user/stuff. This specifies the path to the desired directory.


    A quicker way to accomplish the same task would be to use relative navigation.
    To do this, the user simply types cd stuff to change to the stuff directory. Examples
    of other ways to use relative navigation are given below.


    ```

    cd /stuff

    ```


    The tilde (-) represents the user''s home directory; this command changes into
    /home/user/stuff.


    ```

    cd ..

    ```


    This command moves up one level in the directory tree. For example, if the user''s
    present working directory is /home/user/stuff and the user executes this command,
    he will move up one level to /home/user.


    # Finding files


    Finding files on a Linux system by simply changing into a directory and listing
    its contents with the command ls can be a time consuming task. Unfortunately,
    there are tools to speed up this process. The two search tools on Linux systems
    are find and locate. Of the two, locate is faster and easier to use. To locate,
    there must be a database of all the files on the system. This database is created
    and maintained with updateddb. Normally, only the root user can execute updateddb,
    so the database can frequently be out-of-date. Running updateddb can take quite
    a while, so it is best to have it automatically when the system is not in use.
    If locate fails to find the requested file, find will likely be able to locate.
    find searches the file system by file until it encounters the one for it is looking.
    Therefore, it can be a slow sometimes depending on things, such as the size of
    the directory or the speed of the hard disk. Examples of the two commands are
    given below.


    ```

    find -name foo.txt -print

    ```


    This tells the machine to search, starting at the root directory (represented
    here by the slash) for a file named foo.txt and print those results back to the
    console. The results will look like this


    ```

    find / -name foo.txt -print

    /home/user/foo.txt

    ```


    ![](img/b0ea5e4a55ee6767fff087672e71c505_148_0.png)


    SAIR Linux and GNU Certification -- Fundamentals/Linux+'
  merge: -1
  pgno: 148
