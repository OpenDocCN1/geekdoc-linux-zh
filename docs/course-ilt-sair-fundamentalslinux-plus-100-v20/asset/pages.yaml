  md: '# FOREWORD


    # WELCOME


    Welcome to the Level 0 Fundamentals course for S Linux and GNU certification.
    While this course does not have a formal test, it is a good primer for those who
    want to investigate Linux. The four courses in the LCA are Installation and Configuration
    (3x-011), System Administration (3x-002), Networking (3x-003), and Security (3x-004).
    The four courses may be taken in any order, but the material is organized with
    the assumption that the 3x-011 is the first course. The 3x-002 is assumed to follow
    3x-011, then 3x-003, and finally 3x-004.


    Passing either the 3x-011 or the 3x-002 exams will earn the Linux and GNU Certified
    Professional (LCP) certificate. Completion of all four exams (the 3x-011, the
    3x-002, the 3x-003, and the 3x-004) will earn the Linux GNU Certified Administrator
    (LCA) certificate.


    While the LCA will attest to a certificate holder''s knowledge) and capability
    to administer a Linux system, there are two additional certificates, the LCE and
    MLCE, to confirm knowledge and skills in increasingly difficult Linux topic areas.


    # COURSE OBJECTIVES


    The overall goal of the course is to enable the student to have a basic understanding
    of Linux Fundamentals. More specifically, upon completion of the Fundamentals
    course, the student will be able to:


    +   * Define Linux and open source software.

    * Discuss the prerequisites for installing Linux.

    * Discuss steps for installing various Linux distributions.

    * Define the process for logging into a Linux session.

    * Describe the process for creating a graphical user interface.

    * Utilize basic shell functions.

    * Discuss file properties.

    * Perform tasks using basic shell commands.

    * Set up and configure an X Window system.

    * Use popular text editors.

    * Use common Internet applications.

    * Discuss package managers and their popular uses.

    * Employ basic networking commands.

    * Set up a basic network.

    * Define and perform general problem-solving techniques.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_6_0.png)


    SAIR Linux and GNU Certification -- Fundamentals/Linux+'
  merge: -1
  pgno: 6
- img_proc: true
  md: '# MINIMUM CANDIDATE REQUIREMENTS


    This course was not designed for the novice. It is assumed that the candidate
    has some computer experience. For example, the candidate should be familiar with
    basic hardware concepts, such as CPU, cache, memory, interface adapters, hard
    disks, and network. The candidate should also be familiar with basic operating
    system concepts, such as booting, file access, and device drivers. Finally, the
    candidate should know basic commands and the use of a Unix-type editors such as
    Joe, Pico, Vi, or Emacs.


    # OUR EDUCATIONAL PHILOSOPHY


    The software system referred to Linux is vast, complex, and constantly changing.
    Therefore, our task is to carefully organize and present information in such a
    way that each topic can be understood from a practical background perspective
    and from a step by step procedural perspective. Depending upon the current level
    of difficulty for a given topic, interrelationships among other topics are also
    introduced and discussed.


    In this way, your course work is guided from the overview of the knowledge array
    to individual topics, to step by step procedures, and back to a larger view to
    see how a given topic fits in with the other puzzle pieces that make up Linux.


    This teaching methodology also allows the student to see changes within and among
    Linux distributions and to put these changes in context with the system as a whole.'
  merge: -1
