  md: '# 5-40 Module 5 — Using the Linux File System


    Now, use the locate command on foo.txt:


    ```

    locate foo.txt

    ```


    This command tells the computer to search its locate database for foo.txt and
    then print those results back to the console. The results will look something
    like this:


    ```

    locate foo.txt /home/user1/foo.txt

    ```


    Note that locate will return the name of any file or directory that contains foo.txt,
    so the results can get confusing very fast, if the search occurs in many places
