    +   1. What is Pico?

    Pico is a simple text editor which comes as either part of the Pine mail program
    or as a separate program.

    2. What are the four different programs included within Netscape Communicator?

    Netscape Communicator is a composition of four programs: Netscape Navigator, Messenger,
    Address Book, and Composer.

    3. What is Lynx?

    Lynx is a powerful, multipatform, text-based Web browser.

    4. What is the GNU projectnThe project was begun by Richard Stallman in 1984 to
    create a free operating system.

    5. Describe the printing process.

    Data to be printed is either given directly to the print daemon by an application
    or given to the lpr command. The print daemon sends the file to a filter, which
    outputs a file that the printer can understand. This is then spooled by the print
    daemon. When the printer is ready, the print daemon copies the file to the printer
    and removes it from the spool.


