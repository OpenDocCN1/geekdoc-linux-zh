- img_proc: true
  md: 'If a user simply wishes to stop a running process rather than kill it, he or
    she would use the STOP signal, as follows:


    ```

    kill -STOP 3744

    ```


    To have the process continue running, the CONT signal should be used:


    ```

    kill -CONT 3744

    ```


    This will cause the stopped process to resume.


    # The killall command


    Another useful command is the killall command. Instead of having to go through
    and kill each process of a program that has multiple processes running, you can
    instead issue the killall command.

    For example:


    ```

    killall netscape

    ```


    In this case, if you have multiple windows of Netscape open on your desktop, you
    only have to issue this command, and it ends all processes labeled netscape.'
  merge: -1
