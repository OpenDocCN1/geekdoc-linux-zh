  md: '# EPROM


    Erasable Programmable Read-Only memory (EPROM) is a type of PROM that can be erased
    by exposing it to ultraviolet light.


    # EEPROM


    Electrically Erasable Programmable Read-Only memory (EEPROM) is a type of PROM
    that can be erased by exposing it to an electrical charge.'
