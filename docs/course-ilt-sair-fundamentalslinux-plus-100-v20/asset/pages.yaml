  md: "# Network Tools\n\n+   * Telnet\n  * Terminal Network\n  * Allows users to\
    \ remotely log in to a host from a terminal\n* FTP\n  * File Transfer Protocol\n\
    \  * Used for sending files from one machine to another\n\n# NETWORK TOOLS\n\n\
    Tools are application programs that interface with the user to perform certain\
    \ tasks. Although there are many utilities and tools that work with the Linux\
    \ operating system, only Telnet and FTP will be discussed in this section. These\
    \ are two common tools used on the Internet to connect with remote servers. They\
    \ most frequently use the TCP/IP protocol to connect from one machine to another.\
    \ Telnet and FTP are most located in the /usr/bin.\n\n# Telnet\n\nTelnet (Terminal\
    \ Network) allows users to log in to a host remotely from or other machine with\
    \ access to the network; both computers must be on the network, and proper user\
    \ identification and password must be supplied. Remote machines are identified\
    \ by either domain name or an IP address, and telnet defines a network virtual\
    \ terminal as a standard interface for remote machines. It will generally allow\
    \ the client and server to communicate and establish options, such as the data\
    \ will be transferred between the two machines. This program acts passively, not\
    \ forcing input from either side and allowing the program to act as the client.\n\
    \nIn Unix systems on the server side, telnet is handled by a daemon or process\
    \ called telnetd that runs in the server and generally waits for TCP port 23.\
    \ The telnetd process relate to each other and communicate control codes through\
    \ a terminal driver. From a Unix command prompt, users can initiate a session\
    \ by typing the command telnet followed by the host or IP address to start a remote\
    \ connection. If the address is valid and the user is able to connect with the\
    \ machine, he or she will be prompted for a username and password. Once this has\
    \ been entered correctly, the user will be able to communicate with the remote\
    \ machine as if using directly. This allows users to access all of the host machine's\
    \ services to which they have rights, including e-mail and an editing program."
  merge: -1
  pgno: 247
- img_proc: true
  md: '# FTP


    File Transfer Protocol can also be started from some stand-alone application programs
    running as overlays on the TCP/IP stack. Unlike telnet, FTP requires a control
    connection as well as a data transfer connection. Simply stated, FTP is used for
    sending files from one machine to another, as opposed to telnet, which allows
    the file to be edited on the host machine directly. Like telnet, it requires a
    login, a password, and a host address in order to be routed to a remote machine.
    The FTP client on most machines can be started by typing ftp at a command prompt.
    Once started, the user may type help for a list of available commands that can
    be used with FTP. Port 21 is reserved for FTP process connections. FTP has options
    to allow transfers in a binary format, in American Standard Code for Information
    Interchange (ASCII), or in Extended Binary Coded Decimal Interchange Code (EBCDIC).'
  merge: -1
