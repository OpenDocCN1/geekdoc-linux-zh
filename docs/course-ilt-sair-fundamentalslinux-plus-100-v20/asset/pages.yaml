  md: '# 8-32 Module 8 — Networking


    The simplest way to uncompress gzip and tar extensions simultaneously is to use
    the tar command with the following options:


    ```

    $ tar -xzf apache_X.X.XX.tar.gz

    ```


    This creates a directory and a number of subdirectories in which Apache''s results
    can be found. Change into the new directory, the name of which will be similar
    to /apache_X.X.XX/. Now that Apache is completely acquired, the next step is the
    compilation of the program.


    The more recent versions of Apache detect the operating system and automatically
    mold Apache to suit the computer. Apache has an out-of-the-box installation provided
    by the Makefile.tmpl file. The latest information about porting Apache to Linux
    is included with the latest download, named PORTING, in the /src subdirectory.
    The command to run the configuration to make Makefile is located in the /src directory.
    When the command


    ```

    $ ./Configure

    ```


    is run, the prompt will return with a number of declarations. If the configuration
    file was not altered, the declarations will tell the user not to employ the default
    settings. Experienced users may want to change them, but beginners should ignore
    this message. For more information on making changes and adding custom modules,
    use an editor such as Vi or Pico to open the Configuration file. Compiling the
    program is easy and done by using the make command on Apache.


    The make command is one word command:


    ```

    $ make

    ```


    The prompt will respond with several lines depicting the compilation of Apache.
    When this process is complete, the executable httpd is created in the /src directory.
    The direction of httpd concludes the compilation of the program.


    From here on, the installation of the Apache Web server is not more than moving
    configuration files. The configuration distribution files srm.conf-dist, access.conf-dist,
    and httpd.conf-dist have to be renamed as srm.conf, access.conf, and httpd.conf,
    respectively. These files are all located in the top-level conf directory. This
    is, in essence, the last step. The only thing left to is configure the server
    and run it.


    # Configuration


    The configuration of a server can only be described in general terms, because
    all individuals are different in one way or another. All of the information necessary
    to configure Apache is unique to each server. The configuration of the general
    attributes is stored in the httpd.conf file. The first thing to do is to edit
    the httpd.conf file and set the characteristics of the server, such as the port
    number, server name, server root, server admin, and user interaction. The next
    file to edit sets up the root of the document tree and special functions. The
    final file to edit is the access.conf file, which provides all the security settings
    for the Apache server.


    # Running Apache


    The configuration of the .conf files is complete, all that is left to do is execute
    the binary httpd. This can be done with the -f option for the path to the httpd.conf
    file. For this example, the command would be:


    ```

    $ /usr/local/apache_X.X.XX/httpd -f /usr/local/apache_X.X.XX/conf/httpd.conf

    ```


