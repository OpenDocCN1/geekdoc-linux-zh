  md: 'monitor refresh rates, differences. The XF86Setup utility offers a range of
    approximate refresh frequencies only where exact and optimal refresh frequencies
    can be obtained from the monitor file.


    monitor section. Lists possible graphic modes and the refresh rate for each graphic.


    mount point. A directory where the file manager switches to the root file system
    (the hard disk) to another device, such as the CD-ROM or floppy diskette.


    mounted CD-ROMs. A mounted CD-ROM cannot be removed from the drive since the eject
    button is disabled while the CD is mounted. CD-ROMs are mounted as read-only volumes,
    meaning that a permission- refused error is returned (as opposed to device error)
    the program that attempts to write on the CD-ROM.


    mounted disks. Disks should be mounted so that any application, such as WordPerfect,
    can directly access files on the device. Access to an unmounted disk is available
    through the Mtools programs, as mere and write. Accessing the disk with mtools
    avoids using the mount and unmount commands.


    mounted volumes. Access to physical volumes is controlled by associating a given
    disk or one of its partitions with a logical directory name. Switching to that
    directory provides access to files within that volume.


    mouse interfaces. The two most common interfaces are the PS/2 and serial port.


    mouse protocols. The two most common protocols are Microsoft two-button and MouseSystems
    three-button.


    multitasking. The ability to save the state of a program, select another program
    to run, restore the state, and run the selected program from the point where it
    was previously suspended.


    multivolumes. Administrators configure multiple volumes so that, in the event
    of disk overflow, other key system programs can continue running.


    named and unnamed volumes. Most OS name each hard disk or hard disk partition,
    and the name must be known by the user to access files. However, on a Unix-like
    OS there are no names for a given volume.


    nenccript filter. Translates ASCII output into multi-page PostScript format.


    newusers. A program that adds passwords where the other programs will not, but
    it also encourages the system administrator to leave a plain-text list of passwords
    over the system.


    nice command. Lowers the specified program''s priority by increasing its priority
    number from 0 to 20.


    num lock. Keyboard-based driver that toggles the use of the numeric keypad.


    odd controllers. Early CD-ROM drives were initially attached to a variety of sound
    cards. This type of controller required a driver that can access a particular
    CD-ROM model through a specific type of sound card.


    one-at-a-time configuration. This method of configuration is required, because,
    if cards with conflicting values were installed, the CPU would be unable to communicate
    with either card. The power should be turned off to avoid damaging cards. Once
    one is configured to a different parameter, the other may be installed.


    online documentation. The Internet provides three types of on-line documentation.
    The first is made up of Linux repositories that contain HOWTOs, FAQs, and some
    manuals on Linux components. The second type consists of outlets for businesses,
    individuals, and news groups. The final type of documentation encompasses information
    obtained from search engines such as Altavista, Hotbot, Yahoo, and Deja.


