  md: '# 8-38 Module 8 — Networking


    | Option | Function |

    | --- | --- |

    | ACCEPT | Packets matching this rule will be accepted |

    | DENY | Packets matching this rule will be dropped |

    | REJECT | Packets matching this rule will have an error message returned to the
    source |

    | MASQ | Packets matching this rule will be masqueraded |


    Table 8-8. ipchains Options


    It is important to note that using REJECT instead of DENY will double the amount
    of network traffic and provide potentially useful information to people attacking
    the system. This is because DENY causes all packets matching a rule to be lost,
    while REJECT sends an error message back to the packet''s source.


    # Options


    Some of the common options used with ipchains are listed in Table 8-9. Consult
    the manual pages for additional options.


    | Options | Function |

    | --- | --- |

    | -A chain | Appends the given rule to the specified chain |

    | -I chain | Inserts the given rule at the beginning of a chain |

    | -F | Flushes all rules from the chains |

    | -P policy | Defines the default policy |

    | -i interface | Rule applies to the specified interface |

    | -p protocol | Rule applies to packets of the type protocol |

    | -s address port | Option applies to packets coming from the specified address
    |

    | -d address port | Applies to packets going to the specified address |

    | -j policy | Defines the action to be taken if the rule matches |


    Table 8-9. Common ipchains Options


    When specifying IP addresses as an option, an important concept is the bit mask.
    It is appended to the end of an address and is used to specify the number of bits
    to the left in the address. A mask of /16 matches all addresses, while a mask
    of /32 matches the exact IP address. For example, the address 192.168.56/16 would
    match all private class C IP addresses from 192.168.0.0 to 192.168.255.255.


    An important consideration when using ipchains is that the rules that will be
    added are not permanent; they are lost every time the system reboots. It is recommended
    that the firewall commands are placed in a shell script to be executed each time
    the system reboots. This ensures that the same rules are always applied and duplicate
    work is prevented.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_263_0.png)'
