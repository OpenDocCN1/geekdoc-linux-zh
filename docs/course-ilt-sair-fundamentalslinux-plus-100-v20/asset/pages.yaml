  md: '# Removing User Accounts


    Removing a user account is a simple task. The easiest way to remove an account
    is to use the userdel utility:


    ```

    $ userdel username

    ```


    This application removes all entries applying to the specified username in the
    /etc/passwd, /etc/shadow, and files, but if userdel is run with the -r option,
    it will also remove the user''s directories and files, but it is suggested that
    these files be saved to a backup before doing this.


    If the system administrator does not wish to use this utility to make these changes,
    he or she can manually remove all entries from the same files as well as remove
    the user''s files and directories.


    # The Shadow Password File


    Many programs that run on a system use the /etc/passwd for information other than
    passwords, and for this reason, it should be kept readable. However, if a user
    has access to the encoded passwords, and several of those passwords might be possible,
    which is why the shadow file exists. The passwords are separated out of /etc/shadow
    into the /etc/shadow file, which is readable by root. The command used to create
    the /etc/shadow file is pwconv, which should be run at the command prompt. The
    shadow password file now contains the encoded password entry and information about
    the password. However, because this file is only readable by root, the information
    in it is more secure than when it was in the /etc/passwd file.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_69_0.png)'
  merge: -1
