  md: '# 5-32 Module 5 — Using the Linux File System


    By looking at the synopsis, the user can deduce the proper structure of a command:
    man -option section. The OPTIONS field gives descriptions of what each option
    does. To learn what the -h option does, look through the OPTIONS field for -h
    and read the description. SEE ALSO field contains keywords that are related to
    the topic. These can be very useful for helping on a topic. Many processes in
    Linux appear to be only one program when in fact they are using multiple programs.
    For example, complications with Sendmail may be the result from the numerous other
    programs Sendmail may need in order to.


    # Mailing Lists


    A massive number of mailing lists have also been established to address user problems.
    Topics on these lists can range from basic to advanced Linux security issues.
    These lists are a great source for personal user-user help and information, and
    the recipients are kept current on new problems and new solutions. Keeping informed
    is the best way to prevent problems.


    Problems discussed in the mailing lists may be great help later. Sometimes user
    problems do not have anything to do with commands, rendering the man pages useless.
    Therefore, mailing lists can be a great, free alternative to expensive technical
    support.


    The only drawback to a mailing list is the time between the question and the answer.
    On busy lists, the reply may come days, and more often, days later. This poses
    a problem for users needing an immediate answer. Getting to the people on the
    mailing list can be advantageous. It is much easier to get replies from knowledgeable
    friends instead of faceless nicknames.


    # Newsgroups


    Newsgroups are similar to mailing lists. Newsgroups are postings by users to a
    remote server but are not sent via e-mail to everyone on it. Instead, the postings
    stay on the server for users to find and read. Newsgroups are a great way to find
    specific information on a topic. There are a few newsgroup archives, such as www.deque.com
    and www.remarq.com, where users can search archived answers for questions. A simple
    Sendmail problem may be quickly solved by searching a newsgroup for the keyword
    *sendmail*. It is important to use Boolean search variables to narrow the search.
    Characters such as * and ? are not available on most search engines. By adding
    + to the front of a keyword, the search returns the exact keyword along words
    that share parts with it. For example, the keyword sendmail without + will allow
    the server to return documents with send, mail, and sendmail, and any related
    topics. By adding quotes around a phrase, the server will return only the documents
    containing the phrase for word. By typing "+sendmail help", the server will only
    return documents that contain the phrase sendmail help in this. This is very important
    when searching an archive that may contain thousands of messages. With an extensive
    search, newssgroups can be a great source of information.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_141_0.png)'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# Technical Support


    Technical support is a reliable alternative, but such reliability costs money.
    Most distributions sell support for their package for a nominal fee. For the novice
    user, this can be very helpful in solving problems in the least amount of time.
    Technical support is typically available during most hours, and a personal conversation
    with a licensed technician is always available. Online support is available from
    distributions and companies always. When a user pays $60 for Linux distribution,
    much of that money is for technical support, whether it is an online archive or
    technical support by phone. Private commercial Web sites have begun offering support
    at a discounted price. These can range from cheap emails to contracted house.
    In addition, many companies are now specializing in setting up systems for a fee.
    This is, for initial setup and can cost a bit of money. Technical support can
    be a great medium for novice users who would rather spend a little money to save
    time.


    # Linux Help Online


    There are many Web sites devoted to free help for the novice user. Sites such
    as www.linuxdoc.org (home of the Linux Documentation Project) and www.linux.org
    offer huge archives of Linux information as well as mailing discussions. HOWTOs
    are explanations about specific programs and Linux-related processes. These are
    provided by the LDP. These Web sites are valuable to constant updating and massive
    information archives. Anytime a new program is released, it is likely that help
    is available on it within a few days and that will be posted as soon as possible.


    The best possible information about a subject usually comes from its source. A
    new program often has its Web page offering downloads, information, and help about
    the program. Finding a program''s home page can sometimes be a problem, though.
    The site www.freshmeat.net is a helpful place to find information about a program,
    especially a program''s fraîche is updated daily, and every new Linux program
    is listed there. There is basically an extensive links page to downloads and homepages
    available on the Web, and can be a great starting point for finding program information.


    # IRC


    Internet Relay Chat (IRC) can also be a great resource for Linux users. Channels
    as #Linux or #LinuxHelp can be great for immediate answers to questions and discussions
    about solutions to lingering problems. IRC is a gathering place for Linux users,
    as well as users of other operating systems, around the globe. It is a perfect
    medium for real-time information sharing with many people at once. Many people
    on IRC are willing and able to help other Linux users with their system problems.


    # Books


    The final resource is books. There are more Linux books available now than ever
    to address specific problems. For example, a basic search of the word Linux at
    www.amazon.com returned 413 different books. Books devoted to broad topics like
    networking or hardware are as common as very specific books dealing with the kernel
    or the TCP/IP protocol. Books are available for specific distributions and are
    often included with the CD-ROMs for a price.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_142_0.png)


    SAIR Linux and GNU Certification -- Fundamentals/Linux'
  merge: -1
