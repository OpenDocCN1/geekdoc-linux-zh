    \ Linux distributions install X by default, it is not necessary to manually install.\
    \ Still, it is entirely possible to install X on a running Linux system.\n\n![](img/b0ea5e4a55ee6767fff087672e71c505_154_0.png)\n\
    \n# Installing the X Window System\n\nIt is well-advised to install from a distribution's\
    \ media using appropriate options. Installing the X Window System manually is\
    \ a formidable install for most normal users and many administrators. Ideally,\
    \ the distribution vendor has a full install of the X Window System on the CD-ROM\
    \ for convenience.\n\nIf not, the next option is to download the latest version\
    \ from the XFree86 Web site **www.xf86.org**. Downloading the latest version can\
    \ help ensure the latest video cards are supported.\n\nThe version of XFree86\
    \ being used by the X Window System can be checked with the following command:\n\
    \n```\n$ X --showconfig\n```\n\nThe XFree86 site contains four different distributions\
    \ that differ by processor and library version. To determine which version of\
    \ XFree86 to choose, download the **Xinstall.sh** script, and run it with the\
    \ command:\n\n```\n$ sh Xinstall.sh -check\n```\n\nThis will determine precisely\
