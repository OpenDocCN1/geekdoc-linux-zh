    # The main interface


    To launch MC, type mc at the command prompt and press <ENTER>. This command brings
    up a MC interface on the screen, as shown in Figure 6-10.


    This interface is divided into four parts:


    +   - The top line is the menu bar.

    - The second line to the screen is the shell command line.

    - The last line is for function keys.

    - The rest of the screen is divided into directory parts.


    # Directory navigation


    To move from one directory to another use the arrow keys and <RETURN>. When using
    a mouse, click on the directory to highlight it and double-click to open it.


    # File selection


    To select a group of files, the user should be familiar with wild cards, which
    allow more than one file to be selected at once.


    To select and deselect a single file, use the <INSERT> key. This key acts as a
    toggle switch for this function.


    A group of files may be selected by either repetitively using the <INSERT> key
    or by pattern matching:


    +   - Press the <> key.

    - A dialog box will appear.

    - Type the pattern to be selected followed by an <>. For example, to choose all
    files that begin with ic, type ic* in the dialog box.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_170_0.png)'
