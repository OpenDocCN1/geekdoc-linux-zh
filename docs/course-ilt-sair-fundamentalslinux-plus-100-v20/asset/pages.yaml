    # USING A GRAPHICAL USER INTERFACE


    The Graphical User Interface (GUI) has become a popular standard for personal
    computer use. The desktop environment provides additional functionality over a
    Window Manager environment by allowing such tasks as cutting and pasting across
    all applications run within that desktop environment.


    GUI environments provide an intuitive and familiar platform on which to perform
    computing tasks, and typically consist of at least the following:


    +   * Windows

    * Icons

    * Menus

    * Dialog Boxes

    * Other graphical components


    # Xfree86


    Linux provides a GUI through the XFree86 project, an implementation of the X Window
    System. Two popular desktop environments are the GNU K Desktop Environment. Both
    of these graphical desktop environments provide a configurable, user-friendly
    interface that will run on most distributions of Linux. These environments both
    feature drag-and-drop support, multilingual support, common utility programs,
    configuration mechanisms, extensive documentation, and development support.'
