- img_proc: true
  md: '# Module 3 — Installation


    # Plug-n-Play Devices


    Plug-n-Play (PnP) is a component that was added to ISA devices to make them behave
    more like PCI devices in terms of automatic resource allocation. While Linux has
    no trouble accessing PCI devices, ISA PNP devices present. Many devices (especially
    sound cards) are problematic, in the presence of a modern BIOS. Operating systems,
    such as Windows, have built-in PNP support, and the upcoming Linux 2.4 will also
    support PnP. In the meantime, Linux users wishing to use PNP devices must rely
    on a software called isnaptools.


    The first step in configuring PNP is to use the pnpdump command to get a list
    of the PNP devices. The superuser should redirect the output of pnpdump to /etc/isapnp.conf.
    This file contains a section for each PNP device on the system, with the possible
    settings commented out. Sometimes the proper settings are not listed, and the
    user must select them manually. The proper settings for the device can be found
    in the device documentation or by checking its configuration in another OS.


    After /etc/isapnp.conf is set properly, the administrator should place the command
    isapnp/ /etc/isapnp.conf in one of the startup files, usually stored in /etc/rc.d/init.d/or
    /etc/init. The command should also be linked into the directory for the root level,
    which must distributions already take care of this.


    # Loadable Modules


    Compiling a driver into the kernel is not as flexible as using a module. Information
    such as IRQs can only be specified during the boot process when the device driver
    is compiled into the kernel. Also, when the device is not in use, the device driver
    is still occupying valuable memory.


    Loadable modules offer a better alternative to compiling a driver directly into
    the kernel. Depending on the device, parameters such as Interrupt Request (IRQ)
    or Input/Output (I/O) may have to be specified. This additional information is
    needed for sound cards. In this case, the driver should be compiled as a dynamically
    loadable module. The user should place the information in /etc/modules.conf or
    /etc/conf.modules. File name may be used, but only one of these should be used.
    This information will be provided to the module each time it is loaded.


    # Commands for configuring modules


    Modules can be loaded with the insmod, modprobe, or kmod commands. insmod is a
    simple command which automatically loads a single module into the kernel. If the
    module depends on other module loaded first, insmod will fail. A list of all modules
    and their dependencies must be generated for modprobe or kmod to work. This list
    is generated by issuing the command depmod -a. This command must be run every
    time new modules are installed.


    modprobe is one of the more sophisticated commands; it will load all modules that
    the specified module depends on. It will load the specified module. Using insmod
    is the most common method for loading modules into the kernel. kmod is a special
    kernel thread which automatically loads modules as they are needed and unloads
    them after a certain amount of time.


    # Obtaining Information


    Many users do not use Linux to gather information about their devices, but rely
    instead on another operating system. The most common cause for this is that distributions
    do not provide a way to obtain the information. However, all the necessary information
    is in Linux. The user must manually look for information in the /proc file system.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_73_0.png)'
  merge: -1
  pgno: 73
- img_proc: true
  md: '/proc is a special file system that Linux maintains. It exists entirely in
    memory and is not stored on any disk. It contains a multitude of information about
    the system, including information about the computer''s devices.


    Some useful files in /proc are interrupts (which lists the IRQs currently being
    used), iports (which lists the I/O ports currently being used), dma (which lists
    the Direct Memory Access channels currently being used), pci (which lists the
    PCI devices being used), and devices (which lists the device drivers currently
    configured in the kernel). The contents of these files are valuable references
    when configuring a device.'
  merge: -1
