  md: '# File System Navigation


    Knowing how to navigate through the system is important for every user.


    There are two types of paths, absolute and relative. Absolute paths contain the
    entire path to follow. For\instance:


    ```

    /bin/bash

    ```


    or


    ```

    /home/mark/my_stuff/

    ```


    Relative paths do not contain the entire path; instead, they work relative to
    the current directory. For

    instance, if a user were in the directory /usr/local and wanted to move to /usr/local/bin/,
    he

    or she would simply indicate the bin/ directory by doing the following:


    ```

    bin/

    ```


    The forward slash (/) before any of the directories indicates to start from the
    root directory. Leaving it out

    means to continue with the current directory, and look for bin/ within this directory
    structure.'
