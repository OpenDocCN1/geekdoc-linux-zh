  md: 'The SAIR Linux and GNU Certification program is committed to providing the
    highest standard of Linux and GNU training and certification. SAIR Linux and GNU''s
    training and certification will assist Information Technology (IT) professionals
    in their career advancement. SAIR Linux and GNU''s commitment to the IT community
    is especially helpful as our industry enters an era where training and certification
    are becoming routine. Establishing oneself as a competent IT professional requires
    practical experience as well as certificates for validation of skills. SAIR Linux
    and GNU Certification promises to supply you with all the knowledge and information
    necessary for to succeed as a Linux and GNU open source professional in this rapidly
    growing industry segment.


    # Fundamentals


    This course is independent of the SAIR Linux and GNU Training and Certification
    program. It covers concepts behind the Linux operating system such as Linux history,
    trade-offs, pre-install instructions, basic install, a general Linux session,
    the file system, the XWindow system, networking tools, troubleshooting, and basic
    kernel compilation.


