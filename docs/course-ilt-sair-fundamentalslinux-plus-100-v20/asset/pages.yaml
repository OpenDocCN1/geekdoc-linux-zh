  md: '# Limited Commercial Software


    Linux does not provide an abundance of commercial software. Windows-specific software
    may not be available, such as Internet Explorer and MS Office. However, replacements
    for most of this software is available; Netscape Navigator can replace Internet
    Explorer, while StarOffice can replace MS Office. In addition to this, some gamers
    may be disappointed with the lack of games packaged with Linux binaries. However,
    games are ported to Linux relatively quickly.


    # CLI vs. GUI


    The use of Command Line Interface (CLI), or shell, versus Graphical User Interface
    (GUI) is often debated in the Linux community. GUI provides a novice user with
    an easy point-and-click environment to gain competence in Linux. The GUI is typically
    less efficient and complete than CLI, as the GUI has the choice of commands on
    its menu. CLI allows a user to accomplish tasks more quickly using powerful commands
    and options. GUI is also slower because of the time and processing power it to
    load graphical windows and dialog boxes.


    A trade-off of CLI is the need to remember commands, options, and file names.
    The shell has a rich set of text commands, but because they are manually keyed
    in by the user, mistakes are common. Having different options for performing the
    same task provides flexibility as well as adding complexity, thus delivering greater
    functionality and usability.


    The command line tends to be the primary interface for programmers. A GUI is primarily
    used for editing. The shell is a better tool to use in explaining how to maneuver
    around the system; commands, such as cat jwind.conf, are more easily relayed than
    describing which icons should be clicked.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_27_0.png)'
  merge: -1
