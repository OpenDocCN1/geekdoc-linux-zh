    magic filter. Converts between DVI and PostScript; it also converts PostScript
    format into native graphic format for various printer types.


    man k command. Searches only for key words found in the title of each documentation
    page.


    man pages. Documentation on acceptable arguments for the program and how the arguments
    change the programs. However, the program is discussed in isolation, with no consideration
    to program interaction information.


    mark-up. In processing programs, text display and text creation are two separate
    processes.


    Master Boot Record (MBR). The sector that the BIOS first reads in and starts when
    the machine is booted.


    media. Form of portable storage and data transfer (e.g. diskette, CD-ROM, etc.)


    media format. Notes the OS for which a particular media is optimized (e.g. MS-DOS,
    Macintosh, Linux, etc.)


    memory size problem. Most older SIMM mainboards do not have cache addresses that
    go beyond 64 MB. If this is true, the system will slow considerably (to around
    12 MHz with 70 ns memory) memory references go beyond the example, the 64 MB address
    range.


    menu disorientation. Unfortunately, many menu items repeat in lower level menu
    within the menu hierarchy. For example, when the linuxconf program menu selections
    are as follows:


    ```

    Config --> User accounts --> Normal-->User accounts,

    ```


    the user may become disoriented, and become confused about where he or she is
    located within the menu hierarchy.


    message direction. Syslog sorts, and if requested, duplicates messages into various
    files based on directions in the /etc/syslog.conf.


    log file. A file containing the string of messages processed in a network over
    a period of time.


    modularity, hierarchical. System programs typically provide layers of functionality
    by commonly needed functions in lower level modules (programs) so that higher
    level programs may use and share the lower level modules when they are needed.


    modularity, Linux. Linux is made up of many types of programs that are interrelated.
    Although each program may stand alone, its true value is not apparent until it
    is seen interacting with other system programs.


    monitor damage. The refresh rate paints the pixels across the CRT at a particular
    rate per second. Generally, a faster refresh rate is better for viewing comfort,
    but too high of a rate will break the raster-scan circuit in the monitor.


