  md: '# Different SCSI modes


    Most SCSI devices on the market will be described as SCSI-2 compatible or SCSI-3
    compatible. This is not the best indication of what the device can do, because
    these two standards cover many different types of devices and the latter has not
    been officially standardized. The best indication of the performance and compatibility
    of a SCSI device is the modes that it supports. Most SCSI devices support a number
    of different modes to ensure compatibility. These modes are usually listed on
    the packaging of the device or on the Web site of the device manufacturer. It
    is safe to use these modes as a compatibility between different devices.


    Table 10-6 lists the many different SCSI modes, along with a brief description
    of each and the standard which they define:


    | Mode | Description | Defining Standard |

    |---|---|---|n| Regular or SCSI-1 | The original SCSI. This type of SCSI does
    not have an official name, it is usually referred to as SCSI-1 or regular SCSI.
    | SCSI-1 |

    | Wide SCSI | Wide SCSI supports a 16-bit bus. It is also referred to as Wide
    SCSI. | SCSI-2 |

    | Fast SCSI | Fast SCSI uses 10 MHz signaling. It is also referred to as Fast
    SCSI. | SCSI-2 |

    | Fast Wide SCSI | Contains the features of both Fast SCSI and Wide SCSI. It is
    also referred to as Fast Wide SCSI-2. | SCSI-2 |

    | Ultra SCSI | Ultra SCSI uses 20 MHz signaling. | SCSI-3 / SPI |

    | Wide Ultra SCSI | Wide Ultra devices use 20 MHz signaling on a 16 bit bus. Also
    known as Wide Ultra SCSI. | SCSI-3 / SPI |

    | Ultra2 SCSI | Ultra2 SCSI uses 40 MHz signaling. It is also (but not commonly)
    referred to as Fast-40 SCSI. | SCSI-3 / SPI-2 |

    | Wide Ultra2 SCSI | Contains the features of both Ultra2 SCSI and Wide SCSI.
    It is also referred to as Wide Ultra SCSI-2. Rarely referred as Fast-40 SCSI |
    SCSI-3 / SPI |

    | Ultra3 SCSI | Uses doubles clicking to achieve a bus throughput of 160 MB/s.
    With the introduction of Ultra2 SCSI, support for an 8-bit bus was dropped. Ultra3
    devices are only required to implement one of the five features of SPI. | SCSI-3
    / SPI |

    | Ultra160 (Ultra160/mn) SCSI | Essentially the same as Ultra, but since devices
    did not support a throughput of 160 MB/s it could still be Ultra3 devices, the
    Ultra160 name is commonly used to avoid confusion. Ultra160 devices are required
    to implement three of the three features of SPI-3. | SCSI-3 / SPI |

    | Ultra160+ SCSI | Essentially the same as Ultra160, however, with Ultra160+,
    all of the five features of SPI are mandatory. | SCSI-3 / SPI |

    | Ultra320 SCSI | Ultra320 SCSI devices support a maximum throughput of 320 MB/s
    using an 80 bit bus and double transfer clock. At the time of this book, SPI-4
    had not been finalized and no Ultra320 SCSI devices were available on the market.
    | SCSI-3 / SPI-4 (not finished) |


    Table 10-6. Different SCSI Modes


    ![](img/b0ea5e4a55ee6767fff087672e71c505_327_0.png)'
