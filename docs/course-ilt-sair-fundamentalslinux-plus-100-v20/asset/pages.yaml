  md: '# Logging Out or Shutting Down a Linux System


    # Logging Out or Shutting Down a Linux System


    +   - System Shutdown Process

    - What Happens If an Improper Shutdown Occurs?

    - Commands for Properly Shutting Down

    - Manual Shutdown by the Superuser

    - Using <CTRL-ALT-DEL>


    ![](img/b0ea5e4a55ee6767fff087672e71c505_104_0.png)


    # LOGGING OUT OR SHUTTING DOWN A LINUX SYSTEM


    ![](img/b0ea5e4a55ee6767fff087672e71c505_104_1.png)


    For a Linux system to function properly, it must be shut down correctly. Shutting
    down a running Linux system without the correct procedure could cause various
    problems, such as the following:


    +   - Linux keeps disk buffers that are written to disk periodically. If the system
    is shut down abruptly, the information on the buffers could be lost.

    - Any open files will not be closed, which could cause these files to be lost
    or corrupted.

    - The file systems might not be properly mounted before shutting down, which could
    lead to data loss.

    - The system may not boot properly.


    There are three methods used to properly shut down a Linux system. These are using
    the shutdown utility, shutting down manually by the superuser, and using <CTRL-ALT-DEL>,
    provided that this sequence is set on the system.


    # System Shutdown Process


    The four events occur when shutdown is issued:


    +   - All the users currently logged into the system are notified that the system
    is going to shut down.

    - The login is blocked, meaning the system will not allow users to login after
    the shutdown command is issued. This is done by creating the file /etc/nlogin
    with a warning message to be displayed to users on login attempts. This is only
    a consideration if the system is not being shutdown down immediately.

    - All the processes are notified that the system is going down by sending the
    SIGTERM signal.

    - It signals the init process asking to change the runlevel of the system. The
    runlevel 0 is used to halt the system, runlevel 6 is used to reboot the system,
    and runlevel 1 is used to put the system in single-user mode'
