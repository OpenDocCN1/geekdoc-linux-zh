  md: '# Module 8 — Networking


    nmbcd daemon waits for name server requests and provides the correct information
    when contacted. It understands and is able to reply to NetBIOS over IP name service
    requests. nmbd also handles the list of services offered by the machines on the
    network. The newly rewritten nmbd supports approximately 35,000 simultaneous clients,
    greatly increasing performance.


    # Utilities


    A variety of utilities are included with the Samba distribution. The Samba package
    distribution SMB/CIFS is included with smbclient. Smbclient is used to communicate
    with the SMB/CIFS server. Its command line utility is similar to the FTP utility.
    Smstatus is a program for reporting current network connections to the shares
    on Samba. Sambapassword is a program that allows an administrator to change the
    encrypted passwords used by Samba. Sambabrowser is a new facility in Samba that
    is not built by default. It provides access to CIFS/SMB file systems for executables.


    # SWAT


    Samba is now also distributed with an integrated administration tool. Samba Web
    Administration Tool (SWAT) will run on any system on which Samba operates and
    offers a user-friendly graphical interface to the resources that Samba shares
    with clients. This program will allow a user with root access to set up a server
    and modify the configuration without having to access directly the text configuration,
    /etc/samba.conf. The configuration and management of Samba are accomplished through
    the desired browser using Web pages. There are several other graphical interfaces
    available to Samba aside from SWAT.


    Along with file and printing services, Samba can act as a primary domain controller,
    authenticate clients logging into a Windows domain, and participate in NetBIOS
    browsing and master browsing elections. Samba can also be the primary WINS (Windows
    Internet Name Service) server.


    # Samba Advantages


    Samba has many advantages for both small and large corporate users. One of the
    advantages is that it is free to download but still provides the functionality
    of a Windows NT server. It also provides common area data for user directories,
    allowing transition between servers. Important features of Samba are the ability
    to see which users are connected, to lock files, and to use Samba with source
    control software. This diminishes the chance of overwriting files or file corruption,
    and it allows multiple users to access single files. The feature of having multiple
    Samba aliases on the same machine, pretending to be a different server (a feature
    similar to virtual hosts in modern Web servers) is also included in the distributed
    package. This allows a host to serve multiple groups or provide disk shares with
    normal userid and password security, while still offering printers to everyone
    without any security concerns.


