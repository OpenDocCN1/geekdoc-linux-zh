  md: "# 5-4 Module 5 — Using the Linux File System\n\n# # File Properties\n\n+  \
    \ * Permissions\n* Permission levels\n  * Symbolic mode\n  * Absolute mode\n \
    \ * Purpose of permissions levels\n* Changing ownership\n* Setting permission\
    \ with umask\n  * Use to avoid setting permissions with each new file\n\n# FILE\
    \ PROPERTIES\n\n![](img/b0ea5e4a55ee6767fff087672e71c505_113_0.png)\n\nFiles are\
    \ the basis of every system. Everything done on or by a system accesses a file\
    \ in some way. Whether that file is read, executed, created, or destroyed by the\
    \ system, nothing on a system happens without using files.\n\nA file's properties\
    \ determine what can be done to that file. If a user wishes to run an application\
    \ but not have rights or access to it, he or she will not be able to do so. Similar\
    \ or worse problems arise when a user can access files that should be denied to\
    \ him or her. This section will detail some of the most common properties of files\
    \ in a Linux system, how to manipulate them, and which directories and the files\
    \ they contain are the only things that appear on a Linux host.\n\n# Permissions\n\
    \nThe proper configuration of the permissions and ownership of files is essential\
    \ to making a system secure against others while keeping it accessible to its\
    \ users. If a system file permissions or ownership are not correctly configured,\
    \ one of two things may happen. Either the system will be restrictive and users\
    \ will become frustrated, or the system will be easy to crack because of limited\
    \ security.\n\nFile permissions dictate how it can be used. Linux and Unix have\
    \ three permissions: read, write, and execute. Read permission means that a user\
    \ has the right to look at what is in a file. Although the user may not be able\
    \ to change the file, he or she can view it and make a copy. Write permission\
    \ allows the user to edit the file, and usually, if a user can write to a file,\
    \ he or she can also read from it. However, it is possible for a user to have\
    \ write permission without read permission. The execute permission means that\
    \ the file is a program, and this gives the user the ability to run it."
