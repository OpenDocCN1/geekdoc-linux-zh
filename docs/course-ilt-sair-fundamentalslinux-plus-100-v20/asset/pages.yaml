  md: '# What Happens If an Improper Shutdown Occurs?


    If a file system has been properly unmounted, fsck will skip the full check at
    boot time. It is possible to bypass fsck entirely by running shutdown with the
    -f option. This causes shutdown to create the /boot file, which will reinit not
    to run fsck. It is impossible to bypassing the root file system, that is done
    by the kernel. Similarly, the -F option can be used to force the fsck. This works
    by creating the /forcefsck file, for which init checks.


    The command shutdown -Rf now will immediately reboot and check the file system.
    Similarly, shutdown -rf will now reboot immediately and skip the fsck upon reboot.


    It may be necessary for an administrator to run fsck manually. If this is required,
    file systems should only be checked if they are unmounted or mounted as read-only.


    # Commands for Proper Shutting Down


    The synopsis of shutdown/shutdown command is:


    ```

    /sbin/shutdown [-t sec] [-arkhnccf] time [warning-message]

    ```


    Some of its significant uses are explained in Table 4-6. Refer to the shutdown
    (8) man page for detailed information.


    | Command | Use |

    | shutdown -r now | This causes the system to reboot. now is the value of the
    time option which specifies to reboot immediately. |

    | shutdown -h now | This causes the system to shutdown, or halt, without rebooting.
    Again, now is used in the time option field, forcing an immediate shutdown. |


    Table 4-6. shutdown Uses


    The commands reboot and halt are also used to invoke shutdown when the system
    is not in runlevel 0 or 6.


    The user must specify the time to shut down. Now has been used in the examples
    above, it is also possible to enter a time in seconds from the issuance of the
    command to achieve this shutdown. This will allow users to prepare for the coming
    shutdown or reboot. For example, shutdown -t 300 -r will reboot the system 5 minutes
    after the command is issued.


    # Example


    When the user executes the command shutdown -h now from runlevel 5, the following
    events occur.


    shutdown -h now signals the init process to change to runlevel 0. The scripts
    running in the new runlevel''s (in this case, 0) directory /etc/rc/rc0.d are executed
    in alphabetical order. This will prepare these programs for shutdown. After the
    K scripts have been completed, the scripts that start with S will require the
    names for the links to start with K (kernel) or S (shell). Some of the examples
    for these directories and symbolic links are given below. In /etc/rc.d/rc5.d,
    one of the processes to be killed when changing to runlevel 0 is:


    ```

    $ K15httpd -> ..init.d/httpd

    ```


    ![](img/b0ea5e4a55ee6767fff087672e71c505_105_0.png)'
  merge: -1
