  md: "# Module 7 — Linux Applications\n\n# Text Editors\n\n+   * Vi and Vim\n  *\
    \ Input mode in Vi\n  * Command mode in Vi\n  * Configuration of Vi\n* Emacs\n\
    \  * Opening, saving, closing files\n  * Windows\n  * Movement\n  * Major modes\n\
    \  * Searching\n  * Misc Emacs functions\n  * Cutting and pasting text\n  * Options\n\
    \  * Regions\n* Pico\n  * Joe\n  * Cool Edit\n\n# TEXT EDITORS\n\nThere are many\
    \ text editors available for Linux. They range from line editors, such as Ed,\
    \ to full word processing programs, such as Emacs. They also act as Web browsers,\
    \ linkers, and compilers. In this section, five text editors will be covered:\
    \ Vi, Emacs, Pico, Joe, and Cool Edit. With knowledge of these programs, the user\
    \ should feel comfortable editing text files on any Linux installation.\n\n![](img/b0ea5e4a55ee6767fff087672e71c505_189_0.png)\n\
    \n# Vi and Vim\n\nThe program made its first appearance in BSD and is included\
    \ in almost every distribution of Linux. An updated version of the program, Vim,\
    \ has replaced Vi in most distributions. The basic functions remain, but many\
    \ features have been added. Vi is a two-mode program, distinguishing it from other\
    \ text editors; the users operate in either input or command mode. In input mode,\
    \ all keystrokes are recorded as text, with the exception of the <ESC> key, which\
    \ will move the user to command mode. In command mode, nearly every key is bound\
    \ to a specific command. To move from command mode to input mode, press the <i>\
    \ or <a>.\n\n# Input mode in Vi\n\nTo start the program, type the command vi.\
    \ The program begins in command mode, displaying credits and a basic help screen.\
    \ To enter text, press the <i> key. The user will then be in input mode, and all\
    \ keystrokes will appear as they are typed on the screen. Moving around input\
    \ mode is performed with the arrow keys and the <PgUp> and <PgDn> keys. Pressing\
    \ the <ENTER> key will create new lines. No files may be saved or opened while\
    \ in input mode; a user must be in command mode to perform any functions. To switch\
    \ to the command mode, press the <ESC> key."
