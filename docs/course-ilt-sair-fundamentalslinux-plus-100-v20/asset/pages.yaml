    Table 5-24. Options for the mount Command


    The last option, -o, gives the mount command ability to pass arguments that might
    be used, for example, to mount an NFS server. A complete list of options for the
    mount command can be found on the man page.


    # Mounting NFS File Systems


    Network File System (NFS) file systems can be a difficult task because there are
    options used for NFS that are not present for other file systems, as well as slight
    changes in syntax.


    This is an entry from /etc/fstab for an NFS file system:


    ```

    fileserver:/home /mnt/home nfs rsize=4096,wsize=4096,time=14,intr,auto

    ```


    This entry specifies the NFS server has a directory /home, which will be mounted
    in /mnt/home. The NFS tag specifies that it is an NFS file system. risize and
    wsize specify the size of datagrams over the network to be written and read from
    the file system. The time option specifies how much time the NFS client will wait
    for a request to be completed from the NFS server. The intr option declares that
    a request can be interrupted if the system goes down. The auto option specifies
    that the NFS file system should be mounted automatically.


    The default risize and wsize are 1024 bytes. This was changed in the other to
    specify 4096 bytes for reading and writing. The time option is specified in tenths
    of a second, with a default of 7. This has changed to 14, so the NFS client will
    wait 1 seconds for requests to be completed. There are also options that specify
    whether an mount will be hard or soft, with a default of hard. A hard mount allows
    a program to hang when an NFS server crashes, but will reconnect automatically
    when the server is back online. A soft mount allows an error when the server connection
    fails, and will not reconnect automatically.


    If there is an /etc/fstab entry for a file system, all the user needs to do in
    order to mount an NFS file system (using the above /etc/fstab entry as an example)
    is the command mount fileserver:/home. If there is not an /etc/fstab entry, the
    syntax for mounting the NFS file system would be:


    ```

    $ mount -t nfs -o rsize=4096,time=14,intr,auto fileserver:/home /mnt/home

    ```


    ![](img/b0ea5e4a55ee6767fff087672e71c505_136_0.png)


    SAIR Linux and GNU Certification -- Fundamentals/Linux+'
