  md: 'Each device that data passes through in order to enter or exit the Internet
    must be designated. The next

    example shows a network sitting beside a proxy or firewall that is attached to
    an external router. On the

    other end is a computer attached to a router.


    ```

    network A----------proxyA----routerA----(Internet)--router----compB

    ```


    ```

    123.156.78.90  123.156.78.1  12.34.56.78  112.223.123.1  112.223.123.80

    ```


    The conf file includes the following:


    ```

    config setup

    interfaces="ipsec0%eth0"

    plutload=%search

    plutostart=%search

    conn network-compB

    leftsubnet=123.156.78.0/90

    left=123.156.78.1

    leftnextop=12.34.56.78

    rightsubnet=112.223.123.80

    right=112.223.123.1

    auto=start

    leftrsasigkey=0x123456789abcde

    rightrsasigkey=0x123456789abcde

    ```


    Once the configuration file is complete, IPSEC can be manually started with /usr/sbin/ipsec

    manual-up connection name.


    The IPSEC command is added to the path. It is assumed that /sbin is part of the
    path, so the IPSEC

    command is found in /sbin/ipsec. Entering this command without any options gives
    a list of

    commands. Adding the look option to the IPSEC command (/sbin/ipsec look) shows
    any

    currently active tunnels. For more information on each option, consult the IPSEC
    man pages.'
