  md: '# Module 2 — What to Know Before Installing Linux


    ![](img/b0ea5e4a55ee6767fff087672e71c505_35_0.png)


    # OBJECTIVES


    At the completion of this module, you will be able to:


    +   * Understand Linux hardware requirements and how to install Linux.

    * Understand BIOS and how to enter BIOS setup to manage devices.

    * Use a boot manager, such as GRUB or LILO, to enable dual boot.

    * Use Loadlin to boot Linux from a DOS environment.

    * Use XF86Setup to configure the system to run X.'
