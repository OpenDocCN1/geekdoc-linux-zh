  md: '# 10-34 Module 10 — Hardware


    # ID configuration


    SCSI uses an ID to uniquely identify each device connected to the SCSI bus. Each
    SCSI device will have a jumper or a switch that is used to set the SCSI ID. As
    long as each device has a unique ID, the bus will function properly as long as
    it does not become saturated. If there will be a problem with saturation on the
    SCSI bus, the priority of the ID must be taken into configuration when they are
    assigned.


    # ID priority


    Each device on a SCSI bus gets a certain priority based on the ID number that
    it is assigned. If the SCSI becomes saturated and the device with highest priority
    is sent large amounts of data, other devices may not get a chance to communicate
    since the highest priority will have control of the bus.


    On a narrow bus, the highest priority is 7 and the lowest is 0. On a wide bus,
    the 8 lower numbered devices will have priority over the 8 numbered devices. The
    ID priorities from highest to lowest on a wide bus are 7, 6, 5, 4, 3, 2, 1, 15,
    14, 13, 12, 11, 10.


    If saturation will be a problem, it is a good idea to give CDR and CDRW the highest
    priority to make sure that the data flow remains constant. If the data flow is
    broken and a CD is being burned, the process will fail and a CD will be wasted.


    It is also a good idea to give slower devices as scanners and drives a high priority
    so that they will have a chance to communicate. This will not cause a noticeable
    decrease in performance since these devices will use very little of the bus''s
    bandwidth


    # Multiple bus segments


    If multiple segments are used on a bus with a different cable used for internal
    and external connections, the IDs must be unique across both cables since they
    are two parts of the bus.


    # Plug-n-play SCSI (SCAM)


    For a while the SCSI standard included a specification for the automatic configuration
    of device IDs called plug-n-play SCSI or SCAM. Unfortunately, SCAM never worked
    reliably and was removed in the SPI-3 revision.


    # Mixing devices


    Since SCSI retains backward compatibility with older devices, it is possible to
    mix various types of devices on the same bus. To accomplish this, special types
    of terminators, cable adapters, and connector adapters may be needed or a host
    adapter that supports separate channels may be used.


    # Mixing HVD devices


    While LVD and SE drives operate on the same bus, HVD drives must not be put on
    the same cable as SE or LVD or one or more of the devices can be permanently damaged.
    Since HVD devices have a separate connector for LVD or SE mode, this should be
    used instead of HVD mode. If the device does not support SE or LVD at, the only
    way the device can be added to the same bus as an LVD or SE device is if it is
    connected to a host adapter that supports separate channels (one of the channels
    being HVD). If this is not an option, a separate host adapter should be used exclusively
    for the HVD device.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_337_0.png)'
  merge: -1
  pgno: 337
- img_proc: true
  md: '# Mixing LVD and SE devices


    Because LVD and SE signaling are compatible, LVD and SE devices can be attached
    to the same bus without difficulty. However, if they are connected to the same
    bus, LVD devices will only run in SE mode and performance suffer.


    # Mixing wide and narrow devices


    Wide and narrow SCSI devices can be placed on the same bus if they use compatible
    signaling (LVD or SE). However, a special adapter will be needed to convert the
    bus from wide to narrow or a special host adapter than has segments for wide and
    narrow buses will be needed.


    If a wide device is placed on a narrow bus, the wide device will only operate
    in 8-bit mode and performance suffer. A special adapter will be needed to terminate
    the unused 8 bits for the wide device to operate. If a narrow device is placed
    on the wide bus, a special adapter will be needed to terminate the 8 bits that
    the narrow device will not use. The narrow device should be placed at one of the
    ends of the wide bus so that the performance of the wide bus does not suffer.
    The adapter/terminator will need to be placed between the wide and narrow bus.
    Since narrow devices only work with IDs between 0 and 7, they must have one of
    these IDs to operate with the wide bus.


    # Linux SCSI configuration


    To configure SCSI to work with Linux, the host adapter must be compatible with
    Linux. After installing the adapter, the kernel will have to be recompiled with
    SCSI support enabled. Finally, the driver module for the host adapter will need
    to be installed with the `insmod` utility or compiled into the kernel monolithically.
    There is no problem with these steps, `fdisk` or some other partition utility
    can used to partition the disk. The first SCSI device will show up as `/dev/sda`,
    the second as `/dev/sdb` and so on.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_338_0.png)'
