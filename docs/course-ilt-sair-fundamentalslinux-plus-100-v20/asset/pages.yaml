    # Shell Scripts


    A shell script is an executable file that contains shell commands. Users can also
    customize their environments by using shell scripts, which support the control
    structure commands. These commands make the shell a programming tool. They include
    the if, for, while, until, and case statements. For example, put the commands
    shown below in a file called dirinfo:


    ```

    #!/bin/sh

    echo The Contents of the directory are

    ls -al

    echo

    echo The Hostname is:

    hostname

    ```


    Make the file dirinfo executable by:


    ```

    $ chmod u+x dirinfo

    ```


    Then, execute the command in a bash shell:


    ```

    $ bash dirinfo

    ```


    or


    ```

    ./.dirinfo

    ```


    The above command executes the commands present in the shell script dirinfo.

    When a shell starts, certain files (or scripts) may be read to the shell. The
    files that are read depend on the type of shell invoked. The Bash shell invokes
    different files than the tash shell does. Within a Bash environment, different
    modes of shell can be invoked. The shell may be an interactive login shell, an
    interactive non-login shell, or a non-interactive shell.


    # Bash


    When the user starts Bash as a login shell, it first looks in the /etc/profile
    file. This file is used for setting up the system-specific environment variables
    and starting up certain programs. The lines that pertain to starting programs
    in the /etc/profile file are shown below:


    ```

    USER=''id -un'' # sets up the environment variable

    export USER # exporting the variable makes it available to its

    # child processes

    ```


