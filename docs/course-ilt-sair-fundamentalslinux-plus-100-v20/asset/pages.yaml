- img_proc: true
  md: '# Module 7 — Linux Applications


    The abort, clean, disable, down, enable, restart, start, status, stop, and up
    commands all recognize the special parameter all in place of a printer name, which
    will cause the command to affect all printers.


    # Filters


    Because printers cannot understand all file types, it is necessary to translate
    a program''s output to something a printer can understand. This is accomplished
    with filters invoked by the filter daemon. It is the output of the filter that
    is actually spooled.


    # PostScript


    Most applications generate PostScript, since most Unix systems are high-end computers
    with high-end printers that understand PostScript. In such systems, no filter
    is needed; the PostScript file can be sent directly to the printer.


    PostScript was introduced by Adobe in 1982, in response to the proliferation of
    proprietary Page Description Languages (PDLs). PostScript was designed to be printer-independent;
    a PostScript file should look the same, though quality may vary, no matter what
    printer is used.


    Many users do not have a Postscript printer. For these users, the most important
    component of the print system is Ghostscript, a free Postscript interpreter. It
    is used to translate PostScript to a printer''s proprietary control language.
    Ghostscript is free software developed by Aladin Enters.


    # Magifier


    Most Linux systems have software, such as Magifier, installed, which allows transparent
    printing of Postscript files, such as graphics. If Magifier is specified as the
    filter for lpd to invoke, it will convert the file to PostScript. It then gives
    it to Ghostscript, outputting a file in the printer''s own control language. Magifier
    will reject files it does not recognize.


    # Plain text


    Printing plain text is less complicated Instead of converting to PostScript, it
    can be given directly to lpr. It is only necessary for the filter to perform a
    minimal conversion before the output can be sent to the printer. This conversion
    is necessary, because Unix text delimits lines with the ASCII linefeed, but printers
    need a sequence of ASCII carriage-return and linefeed characters to end a line.
    When the printer sees a linefeed, it scrolls the one line but does not return
    the head to the beginning of the line until it sees a carriage-return character.
    If linefeed characters are not converted to carriage-return/linefeed sequences,
    the output will produce the staircase effect, no matter how many lines of text
    will look like a staircase.


    # The Print Daemon


    The daemon, lpd, is at the lowest level of the chain. Some applications correspond
    directly to the daemon, but most rely on the printer control programs. When the
    print daemon starts, it reads its configuration from the /etc/printcap file. This
    file lists all the printers the daemon is supposed to manage, as well as properties
    of each printer, such as maximum spool size. The daemon keeps a spool for each
    printer it controls. These spools are actually directories in /var/ spool/lpd.


    The user only interfaces with the daemon via applications or printer control programs.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_215_0.png)'
  merge: -1
  pgno: 215
- img_proc: true
  md: "# Archives and Packages\n\n+   * Tarballs\n  * Unpacking tarballs\n  * Building\
    \ tarballs\n* RPM\n  * Unpacking RPMs\n  * Building RPMs\n* Deb Packages\n  *\
    \ Unpacking Debs\n  * Building Deb\n* Using Deb, RPM, Tarballs\n\n![](img/b0ea5e4a55ee6767fff087672e71c505_216_0.png)\n\
    \n# ARCHIVES AND PACKAGES\n\nCompression and compilation are important when transporting\
    \ a large mass of files. This is done by compiling many files into one large file\
    \ and compressing it to a manageable size. Debian, Red Hat, and GNU have developed\
    \ programs to do this. Each program has advantages and disadvantages, and each\
    \ has its own method of making the transportation of files faster and easier.\n\
    \n# Tarballs\n\n# Unpacking tarballs\n\nThe unpacking of tarballs, RPMs, and Debs\
    \ vary significantly. The steps used for tarball are the simplest of the three\
    \ programs discussed. A tarball consists of many zipped files (compressed files)\
    \ that have been tarred (concatenated) into one package. Tarballs are built and\
    \ unpacked using the GNU tools gzip, and tar. tar can untar and filter the files\
    \ through gzip to uncompress them. tar uses a very basic command line, and requires\
    \ no installation or package management, only data retrieval. The typical command\
    \ for unpacking a tarball is:\n\n```\n$ tar xvfz filename.gz.tar\n```\n\nEach\
    \ option performs a specific function on the tarball.\n\n+   * x tell tar to extract\
    \ the compressed files.\n* v tell tar to display the file names as they are extracted.\n\
    * f specifies uncompressed files to be placed locally.\n* z filters the compressed\
    \ files through gzip to decompress them.\n\nTarballs are ideal for simple data\
    \ transfer between computers. A series of text files does not need installation\
    \ scripts, daemons, and package management, along with compression and concatenation.\
    \ tar is a perfect compression method for small jobs and various files that will\
    \ not be installed."
  merge: -1
  pgno: 216
- img_proc: true
  md: '# Building tarballs


    The building of tarballs, RPMs, and Debs varies dramatically. The average user
    may find building Debs difficult, but the dynamics can be easily understood. Tarballs
    are far the easiest of the three to build. RPMs are not much easier, since there
    is no installation or preparation scripts, the files only need to be archived.
    tar can use gzip as it did to extract files. To run the tarball through gzip and
    then tar, the command


    ```

    tar cvf newtarball.tar.gz filostobearchived

    ```


    will be used, in filostobearchived can be a list of files separated by a comma
    or a directory. tar assumes all subdirectories to be part of a directory. If a
    directory is starred, its subdirectories will be starred as well. Files can also
    be appended to the archive with the -r option. However, you must first uncompress
    the archive before you can successfully append any file to the archive. For example:


    ```

    gzip newtarball.tar.gz

    tar -rvf newtarball.tar filostobearchadded

    gzip newtarball.tar.gz

    ```


    tar has limited uses for package management, but when installation of transported
    files is not required, tarball is the best choice.


    # RPM


    # Unpacking RPM''s


    Red Hat Package Manager (RPM) is a program developed by Red Hat to easily unpack
    and install legitimate software packages. Though RPM was first seen in Red Hat
    distribution, all Linux distributions are capable of utilizing it. Some non-Linux
    systems have also begun to use RPM, Sun OS and Solaris RPMs (the files created
    by RPM) are compressed and concatenated like tarballs, but the RPM contains more
    information than the compressed data. Information about the files in the package
    is kept in a spec file. It includes the correct package for the processor, the
    files included, and a small script to install the package on the system. Red Hat
    has developed this to make it easy to download and install single distribution
    packages. RPMs can be installed locally or via the Internet, and the RPM program
    can remotely install packages on a local machine. The command for this operation
    is:


    ```

    $ rpm -i ftp://ftp.redhat.com/pub/redhat/rh-2.0-beta/RPM/foobar-1.0-1.i386.rpm

    ```


    This will install RPM v2.0 to the local drive. Installing RPMs is similar:


    ```

    $ rpm -i foobar-1.0-1.i386.rpm

    ```


    The i informs RPM to install the package. The installation script included in
    the RPM installs the RPM on the drive. All installed RPMs can be verified at any
    time. By using the command -Va, all installed RPM packages can be verified to
    certain all files are present and working. To read the included information file,
    use the command rpm -qpi somefile-1.2-2.i386.rpm. This will display the informational
    file that includes the build date, description of the package, and size of the
    program. RPM is built on the same premise as tarball but with the added ability
    to manage packages and distribute efficiently.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_217_0.png)'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# Building RPM''s


    RPMs require much more preparation and information than tariffs. It is very important
    to test the RPM and make sure the program source builds correctly. This is sometimes
    overlooked, because it is assumed that the RPM itself will be the only problem.
    This results in the RPM installing bad code. The first step in building an RPM
    is to write a spec file, the header of the RPM. It contains all the commands that
    will run upon unpacking. The spec file is the most complex part of the building
    process, and it contains a header that specifies information about the program
    such as the version, summary, and source.


    Most RPMs contain seven main fields in their spec file:


    +   * description

    * prep

    * build

    * install

    * clean

    * files

    * changelog


    A good summary of the program''s usage is located in the description field, followed
    by the prep field, which contains any preparation script (daemon start or patching).
    RPM is used to build the source into a binary that is installed by the commands
    in the install field. The clean field ensures that there are no leftover files
    after installation. It removes unnecessary source and installation scripts. For
    RPM to be used as an effective package manager, all files included in the package
    must be listed in the files field. The final field, changelog, contains text about
    any updates or fixes present in the installed version.


    RPM needs five different directories to build RPM:


    +   * build (where RPM builds the files)

    * sources (location of all sources to be used)

    * specs (location of spec files)

    * rpms (location of built binary RPMs)

    * srcms (location of built source RPMs)


    The actual building of the package is done by using RPM on the spec file.


    ```

    rpm -ba foobar-1.0.spec

    ```


    will build a new RPM package using the information located in the spec file. It
    will grab the sources / sources and move them to /build. RPM then moves the newly
    built RPM to /rpms. RPM is ideal for packaging new programs and keeping track
    of packages and their versions, but it is not efficient to use as a regular means
    of transporting regular data files such as:


    ![](img/b0ea5e4a55ee6767fff087672e71c505_218_0.png)


    SAIR Linux and GNU Certification -- Fundamentals/Linux/'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# Deb Packages


    # Unpacking Deb''s


    Deb (the Deb package) is very similar to RPM, and is used in Debian, Storm Linux,
    Linux by Libra, and Corel OS. Technically, it is possible to use it for other
    distributions, the programs used for unpacking Deb directories exclude Debian
    commands, which would have to be added to a non-Debian system. The contents of
    a Deb package are similar to those of an RPM. For package management, the low-level
    dpkg command or either of two front-ends: APT or dselect. APT is the preferred
    front-end. It has multiple interfaces, including command-line, text-based menu-driven,
    and GNOME interfaces. dselect is the lower-text front-end.


    dpkg is the basic package installer for Deb files. It can print out the information
    file, install packages, configure them and remove them. dpkg-deb manipulates Deb
    packages. Contained files can be viewed and extracted to specified directories.
    dpkg-split breaks large Debs into smaller ones. This is used to break Debs into
    smaller floppy-sized files for transport. Deb works in the basically same ways
    as RPM, using similar file names. Debian packages use the file structure


    ```

    <foo>_VersionNumber>-<Debianrevision Number>.deb

    ```


    where Red Hat uses


    ```

    <foobar>_<VersionNumber>-<ProcessorVersion>.rpm

    ```


    # Building Deb


    Debian''s package system is similar to Red Hat''s, but Debian utilizes many different
    programs for the building process. While RPM does the work of many programs, Debian
    splits the work into jobs for several different programs. Everything is based
    on dpkg. Scripts are run on top of dpkg to change its function (i.e., dpkg-deb,
    dpkg-getchanges, or dpkg-distaddfile), allowing dpkg to be many programs with
    a common code base. Many programs also choose to do this to it manageable. A Deb
    is the binary package produced by dpkg-deb. It contains a header like RPM''s but
    a much more involved system of scripts, configuration files, and installation
    preparations. Debian builds packages from directories so that all information
    to be included in the Deb must be built in the same directory or in concurrent
    subdirectories. By using dpkg, directory can be built into a Deb. The command


    ```

    dpkg-deb --build directoryobbuilt

    ```


    will build the chosen directory in the current directory.


    # Using of Deb, RPM and Tarballs


    Deb and RPM are great for installing new programs and upgrades, but tarballs are
    much better for transporting regular files. RPMs are usable on many different
    distributions and platforms. Both RPMs and Debs are easy to use and keep track
    of packages well; however, most users will find RPMs easier to manage, and installation
    requires fewer programs and less knowledge.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_219_0.png)'
