  md: '# Module 8 — Networking


    16 * * *

    17 * * *

    29 * * *

    30 * * *

    $


    In the example, traceroute has used DNS to resolve the host www.starwars.com into
    its IP address 64.1.207.50. Because the number of hops was not changed, traceroute
    uses the default value of 30 hops as a maximum value. The size of data packets
    stays unchanged, so traceroute uses the default size of 38 bytes. The lines after
    the one that describes the parameters of traceroute are numbered. Each of these
    hops reports the format of


    +   * name (IP address) RTT RTT RTT


    Where the sign (#) indicates the hop, name is the name of the router reached at
    each hop. (IP address) is the corresponding IP address of the router, and each
    of the RTT sections contain the round-trip time for each of the three packets
    sent.


    **NOTE:** The number of RTTs will change when the number of packets sent at each
    hop is changed.


    To show the structure in use, hop 3 can be evaluated.


    ```

    r172h49.att.com (64.89.172.49) 3.765 ms 3.239 ms 3.445 ms

    ```


    The router is named r172h49.att.com, its IP address is 64.89.172.49, and the first
    packet takes an RTT of 3.765 ms. The second and third RTTs for packets two and
    for hop are 3.239 ms and 3.445 ms, respectively.


    The example also shows the performance characteristics of routers at different
    times. To illustrate this, points 13 and 14 can be observed.


    ```

    13 dcr01-g2-0.snt04.exodus.net (216.34.23.3) 109.022 ms 95.6 ms 99.83 ms

    14 csr23-ve243.snt04.exodus.net (216.34.23.114) 99.190 ms 110.6 ms 102.97 ms

    ```


    Notice that for hop 13, packet one, the RTT was 109.022 ms; but at hop 14, packet
    one, the RTT was 99.190 ms. This example indicates that the first traceroute connected
    to the router at hop 13, the router was most likely handling more traffic than
    it was sent through hop13 to hop 14. The RTT values for packets two and three
    on hop 13 and hop 14 show that hop 13 took less time round-trip than hop 14.


    The example also illustrates that not all routers have a name associated with
    that is readily accessible to other network users. This concept is further shown
    by hop 9:


    ```

    9 206.222.106.234 (206.222.106.234) 118.556 ms 96.431 ms

    ```


    which simply repeats the IP address as the host name of the computer. Even though
    traceroute follows the path from one computer to another, that path may change
    each time traceroute sends out an additional data packet. You can see in the example
    below hop 4:


    ```

    4 172.16.1.238 (172.16.1.238) 17.658 ms 16.047 ms 172.16.2.238 (172.16.2.238)
    ms

    ```


    ![](img/b0ea5e4a55ee6767fff087672e71c505_245_0.png)'
  merge: -1
  pgno: 245
- img_proc: true
  md: 'Notice the first two packets respond to the router with IP address 172.16.1.238,
    but the third packet responds to the router with IP address 172.16.2.238. This
    indicates that the first two packets were sent to one router, while the third
    packet was directed to a separate router.


    In the example on the previous page, hops 16 through 30 all contain three asterisks
    (*). This indicates either that the next hop could not be reached, or that the
    error packet that was generated did not make it back to the original computer.


    Both ping and traceroute are helpful in diagnosing network problems. ping is used
    to determine the average RTT for a host and whether or not that host is online.
    It can also be used to find the IP address of a host, if DNS is working properly.
    traceroute is helpful in determining the path a packet takes to reach a host,
    if the host is working properly, and if a problem exists with a router along the
    path to the host.'
