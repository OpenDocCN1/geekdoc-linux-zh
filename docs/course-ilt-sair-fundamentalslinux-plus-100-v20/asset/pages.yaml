    \ Optical pens\n  - Joysticks\n  - Touch pads\n  - Other devices\n\n![](img/b0ea5e4a55ee6767fff087672e71c505_343_0.png)\n\
    \n# LCD, PC CARD, AND POINTING DEVICES\n\n# LCD Panels\n\nLiquid Crystal Display\
    \ (LCD) is a form of display comprised of two panels that are made of either glass\
    \ or plastic, with liquid suspended between them. The liquid contains crystals\
    \ that are aligned parallel to each other. The crystals are permeable to light\
    \ until an electric current causes them to change their alignment and darken the\
    \ affected area. By directing the current to specific areas, it is possible to\
    \ display numbers and characters. The most basic, two-color form of LCDs can be\
    \ found in calculators, while high-end LCDs are used in modern flat screen technology.\n\
    \n# Advantages\n\nDespite the tremendous evolution of LCD technology, these displays\
    \ have their share of advantages and disadvantages. An average LCD is capable\
    \ of displaying resolutions that are virtually identical to CRT monitors. Compared\
    \ to their CRT counterparts, LCDs have some distinctive advantages. They are very\
    \ thin, and do not need the amount of desk space required for a CRT, LCD monitors\
    \ consume substantially less energy than a CRT monitor, making it perfect for\
    \ laptop and palmtop computers and PDAs. Also LCD do not emit any harmful radiation,\
    \ while CRT monitors do.\n\n# Disadvantages\n\nUnfortunately, the disadvantages\
    \ of LCDs are apparent. While CRT monitors are capable of unlimited colors, few\
    \ LCDs are. Also, LCDs are not as bright as CRT monitors. Finally, when viewing\
    \ an LCD monitor from any angle other than straight ahead, the display appears\
    \ distorted. CRT monitors, on the other hand, can be viewed from wide angles without\
    \ the perception of image distortion. LCD technology continues to improve, however,\
    \ and some of these shortcomings have already been shown as possible to circumvent."
