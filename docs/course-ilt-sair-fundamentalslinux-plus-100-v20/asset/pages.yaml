  md: '# Multiprocessing


    Linux is also capable of multiprocessing; it is Symmetric Multi-Processor (SMP)
    compatible, which allows multiple processors to be used by one machine. With the
    current kernel, it is possible to link 16 separate processors to work as one.
    This is an incredible scalability feature. A user can buy a motherboard that supports
    multiple processors but only choose one. When system usage begins to climb too
    high, another processor can be added to the motherboard. This provides better
    access for users and improves run time. Though, it can be a cheaper alternative
    to buying terminals and forming a PC cluster, which is also possible with Linux.
    PC clusters are many computers connected together to as one giant computer. The
    largest servers in the world are really many computers linked together. This setup
    has its advantages when multiple processors are no longer an option.


    # Affordability (GPL)


    Distributions of Linux typically cost money on the actual price of physically
    copying the data, technical support, and warranties. This philosophy allows advancements
    to be made for users in nonprofit situations. The GPL gives users the freedom
    to distribute, improve, and run programs at no cost.


    This philosophy has been criticized by large businesses that say without deadlines
    and specified directions, Linux will wander with no purpose. Actually, the opposite
    appears to be true. As users make and distribute the programs, applications are
    improved and added quickly and efficiently. Businesses provide hundreds of different
    programs that do the same thing with different features, but to see how they work,
    one must first buy them. Most Linux applications are also scalable, which allows
    applications to be improved instead of replaced.


    Distributions such as Red Hat and Debian charge a fee for their product, but in
    actuality, what one buys is the physical CD and technical support. Red Hat, for
    example, is available on the Internet at many sites, including the Red Hat homepage,
    without technical support at no cost to the user. The GPL allows users to freely
    use and redistribute software at no cost to.


    Linux has all the features of expensive operating systems, but isfree of charge.
    Scalability, reliability, and functionality are no problem for Linux operating
    systems. With a little knowledge, users can exceed many of their expectations
    using Linux. With the number of new Linux users growing rapidly, advancements
    in kernel technology and the birth of new applications are becoming more and more
    frequent. The advancement of Linux is directly related to its users'' number and
    enthusiasm.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_25_0.png)'
