- img_proc: true
  md: 'The default mode for Emacs is fundamental mode. There are no redefinitions
    of keys or variables, which makes this mode a beneficial general mode for learning
    Emacs commands and functions. To switch to another mode, press <META-X>. After
    this command is executed, the command line will prompt the user to enter a major
    mode.


    There are preconfigured modes for editing programs in Lisp, C, and Fortran. Modes
    for Tex editing, editing English text, and Noft configured files are available.
    There are also modes for using Emacs as a shell, a mail program, and a directory
    browser.


    # Miscellaneous Emacs functions


    To repeat a command multiple times, use the <CTRL-U> nn command function, where
    nn is the number of times COMMAND to be executed. For example, to copy text from
    the kill ring three times, press <CTRL-U>, by <3>, and then <CTRL-Y>.


    Emacs help files are online and may be used while running Emacs. Press <CTRL-H>
    will open the help dialogue. For a specific command, press <CTRL-H> <a>. This
    will open the command line and allow users to enter a string. The program will
    return all commands that contain the string entered. The <CTRL-H> <i>i command
    will open an interactive help dialogue inside Emacs; <CTRL-H> <html>o opens a
    tutorial session.


    # Options


    Many options may be used in Emacs, depending on the situation in which Emacs is
    running. For example, if Emacs is running under the X Window System, arguments
    may be used to define which size window to use or determine if mouse support is
    needed.


    Tables 7-3 and 7-4 list additional options for Emacs. A complete list of options
    can be found under the emacs(1) man page.


    | Table 7-3. General Options for Emacs |

    | ------| |

    | file | Opens Emacs with file already loaded. |

    | +nn | Places the cursor on line nn once Emacs has started. |

    | -q | Does not use on initialization file for Emacs (loads with all defaults).
    |

    | -u user | Loads user''s initialization file. |


    | Table 7-4. Options for Running Emacs Under X Window |

    | ------| |

    | -font | Changes the font used in Emacs to font. |

    | -geometry geometry | Sets the width, height, and position of Emacs. |

    | -fg color | Sets the foreground color. |

    | -bg color | Sets the background color. |

    | -r | Shows the colors in reverse. |


    ![](img/b0ea5e4a55ee6767fff087672e71c505_194_0.png)


    SAIR Linux and GNU Certification -- Fundamentals/Linux/'
