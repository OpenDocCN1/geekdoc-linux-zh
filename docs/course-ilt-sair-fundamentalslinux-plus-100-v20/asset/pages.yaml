  md: 'Currently the most common graphics adapters use either a PCI or AGP bus. AGP
    is unique to other bus configurations, because it sends information back and forth
    directly to the system memory, promising a processing speed of four times or more.
    Currently, there is only a slight difference in benchmark tests between PCI and
    AGP adapters, but graphics adapters are gaining in designing adapters that exploit
    the increased speed of the AGP bus.


    # Graphic processor


    In order to avoid placing extra loads on a system''s CPU, graphics adapters are
    equipped with their own processor designed specifically for graphical display.


    Depending on the type of card being used, the graphics processor will be either
    a frame buffer, a coprocessor, or a graphics accelerator. The difference between
    these three types of processors is in which they work with the system''s CPU.
    A frame buffer cards holds a frame of information that is then sent to the screen,
    leaving the task of updating the video to the system''s CPU. More complex graphics
    leave the system''s CPU no time for computing non-graphic tasks.


    In order to remedy this problem graphics with either a coprocessor or an accelerator
    can be used. The coprocessor handles graphics-related tasks to be sent by the
    related driver software to the graphics processor. The accelerator allows the
    driver software to send everything to the system''s CPU, where the CPU instructs
    the accelerator to perform specific graphic-intensive tasks.


    # Video RAM


    Video Random Access (VRAM, Video Ram, or frame buffer) is memory designed specifically
    for video and graphical applications. VRAM acts as both between the processor
    and the display where images are first read by the processor as data and then
    passed into memory. After the data is in memory, it is converted from digital
    into analog signals and sent to the actual display device.


    # Monitors


    No matter how advanced the graphics adapter may be, the monitor must be able to
    display the adapter''s signal. Two indicators of the capabilities of most monitors
    are its dot pitch (or stripe pitch) and its refresh rates. The most common monitor
    type for desktops is the Cathode Ray Tube (CRT), by Liquid Crystal Display (LCD)
    monitors becoming more popular, mainly because they are becoming affordable.


    Some things are apparently just by looking at a monitor. The view area of a monitor
    is the size of the screen that will actually display the computer''s output. The
    view area is usually measured across the screen, so a monitor with 16.4 inches
    view area is 16.4 inches from one corner to the opposite corner. In most cases,
    although view area is 16.4 inches, the monitor will be advertised as a 17 inch
    monitor. View areas vary by individual monitor models.


    Another easily distinguishing feature of a monitor is its cable interface. The
    standard VGA cable is polygon shaped, while a Digital Video Interface (DVI) cable
    is shaped more like a rectangular. VGA is a 15 pin connector, while DVI, according
    to which version of DVI you needs require, can have up to 24 pins. DVI cables
    are normally used to simplify the distinctive design of Flat Panel Display monitors.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_341_0.png)'
