  md: "# LAB 08-2 - IPCHAINS\n\n# Purpose\n\nThe purpose of this lab is to guide the\
    \ student through configuring network access rights ipchains for packet filtering.\n\
    \n# Lab Duration\n\n30 to 45 minutes.\n\n# Overview\n\nRecent versions of the\
    \ Linux kernel have packet filtering built into them via IP firewall chains. ipchains\
    \ are used to set up, maintain, and inspect the IP firewall rules in the Linux\
    \ kernel. As described above, there are at least three lists of these rules: the\
    \ input, output, and forward chains. It is also possible to create user-defined\
    \ chains. The input chain defines a list of rules that applies to packets destined\
    \ for the local system, and the forward chain's rules send packets that have been\
    \ received to another system.\n\n# Lab Exercises\n\nIn this lab, you will do the\
    \ following:\n\n+   - Determine whether ipchains is installed.\n- List all the\
    \ rules in a chain.\n- Use the append and delete commands to manipulate rules.\n\
    - Create and delete user-defined chains.\n\n+   1. First, determine whether ipchains\
    \ is installed in your kernel by /proc/net/ip_fwchains:\n   # find /proc/net/ip_fwchains\n\
    \nThis command should return the name of the file; if it returns No such file\
    \ or directory or an equivalent error, you will need to install ipchains in the\
    \ kernel.\n\n+   2. Assuming ipchains is installed, try to list the rules in a\
    \ chain with the -L option, followed by the name of the chain. Also try using\
    \ the -L option without specifying a chain.\n\n```\n# ipchains -L input\nChain\
    \ input (policy ACCEPT)\n# ipchains -L output\nChain output (policy ACCEPT)\n\
    # ipchains -L forward\nChain forward (policy ACCEPT)\n# ipchains -L\nChain input\
    \ (policy ACCEPT)\nChain forward (policy ACCEPT)\nChain output (policy ACCEPT)\n\
    ```\n\n![](img/b0ea5e4a55ee6767fff087672e71c505_277_0.png)"
  merge: -1
  pgno: 277
- img_proc: true
  md: 'In this example, ipchains commands have been run by distribution-specific initialization
    scripts, so each of the chains has a policy of ACCEPT. This means that no rules
    are being used to filter any packets.


    +   3. Add a rule to the input chain denying all packets originating from 127.0.0.1,
    the IP address for the loopback device. This is useful for the purposes of this
    lab because you do not need to use the loopback. First, trying the loopback with
    a count of 1:


    ```

    # ping -c 1 127.0.0.1

    PING 127.0.0.1 (127.0.0.1) : 56(84) bytes of data.

    64 bytes from 127.0.0.1 : icmp_seq=1 ttl=255 time=0.754 us

    ```


    ```

    --- 127.0.0.1 ping statistics

    1 packets transmitted, 1 packets received, 0% packet loss

    round-trip min/avg/max/dev = 0.574/0.574/0.574/0.000 ms

    ```


    +   4. Now, append the rule to the input chain using the -A option, specifying
    the packet source with -s, the type of p-checker with -j (for the purposes of
    this lab, use all for all packets) and the action to be performed with -j (in
    this case, DENY). List the rules for the input chain:


    ```

    # ipchains -A s 127.0.0.1 -p all -j DENY

    # ipchains -L input

    ```


    Chain input (policy ACCEPT):


    | target | prot | destination | ports |

    | ACCEPT | all | localhost | anywhere | n/a |


    Try using the command on 127.0.0.1 again.


    ```

    # ping -c 1 127.0.0.1

    PING 127.0.0.1 (127.0.0.1) from 127.0.0.1 : 56(84) bytes of data.

    --- 127.0.0.1 ping statistics ---

    1 packets transmitted, 0 packets received, 100% packet loss

    ```


    All packets deriving from 127.0.0.1 are being denied.


    +   5. Next, you will delete this rule from the input chain with the -D option.
    Then, list the rules for the input chain again.


    ```

    # ipchains -D input 127.0.0.1 -p all -j DENY

    # ipchains -L input

    ```


    Chain input (policy ACCEPT):


    The rule has been deleted. Other ways to do this are by using the numeric option
    and flushing the chain. Because the rule you created was the only rule in the
    chain, it was first, and


    ```

    # ipchains -D 1 input

    ```


    It would have worked. Also, if you wanted to remove all rules from a particular
    chain, you could use the flush option, -F. If you do not specify a chain, all
    chains are flushed.


    ```

    # ipchains -F input

    ```


    ![](img/b0ea5e4a55ee6767fff087672e71c505_278_0.png)'
  merge: -1
