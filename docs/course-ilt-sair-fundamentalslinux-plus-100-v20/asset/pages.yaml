  md: 'Linux is multitasking, meaning that it can appear to run more than one application
    or process at a time. For example, a user can copy files in the background while
    working on a word processing application in the foreground. A detailed description
    of the multitasking abilities of Linux will also be given later.


    # POSIX-I-Compliant


    Linux is also a POSIX.1-compliant operating system. POSIX stands for Portable
    Operating System Interface for Computer Environment, and it was developed by the
    Institute of Electrical and Electronic Engineers (IEEE) as a Unix-like operating
    system for the American National Standard Institute (ANSI). The IEEE defines how
    a Unix-like operating system should function and specifies certain system calls
    and interfaces that such a system should implement. From its inception, Linux
    was intended to be POSIX-compliant.


    # Free Software


    Finally, Linux is considered to be a free software package. This will be discussed
    in greater detail in the Affordability (GPL) section of this module.'
  merge: -1
