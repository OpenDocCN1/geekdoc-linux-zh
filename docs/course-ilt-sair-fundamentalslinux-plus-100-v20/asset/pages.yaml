  md: "# User Accounts\n\n+   - UID and GID\n- /etc/passwd\n- Adding Users\n  - Set\
    \ basic information\n  - Create a home directory\n  - Transfer login initialization\
    \ files\n- Removing User Accounts\n- The Shadow Password File\n\n![](img/b0ea5e4a55ee6767fff087672e71c505_66_0.png)\n\
    \n# USER ACCOUNTS\n\nIndividual user accounts are one of Linux's most powerful\
    \ and useful features; they are also one of Linux's most tiresome sources of system\
    \ administration worries. From individual problems with accounts to security issues,\
    \ system administrators will often agree that maintaining and managing user accounts\
    \ can quickly become more time-consuming than other administrative responsibilities.\
    \ Nevertheless, the productivity and networking functionality that a multi-user\
    \ operating system can provide is worth the time.\n\nUser accounts grant multiple\
    \ persons access to machines and file systems, and they allow a system administrator\
    \ to govern how much privilege and access each person has. User accounts by default\
    \ have less privilege than root, because root provides a system administrator\
    \ with full access to all. All system administrators have a separate user account,\
    \ which allows them to work on a system without making potentially harmful changes.\n\
    \n# UID and GID\n\nThe primary identifier for a user is or her user identification\
    \ number (UID). This UID is by which the system recognizes and refers to a user.\
    \ A UID is associated with the username, or login name, which is a string of usually\
    \ no more than eight characters. The username is the identifier that a user enters\
    \ when logging into a system. Additionally, users are assigned a group identification\
    \ number (GID), which categorizes users by attributes and permissions. Like a\
    \ UID, a GID is used by the system for identification, while a group name may\
    \ be associated with that group. A single user may be a member of multiple groups.\n\
    \n# /etc/passwd\n\nInformation regarding user accounts is located in the /etc/passwd\
    \ file. The following is a sample excerpt from that file:"
  merge: -1
  pgno: 66
- img_proc: true
  md: '```

    bryandeer:x:10053:100:Bryan Deer;mnt/home/bryandeer:/bin/bash

    SatokoK:x:10054:100:Satoko Katagiri;mnt/home/SatokoK:/bin/bash

    bluejay:x:10055:100:Jay Quinn;mnt/home/bluejay:/bin/bash

    ```


    The /etc/passwd file contains various pieces of information delineated by colons,
    and the information following the colon:


    ```

    username:password:UID:GID:information:home_directory:shell

    ```


    Each line contains information about a single user. The first field is the username
    bryandeer. The next field, containing an x, is the password field. Normally, the
    password is shown in encoded format, in this case, shadow passwords are being
    used, causing the password field to appear as an x. For security purposes, shadow
    passwords should always be used. These will be explained in more detail later
    in this chapter. The next two fields display UID and GID. All users can be associated
    with multiple groups, the GID here is the primary group. The information field
    shows user information, in this case the user''s full name, Bryan Deer''s home
    directory, and the final field indicates the shell used when login occurs, in
    which the above case is bash (Bourne-Again-bash).


    User group is stored in the /etc/group file. This is similar to the /etc/passwd
    file; however, it is less complex, because it contains only four entries:


    ```

    groupname:password:GID:usernames

    ```


    The username field may contain as many usernames as is necessary. The following
    is an example of an entry from that file:


    ```

    students:x:517:bryandeer,SatokoK,bluejay

    ```


    > NOTE: The username entries are separated by commas without spaces.


    # Adding Users


    Adding a new user is achieved through a series of relatively simple procedures,
    normally performed by a new user configuration tool, such as useradd or usermod.
    This section, will discuss the steps for adding users manually. For information
    on useradd or usermod, check the man pages for each.


    # Set basic information


    Each new user will need a username, a UID, and a GID. Logged in as root, use a
    text editor to alter the /etc/passwd file. A new user''s information will be entered
    into this file in the format specified earlier in this section:


    ```

    username:password:UID:GID:information:home_directory:shell

    ```


    All fields are separated by colon rather than spaces. This file normally contains
    the user''s full name. When adding a user to the /etc/passwd file, always leave
    the password field blank by placing two colon between the username and the UID
    fields. The system administrator may set the user''s password by typing passwd
    username at the command prompt. It is possible for the system administrator to
    set the user''s password and give it to the user; however, this poses a security
    risk in the event that the system administrator writes down the password or e-mails
    it to the user.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_67_0.png)'
  merge: -1
  pgno: 67
- img_proc: true
  md: '# User Accounts 3-21


    If the user fails to change the password, it is possible that someone outside
    the system might obtain it and to compromise the system. The best option at point
    is to allow the user to set or her own password or to use the -f option with passwd
    to have the password expire. The last field contains the login shell for the new
    user. Shell available to the user should be specified in the /etc/shells file.


    # Create a home directory


    ```

    bryander:x:10053:000:Bryan Deer:/mnt/home/bryander:/bin/bash

    ```


    one would use the command mkdir /mnt/home/bcbrown.


    # Transfer login initialization files


    Initialization files for a user''s shell must be contained in their home directory.
    Users must also be granted ownership of these files. Table 3-1 illustrates what
    files must be included for certain shells:


    | Shell | Necessary Files |

    |---|---|

    | Bourne Shell | .profile |

    | Bourn-Again Shell | .bash .login .bashrc |

    | C Shell | .login .cshrc |

    | Korn Shell | .profile and times .kshrc |

    | Tsh | .login .cshrc or .tcshrc |


    Table 3-1. Files Included With Certain Shells


    The conventional location for storage of these files is the /etc/skeleton directory,
    though this location varies among differing distributions of Linux. All the system
    administrator needs to copy the necessary files from this directory to the new
    user''s home directory using the cp command and then use clown to change both
    the ownership of the files and the user''s home directory.


    ```

    chown -R bryander.users /mnt/home/bryander

    ```


    Once this step has completed, the new user account will be ready. To ensure that
    the new account works, try logging in as the new user. If the login goes smoothly,
    check the file ownership and check to see if the initialization files took effect.
    If all of this works, the new user has been successfully added.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_68_0.png)


    SAIR Linux and GNU Certification -- Fundamentals/Linux+'
