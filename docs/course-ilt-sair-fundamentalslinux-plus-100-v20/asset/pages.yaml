  md: '# B-10 Appendix B — Glossary


    open source. Open source software usually refers to a software package that contains
    binary and source code that may be used, studied, and modified, but remains under
    the control of the license holder. Open source software experts require knowledge
    with regard to admission. This term is used to describe the viewing of the source
    code, not the distribution of the software. There are forms of open source software
    that do not permit code modification and restrict general viewing of the source
    code. Historically, many companies rely upon vendors to support their products.
    Typically, vendors offer a no-charge period of support called a warranty period.
    Linux has no such warranty period.


    Open source free software makes some people nervous. Historically, many companies
    rely upon vendors to support their products. Typically, vendors offer a no-charge
    period of support, called a warranty period. Linux has no such warranty period.


    P switch. Permits selection of other printers besides the default name lp. Many
    times a remote printer is available, but to access it requires use of the -P switch.


    password. A secret combination of letters and numbers used to verify the account
    owner.


    PC 100 memory. Newer mainboards use high-speed (9–10 ns) that runs faster than
    traditional cache (20 ns) and, therefore, provides high-speed access throughout
    system memory.


    permissions. Each file and its directory have access permissions based upon the
    concept of owner, group, and others. Access permissions are read, write, and execute.
    If the file is a directory, the execution permission is interpreted as a search
    permission for the owner, group, or others.


    port switching. Refers to the use of one of the console virtual terminals, the
    X Window system windows, hardwired TTYs, or to the network, to switch between
    logical terminals. The user may establish multiple login sessions using either
    the same account or a new account.


    PostScript printers. PostScript is a middle-level language that describes the
    type of graphic images to be displayed on the printer; however, the printer must
    be able to translate the PostScript descriptions into pixels.


    preemptive scheduling. The ability of the kernel to stop one program and lower
    its priority so that another may run immediately.


    primary and extended partitions. Only four primary partitions are allowed by the
    BIOS. If more are needed, then one of primary partitions is transformed into an
    extended partition and it contains the additional logical partitions.


    print filters. Translate the content of files between two format types.


    print file, four key definitions. At a minimum, each printcap entry should describe
    the logical name of the printer, its spooling directory, its error report file,
    and a print filter, if required.


    print file, role. The printcap file describes the various printers that are directly
    connected to the local machine or to the network.


    printcap serving. The remote machine field [rm] on one server may refer to a similar
    [rm] entry on another machine, allowing each machine in the chain to pass the
    print job to the next link.


    priorities. Messages are directed with the use of facilities label indicating
    the type of daemon message (mail, telnet, lpr, etc.) and the priority of the message
    (emergency, warning, debug, etc.).


    ![](img/b0ea5e4a55ee6767fff087672e71c505_381_0.png)'
