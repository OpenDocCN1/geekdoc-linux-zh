  md: "# Backup\n\n+   * Types of Backups\n  * Epoch\n  * Differential\n  * Incremental\n\
    * Backup Utilities\n  * dump and restore\n  * tar and gzip\n  * cpio\n\nBackup\
    \ is the process of making a copy or copies of the existing system in order to\
    \ safeguard against possible failures with the system. Backups are very important\
    \ in a production environment. If data is lost on a system, backups will be needed\
    \ to retrieve data. In order to do this, users need to understand the various\
    \ types of backups, as well as how to use common freely available utilities.\n\
    \n# Types of Backups\n\nThree different strategies of backups are epoch, differential,\
    \ and incremental. Each has advantages and disadvantages, which will be discussed\
    \ here.\n\n# Epoch\n\nEpoch backups are essentially copies of everything on the\
    \ system. However, it requires enormous time and resources. Every other backup\
    \ requires the use of an epoch, as this is the basis for the others.\n\n# Differential\n\
    \nBy performing a differential backup, users are making a copy of everything that\
    \ has been changed since the current epoch. These first couple of backups are\
    \ usually not that large, because little usually changes on the system. However,\
    \ after a period of time, they will grow in size, as more and more files become\
    \ changed. This forces an epoch more frequently to ensure the size of the differential\
    \ does not become too large. This makes restores easier, though, because users\
    \ only have to be concerned with the epoch and the most recent differential."
  merge: -1
  pgno: 220
- img_proc: true
  md: '# 7-36 Module 7 — Linux Applications


    # Incremental


    Incremental backups build on each other in order to provide a reliable backup
    of the system. The epoch and the first backup are the same as the differential.
    This first backup makes copies of the changes from the epoch. However, the difference
    ends there, as the subsequent backups will then determine the difference from
    the most recent epoch, instead of the epoch, and backup those changes. This has
    the definite advantage of saving time and resources; however, it adds to the complexity,
    which could possibly, in turn, create a bad archive. This could force the user
    to backup to the most recent incremental before this bad backup. Full restoration
    is accomplished using the epoch, then starting with the first incremental and
    going all the way through the incremental backups.


    # Backup Utilities


    A number of utilities that anyone can use are freely available. The most common
    include the dump/restore combination, tar, and cpio.


    # dump and restore


    The dump command allows users to backup an entire mounted file system. The first
    dump the user performs will do an epoch. The subsequent backups are generally
    incremental, unless another epoch is specified. This can be done with the following
    options:


    ```

    dump -0f /dev/st0 /user/local/

    ```


    The 0 indicates this is the lowest level of backup and will be the epoch. For
    each number higher than the epoch, 0, an incremental backup is created. For instance,
    if a backup is created at level 0, an incremental is created at level 1, then
    level 2 and level 3. Afterwards, if the user indicates to have a backup performed
    at level 2 again, then all information changed from the level 1 backup will be
    sent for backups, overwriting the current level 2 and level 3 data. This number
    is able to advance to level 9.


    The u dump to update the /etc/dump file to show which file systems and at what
    times the dumps occurred. The f option indicates for dump to write the backup
    of /usr/local/ to /dev/st0.


    The restore command allows users to restore from backups. If the user is unsure
    of what he or she placed in the backup, or wish to select certain files, use the
    following command:


    ```

    restore -if /dev/st0

    ```


    This command will run an interactive prompt to browse through the backup. The
    ls command will be used to list the directory contents, as well as cd to change
    the directory within the backup. These commands do not have the full functionality
    of the corresponding shell commands; however, they allow users to view the contents
    of the backup and decide what to restore. The extract command allows users to
    extract everything from the backup, the help command lists more commands within
    the interactive


    # tar and gzip


    The tar command is an archiving utility, while gzip is a compression utility.
    The use of both together result in a compressed archive of files, making it easy
    to store or transport these files for backup purposes. The following example shows
    common usage for creating a tarball, a tar file containing one or more files within
    the archive.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_221_0.png)'
  merge: -1
  pgno: 221
- img_proc: true
  md: '```

    tar cvf filename.tar /usr/local/www/

    ```


    This command will create an archive of the /usr/local/www/ directory for backup
    or distribution purposes. The c option instructs tar to create the archive. The
    v option forces tar to be verbose, meaning it will display the files as it backs
    them up, so users can ensure everything is going correctly. The f option requires
    that users input a file name to name the archive, such as filename.tar in this
    case.


    If a user wishes to keep this as a backup, then this would be considered the epoch
    backup. To create an incremental backup following the day, you would have to issue
    the following command:


    ```

    tar cNvf 2001-05-31 filename.backup1.tar /usr/local/www/

    ```


    The N option allows you to backup files after a specific date. Here that date
    is 05/30/2001. Every file that has been edited since 05/30/2001 will be included
    in this backup. If users want to create another incremental backup after this
    date, type in the following command:


    ```

    tar cNvf 2001-05-31 filename.backup2.tar /usr/local/www/

    ```


    Also, to create differential backups of directory, keep the date the same for
    each backup session. Adding the z option to this will create a compressed archive,
    instead of just a direct archive of the directory contents.


    To restore these files, use the x option instead of the c option. This will extract
    the files from the existing archive. For example, if someone accidentally deletes
    a file after the last incremental backup was created, type the following command:


    ```

    tar xvf filename.backup2.tar

    ```


    In order to do a full restore, extract the epoch backup, then each subsequent
    incremental backup.


    # cpio


    cpio allows the creation of a number of different types of archives, including
    tar archives. To create an archive, have a file name list of everything to create,
    including the path to those files. Either create a list, or using the find command,
    create a list of everything backup. Once that list is created, you may use the
    following command:


    ```

    cpio -o -H backuplist.txt > backupfile.tar

    ```


    As there is no file naming convention for cpio to make sure to use the H option,
    as this will allow users to extract the files using the tar command, as well as
    cpio.


    To restore a tar file using cpio, use the following command:


    ```

    cpio -i < backupfile.tar

    ```


    In order to create a differential or incremental backup, modify the backup list
    to include just those files that have been modified since the last backup. In
    this case, the find command would be best.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_222_0.png)


    SAIR Linux and GNU Certification -- Fundamentals/Linux'
