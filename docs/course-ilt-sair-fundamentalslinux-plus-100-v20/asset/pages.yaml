    Table 5-23. Common Options for the /etc/fstab File


    The /etc/mtab file shows which file systems are already mounted in the system.
    Each line in the /etc/mtab file displays the same information as the /etc/fstab.
    However, the information in the /etc/fstab/mtab consists of the file systems that
    are currently mounted. Because there can only be a single instance of a file system
    mounted at one time, checking before attempting to mount a file system can save
    unnecessary work by a user.


    # The mount command


    The command used to mount a file system is mount. There are two different ways
    to use the mount command based on whether there is an entry in the /etc/fstab
    file for the file system mounted. As explained in the previous section, the mount
    command can only be used by root unless specified in the /etc/fstab file.


    Considering the previous example using the /etc/fstab file entry of the /dev/cdrom,
    as there is an entry in the /etc/fstab for that device, the only syntax needed
    is the command mount /dev/cdrom. However, if there is not an entry in the /etc/fstab,
    more options must be given on the command line. It is important to make sure that
    the desired mount point for the file system is already created. For instance,
    to mount the /dev/cdrom to the directory /mnt/cdrom, the /mnt/cdrom directory
    must be created with the command mkdir /mnt/cdrom. Then, after inserting the CD-ROM
    command:


    ```

    $ mount -t iso9660 /dev/cdrom /mnt/cdrom

    ```


    This should mount the CD-ROM, assuming that it is of file system type ISO-9660,
    in the /mnt/cdrom directory.


    # Options for the mount command


    The -t option stands for type and is always followed by the file system type.
    This option is used in the above example to mount the file system of type ISO-9660.
    There are several other options that are used with the mount command, some of
    which are shown in Table 5-24:


    ![](img/b0ea5e4a55ee6767fff087672e71c505_135_0.png)'
