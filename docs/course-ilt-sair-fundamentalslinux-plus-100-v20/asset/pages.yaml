  md: '# Basic Commands for Networking 8-17


    For example, a user is attempting to access information about Star Wars by visiting
    the Web site www.starwars.com, the site is not available in the Web browser. The
    user decides to ping in order to determine whether or not the www.starwars.com
    host is responding to any network activity or if the server might be slow due
    to the popularity of the site. Below is an example of using ping to connect the
    host www.starwars.com. The <CTRL->> key sequence terminates this instance of the
    ping.


    ```

    $ ping www.starwars.com

    PING starwars.com (64.41.20.50) from 207.1.122.9: 56(84) bytes of data.

    64 bytes from 64.41.20.50: icmp_seq=0 ttl=77.7 ms

    64 bytes from 64.41.20.50: icmp_seq=1 ttl=77.7 ms

    64 bytes from 64.41.20.50: icmp_seq=2 ttl=77.2 ms

    64 bytes from 64.41.20.50: icmp_seq=3 ttl=77.7 ms

    64 bytes from 64.41.20.50: icmp_seq=4 ttl=77.4 ms

    64 bytes from 64.41.20.50: icmp_seq=5 ttl=77.2 ms

    64 bytes from 64.41.20.50: icmp_seq=6 ttl=77.4 ms

    64 bytes from 64.41.20.50: icmp_seq=7 ttl=77.5 ms

    64 bytes from 64.41.20.50: icmp_seq=8 ttl=78.0 ms

    64 bytes from 64.41.20.50: icmp_seq=9 ttl=101.6 ms

    64 bytes from 64.41.20.50: icmp_seq=10 ttl=77.3 ms

    ```


    +   -- starwars.com ping statistics ---

    12 packets transmitted, 11 packets received, 8% packet loss

    Round-trip min/avg/max = 77.0/79.6/101.6 ms


    # Interpreting output


    The ping command uses the DNS to resolve the host name, www.starwars.com, into
    its IP address, 64.41.20.50. Here, ping is only reporting the packets that were
    sent as a response from the host. Because ping uses ICMP packets to communicate,
    it keeps track of how many packets were sent by numbering each using the icmp_seq
    field. The TTL field is used to determine the maximum number of hops that the
    should make during its transit to and from the host. The time given, in milliseconds,
    is the time it takes the packet to go to the host and return to the original computer.
    This is referred to as the Round Trip Time, or RTT. Once the <CTRL->> key sequence
    is used, ping no longer searches for packets. It obtains from the information
    it has received up to point and presents them. This concept is noted by the line


    +   12 packets transmitted, 11 packets received, 8% packet loss


    indicating that 12 packets were sent by ping but only 11 were returned. The way
    to tell that the program ended after the last packet returned is by the icmp_seq
    number. That in the above numbers begin at 0 and end with 10, a sequence of 11.
    If a packet had been skipped during the process, that number would be missing
    from the icmp_seq in the output. At the end of the above line, the percentage
    of packet loss is reported for www.starwars.com. Beneath that, the RTT of each
    packet is used to determine both the minimum and maximum RTT, as well as compute
    the average RTT. The minimum RTT is given, followed by the average RTT, the maximum
    RTT.


    In order to confirm whether not a packet was lost, use the -c option with ping,
    followed by a number indicating how many packets ping should send out before terminating.
    This process avoids possibly misleading packet loss percentages. For example,
    the following tests ping to send out a total of 10 packets to the host www.phantomomenance.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_242_0.png)


    SAIR and GNU Certification -- Fundamentals/Linux+'
  merge: -1
