  md: '# Customizing X Window


    +   * Desktop Managers

    * Login Managers

    * Desktop Configuration

    * Window Managers

    * Applets


    # CUSTOMIZING X WINDOW


    The X Window system takes the versatility of terminal Linux and expands it to
    a graphic interface. There are unlimited possibilities for altering the appearance
    of the X window environment. From the wallpaper to the window manager, anything
    can be changed to fit the user''s specifications. The desktop manager and the
    window manager govern the appearance of X window. The desktop manager controls
    the menus, icons, and wallpapers, and the window manager controls all of the window
    functions, from the way they look to how they react to the mouse.


    # Desktop Managers


    There are many desktop and window managers available for download over the Internet.
    Customizing has consistently been a focal point for the Linux community, and with
    the recent advances in X, customizing is becoming a rapidly growing area of development.
    Desktop managers are now equipped with new features and applications; window managers
    now support themes and desktop management. With all the managers available, users
    should have no problem finding managers that suit them. Tables 6-1 and 6-2 list
    some of the available managers and their descriptions:


    | Desktop Managers | Description |

    |---|-|

    | Gnome | Comes equipped with Gnome office and the Gnome development platform;
    cooperates easily with most window managers and KDE applications and menus |

    | KDE | Full-blown IDE (Integrated Desktop Environment); includes its own window
    manager, file manager, and many new KDE applications |


    Table 6-1. Desktop Managers and Their Features'
  merge: -1
  pgno: 163
- img_proc: true
  md: '# Customizing X Window


    | Window Managers | Description |

    |---|---|

    | Sawfish | Offers the most features with ease of use; works well with Gnome |

    | Enlightenment | Offers many visual effects, but has trouble cooperating with
    some desktop managers |

    | Window Maker | Basic window manager; easy to use and is standard with most Linux
    distributions |

    | KWM | The standard KDE window manager; integrates well |


    # Table 6-2. Window Managers and Their Features


    The desktop managers allow the user to choose from all installed managers, so
    each window manager can be easily experimented with until the preferred setting
    is found. There are, however, some compatibility issues between managers. For
    example, some users found Enlightenment to conflict with Gnome''s theme and wallpaper
    feature. This is mainly because Enlightenment offers some desktop managers in
    addition to window management. Setting a wallpaper on Gnome may be overridden
    by the wallpaper set by Enlightenment. This is why it is important to test the
    window managers with the selected desktop manager.


    # Login Managers


    X customizing starts before X initializes. XDM, the X login manager, allows a
    user to graphically log into X and select from the installed desktop managers.
    This also allows X to control terminal login. When computers are booted up, the
    initial terminal login can be bypassed, the system will start up, and XDM can
    then ask for the login. Linux users do not have to view the terminal if they choose.
    Gnome has also released a version of the X login manager GDM. This is an updated
    and much more user-friendly version of XDM. Numerous additions include a nice
    graphical login, tab completion, and a welcome screen login. Figure 6-7 shows
    a typical GDM login screen:


    ![](img/b0ea5e4a55ee6767fff087672e71c505_164_0.png)


    # Figure 6-7. GDM Login Screen


    The user can select a desktop manager from the Session menu. Window managers and
    the desktop manager can be changed at the login. By installing multiple managers,
    the overall look and feel of the desktop can be changed in a matter of moments.'
