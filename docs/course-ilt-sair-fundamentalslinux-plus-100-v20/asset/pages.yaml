- img_proc: true
  md: '# Categories


    The main screen of the BIOS setup utility has several possible categories. These
    categories include, but are not limited to, main, advanced, power, boot, and exit.
    Each category contains a number of settings for different components of the system.
    Some categories contain subcategories which contain more settings. The main category
    has general settings for the machine. Two of the settings are the system time
    and date. If necessary, changes to the time and date of the machine are made here.
    Due to the BIOS''s ability to auto-detect many devices and settings, the BIOS
    really does not need to be changed for a very specific, or necessary, reason.


    # Sub-Categories and Settings


    The advanced and power categories contain settings for the operation and power
    management of devices. These are settings that should only be changed by an experienced
    user. Some of the settings, if incorrectly configured, may cause damage to the
    CPU and other system components.


    The boot category contains settings that may need to be adjusted for the installation
    of Linux. Settings for the hard drive, floppy disk drive, CD-ROM, and other bootable
    devices are located in the boot category. These settings need to be configured
    correctly for the proper installation of Linux. More importantly, the hard drive
    should be enabled. If the hard drive is disabled, there will be no feasible place
    to install Linux. The next important device is the CD-ROM, which is one of the
    most common methods of installation. The device needs the floppy drive is a much
    less common, yet possible, means for installation. This device should be enabled
    if the distribution being installed from floppy disks. The last major device is
    the setting for other. This bootable device needs to be set as a network card
    if the installation process takes place across a network connection.


    The remainder of the BIOS should only be changed for specific reasons by experienced
    users. The last action that should be taken, after setting the time and altering
    the settings necessary for installation, is to save the changes and reboot the
    system.


    ```

    LILO boot: <TAB>

    linux win98

    LILO boot:

    ```


    A typical /etc/lilo.conf looks something like this:


    ![](img/b0ea5e4a55ee6767fff087672e71c505_40_0.png)


    SAIR Linux and GNU Certification -- Fundamentals/Linux'
