  md: '# Command mode in Vi


    In command mode, nearly every key is associated with a command; there are also
    combinations of keystrokes that may be used to create commands. Preferences may
    be saved to bind certain keystrokes to command combinations. When writing in Vi,
    remember to switch to input mode; otherwise, a user may inadvertently damage a
    file under the impression that he or she is entering text when actually entering
    commands.


    In command mode, the colon (:) is used to move to line-editing mode. Here, keystrokes
    are entered at the bottom of the screen until the <ENTER> key is pressed. Combinations
    of commands or arguments may be entered in this mode.


    # Read


    To open a file named deathstar, type:


    ```

    :r deathstar

    ```


    The <R> key will invoke the Read command and open the file deathstar. To save
    a file named textfile, type:


    ```

    :w textfile

    ```


    # New files


    The :w command combination may also be used to create a new file and save all
    text written to that file.


    # Close


    To close Vi, the :q command is used. However, if there is a file that has changed
    since it was last saved, the :q command will not close immediately and will instead
    prompt the user to save the file. If the user does not wish to save the changes
    made on a file, the command :q will exit without saving.


    These commands may also be combined to perform multiple operations at one time.
    For example, typing :wq will save the current file and quit Vi.


    # Navigation


    The user may move through the text in command mode with specific keystrokes. The
    <h>, <>, k, and <l> keys move left, up, down, and right, respectively. To move
    from screen to screen, the <CTRL-F> and <CTRL-B> keys will move a screen forward
    or backward, respectively. To move one word forward or backwards, type <SHIFT-E>
    or <SHIFT-B>.


    # Editing


    Copying, cutting, and pasting are line-by-line in Vi. To cut a line, type dd;
    to copy a line, type yy. The command to paste is p; this will paste the information
    that was most recently cut or copied into the text.


    # Searching


    Use command mode to search for specific text in Vi. Typing backslash (/) opens
    the search dialogue. For example, typing /pattern will move the cursor to the
    first instance of the string pattern in the file. To repeat a search, the <n>
    key will move to the next occurrence of pattern. To search and replace all instances
    of the text search with the text replace, this command would be:


    ```

    : 1,$ s/search/replace/g

    ```


    ![](img/b0ea5e4a55ee6767fff087672e71c505_190_0.png)'
