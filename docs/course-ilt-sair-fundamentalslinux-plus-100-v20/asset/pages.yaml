  md: '# Basic Shell Functions 4-23


    After the system reads this file, it looks in the home directory of the user.
    It first seeks the .bash_profile file and executes it if found; if not, it looks
    for the .bash_login file and executes it if located. If neither of the above three
    files are found, it will look for the .profile file and execute it; if it is located.
    Only one of the above three files will be executed; usually it is .bash_profile.
    When logging out, from the shell which the user wants to log out executes the
    commands from the .bash_logout file.


    If Bash is started as a non-login interactive shell, then it reads the .bashrc
    file, but the environmental variables in its parent''s shell are passed to the
    new shell.


    If Bash is started in non-login and non-interactive mode, it looks for environment
    variable BASH_ENV. If this variable is not found, it looks for ENV. The shell
    executes the commands in the specified file name in either of these environment
    variables.


    # Running a Program in the Background


    Linux is a multitasking operating system. It is capable of executing many programs
    simultaneously. A program (or job) will take time to complete execution, blocking
    the user from running other jobs during that time. To utilize the multitasking
    feature and avoid waiting, the user can execute jobs in the background.


    The user can put a process in the background by appending an ampersand (&) character
    to the end of the command. For example:


    ```

    $ yes > /dev/null &

    [1] 123

    $

    ```


    [1] is the process number, and 123 is the process identifier. The yes command
    sends a series of the letter to the standard output. In the above command, this
    will be sent to /dev/null, which means that the user will not see the output of
    yes. The & command runs the process in the background and will bring the shell
    prompt back to the terminal.


    # Listing/stopping background programs


    If the user runs the command jobs after getting the prompt back, a list of running
    jobs will be shown.


    ```

    $ jobs

    [1]+ Running      yes > /dev/null &

    $

    ```


    This command will show the processes running in the background and their current
    states. The user can kill the process by specifying the process number as given
    below:


    ```

    $ kill 1.

    ```


    The process number is 1. If the user executes the command jobs now, the following
    output will result:


    ```

    [1]+ Terminated      yes > /dev/null

    ```


    The following command may also be used:


    ```

    $ kill 123

    ```


    ![](img/b0ea5e4a55ee6767fff087672e71c505_100_0.png)'
