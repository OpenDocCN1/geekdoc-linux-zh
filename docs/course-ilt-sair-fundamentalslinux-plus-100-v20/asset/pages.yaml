  md: '# Database Management Systems


    +   - Overview of Database Management Systems


    +   - PostgreSQL

    - On-line transaction on MySQL and PostgreSQL


    +   - Relational Database Management Systems


    +   - Common Applications of a DBMS


    +   - Batch applications

    - Decision support applications

    - On-line transaction processing applications


    +   - Which Database Management System To Use?


    +   - MySQL


    # DATABASE MANAGEMENT SYSTEMS


    Two popular Database Management Systems (DBMS) in use today are MySQL and PostgreSQL.
    MySQL is a small, fast, and efficient DBMS that places more emphasis on speed
    than on data integrity, while PostgreSQL focuses on keeping the data safe and
    secure. While each of these has benefits, it is important for users to know which
    one is best for them.


    # Overview of Database Management Systems


    The functionality of a DBMS is based upon the need to manage a moderate-to-large
    database or a collection of databases. DBMSs offer users a wider range of versatility
    and flexibility and more control over databases than default file managers. Aside
    from storing data, a DBMS helps to maintain the integrity of that data with quality
    control and by incorporating security, coordinating shared usage, and controlling
    the access of authorized users. When implemented, DBMS work to create and define
    the database as well as to include a multitude of useful functions, including
    data retrieval, updating, performance monitoring, and system development options
    for programming customized facilities. In addition, a DBMS can aid in the revision
    and restructuring of the entire database when needed.


    # Relational Database Management Systems


    A DBMS that has a relational architecture separates stored data into tables rather
    than leaving it in a virtual heap. The relations link various tables and allow
    them to be combined and accessed when needed. Relational Database Management Systems
    (RDBMS) have become very popular because they have put end to the file duplication
    needed when different applications must access the same data. This is done by
    using users the ability to define an underlying common structure (a relation)
    to their data and, at the same time, to make that data readily available for any
    application that may need it.'
  merge: -1
  pgno: 259
- img_proc: true
  md: '# Common Applications of a DBMS


    Most applications that use a DBMS can be grouped into one of three categories:
    batch applications, decision support applications, and online transactions processing
    applications.


    # Batch applications


    Batch applications, or jobs, are prioritized according to user-defined standards
    and put aside until system resources are more readily available. Batch applications
    are most commonly used for large centralized computing environments and are usually
    associated with either reading or updating data.


    # Decision support applications


    Decision support applications are utilized to help spot trends, identify problem
    sources, and make decisions based on existing data. Generally, these types of
    applications are read-intensive and can be unpredictable in their decision-making.
    However, decision support applications continue to be an important tool for businesses
    wishing to gain a competitive edge.


    # Online transaction processing applications


    These applications are most commonly associated with Web-based commerce. Work
    done by online transaction tends to involve the updating of existing data as new
    data arrives.


    # Which Database Management System to Use?


    The decision of which database management system to use can be difficult, as there
    is a wide selection. Choosing the wrong database manager may mean compromising
    efficiency, functionality, or the security of the database. Researching a DBMS
    with a relatively developed notion of what will be required as for systems, Web
    traffic, and security is a very good idea. Role between different database management
    systems, MySQL and PostgreSQL. Both are good choices for the various demands that
    might be placed on a database.


    # MySQL


    MySQL can be an excellent choice for Web masters because it is small and very
    fast for read-heavy and low user traffic applications. It is useful for processing
    data, such as user accounts and other trivial information. MySQL does, however,
    lack some vital features that would make it a good DBMS when expecting heavy multi-user
    traffic or when data integrity is paramount.


    # Functionality


    MySQL is a relational DBMS. This means that data is stored in separate tables
    linked by defined relations, allowing them to be accessed either singularly or
    together. In addition, alias is allowed between tables and columns in the database.
    MySQL is supported by many operating systems, including Windows 98, Windows NT,
    Windows 2000, Linux, and Unix systems. There are many client tools available for
    programming such as C++, Java, PHP and Python. It has a flexibility that includes
    an encrypted password system allows for host verification


    MySQL is not a good choice for a database containing very important information
    (such as financial data). MySQL does not have transaction support, which ensures
    that a database is correct and will be maintained in the case of power or disk
    failures. Additionally, MySQL tends to have problems when dealing with multi-user
    traffic. The table-locking system in MySQL will lock an entire table if one user
    writes to that table, forcing other users who can read to wait until the writing
    is done. MySQL also lacks features that are normally contained within the SQL
    language, including subselects, server-side cursors, and stored procedures.


    > SAIR Linux and GNU Certification -- Fundamentals+'
  merge: -1
  pgno: 260
- img_proc: true
  md: 'MySQL is fast, reliable, and easy to use, but it is mainly a context-specific
    database manager. For a full list of features and options, visit the MySQL Web
    page at www.mysql.com.


    # PostgreSQL


    PostgreSQL is the better choice for businesses and companies that demand high-end,
    multi-user performance along the security options needed when dealing with large
    amounts of important data. However, DBMS is slower than MySQL due to the transaction
    support overhead.


    Another difference between PostgreSQL and MySQL is that PostgreSQL is an object-relational
    DBMS, as opposed to being merely relational. An object-relational DBMS is purported
    to be more powerful than its relational counterparts by the addition of object-oriented
    features such as classes and inheritance.


    # Functionality


    In general, PostgreSQL offers other DBMS features that MySQL lacks. It, like MySQL,
    has the capability to run on multiple platforms and many different language options
    for writing code, including PHP, Perl, Java, and C++.


    PostgreSQL offers extended SQL language options that are not available with MySQL,
    such as subselects, views, and server-side cursors. PostgreSQL also offers transaction
    support. Transaction support ensures that all operations taking place over the
    Web will pass what is known as the ACID test. Atomic, Consistent, Independent
    and Durable (ACID) ensures that all changes to the database will happen correctly.
    Transaction support also guarantees that these changes will be protected from
    possible failures with a feature known as rollback, which replaces the partially
    written data from an interrupted write job with the old data. Also, while MySQL
    uses table-level locking, which can produce some multi-user problems, PostgreSQL
    uses a multivers model. This model functions so that the locks necessary for users
    who are reading will not conflict with locks necessary for users who are writing.
    For more information on the functionality of PostgreSQL, visit the page at www.postgresql.org.


    # Conclusions on MySQL and PostgreSQL


    There is some contention between users of PostgreSQL and MySQL about which is
    the better DBMS. MySQL is better for Web management and is good for users who
    need a lean, fast, easy-to-use DBMS in exchange for a comparatively limited amount
    of versatility. PostgreSQL is more business-oriented and for those who need versatility
    in dealing with multiple users and security when dealing with important data.
    In any case, both of these DBMSs are under constant development and offer their
    Web pages for bug reports, comments, and support.


