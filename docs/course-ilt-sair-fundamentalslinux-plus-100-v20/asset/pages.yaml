- img_proc: true
  md: 'Most of the security complaints have come from people with little knowledge
    of Linux. Understanding how Linux runs allows the user to properly secure his
    or her system based on appropriate needs.


    # # Ownership and Permissions


    Most of the security trouble people have on their Linux system stems from an inability
    to properly assign ownership and attributes to files and directories. Proper use
    of restrictions on a system will solve many security problems. To prevent outside
    users from logging in or sending unauthorized information, Linux can utilize firewalls.
    Firewalls (usually a computer running between a TCP connection and the host) filter
    all incoming data and prevent unwanted data from reaching the host. Malicious
    users often use massive packets sent in a continuous stream to overload a server''s
    connection, taking the server offline. This is called flooding. Essentially, flooding
    has the same effects as a couple of millions users sending large amounts of information
    to the server at the same time. The available bandwidth of the server begins to
    drop rapidly and the overflow makes the server unresponsive. This flood of information
    can keep servers down for minutes or hours. In addition to firewalls, many security
    programs are available for Linux that can help provide the most secure system
    possible.


    Linux servers are attacked often for two main reasons: many malicious users are
    running Linux (or some other Unix derivative) and Linux presents more of a challenge
    than other operating systems. However, the Linux community is very open with information
    to protect systems. This makes mailing lists and newsgroups pertaining to Linux
    security very useful. Through this forum, system exploits are discussed and appropriate
    counter measures are devised and implemented. With most distributions, support
    is also available for problems that cannot be corrected by the user. Overall,
    proper knowledge of Linux can make any Linux server very efficient and secure.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_23_0.png)'
