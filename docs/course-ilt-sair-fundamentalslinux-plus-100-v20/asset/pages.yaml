  md: "# Samba 8-29\n\n# Samba\n\n+   * Protocols\n  * Server Message Block (SMB)\n\
    \  * Common Interest Internet File System (CIFS)\n* Daemons\n  * smbd\n  * nmbd\n\
    * Utilities\n* SWAT\n* Samba Advantages\n\n# SAMBA\n\n![](img/b0ea5e4a55ee6767fff087672e71c505_254_0.png)\n\
    \nSamba allows a user to transform a Linux machine into a file and print service\
    \ for a Microsoft Windows network. Windows users are aware that the machine is\
    \ there but unaware that it is a Linux machine. Samba also enables Linux machines\
    \ to access Windows partitions on other machines within a network. Samba is freely\
    \ distributed under the GNU General Public License and can be downloaded at its\
    \ primary Web site www.samba.org/.\n\n# Protocols\n\nSamba supports two client/server\
    \ protocols: Server Message Block (SMB) and Common Interest File System (CIFS).\
    \ The SMB protocol describes rules for communication among various machines on\
    \ a network. An end user who is using client software that also supports SMB/CIFS\
    \ can send a series of client requests to the Samba server. On the other computer,\
    \ the Samba server responds to each client request, either granting or denying\
    \ access to its shared files and resources.\n\n# Daemons\n\nSamba contains two\
    \ main daemons, smbd and nmbd. These are responsible for implementing the file\
    \ and print services, authentication and authorization, name resolution, and browsing.\
    \ The Samba daemon, smbd, is responsible for managing the shared resources between\
    \ the Samba server machine and its clients. It examines the service requests from\
    \ other machines and responds as specified in the /etc/smb.conf file. smbd controls\
    \ authentication and authorization that is in a share or user mode, in which a\
    \ single password is given to all users who are allowed to use the share, is simplified\
    \ and less secure. In user mode, each user is given a userid and password, and\
    \ for or her access can be managed on an individual basis by the system administrator."
