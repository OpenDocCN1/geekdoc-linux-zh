  md: "# Module 4 — Linux Sessions\n\n# Logging In\n\n+   - Starting the Linux Session\n\
    \  - Login prompt\n  - Password prompt\n  - Authentication\n- Changing Users\n\
    \  - Logging Into the GUI\n  - Using Multiple Terminals\n\n![](img/b0ea5e4a55ee6767fff087672e71c505_81_0.png)\n\
    \n# LOGGING IN\n\nTo login to a host, a user must have an account on that host.\
    \ This section explains how to log on to a system and change the user.\n\n# Starting\
    \ the Linux Session\n\nThe installation processes of most Linux distributions\
    \ require a root password and often the creation of at least one user account.\
    \ This is done because all users will need to log in once installation is complete,\
    \ and the root account should not be their normal login. The system administrator\
    \ should also have a personal user account, because root is normally reserved\
    \ for administrative tasks. A user logged in as root may accidentally make changes\
    \ to vital files. An error made while logged in as root could be detrimental to\
    \ the system.\n\n![](img/b0ea5e4a55ee6767fff087672e71c505_81_1.png)\n\n# Login\
    \ prompt\n\nIn Linux, login prompts are initiated by a program called getty. The\
    \ getty command opens a tty port, prompts for a login name, and invokes the login\
    \ command to complete the login process.\n\nTypical login shells display the distribution\
    \ name at the top, along with the version number. The next line contains the version\
    \ number of the Linux kernel. The name of the workstation is displayed, followed\
    \ by the login prompt. This is where the user should type a username. A successful\
    \ login occurs when the user is granted permission only to the files and groups\
    \ to which he or she has access. If an account has been set up, it should be used\
    \ for login purposes, unless administrative tasks (such as creating user accounts)\
    \ must be done and no accounts exist. If an account does not exist, then the account\
    \ should be created for the user to access.\n\n# Password prompt\n\nOnce a user\
    \ has been entered at the login prompt, it will display:\n\n```\nPassword:\n```"
