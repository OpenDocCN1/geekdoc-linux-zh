  md: 'Designating which network or computer is left and determining which one is
    right; however, the designations must match for each site. For example, when connecting
    network A to network B, network A can be denoted left or right, as long as network
    B does not conflict. If network A is left, all of its parameters must be written
    right in the ipsec.conf file, making all of network B left. Start, both networks
    must agree on which is left and which is right. For each left option, there must
    be a corresponding right option. For a complete list, consult the man IPSEC pages
    after installation. Common configuration parameters are shown in Table 8-10:


    | Parameters | Description |

    |---|---|n| pluto | The IKE (IPSec Key Exchange) daemon at boot time that handles
    much of the manual keying to connect systems. A connection may be loaded or activated
    using this |

    | conn | Labels the connection |

    | left/right | Device used to communicate with the Internet |

    | leftsubnet/rightsubnet | Device or address protected by the left/right device
    |

    | leftnextop/rightnextop | Usually a router used to access the Internet |

    | leftfirewall/rightfirewall | Denotes a firewall present at a location |

    | leftid/rightid | Gives the names of the connected computers (optional) |

    | leftasikey/rightkeys | The encryption key is denoted with this parameter. Both
    connections must have the same key |

    | auto | All connections marked "auto-add" are loaded when the daemon starts.
    Pluto is the IPSEC daemon initialized at startup. Likewise, connections, including
    auto-start, start the connections. Thus the encrypted connection is begun at startup
    |


    Table 8-10. IPSEC Common Configuration Parameters


    The simplest configuration involves two computers connected directly to the Internet.


    ```

    compA----------------(Internet)----------------compB

    123.456.78.90 123.904.56.78

    ```


    The /etc/ipsec.conf file is written as follows:


    ```

    config setup

    interfaces=%defaultroute

    plutoload=%search

    tipostart=%search

    conn compA-compB

    leftid=compA.companyA

    rightid=compB.companyB

    left=123.456.78.90

    right=123.904.56.78

    auto=add

    leftrasigikey=0x123456789abcde

    rightrasigikey=0x123456789abcde

    ```


    ![](img/b0ea5e4a55ee6767fff087672e71c505_268_0.png)'
