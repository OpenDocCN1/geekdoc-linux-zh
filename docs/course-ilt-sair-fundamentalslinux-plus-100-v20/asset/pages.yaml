  md: '# Pico


    Pine Composer (Pico) is a simple text editor that is distributed either as part
    of the Pine mail program or as a separate program. It was originally written to
    be the text editor for Pine, but it has become a free standing text editor, useful
    for novice users of Linux.


    Pine is invoked by typing pico at the system prompt. Pico may be started with
    options, which are defined below, as well as a file to begin editing. For example,
    to open the program and edit the file file.txt, enter the command pico file.txt.


    Pico operates by loading one file at a time and performing commands that are displayed
    at the bottom of the screen. Mouse support may be enabled, which turns Pico into
    a graphical text editor that is useful for quick tasks. However, there are no
    special configuration files or modes by which Pico can be transformed into an
    editor for a specific type of file.


    # Commands


    12 options that appear at the bottom of a Pico screen:

    | Option | Key Stroke |

    |---|---|n| Help | <CTRL-G> |

    | WriteOut | <CTRL-O> |

    | ReadFile | <CTRL-R> |

    | Previous Page | <CTRL-Y> |

    | Cut Text | <CTRL-K> |

    | Cursor Position | <CTRL-C> |

    | Exit | <CTRL-X> |

    | Justify | <CTRL-J> |

    | Where Is | <CTRL-W> |

    | Next Page | <CTRL-U> |

    | Uncut Text | <CTRL-Y> |

    | Spelling | <CTRL-T> |


    Table 7-5. Options in Pico


    Press any of these keys will open a dialogue box to complete the command. If mouse
    support is enabled, clicking on an option will also open a dialogue box.


    For example, if the Read File option is executed (<CTRL-R), four options are presented
    to the user. There is a Help option (<CTRL-G>), a Cancel option (<CTRL-C), and
    a To Files option (<CTRL-T>), which will open the current directory to choose
    a file name and a prompt for the insertion of the file name. By default, Pico
    does not support file name completion for opening files, so names must be typed
    completely and correctly.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_195_0.png)'
