- img_proc: true
  md: '# 10-50 Module 10 — Hardware


    ![](img/b0ea5e4a55ee6767fff087672e71c505_353_0.png)


    Figure 10-10. Ring Topology


    In this topology, a token (small data packet) continuously travels around the
    network in a circular fashion. When a host receives the token, it may use it to
    send data to any other host. Once the host has sent its data, or if it had nothing
    to send, it passes the token to the next host. The fact that data is sent in only
    one direction at all times prevents data collision on this topology.


    Every host on the network amplifies the signal before passing it to the next host
    (i.e., every host acts as a repeater), making this topology an active topology.
    Furthermore, since the signal is amplified by every host, the chance of signal
    degradation is greatly decreased


    The ring topology provides all hosts with an equal opportunity to communicate,
    is easy to install, and there is little degradation of signals. However, ring
    topologies can be very expensive, and host problems and transmission media breaks
    will cause the entire network to go down.


    # Star topology


    A star topology consists of several hosts connected to a hub. When a host sends
    a signal, the signal to the host for which it was intended, decreasing network
    traffic and the chances of eavesdropping. Unlike bus or ring topologies, the network
    will continue to function if a a host is experiencing problems. If there is a
    break in the transmission medium, only the system connected via that will have
    no network access.


    # Increasing Bandwidth


    Speed in a local area network is largely determined by bandwidth. Understanding
    how to manage bandwidth and its limitations is an important part of efficiently
    maintaining a network and avoiding problems such as congestion and overload.'
