    # Sending mail


    In order to send a message, choose Compose Message from the main menu. Displayed
    on the screen will be four header fields, a place to put the body of the message,
    and some common commands. Sending messages filling in the fields (only the To:
    field is required), typing in the actual text, and pressing <CTRL-X>.


    When writing the body of the message, the user is actually typing in an integrated
    version of Pico. Listed in Table 8-6 are some of the more common Pico commands:


    | Command | Function |

    |---|---|

    | <CTRL-A> | Moves to beginning of the line |

    | <CTRL-E> | Moves to the end of the line |

    | <CTRL-U> | Pastes previously cut text |

    | <CTRL-V> | Moves one page down |

    | <CTRL-Y> | Moves one page up |


    # Table 8-6. Common Pico Commands


    One of the other fields in the header is Attach. Pine supports Multipurpose Internet
    Mail Extensions (MIME) to allow users to send sounds, graphics, movies, and other
    files by e-mail. In this field, type in the location of the file to send or press
    <CTRL-J> followed by <CTRL-T> to view the directory structure and find a file.


    # Receiving mail


    At the top of the main menu, the header displays the version of Pico, the current
    folder, and the number of messages in folder. Pine stores new messages in the
    INBOX folder by default, so check the header for the current folder. If that folder
    is INBOX, then the user can go to the Message Index and check for new messages;
    otherwise, it is necessary to change folders to INBOX.


    Select the Folder List from the main menu, and the screen will display a list
    of folders. The newsgroup aspect is set up on Pine, the user may have an additional
    step, to read either news or mail. Choose the INBOX folder, and a list of messages
    will be shown with an N to the left side of the number new, while D stands for
    deleted messages.


    To read a message, highlight the message and press the <ENTER> key. Messages can
    be scrolled using the arrow keys or the <PgUp> and <PgDn> keys. Table 8-7 lists
    some of Pine''s common options.


