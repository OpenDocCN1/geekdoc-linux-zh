- img_proc: true
  md: '# Key Sequences in Command-Line Editing


    One important application of key sequences is command-line editing in a shell.
    They can be very useful for quick navigation and execution of operations. For
    example, suppose a user at a prompt wishes to quickly re-enter the last command
    entered but not want to retype the entire command because of its length. By simply
    pressing <CTRL-P>, the last command entered will be displayed at the prompt. Now
    suppose the user is editing a file and wishes to delete an entire line of text.
    Rather than pressing the backspace or delete key to delete individual character,
    the user can press <CTRL-K> to delete an entire line.


    The shell is compiled with the readline library, which handles all the input editing.
    Some examples of the different kinds of commands are given in Table 4-2.


    | Key Sequence | Action |

    | <CTRL-A> | Moves the cursor to the beginning of the line. |

    | <CTRL-E> | Moves the cursor to the end of the line. |

    | <CTRL-P> | Cycles backward through the command history list. |

    | <CTRL-N> | Cycles forward through the command history list. |

    | <CTRL-D> | Deletes the character where the cursor is present. |

    | <CTRL-K> | Erases (kills) the text from the cursor position to the end of the
    line. |

    | <CTRL-Y> | Pastes the most recently killed text in command line. |

    | <CTRL-X>, <CTRL-R> | Re-reads an initialization file where different key bindings
    are present; after executing the command, the changes in key bindings or the new
    key bindings take effect. |


    Table 4-2. Examples of Different Commands


    The examples given above are just a few of the available commands. Complete listings
    can be found in the man pages for readline and bash.


    # Modifying key binding


    The default key bindings can be changed for individual users by specifying new
    key bindings in ~/.inputrc file. This file overrides the settings in the /etc/inputrc
    file, which is readable for all users. The environment variable $INPUTRC is usually
    set to /etc/inputrc. If it is not set, the default is ~/.inputrc.


    There are two ways of specifying key bindings in the initialization file ~/.inputrc.
    The first way is to use the following syntax:


    ```

    keyname: function-name

    ```


    For the example, Control-x Control-r: re-read-init-file


    would cause the key sequences <CTRL-X> or <CTRL-R> to perform the re-read-init-file
    function.'
  merge: -1
  pgno: 90
- img_proc: true
  md: 'Another syntax is as follows:


    ```

    "keyseq": function-name

    ```


    The entry to use the key sequence [ESC-]-[H] to go to the beginning of a line
    would look like this:


    ```

    \e(h": beginning-of-line

    ```


    The user can also modify the key bindings of the command line editor with the
    bind command. However, bind will only affect the currently running shell. The
    syntax of bind is given below:


    ```

    $ bind [-m keymap] [-lvd] [-q name]

    $ bind [-m keymap] -f filename

    $ bind [-m keymap] keyseq:function-name

    ```


    For example, bind -l lists all the library functions that can be mapped. For further
    details on the usage of bind, see the man pages.


    # Key Mappings


    There are important key sequences in Linux besides those used by command line
    editors. Linux responds to other specific key shortcuts. As described in the Using
    Multiple Terminals section, pressing <CTRL-ALT> and any of the <F1> through <F6>
    keys will navigate a user through virtual terminals. Each function key represents
    a virtual terminal. The <CTRL> key may not be necessary when switching from one
    virtual terminal to another, but it is necessary when switching to a virtual terminal
    from the X terminal.


    X on a virtual terminal, usually represented by <F7>. Therefore, in order to switch
    back to X, use <CTRL-ALT-F7>.


    The <CTRL-ALT-BACKSPACE> key terminates the X-server. However, this is not recommended
    because it will kill all applications without saving work.


    Another important key sequence in Linux is <CTRL-ALT-DEL>. This sequence is usually
    used to perform system shutdown. When this key sequence is pressed, the SIGINT
    signal is sent to the init process. The init process reads the /etc/inittab file
    and runs the process specified in the line containing the CTRL-ALT-DEL action.
    The entry in /etc/inittab file is given below:


    ```

    # Trap CTRL-ALT-DELETE

    ca:ctrlaltdel:/sbin/shutdown -t3 -r now

    ```


    In the above line, the process run for the CTRL-ALT-DEL action is reboot. For
    more information on /etc/inittab, refer to the inittab man pages.


    Although it is not always the case, in many situations the <CTRL> and <ALT> keys
    on the left side of the keyboard are used for shortcuts.


    # Mapping syntax


    The way that the physical keyboard presses are mapped to key sequences is determined
    by defkeymap.map file located in the directory /usr/src/linux/drivers/char. This
    directory contains definitions for key sequences, and the actions that result
    from key sequences.


    ```

    keycode keynumber = keysym

    modifier keycode keynumber = keysym

    ```


    ![](img/b0ea5e4a55ee6767fff087672e71c505_91_0.png)'
  merge: -1
  pgno: 91
- img_proc: true
  md: 'The actual entry in defkeymap.map file for the key sequence to go to the second
    virtual terminal is given below:


    ```

    keycode 60 = F2  Console_14

    control keycode 60 = F2

    alt keycode 60 = Console_2

    control alt keycode 60 = Console_2

    ```


    The number 60 is assigned to <F2>. The number assigned each key can be found by
    running the showkey utility from the virtual terminal and pressing the key for
    which the number is to be found. Since the X Window system has a different key
    map, the use of the <F2> key and its modifiers will be different. The definition
    above work only in a standard terminal.


    In the definition, the key depends on the usage and when the key is pressed or
    alone with a modifier. Modifiers are <CTRL>, <ALT>, and <SHIFT> keys. In the above
    example, the user wishes to move to the second virtual terminal, the keysym pressed
    is Console_2. while the user is in another virtual terminal. There are two entries
    for this action. The first will activate the second virtual terminal, while the
    second will activate the second terminal from X Window and similar applications.


    The entry for the <CTRL-ALT-DEL> sequence is shown below. The modifiers used are
    <CTRL> and <ALT>. The key number of the <DEL> key is 83. The keysym of this key
    when used with is Boot.


    ```

    keycode 83 = KP_Period

    control alt keycode 83 = Boot

    ```


    # Re-mapping sequences to other keys


    If user has necessary permissions, he or can customize the actions performed by
    the key sequences. For example, to allow switching to the second virtual terminal
    with <CTRL-ALT-NUMERIC PAD 2>, the user first has to find the key number of the
    non-modifier key. By running the showkey utility in the virtual terminal and pressing
    the numeric pad 2, the user will find the key number to 80.


    The user then has modify the defkeymap.map file. To be safe, the user can copy
    the default file into new file mymap.map and modify the entry for keycode 80 in
    the new file.


    The entry for keycode 80 before modification is shown below:


    ```

    keycode 80 = KP_2

    alalt keycode 80 = Ascii_2

    altgr keycode 80 = Hex_2

    ```


    The entry after modification would look like this:


    ```

    keycode 80 = KP_2

    alalt keycode 80 = Ascii_2

    altgr keycode 80 = Hex_2

    control alt keycode 80 = console_2

    ```


    Next, the user run the loadkeys command:


    ```

    $ loadkeys /usr/src/linux/drivers/char/mymap.map

    ```


    ![](img/b0ea5e4a55ee6767fff087672e71c505_92_0.png)


    SAIR Linux and GNU Certification -- Fundamentals+/Linux+'
