    |

    | -F [filename] | Opens (filename) in Pine''s message viewer. |

    | -h | Brings the user to a help screen listing common options. |

    | -i | Opens Pine directly in the default folder (INBOX). |

    | -k | Runs commands with the function keys rather than key sequences and single
    key keys. |


    Table 8-7. Common Options in Pine


    # Sendmail


    Sendmail differs from the previous two utilities because it is a mail transport
    agent; therefore, it sends mail and does not read mail. However, Sendmail is quite
    versatile and powerful in its area. Only the most basic functions of this package
    will be explained here.


    # Configuration


    Typically, users will not employ the Sendmail utility directly but will utilize
    it through mailers like Elm. However, having Sendmail properly configured is important
    most distributions of Linux have the system to run Sendmail as the default mail
    daemon.


    The configuration file is usually located in /etc/sendmail.cf. If it is not there,
    use the locate command. Configuring this utility is difficult (books dedicated
    to just this configuration can be a thousand pages (or more)), and new users should
    not attempt it. Incorrectly configuring this file can lead to future complications.
    Most distributions of Linux configure this file for the user, and it probably
    will not be necessary to alter this file unless the user is responsible for a
    system that handles a great deal of mail.


    # Usage


    Sendmail can be used to send mail without the assistance of a user agent. This
    is not a common practice for new users (or any user running a machine for personal
    use), but a situation may arise when it will be helpful know the basic functions
    of the sendmail command. Messages are sent with the following syntax:


    ```

    $ /usr/lib/sendmail [-options] george@lucasarts.com

    ```


    After running this command, sendmail reads everything from standard input as part
    of a message. To indicate an end-of-file, a period is placed on a line by itself.
    sendmail will then send the message.

    Placing a filename after the address will send the text in filename instead of
    reading from standard input.


