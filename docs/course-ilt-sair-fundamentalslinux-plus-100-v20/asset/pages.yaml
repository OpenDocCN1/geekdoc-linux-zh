  md: '# Compiling and Installing the Kernel


    After the configuration is complete, only a few more steps remain. First, the
    command make dep be used to resolve configuration dependencies. Once the dependencies
    have been resolved, the kernel can be compiled. Use the command makeImage to begin
    compiling the kernel. If the module option was used, then the make modules command
    must be used, followed by make modules_install.


    # LILO


    The next step in compiling the kernel is adding a new entry to /etc/lilo.conf
    so the new kernel can be booted. First, move the new kernel:


    ```

    /usr/src/linux/arch/i386/boot/bzImage to /boot/, assuming the user has the x86
    architecture. Next, edit /etc/lilo.conf and add a new stanza for the new kernel.
    It should look like the example:


    image=/boot/bzImage

    label=test

    root=/dev/hda

    ```


    After editing /etc/lilo.conf, run /sbin/lilo to activate the changes in the configuration
    file. Next, reboot the machine, and at the LILO prompt, boot the new kernel to
    test.


    # Kernel Package


    It should be noted that Debian provides a tool called kernel-package to automate
    all this work. After configuring the kernel, the user simply executes the following
    two commands:


    ```

    $ make-kpkg clean

    $ make-kpkg --revision REVISION

    ```


    REVISION should be replaced with a version number chosen by the user. The recommended
    scheme is 9:hostname.build. The 9 prevents the Debian package manager from replacing
    the kernel with a generic one. For example, if a user builds the fourth kernel
    for a computer named trantor he should use 9:trantor.4 for REVISION.


    This generates a Debian package in /usr/src, which is installed like any other
    package. Installing this package will install the new kernel and its modules,
    as well as configure LILO to boot the new kernel. The system should have rebooted.


    # Modules


    # Loading modules


    If any modules were created, they can be installed after rebooting. To install
    a module, the command insmod, followed by the absolute path name of the module''s
    object file. In most cases, this will be in a subdirectory of /lib/modules/x.x.xx.
    For example:


    ```

    $ insmod /lib/modules/2.2.16/net/3c501.0

    ```


    Also, another method for loading modules is called modprobe. This program will
    try to load the module user indicates. If it fails because dependencies (the module
    need other modules loaded before it can load), then it will proceed to load those
    modules as well.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_297_0.png)'
  merge: -1
  pgno: 297
- img_proc: true
  md: '# Removing modules


    If there is a problem with any modules the user might have installed, find out
    the what modules are loaded by typing the lsmod command. To remove a module that
    would be causing problems, type the following command:


    ```

    $ rmmod 3e501

    ```


    The .o after the module is not required, because this is the name of the loaded
    module, not the file from which it was loaded.'
