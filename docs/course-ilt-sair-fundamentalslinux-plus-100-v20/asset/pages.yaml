  md: '# IDE


    To use an IDE hard drive (or one of its variants), the hard drive is connected
    to the motherboard with a data ribbon cable. This data ribbon cable is called
    an IDE channel, and the channel allows the transfer of information between the
    CPU and the hard drive. The channel can actually communicate with devices other
    than hard drives, but that is beyond the scope of this discussion. It also allows
    for implementations other than IDE, but IDE (or one of its variants) is the most
    commonly used. Some channels have only one connection for a hard drive, others
    have two connections for hard drives. In either case, if a single hard drive is
    connected to the ribbon cable, the hard drive is known as the master drive and
    must be configured as such.


    If a ribbon cable has a single hard drive attached to it, it should be attached
    to the end connection. Then to configure a hard drive as a master, the jumpers
    must be set. Normally these can be found on the back of each hard drive. The jumpers
    can be either as master or Cable Select (CS). If the ribbon cable has two hard
    drives attached to it, one must be configured as the master, and the other as
    the slave. Alternatively, both sets of jumpers may be configured as CS, but this
    is not recommended.


    Most computers now support two IDE channels on the motherboard. One is the primary
    IDE channel, the other is the secondary. As noted earlier, each channel can support
    two devices, for a total of four devices. Each channel uses one interrupt and
    a base address. While interrupts may vary between different computers, the most
    common interrupt for the primary IDE channel is 14 and 15 is the most common for
    the secondary channel. The primary channel uses a base address of 03F6h and the
    secondary channel uses 0376h.'
