  md: "# # Setting Up Devices\n\n+   * Types of Device Files\n  * Character devices\n\
    \  * Block devices\n* Plug-n-Play Devices\n* Loadable Modules\n  * Commands for\
    \ configuring modules\n* Obtaining Information\n\n# # SETTING UP DEVICES\n\nThis\
    \ section will cover the specifics for configuring devices under Linux. It is\
    \ necessary that the user have an understanding of the process of configuring\
    \ and compiling a custom kernel before reading this section.\n\nDevices are presented\
    \ to the system as files in /dev. These behave as if they are normal files, except\
    \ that the contents that a program might read or write are not contained on a\
    \ disk. Instead, they come from a device driver. Usually, the superuser has permission\
    \ to access devices in this raw form; users must have specialized software.\n\n\
    # ## Types of Device Files\n\nAll devices in /dev are either block or character\
    \ devices. Linux does have a third type of device, network devices, but these\
    \ are not mapped to files in /dev and, therefore, will not be covered.\n\n# ##\
    \ Character devices\n\nA character device is capable of having single characters\
    \ read from or written to it. It behaves just like a file but usually can only\
    \ be accessed sequentially.\n\n# ## Block devices\n\nA block device is one capable\
    \ of hosting a file system. It can usually be accessed in multiples of 1 kilobytes,\
    \ though the kernel hides this from the user and allows the corresponding device\
    \ file to be accessed one character at a time."
  merge: -1
