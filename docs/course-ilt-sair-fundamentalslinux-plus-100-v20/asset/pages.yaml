    | Factory Support | The installation of host adapter is usually required. However,
    many high end systems support SCSI out of the box. | Supported by every BIOS and
    System Board manufacturer.|


    Table 10-5. SCSI vs. IDE/ATA


    As shown, there are other reasons than speed to use SCSI. A computer with SCSI
    can accommodate many more devices. SCSI can support much larger drives than the
    current IDE/ATA specification to support. Also, the largest capacities are almost
    always SCSI, that is, at any time, the largest SCSI drive on the market has more
    space than the largest IDE/ATA drive (the largest SCSI drive is 181.6 GB and the
    largest IDE/ATA drive is 100 GB.


    # Different Types of SCSI


    There have been many improvements to SCSI since the SCSI-1 standard was introduced.
    SCSI-2 introduced support for several optional enhancements including support
    for data transfers (16 bits wide instead of the normal 8 bits) using multiple
    cables and Fast SCSI-2 which doubles the clockrate of the bus from 5 Mhz to 10
    MHz. At the same time, SCSI-2 contains a great deal of backward compatibility
    with older SCSI devices. Recently, devices have been implementing enhancements
    of SCSI-3. Since SCSI has grown so much over the years, a single specification
    will not be released for SCSI-3. Internal several documents have been released
    that deal with specific aspects of SCSI. SCSI-3/SPI, SCSI-3/SPI-2, and SCSI-3/SPI-3
    are the current documents that have been finalized for the SCSI-3 standard. The
    latest SCSI devices, Ultra 160+ SCSI, operate over a 40 Mhz bus that has a maximum
    throughput of 160 MB/s and conform to the SPI-3 standard. The soon to be released
    SPI-4 standard will introduce Ultra320 SCSI with a bus throughput of 320 MB/s.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_326_0.png)


    SAIR Linux and GNU Certification -- Fundamentals/Linux'
