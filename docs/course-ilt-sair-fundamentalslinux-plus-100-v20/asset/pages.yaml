  md: 'Today it is rare to find a computer display with less than VGA, mainly because
    VGA adapters are very inexpensive. In fact, the majority of computer software
    developers (SVGA) assume that most computers can display in Super Video Graphics
    Array (SVGA). There are many variations of VGA and SVGA, but VESA introduced a
    SVGA standard that most manufacturers rapidly adopted. Available in Version 2.0,
    the VESA BIOS Extension, or VBE 2.0, can be implemented in either hardware or
    software and offers compatibility between hardware and software without the user
    worrying or knowing about compatibility issues.


    | Graphics Standards | Description |

    | Monochrome Display Adapters (MDA) | Green or white text on a black background
    |

    | Hercules Graphics Card (HGC) | Four color display |

    | Color Graphics Adapter (CGA) | Eight color display |

    | Enhanced Graphics Adapter (EGA) | 16 color display |

    | Video Graphics Adapter (VGA) | 256 color display at 320x200 resolution (16 at
    640x480) |

    | Super Video Graphics Array (SVGA) | Up to 16.8 million colors and 1280x1024
    resolution capability |

    | Extended Video Graphics Adapter (SVGA) | Up to 18.8 million colors and 1600x1200
    resolution capability |


    Table 10-11. Graphic Adapter Standards


    # Graphics adapter components


    The reason that graphics adapters have been able to achieve greater resolutions
    and higher color capabilities is the improved technology in their components.
    Originally, the graphics adapter relied on the computer''s Central Processing
    Unit (CPU) to process its output. Today, graphics adapters have their own processor
    performing the task, greatly reducing CPU load and increasing processing speed.
    In addition, graphics adapters used their own RAM, and the ways graphics adapters
    are connected to the motherboard developed over time, improving communication
    between the adapter and the rest of the system. Other innovations contribute to
    the increased performance of current graphics adapters as well, but many of them
    are specific to individual manufacturers or adapters.


    # Bus connection


    The bus is responsible for physically connecting devices to the system''s motherboard
    and consists of the data and address buses. Below is a table listing various types
    of computer buses, some of which have now become obsolete.


    | Bus Type | Features |

    | ISA/EISA (Industry Standard Architecture/Extended Industry Standard Architecture)
    | Standard for Intel architectures; inexpensive; poor performance on newer systems;
    considered mostly obsolete. |

    | VLB (Video Local Bus) | Used in 1486s; throughput up to 132MB/sec on 1486s;
    considered mostly obsolete. |

    | PCI (Peripheral Component Interconnect) | Standard for Pentium and Pentium Pro;
    compatible with most video cards. |

    | AGP (Accelerated Graphics Port) | For use with Pentium and III; 32-bit bus designed
    for 3-graphics. |


    Table 10-12. Bus Types and Features


    ![](img/b0ea5e4a55ee6767fff087672e71c505_340_0.png)


    SAIR Linux and GNU Certification — Fundamentals/Linux+'
