  md: '# 3-14 Module 3 — Installation


    # Boot Loaders


    +   * LILO

    * Allows user to choose which kernel or system to boot

    * Based on labels in lilo.conf file


    +   * loadlin

    * Boots Linux from DOS rather than during system boot

    * Excellent for laptop of hard drive that LILO cannot access


    # BOOT LOADERS


    A boot loader, sometimes called a bootstrap loader, is a software program that
    directs the boot process of a system. During startup, most computers utilize a
    similar method of initialization. When the power is turned on, the CPU begins
    looking to system ROM for instructions regarding what to do next. Generally these
    systems contain information for starting hardware and information telling the
    software located on the hardware to take over the boot process. At this point
    a system looks for boot information on floppy drives, hard drives, and other bootable
    devices. Usually floppy drives are checked first so that the system may be initialized
    from one of these locations in the event of a hard drive failure. The software
    that is found and initialized on this hardware is the boot loader. The MBR (Master
    Boot Record) of a hard disk is where the boot loader program is usually stored.
    It is the boot loader that initializes an operating system as Linux or DOS.


    Just as DOS uses the master boot program for initialization, Linux systems use
    programs such as Linux Loader (LILO) and loadlin.exe.


    # LILO


    Once the MBR is accessed, a primary boot program is loaded, which loads a secondary
    program that initializes the operating system kernel. The essential purpose of
    LILO is to allow a user to choose which Linux kernel or other operating system
    to boot. This is done by giving the user a boot prompt at which the user can specify
    the desired operating system based on labels defined in the lilo.conf file. A
    list of available options can be obtained by pressing <TAB> at the LILO prompt.


    The lilo.conf file is the configuration file for LILO. By default this file is
    located in the /etc/directory. The functions of LILO can be customized by editing
    this file. Table 3-2 illustrates a few sample entries from the lilo.conf file
    and the functions they execute:'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# Boot Loaders 3-15


    | lilo.conf entry | Function |

    |---|---|

    | boot=/dev/hda | Specifies the boot sector as /dev/hda |

    | prompt | Invokes boot prompt |

    | delay=150 | Sats a delay of 15 seconds before automatically booting the first
    entry in the list of kernels |

    | VGA=normal | Specifies which mode will be used |

    | message=/boot/boot.message | Specifies the location of the text file to display
    prior to the prompt |

    | default=linux | Specifies which kernel or operating system to boot; if not given,
    the first entry will boot by default: |

    | image=/boot/vmlinuz | The first kernel entry and the entry that will be automatically
    unless otherwise specified at the prompt; the label field specifies the prompt
    command to initialize this kernel |

    | label=linux | |

    | image=/boot/vmlinuz-2.14-5-0 | Specifies the secondary kernel; the label field
    specifies the prompt command for invoking it |

    | label=linux2 | |

    | other=/dev/hda | Invokes another operating system as DOS; table indicates which
    partition to use; label indicates the prompt command |

    | label=dos | |


    # Table 3-2. LILO Sample Entries


    Up to 16 kernels can be listed in the lilo.conf file. Any operating system other
    than Linux is listed, it must be done using the format in the last row of the
    preceding table.


    Whenever changes are made to a kernel, lilo must be run to ensure that the system
    will boot. Lilo must be run, if there are changes to lilo.conf. This is because
    each time lilo runs, a map file is created to let you know where the kernel and
    other files are located. If this map is not recreated after a kernel is rebuilt,
    the system will not boot in the future.


    # loadlin


    Because it boots Linux from DOS rather than the system boot, loadlin, or loadlin.exe,
    functions differently than LILO. Loadlin is an excellent alternative when using
    a laptop or a hard drive that LILO cannot access. The downside of using it is
    that once the Linux kernel has been loaded, a user cannot go back to the operating
    system, because it would require a reboot.


    To use loadlin, simply place the file in the DOS partition. Ensure that the file
    is placed in a directory that is listed in the DOS path. The Linux kernel should
    also be placed in its own directory. Then, assuming the kernel is located in c:\prompt
    the kernel is named vuz and the Linux partition is in /dev/hda2, start loadlin
    at DOS prompt using the following syntax:


    ```

    load c:\linux\vmlinuz root=/dev/hda2 ro

    ```


    This command should run in DOS mode rather than starting from the Windows environment.
    Subsequently, this command will begin booting Linux.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_62_0.png)


    SAIR Linux and GNU Certification -- Fundamentals+'
  merge: -1
  pgno: 62
- img_proc: true
  md: '# Module 3 — Installation


    # Dual Boot Configurations


    +   * Installing to a Separate Hard Disk

    * Easiest method, not necessarily cost efficient

    * Installing to the Same Hard Disk

    * Must be enough disk space to accommodate both systems

    * Two ways to install Linux on same partition with another OS

    * Making a System Multibootable


    # DUAL BOOT CONFIGURATIONS


    For those upgrading to Linux, it is not necessary to completely erase the previous
    operating system for Linux installation. It is possible to configure the system
    so that multiple operating systems can be used on the same computer. There are
    two ways to achieve this: Linux either be installed on a secondary hard drive,
    or it can be installed on the same hard drive as the pre-installed operating system.


    # Installing to a Separate Hard Disk


    The easiest way to install a dual boot system is to install Linux on a separate
    hard disk. This type of installation, while easier, is not as cost efficient.
    Sometimes it requires a second hard drive to be purchased, however if a hard disk
    is readily available, this method is best.


    After properly installing the new hard disk, insert the Linux disk and proceed
    as in any normal Linux installation. When prompted for the destination for Linux,
    select the new hard disk (such as hda or hdb). Continue installing LILO normally
    until the LILO configuration appears. It is necessary to configure LILO to the
    specifications of the other operating system. At this point, know what the other
    operating system is and on which hard drive it can be located. It must be installed
    to the proper location. If LILO is to be used as the boot loader for the entire
    system, it should be installed to the MBR of the first hard booting disk. The
    best way to accomplish this is to install Linux on the first drive and continue
    installing LILO to the MBR of that drive. In a case where Linux is installed to
    the secondary booting disk, LILO can safely be installed to the MBR of that.


    # Installing to the Same Hard Disk


    When a hard disk is not available, Linux can be installed on the same hard disk
    as the original operating system. When performing this type of installation, it
    is important that there is enough disk space to accommodate both operating systems.'
  merge: -1
  pgno: 63
- img_proc: true
  md: 'There are basically two ways to install Linux on the same partition as another
    operating system. Both require making a second primary partition on the hard disk.
    The first solution is to back up all data on the hard and repartition the disk
    to create the proper number of disk partitions. The swap partition can be created
    at this point or during installation itself. After partitioning, the other operating
    system should be re-installed and the backup data restored.


    To repartition the hard disk without having to re-install the original operating
    system use a partition resizing utility. Most distributions now come with a utility
    known as FIPS, which will create new partitions from the unused space in another
    partition. A commercially available program, such as Partition Magic, can be used
    for the same purpose. Using a partition resizer is not entirely without risk;
    therefore, all data on the existing partition should be backed up. After backing
    up the partition, a defragmentation utility should be run to consolidate all data
    to the beginning of the drive. After defragmenting, run the partition resizing
    utility according to the instructions to create the proper number of partitions.
    The swap partition can either be created now or during the installation process.


    Once the partitions have been created, continue the Linux installation process.
    When prompted for the destination, install Linux to the newly created partition.
    Continue with the installation normally, and if applicable, use the install program
    to configure LILO for multiple operating systems. When using only one hard disk,
    LILO should be installed to the MBR unless another boot loader is used.


    # Making a System Multibootable


    Consider a situation where the user needs to make a dual-boot system. The system
    currently has Windows installed on a single FAT32 partition occupying the hard
    disk. The first step is to divide the hard disk into two or more partitions.


    Before repartitioning a disk all data on the disk must be moved to the start of
    the partition. This is accomplished with the Windows Disk Defragmenter, which
    may require that Windows ScanDisk be run first.


    Resizing a partition can easily be done with commercial software such as Partition
    Magic, but there is also a free program, fips, which is available at www.igd.flg.de/~aschafe/fips/.
    It does not have a GUI like the commercial programs, but it is not difficult to
    use.


    > NOTE: fips only splits the partition in two; it cannot create multiple partitions.
    For this, use fdisk or cfdisk.


    Suppose the user wants the following partitions:


    +   1. Windows bootable partition in 0-511 cylinders.

    2. This partition must be one of the file systems supported by Windows. FAT32
    will be used for this example.

    3. Linux bootable partition in 512-1000 cylinders.

    4. This must be one of the file systems supported by Linux. Ext2 will be used
    by this partition.

    5. 64M Linux swap partition in 1001-1009 cylinders.

    6. This must have a file system supported by the operating system using it.

    7. Partition for home directories in 1010-2048 - cylinders.


    Now using fdisk or cfdisk, the user checks and modifies the number of partitions.
    The hard disk has only two partitions, created by fips. The second partition must
    be deleted and then partitions for Linux are created. For more information about
    fdisk or cfdisk, see their respective man pages.


