  md: '# Presentation layer


    The presentation layer takes a message to be presented to the application layer
    and puts it in proper format according to the contents of the message.


    # Application layer


    The application layer acts as an interface between the applications and the user.


    # TCP/IP model


    The TCP/IP Model has four layers.


    # Network access layer


    The network access layer is the layer responsible for the movement of data over
    the physical link of the network; it provides a reliable transmission of data.
    This layer acts as a connection medium, and its protocols are Ethernet, FDDI,
    Token Ring, X.25, ATM etc.


    # Internet layer


    The function of the Internet is to transmit data across different networks. This
    layer is responsible for taking data from the transport layer of the sending host
    and sending it to the transport layer of the receiving host. In the network layer,
    the transmission of packets is unreliable, and may not arrive in order which they
    were sent. The upper layers arrange the packets in the correct order. The protocols
    in this layer include IP, ICMP, ARP, and RARP.


    # Transport layer


    The function of this layer is same as the OSI transport layer. It provides end-to-end
    communication services for both connection-oriented and connectionless networks.
    The most commonly used protocols in this layer are TCP and UDP.


    # Application layer


    The application layer in the TCP/IP model does the job of the presentation, session,
    and application layers of the OSI model. The application layer acts as an interface
    between the applications on the host machine and the user.


    # Internet Layer Protocols


    The delivery of data, along with its layout, is controlled by specific protocols.
    Each protocol performs its explicit task, it passes the data to the next for further
    processing. Each protocol is independent of the others. Any data that is sent
    through the Internet follows the steps below, including e-mail, Web sites, pictures,
    and files.


    # Internet Protocol


    Internet Protocol (IP) is a connectionless protocol used to transmit data from
    one host to another across networks that are not directly connected. IP transmits
    data in packets datagrams; each datagram is transmitted separately and can sent
    along different routes. Therefore, datagrams may not arrive in the same sequence
    at the receiving end and may be duplicated. IP is unreliable because it does not
    keep track of the route or rearrange the packets in proper sequence when they
    are received. The most commonly used version of IP is Internet Protocol Version
    4 (IPv4). The latest version is IPv6, which contains many improvements over IPv4,
    such as support for larger IP addresses.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_235_0.png)'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# Internet Control Message Protocol


    Internet Control Message Protocol (ICMP) is mainly used to overcome IP''s unreliability
    by sending messages regarding the status of the IP connection. There are two basic
    types of ICMP messages: error messages and query messages. Error messages are
    sent when there is a problem with the connection, such as a dropped datagram.
    Query messages, like ICMP echo, are used to determine the status of another machine.


    # Address Resolution Protocol


    Every message on a network has a hardware address associated with it. This address
    cannot be used for sending data because the data link layer does not recognize
    it. Data is therefore transmitted using IP addresses. Address Resolution Protocol
    (ARP) associates the IP address with the physical address of the machine.


    # Reverse Address Resolution Protocol


    Reverse Address Resolution Protocol (RARP) is used to find out the IP address
    of a machine when its physical address is known. The IP address of a machine is
    generally stored in its local disk, in a diskless workstation, there is no such
    facility. In such cases, RARP can be used to find the IP address.


    # Transport Layer Protocols


    The protocols in the transport layer are primarily concerned with sending data
    from one host to another. The two protocols in this layer are the Transmission
    Control Protocol and the User Datagram Protocol. Although both have the same responsibility,
    they perform their duties in different ways.


    # Transmission Control Protocol


    Transmission Control Protocol (TCP) is a reliable, connection-oriented protocol
    used to transmit messages from one host to another across the network. It breaks
    the packet down into smaller fragments and associates each fragment with a number.
    At the destination, TCP rearranges the fragments of the packet according to the
    numbers associated them to maintain a continuous flow of data. TCP keeps track
    of the packets it is sending, and if a packet is lost, it is retransmitted. TCP
    can also send in both directions, which is called duplex operation.


    # User Datagram Protocol


    Unlike TCP, the User Datagram Protocol (UDP) is an unreliable, connectionless
    protocol. UDP does not fragment data before transmitting it. Therefore, a continuous
    flow of data is not guaranteed at the receiving end. The advantage of UDP is that
    it transmits data faster than TCP; if the network is not congested. It has less
    network overhead because it does not keep track of the packets it is sending.


    # Application Layer Protocols


    The protocols in the application layer are responsible for getting data to a program
    running on one of the hosts. Some of the important Application Protocols are:


    # Hypertext Transfer Protocol


    Hypertext Transfer Protocol (HTTP) is a stateless protocol. It is used by Web
    browsers to exchange data over the World Wide Web. Using HTTP, data such as text,
    voice, and images can be exchanged.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_236_0.png)


    SAIR Linux and GNU Certification -- Fundamentals/Linux'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# Simple Mail Transfer Protocol


    Simple Mail Transfer Protocol (SMTP) is a protocol used to send and retrieve e-mail
    over the Internet. When a mail request comes to SMTP, it sets up a connection
    with the receiving SMTP. If it can receive the mail, the mail request is sent.
    SMTP can also be used to send a single message to multiple recipients and to recipients
    on networks that are not connected to the Internet.


    # File Transfer Protocol


    As its name suggests, File Transfer Protocol (FTP) is used to transfer files across
    a network. After performing authentication, users may then copy files across the
    network. For efficiency, FTP uses two separate connections: one for control and
    one for data transfer.


    # Telnet


    The telnet protocol is used to perform remote logins from another computer. To
    use telnet, a valid user ID must exist on the remote computer for the user. After
    authenticating the user, telnet allows access to the system as if the user were
    logged locally.'
  merge: -1
