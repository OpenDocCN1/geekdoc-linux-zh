  md: '# USB peripherals and bus


    Universal Serial Bus is an external bus that supports data transfer rates of 12
    Mbps (12 million bits per second). A single USB port can be used to connect up
    to 12 peripheral devices with the use of USB hubs. USB also supports Plug-and-Play
    installation and hot plugging. In 1996, a few computer manufacturers started USB
    support in their new machines, but it was two years later that the iMac popularized
    technology.


    In 1996, a few computer manufacturers started USB support in their new machines.
    It was not until the release of the best-selling iMac in 1998 that USB became
    widespread. It is expected to completely replace serial and parallel ports


    # IEEE 1284


    IEEE 1284 defines a standard signaling method, physical specifications, and electrical
    specifications for a Bidirectional Parallel Peripheral Interface. The standard
    provides for high speed bi-directional communication between PCs and external
    peripherals that can communicate 50 to 100 times faster than the original parallel
    port technology. It is fully backward compatible with all existing parallel port
    peripherals and printers.


    The IEEE 1284 defines 5 modes of data transfer. Each mode provide a method of
    transferring data in either the forward direction, reverse direction or bi-directional
    transfer (half duplex). The defined modes of transfer are:


    +   - Compatibility Mode (forward direction) is the standard mode of communication.

    - Nibble Mode provides for 4 bits at a time using status lines for data. Hewlett
    Packard-ronics (reverse direction only).

    - Byte Mode provides for 8 bits at a time using data lines, referred to as a bi-directional
    port (reverse direction).

    - EPP (Enhanced Parallel Port) is used primarily by non-printer peripherals, CD
    ROM, tape, hard drive, network adapters, etc. (Bi-directional)

    - ECP (Extended Capability Port) is used primarily by new generation of printers
    and scanners (Bi-directional)


    # IEEE 1394


    IEEE 1394 defines a High Performance Serial Bus suitable for transmitting digital-multimedia
    signals. Early serial communications required to undergo several analog to digital
    and digital to analog conversions. Each analog to digital conversion degraded
    quality. It determined that the transmitted signal must remain digital on the
    transfer cable. This is how the IEEE1394 standard was developed. The IEEE 1394
    standard is also called FireWire. The main features of the FireWire standard are:


    +   - It is a low-cost cross-platform solution for transporting all types of data
    digital

    - Easy-to-use cables and connectors allow users to attach or remove devices at
    any time

    - 100 Mbps (Million bits per second) data transfer speeds are available today.
    Gigabit speeds (1 Gbps = 1000 Mbps) and beyond are already sweeping in the creation
    process.

    - Asynchronous data transport provides connectivity to legacy technology, such
    as printers and modems, and provides command and control for new devices

    - Isochronous transport delivers time-critical multimedia data signals


    ![](img/b0ea5e4a55ee6767fff087672e71c505_356_0.png)


    SAIR Linux and GNU Certification -- Fundamentals/Linux+'
  merge: -1
