  md: '# 3-4 Module 3 — Installation


    +   * Developer

    * Server

    * Full Install

    * Custom Install


    # Text mode install


    While some say that a text mode install is not necessary due to the availability
    of GUI options, this is not necessarily true. Text mode install is vital for those
    times when you are not going to install any graphical environment (servers, appliances,
    firewalls, routers etc.) While not the preferred method for inexperienced users,
    text mode install is fine for most users, typically allowing similar functionality
    to the GUI mode install.


    A advantage of the text mode install is the ability to configure Linux on a computer
    that has an unsupported video card or has trouble loading the X interface necessary
    for the GUI Install.


    # What to Install


    If users need special sets of packages, or have a specific task for which they
    are installing, the Custom installation option (or the equivalent) for that distribution.
    This will allow users to exercise exquisite control over every package, and in
    some distributions (Debian, for example), users can choose individual files in
    packages.


    # Compilers


    If a user plans to install a large amount of software from the source code, or
    he or she will need to install the appropriate compilers. For C, g++ and Gnat
    for Ada, Interpreters, as Perl for Perl, Python, and Guide for Scheme, would be
    needed. In addition to compilers and interpreters, various development tools and
    libraries need to be included. To ease disk usage by individuals who will not
    be using development tools, libraries are split into two or more packages. The
    packages are usually separated into a package for the binary-shared library required
    to run linked programs, a package for the files necessary to compile a program
    with this library, and a package for documentation on how to use the library.


    # Servers


    If a user plans to have a system operate as a functional server, he or she will
    need to install the appropriate file server, mail or Web server applications.
    NFS would need to be installed on the server for NFS clients. To set up a mail
    server, a user would need to install a mail transfer agent (MTA), a mail delivery
    agent (MDA), and a mail daemon. Popular MTAs include Postfix, Qmail, and Exim.
    Some examples of MDAs are Maildrop and Procmail. Two examples of excellent mail
    access daemons are cyrus-imap and cyrus-POP3. For Web servers, Apache is the most
    popular and functional application currently available.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_51_0.png)'
