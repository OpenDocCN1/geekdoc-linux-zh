  md: '# Monitor resolution


    Resolution refers to how sharp and clear a picture appears. As explained earlier,
    it can be assumed that a monitor with a resolution of 800x600 will look better
    than a resolution of 640x480, because there are more pixels to render finer details
    of the image being displayed. In addition to the number of pixels, the dot pitch,
    or stripe pitch, and the refresh rate of the monitor play important roles in determining
    the resolution of it.


    # Dot pitch and stripe pitch


    CRT monitors are sometimes called RGB monitors, because they use an electron gun
    to project red, green and blue phosphors onto the screen. Between the electron
    gun and the screen is either a shadow mask that contains tiny holes, or an aperture
    grill, that is composed of very thin vertical strips of metal. The distance between
    the dots or stripes that contain the same color is called the pitch. A monitor
    with a dot pitch of .24 will have a finer image quality than a monitor with a
    dot pitch of .31. A smaller dot pitch makes it possible to set the viewing area
    to a higher resolution, because more dots can fit into an inch of space (dots
    per inch, or dpi).


    # Refresh rates


    A monitor''s refresh rate is determined by the number of times the electron gun
    redraws the screen and is measured in Hertz, a unit of frequency equal to one
    cycle per second. In general terms, the screen resolution increases, the electron
    gun works harder, the Hertz value decreases, and there are slower screen refreshes.
    The obvious conclusion is that for monitors to change resolutions, they must have
    a variable Hertz rate. Monitors with a variable Hertz rates, called multisync
    monitors, are the standard today. Most manufacturers print the variable Hertz
    rates on the back of their monitors. When configuring your computer system, you
    must know the specifications of both your video adapter and your monitor so they
    can work together. It is very important to match the video card settings to the
    Hertz specifications of your monitor. Choosing a setting higher than the specifications
    of the monitor may cause the display not to work, or even worse, permanently damage
    the monitor.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_342_0.png)'
