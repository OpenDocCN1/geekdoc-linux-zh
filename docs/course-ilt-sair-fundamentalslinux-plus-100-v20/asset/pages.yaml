  md: '# Module 9 — Troubleshooting


    Simply ignoring a problem, will not make it go away. Core dumps are of indicating
    problems, they should not be ignored altogether. One should carefully review the
    system to find out from where the dumps are coming and how they can be stopped.
    If one cannot find a source, the problem should be reported to the software or
    hardware vendor or to the system administrator. The core dump should be saved
    and forwarded as well, so that it can be examined by these authorities.


    # Process Control


    When a program seems to be producing problems, or if resources seem to have diminished,
    a user may need information on what programs are running and what they are doing.
    In some cases, processes will need to be stopped or restarted. In order to determine
    what programs are doing and gather information on these processes, as PID numbers,
    users can use either the top utility or the ps utility.


    # The top command


    The top utility provides a self-updating list of running processes in descending
    order, starting with the processes which are using the most system resources.
    The output of top looks like the following:


    ```

