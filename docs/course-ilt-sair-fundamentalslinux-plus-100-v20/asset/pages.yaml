  md: '# Example 3 - It is the routing.


    If the routing on a Linux machine is incorrectly configured, a host may not be
    able to connect with computers on the local network or outside of the network.
    The simplest way to check the current routing table is to enter route at the command
    prompt. This will display the routing table. The route to the loopback interface
    (interfaces are listed under Interface) should be configured with the destination
    127.0.0.0, and the Ethernet interface should be configured with the address 192.168.1.0.
    If either of these destinations is missing, entering


    ```

    $ route add -net address

    ```


    at the command prompt will add them. If a route is configured incorrectly, remove
    it by typing


    ```

    $ route del address

    ```


    at the prompt, and then read it using the route add command. To check that the
    adapter has been configured correctly, ping the loopback address (127.0.0.1).
    If there is a response, the Ethernet adapter is in order.'
