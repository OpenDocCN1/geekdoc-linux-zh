  md: '# PC Card


    The Personal Computer Memory Card International Association (PCMCIA) designated
    a standard for expansion slots. They are commonly grouped under a generic title
    PC Cards, which include extensions as modems, network cards, storage interfaces
    and video cards. PC Cards are most commonly used in laptops, palmktops, and PDAs,
    but new devices using the PCMCIA standards are constantly developing.


    # Overview


    In general application, PC Cards are designed to provide enhancement for the existing
    system performance of a particular device. Their convenience is in their capability
    to provide enhancements and features while the system is running (PnP capability),
    whereas other types of upgrade components require the system to be rebooted in
    order for changes to effect.


    # Types and devices


    The PC Card comes in three types: Type I, Type II, and Type III. Type I cards
    are about 3mm in thickness and are seldom used. Type II cards measure about 5mm
    in thickness and are commonly used to support devices, local area networks (LANs),
    or Type II devices. Type III cards consist of two Type II slots, and can be used
    to support Type II devices or Type III device. Type III cards measure a little
    over 1cm in thickness, and are designed to accommodate devices as hard disks.


    | Card Type | Device(s) Supported |

    | --- | --- |

    | Type I | Flash, Static RAM, and other memory-related devices. |

    | Type II | Serial and parallel devices, LANs, fax-modems, Ethernet cards, etc.
    |

    | Type III | Hard disks, USB connections, digital devices, etc. |


    Table 10-13. PCMCIA Types and Supported Devices


    # CardBus


    To make working with PC Cards even easier, the developers have come up with an
    add-in platform called the CardBus. This platform provides a facilitated access
    for adding PC Cards without having extensive outside cabling. The mechanism is
    designed to not only make life easier in terms of accessibility, but also in terms
    of power economy, as it needs a substantially low amount of voltage (approximately
    3V).


    # Pointing Devices


    Pointing devices are secondary input devices that enable the user to interact
    with data directly on the screen. Typically, these will include devices such as
    a mouse, optical pens, trackball pointers, and in some instances, even a joystick-style
    pointer.


    The different types of pointing devices come in a wide variety of shapes, sizes,
    and purposes. Specifically shaped mice are produced to accommodate a vast range
    of professional needs, from basic computer use to architecture and engineering.
    These devices are equipped with a variety of features that make them more helpful
    and convenient to use.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_344_0.png)


    SAIR Linux and GNU Certification -- Fundamentals/Linux/'
