  md: "# Defining Linux\n\n+   - Unix Influences\n  - Most of the standard features\
    \ available in Unix\n- Multi-User and Multitasking\n  - Many users can log on\
    \ to a single Linux system\n- POSIX.1 – Compliant\n  - Portable Operating System\
    \ Interface for Computer Environment\n- Free Software\n  - Can be downloaded from\
    \ the Internet\n  - Governed by GPL\n\n![](img/b0ea5e4a55ee6767fff087672e71c505_11_0.png)\n\
    \n# DEFINING LINUX\n\nLinux is a free, Unix-like, multi-user, multitasking, POSIX.1-compliant\
    \ operating system (OS). An operating system essentially revolves around a basic\
    \ piece of software called a kernel. A kernel manages the basic operations of\
    \ a computer and provides an interface between application programs and hardware.\
    \ With the recent surge in operating system development by commercial vendors,\
    \ the definition of an operating system has to encompass the concept of a number\
    \ of applications bundled with a kernel. As an operating system, Linux falls under\
    \ both definitions.\n\nThe Linux system was originally designed to work on Intel-based\
    \ systems and was developed for classroom machines with 386 architecture. Linux\
    \ is work on a 32-bit and a 64-bit, preemptive, multitasking operating system.\
    \ Today it can be found on a wide variety of computers and even on some types\
    \ of super-computing systems. It can run database servers, mail servers, and many\
    \ other applications.\n\n# Unix Influences\n\nLinux is described as Unix-like\
    \ because it has most of the standard features that are available in Unix. All\
    \ of the powerful features that characterize Unix-- such as multitasking, multi-user\
    \ capabilities, virtual memory, shared libraries, TCP/IP and networking-- are\
    \ also present in Unix. Additionally, Linux has many utilities and applications\
    \ such as shells, editors, and compiler, while whose concepts are borrowed from\
    \ Unix.\n\n# Multi-User and Multitasking\n\nAs a Unix-like operating system, Linux\
    \ supports multiple users. These users may log on to a single Linux system simultaneously.\
    \ Multiple users may also log on a Linux application server and run applications\
    \ from the server. A detailed description of the multi-user abilities of Linux\
    \ will be given later in this manual."
  merge: -1
