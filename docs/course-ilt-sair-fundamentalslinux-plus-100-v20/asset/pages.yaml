  md: '# External Storage


    External storage devices are no different from internal storage devices, except
    that they are peripherals. They provide the same data storage capabilities and
    disadvantages as internal storage devices. However, external storage storage devices
    provide more advantages than internal storage devices. By being peripherals, they
    can be connected through the following interfaces:


    +   * USB

    * FireWire

    * Parallel cable

    * Serial cable

    * SCSI cable

    * Wireless data link


    This means that these storage devices are portable work station or from geographical
    location to geographical location and that transfer rates are limited by the connection
    interface as well as the device. In some cases this yields transfer rates greater
    or slower than the transfer rates that would be if the device was connected internally.'
