  md: '5 - X11


    6 - Reboot


    # Graphical Login


    The default run level for most systems will be 3. This takes the user to the terminal
    screen, where he or she can

    log in usual. Another popular run level is 5. If the run level is set to 5, the
    computer will automatically bring

    the user to the XDM login screen, where he or she will type in her user ID and
    password. XDM manages

    the logins for X and displays provides the authentication for user IDs and passwords.
    This is not the

    terminal login screen mentioned above, but a graphical login. Once a user has
    typed the correct

    information, he or she will enter the default environment. This can be configured
    with the .xsession file in

    the user''s directory. The .xsession file is important, because it contains a
    set of scripts and commands that

    execute upon starting X. The scripts and commands can tell what environment to
    load, if the user should remap

    the keyboard, or anything else a user could want before going to the desktop.


    # Text Login


    If a text login rather than a graphical is used, commands such as startx xinit
    will start the X

    Window environment. Each command has a slightly different function. startx functions
    as a wrapper for

    xinit. Although xinit is the actual program that starts X, each command can be
    used to execute X.

    startX will look for .xinitrc in the home directory. This file is similar to .xsession.
    In, many

    users will have .xinitrc as a symbolic link to .xsession.


    ```

    $ startx

    ```


    The startx command allows a user to start the X Window environment. Typically
    there is no need for

    arguments or options, though a common option is:


    ```

    $ startx -bpp 16

    ```


    The addition of the -bpp (bits per pixel) option causes a different color depth
    than the default to be. The

    -- is used to separate xinit arguments from server arguments. xinit uses all arguments
    before the --, and

    all arguments after that are passed to the X server.


    # Altering Run Level Manually


    It is possible to change from one run level to another, either for curiosity or
    troubleshooting purposes. For

    example, if running Linux in the GUI mode at runlevel 5, to change to runlevel
    3, at the shell prompt type:


    ```

    # init 3 [enter]

    ```


    This causes the machine to move from run level 5 (typically the GUI) to runlevel
    3. Anything that would

    nnormally run from runlevel at the initialization scripts for runlevel will be
    invoked. This method will work for moving

    from the GUI arena to the shell prompt and back. The commands telinit and init
    are responsible, and

    telenit is linked to init.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_162_0.png)


    SAIR Linux and GNU Certification -- Fundamentals/Linux+'
  merge: -1
