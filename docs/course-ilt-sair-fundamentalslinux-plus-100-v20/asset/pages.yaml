- img_proc: true
  md: 'All printer control programs take the -P option, which specifies a printer
    other than the default. For example, the command lpq -Plj will display the status
    of the printer named lj.


    # lpr


    lpr is the most commonly used control program. It is used to add files to the
    print spool. If files are specified on the command line, lpr will spool those;
    otherwise it will spool its standard input.


    # lpq


    To list the currently spooled jobs, use the lpq command. By default, lpq will
    display the printer, host, and job number for each job in the spool. If the -l
    option is given, lpq uses the long format, which displays the job identifier (generated
    from the username and host of the job owner), current rank, job number, description,
    and total size for each job.


    # lprm


    The lprm command is used to remove print jobs from the spool. Users can only remove
    print jobs of their own, but root may remove any job from the spool. lprm no arguments
    will remove the first job the user owns. The root user has an additional option
    not available to normal users: the all option. If root gives the command lprm
    all, all jobs will be removed from the spool.


    # lpc


    lpc is the most complex of printer control commands. It can perform many functions,
    such as enabling and disabling printers, rearranging, enabling and disabling a
    printer''s spool, and checking the status of printers and their status. These
    functions are specified by commands as arguments to lpc. If it is invoked without
    arguments, the commands are entered on the command line by lpc.


    | Command | Function |

    | help [command] | If no arguments are given this command prints a list of commands;
    otherwise, it displays help information for the specified command. |

    | abort | Immediately terminates the daemon and prevents a new one from being
    spawned to replace it. |

    | clean | Removes temporary files and files that cannot be printed from the specified
    spool. |

    | disable | Disables the spool so that no new jobs will be accepted. |

    | down printer [message] | Disables the spool and stops printing on printer. If
    a message is specified, it will be displayed when lpq is running so that users
    know why the printer is down. |

    | enable | Enables the spool so that new jobs will be accepted. |

    | exit | Exits lpc. |

    | restart | Attempts to start a new daemon for the specified printer. If a daemon
    is already running, it should be aborted first. |

    | start | Enables printing for the specified printer. |

    | status | Displays the status of the daemon and queue for the specified printer.
    |

    | stop | Causes the daemon for the specified printer to be stopped after the current
    job has completed. |

    | topq printer [jobnums] [users] | Reorders the spool for the specified printer.
    Print job may be specified in job numbers or users. The jobs listed on the command
    line will be moved to the head of the spool in the listed order. |

    | up | Enables and starts a new daemon for the specified printer. |


    Table 7-10. lpc Commands


    ![](img/b0ea5e4a55ee6767fff087672e71c505_214_0.png)


    SAIR Linux and GNU Certification -- Fundamentals+'
