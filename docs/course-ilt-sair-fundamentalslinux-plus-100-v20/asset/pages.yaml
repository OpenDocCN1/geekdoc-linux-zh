  md: '# X Configuration Tools


    # xf86config


    The most basic configuration program is x86config. Although it lacks the advanced
    graphics and features of the other programs, x86config provides considerable flexibility.
    Its command line interface allows users to directly set some of the hardware specifications.
    x86config configures the Window System by asking the user to provide answers to
    various questions about the hardware. Begin the x86config program by typing the
    command:


    ```

    5 xf86config

    ```


    The welcome screen displays basic information on the XF6Config file and outlines
    the functions of the x86config program.


    After pressing <ENTER>, the next screen asks for the type of protocol used by
    the mouse and provides a list of known protocols. Then, the program asks if the
    mouse should use Emulate 3 Buttons. This allows a two-button mouse to act like
    a three-button mouse by pressing buttons at once. X86config asks for the device
    to which the mouse is connected (for example, /dev/psaux for a PS/2 mouse). X86config
    asks if XKB should be used to configure the keyboard. XKB is a program that allows
    users to select from existing keyboard maps to configure the keyboard. x86config
    presents a list of known keyboards if XKB is used.


    xf86config begins the monitor configuration. After a brief introductory message,
    a list of horizontal ranges is presented. If none of the ranges are valid for
    the monitor, a range may be specified. The process is repeated for the vertical
    sync rates, and identifiers are created to distinguish the monitor in the configuration
    file.


    xf86config then asks if the user would like to see the video database. Viewing
    the database is recommended; create that the card selected is the same one being
    used. Then, the configuration program asks which server to run and if a symbolic
    link should be set between the server and /usr/X11/X. Creating this the video
    card is recommended. The amount of video memory is required next. Then, identifiers
    should be supplied for the video card as they were for the monitor. If the card
    has a clockchip, it may be entered in the next step; otherwise, press <ENTER>
    to skip this step. If a clock was not specified, the next step asks if Xprobe
    only be run to determine the clock information. With new cards, this step is not
    necessary, and the answer should be no.


    xf86config must now set the resolution and color depth. For each color depth,
    a set of resolutions is defined. The first listed resolution for each depth will
    be used, so the preferred resolution should be the first one. Unsupported color
    depths and resolution combinations will not be used. Finally, the program asks
    if it should write X86config and to where to write it.


    # X86Setup


    Of the two configuration programs that come with XFree, X86Setup is the more advanced.
    The program provides an easy to use graphical interface that allows the user to
    select from menus and dialog boxes. To provide the graphical display, X86Setup
    opens an X session and begins the configuration program. Another feature of using
    X86Setup is that it is not sequential; each section can be configured in any order.
    To launch this program, use the following command:


    ```

    $ X86Setup

    ```


    ![](img/b0ea5e4a55ee6767fff087672e71c505_156_0.png)'
