  md: '# Module 9 — Troubleshooting


    ```

    # Here a DOS system is defined to boot from LILO

    other = /dev/hda4 # This specifies a DOS system on the fourth partition of the

    table = /dev/hda # first IDE hard disk, using the partition table

    label = dos

    ```


    As Linux is the first image declared in the configuration file, it is used as
    the default. Unless otherwise, LILO will boot the default image, if no keys are
    pressed after loads.


    # Partitioning


    When installing Linux, a user may have to run fdisk, cfdisk, or some type of disk
    partition managers. These allow for the partitioning of new hard drives, the removal
    of partitions, and the creation of swap space data, used in the event that physical
    RAM has been exhausted.


    # SCSI


    SCSI problems can also occur during the installation process. Linux, however,
    efficiently reports and displays these kinds of error messages. The following
    are possible error messages and solutions:


    +   * Sense Errors

    This type of error is typically the result of a bad termination in the cable.
    Check that both ends of the SCSI cables are terminated. If the terminations are
    complete, defective cables could be the source of the problem.

    * Timeout Errors

    This error is most commonly caused by a conflict with IRQ, DMA, or I/O addresses.
    Interrupts should also be checked that they are enabled on the controller correctly.


    # Hardware


    Hardware problems can arise with both configuration and incompatibility with a
    system. This includes WinModems, WinPrinters, and other incompatible devices.
    WinModems utilize software emulation in place of some of the hardware. These modems
    typically have proprietary, closed-source drivers that allow for little or no
    support in Linux. Likewise, WinPrinters utilize drivers with no proprietary support
    and should be avoided. Some devices, such as Universal Serial Bus (USB) Webcams
    or audio devices, also have support in Linux.


    Apart from hardware with hardware configuration and LILO, the installation process
    for Linux is relatively clear. If a user needs any additional help, the Internet
    has a great deal of information available from Web sites such as www.linuxdoc.org.
    Frequently Asked Questions (FAQ), and through the Linux HOWTO index. The Linux
    HOWTOs are helpful documents submitted by Linux users that cover many topics concerning
    how to run Linux. With the use of online documentation and support, the installation
    of Linux should be relatively easy.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_287_0.png)'
