  md: "# Linux Distributions\n\n+   * What Is a Distribution?\n* Why So Many Distributions?\n\
    * Major Linux Distributions\n  * Red Hat\n  * Slackware\n  * Debian/GNU\n  * Caldera\
    \ OpenLinux\n  * SuSE Linux\n\n![](img/b0ea5e4a55ee6767fff087672e71c505_17_0.png)\n\
    \n# LINUX DISTRIBUTIONS\n\nIn recent years, Linux has been sold commercially by\
    \ anyone such as Red Hat, Caldera, Debian, and SuSE. But the GPL does not prevent\
    \ corporations or anyone else from selling a piece of software as long as the\
    \ source code is freely available. Therefore, the distributions of Linux that\
    \ are also available for download on the Internet. The attraction of these retail\
    \ distributions is that technical support and documentation are generally supplied\
    \ with the purchased copy. These corporations are actually selling support and\
    \ documentation rather than the actual software.\n\n# What Is a Distribution?\n\
    \nThough it is possible to build a Linux system, including its most basic units,\
    \ it is unlikely a user would wish to do so. The technical knowledge required\
    \ to build a functional Linux operating system from scratch is not only beyond\
    \ the abilities of most users, but too time-consuming for the most capable Linux\
    \ user. To alleviate this problem, Linux distributions were created. A distribution\
    \ generally contains the latest kernel and system libraries, a collection of software\
    \ packages and source code, and an installation and setup program. This is all\
    \ free software, all distributions are available to download for no cost, in full\
    \ or in part and in code or binary. Due to their relatively large size, Linux\
    \ distributions are typically available on CDs which may be purchased from the\
    \ vendor or Web sites as http://linuxcentral.com.\n\n# Why So Many Distributions?\n\
    \nOne of the unique features of Linux is that there are multiple distributions\
    \ available. Unlike other operating systems, Linux is not owned by a single person\
    \ or organization, which means that any organization can create a new distribution\
    \ by adding new features or applications to the Linux kernel."
  merge: -1
  pgno: 17
- img_proc: true
  md: 'For someone new to computing or primarily familiar with other commercial operating
    systems such as Windows 95/98/NT or Mac OS, the concept of multiple distributions
    might be confusing. However, all Linux distributions have the same set of common
    programs, utilities, and libraries. The distributions differ primarily in the
    packaging of the applications.


    # Major Linux Distributions


    Linux has many distributions. Each distribution has its own set of features, some
    of which are intended for specific types of computer systems. Recently, popular
    distributions such as Red Hat, Slackware, Debian/GNU, Caldera OpenLinux, and SuSE
    Linux have emerged.


    # Red Hat


    Red Hat Linux is an extremely popular Linux distribution. It is maintained by
    an organization called Red Hat. Perhaps the reason for Red Hat''s popularity is
    its excellent tool support for the installation and upgrading of the operating
    system. It also has a well-designed program for installing, uninstalling, and
    tracking software packages. Along with its powerful installation features, the
    latest version of Red Hat offers popular Internet applications as Apache, sendmail,
    and Samba.


    A copy of Red Hat Linux may be downloaded from the Sunsite Linux FTP site at http://sunsite.unc.edu/pub/linux.
    It can also be found on Red Hat''s site at www.redhat.com or purchased as a commercial
    distribution on CD-ROM.


    # Slackware


    Before Red Hat Linux was formed, Slackware was among the more popular distributions
    of Linux, and it still remains popular with users. Slackware can be downloaded
    from ftp://ftp.cdrom.com in addition to Sunsite''s Web site at http://sunsite.unc.edu/pub/Linux.


    Like many other distributions, Slackware also offers a range of utilities, tools,
    and applications which include X Window, GNU Compiler Collection, PPP support,
    and Java support.


    # Debian/GNU


    Rather than a single person or organization, Debian/GNU is produced by a group
    of volunteers from around the world. Debian offers more than 1,000 software packages
    that are designed to have the same functionality as Red packages. The Debian distribution,
    like the Open Source Foundation, is committed to the development of open source
    software. Therefore, all the software produced by the Debian distribution is open
    source. Those who produce the Debian distribution refrain from bundling software
    applications that are not free.


    Debian typically requires in-depth understanding of the system, while providing
    the opportunity for a user to enhance their troubleshooting and problem-solving
    skills.


    # Caldera OpenLinux


    Caldera OpenLinux is a stable and widely supported version of Linux. One of Caldera''s
    greatest features is its easy installation in comparison with other Linux distributions.
    In fact, Caldera is said to be easier to install than Windows. Configuration and
    administration of Caldera is done with COAS, the Caldera Open Administrator.


    Caldera includes many attractive features, including the Apollo office suite,
