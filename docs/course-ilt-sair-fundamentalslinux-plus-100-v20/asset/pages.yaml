  md: '# Navigation


    Moving the cursor Pico may be done by character, line, or screen. Moving a character
    up, down, left, and right is done with <CTRL-P>, <CTRL-N>, <CTRL-B>, and <CTRL-F>,
    respectively. <CTRL-A> will move to the beginning of a line, and <CTRL-E> will
    move to the end of a line. To move an entire screen, type <CTRL-V>, and to move
    a screen up, type <CTRL-Y>.


    # Searching


    Searching in Pico is performed with the <CTRL-W> key sequence. When the search
    dialogue opens, options are given the user to go to a particular line number,
    the first or last lines of the file, to the start of the current paragraph, or
    to search for an expression. Pico waits for an expression to be entered before
    searching for an expression.


    # Saving a file


    To save a file in Pico, the <CTRL-O> key sequence is used. This will open a dialogue
    box to write to the current file. The current name of the file will already be
    in place for the user, so <ENTER> will save the file. If the user wishes to write
    another file, the <CTRL-T> command will move to a directory listing so a file
    may be chosen. Pressing <TAB> will attempt a completion of an available filename.


    Pico may be exited with the <CTRL-X> command, which will prompt the user to save
    any unsaved files and then exit the program.


    # Options


    Options may be used on the command line with Pico. Table 7-6 is a list of widely
    used options. A complete list may be found under the Pico(1) man page.


    | Options | Function |

    |---|---|n| +N | Staris Pico with the cursor on the N line. |

    | -e | Allows file name completion. |

    | -m | Enables mouse functionality. |

    | -rn | Sets the position to N columns over from the left margin. |

    | -v | Shows a file in read-only mode, preventing any editing. |

    | -x | Disables the menu with the 12 options at the bottom of the screen. |


    Table 7-6. Pico Command Line Options


    # Joe


    Joe''s Own Editor (Joe) is a program suite of five different programs: jmac, jpico,
    jstar, rjoe, and Joe. jmac is an Emacs emulator, jpico is a Pico emulator, and
    jstar employs many of the features as WordStar. The rjoe program will only edit
    files that are specified on the command line. The Joe editor has its own configuration
    and specialized commands.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_196_0.png)


