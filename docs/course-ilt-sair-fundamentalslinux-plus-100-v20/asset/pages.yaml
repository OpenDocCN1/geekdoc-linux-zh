  md: '# Running X


    +   * init/Run Levels

    * 0 - Halt

    * 1 - Single user mode

    * 2 - Multiuser without NFS

    * 3 - Full multiuser mode

    * 4 - unused

    * 5 - X11

    * 6 - Reboot


    Graphical Login


    Text Login


    +   * start

    * initx


    Altering Your Run Level Manually


    # RUNNING X


    There are two ways for users to get their X environment. If the administrator
    has the system set to present the text login, the user must manually start X with
    the startx command after logging in. If the system makes use of a graphical login
    to X, this is not necessary. These settings are governed by the default run level.


    # init/Run Levels


    After booting, Linux executes init, which is the parent of all processes on the
    system. init relies on the concept of run levels; a run level defines what set
    of programs will be running on the computers. For example, the run level determines
    whether the text login or a graphical login should be run. To check the current
    default run level, the user may execute the command:


    ```

    $ /etc/inittab

    ```


    The resulting line will look something like the following:


    ```

    id:5:initdefault

    ```


    In this example, the default run level is 5.


    For most distributions of Linux the run levels are:


    +   * 0 - Halt

    * 1 - Single user mode

    * 2 - Multiuser without NFS

    * 3 - Full multiuser mode

    * 4 - unused'
  merge: -1
