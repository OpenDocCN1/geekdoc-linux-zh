  md: '# Appendix B — Glossary


    spool directory. Separates the request from the action; it gives the user the
    option to delete a file after the print request has been issued before the printing
    has taken place.


    Stallman, Richard. Conceptualized using copyright to protect software from being
    controlled by any one person, group, or company.


    STAT column. Shows the state of each process. The process could be sleeping, swapped,
    or running.


    superuser. Any user account that has the value of 0 or the UID. When the user
    account UID is 0, the user manager does not enforce permissions before performing
    the requested action.


    SuSE attributes. Is the most complete distribution, provides all software on six
    CDs, and has a robust and easy-to-use configuration tool, called YaST.


    swap drives. Linux users use separate partitions as swap devices to improve the
    speed at which programs move over the hard disk and main memory (RAM). The disadvantage
    of swap devices is that once allocated, the swap storage cannot be used for files.


    syslog daemon. Since background programs do not report to a controlling terminal,
    they send their status messages to a centralized daemon called syslog.


    text printing. The printer is responsible for forming the shape of each character.


    tkman utility. Offers a true GUI front-end to the pages. It offers significant
    improvement over many by displaying the table of contents for each man section.
    It also provides detailed regular expression searches within manual pages.


    TTY column. Shows into which console, direct-connect terminal, or network connection
    the user is logged.


    UID. When looking up a name for an account, the first matching UID is used. This
    means if two users have the same UID, the system programs will show the first
    name listed in the passwd file owns the file.


    user account. Defines the files that a user owns and what access the user may
    have to other files. For Linux, the user must enter through an existing user account
    that was set up by the system administrator. When set up by the superuser, the
    user account associates an ID with file ownership and establishes permissions
    to access files owned by other accounts.


    useradd. Creates new accounts and requires superuser status; useradd has a companion
    program userderdel, and has a different configuration file from adduser.


    vendor floppy. Includes a floppy that contains diagnostic and configuration programs.
    Simply boot the machine with an MS-DOS floppy, and run the configuration program
    directly from the vendor floppy to configure an adapter.


    video controller. Reads data from video memory, and based upon its mode, provides
    a scan rate to the digital-to-analog converter for display on the monitor.


    video memory. Accepts data from the CPU and offers access to the video controller.
    Data is arranged in memory according to the current graphic mode.


    virtual desktop. X11 provides an extra level of control by offering multiple windows
    on a desktop and multiple virtual desktops that are larger than the screen.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_383_0.png)'
