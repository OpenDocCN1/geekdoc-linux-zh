  md: "# # Firewalls and Proxy Servers\n\n+   - Using ipchains\n  - Options\n- Defining\
    \ a Firewall\n- Types of Firewalls\n  - Bastion firewall\n  - Screened subnet\
    \ firewall\n- Squid Proxy Server\n\n# # FIREWALLS AND PROXY SERVERS\n\n![](img/b0ea5e4a55ee6767fff087672e71c505_262_0.png)\n\
    \nA firewall is a machine that has been configured to accept or deny network packets\
    \ based on some defined criteria, so as to restrict access to one of the networks\
    \ it separates. This process of checking packets is known as packet filtering.\
    \ The ipchains program is used to set up and administer these rules, which are\
    \ commonly referred to as chains.\n\nA proxy server is a server that allows connection\
    \ to the Internet, yet stores and filters the information. There are many different\
    \ forms of proxy servers, such as caching-only and SOCKS proxy servers.\n\n# ##\
    \ Using ipchains\n\nBy default, ipchains include three chains: *input*, *output*,\
    \ and *forward*. Although new chains can be defined, these three chains are always\
    \ present and cannot be deleted. The `input` chain defines a list of rules that\
    \ apply to packets destined for the local system. The `output` chain defines a\
    \ list of rules that apply to packets leaving the local system for other destinations.\
    \ Rules in the `forward` chain are used to send packets that have been received\
    \ on another system.\n\nWhen using ipchains, it is important to know what actions\
    \ can be taken. The `ipchains` command supports the options listed in Table 8-8:"
