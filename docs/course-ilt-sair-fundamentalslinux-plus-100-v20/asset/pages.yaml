  md: '# Configuring a Graphical User Interface


    +   * Window Managers


    +   * X Window System designed in modular fashion

    * Fwm, TWM, IceWM, AfterStep, etc


    +   * Desktop Environments


    +   * Provides consistent look to all applications, desktop

    * First free desktop was KDE

    * Gnome developed after licensing problems with KDE


    # CONFIGURING A GRAPHICAL USER INTERFACE


    The GUIs available for Linux are built using the X Window system. The original
    X Window system for Unix platforms was developed at MIT; The X version 11 release
    6, more commonly referred to as X11R6 or X11, is available for Linux and other
    Unix-like operating systems due to the XFree86 Project. X can be configured to
    run many different desktop environments, though simple window managers are still
    the most common. The minimum recommended system for running XFree86 is a 486/66
    with 16MB of RAM and no less than 60MB of disk space available for the installation.
    Depending on the applications intended to be run with XFree86, more space may
    be needed.


    # Window Managers


    The Window system is designed in a modular fashion. Though the different components
    interact with each other, they are completely separate, allowing a high degree
    of customization by replacing components. Window managers are components of the
    X Windowing system and control how windows look and how the user interacts with
    them. They basically control the screen layout and appearance of the environment
    for the user. Since window managers are separate components from other parts which
    make the X Window system, different managers can be installed or uninstalled,
    allowing the use of the managers with any X desktop environment.


    Some available Window managers are FVWM, TWM and its variants, IceWM, AfterStep,
    Enlightenment, WindowMaker, and Sawfish (formerly known as Sawmill). With the
    exception of Sawfish, all of these window managers provide their own environment,
    which may clash with a desktop environment. Some of them, as IceWM and FVWM, can
    be configured to hide their environments in the desktop environment.'
  merge: -1
  pgno: 70
- img_proc: true
  md: '# Desktop Environments


    Traditionally, window managers are modified by editing configuration files. In
    the last few years, GUI configuration tools have become popular as an alternative
    to editing files. This fact is evident in the desktop environments, as well as
    in window managers like WindowMaker, Sawfish, and Enlightenment. Some window managers,
    such as FVWM and TWM, still rely on configuration files.


    Desktop environments are fairly new to Linux and are more than just window managers.
    They provide the user with a consistent look and feel across all applications,
    as well as the desktop.


    The first free desktop environment was KDE. It was developed with the intent of
    bringing a GUI to free Unix-like operating systems. KDE comes with many applications
    and is still one of the most popular desktop environments.


    Another free desktop environment, Gnome, was originally developed in response
    to KDE. Due to a licensing problem with KDE''s widget set, Qt. Gnome no longer
    follows KDE. The current version of Gnome is as polished and usable as KDE, but
    it has a distinctly different style. Unlike KDE, Gnome allows the use of any window
    manager. Most users run the default, Sawfish, which was developed specifically
    for use with Gnome.'
  merge: -1
