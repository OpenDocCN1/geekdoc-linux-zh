  md: '# # LAB 09 - KERNEL DOWNLOADING AND RECOMPILING


    # Purpose


    The objective of this lab is to successfully download and recompile the Linux
    kernel. After completing this lab, you will be able to upgrade the current kernel
    to your specific needs, improving system performance.


    # Lab Duration


    30 minutes.


    # Overview


    Linux is composed of four essential components: the kernel, shell, file structure,
    and utilities. At the core of the Linux operating system is the kernel. The kernel''s
    role is to mediate the system''s hardware and software. Concept of modularity,
    which employs the use of small programs that can be used on any system, is central
    to Linux and can operate alone or in tandem with other modules. This practice
    keeps the size of the kernel to a minimum and allows for customization to serve
    the needs of a particular system.


    # Exercises - Part I


    The Linux kernel is available on the Web from a number of sources. One of the
    best sources is kernel.org. This site may also be accessed via ftp.kernel.org/pub.
    Choose the Linux directory, followed by kernel directory. The next screen shows
    a list of kernel major and minor numbers. After making this selection, the following
    screen shows the patch available for the version and to install. The kernel is
    compressed, yet has a size of 1MB, and is compressed in two versions, gz and bbz2.
    The .bz2 files offer better compression, yet not all systems support bzip2. Thus,
    bzip2 is available for those systems that have problems with bzip2. Find out if
    all your system supports bzip2 and download the one that fits you.


    Download the tarball to the /usr/src directory. Before installing the kernel,
    check the file to get an overview of the file structure to be installed using


    ```

    tar -tzf linux-X.X.XX.tar.gz

    ```


    Copy the existing linux/ directory in case of error. A quick way to copy the old
    directory is to use the mv


    mv /usr/src/linux/ /usr/src/linux-old/

    Most distributions, however, will create a symbolic link from the /usr/src/linux-X.X.XX
    directory to /usr/src/linux/. In this case, instead of moving the directory, all
    you must do is remove the /usr/src/linux/ directory by typing:


    ```

    rm /usr/src/linux/ /usr/src/linux-old/

    ```


    When the kernel is decompressed, it will recreate the /usr/src/linux/ subdirectory
    in /usr/src/. To begin decompressing the kernel, type:


    ![](img/b0ea5e4a55ee6767fff087672e71c505_300_0.png)'
  merge: -1
  pgno: 300
- img_proc: true
  md: 'Change to the newly created /usr/src/linux/ directory using the command:


    ```

    cd /usr/src/linux/

    ```


    To create the symbolic link back to the /usr/src/linux/ directory, from this new
    directory, type:


    ```

    ln -s /usr/src/linux-X.X.XX /usr/src/linux/

    ```


    The following command will check the .o files and dependencies for stability:


    ```

    make mrproper

    ```


    Now that dependencies are checked, and the kernel is downloaded and in the proper
    location, it is time to configure it. The Makefile provides several options to
    set up the kernel. These options depend on how the user wants to interface with
    the configuration program. The make config uses a command-line program, make menuconfig
    uses a curses-based console program, make xconfig uses tk/tcl-based X11 program,
    and make oldconfig utilizes an automatic update program.


    ```

    make menuconfig

    ```


    The kernel is extremely customizable. To reduce the size and speed of the kernel,
    only select the options needed. Most features may be loaded as a module. In fact,
    modules are the preferred method for devices such as CD-ROMs, tape backups, and
    many others.


    Oldconfig is used to transfer the settings from the old kernel to the new. Menuconfig,
    config, and xconfig alter the kernel settings.


    Makefile can be used to place the updated kernel and system image in another location.
    The default setting places places the kernel in the / directory. Placing the kernel
    in another directory requires you to use an editor and modify the following line.


    ```

    #INSTALL_PATH=/boot

    ```


    You must first delete the pound sign (#), as this indicates a comment, and is
    not read when compiling. Second, you must modify the directory to be located in
    whichever directory you want the kernel placed. Here, we use the /boot directory.


    Dependencies are parts of packages or code modules containing system information
    needed to build a program and may be shared by several other programs. The make
    command determines which portions need to be recompiled or linked to a module.
    The make clean command removes old files from a previous kernel compilation. The
    next command you should run is make modules, which will compile the modules you
    selected within the kernel configuration. Immediately following the make command,
    type make modules_install, which will install the modules to their correct location
    on the system.


    ```

    make dep

    ```


    ```

    make clean

    ```


    ```

    make modules

    ```


    ```

    make modules_install

    ```


    ![](img/b0ea5e4a55ee6767fff087672e71c505_301_0.png)'
