  md: '# The main interface


    ![](img/b0ea5e4a55ee6767fff087672e71c505_172_0.png)


    Figure 11. Midnight Commander''s Gnome Interface


    There are two ways to initialize this program: at the command prompt or from the
    Gnome desktop. To start from the command prompt, type gmc and hit <ENTER>. To
    start from Gnome desktop (see Figure 6-11), select file manager from the main
    menu.


    This interface is divided into five parts: a menu bar, a tool bar, a location
    status line, and two main windows. The first window lists the directory tree,
    and the other window list the contents of the selected directory.


    # Directory browsing


    Directory browsing is simple. Point the cursor to the directory to be moved and
    click the left mouse button once; the file listing of selected directory will
    be displayed. To run, view, or edit any file under that particular directory,
    double-click the left mouse button on the file.


    # File selection


    There are many ways to select files with GMC. To select a single file, click the
    left mouse button on the desired file. To select multiple files, hold the <CTRL>
    key and click the left mouse button once on each. Remember to keep holding the
    <CTRL> key until the entire selection is finished. Following the same steps will
    deselect files. To select all files of a particular directory, choose edit from
    the menu bar and click the Select All option.


    Another option for selecting files is by pattern. To do this, choose edit from
    the menu bar and click the Select Files option. This opens a dialog box. Use wild
    cards to specify a file pattern. For example, to find all files that start with
    D, type D*. in the dialog box.


    # Basic file operation


    The following is a review of a few basic operations of GMC.'
