    \ 2 - It is the adapter.\n  * Example 3 - It is the routing.\n\n# COMMON NETWORKING\
    \ PROBLEMS\n\nF0.9.20 Few tasks are as important to a Linux Network Administrator\
    \ as the proper identification and prevention of system problems. Regardless of\
    \ the network's size, its proper function is often the sole responsibility of\
    \ the administrator. For this reason, a foundation of widely practiced methods\
    \ should be established in order to prevent network failures and recover from\
    \ them. When a crash occurs, the administrator should take note of the problem\
    \ and the procedure for its solution. In time, a network administrator will have\
    \ a vast amount of optimized information from which to solve any further disasters.\n\
    \n# Hardware Issues\n\nNetwork problems are often caused by faulty or improperly\
    \ installed hardware. An administrator should be aware of the physical connections\
    \ involved in the organization's network. Table 9-1 lists several tools that can\
    \ help identify hardware problems within a network.\n\n| Tool | Function |\n|\
    \ Digital Volt Meter (DVM) | Useful for finding short circuits in network wiring\
    \ |\n| Protocol Analyzer | Analyzes and reports network performance and measures\
    \ bandwidth |\n| Oscilloscope | Measures voltage per unit time, which can reveal\
    \ cable problems |\n| Tone Generator | Analyzes individual cables |\n| Time Domain\
    \ Reflectometer (TDR) | Sends pulses through a cable and recognizes inconsistencies\
    \ |\n\nTable 9-1. Tools to Help Identify Hardware Problems"
