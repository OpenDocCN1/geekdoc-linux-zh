  md: '# 9-12 Module 9 — Troubleshooting


    Along with preventing errors by maintaining the physical status of the network,
    many problems can be solved by using the utilities and commands included in most
    Linux distributions. Table 9-2 lists some of the commands that a network administrator
    should know in order to combat network problems.


    | Command | Definition |

    |---|---|\| traceroute <host> | Displays the route that a system''s packets are
    taking |

    | tcpdump | Allows the user to dump or print specified data packets |

    | netstat | Lists the status of network connections |

    | ipchains | Administration for IP firewalls |

    | ping <host> | Displays specified available host information |

    | arp | Permits the user to clear and arp tables containing previous network activity
    and information |


    Table 9-2. Commands for Networking Problems


    Familiarity with these commands provides the administrator with the tools he or
    she needs in order to properly manipulate a Linux system. One should not be discouraged
    if errors persist; there are times when familiarization and mastery are not enough
    to solve specific problems. The following examples are taken from some experiences
    with networks.


    Example 1 - It is the cable.


    After the network has been configured on a host and everything has been connected,
    the host cannot see anything on the network. Domain name lookups do not occur,
    nothing can be pinged, and as for the host is concerned, the network does not
    exist. This can be confusing, especially if the network seems to be configured
    properly. First, check the physical connection between the host and the network.
    The cable connecting the host to the Ethernet port should be replaced with one
    that works. If the original cable was bad, then the problem is now solved. If
    the problem persists, try connecting the computer to an Ethernet port that is
    known to work or connect a working computer to the Ethernet port of the computer
    with problems. In the first case, if the computer begins to work, then the problem
    is solved. In the second case, if the computer stops working, then the problem
    is in the wiring to the port. In either case, the problem has been identified
    and can now be solved.


    Example 2 - It is the adapter.


    The problem is not with the physical connection at all. Make sure that the network
    adapter has been configured properly. To do this, use the ifconfig command. This
    command displays information about the network interfaces that have been configured
    on a host, though its main purpose is to configure those interfaces. After entering
    ifconfig at the prompt, two entries should be displayed: lo and eth0. If these
    two do not appear, then there are problems. If the loopback interface is missing:


    ```

    $ ifconfig 127.0.0.1

    ```


    This will add the loopback interface. The procedure to add the Ethernet entry
    is similar:


    ```

    $ ifconfig eth0 192.168.1.xxx

    ```


    xxx is the IP of the local host. ifconfig will automatically configure the netmask
    of the address. If peers persist, the lack of interfaces was not the only problem.


