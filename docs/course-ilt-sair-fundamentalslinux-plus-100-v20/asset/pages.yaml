  md: '# What''s a Tarball?


    In the early days of Linux, packages were tarballs. A tarball is a compressed
    file composed of other files. The first package manager was dpkg, which uses deb
    files. It was introduced by Debian in 1994 and was soon followed by Red Hat''s
    Red Hat Package Manager (RPM). Aside from Slack, all major Linux distributions
    use either debs or RPMs. The Debian package system is more powerful, but this
    power makes it more difficult to create packages. RPM is generally more popular
    and is being used by nearly all distributions.


    # Proprietary vs. GNU/Free Apps


    It is very common for proprietary applications to be offered with the different
    distributions when they are sold commercially. These applications are often commercial
    software bundled with a distribution and sold at a much higher price to businesses.
    For example, Corel sells a version of its distribution bundled with WordPerfect,
    and Red Hat offers a bundle of Red Hat 6.2 and Real Server (which serves RealAudio
    and RealVideo). Much of this commercial software is also built for specific distributions
    and getting them to work with other distributions may not be feasible.'
