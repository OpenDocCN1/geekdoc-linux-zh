- img_proc: true
  md: 'With directories, the definition of permissions changes slightly. If a user
    has permission to read from a directory, the user can read the files in the directory.
    If write permission is allowed, files can be added or removed from a directory.
    Finally, if permission is given to execute a directory, then a user can list information
    about the files in the directory, such as their permissions, ownership, and creation
    date. Execute permission allows a directory to be a user''s working directory.
    Regardless of the other permissions a user has on a directory, the user can do
    nothing in it, not even read, write, or list files, without execute permission.


    Aside from slightly different meanings of permissions, files and directories are
    treated equally with regards to setting permissions and changing ownership.


    # Permissions Levels


    There are three levels of permission that can be set for each file and directory.


    +   * User permissions apply to the owner of the file.

    * Group permissions apply to the group of users.

    * Other permissions include every user who has access to the machine.


    File ownership, the user, the group, and other classifications will be explained
    later.


    Changing permissions on a file is a very simple task. Although there are two ways
    to do this, both use the chmod command. The first method, symbolic mode, is probably
    the easiest to understand. The second, absolute mode, is based on the bit mode
    of the file, and thus is slightly more complicated.


    # Symbolic mode


    Each permission has a level: u, g or o for user, group, or other, respectively.
    Each type of permission also has a letter: r, w, or x for read, write, or execute.
    To add a permission, chmod is followed by the permission level, a+, and then the
    permissions to be added. Removing permissions is done in the same manner, and
    a- is used instead. For example, suppose there is a file named script that everyone
    on the system needs to read, but the only user who currently has any permissions
    to it is root. The solution for this would be:


    ```

    $ chmod a-r script

    ```


    Because as stated, the read permission is added to all levels. If, however, script
    should only be readable by the users in the same group, then the command would
    be:


    ```

    $ chmod g+r script

    ```


    Here, read access would be granted to the group. It is important to note that
    access is not removed, only added. If the file was readable by everyone, chmod
    g+r does not remove that ability, nor does it remove the ability for the owner
    to read it. To remove read access from the other group, the following should be
    used:


    ```

    $ chmod o-r script

    ```


    Multiple level and multiple permission changes can be made in a single command.


    ```

    $ chmod ug+rwx script

    ```


    The above command would grant the user and the group read, write, and execute
    permissions on the file script.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_114_0.png)


    SAIR Linux and GNU Certification -- Fundamentals/Linux'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# Absolute mode


    With symbolic mode, the combination of letters that represent the respective permissions
    make this an easy to remember method of changing permissions. However, sometimes
    it is easier to ensure specific permissions are set, instead of adding or deleting
    permission, as is done with symbolic mode. This is where the absolute mode of
    setting permissions is useful.


    For each set of permissions, there is a number with which to associate them. For
    instance, the number 777 will instruct the system to read, write, and execute
    permissions for user, group, and other on the specified files, overwriting any
    previous permissions settings for file. By issuing the chmod 754 script command,
    the permissions would be as follows:


    ```

    -rw-rw--r root admin 2282 script

    ```


    The first number will set permissions for user, second number for group, and third
    number will set the other permissions. Table 5-1 will describe in more detail
    which numbers will set specific permissions.


    | Code | Permission Level |

    |---|---|

    | 0 | -- |

    | 1 | -x |

    | 2 | -w |

    | 3 | -wx |

    | 4 | r-- |

    | 5 | r-x |

    | 6 | rw- |

    | 7 | rwx |


    Table 5-1. Permissions Table


    # Purpose of permission levels


    The purpose of user permissions is obvious: the owner must be able to access his
    or her own files. The group category allows a set of users to share files. Any
    time multiple people will be working on a single file, they will all need to have
    permissions to that file that are exclusive to the group. For example, a class
    working on a Web page or authors writing a manuscript should be placed in a group.
    Creating multiple copies of a single file for each person to work on would introduce
    confusion when attempting to consolidate the final product, if certain changes
    conflicted. Therefore, the group level allows a single owner but also grant extended
    permissions to a small set of users without granting access to everyone who has
    access to the system.


    To add a level of complexity, a user also has the ability to run or access programs
    as he or she were the owner or group of that particular program. This is accomplished
    by means of the SUID and SGID bits. The following example describes what to search
    for when looking SUID and SGID programs.


    ```

    -rws-s-- root admin 15712 shutdown

    ```


    This means that users who can access this program as root, or in the admin group,
    are allowed to run this program. Instead of running this program as themselves,
    the system interprets them as being root.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_115_0.png)'
