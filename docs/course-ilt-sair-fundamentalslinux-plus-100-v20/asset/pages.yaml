  md: "# 10-36 Module 10 — Hardware\n\n# Visual Devices\n\n+   * Graphical Adapters\n\
    * Graphic standards\n* Graphic adapter components\n  * Bus connection\n  * Graphic\
    \ Processor\n  * Video RAM\n* Monitors\n  * Monitor resolution\n  * Dot pitch\
    \ and stripe pitch\n  * Refresh rates\n\n![](img/b0ea5e4a55ee6767fff087672e71c505_339_0.png)\n\
    \n# VISUAL DEVICES\n\nThe most common method through which a visual display is\
    \ created is quite simple; the computer's processor sends a digital signal to\
    \ the graphics adapter. Then, the graphics processor on the graphics adapts the\
    \ digital signal to an analog signal, sending it to the monitor for display. Many\
    \ flat display and laptop computers work differently, using an all digital process.\n\
    \nThe Electronics Standards Association (VESA) is an organization conceived to\
    \ develop \"display' interface standards ... ensuring interoperability, and encouraging\
    \ innovation\" (www.vesa.org/mission.htm). Established in 1989, VESA can be considered\
    \ the definitive voice for display standards, and most manufacturers of graphics\
    \ adapters and monitors comply to VESA standards.\n\n# Graphics Adapters\n\nThe\
    \ term graphics adapter is often used interchangeably with graphics card, video\
    \ card, video adapter, video board, video accelerator, and graphics accelerator,\
    \ among others. This section will cover the standards and components of graphic\
    \ adapters.\n\n# Graphic standards\n\nThe quality of a display is measured by\
    \ three criteria: the number of colors it can display (color depth), the resolution\
    \ it supports, and the refresh rate. Screen resolution is measured by the number\
    \ of pixels counted horizontally the number of pixels counted vertically. So,\
    \ a screen resolution of 800x600 means that there are 800 pixels horizontally\
    \ and 600 pixels vertically.\n\nGraphics adapters have developed from the Monochrome\
    \ Display Adapter (MDA), with capability for only one color, to various versions\
    \ of the Extended Video Graphics Array (XVGA) that has the capability for 16.8\
    \ million colors. Video Graphics Array (VGA) introduced the process of converting\
    \ data signals to analog signals, because of the increased processing required\
    \ to display more complex colors."
