  md: "# Mounting File Systems and Devices\n\n+   * Configuration Files for Mounting\
    \ File Systems\n  * fstab\n* The mount command\n  * Options for the mount command\n\
    * Mounting NFS File Systems\n  * NFS options not always present in other file\
    \ systems\n  * Slight changes in syntax\n\n# MOUNTING FILE SYSTEMS AND DEVICES\n\
    \nAll devices, such as CD-ROMs, hard disks, network drives, and floppy disks,\
    \ must be mounted by the kernel to be accessible by the system. The init scripts\
    \ read the /etc/fstab file to determine which file systems to mount at boot time.\
    \ Other file systems and devices can be mounted and unmounted after booting permissions\
    \ on the device allow. The command used to mount file systems is mount. To unmount\
    \ a file system, use the unmount command.\n\n# Configuration Files for Mounting\
    \ File Systems\n\nThe /etc/fstab file may include information about any file system.\
    \ This includes floppy disks, NFS shares, CD-ROMs, and all hard disks for the\
    \ system. The /proc file system is also specified there. Each line in the file\
    \ consists of six fields (from left to right): device, owner, mount type, dump\
    \ frequency, and number. The dump frequency is used to determine how often the\
    \ file system should be checked at boot time. Pass number indicates the order\
    \ in which the file system should be checked. They appear in the file. For either\
    \ of these options, nothing or 0 indicates the operations should not be performed.\
    \ This is an example from the /etc/fstab file:\n\n```\n/dev/hda1 / defaults 1\
    \ 1\n/dev/cdrom /mnt/cdrom iso9660 noauto, owner, ro 0 0\n```\n\nIn the above\
    \ example, the file system named /dev/hda1 has a mount point of /. It is an ext2\
    \ system type, with the default options passed to it. The default options consist\
    \ of read-write, exec, auto, and async. The mount command can only be used by\
    \ root user has been specified in this field. The second line of this file reports\
    \ that the /dev/cdrom will be mounted on /mnt/cdrom. It is of file type ISO-9660,\
    \ which is the standard specification for CD-ROMs. The options passed to it show\
    \ it will not be mounted automatically, but instead be mounted by the owner of\
    \ the device. Some of the common options used with this /etc/fstab file are explained\
    \ in Table 5-23:\n\n![](img/b0ea5e4a55ee6767fff087672e71c505_134_0.png)"
  merge: -1
