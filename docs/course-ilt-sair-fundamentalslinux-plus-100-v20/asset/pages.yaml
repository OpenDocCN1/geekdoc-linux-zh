  md: "# Troubleshooting Basics\n\n+   * Initial Troubleshooting\n  * Identify the\
    \ problem\n  * Consult documentation\n  * Consult other users\n* Advanced Troubleshooting\n\
    \  * Isolate problem-related components\n  * Individually test components\n  *\
    \ Repair the problem\n\n# TROUBLESHOOTING BASICS\n\nTroubleshooting is an important\
    \ part of setting up and maintaining any system. When a problem arises, it is\
    \ important to be able to diagnose the problem by tracing the symptoms back to\
    \ the cause. There are two basic ways to approach troubleshooting a problem. The\
    \ first is to find a quick fix by consulting documentation from various sources\
    \ and by asking experts. The second is to analyze individual components and search\
    \ for problems within. Each of these approaches is equally viable and can lead\
    \ to solid solutions. While the amount of troubleshooting ultimately depends on\
    \ the complexity of the problem, the following is a general list of steps that\
    \ should be followed in order to thoroughly troubleshoot\n\n# Initial Troubleshooting\n\
    \n+   1. Identify the problem. Note exactly what the problem is.\n2. Consult documentation.\
    \ Read online documentation (including newsgroups and vendor Web sites), pages,\
    \ and books on the subject of the problem for possible solutions.\n3. Consult\
    \ other users. Check with other users to see if anyone has encountered and solved\
    \ this problem before.\n\n# Advanced Troubleshooting\n\n+   1. Isolate problem-related\
    \ components. Discern what components might be causing the problem. For example,\
    \ if the system will not turn on, you might need to check the power cord, the\
    \ power supply, the power switch, and any utilities using the operating system.\n\
    2. Individual test components. Check each component for removing and testing it\
    \ with a working system. If the component will not work on another system, the\
    \ problem is most likely associated with that component.\n3. Repair the problem:\
    \ If the problem with the component is not immediately visible, the troubleshooting\
    \ process begins again, starting with the affected component. If this yields no\
    \ results the component may need to be replaced."
