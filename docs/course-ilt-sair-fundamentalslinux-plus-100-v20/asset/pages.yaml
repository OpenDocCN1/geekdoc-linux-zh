  md: '# Hardware Requirements


    # Hardware Requirements


    +   * Minimum System Requirements

    * Optimal System Requirements

    * Hard Drives

    * Video System

    * Input Devices

    * CD-ROM and DVD Drives

    * Removable Media

    * Printers and Modems

    * Network Adapters and Multiport Cards


    # HARDWARE REQUIREMENTS


    There are a few necessary steps to follow before installing Linux on a computer.
    One of the most important steps is to identify all of the hardware. Identifying
    the hardware early will make the installation and configuration process much easier.
    Depending on the version of Linux being used, it is likely that all of this information
    will be needed during the configuration phase.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_36_0.png)


    Another advantage of identifying the hardware before installing Linux is the chance
    of discovering missing drivers. Without a driver piece of hardware will not work,
    which is why it is important to ensure that the version of Linux being installed
    has drivers that match the hardware. If the version of Linux does not support
    the hardware, it is possible the driver is posted on the Internet. The Linux community
    creates necessary drivers and makes them freely available.


    This section will outline hardware requirements that are needed to run a standard
    Linux system as well as an optimized Linux system. Keep in mind that in this section,
    optimized does not necessarily relate to a computer with the fastest processor
    and the most memory.


    # Minimum System Requirements


    Most Linux distributions require at least 8 MB of memory and a 386SX processor,
    some specialized distributions work with little as 2 MB. Older slower Linux systems
    are perfect for small jobs like being a firewall or router for a small network,
    but most jobs require more memory and a faster processor. For a typical desktop
    with Gnome or KDE, performance will suffer with anything less than a Pentium with
    64 MB of memory.


    Linux supports several types of hard drive controllers: ATA/IDE (including EIDE,
    UDMA, and ATAPI), ESDI (Enhanced Small Device Interface), RLL (Run Length Limited),
    and SCSI (Small Computer Interface).'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# 2-4 Module 2 — What to Know Before Installing Linux


    Typically, IDE hard drives do not present any requirement problems. Linux supports
    IDE devices and works with all IDE hard drives. When using SCSI hard drives, however,
    some problems could arise. The capability for SCSI drives depends mainly on whether
    the SCSI host adapter is supported.


    # Optimal System Requirements


    The minimum install discussed earlier is not practical for running the X Window
    system or performing any major development. For running a windowing environment
    like X or performing any large-scale development, it is more sensible to have
    at least a Pentium 200 MHz Intel processor or its equivalent.


    # Processors


    The older Intel 386 and 486 processors came in two models: SX and DX. The difference
    between the two is that the SX model does not include a math coprocessor. Starting
    with the Pentium, math coprocessors were no longer required, as they were built
    into the CPU. For SX processors, Linux provides software emulation.


    # Memory


    It is recommended that system memory be at least 32 MB, if it is to run the X
    Window system. For memory-intensive applications, 128 MB is recommended. Depending
    on the number of users through terminal emulation, you may need more system memory
    per user. Generally, 16 MB per user is the standard minimum.


    # Swap Space


    In addition to system memory, Linux also needs swap space. Unused memory is copied
    to the swap device (which is usually a partition of a hard disk, but may also
    be a file) and removed from memory when free memory is needed. For older systems,
    it is generally recommended to allocate swap space equal to twice the system memory.
    However, with newer computers that include a large amount of memory, this advice
    typically requires too much swap space. Systems perform well with 64 to 128 MB
    of swap space.


    # Hard Drives


    The size of the hard drive is the user''s decision. Some Linux distributions can
    be installed in a partition as small as 20 MB. If the user wishes to install a
    larger distribution or more software, much more space will be needed. Some versions
    of Linux can be as large as 2 GB, but this includes all the development tools
    and the X Window system. The number of hard drives that can be added depends on
    type. An IDE interface supports two drives (most motherboards with two IDE interfaces
    for a total of four IDE drives), and SCSI supports up to 15 devices.


    # Video System


    Linux supports many types of video cards, such as CGA, EISA, VGA, or SVGA. The
    typical bus slots include ISA, EISA, VLB, PCI and AGP. Newer versions of X support
    3D acceleration cards, and support for more is currently being developed. Be sure
    to check online Linux support centers, such as http://lhd.datapower.com, for information
    about the support of video cards.


    # Input Devices


    Almost every input device can be used when running Linux. Trackballs, mice, joysticks,
    keyboards, and pen systems have Linux support. However, the user may have to do
    an extensive search for drivers in order to get the device to work. It is wise
    to stick to well-known devices. There is a better chance of finding support for
    a device in Linux if it is widely used.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_37_0.png)'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# CD-ROM and DVD Drives


    Linux supports nearly all SCSI CD-ROM and DVD drives and even some that rely on
    proprietary interfaces. 2.2 versions of the Linux kernel can only read CDs in
    DVD drives, but 2.4 kernel have full support for DVDs. DVD movies are supported,
    though this requires special patches to version 2.2


    # Removable Media


    Removable media devices, such as the popular lomega Zip and Jaz Drives, have no
    problem running with special drivers. Because these devices are widely used, there
    will be support for them. One may have to look for drivers on the Internet, if
    the devices are not included with the Linux distribution.


    # Printers and Modems


    Some brands and manufacturers may not have printer and modem drivers for Linux.
    The Web site http://lhd.datapower.com/ lists updates and available drivers. With
    the new and current versions of Linux, there should be no problem with modem support.
    Even with the new compression schemes, there should be software to make a modem
    work with the platform. Some modems like WinModems are designed for Microsoft
    Windows. They will not work under Linux because they are specifically made for
    Windows.


    # Network Adapters and Multport Cards


    Linux supports a large number of network adapters. This includes nearly all cards
    made by popular manufacturers such as Intel, 3COM, Novell, SMC. Linux also supports
    most multiport devices.


    > NOTE: It is advisable for the person installing Linux to be familiar with the
    computer onto which Linux is installed. There may be questions asked by the setup
    program that the installer needs to know, as such, "What com port is the modem
    set up for?"


    ![](img/b0ea5e4a55ee6767fff087672e71c505_38_0.png)


    SAIR Linux and GNU Certification -- Fundamentals/Linux/'
  merge: -1
  pgno: 38
