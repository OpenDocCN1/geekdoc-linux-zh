  md: '# Installation of Mandrake 8.0


    # Introduction


    Although some insight is given into options for various installations, in this
    tutorial we presume:


    +   - No hard drive partition (i.e. Linux is only OS)

    - No upgrade from a previous Linux version (initial install)

    - No shared hard disk

    - A bootable CD-ROM

    - A network connection

    - An Ethernet card


    # Before Installation


    +   - System Requirements:

    These are the minimum system specifications, required to successfully run Mandrake
    8.0


    +   - Hardware and Network Information:

    This is a list of the hardware that you will need to install and run Linux and
    a list of information regarding your hardware and network (if installing for a
    network computer)'
