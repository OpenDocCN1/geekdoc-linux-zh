  md: '# # Defining a Firewall


    Before a firewall can be set up, a default policy should be defined. This determines
    what happens to a packet that does not match any rule in a chain. There are two
    default policies, ACCEPT and DENY. The ACCEPT policy allows packets unless there
    is a specific rule to drop or reject it. DENY causes all packets to be dropped
    unless there is a specific rule to allow it through. Setting up a deny-by-default
    firewall is more work but generally more secure. Accept-by-default is easier,
    but more concern has to be given to the type of traffic that needs to be defined
    and how it might compromise the system. The following command can be


    ```

    $ ipchains -P INPUT

    ```


    Once the default policy is defined, a number of rules need to be added to specify
    how the firewall works. The way the commands are entered will differ depending
    on the default policy. ACCEPT statements will override a deny-by-default policy,
    and DENY or REJECT statements will override an accept-by-default policy. For example,
    the following will deny all incoming packets from the IP address 192.168.0.100
    on the first interface.


    ```

    $ ipchains -A input -i eth0 -s 192.168.0.100 -j DENY

    ```


    # # Types of Firewalls


    Several different types of firewalls exist and are defined by how they interact
    with connected networks. The simplest type is a bastion firewall, a single machine
    that protects one or more LANs from a larger network (usually the Internet). This
    type of firewall serves as a gateway, but it limits network traffic. Bastion firewalls
    are appropriate for situations in security is not very important, such as homes
    and small business networks. When using a bastion firewall, if a machine on the
    LAN sends data to the larger network, it is passed to the firewall. When a reply
    is sent, the firewall replaces the IP address of the source with the IP address
    of the firewall. Known as masquerading, this process requires special kernel support
    and that the mask option is specified in the rule specification.


    A screened host firewall works in a manner similar to a bastion firewall, but
    it does not automatically forward the connection to the appropriate host on the
    local network. This minimizes the risk that a connection passing the firewall
    will automatically gain local access network.


    The subnet firewall works by setting up a parameter network that offers public
    network services, such as Web and FTP. In this manner, a bastion firewall can
    separate the parameter network from the Internet, and the parameter network can
    make sure that the public services offered are not on the private network. This
    prevents them from being used as an avenue of attack on the LAN. In a subnet configuration,
    the parameter network is considered part of the firewall. This type of firewall
    is useful for sites that offer many public services.


    # # Squid Proxy Server


    A SOCKS server will filter all information that travels through the server, also
    caching it. A caching-only server will store the information, but not filter anything.
    This is good if the only concern is limiting network traffic; however, if the
    network needs to be filtered for any inappropriate usage, the SOCKS server will
    be necessary.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_264_0.png)'
  merge: -1
  pgno: 264
- img_proc: true
  md: Squid is a popular caching-only proxy server available for Linux. Caching means
    the server keeps a copy of anything that is passed through it for others to use.
    For instance, if someone goes to an Internet Web site, Squid will keep a copy
    of what he or she accessed on the server. The next time someone wants to go to
    that particular site, the Squid server will instead give it the copy the server
    held on. The benefit to this is that this will keep network traffic to the Internet
    to a minimum. The downside however is if the site updates fairly often, such as
    news sites, this information will not be transferred on every access attempt.
    All of this can be configured to allow direct access to a particular site, or
    update the material on particular sites more often than others, by editing the
    squid.conf file. Most browsers will also have to be configured for this to work
    correctly.
