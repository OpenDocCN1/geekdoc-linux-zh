  md: "# IP Addresses\n\n+   * Class A\n  * 0.0.0.0 to 127.255.255.255\n* Class B\n\
    \  * 128.0.0.0 to 191.255.255.255\n* Class C\n  * 192.0.0.0 to 223.255.255.255\n\
    * Class D\n  * 224.0.0.0 to 239.255.255.255\n* Class E\n  * 24.0.0.0 to 255.255.255.255\n\
    \n# IP ADDRESSES\n\nThe most important part of setting up a LAN is allocating\
    \ IP addresses, which are 32-bit numbers assigned to various hosts on the network.\
    \ They are split into four 8-bit numbers called octets to make them easy to read\
    \ and differentiate between the network number and host number. The leading octets\
    \ represent the network number, and the remaining three octets represent the host\
    \ number.\n\n# IP Address Classes\n\nIP addresses are divided into five classes\
    \ to serve various purposes. These classes are explained below:\n\n# Class A\n\
    \nClass addresses range from 0.0.0.0 to 127.255.255.255. Here, the first octet\
    \ represents the network number and the remaining three octets represent the host\
    \ number. Therefore, many hosts can be connected to the network using class A\
    \ addresses.\n\n# Class B\n\nClass addresses range from 128.0.0.0 to 191.255.255.255.\
    \ In this class, the first two octets represent the network number and the last\
    \ two octets represent the host number.\n\n# Class C\n\nClass addresses range\
    \ from 192.0.0.0 to 223.255.255.255. The first three octets represent the network\
    \ number, and the last octet represents the host number. This type of address\
    \ is used in small networks where only a few hosts are connected to the network.\n\
    \n# Class D\n\nClass addresses range from 224.0.0.0 to 239.255.255.255 and are\
    \ used for multicasting across separate physical networks."
  merge: -1
  pgno: 231
- img_proc: true
  md: '# IP Addresses 8-7


    # Class E


    Class E addresses range from 24.0.0.0 to 255.255.255 and are reserved for future
    use.


    The addresses 0.0.0.0 and 127.0.0.0 are reserved addresses for default route and
    loopback addresses, respectively. Default route is used to transmit data to hosts
    and networks not listed in the routing table. The loopback address is used to
    transmit data between the client and server located on the same host. The address
    127.0.0.1 is assigned to the loopback interface, which is the local host.


    Most LANs use C addresses, where the host on the network is recognized by the
    last octet. When assigning IP addresses in a LAN, the network must be divided
    into subnets. A subnet is a group of hosts that belong to the same LAN. All the
    hosts in a subnet are connected to the same hub and share the same IP address.
    Various subnets in the LAN are connected using routers. The first three octets
    of the IP address are the same for all subnets, but each subnet is differentiated
    by the last octet of its IP address.


    SAIR Linux and GNU Certification -- Fundamentals/Linux+'
