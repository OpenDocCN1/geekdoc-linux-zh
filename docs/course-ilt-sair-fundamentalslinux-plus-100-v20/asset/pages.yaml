  md: "# History of Linux\n\n+   * Unix at Berkeley\n  * Added many new features to\
    \ system\n  * Distributed new version under BSD\n* Unix System V Release 4\n \
    \ * AT&T moved Unix to Unix System Laboratories\n  * Remained monolithic system\n\
    * Enter Linux\n  * Open Source Software\n\n# HISTORY OF LINUX\n\nLinux is a Unix\
    \ variant; therefore, the creation of Unix is the beginning of Linux’s history.\
    \ Unix was developed by Ken Thompson and Dennis Ritchie in 1970 as a successor\
    \ to the previously developed Multics operating system. In 1973, Unix was rewritten\
    \ by the same developers in the new C programming language. An important feature\
    \ of C is that it can access the hardware architecture of a machine with a generalized\
    \ set of programming commands. Thus, writing Unix in C made machine independent;\
    \ Unix was able to run on many different systems while requiring little reprogramming.\n\
    \n![](img/b0ea5e4a55ee6767fff087672e71c505_13_0.png)\n\n# Unix at Berkeley\n\n\
    Unix was officially released and distributed by AT&T’s Bell Labs in 1972. One\
    \ of the users of this version, the University of California at Berkeley, added\
    \ many new features to the system and distributed a new version under the name\
    \ BSD (Berkeley Software Distribution). BSD proved to be a major rival to the\
    \ AT&T version. In the late 1970s, Berkeley released a powerful version called\
    \ BSD 4.2. This version had new file management features and networking features\
    \ based on the TCP/IP network protocols. The BSD versions continued to develop\
    \ through several releases."
  merge: -1
