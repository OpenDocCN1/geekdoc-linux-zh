  md: '# What Applications Are Included?


    +   * Piecing It Together

    * User chooses which packages to download

    * However, some packages are required

    * What''s a Tarbal?

    * Compressed file composed of other files

    * Proprietary vs. GNU/Free Apps

    * Proprietary can be bundled with costly commercial software


    # WHAT APPLICATIONS ARE INCLUDED?


    All of the different distributions provide software in the form of packages. A
    package is a special archive containing the software and installation information
    for the package manager. Most of the available packages for a distribution are
    included on the distribution CD and are typically available for download on the
    Internet. The main distributions often provide a categorized library of the packages
    and a short description of what they do. Some example categories are Network Tools,
    Graphics Utilities, or Development Tools. Packages can be selected during the
    Linux installation procedure or from a running Linux system. Many Linux users
    install software as it is needed, so having the distribution CD desirable. The
    distribution CD can be an invaluable resource when an Internet connection is unavailable
    or inefficient.


    # Piecing It Together


    If a user chooses not to download an entire distribution or elects not to buy
    a copy on CD, it is important that he or she understands which packages are required
    for the operating system to function properly. The distributions vary greatly
    in the number of categories and the names of these categories, so the user should
    be sure to check which packages are included in each. Red Hat divides its packages
    into 12 categories, some of which contain necessary data and some of which contain
    less important data, such as games. Most distributions provide a simple package
    that contains the base system for a minimal Linux system. This is often contained
    in System Environment, System Tools, or a similarly named category. The combination
    of the newest kernel, the base system, and the newest library can be used as a
    skeleton Linux system. It is a great starting point for users who want to build
    a system package by package. For most users, however it is best to either download
    the entire distribution or buy the CDs.'
  merge: -1
