  md: '# EDO


    Extended Data Output Dynamic Random Access Memory (EDO DRAM) is a type of DRAM
    that is faster than conventional DRAM. Unlike conventional DRAM which can only
    access one block of data at a time, EDO DRAM can start fetching the next block
    of memory at the same time that it sends the previous block to the CPU.


    # FPM


    Fast Page Mode RAM (FPM DRAM), is a type of DRAM that allows faster access to
    data in the same row or page. Page-mode memory works by eliminating the need for
    a row address if data is located in the row previously accessed. FPM DRAM is being
    replaced by memory types, such as SDRAM.


    > NOTE: FPM RAM is also called page mode memory.


    # BEDO


    Burst EDO DRAM is a type of EDO DRAM that can process four memory addresses in
    one burst. Unlike SDRAM, however, BEDO DRAM can only stay synchronized with the
    CPU clock for short periods (bursts). Also, it cannot keep up with processors
    whose run faster than 66 MHz.


    # SDRAM


    Synchronous DRAM is a type of DRAM that can run at much higher clock speeds than
    conventional memory. SDRAM actually synchronizes with the CPU buses and is capable
    of running at 133 MHz, about three times faster than conventional FPM RAM and
    twice as fast as EDO DRAM and BEDO SDRAM sets the stage for eliminating EDO DRAM.


    Today''s fastest Pentium systems use CPU buses running at speed over or over 100
    MHz, so SDRAM struggles to maintain their speed. Future PCs are expected to have
    CPU buses running 200 MHz or faster. SDRAM is not expected to support these speeds,
    which is why new memory technologies, such as RDRAM, SDRAM, and DDR RAM, are being
    developed.


    # RDRAM


    Rambus DRAM was developed by Rambus, Inc. SDRAM can deliver data at a maximum
    speed of 100 MHz, RDRAM transfers data up to 600 MHz.


    In 1997, Intel announced that it would license the Rambus technology for use on
    its future motherboards, making it the de facto standard for memory architectures.
    However, a consortium of computer vendors is working on an alternative memory
    architecture called SyncLink DRAM (SDRAM).


    RDRAM is already being used in place of VRAM in graphics accelerator boards. As
    of late 1999, Intel has been using RDRAM in its Pentium III Xeon processors and
    more recently in its Pentium 4 processors. Intel and Rambus are also making a
    new version of RDRAM, calledDRAM, that will support data transfer speeds up to
    1,600 MHz.


    # SDRAM


    SyncLink DRAM is being developed by a consortium of computer manufacturers called
    the SyncLink Consortium. SDRAM is competing with Rambus memory (RDRAM) as the
    future PC memory architecture. RDRAM chips are already in use on video boards
    and other devices, SDRAM is still on power. Moreover, Intel is backing RDRAM,
    which reduces the odds of SDRAM becoming an important technology.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_320_0.png)


    SAIR Linux and GNU Certification -- Fundamentals/linux+'
  merge: -1
