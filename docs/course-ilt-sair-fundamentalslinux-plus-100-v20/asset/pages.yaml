  md: "# Basic Shell Functions\n\n+   * Shell Redirection\n* Shell Scripts\n* Bash\n\
    * Running a Program in the Background\n  * Listing/stopping background programs\n\
    \  * Restarting background programs\n\n# BASIC SHELL FUNCTIONS\n\n# Shell Redirection\n\
    \nMost of the shells provide the facility to redirect the standard input and the\
    \ standard output. The standard output, or stdout, is the place where the output\
    \ of the program goes. Data being sent to the terminal screen is an example of\
    \ the standard output device. The standard input, or stdin, is a place from which\
    \ input comes to a program. The keyboard is a common input device. A simple form\
    \ of redirection can be shown by the example:\n\n```\n$ ls -al | more\n```\n\n\
    The output of the ls -al command is redirected to the standard input of the more\
    \ command instead of the standard output of the terminal. The more command processes\
    \ this redirected input and displays the results in the standard output. The pipe\
    \ (|) symbol allows the use of filters more and less, which redirect standard\
    \ input and output. The symbols < and > also redirect the standard input and output\
    \ to a file\n\n```\n$ ls -al > list_of_files\n```\n\nThe above command will redirect\
    \ the standard output by saving it in the file list_of_files.\n\nThe following\
    \ command will use the contents of the file document_name as an input to the mail\
    \ command. The contents will be sent as the body of the message.\n\n```\n$ mail\
    \ -s subject user@starwars.com < document_name\n```"
