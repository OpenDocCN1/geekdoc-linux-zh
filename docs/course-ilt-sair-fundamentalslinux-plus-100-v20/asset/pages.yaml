  md: '# 2-12 Module 2 — What to Know Before Installing Linux


    # Lab Exercises


    For this lab you will need:


    +   - A PC with a monitor and sound card.

    - Documentation included with the PC and associated hardware.

    - Internet access.


    # Part 1 - identification by documentation and visual check


    +   1. Locate manufacturer and model information on the monitor itself, such as
    ViewSonic E771 and record this information.

    2. In the monitor documentation, locate the horizontal and vertical sync ranges
    for the monitor and record this information. X Windows requires this information
    during installation.


    # Part 2 - Identification of cards and chipsets


    +   1. Locate the sound card and look for a manufacturer and model number printed
    on the board. If this information is present, record it.

    2. If no manufacturer and model information is printed on the board, look on the
    chips for manufacturer logos. Visit the web www.plasma-online.de, which has pictures
    of logos that might be printed on the chip, manufacturer serial numbers, and FCC
    IDs. Use these resources to gather as much information about the board as possible.


    # Part 3 - Linux compatibility check


    +   1. Visit the web www.ibiblio.org/pub/Linux/docs/HOWTO/Hardware-HOWTO-HOWTO
    and search for the sound card by the manufacturer and model.

    2. If the manufacturer and model for each piece of hardware is not found in this
    list, then the piece of hardware is not currently supported by Linux. If the information
    is present, then the hardware should work under current Linux distributions.


    # Lab 02 Questions


    The answers to these questions are in Appendix A at the end of this manual.


    +   1. Why is it important to ensure that hardware is compatible with Linux prior
    to installing the operating system?


    +   2. How can a user obtain hardware information with only a manufacturer name
    and model number?


    ![](img/b0ea5e4a55ee6767fff087672e71c505_45_0.png)'
