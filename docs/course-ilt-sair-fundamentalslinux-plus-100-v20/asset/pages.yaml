  md: 'private protocols. Some hardware vendors will not release the private data
    communication protocols that rest between the CPU and peripheral, thereby preventing
    others from writing device drivers for those devices. These newer devices tend
    have less hardware and require the CPU to perform more detailed operations.


    probing tradeoff. Probing is quite easy; however, all features are not necessarily
    caught in the probe. Thus, manual specification in the XF86Config file will override
    the probe values and enable the extra features.


    program assistance. Unlike Unix-like programs provide help information in response
    to one or more types of queries: -?, -h, or --help.


    ps command. Displays the number of processes activated by the user.


    pseudo file system. An entity that looks like a directory, but directly access
    to another kernel routine.

    read error. Error occurs when the system cannot correctly read the data on a particular
    media type.


    rc.d directory. Used by various distributions to hold the run level scripts.


    Red Hat attributes. The most available distribution, has an installation procedure,
    and X Window configuration tools.


    refresh rate. The higher the resolution, the more frequently the CRT must be refreshed.
    However, refresh rates are independent of the refresh rate.


    refresh rate, tradeoff. The more graphic information displayed, the slower the
    monitor refresh rate. Refresh rates of 60 per second or less tend to cause eyesight
    on the CRT.


    restricted account. The login process usually ends with a copy of the shell that
    is waiting for commands, and an account could be configured to run just one program.
    Termination of the program would also log the user out of the system.


    run levels. A group of programs (shell scripts) by run by the init program that
    determine the operating mode of the OS (i.e., single user, multi-user, etc). Two
    run levels over various distributions are run level 0, system shut down, and run
    level 6, to bring up the system.


    run levels, types of. (1) single-user (shell) at the console; (2) multi-user with
    networking; (3) multi-user with networking and GUI.


    screen section. Lists which graphics the X server should try to support (assuming
    the video adapter has the capability) and the size of the virtual desktop.


    scripts. Made of one or more shell commands in a file. Syntax differs among shells,
    but all scripts have flow control constructs.


    shell interactivity. The shell provides command history and command completion.
    Command history displays and replays previous commands. Command-completion specifies
    previously used directory names, file names, or commands when the <TAB> is pressed.


    shepherding software. The GPL revolutionizes thinking about software by changing
    it from protectionist to shepherding perspective. Software is distributed without
    control mechanisms, yet the software creator will watch the news groups to coordinate
    and otherwise mentor the software, while many people assist in the development.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_382_0.png)


    SAIR Linux and GNU Certification -- Installation and Configuration'
