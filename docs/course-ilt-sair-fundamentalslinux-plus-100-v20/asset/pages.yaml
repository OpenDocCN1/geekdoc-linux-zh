    \ to create virtual memory. More partitions can be added as needed.\n\n![](img/b0ea5e4a55ee6767fff087672e71c505_54_0.png)\n\
    \nPartitioning is necessary to install more than one operating system on a computer.\
    \ If MS-DOS is running on one partition, installing Linux on another is relatively\
    \ simple. However, if working with a non-partitioned MS-DOS hard drive, one would\
    \ either defragment the hard drive and run a partition resizer or delete the existing\
    \ operating system, partition the drive, and reinstall MS-DOS. Creating a partition\
    \ deletes data in the space taken up by the new partition. Therefore, take precautions\
    \ when installing Linux on a hard disk that already contains data. All Linux distributions\
    \ give the option of partitioning at install time. Three main tools a Linux install\
    \ process may use to partition a hard drive are fdisk, cfdisk, and Disk Druid.\n\
    \n# Using fdisk\n\nfdisk is one of the most popular disk partitioning utilities.\
