    user interface allows the selection of topics from various usage areas.


    init.d directory. Used by various distributions to hold internal scripts.


    initialization files, X Window system. The xdm and xtarts programs use separate
    initialization files to control the same GUI setup. The xinitrc is used by startx
    and xdm uses the Xsession initialization file. The Xsession contents have higher
    priority than the commands in the xtarts file.


    insmod. Loads drivers at runtime.


    insmod, tradeoff. Insmod gives the administrator the flexibility to adapt to many
    possible configurations by allowing new drivers to be added at run time; however,
    the drivers should be compiled into the kernel to achieve better performance.


    internal commands. Some commands appear to be stand-alone utilities, such as the
    cd command, but they are internal to the shell and do not respond to help requests.


    Internet installation. Must set up directories, transfer files, and check directory
    structure; this is very slow and error prone.


    IP address. An Internet protocol logical address assigned by a central authority
    that provides a way for others to reach your computer.


    keyboard repeat rate. The rate at which the computer repeats a particular character/symbol,
    when its corresponding is continuously depressed.


    kill command. Sends a signal to the specified program and can terminate it.


    kill jobs. By switching to another login port, you can identify and terminate
    a program that has locked up, without having to reboot the system.


    LAN Network installation. Using FTP, NFS, or Samba protocols, read the installation
    from another Linux OS or MS-DOS file system; it is a quick installation process.


    LILO. The Linux loader uses the BIOS to read from the floppy, hard disk, or CD-ROM
    to boot Linux.


    LILO append field. The append argument allows the system administrator to provide
    custom configuration arguments to the kernel.'
