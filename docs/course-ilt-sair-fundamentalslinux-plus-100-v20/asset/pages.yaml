  md: '# 7-12 Module 7 — Linux Applications


    Joe is started with the command joe and will load a file when initializing joe
    [filename]. When Joe begins, a status bar appears at the top of the screen, which
    gives information about the current file. The different fields across the top
    are keyboard mode, the name of the file, the position of the cursor, and a note
    of the helpers for the help command. There are two modes that the keyboard may
    be in: insert mode or overwrite mode. Insert mode will insert text without overwriting
    what is there while overwrite mode will write over any present text. To exit Joe,
    press <CTRL-C>; the program will introduce a dialogue asking if the user wishes
    to save changes to the file currently in.


    The interactive help in Joe has a user-friendly interface. Typing <CTRL-K <h>
    will open a help screen located at the top of the screen that does not interfere
    with the current work we are in. The help file displays the commands to move the
    cursor through the text, the search for expressions, delete, copy, and paste text,
    open the spelling dialogue, and manipulate files.


    Joe is a simple text editor. It does not support any formatting (such as justification,
    margins or centering); it presents the novice user with an easier method of editing
    text files than the involved Vi and Emacs programs.


    # Cool Edit


    Cool Edit is an Windows-based text editor. Cool Edit can perform many functions
    related to text editing, such as formatting, printing, and editing. It is highly
    configurable in both appearance and usage. Starting Cool Edit from the command
    line of an X terminal is accomplished by typing:


    ```

    $ coedit [options] [filename]

    ```


    Cool Edit has other uses besides editing. It provides an interface to compilers
    and debuggers, extensibility for the Python programming language, and supports
    formatted editing of any programming language files. Cool Edit appearance configuration
    includes editing details from the size of the window to the way that the pixels
    are displayed inside the program. There are also configuration options for Cool
    Edit that specify commands and keystrokes, as shown in Table 7-7.


    | Options | Function |

    |---|---|n| -geometry [options] | Configures the geometry of the window by listing
    options, such as size and position of window. |

    | -columns [NN] | Sets the number of columns in a window to NN. |

    | -lines [NN] | Sets the number of lines in a window to NN. |

    | -font [font name] | Sets the default font for a session to font name. |

    | --word-wrap | Sets the length of a line to NN. |

    | --autoparagraph | Formats each paragraph every time it is edited by a user.
    |

    | [deathstar] | Starts Cool Edit with the file deathstar loaded. |


    Table 7-7. Common Options for Configuring Cool Edit


