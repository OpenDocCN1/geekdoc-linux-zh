  md: '# Unix System V Release 4


    AT&T moved to a new organization called Unix System Laboratories. The new organization
    attempted to develop a standard of Unix by integrating different versions of it.
    The result of this organization''s effort was System Release 4. This release incorporated
    almost all of the features found in System V release 3, BSD release 4.3, Sun Microsystems''
    Sun OS, Xenix, and Microsoft''s desktop version of Unix. A group of other companies,
    including Hewlett-Packard and IBM, developed their own standard called the Open
    Software Foundation in response to System V 4. In 1993, Unix System Laboratories
    was taken over by Novell''s Unix Systems. Novell developed its own System V 4-based
    version called Unix Ware, which was designed to interact with the Novell Network
    System. The Unix System 4 is currently owned by Santa Cruz Operation Inc.


    One of the disadvantages of Unix was that throughout its development, it remained
    a monolithic system that required workstations or mincomputers in order to operate.
    Unix was seldom used outside or university environments. The emergence of personal
    computers brought the PC version of Unix into existence. However, this version
    was expensive and lacked the power and flexibility of those versions that ran
    on computers.


    # Enter Linux


    In 1991 Linux had a humble beginning as a personal project of Linus Torvalds,
    a 21-year-old computer student at the University of Helsinki. At that time Torvalds
    was working with an operating system Minix, which was created by Professor Andrew
    S. Tanenbaum for Intel-based microprocessor. Minix was a small, Unix-like operating
    system which did not have all the functionality of a Unix operating system. Torvalds
    wanted to create an effective PC version of Linux for Unix users. Torvalds published
    his thoughts on the USENET newsgroup os.minix. In mid-September 1991, Torvalds
    released the first version of Linux, version 0.01. This version was not executable
    and contained only the rudimentary of the kernel source. On Oct. 5, 1991, Torvalds
    released the first working version of Linux, version 0.2. The new version had
    the capability to run the bash shell and the GNU Compiler, but still lacked important
    features like user support, documentation, and distribution.


    After the release of version 0.03, Torvalds brought the version up to 0.10, as
    the number of people involved in the development increased. By version 0.11, Linux
    had grown to include multilingual keyboards, floppy disk drivers, VGA, EGA, and
    many other external devices. Torvalds released version 0.95 as an indicator that
    the kernel was close to being ready for an official release. However, a year and
    a half later, the kernel was still being revised and had reached 0.9 patch level
    14. Finally, in March 1994, the first official Linux 1.0 was released. The developments
    continued with Linux being widely distributed over the Internet. Thousands of
    programmers all over the further refined Linux and added new features and applications
    found in standard Unix systems. Linux supports a number of applications, utilities,
    Internet tools, programming tools, word processing tools, and Graphical User Interfaces.


    # Open Source Software


    From the beginning, Linux was intended to be open source software. This meant
    it could be freely accessed, modified, and enhanced by anyone. Open source software
    started out in the late 1970s with the GNU Project and Free Software Foundation,
    founded by MIT employee Richard Stallman. The project''s aim was to provide free,
    quality software to the general public. The project managed to build many utilities
    that were later used in building applications for Linux. Stallman also designed
    a legal tool called the GNU GPL (General Public License), which was used to ensure
    that the software produced by GNU remained free. Linux is also covered under the
    GNU GPL.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_14_0.png)


    SAIR Linux and GNU Certification --- Fundamentals/Linux+'
  merge: -1
