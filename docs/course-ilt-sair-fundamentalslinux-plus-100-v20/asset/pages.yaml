  md: "# # Post-Installation\n\n+   - Core Dumps\n  - Causes of core dumps\n  - Using\
    \ core dumps\n- Process Control\n  - The top command\n  - The ps command\n  -\
    \ The kill command\n  - The killall command\n\n# Core Dumps\n\nA core dump occurs\
    \ when an error occurs during the execution of a program. Core dumps are used\
    \ to identify bugs in a program by supplying a user with a capture of the contents\
    \ of the RAM at the point when the error occurred.\n\n# Causes of core dumps\n\
    \nCore dumps will occur if a program is incompletely or improperly installed,\
    \ or if the software needs a patch. If this is the case, one should either reinstall\
    \ the software or contact the vendor to see if there are any patches that need\
    \ to be downloaded and applied.\n\nCore dumps may also occur if some of necessary\
    \ libraries are missing or not-to-date. Keep libraries, such as lib5, QT, or GTK,\
    \ current in order to lessen the chances of encountering core dumps.\n\nA resource\
    \ conflict will also sometimes cause a core dump. Even if system hardware seems\
    \ to be working fine, there may still be conflicting base addresses that cause\
    \ core dumps. To solve this, one should try assigning different base addresses\
    \ to the hardware to eliminate the conflict.\n\n# Using core dumps\n\nIf a user\
    \ does not plan to use information in core dumps for any reason, they may be deleted.\
    \ If one wishes to keep core dumps from being saved on the hard disk, the *ulimit*\
    \ command in the /etc/profile file may be used. The *ulimit* command should be\
    \ placed in the file as follows:\n\n```\nulimit -c 0\n```\n\nThis command will\
    \ limit the number of core dumps on a system to zero, effectively stopping core\
    \ dumps from being saved to disk."
  merge: -1
