  md: '# 10-42 Module 10 — Hardware


    # Trackball


    Regular trackball have a hollow cavity that contains a trackball, a solid steel
    ball bearing coated with a layer of rubber. Inside the cavity, the ball bearing
    touches two shafts, or rollers that translate the ball''s movement into cursor
    movement on the screen. One of the rollers corresponds to the X-axis and translates
    ball movement into horizontal cursor movement on the screen. The other roller
    corresponds to the Y-axis and translates ball movement into vertical cursor movement
    on the screen.


    # Optical mice


    A newer addition to the mouse market is the optical mouse. This mouse does not
    use a trackball operates using infrared technology. The mouse has an LED diode
    on its bottom, which emits a light beam. The beam is read by a sensor, which sends
    the information to a digital signal processor (DSP). The DSP compares the beam
    to recorded surface images and translates them into cursor movement on the screen.
    The advantage of optical mice over the regular ones is they have almost no moving
    parts, making them less prone to malfunctions due to dirt and extended use.


    # Optical pens


    Optical pens were developed before optical mice, and operate on a similar principle.
    Though primarily used as barcode-reading devices, optical pens are used as pointing
    devices and are occasionally optimized for direct touch-screen input.


    # Joysticks


    Joysticks were widely used in older-generation computer games but not as much
    in professional applications. Patterned after the airplane control stick, a joystick
    consists of a platform and a handle that contains two or more control buttons.
    When it first came off the assembly line, the joystick was simply designed, clumsy,
    and inflexible. Current joysticks are quite sophisticated in design and offer
    many features, but their usefulness is mainly limited to computer gaming.


    # Touch pads


    Widely used on laptops, touch pads are smooth, flat-surface pointing devices designed
    to sense the touch of a finger and translate it into cursor movement. The touch
    pad surface can also be pressed or lightly tapped to generate the same effect
    as clicking the mouse button.


    # Other devices


    There are several other types of devices on the market that represent variations
    and/or combinations of the above. The cordless mouse, for instance, communicates
    with a particular machine similarly to a television remote control. Another example
    is a static mouse that has the trackball on the top of its housing. This enables
    the user to keep the mouse stationary while moving the cursor on the screen by
    simply rolling the trackball. Finally, the cordless keyboard allows freedom from
    the restriction of remaining connected to the computer case.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_345_0.png)'
