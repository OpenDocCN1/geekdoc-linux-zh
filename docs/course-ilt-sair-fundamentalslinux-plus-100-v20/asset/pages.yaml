    # Surge Protectors


    Computer devices are only capable of handling a certain amount of electricity.
    When a power surge occurs, it can destroy computer components. A surge protector
    that follows the UL 1449 standard protects computers from large amounts of electricity
    from passing through the power supply. A second surge protector should be placed
    between the modem and the phone line.


    # UPS (Uninterruptible Power Supply)


    A UPS system is a backup power supply for the computer. Ideally, the UPS system
    will provide uninterrupted power to the computer long enough for the primary power
    supply to return or for the system to be properly shutdown. The general UPS system
    consists of an input line, switch, battery, and output line. UPS systems range
    in sizes, styles, and price. The most common styles are listed below.


    # Standby UPS


    The input line takes AC power from a primary power source and sends it to the
    output line. There is a mechanism to switch the AC to DC in order to charge the
    internal battery. Whenever, the primary power supply is not providing input, the
    switch turns on the battery. The UPS system converts the DC current from the battery
    to AC current for the computer. This switchover takes a millisecond, which should
    not affect the computer. The standby UPS is the least expensive style of UPS and
    provides a minimal amount of surge protection and backup power.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_347_0.png)'
  merge: -1
  pgno: 347
- img_proc: true
  md: '# Ferroresonant standby UPS


    This style of UPS is similar to the standby UPS except for the ferroresonant transformer
    found just before the output line. The transformer serves two purposes:


    +   - Stabilizes the electricity from the input to the output line

    - Provides an added buffer against sudden loss of power (reduces the fraction
    of a second power loss when switching between primary and secondary power supplies).


    # Line-interactive UPS


    The line-interactive style has a combined battery charger and AC/DC converter.
    The combined unit filters the input line and increases the response time between
    the UPS. This style is commonly found in household and business UPS systems.


    # Online UPS


    An Online UPS system eliminates any lag between a power outage and UPS current.
    An Online UPS system maintains a steady stream of power to an AC to DC/DC to AC
    circuit. This is done with conditioned electrical power inverted from an AC to
    DC/DC to AC circuit. An Online UPS system provides complete protection against
    surges, brownouts, transient switching, line noise, and extreme line frequency
    variation. For these reasons an Online UPS system is more expensive than a Standby
    system, but provides complete protection for mission critical applications.


    The most reliable protection will contain the following specifications, found
    on the packaging of surge protectors and UPSs.


    +   - UL 1449 rating

    - Low clamping voltage (400 or less)

    - Response time (10ns or less)

    - Energy dissipation (200+ joules)

    - Three-way protection

    - Extra jacks (co-axial, phantom).'
  merge: -1
