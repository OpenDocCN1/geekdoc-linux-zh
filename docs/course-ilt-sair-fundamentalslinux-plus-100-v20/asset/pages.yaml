    # Wide SE cabling or P cables and connectors


    There are two types of wide SE cables that are used for external connections and
    one type that is used for internal connections. These 68 pin cables used for connecting
    wide SCSI devices using SE signaling are known as P cables. These cables and the
    connectors that they use are outlined below:


    External High Density "P" cable: This cable was introduced in the SCSI-3 SPI-2
    specification. It is a high density 68 pin cable that uses the larger Alternative-3
    external HD connector:


    ![](img/b0ea5e4a55ee6767fff087672e71c505_331_1.png)


    Figure 10-6. Male External Alternate-3 P Connector


    External Very High Density P cable (VHDCI): This cable was introduced in the SCSI-3
    SPI-2 specification. It is a very high density cable used to connect newer SCSI
    devices. This cable uses an Alternative-4 micro-centronics connector. The newest
    devices, however, only operate over LVD signaling:


    ![](img/b0ea5e4a55ee6767fff087672e71c505_331_2.png)'
  merge: -1
  pgno: 331
- img_proc: true
  md: '![](img/b0ea5e4a55ee6767fff087672e71c505_332_0.png)


    Internal High Density cable: This cable was introduced in the SCSI-2 specification.
    It is a high density 68 pin ribbon cable. This cable connects with rectangular
    68 pin "Alternative-3" connectors. It is the most popular internal SCSI connector.


    # LVD cabling


    LVD cabling is the newest SCSI cabling method and is used exclusively by most
    devices. Although, LVD cabling appears physically identical to SE cabling, SE
    cabling should not be used for an LVD bus. Since SE cables use a lower category
    of wire, data errors will result if they are used on a LVD bus.


    External LVD connections use 68 pin HD and VHDCI cables. LVD cables will be marked
    LVD or LVD Compliant, so there should be no confusion if a certain cable is actually
    an LVD cable.


    Internal LVD connections use 68 pin Twist-N-Flat cables and will be marked as
    LVD or LVD Compliant.


    # Single Connector Attachment (SCA)


    Single Connector Attachment (SCA) or the "Alternative-4" connection is used to
    connect a SCSI device directly to the system without the use of a cable. SCA uses
    an 80 pin connector that replaces the standard 68 pins of the data, the 4 power
    pins, and several jumpers. SCA is mainly used in RAID configurations that support
    hot swapping, since it is easier to disconnect and reconnect a device if it does
    not have several cables attached to it. Also, SCA includes special guides so that
    the 80 pin connector on the back of the drive will fit into place in the system
    without the installer having to see the connection being made. The current specification
    for SCA is SCA-2.


    # SCSI cable adapters


    One of the biggest issues with SCSI is problems connecting different types of
    devices due to different types of connectors or different buffer sizes. Fortunately,
    there are several types of adapters that can be used to solve most of these problems.


    # Wide/Narrow adapters


    Wide/Narrow adapters are used to connect a wide SCSI device to a narrow SCSI cable
    or to connect a narrow SCSI device to a wide SCSI cable.


    # Internal/External adapters


    Internal/External adapters allow an internal SCSI cable to be used outside of
    the PC case.


    # Mechanical Connector adapters


    Mechanical Connector adapters are the most common type of SCSI adapter. These
    adapters allow different physical connectors to be attached together.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_332_1.png)'
  merge: -1
  pgno: 332
- img_proc: true
  md: '# Signaling Method Adapters


    Signaling Method Adapters are electrical adapters that allow LVD devices to be
    used on SE chains or SE devices to be used on LVD chains. Due to the complicated
    electronics required to perform this conversion, these adapters are rather expensive.
    The cost of replacing the drive, adapter or cable is usually less than the cost
    of one of these adapters.


    # SCA adapters


    SCA Adapters allow SCA drives to be used on regular systems that do not support
    SCA.


    # SCSI Host Adapters


    Most computers today do not include SCSI support built in to the motherboard,
    a purchase of a SCSI host adapter or SCSI controller is needed to connect a SCSI
    bus to a computer. There are different types of host adapters and these differences
    must be understood to insure that a certain adapter will be compatible with the
    computer it will be installed in and the devices it will connect to.


    # Compatibility issues


    The first consideration that must be made when choosing a SCSI host adapter is
    whether it is compatible with the system. Any new host adapter will require a
    PCI slot for installation. Although other ISA adapters are available, these adapters
    will cause serious bottlenecks the ISA has a much narrower transfer rate of 8
    MB/s. An ISA adapter should only be used with older SCSI drives, SCSI CD-ROMs
    or any device that does not depend on speed. Also, the purchaser should make sure
    that his system meets the minimum requirements and a supported operating system.
    These requirements will be listed on the box of every adapter or at the manufacturer''s
    Web site.


    # Mode, signaling and connection support


    The consumer must be careful to purchase a host adapter that is compatible with
    his or her existing system or will work with the system being designed. The purchaser
    should make sure the adapter supports the required mode, signaling type and connection
    type.


    # PCI bottlenecks


    Currently, the fastest SCSI controller, Ultra160, supports a bus speed of 160
    MB/s while 32 bit PCI only supports a bus speed of about 132 MB/s. Obviously,
    the 32 bit PCI bus will be the bottleneck in the situation (assuming that there
    are enough devices connected on the SCSI bus to utilize 160 MB/s). Today, most
    machines do not support 64 bit PCI (which supports a transfer rate of over 200
    MB/s) so adding a Ultra160 configuration to machines is becoming much common on
    motherboards designed for use in high end server/workstations. The consumer should
    check to see which of PCI his supports supports buying a Ultra3 SCSI, Ultra160
    SCSI or any other controller card that has a bus speed of over 100 MB/s.


    # Automatic configuration


    Many new SCSI host adapters allow the card to be configured entirely through software.
    This may be a valuable feature if it will be a problem to remove the computer
    case to reconfigure the SCSI ID or to disable termination in the host adapter.
    If a host adapter supports automatic configuration, it will be advertised as supporting
    this feature.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_333_0.png)'
  merge: -1
  pgno: 333
- img_proc: true
  md: '# SCSI Bus Configuration


    Luckily, the actual configuration of SCSI is simple as long as compatible devices,
    cables and connectors are used. The material presented far should be adequate
    to assure that the hardware is compatible. This section will detail the steps
    required to configure a SCSI bus with many devices.


    # Number of supported devices


    Although most configurations will only have a few devices, SCSI can support up
    to 7 or 15 devices in addition to the host adapter. Narrow (8-bit) buses can support
    7 extra devices and wide buses can support up to 15 extra devices. Since SCSI
    devices no longer add the word to the name and SE configurations may have length
    requirements for certain numbers of devices, Table 10-8 has been provided which
    lists the maximum number of devices for the SCSI modes under different circumstances:


    | Mode | Maximum Number of Devices |

    |---|---|

    | Regular SCSI | 8 |

    | Wide SCSI | 16 |

    | Fast SCSI | 8 |

    | Wide Ultra SCSI | 16 |

    | Ultra SCSI | 8 if HVD is used or SE is used with a cable less than 1.5m; 4 if
    SE is used with a cable over 1.5m |

    | Wide Ultra SCSI | 8 if HVD is used or SE is used with a cable up to 1.5m; 4
    if SE is used with a cable over 1.5m |

    | Ultra2 SCSI | 8 if HVD is used or LVD is used with a cable up to 12m in length;
    2 if LVD is used with a cable over 12m |

    | Wide Ultra2 SCSI | 16 if HVD is used or LVD is used with a cable up to 12m in
    length; 2 if LVD is used with a cable over 12m |

    | Ultra3 SCSI | 16 for cables up to 12m in length; 2 for cables over 12m |

    | Ultra160 SCSI | 16 for cables up to 12m in length; 2 for cables over 12m |

    | Ultra60+ SCSI | 16 for cables up to 12m in length; 2 for cables over 12m |

    | Ultra320 SCSI | 16 for cables up to 12m in length; 2 for cables over 12m |


    Table 10-8. Number of Support Devices for Different SCSI Modes


    As shown by the figure above, narrow SCSI buses support 8 devices. Wide buses
    support 16 devices, unless signaling is used with Ultra SCSI or better devices,
    or an LVD longer than 12 meters is used.


    # Maximum cable length


    The different signaling methods support various lengths under different conditions.
    While the actual cable used in a configuration will probably be much shorter than
    the longest supported cable, this will not be the case in every situation. Table
    10-9 lists the maximum length of a SCSI cable using signaling methods and different
    numbers of devices:


    ![](img/b0ea5e4a55ee6767fff087672e71c505_334_0.png)'
