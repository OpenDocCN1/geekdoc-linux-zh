  md: '# Module 10 — Hardware


    # 4. Core voltage


    The core voltage of a processor is directly related to the amount of power consumption.
    A lower value means less power will be consumed.


    # 5. Cache


    The system cache nothing more than high speed memory. Most modern computers have
    at least a level one (L1) cache, which is usually stored on the CPU, and a level
    two (L2) cache. The L2 cache is generally much larger than the L1 cache. It is
    also important to note that cache built on the processor is generally much faster
    than cache that sits on the motherboard.


    # 6. Cache frequency


    The cache frequency determines how fast information is accessed from the cache.
    The frequency of the cache is measured in MHz as well. Higher values are preferred.


    # 7. Architecture


    The architecture is the family of processor. For instance, Intel has the Pentium,
    Pentium Pro, Pentium II, Pentium III, and Pentium 4 processor families.


    # 8. Micron process


    The micron manufacturing process determines the size of the die that must be used
    to achieve the desired performance. A smaller micron process yields cheaper and
    faster processors.


    # Slots and Sockets


    Modern processors connect to the motherboard in two ways: sockets and slots. These
    connections include slot 1, slot A, socket 370, and socket 7, socket 423, and
    socket 478. Intel processors use slot 1, socket 370, socket 7, socket 423, and
    socket 478. While AMD processors use slot A and socket 7 connections. It is important
    to differentiate between the different connections.


    # Slot I


    A slot 1 connector is a 242 pin connector for pentium II/III and some older Celeron
    processors. Intel introduced slot 1 to replace socket 7 and socket 8 connectors
    of previous processors. Slot 1 processors can be packaged in three ways:


    +   - Single edge package package (SEPP)

    - A single edge contact cartridge (SECC)

    - As a single edge contact cartridge 2 (SECC2)


    # Slot A


    Slot A is a 242 pin connector like the slot 1 connector; however, slot A is used
    for AMD Athlon processors. Slot connections accept processors packed as a card
    module (CM), which looks similar to Intels SECC2 packaging. Slot A and slot 1
    are mechanically identical. However, they are not compatible, because AMD and
    Intel use different protocols and signals.


    # Socket 370


    The socket 370 connection is a 370 pin connection. It accepts processors packed
    as a ceramic pin array (CPGA), flip chip pin grid array (FC-PGA), and plastic
    pin grid array (PPGA). Socket 370 motherboard accept Pentium III and Celeron processors.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_315_0.png)'
  merge: -1
  pgno: 315
- img_proc: true
  md: '# Socket 7


    Socket 7 connectors are 321 pin connectors which accepts Intel Pentium, Intel
    Pentium MMX, AMD K5, and AMD K6 processors. Socket 7 and socket 370 look the same;
    however, they have a different number of pins.


    # Socket 423


    Some Pentium 4 processors use the socket 423 connection. The socket 423 connector
    is a 423 pin connector.


    # Socket 478


    Newer Pentium 4 processors will use socket 478. A socket 478 connection is much
    smaller than the previous socket 423 connection. In addition to being smaller
    than the 423, it has 278 pins instead of 423.


    # Identifiable Processor Markings


    Another important aspect of processor is its markings. Processor markings allow
    users to visually inspect a processor to determine information, such as operating
    voltage, speed, bus, and amount of cache. Intel markings for the Pentium II and
    III processors are generally much easier to read than the AMD markings. AMD markings
    require matching various symbols to meanings.


    # AMD processor markings


    This section will use an example marking for an AMD-K6 processor.


    ```

    AMD-K7 800MPRS52A

    ```


    This example is subdivided into nine sections:


    +   1. Processor family or architecture.

    In the example the family is the K7 line of processors.


    +   2. CPU clock frequency.

    All numbers in this section are measured in Mhz. Also a speed marking of 100 =
    1000Mhz.


    +   3. Package type.

    M is a card module, and P is a PGA


    +   4. Operating (or core) voltage.

    T = 1.6V

    P = 1.7V

    N = 1.8V


    +   5. Max case temperature.

    R = 70 degrees C


    +   6. Size of L2 cache.

    5 = 512KB

    1=1Mb

    2=2MB


    +   7. Cache divisor.

    1=1/2

    2=2/5'
