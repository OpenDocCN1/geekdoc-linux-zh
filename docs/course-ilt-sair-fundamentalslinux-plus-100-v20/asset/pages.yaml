  md: '# Lynx


    Lynx is a powerful text-based Web browser. It is released under the GPL and is
    freely distributable. The advantage of Lynx is its small drain on resources, the
    small amount of hard disk space that it requires, and (perhaps most) its speed.
    Lynx is one of the fastest browsers for displaying a document. It can be run on
    consoles under X Windows. There are releases for Microsoft Windows 95/98/NT, Unix,
    DOS, and OS.


    Lynx can be obtained from lynx.browser.org in source code packages, or binaries
    can be obtained from www.trl-home.com/lynx/binaries.html. Compiling Lynx is straightforward
    and does not require root access; it requires configuration of certain files depending
    on your system.


    To run Lynx, use the command Lynx. The default page is the home of Lynx, lynx.browser.org.
    This screen shows the default page of Lynx:


    ![](img/b0ea5e4a55ee6767fff087672e71c505_201_0.png)


    Figure 7-5. Default Page for Lynx


    # Options


    The options across the bottom give directions for moving around in Lynx. The <h>
    key will open a help screen, with the <o> key directing the user to a configurable
    options page. The <p> key allows the user to print the document, and the <g> key
    opens the dialogue for moving to another page on the Internet. The <m> key will
    return the user to the main screen. The <q> key quits the program, with backlash
    (/) and the <DEL> key used to navigate within the present document. Figure 7-6
    is a sample from the Options page:


    ![](img/b0ea5e4a55ee6767fff087672e71c505_201_1.png)


    Figure 7-6. Lynx Options Page'
  merge: -1
  pgno: 201
- img_proc: true
  md: 'With the Options page, a user can specify whether to accept preferences such
    as cookies, which emulation of keys would be preferable (such as Emacs, Vi, or
    Pico), where a bookmark should be stored, or how FTP servers should be handled.
    It is also possible to edit the lynx.cfg file, the main configuration file for
    Lynx, and from the Options page in Lynx.


    # Printing


    The Print command in Lynx is versatile. Lynx will allow printing of the document
    to a hard-copy printer through the Print command. Lynx can also save the document
    to a local file, the e-mail, or print out the source of the document through the
    Print command.


    There are options that can be passed to Lynx on the command line. A basic option
    is to provide a URL with the Lynx command. For example, the command $ lynx http://metalab.unc.edu
    will open Lynx and then open the Web page http://metalab.unc.edu. A local directory
    can also be specified (lynx/). A complete list of options can be be obtained from
    the lynx (1) man page, Table 7-8 contains descriptions of some common options
    used in Lynx:


    | Option | Function |

    | --- | --- |

    | -accept_all_cookies | Lynx accepts all cookies sent to the browser |

    | -book | The startpage is the user''s bookmark file |

    | -cache=NUMBER | NUMBER is the number of documents cached, with a default of
    10 |

    | -color | Turns the color mode on, if it is available |

    | -editor=EDITOR | External program editing is enabled, with the editors specified
    (such as Emacs, Vi, and Ed) |

    | -ftp | FTP access is disabled |

    | -index=URL | The index file is default URL for the session |

    | -(no)print | This specifies if printing options will be disabled |

    | -trace | Logging of the Lynx session is enabled |

    | -use_mouse | Mouse support is enabled, if it is available, allowing for left
    clicking on a link to move through documents and other features |

    | -version | This prints the version number of Lynx |


    Table 7-8. Common Options Used in Lynx


    # Other Browsers


    Although most people use Netscape to browse the Internet, Lynx and Netscape are
    not the only Web browsers available for Linux. There are several alternatives
    to these Web browsers.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_202_0.png)


    SAIR Linux and GNU Certification -- Fundamentals/Linux'
  merge: -1
  pgno: 202
- img_proc: true
  md: '# Module 7 — Linux Applications


    # Mosaic


    Mosaic is the original Web browser, and original versions of Netscape were based
    on source code from it. NCSA is no longer working on Mosaic, although they still
    maintain a site that provides information and downloads for it. Mosaic provides
    enough features to display text and graphics but lacks many features of modern
    browsers, such as e-mail clients.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_203_0.png)


    Figure 7-7. The Mosaic Browser


    # Mozilla


    The Mozilla Web browser is an open source Web browser being developed with help
    from Netscape. The goal of the Mozilla project is to use open source development
    to create the best possible Web browser. Most of the development is done by the
    open source community, and it is managed by the staff at Netscape.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_203_1.png)


    Figure 7-8. The Mozilla Browser'
  merge: -1
  pgno: 203
- img_proc: true
  md: 'Unlike some of the alternative browsers, Mozilla contains a Web browser, e-mail
    client, HTML editor, and address book. Mozilla also has many other unique features,
    such as the ability to use skins to change the look of the interface and advanced
    searching options.


    Currently, Mozilla is still in development and has some time before it can be
    used by everyone; the current developmental releases are used by those who do
    not require all the features of the full version.


    # Opera


    Another popular alternative browser is Opera. It has been available on the Windows
    platform for some time and has attracted a small but devoted following of users.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_204_0.png)


    Figure 7-9. The Opera Browser


    Opera is a simple Web browser and does not have many of the advanced features
    of Netscape and Mozilla. However, it provide the functionality needed to be an
    efficient Web browser. Since Opera is ported from Windows, it has the look and
    feel of a Windows application. This is most visible in the dialog boxes that are
    being used for some functions, such as saving a file.


    A drawback to Opera is the fact that it is commercial software. Therefore, Opera
    is not open source, and it must be bought in order to use beyond the trial period.


    # w3m


    w3m is a text-based browser similar to Lynx, yet unlike Lynx, w3m is capable of
    displaying tables and frames like a graphical Web browser. w3m is a useful alternative
    for those who would like to preserve the formatting of Web pages but do not wish
    to have graphics.


    The following are several advantages that w3m has over Lynx:


    +   * w3m''s key bindings are more intuitive.

    * Lynx style key bindings are available in w3m.

    * w3m has a slight learning curve for those familiar with Lynx.

    * w3m has a more flexible color coding scheme applied to the text to distinguish
    text from other text.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_204_1.png)'
  merge: -1
  pgno: 204
- img_proc: true
  md: 'In general, w3m is a useful text-based Web browser, but it is not capable of
    performing the higher functions of other Web browsers. w3m is recommended for
    systems with limited capabilities.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_205_0.png)


    Figure 7-10. w3m Text Based Browser'
