  md: '# Basic Linux File Commands 5-23


    When using chmod, abbreviations for users, operators, and permissions are used
    for assigning permissions to files.


    | | | |

    |---|---|---|

    | | u | User who owns the file. |

    | | g | Users within the file''s group. |

    | | o | Users not in the file''s group. |

    | | a | All of the above users (user, group, other). |

    | Operators | = | Assigns permissions and removes permissions for fields not specified.
    |

    | | + | Adds permissions. |

    | | - | Removes permissions. |

    | Permissions | r | Read access. |

    | | w | Write access. |

    | | x | Executable access. |

    | | u, g, o, a | Substitutes permissions (rw) from specified group; Write permissions
    are not set to the o group by using this method.|


    Table 5-21. Abbreviations for the chmod Command


    Using the symbols in Table 5-21, an expression can be constructed to assign permissions.
    In addition, numbers may be used to assign permissions to files or directories.
    Permissions for the file owner, group, and everyone else come in the form XYZ,
    where X is the file owner, Y is users within the file''s group, and Z is every
    other user. The values of XYZ are made by adding together the following values:


    ```

    1-execute

    2-write

    4-read

    ```


    This allows all combinations of the three. Refer to Table 5-1 in the File Properties
    section of this module for more information.


    # Examples


    In the following examples, file is used as a generic placeholder for the file
    or directory being changed.


    Assign all permissions to all users:


    ```

    $ chmod 777 file

    $ chmod a=rwx file

    $ chmod a+rwx file

    $ chmod u=rwx,g=rwx,o=rwx file

    $ chmod u+rwx,g+rwx,o+rwx file

    ```


    Remove all permissions for all users:


    ```

    $ chmod 000 file

    $ chmod a=file

    $ chmod u=,g,o=file

    $ chmod a-rwx file

    $ chmod u-rwx,g-rwx,o-rwx file

    ```


    ![](img/b0ea5e4a55ee6767fff087672e71c505_132_0.png)


    SAIR Linux and GNU Certification -- Fundamentals/Linux+*'
