    64 bytes from 64.41.207.50: icmp_seq=7 ttl=51 time=77.7 ms

    64 bytes from 64.41.207.50: icmp_seq=8 ttl=51 time=77.0 ms

    64 bytes from 64.41.207.50: icmp_seq=9 ttl=51 time=77.1 ms

    ---

    www.phantommemory.com ping statistics

    10 packets transmitted, 10 packets received, 0% packet loss

    round-trip min/avg/max = 76.9/77.2/77.8 ms

    ```


    In the example above, the user does not need to exit the ping with any key sequence:
    the -c option shuts ping and displays the statistics after 10 packets are sent
    and received. In this instance, the user receives 0 percent packet loss.


    Problems may be encountered using the ping command. If a host is extremely busy,
    or if there is trouble between the user''s computer and the host, packets can
    be dropped, discarded, or simply lost. When this occurs, traceroute, a network
    command which gives more detail about the path a packet takes to reach a host,
    which can be used.


    # traceroute


    traceroute is a network utility that is used to follow the path from one computer
    to a host computer. It essentially scans, or backtracks, the path that a network
    connection took to get to the host computer. traceroute can be helpful when trying
    to determine if there is a break in the path between two computers.


    The traceroute command accomplishes the tracking of each router by sending data
    packets to the individually connected routers and attaches a Time To Live (TTL)
    value. For the first router, or hop, it sends out a default of three packets where
    the TTL field is set to 0, so the router reaches the TTL field and generates an
    ICMP error message. The originating computer should receive the ICMP error message;
    traceroute judges the RTT for packet and determines the router''s information
    from the generated ICMP error message.


    Once the first packets are sent and traceroute receives the ICMP error messages,
    it increases the TTL field by one and resends the three packets. In this way,
    traceroute receives output from the next router along the path to the host destination.
    The TTL field is increased by sending three packets across the network until the
    host is reached, or until the maximum number of hops is reached (default of 30).


    While traceroute is sending packets, receiving ICMP error messages, and increasing
    the TTL field incrementally, it is also outputting its information to the screen
    so that the path is visible to the user.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_243_0.png)'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# Basic Commands for Networking 8-19


    # Interpreting output


    The output of traceroute contains the IP address of the router and the TTL. These
    values are displayed on the screen for analysis. Each IP address has the three
    TTL values indicating the packets sent to that particular router. These parameters
    tell when the packets were sent and the amount of time it took for the packets
    to make the round trip back to the originator, RTT. If an asterisk appears in
    place of a TTL value, then a packet likely failed to reach its destination, which
    could indicate a break somewhere along the path to that destination. An example
    of using the traceroute command is:


    ```

    traceroute [URL or IP address of host ] [-dFI nrvx] [-f

    firstTTL] [-g gateway]

    [-iface] [-m max_ttl] [-p port]

    [-q queries] [-s src_addr] [-t tos]

    [-w waittime] host [packetlen]

    ```


    The URL or IP address points to the destination host, and the letters in the brackets
    are the flags and options available with the traceroute command. A comprehensive
    list of options and flags can be found in the traceroute (8) manual. The following
    demonstrates the use of traceroute to determine the path from the user''s computer
    to www.starwars.com.


    NOTE: Lines 28 were eliminated from the example. These lines contain asterisks
    identical to the lines above and below them.


    | traceroute to www.starwars.com (64.21.207.50), 30 hops max, 38 byte packets
    |

