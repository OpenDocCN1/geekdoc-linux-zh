  md: '# Making a new directory


    To create a new directory, click the File option on the menu bar line, then click
    on New. A dialog box will open. Choose Directory from that dialog box and enter
    the name of the new directory. The new directory will be shown in the directory
    tree window.


    # Copying a file


    The easiest way to copy a file from one location to another is to right click
    on the file to be copied. An option list will be displayed. Choose Copy, then
    specify the desired location for the file.


    # Moving a file


    Follow the same steps as in the copy operation, but this time select Move instead
    of Copy.


    # Renaming a file


    Follow all of the same steps used to copy or move a file, but this time select
    Properties. A dialog box will open when the file name may be changed.


    # Deleting a file


    To delete a file, select it and press <DEL>. GMC will ask for confirmation of
    deletion, and if the operation is confirmed, then the file will be deleted. To
    delete multiple files, use the file selection method for multiple files before
    pressing <DEL>.


    # Changing ownership or permissions


    To change the ownership of a file or directory, select the desired file or directory
    and press the right mouse button. This will open a list of options. Choose Properties
    from that list. Another dialog box will open, in which the Permission tab may
    be used to change all the needed permissions.


    # Other File Managers


    As listed at the beginning of this section, there is a wide array of other file
    managers available. Table 6-3 is a list of file managers and Web sites where they
    may be found.


