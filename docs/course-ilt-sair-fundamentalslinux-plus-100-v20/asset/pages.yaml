  md: '# Using find and locate


    The find Command


    +   - Finds files or directories

    - Search by name or wildcards


    The locate Command


    +   - Performs a search

    - Offers less control over search method


    ![](img/b0ea5e4a55ee6767fff087672e71c505_143_0.png)


    # USING FIND AND LOCATE


    When a user is looking for a certain file, but is not quite sure where it is stored,
    the find and locate commands are useful. Each command has its own way of finding
    files and directories. Users need to be able to decide which tool to use.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_143_1.png)


    # The find Command


    The find command is a very powerful tool used to find files or directories. The
    form of the command is shown in Table 5-26.


    | <directory> | <expression> | <action> |

    |---|---|---|

    | The directory in which the search begins. | What data the program searches for.
    | How the findings are reported. |


    Table 5-26. The find Command


    The specified directory for the beginning of the search may look like it will
    only search that directory, but it will also search subdirectories contained within
    the specified directory. The directory to be searched can be very specific or
    general as a search of the entire system. Either way, the search will be performed
    in a similar manner.


    There are two ways to search for a file. The search can be for a specific name,
    such as file.txt, or wildcards, as *.txt, file*, or ?use can be used. The form
    of the command to search for an example file, file.txt, would be:'
  merge: -1
  pgno: 143
- img_proc: true
  md: '```

    $ find -name file.txt -print

    ```


    or


    ```

    $ find -name "*.txt" -print

    ```


    The <expression> specifies the criteria that is being searched, which in this
    case is -name. However, the options -atime, -user, and -group could also be used.
    Therefore, the <expression> for the previous command is -name file.txt. The -name
    option is the most commonly used option because it allows the user to search for
    a file or directory by name. However, other options may be used for other data
    giving the user the ability to conform the program to the needs of his or her
    search; this finds a very valuable tool.


    The last part of the command structure is the action the program should take once
    the data has been found. Typically, the user performs a search by the name and
    will find the results displayed on screen. The data can be displayed using the
    -print action; however, any valid Linux command can be run here using instead
    of -print. The format for this is:


    ```

    $ find -name file -exec command ;

    ```


    The \ at the end of the command is required. If the command is to be run on the
    files just found, then a right brace {} can be used to represent the file.


    ```

    $ find -name file -exec command {} \

    ```


    The ability to perform a specific search for data and the manipulation of data
    can make the find program very versatile and powerful tool for both the beginner
    and the advanced user.


    # The locate Command


    The locate command, like find, performs a search. Unlike find, locate offers the
    user less control over the method in which the data is hunted. The locate program
    operates by searching for all files and directories that match and contain the
    search parameters. The search for the word


    ```

    $ locate text

    ```


    would yield any files or directories that contain the string text. The program
    will return every file in a directory if a directory matches the parameters, due
    to the match pathname. For instance,


    ```

    $ locate usr

    ```


    would return every file and subdirectory in the /usr/ directory. The inaccuracy
    of the program is also its main benefit. While find performs specific searches,
    locate looks for generality. This feature proves to be helpful when the user is
    unsure of where a file is located or uncertain of the file.


    Unlike find, which searches the actual directory, locate searches a database of
    the system. This database must be updated from time to time, which is usually
    done in a cron job. The database can be manually created or updated with the updatedb
    command.


    The use of both find and locate makes searching for files much easier. What may
    have taken hours of searching can be reduced to a matter of seconds if programs
    are used correctly. The program provides an excellent resource for the more defined
    search, while the locate program allows for some liberty in the search for a file
    or directory.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_144_0.png)


    SAIR Linux and GNU Certification -- Fundamentals/+'
