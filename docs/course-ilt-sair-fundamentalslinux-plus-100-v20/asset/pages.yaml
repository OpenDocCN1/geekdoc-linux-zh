  md: '# DDR RAM


    Double Data Rate-Synchronous DRAM is a type of SDRAM that supports data transfers
    on both edges of each clock cycle, effectively doubling the memory chip''s data
    throughput. DDR-SDRAM is also called SDRAM II.


    NOTE: SDRAM only supports data transfers on one edge of each clock cycle.


    # SGRAM


    Synchronous Graphic Access Memory (SGRAM) is a type of DRAM used on video adapters
    and graphics accelerators. Like SDRAM, SGRAM can synchronize itself with the CPU
    bus clock to speeds of 100 MHz. In graphics, SGRAM uses several other techniques,
    such as masked writes and block writes, to increase bandwidth for graphics-intensive
    functions.


    NOTE: Unlike VRAM and WRAM, SGRAM is single-ported. However, it can open two memory
    pages at once, which simulates the dual-port nature of other video RAM technologies.


    # VRAM


    Video RAM is a special purpose memory used by video adapters. Unlike conventional
    RAM, VRAM can be accessed by two different devices simultaneously. This enables
    the RAMDAC to access the VRAM for screen updates at the same time that the video
    processor provides new data. VRAM yields better graphics performance but is more
    expensive than normal RAM.


    # RAMDAC


    Random Access Memory Digital-to-Analog Converter (RAMDAC) is a single chip placed
    on video adapters to convert digitally encoded images into analog signals that
    can be displayed by a monitor. A RAMDAC consists of four components: SRAM to store
    the color map and three digital-to-analog converters (DACs), one for each of the
    monitor''s red, green, and blue electrons


    # WRAM


    WRAM is similar to VRAM in its operation, but it offers about a 25 percent higher
    bandwidth, in addition to several graphics features that developers may take advantage
    of. These include double-buffering data system times faster than VRAM''s buffer,
    which provides considerably faster refresh rates.


    # RIMM


    RIMM is often associated with Rambus In-line Memory Module, however RIMM is not
    an acronym. It is a trademark of Rambus Inc. RIMM technology is based on the technology
    used in RDRAM chips. It is similar to a DIMM package but uses different pin settings.
    Rambus trademarked the term RIMM as an entire world. The term used for a module
    using Rambus technology


    # ROM


    Read Only memory (ROM) is almost always used in computers to hold instructions
    for the computer boot/start process. Unlike RAM, ROM cannot be written to (it
    is non-volatile).


    # PROM


    Programmable Read-Only memory (PROM) is a memory chip on which programs can be
    stored. But once the PRO has been used, it cannot be wiped clean and used to store
    something else. Like ROMs, PROMs are non-volatile.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_321_0.png)'
  merge: -1
