  md: "# Reviewing the BIOS Settings\n\n+   * Categories\n  * Main\n  * Advanced\n\
    \  * Power\n  * Boot\n  * Exit\n  * Sub-Categories and Settings\n  * Should only\
    \ be changed by experienced users\n\n# REVIEWING THE BIOS SETTINGS\n\nThe BIOS\
    \ of a machine allows a user to make changes to a system's basic configuration.\
    \ Devices such as the CD-ROM and floppy drive are enabled and disabled from the\
    \ BIOS. The system's time and date are stored in the BIOS as well. When Linux\
    \ is being installed, certain devices are used more than once. Because of this,\
    \ it is a good idea to become familiar with BIOS device settings.\n\nFirst, the\
    \ BIOS must be accessed at system startup. Not all setup utilities are the same,\
    \ nor are they started in the same way; most setups are similar. The first screen\
    \ the computer displays after it is turned on or rebooted is the boot screen.\
    \ This screen will have instructions on how to enter the setup utility. This usually\
    \ calls for little more than pressing <DELETE>, <F2>, or any one of the function\
    \ keys while the system is performing primary self-checks. Below is a screen image\
    \ of boot screen:\n\n![](img/b0ea5e4a55ee6767fff087672e71c505_39_0.png)\n\nFigure\
    \ 2-1. Boot Screen"
  merge: -1
