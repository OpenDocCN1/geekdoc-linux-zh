- img_proc: true
  md: 'LVD devices do not support self-termination due to technical reasons.


    # Host adapter termination


    Most host adapters on the market today will self-terminate if they are configured
    to do so. This is usually desired since the host adapter is usually in the middle
    of the SCSI bus between the external and internal devices. If the host adapter
    is not at the end of the SCSI cable, self-termination must be disabled.


    # Types of termination


    Different signaling methods require different types of termination. LVD and HVD
    signaling require special types of terminators; however, SE signaling will work
    with passive, active, or forced perfect termination. The former is the cheapest
    and will not work well in faster configurations. The latter is the best type of
    termination for SE signaling, however, it is also the most expensive. Table 10-10
    lists the termination required by the different types of SCSI:


    | Mode | Type(s) of termination |

    |---|---|n| Regular SCSI | Using SE, active, passive, or forced perfect can be
    used. For HVD, HVD must be used. |

    | Wide SCSI | Using SE, active, passive, or forced perfect can be used. For HVD,
    HVD must be used. |

    | Fast SCSI | Using SE, active or forced perfect can be used. For HVD, HVD must
    be used. |

    | Fast Wide SCSI | Using SE, active or forced perfect can be used. For HVD, HVD
    must be used. |

    | Ultra SCSI | Using SE, active or forced perfect can be used. For HVD, HVD must
    be used. |

    | Wide Ultra SCSI | Using SE, active or forced perfect can be used. For HVD, HVD
    must be used. |

    | Ultra2 SCSI | For LVD, LVD must be used. For HVD, HVD must be used. |

    | Wide Ultra2 SCSI | For LVD, LVD must be used. For HVD, HVD must be used. |

    | Ultra3 SCSI | LVD must be used. |

    | Ultra160 SCSI | LVD must be used. |

    | Ultra160+ SCSI | LVD must be used. |

    | Ultra320 SCSI | LVD must be used. |


    Table 10-10. Termination Requirements


    Since most LVD devices will also operate in SE mode, special LVD/SE terminations
    are sold that will switch to active termination if the bus signaling switches
    to SE.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_336_0.png)


