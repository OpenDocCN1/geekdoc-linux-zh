    As shown above, the physical limitations of SE becoming more of a problem as the
    speed of the device increases. This is the main reason why SE signaling is no
    longer supported in newer devices.


    # Bus topology and termination


    SCSI devices must be connected in a straight chain, which is known as bus topology,
    to function properly. The chain cannot branch at any point and on both ends of
    a SCSI chain, there must be a terminator to absorb the signals that are sent over
    the cable. If there is not a terminator on each end of the cable, a signal will
    bounce back and forth on the cable interfering with the next transmitted signal.
    If a terminator is placed after the last device but at the very end of the cable,
    signal reflection will occur.


    A properly configured SCSI bus will look something like the following:


    ```

    [Terminator]===[Device_1]===[Device_2]===[Host_Adapter]===[Device_3]===[Terminator]

    ```


    # Self-terminating devices


    Many devices on the market today will automatically terminate the SCSI bus if
    they are configured to do so. There is usually a jumper or switch that will turn-termination
    on and off. If a device is used to terminate the bus instead of a terminator,
    the device must be placed at the very end of the SCSI bus. A properly configured
    bus with a self-terminating device will look something like the following:


    ```

    [Device_1_with_termination_enabled]===[Host_Adapter]===[Device_2]===[Terminator]

    ```


    ![](img/b0ea5e4a55ee6767fff087672e71c505_335_0.png)'
  merge: -1
