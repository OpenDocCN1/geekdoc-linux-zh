- img_proc: true
  md: '# Installation of Slack Linux version 8.0.0


    # Introduction


    +   - Although some insight is given into options for various installations, in
    this tutorial we presume:

    - No hard drive partition (i.e. Linux is only OS)

    - No upgrade from a previous Linux version (initial install)

    - No shared disk

    - A bootable CD-ROM

    - A network connection

    - An Ethernet card


    # Before Installation


    +   - System Requirements:

    - These are the minimum system specifications, required to successfully run Mandrake
    8.0

    - Hardware and Network Information:

    - This is a list of the hardware that you will need to install and run Linux and
    a list of information regarding your hardware and network (if installing for a
    network computer);'
  merge: -1
  pgno: 400
- img_proc: true
  md: '# System Requirements


    +   - Minimum Requirements

    - 386 Processor or higher

    - CD-ROM Drive

    - 16 Mbyte RAM

    - Approximately 500 MB free hard disk space


    # Hardware and Network Information


    +   - Graphics card Manufacturer and memory size in Mbytes

    - Monitor scan rates (vertical/horizontal)

    - Optional Network Information:

    - Hostname of computer

    - Domain name of network


    # Step 1: Begin the Installation


    +   - Press Enter to begin installation

    - You will be prompted to choose a keyboard map. Default is a standard US keyboard,
    so press Enter at the prompt.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_401_0.png)'
  merge: -1
  pgno: 401
- img_proc: true
  md: '# Step 2: Log in


    ? Type root and press enter


    ![](img/b0ea5e4a55ee6767fff087672e71c505_402_0.png)


    # Step 3.1: Partition the Hard Drive


    +   - The next series of slides will carry you through the process of partitioning
    a hard drive


    +   - Type fdisk /dev/hda to format the hard drive and press enter


    ![](img/b0ea5e4a55ee6767fff087672e71c505_402_1.png)


    # Step 3.2: Partition the Hard Drive


    +   - To view the menu of commands, in fdisk, type m and press Enter


    +   - Create a new partition by typing n and press Enter


    ![](img/b0ea5e4a55ee6767fff087672e71c505_402_2.png)'
  merge: -1
  pgno: 402
- img_proc: true
  md: '# Step 3.3: Partition the Hard Drive


    ? Type p and press

    Enter to create a

    primary partition

    ? Type 1 and press

    Enter to indicate this

    is the first partition.

    This will be our swap

    partition


    ![](img/b0ea5e4a55ee6767fff087672e71c505_403_0.png)


    # Step 3.4: Partition the Hard Drive


    ? Begin the partition on

    the first cylinder

    ? Set the partition size

    +1M


    ![](img/b0ea5e4a55ee6767fff087672e71c505_403_1.png)


    # Step 3.5: Partition the rest of the Hard Drive


    ? Use the rest of the

    drive in a second

    primary partition to

    hold the OS

    ? Type n and press

    Enter

    ? This is the second

    partition, so type 2

    and press Enter


    ![](img/b0ea5e4a55ee6767fff087672e71c505_403_2.png)'
  merge: -1
  pgno: 403
- img_proc: true
  md: '# Step 3.6: Partition the Hard Drive


    +   - Type Enter to begin the partition on the default selection

    - Type Enter to end the partition on the default selection


    ![](img/b0ea5e4a55ee6767fff087672e71c505_404_0.png)


    # Step 3.7: Partition the Hard Drive


    +   - Type p to view the partition information


    ![](img/b0ea5e4a55ee6767fff087672e71c505_404_1.png)


    # Step 3.8: Partition the Hard Drive


    +   - You must specify that the first partition is a swap partition

    - Type t and press enter

    - Select the first partition by typing 1 and press Enter


    ![](img/b0ea5e4a55ee6767fff087672e71c505_404_2.png)'
  merge: -1
  pgno: 404
- img_proc: true
  md: '# Step 3.9: Partition the Hard Drive


    +   - Type the Hex Code to the swap partition

    - To view Hex Codes, type the letter l and press Enter

    - Linux swap partition is Hex Code 82

    - Type 82 and press Enter


    ![](img/b0ea5e4a55ee6767fff087672e71c505_405_0.png)


    # Step 3.10: Partition the Hard Drive


    +   - Confirm the swap by typing p and pressing Enter

    - Write the changes to the partition table by typing w and pressing Enter


    ![](img/b0ea5e4a55ee6767fff087672e71c505_405_1.png)


    # Step 4: Run Setup


    +   - Type setup and press Enter to run the setup program, which will enable you
    to configure your system


    ![](img/b0ea5e4a55ee6767fff087672e71c505_405_2.png)'
  merge: -1
  pgno: 405
- img_proc: true
  md: '# Step 5.1: Addswap


    +   - Assuming that the keyboard configuration is satisfactory, we first wish
    to set up the swap partition

    - Select ADDSWAP and then enter


    ![](img/b0ea5e4a55ee6767fff087672e71c505_406_0.png)


    # Step 5.2: Addswap


    +   - The program successfully detected the swap, which was created using fdisk,
    so select Yes and then Enter


    ![](img/b0ea5e4a55ee6767fff087672e71c505_406_1.png)


    # Step 5.3: Addswap


    +   - Select "Exit" and enter to confirm the configuration


    ![](img/b0ea5e4a55ee6767fff087672e71c505_406_2.png)'
  merge: -1
  pgno: 406
- img_proc: true
  md: '# Step 6: Continue Installation


    +   - Select "Yes" and then enter to continue with the installation


    ![](img/b0ea5e4a55ee6767fff087672e71c505_407_0.png)


    # Step 7.1: Root Partition


    +   - The root partition should be detected automatically

    - Select OK and then Enter


    ![](img/b0ea5e4a55ee6767fff087672e71c505_407_1.png)


    # Step 7.2: Root Partition


    +   - Select Check to minimize the existence of bad blocks during the format

    - Select OK and press Enter


    ![](img/b0ea5e4a55ee6767fff087672e71c505_407_2.png)'
  merge: -1
  pgno: 407
- img_proc: true
  md: '# Step 7.3: Root Partition


    +   - The default inode density is highlighted

    - Press OK and then Enter


    ![](img/b0ea5e4a55ee6767fff087672e71c505_408_0.png)


    # Step 7.4: Root Partition


    +   - Select Exit and Enter to confirm the configuration


    ![](img/b0ea5e4a55ee6767fff087672e71c505_408_1.png)


    # Step 8: Continue Installation


    +   - Highlight Yes and then Enter, to proceed


    ![](img/b0ea5e4a55ee6767fff087672e71c505_408_2.png)'
  merge: -1
  pgno: 408
- img_proc: true
  md: '# Step 9: Select Media Source


    +   - Select 1 since we are installing from a CD-ROM

    - Select OK and then Enter


    ![](img/b0ea5e4a55ee6767fff087672e71c505_409_0.png)


    # Step 10: Continue Installation


    +   - Highlight Yes and then Enter, to proceed


    ![](img/b0ea5e4a55ee6767fff087672e71c505_409_1.png)


    # Step 11: Select Packages


    +   - For a full installation of the pre-selected software, highlight OK and then
    Enter


    ![](img/b0ea5e4a55ee6767fff087672e71c505_409_2.png)'
  merge: -1
  pgno: 409
- img_proc: true
  md: '# Step 12: Continue Installation


    +   - Highlight Yes and then Enter, to \continue


    ![](img/b0ea5e4a55ee6767fff087672e71c505_410_0.png)


    # Step 13: Select Prompting Mode


    +   - Select full for a full

    installation

    - Select OK and then\enter


    ![](img/b0ea5e4a55ee6767fff087672e71c505_410_1.png)


    # Step 14: Make a Boot Disk


    +   - You can choose to

    make an optional

    boot disk

    - For this installation,

    we opt not to make a

    boot disk so

    highlight Continue

    and press Enter


    ![](img/b0ea5e4a55ee6767fff087672e71c505_410_2.png)'
  merge: -1
  pgno: 410
- img_proc: true
  md: '# Step 15: Modem Configuration


    +   * Select a callout device to correspond to your modem

    * This system does not have a modem, so select that option and press Enter


    ![](img/b0ea5e4a55ee6767fff087672e71c505_411_0.png)


    # Step 16: Screen Fonts


    +   * If you want to try out fonts, highlight Yes and then Enter

    * You may always change the fonts, after installation, so we will not install
    them at this time


    ![](img/b0ea5e4a55ee6767fff087672e71c505_411_1.png)


    # Step 17: LILO Installation


    +   * Select simple for automatic illo installation

    * Select OK and then Enter


    ![](img/b0ea5e4a55ee6767fff087672e71c505_411_2.png)'
  merge: -1
  pgno: 411
- img_proc: true
  md: '# Step 18: Frame Buffer Console


    +   * 1024x768x64k for optimum X Window performance

    * Select OK and then Enter


    ![](img/b0ea5e4a55ee6767fff087672e71c505_412_0.png)


    # Step 19: Select LILO Destination


    +   * Select MBR to install to Master Boot Record

    * Select OK and then Enter


    ![](img/b0ea5e4a55ee6767fff087672e71c505_412_1.png)


    # Step 20: Mouse Configuration


    +   * Choose your mouse type and press Enter


    ![](img/b0ea5e4a55ee6767fff087672e71c505_412_2.png)'
  merge: -1
  pgno: 412
- img_proc: true
  md: '# Step 21: Install gpm


    +   - You can choose to install the option gpm program


    ![](img/b0ea5e4a55ee6767fff087672e71c505_413_0.png)


    # Step 22: Continue Installation


    +   - Select Yes and press Enter to configure the network settings


    ![](img/b0ea5e4a55ee6767fff087672e71c505_413_1.png)


    # Step 23.1: Network Configuration


    +   - The installer attempts to automatically configure the mail and TCP/IP settings

    - Press Enter to continue


    ![](img/b0ea5e4a55ee6767fff087672e71c505_413_2.png)'
  merge: -1
  pgno: 413
- img_proc: true
  md: '# 23.2: Network Configuration


    +   - Enter your host name and press Enter


    ![](img/b0ea5e4a55ee6767fff087672e71c505_414_0.png)


    # 23.3: Network Configuration


    +   - Type your domain name and press Enter


    ![](img/b0ea5e4a55ee6767fff087672e71c505_414_1.png)


    # 23.4: Network Configuration


    +   - Setup your IP address

    - For this installation we chose DHCP, so further IP setup was unnecessary


    ![](img/b0ea5e4a55ee6767fff087672e71c505_414_2.png)'
  merge: -1
  pgno: 414
- img_proc: true
  md: '# 23.5: Network Configuration


    +   - Identify network interface card (NIC)

    - Select Probe and press Enter


    ![](img/b0ea5e4a55ee6767fff087672e71c505_415_0.png)


    # 23.6: Network Configuration


    +   - NIC is automatically detected

    - Press Enter


    ![](img/b0ea5e4a55ee6767fff087672e71c505_415_1.png)


    # 23.7: Network Configuration


    +   - Complete network configuration and continue


    ![](img/b0ea5e4a55ee6767fff087672e71c505_415_2.png)'
  merge: -1
  pgno: 415
- img_proc: true
  md: '# Step 24: Configure Sendmail


    +   - Choose the appropriate setting and press Enter


    ![](img/b0ea5e4a55ee6767fff087672e71c505_416_0.png)


    # Step 25.1: Setup Hardware Clock


    +   - Choose how the hardware clock should be setup and press Enter


    +   - For this installation we chose No


    ![](img/b0ea5e4a55ee6767fff087672e71c505_416_1.png)


    # Step 25.2 Setup Hardware Clock


    +   - Choose your Time Zone and press Enter


    ![](img/b0ea5e4a55ee6767fff087672e71c505_416_2.png)'
  merge: -1
  pgno: 416
- img_proc: true
  md: '# Step 26: X Window Manager


    +   - We chose the GNOME desktop

    - Select OK and then Enter


    ![](img/b0ea5e4a55ee6767fff087672e71c505_417_0.png)


    # Step 27.1: Root Password


    +   - Select Yes here to set a root password and then Enter


    ![](img/b0ea5e4a55ee6767fff087672e71c505_417_1.png)


    # Step 27.2: Root Password


    +   - Type in a new password and press Enter

    - Retype password and press Enter

    - Press Enter to continue


    ![](img/b0ea5e4a55ee6767fff087672e71c505_417_2.png)'
  merge: -1
  pgno: 417
- img_proc: true
  md: '# Step 28: Setup Complete


    +   - Press Enter to complete the setup


    ![](img/b0ea5e4a55ee6767fff087672e71c505_418_0.png)


    # Step 29: Exit and Reboot


    +   - Select Exit to leave the setup program

    - Select OK and then Enter

    - At the prompt, type reboot and press Enter


    ![](img/b0ea5e4a55ee6767fff087672e71c505_418_1.png)


    # Step 30: Login


    +   - When the system reboots, you will be brought to a login prompt

    - Login as root


    ![](img/b0ea5e4a55ee6767fff087672e71c505_418_2.png)'
  merge: -1
  pgno: 418
- img_proc: true
  md: '# Step 31: Create User Account


    +   - Type

    useradd -m aaron

    - Type passwd aaron

    - Enter a password for aaron and confirm it

    - Logout as root and login using your user account


    ![](img/b0ea5e4a55ee6767fff087672e71c505_419_0.png)'
  merge: -1
  pgno: 419
