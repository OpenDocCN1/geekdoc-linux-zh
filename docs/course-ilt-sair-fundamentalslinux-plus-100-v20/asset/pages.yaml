  md: 'The user''s identity is verified here. This tells the login shell to grant
    access to the account. While all accounts should have passwords to verify that
    a user is allowed to log in, they are not required. It is a bad idea to leave
    a system open by not requiring a password. When a user enters a password, the
    login shell turns off. But it is still entered. This is done for security, so
    that no one can see the password as it is being entered.


    If the password or username entered is incorrect, the following error message
    will be displayed and another login prompt will appear:


    ```

    Login incorrect

    login:

    ```


    Remember, information entered during the login process is case sensitive, make
    sure the caps lock is off before logging in.


    # Authentication


    When the login name and password are entered, the login program checks information
    in the /etc/passwd file for confirmation. If the system employs shadow passwords,
    then the login program checks the /etc/shadow file to find the user''s password.


    Next, the shell will return a prompt similar to this:


    ```

    [robert@biggs robert]

    ```


    The user robert is currently logged into a Linux session. If logged in as root,
    the prompt will look something like this:


    ```

    [root@biggs root]

    ```


    # Changing Users


    Switching to a different user is possible with su. This does not open a login
    shell, but merely opens the new user''s shell with effective UID. After entering
    su, the user will be prompted as:


    ```

    [robert@biggs robert]$ su john

    Password:

    ```


    Again, echoing will be turned off, and the password will not be displayed on the
    screen. If the wrong password is entered for the selected user, in this case john,
    the su program will return the following error:


    ```

    su: incorrect password

    [robert@biggs robert]$

    ```


    If the password is correctly entered, the following prompt will be displayed:


    ```

    [john@biggs robert]$

    ```


    To verify the identity of the current user logged in, enter whoami at the command
    line prompt:


    ```

    [robert@biggs robert]$ whoami

    bbiggs:robert tty1 Jun 21 15:22

    ```


    ![](img/b0ea5e4a55ee6767fff087672e71c505_82_0.png)


    SAIR Linux and GNU Certification -- Fundamentals/Linux'
  merge: -1
