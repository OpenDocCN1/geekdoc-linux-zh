  md: '# LAB 02 - IDENTIFYING HARDWARE


    # Purpose


    The purpose of this lab is to teach a user how to identify hardware and determine
    whether or not it will be compatible with Linux. The user learn to do this by
    checking hardware documentation, visually checking the hardware, and referring
    to online documentation to find out if Linux supports the hardware. Once a user
    is able to do this, he or she will be capable of determining whether or not an
    existing system will be able to support Linux and make any changes to system hardware
    that will allow a system to support Linux.


    # Lab Duration


    10 to 15 minutes.


    # Overview


    There are dozens of different types of hardware, and hundreds of different hardware
    manufacturers. With advancements in hardware technology, new types and versions
    of hardware are constantly appearing on the market. It would be impossible for
    an operating system to support every piece of hardware that exists; however, Linux
    does support a great deal of hardware, with an ever-increasing range of supported
    types.


    Prior to installing Linux, a user will need to be able to identify his or her
    hardware and see if it will be compatible with Linux. This is a simple but necessary
    step.


    First, a user should check the documentation that was shipped with the hardware
    in question. This documentation will contain all of the information necessary
    to identify the hardware. This includes the manufacturer name, the model name,
    and other hardware specific information. If a system was premanufactured, but
    was not shipped with specific information on the hardware it contains, a user
    may wish to contact the system manufacturer to obtain this information.


    If no documentation on the hardware is available and the manufacturer is not able
    to provide useful information, a visual check of the hardware may be necessary.
    In many cases, hardware information may be printed on the hardware itself. For
    example, many hard drives have the size as well as the number of sectors, cylinders,
    and heads on top of them. Other types of hardware, such as sound cards, may a
    little more difficult to identify. In these cases, the cards must be examined
    for information that identifies them. Usually the manufacturer and model number
    can be located on the card. With this information, the manufacturer can be contacted
    to obtain specifications on the model of the board. (Many Web sites offer helpful
    tools for visual identification of hardware. One site is www.plasma-online.de.)


    Finally, a user should check if the hardware is supported by Linux. This can be
    done at any number of Linux support sites. The following Web site is reliable,
    up-to-date source for information on supported hardware:


    ```

    http://www.ibib.org/pub/Linux/docs/HOWTO/Hardware-HOWTO

    ```


    If hardware is listed here, then it is supported by current versions of Linux.
    If, the only solution for the user is to replace the hardware with supported hardware,
    or wait for newer versions of Linux to integrate compatibility with a particular
    piece of hardware.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_44_0.png)


    SAIR Linux and GNU Certification -- Fundamentals/Linux-*'
  merge: -1
