  md: '# Window Managers


    The window manager controls the appearance and reactions of windows. The border
    around the windows can be changed to suit the user by implementing themes. These
    themes are a collection of images and colors the window manager applies to the
    borders. Themes are available most everywhere and made by everyone to expert Linux
    users. A window reacts to the mouse is the most important aspect of the window
    manager. The window which is currently selected for receiving keyboard input has
    the focus. Focus is determined by the position of the mouse pointer. The window
    manager allows the user to determine how X should focus issues. The user can select
    whether a new window should be given focus, if clicking on it is required to give
    focus, and even how long the mouse pointer must sit over a window before it is
    automatically given focus. The window manager also controls the X virtual desktop.
    The system of virtual desktops, movement between the desktops, and application
    placement on these desktops can be configured.


    There are many differences between the various window managers. Enlightenment
    is more of an effects-based manager, while Window Maker is more of a utilitarian
    manager. The other managers lie between these two extremes, combining features
    with a more balanced interface. Sawfish allows a wide range of customizations
    as well as utility features. It is not difficult to configure and run, but only
    works well in Gnome. Sawfish and Gnome complement each other well and have no
    overlapping features; Gnome offers wallpaper, Sawfish does not. KDE is linked
    highly to KWM; other window managers do not function as well with KDE as a result.
    KDE and KWM are similar to Gnome and Sawfish in that they work together to form
    a cohesive desktop manager and window combination.


    # Applets


    Both KDE and Gnome use applets to make launching programs fast and easy. Located
    on the Gnome panel, applets are small icons that launch a specified program when
    selected. All programs can be run from an applet, although applets do not have
    to be programs. Functions such as a virtual desktop guide, process list, and CPU
    usage bars can be placed as applets on the panel. The panel is easily customized,
    and may be placed on any edge of the desktop (right, left, top, or bottom). The
    panel comes with a removable system menu that contains connected menus, which
    can contain programs. All of these can be edited in any way the user chooses.


    It is important for users to test out many different environments to find the
    one that best suits them. A fully customized desktop can increase productivity,
    making programs easier to find and providing shortcuts to frequently programs.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_166_0.png)'
