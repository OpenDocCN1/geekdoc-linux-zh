  md: 'CD-ROM drives, SCSI. Accessed through existing SCSI drives, and work well in
    the Linux environment.


    CD-ROM installation. Works well if Linux has the necessary driver for the particular
    CD-ROM; it is also very fast.


    CLI, advantages. Linux shells offer the ability to perform many repetitive tasks
    with just a few keystrokes. Once the command shortcuts are learned, many users
    prefer a CLI to a GUI when performing tasks.


    client-server printer. Unix-like OS divide the printing process into two parts.
    A client program accepts the print request and submits it to a back-end server.
    The server regulates printing the data. In this way, the destination server printer
    may be local, remote, passed through a gateway, or the server may reside within
    the printer itself.


    CMOS. Complementary Metal-Oxide Semiconductor.


    configure partitions. Administrators often select the custom install option so
    that available disk space is best utilized.


    console switching. We use the <CTRL-ALT-Fx> keys to select a new virtual console.


    copy and paste. Highlight the text to be copied with the left mouse-button, switch
    to the destination application, and paste with the middle button.


    copyleft. Refers to the nondraditional use of copyright to keep free software
    and permit use and modification by many, instead of reserving this right to a
    few.


    deemons. Also known as servers, daemons are processes that run continuously in
    the background and perform functions required by other processes.


    data cache. The data cache holds blocks data for the hard disk. If the system
    is abruptly turned off, then file information is lost and the system becomes inconsistent.
    To minimize this problem, the kernel daemon flushd moves data cache blocks to
    the hard disk every 30 seconds.


    data viewing, off-screen. We use the <SHIFT-PgUp> key to review things that have
    scrolled off of a virtual console terminal.


    Debian attributes. It installs in chunks, with a default configuration with Internet
    servers, and provides package installations and upgrades.


    default file protection. Creating a file as the superuser means that other user
    accounts do not read or write permission and, therefore, the superuser account
    must be used to manipulate these files.


    Deja. A special type of search engine, it specializes in searching all news group
    postings and can quickly find answers to obscure problems.


    device conflicts, types. The I/O address of the adapter card, the interrupt request
    line of the adapter card, the direct memory access channel, and shared memory
    addresses.


    device drivers. Map the physical characteristics of a device into a unit logical
    interface that makes the device accessible by all parts of the kernel. Since Linux
    employs preemptive multitasking, it must provide its own interrupt-driven device
    drivers and avoid using the BIOS routines.


    device section. Tells the X server which parameters to accept and which ones to
    probe for the video adapter.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_374_0.png)'
