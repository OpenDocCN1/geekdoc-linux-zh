  md: '# Mounting File Systems and Devices 5-27


    | Options | Function |

    | --- | --- |

    | -h | Retrieves the help menu. |

    | -a | Will mount every file system in /etc/fstab. |

    | -f | Performs all operations except the actual mounting. Can be used to discover
    what the mount command is trying to perform, if there is a problem. |

    | -L [UUID] | This command will mount a file system with the specified UUID. |

