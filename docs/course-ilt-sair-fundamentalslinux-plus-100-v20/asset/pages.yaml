  md: '# Network Devices 10-47


    The actual installation of a network card is the same as the installation of any
    expansion board. All one must do install the card into an available expansion
    slot on the motherboard. When the system is rebooted, the operating system should
    automatically detect the card and install the appropriate modules. Afterwards,
    networking parameters such as the IP address should be configured with the ifconfig
    utility. ifconfig should be invoked as follows:


    ```

    ifconfig [device] [parameters]

    ```


    where [device] is the name of the device such as eth0 or eth1, and [parameters]
    refers to the specific parameters one wishes to pass to the system. If the network
    card is the only card in the system, its device name will be eth0. If it is the
    second network card in the system, its device name will be eth1, if it is the
    third it would be eth2 and so on. A complete list of options and parameters for
    the ifconfig utility can be found in the ifconfig man pages. These can be accessed
    by typing man ifconfig at the command prompt.


    # Full-Duplex vs. Half-Duplex


    The terms full-duplex and half-duplex both refer to types of data transmission
    on a bidirectional line. A network with full-duplex technology is able to send
    and receive data at the same time. A network using half-duplex technology is capable
    of sending and receiving data, but not simultaneously.


    On ethernet network, the ethernet cable is bidirectional. Whether or not communication
    is full-duplex or half-duplex is determined by the network information cards used
    with the network. For example, if machine A with a full duplex communicating with
    machine B uses a half-duplex card, communication will take place at half-duplex
    speeds. This is because machine B is unable to send information back to machine
    A while machine A is sending information to machine B.


    # Cabling


    With the exception of wireless networks, cabling is one of the most essential
    pieces of networking equipment. it is the medium by which data is transferred
    within a network. There are several types of cabling to choose from, depending
    on network type, desired bandwidth, and physical topology of the network site.
    This section will give a brief overview of each the most popular types of network
    cabling, including their advantages and limitations.


    # Twisted pair


    Twisted pair is one of the most popular types of cabling for networks. Within
    a twisted pair cable, two insulated wires are twisted around another along the
    length of the cable.Though it may seem extraneous, twisted pair wires are twisted
    for a reason. The twisting greatly reduces the chances of electromagnetic induction
    and/or the crosstalk of signals between the wires. The most common application
    of twisted pair cabling is telephone wire, although ethernet cables also used
    twisted pair cables. The chief difference between two is that while a phone connection
    is dependent on one twisted pair of wires, an ethernet must have four.


    There are two types of twisted pair cabling, unshielded twisted pair (UTP) and
    unshielded twisted pair (STP). The difference is that the wires in an STP cable
    are shielded by a layer that filters out electronic noise and preserves the quality
    of the signal, whereas UTP cables do not have the shield. In general, STP cables
    are more expensive and necessary when the cabling is exposed to sources of interference.


    Standard ethernet wiring using category 5 UTP cabling, which consists of four
    twisted pairs within a single plastic covering.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_350_0.png)'
  merge: -1
  pgno: 350
- img_proc: true
  md: '# Coaxial


    There are two types of coaxial cable: 50-ohm and 75-ohm, which are used for digital
    and analog transmissions, respectively. 50-ohm coaxial cable is the standard for
    computer networks, whereas 75-ohm coaxial cable is the type of cable used in cable-television
    networks.


    While coaxial cable provides high bandwidth over long distances and strong shielding,
    the very design that makes these features possible is the source of problems with
    coaxial cable. At the center of the cable is a relatively thick copper core, which
    is sheathed by a thick layer of insulation. This is encased by a woven metal mesh
    which acts as a ground. Finally, all of this is covered with another layer of
    plastic insulation. The number and thickness of these layers makes coaxial cabling
    very stiff.


    The use of coaxial cabling in networks decreased as using UTP cabling became more
    popular. The first ethernet networks used coaxial cabling, although they suffered
    because of their physical topology drawbacks. If any one section of the cable
    were to break, the entire network would usually go down.


    # Fiber optic


    Fiber optic cables acts as a transmission medium for light, unlike most other
    cable types which propagate electricity. Since fiber optic cables carry a different
    type of media than standard cables, they are constructed with a different type
    of material. Fiber optic cables are structured with a glass core that carries
    light, which is sheathed by a glass cladding that prevents the light from escaping
    the center. This structure is then covered with a protective jacket.


    Light signals also to transmit binary data, where the presence of light represents
    1 and the absence of light represents 0. By using light signals rather than electric
    signals to transmit information, fiber optics provide a wealth of advantages over
    other types of cable. A single fiber optic line is substantially smaller than
    most other cables, and the data rates on a fiber optic line are capable of reaching
    speeds of up to and above 1.5 Gbps. Also, fiber optic wires are not susceptible
    to interference from outside electrical devices or other wires which are coaxial
    or twisted pair wires, and they are capable of carrying data a greater distance
    with less signal attenuation.


    Fiber optic lines also have their disadvantages. They are very expensive, and
    more easily broken than other types of cable. Also, a fiber optic line is unidirectional,
    meaning that data can only be transmitted in one direction without using a second
    cable or transmitting on different frequencies. Establishing connections on a
    fiber optic line is also difficult because they are not easily tapped. To an extent
    this is a security advantage, a network administrator may not wish to deal with
    the trouble and expense of tapping the fiber optic line every time a new connection
    is needed on a rapidly growing LAN.


    Currently, fiber optic cables are the standard for most long-distance telephone
    companies and many other wide-area networks. However, due to the cost and labor
    involved, most local-area networks continue to rely on ethernet.


    # Physical Network Topologies


    Topology is the physical arrangement of any networking devices used on a network.
    In most cases, network efficiency and productivity hinges on the physical setup
    of a network. Using the right topology can speed up a network and simplify maintenance.
    This section will discuss aspects of the bus topology ring, star topology.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_351_0.png)'
  merge: -1
  pgno: 351
- img_proc: true
  md: '# Bus topology


    In a bus topology, each node attaches directly to a common backbone or transmission
    medium as shown in the figure below.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_352_0.png)


    Figure 10-9. Bus Topology


    In the bus topology, a signal is sent to the transmission medium when a host wants
    to establish communication with another host. All hosts on the network receive
    that signal and determine whether the signal is intended for them. If a host determines
    that the signal was not intended for them, the signal is ignored. When the signal
    reaches the intended host, it is accepted. This is called a passive topology since
    the signal is received by all hosts, but it is not amplified or otherwise modified
    by any host other than the host to which it was sent.


    It is important that transmission media used in a bus topology be terminated at
    each end. If the medium used in a bus topology is not terminated at both ends
    by a terminator, the signal will continue to bounce back and forth across the
    network, resulting in congestion.


    The prime advantage of bus topology is the simplicity of its physical arrangement.
    However, bus topology has great disadvantages as well. The entire network will
    cease to function if any host is experiencing network problems or if there is
    a break anywhere in the transmission medium.


    # Ring topology


    The ring topology (also called token ring) connects all networked computers in
    a circular loop. In this topology, data is sent around the network as shown in
    the figure below.'
  merge: -1
