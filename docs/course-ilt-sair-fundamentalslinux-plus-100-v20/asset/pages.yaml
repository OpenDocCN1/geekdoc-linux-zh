  md: 'Press <o> will bring up an options menu, allowing the user several configuration
    options. Any changes here will change the .elm/elmrc file located in the user''s
    home directory; however, this will not exist until the settings have been saved.
    Press the first letter of the option change, input the new change, and press <ENTER>.
    Remember to save the changes with the > character before closing Elm.


    # Editor


    Elm defaults to Vi, which was designed for more advanced users, new Linux users
    may wish to consider changing the editor to an application with which they are
    more comfortable. Another editor may be more accessible for novice users. See
    the section on editors for more details.


    # User level


    Other options to consider changing the user level (expert will show more commands
    on the bottom prompt of the menu), the display option (the default display does
    not allow backward scrolling, but the less utility does), or cursor display (an
    arrow or a bar that highlights the message).


    The user can also change options on this file by manually editing once it has
    been created, allowing for more customization than from the menu alone. The elmrc
    file is well commented and contains editing directions. The file follows a question-and-answer
    format, and the user should have no trouble editing the file to his or her specific
    preferences.


    # Usage


    Navigation is accomplished through single keystrokes, and important commands are
    listed on the bottom of the main screen. These commands, along with their descriptions,
    are listed in Table 8-4.


    | Command | Description |

    |---|---|

    | d | Marks the message for future deletion |

    | f | Forwards the currently highlighted message |

    | j | Goes to the next undetected message (the down arrow shares this function)
    |

    | k | Moves to the previous undetected message (the up arrow shares this function)
    |

    | m | Creates a message |

    | o | Opens the option submenu |

    | r | Replies to a message |

    | u | Removes the deletion mark on the current message |

    | q | Takes the user to the help menu (press a key and a line of text explaining
    that key will be displayed at the bottom of the screen) |


    Table 8-4. Commands in Elm


    # Sending mail


    Elm leads the user through each step of the sending process; typing <m> begins
    a new message. The user will first be prompted for the recipient''s address, the
    subject of the message, and the address of anyone who should receive a copy.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_250_0.png)'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'After these have been answered, Elm will send the user to the editor to compose
    the body of the text. After completing the message, the user will exit the editor
    and be prompted to send the message; selecting yes will send the message.


    Replying to a message is as simple as highlighting the message and choosing the
    reply option. The format for sending mail is the same as starting a new message
    except that the user will not be prompted for an address.


    # Receiving mail


    New e-mail is automatically shown upon starting Elm. Highlighting the message
    to read and pressing ENTER will start the viewing utility New messages will have
    an N on the left-hand side of the message (before the message number), unread
    messages that were already in the inbox before this session will have an O, deleted
    messages will have a D.


    Some of Elm''s common options are shown in Table 8-5.


    | Option | Description |

    | --- | --- |

    | -f | Specifies a folder with this option, bypasses the inbox, and opens a different
    folder. |

    | -h | Gives a list of options. |

    | -z | Does not enter Elm if the user has no mail in the inbox. |


    Table 8-5. Common Options in Elm


    # Pine


    Pine (Program for Internet News and E-Mail), is another text-based e-mail client.
    It was developed at the University of Washington to help new users. While it is
    easy for novices to use and understand, Pine also contains options and features
    for more experienced users.


    # Configuration


    The pincerc file located in a user''s home directory contains all of the user''s
    personal settings for the mailer; this file should be edited to configure Pine.
    Like Elm, an option submenu exists that allows the user a simplified method for
    configuring the pincerc file.


    # Usage


    Upon opening the Pine mail, a screen similar to the one below will be displayed
    in the terminal window:


    ```

    Pine 4.03              MAIN MENU              Folder: INBOX 3 Messages

    7 HELP                       - Get help using Pine

    C COMPOSE MESSAGE      - Compose and send/post a message

    I MESSAGE INDEX             - View messages in current folder

    L FOLDER LIST               - Select a folder OR news group to

    view

    A ADDRESS BOOK             - Update address book

    S SETUP                     - Configure Pine Options

    Q QUIT                       - Leave the Pine program

    ```'
