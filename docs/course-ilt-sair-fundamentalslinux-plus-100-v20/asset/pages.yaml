  md: '# 5-8 Module 5 — Using the Linux File System


    # The Linux File System Hierarchy


    +   * File System Hierarchy Standard

    * File System Navigation


    # THE LINUX FILE SYSTEM HIERARCHY


    The Linux file system consists of many different base directories, each with its
    own special purpose. A standard exists that most Linux distributions follow; it
    can be found at www.pathname.com/fhs. This contains a large amount of specific
    information about what these directories are used for, and what type of files
    should go into them. The following is a short look into that file system structure.


    # File System Hierarchy Standard


    At the very base of the file system is the root directory, indicated by a slash
    (/). This directory holds all other directories. Typically there are no files
    placed in this, only other major directories. Each of these directories has a
    special purpose. For instance, the /etc directory is generally used for system-wide
    configurations, while /bin holds system-executable programs. Figure 5-1 shows
    a listing of these major directories and their functions.


    | | Essential Commands; always mounted binaries |

    |---|---|

    | /bin | | |

    | /boot | Boot loader and kernel images |

    | /dev | Device driver access |

    | /etc | Host specific system configuration |

    | /home | User account home directory; large branch |

    | /lib | Libraries; run-time load libraries, and kernel modules |

    | /mnt | Mount point of removable media |

    | /opt | Local add-on software packages |

    | /proc | Kernel status routines |

    | /root | Home directory for the root user; always mounted |

    | /sbin | Essential system administrator command binaries |

    | /tmp | Temporary files; use /tmp for applications |

    | /var | Secondary hierarchy; large branch |

    | | Variable data; dynamic logging, pooling and status information |


    Figure 5-1. File System Hierarchy'
