  md: '# 10 Module 10 — Hardware


    # Processor slots


    The processor slot is the socket that connects the processor to the system board.
    There are many types of processor slots in common use today. Table 10-3 lists
    and describes them.


    | Processor Slot | Function |

    |---|---|n| Socket 7 | This socket accepts the Pentium processor. An updated version
    of this socket called the Super 7 is designed to accept AMD''s KA line of processors
    as well as the Pentium |

    | Slot I | This slot accepts the Pentium II, Pentium III, and Celeron processors.
    It has been phased out in favor of the Socket 423 design |

    | Slot II | This slot accepts Pentium II Xeon processors |

    | Socket 370 | This socket accepts newer versions of the Celeron |

    | Socket 423 | This slot accepts Pentium IV processors |

    | Slot A | This slot accepts the first of the AMD Athlon processors. It was phased
    out in favor of Socket A |

    | Socket A | This accepts AMD Athlon Thunderbird processors. |


    Table 10-3. Processor Slots


    # System board form factors


    A form factor determines the size, dimensions, and specifications of a piece of
    hardware. There are currently four system board form factors in use. There are
    others, of course, but they are mostly historically significant. Table 10-4 lists
    and describes the major form factors.


    | Form Factor | Function |

    |---|---|n| AT system boards | There are two types of AT system boards commonly
    used, AT and baby AT. The baby AT form factor is simply a smaller version of the
    AT. Baby AT is the most common and measures 8.5 inches wide by 13 inches long
    |

    | ATX system boards | ATX system boards are for the most common in modern PCs.
    ATX was designed as a successor to AT. AT supports most modern processors from
    the Intel Celeron to the AMD Athlon |

    | NLX system boards | NLX is a smaller size of ATX. It can be found in PCs where
    size is a great concern |

    | WTX system boards | Essentially the same size as ATX, WTX system boards feature
    a different power connector pinout and are used primarily with Pentium IV processors.
    Other than their pin configurations, and, in some cases, the power connector itself,
    there is no visual difference between WTX and ATX.


