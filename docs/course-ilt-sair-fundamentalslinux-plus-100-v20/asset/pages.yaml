    # Changing Ownership


    Changing the ownership of a file is simple: the command chosen is followed by
    the name of the user who

    will own the file and the name of the file. However, in Linux, this can only be
    done by root. To change the

    er of the file script to the user named mike, simple type:


    ```

    $ chmod mike script

    ```


    If the group to the file belongs is changed (for example, to group prog), a similar
    procedure is followed.

    nThe command chgrp is followed by the new group and the name of the file.


    ```

    $ chgrp prog script

    ```


    Changing the group ownership of a file can be done by any user who belongs to
    both groups.

    The examples can be done in one step using the dot notation, where user is followed
    by group.


    ```

    $ chmod mike.prog script

    ```


    # Setting Permissions with umask


    Normally, when a user creates a file, he or she will want it to have certain permissions
    on it. To avoid having

    to set the permissions for every new file he creates, he can either run the umask
    command as

    prompt, or more conveniently, set it in the shell rc file. The umask command takes
    an argument

    to what is when a file permissions are changed using chmod in absolute mode, but
    uses a slightly

    bit system. When setting permissions with the umask command, it is helpful to
    think of them as the

    reverse of file permissions. With umask seven means no permissions, and zero means
    all permissions.

    To get the proper umask value, use the absolute mode permissions that should be
    set and subtract

    value from 777. For example, the umask value that would give the owner all rights,
    and no anyone to else,

    would be 077 (777-770=077).


    This gives each file created the permissions without user intervention. Of course,
    if a user should decide

    later that the file should have different permissions, they need to be changed.


