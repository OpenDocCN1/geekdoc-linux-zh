  md: '# The Linux Kernel


    +   - What Is the Kernel?


    +   - Core of Linux operating system


    +   - Thousands of lines of code written in C drivers.


    +   - Developing the Kernel


    +   - Linus Torvalds began work on the original in 1980s


    +   - Appealed for help in October 1991


    +   - Meaning of distribution numbers


    +   - Linux Kernel Benefits


    # THE LINUX KERNEL


    If involved in a conversation about Linux, one will most likely come across the
    word kernel. So what is a kernel? As the name suggests, the kernel is the core
    of the Linux operating system. Made up of thousands of lines of code written in
    C, the kernel coordinates every job in the computer. The kernel establishes a
    file system, manages the memory, controls processes, handles network jobs, and
    controls drivers. The kernel is the code that processes to work.


    # Developing the Kernel


    Linux Torvalds began work on the original kernel during the late 1980s and early
    1990s. Torvalds decided to appeal for help during October 1991 and was soon joined
    by computer experts around the world. The kernel has developed far beyond the
    specific example the 0.02 version and is now in stable 2.4. Each version number
    has a specific meaning: an example 2.3.99 simply shows the level of kernel development.
    The second digit, 2.xx, indicates whether it is a stable version or a developmental
    version of the kernel. In Linux, if this number is even, it is considered stable
    and if the number is odd, it is considered developmental. The third digit, 2.3.x,
    is the patch or fix number. Often small bugs will be discovered in the kernel
    and users will release patches to fix them.


    # Linux Kernel Benefits


    The Linux kernel is unique for several reasons. The most remarkable aspect of
    Linux is that it is open source. This means that anyone can change, view, or give
    away the kernel. The path for the kernel is `/usr/src/linux/kernel`. Another point
    of interest about the Linux kernel is the way functions. Because the kernel controls
    so many functions, one would assume it is massive.'
  merge: -1
  pgno: 15
- img_proc: true
  md: Although it is growing, the Linux kernel is fairly small compared to other kernels.
    The kernel's utilization of modules is one reason for this. Modules are lines
    of code that can be added or subtracted to and from the kernel while it is running
    and are typically device drivers. By using modules only when necessary, the kernel
    remains both small and fast. If a module is needed, it is simply added to the
    kernel. If a module is not needed, it is removed from the kernel. This is completely
    different from other OSs, which contain large lists of modules whether or not
    they are needed. Linux has become one of the most widely used operating systems
    in both the academic and commercial worlds.
  merge: -1
