  md: '# GLOSSARY


    $PATH variable. An internal shell variable that contains a list of directories.


    $PATH variable, role. The shell searches the list of directories looking for the
    executable file name specified in the command.


    /proc directory. Enables access to routes that provide status information about
    the kernel.


    / character. Indicates the root directory volume (drive) that is hard-wired or
    built into the kernel image and is, therefore, known by the kernel at boot time.
    It also delimits directory names in a path.


    access port. To begin the login process, the user must find a port that is monitored
    by the login program (initially the getty program), which is waiting for input
    from a user (For purposes of simplicity, ignore the role of telnet, which assists
    with access via the network.)


    adapter conflicts. Adapters plugged into the buses may use the same parameter
    as another adapter. The conflict occurs because both adapters respond when the
    CPU attempts to communicate with one of them.


    adduser. Edits the password file, creates the home directory for the account,
    and copies the default files from /etc/skel into the new directory.


    adduser, augmentation. A small script can de duplicate adduser''s required arguments
    without setting up the configuration file /etc/adduser.conf. In this way, adduser
    will respond with the name of the new user account.


    application history file. Applications may save their state information in the
    initialization file, or other files, that they may begin execution at a previous
    stopping point.


    BIOS (Basic Input and Output System). A ROM-based set of routines that provides
    diagnostics and read/write services to devices. Unfortunately, the read and write
    only devices and cannot be interrupted during device operation.


    BIOS-based adapter configuration. Some vendors include the diagnostic and configuration
    programs in the ROM on the adapter, and provide access to the programs at boot
    time by prompting the user to enter a special key combination.


    boot diskette. A single, formatted diskette contains the startup file(s) and configuration
    settings; it is used for emergency startup when the original configuration settings
    are corrupted.


    buses, PC. The IBM PC architecture employs a bus, high speed input output (I/O)
    bus called the PCI bus, and one backward-compatible I/O bus, called the ISA bus.


    Case sensitivity. All files (including program names) in Unix-like operating systems
    must be accessed as is. The command line interpreter (bash or other shell) employs
    upper and lowercase characters to differentiate among file and program names.


    cd command. Switches the current working directory to the specified directory
    and uses the new directory to find relative file names.


    CD-ROM drives, ATAPI IDE. A standard for IDE controllers, ATAPI IDE CD-ROM drives
    are accessed just like any other IDE drive; however, there are often compatibility
    problems with early ATAPI CD-ROM drives.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_373_0.png)'
