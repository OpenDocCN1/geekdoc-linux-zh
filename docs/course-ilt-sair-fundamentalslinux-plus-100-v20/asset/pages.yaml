  md: '# Memory Modules


    # SIMM


    Originally, the 30 pin In-line Memory Module SIMM was designed for 8-bit data
    flow and placed in groups of four to provide a 32-bit data flow. This meant that
    32-bit operation required four 30 pin SIMMs at once. Thus, the 72 pin SIMM was
    designed for 32-bit operation. It reduced the number of sockets required for memory
    to carry out 32-bit operations. However, the 72 pin SIMM lead to a 50 percent
    increase in the overall physical length of the memory module. To handle 64-bit
    operation, a minimum of two 72 pin SIMMs were required. Once again this caused
    problems. A simple answer to the problem was the DIMM (Dual In-line Memory Module)


    ![](img/b0ea5e4a55ee6767fff087672e71c505_319_0.png)


    10-2. SIMM


    # DIMM


    Dual In-line Memory Module (DIMM) is a small circuit board that holds memory chips.
    A Single In-line Memory Module has a 32-bit data path to the memory chips whereas
    DIMMs have a 64-bit data path. This means that SIMMS must install in multiples
    of two for a computer to achieve a 64-bit data path and DIMMs only need to be
    installed one at a time.


    Most Pentium and Pentium compatible motherboard incorporate two or more slots
    for a 168 pin DIMM. DIMMs look similar to SIMM, but they differ in length, system
    requirements, and capabilities. The DIMM module uses both sides of the chip with
    168 pin version having 84 pins on each side.


    # SO DIMM


    Small Outline DIMM (SO DIMM) is a smaller version of the DIMM used mostly in notebook
    computers. Full-size DIMMs have 168 pins and support 64-bit transfers; however,
    SO DIMM has only 72 pins supporting only 32-bit transfers, or 144 pins supporting
    a full 64-bit transfer.


    # Memory Types


    # SRAM


    Synchronous Random Access Memory (SRAM) stores data without an automatic refresh.
    The only time a refresh occurs is when write command is performed. If the write
    command does not occur, not in the SRAM changes, which is why it is called static.
    The benefit of SRAM is that it is much faster than DRAM, reaching speeds of 2
    nano nanoseconds. The disadvantage is that SRAM is more expensive than DRAM. SRAM''s
    most use in PCs is in the second-level cache, also called the L2 cache


    # DRAM


    Dynamic RAM is the standard main memory type in computers today. Information is
    stored in DRAM as a series of charges in a capacitor. Within a millisecond of
    being electronically charged, the capacitor discharges and needs to be refreshed
    to retain its values. This constant refreshing is the reason for the use of the
    term dynamic.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_319_1.png)'
  merge: -1
