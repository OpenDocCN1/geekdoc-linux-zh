- img_proc: true
  md: '# KDE Desktop


    The Desktop Environment (KDE) was developed to provide a modern interface to Unix-based
    operating systems. It is built upon a commercial library called Qt. The Qt Free
    library, maintained by Trolltech, is included with popular Linux distributions
    and may be used freely run Qt-based programs and develop open source programs.
    The requirements for installing KDE are a working Window System and proper Qt
    libraries. For up-to-date information on KDE, visit the KDE Web site at www.kde.org.


    # Gnome Desktop


    The GNU Network Object Model (Gnome) is another popular desktop environment for
    X11. Its goal is to provide open source systems with quality desktop environments
    at no cost. Gnome uses the GTK+ library to build its graphical. The GIMP Tool
    Kit (GTK+) was originally created to form the GUI components for the GIMP image
    manipulation program. Both Gnome and GTK+ are licensed under the GNU Public License.
    Gnome describes itself as free, cutting-edge, international, user-friendly, and
    developer-friendly.


    Similar to KDE, Gnome provides various installation methods, but the simplest
    method is the original Linux installation. Gnome currently supports a unique installation
    procedure for some popular Linux distributions. To see a list of supported distributions,
    visit www.helixcode.com, where updated Gnome packages and additional software
    are available for download. The download page contains information for installation
    of Gnome on RPM-based systems, Debian, andn Solaris.


    # Starting KDE or Gnome


    After the successful installation of KDE or Gnome, there are only a few more steps
    to take before it can be used as the default desktop environment. The first step
    is to examine the .xinitrc,.Clients, and .xsession files in the user''s home directory
    for a line similar to


    ```

    exec <window_manager>

    ```


    in window_manager this is the current environment startup script.


    For Gnome, this line should be replaced with the command:


    ```

