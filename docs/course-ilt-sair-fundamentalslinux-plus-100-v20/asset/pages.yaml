  md: "# Transmission Control Protocol/Internet Protocol\n\n+   - Architecture\n \
    \ - OSI Model\n  - TCP/IP or DOD Model\n- Internet Layer Protocols\n- Transport\
    \ Layer Protocols\n- Application Layer Protocols\n\n# TRANSMISSION CONTROL PROTOCOL/INTERNET\
    \ PROTOCOL\n\nTransmission Control Protocol/Internet Protocol (TCP/IP) is a collection\
    \ of protocols primarily used to integrate various networks into a single network.\
    \ Using TCP/IP, connected to different networks, as well as computers with different\
    \ architecture, can exchange data. TCP/IP divides volumes of data into smaller\
    \ pieces called TCP segments and routes them to their destination using IP. These\
    \ TCP segments are usually sent in a single IP datagram; if the segments are too\
    \ big they are sent in multiple datagrams. These IP datagrams do not necessarily\
    \ arrive at the destination in the order they were sent. In such cases, TCP rearranges\
    \ the datagrams at the destination to maintain an uninterrupted flow of data.\n\
    \n# Architecture\n\nThe two models used for Internet architecture are the Open\
    \ Systems Interconnection (OSI) model and the TCP/IP, or DOD (Department of Defense),\
    \ model."
  merge: -1
  pgno: 233
- img_proc: true
  md: '# Transmission Control Protocol/Internet Protocol 8-9


    | OSI Model | | TCP/IP Model |

    |---|---|---|n| Layer7 Application | | |

    | Layer6 Presentation | Application | Layer4 |

    | Layer5 Session | | |

    | Layer4 Transport | Transport | Layer3 |

    | Layer3 Network | Internet | Layer2 |

    | Layer2 Data-Link | Network Access | Layer1 |

    | Layer1 Physical | | |


    Figure 8-2. Layout for OSI and TCP/IP Model


    OSI model

    The OSI model is based on standards set by the International Standards Organization
    (ISO), and it is made up of seven layers.


    **Physical layer**


    The physical layer transports data across the network over the physical connection.


    **Data-link layer**

    The data-link layer takes care of physical addressing of the message before sending
    it to the physical layer. It also checks for and reports errors.


    **Network layer**


    The network layer routes data from the source to the destination across the network.


    **Transport layer**

    The transport layer breaks down large packets into smaller pieces, arranges them
    in a sequence, and passes them to the network layer.


    **Session layer**

    The session layer acts as a communication link between the application and presentation
    layers throughout the session. It is also responsible for terminating the connection
    at the end of the transaction.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_234_0.png)


    SAIR Linux and GNU Certification -- Fundamentals/Linux+'
  merge: -1
  pgno: 234
