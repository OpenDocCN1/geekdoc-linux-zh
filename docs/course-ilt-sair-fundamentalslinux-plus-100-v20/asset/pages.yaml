  md: '# HARD DRIVES


    Integrated Drive Electronics (IDE) is a method that combines the disk drive controller
    with the disk drive, on the disk drive itself. This implementation is also called
    ATA (AT Attachment). The integration of the disk drive with the controller results
    in lower costs, and makes it easier to upgrade.


    # Improvements in IDE


    One of the improvements to this implementation is the Enhanced IDE (EIDE), a creation
    of Western Digital, which builds on the ATA-2 (an improvement on ATA) and the
    ATAPI standards. There are many other similar implementations, such as Fast-ATA
    and ATA-3 to name few, but they are all improvements over the original IDE/ATA
    standard.


    # ATA-100


    One notable implementation is the ATA-100, a very fast implementation of the ATA
    standard. In order to take advantage of this speed, however, a kernel flag must
    be set. One way to accomplish this is to place it as an append in lilo.conf. For
    example:


    ```

    image=/mlinuz

    label=Linux-2.4.0

    root=/dev/hde3

    read-only

    append="x86_serial_nr=1 ide2=0x9400,0x9002 ide3=0x08800,0x08402"

    ```'
  merge: -1
