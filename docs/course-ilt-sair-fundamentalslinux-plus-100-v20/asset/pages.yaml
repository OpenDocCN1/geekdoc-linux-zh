  md: '# LAB 03 - ADDING AND DELETING A USER


    # Purpose


    This lab will familiarize the user with the useradd and userdel commands.


    # Lab Duration


    10 minutes.


    # Overview


    One of the most important things a system administrator must do is correctly add
    and remove users from a system. Fortunately, Linux has made the process relatively
    painless with the useradd and userdel commands. Before continuing with the lab,
    view the man pages for each of these commands in order to familiarize yourself
    with their more advanced features.


    # Lab Exercises


    +   1. In order to add a user, in this case tyler, to the file system, simply
    enter the following as root at the command prompt

    ```

    #useradd -d /home/tyler tyler

    ```


    ```

    #useradd -d /home/tyler tyler

    ```


    The format of the useradd command includes the -d switch, which is followed by
    the user''s home directory. The user''s login name is then followed by the directory,
    which will be set up with defaults in the /etc/defaults/useradd file. The directory
    will contain only the files specified in the /etc/skel directory.


    +   2. To give our new user a password the following.

    ```

    #passwd tyler

    new password:xxxxxxxxxx

    re-enter new password:xxxxxxxxxx

    password changed

    ```


    ```

    #passwd tyler

    new password:xxxxxxxxxx

    re-enter new password:xxxxxxxxxx

    password changed

    ```


    Administrators should make or obtain the user''s password when creating his or
    her account. This can be done with the useradd command, with the -p switch, or
    with the passwd command. The password will not show up on the screen but is represented
    with xxx here. It is important that your password is a non-logical combination
    of capital letters, numbers and special characters, such as the pound sign (#).


    +   3. To delete a user and his her directory, simply enter the following.

    ```

    #userdel -r tyler

    ```


    ```

    #userdel -r tyler

    ```


    The -r switch conveniently removes files from the users directory. Otherwise,
    a search for the users files will give false information until the updatedb is
    run.


    +   4. Update the locate database with the updatedb command. This will give false
    information.

    ```

    #updatedb

    ```


    ```

    #updatedb

    ```


    This completes a simple cycle, which creates and deletes a user and his files.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_76_0.png)'
