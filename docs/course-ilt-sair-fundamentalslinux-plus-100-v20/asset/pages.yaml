- img_proc: true
  md: '# Module 4 — Linux Sessions


    To get a login as another user, employ the su - command. This command performs
    the same function as su and unsets all environment variables, except TERM, HOME,
    SHELL, USER, LOGNAME, and PATH. It also sets the current directory to SHOME and
    executes a login.


    # Logging into the GUI


    During installation, an option is provided to start the Linux session in the Graphical
    User Interface (GUI). If this is selected, the user will log in through GUI, and
    then the X Window (GUI) will be started.


    Use the mouse to click on the text field marked Login and enter a username. The
    login screen will respond with a password prompt. Unlike the shell-based login,
    echo will not be turned off. Insert asterisks (*) will be substituted for the
    password so that it remains un.


    If the wrong password or username is entered, the user will have to enter the
    information again. If the password is correct, the user will be logged into the
    system.


    # Using Multiple Terminals


    As a true multi-user, multitasking operating system, Linux allows users to control
    more than one terminal at once on the same machine. This is done through the use
    of virtual terminals. There are several practical and useful applications of this
    feature. For example, while one user is installing a program on the first virtual
    terminal, another user can switch to a second virtual terminal and check his or
    her e-mail without interrupting any of the processes employed by the first user.
    Additionally, if the user is working on a project and the terminal locks up, the
    user can switch to another terminal and kill the process that has disrupted the
    work.


    Accessing and using multiple terminals on a machine is quite simple. After a user
    logs into a Linux terminal and presses ALT-F2, the screen will refresh with a
    new login prompt. Either the same user or another user can log in at this prompt.
    This procedure can be followed for all of the function keys, allowing users up
    to 12 virtual terminals. However, when using X Window, a user is provided with
    only six virtual terminals (F1-F6), and to move from the X Window environment
    to a virtual terminal, a user must press <CTRL-ALT-Fx>. To return to the X Window
    system, use <CTRL-ALT-F7>. X Window, however, provides an infinite number of X
    terminals (users are limited only by hardware). These appear within the X environment
    and provide the same functionality as a virtual terminal. A major difference between
    a virtual terminal and an X terminal is not required to log in each time a new
    terminal is started.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_83_0.png)'
  merge: -1
