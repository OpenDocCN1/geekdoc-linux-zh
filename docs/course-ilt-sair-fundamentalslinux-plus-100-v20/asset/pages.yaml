    ![](img/b0ea5e4a55ee6767fff087672e71c505_155_0.png)


    Figure 6-2. Xinstall Welcome Screen


    As shown, users are advised to back up files from a previous installation so that
    they may be restored, if there is a problem. These files are located in /etc/X11
    and /usr/X118. The script then asks a number of questions in order to install
    the files properly.


    # Configuring X


    The next step in setting up X is to configure the program. In order to configure
    X, the file XP86Config must be edited to the proper specifications. Several programs
    are available to accomplish this task. Two configuration utilities are provided
    with XFree86 by default; they are x86config and X86setup. There are additional
    distribution-specific tools. Xconfig is a program that supplied by Red Hat. SU
    Linux comes with the Sax program; Turbofx is a program that accompanies TurboLinux.
    To properly X, these programs must be run as root.


    # What needs to be configured to run X?


    Before describing each configuration utility, it is necessary to discuss the items
    to be configured. Each program expects information on the mouse, keyboard, monitor,
    video card, resolution, and color depth. The mouse and keyboard are fairly standard
    devices and their configuration will not be too difficult. Additionally, mouse
    configuration is simplified if console mouse is already configured. For the resolution
    and color depth depend on the video card and monitor specifications. All of the
    information required, the monitor and the video card require the most attention.
    Providing improper values may severely damage the hardware. When configuring the
    monitor, the horizontal and vertical rates must be provided. Some programs can
    determine these values from a database, if they are provided by the manufacturer
    and model of the monitor. To configure the video card, the manufacturer and model
    must be known.


    # Resolution and color depth


    The resolution and color depth are values that depend on the hardware reality.
    Resolution is the number of pixels displayed on the monitor; some valid resolution
    settings are 640x480, 800x600, 1024x768, and 1280x1024. Color depth represents
    the amount of memory dedicated to each pixel. Higher color depth uses more memory,
    but allows a greater number of colors to be displayed on the screen.


    ![](img/b0ea5e4a55ee6767fff087672e71c505_155_1.png)'
