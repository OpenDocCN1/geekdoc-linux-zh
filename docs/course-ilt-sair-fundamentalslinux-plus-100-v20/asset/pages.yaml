  md: '# LAB 08-I — SYSTEM PERFORMANCE


    # Purpose


    The purpose of this lab is to familiarize the user with identifying, monitoring,
    and terminating processes on a Unix system.


    # Lab Duration


    20 minutes.


    # Overview


    In Linux, there are many commands that allow administrators and users to monitor
    what is happening on a system. A few of these commands are the ps, pstree, and
    top commands. These commands can show various processes: ps shows the process
    status report, pstree shows a tree of processes, and top shows a real-time list
    of the most demanding processes on a system.


    When monitoring performance, there are certain terms associated with it. You should
    be familiar with swap space: an area of disk (e.g., a swap file) to store the
    state of a process that has been swapped out. Under a virtual memory system, the
    sum of the swap space and physical memory determines the maximum size of a single
    process and the total amount of active processes. memory is usually used synonymously
    with Random Access Memory or Read-Only Memory, but in the general sense, it is
    any device that can hold data in machine-readable format. Also, memory system
    load, or the amount of system resources used at any given time.


    Many resources will be used during the lifetime of a process. You will use the
    CPU to run its instances and the system''s physical memory to hold its data. The
    process will open and use files within the system and may directly or indirectly
    use the physical devices in the system. Linux must keep track of the process itself
    and the system resources it has, so that it can manage this process as well as
    the other processes in the system fairly. It would be unfair to the other processes
    in the system if one process monopolized most of the system''s physical memory
    or its CPU.


    # Lab Exercises


    In this lab, you will do the following:


    +   * Use the ps command to identify processes running.

    * Use the pstree command to show a tree of processes running.

    * Use the top command to provide an ongoing look at processor activity in real
    time.

    * Use the kill and killall commands to terminate processes currently running.


    > NOTE: Red Hat 6.2 is being run here, and some of the options may vary slightly
    on different distributions.


    +   1. First, run the ps command with the -u option like this:


    ```

    $ -u

    ```


    This gives the output:


    | USER PID %CPU &MEM VSZ RSS TTY STAT TIME COMMAND COMMAND |

    | seagar 8579 2.0 1.6 1760 1028 pts/0 S 12:41 0:00 bash |

    | seagar 8580 0.0 1.5 2684 1000 pts/0 R 12:41 0:00 ps -u |


    ![](img/b0ea5e4a55ee6767fff087672e71c505_271_0.png)'
