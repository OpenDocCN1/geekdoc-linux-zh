  md: '# Logging Out or Shutting Down a Linux System 4-29


    Similarly, in the /etc/rc.d/rc0.d directory, some processes that are started are:


    ```

    $ S0killall -> ../init.d/killall

    $ S0halt -> ../init.d/halt

    ```


    If shut down is invoked with the -argument, the program checks to see if the file
    /etc/ shutdown.allow is present. It then compares the login names in that file
    with the list of people that are logged in a virtual console (/var/run/utmp).
    shutdown will continue only if an authorized user or root is logged in.


    # Manual Shutdown by the Superuser


    Only the root user can perform the manual shutdown. This is usually carried out
    through the steps listed below:


    +   - The working directory is changed to /.

    - Use the wall command to send a message to all users logged into the system.
    This message will warn them of the shutdown and tell them to log off.

    - Prevent non-root login attempts. This is done by creating the file /etc/nologin
    containing messages.

    - Use ps utility to find all processes running on the system and terminate them
    with a kill- TERM pid command.

    - Use the sync command at least twice to flush the buffers to the disk.

    - Unmount all the devices using the command umount -a.

    - Use the telinit command to bring the system to single-user mode or to reset
    or halt.


    # Using <CTRL-ALT-DEL>


    On Intel-based computers, pressing <CTRL-ALT-DEL> forces a system reset from the
    console. This keystroke can be defined by adding a line like the one shown in
    the /etc/inittab file:


    ```

    $ ca:ctrlaltdel:etc/shutdown -t3 -rf now

    ```


    Now when <CTRL-ALT-DEL> is pressed, the shutdown command is executed. The user
    can disable the <CTRL-ALT-DEL> method by adding the line


    ```

    $ ca:ctrlaltdel:bin/true

    ```


    ![](img/b0ea5e4a55ee6767fff087672e71c505_106_0.png)


