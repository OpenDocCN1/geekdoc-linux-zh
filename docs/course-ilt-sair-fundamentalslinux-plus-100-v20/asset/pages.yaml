    Once the method has been selected, the actual configuration must be performed.
    No matter which method is used, the configuration process is the same. Every section
    has two possible options: yes (y) or no (n). Some sections have a third option,
    loadable modules (m). Choosing yes causes the feature to be built into the kernel,
    while choosing no will cause the new kernel to exclude the specified feature.
    The module option will make a module for the kernel that can be loaded or removed
    as needed.


    Depending on the answer to some configuration options, other options may change.
    For example, if support is not enabled, none of the sound options will be available.


