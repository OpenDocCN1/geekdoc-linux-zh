    milliseconds. Just like in an aggressive scan, there can'
  merge: -1
  pgno: 360
- img_proc: true
  md: 'be scan errors with the insane template as well if the target system needs
    a delay of at least 1 second between the probes. This scan will just take 22 seconds
    if we use it on the UDP 500 port but the results will be a little different compared
    to other scans.


    # Targeting


    One of the important parts of running Nmap scan on a target system is identifying
    the target. If you pass an incorrect IP space, you may end up scanning an incorrect
    network which is not defined under the rules of engagement, or even an empty set.
    There are various ways to pass the target in the Nmap command string. The two
    methods that we have been using in this book are the IP method and a scan list.


    # IP Address Range


    ```

    Nmap 10.0.2.1-255

    ```


    You can use the CIDR method to run this same scan as well. The CIDR method uses
    the postfix of /24 as shown in the command below.


    ```

    Nmap 10.0.2.1/24

    ```


    You can use CIDR to define a complete range of IP addresses, but it is beyond
    the scope of this course. You can learn more about it in a book on networking.
    You can use an online calculator as the one on http://www.mikero.com/misc/ipcalc/
    to calculate CIDR ranges for an IP address. You can enter the starting IP address
