  md: '# # Chapter 13

    # Kali Linux Tools


    In our previous chapter, we talked about the specific approach and mindset required
    to reinforce our network security. Now, here we are going to focus on a more practical
    topic - the different tools that can help us improve our network security.


    We will cover a whole range of tools that can help us perform various security
    tests and scans on our system to detect vulnerabilities and fix them before they
    are exploited by hackers.


    Now the best thing about Kali Linux that it includes tons of powerful security-hacking
    tools which can help you with information gathering, password cracking, hardware
    hacking, reverse engineering, wireless attacks, vulnerability analysis, exploitation
    testing, stress testing, sniffing & so on.


    In fact, if you do a little searching online, you will find there are literally
    hundreds of Kali Linux tools advertised to help you with your network security.
    It can get really confusing when choosing which tools to use on your system to
    detect vulnerabilities and weak points.


    This is why we have put together a list going over some of the best Kali Linux
    Tools in different categories to help you out. We have also made sure to include
    alternatives to a particular category of tools, so you are not completely stripped
    out of options.


    # ## Nmap - The World''s Most Famous Network Mapper Tool


    The primary feature of Nmap is to find active hosts inside a network. Apart from
    this, it can also help you with port scanning and can even enumerate open ports
    on the local or remote host.'
  merge: -1
  pgno: 276
- img_proc: true
  md: 'And that’s not all; the tool can also collect information regarding the hardware
    and OS used on all connected devices, detect the various applications used on
    the systems along with their version number. You can even extend its functionalities
    by using the Nmap Scripting Engine, a.k.a. NSE.


    # Fierce - Network Mapping & Port Scanning Tool


    Fierce is a popular DNS reconnaissance tool that can help you find hostnames and
    non-contagious IP spaces against a specified domain. As such, you should not confuse
    Fierce as an IP scanner, or a DDoS tool. It can''t help you scan the whole internet
    or perform un-targeted attacks.


    However, it can help you locate both inside and outside a specific network, which
    is one of the reasons why it is mostly used in corporate environments. At its
    core, it is essentially a PERL script that can quickly scan domains in a couple
    of minutes, using sophisticated algorithms and clever tactics.


    # Unicornscan - Information Gathering & Data Correlation Tool


    Unicornscan is one of the most popular Infosec tools that can help you with information
    gathering and data correlation. It comes with advanced asynchronous TCP and UDP
    scanning features backed by useful network discovery patterns to help you locate
    remote hosts.


    The tool can also collect and showcase information about the software and applications
    running on each of the remote hosts. Other notable features include the option
    to use custom data sets along with support for SQL relational output.


    # Wireshark - Network Analyzer


    Wireshark is a cross-platform network analyzer tool that is widely used because
    of its ability to show detailed information about everything going'
  merge: -1
  pgno: 277
- img_proc: true
  md: 'on inside your network. It also tags along a very intuitive GUI, which makes
    it extremely beginner-friendly and easy to use.


    Now coming to the feature side of things, the tool offers useful features like
    Packet Live Capture, Offline Analysis, Full Protocol Inspection, Gzip Compression
    and Decompression, VoIP analysis, and much more. You can also use the tool to
    help you decrypt WPA/WPA2, SSL/TLS, IPSec, and the likes.


    # Aircrack-ng - Wireless Security Software Suite


    With Acrack-ng, you will get access to a complete suite of tools to help you assess
    your network WIFI security. All the included tools are command-line based, which
    means you can do heavy scripting.


    Some of the notable tools available with Acrack-ng can help you capture packets
    of data and export them to text files to get processed by third-party tools. Besides
    this, you also get access to attacking tools that can help you replay attacks,
    create fake access points, perform packet injects, and help with deauthentication.


    # Kismet Wireless - Wireless LAN Analyzer, Sniffer, and IDS


    Kismet is one of the first choice of security experts looking for Wireless LAN
    Analysis, Sniffers, Wardriving tools, and Wireless Intrusion Detection Frameworks.
    The tool is multi-platform compatible and works with almost any wireless card.


    The tool can be used with WiFi interfaces, Bluetooth interfaces, software-defined
    radio hardware, and some other specialized capture hardware. In terms of functionality,
    it can help you identify wireless clients, detect wireless intrusions, and much
    more. You can even configure it to work in the background as you run your assessments
    using other tools.


    # John The Ripper - Cryptography Testing Tool'
  merge: -1
  pgno: 278
- img_proc: true
  md: 'John The Ripper is one of the fastest password cracking cryptography tools
    in the market. Right from the start, the tool has been used to help users detect
    weak Unix passwords and has gained a lot of popularity thanks to its high speed
    and great performance.


    The password decryption methods are set automatically based on the detected algorithms.
    The tool also comes with dedicated support for dictionary attacks along with the
    option to define your own custom dictionary lists. The brute force attacks can
    also be customized with your own set of rules.


    # BeEEF - Browser Exploitation Framework


    Browser Exploitation Framework, also known as BeEF, is a powerful and popular
    penetration tester most used to scan out vulnerabilities and weak links in the
    browser and then exploit those flaws in the host. The tool is primarily focused
    on testing the security of both desktop and mobile browsers. As such, you will
    get access to specific modules that will help you audit the browser security in
    real-time.


    Some of the main noteworthy features of the tool include a dedicated Web User
    Interface, a modular structure in terms of functionality, Metasploit Integration,
    powerful history and gathering intelligence, interprocess communication and exploitation,
    and much more. Also, being a browser exploitation framework, the tool can help
    you detect any installed plugins on the browser.


    # Yersinia - L2 Attacks


    Yersinia is a security framework dedicated for layer 2 Attacks on different networks.
    It can scan out flaws and vulnerabilities in the security protocols used by the
    networks to find points of attack. The tool works with a wide range of network
    protocols, including CDP, DHCP, DTP, ISL, HSRP, STP, and VTP.'
  merge: -1
  pgno: 279
- img_proc: true
  md: 'You will get access to a sleek GTK Graphical User Interface from where you
    get control all the features. Some of its notable functionalities include a dedicated
    nurses mode, option to read custom configuration files, a debugging mode, support
    for log files to save all results & data, and much more.


    # DHCPig - DHCP Exhaustion Application


    DHCPig is a Dynamic Host Configuration Protocol (DHCP) exhaustion tool. It can
    help you create and launch advanced attacks on networks that can consume all IPs
    on a LAN, limit new users from obtaining IPs, and release any IPs by use of the
    network. As the icing on the cake, the tool can even turn all windows hosts offline
    using ARP.


    Once you execute the script, it will first grab your Neigh’ IPs and listen for
    DHCP requests from any connected clients. If it detects an offer, the tool will
    respond with a request for that offer. It can also loop and send DHCP requests
    from all different hosts and MAC addresses, detect neighbor MAC & IP address and
    release them from the DHCP server, and much more.


    # THC Hydra - For Brute Force Crack Remote Authentication Services


    Next up, we have THC Hydra - a free hacking tool that can help you launch brute
    force attacks to crack remote authentication services. The tool comes with support
    for more than 50 protocols, which makes it perfect for testing the password security
    levels of any type of server environment.


    The tool is known for its super-fast password cracking speeds, the capability
    to run on multiple operating systems, option to launch multiple brute force attacks
    parallels, and much more. Also, being a module-based application, it comes with
    the option to add custom modules to extend its functionality.'
  merge: -1
  pgno: 280
- img_proc: true
  md: '# Metasploit Framework - Penetration Testing Suite


    The Metasploit Framework can help you create, test, and execute exploits against
    remote hosts. It gives you access to a whole suite of penetration testing tools
    paired with a powerful terminal-based console – msfconsole - help you locate targets,
    start scans, exploit any vulnerabilities, and collect any and all available data.


    It is, in fact, one of the most powerful security auditing tools in the market,
    and being available for free, it is something you should have up your belt. Notable
    features of the tool include support for network enumeration and discovery, ability
    to evade detection on remote hosts, development and execution of exploits, and
    much more.


    # FunkLoad - Web-Stress Tool


    With FunkLoad, you get a powerful functional and load Web tester on python. It
    can help you emulate a web browser complete with real browser functionalities
    like cookies, referrer support, and so on. It is perfect if you are looking to
    test a web project and analyze the performance of your web server.


    In terms of functionality, the tool can help you functional testing and regression
    testing of your web projects. It can also monitor your server performance after
    loading the application to find any bottlenecks. Other notable features include
    load testing to find bugs, stress testing to gauge application recoverability,
    and so on.


    # SlowHTTP - Web-Stress Application For HTTP Servers


    SlowHTTPTest is by far the most well-known application layer DoS attack simulator.
    It is highly configurable and can help you lengthen an HTTP connection to simulate
    the Application Denial of Service attacks. It is ideal for testing your server
    or DoS vulnerability, or simply to test how many simultaneous connections it can
    handle at a time.'
  merge: -1
  pgno: 281
- img_proc: true
  md: 'The tool also generates useful statistics on each test, so you get access to
    useful and actionable information. Once a test is completed, it will save all
    the stats and metrics in an HTML or CSV file, which you can use for representation
    or further analysis. Other notable features of the tool include an option to set
    verbose levels, a custom HTTP Connect Rate, and even support for Proxy redirects.


    # Inundator - Multi-Thread, queue-based intrusion detection Evasion Security Tool


    Inundator is a multi-thread, queue-based intrusion detection false positive generator.
    Also, since it''s completely anonymous (thanks to TOR integration), it is perfect
    for testing intrusion detection or prevention systems. It can literally flood
    the security system by generating over a thousand false positives per second.


    All the false positives generated using the tools used very poor pattern matching
    rules. As such, if the system detects little to no false positives, then it means
    it is based on a well-written set of rules. Whereas, if it becomes victim to the
    hundreds of false positives, then you should consider adopting heuristic-based
    detection or anomaly-based detection mechanisms on your networks.


    # Social Engineering Toolkit


    Social Engineering Toolkit is another powerful penetration testing framework boasting
    tools of tools to help you create and execute a social engineering attack in a
    matter of clicks. It is perfect if you want to hack into social network accounts
    using powerful social engineering tips and tricks.


    You will get access to tools that can help you with WiFi-based attacks that can
    redirect or intercept packets from users on the same WiFi network as yours. On
    top of that, you will get to create SMS, Email, and web-based spoofing and phishing
    attacks. The tool can even let you create malicious .exe files that will compromise
    users’ systems after they run it.'
  merge: -1
  pgno: 282
- img_proc: true
  md: '# OpenVAS - Vulnerability Scanning Tool


    OpenVAS is free software that can help detect vulnerabilities in any local or
    remote networks. It can also help you write, create, and integrate your custom
    security plugin straight on the OpenVAS platform. On top of that, the platform
    will give you access to over fifty-thousand NVTTs (Network Vulnerability Tests),
    which can scan almost any vulnerability in your system.


    Now, taking a look at some of the notable features of the software, you get the
    option to perform simultaneous host discovery, network mapping and port scanning,
    access to OpenVAS transfer protocol, full integration with SQL databases and SQLite,
    automatic scheduled scans, and much more.


    # Nikto - Helps In Full Web Server Scans


    Nikto is designed to work as a complementary software to some vulnerability scanning
    tools, including OpenVAS. It can help you perform a full scan on a web server
    to locate vulnerabilities and flaws in the system/network. The scan results are
    extremely comprehensive and can gather information on insecure files, app patterns,
    server software that is of date, file names (default), any software misconfiguration,
    and so on.


    You can use it to scan several ports on the web server at the same time. On top
    of that, it comes with IDS evasion techniques, the option to output results in
    various formats, username enumeration for both Apache and cgiwrap, and much more.
    The tool can even help you scan CGI directories, use configuration files customized
    to your requirements, debug output, and help identify software through headers,
    favicons, and icons.


    # WPScan - Auditing Tool For WordPress Security


    WordPress, as you all know, is the most popular CMS platform powering over 30%
    of all websites on the world wide web. So it clearly makes sense to include a
    Kali Linux security tool that can help audit the WordPress security of a website.
    With WPScan, you get to scan and detect other'
  merge: -1
  pgno: 283
- img_proc: true
  md: 'your web project is safe from certain types of attacks and how much sensitive
    information is being exposed from its core files, plugins, or themes.


    The tool can also help you scan weak passwords used by all registered users, and
    stimulate brute force attacks to see if the passwords can be easily cracked or
    not. Other notable features include the option to perform non-intrusive security
    scans, WP username enumerations, and Scheduled WordPress Security Scans.


    # CMSMap - A Centralized Security Solution For All Popular CMS


    Unlike WPScan, which is solely a security tool for WordPress websites, CMSMap
    is a centralized multi-platform security solution designed to work with not only
    WordPress, but also with Joomla, Drupal, and Moodle.


    The tool can help you find security flaws on all the CMSs mentioned above by running
    brute force attacks, scanning for vulnerabilities, and launching exploits to break
    into any found vulnerabilities. The tool also help you set custom user-agent and
    header, comes with support for SSL, a dedicated verbose mode for debugging purpose,
    and so on.


    # Choose The Right Tool And Reinforce Your Network Security


    So as you can see, Kali Linux is compatible with some of the best ethical hacking
    and penetration testing tools in the market. Not only that, but you also get access
    to a whole entourage of different security-centric tools that can help you in
    various ways as well.


    These tools can easily help you quickly scan all security vulnerabilities in your
    network and fix them before any hacker has the time to exploit it.


    # Things We Learned in This Chapter


    +   - Kali Linux is known for its collection of tools.'
