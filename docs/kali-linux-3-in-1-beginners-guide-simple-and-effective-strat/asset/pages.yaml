    +   - 10.0.2.1

    - 10.0.2.15

    - 10.0.2.55

    - 10.0.2.100


    You can use the following command to run tests on all these targets.


    Nmap -iL test.txt


    # Port Selection


    You can use the -p switch to specify ports that you wish to use the Nmap scan
    command on. You can specify a range of ports using a hyphen in the command. You
    can also specify multiple ranges by using comma-separated values in the command.
    You can look at the commands given below.


    ```

    nmap -sS p 1-100

    nmap -sU p 53,137,138,161,162

    ```


    Or you can use both of them as a combination as shown below,


    ```

    nmap -sS p 1-100,445,8000-9000

    ```


    # Output Options


    There are many times when the result of your penetration test would be too long
    to read all on the monitor, or you may just want to log it to a file to analyze
    later. You can use the pipe | operator available in Kali Linux to redirect the
    output of the Nmap command to a required file. We will discuss the options used
    for the output of Nmap scans in this section. We will include normal, GREPable
    and XML outputs. Let us look at all the options one by one. The filename we will
    use in our example is logthis.'
  merge: -1
