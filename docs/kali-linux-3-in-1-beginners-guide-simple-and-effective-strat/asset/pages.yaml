  md: '# Startup/Shutdown Service


    There will be times when you need to restart the Metasploit service. The Metasploit
    service consumes a lot of resources as many of its services need the network to
    function. So there are chances that you may face network errors at times if the
    consumption is very high. In this case, it is best to restart the Metasploit service.
    You first need to check the current status of the service. You can run the start,
    restart, stop commands for Metasploit using the Kali Linux terminal. The commands
    are as shown below.


    service metasploit status


    service metasploit restart


    service metasploit stop


