  md: 'The process of selecting a payload is not as simple as just picking any available
    payload. There are two categories of payloads in the 200 odd payloads that are
    available today: inline and staged. Inline payloads are independent payloads that
    are self-sufficient. Stage payloads will have multiple payloads known as stagers.
    Staged payloads occupy different locations in the target system’s memory and await
    a relay from another payload. Eventually, all the payloads of a staged payload
    come together like an orchestra. If you are searching for the name of a payload,
    it can be a difficult task to understand if it is an inline payload or a staged
    payload. Let us look at an example. Listed below are two different payloads that
    look the same.


    +   - linux/x64/shell/bind_tcp (Staged)

    - linux/x64/shell_bind_tcp (Inline)


    The “Show Payloads” command in Metasploit will show the available payloads. The
    column on the extreme right gives a small description of the payload and tells
    you if the payload is inline or staged. If there is no type specified for the
    payload in the description, it is considered to be an inline payload by default.


    # Listeners


    Even James Bond has sometimes taken orders from above. The Metasploit framework
    contains specific handlers known as listeners that communicate with the session
    that a payload established in a bind shell where it will lay dormant and wait
    for a connection or it can also be active and keep prompting for a connection
    from the attacker. A listener is needed to maintain back and forth communication
    between the attacker and the target system. Listeners are automatically taken
    care of by the Metasploit framework and therefore, require very little manual
    intervention.


    # Shellcode'
