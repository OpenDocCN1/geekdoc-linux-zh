  md: '# Kali Linux Installation Requirements


    Kali with its Kali Linux 1.0.8 now supports EFI out of the box. This feature makes
    it very easy and simple to get Kali Linux installed on a wide set of Apple devices
    such as MacBook Pro, Air and Retina versions.


    The model/make/year of the device will either make your experience or break your
    experience with the Kali Linux installation. Newer the device, the better your
    experience. Pre-installing the device with rEFInd will increase the odds of a
    successful installation on older devices.


    This particular chapter will guide you to dual boot an OS X with Kali Linux alongside
    rEFInd, optionally allowing you to encrypt your Kali Linux installation.


    Your experience with using Kali Linux is dependent on the make, model and the
    year your device was manufactured. Newer devices will work better with Kali Linux.
    If you have an older system, it is advised that you install rEFInd to improve
    the chances of success.


    When we use a 3rd party software rEFInd, it helps us open up the boot menu for
    OS X, which is apt for dual booting. It also helps older Apple devices boot from
    USB, which otherwise could not. Once you have installed Kali Linux, you can customize
    rEFInd to hide it or remove completely.


    # Installation Prerequisites


    +   1. Minimum disk space of 20GB for the Kali Linux installation.

    2. A minimum of 1GB RAM. However, it is recommended to have 2GB or higher.

    3. USB boot may or may not work on devices older than 2012 without rEFInd. Therefore
    a blank DVD is advisable.'
