    # -sA ACK Scan


    The ACK scan helps you find out if a TCP port is protected or not. The scan will
    initiate a connection with the target system using the ACK flag. In reality, the
    first flag should always be a SYN flag. However, this method can be used to bypass
    the SYN command and pose as the ACK command to an internal request that was sent
    by the target system. If the response received to this command is reset(RST),
    it would indicate a TCP port that is not filtered or protected. No response or
    an ICMP response of type 3 with codes, 1, 2, 3, 9, 10, or 13 would mean that the
    TCP port is filtered or protected.


    ```

