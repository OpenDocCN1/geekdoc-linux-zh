    media on which you have loaded the Kali Linux ISO. You will be prompted with the
    Kali Linux boot screen. Click on Live, which will boot you into the Kali Linux
    desktop.


    +   2. Once you are on the Kali Linux desktop, launch the gparted application.
    We will be using gparted to compress the existing Windows partition, which will
    help us create sufficient space for the Kali Linux installation.


    +   3. On gparted, select your Windows partition. There will usually be two partitions:
    a smaller one that is recovery partition and the larger one, which is the Windows
    partition. Resize the Windows partition and leave and create a new 20GB partition
    for the Kali Linux installation.


    +   4. Once you have segregated your memory into the required partitions, ensure
    that you apply the changes to the hard drive. Exit and reboot.


    # Kali Linux Installation Procedure


    +   1. The installation process here onward is the same as that mentioned in the
    previously in Kali Linux Hard Disk install. It only changes when you reach the
    partitioning section where you have to select “Guided – use the largest continuous
    free space” which you created using gparted earlier.


    +   2. Upon completion of the installation, you will be prompted with a GRUB boot
    menu. This will now give you two options to boot into Windows or Kali Linux.


