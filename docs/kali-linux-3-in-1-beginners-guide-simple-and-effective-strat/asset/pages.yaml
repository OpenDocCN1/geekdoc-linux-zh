  md: "# # Chapter 3\n The Hacking Process\n\nKali Linux is a hacker tool. If you\
    \ choose Kali Linux, I hope you know now that you are going to use it for hacking\
    \ or penetration testing. That’s why you need to learn about the hacking process.\
    \ The hacking process can be applied to most of the hacking attempts and can be\
    \ used as a framework. These steps will guide you to become better at hacking(both\
    \ ethical and unethical).\n\nThe key five steps that are present within a hacking\
    \ process include the:\n\n+   - Information Gathering (Reconnaissance)\n- Scanning\n\
    - Gaining Access\n- Maintaining Access\n- Covering Tracks\n\nLet’s go through\
    \ each of the steps in detail.\n\n# ## Information Gathering(Reconnaissance)\n\
    \nThe first step that you are going to do is information gathering. It is the\
    \ most important part of the hacking process. And, most of the time, it gets ignored.\
    \ The information-gathering process is known as reconnaissance. In this step,\
    \ your job is to gather as much information as you can — the more useful information\
    \ you have, the better the chance of success of the hacking process. The information\
    \ you gathered in your very first step will help you in all the next four steps,\
    \ including scanning, gaining access, maintaining access, and covering tracks."
