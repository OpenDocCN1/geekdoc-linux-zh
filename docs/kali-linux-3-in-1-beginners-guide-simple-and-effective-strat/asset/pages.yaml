  md: '# # Chapter 11

    # Kali Linux And Security Assessment


    In this chapter, we will explore how Kali Linux can help us with the Security
    Assessment. First, let''s familiarize ourselves with what security means in terms
    of an information system. We covered the CIA triad in earlier as well. For a refresh,
    let''s go through them again.


    Mainly, you should concern yourself with three primary attributes:


    +   - **Confidentiality** - is your system information secure from authorized
    access?


    +   - **Integrity** - can your system information be changed or modified in a
    way that is not intended or desired?


    +   - **Availability** - and finally, is all the data and information on your
    system readily accessible as when it is required?


    These three factors form the triad of cybersecurity, also known as the CIA. These
    are the areas where you will focus your security concerns as a part of the deployment,
    maintenance, and assessment. With this in mind, let''s move on to how to use Kali
    Linux in a Security Assessment.


    # ## Preparing Kali Linux for Security Assessment


    The first thing to make sure is always to use a clean Kali Linux installation.
    Many security professionals without much experience make the novice mistake of
    using the same installation in multiple security assessments. This can cause a
    lot of problems.


    For starters, during the security assessments, you will need to reinstall, tweak,
    and change the system. All these changes will build on one another, increasing
    the overall complexity of future configurations. Furthermore,'
  merge: -1
  pgno: 260
- img_proc: true
  md: 'each assessment is unique in its way, and using the same installation can cause
    cross-contamination of client data.


    However, you can use a pre-customized version of Kali Linux primed for the network/system
    it is assessing. This can, in fact, help automate parts of the process, which
    will lead to more convenient and less time consumption.


    Here are some points to keep in mind while creating your custom installation of
    Kali Linux:


    +   Use an encrypted installation as it will protect your data on the physical
    machine. As an extra measure, create a decryption key, send it to the site where
    you will take the machine after completing the assessment and nuke the decryption
    that is with you. That way, even if the device gets stolen, all your data will
    be safe and encrypted.


    +   Preplan all the tools and packages you will need during the assessment beforehand.
    During the assessment, it is highly likely that you won''t have ready access to
    the internet. Therefore keep all these packages with you from the get-go.


    +   Also, review your network settings before starting with the assessment. Review
    the services that are connected with your assigned IP address and recheck your
    DHCP settings.


    Keeping these few things in mind will help you during and after the security assessment
    to ensure everything is handled smoothly.


    # The Different Types of Security Assessments


    With your Kali Linux ready to go, it is time you decide what type of security
    assessment you want to conduct on your network. The different types of security
    assessments can be broadly classified into four types: Vulnerability Assessment,
    Compliance Penetration Test, Traditional Penetration Test, and Application Assessment.'
  merge: -1
  pgno: 261
- img_proc: true
  md: 'Here will give you a brief run-down on all these different types of assessments.
    But first, you need to have a clear understanding regarding a vulnerability and
    an exploit.


    # What Is A Vulnerability?


    It is basically a flaw in the network that a bad actor can use to compromise the
    confidentiality, integrity, and availability of your system information.


    # What Is An Exploit?


    It is a software, which if and when used, can take advantage of a specific vulnerability
    in the system. In practice, an exploit requires changing a running process and
    forcing it to make unintended actions.


    Now, with the definitions out of the way, here is a look at the different types
    of security assessments:


    # Vulnerability Assessment


    In vulnerability assessment, you are required to create a simple inventory highlighting
    all the discovered vulnerabilities inside a target environment. You will most
    likely use an automated tool to identify listening services, server software,
    versioning, platform, and so on.


    Once done, you will have to check each of them for any known signature of the
    potential threat of vulnerabilities. These signatures include a wide range of
    data point combinations which include but are not limited to:


    # A Version of the Operating System


    An outdated operating system that hasn’t received a security patch is more likely
    to have more vulnerability.


    # Patch Level


    Many times, even though a security patch is released, the admin hasn’t installed
    on their system, making it more vulnerable.'
  merge: -1
  pgno: 262
- img_proc: true
  md: '# Processor Architecture


    Depending on what architecture the system is based on - Intel x86, Intel x64,
    ARM, UltraSPARC, the network might be prone to different vulnerabilities.


    # Software Version


    Certain software versions have security vulnerabilities that can be used by hackers
    to break into an otherwise secure system.


    And much more.


    Your job will be to use these data points to create a signature as a part of your
    vulnerability assessment. Now, as you can imagine, the more data points you have,
    the more accurate the signature you will be able to create.


    # Compliance Penetration Test


    Next, we have the Compliance Penetration Test. It is the most common type of penetration
    test as they are using government and industry mandated requirements and based
    on a compliance framework used by that particular organization.


    Now, as you can imagine, there are tons of industry-specific compliance frameworks.
    A very popular example would be the PCI DSS - Payment Card Industry Data Security
    Standard, which is a compliance framework used by payment card companies that
    process retail transactions.


    While conducting a compliance test, you might first have to start with a vulnerability
    assessment as it will satisfy many of the requirements of most compliance frameworks.


    # Traditional Penetration Test


    Traditional Penetration Tests, in contrast to the previous assessment types, doesn''t
    start with a scope definition. It generally will focus on a goal - for'
  merge: -1
  pgno: 263
- img_proc: true
  md: 'example, you might be required to simulate a situation showcasing how much
    of the network gets compromised if an internal user is compromised.


    As such, these types of tests aren''t focused on finding and documenting vulnerabilities
    inside a system. Instead, they focus on certain identified issues and stimulates
    the worst-case scenario that is possible if it were to happen.


    Technically, it can get a bit more complicated. Not only will you have to find
    the vulnerabilities, you must follow up its impact by using an exploit, and then
    exploring the level of access of the exploit provides to ultimately understanding
    if it can lead to further attacks against the target environment.


    You will have to critically review your target environment and have to resort
    to manual searching, out of the box thinking, apart from using tools and vulnerability
    scanners. This generally needs to be done a couple of times to make sure that
    no stone is left unturned.


    Generally, these sorts of assessments can be segmented into different phases where
    you will need to use different tools for information gathering, vulnerability
    discovery, exploitation, pivoting and exfiltration, reporting, and so on.


    # Application Assessment


    While the previous assessments involved testing the entire targeted environment,
    an application assessment requires you to focus all your resources on a single
    application. With more organizations putting extra focus on their mission-critical
    apps, this is slowly becoming extremely popular and important security assessment.


    Now, Application Assessments can be conducted in various ways. For example, you
    can use an application-specific automated tool to find potential vulnerabilities
    and security issues in the application. These types of tools use application-specific
    logic to identify unknown issues instead of'
  merge: -1
  pgno: 264
- img_proc: true
  md: 'relying on any known signatures. As such, the tools have a built-in understanding
    of how the application works and functions.


    Also, depending on the application assessment, you might be required to conduct
    your tests inside a black box or white box manner:


    # Black Box Application Assessment


    Here, the tool will interact with the application without special knowledge or
    deep access beyond what a standard user gets to experience. This can help you
    understand how a hacker can break into the application from the outside.


    # White Box Application Assessment


    This is completely opposite with the tool or assessor getting full access to the
    source code as well as administrative access to the platform running the application.
    This type of test helps create a comprehensive review of all the app functionality.


    So which type of application assessment should you use? Well, it depends on the
    goal of the assessment! If you want to know the worst-case scenario when the app
    comes under a focused external attack, then running a black box assessment would
    make the most sense. On the flip side, if you are interested in identifying as
    many security issues as possible, then the white box approach would be the way
    to go.


    There is also room for a hybrid assessment between white box and black box assessment,
    but as we said, it all depends on what goal you want to achieve.


    # Things we Learned in This Chapter


    +   Preparing Kali Linux for a security assessment. Importance of using a clean
    installation, or a dedicated pre-configured installation of Kali Linux.'
  merge: -1
  pgno: 265
- img_proc: true
  md: '+   * The difference between vulnerability and exploitation.

    * What is vulnerability assessment?

    * When to do compliance penetration testing and traditional penetration testing?

    * What is the Application Assessment?


    Benefits of black box assessment and white box assessment.'
  merge: -1
  pgno: 266
