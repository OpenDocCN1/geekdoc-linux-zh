  md: '# Kali Linux on ARM


    # Kali Linux – ASUS Chromebook Flip


    The ASUS Chromebook Flip is a Chromebook ARM device with the following configuration.


    +   1. 1.8 GHz quad core processor


    +   2. 2GB or 4GB of RAM


    +   3. A 10 point 10.1” multitouch screen


    Kali Linux can be installed on an external SD card or a USB drive.


    The following instructions will help you install Kali Linux on an ASUS Chromebook
    Flip.


    +   1. You will need an 8GB or higher USB drive or SD card to install Kali Linux
    on.


    +   2. Enable USB boot on your Chromebook by going into the developer mode. The
    legacy boot can be ignored on this device since SeaBIOS is not supported.


    +   3. Download the Kali Linux ISO from https://www.offensive-security.com/kali-linux-arm-images/
    for ASUS Chromebook Flip.


    +   4. You can now write this image to the SD card or USB drive by using the dd
    utility. In the example shown by us, we will be installing Kali Linux on the SD
    card which has the path /dev/sdb. This can be changed as per your requirement.


    Note: This will erase all content on your SD card or USB drive. Choosing the wrong
    disk device can also result in the hard disk of the device wiped out.


    ```

    xzcat kali-$version-veyron.img.xz | dd of=/dev/sdb bs=512k

    ```'
  merge: -1
  pgno: 61
- img_proc: true
  md: 'The time taken to complete the Kali Linux installation depends on the speed
    of the SD card or USB drive and the size of the Kali Linux image.


    After the dd operation completes, you can boot up the ASUS Chromebook Flip keeping
    the SD card or USB drive plugged in. You can log in to the Kali desktop using
    the ''root'' username and password ''toor''.


    # Kali on ASUS Chromebook Flip – Developer Instructions


