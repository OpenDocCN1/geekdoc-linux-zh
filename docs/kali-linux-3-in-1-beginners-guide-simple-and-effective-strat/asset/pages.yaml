  md: '# # Chapter 6

    # Troubleshooting Installations


    # **Kali Linux installation failures**


    Kali Linux installation can fail due to numerous reasons. Partial or corrupt downloads
    of the ISO, insufficient disk space on the target system, etc. are some of the
    reasons die to which the Kali Linux installation can fail. In this chapter, you
    will learn about the common errors that are encountered and the troubleshooting
    can be done. We will go through the “Red Screen” error, which is usually encountered
    upon failure of the Kali Linux installation which is an indicator that a problem
    has occurred.


    The red screen reads


    > “An installation step failed. You can try to run the failing item again from
    the menu, or skip it and choose something else. The failing step is: <description
    of the failing item>”


    If you click on continue, you will be redirected to the Debian installer main
    menu. On the main menu, navigate to “save debug logs”:


    Hitting the continue button should take you to the Debian installer main menu.
    From that main menu, browse to the “save debug logs”.


    Here, there are several methods through which you can transfer the installation
    log files to another system or disk. The easiest way is to start a web server
    on the source machine where the installation is ongoing.


    You will be prompted with a screen, which has the following question with 3 options.


    # **How should the debug logs be saved or transferred?**


    +   1. Floppy'
  merge: -1
  pgno: 92
- img_proc: true
  md: '+   2. Web


    +   3. Mounted file system


    Selecting the ‘web’ option will start a web server from which you can download
    or view the installation logs.


    A simple web server will be started and the screen will let you know the URL from
    which you can access the logs.


    On choosing this option, a web server is created and you can view the logs or
    download the logs from the URL.


    DO a log analysis to understand if something is irregular. Check if you can see
    any error messages or warnings ,which may have been the cause of the installation
    failure. In this particular case, the machine on which we are installing Kali
    has insufficient disk space, which cause the installation to fail and this can
