- img_proc: true
  md: '# # Chapter 1

    Getting Started With Kali Linux


    Kali Linux is one of the leading Linux distros out there. It is mainly used for
    hacking purposes. The hacking part can be both black and white hat(we will cover
    the different types of hackers in detail later on). As a learner myself, I have
    always wondered what makes Kali Linux so interesting. That encouraged me to write
    the book, and here we are!


    # ## What is Kali Linux?


    Kali Linux is a Linux operating system. It is based on Debian. The main purpose
    of Kali Linux is security. It is used for penetration testing and security auditing.
    This also makes it an ideal tool for hackers who have malicious intent.


    The main thing that makes Kali Linux is the tools that it has to offer. It has
    tons of tools that are pre-installed. The tools can be used to perform various
    information security tasks. For instance, it lets you do reverse engineering,
    security research, computer forensics, and so on. Currently, it has more than
    600 plus penetration testing programs. The number of tools will continue to grow
    as more research is done in the security domain.


    Offensive Security manages the Kali Linux distribution. It is a leading information
    security training company. They now manage the funding that goes into making Kali
    Linux, the best distribution for penetration testing and digital forensics. The
    two main persons behind the project include the Dev Kearns and Mati Aharoni of
    the Offensive Security. Another developer that made an impact is Raphael Hertog,
    a Debian expert.


    All of these make Kali Linux a perfect too to learn about hacking or pentesting.
    You can choose how you want to use it.'
  merge: -1
  pgno: 158
- img_proc: true
  md: 'The evolution of Kali Linux started with the demise of BackTrack Linux in 2013.
    The project was re-booted into Kali Linux in March 2013 while maintaining the
    Debian development standards.


    Kali Linux is also well known for supporting the Metasploit Project. The project
    is used for security exploit development and execution.


    # Installing and Preparing Kali Linux


    Before we get started, we need to prepare Kali Linux. Installing Kali Linux is
    easy. Also, Kali Linux can be installed in two ways. You can install it on a separate
    hard disk using a USB drive or simply use a virtualization solution to virtualize
    the operating system.


    +   * USB Method

    * USB method dual boot installation

    * Virtualization method (VMware or Hyper-V)


    If you are new to virtualization, let me explain it to you in simple words. Virtualization
    is a method through which an operating system or software gives its own separate
    virtual resources to run on an already existing operating system/device/solution.
    There are many virtualization solutions out there, including VMware. Many big
    companies rely heavily on virtualization techniques. Even cloud companies use
    virtualization to provide cloud computing to its subscribers. The hosting company
    also have virtualization ingrained into their services. By now, you should know
    that virtualization is a big thing, and it is it!


    If you are using Windows 10, the latest iteration of Windows, then you can use
    virtualization to install Kali Linux. Windows 10 has been slowly accepting Linux,
    and that''s why in 2016, they introduced their own Hyper-V solution for virtualization.
    If you are using the latest Windows 10 version or 1803 version or above, your
    Windows should come pre-equipped with Hyper-V software.'
