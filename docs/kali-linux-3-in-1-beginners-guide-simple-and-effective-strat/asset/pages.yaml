    SSH keys utilize their own cryptographic keys. They are stored as SSH host keys.
    Also, the keys are stored in /etc/sh/shh_host_*. The keys should be kept safe.
    This means that you should not share the keys to anyone and should be kept in
    a safe place.


    One thing that you need to make sure is to create new SSH keys. If you installed
    your OS using the debian-installer or simply copied the full disk image, then
    there can be some pre-installed SSH host keys. As a user, you do not want to use
