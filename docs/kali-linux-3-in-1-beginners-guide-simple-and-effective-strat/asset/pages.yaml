- img_proc: true
  md: 'When you run a port scan for HTTP, you may get a result that HTTP is open on
    port 80, but it does not mean that the web application is also on port 80. You
    need to open a browser and verify if a web application is actually running on
    a particular default port like port 80 or 443. Go through all the links on the
    website as it may sometimes give you valuable information right in front of your
    eyes. If you get a login popup when you visit a particular page on the website,
    try guessing up ten passwords or just press the Escape key to see if it bypasses
    the login prompt. Inspect the source code for every page on the website and check
    if it has any notes or comments from the developer. It may seem like a long and
    boring process, but no automated tool can flag every vulnerability on a website
    and a manual review always helps.


    # Step 2: Fingerprinting


    A manual review may not be enough to know the operating system, server, and web
    applications are running on the target system. Kali Linux makes use of fingerprinting
    to find information about these three parameters.


    Kali Linux has a tool called NetCat, which serves the purpose of fingerprint and
    works as a listener for incoming connections as well.


    You can use the following command on the Kali Linux terminal to use NetCat


    ```

    nc {host}{port}

    :example: nc 192.168.56.102 80

    ```


    The command will initiate a connection on port 80 with the host at IP 192.168.56.102,
    but it will not return anything until a command is fired from the source machine.
    NetCat supports different types of fingerprinting techniques. Let us look at another
    example.


    ```

    nc 192.168.56.102 80

    ```


    Press Enter'
  merge: -1
