    ```


    # for 32 bit systems:


    ```

    wget http://http.kali.org/kali/dists/kali-rolling/main/installer-i386/current/images/netboot/netboot.tar.gz

    ```


    ```

    Tar zxp netboot.tar.gz

    ```


    ```

    Rm netboot.tar.gz

    ```


    # Configure Target to Boot From Network


    Once you have configured everything as mentioned, you can now boot a target system
    on the network and configure it to boot from the network. Your PXE server will
    allocate an IP address to the target system and the target system will boot Kali
    Linux.'
