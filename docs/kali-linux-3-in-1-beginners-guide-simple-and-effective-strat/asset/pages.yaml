    # Actions Inside a Meterpreter Session


    +   - **Collect System Data**: This will log all system-related information such
    as passwords, screenshots, etc.


    +   - **Access File System**: You will be able to access the file system on the
    target system. This access will let to upload, download, modify, and even delete
    files on the target system.


    +   - **Command Shell**: This will let you use the command shell on the target
    to further interact with other connected systems.


    +   - **Create Proxy Pivot**: Using this option, you can use the remote target
    system as a gateway. This means that the target system, if connected to other
    systems on the network, will serve as a gateway to start a scan on those systems.


    +   - **Create VPN Pivot**: This option will help you use the remote target system
    to pivot traffic. This is not very different from the “Create Proxy Pivot” button.
    The only difference is traffic through this will be in an encrypted format over
    VPN.


    +   - **Terminate Session**: As the name suggests, this button will terminate
    the session with the remote target system. However, it is important to ensure
    that you have not left any trace behind, which could bite you in the future.'
