- img_proc: true
  md: '# # Chapter 5

    Exploitation


    Exploitation is the third stage of the penetration testing life cycle. In this
    chapter, we will learn about the differences between attack types and attack vectors.
    We will go through the tools available in Kali Linux that can be used for exploitation.
    We will learn specifically about the Metasploit framework and how it can be used
    to attack a target system. We will also learn about hacking web services in brief.


    # ## Introduction


    The National Institute of Science and Technology defines a vulnerability as a
    “weakness in an information system, system security procedures, internal controls,
    or implementation that could be exploited by a threat source.” However, this definition
    is very broad with respect to exploitation and needs further discussion. An “error”
    leads to a vulnerability. The error can be placed in multiple points such as somewhere
    within the information system itself, or even within the humans that manage these
    information systems. Vulnerabilities for an information system can be present
    both inside and outside the system’s network. They can be a result of poor coding,
    incorrect security policies, etc. They can be present outside the technical network
    as well, through the humans that manage these information systems.


    Let consider that vulnerability means the same as weakness. Exploitation would
    be simply taking advantage of weakness to gain access into an information system
    or make the information system useless by creating a denial of service. The only
    thing that can limit an attacker from taking advantage of an exploitation is the
    security measures in place which the attacker might be too lazy or hesitant to
    combat. The brain is the best tool a penetration tester has. It is important to
    remember that a system multiple'
  merge: -1
  pgno: 372
- img_proc: true
  md: 'doors to it. If you find that one door is closed, you need to move to the next
    door quickly without wasting time. Out of all the stages of the penetration testing
    life cycle, exploitation is the toughest task for a penetration tester. A penetration
    tester will learn of all the attacks types that can be used on a single attack-vector
    only with a lot of patience, knowledge, and persistence.


    # Attack Vectors and Attack Types


    There is a small line between attack vectors and attack types that is commonly
    misunderstood and misinterpreted. Many books might tell you that these two concepts
    are synonymous but they are not, and it is important to differentiate between
    them so that exploitation can be executed in an organized manner. If you think
    about a vector in general, it is something that is in motion. This about a pathogen
    such as a spider, mosquito, where each is a different species but has the same
    delivery method that is biting. Every pathogen has the same instruction, which
    is to bite, but how it executes is different from the other. When we talk about
    attack vectors in information systems, we are talking about the different types
    of attacks which are classified as part of a single group. Let us go through a
    table which will help us understand this better.


    | Attack Vectors | Attack Types |

    | Web-Based | Defacement Cross-Site Request Forgery (CSRF) Cross-Site Scripting
    (XSS) SQL Injection |

    | Code Injection | Buffer Overflow Buffer Underrun Viruses Malware |'
  merge: -1
  pgno: 373
- img_proc: true
  md: '| Social Engineering | Impersonation Spear Phishing Intelligence Gathering
    |

    |---|---|n| Social Engineering Network-Based | Impersonation Spear Phishing Intelligence
    Gathering Denial of Service (DoS) Password and Sensitive Data Interception Distributed
    Denial of Service (DoS) Stealing or Counterfeiting Credentials |


    The foundation of exploitation is not only know what type of attack is taking
    place but understand by what means the attack is taking place. We will go through
    the different types of attacks in the sections that follow and will learn about
    the tools that come into the picture in brief. We learn about the Metasploit framework
    in detail. It is important to where you need to put effort, how you need to put
    efforts, and when to apply the tools. Without this knowledge, you will put in
    significant effort which will return negligible results during penetration testing.


    # Local Exploits


    As suggested by the title, local exploits are exploits that are executed locally
    using devices such as your computer, laptop, a network device such as a mobile
    phone, using an established session. You can classify an exploit to be local if
    a penetration tester has physical access to the target system such as a terminal
    to a system, or SSH access to a system, a Virtual Private Network(VPN) connection,
    or a Remote Desktop Connection(RDP). You'
  merge: -1
  pgno: 374
- img_proc: true
  md: 'can modify privileges of accounts, create a Denial of Service attack, upload
    malicious content, steal data, using local exploits. A penetration tester needs
    to keep in mind that local exploits cannot be executed over a public network,
    but only networks that are locally defined. If you are trying to locally exploit
    a system without using the specific code for it, alarms will be triggered and
    your time will be wasted.


    People often misunderstand how local exploits can take advantage of. It is not
    necessary to execute local exploits via an attacker. With the use of social engineering,
    an attacker can simply trick a legit user of the system into executing a code
    leading to a local exploit. An example of this would be a trojan code that can
    be embedded in a PDF file or a Microsoft Excel sheet that appears to be completely
    legit. Another example would be a USB drive that is left as a courier at an organization
    and is waiting to be plugged into any device, after which it will auto-launch
    an exploit code. The possibilities for exploitation are countless and are only
    limited by the thinking ability of the penetration tester. There are various scenarios
    where it becomes difficult to execute remote exploits and the options for local
    exploits that need to be considered.


    # Searching for Local Exploits


    There are a variety of local exploits to be considered, but choosing the right
    one makes all the difference. The Metasploit framework offers a program called
    SearchSploit, which has made this process very simple, and the process is easier
    on Kali Linux. We will go through The Metasploit Framework command line later
    in this chapter, where we will learn to search for exploits. By first, let us
    go through SearchSploit and how it can be used to look for exploits by referring
    to the Metasploit database using a terminal window.


    The steps are as follows.


    +   - Launch the terminal in Kali Linux'
  merge: -1
  pgno: 375
- img_proc: true
  md: '+   * Type in the command searchploit, followed by up to three keywords.


    Example: `root@kali:~# searchploit local windows iis`


    Using the three keywords, the search returned a single result. This is how simple
    it is to use Searchploit. The search linked the three keywords local, windows
    and IIS, to return a vulnerability present in the Windows dynamically linked library,
    running IIS and using the PHP version 5.2.0. You can execute a local exploit here
    resulting in a buffer overflow vulnerability causing a denial of service on the
    host. We have shown the output of the locate command in the figure below which
    gives us more information about the exploit pipe.


    ![](img/a627fe7ba059f4d1e016d75c5d3e79ba_376_0.png)


    # # Remote Exploits


    You can classify an exploit as a remote exploit when you do not have physical
    access to a computer, network or a mobile device but have gained access to it
    remotely through the network. This is why remote exploits are also known as network
    exploits. Irrespective of what the exploit is called, the thumb rule to remember
    is that if the exploit is not local, it is remote. The target of a remote exploit
    is not just a computer, server, or network-related devices. The target range of
    remote exploits extends to web applications, web services, databases, mobile phones,
    printers, and anything else that can connect to a network. As technology is progressing,
    there are more and more smart devices being developed every day that can connect
    to the network. For example, you can look at gaming consoles such as the Xbox
    by Microsoft, Playstation by Sony, smart televisions, smart'
  merge: -1
  pgno: 376
- img_proc: true
  md: 'refrigerators, and the list goes on. You need to accept that if the device
    is an electronic device which can connect to a network, someone in the world is
    already trying to hack it, for fun, or for profit. We will go through remote exploits
    in detail later when we learn about the Metasploit Framework.


    # Metasploit Framework


    Metasploit is arguably one of the most powerful tools available inside the toolkits
    of a penetration test. Metasploit is what it is because of years of knowledge,
    multiple tests and trials, by penetration testers, attackers, researchers and
    even governments from all around the world which represent different parts of
    a community that works in the security domain. From mischievous black hats to
    the best white hats, and everyone between them, everyone has used Metasploit at
    some point in their lives. Metasploit tools were developed by Rapid7 which is
    headquartered in Boston, MA, and they have not spared a single cent or CPU cycle
    to develop the solid framework that is known as Metasploit which can be used in
    the penetration testing life cycle from start to finish. There is also support
    for reporting and government compliance in Metasploit for professionals working
    in the security domain. You will be amazed if this is the first time you will
    be getting your hands on Metasploit.


    Let us go through a brief history of Metasploit. At the beginning of the world
    wide web, there were no organized tools but just a random void which was full
    of chaotic tools.


    Code and messages were all scattered in the corners of hidden notice boards. In
