    # Overt Vs. Covert


    When you are working with an organization to implement penetration testing to
    find the loopholes in its information systems, it is known as an Overt operation.
    The organization has allowed a penetration tester to perform all kinds of tests
    on their systems and therefore, there are no changes of any alarms going off or
    any blocks happening on the tester’s operations. Generally speaking, in over-testing,
    the organization knows that the penetration tester is there to help them and would
    not cause any harm to the infrastructure. An advantage of overt testing is that
    the penetration tester has complete access to the system which allows them to
    gain complete knowledge of the core functions of the system which can be used
    while conducting the tests. The cons of overt testing is that it has limited scope
    and more loopholes may be discovered later on which may need to be communicated
    before the launch of the system. If there are time constraints for the launch
    of a project, overt testing can have a severe impact.


    On the other hand, Cover testing is when you are secretly conducting a penetration
    test on the information systems of an organization wherein you have limited knowledge
    about the target systems. In covert testing, only a few members of the organization
    are aware of the fact that there is a test being conducted on their infrastructure.
    A penetration tester is not given all access to the information system and therefore
    needs to have a complete toolkit to conduct the tests without creating any noise
    on the network. The motive of a covert test is not only to find vulnerabilities
    of the system but also to test the Computer Emergency Response Teams(CERT) and
    Intrusion Detection Systems(IDS) of an organization. A covert test may start as
    a covert mission but can escalate into an over mission if there are multiple'
