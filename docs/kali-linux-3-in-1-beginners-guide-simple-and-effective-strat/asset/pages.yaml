    ;; QUESTION SECTION:

    ;google.com.             IN A

    ; ANSWER SECTION:

    google.com.             300 IN A 172.217.166.110

    ;; Query time: 41 msec

    ;; SERVER: 216.239.34.10#53(216.239.34.10)

    ;; WHEN: Tue Jan 21 21:52:36 IST 2020

    ;; MSG SIZE recvd: 55

    ```


    As you can see, this command has zone a zone transfer, and now the A record of
    google.com is set to the IP 172.217.166.110.


    There is a chance for most of the zone transfers failing. However, if the target
    system’s name servers are misconfigured or are open to public access,'
  merge: -1
