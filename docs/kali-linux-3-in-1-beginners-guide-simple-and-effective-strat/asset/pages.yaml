    \ good to use at least two or three applications to scan a web server"
  merge: -1
  pgno: 396
- img_proc: true
  md: 'so that you can establish the number of vulnerabilities the web server may
    have.


    We will discuss in brief about a few tools available for scanning web servers
    and web applications in this chapter.


    # Arachni


    The Arachni tool available for scanning web applications runs through a web interface
    much like the Nessus tool we discussed earlier. However, compared to Nessus, Arachni
    can perform a single scan on online host on a single port at a given time. If
    the host has multiple web service running on different ports, you will need to
    run a scan individually on every port. For example, if the URL thiscomany.com
    has a web hosting service on port 80 and SSH on port 22, you will need to run
    two scans to assess both ports.


    You can access the Arachni web application scanner in Kali Linux using the following
    path.


    Applications > Kali Linux > Web Applications > Web Vulnerability Scanners > arachnid_web


    The terminal will show the following commands automatically followed by the launching
    of the arachni web interface.


    ```

    Terminal

    File Edit View Search Terminal Help

    [-] Starting the Arachni Dispatch server...

    [+] Starting the Arachni web server...

    [>] The web interface is at: http://127.0.0.1:4567

    --- It may take a while to startup, try refreshing the page a couple of times.

    [>] Hit Ctrl+C to shut everything down.

    ```


    You can enter the target system host or URL in the URL field to start a scan on
    the target system.'
  merge: -1
  pgno: 397
- img_proc: true
  md: 'While the scan is in progress, you will see the following screen.


    ![](img/a627fe7ba059f4d1e016d75c5d3e79ba_398_0.png)


    After the scan is complete, Arachni will provide a scan report, as shown in the
    figure below.


    ![](img/a627fe7ba059f4d1e016d75c5d3e79ba_398_1.png)


    # # w3af Web Application Attack and Audit Framework


    The developer community at OWASP developed the w3af tool. It provided limited
    reporting, which is not as elaborate as arachni. The advantage of'
  merge: -1
  pgno: 398
- img_proc: true
  md: 'w3af is that it supports a variety of additional plugins for scanning which
    can be updated regularly.


    You can launch w3af in Kali Linux from the following path.


    Applications > Kali Linux > Web Applications >Web Vulnerability Scanners > w3af


    When the w3af application is launched, a graphical interface for the tools is
    presented with an empty profile and no plugins selected by default. You can create
    a new profile with the plugins of your choice and click on “Save As” from the
    menu bar. There are some predefined profiles to be used as well. You can select
    the OWASP_TOP10 profile to begin with. You have control over which plugin you
    wish to use for your scans. Even if you select a predefined profile, you can uncheck
    the plugins that you do not want to use for your scan.


    # Webspoit


    Webspoit is another tool developed using ruby and looks similar to Metasploit,
    but was developed specifically to scan web applications and web servers, and social
    engineering. Webspoit supports integration with Metasploit by using exploits,
    payloads and even meterpreter. The tool is capable of crawling through web servers
    and then attacking them resulting in a Denial of Service.'
