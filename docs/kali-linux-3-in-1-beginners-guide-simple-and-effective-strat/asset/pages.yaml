    tool associated with the operating system of the system that was hacked by typing
    “shell” on the command line of the meterpreter shell.


    # Exploiting Web Servers and Web Applications


    Software in any form is software. No matter what technologies or what code was
    used in developing the software, irrespective of the function it serves, it will
    still have vulnerabilities. The case with web applications is the same. The only
    difference perhaps is that a web application has more back doors for an attacker
    to enter the system and steal information, as it as more public gateways than
    regular software. It is not enough to secure the operating system physically and
    at the operating system level if the services running on the server are not individually
    secured.


    The Open Web Application Security Project, OWASP, in short, is a nonprofit organization
    that works for software security improvement. Every year, OWASP releases the top
    ten most common vulnerabilities on the internet.'
