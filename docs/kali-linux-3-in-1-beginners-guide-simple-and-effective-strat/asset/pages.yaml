    # HTTPTunnel Package Description


    The HTTPTunnel is a Kali Linux tunneling software. It can create tunnels through
    network connections. It basically has two components.


    The client side which exists behind a firewall and will accept connections on
    ports that are connected to a remote server or will play the role of SOCKS proxy.
    The authentication source for SOCKS source can be a list of fixed users which
    is fetched from a MySQL or LDAP directory. The client component is aPer script
    that is independent of platform or is also available as a Win32 binary.


    The server side component exists on the Internet to which the client makes HTTP
    requests. The server then translates and forwards these requests to network connections
    on upstream servers, which are remote.


    There are two available servers. A web server, which basically hosts a PHP script.
    The PHP script that you host on the web server will allow your web server to act
    as the server to run HTTP tunnel.


    The second server is a standalone server, which runs a Perl script independent
    of the platform or a Win32 binary. If you have your own box like a home computer,
    which is connected to the Internet, it can be used as the standalone server. Hosted
    server may pose restrictions to the PHP script (such as maximum execution time
    for the PHP script which will result in limiting the time for your connections)
    that you are hosting on based on the company that is providing you the hosted
    server. Therefore, having a standalone server of your own has an advantage over
