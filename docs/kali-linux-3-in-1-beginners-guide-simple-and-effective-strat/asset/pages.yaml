    # Dual Boot Kali Linux Installation


    Dual-booting Kali Linux is very similar to the above process. Here, you need to
    make sure that you have enough room for installing the Kali Linux. A different
    partition(even on the same hard disk) will work. However, if you lack space, you
    need to use a tool known as GParted. The tool gives you the ability to shrink
    the Windows installation and make space for the Kali Linux installation. To do
    a proper dual boot Kali Linux installation, you need to follow the steps mentioned
    below:


    +   - You first need to boot from your USB drive or the choice of your medium
    installation. Once you are in the Kali Linux boot screen, you now need to select
    “Live.” This will book the Kali Linux default desktop.


    +   - From there, you need to launch GParted program. The GParted program is useful
    in shrinking Windows partition. With this, you can successfully install Kali Linux
    in limited space.


    +   - Once GParted starts, you need to select the Windows partition and right-click
    on it. “Resize/Move.” Make sure that you have 20 GB of installation size for Kali
    Linux.


    +   - After you select the changes, now click on “Apply All Operations.”


    +   - Once it is completed, you now need to boot the Kali Linux again and select
    the Guided – use the largest continuous free space as the partition disk.


    +   - After the installation is done, the system will reboot, and you can finally
    boot into Kali Linux using a GRUB boot menu.


