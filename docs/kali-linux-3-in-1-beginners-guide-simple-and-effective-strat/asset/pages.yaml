- img_proc: true
  md: '# The Top 10 List for 2019 Featured the Following Vulnerabilities


    +   1. Injection

    2. Broken Authentication

    3. Sensitive data exposure

    4. XML External Entities (XXE)

    5. Broken Access control

    6. Security misconfigurations

    7. Cross-Site Scripting (XSS)

    8. Insecure Deserialization

    9. Using Components with known vulnerabilities

    10. Insufficient logging and monitoring


    # Web Application Testing


    There are multiple tools available in Kali Linux in an instant. But the power
    of these tools can only be harnessed to their fullest when they are used appropriately
    and in the correct order. The testing of web applications is done similarly to
    the first three stages of the penetration testing life cycle: reconnaissance,
    scanning, and exploitation. In a few cases, a web application test will also include
    the fourth and fifth stages, maintaining access and reporting, but this is very
    rare. It is also important to note that you need to test every page of a web site
    or a web application and not just the landing page or login pages. If the login
    page of a website is secure, it doesn’t mean all doors to gain entry are closed;
    there will always be a window somewhere. If you find the windows also to be locked,
    you can always crash it open with a stone. Let us go through the steps used for
    testing a web application.


    Step 1: Manual Review'
