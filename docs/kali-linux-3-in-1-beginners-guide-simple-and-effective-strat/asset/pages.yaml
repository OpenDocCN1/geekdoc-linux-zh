  md: 'Now, we will learn how to install Kali Linux on Hyper-V. This is my recommendation
    when it comes to learning Kali Linux. Remember, this book focuses on learning
    Kali Linux, and it is best to virtualize.


    # Enabling Hyper-V On Your Machine


    Hyper-V offers virtualization in the Windows environment. To enable Hyper-V, you
    need to have the following requirements.


    +   - A SLAT(Second Level Address Translation) supported 64-bit CPU.

    - Virtualization support. Basically, it should be SVM mode for Ryzen and VT-c
    for Intel chips

    - 4 GB minimum RAM.


    Even though virtualization is supported on your machine, it needs to be enabled
    first before you use it. To enable it, you need to go to your BIOS and enable
    virtualization. I am using a decent mid-range rig with AB350 and Ryzen 1600. For
    my machine, I have to go the CPU advanced feature, and then enable the SVM mode
    there. In cases where virtualization still doesn''t work on your system, you need
    to allow the enforced hardware Data Execution Prevention setting in your BIOS.


    To check if your machine is now virtualization ready, especially for using Hyper-V
    solution, run the following command.


    +   - Run command prompt

    - Run systeminfo.exe command on the command prompt

    - Press Enter


    You will see a positive reply from the command.


    Enabling hardware-based virtualization is not enough. Windows, by default, doesn’t
    run the Hyper-V modules. To allow them to, you need to go to the Control Panel
    and search for the “Turn Windows Features on or off.”'
