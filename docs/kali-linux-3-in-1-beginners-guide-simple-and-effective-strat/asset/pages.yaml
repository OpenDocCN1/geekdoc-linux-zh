    # Different Package Licenses


    Packages are provided licenses and are mainly chosen by the authors themselves.
    The packages than can be further differentiated based on three sections.


    +   - The packages that are contained in the MAIN are compliant with the Debian
    Free Software Guidelines.

    - Contrib is open-source software that requires non-free elements to work.


    # Kali Repositories


    Kali repositories are repositories where the packages are stored. The main Kali
    repository is as below.


    deb http://http.kali.org/kali kali-rolling main contrib non-free


    To get a better idea of the repositories, let''s take a look at the different
