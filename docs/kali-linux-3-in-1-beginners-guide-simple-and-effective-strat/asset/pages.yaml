    # Passive Reconnaissance


    In passive reconnaissance, your work is to not interact with the system directly,
    but passively tr you want to find loopholes in a system, you may want to go to
    the company’s website, learn about who they are hiring, understanding what technologies
    they are using, and so on. By doing so, you can learn about the company without
    trying to interact with the system you want to hack.


