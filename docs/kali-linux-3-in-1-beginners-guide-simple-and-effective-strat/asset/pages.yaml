  md: 'run a series of commands? Payloads are commonly classified into bind shells
    and reverse shells.


    +   - Bind Shells: These are usually shells that will remain dormant on a target
    system. They will lie there until they have received further instructions from
    an attacker. If the motive of the penetration tester is just to deploy code in
    the target system that will allow access to the target system in the future, bind
    shells would be an excellent choice. If a target system is protected by a firewall
    and does not have direct access to the network, bind shells would not be a great
    choice.


    +   - Reverse Shells: A shell which is deployed on a target system and immediately
    requests further instructions from the attacker is known as a reverse shell. If
    an exploit containing a reverse shell is executed on a target machine, the attacker
    will get a level of access to the machine as if they had the keyboard of that
    machine in their own hands.


    +   - Meterpreter Shell: The meterpreter shell is a special type of shell. It
    is popularly known as the bread and butter of the Metploit framework. Rapid7 has
    been developing a meterpreter shell in a way that it contains its own small set
    of tools. The meterpreter shell can be deployed with an exploit, wither in the
    form of a bind shell or reverse shell. We will discuss the use of a meterpreter
    shell in detail later in this chapter.


    The young blood of penetration testers often ignore the activity of payload selection
    because they want to rush directly into getting root access to a system using
    the meterpreter shell. This is not the ideal way to go about getting access to
    a system, and a deep thought process is recommended for exploiting a vulnerability.
    If you are trying to conduct a covert penetration test, if you penetrate with
    all loud guns, you may just blow your cover by triggering all the alarms in the
    system. If James Bond were not covert in his operations, his career would have
    ended within a couple of projects.'
