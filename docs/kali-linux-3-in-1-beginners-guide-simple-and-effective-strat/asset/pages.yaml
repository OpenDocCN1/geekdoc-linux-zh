  md: '# # Chapter 8

    Tools in Kali Linux


    ![](img/a627fe7ba059f4d1e016d75c5d3e79ba_108_0.png)


    In this section we will go through the various tools available in Kali Linux for
    security and penetration testing. There are a number of tools in Kali which are
    classified as per the task that they are used for. They are as follows.


    +   1. Exploitation Tools

    2. Forensics Tools

    3. Information Gathering Tools

    4. Reverse Engineering tools

    5. Wireless Attack Tools

    6. Reporting Tools

    7. Stress Testing Tools

    8. Maintaining Access Tools

    9. Sniffing and Spoofing Tools'
  merge: -1
  pgno: 108
- img_proc: true
  md: '# 10. Password Attack Tools


    We will go through tools available on Kali Linux for all the categories one by
    one and understand the purpose of each tool and how it will help us in the security
    domain.


    # Exploitation Tools


    On a network of computers, usually over the Internet, there are several web applications,
    which leave a system vulnerable to bad code or open ports on the server which
    are publicly accessible. Exploitation tools help you to target a system and exploit
    the vulnerabilities in that system, thus helping you patch a vulnerability. Let''s
    go through all the Exploitation Tools available in Kali Linux one at a time.


    # Armitage


    Armitage was developed by Raphael Mudge to be used with the Metasploit framework
    as its GUI frontend. Armitage is a tool that recommends exploits and is fairly
    simple to use as cyber-attack management tool which is available in the graphical
    form. It is open source and available for free security tool and is mostly known
    for the data it provides on shared sessions and the communication it provides
    through a single instance of Metasploit. Armitage helps a user to launch exploits
    and scans, get recommendations of exploits and explore the advanced features that
    are available in the Metasploit framework.


    # The Backdoor Factory (BDF)


    The Backdoor Factory is a tool commonly used by researchers and security professionals.
    This tool allows a user to include his desirable code in executable binaries of
    a system or an application and continue execution of the binaries in normal state
    if there was no additional code added to it.


    You can install this tool on your Kali Linux system using the following commands
    on the terminal.'
  merge: -1
  pgno: 109
- img_proc: true
  md: 'apt-getupdate


    apt-getinstallbackdoor-factory


    # The Browser Exploitation Framework (BeEF)


    The Browser Exploitation Framework is penetration testing tool built for testing
    exploits on the web browser. There has been an observation where web browsers
    have been targeted using vulnerabilities on the client-side. BeEF helps the user
    analyse these attack vectors on the client side. Unlike other tools, BeEF focuses
    on assessing the Web Browser which serves as an open door and it looks past the
    network layer and client''s system.


    # Commix


    Providing use cases for penetration tester, web developers, and researchers, Commix
    (short for Command Injection eploiter) works in a simple environment to test web
    applications. It basically allows a user to find the errors, bugs or vulnerabilities
    with respect to command injections in web applications. This tool easily allows
    you to identify and exploit a vulnerability of command injection. The Commix tool
    has been developed using the Python language.


    # Crackle


    The Crackle tool in Kali Linux is a brute force utility used for cracking and
    intercepting traffic between bluetooth devices. Most bluetooth devices have a
    4-6 digit pairing code, which is in an encrypted format. Using Crackle, these
    codes can be decrypted if the pairing process between 2 devices is intercepted
    and thus allowing you to listen to all communication happening between the 2 devices.


    jboss-autopwn


    JBoss Autopwn is a penetration testing tool used in JBoss applications. The Github
    version of JBoss Autopwn is outdated and the last update is from 2011. It is a
    historical tool and not used much now.'
  merge: -1
  pgno: 110
- img_proc: true
  md: '# Linux Exploit Suggester


    The Linux Exploit Suggester tool provides a script that keeps track of vulnerabilities
    and shows all possible exploits that help a user get root access during a penetration
    test.


    The script uses the uname -r command to find the kernel version of the Linux operating
    system. Additionally it will also provide the -k parameter through which user
    can manually enter the version for the kernel of the Linux operating system.


    # Maltego Teeth


    Maltego is a tool that is used for data mining and is interactive. It provides
    an interactive interface that outputs graphs which help in link analysis. Since
    it allows link analysis, Maltego is used for investigations on the Internet to
    find the relationship between information that is scattered over various web pages
    on the Internet. Maltego Teeth was developed later with an added functionality
    that gives penetration testers the ability to do password breaking, SQL injections
    and vulnerability detection, all using a graphical interface.


    # sqlmap


    sqlmap is a Kali tool that is open source and used for penetration testing. It
    allows automating the detection of SQL injection vulnerabilities and exploiting
    it to take over database servers. It comes with a very powerful detection engine,
    a range of tools which will help an extreme penetration tester and switches that
    help fetch information like database fingerprinting, retrieving data from databases,
    access to the file system of the operating system and execute commands on the
    operating system.


    # Yersinia


    Yersinia is a tool that detects exploits weaknesses in network protocols and takes
    advantage of it. It is a tool which is a solid framework for testing and'
  merge: -1
  pgno: 111
- img_proc: true
  md: 'analyzing deployment of networks and systems. It comprises layer-2 attacks
    which exploit the weaknesses in various layer-2 protocols in a given network thus
    allowing a penetration tester to detect flaws in a layer-2 network. Yersinia is
    used during penetration tests to start attacks on network devices such as DHCP
    servers,switches, etc which use the spanning tree protocol.


    # Cisco-global-exploiter


    The Cisco Global Exploiter (CGE) tool is a security testing exploit engine/tool,
    which is simple yet fast and advanced. Cisco switches and routers have 14 vulnerabilities
    which can be exploited using the Cisco Global Exploiter tool. The Cisco Global
    Exploiter is basically a perl script, which is driven using the command line and
    has a front-end that is simple and easy to use.


    # Cisco-torch


    The Cisco Torch is an exploitation tool which varies from the regular scanners
    in the sense that it can be used to launch multiple and simultaneous scans at
    a given point in time which results in tasks getting done faster and more efficiently.
    In addition to the network layer, it also helps in fingerprinting systems in the
    application layer of the OSI model. This is something that even a tool like NMAP
    doesn’t provide.


    # Forensics Tools


    We will now list down and learn tools available in Kali Linux which are used in
    the Forensics domain.


    # Binwalk


    The Binwalk tool is useful while working on binary image file. It lets you scan
    through the image file for executable code that may be embedded in the image file.
    It is a very powerful and useful tool for users who know what they are doing as
    it can be used to detect coveted information that is'
  merge: -1
  pgno: 112
- img_proc: true
  md: 'hidden in images of firmware. This can help in uncovering a loophole or a hack
    that is hidden in the image file, which is used with the intention to exploit
    the system.


    The Binwalk tool is developed in python and makes use of the libmagic library
    from python, therefore making it an apt tool for magic signatures that are created
    for the Unix file system. To make it even comfortable for testers in the investigation
    domain, it contains a database of signatures that are commonly found in firmware
    around the world. This makes it a convenient tool to detect anomalies.


    # Bulk-extractor


    The bulk-extractor tool is an interesting tool used by investigators who want
    to fetch specific data from a digital file. The tools helps retrieve URLs, email
    addresses, credit/debit card numbers, etc. The tools can be used to scan through
    files, directories and even images of disks. The best part is that even the data
    is corrupted partially or in a compressed format, the tool will still reach its
    depth to find the data.


    Another interesting feature of this tool is that if there is data that you keep
    repeatedly, such as email addresses, URLs, you can create a search pattern for
    them, which can be displayed in the form of a histogram. It also ends up creating
    a list of words that are found in a given set of data that may be used to crack
    a password for files that have been encrypted.


    # Chkrootkit


    The chkrootkit tool is usually used in a live boot scenario. It is used locally
    to check the host machine for any rootkits that may be installed on the host.
    It therefore helps in the hardening of a system, ensuring that the system is not
    compromised and vulnerable to a hacker.


    The chkrootkit tool also has the ability to scan through system binaries for any
    modifications made to the rootkit, temporary deletion, string'
  merge: -1
  pgno: 113
- img_proc: true
  md: 'replacements, and latest log deletions made. These are just a few of the things
    that this little tool can do. It looks like a fairly simple tool but the power
    it possesses can be invaluable to a forensic investigator.


    # p0f


    The p0f tool can help the user know the operating system of a host that is being
    targeted just by intercepting the transmitted packages and examining them and
    does it irrespective of whether the targeted host is behind a firewall or not.
    The use of p0f does not lead to any increase in network traffic, no lookup of
    names, and no probes that may be found to be mysterious. Given all these features,
    p0f in the hands of an advanced user, can help detect presence of firewalls, use
    of NAT devices, and presence of load balancers as well.


    # pdf-parser


    The pdf-parser tool is used in parsing PDF files to classify elements that are
    used in the file. The output of the tool on a PDF file will not be a PDF file.
    One may not recommend it for textbook cases of PDF parsers but it does help to
    get the job done. Mostly, its use case is PDF files, which you may suspect of
    being embedded with scripts in them.


    # Dumpzilla


    The Dumpzilla tool is a tool that is developed in python. The purpose of this
    tool is to extract all information that may be of interest to forensics from web
    browsers like Seamonkey, Mozilla Firefox and Icewasel.


    # ddrescue


    The ddrescue tool is a savior of a tool. It helps in copying data from one block
    device such as a hard disc or a CD ROM to another block device. But the reason
    it is a savior is because it copies the good parts first to avoid any read errors
    on the source.'
  merge: -1
  pgno: 114
- img_proc: true
  md: 'The ddrescue tool’s basic operation is completely automatic which means that
    once you have started it, you do not need to wait for any prompts like an error,
    wherein you will need to stop the program or restart it.


    By using the mapfile feature of the tool, data will be recovered in an efficient
    fashion as it will only read the blocks that are required. You also get the option
    to stop the ddrescue process at any time and resume again later from the same
    point.


    # Foremost


    Have you ever deleted files on purpose or by mistake and realized that you needed
    them later? The Foremost is an open source package which is easy to use and helps
    you retrieve data off of disks that may have been formatted. It may not help recover
    the filename but the will recover the data it held. A magical feature is that
