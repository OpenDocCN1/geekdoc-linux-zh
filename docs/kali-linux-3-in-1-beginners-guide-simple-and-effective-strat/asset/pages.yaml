- img_proc: true
  md: 'security specialist or are already a one, you have made the right choice in
    learning or using Kali Linux. However, it is not a good choice for doing other
    development things or using it as a normal day-to-day activity.


    Another thing that makes Kali Linux so amazing is its production value. Only a
    few veteran people are in a position to update the project. You can suggest new
    changes, but these veteran people decide if changes are made to it or not. Initially,
    the developer signs the repositories, which is followed by the entire team signature.
    As a user, this means you have restrictions when it comes to adding or customizing
    packages. So, if you wish to add a package, you need to do a lot of research and
    patience to accomplish it.


    So, does it mean it is for you? To ensure that you are going the wrong path, ensure
    that you do not choose Kali Linux in the following case:


    +   - You have never used a Linux operating system before.

    - You do not understand basic administration knowledge or have no OS experience
    at all

    - If you think you are going to use Kali Linux as your daily driver when it comes
    to doing daily activities such as browsing the web, watching videos, or gaming.


    Also, you should learn about the legal terms that come when it comes to doing
    unauthorized penetration testing on networks. If you make changes that damage
    a computer or network, you might get in trouble. Law enforcement against these
    kinds of activities is pretty strong, and you should know it beforehand then repent
    later.


    However, if you are someone who wants to make computing safe for everyone, Kali
    Linux is for you. You know your way when it comes to use penetration testing tools
    and have proper authorizing while doing your activities.'
