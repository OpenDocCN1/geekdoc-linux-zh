    # Learning About the CIA Triad


    At the core of cybersecurity, we have the CIA triad. It is a fundamental concept
    that keeps the cybersecurity ecosystem working. Without any of the three elements
    in the CIA triad, there would never be a secure system.


    The three elements are as below


    +   - Confidentiality

    - Integrity

    - Availability


    If we want to explain the three elements in short, then you can confidentiality
    can be explained as a set of rules for information access; integrity is related
    to data accuracy and trustworthiness, whereas the availability makes sure that
    the data is available reliability for authorized people only.


    Let’s go through them below.


    # Confidentiality


    The first element of the CIA triad is confidentiality. In other words, it is related
    to privacy. By maintaining confidentiality, a system ensures that the user’s privacy
    is maintained at any cost. It also ensures that the owner only accesses sensitive
    information, and malicious actors cannot access it.


    Confidentiality rules can differ based on the data type and owner status. The
    categorization is done based on how intense the damage can be if the data falls
    into the wrong hands.


    Confidentiality is hard to implement. To make it work, people need to be trained.
    This training ensures that the security risks associated with the data are reduced.
    One of the biggest security threats are humans itself. If they are'
  merge: -1
  pgno: 191
- img_proc: true
  md: 'not trained, they are more likely to leave loopholes open for hackers to exploit.
    They need to learn how to set strong passwords and how to keep the password secure.
    These best practices will also ensure identifying social engineering attempts.
    The social engineering method tries to pursue people to give up on their information,
    including passwords.


    When it comes to the technical aspect, confidentiality is maintained by the use
    of cryptography. The hardened encryption entries ensures that the username and
    passwords are not leaked online by hackers. Companies need to store the data securely,
    and that''s what makes it more challenging — the other types of verification types,
    including security tokens, biometric verifications, soft tokens, and so on.


    # Integrity


    The second element in the CIA triad is integrity. It is all about the data trustworthiness,
    accuracy, and consistency through the data life cycle. This means that the data
    should not be modified or changed by unauthorized access or malicious actors.
    Most of the time, if the confidentiality breaks, the integrity of the data breaks
    too.


    To maintain integrity, it is necessary to use access control to ensure that only
    authorized users can access the data. Also, the integrity needs to be checked
    and verified through methods, including cryptographic checksums or hash numbers,
    and so on.


    Some of the algorithms used for checking data integrity include SHA1, SHA2, SHA3,
    SHA5, and MD5.


    # Availability


    The last trait is the availability trait. The data stored should be available
    at all times. The data that is not available is useless. To achieve 100% availability,
    the hardware manufacturers need to maintain their hardware and immediately repair
    them if any issues occur. They also need to focus on'
  merge: -1
  pgno: 192
- img_proc: true
  md: 'the software, or the operating system used so that the requested data can be
    served to the user in the best possible way.


    Another big requirement is to provide enough bandwidth for optimal availability.
    Just having availability is not enough, and it is required to serve the data to
    the user in a well-defined time that is justifiable.


    Other key aspects that need to be maintained include RAID, redundancy, failover,
    etc. A proper disaster recovery system ensures that none of the data is lost.
    It also makes sure that data delivery is not hampered in different scenarios.


    Data availability also needs to be maintained during the denial-of-service(DoS)
    attacks. The best approach is to have proper firewalls and proxy servers to make
    the service work in the worst condition.


    The two ways to provide data availability is redundancy and backup.


    # What Challenges Does the CIA Triad Bring?


    Even though the CIA triad can seem a simple thing to achieve, in reality, it is
    just the opposite. It uses big data, and other technologies make the CIA paradigm
    a tough thing to maintain. Big data is all about collecting important data from
    a variety of data sources. This can add unwanted cost and makes it even harder
    to maintain the CIA triad.


    Other technologies also pose their own issues. For example, IoT brings a new level
    of challenge. Connecting different devices together through a different medium,
    interface, and networks is in itself a challenge. Now, protecting data confidentiality,
    integrity, and availability is much bigger a challenge. IoT is not secure as other
    technologies.


    # Different Types of Cyber Threats


    Cyber threats are at the core of cybersecurity. As a Kali Linux user, you also
    need to learn about the terminologies. The hackers are keen to use any'
  merge: -1
  pgno: 193
- img_proc: true
  md: 'form of cyber attack to get access to the system. To make sure that you know
    about the attacks, let''s list them below.


    # Malware


    One of the most common cyber attacks is the use of malware. It is a software that
    is used to gain system access. It can also be used to cause harm to the system
    without the owner''s prior knowledge.


    # Social Engineering


    Social engineering is a non-technical threat where a person tries to impersonate
    and gather information through social skills. It is all about psychologically
    manipulate people.


    # Advanced Persistent Threats


    Advanced persistent threats are used by unauthorized users to maintain access
    to networks or systems for a more extended period.


    # Ransomware


    Ransomware is a new type of malware. It is mainly used to ask for ransom from
    an affected computer. The extortion starts after the target machine is infected
    with malicious software. The software can lock important files in the system and
    then ask for money in exchange for unlocking them. Many ransomware would lock
    users completely out of their system. Even after the user agrees to pay the amount,
    the hacker might keep a backdoor to the system so that he can infect other computers
    in the network. He can also try to infect the system again after some time.


    # Phishing


    The last type of cyber attack that we want to discuss is phishing. It is a common
    attack that brings with fake emails. The emails are then used to gather key information,
    including credit card numbers or login information. The best way to protect against
    is to have proper filter mechanisms in the email service.'
  merge: -1
  pgno: 194
- img_proc: true
  md: 'Other types of cyberattacks include the following:


    +   - Man-in-the-middle(MITM) attack

    - SQLi attack

    - Denial-of-service(DoS) attack

    - XSS Cross-Site Scripting attack

    - Distributed denial-of-service(DDoS) attack


    There are other cyber attacks other than the above attacks. The type of attack
    depends on the devices and the network that the hacker is trying to hack.


    Let''s try to explain these types of attack in simple terms.


    # Man-in-the-Middle (MITM) Attack


    It is a popular attack that is often used in hacking devices. In this attack,
    a third-party malicious actor gains access to talk between two other parties.
    By doing so, it can steal information and use that to harm the victims.


    # SQLi Attack


    In the SQLi attack, the hacker tries to execute malicious SQL statements on the
    database. If the hacker can execute them successfully, then he gains access to
    the database or the system. There are plenty of ways to protect the database against
    his common cyber-attack.


    # Denial-of-Service(DoS) Attack


    This is also one of the most common cyber-attacks out there. It takes place by
    jamming a network or service to provide the service. A large number of machines
    are used to carry out DoS attacks. DoS attack''s main aim is to disrupt service
    and also reveal a weakness in the system. If multiple'
  merge: -1
  pgno: 195
- img_proc: true
  md: 'machines make the attack, then it is known as a distributed denial-of-service(DDoS)
    attack.


    # XSS Cross-Site Scripting Attack


    Cross scripting attack(XSS) is a web application vulnerability where the web pages
    are injected with client-side scripts.


    # Why is Cyber Security Important?


    Cyber security’s importance is paramount in our society. Every organization requires
    proper security to their systems. Without it, they will fall apart. Every institution
    also requires basic cybersecurity protection so that they do not become victims
    to hackers who may want to do Ransom or cause any harm to them.


    Cybersecurity can be seen as an infrastructure -- a layer of protection that works
    on every single device and location. A unified system always works great in the
    world of different systems. The integrations, however, require work, and that
    can leave some loopholes.


    Another thing is anything that can never be 100% secure. This means that the cybersecurity
    field is always a growing field. New technologies and evolutions take place almost
    every year, which makes it even harder for cybersecurity specialists to make the
    work safer.


    # Things We Learned in This Chapter


    +   - Cybersecurity deals with the protection of the organization, governments,
    medical organizations, and other institutions against cyber attacks and malicious
    actors.


    +   - There is CIA Triad that is at the core of cybersecurity. It includes confidentiality,
    integrity, and availability.


    +   - Confidentiality deals with the user’s privacy. It is all about maintaining
    the user’s privacy at any given cost. It protects sensitive'
  merge: -1
  pgno: 196
- img_proc: true
  md: 'information and is hard to implement in any system.


    +   - Integrity, the 2nd CIA triad, deals with data accuracy, consistency,

    and trustworthiness during the data life cycle.

    - Availability, the third CIA triad, is all about 100% system or data

    availability at any condition or scenario.

    - There are many challenges the CIA triad brings to the table.

    - There are many types of cyber threats, including malware, social

    engineering, advanced persistent threats, ransomware, phishing.

    - Other types of common cyber attacks include SQLi attack, Man-in-

    the-middle(MITM) attack, SQLi attack, XSS Cross-Site Scripting

    attack, Denial-of-service(DoS) attack.


    Cybersecurity attack is important because it deals with the security of

    multiple organizations, system, and the overall ecosystem in which the

    internet thrives.'
