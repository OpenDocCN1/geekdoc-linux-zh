    +   **Post Exploitation Tools:** After you gain access to a remote system or device,
    the next important step is to maintain that access over some time until you have
    completed your task. This Kali suite contains tools that can help with this activity.


    +   **Reporting Tools:** The conclusion of a penetration test is reporting the
    findings. This suite has tools that help collect the data and send them as an
    input to other software that can analyze the data that has been collected. All
    the raw data is consolidated together using the tools available under-reporting
    tools. This book sheds some light on the different reporting tools you can use.


    +   **Forensics:** There are live boot environments of Kali Linux, which are very
    popular. You can plug in Kali into system and perform forensic tests on that system
    to do data imaging, triage, and case management.


    +   **Social Engineering Tools:** There are times when the technical aspects of
    a system will be secured very well. In such an event, what remains to be exploited
