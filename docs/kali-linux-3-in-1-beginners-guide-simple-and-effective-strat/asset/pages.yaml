    # Timing Templates


    As we have already discussed above, Nmap uses the T3 or normal timing by default
    of no timing option is exclusively specified. There is in-build functionality
    in Nmap wherein this default timing can be changed'
  merge: -1
  pgno: 357
- img_proc: true
  md: 'using the timing options available for Nmap. This lets the user specify the
    speed of the scans. There are various timing templates available for Nmap that
    decide the speed of the Nmap scan. The most important timing templates are the
    ones used for delaying probes and the status of parallel processing. We will be
    going through the templates scan_delay, max_scan_delay, and max_parallelism to
    explain how timings for a scan can be manipulated. These templates contain a predefined
    time set for Nmap scanning be used on a target network or system. You can use
    the scan_delay template ensures that probes are sent to the target system with
    a minimum number of pauses, while the max_scan_delay will specify the maximum
    time that Nmap can allow delay in scanning based on the target system settings.
    This is an important tool because some systems on the internet only reply if the
    probes are coming at a specific rate. You can use these tools which help Nmap
