  md: 'The size of your USB drive will be written against it.


    # Step Three


    Proceed to write the image carefully on the USB drive using the command shown
    below. In the above example, we are assuming the name of your Kali Linux ISO file
    is “kali-linux-2019.1-amd64.iso” and it is in your present working directory.
    The block size parameter bs can be increased, but the ideal value would be “bs=512k”


    ```

    dd if=kali-linux-2019.1-amd64.iso of=/dev/sdb

    ```


    The writing to the USB drive will take a few minutes, and it is not abnormal for
    it to take a little more than 10 minutes to finish writing.


    The dd command will not show any output until the process is completed. If your
    USB drive has an LED, you will see it blinking as an indicator of the disk being
    written on. Once the dd command has been completed, the output will be something
    like this.


    ```

