- img_proc: true
  md: '# # Chapter 4

    Scanning


    In this chapter, we will learn about the scanning stage of the penetration testing
    life cycle. We will learn about certain networking protocols such as TCP, UDP,
    and ICMP. We will also learn about Kali Linux network tools as Nmap, Hping3 and
    Nessus.


    # ## Introduction


    After completing the reconnaissance stage of the penetration testing life cycle,
    a tester will proceed to the scanning stage. All the information collected on
    the employees, organizations, information systems, etc. during the reconnaissance
    stage can now be used to understand the physical and logical structures of a target
    organization. Although the penetration tester has begun with the scanning stage,
    they are still free to go back to the reconnaissance stage if they feel they need
    some information.


    The purpose of the scanning stage is to fetch specific information on the information
    systems, computers, and other devices that are a part of the target organization.


    The motive of the scanning phase throughout the activity is


    +   - To find live hosts.

    - To determine the node on the network if it is a desktop, laptop, network device,
    printer, server, etc.

    - To know the operating systems used by all the network devices.

    - Public servers such as web applications, FTP, SMTP, etc.

    - Possible vulnerabilities.


    The vulnerabilities that can be discovered in the scanning phase of the penetration
    testing life cycle are often referred to as low hanging fruit.'
  merge: -1
  pgno: 342
- img_proc: true
  md: 'There are various tools available today to conduct scanning. However, in this
    chapter, we will go through some of the most popular Kali Linux tools such as
    Nmap, Hping, and Nessus. In this phase of the penetration testing life cycle,
    we will try to find possible targets that can be used in the next stage: exploitation.
    Scanning allows a hacker to find the vulnerabilities that they can use to hack
    into a system.


    # Network Traffic


    Some people find network traffic to be complicated, but we will explain in this
    section as it is a prerequisite for the scanning stage. The communication that
    happens between various computers through a network is known as network traffic.
    Two types of networking exist today - wired networks and wireless networks. It
    is very important to understand the fundamentals of Ethernet with respect to networking.
    In this chapter, we will go through


    +   - Firewalls and ports.

    - Transmission Control Protocol(TCP).

    - User Datagram Protocol(UDP).

    - Internet Control Management Protocol(ICMP).


    # Ports and Firewalls


    The most common method to defend your network against the outside world is by
    implementing a firewall between your internal network and the outside world, mostly
    the internet. A firewall is a software or hardware which serves as the gatekeeper
    for your network by employing certain rule sets. The inbound traffic known as
    ingress and the outbound traffic known as egress are monitored using access control
    lists. Traffic is allowed to go through the firewall only when it meets the criteria
    specified in the firewall. All other traffic is dropped. This is achieved using
    ports that are opened or closed as per the criteria defined. A port is a communication
    medium that'
  merge: -1
  pgno: 343
- img_proc: true
  md: 'allows communication between two or more computers or network devices. There
    are a total of 65535 ports available for TCP communication and 65535 ports available
    for UDP communication. Some of these ports have a default function assigned to
    be used for other functions too. For example, the Hypertext Transfer Protocol
    used port 80 for normal internet traffic, but you can assign port 80 for traffic
    as well and designate another port for internet traffic. You can think of a port
    as building with doors that go to different rooms. Every room has people who are
    doing a dedicated task by managing various functions. The office that behind behind
    number 80 manages requests coming in for web pages. This office behind room number
    80 can also be moved to a different room such as room number 8080, and it will
    still continue doing the task of managing requests for web pages. In such a case,
    people managing a different task could move into room number 80 and they could
    perform a different task or the room number 80 could be just closed down for good.
    However, visitors who are requesting a web page will also need to know that the
    web pages need to be now requested in room number 8080 and not 80. A visitor knocking
    on room number 80 for a web page will return disappointed as they will not get
    the required information as they will be looking for it in the wrong room or the
    room might be simply locked. On the contrary, if a visitor has the correct room
    number which is 8080, they will be served with the requested information.


    # IP Protocols


    Protocols are a set of rules defined for both the real world and for computer
    networks. There are staff members that are assigned to politicians, diplomats,
    and bureaucrats who manage issues related to the protocol for them. These members
    ensure that visitors or messages that need to reach politicians, diplomats, and
    bureaucrats always reach by following protocol, that is by following the correct
    manner. Protocols in the computer world help communication to happen between network
    devices by following a set of rules. There are multiple protocols available for
    computer networks'
  merge: -1
  pgno: 344
- img_proc: true
  md: 'today, but we will go through the most important and common networking protocols
    in this chapter. This will help us leverage Kali Linux tools which are used in
    scanning and discovering vulnerabilities during the penetration testing life cycle.
    These three protocols are TCP, UDP and ICMP.


    # TCP


    TCP is one of the most common and important protocols used in network communication.
    The TCP protocol is connection-based. This means that whenever there is a connection
    between two devices using TCP, the devices on both sides of the network will acknowledge
    the opening of a session followed by messages sent and received on both devices.
    This can be explained using a phone call.


    The phone rings:


    Alice: “Hello”


    Bob: “Hello, is Alice there?”


    Alice: “This is Alice.”


    This is an analogy from way back in the past but it explains a three-way handshake
    that occurs when a connection takes place via TCP. In communication via TCP, there
    is a three-packet exchange initiated when communication is being established between
    two network devices. The first packet that is sent is called the synchronization
    packet commonly known as SYN. When the device at the receiving end receives this
    SYN packet, it will acknowledge and send another synchronization packet referred
    to as SYN/ACK, if it is available. Once the initiating device receives the SYN/ACK
    packet, it will also send an acknowledgment ACK packet to establish the connection.
    The following figure will illustrate the three-way handshake.'
  merge: -1
  pgno: 345
- img_proc: true
  md: '![](img/a627fe7ba059f4d1e016d75c5d3e79ba_346_0.png)


    All the TCP connections that are established successfully over the internet will
    use the three-way handshake to ensure that there is a synchronized connection
    taking place on devices on both ends of the network. We will learn to use this
    three-way handshake in a way that avoids being detected later in this chapter.
    After the connection has been established between two devices using TCP, there
    is a continuous process of acknowledgment between the two devices. This ensures
    that all the packets sent by the first device are successfully reaching the second
    device, and the packets not received are resent by the first device. An analogy
    to this would feedback that is provided in the process of verbal communication.
    Let us look at an example.


    Alice: “I would request you to meet me at the restaurant at 3 PM”.


    Bob: “Can you confirm the time you want to meet me at the restaurant?"."


    Alice: “It would be at 3 PM”.


    This process will cause some load on the server and will consume bandwidth than
    regular. Sometimes, it will take more time than usual for communication to process
    as well. Because of this, the three-way handshake is often used for establishing
    sessions for communication that are not highly impacted by the latency in receiving
    the packets. There are a set of applications that make use of TCP, such as File
    Transfer Protocol(FTP), Hypertext Transmission Protocol(HTTP) and email protocols
    such as Simple Mail Transfer Protocol(SMTP), Post Office Protocol(POP), and Internet
    Message Access Protocol(IMAP).'
  merge: -1
  pgno: 346
- img_proc: true
  md: '# UDP


    The load on a connection using the UDP protocol is less compared to the TCP protocol.
    As we have learned, a TCP connection is like a phone call that is happening between
    two parties, where both parties are continuously sending and receiving messages
    from each other and are acknowledging it as well. A UDP connection would be more
    like a radio broadcast between two parties where neither of the parties is acknowledging
    that the messages have been received. It is understood by default that the packet
    that was broadcasted was received.


    Radio Station: “This is ABC radio; kindly join us at the restaurant today at 3
    PM”.


    This broadcast is received by everyone who is listening to the broadcast. If there
    is some part of this broadcast message that was missed by the receiver, they will
    not ask for the message again as a default rule. There are a few exceptions to
    this rule which are out of the scope of this course. When a transmission is happening
    via UDP, the recipients will never let you know the medium of transmission or
    if the packets were received completely or partially. This method is used with
    packets that do not need any verification for the packets received or is not used
    with applications that are now worried about the order in which the packets arrive.
    Applications that employ UDP are those that are okay with a low load but a high
    speed, such as streaming services for video and audio.


    # ICMP


    ICMP was designed to be a network protocol for the health and maintenance of the
    network. The protocol helps in finding out if a device on the network is functioning
    as intended and if it can communicate properly. ICMP applications are not directly
    exposed to end users but there are various exceptions to this rule as well. A
    common exception to this rule'
  merge: -1
  pgno: 347
- img_proc: true
  md: 'would be the PING and TraceRoute utilities. Another difference is that ICMP
    does not carry user data like TCP and UDP protocols.


    On the contrary, ICMP will carry messages related to the system, to and from computers,
    network devices and other application services. The header of an ICMP packet contains
    a specific code or a number set. The sets help in asking questions or providing
    information about network nodes. Penetration testers can make use of these codes
    and sets to get information about the target system. Let us go through the codes
    available in the ICMP header.


    | Type | Code | Description |

    |---|---|--|

    | 0(Echo Reply) | 0 | Echo Reply |

    | 3(Destination Unreachable) | 0 | Destination Network Unreachable |

    | | 1 | Destination Host Unreachable |

    | | 2 | Destination Protocol Unreachable |

    | | 3 | Destination Port Unreachable |

    | | 6 | Destination Network Unknown |

    | | 7 | Destination Host Unreachable |

    | | 9 | Network Administratively Prohibited |'
  merge: -1
  pgno: 348
- img_proc: true
  md: '| | | |

    |---|---|---|n| | 10 | Host Administratively Prohibited |

    | | 13 | Network Administratively Prohibited |

    | 8(Echo Request) | 0 | Echo Request |


    # # PING


    PING is an ICMP based command which is very commonly used by both end-users and
    administrators. When PING a device, an ICMP packet of type 8 and code 0 is sent
    to the device indicating that it is an echo request. The end device which is usually
    configured to reply to such an echo request will ideally reply with another ICMP
    packet of type 0 and code 0 indicating that it is an echo reply. A ping is considered
    to be successful when there is a response from the end device which is verified
    to be a live host. When you send a ping request using the command line on a Windows
    system, sends the ping request four times by default. As opposed to this, ping
    requests from the Linux terminal do not have any such limit and will continue
    the request until the user cancels it. You can cancel the ping command on the
    Linux terminal by pressing hr Ctrl+C keys on the keyboard. Let us go through the
    examples of a successful ping and an unsuccessful ping.


    Live Host


    Ping 192.168.1.1 with 32 bytes of data:


    Reply from 192.168.1.1: bytes532 time52ms TTL564


    Reply from 192.168.1.1: bytes532 time51ms TTL564


    Reply from 192.168.1.1: bytes532 time51ms TTL564


    Reply from 192.168.1.1: bytes532 time,1ms TTL564'
