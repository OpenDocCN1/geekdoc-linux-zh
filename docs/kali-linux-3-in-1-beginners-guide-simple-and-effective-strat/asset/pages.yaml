  md: '# Stress Testing Tools


    Stress testing can be defined as a software testing methodology, which is carried
    out to find out the reliability and stability of a system. The test makes a system
    go through extreme conditions to find out how robust it can be how efficiently
    it can handle the errors under such circumstances.


    Stress tests are designed to test systems even beyond the regular points of operation
    to understand how well it can handle pressure. Stress testing was introduced to
    ensure that a system, which is in production would not crash under extreme situations.


    Let us see the various stress testing tools that are available in Kali Linux.


    # DHCPig


    DHCPig is a Kali Linux tool that exhausts the DHCP server system by initiating
    an exhaustion attack on it. This tool will use all the IPs available on the network
    and stop new users from being assigned any IPs, release IPs that have been already
    assigned to genuine devices, and then for a good amount of time, it will send
    out gratuitous ARP and kick all the Windows hosts from the network. The tool requires
    admin privileges and scapy >=2.1 library to execute. The tool does not need any
    configuration as such and you just have to pass the environment as a parameter
    on which you plan to release the test. It has been successfully tested on multiple
    DHCP server in Windows and on several Linux distributions.


    # inviteflood


    Inviteflood is a Kali Linux tool, which is used to send SIP/SDP INVITE message
    to cause a flooding over UDP/IP.


    It has been tested over several Linux platforms and it performs well on all distributions.


    # mdk3'
