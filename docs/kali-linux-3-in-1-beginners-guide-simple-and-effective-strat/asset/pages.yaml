    # Kali Linux Network PXE Install


    # Setup a PXE Server


    The Preboot Execution Environment (PXE) is a method that allows computers on a
    network which are not loaded with an operating system to be booted and configured
    using remote access by an administrator. PXE installations for Kali Linux can
    be useful from something as small as a single laptop, which does not have a CDROM
    or a USB port to something as huge as deployments of Kali Linux on a network of
    computers in an enterprise.


    We begin with installing dnsmasq to have a DHCP/TFTP server and then edit the
    dnsmasq.conf file.


    apt-get install dnsmasq


    nano /etc/dnsmasq.conf


    In dnsmasq. Conf, we have to enable PXE, DHCP and TFTP booting and modify the
    dhcp-range to per your network environment. Optionally, if needed, you can also
    modify your DNS servers and gateway using the dhcp-option parameter:


    interface=eth0


    dhcp-range=192.168.101.100,192.168.101.200,12h'
  merge: -1
  pgno: 59
- img_proc: true
  md: '```

    dhcp-boot=pxelinux.0

    enable-tftp

    tftp-root=/tftpboot/

    dhcp-option=3,192.168.101.1

    hhcp-option=6,8.8.8.8,8.4.4

    ```


    After modifying the parameters, restart the dnsmasq service for the changes to
    take effect.


    service dnsmasq restart


    # Download Kali PXE Netboot Images


    We will now work on creating a directory to keep the Kali Linux Netboot image
    and download the Kali Linux image from the website which we need. mkdir -p /tftpboot


