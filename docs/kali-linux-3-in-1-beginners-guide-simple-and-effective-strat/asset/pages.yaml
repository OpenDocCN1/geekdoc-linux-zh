  md: '# # Chapter 2

    Installing and Downloading Kali Linux


    Never download an image of Kali Linux from any other source than the official
    source. After downloading the image, always make sure to verify the SHA256 checksum
    value of your downloaded file with the official value of the file. It would be
    very easy for a third party intruder to modify the installation file such that
    it includes malware which will end up being hosted on your system.


    You can download all official images for Kali Linux installations from the following
    link:


    +   - https://www.kali.org/downloads/

    - https://www.offensive-security.com/kali-linux-vmware-arm-image-download/


    # Where to Get Official Kali Linux Images


    # ISO Files for Intel-based PCs


    To be able to run Kali Linux “Live” by using a USB drive on a Windows PC or an
    Apple PC, you will need to download a 32-bit or a 64-bit ISO image of the Kali
    Linux installation.


    If you are sure about what architecture of your current system, you can run the
    following command on the terminal in Linux or Apple OS X to know the architecture.


    ```

    uname -m

    ```


    If you get the response as “x86_64”, it indicates a 64-bit architecture, and you
    can use the 64-bit ISO image available on the website (the one which has “amd64”
    appended to it).'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'If you get the response as “i386”, it indicates a 32-bit architecture, and
    you can download the 32-bit ISO image from the website (the one that has “i386”
    appended to it).


    You will find the architecture mentioned under the “Device Type” header in system
    properties on your computer.


    You will find Kali Linux ISO images available for download from the website both
    as a direct download file and as a torrent file.


    # VMware Images


    If you are using VMware and want to use Kali Linux as a “guest,” Kali Linux is
    available as a pre-built VMware machine with VMware tools already pre-installed.
    The image for VMware is available in 64-bit, 32-bit, 32-bit PAE formats.


    # ARM Images


    The hardware and architecture vary considerably on ARM-based devices. Therefore,
    it is not possible to maintain a single image for installation across various
    ARM-based devices. There are a varied set of pre-built images available for Kali
    Linux installation across a wide set of devices.


    If you want to build your ARM images, scripts for building your custom ISO are
    available in the Kali GitHub repository.


    # Verifying Your Downloaded Kali Image


    # Why do I need to do this?


    Before you try to run Kali Live or try installing it onto your machine, you need
    to be sure that what you have got in hand is genuine Kali Linux and not something
    else. Kali Linux is a professional toolkit for penetration testing. As a professional
    of penetration testing, you need to be confident about the tools that you are
    using. If your tools are not trustworthy, the investigations you do would not
    be trustworthy either.'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'Moreover, since Kali is deemed to be the pinnacle of penetration testing distributions,
    strengths of Kali imply that a fake version of the operating system can do a great
    deal of damage if it is deployed without any prior checks. Numerous people around
    the world who have a huge set of reasons to stick something harmful into a Kali
    Linux installation, and you do not want to be at the receiving end of that.


    Avoiding this is simple: Make sure that you download installation images of Kali
    Linux only from official sources.


    +   - https://www.kali.org/downloads/

    - https://www.offensive-security.com/kali-linux-vmware-arm-image-download/


    These pages are encrypted with an SSL connection, and one would not be able to
    access these via plain HTTPS protocol. Since this is an encrypted connection,
    it makes it difficult for an attacker to intercept the connection between you
    and the website, thus making it impossible to modify the download file.


    After downloading the image file, make sure you validate that it is what you expect
    to be and not a malicious file. Verifying the checksum after downloading is always
    a great way to ensure you have a genuine file.


    There are many methods for verifying the file you have downloaded. Each provides
    some level of assurance and expects a particular level of effort on your part.


    You can download the Kali Linux installation ISO from the “Downloads” section
    of the official Kali Linux website and calculate the SHA256 checksum of the download
    file and compare it with the checksum listed on the website for the corresponding
    download file. This is a very easy method to verify the download but is sometimes
    susceptible to DNS poisoning. DNS poisoning implies that you are trying to resolve
    an official Kali Linux website, but an attacker somehow redirects you to a website
    you wish'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'to be where the SHA checksum would show us something else, and then you end
    up downloaded an infected ISO from their website.


    You can also download the Kali Linux ISO via torrents. And this will also download
    an ISO file that will contain a SHA256 checksum. So this way you will have 2 files,
    one that was directly downloaded, while the other that was downloaded via torrents.
    You can crosscheck both have the same checksum using tools on Windows, Linux or
    Mac.


    To be sure that the Kali Linux installation ISO you have downloaded is a genuine
    ISO and is the real thing, you can download the following files: a cleartext signature
    file and a version of the same file that has a signature by the official Kali
    Linux key and then continue to perform the following actions:


    +   Use the GNU Privacy Guard (GPG) to cross-check that the signature of the cleartext
    file and the computed SHA256 checksum match


    +   Validate the signature in the file that has the SHA256 hash has been signed
    correctly with the official key.


    If you are comfortable with using this complicated process to validate your downloaded
    ISO, you can proceed without fear that you have got the official image of the
    installation for Kali Linux and that it has not been tampered with. While this
    is the most complex method to validate your download, it has the advantage that
    you have complete assurance of the integrity of your downloaded image file.


