    # RainbowCrack


    RainbowCrack is a general proposal Kali Linux tool, which was an implementation
    of Philippe Oechlin. It is used to crack hashes, which have rainbow tables. Rainbow
    Crack cracks hashes of rainbow tables by making use of the time-memory tradeoff
    algorithm. This makes it different from hash crackers that are brute force.


    A brute force hash cracker will generate all the plaintexts that are possible
    and then compute the hashes that correspond to the plaintext, during'
  merge: -1
  pgno: 146
- img_proc: true
  md: 'runtime. It will then compare the hashes that need to be cracked with the hashes
    in hand. If no match is found even after comparing all available plaintexts, all
    results of the intermediate computation are discarded.


    A time-memory tradeoff hash cracker sets up a stage for pre-computation, and all
    results of all hashes are stored in rainbow table. This is a time consuming computation.
    But on the first stage of pre-computing is over, hashes that were stored in the
    rainbow table can be cracked with a performance that is much better and efficient
