  md: '# Configuring Network Using Command Line


    You can also configure the network using the command line. There are instances
    where you might not have access to the graphical desktop.


    Configuring the network through the command line includes the use of the ifupdown
    package. The package includes two tools, ifup, and ifdown tool. The tools are
    at the core of init script stored in the /etc/init.d/networking directory. The
    file is used to network configuration during system boot. The devices that are
    managed by ifupdown can be registered and deregistered using the ifdown tool.


    So, how do you do it? Let''s take a look at the ifupdown configuration file. Inside
    the file, there are two main derivatives that you should know about:


    auto network-device: This directive enables ifupdown to configure the network
    automatically. It only does it when the system finds a new network.


    iface network-device: This directive is used actually to configure the interface.


    The ifup is used to activate a network interface, whereas the ifdown is used to
    disable network interface. When you enable a network, it is now ready to receive
    and transmit data. On the other hand, disabling a network means that it can no
    further receive or transmit data.


    # Using systemd-networkd


    There can be instances where ifupdown tool might not work. This can be a reason
    behind it being too old. After all, it is a historical tool that is being used
    in Debian. You can use the new tool known as systemd-networkd. It comes integrated
    with the init system. This is a new tool and is not Debian based. It is also lightweight
    and is easy to integrate with multiple distros.


    In the /etc/systemd/network/directory, you need to place the network files. This
    will enable you to configure the systemd-networkd. You can find'
  merge: -1
  pgno: 213
- img_proc: true
  md: 'the [Match] section, which has information about network interfaces. There
    you can also find which configuration applies to which network interface. Moreover,
    you can also configure different aspects of the interface, including the MAC address.


    Sometimes, the networkd might be disabled. That''s why you need to enable it to
    use it. Also, before you use it, you need to ensure that you have done the DNS
    resolution integration. It can be done by creating a symlink to the /run/systemd/resolve/resolv.conf
    replacing the /etc/resolv.conf file.


    # Unix Groups and Users Management


    User management is a very important part of any operating system. This is also
    true for Kali Linux. As a user, you need to make sure how to work with user permissions.
    There are some key files that you should know about. Let''s list them below:


    +   List of users → /etc/passwd


    +   User’s encrypted password → /etc/shadow


    +   List of groups → /etc/group


    +   Encrypted passwords of groups → /etc/gshadow


    These file formats can be understood by learning the documentation of shadow,
    gshadow, passwd.


    # User Account Creation


    Kali Linux is a sophisticated operating system. It relies heavily on the root
    user to perform most of the tasks. However, there can be reasons to create users
    without root permission, especially if you use Kali Linux in your day-to-day activity.


    To add a user, you need to use the adduser command.'
