    # -sU UDP Scan


    The UDP scan will scan all the UDP ports on a target system. Unlike TCP scans,
    a UDP scan will expect the target system to reply even if the ports are closed.
    You will ideally get a reply for a packet that is sent to an open UDP port. However,
    if there is a response from the target, it would indicate that the port is open.
    If no reply is received, it would indicate that the port may be open or being
    protected by a firewall. Ports that are not open will get an ICMP response of
    type3 and code 3, indicating an unreachable port. Also, ports that are protected
    by a firewall will have an ICMP response of type 3 and codes, 1, 2, 9, 10, or
    13, indicating unreachable port errors.'
