- img_proc: true
  md: 'Using the -on Normal Output option creates a text file that can be used for
    analysis later or can be used as an input to another program.


    nmap -oN logthis.txt 10.0.2.100


    -oX Extensible Markup Language or XML Output


    Many applications available today that their input from an XML file for further
    analysis and processing. This option is used to save the output to an XML files.


    nmap -oX logthis.txt 10.0.2.100


    -oG GREPable Output


    The output using this option creates a file that is readable using the GREP command.
    Penetration testers can analyze files that are GREPable as it supports supports
    tools such as SED, AWK, and DIFF.


    nmap -oG logthis.txt 10.0.2.100


    -oS Script Kiddor or # Output


    This is not used by penetration tester on a large scale, but it is fun to use
