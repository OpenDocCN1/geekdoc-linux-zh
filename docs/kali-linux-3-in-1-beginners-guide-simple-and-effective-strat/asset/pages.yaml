    \n```\nsslscan {ipaddress}:{port}\\example: sslscan 192.168.56.102:8080\n```\n\
    \n# Step 3: Scanning\n\nSetting automation for the scanning process can help you\
    \ search for vulnerabilities and save a lot of time. There are many tools available\
    \ for webserver scanning and it is a good practice to have more than one application\
    \ in your toolkit. There is no single application that is capable of scanning\
