  md: '# Remote Logins SSH


    SSH stands for secure shell. It lets users connect to the machine remotely. After
    connecting, you can perform a different set of tasks, including executing commands
    or transferring files. SSH is a well-known tool among Linux users. In fact, it
    is used on an industrial level to connect to remote machines.


    To use SSH, you first need to make sure that your machine comes pre-installed
    with the openssh-server. By default, it comes pre-installed. If it doesn’t, then
    you need to install it using sudo apt-get install command. Sometimes, SSH services
    can also be disabled. To make it work, you need to use the following command.


    ```

    systemctl start ssh

    ```


    You can also configure it to start it with the boot. To do so, you need to run
    the following command.


    ```

    systemctl enable ssh

    ```


    # Configuring SSH


    By default, the SSH comes with good enough configuration. However, if you can
    configure it to make it more functional. To know what it has to offer, you can
    check its configuration file /etc/ssh/sshd_config file. The documentation can
    be found in the sshd_config(5) file.


    If you are using SSH for the first time, then you will notice that it doesn’t
    allow password-based logins. To connect, you need to use the SSH keys. The SSH
    keys is generated using the ssh-keygen.


    If you want every user to use the SSH key-based login, then you need to set the
    PasswordAuthentication to “no” in the configuration file. This is always a better
    option compared to other password-based logins.'
  merge: -1
