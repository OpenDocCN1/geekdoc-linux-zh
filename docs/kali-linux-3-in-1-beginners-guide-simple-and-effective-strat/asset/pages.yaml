  md: '# # Chapter 7

    # Real World Applications for Kali Linux


    There are a diverse number of applications for Kali Linux in the real world. Including
    them in a sales pitch is critical if you want to form a business model that will
    generate revenue for your company, which has specialists who work in the security
    domain using Kali Linux.


    Let’s talk about an example of a small business. A personal computer in the world
    is hacked every 10 seconds. There are a lot of people who either run their business
    from home or work from home. Such businesses are started with the vision of forming
    a reputation.


    Data security is an integral part of your business if you are just beginning to
    work with clients. If you look up the Internet, you will easily find articles
    about data breaches that have been happening in small businesses in around your
    area or even a college database for that matter. A little fear can be a healthy
    thing. Fear sells and it sells more especially today, since we are living in the
    digital era.


    Most people who run small businesses today run their websites using Wordpress.
    Travel writers, photographers, etc. use Wordpress for blogging and showcasing
    their photography too. Activities like these require investment of time from the
    website owner, and all this can be lost just because of one faulty line of code
    in their Wordpress website. The business owner may not only lose the time that
    they have invested but also their customers if there is a loss of data.


    There is a Kali Linux tool called ‘wpscan’, which we will talk about in detail
    later. This application scans a Wordpress code for vulnerabilities and allows
    you to report them to the website owner.'
  merge: -1
  pgno: 96
- img_proc: true
  md: 'Another well-known Kali tool is ''nmap''. This tool helps to scan open ports
    on Wi-Fi connections. Open ports can be deemed to be open doors, which can be
    accessed by anyone with the right amount of knowledge. The open ports can be used
    to access data, which is critical to a business such as customer details or even
    credit card details.


    These tools usually run via the terminal in Kali Linux. Whenever you launch one
    of these tools using the dropdown menu in the graphical interface, it will always
    redirect you to the terminal, which launches in a preconfigured root access mode
    in Kali. The terminal is used to run a lot of commands while using tools in Kali
    and you will spend most of your time on the terminal in Kali.


    If you are booting Kali as a live disk and not a full install, it is recommended
    that the first thing you do is open the terminal and then type the following command
    to update all the software.


    apt-get update


    This updates all the files on your system.


    You can also lookup for upgraded software using the following command.


    ```

    apt-get upgrade

    ```


