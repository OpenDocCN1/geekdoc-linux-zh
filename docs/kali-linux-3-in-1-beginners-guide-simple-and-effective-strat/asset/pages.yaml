  md: '# # Chapter 3

    Making a Kali Bootable USB Drive


    ![](img/a627fe7ba059f4d1e016d75c5d3e79ba_29_0.png)


    The easiest way to run Kali Linux is to run it “live” from a USB drive. The method
    also has a lot of advantages.


    # ## Advantages of a Bootable USB Drive


    # ### Non-destructive


    It does not make any changes to your machine or your existing operating system
    on the machine as it runs directly from the USB drive. To go back to your existing
    setup without Kali Linux, you simply need to unplug the USB drive and restart
    your system.


    # ### Portability


    You can carry the Kali Linux operating system on any USB drive in your pocket
    and have it running on any machine that is available to you.


    # ### Customizable


    As discussed in the previous chapter, you can use scripts from the Kali Linux
    GitHub repository to build your custom Kali Linux installation ISO and load it
    onto a USB drive as well.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Persistency


    With a little bit of customization, you can make your Kali Linux Live USB drive
    store persistent data that will be retained across reboots.


    For this purpose, we will first need to use the ISO image of Kali Linux to set
    up a bootable USB drive.


    # Requirements to create a Kali Linux USB


    +   1. A verified copy of the Kali Linux ISO to suit the system that you intend
    to run or install it on.


    +   2. If you are using Windows, you will require the Win32 Disk Imager software
    to create the Kali Linux USB drive. On Linux or OS X, you can use the dd command
