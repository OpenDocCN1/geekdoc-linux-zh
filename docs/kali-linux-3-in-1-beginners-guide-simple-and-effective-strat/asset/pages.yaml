- img_proc: true
  md: '# Creating Rules


    To create a new rule, you will need to invoke either iptables or iptables. It
    can be very frustrating to keep manually typing these commands. Therefore, it
    is better to store the calls you need in a script and ensuring that the Script
    is called every time the system is rebooted. You can write the entire Script manually,
    but you could also use a high-level tool fwbuilder to create a script as per your
    needs.


    ```

    # apt install fwbuilder

    ```


    It is very easy to create a script using the fwbuilder tool. It follows a simple
    principle. Firstly, you need to lay down all the elements that you want to make
    a part of the actual rules. The elements will be as follows.


    +   * The firewall, along with the network interfaces on your system.

    * The network details, along with the IP ranges.

    * The servers.

    * The ports of the services that are hosted on the server.


    The next step is to create the rules using the drag and drop feature available
    in fwbuilder’s main window, as shown in the image below. You can use negation
    in the conditions as well. You then need to choose the required option and configure
    it.


    With respect to IPv6, you have the option to create a separate set for IPv6 and
    IPv4, or you can just create one set of rules and let fwbuilder translate based
    on the IP stack that connects.'
  merge: -1
  pgno: 310
- img_proc: true
  md: '# fwirebuilder / Policy


    Once you have selected the rule you required, fwirebuilder will automatically
    create a Kali Linux script for it. The architecture for fwirebuilder is very modular
    and flexible, making it a good graphical interface to generate scripts for iptables
    in Linux, pf in OpenBSD, and ipf in FreeBSD.


    # Configuring the Script to Run at Every Boot


    You will want the firewall rules for the Kali Linux system to be persistent across
    all boots. To achieve this, you have to register the Script you created using
    fwirebuilder in the up directive of the file located at /etc/network/interfaces.
    Let us check an example where we have stored at a script at /usr/local/etc/nrescript.fw.


    ```

    auto eth0


    face eth0 inet static


    address 192.168.0.1


    network 192.168.0.0


    netmask 255.255.255.0


    broadcast 192.168.0.255

    ```'
  merge: -1
  pgno: 311
- img_proc: true
  md: '```

    up /usr/local/etc/newscript.fw

    ```


