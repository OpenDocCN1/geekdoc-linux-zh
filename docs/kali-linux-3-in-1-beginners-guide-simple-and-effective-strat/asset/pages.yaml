  md: '# Dual Boot Kali with Windows


    # Kali Linux Dual Boot with Windows


    Having Kali Linux installed alongside Windows on the same system can be very beneficial.
    Although, you need to be very patient and cautious while setting up a dual operating
    system installation. Firstly, make sure that all the important data from your
    Windows installation is backed up. Also, since this exercise will result in modification
    of your hard drive, it is advisable to back up everything of importance on an
    external media.


    In the example that we are going to look at, we are using a system, which has
    Windows 7 already installed on it and is taking 100% of the disk space. So we
    will first resize the Windows partition that it occupies less space and then proceed
    with installing Kali Linux on a new and empty partition.


    You can prepare for the installation by having the following checklist ready.


    +   1. Download Kali Linux ISO as per your system’s architecture.


    +   2. Write The Kali Linux ISO to DVD or a USB drive using the tools mentioned
    in the previous chapter.


    +   3. You must ensure that your computer is ready to allow a boot from a USB
    drive.


    The minimum hardware requirements to install Kali Linux on a machine are as follows.


    +   1. A minimum disk space availability of 20 GB for the installation files on
    the Windows system.


    +   2. A minimum RAM capacity of 1GB. Although 2GB or more is recommended for
    better performance.


    +   3. A DVD drive or USB boot support to help with the Kali Linux installation.'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# Dual Boot Installation Procedure


