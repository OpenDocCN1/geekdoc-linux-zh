- img_proc: true
  md: 'Most of the scanning tools available in Kali Linux employ the TCP, UDP, and
    ICMP protocols to map the targets. When a scanning stage is successful, the output
    will provide


    +   - A list of live hosts.

    - IP addresses.

    - Operating Systems.

    - Services on the target.


    Some of the Kali Linux scanning tools can also be used for finding vulnerabilities
    and user account details. These details will help amplify the exploitation stage
    as the attacks can be more specific with respect to hosts, vulnerabilities and
    technologies.


    # NMAP: The Scanning''


    The Nmap tool in Kali Linux is known as the kind of scanning because it not only
    can detect devices on a network, but also other features of the network devices
    such as their operating systems, services, ports, and sometimes even the user
    accounts and their passwords. There are various types of commands, switches, and
    options that can be used in combination on the target systems. Nmap is considered
    to be a very useful tool in the scanning stage of the penetration testing life
    cycle.


    # Command Structure for Nmap


    There is a very distinctive structure used by commands in Nmap as it allows options
    and targets to be combined in a way that brings out very high flexibility. Let
    us go through the following image which illustrates a basic parts of the Nmap
    command and tells us about the basic parts of the Nmap command.'
  merge: -1
  pgno: 352
- img_proc: true
  md: '![](img/a627fe7ba059f4d1e016d75c5d3e79ba_353_0.png)


    We will be learning about every option that can be used with the Nmap command
    in the sections that follow. An operating system knows what task to execute when
    you use a command and the switches and options along with it. The command illustrated
    above is followed with options for this case -sS indicates that it is a stealth
    scan. The option that follows is used to specify the time and tells the command
    about how much traffic is to be generated and how quickly it needs to be generated.
    This lets the command know what pace is to set for the Nmap scan. In the illustration
    above, we use the target and timing options, and they are sufficient enough to
    run the scan. The final option used in this command is the output option which
    tells the operating system where to direct the results that come in the scan.
    The above illustration is just one example of a Nmap scan but the command used
    in Nmap can be complex than the above example or even very basic in comparison
    to the above example. For example, an Nmap command can be run using just the following
    command as well.


    ```

    nmap 10.0.2.100

    ```


    If you do not specify any options with the Nmap command, it runs a stealth scan
    by default and uses the speed as T3. Also, since you have not specified the output
    to be directed, they will be printed on the monitor screen in the terminal by
    default. This is a basic scan which stands at the lowest end of the Nmap spectrum.
    The other end of the spectrum consists of detailed and lengthy scans that tell
    the Nmap command to perform any'
  merge: -1
  pgno: 353
- img_proc: true
  md: 'more tasks. You can use Nmap at an advanced level too by using hr Nmap Scripting
    Engine(NSE) which helps you create scripts for Nmap scanning. To understand Nmap
    scans better, we will learn about options that can be used in the Nmap command
    which help enhance the power of Nmap as a scanning tool in the penetration testing
    life cycle.


    # Nmap Scanning Options


    When you use the -s option with the Nmap command, you will be telling Nmap that
    there is a specific scan that needs to be performed on the target, which will
    be defined in the scan command. The lower case s is followed by a letter in the
    upper case which defines the type of Nmap scan to be run. Specifying a scan type
    will help a penetration tester from getting detected by certain hosts and other
    protection systems on the network and may even help them in bypassing the firewall
    altogether.


    -sS Stealth Scan


    Even when no scan type is defined in the Nmap command, the Nmap command by default
    runs in the stealth mode. You can also intentionally specify a stealth scan to
    the Nmap command by passing -sS as the options. A stealth scan will initiate a
    TCP connection with the target system but will fall shy of completing the three-way
    handshake. The Nessus engine sends a SYN packet to the target and when the target
    system returns a SYN/ACK packet back, the Nessus engine simply does not acknowledge
    it. Given this, there is no channel built for communication and the connection
    is left open. In such a scenario, most devices on the internet will automatically
    close this open connection after a set time interval. Therefore, this scan can
    run without getting detected on legacy systems that are configured poorly. However,
    a stealth scan can be detected by almost all network devices and hosts. But this
    should not demotivate a penetration tester from using a stealth scan as it is
    still far more difficult for a system to detect a stealth scan. Also, there is
    a high chance of it still being successful'
  merge: -1
  pgno: 354
- img_proc: true
  md: 'if the target system is configured poorly. The following figure illustrates
    the stealth scan technique.


    ![](img/a627fe7ba059f4d1e016d75c5d3e79ba_355_0.png)


    # -sT TCP Connect Scan


    The TCP scan will make a complete three-way handshake with the target system and
    will therefore, provide more information on the target than a stealth scan. The
    Nessus engine again sends a SYN packet to the target and hopes for it to acknowledge
    with a SYN/ACK packet. Unlike the Nessus engine did during a stealth scan, this
    scan sends a final ACK packet back to the target system. The target system will
    mostly record this scan, but it will yield more information than a stealth scan.'
  merge: -1
  pgno: 355
