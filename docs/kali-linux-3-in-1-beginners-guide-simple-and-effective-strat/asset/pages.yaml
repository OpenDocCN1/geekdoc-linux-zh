  md: '# # Chapter 8

    Understanding Kali Linux Community and Documentation


    Kali Linux is a complex operating system. Even though you read the book completely,
    there would be something that will be left behind. Also, it doesn''t matter if
    you are working on it for years; there will be moments where you feel stuck. That''s
    where the Kali Linux community and documentation comes in. In short, you need
    to be resourceful as possible. You need to be able to find solutions to your problems
    yourself. This will make you competent and a great problem solver.


    This chapter aims to improve your Kali Linux community understanding. Clearly,
    there are plenty of ways you can get help, but it is better to understand your
    options before investing time in it.


    We will also cover strategies on the best way to use the information available.
    Let''s get started.


    # ## Documentation Sources


    Kali Linux is well documented. That makes it easy for you to work with Kali Linux.
    Also, if you want to make sure what is going on, it is better to read documentation.
    A program can be a complex thing, and to be sure, read the documentation. This
    way, you can be sure of what is going around the program.


    There is one thing that you need to be wary about when going through forums or
    communities asking questions. If you are new to this, you may find others reply
    with the keyword, RTFM. This is a popular way of responding to queries that are
    covered in the manual. Its full form is “**Read The Fine Manual.**” It can also
    mean “Read The F\*\*king Manual” as well on the internet. If you get these kinds
    of replies, that means that your'
  merge: -1
  pgno: 228
- img_proc: true
  md: 'answer is in the documentation itself. Also, do not get offended by the term.
    It simply means that you need to read the manual.


    # Manual Pages


    Your first place of hunting for information is manual pages. Manual pages take
    a different approach for organizing the information. The command to find the manual
    for a program or a command is ‘man.’


    The syntax of the manual pages is as below.


    man [command]


    For instance, if you want to learn what ls command does and all its possible outcomes,
    then you need to use the following command.


    man cp


    The manual pages are also used to document other important aspects of the Kali
    Linux. For example, it also documents things like system calls, C library functions,
    configuration, and so on. This, however, can cause issues as the names can collide
    with each other. One classic example is the read command and the read system call.
    To ensure that the issue doesn’t interfere with your work, the manual pages are
    organized in a numbered way. Let’s take a look at the sections below.


    +   * Commands

    * System calls

    * Library functions

    * Devices

    * Configuration files

    * Games

    * Standards and macros sets'
  merge: -1
  pgno: 229
- img_proc: true
  md: '+   * System administration command


    +   * Kernal routines


    The above section number can help you to read the right manual for the command
    you are looking for. So, if you want to read the manual for a read system call,
    then you need to use the following command.


    man 2 read


    This will show you the manual page for the read system call. If you want to learn
    about the read command, then you need to use the following command.


    man 1 read


    You can also not include the number if you want to read the manual page of command
    as they are at the top of the section number. It takes the 1 by default or the
    command or program relates to. If you want to read the manual for the shadow and
    do not put any number, it will simply return the shadow(5), considering that the
    1-4 sections do not have anything to return for the manual page.


    However, there can be cases where you do not know what the name of the command
    is. This can lead to issues. But, you can still search for manual pages using
    a command.


    The command to do the search is apropos command.


    You can use the apropos command with any keyword you think that can relate to
    the command or program you are searching for. The keyword choice is important
    here as it will enable you to find the right command or program. The command will
    return you a list of choices. You can then select the one that you are looking
    for. It will also return a single sentence about the command so that you get a
    better idea.'
  merge: -1
  pgno: 230
- img_proc: true
  md: 'If you are looking for more information about the command, then you can also
    lookout for a “See Also” section. If the documentation has the section, it will
    include links and more information about some external documentation.


    There are other ways to find documentation. You can use yelp in Gnome and Konqueror
    in KDE.


    # Learning About Info Documentation


    Apart from the manual pages, you can also check out the info documentation. It
    is a GNU project that is aimed to write the documentation in the info format.
    You can also find many manual pages written in the info format. However, viewing
    the pages can be a tough task as they are complex in nature. To ensure that you
    do not have to go through it, you can use pinfo. It lets you read the complex
    information in a much better way.


    To install pinfo, you need to use the following command.


    ```

    apt install pinfo

    ```


    You may also want to run the following command so that all the dependencies are
    pre-installed without any issue.


    So, how does the info document look like? It is in a hierarchical structure.


    # Package Specific Documentation


    All packages come with their own documentation. You can easily find the README
    file within the package that contains the necessary information about how to install,
    operate, and troubleshoot the package.


    The package-specific documentation is stored in the /usr/share/doc/package/directory.
    Simply change the package name to the package you are using, and you will be able
    to find the specific documentation. If you are not able to find it, then the documentation
    might have its own package. What we mean to say that the package'
  merge: -1
  pgno: 231
- img_proc: true
  md: 'files can be large. This makes it ideal for giving its own package. The documentation,
    in this case, is stored in package-doc. You can find the documentation package
    while installing it. It will recommend it to you so that you can install it. If
    you are still not able to find the documentation, then you need to search for
    the package website.


    Debian is also proactive in providing documentation for some packages. These documentation
    files are contained within the default place of package documentation. It generally
    does it improve the documentation so that the user can benefit from it.


    # Docs.Kali.Org: Kali Documentation


    Kali Linux has its official documentation at docs.kali.org. The book we are working
    on includes a lot of stuff about Kali Linux, but it is always important to know
    about Kali Linux documentation. It contains some useful information include tutorials.


    If you open the documentation, you will be able to find that there are a lot of
    things that are covered in the documentation including introduction, USB installation,
    Kali On ARM, Virtualization, Base Images, Containers, Cloud, Windows Subsystem
    for Linux, Tools, General Use, Kali NetHunter Documentation, Troubleshooting,
    Community, Kali Development and Policy.


    All of these categories hold some valuable information.


    # Community-Driven Kali Linux


    Kali Linux is a community-driven project. You can find tons of communities on
    social media. In fact, there are also local communities that enjoy sharing knowledge
    and helping others when it comes to Kali. Communities are places where you can
    help others, share useful information, and interact with others with similar interests.'
  merge: -1
  pgno: 232
- img_proc: true
  md: 'To help you, we are going to list two communities in which you can join and
    become part of it.


    # IRC Channel on Freenode


    Kali Linux has an IRC channel on Freenode. IRC stands for the real-time chat system.
    This is where you can interact directly with a group of people in real-time. These
    chat rooms are basically channels with a theme attached to them.


    You can connect to the Kali Linux channel on Freenode by opening chat.freenode.net
    as IRC server, and then listening to the 6667 port. If it seems too technical,
    you can also use an IRC client, which lets you connect easily to the server.


    We recommend using irssi if you are fond of console mode. Hexchat is also a good
    option as it offers a graphical interface. If you are not interested in downloading
    any client, then you can check out their web client at webchat.freenode.net.


    # Understanding Rules


    IRC channels are very strict when it comes to rules and regulations. Before you
    join or interact with other members, make sure that you read the rules. If you
    make mistakes, you can get silenced or removed from the server.


    # Become Part of the Community: Do Bug Reports


    To create a great community, you also need to be an active contributor. One of
    the best and easiest ways to do so is to submit bug reports. These bug reports
    can help developers to solve issues and make Kali Linux even better. As you might
    already know that not all software is free from issues. The same is true for Kali
    Linux.


    By sharing the bug report, you are going to share valuable information with the
    developers, which can then be used by the developers to fix the issue. The more
    information you can provide, the better bug reports become. If it'
  merge: -1
  pgno: 233
- img_proc: true
  md: 'is well-thorough and explains the conditions at which you are able to generate
    it, the chances are that your bug report will be read and resolved in a few days.


    # Things We Learned in This Chapter


    +   * Kali Linux has an amazing community and documentation

    * It has documentation sources. The packages have their own document manual.

    * You can read the manual pages with the man command

    * The format used to structure the documentation is info.

    * There is also package-specific documentation you should read if you feel stuck

    * You can find Kali Linux documentation at docs.kali.org

    * You can also connect to the IRC channel on Freenode

    * If you join, do not forget to read the rules before communicating.


    You can also join the Kali Linux community by doing bug reports.'
  merge: -1
