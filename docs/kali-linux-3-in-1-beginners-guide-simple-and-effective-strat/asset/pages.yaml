  md: '# Introduction


    When we talk about Kali Linux, we quickly think of the phrase “security auditing
    and penetration testing.” But to use Kali Linux for this purpose, we need to understand
    that multiple tasks are carried out to reach the goal of these two activities.
    Kali Linux is considered to be a complete framework as it a complete set of tools
    that cover multiple use cases. Being said, you can always a combination of these
    tools while you are working on penetration testing as well.


    For example, you can install and use Kali Linux on multiple systems such as a
    personal laptop of a penetration tester as well as public servers where server
    admins want to monitor a network, and even on workstations used by forensic analysts
    of a company. You will be surprised that in addition to this, Kali Linux can also
    be installed on small embedded devices that have ARM architecture CPUs. An example
    of this would be a raspberry pi device that can be used as a powerful tool combining
    with Kali Linux and dropping it in a wireless network or simply plugin into a
    target computer. ARM devices like the raspberry pi can access servers as time
    bombs, given their small size and low consumption of power. Moreover, you can
    also deploy Kali Linux on cloud architecture, ultimately creating a farm of machines
    that can be used to crack passwords rigorously.


    But that is not the end of it. Penetration testers need Kali to be installed on
    a server so that they can work based on collaboration by setting up a web server
    for the set of tools to scan vulnerabilities, phishing campaigns, and other such
    activities. Most hackers have Kali Linux installed on their systems since this
    operating system will suit their hacking needs.


    When you boot up Kali Linux for the first time, you will instantly realize that
    the Kali Linux desktop theme is designed in a way to serve the needs of penetration
    testers and other information security professionals. You will'
  merge: -1
  pgno: 293
- img_proc: true
  md: 'have gathered information about this operating system in the first book. This
    book will shed some light on what penetration is, and the different features in
    this operating system that will make it easier for you to hack into a system.


    The following tasks and activities of Kali Linux are included under this.


    +   - **Information Gathering**: This includes information collected about the
    target system and its network. The tasks give you answers to the type of hardware,
    operating system, and services that are being used by the target system. You understand
    what parts of the target system are potentially sensitive. You will extract the
    listings of all the active directories of the running system. You can use different
    tools to do this.

    - **Web Application Analysis**: In this task, you will identify the flaws and
    loopholes present in web applications. This information helps you fix the flaws
    beforehand as web applications are publicly available over the internet and can
    be exploited to breach into the main system. This is the purpose of any hacking.
    A malicious hacker or cracker will use this method to hack into the system to
    extract sensitive information or data.

    - **Vulnerability Analysis**: This helps you understand if a local system or a
    remote system has the most commonly known vulnerabilities. Tools that perform
    vulnerability scanning have a huge database to match the system with a well-known
    vulnerability. When an ethical hacker identifies the different vulnerabilities,
    they can advise the organization into making the necessary changes to their database
    and systems. A cracker will use this information to hack into the system and steal
    the information and use that information to harm the organization.'
  merge: -1
  pgno: 294
- img_proc: true
  md: '+   Database Assessment: Database attacks are very common and popular among
    attackers, and they include a range of attacks from SQL injection to attacking
    credentials. The tools that can help detect such attack vectors can be found under
    this suite of Kali Linux. Remember, every organization will store its data in
    a database that is on the back end.


    +   Wireless Attacks: Wireless networks are easily discoverable, and therefore
    they are a favorite target for attackers. The Kali Linux suite has support for
    multiple wireless cards, and can, therefore, be used to attack and perform penetration
    testing on networks. Hackers can use the operating system to learn more about
    the network. They can learn about the routes that are not active. These hacks
    will make it easier for the hacker to identify the routers or switches that are
    inactive.


    +   Password Attacks: Another favorite of attackers is the authentication systems.
    This suite contains tools to crack passwords online and to attack hashing systems
    as well. Hackers can use keyloggers and other password hacking mechanisms to access
    a person''s system or account. If you have watched the movie Ocean''s 8, you may
    have seen how Rihanna hacked into the security engineer''s system. She used a
    keylogger to look at his keystrokes to find the password.


    +   Reverse Engineering: Reverse engineering activity can be used to serve multiple
    purposes. Concerning offensive activities, it helps you identify vulnerability
    and exploit the development of an entity. For its defensive advantages, you can
    use it to assess if a system has been planted with malware during targeted attacks.


    +   Sniffing and Spoofing: An attacker can always take advantage of data that
    is on the move on a network. This suite contains tools for'
  merge: -1
  pgno: 295
- img_proc: true
  md: 'sniffing networks for data and tools for spoofing, which can help you pretend
    to be someone else over a network. Both these tools, used in combination, can
    be very dangerous and powerful. We will look at this in further detail in this
    book.


    +   **Exploitation Tools:** When you take advantage of a vulnerability that is
    known previously, you can exploit it to gain access to the remote system or device.
