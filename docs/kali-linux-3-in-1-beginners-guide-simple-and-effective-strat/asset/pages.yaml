  md: '# # Chapter 9

    Kali Linux Monitoring and Security


    Kali Linux is an operating system for penetration testers. By default, it is designed
    and created for professional workers. It may sound fine for newbies, but it requires
    careful planning to get the most out of it. In this chapter, we will learn how
    to define a policy, understanding the threats, and then finally discuss packet
    filtering and firewalls. In the end, you will be able to ensure your system remains
    intact and secure. You will also be able to use the monitoring tool and actually
    design a strategy to secure your site.


    # Security Policy For The Rescue


    Security doesn’t happen by itself. If you are a security expert, you will know.
    Each organization requires a security strategy to become secure. You need to find
    out the right security policy for your organization. Just going through the currently
    available tools, procedures, or concepts will not help. The security aspects need
    to be configured depending on many conditions. If you try to rush the implementation,
    you are going to fail miserably and put your operating system at risk.


    To ensure that you do not make hasty decisions, you need to find the goal. To
    do so, you need to ask questions and then find answers to them. Let’s go through
    the questions below together.


    +   - What aspects of your system do you need to protect?

    - What are the threats?

    - Who are the attackers?


    Answering these three questions will give you critical information on how to define
    the security policy. Let’s try to understand each question below.'
  merge: -1
  pgno: 236
- img_proc: true
  md: '+   What aspects of your system need to be protected? In this question, you
    need to find out the type of system or data you want to protect. If you identify
    the system or the data, then you need to answer the question of what type of data
    or system you want to protect.


    +   When it comes to 2nd question, you need to figure out the threats. The threats
    can be a malicious entity or simply the way the data or system is compromised.
    For example, you may want to protect against malicious actors that try to gain
    entry to the system. When it comes to method, you may want to protect confidential
    data leak, service disruption due to DDoS, and so on.


    +   Lastly, you need to find figure out the threat types. For example, the threat
    can easily be the user or a third-party malicious entity. In both cases, you have
    to make sure that your system is protected at any cost.


    As a Kali Linux user, you also need to understand that security is not just one-time.
    It can be equated to an ongoing process where you need to work hard towards protecting
    the system constantly. With the system’s evolving every second day, it is common
    for bugs or exploits to go through. This is where hackers get a chance to do harm.
    This makes security one of the hardest things to do.


    In reality, you need to make sure that you minimize the risk factor. There will
    always be a slight risk, but it should not be more than acceptable. Depending
    on the system evolution, risks change with time. By ensuring that you cover the
    constraints correctly, you can minimize the risk in a great way.


    That’s why creating a risk model that evaluates all parameters can be of great
    help. Modeling around the risk model is what you need to do. Initially, you need
    to cover the basic minimal parameters. Once they are covered,'
  merge: -1
  pgno: 237
- img_proc: true
  md: 'then you need to find the extreme conditions at which the system can be compromised.


    Another important factor is the cost of implementing the security and the risk
    associated with it. There can be instances where protecting risk is not worth
    the cost associated with it. You also need to evaluate the loss if the risk is
    exploited by someone else. If the loss is less than the cost of implementation,
    it is better to leave it as is.


    # Data Confidentiality


    Data confidentiality is very important. It is the number one priority for anyone
    who wants to protect their system. As a Kali Linux user or any system’s user,
    you need to make sure that your or system’s critical data. This should be your
    top priority, and you should consider this more important than any other security
    concerns. If you do not protect the data, it can land into a malicious entity
    that can harm you in one way or another. The hackers can also erase your data
    or destroy your hard disk or simply use the information to gain an advantage over
    other computers. This makes data confidentiality a big topic in the security world.


    # Extreme Cases


    Any security policy should consider extreme cases while securing a system or data.
    Extreme cases are those that have low chances of happening and rely on hard exploits
    in any system. Zero-day vulnerability exploits can also be considered within the
    extreme cases as they are fresh and new in their own way. Almost every system
    out suffers from zero-day vulnerability exploits. Also, not all extreme cases
    can be considered due to the hardness they carry to solve them or simply the cost
    associated with them them. However, few extreme cases should be solved depending
    on the severity it carries.


    # Approach'
  merge: -1
  pgno: 238
- img_proc: true
  md: 'Systems can be complex in nature. That makes creating system policy a tricky
    thing. However, there is an approach that can simplify the process. As a user,
    you can create security policies for subsystems. This segmentation needs to be
    used to ensure that you can do slowly and steadily. It will also help you understand
    the constraints and requirements of each subsystem and then do a proper risk assessment
    depending on the broad security policy and needs.


    Also, it is always easy to defend your system against small types of attacks.
    There are already established means of protecting your system against those. However,
    large attacks are where you should spend the most of the time. In the end, you
    need to make sure that the data is protected at any cost.


    One last thing that you also need to make sure is to define your firewall rules
    depending on the traffic you receive.


    # Security Measures


    So, what are the security measures you can do to secure Kali Linux? Let’s go through
    the options below.


    # Laptop Security


    If you are using a laptop as a penetration tester, then you have to protect yourself
    from risks associated with personal computers. As you are not on the public server,
    you at least not have to worry about people who use scripts to hack into the system.
    As you are not connected to the network, you are almost safe from network-based
    attacks.


    The real challenge is to protect your laptop from others who are around you. There
    can be a chance that authorities can seize your laptop, and you might not want
    them to read through the contents of your laptop. To make sure that they do not
    do it, you need to use full-disk encryption. If you are serious about data or
    other information within your laptop, then you can'
  merge: -1
  pgno: 239
- img_proc: true
  md: 'also go with the nuke option. If you have a nuke option, then it simply removes
    all the data from the laptop with a combination.


    Apart from the data safety, you also need to make sure that you have proper firewall
    protection if you connect to the internet. This will provide you unwanted access
    by others. Configuring the firewall rules is important here. Just make sure that
    you only filter the traffic that you need.


    # Server Setup Protection


    Kali Linux on a public server is different from that of the laptop. Here, you
    need to have more security and ensure that you keep your login username and password
    secure. Also, you need to use the firewall every time you connect. One thing to
    ensure is the generate a strong password for the users that you generate. Make
    sure that passwords are strong enough so that they do not get hacked from brute-force
    attacks.


    # How To Secure Network Services


    Kali Linux comes with a plethora of services. As a good rule of thumb, do not
    active the services that you do not need. Simply disable them. Even if you do
    not disable them, Kali Linux disables them for you.


    Apart from it, you need to make sure that no firewall is running by default. If
    a firewall is running by default, then it means that it is listening to network
    interfaces that you do not want.


    Also, some of the services running on the public server might not require any
    authentication to connect or discover. As a Kali user, you need to make sure that
    the authentications are enabled and set a good password for them to discover you.
    The key here is to implement privacy in the best possible way. You may also want
    to disable services that require root access to run. If someone gets access to
    those services, they can simply gain access to your Kali Linux installation.


    # Getting Your Firewall To Work: Packet Filtering'
  merge: -1
  pgno: 240
- img_proc: true
  md: 'You can protect your Kali Linux setup with a firewall. Firewall can be of three
    types, hardware or software or both. Its work is to filter packets and ensure
    that they meet a certain condition. If you are a part of the network, you can
    also use a filtering network, which saves the whole network. Network firewalls
    have their own dedicated machines considering that they need to do a lot of work
    filtering packets.


    However, as a Kali Linux user, your main job is to protect your local installation
    of a network. The good news is that Linux comes with its own firewall solution.
    It is the Netfilter firewall. But, there is one caveat that you need to take care
    of. You cannot simply turn it off and leave it. You need to configure Netfilter
    according to your network requirement.


    netfilter firewall can be configured using the ip6tables and iptables commands.
    The ip6tables command is used to configure an IPv6 network, whereas the IPv4 network
    can be configured by the iptables command.


    You can also use the GUI-based fwbuilder tool that lets you graphically select
    the firewall rules. We will not go in-depth into these tools as you can easily
    find information on how to set up the firewall by. If you are still confused,
    then you can check the documentation for each tool. They are simple and straightforward.


    # Logging and Monitoring


    Monitoring your machine is also very crucial to its security. In this chapter,
    we learned how to protect yourself from third-party malicious actors. For this,
    we learned how to protect the device on which you were working and set up a firewall.
    Now, how do you know that things are working as intended? To do so, you need to
    use the monitoring and logging capabilities of the Kali Linux operating system.


    Logging and monitoring enable you to detect anomalous behavior on your system.
    If you see that there is an issue with the system functionality or performance,
    then you need to check the log files to find out what''s wrong'
  merge: -1
  pgno: 241
- img_proc: true
  md: 'with the system. Sometimes, it can be packages that can clog the system resources
    or instances where there is actually a breach in your system. This is where you
    will learn how to successfully monitor and log your Kali Linux so that you know
    what is going on with the system.


    # logcheck Monitoring Logs


    The first tool you can use is the logcheck program. It works by logging the system
    through log files generated by the system. Every hour, it sends a report to the
    administrator through email. The administrator can then go through the log and
    see for any anomalies that are recorded in the system.


    So, which files are monitored by logcheck? They include the directory /etc/logcheck/logcheck.logfile.


    logcheck is pretty comprehensive when it comes to gathering and reporting the
    issues to the administrator. It offers varied data gathering, including settings
    suited for a workstation, server, or paranoid.


    Paranoid is the most verbose type of report generation. This means that it is
    not the best option out there. It is only useful for machines that host firewalls
    for the network. The default mode that logcheck uses is server mode. It is used
    for most users. The last mode is the workstation mode, which is meant for the
    workstation. The workstation mode is also very terse and is the only ideal for
    few scenarios where it is needed.


    logcheck also offers different parameters which can then be used for customizing
    it. Some of these rules can help you detect cracking attempts and other security
    issues.


    # Real-Time Monitoring


    Real-time monitoring can also be done if you feel the need for it. The tool that
    you need to use for real-time monitoring includes the top interactive tool. It
    offers a currently running processes list.'
  merge: -1
  pgno: 242
- img_proc: true
  md: 'The top tool offers a good amount of information, including the processor time,
    occupied memory, process identifier. It also lets you kill a process using the
    k key.


    The top tool is excellent for monitoring the system. It also helps you to find
    out which process is slowing down your system by eating memory or processor.


    # How to Detect Changes


    With the knowledge of system monitoring, it is now time to learn how to detect
    changes. These ideas of detecting changes help you to figure out your system files
    are changed or not. If there is a change after the basic installation, then it
    can mean that a malicious actor modifies the system files.


    You can use dpkg --verify tool to verify if there is a change in the system files
    integrity. The command is as below


    ```

    dkpg -- verify

    dkkpg -V

    ```


    However, this is not a sure shot answer to know if the system in question is really
    compromised or not. That’s why you might need to use advanced tools. We are not
    going to discuss the tools as they are beyond the scope of the book.


    # Things We Learned in This Chapter


    +   * As a Kali Linux user, you should protect your Kali Linux.

    * The security policy should be used to ensure proper security

    * You should also make sure that the data confidentiality is maintained at any
    cost'
  merge: -1
  pgno: 243
- img_proc: true
  md: '+   - Extreme cases should also be considered while working with the OS security

    - Kali Linux OS security also depends on where it is installed. If you are using
    a Laptop, then you need to have a different approach to security. Accessing the
    OS in a public server means a different approach.

    - You should use a package firewall to secure your OS

    - Logging is also important for accessing the system’s health

    - The log files are stored in the /etc/logcheck/logcheck.logfiles directory.

    - You can also do real-time monitoring using the top command

    - To detect changes in the core system’s package, you need to use the dkpg --verify
    command.'
  merge: -1
  pgno: 244
- img_proc: true
