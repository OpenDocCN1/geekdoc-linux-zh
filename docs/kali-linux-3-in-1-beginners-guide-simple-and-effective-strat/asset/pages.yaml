    # Command Shell


    Next, we will see what happens when you select the “Command Shell” button from
    the “Available Actions” menu. You will be welcomed with the meterpreter shell
    first, and not a command-line tool related to Linux or Windows. It is advisable
    to use the help command first in the meterpreter shell so that you can get comfortable
