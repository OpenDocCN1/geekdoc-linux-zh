- img_proc: true
  md: "# # Chapter 2\n The Lifecycle of a Penetration Test\n\nIn book one of this\
    \ series, we went through a small overview of the penetration testing life cycle\
    \ in the chapter “Hacking Process.” In this book, we will dive deep into this\
    \ process through dedicated chapters and go through the common Kali Linux tools\
    \ used in each stage of the penetration testing cycle. We have\n\n# ## Introduction\n\
    \nIt is a common misconception amongst people who are not technologically savvy\
    \ that a hacker or an attacker can just sit with his laptop, write a few lines\
    \ of code on his laptop, and gain access to any computer or internet-powered device\
    \ in the world. People have started believing that is how it is conveyed through\
    \ movies, but it is very far from what happens. Attackers and Information Security\
    \ professionals need to be very careful and precise while trying to exploit or\
    \ uncover the vulnerabilities present in different systems. The framework for\
    \ penetration testing has evolved, and there is a solid framework today that are\
    \ adopted by attackers and information security professionals. The first four\
    \ stages of this framework guide an attacker to exploit computer systems in a\
    \ manner that results in reports that can be used again when they need to exploit\
    \ another system. There is a proper structure defined by this framework, which\
    \ helps information security professionals develop a well-defined plan to execute\
    \ penetration testing activities. Each stage is built from the previous stage\
    \ of the framework providing inputs to the next stage. This is a process that\
    \ is run in a defined sequence, but it is natural for testers to refer to the\
    \ previous stages to gain more information or clarity about their findings."
  merge: -1
  pgno: 314
- img_proc: true
  md: 'Patrick Engebretson defines the first four stages of penetration testing in
    his book “The Basics of Hacking and Penetration Testing.” These steps are as follows.


    +   1. Reconnaissance

    2. Scanning

    3. Exploitation

    4. Maintaining Access


    In this book, we will go through these four stages, and an additional stage called
    Reporting.


    Also, if you have gone through the five stages defined in the Certified Ethical
    Hacking Course by EX Council, you will notice the last stage known as “Covering
    Tracks” is missing from this book. This has been done intentionally to put more
    focus on the first four stages and to include the Reporting stage in this book.
    If you read other books on Penetration Testing, you will realize that they do
    not include the Reporting stage, which we believe to be important. You will also
    find this book to be different from other books. We have removed the cyclic version
    of the penetration testing life cycle and made it a linear process. This is what
    ethical hacker would encounter in the process of penetration testing. This would
    begin with an ethical hacker beginning with the reconnaissance stage where they
    would begin by observing the target system, and the process would conclude with
    a presentation of the findings to the management team in the form of reports that
    were generated. The linear process has been shown in the image above. We will
    briefly go through each stage in this chapter and then deep dive into each stage
    through dedicated chapters. We will also discuss the common tools that are used
    for each stage when we go through the dedicated chapters. This will help you to
    have an understanding of each stage of'
  merge: -1
  pgno: 315
- img_proc: true
  md: 'penetration testing, along with getting hands-on knowledge of the common tools
    that are used.


    # Reconnaissance


    Let us try to understand this stage of penetration testing with the help of an
    analogy. Consider a military operation with a room occupied by military professionals.
    In a dimly lit room, officers and analysts are looking at the maps of the target
    region. A few other people in the room are constantly looking at activity happening
    in the target region with the help of television and monitors, and they are making
    their notes. There is one final group in the room that consolidates the data and
    writes a report on that data. This is exactly what penetration testers do during
    the reconnaissance stage of the penetration testing life cycle.


    The activities mentioned above are synonymous with what ethical hackers do during
    the first stage of the penetration testing life cycle. During this stage, penetration
    testers focus on anything and everything that would provide insights into the
    organization and network that is the target of the attack. Ethical hackers usually
    launch passive scans on the target network and crawl through the information available
    on the internet about the target. During this stage, a penetration tester would
    not launch an attack on the target network but will assess the target network
    to find out as much information as possible and document all.


    # Scanning


    We will continue with the military analogy to understand the scanning stage. Imagine
    a hilltop, where one of your soldiers is camouflaged and hitting among the trees
    and bushes. The responsibility of this soldier is to send back a report which
    will give details about the camps he can see, what he believes is the objective
    of that camp, and what activity is happening in each building present in that
    camp. The report will also include information'
  merge: -1
  pgno: 316
- img_proc: true
  md: 'about the roads that go in and out of the camp. It will also talk about the
    security measures in place for the camp.


    The soldier in the above analogy was given reports that were generated from the
    first stage of penetration testing to get closer to the target system without
    getting detected and scan it for more information. The penetration tester will
    further make use of scanning tools to actually get confirmed information about
    the network infrastructure of the target system. The information collected in
    this stage will then be used in the exploitation stage of the penetration testing
    life cycle.


    # Exploitation


    There are three soldiers deployed onto the field with all the information collected
    in the previous two stages. The moon is covered with clouds, but the soldiers
    can still see everything. They enter the target camp by using a gap in its fence
    and then entering through an unsupervised door. They spend only a few minutes
    inside the camp and gather information which tells them about the plans of the
    camp in the months to come.


    This is what penetration testers do during the exploitation stage. The task of
    this stage is to enter the system, gain the required information, and leave the
    system without being noticed. This is achieved by exploiting vulnerabilities in
    the system.


    # Maintaining Access


    The team of soldiers that raided the camp has now retrieved drawings that details
    about the camp with respect to the demographics, the checkpoints, unsupervised
    doors, manned sections, etc. Using this information, a set of skilled engineers
    chart out a plan to dig the earth and reach the required room in the camp from
    below. The purpose of this tunnel is to reach the required room easily and continue
    maintaining access to it.'
  merge: -1
  pgno: 317
- img_proc: true
  md: 'This is similar to what a penetration tester does in maintaining the access
    stage. Once the target system has been exploited, and access has been gained,
    and there are rootkits left on the target system so that it can be accessed without
    issues in the future as well.


    # Reporting


    The commander of the raid team will present the report to generals and admirals
    explaining what happened through every stage of the raid. The report contains
    detailed information explaining what helped with the exploitation.


    In this stage, the penetration tester also creates reports that will explain the
    process, vulnerabilities, and systems that were attacked. In some organizations,
    one or more members of the penetration testing team will have to present the report
    to the senior management.'
  merge: -1
  pgno: 318
- img_proc: true
  md: <!-- no content -->
  merge: -1
  pgno: 319
- img_proc: true
  md: '# # Chapter 3

    Renaissance


    In this chapter, we will dive deep into the reconnaissance stage of the penetration
    testing life cycle. This process will guide a penetration tester to discover information
    about the target system or organization. The information gathered will be used
    in the later stages of the penetration testing life cycle.


    # ## Introduction


    A military unit will try to analyze a target camp using readily available information
    before actual plans to attack are developed. Similarly, a penetration tester needs
    to analyze the target system by reading through readily available information,
    which can be used later to perform penetration. Most of the time, information
    about a target can be found by doing a google search and checking if the target
    system has any information about it on social media. Some more information could
    be found about the nameservers of a target system on the internet, which would
    lead you to the browser of the user as well. There may reply to an address available
    on the genuine Email to gain more information. Once you know the website of a
    target system you may download its code to develop an offline copy of it which
    will help understand the target system more. It may also serve as a tool for social
    engineering tasks later.


    The reconnaissance stage is the first stage, and the penetration testing team
    has negligible knowledge about the target system. The range of information provided
    to the team during this stage can vary from minimal information such as the name
    and the website URL of the target organization to specific information of the
    system with its IP address and the technologies used by the target system. The
    management team may have certain restrictions on'
  merge: -1
  pgno: 320
- img_proc: true
  md: 'the types of tests being done, such as social engineering and attacks, which
    may cause a Denial of Service DoS or Distributed Denial of Service DDoS.


    The main goal of this stage is to find out as much information about the target
    organization as possible.


    Some of the information that needs to be gathered during this stage is as follows.


    +   * The structure of the organization which should include charts showing the
    hierarchy of teams and departments.

    * The infrastructure of the organization which should include the network topology
    and IP space.

    * The hardware and software being used on systems.

    * Email addresses of the employees.

    * Other companies partnered with the organization.

    * The physical location of the organization.

    * All available phone numbers.


    # Trusted Agents


    A trusted agent is the representative in the organization that employed the penetration
    testing team or any other individual who is in charge of the penetration testing
    operation and can answer questions daily of what is happening. He or she is expected
    not to divulge the information about the penetration testing activity to the whole
    organization.


    # Starting with Target''s Website


    If a target has a website made for themselves, it will hold a great amount of
    information that can help with the engagement. For example, many websites display
    the hierarchy of the organization, along with details of'
  merge: -1
  pgno: 321
- img_proc: true
  md: 'their leadership profiles. This will help in creating a profile for the target.
    When you know the names of the key leaders of the organization, you can use it
    to fetch more information about them through social media as well.


    Almost all organizations maintain a page for career and job opportunities. This
    page can give you an insight into what technology is being used by the organization.
    For example, if there is a job opening for a system administrator with knowledge
    of Windows Server 2012 and Active Directory, it is evidence enough that the organization
    uses Windows Server 2012. If the job opening is saying that there is knowledge
    of Windows Server 2000 or 2003 required, it should alert the penetration tester
    that the organization is still using older technologies that are easier to break
    into.


    You should check if every website has a link to the webmail of the organization
    as the default URL is always webmail.organization.com or mail.organization.com.
    If resolving this link takes you to the Gmail access page, you will know that
    the organization uses Gmail as its backend for mails. If you see an Office365
    page, you will know that the backend being used is through Office365. This also
    means that mail servers will be out of bounds for penetration testing as they
    belong to the technology giants, and you can get in trouble if you try playing
    with them. Therefore, boundaries need to be defined with respect to penetration
    tests as well. If there are chances of a boundary is crossed, it should always
    be consulted with the trusted agent.


    # Mirroring Websites


    There are times when it will be just more helpful to download as much of the target''s
    website and regenerate missing parts of it for offline evaluation. This will help
    for automated tools to scan through the website code for keywords, or even if
    you want to make changes to the website code to test a few things. Also, it is
    always good to have one copy of the website offline while you are working in the
    reconnaissance stage. You can use tools like wget on the Kali Linux command line,
    which can copy all the static HTML'
  merge: -1
  pgno: 322
- img_proc: true
  md: 'files from a website and store it locally. The wget tool is available by default
    in Kali Linux and is easy to use. You can use the command shown below to copy
    all the HTML files from a website and store it on your local machine. However,
    do note that the wget command only gets static HTML files, and pages created using
    PHP code for server-side scripting will not be downloaded.


    ```

    wget -m -p -E -k -Kn -np http://organizationwebsite.com

    ```


    In this example, many options are used by the wget command. You can use the man
    pages for wget in Kali Linux to understand the use of each of the options passed
    with the wget command. You can use the man wget command to get the man pages for
    wget.


    You can go through the content available in the man pages using the up and down
    arrow keys or the up page and down page keys. You can get help using the h key,
    and you can quit the man pages using the q key. If you go through the man pages
    for wget, you will see something like below.


    +   -m: stands for the mirror, and is used for turning on the requirements for
    mirroring a website.

    -p: stands for prerequisites or page, and is used to ensure that HTML and CSS
    files get downloaded.

    -E: This option adjusts the extension and will ensure that the downloaded files
    are stored locally in the HTML format.

    -k: this option is used for link conversion and ensures that all downloaded files
    get converted such that they can be viewed locally.

    -K: this option is used to convert the backup, and it backs up the original files
    with the .orig suffix.'
  merge: -1
  pgno: 323
- img_proc: true
  md: 'Once the wget tool is downloaded, and all the files are on the system, it stores
    them in a folder with the name of the website. While the tool is working on the
    download, you may see errors on the output if the tool comes across pages coded
    with PHP. This is because the code used to create the website is running on the
    backend. This means that it is not easily accessible to any cloning too.


    After you have downloaded the file, you need to ensure that other people cannot
    view it, or the code is not deployed online again as it would end up violating
    copyright laws.


    # Google Search


    There are advanced search options available in Google that can be used during
    the reconnaissance stage. If you have never used the advanced search, you can
    locate it on the following URL.


    http://www.google.com/advanced_search


    The page looks as shown below.


    ![](img/a627fe7ba059f4d1e016d75c5d3e79ba_324_0.png)'
  merge: -1
  pgno: 324
- img_proc: true
  md: 'A professional penetration tester can use the regular search page as well to
    find what they want, but if you are just beginning with the use of Google Search,
    the advanced search form parameters will guide you to find what you''re looking
    for. The results can be made more specific using the options at the bottom of
    the page using operators available. The searcher can use a combination of parameters
    on this page to construct a search of their liking. If you are using more than
    one field, the search will be more complex but more accurate.


    ![](img/a627fe7ba059f4d1e016d75c5d3e79ba_325_0.png)


    Let us go through the parameters available in the Google Advanced Search in brief.


    # All These Words


    This field will search for pages by matching the words you entered irrespective
    of where these words appear on the web page. It is not even necessary for the
    words to be in the same order that you typed. You can conduct this search by typing
    the keywords in the text field, which will be converted into a search string by
    Google.


    # This Exact Word or Phrase


    When you type a search term in this field, Google will search for those words
    or phrases in the same order on the internet as you typed them. Unlike the results
    given by “All These Words,” search results of this option will contain results
    of web pages that contain the words in the same order. Google translates the search
    string and places it inside quotes while using this option.'
  merge: -1
  pgno: 325
- img_proc: true
  md: '# Any of These Words


    In this search, Google will give results of web pages that contain any of the
    words that you have typed. It will not try to match all the words that you have
    type to give results. Google translates the search string by separating the words
    with an OR operator while using this option.


    # None of These Words


    This search is used when you want to have results of web pages that do not include
    the words you typed by you. Google translates the search string by placing a minus
    sign in front of the words typed by you while using this option.


    # Numbers Ranging From


    There are two text fields provided in this search option so that you can type
    in two numbers, which are used as a range for the search. You can also enhance
    this search by using units of measure to your range, such as kilometers(km), pounds(lb),
    etc. Google translates the search string and places a period between the two options
    while using this option.


    # Language


    You can specify a language in this field to ensure that the result of the Google
    search contains pages that match the language.


    # Region


    You can specify a region from the dropdown, and the search results will contain
    web pages that were published in that particular region. If you have not combined
    this with the language selection dropdown, the search results will show all pages
    from that region irrespective of the language used in the region. You can conduct
    a more focused search by specifying the language and the region together.


    # Last Updated'
  merge: -1
  pgno: 326
- img_proc: true
  md: 'You can specify a time limit in the dropdown of this search parameter to display
    search results of web pages, which were last modified within the specified time
    frame. For example, if an organization merged with another organization recently
    or added a new technology stack recently, you can specify the time frame of that
    event to get the required results.


    # Site or Domain


    This can be one of the most helpful search parameters to narrow down a search.
    For example, if you want to restrict your search to only government organizations,
    you can specify the domain to be a.GOV domain. Or, if you want to search for a
    particular company, you could specify the company’s website to restrict your search
    to only that company.


    # Terms Appearing


    You can use this field to target your search to a particular part of the web page.
    If you select “anywhere on the page,” the search will go through the complete
    page of a website on the internet.


    If you use the option as “in the title of the page,” the search will be targeted
    only to the title section of all the web pages. The title of a web page is what
    appears in the tab of your browser when you open a website. If you use the parameter
    as “in the text of the page,” the search will only query all the text content
    of a website and will leave out elements such as the title, documents, images,
    etc. However, if these elements are written as text on the page, they will still
    be returned in the search results. For example, if there is an image that is referenced
    in the text of the web page, it will be returned in the results. This condition
    holds for links and image markups within the text as well.


    If you use the parameter “in URL of the page,” the search results will be restricted
    to the uniform resource locator of the website. The URL is the website’s address,
    which shows in the address bar of the browser.'
  merge: -1
  pgno: 327
- img_proc: true
  md: 'Using the parameter “in links to the page” will show web pages that have links
    that have a reference to the website you have mentioned.


    # Safe Search


    There are two parameters available in the Safe Search option. “Filter explicit”
    and “show most relevant results.” If you use the explicit filter option, the search
    result will leave out pages that contain sexually explicit content such as images
    and videos. If you use the show relevant results option, the search will not filter
    out sexually explicit content.


    # Reading Level


    This option filters out the search results based on how complex the text in the
    web pages is. If you use the “no reading level” option, the search will be executed
    with no reading level filter. If you use the option “annotate results with reading
    level,” the results will include all results along the indications of the reading
    level of each page.


    # File Type


    This parameter again is one of the most important and useful tools that can be
    used by a penetration tester. You can specify and narrow down the search results
    to a website that contains the file types specified by you. For example, you can
    specify file types such as Adobe PDF or Microsoft DOCX and XLS, etc. You can use
    various file types to search for various web pages. For example, usernames and
    passwords are usually stored in a database, and the file type could be SQL. The
    drop-down for this parameter offers a list of the most commonly used file extensions
    today.


    # Usage Rights


    This parameter narrows down the search results based on the publisher’s declaration
    of whether the content can be reused or if it has any copyright issues. If you
    select the option “free to use, share, or modify,” the search results will return
    pages that are allowed to be reused with a few restrictions that define how the
    content can be reused. The common restrictions include'
  merge: -1
  pgno: 328
- img_proc: true
  md: 'declarations such as the content modification will have a nominal fee. If you
    select the option as “commercial,” the results will return websites that you have
    a license for you to reuse their content.


    # Compiling an Advanced Google Search


    You can always use the individual parameters in the advanced google search page
    to get good results. Still, you can use a combination of parameters to get better
    and more relevant results. For example, consider the company Mao Kai International
    has done a merger with another company two months ago and has hired you to do
    a penetration test on them. The employees create many documents during such merger.
    They may have left an important document on the website in the open. You could
    use the following combination of Google Search parameters to get the required
    penetration testing result.


    This exact word or phrase: organizational chart


    +   - Region: Japan


    +   - Language: Japanese


    +   - Last update: 2 months ago


    +   - Site or domain: maokai.com


    +   - File type: Docx


    # Google Hacking


    A computer security expert named Johnny Long pioneered a technique known as Google
    Hacking. It is a technique that makes use of specific Google operators and can
    be employed to tweak the search results to get relevant results. This technique
    makes use of particular expressions to fetch results about people and organizations
    from the Google database. The technique makes use of the operators we discussed
    earlier in advanced Google search and further amplifies the results. It makes
    use of linked'
  merge: -1
  pgno: 329
- img_proc: true
  md: 'options and advances operators to create complex Google search queries to be
    fired at the Google search engine.


    The technique is used, especially when one needs to target information results
    about technologies used by an organization such as web services. Other times,
    it is also used to retrieve user credentials. There are many books available in
    the world today on how Google can be used for hacking. The most popular book is
    the one written by Johnny Long, and the publisher''s house is Sygress.


    # Google Hacking Database


    There is a database querying query strings for Google Hacking. You can find the
    original database at http://www.hackersforcharity.org/ghdb/. There is another
    Google Hacking database maintained by Offensive Hacking at http://www.offensive-security.com/community-projects/google-hacking-database/,
    which is an expansion of the original database. When the database was created
    originally, it contained more than 3350 google hacks spread over 14 categories.
    Out of these, around 160 search strings are useful to get google results that
    contain files used to store passwords. Let us go through an example of a google
    search string that can fetch your files containing Cisco passwords.


    enable password j secret "current configuration" -inext:the


    Passing this in the google search returned results of more than a million websites
    containing Cisco passwords. While there were files that did not contain any passwords,
    there were lot of them which did contain the Cisco passwords as well. A penetration
    tester can further refine this search string to include the website or a domain
    operator as follows.


    enable password j secret "current configuration" -inext:the site:websitetohack.com


    # Social Media'
  merge: -1
  pgno: 330
- img_proc: true
  md: 'Social media is a daily routine and a part of everyone’s life these days. Given
    this, it can be considered a box full of treasures for someone who is working
    on penetration testing. People may try to protect information about themselves
    in person but neglect and post it on social media such as Instagram, Twitter,
    Facebook, LinkedIn, etc. This information is very useful for social engineering.
    One can get a structure of an organization’s hierarchy by taking advantage of
    LinkedIn. LinkedIn will help you connect the dots on the profile of a target,
    and help gather organizational charts and even email addresses. However, there
    might be an additional level of social engineering required to get the email addresses,
    as they are not displayed publicly on LinkedIn. Finally, organizations post job
    opportunities on LinkedIn as well. These listings contain the requirements for
    a job profile, which let you know the technologies used by the organization.


    # A Doppelganger Creation


    A Doppelganger is defined as an individual who looks like another individual.
    It is a common practice to create a personality or profile before starting reconnaissance
    in the world of social media. You do not want to start research on a target using
    the profile of a penetration tester or a security expert. A penetration tester
    can create a personality or profile on social media, which could have been an
    ex-colleague or a college friend of the target at some point in time. However,
    this may not be allowed to be executed by your company as it could be claimed
    to be theft of identity as well. It could get you into trouble if you go deep
    into creating the personality, but again two people can have the same name as
    well. For example, you can create a fictitious personality John Doe who went to
    Brown University, and it would not mean that you stole the identity of an actual
    Jon Doe who went to Brown University. In any case, you need to ensure that the
    personality does not run deep into the personality of someone real, as it could
    then be treated as identity theft or fraud. This usually means that you are not
    supposed to fill in any legal forms using the name of the personality that you
    have created.'
  merge: -1
  pgno: 331
- img_proc: true
  md: '# Job Sites


    As a penetration tester, you can also resort to research on job portals such as
    Dice, Career Builder, Monster, etc. as that can lead to useful findings too. These
    websites can also help you understand the technologies used at the target organization,
    if you search these pages for the target organization, it can reveal the current
    openings at that organization, which can help a penetration tester to understand
    the target better. Many companies have started figuring out this flaw and, therefore,
    list openings as confidential so that third parties cannot easily access to these
    listings.


    # DNS Attacks


    The Domain Name System, known as DNS, in short, is the telephone directory of
    the internet. It is easier for humans to remember names as compared to IP addresses.
    For example, you would remember the URL google.com over an IP like 165.1.13.56,
    which could be the IP address for google.com. On the other hand, computers can
    remember numbers better, and therefore DNS helps convert these to IP addresses
    while looking for a resource over the internet. The internet uses a hierarchical
    structure that makes use of numbered octets for efficiency for the internet. This
    creates an inconsistency between what humans can remember and what computers can
    remember. This problem is solved by name servers, which act as translators between
    computers and humans. The topmost hierarchy of a nameserver has a top-level domain
    such as .com, .net, and other top-level domains. On the other end of this hierarchy,
    there are servers with IP addresses, which, thanks to the nameservers, can be
    accessed using domain names. You can understand how nameserver work if you understand
    how a computer interacts with a web browser. The querying begins from the local
    nameserver and goes all the way up to the root name servers. Every name server
    has information about the nameserver it or above it.


    There is a chain of events that are triggered when someone types google.com into
    the address bar of their web browser. The computer on'
  merge: -1
  pgno: 332
- img_proc: true
  md: 'which the web browser will first ask the local name server if it knows the
    address of google.com. If the web browser had made a previous request for google.com,
    then the computer will have a cached copy of the IP, or Google will have the same
    IP registered with the local name server, and the IP address will be returned
    immediately. If the information is not cached or if this is the first time the
    request is being made, the request is relayed to the next name server in the chain.
    If the next name server also does not know, the query keeps being passed to the
    name servers above in the chain until finally reaches the name servers of the
    top-level domain — the .com name servers in the case of google.com. Name servers
    can provide more information than just web pages. There are other records present
    with the name server, such as an MX record for a domain that helps emails to be
    routed to that domain.


    # Name Server Queries


    Most name servers are available for public access by their default nature. You
    can use the following command in Kali Linux to query the nameserver associated
    with the local machine.


    ```

    #nslookup

    Server: 172.27.152.39

    Address: 172.27.152.39#53

    ```


    Non-authoritative answer:


    Name: google.com


    Address: 172.27.166.164


    In the above example, the first part gives a result of the authoritative name
    servers, and the second part gives a result of the non-authoritative name servers.
    You can get information from the non-authoritative zone easily since it is served
    directly from the server’s cache.'
  merge: -1
  pgno: 333
- img_proc: true
  md: 'You can exit from nslookup using the exit command.


    The nslookup command can also make use of the name servers set up for the local
    system. You can use the following commands to see the name server being used for
    a given nslookup.


    ```

    #nslookup

    ```


    ```

    >server

    ```


    You can make the nslookup command give other results as well. For example, you
    can use the following commands to find all the mail servers used by a domain.


    ```

    #nslookup

    ```


    ```

    > set type=MX

    ```


    ```

    > google.com

    ```


    ```

    Server: 172.27.152.39

    ```


    ```

    Address: 172.27.152.39#53

    ```


    Non-authoritative answer:


    +   - google.com mail exchanger = 20 alt1.aspmx.l.google.com.

    - google.com mail exchanger = 10 aspmx.l.google.com.

    - google.com mail exchanger = 50 alt4.aspmx.l.google.com.

    - google.com mail exchanger = 30 alt2.aspmx.l.google.com.

    - google.com mail exchanger = 40 alt3.aspmx.l.google.com.


    Authoritative answers can be found from:


    ```

    alt1.aspmx.l.google.com internet address = 173.194.202.26

    ```'
  merge: -1
  pgno: 334
- img_proc: true
  md: 'alt1.asmx.l.google.com has AAAA address 2607:f8b0:400e:c00::1a


    asmx.l.google.com internet address = 172.217.194.26


    asmx.l.google.com has AAAA address 2404:6800:4003:c03::1a


    alt4.asmx.l.google.com internet address = 172.253.112.26


    alt4.asmx.l.google.com has AAAA address 2607:f8b0:4023::1b


    alt2.asmx.l.google.com internet address = 108.177.10.26


    alt2.asmx.l.google.com has AAAA address 2607:f8b0:4003:c14::1b


    alt3.asmx.l.google.com internet address = 209.85.145.27


    alt3.asmx.l.google.com has AAAA address 2607:f8b0:4001:c1e::1b


    As you can see from the above example, the result returns a list of mail servers
    used by google.com.


    It can be very useful to know several types of records associated with a domain
    name in the Reconnaissance stage. As we have seen in the above example, the nslookup
    command, by default, uses the name servers of the local computer first. You can
    find the local name server in Kali Linux configured in the /etc/resolv.conf file.
    You can use the following command to know the locally define name servers.


    ```

    #cat /etc/resolv.conf

    ```


    ```

    # Generated by NetworkManager

    ```


    ```

    nameserver 172.27.152.39

    ```


    ```

    nameserver 172.27.1.2

    ```


    You can change the default name servers to use the name servers of the target
    system. You can use the following command to find out the target system’s nameserver.'
  merge: -1
  pgno: 335
- img_proc: true
  md: '```

    # nslookup

    > set type=NS

    > google.com

    Server: 172.27.152.39

    Address: 172.27.152.39#53

    Non-authoritative answer:

    gogle.com nameserver = ns2.google.com.

    gogle.com nameserver = ns1.google.com.

    gogle.com nameserver = ns3.google.com.

    gogle.com nameserver = ns4.google.com.

    ```


    Authoritative answers can be found from:

    ns2.google.com internet address = 216.239.34.10

    ns2.google.com has AAAA address 2001:4860:4802:34::a

    ns1.google.com internet address = 216.239.32.10

    ns1.google.com has AAAA address 2001:4860:4802:32::a

    ns3.google.com internet address = 216.239.36.10

    ns3.google.com has AAAA address 2001:4860:4802:36::a

    ns4.google.com internet address = 216.239.38.10

    ns4.google.com has AAAA address 2001:4860:4802:38::a


    The above output gives a result of the default name servers used by google.com.
    Once you have found out the name servers of a target system, you can change the
    name servers used by the nslookup command to those'
  merge: -1
  pgno: 336
- img_proc: true
  md: 'of the target system. You can use the following command. We will be using one
    of google.com’s name servers.


    ```

    #nslookup

    ```


    ```

    > server 216.239.34.10

    ```


    Default server: 216.239.34.10


    Address: 216.239.34.10#53


    Various types of records can be discovered using the nslookup tool in Kali Linux.
    The following table will give you an idea of all the DNS records used on the internet.


    | Type of Record | Port used by default | Type of server |

    |---|---|-|

    | mx | 25 | Email server |

    | txt | No port | Text field which can be inserted with anything required |

    | ns | 53 | Name server |

    | cname | No port | Canonical name to set up aliases for other servers |

    | aaaa | No port | IPv6 or IP version 6 |

    | a | No port | IPv4 or IP version 4 used to set up a domain or subdomain record
    |'
  merge: -1
  pgno: 337
- img_proc: true
  md: '| Type of Record | Port used by default | Type of server |

    |---|---|---|

    | mx | 25 | Email server |

    | txt | No port | Text field which can be inserted with anything required |

    | ns | 53 | Name server |

    | cname | No port | Canonical name to set up aliases for other servers |

    | aaaa | No port | IPv6 or IP version 6 |

    | a | No port | IPv4 or IP version 4 used to set up a domain or subdomain record
    |


    # Zone Transfer


    As we have learned in the last section, you can use the nslookup tool to retrieve
    a lot of information to transfer manually. But you can use a zone transfer to
    retrieve much more information using less time. A zone transfer can provide a
    dump of all information available at a name server. You can update the authorized
    name servers using a zone transfer process. If name servers are not configured
    properly, they will end up providing information to not only authorized requests
    but anyone that requests for the zone transfer.


    The Domain Internet Gopher tool known as dig, in short, can help to process zone
    transfers. You can use the following command to perform a zone transfer.'
  merge: -1
  pgno: 338
- img_proc: true
  md: '```

    #dig @[name server] [domain] axfr

    ```


    Let us look at an example.


    ```

    #dig @ns2.google.com google.com

    ; <<< DiG 9.9.4-RedHat-9.9.4-73.el7_6 >>> @ns2.google.com

    google.com

    ; (2 servers found)

    ;; global options: +cmd

