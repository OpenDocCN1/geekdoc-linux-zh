- img_proc: true
  md: '# Kali-Rolling Repository


    The Kali-Rolling repository is aimed at the end-user. This is where you can find
    recent packages that you can use in your Kali Linux operating system. A tool that
    merges the Kali-specific packages and Debian Testing is used so that the dependencies
    are maintained. This makes it ideal for end-users as all packages can be installed
    without much issue. The Kali-Rolling Repository is updated most every day. This
    also means that the Debian Testing is also evolved.


    # Kali-Dev Repository


    The Kali-Dev Repository is maintained for developer’s use. It is not available
    to the public. The developers ensure that the dependency problems are solved here
    before the packages are moved to the main Kali-Rolling repository. The packages
    from the Debian Testing first land here, and then go through a proper testing
    method. If you are an advanced user, you can choose to work with the repository
    but beware you try it as it can lead to many hours of troubleshooting


    # Kali-Bleeding-Edge Repository


    The repository holds all the new packages that are built from the upstream Git.
    It is automatically built. This means that you can access to the bug fixes and
    latest features. These changes are so fresh that you can get it as soon as the
    changes are made available to it. If you think that your bug report is resolved,
    you can verify it by trying out the repository. Of Course, there is a downside
    to it as well. For instance, the changes are not thoroughly checked and hence
    can have issues in it. There can also be a dependency issue.


    The Kali-Bleeding-Edge Repository can be accessed by adding the following line
    to the sources.list file.


    ```

    deb http://http.kali.org/kali kali-bleeding-edge main contrib non-free

    ```'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# Basic Package Interaction


    Now that we have learned about the repositories, APT, and dpkg, it is now time
    to learn how we can do basic package interaction.


    As we know, APT is a great tool. single-handedly manages the installation, maintenance,
    and removal of packages. In fact, it also manages the dependencies if needed.
    It does it with the help of the apt-get command-line tool. It basically overcomes
    the drawbacks of the dpkg.


    Before you start your journey with APT, make sure to run the apt update command.
    It will update the available package list and the sources from which the packages
    can be downloaded.


    # Installing Packages


    Let''s take a look at how packages can be installed using the tools. First, we
    will go through the dpkg and APT.


    # Using dpkg to Install Package


    dpkg is the core tool that ensures the package can be installed. dpkg tool only
    works with the .deb Debian packages. To install the package, you need to use the
    following command.


    ```

    dpkg --unpack packagen

    ```


    Here you first need to unpack the package using the --unpack option for dpkg.
    It will unpack the package and process triggers, as well. Now, you need to configure
    the database for the package. To do so, you need to run the following command.


    ```

    dpkg --configure packagename-db

    ```


    Here you change the packagename to the name of the package that you are going
    to use.'
  merge: -1
  pgno: 251
- img_proc: true
  md: 'Some of --steps are automatically executed once you run the dpkg command with
    the --unpack or --configure command. Also, if there is a dependency, then the
    command will throw an error showing that dependency packages are not present.


    You can also forcefully install a package by simply enabling the dpkg command
    to ignore the error. One such common error is the file collision error. To forcibly
    install a package, you need to run the following command.


    ```

    dpkg -i --force-overwrite packename.deb

    ```


    # Meet APT - an Overall Better Solution


    APT is an advanced tool that handles a lot of stuff than dpkg. It makes interacting
    with packages simple and easy. That’s why, as a beginner, you should always use
    APT.


    The command for apt is as below.


    ```

    apt install package-name

    ```


    You can also use alternative commands such as


    +   - apt-get install package-name

    - aptitude install package-name


    Once run, it will first read the package list and then create a dependency tree.
    Once the tree is complete and it doesn’t find any missing dependency, it will
    move forward to install the package itself. But, if any dependency is missing,
    then it will update them and then install the package. Before it does that, it
    will ask you for confirmation. It will also show a message on how many packages
    need to be updated or installed before the operation can be done. If you press
    Y on your keyboard, it will automatically handle everything from there and complete
    the installation process.'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# Kali Linux Upgrade


    Kali Linux is an active operating system. It continually gets updated with new
    features, packages, and programs. In this section, we will learn how to keep your
    Kali Linux upgraded most of the time.


    To regular upgrades, you need to use the three basic upgrade commands:


    +   - apt upgrade

    - apt-get upgrade

    - aptitude safe-upgrade


    All of the three commands lookout for the packages that can be upgraded. It also
    makes sure that the packages that need upgrades will not be removed. By running
    the command, you get access to the best possible Kali Linux experience.


    The package selection is made by the apt tool. It chooses the recent stable version.


    If you do not mind removing old packages that are obsolete, then you can choose
    to use the following command,


    ```

    apt full-upgrade

    ```


    The command will not hesitate to remove old packages if it requires new packages
    to be installed. We recommend using the command if you want to stick close to
    the Kali Rolling system.


    As a Kali Linux user, you can also learn about the potential issues with the help
    of the apt-listchanges package. You simply need to install it and run it. Once
    done, it will showcase the problems before you run the upgrade. The information
    is stored in the /usr/share/doc/packages/NEWS.Debian file.


    Also, one thing that you need to take care of is the frequency of updating your
    Kali Linux. The Kali Linux Rolling gets new updates every single day.'
  merge: -1
  pgno: 253
- img_proc: true
  md: 'As a user, you do not want to upgrade daily as it can mess up with your setup.


    Only update if you know that a security update is out or there is a bug fix in
    the release. You should also make sure that you check the release notes before
    reporting a new bug. It might get fixed already.


    So, which instances you need to avoid when it comes to not upgrading? Let''s list
    them below.


    +   - Do not do an upgrade if your Kali Linux operating system is running smoothly.

    - If you think that the new upgrade will cause more problems, then do not upgrade

    - And, finally, do not upgrade if you think that it removes some of the packages
    that you need. Simply review it using apt-listchanges packages before making the
    decision.


    # Purging and Removing Packages


    Until now, we discussed how to install packages or upgrade the system. Now, let''s
    take a look at how to get rid of the packages.


    You can remove a package using the dpkg command with the -- remove or -r option.
    The syntax of the command is as below.


    ```

    dpkg --remove [package-name]

    ```


    Once you use the command, it will remove the package from your system. However,
    it is a soft remove, which means that associated files, including maintainer script,
    log files, configuration files, and associated files. This means that you should
    use the option only when you want to re-install the program later on. The leftover
    residue files can then be used once the package is installed back.'
  merge: -1
  pgno: 254
- img_proc: true
  md: 'However, if you want to remove the packages, including the dependent packages
    completely, then you need to use the APT command. The command to completely purge
    the package from your system is as below.


    ```

    apt remove package-name

    ```


    The APT command also ensures that the user data and configuration files are not
    removed.


    If you want to remove the user data, but no configuration file, then you need
    to use dpkg with the -p option. For apt, you need to use the apt purge command.


    The purge command should be used cautiously as it can remove the user data, which
    cannot be retrieved in any condition.


    # Learning About Package Contents


    If you are curious about how to inspect packages that we got you covered. You
    can look into the contents of the packages using apt, apt-cache, and dpkg packages.


    To read the package files, you need need to use the --listfiles or -L option with
    dpkg. The syntax of the command is as below.


    ```

    dpkg --listfiles [package-name]

    ```


    ```

    dpkg -L [package-name]

    ```


    # Searching For a Particular File


    If you are looking for a particular file within the package, then you can use
    the --search option. The syntax for it is as below.


    ```

    dpkg --search [package-name]

    ```


    ```

    dpkg -s [package-name]

    ```


    # Status of The Package'
  merge: -1
  pgno: 255
- img_proc: true
  md: 'To check the status of the package, you need to use the --status option. The
    syntax is as below.


    ```

    dpkg --status [package-name]

    ```


    ```

    dpkg -s [package-name]

    ```


    # Listing the Known Number of Packages


    To list all the packages in the system, you need to use the following command.


    ```

    dpkg --list

    ```


    ```

    dpkg -l

    ```


    Both the commands work the same. You can also provide a wildcard as the third
    parameter to search for a particular package if you want. This will execute the
    search based on the wildcard or the string that you used for searching. The command
    for it is as below.


    ```

    dpkg -l ''file*''

    ```


    # Troubleshooting Packages


    Running into problems is a part of working with Kali Linux. That’s why, in this
    section, we will go through troubleshooting.


    # Problems After an Upgrade


    Upgrading your Linux operating system can sometimes cause issues. It can lead
    to issues including incompatible packages, bugs, or even instability. In those
    cases, you can do the following.


    # Bug Reports


    As a user, you may want to report the bug. You can also follow the Kali bug tracker
    to know if the bug is already reported or not. If it is not, then you should go
    forward and report it. You should also read the section where we'
  merge: -1
  pgno: 256
- img_proc: true
  md: 'discussed on bug reporting. Also, make sure that you do a proper bug report
    with as much information as possible.


    # Downgrading


    You can also downgrade if needed. Sometimes, it is required to downgrade your
    Kali Linux or the package that you upgraded. You can downgrade if you know the
    old package version. This way, you can use the APT command to install that version.
    If you have the old .deb file, then also you downgrade the package. Kali Linux
    or Debian, in general, have the .deb file stored in few places.


    var/cache/apt/archives/


    Kali mirror pool directory


    You can also find the old package at http://snapshot.debian.org


    # Things We Learned in This Chapter


    +   - You can install packages using APT and dpkg tools

    - APT stands for Advanced Package Tool(APT).

    - dpkg is the core of handling proper package management

    - APT is more advanced as it offers seamless package management

    - With APT, you do not have to worry about dependencies.

    - Multiple Kali Linux repositories hold the packages.

    - For normal users, Kali-Rolling Repository is best as it offers tested packages

    - Devs use Kali-Dev Repository.

    - You can get access to the latest package from Kali-Bleeding-Edge repository'
