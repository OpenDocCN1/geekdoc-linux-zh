  md: '# Chapter 5

    Learning about Debian Connection


    Kali Linux is a genuine Debian derivative. The work on Kali Linux started in 2012.
    Its connection to Debian is important to learn as it will make you understand
    its importance and also understand how it works.


    More specifically, it is based on top of Debian Testing. This means that the packages
    that you see in Kali Linux are from Debian repository -- not all, but most. However,
    do not make the confusion that Kali Linux is dependent on Debian. Kali Linux has
    its own infrastructure when it comes to packaging selection and distribution.
    The user can choose whatever he wants and has the complete freedom to so.


    # How Packages Flow From Debian to Kali Linux


    As we already mentioned that the packages flow from Debian distribution to Kali
    Linux. This is done properly.


    The Debian gets updated by contributors daily. They update packages and also ensure
    that the packages get updated to the unstable Debian distribution. Once the packages
    are uploaded, it is moved to the Debian Testing distribution. This is where all
    the bugs are removed, and the packages are then made available for release.


    Debian testing is the best playground for Kali Linux as their goals are aligned.


    The contributors of Kali Linux then take a two-step process to include the packages.


    The first step is to force-inject the Kali packages to the Kali-dev repository.
    This can break the repository, but that''s the expected outcome. To make it'
  merge: -1
  pgno: 199
- img_proc: true
  md: 'work, the next step is to make sure that the new packages are recompiled along
    with the old ones to make it work.


    Kali Linux also has a distribution named “Kali-rolling,” which can be used by
    the users to track all the changes that are made to the Kali-dev distribution.
    The end goal is to ensure that all dependencies are met before packages are migrated.


    # How is The Debian Difference Managed?


    The difference is mostly managed by reducing the number of forked package. This
    is done to ensure that Kali’s unique features are implemented correctly. The upstream
    packages are modified minimally. If you want to learn about the difference between
    Debian and Kali packages, you can check out their Kali Package Tracker(https://pkg.kali.org/derivative/kali-dev/).


    # Things We Learned in This Chapter


    +   * Kali Linux and Debian are closely related.

    * Packages flow from Debian to Kali Linux.

    * Kali Linux has a distribution known as “Kali-rolling” that deals with the changes
    made to the distribution packages.


    If the packages are good, they are then moved to the main Kali distribution.'
  merge: -1
  pgno: 200
