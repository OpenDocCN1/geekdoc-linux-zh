  md: '# # Chapter 1

    Firewalls in Kali Linux


    In book one of this series, we read about the Kali Linux firewall in brief. Given
    that we will be deep diving into making your Kali Linux system a tool for penetration
    testing, we will cover the basic information and commands that will make the Kali
    Linux system secure. This will ensure that it is not open to attacks from the
    outside. This will be achieved using the firewall in Kali Linux.


    A firewall is defined as a mechanism comprising hardware or software or both,
    which monitors the incoming and outgoing packets on a network (packets coming
    into and leaving a local network) and only allows transmission of the packets
    that match the predefined rules.


    A firewall that is used to protect a complete network is known as a filtering
    network gateway. A filtering network gateway is installed on a dedicated system
    that acts as a gateway or a network proxy for all the traffic coming into and
    leaving the local network. An alternative to a network gateway is a firewall that
    is implemented through the software on a local machine that has network rules
    set up for that particular machine. Another use of a local firewall is to drop
    unwanted outgoing connections from the machine by unwanted software like malware,
    which would have been installed or without the owner''s knowledge.


    There is a firewall embedded in the Kali Linux kernel known as the Netfilter.
    There is no one way of configuring any firewall because the requirements will
    vary from one network to another and from one user to another. To configure Netfilter
    in Kali Linux, you can use the commands iptables and ip6tables. The difference
    is that the iptables command is used to configure rules for IPv4 networks, and
    the ip6tables command is used to configure rules for IPv6 networks. You will need
    to'
  merge: -1
  pgno: 299
- img_proc: true
  md: 'know how to use these tools, as we believe that both IPv4 and IPv6 network
    stacks are going to be around for quite a few years in the world. Apart from using
    these commands, there is a graphical tool called fwbuilder, which can be used
    to configure the firewall rules graphically.


    You can choose whichever method you are comfortable with to configure The Kali
    Linux firewall. Let us take a closer look at how this firewall works.


    # Behavior of Netfilter


    There are four types of tables in Netfilter. These table store three types of
    operations on network packets.


    +   * Filter: This table contains rules for filtering packets. The rules define
    whether a packet will be accepted, refused, or simply ignored.

    * NAT: NAT stands for Network Address Translation. This table is responsible for
    translating the address of the source and destination and packet ports.

    * Mangle: All other changes to IP packets are stored in this table. This includes
    fields like the TOS - Type of Service and other fields.

    * Raw: This table allows you to make any manual modification of network packets
    before they hit the system.


    There is a list of rules inside each of the above tables called chains. The firewall
    will make use of these chains to manage packets. A Linux administrator can create
    new custom chains other than the standard chains, but these will still only be
    used when a standard chain redirects a packet to the custom chain.


    The list of chains used by the filter table is as follows.'
  merge: -1
  pgno: 300
- img_proc: true
  md: '+   - INPUT: This chain handles packets that are directed to the firewall from
    an external source.

    - OUTPUT: This chain handles packets that are directed to an external source from
    the firewall.

    - FORWARD: This chain handles packets that pass through the firewall. The firewall
    is neither the source of the packets nor the destination.


    The list of chains in the NAT table are as follows:


    +   - PREROUTING: This chain will modify a packet as soon as it enters the system.

    - POSTROUTING: This chain will modify packets when they are on their way to leave
    the system.

    - OUTPUT: This chain modifies the packets that the firewall itself generates.


    The figure below illustrates how Netfilter chains are employed.


    ![](img/a627fe7ba059f4d1e016d75c5d3e79ba_301_0.png)


    Each chain defines a list of rules. These rules consist of a set of conditions
    and actions that the system should perform when all conditions are'
  merge: -1
  pgno: 301
- img_proc: true
  md: 'satisfied. When a packet is coming into the system or leaving the system, the
    firewall puts it through every chain, rule by rule. When the packet meets the
    condition defined by any rule, it will then act as defined by that rule and process
    the packet. The chaining process will be interrupted now since the firewall has
    already decided what needs to be done with the packet.


    Let us go the available Netfilter actions below.


    +   - **ACCEPT**: This action approves the packet and allows it to proceed where
    it is supposed to go.

    - **REJECT**: This action will reject the packet and throw an error known as the
    Internet Control Message Protocol (ICMP) packet error.

    - **DROP**: This action will drop or ignore the packet.

    - **LOG**: This action logs a message with the packet description using the syslog
    daemon. There is no interruption to the processing of packets because of this
    action. The packet will move to the next rule in the chain. This is why if a package
    that was logged can get rejected as well, it would require both the LOG rule and
    the REJECT/DROP rule.


    The following parameters are commonly included with logging:


    --log-level: This parameter has a default value called **a warning**, which indicated
    the severity level of Syslog.


    --log-prefix: Using this parameter, a specific text prefix can be added to the
    log messages, which will help you differentiate from other system logs.


    --log-TCP-sequence, --log-TCP-options, --log-IP-options: All three parameters
    can be used to add additional data in the log messages. This additional data will
    include the TCP sequence number, the TCP option, and the IP options, respectively.'
  merge: -1
  pgno: 302
- img_proc: true
  md: '+   * ULOG: This action will log a message using the ulogd daemon. Ulogd has
    an advantage over syslogd in that it is better at handling a huge number of messages.
    Also, note that this action does not interrupt the chain. The packet is passed
    to the next rule in the chain. When this action is performed, the packet is logged
    as well.


    +   * chain_name: This action will jump the packet to the defined chain and evaluate
    it through its rules.


    +   * RETURN: This action will interrupt the processing of the packet in the current
    chain and return the packet to the calling chain. If the current chain in which
    the packet is being processed is standard, then there will be no calling chain.
    In this case, the packet is referred to as a default action. This default action
    is defined using the P option in iptables.


    +   * SNAT: This action is available only in the nat table. This action applies
    Source Network Address Translation(SNAT) to the packet. There are options in place
    to define the exact actions that are to be applied to the packet. Some of these
    options are --to-source address: port, which will define the new source IP address
    and port for the packet.


    +   * DNAT: This action is also available only in the nat table. This action applies
    Destination Network Address Translation(DNAT) to the packet. There are options
    in place to define the exact set that are to be applied to the packet. Some of
    these options are --to-destination address: port, which will define the new destination
    IP address and port for the packet.


    +   * MASQUERADE: This action is also available only in the nat table. This action
    applies masquerading to the packet, which is a special case of Source Network
    Address Translation(SNAT).'
  merge: -1
  pgno: 303
- img_proc: true
  md: '+   - REDIRECT: This action is also available only in the nat table. This action
    transparently transports a packet to a port of the firewall itself. This action
    is useful in setting up a web proxy on the client-side without any configuration,
    as the client will think that it is connecting to the recipient directly. Still,
    the connections will be passed through a proxy. You can use the --to-ports ports
    option to define the port or port range where you want the packets to be redirected.


    # # Understanding ICMP


    Internet Control Message Protocol, known as ICMP, in short, is a network protocol
    used to send ancillary information in communications. The ping command under ICMP
    is used to test network connectivity. The ping command sends an echo request message
    using ICMP, in which the recipient is supposed to reply with the echo reply message.
    ICMP lets us know if a firewall rejects a packet or if there is an overflow in
    a receive buffer. It also proposes proper routing for the subsequent packets in
    the traffic. The RFC documents like RFC777 and RFC792 first defined the ICMP protocol
    but have been revised over the years. You can find them in Sources section of
    this book.


    A receive buffer is a small part of memory that stores a packet for a brief time
    when the packet arrives into the system it is handled by the kernel. There are
    times when this buffer will be full, and there is no space for new packets to
    arrive. In such an event, the ICMP flags the issue and tells the emitter to slow
    down the transfer rate. It can instruct the system to stabilize the transfer rate
    in some time.


    Another point worth noting that ICMP is not mandatory for an IPv4 network to function
    but is necessary for an IPv6 network. IPv6 is defined in the RFC4443 documentation
    and can be found in the resource section of this book..'
  merge: -1
  pgno: 304
- img_proc: true
  md: '# iptables and ip6tables syntax


    We learned about tables, chains, and rules of the Netfilter firewall in Kali Linux.
    The commands used to manipulate these entities in Kali Linux are iptables and
    ip6tables. The commands are passed with the option -t to indicate which table
    the commands should execute on. If no option is specified, the commands operate
    on the filter table by default.


    # Commands


    Let us go through the major options which are used with iptables and ip6tables
    commands to interact with the various chains.


    +   -L chain: This option is used to list all the rules that are part of a particular
    chain. This is additionally used with the -n option to enable listing rules concerning
    a particular chain.


    For example, the command iptables -n -L INPUT will list down all rules concerning
    incoming packets.


    +   -N chain: This option is used to create a new chain. A new custom chain can
    be created for various purposes, such as testing a new service or for tackling
    a particular network attack.


    +   -X chain: This command can be used to delete an unwanted chain.


    For example, iptables -X brute force-attack


    +   -A chain rule: This option is used to add a rule at the end of the chain that
    is passed. It is important to take care while adding new rules as rules are always
    processed from top to bottom.


    +   -I chain rule_num rule: This option adds a new rule before the rule number
    mentioned. Just like with option -A, it is important to take care while adding
    new rules with this option.


    +   -D chain rule_num (or -D chain rule): This option is used to delete a rule
    in the chain. The first syntax can be used to delete a'
  merge: -1
  pgno: 305
- img_proc: true
  md: 'rule by specifying the number of the rule. The command iptables -L --line-numbers
    can be used to display all the rules with their number.


    +   -F chain: This option is used for flushing a chain and deleting all its rules.
    For example, if you want to delete all the rules for incoming packets, you can
    use the command iptables -F INPUT. If you do not specify any particular chain,
    all the rules in the entire table will be flushed and deleted.


    +   -P chain action: This option defines the default policy for the chain. This
    default policy can be applied only to standard chains. If you want to drop all
    incoming packets by default for a chain, you can define the standard policy using
    the command iptables -P INPUT DROP.


    # Rules


    The syntax for rules is represented as conditions -j action action_options. If
    there is more than one condition in the rule, they can be added using the logical
    AND operator.


    The p protocol condition is used to match the protocol field of the IP packet.
    The most common values to be substituted for the protocol are UDP, TCP, ICMP,
    icmp6, etc. This condition can also be complemented with TCP port conditions using
    the options as --source-port port --destination-port-port.


    Note: You can prefix a condition with the exclamation mark, and it will negate
    the condition. For example, if you use an exclamation mark with the -P option,
    it will indicate that the rule should execute on all the other protocols except
    for the one specified in the rule. You can use negation with all other conditions
    as well.'
  merge: -1
  pgno: 306
- img_proc: true
  md: 'You can use the condition -s address or -s network/mask to match a packet with
    its source address. Similarly, you can use the condition -d address or -d network/mask
    to match a packet with its destination address.


    If you want to select packets coming in from a particular network interface, you
    can use the condition -i interface. Similarly, if you want to select packets going
    out from a particular network interface, you can use the condition -o interface.


    The --state condition is used to match the state of a packet. This will work provided
    the ipt_conntrack kernel module is installed.


    The connection states for a packet are as follows:


    +   - **NEW**: This is when a packet is starting a new connection.

    - **ESTABLISHED**: This implies packets already match an existing connection.

    - **RELATED**: This matched packets that are starting a new connection where the
    connection is already associated with an existing connection. This is useful for
    connections related to FTP-data while in the action of the FTP protocol.


    Several options can be used with iptables and ip6tables, mastering them comes
    gradually with practice and use. However, one option that needs to be kept in
    mind for good is the one to block malicious network traffic from a particular
    IP or a network.


    For example, if there is malicious traffic coming from the IP 11.2.1.6 and the
    30.72.50/24 class subnet, you can use the following commands.


    ```

    iptables -A INPUT -s 11.2.1.6 -j DROP

    iptables -A INPUT -s 30.72.50/24 -j DROP

    iptables -n -L INPUT

    ```'
  merge: -1
  pgno: 307
- img_proc: true
