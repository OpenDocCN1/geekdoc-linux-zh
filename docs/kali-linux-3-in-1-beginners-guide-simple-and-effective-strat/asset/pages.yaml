    This is an exceptional case. Many factors scan time and there will be times when
    a slower scan will not actually be slow. Therefore, a penetration tester needs
    to have all the tools handy and have knowledge about as many tools as possible.


    # -T4 Aggressive


    The T4 or --timing aggressive scan also uses the parallel scanning technique and
    increases the scan speed. The scan_delay option for this scan is set to 0 seconds
    and can make use of a max_scan_delay of 10 milliseconds. There are high chances
    of scans that use a max_scan_delay of less than one second to encounter errors
    as many target systems have a requirement of at least one second between the probes.
    If you look at the time taken by this scan to complete scanning the 500 UDP port
    is well under 8 minutes or 477 seconds.


    # -T5 Insane


    The T5 or --timing insane scan is the fastest built-in timing template for Nmap.
