    # Kali Linux Hard Disk Install


    # Kali Linux Installation Requirements


    The Kali Linux installation process is fairly simple and easy. Firstly, we need
    to get a machine, which has compatible hardware for the Kali Linux installation.
    Kali Linux supports 32-bit, 64-bit and ARM (armhf and armel) architectures. The
    previous sections of the book covered the process of creating bootable USB media
    for Kali Linux ISO. If you have a DVD drive, you can also write the ISO image
    to the DV to install Kali Linux on your machine.


    The minimum hardware requirements to install Kali Linux on a machine as follows.


    +   1. A minimum disk space availability of 20 GB for the installation files.

