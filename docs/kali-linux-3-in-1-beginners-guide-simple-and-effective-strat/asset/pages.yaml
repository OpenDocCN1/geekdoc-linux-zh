- img_proc: true
  md: 'Host Unreachable


    Ping 192.168.1.200


    Pinging 192.168.1.200 with 32 bytes of data:


    Reply from 192.168.1.129: Destination host unreachable.


    Reply from 192.168.1.129: Destination host unreachable.


    Reply from 192.168.1.129: Destination host unreachable.


    Reply from 192.168.1.129: Destination host unreachable.


    Ping statistics for 192.168.1.200:


    Packets: Sent 5, Received 4, Lost 5 0 (0% loss)


    # Traceroute


    Traceroute is another ICMP utility that helps you find out the number of network
    devices that need to be hopped before the source device can reach the target device.
    This command functions by manipulating the Time to Live or the TTL of a packet.
    Time to Live or TTL indicates the number of times a packet can be broadcasted
    by the host that encounters the packet on the next hop. The initial value of TTL
    for a packet is 1 which means the packet can only hop one device. The device that
    receives this packet will reply with an ICMP type 11 and code 0 packet which means
    that the packet is logged. The sender then increases the TTL and sends the next
    set of packets in the series. The packets will reach the next hop in the network
    and reach their time to live. As a result of this, the router that receives the
    packet will send another time exceeded reply. This process will continue until
    the packet reaches the target and all the hops in the path have been recording
    a complete list of devices that lie between the source device and the target device.
    This information can be used by a penetration tester to find out all the device
    that is between them and the target on the network. There is a default TTL of
    128 on Windows device, Linux devices have a default TTL of 64 and networking devices
    by Cisco have a ping of 255. The command used for traceroute on the Windows command
    line is'
