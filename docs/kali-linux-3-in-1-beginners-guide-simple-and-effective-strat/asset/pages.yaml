- img_proc: true
  md: '# # Chapter 10

    Debian Package Management


    Kali Linux is a Debian-based Linux operating system, especially the Debian package
    management system. It simply borrows the package management system from Debian.
    We already discussed how new packages are created and added to Kali Linux.


    At the core of Kali Linux, it is the package management system, and if we get
    to learn about it, we will be able to know a lot about the operating system. By
    studying it, we will learn how Kali Linux is structured and used. It will also
    help you to troubleshoot when needed.


    In this chapter, our focus will be Debian package management system. We will also
    learn about APT suite tools and dpkg. By going through this, you will understand
    the main strength of the Kali Linux, i.e., its package management system. Kali
    Linux is also known for its package management system and how it has a seamless
    installation process.


    The package management system also ensures that you do not have to work hard to
    make things work as the management system takes care of most of the things by
    itself. Let''s get started below.


    # APT Introduction


    APT stands for Advanced Package Tool(APT). It is more advanced than dpkg. But,
    what does dpkg do in the first place and how both of them compare? Let''s find
    out below.


    # APT vs. dpkg


    Any software application is stored in the Debian package. Also, if you want to
    get access to build a binary package(.deb), you need to have the source-pack,
    which includes the instructions and the files to install it. If you only'
  merge: -1
  pgno: 246
- img_proc: true
  md: 'take the binary package(.deb) into account, it only contains the directly usable
    files, including documentation or programs.


    In short, a Debian package comes well equipped with all the information that is
    required to install the package. The metadata also includes the dependencies and
    have the proper information to know how to manage the package''s installation,
    upgrades, and removal.


    To install the Debian package, you need to use the dpkg tool. The tool is very
    hand and is used most of the time to install the package. However, if there is
    a missing dependency, then it will not be able to install the package. An error
    will be thrown, telling you that the packages are missing.


    The Advanced Package Tool(APT), on the other hand, is completely capable of installing
    the missing dependencies. It does it with the help of the apt and apt-get commands.
    APT is simply an upgraded version of the Debian packages.


    Debian packages command is dpkg.


    By using the command, you will be able to analyze the .deb packages and install
    them. However, dpkg is limited in nature. They simply do not know about any other
    packages. APT, on the other hand, has a better feature set compared to dpkg.


    APT is a complete solution that enables you not only install and manage Debian
    applications or packages but also upgrade the system when needed. If you have
    used Linux before, you should know about the apt-get and apt-upgrade options.
    These options let you upgrade and update all the available packages(including
    their dependencies) correctly. We can consider APT as an umbrella tool. Also,
    you should not forget that the APT tool is useless without dpkg as it handles
    all the core package management tasks, including installation, removal, and upgrade.
    APT’s advantage is the fact that it can connect online and then learn about the
    dependencies of a'
  merge: -1
  pgno: 247
- img_proc: true
  md: 'package during the installation process. This solves the dependency process
    and improves user experience.


    APT and dpkg are a boon for the current Linux users. Earlier, a user need to compile
    programs by themselves by using the programs such as GCC, make and configure.
    They are compiling programs and can easily make the installation process complex.
    You might have to go through the different errors and mistakes before you can
    finally install the process. This required reading documentation and researching
    online -- which in turn takes a lot of time and effort.


    With the advancement in user experience, we can say that Kali Linux(or Linux in
    general) has come a long way. APT and dpkg have solved the problems in a unique
    way, which makes Linux-based operating systems more user-friendly.


    As we have already said, APT is connected online and is able to retrieve packages.
    The source list from APT gets its packages is listed in the /etc/apt/sources.list
    file.


    # Going Through the sources.list File


    At the core of APT, there is the source.list file. This file contains the configuration
    and the sources that APT use to make it work. If the file is not configured correctly,
    then there are chances that APT will fail to work as intended.


    The source in the APT source.list file consists of three parts. Spaces separate
    these three parts. Let’s take a look at the example below.


    ```

    deb http://http.kali.org/kali kali-rolling non-free contrib

    ```


    The first part of the command is the deb. In this case, it stands for binary packages.
    It is the source type. It can also be deb-src, which stands for the source packages.'
