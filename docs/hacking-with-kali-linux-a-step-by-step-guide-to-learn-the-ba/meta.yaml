  md: '# Chapter 14 Advanced kali Linux concepts


    Using abusive services


    Services are the most important mechanisms that Linux operates for a better functioning
    of the operating system. Even windows have services that run-in background. Basically,
    services are processes that run in the background until you use it. For example,
    consider a proxy server like Burp suite that will intercept every information
    that goes on in the browser and if you click No it stops the service and nothing
    goes there. In windows, which is quite well dominated by graphical user, interfaces
    services are easily closed down by a click. Whereas in Linux we need to start
    using command line to start, stop and restart services.


    Why services matter to hackers?


    Hackers should be well learnt about services because when you are trying to exploit
    a system you need to stop services that can interrupt what you are doing. Clever
    administrators use services to make hackers confuse. So, you need to understand
    the services that are making your exploitation difficult and stop them as soon
    as possible. Some advanced hackers install their own services after exploiting
    the system in a way that they will receive valuable information from the host
    regularly. In the below section we will explain with command line examples that
    will help us understand dealing with services.


    1) Starting a Service


    To start burp suite as a service go to Linux terminal as a root user and just
    use the following command.


    ```

    root @ kali:service burpsuite start

    ```


    This will start the service and you can check it using the ps command.


    2) Stopping a Service


    Stopping a service will completely abort everything that service is dealing with.
    So always, be careful while stopping a service as any unsaved data will be lost.
    Now use the following command to stop the service.


    ```

    root @ kali:service burpsuite stop

    ```'
