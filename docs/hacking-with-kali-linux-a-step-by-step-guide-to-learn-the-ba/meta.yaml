- img_proc: true
  md: 'Being able to intercept requests as soon as they leave your browser is a highly
    valued toolkit functionality. The general idea is to use an interception proxy
    as the key which gives you the power to modify any variables before reaching the
    target destination, which is the web-based application. This intercepting proxy
    is a tool which nearly all web hacking tools provide. How does it work, though?


    At the foundation of all web transactions, there is an application hosted on a
    web server. Its purpose is to accept your browser requests and display the pages
    according to these requests. The requests contain a series of variables which
    determine the page that should be returned to the browser. For instance, whenever
    you are doing some online shopping, these variables dictate what you added to
    your shopping cart and which payment information to retrieve. As a hacker or penetration
    tester, you can take advantage of these variables, because with a web-hacking
    tool you can modify them. This means that you can create new variables, edit the
    existing ones, or delete them entirely.


    # Finding All the Web Pages


    When you prepare for a web-based attack, you need to first prepare the battlefield.
    This is done with tools that give you the ability to find all the relevant pages,
    directories, and files that are part of the target web application. The tool that
    provides this functionality is known as a “spidering” program. All you need to
    do is insert the web page’s URL and the spider will be unleashed. It sounds pretty
    dramatic, but you have to understand that this web information gathering method
    is not subtle.


    The tool will make thousands of website requests at a time. The spider will receive
    HTML code every time it makes a request. That code is analyzed, and if more web
    links are uncovered, the spider will send more requests to all of those links.
    Eventually, all the website’s information will be analyzed and cataloged by the
    spider. Web requests will be sent until every attack field is discovered. However,
    keep in mind that the spider will follow absolutely every link it finds. This
    includes any logging out links. When that happens, the spider will actually log
    out of the website without letting you know. This means that if you aren’t careful,
    you might to lose out on potentially valuable information that wasn’t discovered
    because of the log out link. Always analyze the content that was spidered to make
    sure all the areas you are interested in were explored.'
