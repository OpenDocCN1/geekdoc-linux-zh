  md: '# Chapter 11  Hacking - The Effects Everyone Suffers From


    As the public sees it, many of the effects of hacking are going to be bad because
    the public doesn’t always see that hacking can be good.


    There are pros and cons to everything and hacking is truly no different. When
    you hack someone, you are always leaving them open to the malicious effects of
    what hacking brings about whether you mean to or not.


    When you do hack a computer, you are creating a breach in the computer’s security.
    This is placing the victim’s sensitive data and privacy at risk. These hacking
    activities are usually done to gain access to confidential information that one
    tends to keep on their networks such as social security numbers, bank account
    data, credit card numbers, and personal photographs. There are a few hackers that
    tend to use this information to harm the one that they have hacked. Then, there
    are others who simply “take” this information to prove to their “victim” the major
    security issues that they have to get them to be fixed so that the personal and
    sensitive information that they have taken cannot be taken again.


    Once a computer’s security system has been compromised, there is also the possibility
    of the loss or even manipulation of data. A hacker can go in and delete any sensitive
    information that has been placed on a network once they have gained access to
    it. Once your system has been hacked, you’re at a great risk for all the data
    that you have on your computer being lost or manipulated in a way that can and
    most likely will harm you.


    One of the biggest things that everyone associated with hackers is identity theft.
    Identity theft is when someone who is not authorized takes your identity. Your
    identity is but not conclusive to your social security number, date of birth,
    or anything else that would identify you as you. This is usually done with a malicious
    intent and used for the hacker’s personal gain or interest.


    When you’ve been hacked, the hacker can track everything that you do on your computer
    thanks to the advances in technology. The key-logging software is what is used
    to track every keystroke that you make on your computer. Thanks to this software,
    a hacker can instantly gain access to your passwords, your bank accounts, and
    anything else that they can use to harm you, all thanks to one little program.'
