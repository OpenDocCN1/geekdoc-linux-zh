  md: '# Chapter 7 Types of Penetration Testing


    Penetration testing helps test for weaknesses in a computer''s security system.
    Usually, this vulnerability may be as a result of backdoors in the systems, errors
    in the software, or using the software in an intended way. Penetration testing
    aims to find these vulnerabilities and provide information on how to correct the
    situation.


    When choosing the type of penetration testing, you need to be directed by the
    goals and the scope of the testing. There are three main types of penetration
    testing that you can choose from. These types include:


    +   - White Box Penetration Testing

    - Black Box Penetration Testing

    - Grey Box Penetration Testing


    Black Box Penetration Testing


    Black box penetration testing simulates a real world cyber-attack where the attacker
    is not privy to all the ins and out of the computer system being tested. In black
    box testing a similar scenario happens, the tester is only given the IP and a
    few other important pieces of information and then asked to gather the information
    on his/her own and then test the system. The penetration tester is not provided
    with the programming codes or any other information that might be available to
    an insider.


    Due to lack of inside information, this kind of penetration testing may take a
    longer period of time to uncover vulnerabilities and risks within a given computer
    system. Quite often the tester will have to try out several approaches before
    uncovering anything. Because of this, sometimes the black box penetration testing
    is referred to as "trial and error" testing.


    Advantages


    The following are some of the important advantages of black box testing:


    +   - The tester gets the real weaknesses a black hat hacker will attack and this
    makes it possible to securely protect a computer system from such attacks.

    - The result of this testing helps verify the discrepancies between the specification
    of the system and the actual'
  merge: -1
  pgno: 38
- img_proc: true
  md: 'system.


    +   - One does not require to be an expert to do it


    # Disadvantages


    The disadvantages of black box penetration testing include:


    +   - The test is difficult to design as it is more of a trial and error process

    - It consumes a lot of time

    - May not capture all the issues in the system


    # *White Box Penetration Testing*


    In white box penetration, the tester is aware of all the ins and outs of a given
    computer system. In fact, the tester may have access to the architecture and the
    source code of the application being tested and other important details only an
    insider can have. Because of this information available to the penetration tester,
    this test does not take a lot of time when compared to the black box testing.


    White box penetration testing is a simulation of an insider attack. Because of
    this, the result of the testing will be more effective when it comes to beefing
    up the security of the system against insider attacks, although may also provide
    important suggestions for protection against external attacks.


    # *Advantages*


    Advantages of the white box testing include:


    +   - It covers all the areas of the system being tested

    - It makes it easy to verify logic decisions when carrying out the exercise

    - It covers both the typographical errors associated with vulnerability and also
    the syntax checking


    # Disadvantages


    The disadvantages of white box penetration testing include:'
  merge: -1
