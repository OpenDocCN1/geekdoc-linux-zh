    # Chapter 7 Types of Penetration Testing


    Penetration testing helps test for weaknesses in a computer''s security system.
    Usually, this vulnerability may be as a result of backdoors in the systems, errors
    in the software, or using the software in an intended way. Penetration testing
    aims to find these vulnerabilities and provide information on how to correct the
    situation.


    When choosing the type of penetration testing, you need to be directed by the
    goals and the scope of the testing. There are three main types of penetration
    testing that you can choose from. These types include:


    +   - White Box Penetration Testing

    - Black Box Penetration Testing

    - Grey Box Penetration Testing


    Black Box Penetration Testing


    Black box penetration testing simulates a real world cyber-attack where the attacker
    is not privy to all the ins and out of the computer system being tested. In black
    box testing a similar scenario happens, the tester is only given the IP and a
    few other important pieces of information and then asked to gather the information
    on his/her own and then test the system. The penetration tester is not provided
    with the programming codes or any other information that might be available to
    an insider.


    Due to lack of inside information, this kind of penetration testing may take a
    longer period of time to uncover vulnerabilities and risks within a given computer
    system. Quite often the tester will have to try out several approaches before
    uncovering anything. Because of this, sometimes the black box penetration testing
    is referred to as "trial and error" testing.


    Advantages


    The following are some of the important advantages of black box testing:


    +   - The tester gets the real weaknesses a black hat hacker will attack and this
    makes it possible to securely protect a computer system from such attacks.

    - The result of this testing helps verify the discrepancies between the specification
    of the system and the actual'
  - '[PAGE 39]


    system.


    +   - One does not require to be an expert to do it


    # Disadvantages


    The disadvantages of black box penetration testing include:


    +   - The test is difficult to design as it is more of a trial and error process

    - It consumes a lot of time

    - May not capture all the issues in the system


    # *White Box Penetration Testing*


    In white box penetration, the tester is aware of all the ins and outs of a given
    computer system. In fact, the tester may have access to the architecture and the
    source code of the application being tested and other important details only an
    insider can have. Because of this information available to the penetration tester,
    this test does not take a lot of time when compared to the black box testing.


    White box penetration testing is a simulation of an insider attack. Because of
    this, the result of the testing will be more effective when it comes to beefing
    up the security of the system against insider attacks, although may also provide
    important suggestions for protection against external attacks.


    # *Advantages*


    Advantages of the white box testing include:


    +   - It covers all the areas of the system being tested

    - It makes it easy to verify logic decisions when carrying out the exercise

    - It covers both the typographical errors associated with vulnerability and also
    the syntax checking


    # Disadvantages


    The disadvantages of white box penetration testing include:'
- md: '- It only looks at the system securities from an insider''s point of view.

    - Since the tester has all the information, he may be biased in choosing areas
    to test.


    ## Grey Box Penetration Testing


    This type of testing is a combination of both the white box and the black box
    penetration testing. It is considered to simulate an attack by a hacker who has
    some inside information about the system. The penetration tester is given only
    limited information about the application being tested so as to get started.


    With only partial information on the system being tested given, a penetration
    test can use both automated and manual testing processes. The tester may start
    with automated testing using the information given, then work using manual for
    areas he is not quite clear. This system can yield results from both the outsider
    and the insider perspective and thus help strengthen the security of a computer
    system against attacks from both sides.


    ## Advantages


    Advantages of gray box penetration testing include:


    - Because of the limited information given, the tester is unbiased and non-intrusive.

    - There is no contact between the penetration tester and the developer, and thus
    there is no risk of personal conflict.


    ## Penetration Testing Teams


    Quite often a number of people team do penetration testing for any given system,
    especially when working on a large complex computer system. These teams are of
    different types depending on how team members do their work. The following are
    the three main types of penetration testing teams:


    - The Blue Team

    - The Red Team

    - The Purple Team


    *The Red Team*


    This is a team made up mainly of individual penetration testers. The team''s main
    goal is to simulate an attack and find vulnerabilities and risks within a given
    computer system. Their job also entails compiling and making suggestions of the
    best possible solutions to the identified risks and vulnerabilities.


    *The Blue Team*


    Blue team is often considered as the insiders'' team. It is made up of computer
    security experts from within a given organization. Its main job during penetration
    testing is to repel any form of attack from the red team. People participating
    in this team have full knowledge on the system and work together to protect it
    from any form of attacks.


    In an actual work situation, the red and the blue team work as if they were the
    two sides of the same coin. Because of this, the teams need to work together to
    protect the computer systems they are working on. This requires sharing of feedback
    and working proactively to develop new solutions to the systems.


    *The Purple Team*


    The Purple Team is the combination of both the blue and the red team. The main
    job of this team is to act as a link in between the red and the blue teams. The
    purple team acts on the suggestions of the red team to enhance the security tactics
    employed by the blue team. This helps build a cohesive working environment so
    as to ensure that all the security loopholes within a given system are patched.
    At the same time, the purple teams work with the two teams to develop new solutions
    to ensure that the computer system is prepared for advanced types of attacks.


    *Key Areas of Penetration Testing*


    The following are three important areas where penetration testing often takes
    place:


    *Network Penetration Testing*


    Here the penetration tester tests both the physical structure and the network
    infrastructure to find out if there are risks and vulnerabilities in the system.
    The tester will have to put the physical structure to test first to find out if
    it has issues that may expose the network to security threats. In addition, the
    penetration tester has to test the design, operation, and implementation of the
    network to find out if there are security risks and vulnerabilities that need
    to be corrected.


    ## *Application Penetration Testing*


    Here the logical structure of the given application has to be tested. The testing
    here is simulated as attacks aimed at finding risks and vulnerabilities in the
    security controls of a given computer application. This testing is focused on
    applications such as firewalls and other software used to protect a given computer
    system. This is important because no security application is perfect at all the
    times, it is, therefore, important to find out vulnerabilities and risks so that
    you can beef up security by combining several complimentary security control applications.


    ## *The Workflow or Response of the System*


    This testing focuses on the response to social engineering type of computer security
    threat. Computer security does not work by itself, it needs human interaction
    for it to be 100% perfect. This penetration testing looks at how the people in
    a given organization interact with their computers and how they are prepared to
    prevent attacks. The testing also looks at the design of the workflow and how
    such a design can affect the security of the computer system.


