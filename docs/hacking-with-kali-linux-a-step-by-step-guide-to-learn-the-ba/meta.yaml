    the system, exposing him to being discovered or leaving traces of his presence.
    However, the networked nature of most computers and information technology provides
    safer, less conspicuous avenues to exploitation – the network.


    In general, a network is any collection of interconnected parts. There are networks
    of people, organizations, political states, machines, and just about any group
    of entities in which information passes between members. Computer and IT networks
    have grown and combined to connect billions of nodes, from small household networks
    with one or two personal computing devices to enormous server farms that require
    their own powerplants.


    Whether sending contact information from one smartphone to another with a bluetooth
    connection, or streaming a movie through the internet from Moscow to Buenos Aires,
    the basics of networking and communication are the same. Understanding computer
    networking and communication protocols is essential to becoming an effective hacker.


    # Network Components and Architecture


    Any device capable of some sort of connectivity can comprise a node on a network.
    Traditional user platforms like servers, desktop PCs, laptops, tablets, and personal
    handheld devices such as smartphones are common on networks. There are also an
    increasing number of networked peripherals and standalone smart appliances like
    printers, televisions, gaming platforms, network cameras, entertainment consoles,
    audio devices and watches. Each device can typically connect to multiple other
    devices through various communication media. Physical connections like copper
    wiring and fiber optic cable serve as a backbone to the global internet, and connect
    most networks up to the main access point of a local area network. Within a LAN,
    any number of connection types may exist, including physical wiring and Wi-Fi.
    At short ranges, devices may connect'
  - '[PAGE 18]


    through Bluetooth or Near-Field Communication (NFC) technology. Alongside of this
    architecture is a growing broadband cellular network that consists of any array
    of radio-frequency towers that are connected to the Internet backbone and to various
    satellites. As broadband cellular technology improves, usage is expanding beyond
    telephones and are becoming the primary internet access methodology for many individual
    devices and small networks.


    # **Network Models and Protocols**


    Regardless of the type of node or communication medium, two devices must communicate
    using some sort of common protocol. A standard protocol used by all devices across
    a network is necessary to prevent miscommunication. Internet Protocol (IP) had
    been around since the earliest days of networking. Although it has changed a bit
    in form and function, it remains the de facto standard for network communication.
    IP, combined with another standard known as Transmission Control Protocol (TCP)
    forms a layered networking paradigm called TCP/IP. This scheme divides a network
    into various layers from the basic network hardware up to the user application.
    The collection of protocols is a conceptual network communication model known
    as the TCP/IP model, or TCP/IP “stack”. There is another model known as the Open
    Systems Interconnection (OSI) model, which is more granular with regard to the
    number of layers. The OSI model can be more generally applied, but it describes
    the same essential principles as the TCP/IP model.


    # The TCP/IP Model


    The TCP/IP model consists of four, stacked, conceptual layers that each have a
    role to play in the preparation and transport of data from one point in a network
    to another. These are the application, transport, network, and data link (or link)
    layers.


    # Network Data Flow in Layers (infosecinstitute.com)


    The application layer of the TCP/IP stack (considered the “top” layer) is the
    layer most visible and accessible to the user. This is the layer where the content
    or payload of a communication is created before it is packetized for transport.
    Email clients, web browsers, file sharing'
  - '[PAGE 19]


    software, video streaming applications and other connected apps all operate in
    the application layer. It''s worth noting that the application layer executes
    other protocols that reside within (or above) TCP/IP. This includes the hypertext
    transfer protocol (HTTP) of web applications, smtp for email, and File Transfer
    Protocol (FTP) among others.


    Functioning in the transport layer is an advanced concept, but suffice it to say
    that this layer helps to ensure the quality of communication through error checking
    and other means. Additionally, the transport layer is where information passed
    from an application is initially divided into packets, which are then appended
    with appropriate headers. TCP operates at this level, but it is not the only protocol
    available. User datagram protocol, or UDP is used when it is necessary to sacrifice
    the successful arrival of a small number of packets in exchange for real-time
    delivery of information. UDP is the transport protocol of choice for audio and
    video streaming.


    The network layer, often called the Internet layer, is where the work of routing
    packets is done. In this layer, the best network route for a packet is determined,
    then the packet header is appended with a source and destination IP address before
    it is relayed to the network interface hardware. There are other protocols that
    can operate at this layer, but IP is by far the most prevalent, and is the underlying
    structure for most global data communication. The manipulation of IP headers at
    various stages of transit is the basis for many hacking attacks.


    The bottom layer of the TCP/IP model is the hardware or data link layer. The hardware
    layer is the last stop of a data packet before it leaves its source machine and
    arrives at its next destination through the physical medium. The MAC addresses
    of the network hardware involved in relaying the packet are appended to the packet
    header at this level.


    # Network Protocols


    When one node in a network communicates with another, it divides its message into
    small, independent packets. Each packet is then appended with a header as it passes
    through each layer so it can be properly reassembled into a message at its destination.
    The beauty of TCP/IP is that each individual packet may take a different route,
    and can be re-sent if lost, assuring a high degree of efficiency and message fidelity.'
- md: 'At the heart of TCP/IP is the IP address. Each device on a network has a unique
    address to identify its location within the network and any subnetworks to which
    it belongs. Understanding IP addressing allows hackers to zero in on particular
    targets. In addition, hackers may need to hide or manipulate their own IP address
    in order to remain inconspicuous.


    The standard version of IP has been IP v4 for many years and is used on most networks
    and devices. IP v6 is a new standard that can accommodate many more addresses.
    Within an individual LAN, the first octet in an IP address typically indicates
    the designation of the overarching network, with subsequent octets designating
    subnetworks and individual machines.


    ## IP Address Notation


    One of the most important things to understand about IP addressing is that the
    IP address of a given node within a local network is different than the one assigned
    to it when it communicates through the Internet. This is because it''s impossible
    to control or prevent two individual machines on separated networks from accidentally
    or intentionally being given the same address.


    From the hacker''s perspective, IP addresses provide a roadmap on any individual
    network to identify and distinguish individual machines. Additionally, there is
    much to be gained by intercepting individual data packets in transit on the network.
    The header information in the packet contains the IP address of both the source
    and the destination. It is the manipulation of these headers that allows hackers
    to conduct man-in-the-middle and denial of service attacks.


    IP addresses are considered logical addresses, meaning they are assigned via software,
    either directly by the user or automatically through some kind of process. IP
    addresses reside on the network layer. In many cases, IP addresses can be spoofed
    or forged in a packet header. This can be done to obfuscate the source of an email
    or some other attack payload, or to maliciously reroute packets.


    It''s important to understand that IP forging cannot be used to hide any two-way
    communication. In order for two machines to exchange information, their addresses
    must be valid or the packets being exchanged cannot reach their destinations.
    This is why it is futile to try to hide or change one''s IP address when operating
    on a peer-to-peer service, or to hide the destination of a downloading node. The
    best one can hope for in this scenario is to route information through a large
    number of geographically and logically distinct proxies. The TOR network, which
    serves as a basis for the Dark Web, operates by creating multiple layers through
    which information can pass.


    Another important type of device identifier is the Media Access Control (MAC)
    address. MAC addresses are considered permanent physical addresses and are assigned
    to individual network interface devices. The MAC addressing scheme is designed
    so that no two devices should, in theory, ever have the same designation. The
    address is burned into the device ROM so that it cannot be easily changed. MAC
    addresses are part of the data link layer.


    Although MAC addresses are intended to be permanent, there are ways to "spoof"
    an address by writing a false address onto a packet header. This does not change
    the permanent address of a device, but allows a hacker to avoid being identified
    through their network interface. If an attacker with a spoofed MAC gains local
    access to a network, especially through wireless means, they can avoid being traced
    through their hardware.


    ## Chapter 4 VirtualBox & Kali Linux Installation


    ### Virtualization


    What is virtualization? This is the ability to run an operating system with all
    its installed software in a specialized environment.


    Let us use an example for a better understanding. Assume that I have a computer
    running on Windows 10; this will be our "host". Using virtualization software,
    I can run a "guest" operating system on our host computer. Let''s assume our guest
    system is Windows XP. This means that we can run two or more operating systems
    at the same time.


    The guest (Windows XP) will think it is running independently on a real machine
    while in reality, it is on software on our host machine (Windows 10).


    ### VirtualBox


    Oracle VM VirtualBox is free software that is used for virtualization. It is easy
    to use and is available for Windows, Linux, Macintosh, and Solaris operating systems.
    Just download it from [here](http://here) then click the downloaded executable
    to install. Just click on the "Next" button on installation and give it the necessary
    permissions.


    I will be installing and using it on a Windows 7 operating system. VirtualBox
    works the same way regardless of which operating system you are using. If you
    encounter any troubles while installing the software please feel free to consult
    the user manual by clicking [here](http://here).


    After installation, once you click it, you will get a window that looks something
    like this.


    We can now download the VirtualBox extension pack for additional features. You
    can download it from the VirtualBox website. To install the extension pack just
    go to where the downloaded file is and click it, a VirtualBox window will appear
    asking if you want to install the extension pack.


    ### Kali Linux


    This is because it comes with a wide range of hacking software but we will focus
    only on the network hacking parts only.


    Kali Linux is free and can be downloaded from the Kali website [here](http://example.com).
    However, there is a version of Kali Linux that is suitable for use in VirtualBox
    that you can download [here](http://example.com) (please make sure you select
    the VirtualBox image and not the VMware one), this is the one that we will use
    since it is simple to install compared to the other images.


    You will be given a torrent file that you will use to download the Kali Linux
    file, so make sure you have software for downloading torrents.


    After using the given torrent to download the Kali Linux VirtualBox file, we can
    now get to install the OS on VirtualBox. In order to do so, just simply click
    the downloaded Kali Linux VirtualBox file. A VirtualBox window will appear that
    looks something like this.


    Now let us change a few things before we click the import button. If you scroll
    down you will find that CPU is set to 4, you can leave it that way depending on
    the type of processor you have on your computer but Kali Linux can still run on
    1 so feel free to change it. If you have the latest processors on your computer,
    you can leave it at 4.


    Under the CPU option, you will find the amount of RAM allocated to it is 2048
    MB. This will do just fine but you can increase it if you have a high amount of
    RAM on your device or reduce it to 1024 MB which will still work.


    The base folder is where the disk image for your virtual machine will be set.
    You can just leave it to the default or change it to another location you find
    comfortable with. The disk image will take about 10 to 15 GB of space.


    In the MAC Address Policy change it to "Generate new MAC addresses for all network
    adapters" as shown below.


    Once everything is set, you can click the import button at the bottom of the window.
    It will take some time for the image to be imported. After that, we can fire up
    Kali Linux.


    Your virtual machine will now appear at the top-right of the VirtualBox window
    as shown below in the red area.


    If you click on it once, you''ll see a new window with a bar on top that has buttons
    for settings, start and discard. Click on the settings button, you should see
    a window similar to the image below.


    Head over to the Network window and change the Attached to setting from NAT to
    NAT Network as shown below, this will allow our virtual machine to access the
    internet.


    Click on the OK button to save the settings. We can now go ahead and run our Kali
    Linux machine. Click on the virtual machine and then click on the start button.
    Give it a minute or two to start.


    ## Kali Linux Basics


    If the machine starts correctly, you should be asked for a username. The default
    username for Kali is *root* and the default password is *toor*. Once you have
    entered the username and password, the Kali Linux home window will appear. You
    switch to full screen by pressing *right ctrl + F*.


    In order to properly use Kali Linux, you will have to learn how to use terminal
    commands. Head over to the taskbar on the left side of the screen and click on
    the terminal icon as shown below to open the terminal.


    A terminal will open, which just looks like a black window with a blinking white
    cursor. Let us now take a look at some common commands that will be used from
    time to time.


    | Command | Use |

    | --- | --- |

    | apt update | Update old programs. |

    | apt-get install \<package\> | Install a specific package \<package\> = package
    name |

    | clear | Clear the terminal window |

    | git clone \<link\> | Install a package from GitHub |

    | mkdir \<name\> | Create a new directory |

    | rm \<file name\> | Remove a file |

    | cp \<file name\> | Copy a file |

    | ls | List the files and folders in a directory |

    | cd \<directory path\> | Navigate to a certain directory |'
