- md: 'Chapter 11  Hacking - The Effects Everyone Suffers From


    As the public sees it, many of the effects of hacking are going to be bad because
    the public doesn''t always see that hacking can be good.


    There are pros and cons to everything and hacking is truly no different. When
    you hack someone, you are always leaving them open to the malicious effects of
    what hacking brings about whether you mean to or not.


    When you do hack a computer, you are creating a breach in the computer''s security.
    This is placing the victim''s sensitive data and privacy at risk. These hacking
    activities are usually done to gain access to confidential information that one
    tends to keep on their networks such as social security numbers, bank account
    data, credit card numbers, and personal photographs. There are a few hackers that
    tend to use this information to harm the one that they have hacked. Then, there
    are others who simply "take" this information to prove to their "victim" the major
    security issues that they have to get them to be fixed so that the personal and
    sensitive information that they have taken cannot be taken again.


    Once a computer''s security system has been compromised, there is also the possibility
    of the loss or even manipulation of data. A hacker can go in and delete any sensitive
    information that has been placed on a network once they have gained access to
    it. Once your system has been hacked, you''re at a great risk for all the data
    that you have on your computer being lost or manipulated in a way that can and
    most likely will harm you.


    One of the biggest things that everyone associated with hackers is identity theft.
    Identity theft is when someone who is not authorized takes your identity. Your
    identity is but not conclusive to your social security number, date of birth,
    or anything else that would identify you as you. This is usually done with a malicious
    intent and used for the hacker''s personal gain or interest.


    When you''ve been hacked, the hacker can track everything that you do on your
    computer thanks to the advances in technology. The key-logging software is what
    is used to track every keystroke that you make on your computer. Thanks to this
    software, a hacker can instantly gain access to your passwords, your bank accounts,
    and anything else that they can use to harm you, all thanks to one little program.


    DOS means denial of service attack. This happens when a hacker gets into your
    network and your computer. This can make the computer''s resources unavailable
    to any of the authorized users. Usually, a DOS will attack a website which will
    then make the website unavailable for a long period of time. This then causes
    the users of the website to be inconvenienced—as well as hampering with the business
    of the website.


    Along with identity theft, stolen information is a big thing that happens when
    someone hacks your network for a malicious reason. This can be hazardous to anyone,
    but most particularly to business that ends up being hacked because the sensitive
    information that they do not want getting out to the public is then released.
    Not only that, but email addresses, client information, so on and so forth can
    be stolen and compromised.


    National security can even be put at risk when it comes to hacking. Hackers who
    hack into the government''s networks then have access to the defense system as
    well as many other systems that will cause there to be grave consequences on the
    welfare of the nation. When someone hacks into the government, not only is the
    nation''s security at risk but so is the well-being of the citizens of the United
    States.


    Another effect of hacking is fraud. Hackers can turn computers into zombies by
    infecting them with internet enabled computer viruses. These computers are then
    used for activities that are considered fraud such as spamming and phishing attacks
    on other networks.


    How do you know when you have been hacked? Your computer will most likely decrease
    in its performance speed. You may also begin to notice files that are not supposed
    to be there. These files may increase in size as well as be modified without you
    ever touching them. You may also begin to notice that there are changes in your
    network settings or even frequent disk crashes.


    The only way that you''re going to be able to protect your computer is by installing
    a reliable antivirus software as well as making sure that your firewall is enabled
    before you begin to connect to the internet. Also, make sure that you install
    the system updates on a regular basis.


    on the exam was pretty familiar already, so basically nothing like I never heard
    of, but maybe I didn''t take enough notes from the book.


    So I said: I would give it a go again. So, I started reading the book for the
    third time. This time, I knew so much, I finished the book within two weeks. I
    skipped all those I have highlighted before. Also went back to my notes, and I
    kept on reading those, but since I failed the first time, four weeks after, I
    have rebooked the next exam. So I went and tried for the second time right? I
    remember I was so confident, I felt very positive about passing the exam, but
    when I got to the exam center, I started sweating and didn''t feel well. It''s
    always the same ever since by the way.


    Anyhow, I started the exam, the timer began to count backwards, like in any other
    Cisco exam I tested since. I felt like I had it all. It felt like I am going to
    pass it with no mistakes. Am I going to score 1000 points out of 1000 right? Wrong!
    Guess what! I have failed again. This time, the passing score was 820, but my
    score was 790 only. I got angry, because they never tell you which question you
    didn''t know. All they provide is an exam score and which topics on average I
    scored how much in terms of percentage.


    It''s still the same, and I don''t think they intend to change the way, this is
    why Cisco Certifications hard to get. They make it hard for a reason. Whatever.
    Cisco and their games, it''s always the same. The books are expensive; the courses
    are expensive, the exam fees are crazy expensive, routers, switches, firewalls,
    anything that the brand Cisco written on, it''s not cheap. My friend told me about
    the website, called CBT Nuggets, he said I am very close to passing the exam and
    don''t give up. All I have to do, is watch the CBT Nuggets video training related
    to CCNA, and I am going to be ok for the next exam. He was right, I watched the
    CBT nuggets course for ICND1, and a week later I passed the exam! This time the
    passing score was high as the first time went: 839, and I passed it with a huge
    score of 842! ☺ Just about. But, a pass is a pass! If the passing score is 839,
    and you pass with the score of 840, it''s going to give you the same certification
    as you would pass the exam with the score of 1000. In the other hand, if you score
    838, when the passing score is 839, it''s a fail, same like you would have no
    points achieved whatsoever.


    Another tip btw, if you want to know what they ask in any Cisco exam, I can tell
    you exactly what you need to know. Trust me! I have been over 12 Cisco exams.


    Now that you know what you need to study, and how to get it done, let me break
    it down to you once again. In summary, all you have to do, is break it down. That''s
    it, that''s the secret, and here is why. If I tell you that you have to read 1000
    pages, (ICND1 books are now over 1000 pages by the way) you going to be like,
    ''common man!, I don''t have time for that!'' Sure, I know, I heard it all, but
    here is the thing. Once you break it down to small chunks, it will sound so much
    easier. For example, you have 1000 pages to read. Don''t think like you have to
    read it all in a day, you won''t be able to do it. If that''s your plan, I find
    it unrealistic. You have to be realistic here, so here is what you can do. Plan
    to read every day 20 pages, so you know that you will finish the book in 50 days
    right?


    Some days you might be able to read even 25 or 30 pages, which is a bonus for
    you. Maybe on Friday night, you should read 40 pages, and Saturday morning read
    another 40 pages, so if you go out on a Saturday night, and you suffer from a
    hangover on Sunday, and you are unable to read even a page, you are still ahead
    of your plan! Should you skip the Monday too? No!


    From personal experience, I can tell you that skipping more than a day without
    studying, like two or three days, it''s going to be more difficult to get back
    to it. Seriously! How long is going to take to become a Cyber Security Specialist?
    Honestly? I don''t know; everyone is different. But I take it as you have no background
    knowledge at all, and no experience, if you are persistence and start studying
    every day at least two hours, you can become a cybersecurity specialist within
    5 years easy!


    Give or take a few years, but if you can afford to study every day for about 4
    hours, you can reduce the time, for probably about three years. It doesn''t mean
    that in 3 years you 100% became a Cybersecurity specialist, but you will increase
    your chances.'
  mdcn: '

    第11章　黑客攻击——人人都会遭受的影响


    在公众看来，黑客攻击的许多影响都是负面的，因为公众并不总是能看到黑客攻击也有积极的一面。


    凡事都有利弊，黑客攻击也不例外。当你入侵他人时，无论你是否有意，你总会让他们暴露在黑客攻击所带来的恶意影响之下。


    当你入侵一台计算机时，你实际上是在突破计算机的安全防线。这将使受害者的敏感数据和隐私面临风险。这些黑客活动通常是为了获取人们倾向于存储在网络中的机密信息，例如社会安全号码、银行账户数据、信用卡号码和个人照片。有些黑客倾向于利用这些信息来伤害被他们入侵的对象。还有一些黑客则只是"获取"这些信息，以向他们的"受害者"证明存在的重大安全问题，促使他们修复这些漏洞，从而防止他们已经获取的个人敏感信息再次被盗。


    一旦计算机的安全系统被攻破，数据还有可能丢失甚至被篡改。黑客一旦获得访问权限，就可以进入网络删除存储在其中的任何敏感信息。一旦你的系统被入侵，你计算机上的所有数据都面临着极大的丢失或被篡改的风险，这种篡改可能会且极有可能会对你造成伤害。


    人们与黑客联系最密切的事情之一就是身份盗窃。身份盗窃是指未经授权的人冒用你的身份。你的身份不仅仅局限于你的社会安全号码、出生日期或其他任何可以证明你身份的信息。这种行为通常带有恶意，用于黑客的个人利益或目的。


    当你被入侵后，黑客可以借助技术的进步追踪你在计算机上的一切操作。键盘记录软件被用来追踪你在计算机上敲击的每一个按键。多亏了这种软件，黑客可以立即获取你的密码、银行账户信息以及任何其他可以用来伤害你的信息——所有这些都只需一个小小的程序。


    DOS是指拒绝服务攻击。当黑客入侵你的网络和计算机时就会发生这种情况。这会导致授权用户无法使用计算机的资源。通常，DOS攻击会针对某个网站，导致该网站长时间无法访问。这会给网站用户带来不便，同时也会影响网站的正常运营。


    与身份盗窃一样，信息泄露也是有人出于恶意入侵你网络时经常发生的事情。这对任何人都可能造成危害，但尤其对那些最终被入侵的企业危害最大，因为它们不想公开的敏感信息会被泄露出去。不仅如此，电子邮件地址、客户信息等等也可能被盗取和泄露。


    在黑客攻击方面，国家安全甚至也会面临风险。入侵政府网络的黑客可以接触到国防系统以及许多其他系统，这将对国家的安全福祉造成严重后果。当有人入侵政府系统时，不仅国家安全面临风险，美国公民的福祉也同样面临威胁。


    黑客攻击的另一个影响是欺诈。黑客可以通过让计算机感染联网病毒，将其变成"僵尸"计算机。这些计算机随后被用于被认为是欺诈性的活动，例如向其他网络发送垃圾邮件和网络钓鱼攻击。


    你如何知道自己被入侵了？你的计算机性能速度很可能会下降。你可能还会开始注意到出现了一些不该存在的文件。这些文件的大小可能会增加，也可能在你从未操作过的情况下被修改。你还可能开始注意到网络设置发生了变化，甚至是频繁的磁盘崩溃。


    保护计算机的唯一方法是安装可靠的杀毒软件，并确保在连接互联网之前启用防火墙。此外，请确保定期安装系统更新。


    考试内容我已经很熟悉了，基本上没有什么是完全没见过的，但也许是我没有从书上做足够的笔记。


    所以我说：我愿意再试一次。于是，我第三次开始阅读那本书。这一次，我已经掌握了很多知识，两周内就读完了全书。我跳过了所有之前已经标记过的部分。同时我也回顾了笔记，并持续阅读那些内容。但由于第一次考试失败了，四周之后我重新预约了下一次考试。于是我第二次去参加了考试，对吧？我记得我当时非常自信，觉得自己通过考试没什么问题，但当我到达考试中心时，我开始出汗，感觉不舒服。顺便说一下，从那以后每次考试都是这样。


    不管怎样，我开始答题了，倒计时开始，就像此后我参加的所有其他思科考试一样。我觉得所有题目都会做。感觉我会零失误通过考试。我是不是能拿满分1000分中的1000分呢？错！你猜怎么着？我又失败了。这一次的通过分数是820，而我的成绩只有790。我很生气，因为他们从来不会告诉你哪道题做错了。他们只提供一个考试分数，以及各个主题的平均得分百分比。


    情况还是一样，我不认为他们打算改变这种方式，这就是为什么思科认证这么难拿到。他们刻意让它变难。无所谓了。思科和他们的套路，永远都一样。书很贵，课程很贵，考试费用贵得离谱，路由器、交换机、防火凡，任何印着思科品牌的东西都不便宜。我朋友告诉了我一个叫CBT
    Nuggets的网站，他说我离通过考试已经很近了，不要放弃。我所要做的就是观看CBT Nuggets上与CCNA相关的视频教程，下次考试就没问题了。他说得对，我看了CBT
    Nuggets的ICND1课程，一周后我就通过了考试！这一次的通过分数和第一次一样高：839，而我以842分的高分通过了！☺ 刚刚好。但是，通过就是通过！如果通过分数是839，你以840分通过，你获得的证书和以满分1000分通过是一样的。另一方面，如果通过分数是839，你得了838分，那就是没通过，和你一分没得是一样的。


    顺便再说一个建议，如果你想知道思科任何考试会考什么，我可以准确地告诉你需要掌握哪些内容。相信我！我已经考过12次以上的思科考试了。


    现在你已经知道需要学习什么以及如何完成了，让我再给你梳理一遍。总结来说，你要做的就是把大任务拆解成小块。就是这样，这就是秘诀，原因如下。如果我告诉你必须读1000页（顺便说一下，ICND1的教材现在已经超过1000页了），你会觉得，''拜托！，我没那个时间！''
    当然，我理解，这些我都听过，但问题是，一旦你把它拆分成小块，就会觉得容易得多。例如，你有1000页需要阅读。不要想着一天之内全部读完，你做不到。如果那是你的计划，我觉得不现实。你必须面对现实，所以你可以这样做。计划每天读20页，这样你就知道50天内可以读完，对吧？


    有些日子你可能能读25页甚至30页，这对你来说就是额外的收获。也许周五晚上你应该读40页，周六早上再读40页，这样如果你周六晚上出去玩，周日因为宿醉而一页也读不了，你仍然领先于计划进度！那周一也要跳过吗？不！


    根据个人经验，我可以告诉你，如果连续超过一天不学习，比如两三天，重新进入状态会困难得多。说真的！成为网络安全专家需要多长时间？说实话？我不知道，每个人的情况都不一样。但假设你完全没有背景知识，也没有经验，如果你坚持每天至少学习两小时，你完全可以在5年内成为一名网络安全专家！


    大概左右几年的浮动，但如果你能负担得起每天学习大约4小时，时间可以缩短到大约三年左右。这并不意味着三年后你就百分百成为了网络安全专家，但你会大大增加成功的概率。

    '
