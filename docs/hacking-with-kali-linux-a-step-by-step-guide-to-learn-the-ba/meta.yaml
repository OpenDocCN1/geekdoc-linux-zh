    第一部分是位驱动程序。它有两个主要功能，这就是为什么有时它被实现为两个部分而不是一个。主要功能是一个数据包过滤器。通常在 NDIS、TDI 或两者层上，此驱动程序检查来自网络或传送到网络的每个数据包。这也称为入站和出站连接安全。


    ## 第二章  搭建你的黑客实验室


    在本章中，我们将搭建一个优秀的黑客实验室，你可以在其中进行本书将要进行的所有实践黑客活动。本章解释了为什么拥有一个黑客实验室很重要，以及你应该为高效学习设置哪些最低硬件和软件要求。


