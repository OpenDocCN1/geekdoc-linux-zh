- img_proc: true
  md: '+   - It only looks at the system securities from an insider''s point of view

    - Since the tester has all the information he may be biased in choosing areas
    to test


    # Grey Box Penetration Testing


    This type of testing is a combination of both the white box and the black box
    penetration testing. It is considered to simulate an attack by a hacker who has
    some inside information about the system. The penetration tester is given only
    limited information about the application being tested so as to get started.


    With only partial information on the system being tested given a penetration test
    can use both automated and manual testing processes. The tester may start with
    automated testing using the information given then work using manual for areas
    he is not quite clear. This system can yield results from both the outsider and
    the insider perspective and thus help strengthen the security of a computer system
    against attacks from both sides.


    # Advantages


    Advantages of gray box penetration testing include:


    +   - Because of the limited information is given, the tester is in biased and
    non-intrusive

    - The is not contact between the penetration tester and the develop and thus there
    is no risk of personal conflict


    # Penetration Testing Teams


    Quite often a number of people team do penetration testing for any given system,
    especially when working on a large complex computer system. These teams are of
    different types depending on how team members do their work. The following are
    the three main types of penetrating testing teams:


    +   - The Blue Team;

    - The Red Team;'
  merge: -1
  pgno: 40
- img_proc: true
  md: '+   - The Purple Team


    *The Red Team*

    This is a team made up mainly of individual penetration testers. The teams'' main
    goal is to simulate an attack and find vulnerabilities and risks within a given
    computer system. Their job also entails compiling and making suggestions of the
    best possible solutions to the identified risks and vulnerabilities.


    *The Blue Team*

    Blue team is often considered as the insiders'' team. It is made up of computer
    security experts from within a given organization. Its main job during penetration
    testing is to repel any form of attack from the red team. People participating
    in this team have full knowledge on the system and work together to protect it
    from any form of attacks.


    In an actual work situation, the red and the blue team work as if they were the
    two sides of the same coin. Because of this, the teams need to work together to
    protect the computer systems they are working on. This requires sharing or feedback
    and working proactively to develop new solutions to the systems.


    *The Purple Team*

    The Purple Team is the combination of both the blue and the red team. The main
    job of this team is to act as a link in between the red and the blue teams. The
    purple team acts on the suggestions of the red team to enhance the security tactics
    employed by the blue team. This helps build a cohesive working environment so
    as to ensure that all the security loopholes within a given system are patched.
    At the same times, the purple teams work with the two teams to develop new solutions
    to ensure that the computer system is prepared for advanced types of attacks.


    *Key Areas of Penetration Testing*

    The following are three important areas where penetration testing often takes
    place:


    *Network Penetration Testing*

    Here the penetration tester tests both the physical structure and the network
    infrastructure to find out if there are risks and vulnerabilities in'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'the system. The tester will have to put the physical structure to test first
    to find out if it has issues that may expose the network to security threats.
    In addition, the penetration tester has to test the design, operation, and implementation
    of the network to find out if there are security risks and vulnerabilities that
    need to be corrected.


    # *Application Penetration Testing*


    Here the logical structure of the given application has to be tested. The testing
    here is simulated as attacks aimed at finding risks and vulnerabilities in the
    security controls of a given computer application. This testing is focused on
    applications such as firewalls and other software used to protect a given computer
    system. This is important because no security application is perfect at all the
    times, it is, therefore, important to find out vulnerabilities and risks so that
    you can beef up security by combining several complimentary security control applications.


    # *The workflow or response the system*


    This testing focuses on the response to social engineering type of computer security
    threat. Computer security does not work by itself it needs human interaction for
    it to be 100% perfect. This penetration testing looks at how the people in a given
    organization interact with their computers and how they are prepared to prevent
    attacks. The testing also looks at the design of the workflow and how such a design
    can affect the security of the computer system.'
