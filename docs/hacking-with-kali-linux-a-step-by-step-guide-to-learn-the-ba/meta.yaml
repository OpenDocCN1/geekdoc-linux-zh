    ## 第5章 关键的 Linux 终端命令


    在图形用户界面和鼠标等人机工学输入设备出现之前，计算机用户只能使用键盘和带有提示符的单色屏幕。命令逐行输入，要么即时解释执行，要么批量编译成程序。为了与文件系统或外围设备（通过内核）交互，用户必须使用一套特殊的命令词汇来执行所需操作。实际上，最初的
    Unix 系统启动后会直接进入命令终端（通常是登录提示符）等待输入。尽管大多数现代 Linux 发行版现在启动后会进入图形用户界面，但操作系统底层仍然是 Unix
    终端命令系统。任何 Linux 系统都可以设置为启动后直接进入命令行，但大多数用户如果希望直接输入命令，通常会从图形用户界面的主桌面打开*终端*应用程序。


    尽管“指向并点击”的图形界面方便且通常更直观，但高级 Linux 用户——尤其是黑客——往往更喜欢使用终端来执行命令。手动输入 Linux 命令不仅在许多情况下更高效，还能让用户对操作拥有更直接的控制权。一个正确的、单行的命令可以替代多次点击和嵌套的窗口。此外，通过直接输入命令，用户可以更容易地追溯错误的来源。黑客往往是独立自主的人，他们不愿将机器的控制权交给他人编写的自动化流程。


    本章将讨论如何在 Linux 中通过终端导航，并介绍一些更为关键的 shell 命令。


    ## LINUX 系统剖析


    在进入命令列表之前，了解典型 Linux 发行版的基本结构和文件系统非常重要。其命令库非常强大，几乎可以控制 Linux 系统操作或配置的任何方面。


    ### 架构


    所有 Linux 系统都是从内核开始构建的。内核是操作系统启动时加载到内存中的机器级指令集。内核指令直接与机器的硬件交互，包括处理器、内存、网络接口和任何外围设备。


    Linux Shell（图14）是用户与内核交互的方式。Shell 可以是直接的命令提示符，也可以是图形用户界面。


    Linux 内核架构


    ### 目录系统


    Linux 拥有组织化的目录结构，旨在为文件划分区域以保障安全性和稳定性。目录路径使用正斜杠（/）分隔路径中的后续目录名称，这与 Windows 使用反斜杠（\）不同。术语“根”有时会让
    Linux 初学者感到困惑，因为有几个位置可能被称为根目录。Linux 文件系统中真正的“根”——在其之上没有父目录——仅用一个单独的正斜杠“/”表示。所有其他目录都位于此位置之下。不同
    Linux 发行版中“/”下的目录略有不同，但总体结构继承自最初的 Unix 系统，且基本通用。


    Linux 目录结构


    ### Linux 命令


    Linux 拥有丰富的终端命令集，其中许多命令与最初的 Unix 操作系统中的命令相同或相似。这些命令允许用户管理和操作文件与文件夹、安装软件、与外围设备交互，以及在许多其他任务中执行各种网络操作。尽管本书各章节会结合具体场景介绍
    Linux 命令，但以下基本命令可作为 Linux 基础词汇以及终端命令通用格式和用法的入门介绍。


    #### 目录与文件


    Linux 用户首先应该学习的是与导航和操作目录相关的命令。在终端命令提示符下，以下命令将列出根目录中存在的文件和目录：


    `ls`


    在大多数情况下，默认的终端目录是 `/home/username`，因此输入“ls”将列出当前用户的文件和文件夹内容。


    大多数 Linux 命令具有可附加到默认命令形式的选项。这些选项因命令而异，范围从改变输出格式到指示命令执行其默认不执行的特定功能。ls 命令的“-l”选项就是一个导致更详细输出的命令选项示例。


    请注意，目录列表现在包含了当前目录中每个文件和文件夹的详细信息，包括访问权限、大小和创建日期。选项前面有各种符号（`-`、`--`、`|` 等），具体取决于命令和选项的性质。许多选项可以链接在单个命令中使用，这使它们成为在单行代码中高效完成许多事情的有力方式。


    要显示特定命令的选项以及其他有用信息，可以在命令后附加“--help”。但是，大多数命令的帮助输出有好几页长，在不滚动的情况下无法在终端窗口中查看。添加“|
    more”选项会在输出一页后暂停，允许用户通过按空格键逐页前进，直到输出完成。


    `cd` 命令允许用户将当前活动目录更改为指定位置。除非另有构造，否则给定的路径假定为相对于当前目录。要切换到当前活动路径内的目录，只需在 `cd` 后附加该目录名即可。请注意，Linux
    文件和目录名称区分大小写。


    要切换到不在活动目录中的路径，必须指定绝对路径。


    以下是一些有用的 Linux 目录和文件命令的简短列表。它绝不是完整的列表，但包含了一些最常见的命令。使用其中一些命令时必须小心，因为它们可能会更改或删除文件或文件夹的内容或位置。


    | 命令 | 操作 |

    | :--- | :--- |

    | pwd | 显示活动目录的路径 |

    | ls | 显示活动目录的内容 |

    | cd | 更改活动目录 |

    | mkdir | 创建一个新目录 |

    | rmdir | 删除一个目录（如果为空） |

    | cp | 复制一个文件 |

    | mv | 移动一个文件 |

    | rm | 删除一个文件 |


    ### “超级用户”权限：sudo 命令


    另一个重要的 Linux 命令是大名鼎鼎的“sudo”命令——每个有志成为黑客的人都应该知道。术语“sudo”（据称）是“superuser do”的缩写，它向内核表明后续命令将以
    root 权限（有时是以与当前登录用户不同的用户身份）执行。


    上面，一个用户导航到了另一个用户的 Documents 文件夹，但在尝试删除名为“passwords”的文件时被拒绝了权限。当使用 `sudo` 重新发出该命令时，系统提示用户输入密码，然后
    `rm` 命令成功执行。


    ## 第6章 基于 Web 的利用


    既然你已经了解了网络漏洞攻击的工作原理，现在是时候探索基于 Web 的利用了。如今，一切都以这样或那样的方式连接到互联网，因此 Web 漏洞极其普遍。要找一家没有网络存在的公司是很难的。过去，网站非常基础，仅使用
    HTML 编码，不涉及其他更复杂的编程语言。它们由简单的静态页面组成。然而，今天的网站涉及复杂的编程、混合数据库和身份验证服务器。每种类型的计算机，无论是智能手机还是台式机，都连接到互联网。


    由于向网络世界的这种大量扩展，我们需要理解并进一步发展基于 Web 的利用手段。例如，计算机过去在本地安装和使用文字处理器和其他工具，如 Microsoft
    Office。现在，许多此类工具存在于云端，因此不再需要任何本地安装。一个常见的例子是 Google Docs。现在一切都连接在一起，对于有志成为道德黑客的人来说，充分理解基于
    Web 的利用基础知识非常重要。


    在本章中，我们将讨论 Web 黑客的基础知识以及一些概念，如网络爬虫和代码注入。一如既往，请花时间探索所有技术并练习它们，直到你不再需要使用任何备忘单。


    ### Web 黑客的基础知识


    有许多专为 Web 应用程序黑客设计的基于 Web 的框架和工具。然而，只要你理解了基础知识，使用什么工具其实并不重要，因为它们大多数的工作原理完全相同。目的是拥有攻击
    Web 所需的功能。基本原理是通过你的浏览器像往常一样访问任何网站，但你使用代理来发送流量。这样，你就可以收集并检查你向任何应用程序发送和接收的所有数据。让我们看看为了成为一名有效的
    Web 黑客，你需要从这些工具中获得的一些最重要的功能。


    拦截请求

