    以下是为您的黑客实验室（或您偏好的简约电脑）设置正确软件环境的步骤。


    ## 设置虚拟环境


    从两大主流虚拟化程序 [VMware Workstation](https://www.vmware.com/products/workstation.html)
    或 [VirtualBox](https://www.virtualbox.org/) 中任选其一，然后下载并安装。这两种产品各有优缺点，谨慎起见，您在选择使用哪个系统之前最好做一些简单的研究。软件的下载和安装过程直接明了，对于立志成为黑客的人来说应该不会构成挑战。


    使用这些软件的一大好处是，除了无需额外配备一台电脑外，您还可以在不同模式下运行它们，其中一些模式允许您桥接虚拟网络和真实网络，从而像在真实网络上一样测试您的网络渗透技能。例如，VirtualBox
    就具有 NAT、桥接和内部网络模式，这些模式使得托管操作系统能够像指定类型网络上的一台计算机一样运行。


    在设置虚拟环境时，请密切关注配置细节，例如分配给虚拟机的内存（RAM）容量。分配的内存过少会阻碍虚拟化操作系统的速度和性能，而分配过多则会对宿主操作系统的性能产生负面影响。


    ## 设置 Kali Linux


    虚拟环境正确设置并配置好之后，您就可以从 [kali.org/downloads/](https://www.kali.org/downloads/) 下载
    Kali Linux 了。Offensive Security 每隔几个月就会发布 Kali Linux 的新版镜像文件，但您应该始终下载最新的稳定版本。


    请注意，有多种操作系统选项可供选择：32位或64位，精简版或标准版。与标准版相比，精简版的工具和功能有限，因此其大小不到1GB，而标准版则超过2.5GB。


    或者，您也可以不下载 ISO 文件来重新安装到新的虚拟环境中，而是下载一个已为 VMware 或 VirtualBox 优化过的版本——但其架构与标准版本相同。您可以从
    [Offensive Security](http://OffensiveSecurity) 网站下载这些镜像文件并阅读安装说明。


    镜像文件下载完成后，请按照页面上的说明在您的虚拟计算机环境上安装 Kali Linux。如果您是虚拟化新手，这听起来可能有些复杂，但如果您以前安装过操作系统，那么您将能够轻松完成。


    ## 设置目标 Windows 机器


    如果您的黑客实验室有多台计算机可用，您可以在目标计算机上设置目标 Windows 系统（Windows XP 或 Windows 7）以及另一个 Linux
    发行版。


    由于我们将学习攻破 Windows 和 Linux 系统，如果计算机支持双启动，您可以并排安装这两个操作系统，或者您也可以在虚拟环境中设置它们。


    请注意，这仅在您拥有本地网络（如路由有线或无线连接）的情况下才有效。


    # 第三章 网络基础


    当然，访问特定系统最直接的方式是从目标设备的接口终端直接进入。这给黑客带来了许多障碍，因为它要求黑客获得系统的物理访问权限，使其暴露于被发现或留下其存在痕迹的风险之中。然而，大多数计算机和信息技术的网络化特性提供了更安全、更不易被察觉的利用途径——网络。


    广义上讲，网络是任何互连部分的集合。存在由人、组织、政治实体、机器以及几乎所有信息在成员间传递的实体团体组成的网络。计算机和信息技术网络已经发展和融合，连接了数十亿个节点，从小型家庭网络（包含一两台个人计算设备）到需要自己发电厂的大型服务器农场。


    无论是通过蓝牙连接将联系信息从一部智能手机发送到另一部，还是通过互联网将电影从莫斯科流式传输到布宜诺斯艾利斯，网络和通信的基础原理都是相同的。理解计算机网络和通信协议对于成为有效的黑客至关重要。


    # 网络组件与架构


    任何具备某种连接能力的设备都可以构成网络上的一个节点。传统的用户平台，如服务器、台式机、笔记本电脑、平板电脑以及智能手机等个人手持设备，在网络上很常见。此外，联网外设和独立智能设备的数量也在不断增加，例如打印机、电视、游戏平台、网络摄像头、娱乐控制台、音频设备和手表。每台设备通常可以通过各种通信介质连接到多个其他设备。铜缆和光纤等物理连接构成了全球互联网的骨干，并将大多数网络连接到局域网的主要接入点。在局域网内部，可能存在多种类型的连接方式，包括物理布线和
    Wi-Fi。在短距离内，设备可以通过蓝牙或近场通信（NFC）技术连接。与这种架构并行发展的是日益增长的宽带蜂窝网络，它由一系列连接到互联网骨干网和各种卫星的射频塔组成。随着宽带蜂窝技术的改进，其用途正在超越电话领域，正成为许多个人设备和小型网络的主要互联网接入方式。


    # 网络模型与协议


    无论节点类型或通信介质如何，两个设备必须使用某种通用协议进行通信。整个网络上所有设备都使用的标准协议对于防止通信错误是必需的。自网络最早期以来，互联网协议（IP）就一直存在。尽管其形式和功能有所变化，它仍然是网络通信的事实标准。IP
    与另一个称为传输控制协议（TCP）的标准相结合，形成了一种称为 TCP/IP 的分层网络范式。该方案将网络从基础网络硬件到用户应用程序划分为不同的层次。这组协议是一个概念性的网络通信模型，称为
    TCP/IP 模型或 TCP/IP “协议栈”。还有另一个模型称为开放系统互连（OSI）模型，它在层次数量上更为细粒度。OSI 模型可以更广泛地应用，但它描述的基本原理与
    TCP/IP 模型相同。


    ## TCP/IP 模型


    TCP/IP 模型由四个堆叠的概念层组成，每一层在数据从网络中一点准备和传输到另一点的过程中都扮演着角色。它们是应用层、传输层、网络层和数据链路层（或链路层）。


    ## 网络数据分层流动 (infosecinstitute.com)


    TCP/IP 协议栈的应用层（被认为是“顶层”）是用户最可见和最可访问的一层。这是在通信内容或有效载荷被打包以进行传输之前被创建的地方。电子邮件客户端、网络浏览器、文件共享软件、视频流应用程序和其他联网应用程序都在应用层运行。值得注意的是，应用层执行驻留在
    TCP/IP 内部（或之上）的其他协议。这包括 Web 应用程序的超文本传输协议（HTTP）、电子邮件的 SMTP 以及文件传输协议（FTP）等。


    传输层的功能是一个高级概念，但可以说这一层有助于通过错误检查和其他方式确保通信质量。此外，传输层是来自应用程序的信息被初始分成数据包的地方，然后为这些数据包附加适当的头部。TCP
    在这一层运行，但它并非唯一可用的协议。用户数据报协议（UDP）在需要牺牲少数数据包的成功到达以换取信息的实时交付时使用。UDP 是音频和视频流媒体的首选传输协议。


    网络层，通常称为互联网层，是执行数据包路由工作的层。在这一层，确定数据包的最佳网络路由，然后将源 IP 地址和目标 IP 地址附加到数据包头部，随后将其转发到网络接口硬件。其他协议也可以在这一层运行，但
    IP 是迄今为止最普遍的，是大多数全球数据通信的基础结构。在传输各个阶段对 IP 头部的操纵是许多黑客攻击的基础。


    TCP/IP 模型的底层是硬件或数据链路层。硬件层是数据包在离开源机器并通过物理介质到达下一个目的地之前的最后一站。参与数据包中继的网络硬件的 MAC 地址在这一层被附加到数据包头部。


    ## 网络协议


    当网络中的一个节点与另一个节点通信时，它会将其消息分成小的、独立的数据包。每个数据包在通过每一层时都会附加一个头部，以便在目的地被正确地重新组装成消息。TCP/IP
    的美妙之处在于每个单独的数据包可能采用不同的路由，并且如果丢失可以重新发送，从而确保高度的效率和消息保真度。

