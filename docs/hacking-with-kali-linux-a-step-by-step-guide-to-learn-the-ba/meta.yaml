    # What is a proxy server?


    Proxy is a middle man between you and server that you are trying to reach. Imagine
    if you want to deliver a package from New York (your place) to Colorado (Server
    place). Instead of going and giving the package all by your own, you will ask
    your friend to deliver it. Here your friend acts a proxy for you. This is how
    the proxy server works.


    There are many proxy servers like Socks4, http, https and Socks5.


    # How a hacker can use proxy server?


    When doing a password attack you will normally be blocked by the website due to
    too many requests. In these situations, you can use a bunch of free proxies to
    randomly occupy the proxy address and attack the login page. This is a famous
    technique called cracking that is used by novice hackers to get an access into
    the system.


    # What is a VPN?


    A VPN is a quite common advertisement that you might have used while watching
    ads in YouTube. A virtual private network abbreviated as a VPN acts like a middle
    man but delivers your request in encrypted form to the server in such a way that
    the server can''t identify you. And when the server sends you the response it
    again encrypts it and sends towards you. Imagine this example to get a better
    understanding of how a Vpn works. Imagine that you want to deliver a Love Letter
    to your classmate. But you don''t want any other person to read it other than
    your best friend. So, you write a Letter in quite a different way that no one
    can understand and sends by your friend to your classmate. Remember that your
    friends know how to read it. He will decrypt it to her and she will send a response
    in the same way. This is basically how a VPN works.'
