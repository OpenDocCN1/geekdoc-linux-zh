    避免使用Foxy Proxy选择性代理.i2p链接。你不想被发送到明网。如果一个I2P网站是蜜罐，你的Firefox浏览器可以在引用者中发送唯一标识符，在这种情况下...匿名性被打破。


    此时，你可能在想这比它值得的要麻烦得多。在一开始，你是对的...但任何值得做的事情通常一开始就很难。我和我的同事们做所有这些事情只是因为我们已经做了很多年。我们每天都做。我们在想它们吗？不，一点也不，因为这是每天做的明智习惯。你会认真思考发动汽车吗？把车开出车道？不。但可以肯定，你十六岁时做这些事时肯定吓得要命。把车开出车道是一个非常复杂的动作，正如前面提到的建议一样。你大脑中的一个细胞就比一架747飞机更复杂。不要浪费任何一个细胞。


