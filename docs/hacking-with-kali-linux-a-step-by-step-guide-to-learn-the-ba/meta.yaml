- img_proc: true
  md: '# Introduction


    What makes Kali Linux different from other Linux distros?

    Kali was developed specifically to meet the requirements of professional penetration
    testing, hacking, computer security research, reverse engineering, computer forensics,
    or security auditing. In order to make this happen, Offensive Security made various
    core changes to the original Linux source code to build a system that meets the
    following requirements:


    *a) Custom Linux kernel* : The Linux kernel that powers Kali is upstream, specially
    patched for wireless injection on-the-go.


    *b) Single user OS with root access by design* : Because of the nature of security
    testing and penetration, Kali Linux is designed to be a single-user system that
    grants root access by default. After all, most tools that come with Kali Linux
    require escalated privileges.


    *c) Network services are disabled* : By default, network services are by default
    disabled by system hooks. This enables the user to install all kinds of services
    without compromising the security of the computer they use. Some connectivity
    services such as Bluetooth are also blacklisted by default.


    *d) Trusted set of repositories* : Considering the purpose of Kali, it is very
    important that the integrity of the system as a whole is maintained. Kali developers
    kept the set of upstream software the system comes with to a minimum to achieve
    this. You can add more repositories as needed to *sources.list* if need be.


    # A few things to remember about Kali Linux:


    Despite its popularity, Kali Linux still poses some great challenges even to experienced
    Linux users. Do not expect to master it within a few days, weeks, or months, especially
    if you are new to Linux. This operating system is designed to be highly customizable
    but it does not support ‘out of band’ and unrelated packages and repositories.
    For instance, you cannot install *Steam* and begin gaming on it and even mainstream
    packages such as *NodeJS* takes quite some effort to set up.


    If you have the passion and the capacity to train to become a hacker or a professional
    pentester, Kali Linux is the ideal toolkit that will help you'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'achieve this goal. Kali Linux has been the world’s favorite pentesting and
    hacking toolkit used by security engineers, geeks, hackers, system admins, and
    fanatics alike. This is a full Linux operating system you can install as the primary
    OS on a computer dedicated to hacking and penetration testing.


    Alternatively, you can install and run it in a virtual box on a Linux or Windows
    computer or set it up on a dual-boot system.


    # Why Python?


    Python is the most preferred language for hackers to develop tools for use in
    the field of cyber security. Most of the tools you will find being shared online
    today such as port scanners, vulnerability analysis tools, password crackers,
    and scripts to execute brute force are written in Python. If you have been introduced
    to Python, you have probably come across or heard of Python APIs and other third-party
    modules that make it very easy to develop and integrate your modules and tools.


    The top reason that you should learn to code in Python as you study to become
    a hacker is because it is known to be a language for lazy programmers. You can
    write fewer lines of code that do huge tasks compared to the number of lines you
    would write in another language to carry out the same task.


    Unless you learn how to write scripts that do what you want, you risk getting
    stuck as a script kiddie who relies on the tools developed by other proficient
    hackers and programmers to gain access to vulnerable systems. Relying on ready-made
    scripts rather than writing your own decreases the success rate of your exploits
    since such tools are more easily detected by intrusion detection systems (IDS)
    and antivirus software or even the law enforcement.


    Many of the features that Python has makes it a very useful language for budding
    hackers. The thousands of pre-built libraries make it a very powerful and functional
    language to script. There are also thousands of modules and hundreds of thousands
    you can download from such sites as Github.


    Now that we have all the basics out of the way, let us learn some hacking.'
  merge: -1
