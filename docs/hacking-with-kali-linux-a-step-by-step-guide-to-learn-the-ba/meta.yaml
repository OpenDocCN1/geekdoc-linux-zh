    ## Setting up a virtual environment


    Choose one out of the two most popular Virtualization programs [VMware Workstation](https://www.vmware.com/products/workstation.html)
    or [VirtualBox](https://www.virtualbox.org/) then download and install. Each of
    these products has its own pros and cons, it is prudent that you do a little research
    before choosing which system to go with. The process of downloading and installing
    the software is straightforward and should pose no challenge to an individual
    striving to be a hacker.


    One great thing about using these software, besides eliminating the need for an
    extra computer, is that you can run them in different modes, some which allow
    you to bridge virtual and real networks to test your network penetration skills
    just as you would on a real network. VirtualBox, for instance, features NAT, Bridge,
    and Internal Network modes that causes the hosted OS to behave just like a computer
    on a specified type of network.


    While setting up the virtual environment, pay close attention to configuration
    details such as the amount of memory (RAM) that is allocated to the virtual machine.
    Allocating too little memory will hamper the speed and performance of the virtualized
    operating system while allocating too much will negatively impact the performance
    of the host operating system.


    ## Setting up Kali Linux


    After a virtualization environment is properly set up and configured, you can
    then go ahead and download Kali Linux from [kali.org/downloads/](https://www.kali.org/downloads/).
    Offensive Security releases fresh image files of Kali Linux every few months but
    you should always download the latest stable version.


    Note that there are multiple options of the operating system to choose from: 32-bit
    or 64-bit and light or standard. The light version has limited tools and features
    compared to the standard version, which explains why it is less than 1GB in size
    while the standard is over 2.5GB.


    Alternatively, rather than download an ISO to re-install on your new virtual environment,
    you can download a version already optimized for VMware or VirtualBox – but with
    the same infrastructure as the standard version. You can download these images
    and read through the set up instructions from the [Offensive Security](http://OffensiveSecurity)
    website.


    Once the image files are downloaded, follow the instructions on the page to install
    Kali Linux on your virtual computer environment. This may sound complicated if
    you are new to virtualization but if you have ever installed an operating system
    before then you will be able to do it without difficulty.


    ## Setting up target Windows machine


    If you have more than one computers to use in your hacking lab, you may set up
    the target Windows systems (Windows XP or Windows 7) as well as another distribution
    of Linux on the target computer.


    Since we will be learning to hack both Windows and Linux systems, you can install
    the two operating systems side-by-side if the computer supports dual-boot or you
    can set them up in the virtual environment.


    Note that this will only work if you also have a local network such as a routed
    wired or wireless connection.


    # Chapter 3 Network Basics


    The most straightforward way, of course, to gain access to a particular system
    would be directly from the interface terminal of the target device. This presents
    many obstacles to the hacker because it requires him to gain physical access to
    the system, exposing him to being discovered or leaving traces of his presence.
    However, the networked nature of most computers and information technology provides
    safer, less conspicuous avenues to exploitation – the network.


    In general, a network is any collection of interconnected parts. There are networks
    of people, organizations, political states, machines, and just about any group
    of entities in which information passes between members. Computer and IT networks
    have grown and combined to connect billions of nodes, from small household networks
    with one or two personal computing devices to enormous server farms that require
    their own powerplants.


    Whether sending contact information from one smartphone to another with a bluetooth
    connection, or streaming a movie through the internet from Moscow to Buenos Aires,
    the basics of networking and communication are the same. Understanding computer
    networking and communication protocols is essential to becoming an effective hacker.


    # Network Components and Architecture


    Any device capable of some sort of connectivity can comprise a node on a network.
    Traditional user platforms like servers, desktop PCs, laptops, tablets, and personal
    handheld devices such as smartphones are common on networks. There are also an
    increasing number of networked peripherals and standalone smart appliances like
    printers, televisions, gaming platforms, network cameras, entertainment consoles,
    audio devices and watches. Each device can typically connect to multiple other
    devices through various communication media. Physical connections like copper
    wiring and fiber optic cable serve as a backbone to the global internet, and connect
    most networks up to the main access point of a local area network. Within a LAN,
    any number of connection types may exist, including physical wiring and Wi-Fi.
    At short ranges, devices may connect through Bluetooth or Near-Field Communication
    (NFC) technology. Alongside of this architecture is a growing broadband cellular
    network that consists of any array of radio-frequency towers that are connected
    to the Internet backbone and to various satellites. As broadband cellular technology
    improves, usage is expanding beyond telephones and are becoming the primary internet
    access methodology for many individual devices and small networks.


    # Network Models and Protocols


    Regardless of the type of node or communication medium, two devices must communicate
    using some sort of common protocol. A standard protocol used by all devices across
    a network is necessary to prevent miscommunication. Internet Protocol (IP) had
    been around since the earliest days of networking. Although it has changed a bit
    in form and function, it remains the de facto standard for network communication.
    IP, combined with another standard known as Transmission Control Protocol (TCP)
    forms a layered networking paradigm called TCP/IP. This scheme divides a network
    into various layers from the basic network hardware up to the user application.
    The collection of protocols is a conceptual network communication model known
    as the TCP/IP model, or TCP/IP “stack”. There is another model known as the Open
    Systems Interconnection (OSI) model, which is more granular with regard to the
    number of layers. The OSI model can be more generally applied, but it describes
    the same essential principles as the TCP/IP model.


    ## The TCP/IP Model


    The TCP/IP model consists of four, stacked, conceptual layers that each have a
    role to play in the preparation and transport of data from one point in a network
    to another. These are the application, transport, network, and data link (or link)
    layers.


    ## Network Data Flow in Layers (infosecinstitute.com)


    The application layer of the TCP/IP stack (considered the “top” layer) is the
    layer most visible and accessible to the user. This is the layer where the content
    or payload of a communication is created before it is packetized for transport.
    Email clients, web browsers, file sharing software, video streaming applications
    and other connected apps all operate in the application layer. It''s worth noting
    that the application layer executes other protocols that reside within (or above)
    TCP/IP. This includes the hypertext transfer protocol (HTTP) of web applications,
    smtp for email, and File Transfer Protocol (FTP) among others.


    Functioning in the transport layer is an advanced concept, but suffice it to say
    that this layer helps to ensure the quality of communication through error checking
    and other means. Additionally, the transport layer is where information passed
    from an application is initially divided into packets, which are then appended
    with appropriate headers. TCP operates at this level, but it is not the only protocol
    available. User datagram protocol, or UDP is used when it is necessary to sacrifice
    the successful arrival of a small number of packets in exchange for real-time
    delivery of information. UDP is the transport protocol of choice for audio and
    video streaming.


    The network layer, often called the Internet layer, is where the work of routing
    packets is done. In this layer, the best network route for a packet is determined,
    then the packet header is appended with a source and destination IP address before
    it is relayed to the network interface hardware. There are other protocols that
    can operate at this layer, but IP is by far the most prevalent, and is the underlying
    structure for most global data communication. The manipulation of IP headers at
    various stages of transit is the basis for many hacking attacks.


    The bottom layer of the TCP/IP model is the hardware or data link layer. The hardware
    layer is the last stop of a data packet before it leaves its source machine and
    arrives at its next destination through the physical medium. The MAC addresses
    of the network hardware involved in relaying the packet are appended to the packet
    header at this level.


    ## Network Protocols


    When one node in a network communicates with another, it divides its message into
    small, independent packets. Each packet is then appended with a header as it passes
    through each layer so it can be properly reassembled into a message at its destination.
    The beauty of TCP/IP is that each individual packet may take a different route,
    and can be re-sent if lost, assuring a high degree of efficiency and message fidelity.'
