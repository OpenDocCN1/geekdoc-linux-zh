    ### 黑客实验室真的必要吗？


    对于刚进入黑客世界的新手来说，在学习阶段只拥有一台配置不错的电脑是可以接受的。但是，为了获得最佳效果并显著缩短学习时间，建议你建立一个个人“黑客实验室”，在安全和合适的环境中学习和磨练你的黑客技能。


    正如我们学习其他任何事情一样，练习、练习、再练习是让你为真实世界黑客攻击做好准备的关键。学习和练习的最佳场所莫过于你的个人实验室。


    ### 硬件要求


    成为黑客的最大问题不是学习理论技能，而是将它们付诸实践。这就是为什么你有一个安全的空间和合适的设备来练习你从本书或任何其他教程或指南中学到的任何东西是非常重要的。


