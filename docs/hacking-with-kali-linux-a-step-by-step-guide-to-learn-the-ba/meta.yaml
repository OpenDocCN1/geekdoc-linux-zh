- md: '## Chapter 5 Essential Linux Terminal Commands


    Before the emergence of graphical user interfaces and ergonomic input devices
    such as mice, computer users had only their keyboard and a monochromatic screen
    with a prompt. Commands were entered line-by-line and either interpreted on the
    spot or compiled EN MASSE into a program. In order to interact with the file system
    or peripherals (via the kernel), users had to employ a lexicon of special commands
    to perform desired actions. The original Unix systems, in fact, booted directly
    to a command terminal (typically a login prompt) to await input. Although most
    modern Linux distributions now boot to a GUI, the operating system is still underlied
    by the Unix terminal command system. Any Linux system can be made to boot directly
    into the command line, but most users open the *Terminal* application from the
    main GUI desktop if they want to enter commands directly.


    Although "point and click" graphical interfaces are convenient and generally more
    intuitive, advanced Linux users - especially hackers - often prefer to use the
    terminal to execute commands. Typing a Linux command manually is not only, in
    many cases, more efficient, but it also gives the user more direct control over
    operations. A single, one line command, entered properly, can replace multiple
    clicks and nested windows. Furthermore, by entering a command directly, the user
    can more easily trace the source of errors. Hackers tend to be independent, self-reliant
    individuals, and are loathe to relinquish control of their machine to automated
    processes written by others.


    This chapter will discuss how to navigate in Linux through the Terminal, and introduce
    some of the more critical shell commands.


    ## LINUX SYSTEM ANATOMY


    Before getting into the command list, it is important to understand the basic
    structure and file system of a typical Linux distribution. The command library
    is very powerful and can control virtually any aspect of the operation or configuration
    of a Linux system.


    ### Architecture


    All Linux systems are built upward from the kernel. The kernel is the machine-level
    instruction set that loads into memory when the OS is booted. Kernel instructions
    interact directly with the machine’s hardware, including the processor(s), memory,
    network interface, and any peripherals.


    The Linux shell (Figure 14) is the means by which a user interacts with the kernel.
    The shell can be either a direct command prompt or a graphical user interface.


    Linux Kernel Architecture


    ### THE DIRECTORY SYSTEM


    Linux has an organized directory structure that is designed to compartmentalize
    files for security and stability. Directory paths use the fore-slash ( / ) to
    separate subsequent directory names in the path, as opposed to Windows which uses
    the backslash ( \ ). The term "root" can at times be confusing to Linux beginners
    because there are a few locations which may be referred to as a root directory.
    The true "root" in a Linux file system – inasmuch as there are no parent directories
    above it – is designated simply by a lone fore-slash, "/". All other directories
    lie under this location. The directories under "/" vary slightly between Linux
    distributions, but the general structure was inherited from the original Unix
    system and is largely universal.


    Linux Directory Structure


    ### Linux Commands


    Linux has a rich set of terminal commands, many of which are the same, or similar,
    to those of the original Unix OS. These commands allow users to manage and manipulate
    files and folders, install software, interface with peripherals, and among many
    other tasks, perform various networking operations. Although Linux commands will
    be introduced in context in various sections throughout this book, the following
    basic commands serve as an introduction to the basic Linux lexicon and the general
    format and usage of terminal commands.


    #### Directories and Files


    The first commands a Linux user should learn are the ones associated with navigating
    and manipulating directories. Once at the terminal command prompt, the following
    command will list the files and directory present in the root directory:


    `ls`


    In most cases, the default terminal directory will be `/home/username`, so typing
    "ls" will list the contents of the current user’s files and folders.


    Most Linux commands feature options that can be appended to the default command
    form. These options vary for each command, and range from changing the format
    of the output to directing the command to perform specific functions that it doesn’t
    perform by default. The "-l" option for the ls command is an example of a command
    option that results in more detailed output.


    Note that the directory listing now contains details for each file and folder
    in the current directory, including access permissions, size, and creation date.
    Options are preceded by various symbols ( -, --, |, etc.) depending on the nature
    of the command and option. Many options can be chained together in a single command,
    making them a powerful way to accomplish many things in an efficient single line
    of code.


    To display the options for a particular command, along with other useful information,
    one can append the command with "--help". However, the help output for most commands
    is several pages long and cannot be viewed in a terminal window without scrolling.
    Attaching the "| more" option will pause after a single page of output, allowing
    the user to advance page-by-page by pressing the spacebar until the output is
    complete.


    The cd command allows the user to change the active directory to a specified location.
    A given path is assumed to be relative to the current directory unless otherwise
    constructed. To change to a directory within the current active path, simply append
    cd with that directory name. Note that Linux file and directory names are case
    sensitive.


    To switch to a path that is not in the active directory, the absolute path must
    be specified.


    The following is a short list of useful Linux directory and file commands. It
    is by no means a complete list, but represents some of the most common commands.
    Care must be taken with some of these commands, because they may change or delete
    the contents or location of a file or folder.


    | Command | Action |

    | :--- | :--- |

    | pwd | Displays the path of the active directory |

    | ls | Displays the contents of the active directory |

    | cd | Changes the active directory |

    | mkdir | Creates a new directory |

    | rmdir | Deletes a directory (if empty) |

    | cp | Copy a file |

    | mv | Move a file |

    | rm | Delete a file |


    ### "Superuser" Access: The sudo Command


    One more important Linux command is the infamous "sudo" command – one every aspiring
    hacker should know. The term "sudo" is (reportedly) short for "superuser do" and
    indicates to the kernel that the subsequent command is to be executed with root
    access (or sometimes as a user different from the one who is currently logged
    in).


    Above, a user navigated to the Documents folder of another user, but was denied
    permission to delete a file, named "passwords". When the command was reissued
    using sudo, the user was prompted for a password, then the rm command was successfully
    executed.


    ## Chapter 6 Web-Based Exploitation


    Now that you know how network exploits attacks work, it is time to also explore
    web-based exploitation. Nowadays, everything is connected to the Internet one
    way or another, therefore web exploits are extremely common. It would be difficult
    to find a company that has no web presence. In the old days websites were extremely
    basic, coded by using only HTML and no other more complex programming language.
    They were composed of simple static pages. Today’s websites, however, involve
    complex programming, mixed databases, and authentication servers. Every type of
    computer, whether it’s a smartphone or a desktop, is connected to the Internet.


    Because of this heavy expansion into the online world, we need to understand and
    further develop web-based means of exploitation. For instance, computers used
    to have word processors and other tools such as Microsoft Office installed and
    used locally. Now, a lot of these tools exist in the cloud and thus no longer
    require any local installation. A common example of this is Google Docs. Everything
    is connected now, and it’s important for the aspiring ethical hacker to fully
    understand the basics of web-based exploitation.


    In this chapter we will discuss the basics of web hacking and some concepts such
    as spidering and code injections. As always, please take the time to explore all
    techniques and practice them until you no longer need to use any cheat sheets.


    ### The Basics of Web Hacking


    There are many web-based hacking frameworks and tools designed for web application
    hacking. However, it doesn’t really matter what you use as long as you understand
    the basics, because most of them work exactly the same. The purpose is to have
    the functionality needed to attack the web. In basics terms, this works by accessing
    any website through your browser as usual, but you use a proxy to send the traffic.
    This way, you can collect and examine all the data you send to and receive from
    any application. Let’s take a look at some of the most important functionalities
    you need to get from these tools in order to be an effective web hacker.


    Intercepting Requests'
