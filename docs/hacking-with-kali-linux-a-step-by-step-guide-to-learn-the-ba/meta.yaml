    # How the internet works?


    Every internet connected device has an IP address that can be easily tracked using
    different techniques by the government. When u send an email or surf internet
    without any Anonymity services, you are just being a product to Tech giants like
    Google. They will collect a lot of information from you and will sell you as adds
    to the businesses. Apart from that, every movement of yours will be tracked and
    can help them create new products.


    Normally when we click on an URL the packet that contains your request will also
    contain the IP addresses of both yours and the server that you are trying to reach.
    In the communication process, it will travel through different routers called
    hops before reaching its final destination. When a packet is travelling, it can
    be easily sniffed and can be used to acquire information about you.


    For an example, use traceroute command to check how many hops that a particular
    website takes as below.


    ```

    root @ kali: traceroute bing.com

    ```


    You will get an output that shows the number of routers it needs to travel to
    reach the final destination. When the packet is travelling, anyone can sniff it
    and can attain sensitive information about you and your request.


    # What is TOR?


    Concerned with security of Internet few independent security researchers has developed
    a network called TOR network that will encrypt the hop we are going through. TOR
    basically makes your request go through its servers all the while making your
    data encrypted and untraceable. This will dramatically increase the security of
    your system. But remember that this may make your networking slow as it needs
    to travel between'
  merge: -1
  pgno: 83
- img_proc: true
  md: '> encrypted servers. But when you are trying to attack a target host, it is
    best

    > to use TOR network.


    > To access TOR as a command line interface you can enter the following

    > command.


    ```

    > `root@kali:~# tor service start`

    ```


    > This will start the TOR bridge circuit for you and will make every request

    > that is going on from your system to travel through TOR servers to reach

    > destination server.


    You can also use TOR project bundle that consists of browser to use it for

    > your daily purposes. A good thing about TOR browser that nothing of your

    > information is tracked.

    >


    # Is TOR the safest?


    Unfortunately, you can''t fully depend on TOR because there are rumors

    > that some of TOR servers belong to NSA organizations. If at all your

    > packet travels through one of their hops, your information can be easily

    > retrieved. So, try to use it with Sock5 proxies so that you can never be

    > tracked.


    In the next section, we will explain about proxies in detail. Proxies are the

    > middle man and can be used for secure and safe communication. They are

    > even extensively used for password attacks.'
  merge: -1
  pgno: 84
- img_proc: true
  md: 'd) Open website with a proxy in a browser


    This is a special command and automatically opens a webpage in a browser with
    desired proxy address. Command is shown below.


    ```

    root @ kali: proxychains chrome  www.bing.com

    ```


    e) By default, if you add more than one proxy in the configuration file it will
    automatically move between the servers. They are used by different proxy chaining
    methods. The first one is dynamic chaining and the second one is random chaining.


    (i) Dynamic chaining:


    This will help us to connect the web using chained proxies that are in an order.
    All the proxies are connected according to the order that they are placed in the
    configuration file.


    (ii) Random chaining:


    This will help us to connect to the webservices using proxy chains and all the
    proxies are connected randomly as in the configuration file.


    A little more about the Virtual private network


    We discussed before about the functionality of a VPN in detail before. Before
    choosing, a good VPN try to look at the number of servers and countries it is
    offering. Some VPN services work slowly due to their latent proxy chaining methods.
    A Vpn can not only be used as an advanced proxying service but can also be used
    by organizations and universities to have off campus authorization easily.


    Services like Shibboleth does this for International universities. Nordvpn, Hma
    pro Vpn are the best virtual private networks that we can recommend because they
    delete the log files automatically and will be no chance of getting trace your
    activities.'
  merge: -1
  pgno: 85
- img_proc: true
  md: So to get rid of this try to use mail services like protonmail for a small price
    to make all your all mail encrypted. This is how we can protect ourselves from
    the tracking and become a hacker that everyone wishes to be.
  merge: -1
  pgno: 86
- img_proc: true
  md: '# Conclusion


    Congratulations! You’ve come a long way since you first opened this book! It might’ve
    been difficult but progressing through the cyber-security field can be extremely
    rewarding and satisfying. You should not be ready to start with penetration testing
    on your own without the training wheels. You will become a professional ethical
    hacker in no time if you put the work into it.


    The journey is not over yet, however. Don’t rely on this content alone, because
    penetration testing is such a developed topic that you can write entire bookcases
    on it. This guide should clear up the mystery behind ethical hacking and guide
    you through all the basic penetration testing methods, however reading a book
    is not enough. You must take action! Develop your skills further by taking advantage
    of all the online resources on hacking and join a community with the same interests
    as you.


    With that message in mind, let’s go briefly through everything you gained by reading
    this book:


    It’s important to understand basic terminology and what a penetration test actually
    is. We also spent some time exploring the mind of the black hat hacker, because
    as an ethical hacker you will have to walk in his shoes sometimes in order to
    create accurate simulations of a real attack. Do not take unnecessary risks, and
    always perform a test only if you are fully authorized to do so.'
  merge: -1
  pgno: 87
