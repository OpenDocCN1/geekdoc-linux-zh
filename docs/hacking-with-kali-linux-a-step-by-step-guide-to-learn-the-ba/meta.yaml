    above it – is designated simply by a lone fore-slash, “/”. All other directories
    lie under this location. The directories under “/” vary slightly between Linux
    distributions, but the general structure was inherited from the original Unix
    system and is largely universal.


    Linux Directory Structure


    # Linux Commands


    Linux has a rich set of terminal commands, many of which are the same, or similar,
    to those of the original Unix OS. These commands allow users to manage and manipulate
    files and folders, install software, interface with peripherals, and among many
    other tasks, perform various networking operations. Although Linux commands will
    be introduced in context in various sections throughout this book, the following
    basic commands serve as an introduction to the basic Linux lexicon and the general
    format and usage of terminal commands.


    Directories and Files


    The first commands a Linux user should learn are the ones associated with navigating
    and manipulating directories. Once at the terminal command prompt, the following
    command will list the files and directory present in the root directory:'
  - '[PAGE 28]


    # # Is


    In most cases, the default terminal directory will be `/home/username`, so typing
    “ls” will list the contents of the current user’s files and folders.


    Most Linux commands feature options that can be appended to the default command
    form. These options vary for each command, and range from changing the format
    of the output to directing the command to perform specific functions that it doesn’t
    perform by default. The “-l” option for the ls command is an example of a command
    option that results in more detailed output.


    Note that the directory listing now contains details for each file and folder
    in the current directory, including access permissions, size, and creation date.
    Options are preceded by various symbols ( -, --, |, etc.) depending on the nature
    of the command ans option. Many options can be chained together in a single command,
    making them a powerful way to accomplish many things in an efficient single line
    of code.


    To display the options for a particular command, along with other useful information,
    one can append the command with “-- help”. However, the help output for mot commands
    is several pages long and cannot be viewed in a terminal window without scrolling.
    Attaching the “| more” option will pause after a single page of output, allowing
    the user to advance page-by-page by pressing the spacebar until the output is
    complete.


    The cd command allows the user to change the active directory to a specified location.
    A given path is assumed to be relative to the current directory unless otherwise
    constructed. To change to a directory within the current active path, simply append
    cd with that directory name. Note that Linux file and directory names are case
    sensitive.


    To switch to a path that is not in the active directory, the absolute path must
    be specified.


    The following is a short list of useful Linux directory and file commands. It
    is by no means a complete list, but represents some of the most common commands.
    Care must be taken with some of these commands, because they may change or delete
    the contents or location of a file or folder.'
  - '[PAGE 29]


    | Command | Action |

    | :--- | :--- |

    | pwd | Displays the path of the active directory |

    | ls | Displays the contents of the active directory |

    | cd | Changes the active directory |

    | mkdir | Creates a new directory |

    | rmdir | Deletes a directory (if empty) |

    | cp | Copy a file |

    | mv | Move a file |

    | rm | Delete a file |


    # “Superuser” Access: The sudo Command


    One more important Linux command is the infamous “sudo” command – one every aspiring
    hacker should know. The term “sudo” is (reportedly) short for “superuser do” and
    indicates to the kernel that the subsequent command is to be executed with root
    access (or sometimes as a user different from the one who is currently logged
    in).


    Above, a user navigated to the Documents folder of another user, but was denied
    permission to delete a file, named “passwords”. When the command was reissued
    using sudo, the user was prompted for a password, then the rm command was successfully
    executed.'
  - '[PAGE 30]


    # Chapter 6  Web-Based Exploitation


    Now that you know how network exploits attacks work, it is time to also explore
    web-based exploitation. Nowadays, everything is connected to the Internet one
    way or another, therefore web exploits are extremely common. It would be difficult
    to find a company that has no web presence. In the old days websites were extremely
    basic, coded by using only HTML and no other more complex programming language.
    They were composed of simple static pages. Today’s websites, however, involve
    complex programming, mixed databases, and authentication servers. Every type of
    computer, whether it’s a smartphone or a desktop, is connected to the Internet.


    Because of this heavy expansion into the online world, we need to understand and
    further develop web-based means of exploitation. For instance, computers used
    to have word processors and other tools such as Microsoft Office installed and
    used locally. Now, a lot of these tools exist in the cloud and thus no longer
    require any local installation. A common example of this is Google Docs. Everything
    is connected now, and it’s important for the aspiring ethical hacker to fully
    understand the basics of web-based exploitation.


    In this chapter we will discuss the basics of web hacking and some concepts such
    as spidering and code injections. As always, please take the time to explore all
    techniques and practice them until you no longer need to use any cheat sheets.


    # The Basics of Web Hacking


    There are many web-based hacking frameworks and tools designed for web application
    hacking. However, it doesn’t really matter what you use as long as you understand
    the basics, because most of them work exactly the same. The purpose is to have
    the functionality needed to attack the web. In basics terms, this works by accessing
    any website through your browser as usual, but you use a proxy to send the traffic.
    This way, you can collect and examine all the data you send to and receive from
    any application. Let’s take a look at some of the most important functionalities
    you need to get from these tools in order to be an effective web hacker.


    Intercepting Requests'
- md: "Being able to intercept requests as soon as they leave your browser is a highly\
    \ valued toolkit functionality. The general idea is to use an interception proxy\
    \ as the key which gives you the power to modify any variables before reaching\
    \ the target destination, which is the web-based application. This intercepting\
    \ proxy is a tool which nearly all web hacking tools provide. How does it work,\
    \ though?\n\nAt the foundation of all web transactions, there is an application\
    \ hosted on a web server. Its purpose is to accept your browser requests and display\
    \ the pages according to these requests. The requests contain a series of variables\
    \ which determine the page that should be returned to the browser. For instance,\
    \ whenever you are doing some online shopping, these variables dictate what you\
    \ added to your shopping cart and which payment information to retrieve. As a\
    \ hacker or penetration tester, you can take advantage of these variables, because\
    \ with a web-hacking tool you can modify them. This means that you can create\
    \ new variables, edit the existing ones, or delete them entirely.\n\n## Finding\
    \ All the Web Pages\n\nWhen you prepare for a web-based attack, you need to first\
    \ prepare the battlefield. This is done with tools that give you the ability to\
    \ find all the relevant pages, directories, and files that are part of the target\
    \ web application. The tool that provides this functionality is known as a \"\
    spidering\" program. All you need to do is insert the web page's URL and the spider\
    \ will be unleashed. It sounds pretty dramatic, but you have to understand that\
    \ this web information gathering method is not subtle.\n\nThe tool will make thousands\
    \ of website requests at a time. The spider will receive HTML code every time\
    \ it makes a request. That code is analyzed, and if more web links are uncovered,\
    \ the spider will send more requests to all of those links. Eventually, all the\
    \ website's information will be analyzed and cataloged by the spider. Web requests\
    \ will be sent until every attack field is discovered. However, keep in mind that\
    \ the spider will follow absolutely every link it finds. This includes any logging\
    \ out links. When that happens, the spider will actually log out of the website\
    \ without letting you know. This means that if you aren't careful, you might lose\
    \ out on potentially valuable information that wasn't discovered because of the\
    \ log out link. Always analyze the content that was spidered to make sure all\
    \ the areas you are interested in were explored.\n\nSpidering tools also allow\
    \ you to command which directories of web pages should be focused on. This gives\
    \ you more control and allows you to analyze the target with more accuracy.\n\n\
    ### Analyzing Responses for Vulnerabilities\n\nThe third most important functionality\
    \ you need to look for is the ability to analyze the responses that are coming\
    \ from web applications. This process is similar, but it is applied to web-based\
    \ applications. The goal is to find vulnerabilities.\n\nWhen you modify the variables\
    \ with the help of the intercepting proxy, the target application will respond\
    \ to you. The tool will then examine all of these responses to look for any kind\
    \ of vulnerability in the application. Many vulnerabilities can be detected by\
    \ an automated web-based vulnerability scanner, however some of them will not\
    \ be noticed. Luckily for us, we are only interested in the ones that we can easily\
    \ find. Why? Simply because a lot of them can be used to perform an SQL injection\
    \ attack, for example. An automated tool might not find all of the critical vulnerabilities,\
    \ but enough of them will prove to be useful to us.\n\n### Spidering\n\nThe concept\
    \ of spidering is probably one of the most important ones in web hacking. In this\
    \ discussion, we are going to be using a framework that is already installed on\
    \ Kali, namely WebScarab. This tool is loved by many hackers and penetration testers\
    \ because it is modular. This means you can customize it with the help of plugins\
    \ until it fits your needs perfectly. Now let's discuss more about WebScarab in\
    \ its default configuration.\n\nAs a result, we gain useful data that can be used\
    \ to gain access to restricted pages or files. Open the terminal and let's turn\
    \ WebScarab on by typing:\n\n    webscarab\n\nDon't start unleashing the spiders\
    \ just yet. First, you should make sure you are running the program with its \"\
    full-featured interface.\" Some versions of the tool start up with the lite interface,\
    \ and that isn't good enough for our purposes. You can check to see if this option\
    \ is ticked by clicking on the \"Tools\" tab. Now that the program is enabled,\
    \ you will have to use a proxy by first configuring your browser. The purpose\
    \ of this action is to force all web traffic to run through WebScarab as if it's\
    \ a filter. The tool will then be able to manipulate any ongoing web traffic.\n\
    \nIn order to set the web browser to use a proxy, you need to go through its network\
    \ options. In our example we will use Firefox, so go to Edit > Preferences and\
    \ then click on the Advanced Tab, followed by the Network tab. If you are using\
    \ a different browser, the settings path should be similar. Just look for any\
    \ tab related to network options. Once you're inside the Network menu, click on\
    \ Settings. A Connection Settings window will open, and you will use it to configure\
    \ Firefox to use WebScarab as a proxy. Now check the box for \"Manual proxy configuration\"\
    \ and type 127.0.0.1 inside the HTTP Proxy field. Next, you need to type 8008\
    \ in the Port field. Finally, you should check the \"Use this proxy server for\
    \ all protocols\" box and then click \"OK\" to apply all of these settings.\n\n\
    From now on, all web traffic will be directed through WebScarab as the middle\
    \ man. However, keep in mind that the tool needs to be active for you to be able\
    \ to browse through any websites. If you deactivate WebScarab, you will get a\
    \ connection error whenever you try to go to a website because we configured the\
    \ network settings to use it as a proxy. Another thing you need to keep in mind\
    \ is that all websites will display an \"invalid certificate\" message. Do not\
    \ pay any attention to that warning, because it's normal to encounter it when\
    \ using a proxy.\n\nNow that you've configured everything, you can start the spidering\
    \ process. Type the web address of your target in the URL field. As soon as the\
    \ website loads, it will run through WebScarab. In order to spider your target\
    \ you need to right click on the URL inside the tool and select \"Spider Tree.\"\
    \ You can now explore every file that is related to the website. Make sure to\
    \ examine them well, because you might find some leaked information that can prove\
    \ useful to your penetration test scope.\n\n## Intercepting Requests\n\nRemember\
    \ that our WebScarab tool acts as the filter between your web browser and the\
    \ target's web server. All the Internet traffic is flowing through this tool,\
    \ and this gives us the ability to interact with the data before it enters the\
    \ browser and before it leaves as well. What does this mean for us? We gain the\
    \ power to make any changes we want to any information that is in transit. There\
    \ are still many websites out there that are developed with bad coding and rely\
    \ on hidden fields to communicate information from and to the web client. In such\
    \ a case, the programmer probably assumed that the user could not possibly access\
    \ these hidden fields. However, with the help of a tool like WebScarab, we can\
    \ manipulate this information. Let's discuss a scenario to gain a better understanding\
    \ of how we can take advantage of this functionality.\n\nLet's assume we are shopping\
    \ for some fishing rods on an online store that has been badly coded as described\
    \ above. We browse through the website, choose our product, and add it to the\
    \ shopping cart where we see we are going to be charged $100. Now, if we are running\
    \ a proxy server, we might see a hidden field that is used to send the value of\
    \ $100 to the web server when the \"add to cart\" option was pressed. Because\
    \ we are running the website through WebScarab, we can see this hidden field and\
    \ even modify the variable stored inside it. We can simply change the $100 value\
    \ to $1. This is what can be achieved with the WebScarab tool, however, keep in\
    \ mind that there aren't that many websites around that are this badly coded.\
    \ No matter the case, it's worth going through such an example to demonstrate\
    \ the power of intercepting requests with the help of a program like WebScarab.\n\
    \nNow let's use this tool as an interceptor. For this process you will need to\
    \ switch WebScarab back to the lite interface. Go to the Tools panel and select\
    \ \"Use lite Interface.\" Next, you need to go to the \"Intercepts\" menu and\
    \ check the options for \"Intercept requests\" and \"Intercept responses.\" Now\
    \ switch to Firefox, or the browser of your choice. You can now change the value\
    \ of a field by allowing WebScarab to simply intercept the request and then finding\
    \ the variable you want to change. Type the new value, hit the 'Insert' button,\
    \ and you're done!\n\n## SQL Injection Attacks\n\nCode injection attacks have\
    \ been common in the online world for years. There are many types of code injections,\
    \ but since our purpose is to master the basics of hacking we will only discuss\
    \ the SQL injection, which is a classic still being used today. SQL Injections\
    \ are used mostly to bypass web authentications, however, they can also be used\
    \ to view and manipulate certain types of data."
  mdcn: "\n能够在请求离开浏览器时立即拦截它们，是备受推崇的工具包功能。其核心思路是利用拦截代理作为关键，赋予你在请求到达目标——即基于Web的应用程序——之前修改任何变量的能力。这种拦截代理几乎是所有Web黑客工具都提供的功能。那么，它是如何工作的呢？\n\
    \n所有Web交易的基础，都托管着一个运行在Web服务器上的应用程序。其目的是接受你的浏览器请求，并根据这些请求显示相应的页面。请求中包含一系列变量，这些变量决定了应返回给浏览器的页面。例如，当你在进行在线购物时，这些变量规定了你添加到购物车的商品以及要检索的支付信息。作为黑客或渗透测试人员，你可以利用这些变量，因为借助Web黑客工具，你可以修改它们。这意味着你可以创建新变量、编辑现有变量，或完全删除它们。\n\
    \n## 查找所有网页\n\n当你准备进行基于Web的攻击时，需要先勘察战场。这通过使用能够帮助你找到目标Web应用程序所有相关页面、目录和文件的工具来完成。提供此功能的工具被称为“爬虫”程序。你只需输入网页的URL，然后爬虫就会被释放。听起来相当戏剧化，但你必须明白，这种Web信息收集方法并不微妙。\n\
    \n该工具会一次发出成千上万的网站请求。每次发出请求，爬虫都会收到HTML代码。这些代码会被分析，如果发现更多Web链接，爬虫会向所有这些链接发送更多请求。最终，网站的所有信息都将被爬虫分析和归类。Web请求将一直发送，直到发现每一个攻击点。然而，请记住，爬虫会跟踪它找到的所有链接。这包括任何登出链接。如果发生这种情况，爬虫实际上会在不通知你的情况下登出网站。这意味着，如果你不小心，可能会因为登出链接而遗漏掉一些尚未发现的潜在有价值信息。务必分析爬虫抓取的内容，确保你感兴趣的所有区域都已被探索。\n\
    \n爬虫工具还允许你指定应重点关注哪些目录。这让你拥有更多控制权，并能更精确地分析目标。\n\n### 分析响应以发现漏洞\n\n你需要寻找的第三大重要功能是分析来自Web应用程序的响应的能力。这个过程类似，但应用于基于Web的应用程序。目标是找到漏洞。\n\
    \n当你借助拦截代理修改变量时，目标应用程序会对你做出响应。然后，该工具会检查所有这些响应，以寻找应用程序中的任何漏洞。许多漏洞可以被自动化的Web漏洞扫描器检测到，但其中一些可能不会被注意到。幸运的是，我们只对那些我们可以轻松找到的漏洞感兴趣。为什么？很简单，因为其中许多可以用来执行SQL注入攻击。自动化工具可能无法发现所有关键漏洞，但其中足够多的漏洞对我们来说将被证明是有用的。\n\
    \n### 爬虫\n\n爬虫的概念可能是Web黑客中最重要的概念之一。在本讨论中，我们将使用一个已安装在Kali系统上的框架，即WebScarab。这个工具深受许多黑客和渗透测试人员的喜爱，因为它是模块化的。这意味着你可以借助插件对其进行自定义，直到它完美满足你的需求。现在，让我们以默认配置来进一步讨论WebScarab。\n\
    \n结果，我们获得了可用于访问受限页面或文件的有用数据。打开终端，输入以下命令启动WebScarab：\n\n    webscarab\n\n先别急着释放爬虫。首先，你应该确保程序是以“全功能界面”模式运行的。该工具的一些版本启动时是精简界面，这无法满足我们的目的。你可以点击“工具”选项卡来查看此选项是否已勾选。程序启用后，你需要通过先配置浏览器来使用代理。此操作的目的是强制所有Web流量通过WebScarab，就像它是一个过滤器一样。然后，该工具就能够操纵任何进行中的Web流量。\n\
    \n为了将Web浏览器设置为使用代理，你需要进入其网络选项。在我们的示例中，我们将使用Firefox，因此请转到“编辑”>“首选项”，然后点击“高级”选项卡，再点击“网络”选项卡。如果你使用不同的浏览器，设置路径应类似。只需查找任何与网络选项相关的选项卡。进入“网络”菜单后，点击“设置”。将打开一个“连接设置”窗口，你将使用它来将Firefox配置为使用WebScarab作为代理。现在勾选“手动代理配置”复选框，并在“HTTP代理”字段中输入127.0.0.1。接下来，你需要在“端口”字段中输入8008。最后，你应该勾选“为所有协议使用此代理服务器”复选框，然后点击“确定”以应用所有这些设置。\n\
    \n从现在开始，所有Web流量都将通过WebScarab这个中间人进行引导。但是，请记住，你需要该工具处于活动状态才能浏览任何网站。如果你停用WebScarab，每次尝试访问网站时都会收到连接错误，因为我们已将网络设置为使用它作为代理。另一件需要记住的事情是，所有网站都将显示“无效证书”消息。不要理会那个警告，因为在使用代理时遇到它是正常的。\n\
    \n配置完成后，你就可以开始爬虫过程了。在URL字段中输入目标网站的地址。一旦网站加载，它就会通过WebScarab运行。为了爬取你的目标，你需要在工具内右键点击URL并选择“爬虫树”。现在你可以探索与网站相关的每个文件。务必仔细检查它们，因为你可能会发现一些对你的渗透测试范围有用的信息泄露。\n\
    \n## 拦截请求\n\n记住，我们的WebScarab工具充当你的Web浏览器和目标Web服务器之间的过滤器。所有互联网流量都流经此工具，这使我们能够在数据进入浏览器之前以及离开浏览器之前与之交互。这对我们意味着什么？我们获得了对传输中信息进行任何更改的能力。目前仍有大量网站编码不良，依赖隐藏字段与Web客户端之间来回传递信息。在这种情况下，程序员可能假设用户无法访问这些隐藏字段。然而，借助WebScarab这样的工具，我们可以操纵这些信息。让我们讨论一个场景，以便更好地理解如何利用这一功能。\n\
    \n假设我们正在一家如上述编码不良的在线商店购买一些钓竿。我们浏览网站，选择产品，将其添加到购物车，看到价格是100美元。现在，如果我们运行一个代理服务器，我们可能会看到一个隐藏字段，该字段在按下“添加到购物车”选项时用于向Web服务器发送100美元的值。因为我们将网站流量通过WebScarab运行，我们可以看到这个隐藏字段，甚至可以修改存储在其中的变量。我们可以简单地将100美元的值更改为1美元。这就是WebScarab工具所能实现的，然而，请记住，周围编码如此糟糕的网站并不多。无论如何，通过这样一个例子来演示借助WebScarab这样的程序拦截请求的力量是值得的。\n\
    \n现在让我们使用这个工具作为拦截器。为此过程，你需要将WebScarab切换回精简界面。转到“工具”面板并选择“使用精简界面”。接下来，你需要转到“拦截”菜单，并勾选“拦截请求”和“拦截响应”选项。现在切换到Firefox或你选择的浏览器。你现在可以通过允许WebScarab简单地拦截请求，然后找到你想更改的变量来更改字段的值。输入新值，点击“插入”按钮，就完成了！\n\
    \n## SQL注入攻击\n\n代码注入攻击在在线世界中已经存在多年。有许多类型的代码注入，但由于我们的目标是掌握黑客基础知识，我们将只讨论SQL注入，这是一种至今仍在使用的经典技术。SQL注入大多用于绕过Web身份验证，但也可用于查看和操纵特定类型的数据。\n"
