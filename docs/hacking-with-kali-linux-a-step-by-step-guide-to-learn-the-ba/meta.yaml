- md: '# Chapter 14 Advanced Kali Linux Concepts


    Insist on scanning removable media before it''s used in your network; or alternatively,
    ban them altogether. Encourage users to share information across networks. Networks
    have firewalls in place that can prevent the transfer or sharing of compromised
    files. Today most companies have very fast internet access in their offices. Even
    at home, most people are connected to reliable internet services. You can share
    gigabytes of data in a very short time. Instead of copying the file, upload it
    to a cloud storage facility, and share the link for the user to access it at their
    own time. This does not just save you from waiting for the file to download, but
    it also saves you on space.


    ## Using Abusive Services


    Services are the most important mechanisms that Linux operates for a better functioning
    of the operating system. Even Windows have services that run in background. Basically,
    services are processes that run in the background until you use it. For example,
    consider a proxy server like Burp Suite that will intercept every information
    that goes on in the browser and if you click No it stops the service and nothing
    goes there. In Windows, which is quite well dominated by graphical user interfaces,
    services are easily closed down by a click. Whereas in Linux we need to start
    using command line to start, stop and restart services.


    ### Why Services Matter to Hackers?


    Hackers should be well learnt about services because when you are trying to exploit
    a system you need to stop services that can interrupt what you are doing. Clever
    administrators use services to make hackers confuse. So, you need to understand
    the services that are making your exploitation difficult and stop them as soon
    as possible. Some advanced hackers install their own services after exploiting
    the system in a way that they will receive valuable information from the host
    regularly. In the below section we will explain with command line examples that
    will help us understand dealing with services.


    ### 1) Starting a Service


    To start Burp Suite as a service go to Linux terminal as a root user and just
    use the following command.


    ```

    root @ kali:service burpsuite start

    ```


    This will start the service and you can check it using the ps command.


    ### 2) Stopping a Service


    Stopping a service will completely abort everything that service is dealing with.
    So always, be careful while stopping a service as any unsaved data will be lost.
    Now use the following command to stop the service.


    ```

    root @ kali:service burpsuite stop

    ```


    You can check using ps command where you will not see anything related to Burp
    Suite service.


    ### 3) Restarting a Service


    Restarting a service just reboots everything about a particular service. Data
    will be lost and new service arises all on its own.


    ```

    root @ kali:service burpsuite restart

    ```


    This can be used when any service is struck or stops abruptly.


    Now in this below section we will use the Apache web server and MySQL to explain
    how services can be useful for a hacker. This is a very basic and introductory
    level of abusing services. If you are an efficient hacker, you will understand
    hundreds of services and will try to learn about them in time to be a professional.
    Now let us start exploring these below services.


    ### 1) Apache Web Server


    Apache is a famous web server that is being used by several hosting companies
    for deploying their web services. It is a well known open source web server that
    is well structured and of good security. We will use this Apache web server to
    learn a few things that can help us as a hacker.


    #### Step 1: Starting Apache


    Apache web server can be started using the following command. Normally in Windows
    and hosting environment there will be a GUI that lets us start the Apache web
    server. But in Linux we need to enter the following command as a root user.


    ```

    root @ kali: service apache start

    ```


    This will start the web server in the background, which can be accessed from the
    localhost. You can check if everything is going well or not using ps command.


    #### Step 2: Accessing the Local Host


    Now after starting the server you can go to your local host address that is http://127.0.0.1
    using your browser to access Apache. You will be welcomed with an Apache page
    that asks your permission to show the default page.


    #### Step 3: Modify the Webpage


    Now for a practical example, modify HTML file to your desired and save it using
    any text editor. After few seconds come back to localhost and refresh. Boom! You
    can see the modified webpage. This confirms that service is being run on the background.


    ### How an Apache Web Server Can Help Hackers?


    Programmers to create a local host website during development phase usually use
    Apache web server. This can be linked with WAMP to further expand it with PHP
    or MySQL servers. However, hackers can use it to learn about loopholes in websites
    without being blocked or banned. Hackers can also use Apache web server applications
    like Vulnerable App to expand their hacking skills. Almost every Hackathon program
    use the Apache web server for making their hacking boxes.


    ## Logging System


    Being a hacker, you will certainly visit networks with high-level protection and
    maintained by hardworking security engineers. And if with all your skills you
    have exploited the system. After the attack, obviously a forensic investigation
    will take place and will try to find how an attack has been planned and executed.
    Everything of this investigation will be based on log files that you have left
    while exploiting the system.


    Linux unlike Windows is not vulnerable to exploits and attackings because it has
    good logging system that records everything the user does. But some smart hackers
    use different techniques to make themselves undetectable by reading log files.
    We will explain in detail about how hackers need to develop skills to manipulate
    the logging system.


    ### Rsyslog


    rsyslog is a definite daemon program that takes care of log files to be created
    in the UNIX or Linux system. Every Linux distribution uses different techniques
    to deploy log files. Arch Linux uses a different process unlike Debian rsyslog
    function. As we are discussing about Kali Linux that is a Debian system we will
    continue with rsyslog explanation along with few examples.


    To know more about rsyslog we need to open its configuration file with any text
    editor. Please try to find syslog using find command and open it using your favorite
    text editor. And when you have successfully opened it please go through it and
    find Rules section. You will find some bizarre text like the following.


    ```

    kern.*    -var/log/kern.log

    ```


    This is where log instructions are given to the Linux kernel. When we look at
    it thoroughly, we will find a basic command that log functionality uses. It is
    as the command shown below.


    ```

    facility.priority action

    ```


    We need to describe these three things in detail to get a thorough overview about
    the concept.


    ### 1) Facility


    Facility is something, which is being logged. For example, mail designates about
    the mail system. There are few that comes under this category as explained below.


    - **a) mail** — This explains about the mailing system that is present in Kali
    Linux. This precisely says that mail usage is being logged.


    - **b) user** — All user related instructions or functions comes under this category.


    - **c) kern** — All messages that deals with the kernel comes under this category.


    - **d) lpr** — All messages that deals with the inbuilt printing system comes
    under this.


    ### 2) Priority


    If the facility describes which messages to log, priority decides on what to log.
    There are different types of messages that can be used to a better logging system.
    We will describe some of them below.


    - **a) debug** — This is used to log the things that happen as it is.


    - **b) warning** — This is used to log things that work but can go wrong.


    - **c) info** — This is used to log about normal information that exists. This
    can also be used to log date and time.


    - **d) error** — This can be used if something badly goes wrong while doing a
    work in Linux.


    ### 3) Action


    This is quite simple to understand than the rest. It just means that the logs
    should be sent into this particular category. We may manually assign folder but
    it''s better to leave them, as it is to go to var folder for better management.
    We will give some example destinations that logs are sent normally.


    - **Kernel files:** These are normally sent to /var/log/kernel. You can just go
    to the directory and open the log file using Leafpad to analyze them.


    Now as we have learned everything we will just look at an example that deals with
    all of this.


    ```

    mail.warning /var/log/warning

    ```


    This precisely means that mail system warning message logs will be sent to /var/log/warning
    path.


    ## Automatically Clean Logs


    Log files can make up a lot of mess if you use them extensively. We need to make
    a strategy to keep how many logs depending on the time interval. However, we can
    use logrotate function in Kali Linux to configure few functions that can help
    us clean log files.'
