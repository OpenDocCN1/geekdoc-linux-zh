    [content]

    在一个美好的环境里，赚着大钱，同时晚上和周末都是自由的 😊 真的！我记得朋友们曾对我说“继续做梦吧”。所以我想到了IT，总得做点和IT相关的事吧？当时我有6000英镑的积蓄，所以我想我可以花一半的钱接受一些不错的教育，某种IT教育，对吧？于是我上网搜索：IT工作
    😊


    然后我意识到，外面有超过40种不同的岗位，或者至少我当时访问的网页上是这样。软件工程师、帮助台专家、IT服务交付经理、IT安全分析师、网络技术员……


    我感到困惑。但，我认识一个正在学习成为电工的人，他是我的好朋友。他看起来挺有文化的，所以我问他。


    “你对IT领域了解多少？”


    你知道他怎么说吗？嗯，他马上就说IT领域非常拥挤，很难进入，也许5到10年前还容易些，但现在，已经太晚了。我相信了他，这是个错误，所以在接下来的两周里，我一直研究我到底该做什么工作。我什么也没找到！相反，我脑子里听到的全是：“IT，IT，IT…”
    但要怎么做？！！！


    然后我想起了一件事。大约两年前，我有个哥们，我以前每晚都和他一起喝酒（现在不了），但那时我们几乎每天都喝几杯啤酒。


    他曾经有个室友，是某种IT大牛。不幸的是，他从我朋友那里搬走了，至少一年没见过这家伙了。我从来不知道他的号码。我甚至不确定他的全名，对吧？所以我打电话给我的哥们说，


    “嘿，你还记得那个家伙吗，那个IT大牛，以前你的室友？他叫什么名字来着？”


    我哥们说；

    “我当然记得，他叫比拉尔（Bilal）”


    于是我说；

    “你有他的号码吗？我需要和他谈谈”


    我哥们说；

    “抱歉，没有号码”


    所以我说；

    “那你认识有他号码的人吗？”


    他说；

    “以前有个叫玛格达（Magda）的波兰女孩，他经常给她打电话，但她现在已经回波兰了，不过我在Facebook上认识她。”


    我就像，哇，好吧，我需要她的Facebook主页页面以便联系她。我照做了，她给了我比拉尔的号码，他碰巧就住在我附近，但在我打电话给他之前，我有个计划。


    计划是这样的。我会问他什么时候有空，因为我很久没见过他了。我会请他吃顿晚饭，然后征求他的建议。


    - 问我到底该学什么？

    - 要花多少钱？

    - 要花多长时间才能达到目标？

    - 一旦找到工作，能赚多少钱？

    - 如果我拼命努力学习，需要多长时间才能找到工作？

    - 最重要的是，因为他了解我，我是否有足够的智力取得成功？


    当我见到他时，他问我；

    “嘿，餐厅生意怎么样？你还是经理吗？”


    我说；

    “是的，很不幸”


    于是他问我为什么，我说了所有我刚才和你分享的责任和缺点，这时他打断我问道；

    “那么，你现在挣多少钱？”


    我说；

    “3万英镑”。


    你知道他怎么说吗？他说；

    “不不不，你得离开那个地方，来吧！”


    然后笑了起来。也是比拉尔告诉我CCNA和Network +的。就是这样。这就是我的故事。我知道这很无聊，但重点是，你必须有某种导师，你可以问他然后说，好的，下一步是什么？现在，你不必非要有个导师，但这是我当时的做法。所以总结一下，如果你认识IT行业的人，试着接触他/她，但不要疯狂地问问题，而是请他喝杯饮料或吃顿饭，并主动买单。同时，你去找出你想要什么，对吧？人脉！


    我理解你可能不认识IT行业的任何人，我懂。但我相当确定你认识某个非常了解某位IT工作者的人，对吧？那就是你需要计划并采取行动的地方。现在，问题是这样的。你可能会问我：我还会和那个给我玛格达Facebook页面的朋友聊天吗？不会。好吧，那么我还会和玛格达保持联系吗？不会。但我应该还和比拉尔保持联系吧？答案还是不。


    我当时是在利用比拉尔或其他人吗？你可能会这么说，是的，但我做的是什么。人脉，以及说服人们帮助我得到我想要的。就这么简单。每个人都有需要帮助的时候。我告诉你：每个人。但不要指望人们会主动找你，告诉你该怎么做。是你，也只有你，才能决定你未来的方向。再说一次，人们告诉我我是在正确的时间出现在正确的地点，对吧？


    嗯，我只是解释了我当时工作辛苦，报酬少得多，而且我不知道在IT领域该往哪个方向走。我也不认识任何IT行业的人，但打了几个电话，通过Facebook聊天，经过两个人，最终拿到了一个号码。我并不是在正确的时间出现在正确的地点。相反，我把一切都推向了有利于我的方向。嗯，从技术上讲，我做的就是：打了两个电话，一次Facebook聊天，并为比拉尔的晚餐买了单。没什么大不了的，任何人都能做到。如果我能做到，我相信你也能。如果你不想，或者不能完全照做，我希望你能从我的故事中学到一些东西，并应用到你的生活中。我通过人脉接触到这个行业的专业人士，这样做合乎道德吗？最终，我没有伤害任何人，所以我觉得是合乎道德的。也许我用了点灰色帽子技巧，但灰色帽子之所以叫灰色帽子，是因为其出发点是为了好的目的。


    ## 第10章 如何完成事情


    在过去几年里，我曾向至少50人推荐学习IT，我这么做的原因相当明显。但是，你知道有多少人采纳了我的建议吗？嗯，试着猜猜看。我是说，我确实有经验，等等，我知道我在说什么，但我还是只说服了两个人，甚至那两个人还在学习过程中挣扎。我最好的朋友之一弗朗切斯科（Francesco）上了课，甚至买了CCNA的书。然而，他从来没有读过。问题在于，他买这些书已经两年多了，还是没读。每次我们通电话，我都会问他：


    > “你开始读思科的书了吗？”


    当然，答案总是一样：


    > “还没，我没时间，因为……”


    blah blah blah…


    都是些老生常谈的问题，比如公寓和女朋友，或者加班太多这类的事情，对吧？所以，我不得不听这些，然后我又会问：


    > “好的我明白了，那么你打算什么时候开始读这些书呢？”


    当然，我知道我已经在烦他了，但我继续尝试，直到得到一个有策略的回答。所以，我总是开始解释我是怎么做的，我如何一直读，一直看视频课程，因为归根结底，所有的主题都在那里。当然，你需要付费，但它们都在那里，所以如何完成事情，对吧？


    我还有另一个记忆，涉及我的另一个朋友。我记得：我和我的前任，以及我的哥们，我们三个，都是匈牙利人，坐在一列半醉的火车上，我们正要去参加一个盛大的匈牙利派对。所以我们只是坐在火车上，玩得很开心，闲聊着，话题转到了思科和学习上。所以我朋友问我是否开始学习了，因为一周前我告诉他我会学的，所以现在情况怎么样了？嗯，他当时已经在对我笑了，你知道那种把别人当傻瓜的微笑，对吧？——但我还是回答了。我说：


    > “我昨天实际上收到了书，今天已经开始读第一本了。”


    然后他问我；

    “你读了多少页了？”


    我说；

    “32页”


    然后他问；

    “……那这本书实际有多少页？”


    我说；

    “超过900页”


    “那你打算什么时候读完这本书？”


    我这样回答；

    “听着，我设法一天读了30页，所以如果我每天只读30页，我应该能在30天内读完第一本书。”


    然后他说；

    “是啊，但只读一遍书……你不可能学到所有东西”


    我回答；

    “当然不会！我计划至少读两遍这本书。两个月内我应该就能准备好了。”


    不幸的是，现实并非如此。我记得我被迫说了些聪明话。我必须信守我说的话，我真的开始每天阅读。我花了一个多月才第一次读完这本书。总之，在第二次阅读时，我还做了笔记，记下了书中所有高亮或标记为重要的内容。因为我在做笔记，我学到了更多，但第二次阅读，花了大约两个月才完成这本书，所以我实际上只读了两遍。但是，这花掉了我三个多月的时间，而不是仅仅两个月。所以接下来，我把考试预约在三周后，并开始只读我写的笔记。基本上只读高亮部分。


    3周后，我去考了ICND 1考试，当然，我失败了。及格分是839，我得了690。太糟了！还损失了很多钱，但我对自己说，我只需要再知道大约20%的内容。一切

    '
