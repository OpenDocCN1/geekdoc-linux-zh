    ## 第一章  开始吧！如何安装 Kali Linux


    防火墙角色变化背后有众多原因，包括成本下降、结构更简单以及需求更迫切。早期的防火墙主要是基于硬件的设备，而且价格极其昂贵。当基于软件的防火墙最初进入市场时，它们既复杂又昂贵。然而，如今市场上有各种价格合理的、甚至免费的基于软件的防火墙。事实上，防火墙已经变得如此普及和重要，以至于微软将一个免费防火墙作为其
    Windows XP Service Pack 2 更新的一部分包含在内。


    家庭电脑用户需要使用防火墙的原因有很多。首先，那些连接到办公室网络的人应该安装防火墙，以防止未经授权访问家庭电脑和公司网络。此外，任何拥有高速互联网连接的人都会发现自己成为程序员、病毒/间谍软件作者等不受欢迎的关注对象。防火墙可以帮助阻止这种不必要的流量。


    ### 为什么你需要防火墙的安全保障


    事实是，一台没有防火墙保护的电脑，可能会在几分钟内被互联网上众多自动化黑客程序中的任何一个入侵。确保你的电脑及其包含的信息安全的唯一方法是使用防火墙保护它。


    从很多方面来说，在没有防火墙保护的情况下运行一台充满个人数据的电脑，就像把车钥匙留在点火器上，车门敞开一样。网络罪犯从你的电脑窃取数据，就像窃贼偷走你的汽车一样容易。事实上，窃取你电脑上的数据可能更容易得多。


    因此，正如你应该通过锁门来保护你的汽车一样，你应该使用可靠的防火墙来保护你的电脑。防火墙程序，与反病毒软件、反间谍软件程序和其他互联网保护工具一起，为你和你的家人提供安全可靠的计算环境。


    但是，在安装任何类型的防火墙程序之前，下载并安装操作系统的所有必要更新非常重要。这是因为如果操作系统存在安全漏洞，基于软件的防火墙本身也可能面临风险。


    此外，保持系统最新始终是一个好主意，因为总是有新的安全威胁和安全漏洞被发现。因此，让你的操作系统保持最新，将为你提供一个良好的基础。


    ### 寻找可靠的防火墙


    市场上有众多优秀的防火墙程序，通常明智的做法是在决定使用哪一款之前尝试几款。查看在线评论，然后利用大多数防火墙提供的免费试用期，在购买前充分利用这个选项。


    一些防火墙会与其他安全导向的软件捆绑销售，例如反病毒软件或间谍软件清除程序。其他防火墙程序则基本上是独立产品。选择哪种类型更多是个人喜好问题。但是，无论你选择哪种类型的防火墙，根据提供的说明正确配置它都很重要。一个配置得当的防火墙，与优质的反病毒软件和间谍软件清除程序一起，是保护你的电脑及其重要数据的最佳方式。


