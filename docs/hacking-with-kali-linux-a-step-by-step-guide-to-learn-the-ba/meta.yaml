    理想的计算机黑客实验室至少有两台计算机——一台是用户的，另一台或多台是测试目标。你显然已经拥有自己的计算机。即使你没有额外的计算机可用，你仍然可以使用这一台，但它必须是一台配置相当不错的计算机。因为你将需要建立一个虚拟系统，甚至在其中建立虚拟网络。


    你将用于入侵本地或远程目标的宿主计算机应该足够强大，并有足够的硬盘空间来安装和运行虚拟化环境，例如 Microsoft 的 Hyper-V、VMware Workstation
    或 Oracle 的 VirtualBox。


    本书演示中使用的虚拟化软件 VMware Workstation 要求 AMD Athlon 64 FX 双核处理器或 64 位 x86 Intel Core
    2 Duo 处理器，速度至少 1.3GHz 或更高。它还至少需要 2GB RAM（尽管推荐 4GB）和 64 位操作系统。你应该检查你偏好的虚拟化平台的具体硬件要求，以确保你的主机能够支持它。


    ### 网络和互联网连接要求


    虽然黑客可能指的是访问你可以物理接触到的本地计算机或安全的目标计算机，但你在本课程期间和之后的大多数漏洞利用将涉及通过网络远程渗透计算机系统。因此，在你的实验室中拥有一个良好的本地网络，最好是带有现代路由器的无线网络，是充分利用本课程的最佳设置。


    你还必须拥有良好的互联网连接，以下载设置软件环境所需的软件。一些文件，例如 Kali Linux 的 ISO 文件，可能高达数 GB。互联网上还有许多资源将在本课程中介绍给你，你可以利用这些资源练习你的黑客技能。


    ### 软件要求


    你在黑客实验室中需要的软件类型在很大程度上取决于你在培训期间和之后希望专注于的漏洞利用类型。如果你只有一台计算机，你需要下载并安装虚拟化软件，例如 VirtualBox
    或 VMware Workstation，然后在其中安装 Kali Linux 和 Windows 7 目标操作系统。虽然两者可以安装在同一个虚拟空间中，但一次只能运行一个。


