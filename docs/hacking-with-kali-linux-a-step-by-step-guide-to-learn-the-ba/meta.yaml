    TCP/IP的核心是IP地址。网络上的每台设备都有一个唯一的地址，用于标识其在该网络及所属任何子网中的位置。理解IP寻址使黑客能够精确锁定特定目标。此外，黑客可能需要隐藏或操纵自己的IP地址，以保持不引人注目。


    IP的标准版本多年来一直是IP v4，用于大多数网络和设备。IP v6是一种新标准，可以容纳更多的地址。在单个局域网内，IP地址的第一个八位字节通常表示主网络的指定，后续的八位字节则指定子网和单个机器。


    ## IP地址表示法


    关于IP寻址，最重要的一点是要理解，本地网络中给定节点的IP地址与它通过互联网通信时被分配的地址是不同的。这是因为无法控制或防止两个独立网络上的两台机器意外或有意地被赋予相同的地址。


    从黑客的角度来看，IP地址为任何单个网络提供了一个路线图，以识别和区分单个机器。此外，在网络上传输时拦截单个数据包也能带来很多好处。数据包的头部信息包含源和目标的IP地址。正是通过操纵这些头部信息，黑客才能进行中间人攻击和拒绝服务攻击。


    IP地址被视为逻辑地址，这意味着它们通过软件分配，可以由用户直接分配，也可以通过某种过程自动分配。IP地址位于网络层。在许多情况下，IP地址可以在数据包头部被欺骗或伪造。这样做可以混淆电子邮件或其他攻击载荷的来源，或者恶意重路由数据包。


    重要的是要理解，IP伪造不能用于隐藏任何双向通信。为了让两台机器交换信息，它们的地址必须有效，否则交换的数据包将无法到达目的地。这就是为什么在点对点服务上操作时，试图隐藏或更改自己的IP地址是徒劳的，或者隐藏下载节点的地址也是徒劳的。在这种情况下，人们能做的最好的事情是通过大量地理位置和逻辑上不同的代理来路由信息。作为暗网基础的TOR网络，就是通过创建多层信息传输层来运作的。


    另一种重要的设备标识符是媒体访问控制（MAC）地址。MAC地址被认为是永久物理地址，分配给单个网络接口设备。MAC寻址方案的设计使得理论上没有两台设备应该拥有相同的指定。地址被烧入设备的ROM中，因此不易更改。MAC地址是数据链路层的一部分。


    尽管MAC地址旨在永久，但有办法通过将虚假地址写入数据包头部来“欺骗”地址。这不会改变设备的永久地址，但允许黑客避免通过其网络接口被识别。如果攻击者使用伪造的MAC地址获得了对网络的本地访问，特别是通过无线方式，他们可以避免通过其硬件被追踪。


    ## 第4章 VirtualBox 与 Kali Linux 安装


    ### 虚拟化


    什么是虚拟化？这是在专门的环境中运行操作系统及其所有已安装软件的能力。


    让我们用一个例子来更好地理解。假设我有一台运行Windows 10的电脑；这将是我们的“宿主机”。使用虚拟化软件，我可以在我们的宿主计算机上运行一个“客户机”操作系统。假设我们的客户系统是Windows
    XP。这意味着我们可以同时运行两个或多个操作系统。


    客户机（Windows XP）会认为它是在一台真实机器上独立运行，而实际上，它运行在我们宿主机（Windows 10）的软件之上。


    ### VirtualBox


    Oracle VM VirtualBox是一款用于虚拟化的免费软件。它易于使用，适用于Windows、Linux、Macintosh和Solaris操作系统。只需从[这里](http://here)下载，然后点击下载的可执行文件进行安装。在安装过程中，只需点击“下一步”按钮并授予必要的权限即可。


    我将在Windows 7操作系统上安装和使用它。VirtualBox无论你使用哪个操作系统，工作方式都是一样的。如果在安装软件时遇到任何问题，请随时点击[这里](http://here)查阅用户手册。


    安装完成后，点击它，你会看到一个类似这样的窗口。


    我们现在可以下载VirtualBox扩展包以获得更多功能。你可以从VirtualBox网站下载。要安装扩展包，只需前往下载文件的位置并点击它，一个VirtualBox窗口将出现，询问你是否要安装扩展包。


    ### Kali Linux


    这是因为Kali Linux附带了广泛的黑客软件，但我们将只关注网络黑客部分。


    Kali Linux是免费的，可以从Kali网站[这里](http://example.com)下载。但是，有一个适合在VirtualBox中使用的Kali
    Linux版本，你可以从[这里](http://example.com)下载（请确保选择VirtualBox映像而不是VMware映像），我们将使用这个，因为它比其他映像更容易安装。


    你将获得一个种子文件，用于下载Kali Linux文件，因此请确保你有用于下载种子的软件。


    使用给定的种子下载Kali Linux VirtualBox文件后，我们现在可以将操作系统安装到VirtualBox中。为此，只需点击下载的Kali Linux
    VirtualBox文件。一个VirtualBox窗口将出现，看起来像这样。


    现在让我们在点击导入按钮之前更改一些设置。如果你向下滚动，你会发现CPU设置为4，你可以根据计算机上的处理器类型保持不变，但Kali Linux仍然可以在1上运行，所以随意更改。如果你的计算机上有最新的处理器，你可以保持为4。


    在CPU选项下，你会发现分配给它的RAM数量是2048 MB。这完全没问题，但如果你的设备有大量RAM，可以增加它，或者减少到1024 MB，这仍然可以工作。


    基础文件夹是设置虚拟机磁盘映像的位置。你可以保持默认，或者更改到你觉得合适的其他位置。磁盘映像大约需要10到15 GB的空间。


    在MAC地址策略中，将其更改为“为所有网络适配器生成新的MAC地址”，如下所示。


    一切设置好后，你可以点击窗口底部的导入按钮。导入映像需要一些时间。之后，我们可以启动Kali Linux。


    你的虚拟机现在将出现在VirtualBox窗口的右上角，如下红色区域所示。


    如果你点击它一次，你会看到一个新窗口，顶部有一个栏，上面有设置、启动和丢弃按钮。点击设置按钮，你应该会看到一个类似下图的窗口。


    转到网络窗口，将“连接到”设置从NAT更改为NAT网络，如下所示，这将允许我们的虚拟机访问互联网。


    点击“确定”按钮保存设置。我们现在可以继续运行我们的Kali Linux机器。点击虚拟机，然后点击启动按钮。给它一两分钟启动。


    ## Kali Linux 基础


    如果机器启动正确，系统会要求输入用户名。Kali的默认用户名是*root*，默认密码是*toor*。输入用户名和密码后，Kali Linux主窗口将出现。你可以按*右Ctrl
    + F*切换到全屏。


    为了正确使用Kali Linux，你需要学习如何使用终端命令。转到屏幕左侧的任务栏，点击终端图标，如下所示，以打开终端。


    将打开一个终端，它看起来就像一个带有闪烁白色光标的黑色窗口。现在让我们看看一些常用的命令。


    | 命令 | 用途 |

    | --- | --- |

    | apt update | 更新旧程序。 |

    | apt-get install \<package\> | 安装特定软件包 \<package\> = 软件包名称 |

    | clear | 清除终端窗口 |

    | git clone \<link\> | 从GitHub安装软件包 |

    | mkdir \<name\> | 创建新目录 |

    | rm \<file name\> | 删除文件 |

    | cp \<file name\> | 复制文件 |

    | ls | 列出目录中的文件和文件夹 |

    | cd \<directory path\> | 导航到特定目录 |

    '
