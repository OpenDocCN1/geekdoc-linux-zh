    ## 日志系统


    作为一名黑客，你肯定会访问具有高级保护并由勤奋的安全工程师维护的网络。如果你运用所有技能利用了系统。攻击之后，显然会进行取证调查，并试图找出攻击是如何策划和执行的。这次调查的一切都将基于你在利用系统时留下的日志文件。


    与Windows不同，Linux不易受到利用和攻击，因为它有一个良好的日志系统，记录用户所做的所有事情。但是，一些聪明的黑客使用不同的技术，通过读取日志文件来使自己不被检测到。我们将详细解释黑客需要如何培养操作日志系统的技能。


    ### Rsyslog


    rsyslog是一个守护程序，负责在UNIX或Linux系统中创建日志文件。每个Linux发行版使用不同的技术来部署日志文件。Arch Linux使用与Debian
    rsyslog功能不同的过程。由于我们讨论的是作为Debian系统的Kali Linux，我们将继续解释rsyslog并提供一些示例。


    要了解更多关于rsyslog的信息，我们需要用任何文本编辑器打开其配置文件。请尝试使用`find`命令找到syslog，并用你喜欢的文本编辑器打开它。成功打开后，请浏览并找到“Rules”部分。你会发现一些奇怪的文本，如下所示。


    ```

    kern.*    -var/log/kern.log

    ```


    这是向Linux内核提供日志指令的地方。当我们仔细查看时，会发现日志功能使用的基本命令。如下所示。


    ```

    facility.priority action

    ```


    我们需要详细描述这三件事，以获得对这个概念的全面了解。


    ### 1) 设施


    设施是被记录的内容。例如，“mail”指代邮件系统。有少数属于此类别，如下所述。


    - **a) mail** — 这解释了Kali Linux中存在的邮件系统。这精确地表明邮件使用正在被记录。


    - **b) user** — 所有与用户相关的指令或功能都属于此类别。


    - **c) kern** — 所有涉及内核的消息都属于此类别。


    - **d) lpr** — 所有涉及内置打印系统的消息都属于此类。


    ### 2) 优先级


    如果设施描述记录哪些消息，优先级则决定记录什么。有不同类型的消息可用于更好的日志系统。我们将在下面描述其中一些。


    - **a) debug** — 这用于按原样记录发生的事情。


    - **b) warning** — 这用于记录那些能正常工作但可能出错的事情。


    - **c) info** — 这用于记录存在的正常信息。也可用于记录日期和时间。


    - **d) error** — 如果在Linux中执行任务时出现严重错误，可以使用此级别。


    ### 3) 操作


    这比其他部分更容易理解。它只是意味着日志应该发送到这个特定的类别。我们可能会手动分配文件夹，但最好让它们保持原样，即进入var文件夹以进行更好的管理。我们将提供一些日志通常发送到的目的地示例。


    - **内核文件：** 这些通常发送到/var/log/kernel。你只需进入该目录，使用Leafpad打开日志文件进行分析。


    现在，既然我们已经学习了所有内容，我们将看一个涉及所有这些的例子。


    ```

    mail.warning /var/log/warning

    ```


    这精确地意味着邮件系统的警告消息日志将被发送到/var/log/warning路径。


    ## 自动清理日志


    如果你大量使用日志文件，它们会制造很多混乱。我们需要制定一个策略，根据时间间隔保留多少日志。然而，我们可以使用Kali Linux中的logrotate功能来配置一些功能，帮助我们清理日志文件。

