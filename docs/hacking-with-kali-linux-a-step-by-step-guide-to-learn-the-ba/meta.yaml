    data. When data is backed up, it can be used as an alternative if there is any
    leakage or corrupt in data. So administrators always prefer backing up the data.
    But it is a difficult and boring task to backup manually every day. So we can
    create an automatic backup with the following command.


    ```

    00 1 18,28 ** backup/desktop/backup.sh

    ```


    Here first 00 stands for the top of the hour. And ** to any day of the month.


