    ```


    c) 重新启动


    这会先停止日志记录功能，然后作为新的变量重新启动。


    ```

    root@kali: service rsyslog restart

    ```


    ## 使用作业调度实现任务自动化


    作为黑客，你需要学会的最重要技能之一就是将事情自动化。每当你攻击或利用某个系统时，都需要准备大量能为你自动执行事务的工具。自动备份或自动删除日志文件等一切操作，都是为了提高效率和效果。本节将详细介绍如何使用
    Kali Linux 实现任务自动化。


    ## crontab


    Crontab 是 Kali Linux 中提供的一项功能，可用于在特定时间安排事件或作业。我们可以从分钟到年份设置数据，以启动 crontab 任务。


    ```

    root @ kali : crontab

    ```


    输入 `-help` 可详细了解 crontab 的各项功能。


    ## 安排备份任务


    备份是处理重要数据时必不可少的工作之一。数据备份后，如果数据发生泄漏或损坏，可以作为替代方案。因此管理员总是喜欢备份数据。但每天手动备份既困难又枯燥，所以我们可以使用以下命令创建自动备份。


    ```

    00 1 18,28 ** backup/desktop/backup.sh

    ```


    这里的第一个 `00` 表示整点。`**` 表示每月的任意一天。


    ## Crontab 快捷方式


    下面列出一些用于 crontab 自动任务调度的快捷方式。


    - 1) @yearly

    这会使任务每年运行一次。

    - 2) @weekly

    这会使任务每周运行一次。

    - 3) @midnight

    这会使任务每天午夜运行。


    ## 使用 rc 在启动时运行任务


    在启动时，某些脚本会通过 rc 脚本自动开始执行任务。这有助于它们在进程中获得优先权，并取得良好效果。如果你想添加某个服务在启动时自动运行，可以使用以下命令。


    ```

    root @ kali : update-rc.d servicename  enable/disable

    ```


    ## 使用 TOR 和 VPN 保护自己


    显而易见，对任何黑客来说最重要的是匿名性。如今，由于政府限制和持续监控，人们不得不寻找 TOR 和 VPN 等替代方案来保持匿名。在学习如何在 Kali Linux
    中保持匿名之前，我们将详细介绍在这个万物互联的“矩阵世界”中保护自己的各种选择。


    想象一下，如果你的国家在骚乱期间屏蔽了社交网络访问，而你的同胞希望使用它进行更好的沟通，你可以使用 VPN 或 TOR 套件来实现而不被察觉。然而，如果他们愿意，也可以通过其他方式追踪。但遵循这些做法能让你获得更好的安心感。在下一节中，我们将了解具有不同用途的匿名服务。


    ## 什么是代理服务器？


    代理是你与目标服务器之间的中间人。想象一下，如果你想把一个包裹从纽约（你的所在地）送到科罗拉多（服务器所在地），而不是亲自前往递送，你会请朋友代为送达。在这里，你的朋友就充当你的代理。这就是代理服务器的工作原理。


    存在多种代理服务器，例如 Socks4、http、https 和 Socks5。


    ## 黑客如何使用代理服务器？


    进行密码攻击时，网站通常会因为请求过多而将你封禁。在这种情况下，你可以使用大量免费代理随机占据代理地址，然后攻击登录页面。这是一种被称为“cracking（破解）”的著名技术，常被新手黑客用来获取系统访问权限。


    ## 什么是 VPN？


    VPN 是一种非常常见的广告，你可能在 YouTube 上观看广告时见过。虚拟专用网（Virtual Private Network，简称 VPN）充当中间人，但会以加密形式将你的请求发送给服务器，使服务器无法识别你。当服务器向你发送响应时，它也会再次加密并发回给你。请看下面的例子以更好地理解
    VPN 的工作原理。假设你想给同学送一封情书，但除了你最好的朋友外，你不希望其他人读到它。于是你以一种无人理解的方式写好信，再由你的朋友转交给同学。请记住，你的朋友知道如何读懂它。他会将其解密后交给她，她也会以同样的方式回复。这就是
    VPN 的基本工作原理。


    ## 互联网如何运作？


    每台联网设备都有一个 IP 地址，政府可以通过不同技术轻易追踪它。当你发送邮件或浏览互联网而不使用任何匿名服务时，你只不过是 Google 等科技巨头的产品。他们会从你身上收集大量信息，并将你作为广告（ads）出售给企业。此外，你的一举一动都会被追踪，并帮助他们开发新产品。


    通常，当你点击一个 URL 时，包含你请求的数据包也会同时包含你的 IP 地址和你要访问的服务器的 IP 地址。在通信过程中，它会经过多个称为 hops（跳）的路由器，最终到达目的地。数据包在传输过程中很容易被嗅探，并被用来获取关于你的信息。


    例如，使用 traceroute 命令查看某个网站需要经过多少 hops，如下所示：


    ```

    root @ kali: traceroute bing.com

    ```


    你会得到输出，显示它到达最终目的地需要经过的路由器数量。当数据包传输时，任何人都可以嗅探它，并获取有关你和你的请求的敏感信息。


    ## 什么是 TOR？


    出于对互联网安全性的关注，一些独立安全研究人员开发了一种名为 TOR 的网络，它会加密我们所经过的每一跳。TOR 基本上会让你的请求通过它的服务器中转，同时使你的数据加密且不可追踪。这将大幅提高系统的安全性。但请记住，这可能会降低你的网络速度，因为数据需要在多个节点之间传输。

