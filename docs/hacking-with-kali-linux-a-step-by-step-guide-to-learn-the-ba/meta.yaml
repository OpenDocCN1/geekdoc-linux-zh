    This friend knows that you are an ethical hacker, so he asks you to perform a
    penetration test against his website. We are now going to use the same principle
    as in the above example in order to bypass the website''s authentication system.
    Start by typing the following text inside the username textbox:


    ‘or’ 1 = 1--


    When you don''t know the account''s username, you can use the above statement
    which always results to true. By doing this instead of entering a username, most
    SQL databases will choose the first user account. In many cases, the first user
