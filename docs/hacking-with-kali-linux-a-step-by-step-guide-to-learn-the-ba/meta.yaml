    Suite这样的代理服务器，它会拦截浏览器中传输的每一条信息，如果你点击“否”，它就会停止服务，信息就不会再传输。在Windows中，图形用户界面非常普及，服务很容易通过点击关闭。而在Linux中，我们需要开始使用命令行来启动、停止和重启服务。


