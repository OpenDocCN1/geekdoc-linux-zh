    ## Chapter 13 Preventing Cyber Attacks


    What can you do to prevent cyberattacks? Do you have the right systems and procedures
    in place to protect your company against an attack? Between 2017 and 2018, many
    organizations suffered from some form of cyberattack. Most of these were attributed
    to inappropriate security measures. Some organizations simply did not have a robust
    security platform in place, so hacking them was basically as easy as hacking into
    an individual''s computer at the local library.


    ## Types of Cyber Attacks


    Human behavior is one of the worst enablers for cyber hacks. It is very easy to
    allow a criminal into your secure platform. All they need is to gain the trust
    of someone, and you are finished. Therefore, it is important to learn how to identify
    threats and from there, how to protect yourself from those perceived threats.


    There are two broad categories of cyber attacks: semantic attacks and syntactic
    attacks.


    ### Semantic Attacks


    A semantic attack is about social engineering. These attacks are performed by
    altering someone''s behavior within the organization targeted by hackers. The
    software involved plays a very small role, unlike in syntactic attacks. Semantic
    attacks are basically about perception ([Noor et al., 2017](https://example.com)).


    Phishing is one of the most popular semantic attacks in which hackers send an
    email hoping to collect some information from the victim. You might not be aware
    of the phishing attack until it is too late, because the hackers clone emails
    from correspondence you interact with regularly. These are people you trust, so
    you barely crosscheck to make sure the emails are legitimate.


    Once you click a link in the email, you are asked to provide some information
    to help them verify your account. In doing so, you willingly provide all the access
    credentials hackers need to take you down. Some phishing attacks can also include
    viruses and worms. However, the modus operandi is to dupe you into believing the
    email address is legitimate, willingly providing the information hackers need.
    The worst bit about social engineering is that some attacks are a combination
    of semantic and syntactic attacks, and as such, the effects can be devastating.


    ### Syntactic Attacks


    A syntactic attack comes after your network through different channels. These
    attacks are often carried out through malicious programs. The most common programs
    used for syntactic attacks are as detailed below.


    *Trojan horses* - A trojan horse is something that looks harmless. You will allow
    it into your system, unaware of the danger it possesses. Today, trojan horses
    can be sent using several methods, including hackers cloning an email. The email
    will look like it comes from someone you know or trust, but its main purpose is
    to steal your information or destroy your system - whichever reason the hackers
    sent it.


    *Worms* - Worms are unique. They do not need the action of another program to
    spread through your computer or network. Worms are often deployed as secret agents.
    They collect and report information about your network to the hackers. They spread
    very fast in a network and can cripple it as soon as the hacker accomplishes their
    goals.


    *Viruses* - A virus is basically a program that is attached to another program
    or file. They replicate when you access the infected program or file. Viruses
    are common in shared and downloaded files and attachments sent through email.
    When the virus is activated, it can send itself to every person on your contact
    list.


    ## How to Protect Your Business


    You need to implement a good security plan and some strategies that will help
    you secure your platform and protect your interests. In light of the adoption
    of the GDPR, a lot of companies are making changes to their operations. (Perhaps
    the threat of heavy fines might be working after all.) One of the benefits of
    the GDPR is that it allows the average consumer to take back control over their
    data and how it can be accessed. With this in mind, customers can also report
    whenever they feel the company is not doing enough to protect their data. To ensure
    you do not find yourself on the wrong side of the law, we have included a few
    guidelines that can help you protect your networks and prevent a cyber attack.


    ## Threat Identification


    Make it a habit of reporting any threat to your system. Something as simple as
    unauthorized access might not mean much to you until it is too late. Nothing is
    ever too small to report when it comes to cyber security. The subsequent loss
    of information or denial of access to important services is proof of this.


    These days, a lot of companies handle information that is very sensitive. This
    is information that would attract most hackers, especially when they realize your
    systems use weak security protocols. Remember that hackers are always trawling
    the internet looking for vulnerabilities that they can exploit. You should not
    allow them this opportunity.


    If someone is going to hack you, at least make their life difficult while attempting
    it. Take the appropriate precautionary measures to keep the important information
    about your company safe. Identify and report threats as soon as they happen so
    that the relevant parties and authorities can look into them and clear your conscience
    about them before things get out of hand and you lose everything.


    ## Expect an Attack


    In the digital world today, it is prudent to expect that an attack is always imminent.
    This way, you will go about your operations expecting an attack at any given time.
    With this in mind, the business operations will be carried out with all checks
    and balances in place.


    Try to determine the kind of information you handle and classify those that might
    be extremely important to hackers from those that are not. Hackers might come
    after your company for any kind of information. Some might camp in your systems
    hoping to find a leeway into another company''s systems, especially if you deal
    with other large corporations as third parties.


    Astute risk assessment processes will help you make sure you have the right solutions
    for your problems as soon as they arise. You might not be sure about the type
    of information you handle, which might be alluring for hackers, so the best way
    is to make sure everything is protected.


    ## Employee Management


    No one has the best insight into your business like your employees do. They are
    the people who keep your business running and alive. It is only fair that you
    keep them happy and motivated to work towards the same goals your business has.


    In the digital era, loyalty is hard to come by. Your desire to have employees
    who will do all they can to protect the sanctity of your organization might not
    be achievable. However, you can take steps to ensure that you never have to risk
    being shot in the foot by the people you trust. A motivated workforce is always
    a good thing.


    Other than motivating the employees, try to ensure they are aware of their roles
    in the organization and about the data protection that''s required by law. Ensure
    everyone understands their responsibility and the limit of their liability for
    the data they handle or protect. Some people freely give away information at times
    inadvertently, because they are not aware of the risks involved or of the legal
    ramifications of their actions. Properly educating employees on their legal responsibilities
    can save you in the long run.


    Try to foster an environment where people take responsibility for their actions.
    This encourages employees to be honest and realize that they''re in control of
    something. They are caregivers and protectors of something important. That being
    said, you must also take precautionary measures by installing an additional layer
    of security beyond what you expect employees to do on their part. Your employees
    might not always be working towards the same goals as you. Where possible, use
    a password manager to make sure everyone is using an appropriate password.


    ## Two-Factor Authentication


    Everyone is using it, so why not implement it for your company? You may have noticed
    that most of the applications you use have switched to two-factor authentication.
    From Facebook to Gmail, everyone is adding an extra layer of protection for your
    data. Try to do the same for your company.


    Two-factor authentication helps to secure your systems and data by adding an additional
    verification step to access accounts. Encourage all your employees to use it.
    Once you enter the password, you receive a message with a code to verify it is
    really you. Only after entering this code will you gain access to your account.'
