- md: "# HACKING WITH KALI LINUX\n\nA STEP BY STEP GUIDE TO LEARN THE BASICS OF LINUX\
    \ PENETRATION. WHAT A BEGINNER NEEDS TO KNOW ABOUT WIRELESS NETWORKS HACKING AND\
    \ SYSTEMS SECURITY. TOOLS EXPLANATION INCLUDED\n\n![](img/91da939b1de47eceaf4034cc17d33a28_0_0.png)\n\
    \nAXEL ROSS\n\n# HACKING WITH KALI LINUX\n\nA STEP BY STEP GUIDE TO LEARN THE\
    \ BASICS OF LINUX PENETRATION. WHAT A BEGINNER NEEDS TO KNOW ABOUT WIRELESS NETWORKS\
    \ HACKING AND SYSTEMS SECURITY. TOOLS EXPLANATION INCLUDED\n\n![](img/91da939b1de47eceaf4034cc17d33a28_1_0.png)\n\
    \nAXEL ROSS\n\n# HACKING WITH KALI LINUX\n\nA STEP BY STEP GUIDE TO LEARN THE\
    \ BASICS OF LINUX PENETRATION.\n\nWHAT A BEGINNER NEEDS TO KNOW ABOUT WIRELESS\
    \ NETWORKS HACKING AND SYSTEMS SECURITY.\n\nTOOLS EXPLANATION INCLUDED\n\n# AXEL\
    \ ROSS\n\n## Description\n\n## Introduction\n\n- Why Python?\n\n## Chapter 1 Let's\
    \ Start! How To Install The Kali Linux\n\n## Chapter 2 Setting Up Your Hacking\
    \ Lab\n\n- Is a hacking lab really necessary?\n- Hardware requirements\n  - Computer\
    \ requirements\n  - Network and Internet connectivity requirements\n- Software\
    \ requirements\n  - Setting up a virtual environment\n  - Setting up Kali Linux\n\
    \  - Setting up target Windows machine\n\n## Chapter 3 Network Basics\n\n- Network\
    \ Components and Architecture\n- Network Models and Protocols\n  - The TCP/IP\
    \ Model\n- Network Protocols\n\n## Chapter 4 Virtual-box & Kali Linux Installation\n\
    \n- Kali Linux\n- Kali Linux Basics\n\n## Chapter 5 Essential Linux Terminal Commands\n\
    \n- Linux Commands\n  - Directories and Files\n  - \"Superuser\" Access: The sudo\
    \ Command\n\n## Chapter 6 Web-Based Exploitation\n\n- Analyzing Responses for\
    \ Vulnerabilities\n- Intercepting Requests\n- SQL Injection Attacks\n\n## Chapter\
    \ 7 Types of Penetration Testing\n\n## Chapter 8 Hacking Wifi Passwords\n\n##\
    \ Chapter 9 Networking To Achieve Targets\n\n## Chapter 10 How To Get Things Done\n\
    \n## Chapter 11 Hacking - The Effects Everyone Suffers From\n\n## Chapter 12 I2p\n\
    \n## Chapter 13 Preventing Cyber Attacks\n\nTypes of Cyber Attacks\n\n- Semantic\
    \ Attacks\n- Syntactic Attacks\n\nHow to Protect Your Business\n\n## Chapter 14\
    \ Advanced Kali Linux Concepts\n\n## Conclusion\n\n## © Copyright 2019 - All rights\
    \ reserved\n\nNo part of this book may be reproduced in any form without permission\
    \ in writing from the author. Reviewers may quote brief passages in reviews.\n\
    \n## Disclaimer\n\nNo part of this publication may be reproduced or transmitted\
    \ in any form or by any means, mechanical or electronic, including photocopying\
    \ or recording, or by any information storage or retrieval system, or transmitted\
    \ by email without permission in writing from the publisher.\n\nWhile all attempts\
    \ have been made to verify the information provided in this publication, neither\
    \ the author nor the publisher assumes any responsibility for errors, omissions,\
    \ or contrary interpretations of the subject matter herein.\n\nThis book is for\
    \ entertainment purposes only. The views expressed are those of the author alone\
    \ and should not be taken as expert instructions of commands. The reader is responsible\
    \ for his or her own actions.\n\nAdherence to all applicable laws and regulations,\
    \ including international, federal, state and local governing professional licensing,\
    \ business practices, advertising, and all other aspects of doing business in\
    \ the US, Canada, or any other jurisdiction is the sole responsibility of the\
    \ purchaser or reader.\n\nNeither the author nor the publisher assumes any responsibility\
    \ or liability whatsoever on the behalf of the purchaser or reader of these materials.\n\
    \nAny perceived slight of any individual or organization is purely unintentional.\n\
    \n## Description\n\nModern-day hacking has become more sophisticated than ever.\
    \ Hacktivists groups, ransomware, and highly classified document releases are\
    \ a daily problem. In modern times, the ethical hackers are needed more than ever\
    \ to protect and prevent hack attacks. The information available to everyone makes\
    \ it all the easier for hack attacks, but it makes protection available as well.\n\
    \nHacking is not always black and white, and there are different types of hackers\
    \ and types of hacking. The major types of hackers are divided between ethical,\
    \ unethical, and somewhere in between.\n\nKali Linux comes with just about every\
    \ tool pre-installed that can be used for any of the above purposes. It is for\
    \ this reason that Security Auditors, Forensics Investigators, Penetration Testers,\
    \ and Researchers prefer it.\n\nThis book covers topical issues like wireless\
    \ network attacks, cyber-attacks, and penetration testing, among others. It, therefore,\
    \ means that you are now in an excellent position to discern network attack mechanisms\
    \ being perpetrated in the real world and recommend appropriate remedial measures.\n\
    \nThis guide will focus on the following:\n\n- How To Install The Kali Linux\n\
    - Setting Up Your Hacking Lab\n- Essential Linux Terminal Commands\n- Web-Based\
    \ Exploitation\n- Types of Penetration Testing\n- Hacking Wifi Passwords\n- Networking\
    \ To Achieve Targets\n- The Effects Everyone Suffers From\n- Advanced Kali Linux\
    \ concepts\n- Preventing Cyber Attacks... AND MORE!!!\n\n## Introduction\n\nWhat\
    \ makes Kali Linux different from other Linux distros?\nKali was developed specifically\
    \ to meet the requirements of professional penetration testing, hacking, computer\
    \ security research, reverse engineering, computer forensics, or security auditing.\
    \ In order to make this happen, Offensive Security made various core changes to\
    \ the original Linux source code to build a system that meets the following requirements:\n\
    \n*a) Custom Linux kernel* : The Linux kernel that powers Kali is upstream, specially\
    \ patched for wireless injection on-the-go.\n\n*b) Single user OS with root access\
    \ by design* : Because of the nature of security testing and penetration, Kali\
    \ Linux is designed to be a single-user system that grants root access by default.\
    \ After all, most tools that come with Kali Linux require escalated privileges.\n\
    \n*c) Network services are disabled* : By default, network services are by default\
    \ disabled by system hooks. This enables the user to install all kinds of services\
    \ without compromising the security of the computer they use. Some connectivity\
    \ services such as Bluetooth are also blacklisted by default.\n\n*d) Trusted set\
    \ of repositories* : Considering the purpose of Kali, it is very important that\
    \ the integrity of the system as a whole is maintained. Kali developers kept the\
    \ set of upstream software the system comes with to a minimum to achieve this.\
    \ You can add more repositories as needed to *sources.list* if need be.\n\n##\
    \ A few things to remember about Kali Linux:\n\nDespite its popularity, Kali Linux\
    \ still poses some great challenges even to experienced Linux users. Do not expect\
    \ to master it within a few days, weeks, or months, especially if you are new\
    \ to Linux. This operating system is designed to be highly customizable but it\
    \ does not support 'out of band' and unrelated packages and repositories. For\
    \ instance, you cannot install *Steam* and begin gaming on it and even mainstream\
    \ packages such as *NodeJS* takes quite some effort to set up.\n\nIf you have\
    \ the passion and the capacity to train to become a hacker or a professional pentester,\
    \ Kali Linux is the ideal toolkit that will help you achieve this goal. Kali Linux\
    \ has been the world's favorite pentesting and hacking toolkit used by security\
    \ engineers, geeks, hackers, system admins, and fanatics alike. This is a full\
    \ Linux operating system you can install as the primary OS on a computer dedicated\
    \ to hacking and penetration testing.\n\nAlternatively, you can install and run\
    \ it in a virtual box on a Linux or Windows computer or set it up on a dual-boot\
    \ system.\n\n## Why Python?\n\nPython is the most preferred language for hackers\
    \ to develop tools for use in the field of cyber security. Most of the tools you\
    \ will find being shared online today such as port scanners, vulnerability analysis\
    \ tools, password crackers, and scripts to execute brute force are written in\
    \ Python. If you have been introduced to Python, you have probably come across\
    \ or heard of Python APIs and other third-party modules that make it very easy\
    \ to develop and integrate your modules and tools.\n\nThe top reason that you\
    \ should learn to code in Python as you study to become a hacker is because it\
    \ is known to be a language for lazy programmers. You can write fewer lines of\
    \ code that do huge tasks compared to the number of lines you would write in another\
    \ language to carry out the same task.\n\nUnless you learn how to write scripts\
    \ that do what you want, you risk getting stuck as a script kiddie who relies\
    \ on the tools developed by other proficient hackers and programmers to gain access\
    \ to vulnerable systems. Relying on ready-made scripts rather than writing your\
    \ own decreases the success rate of your exploits since such tools are more easily\
    \ detected by intrusion detection systems (IDS) and antivirus software or even\
    \ the law enforcement.\n\nMany of the features that Python has makes it a very\
    \ useful language for budding hackers. The thousands of pre-built libraries make\
    \ it a very powerful and functional language to script. There are also thousands\
    \ of modules and hundreds of thousands you can download from such sites as Github.\n\
    \nNow that we have all the basics out of the way, let us learn some hacking."
  mdcn: "\n# 使用 KALI LINUX 进行黑客攻击\n\n一份循序渐进的学习指南，涵盖 Linux 渗透测试的基础知识。包含初学者需要了解的无线网络黑客技术和系统安全知识，以及工具详解\n\
    \n![](img/91da939b1de47eceaf4034cc17d33a28_0_0.png)\n\nAXEL ROSS\n\n# 使用 KALI\
    \ LINUX 进行黑客攻击\n\n一份循序渐进的学习指南，涵盖 Linux 渗透测试的基础知识。包含初学者需要了解的无线网络黑客技术和系统安全知识，以及工具详解\n\
    \n![](img/91da939b1de47eceaf4034cc17d33a28_1_0.png)\n\nAXEL ROSS\n\n# 使用 KALI\
    \ LINUX 进行黑客攻击\n\n一份循序渐进的学习指南，涵盖 Linux 渗透测试的基础知识。\n\n包含初学者需要了解的无线网络黑客技术和系统安全知识。\n\
    \n工具详解\n\n# AXEL ROSS\n\n## 描述\n\n## 引言\n\n- 为什么选择 Python？\n\n## 第1章 开始！如何安装 KALI\
    \ LINUX\n\n## 第2章 搭建你的黑客实验室\n\n- 黑客实验室真的有必要吗？\n- 硬件要求\n  - 电脑配置要求\n  - 网络和互联网连接要求\n\
    - 软件要求\n  - 搭建虚拟环境\n  - 安装 KALI LINUX\n  - 安装目标 Windows 机器\n\n## 第3章 网络基础\n\n\
    - 网络组件与架构\n- 网络模型与协议\n  - TCP/IP 模型\n- 网络协议\n\n## 第4章 虚拟盒子与 KALI LINUX 安装\n\n\
    - KALI LINUX\n- KALI LINUX 基础\n\n## 第5章 必备的 Linux 终端命令\n\n- Linux 命令\n  - 目录与文件\n\
    \  - \"超级用户\"权限：sudo 命令\n\n## 第6章 基于 Web 的漏洞利用\n\n- 分析响应以发现漏洞\n- 拦截请求\n- SQL 注入攻击\n\
    \n## 第7章 渗透测试的类型\n\n## 第8章 破解 WiFi 密码\n\n## 第9章 通过网络实现目标\n\n## 第10章 如何完成任务\n\n\
    ## 第11章 黑客攻击——每个人都会遭受的影响\n\n## 第12章 I2P\n\n## 第13章 防范网络攻击\n\n网络攻击的类型\n\n- 语义攻击\n\
    - 语法攻击\n\n如何保护你的企业\n\n## 第14章 KALI LINUX 高级概念\n\n## 结论\n\n## © 版权所有 2019 - 保留所有权利\n\
    \n未经作者书面许可，不得以任何形式复制本书任何部分。评论家可在评论中引用简短段落。\n\n## 免责声明\n\n未经出版商书面许可，不得以任何形式或任何方式（机械或电子方式，包括影印或录音，或通过任何信息存储或检索系统，或通过电子邮件）复制或传播本出版物的任何部分。\n\
    \n虽然已尽力核实本出版物中提供的信息，但作者和出版商对其中的主题内容的任何错误、遗漏或相反的解释不承担任何责任。\n\n本书仅供娱乐之用。所表达的观点仅代表作者个人，不应被视为专家对命令的指导。读者需对其自身行为负责。\n\
    \n遵守所有适用的法律和法规，包括美国、加拿大或任何其他司法管辖区的国际、联邦、州和地方有关专业许可、商业实践、广告以及所有其他方面的规定，是购买者或读者的唯一责任。\n\
    \n作者和出版商对代表购买者或读者对这些材料的任何责任或义务概不负责。\n\n对任何个人或组织的任何潜在冒犯纯属无意。\n\n## 描述\n\n当今的黑客攻击比以往任何时候都更加复杂。黑客活动组织、勒索软件以及高度机密文件的泄露是日常问题。在当今时代，比以往任何时候都更需要道德黑客来保护和预防黑客攻击。人人都能获取的信息使得黑客攻击变得容易，但同时也提供了保护手段。\n\
    \n黑客攻击并非总是非黑即白，存在不同类型的黑客和攻击方式。主要的黑客类型可分为道德黑客、不道德黑客以及介于两者之间的类型。\n\nKALI LINUX 预装了几乎所有可用于上述任何目的的工具。正因如此，安全审计员、取证调查员、渗透测试员和研究人员都偏爱它。\n\
    \n本书涵盖了无线网络攻击、网络攻击和渗透测试等热门话题。因此，这意味着你现在能够很好地识别现实世界中正在进行的网络攻击机制，并提出适当的补救措施。\n\n\
    本指南将重点关注以下内容：\n\n- 如何安装 KALI LINUX\n- 搭建你的黑客实验室\n- 必备的 Linux 终端命令\n- 基于 Web 的漏洞利用\n\
    - 渗透测试的类型\n- 破解 WIFI 密码\n- 通过网络实现目标\n- 每个人都会遭受的影响\n- KALI LINUX 高级概念\n- 防范网络攻击...\
    \ 以及更多！！！\n\n## 引言\n\n是什么让 KALI LINUX 与其他 Linux 发行版不同？\nKALI 专门为满足专业渗透测试、黑客攻击、计算机安全研究、逆向工程、计算机取证或安全审计的需求而开发。为了实现这一点，Offensive\
    \ Security 对原始 Linux 源代码进行了各种核心更改，以构建满足以下要求的系统：\n\n*a) 定制 Linux 内核* ：驱动 KALI 的\
    \ Linux 内核是上游版本，专门为随时随地的无线注入进行了特殊修补。\n\n*b) 默认具有 root 访问权限的单用户操作系统* ：由于安全测试和渗透的性质，KALI\
    \ LINUX 被设计为默认授予 root 访问权限的单用户系统。毕竟，KALI LINUX 附带的大多数工具都需要提升的权限。\n\n*c) 网络服务默认禁用*\
    \ ：默认情况下，网络服务通过系统钩子被禁用。这使用户能够安装各种服务，而不会危及其使用的计算机的安全性。一些连接服务（如蓝牙）也被默认列入黑名单。\n\n\
    *d) 可信的软件源集* ：考虑到 KALI 的目的，维护整个系统的完整性至关重要。KALI 开发人员为此将系统自带的上游软件集保持在最低限度。如有需要，你可以向\
    \ *sources.list* 添加更多软件源。\n\n## 关于 KALI LINUX 需要记住的几点：\n\n尽管受欢迎，KALI LINUX 即使对经验丰富的\
    \ Linux 用户来说也仍然存在一些巨大的挑战。不要期望在几天、几周或几个月内掌握它，特别是如果你是 Linux 新手。这个操作系统被设计为高度可定制，但它不支持“带外”和无关的软件包和软件源。例如，你无法安装\
    \ *Steam* 并开始玩它，甚至像 *NodeJS* 这样的主流软件包也需要相当大的努力来设置。\n\n如果你有热情和能力训练成为一名黑客或专业渗透测试员，KALI\
    \ LINUX 是帮助你实现这一目标的理想工具包。KALI LINUX 一直是世界上最受欢迎的渗透测试和黑客工具包，被安全工程师、极客、黑客、系统管理员和狂热者所使用。这是一个完整的\
    \ Linux 操作系统，你可以将其作为主要操作系统安装在专门用于黑客攻击和渗透测试的计算机上。\n\n或者，你可以将其安装并运行在 Linux 或 Windows\
    \ 计算机上的虚拟盒子中，或在双启动系统上进行设置。\n\n## 为什么选择 Python？\n\nPYTHON 是黑客在网络安全领域开发工具时最偏爱的语言。你今天在网上找到的大多数共享工具，如端口扫描器、漏洞分析工具、密码破解器和执行暴力破解的脚本，都是用\
    \ PYTHON 编写的。如果你接触过 PYTHON，你可能遇到过或听说过 PYTHON API 和其他第三方模块，它们使得开发和集成你的模块和工具变得非常容易。\n\
    \n你在学习成为黑客的过程中应该学习用 PYTHON 编码的首要原因是，它被称为“懒惰程序员”的语言。与其他语言相比，你可以用更少的代码行完成巨大的任务，而其他语言需要更多的代码行来执行相同的任务。\n\
    \n除非你学会编写能实现你想要的功能的脚本，否则你将面临陷入“脚本小子”的风险，依赖其他熟练的黑客和程序员开发的工具来访问易受攻击的系统。依赖现成的脚本而不是自己编写，会降低你的漏洞利用的成功率，因为此类工具更容易被入侵检测系统\
    \ (IDS)、防病毒软件甚至执法部门检测到。\n\nPYTHON 的许多特性使其对于初露头角的黑客来说是一种非常有用的语言。数千个预构建库使其成为一种非常强大且功能丰富的脚本语言。还有成千上万的模块和数十万个你可以从\
    \ Github 等网站下载。\n\n现在我们已经掌握了所有基础知识，让我们来学习一些黑客技术吧。\n"
