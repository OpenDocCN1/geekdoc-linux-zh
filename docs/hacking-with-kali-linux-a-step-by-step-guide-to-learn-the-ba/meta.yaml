    keep in mind that the spider will follow absolutely every link it finds. This
    includes any logging out links. When that happens, the spider will actually log
    out of the website without letting you know. This means that if you aren’t careful,
    you might to lose out on potentially valuable information that wasn’t discovered
    because of the log out link. Always analyze the content that was spidered to make
    sure all the areas you are interested in were explored.'
  - '[PAGE 32]


    Spidering tools also allow you to command which directories of web pages should
    be focused on. This gives you more control and allows you to analyze the target
    with more accuracy.


    Analyzing Responses for Vulnerabilities

    The third most important functionality you need to look for is the ability to
    analyze the responses that are coming from web applications. This process is similar,
    but it is applied to web-based application. The goal is to find vulnerabilities.


    When you modify the variables with the help of the intercepting proxy, the target
    application will respond to you. The tool will then examine all of these responses
    to look for any kind of vulnerability in the application. Many vulnerabilities
    can be detected by an automated web-based vulnerability scanner, however some
    of them will not be noticed. Luckily for us, we are only interested in the ones
    that we can easily find. Why? Simply because a lot of them can be used to perform
    an SQL injection attack, for example. An automated tool might not find all of
    the critical vulnerabilities, but enough of them will prove to be useful to us.


    Spidering

    The concept of spidering is probably one of the most important ones in web hacking.
    In this discussion, we are going to be using a framework that is already installed
    on Kali, namely WebScarab. This tool is loved by many hackers and penetration
    testers because it is modular. This means you can customize it with the help of
    plugins until it fits your needs perfectly. Now let’s discuss more about WebScarab
    in its default configuration.


    As a result, we gain useful data that can be used to gain access to restricted
    pages or files. Open the terminal and let’s turn WebScarab on by typing:

    webscarab


    Don’t start unleashing the spiders just yet. First, you should make sure you are
    running the program with its “full-featured interface.” Some versions of the tool
    start up with the lite interface, and that isn’t good enough for our purposes.
    You can check to see if this option is ticked by clicking on the “Tools” tab.
    Now that the program is enabled, you will have to use a proxy by first configuring
    your browser. The purpose of this action is to'
  - '[PAGE 33]


    force all web traffic to run through WebScarab as if it''s a filter. The tool
    will then be able to manipulate any ongoing web traffic.


    In order to set the web browser to use a proxy, you need to go through its network
    options. In our example we will use Firefox, so go to Edit > Preferences and then
    click on the Advanced Tab, followed by the Network tab. If you are using a different
    browser, the settings path should be similar. Just look for any tab related to
    network options. Once you''re inside the Network menu, click on Settings. A Connection
    Settings window will open, and you will use it to configure Firefox to use WebScarab
    as a proxy. Now check the box for “Manual proxy configuration” and type 127.0.01
    inside the HTTP Proxy field. Next, you need to type 8008 in the Port field. Finally,
    you should check the “Use this proxy server for all protocols” box and then click
    “OK” to apply all of these settings.


    From now on, all web traffic will be directed through WebScarab as the middle
    man. However, keep in mind that the tool needs to be active for you to be able
    to browse through any websites. If you deactivate WebScarab, you will get a connection
    error whenever you try to go to a website because we configured the network settings
    to use it as a proxy. Another thing you need to keep in mind is that all websites
    will display an “invalid certificate” message. Do not pay any attention to that
    warning, because it''s normal to encounter it when using a proxy.


    Now that you''ve configured everything, you can start the spidering process. Type
    the web address of your target in the URL field. As soon as the website loads,
    it will run through WebScarab. In order to spider your target you need to right
    click on the URL inside the tool and select “Spider Tree.” You can now explore
    every file that is related to the website. Make sure to examine them well, because
    you might find some leaked information that can prove useful to your penetration
    test scope.


    # Intercepting Requests


    Remember that our WebScarab tool acts as the filter between your web browser and
    the target''s web server. All the Internet traffic is flowing through this tool,
    and this gives us the ability to interact with the data before it enters the browser
    and before it leaves as well. What does this mean for us? We gain the power to
    make any changes we want to any'
  - '[PAGE 34]


    information that is in transit.  There are still many websites out there that
    are developed with bad coding and rely on hidden fields to communicate information
    from  and to the web client. In such a case, the programmer probably assumed that
    the user could not possibly access these hidden fields.  However, with the help
    of a tool like WebScarab, we can manipulate this information.  Let''s discuss
    a scenario to gain a better understanding of how we can take advantage of this
    functionality.


    Let''s assume we are shopping for some fishing rods on an online store that has
    been badly coded as described above.  We browse through the website, choose our
    product, and add it to the shopping cart where we see we are going to be charged
    $100.  Now, if we are running a proxy server, we might see a hidden field that
    is used to send the value of $100 to the web server when the "add to cart" option
    was pressed.  Because we are running the website through WebScarab, we can see
    this hidden field and even modify the variable stored inside it.  We can simply
    change the $100 value to $1.  This is what can be achieved with the WebScarab
    tool, however, keep in mind that there aren''t that many websites around that
    are this badly coded.  No matter the case, it''s worth going through such an example
    to demonstrate the power of intercepting requests with the help of a program like
    WebScarab.


    Now let''s use this tool as an interceptor.  For this process you will need to
    switch WebScarab back to the lite interface.  Go to the Tools panel and select
    "Use lite Interface."  Next, you need to go to the "Intercepts" menu and check
    the options for "Intercept requests" and "Intercept responses."  Now switch to
    Firefox, or the browser of your choice.  You can now change the value of a field
    by allowing WebScarab to simply intercept the request and then finding the variable
    you want to change.  Type the new value, hit the ''Insert'' button, and you''re
    done!


    # SQL Injection Attacks


    Code injection attacks have been common in the online world for years.  There
    are many types of code injections, but since our purpose is to master the basics
    of hackings we will only discuss the SQL injection, which is a classic still being
    used today.  SQL Injections are used mostly to bypass web authentications, however,
    they can also be used to view and manipulate certain types of data.'
