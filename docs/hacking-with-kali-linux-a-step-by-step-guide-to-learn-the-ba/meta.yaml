    times, the ethical hackers are needed more than ever to protect and prevent hack
    attacks. The information available to everyone makes it all the easier for hack
    attacks, but it makes protection available as well.


    Hacking is not always black and white, and there are different types of hackers
    and types of hacking. The major types of hackers are divided between ethical,
    unethical, and somewhere in between.


    Kali Linux comes with just about every tool pre-installed that can be used for
    any of the above purposes. It is for this reason that Security Auditors, Forensics
    Investigators, Penetration Testers, and Researchers prefer it.


    This book covers topical issues like wireless network attacks, cyber-attacks,
    and penetration testing, among others. It, therefore, means that you are now in
    an excellent position to discern network attack mechanisms being perpetrated in
    the real world and recommend appropriate remedial measures.


    This guide will focus on the following:


    +   - How To Install The Kali Linux

    - Setting Up Your Hacking Lab

    - Essential Linux Terminal Commands

    - Web-Based Exploitation

    - Types of Penetration Testing

    - Hacking Wifi Passwords

