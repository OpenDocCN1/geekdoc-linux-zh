    Think of the process of making a purchase on an online store. Let''s say you''re
    after a fishing rod. You go to an online shop that sells outdoor products, and
    you type "fishing rod" in their search engine. After you hit the "search" button,
    the application will take your data (fishing rod) and build a query in order to
    search through the database for anything that contains the words "fishing rod."
    Anything with these keywords will be returned to you in the form of a result.


    By using SQL, we can interact with the information inside a database and even
    modify it if we choose to. Keep in mind, however, that there are several versions
    of SQL and not all online stores use the same one. For instance, a MySQL statement
    will not coincide with an MSSQL or Oracle statement. In this section, we will
    only discuss how to interact with applications that use SQL. If you understand
    the basics, you can always expand your knowledge by exploring MSSQL or MySQL as
    well.


    Here''s an example:


    ```

    SELECT * FROM product WHERE category = ''fishing rod'';

    ```


    In this example we have the first verb "SELECT" that instructs SQL to search inside
    a table. The "*" symbol is then used to return all the columns inside the table.
    The next word "FROM" is used to specify the table. Finally, we have "WHERE" to
    specify which row should be returned and displayed. In other words, the "SELECT"
    command will find the "product" table and return all the rows which contain the
    words "fishing rod" from the "category" column. What''s important to note in this
    query is that everything left of the equal sign (=) was created by the original
    programmer of the application, while everything on the left side is an instruction
    coming from the user.


    We can use this knowledge to cause the application to behave in an unintended
    way. Instead of typing "fishing rod" inside the search box of the website, let''s
    type:


    ‘fishing rod’ or 1 = 1--


    In this example we use single quotes to close the string that contains the words
    “fishing rod” and afterwards we add a command (1 = 1--) that will be executed.
    The “or” statement we added in the search box is actually a condition in SQL that
    is used to return records when either of the two statements is true. The “--“symbols
    at the end of the line are used to tell SQL that everything beyond it should be
    ignored. This is a way of preventing any other code from possibly meddling with
    our command. The new statement we made actually tells the program to return all
    the contents of the table where the category is equal to “fishing rod” or “1 =
    1”. Since the “1 = 1” statement is obviously true, we will receive everything
    that is contained inside the table. This might seem like a boring attack because
    instead of getting “fishing rod” results we simply received all the results, but
    it can be useful in a different scenario.


    Remember that SQL is used to perform authentication for many web applications.
    Let''s explore a different example. Let''s say a friend of yours created a website
