    How do you know when you have been hacked? Your computer will most likely decrease
    in its performance speed. You may also begin to notice files that are not supposed
    to be there. These files may increase in size as well as be modified without you
    ever touching them. You may also begin to notice that there are changes in your
    network settings or even frequent disk crashes.


    The only way that you''re going to be able to protect your computer is by installing
    a reliable antivirus software as well as making sure that your firewall is enabled
    before you begin to connect to the internet. Also, make sure that you install
    the system updates on a regular basis.'
- md: '## Chapter 12 I2P


    I2P, otherwise known as the "Invisible Internet Project" (https://en.wikipedia.org/wiki/Invisible_Internet_Project)
    is another option that people can use to hide their online IP address. It shares
    a lot of the same characteristics of other networks in that it routes traffic
    through neighboring peers. The developers have stated that their main goal is
    not necessarily one of 100% anonymity (a goal some say is impossible), but rather
    to make the system too troubling and expensive to attack from the outside. It
    is an anonymizing network with several layers of encryption wrapped around all
    the data that travels through the system.


    ### I2P vs Tor


    You might think this sounds a lot like Freenet, but the similarity is actually
    more like Tor''s network. I2P offers interactivity with websites, blogs, forums,
    chat, search engines and all without the need to install any of them locally.
    Such are the hallmarks of I2P. Websites that exist in the I2P network are called
    Eepsites, and are hosted anonymously with I2P being a strict requirement to access
    these websites. In that vein, it is similar to the .onion sites accessible only
    via Tor. Every PC that is connected to the I2P network shares in the forwarding
    of encrypted packets of data through proxies prior to the final destination. Each
    subsequent proxy prunes a layer of encryption at various intervals until encryption
    is removed. The bottom line is this: No one knows the origin of said packets,
    a trait also shared by Tor. While it is true that both Tor and I2P have different
    goals in mind, there exists many similarities:


    - Both exist as anonymizing networks

    - Both use layered encryption to funnel data

    - Both have hidden services

    - Tor has Exit Nodes and I2P has Outproxies


    ### Benefits of Tor over I2P


    - Larger user base than I2P; support from academic sources, constant improvements
    in stability and resistance to attacks

    - Funding is sourced from many countries around the globe

    - Large number of Exit Nodes

    - Translated into many languages

    - Optimized for Exit Traffic

    - Memory more optimized than I2P

    - Written in C


    ## Benefits of I2P over Tor


    - Hidden Services much faster than the Tor network.

    - Not as many DOS (denial of service) attacks as Tor.

    - Compatible with peer-to-peer file sharing (Tor is not).

    - Tor tunnels last a long time compared to I2P. This ensures less attacks as the
    number of samples a hacker may use are limited.

    - Every peer routes data for others.

    - Offers TCP/UDP.

    - Written in Java.


    As you can see, both networks are safe enough for anonymity, as long as you aren''t
    a world-hunted target. To this, a user''s anonymity is typically broken due to
    their own sloppy behavior--their overconfidence being the weakest link in most
    cases (using the same login names on many websites, mixing these with Tor and
    non-Tor websites, and enabling JavaScript/Flash). Since I2P is not built to act
    as a proxy to the WWW, you should use Tor if you want to surf anonymously. The
    outproxies on I2P, as you''ve probably guessed, are similar to the exit nodes
    on Tor, but they do not have the greatest support and tend to be unstable. Thus
    you should use Tor for anonymous web browsing and I2P for I2P eepsites. One option
    is to use Foxy Proxy (https://addons.mozilla.org/en-US/firefox/addon/foxyproxy-standard/)
    to test it yourself. Be aware however that since there are fewer outproxies than
    Tor exit nodes, it may be easier for an adversary to identify your activities.
    It all depends on how much risk you want to assume and what the ramifications
    are if you are caught (and in which country).


    You can also use I2P for BitTorrent and iMule as well as other P2P applications.
    Like Freenet, you will find that I2P will grow in speed the longer you use it
    without interruption. Torrents will be faster. Data will come down like lightning.
    Tor users will thank you for it. There are already too many torrent users on Tor
    that clog the network and make it difficult for people in dire straits who need
    anonymity for their political actions far more than the next Incubus CD.


    While I2P is a technical powerhouse for anonymity, it can be a bit like a house
    of cards. Once the Ace is pulled from the bottom layer (by you), it can be rendered
    moot. I2P is just a tool, as is Tor and Freenet. It is not an invisibility cloak.
    Do something stupid, like move too much when a pack of Orcs are looking your way,
    you''re bound to get an arrow in a place where you least expect it. Thus, act
    smart by being proactive in anonymity:


    ### 1.) Turn Off Javascript


    Yes, it bears repeating, with arms waving in the air and shouting at the top of
    our lungs. Javascript is the bane of not only Tor, but other networks that rely
    on cloaking your IP address. Leaving this beastly plugin ON allows code to be
    run on your machine, code that will decloak you. Look at your browser settings
    and disable it. Also disable cookies. Super cookies are deployed in the wild to
    track down Tor users. Don''t let it happen to you on I2P. Javascript can reveal
    a ton of metrics that fingerprint a user. Display resolution, page width, font
    and so on can be sent to an adversary by stealth. If you''re in doubt, take a
    look at the web API at Mozilla:


    [https://developer.mozilla.org/en-US/docs/Web/API](https://developer.mozilla.org/en-US/docs/Web/API)


    ### 2.) Silence is Golden!


    Don''t say a peep. Sure, you can talk. But refrain from discussing: the weather,
    your geography, your hobbies, your city politician that was just arrested for
    soliciting hookers. If someone says, "How''s the weather in your town?" You say:
    "Sunny." Every time. Alternatively, you may misinform. The CIA does it, why can''t
    you? Their entire organization is built on secrecy and deception. Don''t get too
    choked up about a few white lies. Spreading misinformation about trivial things
    like the weather and the local politics can really put a nail in an adversary''s
    coffin. Ditto on employment. If you are asked about your work and you''re a programmer,
    say you''re a mail sorter down at the Post Office. They''re not going to ask you
    about the latest Elvis stamp.


    ### 3.) Rotate Usernames/Nics


    The desire for convenience often gets people in trouble. They use the same usernames
    on multiple sites/forums. That''s fine for the daytime, open web. Not so much
    for the darknet. It breaks anonymity. Take forums for example. When your username
    becomes infamous for a wealth of knowledge, change it. Create a new one. Don''t
    tell anyone. Entropy rises when many users swap information like this on a frequent
    basis. Maintain separate personas: one for the darknet, one for regular internet.
    Memorization is better than writing it down.


    ### 4.) Never turn off your router


    I never turn mine off. Ever. If it is constantly going on and off while Freenet,
    Tor, I2P or IRC is running, after a while clues will surface as to who I really
    am, provided a sufficiently determined adversary has the resources to do it (NSA).
    The cost in power is negligible, so don''t go cheap with anonymity. As the saying
    goes: out of speed, anonymity and reliability, you can only pick two, but make
    up for the lost component by acting *smart*.


    ### 5.) Power in Numbers: Bandwidth


    Don''t be stingy with your connection. The more you participate in the storm of
    users (Freenet, I2P), the more cloaked you will be. It is better to run 24/7 if
    you can. This makes it more difficult for an adversary to discern if you sent
    a file to someone else, or if you are merely the middle man to some file sent
    by a total unknown on the other side of the globe. Besides this, leaving the program
    running just makes it a lot faster network in general for other users. Think *Safety
    in Numbers*.


    ### 6.) Optional (but smart)


    In the browser settings, set `browser.safebrowsing.enabled` and `browser.safebrowsing.malware.enabled`
    to false. Search goliaths like Google and Microsoft do not need to know the website
    URLs you visit.


    Get into the habit of flushing the cache--cookies, etc. You can set this to do
    it automatically upon exit of the browser.


    Refrain from using Foxy Proxy to selective proxy .i2p links. You don''t want to
    be sent to the clearnet. If an I2P website is a honeypot, your Firefox browser
    can send a unique identifier in the referrer, in which case... anonymity broken.


    At this point you''re probably thinking this is way more headaches than it is
    worth. And you''d be right...in the beginning. But anything worth doing is usually
    hard at the outset. I as well as my colleagues do all of these things only because
    we have done them for years. We do them every day. Are we thinking about them?
    No, not in the least on account of smart habits done daily. Do you think intently
    about starting your car? Pulling out of the driveway? No. But it''s a good bet
    you were petrified to do it when you were sixteen. And pulling out of your driveway
    is a very complex action, as are the aforementioned suggestions. Just one of your
    brain cells is more complex than a 747. Don''t waste any of them.


    ## Torrents and Eepsites


    First things first. Install not only the NoScript plugin, but also the Cookie
    Whitelist (Buttons). Ideally you want to block everything when surfing Eepsites.
    There are a multitude of add-ons on the Firefox site but you do not need all of
    them. You only need the ones that preserve your anonymity.


    Install QuickProxy, also at the Firefox site. Restart. Then open the proxy settings
    using the edit tab and then browse to "Preferences" and "Advanced". Then "Settings".
    Change your proxy settings to:'
  mdcn: '

    ## 第12章 I2P


    I2P，亦称“隐形互联网项目”（https://en.wikipedia.org/wiki/Invisible_Internet_Project），是人们用于隐藏在线IP地址的另一种选择。它与其他网络共享许多相同特性，即通过相邻节点路由流量。开发者表示，他们的主要目标并非实现100%的匿名性（有人认为这不可能），而是使系统从外部攻击起来过于棘手且成本高昂。这是一个匿名网络，通过系统传输的所有数据都包裹着多层加密。


    ### I2P 与 Tor 的比较


    你可能觉得这听起来很像Freenet，但相似性其实更接近Tor网络。I2P提供与网站、博客、论坛、聊天和搜索引擎的交互功能，且无需在本地安装任何此类服务。这些都是I2P的标志性特征。存在于I2P网络中的网站被称为Eepsites，它们通过I2P进行匿名托管，访问这些网站严格要求使用I2P。从这个意义上说，它类似于只能通过Tor访问的.onion网站。每一台连接到I2P网络的PC都参与转发加密数据包，在最终目的地之前通过代理传递。每个后续代理在不同间隔剥离一层加密，直到加密完全移除。关键在于：无人知晓这些数据包的来源，这也是Tor共有的特性。虽然Tor和I2P的目标确实不同，但存在许多相似之处：


    - 两者都作为匿名网络存在

    - 两者都使用分层加密来传输数据

    - 两者都有隐藏服务

    - Tor有出口节点，I2P有出站代理


    ### Tor 相对于 I2P 的优势


    - 用户基础比I2P更大；获得学术机构支持，稳定性和抗攻击能力持续改进

    - 资金来源于全球多个国家

    - 拥有大量出口节点

    - 已翻译成多种语言

    - 针对出口流量进行优化

    - 内存优化优于I2P

    - 使用C语言编写


    ### I2P 相对于 Tor 的优势


    - 隐藏服务速度远快于Tor网络。

    - 遭受拒绝服务攻击的次数少于Tor。

    - 兼容P2P文件共享（Tor不支持）。

    - Tor隧道持续时间比I2P长得多。这减少了攻击机会，因为黑客可用的样本数量有限。

    - 每个节点都为他人路由数据。

    - 提供TCP/UDP支持。

    - 使用Java编写。


    如你所见，两个网络对匿名性来说都足够安全，只要你不是全球通缉的目标。通常，用户的匿名性会因其自身疏忽行为而被打破——在大多数情况下，他们的过度自信是最薄弱的环节（在多个网站使用相同登录名，将其与Tor和非Tor网站混用，以及启用JavaScript/Flash）。由于I2P并非设计为WWW的代理，如果你想匿名浏览网页，应该使用Tor。I2P上的出站代理，正如你可能猜到的，类似于Tor的出口节点，但它们获得的支持较少，且往往不稳定。因此，你应该用Tor进行匿名网页浏览，用I2P访问I2P的Eepsites。一个选择是使用Foxy
    Proxy（https://addons.mozilla.org/en-US/firefox/addon/foxyproxy-standard/）自己测试。但请注意，由于出站代理数量少于Tor出口节点，对手可能更容易识别你的活动。这完全取决于你愿意承担多少风险，以及如果被抓获（在哪个国家）会有什么后果。


    你也可以将I2P用于BitTorrent和iMule以及其他P2P应用。与Freenet类似，你会发现I2P的使用时间越长且不间断，速度就越快。种子下载会更快。数据将如闪电般下载。Tor用户会为此感谢你。Tor上已经有太多种子用户，他们堵塞了网络，使得那些比下一张Incubus
    CD更需要匿名进行政治行动的人们陷入困境。


    虽然I2P是匿名性的技术利器，但它可能有点像纸牌屋。一旦从底层抽出一张A（由你），它就可能变得无用。I2P只是一个工具，Tor和Freenet也是如此。它不是隐形斗篷。做一些愚蠢的事情，比如在一群兽人看向你方向时移动太多，你肯定会被一支箭射中最意想不到的地方。因此，通过主动采取匿名措施来明智行事：


    ### 1.) 关闭Javascript


    是的，这值得重复，我们挥手强调并大声疾呼。Javascript不仅是Tor的克星，也是其他依赖隐藏IP地址网络的祸害。让这个可怕的插件保持开启状态允许代码在你的机器上运行，这些代码会揭露你。查看你的浏览器设置并禁用它。同时禁用Cookie。超级Cookie已被部署在野外用于追踪Tor用户。不要让它在I2P上发生在你身上。Javascript可以泄露大量用户指纹的度量标准。显示分辨率、页面宽度、字体等都可以被偷偷发送给对手。如果你有疑问，请查看Mozilla的Web
    API：


    [https://developer.mozilla.org/en-US/docs/Web/API](https://developer.mozilla.org/en-US/docs/Web/API)


    ### 2.) 沉默是金！


    别吭声。当然，你可以说话。但请避免讨论：天气、你的地理位置、你的爱好、你所在城市刚因嫖娼被捕的政治人物。如果有人问，“你镇上的天气怎么样？”你就说：“晴天。”每次都这样。或者，你可以提供错误信息。中情局这么做，你为什么不行？他们的整个组织都建立在保密和欺骗之上。不要对一些善意的谎言过于内疚。散布关于天气和地方政治等琐事的错误信息，真的能让对手束手无策。就业情况也一样。如果你被问到工作，而你是个程序员，就说你在邮局当分拣员。他们不会问你关于最新的猫王邮票的事。


    ### 3.) 轮换用户名/昵称


    对便利性的渴望常常让人陷入麻烦。他们在多个网站/论坛使用相同的用户名。这对白天开放的网络来说没问题。但对暗网来说就不那么合适了。它会打破匿名性。以论坛为例。当你的用户名因知识渊博而臭名昭著时，换一个。创建一个新的。别告诉任何人。当许多用户频繁地像这样交换信息时，熵值会上升。维护不同的身份：一个用于暗网，一个用于普通互联网。记在心里比写下来好。


    ### 4.) 永远不要关闭你的路由器


    我从不关闭我的路由器。永远不关。如果在运行Freenet、Tor、I2P或IRC时，它不断开关，那么过一段时间，只要有一个足够坚定且拥有资源的对手（如美国国家安全局），就会发现关于我真实身份的线索。电力成本可以忽略不计，所以不要在匿名性上吝啬。正如俗话所说：速度、匿名性和可靠性，你只能选两个，但可以通过*明智*行事来弥补缺失的那一项。


    ### 5.) 人多力量大：带宽


    不要吝啬你的连接。你越是参与到用户风暴中（Freenet、I2P），你就越会被掩盖。如果可能，最好24/7运行。这使得对手更难分辨是你向他人发送了文件，还是你只是地球另一边某个完全陌生者发送文件的中间人。除此之外，让程序保持运行只是让整个网络对其他用户来说快得多。想想*人多力量大*。


    ### 6.) 可选（但明智）


    在浏览器设置中，将`browser.safebrowsing.enabled`和`browser.safebrowsing.malware.enabled`设置为false。谷歌和微软等搜索巨头不需要知道你访问的网站URL。


