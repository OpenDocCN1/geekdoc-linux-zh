- md: "\n# Creating a User Profile\n\nTo create a user profile, click on the box labeled\
    \ \"Your name\" and enter your name.\n\nAs you type in the box next to \"Your\
    \ name,\" the box next to \"Your computer's name\" will automatically fill in.\n\
    \nNext, click on the box labeled \"Pick a username\" and enter a username of your\
    \ choice.\n\nThen, click on the box labeled \"Choose a password\" and select a\
    \ password that is highly secure and easily remembered.\n\nActivate the switch\
    \ next to \"Require my password to log in.\"\n\nFinally, click on the \"Continue/Install\"\
    \ button to proceed.\n\n# Completing the Installation\n\nWait patiently until\
    \ the installation process is complete.\n\nOnce the installation is finished,\
    \ click on the \"Restart Now\" button.\n\nAfter the restart, make sure to remove\
    \ the USB drive before the motherboard BIOS logo becomes visible.\n\n# CONFIGURING\
    \ THE BOOT SEQUENCE\n\nTo select a boot entry on an MSI MAG B550 TOMAHAWK motherboard,\
    \ follow these detailed instructions:\n\n- 1. After removing the USB drive, press\
    \ the designated key (F10 or other) for accessing the motherboard BIOS, either\
    \ once, repeatedly, or steadily, before the motherboard BIOS logo becomes visible.\
    \ This will allow you to enter the BIOS.\n- 2. Once inside the BIOS, navigate\
    \ to the boot menu options.\n- 3. Locate the USB drive within the boot queue and\
    \ move it towards the end of the list. This will ensure that the system prioritizes\
    \ other boot options before attempting to boot from the USB drive.\n- 4. Switch\
    \ to Advanced Mode within the BIOS settings.\n- 5. Within the Advanced Mode, find\
    \ and select the Settings option.\n- 6. From the Settings menu, locate and select\
    \ the Boot option.\n\n- 7. Within the Boot menu, search for the UEFI Hard Disk\
    \ Drive Priorities.\n- 8. Select the first entry within the UEFI Hard Disk Drive\
    \ Priorities.\n- 9. Use the arrow keys to navigate and highlight the Ubuntu option.\n\
    - 10. Press the ENTER key to confirm the selection of Ubuntu as the desired boot\
    \ entry.\n- 11. Save the changes made in the BIOS settings.\n\nExit the BIOS and\
    \ allow the system to restart.\n\n# INITIATING YOUR FIRST LOGIN\nEXPERIENCE IN\
    \ LINUX MINT\n21.3: A STEP-BY-STEP GUIDE\n\nTo effectively guide users through\
    \ the initial login process for Linux Mint 21.3, the following steps should be\
    \ detailed:\n\n- 1. **Username Selection**: Click on the username that was established\
    \ during the installation phase.\n- 2. **Password Entry**: Enter the password\
    \ that corresponds to the chosen username, then proceed by clicking on the \"\
    Let's go!\" button.\n- 3. **Activating Dark Mode**: Locate the switch situated\
    \ between the symbols representing sunrise and sunset. Move this switch to the\
    \ right to enable dark mode.\n- 4. **Startup Dialogue Management**: Find and untick\
    \ the box adjacent to \"Show this dialogue at startup,\" then click on the X symbol\
    \ to close the dialogue.\n- 5. **Update Manager Shutdown**: Navigate to the taskbar\
    \ and perform a right-click on the Update Manager icon. Conclude this process\
    \ by selecting \"Quit.\"\n\nThese instructions are designed to provide a clear\
    \ and concise walkthrough for users during their first login experience with Linux\
    \ Mint 21.3, ensuring a smooth and user-friendly setup.\n\n# EMPOWERING USER PRIVILEGES:\n\
    GRANTING SUDO ACCESS\n\nTo execute the desired actions in a technical and precise\
    \ manner, follow these instructions:\n\n- 1. Open the terminal and enter the following\
    \ command:\n   - sudo usermod -aG sudo [replace \"username\" with the desired\
    \ username]\n- 2. Once the previous command is executed, enter the following command:\n\
    \   - exit\n- 3. Locate the power button in the top right corner and click on\
    \ it.\n- 4. A drop-down menu will appear, click on the power button option.\n\
    - 5. Another menu will appear, select the \"Restart\" option.\n\nAlternatively,\
    \ if you prefer a different approach, follow these steps:\n\n- 1. Open the terminal\
    \ and enter the following command:\n   - sudo reboot\n- 2. Please note that using\
    \ sudo reboot now may cause the system to restart quickly and without proper respect\
    \ for running processes. This can lead to errors in the kernel.\n- 3. In case\
    \ of any issues caused by a disrespectful restart, it may be necessary to load\
    \ the current kernel in recovery mode through the GRUB.\n"
  mdcn: "\n\n# 创建用户配置文件\n\n要创建用户配置文件，点击标有“您的名称”（Your name）的框并输入您的姓名。\n\n当你在“您的名称”旁边的框中输入时，“您的计算机名称”（Your\
    \ computer's name）旁框将自动填充。\n\n接下来，点击带有“选择用户名”（Pick a username）的框并输入您选择的用户名。\n\n\
    然后，点击带有“选择密码”（Choose a password）的框，选择一个高安全且易记的密码。\n\n开启“登录时需要密码”（Require my password\
    \ to log in）旁开关。\n\n最后，点击“继续/安装”（Continue/Install）按钮继续。\n\n# 完成安装\n\n耐心等待安装过程完成。\n\
    \n安装完成后，点击“立即重启”（Restart Now）按钮。\n\n重启后，请确保在主板 BIOS 标志出现之前移除 USB 驱动器。\n\n# 配置启动序列\n\
    \n要在 MSI MAG B550 TOMAHAWK 主板上选择启动项，请遵循以下详细说明：\n\n- 1. 移除 USB 驱动器后，在主板 BIOS 标志出现之前，一次、多次或连续按下指定的键（F10\
    \ 或其他键）以进入主板 BIOS。这将允许你进入 BIOS。\n- 2. 进入 BIOS 后，导航到启动菜单选项。\n- 3. 在启动队列中找到 USB\
    \ 驱动器并将其移动到列表末尾。这将确保系统在尝试从 USB 驱动器启动之前优先考虑其他启动选项。\n- 4. 在 BIOS 设置中切换到高级模式（Advanced\
    \ Mode）。\n- 5. 在高级模式下，找到并选择设置（Settings）选项。\n- 6. 从设置菜单中找到并选择启动（Boot）选项。\n\n- 7.\
    \ 在启动菜单中，搜索 UEFI 硬盘优先级（UEFI Hard Disk Drive Priorities）。\n- 8. 选择 UEFI 硬盘优先级中的第一项。\n\
    - 9. 使用方向键导航并高亮 Ubuntu 选项。\n- 10. 按回车键确认选择 Ubuntu 为所需的启动项。\n- 11. 保存 BIOS 设置中所做的更改。\n\
    \n退出 BIOS 并让系统重启。\n\n# 启动首次登录\nLINUX MINT 体验\n21.3: 分步指南\n\n为了有效地引导用户完成 Linux\
    \ Mint 21.3 的首次登录过程，应详细说明以下步骤：\n\n- 1. **选择用户名**：点击安装阶段建立的用户名。\n- 2. **输入密码**：输入与选择用户名对应的密码，然后点击“开始吧！”（Let's\
    \ go！）按钮继续。\n- 3. **激活深色模式**：找到日出和日落符号之间的开关。将此开关向右移动启用深色模式。\n- 4. **管理启动对话框**：取消勾选“启动时显示此对话框”（Show\
