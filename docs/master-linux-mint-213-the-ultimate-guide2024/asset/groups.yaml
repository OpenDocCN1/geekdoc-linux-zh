    Virt-manager, developed mainly by Red Hat, is a desktop tool for managing virtual
    machines (VMs) via libvirt. It supports creating, editing, starting, and stopping
    VMs, alongside viewing their performance and console. It''s compatible with KVM,
    Xen, QEMU, LXC containers, and even FreeBSD''s bhyve hypervisor since 2014. Its
    suite includes virt-install for easy VM setup, virt-viewer for interacting with
    VM displays, virt-clone for cloning VMs, virt-xml for editing VM configurations,
    and virt-bootstrap for setting up libvirt-based containers'' root file systems.


    ## Oracle VirtualBox


    Visit the official Oracle VirtualBox website at https://www.virtualbox.org/ for
    all things Oracle VirtualBox.


    Installing Oracle VirtualBox via APT Repository in the Terminal:


    Just type these commands:


    ```

    sudo apt update

    ```


    ```

    sudo nano /etc/apt/sources.list

    ```


    Add the following to the above, sources.list file, at the below of said file:


    deb [arch=amd64 signed-by=/usr/share/keyrings/oracle-virtualbox-2016.gpg] https://download.virtualbox.org/virtualbox/debian
    jammy contrib


    Save, by pressing, CTRL + S, then Exit, by pressing, CTRL + X.


    Proceed to run the following command(s) in the terminal:


    ```

    wget -O https://www.virtualbox.org/download/oracle_vbox_2016.asc | sudo gpg --yes
    -- output /usr/share/keyrings/oracle-virtualbox-2016.gpg --deararm

    ```


    ```

    sudo apt update

    ```


    ```

    sudo apt install virtualbox-7.0

    ```


    ## Installing Oracle VirtualBox via .deb from the GUI:


    Navigate to the release page at:


    https://www.virtualbox.org/wiki/Linux_Downloads


    Click The Latest Ubuntu 22.04 to Download Oracle VirtualBox


