    # Default Systemd Timeout


    Visit the official Systemd website at https://systemd.io/ for all things Systemd.


    Default Systemd Timeout Setup Via Command Line & GUI:


    Just type these commands:


    ```

    sudo apt update

    ```


    ```

    cd /etc/systemd/

    ```


    ```

    sudo gedit system.conf

    ```


    Amend the above, system.conf, file with the below changes:


    Change the following line from:


    ```

    #DefaultTimeoutStartSec=90s

    ```


    To:


    ```

    DefaultTimeoutStartSec=30s

    ```


    Save progress by Clicking Save, or Clicking File and Clicking Save or Clicking
    the ≡ icon and Clicking Save As and Clicking Save, then Exit.


    Proceed to run the following command(s) in the terminal:


    ```

    sudo systemctl daemon-reload

    ```'
