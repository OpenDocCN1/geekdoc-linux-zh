- md: "\n# CONFIGURING BIOS FOR USB BOOT\nPRIORITY: A STEP-BY-STEP GUIDE\n\nBased\
    \ on personal experience with the MSI MAG B550 Tomahawk motherboard, here is a\
    \ detailed explanation of the steps to configure the motherboard BIOS settings\
    \ and disable secure boot:\n\n- **1. Insert USB Drive**: Begin by inserting the\
    \ USB drive into the appropriate port on the motherboard.\n- **2. Power On/Restart\
    \ Computer**: Power on or restart the computer.\n- **3. Access BIOS Screen**:\
    \ During the boot process, press the necessary key or combination of keys (usually\
    \ DEL, F2, F10) to access the motherboard screen.\n- **4. Configure Boot Order**:\
    \ Once you have entered the motherboard BIOS screen, locate the option to configure\
    \ the boot order. Move the USB drive or USB disk to the leftmost position to ensure\
    \ it will be the first device to boot.\n- **5. Prioritize USB Drive in Boot Menu**:\
    \ Additionally, navigate to the boot selection menu and prioritize the USB drive\
    \ by moving it to the top of the list.\n- **6. Disable Secure Boot**:\n    - a)\
    \ Switch to Advanced mode if necessary.\n    - b) Click on the \"Settings\" option.\n\
    \    - c) Look for the \"Windows OS Configuration\" section.\n    - d) Within\
    \ this section, locate the \"Secure Boot\" setting.\n    - e) Change the setting\
    \ to \"Disabled\" to disable secure boot.\n- **7. Save BIOS Configuration**: Once\
    \ you have made the desired changes to the motherboard BIOS settings, it is important\
    \ to save the configuration.\n- **8. Save and Apply Changes**: Locate the option\
    \ to save the BIOS configuration and select it. This will ensure that your changes\
    \ are applied.\n- **9. Reboot System**: Reboot the system to complete the configuration\
    \ process.\n\nQuick Save and Restart: Alternatively, you can press the F10 key\
    \ to save the BIOS configuration and automatically restart the system.\n\n# INITIATING\
    \ THE BOOT SEQUENCE FOR LINUX MINT 21.3 ISO\n\nTo install Linux Mint 21.3 using\
    \ a Ventoy USB drive, follow these step-by-step instructions:\n\n1. Boot your\
    \ computer from the Ventoy USB drive.\n2. Once the Ventoy menu appears, navigate\
    \ to and select the Linux Mint 21.3 ISO file.\n3. Press the ENTER key to proceed.\n\
    4. In the subsequent menu, select the option for 'grub mode'.\n5. Press ENTER\
    \ again to confirm your choice.\n6. Next, find and select the option labeled 'Start\
    \ Linux Mint 21 Install'.\n7. Press ENTER one final time to begin the installation\
    \ process.\n\nThese steps will guide you through the initial setup to install\
    \ Linux Mint 21.3 from a Ventoy USB drive.\n\n# STEP-BY-STEP GUIDE TO INSTALLING\
    \ LINUX MINT 21.3: FROM KEYBOARD SELECTION TO FINAL REBOOT\n\nWhen installing\
    \ Linux Mint 21.3 using the ubiquity-based installer, the process involves a few\
    \ key steps. This includes selecting your keyboard layout, deciding whether to\
    \ include multimedia codecs, choosing the type of installation, configuring your\
    \ timezone, creating a user account, and finally, rebooting your computer after\
    \ the installation is complete. This summary provides a high-level view of the\
    \ process without delving into detailed instructions.\n\n# Choosing the Correct\
    \ Keyboard Layout in Linux Mint\n\n# Installation: Steps and Significance\n\n\
    To begin the process of installing Linux Mint, follow these detailed steps:\n\n\
    1. Initiate the installation process by double-clicking on the 'Install Linux\
    \ Mint' option.\n2. When prompted to select a keyboard layout, navigate to the\
    \ left side of the screen and choose the appropriate layout. For instance, you\
    \ might select 'English (UK)'.\n3. Next, select the corresponding keyboard sub-layout\
    \ on the right side of the screen. In this case, you would also choose 'English\
    \ (UK)'.\n4. Once the keyboard layout and sub-layout are correctly selected, proceed\
    \ by clicking on the 'Continue' button to move forward with the installation process.\n\
    \n# Making an Informed Decision on Installing Multimedia Codecs\n\nPlease select\
    \ the checkbox labeled 'Install multimedia codecs' and then proceed by clicking\
    \ on the 'Continue' button.\n\n# Exploring Installation Options: A Guide to Linux\
    \ Mint 21.3 'VIRGINIA' Setup\n\nIn the ubiquity-based Linux Mint 21 Installer,\
    \ there are three installation options available:\n\n- **Install alongside existing\
    \ operating system**: This option allows you to quickly and conveniently install\
    \ Linux Mint 21 alongside another operating system on the same disk. It does not\
    \ require any data removal or partition modification.\n- **Erase disk and install\
    \ Linux Mint**: By choosing this option, you will completely remove all data on\
    \ the disk and install Linux Mint 21.3 'VIRGINIA' with predetermined partition\
    \ sizes. This option is suitable for those who want a fresh installation without\
    \ preserving any existing data.\n- **Something else**: This option provides more\
    \ advanced features for disk management. It allows you to create, resize, and\
    \ modify partitions on the selected disk. With this option, you have more control\
    \ over the partitioning process, including the ability to specify volume sizes\
    \ and types. It is recommended for users who have a deeper understanding of disk\
    \ management and want to create a customized and functional system.\n\nWhile the\
    \ first two options, installing alongside an existing operating system and erasing\
    \ the disk, offer easier installation processes, this discussion will focus on\
    \ the 'Something else' option. This option provides a more comprehensive understanding\
    \ of disk management, partitioning, and volume configurations necessary for creating\
    \ a fully functional Linux Mint 21 system.\n\n# Choosing 'Install Alongside' and\
    \ 'Erase Disk': A Comprehensive Guide\n\nTo complete the installation, follow\
    \ these steps:\n\n1. Locate and click on \"Install Now\".\n2. Review the changes\
    \ that will be made to disks.\n3. Once you have reviewed the changes, click on\
    \ \"Continue\".\n\n# Opting for 'Something Else' Alternative: A Detailed Guide\n\
    \nTo set up partitions on a 1TB NVME SSD, follow these steps:\n\n- Create an EFI\
    \ partition (512 MB).\n- Allocate 7160 MB for the SWAP partition.\n- Use the remaining\
    \ space for the Root filesystem (/) formatted as Ext4 journaling file system.\n\
    Review the changes.\n\n# New Partition Table Creation\n\nSelect the disk you wish\
    \ to partition. If the selected disk does not have a partition table, click 'New\
    \ Partition Table', then 'Continue'. Choose 'free space'.\n\n# EFI Partition Setup\n\
    \nClick '+' to create a new partition. In the 'Size' field, enter 1024 MB. Toggle\
    \ the switch to 'Primary' to on. Toggle the switch to 'Beginning of this space'\
    \ to on. In the 'Use as' field, select 'EFI'. Click 'OK' to confirm.\n\n# SWAP\
    \ Partition Configuration\n\nClick '+' to add another partition. In the 'Size'\
    \ field, enter 7160 MB. Toggle the switch to 'Primary' to on. Toggle the switch\
    \ to 'Beginning of this space' to on. In the 'Use as' field, select 'swap area'.\
    \ Click 'OK' to confirm.\n\n# Root Filesystem Partition (/):\n\nClick '+' to create\
    \ a new partition. For 'Size', use the remainder of the free space. Toggle the\
    \ switch to 'Primary' to on. Toggle the switch to 'Beginning of this space' to\
    \ on. In the 'Use as' field, select Ext4 journaling file system. In the 'Mount\
    \ point' field, enter '/'. Click 'OK' to confirm.\n\n# Finalizing Installation:\n\
    \nClick 'Install Now'. Review the changes to the disks to ensure they are as intended.\
    \ Click 'Continue' to proceed. By following these steps, you can effectively your\
    \ your 1TB NVME SSD for optimal performance and organization.\n\n# Setting the\
    \ Timezone\n\nTo choose a timezone, either select the desired location on the\
    \ map or enter the name of the city in the box provided below the world map. Once\
    \ you have selected the timezone, click on the \"Continue\" button to proceed.\n"
  mdcn: "\n\n# 配置 BIOS 以 USB 启动\n优先级：分步指南\n\n基于对 MSI MAG B550 Tomahawk 主板的个人经验，以下是配置主板\
    \ BIOS 设置并禁用安全启动（Secure Boot）的详细步骤：\n\n- **1. 插入 USB 驱动器**：首先将 USB 驱动器插入主板上相应的端口。\n\
    - **2. 开机/重启电脑**：开启电源或重启电脑。\n- **3. 进入 BIOS 界面**：在启动过程中，按下所需的键或组合键（通常为 DEL、F2、F10）进入主板设置界面。\n\
    - **4. 配置启动顺序**：进入主板 BIOS 界面后，找到配置启动顺序的选项。将 USB 驱动器或 USB 磁盘移动到最左侧，以确保它是第一个启动设备。\n\
    - **5. 在启动菜单中优先考虑 USB 驱动器**：此外，导航到启动选择菜单并将 USB 驱动器移动到列表顶部以优先排序。\n- **6. 禁用安全启动**：\n\
    \    - a) 如必要，切换到高级模式（Advanced mode）。\n    - b) 点击“Settings”（设置）选项。\n    - c)\
    \ 寻找“Windows OS Configuration”（Windows OS 配置）部分。\n    - d)在此部分内找到“Secure Boot”（安全启动）设置。\n\
    \    - e) 将设置改为“Disabled”（禁用）以关闭安全启动。\n- **7. 保存 BIOS 配置**：完成主板 BIOS 设置更改后，必须保存配置。\n\
    - **8. 保存并应用更改**：找到保存 BIOS 配置的选项并选择它。这将确保您的更改生效。\n- **9. 重启系统**：重启系统以完成配置过程。\n\
    \n快速保存并重启：或者，你可以按 F10 键保存 BIOS 配置并自动重启系统。\n\n# 为 LIN MINT 21.3 ISO 启动序列\n\n若要使用\
    \ Ventoy USB 驱动器安装 Linux Mint 21.3，请遵循以下分步说明：\n\n1. 从 Ventoy USB 驱动器启动电脑。\n2.\
    \ Ventoy 菜单出现后，导航并选择 Linux Mint 21.3 ISO 文件。\n3. 按下 ENTER 键继续。\n4. 在随后的菜单中，选择\
    \ 'grub mode' 选项。\n5. 再次按 ENTER 确认选择。\n6. 接下来，找到并选择标记为 'Start Linux Mint 21 Install'\
    \ 的选项。\n7. 最后一次按 ENTER 开始安装过程。\n\n这些步骤将引导你完成从 Ventoy USB 盘安装 Linux Mint 21.3 的初始设置。\n\
    \n# 安装 LINUX MINT 21.3 的分步指南：从键盘选择到最终重启\n\n使用基于 ubiquity 的安装程序安装 Linux Mint 21.3\
    \ 时，过程涉及几个关键步骤。这包括选择键盘布局、决定是否包含多媒体解码器、选择安装类型、配置时区、创建用户账户，以及最后在安装完成后重启电脑。本摘要提供了该过程的层级概览，不涉及详细操作说明。\n\
    \n# 在 Linux Mint 中选择正确的键盘布局\n\n# 安装：步骤与意义\n\n要开始安装 Linux Mint 程序，请遵循以下详细步骤：\n\n\
    1. 双击“Install Linux Mint”选项启动安装过程。\n2. 当系统提示选择键盘布局时，导航到屏幕左侧并选择合适的布局。例如，你可能会选择“English\
    \ (UK)”。\n3. 接下来，在屏幕右侧选择相应的键盘子布局。在这种情况下，你也将选择“English (UK)”。\n4. 一旦键盘布局和子布局被正确选择，点击“Continue”（继续）按钮继续安装过程。\n\
    \n# 关于安装多媒体解码器做出明智决策\n\n请勾选标记为“Install multimedia codecs”（安装多媒体解码器）的复框，然后点击“Continue”按钮继续。\n\
    \n# 探索安装选项：Linux Mint 21.3 'VIRGINIA' 设置指南\n\n在基于 ubiquity 的 Linux Mint 21 安装中，有三种安装选项：\n\
    \n- **与现有操作系统一起安装 (Install alongside existing operating system)**：此选项允许你快速方便地在同一块磁盘上的另一个操作系统旁安装\
    \ Linux Mint 21。它不需要删除任何数据或修改分区。\n- **清除磁盘并安装 Linux Mint (Erase disk and install\
    \ Linux Mint)**：通过选择此选项，将完全删除磁盘上的所有数据，并以预定的分区大小安装 Linux Mint 21.3 'VIRGINIA'。此选项适用于希望全新安装且不保留现有数据的用户。\n\
    - **其他（Something else）**：此选项为磁盘管理提供了更高级的功能。它允许在所选磁盘上创建、调整大小和修改分区。通过此选项，你对分区过程有更多的控制权，包括指定卷大小和类型的能力。建议对磁盘管理有更深理解并希望创建自定义功能性系统的用户使用。\n\
    \n虽然前两个选项（与现有操作系统一起安装和清除磁盘）提供了更简单的安装过程，但本文讨论将重点放在“其他”选项。该选项对磁盘管理、分区和卷配置提供了更全面的理解，这些是创建一个功能完整的\
    \ Linux Mint 21 系统的必要条件。\n\n# 选择“一起安装”和“清除磁盘”：全面指南\n\n要完成安装，请遵循以下步骤：\n\n1. 找到并点击“Install\
    \ Now”（现在安装）。\n2. 检查将对磁盘所做的更改。\n3. 检查更改后，点击“Continue”（继续）。\n\n# 选择“其他”替代方案：详细指南\n\
    \n要在 1TB NVME SSD 上设置分区，请遵循以下步骤：\n\n- 创建一个 EFI 分区（512 MB）。\n- 分配 7160 MB 用于 SWAP\
    \ 分区。\n- 使用剩余空间作为根分区。\n查看更改。\n\n# 创建分区表\n\n选择要分区的磁盘。如果所选磁盘没有分区表，点击“New Partition\
    \ Table”（新建分区表），然后点击“Continue”。选择空空间。\n\n# 设置 EFI 分区\n\n点击 '+' 创建新分区。在“Size”字段中输入\
    \ 1024 MB。将“Primary”切换为开启。将“Beginning of this space”开启。在“Use as”字段中选择“EFI”。点击“OK”确认。\n\
    \n# 配置 SWAP分区\n\n点击 '+' 添加另一个分区。在“Size”字段中输入 7160 MB。将“Primary”切换为开启。将“Beginning\
    \ of this space”开启。在“Use as”字段中选择“swap area”（交换区域）。点击“OK”确认。\n\n# 根分区分区 (/)\n\n\
    点击 '+' 创建新分区。对于“Size”，使用剩余空空间。将“Primary”切换为开启。将“Beginning of this space”开启。在“Use\
    \ as”字段中选择 Ext4 日志文件系统。在“Mount point”字段中输入“/”。点击“OK”确认。\n\n# 完成安装：\n\n点击“Install\
    \ Now”。检查磁盘更改以确保符合预期。点击“Continue”继续。通过遵循这些步骤，你可以有效地利用你的 1TB NVME SSD 以获得最佳性能和组织。\n\
    \n"
