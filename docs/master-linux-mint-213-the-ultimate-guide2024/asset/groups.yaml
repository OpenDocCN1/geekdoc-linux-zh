    # Possible Fix For Lutris World of Warcraft Black Screen In-Game Store Issue


    Visit the official World Of Warcraft & Lutris websites at https://worldofwarcraft.blizzard.com/
    & https://lutris.net/ for all things World of Warcraft & Lutris.


    Possible Fix For Lutris World of Warcraft Black Screen In-Game Store Issue Via
    Command Line & GUI:


    To address the issue of a black screen in the World of Warcraft in-game store
    when using Lutris, start by opening Lutris from your application menu.


    Then, select Blizzard Battle.net and click the upward arrow next to the wine glass
    icon, choosing "Wine Configuration."


    Once the Wine Configuration window opens, find the "Windows Version" dropdown
    and select either Windows 11 or Windows 10.


    After applying this change, navigate to the "Graphics" tab and enable both "CSMT
    for improved graphic performance" and "VAAPI as backend for DXVA2 GPU Decoding.


    Next, move to the "Drives" tab, press the add button, and assign a new drive letter.
    you''ll need to locate and select the World of Warcraft directory, which includes
    the retail, classic, and classic_era folders, before clicking "OK."


    Click, Apply, to Apply these settings and confirm by clicking "OK" again.


    It''s crucial to ensure that the WINEESY variable is not set and that no esync
    instances are running for these changes to take effect properly. If you still
    face issues, consider updating your graphics drivers to the latest version available.
    For example, updating to the 545 drivers from NVIDIA has resolved crashes for
    some users.


    # Possible Fix For WINE-Staging World of Warcraft


    # Black Screen In-Game Store Issue


    Visit the official World of Warcraft & WINE-Staging websites at https://worldofwarcraft.blizzard.com/
    & https://wiki.winehq.org/Wine-Staging for all things World of Warcraft & WINE-Staging.


    Possible Fix For WINE-Staging World of Warcraft Black Screen In-Game Store Issue
    Via Command Line & GUI:


    Start by running the following command(s) in the terminal:


    ```

    winecfg

    ```


    Then, select Blizzard Battle.net and click the upward arrow next to the wine glass
    icon, choosing "Wine Configuration."


    Once the Wine Configuration window opens, find the "Windows Version" dropdown
    and select either Windows 11 or Windows 10.


    Next, move to the "Drives" tab, press the add button, and assign a new drive letter.
    Here, you''ll need to locate and select the World of Warcraft directory, which
    includes the retail, classic, and classic_era folders, before clicking "OK."


    Click, Apply, to Apply these settings and confirm by clicking "OK" again.


    It''s crucial to ensure that the WINEESYNC variable is not set and that no esync
    instances are running for these changes to take effect properly. If you still
    face issues, consider updating your graphics drivers to the latest version available.
    For example, updating to the 545 drivers from NVIDIA has resolved crashes for
    some users.


    # Possible Fix for DirectX 12 Graphics Error


    Visit the official DirectX website at https://www.microsoft.com/en-gb/download/details.aspx?id=35
    for all things DirectX.


    Possible Fix for DirectX 12 Error Via GUI:


    To resolve a DirectX 12 error through the user interface, begin by opening Battle.net
    from the application menu. Then, click the gear icon next to the large blue "Play"
    or "Update" button. Choose "Game Settings" and locate the section for the version
    of World of Warcraft you wish to play, such as World of Warcraft for retail. Check
    "Additional command line arguments" and enter "-d3d11" in the adjacent box, followed
    by clicking "Done." After launching World of Warcraft, access the "Options" menu,
    select the "Graphics" tab under "System," and scroll to "Graphics API" under "Advanced."
    Ensure DirectX 11 is selected; if not, choose DirectX 11 from the dropdown next
    to "Graphics API" and restart World of Warcraft to apply the changes effectively.


