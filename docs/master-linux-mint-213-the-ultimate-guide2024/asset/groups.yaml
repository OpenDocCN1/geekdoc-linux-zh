    # LINUX MINT 21.3 COMMAND REFERENCE


    Essential System Commands for File and Directory Management


    ### List Directory Contents


    Command: `sudo ls directory`


    Description: Lists the contents of the specified directory.


    ### Change Directory


    Command: `cd directory`


    Description: Changes the current working directory to the specified directory.


    ### Go Up One Directory Tier


    Command: cd .. ..


    Description: Changes the current working directory to the parent directory, moving
    up one level in the directory hierarchy.


    ### List All Non-hidden File and Folders


    Command: `dir`


    Description: Lists all non-hidden files and folders in the current working directory.


    ### List All Files and Folders Including Hidden


    Command: `ls -a`


    Description: Lists all files and folders in the current directory, including hidden
    ones.


    ### Make a Directory


    Command: `sudo mkdir directory`


    Description: Creates a new directory inside the current working directory.


    ### Remove Files


    Command: `sudo rm filename`


    Description: Deletes the specified file from the filesystem.


    ### Remove Files and Folders Recursively


    Command: `sudo rm -r directory`


    Description: Deletes the specified directory and its contents, including all files
    and subdirectories.


    ### Copy a File to a Destination


    Command: `sudo cp filename destination`


    Description: Copies the specified file to the specified destination.


    ### Copy a Folder to a Destination


    Command: `sudo cp -R folder destination`


    Description: Copies the specified folder and its contents to the specified destination.


    ### Move a File or Folder to a Destination


    Command: `sudo mv filename destination`


    Description: Moves the specified file or folder to the specified destination.


    ### Rename a File or Folder


    Command: `sudo mv filename newfilename`


    Description: Renames the specified file or folder to the new specified name.


    ### Display File Contents


    Command: `sudo cat filename`


    Description: Displays the contents of the specified file on the terminal.


    ### List Current Directory Contents


    Command: `ls ..`


    Description: Lists the contents of the parent directory of the current working
    directory.


    # Mastering APT: Advanced Package Management Techniques


    ### Update Package Lists


    Command: `sudo apt update`


    Description: Updates the local package database by retrieving the latest information
    from the software repositories listed in the sources.list or .list files located
    in the /etc/apt/sources.list.d folder.


    ### Upgrade Installed Packages


    Command: `sudo apt upgrade`


    Description: Upgrades all installed applications to their latest available versions
    from the repositories, while taking care of any required dependencies.


    ### Full Upgrade Installed Packages


    Command: `sudo apt full-upgrade`


    Description: Performs a full upgrade of all packages on the system to their latest
    available versions. It may also remove packages if necessary.


    ### Package Search


    Command: `sudo apt search package`


    Description: Use this command to search for packages that match a specified keyword,
    which replaces ''package'' in the command.


    ### Show Package Information


    Command: `sudo apt show package`


    Description: Provides detailed information about a specific package.


    ### Install Packages


    Command: `sudo apt install package`


    Description: Installs a package from the software repositories, including any
    required dependencies.


    ### Remove Packages


    Command: `sudo apt remove package`


    Description: Removes a package from the system while preserving any configuration
    files associated with it.


    ### Purge Packages


    Command: `sudo apt purge package`


    Description: Removes a package from the system, including its configuration files,
    leaving no trace of it on the system.


    ### Auto Remove Packages


    Command: `sudo apt autoremove`


    Description: Removes any unused packages and their dependencies from the system,
    helping to keep the system clean.


    ### List Installed Packages


    Command: `sudo apt list`


    Description: Displays a list of all packages currently installed on the system.


    ### Add Repository


    Command: `sudo add-apt-repository repository`


    Description: Adds a new software repository to the /etc/apt/sources.list.d folder.


    ### Remove Repository


    Command: `sudo add-apt-repository -r repository`


    Description: Removes a previously added repository from the /etc/apt/sources.list.d
    folder.


    ### Edit Sources File


    Command: `sudo apt edit-sources`


    Description: Opens the sources.list file in the default text editor for manual
    editing of software repository sources.


    ### Fix Broken Dependencies


    Command: `sudo apt install -f`


    Description: Attempts to resolve and fix any broken package dependencies by installing
    missing or conflict-ing packages.


    ### Retrieve Source Code for a Package


    Command: `sudo apt source package`


    Description: Downloads the source code of a package from the repository, which
    can be useful for development or debugging purposes.


    ### Upgrading the System


    Command: `sudo do-release-upgrade`


    Description: Initiates a distribution upgrade process to move the operating system
    to a newer released version.


    ### Clean Packages


    Command: `sudo apt clean`


    Description: Clears the local package cache, with a focus on removing .deb files
    that are no longer required, to free up disk space.


    ### Auto Clean Packages


    Command: `sudo apt autoclean`


    Description: Automatically cleans the local package cache by removing .deb files
    that are no longer needed, without requiring user confirmation.


    ### Hold Apt Packages


    Command: `sudo apt mark-hold package`


    Description: Places a package on hold to prevent it from being updated when running
    ''sudo apt upgrade''.


    ### Unhold Apt Packages


    Command: `sudo apt mark-unhold package`


    Description: Removes the hold on a package, allowing it to be updated when running
    ''sudo apt upgrade.''


    ### Show Held Packages


    Command: `sudo apt-mark showhold`


    Description: Displays a list of all packages that are currently held or pinned
    on the system.


    ### Package Verification


    Command: `sudo apt-key verify`


    Description: Verifies the integrity and authenticity of package repository keys
    to ensure the security of downloaded packages.


    # Mastering Flatpak: Installation, Management, and Beyond


    Flatpak Installation


    Command: `flatpak install flatpak`


    Description: Installs a Flatpak from a remote repository onto your system.


    Listing Installed Flatpaks


    Command: `flatpak list`


    Description: Provides an overview of all the Flatpak applications currently installed
    on your system.


    Updating Flatpaks


    Command: `flatpak update`


    Description: Upgrades all installed Flatpaks to the latest available versions
    to ensure they are up-to-date.


    Running a Flatpak


    Command: `flatpak run flatpak`


    Description: Launches an installed Flatpak application on your system.


    Uninstalling Flatpak


    Command: `flatpak uninstall flatpak`


    Description: Removes a specified Flatpak package from your system.


    Flatpak Remote Repository List


    Command: `flatpak remote-list`


    Description: Lists the names of Flatpak remote repositories that have been added
    to your system.


    Adding a Flatpak Remote Repository


    Command: `flatpak remote-add --if-not-exists name url`


    Description: Adds a new Flatpak remote repository to your system, ensuring it
    does not already exist.


    Removing a Flatpak Remote Repository


    Command: `flatpak remote-delete name`


    Description: Removes a specified Flatpak remote repository from your system''s
    configuration.

