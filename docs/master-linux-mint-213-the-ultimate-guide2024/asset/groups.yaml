  - '[PAGE 293]


    Thorium Browser is a high-performance variant of Chromium, optimized for modern
    CPUs with features like Wideine, all codecs, and enhanced privacy. It mirrors
    Google Chrome''s functionality but introduces unique enhancements and patches
    for improved speed, such as AVX support and compiler optimizations. Thorium stands
    out with support for HEVC, JPEG XL, live captions across all builds, and added
    privacy-focused features like DNS over HTTPS. It excludes Google''s telemetry
    and integrates alternative search engines by default. Designed for advanced users,
    it requires CPUs with at least SSE4 and AVX capabilities, catering to a more tech-savvy
    audience seeking a powerful, customizable browsing experience.


    Vivaldi, a cross-platform, freeware browser with a built-in email client, is crafted
    by Vivaldi Technologies, led by Opera Software''s co-founder. Launched in 2015,
    it targets tech enthusiasts and former Opera users seeking rich features and customization.
    Vivaldi offers unique UI customization, built-in ad and tracker blockers, email
    support, and innovative tab management. It revives beloved Opera traits using
    Chromium, supporting Chrome and Firefox extensions. With over 2.9 million users
    by 2024, Vivaldi emphasizes user control, web technology integration, and privacy,
    distinguishing itself in the browser landscape.


    Brave is a free, open-source web browser focused on privacy, blocking most ads
    and trackers by default. It rewards users with Basic Attention Tokens (BAT) for
    viewing optional ads. With headquarters in San Francisco, Brave boasted over 65
    million monthly users by December 2023. It offers features like a built-in VPN,
    a crypto wallet, and its own search engine. Despite a hiccup with its VPN service,
    Brave prioritizes user consent and privacy, offering unique tools against tracking
    and supporting decentralized web protocols.


    Firefox is a free, open-source web browser developed by Mozilla. It''s known for
    its speed, privacy features, and flexibility, supporting Windows, macOS, Linux,
    Android, and iOS. While iOS versions use WebKit due to platform rules, Firefox
    elsewhere uses the Gecko engine for web standards compliance. Features include'
  - '[PAGE 294]


    tabbed browsing, spell check, private browsing, and an array of developer tools.
    Add-ons enhance functionality, though earlier versions supported different extension
    systems. Despite some controversies over unwanted extension installations, Firefox
    remains a popular choice for its commitment to user privacy and web standards,
    including HTML5 and CSS3.


    Firefox ESR is designed for organizations needing stable deployment without the
    frequent updates of standard Firefox. It focuses on security and stability fixes,
    not the latest features, offering unmatched data protection. Ideal for businesses
    and universities, it allows for flexible deployment and management, ensuring data
    privacy with Enhanced Tracking Protection. Firefox ESR supports creating a new
    profile for users downgrading from a newer version, blending comprehensive security
    with deployment ease, tailored to different organizational needs.


    Waterfox is a free, open-source web browser, a Firefox fork focusing on ethics,
    user privacy, and performance. Originally developed for 64-bit systems when Firefox
    was 32-bit only, it supports Firefox add-ons, Chrome, and Opera extensions, emphasizing
    user privacy by disabling telemetry and including features like Oblivious DNS
    and private tabs out of the box. Waterfox doesn''t collect your data, making privacy
    a default setting, ensuring a safe and private browsing experience without compromising
    on speed or functionality.


    LibreWolf is an independent Firefox variant focused on privacy, security, and
    freedom. It enhances protection against tracking and fingerprinting, excludes
    telemetry, data collection, and DRM, while incorporating privacy-focused search
    options like DuckDuckGo. With pre-installed uBlock Origin, it offers free browsing.
    LibreWolf updates swiftly from Firefox''s stable source, ensuring timely security
    features'
  - '[PAGE 295]


    without compromising usability. It''s open-source, inviting contributions on Codeberg
    and Matrix, making it a community-driven project for those valuing digital privacy
    and freedom.


    Pale Moon is a free, open-source browser optimized for modern processors, focusing
    on efficiency, customization, and privacy, with no ads or data gathering. It''s
    built on its own Goanna engine, a fork from Mozilla''s code, offering a unique
    blend of speed, security, and user control through extensive customization, including
    themes and extensions. Regularly updated for security and supporting classic plugins,
    it''s designed for those valuing a balance between performance and features, all
    backed by a community-driven project.


    Mullvad Browser, developed in partnership with the Tor Project, aims to enhance
    online privacy beyond just masking your IP. It defaults to private browsing, leaving
    no cookies or history behind, and combats fingerprinting by masking details like
    timezone, fonts, and browser specifics. It includes modifications like disabling
    telemetry, normalizing system fonts, and using letterboxing to obscure window
    sizes, alongside built-in extensions like uBlock Origin for ad-blocking and NoScript
    for script control. Its security levels adjust feature access for safety, and
    a unique identity button helps sever links to activities. Unlike the Tor Browser,
    it doesn''t route traffic over the Tor network, but it''s fine-tuned for privacy
    with settings to minimize tracking and fingerprinting, aiming to make each user''s
    browser look nearly identical to others.


    Basilisk is a free, open-source browser with a Firefox-style interface, based
    on the Goanna engine (a Gecko fork) and UXP platform. Now developed independently
    from Pale Moon, it offers a stable, change-resistant option supporting ECMAScript
    6, NPAPI plugins, XUL extensions, and modern web standards like TLS 1.3, without
    relying on Rust or Electrolysis for a familiar browsing experience.'
