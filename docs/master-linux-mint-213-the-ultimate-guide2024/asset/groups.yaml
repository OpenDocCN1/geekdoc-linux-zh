    Save Your Progress: To save, you can simply click "Save." Alternatively, you can
    choose "File" > "Save," or click the ≡ icon, select "Save As," and then confirm
    by clicking "Save." Once done, close the editor.


    Refresh systemd: Back in the terminal, execute sudo systemctl daemon-reload to
    refresh the systemd daemon. This step ensures systemd recognizes your new or updated
    service.


    Enable the Service: To ensure the amdgpu-fan service starts automatically at boot,
    type sudo systemctl enable amdgpu-fan.service.


    Start the Service: Get the fan control service running with sudo systemctl start
    amdgpu-fan.service. This command activates the fan control immediately without
    needing to reboot.


    Check the Service Status: Finally, verify that everything is working as expected
    by running sudo systemctl status amdgpu-fan.service. This command gives you real-time
    feedback on the service''s status.'
