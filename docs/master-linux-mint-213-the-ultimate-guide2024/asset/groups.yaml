    Initiate the installation script:

    ```bash

    sudo ./install.sh

    ```


    During the installation, you''ll encounter several prompts. Follow these instructions:

    - Select English by typing en and press Enter.

    - Choose the local installation type by typing local and specify the installation
    path as /var/ossec.

    - Respond with n for the first question and y for the subsequent ones to accept
    the defaults.

    - Confirm your choices by pressing Enter at the end.


    This procedure will guide you through setting up OSSEC on your system efficiently
    and effectively.


    ## OSSEC Systemd Service


    Begin by opening your terminal and inputting the following command to edit the
    OSSEC service file:


    ```bash

    sudo gedit /etc/systemd/system/ossec.service

    ```


    In the ossec.service file, insert the following configuration:


    ```

    [Unit]

    Description=OSSEC service

    After=network.target


    [Service]

    Type=simple

    ExecStart=/var/ossec/bin/ossec-control start

    ExecStop=/var/ossec/bin/ossec-control stop

    TimeoutStartSec=0

    Restart=on-failure

    StartLimitInterval=0


    [Install]

    ```


    To save your changes, click the Save button.


    Next, execute these commands in the terminal to enable, start, and check the status
    of the OSSEC service:


    ```bash

    sudo systemctl enable ossec.service

    ```


    ```bash

    sudo systemctl start ossec.service

    ```


    ```bash

    sudo systemctl status ossec.service

    ```


    ## DNS Over TLS


    Visit the official DNS Over TLS at https://www.cloudflare.com/en-gb/learning/dns/dns-over-tls/
    for all things DNS Over TLS.


    Installing DNS Over TLS via APT in the Terminal:


    Just type these commands:


    ```bash

    sudo apt update

    sudo apt install systemd-resolved

    cd /etc/systemd

    sudo gedit resolved.conf

    ```


    Next, update the #DNS= line to:


    `DNS=9.9.9.9#dns.quad9.net 2620:fe::fe#dns.quad9.net`


    Change the FallbackDNS= line to:


    `FallbackDNS=149.112.112.112#dns.quad9.net 2620:fe::9#dns.quad9.net`


    For #DNSSEC=no, modify it to:


    `DNSSEC=yes`

    `DNSOverTLS=yes`


    And update #ReadEtchHosts=yes to simply:


    To save your changes, click "Save". You can do this by either clicking on the
    "Save" button directly, going to "File" and selecting "Save", or clicking the
    ≡ icon, choosing "Save As", and then clicking "Save". After saving, close the
    editor.


    Continue by executing these commands in your terminal:


    ```bash

    sudo systemctl daemon-reload

    sudo systemctl restart systemd-resolved

    sudo systemctl restart NetworkManager

    ```


    To check if DNS settings have propagated, visit:


    https://dnscheck.tools/#results


    ## Alternative DNS Services


    ### Google DNS


    Google DNS is accessible at: https://developers.google.com/speed/public-dns. Its
    IPv4 addresses are 8.8.8.8 and 8.8.4.4, and the IPv6 addresses are 2001:4860:4860::8888
    and 2001:4860:4860::8844.


    ### Cloudflare DNS


    Cloudflare DNS can be found online at https://www.cloudflare.com/en-gb/learning/dns/what-is-1.1.1.1/.
    It uses IPv4 addresses 1.1.1.1 and 1.0.0.1, along with IPv6 addresses 2606:4700:4700::1111
    and 2606:4700:4700::1001.


    ### Quad9 DNS


    Quad9 DNS is accessible at https://www.quad9.net/service/service-addresses-and-features.
    It provides IPv4 addresses 9.9.9.11 and 149.112.112.11, along with IPv6 addresses
