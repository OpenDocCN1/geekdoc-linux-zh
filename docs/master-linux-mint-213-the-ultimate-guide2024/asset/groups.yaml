    下一步，移动到“驱动器 (Drives)”选项卡，点击添加按钮，并分配新的驱动器号。在这里，你需要定位并选择魔兽世界目录（该目录包含 retail、classic
    和 classic_era 文件夹），然后点击“确定”。


