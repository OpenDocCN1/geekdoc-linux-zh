- md: '

    # Night Light (Cinnamon & Redshift)


    Visit the official Night Light (Cinnamon & Redshift) websites at https://github.com/linuxmint/cinnamon
    & https://github.com/jonls/redshift for all things Night Light (Cinnamon & Redshift).


    Installing and Setting Up Night Light (Cinnamon & Redshift) Via Command Line &
    GUI:


    To set up Night Light (Cinnamon) using Redshift, first open the terminal and enter:
    `sudo apt install redshift redshift-gtk wayland`. Then, navigate to your config
    directory with `cd ~/.config` and edit the Redshift configuration by typing `nano
    redshift.conf`. In the editor, input the following settings:


    ```

    [redshift]

    temp-night=2300

    transition=1

    brightness=1.0

    gamma=1.0

    [location]

    adjustment-method=vidmode

    location-provider=manual

    ```


    To save your changes, press CTRL + S, then exit with CTRL + X. This configures
    Redshift for a warmer screen at night, aiding in eye strain reduction.


    # Possible PipeWire Sound Crackle & Popping Fixes


    Visit the official PipeWire website at https://PipeWire.org/ for all things PipeWire.

    Possibly Fixing PipeWire Sound Crackling and Popping Via Command Line & GUI:


    To address potential sound issues like crackling or popping with PipeWire, start
    by executing these commands in the terminal to disable audio power saving:


    ```

    echo "options snd_hda_intel power_save=0" | sudo tee -a /etc/modprobe.d/audio_disable_powersave.conf

    ```


    ```

    echo "options snd_hda_intel power_save_controller=N" | sudo tee -a /etc/modprobe.d/audio_disable_powersave.conf

    ```


    Verify the changes by checking that both commands return 0 and N, respectively,
    with:

    cat /sys/module/snd_hda_intel/parameters/power_save

    cat /sys/module/snd_hda_intel/parameters/power_save_controller


    Next, edit the PipeWire configuration to optimize performance. Open /usr/share/pipewire/pipewire.conf
    with a text editor and adjust the quantum settings:

    - Change #default.clock.quantum = 1024 to default.clock.quantum = 2048.

    - Modify default.clock.min-quantum = 16 to default.clock.min-quantum = 2048.

    - Update #default.clock.max-quantum = 2048 to default.clock.max-quantum = 4096.


    Save your changes and exit the editor. Then restart PipeWire services:


    ```

    systemctl --user restart pipewire.service pipewire-pulse.service pipewire-media-session.service
    ; systemctl --user restart pipewire-multi.service

    ```


    Enhance audio priority by editing /etc/security/limits.conf to add:


    - - @audio - nice -20


    Save and exit. Remove any potential conflicts by purging speech-dispatcher:


    ```

    sudo apt purge speech-dispatcher

    ```


    Finally, ensure all changes are consistent across PipeWire configurations, save,
    backup necessary files, and restart your computer to apply the adjustments.


    # Xanmod


    Visit the official Xanmod website at https://xanmod.org/ for all things Xanmod.


    Installing Xanmod via APT Repository in the Terminal:


    Just type these commands:


    ```

    sudo apt update

    ```


    ```

    wget -qO - https://dl.xanmod.org/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/xanmod-archive-keyring.gpg

    ```


    ```

    echo ''deb [signed-by=/usr/share/keyrings/xanmod-archive-keyring.gpg] http://deb.xanmod.org
    releases main'' | sudo tee /etc/apt/sources.list.d/xanmod-release.list

    ```


    ```

    sudo apt update && sudo apt install linux-xanmod-x64v3

    ```


    Save progress and restart the computer.


    [Ensure to take a note of all the linux-xanmod packages being installed.]


    # Liquorix


    Visit the official Liquorix website at https://liquorix.net/ for all things Liquorix.


    Installing Liquorix via APT & Curl in the Terminal:


    Just type these commands:


    ```

    sudo apt update

    ```


    ```

    curl -s ''https://liquorix.net/install.sh'' | sudo bash

    ```


    # Linux Mint Variables


    Visit the official Linux Mint Variables website at https://linuxmint.com/ for
    all things Linux Mint.


    Setting Up Linux Mint Variables Via Command Line & GUI:


    To customize environment variables for command line and graphical applications
    in Debian, begin by editing the system-wide configuration file with the command:
    `sudo gedit ~/.bashrc`. Scroll to the file''s end and insert the following settings
    to adjust environment behaviors and performance:


    ## Environment Variables


    ```

    export DXVK_WRITE=1

    export DXVK_ENABLE_API=1

    export WINEYNC=1

    export WINEDEBUG=-all

    export _GL_SHADER_DISK_CLEANUP=1

    export _GL_THREADED_OPTIMIZATION=1

    export _GL_SHARED_MEMORY=1

    export WINE_SIMULATE_WRITE=1

    export DXVK_STATE_CACHE=''/home/username/.wine/c/Program Files (x86)''

    export _GL_SHADER_CACHE=''/home/username/.wine/c/Program Files (x86)''

    export VK3D_SHADER_CACHE=''/home/username/.wine/c/Program Files (x86)''

    export VK3D_CONFIG=''dxr''

    export VK3D_exclude_processes=''Agent.exe''

    export GOPATH=$HOME/work

    export PATH=$PATH:/usr/local/bin

    export PATH=''/home/username/.nimble/bin''

    ```


    ## Aliases


    - alias update=''sudo apt update && sudo apt upgrade''

    - alias updater=''sudo apt update && sudo apt upgrade && sudo snap refresh''

    - alias wget=''wget --limit-rate''

    - alias purge=''sudo apt purge''

    - alias install=''sudo apt install''

    - alias insnap=''sudo snap install''

    - alias ipkg=''sudo dpkg -i''

    - alias fix=''sudo dpkg --configure -a && apt-get install -f''

    - alias fixit=''sudo apt install -f''

    - alias clean=''sudo apt update && sudo autoremove -y && sudo apt clean -y''

    - alias remove=''sudo rm -r''

    - alias gitc=''git clone''

    - alias gitcr=''git clone --recursive''


    Replace username with your actual username. After adding these lines, save your
    changes by clicking "Save" or through the File menu. These adjustments enhance
    system performance for specific applications and set convenient command aliases
    for system updates and package management.


    # Setting Image As Background In Cinnamon


    Visit the official Cinnamon website at https://github.com/linuxmint/cinnamon for
    all things Cinnamon.


    Begin by right-clicking on an image file, then click on "Set as Background."


    # mount_options.conf


    Visit the official udisks website at https://www.freedesktop.org/wiki/Software/udisks/
    for all things udisks.


    Setting Up mount_options.conf Via Command Line & GUI:


    Just type these commands:


    ```

    sudo apt update

    ```


    ```

    sudo gedit /etc/udisks2/mount_options.conf

    ```


    Amend the above mount_options.conf file with the below contents:


    ```

    [defaults]

    ntfs_defaults=uid=$UID,gid=$GID

    ntfs_allow=uid=$UID,gid=$GID,nls,umask,dmask,fmask,nohidden,sys_immutable,discard,force,sparse,showmeta,prealloc,no_acs_rules,acl,noatime

    ```


    Save progress by Clicking Save, or Clicking File and Clicking Save or Clicking
    the ≡ icon and Clicking Save As and Clicking Save, then Exit.


    # Adding Startup Applications In Cinnamon


    Adding Startup Applications In Cinnamon Via GUI:


    To add startup applications via GUI in Linux Mint, open the Application Menu using
    the Super key. Then, navigate to "Startup Applications," click the + button, and
    select "Choose Application." Type the name of the application you want to load
    at startup, select it, and click "Add."


    Adding Startup Applications In Cinnamon Custom Command Via GUI:


    For adding a custom command, open "Startup Applications" from the Application
    Menu with the Super key. Click the + button and choose "Custom Command." Enter
    a name for the command, the command itself (e.g., "discord") to launch Discord,
    a detailed comment for clarification, and set a startup delay to manage loading
    times efficiently. Finally, click "Save."


    Adding Startup Applications Via Command Line (Cinnamon & GNOME):


    To add startup applications via the command line, first open the terminal. Navigate
    to the directory containing application shortcuts by running `cd /usr/share/applications`.
    Then, list all files in this directory with the `ls` command. Identify the .desktop
    file for the application you want to start automatically (e.g., firefox.desktop).
    Copy this file to the autostart folder by executing `sudo cp firefox.desktop /etc/xdg/autostart`.
    This command ensures the chosen application will launch at startup.

    '
