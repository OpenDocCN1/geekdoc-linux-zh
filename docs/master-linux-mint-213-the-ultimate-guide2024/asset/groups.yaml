    flatpak install flathub org.openshot.OpenShot

    ```


    ## Installing OpenShot via AppImage from the GUI:


    To install OpenShot via AppImage, first visit https://www.openshot.org/download/
    and select ''Linux Downloads'', then ''Download v.''. After downloading, open
    your file manager and press CTRL + L to type ''/''. Create a new folder named
    ''Applications'' in your home directory, then move the downloaded OpenShot-v3.1.1-x86_64.AppImage
    file from ''/Downloads'' to ''~/Applications''. Right-click the AppImage, choose
    ''Properties'', and set it as executable. Finally, double-click the AppImage to
    launch OpenShot.


    ## Creating OpenShot AppImage .desktop Shortcut from the Command Line & GUI:


    To create a desktop shortcut for OpenShot AppImage, open a terminal and navigate
    to /usr/share/applications using cd /usr/share/applications. Then, use sudo gedit
    Open-Shot1.desktop to create a new desktop entry file. In the editor, input the
    following:


    ```

    [Desktop Entry]

    Name=OpenShot

    Comment=OpenShot Video Editor

    Exec=/home/yourusername/Applications/OpenShot-v3.1.1-x86_64.AppImage

    Icon=application-default-icon

    Terminal=false

    Type=Application

    Categories=Video;AudioVideoEditing;

    ```


    Replace /home/yourusername with your actual home directory path. Save your changes
    by clicking ''Save'' or through the file menu. Close the editor afterward.


