    ## ClamAV


    Visit the official ClamAV website at https://www.clamav.net/ for all things ClamAV.


    Installing ClamAV via APT in the Terminal:


    Just type these commands:


    ```

    sudo apt update

    sudo apt install clamav clamav-daemon

    ```


    ## clamd .conf Command Line & GUI Setup


    To configure clamd with command line and GUI, follow these steps:


    Open the clamd configuration file by executing in the terminal:


    ```

    sudo gedit /etc/clamav/clamd.conf

    ```


    Update the clamd.conf file starting from the OnAccessMaxFileSize line:


    ```

    OnAccessMaxFileSize 101M

    ScanOnAccess yes

    OnAccessIncludePath /

    OnAccessExcludePath /home/.wine/mnt

    OnAccessPrevention yes

    ```


    Save your changes by clicking "Save".


    Next, set up the necessary environment for clamd to run:


    Create the clamav directory with:


    ```

    sudo mkdir /run/clamav

    ```


    Set the directory permissions to allow reading, writing, and execution:


    ```

    sudo chmod 777 -R /run/clamav

    ```


    Start the clamd service:


    ```

    sudo clamd

    ```


    After starting clamd, secure the directory by changing permissions back to:


    ```

    sudo chmod 755 -R /run/clamav/

    ```


    ## Automatic ClamAV Updates And Scans


    To set up automatic updates and scans with ClamAV, follow these steps in the terminal:


    Open the crontab file for editing:


    ```

    sudo crontab -e

    ```


    Choose the editor number for nano when prompted.


    Add the following lines to the crontab file to configure the scheduled tasks.


    For updating the ClamAV database daily at 11:00 PM:


    ```

    0 23 * * * /usr/bin/freshclam

    ```


    For performing a daily scan at midnight targeting specific directories, logging
    the process, and removing any detected infected files:


    ```

    0 0 * * * /usr/bin/clamscan --log --infected --remove -r /home /usr /etc /bin
    /sbin

    ```


    Save your changes by pressing CTRL + S and exit by pressing CTRL + X.


    This setup ensures your ClamAV database is regularly updated, and your system
    is scanned daily for any threats, enhancing your security measures.


