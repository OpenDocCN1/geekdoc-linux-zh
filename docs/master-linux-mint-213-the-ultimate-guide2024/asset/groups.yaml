- md: '

    # Power Settings


    ## Adjusting Power Settings Via GUI:


    To adjust power settings through the graphical user interface, start by opening
    the "Settings" from the application menu. Next, navigate to the "Power" section.
    Here, you will find an option for "Screen Blank"; select it and set it to "5 Minutes."
    Afterward, look for the "Automatic Suspend" feature and turn it off by selecting
    the "Off" option. This process is straightforward and ensures your power settings
    are configured to your preference efficiently and effectively, without the need
    for overly complex instructions or redundant steps.


    # GNOME EXTENSIONS


    GNOME Shell extensions, developed by third parties, enhance the GNOME interface
    by allowing customizations like window management tweaks or app launching modifications.
    Extensions, which you can find and manage on a dedicated website, come with unique
    identifiers (uuid) for secure installation. While they offer versatile enhancements,
    from minor to major interface changes, users should tread carefully; extensions
    integrate deeply with the OS, potentially leading to system issues or security
    risks. Nevertheless, they undergo thorough reviews for safety before being available
    for download, ensuring a balance between innovation and security.


    The GNOME Shell Extension Manager simplifies the installation and management of
    GNOME extensions. This tool allows users to browse, install, remove, enable, or
    disable extensions directly from the extensions.gnome.org website, without needing
    a web browser. It''s particularly useful on Ubuntu 21.10 and later, where the
    default Firefox cannot install extensions due to its Snap format. With support
    for in-app updates from GNOME 43 onwards and the ability to manage installed extensions,
    including system ones, it offers a streamlined experience. Available via Flathub
    as a Flatpak, it stands as an essential tool for enhancing the GNOME desktop environment.


    The GNOME Shell Integration Chrome Extension and Firefox Addon facilitate seamless
    interaction between the GNOME desktop environment and the respective web browsers.
    They enable users to install, manage, and apply GNOME Shell extensions directly
    from their browser, without needing to use the terminal or other tools. This integration
    simplifies the customization and enhancement of the GNOME desktop experience,
    making it more accessible to users who prefer graphical interfaces over command-line
    operations.


    The User Themes extension, designed for the GNOME Desktop Environment on Linux
    Mint 21, enables users to customize the appearance of the GNOME Shell. By default,
    GNOME Tweaks cannot alter the GNOME Shell theme. Installing this extension overcomes
    that limitation, offering more personalization options directly within this environment.


    ArcMenu is a top GNOME Shell extension offering a traditional app menu experience
    with a variety of layouts, from simple to exotic. It features built-in GNOME search,
    quick system shortcuts access, and stylish updates like adjustable search box
    border radius. The latest version includes bug fixes and improvements like separate
    icon size settings for categories and applications, and a Windows 11-style power
    button submenu.


    Dash to Panel is a versatile Gnome Shell extension that transforms the dash into
    a unified main panel, merging application launchers and the system tray for a
    streamlined experience akin to KDE Plasma and Windows 7+. It eliminates the need
    for a separate dock, granting effortless access to running and favored apps. Highly
    customizable, it allows users to adjust the panel''s appearance, behavior, and
    functionality, including running indicators, window previews, and intelligent
    features. Features like customizable running indicators, live previews on hover,
    keyboard shortcuts for launching apps, and multi-monitor support enhance usability,
    making your workspace personalized and efficient.


    Desktop Icons (NG) is an enhancement for GNOME Shell, acting as a revamped version
    of the official Desktop Icons extension. It introduces features like intuitive
    drag-and-drop across the desktop, applications, and Nautilus windows, plus a versatile
    "Open with..." option for multiple files. It ensures the full names of icons are
    visible over hover or click, even if they''re too long, and maintains compositor
    stability under heavy desktop activity.


    Tray Icons: Reloaded is a GNOME Shell extension that revitalizes your desktop
    by returning Tray Icons to the top panel, enriched with new features. It introduces
    an overflow mode with a ''3 dots'' icon for excess items, customizable tray positioning,
    icon limits, and sizes. Users can fine-tune icon color saturation, contrast, and
    brightness, alongside adjustable tray, icon margins, and padding.


    # GNOME Shell Extension Manager


    Visit the official GNOME Shell Extension Manager website at https://github.com/jakjakeman/extension-manager
    for all things GNOME Shell Extension Manager.


    For a DEB/FLATPAK Package through Software Manager:


    - Open Software Manager and search for GNOME Shell Extension Manager.

    - Click on GNOME Shell Extension Manager, then on the Source Selection Box.

    - Choose System Package or Flatpak and hit Install.


    Installing GNOME Shell Extension Manager via APT in the Terminal:


    Just type these commands:


    ```

    sudo apt update

    ```


    ```

    sudo apt install gnome-shell-extension-manager

    ```


    Installing GNOME Shell Extension Manager via Flatpak in the Terminal:


    Type this command:


    ```

    flatpak install flathub com.mattjakeman.ExtensionManager

    ```


    # GNOME Shell Integration


    Visit the official GNOME Shell Integration websites at https://chrome.google.com/webstore/detail/gnome-shell-integration/gphhapmejobijbbhgpjcjognlahblep
    and https://addons.mozilla.org/en-GB/firefox/addon/gnome-shell-integration/ for
    all things GNOME Shell Integration.


    # GNOME Shell Integration Chrome Extension Install Via GUI:


    To install the GNOME Shell Integration Chrome Extension through a user-friendly
    graphical interface, simply visit


    https://chromewebstore.google.com/detail/gnome-shell-integration/gphhapmejobijbbhgpjcjognlahblep.


    # GNOME Shell Integration Firefox Addon Install Via GUI:


    To install the GNOME Shell Integration Firefox Add-on through a graphical user
    interface, head to


    https://addons.mozilla.org/en-GB/firefox/addon/gnome-shell-integration.


    Once there, initiate the installation by clicking "Add to Firefox," followed by
    "Add" to confirm your action. Remember to check the option "Allow this extension
    to run in Private Windows" to ensure its availability across all browsing sessions.


    # User Themes


    Visit the official User Themes website at https://gitlab.gnome.org/GNOME/gnome-shell-extensions
    for all things User Themes.


    Install User Themes GNOME Extension Via GUI:


    Navigate to the release page at:


    https://extensions.gnome.org/extension/19/user-themes/


    Click, Install and Confirm to Install User Themes


    # ArcMenu


    Visit the official ArcMenu website at https://gitlab.com/arcmenu/ArcMenu for all
    things ArcMenu.


    Install ArcMenu GNOME Extension Via GUI:


    Navigate to the release page at:


    https://extensions.gnome.org/extension/3628/arcmenu/


    Click, Install and Confirm to Install ArcMenu


    # Dash to Panel


    Visit the official Dash to Panel website at https://github.com/home-sweet-gnome/dash-to-panel
    for all things Dash to Panel.


    Install Dash to Panel GNOME Extension Via GUI:


    Navigate to the release page at:


    https://extensions.gnome.org/extension/1160/dash-to-panel/


    Click, Install and Confirm to Install Dash to Panel


    # Dash to Panel Tray Font Size Via GUI:


    First, right-click on "Dash to Panel" to open its context menu. Next, select "Dash
    to Panel Settings" to access its configuration options. Within the settings window,
    navigate to the "Fine-Tune" tab located at the top bar. Finally, adjust the "Tray
    Font Size" by moving its slider until it reaches 21px.


    # Desktop Icons (NG)


    Visit the official Desktop Icons (NG) website at https://gitlab.com/rastersoft/desktop-icons-ng
    for all things Desktop Icons (NG).


    Install Desktop Icons (NG) GNOME Extension Via GUI:


    Navigate to the release page at:


    https://extensions.gnome.org/extension/2087/desktop-icons-ng-ding/


    Click, Install and Confirm to Install Desktop Icons (NG)

    '
  mdcn: '


    # 电源设置


    ## 通过 GUI 调整电源设置：


    通过图形用户界面调整电源设置，请从应用程序菜单中打开“设置”。接下来，导航到“电源”部分。在这里，你将找到“屏幕休屏”选项；选择它并设置为“5 分钟”。之后，寻找“自动挂起”功能并通过选择“关闭”选项将其关闭。此过程非常直观，可确保您的电源设置高效地按照您的喜好进行配置，而无需过于复杂的指令或冗余步骤。


    # GNOME 扩展


    GNOME Shell 扩展由第三方开发，通过允许如窗口管理微调或应用启动修改等自定义功能来增强 GNOME 界面。你可以在专门的网站上找到并管理这些扩展，它们带有唯一的标识符
    (uuid) 以确保安全安装。虽然它们提供了从细微到重大的界面变化的多样化功能增强，但用户应当谨慎操作；因为扩展与操作系统深度集成，可能会导致系统问题或安全风险。尽管如此，它们在提供下载之前会经过严格的安全性审查，以确保创新与安全之间的平衡。


    GNOME Shell 扩展管理器（Extension Manager）简化了 GNOME 扩展的安装和管理。该工具允许用户直接从 extensions.gnome.org
    网站浏览、安装、删除、启用或禁用扩展，无需网络浏览器。它在 Ubuntu 21.10 及更高版本上特别有用，因为那里默认的 Firefox 由于其 Snap
    格式无法安装扩展。从 GNOME 43 开始，它支持应用内更新，并能够管理已安装的扩展（包括系统扩展），提供了一种精简体验。它通过 Flathub 以 Flatpak
    包的形式，是增强 GNOME 桌面环境的必备工具。


    GNOME Shell 集成 Chrome 扩展和 Firefox 载程序促进了 GNOME 桌面环境与相应浏览器之间的无缝交互。它们允许用户直接从浏览器安装、管理和应用
    GNOME Shell 扩展，而无需使用终端或其他工具。这种集成简化了 GNOME 桌面体验的自定义和增强，使其对于偏于使用图形界面而非命令行操作的用户来说更加易用。


    User Themes 扩展为 Linux Mint 21 上的 GNOME 桌面环境设计，允许用户自定义 GNOME Shell 的外观。默认情况下，GNOME
    Tweaks 无法更改 GNOME Shell 主题。安装此扩展后克服了这一限制，直接在环境中提供了更多的个性化选项。


    ArcMenu 是一款顶级的 GNOME Shell 扩展，提供从简单到奇特的各种布局的传统应用菜单体验。它具有内置的 GNOME 搜索、快速系统快捷键访问，以及时尚的视觉更新（如可调整的搜索框圆半径）。最新版本包含了错误修复和改进，例如为类别和应用程序设置独立的图标大小，以及
    Windows 11 风格的电源按钮子菜单。


    Dash to Panel 是一款多功能的 Gnome Shell 扩展，它能将 Dash 转换为统一的主面板，合并应用启动器和系统托盘，提供类似于 KDE
    Plasma 和 Windows 7+ 的精简体验。它消除了对独立 dock的需求，可以轻松访问运行中和收藏的应用。它具有高度定制性，允许用户调整面板的外观、行为和功能，包括运行指示、窗口预览和智能功能。如自定义运行指示、悬停实时预览、启动应用程序的键盘快捷键以及多显示器支持等功能增强了易用性，让您的工作空间更加个性化且高效。


    Desktop Icons (NG) 是 GNOME Shell 的一项增强，作为官方 Desktop Icons 扩展的修订版本。它引入了诸如直观的跨桌面、应用程序和
    Nautilus 窗口的拖放功能，以及针对多个文件的通用“用...打开”选项。它确保图标在悬停或点击时显示完整全称（即使名称过长也是如此），并在高强度的桌面活动下保持合成器的稳定性。


    Tray Icons: Reloaded 是一项 GNOME Shell 扩展，通过将托盘图标返回顶部面板来重振您的桌面，并丰富了新功能。它引入了带有“三点”图标的溢出模式、可自定义的托盘位置、图标限制和大小。用户可以精调图标颜色饱和度、对比度和亮度，以及可调整的托盘、图标边距和内边。


    # GNOME Shell Extension Manager


    访问 GNOME Shell Extension Manager 官方网站 https://github.com/jakjakeman/extension-manager
    获取有关 GNOME Shell Extension Manager 的所有信息。


    通过软件管理器安装 DEB/FLATPAK 程序包：


    - 打开软件管理器并搜索 GNOME Shell Extension Manager。

    - 点击 GNOME Shell Extension Manager，然后点击源选择框。

    - 选择系统包 (System Package) 或 Flatpak 并点击安装。


    在终端中通过 APT 安装 GNOME Shell Extension Manager：


    输入这些命令：


    ```

    sudo apt update

    ```


    ```

    sudo apt install gnome-shell-extension-manager

    ```


    在终端中通过 Flatpak 安装 GNOME Shell Extension Manager：


    输入此命令：


    ```

    flatpak install flathub com.mattjakeman.ExtensionManager

    ```


    # GNOME Shell Integration


    访问 GNOME Shell Integration 官方网站 https://chrome.google.com/webstore/detail/gnome-shell-integration/gphhapmejobijbbhgpjcjognlahblep
    和 https://addons.mozilla.org/en-GB/firefox/addon/gnome-shell-integration/ 获取有关
    GNOME Shell Integration 的所有信息。


    # 通过 GUI 安装 GNOME Shell Integration Chrome 扩展：


    要通过用户友图形界面安装 GNOME Shell Integration Chrome 扩展，只需访问


    https://chromewebstore.google.com/detail/gnome-shell-integration/gphhapmejobijbbhgpjcjognlahblep。


    # 通过 GUI 安装 GNOME Shell Integration Firefox 载程序：


    要通过图形界面安装 GNOME Shell Integration Firefox 载程序，请前往


    https://addons.mozilla.org/en-GB/firefox/addon/gnome-shell-integration。


    到达后，点击“添加到 Firefox”开始安装，然后点击“添加”以确认您的操作。记得勾选“允许此扩展在无痕窗口中运行”选项，以确保其在所有浏览会话中可用。


    # User Themes


    访问 User Themes 官方网站 https://gitlab.gnome.org/GNOME/gnome-shell-extensions 获取有关
    User Themes 的所有信息。


    通过 GUI 安装 User Themes GNOME 扩展：


    导航至发布页面：


    https://extensions.gnome.org/extension/19/user-themes/


    点击“安装”并“确认安装” User Themes


    # ArcMenu


    访问 ArcMenu 官方网站 https://gitlab.com/arcmenu/ArcMenu 获取有关 ArcMenu 的所有信息。


    通过 GUI 安装 ArcMenu GNOME 扩展：


    导航至发布页面：


    https://extensions.gnome.org/extension/3628/arcmenu/


    点击“安装”并“确认安装” ArcMenu


    # Dash to Panel


    访问 Dash to Panel 官方网站 https://github.com/home-sweet-gnome/dash-to-panel 获取有关 Dash
    to Panel 的所有信息。


    通过 GUI 安装 Dash to Panel GNOME 扩展：


    导航至发布页面：


    https://extensions.gnome.org/extension/1160/dash-to-panel/


    点击“安装”并“确认安装”Dash to Panel


    # 通过 GUI 设置 Dash to Panel 托盘字体：


    首先，右键点击“Dash to Panel”打开上下文菜单。接下来，选择“Dash to Panel 设置”进入配置选项。在设置窗口中，导航至顶部栏的“微调
    (Fine-Tune)”选项卡。最后，通过移动滑块调整“托盘字体”，直到其达到 21px。


    '
