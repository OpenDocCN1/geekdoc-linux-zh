    通过 GUI 解决 DirectX 12 错误：


    要通过用户界面解决 DirectX 12 错误，从应用程序菜单打开战网。然后，点击大型蓝色“播放 (Play)”或“更新 (Update)”按钮旁边的齿轮图标。选择“游戏设置
    (Game Settings)”并找到你想玩的魔兽世界版本（例如正式版魔兽世界）。勾选“额外命令行参数 (Additional command line arguments)”并在相邻的框中输入
    "-d3d11”，然后点击“完成 (Done)”。启动魔兽世界后，进入“选项 (Options)”菜单，选择“系统 (System)”下的“图形 (Graphics)”选项卡，并滚动到“高级
    (Advanced)”下的“图形 API (Graphics API)”。确保已选择 DirectX 11；如果不是，从“图形 API”旁边的下拉菜单中选择
    DirectX 11 并重启魔兽世界以有效应用更改。


