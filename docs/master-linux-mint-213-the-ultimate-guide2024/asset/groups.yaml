  mdcn: '

    Atom-ng 将深度定制选项与易于上手的默认设置相结合，旨在满足所有用户的偏好。VSCodium 是微软 VS Code 编辑器的社区驱动开源版本，去除了遥测数据和品牌标识。它提供相同的功能，但通过移除跟踪和专有功能来尊重用户的隐私和自由。该项目简化了获取
    VS Code 优势的途径，无需从源码编译，提供了根据 MIT 许可证许可的二进制文件。这项倡议解决了对软件自由和隐私的担忧，为那些偏好或需要开源解决方案的用户提供了这款流行编辑器的支持。VSCodium
    确保所有人都能轻松获取最新的、纯净的 VS Code 版本。


    Atom 是由 GitHub 开发的一款免费开源文本和源代码编辑器，适用于 macOS、Linux 和 Windows。它于 2015 年发布，因其高度的可定制性（hackability）而受到赞誉，允许使用
    HTML、CSS 和 JavaScript 进行自定义。Atom 构建在 Electron 框架之上，支持 JavaScript 插件和内置 Git 控制，具有高度的适应性。用户可以通过
    Atom 的包管理器 `apm` 通过第三方软件包和主题增强其功能。尽管 Atom 已经退役，但它作为一种功能多且且友好的开发者编辑器的遗产依然存在，凸显了它在使用网络技术推进代码编辑方面的作用。


    Geany 是一款免费、轻量级的文本编辑器，具有基础 IDE 功能，为速度设计，依赖项极少。它支持广泛的编程语言和标记语言，提供语法高亮、代码折叠、自动补全和项目管理等功能。Geany
    的通用性跨越多个操作系统，包括 BSD、Linux、macOS、Solaris 和 Windows，尽管其 Windows 版本缺少内置终端和某些 Unix
    工具（除非用户自行添加）。与传统的 Unix 编辑器不同，Geany 类似于 Notepad++ 这样的 Windows 编程编辑器，使用 Scintilla
    和 GTK 界面。它不断进化，遵循 GPL v2 或更高版本许可，展示了其对开源社区的承诺。


    Bluefish 是一款为程序员和 Web 开发者设计的强大编辑器，对各种编程和标记语言提供广泛支持。它是一个遵循 GPL 许可的开源项目，运行在 Linux、MacOS
    和 Windows 等多个平台。Bluefish 以其快速、轻量级的设计和高效处理文档的能力脱颖而出。它支持多线程文件编辑、强大的搜索和替换、代码片段以及与外部程序的集成。此外，它还提供自定义语言支持、行拼写检查、自动恢复和站点管理工具，使其成为编码和
    Web 开发的全面工具。


