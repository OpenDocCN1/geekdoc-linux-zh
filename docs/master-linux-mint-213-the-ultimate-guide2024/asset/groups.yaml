    - In Snap Store, look for Discord.

    - Click on Discord, then on the Source Selection Box.

    - Select the latest/stable version under Snap and click Install.


    Installing Discord via Snap from the Terminal:


    Enter this command:


    ```bash

    sudo snap install discord

    ```


    Installing Discord via Flatpak in the Terminal:


    Type this command:


    ```bash

    flatpak install flathub com.discordapp.Discord

    ```


    # Installing Discord via .deb from the GUI:


    - Navigate to the release page at: https://discord.com/api/download?platform=linux&format=deb

    - Go to ~/Downloads

    - Double Click discord-0.0.43.deb

    - Click Install


    # ICQ


    Visit the official ICQ website at https://icq.com/ for all things ICQ.


    For Snap Package through Snap Store:


