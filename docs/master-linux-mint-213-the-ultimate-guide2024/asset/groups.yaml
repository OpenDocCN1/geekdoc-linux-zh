    The hosts file is a simple, plain-text file on your computer that links hostnames
    to IP addresses. It''s essential for directing internet traffic correctly, especially
    when setting up new or transferring domain names that might not resolve immediately
    due to propagation delays. By editing the hosts file, you can bypass these delays,
    ensuring immediate access to your website. This file, rooted in the early days
    of the internet, offers a quick solution for domain resolution, acting as a first
    stop or fallback in the network addressing process. It puts control in your hands,
    letting you manage how your computer navigates the web.


    Hosts.deny & Superhosts.deny are files used in Linux for access control, allowing
    you to deny network services to specific hosts based on their name or address.
    It works alongside hosts.allow; if a client''s request doesn''t match any rule
    in hosts.allow, hosts.deny is checked. If there''s a match, access is denied;
    if not, access is granted by default. This system supports patterns for detailed
    control, including wildcards and net/mask pairs for IP addresses. It''s an effective
    way to secure network services by explicitly denying access to untrusted sources,
    ensuring that only authorized users or systems can access certain network daemons.
    This method is straightforward yet powerful, offering a blend of simplicity and
    depth for managing network access.


    ## UFW


    Visit the official UFW website at https://help.ubuntu.com/community/UFW for all
    things UFW.


    Installing UFW via APT in the Terminal:


    Just type these commands:


    ```

    cd /etc

    sudo rm -r ufw

    cd

    sudo apt purge ufw

    sudo apt install ufw

    sudo ufw enable

    sudo ufw status

    ```


    ## UFW TCP & UDP Ports for Online Productivity Services & Gaming


    TCP Ports:


    53, 80, 433, 443, 1119, 1120, 1716, 1935, 2099, 3074, 3075, 3216, 3478, 3479,
    3569,

    3724, 4000, 5060, 5062, 5222, 5223, 6012, 6112-6114, 6250, 8080, 8088, 8094, 8097,

    9946, 9988, 14000-14024, 17502-17504, 18000-18120, 22990, 27900, 29810, 29900,

    42124-42130, 20000-20100, 25000-25099, 27014-27050, 30000-30099, 42100-42200,

    6112-6119, 6113-6119, 7777-7780, 8393-8400, 9960-9969


    UDP Ports:


    67, 68, 80, 443, 546, 631, 1119, 1120, 1716, 3074, 3126, 3478, 3659, 3724, 4000,

    5060, 5062, 6012, 6112-6114, 6120, 8080, 8088, 8125, 9565, 9570, 18000,

    27036, 29900, 10000-19999, 1024-1124, 1119-1120, 12000-64000, 14000-14016,

    21000-26000, 22990-23006, 25000-25099, 25200-25300, 27000-27031, 30000-30999,

    3074-3083, 3478-3479, 37000-40000, 4379-4380, 5000-5550, 6112-6119, 9000-9999


    together these two lists of TCP and UDP ports by looking through sections of gaming
    companies such as Blizzard, Microsoft, Electronic Arts, and Amazon.


    ## Import Custom UFW Rules


    To import custom UFW rules, open your terminal and execute these commands:


    - Navigate to etc: `cd /etc`

    - Remove existing UFW configurations: `sudo rm -rf ufw`

    - Purge UFW installations: `sudo apt purge ufw`

    - Reinstall UFW: `sudo apt install ufw`

    - Delete any remaining UFW directory: `sudo rm -rf ufw`

    - Move to the directory where your custom UFW rules are saved, for example `~/Downloads/UFW`.

    - Copy the custom UFW rules into etc directory: `sudo cp -r ufw /etc`

    - Change back to etc directory: `cd /etc`

    - Update ownership to root: `sudo chown -R root ufw`

    - Set the proper permissions: `sudo chmod -R 755 ufw`

    - Enable UFW: `sudo ufw enable`

    - Verify the status to confirm the new rules are active: `sudo ufw status`


    This process ensures your custom firewall rules are effectively applied to enhance
    your security.


    ## UFW Single Port Rules


    To configure UFW to allow traffic on a specific port, open your terminal and input
    the following commands:


    - For TCP Ports: Allow traffic on port 80: `sudo ufw allow 80/tcp`

    - For UDP Ports: Allow traffic on port 80: `sudo ufw allow 80/udp`


    These commands will enable access through port 80 for both TCP and UDP, adjusting
    your settings accordingly.


    ## UFW Multi Port Rules


    To configure UFW to allow traffic on multiple ports, open your terminal and input
    the following commands:


    - For TCP Ports: `sudo ufw allow 80,443/tcp`

    - For UDP Ports: `sudo ufw allow 80,443/udp`


    This procedure opens the specified TCP and UDP ports, ensuring your firewall settings
    accommodate the necessary traffic.


    ## UFW Range Port Rules


    To apply port range rules in UFW, initiate these commands in your terminal:


    - For TCP Ports: `sudo ufw allow 1119:1120/tcp`

    - For UDP Ports: `sudo ufw allow 1119:1120/udp`


    This action allows traffic through the specified range of TCP and UDP ports, effectively
    adjusting your firewall to meet your requirements.


    ## UFW Multi Port & Range Port Rules


    To set up rules for multiple ports and port ranges in UFW, enter these commands
    in your terminal:


    - For TCP Ports: `sudo ufw allow 80,443,1119:1120/tcp`

    - For UDP Ports: `sudo ufw allow 80,443,1119:1120/udp`

    - To check the status of UFW ports, use: `sudo ufw status`


    These steps will configure your firewall to allow traffic through the specified
    individual ports and port ranges for both TCP and UDP, ensuring your system''s
    network settings are correctly adjusted.


    ## Removing UFW Port Rules


    To delete specific UFW port rules, follow these steps in your terminal:


    First, display all active UFW rules with their numbers:

    `sudo ufw status numbered`


    This will show you a list of all rules in the order they were added. Next, to
    remove a rule, use:

    `sudo ufw delete 33`


    Replace 33 with the number of the rule you wish to delete, based on the list provided
    by the previous command. To confirm the deletion, list the rules again:

    `sudo ufw status numbered`


    This process ensures you can efficiently manage and verify the removal of specific
    firewall rules from your UFW configuration.


    ## GUFW


    Visit the official GUFW website at https://costales.github.io/projects/gufw/ for
    all things GUFW.


    For a DEB/FLATPAK Package through Software Manager:

    - Open Software Manager and search for GUFW.

    - Click on Firewall Configuration, then on the Source Selection Box.

    - Choose System Package and hit Install.


    Installing GUFW via APT in the Terminal:


    Just type these commands:

    ```

    sudo apt update

    sudo apt install gufw

    ```


    ## GUFW Single Port Rules


    To set up a single port rule in GUFW, follow these steps:


    Open GUFW from your application menu, ensuring you select "Firewall Configuration".
    In the "Profile" box, select "Home". Activate the firewall by toggling the "Status"
    switch to the right. For "Incoming" traffic, choose "Deny". For "Outgoing" traffic,
    select "Allow". Navigate to the "Rules" section and click the "+" to add a new
    rule. Select the "Simple" tab. In the "Name" box, enter "HTTP". Choose "Allow"
    from the "Policy" dropdown to permit traffic. Set the "Direction" to "In". For
    the "Protocol," select "Both" for both TCP and UDP, "TCP" for TCP only, or "UDP"
    for UDP only, depending on the port you''re configuring. In the "Port" field,
    enter "80". Click "Add" to apply the rule.


    This method allows you to efficiently manage port rules in GUFW, ensuring your
    firewall settings are correctly configured.


    ## GUFW Multi Port Rules


    To configure rules for multiple ports in GUFW, proceed as follows:


    Open GUFW from your application menu, ensuring you select "Firewall Configuration".
    Navigate to the "Rules" section and click the "+" to add a new rule. Select the
    "Simple" tab. In the "Name" field, enter a descriptive name, such as "HTTP/HTTPS".
    Choose "Allow" from the "Policy" dropdown to permit traffic. Set the "Direction"
    to "In". For the "Protocol," select "Both" if both TCP and UDP are needed, "TCP"
    for TCP only, or "UDP" for UDP only, based on the ports you''re configuring. In
