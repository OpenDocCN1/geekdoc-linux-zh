    # IMAGEBOARDS


    Imageboards are web forums emphasizing images over text, with origins in Japan.
    They facilitate varied discussions through picture posts, operating similarly
    to bulletin boards but focus more on ephemeral content. Users can post anonymously,
    often using tripcodes—a type of hashed password—for identity without personal
    data storage. Unlike online galleries, content mainly comes from external sources.
    Some boards, like 4chan, offer "secure" tripcodes to enhance anonymity, distinguishing
    these platforms by their blend of visual and anonymous interaction.


    YChanEx is a tool designed for downloading threads and images from various image-boards
    like 4chan and 8chan. It operates on Windows with .NET 4.5 or Linux via WINE,
    introducing a unique "ychanex:" browser protocol for easy downloads. The application,
    still in development, supports a range of imageboards and includes features like
