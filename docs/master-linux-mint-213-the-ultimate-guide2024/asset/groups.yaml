    并引入了 Bing Chat 功能，标志着其作为微软顶级网络浏览器的演进迈一步。


    Thorium Browser 是 Chromium 的一个高性能变体，针对现代 CPU 进行了优化，并具有 Wideine、全解码器和增强的隐私保护等功能。它镜像了
    Google Chrome 的功能，但引入了独特的增强和补丁以提高速度，例如 AVX 支持和编译器优化。Thorium 以其对 HEVC、JPEG XL、所有版本中的实时字幕的支持，以及新增的如
    HTTPS 上的 DNS 等等关注隐私的功能而脱颖而出。它排除了 Google 的遥测数据，并默认集成了替代搜索引擎。它专为高级用户设计，要求 CPU 至少具备
    SSE4 和 AVX 能力，满足追求强大、可定制浏览体验的更具技术背景的读者。


    Vivaldi 是一款内置电子邮件客户端的跨平台免费软件浏览器，由 Opera Software 联合创始人领导的 Vivaldi Technologies
    开发。它于 2015 年发布，目标群体是技术爱好者和寻求丰富功能与定制化的旧 Opera 用户。Vivaldi 提供了独特的 UI 定制、内置的广告和跟踪器拦截器、电子邮件支持以及创新的标签页管理。它使用
    Chromium 复活了深受喜爱的 Opera 特性，并支持 Chrome 和 Firefox 扩展。到 2024 年，其用户超过 290 万，Vivaldi
    强调用户控制、网络技术集成和隐私，在浏览器领域脱颖而出。


    Brave 是一款专注于隐私的免费开源网络浏览器，默认阻止大多数广告和跟踪器。它通过通过查看可选广告向用户发放基础注意力令牌（BAT）。Brave 总部位于旧金山，截至
    2023 年 12 月，其拥有超过 6500 万月活跃用户。它提供了内置 VPN、加密钱包和自有搜索引擎等功能。尽管其 VPN 服务出现过小故障，但 Brave
    优先考虑用户同意和隐私，提供了反跟踪的独特工具并支持去中心化网络协议。


    Firefox 是由 Mozilla 开发的免费开源网络浏览器。它以速度、隐私功能和灵活性著称，支持 Windows、macOS、Linux、Android
    和 iOS。虽然 iOS 版本由于平台限制使用 WebKit，但 Firefox 在其他平台使用 Gecko 引擎以符合 Web 标准。功能包括标签页浏览、拼写检查、隐私浏览和一系列开发者工具。扩展程序可以增强功能，尽管早期版本支持不同的扩展系统。尽管在意外安装扩展程序方面存在一些争议，但
    Firefox 因其对用户隐私和 Web 标准（包括 HTML5 和 CSS3）的承诺而仍然广受欢迎。


    Firefox ESR 是为需要稳定部署而无需标准版 Firefox 频繁更新的组织设计的。它专注于安全和稳定性修复，而非最新功能，提供了无与伦比的数据保护。它是企业和大学的理想选择，允许灵活的部署和管理，并通过增强型跟踪保护确保数据隐私。Firefox
    ESR 支持为从新版本降级的用户创建新配置文件，将全面的安全性与部署易用性相结合，为不同的组织量身定制。


    Waterfox 是一款免费开源网络浏览器，是 Firefox 的一个分支，专注于伦理、用户隐私和性能。它最初为 Firefox 仅支持 32 位时的 64
    位系统开发，它支持 Firefox 扩展、Chrome 和 Opera 扩展，通过禁用遥测并开箱即如匿名 DNS（Oblivious DNS）和隐私标签页等功能来强调用户隐私。Waterfox
    不收集你的数据，将隐私作为默认设置，确保在不牺牲速度或功能的情况下获得安全、私密的浏览体验。


    LibreWolf 是一个独立的 Firefox 变体，专注于隐私、安全和自由。它增强了针对跟踪和指纹的保护，排除了遥测、数据收集和 DRM，同时整合了 DuckDuckGo
    等关注隐私的搜索选项。通过预装 uBlock Origin，它提供了免费浏览。LibreWolf 从 Firefox 的稳定源快速更新，确保在不影响可用性的情况下及时提供安全功能。它是开源的，欢迎在
    Codeberg 和 Matrix 上贡献，是一个面向重视数字隐私和自由的社区驱动项目。


    Pale Moon 是一款针对现代处理器优化的免费开源浏览器，专注于效率、定制化和隐私，没有广告或数据收集。它构建在自己的 Goanna 引擎上（Mozilla
    代码的分支），通过广泛的定制（包括主题和扩展）提供了速度、安全和用户控制的独特融合。它定期更新以确保安全并支持经典插件，专为看重性能与功能平衡的人士设计，并由一个社区驱动的项目支持。


    Mullvad Browser 与 Tor 项目合作开发，旨在增强除掩盖 IP 之外的在线隐私。它默认开启隐私浏览，不留下任何 Cookie 或历史，并通过掩盖时区、字体和浏览器特定细节来反指纹识别。它包括禁用遥测、规范化系统字体和使用信箱模式（letterboxing）隐藏窗口大小等修改，并内置了广告拦截的
    uBlock Origin 和脚本控制 NoScript。其安全级别调整功能访问以确保安全，独特的身份按钮有助于切断活动关联。与 Tor Browser 不同，它不通过
    Tor 网络路由流量，但针对隐私进行了精调，通过设置来最小化跟踪和指纹识别，旨在让每个用户的浏览器看起来与其他人几乎相同。


    Basilisk 是一款具有 Firefox 风格界面的免费开源浏览器，基于 Goanna 引擎（Gecko 的分支）和 UXP 平台。现在它与 Pale
    Moon 独立开发，提供了一个稳定的、抗变化的选项，支持 ECMAScript 6、NPAPI 插件、XUL 扩展以及 TLS 1.3 等现代 Web 标准，无需依赖
    Rust 或 Electrolysis 即可提供熟悉的浏览体验。


