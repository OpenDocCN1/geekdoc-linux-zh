    ### Installing Steam via APT in the Terminal:


    Just type these commands:


    ```

    sudo apt update

    ```


    ```

    sudo apt install steam

    ```


    ### Installing Steam via APT Repository in the Terminal:


    Just type these commands:


    ```

    sudo apt update

    ```


    ```

    sudo tee /etc/apt/sources.list.d/steam-stable.list <<''EOF''

    ```


    ```

    deb [arch=amd64,i386 signed-by=/usr/share/keyrings/steam.gpg] https://repo.steam-powered.com/steam/
    stable steam

    ```


    ```

    deb-src [arch=amd64,i386 signed-by=/usr/share/keyrings/steam.gpg] https://repo.steampowowered.com/steam/
    stable steam

    ```


    ```

    EOF

