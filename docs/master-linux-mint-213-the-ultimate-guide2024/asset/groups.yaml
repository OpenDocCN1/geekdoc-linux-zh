    访问魔兽世界与 Lutris 网站 https://worldofwarcraft.blizzard.com/ & https://lutris.net/
    获取所有关于魔兽世界与 Lutris 信息。


    通过命令行和 GUI 解决 Lutris 魔兽世界游戏内商店黑屏问题的可能解决方法：


    要解决使用 Lutris 时魔兽世界内商店出现黑屏的问题，请先从应用程序菜单中打开 Lutris。


    然后，选择 Blizzard Battle.net 并点击酒杯图标旁边的箭头，选择“Wine 配置 (Wine Configuration)”。


    当 Wine 配置窗口打开后，找到“Windows 版本 (Windows Version)”下拉菜单，选择 Windows 11 或 Windows 10。


    应用此更改后，导航到“图形 (Graphics)”选项卡，并同时启用“增强图形性能的 CSMT (CSMT for improved graphic performance)”和“作为
    DXVA2 GPU 解码后端的 VAAPI (VAAPI as backend for DXVA2 GPU Decoding)”。


    下一步，移动到“驱动器 (Drives)”选项卡，点击添加按钮，定位并选择魔兽世界目录（该目录包含 retail、classic 和 classic_era
    文件夹），然后点击“确定”。


    点击“应用 (Apply)”应用这些设置，并再次点击“确定”进行确认。


    确保没有设置 WINEESY 变量且没有运行的 esync 实例，这对于这些更改的正常生效至关重要。如果你仍然遇到问题，请考虑将显卡驱动更新到最新版本。例如，更新到
    NVIDIA 的 545 驱动已解决了某些用户的崩溃问题。


