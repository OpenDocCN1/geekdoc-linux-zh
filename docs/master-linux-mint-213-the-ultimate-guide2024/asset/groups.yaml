    Visit the official Chromium website at https://www.chromium.org/chromium-projects/
    for all things Chromium.


    For a DEB/FLATPAK Package through Software Manager:

    Open Software Manager and search for Chromium.

    Click on Chromium, then on the Source Selection Box.

    Choose System Package or Flatpak and hit Install.


    Installing Chromium via APT in the Terminal:

    Just type these commands:

    ```bash

    sudo apt update

    ```

    ```bash

    sudo apt install chromium

    ```


    For Snap Package through Snap Store:

    In Snap Store, look for Chromium.

    Click on Chromium, then on the Source Selection Box.

