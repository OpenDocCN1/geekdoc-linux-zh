    通过 GUI 使用 .tar.xz 安装 Basilisk：


    导航至发布页面：


    https://www.basilisk-browser.org/download.html。


    在 United States


    与 Linux 64-bit GTK3 同一行 tarball 下载 Basilisk


    进入 ~/Downloads


    双击 basilisk-20240203205403.linux-x86_64-gtk3.tar.xz


    选择 basilisk


    点击 Extract（解压）


    进入 ~/Downloads


    点击 Extract（解压）


    进入 ~/Downloads/basisk


    ## 快捷方式：


    为 Basilisk 创建桌面快捷方式，首先打开终端并输入以下命令：


    ```


    cd /usr/share/applications


    sudo gedit basilisk1.desktop

    ```


    接下来，用以下内容更新 basilisk1.desktop 文件：


    ```

    [Desktop Entry]

    Name=Basilisk

    Comment=Basilisk

    Exec=./Downloads/basisk/basisk

    Icon=terminal

    Terminal=false

    Type=Application

    Categories=Utility;Game;

    ```


    保存更改时，点击“Save（保存）”按钮，或前往“File（文件）”并选择“Save”，或点击 ≡ 菜单图标，选择“Save As（另存为）”，然后点击“Save（保存）”。完成后退出编辑器。


    请确保 Exec= 路径正确指向您系统上 Basilisk 可执行文件的所在位置。


