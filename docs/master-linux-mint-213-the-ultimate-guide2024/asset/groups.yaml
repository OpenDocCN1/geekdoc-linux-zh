    # # SUSPENDING THE ROOT ACCOUNT:

    ENHANCING SYSTEM SECURITY IN LINUX MINT 21.3 ''CODENAME''


    To suspend the root account in Linux Mint 21.3 ''CODENAME'' after the initial
    user has been added to the sudo group, a series of steps are followed. First,
    the root account''s shell is changed from /bin/bash to /usr/sbin/nologin, effectively
    disabling login access via the root account maintaining its utility for tasks
    like file ownership and running background processes, such as scheduled ClamAV
    scans. Next, the "PermitRootLogin" variable in the /etc/ssh/ssh_config file is
    set to "NO" to prevent unauthorized system access via the root account. Finally,
    a "!" is added at the start of the root account''s entry in the /etc/shadow file,
    effectively locking the account. These measures collectively enhance system security
    by limiting direct access to the root account, reducing the risk of malicious
    activities.'
