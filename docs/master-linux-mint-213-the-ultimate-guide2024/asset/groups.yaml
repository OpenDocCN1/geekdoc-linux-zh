  - '[PAGE 431]


    # Adding Startup Applications In Cinnamon


    Adding Startup Applications In Cinnamon Via GUI:


    To add startup applications via GUI in Linux Mint, open the Application Menu using
    the Super key. Then, navigate to "Startup Applications," click the + button, and
    select "Choose Application." Type the name of the application you want to load
    at startup, select it, and click "Add."


    Adding Startup Applications In Cinnamon Custom Command Via GUI:


    For adding a custom command, open "Startup Applications" from the Application
    Menu with the Super key. Click the + button and choose "Custom Command." Enter
    a name for the command, the command itself (e.g., "discord") to launch Discord),
    a detailed comment for clarification, and set a startup delay to manage loading
    times efficiently. Finally, click "Save."


    Adding Startup Applications Via Command Line (Cinnamon & GNOME):


    To add startup applications via the command line, first open the terminal. Navigate
    to the directory containing application shortcuts by running cd /usr/share/applications.
    Then, list all files in this directory with the dir command. Identify the .desktop
    file for the application you want to start automatically (e.g., firefox.desktop).
    Copy this file to the autostart folder by executing sudo cp firefox.desktop /etc/xdg/autostart.
    This command ensures the chosen application will launch at startup.'
- md: '

    # Adding Startup Application in GNOME


    ## Adding Startup Applications In GNOME Via GUI:


    To add startup applications in GNOME using the GUI.


    # Auto Mount Partitions Using GNOME Disks


    Visit the official GNOME Disks website at https://apps.gnome.org/en-GB/DiskUtility/
    for all things GNOME Disks.


    ## Auto Mount Partitions Via GNOME Disks GUI:


    To auto mount partitions using GNOME Disks GUI, begin by launching Disks from
    the application menu. Then, select the disk holding the volumes you want to mount.
    Choose the specific volume (partition) on that disk you wish to mount, and click
    the cogwheel icon (next to the start or play button). From the pop-up menu, select
    "Edit Mount Options." In the subsequent window, toggle the switch next to "User
    Session Defaults" to the left. Confirm your changes by clicking "OK." This process
    allows for the straightforward mounting of partitions without the need for complex
    configurations.


    # Cinnamon Screenshot Keybindings


    ## Changing flashspot Color Attribute Via Command Line & GUI:


    Begin by opening the "Files" application from the menu, which you can access with
    the "Super" key. Then, press "CTRL + L" to enable the "Location Entry" mode. Type
    "/usr/share/themes/" and navigate to the "Mint-Y-Dark-Red" folder. Inside this
    folder, go to the "cinnamon" directory. Once there, right-click on an empty space
    and choose "open in terminal". Next, execute the command "sudo gedit cinnamon.css".
    In the editor, press "CTRL + F" to open the Find function and search for the "flashspot"
    element. Change its value from "white" to "#FFFFFF" to make the flashspot transparent,
    which prevents it from appearing in screenshots. Save your changes in gedit and
    exit. Finally, press "ALT + F2" to open the cinnamon run command box, type "r",
    and hit enter to restart cinnamon. This ensures that your modifications to the
    cinnamon.css file are applied.


    ## Creating Screenshots Folder Via GUI:


    To create a "Screenshots" folder using the graphical user interface (GUI), first,
    open the "Files" application and navigate to the "~/Pictures" directory. Then,
    right-click on an empty space and select the option to create a new folder. After
    the folder is created, rename it to "Screenshots."


    ## Focused Window Screenshot Via GUI:


    To take a screenshot of the focused window through the GUI, first, open the "Settings"
    from the application menu. Then, navigate to "Keyboard" and select "Shortcuts."
    Click on "Add custom shortcut." For the name, enter "Focused Window Screenshot."
    In the command field, input `bash -c "cd ~/Pictures/Screenshots && gnome-screenshot
    -w -f screenshot_$(date +%d-%m-%y-%H-%M-%S).png"` . After adding the command,
    click "Add." Next, assign it a keyboard binding by clicking on "Keyboard Bindings"
    and pressing the "F10" key to set it as the shortcut.


    ## Fullscreen Screenshot Via GUI:


    To take a screenshot of the focused window through the GUI, first, open the "Settings"
    from the application menu. Then, navigate to "Keyboard" and select "Shortcuts."
    Click on "Add custom shortcut." For the name, enter "Fullscreen Screenshot." In
    the command field, input `bash -c "cd ~/Pictures/Screenshots && gnome-screenshot
    -f screenshot_$(date +%d-%m-%y-%H-%M-%S).png"` After adding the command, click
    "Add." Next, assign it a keyboard binding by clicking on "Keyboard Bindings" and
    pressing the "F11" key to set it as the shortcut.


    # GNOME Overview & Windows Keybinds


    ## Changing Show The Overview Keybind Via GUI:


    To adjust the keybind for showing the overview through the graphical user interface,
    simply start by opening the application menu and executing the "Settings" command.
    Once there, navigate to the "Keyboard" tab and select "View and Customize Shortcuts."
    In the search bar, enter "Show the overview." After finding the "Show the overview"
    option, press the "Super + TAB" keys together. This action configures your system
    to offer an overview experience similar to that of Windows, especially when used
    with arcmenu. To finalize the process, click "Set."


    ## Changing Switch Windows Keybind Via GUI:


    To adjust the keybind for Switching Windows through the graphical user interface,
    simply start by opening the application menu and executing the "Settings" command.
    Once there, navigate to the "Keyboard" tab and select "View and Customize Shortcuts."
    In the search bar, enter "Switch windows." After finding the "Switch windows"
    option, press the "ALT + TAB" keys together. To finalize the process, click "Set."


    # GNOME Screenshot Keybind


    ## Changing Take A Screenshot Keybind Via GUI:


    To adjust the keybind for Take a screenshot through the graphical user interface,
    simply start by opening the application menu and executing the "Settings" command.
    Once there, navigate to the "Keyboard" tab and select "View and Customize Shortcuts."
    In the search bar, enter " Take a screenshot." After finding the " Take a screenshot
    " option, press the "F10" key. To finalize the process, click "Set."


    ## Changing Take A Screenshot Of A Window Via GUI:


    To adjust the keybind for Take a screenshot of a window through the graphical
    user interface, simply start by opening the application menu and executing the
    "Settings" command. Once there, navigate to the "Keyboard" tab and select "View
    and Customize Shortcuts." In the search bar, enter " Take a screenshot of a window."
    After finding the " Take a screenshot of a window." option, press the "F11" key.
    To finalize the process, click "Set."


    ## Changing A Screenshot Of A Window Interactively Via GUI:


    To adjust the keybind for Take a screenshot of a window interactively through
    the graphical user interface, simply start by opening the application menu and
    executing the "Settings" command. Once there, navigate to the "Keyboard" tab and
    select "View and Customize Shortcuts." In the search bar, enter " Take a screenshot
    of a window." After finding the " Take a screenshot of a window." option, press
    the "F9" key. To finalize the process, click "Set."


    # Default Systemd Timeout


    Visit the official Systemd website at https://systemd.io/ for all things Systemd.


    ## Default Systemd Timeout Via Command Line & GUI:


    Just type these commands:


    ```bash

    sudo apt update

    ```


    ```bash

    cd /etc/systemd/

    ```


    ```bash

    sudo gedit system.conf

    ```


    Amend the above, system.conf, file with the below:


    Change the following line from:


    ```

    #DefaultTimeoutSec=90s

    ```


    To:


    ```

    DefaultTimeoutSec=30s

    ```


    Save progress by Clicking Save, or Clicking File and Save As and Clicking Save,
    then Exit.


    Proceed to run the following command(s) in the terminal:


    ```bash

    sudo systemctl daemon-reload

    ```


    # Making Files And Folders Immutable


    Visit the official Immutable Files and Folders website at https://www.linux.org/docs/man1/chattr.html
    for all things Immutable Files and Folders.


    ## Making Files And Folders Immutable Via Command Line:


    Just type these commands:


    ```bash

    sudo apt update

    ```


    ```bash

    cd ~/Downloads

    ```


    ```bash

    sudo chattr -i -RV CurseForge-0.244.4-16117.AppImage

    ```


    # ffmpegthumbnailer


    Visit the official ffmpegthumbnailer website at https://github.com/dirkdvdb/ffmpegthumbnailer
    for all things ffmpegthumbnailer.


    ## Installing ffmpegthumbnailer via APT in the Terminal:


    Just type these commands:


    ```bash

    sudo apt update

    ```


    ```bash

    sudo apt install ffmpeg ffmpegthumbnailer gstreamer1.0-libav

    ```


    ```bash

    rm -r ~/.cache/thumbnails/

    ```


    # Removing .desktop files


    Visit the official .desktop website at https://specifications.freedesktop.org/desktop-entry-spec/desktop-entry-spec-latest.html
    for all things .desktop files.


    ## Removing .desktop files via Command Line in the Terminal:


    Just type these commands:


    ```bash

    cd /usr/share/applications

    ```


    ```bash

    dir

    ```


    [Dir lists all files and folders in the directory.]


    ```bash

    sudo cp uget-gtk.desktop uget-gtk1desktop

    ```


    [copies the uget .desktop file to a backup]


    ```bash

    sudo rm -r uget-gtk.desktop

    ```


    [removes the uget .desktop file.]


    ```bash

    sudo update-desktop-database

    ```


    [Updates the .desktop applications database.]

