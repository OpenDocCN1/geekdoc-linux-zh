    simply start by opening the application menu and executing the "Settings" command.
    Once there, navigate to the "Keyboard" tab and select "View and Customize Shortcuts."
    In the search bar, enter "Show the overview." After finding the "Show the overview"
    option, press the "Super + TAB" keys together. This action configures your system
    to offer an overview experience similar to that of Windows, especially when used
    with arcmenu. To finalize the process, click "Set."


    # Changing Switch Windows Keybind Via GUI:


    To adjust the keybind for Switching Windows through the graphical user interface,
    simply start by opening the application menu and executing the "Settings" command.
    Once there, navigate to the "Keyboard" tab and select "View and Customize Shortcuts."
    In the search bar, enter "Switch windows." After finding the "Switch windows"
    option, press the "ALT + TAB" keys together. To finalize the process, click "Set."'
