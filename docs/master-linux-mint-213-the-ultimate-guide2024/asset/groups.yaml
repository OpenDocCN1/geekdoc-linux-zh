    # 在 GNOME 中添加启动应用


    ## 通过 GUI 在 GNOME 中添加启动应用：


    使用图形界面在 GNOME 中添加启动应用。


    # 使用 GNOME Disks 自动挂载分区


    访问 GNOME Disks 官方网站 https://apps.gnome.org/en-GB/DiskUtility/ 了解有关 GNOME Disks
    的所有信息。


    ## 通过 GNOME Disks GUI 自动挂载分区：


    要使用 GNOME Disks GUI 自动挂载分区，首先从应用程序菜单启动“磁盘”(Disks)。然后，选择包含您想要挂载卷的磁盘。在该磁盘上选择想要挂载的特定卷（分区），并点击齿轮图标（启动或播放按钮旁边）。在弹出菜单中，选择“编辑挂载选项”。在随后的窗口中，将“用户会话默认”旁边的开关向向左。点击“确定”确认您的更改。此过程允许直接挂载分区，无需复杂的配置。


    # Cinnamon 截图快捷键


    ## 通过命令行和 GUI 更改闪光点颜色属性：


    首先从菜单打开“文件”应用程序，你可以通过“Super”键访问它。然后，按下“CTRL + L”启用“位置输入”模式。输入`/usr/share/themes/`并导航到“Mint-Y-Dark-Red”文件夹。在此文件夹内部，进入“cinnamon”目录。进入后，右键点击空白处并选择“在终端打开”。接下来，执行命令`sudo
    gedit cinnamon.css`。在编辑器中，按下“CTRL + F”打开查找功能并搜索“flashspot”元素。将其值从“white”更改为"#FFFFFF”以使闪光点透明，防止它出现在截图中。在
    gedit 中保存更改并退出。最后，按下“ALT + F2”打开 cinnamon 运行框，输入“r”并按回车键重启 cinnamon。这将确保你对 cinnamon.css
    文件的修改生效。


    ## 通过 GUI 创建截图文件夹：


    要使用图形用户界面（GUI）创建“Screenshots”文件夹，首先打开“文件”应用程序并导航到`~/Pictures` 目录。然后，右键点击空白处并选择创建新文件夹的选项。文件夹创建后，将其重命名为“Screenshots”。


    ## 通过 GUI 截取活动窗口：


    要通过 GUI 截取活动窗口，，首先从应用程序菜单打开“设置”。然后，导航到“键盘”并选择“快捷键”。点击“添加自定义快捷键”。名称输入“Focused Window
    Screenshot”。在命令字段中输入`bash -c "cd ~/Pictures/Screenshots && gnome-screenshot -w
    -f screenshot_$(date +%d-%m-%y-%H-%M-%S).png"`。添加命令后，点击“添加”。接下来，通过点击“键盘绑定”并按下“F10”键将其设置为快捷键。


    ## 通过 GUI 截取全屏：


    要通过 GUI 截取全屏，首先从应用程序菜单打开“设置”。然后，导航到“键盘”并选择“快捷键”。点击“添加自定义快捷键”。名称输入“Fullscreen Screenshot”。在命令字段中输入`bash
    -c "cd ~/Pictures/Screenshots && gnome-screenshot -f screenshot_$(date +%d-%m-%y-%H-%M-%S).png"`。添加命令后，点击“添加”。接下来，通过点击“键盘绑定”并按下“F11”键将其设置为快捷键。


    # GNOME 概述与 Windows 快捷键


    ## 通过 GUI 更改显示概览快捷键：


    要通过图形用户界面调整显示概览的快捷键，只需打开应用程序菜单并执行“设置”命令。进入后导航到“键盘”标签卡并选择“查看和自定义快捷键”。在搜索栏中输入“Show
    the overview”。找到“Show the overview”选项后，同时按下“Super + TAB”键。此操作将配置你的系统提供类似于 Windows
    的概览体验，特别是在配合 arcmenu 使用时。完成过程后，点击“设置”。


    ## 通过 GUI 更改切换窗口快捷键：


    要通过图形用户界面调整切换窗口的快捷键，只需打开应用程序菜单并执行“设置”命令。进入后导航到“键盘”标签卡并选择“查看和自定义快捷键”。在搜索栏中输入“Switch
    windows”。找到“Switch windows”选项后，同时按下“ALT + TAB”键。完成过程后，点击“设置”。


    # GNOME 截图快捷键


    ## 通过 GUI 更改截图快捷键：


    要通过图形用户界面调整截图的快捷键，只需打开应用程序菜单并执行“设置”命令。进入后导航到“键盘”标签卡并选择“查看和自定义快捷键”。在搜索栏中输入“Take
    a screenshot”。找到“Take a screenshot”选项后，按下“F10”键。完成过程后，点击“设置”。


    ## 通过 GUI 更改窗口快捷键：


    要通过图形用户界面调整截取窗口的快捷键，只需打开应用程序菜单并执行“设置”命令。进入后导航到“键盘”标签卡并选择“查看和自定义快捷键”。在搜索栏中输入“Take
    a screenshot of a window”。找到“Take a screenshot of a window”选项后，按下“F1”。完成过程后，点击“设置”。


    ## 通过 GUI 交互式截取窗口：


    要通过图形用户界面交互式调整截取窗口的快捷键，只需打开应用程序菜单并执行“设置”命令。进入后导航到“键盘”标签卡并选择“查看和自定义快捷键”。在搜索栏中输入“Take
    a screenshot of a window”。找到“Take a screenshot of a window”选项后，按下“F2”。完成过程后，点击“设置”。


