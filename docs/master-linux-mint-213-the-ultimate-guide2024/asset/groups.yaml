    # amdgpu-fan Control Systemd Service Via Command Line & GUI:


    Open the Service File: Begin by opening your terminal. Type sudo edit /etc/systemd/system/amdgpu-fan.service
    to create or edit the amdgpu-fan.service file. This step requires administrative
    privileges, so you might be prompted for a password.


    Edit the File: You will see an editor window. Copy the following configuration
