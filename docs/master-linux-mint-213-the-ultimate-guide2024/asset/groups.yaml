    # Skype


    Visit the official Skype website at https://www.skype.com/en/ for all things Skype.


    For a DEB/FLATPAK Package through Software Manager:


    - Open Software Manager and search for Skype.

    - Click on Skype, then on the Source Selection Box.

    - Choose System Package or Flatpak and hit Install.


    Installing Skype via APT Repository in the Terminal:


    Just type these commands:


    ```bash

    sudo apt update

    ```


    ```bash

    sudo apt install apt-transport-https

    ```


    ```bash

    curl -s https://repo.skype.com/data/GPG-KEY | sudo apt-key add -

    ```


    ```bash

    echo "deb https://repo.skype.com/deb stable" | sudo tee -a /etc/apt/sources.list.d/skype.list

    ```


    ```bash

    sudo apt update

    sudo apt install skype

    ```


    For Snap Package through Snap Store:


    - In Snap Store, look for Skype.

    - Click on Skype, then on the Source Selection Box.

    - Select the latest/stable version under Snap and click Install.


    Installing Skype via Snap from the Terminal:


    Enter this command:


    ```bash

    sudo snap install skype

    ```


    Installing Skype via Flatpak in the Terminal:


    Type this command:


    ```bash

    flatpak install flathub com.skype.Client

    ```


    # Installing Skype via .deb from the GUI:


    - Navigate to the release page at: https://repo.skype.com/deb/pool/main/skypelinux/

    - Click The Latest skypelinux_8.10.76.107_amd64.deb to Download

    - Go to ~/Downloads

    - Double Click skypelinux_8.10.76.107_amd64.deb

    - Click Install


    # Session


    Visit the official Session website at https://getsession.org/ for all things Session.


    For a DEB/FLATPAK Package through Software Manager:


    - Open Software Manager and search for Session.

    - Click on Session, then on the Source Selection Box.

    - Choose System Package or Flatpak and hit Install.


    Installing Session via Flatpak in the Terminal:


    Type this command:


    ```bash

    flatpak install flathub network.loki.Session

    ```


    Installing Session via AppImage from the GUI:


    - Navigate to the release page at https://getsession.org/download.

    - Click Linux to Download the session-desktop-linux-x86_64-1.12.0.AppImage to
    your ~/ Downloads folder.

    - Locate the session-desktop-linux-x86_64-1.12.0.AppImage file in your Downloads
    folder, right-click on it, and select "Properties.".

    - In the Properties menu, go to the "Permissions" tab and check the box to "Set
    as executable."

    - Double-click the session-desktop-linux-x86_64-1.12.0.AppImage file to start
    the installation process.


    # Creating Session AppImage .desktop Shortcut from the Command Line & GUI:


    To create a .desktop shortcut for Session.AppImage, follow these steps in your
    terminal:


    - Navigate to the applications directory with the command:

    ```bash

    cd /usr/share/applications

    ```


    - Open a new .desktop file for editing by running:


    ```bash

    sudo gedit Session.desktop

    ```


    - In the open file, enter the following details:


    ```ini

    [Desktop Entry]

    Name=Session

    Comment=Encrypted messaging app

    Exec=~/Downloads/session-desktop-linux-x86_64-1.12.0.AppImage

    Icon=terminal

    Terminal=false

    ```

