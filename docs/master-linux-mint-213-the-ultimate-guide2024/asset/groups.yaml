    Visit the official Zig website at https://ziglang.org/ for all things Zig.


    For Snap Package through Snap Store:


    In Snap Store, look for Zig.


    Click on Zig, then on the Source Selection Box.


    Select the latest/beta version under Snap and click Install.


    Installing Zig via Snap from the Terminal:


    Enter this command:


    ```

    sudo snap install zig --beta --classic

    ```


    ## Go


    Visit the official Go website at https://go.dev/ for all things Go.


    Installing Go via GUI & Command Line in the Terminal:


    Navigate to the release page at:


    https://go.dev/dl/


    Click The Latest go1.22.1.linux-amd64.tar.gz to Download Go


    Run the following command(s) in the terminal:


    ```

    cd ~/Downloads

    tar -xvf go1.22.1.linux-amd64.tar.gz

    sudo chown -R root go

    sudo mv go /usr/local

    ```

