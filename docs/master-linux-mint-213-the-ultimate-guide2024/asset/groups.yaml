    ```\n\nInstalling NVIDIA via APT Repository in the Terminal:\n\nJust type these\
    \ commands:\n\n```\nsudo apt update\n```\n\n```\nsudo add-apt-repository ppa:graphics-drivers/ppa\n\
    sudo apt update\nsudo apt install nvidia-graphics-drivers-550 libvulkan1 libvulkan1:i386\n\
    ```\n\n## Installing NVIDIA via NVIDIA Developer APT Repository in the Terminal:\n\
    \nBegin by updating your package lists:\n\n```\nsudo apt update\n```\n\nAdd the\
    \ i386 architecture for compatibility:\n\n```\nsudo dpkg --add-architecture i386\n\
    ```\n\nUpdate your package lists again:\n\n```\nsudo apt update\n```\n\nImport\
    \ the NVIDIA GPG key to ensure the authenticity of the repository:\n\n```\ncurl\
    \ -fSSL https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2204/x86_64/3bf863cc.pub\
    \ | sudo gpg --dearmor | sudo tee /usr/share/keyrings/nvidia-drivers.gpg > /dev/null\
    \ 2>&1\n```\n\nAdd the NVIDIA repository to your system:\n\n```\necho 'deb [signed-by=/usr/share/keyrings/nvidia-drivers.gpg]\
    \ https://developer.download-nvidia.com/compute/cuda/repos/ubuntu2204/x86_64/\
    \ /' | sudo tee /etc/apt/sources.list.d/nvidia-drivers.list\n```\n\nUpdate your\
    \ package lists once more:\n\n```bash\nsudo apt update\n```\n\nTo find the available\
    \ NVIDIA driver packages, you can search with:\n\n```\napt-cache search nvidia-driver\n\
    ```\n\nNavigate to the sources list directory:\n\n```\ncd /etc/apt/sources.list.d\n\
    ```\n\nList the directory contents to confirm the NVIDIA list file is there:\n\
    \n```\ndir\n```\n\nOpen the nvidia-drivers.list file with nano to verify its contents:\n\
    \n```\nsudo nano nvidia-drivers.list\n```\n\nEnsure it contains the correct repository\
    \ line:\n\n```\ndeb [signed-by=/usr/share/keyrings/nvidia-drivers.gpg] https://developer.download-n-nvidia.com/compute/cuda/repos/debian12/x86_64/\
    \ /\n```\n\nExit nano by pressing CTRL + X.\n\nFinally, install the NVIDIA driver\
    \ along with Vulkan support:\n\n```\nsudo apt update\n```\n\n```\nsudo apt install\
    \ nvidia-driver libvulkan1 libvulkan1:i386\n```\n\nBy following these instructions,\
    \ you'll successfully add the NVIDIA repository and install the NVIDIA driver\
    \ and Vulkan libraries on your system, ensuring optimal performance and compatibility\
    \ with a wide range of applications and games.\n\n## AMD\n\nVisit the official\
    \ AMD website at https://www.amd.com/en.html for all things AMD.\n\nThe latest\
    \ stable Open Source AMD Drivers are included as standard with Linux Mint 21.3\n\
    \nInstalling AMD via APT Repository in the Terminal:\n\nJust type these commands:\n\
    \n```\nsudo apt update\nsudo add-apt-repository ppa:oibaf/graphics-drivers\nsudo\
    \ apt update\nsudo apt upgrade\n```\n\nInstalling AMD Radeon Software via .deb\
    \ from the GUI:\n\n1. Navigate to AMD's Linux drivers support page at https://www.amd.com/en/support/linux-drivers.\n\
    2. Select \"Ubuntu x86 64-Bit.\"\n3. Locate the section for the latest Ubuntu\
    \ 22.04 HWE and click \"DOWNLOAD.\"\n4. Open your ~/Downloads folder.\n5. Double-click\
    \ the downloaded file, `amdgpu-install_6.0.60002-1_all.deb`.\n6. In the opened\
    \ window, click \"Install\" to proceed with the installation.\n\n## Radeontop\n\
    \nVisit the official Radeontop website at https://github.com/clbr/radeontop for\
    \ all things Radeontop.\n\nFor a DEB/FLATPAK Package through Software Manager:\n\
    \n1. Open Software Manager and search for Radeontop.\n2. Click on Radeontop, then\
    \ on the Source Selection Box.\n3. Choose System Package or Flatpak and hit Install.\n\
    \nInstalling Radeontop via APT in the Terminal:\n\nJust type these commands:\n\
    \n```\nsudo apt update\n```\n\n```\nsudo apt install radeontop\n```\n\n### amdgpu-fan.yml\
    \ Setup Via Command Line & GUI\n\nTo set up your AMDGPU fan configuration, first\
