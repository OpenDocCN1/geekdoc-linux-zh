    # 音频编辑软件


    音频编辑软件是用于编辑和创建音频的工具，允许用户导入和导出文件、录制声音并调整时间和音量等方面。它还包括轨道混音、应用混响和均衡等效果，以及不同文件格式之间的转换。数字音频工作站为音乐制作提供了全面的套件，并具有用户友好的界面。这些程序可以进行线性编辑，为专业级的音频调整提供实时和离线处理。


    Audacity 是一款适用于 Windows、macOS、Linux 和类 Unix 免费开源音频编辑器和录音器。自2015年以来已有超过11.4亿次下载，它因能够在主流系统上运行、支持主流音频格式并配合
    VST3 等多种插件而广受欢迎。它根据 GPL-20 或更高版本许可，还提供了深层音频分析工具用于频率可视化等，使其成为音频编辑和录制任务的首选。


    Ardour 是一款用于在 Linux、macOS 和 Windows 上录制、编辑和母制的数字音频工作站。它由 Paul Davis 创建，根据硬件不受限制，并支持延迟修正、各种监控选项和插件效果。它允许无限轨道、总线和灵活的路由。编辑功能包括高精度的拖放、修剪、分割和时间拉伸。Ardour
    在母带处理方面表现出色，与 JACK 集成高级处理并支持导出音频 CD 文件。


    Mixxx 是一款免费开源 DJ 软件，用于对数字音乐文件进行创意混音，适用于所有水平的 DJ。它具有用于曲目匹配的 BPM 和调性检测功能，可同步多四首歌，支持多种
    DJ 控制器并允许自定义映射。使用音效添加亮点并进行链式处理以增加创意。使用时间码胶片获得经典感。Mixxx 由专门的社区开发，专为渴望免费进行数字混音的
    DJ 准备。


