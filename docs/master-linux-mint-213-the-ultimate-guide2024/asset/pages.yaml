    # System Utilities


    System utilities, essentially software programs designed to aid in managing and
    optimizing a computer''s system or application software, play a crucial role in
    supporting the computer infrastructure. Unlike application software that directly
    facilitates user tasks, utilities often work behind the scenes—whether it''s backing
    up data, compressing disks, or managing files. They can be part of the operating
    system or installed separately, offering enhanced capabilities or replacing default
    tools. For ensuring security with anti-virus programs to optimizing performance
    through disk defragmenters, system utilities are indispensable for both ordinary
    users and IT professionals. They require varying levels of user privileges, depending
    on their impact on the system, and include a vast array of tools like debuggers,
    diagnostic programs, and network utilities to keep computers running smoothly
    and efficiently.


    QDirStat is a graphical tool that helps users visualize and manage disk space.
    Upgrading from its predecessor KDirStat, this Qt 5 application doesn''t require
    KDE libraries, making it across various Unix-like systems and even in Docker containers.
    It offers a dual view of directories and files: a traditional tree and a colorful
    treemap, facilitating easy identification and management of large and small files
    by their types. Notable for'
  merge: -1
  pgno: 347
- img_proc: true
  md: 'its enhancements, QDirStat introduces multi-selection, custom cleanup actions,
    and detailed error reporting, alongside configurable categories and views for
    package management, file types, and disk usage statistics. It''s a user-friendly
    solution for optimizing disk space.


    Psensor is a user-friendly GTK+ based software designed for real-time monitoring
    of hardware temperatures, including the motherboard, CPU, GPU, and hard disk drives,
    as well as CPU fan speeds. It extends its capabilities to monitoring remote servers
    and displays Linux CPU usage too. With its ability to automatically detect supported
    hardware, Psensor presents temperatures and fan speeds as both text and through
    detailed graphs, consolidating all data into a single, comprehensive graph for
    easy analysis. It also features configurable alarms and alerts to notify users
    about critical temperature and fan speed issues, ensuring the system''s health
    is always monitored efficiently.


    Stacer is an all-encompassing open-source system optimizer and application monitor
    for Linux, offering users control over various system aspects. It streamlines
    management with features for managing startup apps, cleaning the system of unnecessary
    files, handling system services and processes, and even uninstalling applications.
    The startup apps tab simplifies setting up boot-time applications, while the system
    cleaner aids in decluttering your system. Stacer also makes starting or stopping
