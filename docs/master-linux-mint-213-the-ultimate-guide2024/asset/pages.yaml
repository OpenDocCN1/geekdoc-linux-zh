  md: '# PROGRAMMING LANGUAGES


    Programming languages, systems to write software, balance form (syntax) and meaning
    (semantics) through features like types and error handling. Influenced by computer
    architecture, they''ve evolved from hardware-specific to abstract, enhancing simplicity.
    Covering imperative to object-oriented types, they cater to various needs while
    balancing benefits and trade-offs, like simplicity versus performance. This evolution
    reflects in the vibrant study and classification within computer science, making
    programming a dynamic field.


    Zig, created by Andrew Kelley, is a compact, statically typed compiled language
    aimed at system programming, positioning itself as a modern successor to C. Striving
    for simplicity and efficiency, Zig shuns macros and preprocessors, embracing instead
    flow control, easy function calls, and direct library imports. It borrows from
    newer languages through compile-time generics and a hint of reflection, enhancing
    flexibility. Zig prioritizes safety without demanding runtime checks, offering
    option types and a built-in testing frame.'
  merge: -1
  pgno: 469
- img_proc: true
  md: 'work to manage manual memory without garbage collection, distinguishing itself
    from peers like Go, Rust, and Carbon.


    Go, crafted by Robert Griesemer, Rob Pike, and Ken Thompson at Google, is a high-level,
    statically typed language akin to C, but with added memory safety, garbage collection,
    and concurrency. It thrives on simplicity and security, making it ideal for scalable
    systems. Supported by Google, Go, or Golang, boasts a robust standard library,
    built-in concurrency, and a vibrant ecosystem. Its main implementations include
    the "gc" compiler for diverse platforms and WebAssembly, and gccgo or gollvm through
    gofrontend. GopherJS even brings Go to the web by compiling it to JavaScript.


    Rust, created by Graydon Hoare in 2006 and later backed by Mozilla, is a versatile
    programming language known for its emphasis on performance, type safety, and concurrency
    without needing a garbage collector. Its unique "borrow checker" helps manage
    memory and data races effectively. Adopted by tech giants like Amazon and Google,
    and even integrated into Linux kernel development, Rust stands stands out for
    its quick uptake and impact on systems programming, blending ideas from functional
    programming for robust, efficient software creation.


    Lua is a versatile programming language born in Brazil in 1993, known for its
    efficiency and lightness. Ideal for embedded use, it runs on a cross-platform
    interpreter and offers a simple C API for integration. It excels in scripting,
    configuration, and rapid prototyping thanks to its dynamic typing, automatic memory
    management, and support for multiple programming paradigms. Lua''s development
    by PUC-Rio emphasizes speed, portability,'
  merge: -1
  pgno: 470
- img_proc: true
  md: 'and ease of embedding. Its name, meaning "Moon" in Portuguese, underscores
    its unique identity. Free and open-source, Lua stands out for its performance,
    small footprint, and adaptability across platforms and devices.


    OpenJDK is a free, open-source version of the Java Platform, Standard Edition,
    initiated by Sun Microsystems in 2006 and licensed under GPL-2.0 with a special
    exception for linking. It''s where enthusiasts and developers converge to advance
    Java SE and its related projects, offering the latest OpenJDK JDK 21 binaries
    for various operating systems. En-gage in the vibrant OpenJDK Community to explore,
    download, or contribute to projects like Amber, Loom, Panama, Valhalla, and the
    future of Java. For practical Java applications, dev.java is your go-to. Whether
    you''re learning, downloading, or contributing, OpenJDK embodies collaboration
    and innovation in Java''s evolution.'
