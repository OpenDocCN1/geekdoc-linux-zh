  md: '# Possible Fix For Lutris World of Warcraft Black Screen In-Game Store Issue


    Visit the official World Of Warcraft & Lutris websites at https://worldofwarcraft.blizzard.com/
    & https://lutris.net/ for all things World of Warcraft & Lutris.


    Possible Fix For Lutris World of Warcraft Black Screen In-Game Store Issue Via
    Command Line & GUI:


    To address the issue of a black screen in the World of Warcraft in-game store
    when using Lutris, start by opening Lutris from your application menu.


    Then, select Blizzard Battle.net and click the upward arrow next to the wine glass
    icon, choosing "Wine Configuration."


    Once the Wine Configuration window opens, find the "Windows Version" dropdown
    and select either Windows 11 or Windows 10.


    After applying this change, navigate to the "Graphics" tab and enable both "CSMT
    for improved graphic performance" and "VAAPI as backend for DXVA2 GPU Decoding.


    Next, move to the "Drives" tab, press the add button, and assign a new drive letter.
    you''ll need to locate and select the World of Warcraft directory, which includes
    the retail, classic, and classic_era folders, before clicking "OK."


    Clicl, Apply, to Apply these settings and confirm by clicking "OK" again.'
  merge: -1
