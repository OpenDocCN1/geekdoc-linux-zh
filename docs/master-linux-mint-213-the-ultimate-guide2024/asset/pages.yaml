  md: '# Cinnamon Screenshot Keybindings


    # Changing flashspot Color Attribute Via Command Line & GUI:


    Begin by opening the "Files" application from the menu, which you can access with
    the "Super" key. Then, press "CTRL + L" to enable the "Location Entry" mode. Type
    "/usr/share/themes/" and navigate to the "Mint-Y-Dark-Red" folder. Inside this
    folder, go to the "cinnamon" directory. Once there, right-click on an empty space
    and choose "open in terminal". Next, execute the command "sudo gedit cinnamon.css".
    In the editor, press "CTRL + F" to open the Find function and search for the "flashspot"
    element. Change its value from "white" to "#FFFFFF" to make the flashspot transparent,
    which prevents it from appearing in screenshots. Save your changes in gedit and
    exit. Finally, press "ALT + F2" to open the cinnamon run command box, type "r",
    and hit enter to restart cinnamon. This ensures that your modifications to the
    cinnamon.css file are applied.


    # Creating Screenshots Folder Via GUI:


    To create a "Screenshots" folder using the graphical user interface (GUI), first,
    open the "Files" application and navigate to the "~/Pictures" directory. Then,
    right-click on an empty space and select the option to create a new folder. After
    the folder is created, rename it to "Screenshots."'
  merge: -1
