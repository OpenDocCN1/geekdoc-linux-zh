    Type=Application

    Name=Searx

    Comment=Searx - Privacy-respecting, open-source metasearch engine

    Exec=sh -c ''/home/username/searx/venv/bin/python /home/username/searx/searx/webapp.py''

    Icon=terminal

    Terminal=false

    Categories=Network;WebBrowser;

    ```'
