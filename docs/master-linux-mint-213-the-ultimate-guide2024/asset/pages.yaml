  merge: -1
  pgno: 277
- img_proc: true
  md: '```

    git clone https://github.com/searx/searx.git

    cd searx


    python3 -m venv venv

    source venv/bin/activate

    ```


    Open requirements.txt and replace any werkzeug entry(or add the following if one
    is not present) with werkzeug==2.2.2, then save your changes.


    Install the Python requirements:


    ```

    pip install -r requirements.txt

    ```


    Copy the default settings file and make your customizations:


    ```

    cp searx/settings.yml searx/settings_custom.yml

    \gedit searx/settings.yml

    ```


    Edit settings.yml to your preference, including changing the secret key.


    Enable advanced search in preferences.py by setting advanced_search to True:


    ```

    gedit searx/preferences.py

    ```


    Find settings[''ui''].get(''advanced_search'', False), and change False to True.


    Save all changes and exit the editor. Deactivate the virtual environment:'
  merge: -1
  pgno: 278
- img_proc: true
  md: 'Start Searx with the following command, replacing username with your actual
    username:


