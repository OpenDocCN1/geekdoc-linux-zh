  md: '# GUFW Single Port Rules


    To set up a single port rule in GUFW, follow these steps:


    Open GUFW from the application menu, identified as "Firewall Configuration."


    In the "Profile" box, select "Home."


    Activate the firewall by toggling the "Status" switch to the right.


    For "Incoming" traffic, choose "Deny" from the box.


    For "Outgoing" traffic, select "Allow."


    Navigate to the "Rules" section and click the "+" button to add a new rule.


    Go to the "Simple" tab.


    In the "Name" box, enter "HTTP."


    From the "Policy" dropdown, select "Allow."


    Choose the direction of the rule under "Direction" by selecting "In."


    For the protocol, pick "Both" for both TCP and UDP, "TCP" for only TCP, or "UDP"
    for only UDP, depending on the requirement for the port rule.


    In the "Port" box, enter "80."


    Click "Add" to apply the rule.'
  merge: -1
  pgno: 132
- img_proc: true
  md: This method allows you to efficiently manage port rules in GUFW, ensuring your
    firewall settings are correctly configured for your needs.
  merge: -1
  pgno: 133
- img_proc: true
  md: '# GUFW Multi Port Rules


    To configure rules for multiple ports in GUFW, proceed as follows:


    Open GUFW from your application menu, ensuring you select "Firewall Configuration"
    and not a similarly named application.


    Navigate to the "Rules" section and click the "+" to add a new rule.


    Select the "Simple" tab within the rule creation window.


    In the "Name" field, enter a descriptive name, such as "HTTP/HTTPS."


    Choose "Allow" from the "Policy" dropdown menu to permit traffic.


    Set the "Direction" to "In" for incoming rules.


    For the "Protocol," select "Both" if both TCP and UDP are needed, "TCP" for TCP
    only, or "UDP" for UDP only, based on the ports you''re configuring.


    In the "Port" field, input the ports you wish to allow, separated by a comma,
    for example, "80,443."


    Click "Add" to finalize and apply the rule.


    This approach enables the setup of firewall rules for multiple ports in GUFW,
    streamlining the management of network traffic for your system.'
  merge: -1
  pgno: 134
- img_proc: true
  md: '# GUFW Range Port Rules


    To implement range port rules in GUFW, follow these instructions:


    Open GUFW from your application menu, ensuring to select the correct "Firewall
    Configuration" option.


    Head over to the "Rules" section and press the "+" button to create a new rule.


    In the rule creation window, switch to the "Simple" tab.


    Enter a name for your rule in the "Name" field, like "HTTP Range."


    From the "Policy" dropdown, select "Allow" to permit traffic.


    Choose "In" from the "Direction" dropdown for incoming traffic.


    For the protocol, pick "TCP" if you''re setting up TCP ports, or "UDP" for UDP
    ports, depending on your needs.


    Click "Add" to apply and save your new range port rule.


    This method allows you to efficiently manage port ranges within GUFW, facilitating
    precise control over your network traffic permissions.'
