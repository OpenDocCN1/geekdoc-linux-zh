  md: '# Searx.py .desktop Shortcut


    To create a desktop shortcut for Searx, start with opening your terminal and navigate
    to the applications directory:


    cd /usr/share/applications


    Then, open a new file named searx1.desktop with your preferred text editor using
    sudo for permissions:

