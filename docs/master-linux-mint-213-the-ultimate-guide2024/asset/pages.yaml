  md: Virt-manager, developed mainly by Red Hat, is a desktop tool for managing virtual
    machines (VMs) via libvirt. It supports creating, editing, starting, and stopping
    VMs, alongside viewing their performance and console. It's compatible with KVM,
    Xen, QEMU, LXC containers, and even FreeBSD's bhyve hypervisor since 2014. Its
    suite includes virt-install for easy VM setup, virt-viewer for interacting with
    VM displays, virt-clone for cloning VMs, virt-xml for editing VM configurations,
    and virt-bootstrap for setting up libvirt-based containers' root file systems.
