  md: '# Focused Window Screenshot Via GUI:


    To take a screenshot of the focused window through the GUI, first, open the "Settings"
    from the application menu. Then, navigate to "Keyboard" and select "Shortcuts."
    Click on "Add custom shortcut." For the name, enter "Focused Window Screenshot."
    In the command field, input bash -c "cd ~/Pictures/Screenshots && gnome-screenshot
    -w -f screenshot_$(date +%d-%m-%y-%H-%M-%S).png" . After adding the command, click
    "Add." Next, assign it a keyboard binding by clicking on "Keyboard Bindings" and
    pressing the "F10" key to set it as the shortcut.


    # Fullscreen Screenshot Via GUI:


    To take a screenshot of the focused window through the GUI, first, open the "Settings"
    from the application menu. Then, navigate to "Keyboard" and select "Shortcuts."
    Click on "Add custom shortcut." For the name, enter "Fullscreen Screenshot." In
    the command field, input bash -c "cd ~/Pictures/Screenshots && gnome-screenshot
