    # Chapter 8: X Forwarding


    Unix-like systems use the X protocol (or X11) to display a graphic user interface.
    X has improved over the years but it’s still famously baroque. One of X’s more
    useful features is the separation between the system a program runs on and the
    system the program’s display appears on. You can run a program on one host, and
    have the display appear on a completely different workstation. I can run a graphical
    web browser on a host on the public Internet, and funnel the display back to my
    laptop inside my employer’s firewall, bypassing the firewall content filter restrictions—for
    completely legitimate work reasons, of course. In this scenario all web requests
    originate from my server, and the results appear on my laptop. You can do the
    same thing with any X program.


    If you’ve never used X before, it might seem a little strange. That’s okay. Play
    with it and you’ll quickly understand its usefulness.


    Vanilla X transmits information across the network unencrypted. Secure X in-transit
    by wrapping it with SSH via X11 forwarding.


    # X Security


    X dates from a time when network security was not nearly the issue it is today.
    The developers were happy to get graphic applications working at all, given the
    limited hardware available in those days. Retrofitting security into any protocol
    isn’t as effective as we might hope. Displaying X from a remote machine requires
    extending trust to the remote machine. The more you trust the remote machine,
    the more X programs you can display locally. If you fully trust a compromised
    machine, the intruder can use X to take over your workstation, capture your keystrokes,
    and access your systems as if she was you.


    Only permit X forwarding to users or hosts that truly require it.


    # X and the Network


    Back when X was developed, a site’s Internet connection might be as fast as 56
    kbs. Attempting to use X forwarding between sites was the sort of things sysadmins
    would laugh at over a beer. Now that bandwidth is not such a concern, though,
    people might run a browser on one continent and display it in another.


    While bandwidth is no longer an issue in many parts of the world, latency is very
    real. Many graphical programs are highly sensitive to latency. A program might
    reasonably expect to perform several hundred graphics operations a second. That’s
    fine when each takes a nanosecond. When each takes fifty milliseconds thanks to
    the cross-country link, though, your program becomes unusable. If latency isn’t
    a problem, jitter and packet loss can destroy usefulness.'
