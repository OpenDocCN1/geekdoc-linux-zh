    ## 第 1 章：加密、算法和密钥


    OpenSSH 会加密流量。这是什么意思，它是如何工作的？我已在我的书籍《PGP & GPG》（No Starch Press，2006）中详细解释，但这里是简要版本。


    加密将可读的 *明文* 转换为攻击者无法理解的不可读 *密文*。*解密* 逆转该转换，将看似乱码的文本还原为可读文本。*加密算法* 是执行此转换的确切方法。大多数孩子会发现用数字代替字母的代码，即
    A 等于一，B 等于二，Z 等于 26，依此类推。这是一个简单的加密算法。现代计算机驱动的加密算法一次处理文本块并执行更复杂的转换。


    大多数加密算法使用 *密钥*；用于加密消息的一段文本、数字、符号或数据。密钥可以由用户选择或随机生成。（人们习惯选择容易猜测的密钥，因此 OpenSSH 甚至不给用户创建自己的选项。）加密算法使用密钥加密文本，使外部人员更难解密。即使你知道加密算法，没有秘密加密密钥也无法解密消息。


    把加密算法想象成一种锁的类型，而密钥是特定的钥匙。锁有许多不同类型：家门、自行车、工厂等等。每种都使用特定类型的钥匙——你的门钥匙可能形状不对，无法插入任何车辆点火装置。但即使是正确类型的钥匙也不会在错误的锁上起作用。你的前门钥匙只能打开你的前门。加密密钥的工作方式类似。


    ### 算法类型


    加密算法分为两种：对称和非对称。


    *对称算法* 使用相同的密钥进行加密和解密。对称算法包括但不限于高级加密标准（AES）和 ChaCha20，以及较老但现在不安全的算法如 3DES 和 Blowfish。孩子的替换代码就是一种对称算法。一旦你知道
    A 等于一等等，你就可以加密和解密消息。对称算法（比简单替换更复杂）可以非常快速和安全，只要只有授权人员拥有密钥。问题在于：获得密钥的外部人员可以阅读你的消息或用自己的消息替换。你必须保护密钥。通过互联网明文发送密钥就像站在操场上大喊“
    A 是 一，B 是 二”。任何听到密钥的人都可以阅读你的私人消息。


    *非对称算法* 使用不同的密钥进行加密和解密。你用一个密钥加密消息，然后用另一个密钥解密。这之所以可行，是因为密钥是非常大的数字，而将非常大的数字相乘比弄清楚如何除它们要容易得多。（如果你想要细节，互联网上有非常好的解释。）非对称加密只有在能够处理非常困难的数学运算的计算机广泛可用后才变得流行，并且比对称加密慢得多、计算成本高得多。


    拥有两个独立的密钥创造了有趣的可能性。让一个密钥公开。送出去。向全世界广播。另一个密钥保持私有，并不惜一切代价保护它。任何拥有公钥的人都可以加密一条只有知道私钥的人才能阅读的消息。拥有私钥的人可以加密一条消息并发送到世界各地。任何人都可以使用公钥解密该消息，但公钥能够解密该消息这一事实向收件人保证了消息发送者拥有私钥。这就是
    *公钥加密* 的基础。公钥及其匹配的私钥称为 *密钥对*。再次想想你前门的锁。锁本身是公开的；任何人都可以触摸它。钥匙是私有的。你必须两者兼有才能进入你的家。（你可以通过研究
    Diffie-Hellman 密钥交换了解更多。）


    ### SSH 如何使用加密


    对称加密速度快，但没有办法让主机安全地交换密钥。非对称加密允许主机交换公钥，但它速度慢且计算成本高。如何在从未通信过的两个主机之间高效地加密会话？


    每个 SSH 服务器都有一个密钥对。每当客户端连接时，服务器和客户端使用该密钥对协商一个仅在这两个主机之间共享的临时密钥对。客户端和服务器都使用这个临时密钥对派生出一个对称密钥，用于在此会话期间交换数据，以及提供连接完整性的相关密钥。如果会话运行时间很长或交换大量数据，计算机将间歇性地协商新的临时密钥对和新的对称密钥。SSH
    协议比这更复杂，并包括防止多种不同密码攻击的安全措施，但密码密钥交换是协议的核心。


    SSH 支持许多对称和非对称加密算法。客户端和服务器在每次连接时协商双方同意的算法。

    '
