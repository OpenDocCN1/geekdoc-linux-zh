    ![](img/66dbcb7210a5fe0a8b3a1ecd91eb0e6d_112_0.png)


    图 13-1：VPN 网络


    我们将使用 SSH 在两个主机之间建立点对点隧道。隧道的客户端将具有 IP 地址 192.168.0.2/30。隧道服务器端使用 192.168.0.1/30。


    我们将考虑 OpenBSD、FreeBSD、Debian 和 CentOS。OpenBSD 拥有任何操作系统中最好的 SSH VPN 支持——这不足为奇，因为
    OpenSSH 源自 OpenBSD。在 FreeBSD 上运行 SSH VPN 需要基本的脚本编写。大多数 Linux 发行版会修改 OpenSSH 以更好地适应其系统，并且它们还弃用了标准的
    UNIX 网络命令，转而使用 Linux 特定的工具。这意味着每个操作系统都需要不同的方法。在这四者之间，你应该能找到一种可为你的操作系统适配的方法。


    创建和管理 VPN 是 OpenSSH 中最困难的功能，并且支持它们的系统会随时间变化。我不会感到惊讶，如果这些 VPN 指令比本书其余部分更快地过时。如果你在这
    些示例中遇到问题，请查阅操作系统的文档以获取更当前的参考资料。


    ## Common Concepts


    以下概念和 OpenSSH VPN 的配置适用于所有操作系统。无论你运行哪个操作系统，你都必须理解这些材料并遵循这些通用原则。虽然你可以找到声称简化隧道设置的工具，但一旦你理解隧道的工作原理，你会发现使用原始
    SSH 非常简单。


    ## Tunnel Interfaces


    SSH VPN 使用隧道（或 tun）接口工作。隧道是一个虚拟接口，位于其他网络接口之上。隧道接口最常见的用途是在两个独立主机之间创建虚拟链路，例如在 VPN
    中。该隧道被视为点对点连接。创建隧道接口的方法因操作系统而异。


    当你使用 SSH VPN 时，客户端和服务器都会在其各自机器上附加到隧道接口。当操作系统向隧道发送数据包时，该数据包会通过 SSH 连接中继。当另一台机器的
    SSH 进程接收到数据包时，它会解包并通过本地隧道接口将其发送给操作系统。


    就像你想要用于 IP 路由的任何其他接口一样，你的隧道接口需要 IP 地址。你必须将发往远程网络的流量路由到隧道远端的 IP 地址。我们将在每个示例中演示这一点。


    每个隧道接口都需要一个设备号，就像类 Unix 系统上的任何其他设备一样。就像你的网络接口可能是 eth0 或 em1 一样，隧道设备可能是 tun0 或
    tun1。我们的示例使用设备零，创建类似 tun0 的设备名称。如果你有许多隧道设备，我建议为每个用途分配特定的设备并重新评估你的设计选择。


    ## SSH Server Configuration


    sshd_config 关键字 PermitTunnel 指定客户端是否可以建立 VPN 隧道。PermitTunnel 有四个有效选项：yes、no、point-to-point
    或 ethernet。如果设置为 no（默认值），则禁止隧道。如果设置为 yes，则允许所有隧道。


    点对点隧道是从一个位置到另一个位置的虚拟专用电路。点对点隧道需要路由才能使用。这通常是 SSH VPN 的最佳隧道类型。


    ```

    PermitTunnel point-to-point

    ```


    以太网隧道传输第 2 层流量，允许两个独立位置共享其本地局域网。如果可能避免，请不要通过 SSH 隧道传输以太网。VPN 一侧的本地网络问题可能会在链路上传播并饱和你的外部带宽。SSH
    VPN 本身就容易受拥塞影响；不要进一步放大这个问题。


    要使用 SSH VPN，SSH 进程必须具有足够的权限来更改客户端和服务器上的隧道设备和路由表。创建 SSH VPN 需要客户端和服务器上的 root 权限。你将以
    root 身份运行 ssh 并直接以 root 登录。我之前说过以 root 登录是一个糟糕的选择。我坚持这一说法。然而，如果你使用 SSH VPN，你基本上没有好的选择了。


    在这里，我允许我们的 SSH 客户端通过 SSH 服务器进行 root 登录，但仅限于公钥认证。我还允许该 IP 地址打开隧道。


    ```

    Match Address avarice.mwl.io

    PermitRootLogin prohibit-password

    PermitTunnel point-to-point

    ```


    在你的生产配置中，使用客户端的 IP 地址而不是主机名。


    OpenSSH 的非常旧版本可能不允许你在 Match 语句内放置 PermitTunnel 语句。如果你遇到这样的 sshd，请立即升级服务器的 OpenSSH——在公共互联网上这样做是不安全的。


    ## IP Forwarding


    为了使 SSH VPN 连接两个不同的网络，SSH 服务器和客户端都必须将数据包从一个接口转发到另一个接口。这称为 *IP 转发*。在接口之间转发数据包是主机和路由器之间唯一的差异。SSH
    客户端在其内部以太网接口上接收数据包，并通过 VPN 传输发往远程位置的数据包。类似地，SSH 服务器在其内部接口上接收发往另一办公室的数据包并通过 VPN
    发送它们。


    ## VPN Authentication Key


    使用 VPN 时使用密钥认证。如果你只在特殊场合手动启动 VPN，请创建标准用户认证密钥，如第 7 章“SSH Keys”所述。如果自动化进程将启动 VPN，请创建无密码短语的密钥，如第
    12 章“Automation”所述。将密钥放在特殊文件中，例如客户端上的 `/root/.ssh/tunnelkey`。


    将密钥的公钥复制到服务器的 `/root/.ssh/authorized_keys`。该密钥只能运行 VPN 命令；即使使用基于密钥的认证，你也不希望远程入侵者能够在你的服务器上获得
    root 登录。第 12 章讨论了限制密钥权限，但所需确切命令因操作系统而异。


    ## The SSH Tunnel Command


    使用 `-w` 标志激活 OpenSSH 隧道。


    ```

    # ssh -i keyfile -f -wclientTunnelNumber:serverTunnelNumber servername true

    ```


    `-i` 告诉 `ssh` 使用哪个私钥文件。`-w` 告诉客户端请求隧道，以及在每一侧请求哪个隧道设备号。`-f` 将 `ssh` 置于后台，这样你就不会在远程系统上获得命令提示符。我们运行
    `true(1)` 只是为了有一个总是成功运行的命令。


    在我们的示例中，密钥文件是 `/root/.ssh/tunnelkey`。我希望在每一侧使用隧道设备 0，服务器是 `gluttony.mwl1.io`。


    ```

    # ssh -i tunnelkey -f -w0:0 gluttony.mwl1.io true

    ```


    如果一切正常，这应该会静默返回到本地命令提示符。


    这些命令行选项中的一些可以在 `ssh_config` 中设置。我建议将隧道选项放在 `/root/.ssh/config` 中，而不是系统范围的配置。你不希望特权用户无辜的
    SSH 会话尝试打开隧道并通过其路由。


    ```

    Host gluttony.mwl1.io

    Tunnel point-to-point

    TunnelDevice 0:0

    IdentityFile /root/.ssh/tunnelkey

    IdentitiesOnly yes

    ```


    根据你的环境或操作系统要求为该主机添加其他选项。这简化了激活隧道所需的命令行。


    ```

    # ssh -f gluttony.mwl1.io true

    ```


    我们的示例假设你已启用 root 登录，将客户端的公钥复制到服务器，并在 `/root/.ssh/config` 中设置了主机的密钥和隧道设备。


    ## Debugging


    如果你按照操作系统的步骤操作但隧道未启动，请以详细模式运行 `ssh`。你将看到错误的详细信息。如果这没有帮助，请以调试模式运行 `sshd`。在互联网上搜索你的错误消息的确切文本。你一定会找到遇到并解决过你这个问题的人。


    现在让我们配置一些 VPN。


    ## OpenBSD


    OpenSSH 在 OpenBSD 内部开发，OpenBSD 团队创建了 OpenSSH VPN 功能，因此 OpenBSD 对 OpenSSH VPN 具有非常好的支持。首先通过在
    `/root/.ssh/authorized_keys` 中放置控制来收紧客户端可以使用此密钥访问的内容。


    ```

    restrict,tunnel="0",command="/bin/sh /etc/netstart tun0" ssh-rsa AAAAB3Nza...

    ```


    我已锁定所有基于密钥的选项，然后添加了访问特定隧道设备并运行配置该隧道的命令的能力。即使客户端被入侵并以 `root` 身份登录到服务器，它也无法造成多大损害。


    通过将 sysctl `net.inet.ip.forwarding` 设置为 1 在 OpenBSD 上启用数据包转发。


    ```

    # sysctl net.inet.ip.forwarding=1

    ```


    为了使此更改在重启后永久生效，请在 `/etc/sysctl.conf` 中添加匹配条目。


    ```

    net.inet.ip.forwarding=1

    ```


    现在配置你的隧道设备。你需要在客户端和服务器上都有一个 `/etc/hostname.tun0`。每个包含两行。以下是客户端：


    ```

    192.168.0.2 192.168.0.1 netmask 255.255.255.252

    ```


    ```

    !route add 172.17.0.1/24 192.168.0.1 > /dev/null 2>&1

    ```


    第一行创建了一个隧道接口，本地 IP 为 192.168.0.2，远程 IP 为 192.168.0.1。OpenBSD 会在启动时配置此接口，但接口不会处于活动状态；隧道未附加到任何东西。当你激活
    SSH 隧道时，它会附加到隧道接口。`hostname.tun0` 的第二行是 OpenBSD 在隧道激活时运行的命令。此命令配置到服务器后面 LAN 的路由。


    服务器的 `hostname.tun0` 看起来非常相似。


    ```

    192.168.0.1 192.168.0.2 netmask 255.255.255.252

    ```


    ```

    !route add 172.16.0.1/24 192.168.0.2 > /dev/null 2>&1

    ```

