    catchy 以至于重复的东西都是糟糕的选择。如果你的想象力完全枯竭，Diceware (http://www.diceware.com) 是一种使用普通骰子从真实单词中随机生成大部分可记忆密码短语的工具。虽然入侵者可以毁掉你的一周，但拥有你的私钥且有幽默感的同事可能更令人恼火。


