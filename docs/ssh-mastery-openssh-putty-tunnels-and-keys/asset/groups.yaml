    ## Chapter 5: SSH Clients

    ## 第 5 章：SSH 客户端


    SSH client software resides on a user’s workstation and permits connections to
    an SSH server. We’ll discuss two common clients: the OpenSSH command-line client
    for Unix-like hosts, ssh(1), and the PuTTY client for Microsoft Windows. Both
    clients are freely usable and redistributable, in source or binary form, with
    very minimal restrictions or limitations.

