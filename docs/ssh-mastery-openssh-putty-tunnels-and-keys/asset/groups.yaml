    You’ll hear in many places that SSH can compress data before sending it over the
    network. This was very useful back when a 33.6 modem was the standard way for
    people to connect from home. On modern multi-megabit connections, compression
    normally slows down connections. Consider using compression if and only if you
    are seriously bandwidth-constrained.


    The one case where compression makes sense is in forwarding X (Chapter 8). Adding
    the -C flag to ssh(1) can as much as double throughput of forwarded X connections.


    That covers the basics of PuTTY and the OpenSSH client. Now let’s look at using
    SSH to move files around the network.


