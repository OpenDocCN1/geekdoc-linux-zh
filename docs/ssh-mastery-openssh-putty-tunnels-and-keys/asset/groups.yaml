    ## 配置 sshd(8)


    本章讨论了一些通常有用的 sshd(8) 选项。大多数 sshd_config 选项都出现在它们最有用的章节中——也就是说，影响 X 转发的选项出现在第 8
    章“X 转发”中，而证书选项则出现在第 14 章“证书颁发机构”中。


    你操作系统附带的 OpenSSH 版本可能不支持本书中描述的所有关键字。我是基于 OpenSSH 7.6 编写的。某些操作系统要么提供较旧的版本，要么出于自身原因故意移除功能。如果某个配置选项在你的服务器上不起作用，请查阅操作系统的文档或咨询你的供应商。²


    ### 设置主机密钥


    HostKey 关键字给出包含私钥的文件的完整路径。每个受支持的加密算法使用单独的文件。


    ```

    HostKey /usr/local/etc/ssh/ssh_host_rsa_key

    HostKey /usr/local/etc/ssh/ssh_host_ecdsa_key

    HostKey /usr/local/etc/ssh/ssh_host_ed25519_key

    ```


    默认文件以它们包含的密钥类型命名。文件 ssh_host_rsa_key 包含 RSA 密钥，ssh_host_ed25519_key 是 ED25519
    密钥，以此类推。这不是强制性的——OpenSSH 会判断文件中的密钥类型并在合适时加载它——但这绝对是最佳实践。将你的 RSA 密钥放在名为 ED25519
    的文件中会让每个人都感到困惑。


    不同操作系统对缺失的密钥文件处理方式不同。BSD 风格和基于 Red Hat 的系统会自动创建缺失的密钥文件。许多 Linux 系统要求系统管理员手动创建缺失的密钥文件，但会将其集成到常规系统管理工具中。例如，基于
    Debian 的系统在运行 dpkg-reconfigure openssh-server 时会创建缺失的密钥文件。


    第 7 章“SSH 密钥”介绍了使用 OpenSSH 原生工具创建主机密钥的方法。


    ### 网络选项


    你可以控制 sshd(8) 如何使用网络，从 IP 版本一直到 TCP 端口。


    ```

    Port 22

    AddressFamily any

    ListenAddress 0.0.0.0

    ListenAddress ::

    ```


    Port 关键字控制 sshd 使用的 TCP 端口。互联网标准规定 SSH 运行在 22 端口。一些组织出于提高安全性的希望为 SSH 使用不同的端口。在不寻常的端口上运行
    SSH 并不会真正提高 SSH 的安全性，但会减少来自 SSH 破解蠕虫的登录尝试次数，如本章后面“保护 SSH 服务器”部分所述。它还能让你绕过特别无效的防火墙。可以在命令行使用
    -p 来覆盖 Port 关键字。


    AddressFamily 指 sshd 使用的 TCP/IP 版本。要仅使用 IPv4，将其设置为 inet。要仅使用 IPv6，将其设置为 inet6。默认值
    any 告诉 sshd 无论请求通过何种协议到达都进行处理。某些操作系统对 sshd(8) 进行了修补以支持非 TCP/IP 协议，例如流控制传输协议 (SCTP)。


    许多主机拥有多个 IP 地址。默认情况下，sshd 在所有地址上监听传入请求。如果你想限制 sshd 绑定的 IP 地址，请使用 ListenAddress
    关键字。ListenAddress 为 0.0.0.0 表示“所有 IPv4 地址”，而 :: 表示“所有 IPv6 地址”。（某些操作系统使用 :: 表示“所有
    IPv4 和 IPv6 地址”，因为他们为什么要让你仅为 IPv6 开启服务呢？）每个 ListenAddress 接受一个 IP 地址作为参数，但你可以使用任意多个
    ListenAddress 关键字。明确列出你希望 SSH 服务器接受连接的每个 IP 地址。


    如果一台主机有许多 IP 地址，而你只想阻止其中几个的 SSH 访问，使用数据包过滤器阻止流量可能比使用许多 ListenAddress 语句更容易。


    你还可以通过在 ListenAddress 语句中指定端口，使用 ListenAddress 在特定 IP 地址上添加额外端口。请考虑以下配置。


    ```

    ListenAddress 0.0.0.0

    ListenAddress 192.0.2.8:2222

    ```


    我们第一个 ListenAddress，0.0.0.0，告诉 sshd 监听此机器上的所有地址。默认 Port 为 22，因此我们在所有地址上都会得到 22
    端口。这没问题。第二个 ListenAddress 使 sshd 还在地址 192.0.2.8 上监听 2222 端口的连接。每个地址都可以有自己的 ListenAddress
    语句。


    ```

    ListenAddress 192.0.2.8:2222

    ListenAddress 192.0.2.9:25

    ListenAddress 192.0.2.10:80

    ```


    三个不同的地址，每个地址使用不同的端口。顺便说一下，让 sshd 监听 SMTP 和 HTTP 端口通常是不明智的，但 OpenSSH 并没有设计成阻止你做通常不明智的事情。如果你被困在只允许
    80 和 443 端口的幼稚防火墙后面，在这些端口上运行 sshd 就可以绕过防火墙。³


    ### 横幅和登录消息


    许多系统管理员希望在用户登录前显示一条消息。这称为横幅。SSH 协议并不要求客户端显示横幅。服务器可以提供横幅，但你无法保证用户会看到它。ssh(1) 和
    PuTTY 都显示横幅。将关键字 Banner 设置为文件的完整路径。


    ```

    Banner /etc/ssh/banner

    ```


    请注意，如果横幅确实生效，它可能会干扰通过 SSH 运行的自动化进程。在某些地区，横幅可以作为对入侵者的法律通知。（顺便说一下，我不知道有人因使用此类横幅警告而被成功起诉，但那就是法律。）选择你更喜欢的头痛。


    如果用户使用公钥进行身份验证并且客户端确实显示了横幅，登录将继续进行。在登录完成之前，没有人会看到你的法务部门关于登录主机的措辞精美的警告。


    你可以可靠地显示系统每日消息 /etc/motd。尽管如此，这条消息要到客户端已通过身份验证后才会出现，因此可能无法满足你的需求。关键字 PrintMotd
    默认设置为 yes，但你可以将其关闭。


    ```

    PrintMotd yes

    ```


    在使用可插拔认证模块 (PAM) 的系统上，PAM 模块可能负责打印 /etc/motd。如果你在启用或禁用 /etc/motd 显示时遇到问题，请检查你的
    PAM 配置。


    一旦用户登录，sshd 会打印用户的上次登录时间和登录来源。要关闭此功能，将 PrintLastLog 设置为 no。


    ```

    PrintLastLog yes

    ```


    虽然这看起来可能不必要，但我强烈建议保持 PrintLastLog 开启。多次情况下，用户在看到上次登录来自外国或在荒谬的时间时向我报告了入侵。


    ### 身份验证选项


    在默认的 OpenSSH 安装中，用户可以在单个 SSH 会话中尝试登录 6 次，时间为 2 分钟。你应该在几乎所有地方使用公钥身份验证（第 7 章“SSH
    密钥”），但即使是使用密码的用户也应该能在二十秒内错误输入密码。你可以更改时间和尝试次数。


    LoginGraceTime 关键字控制 sshd 给用户进行身份验证的时间。如果会话在未成功身份验证的情况下连接 sshd 达到此时间，连接将被终止。你可以指定秒数
    (s)、分钟数 (m) 或小时数 (h)。


    ```

    LoginGraceTime 2m

    ```


    你还可以使用 MaxAuthTries 控制用户在单个连接中可以尝试身份验证的次数。默认值为 6。


    ```

    MaxAuthTries 6

    ```


    在单个会话中用户允许的尝试次数的一半失败后，sshd 会记录进一步的失败。身份验证尝试包括公钥身份验证和密码。在 MaxAuthTries 次失败后，用户必须发起新的
    SSH 会话并重试。


    我通常的失败流程是登录失败六次，然后才想起我在该机器上有不同的用户名。当我遵循第 5 章“SSH 客户端”中关于更改用户名的建议，并像第 7 章“SSH 密钥”中那样在各处安装我的公钥时，这个问题就消失了。


    ### 根据 DNS 验证登录尝试


    日志消息如“来自老板电脑的登录失败”会让你叹气。日志消息如“来自 Hacker Haven Nation 的登录成功”应该触发警报。IP地址的所有者控制该地址的反向
    DNS。入侵者如果控制其 IP 地址的反向 DNS，可以将显示的主机名更改为你公司内部的名称。为了防止此类攻击，sshd 可以根据正向 DNS 条目验证连接尝试。


    ```

    UseDNS no

    ```


    当设置为 yes 时，每当客户端连接时，sshd 会查找源 IP 的主机名，然后查找该主机名的 IP 地址。如果 DNS 名称不匹配，sshd 会拒绝连接。


    假设入侵者控制其 IP 地址 192.0.2.99 的反向 DNS。他将其主机名设为组织内部的名称，例如 dhcp12.mwl.io，并连接到你的 SSH
    服务器。你的 SSH 服务器会向其 DNS 服务器查询 dhcp12.mwl.io 的 IP 地址。如果该 DNS 条目不存在，或指向除 192.0.2.99
    之外的 IP，sshd 会拒绝连接。


    如果 DNS 失败，sshd 会等待完整的 DNS 超时后才允许连接。


    UseDNS 要求你的 DNS 整洁、一致且正确。虽然我支持审计组织的 DNS 条目，但通过 UseDNS 进行此类审计缺乏优雅性。如果入侵者可以污染服务器的
    DNS 缓存，DNS 检查就无济于事。如果你是家庭用户，你的 ISP 可能控制着连接的反向 DNS。此外，DNS 检查会增加系统负载。如果你同时为数百或数千个
    SSH 用户提供服务，该负载可能相当可观。当 DNS 失败时，失败的 DNS 检查会减慢所有 SSH 登录。最后，许多 IPv6 站点尚未配置反向 DNS，未来一段时间内也不会配置。


    我不建议启用 UseDNS。

