    The token %u represents the username.

    The token %h represents the user’s home directory.

    Most of the other tokens are used only in very special circumstances, when using
    less common functions. We’ll touch on them as needed, but these are the ones everyone
    must know. The sshd_config(5) man page lists all the tokens.


    # Chrooting Users


    At times a user needs access to a command prompt or a specific program, but you
    don’t want the user to access anything outside his home directory. A directory
    the user cannot escape is called a chroot. (A chroot is also useful for SFTP,
    as discussed in Chapter 6, but that requires much less configuration.) OpenSSH
    supports chrooting users with the ChrootDirectory option.


    ```

    ChrootDirectory none

    ```


    By default, sshd does not chroot users.


    # Populating a Chroot


    A chrooted user cannot access anything outside the chroot. Any chroot you create
    will not have device nodes, shells, or other programs unless you place them there.
    When your restricted user logs in, sshd will fail to find a shell or home directory
    and immediately disconnect them. To give a chrooted user shell access you must
