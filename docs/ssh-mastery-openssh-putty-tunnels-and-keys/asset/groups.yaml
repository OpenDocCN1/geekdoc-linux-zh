    You can verify dynamic forwarding with any program that supports SOCKS proxies.
    The most common program of this type is a web browser.


    Configure your firewall to block all port 80 traffic from your workstation.


    Verify that you can no longer browse the web. If you’re going to browse, you’ll
    need to do it over proxy.


