    *known_hosts* 条目。*sshd_config* 中的 HostKeyAlgorithms 关键字让你可以设置 sshd 用于主机识别的算法。


    ```

    HostKeyAlgorithms ssh-ed25519, ssh-rsa

    ```


    你将使用确切的方法完全取决于你熟悉的工具和已有的自动化。如果可能，请重新利用你现有的工具。


    如果你编写了一个用于收集、验证和构建 *known_hosts* 文件的好工具，请将其公开。


