    # Chapter 15: OpenSSH Scraps


    This chapter covers a potpourri of SSH topics that you should probably know about,
    but that don’t merit their own chapters. We’ll discuss host key rotation in OpenSSH,
    connecting to hosts that only support obsolete ciphers, and escape characters.


    # Host Key Rotation


    After a host has been accepting connections from the public Internet for a year
    or two, you should consider rotating the host keys. Not only do algorithms grow
    easier to break as computing power advances, but prospective intruders have had
    more time to brute-force your private key. If you ask your users to verify new
    host keys every year or so, though, they’ll get annoyed. You can use the existing
    host key to securely transmit the new host key to the client. This isn’t useful
    if the existing host key has been compromised, but it can let you proactively
    distribute the forthcoming host keys to clients before getting rid of the old
    ones.


    Once you have many servers, OpenSSH certificates are more useful than occasional
    key rotation. Certificates eliminate *known_hosts* and the need to update the
    client at all.


    Configure SSH key rotation on both the server and the client.


    # Server Key Rotation


    Start by creating your next set of keys. Create each sort of key you intend to
    support. They’ll need different file names, of course. I name new keys prepended
    with the year they’re created.


    ```

    ```bash

    # ssh-keygen -f 2018_ssh_host_rsa_key -t rsa -N ''''

    # ssh-keygen -f 2018_ssh_host_ecdsa_key -t ecdsa -N ''''

    # ssh-keygen -f 2018_ssh_host_ed25519_key -t ed25519 -N ''''

    ```

    ```


    This gives us four new keys. Now use the standard *sshd_config* HostKey keyword
    to add these keys. Add new keys after the existing host keys.


    ```

    ```

    HostKey /etc/ssh/2018_ssh_host_rsa_key

    HostKey /etc/ssh/2018_ssh_host_dsa_key

    HostKey /etc/ssh/2018_ssh_host_ecdsa_key

    HostKey /etc/ssh/2018_ssh_host_ed25519_key

    ```

    ```


    Your server is now ready to distribute those host keys to clients.


    Once you’re certain all of your clients have copies of the new host keys, and
    you’ve given up waiting for that one user who never updates everything, you can
    disable the old host keys.


    # Client Key Rotation


    Tell ssh(1) to look for additional keys with the UpdateHostKeys *ssh_config* option.
    The default, no, tells ssh to ignore new host keys. Setting it to yes automatically
    updates *known_hosts* with any new keys for this host. The ask setting'
