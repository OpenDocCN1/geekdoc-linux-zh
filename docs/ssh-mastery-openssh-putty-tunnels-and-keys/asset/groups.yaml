    Ansible、Puppet 或其众多竞争对手之一这样的集中系统。Active Directory 对于向 Windows 系统分发主机密钥效果很好。如果你从未使用过自动化，我推荐
    Ansible。一旦你为现有系统准备了完整的 *known_hosts*，更新该文件并将其推送到所有系统只需一两分钟，就能为你的用户和支持团队节省数小时的工作。


    ## 分发 known_hosts


    所有 OpenSSH 客户端都会检查 */etc/ssh/ssh_known_hosts* 以获取主机密钥。将你的 *known_hosts* 复制到每个服务器和工作站的此位置。下次有人在这些机器上使用
    ssh(1) 时，正确的密钥已经在位。


