    # Chapter 0: Introduction


    Over the last 15 years, OpenSSH (http://www.OpenSSH.com) has become the standard
    tool for remote management of UNIX-like systems and many network devices. Most
    systems administrators use only the bare minimum OpenSSH functionality necessary
    to get a command line, however. OpenSSH has many powerful features that will make
    systems management easier if you take the time to understand them. You’ll find
    information and tutorials about OpenSSH all over the Internet. Some of them are
    poorly written, or only applicable to narrow scenarios. Many are well written,
    but are ten years old and cover problems solved by a software update nine years
    ago. If you have a few spare days, and know the questions to ask, you can sift
    through the dross and find effective, current tutorials.


    This task-oriented book will save you that effort and time, freeing you up to
    prepare for the next version of Castle Wolfenstein. I assume that you are using
    fairly recent versions of OpenSSH and PuTTY, and I disregard edge cases such as
    “my twenty-year-old router only supports SSH version 1.” If you found this book,
    chances are you’re capable of searching the Internet to answer very specific questions.
    I won’t discuss building OpenSSH from source, or how to install the OpenSSH server
    on fifty different platforms. If you’re a systems administrator, you know where
    to find that information. If you are a system user, your system administrator
    should install and configure the OpenSSH server for you, but mastering the client
    programs will help you work more quickly and effectively.


    # Who Should Read This Book?


    Everyone who manages a UNIX-like system must understand SSH. OpenSSH is the most
    commonly deployed SSH implementation. Unless you are specifically using a different
    SSH implementation, read this book.


    People who are not systems administrators, but who must connect to a server over
    SSH, will also find this book helpful. While you can learn the basics of SSH in
    five minutes, proper SSH use will make your job easier and faster. You can skip
    the sections on server configuration if you wish, although it’s always good to
    know what your system administrator can actually do as opposed to what they feel
    like doing.


