    ### OpenSSH Client

    ### OpenSSH 客户端


    The OpenSSH client, ssh, is developed synchronously with the OpenSSH server. As
    new features often appear in OpenSSH before other SSH implementations, you’ll
    get the bleeding edge of SSH features by using the newest OpenSSH client. The
    OpenSSH client is developed as part of OpenBSD, but a new portable release appears
    every six months.

    OpenSSH 客户端 ssh 与 OpenSSH 服务器同步开发。由于新功能通常在其他 SSH 实现之前出现在 OpenSSH 中，使用最新的 OpenSSH
    客户端可以获得 SSH 功能的最新进展。OpenSSH 客户端作为 OpenBSD 的一部分开发，但每六个月会出现一个新便携版本。


    A user’s personal SSH settings are recorded as files in $HOME/.ssh/. Like the
    home directory, this directory must be writable only by the user and root, although
    you can allow it to be world-readable. Various client and server functions stop
    working if others can write to this directory. While ssh creates $HOME/.ssh with
    correct permissions, if your SSH suite behaves oddly check the permissions.

    用户的个人 SSH 设置记录为 $HOME/.ssh/ 中的文件。与主目录一样，该目录必须只能由用户和 root 可写，尽管你可以允许它对所有人可读。如果其他人可以写入此目录，各种客户端和服务器功能将停止工作。虽然
    ssh 会以正确的权限创建 $HOME/.ssh，但如果你的 SSH 套件行为异常，请检查权限。


    To run ssh, enter the command followed by the host you want to connect to.

    要运行 ssh，输入命令后跟你想要连接的主机。


    ```

    $ ssh gluttony.mwl.io

    ```


    This uses your client’s default settings to connect to the host gluttony.mwl.io,
    including your current username.¹

    这使用你的客户端默认设置连接到主机 gluttony.mwl.io，包括你的当前用户名。¹


    If ssh doesn’t behave as you expect, try running it in verbose mode with -v. You’ll
    see the server and client negotiate protocol version and encryption algorithms,
    the server present its host key, the client verify that key, and the two negotiate
    authentication methods. While this might not solve your problem, it will tell
    you where the login fails and give you a hint about where to look. Reading the
    output carefully might tell you that, for example, the server only permits logins
    with public keys or you’re trying to use an unsupported encryption method.

    如果 ssh 的行为与你预期不符，请尝试使用 -v 以详细模式运行。你将看到服务器和客户端协商协议版本和加密算法，服务器提供其主机密钥，客户端验证该密钥，两者协商身份验证方法。虽然这可能无法解决你的问题，但它会告诉你登录失败的位置并给出提示。仔细阅读输出可能会告诉你，例如，服务器只允许使用公钥登录或你正在尝试使用不受支持的加密方法。


