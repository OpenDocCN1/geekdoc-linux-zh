    如果你希望每次连接到此主机时都使用此转发，请保存此会话。


    ## 远程端口转发


    在配置远程端口转发之前，请验证正常的 SSH 是否正常工作。确定要转发到和来自的客户端和服务器端口。


    其中本地端口转发通常用于用加密包装服务，远程端口转发用于访问防火墙后面的服务。对于此示例，我将 SSH 服务器本地主机地址上的端口 2222 转发到工作站上的端口
    22。当我连接到 SSH 服务器上的端口 2222 时，远程转发会将我重定向到工作站的 SSH 服务。


    为什么要这样做？请记住从我们的示例环境中，客户端位于防火墙后面。防火墙可能是我的家庭 NAT 设备，或我雇主的工业级企业防火墙集群。远程转发让我可以使用我的客户端为网络外部的
    SSH 服务器提供一种连接到防火墙内部主机的方式，尽管有任何相反的防火墙规则。这可能是我进入自己网络的宝贵紧急后门，也可能违反我雇主的安全策略。或者，更好的是：两者兼有！


