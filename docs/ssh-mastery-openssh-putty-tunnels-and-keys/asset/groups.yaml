    # Configuring sshd(8)


    This chapter discusses some generally useful sshd(8) options. Most sshd_config
    options appear in the chapter where they’re most useful—that is, options affecting
    X forwarding appear in Chapter 8, “X Forwarding,” while certificate options appear
    in Chapter 14, “Certificate Authorities.”


    The version of OpenSSH shipped with your operating system might not support all
    of the keywords described in this book. I’ve written this based on OpenSSH 7.6.
    Some operating systems either ship older versions, or deliberately remove functions
    for their own reasons. If a configuration option doesn’t work on your server,
    consult your operating system documentation or ask your vendor.²


    # Set Host Keys


    The HostKey keyword gives the full path to a file containing a private key. Each
    supported encryption algorithm uses a separate file.


    ```

    HostKey /usr/local/etc/ssh/ssh_host_rsa_key

    HostKey /usr/local/etc/ssh/ssh_host_ecdsa_key

    HostKey /usr/local/etc/ssh/ssh_host_ed25519_key

    ```


    The default files are named after the type of key they contain. The file ssh_host_rsa_key
    contains an RSA key, ssh_host_ed25519_key is an ED25519 key, and so on. This isn’t
    mandatory—OpenSSH will figure out what type of key is in a file and load it if
    appropriate—but it’s definitely the best practice. Putting your RSA key in a file
    named after ED25519 will confuse everyone.


    Different operating systems handle missing key files differently. BSD-style and
    Red Hat-based systems automatically create missing key files. Many Linux systems
    require the sysadmin to manually create missing key files, but integrate key creation
    into their usual system administration tools. For example, Debian-based systems
    create missing key files when you run dpkg-reconfigure openssh-server.


    Chapter 7, “SSH Keys,” covers creating host keys using OpenSSH’s native tools.


    # Network Options


    You can control how sshd(8) uses the network, from the version of IP all the way
    to the TCP port.


    ```

    Port 22

    AddressFamily any

    ListenAddress 0.0.0.0

    ListenAddress ::

    ```


    The Port keyword controls the TCP port sshd uses. Internet standards call for
    SSH to run on port 22. Some organizations use a different port for SSH in the
    hope of improving security. Running SSH on an unusual port won’t actually'
  - '[PAGE 20]


    help secure SSH, but it will reduce the number of login attempts from SSH-cracking
    worms, as discussed in “Protecting the SSH Server” later this chapter. It also
    lets you escape particularly ineffective firewalls. Override the Port keyword
    on the command line with -p.


    AddressFamily refers to the version of TCP/IP sshd uses. To use only IPv4, set
    this to inet. To only use IPv6, set this to inet6. The default, any, tells sshd
    to process requests no matter what protocol they arrive over. Some operating systems
    patch sshd(8) to support non-TCP/IP protocols such as the Stream Control Transmission
    Protocol (SCTP).


    Many hosts have multiple IP addresses. By default, sshd listens for incoming requests
    on all of them. If you want to limit the IP addresses that sshd attaches to, use
    the ListenAddress keyword. A ListenAddress of 0.0.0.0 means “all IPv4 addresses,”
    while :: means “all IPv6 addresses.” (Some operating systems use :: to mean “all
    IPv4 and IPv6 addresses,” because why would they let you turn on a service for
    IPv6 only?) Each ListenAddress takes a single IP address as an argument, but you
    can use as many ListenAddress keywords as you need. Explicitly list every IP address
    that you want the SSH server to accept connections on.


    If a host has many IP addresses and you want to block SSH access to just a few
    of them, you might find blocking traffic with a packet filter easier than using
    many ListenAddress statements.


    You can also use ListenAddress to add an additional port on a particular IP address,
    by specifying the port in a ListenAddress statement. Consider the following configuration.


    ```

    ListenAddress 0.0.0.0

    ListenAddress 192.0.2.8:2222

    ```


    Our first ListenAddress, 0.0.0.0, tells sshd to listen to all addresses on this
    machine. The default Port is 22, so we’ll get port 22 on all addresses. That’s
    fine. The second ListenAddress makes sshd also listen for connections on port
    2222 on the address 192.0.2.8. Each address can have its own ListenAddress statement.


    ```

    ListenAddress 192.0.2.8:2222

    ListenAddress 192.0.2.9:25

    ListenAddress 192.0.2.10:80

    ```


    Three different addresses, each with a different port. Mind you, having sshd listen
    to the SMTP and HTTP ports is generally unwise, but OpenSSH is not designed to
    prevent you from doing generally unwise things. If you’re stuck behind a naïve
    firewall that blocks everything but ports 80 and 443, running sshd on those ports
    would let you evade the firewall.³


    # Banners and Login Messages'
  - '[PAGE 21]


    Many sysadmins want to display a message to the user before they log in. This
    is called a banner. The SSH protocol doesn’t require clients to display banners.
    The server can offer a banner, but you can’t guarantee that the user will see
    it. Both ssh(1) and PuTTY display banners. Set the keyword Banner to the full
    path of the file.


    ```

    Banner /etc/ssh/banner

    ```


    Be aware that if the banner does work, it might interfere with automated processes
    run over SSH. In some locations, a banner can serve as a legal notice to intruders.
    (Mind you, I’m not aware of anyone who’s been successfully prosecuted through
    use of such banner warnings, but that is the law.) Choose the headache you prefer.


    If the user is authenticating with public keys and the client does display the
    banner, the login will proceed. No human being will see your legal department’s
    finely worded warning about logging into the host until the login is complete.


    You can reliably display the system message of the day, /etc/motd. This message
    doesn’t appear until after the client has authenticated, though, so it might not
    meet your needs. The keyword PrintMotd is set to yes by default, but you can turn
    it off.


    ```

    PrintMotd yes

    ```


    On systems that use Pluggable Authentication Modules (PAM), a PAM module might
    be responsible for printing /etc/motd. If you’re having trouble enabling or disabling
    the display of /etc/motd, check your PAM configuration.


    Once a user has logged on, sshd prints the time of the user’s last logon and where
    they logged in from. To turn this off, set PrintLastLog to no.


    ```

    PrintLastLog yes

    ```


    While it might seem unnecessary, I strongly recommend leaving PrintLastLog on.
    More than once, users have alerted me to intrusions when they saw that their previous
    login was from a foreign country or at a ridiculous hour.


    # Authentication Options


    In a default OpenSSH install, a user can try to log in 6 times in 2 minutes in
    a single SSH session. You should be using public key authentication (Chapter 7,
    “SSH Keys”) almost everywhere, but even users with passwords should be able to
    incorrectly type their password in twenty seconds. You can change both the timing
    and the number of attempts.


    The LoginGraceTime keyword controls how long sshd gives a user to authenticate.
    If a session connects to sshd for this long without successfully authenticating,
    the connection terminates. You can give a number of seconds (s), minutes (m),
    or hours (h).


    ```

    LoginGraceTime 2m

    ```


    You can also control how many times a user may attempt to authenticate in a'
  - '[PAGE 22]


    single connection with MaxAuthTries. The default is 6.


    ```

    MaxAuthTries 6

    ```


    After half of a user’s permitted attempts in a single session have failed, sshd
    logs further failures. Authentication attempts include both public key authentication
    and passwords. After MaxAuthTries failures, the user must initiate a new SSH session
    and try again.


    My usual failure procedure is to fail to log in six times, then remember that
    I have a different username on this machine. When I take my own advice on changing
    usernames from Chapter 5, “SSH Clients,” and install my public key everywhere
    as in Chapter 7, “SSH Keys,” this problem goes away.


    # Verify Login Attempts against DNS


    A log message like “Login failed from boss’s computer” makes you sigh. A log message
    like “Login succeeded from Hacker Haven Nation” should trigger alarm. The owner
    of an IP address controls the reverse DNS for that address. An intruder who controls
    the reverse DNS for his IP address can change the apparent hostname to something
    within your company. For protection against this sort of attack, sshd can verify
    connection attempts against forward DNS entries.


    ```

    UseDNS no

    ```


    When set to yes, every time a client connects, sshd looks up the host name for
    the source IP, and then looks up the IP address for the host name. If the DNS
    names don’t match, sshd rejects the connection.


    Suppose an intruder controls the reverse DNS for his IP address 192.0.2.99. He
    gives it a hostname within your organization, such as dhcp12.mwl.io, and connects
    to your SSH server. Your SSH server asks its DNS server for the IP address for
    dhcp12.mwl.io. If that DNS entry doesn’t exist, or it points to an IP other than
    192.0.2.99, sshd rejects the connection.


    If DNS fails, sshd waits for a full DNS timeout before allowing the connection.


    UseDNS requires that your DNS be tidy, coherent, and correct. While I’m in favor
    of auditing an organization’s DNS entries, performing such audits via UseDNS lacks
    elegance. DNS checks don’t help if an intruder can poison the server’s DNS cache.
    If you’re a home user, your ISP probably controls the reverse DNS on your connection.
    Also, DNS checks can increase system load. If you serve hundreds or thousands
    of simultaneous SSH users, that load can be substantial. When DNS fails, failed
    DNS checks will slow down all SSH logins. Finally, many IPv6 sites haven’t configured
    reverse DNS and won’t for the foreseeable future.


    I discourage enabling UseDNS.'
