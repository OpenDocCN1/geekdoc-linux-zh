    If your SSH server is compromised, the intruder can piggyback onto your authentication
    socket to log into remote servers with your credentials.


    Promiscuous agent forwarding has been responsible for intrusions in many organizations,
    even organizations you’d think would know better. Only enable agent forwarding
    to machines that you control.


