    ```

    sloth$ ssh -p 2222 localhost

    ```


    啪！一个新的 SSH 连接进入我的工作站，隧道在我的现有 SSH 会话内部。此新会话将在客户端日志中显示为一个新的连接，源自本地主机。在设置远程端口转发时，你真的需要信任拥有你系统帐户的人。任何可以访问你系统本地主机地址的人都可以使用端口转发。我永远不会在自己完全不信任的
    SSH 服务器上使用远程端口转发。


