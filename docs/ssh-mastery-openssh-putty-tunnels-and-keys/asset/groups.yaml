    sshd。然后你从工作站通过 SSH 连接到公共互联网上的服务器。使用远程端口转发，你可以将公共互联网服务器上的端口 2222 转发到工作站上的 SSH 端口。任何连接到你公共服务器端口
    2222 的人都会被透明地连接到你工作站的 SSH 服务器。他们可以在没有任何 VPN 客户端的情况下进入防火墙，并且完全无视防火墙策略。你可能会使用远程端口转发使私有
    Web 服务器公开可用。图 9-2 说明了远程端口转发。


    ![](img/66dbcb7210a5fe0a8b3a1ecd91eb0e6d_81_1.png)


    图 9-2：远程端口转发数据流


    *动态端口转发* 是一个更广泛的系统，其中许多不同的客户端程序可以连接到许多不同的服务。它在 SSH 客户端上创建一个 SOCKS 代理，并将对该代理的任何请求通过服务器转发出去。SOCKS
    代理是一个通用网关，可以承载任何 TCP/IP 流量。（顺便说一下，SOCKS 实际上并不代表任何东西。）这使得连接到代理的任何人都可以完全访问服务器的网络。图
    9-3 说明了动态端口转发。


    ![](img/66dbcb7210a5fe0a8b3a1ecd91eb0e6d_82_0.png)


    图 9-3：动态端口转发数据流


    当底层 SSH 会话终止时，所有端口都停止转发。


    第 10 章提供了保持 SSH 会话活跃的建议。


    凭借这些可能性，很容易看出为什么系统管理员喜欢 SSH，以及为什么许多企业安全部门禁止它。


    ### 特权端口与转发


    在类 Unix 系统上，1024 以下的 TCP 端口保留用于系统使用。只有 root 可以绑定这些端口。作为非特权用户，你可以将 SSH 端口转发器的本地端附加到
    1024 以上的任何端口。转发保留端口需要以 root 身份使用 SSH。以 root 身份执行常规任务是不良做法，因此不要在没有非常充分理由的情况下这样做。


