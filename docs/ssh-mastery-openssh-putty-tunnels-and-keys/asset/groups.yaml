    只要 SSH 服务器的主机密钥被添加、移动或更改，用户就会看到有关主机密钥的警告。分发 *known_hosts* 的全部目的就是防止用户看到不必要的警告。领先于你的用户。¹
    只要你部署或移除服务器，或必须为服务器提供新密钥，就更新你的 *known_hosts*。如果你延迟更新 *known_hosts*，用户会学会忽略警告。


