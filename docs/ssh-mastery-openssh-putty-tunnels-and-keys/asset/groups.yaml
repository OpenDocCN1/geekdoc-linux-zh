    # Chapter 6: Copying Files over SSH


    File Transfer Protocol (FTP) was the standard method for copying files between
    machine for decades, predating even TCP/IP. FTP transmits everything unencrypted,
    making it roughly as secure as telnet. The file can be viewed or altered during
    transmission. Other old protocols, (RCP), are even worse. How about using SSH
    to securely transfer files between machines?


    There are many ways to use SSH to move files. Applications such as rsync can use
    SSH as a transport mechanism. Some window managers include SSH file transfer tools.
    We’ll cover two specific protocols, SCP and SFTP, for both Unix-like and Microsoft
    systems. Most other tools that transfer files over SSH are actually front ends
    to one of these protocols.


    Secure Copy Protocol, or SCP, was designed as a drop-in replacement for RCP. SSH
    File Transfer Protocol, or SFTP, was designed to replace FTP. It’s an interactive
    protocol, allowing you to browse remote filesystems. OpenSSH includes the client
    programs sftp(1) and scp(1), while Windows clients can use WinSCP for both protocols.


    # File Copy with OpenSSH


    OpenSSH includes two file transfer programs, scp and sftp. We’ll start with the
    simpler but less flexible program.


    # scp(1)


    You can use scp(1) to copy individual files. The syntax follows the usual Unix
    semantics.


    ```

    $ scp what-you-have where-you-want-it

    ```


    Separate hosts and filenames with a colon, like so.


    ```

    $ scp source-host:filename destination-host:filename

    ```


    Once you authenticate, scp transfers the file over the encrypted channel.


    If you don’t enter an element in the command, it’s assumed to be unchanged.


    For example, to copy the local file data.txt to the server sloth, run:


    ```

    $ scp data.txt sloth:

