    to your defaults.


    ## Starting SSH Sessions with PuTTY


    In the Sessions PuTTY screen, go to Host Name (or IP Address). Enter the hostname
    or IP address of your SSH server. You can also change the port number here if
    needed. Click Open at the bottom of the window.


