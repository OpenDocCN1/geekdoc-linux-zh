    you connect,” and LocalCommand to define the command.


    When you SSH from the client to the server, the tunnel should come up automatically.


    ## CentOS and Debian


    Configure SSH VPNs on these two popular Linux distributions in a very similar
    way to FreeBSD. Both distributions have obsoleted standard Unix tools like ifconfig(8)
    and route(8), however, so we must use the Linux-specific ip(8) instead.


    Create your tunnel key, enable SSH tunneling, and permit root logins using keys,
    as discussed in “Common Concepts.” Then the client needs a /root/.ssh/config precisely
    like that used for FreeBSD.


    ```

    Host gluttony

    Tunnel point-to-point

    TunnelDevice 0:0

    IdentityFile /root/.ssh/tunnelkey

    IdentitiesOnly yes

    PermitLocalCommand yes

    LocalCommand /usr/local/scripts/tunnelclient.sh

    ```


    Enable IP forwarding on Linux setting the sysctl net.ipv4.ip_forward to 1 in /etc/sysctl.conf.
    Debian already has this entry, commented-out.


    Lock down the server’s /root/.ssh/authorized_keys so that this key can only open
    the tunnel device.


    ```

    restrict,tunnel="0",command="/usr/local/scripts/tunnelserver.sh" ssh-rsa AAAAB3Nz...

    ```


    Now all you need are the Linux scripts. Here’s a /usr/local/scripts/tunnelserver.sh:


    ```

    #!/bin/sh

    ip addr add 192.168.0.1/30 dev tun0

    ip link set dev tun0 up

    ip route add 172.16.0.0/24 via 192.168.0.2 dev tun0

    ```


    And here’s a client script.


    ```

    #!/bin/sh

    ip addr add 192.168.0.2/30 dev tun0

    ip link set dev tun0 up

    ip route add 172.17.0.0/24 via 192.168.0.2 dev tun0

    ```


    Now run ssh -f gluttony from your client, and your tunnel will come up.


    With these three examples, you should be able to get an SSH VPN running on any
    Unix-like operating system. Remember that an SSH VPN is not a wonderful solution,
    though. Before you have trouble or experience congestion, investigate real VPN
    software like OpenVPN.


    ## Chapter 14: Certificate Authorities


    The hardest part of using SSH correctly isn’t the software, or obscure or hidden
    checkboxes, or even more obscure command-line arguments. It’s verifying keys.
    Users are expected to verify host keys, a tedious process that most of them won’t
    even bother with. Users generate authentication keys, but then they need to be
    copied around the network. If you’re managing your systems with automation, you
    can automate part of the verification process and vastly reduce risk by implementing
    an OpenSSH Certificate Authority.


    An SSH CA is not the same as the X.509 Certificate Authority you’re probably familiar
    with from the TLS¹ deployed on websites. If you had to purchase an X.509 certificate
    for each and every host to use SSH, you wouldn’t bother. But take a moment and
    consider what a certificate authority does for you.


    A certificate authority is a method of delegating trust. Every web browser has
    a list of trusted certificate authorities built into it. When your browser calls
    up a website that uses a certificate, the browser checks to see if that certificate
    is signed by a trusted certificate authority. If it is, the browser trusts the
    certificate on that website. If the certificate is signed by anything other than
    a trusted certificate authority, the user sees a warning.


    SSH public keys resemble self-signed certificates. The server is declaring, “this
    is who I am, and you can either accept this or go away.” You create an SSH CA
    by giving your clients and servers a certificate that they trust. Install this
    certificate on all of your OpenSSH software, and it will trust any public key
    signed by that CA key.


    X.509 certificates are complicated in part because they’re part of a global network
    of certification. Organizations use TLS certificates to secure websites, email,
    and pretty much any other arbitrary TCP connection. Certificates contain fields
    for a whole bunch of stuff that most of us will never need.


    SSH certificates only need the ability to digitally sign data and carry a few
    chunks of metadata. They’re not a global entity. An OpenSSH CA is entirely internal.
    A standard SSH key pair has all the functionality needed to sign keys.


    Once you deploy an OpenSSH CA, clients configured to trust the CA key will automatically
    trust host keys signed with that key. Servers configured to trust that CA key
    will automatically trust user authentication keys signed with the CA key. Your
    users will only see warnings when they connect to hosts outside of your organization,
    or if something is seriously wrong.


    Certificate authorities are an OpenSSH extension. Other clients have not yet adopted
    them. Even if all of your desktop clients run something other than OpenSSH, SSH
    certificate authorities are useful for verifying host keys when connecting between
    servers.


    Don’t even consider deploying an OpenSSH CA unless you can automatically distribute
    files to all your servers and remotely restart sshd on them. If you don’t have
    automation in place, take a look at Ansible or one of its competitors.


    An SSH CA has a whole bunch of functions that are only useful in edge cases. An
    organization like Google or Facebook needs a whole bunch of features that most
    of us don’t. Read the ssh-keygen(1) man page for the full range of CA options.
    Here we’ll set up a comparatively simple CA for a middle-sized network, starting
    with the simpler host certificates, then proceeding to the more complex user certificates.


    ### Certificate Expiration


    A critical part of signed certificates is that they expire. Yes, you could set
    all of your certificates to be good for a quarter-century, but those keys will
    be insecure long before that. Plan from the beginning to use your automation system
    to regularly update your certificates.


    Attacking public keys computationally, in the absence of a flawed implementation,
    can take billions of years. Software has bugs, though, and it’s possible that
    a bug might let an intruder crack a key in much less time. Also, those aeons needed
    to computationally break a key are averages. The intruder might get lucky. Eternally
    valid certificates increase the intruder’s chances of success.


    How long should a certificate be good for? Rolling over certs every year or so
    is most common. If you have one of those orchestrated networks where servers appear
    and disappear by the magic of automatic deployment, you might want to regenerate
    your host key certificates every week or month.


    In short, never plan to use certificates longer than a year, except in those rare
    cases where a host cannot be changed. No, I don’t mean “the boss would really
    like this host to never change,” I mean “the federal government has declared this
    host a life-sustaining service and changing the certificate is a felony that carries
    a minimum jail sentence.”


    Don’t set your certificates to expire in exactly one year, though. Remember, life
    happens. Maybe you put on your calendar to renew all of your certificates in 52
    weeks, but you develop appendicitis the day before and you’re off work for three
    weeks. I allow at least a month of leeway for such emergencies, so these examples
    assume we expire all certificates in fifty-six weeks and five days.


    Better still? Use your automation system to renew and replace all certificates

