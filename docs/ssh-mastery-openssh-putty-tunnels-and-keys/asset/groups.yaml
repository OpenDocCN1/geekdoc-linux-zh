    `hk2reg.py`. You won’t find `hk2reg.py` in the normal PuTTY installation, but
    it’s included with the source code. You can download the PuTTY source code from
    the PuTTY website, or grab it from the PuTTY GitHub at https://github.com/github/putty,
    in the “contrib” directory.


    Run `hk2reg.py` and give it a single argument, your pristine *known_hosts*.


    ```

