    attached to the user’s shell, such as .cshrc or .profile, are sourced. This might
    give you trouble, depending on the application you’re running.


    Backgrounding forwarded X-over-SSH sessions is very useful, but forwarding TCP
    ports over SSH is even more useful. We’ll look at that next.'
