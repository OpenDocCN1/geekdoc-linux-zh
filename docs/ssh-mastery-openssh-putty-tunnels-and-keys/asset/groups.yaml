    *known_hosts* 时，每个用户可能已有现有的个人 *known_hosts*。你不希望用户个人缓存中的任何过时或无效条目干扰后续的密钥更改或撤销。不要直接删除每个人的
    *known_hosts*；它们可能包含你不控制的服务器的已验证主机密钥。相反，在首次部署时，将每个用户的个人 *known_hosts* 移动到像 *known_hosts.personal*
    这样的位置。


    务必告诉你的用户发生了什么。最好提前通知。

