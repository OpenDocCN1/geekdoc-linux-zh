    # Multiplexing Connections


    SSH sessions can take a long time to open, particularly if the SSH server can’t
    find a reverse DNS entry for the client’s IP address. Or you might have a naïve
    firewall that limits the number of simultaneous connections between network segments.
    Perhaps one of the machines is so old that the initial key exchange takes several
    seconds. SSH supports connection multiplexing for these situations, permitting
    you to run several SSH sessions over one TCP connection.'
