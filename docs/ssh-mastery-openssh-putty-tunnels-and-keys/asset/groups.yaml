    ## 致谢


    首先感谢编写 OpenSSH 和 PuTTY 的优秀人士。这些人通过创建和支持他们的软件，实际上让世界变得更好。我必须特别感谢 OpenSSH 的带头人 Damien
    Miller，他在有愚蠢问题时抽时间指引我正确的方向。


    我还要感谢我的技术审阅者：Bill Allaire、Jim Allen、Tim Enders、Marie Helene Kvello-Aune、Kurt Mosiejczuk、Mike
    O’Connor、Bernard Spil、Loganaden Velvindron（来自 hackers.mu）和 Markus Waldeck。本书中出现的任何错误都是在这些优秀人士努力下仍渗入的。


    对通过 Patreon（https://www.patreon.com/mwlucas）持续支持我的人，我表示感激。其中一大群人作为感谢收到了本书的副本。


    如果没有所有相关软件的源代码，撰写本书是不可能的。


    献给 Liz。


    ## 第 0 章：导论


    在过去的 15 年里，OpenSSH（http://www.OpenSSH.com）已成为远程管理类 UNIX 系统和许多网络设备的标准工具。然而，大多数系统管理员仅使用获取命令行所必需的最基本的
    OpenSSH 功能。OpenSSH 拥有许多强大的功能，如果你花时间去理解它们，将使系统管理变得更容易。你可以在互联网上到处找到关于 OpenSSH 的信息和教程。其中一些写得很差，或仅适用于狭窄的场景。许多写得很好，但已有十年历史，涵盖的问题早在九年前就已被软件更新解决了。如果你有几天空闲时间，并且知道要问什么问题，你可以从繁杂的信息中筛选出有效且当前的教程。


    这本以任务为导向的书将为你节省这份努力和时间，让你有空准备下一版《Castle Wolfenstein》。我假设你使用的是相当新的 OpenSSH 和 PuTTY
    版本，并且我忽略了诸如“我的二十年老路由器仅支持 SSH 版本 1”之类的边缘情况。如果你找到了这本书，很可能你有能力在互联网上搜索来回答非常具体的问题。我不会讨论从源代码构建
    OpenSSH，或如何在五十个不同平台上安装 OpenSSH 服务器。如果你是系统管理员，你知道在哪里找到这些信息。如果你是系统用户，你的系统管理员应该为你安装和配置
    OpenSSH 服务器，但掌握客户端程序将帮助你更快、更有效地工作。


    ### 本书适合谁阅读？


    所有管理类 UNIX 系统的人都必须理解 SSH。OpenSSH 是最常用的 SSH 实现。除非你专门使用不同的 SSH 实现，否则请阅读本书。


    并非系统管理员但必须通过 SSH 连接到服务器的人也会发现本书有帮助。虽然你可以在五分钟内学习 SSH 的基础知识，但正确使用 SSH 会让你的工作更轻松、更快。如果你愿意，可以跳过服务器配置部分，虽然了解你的系统管理员实际上能做什么而不是他们想做什么总是好的。


    ### SSH 组件


    安全外壳（SSH）是一种在两个联网主机之间创建加密通信通道的协议。SSH 保护在两台机器之间传输的数据，使其他人无法窃听。Tatu Ylönen 于 1995
    年创建了初始协议和实现，设计目的是取代 telnet、RSH 和 rlogin 等不安全协议。随着 1999 年 OpenSSH 的发布，SSH 迅速成为管理主机的标准方法。今天，许多不同的软件包都依赖
    SSH 协议，通过私有、公共和敌对网络以加密且经过良好身份验证的方式传输数据。


    ### OpenSSH


    OpenSSH 是 SSH 协议最广泛部署的实现。它起源于原始 SSH 软件的自由许可版本，但已被大量重写、扩展和更新。OpenSSH 是 OpenBSD
    项目的一部分开发的，该社区以编写安全软件而闻名。OpenSSH 是 Linux 和 BSD 世界的标准 SSH 实现，也被 HP、Cisco、Oracle、Novell、Juniper、IBM
    等大型公司的产品使用。


    OpenSSH 有两个版本，OpenBSD 和 Portable OpenSSH。


    OpenSSH 的主要开发作为 OpenBSD 的一部分进行。他们对 OpenSSH 采用与 OpenBSD 其余部分相同的简单、安全代码标准。OpenSSH
    的这个版本小巧安全，但仅支持 OpenBSD。OpenSSH 可移植性团队将 OpenBSD 版本取出来并添加必要的胶水，使 OpenSSH 能在其他操作系统上工作，从而创建
    Portable OpenSSH。不仅不同的操作系统使用不同的编译器、库等，它们还有不同的身份验证系统。可移植 OpenSSH 团队需要在每个平台上考虑所有这些差异。他们尽力隐藏这种复杂性，这样你就不必担心它。本书适用于两个版本。


    任何操作系统可能都自带 OpenSSH，或操作系统厂商提供软件包。甚至微软也在其 Linux 层中提供 OpenSSH 软件包，并且原生端口的测试版最近作为可选的
    Windows 组件泄露出来。如果你的操作系统不提供 OpenSSH 软件包，请从 http://www.OpenSSH.com 下载 Portable OpenSSH
    源代码并按照说明构建软件。


    OpenSSH 在 BSD 风格许可证下可用。你可以出于任何目的使用它，没有任何附加条件。如果你因 OpenSSH 损坏而起诉软件作者，或声称你编写了 OpenSSH，是不允许的，但你可以以任何方式使用它，包括将其添加到自己的产品中。你可以收取安装或支持
    OpenSSH 的费用，但软件本身是免费的。


    ### SSH 服务器


    SSH 服务器在网络上监听传入的 SSH 请求，验证这些请求，并提供系统命令行提示符（或你配置的其他服务）。最受欢迎的 SSH 服务器是 OpenSSH 的
    sshd。


    ### SSH 客户端


    使用 SSH 客户端连接到远程服务器或网络设备。Windows 系统最受欢迎的 SSH 客户端是 PuTTY。类 Unix 系统的标准 SSH 客户端是来自
    OpenSSH 的 ssh(1)。两者都可自由获得，可用于任何目的，商业或非商业，费用为零。


    微软最近还基于 OpenSSH 分叉以在 Windows 中包含 SSH 客户端。它被认为处于实验阶段，开发仍在继续。随意尝试；它应该与 OpenSSH 非常相似。它也是
    Windows Linux 子系统的一部分。如果你使用的是 Windows 原生 SSH，那么你真的想使用 PowerShell 而不是传统的终端。


    一旦你理解 PuTTY 和 OpenSSH，你就具备了使用任何安全 SSH 客户端的基础知识。


    ### SSH 协议版本


    SSH 协议有两个版本，SSH-1（版本 1）和 SSH-2（版本 2）。始终使用 SSH-2。所有现代 SSH 软件默认使用版本 2。你会发现一些旧的嵌入式设备仍依赖
    SSH 版本 1，但 SSH-1 的安全性几乎与未加密的 telnet 无异。


    一个人为自己的需求设计了 SSH-1。它出色地满足了这些需求，在 1990 年代比 telnet 好得多。随着 SSH 越来越受欢迎，更多人检查了该协议并暴露了原始设计中的弱点。随着今天的计算能力，SSH-1
    很容易受到攻击。虽然 SSH-1 在传输中加密你的数据并防止偶然窃听，但知道几个技巧的攻击者可以捕获你的数据、在传输中解密你的数据、让你以为你登录到正确的机器而实际上你连接到的是另一台主机、将任意文本插入数据流，或这些操作的任意组合。攻击
    SSH-1 数据流并不完全是点按过程，但入侵者在现实世界中确实破坏了 SSH-1。


    安全的外表比没有安全更糟。永远不要使用 SSH 版本 1。


    似乎允许 SSH-1 用于不支持 SSH-2 的服务器或客户端是无害的。然而，客户端和服务器会透明地协商连接将使用的 SSH 版本。如果客户端或服务器容忍
    SSH-1，入侵者可以捕获你的登录凭证和所有传输的数据。相对容易地将任意文本（例如 rm -rf /*）插入 SSH-1 会话中。这是在 1998 年发现的，而今天的庞大计算能力使这种攻击变得更容易。SSH-1
    会话可以被程序实时解码

