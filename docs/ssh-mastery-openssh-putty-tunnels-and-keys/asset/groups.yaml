    # Afterword


    Seven years ago, I had a temper tantrum about sysadmins managing critical, public-facing
    systems with password-based SSH.


    This isn’t anything new. Millions of sysadmins more senior than I have given that
    rant. I decided to write the first edition of *SSH Mastery* with the explicit
    purpose of killing passwords. I’m not sure if it helped, but a whole bunch of
    senior sysadmins have come up to me and thanked me for writing the book, specifically
    because slapping people with it was considered “professional behavior.” I’m hopeful
    that this second edition, by covering features like certificates, will help those
    same sysadmins further secure their servers.


    Unix users should already know that OpenSSH is one of the most important pieces
    of security software in the world. If you don’t: OpenSSH is one of the most important
    pieces of security software in the world. Almost every technology vendor includes
    OpenSSH in their product. These multi-billion-dollar firms don’t pay for OpenSSH.
    Some OpenSSH developers hold a specific day job because their employer gives them
    time to work on OpenSSH, and companies like Google, Microsoft, and Facebook have
    donated funds to support the project. For the most part, OpenSSH is created by
    a bunch of people who love good software.


    Running a major software project isn’t cheap. OpenSSH is developed as part of
    the OpenBSD Project. They need servers, bandwidth, and electricity like any other
    IT organization, but must constantly scrape up funding. If you find OpenSSH useful,
    consider sending the OpenBSD Foundation (http://www.openbsdfoundation.org/) a
    few dollars so they can keep going.


    Windows folks, PuTTY has revolutionized using SSH from Microsoft systems. And
    the PuTTY developers gratefully accept donations. They don’t have a server infrastructure
    to feed, but they appreciate donations just the same. With refreshing honesty,
    they declare that they’ll spend small donations on motivational beer and curry,
    while larger donations can help buy any necessary hardware or tools. Volunteer
    programmers might have more powerful motivators than Unexpected Appreciation Beer,
    but I’ve yet to see what that would be. See the PuTTY FAQ for their PayPal address.


    If you work for one of those big firms that make cash out of shipping OpenSSH
    or PuTTY with their product, do consider blackmailing extorting persuading your
    employer to throw a few bucks to the folks who write the software. Or at least
    buy some developers a few pints on your expense account. We’ll all benefit.'
