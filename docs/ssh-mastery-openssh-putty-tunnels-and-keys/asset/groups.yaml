    SSH，在 */etc/ssh/ssh_config* 中设置 Port 关键字实际上可能会赢得用户的良好 karma。个人配置文件会覆盖系统范围的设置，因此如果用户真的想自找麻烦，他们仍然可以射伤自己的脚。


