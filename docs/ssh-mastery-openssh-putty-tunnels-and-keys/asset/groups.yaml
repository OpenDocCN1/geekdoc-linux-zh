    PuTTY 仅为端口转发提供了一个特殊控制面板。在 PuTTY 配置屏幕左侧，选择 *Connection* -> *SSH* -> *Tunnels*，如图
    9-4 所示。


    ![](img/66dbcb7210a5fe0a8b3a1ecd91eb0e6d_84_0.png)


    图 9-4：PuTTY 端口转发


    使用本地端口转发时，PuTTY 默认会连接到客户端的本地主机地址。然而，我必须指定要在 SSH 服务器上使用的地址。要将 SSH 服务器上的端口 80 转发到我工作站上的端口
    80，我将使用服务器的本地主机地址。在 *Source port* 中输入 80。在 *Destination* 中输入服务器上的 IP 地址、冒号和要转发的端口。这里我将使用
