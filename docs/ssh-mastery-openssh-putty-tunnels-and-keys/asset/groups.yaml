    # Keys and Multiple Machines


    Many sysadmins have multiple computers. I regularly use two desktops and a laptop.
    It is possible to move key pairs between machines by copying the key files. You
    can even import OpenSSH keys into PuTTY. How do you realistically manage a single
    key between multiple machines?


    You don’t.


    Rather than reusing a single private key on all of your desktops and laptops,
    create a separate private key for each. Create an authorized_keys file that contains
    the public keys for all of your authentication keys. When a machine is decommissioned,
    stolen, or self-immolates, remove that machine’s key from use. Delete the corresponding
    public key from the authorized_keys file on all of your servers. Generate a new
    key on your replacement machine.


    If one of your desktop machines is compromised, you must remove that machine’s
    authentication key from use. If all your clients share a single private key, you
    must regenerate a new key pair and distribute it to all of your machines. The
    intruder who has your private key might well lock you out of your own systems
    before you can accomplish this. If each machine has a unique key pair—even if
    all the keys share the same passphrase—then compromise or loss of one key does
    not compromise the keys on all your other machines.


    Also, preferred key algorithms change over time. When I wrote the first edition
    of this book, user authentication keys defaulted to 1024 bits. The default is
    now 2048. If I was still using keys created years ago, they would be too weak
    for current use. It’s entirely possible that the default user authentication key
    algorithm of RSA will be replaced by an entirely different algorithm in the future.
    By creating a new key whenever you get a new machine, and invalidating keys associated
    with old hardware, you ensure that your keys are relatively recent and secure.


