    ### Automation Authentication Keys

    自动化身份验证密钥


    自动化进程无法输入密码短语。任何需要 SSH 访问另一台主机的计划或其它自动化任务都需要一个没有密码短语的密钥。以生成主机密钥的方式生成此密钥。


    ```

    $ ssh-keygen -f filename -N ''''

    ```


    这会创建两个文件，一个使用你指定的文件名，另一个在该名称后追加 *.pub*。这里我创建一个名为 *task-key* 的密钥。


    ```

    $ ssh-keygen -f task-key -N ''''

    ```


    我最终得到文件 *task-key* 和 *task-key.pub*。*.pub* 文件是公钥。


    要么为此自动化任务在 SSH 服务器上创建一个账户，或选择一个现有账户。主机的 SSH 服务器必须允许登录到该账户。将 *.pub* 文件添加到该账户的 *authorized_keys*
    中。


    客户端机器现在应该能够使用该密钥登录到 SSH 服务器。记住使用 *-i* 参数到 ssh(1) 来指定备用密钥文件。这里我使用此密钥登录到机器 *sloth*。


    ```

    $ ssh -i task-key sloth

    ```


    如果成功登录到服务器，则密钥已正确安装。现在让我们对其进行锁定。


    ### Limiting Automation Keys

    限制自动化密钥


    最佳实践禁止用户执行其任务所不需要的所有访问权限。你的自动化进程需要端口或 X 转发吗？将其关闭。它需要特殊的环境吗？可能不需要，因为你可以在用户账户中更轻松地建立该环境。你的自动化任务运行在一台机器上，因此你可以限制密钥只能从该一台机器使用。你可能会得到类似这样的
    *authorized_keys* 条目。


    ```

    restrict,command="dump /home > /backups/`date +%s`.dump",from="192.0.2.8" ssh-rsa
    AAAAB3NzaC1yc2EAAAABJQAAA...

    ```


    像这样配置密钥可以减少灾难的范围。备份脚本不会意外覆盖你的根分区。入侵者只能运行你的备份脚本。这并不理想，但总比入侵者窃取你的数据并删除日志文件要好。


    ### Developing Automation Scripts

    开发自动化脚本


    限制密钥的一个挑战是理解程序实际需要的命令，与你认为它需要的命令之间的区别。`sshd` 的调试模式可以帮助你弄清楚这一点。让你的客户端在调试模式下对其命令运行
    `sshd`，并研究输出。你会看到客户端运行的所有命令。这也将让你比原本可能做到的更进一步地锁定密钥——如果你知道 rsync 在你的服务器上使用的确切标志，你可以将其作为限制施加。


    我写过从命令行似乎能正常工作，但在计划时失败的脚本，每次都发现我的脚本是从我的 SSH 代理获取身份验证信息，而不是使用我为任务创建的密钥。IdentitiesOnly
    关键字告诉 ssh(1) 仅使用命令行上指定的身份，并且不使用你的代理。在你的脚本的 SSH 命令中设置 -o `IdentitiesOnly=yes`。


    自动化脚本绝不应被提示输入用户输入。你不希望脚本挂起并在密码提示处等待。BatchMode 关键字禁用密码和密码短语提示。通过将 BatchMode 设置为
    `yes`，脚本的 SSH 部分会立即崩溃并退出，而不是无意义地永远挂着。


    ### Server-Side Restrictions

    服务器端限制


    也许你不想使用 `authorized_keys` 来限制访问，或许你想要额外的保护。你可以使用 ForceCommand `sshd_config` 关键字来限制账户可以运行的内容。


    ForceCommand 接受一个参数，即要运行的命令。它在用户的常规权限下运行，并忽略客户端请求的任何命令。与在 `authorized_keys` 中定义命令类似，ForceCommand
    会将请求的命令保留在 `$SSH_ORIGINAL_COMMAND` 环境变量中。


    ForceCommand 最好在 Match 语句内部使用。


    ### Automation and Root Logins

    自动化与 root 登录


    “My command needs to run as root!” 可以使用 PermitRootLogin 关键字以 root 登录。不要这样做。为自动化以
    root 登录会破坏许多基本的安全原则。信任你的自动化脚本使用远程 root 权限是一种很好的方式，让你在一个未安排的周末从备份中恢复服务器。（你确实有超出
    rsync 的备份，对吧？记住 rsync 是一种战术，而不是战略。）


    是的，少数环境可以安全地支持 root 登录。有些人以支持审计的方式使用 root 登录。然而，如果你正在阅读这本书来学习 SSH，你的环境远未准备好做到这一点。


    如果你的自动化进程需要特权访问，请使用 sudo。Sudo (https://www.sudo.ws) 允许无特权用户以提升的权限运行特定命令，并且适用于每个类
    Unix 系统。我不会详细介绍使用 sudo 的方法；如果你需要教程，请查看任意数量的网站或我的书 *Sudo Mastery* (Tilted Windmill
    Press, 2013)。Sudo 比大多数人所认为的更灵活，也更危险。


    我们将在下一章使用受限密钥通过 SSH 构建 VPN。


    ## Chapter 13: Virtual Private Networks

    第13章：虚拟专用网络


    你可以将 SSH 包装在任意 TCP 连接周围，为任何协议添加加密层。但 OpenSSH 还支持构建可以传递所有流量和所有协议的通用隧道，而不仅仅是 TCP。你可以使用
    OpenSSH 将远程办公室连接起来，创建一个虚拟专用网络（VPN），允许一个办公室的用户几乎像在隔壁房间而不是隔壁国家一样访问另一个办公室。


    VPN 是 SSH 协议的 OpenSSH 扩展。PuTTY 不包含 VPN 功能，PuTTY 开发者反复表示他们不打算将其添加到其客户端（参见 PuTTY
    网站上的 tun-openssh 愿望清单项目）。我们只会在类 Unix 系统上检查 OpenSSH VPN。


    SSH 并非设计为通用 VPN 协议，在 TCP 内部隧道传输协议是糟糕的做法。当 TCP 连接丢失数据包时，它必须重新传输这些数据包，直到另一端确认收到。通过将
    TCP 连接包装在另一个 TCP 连接内部，你会放大数据包丢失的影响。基于 TCP 的 VPN 在拥塞面前会崩溃。我强烈建议使用 OpenVPN 而不是 OpenSSH
    作为你的 VPN。OpenSSH VPN 确实具有优势，即它只需要在客户端和服务器之间打开一个 TCP 端口。如果这是你拥有的全部连接性，OpenSSH VPN
    可能是你最不糟糕的选择。


    VPN 可能是你可以用 OpenSSH 做的最复杂的事情。本章假设你熟悉前面的章节，包括公钥身份验证、保持 SSH 会话活跃以及限制 SSH 客户端可用的命令。


    ### Example Network

    示例网络


    我们的 SSH 客户端 avarice.mw1.io 有两个网络接口。一个在公共互联网上。虽然我们可以通过 IP 地址引用该接口，但我们将使用主机名代替。第二个接口在私有网络
    A 上，地址为 172.16.0.1/24。


    SSH 服务器 gluttony.mw1.io 也有一个接口在公共互联网上。我们将通过主机名而不是 IP 引用此接口。它的第二个网卡在私有网络 B 上，IP地址为
    172.17.0.1/24。

    '
