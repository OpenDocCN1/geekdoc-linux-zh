    如果你有任何延迟，请调查转发 X 的替代方案。也许动态端口转发（第 9 章）就能解决你的问题。也许你的程序具有远程使用的功能，例如 Wireshark 的能力能够从另一台主机接收
    `tcpdump` 流。使用一种能够适应高延迟的协议。


    尽管如此，在本地网络内部，X 转发可以非常有用。


    ## X 服务器和客户端


    X 服务器是提供图形显示的计算机。X 客户端运行生成显示的程序。对很多人来说这似乎是颠倒的。如果你正在使用 X，X 服务器几乎可以肯定是你的桌面。要使用 X
    转发，你的桌面必须有一个 X 服务器。


    几乎所有类 Unix 系统都包含一个 X 服务器，通常来自 X.org，但也可能是厂商的专有系统。如果你运行的是 Windows，你需要一个第三方 X 服务器。我们将在
    PuTTY 和 X 的讨论中介绍这些。


    ## SSH 服务器上的 X 转发


    要使用 X 转发，SSH 服务器必须具有 xauth(1) 程序。如果存在，你可以在 `sshd_config` 中使用 X11Forwarding 关键字启用转发。


    ```

    X11Forwarding yes

    ```


    更改后重启（或 `pkill -1`）`sshd`。


    OpenSSH 手册提到了配置 X 转发细节的几个其他选项，但绝大多数人永远不需要它们。如果你遇到奇怪的问题，请调查 sshd_config(5) 中的各种
    X11 关键字。


    ## OpenSSH 客户端中的 X 转发


    OpenSSH 客户端支持两种级别的 X 转发，按安全级别区分。两者都配置在 `ssh_config` 中。基本 X 转发仅支持 X 协议中较不安全的子集。这种级别的
    X 转发相当安全。入侵者无法通过基本 X 转发接管你的桌面或窃听你的按键。


    ```

    ForwardX11 yes

    ```


    请始终先尝试这种基本 X 转发。


    许多 X 程序使用超出较不安全子集的功能。当通过 SSH 转发时，这些程序会显示错误并无情地崩溃。一旦你启用 X 转发，你就可以使用 ForwardX11Trusted
    关键字选择允许完整的 X 功能集。


    ```

    ForwardX11Trusted yes

    ```


    当你允许所有 X 功能时，你完全信任 SSH 服务器。控制 SSH 服务器的入侵者可以捕获你本地屏幕上的所有内容以及你的每个按键。在全局允许这种信任级别之前，请非常、非常确定你信任你可能登录的每一台远程服务器。而且一旦你绝对确定——不要这么做。


    X 转发是 SSH 压缩有意义的少数情况之一。设置 Compression 关键字为 yes 以启用压缩。然而最好仅在每个主机基础上使用。


    ## 按主机 X 转发


    你可以使用 Match 规则配置按主机设置，将 X 转发限制为仅必要的 hosts。这里我在 pride 上有一个程序需要完全信任 X，所以我在 ssh_config
    中为它做一个特殊条目。


    ```

    ForwardX11 no

    Host pride

    ForwardX11 yes

    ForwardX11Trusted yes

    Compression yes

    ```


    现在我只需要担心一台主机上的 X 软件，而不是我 SSH 登录的每一台主机。


    ## 命令行上的 X 转发


    比将 X 转发限制在某些主机上更好的是按连接启用它。


    在前面的示例中，我对主机 pride 的所有连接都完全信任 X。该主机上有一个程序需要完整的 X 访问，但我每次登录该主机时并不运行该程序。我只想为某些会话启用
    X 转发。使用 -c 标志启用压缩。使用 -x 命令行选项在必要时激活标准 X 转发。


    ```

    $ ssh -CX pride

    ```


    如果必须完全信任远程主机，等同于 ForwardX11Trusted，使用


    ```

    -Y

    $ ssh -CY pride

    ```


    这消除了常规转发 X 的风险，但在必要时支持 X 转发。


    ## 使用 PuTTY 进行 X 转发


    将 X 转发到 Windows 主机的第一个问题是 Windows 不包含 X 服务器。你需要额外的软件。幸运的是，许多人已将标准的 X.org 软件从 UNIX
    移植到 Windows。你可以使用任何你喜欢的。我通常使用 Xming，但如果你的雇主或同事坚持使用不同的软件也不用担心。


    ## Xming


    Xming 是一个广泛使用且频繁更新的 Windows 系统 X 服务器。Xming 的最新版本仅对向项目捐赠的人可用，但上一个版本是免费的。与本书中的所有软件一样，如果你发现
    Xming 有用，我鼓励你向程序员捐赠。Xming 为 Windows 带来了 UNIX 用户熟悉的各种 X 技巧，但就我们的目的而言，我们仅将其用于显示在远程机器上运行的程序。


    从 http://sourceforge.net/projects/xming/ 下载 Xming。Xming 安装程序对任何 Windows 用户来说都非常简单，所以我不会一步步指导你。采用默认设置。安装完成后，运行
    Xming 启动服务器。


    ## 启用和禁用 X 转发


    PuTTY 默认转发 X。更重要的是，PuTTY 不对 X 进行基于安全的过滤；其转发等同于 ssh 中的 ForwardX11Trusted。因此，我建议默认禁用
    X 转发，然后仅在需要时启用。


    在 PuTTY 配置屏幕的左侧，选择 Connection -> SSH -> X11。第一个复选框是 Enable X11 forwarding。取消选中它，然后保存默认设置。保持其他设置不变，因为它们仅在不常见的情况下有用。


    ## 转发是否正常工作？


    在你转发 X 之后，你的 SSH 会话看起来不会有任何不同。如何在需要之前证明转发是否正常工作？如果 SSH 已成功协商 X 转发，它将在你的 shell
    中设置 $DISPLAY 变量。


    ```

    $ echo $DISPLAY

    localhost:10.0

    ```


    你的 shell 知道有一个 X 服务器附加到它。你可以运行你的 X 程序。如果转发不工作，$DISPLAY 未定义。检查你的系统日志或 SSH 客户端的调试日志。


    使用不安全、旧的协议 XDMCP 的连接将具有类似 remote:1 的 $DISPLAY 值。这意味着你的 shell 在某个地方以某种方式找到了一个 X
    显示，但它不是你试图通过 SSH 转发的那个。如果 $DISPLAY 看起来很奇怪，不要运行你的 X 程序！可能有非常、非常严重的问题。


    现在从你的 shell 运行一个 X 程序，它应该在你的桌面上显示。大多数 X 客户端都包含 xterm(1) 终端模拟器。在你的 SSH 服务器上后台运行
    xterm。


    ```

    $ xterm &

    ```


    你将在 SSH 服务器上取回命令提示符。一两分钟后，取决于服务器和客户端之间的带宽和延迟，远程系统上的终端将出现在你的桌面上。


