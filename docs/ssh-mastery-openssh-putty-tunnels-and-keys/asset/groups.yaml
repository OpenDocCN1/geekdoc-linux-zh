    的集中管理，但与哈希主机名冲突。如果你想哈希主机名，你必须在单独的行上列出每个主机名。主机 avarice.mwl.io、mail.mwl.io 和 198.51.100.12
    需要三个 known_hosts 条目，并且每个条目都会单独进行哈希。如果你在分发之前要对 known_hosts 条目进行哈希，我建议以明文维护你的主文件。


