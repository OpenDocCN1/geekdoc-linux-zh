    锁定为仅监听一个地址可能会简化管理。


    ## 密钥类型


    密钥类型是用于生成此主机密钥的算法。现代的 *known_hosts* 可以包含六种不同的密钥类型：*ssh-dss*（DSA 密钥）、*ssh-rsa*（RSA
    密钥）、*ecdsa-sha2-nistp256*、*ecdsa-sha2-nistp384* 和 *ecdsa-sha2-nistp512*（ECDSA
    密钥），以及 *ssh-ed25519*（ED 25519 密钥）。在空格中出现的任何其他内容都很奇怪，需要调查。


    ## 密钥


    公钥是一个长长的乱码字母数字字符串。它通常以一系列大写 A 开头，并且经常（但不总是）以等号（=）结尾。密钥占据了该行的绝大部分。


