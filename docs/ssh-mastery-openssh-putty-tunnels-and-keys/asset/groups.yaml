    ## Tokens


    Certain keywords in sshd_config can also use tokens, symbols that represent some
    variable. Tokens make these keywords much more flexible. We’ll talk about using
    tokens when we discuss the keywords that can use them, but from the start you
    need to recognize them on sight. We’ll use tokens when building chroots in the
    next section, and then throughout this book.


    All tokens start with a percent sign (%). The simplest token is %%, which stands
    for an actual percent sign. If you have file paths with a percent sign in them,
    you might need this.


    The token %u represents the username.

    The token %h represents the user’s home directory.

    Most of the other tokens are used only in very special circumstances, when using
    less common functions. We’ll touch on them as needed, but these are the ones everyone
    must know. The sshd_config(5) man page lists all the tokens.


    ## Chrooting Users


    At times a user needs access to a command prompt or a specific program, but you
    don’t want the user to access anything outside his home directory. A directory
    the user cannot escape is called a chroot. (A chroot is also useful for SFTP,
    as discussed in Chapter 6, but that requires much less configuration.) OpenSSH
    supports chrooting users with the ChrootDirectory option.


    ```

    ChrootDirectory none

    ```


    By default, sshd does not chroot users.


    ## Populating a Chroot


    A chrooted user cannot access anything outside the chroot. Any chroot you create
    will not have device nodes, shells, or other programs unless you place them there.
    When your restricted user logs in, sshd will fail to find a shell or home directory
    and immediately disconnect them. To give a chrooted user shell access you must
    at minimum set permissions on the chroot directory, create a home directory for
    the imprisoned user, create device nodes, and install a shell.


    You only need to populate the chroot if the user needs shell access. If the user
    only gets file copy access via SFTP, the ForceCommand keyword discussed in Chapter
    6 is preferable to a populated chroot.


    The chroot directory must be owned by root and not writable by the restricted
    user, just as you would not permit an unprivileged user to write to the host’s
    root directory. If the restricted user can write to the chroot directory, sshd
    will not let them log in.


    A user’s home directory (as shown inside /etc/passwd) is expected to be available
    inside the chroot. If user pkdick’s home directory is listed as /home/pkdick,
    and he is chrooted into /usr/prisonroot, you must create the directory /usr/prisonroot/home/pkdick.
    This directory should be owned by the user, just like a regular home directory,
    and should contain any necessary dotfiles.


    Create a device node directory inside the chroot. With a chroot directory of /usr/prisonroot,
    you’d need /usr/prisonroot/dev. Now you need to populate this with device nodes.
    A chroot doesn’t require a full complement of device nodes, but most chrooted
    applications need at least /dev/random, /dev/stdin, /dev/stdout, /dev/stderr,
    /dev/tty, and /dev/zero. The method to create device nodes varies between operating
    systems. OpenBSD and many Linuxes use a shell script /dev/MAKEDEV, while FreeBSD
    and many commercial Unix-like systems use a device filesystem. Check your operating
    system to see what device nodes a chroot needs and how to create them. Some operating
    systems include tools to easily populate a chroot.


    Finally, users need a shell. Copy a statically-linked shell into the chroot’s
    /bin directory. Also copy static versions of any other programs the user needs.
    If you want to use dynamically linked programs, you must also copy over any necessary
    files.


    ## Assigning Chroot Directories


    Use the ChrootDirectory option to establish chroots.


    ```

    ChrootDirectory /home/djm

    ```


    This works for a single user account, or if all SSH users have the same chroot
    directory, but this is a place where tokens come in useful.


    If your chroot directory path includes a literal percent sign, use the %% token.


    Here we chroot into the directory /home/disk%1/djm.


    ```

    ChrootDirectory /home/disk%%1/djm

    ```


    The %h macro expands to the user’s home directory, as specified in /etc/passwd.


    ```

    ChrootDirectory %h

    ```


    At login, djm gets locked into /home/djm. Note that he’ll need a chrooted home
    directory inside this directory, so you’ll need to create /home/djm/home/djm.


    The %u macro expands to the user’s username. This lets you assign a group of users
    unique home directories under central chroot directory.


    ```

    ChrootDirectory /usr/prisonroot/%u

    ```


    You’ll need to populate each user’s chroot separately.


    ## Choosing Users to Chroot


    You can chroot everyone, but that would make it hard for your sysadmins to perform
    maintenance. Chances are you only want to chroot a subset of your users. Use a
    Match statement to selectively chroot users.


    ```

    ...

    ChrootDirectory none

    ...

    Match Group billing

    ChrootDirectory %h

    ```


    If a majority of your users are chrooted, reverse the default to allow only your
    sysadmins full access.


    ```

    ...

    ChrootDirectory %h

    ...

    Match Group wheel

    ChrootDirectory none

    ```


    Choose whichever method makes sense for your environment.


    ## Debugging a Chroot


    Chroots are difficult to manage in that they normally lack a complete userland.
    If a chrooted user cannot log in, run sshd in debugging mode, attached to a terminal
    window. Have the chrooted user attempt to log in, and watch the debugging output;
    you’ll probably see the problem. Common issues include missing device nodes, incorrect
    directory permissions, or a missing shell.


