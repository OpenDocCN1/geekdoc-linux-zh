    regular privileges, and disregards whatever command the client requested. Much
    like defining a command in `authorized_keys`, ForceCommand retains the requested
    command in the `$SSH_ORIGINAL_COMMAND` environment variable.


    ForceCommand is best used inside a Match statement.


