    You’ll see a PuTTY icon in the upper left-hand corner of your working PuTTY session.
    This leads to a drop-down menu of useful tasks.


    To duplicate an existing session, opening a second window to the same host, select
    Duplicate Session.


    To open a new window to a host that you’ve already saved the configuration for,
    select Saved Sessions and the session name.


    To open a window to a completely new host, select New Session.


