    or both ends of the tunnel. Every machine with a functional TCP/IP stack uses
    127.0.0.1 as the address for itself, and only the local machine can connect to
    it. If I forward port 80 on my workstation’s localhost address to port 80 on the
    server’s localhost address, no other hosts can connect to that forwarded port
