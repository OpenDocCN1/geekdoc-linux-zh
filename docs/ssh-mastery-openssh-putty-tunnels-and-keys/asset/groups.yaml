    如果你的其中一台桌面机器被入侵，你必须停用该机器的身份验证密钥。如果所有客户端共享同一个私钥，你必须重新生成新的密钥对并分发到所有机器上。拥有你私钥的入侵者很可能会在你完成此操作之前将你锁在自己的系统之外。如果每台机器都有唯一的密钥对——即使所有密钥共享相同的密码短语——那么一个密钥被攻破或丢失也不会危及你其他机器上的密钥。


    此外，首选的密钥算法会随时间变化。当我撰写本书第一版时，用户身份验证密钥默认为 1024 位。现在默认为 2048。如果我仍在使用几年前创建的密钥，它们对于当前使用来说就太弱了。完全有可能的是，RSA
    作为默认用户身份验证密钥算法将来会被完全不同的算法取代。通过在获得新机器时创建新密钥，并使与旧硬件关联的密钥失效，你可以确保你的密钥相对较新且安全。


    ## 在 SSH 服务器中禁用密码


    密码比密钥安全性更低。现在你已经拥有可用的基于密钥的身份验证，聪明的做法是禁止基于密码的身份验证。sshd_config 关键字 ChallengeResponseAuthentication
    禁用通用的挑战-响应身份验证系统，例如请求用户名和密码的提示。关键字 PasswordAuthentication 启用和禁用密码。要禁用基于密码的身份验证，将这两个关键字都设置为
    no。


    ```

    ChallengeResponseAuthentication no

    PasswordAuthentication no

    ```


    虽然 sshd 默认允许公钥身份验证，但请验证没有人更改过该关键字。PubkeyAuthentication 关键字必须设置为 yes。


    ```

    PubkeyAuthentication yes

    ```


    现在重启 sshd，可以使用内置系统命令或 pkill -1 sshd。


    修改 sshd_config 不会改变其他程序使用密码的方式。如果你为 sudo 使用密码，sudo 仍会要求用户输入密码。


    ## 密码身份验证警告！


    如果你在配置 SSH 时出现错误导致无人可以登录，你可能会将自己锁在服务器之外。在修改 sshd_config 时，在验证更改有效之前，不要退出现有的 SSH
    会话。


    （记住，如第三章所述，你可以在备用端口上运行 sshd 进行测试。）创建一个新的 SSH 会话。在断开第一个会话之前，验证你是否可以登录并成为 root。


    前一段非常重要。忽略它需自担风险，否则请准备好迎接你自己的躁郁性冰淇淋狂欢。


    ## 允许特定主机使用密码


    虽然密码较弱，但有时你无法完全禁用它们。你可能有一些用户或应用程序由于一个愚蠢的原因或另一个原因无法使用密钥。根本问题通常是政治性的而非技术性的，但它们仍然是问题。在你解决这些问题时，你可以使用条件配置允许特定主机使用密码，如第三章所述。在这里，我们允许来自特定子网的密码身份验证。


    ```

    Match Address 192.0.2.0/24

    PasswordAuthentication yes

    ```


    记住，所有 Match 语句都应放在 sshd_config 的底部。


    基于用户名允许密码身份验证是可能的，但极其不明智。SSH 服务器在挂断请求密码的客户端之前，必须先获取用户名。这意味着 Hail Mary Cloud 将会持续不断地探测服务器。迫使你允许有限密码身份验证的原因可能使要求强密码同样成问题——那个要求允许使用密码的老板可能认为
    p455w0rd 是一个安全的密码。允许密码的账户将成为一个薄弱环节。这里唯一能拯救你的就是对非常安全的堡垒主机进行良好的离主机日志记录，这样当机器被入侵时，你可以告诉老板停机是他的错。


    ## 代理转发


    假设我在所有计算机上禁用了基于密码的身份验证。访问我任何主机的命令行提示符的唯一方式是通过公钥身份验证。我正在操作我的服务器 wrath，并且必须将一个文件复制到服务器
    `gluttony`。这带来了一个问题。我的私钥不在 `wrath` 上。将私钥复制到服务器上是糟糕的安全实践——你希望私钥存在于尽可能少的机器上，并且绝不在服务器上。但密码不起作用。我如何使用
    SCP 或 SFTP？


    答案是将身份验证请求转发回你的工作站。代理转发正是如此。当你尝试从一台服务器 SSH 到另一台服务器时，服务器上的 SSH 客户端会将私钥请求发送回你的桌面。代理作为一个套接字可用，其位置由环境变量
    `$SSH_AUTH_SOCK` 给出。


    ```

    $ echo $SSH_AUTH_SOCK

    /tmp/ssh-z0eUnDTnk b/agent.2513

    ```


    要使用代理转发，客户端和服务器都必须允许它，并且在建立第一个 SSH 连接之前 SSH 代理必须正在运行。如果客户端和服务器都支持并请求转发，身份验证请求将被转发。


    ## 代理转发安全性


    代理转发的风险是你必须对 SSH 服务器给予一定信任。任何拥有 root 访问权限的人都可以访问你的 SSH 代理套接字。任何可以访问你的 SSH 代理套接字的人都可以在不提供密码短语的情况下使用你的私钥。


    如果你的 SSH 服务器被入侵，入侵者可以搭乘你的身份验证套接字，使用你的凭据登录远程服务器。


    滥用的代理转发已导致许多组织的入侵，甚至是那些你认为应该更清楚的组织。仅对你控制的机器启用代理转发。


    ## sshd 中的代理转发


    要在服务器上启用代理转发，将 AllowAgentForwarding 关键字设置为 yes。


    ```

    AllowAgentForwarding yes

    ```


    我通常会全局禁用代理转发，然后使用 Match 语句仅允许特定用户或地址转发其代理。


    ## OpenSSH 客户端代理转发


    在 `ssh_config` 中，使用 ForwardAgent 关键字激活代理转发。


    ```

    ForwardAgent yes

    ```


    下次你连接到服务器时，客户端将请求代理转发。


    ## PuTTY 代理转发


    PuTTY 默认启用代理转发。在 PuTTY 设置屏幕的左侧，转到 Connection -> SSH -> Auth。在 Authentication parameters
    下，你会看到一个标记为 Allow agent forwarding 的复选框。


    你也可以使用密钥身份验证和 *authorized_keys* 来非常具体地限制用户通过 SSH 可以执行的操作。我们将在第 12 章中探讨这一点。现在，让我们来看
    X 转发。


    ¹ 不信任桌面系统管理员基本上会破坏任何服务器安全希望。是的，我们都曾在那里工作过。


    ² 不要在 Microsoft Publisher 中打开公钥。那不会让任何人高兴。


    ## 第 8 章：X 转发


    类 Unix 系统使用 X 协议（或 X11）来显示图形用户界面。X 多年来有所改进，但它仍然臭名昭著地繁复。X 的更有用的特性之一是将程序运行所在的系统与程序显示出现所在的系统分离。你可以在一台主机上运行程序，并让显示出现在完全不同的工作站上。我可以在公共互联网上的主机上运行图形网页浏览器，并将显示回传到我雇主防火墙内的笔记本电脑上，绕过防火墙内容过滤限制——当然是为了完全合法的工作原因。在这种情况下，所有网络请求都源自我的服务器，结果显示在我的笔记本电脑上。你可以用任何
    X 程序做到同样的事情。


    如果你以前从未使用过 X，它可能看起来有点奇怪。没关系。玩一玩，你很快就会理解它的用途。


    原始 X 在网络上传输信息时未加密。通过 SSH 使用 X11 转发将其包装起来，在传输中保护 X。


    ## X 安全性


    X 来自网络安全远非今天这样重要的时代。鉴于当时有限的硬件，开发者很高兴能让图形应用程序正常工作。在任何协议中事后添加安全性并不像我们希望的那样有效。从远程机器显示
    X 需要对远程机器给予信任。你越信任远程机器，就越可以在本地显示更多的 X 程序。如果你完全信任一台被入侵的机器，入侵者可以使用 X 接管你的工作站，捕获你的击键，并像你一样访问你的系统。


    仅允许真正需要它的用户或主机进行 X 转发。


    ## X 与网络


    X 开发时，某个站点的互联网连接可能快至 56 kbps。尝试在站点之间使用 X 转发是系统管理员喝啤酒时嘲笑的事情。不过现在带宽不再是问题，人们可能会在一大洲运行浏览器并在另一大洲显示它。


    虽然在世界许多地区带宽不再是问题，但延迟是真实存在的。许多图形程序对延迟高度敏感。一个程序可能合理地期望每秒执行数百次图形操作。当每次操作耗时一纳秒时，这没问题。然而，当每次操作由于跨国链路耗时五十毫秒时，你的程序就变得无法使用。如果延迟不是问题，抖动和丢包也会破坏可用性。

    '
