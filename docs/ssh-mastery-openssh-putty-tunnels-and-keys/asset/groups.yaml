    ## OpenSSH 本地转发


    要告诉 SSH 客户端激活本地转发，请使用 -L 标志。


    ```

    $ ssh -L localIP:localport:remoteIP:remoteport hostname

    ```


    如果在 SSH 客户端上未指定 IP 地址，SSH 会连接到 127.0.0.1。在这种情况下可以跳过第一个参数，使命令变为：


    ```

    $ ssh -L localport:remoteIP:remoteport hostname

    ```


    目前，只使用 IP 地址 127.0.0.1。这是在每台机器上都可用的回环地址，仅可在该机器上访问。虽然看起来我们正在将一个地址转发到同一个地址，但客户端上的
    127.0.0.1 与服务器上的 127.0.0.1 并不是同一个。我们将在本章后面的“选择 IP 地址”中考虑将转发的端口绑定到不同的 IP 地址。


    所以，这里是如何使用本地端口转发连接到服务器 sloth，并将 sloth 的本地主机地址上的端口 80 转发到我的客户端的端口 8080。


    ```

    $ ssh -L 8080:127.0.0.1:80 sloth

    ```


    我将工作站上的端口 8080 附加。我没有指定本地 IP 地址，因此 ssh 将转发附加到客户端的 127.0.0.1。我的 SSH 会话正常登录，并给我服务器上的一个终端。但如果我将我的网络浏览器指向
    localhost:8080，我就会连接到服务器上运行的网站。hosts 文件中的别名会使网站更易于使用。


    要每次连接到服务器时都设置本地端口转发，请在 ssh_config 中使用 LocalForward 关键字。


    ```

    LocalForward client-IP:client-port server-IP:server-port

    ```


    这看起来像命令行上的端口转发，但中间的冒号缺失了。这里我将工作站上的端口 8080 转发到服务器上的端口 80。我们在客户端和服务器上都附加到 127.0.0.1，即
    localhost。我在工作站上使用端口 8080，因为使用端口 80 每次都需要以 root 身份运行 SSH。


    ```

    Host envy.mwl.io

    LocalForward localhost:8080 localhost:80

    ```


    LocalForward 关键字最常与 Host 语句一起出现，从而在连接到特定服务器时启用本地端口转发。为了避免 IP 和端口冲突，每个服务器通常都会分配自己的本地端口。


