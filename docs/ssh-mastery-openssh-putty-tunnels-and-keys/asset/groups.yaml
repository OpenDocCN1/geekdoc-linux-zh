    关键字，但并非所有这些关键字都有命令行等价物。要在命令行上设置这些关键字，请使用 -o 命令行选项、选项名称、等号和该关键字的值。


    ```

    $ ssh -o Port=2222 sloth

    ```


    这个例子很 trivial——Port 关键字有一个专用的命令行选项 -p。我们稍后会看到更复杂的例子。


