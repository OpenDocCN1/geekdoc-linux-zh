    name but *.pub* appended. Here I create a key called *task-key*.


    ```

    $ ssh-keygen -f task-key -N ''''

    ```


    I end up with the files *task-key* and *task-key.pub*. The *.pub* file is the
    public key.


    Either create an account on the SSH server for this automated task, or choose
    an existing account. The host’s SSH server must permit logins to that account.
    Add the *.pub* file to that account’s *authorized_keys*.


    The client machine should now be able to log on to the SSH server using the key.
    Remember to use the *-i* argument to ssh(1) to specify the alternate key file.
    Here I use this key to log on to the machine *sloth*.


    ```

    $ ssh -i task-key sloth

    ```


    If you successfully log onto the server, the key is correctly installed. Now let’s
    lock it down.


    # Limiting Automation Keys


    Best practice forbids all access unnecessary for a user to perform his task. Does
    your automated process need port or X forwarding? Turn them off. Does it need
    a special environment? Probably not, because you can establish that environment
    more easily in the user account. Your automated job runs on a single machine,
    so you can restrict the key so that it can only be used from that one machine.
