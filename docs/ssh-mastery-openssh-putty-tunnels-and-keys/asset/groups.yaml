    Two files control ssh(1) behavior: /etc/ssh/ssh_config and $HOME/.ssh/config.
    Each contains keywords and values, as discussed in Chapter 2. The former establishes
    default behavior for all system users. The latter is the user’s personal SSH client
    configuration. A user’s configuration overrides all global settings, but most
    users can’t be bothered to enter their own custom configurations.

    两个文件控制 ssh(1) 行为：/etc/ssh/ssh_config 和 $HOME/.ssh/config。每个文件都包含关键字和值，如第 2 章所述。前者为所有系统用户建立默认行为。后者是用户的个人
    SSH 客户端配置。用户的配置会覆盖所有全局设置，但大多数用户懒得输入自己的自定义配置。


    Configuration file changes affect all SSH sessions started after the change. There’s
    no process to restart, but changing the configuration doesn’t affect existing
    SSH sessions. Both files have the same syntax and accept exactly the same options.
    I’ll refer to ssh_config for brevity, but everything applies equally well to $HOME/.ssh/config.

