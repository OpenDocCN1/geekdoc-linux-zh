    无论你对用户进行多么严厉的讲授，其中许多人仍不会费心将服务器指纹与你提供的列表进行比较；相反，他们会点击“是，接受密钥”。无论我们多么努力地教育他们，用户很快就会对看起来吓人的警告习以为常并学会忽略它们。帮助用户注意的最佳方式是确保只有在真正出现问题时他们才会看到警告。


    同样，基于密钥的身份验证通常比基于密码的更安全。然而，许多用户不会费心将他们的 *authorized_keys* 复制到服务器上。他们只会坚持使用熟悉的密码。如果你想强制使用基于密钥的身份验证，你需要自己将用户的
    *authorized_keys* 放在服务器上。如果你管理数十或数百台服务器和/或用户，你将需要自动化来在系统之间分发用户密钥更新。


    虽然 OpenSSH 不包含自动密钥分发工具，但理解与密钥相关的功能可以极大地简化你的自动化流程。我们将从主机密钥开始，然后进行到用户密钥。


    ### *known_hosts* 详解


    对于 OpenSSH 和 PuTTY 来说，主机密钥分发都从 *known_hosts* 开始。如果你要分发主机公钥，你会希望确保这些记录是干净无误的。这意味着你需要完全理解
    *known_hosts* 文件。


    *known_hosts* 中的每一行代表一个主机的一个公钥，以空格分隔的字段表示。如果一个主机支持三种不同的公钥算法，并且你使用这三种密钥都连接到过该主机，那么该主机在
    *known_hosts* 中将有三条条目。每个条目还给出服务器的主机名或 IP 地址以及用于该密钥的算法。但每个条目也可以包含另外几个字段。


    ### 标记


    *known_hosts* 文件支持两个特殊标记，@cert-authority 和 @revoked。这些标记必须出现在行首。


    以 *@cert-authority* 开头的 *known_hosts* 条目表示该主机密钥用于 SSH 证书颁发机构。SSH 证书颁发机构与 TLS CA
    不同。第 14 章讨论 SSH CA。


    如果入侵者侵入 SSH 服务器并复制了服务器的私钥，该密钥就不再可信。一个精明的入侵者可能会使用该密钥尝试

