    SSH 服务器位于公共互联网上。任何人都可以连接它，并且它可以自由访问互联网的其余部分。


    ### 端口转发类型


    端口转发有三种类型：本地、远程和动态。


    *本地端口转发* 将客户端上的一个端口重定向到服务器上的一个端口。本质上你是在说“抓取 SSH 服务器上的某个端口并使其对我的客户端本地化。”假设你想从一台仅提供未加密
    POP3 的服务器下载邮件，但你有 SSH 访问权限。你可以将本地机器上的端口 2110 转发到 POP3 服务器上的端口 110。将你的邮件客户端配置为从本地主机地址的端口
    2110 下载邮件。SSH 拦截所有对端口 2110 的请求并将其转发到邮件服务器的端口 110。图 9-1 说明了本地端口转发的数据流。


