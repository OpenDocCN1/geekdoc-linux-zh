    ## Acknowledgements


    Thanks go first to the fine folks who wrote OpenSSH and PuTTY. These people literally
    changed the world for the better by creating and supporting their software. I
    must notably thank OpenSSH ringleader Damien Miller, for taking the time to point
    me in the right direction when I had a dumb question.


    I must also thank my technical reviewers: Bill Allaire, Jim Allen, Tim Enders,
    Marie Helene Kvello-Aune, Kurt Mosiejczuk, Mike O’Connor, Bernard Spil, Loganaden
    Velvindron (from hackers.mu), and Markus Waldeck. Any errors that appear in this
    book crept in despite the efforts of these fine folks.


    To the people who offer me ongoing support via Patreon (https://www.patreon.com/mwlucas),
    my gratitude. A whole passel of them got a copy of this book as thanks.


    Writing this book would have been impossible without the source code for all the
    software involved.


    This is for Liz.


    ## Chapter 0: Introduction


    Over the last 15 years, OpenSSH (http://www.OpenSSH.com) has become the standard
    tool for remote management of UNIX-like systems and many network devices. Most
    systems administrators use only the bare minimum OpenSSH functionality necessary
    to get a command line, however. OpenSSH has many powerful features that will make
    systems management easier if you take the time to understand them. You’ll find
    information and tutorials about OpenSSH all over the Internet. Some of them are
    poorly written, or only applicable to narrow scenarios. Many are well written,
    but are ten years old and cover problems solved by a software update nine years
    ago. If you have a few spare days, and know the questions to ask, you can sift
    through the dross and find effective, current tutorials.


    This task-oriented book will save you that effort and time, freeing you up to
    prepare for the next version of Castle Wolfenstein. I assume that you are using
    fairly recent versions of OpenSSH and PuTTY, and I disregard edge cases such as
    “my twenty-year-old router only supports SSH version 1.” If you found this book,
    chances are you’re capable of searching the Internet to answer very specific questions.
    I won’t discuss building OpenSSH from source, or how to install the OpenSSH server
    on fifty different platforms. If you’re a systems administrator, you know where
    to find that information. If you are a system user, your system administrator
    should install and configure the OpenSSH server for you, but mastering the client
    programs will help you work more quickly and effectively.


    ### Who Should Read This Book?


    Everyone who manages a UNIX-like system must understand SSH. OpenSSH is the most
    commonly deployed SSH implementation. Unless you are specifically using a different
    SSH implementation, read this book.


    People who are not systems administrators, but who must connect to a server over
    SSH, will also find this book helpful. While you can learn the basics of SSH in
    five minutes, proper SSH use will make your job easier and faster. You can skip
    the sections on server configuration if you wish, although it’s always good to
    know what your system administrator can actually do as opposed to what they feel
    like doing.


    ### SSH Components


    Secure shell (SSH) is a protocol for creating an encrypted communications channel
    between two networked hosts. SSH protects data passing between two machines so
    that other people cannot eavesdrop on it. Tatu Ylönen created the initial protocol
    and implementation in 1995, designing it to replace insecure protocols such as
    telnet, RSH, and rlogin. With the release of OpenSSH in 1999, SSH rapidly became
    the standard method for managing hosts. Today, many different software packages
    rely on the SSH protocol for encrypted and well-authenticated transport of data
    across private, public, and hostile networks.


    ### OpenSSH


    OpenSSH is the most widely deployed implementation of the SSH protocol. It started
    as an offshoot of a freely licensed version of the original SSH software, but
    has been heavily rewritten, expanded, and updated. OpenSSH is developed as part
    of the OpenBSD Project, a community known for writing secure software. OpenSSH
    is the standard SSH implementation in the Linux and BSD world, and is also used
    in products from large companies such as HP, Cisco, Oracle, Novell, Juniper, IBM,
    and so on.


    OpenSSH comes in two versions, OpenBSD and Portable OpenSSH.


    OpenSSH’s main development happens as part of OpenBSD. They hold OpenSSH to the
    same standards of simple, secure code as they do the rest of OpenBSD. This version
    of OpenSSH is small and secure, but only supports OpenBSD. The OpenSSH Portability
    Team takes the OpenBSD version and adds the glue necessary to make OpenSSH work
    on other operating systems, creating Portable OpenSSH. Not only do different operating
    systems use different compilers, libraries, and so on, they have different authentication
    systems. The Portable OpenSSH team needs to account for all of these differences
    on every platform. They do their best to hide this complexity, so you don’t have
    to worry about it. This book applies to both versions.


    Any operating system probably comes with OpenSSH, or the operating system vendor
    provides a package. Even Microsoft offers an OpenSSH package in their Linux layer,
    and a beta of a native port has recently escaped as an optional Windows component.
    If your operating system doesn’t provide an OpenSSH package, download the Portable
    OpenSSH source code from http://www.OpenSSH.com and follow the instructions to
    build the software.


    OpenSSH is available under a BSD–style license. You can use it for any purpose,
    with no strings attached. You cannot sue the software authors if OpenSSH breaks,
    and you can’t claim you wrote OpenSSH, but you can use it any way you wish, including
    adding it to your own products. You can charge to install or support OpenSSH,
    but the software itself is free.


    ### SSH Server


    An SSH server listens on the network for incoming SSH requests, authenticates
    those requests, and provides a system command prompt (or another service that
    you configure). The most popular SSH server is OpenSSH’s sshd.


    ### SSH Clients


    Use an SSH client to connect to your remote server or network device. The most
    popular SSH client for Windows systems is PuTTY. The standard SSH client for Unix-like
    systems is ssh(1), from OpenSSH. Both are freely available and usable for any
    purpose, commercial or noncommercial, at no cost.


    Microsoft also recently forked OpenSSH to include an SSH client in Windows. It’s
    considered experimental, though, and development is continuing. Experiment with
    it as you wish; it should work much like OpenSSH. It’s also part of Windows’ Linux
    subsystem. If you’re using a Windows-native SSH, though, you really want to use
    PowerShell rather than the traditional terminal.


    Once you understand PuTTY and OpenSSH, you’ll have the base knowledge to use any
    secure SSH client.


    ### SSH Protocol Versions


    The SSH protocol comes in two versions, SSH-1 (version 1) and SSH-2 (version 2).
    Always use SSH-2. All modern SSH software defaults to version 2. You will find
    old embedded devices that still rely on SSH version 1, but SSH-1 is barely more
    secure than unencrypted telnet.


    One person designed SSH-1 for his own needs. It met those needs admirably, and
    in the 1990s it was a whole bunch better than telnet. As SSH grew more popular,
    more people examined the protocol and exposed weaknesses in the original design.
    With today’s computing power, SSH-1 is highly vulnerable to attacks. While SSH-1
    encrypts your data in transit and prevents casual eavesdropping, an attacker that
    knows a couple tricks can capture your data, decrypt your data in transit, lull
    you into thinking that you logged on to the correct machine when you are actually
    connected to a different host, insert arbitrary text into the data stream, or
    any combination of these. Attacking an SSH-1 data stream isn’t quite a point-and-click
    process, but intruders do break SSH-1 in the real world.


    The appearance of security is worse than no security. Never use SSH version 1.


    It might seem harmless to permit SSH-1 for servers or clients that don’t support
    SSH-2. The client and server transparently negotiate the SSH version they will
    use for a connection however. If either client or server tolerates SSH-1, an intruder
    can capture your login credentials and all transmitted data. It’s fairly straightforward
    to insert arbitrary text (such as rm -rf /*) into an SSH-1 session. This was discovered
    in 1998, and today’s massive computing power has made this attack far easier.
    SSH-1 sessions can be decoded in real time by programs

