    the smart thing to do is to disallow password-based authentication. The sshd_config
    keyword ChallengeResponseAuthentication disables generic challenge-response authentication
    systems, such as a prompt requesting a username and password. The keyword PasswordAuthentication
    enables and disables passwords. To disable password-based authentication, set
    both of these keywords to no.


    ```

    ChallengeResponseAuthentication no

    PasswordAuthentication no

    ```


