    *authorized_keys* restrictions.


    # Automation Authentication Keys


    Automated processes cannot type passphrases. Any scheduled or otherwise automated
    task that requires SSH access to another host needs a key without a passphrase.
    Generate this key exactly like you would generate a host key.


    ```

    $ ssh-keygen -f filename -N ''''

    ```


