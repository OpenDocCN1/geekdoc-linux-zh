    ## Saving PuTTY Connections


    You can preconfigure PuTTY connections, ensuring that your sessions with a particular
    host happen the same way every time. Enter the SSH server’s hostname under Host
    Name (or IP Address). Under Saved Sessions, type a name for this connection. I
    usually name my connections after the host, plus possibly a word or two for any
    special configuration in the session. I might have a connection labeled dns1,
    and another named dns1 with X, so that I can easily use X forwarding when I need
    it.


    To run a saved connection, double-click the connection name.


    To copy a saved connection, highlight it, click Load, make your changes, and save
    it under a different name.


