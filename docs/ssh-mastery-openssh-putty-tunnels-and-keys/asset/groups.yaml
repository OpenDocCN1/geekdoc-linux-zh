    ## 第9章：端口转发


    SSH 端口转发是一个有争议的话题。


    SSH 可作为任意 TCP 流量的包装器。你可以将 telnet、POP3、IMAP 或 HTTP 等未加密服务隐藏在 SSH 内部，安全地传输这些天生不安全的协议。SSH
    会话可以承载任何 TCP/IP 协议，包括贵组织网络中本地 IT 安全团队禁止的协议。因此，许多对安全性要求较高的组织不允许 SSH 穿越和/或离开其网络。要求不那么严格的组织则利用这种能力来保护其网络。（你也可以使用
    SSH 创建 VPN 来承载所有 IP 协议，但那在第 13 章。）


    例如，我用 WordPress 管理我的网站和博客。它提供了一个友好的、点击式的网站管理和设计界面，让我无需真正学习关于网页设计的*任何*东西就能获得一个看起来不错的页面。¹
    在 Let''s Encrypt 出现之前的那些黑暗日子里，我的网站使用的是明文 HTTP。我使用 SSH 端口转发在我的 Web 服务器和桌面之间隧道传输
    HTTP。这保护了传输过程中的凭据，并消除了密码在传输中被窃取的风险。这是 SSH 端口转发一种合理且合法的用途。


    然而，假设我的桌面位于一个高安全网络内部。防火墙严格限制网页浏览并阻止所有文件传输。如果我能使用 SSH 连接到网络外部的服务器，我就可以将桌面流量转发到该外部服务器以获得不受限制的互联网访问。我可以通过
    SSH 上传机密文档，而防火墙日志只会显示我建立了 SSH 连接。你的网络管理员会提出反对，而且理由充分。


    ### 端口转发与安全策略


    如果你是某个组织的安保负责人，端口转发可能会让你考虑完全阻止 SSH。我理解。我做过你的工作。你还应该知道，顽固的用户可以将 SSH 隧道*嵌入* DNS、HTTP
    或几乎任何其他服务或协议中，包括原始 ICMP。绝对阻止 SSH 的唯一方法是拒绝所有 TCP、UDP 或 ICMP 连接，使用能够智能检查流量的 Web
    代理，并且不允许客户端机器即使通过代理也访问公共 DNS。我见过一家公司实际实施了这种类型的<|message|>安全边界，但他们为明显笨拙的业务关键软件设置了许多漏洞和例外。如果你无法在你的环境中实施此措施但有严格的安全要求，你必须与用户合作以满足这些要求和业务需求。我强烈建议建立一个扎实的网络流量感知程序以及入侵和外泄检测，以便你知道网络流量何时偏离常态。阅读
    Richard Bejtlich 关于入侵和外泄分析的书籍，以及我自己的 *Network Flow Analysis*（No Starch Press，2010），并实施文中讨论的类似程序。


    作为用户，拥有通过 SSH 隧道传输任意流量的能力并不意味着你应该这样做。如果你的组织安全策略禁止端口转发和/或隧道传输，就不要这样做。如果策略说“使用 Web
    代理并远离 IRC”，那就听从。我不负责如果你使用这些技术而受到训斥、解雇或被消灭。（即使我们 IT 安全官员都是不懂你对 IRC 和 MySpace 这种非常个人化且深切紧急的*需求*的小气独裁者。）


