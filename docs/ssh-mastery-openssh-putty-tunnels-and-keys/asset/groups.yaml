    # Chapter 3: The OpenSSH Server


    The OpenSSH server sshd is highly configurable and lets you restrict who may connect
    to the server, what actions those users can take, and what actions it permits.
    Every modern Unix-like operating system comes with sshd installed as part of the
    base operating system.


