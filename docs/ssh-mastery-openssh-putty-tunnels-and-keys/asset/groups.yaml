    ```


    You can specify the port in ssh_config.


    ```

    Port 2222

    ```


    Again, I recommend storing permanent connection information in ssh_config.


    # SSH Options on the Command Line


    SSH isn’t just a command; it’s a protocol. And that protocol has all sorts of
    edge cases. Sometimes you’ll need to set some of those edges on the command line.
    While everything OpenSSH supports is available as an ssh_config keyword, not all
    of those keywords have command-line equivalents. To set those keywords on the
    command line use the -o command-line option, the option name, an equals sign,
    and the value of that keyword.


    ```

    $ ssh -o Port=2222 sloth

    ```


    This example is trivial—the Port keyword has a dedicated command-line option,
    -p. We’ll see more complicated examples later.


    # Evaluating your SSH Configuration


    You can set command-line options, options in the user’s configuration file, and
    options in the global client configuration file. Host keywords can muck up your
    carefully adjusted defaults, or your carefully adjusted defaults can require you
    to use Host keywords for specific servers. How do you know what options ssh(1)
    is'
  - '[PAGE 43]


    really using when you connect to a host?


    Use the -G option to ssh. It tells ssh(1) to parse all the configurations for
    the target host, print out the configuration it’s going to use, and immediately
    exit without connecting. You can review your settings to verify you’re getting
    what you need.


    # SSH Jump Hosts


    Sysadmins often have to pass through one host to get to another. Maybe you trust
    this intermediate host. Maybe you don’t. OpenSSH supports jump hosts, letting
    you use an SSH server as a relay to connect to a second server. Yes, you could
    do this manually by logging into the intermediate host and running ssh again,
    but using the built-in support means that the jump host sees none of your plain
    text. The jump host has no control over the options your client and the target
    server negotiate. This means you can, say, forward X or your SSH agent through
    a jump host that accepts neither.


    Specify a jump host with -J. Add the username if needed.


    ```

    $ ssh -J mw1@envy jerkface@pride

    ```


    I’m trying to log in as jerkface on the host pride, using the account mw1 on host
    envy as a jump host. I’ll get prompted for my authentication credentials on the
    jump host, and then my credentials on the destination. It’s best to use public
    key authentication on both hosts.


    Set a jump host in ssh_config with the ProxyJump keyword.


    ```

    Host pride.mw1.io

    ProxyJump mw1@envy.mw1.io

    ```


    How much do you have to trust your jump host? None of your keystrokes reach the
    jump host, so you don’t have to worry about session logging. The only thing the
    jump host can see is an encrypted data stream between your client and the destination
    server. The jump host could alter or interrupt the encrypted stream, but that’s
    exactly the sort of tampering SSH is designed to detect.


    Some Linux distributions disable jump hosts in their client.


