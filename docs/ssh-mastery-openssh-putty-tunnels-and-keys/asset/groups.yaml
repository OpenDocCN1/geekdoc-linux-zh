    # Revoking Host Keys


    If you have reason to suspect that a server’s key has been compromised, revoke
    it. Find all of the server’s host key entries in your *known_hosts*. Add to the
    string @revoked in front of all of them. Generate new host keys for the server
    and restart *sshd*, then add the new host keys to your *known_hosts*. You can
    now distribute your updated *known_hosts* to your clients, and in the (unlikely)
    event that the user attempts to use the revoked key, the user will get a warning.


    The effectiveness of revoked keys depends entirely on distributing *known_hosts*
    to your clients.


    # Distributing Host Keys


    Any time an SSH server’s host key is added, moved, or changed, users will see
    warnings about the host key. The whole point of distributing *known_hosts* is
    to keep users from seeing unnecessary warnings. Stay ahead of your users.¹ Update
    your *known_hosts* any time you deploy or remove a server, or if you must give
    a server new keys. If you delay updating *known_hosts*, users will learn to ignore
    warnings.


    The worst part of maintaining a centralized *known_hosts* file is copying the
    file to all of your servers and workstations. You’re busy. If the update takes
    a long time or a lot of energy, you won’t keep up on it. You really need a centralized
    system like Ansible, Puppet, or one of their many competitors. Active Directory
    works fine for distributing host keys to Windows systems. If you’ve never used
    automation, I recommend Ansible. Once you have a complete *known_hosts* for your
    existing systems, updating that file and pushing it out to all of your systems
    should only take a minute or two, and will save your users and your support team
    hours of labor.


    # Distributing known_hosts


    All OpenSSH clients check */etc/ssh/ssh_known_hosts* for host keys. Copy your
    *known_hosts* to this location on each of your servers and workstations. The next
    time someone uses ssh(1) on these machines, the correct key will already be in
    place.


    OpenSSH checks for host keys in each user’s personal *known_hosts* file in addition
    to the system’s */etc/ssh/ssh_known_hosts*. The client will use any entry that
    matches the key offered by the server. When you first deploy a centralized *known_hosts*,
    each user will probably have an existing personal *known_hosts*. You don’t want
    any obsolete or invalid entries in the user’s personal cache to interfere with
    later key changes or revocations. Don’t just go deleting everyone’s *known_hosts*;
    they might contain verified host keys for servers you don’t control. Instead,
    on your first deployment, move each user’s personal *known_hosts* to somewhere
    like *known_hosts.personal*.'
