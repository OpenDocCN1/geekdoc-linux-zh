    # Canonical Hostnames


    On a large enough network, or in an orchestrated environment where servers are
    dynamically created and destroyed, listing all of your SSH servers quickly becomes
    unrealistic. The CanonicalizeHostname keyword tells ssh to rewrite standalone
    Host entries in ssh_config into specific domains, and then (if they exist) use
    that hostname for configuration and key management. This lets you eliminate many
    lengthy Host keywords. Set CanonicalizeHostname to yes and CanonicalDomains to
    your domain. Consider the following configuration:


    ```

    CanonicalizeHostname yes

    CanonicalDomains mwl.io

    Host *.mwl.io

    Port 2222

    ```


    The next time I run ssh gluttony, ssh checks to see if there’s a hostname gluttony.mwl.io.
    If that hostname exists, ssh evaluates ssh_config as if I’d run ssh gluttony.mwl.io.
    This connection gets the special rules that apply to hosts in the mwl.io domain.


    You can list multiple canonical domains. The canonical names are tested in the
    order they’re listed, and the first match wins. Consider an entry like this.


    ```

    CanonicalDomains mwl.io michaelwlucas.com

    ```


    When I run ssh wrath, ssh(1) searches for wrath.mwl.io. If it finds that host,
    it opens a connection. If it can’t find that host, ssh searches for wrath.michaelwlucas.com.


    If you activate hostname canonicalization, ssh defaults to trying to canonicalize
    hosts with one or fewer dots in them. This lets canonicalization catch subdomains,
    like www.detroit.mwl.io for www.detroit. To change the maximum number of dots
    in the hostname, use the CanonicalizeMaxDots keyword. Here I allow zero or fewer
    dots.


    ```

    CanonicalizeMaxDots 0

    ```


    OpenSSH has a few other hostname canonicalization features, discussed in ssh_config(5).


