    # Cache Security: Hashing known_hosts


    The known_hosts file comes in really handy to intruders who break into your desktop;
    it’s a convenient list of SSH servers to target. As your SSH servers might share
    a common sysadmin, the technique used to penetrate your desktop might work on
    any of those servers. Additionally, sysadmins and other users can view the contents
    of known_hosts. The best way to prevent snooping is to change known_hosts so that
    it no longer contains a list of hostnames. Accomplish this by hashing the hostnames,
    exactly as /etc/passwd does with passwords.


    If you replace the hostnames with hashes, nobody can read the host names from
    the file, nor can anyone reverse-compute the hostnames. When you connect to a
    host, however, ssh can easily compute the hash of the server hostname and look
    up that hash in known_hosts.


    A hashed known_hosts entry looks something like this.


    ```

    |1|PBM07JCRBJfg8qOz1BokTtCD1y0=|DVXu0IFq/dC4GMfEbFVkhptVjQ= ecdsa-sha2-nistp256
    AAAAE2VjZ...

    ```


    If you examine the entry, you’ll see the key algorithm and the host key fingerprint
    further down.


    To have ssh automatically hash new host keys added to known_hosts, use the ssh_config
    keyword HashKnownHosts.


    ```

    HashKnownHosts yes

    ```


    This will not hash existing entries, however. Use the -H flag to ssh-keygen(1)
    to hash your existing known_hosts.


    ```

    $ ssh-keygen -H

    /home/mwlucas/.ssh/known_hosts updated.

    Original contents retained as /home/mwlucas/.ssh/known_hosts.old

    WARNING: /home/mwlucas/.ssh/known_hosts.old contains unhashed entries

    Delete this file to ensure privacy of hostnames

    ```


    Hashing your known_hosts copies the existing cache to known_hosts.old, then hashes
    everything inside known_hosts. Verify that ssh can still connect to all your usual
    hosts. Once you feel confident that your key cache is still usable, delete the
    unhashed known_hosts.old.


    To find a single host entry in the hashed known_hosts file, use ssh-keygen -F
    and the target hostname.


    ```

    $ ssh-keygen -F avarice.mwl.io

    # Host avarice.mwl.io found: line 17

    |1|5hcRwDHWwxwCWrFTngG4jT40hJ0=|TyJXB6z+oEJXSP5MzakulFWgPDI= ecdsa-sha2-nistp256...

    ```


    You now know that this entry is on line 17 of the file, and can easily copy it.'
