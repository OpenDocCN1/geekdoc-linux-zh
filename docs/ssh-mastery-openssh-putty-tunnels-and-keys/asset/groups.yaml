    注意没有任何密码或密码短语的请求；你刚刚在没有人工身份验证的情况下登录到远程机器。如果你工作日需要连接多台机器，SSH 代理会让生活更轻松，并将用户密钥从一种烦恼转变为一种乐趣。


    ## OpenSSH 代理


    任何包含 OpenSSH 的类 UNIX 系统都有 SSH 代理 ssh-agent(1)。而这正是简单的事情结束的地方。


    在类 UNIX 世界中，桌面环境的多样性带来的一个烦恼是，每个环境都有自己首选的运行 ssh-agent 的方式。我们将在此处讨论其中几种，但如果这些方法在你的环境中都不适用，你需要查阅你的操作系统或窗口管理器文档。许多
    Unix 变体都有自己略微独特的桌面设置，它们会改变使用 ssh-agent 的精确方法，以适应开发人员的个人偏好和本周的 whims。


    大多数显示管理器，如 xdm 和 kdm，都有钩子可自动检查用户主目录中的 SSH 密钥。当显示管理器在登录过程中找到密钥时，它会创建一个弹出窗口请求你的密码短语。输入密码短语，显示管理器会将
    SSH 代理附加到你的桌面环境。你已准备好开始工作。


    如果你更传统，使用 startx(1) 运行桌面，请在运行 startx 之前使用 ssh-add(1) 告诉 SSH 代理你有一个密钥。


    ```

    $ ssh-add

    Enter passphrase for /home/mwl/.ssh/id_rsa:

    ```


    输入你的密码短语以将你的密钥添加到代理。


    文本控制台用户必须首先使用 shell 作为参数运行 ssh-agent(1)，然后运行 ssh-add。


    ```

    $ ssh-agent /bin/tcsh

    $ ssh-add

    ```


    从该控制台会话启动的所有 SSH 会话都使用代理运行。代理在虚拟控制台终端之间不起作用，仅适用于由 ssh-agent 运行的 shell 的子进程。另一个虚拟终端需要自己的
    SSH 代理。


    如果你有多个具有相同密码短语的密钥，ssh-add 会自动解密所有密钥。如果你有多个具有不同密码短语的密钥，ssh-add 会分别提示每个密码短语。


    使用 ssh-add -l 列出当前存储在代理中的所有私钥，并使用 ssh-add -D 从正在运行的代理中删除密钥。午餐回来后再重新添加它们。


    ## PuTTY 代理


    PuTTY SSH 代理 Pageant 为 SSH 提供了一个友好的 Windows 风格界面。通过双击启动 Pageant。Pageant 图标，一个戴着黑色宽檐帽的电脑，将出现在系统托盘中。


    右键单击 Pageant 图标。你会看到几个选项，包括 View Keys、Add Key 和 Exit。还有运行已保存或新的 PuTTY 会话的选项。选择
    *Add Key* 以调出标准的 Windows 文件浏览器。找到你的私钥并选择它。Pageant 将显示一个对话框请求你的密码短语。输入它。如果无法正确输入密码短语，Pageant
    会要求你重新输入。


    一旦 Pageant 就绪，打开一个 PuTTY 会话。连接到已安装你的公钥的机器。你应该可以在无需输入密码短语的情况下获得命令提示符。


    如果在指定私钥文件时基于密钥的身份验证有效，但使用 Pageant 时无效，请验证 PuTTY 是否配置为使用 Pageant。选择 *Connection->SSH->Auth*。在
    *Authentication Methods* 下，你会找到一个 *Attempt authentication using Pageant* 复选框。确保它已选中。


    一旦你知道 Pageant 有效，让它在登录时启动会很有帮助。找到你的账户的 Startup 文件夹（确切位置因 Windows 版本而异）。在另一个窗口中，找到你的
    Pageant 程序。它很可能位于 PuTTY 目录下的 *Programs* 或 *Program Files (x86)* 中。在启动目录中创建指向 Pageant
    的链接。


    为了获得最佳便利性，请让快捷方式在登录时加载你的私钥。你可以为 Pageant 提供密钥的完整路径作为参数，也可以设置一个 *Start in* 目录并仅使用短文件名。我建议设置
    *Start in* 目录，因为它使在登录时加载多个密钥变得更简单。右键单击你的 Pageant 快捷方式。在 *Target* 下，将你的私钥文件名作为参数添加。Target
    现在应该看起来像 `C:\Program Files\PuTTY\pageant.exe` moose.ppk。在同一屏幕上，你会看到一个 *Start in*
    字段。在那里输入你的密钥目录的完整路径。在我的笔记本电脑上，那将是 `c:\Users\mwlucas\Documents\keys`。


    要验证此操作是否有效，请退出正在运行的 Pageant 并双击启动文件夹中的新图标。你应该会被提示输入密钥的密码短语。如果不起作用，你可能在快捷方式中弄错了路径。记住，任何包含空格的路径都需要加上引号。


    ## 备份密钥文件


    如果你丢失了私钥，你的密钥对就毫无用处。一旦你知道你的密钥对可用于身份验证，请备份私钥和公钥。PuTTY .ppk 文件包含公钥和私钥，但 OpenSSH
    密钥对需要两个文件。不要只是将你的私钥复制到另一台机器——拥有你私钥的每台机器都是你的密钥可能被窃取的另一个地方。将你的私钥备份到离线介质上，例如闪存驱动器或
    CD。你也可以使用 GnuPG 之类的程序对其进行加密。（如果你不熟悉 GnuPG，我推荐这本书 *PGP & GPG: Email for the Practical*

