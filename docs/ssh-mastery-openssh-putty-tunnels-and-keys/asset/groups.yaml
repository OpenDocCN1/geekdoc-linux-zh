    query the user to see if the new keys should be accepted. This mirrors the StrictHostKeyChecking
    keyword.


    When you connect to a host with the UpdateHostKeys option set, your initial connection
    will look a little different.


    ```

    $ ssh avarice

    The authenticity of host ''avarice.mwl.io (203.0.113.209)'' can''t be established.

    ECDSA key fingerprint is SHA256:JUf1lzyEVYXhbJCfXLvPi6eLjdYCZhEBzJD8c+NGLzw.

    No matching host key fingerprint found in DNS.

    Are you sure you want to continue connecting (yes/no)? yes

    ```


    Verify the host’s public key fingerprint and accept it if correct. But then you’ll
    get another set of warnings.


    ```

    Learned new hostkey: RSA SHA256:nUNwCoJrzeHAALXyM/yGpGM7uUIPrP/ph8zV3qUx9M

    Learned new hostkey: ED25519 SHA256:nNtyIQidY3MXAEfpWZ0wzkKQFnCoQhe0CRI1dc4...

    Accept updated hostkeys? (yes/no): yes

    ```


    Your client has grabbed the public keys for this host’s RSA and ED25519 keys.
    You can only accept or reject these additional public keys en masse. It’s a very
    rare attacker that will leave the main host key untouched while subverting the
    other keys, but you really should verify them all.


    When the server adds new host keys, the client will display the fingerprints and
    give you a chance to verify them.


    ```

    $ ssh avarice

    Learned new hostkey: RSA SHA256:aDqGAPMnT6b3aYqT3DXjRoFyFHzn0MbVFWZg3yw/fTI

    Learned new hostkey: ECDSA SHA256:9eHjmXAFgRmRT2iz/WY5phLCvoo0HQ5paiLcpEcXWns

    Learned new hostkey: ED25519 SHA256:BZ5X6sIbfaSAwcQY0RjMNL9zLX1+som5TmTV/k/...

    Accept updated hostkeys? (yes/no):

    ```


    Host key updates are incompatible with connection multiplexing (the ControlPersist)
    keyword. Enabling ControlPersist disables host key updates.


    While PuTTY can grab the public key of algorithms it isn’t using for a connection
    (go to the upper left corner menu and select Special Command -> Cache New Host
    Key Type), it can’t accept multiple keys of the same type.


    When you get rid of the old host keys, your PuTTY users must re-verify host keys.


    ### Connecting to Obsolete SSH Servers


    Over the last few years, OpenSSH has deprecated a whole bunch of protocols and
    cryptographic algorithms. The blatantly insecure SSH version 1 has been extirpated
    from the source code. But whole slews of cryptographic algorithms that worked
    well in the 1990s are no longer suited to today’s Internet. OpenSSH still supports
    these types of encryption, but they’re not enabled by default. You must use special
    command-line options to use them.


    Why disable these algorithms? Awareness. You should know when an SSH connection
    uses weak crypto. If you never realize that a server or embedded device only supports
    cruddy cryptographic algorithms, you’ll never upgrade or replace it.

