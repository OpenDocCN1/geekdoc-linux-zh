  - '[PAGE 133]


    When OpenSSH fails to connect to an SSH server due to its weak crypto, it tells
    you all the information you need to manually connect. You have to understand SSH’s
    encryption characteristics, though.


    # SSH Encryption


    The SSH protocol uses cryptography in four different roles. Each role needs different
    algorithms. OpenSSH uses a keyword to set each of these in *ssh_config* or on
    the command line.


    The Key Exchange Method (KEX) is used to generate the one-time per-connection
    symmetric key. The keyword KexAlgorithms sets the key exchange methods.


    The general encryption algorithms are set with the Ciphers keyword.


    Message Authentication Codes (MAC) detect alterations in traffic. The MACs keyword
    sets them.


    The HostKeyAlgorithms lets you set algorithms for host keys.


    Finally, some public key algorithms are obsoleted. The PubkeyAcceptedKeyTypes
    keyword lets you enable obsolete key types.


    # Example Connection


    My home entertainment network connects to the Internet with an inexpensive embedded
    router. It offers SSH… sort of.


    ```

    $ ssh admin@203.0.113.1

    Unable to negotiate with 203.0.113.1 port 22: no matching host key type found.
    Their offer: ssh-dss

    ```


    The router doesn’t offer a type of host key that current OpenSSH accepts by default.
    The HostKeyAlgorithms keyword lets you re-enable supported but no longer enabled
    host key algorithms. The ssh-dss algorithm (also known as DSA) is very weak and
    abandoned in modern SSH, but as this is my home network I’ll trust it here. Use
    the HostKeyAlgorithms keyword to add it back to the options ssh supports.


    ```

    $ ssh -o HostKeyAlgorithms=+ssh-dss admin@203.0.113.1

    ssh_ssh_dispatch_run_fatal: Connection to 203.0.113.1 port 22: DH GEX group out
    of range

    ```


    What, another error? When connecting to an SSH server that only supports obsolete
    crypto, you can expect to need to set a few keywords on the command line. Figuring
    out which are the necessary settings is an iterative process.


    This error is a little more obscure. There’s no obvious keyword to choose here,
    unlike with the host key algorithm error. If you’re not familiar with Diffie-Hellman
    key exchange, your best bet is to use an Internet search engine to see if someone’s
    had the same error before. If you’re the first person in the entire world to experience
    this exact problem, run ssh in verbose mode, gather the output, and contact the
    vendor.


    This particular error turns out to be a key exchange problem, well-known'
  - '[PAGE 134]


    with this vendor. I have to reactivate an obsolete key exchange algorithm.


    ```

    $ ssh -o HostKeyAlgorithms=+ssh-dss -o KexAlgorithms=diffie-hellman-group14-sha1

    admin@203.0.113.1

    ```


    I can now connect.


    One day, OpenSSH will fully deprecate these algorithms. Upgrade your equipment
    before then. As a temporary fix, though, you can set these options in ssh_config.


    ```

    Host 203.0.113.1

    HostKeyAlgorithms +ssh-dss

    KexAlgorithms +diffie-hellman-group14-sha1

    ```


    Now that I’ve written this section, though, I can upgrade my router.


    # Escape Characters


    When you SSH into a server, your keystrokes all get passed through to the server.
    With escape characters, though, you can talk to the locally running SSH process.
    An escape character temporarily and briefly suspends your SSH session. You can
    use the escape character to interrupt a hung SSH session, add port forwarding,
    send an old-fashioned serial-style break to network gear, and more.


    The default escape character is the tilde (~). Very few Unix commands use the
    tilde, but you can hit it twice to send it once. Hitting ~~ means “yes, I really
    meant to send a tilde.” If you need to change the escape character use ssh’s -e
    argument and your desired escape character in quotes.


    Issue instructions by hitting ENTER, the escape character, and a second character.
    Disconnecting is ~., editing your port forwarding is ~c, and so on.


    # Ending Your Session


    The easiest use of the escape character is to terminate an SSH session. If the
    remote server is hung, enter tilde-period.


    ```

    wrath# ~.

    Connection to server wrath.mwl.io closed

    client$

    ```


    You’re now back on the local machine.


    # Adjusting Port Forwarding


    The escape character kind of lets you travel backwards in time, adjusting the
    command you used to connect to the host. While you can’t muck with key exchange
    algorithms and such, you can adjust port forwarding. Enter ~c to enter the command
    line, and then enter the desired port forwarding.


    Suppose I’m in the middle of an SSH session, and I want to add a dynamic port
    forward from port 9999 on my desktop out to the server. If I was opening the SSH
    session with this, I’d add the flag -D 9999 to the command line. I start by typing
    ~c, and get an ssh> prompt.


    ```

    ssh>

    ```


    This is the internal ssh(1) command prompt. Add your command line changes here.'
  - '[PAGE 135]


    ```

    ssh> -D9999

    Forwarding port.

    ```


    Going back to my client, I’ll see that ssh(1) has port 9999 open. The dynamic
    forwarding is live.


    To cancel a port forwarding, go back to the SSH command line. Use the -k flag
    and the command you used to create the port forwarding. Here I disable the dynamic
    forwarding I just created.


    ```

    ssh> -KD9999

    Canceled forwarding.

    ```


    The dynamic forward disappears.


    Escape characters have other features, but most of them aren’t useful today. If
    you’re curious, though, ~? displays a list of all available escape characters.


    There’s a lot more you can do with SSH. If you can do all of this, you’re more
    competent with SSH than almost everyone. Congratulations!'
