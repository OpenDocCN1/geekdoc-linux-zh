    ## System Administration Features


    Tell sshd(8) where to stash its process ID file with the PidFile keyword. Don’t
    do this lightly. Many management tools (foolishly) use the PID file.


    ```

    PidFile /var/run/sshd.pid

    ```


    This file is written before sshd(8) reduces its privileges, so it can be owned
    by root. If you want to disable writing a PID file, set PidFile to none.


    The sshd(8) process logs via syslogd, defaulting to the AUTH facility and the
    INFO level. Control these with the SyslogFacility and LogLevel keywords.


    ```

    SyslogFacility Auth

    LogLevel INFO

    ```


    The SyslogFacility keyword accepts any syslog facility. Check the documentation
    for syslogd(8) for a list of facilities.


    Not only does syslogd use LogLevel to determine where to send log messages, sshd(8)
    uses it to determine what to send to syslogd.


    - A LogLevel of QUIET logs nothing.

    - LogLevel FATAL logs only when sshd(8) dies.

    - The ERROR LogLevel reports only problems.

    - LogLevel INFO logs problems and when people login and logoff.

    - VERBOSE logs every detail that doesn’t violate privacy, including the fingerprints
    of public keys used to authenticate.


    The DEBUG1, DEBUG2, and DEBUG3 LogLevels send enough data to violate user privacy.
    Debug messages get sent to syslogd. Most default logging systems don’t capture
    this level of detail; you’ll need to configure yours to capture all these details.
    Also, don’t send debug data across an open network using traditional unencrypted
    syslogd.


    ## Changing Encryption Algorithms


    You might find the keywords Cipher and Mac in your configuration. They don’t appear
    in the sshd_config provided by OpenSSH, but some operating systems add them. These
    settings allow you to change the encryption methods your server supports.


    Don’t muck with these settings. You will only hurt yourself.


    Certain organizations, most commonly governments, require using only approved
    encryption algorithms. The most well-known is the United States’ FIPS standard.
    Such organizations have very specific documents mandating how to configure SSH
    to comply.


    ## How Many Unauthenticated Connections?


    OpenSSH avoids the headaches of threaded programming by starting a separate process
    to handle each incoming connection. A common denial of service attack against
    hosts running such programs is to start a whole bunch of client connections until
    the server exhausts all its resources and falls over. OpenSSH avoids this problem
    with the MaxStartups option.


    MaxStartups lets you set a number of simultaneous unauthenticated connections
    to the SSH daemon. Once this many connections are trying to authenticate, sshd
    won’t accept another connection until an existing connection fails or LoginGraceTime
    expires for an existing unauthenticated connection. A simple value like 10 protects
    the server, but doesn’t let you log in to do something to try to defend against
    an ongoing attack.


    A better choice is to use Random Early Drop (RED), a protocol long used by network
    engineers to avoid congestion. A DOS attack isn’t exactly network congestion,
    but it shares a whole bunch of characteristics with network congestion. RED works
    by setting throttling limits. Once incoming connections exceed a lower limit,
    sshd gives each subsequent incoming connection a chance of being flat-out rejected.
    The chance of rejecting a connection increases until the number of unauthenticated
    connections reaches an upper limit, where all connections are rejected. Using
    RED means that an attacker needs to throw a monstrous amount of resources at an
    SSH server to guarantee the sysadmin can’t get in. It doesn’t make the attack
    any less annoying, but it does give the sysadmin (and legit users) a chance to
    log in during the attack.


    Configure RED for sshd by specifying the lower limit, the initial chance of rejecting
    a connection, and the upper threshold. The default is 10, 30, and 100.


    ```

    MaxStartups 10:30:100

    ```


    This means that sshd accepts up to 10 unauthenticated connections simultaneously.
    The 11th simultaneous unauthenticated connection has a thirty percent chance of
    being refused. The odds of a connection being refused increase linearly until
    the upper threshold of 100, where all connections are refused.


    Using RED means that if you keep trying to connect during a DOS attack, you’ll
    eventually get a winning ticket and be admitted.


    We talk more about defending sshd in “Protecting the SSH Server” at the end of
    this chapter.


    ## Restricting Access by User or Group


    Many networked applications rely on user accounts from the underlying operating
    system. People use an application over a web page or proprietary client, but never
    actually SSH into the host. If Fred down in shipping needs access to the Enterprise
    Resource Planning system to print his shipping labels, and the ERP system requires
    an underlying user account, the host needs an account for Fred. This isn’t ideal
    practice, but it is reality. If you’re responsible for such an application, configure
    the host so that such users cannot log on to the server.


    OpenSSH supports user restrictions with the DenyUsers, AllowUsers, DenyGroups,
    and AllowGroups options. These options take comma-delimited lists of users or
    groups as arguments, and are processed in that specific order. The first match
    wins.


    A user listed in DenyUsers cannot log in via SSH, even if listed later in AllowUsers
    or AllowGroups.


    A user listed in AllowUsers can log in via SSH, unless explicitly forbidden in
    DenyUsers.


    A user that belongs to a group listed in DenyGroups cannot log in via SSH, unless
    specifically permitted to by an AllowUsers statement. This lets you make exceptions
    for a user.


    Lastly, as you might guess, a user that belongs to a group listed in AllowGroups
    can log in via SSH.


    Additionally, the presence of an AllowUsers or AllowGroups entry implies that
    nobody else can log in. The system denies SSH logins to everyone who is not explicitly
    permitted.


    These restrictions work on a first match basis. Statements are processed in order,
    and when a user matches a rule, the rule applies immediately and processing stops.


    Confused? Let’s look at some examples. My host has four users: `backup`, `mwlucas`,
    `pkdick`, and `jgballard`. They are in groups as below.


    ```

    wheel: mwlucas

    staff: mwlucas, pkdick, jgballard

    support: pkdick, mwlucas

    billing: jgballard

    ```


    While these are small groups, the principles apply to groups of any size.


    The billing application requires system accounts, but the user doesn’t need access
    via SSH. If I just want to block the user from the billing department from logging
    in via SSH, I could use DenyUsers.


    ```

    DenyUsers jgballard

    ```


    All users not listed would still have SSH access. When I add another user from
    that department, though, I must explicitly add them to DenyUsers. I’m better served
    by blocking access by group.


    ```

    DenyGroups billing

    ```


    With this one statement, I can add a user to the `billing` group and they automatically
    can’t get their money-grubbing mitts on my precious virtual terminals.


    The presence of an AllowGroups statement means that only members of that group
    can log in. On a BSD system, `wheel` is the group for system administrators. Ubuntu
    does something similar with the `admin` group, but I’m a BSD guy so you get my
    preferences. To allow only sysadmins to log in via SSH, use AllowGroups.


    ```

    AllowGroups wheel

    ```


    Anyone in the `wheel` group can log in. While I haven’t explicitly forbidden anyone
    else from logging in, the users `backup`, `pkdick` and `jgballard` are not in
    the `wheel` group, so they’re out.


    I’m the only member of the `wheel` group. I could list myself explicitly.


    ```

    AllowUsers mwlucas

    ```


    I do hope to eventually have help, though. When that day comes, I’ll have to create
    an account for my new sysadmin and add them to the AllowUsers statement on all
    of my machines. I’ll forget one or the other. Use groups whenever possible.


    The support team has access to a different host. I have one particular system
    where a certain person is forbidden to log in. Here I block that user, but permit
    the group.


    ```

    DenyUsers pkdick

    ```


    ```

    AllowGroups support

    ```


    This demonstrates “first match wins.” User `pkdick` is denied immediately, and
    that decision is final. Other users can proceed to the AllowGroups statement.
    You might use this setup on, say, a Raspberry Pi’s built-in `pi` account.


    Some applications, like properly-configured rsync, need accounts with SSH access.
    This requires a user account with public key authentication (Chapter 7, “SSH Keys”).
    These accounts can be dangerous. While you can restrict the accounts that the
