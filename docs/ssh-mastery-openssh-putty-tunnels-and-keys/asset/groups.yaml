    ```

    RemoteForward server-IP:server-port client-IP:client-port

    ```


    同样，这与命令行上的端口转发相似，但中间的冒号缺失了。这里我在配置文件中设置了相同的端口转发。


    ```

    Host sloth.mwl.io

    RemoteForward localhost:2222 localhost:22

    ```


    RemoteForward 关键字最常与 Host 语句一起出现，除非你希望对连接到的每个主机都执行远程转发。


    ## PuTTY 远程转发


    要配置远程转发，请转到 PuTTY 配置屏幕左侧，选择 Connection -> SSH -> Tunnels，如图 9-4 所示。由于我们是从服务器转发到客户端，Source
    port 字段指的是将被转发到工作站的服务器上的端口。在本例中，源端口是 2222。Destination 是 localhost:22，因为工作站的 SSH
    服务器运行在端口 22 上。³ 选择 Remote 进行远程端口转发。


    点击 Add，然后连接。端口转发应该可以工作。


    要将此转发绑定到服务器的面向网络的 IP 地址，请选择 Remote ports do the same (SSH-2 only)。这会将转发的端口绑定到
