    The OpenSSH client supports two levels of X forwarding, differentiated by security
    level. Configure both in `ssh_config`. Basic X forwarding supports only a less-insecure
    subset of the X protocol. This level of X forwarding is fairly safe. Intruders
    cannot take over your desktop or snoop your keystrokes with basic X forwarding.


