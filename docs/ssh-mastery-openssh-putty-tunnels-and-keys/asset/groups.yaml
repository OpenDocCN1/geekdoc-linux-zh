    如果你有理由怀疑服务器的密钥已被泄露，请撤销它。在你的 *known_hosts* 中找到服务器的所有主机密钥条目。在所有条目前添加字符串 @revoked。为服务器生成新的主机密钥并重启
    *sshd*，然后将新的主机密钥添加到你的 *known_hosts*。现在你可以将更新后的 *known_hosts* 分发给你的客户端，并且在（不太可能）用户尝试使用被撤销密钥的情况下，用户会收到警告。


