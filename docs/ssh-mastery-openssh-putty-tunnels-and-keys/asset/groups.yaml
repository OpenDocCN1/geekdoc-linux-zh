    我们不会介绍 DNS 基础知识。如果你考虑通过 DNS 分发密钥指纹，我就默认你知道区域文件是什么、为什么 RR 很重要，以及为什么要更新序列号。


    ## SSHFP 记录


    SSH 指纹（SSHFP）记录提供了主机的 SSH 指纹。记录看起来像这样：


    ```

    wrath IN SSHFP 1 1 07988cadf134050d458dfa5f2c062b5e68106163

    ```


    与任何标准 DNS 记录一样，第一字段给出主机名，第二字段表示这是一个 Internet 记录，而第三字段表示这是一个 SSH 指纹记录。SSH 特定细节从第四字段开始出现，该字段给出算法类型。你不必记住哪个数字对应哪个算法，但这里的
    1 表示这是一个 RSA 指纹。第五字段是用于生成此指纹的消息摘要算法。1 表示 SHA-1，而 2 表示 SHA-256。最后，第六字段是实际的密钥指纹。


    对于服务器提供的每个公钥，你需要两个 SSHFP 记录；一个用于 SHA-1，一个用于 SHA-256。


    ## 创建 SSHFP 记录


    甚至不要尝试手工创建 SSHFP 记录。ssh-keygen 程序可以读取本地服务器上的密钥文件并生成记录，使用 -r 标志即可。将主机名作为参数提供。


    ```

    $ ssh-keygen -r wrath

    wrath IN SSHFP 1 1 07988cadf134050d458dfa5f2c062b5e68106163

    wrath IN SSHFP 1 2 b7931f47398ca1ed73e8642bd029fb69dda05913058ffb096f2358c429436013

    wrath IN SSHFP 2 1 3f7319432d3ef663866a7b3996e6be113d7ea303

    wrath IN SSHFP 2 2 927b540968767879ca926da1aa80db5a0975c8d9c5c99527b3a231e878802e3e

    wrath IN SSHFP 3 1 cf61d5ed8a6535790d198af77fa0a409d4e8c7f760

    wrath IN SSHFP 3 2 4d2277f46a699d475ff095fa274a007fdf8281ad8bccb3575feb62779e257e8e

    wrath IN SSHFP 4 1 59c3ed21e086b923a4e8a49504691c844f5a1590

    wrath IN SSHFP 4 2 4e2f1c2ee4850d1bb43ffd43e16d27df99d0a3491582f51423dd7d48944f513

    ```


    将这些记录加载到你的 DNS 服务器中。


    你也可以将服务器的公钥文件复制到中央主机，并使用 -f 标志告诉 ssh-keygen 使用这些文件。


    ```

    $ ssh-keygen -r wrath -f ssh_host_ed25519_key.pub

    ```


    你必须为每个密钥文件单独运行此命令，但如果有中央自动化服务器，这种方法有很多可取之处。请记住，公钥会显示给任何可以连接到服务器 SSH 端口的人。将公钥文件复制到安全服务器通常不是安全风险。


    在我撰写本文时，一些免费 DNS 提供商，例如 Hurricane Electric，支持 SSHFP 记录。


    ## 配置客户端


    OpenSSH 客户端可能会默认使用 SSHFP 记录，具体取决于操作系统分发商是如何编译它的。使用 VerifyHostKeyDNS 关键字明确定义 ssh
    应该做什么。如果设置为 yes，客户端会完全信任 SSHFP 记录提供的密钥。如果设置为 ask，ssh 会显示密钥指纹并询问用户该怎么做。


    这处理了主机密钥。现在让我们谈谈用户身份验证密钥。


    ## 分发 authorized_keys


    只有少数几台服务器的单独系统管理员可以相当轻松地维护自己的 authorized_keys 文件。服务器增加到七八台时，到处复制 authorized_keys
    就变得相当乏味。有整个系统管理员团队，并且想在数百台服务器上禁止密码身份验证？你真的需要寻找自动化 authorized_keys 复制的方法。你可以让自动化系统在所有系统上复制身份验证密钥，或者让
    sshd 在每次登录尝试时查询网络以获取用户的 authorized_keys。两者各有其用途。


    ## 复制密钥文件


    让用户自行维护自己的密钥文件可能会导致操作问题。用户有一种令人难以置信的能力来损坏自己的文件，尤其是在他们认为自己知道自己在做什么的时候。通过拥有一个集中系统来部署
    authorized_keys，你可以在用户惹上麻烦之前进行一些基本完整性测试。你不需要复杂的密钥文件解析和验证系统，但能够说“你意识到你的密钥条目中间有换行符吗？”可以减少所有相关人员的烦恼。此外，如果用户的
    workstation 被黑客入侵，并且入侵者由此获得服务器访问权限，入侵者可以将其自己的密钥添加到用户的 authorized_keys 中并将其复制到
    known_hosts 中的所有服务器。集中化密钥管理并移除用户在不经过自动化系统情况下上传新密钥文件的能力是可取的。


    你真的不希望你的自动化系统在每个用户的 home 目录中乱搞。相反，利用 AuthorizedKeysFile sshd_config 关键字。这让你可以将用户的
    authorized_keys 文件放在任何你想要的地方。将它与 %u 标记结合使用，使 root 拥有所有用户密钥。


    ```

    AuthorizedKeysFile /etc/ssh/keys/%u

    ```


    请记住，%u 标记代表用户名。 使用此 AuthorizedKeysFile 设置，用户 mw1 的身份验证密钥将位于 /etc/ssh/keys/mw1，而用户
    djm 的密钥将位于 /etc/ssh/keys/djm。用户主目录之外的密钥文件看起来与任何其他 authorized_keys 完全一样，但它们必须由
    root 拥有。即使我们的假设入侵者渗透了一个账户，他们也无法在没有权限提升的情况下编辑密钥。


    使用操作系统支持的任何功能来保护这些文件。在 UFS 文件系统上，也许不可变标志适合你的环境。或者 NFSv4 ACL。 如果有什么东西因拒绝让你更改文件而让你烦恼，请考虑将其用于保护授权密钥文件。


    ## 查询网络获取密钥


    如果你有 LDAP 等集中式身份验证系统，你可以将用户身份验证密钥存储在该系统中。OpenSSH 可以使用 AuthorizedKeysCommand 和
    AuthorizedKeysCommandUser 关键字查询该信息源。


    ```

    AuthorizedKeysCommand /usr/scripts/getAuthorizedKeys.pl

    AuthorizedKeysCommandUser ldap

    ```


    只要你提到基于网络的身份验证，人们的脑海就会立刻想到 LDAP。LDAP 专门用于这种目录查找——它基本上是一个针对读取优化的数据库。我在这里无法详细介绍，因为不同厂商的
    LDAP 目录差异很大。无论你使用哪一个，你都需要将 SSH 密钥模式加载到你的目录中。与你的 LDAP 管理员交谈，看看他们能提供什么。所需的确切模式因目录结构而异，但通常涉及将
    sshPublicKeys 条目附加到用户账户。建立在商业 LDAP 产品之上的大型企业的 LDAP 管理员通常不愿扩展核心目录条目，因为这会限制他们获得厂商支持的能力。在我的经验中，解决这个问题所需的工作量超过了密钥分发中的任何其他部分。


    一旦你加载了模式，你就需要一个脚本从目录中获取 authorized_keys。脚本的类型与人们使用的身份验证系统的类型一样多。一个针对 Active Directory
    进行身份验证的脚本与一个针对自制 OpenLDAP 目录进行身份验证的脚本完全不同。CentOS 附带了一个用于对其 LDAP 服务器进行身份验证的脚本 ssh-ldap-helper(8)。人们已为各种目录服务解决了这个问题，并提供了他们的脚本，因此在花费接下来的十年时间调试自己的脚本之前，请务必寻找现有的解决方案。


    AuthorizedKeysCommandUser 关键字定义了将运行 AuthorizedKeysCommand 中脚本的账户。如果你不设置 AuthorizedKeysCommandUser，sshd
    将不会运行脚本。获取用户 authorized_keys 的所有尝试都将失败。我建议创建一个除了运行此脚本之外没有任何权限的用户。隔离的无特权用户是一种 ridiculously
    廉价的安全解决方案，但使用得并不够频繁。


    只是因为 LDAP 受到所有关注，不要限制自己认为 LDAP 是必需的。如果你有它，方便是的，但你可以使用任何

