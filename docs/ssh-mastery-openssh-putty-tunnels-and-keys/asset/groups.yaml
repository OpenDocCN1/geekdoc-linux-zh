  md: "\n## Installing Host Certificates\n\nOnce you have your certificates installed\
    \ on the server, configure them in *sshd_config* with the HostCertificate keyword.\
    \ As I’m easily confused, I put my HostCertificate keywords right next to the\
    \ related HostKey keywords.\n\n```\nHostKey /etc/ssh/ssh_host_rsa_key\nHostCertificate\
    \ /etc/ssh/ssh_host_rsa_key-cert.pub\n...\nHostKey /etc/ssh/ssh_host_ed25519_key\n\
    HostCertificate /etc/ssh/ssh_host_ed25519_key-cert.pub\n```\n\nRestart sshd. You\
    \ are now ready to use host certificates!\n\n## Testing Host Certificates\n\n\
    Once you configure certificates in sshd(8) and have set up your client’s */etc/ssh/ssh_known_hosts*,\
    \ you’re ready to try certificate-based host key validation.\n\nMove your *$HOME/.ssh/known_hosts*\
    \ file out of the way, or delete it if you’re really, really confident. Now SSH\
    \ into the server. You should get a logon prompt without being prompted to verify\
    \ the host key.\n\nIf the host certificate doesn’t work correctly, add a -v or\
    \ two to your `ssh` command line. Does the client see the certificate? If not,\
    \ run `sshd` in debugging mode to see if it’s loading the certificate, and if\
    \ not, why not. Does `ssh` see the certificate, but not recognize it? If so, you\
    \ fouled up your *ssh_known_hosts* entry.\n\n## Revoking Certificates\n\nCertificates\
    \ are great, until someone hacks into your server and grabs a signed keypair.\
    \ The thief could use that signed key to masquerade as the compromised host. This\
    \ is bad. Fortunately, you can use the RevokedHostKeys *ssh_config* keyword to\
    \ tell clients not to trust a public key.\n\n```\nRevokedHostKeys /etc/ssh/revoked-hosts\n\
    ```\n\nThe revoked host keys file contains a list of public keys, one per line.\
