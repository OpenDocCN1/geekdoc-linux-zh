    ## 密钥缓存


    你希望如何更新你的密钥缓存？在某些环境中，用户必须手动验证主机密钥，然后手动将它们添加到密钥缓存中。在其他环境中，自动将新密钥添加到缓存是可以接受的。最常见的是，用户希望
