    Logging into another machine just to run an X program—or any program—can be an
    annoyance. The -f option to ssh lets you run a command on another machine while
    keeping the SSH session itself backgrounded. This looks like you’re executing
    a command directly on the other host. Give the command right after the host you
    want to access. For example, if I want to run an xterm on wrath I could run:


    ```

    $ ssh -f wrath xterm

    ```


