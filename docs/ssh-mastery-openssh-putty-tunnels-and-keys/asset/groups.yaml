    注释是自由格式文本。你可以根据需要使用注释。它在自动维护的 *known_hosts* 文件中通常为空，但在集中管理中你会发现它很有用。


    ## 创建 known_hosts


    生成 *known_hosts* 的简便方法是使用 ssh-keyscan(1)。


    ```

    $ ssh-keyscan wrath > wrath.known_hosts

    ```


