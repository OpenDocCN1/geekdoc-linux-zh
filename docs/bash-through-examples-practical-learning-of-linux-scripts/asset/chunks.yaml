    # Introduction


    Welcome to "Bash by Examples: Learning by Doing," a book designed to take you
    by the hand on the exciting journey of becoming a proficient user of the `Bash`
    command line. In the computing world, understanding how to efficiently interact
    with the `Unix/Linux` shell is not only a valuable skill, but also a necessity
    for a wide range of IT professionals, from software developers to system administrators
    and data scientists.


    The philosophy driving this book is simple but powerful: "Learn by doing." Through
    a series of carefully selected practical examples and interactive exercises, this
    book seeks to equip you with the knowledge and confidence necessary to use `Bash`
    to solve real problems. It''s not just about memorizing commands and options;
    It''s about understanding the fundamental principles that will allow you to adapt
    and thrive in any command line environment.


    From basic file operations to automating complex tasks, each chapter builds on
    the previous ones, allowing you to develop your skills incrementally. Through
    repetition and practice, what may initially seem complex will become second nature.
    This practical approach ensures that, by the end of the book, you will not only
    be able to follow the examples presented, but also improvise your own solutions
    to new and unexpected problems.


    Each example in the book has been selected not only for its practical relevance,
    but also for its ability to illustrate important concepts of `Bash` and shell
    programming in general. By breaking down each example, we will explain not only
    the "how" but also the "why," providing a deep understanding of the foundation
    behind each solution.


    This book is for you if you are a student delving into the world of computing,
    an IT professional looking to expand your skills, or simply a technology enthusiast
    eager to learn how to make the most of the power of the `Bash` shell. Whatever
    your current level of experience, we invite you to dive into the examples, experiment
    with them, and most importantly, have fun in the process.


    Let''s embark on this learning adventure together, exploring the vast and powerful
    world of `Bash`, and discover how, through practice and experimentation, we can
    unlock new skills and open up new possibilities. Welcome to "Bash through Examples:
    Learning by Doing." It''s time to write, run and learn!


    # Task script


    To provide a complete example with statement and solution in a Bash script, I
    will first define a simple problem and then show you how to solve it with a Bash
    script.


    **Create a Bash script that performs the following tasks:**


    1. Check if a specific directory exists. The directory to check will be passed
    as an argument to the script.

    2. If the directory exists, the script should list all files and directories within
    it.

    3. If the directory does not exist, the script must create it.


    ## Bash Script Solution


    Next, I show you what the Bash script that solves the previous problem would look
    like:


    ```bash

    #!/bin/bash


    # Save the first argument in a variable

    directory=$1


    # Check if the directory exists

    if [ -d "$directorio" ]; then

    echo "The directory $directory already exists. Listing contents:"

    # List the contents of the directory

    ls -l $directory

    else

    echo "The directory $directory does not exist. Creating it..."

    # Create the directory

    mkdir $directory

    echo "Directory $directory created successfully."

    be

    ```


    ## How to Use the Script


    1. First, you must save the script to a file. For example, `check_directory.sh`.

    2. Next, you must give the file executable permissions with the command `chmod
    +x verify_directory.sh`.

    3. Finally, you can run the script by passing the directory name as an argument.
    For example: `./verify_directory.sh my_directory`.


    This script is a basic example that demonstrates how to handle arguments, perform
    conditionals, and execute basic commands in a Bash script. It is important to
    note that more complex use cases may require additional checks, such as checking
    if the user has permissions to create a directory.


    # Write a Bash script that finds and replaces a word in all `.txt` files within
    a given directory


    The directory and words (both the search word and the replacement word) will be
    provided as arguments to the script.


    ## Bash Script Solution


    This script will use three arguments: the directory to search for the `.txt` files,
    the word to search for, and the replacement word. It will loop through all the
    `.txt` files in the given directory, looking for the target word and replacing
    it with the replacement word.


    ```bash

    #!/bin/bash


    # Assign arguments to variables

    directory=$1

    search=$2

    replace=$3


    # Check if the directory exists

    if [ -d "$directorio" ]; then

    echo "Searching for files in $directory to replace ''$find'' with ''$replace''..."

    # Find all .txt files and perform replacement

    find $directorio -type f -name "*.txt" -print0 | while IFS= read -r -d '''' archivo;
    do

    sed -i "s/$find/$replace/g" "$file"

    echo "Replaced in: $file"

    done

    echo "Process completed."

    else

    echo "The directory $directory does not exist. Please check the path."

    be

    ```


    ## How to Use the Script


    1. Save the contents of the script to a file, for example, `replace_word.sh`.

    2. Give the file execute permissions with `chmod +x replace_word.sh`.

    3. Run the script with three arguments: the search directory, the word to search
    for, and the replacement word. For example: `./replace_word.sh ./my_directory
    wordSearch wordReplacement`.


    This script is useful for making quick changes to multiple text files, especially
    when you need to automate text editing in a project or documents. Remember to
    back up your files before performing mass replacement operations, to avoid accidental
    data loss.


