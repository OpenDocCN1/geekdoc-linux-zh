    # Create a Bash script that calculates free and used space on the file system,
    presenting the results in a user-readable format (for example, in GB) and emailing
    a summary to a system administrator.


    The script arguments will be the administrator''s email address.


    Bash Script Solution


    This script will use `df` to obtain information about disk space usage and `awk`
    to process this information, converting it into a readable format (GB). Finally,
    you will use `mail` to email this information to the system administrator.


    bash


    #!/bin/bash


    # Verify that an email address has been provided


    if [ "$#" -ne 1 ]; then


    echo "Usage: $0 email_address"


    exit 1


    be


    email_admin=$1


    # Temporary file name for the report


    report_file=$(mktemp /tmp/disk_space_report.XXXXXX)


    # Generate report


    echo "Disk space report for system $(hostname)" > $report_file


    echo "Generated on $(date)" >> $report_file


    echo "---------------------------------------------" >> $report_file


    df -h | awk ''NR>1 {print $5 " busy on partition " $1 ", with " $4 " free."}''
    >> $report_file


    # Send report by email


    if [ -s $report_file ]; then


    mail -s "Disk space report - $(date +''%Y-%m-%d %H:%M:%S'')" $email_admin < $report_file


    echo "Report sent to $email_admin."


    else


    echo "Error: Disk space report is empty."


    be


    # Clean


    rm $report_file


    How to Use the Script


    1\. Save the contents of the script to a file, for example, `disk_space_report.sh`.


    2\. Make sure the system is configured to send emails from the command line. This
    may require configuring `sendmail`, `postfix`, or any other MTA (Mail Transfer
    Agent) you prefer.


    3\. Give the script execute permissions with `chmod +x disk_space_report.sh`.


    4\. Run the script providing the system administrator''s email address as an argument.
    For example:


    bash


    ./informe_espacio_disco.sh admin@example.com'
