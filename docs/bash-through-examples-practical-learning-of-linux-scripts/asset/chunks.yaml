    # Develop a Bash script to perform incremental backups of a directory


    The script should save the backups to a specific directory and mark each backup
    with the date and time of its creation. The source and destination directories
    will be provided as arguments to the script. Additionally, the script should delete
    old backups, keeping only the 3 most recent ones.


    Bash Script Solution


    This Bash script will perform incremental backups of the specified directory,
    using `rsync` for file transfer efficiency. You will use `date` to mark each backup
    with a timestamp and `find` combined with `rm` to manage retention of only the
    3 most recent backups.


    bash


    #!/bin/bash


    # Assigning arguments to variables


    source_addr=$1


    dir_destination=$2


    # Check if the directories exist


    if [ ! -d "$dir_origen" ]; then


    echo "The source directory does not exist."


    exit 1


    be


    if [! -d "$dir_destino" ]; then


    echo "The destination directory does not exist. Creating it..."


    mkdir -p "$target_dir"


    be


    # Create a timestamp for the backup


    timestamp=$(date +"%Y-%m-%d_%H-%M-%S")


    backup_name="backup_$timestamp"


    # Make the backup


    rsync -a --link-dest=$destination_dir/ultimo $origin_dir/ $destination_dir/$backup_number/


    # Update the ''last'' symbolic link to the latest backup


    ln -nsf $destination_dir/$backup_name $destination_dir/last


    echo "Backup completed: $backup_name"


    # Clean old backups, keeping the 3 most recent ones


    (cd $destination_dir && ls -d backup_* | head -n -3 | xargs -r rm -rf)


    echo "Old backups deleted, keeping the 3 most recent ones."


    How to Use the Script


    1\. Save the script to a file, for example `backup_incremental.sh`.


    2\. Give the file executable permissions with `chmod +x backup_incremental.sh`.


    3\. Run the script passing the source directory and destination directory as arguments.
    For example:


    bash


    ./backup_incremental.sh /path/a/source_directory /path/a/destination_directory


    This script simplifies the process of making incremental backups, which is especially
    useful for data that changes frequently but does not require a full backup every
    time. The retention strategy implemented ensures that storage space is not consumed
    unnecessarily.


