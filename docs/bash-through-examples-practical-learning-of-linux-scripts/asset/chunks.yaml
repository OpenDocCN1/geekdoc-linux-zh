    \ \"${name_without_extension}.${destination_format}\"\n    echo \"已转换: $image\
    \ 到 ${name_without_extension}.${destination_format}\"\n    ((quantity++))\n  fi\n\
    done\n\necho \"总转换图像数量: $quantity\"\n```\n\n# 如何使用脚本\n\n1. 将脚本保存到文件中，例如 `convert_images.sh`。\n\
    2. 使用命令 `chmod +x convert_imagenes.sh` 给文件赋予执行权限。\n3. 运行脚本提供图像目录、源格式和目标格式。例如：\n\
    `./convertir_imagenes.sh /path/a/mis_imagenes jpeg png`\n\n此脚本是批量转换图像的有用工具，特别是在处理大量文件或需要为要求特定格式的项目准备图像时。\n\
    \n"
- fmt: "The script must allow the user to specify the target directory as an argument.\
    \ Additionally, you should include an option for the user to choose whether to\
    \ include the details of individual files in the report or just the total size\
    \ of the directories.\n\n## Bash Script Solution\n\nThis script will allow the\
    \ user to specify a directory and choose whether they want a detailed report (with\
    \ files) or just a summary of directory sizes. You will use `du` to calculate\
    \ the sizes and `sort` to sort the results.\n\n```bash\n#!/bin/bash\n\n# Verifies\
    \ that at least one argument has been supplied\nif [ $# -lt 1 ]; then\n  echo\
    \ \"Usage: $0 directory [verbose]\"\n  exit 1\nfi\n\ndirectory=$1\nmode=$2 # 'verbose'\
    \ to include individual files, anything else to just directories\n\n# Verify that\
    \ the directory exists\nif [ ! -d \"$directory\" ]; then\n  echo \"The specified\
    \ directory does not exist.\"\n  exit 1\nfi\n\n# Generate the report\nif [ \"\
    $mode\" = \"detailed\" ]; then\n  echo \"Generating detailed report for $directory\"\
    \n  du -ah \"$directory\" | sort -rh | head -n 50\nelse\n  echo \"Generating directory\
    \ report for $directory\"\n  du -sh \"$directory\"/* | sort -rh | head -n 50\n\
    fi\n\necho \"Report generated.\"\n```\n\n## How to Use the Script\n\n1. Save the\
    \ script to a file, for example, `reporte_sizes.sh`.\n2. Give execute permissions\
    \ to the file with `chmod +x report_sizes.sh`.\n3. Run the script passing the\
    \ target directory as an argument and optionally the word `detailed` to obtain\
    \ a report that includes individual files. For example:\n   - For a directory-only\
    \ report:\n     ```bash\n     ./reporte_sizes.sh /path/a/my_directory\n     ```\n\
    \   - For a detailed report including files:\n     ```bash\n     ./reporte_sizes.sh\
    \ /path/a/my_detailed directory\n     ```\n\nThis script is useful for system\
    \ administrators or users who need to monitor space usage in their directories,\
    \ allowing you to quickly identify the biggest space consumers.\n\n# Develop a\
    \ Bash script to monitor network activity on a specific interface and log any\
    \ excess data usage beyond a user-defined threshold.\n\nThe script must allow\
    \ the user to specify the network interface and data threshold (in MB) as arguments.\
    \ If data usage exceeds the threshold in a given period of time, this event must\
    \ be recorded in a log file.\n\n## Bash Script Solution\n\nThis script will use\
    \ `vnstat` to monitor network usage on the specified interface. `vnstat` is a\
    \ console tool that keeps track of network usage, so it must be installed on the\
    \ system for this script to work correctly. The script will check data usage at\
    \ regular intervals and log any excess of the threshold to a log file.\n\n```bash\n\
    #!/bin/bash\n\n# Verify that the necessary arguments have been provided\nif [\
    \ \"$#\" -ne 2 ]; then\n  echo \"Usage: $0 network_interface MB_threshold\"\n\
    \  exit 1\nfi\n\ninterface=$1\nthreshold=$($2*1024)) # Convert MB to KB to compare\
    \ with vnstat\n\n# Log file name\nlog_file=\"exceeded_network_usage.log\"\n\n\
    # Feature to check data usage and log overages\nverify_usage() {\n  # Get the\
    \ total KB received and transmitted in the current month\n  usage=$(vnstat -i\
    \ $interface --oneline | cut -d ';' -f 3,4 | tr ';' '+' | bc)\n  if [ \"$usage\"\
    \ -gt \"$threshold\" ]; then\n    # Log excess usage\n    echo \"$(date +\"%Y-%m-%d\
    \ %H:%M:%S\"): Excessive usage on $interface - ${usage}KB exceeds ${threshold}KB\
    \ threshold\" >> $log_file\n    echo \"Alert: Excessive data usage recorded.\"\
    \n  else\n    echo \"Data usage is within the set limit.\"\n  fi\n}\n\n# Monitor\
    \ network usage every 10 minutes\nwhile true; do\n  verify_usage\n  sleep 600\n\
    done\n```\n\n## How to Use the Script\n\n1. Make sure `vnstat` is installed on\
    \ your system. If it is not installed, you can install it using your distribution's\
    \ package manager, for example, `sudo apt-get install vnstat` on Debian/Ubuntu.\n\
    2. Save the script to a file, for example `monitor_red.sh`.\n3. Give the file\
    \ execute permissions with `chmod +x monitor_red.sh`.\n4. Run the script providing\
    \ the network interface and data threshold in MB as arguments. For example:\n\
    \   ```bash\n   ./monitor_red.sh eth0 500\n   ```\n\nThis script is useful for\
    \ system administrators or users interested in keeping tabs on network usage,\
    \ especially on connections with data limits or to identify unusual activity on\
    \ their networks.\n\n# Write a Bash script that generates a list of all files\
    \ modified in the last 24 hours in a specified directory and its subdirectories,\
    \ and sends this list by email to a specified user.\n\nThe directory to monitor\
    \ and the recipient's email address will be provided as arguments to the script.\n\
    \n## Bash Script Solution\n\nThis script will use `find` to identify files modified\
    \ in the last 24 hours and `mail` to email the list. Make sure the `mail` command\
    \ is configured correctly on your system to send email.\n\n```bash\n#!/bin/bash\n\
    \n# Verify that the necessary arguments have been provided\nif [ \"$#\" -ne 2\
    \ ]; then\n  echo \"Usage: $0 recipient_email directory\"\n  exit 1\nfi\n\ndirectory=$1\n\
    recipient_email=$2\n\n# Name of the temporary file where the list will be saved\n\
    temporary_file=$(mktemp /tmp/modified_files.XXXXXX)\n\n# Find files modified in\
    \ the last 24 hours\nfind $directory -type f -mtime -1 > $temporary_file\n\n#\
    \ Check if the file is not empty\nif [ -s \"$temporary_file\" ]; then\n  # Send\
    \ the list by email\n  mail -s \"Files modified in the last 24 hours\" $recipient_email\
    \ < $temporary_file\n  echo \"Email sent to $recipient_email.\"\nelse\n  echo\
    \ \"No files modified in 24 hours were found.\"\nfi\n\n# Delete the temporary\
    \ file\nrm $temporary_file\n```\n\n## How to Use the Script\n\n1. Save the script\
    \ to a file, for example `send_files.sh`.\n2. Give the file execute permissions\
    \ with `chmod +x send_files.sh`.\n3. Before running the script, make sure the\
    \ system can send emails. You may need to configure `sendmail` or `postfix` depending\
    \ on your email provider.\n4. Run the script providing the directory to monitor\
    \ and the recipient's email as arguments. For example:\n   ```bash\n   ./send_files.sh\
    \ /path/to/my_directory myemail@example.com\n   ```\n\n# Create a Bash script\
    \ that calculates free and used space on the file system, presenting the results\
    \ in a user-readable format (for example, GB) and emailing a summary to a system\
    \ administrator.\n\nThe script arguments will be the administrator's email address.\n\
    \n## Bash Script Solution\n\nThis script will use `df` to obtain information about\
    \ disk usage and `awk` to process this information, converting it into a readable\
    \ format (GB). Finally, you will use `mail` to email this to the system administrator.\n\
    \n```bash\n#!/bin/bash\n\n# Verify that an email address has been provided\nif\
    \ [ \"$#\" -ne 1 ]; then\n  echo \"Usage: $0 email_address\"\n  exit 1\nfi\n\n\
    email_admin=$1\n\n# Temporary file name for the report\nreport_file=$(mktemp /tmp/disk_space_report.XXXXXX)\n\
    \n# Generate report\necho \"Disk space report for $(hostname)\" > $report_file\n\
    echo \"Generated on $(date)\" >> $report_file\necho \"---------------------------------------------\"\
    \ >> $report_file\ndf -h | awk 'NR>1 {print $5 \" busy on partition \" $1 \",\
    \ with \" $4 free.\"}' >> $report_file\n\n# Send report by email\nif [ -s \"$report_file\"\
    \ ]; then\n  mail -s \"Disk space report - $(date +'%Y-%m-%d %H:%M:%S')\" $email_admin\
    \ < $report_file\n  echo \"Report sent to $email_admin.\"\nelse\n  echo \"Error:\
    \ Disk space report is empty.\"\nfi\n\n# Clean\nrm $report_file\n```\n\n## How\
    \ to Use the Script\n\n1. Save the contents of the script to a file, for example,\
    \ `disk_space_report.sh`.\n2. Make sure the system is configured to send emails\
    \ from the command line. This may require configuring `sendmail`, `postfix`, or\
    \ any other MTA (Mail Transfer Agent) you prefer.\n3. Give the script execute\
    \ permissions with `chmod +x disk_space_report.sh`.\n4. Run the script providing\
    \ the system administrator's email address as an argument. For example:\n   ```bash\n\
    \   ./informe_espacio_disco.sh admin@example.com\n   ```\n"
