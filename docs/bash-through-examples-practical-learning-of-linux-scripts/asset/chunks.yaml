    \n## Bash 脚本解决方案\n\n```bash\n#!/bin/bash\n\n# 验证是否提供了足够的参数\nif [ \"$#\" -ne 3\
    \ ]; then\n  echo \"用法: $0 directory source_format destination_format\"\n  exit\
    \ 1\nfi\n\ndirectory=$1\nsource_format=$2\ndestination_format=$3\n\n# 验证目录是否存在\n\
    if [ ! -d \"$directory\" ]; then\n  echo \"指定的目录不存在。\"\n  exit 1\nfi\n\n# 计数并转换图像\n\
    quantity=0\nfor image in \"$directory\"/*.$source_format; do\n  if [ -f \"$image\"\
