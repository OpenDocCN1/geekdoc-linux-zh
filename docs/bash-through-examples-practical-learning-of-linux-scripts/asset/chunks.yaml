    # Create a Bash script that automates the creation of user accounts on a Linux
    system, assigning a home directory and a default password.


    The script must take the username and default password as arguments. Additionally,
    you should check if the user already exists on the system before attempting to
    create it.


    ## Bash Script Solution


    This script will use the `useradd` command to create a new user, `passwd` to assign
    it a password, and `grep` to check if the user already exists. Make sure you run
    this script as root to have the necessary permissions to add users.


    ```bash

    #!/bin/bash


    # Verify that the username and password have been provided


    if [ "$#" -ne 2 ]; then

    echo "Usage: $0 username default_password"

    exit 1

    fi


    username=$1

    password=$2


    # Check if the user already exists


    if id "$username" &>/dev/null; then

    echo "User $username already exists on the system."

    exit 1

    else

    # Create the user with a home directory

    useradd -m "$username"

    # Assign the default password (use chpasswd to avoid password echo)

    echo "$username:$password" | chpasswd

    echo "User $username created successfully."

    fi

    ```


    ## How to Use the Script


    1. Save the contents of the script to a file, for example, `create_user.sh`.

    2. Give the file execute permissions with `chmod +x create_user.sh`.

    3. Run the script as superuser, providing the username and default password as
    arguments. For example:


    ```bash

    sudo ./create_user.sh new_user password123

    ```


    This script simplifies user management on Linux systems, allowing system administrators
    and IT automators to quickly create user accounts with default settings. It is
    especially useful in environments where you need to create multiple user accounts
    efficiently.


    # Develop a Bash script to find and remove duplicate files in a specific directory
    and its subdirectories.


    The script should compare the files based on their content (SHA-256 hash) and
    not their names. It should inform the user about any duplicate files found and
    delete the copies, leaving only one instance of each file. The target directory
    will be provided as an argument to the script.


    ## Bash Script Solution


    This script will use the `find` command to list all files in the directory and
    its subdirectories, and `sha256sum` to calculate the SHA-256 hash of each file,
    allowing duplicates to be identified by their content. Any duplicates found will
    be removed, leaving only one copy of each unique file.


    ```bash

    #!/bin/bash


    # Verify that a directory was given as an argument


    if [ $# -ne 1 ]; then

    echo "Use: $0 directory"

    exit 1

    fi


    directory=$1


    # Check if the directory exists


    if [ ! -d "$directory" ]; then

    echo "The specified directory does not exist."

    exit 1

    fi


    # Create a temporary file to save the hashes

    tempfile=$(mktemp)


    # Generate SHA-256 hashes of all files in the directory and its subdirectories

    find "$directory" -type f -exec sha256sum {} + > "$tempfile"


    # Find duplicates based on the hash, ignoring the first unique file

    duplicates=$(awk ''{print $1}'' "$tempfile" | sort | uniq -d)


    if [ -z "$duplicates" ]; then

    echo "No duplicate files found."

    rm "$tempfile"

    exit 0

    fi


    # Process each duplicate hash

    echo "$duplicates" | while read hash; do

    # Find files with the same hash

    grep "$hash" "$tempfile" | awk ''{print $2}'' | tail -n +2 | while read file;
    do

    echo "Removing duplicate file: $file"

    rm "$file"

    done

    done


    rm "$tempfile"

    echo "Process completed. Duplicate files removed."

    ```


    ## How to Use the Script


    1. Save the script to a file, for example, `remove_duplicates.sh`.

    2. Give the file executable permissions with `chmod +x remove_duplicates.sh`.

    3. Run the script providing the target directory as an argument. For example:


    ```bash

