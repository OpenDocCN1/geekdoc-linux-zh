    \ 可能需要额外的选项来选择正确的 PID。\n\n# 开发一个 Bash 脚本来对目录进行增量备份\n\n该脚本应将备份保存到特定目录，并用创建日期和时间标记每个备份。源目录和目标目录将作为参数传递给脚本。此外，脚本应该删除旧备份，只保留最近的\
    \ 3 个。\n\n## Bash 脚本解决方案\n\n此 Bash 脚本将使用 `rsync` 的文件传输效率对指定目录进行增量备份。你将使用 `date`\
    \ 用时间戳标记每个备份，并结合 `find` 和 `rm` 来管理仅保留最近的 3 个备份。\n\n```bash\n#!/bin/bash\n\n# 将参数赋值给变量\n\
