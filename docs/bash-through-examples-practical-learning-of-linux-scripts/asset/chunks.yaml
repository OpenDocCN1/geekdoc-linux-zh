    # Function to obtain and evaluate the resource usage of the process


    process_monitor() {


    # Get the PID of the process by name


    pid=$(pgrep -f $process_name)


    if [ -z "$pid" ]; then


    echo "Process not found. Make sure ''$process_name'' is running."


    exit 1


