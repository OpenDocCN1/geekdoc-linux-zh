    \    echo \"$date: $site 离线。\" | tee -a $log_file\n  fi\n}\n\n# 遍历脚本提供的所有参数\n\
    for sitio in \"$@\"; do\n  verify_site $site\ndone\n```\n\n# 如何使用脚本\n\n1. 将脚本保存到文件中，例如\
    \ `verify_sites.sh`。\n2. 使用命令 `chmod +x verify_sites.sh` 给文件赋予执行权限。\n3. 运行脚本并将网站作为参数。例如：\n\
