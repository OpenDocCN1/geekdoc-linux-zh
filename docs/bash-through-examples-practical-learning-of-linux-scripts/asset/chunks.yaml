    ```


    ## 如何使用该脚本


    1. 将脚本保存到文件中，例如 `compress_modified.sh`。

    2. 使用 `chmod +x compress_modified.sh` 给文件赋予执行权限。

    3. 提供源目录作为参数运行脚本。例如：


