  md: 'The lower half of the Detailed Setup screen is dedicated to video memory. Normally,
    a box labeled Probe is checked, meaning that you haven''t specified a value and
    XFree86 will attempt to determine how much video memory each card contains it
    starts. In some cases, this probing will fail, and you will need to re-enter xFree86Setup
    and choose a memory value.


    Depending on the card or chipset you selected, you may select other configuration
    options in the detailed setup. Some of these are self-explanatory, others aren''t.
    Generally, if you are unsure, consult the README file. If you''re still unsure,
    leave the options set at their defaults.


    # Monitor Configuration


    The XFree86Setup Monitor configuration section is shown in Figure 2.6. Notice
    that there are no monitors listed by make and model, but only a small list of
    archetypal monitor groups. Believe it or not, nearly all monitors in existence
    will be supported well by one of the monitor types in the list.


    ![](img/edb2a4591eafaad74c22be9075f4b815_54_0.png)


    **Figure 2.6** The Monitor configuration section lists only a small number of
    standard monitor types rather than a large list by make and model.


    You will again need to refer to the research you conducted earlier about the hardware
    details of your monitor. Try to choose a monitor that closely matches the capabilities
    of your own monitor without exceeding your monitor''s numbers.


    If you''re not sure about your monitor''s exact capabilities, try to choose based
    on the most conservative refresh rate for the resolution you know your monitor
    can support. For example, if you know that your monitor can support 800×600 operation,
    but you don''t know what the maximum refresh rate is, choose the monitor in the
    list that supports 800×600 at the lowest refresh rate.'
