    # Advanced Configuration


    Even under the best of circumstances, the automated configuration tools are sometimes
    inadequate for the job they are at. Most users will find themselves heading for
    Emacs and the /etc/X86config at one time or another while using Linux. Because
    it''s extremely rare to find anyone willing to build an /etc/X86Config by hand
    anymore, this section makes the assumption that direct editing will be done on
    a file that has already been generated using another method, either XF6Setup or
    x86config.'
