    \ | text | Apply driver-specific options, as found in the Device section earlier,\
    \ apply them only on this screen, at the depth specified in this subsection |\n\
    | Black | n n n | Specify the red, green, and blue values for the black color\
    \ when using the monochrome server |\n| White | n n n | Specify the red, green,\
    \ and blue values for the white color when using the monochrome server |\n\n#\
    \ Using Framebuffer Consoles and Servers\n\nUntil recently, the only way to use\
    \ XFree86 with a PC was with one of the Accel servers or the SVGA server. If your\
    \ video card wasn't explicitly supported by XFree86, you were out of luck. With\
    \ kernel version 2.2, however, Linux implemented a kernel-based framebuffer device,\
    \ unlike the console framebuffer devices available on 68K Linux machines or PowerPC\
    \ machines.\n\nInstead of using a card-specific driver within XFree86, the new\
    \ VESA framebuffer enables the user to have the Linux kernel drive a VESA 2.0\
    \ compliant video card using generic VESA modes. The XFree86 framebuffer server\
    \ can then run on the graphics console provided by the Linux kernel, instantly\
    \ supporting many cards that aren't supported by XFree86 directly, including cards\
    \ like the 3DFX Voodoo Banshee cards and newer 3D trident cards. Most PCI video\
    \ cards are VESA 2.0 compliant, and nearly all AGP video cards are."
