  md: '# Table 7.4 Display and Output Configuration with xset


    | Command Line | Configuration Change |

    |---|---|

    | xset b on | Enables the terminal bell. |

    | xset b off | Disables the terminal bell. |

    | xset b n | Sets the terminal bell volume to n, a number from 0 to 100. |

    | xset b n1 n2 n3 | Sets the terminal bell volume to n1, a number from 0 to 100,
    the terminal bell pitch to n2 in hertz, and the duration of the sound to n3 in
    thousands of a second. |


    xset +dpms Enables display power management on systems with compatible hardware.

    xset -dpms Disables display power management.

    xset dpms force standby Forces the display into standby mode.

    xset dpms force suspend Forces the display into suspend mode.

    xset dpms force off Switches the display off.

    xset dpms n1 n2 n3 Sets the delay, in minutes, before the display enters (n1)
    mode or suspend (n2) mode, or switches itself off (n3). Setting of n1, n2, or
    n3 to zero disables the related function.

    xset p n color Sets the color for colormap entry n to the color specification
    given by color. More information on colormaps and color specification can be found
    in “Fonts and Colors,” later in this chapter.


    xset s on Enables the X server''s built-in screen saver/blanker.

    xset s off Disables the X server''s built-in screen saver/blanker.

    xset s blank Specifies that the X server should “blank” screens when screen saving
    occurs.

    xset s noblank Specifies that the X server should display a changing pattern when
    screen saving occurs.

    xset s n1 n2 Specifies that the X server should begin screen saving after n1 seconds
    without user activity and the pattern on the display should be changed every n2
    seconds.


    A complete list of the settings managed by xset and their current values can be
    obtained on stdout by supplying the q option to xset on the command line:


    ```

    xset q

    ```


    All configuration changes made by xset will be lost when the session ends or the
    X server exits. To make changes permanent, the user must add calls to xset to
    ${HOME}/.xinitrc or a similar session-start script.'
