  md: "# Chapter 2 Installing and Configuring XFree86\n\nHere we some degree of user-friendliness\
    \ re-enters the picture. XF86Setup and xf86config create a large number of modelines\
    \ automatically that roughly match the standard modes users know about. To illustrate,\
    \ here is an excerpt from a newly generated XF86Config's Monitor section:\n\n\
    ```\n# 640x480 @ 100 Hz, 53.01 kHz hsync\nModeline \"640x480\" 45.8 640 672 768\
    \ 864 480 488\n  - 494 530 Hsync Vsync\n# 1152x864 @ 60 Hz, 53.5 kHz hsync\nModeline\
    \ \"1152x864\" 89.9 1152 1216 1472 1680 864 868\n  - 876 892 Hsync -Vsync\n# 800x600\
    \ @ 85 Hz, 55.84 hsync\nModeline \"800x600\" 60.7 800 864 928 1028 600 616\n \
    \ - 627 657 Hsync Vsync\n# 1024x768 @ 70 Hz, 56.5 kHz hsync\nModeline \"1024x768\"\
    \ 75 1024 1048 1184 1328 768 771\n  - 777 806 hsync -vsync\n# 1280x1024 @ 87 Hz\
    \ interlaced, 51 kHz hsync\nModeline \"1280x1024\" 80 1280 1296 1512 1568 1024\
    \ 1025\n  - 1037 1165 Interlace\n```\n\nDissecting the first mode line above,\
    \ the mode is called 640×480 and uses a video card of 45.8 megahertz. The horizontal\
    \ line, scan start, scan end, and total values are 640, 672, 768, and 864, respectively.\
    \ The corresponding vertical values are 480, 488, 494, and 530. Both horizontal\
    \ and vertical signals are set to negative polarity. Unfortunately, this mode\
    \ line is also labeled with a comment, and we can see that it is a 640×480 resolution\
    \ at a 100Hz refresh rate.\n\nChances are your monitor won't support all the modes\
    \ generated by XFree86/xf86config. If you've correctly verified your monitor's\
    \ horizontal sync and vertical refresh capabilities using the HorizSync and VertRefresh\
    \ options XFree86 will automatically pick the generated list of modes for you,\
    \ disabling those your monitor won't support, and enabling the highest refresh\
    \ rate supported by your monitor for each mode.\n\nIf you need to alter the list\
    \ of available modes yourself, you can comment out the unwanted modes by inserting\
    \ a hash (#) character at the beginning of each line. Inserting your own modes\
    \ can be a rewarding process because it often allows a monitor to display little\
    \ more than it otherwise could, for example, at 850×650 rather than 800×600. On\
    \ the other hand, you can easily blow your monitor trying to create your own modes.\
    \ Because it is dangerous and at the same time difficult to construct a standard\
    \ mode, we're not going to discuss how to do it here. There is, however, a How-To\
    \ for those who are so inclined. “The XFree86 Video Timings-How-To” by Eric S.\
    \ Raymond can be found with the rest of the Linux Documentation Project How-To\
    \ documents at http://metalab.unc.edu/LDP/HOWTO."
