  md: 'If you mouse already working with XF86Setup, you might not need to do anything
    at all, though you should pay attention to Emulate3Buttons option. If you''re
    not sure whether your mouse is moving, try it around. The pointer mouse should
    expect it to and should not suffer from movement glitches or suddenly get stuck
    in a single location. When you click your mouse buttons, the corresponding buttons
    in the mouse image on the screen should light up in response.


    If your mouse is not already working with XF86Setup, you''re going to need to
    use the keyboard to navigate this section. The first step is to select a protocol
    that matches your mouse. There is a long list of protocols represented in the
    buttons across the top of the section. Nearly all users will find that they are
    well served by the Microsoft or PS2 protocols. Users whose PS/2 mice have extended
    enhanced capabilities (such as scroll wheels) might need to choose an extended
    protocol from the third row whose name matches the name of your pointing device.


    The next step is to enter your device node into the device box or to choose your
    device node from the list below. For most users, the /dev/mouse will yield best
    results. If /dev/mouse is not available, serial users will find that their mouse
    resides either at /dev/ttyS0 (COM1) or /dev/tty1 (COM2). For list of other Linux
    mouse types, refer to Table 2.1.


    If you''re not sure about your protocol or mouse hotkey, XF86setup makes it easy
    to try several different combinations. Each time you''ve selected a new combination
    using your keyboard, press A key to apply your changes, and XF86setup will try
    to activate your mouse. If the mouse still fails to work, you probably need to
    try another combination.


    A few extras options help to further refine mouse operations inside XFree86. You
    might need to use one or all of them.


    The Emulate3Buttons toggle will be the most common. If your mouse has only two
    buttons, toggling this option is advisable because it will give you three-button
    capability. To use the third button on a mouse with this option set, simply click
    both buttons at the same time.


    The ChordMiddle toggle is also common among users of three-button serial mice.
    If you find that your left and right buttons appear to work, your middle button
    doesn''t light up the middle mouse button on the display, you by setting ChordMiddle
    to see if it will activate your middle button.


    If you are unable to get your serial mouse to work properly, you might need to
    adjust the baud rate or the ClearDTR or ClearRTS flags, which affect the serial
    port to which your mouse is connected. In most cases, the baud rate should be
    set to 1200 and both ClearDTR and ClearRTS should not be set, but some mice require
    these options to be changed.'
