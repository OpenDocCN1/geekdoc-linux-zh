- img_proc: true
  md: '# Chapter 7 Runtime Server Configuration


    # # Adding TrueType Fonts to X


    Although there is an ample supply of PostScript fonts around the Internet and
    on cheap department store bulk CD-ROMs, many of the most popular fonts available
    today are for the Windows platform and, as such, aren''t PostScript fonts, but
    TrueType fonts instead, ending with .ttf extension.


    The XFree86 servers don''t yet include native support for TrueType fonts, though
    built-in TrueType support is scheduled to appear with the upcoming XFree86 4.0
    release. However, this lack doesn''t have to stop current or future XFree86 3.x
    servers from using TrueType fonts; the method for installing them is simply a
    little different.


    # ## xfst: X Server for TrueType


    The trick to using TrueType fonts with XFree86 3.x is the xfst font server, a
    third-party font server that is designed to operate the normal X font server,
    but to include support for TrueType fonts at the same time. The xfst server can
    be downloaded from http://metalab.unc.edu/pub/Linux/X11/xfst/x-0.9.10.tgz. Before
    downloading xfst, check to see whether your distribution CD includes a package
    by name. If so, you''re ready to proceed with the next step. If not, you''ll need
    to install xfst by hand.


    After xfst has been downloaded, installation is fairly straightforward and proceeds
    in the same way as any other package compiled and installed from source. The steps
    are to use first to extract the package, then to switch to the newly created directory
    and to make the binary:


    ```

    tar -xzf Xfst-0.9.10.tgz

    cd xfst@0910

    make && make install

    ```


    After a great deal of compilation fanfare, you should find that everything completes
    normally and a new binary, xfst, has appeared in /usr/X11R6/. If you need to install
    the path, edit the makefile to reflect your own preferences. The xfst.cpp file
    can also be edited if you need to alter some of the paths we''ll discuss in a
    moment, but such changes aren''t usually necessary and are generally ill-advised.


    # ## Installing the Fonts


    After the xfst binary has been installed, create a directory /usr/ttfonts to hold
    the TrueType fonts and extract all your .ttf files. The /usr/ttfonts directory
    is hard-coded into the xfst source as a default, if you want to change it, you''ll
    have to use the --dir option when using xfst.'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# Fonts and Colors 173


    It is common for Linux users to have multiboot systems containing Windows on the
    other partition. In such cases, it is often desirable to copy all the .ttf files
    from the windows/ and windows/system/ directories of the Windows partition into
    the /usr/ttf directory so that the traditional Windows fonts are also available
    from inside XFree, a boon browsing Web pages that specify Windows fonts explicitly.


    After the .ttf files have been copied to /usr/ttf, it is necessary to synchronize
    the xfst font cache, with the --sync option:


    ```

    xfsst --sync

    ```


    After working for a moment, xfstt should complete without errors, having updated
    its cache to reflect the locations of your newly installed fonts.


    # Starting the Font Server and Adding the Path


    After all else has been done, start the new server from an xterm window or other
    command line to test it:


    ```

    xfsst &

    ```


    This will start xfstt in the background and leave it running to answer font requests
    for the True fonts it manages. Now that the server is active, it is necessary
    to edit the font path to reflect the changes. This is done via the following command:


    ```

    xset fp+ unix::7100

    ```


    This command instructs xset to query the font server at port 7100 on the local
    UNIX domain for fonts. After the command has been run, the new TrueType fonts
    should appear when xlsfonts is run. Note that the X Logical Font Descriptor for
    TrueType fonts shows a foundry of ttf so the new fonts can be gripped out of an
    xlsfonts listing like this:


    ```

    xlsfonts | grep ''ttf.*''

    ```


    It is also interesting to note that the xfstt server adds several shorter font
    aliases to the list that look like garbage of some sort in the xlsfonts listing,
    but can be safely ignored.


    In some cases, it might be necessary to start xfstt with an extra argument to
    avoid clashes with local configuration. A list of the command-line arguments understood
    by xfstt can be found in Table 7.8.'
  merge: -1
  pgno: 188
- img_proc: true
  md: '# Chapter 7 Runtime Server Configuration


    Table 7.8 Command-Line Arguments Accepted by xfstt

    | Argument | Description |

    | --- | --- |

    | --sync | Synchronize xfstt with the fonts installed in /usr/ttfonts. Note that
    this should not be done while xfstt is running. |

    | --glist | When supplied before the --sync option, causes xfstt to output a font
    list suitable for GhostScript printing as the fonts are synchronized. |

    | --encoding | Remap the fonts to an encoding rather than iso8859-1. Normally,
    this should be done only by non-US users in special circumstances. |

    | --port n | Start the server on port n rather than the default of 7100, usually
    because another font server is already running. |

    | --dir path | Operate on the directory given by path rather than the default
    of /usr/ttfonts. |

    | --res n | Force the fonts to a specific resolution in dots-per-inch. The default
    is 72. |

    | --unwrap | Allow multibyte Unicode characters. This option should not be used
    on standard X servers, but only on patched for international multibyte operation.
    |

    | --once | Exit after the first font connects. |

    | --inetd | Necessary when xfstt will be used as a service by inetd rather than
    in standalone fashion.


    Note that this list can be duplicated by supplying the standard --help option
    on the command line when calling xfstt.


    # Making TrueType Fonts Permanent


    It is definitely difficult to have start xfstt each time you start X and then
    to add to its path manually using xset. Luckily, it is quite easy to add the TrueType
    font path to your server''s XF86Config. Edit the XF86Config file with an editor
    such as vi or emacs, adding a FontPath entry to the Linux of the file:


    ```

    FontPath "unix:/7100"

    ```


    Take care to add the FontPath entry after all the others unless you are sure that
    you want these fonts to take precedence because the list of FontPath entries is
    order-important.


    Making sure that the xfstt server itself gets started each time X is a little
    complicated; a call to xfstt could theoretically be added to a user''s login or
    perhaps even to xinitrc (though this could require that xset be used each time
    to set a font path), which leads to the undesirable consequence on multiuser systems
    of multiple instances of xfstt running anytime multiple X sessions are being hosted.'
  merge: -1
  pgno: 189
