  md: '# The fwm Window Manager 213


    When multiple modifiers are specified, they must all be active for the click to
    be valid. Note that a numeric digit or digits can also be used to represent the
    standard X modifier maps from 1–5. For more information on X modifiers, see Chapter
    7.


    The Function supplied to the mouse key can be any valid function, such as those
    listed earlier, or any function you defined yourself (as we''ll discuss momentarily).
    For example, if you''ve built a pop-up menu called RootMenu and would like it
    to be displayed whenever any mouse button is clicked over any part of the root
    window, the following binding would be:


    ```

    Mouse @ R A *RootMenu*

    ```


    If you''ve defined a menu called Operations that should appear whenever the window
    button at the extreme upper of a window is right-clicked, you''d use this binding:


    ```

    Mouse 3 1 A *Operations*

    ```


    Some seemingly very complex operations are possible. For example, this pair of
    lines will cause the mouse''s scroll wheel to circulate up or down through the
    list of active windows, effectively allowing the user to choose an active window
    by scrolling through available windows:


    ```

    Mouse 4 A A *CirculateUp*

    Mouse 5 A A *CirculateDown*

    ```


    The following is also valid:


    ```

    Mouse 123 TSF CSM Destroy

    ```


    This line will cause the window in question to be destroyed if any of the first
    three buttons are clicked on either the title bar or any part of a window border,
    given that the Ctrl, Shift, Alt keys are all being held down at the time.


    # Keyboard Bindings


    Keystroke bindings in fwm look very much like Mouse bindings. The relevant keyword
    for binding keystrokes is Key, and it should be used as follows:


    Key Keysym Context Modifiers Function


    Keysym should be a symbol from the include/X11/keysymdef.h file off the main /usr/X11
    directory. The key symbols that are bound to functions by most users are the symbols
    F1–F12, which generally represent the keyboard function keys.'
