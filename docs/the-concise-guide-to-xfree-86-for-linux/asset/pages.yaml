    the list of available fonts, instead of simply listing them. This can help to
    generate more accurate listings |

    |-fn pattern | Lists only fonts that match the supplied pattern. The pattern can
    use wildcard characters. For example, *bold* would list all font names that contain
    the word bold. Remember to escape wildcard characters so that they are not interpreted
    by the shell. |


