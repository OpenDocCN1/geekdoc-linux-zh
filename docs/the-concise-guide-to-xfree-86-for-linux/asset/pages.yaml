  md: '# 5


    # # LINUX/X TOOLKIT


    # PARTICULARS


    Any normal Linux user has run many different X applications in addition to those
    discussed in Chapter 4, “Standard XFree86 Programs and Utilities.” You might have
    noticed that most X applications don''t actually look all much like those discussed
    in Chapter 4. This is because most X applications, including many of those covered
    in the last chapter, are not written using a single, basic X API or the Xlib directly—they
    aren''t designed for. Instead, they are written using higher-level programming
    toolkits that include complete sets of widgets such as text boxes, drop-down menus,
    buttons, and scrollbars.


    In X, any number of these widget toolkits can be used when creating an application.
    This is unlike some operating systems like Windows or the Mac, in which a single
    toolkit forms the basis for nearly all applications. Unfortunately, this also
    means that in X, as many new Linux users have discovered, there can be a large
    amount of variation between the look and feel of each application. Worse, different
    applications’ widgets might behave very differently, so it is important to be
    familiar with each toolkit.


    # ## Free and Linux-Era Toolkits


    Although some classic commercial UNIX widgets have been used in UNIX desktops
    for years, most of them are not popular among Linux programmers, either because
    they''re too old and unsupported or because they aren''t opensource products.'
  merge: -1
  pgno: 140
- img_proc: true
  md: '# Xt/Xaw


    Among Linux users, the most popular toolkits tend to be the Athena widget set,
    which forms the basis for XFree8 utilities, and several other toolkits that were
    written after the advent of the Linux kernel, several of which are open-source
    programs using similar (or identical) licenses to the GNU General Public License,
    which is used by Linux.


    The Xt library (X Toolkit intrinsics) and the Xaw library (X Athena Widgets) are
    the basic toolkits for X programming, and the only higher-level toolkits included
    with the standard XFree86 distribution. They are both written in C and are designed
    to help X programmers avoid the lower-level Xlib library.


    The Xt is the lowest level at which most X programmers ever operate; (other than
    those writing window managers) ever take the time to make direct Xlib calls or
    to learn the ins and outs of Xlib directly. Instead, most programmers who work
    with the X libraries will either subclass objects of Xt, modifying and extending
    them to suit the application''s purposes, or use the widgets in the Athena widget
    set, which includes several prebuilt widgets that are subclasses of xt objects.


    Most of the basic X utilities are based on the Athena widget set, and that''s
    where the Xaw creators intended the reach of Xaw to end. Instead, many programmers
    have used the rather bare, unfriendly, and ugly Athena widgets in their applications
    as well. Programs that use the Athena widgets are easy to identify if they are
    dynamically linked through the ldd command:


    ```

    $ ldd /usr/X11R/bin/xnm

    libXaw.so => /usr/X11R/lib/libXaw.so (0x0000a000)

    libXmu.so => /usr/X11R/lib/libXmu.so (0x00005d00)

    libXbt.so => /usr/X11R/lib/libXbt.so (0x0006f000)

    libXSM.so => /usr/X11R/lib/libXSM.so (0x0002b000)

    libICE.so => /usr/X11R/lib/libICE.so (0x0004b000)

    libXExt.so => /usr/X11R/lib/libXExt.so (0x0000d000)

    libX11.so => /usr/X11R/lib/libX11.so (0x0040d000)

    libc.so => /lib/libc.so (0x0407bd000)

    ```


    The presence of the libXaw and libXt libraries indicates that this application
    is linked to the Toolkit intrinsics and the X Athena widgets library. Even when
    an application is statically linked, the Athena widgets are easy to identify.
    The AXe editor, shown in Figure 5.1, is one such application. Table 5.1 lists
    some general information about the Athena widgets, and Table 5.2 lists some of
    the peculiarities.'
  merge: -1
