    # Finding a Symbol in keysymdef.h


    After you''ve learned the keycode for the key you''d like to modify, you must
    find the X keyboard function you''d like to match the key in question. A list
    of X keyboard functions can be found in the file include/X11/keysymdef.h off the
    main XFree8 directory.


    Browsing this file reveals a long list of names beginning with xx_ and followed
    by a hexadecimal number. The names might seem cryptic at first but are usually
    easy to decipher. For example, xx_Return refers to the Enter symbol, xx_Backspace
    to the Backspace symbol, XK_Page_Up and XK_Page_Down to the Page Up and Page Down
    symbols, respectively. Search through the list and find the symbol you''d like
    to attach to the key in question.'
