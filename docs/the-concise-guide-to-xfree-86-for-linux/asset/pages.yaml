  md: '# 216 Chapter 9 Runtime Environment Configuration


    # Buttons


    +   1 3 5 7 9 <Window Title> 0 8 6 4 2


    In default fwwm configurations only buttons 1, 4, and 2 are visible because only
    buttons 1, 4, and 2 have mouse clicks bound to them. Other buttons can be visible
    and functional simply by binding mouse clicks to as we''ve already seen how to.


    Of course, it is also very nice to be able to indicate just what a button does,
    and to that, fwwm provides a mechanism for altering the appearance of a button
    via the ButtonStyle keyword, which should be used like this:


    ```

    ButtonStyle : n1 n2 Point Point ...

    ```


    This format is slightly confusing at first but is quite powerful and simple in
    its elegance. It is helpful to think of the format as a logical connect-the-dots
    game. The first value, n1, is the number of the button whose appearance is be
    modified. The next value, n2, is the number of points in the connect-the-dot pattern,
    one to close the pattern. Then, the segment should be exactly n2 points supplied
    in the following format (omit the spaces):


    ```

    X x Y @ n

    ```


    The number x is the horizontal position of the point inside the button, as a percent
    of the whole. The number γ represents the same idea vertically. For a example
    of 50x50 is exactly in the center of the button. If n is 0, the line segment will
    be drawn in shadow; for example, a downward-pointing triangle with three-dimensional
    height to the nearest button position 2 is given by


    ```

    ButtonStyle : 0 17 20x201 30x201 50x401 70x201 80x201 \

    80x300 60x500 80x701 80x8000 70x8000 \

    50x600 30x800 20x8000 20x7000 50x4501 \

    20x3000 20x201

    ```


    Using buttons such as these and binding buttons to mouse clicks, it is possible
    to create complex, extremely functional title decorations for your windows.'
