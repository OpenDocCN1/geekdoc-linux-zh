    # fwm 1 Mouse and Keyboard Bindings


    Now we''ve seen how to construct a menu, and we''ve seen a rather sizable list
    of common functions, but we haven''t explained how the menu will be displayed
    or how to call a function outside a mouse. Both of these tasks are accomplished
    by binding a function or menu to a particular keystroke or mouse click.


    # Mouse Bindings


    Two keywords in fwm bind as seen in the last section to a particular action by
    the keyboard or mouse. The first of these keywords, Mouse, binds a specific type
    and location of mouse click to a function or menu, causing the function to be
    executed or the menu to display when the given mouse click is registered. The
    Mouse keyword follows the following basic format:


    Mouse Button Context Modifiers


    The number given by Button refers to the mouse button to which this binding applies.
    Valid button numbers are shown in Table 9.8.


    ### Table 9.8 Valid Button Numbers for the Mouse Keyword

    | Button | Description |

    | --- | --- |

    | 0 | This binding applies to a click by any mouse button. |

    | 1 | This binding applies to a click by button 1, normally the left mouse button.
    |

    | 2 | This binding applies to a click by button 2, normally the middle mouse button.
    |

    | 3 | This binding applies to a click by button 3, normally the right mouse button.
    |

    | 4 | This binding applies to a click by button 4, normally owned by the scroll
    wheel''s direction on scroll-enabled mode. |

    | 5 | This binding applies to a click by button 5, normally owned by the scroll
    wheel''s direction on scroll-enabled mode. |


    Note that these buttons themselves and their physical positions on the mouse can
    be altered using xmodmap as detailed in Chapter 7, "Runtime Server Configuration."'
