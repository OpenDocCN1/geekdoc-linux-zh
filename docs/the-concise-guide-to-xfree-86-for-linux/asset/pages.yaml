- img_proc: true
  md: 'Unfortunately, this will leave a stopped process after xterm exits on pokey,
    because rsh will be waiting for a line of input. To solve this problem on Linux
    machines, you could use either the rsh or a redirection from /dev/null:


    ```

    rsh -n pokey xterm -display foobar:& &

    rsh pokey netscape -display foobar: < /dev/null &

    rsh pokey xclock -display foobar: < /dev/null &

    ```


    These commands will all behave more or less as background processes should behave,
    and will display on foobar:even though they are running on pokey.


    # Starting Local Clients on Remote Displays


    The process of starting local clients and displaying them remotely is somewhat
    simpler and discussed in a roundabout way at the beginning of the chapter, but
    it bears repeating in a new context.


    If you need to start several local clients and display all on a remote host, it
    might be helpful to start a shell, set the DISPLAY environment variable to the
    target system, and then call the clients just as you normally would:


    ```

    $ export DISPLAY=pokey:

    $ xterm &

    [4] 17438

    $ xclock &

    [5] 17439

    $ netscape &

    [6] 17441

    $

    ```


    All the clients started are now displaying on pokey:0, even though they are locally
    on foobar. If you plan to start only one client, or if you need to display on
    multiple remote hosts, the -display argument might be more practical:


    ```

    xterm -display pokey:0 &

    ```


    The -display argument won''t work on all clients, however, so it can at times
    be necessary to start certain clients after setting the DISPLAY environment variable.


    # Querying a Session Across the Network


    The preceding two sections have assumed that X servers were already running on
    both pokey and foobar and that you were logged in on both machines. But what if
    you simply want to sit at foobar but execute all your clients on pokey? In this
    case, foobar is really acting merely as a terminal, displaying X primitives and
    accepting input. To start an xdm login at foobar that runs on pokey, start the
    X server with the -query option on foobar, like this:


    ```

    X -query pokey

    ```'
