    # The Pointer Section


    The Pointer section contains options that have to do with mice or other pointing
    devices. This is where the protocol, device node, and other parameters are given.
    A simplified Pointer section looks like this:


    ```

    Section "Pointer"

    Protocol "Microsoft"

    Device "/dev/mouse"

    BaudRate 1200

    Emulate3Buttons

    EndSection

    ```


