  md: '# 346 Chapter 16 Tunneling Through ssh (Secure Shell)


    # Table 16.2 Common Keywords Known to ssh


    | Keyword | Description |

    | --- | --- |

    | Cipher type | Specifies the type of cipher to use for encrypting data over the
    connection. Valid methods are idea, des, 3des, blowfish, arcfour, or none for
    encryption by default. The default is to use idea, and it should be noted that
    not all methods are available on all systems. |

    | Compression yes|no | Specifies whether compression should be used by default.
    |

    | CompressionLevel n | Specifies that ssh should use gzip connection to compress
    the data stream. Compression level 1 is the least processor-intensive method but
    results in the lowest compressibility. Compression level 9 results in better compression
    but is more host-intensive. |

    | ConnectionAttempts n | Specifies the maximum level of connection attempts, n,
    before ssh either fail back to rsh (see next keyword) or give up. |

    | FallBackToRsh yes|no | Specifies if ssh is unable to connect to the remote host
    after the number of attempts specified by ConnectionAttempts, rsh will be used
    as a fallback mechanism. |

    | ForwardX11 yes|no | When yes, specifies that X11 connections will automatically
    be redirected over the encrypted link using ssh''s proxy server capability. |

    | NumberAndPassword n | Specifies that ssh should try to authenticate the user
    up to n (not more than 5) times before giving up. |

    | PasswordPrompt yes|no | Specifies whether to display the remote host name when
    prompting for a password. |

    | PasswordLogin yes|no | Specifies whether to display the username when prompting
    for password. |

    | Port n | Specifies that ssh should attempt to connect to n on the remote machine
    by default. The default value is port 22. |

    | XauthLocation path | Specifies the path to the xauth program binary.|


    Note although the global ssh configuration is stored on each system at /etc/ssh_config,
    each user can have a personalized ssh configuration file of the same format that
    will override any global settings. This file is found at $HOME/.ssh_config. For
    complete details on the keywords supported by ssh, please refer to the ssh manual
    page.'
