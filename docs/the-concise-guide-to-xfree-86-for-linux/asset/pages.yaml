    # Other XFree86 Servers or Extensions


    Xfsrv.tgz


    This package contains the X font server, which allows X clients to display fonts
    that aren''t hosted on their own machine. The X font server serves fonts to clients
    across the network, which in turn display these fonts on X servers.


    Install Subtrees: bin/, lib/, man/


    Install Priority: When needed


    Xnest.tgz


    This package contains the nested X server, which is an X server that runs as a
    client on another X server. This allows a virtual X display within an X display;
    the physical X display has its clients, among them the nested server, and the
    nested server, as a full-fledged X server, also has its own clients, independent
    of those connected to the host server.


    Install Subtrees: bin/


    Install Priority: When needed


    Xprt.tgz


    This package contains the X print server, which is an X server that supports output
    to printer devices using the core X drawing requests. The server adds requests
    for job control and page control over the X protocol and also adds extensions
    for communicating the attributes and capabilities of the printing device in question.


    Install Subtree: bin/


    Install Priority: When needed'
