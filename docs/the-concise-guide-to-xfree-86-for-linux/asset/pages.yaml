  md: '# Configuring XFree86


    # Selecting a Clock Chip


    After you''ve selected your ramdac or el entry in XFree86 try to detect it at
    launch time, you''re asked to select a clock chip for your video card from a similar
    list:


    +   1 Chronel 8391 ch8391

    2 ICD2061a and compatible (ICS9161A, DCS2824) icd2061a

    3 ICS2595 ics2595

    4 ICS5342 (similar to SDAC) ics5342

    5 ICS5341 ics5341

    6 S3 Gendac (86708) and ICS5300 (autodetected) s3gendac

    7 SDAC (86716) s3_sdac

    8 STG 1780 (autodetected) stg1780

    9 Sierra SC11412 sc11412

    10 TI 3025 (autodetected) ti3025

    11 TI 3026 (autodetected) ti3026

    12 IBM RGB 51x52x (autodetected) ibm_rgb5xx


    The same instructions apply: If an entry in the list matches exactly your clock
    chip or the markings you copied from looking at your video card, select that entry.
    If none of them match exactly, or if you''re not sure which chip to choose, just
    press Enter to let XFree86 autodetect your clock chip when the server starts.


    # Deciding Whether to Probe Clocks


    After you''ve chosen a clock chip or elected to have XFree86 autodetect yours,
    xf86config asks if you''d like to have your card probed for valid clocks automatically.
    This technique is for older video cards that have a limited number of clock generator
    settings with which display information.


    Virtually no video cards manufactured in the last five years still use old, fixed-clock
    settings. As a rule of thumb, if your card is an older, unaccelerated VGA or Super
    VGA ISA-type card with less than a megabyte of memory, probing for fixed clock
    rates is a good idea. Otherwise, it shouldn''t be.


    If you''re unsure, choose n and go on. Even if your card happens to use fixed
    clock rates, choosing not to probe for now just means you are realizing this that
    XFree86 will end your card and probing for them when you start X.


    # Choosing Your Resolutions and Color Depths


    After deciding whether to have your card''s clocks probed, you''re finally approaching
    the end of the xf86config run. You''re shown a list of color depths that XFree86
    thinks supported by your card, along a list of resolutions that your card should
    be able to display at each depth. The list might look something like this, though
    the specific numbers and the depths will depend on the capabilities you entered
    for your video card and your monitor:


    ```

    "640x480" "800x600" "1024x768" "1280x1024" for 8bpp

    "640x480" "800x600" "1024x768" for 16bpp

    ```'
