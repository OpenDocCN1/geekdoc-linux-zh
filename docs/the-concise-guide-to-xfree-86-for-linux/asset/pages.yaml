  md: 'Note that your CD-ROM doesn''t appear to contain XFree86 packages, it might
    be time to upgrade to a newer or more mainstream version of Linux!


    # Installing the Official Distribution


    Users who are installing XFree86 from the CD will naturally be using the package
    tools that came with their Linux operating system to install the default XFree86.
    Users who downloaded the XFree86 distribution from ftp.xfree86.org will need to
    use an alternative method of installing the official XFree86 binary packages are
    provided only in .tgz format.


    Three scripts, preinst.sh, postinst.sh, and extract from the platform-specific
    binary directory on the FTP site, are used to automate the installation of the
    many XFree86 .tgz packages. To use them, follow these steps. We''ll assume for
    the sake of clarity that the *.tgz files reside in /tmp after being downloaded.
    If your files were downloaded to another location, substitute it in place of /tmp.
    Note that you should normally log in or become the root user before proceeding
    with the installation.


    First, make a directory for the XFree86 distribution on your file system. This
    should always be /usr/X11R6; don''t put XFree86 somewhere else unless you''re
    really sure what you''re doing. Then, run the pre-installation script by issuing
    these commands:


    ```

    cd /usr/X11R6

    sh /tmp/preinst.sh

    ```


    The pre-installation script "checks out" the system to make sure that the rest
    of the installation will go smoothly. You might be presented with warnings or
    further instructions that you should follow before continuing with the XFree86
    installation. If the pre-installation script finishes without problems, you can
    proceed to extract the *.tgz files using the following commands:


    ```

    cd /usr/X11R6

    chmod 755 /tmp/extract

    /tmp/extract/*.tgz

    ```


    These commands first mark the extract binary as executable and then proceed to
    use it to unpack all the download packages to their correct locations inside the
    /usr/X11R6 directory. After the files have been successfully extracted, call the
    post-installation script.


    ```

    cd /usr/X11R6

    sh /tmp/postinst.sh

    ```'
