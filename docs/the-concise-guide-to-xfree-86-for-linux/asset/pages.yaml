    # Decoration


    # Description


    Several window managers draw what are known as windows they decorate. Handles
    are specially marked sections of the window border that behave differently from
    the rest of the border, usually enabling the user to resize the window when they
    are clicked.


    Handles


    In addition to this basic set of decorations, others can be added by some window
    managers, including menus and images, but such decorations are rarely as useful
    as the basic set discussed here and their configuration is beyond the scope of
    this text.


    # Menus


    Many window managers provide some method by which applications can be launched
    without having to start an xterm window or other command line in X. Many window
    managers also provide a list of internal window management functions such as resizing,
    moving, or minimizing a window. The most common places to catalog such functions
    and provide ways for applications to be launched are one or a series of menus
    that appear when the mouse or pointer is clicked either on the root or on window
    decorations.


    The root window menu as so unique to X users for the most. A few other operating
    systems like Windows provide a context-sensitive menu on the root window that
    provides some measure of functionality, but only in X and when using X window
    managers are large, definable root menu traditional, from which applications can
    be launched and window management functions can be carried out.


    Some window managers even allow for pinnable root menu (menus that can be made
    to stay on the display indefinitely), submenus within the root menu, and images
    and icons the root menu. Most window managers'' menus are user-definable, and
    it is common for users to put their most-launched applications into window manager
    menus for easy launching, with the need for a command prompt.


    # The Pager


    Another feature common among users of the X window system but not common outside
    this community is the way of maintaining multiple desktops or a large virtual
    desktop area inside the computer, though only one desktop or area of the desktop
    can display at a time. Using a tool usually referred to as a pager, users can
    use any of these desktops or any section of a large virtual desktop to appear
    on the physical screen. The user can then interact with the visible desktop until
    he she needs to work on another section of the virtual desktop, at which time
    he she will again use the pager to make the desired'
  merge: -1
