  md: '# Fonts and Colors


    # 165


    As you see, this is a much longer format for specifying a location in the RGB
    colorspace, and a much more accurate one. Whereas the short format shown in Table
    7.6 has only 16,777,216 (16.7 million) possible combinations, the long format
    shown above has hundreds of billions of possible combinations. On the other hand,
    consumer-class Linux hardware generally max out at 24 or 32 bits per pixel—enough
    to display 16.7 million colors, and enough to match the earlier, short format
    exactly. Because of this, most Linux users will never have the need for the longer
    RGB format, though it stirs for specifying colors to X.


    # The Color Database


    After you understand the RGB colorspace, it''s really quite a simple concept—just
    add the correct amounts of red, green, blue and light to get the color you want.
    On the other hand, if you want something pinkish, it''s a bore to play around
    with hexadecimal numbers for half an hour to come up with what would have been
    a simple result.


    Because of this, XFree86 and most X implementations ship with a free X color database
    file, normally stored at /lib/X11/rgb.txt off the main X directory tree. If you
    browse this file with a pager like `more`, you''ll see that it''s a list of red,
    green, and blue colors followed by a color name, one per line. This is the crayon
    box for X users—a series of premade colors, which you can specify in most cases
    when you don''t have to come up with an RGB colorspace specification for Peach
    Puff or Midnight Blue.


    Feel free to add colors to this list, with one caveat that must be understood:
    Colors you add to your system won''t appear in the color database on other systems,
    so don''t use any added color names in files that you''ll need to carry from system
    to system.


    # 8-Bit PseudoColor Displays


    Readers with TrueColor visuals have it fairly easily: all their color can display
    are available the time, without interruption. This isn''t the case for users of
    8-bit displays with PseudoColor visuals. Remember that 8-bit displays employ a
    map of colors, a list of 256 active colors from a much larger palette. On high-end
    UNIX hardware, 8-bit PseudoColor displays aren''t a limiting factor because the
    hardware usually supports multiple colormaps, overlays of the screen that for
    each application (meaning 256 colors per application), or are at a different depth
    from the root window.


    Unfortunately, XFree86 supports neither multiple colormaps (which is really a
    limitation of PC video hardware) or overlays (which can be complicated to use
    anyway). As a result, users of 8-bit displays are faced with the fact that all
    applications on a running desktop must share the same list of 256 chosen colors.
    What if one application wants one set of colors but another application wants
    another set of colors? Quite literally, they fight—and one application (and sometimes
    both) loses.'
  merge: -1
  pgno: 180
- img_proc: true
  md: '# Colormap Management: A Difficult Game


    The management of the 8-bit colormap is a complicated subject, but a simplified
    discussion of the basics is in order. Recall that there are exactly 256 color
    slots that can each contain a color that applications can use. If these slots
    were publicly modifiable by any application at any time, serious problems would
    result. For example, if you launched a picture of the blue sky, it would likely
    allocate most, if not all, the 256 color slots for shades of blue. If you then
    launched a picture of a rose on the other side of your display, and this second
    image viewer modify the 256 color slots at will, you''d find a beautiful red rose
    on one side of your screen and a bright red sky on the other side. All those previously
    blue color slots have now been re-allocated for various shades of red.


    Because of this problem, X lets applications claim ownership of color slots while
    they run. Other applications that are launched afterward couldn''t simply reclaim
    the used color slots for their own. On the other hand, this means if the first
    program you start, for example the image view of the blue sky, it demands ownership
    of all the color slots available, any applications you try to launch afterward
    will be denied ownership of any color slots. Some applications will try to stride
    and attempt to fix themselves in the colors already onscreen, while others will
    give up and quit with an error, saying that no color was one or another. Even
    worse, many applications completely color management in leaving the user text
    on a black background, invisible buttons and pointers, or even a completely solid-color
    window where all widgets, text, outlines, and cursors are the same color.


    There are two ways in which X tries to minimize this problem: private colormaps
    and color sharing.


    Private colormaps are just that: colormaps that private to a single application.
    Concept isn''t be confused with the multiple-colaps concept mentioned earlier;
    private colormaps work somewhat differently. When many applications have allocated
    a private colormap, there is still one real colormap for the display. When is
    given permission to use all the color slots for its own colors is again lost–at
    which time the displayed colormap reverts to the state it was in immediately before
    the application took focus. Applications with private colormaps will always appear
    with the correct colors when they have focus, but as a side effect, they may cause
    colormap flashing. Colormap flashing is an effect that causes all other applications
    on a desktop to suddenly lose their correct colors when a privately mapped application
    becomes active, then suddenly gain them back again when the privately mapped window
    loses focus. It is, to say the least, unpleasant to look at, and in some cases
    it can be downright disturbing, leading to headaches, ey strain, and in one rare
    reported case, epileptic seizures.'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# Fonts and Colors 167


    The other method XFree86 uses to try to mitigate the single colormap limitation
    is through the sharing of color slots. The rules for sharing are fairly complex,
    but they basically state that more one application can own a color slot simultaneously
    if each is satisfied with the color it contains. In return, each application promises
    that it won''t change the color in a slot as long as it is sharing slot with other
    applications. Many applications support the sharing of some or all their color
    slots, and it appears to be a good system. Still, there are a couple of problems.
    No matter how friendly applications are toward each other, 256 is still only 256
    colors, and the more applications that appear on the desktop, the less likely
    it is that they will all be able to get all the colors that they need.


    More importantly, many applications don''t know how to approximate color—they
    fail to share color slots with other applications because the colors aren''t an
    exact match. Rather than share the color #ffff00 (brightest red) with another
    application, many applications will simply allocate a new slot for themselves
    containing the color #f60000, one indistinguishable shade darker, simply because
    the application hasn''t been programmed to be in a fuzzy way—it doesn''t see the
    exact shade it is searching for and doesn''t see nonexact (but close) matches
    as candidates.


    These problems can lead to the 8-bit XFree86 blues: a perpetual shortage of colors,
    lots of colormap flashing due to private colormaps, and applications that refuse
    to start because they cannot allocate new colors of their own.


    # Tips for Misbehaving Colormaps


    Although there aren''t any major changes that can easily be made to fix the X
    colormap problem for 8-bit displays, a couple of simple tips can help reduce pain.


    First, keep your applications'' color needs low. Avoiding unnecessary images or
    icons on the screen that eat up valuable color slots. Many applications allow
    the user to tune the number of colors used when running. For example, the private
    xv image viewer can be started like this:


    ```

    xv -ncols n

    ```


    The -ncols argument tells xv to use at most n colors while it is running, an important
    change this program can otherwise eat up all available color slots in an instant.


    Next, private colormaps, when available, for applications that will be spending
    of their time minimized at the bottom of the screen. For example, if you keep
    Netscape running all the time, but actually only once to check your email once
    a day, launching it with the -install option so that it uses a private colormap.
    This will keep the slots that Netscape normally would have allocated for other
    applications to use.'
  merge: -1
  pgno: 182
- img_proc: true
  md: 'Finally, try to configure applications to use the same colors whenever possible.
    Many applications have configurable color resources, some in resource files (see
    the next chapter); configuring applications'' colors so that multiple applications
    use identical colors in some cases otherwise they wouldn''t to share their color
    slots with each other, rather than allocating new ones. The same technique can
    apply to icons and graphics; if you are drawing a new icon set use for your window
    manager, draw all your icons using the exact set of colors, so that your window
    manager won''t be forced to allocate a new set of color slots for each icon.


    Perhaps this is best of all, for most Linux users, is to upgrade if all possible
    to newer hardware capable of supporting TrueColor operation under XFree86—effectively
    eliminating the colormap problem altogether.


    # Add PostScript Fonts to X


    Although X includes a basic set of fonts that are adequate for many uses, there
    are many instances in which it is desirable to add additional fonts to the X environment
    for tasks like Web design, desktop publishing, or just justifying the desktop.


    The easiest types of fonts to add to an XFree86 environment are the PostScript
    Type 1 fonts popular among Macintosh and UNIX users. These fonts can be incorporated
    into an X environment with relatively little work following the instructions in
    this section.


    # Make a New Font Directory


    Although not absolutely essential to the task, the addition of a new directory
    for server fonts will make the job of adding fonts much simpler. It will also
    provide an easy way to remove the new fonts if they become unsuitable at some
    point in the future, without having to search through all the original X fonts
    to find them.


    The standard place for fonts in the X directory tree is in the lib/X11/fonts/
    directory. For most users, then, creating the new directory is a two-step process:


    ```

    cd /usr/X11R/lib/X11/fonts

    mkdir myfonts

    ```


    Note that you can call the new directory whatever you like, but a name that identifies
    it as a set of optional or locally installed fonts will make things more clear
    in the future, should you you ever have to understand the contents of the directory
    by sight.'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# Fonts and Colors 169


    # # Unpack the Fonts and Install


    After a new directory has been created to hold them, the font files (which should
    have .pfa or .pfb extensions) can be placed directly in the new directory. Files
    that end in .afm are font metrics files (for printing and layout) and are (by
    convention) installed in a fontmetrics directory. Thus, if you find .afm files
    along the .pfa or .pfb files in your font directory, make a new directory to hold
    them and move them there:


    ```

    mkdir fontmetrics

    mv *.afm fontmetrics

    ```


    XFree86 depends on two other files in the font directory for information on the
    fonts that are present. These files are called fonts.scale and fonts.dir and contain
    font scaling information from a font directory, respectively. The fonts.dir is
    automatically generated from the fonts.scale file using the mkfont program, but
    unfortunately, no command is included with XFree86 to build the fonts.scale file.


    Luckily, there is such a program, called typeinst, included with many current
    Linux distributions. If you find that your particular distribution does not include
    it, you can download it from http://metalabunc/pub/Linux/X11/typeinst-0.6.1.tar.gz.
    The command is called without arguments inside the directory containing the fonts.
    So, assuming that you have installed the typeinst utility in the /usr/local/bin
    directory, you would issue the following command:


    ```

    /usr/local/bin/typeinst

    ```


    You will see typeinst thinking as it tells you how fonts it found and processes
    them. If there are any errors, one of the fonts doesn''t agree with typeinst,
    and this is a bad thing because no utility really exists to create a fonts.scale
    file for you. In such cases, it better just to eliminate the offending font and
    try to do without. After typeinst finishes, you should find a file called fonts.scale
    in the font directory that contains a number of lines that look more or like those
    in Listing 7.2, from an XFree86 fonts.scale.


    # Listing 7.2 The lib/X11/fontType/fonts.scale


    ```

    UTRG____pfa adobe utopia medium r  0 0 0 0 p iso88859 1

    UTI____pfa adobe utopia medium i  0 0 0 0 p iso88859 1

    UTB____pfa adobe utopia bold r  0 0 0 0 p iso88859 1

    UTBI___pfa adobe utopia bold i  0 0 0 0 p iso88859 1

    courp.pfa adobe courier medium r  0 0 0 0 m iso88859 1

    couri.pfa adobe courier medium i  0 0 0 0 m iso88859 1

    courb.pfa adobe courier bold r  0 0 0 0 m iso88859 1

    courbi.pfa adobe courier bold i  0 0 0 0 m iso88859 1

    c0648bt_-_pfa bitstream charter medium r  0 0 0 0 p iso88859 1

    c0649bt_-_pfa bitstream charter medium i  0 0 0 0 p iso88859 1

    ```


    continues'
