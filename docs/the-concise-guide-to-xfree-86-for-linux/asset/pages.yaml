  md: '# Chapter 7 Runtime Server Configuration


    # Listing 7.2 Continued


    | c0632bt_pfb bitstream charter bold r normal 0 0 0 p o iso8859 1 |

    | c0633bt_pfb bitstream charter bold I normal 0 0 0 p o iso8859 1 |

    | c0419bt_pfb bitstream courier medium r normal 0 0 0 m o iso8859 1 |

    | c0528bt_pfb bitstream courier medium i normal 0 0 0 m o iso8859 1 |

    | c0583bt_pfb bitstream courier bold r normal 0 0 0 m o iso8859 1 |

    | c0611bt_pfb bitstream courier bold i normal 0 0 0 m o iso8859 1 |


    The first line of the file indicates how many fonts were found, and the remaining
    lines are the fontename, followed by the X Logical Font Descriptor that typeinst
    has generated for font. As the fonts.scale file has been successfully generated,
    run mkfontdir in the directory to generate your fonts.dir:


    ```

    mkfontdir

    ```


    This command, too, should finish without errors. When it does, the font directory
    has been prepared and your new fonts are ready for use.


    # Testing Them Out with xset


    A few important features of the xset command earlier in the chapter were intention-left
    out at that time so that we cover them now. The features in question are those
    having to do with runtime font management. The xset command enables the user to
    change the X font path on-the-fly—meaning that you can use xset to make the fonts
    you just installed available.


    To do so, the command you''ll want to use is


    ```

    xset fp+ fontpath

    ```


    The path in this case is the directory where you just installed your fonts. For
    example, if your ''*.pfa, *.pfb, fonts.scale, and fonts.dir files were installed
    in the /usr/X11R6/Lib/X11/fonts/ directory, you would issue this command:


    ```

    xset fp+ /usr/X11R6/Lib/X11/fonts/myfonts/

    ```


    After issuing the command, you''ll wait a moment while xset reads the fonts.dir
    file in the directory and collects information about the available fonts. They
    will then be added to the list of active fonts that can be displayed with the
    xlsfonts command:


    ```

    xlsfonts

    ```


    A complete list of the font-oriented operations supported by xset can be found
    in Table 7.7.'
  merge: -1
  pgno: 185
- img_proc: true
  md: '# Table 7.7 The Font-Oriented Operations


    | Command Line | Configuration Change |

    |---|---|

    | xset fp+ path | Add the specified path to the end of the X path and incorporate
    the fonts found there into the list of available fonts. |

    | Xset +fp path | Add the specified path to the beginning of the X path and incorporate
    the fonts found there into into the list of available fonts. |

    | xset fp- path | Remove the specified path and all associated fonts from the
    X path and list of available fonts, respectively. |

    | xset fp rehash | Rebuild the list of available fonts by rescanning the directories
    and servers included in the X path. |

    | xset fp=list | Set the complete X path to the comma-separated list of directories
    and servers included by list. |

    | xset fp default | Restore the X path to the original list of paths and servers
    at start time and rebuild the list of available fonts using the restored path
    |


    Note that the font path can also include directions to font servers, which serve
    X across a network. For more information on font servers with XFree86, refer to
    Chapter 15.


    After you have added the new directory to your font path, you should be able to
    view the new fonts you installed, either in xfontsel or with xfd, supplying an
    X Logical Descriptor like the one generated by xfontsel. For more information
    on xfontsel and xfd, please see Chapter 4, "Standard XFree86 Programs and Utilities."


    # Add the New Fonts to XF86Config


    After you''re satisfied with your fonts, one step usually remains in adding the
    new fonts to your environment: The X server must be told in a permanent way that
    they exist. The font path editing with xset will only last as long as the X session
    lasts. Afterward, all changes will disappear unless they are made permanent. This
    is done by adding the directory containing the fonts to your XF86Config file.


    Using an editor such as vi or emacs, edit the Files section to contain the path
    to your new fonts by adding a FontPath line after all the existing FontPath lines:


    ```

    FontPath "/usr/X11R/lib/X11/fonts/myfonts/

    ```


    Note that the order of the FontPath entries is important, so avoid placing the
    new FontPath entry at the top of the list unless you are want that the new fonts
    to take precedence over all others.


    After you saved edited file, your new PostScript fonts will appear in the list
    of available fonts whenever the X server is started.'
