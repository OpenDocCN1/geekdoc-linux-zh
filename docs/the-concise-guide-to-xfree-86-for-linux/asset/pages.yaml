- img_proc: true
  md: "# Chapter 7 Runtime Server Configuration\n\nThe files in the symbols/ directory\
    \ are structured similarly to the files in the keycodes/ directory. Each file\
    \ contains several sections delineated as follows:\n\n```\n[default] xkb_symbols\
    \ \"name\" {\n  (...symbol mappings...)\n}\n```\n\nAgain, a specific set of symbol\
    \ mappings is referenced based on the file in question and the section within\
    \ the file. For example, consider the following reference:\n\n```\nus(pc101)\n\
    ```\n\nThis string of text refers to the us in the symbols/ directory, and then,\
    \ more specifically, to the pc101 section within the file. The us symbol file\
    \ alone contains 87 different sets of symbol mappings. There are approximately\
    \ 140 sets in the default XFree distribution, which all the sets in the symbols\
    \ files are counted. To make more confusing, multiple symbol specifications are\
    \ sometimes required, and are constructed by linking two symbol specifications\
    \ together with a plus (+)\n\n```\nus(pc101)+pl(basic)\n```\n\nFinding the correct\
    \ symbol set for a generic locale and piece of keyboard hardware can clearly be\
    \ a daunting task.\n\n# ## The geometry/ Directory\n\nThe files in this directory\
    \ provide a visual description for various types of keyboards, suitable for use\
    \ by programs like xkbprint, which will generate a visual representation (in PostScript\
    \ format) of the keyboard and the mappings of each of its keys. For example, the\
    \ following lines show how to use the xkbprint command to generate a PostScript\
    \ keyboard file, and then use gv to view it:\n\n```\n$ xkbprint :0.0 -MyKeyboard.ps\n\
    $ g ~/Keyboard.ps &\n```\n\nThe first argument to display when opening the keyboard\
    \ representation. The current display on a single-user Linux system is usually\
    \ represented by :0.0. For more information on specifying displays other than\
    \ the first display on a single-user machine, refer to Chapter 15, \"Working on\
    \ the Network.\" The second argument to xkbprint is the PostScript file to generate.\n\
    \nAlthough it's not necessarily important to use an accurate geometry file as\
    \ it is to use accurate keycodes and symbols files, it is nevertheless a bad idea\
    \ to use an incorrect or nonexistent geometry file because the visual representation\
    \ of your keyboard that X maintains will be inaccurate."
