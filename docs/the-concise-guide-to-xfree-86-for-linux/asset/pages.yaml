  pgno: 50
- img_proc: true
  md: 'Users of extended pointing devices, such as those with scroll wheels, should
    be sure to configure XFree86 to listen for all five buttons in addition to choosing
    an extended protocol because most such pointing devices send upward and downward
    scroll motion as clicks on the fourth and fifth buttons, respectively.


    Other options such as resolution and sample rate should be adjusted for personal
    taste. When you have your mouse working just as you want, you can proceed to the
    next section.


    # Keyboard Configuration


    The keyboard configuration section (see Figure 2.3) presents a fairly self-explanatory
    set of options. For most users, the keyboard model will be Generic 101 key PC
    and the language will be US English. If you have an extended keyboard that appears
    in the list of models or if you are using a keyboard with a non-English layout
    you feel free to set the related options accordingly.


    ![](img/edb2a4591eafaad74c22be9075f4b815_51_0.png)


    **Figure 2.3** Keyboard configuration is fairly straightforward.


    The group shift/lock behavior and the control key positioning should probably
    be left on their default settings unless you know for sure you want to change
    them or if you discover later that you''re uncomfortable with the defaults. For
    most users, these options won''t need to be changed, and choosing options other
    than the default can lead to confusing keyboard behavior while using XFree86.'
