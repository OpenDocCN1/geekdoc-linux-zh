    # Switching Consoles and Emergency Exits


    Two of the most important functions to remember while inside XFree86 are console
    switching and the three-key exit.


    You might already be familiar with the concept of virtual consoles inside XFree86.
    If not, exit XFree86 now, and try this: Press Alt+F1, Alt+F2, and so on, until
    you see a login prompt. Log in at this prompt, and then pick up where you left
    off, perhaps Alt+F3, and so on, until you see another login prompt. Log in where
    you logged. Execute a command or two, and then press the first Alt+Fn sequence
    where you are, and then press the second Alt+Fn sequence. What you''re switching
    between virtual consoles. These virtual consoles are like any number of displays
    that Linux knows about; each can host its own login and run its own programs.


    When you start XFree86, you are displaying X on one of these virtual consoles.
    The rest of them, however, remain active, and you can switch to them and use them
    at any time.

    Unfortunately, the key sequence is a little different. When you''re looking at
    the X display and need to switch to another virtual console, press Ctrl+Alt+Fn
    to switch to the console in question. Afterward, you can press Alt+Fn to switch
    back, though you might have to try a few virtual consoles to figure out which
    one is running. The easiest way to do this is to press Alt+F1 and count from there
    until you press F12. At some point, you''ll find the X desktop you were looking
    for.


    The other important keyboard trick when working with XFree86 is the three-key
    emergency exit. This is triggered when the Ctrl, Alt, and Backspace keys are all
    pressed at once. Unless you have explicitly disabled this action while configuring
    X, pressing this series of three keys forces the X to *punt*—exit as quickly as
    possible, dropping out of X, back at the command line, and leaving all running
    applications in the lurch, unable to continue.'
