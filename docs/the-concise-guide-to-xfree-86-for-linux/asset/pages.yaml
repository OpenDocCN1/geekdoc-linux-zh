  md: '# 88 Chapter 3 Launching XFree86


    Although X does include one basic widget kit (the Athena toolkit, also commonly
    known as XAW, for Athena Widgets), it''s not a complete or functional toolkit,
    even though it''s the toolkit used by most of the basic X utilities. This is because
    the Athena toolkit was intended for use only in basic X utilities and, more importantly,
    as sample code for programmers who were to create more complex widget kits and
    more complex programming interfaces (APIs).


    Because of this, most users coming to X and Linux from other operating systems
    immediately notice the obvious diversity among X Widgets. Whereas in Windows or
    Mac all widgets are similar in appearance, look good together, and behave in the
    same way, in X, many different families of widgets are created by the many different
    toolkits used to create X applications. Some of these toolkits and their peculiarities
    are discussed in more detail in Chapter 5, "Linux/X Toolkit Particulars."


    # Interacting with X


    To use XFree86 effectively, it is important to understand how to use a few visual
    components and how to complete a few basic operations. Although some of these
    are similar to the components and operations commonly used in other graphical
    environments, certain items or keystrokes are unique to X or even to XFree86.


    # The Mouse Cursor


    The mouse cursor in X behaves much the same way that it does in other graphical
    operating systems such as Windows or Macintosh. There are, however, a few differences.


    One of the most instantly recognizable for those using a window manager like tw
    is that the mouse cursor is not in the shape of a pointer when it is over the
    root window. The mouse cursor appears as a rather oversized X that many users
    find quite annoying, in part because the cursor''s hot spot is obscured in the
    response to this problem, some newer window managers (such as Window Maker or
    AfterStep) specify an alternative, more typical pointer cursor.


    Users operating at 15, 16, 24, or 32 bits per pixel might also have experienced
    initially shocking aspect of X behavior that is closely linked to the mouse cursor,
    of panning across or up and down in the virtual desktop. You''ll most likely see
    this behavior if there are one or more modes that your video card and monitor
    are capable of at 8pp, but not capable of higher depths. For example, if your
    video adapter and monitor can display 1024x768 at 8pp, but only 800x600 at 16pp,
    and you''ve started X at 16pp, you''ll find that X has configured a 1024x768 virtual
    desktop for you.'
