    \ to the S3 Accel server |\n| Visual | text | Explicitly set the window visual\
    \ type with one of StaticGray, GrayScale, StaticColor, PseudoColor, TrueColor,\
    \ or DirectColor(for 1bpp, 4pp, or 8pp displays), or TrueColor(for 15pp, 16pp,\
    \ 24pp, and 32pp displays). This option is normally not specified, and using the\
