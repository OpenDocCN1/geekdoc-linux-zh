    | -children | Causes xwininfo to display the names of the selected window''s root,
    parent, and children windows. |

    | -tree | Similar to the -children argument listed above, but causes xwininfo
    to display the information in a recursive, indented, tree-like format. |

    | -frame | Specifies that the window manager frame should be seen instead of selecting
    a client by hand. |

    | -stats | Causes xwininfo to display various physical attributes to the selected
    window, including geometry (width, height, and offsets from the edge of the display),
    color depth, border width, class, positions of the corners, and hints. This is
    the default xwininfo behavior. |

    | -all | When supplied, this argument will cause xwininfo to display all information
    it can obtain about the selected window. |

    | -metric | When supplied, this argument will cause offsets and distances in pixels
    to be displayed in metric units (millimeters and centimeters) based on the X server''s
    assumptions about the display size. |

    | -english | When supplied, this argument will cause offsets and distances in
    pixels to be displayed in English measurement units (inches and feet) based on
    the X server''s assumptions about the display size. |


    By far the most common use of the xwininfo command is in obtaining information
    about a window''s location and geometry settings. This information is given as
    an X-axis size (width), a Y-axis size (height), and offsets in pixels from two
    edges of the display. For more information on geometry specification, please refer
    to Chapter 8.


    When xwininfo is called without arguments, it will ask the user to select a window
    to display information:


    ```

    xwininfo: Select the window about which you

    would like information by clicking the

    mouse in that window.

    ```


    After clicking the mouse either in an application window or in the root window,
    the requested information will be displayed to standard output, which generally
    means the xterm window from which xwininfo was called.'
