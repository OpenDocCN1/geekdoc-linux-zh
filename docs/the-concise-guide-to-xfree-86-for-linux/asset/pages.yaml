- img_proc: true
  md: 'If you''ve allowed XFree86 to try autodetecting a large number of settings,
    it may be time to start filling the blanks. Try explicitly configuring your ramdac,
    clock chip, and the amount of video memory present on your card. Sometimes the
    XFree86 probe goes wrong, and a card will work properly only if these settings
    are explicitly configured.


    Make sure that the correct X server has been specified. Did you change the default
    X server suggested by xrefsetup? Did you forget to create the symbolic link to
    the X server in x86config? If so, this is likely the cause of your problems.


    Last but not, simply go over every setting again to make sure that you didn''t
    misclick or mistype anywhere. Just as types commonly cause problems, so do that
    missed their mark ever so slightly. A quick double-check can often eliminate hours
    of hair pulling.


    In the end you are simply unable to get your video card to function properly hours
    of work, you have four choices:


    +   - The first option is to post newsgroups on Usenet and post your question
    to a newsgroup such as comp.linux.hardware, or comp.linux.x. Specifically list
    the name and model of the video card you are trying to use, as well as the version
    of Linux and the version of XFree86 involved. Perhaps else already has the same
    problems as you, solved, and will be willing to share the answer.


    +   - The second option is to purchase an alternative X11R6 implementation that
    will support your card explicitly. There are two major alternative X11R6 implementations
    for Linux users: Accelerated-X, available from Xi Graphics at http://www.xig.com,
    and Metro-X, available from Metro Link at http://www.metro.com.


    +   - The third option, and perhaps the easiest in most cases, is to go out and
    buy a new video card. Hardware is ridiculously cheap these days, and you might
    be surprised to find that you can purchase a video card that is much faster than
    your current one and is supported by XFree86 for less than it would cost to purchase
    an alternative X11R6 implementation.


    +   - The fourth option is to proceed to the next section, "Advanced Configuration,"
    and pound on the configuration test files for a few hours in an attempt to get
