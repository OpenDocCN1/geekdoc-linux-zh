  md: '# 52 Chapter 2 Installing and Configuring XFree86


    # /etc/XF86Config Section by Section


    The /etc/XF86Config file, sometimes found at /etc/X11/XF86Config and also found
    every now and then at /usr/X11R6/lib/X11/XF86Config, is a plain text file broken
    into several sections in a regular format, represented here:


    ```

    Section "ThisSection''Name"

    ConfigEntry [parameters needed]

    ConfigEntry [parameters needed]

    ...

    SubSection "ThisSubsection''Name"

    ConfigEntry [parameters needed]

    EndSubSection

    EndSection

    ```


    Not all sections will have subsections, and not all configuration entries will
    have parameters. Still, the file manages to look quite regular and is fairly easy
    to follow when printed out. Sections and configuration entries don''t need to
    follow any particular order, a convention is generally followed, and the following
    sections use the same ordering convention. Lines that begin with the (#) symbol
    are comments and are ignored.


    This chapter was intended as a section-by-section read to tweak an existing XF86Config
    file generated by XF86setup or xf86config. Extras on supporting specific devices
    or special configuration are included where appropriate. There is so much to configure
    that a great deal of card-specific and server-specific information has been omitted.
    Especially when reading about the device section, please be sure to visit the
    manual page for your X server and the chipset-device README files installed by
    the XFree86 packages in /usr/X11R6/lib/X11/doc.


    # The Files Section


    The Files section of the /etc/XF86Config file is generally found, and contains
    configuration options that tell the X server to find specific files it needs to
    operate.


    The Files section will almost always look exactly like this after having been
    generated by programs such as XF86Setup or xf86config:


    ```

    Section "Files"

    RgbPath "/usr/X11R6/lib/X11/rgb"

    FontPath "/usr/X11R6/lib/X11/fonts:unscaled"

    FontPath "/usr/X11R6/lib/X11/fonts/75dpi:unscaled"

    FontPath "/usr/X11R6/lib/X11/fonts/100dpi:unscaled"

    FontPath "/usr/X11R6/lib/X11/fonts/Type1"

    FontPath "/usr/X11R6/lib/X11/fonts/Speedo"

    FontPath "/usr/X11R6/lib/X11/fonts/misc"

    FontPath "/usr/X11R6/lib/X11/fonts/75dpi"

    FontPath "/usr/X11R6/lib/X11/fonts/100dpi"

    ```'
