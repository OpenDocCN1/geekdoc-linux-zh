    # Widgets and More


    The term widget has many historical meanings and additionally several meanings
    in the computing industry. In this text, however, the term refers to a visually
    distinct item or component on the screen with a well-defined set of properties.


    # Widget Basics


    Examples of widgets include such things as the title bar, the minimize and resize
    buttons, pull-down menus, and even the large text-entry area in a window.


    Generally, the functionality of a widget is consistent across all instances of
    the widget. For example, the window resize button in twin will allow the user
    to resize the window matter which window''s resize button is being discussed.
    Furthermore, the resize button will always behave in a consistent manner regardless
    of which window''s resize button the user is attempting to.


    Some widgets have variable functionality or appearance but still retain measure
    of consistency across all instances of the widget. a drop-down menu might have
    four choices or twelve; there can be any number of submenus, and one drop-down
    menu can contain options with file access, whereas another contains choices related
    to editing. Still, in an intuitive way, all drop-down menus behave in the same
    way: they drop down (appear) in response to a user click, present a list of single-line
    choices, and then take action on the line selected.


    It is also important to note for academic purposes that


    # Widget Kits, APIs, and X


    Most graphical user interfaces for other operating systems include a predefined
    set of basic widget with which programmers can create applications with consistent
    appearances and behaviors. In this regard, X is somewhat different.'
