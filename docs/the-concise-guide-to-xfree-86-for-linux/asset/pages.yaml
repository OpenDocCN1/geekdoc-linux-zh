  md: '# X Desktop Components


    It''s now time to look at the basic components of the X desktop and who owns and
    controls what. You''ve already seen the X server running alone, and if you''ve
    started X using startx, you''re now looking at the X desktop.


    # X Server and Root Window


    In fact, whenever you''re in FreeBSD86, what you''re really looking at, in the
    most basic sense, is the X server because everything that is displayed on the
    screen is displayed by the X server. A related concept, the root window, is the
    basic desktop area, which lies behind or under any applications or the cursor.
    In the default FreeBSD86 distribution, it is visible as a large area in a black-and-white
    hatch pattern by default. In other distributions included with Linux operating
    systems, the root window is a solid color by default.


    The root window is important because, in X, the root window "owns" all other windows.
    In X, all windows (children) are owned by another. Although might be cases in
    which such ownership is five or six levels deep (A owns Window B owns Window C
    owns Window D), ownership can be traced back, to the root window, which is the
    most fundamental window in the tree. The root window cannot be closed without
    exiting FreeBSD86, and conversely, stopping the X server closes the root window.


    The root window is generally not "decorated" by the window manager or other utilities.
    That is to say that the root window never appears with a title, border, or any
    buttons with which to resize it. The root window is fundamentally the size of
    the virtual desktop (which is often the size of the display resolution) in use
    and is always "in back." It is possible, however, to decorate the root window
    in other ways—for example, by causing it to display an image (a process known
    as wallpapering by most users), a solid background color, or an animation. A few
    select applications also take command of the root window and use it as a forum
    for interaction with the user.


    # Window Manager


    The Window Manager can be visible at any time. The window manager isn''t an application
    in the typical sense of the word; instead, it is a program that is responsible
    for the creation and management of child (that is, nonroot) windows. Normally,
    whenever an FreeBSD86 server is running, a window manager will also be running.
    Most users don''t have the tenacity or the patience to run an X session and applications
    without an active window manager to aid in human interaction. You can easily see
    that a window manager is active by checking the process list. When the default
    FreeBSD86 desktop is running, this means issuing command:


    ```

    $ ps ax | grep twm

    ```'
