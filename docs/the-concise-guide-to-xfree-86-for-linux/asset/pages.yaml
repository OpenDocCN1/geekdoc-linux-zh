- img_proc: true
  md: '# Table 4.1 Basic Job Management Commands for Shell Users


    | Command | Effect |

    |---|---|

    | jobs | Lists active jobs started as children of the current shell. |

    | fg jobid | Brings the job with the specified *jobid* to the foreground. |

    | bg jobid | Places the job with the specified *jobid* in the background. |

    | kill jobid | Kills the job with the specified *jobid*. |

    | nohup cmd | Starts the command *cmd*, ignoring any hang-up signal. Allows the
    command to remain active even if the parent shell has logged out. | |


    # Table 4.2 Basic Job Management Input Characters for Shell Users


    | Character | Effect |

    |---|---|

    | Ctrl & | Appending the ampersand (&) character to the end of a command will
    start the command concurrently, in the background. |

    | Ctrl+Z | The Ctrl+Z key sequence will suspend a foreground job. The job can
    be resumed either in the foreground or background with *fg* or *bg* or killed
    out. |

    | Ctrl+C | The Ctrl+C key sequence will cause most commands to quit immediately.
    |


    The *xterm* utility in X will find that all these commands and key sequences work
    as expected from within an *xterm* window. You might have noticed launching the
    new instance of *xterm* previously left the shell in the original *xterm* window
    unavailable, and then this is because the *xterm* process was launched in the
    foreground. To create a new *xterm* leave the parent shell active, use the following
    command:


    *xterm &*


    Similarly, to place an existing *xterm* in the background and free up the parent
    shell, the user would focus the window containing the parent shell, use the Ctrl+Z
    key sequence, and then move the process to the background with bg.


    The kill command can also be used from an *xterm* window, but when killing X applications,
    it is often easier to use the X counterpart to kill, *xkill*. To use *xkill*,
    simply type the command at an xterm shell prompt:


    xkill


    You''ll find that the mouse cursor has changed to a skull and crossbones. Move
    this skull and crossbones over the application window you want to kill, and click
    to kill the application in question.'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# 100 Chapter 4 Standard XFree8 Programs and Utilities


    The nohup command can be used from an xterm window as well and is actually more
    useful in X than at a text-based shell prompt. When using a shell outside X, the
    nohup command simply prevents a background application from being killed if the
    user logs out. Thus, the command takes effect only when the user leaves the work
    area. In X, where multiple xterm windows can be created and killed (logged out)
    in sequence, nohup takes on a new measure of utility.


    To illustrate, try starting an xclock from an open xterm window:


    ```

    xclock &

    ```


    After the clock has been successfully started, kill the xterm window, either with
    xkill or by a killing option in your window manager''s configuration (such as
    the one from the root-window menu in the default XFree86 desktop). Upon killing
    the xterm window, you''ll notice that the xclock has been killed as well. The
    loss of a single xclock might not seem like a calamity. But if 20 separate applications
    have been started from a single xterm window and then accidentally killed, or
    even killed on purpose to reduce clutter, the desktop could suddenly be cleared
    of applications, resulting in lost data and time. To prevent a window from being
    killed if the parent xterm shell process ends, use the nohup command:


    ```

    nohup xclock &

    ```


    Remember that nohup can save immense amounts of time and headache later on.


    # Commonly Used X Utilities


    The number of utilities and applications that come with XFree86 is rather large,
    and we have time for only a few of them. You can find the complete list of binaries
    included with XFree86 by listing the files in the xbin.tgz file. You can find
    official documentation for most of these binaries by consulting the installed
    manual page for each binary. Many of these utilities and clients also make available
    several resource settings that affect the client''s behavior. For a listing of
    applicable resources for a given client, consult the manual page for the client
    in question. Details on using X resources can be found in Chapter 8, "Runtime
    Application Configuration."


    All the utilities listed in the following sections are normally started in the
    same way, supplying their name to the shell in an xterm window. For example, to
    start the xeyes client, the


    ```

    xeyes &

    ```


    All the client binaries can normally be found in the /usr/X11R6/bin/ directory,
    and their manual pages can be found in the /usr/X11R6/man/man1/ directory.'
  merge: -1
