    # xsetroot


    The xsetroot utility changes the appearance of the current display''s root window,
    by changing either its color or its pattern or both. This utility can also be
    used to change certain aspects of the pointing device cursor over the root window.
    The most common command-line arguments accepted by xsetroot are shown in Table
    4.22.


    | Argument | Description |

    | - | - |

    | -def | Restores the default appearance for the root window as dictated by the
    X server. This is normally a black-and-white hatch pattern. |

    | -cursor path path | Changes the cursor that will be used by the mouse whenever
    it is directly over the root window. The first file specified is the path to the
    cursor bitmap image, and the second file is the path to the image mask, normally
    completely black. X bitmap can be created using the bitmap command. |

    | -cursor_name name | Changes the cursor that will be used by the mouse whenever
    it is directly over the root window. This option enables the use of any of the
    cursors from the standard cursor font. To choose a cursor and find its name, execute
    the command `-fn cursor` and use it to find the number of the cursor you''d like
    to use. Then, search the cursor file at `/usr/X116/include/X11/cursorfont.h` for
    the name that matches the number you selected. Supply this name, omitting the
    XC_ at the beginning, as the *name* when using this example. For example, cursor
    number 62, a heart, is listed as XC_ heart in the include file. The corresponding
    *name* would therefore be heart. |

    | -bitmap path | Fills the root window with tiles of the specified bitmap file.
    |

    | -mod x y | Fills the root window with a grid of lines occurring every x pixels
    horizontally and every y vertically. |

    | -gray | Makes the root window a solid gray. |

    | -grey | See `-gray` above. |

    | -fg color | Uses `color` as the foreground color in conjunction with the `-cursor,-bitmap`,
    or `-mod` arguments. |


    continues'
