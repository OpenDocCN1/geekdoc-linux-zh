  md: '# 9


    # RUNTIME ENVIRONMENT

    CONFIGURATION


    The nature of the X Window System and its separation between low-level GUI functions
    and environment management means that many different environments and window managers
    are available to the average Free86 Linux user. This is fortunate for the user;
    the wide variety in available choices means that any user can have his or her
    desktop exactly as he or wants.


    Unfortunately, it also means that there are as many different ways to configure
    a desktop as there are users, and such configuration dotfiles—configuration files
    written in a specific format that the window manager reads each time it begins,
    in order to establish its behavior and appearance for the session.


    The purpose of this chapter is to introduce you to some basic window manager concepts
    and to help you configure dotfiles for the three most common window managers installed
    by Linux distributions—twm, which is installed by all of them, fwwm, which is
    less used than it once was but is still the default window manager for some distributions,
    and fvwm2, which picks up where fwwm left off and is also used by some Linux distributions
    as the default window manager.'
  merge: -1
  pgno: 210
- img_proc: true
  md: '# Chapter 9 Runtime Environment Configuration


    There are, of course, other window managers, some of them much more popular or
    pretty than twm, fwm, and fwm2. However, because so many window managers are available,
    it is impractical to cover all of them or to cover any of them in any detail in
    a text like this one. In fact, even twm, fwm, and fwm2 aren''t completely documented
    here. For detailed configuration information or for information on advanced options,
    please consult the manual pages for each window manager and its components, as
    well as the documentation included with the window manager and the source code
    of the window manager, in that order.


    # The Basics


    Although each window manager is a beast all its own, with a specific look and
    feel and unique configuration options, twm, fwm, and fwm2 all share a few common
    elements. Before attempting to configure a dotfile for all of these window managers,
    it is important to understand these elements are and how they behave.


    # Window Appearance


    Every window manager covered in this chapter adds decorations to the X client
    windows it manages. Such decorations are used to show a window''s edges, indicate
    where the current border focus currently resides, and provide a mechanism by which
    the user can interact with the window manager in the context of a specific window.
    The common decorations added by window managers can be found in Table 9.1.


    Table 9.1 Common Window Decorations

    | Decoration | Description |

    | Title Bar | Most commonly seen as a horizontal rectangle sitting on top of a
    window, though vertical title bars do exist, in the case of the wm2 manager. Usually
    imprinted with text representing the title of the window. Also indicates whether
    a window is a focused or unfocused state, often through a change of color. |

    | Border | In addition to the default border drawn by many X applications that
    might be a single pixel wide (or might not be present at all), most window managers
    draw a border of their own, often with a three-dimensional appearance, to make
    it easier to see the edges of a window. Sometimes the borders even have some sort
    of function, as resizing the window. |

    | Buttons | Usually located somewhere inside or next to the window''s title bar,
    window buttons are usually small rectangles (though they can be other shapes or
    images) that perform specific functions when clicked. Common buttons include a
    minimize button, also known as an icon button in some cases, a close or kill button,
    and in some cases (like twm), a resize button. Some window managers enable the
    user to define an arbitrary set of buttons and functions to them at will.|'
  merge: -1
