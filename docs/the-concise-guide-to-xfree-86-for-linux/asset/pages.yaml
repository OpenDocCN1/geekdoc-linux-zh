  md: '# More on ssh


    Notice that the display number is not 0 or another existing display, but is a
    number higher than the number of any existing display (usually 10). This is evidence
    of the ssh X protocol at work; the X data stream is moving over the encrypted
    channel. It is good policy to use ssh at all times when connecting clients to
    X servers using network interfaces, and instruct users to do the same.


    Any X client that can be started over the network by other means can also be connected
    over the network across a secure ssh channel. When combined with token-based authentication,
    ssh provides one of the best methods for securing X services available, and it
    is much easier to manage alternative services such as Kerberos.


    # Accepting Incoming Encrypted X Connections


    After the sshd server is either running or configured to run on the local display,
    there is really little more that needs to be done to safely accept and administer
    incoming X client requests.


    The sshd daemon works with existing access control mechanisms, both host-based
    and token-based, and in addition implements several access control mechanisms
    of its own in /etc/sshd_config file.


    # More on ssh


    This chapter has hinted at the ssh''s capability to tunnel other types of network
    protocols across the encrypted channel. There are other ways of using ssh as well,
    for example, with $HOME/.hosts-like access, avoiding the need for the user to
    supply a password for each connection.


    A complete discussion of ssh configuration in multihost environments and the many
    uses of ssh is beyond the scope of this text. However, there are many good resources
    on the Internet designed to help system administrations install and use ssh to
    its fullest. Some information that might help you to familiarize yourself with
    ssh can be found at the following links:


    ```

    http://www.ssh.org/

    http://www.tac.nyc.ny.us/~kim/ssh/

    http://www.csua.berkeley.edu/ssh howto.html

    http://www.employees.org/-s/ssh/faq/

    ```


    More information on using ssh, sshd, login, and the other tools that come with
    ssh, especially with regard to command-line arguments and configuration file formats,
    can be found by consulting each of their respective system manual pages.'
