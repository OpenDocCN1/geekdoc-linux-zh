    SVGA server. The FBDev driver will be used for the FBDev servers, most commonly
    on 68K or PPC Linux machines. Sections that use the Accel driver will be used
    when any other driver is started. At least one Screen section with a driver that
    matches your server in the XF86Config file. |

    | Device | text | Here you must specify the same string you gave the Identifier
    option when configuring your video card section. If more than one Device section
    is present, this Screen section refers to the video card with the matching identifier.
    |

    | Monitor | text | Here you must specify the same string you gave the Identifier
    option when configuring your monitor in the Monitor section. If more than one
    Monitor section is present, this Screen section refers to the monitor with the
    matching identifier. |

    | DefaultColorDepth | num | Specify the default color depth for this Screen section
    in bits per pixel. If no depth is specified when X is launched, this is the color
    that will be used. Legal values are 1, 2, 4, 8, 15, 16, 24, and 32. Not all values
