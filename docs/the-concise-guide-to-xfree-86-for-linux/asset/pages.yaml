  md: '# Chapter 5 Linux/X Toolkit Particulars


    | Table 5.2 Continued |

    | Item | Peculiarity |

    | Text Entry | When entering text of any key, the mouse pointer must be within
    the border of the widget that should receive the text. For example, entering a
    filename into an entry box, the mouse pointer must appear inside the entry box
    as well, or typed text will not appear as intended. When using an editor such
    as axE, the mouse pointer must appear inside the edit area; if it is on the menu
    bar, for example, all keystrokes will be lost. |

    | Keyboard | ...or typed text will not appear as intended. When using an editor
    such as axE, the mouse pointer must appear inside the edit area; if it is on the
    menu bar, for example, all keystrokes will be lost. |

    | Keyboard | No keyboard shortcuts to navigate widgets; all interaction with widgets
    must be done with the mouse. Common keys as Home, End, Page, and Page Down often
    don''t work in Athena widgets or text entry areas. |

    | Scrollbar | The default Athena scrollbar mapping invariably drives new users.
    Many distributions have fixed the problem, as shipped, the scrollbars behave like
    this: A left click on a scrollbar causes text to scroll one page down. A right
    click on a scrollbar causes text to scroll one page up. The scrollbar can be dragged
    up and down using the middle mouse button. |


    Because of the rather ugly appearance of the standard Athena widget set, a nonstandard
    Toolkit also exists, called the Xaw3d library. The three-dimensional Athena widgets
    are much prettier than the standard Athena widgets, giving a three-dimensional
    appearance using highlighting and shading. Several current Linux distributions
    ship with Xaw3d-enabled applications.


    The behaviors of certain Athena widgets can also be modified by configuring X
    resources. It is common, for example, to see Athena scrollbars fixed to behave
    like users expect scrollbars to behave with any of the three mouse buttons to
    drag the related area.


    # Gtk/Gtk+


    The Gtk, GIMP Toolkit, originally written to be used by the GNU Image Manipulation
    Program (GIMP), is a modern toolkit with a three-dimensional appearance written
    in ANSI C (see Figure 5.2). So-called wrappers also exist to allow Gtk, or the
    later Gtk+, to be used with other languages such as C++ or Python. The Gtk library
    is heavily-oriented (as much as one can get in C) and is licensed under the General
    Public License.


    The best-known application based on Gtk is the GIMP; the other well-known application
    of the Gtk library is the basis for the GNOME desktop popular among Red Linux
    users. Table 5.3 lists some general information about the Gtk widgets, and Table
    5.4 lists some of the peculiarities.'
