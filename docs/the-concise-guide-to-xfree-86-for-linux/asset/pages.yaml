- img_proc: true
  md: '# Global Defaults


    Much of the default XFree86 behavior, and many properties of XFree86 clients and
    processes, are stored in subdirectories within the lib/X11/ directory of the main
    XFree86 tree. The files in these directories specify a default set of behaviors
    for many X programs and processes, including the X session launch process.


    # Default xinit Behavior


    The default xinitrc script is stored at /usr/X11R6/lib/X11/xinit/xinitrc. This
    is an executable shell script that is executed when the startx command is issued
    from the console, provided that the user doesn''t have a replacement local file
    called .xinit in his or her home directory.


    The default global xinitrc file, as shipped with XFree86 3.3.4, is shown in Listing
    6.1. Note that line numbers have been added for clarity and are not present in
    the actual file.


    +   Listing 6.1 The /usr/X11R6/lib/X11/xinit/xinitrc Script


    ```

    1 #!/bin/sh

    2 #XSortium: xinitrc.cpp,v 1.4 91/08/22 11:41:34 rws Exp $

    3

    4 userresources=$HOME/.Xresources

    5 usermodmap=$HOME/.Xmodmap

    6 sysresources=/usr/X11R6/lib/X11/xinit/.Xresources

    7 sysmodmap=/usr/X11R6/lib/X11/xinit/.Xmodmap

    8

    9 merge in defaults and keymaps

    10

    11 if [ -f $sysresources ]; then

    12 xrdb -merge $sysresources

    13 fi

    14

    15 if [ -f $sysmodmap ]; then

    16 xmodmap $sysmodmap

    17 fi

    18

    19 if [ -f $userresources ]; then

    20 xrdb -merge $userresources

    21 fi

    22

    23 if [ -f $sysmodmap ]; then

    24 xmodmap $sysmodmap

    25 fi

    26

    27 # start some nice programs

    28

    29 twm &\n30 xclock -geometry 50x50 1+1 &

    ```'
  merge: -1
