- img_proc: true
  md: '# # Card Configuration


    The Card configuration section initially presents an extensive list of supported
    video cards to choose from, as shown in Figure 2.4.


    ![](img/edb2a4591eafaad74c22be9075f4b815_52_0.png)


    **Figure 2.4** The Card configuration section initially displays a long list of
    supported video cards.


    Scroll down the list alphabetically to see if your card is explicitly listed.
    If it is, you have it easy—select your card from the list and proceed to the next
    step. If your card isn''t listed, you''ll have to pull out of some research data
    you compiled about your computer. Specifically, you''re looking for your chipset
    to be listed, either by manufacturer, or by model number. For example, if your
    chipset is labeled Tseng Labs ET4000AX, you should first look towards the end
    of the list for Tseng Labs. If you can''t find your chipset by manufacturer, search
    for the model alone. Entries that have the word generic in parenthesis after them
    refer to graphics chipsets, so these are the entries you''re looking for.


    In our example, the ET4000AX chipset is not listed but the ET4000 is, so we''ll
    choose that one because it seems to be the most similar. Often, there will be
    several similar matches but no exact match, and you might need to try each of
    them before finding the one that works for your hardware.


    After you''ve chosen either a card or a generic video chipset from the list, click
    the Detailed Setup button to visit the detailed graphics hardware setup screen,
    shown in Figure 2.5. Before doing anything else, click the Read README File button
    to get any specific additional instructions that have to do with your graphics
    chipset or card choice.'
