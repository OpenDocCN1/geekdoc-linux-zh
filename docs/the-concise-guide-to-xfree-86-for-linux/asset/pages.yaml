  md: '150 Chapter 7 Runtime Server Configuration


    # # Using xmodmap to Make the Changes


    After you''ve got the keycode for the key in question and the key symbol you''d
    like that key to be linked, call the xmodmap command in the following manner:


    ```

    xmodmap -e ''keycode n = Sym''

    ```


    Replace n with the keycode number and Sym with the name of the symbol you''d like
    to bound to the keycode in genius, minus the xx_ at the beginning. For example,
    on a PC machine, the Tab key generates keycode 23. The tab function in X is referenced
    by the symbol xx_tab. If a given machine has a mishaving Tab key, it can be remapped
    to the X XK_Tab symbol using the following command:


    ```

    xmodmap -e ''keycode 23 = Tab''

    ```


    By far the two most common changes made to the default Free8 keyboard mappings
    are for broken Backspace or Delete keys. On a standard PC keyboard, the Backspace
    and Delete keys have keycodes of 22 and 107, respectively. The Free86 functions
    that most users expect to be bound to these keys are xx_Backspace and xx_Delete
    as given in the include/X11/keysymdef.h file. The commands to fix these keys on
    a PC are these:


    ```

    xmodmap -e ''keycode 22 = Backspace''

    xmodmap -e ''keycode 107 = Delete''

    ```


    Note that these keycodes apply only to the PC platform; users of other types of
    machines or of very nonstandard PC keyboards should use xev to find the correct
    keycodes when fixing broken Backspace or Delete keys.


    # # Other Ways to use xmodmap


    There are several other ways to use xmodmap when reconfiguring a keyboard. The
    two most common are the add and remove expressions, which add a key symbol to
    a given modifier map or remove a key symbol from a given modifier map. A modifier
    is a keyboard state, such as being shifted (as normally when the shift keys are
    held down). A modifier is the list of keys that will place the keyboard into that
    state. The most common modifiers for X users are shown in Table 7.1.


    # # Table 7.1 The Most Common Modifier States


    | Modifier | Description |

    | --- | --- |

    | shift | Keys are shifted—appear in uppercase, numbers generate symbols. |

    | lock | Some keys are locked in the shifted state—letters appear in permanently.
    Mostly known as Caps Lock. |

    | control | Key behavior is altered, usually for keyboard shortcuts in applications.
    |

    | mod1 | Key behavior is altered, usually for keyboard shortcuts in applications.
    More commonly known to users as Alt |'
