    # X Runtime Status Utilities


    In addition to the utilities already covered—which are generally designed to accomplish
    some specific task on behalf of the user or allow the user to interact with the
    system in some way—there are many X utilities whose primary function is to relay
    information about the X runtime to the user. Some of these are not installed by
    default with Linux distributions, but they can usually be found on the CD-ROM
    as part of one of the XFree6 packages. The following utilities are installed by
    default when using the canonical XFree86 binary distribution.


    # xdpyinfo


    The xdpyninfo utility enables the user to obtain copious amounts of information
    about a running X display server. The utility provides information about server
    configuration, capabilities, available color depths and visuals, screen display
    size in pixels by pixels, resolution in dots-per-inch, and more. The utility is
    normally called alone on an xterm command line:


    ```

    xdpyinfo

    ```


    If necessary, xdpyninfo can also be called to query a specific display for information.
    The -display argument is used as follows:


    ```

    xdpyinfo -display [host]:server[.screen]

    ```


    When this was, xdpynfo will display information about the specified display rather
    than about the local display. For more information on specifying a display, see
    Chapter 15, "Working on the Network."


    # xfd


    The xfd utility is used to display all the characters in an available X font in
    an easy-to-see format. The utility creates a large window containing the X Logical
    Font Descriptor (XLFD) across the top of the display, a range of valid characters,
    and then a grid containing a single'
  merge: -1
  pgno: 131
- img_proc: true
  md: 'character glyph in each square. For more information on constructing and using
    XLFDs, please refer to Chapter 7. The most common command-line arguments accepted
    by xfd are shown in Table 4.24.


    # Table 4.24 Most Common Arguments Accepted by xfd


    | Argument | Description |

    | -fn font | Specifies the font that should be displayed in the xfd window. This
    argument is required for xfd to start. |

    | -box | Causes xfd to display a box around each character indicating the background
    area for that character. |

    | -center | Causes xfd to center each displayed character glyph in the middle
    of the grid square. |

    | -start n | Causes xfd to start displaying with character n in the upper-left
    corner of the grid. |

    | -bc color | Specifies the color that will be used by xfd to draw the boxes around
    each character when the -box argument has been supplied. |

    | -rows n | Specifies the number of rows that should be present in the grid xfd
    uses to display character glyphs. |

    | -columns n | Specifies the number of columns that should be present in the grid
    xfd uses to display character glyphs. |


    The xfd utility is commonly used as a quick-and-dirty way of examining a font,
    especially if the user needs to examine certain characters within the font. One
    common use is in displaying the list of X cursors:


    ```

    xfd -fn cursor

    ```


    These cursors can then be used from applications or in conjunction with a command
    like xsroot to set the root window cursor. The xfd utility can also be used to
    quickly find the XLFD of an aliased font. For example:


    ```

    xfd -fn fixed

    ```


    This command quickly displays the fixed font and provides the information that
    the proper XLFD for the fixed font is


    ```

    -Misc-Fixed-Medium-R-SemiCondensed--13-120-75-75-C-60-IS08859-1

    ```


    The xfd window can be exited by clicking the Quit button in the upper left of
    the window.'
