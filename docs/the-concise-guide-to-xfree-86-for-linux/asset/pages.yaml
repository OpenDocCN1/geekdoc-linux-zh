  md: '# Chapter 7 Runtime Server Configuration


    Fortunately, there are two ways to shorten the amount of legwork you must do in
    configuring your keyboard in XF86Config. The first, and preferred method for PC
    users using English or Japanese, is the xkbRules and related keywords. The xkbRules
    keyword will allow the X server to construct a configuration for you based on
    one of the entries in a file in the rules/ directory. For example, the following
    set of entries config a Microsoft Natural keyboard for English-speaking Linux:


    ```

    XkbRules "xfree86"

    XkbModel "microsoft"

    XkbLayout "us"

    ```


    The first line instructs X to use keyboard rules from the xfree86 file in the
    rules/. The second line selects the model from the rules file, and the third line
    selects the layout. A list of valid models and layouts for each rules file can
    be found by skipping the file with a pager like more.


    For those who don''t use a workable configuration using the xkbRules method for
    configuring a keyboard, there is another even simpler method. Several predefined
    keyboard mappings have been constructed in the files in the keymap/ directory.
    These files contain sections similar to those in the other files we''ve discussed
    so far, and referencing a particular keymap is a matter of specifying both a file
    and a section. Notice that each section in the keymap files contains five sets,
    one for keycodes, types, compatibility, symbols, and geometry. Thus, a German
    user could simply specify the following line in the XF86Config Keyboard section:


    ```

    XkbKeymap "xfree86(de)"

    ```


    This line simplifies quite a bit; by looking at the de section in the keymap/xfree86
    file, we can see that this single line is equivalent to the following five lines:


    ```

    Xkbcodes "xfree86"

    XkbTypes "default"

    XkbCompat "default"

    XkbSymbols "en_US(pc105)+de"

    XkbGeometry "pc(pc02)"

    ```


    By using one of the predefined keymaps in the keymap/ directory, the user avoids
    having to specify all five lines in XF86Config, and more importantly, avoiding
    to search through the keycodes, symbols, and geometry files by hand for the correct
    settings. On the other hand, this isn''t recommended by the XFree86 team; the
    more correct way should be used whenever possible to ensure that the keyboard
    layout is correctly defined:


    ```

    XkbRules "xfree86"

    XkbModel "microsoft"

    XkbLayout "de"

    ```'
