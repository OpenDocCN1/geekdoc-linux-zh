  md: '# Chapter 8 Runtime Application Configuration


    | Table 8.2 Continued |

    | Resource | Effect |

    | app*foreground: col | Changes the foreground color for all widgets to col. Can
    also appear as Foreground in some cases. |

    | app*font: XLFD | Changes the font for all widgets to the X font description
    given by XLFD. |

    | app*height: n | Sets the default height of the application window to n pixels.
    Can also be used to set the height of specific widgets. |

    | app*width: n | Sets the default width of the application window to n pixels.
    Can also be used to set the width of specific widgets. |

    | app*x: n | Sets the default location of the application window to n pixels from
    the left edge of the screen. Can also be used to set the position of specific
    widgets within their parents. |

    | app*y: n | Sets the default location of the application window to n pixels from
    the top edge of the screen. Can also be used to set the position of specific widgets
    within their parents. |

    | app*title: text | Sets the title of the application window to text.


    An example using all the resources in Table 8.2 serves to illustrate their uses.
    To configure a yellow-on-blue xterm window titled My Terminal using a 14-point
    Courier font and red borders two pixels thick, which by default starts as a 100x50
    window at a location of 1,1 on the display, the following resources would be:


    ```

    xterm*borderColor: red\xterm*borderWidth: 2\xterm*background: blue\xterm*foreground:
    yellow\xterm*font: -courier-bold-r-normal-*-14-*-*-.*-*-.*-*-...*\xterm*height:
    50\xterm*width: 100\xterm*x: 1\xterm*y: 1\xterm*title: My Terminal

    ```


    These few resources, which affect the basics of appearance and behavior during
    application launch, cover the majority of user configuration desires quite nicely;
    most people just want to be able to make X applications suit their tastes in terms
    of appearance and start at a predefined size and location on the display.'
