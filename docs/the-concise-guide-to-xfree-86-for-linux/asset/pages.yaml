    # Major Files and Components


    The specific list of files included with an XFree86 release (especially the list
    of X servers) varies from platform to platform. Because this text is primarily
    about Linux versions of XFree86, this chapter will give details with respect to
    Linux systems in this section.


    Because the X server and the X clients are such important parts of XFree86, accounting
    for nearly all the "direct contact" a user will make with X, is tempting to split
    the XFree86 distribution into two major pieces: the server and the X clients.
    In truth, there''s more to an X distribution than just the server and the applications
    that will run on it. Even so, the X server is probably the most important part
    of the XFree86 distribution (it certainly requires the largest amount of configuration),
    this chapter covers servers first before moving on to the rest of XFree86 components.


    Note that any of the list included with an XFree86 distribution for Linux can
    appear in one of several formats. The .tgz format refers to a zipped, tarred file,
    commonly considered to be a generic Linux packaging format. The information in
    the rest of this section applies to the "canonical" binary XFree86 distribution
    maintained in .tgz format at the ftp.xfree86.org FTP site.


    Many operating systems include XFree86 in other formats (such as .rpm or .deb)
    and may break the components into smaller packages or merge two more packages
    into a single larger package. Thus, the following guidelines might not exactly
    match all Linux systems, but they do match the XFree86 distribution from the XFree86
    Project.


    # XFree86 Servers


    The list of separate XFree86 servers is actually quite short, given the wide range
    and variety apparent in the PC graphics hardware market today. Fortunately, the
    XFree86 project manages to support a long list of graphics hardware with this
    short list of X servers. The list in Table 2.2 is complete, but general. For a
    specific list of supported graphics hardware under Linux, please refer to Appendix
    B, "XFree86 3.3.5 Details."'
