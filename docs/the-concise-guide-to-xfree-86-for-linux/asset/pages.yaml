  md: '# KDE/GNOME/X ISSUES

    AND OTHER LINUX

    ENVIRONMENTS


    It isn’t always easy to understand the way in which GNOME and KDE fit with the
    rest of the X Window System and the more traditional components of XFree86. It
    is important to be able to use existing X applications with GNOME and KDE without
    having to modify or recompile them. Furthermore, GNOME and KDE might not be for
    everybody—they both have serious resource use issues for some users, and they
    simply won’t run on older distributions.


    It is important for users in this situation to have alternatives to the GNOME
    and KDE desktops.


    # KDE/GNOME, XFree86, and Other X Software


    Using KDE or GNOME with XFree86 is, generally speaking, a smooth sailing of a
    proposition. Most users will have few problems integrating KDE or GNOME in with
    their normal X patterns, especially if their Linux distribution shipped with KDE
    or GNOME as the default desktop. However, there are some caveats of which users
    must be aware in order to maximize their Linux and XFree86 experiences.'
  merge: -1
  pgno: 310
- img_proc: true
  md: '# Resource Availability


    It is widely known that KDE and gnome consume large amounts of system resources,
    from hard disk storage to memory and swap space. What is not widely understood,
    however, is that many of these resource requirements stem from KDE and gnome in
    addition to other X applications.


    # Recompiling to Update Shared Library Dependencies


    The common-by-hand installation of KDE or gnome, especially when compiled from
    source, tends to lead a system with many duplicate libraries. For example, gnome
    1.0 requires late versions of the Gtk+, whereas many earlier Linux distributions
    shipped with a GIMP 1.0 application require the much earlier Gtk 1.0 library.
    In such installations, running GIMP inside gnome means leading two separate versions
    of the Gtk library and two separate versions of the Glib, in addition to the environment
    itself and the program binary.


    The solution to this problem is to attempt to make library dependencies whenever
    possible. If you were skilled enough to compile gnome on your own, consider uninstalling
    your older GIMP installation and recompiling it to use the newer Gtk+ Glib libraries
    installed by gnome, especially if you find yourself short on resources or wanting
    maximum speed and efficiency from the resources you install. A search through
    the `/usr/X118/bin` directory with the tree usually reveals several applications
    that depend on older versions of Gtk, Glib, Qt, or graphics libraries that have
    been updated by kde or gnome. Recompiling these applications from source to the
    newer libraries can mean megabytes of savings at runtime.


    # Choosing Applications from the Environment


    Even without recompiling, it is possible to realize some efficiency just by observing
    which libraries are in use and attempting to choose applications that don''t load
    additional shared libraries or library code.


    For example, the Netscape browser is a perennial favorite among Linux users but
    is rather large and cumbersome in terms of memory requirements. In most cases,
    the kfm manager will render Web pages and more than adequately for general-purpose
    use. Using kfm within the kde desktop to browse Web pages incurs minimal memory
    penalties, whereas loading Netscape incurs substantial penalties of this kind.
    Similarly, gnome''s own spreadsheet, numeric uses the shared gnome libraries,
    avoiding the need for additional library code when compared to spreadsheets that
    are based on other APIs, such as Wings.


    Even smaller applications can have significant impacts when they are considered
    together. Instead of using XMail, considering Balsa if you are a gnome user or
    KMail if you are a KDE user, try to get by with kedit or geist for simple editing
    tasks. The goal is to use tools from the environment whenever possible, avoiding
    the need to fill system memory code from other shared libraries just to run a
    single application.'
  merge: -1
  pgno: 311
- img_proc: true
  md: '# GNOME and KDE Applications Outside GNOME or KDE


    There exists a common misconception among Linux users that after an application
    is written using the KDE or GNOME APIs, the users of the application are locked
    in the environment in question if the application is needed.


    This isn''t actually the case; it isn''t necessary to actually use the entire
    GNOME environment if you only want to use the numeric spreadsheet—it is merely
    necessary that the necessary GNOME shared libraries are available to the dynamic
    linker and that the numeric binary be installed somewhere in your binary path.
    In short, it is only necessary that certain parts of GNOME be installed in order
    for you to use GNOME. Once installed, it is perfectly legal to call an application
    from GNOME or KDE from within a normal X session managed by a simple window manager
    of one kind another.


    That said, there are some things to understand. First, applications that require
    a high degree of integration with the environment might not function correctly.
    For example, items that dock into the KDE''s panel will have nowhere to dock when
    the panel is absent and thus show up as windows on display. In rare cases, an
    application might not work if it requires significant amounts of interaction with
    its own environment. In most cases, however, applications from GNOME or KDE will
    run without serious problems on desktops where the entire environment isn''t running.


    The next thing to understand about running KDE and GNOME environments is that
    many of the same resource and performance penalties will still apply if you are
    running only a single application from the environment in question. This is because
    many of the resource requirements of these environments are due to large numbers
    of shared libraries that must be loaded at runtime. Whether you are running the
    entire environment or just one application from a larger environment, the libraries
    must still be loaded. In a sense, even if, you are running only a single KDE application,
    a large part of the entire environment will still be used in memory while the
    application executes.


    # Appearance and X Resources


    Those who choose to run non-KDE or non-GNOME applications while in the KDE or
    GNOME environment will discover that the KDE or GNOME appearance, behavior, and
    style hints won''t affect non-KDE or non-GNOME applications. That is to say when
    you change the current Theme in the GNOME Control Center, you will find that all
    of your running GNOME applications update themselves to reflect the new appearance
    you''ve selected, non-GNOME applications like Netscape remain unchanged in their
    appearance.


    Thus, running nonenvironment applications while in an integrated environment can
    have the effect of nullifying one of the benefits of the integrated environment:
    the unification (fragmentation) of the desktop and its appearance and use.'
  merge: -1
