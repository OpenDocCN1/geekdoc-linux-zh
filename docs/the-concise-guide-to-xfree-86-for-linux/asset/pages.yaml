  md: '# Chapter 14 Display Managers


    There are many Kill configuration options, and it is generally necessary to specify
    them all. The maze of default values for each of the options is confusing, and
    some of the documentation comes with gdm is incorrect with regard to the default
    values. It is thus safer to specify all values explicitly.


    # The Init/ Directory


    The Init/ directory given by the DisplayInitDir in Table 14.7 contains scripts
    that will be run after the X server has started but before the greeter window
    is displayed; it is similar in purpose to the Xsetup scripts used by xdm.


    Each display will try to run a script named after itself in the Init/ directory.
    For example, the first local display will attempt to run a script with :0 as its
    filename in the Init/ directory, the second display will call :1, and so on.


    If the KillClient= option has been specified in the gdm.conf file, all clients
    started by the scripts in the Init/ directory will be killed when a user actually
    logs in.


    If no script matching the name of the current display can be found, a script called
    Default the Init/ directory will be run instead to configure the display.


    Note that the Init/ scripts are not mandatory and can be omitted if such functionality
    isn''t needed or desired.


    # The PreSession/ and PostSession/ Directories


    After a user has authenticated him- or herself, gdm will attempt to start a script
    named after the current display in the PreSession/ directory given by the PreSessionScriptDir
    option in Table 14.7. So, for example, a user logging in on the first display
    would allow gdm to execute the file at PreSession/:0. If no script matching the
    local display name can be found, the script Default will be used instead.


    The PreSession/ scripts are used to perform user-oriented tasks as merging resources
    with xrd, starting clients that need to be launched at login, and so on. Note
    that the controlling process (that is, window manager or environment) should not
    be started from the PreSession/ scripts, but from the Session/ scripts that are
    described in the next session.


    The PostSession/ scripts, located in the directory given by the PostSessionScriptDir
    option in Table 14.7, are synonymous with the Session/ scripts in that they are
    named after the display and will be executed when the user logs out. If no script
    matching the display name can be found in the PostSession/ directory, the script
    Default will be started instead.


    Note that the PreSession/ and PostSession/ scripts are not mandatory and that
    either or both can be omitted if such functionality isn''t needed or desired.'
  merge: -1
  pgno: 339
- img_proc: true
  md: '# The GNOME Display Manager (gdm) 325


    # The Session/ Directory


    After the PreSession/ script has executed, gdm will execute a script from the
    Session/ directory given by the SessionDir option in Table 14.7. This script should
    start the controlling process for the session (that is, window manager or environment).
    The script gdm chooses to execute depends on the session type the user chose at
    the gdm login. The list of session types available is built by listing all the
    scripts in the Session/ directory.


    If the user doesn''t choose a session, but instead leaves the choice blank, the
    script called Default will be executed. If there is no Default script, the first
    found will be executed.


    There must be at least one script in the Session/ directory for gdm to be able
    to start an X session for a user after he or she has authenticated him or herself.


    # Starting gdm


    As the case with kdm, gdm is a simple daemon to start. First, to test out the
    configuration and make sure gdm is functioning properly, call it at root:


    ```

    gdm

    ```


    After you are satisfied with the results and are able to log in and start sessions
    at will, you might want to add gdm to your init process and use it as your display
    manager of choice.


    # Troubleshooting


    Unfortunately, gdm, like much of GNOME, is currently a work in progress. Several
    well-documented bugs often affect gdm, particularly when it is running on Linux
    distributions other than Red Hat Linux.


    If you''re having getting gdm to work, verify the ownership of (gdm,gdm), access
    permissions, and locations of all the files listed in the gdm configuration file.
    Double-check all scripts and check to make sure the gdm, gdmgreeter, and gdmchooser
    binaries are intact.


    As a last resort, asim apropi gdm users have resorted to using kdm or xdm instead
    because some systems simply refuses to work, even though the packages that installed
    it were built by distribution maintainers. The second version of gdm will fix
    many of these problems, but unfortunately, it is still under development and isn''t
    ready for widespread use.


    # For More Information


    For more information on using and configuring the GNOME display manager, gdm,
    please visit the doc/ subtree of your GNOME installation directory tree and read
    the file gdm-manual.txt.'
