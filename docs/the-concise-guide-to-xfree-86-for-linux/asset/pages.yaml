    - Key F12 A A CirculateDown


    One important caveat should be understood when creating keyboard bindings. Some
    need certain keystrokes (such as function keys) to operate. If you''ve bound a
    window manager function and find yourself using an application that requires you
    to press the F11 key, the binding makes it impossible to send F11 to the application.


    # fwwm 1 User-Defined Functions


    Although the list of built-in fwwm functions is extensive, it is sometimes helpful
    to be able to define one''s own functions that can then be bound to mouse or keyboard
    activity. User-defined functions are created using the Function and EndFunction
    keyword pair, and are defined using the following structure:


    ```

    Function "FunctionName"

    InternalFunc "trigger" arguments

    InternalFunc "trigger" arguments


    EndFunction

    ```


    In the preceding structure, InternalFunc represents any of the internal fwwm functions
    outlined or an already defined user function. The arguments are those expected
    by the built-in function, where necessary, and the trigger is one of the events
    listed in Table 9.11.


    Table 9.11 fwwm Function Triggers

    | Trigger | Description |

    | --- | --- |

    | Immediate | Calls the function without condition. |

    | Motion | Calls the function if pointer motion is detected. |

    | Click | Calls the function if the mouse is clicked but no pointer motion is
    detected. |

    | DoubleClick | Calls the function if a double-click is detected. |'
