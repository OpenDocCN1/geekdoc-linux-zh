  md: '# Chapter 16 Tunneling Through ssh (Secure Shell)


    The default location for the ssh daemon binary is in /usr/local/sbin, and the
    default location for the other ssh binaries is /usr/local/bin. The manual pages
    will be installed in /usr/local/man, and the configuration files and key files
    that ssh has built for the machine can be seen by typing


    ```

    ls /etc/*

    ```


    After make install has been run this way, ssh is completely configured for general-purpose
    use in most cases.


    # Configuring the Secure Shell


    The most important components of the secure shell package are ssh, the program
    that will initiate connections, and sshd, the program that will accept incoming
    connections requested by an ssh on a remote machine. For our purposes, configuring
    the secure shell package is a matter of configuring the ssh and sshd binaries.


    Usually, the configuration, as installed by default, will be adequate. In some
    cases, however, it will be necessary to edit the ssh and sshd configuration files
    for your local circumstances; if you plan to use ssh for multiple tasks on the
    system outside the X protocol, or if you want to restrict access to ssh to a specific
    group of users.


    # Configuring sshd


    The primary method for altering the behavior of the sshd daemon is by editing
    the configuration file that should normally located at /etc/sshd_config. The file
    is formatted simply as a list of keyword and value pairs, one per line. Lines
    that begin with the hash (#) character are assumed to be comments and ignored.
    Some of the common keywords known to sshd 1.2.x are seen in Table 16.1.


    Table 16.1 Common Keywords Known to sshd


    | Keyword | Description |

    |---|---|

    | AllowGroups ptn, ptn, ... | Allows only users whose primary group name matches
    one of the supplied patterns to connect. |

    | AllowHosts ptn, ptn, ... | Allows only hosts whose names match one of the supplied
    patterns to connect. |

    | AllowUsers ptn, ptn, ... | Allows only users whose names match one of the supplied
    patterns to connect. Patterns will match either accounts or user@host format strings.
    |

    | DenyGroups ptn, ptn, ... | Denies groups whose names match the supplied pattern''s
    connections. |

    | DenyHosts ptn, ptn, ... | Denies hosts whose names match the supplied pattern''s
    connections. |'
