  md: '# The GNOME Display Manager (gdm) 321


    or at least locate where it should be. First, using the locate command to try
    to find an existing gdm.conf file:


    ```

    locate gdm.conf

    ```


    If this command doesn''t turn up any useful result, simply try running the gdm
    binary on the command line with root privileges and make a note of the error message
    you receive:


