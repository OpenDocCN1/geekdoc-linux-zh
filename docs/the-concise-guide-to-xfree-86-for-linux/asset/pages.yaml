- img_proc: true
  md: '# Changing the View


    The kfm manager window provides several different views and properties that cover
    nearly every possible user-desired contingency when it comes to browsing the filesystem.
    All these changes are made from the View drop-down menu at the top of a kfm window.
    The contents of this menu are detailed in Table 11.2.


    Table 11.2 Contents of the kfm View Drop-Down Menu

    | Item | Description |

    | Show Hidden Files | Causes hidden files (those whose names begin with a period)
    to appear in the kfm window when browsing files. |

    | Show Tree | Causes the window to be split horizontally and a directory tree
    view to be displayed the left side of the window to aid in navigation. |

    | Show Thumbnails | Causes files that are known formats to appear as thumbnail
    images in the browser for easier identification. |

    | HTML View | Allows kfm to emulate a Web server locally; when visiting a directory,
    it will first check to see whether the file index.html exists. If it does, kfm
    will view the file as a Web page and allow the user to browse it in that capacity.
    |

    | Icon View | Displaces files as icons in the main kfm window, with a text annotation
    beneath each icon. |

    | Text View | Displaces files in a text listing (but not identical) to the one
    generated by the ls -command. |

    | Long View | Displays files in a text listing similar to the one given by Text
    View, but with more information about each file. |

    | Short View | Displays files in a text listing one line at a time in the same
    manner as Text View and Long View, but without all the extra information, just
    the filename and mini-icon. |


    By using some or all of these options in various combinations, the user can browse
    any given directory in a filesystem in a variety of ways.


    # Adding a Background Pixmap


    Any directory that can be browsed by kfm can be displayed with a background image
    behind the icons or file information. Each window has its own pixmap, and the
    image will be remembered each time the directory is visited.'
  merge: -1
  pgno: 282
- img_proc: true
  md: 'To add a background pixmap to the display for a specific directory, right-click
    in the kfm window (but not on any icon or file) and select Properties from the
    menu that appears. In the dialog that appears, select the Dir tab. On the resulting
    pane, there is a drop-down list from which the user can choose a background image
    for the directory in question. The background image will remain in effect whenever
    the directory is visited until this configuration dialog is revisited and Default
    is selected.


    # Browsing URLs and Linking Them from the Desktop


    kfm windows have the capability to act as rather powerful HTML (Web page) browsers
    on the Internet, thanks to KDE''s network-centric design and philosophy. Visiting
    a URL in an open kfm window is a simple thing to do: Simply Enter the URL you
    want to visit in the Location box and press Enter.


    Web pages appear just as they would in Netscape Communicator or another browser,
    and links can be followed and forms filled out in the same way. When viewing ftp
    sites, kfm can be used to drag-and-drop files from the ftp site to local locations
    between kfm windows or between a kfm window and the desktop. Bookmarks can be
    added using the Ctrl+B keystroke in the kfm window or by using the Bookmarks drop-down
    menu at the top of the window.


    Having to open a window with a local icon and then enter a Web page, however,
    is slightly inconvenient, so kfm makes it possible to link directly to a URL from
    an icon. To create a kfm ftp URL, right-click on the desktop and choose New, FTP
    URL. In the pop-up dialog that appears, enter the (English) name of the ftp site
    followed by .kdelink as the extension. To create an hftp URL, follow the same
    procedure but select New, World Wide Web URL instead from the pop-up menu.


    Entering the English name of the .kdelink file into the dialog box, for either
    an ftp URL or an hftp URL appears on the desktop, as shown in Figure 11.8, later
    this chapter. It does not yet, however, to point to this specific address. To
    cause the icon to point to a specific address, right-click and select Properties
    from the context menu. In the dialog that appears, select the URL tab and enter
    the full URL into the box provided. When you''finished, click the OK button at
    the bottom of the dialog.


    Clicking on the ftp or WWW window now opens a new kfm window and loads the specified
    URL into the window for browsing, or (in the case of hftp) remote file management.


    # General KDE Tips and Tricks


    The KDE is a very large and complex environment; it is impossible to discuss the
    entire environment in a text like this one. Still, a few tips or tricks that aren''t
    initially obvious might be beneficial to the average user.'
  merge: -1
  pgno: 283
- img_proc: true
  md: '# Using a Different Window Manager


    Although KDE includes its own window manager, kwm or krootwm depending on your
    KDE version, which we''ve already discussed, it is possible to use other window
    managers with KDE in conjunction with the other KDE components, kfm and kane1.
    Although integration isn''t always as good as it is with kwm or krootwm, it is
    improving daily.


    The most popular alternative to the default KDE window manager is the Window Maker
    window manager that can be found at http://www.windowmaker.com. Window Maker''s
    later versions support KDE integration and thus work well in a KDE environment
    when started inside kwm or krootwm.


    The next alternative to the default KDE window manager is Blackbox, a light, efficient
    window manager with a personality all its own. Blackbox can be found on the Internet
    at http://blackbox-wiv.org. Like Window Manager, Blackbox supports partial KDE
    integration enough to replace the kwm or krootwm.


    In both of these cases, the window manager in question will almost certainly need
    to be recompiled with special options to integrate properly with KDE. Thus, see
    the documentation included with each window manager''s source instructions for
    compiling for KDE interoperability.


    When starting KDE with one of these window managers, call the window manager in
    the .xinitrc file before the call to startx; this will cause the kwm or krootwm
    to abort because a window manager is already running, leaving the replacement
    window manager running in its place.


    # Adding Icons, Wallpaper, or Sounds to KDE


    There are many dialogues and option boxes in KDE where the user is asked to select
    an icon or a wallpaper image for the purpose at hand. There is rarely a Browse
    button to go along with the supplied icons, however, so it is unclear how new
    icons should be added.


    The KDE maintains its global files in a directory such as /opt/kde,/usr/local/kde,
    or /usr/kde. To find where your KDE''s installation is, you''ll have to check
    the packages that your distribution installed. After you know the location of
    your KDE installation''s global directories, you can easily globally add icons
    and wallpaper images as root.


    The share/icons directory off the main kde directory contains the icons that will
    be available to the user when he she is asked in a dialog to select an icon. KDE
    icons are normally supplied in X pixmap (.xpm) format. The share/wallpapers directory
    contains the wallpapers that will be available when configuring desktop properties
    or setting wallpaper backgrounds for kfm file windows. KDE wallpaper images are
    normally supplied in JPEG (.jpg) format.'
  merge: -1
  pgno: 284
- img_proc: true
  md: '# 270 Chapter 11 The KDE 1.1.1 Environment


    Note that because both of these directories are in the global KDE tree, they are
    owned by the root user, and additions to these directories will be visible to
    all KDE users on a multiuser system. To add icons or wallpaper on a user-specific
    basis, corresponding local KDE directories exist in $HOME/.kde/icons and $HOME/.kde/share/wallpapers.
    These are the directories that should be used for per-user icon and wallpaper
    installations.


    The corresponding directories for adding sounds to KDE are the share/sounds directory
    off the global KDE tree and the $HOME/.kde/share/sounds directory. Sound files
    are normally supplied in .wav format.


    # Editing KDE Menus


    The K Menu and its submenus are usually fairly exhaustive and contain all the
    KDE applications plus (if KDE has been correctly installed) many of the non-KDE
    X applications present on your system. Still, there are times when it is helpful
    to edit the K Menu and other menus.


    The global K Menu is the same for all users and is stored in the global KDE directory
    tree; it can thus (naturally) be edited by the superuser. However, each user also
    has a personal menu that he or she can edit, which normally appears as a submenu
    off the K Menu, though it can be made to appear in place of the K Menu using the
    control center.


    To edit a set of menus, either locally or globally, start the KDE menu editor
    from the K Menu, Utilities submenu (see Figure 11.8).


    ![](img/edb2a4591eafaad74c22be9075f4b815_285_0.png)


    Figure 11.8 The KDE menu editor.'
  merge: -1
  pgno: 285
- img_proc: true
  md: '# Learning More About KDE


    On the left side of the KDE menu editor is the user’s local menu, which initially
    appears only as the word EMPTY. On the right side of the KDE menu editor is the
    global KDE menu. A personalized menu can be constructed by dragging menus or menu
    items from the global menu on the right into the personal menu on the left.


    In addition, new items can be added to the local menu by right-clicking on the
    menu and choosing New to generate a new EMPTY entry, then right clicking on that
    entry and choosing to bring up a configuration dialog box for that menu entry.
    After the local structure has been defined to user satisfaction, choosing Save
    from the File drop-down menu will save the changes to the user’s account.


    To change the name under which the user’s local menu will appear in the K Menu,
    choose the Change Menename option from the Options drop-down box at the top of
    the menu editor window.


    # Learning More About KDE


    There are more tricks to KDE than we could ever possibly cover in a chapter like
    this, and we haven’t even tried to cover the simple configuration and use basics
    at all. For more tutorial-style information on using KDE, see the KDE help system
    or, for those who prefer more depth, check out Sams Teach Yourself KDE in 24 Hours.'
  merge: -1
