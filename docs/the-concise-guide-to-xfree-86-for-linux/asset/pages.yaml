  md: "# XFree86 Clients and Libraries\n\nAside from the X server, the next most visible\
    \ and used parts of the X Window System are the standard X clients (applications\
    \ and utilities) and the X shared libraries, which hold a great deal of the X\
    \ client and server functionality. The standard X clients include a large number\
    \ of utilities, tools, and things like a basic window manager (twm) and graphical\
    \ terminal (xterm). The clients and libraries are contained in the following two\
    \ packages, which overlap:\n\n+   * Xbin.tgz: Contains most of the standard X\
    \ clients and libraries. Examples from this package include Imake, xclock, twm,\
    \ xdm, xman, xmag, and libraries like the Athena widgets and the X11 library (libXaw).\n\
    \  * Install Subtrees: bin/\n  * Install Priority: Required\n* Xshlib.tgz: Contains\
    \ the same libraries included in Xbin.tgz, without all of the clients.\n  * Install\
    \ Subtree: lib/\n  * Install Priority: When needed\n\n# XFree86 Fonts\n\nAfter\
    \ the X server, which controls the display hardware, and the X clients, which\
    \ interact directly with the user, the next most visible XFree86 components are\
    \ the fonts. XFree86 includes a complete set of bitmapped fonts, including proportional\
    \ serif and sans serif fonts as well as a Courier font and several other fixed-width\
    \ fonts. XFree86 fonts are found in the following XFree86 packages:\n\n+   * X100.tgz:\
    \ The 100 dpi (dots per inch) bitmapped fonts are contained in this package. These\
    \ fonts aren't designed to be scalable; instead, they come in predefined sizes\
    \ and typefaces and are sized for users who specify that they have a 100 dpi display.\n\
    \  * Install Subtree: lib/X11/fonts/100dpi/\n  * Install Priority: Recommended\n\
    * Xfr.tgz: These are the Cyric fonts for XFree86. They are of interest to users\
    \ in eastern Europe but will not be of interest to other users around the world.\n\
    \  * Install Subtree: lib/X11/fonts/cyrillic/\n  * Install Priority: When needed\n\
    * Xfnon.tgz: Other non-English fonts can be found here, including some fonts for\
    \ Big5 and GB (Chinese) displays and some Japanese and Hebrew fonts as well.\n\
    \  * Install Subtree: lib/X11/fonts/misc/\n  * Install Priority: When needed\n\
    * Xfnts.tgz: The 75 dpi bitmapped fonts are contained in this package. These fonts,\
    \ like the fonts in X100.tgz aren't designed to be scalable and come in pre-rendered"
