- img_proc: true
  md: 'That said, it should be noted that the KDE 1.1 and later releases have the
    capability to make certain applications (those based on the Xt intrinsics, Athena
    widgets, or Motif API) appear to obey KDE style and appearance hints. Such changes
    are superficial, however, are accomplished by setting X resources in much the
    same way that we were able to do using the edits command in Chapter 8, "Runtime
    Application Configuration." The widgets in such applications will still not behave
    as the KDE widgets do, and some changes to KDE styles, as selecting whether emulate
    the Windows appearance or the Motif appearance, will have no effect on non-KDE
    applications at all. Furthermore, KDE won''t always get the resource right, leaving
    some applications with strange, even broken appearances.


    The only way to unify a desktop in Linux is to choose an integrated environment
    and then whenever possible to use the applications that are based on the chosen
    environment''s API.


    # KDE and GNOME Together


    Because KDE and GNOME are two separate environments with separate APIs and separate
    applications, it is common to wonder whether KDE and GNOME can be integrated together
    with each other with any degree of sincerity. This is an important question because
    it speaks to the heart of future Linux growth prospects, as more and more applications
    will be written for one or the other environment.


    The bad news is that, at this point, no real interoperability of any kind exists
    between KDE and GNOME; drag-and-drop operations between mice and them, for example,
    won''t work. Objects from KDE applications cannot be embedded into GNOME windows
    and vice versa. At the moment, it is generally necessary to choose one or the
    other for a fully integrated desktop.


    The good news is that projects are underway as this text is being written to allow
    KDE and GNOME to operate better. A common drag-and-drop protocol is a major goal,
    and there is a great deal of talk about making the KDE and GNOME object requests
    compatible so that application integration between the two environments will be
    complete.


    For the moment, as the preceding paragraphs intimated, it is possible to install
    both sets of libraries and both on the same system but in different directory
    trees, the user find it necessary to run specific applications from both environments.
    Understand, however, that only one environment can be running at a time (though
    applications from both environments can run simultaneously), and that applications
    from disparate environments will at this point enjoy little interaction with each
    other. Understand also that running KDE and GNOME applications simultaneously
    is really the same as begging your computer to grind to a screeching halt—definitely
    installing at least 128 megabytes of memory if you plan to run one or the other
    environment and use applications from both.'
  merge: -1
  pgno: 313
- img_proc: true
  md: '# Environments for Special Situations


    Although KDE and GNOME are the most popular integrated environments for Linux
    today and are generally considered to be the wave of the future as Linux and the
    growth of Linux are concerned, KDE and GNOME don''t always fit the requirements
    of every situation or need. In such cases, two other integrated environments are
    currently available to Linux users that better fulfill certain criteria.


    # OpenWindows (XView)


    The Sun Microsystems OpenWindows environment was one of the first integrated environments
    available for the X Window System. Though no longer maintained or installed with
    most systems today, OpenWindows retains a large amount of utility and requires
    significantly fewer resources to operate than, modern environments like KDE and
    GNOME. OpenWindows has an appealing, three-dimensional appearance in full color
    and a large number of applications are available to those using OpenWindows on
    a regular basis. A typical OpenWindows desktop is shown in Figure 13.1.


    ![](img/edb2a4591eafaad74c22be9075f4b815_314_0.png)


    Figure 13.1 The OpenWindows desktop, as XView in the Linux world, is resource-friendly,
    has many applications, and sports a pleasing three-dimensional appearance.'
  merge: -1
  pgno: 314
- img_proc: true
  md: '# Chapter 13 KDE/GNOME/X Issues and Other Linux Environments


    # Getting XView


    Luckily, Sun Microsystems released the OpenWindows code toward the end of its
    life cycle as a free software, source-code-available product called XView, which
    was actually included with many early Linux distributions as an integrated environment
    option. Many Linux users will find that they already have or some components of
    the OpenWindows/XView desktop installed at the /usr/openwin tree. Others will
    find packages on searching the CD-ROM by searching the package directory like
    this:


    ```

    ls *view*

    ```


    For without an existing /usr/openwin tree or any XView packages on the Linux CD-ROM,
    the XView environment and related applications can be downloaded from the following
    sites:


    +   - http://metalab.unc.edu/pub/X11/libs/xview/

    - http://metalab.unc.edu/pub/X11/Openlook/

    - step.polymtl.ca/-coyote/xview_main.html


    All the files at these sites are provided as source code only, with the exception
    of one or two application binaries. In general, if you want a complete XView environment
    for your Linux box these days, you must compile it yourself. Beware: These sources
    precede the existence of GNU tools that make compilations easy; Compiling XView
    from source is a job best tackled by those who have previous UNIX programming
    or compiling experience. Always take time to read README or similar files included
    with each source distribution.


    # Starting XView


    The easiest way to launch the OpenWindows/XView environment is to run the following
    command from a console login, taking care to ensure that the /usr/openwin/bin
    directory is in your path:


    ```

    openwin

    ```


    This command, which is similar in concept to the startx command discussed in earlier
    chapters, starts the X server at the default color and resolution. The command
    starts several XView clients, including one of the XView window managers, olwm
    (for a standard desktop) or olvm (for virtual desktop capability).


    Those who don''t want to use the openwin command to launch XView can generally
    get by using the traditional startx command in conjunction with the $HOME/.xrc
    script—simply insert a call to either olwm or olvm at the end of your script that
    the XView window manager is the controlling process for the session.'
  merge: -1
  pgno: 315
- img_proc: true
  md: 'Once inside XView, the best way to maintain desktop integration is simply to
    use XView binaries in place of X binaries—cmdtool instead of xterm, textedit instead
    of xedit, and so on. A list of available binaries can be found by browsing the
    /usr/openwin/bin directory, which by convention contains all the binaries for
    the XView environment.


    # Configuring XView


    A complete detail on configuring the XView environment is beyond the scope of
    this text and has a lot to do with configuring the related window manager. For
    details, see the manuals for olwm or olwm. To configure the appearance of the
    XView desktop along one or two aspects of keyboard, mouse, and widget behavior,
    however, other tools applies.


    The configuration tool, known as props, is usually called from the root menu (which
    can be displayed by right-clicking over the root window). An option labeled Configure
    or Properties is generally present in the default configuration and launches the
    configuration application. In the absence of such an option, however, props can
    be called by hand:


    ```

    /usr/openwin/bin/props

    ```


    Note that the absolute path can be omitted if the /usr/openwin/bin directory is
    in your binary search path.


    # More Information About XView


    Unfortunately, precious little printed information is available for the XView
    environment anymore, largely because most XView texts went out of print shortly
    after Sun Microsystems decided to halt development on the XView environment. There
    might still be one or two XView use and programming texts out there, however,
    especially at college and university libraries where UNIX workstations have been
    used over the years.


    The best approximation of online XView documentation is the OpenLook FAQ, available
    at either of the following links:


    ```

    http://ftp.math.psu.edu/pub/FAQ/


    http://step.polymtl.ca/-coyote/open-look/index.html

    ```


    Regrettably, the XView source code is becoming outdated, and smaller and smaller.
    XView is best used only by those who need a small, memory-friendly environment
    with very basic development capability, who don''t have any need for access to
    current software or newer software technologies.'
  merge: -1
