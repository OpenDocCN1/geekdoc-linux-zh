  md: '# 11


    # THE KDE 1.1.1

    ENVIRONMENT


    After KDE is installed, navigating the KDE system and getting work done is pretty
    simple. Even so, most users will want to ensure that they can accomplish the same
    basic configuration tasks in KDE that they can accomplish with standalone X window
    managers. Furthermore, if you don''t already have KDE installed, a little installation
    hand-handling can be helpful.


    # KDE Basics: Getting, Installing, Starting, Configuring


    The KDE home page on the World Wide Web is located at http://www.kde.org. Users
    interested in downloading the KDE should have at least 100 megabytes of free disk
    space, and really more is required in order for a smooth installation and comfortable
    use to be possible. The location for downloading KDE is at ftp://ftp.kde.org/pub/kde/stable.
    Mirrors are maintained in many countries; to access them, insert the twoletter
    code for your country after the ftp. For example, the US mirror is located at
    ftp.us.kde.org. Downloadable packages exist for Debian Linux, S.U.S.E. Linux,
    Red Hat Linux, Caldera OpenLinux, Slackware Linux, and other Linux and non-Linux
    operating systems.'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# KDE from Binary Packages


    Most of the platform- or distribution-specific KDE packages include all the components
    listed in Table 11.1. Packages for some distributions differ; in such cases, README
    or other text files are generally present in the binary package directory providing
    specific instructions for installing the KDE on the platform in question.


    Table 11.1 Major Packages

    | Package | Description |

    | --- | --- |

    | kdesupport | Includes all the basic library support that is required for KDE
    operation but is not actually a part of the KDE, such as graphic image format
    libraries. |

    | kdelibs | The basic group of KDE libraries, which together support applications
    using the KDE API. |

    | kdebase | Basic KDE components such as the window manager, file manager, and
    icons. |

    | kdegames | Written for the KDE environment using the KDE API. |

    | kdegraphics | Graphics-oriented applications written for the KDE environment
    using the KDE API. |

    | kdenetwork | Tools associated with network status and configuration, as well
    as dial-up tools, mail clients, and so on. |

    | ktoys | Toys and fun applications that aren''t games but aren''t otherwise useful.
    |

    | kdeultimedia | Multimedia applications such as sound players and recorders,
    movie viewers, and so on. |

    | kdeutils | KDE utilities. These are basic desktop tools like a Notepad, a floppy
    disk for and so on |


    Several packages listed in Table 11.1 are order-important, and if installed incorrectly,
    will cause KDE to fail to function correctly. It is important to install the kdesupport
    package first, followed by the kdelibs and kdebase packages. After these three
    packages have been installed in this order, the other packages can generally be
    installed in any order without any ill effects. After all the packages have been
    installed, it might be necessary to add the path to the KDE environment to your
    path before it can be used.


    # KDE from Source


    KDE is also available in source code rather than as a set of binary packages.
    Compiling from source gives users extra control that isn''t present when installing
    from packages. The source to the current version of KDE is generally located in
    the ftp directory tree for the binary versions, on source subtree. The relevant
    source packages are the same ones listed in Table 11.1; they can simply be downloaded
    to the hard drive.'
  merge: -1
  pgno: 271
- img_proc: true
  md: '# KDE Basics: Getting, Installing, Starting, Configuring 257


    After all the source files have been downloaded, they must be extracted and compiled.
    The most common way to do this is with the following series of commands:


    ```

    tar -xzvf kde-component-version.tar.gz

    cd kde-component-version

    ./configure

    make; make install

    ```


    The output from each of these commands has been included to save space; the basic
    idea is clear. First extract the archive using the tar utility on the command
    line. After the package has been extracted, visit the new directory created by
    the package and run the ./configure program in the directory. After configure
    has been run, two calls to make will first build the binaries from the source
    code and then install them into the default install location.


    The installation location, as well as several other options, can be changed at
    compile time by passing arguments to the configure script. The arguments available
    can be listed by passing the help argument to the configure script without other
    arguments, like this:


    +   ./configure


    When compiling, as was the case when installing from binary packages, it is important
    to install in the correct order. Again, the order is kdesupport first, followed
    by kdlibs then kdebase, with the rest of the source packages being compiled and
    installed in no particular order.


    # Starting KDE


    Starting KDE, arguably the final step in installing KDE, is generally a fairly
    simple manner. Ensure that the path to the KDE binary directory is added to your
    path, either in the /etc/profile file or in your $HOME/.xinitrc script. Then add
    a call to the startkde command from the KDE directory''s binary subdirectory,
    without arguments, in place of any calls to a window manager. Placing the command
    at the end of the $HOME/.xinitrc file in any window manager should bring the KDE
    up when you log in to the X session and allow the session to exist when you exit
    the KDE.


    # Configuring KDE


    After KDE is installed and running, the first thing users will want to do is personalize
    it to suit their tastes by configuring some of the behavior and appearance options.
    In KDE, this is all done using point-and-click menus and dialog boxes.


    Most objects in KDE generate context-sensitive menus when they are right-clicked,
    in much the same way that Windows does. On this context-sensitive menu you will
    often find a Properties item, just as is common in other operating systems. For
    example, right-clicking on the root window while KDE is running brings up the
    menu shown in Figure 11.1. Selecting the Properties option brings up a dialog
    box that will feel familiar to many users, thanks to its similarity to the same
    dialog in Windows operating systems.'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# Chapter 11 The KDE 1.1.1 Environment


    ![](img/edb2a4591eafaad74c22be9075f4b815_273_0.png)


    Figure 11.1 You display the properties menu by right-clicking on the root window.


    The main method to use when configuring KDE, however, does not rely on context-sensitive
    menus. The KDE control center is the main avenue for configuring the KDE environment.
    It collects many dialog boxes from many different context-sensitive windows in
    a single place, so that the user doesn''t have to going through the system for
    them. The KDE control center, click a panel icon like the one shown in Figure
    11.2.


    ![](img/edb2a4591eafaad74c22be9075f4b815_273_1.png)


    Figure 11.2 An icon on the panel launches the KDE control center.


    The KDE control center operates in two halves. On the left is a tree view which
    has subtrees that can be expanded or collapsed by clicking on the small plus (+)
    or minus (-) box. Selecting an item from this tree view causes a dialog box to
    be displayed on the right of the control window. This dialog box will generally
    contain several panels with tabs to switch between, each containing a different
    category of options relating to the KDE aspect selected in the tree on the left
    side of the desktop. The KDE control center window is shown in Figure 11.3, later
    in this chapter.


    Thanks to the KDE''s goals of being end-user friendly, most of the options that
    are found in the KDE control center are self-explanatory, and you can generally
    experiment with them that aren''t without fear of causing harm to your desktop.
    The presence of an Apply button allows changes to be tried without the to restart
    one or all components of the KDE control configuration is so self-explanatory,
    a detailed exploration of most parts of the KDE control center is beyond the scope
    of this text.'
  merge: -1
