  md: "# The Xinput Section\n\nThe Xinput section is for configuring devices other\
    \ than the primary mouse to be used by the X server and X clients. Such devices\
    \ can include graphics tablets, joysticks for playing games, or even a second\
    \ mouse. Most users will never use the Xinput section, and the entire thing is\
    \ commented out by default, but it exists, just in case.\n\nMany of the devices\
    \ supported by Xinput require extensions in the form of a module to be loaded\
    \ by the X server in order to function properly. Some devices (such as the joystick)\
    \ also require kernel-based support.\n\nThe Xinput section consists of several\
    \ subsections, for each device to be added to the X server's input capability.\
    \ Note that only a finite set of devices are supported; if a workable subsection\
    \ doesn't exist, you can't include it in the Xinput section of the X86Config file.\
    \ The valid subsections are shown in Table 2.10.\n\n# Table 2.10 Valid Xinput\
    \ Subsections\n\n| Subsection | Extension Driver | Related Device |\n|---|---|---|\n\
    | Joystick | x86jystick.so | Joystick, normally for playing games. |\n| WacomStylus\
    \ | x86Wacom.so | Stylus for a Wacom input tablet. |\n| WacomEraser | x86Wacom.so\
    \ | Eraser for a Wacom input tablet. |\n| WacomCursor | x86Wacom.so | Cursor for\
    \ a Wacom input tablet. |\n| Elographics | x86Elo.so | Graphics touchscreen display.\
    \ |\n| SummaSketch | x86Summa.so | SummaSketch tablet. |\n\nAs seen in Table 2.10,\
    \ most subsections require that a corresponding extension driver be loaded by\
    \ the X server, which can be done with the Load option in the Files discussed\
    \ earlier.\n\nAny of the completed subsections, when seen within the Xinput section\
    \ of the X86Config file, will be formed like this:\n\n```\nBeginSubsection 'subsection'\n\
    \  Option ['parameters if needed']\n  ...\nEndSubsection\n```\n\nThere can be\
    \ as many subsections in Xinput as are needed to support existing devices. The\
    \ most common use of Xinput for Linux users is for joystick input, so before discussing\
    \ any of the other input devices, it's a good idea to discuss joystick support."
  merge: -1
