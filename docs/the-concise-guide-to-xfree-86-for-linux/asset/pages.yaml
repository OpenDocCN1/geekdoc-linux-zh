    | SloppyFocus | Places windows into sloppy-focus mode. Window focus goes to whichever
    window contains the mouse. When the mouse is over root, the previous focus remains.
    |

    | SmartPlacement | Places new windows intelligently. If no intelligent placement
    can be found, either uses random placement (if active) or user placement. |

    | StaysOnTop window | Causes fwm to keep the specified window in a permanently
    raised state. The window is specified using an application name or a window title
    that can contain wildcard characters.


    A common configuration among Linux users includes the following set of behavior-oriented
    fwm keywords:


    +   - SloppyFocus

    - RandomPlacement

    - SmartPlacement

    - NoPosition

    - OpaqueMove 100

    - DontMoveOff


    These keywords will cause sloppy focus to be used so that whichever window contains
    the mouse pointer will have focus. fwm will if it can''t figure out, it will place
    them randomly rather than allow them to specify their own position. When windows
    are moved, they will remain visible at all times, regardless of the size of the
    window, and they will never be allowed to move completely off the usable desktop
    area.


    # fwm 1 Desktop and Client Management


    Two main systems exist in fwm to aid in management of running windows. The first
    is a system of maintaining a larger desktop area than the monitor can visibly
    display, as paging a virtual desktop, and the second is a list of running clients
    and a set of functions and menus for manipulating and acting on this list.'
