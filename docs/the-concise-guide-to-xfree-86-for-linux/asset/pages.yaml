- img_proc: true
  md: '# Chapter 9 Runtime Environment Configuration


    | Table 9.12 Continued |

    | Option | Description |

    | --- | --- |

    | NoIconTitle | Display only an icon when minimized. |

    | Button n | Button number *n* is visible on this window, if a mouse click has
    been bound to it. |

    | NoButton n | This window should not have a button *n*. |


    Clearly, the Style keyword merely gives a convenient mechanism by which individual
    windows or classes of windows can be simultaneously configured, and with great
    flexibility. For example, consider the following segment of a configuration file:


    ```

    Style ** Icon unknown.xpm, color white/gray, BorderWidth 4

    Style "xtern" Icon.xpm, color red/blue, BorderWidth 2

    Style "xclock" NoTitle, WindowlistSkip, NoHandles, BorderWidth 2

    ```


    The first line dictates that all applications (the wildcard character) should
    use the icon unknown.xpm when minimized. Unfocused title bars and decorations
    should appear as white on a gray background, and the border should be four pixels
    wide. The second line indicates that an exception to this style is the *xtern*
    application, which should use the file *xtern.xpm* as its icon when minimized,
    should appear as red on blue when not focused, and should have a border width
    of only two pixels. The third line indicates that the *xclock* application should
    not be endowed with a title bar or border handles, should have a border width
    of two pixels, and should not appear in the window list.


    Using styles in this way, it is possible to microconfigure a desktop''s appearance
    and even the function buttons that appear at the tops of individual windows based
    on a set of rules created by you, the user—a feat not possible in other operating
    systems, or even using many other window managers.


    # fwwm 2 Basics


    fwwm 1 is so flexible that configuring it can often turn into a full day''s work,
    and yet fwm 2 is at least four times the window manager that fwm was, introducing
    a dizzying array of functions and keywords, and as radically revamping the format
    of the configuration file. Unfortunately, developing fwm 2 is far beyond the scope
    of this text; its complexity is unsimplifiable and often more akin to a programming
    language than to a configuration file; an adequate tutorial would require a small
    book of its own.


    Still, we can discuss a few fwm2 basics, especially as they relate to the original
    fwm and the user''s ability to change basics (like the menu structure). The first
    and most important change from fwm to fwm 2 is most of the keywords from fwm related
    to appearance and behavior are no longer supported by fwm 2.'
