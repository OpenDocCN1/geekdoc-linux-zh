    starts. In conjunction with ClearRTS, allows certain mice to operate in MouseSystems
    mode. |

    | ClearRTS | | This flag clears the RTS line on the serial port when the X server
    starts. In conjunction with ClearDTR, allows certain mice to operate in MouseSystems
    mode. |

    | ZAxisMapping | X, Y, or n | Accepts one or two space-separated parameters that
    specify how the imaginary Z axis of motion is mapped inside X86. In practice,
    this is often used with scrolling mice, where the numbers supplied are 4 and 5
