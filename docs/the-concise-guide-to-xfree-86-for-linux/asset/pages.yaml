  md: '# x11perf and x11perfcomp


    The x11perf and x11perfcomp utilities are designed to help users determine the
    relative speed of an X server on specific hardware and compare the determined
    speed with the speed results obtained on other test runs, presumably using a slightly
    different configuration. The x11perf and x11perfcomp utilities are intended to
    be used mainly as optimization tools, though they are also commonly used as benchmark
    for the latest-and-greatest PC hardware.


    The x11perf utility is a exhaustive X performance testing tool that tests most
    of the available X functions, from the drawing of lines, polygons, bitmaps, and
    fonts to functions like mapping and moving windows, displaying refreshes, and
    copying planes of data. Test runs are normally executed on a fresh system with
    a low system load, a newly launched X server, and a local display connection.
    Normally, each of the numerous tests is run five times. The mouse cursor should
    not be passed over the x11perf windows while tests are running because such activity
    will affect the results. The most commonly supplied command-line arguments for
    x11perf are shown in Table 4.30.


    # 4.30 Common Arguments Accepted by x11perf


    | Argument | Description |

    | --- | --- |

    | -repeat n | Specifies that x11perf should run each of the numerous tests n times.
    The default number of runs for each test is 5. |

    | -time n | Specifies that each of the x11perf tests should be run for n seconds.
    The default number of seconds for each test run is 5. |

    | -all | Causes x11perf to run a full complement of tests—all that it knows about.
    |


    Most of the numerous arguments accepted by x11perf are to enable or disable specific
    tests. Many more tests exist than can be listed and explained here; users interested
    in selecting a specific set of tests, instead of the -all option, should consult
    the x11perf manual page.


    The x11perfcomp utility is designed to format the output from several x11perf
    runs into easy-to-compare, tabular format for human analysis. The most basic way
    to use x11perfcomp is to supply it with a list of files containing x11perf output:


    x11perfcomp test1.file test2.file test3.file


    However, several additional arguments are accepted by x11perfcomp that modify
    its behavior slightly. These arguments are shown in Table 4.31.'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# Table 4.31 Arguments Accepted by x11perfcomp


    | Argument | Description |

    | -r | When supplied, this option causes x11perfcomp to include relative performance
    in the output. The baseline system will be the system from the first file supplied.
    |

    | -ro | When supplied, this option causes x11perfcomp to include only relative
    performance in the output. |

    | -l file | Specifies the path to a label file generated by supplying the -label
    option during x11perf runs.


    Most users will rarely need to use the x11perf and x11perfcomp pair because running
    the full complement of tests is a time-consuming process, and X server performance
    on modern hardware is nearly always adequate anyway. Even so, the tests are sometimes
    useful for diagnostic purposes, such as when switching between X server versions
    or enabling or disabling acceleration features.'
