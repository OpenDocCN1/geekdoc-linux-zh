  md: "# Keyboard, Mouse, and Display Configuration\n\nThe files in the geometry/\
    \ directory are similar in structure to the files in the other two directories.\
    \ Each section in a geometry file is constructed as follows:\n\n```\n[default]\
    \ xkb_geometry \"name\" {\n  (...geometry specification...)\n}\n```\n\nAgain,\
    \ specific geometries are referenced by supplying both a file and a section within\
    \ a file, like this:\n\n```\npc(jp16)\n```\n\nThe preceding reference would use\
    \ the jp16 geometry from the pc geometry file in the geometry/ directory.\n\n\
    # Other Directories\n\nTwo other directories, types/ and compat/, also have something\
    \ to do with keyboard configuration. Both of these directories contain files that\
    \ define additional keyboard states and compatibility quirks that are really esoteric\
    \ to explain in detail. They are similar in format to the other types of files\
    \ discussed so far, and for most users the correct types file is the file called\
    \ default in the types/ directory, and the correct compatibility file is the default\
    \ file in the compat/ directory.\n\n# Specifying Keyboard Settings in XF86Config\n\
    \nAfter you've chosen a set of keyscodes, a set of symbols, and a geometry to\
    \ use, you must specify these settings to the server via the XF86Config file.\
    \ These settings can be explicitly specified using the XkbKeycodes, XkbSymbols,\
    \ and XkbGeometry. The types and compatibility settings are set using XkbTypes\
    \ and XkbCompat. A complete keyboard configuration in the Keyboard section of\
    \ the XF86Config file would look like this for a run-of-the-mill PC with a 101-key\
    \ keyboard:\n\n```\nXkbKeycodes \"free86\"\nXkbTypes \"default\"\nXkbCompat \"\
    default\"\nXkbSymbols \"us(pc101)\"\nXkbGeometry \"pc\"\n```\n\nUnfortunately,\
    \ not everyone is a run-of-the-mill PC with a 101-key keyboard, and after you've\
    \ spent a few moment rummaging through all the dizzying subdirectories and files\
    \ in the lib/X11/xkb/directory, it will become clear that there are a dizzying\
    \ number of configurations—so many that even if your own configuration is common,\
    \ it might be difficult to figure out how to properly represent it in XF86Config."
