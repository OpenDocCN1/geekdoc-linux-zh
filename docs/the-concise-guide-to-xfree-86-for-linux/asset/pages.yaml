  md: '# Advanced Configuration 61


    Before adding a joystick subsection to the XF86Config file, supporting a joystick
    in Linux first requires that you compile support for a joystick into the kernel,
    a task beyond the scope of this text. A device node for the joystick must also
    be in the /dev directory. Because such a node does not exist by default on Linux
    systems, you must create one following Table 2.11.


    Table 2.11 Linux Joystick Device Nodes

    | Device | Command to the Device Node |

    | --- | --- |

    | 1st analog joystick | knod /dev/jsa0 c 15 0 |

    | 2nd analog joystick | knod /dev/jsa1 c 15 1 |

    | 1st digital joystick | knod /dev/jsd0 c 15 128 |

    | 2nd digital joystick | knod /dev/jsd1 c 15 129 |


    After the joystick device has been created and joystick support has been compiled
    into the kernel, the related joystick subsection can be added to the Xinput section
    of the XF86Config file using the options in Table 2.12.


    Table 2.12 Joystick Subsection Options

    | Option | Parameters | Description |

    | --- | --- | --- |

    | Port | path | Path to the related joystick device node. |

    | DeviceName | text | Set the name of this device. |

    | Timeout | num | Set the delay in milliseconds between polls of the driver for
    new data. |

    | MaximumXPosition | num | Set the maximum x-coordinate position to be reported.
    |

    | MinimumXPosition | num | Set the minimum x-coordinate position to be reported.
    |

    | MaximumYPosition | num | Set the maximum y-coordinate position to be reported.
    |

    | MinimumYPosition | num | Set the minimum y-coordinate position to be reported.
    |

    | CenterX | num | Set the x-coordinate position to be reported when the device
    is free-floating (centered). |

    | CenterY | num | Set the y-coordinate position to be reported when the device
    is free-floating (centered). |

    | Delta | num | Set the maximum movement value to be reported to the X server.
    When value is set high, sensitivity will be high. When this value is set low,
    sensitivity will be low.


    AlwaysCore Assume that the device in question will generate movement and button
    events for the core X pointer.'
