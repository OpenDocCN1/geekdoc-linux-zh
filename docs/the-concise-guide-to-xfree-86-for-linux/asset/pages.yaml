- img_proc: true
  md: '# The X Resource Database


    If you are unable to move the editres window 9 effectively without the title bar
    on the screen, you might need to refer to Chapter 9, "Runtime Environment Configuration,"
    for information on adding such capability to your environment before continuing
    with editres.


    Back to our sample session. Assuming that you can move the window both up and
    down effectively, you can see that there are a large number of configurable resources
    for the vt100 widget of xterm. Among these are the foreground, background, and
    font resources. Selecting the foreground resource and then checking at the very
    top of the resource window reveals the following resource string:


    ```

    xterm.vt100.foreground:

    ```


    Move to the bottom of the window and enter a color name from the X color database
    or the RGB colors into the entry box, and then click the Apply button. For this
    example, enter the white white and click Save and Apply. The text of the xterm
    window immediately changes to the new color you specified, in case making the
    text invisible against the default white background. To fix this problem, select
    the background resource from the list. Checking at the very top of the window,
    you can see the resource now reads


    ```

    xterm.vt100.background:

    ```


    Move to the entry box toward the bottom of the window and enter the word black,
    and then click the Save and Apply button. The background of the window is now
    black, and the changes have again been saved to our file.


    Finally, just for fun, find the font resource in the list and select it. Checking
    at the top of the window, you can see that the resource string given is


    ```

    xterm.vt100.font:

    ```


    Move to the bottom of the window and enter a valid font in the form of an XLFD
    of the sort generated by the xfontsel command. For this example, we''ll use the
    following XLFD, generated by xfontsel:


    ```

    *-courier-bold-r-normal-14-*-*-*-*

    ```


    After entering this font into the box and clicking Save and Apply, the font in
    the xterm window instantly changes to reflect our new preferences, and this latest
    change is saved to our file as well. The final result of our changes is in Figures
    8.5 and 8.6.


    The most basic use of the editres command should be fairly clear; it''s a matter
    of selecting the widget you''d like to modify in the main editres canvas, and
    then bringing up the resource window to edit the properties of the widget in question.'
  merge: -1
  pgno: 198
- img_proc: true
  md: '# 184 Chapter 8 Runtime Application Configuration


    ![](img/edb2a4591eafaad74c22be9075f4b815_199_0.png)


    **Figure 8.5** The original xterm window: black text on a white background, using
    a mischievous font with a boring title.


    ![](img/edb2a4591eafaad74c22be9075f4b815_199_1.png)


    **Figure 8.6** The updated xterm window: white text on a black background, using
    a courier font with an updated title.


    Remember that we created a file named new_xterm over the course of this walk-through.
    You might have noticed that it doesn''t seem to have any effect—that is to say,
    if you start another xterm, none of the changes made to the first xterm seem to
    apply to newer instances of the application. Don''t throw the file away—it''s
    going to be useful in the next section.


    # Which Widgets Are Which?


    The most fundamental question about using editres and changing resources is which
    resources ought to be changed, or to put it another way, which widget properties
    do what. There is no easy answer to this question; many applications don'' include
    widget documentation, and it''s really up to you to try to figure out, based on
    the property and widget names, what does what. Unfortunately, programmers aren''t
    always extremely helpful in choosing clear and explanatory widget or property
    names.'
  merge: -1
  pgno: 199
- img_proc: true
  md: 'Most of the standard Xt and Athena widgets and widget classes and their properties
    are fairly well documented, though documentation is well beyond the scope of this
    text (and is really complex enough to warrant an entire text on its own). However,
    such documentation is often complex and of little use to anyone but the X programmer—certainly
    not to the X user. Most of the users, will want to consult the application''s
    manual page or GNU info page (using the command) for documentation for an application''s
    resources. For example, xterm''s manual page contains a large amount of information
    documenting the xterm resources. The emacs editor, on the other hand, most of
    its resources in a series of info pages.


    If the resources for a given application aren''t documented in the application''s
    manual page, in the info page, or in some other included file, it often comes
    to simple guessing and experimentation. In our walk-through, the means of the
    resources became obvious. On the other hand, there were also resources for several
    other fonts and other colors in the v100 widget. As would have liked, they all
    refer to a v100 terminal, and anyone familiar with such a terminal recognizes
    them quickly. The point here is that context and intuition should be used when
    experimenting with resources; if one thing doesn''t work, try another. Another
    trick for helping with resource configuration will be covered little later in
    the chapter when we discuss application defaults. For now, just remember that
    it will often come down to experimentation and your own technical street alone.


    # Resources and Files


    Although edits is nice, you have noticed that the changes it makes doesn'' seem
    to work on new instances of applications that were launched after the Apply button
    was clicked, and the Save button and resultant files haven''t yet had any effect.
    This is because we''ve taken only the first step toward making changes permanent.


    # Resource File Formats


    Take a look at the file that we created in our sample editres section working
    on xterm in the previous section. A listing of the file generated by cat can be
    found in Listing 8.1.


    Listing 8.1 The new_xterm File, Generated by editres


    ```

    .xterm.vt100.title: Reversed text xterm

    .xterm.vt100.foreground: white

    .xterm.vt100.background: black

    .xterm.vt100.font: -*- courier-bold-normal-14-*

    ```


    Files that contain X resource information for the X resource database contain
    information this way. That is to say, the format generally follows this pattern:


    ```

    app1.resource.property1: value

    app1.resource.property2: value

    app2.resource.property1: value

    app2.resource.property2: value

    ```'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# Chapter 8 Runtime Application Configuration


    Any number of X resources can be configured in a single file; some resource files
    have been known to stretch into the hundreds of kilobytes, configuring many, many
    properties across a large number of applications. Most users won''t need files
    of this magnitude because the defaults for most applications are acceptable. Usually,
    the changes the average user makes will be to colors or fonts here and there.


    Note that, although we haven''t discussed it, wildcard characters are allowed
    in the resource strings, often used simply to shorten them, but sometimes also
    to apply to multiple widgets. For example, the resources from our sample file
    could appear like this without significantly changing their impact:


    ```

    *xtermtitle: Reversed text xterm

    *xtermforeground: white

    *xtermbackground: black

    *xtermfont: -courier-bold-r-normal-14-*-.*.*.*

    ```


    You might have noticed that some of the buttons at the top of editors windows
    cause asterisks to appear in the resource string; this wildcard capability is
    the reason for those buttons, they aren''t normally needed when configuring a
    single property inside editors.


    Any file that follows the basic formats above can be used in configuring X resources.
    However, not files will be used as such—at least automatically.


    # The xrdb Command


    The xrdb command is the command used to merge an X configuration file into the
    running X resource database. After the resources in a file have been merged in,
    they will remain in effect until the session ends, affecting all future instances
    of any applications or widgets configured in the file. For example, to make our
    xterm changes apply to any xterm launched for the remainder of the current XFree86
    session, the xrdb command would be used like:


    ```

    xrdb -merge new_xterm

    ```


    After the file has been merged, launching a new xterm window again from any existing
    xterm:


    ```

    xterm &

    ```


    When it starts that the changes made during the sample session now appear in the
    new xterm window. The changes have become permanent, at least for the remainder
    of the session. The xrdb command accepts several additional arguments, shown in
    Table 8.1.'
  merge: -1
  pgno: 201
- img_proc: true
  md: '# The X Resource Database 187


    # Table 8.1 Most Common xrdb Command-Line Arguments


    | Argument | Description |

    | -n | Display the resource database changes, to standard output, but don''t actually
    make them in the resource database. |

    | -quiet | Don''t print warnings about duplicate entries. |

    | -cpp program | The name of an alternative preprocessor to use. Normally, cpp
    is used to allow for C-style preprocessing directives to appear in resource files,
    but an alternative can be used if it supports -I, -D, and -U options. |

    | -nocpp | Don''t run the file through a preprocessor of any kind. |

    | -query | List the current set of properties. |

    | -load | Load the new file instead of the original set of defined resource properties,
    replacing them completely. |

    | -merge | Load the new file in addition to the original set of defined resource
    properties, adding to the environment rather than redefining it. |

    | -edit filename | Merge changes in the environment back into a resource file,
    replacing lines in the file with matching resource lines in the environment. This
    is one way to save edits-style updates to a resource file. |

    | -backup suffix | Append the given suffix to the filename given by -edit and
    use the resultant filename as a backup file. |


    There are several additional, more specialized xrdb arguments; you can read more
    about them by studying the xrdb manual page.


    # The .xdefaults File


    You know how to use edits to make changes to a running X application that supports
    X resource database configuration. You also know how to save those changes to
    a file and use it to make them affect new instances of the applications in question
    for the remainder of an X session. There is still a gap in your knowledge,how
    to make the changes permanent across multiple X sessions. That is to say, how
    to X read your changes from a file each time it starts.


    As luck would have it, there is a standard filename that serves just that purpose.
    The $HOME/.xdefaults file (note that it begins with a period and is hidden under
    normal conditions) is merged into the resource database each time an X is launched
    (including the standard) xinitrc scripts. When you have decided that you want
    resource changes to become permanent, they should be added to the end of $HOME/.xdefaults;
    they will then be merged into the database each time a new X session starts, before
    any applications are launched.'
  merge: -1
  pgno: 202
- img_proc: true
  md: '# Chapter 8 Runtime Application Configuration


    A similar effect can be achieved by inserting a call to xrdb in your own personal
    script. For example, instead of using the $HOME/.xdefaults file to store your
    xterm changes, you wanted to leave them in as-is, yet you also wanted them to
    take effect for each X session start, you could include the following lines in
    your $HOME/.xinitrc:


    ```

    if -e ~/new_xterm; then

    xrdb -merge ~/new_xterm

    fi

    ```


    Although this is certainly not the most elegant solution, it is sometimes desirable.


    The temptation to save changes from editres directly to .xdefaults is high, but
    such activity should be avoided; it can lead to a cluttered, enlarged, and difficult
    to follow .xdefaults files. Rather than save changes directly to .xdefaults, save
    them to a separate file to make sure that you like them. Then, after your changes
    have been finalized and merged from the new file into the resource database, save
    them to .xdefaults using xrdb:


    ```

    xrdb -edit ~/.xdefaults -backup .bak

    ```


    This will save the changes in final, cleaned-up form to the .xdefaults file, over
    any previous configuration for the properties in question, and make a backup of
    the original .xdefaults file at ~/.xdefaults.


    # The Application Defaults File


    One final repository for resource changes exists but is more helpful in configuring
    resources using editors and your .xdefaults file than in any other way.


    The lib/X11/app-defaults/ directory off the main Free86 tree contains several
    files that are named after application instances and contain the default configurations
    for the applications they name. When an application is launched, X checks the
    app-defaults directory for a file that matches the application''s name. If such
    a file exists, it is merged into the resource database immediately before the
    application starts. For example, /usr/X11R6/lib/X11/app-defaults/Xterm contains
    a complete resource configuration for the default appearance and behavior of the
    xterm application. Similar files exist for most of the Standard programs, and
    many programs will add their own app-defaults file to the directory when they
    are installed. Older versions of Netscape Navigator are one example of such an
    application.


    Changes to the files in this directory must be made when logged in as root because
    all the files are normally owned by root, but changes in general to any of files
    in the directory are strongly discouraged. It is much more desirable to have each
    account configure applications via the .xdefaults files in home directories rather
    than to implement a systemwide application using the files in /usr/X11R6/lib/X11/app-defaults.
    Note that any changes you do make will take instant effect on all future instances
    of the application because X loads the app-defaults files into the resource database
    time an application is launched.'
  merge: -1
  pgno: 203
- img_proc: true
  md: '# Common Resources and Command-Line Options 189


    These files do serve a very useful purpose, however: Many of them contain invaluable
    and lengthy examples of resource configuration for the application to which they
    belong. Using edits is a tiring job, involving a great deal of guesswork when
    it comes to determining what specific resource or property is for and what type
    of value it is expecting. The task is made much easier when a sample configuration
    for the property in question already exists, as is often the case with the files
    in /usr/X1R6/lib/X11/app-defaults.


    Note that, in some instances, properties containing color-oriented configuration
    go in the file with a color extension, while all other properties reside in the
    main file. So, for example, the file /usr/X1R6/lib/X11/app-defaults/XFontSel contains
    color defaults for the xfont command, whereas the directory contains all the other
    properties related to the xfont command.


    Note also that you can create your app-defaults file, if necessary, for an application
    that doesn''t supply it, by creating a file in the app-defaults directory that
    is named after an application''s root widget as given by edits. Capitalization
    is important; the name should be chosen on the second row of buttons in the edits
    resource window.


    # Common Resources and Command-Line Options


    The management of X resources for applications that support them is definitely
    an involved topic, and one that most users don''t have the time or energy to deal
    with any real depth. Frankly, the need for some measure of simplification was
    anticipated by the X designers and the object-oriented nature of X widgets.


    # The Core Xt Resources


    Many of the most changed basic properties are consistent across most applications
    and X toolkit and Athena widgets and thus be used in a very simplified manner.
    These are shown in Table 8.2; note the use of wildcard characters to make changes
    in properties apply the entire widget tree for a given application. The same resources
    can also be used on specific widgets, instead of wildcarding them all widgets.


    | Table 8.2 Most Common Use of the X Toolkit Resources |

    | Resource Use | Effect |

    | app*borderColor: col | Changes the border color for all widgets to col, a color
    in the X color database or an RGB colorspace string. |

    | app*borderWidth: n | Changes the border width for all widgets to n pixels. |

    | app*background: col | Changes the background color for all widgets to col. Can
    also appear as Background in some cases. |


    continues'
  merge: -1
