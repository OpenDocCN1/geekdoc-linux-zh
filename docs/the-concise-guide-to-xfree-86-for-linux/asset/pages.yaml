  md: "# Keyboard, Mouse, and Display Configuration 153\n\nThe files in the keycodes/\
    \ directory contains lists of these low-level keycodes for the keyboards of various\
    \ hardware platforms and the key symbols that each code represents. For example,\
    \ an Amiga computer generates 77 when the Escape key is pressed, while a PC keyboard\
    \ generates a 9 when the Escape key is pressed. Thus, the amiga file in the keycodes/\
    \ directory contains a line mapping the <ESC> symbol to the number 77, while the\
    \ xfree86 (default PC) file in the keycodes/ directory contains a line mapping\
    \ the <ESC> symbol to the number 9.\n\nEach keycodes file is split into several\
    \ sections delineated as follows:\n\n```\n[default] xkb_keycodes \"set_name\"\
    \ {\n  (...key code to symbol pairs...)\n}\n```\n\nEach section can contain any\
    \ number of keycode-to-symbol pairs between the beginning brace and the ending\
    \ brace. The presence of the optional default keyword at the beginning of a section\
    \ indicates that this section is the default section for the file and will be\
    \ used if no specific section is given when referring to the file. Specific keycode\
    \ sets are therefore referred in one of the following two ways:\n\nFile\nfile(set_name)\n\
    \nThe first representation is used when referring to the default section within\
    \ the given file in the keycodes/ directory. The second representation is used\
    \ when referring to one of the other (nondefault) sections within the given file\
    \ in the keycodes/ directory.\n\n# The symbols/ Subdirectory\n\nThe files in the\
    \ symbols directory perform an additional layer of mapping, from the abstract\
    \ symbols mapped in the keycodes/ directory defined in the file include/X11/keysymdef.h\
    \ off the main XFree86 directory tree.\n\nThis additional layer of abstraction\
    \ is necessary because, as painted, a keyboard really isn't specific enough for\
    \ the computer to understand. For example, the letters A and B generate only one\
    \ keycode when pressed, and yet we expect them to be able to represent two separate\
    \ entries each: an uppercase letter and a lowercase letter. The files in the symbols/\
    \ directory instruct X (for example) to watch the Shift key when a key is pressed\
    \ and to decide which action was intended by the user—an uppercase letter or a\
    \ lowercase letter.\n\nInternational characters are also handled in the files\
    \ in the symbols/ directory, allowing X to understand international keyboards\
    \ and even use some standard PC keyboards to generate international characters\
    \ when directed to do so by the user."
  merge: -1
