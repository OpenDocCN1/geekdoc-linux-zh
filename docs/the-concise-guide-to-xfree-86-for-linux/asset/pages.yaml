    # xload


    The xload utility displays a running graph of the client system''s load average
    in real time. If no horizontal bars appear in the graph, the load is less than
    1.0. Each horizontal bar appears in the graph represents a whole number increment.
    A graph that climbs above three horizontal lines therefore indicates a load average
    greater than 3.0. The most common command-line arguments accepted by xload are
    shown in Table 4.12.


    # Table 4.12 Most Common Arguments Accepted by xload


    | Argument | Description |

    |---|---|

    | -highlight color | Allows the user to specify the color of the highlight (horizontal
    scale) lines in the graph. |

    | -jumpscroll n | Moves the graph n pixels to the left when the display reaches
    the edge of window. For smooth scrolling, set this value to 1. |

    | -label text | Puts the given text above as a label. The default configuration
    places the domain name of the client system above the graph. |

    | -nolabel | Displays no label above the graph. |

    | -lights | Specifies that xload should indicate the current system load using
    the keyboard LEDs. For example, a system load of 2.0 would be indicated when the
