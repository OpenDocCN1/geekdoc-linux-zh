  md: '# X11R6 AND THE FREE86 PROJECT


    # X Structure


    X11R6 is a modular, network-transparent windowing system that uses a client/server
    architecture to operate. The two most important parts of the X Window System are
    the clients, or application and utility programs that run under X, and the server,
    a large program that interacts with the clients, the user, and with a workstation''s
    graphics hardware. The relationship between the X clients and the X server requires
    some explanation.


    # X Is Network-Transparent


    Before discussing client and server issues more fully, it''s important to note
    that at the most fundamental level, X is a method for representing graphics operations
    as a stream of data, suitable for use as a network protocol. X is designed to
    operate over a network in a transparent fashion. Generally speaking, anything
    that will be displayed, or any input that will be accepted by X on a Linux computer
    system, must pass through a network interface, whether such an interface is Ethernet,
    a modem PPP line, or a local loopback interface. Of course, there are exceptions
    to this rule. For example, certain extensions allow X to render some graphics
    directly to the display, but for Linux computers in the general case, this rule
    certainly holds—least for now.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Chapter 1 X11R6 and the XFree86 Project


    Because all X display and input/output information can be transmitted over a network,
    there is no reason why a program designed to run under the X Window System should
    not be able to execute on one machine but interact with the user and graphics
    primitives on a separate machine. Indeed, this is often the case. Because of this
    distributed model, X is often used in environments where one or relatively few
    large computers run the applications and while all users interact with these applications
    on separate, smaller machines whose only roles are to display the graphics and
    accept input. Under X, the specifications of the displaying system don''t even
    need to match those of the system on which an application runs. A computer system
    with a monochrome display or no graphics at all can easily run X applications
    and display them on another machine on the network that has a color display. The
    only requirement is that both machines be able to "speak" X.


    # X Uses a Client/Server Architecture


    As is the case with most network protocols, the X protocol uses a client/server
    model to communicate. Most users familiar with the World Wide Web, telnet, FTP,
    email, or any number of other protocols are accustomed to thinking of their desktop
    workstation as a client machine, which then initiates connections to server machines
    somewhere on the network for data exchange. X is often confusing in this regard
    because, in the case of X, the desktop workstation at which the user sits runs
    the program called the server, while the displayed applications, which often run
    on other, larger computers on the network, are called the clients (see Figure
    1.1). Whenever or wherever an X application runs, such a client/server relationship
    exists.


    When an X application (client) is launched, it makes a request over the network
    to connect to either the specified or the default X server—the program that will
    display the application and accept input from the user. The X server program will
    use the display and input hardware of the computer on which it runs to interact
    with the connecting client (see Figure 1.2). The X server program is responsible
    not only for input/output and graphics display, but for other issues as well,
    such as basic font management and connection security. All this interaction takes
    place over the network.'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'On single-user personal computers such as those common in the Linux community,
    both the applications and the X server often run on the same machine, with the
    local X server configured as the default X server. In such cases, the X server
    is present to interact with the user at the keyboard and mouse and to display
    graphics on the video hardware through the monitor; at the same time, all the
    X clients are running on the same host, connecting to and interacting with the
    server using UNIX-domain sockets, or if they aren''t included in the running kernel,
    the local loopback interface (see Figure 1.3).


    ![](img/edb2a4591eafaad74c22be9075f4b815_22_0.png)


    **Figure 1.1** Clients running on several large machines without displays all
    interact on a single workstation display. All X data moves over the network.'
  merge: -1
