  md: '# Chapter 7 Runtime Server Configuration


    # Internationalization


    The subject of internationalization is complex. Many X users would love to get
    X working in their own native language, at least enough to read and send email.
    The question of how to set up X for a given language is a common one. Unfortunately,
    things aren''t always as simple as they seem, and in X, this is certainly the
    case.


    Internationalization, as implemented now, is much more a function of the applications
    in question than that of X server or XFree86 system. Even the international keyboard
    mappings found in the lib1/X11/kb/ directory do not work with many applications,
    which, very simply, are designed to work in English and nothing else, completely
    ignoring foreign X symbols. A number of international fonts aren''t included with
    XFree and must be downloaded from the Web.


    The closest to a truly international desktop available for Linux at this point
    is the K Desktop Environment, which supports the great majority of Western European
    languages to one degree or another. Asian languages are a different matter (with
    the exception of Japanese katakana) they require multibyte X server patches to
    allow for their larger character sets.


    Because of all these complications, a complete discussion of internationalization
    is well beyond the scope of this text; a different set of answers is correct for
    each language around the world. S.U.S.E. GBMH, which can be found at http://www.suse.de
    sells a large number of European language-specific distributions that are preconfigured
    for European languages. TurboLinux, which can be found at http://www.turbolinux.com,
    serves the Pacific rim with Japanese and Chinese versions of Linux.


    For those who need getting X to run in their language, the best sources of information
    on the Web for international X are HOWTO documents that can be found at http://metalab.unc.edu/LDW/HOWTO.
    Currently, HOWTO documents exist for the following languages: Chinese, Russian
    (Cyrillic), Danish, Esperanto, Finnish, French, German, Hebrew, Italian, Polish,
    Portuguese, Slovenian, Spanish, and Thai. Each of these HOWTOs contains information
    on configuring Linux and X for the language in question, as well as links to fonts,
    replacement X servers, or patched binaries when necessary.


    If the language you isn''t covered by a HOWTO, your best hope is to seek out a
    Linux group in your area or someone who speaks the language you need to use in
    XFree86.


    # Fonts and Colors


    Beyond the purely utilitarian aspects of the X console, like screen blank, keyboard
    use, and the console, the most interesting aspects of the X server runtime have
    to do with font management and color management. There isn''t a user alive who
    doesn''t love to add more fonts to his system, and on another tack, there are
    256-color X users who haven''t wanted to smash their terminal at one time or for
    lack of color cells.'
