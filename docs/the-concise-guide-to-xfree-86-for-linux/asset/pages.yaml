    that you should not attempt to make up your own numbers and enter them. If you
    are unsure about your monitor''s capabilities, choose the first (most conservative)
    option and go on from there.


    After entering the horizontal and vertical sync refresh rates for your monitor,
    you will be asked to enter an identifier, a vendor, and a model name for your
    monitor. This part is easy; enter something memorable, descriptive, and short
    as an identifier, and then answer the following two questions with the make and
    model of your monitor. Note that your answers for your benefit only; they appear
    in the configuration file xf86config generates so that if you have to edit the
    configuration file directly, you''ll know which sections of the configuration
    file apply to the monitor in question.'
