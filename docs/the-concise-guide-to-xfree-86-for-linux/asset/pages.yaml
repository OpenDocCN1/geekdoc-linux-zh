    To make the job easier, consider using an application like xorsel, which ships
    as a package with most Linux distributions, and the xfontsel utility in Chapter
    4, “Standard XFree86 Programs and Utilities.” Note also that any changes you make
    won''t be reflected in your onscreen display until the fwwm process itself is
    restarted; the easiest way is to bind the restart function to a menu entry or
    keystroke, a process described in the “fwwm 1 Mouse and Keyboard Bindings” section
    in this chapter.


    # fwwm 1 General Behavior Options


    General behavior-oriented configuration options are available to users of fwwm.
    Aside the configuration of colors and fonts, these are the most commonly used
    options for fwwm users. They enable the user to alter many look-and-feel aspects
    of fwwm behavior.


    The most common general behavior configuration options are shown in Table 9.3.


    # Table 9.3 Most Common General Behavior Keywords in fwwm


    Keyword | Description


    AutoRaise n


    Automatically raises any window that remains focused for n milliseconds. If fwwm
    is in click-to-focus mode and n is negative, prevents the initial mouse click
    from raising the window.


    ClickFocus


    Places fwwm into click-to-focus mode. Window is changed by clicking inside a new
    window.


    DontMoveOff


    Prevents windows from being moved entirely off the accessible desktop.


    continues'
