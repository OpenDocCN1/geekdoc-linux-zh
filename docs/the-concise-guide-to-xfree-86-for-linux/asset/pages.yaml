    To fully enable the console framebuffer, you must enable both Video Mode Selection
    Support and for Frame Buffer Devices. Two questions later, you should also answer
    Yes to


    VESA graphics console (CONFIG_FB_VESA) [N/y/]


    Again, proceed with configuration normal, and when you are finished and have recompiled,
    the VESA console driver will be included in the new kernel.


    After the VESA console driver has been compiled into the Linux kernel, you must
    boot into a display of the resolution and depth you want to use under X. This
    is done by first-creating framebuffer console devices with major 9, minor 0 at
    /dev/fb0 and /dev/fb1:


    ```

    mknod /dev/fb0 29 0

    s /dev/fb0 /dev/fb0current

    ```


    Then, edit the /etc/lilo.conf file or replace your current vga= line or add a
    vga= line using the table of VESA console resolution/depth identifiers shown in
    Table 2.22, taken from the Documentation/fb/vesab.txt file off the kernel source
    tree. Note that these numbers will not show when booting with vga=ask even though
    they are valid.


    | Table 2.22 VESA Framebuffer VGA Modes |

    | 640×480 | 800×600 | 1024×768 | 1280×1024 |

    | Modes | Modes | Modes | Modes |

    | 769 (8bpp) | 771 (8bpp) | 773 (8bpp) | 775 (8bpp) |

    | 784 (15bpp) | 787 (15bpp) | 790 (15bpp) | 793 (15bpp) |

    | 785 (16bpp) | 788 (16bpp) | 791 (16bpp) | 794 (16bpp) |

    | 786 (24bpp) | 789 (24bpp) | 792 (24bpp) | 795 (24bpp) |


    If you prefer not to edit your /etc/lilo.conf file, you can generally specify
    the vga= option at boot time to the LILO boot: prompt like this:


    ```

    LILO Boot: linux vga=792

