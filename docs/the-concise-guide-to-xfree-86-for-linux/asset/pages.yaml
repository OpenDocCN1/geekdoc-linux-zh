  md: '# X Structure


    To see evidence of these connections on a Linux machine running X, try issuing
    the following command:


    ```

    netstat | grep X11

    ```


    This command provides a list of the open X connections on the machine in question.
    Whether the X clients and server run on the same or different machines, the underlying
    functionality of X remains unchanged. Clients contact the server over a network
    interface, and the server responds to the client''s requests in the same way,
    creating on the display what appears to be a seamless desktop.


    This network-centric separation between client and server, while seemingly unnecessary
    on a single computer, is the reason for the dominance of X in network-distributed
    computing. Because all connections in X are network connections, and because all
    applications display across the network, distributed computing and remote management
    become mundane tasks accomplished in the normal course of use. Indeed, the "thin
    client" craze of the mid 1990s was nothing to X users, who have been running graphical
    applications across the network for a decade.


    # X Is Modular


    The network-transparent, client/server model also serves to keep X modular. Because
    the easiest way for clients to speak X across the network is to use the C-language
    interface, the X library is paradoxically separate from the server, which will
    display X library primitives. In situations in which an client and server are
    running on separate machines, both are using their own, independent libraries
    as well!


    To keep code portable across a large number of systems, and to keep the network-transparent
    hardware-neutrality of the X protocol, X is built more as a series of extensible,
    replaceable components rather than a single, monolithic GUI unit. This is the
    case in some graphical operating systems. Furthermore, to promote "mechanism rather
    than policy," the X protocol and X servers include no official high-level GUI
    library of their In. High-level GUI libraries are linked to clients, which can
    generate widgets and other graphics that can be sent across the network using
    the X protocol.


    To illustrate: A given Linux computer''s installation includes an X11 server,
    clients, and library, as well as the GTK high-level GUI library and the Mesa3D
    library for 3D acceleration. An SGI computer across the hallway, on the other
    hand, contains an X11 server, clients, and library, but instead of the GTK GUI
    toolkit, the SGI contains the OSF/Motif high-level GUI toolkit and the OpenGL
    library for high-end 3D graphics acceleration.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Chapter 1 X11R6 and the XFree86 Project


    Because of the differences between their libraries and hardware, it might seem
    unlikely that the two X installations are interoperable. Thanks, however, to the
    modular magic of X, a Motif application (client) running on the SGI machine can
    successfully display and interact with the user on the Linux machine correctly,
    even when no Motif library is present on the Linux system. Likewise, the GTK-based
    3D application running on the X11R6 Linux machine can connect to the SGI machine
    and function correctly, even though the SGI machine contains no GTK library and
    uses OpenGL rather than Mesa3D. Furthermore, if the Linux user decides to upgrade
    his library and applications from the old GTK 1.0 toolkit to the newer GTK+1.3
    toolkit without telling anyone, no break will occur. Because to the SGI machine
    across the hallway must be made for new GTK+ on the Linux to display correctly
    on the SGI box. Similarly, the Motif 1.2 applications on the SGI box can be replaced
    with Motif 2.0 without affecting the performance or functionality of X itself,
    whether locally or to the Linux machine on the other side of the hallway.


    Because of the modular, extensible nature of X and the separation between client
    and server over the network, X has survived as a viable and innovative user interface
    for more than 15 years in spite of the rapid pace of change within the computer
    industry.


    # # Why Is XFree86 Different from X11R6?


    XFree86 is one of the most important components of nearly every Linux distribution,
    and yet it is rarely mentioned by name, either by distribution maintainers'' literature
    or by users. Just what is XFree86? The following is from the XFree86 Web page
    at http://www.xfree86.org.


    > "The XFree86 Project, is a non-profit organization that produces XFree86. XFree86
    is a freely redistributable implementation of the X System that runs on UNIX(R)
    and UNIX-like operating systems (OS/2). The XFree86 Project has traditionally
    focused on Intel x86-based platforms (which is where the ''86'' in our name comes
    from), but our current release supports all other platforms."


    The common term X11R6 stands for Window System version 11, release 6. The second-most
    recent release of the X Window System code by X.Org is known as X11R6.3, and it
    is the release with which the current version of XFree86 was built. What''s the
    difference XFree86 and X11R6.3?


    X11R6.3 includes a great deal of code—defining things like graphics primitives,
    window behavior and properties, and the implementation of the X network protocol.
    X11R6.3 does not include code to talk to specific types of PC-style graphics and
    input/output hardware. This means that devices like ISA, VLB, or PCI graphics
    adapters, graphics chipsets, mice, trackballs, scroll wheels, and aren''t directly
    supported by the code officially known as X11R6.3. This is done by design, so
    that individual vendors of such hardware can support for their own devices in
    their releases of the X Window System. In the PC world, however, where UNIX is
    the mainstream, most vendors of graphics or input hardware don''t release "X drivers"
    or servers complete with drivers for their products.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# The XFree86 Distribution 11


    This is the reason for the existence of the XFree86 Project. In essence, the XFree86
    Project what can loosely be thought of as X drivers for a wide variety of PC hardware
    and operating systems; then it combines “drivers” with the official X11 code,
    releasing the result as the XFree86 software distribution.


    Thus, a given XFree86 release is based on an X.Org release of the X Window System
    code with extra code added to support PC-style graphics and input/output hardware,
    as well as a number of PC operating systems such as Linux and OS/2.


    # XFree86 Distribution


    The official XFree86 distribution consists of several distinct component archives,
    which are in turn released for several supported hardware and software platforms.
    Choosing and obtaining an XFree86 distribution is therefore the process of first
    identifying the hardware and underlying operating system in question, and then
    installing each component of the XFree86 distribution specific to that platform.


    # Supported Platforms


    XFree86 is supported for the following hardware and operating system platforms.
    Note that some platforms (such as x86 machines running Linux or a BSD variant)
    are more likely to be well supported and hardware-current others.


    It''s no accident that Linux is so well supported by XFree86. XFree86 is the single
    most common distribution of the X Window System included with Linux operating
    systems, on all architectures.


    # Linux, Digital Alpha/AXP Architecture


    This binary supports a wide variety of graphics hardware on Digital Alpha/AXP
    machines running the Linux operating system. This is the X Window System distribution
    included in all XP Linux operating systems.


    # Linux, x86 Architecture, glibc 2.x (aka libc6)


    This binary supports a wide variety of PC-type graphics and input/output hardware
    versions of the Linux operating system that are based on the GNU C library 2.x
    release, such as Red Hat 5.x and later, Debian 2.x and later, and Caldera OpenIBC
    2.2. This is the X Window System distribution included in most x86/libc6 Linux
    operating systems. This is perhaps the most widely used of all XFree86 platforms,
    accounting for much of the current Linux community.'
  merge: -1
