    # GNOME from Source


    The process of compiling GNOME from source is a long and harrowing one due to
    the size and complexity of the GNOME environment, as well as the variability in
    installed Linux systems. Compiling GNOME from source is therefore recommended
    only for those who have previous experience compiling Linux applications from
    source. It isn''t recommended that any users of lib 5.x distributions compile
    from source themselves because GNOME was written for lib 6.x distributions. It
    assumes that the underlying system not only includes the newer version of lib
    but many other newer, lib 6.x-era components as well. The last lib 5.x releases
    of several distributions are shown in Table 12.1.'
