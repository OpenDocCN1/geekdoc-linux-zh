  md: '# startx


    The startx command launches the X server and starts the X session using xinit
    scripts. To use startx after X has been configured, simply enter the command from
    any text console.


    ```

    startx

    ```


    The startx command isn''t normally called with arguments of its own but is often
    called with two dashes as its first argument, allowing any other arguments that
    follow to be passed on to the X server.


    # xbiff


    The xbiff utility monitors a user''s mail spool file, changing color or optionally
    beeping when mail has arrived. Clicking in the xbiff window returns it to its
    original color. The most common command-line arguments accepted by xbiff are shown
    in Table 4.3.


    | Table 4.3 Most Common Arguments Accepted by xbiff |

    | Argument | Description |

    | -update n | Check for new mail and update the display every n seconds. |

    | -file name | Check file name for mail activity, instead of the default user
    spool file. |

    | -volume n | Set the new mail beep volume to n percent. |


    # xcalc


    The xcalc utility displays a graphical arithmetic calculator in a window that
    can be operated either by the mouse or by the numeric keypad. The xcalc utility
    can emulate either a TI-30 or an HP-100 calculator. The most common command-line
    arguments accepted by xcalc are shown in Table 4.4.


    | Table 4.4 Most Common Arguments Accepted by xcalc |

    | Argument | Description |

    | -stipple | Draw features using stippled areas instead of solid colors. Improves
    the appearance of the calculator on 1 and 2 bits-per-pixel (mono-chrome) displays.
    |

    | -rpn | When supplied, this argument causes the calculator to emulate an HP-10C
    calculator and use reverse Polish notation for input. When omitted, xcalc will
    emulate a TI-30. |'
