  md: '# Getting and Installing ssh


    Because of the maze of export and patent restrictions on encryption code in the
    United States, you might not find a working ssh distribution or packages in your
    Linux installation or on your Linux distribution''s CD-ROM.


    The home site and primary distribution node for ssh software is the ssh homepage
    in Finland, which can be found at http://www.ssh.fi, but ssh can also be downloaded
    from several mirror sites, the addresses of which can be found at the ssh home
    page.


    I''m going to discuss the 1.2x version of ssh in this chapter rather than the
    recent 2.x versions for several reasons. First, multiplatform compatibility is
    important in a distributed X installations on non-UNIX platforms. Next, most of
    the tutorial information and documentation existing on the Web refers to ssh 1.x
    rather is more likely to be compatible with existing ssh installations or on the
    newer releases. Finally, the 1.x versions of ssh are under the GNU General Public
    License (GPL) as is Linux, although the 2.x versions are not.


    # Compiling ssh


    After you''ve downloaded the ssh tarball from the primary distribution site or
    one of the mirrors, the first thing to extract is:


    ```

    $ -xzf ssh-1.2.nn.tar.gz

    $

    ```


    After the source has been extracted, use cd to visit the directory containing
    the ssh source, and use the configure command to generate the source for compilation
    on your machine:


    ```

    $ ./configure

    $

    ```


    A list of options to configure can be found by supplying the --help option to
    configure. Usually, however, no options are needed. After configure has run its
    course, you should be able to compile the source by issuing the make command and
    install it afterward with a make install as root:


    ```

    $ make

    ...[ make output ]...

    $ su root

    Password:

    # make install

    ...[ install output ]...

    ```


    When installing, the default ssh configuration files and a public and private
    key for the machine in question will be built. It is recommended that ssh be compiled
    and installed on each machine separately so that the public and private keys for
    each machine on your network will automatically be built without need for your
    intervention, greatly simplifying the process.'
  merge: -1
