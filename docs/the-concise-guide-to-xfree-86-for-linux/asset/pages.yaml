- img_proc: true
  md: '# Three Major KDE Components


    The KDE is not a single entity, though it is designed to look like one. When you
    look closely, it is actually possible to see several major components that the
    user interacts with on a regular basis while using the KDE. Each of these components
    has a special role within the KDE. These components rarely need to be started
    by hand, so they should normally be started using the startkde script, included
    as part of the standard KDE distribution.


    Three fundamental components of the KDE really cannot be removed without removing
    a sizeable percentage of KDE''s functionality. These three components are the
    window manager, kwm or krotwm (depending on your KDE version); the panel and icon
    manager, kpanel; and the file and desktop manager, kfm. Although there are many
    smaller KDE components and applications, these three components form the bulk
    of the KDE''s functionality.


    # kwm/krotwm


    The kwm is a part of the kdebase package and actually performs many of the same
    tasks normally performed by a window manager not written for the KDE: kwm draws
    decorations like title bars and buttons around the borders of windows and facilitate
    their movement and size management. The kwm also provides focus policy and some
    form of minimization, in cooperation with other KDE components.


    The typical window decorations drawn by kwm are shown in Figure 11.3. Note that
    this appearance reflects only the default KDE behavior; the appearance can easily
    change based on user preferences.


    ![](img/edb2a4591eafaad74c22be9075f4b815_274_0.png)


    Figure 11.3 Decorations drawn by krotwm.


    Most of the tricks relating to the KDE window manager that users will find useful
    are configuration options that live in a series of panels in the control center
    dialog tree. The Windows branch of this tree contains five dialogs related to
    the nuts-and-bolts of the window managers'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# Changing the Title Bar Buttons


    The Buttons pane in the Windows branch of the control center tree enables the
    user to select which title bar buttons should and not appear on decorated applications.
    The user can also select the position of buttons that should appear.


    For each button KDE is capable of displaying, there is a set of three radio buttons:
    left, right, and off. Choosing left for a particular button will cause the button
    to be active by default and to appear on the left side of the title bar at the
    top of an application window. Choosing right for a particular button will cause
    the button to be active by default and to appear on the right side of the title
    bar at the top of an application window. Choosing off for a particular button
    will cause the button not to appear anywhere on the window title bar.


    The sample title bar at the top of the window changes as the button configuration
    is altered by the user; it is to demonstrate the resultant window title bar would
    look like were the user to save the changes.


    # Changing the Focus Policy


    The Properties in the Windows branch of the control center contains a section
    titled Focus Policy toward the bottom of the window that enables the user to edit
    the focus and general raise policy for windows in KDE.


    In the drop-down list, the user can choose among several classic X window system
    focus policies. Click to Focus is the Windows-like focus policy in which the mouse
    must be clicked for a window to take focus. The Focus Follows Mouse and Classic
    Focus Sloppy both function as what most users would recognize to be a sloppy mechanism.
    Focus resides with whichever window contains the mouse pointer, or, if no window
    currently contains the mouse pointer, with the last window to focus. The classic
    Focus Follow Mouse Option allows the user to select the traditional focus follows
    mouse mode, in which the focus goes to whichever window contains the mouse pointer.
    If no window contains the pointer, no window has focus.


    The Auto Raise check box specifies that windows with focus should automatically
    be raised when they get focus after the delay in milliseconds set by the Delay
    slider next to the Auto Raise check box.


    The Click Raise check box specifies any time the mouse pointer is clicked anywhere
    inside a window, the window should be raised. This is the default behavior in
    the Click to Focus mode, but in the other focus modes, the default behavior is
    to raise a window only when the title bar is clicked.'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# Turning Off Animation


    The same Properties pane that is used is also used in configuring window animation.
    Only one animation option controls all types of KDE animation.


    The Resize Animation slider at the top of the window enables the user to select
    a speed of resize animation. Setting the slider all the way to the left switches
    the animation entirely. Moving the slider toward the right makes window minimize,
    restore, and resize animation progressively faster.


    # Changing Mouse Bindings and Decoration Functions


    It is possible in KDE to change the mouse''s bindings to window decorations and
    to change the bindings of decorations to different window manager functions. This
    type of configuration is done using the Mouse pane in the Windows branch of the
    control center.


    The Mouse pane presents the user with a list of button events in various contexts
    the left side of the pane, and a series of drop-down menus down the right side
    of the pane where the user can select the function that should be bound to the
    button in the given context. For title bars, two drop-downs exist, allowing the
    user to bind separate functions to decorations based on whether the window in
    question is active or inactive (focused or unfocused).


    This method for configuring mouse bindings is quite elegant and easy to understand;
    the best way to get a feel for configuring the bindings in KDE is to experiment
    with this configuration pane, using the Apply button to see changes effect.


    # Altering Decorations or Behavior for Specific Windows


    There is no direct equivalent in KDE to the style keyword for configuring window
    styles in the fwwm window manager studied in Chapter 9, "Runtime Environment Configuration."
    However, KDE provides a primitive method for configuring window appearances and
    behaviors on a per-window basis. The mechanism for implementing such configuration
    is found on the Advanced pane of the control center''s Windows branch.


    At the bottom of the pane is a section Filtered includes two sets of entry lists
    and a drop-down list. To use the section, enter either a window title into the
    Lists list or a class name into the Classes list. Then, select a property from
    the drop-down list. The Have Tiny Decorations and Gave No Decorations properties
    will cause a window to have no title bar or no title bar and no border, respectively.
    The Never Focus property prevents the window from becoming focused and accepting
    keystrokes. The Start as Sticky property starts the window with the sticky title
    bar button clicked. The Exclusion from Session Management property prevents the
    window''s status from being saved when KDE exits; the window will not be started
    again when KDE restarts.'
  merge: -1
  pgno: 276
- img_proc: true
  md: 'A title or class has been entered and a property selected, clicking on the
    plus (+) button will cause the change to be saved (added) to the list. This property
    will then remain active until it is removed.


    The process for removing properties is not obvious. To remove a property, enter
    the title or class of the property you want to remove in the corresponding text
    entry box and click the minus (-) button.


    # kpanel


    The second most obvious part of the KDE environment is the kpanel, an application
    launch bar and icon manager that can be placed at various locations on the display.
    The kpanel provides functionality for pop-up menus without the root menu traditional
    in other window managers, as well as for a tray in the tradition of the Windows
    system tray that holds icons for active applications and which usually displays
    some sort of status or activity.


    The kpanel icon manager works closely with the kwm window manager to provide the
    seamless integration with KDE''s goal. Running KDE normally maintains a button
    on the kpanel''s task manager bar. When a window is minimized by clicking one
    of the title bar drawn by kwm, it disappears from the main desktop and the title
    of it in the kpanel task management bar appears in parentheses. Clicking on the
    button in the task manager restores the window.


    The typical appearance of the kpanel, including task manager, is shown in Figure
    11.4. As for the case with kwm, the appearance of the kpanel can be changed by
    the user based on user preferences.


    ![](img/edb2a4591eafaad74c22be9075f4b815_277_0.png)


    Figure 11.4 The kpanel, at the bottom along with the icon manager (taskbar).


    Both the location and the behavior of the kpanel are fairly configurable. The
    configuration options that use configuration dialogs to control kpanel behavior
    can be found either in the KDE control center or by right-clicking on the panel
    and selecting the Configure option.


    # Adding Icons to kpanel


    The process of adding an icon to the kpanel is simple. There are two basic ways
    to accomplish the task, based on where the icon is coming from.'
  merge: -1
  pgno: 277
- img_proc: true
  md: 'To add an icon from the desktop or the file manager to the kpanel, simply drag
    the icon from the desktop or file manager window to the kpanel and then release
    the mouse. File, device, or application icons will appear as clickable icons on
    the kpanel, and directories that are added will appear as menus.


    To add an icon from the K-Menu or a submenu off of the K-Menu, select the K-Menu,
    and then select Panel and, within that menu, Add application. The Application
    submenu should bring a clone of the K-Menu; browse this menu and select the item
    you''d like to add to the panel, and will appear as the next icon on the kpanel.
    This process is shown in Figure 11.5.


    ![](img/edb2a4591eafaad74c22be9075f4b815_278_0.png)


    **Figure 11.5** Adding an icon to the kpanel using the K-Menu, Panel, Add application.


    # Changing the Size Position of the Panel and Taskbar


    The locations of the panel and taskbar can be configured from inside the control
    center by expanding the Applications branch and selecting the Panel pane from
    the list. The panel dialog then appears on the right side of the control panel.
    Select the Panel tab to see configuration options related to the panel and taskbar
    position and size.


    The upper-left section of the tab panel, Location, controls the location of the
    panel on the display, which can be one of Top, Left, Bottom, or Right. The upper-right
    section of the tab panel, Taskbar, selects the position of the taskbar using the
    same four options.'
  merge: -1
  pgno: 278
- img_proc: true
  md: '# 264 Chapter 11 The KDE 1.1.1 Environment


    The size of the panel is controlled by the lower-left section of the tab pane,
    labeled Style. Selecting Tiny will cause the panel to appear on one mini-icon
    high or wide on the display. Selecting Normal chooses the default, large-icon
    size, and selecting Large causes extra pixel space to be inserted between elements
    on the panel, further increasing its size.


    # Managing Virtual Desktops


    The number of virtual desktops that will appear on the display and the names of
    each of the virtual desktops can be configured in the Desktops tab of the Panel
    entry in the Applications branch of the center tree.


    Two sliders at the bottom of the tab pane, labeled Visible and Width, control
    the number of accessible virtual desktops and the width of each desktop''s button
    on the kpanel, respectively. The kpanel allows for up to eight desktops total.
    It is recommended that width not be too narrow or the labels for each desktop
    will be truncated on the panel.


    Above the two sliders are several text entry boxes, one active box for each of
    the activated virtual desktops. Clicking in these boxes and entering text will
    cause the desktop in question to be named with the text entered. This name will
    appear on the kpanel button for that desktop, provided the button is wide enough
    to contain the text.


    # Autohiding the kpanel


    Many users moving to KDE+-Linux from Windows environments are accustomed to a
    Windows taskbar that has an autohide mode in which it remains invisible unless
    the mouse is moved against the edge of the display, in which case the taskbar
    suddenly becomes visible.


    The kpanel supports similar functionality in the KDE; it can be enabled by expanding
    the Applications branch of the center tree, then selecting Panel from the sublist
    and the two options that control the panel behavior are Auto-hide panel and Auto-hide
    Taskbar. These options cause cause the menu/icon panel and the icon manager taskbar
    to autohide when checked, respectively.


    Two sliders for each, Delay and Speed, control the aesthetics of the autohide
    mode. Delay refers to the amount of time that must pass after the mouse has moved
    away before the item in question will autohide. A longer delay means that the
    item will stay on the display longer before autohiding. Speed refers to the quickest
    with which each item reappears when the mouse is moved to the edge of the display.


    # kfm


    The kfm is the KDE file manager. This title is, however, a little misleading because
    the kfm provides many other functions, the least of which is fairly decent Web
    browsing capability in the tradition of Netscape and other browsers. The kfm is
    also responsible for much the desktop drag-and-drop functionality and for creating
    icons on the desktop in the first place.'
  merge: -1
  pgno: 279
- img_proc: true
  md: 'The typical appearance of a kfm window, alongside some of the desktop icons
    that kfm draws, is shown in Figure 11.6.


    ![](img/edb2a4591eafaad74c22be9075f4b815_280_0.png)


    **Figure 11.6** A kfm window browsing the local filesystem alongside several desktop
    kfm icons.


    Although some kfm options can be configured from the control panel, most of the
    interesting kfm configuration and its use is done from kfm windows and elsewhere
    in the Linux system.


    # Desktop Device Icons


    Many kfm icons are really representations of files that end with the .kdel extension
    and describe a device or specific type of file or location. Although the creation
    of .kdel files by hand is beyond the scope of this text, it is actually fairly
    easy to represent your own devices on your desktop with kfm icons and to kfm mount
    and un these devices.


    Be sure that an entry for such a device, including a valid mount point and filesystem,
    exists in the /etc/fstab file. All disk devices that are to be represented on
    the KDE desktop must appear in the /etc/fstab file. In addition any device that
    is to be mounted and unmounted by clicking on its icon must have the flag appropriate
    in the fourth column of its entry in the /etc/fstab file. For more information
    on flags that can be supplied in the fourth column of the /etc/fstab file, please
    see the mount (8) manual page.'
  merge: -1
  pgno: 280
- img_proc: true
  md: 'After the /etc/fstab entry for a device has been created, representing the
    device on the desk-top is a multistep process. First, right-click on the desktop
    and select New, Filesystem Device. In the dialog that pops up, enter a name for
    the device, ending with the .kdelnk extension. This will cause kfm to create an
    unconfigured device on your desktop (see Figure 11.7).


    ![](img/edb2a4591eafaad74c22be9075f4b815_281_0.png)


    Figure 11.7 The ZipDrive icon is an unconfigured filesystem device icon.


    Second, right-click on the unconfigured filesystem icon and select the Properties
    item. A dialog appears with three tabs for icon configuration. Only the last tab,
    Device, interests us here; the rest can be ignored. In the Device tab, enter the
    device name for your disk, as it appears in the /etc/fstab file, into the text
    entry labeled Device.


    Finally, click on Mounted icon and once on Unmounted icon, each time selecting
    an icon from the dialog of icons that appears. The mounted icon is the icon that
    will be used to represent your device on the desktop when it is mounted; the unmounted
    icon will be used when it is not. Prebuilt icon pairs (one, with a simulated LED
    and one without) exist for sev-eral disk types, including floppies, zip drives,
    and CD-ROM drives.


    When you''re finished selecting icons, choose OK at the bottom of the dialog.
    The device icon should now appear with one of the icons you selected, depending
    on whether in its current state it is mounted or unmounted from the filesystem.
    To browse (and mount, if necessary) a disk device, simply click on its desktop
    icon. To unmount an already mounted disk device, right-click on the desktop icon
    and select Unmount from the context-sensitive menu that appears.'
  merge: -1
