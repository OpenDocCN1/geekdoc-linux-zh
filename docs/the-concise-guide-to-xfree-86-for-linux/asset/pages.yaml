  md: '# 92 Chapter 3 Launching XFree86


    Although this might seem like a drastic course of action, it is sometimes extremely
    useful, for example, when a rare rogue application has taken over normal aspects
    of the keyboard and mouse you are unable to regain control. In other operating
    systems, a reboot would be required, but in Linux, thanks to the three-key emergency
    exit in XFree86, a reset can be avoided. Instead, only X must be restarted.


    It bears repeating here, though, that you should use Ctrl+Alt+Backspace only in
    the direst of emergencies. Using the emergency exit will in all likelihood cause
    all the data in running applications to be lost unless it has been saved to disk.


    # Focus and Other Window Manager Concepts


    One or two more particulars about X window managers will be helpful to the average
    user before we move on to the next chapter and start using X clients.


    # Window Focus in X


    First and foremost, it is the window manager''s job to manage application window
    focus. At any given time, only one window or application on an X desktop can have
    focus. When a window has focus, all normal keystrokes entered by the user will
    belong to that window. Thus, the application that has focus is perceived by the
    user as the active application. It is the window manager''s job to establish policy
    by which focus is determined and some mechanism by which it is changed. Most window
    managers implement several possible focus methods and enable the user to choose.


    When using a focus-follows-mouse policy, wherever the mouse goes, the focus follows.
    In such a scenario, the window that currently contains the mouse pointer will
    also receive all normal keystrokes. Changing the focus involves moving the mouse
    pointer over (or inside) another window. If the mouse pointer isn''t contained
    within a window, keystrokes will not be sent to any application. This is the focus
    most commonly found on classic UNIX-desktops.


    When a click-to-focus policy, a window is given focus when it is clicked upon
    the mouse. After being clicked, all normal user keystrokes will go to the selected
    window until focus is explicitly changed (see Figure 3.5). Changing the focus
    involves clicking on (or some-times inside) another window. The focus remains
    with the selected window regardless of where the mouse pointer actually resides.
    This is the focus most commonly seen in Windows and Mac OS systems.'
  merge: -1
