- img_proc: true
  md: '# The fwwm Window Manager 219


    The configuration keywords that did make the cut have been promoted to become
    functions in fwwm 2 rather than mere keywords, allowing them to be used in many
    more varied circumstances. Functions in fwwm 2 either can be called directly or
    can be bound to a keyboard or mouse click or a menu entry. Even keyboard and mouse
    bindings, though they still use a similar format, are now functions, meaning that
    the improbable set of lines (recall the key binding process from fwwm) is now
    possible:


    +   - Key F11 A S Key F11 Exec xterm &

    - Key F11 A M Key F11

    - Key F12 A S Key F12 Exec xcalc &

    - Key F12 A M Key F12 -


    Note that the dash (-) in place of a function to remove a key binding. Note also
    that key is now a function, it can call itself as part of a binding. The effect
    of these four lines isn''t obvious, but with a little study, you''ll discover
    an interesting example of fwwm 2''s newfound configuration power. The first line
    dictates that a Shift+F11 keystroke will bind the command xterm to the unmodified
    F11 key. The second line indicates that Alt+F11 is pressed, the unmodified F11
    key be unbound, so that applications can once again receive F11 keystrokes. The
    next two lines do the same for the F12 and the xcalc command.


    fwwm 2 is bursting at seams with this kind of capability; because every aspect
    of fwwm 2''s configuration is controlled by a function rather than a keyword,
    nearly every aspect of fwwm 2''s configuration suddenly becomes runtime-configurable,
    through keystrokes, mouse clicks, or menus.


    # fwwm 2 Menus


    Important changes occurred in the menu-handling capabilities of fwwm during the
    upgrade to fwwm 2. Both the method for defining menus and the method for controlling
    their appearance have changed.


    # Building Menus


    In fwwm, menus were defined with the Popup and EndMenu keyword pair. The menus
    were built statically in the configuration file and loaded by fwwm at runtime.
    In fwwm 2, menus are created by adding to them with the AddMenu function, which
    is used as follows:


    ```

    AddToMenu MenuName "Text Item" Function [argument ...]

    + "Text Item" Function [argument ...]

    + "Text Item" Function [argument ...]

    ```


    There is no need for an EndMenu keyword; a blank line terminates the process of
    adding to the menu. The function supplied can be any of the functions supported
    by fwwm 2. Many of the functions that were available in fwwm are also present
    in fwwm 2, though not of them were rewritten from fwwm to fwwm 2 and a truly countless
    number of new functions have been added.'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# Chapter 9 Runtime Environment Configuration


    After a menu has been created, it can be augmented at any time. For example, you
    might see the following AddMenu in fwwm 2 configuration file:


    ```

    AddToMenu MyMenu "Main Menu" Title

    + "Start a Terminal" Exec term &\n+ "Start a Calculator" Exec xcalc &\n

    AddToMenu OtherMenu "The Other Menu" Title


    + "Leave fwm2" Quit

    AddToMenu MyMenu "Start Netscape" Exec netscape &

    ```


    Notice that the third call to the AddToMenu function adds to MyMenu, which was
    created earlier. Instead of overwriting the contents of MyMenu, the AddToMenu
    function adds a third option, Start Netscape, to the end of MyMenu, demonstrating
    that the AddToMenu function works in a cumulative manner on any given menu.


    # Images and Hotkeys


    fwwm 2 provides the capability to incorporate images and hotkey shortcuts into
    menus in the same way that operating systems as Windows do. This example illustrates
    the three basic methods of adding images and the basic method of adding keyboard
    shortcuts to menus in fwwm 2:


    ```

    AddToMenu ImageMenu@vert.xpm "Image Demo Menu" Title

    + "@Calculator@xcalc.xpm" Exec xcalc &

    + "Start@Terminal@xterm.xpm" Exec xterm &

    ```


    When this menu appears, the image vert.xpm will be displayed on the left edge
    of the menu vertically, beginning at the bottom of the menu. The image in xcalc.xpm
    will be centered over the menu entry Start a Calculator, and the image in xterm.xpm
    will be shown to the left of a Terminal in the menu. The keys for these two entries
    will be C for xcalc and T for xterm, because they are preceded by an ampersand
    (&). Note that image files are still loaded from the paths given by PixmapPath
    and IconPath in the configuration file.


    Using this basic image handling capability and a nice set of images, combined
    with a few keyboard shortcuts, it is possible to create professional-looking,
    graphics-enabled menus inside fwwm 2.


    # Menu Styles


    The colors in fwwm 2 menus are no longer controlled by simple keyword and color
    pairs; fwwm 2 implements a much-improved and much more flexible menu styling system
    of which the MenuStyle function, defines menu styles by name, is the center.'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# The fwwm Window Manager


    The ServicePolicy function has a very simple syntax:


    MenuStyle stylename option, [option, ...]


    The format is simple, but the list of options supported by the MenuStyle function
    is large. The most basic of these options are shown in Table 9.13.


    # Table 9.13 Basic MenuStyle Options


    | Option | Description |

    | FWWM | Draws the menus in the traditional fwwm style, with a three-dimensional
    effect, submenus that overlap their parents, and delayed pop-ups. |

    | MWM | Draws the menus in the style of the MWM window manager, with a three-dimensional
    effect, submenus that don''t overlap their parents, and instant pop-ups. |

    | WIN | Draws the menus in the style of Windows, with a flat, solid-colored effect,
    submenus that don''t overlap their parents, and instant pop-ups. |

    | Foreground color | Uses color as the text color in this menu. |

    | Background color | Uses color as the background color for this menu. |

    | Font XLFD | Uses the specified font for the entries in this menu. |

    | MenuFace style | Uses fancy candy pixmaps or gradients for the background of
    this menu. The style is one of the options supported by the other style later
    in the section. Two other gradient styles, DGradient and BGradient, both diagonal,
    can also be used. |


    For example, consider the following menu style definition:


    MenuStyle NormalMenus WIN, Foreground, Background white


    This style defines a style called NormalMenus that will produce windows-style
    menus with white on a blue background. To use a menu style like NormalMenus, the
    ChangeMenuStyle function must be used. The syntax for the ChangeMenuStyle function
    is simple and looks like this:


    ChangeMenuStyle menename [menuname ...]


    For example, to assign the menu style we created for the menus called MainMenu,
    ExitStuff, and OpsStuff, the following function would be:


    ChangeMenuStyle NormalMenus MainMenu ExitStuff OpsStuff


    Like everything else in fwwm 2, because MenuStyle and ChangeMenuStyle are functions,
    they can be bound to keyboard or mouse clicks or called from within menus to cause
    menu appearance at runtime.'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# Chapter 9 Runtime Environment Configuration


    # fwwm 2 Functions


    The new mechanism for creating functions in fwwm 2 is similar to the new mechanism
    for creating menus. The function in question is AddToFunc and is used like this:


    ```

    AddToFunc FunctionName "trigger" Function

    + "trigger" Function

    + "trigger" Function

    ```


    Again, there is no need for an EndFunction keyword; fwwm 2 will stop adding to
    the named function at the first blank line it encounters.


    The event triggers in fwwm 2 are also different from the trigger names in fwwm.
    The triggers in fwwm 2 are simply represented by the first letter of the original
    trigger name from fwwm: Immediate becomes I, Motion becomes M, and so on. The
    MoveRaiseLowerMaximize function used as an example for fwwm looks like this when
    defined in fwwm 2:


    ```

    AddToFunc MoveRaiseLowerMaximize "M" Raise

    + "M" Move

    + "C" RaiseLower

    + "D" Maximize 80 80

    ```


    AddToFunc is also a function in fwwm 2, unlike the Function keyword in fwwm. This
    means that fwwm 2 functions can be built on-the-fly at runtime based on user interaction,
    a powerful feature that requires some practice to use it.


    Note that the two special functions, InitFunction and RestartFunction, also exist
    in fwwm 2 and can be used in the same way, though they must of course defined
    using the new AddToFunc function rather than the fwwm function keyword.


    # fwwm 2 Appearance and Style Handling


    In addition to a much-updated set of functions and the capability to rebuild or
    edit menus and functions on-the-fly at runtime, fwwm 2 provides a new, powerful
    set of style-handling functions that allow various styles to be applied to various
    types of window manager objects. Because these are the primary methods for defining
    window, mesh, decoration appearance in fwwm 2, it is important to understand them
    a little bit. Unfortunately, they are as complex as they are useful; getting them
    to requires practice.


    The basic fwwm 2 style paradigm says that each object in the window manager, from
    buttons to title bars to windows, has properties that can be configured. Configuration
    is specified with a style function and can be updated any number of times with
    an AddStyle function. Configuration can also be applied between objects with the
    UseStyle option, so that decorations can share appearances with each other. The
    style functions are outlined in the paragraphs that follow; their basic format
    is


    ```

    StyleFunction [btn] [state] [style] [!] ...

    ```'
  merge: -1
  pgno: 237
- img_proc: true
  md: 'The Style function is one of the functions listed in Table 9.14. Functions
    that begin with Add implement new styles on top of existing ones. Functions that
    don''t begin with Add replace existing styles. For style functions that affect
    title bar buttons, a button specification as per Table 9.15 is required; otherwise,
    no button is specified.


    | Table 9.14 fwwm 2 Style Functions |

    | Function | Description |

    | ButtonStyle | Implements a new title bar button style. |

    | AddButtonStyle | Adds a new element to an existing title bar style. |

    | TitleStyle | Implements a new title bar style. |

    | AddTitleStyle | Adds a new element to the existing title bar style. |

    | BorderStyle | Implements a new window border style. |

    | AddBorderStyle | Adds a new element to the existing window border style. |


    | Table 9.15 fwwm 2 Button Specifications for Style Editing |

    | Specifier | Button |

    | 0–9 | Style function should act on one of the title bar buttons specifically,
    as laid out in the original fwwm window manager, with buttons 1, 3, 5, 7, and
    9 on the left and buttons 0, 8, 6, 4, and 2 on the right, in that order. |

    | All | Style function should act on all title bar buttons equally. |

    | Left | Style function should act only on buttons that are on the left side of
    the title bar (odd-numbered buttons). |

    | Right | Style function should act only on buttons that are on the right side
    of the title bar (even-numbered buttons). |


    The state supplied to a style function is one of the words listed in Table 9.16.
    If no state is supplied, the style will apply to all states. The style supplied
    to a style function is one of the style directives listed in Table 9.17. After
    the state and/or style has been specified, the user may add two dashes and follow
    these with a series of flags, if necessary. A few of these flags are listed in
    Table 9.18. If a flag is preceded by an exclamation mark (!), its meaning is inverted.'
  merge: -1
  pgno: 238
- img_proc: true
  md: '# Chapter 9 Runtime Environment Configuration


    # Table 9.16 Valid Style Function States


    | State | Description |

    | Active | This style applies when the window has focus. This state is for border
    styles only. |

    | ActiveUp | This style applies when the window has focus (active) and the widget
    isn''t currently in the middle of a click event (up). |

    | ActiveDown | This style applies when the window has focus (active) and the widget
    is currently in the middle of a click or drag event (down). |

    | Inactive | This style applies when the window does not have focus. |


    # Table 9.17 Common Style Function Styles


    | Style | Description |

    | Default | Specifies that this decoration should use the default style compiled
    into fwwm 2. |

    | Pixmap file | Uses the named image as a one-stamp pixmap for the decoration
    in question. |

    | TiledPixmap file | Uses the named image as a wallpaper-style pixmap tile for
    the decoration in question. |

    | Solid color | The decoration should be drawn using color in a solid fill. |

    | Vector n pt pt ... | The equivalent of the old ButtonStyle keyword in fwwm discussed
    earlier. The number of points is given by n and each pt is a valid point and line
    color. For button style functions only. |

    | Gradient n c1 c2 | The decoration should be drawn using an n vertical gradient
    from c1 to c2. Note that a second, more powerful form of the Gradient style isn''t
    covered here. |

    | Hgradient n c1 c2 | The decoration should be drawn using an n horizontal gradient
    from c1 to c2. Note that a second, more powerful form of the Gradient style isn''t
    covered here. |

    | MiniIcon | Draws the application''s MiniIcon in the specified button. The MiniIcon
    concept is discussed in the next section, “fwwm 2 Decors and Window Styles.” For
    button style functions only. |'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# Table 9.18 Common Style Function Flags


    | Flag | Description |

    | --- | --- |

    | UseTitleStyle | Attempts to take the style for buttons from the current title
    style. |

    | UseBorderStyle | Attempts to take the style for buttons from the current border
    style. |

    | Raised | Causes the decoration to appear raised in a three-dimensional way.
    |

    | Sunk | Causes the decoration to appear sunken in a three-dimensional way. |

    | Flat | Causes the decoration to appear without any three-dimensional edges.
    |

    | HiddenHandles | Doesn''t draw handles on the corners of the border. For border
    style functions only. |

    | NoInset | Doesn''t draw an inner bevel around the border but, instead, keeps
    the border flush with the window. For border style functions only. |

    | Left | Begins tiling or displaying pixmaps on the left side of the decoration.
    |

    | Right | Begins tiling or displaying pixmaps on the right side of the decoration.
    |

    | Top | Begins tiling or displaying pixmaps at the top of the decoration. |

    | Bottom | Begins tiling or displaying pixmaps at the bottom of the decoration.
    |


    Although the new interface is consistent, it is certainly more complex than the
    simple keyword/value lines in the original fwwm. The flexibility gained, however,
    is considerable. Consider the following example:


    ```

    TitleInactive Hradient Red Blue -- Flat

    TitleActiveTiledPixmap focused.xpm -- Top Left

    TitleActiveSolid Red

    BorderStyle All -- NoInset HiddenHandles

    ButtonStyle All -- UseTitleStyle

    AddButtonStyle1 Vector 4 50x201 20x201 80x201

    AddButtonStyle2 1 Pixmap bottom-2.xpm

    ```


    The first three lines give window titles that aren''t focused a horizontal gradient
    from red to blue as a background color. When not focused, titles will be drawn
    flat, without three-dimensional effects. When the window is focused, a pixmap
    focus.xpm begins tiling from the upper-left corner of the title bar will be used
    as the background. When the title bar is clicked or dragged, it will turn a solid
    red color.


    The fourth line dictates that window borders should appear without a three-dimensional
    bevel around the inside or resize handles at the corners.


    The last three lines specify that all buttons should take their initial style
    hints from the current title bar style. Then, button 1 (the left-most button)
    is updated with a new vector pattern and button 2 (the right-most button) is updated
    with a new pixmap.'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# Chapter 9 Runtime Environment Configuration


    # fwwm 2 Decors and Window Styles


    The style-handling functions included with fwwm 2 are clearly powerful and flexible,
    yet the best is still to come. In addition to the style functions just discussed,
    fwwm 2 provides the capability to create decors, which are collections of styles
    that can be applied on a window-based basis. Decors are built using the AddToDecor
    function, as follows:


    ```

    AddToDecor decorname

    + StyleFunction [btn] [state] [style] -- [!]flag

    + StyleFunction [btn] [state] [style] -- [!]flag

    ...

    ```


    Again, a decor can be added at any time, dynamically, and adding is finished when
    a blank line is encountered in the file. A sample decor using our styles from
    the last section might look like this:


    ```

    AddToDecor StDecor

    + StyleInactive Red Blue -- Flat

    + StyleActiveUp Tiledmap focused.xpm -- Top Left

    + StyleActiveDown Solid Red

    + BorderStyle All -- NoInset HiddenHandles

    + ButtonStyle All -- UseFontStyle

    + AddButtonStyle 1 Vector 4x5080 20x201 80x201 50x800

    + AddButtonStyle 2 Pixmap button-2.xpm

    ```


    After the decor known as StDecor has been defined, the user can decide to assign
    that to specific windows using window styles. The basic Style keyword for individual
    windows is still around for fwwm 2, though in fwwm 2 it is a function. All the
    options supported by the Style keyword in fwwm 1 still apply, and the new options
    in Table 9.19 now apply as well.


    # Table 9.19 A few of the fwwm 2 Window Styles Options


    | Style | Description |

    | --- | --- |

    | UseStyle | Uses a style already defined by another Style function as the basis
    for this style. |

    | UseDecor decor | Uses the name when decorating windows named in this style.
    |

    | MiniIcon | Uses the icon by file as the mini-icon for the window, which can
    be drawn in title buttons when requested. |

    | IconBox geometry | Specifies minimized icons for this window should go into
    the specified icon box. Similar to the IconBox keyword in fwwm 1, it applies only
    to the window for which the style applies, and geometry is given by an Xt/Athena-style
    geometry string as 100x100-1''. |

    | IconGrid x y | Form an imaginary grid in the specified icon box with each cell
    in the grid x pixels wide and y pixels high; attempt to place icons only in empty
    grid cells. |'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# The fwm Window Manager 227


    # Style


    # Description


    IconFill pos1 pos2


    Establish a fill gravity in the icon box. One of the pos arguments must be either
    top or bottom and the other must be left or right. For example, a gravity of left
    as pos1 and bottom as pos2 will fill the icon box from left to right and from
    bottom to top.


    MWMBorder/FwmBorder


    Draw window borders in the style of MWM or the style of fwm, respectively.


    SmartPlacement


    Place this window intelligently.


    DumbPlacement


    Don''t try to place this window intelligently.


    RandomPlacement


    Place this window in a random fashion.


    ActivePlacement


    Allow the user to place this window.


    DecorateTransient


    Decorate pop-up dialog windows.


    NakedTransient


    Don''t decorate pop-up dialog windows.


    SkipMapping


    Allow a window to appear and be placed off the visual desktop area.


    ShowMapping


    Always show a window as it appears and is placed.


    ClickToFocus


    Require that this window be clicked on to receive focus.


    SloppyFocus


    Allow this window to accept focus whenever the mouse pointer enters it; if the
    mouse pointer leaves it again only to enter the root window, keep focus.


    MouseFocus


    Allow this window to accept focus whenever the mouse pointer enters it; as soon
    as the mouse pointer loses, lose focus.


    For information on the rest of the new style options, please consult the fwm2
    manual page. Note the existence of both the Ustyle and UseDecor options. With
    these two style options, it becomes possible to assign all windows a given focus,
    color, and font style, as a decoration and title style, on a window-by-window
    basis. The following configuration segment illustrates the point:


    ```

    Style "UStyle" ClickToFocus, Color white/black, WindowListSkip

    Style "AppStyle" SloppyFocus, Color white/blue, Icon "app.ppm"

    Style "xclock" UseStyle "UStyle" NoTitle

    Style "xterm" UseStyle "AppStyle" UseDecor "StdDecor"

    Style "xedit" UseStyle "AppStyle" UseDecor "StdDecor" 1

    ```


    The first two Style lines don''t actually apply to any window; they have been
    named instead to indicate what style they represent, and other applications in
    subsequent lines are then told to inherit these styles. Both xterm and xedit also
    use StdDecor, which we defined earlier, though xedit windows won''t have a left-most
    title bar button (button 1).'
  merge: -1
  pgno: 242
- img_proc: true
  md: 'Note two more functions, UpdateDecor and Recapture, update windows already
    on a display to reflect changes in decor and style, respectively. Because all
    decor and style handling capabilities are implemented in fwm 2 as functions, they
    can be bound to menus or keystrokes or even called from other functions, and the
    subsequent changes can be made to appear with UpdateDecor and Recapture, leading
    to true runtime visual configuration capabilities when using a properly structured
    fwm 2 configuration file.


    # # Finishing Up with fwm


    The fwm window managers are simply too complex to document easily in a chapter
    like this one; many important elements have, by necessity, left out of this text.
    One of the most important elements is the module-handling capability of both versions
    of fwm. A list of available modules for your fwm window installation can be found
    by looking in the lib/X11/fwm or Lib/X11/fwm2 directory off the /usr/X116 tree.
    Each module in this directory typically has a manual page of its own that can
    be consulted for information on how to use the module with fwm or fwm 2.


    We''ve outlined the surface of the capabilities of fwm and fwm 2. Hopefully you
    will know at least enough to copy the system.fwm2rc file to $HOME/.fwm2rc and
    begin to edit window structure and some basic aspects of window appearance and
    desktop behavior. If you plan to use fwm 2, it is strongly suggested that you
    take the time to study the fwm 2 manual page.


    # # the twm Window Manager


    The twm window manager is the only window manager included with XFree86. As such,
    skilled the use of twm is important for users who use XFree86 for any period of
    time. Although the twm window manager isn''t nearly complex as flexible or configurable
    as the fwm family of window managers, it remains a favorite standby in the UNIX
    community thanks to its speed, small memory footprint, and clean appearance (see
    Figure 9.3).


    The systemwide configuration file for twm can usually be found in the lib/X11/twm
    directory off the /usr/X116 tree as system.twrc. When twm is started, it will
    first search for $HOME/.twrc and then fall back on twmrc if no configuration can
    be found.


    You can start twm by placing a call to twm at the end of your $HOME/.xinitrc file
    after removing calls to any other window managers or session managers.'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# The tm Window Manager


    ![](img/edb2a4591eafaad74c22be9075f4b815_244_0.png)


    Figure 9.3 The twm window manager.


    # # twm Configuration File Basics


    The twm configuration file often appears to be a little more structured than the
    configuration files of the twm window manager. Many aspects of twm configuration
    are accomplished using lists, structures that sometimes look similar to the structure
    of C source code, at least superfluially. A list can appear in either of the following
    formats:


    ```

    function { "item" "item" "item" ... }

    ```


    or


    ```

    function {

    "item"

    "item"

    "item"

    ...

    }

    ```


    The structure of menus in twm follows a similar format, though it is different
    upon close inspection. For those who have used the MWM window manager from Motif-based
    systems, twm will seem familiar.'
  merge: -1
  pgno: 244
- img_proc: true
  md: "As was the case with fwwm, the dictates of convention keep the twm configuration\
    \ file from becoming too cluttered and messy. Variables and appearance configuration\
    \ usually appear first, followed by function definitions, then keyboard and mouse\
    \ bindings, and, finally, the menu structure.\n\n# General Behavior\n\nSeveral\
    \ basic behavior-oriented variables can be configured in the twm dotfile. Enough\
    \ of them exist to give twm basic flexibility comparable in some ways to the basic\
    \ flexibility of fwwm 1x window managers. Many of them can be used with lists\
    \ of affected windows in the following format:\n\n```\nVariable\n{\n  \"window-name\"\
    \n  \"window-name\"\n}\n```\n\nFor example, the AutoRaise function should be used\
    \ to affect specific windows, as follows:\n\n```\nAutoRaise\n{\n  \"xterm\"\n\
    \  \"xcalc\"\n  \"edit\"\n}\n```\n\nA listing of some commonly used variables\
    \ and their uses, along with the way in which they must be supplied, can be found\
    \ in Table 9.20.\n\nTable 9.20 Common twm Behavior Variables and Their Uses\n\
    | Variable | Description |\n| AutoRaise { win-list } | Specifies a list of windows\
    \ that should be raised whenever focused. |\n| DecorateTransients | Specifies\
    \ that pop-up dialog windows should be decorated with a title bar and buttons.\
    \ |\n| DontMoveOff | Doesn't allow windows to be moved off the screen under normal\
    \ circumstances. |\n| DontSqueezeTitle { win-list } | Specifies a list of windows\
    \ that should not be squeezed after the SqueezeTitle has been used. |\n| MakeTitle\
    \ { win-list } | Specifies that the listed windows should have title bars. Most\
    \ useful when NoTitle (later in this table) has been globally set. |"
  merge: -1
  pgno: 245
- img_proc: true
  md: '# Variable


    # Description


    MaxWindowSize geometry


    Supplies a maximum window size in pixels using the geometry X-by-Y format.


    MoveDelta n


    Specifies that twm should register a mouse click as a click-and-drag if the mouse
    moves more than n pixels while the button is pressed.


    NoGrabServer


    Instructs twm not to grab the server when displaying pop-up menus or moving windows.
    Useful for debugging purposes or for setting captures.


    NoHighlight { win-list }


    If no list is supplied, disables border highlights to indicate focus. If a list
    is supplied, disables border highlights for the listed windows.


    NoRaiseOnDeconify


    Specifies that windows should not be raised when restored.


    NoRaiseOnMove


    Specifies that windows should not be raised when moved.


    NoTitleResize


    Specifies that windows should not be raised when resized.


    NoTitle { win-list }


    If no list is supplied, disables title bars on all windows. If a list is supplied,
    disables title bars on listed windows.


    NoTitleFocus


    Doesn''t allow mouse activity over the title bar to change focus; only mouse activity
    inside the client window will dictate focus.


    NoTitleHighlight { win-list }


    If no list is supplied, disables title highlights to indicate focus. If a list
    is supplied, disables title highlights for the listed windows.


    OpaqueMove


    Specifies that windows should remain intact when moved, rather than moving as
    a rubber-band out.


    RandomPlacement


    Specifies that twm should randomly place new windows on the display rather than
    allow the user to place them.


    SqueezeTitle { win-list }


    Specifies that title bars should be squeezed so that there are only large enough
    to contain window title text. If a list of windows is supplied, changes will apply
    only to listed windows.


    StartIconified { win-list }


    If no list is supplied, starts all windows in an iconified state. If a list is
    supplied, starts the listed windows in an iconified state.'
  merge: -1
