    mice who will use the AxisMapping option. |

    | Emulate3Buttons | | This flag emulates a middle mouse button on a two-button
    mouse. The user can press the button by simultaneously pressing the two physical
    buttons on the device. |

    | ChordMiddle | | This flag is for whose physical middle button indicates a click
    event by sending simultaneous left and right click events to the server. |

    | SampleRate | num | The given parameter sets the number of events the mouse will
    send per second. Not supported by most mice. |

    | Resolution | num | Specify an alternative number here that sets the resolution
