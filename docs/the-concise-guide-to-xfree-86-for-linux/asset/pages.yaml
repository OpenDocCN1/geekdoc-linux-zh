    # fwwm 1 Menus and Functions


    fwwm menus, including the root menu, are built inside the configuration file and
    bound to keyboard or mouse clicks that give a menu to be displayed. The format
    for creating and structuring these is simple; the following is the general format
    for building menus:


    +   Popup "Menu Name"

    Function "Text Item" [additional...]

    Function "Text Item" [additional...]

    ...

    EndMenu


    A menu specification is started with the Popup keyword followed by the internal
    name of the menu to be created. This name is referred to elsewhere in the fwwm
    configuration file when binding it to mouse clicks or keystrokes. A menu is terminated
    by the EndMenu keyword, and in between the Popup and EndMenu keywords, nearly
    any valid fwwm function can appear. Each line in the menu will appear to the user
    as the supplied Text Item, and when selected by the user, the corresponding Function
    will be carried out.


    A list of commonly used built-in fwwm functions appears in Table 9.7. Note that
    there many more than user-definable functions can also be called from menus. When
    fwwm functions are used inside a menu, the Text Item should always come immediately
    following the function keyword and before any arguments that are to be passed
    to the function.'
