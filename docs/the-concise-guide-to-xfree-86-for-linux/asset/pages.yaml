    # XForms


    The XForms library predates the Gtk and Qt libraries for Linux users. When XForms
    initially emerged, some Linux users embraced it as a toolkit with widgets more
    attractive than the Athena widgets, yet an interface that was much easier to program
    than the interface of the Motif library. Other Linux users shunned XForms because
    of its binary-only distribution policy.


    The two applications that brought XForms to prominence are the LyX editor by Mattais
    Ettrich, who went on work with the KDE project, and the XMail email user agent
    by Gennady Sorokopud. In spite of the fact that other tools (most notably Gtk
    and Qt) have come to dominate the Linux community''s programming efforts in recent
    months, the popularity and importance of LyX and XMail have kept XForms alive
    in the Linux community.


    The LyX editor, one of the premier XForms applications for Linux users, can be
    seen in Figure 5.4. Table 5.7 lists some general information about the XForms
    widgets, and Table 5.8 lists some of the peculiarities.


    ![](img/edb2a4591eafaad74c22be9075f4b815_147_0.png)


    Figure 5.4 XForms applications have a distinctive look.'
