    Table 2.4 details the configuration options that can be used within the Files
    section of the X86Config file. Each of these options takes a parameter or list
    of parameters that should be enclosed in a single pair of quotation marks.


    # Table 2.4 Valid Files Section Options


    | Option | Parameters | Description |

    | --- | --- | --- |

    | FontPath | pathname | Sets the search path for fonts that will be available
    to the X server. The server is a comma-separated list of directories or font servers
    where fonts can be found. Adding:unscaled to the end of a directory will tell
    XFree86 not to allow the fonts in that directory to be scaled. A server is specified
    using the format packet/host:port where packet is the packet (usually tcp), host
    is the name of the font server, and port is the port that should be queried (usually
    7100). This option can be used multiple times and each entry will be added to
    the font path |

    | RGBPath | pathname | Refers to the file containing the RGB color database for
    the X server. It should not normally need to be changed |

    | ModulePath | pathname | Sets the search path for modules that will be available
    to the X server. The parameter is a comma-separated list of directories. This
    option can be used multiple times, and each entry will be added to the module
    path |

    | Load | pathname | Name of a module to be loaded by the X server at start time.
    If a full path is not given, all the directories in the module path will be searched.
    A complete list of available modules can be found by visiting the /usr/X11R6/lib/modules
    directory.|


