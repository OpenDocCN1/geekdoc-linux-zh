    # # Three Major Visible GNOME Components


    GNOME is built from an even larger number of discrete components than the KDE,
    and it shows in GNOME''s looser integration and more flexible feel. However, there
    are still a few major components that stand out as important enough in the default
    GNOME composition that, without them, GNOME would be significantly altered in
    appearance or behavior from the perspective of the average desktop user.


    These three components are as follows:


    +   - The GNOME panel application. This is the focus of GNOME desktop activity
    and really the anchor of GNOME''s environment from a user perspective.


    +   - The GNU Midnight Commander, or gmc. The GNOME file manager is responsible
    for desktop icons, file drag-and-drop deatilities, and filesystem browsing.


    +   - The Enlightenment window manager. Although hotly contested as a “real part”
    of GNOME, the Enlightenment window manager has nevertheless come to be associated
    with GNOME as the window manager of choice for GNOME users.


    # # Enlightenment


    The Enlightenment window manager predates GNOME by quite a long time, but it has
    since adopted by GNOME in the eyes of many GNOME users and continues to be the
    window manager most used as a part of the standard GNOME desktop. Even on the
    GNOME page mentioned earlier in the chapter, the user is directed to the Enlightenment
    manager as the manager of choice for GNOME.'
  merge: -1
  pgno: 294
- img_proc: true
  md: 'Enlightenment''s role in GNOME is the standard role played by any window manager:
    to draw decorations on windows and allow the user to interact with them. Enlightenment
    also features some amount of GNOME integration, of course, so that minimized windows
    can appear on the panel and then restored once again by clicking on their panel
    icon.


    One of the primary goals of Enlightenment at its inception and every step since
    that time is configurability with respect to appearance: Enlightenment is a chameleon,
    to say least. The configuration in question is accomplished by building themes,
    which are collections of decorations and behaviors that are to be used when managing
    windows. The Clean theme, one of included and often used with GNOME, is shown
    in Figure 12.3. The Brushed Metal theme, also included with Enlightenment, is
    shown in Figure 12.4 for contrast.


    ![](img/edb2a4591eafaad74c22be9075f4b815_295_0.png)


    Figure 12.3 The Clean theme is a favorite with many more conservative GNOME users.


    Because the function and position of the title bar decorations with each different
    Enlightenment theme, there is no way to document the use of Enlightenment decorations
    in print; it is simply necessary to try a given theme in order to see how Enlightenment
    works while the theme is active.'
  merge: -1
  pgno: 295
- img_proc: true
  md: '![](img/edb2a4591eafaad74c22be9075f4b815_296_0.png)


