  md: '# Linux, x86 Architecture, glibc 1.x (aka libc5)


    This binary distribution supports a wide variety of PC-type hardware running versions
    of the Linux operating system, which are based on the GNU C library 1.x release
    or derivatives—such as Slack Linux, Red Hat 4.x and earlier, Caldera OpenLinux
    1.x. This is the Window System distribution included in most late x86/libc5 Linux
    operating systems, many earlier x86/libc5 Linux operating systems also included
    competing products such as Metro-X from MetroLink. This is likely the second widely
    used of all XFree86 platforms, accounting for much of the remainder of the Linux
    community.


    # Linux, Motorola m68k Architecture


    This binary distribution operates on m68k-based machines such as those by Amiga,
    Atari, or Apple (Macintosh), which are also running the Linux operating system
    for m68k machines. Note that only the virtual framebuffer X server is included,
    meaning that a working framebuffer console on the machine in question is required
    for this XFree86 distribution to work. This is the X System distribution included
    in all m68k Linux operating systems.


    # Linux, PowerPC Architecture, libc 1.99 or pre-2.1


    This binary distribution operates on PowerPC-based machines such as IBM RS6k or
    Power Macintosh machines, which are also running the Linux operating system for
    PowerPC machines. Note that only the virtual framebuffer X server is included,
    meaning that a working framebuffer console on the machine in question is required
    for this XFree86 distribution to work. Note also that there are two versions of
    this binary XFree86 distribution, one for PowerPC Linux systems using GNU lib
    1.99 and for PowerPC Linux systems using GNU lib pre-2.1. This is the Window System
    distribution included in all PowerPC Linux operating.


    # Other (Non-Linux) Supported Platforms


    XFree86 also supports several non-Linux platforms. Some of these, like the BSD-based
    operating systems, are popular in their right, while others (such as the DG/UX
    platform) are more esoteric and market-specific. A complete list can be found
    in Table 2.1.


    # Table 2.1 Other Supported XFree86 Platforms


    | Architecture | Operating System Platform |

    |---|---|

    | x86 (Pentium+) | DG/UX 4.20 Avion | |

    | x86 (386+) | FreeBSD 2.2.x (a.out binary format) |

    | x86 (386+) | FreeBSD 3.0 (ELF binary format) |

    | x86 (386+) | GNU HURD |

    | x86 (386+) | LynxOS (16MB memory required) |'
