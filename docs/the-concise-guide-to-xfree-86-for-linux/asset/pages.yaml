    see whether they conflict. If you find conflicts, you''ll have to decide how to
    best cope with them. A discussion of this sort is beyond the scope of this text,
    and if you find conflicts that you don''t know how to resolve, it would be best
    for you to use binary packages or wait to GNOME.


