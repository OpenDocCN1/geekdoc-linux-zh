  md: '# xlsfonts


    The xlsfonts utility enables the user to search the list of fonts that are explicitly
    known by running the X server and to search the list for a given pattern. When
    run with no arguments, the xlsfonts utility simply lists all known fonts. The
    most common command-line options accepted by xlsfonts are shown in Table 4.27.


    Table 4.27 Most Common Arguments Accepted by xlsfonts

    | Argument | Description |

    |---|---|n| -display hss | Specifies a host, server, and screen from which to
    extract a list of atoms in the format [host]:server[.screen]. For more information
    on specifying a display, see Chapter 15. |

    |-1 [l] | Specifies the long listing format to include font attributes in addition
    to font name. Specifying a second adds a list of font properties. The third adds
    a list of font character metrics. |

    |-m | Specifies that long listings should also give minimum and maximum bounds
    for each font. |

    |-w | Specifies the width of the listing in character columns. The default is
    79 columns. |

    |-n n | Generates the listing in n columns. Specifying 0 tells xlsfonts to try
