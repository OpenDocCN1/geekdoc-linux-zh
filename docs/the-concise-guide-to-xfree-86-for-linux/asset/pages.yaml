  md: '# Getting and Installing ssh


    # Keyword


    # Description


    DenyUsers ptn, ptn, ...


    Denies users whose names match the supplied pattern''s connections.


    FascistLogging yes|no


    If yes, sshd will perform extreme and copious amounts of logging. If no, sshd
    will perform normal amounts of logging.


    IdleTimeout n[s|m]h


    Specifies that a connection should be killed if no data is transferred for a period
    of n seconds, hours, or minutes, depending on whether n is followed by h, m, or
    s, respectively.


    KeyRegenerationInterval n


    Specifies that the server encryption key should be regenerated and updated every
    n seconds to prevent the ability to decrypt stolen sessions. The default is to
    update 3600 seconds.


    PermitRootLogin yes|no


    Specifies whether root logins should be allowed. The default is yes, but some
    users will need to change this.


    Port n


    Specifies that sshd will listen for incoming connections on port n.


    QuietMode yes|no


    If yes, sshd shall operate in quiet mode, with minimal amounts of logging. The
    default is no.


    X11Forwarding yes|no


    Specifies whether X11 forwarding is permitted. The default value is yes, and for
    the purposes of this text should not be changed.


    X11DisplayOffset n


    Specifies the display number to use for the sshd proxy X11 connection. This display
    should be set high enough to avoid conflicting with existing displays on the system
    in question.


    XauthLocation path


    Specifies the default path to the xauth program binary.


    For additional keywords that can be supplied in the /etc/sshd_config file, such
    as those pertaining to authentication via .hosts and /etc/hosts.equiv files, please
    see the sshd manual page. Note that the default /etc/sshd_config is fairly new,
    so users should edit it if possible rather starting from scratch.


    # Configuring ssh


    The ssh configuration is normally stored in the /etc/ssh_config file. The /etc/ssh_config
    file is broken into sections, each section beginning with a Host keyword followed
    by a pattern that matches hosts to the section applies. Within each section are
    several keyword and value pairs, each on a separate line. Some common keywords
    that can appear in /etc/ssh_config are shown in Table 16.2.'
