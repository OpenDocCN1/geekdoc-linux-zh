    # Keyboard, Mouse, and Display Changes with xset


    The xset command is the other most commonly used command for modifying the X server''s
    keyboard, mouse, or display. The most common keyboard changes via xset are shown
    in Table 7.3. The most common mouse changes and output options are shown in Table
    7.4.


    # Table 7.2 Keyboard Configuration with xset


    | Command Line | Configuration Change |

    |---|---|

    | xset c on | Enables click when supported; many different types of hardware don''t
    support click. |

    | xset c off | Disables key click. |

    | xset n | Sets the keyclick volume to n, a number from 0 to 100. |

    | xset led n | Turns on keyboard LED (light) numbered n; valid numbers are 1–32.
    |

    | xset -led n | Turns off keyboard LED numbered n. |

    | xset r on | Enables keyboard repeat for all keys on the keyboard. |

    | xset r off | Disables keyboard repeat for all keys on the keyboard. |

    | xset r n | Enables key repeat for the key given by keycode n; doesn''t affect
    other keys. |

    | xset -r n | Disables key repeat for the key given by keycode n. |

    | xset r rate n1 n2 | On servers that support the XFree86-Misc extension, the
    keys-board-wide key repeat delay to n1 and repeat rate to n2. |


    # Table 7.3 Mouse Configuration with xset


    | Command Line | Configuration Change |

    |---|---|

    | xset m n1 n2 | Sets the mouse acceleration value to n1 and the acceleration
    threshold to n2. This causes the mouse to move n1 times faster when moved at least
    n2 units at once. |

    | xset m default | Restores mouse settings to those that were active when the
    server started. |'
