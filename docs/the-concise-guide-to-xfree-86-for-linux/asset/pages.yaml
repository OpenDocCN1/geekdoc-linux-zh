- img_proc: true
  md: '# The KDE Display Manager (kdm)


    There are five configuration tabs in the dialog. The first three, Appearance,
    Fonts, and Background, are self-explanatory to a large degree, and most users
    will have no trouble navigating them. The last two are a little more involved.


    # The Users Tab


    The KDE display manager has the capability to display icons for a selected set
    of users on the authentication display and to allow users to log in by clicking
    on an icon of themselves and then entering only a password. This capability is
    configured in the Users tab of the kdm configuration dialog.


    The middle column of the dialog contains two lists, one containing selected users
    and the other no-show users. The leftmost column of the dialog is a list that
    contains all users known to the system who aren''t assigned to either of the other
    two lists. On the right side of the dialog are several check boxes.


    When the Show Only Selected check box is checked, only users in the selected users
    list will have an icon on the authentication screen. When the Show All Users By
    No-Show Users check box is checked, all users known to the system who aren''t
    on the no-show list will have an icon on the authentication screen. When the Show
    Users Box is unchecked, icons for users are disabled altogether.


    The icon for each user can vary in appearance as per your preferences; you can
    configure a user''s icon by clicking on one of the three lists and then clicking
    the square icon at the upper-right of the dialog. This action will give you the
    chance to select an icon background image for the user in question. If you choose
    a new background when no user is selected in any list, the new background will
    become the default for all users.


    # The Sessions Tab


    The Sessions tab configures the sessions that will appear in the kdm session type
    drop-down list, as well as a few other miscellaneous-type kdm options.


    The first section of the tab, Allow to Shutdown, decides whether a Shutdown button
    will allow the user to shut down system. The valid choices are Console Only, which
    will allow any user at the physical console to shut down; Root Only, which will
    allow shutdowns to occur only after the root password has been entered; All, which
    will always enable shutdowns; or None.


    It should be noted that any shutdown will affect the system running kdm, not the
    remote system in the case of a remote display.


    The second section of the tab, Commands, enables the user to enter the commands
    that will be run, with root privileges, when a shutdown or reboot is started.'
  merge: -1
  pgno: 334
- img_proc: true
  md: '# Chapter 14 Display Managers


    The third section, Session types, enables a list of session arguments to be entered.
    When at kdm login screen, it is these arguments that will appear in the Session
    type drop-down list and that will be passed to the xsession script, depending
    on which session type the user chooses at login. Therefore, this list should match
    the list of sessions you have configured in the xsession script, usually via a
    case statement.


    # Starting kdm


    Starting kdm is easy; because kdm is largely a drop-in replacement for xdm, all
    the same techniques apply. To test a kdm configuration, log in at a text console
    and simply


    kdm


    After you are confident that kdm is functioning as you want it, feel free to add
    it to the init process and boot straight into X at a kdm login prompt.


    # For More Information


    For more information on configuring and using the KDE display manager, kdm, please
    use the KDE help browser to visit the Login Manager document tree from the KDE
    application help index.


    # The GNOME Display Manager (gdm)


    The GNOME display manager, gdm, includes many of the same features that are present
    in kdm but missing in xdm. Among these are the capability to graphically choose
    among several session types, the capability to shut down or reboot the system,
    and the capability to log in by clicking on a user''s icon. Unlike kdm, however,
    gdm was written from the ground up, so to speak, and therefore does not rely on
    any of the same configuration files or peculiarities that come from xdm.


    # Basic Configuration


    The basic gdm files are kept in the /etc/gdm directory, though some files are
    kept elsewhere and this path varies depending on compilation options. Configuration
    of gdm is done almost entirely through a single file, gdm.conf. The remainder
    of configuration is done by placing files in the relevant subdirectories specified
    in the gdm.conf.


    # The gdm.conf File


    Before the average user can configure gdm, he or she must first discover where
    the gdm configuration file resides. Normally gdm looks for its files in the etc/gdm/
    directory off the GNOME install tree, but this isn''t always the case. Luckily,
    it is fairly easy to locate your gdm.conf file,'
  merge: -1
