  md: '# 212 Chapter 9 Runtime Environment Configuration


    The Context to which this line will apply refers to the location of the mouse
    pointer when the button''s click is registered. Each context is represented by
    a single letter, and multiple letters can be strung together to represent multiple
    contexts to which a binding applies. The valid contexts are shown in Table 9.9.


    Table 9.9 Valid Mouse Contexts

    | Context | Description |

    |---|---|

    | R | The pointer is over the root window. |

    | W | The pointer is inside an application window. |

    | T | The pointer is over a window title bar. |

    | S | The pointer is over the window border. |

    | F | The pointer is over the window frame (handles at the corners of a decorated
    window''s). |

    | I | The pointer is over a minimized application''s icon. |

    | 0–9 | The pointer is over the title bar represented by the numbers 0–9. Even-numbered
    buttons are on the right side of the title bar, odd-numbered buttons are on the
    left side of the title bar. Normally only three buttons (one at the left, 1, and
    two on the right, 4) appear in fwwm. However, more will appear functions are bound
    to them using the Mouse keyword. More details on functions can be found in the
    next section. |

    | A | The pointer is in any one of the listed contexts except the title bars or
    the inside of the window. |


    The Modifier specifies that the binding should only apply to mouse clicks that
    were registered while a specific modifier was active. Modifiers can be strung
    together to indicate that multiple modifiers are involved in this binding. A list
    of valid modifiers can be found in Table 9.10.


    Table 9.10 Valid Modifiers for the Mouse Keyword

    | Modifier | Description |

    |---|---|

    | N | Click is valid only when no modifiers are active. |

    | C | Click is valid only when the control modifier is active (normally when the
    Ctrl key is held down). |

    | S | Click is valid only when the shift modifier is active (normally when the
    Shift key is being held down). |

    | M | Click is valid only when the meta modifier is active (normally when the
    Alt key is being held down). |

    | A | Click is active for any modifier or combination of modifiers. |'
