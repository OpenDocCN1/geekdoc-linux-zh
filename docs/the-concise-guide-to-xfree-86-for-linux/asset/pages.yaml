  md: '# Interacting with X


    The virtual desktop looks and behaves just like a desktop if it would all fit
    onscreen—except it doesn''t fit all onscreen. The net effect is that you can see
    only 800×600 pixels of the desktop at a time, and moving the cursor to any edge
    of the display will cause the visible window to scroll in that direction to the
    end of the virtual desktop.


    Many users find this trick enlightening—the ability to use a larger desktop than
    the monitor display is often considered to be a boon. On the other hand, many
    other users expect to be able easily move their mouse cursors to the edge of the
    screen and stop, and such users often report "seasickness" or at least severe
    at the virtual desktop scrolling. If you find yourself in this camp, please refer
    to the "Advanced Configuration" section of Chapter 2, "Installing and Configuring
    XFree8 for x86config file options on limiting the size of the virtual desktop
    to the size of the visible window.


    The peculiarity about the mouse cursor, which isn''t really an artifact of the
    cursor at all, but really an artifact of the Linux operating system and the way
    it interacts with X, is the lack of a "busy" cursor, such as the hourglass in
    Windows. Many new users find themselves having difficulty adjusting to a busy
    cursor while a program is starting, leading some users to drag a program twice
    or three times, each time looking for the busy cursor to indicate that the program
    is loading.


    Some applications implement their own internal busy mouse cursor, which is displayed
    when an image is rendering or a file printing, for example. But in general, Linux
    and X are never too busy to accept your input—and therefore, no busy cursor will
    ever be displayed, even if a program as Netscape or WordPerfect is in the process
    of loading.


    # Root or Start Menu


    Although the individual appearances, behaviors, and configurations of the many
    different window managers vary greatly, one element is consistent across nearly
    all of them, with the exception of the environments like KDE and GNOME.


    The root menu is alike of UNIX desktops everywhere, where it sometimes masquerades
    as a Start menu (in the case of FVWM-95). The typical behavior of the root menu
    is to appear when the user clicks one of the buttons (usually either the left
    or the right mouse button) while the mouse cursor is over the root window (not
    in any other window). When the user clicks the root window, a menu appears under
    the root cursor with several options. Typically, there will be options for window
    control, launching applications, or both, often listed in a series of cascading
    submenus. Some window manager configurations even implement more than one root
    menu. For example, a common configuration is to list applications when the user
    left-clicks the root window, window operations when the user right-clicks the
    root window, and running applications when the user middle-clicks the root window.'
