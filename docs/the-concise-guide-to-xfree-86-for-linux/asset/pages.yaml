    \ Title\n+ \"Management\" Iconify\n+ \"Resize\" Resize\n+ \"Move\" Move\n+ \"\
    Raise\" Raise\n+ \"Lower\" Lower\n+ * Nop\n+ \"Kill\" Destroy\n+ \"Delete\" Close\n\
    + * Nop\n+ \"Refresh\" Refresh\n+ \"Restart\" Restart\n```\n\n```\nAddToMenu Exit\
