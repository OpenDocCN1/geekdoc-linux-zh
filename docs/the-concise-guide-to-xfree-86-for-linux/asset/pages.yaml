  md: "Once defined, user functions can be bound to keyboard or mouse events or included\
    \ in menus by using the f.function function.\n\n# Building Menus\n\ntwm menus\
    \ are built using the Menu variable followed by a list that composes the body\
    \ of the message and any functions that are called from the message body. The\
    \ general format for the Menu variable and associated list is as follows:\n\n\
    ```\nMenu \"menuname\" (textcolor:background)\n{\n  Menu \"item\" (textcolor:background)\
    \ f.twwm-function\n  Menu \"item\" (textcolor:background) f.twwm-function\n}\n\
    ```\n\nThe menu is given the name menuname, as supplied by the user, and default\
    \ foreground and background colors of textcolor and background, respectively.\
    \ Each item in the menu displays the text given by Menu item when seen by the\
    \ user and calls f.twwm-function when selected. Individual colors can be given\
    \ on a per-item basis as well. Note that all color specifications are optional;\
    \ if omitted, the defaults from the color list in the dotfile will be used instead.\
    \ One special function, f.title, is used to give a title to a twwm menu.\n\nThe\
    \ following is a sample set of two menus, one submenu to the other. The first\
    \ menu also contains items to launch two X clients. The second menu contains options\
    \ to restart or exit the twwm window manager.\n\n```\nMenu \"ExitMenu\"\n{\n \
    \ \"Exit Menu\" f.title\n  \"Restart TWM\" f.restart\n  \"Exit TWM\" f.quit\n\
    }\n```\n\n```\nMenu \"MainMenu\"\n{\n  \"Main Menu\" f.title\n  \"Terminal\" !xterm\
    \ &\n  \"Calculator\" !xcalc &\\n  \"Exit Menu\" f.menu \"ExitMenu\"\n}\n```\n\
    \nNote that the menu definition is order-important. That is, all submenus must\
    \ be defined before they are called from menus later in the file."
