    #  Basic Fonts Included with XFree86 3.3.5


    This section lists the X Logical Font descriptions for the explicitly bitmapped
    fonts in the 75dpi/ directory and the XLFDs for the scaled fonts in the Type1/
    and Speedo/ directories. 100dpi/ and nonwestern fonts are not shown here.


    #  XLFDs in 75dpi/


    The fonts in the 75dpi/ directory are bitmapped fonts, meaning that they come
    in a predefined set of sizes and that any scaling that takes place will likely
    result in fonts that are imperfect in appearance. The following Logical Font descriptions
    are the complete list of explicitly bitmapped fonts and sizes included in XFree86
    3.3.5. Sizes not listed here will be scaled or displayed incorrectly if displaying
    on a remote or local server that does not support font.


