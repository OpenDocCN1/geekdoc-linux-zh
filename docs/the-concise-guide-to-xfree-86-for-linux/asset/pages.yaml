  md: '# Choosing Your Video Card or Chipset


    Now we''ve come to the most difficult question you''ll encounter in xf86config
    and the most Linux users have trouble with. Read the information on the screen,
    and then type a and press Enter to look at the video card database. When the card
    database begins to display, notice that it is basically a list of video cards,
    identified by their model name and on the video chipset they use on. The following
    is a section of this:


    +   6 ASUS PCI AV2864T ATI Mach64

    7 ASUS PCI V264CT Mach64

    8 ASUS Video Magic PCI V864 S3 864

    9 ASUS Video Magic PCI VT64 S3 Trio64

    10 AT25 Alliance A3D

    11 AT3D Alliance A3D

    12 ATI 3D Pro Turbo ATI Mach64

    13 ATI 3D Pro Turbo PC2TV Mach64

    14 ATI 3D Xpression Mach64


    As you can, the database lists cards in alphabetical order by manufacturer. To
    proceed to the next page of the database, press Enter all by itself.


    If you''re lucky enough to find an exact match for your video card''s make and
    model in the list, simply enter the corresponding number and proceed with the
    rest of xf86config process. If you proceed all the way to the end without finding
    your card by manufacturer, press Enter again to go back to the beginning of the
    list, and time watch for the video chipset you found on your video card. For example,
    if the largest chip on your card is labeled with the painted S3 logo and has the
    label Vision864 86c64 on it, you''d choose this entry:


    435 S3 86c64 (generic) S3 864


    If you can''t find your card listed by chipset either, you''re probably in trouble.
    You can try similar chipsets to begin with. For example, a Western Digital WD90C26
    chip will sometimes with a WD90C24 driver. An ET4000AX chip will work with the
    generic ET4000 driver. Still, you''re really trying your luck at this point, and
    it might be just time to go out and get a new video card at all possible.


    # Choosing an X Server


    After you''ve selected a video card or video chipset for XFree86, it''s time to
    select an X server. The server you want to select the most often, when present,
    is the last one:


    +   5 Choose the server from the card definition


    This choice is usually the best because it is based on what Free86 knows about
    your graphics hardware. The name of an X server will be listed at the end of this
    option; if you''ve installed that server, you should select this option and remember
    to install the matching server after you are finished with xf86config. For installation,
    see the section called "Installing XFree86,” earlier in this chapter.'
  merge: -1
