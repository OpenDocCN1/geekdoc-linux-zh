  md: '# 6


    # RUNTIME SESSION


    # DEFAULTS


    Previous chapters have discussed the X server in quite a bit of detail. The X
    server''s function is clear, and the repository for X server configuration, the
    xf86Config file, has been well documented. The standard XFree86 desktop and utilities
    have also been discussed at some length.


    However, there is an important step between the moment the user types start at
    the console prompt and the point at which the default desktop has finally been
    loaded. After the start command has been loaded and the X server started, how
    does the system decide that the twm window manager and all the xtwm windows should
    be started? On the default desktop, how is it decided that the login window should
    be the controlling process for the X session?


    Clearly, some behavioral defaults are at work that decide which window manager
    to launch, which processes to start, and which process will be the controlling
    process. In fact, several other default actions are also performed at the start
    of an X session runtime in most XFree86 installations.'
  merge: -1
