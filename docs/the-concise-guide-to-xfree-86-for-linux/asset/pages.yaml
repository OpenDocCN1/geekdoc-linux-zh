  md: '# 15


    # WORKING ON THE

    NETWORK


    You might remember the assertion from Chapter 1, "X11R6 and the XFree86 Project,"
    that X is really, at its heart, a data stream that can be used as a network protocol.
    This implies that a stream of windows, icons, fonts, and pointer movements can
    be sent across a network just as easily as text information can be sent, and in
    today''s distributed office environment, this is an important goal. So far, however,
    with the exception of a few hints in this direction in Chapter 14, "Display Managers,"
    we haven''t seen much of the network-readiness of X. How does one take advantage
    of the basic network-centric nature of X?


    # Taking Advantage of Network-Centric X


    Recall from Chapter 1 that all X programs are real clients that run on a host
    machine and connect to an X server that can be running on the same host or a second
    host elsewhere on the network. It is this X server that will draw client windows
    and graphics and enable the user to interact with them. The default behavior when
    a client is started to connect to the X server running on the local machine (the
    machine on which the client is running). The real goal, then, in network-enabling
    your X use, is to be tell clients to connect to a remote machine''s X server instead
    of trying to connect to the X server on their own machines.'
  merge: -1
  pgno: 342
- img_proc: true
  md: '# Referring to X Displays on the Network


    The first step in fulfilling this goal is being able to describe another machine
    on the network to X clients. All Linux users should be familiar with Internet-style
    domain names that are used when browsing the Web using the HTTP protocol, getting
    files using the FTP protocol, or read-ing netusers using the NNTP protocol. In
    all these cases, referring to the machine in question is a simple matter—the fully
    qualified domain name of the host or server in question is enough to start a connection
    and transfer data.


    Unfortunately, things are a little more complicated with the X Window System.
    Although XFree86 on Linux machines does not enjoy such capacity, X Window System
    machines based on more traditional UNIX hardware can have multiple X displays,
    and each of those clients have multiple screens. When connecting to an X server
    in hopes of displaying X client, it is therefore necessary to specify not only
    a machine where the client should display itself, but also a display, and in some
    cases, a screen within that display. Specifying a display can also be helpful
    when X servers are running on a single machine with multi-virtual consoles. The
    basic format for host, display, and screen specification is as follows:


    ```

    [fqdn.on.the.net]:d.s

    ```


    The optional first part of the address after the colon is the fully qualified
    domain name of the machine in question, or alternatively, its local network. If
    no host or domain name is given, the local host is assumed. After the mandatory
    colon, d indicates the display number on the host, 0 being the first display,
    1 being the second, and so on. An optional addition to the address is a period
    followed by s, the screen number on the specified display, with 0 being the first
    screen, 1 being the second, and so on. Table 15.1 dissects a few addresses.


    | Table 15.1 Some X Network Addresses |

    | Address | Description |

    | :0 | The first screen (assumed) on the first display on the local host. This
    is the default display to which clients connect unless to otherwise. When connecting
    to the local machine may way, clients will connect to the server using the fastest
    possible transport method, usually UNIX domain sockets. |

    | :0.0 | The first screen on the first display on the local host. Equivalent to
    :0 and sometimes seen instead. |

    | :1.1 | The second screen on the second display on the local host. Never seen
    on Linux/x86 systems running XFree86, but might be seen on other UNIX machines.
    |'
