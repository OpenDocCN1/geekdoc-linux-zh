  md: "# Using ssh with X\n\nTwo primary types of data should be encrypted when working\
    \ with X on the network. The first is the transmission of magic cookies for token-based\
    \ authentication; the second is the X data stream itself. Note that ssh will automatically\
    \ exchange encrypted magic cookies for you when tunneling an X data stream, so\
    \ in reality, after ssh is installed, you'll rarely need to exchange cookies manually.\n\
    \nBefore either form of secure transfer can be accomplished, the ssh daemon must\
    \ be running on the machines that will need to accept ssh connections.\n\n# Starting\
    \ the ssh Daemon\n\nThe ssh daemon is easy to start from the command line. Simply\
    \ become root and issue the following-command:\n\n```\n/usr/local/sbin/sshd\n\
    ```\n\nBecause ssh considers itself to be a daemon, it kindly places itself in\
    \ the background automatically. For systems that will be used on an X network\
    \ on a continuous basis, it is more helpful to insert a call to sshd from within\
    \ the init process. This process will be in the /etc/rc.d/rc.local file or sooner\
    \ in the process. One possible addition to /etc/rc.d/rc.local would be\n\n```\n\
    /bin/echo -n 'Starting sshd: '\nif [ -x /usr/local/sbin/sshd ]; then\n  /usr/local/sbin/sshd\n\
    \  /bin/echo done\nelse\n  /bin/echo not found\nfi\n```\n\nSome users might object\
    \ to the idea of having an inetd sshd each time a connection is requested. The\
    \ ssh daemon might want to have inetd start sshd each time a connection allows\
    \ this kind of functionality as the -i option is supplied on the command line.\
    \ To have inetd start sshd each time an incoming connection must be started, edit\
    \ the /etc/services file to contain the following line:\n\n```\nssh 22/tcp secure\
    \ shell\n```\n\nThen, edit the /etc/inetd.conf file to contain the following line:\n\
    \n```\nssh stream tcp nowait root /usr/sbin/tcp /opt/bin/sshd -i\n```\n\nAfter\
    \ the changes have been made, restart the inetd server using the hangup signal\
    \ to have it reread its configuration files:\n\n```\nkillall -HUP inetd\n```"
  merge: -1
