  md: '# X Desktop Components 85


    ![](img/edb2a4591eafaad74c22be9075f4b815_100_0.png)


    **Figure 3.3** The default twm menu as supplied by XFree8.


    Most X window managers are programmed with a certain clearly defined set of capabilities
    and behaviors that can then be enabled, disabled, or personalized by the user
    based on his or her preferences. The most common forum for such configuration
    is a *dotfile*, a text-based configuration file that contains a configuration
    language known only to the window manager in question. This approach adds a great
    deal of complexity to the maintenance of a graphical user interface when compared
    to the fixed-functionality and fixed-appearance approaches of Windows or the Mac
    OSes, but it also adds a great deal of flexibility.


    # # Applications


    Most applications on an X desktop are easily identifiable; they appear as windows
    that usually contain some sort of information, data, or that allow some sort of
    user interaction. The default XFree86 desktop, the applications can be thought
    of as any window areas that aren''t the root window, mouse cursor, or window manager
    decorations.


    The automatically launched `login` and `xclock` windows shown in Figure 3.4 are
    examples of just such application windows. Note that the window has been decorated
    by the window manager with a title bar, border, minimize, and resize buttons.'
