  md: '# Window Styles


    In addition to the capability to apply styles to title bar buttons, fwwm also
    includes the capability to apply styles to specific groups of application windows.
    The Style keyword is used in the fwwm configuration file like this:


    Style "window" option, option, ...


    The window is given either as an application name, such as one finds using editres,
    or by supplying either complete or partial window title (which may be completed
    using wildcard characters). After the window to which the style applies is specified,
    a list of options is specified. Options can be any of those shown in Table 9.12.


    | Table 9.12 Options Supported by the Style Keyword |

    |---|---| |

    | borderWidth n | This window''s border should be n pixels wide. |

    | HandleWidth n | This window''s border handles should be n pixels wide. |

    | Icon file | Use this icon for the window when minimized. |

    | NoIcon | Don''t use an icon when minimized. |

    | Title/NoTitle | Display or don''t display a window title. |

    | Handles/NoHandles | Display or don''t display border handles. |

    | WindowListHit | Display this window in window lists. |

    | WindowListSkip | Don''t display this window in window lists. |

    | CirculateHit | When circulating through windows, let this window take focus.
    |

    | CirculateSkip | When circulating through windows, don''t let this window take
    focus. |

    | StaysOnTop | Ensure that this is always on top. |

    | StaysPut | Other windows can be raised over this one. |

    | Sticky | Keep this window on the current visual display, regardless of paging.
    |

    | Slippery | This window should not stay visible when paging to another area of
    the desktop. |

    | StartIconic | Start this in minimized state. |

    | StartNormal | Start this in a restored state. |

    | Color for/back | Use fore as the title color and back as the decoration for
    this window. |

    | StartsOnDesk n | Start this window on desktop area n. |

    | StartsAnywhere | Start this window on the visible area. |

    | IconTitle | Display an icon and a title when minimized. |'
  merge: -1
