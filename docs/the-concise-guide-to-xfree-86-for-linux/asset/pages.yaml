- img_proc: true
  md: '# 48 Chapter 2 Installing and Configuring XFree86


    If you''re sure you need to choose another server, you should do so. Usually when
    you disagree with XFree86''s choice, the only other server you should consider
    using is the XF86_SVGA server contained in XVGA, which often contains alternative
    drivers for certain types of video hardware. The other server choices, XF86_VGA16
    and XF86_Mono, are either very limited in capability or only on special old hardware
    that is rarely used anymore.


    After you''ve selected a server, xf86config might ask you if you want to create
    a symbolic link to the new server at /usr/X11/bin/x8. In all cases, this is necessary,
    and you should choose y unless you are absolutely sure that you don''t want the
    new server to operate.


    # Video Card Memory and Identifier


    After you''ve selected the server you want to use, you''ll be asked to enter some
    more information about your video card. The first question you''ll be asked has
    to do with the amount of memory installed on your video card. Choose the amount
    of memory that matches your card''s configuration or select the last option, Other,
    and input your number in kilobytesobytes.


    The next screen will ask you for an identifier, a vendor, and a model name, only
    this time for your video card instead of your monitor. Again, the answers you
    give here are primarily for your information you should choose at some point to
    edit the configuration file by hand. Choose an identifier that is short and easy
    to remember, and input the vendor and model name at the following prompts.


    # Selecting a Ramdac


    On the next screen, you''ll be given a two-page list of ramdac chips to choose
    from. It begins like this:


    +   1 AT&20C498 (S3 and AGX servers, ARK driver)

    2 AT&20C498/21C498/22C498 (S3, autodetected)

    3 AT&20C489/28C499 (S3, autodetected)

    4 AT&20C505 (S3)

    5 BrookTree BT481 (AGX)

    6 BrookTree BT482 (AGG)


    To see the second page of choices, press Enter by itself.


    Users of the S3, AGX, W32, and SVGA servers need to pay attention to this question.
    Other users should enter o to have XFree86 autodetect their ramdac each time X
    launches. Users who need to answer this question should check the list to see
    whether it contains the ramdac given SuperProbe or whether any of the entries
    in the list match any of the chip names they copied down while looking at their
    video card physically. If your ramdac isn'' listed exactly, the best thing to
    do is choose o and attempt to have XFree86 autodetect your DAC each time. Most
    of the time, XFree86 will get it right if your DAC is supported.'
