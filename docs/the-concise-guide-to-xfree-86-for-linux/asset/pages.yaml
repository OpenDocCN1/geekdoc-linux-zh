- img_proc: true
  md: '# 26 Chapter 2 Installing and Configuring XFree86


    The most important operation performed by the post-installation script is the
    addition of the /usr/X11R/lib/ directory to the /etc/ld.so.conf file and the subsequent
    execution of ldconfig command. This sequence of steps tells Linux where the newly
    installed XFree86 libraries reside and allow Linux to use them when appropriate.
    For the paranoid, these steps can be verified or repeated by hand. First, check
    to make sure that the /usr/X11R/lib/ directory has been added to the /etc/ld.so.conf
    file by displaying the file onscreen:


    ```

    cat /etc/ld.so.conf

    ```


    Then, after you have verified that the /usr/X11R/lib/ directory appears in the
    file, call ldconfig to update the cache:


    ```

    /sbin/ldconfig

    ```


    Assuming everything went as planned, XFree86 should now be installed on your system.


    # If Everything Didn''t Go as Planned


    In rare cases where everything did not go as planned, there is a second, kludgy
    method for installing the official XFree86 distribution. This is an unsupported
    method, meaning that you shouldn''t complain to the XFree86 maintainers if it
    fails to work. It often does work, however, when one of the three scripts has
    an unidentifiable or unsolvable error.


    To use this kludgy installation method, follow these steps carefully. First, make
    the directory to hold XFree86:


    ```

    mkdir /usr/X11R6

    ```


    Then, extract all the downloaded packages directly using the tar command. Be sure
    to visit the first directory.


    These two commands should complete without error. If either one of them fails,
    be sure that you have disk space available using the df command and perhaps re-download
    the packages. Assuming that they did unpack without problems, you can proceed
    to add the /usr/X11R6/lib directory to library cache by using the following two
    commands:


    ```

    echo ''/usr/X11R6/lib/'' >> /etc/ld.so.conf

    /sbin/ldconfig

    ```


    Note the use of greater-than symbols (>). Do not use a single greater-than symbol
    because it will render parts of your Linux system inoperable! Now you must update
    your font directory by hand. To do so, first visit /usr/X11R6/lib/X11/fonts:


    ```

    cd /usr/X11R6/lib/X11/fonts

    ```'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'Once there, visit each of its subdirectories, issuing the command mkfontdir
    in each directory. For loop to simplify the process is shown here:


    ```

    cd /usr/X11R6/lib/X11/fonts

    for dir in *; do

    cd $dir

    /usr/X11R6/bin/mkfontdir

    cd ..

    done

    ```


    After you''ve completed this step, the “kludgy” install should be complete. Be
    aware that there might be subtle problems with this install method in any given
    release of XFree86. Unfortunately, sometimes this method is necessary anyway.


    # Tying Up Loose Ends


    XFree86 is now mostly installed on your system. However, there might be one or
    two loose ends to clean up. The first of them applies no matter which of the two
    installation methods you chose, or if you installed XFree86 from your Linux CD-ROM.
    You must check to make sure that the symbolic link at /usr/X11R6/bin/X points
    to the X server you want to use. To find out, type this command at a shell prompt:


    ```

    ls -l /usr/X11R6/bin/X

    ```


    If this symbolic link does not exist, or if it points to the wrong server, you''ll
    want to remove it and link it to the correct server. The name of the correct server
    will be similar to the name of the server package you chose to install, but it
    will start with XF86_ instead of x and will not end with .tgz. For example, if
    you want to use the server contained in XSVGA.tgz as your default server, you''ll
    need to create a symbolic link to /usr/X11R6/bin/xF86_SVGA. If you want to use
    the server contained in XA6G.tgz as your default, create your symbolic link to
    /usr/X11R6/bin/xF86_A6G. Here''s an example, first using rm to remove the old
    link if it is incorrect, and then to create the new one:


    ```

    rm /usr/X11R6/bin/X

    ln -s /usr/X11R6/bin/XF86_SVGA /usr/X11R6/bin/X

    ```


    Assuming that one of the normal (script files, CD-ROM packages) or abnormal (kludgy)
    methods worked, and you verify the correctness of the symbolic link at

    /usr/X11R6/bin/X, you can safely assume that XFree86 is installed on your system
    and proceed to configuration.'
  merge: -1
