  md: '# 204 Chapter 9 Runtime Environment Configuration


    | Keyword | Description |

    | --- | --- |

    | NoPosition | Doesn''t allow new windows to place themselves; instead, requires
    that either fwm or the user places them. |

    | OpaqueMove | Causes windows smaller than n percent of the visible display to
    remain intact (no rubber-band outline) during moves. |

    | OpaqueResize | Causes windows to remain intact (no rubber-band outline) during
