- img_proc: true
  md: '# 8

    RUNTIME APPLICATION

    CONFIGURATION


    In Windows and Mac OS systems, most applications that are configurable to any
    degree include a configuration panel on which such configuration changes are made.
    Although this is sometimes the case in Linux systems with larger applications
    (especially commercial ones), there exists in Linux a large class of applications
    that do not enjoy such obvious methods for configuration.


    For these applications, most of which are based on the Xt Intrinsics or the Athena
    widgets toolkit, configuration is accomplished through largely nonobvious means,
    modifying information in a compilation of widget and application properties known
    as the X Resource Database, also sometimes referred to as X resources.


    # The X Resource Database


    It isn''t necessary to understand the underlying mechanism behind the X Resource
    Database to be able to use it effectively; it is easiest to think of the resource
    database as a list of matching keys and values. Each key refers to some property
    of an application or a widget. For example, one application might contain resources
    (keys) for whether a given widget is clickable, what color the background window
    for the application will be, and how many times the user must click an icon to
    obtain a desired result. For each of these resource keys, there is a value. For
    example: Yes, the widget is clickable, the background window should be blue, and
    the icon must be clicked three times for an action to occur.'
  merge: -1
  pgno: 192
- img_proc: true
  md: 'Although the database of properties is maintained behind the scenes, as it
    were, there are several ways for the user to modify the values of various resources
    to alter or control the way in which a program behaves, similar to preferences
    or control panels in applications that support interactive configuration. Before
    you can change the values of an application''s resources, however, you must know
    which aspects of the application can be altered, or, to put it in another way,
    which resources exist that can be changed.


    # Widget Hierarchies


    Before we learn to find these configuration resources, it is important to know
    what they look like. Most graphical applications are built in what can loosely
    be described as an object-oriented manner. That is to say, a window is a series
    of objects that appear to interact with and contain one another. Each of these
    objects has several properties, including visual properties like size and color,
    as well as behavioral properties that are often less obvious.


    For example, an application is an object that contains a window which is displayed
    to the user. The window is in turn an object, inside which you might find a button.
    Inside the button you find a label, the text that appears in the button. In X,
    the hierarchy is commonly denoted beginning with the top object and moving downward
    in the list, separating each object with a period. For example, the following
    list logically illustrates the principle:


    ```

    application.window.label

    ```


    This list is a quick way to refer to a label that is inside a button is inside
    a window that belongs to an application. If we wanted to refer to the button rather
    than to the button''s label, we could logically say


    ```

    application.window.button

    ```


    In the real world, applications have names, windows have titles, and there can
    be more than one button in a given window. Thus, real-world lists of this type
    more often look like:


    ```

    xman.topBox.form.helpButton.label

    ```


    This list refers to a label on a specific button (the help button) in a form (an
    assembly of buttons and other widgets) in a window known as topRight is owned
    by an application called xman. Such as using the preceding is one useful because
    it refers to a specific aspect of the xman program—the label on the help button
    in the topRight window. This list of xman components is an X resource. With it,
    the user can refer accurately and unambiguously to a specific object inside the
    xman program, in order to tell X to alter the object''s properties.


    Of course, it is difficult to understand by just reading theory and looking at
    xman what all this really means, where this list of widgets comes from, or how
    to use a resource like the preceding. That is where the editres utility becomes
    useful.'
  merge: -1
  pgno: 193
- img_proc: true
  md: '# Resources and edrites


    Discovering which aspects of an application are subject to configuration isn''t
    a simple task. The basic method for discovering a list of resource keys is through
    use of the edit command. The editres command is like a universal, albeit cryptic,
    control panel for programs that are configured via X resources, instead of through
    their own internal mechanisms.


    The editres command is an interactive, X-based program and can be started simply
    by issuing it as a command from an xterm window:


    ```

    editres &

    ```


    The editres utility doesn''t support any program-specific options on the command
    line, so it''s always launched in the same way. After editres has started, you''ll
    see a window like the one in Figure 8.1. The best way to understand the nuances
    of using editres is to step through a session, following along in the text.


    ![](img/edb2a4591eafaad74c22be9075f4b815_194_0.png)


    **Figure 8.1** The editres window as it appears immediately after being launched.


    Note that we''ll be using color names from the color database and fonts in the
    form of X Logical Font Descriptors (XLFDs) in the sample session that follows,
    if you need to, refer to Chapter 6, “Runtime Session Defaults,” for details on
    the color database. Consult Chapter 4, “Standard XFree86 Programs and Utilities,”
    for information on using the xfontsel command to find X Logical Font Descriptors.'
  merge: -1
  pgno: 194
- img_proc: true
  md: '# A Sample editres Session


    At first glance, the editres window is quite boring: an empty canvas with two
    drop-down menus at the top, Commands and Tree. To begin to illustrate the basic
    use of editres, let''s configure the xterm from which it was just launched. Start
    by selecting the first entry in the Commands drop-down, Get Tree, and then clicking
    the active cursor (which appears as a cross) in the xterm window. A small, sideways
    tree appears in the canvas area, as shown in Figure 8.2.


    ![](img/edb2a4591eafaad74c22be9075f4b815_195_0.png)


    **Figure 8.2** After selecting the xterm window, the editres pane displays a small
    tree widget.


    This tree is a list of the three main widgets in the xterm program: xterm, the
    main widget; vt100, which is responsible for xterm''s imitation of a Digital Equipment
    Corporation VT100 dumb terminal; and shellect, which is responsible for some aspects
    of xterm''s interaction with the outside X world and the window manager. Each
    of these widgets is likely to support a list of configurable properties, or resources,
    which you can alter to change the behavior of the widget. Let''s start by changing
    an obvious property of the main widget, xterm. Select the xterm widget by clicking
    on it. It will be highlighted to indicate that you have selected it. Then, Show
    Resource Box from the Commands drop-down menu. A window with several columns of
    cryptic names will appear, as shown in Figure 8.3.'
  merge: -1
  pgno: 195
- img_proc: true
  md: '# The X Resource Database 181


    ![](img/edb2a4591eafaad74c22be9075f4b815_196_0.png)


    Figure 8.3 The xterm resource box displayed. The configurable resources for the
    xterm widget appears in columns.


    The first thing to notice about the resource box window is that there are several
    buttons at the top of the window. The most important of these are the buttons
    in the top row, which construct, using buttons, a resource string of the type
