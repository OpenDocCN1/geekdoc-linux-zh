  md: '# # xslatoms


    The xlsatoms utility is used to list the atoms currently defined in the running
    X server. In X, an atom can be thought of as a basic unit of anything. The X protocol
    uses these atoms to communicate with the network; an atom can represent a font,
    a cursor, a behavior, or even a property. Most users will need to use the list
    generated by xlsatoms, but it can be useful for debugging purposes, especially
    when writing X-centric code like window managers. The most common command-line
    options accepted by xlsatoms are shown in Table 4.25.


    | Table 4.25 Most Common Arguments Accepted by xlsatoms |

    | Argument | Description |

    | -display hss | Specifies a host, server, and screen from to extract a list of
    atoms in the format [host]:.screen. For more information on specifying a display,
    see Chapter 15. |

    | -format printf_str | Specifies an output format for each pair of values. The
    format specifier follows the format of the printf command in C. The default format
    is %d\t, displaying a decimal number, followed by an atom name. |

    | -name text | Specifies the name of atoms to list. |

    | -range n-n | Specifies a range of atoms to list, from low bound to high bound.
    If the low bound is omitted, the list will begin with atom number 1. If the high
    bound is omitted, the list will stop at the first undefined atom. |


    # # xlsclients


    The xlsclients utility lists all the clients on a given display or server. It
    is most useful for generating session management scripts. The most common command-line
    arguments accepted by xlsclients are shown in Table 4.26.


    | Table 4.26 Most Common Arguments Accepted by xlsclients |

    | Argument | Description |

    | -display hss | Specifies a host, server, and screen from to extract a list of
    atoms in the format [host]:.screen. For more information on specifying a display,
    see Chapter 15. |

    | -a | Lists all clients connected on all screens, instead of just the client
    screen. Most Linux users will not use this option because XFree86 doesn''t support
    multihead display. |

    | -l | Generates a long format listing, providing details about the window name,
    icon name, command line, and machine. |

    | -m | Specifies the maximum length of the displayed command string. The default
    limit is 10,000 characters. |'
