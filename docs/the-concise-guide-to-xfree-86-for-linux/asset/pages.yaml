  md: '# 3 LAUNCHING XFREE86


    After XFree86 has been installed, the most fundamental way to launch X is to start
    the X server on the command line by itself. To start the X server alone, type
    the following command from a text console:


    ```

    /usr/X11R6/bin/X

    ```


    When you''re not logged in as root, you''ll need to start the server using the
    security wrapper, like this:


    ```

    /usr/X11R6/bin/X/wrapper

    ```


    When the X server is started in this way, it will read the X86Config file either
    from /etc or /usr/X11R6/lib/X11 and start using the greatest possible resolution
    at the default color depth given in the file. The server displays a hatch pattern
    background and an X-shaped cursor, as shown in Figure 3.1. For a complete list
    of supported command-line options, see the manual page for X server.'
  merge: -1
  pgno: 94
- img_proc: true
  md: '![](img/edb2a4591eafaad74c22be9075f4b815_95_0.png)


    Figure 3.1 The X server alone doesn''t provide much functionality.


    Several options are commonly supplied to the X server when starting it. The most
    common of these are shown in Table 3.1.


    Table 3.1 Common X Server Command-Line Options

    | Option | Description |

    |---||

    | c n | Enable key-click using volume $n$ (1–100). Enabling this will cause key
    presses to generate a clicking sound. |

    | -bestRefresh | Choose the best refresh rate for the initial display mode rather
