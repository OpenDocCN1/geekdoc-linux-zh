- img_proc: true
  md: '# 308 Chapter 14 Display Managers


    If the local server is to be started in a depth other than the default depth given
    in the XF86Config file, the -bpp argument can be supplied:


    ```

    : local /usr/X11R/bin/X -bpp 32

    ```


    Entries containing the word foreign in the second column typically are needed
    only for X terminal hardware that doesn''t support XDMCP.


    Note that, because current versions of XFree86 don''t support multihead operation,
    and most users'' networks no longer use XDMCP-incompatible X terminals (or X terminals
    at all), having more than one noncomment line in this file is rarely necessary.


    # Xaccess


    This file is used to restrict or enable XDMCP requests from remote hosts. In its
    simplest form, the file is simply a list host or fully qualified domain names,
    wildcard characters permitted, to which XDMCP service will be denied (if preceded
    by an exclamation mark) or allowed (if not preceded by an exclamation mark) The
    NOBROADCAST flag, when listed after a host or set of hosts, specifies that (they)
    will be allowed only direct access to XDMCP rather than responding to broadcast
    queries, which can result in the xdm server appearing on automatically generated
    session menus. For example, consider the following entries:


    ```

    *starcastle.com NOBROADCAST

    *.wavy.hair.net NOBROADCAST

    jackson.wavy.hair.net

    !public.wavy.hair.net

    x.login.hair.net

    ```


    The preceding lines will allow direct queries from all systems that are in the
    starcastle.com domain and match the wavy.hair.net domain, won''t allow broadcast
    queries from these systems. The systems jackson.wavy.hair.net and public.wavy.hair.net
    will be denied access altogether, and xdm will respond favorably to both broadcast
    and direct queries from x.login.hair.net.


    For details on querying xdm sessions directly across the network from one host
    to another, please see Chapter 15. For details on configuring the chooser in the
    xaccess file, which I don''t cover in this text, please see the xdm manual page.'
  merge: -1
