  md: '# Chapter 14 Display Managers


    If the server starts and seems to function, you can exit with the Ctrl+Alt+Backspace
    keystroke (provided you have not disabled it in XF86Config) and continue with
    xdm.


    # On the Command Line


    The easiest way to start xdm is from a console command line. After taking care
    to ensure that no X servers are running on the local machine, simply issue the
    following command:


    ```

    xdm

    ```


    After doing so, you should be presented with the xlogin widget, which displays
    a login and password prompt, or other text as per your configuration (refer to
    Figure 14.1). You and other users of the system should be able to start an X session
    by logging in with username and password.


    When the session finishes (usually when the window manager or environment is exited),
    the display returns to the xlogin widget, waiting for another user to authenticate
    him or herself, at which time another X session will be started.


    # From init


    After you''ve established a working xdm configuration, it is often desirable to
    cause xdm to launch when the system boots, avoiding text-based logins altogether.
    This can be accomplished by editing your systemwide init configuration.


    The easiest, but least correct way to do this is to add a call to xdm to the end
    of your rc.local script, though it can also be found in /etc in some distributions.
    One such addition might look like this:


    ```

    [ -x /usr/X11R/bin/xdm ];

    /usr/X11R/bin/xdm

    ```


    The more correct way to start xdm at boot time is to dedicate a runlevel to a
    graphical login boot, and to set that runlevel as default. Any running Linux system
    has a current runlevel, which dictates what sort of functionality will be available
    to the system and users. In most current Linux distributions, an xdm runlevel
    has already been created for you; runlevel 5 is normally configured for booting
    straight to xdm. In such cases, the only change that must be made to the /etc/initab
    file is to change the default runlevel line (normally the first non-comment line)
    to:


    ```

    5:initdefault:

    ```'
  merge: -1
  pgno: 329
- img_proc: true
  md: 'If you''re not sure whether your Linux distribution has been configured in
    advance for an xdm runlevel, browse the file. Sometimes, you''ll see something
    like this in the comments right at the beginning:


    ```

    # Currently configured runlevels:

    #

    # 0 halt

    # 1 Single user mode

    # 2 Multiserver, minimal network

    # 3 Multiserver, full network

    # 4 unused

    # 5 X11

    # 6 reboot

    ```


    If a series of comments like this one exists, you should be able to easily see
    which runlevel has been reconfigured to launch xdm at boot time. If no comments
    like these, check the file for a line that calls xdm at a specific runlevel, like
    this one:


    ```

    x:4:respawn;/usr/X11/bin/xdm

    ```


    This indicates that setting a default runlevel of 4 will cause xdm to be started
    when Linux starts. A complete discussion of the /etc/initab file and the init
    routine is beyond the scope of this text; if you need further help, please consult
    the manual pages for init and initab and edit your /etc/initab file accordingly.


    # Troubleshooting


    If xdm refuses to start at all, check to make sure you are attempting to run it
    with root privileges. Also check all the xdm configuration files to ensure that
    they are present and wellformed.


    The common problem when dealing with xdm is a faulty X configuration, which leads
    to a flashing effect as the server restarts over and over again, leaving the console
    inaccessible and the system, for all intents and purposes, unavailable. This problem
    is common and can be exacerbated by an init configuration that starts xdm at boot
    time, meaning that the system boots straight into this unstable state.


    In such cases, the fix is generally to repeatedly press the Ctrl+Alt+Del key sequence
    until the system reboots. The fix, as the system starts again, hold down the Shift
    key to get the following prompt:


    LILO boot:'
