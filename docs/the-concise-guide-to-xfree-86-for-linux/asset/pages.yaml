    # Getting Fonts Across the Network


    After you are able to connect clients and servers across the network, it is also
    helpful to be able to use fonts on a remote machine using the local X server.
    A sharing feat is accomplished by running an X server on the remote system and
    adding a reference to this remote system in your local X server''s font path using
    xset.


    # Installing and Running a Font Server


    The X font, .xfs, is quite simple to configure and use. Before the server can
    be started, a configuration file must be created to specify the location of the
    fonts to the font server and to specify a number of operational options.


    # The Font Server Config File


    The default path to the font server configuration file is lib/X11/fs/config off
    the /usr/X11R6 directory tree. The font server config file as supplied by XFree86
    is quite sane and should be adequate for most purposes. Most users will not need
    to edit the file at all; a few who have installed fonts might want to edit the
    comma-separated list of font directories supplied to the catalogue keyword in
    the file.


    A partial list of the other keywords that can appear in the file and the meanings
    associated with each is shown in Table 15.2.


    | Table 15.2 Keywords in the Font Server Config File |

    | Keyword | Description |

    | catalogue = path, path, ... | Specifies a list of directories in which fonts
    are to be found. XFree86 fonts are normally installed in /usr/X11R6/lib/X11/fonts.
    |

    | client-limit = n | The number of clients, n, this server will accept before
    denying new connections. |'
