  md: '# The VESA VGA Framebuffer 423


    | Chipset | Variable | Platform(s) |

    |---|---|--|

    | Acorn VIDC video | CONFIG_FB_ACORN | Acorn |

    | Apollo (native) | CONFIG_FB_APOLLO | Apollo |

    | Q40 (native) | CONFIG_FB_Q40 | Q40 |


    # # The VESA VGA Framebuffer


    The VESA VGA framebuffer is a special case because it will work with many different
    video cards and chipsets using the card''s video BIOS during boot to select the
    chosen video mode.


    Most recent video cards that support the VESA 2.0 standard, including currently
    unsupported or until-recently-unsupported PCI and AGP video cards will work well
    with the VESA framebuffer driver and the XFree86 framebuffer server. Understand,
    however, that it is generally preferable to use either an accelerated chipset-specific
    X server or an accelerated framebuffer over the VESA framebuffer, because the
    feature set of the VESA framebuffer is somewhat limited.


    The VESA VGA framebuffer is compiled in setting the CONFIG_FB_VESA variable at
    compile time.


    # # Arguments Accepted by the VESA VGA Framebuffer


    Many arguments can be supplied to the VESA VGA framebuffer at boot time by adding
    a line similar to this to the Linux command line:


    ```

    video=vesa:arg,arg,arg

    ```


    The easiest way to append arguments to the Linux command line is at the LILO boot
    prompt that most users see each time they boot their Linux computer.


    # yppan and ywrap


    The ypan and ywrap enable hardware-based scrolling using video memory as a scrollback
    buffer. This method of scrolling is faster than the default method but won''t
    work with all cards and can create undesirable artifacts at times.


    The wrap variable differs from ypan in that ywrap is faster because it uses video
    memory as a circular (rather than linear) buffer for video scrollback.


    When enabled, video scrollback is achieved using the Shift+PageUp key combination.'
  merge: -1
  pgno: 438
- img_proc: true
  md: '# 424 Appendix C Supported Linux 2.2 Buffers


    # redraw


    This is the default method for redrawing (scrolling) the display that works by
    redrawing the affected part of the display each time scrolling occurs. This method
    isn''t as fast as wrap and won''t allow for scrollback, but it is safer than either
    of the other two options.


    This behavior is the default scroll method for the VESA VGA framebuffer console.


    # vgapal and pmipal


    vgapal and pmipal use the VESA console either to use the standard VGA palette
    registers for color palette changes (in the case of vapal) or to use the faster
    protected-mode interface for palette changes (in the case of pmipal).


    The default behavior is to use the standard VGA palette registers for changes
    to the color buffer.


    # mtr


    mtr enables the use of memory type range registers for faster framebuffer memory
    access on mtr-enabled CPUs. Note that you must have a CPU that supports an mtr
    and have enabled mtr elsewhere in the kernel for this function to function properly.


    Only the Pentium II and later processors have supported mtr registers in current
    Linux kernels. The 2.3.x development kernels (or the 2.2 Alan Cox series kernels)
    implement mtr for non-Intel CPUs with related capabilities, such as the AMD K6-2
    and K-3 series of CPUs.


    # Framebuffer Code and Documentation


    For more information on using specific framebuffer hardware with the Linux 2.2
    kernels, please visit one of the kernel source tree subdirectories in Table C.3.


    | Table C.3 | Directories of Interest to Framebuffer Buffers |

    | --- | --- |

    | Directory | Description |

    | Documentation/ | General Linux 2.2.x kernel documentation in plain-text format
    |

    | Documentation/fb/ | Plain-text documentation files for various types of framebuffer
    hardware when used with the Linux 2.2.x kernel |

    | drivers/video/ | C source and header files for the various framebuffer devices
    supported by the Linux 2.2 kernel |'
