  md: '# Sample $HOME/.twmrc Without Icons 365


    Function "move-or-raiser" { f.move f.deltastop f.raiser}

    Function "move-or-maximize" { f.move f.deltastop f.fullzoom}

    Function "move-or-identify" { f.move f.deltastop f.identify}

    # Bind root-window clicks. Left-click displays the main menu,

    # middle-click displays window operations menu, right-click

    # displays an applications menu. Menus are defined after bindings

    # are complete.


    ```

    Button1 = root : f.menu "main-menu"

    Button2 = root : f.menu "window-ops"

    Button3 = root : f.menu "applications"

    ```


    # Bind .title clicks. When any button is used to drag the

    # title bar, the window is moved. When the left button is

    # clicked, the window will be raised, or if it is already

    # raised, it will be lowered. When the middle button clicked,

    # the window is maximized or unmaximized. When the right button

    # is clicked, the window will be identified.


    ```

    Button1 = title : f.function "move-or-raiserlow"

    Button2 = title : f.function "move-or-maximize"

    Button3 = title : f.function "move-or-identify"

    ```


    # Bind icon manager clicks. Left-click minimizes or restores a

    # window. Middle-click deletes the indicated window, and right-

    # click destroys the indicated window.


    ```

    Button1 = iconmgr : f.iconify

    Button2 = iconmgr : f.delete

    Button3 = iconmgr : f.destroy

    ```


    # Now, we bind all of the functions in the window operations

    # menu plus one or two more to the shifted function keys.


    ```

    "F1" = shift : all : f.iconify

    "F2" = shift : all : f.resize

    "F3" = shift : all : f.move

    "F4" = shift : all : f.raise

    "F5" = shift : all : f.lower

    "F6" = shift : all : f.delete

    "F7" = shift : all : f.destroy

    "F8" = shift : all : f.refresh

    ```'
