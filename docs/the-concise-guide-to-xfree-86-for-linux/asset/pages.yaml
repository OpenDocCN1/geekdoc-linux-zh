- img_proc: true
  md: '# Chapter 9 Runtime Environment Configuration


    Most window managers that can use multiple virtual desktops or large virtual desktop
    areas are known as virtual window managers, though this terminology is becoming
    less well-known as time goes by and the feature becomes more and ubiquitous. The
    pager used by these window managers is usually represented as a small panel that
    appears on all active desktops and is split into several sections, each of which
    represents one virtual area. Using this pager, the user can drag windows back
    and forth between desktop areas and can switch to the desired desktop area simply
    by clicking its representation in the pager.


    # The Icon or Application Manager


    The final element common to the three window managers we''ll cover here is the
    presence of some form of icon or application manager that enables the user to
    minimize and restore windows or obtain a listing of the X clients currently running
    in some graphical way. The icon or application manager sometimes provides a mechanism
    for giving a window focus by clicking on the window''s entry in the manager.


    In some cases, this functionality exists as an icon manager or icon box of some
    sort, a place where an icon or minimized representation of a window will always
    appear when the window is minimized. Clicking one of the icons in the icon box
    or icon manager results in the window becoming un-minimized and reappearing on
    the desktop, often on top of all other windows, with focus.


    In other configurations, this functionality is provided via a window list that
    looks rather like a menu, but is updated dynamically to reflect the list of currently
    active X clients. Selecting any of the windows in the menu causes that window
    to come to the forefront of the desktop and to take focus.


    Some window managers provide both types of functionality, either alone or simultaneously,
    providing a powerful method for desktop window management.


    # Bitmaps and Pixmaps


    Before we begin discussing window managers on a program-by-program basis, it is
    important to mention two image formats native to the X window system with which
    not all users be familiar.


    When X was developed, only a tiny subset of the graphics formats available today
    existed, and many of them were protected by closely held copyrights and patents.
    X programmers therefore have developed two image formats that are native to the
    X Window System: bitmaps and pixmaps.'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# X Bitmaps


    X bitmap files, which end with the .xbm extension, are two-color (black-and-white)
    images that are stored in a plain-text format which C programmers will be able
    to decode instantly. The format is simple: A matrix is defined by specifying a
    height and width for the image. A series of bits are then specified representing
    either an on pixel or an off pixel, respectively.


    # X Pixymaps


    X pixmap files, which end with the .xpm extension, are colorized images that are
    stored in a similar plain-text format readable by C programmers. In X pixmap files,
    however, the pixels are specified with color values rather than simple on and
    off values.


    # Icons and Window Managers


    Many X window managers enable the user to either X bitmaps or X pixymaps or both
    to decorate various icons of window managers'' runtime, window decorations or
    title bar buttons with which the user can work. Unfortunately, X does not natively
    include a large set of icons with which the user can work. Some newer window managers
    such as Window Maker can use newer image formats more commonly in icon collections
    on the Web, but many (including fwm, fwm2, and twin) don''t understand any formats
    but .xbm and .xpm.


    It therefore often necessary to convert icons from other bitmap or image formats
    to the .xbm and .xpm formats. Several common tools exist that can make these conversions
    for you; the most common are xv and ImageMagick, both of which are often included
    with Linux distributions. The convert tool from ImageMagick is especially easy
    to use; all the following statements are valid and produce exactly the expected:


    ```

    convert myfile.jpg myicon.xpm

    convert myimage.gif myimage.xpm

    convert mybitmap.mac mybitmap.xbm

    ```


    The tool runs noninteractively and is thus well suited to script or shell-based
    use such as when converting entire directories of icons using loops. The ImageMagick
    tools can be found at


    ```

    http://www.wizards.dupont.com/cristy/ImageMagick.html

    ```


    Other tools also exist for converting graphic images—even high-end tools such
    as GIMP can be used for this purpose—but few are as convenient as ImageMagick.'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# Chapter 9 Runtime Environment Configuration


    # The fwwm Window Manager


    The fwwm family of window managers is one of the oldest and most mature available
    to Linux users. Although not included with XFree86 or the X Window System, fwwm
    is traditionally the stock window manager on most Linux distributions, though
    recent distributions have finally begun to move to KDE or GNOME desktops for their
    default installation.


    Several other window managers have been created for use or to hacks of the fwwm
    window managers and share, for the most part, the configuration format of fwwm
    dotfiles. The fwwm window managers are best split into two families, the fwwm
    1.x managers—which use the configuration file format used by all llvm version
    1 releases (see Figure 9.1)—and the fwwm 2.x managers—which use the configuration
    file format that is used by all version 2 releases and that is significantly different
    from the 1.x configuration file format (see Figure 9.2).


    ![](img/edb2a4591eafaad74c22be9075f4b815_215_0.png)


    Figure 9.1 The fwwm window manager.'
  merge: -1
