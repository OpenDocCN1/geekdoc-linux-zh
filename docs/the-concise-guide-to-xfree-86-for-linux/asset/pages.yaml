  md: '# # 4


    # ## STANDARD XFREE86

    PROGRAMS AND UTILITIES


    # # The Command Line in X


    Aside from the server, which has occupied most of the text until now, several
    other important standard programs and utilities are included with XFree86. Many
    of them are essential aspects of a working Linux+X desktop.


    The fundamental user interface in any UNIX or UNIX-like operating systems is the
    command line. No matter how dressed up a UNIX system becomes thanks the addition
    of X or aftermarket add-ons, it''s not yet possible to use UNIX-like systems to
    their fullest without access to a shell. Many X utilities must be launched from
    the command line, and many X configuration changes can be made only with shell
    commands.


    But the concept of a keyboard and command-based user interface would seem to be
    at odds with the concept of a graphical user interface. The command line harkens
    back to the days of the dumb terminal device, which displayed text only as purely
    a forum for shell and text-based application interaction. How did the designers
    of X merge the graphical desktop with the text-based, command-driven dumb terminal?


    # # Terminal in a Window


    Perhaps the most important utility is xterm, the X terminal emulator, an X utility
    that creates a window that acts like a few specific dumb terminal makes and models
    to UNIX applications. The default XFree86 desktop'
  merge: -1
  pgno: 112
- img_proc: true
  md: '# Chapter 4 Standard XFree8 Programs and Utilities


    starts three instances of the xterm program, two labeled as such, and one labeled
    login. All three of these windows look very much like dumb terminals to the shell
    and text-based applications inside them.


    You might have noticed that these three windows on the default desktop are endowed
    with a shell prompt, and that they accept any of the UNIX commands to which most
    users are accustomed. Nearly any command that can be run from a text console in
    Linux can also be run from an xterm window and will behave similarly. This includes
    text-based applications such as pine or vi, as well as output pagers such as more.
    Using xterm is rather like using the traditional dumb terminal, with one important
    difference: as the desktop shows, multiple xterm windows can appear all at once
    on the same display, effectively multiplying your access to the shell.


    There is one other important difference between the way in which xterm behaves
    and the way in which a text console displays. In truth, the difference isn''t
    really a phenomenon, but an effect of the presence of the X desktop itself. The
    xterm window can also be used to launch other X applications or utilities. When
    they are started, X binaries will not display in the xterm window, but will (naturally)
    create a new window of their own in which display. For example, you can open a
    new xterm window by typing the following command in an existing xterm window:


    ```

    xterm

    ```


    Depending on the window manager in use, a window might simply appear on its own
    or a rubber band outline of the window might appear for to place. You place a
    window simply by moving the outline to the location where you''d like the window
    to appear and then clicking any mouse button. You will find that the new xterm
    window behaves and acts just like any of the others, and just like a dumb terminal.


    Several replacements for xterm have been written and released over the years.
    Some of them are parts of other applications or desktops, like the kvt and konsole
    of KDE desktop and the cmtool and shell applications from Sun''s OpenWindows.
    All of them function or less similarly to xterm that they provide a means by which
    users can interact with the shell inside an X Session. In spite of the successes
    of some of the xterm replacements, xterm itself remains the most widely used X
    terminal emulator to date.


    # Job Management


    Most experienced UNIX shell users are familiar with the normal job management
    commands in UNIX. For those who need a refresher, Tables 4.1 and 4.2 provide a
    brief synopsis.'
