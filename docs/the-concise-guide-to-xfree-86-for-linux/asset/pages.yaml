    # Client Icon and Window Management


    In addition to supplying a mechanism for the user to move about inside virtual
    desktop space, fwwm also provides the user with mechanisms to manage a list of
    running X clients. A list of active windows is maintained from which windows can
    be selected for display or through which the user can cycle. fwwm also provides
    the capability to minimize a window, removing it from view and replacing it with
    an icon that represents it. An icon can then be restored later to make a window
    visible.


    In many fwwm configurations, the default behavior is to display a window list
    when the user middle-clicks on the root window, minimize a window when the user
    clicks on a button at the upper-right of the window, and to restore a window when
    the user clicks on a minimized icon. This behavior can be changed, however, by
    binding functions such as Iconify and Window to list mouse clicks or keystrokes,
    a process covered in the “fwwm 1 Mouse and Keyboard Bindings” section, later in
    this chapter.


    Keywords that control icon behavior and window list behavior are shown in Tables
    9.5 and 9.6. Note that many of the keywords have to do with window circulation,
    a task performed by several built-in functions that occur in a moment.


    | Table 9.5 Keywords Related to Icons and Minimization |

    | Keyword | Description |

    | Icon window image | Uses the file image as the icon in any minimized representation
    of window. The image file is loaded from one of the image paths, IconPath or PixmapPath,
    described later in this table. The window is specified using an application name
    or a window title that can contain wildcard characters |'
