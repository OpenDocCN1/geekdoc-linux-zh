  md: '![](img/edb2a4591eafaad74c22be9075f4b815_101_0.png)


    Figure 3.4 Two applications, login and xclock, on the XFree86 desktop.


    Most applications will appear in the same way the xterm windows do—with a single,
    large, rectangular work area that is capable of accepting both keyboard input
    and mouse input in some way. Windows that aren''t interactive in this way don''t
    normally accept focus because there is no way to interact with them anyway.


    Similarly, not all application windows must be decorated by the window manager.
    Indeed, it is sometimes desirable to leave application windows undecated, and
    many window managers offer the capability to specify a set of windows that is
    to be left undecated, most commonly without a title bar or resize and minimize
    buttons. Some window managers also allow for decoration styles that can be applied
    to entire classes of applications.


    The most common class of undecor windows are known as transient windows, which
    are windows designed only to appear for a moment in order to interact with the
    user by accepting input or providing some sort of message. Common transient windows
    include some forms of drop-down menus, untitled dialog boxes asking for some sort
    of decision on the part of the user, and help windows. When an application is
    displaying a transient, the application''s main window will usually become inactive
    until the transient has been dismissed or dealt with. Note that although transients
    are generally undecated, some window managers can be told to decorate them anyway,
    and they will do so happily.'
