    Knowing how to properly refer to X across the network is only half the battle;
    the other half is supplying such a reference to a client.


    # The DISPLAY Environment Variable


    The primary method for specifying which display clients should use is through
    the DISPLAY environment variable, which holds the address to the default display
    to which clients connect. For example, consider the following shell session fragment,
    issued in an xterm on a machine called foobar:


    ```

    ahsiao@foobar echo $DISPLAY

    :0.0

    ```


    The contents of the DISPLAY variable on this system show that the default display
    to which clients will connect if no other host is specified is the first screen
    on the first display of the local machine. Most Linux/x86 users working in X on
    the local machine will find that their environment variable contains the same
    thing.


    Assume for a moment that one unsecured system called poked is on the local area
    network, and that active X server is running on pokey''s only display. From the
    xterm window, I issue the following commands:


    ```

    ahsiao@foobar export DISPLAY=pokey:0.0

    ahiao@foobar xclock -geometry 1024x768+0+0 &

    [1] 26414

    ahiao@foobar$

    ```


    The xclock doesn''t appear on foobar''s display, but it has clearly started—a
    process ID has been assigned and returned. Where did it go? A quick check on pokey''s
    display reveals the answer: a xclock now appears on pokey, though the clock program
    is actually running on foobar. The default display for any clients started from
    this xterm window is now pokey''s, instead of the foobar''s display, even though
    the xterm is on foobar''s display.'
  merge: -1
  pgno: 344
- img_proc: true
  md: '# Chapter 15 Working on the Network


    It is important to keep shell environment scope in mind when dealing with the
    DISPLAY variable. Remember that setting the DISPLAY variable from the command
    line will affect the variable only in the shell from which the assignment was
    issued. This means if I start a second xterm on foobar clicking an icon or selecting
    an item from a root menu, the DISPLAY variable in the new xterm will contain :0.0
    and any clients started there will thus appear on foobar''s display.


    # -display Argument


    Because working with environment variables for something so fundamental is a little
    bit clumsy, most applications also support the -display command-line argument.
    Although originally an X toolkit (Xt) argument, most application toolkits have
    adopted it because of its utility.


    To explicitly specify a display somewhere on the network when starting an X client,
    the -display argument followed by the display on which the client should appear
    and interact:


    ```

    xterm -display x44.bibber.edu:

    xcalc -display monkeyhost:1.1

    netscape -display server.fargus.copale.com:1

    ```


    For the rare application that does not accept the -display argument, the DISPLAY
    environment variable should be used instead.


    # Controlling Access, Authenticating Connections


    After the examples you''ve seen so far in this chapter, it should be obvious that
    it''s important to have a mechanism to control access to a running X server—otherwise,
    the network capabilities of X would create more problems than they solve.


    To control access, an X server can be instructed to require authentication of
    any incoming connections before the connection will be accepted. This authentication
    can take two separate forms: host-based authentication or token-based authentication.


    # Host-Based Authentication


    The most basic way for controlling access to an X server is based on a list of
    host names kept internally by the server. Hosts that are on the list are allowed
    to connect. Hosts that aren''t on the list allowed to connect. If no other mechanism
    for controlling access to the server is in place, the list contains one host:
    the host on which the server is running.'
  merge: -1
  pgno: 345
- img_proc: true
  md: '# # /etc/Xn.hosts File


    The primary method for editing the list of permitted hosts is to add hosts to
    or remove hosts from the /etc/Xn.hosts file, where n is the number of the display
    on the local host to which the file will apply. The file should contain simply
    a list of allowed hosts, one per line:


    ```

    client32.multiply.net

    client33.multiply.net

    pokey

    foobar

    thejameshost

    ```


    When the X server is started, the /etc/Xn.hosts file will be read, and the list
    will be built using its contents. Changing the contents of the file after the
    X server has started will not change the X server''s internal list—the X server
    must be restarted if an edited file needs to take effect.


    # # xhost Command


    To edit the list after the X server (obviously) is running, the xhost command
    can be used. The xhost command must be from one that already has permission to
    access the server, and is used in one of two ways:


    ```

    xhost +host.to.add

    xhost -host.to.remove

    ```


    The first of the two calls to xhost adds the host to the list hosts that can connect
    to the server. The second of the two calls to xhost removes the host from the
    list. An additional, kamikaze method for editing the list is to call xhost like
    this:


    ```

    xhost +

    ```


    When the plus sign is used as an argument alone, without presenting a host name,
    the X server is rendered completely insecure: Connections are allowed from any
    host, anywhere. Needless to say, there are few situations in which such a command
    would ever make sense. To reverse the decision to disable access control, issue
    the inverse command:


    ```

    xhost -

    ```


    To display the current host access list, call the xhost command without arguments:


    ```

    $ xhost

    INET:client32.multiply.net

    INET:client33.multiply.net

    pokey

    INET:foobar

    LOCAL:

    ```'
  merge: -1
