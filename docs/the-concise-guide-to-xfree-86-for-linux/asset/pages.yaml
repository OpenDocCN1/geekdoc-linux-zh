  md: '# Chapter 2 Installing and Configuring XFree86


    This has traditionally been one of the stickiest areas of the XFree86Config file
    because it is here where the XFree86 display modes are defined. Display modes
    are a series of numbers that specify the resolution and refresh rate at which
    a monitor can display.


    Before we get into display modes, let''s first go over the other options that
    can be configured in the Monitor section. These options are shown in Table 2.17.


    # Table 2.17 Valid Monitor Section Options


    | Option | Parameters | Description |

    | --- | --- | --- |

    | Identifier | text | This is the string by which this monitor will be identified
    throughout the rest of the XFree86Config file. This text can be anything you like,
    but it must be reproduced exactly in the Screen of the file you are referring
    to this monitor. |

    | VendorName | text | The name of the vendor that assembled or sold this monitor.
    This text is for your benefit only and can be anything you like. |

    | ModelName | | The name of the particular model of this monitor. This text is
    for your benefit only and can be anything you like. |

    | HorizSync | num-num | The horizontal sync range supported by this monitor. For
    example, a typical 1280-1024 60Hz monitor kilohertz range of 31.5-64.3 should
    be provided in this format as a parameter to HorizSync |

    | VertRefresh | num-num | The vertical refresh rate supported by this monitor.
    For example, the sample monitor earlier might have a vertical refresh rate range
    of 60-72Hz that should be provided in this format as a parameter to VertRefresh
    |

    | Gamma | num or n n n | Either a single number or a composite set of three numbers
    (one for Red, Green, and Blue) representing the gamma adjustment for the monitor
    in question. Not all X servers support this adjustment.


    Now that we''ve covered the other options, it''s time to discuss video modes.
    In many other operating systems, Windows included, several predefined modes are
    available for everyone, and any other modes aren''t supported at all. These predefined
    modes are 640x480, 800x600, 1024x768, 1280x1024, 1600x1200, usually at either
    60Hz or 72Hz refresh rates.


    Actually getting the hardware to display at a specific resolution and refresh
    rate involves quite a bit of black magic because monitors by nature display information
    with a swinging electron gun, one line at a time. Traditionally, XFree86 has left
    such trickery up to the user, providing an interface by which the user can specify
    or her own display modes. This interface is through the Mode subsection in the
    Monitor section of the XFree86Config file.'
  merge: -1
  pgno: 79
- img_proc: true
  md: 'Luckely this older build-your-own mode philosophy, which leaves nearly everyone
    confused, has been mitigated to some degree by XFree86''s recent decision to include
    a standard set of modes, which means that the construction of display modes now
    falls outside the scope of this text. Still, the basic format for specifying modes
    bears repeating. The Mode subsection follows this basic format:


    ```

    Mode "modname"

    Dotclock clock

    HTimings display start end total

    VTimtings display start end total

    Flags "flag" "flag" ""

    HHSync skewval

    EndMode

    ```


    The dotclock value is the video card clock rate, in megahertz, for this mode.
    Note that cards with fixed clocks values will have a limited number of dot clocks
    available. The display, start, end, and total values for the HTimings and VTimtings
    options indicate the displayed number of pixels, scan start, end, and total length
    values for each scan line, respectively. One Mode subsection in the section for
    each display mode that will be available to the user of this monitor. Valid flags
    given to the option in the Mode subsection are shown in Table 2.18.


    | Table 2.18 Valid Flags in the Mode Subsection |

    | Flag | Description |

    | --- | --- |

    | Interlace | Indicates that this mode is interlaced. |

    | DoubleScan | Indicates a mode where each scan line is doubled. |

    | +HSync | Selects a positive horizontal sync. |

    | -HSync | Selects a negative horizontal sync polarity. |

    | +VSync | Selects a positive vertical sync polarity. |

    | -VSync | Selects a negative vertical sync polarity. |

    | Composite | Sends horizontal and vertical sync together as composite sync. This
    option isn''t supported on all video hardware. |

    | +CSync | Selects a positive composite sync polarity. |

    | -CSync | Selects a negative composite sync polarity. |


    An abbreviated form of the Mode subsection is the mode line, which follows this
    format and is simply inserted as an option into the Monitor section:


    ```

    ModeLine "name" clk hdst hst vdot vhst vend flags

    ```


    There must be at least one valid ModeLine option or one Mode subsection within
    the Monitor section for XFree86 to be able to display on a monitor.'
  merge: -1
