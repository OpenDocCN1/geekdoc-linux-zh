- img_proc: true
  md: '# The fwm Window Manager 201


    ![](img/edb2a4591eafaad74c22be9075f4b815_216_0.png)


    Figure 9.2 The fwm 2 window manager.


    In general, the fwm managers can be started by calling either the fwm (for fwm
    version 1) or fwm2 (for fwm version 2) binaries at the end of your $HOME/.xinitrc
    file in place of any other window manager (such as twm) or desktop manager (such
    as gnome-session).


    # fwm Configuration File Basics


    Regardless of the version fwm you''re using, all configuration information for
    fwm is typically provided in a single dotfile, located at $HOME/.fwmrc in the
    case of fwm 1.x or $HOME/.fwm2rc in the case of fwm 2.x. If the file isn''t found
    in the user''s home directory, the files fwm/system.fwmrc or fwm2/system.fwm2rc
    of the /usr/X11R/lib/X11 directory will be used.


    The fwm configuration files are largely unstructured and order-unimportant (though
    there are one or two exceptions to this rule) are usually simple lists of internal
    fwm keywords or functions. Many of the keywords in the file act as flags—that
    is, when they are present, they alter some aspect of fwm behavior. To remove the
    behavior, simply remove the keyword. The rest of the keywords or functions in
    the file are generally followed by one or more values that can be altered to alter
    some behavior of fwm.'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# 202 Chapter 9 Runtime Environment Configuration


    Convention dictates that file paths, appearances, and decoration and button configuration-words
    go at the top of the file, root menu configuration comes next, followed by module
    configuration on a per-module basis, and finally, keyboard and mouse bindings
    at the end of the configuration file. Comments in the fwwm configuration file
    are indicated by lines that begin with the hash mark (# and are ignored by fwwm.
    There is no hard limit to the length of the configuration file, and when a single
    keyword or function is specified multiple times with a different value time, only
    the last occurrence of the keyword or function in the file will be read.


    Learning about dotfile configuration can be a confusing process, especially when
    configuring window managers. It might therefore be helpful to refer to Appendix
    A,"Sample Window Manager Configurations," and to follow all the samples as you
    read.


    # fwwm 1 Appearance Configuration


    Several configuration keywords are related to window decorations, colors, and
    fonts in the fwwm 1.x series window managers. These are the most commonly modified
    configuration-words in the fwwm configuration file. Appearance and decoration-oriented
    options are shown in Table 9.2.


    Note that several additional appearance-related keywords aren''t listed here.
    In large part, they are superseded by window styles and the .style keyword, which
    is discussed in “fwwm 1 Button and Window Styles," several sections ahead.


    | Table 9.2 Common Appearance Configuration in fwwm 1.x |

    | Keyword | Description |

    | DecorateTransient | If, instructs fwwm to decorate pop-up dialog windows as
    they were normal windows, with a title, border, and buttons. |

    | Font XLFD | Uses the font referred to as XLFD for titles and entries in the
    root menu. |

    | HiBackColor color | Uses the supplied color as the decoration color for highlighted
    (focused) windows. The color should be either a name from the X color database
    or an RGB colorspace specification. |

    | HiForeColor color | Uses the supplied color as the window title color for highlighted
    (focused) windows. |

    | MenuBackColor color | Uses the supplied color as the background color for selected
    fwwm menu entries in menus such as the root menu. |

    | MenuForeColor color | Uses the supplied color as the text color for Fselected
    Wwm menu entries. |

    | MWMBorders | Uses the Motif-style border decorations rather than the deeper
    fwwm-style decorations. |'
  merge: -1
