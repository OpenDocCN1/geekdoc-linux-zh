    # # The Screen Section


    The Screen section is generally the final section in the xF86config file. The
    purpose of the Screen section is to establish a number of defaults, including
    the monitor and video cards specified that should be used, the color depths available,
    the resolutions for each color depth, and the virtual desktop size. A well-formed
    Screen section should be structured as:


    +   * ''Screen''

    * Driver ''type''

    * Device ''card identifier''

    * Monitor ''monitor identifier''

    * DefaultColorDepth bpp

    * Subsection ''Display''

    * Depth bpp

    * Modes "modename" "modename" ..."

    * EndSubsection

    * Subsection ''Display''

    * Depth bpp'
