  md: '# 10


    # INTEGRATED

    ENVIRONMENT VERSUS

    WINDOW MANAGER


    Part IV of this book, "Integrated Linux Environments," is designed to familiarize
    users of KDE and GNOME with those environments. It is intended primarily for those
    who received KDE or GNOME with their Linux distribution and have been using the
    environment already. Although not a part of the XFree86 distribution in the strictest
    sense, it would be a mistake to assume that a discussion of graphical Linux could
    take place at this point without some coverage of these integrated environments
    and a discussion of how these environments relate to traditional window managers
    and the more traditional X desktop.


    # Window Managers


    In the last chapter, we discussed the three most commonly installed window managers
    for Linux and XFree86 and alluded to the fact that many are out there. In fact,
    many window managers are available than we were able to discuss. The following
    (listed in alphabetical order) are some of:


    +   - AfterStep—A window manager designed to make a Linux+XFree86 desktop look
    more like a NeXTStep desktop running on NeXT hardvare while preserving some UNIX
    sensibilities.


    +   - Enlightenment (E)—A window manager designed to allow for the maximum amount
    of appearance configurability.'
  merge: -1
  pgno: 262
- img_proc: true
  md: '+   IceWM—A window manager designed to allow Linux+XFree86 desktops to emulate
    other environments, including the OS/2 Workplace shell or Windows environments.


    +   Window Maker—A window manager designed not only to make a Linux+XFree86 desktop
    look more like a NeXTStep, but to make a Linux desktop behave and think more like
    a NeXTStep as well.


    +   wm2/wmx—A pair of window managers designed to look even more minimal than
    twm and to provide only the very basic amount of window management functionality
    needed by the power user.


    In addition to these few, many other window managers for Linux and UNIX systems
    are found around the Web as, some more configurable than others, each different
    in behavior and appearance. When it comes to window managers, it''s a buyer''s
    market: There''s more flexibility, configurability, and variety out there most
    users will ever know what to do with.


    There are also many powerful programming APIs for developing X applications, some
    of which were discussed briefly in Chapter 5, "Linux/X Toolkit Particulars." Many
    applications have been written using these APIs. In Linux, an applications programmer
    has a wide variety of tools and toolkit to choose from, allowing each programmer
    to be completely comfortable with the code that he she writes and the API for
    which it was written.


    This kind of flexibility is unique to Linux and UNIX systems; it doesn''t exist
    in other commodity operating systems commonly used by end users or by businesses.


    # Problems with the X Window System and Window Managers


    Most users are aware of the development of both the KDE (K Desktop Environment)
    and GNOME (GNU Network Object Model) over the last couple of years, and are vaguely
    aware that these environments are beginning to replace window managers like fwm
    or twm on distribution-installed Linux desktops. If such variety and power were
    already available in window managers that existed before KDE and GNOME, why development
    of these two environments occur, and why are so many users and distributions beginning
    to use them?


    The answer has to the structure of X itself. The X Window System has implemented
    a "mechanism, not policy" philosophy, meaning that X wanted to provide only a
    means for displaying graphics primitives and dictating their behavior across a
    network—nothing more. All further activity, from drawing the widgets to building
    the applications, was to be the responsibility of the X user or programmer. X
    doesn''t even implement window or user-client management; this is done by an external
    window manager such as tw.'
  merge: -1
  pgno: 263
- img_proc: true
  md: '# Problems with the X Window System and Window Managers 249


    The separation between the underlying graphics system, the applications, and application
    management has led to the large variety of available window managers and APIs.
    Unfortunately, there is also a downside to this kind of flexibility and configurability.
    When 10 different applications use 10 different APIs and 10 different sets of
    widgets and keyboard/mouse bindings, a desktop quickly becomes confusing or unusable.
    With the many window managers for X have come many different configuration files
    and many different ways to interact with the desktop. When moving from one Linux
    to to another running a different window manager, it is easy (especially for novices)
    to become completely disoriented. In short, the learning curve has been made,
    and it doesn''t diminish as new applications must be used on any regular basis.


    These problems, which can be seen on many X desktops, are often referred to as
    desktop fragmentation. The results of desktop fragmentation can be seen in Figure
    10.1. Note that each application''s widgets look different from one another, and
    that all appear different from the title bars and decorations created by the window
    manager. Note also that each of these clients, the window manager, interacts with
    the user in a different way, with different keys, mouse behavior, and widget feed.


    ![](img/edb2a4591eafaad74c22be9075f4b815_264_0.png)


    Figure 10.1 Desktop fragmentation, in which many applications have different appearances
    and behaviors, is common in X.'
  merge: -1
  pgno: 264
- img_proc: true
  md: 'Even worse, however, is the fact that each of these applications is based on
    a different API and set of programming libraries, meaning that even though Linux
    supports sharing of libraries across multiple programs to save memory, each of
    these programs is actually consuming large amounts of memory on its own because
    it loads its own library and API code different from the code of the others—in
    effect, the benefits of shared library or dynamic linking have been partially
    or completely nullified by many X desktops.


    # Integrated Environments


    KDE and GNOME. Both are more than mere window managers or application toolkits;
    they are complete integrated environments. Both KDE and GNOME include all the
    following layers:


    +   * APIs—Both KDE and GNOME build their own APIs for programmers to use in creating
    new applications. These APIs are some of the most powerful to Linux or UNIX users
    today.


    +   * ORBs—Both KDE and GNOME include some sort of object request broker. An ORB
    allows an application to use objects from a separate application, meaning better
    integration, flexibility, and compatibility for the user, as well as faster development
    for the programmer.


    +   * Applications—Both KDE and GNOME come with a base set of applications for
    general-purpose desktop use: a file manager, a calculator, a mail reader, a text
    editor, and so.


    +   * Window Management—Both KDE and GNOME include an internal window manager
    that enjoys good integration with applications using the window manager''s own
    respective API.


    +   * Configuration—Both KDE and GNOME attempt to do away with the necessity of
    editing files or the X resource database; both attempt to bring users into the
    modern age with point-and-click configurability.


    +   * Session Management—Both KDE and GNOME implement session management, the
    capability to save a user''s desktop upon logout so the next time the user logs
    in, applications and windows will be restarted and restored to their last known
    positions. X users have always been able to manage sessions with XSM, but KDE
    and GNOME provide this functionality automatically.


    None of these new capabilities or additions is particularly remarkable on its
    own. We already have numerous window managers and APIs for Linux and X.Free86
    comes with a calculator, a mail reader, a text editor, and so on. Several powerful
    file managers for X are available for download from the Internet. Several programs
    exist to automatically generate defaults or edit X resources. Many window managers
    do session management.'
  merge: -1
  pgno: 265
- img_proc: true
  md: 'Although none of these things is particularly remarkable on its own, it is
    the integration of the effort that makes both KDE and GNOME so interesting and
    desirable. In the case of KDE and GNOME, the window manager and applications in
    the environment are all built with the same API, which consistently behaves in
    the same way, regardless of which application is in use. The object request allows
    applications to use each other to accomplish tasks, eliminating reinventing-the-wheel
    syndrome and accelerating development. The session management capabilities of
    KDE and GNOME are more powerful than those of window managers because, in KDE
    and GNOME, the applications are built upon an API that was designed with session
    management in mind.


    The end result of all this detail is the fact that KDE and GNOME are integrated
    environments, in the same way that Windows, macOS, or the OS/2 Workplace shell
    are. This desktop unity, shown in Figure 10.2, is the goal of environments like
    KDE and GNOME. Users have point-and-click configurability and a consistent look-and-feel,
    and newly developed applications are guaranteed to behave and appear similar.


    ![](img/edb2a4591eafaad74c22be9075f4b815_266_0.png)


    **Figure 10.2** Desktop unity, promoted by integrated environments like KDE and
    GNOME, generally considered to be good for the user.'
  merge: -1
  pgno: 266
- img_proc: true
  md: '# Problems with Integrated Environments


    Of course, KDE and GNOME have their own problems as well. The largest and most
    widely understood of these is size. Most users expect operating systems like Windows
    and OS2 to have large memory needs for optimal performance. In truth, part of
    the reason for the Windows resource drain is the fact that Windows maintains a
    large, flexible API, an object request broker interface, session management, desktop
    configurability—all powerful ease-of-use features, and, incidentally, goals shared
    by both KDE and GNOME.


    KDE and GNOME also occupy many megabytes of hard drive space on the host system.
    Much of this extra space is the result of duplicate applications—for example,
    the KDE editor, breit uses up space on the hard drive and is really xedit''s logical
    twin. The same applies to GNOME''s balas and the XFree86 standard xwm. Having
    both on the hard drive is, in some sense, a waste of space.


    In time, these extra resource requirements will be offset by the fact that more
    and more desktop applications will switch to the KDE or GNOME APIs. For the moment,
    however, the memory and resource requirements of KDE and GNOME a full desktop
    of applications are higher than many Linux users are accustomed to.


    In addition to size and performance issues, however, are compatibility issues.
    Both KDE and GNOME have emerged more or less simultaneously as valid platforms
    for application development and as useful environments for Linux distributions.
    Unfortunately, at the moment, KDE and GNOME aren''t compatible, nor are they completely
    interoperable.


    They aren''t compatible in that application code written for KDE will not compile
    using the GNOME API and vice versa. Similarly, compiled KDE binaries must be linked
    to existing KDE libraries and GNOME binaries to GNOME libraries. When applications
    from both desktops are used simultaneously, code data from sets of libraries will
    be loaded and executed.


    KDE and GNOME are also not interoperable. The drag-and-drop and file management
    from the current KDE system will not accept desktop icons dragged from a GNOME
    application window. The object request broker interfaces are different; a KDE
    application cannot embed part of a GNOME application in its window. Even in the
    way the user interacts with the two systems is different.


    Because of these differences, many users fear that KDE and GNOME will lead to
    fragmentation in the Linux market itself, as some distributions adopt KDE as the
    default desktop and others GNOME instead, leading to the possibility that, in
    the future, some distributions will not run some applications without lengthy
    downloads or upgrades. Although these fears are valid to some degree, they aren''t
    likely to be justified in the long term. Efforts are underway to allow KDE and
    GNOME to operate efficiently, and as the number of applications written for KDE
    and GNOME increases and the use of other APIs decreases, the resource costs of
    maintaining both types of applications simultaneously will decrease.'
  merge: -1
  pgno: 267
- img_proc: true
  md: '# Environment or Manager: Which Is Right for Me?


    Most distributions currently shipping are using either KDE or GNOME as their default
    desktop, and this choice reflects the correct one for the average user. Most current
    Linux users use X at all will use it as a general-purpose work environment and
    will benefit greatly from the integration and ease-of-configuration afforded by
    KDE and GNOME.


    Window managers can be difficult to maintain, but they can also provide significant
    performance increases and resource savings. Window managers are therefore often
    the choice of power users who don''t need the extra configurability or integration
    offered by KDE and GNOME. For this reason, window managers, especially those with
    a niche of their own, such as wm2, twm, Window Maker, or Enlightenment, will continue
    to survive and maintain their popularity.


    For those with older, resource-challenged computer systems, KDE and GNOME may
    be a bad choice. On older systems lacking in memory, hard disk space, colors,
    or video acceleration, the more traditional set of X applications combined with
    a small window manager will afford the best levels of performance and usability;
    environments such as KDE and GNOME will in these cases seem seem clumsy and slow.'
  merge: -1
  pgno: 268
