- img_proc: true
  md: '# 282 Chapter 12 The GNOME 1.0 Environment


    If your mouse or pointing device doesn''t have a middle button, you will normally
    be able to emulate one by clicking both the left and right mouse buttons simultaneously.
    If simultaneous left and right clicks don''t seem to cause a middle-click event,
    you will need to edit X server''s configuration; please refer to Chapter 2, "Installing
    and Configuring XFree86."


    # Changing Themes or Installing New Themes


    Changing the active theme is a relatively simple matter in Enlightenment; the
    configuration editor has been started, select the Themes option from the list
    in the box in the upper-left of the window. A list of themes knows about will
    appear on the right-hand side of the window.


    To try a theme, select the theme you''d like to try and click the Apply button.
    If you are satisfied with the new theme, click OK and the configuration editor
    will close, leaving your new theme active and the default for the next time Enlightenment
    is started. If you aren''t satisfied with the new theme, simply select your old
    one again from the list and reapply it.


    Installing new themes for Enlightenment can be a rewarding process because it
    can reduce eystrain and improve your work throughput, or simply help you express
    yourself. Downloading and installing new themes for Enlightenment is thus a common
    practice among GNOME-enabled Linux users, and because of this, the Themes.org
    Web site maintains a subtitle just for Enlightenment themes


    ```

    http://e.themes.org

    ```


    On this site, you can browse the list of available themes and download themes
    for current Enlightenment versions are usually a single file. To install a theme
    after you''ve downloaded it, simply copy the theme file to the themes/ directory
    off the main Enlightenment tree.


    For example, if you downloaded a theme with the filename emMac.theme and your
    Enlightenment window manager was installed at /opt/gnome/enlightenment, you would
    use the following command:


    ```

    cp emMac.theme /opt/gnome/enlightenment/themes

    ```


    After the theme file has been copied to the themes directory, restart both Enlightenment
    and the Enlightenment configuration editor so that the new theme can be selected
    and made active. Enlightenment can be restarted by middle-clicking on the root
    window and selecting Restart from the pop-up menu.


    # Changing the Focus Policy


