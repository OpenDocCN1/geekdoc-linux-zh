  md: '# Table 5.11 General Information About OpenLook/XView Applications


    | Attribute | Details |

    | --- | --- |

    | Appearance | The appearance of OpenLook/XView applications is unmistakable,
    from the odd cursor and pushins to the circular buttons and drop-down menus. Many
    users feel that the appearance of OpenLook/XView applications is metallic or machine-like
    thanks to the single color and thin edges of OpenLook/XView widgets. |

    | Examples | WorkMan, Perf.

    Like the Athena widgets, OpenLook/XView was developed in an era when 16MHz 32-bit
    workstation with 8MB memory was worth upward of $25,000. OpenLook is easy on memory
    and easy on the CPU as well. |


    # Table 5.12 OpenLook/XView Peculiarities


    | Item | Peculiarity |

    | --- | --- |

    | Cursor | The OpenLook/XView cursor doesn''t blink and can appear either as a
    small diamond or a small triangle below a line of text. Like the Athena cursor,
    the OpenLook/XView cursor can be difficult to position. |

    | Drop-Down Menu | In OpenLook/XView, each drop-down menu has a default action.
    When a drop-down menu is left-clicked, instead of the menu appearing, the default
    action is carried out. For example, users might find that a left click on the
    File menu instantly brings the Save dialog rather than producing a menu of items
    from which to choose. To get the menu, use the right mouse button when clicking
    on a drop-down. |

    | Scrollbar | The OpenLook/XView scrollbars place up and down arrows on the bar
    in the middle of the scroll area. The unexpected behavior occurs when arrows are
    clicked; they cause the menu to move up or down the screen in the opposite direction
    of the, often producing a dizzy sensation in new users. |

    | Pushpin | Most users migrating to Linux from other operating systems will not
    be familiar with the pushpin that appears in OpenLook/XView applications. Clicking
    the pushpin allows a menu to be pinned to the screen indefinitely while other
    activity continues. To unpin a menu or dialog, click the pushpin again and pull
    it out the pinhole. |

    | Text Entry | In OpenLook/XView applications, the small text entry boxes with
    which most users are familiar appear as otherwise undecorated horizontal lines.
    To enter text into the box, the user must click on or near the line. When the
    diamond-shaped cursor appears on the left side of the line, the user can enter
    text. |'
