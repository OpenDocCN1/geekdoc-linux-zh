- img_proc: true
  md: '# Xsetup_0


    Although in theory multiple Xsetup_0 files can be present in an XFree86 installation,
    most users are likely to find or use the setup_0 file only in the xdm/ directory.


    This file is a script not unlike the familiar xinitrc scripts; it is run after
    the server is started and usually calls to X Window binaries and clients that
    are to be started on the local display after the server is running. There are
    two important differences between this script and the xinitrc scripts, however:
    This script is run with root privileges, and it is run before any user logs in.
    In fact, it is run before the login and password prompts are even displayed.


    The file often contains a call to xconsole, causing a console window to be displayed
    on the xdm login screen, but this line can be removed or the file can be augmented
    with additional calls to X utilities. One common addition is an xsetroot to set
    up the root display before the login prompt is displayed:


    ```

    /usr/X11R/bin/xsetroot -solid slate

    ```


    Perhaps you''d like a clock to be displayed on the authentication screen, in the
    lower-right corner of the display:


    ```

    /usr/X11R6/bin/xclock -geometry 75x75-1-1 &

    ```


    Note that any clients started in the script will be unmovable and unresizable
    because window manager has not started yet here in most cases. It is therefore
    necessary to provide geometry specifications for any clients that are started
    here. Take care also to avoid security risks and understand what you are doing;
    remember that any clients started here will be started with root privileges—potentially
    risky as well as annoying to the user if he or she cannot remove a client after
    the session has ended.


    # Xresources


    This file is used to configure the remaining resources for the display manager
    and its widgets. Most commonly, the resources in this file are used to configure
    the behavior and appearance of the xlogin widget, which presents the user with
    a graphical login and password prompt, as shown in Figure 14.1.'
  merge: -1
  pgno: 324
- img_proc: true
  md: '# 310  Chapter 14 Display Managers


    ![](img/edb2a4591eafaad74c22be9075f4b815_325_0.png)


    **Figure 14.1** The xlogin widget presents the user with a graphical login and
    password prompt.


    The xlogin widget''s appearance is fairly configurable, and some of the more common
    resources associated with xlogin can be found in Table 14.2.


    | Table 14.2 Common Appearance-Oriented xlogin Resources |

    | Resource | Description |

    | Login.width | The width, in pixels, of the login widget. |

    | Login.height | The height, in pixels, of the login widget. |

    | Login.foreground | The foreground color used to display user-entered. |

    | Login.font | The font used to display user-entered text. |

    | Login.greeting | The greeting or banner text that appears at the top of the
    login widget. |

    | Login.greetFont | The font used to display the greeting. |

    | Login.greetColor | The color used to display the greeting. |

    | Login.namePrompt | The text used to prompt for a username (account) for logging
    in. |

    | Login.passwdPrompt | The text used to prompt for a password. |

    | Login.promptFont | The font used to display the name prompt and password prompt.
    |

    | Login.promptColor | The color used to display the name prompt and password prompt.
    |

    | Login.fail | The text that is displayed when authentication fails. |'
  merge: -1
  pgno: 325
- img_proc: true
  md: '# The X Display Manager xdm 311


    | Resource | Description |

    | --- | --- |

    | Login.failFont | The font used in displaying authentication failure text. |

    | Login.failColor | The color in which authentication failure text will be displayed.
    |

    | Login.failTime | The period of time during which the authentication failure
    message will appear. |


    The resources shown in Table 14.2 all have to do with the appearance of the login
    widget. It is important to discuss one more resource that will affect the behavior
    of the login widget. The resource in question is Login.translations and it is
    a translation resource, a type of resource I haven''t discussed in this, largely
    because they apply only to complex X toolkit applications that Linux users dont
    often use. In the case of xdm, editing translations can be helpful.


    Without going into too much detail, the format for modifying or adding to the
    translation is roughly as follows:


    ```

    xlogin:Login.translations: #override \\

    mod+=key:key: action(argument) \\

    mod+=key:key: action(argument) \\

    mod+=key:key: action(argument)

    ```


    The first line in the resource, _override, keeps new bindings to be added to the
    ones in xdm. The remaining lines bind each keystroke or set of keystrokes to one
    of a number of predefined actions. In each line, mod is of Ctrl, Shift, Meta (for
    Alt), or is omitted, representing each of the common modifier states; key is a
    key symbol, minus the xk_ prefix, from the X11/keysymdef.h off the main X11R6
    tree; action is of a predefined set of actions supported by the login widget;
    argument is an for the action or if argumentation is supported. To illustrate,
    consider the following:


    ```

    xlogin:Login.translations: #override \\

    Ctrl+Key:Backspace: erase-line() \\

    Ctrl+Key:F1: set-session-argument(normal) \\

    Ctrl+Key:F2: set-session-argument(astep) \\

    Ctrl+Key:F3: set-session-argument(wmaker) \\

    Ctrl+Key:F4: set-session-argument(kde) \\

    Meta+Key:Escape: abort-session

    ```


    In this example, a few keystrokes to those that login knows about. First, the
    Ctrl+Backspace keystroke will now call the erase-line() action, which will delete
    the entire line of text entered so far. Control+F1, Control+F2, and Control+F3
    now call all the set-session-argument() action, which affects the arguments to
    the Xsession script you will learn in the next section. Finally, the Alt+Esc eyesight
    restores the X session and restarts the X server.


    Some of the commonly modified or added actions supported by the login widget are
    shown in Table 14.3.'
  merge: -1
  pgno: 326
- img_proc: true
  md: "# 312 Chapter 14 Display Managers\n\nTable 14.3 Actions Supported by the xlogin\
    \ Widget\n\n| Action | Description |\n| move-to-beginning() | Move to the beginning\
    \ of the current text entry box. Note that beginning must be spelled incorrectly.\
    \ |\n| move-to-end() | Move to the end of the current text entry box. |\n| erase-to-end-of-line()\
    \ | Erase all after the cursor. |\n| erase-line() | Erase all in the text entry.\
    \ |\n| finish-field() | Move the cursor to the other text entry box. |\n| abort-session()\
    \ | Kill the server and restart it. |\n| set-session-argument(arg) | Cause xdm\
    \ to call the Xsession script (see next session) with arg as an argument |\n\n\
    Most of the time, the default-oriented translations are adequate and users won't\
    \ need to change them. It can, however, be common to use the set-session-argument()\
    \ to pass arguments to the Xsession script and thereby allow the user to launch\
    \ different types of X sessions.\n\n# Xsession\n\nThis is the script that is called\
    \ after authentication is complete to start the X session for the user. In a logical\
    \ sense, the Xsession script replaces the xinitrc script as the primary method\
    \ for configuring a session and starting clients.\n\nThe script typically checks\
    \ to see whether there is an executable file at $HOME/.xsession and if it exists,\
    \ if no $HOME/.xsession file, the systemwide Xsession will continue; it is therefore\
    \ common to several clients and a window manager started at the end of the Xsession\
    \ script.\n\nOf particular interest is that the xlogin widget can be made to pass\
    \ an argument to Xsession when it is called. For example, recall the three translations\
    \ from the example in the previous section:\n\n```\nCtrl+F1: set-session-argument(normal)\
    \ \n\nCtrl+F2: set-session-argument(astep) \n\nCtrl+F3: set-session-argument(wmaker)\
    \ \n\nCtrl+F4: set-session-argument(kde) \n\n```\n\nIf, while logging in, the\
    \ user issues a Control+F1 keystroke and then finishes authenticating, the Xsession\
    \ script will be called with the word normal as an argument. If the user issues\
    \ a Control+F2 keystroke and then finishes authenticating, the Xsession script\
    \ will be called with the word astep as an argument, and so on. Now, consider\
    \ the simple Xsession script in Listing-14.1."
  merge: -1
  pgno: 327
- img_proc: true
  md: "# Listing 14.1 Sample Xsession Script\n\n```\n#!/bin/sh\n\ncase $1 in\nnormal)\n\
    \    xterm -geometry 80x24+1+1 &\n    xclock -geometry 75x75-1-1 &\nn    exec\
    \ twm\n    ;\nastastep)\n    exec afterstep\n    ;;\nwmaker)\n    exec wmaker\n\
    \    ;;\nkde)\n    exec startkde\nesac\n\nif [ -f $HOME/.xsession ]; then\n  \
    \  exec $HOME/.xsession\nfi\n\nexec xterm -geometry 80x24+1+1\n```\n\nThe script\
    \ in Listing 14.1 is simple, but it serves to illustrate the function of the Xsession\
    \ script well. The case statement handles the contingencies when the user issues\
    \ the Control+F1, Control+F2, Control+F3, or Control+F4 keystrokes during authentication,\
    \ starting twm, afterstep, Window Maker (wmaker), or KDE (startkde), respectively.\
    \ If none of the keystrokes were issued, then Xsession proceeds to check for a\
    \ $HOME/.xsession file. If it is found, it is called. If not, the user's session\
    \ consists only of a controlling xterm client.\n\n# authdir\n\nThis important\
    \ directory is mentioned because its absence can often cause the display manager\
    \ to fail to function. This directory contains automatically generated magic cookies\
    \ associated with open displays for ongoing authentication purposes. Don't delete\
    \ or move this directory while xdm is in use.\n\n# Starting xdm\n\nWith basic\
    \ configuration out of the way, the only thing left to do is actually start xdm.\
    \ Before starting xdm, it is important to ensure that the X server starts and\
