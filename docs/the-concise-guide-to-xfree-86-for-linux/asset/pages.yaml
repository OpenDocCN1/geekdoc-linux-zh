- img_proc: true
  md: '# The Standard Xt/Athena Command-Line Arguments


    It is sometimes inconvenient to have specify all forms of configuration as resource
    strings, especially when changes as simple as foreground and background color
    are to be made. So, most Xt and Athena applications support a very basic set of
    command-line arguments that roughly correspond to the core resource set in Table
    8.2. These command-line arguments are described in the sections that follow.


    # Border Options: -bd and -bw


    The -bd -bw options control the border color and border width for the application
    widgets, respectively. These arguments correspond to the borderColor and borderWidth
    properties. They are commonly used as:


    ```

    xt-app -bd bd col -bw n

    ```


    In this example, col represents either a color from the X color database or a
    color specification from the RGB colorspace, and n represents the width, in pixels,
    of widget borders.


    # Text Options: -fg, -bg, and -fn


    These three options control the appearance of text in Xt/Athena applications.
    The -fg argument controls the foreground color of affected text. The -bg argument
    controls the background color of affected text. The -fn argument controls the
    font in which text will be drawn. These arguments correspond to the foreground,
    background, and font properties, and are generally used like:


    ```

    xt-app -fg col -bg col -fn XLFD

    ```


    In this example, col represents either a color from the X color database or a
    color specification from the RGB colorspace in both cases. The -fn argument accepts
    an X logical descriptor of the type generated by the xfontsel utility.


    # The -geometry Option


    The -geometry option is the option related to window size and placement and is
    really a special case because it is a composite of four the core resources, x,
    y, height, and width, and requires a special argument format. The -geometry argument
    should be used in one of the following ways:


    ```

    xt-app -geometry SZXXSzy

    xt-app -geometry [+-]n[+-]

    xt-app -geometry SZXXSzy[+-]n[+-]

    ```'
  merge: -1
  pgno: 206
- img_proc: true
  md: 'The first method of using the .geometry argument provides simply a size in
    pixels in the X direction (horizontally), szx, and a size in pixels in the Y direction
    (vertically), szy. For example, to call an xclock window with a size of 400×300
    pixels, use the following command:


    ```

    xclock -geometry 400x300

    ```


    The second method of using the .geometry argument provides only a location for
    the application on the display, in an offset from either the left or right, or
    the top or bottom of the screen, in pixels, respectively. Positive numbers represent
    offsets from the top and left of the screen, while negative numbers represent
    offsets from the bottom and right of the screen. For example, to start an xclock
    of default size and place the window at 10 pixels from the left of the screen
    and five pixels from the top, you may use


    ```

    xclock -geometry 10+5

    ```


    On the other hand, if you wanted to start an xclock that is one pixel from both
    the bottom and right edges of the screen, you would use


    ```

    xclock -geometry -1-1

    ```


    And, as a final illustration, to start an xclock window 10 pixels from the right
    of the display and two pixels from the top, the following command would work:


    ```

    xclock -geometry -10+2

    ```


    The final method for using the .geometry argument simply combines the other two
    methods into a single argument string. For example, to start an xclock window
    that is 150 pixels wide by 200 pixels tall to the bottom and left edges of the
    display, you would use


    ```

    xclock -geometry 150x200+10-10

    ```


    Note that in the cases of windows that are fundamentally text-based widgets, the
    height and width values can be in characters rather than in pixels. Such is the
    case with primarily text-based applications as xterm.


    # Window Title


    The window title can even be changed from the command line, using the .title argument,
    as follows:


    ```

    xterm -title ''Xterm Window Number Four''

    ```


    Note that because this is occurring on the command line, the text string must
    either be escaped or delimited with single or double quotes; otherwise, each word
    will be interpreted as a separate command-line argument.'
  merge: -1
