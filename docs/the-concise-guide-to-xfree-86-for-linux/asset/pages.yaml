- img_proc: true
  md: 'Fonts and Colors


    # The RGB Colorspace


    The concept of a colorspace can be difficult to understand, but perhaps a simple
    question will help. How would you specify to series of individuals, without showing
    them any visual clues, an exact color from reality, or just an exact shade of
    red so that each one of them could choose it correctly from the spectrum at some
    later date? The answer is that you couldn''t; humans simply don''t think about
    color in any way visually.


    This leads to a paradox when dealing with computers and color: computers don''t
    have visual perception; they must obtain information about any color and decide
    which colors to display purely on some written or mathematical form of data. This
    is where the concept of a colorspace comes in.


    A colorspace is a logical space full of colors in a certain order or arrangement.
    Specifying a particular color in a nearly infinite spectrum becomes the process
    of specifying a particular location in that colors. Although many colorspaces
    are available to X users and the X community at large is the RGB colorspace. The
    RGB colorspace is quite simple; it is composed of three coordinates, each for
    red, green, and blue. In the simpler RGB colorspace, each coordinate can be given
    a value from 0-255, with zero being the absence of light (black) and 255 being
    the brightest light playable in that color. Table 7.5 lists some sample combinations
    to help illustrate.


    Table 7.5 Sample R, G, and B Values and Resultant Colors

    | Red, Green, Blue | Resultant Color |

    | :--- | :--- |

    | 0, 0, 0 | Black (no light of any color) |

    | 255, 255, 255 | White (all three at maximum light) |

    | 255, 0, 0 | Brightest red |

    | 0, 255, 0 | Brightest green |

    | 0, 0, 255 | Brightest blue |

    | 100, 100, 100 | A dark shade of gray |

    | 200, 200, 200 | A lighter shade of gray |

    | 255, 255, 0 | Brightest yellow |

    | 200, 200, 0 | A dimmer yellow |

    | 255, 0, 255 | Brightest purple |

    | 200, 0, 200 | A dimmer purple |'
  merge: -1
  pgno: 178
- img_proc: true
  md: '# Chapter 7 Runtime Server Configuration


    When specifying colors to Free86 in the RGB colorspace, the values must be converted
    to Hexadecimal (base-16) numbers and preceded with a hash (#) mark. Table 7.6
    shows the colors again, but this time using valid RGB colorspace references.


    Table 7.6 The Same Colors as RGB Colorspace Items for X

    | RGB Color | Resultant Color |

    |---|---|n| #000000 | Black (no light of any color) |

    | #ffffff | White (all three at maximum light) |

    | #ff0000 | Brightest red |

    | #00ff00 | Brightest green |

    | #0000ff | Brightest blue |

    | #646464 | A dark shade of gray |

    | #c8c8c8 | A lighter shade of gray |

    | #ffff00 | Brightest yellow |

    | #c8c00 | A dimmer yellow |

    | #ff00ff | Brightest purple |

    | #c800c8 | A dimmer purple |


    Most of the time, when you specify color to Free86 or to Free86 applications,
    you''ll use this RGB colorspace format, though some graphics-oriented applications
    (such as GIMP) allow you to specify colors in any one of several other colorspaces
    as well. Many users have trouble converting from the decimal scale of 0–255 to
    the hexadecimal scale of 0–ff for color. One way is to use the awk command, like
    this:


    ```

    echo n | awk ''{ printf "%x\n", $1 }''

    ```


    Replace n with the number, from 0–255, that you want to convert to hexadecimal,
    and awk will happily print the equivalent.


    Note that there is an alternative format for navigating the RGB colorspace, which
    provides two bytes of information for each light color. This means that the user
    chooses a number from 0–65535 for each color, or 0–ffff in hexadecimal. RGB colorspace
    definitions done this way look like this:


    ```

    #ffff0000c8c8

    #c8dc9d01fec

    ```'
