  md: '# 17


    # HETEROGENEOUS

    NETWORKS


    # X on Networks


    It''s clear that XFree86 is a powerful implementation of the network-centric X
    window system, and that X was designed from the ground up to work on a network.
    In spite of this fact, managing X effectively on the network is not always as
    easy as it would seem.


    On many networks, it is essential to allow users to log in at any one of several
    graphics consoles in physically different locations. In such cases the user''s
    account, X resources, window manager, and other X runtime elements must function
    well on each console, accounting for varying resolutions, color depths, and capabilities.
    Often, X-enabled networks contain a variety of UNIX-style hardware from different
    vendors, meaning that different versions of X will often be in use and must be
    able to communicate effectively with one another.


    Most important, modern networks are rarely composed of a single type of hardware
    platform; it is important to understand how X functions on networks that include
    not only Linux or UNIX machines, but MacOS, Windows, and other operating systems
    as well.'
  merge: -1
  pgno: 366
- img_proc: true
  md: '# Multiple Login Points


    One method for dealing with user accounts that have multiple physical login points
    with varying capabilities through judicious use of the xinitrc script, both systemwide
    as well as user-specific.


    When editing the xinitrc scripts, it is important to understand something about
    shell programming. It is also extremely important to know something about the
    capabilities of the various machines and X consoles on your network and to have
    a fundamental understanding of the software that is installed on the network.


    A complete discussion of shell programming or the fundamentals of UNIX-style networking
    is beyond the scope of this text. There are, however, a few places that can be
    good starting points for X-enabling a network.


    # The DISPLAY Variable


    The DISPLAY environment variable is an important hint when managing the X login
    and initialization process. By keeping track of the capabilities of various displays
    (servers) around the network and accounting for the differences in display depth,
    resolution, and server versions, the first battle will have won.


    Recall that the display variable when a display is used across a network generally
    contains a value in the following format:


    ```

    host:$s

    ```


    The host is either a host name or a fully qualified domain name for the display
    machine in question; q represents the display and s represents the screen. Checking
    for the host, display, or screen in a script can allow the script to start different
    clients or to start clients with different arguments based on the known capabilities
    of the host, display, or screen in question. Table 17.1 lists methods for extracting
    the host name, display, or screen from the DISPLAY environment variable into the
    x_HOST, x_DISPLAY, or x_SCREEN variables, respectively.


    | Table 17.1 Extracting Host, Display, and Screen |

    | Value | Sample Command |

    | Host | X_HOST=`cat $DISPLAY|cut -d: -f1` |

    | Display | X_DISPLAY=`cat $DISPLAY|cut -d: -f2|cut -d. -f1` |

    | Screen | X_SCREEN=`cat $DISPLAY|cut -d: -f2|cut -d. -f2` |


    The DISPLAY variable is useful for finding information about the machine running
    the X server and making decisions based on such information.'
  merge: -1
  pgno: 367
- img_proc: true
  md: '# The uname Command


    The uname command is one of the network administrator''s best friends when it
    comes to managing multiple login hosts for user accounts. By supplying various
    arguments to the uname command and applying the information returned, decisions
    can be made based on the system on which the xinitrc scripts are actually running.
    Table 17.2 shows the most common arguments to the uname command and their meanings.


    Table 17.2 Common uname Arguments and Meanings

    | Argument | Description |

    | --- | --- |

    | -s | Displays the operating system in use, for example, Linux. |

    | -m | Displays the type of hardware in use, for example, m68k or i386. |

    | -r | Displays the operating system release, for example, 2.2.5ac6. |

    | -n | Displays the machine''s full host name. |


    The uname command is useful for finding information about the machine that will
    be running the X clients and making decisions based on such information.


    # Root Window Color Depth


    It is also sometimes helpful to know the depth of the root window or the type
    of visual used by the root window, especially on Linux-based XFree86 installations
    that will be started at any of several color depths.


    In such cases, the xdpinfo command, covered in complete detail in Chapter 4, "Standard
    XFree86 Programs and Utilities," is the command of choice. Through judicious use
    of commands like grep and awk, it is possible to extract the relevant information
    from xdpinfo and store it in a variable. For example, the following command gets
    the depth of the root window and store it in a variable:


    ```

    X_DEPTH=`xdpinfo|grep depth.r.*|cut -d -f2|awk ''{print $1}''`

    ```


    Clearly, some understanding of shell programming basics is required to be able
    to extract information from xdpinfo effectively.


    # Putting It All Together: An Example


    In this case, the best way to illustrate one in which these techniques can all
    be assembled is a simple example. Imagine a network in which users with valid
    accounts are to have access to their accounts from any number of machines, each
    of which may be of a different platform. The X displays are also of varied platforms
    and color depths. What sort of scripting could take place during the startup process
    to compensate for this variability? Listing 17.1 shows one possible small script
    fragment from such an environment.'
  merge: -1
  pgno: 368
- img_proc: true
  md: '# 354 Chapter 17 Heterogeneous Networks


    # Listing 17.1 Script Fragment, Varied Network Environment


    ```

    X_HOST=cat 0DISPLAY|cut -d: -f1

    X_DEPTH=\xxdpyinfo|grep .r*:|cut -d: -f2|awk ''{print $1}''

    X_CLIENT=uname -n|cut -d: -f1

    X_CLARCE=uname -n

    #

    # X resolution first assumed to be 1152x900

    #

    X_RES=1152x900

    #

    # See if resolution adjustment is necessary

    #

    [ X_HOST = pokey ] && X_RES=1024x768

    [ X_HOST = foobar ] && X_RES=800x600

    #

    # Adjust FVWM config based on depth and resolution

    #

    [ X_DEPTH = 8 ] && FVWM_CONFIG=$HOME/.fwmrc-8bit-$X_RES

    [ X_DEPTH = 16 ] && FVWM_CONFIG=$HOME/.fwmrc-16.24.32bit-$X_RES

    [ ! -e $FVWM_CONFIG ] && FVWM_CONFIG=$HOME/.fwmrc-default

    #

    # Mount local binaries based on platform

    #

    if [ $X_CLARG ]; [ $X_CLARG = sparc ]; then

    mount /usr/X1R6/local/$X_CLARG/bin

    export PATH=$usr/X1R6/local/$X_CLARG/bin

    rm $HOME/xbin; ln -s /usr/X1R6/local/$X_CLARG/bin $HOME/xbin

    else

    mount /usr/X1R6/local/i86/bin

    export PATH=$usr/X1R6/local/i86/bin

    rm $HOME/xbin; ln -s /usr/X1R6/local/i86/bin $HOME/xbin

    fi

    #

    # Launch window manager


    fvm -f $FVWM_CONFIG

    ```


    This script fragment is not intended for production use, but rather as an illustration
    of the ways in which information about the current X runtime, client machine,
    and server host can be used.


    # Command-Line Arguments


    Several commonly used X binaries accept command-line arguments that can be useful
    when trying to adapt XFree8 to a multipatform or multiuser network. Most of these
    arguments allow an alternate configuration file to be specified, in cases where
    a single default file is inadequate. A list of some command-line arguments can
    be found in Table 17.3.'
  merge: -1
  pgno: 369
- img_proc: true
  md: '# Table 17.3 Helpful Command-Line Arguments


    | Command | Description |

    |---|---|

    | fwm -f | Launch the fwm window manager using file as the window manager configuration
    file. |

    | fwm2 -f | Launch the fwm2 window manager using file as the window manager configuration
    file. |

    | twm -f | Launch the twm window manager using file as the window manager configuration
    file. |

    | xdm -session script | Use script as the session management script in place of
    the default xsession script. |

    | xdm -config file | Use file as the xdm configuration file rather than the default
    xdm-config file in /usr/X1R6/lib/X11/xdm. | |

    | X -audit level | Set the connection audit level. If level is 1, rejected connections
    are reported. If level is 2, all connection openings or closings are reported.
    If level is 4, all security information is also logged. If level is 0, auditing
    is turned off. |

    | X -auth file | Use file as the cookie file for authorizing users using token-based
    authentication. |

    | X -query host | Query an XDMCP session (login manager) from the given host |


    Note that x binary is not normally called directly, but is more often called via
    xrapper or startx. For more information on using startx, please refer to Chapter
    3, "Launching XFree86."


    # Mixing Client and Server Versions


    As is the case with any type of software interoperability, the closer two software
    items are in terms of release versions, the more likely they are to work together
    happily. The same wisdom applies to the world of networked X, where many versions
    of X remain in widespread use.


    # X11R6 Releases


    Most X installations based on one of the X11R6 releases, including the great majority
    of Linux installations, will safely interact with each other with a minimum of
    compatibility problems.


    Subreleases of X11R6 include X11R6.2, X11R6.3, and X11R6.4. Specific extensions
    unique to XFree8 releases are less likely to work than standard X protocols when
    used in multiple version environments, and local extensions like DGA will not
    display across the network at all.'
  merge: -1
  pgno: 370
- img_proc: true
  md: '# Chapter 17 Heterogeneous Networks


    X11R6 servers work well with clients from X11R5 and X11R4 machines, though some
    modifications to source code might be necessary when applications are recompiled.
    X11R6 servers are less friendly to pre-X11R4 clients, many of which won''t operate
    at all, and users should make every attempt to use at least X11R4 clients when
    later clients are available.


    # X11R5 Releases


    The X11R5 release was close enough in substance to the X11R6 releases that the
    great majority of X11R5 software is interoperable with X11R6 installations.


    X11R5 servers will run a surprisingly complete number of X11R6 clients without
    modification, and adapting client source code between X11R5 and X11R6 is generally
    very easy to accomplish. Most X11R4 clients will function on X11R5 servers without
    modification, though again some source code must be modified if applications are
    to be recompiled.


    # X11R4 Releases


    The X11R4 release is two versions different from X11R6 installations, and it shows;
    X11R4 clients are less likely to operate correctly with X11R6 servers than X11R5
    clients, and many small bugs and peculiarities begin to appear in program function
    when attempting to use X11R4 clients with X11R6 servers.


    X11R4 servers will have trouble with a large segment of X11R5 and X11R6 clients
    due to fundamental differences such as the lack of scalable font capability. X11R4
    clients should be used with X11R4 servers whenever possible.


    # Pre-X11R4 Releases


    Pre-X11R4 clients and servers should be regarded as completely deprecated and
    should be avoided whenever possible. Compatibility with later releases is minimal
    in best most cases, and source code is different enough to make porting to R5
    or R6 systems a major job.


    Most pre-X11R4 machines are old enough to have lost much of their utility anyway
    and should be retired for X use unless a suitable distribution of XFree86 or some
    other X11R6-based X installation can be found.


    # X Servers for Non-UNIX Operating Systems


    Although its certainly possible to restrict X access to UNIX and Linux machines
    only on a given network, it often inconvenient to do so. In many cases, the preferred
    solution is a network on which every host is X server-enabled and remote X clients
    can thus be displayed anywhere, not just on UNIX or Linux hosts.'
  merge: -1
  pgno: 371
- img_proc: true
  md: '# X Servers for Non-UNIX Operating Systems


    Many X servers are available for several different common hardware and operating
    system platforms. After an X server is installed, most such platforms can act
    as more than adequate X login, session, or client display points.


    # X Servers for Windows


    Quite a few X servers are available for Windows machines, ranging in functionality
    from basic X11R5-style servers to X functionality integrated into a large connectivity
    suite. The servers listed in this section are predominantly that: standalone servers
    or X distributions in the traditional sense. Prices and specifications vary wildly;
    if in doubt, it is best to contact the vendor and inquire about pricing and specific
    capabilities or components.


    # X-WinPro from Labtam Finland Ltd.


    The X-WinPro suite from Labtam Finland Ltd. is an X11R5-based X distribution that
    runs on all versions of Windows from Windows 3.1 to Windows 95/98 and Windows
    NT. Several X clients and Motif-based clients are included in the standard packages,
    which retail for $99.00 for a single user or as little as $60.00 per user for
    a 100-user license.


    The X-WinPro Web site can be found at http://www.labf.com/xwpweb/


    # KEA!X from Attachmate


    The KEA!X server from Attachmate is an X11R6.3-based X server that supports low-bandwidth
    X protocol mode in addition to the standard X protocol. The server runs on all
    versions of Windows from Windows 3.1 to Windows 95/98 and Windows NT. It includes
    NFS client-support on Windows 95/98 and NT-based systems.


    For pricing and availability, please contact Attachmate at 1-800-933-6751 or visit
    the KEA!X site at http://www.attachmate.com/OSG/KEA!X/.


    # Exceed from Hummingbird


    The Exceed server from Hummingbird remains one of the most popular X servers among
    Windows users. Versions are available supporting all Windows releases from 3.1
    to 95/98 and NT. The latest Exceed server is X11R6.4-based. The Exceed server
    supports several advanced features including displaysupport and Kerberos authentication.


    For pricing and availability, please visit the Exceed Web site at http://www.hummingbird.com/products/nc/exceed/'
  merge: -1
  pgno: 372
- img_proc: true
  md: '# MI/X from Microimages


    The MI/X server from Microimages held the distinction for quite some time of being
    the only freely available server for Windows-based computing environments. With
    the 2.0 release of MI/X for Windows, this is no longer the case, with pricing
    at $25.00 per user for a single user or as little as $17.50 per user for 500+
    users. The MI/X server is based on X11R5 and does not support xm query type functionality.


    For availability and purchase information, please see the MI/X for Windows home
    page at http://www.microimages.com/mix.


    # PC-Xware from NCD


    The PC-Xware server from classic X-terminal manufacturer Network Computing Devices,
    Inc. (NCD) is based on the X11R6 release and runs on all versions of Windows from
    3.1 to Windows 95/98 and NT. The package includes an NFS client as well as a TCP/IP
    stack for Windows 3.x machines.


    For pricing and availability, please see the PC-Xware home page at http://www.ncd.com/ppcx/
    or visit the order page at https://www.ncd.com/ppcx/pcxorder.html.


    # X-Deep/32 from Plexus Systems


    The X-Deep/32 distribution from Plexus Systems is a complete X11R6.1 distribution,
    including server, clients, tm window manager, and other standard X11R6.1 components.
    The distribution is compatible with Windows 95/98 and NT machines and is available
    on CD for $49.95 per user.


    For more information, please see the Plexus Systems home page at http://www.pex.com/.
    For order information, please visit the X-Deep/32 order page at http://www.pex.com/Sales/sales.html.


    # XVision Eclipse from SCO


    The XVision Eclipse server from Santa Cruz Operation, Inc. (SCO) is a complete,
    plug-and-play X11R6.3 server for Windows 95/98 and NT machines. Pricing begins
    at $429.00 for a single-user license.


    For complete information, as well as pricing and availability, please visit the
    XVision Eclipse Web site at http://www.sco.com/vision/products/eclipse/info.html.


    # Interix X Products from Softray Systems, Inc.


    Softray Systems, Inc. sells a complete line of X servers and X-based products
    for Windows PCs under the Interix name. For complete information on Interix products,
    including X11R5'
  merge: -1
  pgno: 373
- img_proc: true
  md: '# X Servers for Non-UNIX Operating Systems


    X and X11R6 servers and development environments, please visit the Interix home
    page atnhttp://www.interix.com.


    # X-Win32 from StarNet Communications Corporation


    The X-Win32 product from StarNet Communications Corporation is an X server for
    Windows 3.1, 95/98, and NT-based systems. The X-Win32 product supports some Xecurity
    extensions and low-bandwidth X protocol extensions. Pricing is $200.00 per user
    with volume discounts available for 10+ license purchases.


    For complete information, pricing, and availability, please visit the X-Win32
    home page atn://www.starnet.com/product.htm.


    # Omni-X from XLink


    The Omni-X server from XLink is an X11R5/6 server for computers running Windows
    95/98 or Windows NT operating systems. Omni-X supports XFree86-style virtual panning
    and full XDMCP connectivity. Pricing begins at $69.00 for an academic single-user
    license or $135.00 for a single-user license.


    For additional information and availability, please visit the Omni-X home page
    atn://www.xlink.com/nfs_products/Omni_X_Server/X_Server.htm or see the XLink page
    at http://www.xlink.com.


    # X Server for Macintosh


    The majority of non-UNIX and non-Linux X servers are available for the Windows+x86
    platform only. Macintosh users aren''t completely left out, however. The current
    server of choice for many users, in part because of its price (free) is the MI/X
    server for Macintosh, an X11R-based server similar to the MI/X server for Windows.


    The MI/X for Macintosh requires a Power Macintosh and can be downloaded from the
    MI/X for Macintosh home page at http://www.microimages.com/freestuf/macindex.htm.


    # X11R6.4 Distribution, with Server/2


    The XFree86 Project maintains a complete XFree86 distribution for OS/2 machines
    similar to the distribution for Linux machines. The XFree86 3.3.5 release supports
    OS/2 Warp 3 (all versions), Warp Connect, Warp Server, and Warp 4. The binaries
    directory for XFree86 3.3.5 for OS/2 can be found at ftp://ftp.xfree86.org/pub/XFree86/3.3.5/binaries/OS2.


    XFree86 3.3.5 for OS/2 supports the same set of graphics hardware supported by
    XFree863.3.5 for Linux and can be compiled from source by OS/2 if desired.'
  merge: -1
  pgno: 374
- img_proc: true
  md: '# Virtual Network Computing


    An interesting method for achieving XDMCP-like network transparency across multiple
    platforms can be found at the Virtual Network Computing home page at http://www.uk.research.att.com/vnc/


    Virtual Network Computing is a freely available system that provides functionality
    similar to the functionality provided by an X server, in that a running graphical
    desktop can be displayed remotely from the machine on which the applications are
    actually executing. Virtual Network Computing is not, however, an X server in
    its own right.


    Downloads are free for several UNIX platforms: Linux, Macintosh, Windows, and
    Java. A complete discussion of Virtual Network Computing is beyond the scope of
    this text; if you think that Virtual Network Computing might work for you, please
    visit the home page listed previously.'
  merge: -1
