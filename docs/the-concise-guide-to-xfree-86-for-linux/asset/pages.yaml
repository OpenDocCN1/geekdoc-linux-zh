  md: '# 16

    TUNNELING X THROUGH

    ssh (SECURE SHELL)


    Chapter 15, “Working on the Network,” discussed token-based authentication, which
    is theoretically the most secure way to run an X server, and mentioned that one
    of the flaws in token-based security is that anyone who gets hold of a magic cookie
    sent across the network can breach that security. The obvious answer is to never
    send the cookie over the network at all, but it is sometimes necessary in order
    to work efficiently on the network.


    And there are other issues with the X network capability. What about the X protocol
    itself? If the X Window System is to be a viable network solution for multiple
    purposes, it is important that an X data stream not be easily interceptable by
    some undesired third party with malicious or thieving intent. Is there any way
    to ensure that the X data stream is not stolen right out from you as you work?


    The best way to keep tokens from being stolen and the X data stream being intercepted
    is to install and use ssh, the secure shell, on your network for all X transactions.


    # What Happens When I Use ssh?


    It''s unquestionably true that the use of ssh adds an additional layer of complexity
    to an X network management scheme that can already seem some complexity to some
    users. It''s also true that ssh requires the download of software over the Internet
    and its subsequent installation and configuration. Because'
  merge: -1
  pgno: 356
- img_proc: true
  md: '# Chapter 16 Tunneling X Through ssh (Secure Shell)


    of these hindrances, many users are reluctant to download and use ssh, preferring
    instead to take the risk, especially when it isn''t clear just exactly ssh does.


    # Security Is Improved


    The ssh works like the rsh command in that it enables the user to execute commands
    on a remote machine. Unlike rsh, however, ssh encrypts data passing between the
    systems so that it cannot easily intercepted and used by malicious third parties.
    In fact, ssh virtually eliminates several types of attacks and misbehavior, including
    IP spoofing, intercepting of plain text data (like magic cookies or password),
    and attacks built using IP source routing.


    The ssh system can easily tunnel several types of binary data streams through
    its encrypted connection, among them the X data stream, so that applications run
    remotely by tunneling them ssh secure, encrypted X data streams. The secure shell
    completes this by setting up a proxy server that is actually the ssh daemon; the
    monitor connects to the local system via the encrypted proxy connection, and the
    ssh daemon to the X server and sends the data in encrypted format that the X server
    can understand. In this way, unencrypted data is prevented from being sent over
    the network without any changes to be made to existing X servers.


    A good, human-readable discussion of ssh, its function, and its benefits can be
    found in SunWorld Online at the URL


    ```

    http://www.sunworld.com/sunworldonline/swol_02 1998/swol_02 security.html

    ```


    Because of these, ssh should be used in almost any case where X data streams or
    X authentication cookies will be sent over the network. After ssh becomes second
    nature (and it will), the effort involved in it is certainly smaller than the
    risk you will be taking by not using it.


    # Speed Is Improved


    Because ssh includes the option to compress data streams on-the-fly, ssh can actually
    improve network performance when used on machines whose processors can handle
    the encryption/decryption tasks adequately. This can be extremely useful on congested
    networks or on slower links when every last bit of bandwidth is exploited.


    The method of compression by ssh is the same as the method of compression by the
    fast and ubiquitous gzip command, and as is the case with gzip, the compression
    efficiency can be adjusted from level 1 (fastest) to level 9 (most compression).
    This added benefit of compression alone is enough to cause many users to use ssh
    to tunnel X connections.'
