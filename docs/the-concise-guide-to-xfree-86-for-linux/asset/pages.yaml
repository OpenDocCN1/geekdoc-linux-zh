    # Font XLFDS in misc/


    The fonts in misc/ directory are bitmapped fonts, meaning that they come in a
    predefined set of sizes and any scaling which will likely result in fonts which
    are imperfect in appearance. These XLFDS (especially those in the fixed sets)
    should be considered the baseline fonts for network compatibility and multipatform
    interoperability because nearly all systems will have the fixed sets of fonts
    and an alias *fixed* that refers to one always-present font.


