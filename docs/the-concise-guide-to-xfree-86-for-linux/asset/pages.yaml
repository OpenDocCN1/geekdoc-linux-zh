  md: '![](img/edb2a4591eafaad74c22be9075f4b815_58_0.png)


    **Figure 2.10** The xvdtune utility enables you to adjust your display in all
    sorts of interest- ways: up, down, left, right, shorter, taller, narrower, or
    wider.


    Use xvdtune is fairly straightforward. If the image you see on your screen needs
    to be shifted left or right, made wider or narrower, shifted up or down, or made
    shorter or taller, simply clicking the correct button. Each time you make a change,
    clicking the Apply button will cause the changes to take effect. Assuming you
    correctly configured your monitor in XFree86setup, xvdtune will not allow the
    display to move in any way that is beyond the monitor''s capabilities. If at some
    point you need to revert to the display''s original state and start again, click
    the Restore button and then the Apply button in sequence.


    After your display is properly sized and centered, choose Quit to close the xvdtune
    window, and then click the Save the Configuration and Exit button to make your
    changes permanent and write a final version of the configuration file to /etc/XFree86Config.


    It is to note that the xvdtune application is obsolete to some degree; many users
    can bypass xvdtune altogether, making the changes using multisync monitor''s adjustments
    instead. If you have a monitor, feel free to make adjustments as needed using
    monitor controls rather than bothering with xvdtune.


    # # Configuring with xf86config


    The xf86config utility is most useful for Linux users whose hardware doesn''t
    support 16-color VGA option. This includes most users of non-x86 platforms, such
    as the Motorola m68k or PowerPC users. Even though the xf86config interface is
    not as nice as the graphical interface of XFree86setup, xf86config was the only
    XFree86 configuration tool for years, and it should therefore be perfectly adequate
    for XFree86 configuration in most cases.'
