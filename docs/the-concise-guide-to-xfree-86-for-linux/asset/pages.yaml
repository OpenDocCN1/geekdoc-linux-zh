  md: '# Chapter 2 Installing and Configuring XFree86


    Table 2.5 Valid ServerFlags Section Options


    | Option | Description |

    |---|---|n| This flag allows the X server to core dump on certain errors instead
    of attempting to trap them. This is generally not desirable behavior unless you
    are trying to debug an X server before compiling and linking it. |

    | DontZap | This flag does not allow the X server to be killed with the Ctrl+Alt+Backspace
    key combination. Useful in multiuser situations, but generally bad in a single-user
    context because it removes the most common method of emergency exit from the X.
    |

    | DontZoom | This flag does not allow the X server to switch video modes with
    the Ctrl+Alt+[Plus] and Ctrl+Alt+[Minus] key sequences. Normally there isn''t
    reason to disable these key sequences unless you need to use an X client that
    is expecting such sequences. |

    | AllowNonLocalXdtune | This flag allows connections to X server from xvtune that
    aren''t running on the local host. There is normally reason to change this unless
    the XF86config file for a given display residing on another host. |

    | DisableVidMode | This flag disables certain parts of the extension that allow
    the changing of video modes. |

    | AllowNonLocalModInDev | This flag allows clients on other hosts to modify the
    keyboard and mouse settings of the local server. |

    | DisableModInDev | This flag disables certain parts of the extension that can
    be used for modifying input device configuration. |

    | AllowMouseOpenFail | This flag starts if the mouse doesn''t work, can''t be
    initialized, or seems not to be present. Normally if your mouse isn''t working,
    you don''t want the server to start anywhere because there is little you can do
    without a pointing device. Note that enabling both AllowMouseOpenFail and DontZap
    on machines with only a single virtual console is a recipe for a potential lockout
    should the mouse go bad. |


