  md: "This boot option, for example, would boot Linux into 1024×768 graphics screen\
    \ at 16.7 million colors (24 bits per pixel). It is a little clumsy to specify\
    \ the graphics mode each time boot, so it's recommended that you edit and update\
    \ your LILO configuration. Note that you must boot into a VESA graphics mode in\
    \ order to use the X framebuffer server with the VESA console.\n\n# Using the\
    \ Framebuffer Console with XFree86\n\nTo start X on the framebuffer console, you\
    \ must first have installed the framebuffer X server (see the list of XFree86\
    \ components in Chapter 1. After the framebuffer server from XFB.tgz is installed\
    \ at /usr/X116/bin/XF86_FBdev, be sure to create the symbolic link to /usr/X116/bin/bin/X:\n\
    \n```\nrm /usr/X116/bin/X\nln -s /usr/X116/bin/XF86_FBdev /usr/X116/bin/X\n```\n\
    \nThen, generate a basic XFree86 config file using XF86Setup or xf86config. Configure\
    \ everything as you would normally, but don't spend any time on the graphics device\
    \ section. Select no graphics chipset or select any of them—it doesn't matter\
    \ because the Device and Screen sections of the result XF86 config file will be\
    \ replaced. After the file has been generated, use a text editor such as Emacs\
    \ or to remove all the Device and Screen sections from the file. After the existing\
    \ Device and Screen sections have been removed, append the following framebuffer-friendly\
    \ sections to the end of the file:\n\n```\nSection \"Device\"\nIdentifier\n  \
    \  \"Console Framebuffer\"\nEndSection\n\nSection \"Screen\"\n\"FBdev\"\nDevice\n\
    \    \"Console Framebuffer\"\nMonitor\n    *(monitor identifier)*\nSubsection\
    \ \"Display\"\nModes\n    \"default\"\nEndSubsection\nEndSection\n```\n\nBe sure\
    \ to replace the parameter supplied to the (monitor identifier) with the identifier\
    \ you chose for your monitor if you used xf86config, or with the text Primary\
    \ Monitor if you used XF86Setup to generate the file.\n\nAfter these changes have\
    \ been made, your XFree86 installation should be ready to go, and you can proceed\
    \ to the rest of the chapters in this book!"
