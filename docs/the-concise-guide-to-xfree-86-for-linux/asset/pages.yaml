  md: '# Major UNIX Toolkits


    Several different commercial UNIX toolkits for UNIX have been developed over the
    years, but two of them stand out, largely because of the number of users each
    of them still boasts. As luck would have it that, both are also available to Linux
    users.


    # Motif


    The Open Software Foundation’s Motif library represents a collaboration between
    many UNIX vendors who years ago decided that a consistent UNIX desktop would be
    a good thing. Motif was a large, complex, and capable API that also functioned
    as the backbone for the Common Desktop Environment, or CDE, which today remains
    the reference desktop shipping with most UNIX workstation.


    Unfortunately, Motif is a, though “open,” product, and its commercial nature shows—until
    there was no free implementation of Motif for Linux. Linux users interested in
    writing Motif applications had to purchase costly Motif development environments
    and statically link the applications for distribution. A free Motif implementation
    as LessIf is now available, but in the meantime, Motif has failed to catch on
    with the fastest growing segment of the UNIX-like population: Linux users.


    Several large applications for Linux, notably the commercial ones, the Motif library
    as their basis. Among these are Netscape’s Navigator and Communicator and Corel’s
    Perfect for Linux (Figure 5.5). Table 5.9 lists some general information about
    the Motif widgets, and Table 5.10 lists some of the peculiarities.


    ![](img/edb2a4591eafaad74c22be9075f4b815_149_0.png)


    Figure 5.5 Corel’s WordPerfect 8 for Linux is based on the classic Motif library,
    a mainstay in the UNIX world.'
  merge: -1
  pgno: 149
- img_proc: true
  md: '# Table 5.9 General Information About Motif Applications


    | Attribute | Details |

    | Appearance | Most applications have thick widgets with hard (unrounded) corners.
    Motif applications tend to be very consistent and professional, the choice of
    most commercial developers, but many still regard them as ugly widgets. |

    | Examples | Core''s WordPerfect for Linux, Netscape Navigator and Communicator.
    |

    | Resources | Dynamically linked Motif applications are relatively memory and
    CPU-friendly. Unfortunately, most Motif applications are statically linked, increasing
    memory requirements when multiple Motif applications are run simultaneously.|


    # Table 5.10 Motif Peculiarities


    | Item | Peculiarity |

    | Check box | Motif check boxes can be difficult to use because they simply appear
    pushed in checked or pushed out when not, forcing the user to rely on simple lighting
    clues to determine the check box''s status. If doubt, operate the box a few times
    to determine its status. Remember, in checked, out for unchecked. |

    | Cursor | In some versions of Motif for Linux, the cursor can become stuck and
    refuse further keyboard input. The most common solution is to click the mouse
    inside the border of another application''s window, and then return to the problem
    application. |

    | Shared Library | A recent event in the Linux community is the emergence of a
    free Motif clone called LessTif, which can be found at http://www.lesstif.org.
    In order to maximize memory performance, users might want to try using the shared
    LessTif library along with dynamically linked Motif applications when available.|


    Because most Motif applications are statically linked, there is no simple technical
    way to prove or disprove that such an application uses Motif. In most cases, it
    must be visually identified.


    It looks as though Motif''s time in the Linux community is running short, ironically
    just as the free LessTif finally comes of age. Corel has indicated that it is
    shifting its development efforts to the Wine API for Linux, which emulates the
    Windows API, and Netscape''s next-generation Mozilla browser project has stopped
    using Motif as well.'
  merge: -1
