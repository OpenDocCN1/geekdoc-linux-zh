    # Keyboard Mapping: Radical Reconfiguration


    For those who must make radical changes to their X keyboard layout, a complete
    keyboard

    remapping can be done before X is started using the XF86Config file described
    in Chapter 2.

    The relevant section of the file starts with this text:


    "Keyboard"


    Most of the settings in the XF86Config file were discussed in Chapter 2, but the
    settings that

    are related to keyboard mapping were postponed until now because they are quite
    involved.


    Keyboard mapping refers to the process by which the X Window System and XFree8
    trans-late bit patterns generated by keypresses into meaningful actions. In the
    effect, the,

    eronic action of each keypress is mapped to a logical XFree86 concept, like a
    newline or

    backspace or tab action.


    It would, of course, extremely painful to use xmodmap to map each key, num-ber
    function, for an entire keyboard of over 100 keys. Because of this, XFree86 ships
    with

    several predefined keyboard mappings that are general enough to be useful across
    a wide vari-ety of platforms and languages. Unfortunately, these prebuilt keyboard
    mappings are difficult

    to manage by unless you absolutely need to change your X server''s default keyboard

    mappings, avoiding attempting to do so the default settings are more adequate
    for

    the majority of Linux users.


    In the directory lib/X11/xkxb off the XFree86 tree are the files related to the
    predefined\keyboard mappings. Several important subdirectories are located within
    the lib/X11/xkxb de-t, of which contains files to perform a specific function.
    Instructing X to use a partic-lar keymap requires some understanding of the formats
    of the files in these directories, the

    urposes, and the ways in which they are referenced.


    # The keycodes/ Subdirectory


    Without the letters and numbers painted on them, all keys look the same. This
    seems like a

    silly and obvious statement, until one realizes that to a computer, which cannot
    actually see

    y any of the painted symbols, the statement is very true. To a computer, each
    keypress is repre-sent by a series of bits that in turn represent a number keycode.

    Unfortunately, these keycodes bear little resemblance to the key concepts humans
    are used to,

    such as the letters of the alphabet or Tab or Enter functionality—they are simply
    numbers-presenting the circuit that is bound to each key on a keyboard.'
