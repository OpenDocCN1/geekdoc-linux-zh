    If you find at some point that your application window has simply disappeared
    or that multiple application windows have done so, leaving you with a completely
    empty desktop, chances that you have misplaced your application on another virtual
    desktop in the first case. It could also be that you have accidentally switched
    to another virtual desktop in the second if your window manager supports such
    functionality.


    If you decide that virtual desktops aren''t for you, don''t despair: They can
    generally be disabled by changing the window manager''s configuration. Please
    refer to Chapter 9 for details on how to work with your window manager''s configuration.


    # Leaving X


    In many XFree86 desktops that were installed as part of a Linux operating system,
    the process of leaving X is quite intuitive, accomplished with an Exit or Logout
    button somewhere on the display or in a menu. For those that have button available
    at this point, leaving X is easy.


    Users of the official XFree86 distribution who are using the as-shipped tw desktop
    might be a little mystified, however, when they select the Exit option from the
    root menu only to leave them sitting at an undecor login window with no window
    manager control or decoration whatsoever (see Figure 3.7). There are two ways
    to exit X in the standard distribution.


    The first way is to exit the controlling login window, either by typing the exit
    command, using the `kill` command on the `xterm` process that represents the login
    window, or by using the Destroy or Delete operations from the root menu on the
    login window.


    The second way is to use the Ctrl+Alt+Backspace emergency exit to leave the X
    server. The preferred method is the former, for obvious reasons.


    The logic behind this configuration (that is, exiting window manager doesn''t
    exit X) confuses many users, and indeed, it is the logic of an old UNIX hacker,
    not the logic of a desktop user. For who want to be able to change this behavior
    or who want to understand more about the controlling process of an X session,
    these topics are covered in more detail in Chapter 6. For the moment, however,
    the default behavior should be adequate for basic XFree86 use.'
