    # Mouse, Screen, and Non-Keymap Keyboard Configuration


    Keyboard mapping is important, but other aspects of an X environment contribute
    to or detract from the overall experience. The two commands used most to make
    changes to the X environment xset and our friend xmodmap, which, as we are about
    to see, performs at least one important function beyond keyboard mapping.


    # The Other Use for xmodmap


    For the left-handed user, the default Free86 mouse button configuration is backward—clicks
    by the index finger result in the 2nd or 3rd mouse button being pressed, while
    a primary event is generated by the ring finger. This is clearly an uncomfortable
    situation, and the xmodmap provides a way for lefties to fix it.


    The pointer expression in xmodmap allows buttons to be reordered simply by supplying
    a list of mouse buttons in relative positions. For example, to reverse the default
    button mappings for left-handed users, causing the right-most button to be button
    1 and the left-most button to be 2 (for three-mouse button) button 3 the following
    command is:


    ```

    xmodmap -e ''pointer=3 2 1''

    ```


    The number 3, representing the third physical button, is in the first position,
    making it the first logical button. The opposite holds true for the number 1,
    which was given last.


    A similar trick can be used by users with scrolling mice that use buttons 4 and
    5 to indicate scroll events. To reverse the direction of the scroll wheel, the
    following command could be:


    ```

    xmodmap -e ''pointer=1 2 3 5 4''

    ```


    For the lefty with a scroll wheel, the following would generate a left-handed
    mouse with an inverted scroll sensitivity:'
