- img_proc: true
  md: '# Saving XF86Setup Configuration


    After you''ve gone through each of the six configuration sections and you''re
    ready to write the configuration to disk, click the Done button at the bottom
    of the display. The screen shown in Figure 2.9 appears, instructing you to click
    the Okay button if you''re really done.


    ![](img/edb2a4591eafaad74c22be9075f4b815_57_0.png)


    Figure 2.9 After you''ve clicked Done, click the Okay button to finish XF86Setup
    or one of the sections across the top to keep configuring.


    If you need to go back and make further changes before you''re finished, click
    any of the six configuration section buttons across the top of the screen. If
    you are really finished, click the Okay button, and XFree86 will attempt to start
    the X server with the configuration options you specified. If all goes well, the
    server will start and you''ll be presented with a Congratulations screen and three
    choices: Save the configuration as-is, run xvtune, or abort.


    If the display looks good to you and is properly centered, save the configuration
    as-is. If the image is off-center, too short, too tall, too narrow, or too wide,
    choose to run xvtune.


    # Using xvtune


    After starting xvtune, a rather ugly window will pop up giving a warning about
    improper use of xvtune. This warning is absolutely correct and should be heeded.
    If you incorrectly specify your monitor''s capabilities in the XF86Setup monitor,
    you''d better press Ctrl+Alt+Backspace and start the configuration over again;
    using xvtune in such circumstances can definitely blow your monitor, though such
    occurrences are rare.


    If you''re confident you selected the correct monitor for you in XF86Setup, click
    the button labeled OK to remove the warning and continue with xvtune, as shown
    in Figure 2.10.'
