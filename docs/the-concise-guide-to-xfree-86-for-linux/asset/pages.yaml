- img_proc: true
  md: '# Configuring with XF86Setup


    The preferred configuration tool for configuring XFree86 that should be used whenever
    possible is called XF86Setup. XF86Setup is a graphical configuration tool that
    will try to autodetect your mouse and allow you to adjust the display size and
    position for your monitor. To start XF86Setup, give its absolute path on a command
    line:


    ```

    /usr/X116/bin/XF86Setup

    ```


    If you type the command at time and the system responds by saying that it isn''t
    installed, please get by and install XF86Setup.tgz or another of the XF86Setup
    packages listed in Chapter 1.


    # Use Existing XF86Config File for Defaults


    If you are upgrading from an existing installation of XFree86, you will be asked
    whether you want to use existing XF86Config file for defaults. If you choose,
    XF86Setup will load the information in your existing configuration file and use
    those values as the defaults.


    # Switching to Graphics Mode


    XF86Setup will notify you that it is going to attempt to switch to graphics mode.
    After you press Enter, XF86Setup will try to switch the 16-color VGA X server
    (XF86_VGA16) in order to display graphically.


    This process normally proceeds without errors. It should take between 5 and 30
    seconds to switch to graphics mode, depending on the speed of your hardware, the
    amount of memory present, and the number of other processes currently running
    on the system in question. If such a period of time you see nothing, or if you
    encounter an error of some sort while switching to graphics mode, you might want
    to kill all processes or reboot into single-user mode and try to launch XF86Setup
    again.


    If you are still unable to successfully launch XF86Setup, your only remaining
    option for automated configuration is the xf6config program discussed in the next
    section.


    # Navigating Inside XF86Setup


    After XF86Setup has successfully started, the title screen shown in Figure 2.1
    will be displayed. Most users at this point will find that their mouse or pointing
    device has been automatically enabled, and that they can move the pointer and
    navigate without problems.'
  merge: -1
  pgno: 47
