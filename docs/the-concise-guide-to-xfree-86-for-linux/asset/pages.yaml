  md: '# 84 Chapter 3 Launching XFree86


    should return the process number of the window manager that is currently controlling
    the X desktop. In various Linux distributions'' default X desktop, you might check
    for fwwm, fwm2, kwm, or any number of other common window manager names. The XFree86
    default window manager is an older window manager that is distributed with the
    XOrg X11R6 distribution. It is fast and still preferred by many hardcore UNIX
    users. It comes at times, however, be less friendly.


    The visual evidence that you''ll see of the window manager''s presence is the
    title bar across the tops (or, for some managers, the sides) of active windows.
    On the default XFree86 desktop, the xterm windows are decorated by the window
    manager with a sea-green title bar that contains the word xterm along with a couple
    of buttons (refer to Figure 3.2). On the left is a small square button with a
    circle in it. This is the minimize button. On the right is a small square button
    with right angles in it. This is the resize button.


    It is the window manager''s job to decorate windows with such a border, title
    bar, and buttons that are linked to functions. The functions linked to these buttons
    are such functions as window resizing, maximizing, killing, or minimizing—all
    necessary functions for a friendly desktop. It is the window manager''s job to
    "listen" to these events and then cause such events to actually occur.


    For example, a given X application might request that a window be created in a
    graph that can be displayed. The window manager responds by creating a set of
    decorations for the window, including a title, in this case something like "Graph,"
    a border, and a button in the upper-right corner that can resize the window.


    If the user clicks the resize button created by the window manager the window
    manager will interact with the user, for example by drawing a "rubber band" as
    the mouse moves to indicate the updated size of the window. When the user selects
    a new size, usually releasing the button, the window manager sends a request to
    the application indicating that the window''s size has changed. And the window
    manager responds by redrawing its content to fit the window''s new size, and the
    window manager updates the title bar and border to match.


    Window managers commonly create a few of their own windows as response to user
    events, most commonly in the form of menus that are displayed when a user clicks
    an area of the root or another window or decoration. For example, in the default
    twim manager using the default configuration, right-clicking any of the root will
    cause twim to display a window containing several options from which you can select
    (see Figure 3.3).


    Window managers also typically provide a means by which to "launch" certain X
    clients without having to explicitly run their binaries on the command line. Sometimes,
    such launch mechanisms are provided as menus, just as the menu in the default
    twm configuration when the mouse is right-clicked in the root window. Other window
    managers provide more explicit launching functionality, such as the dock in the
    popular Window Maker window manager.'
