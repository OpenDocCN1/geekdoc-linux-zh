  md: '# Chapter 5 Linux/X Toolkit Particulars


    Most Linux users will have little or no trouble identifying an OpenLook/XView
    application without ever having to issue a command or perform a technical check.
    Still, for those what want to identify an Xview application, ldd is again in most
    cases the ideal command:


    ```

    $ ldd /usr/openwin/bin/textedit

    libxview.so.3 => /usr/openwin/lib/libxview.so.3 (0x4000a000)

    libcolq.so.3 => /usr/openwin/lib/libcolq.so.3 (0x0041d000)

    libext.so.6 => /usr/X11R/lib/libext.so.6 (0x04129000)

    libX11.so.6 => /usr/X11R/lib/libX11.so.6 (0x04134000)

    libc.so.5 => /lib/libc.so.5 (0x004d0000)

    ```


    Many Linux users have Xview installed and don''t even realize it. If you find
    a /usr/openwin directory on your disk, try this from a text console:


    ```

    $ /usr/openwin/bin/openwin

    ```


    When present, the openwin script works like the startx script in as much as it
    starts the X server and loads a few applications; but unlike the startx script,
    the openwin script will lead you to an OpenWindows desktop.


    Little or no OpenLook/XView development occurs anymore; the Xview library is all
    but abandoned for new development, in large part the library itself has experienced
    little or no development for the better part of a decade. Still, OpenLook/XView
    applications exist to keep the faithful computing for some time to come.


    The best archive for the OpenLook/XView libraries, desktop, and related applications
    can be found on the Internet at http://step.polymtl.ca/-coyote/xview_main.html.'
  merge: -1
