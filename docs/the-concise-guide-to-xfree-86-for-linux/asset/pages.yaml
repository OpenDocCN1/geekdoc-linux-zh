    # xclipboard


    The xclipboard client enables the user to display, manipulate, and use text selections
    that have been sent to the X clipboard by well-behaved X applications. Not all
    applications are wellbehaved, and thus, not all selected, or copied text will
    appear in the xclipboard. The most common command-line arguments accepted by xclipboard
    are shown in Table 4.5.


    ### Table 4.5 Most Common Arguments Accepted by xclipboard

    | Argument | Description |

    | --- | --- |

    | -w | Causes text displayed by xclipboard to automatically wrap or fill instead
    of extending past the edge of the visible window. |

    | -nw | Doesn''t wrap lines that cannot be displayed in the width of the xclipboard
    window. This is the default behavior. |


    After a text item appears in the clipboard, it remains until it is manually deleted
    using the xclipboard utility. To browse the current clipboard entries, use the
    Next and Prev buttons at the upper right of the window. The number displayed indicates
    the number of the current clipboard entry in the queue. A new clipboard entry
    can be placed at the end of the queue by clicking New and then typing into the
    text widget. The text of a given clipboard entry can be saved to a file with the
    Save button.


    To exit xclipboard, select the Quit button in the upper left of the window.


    # xclock and oclock


    The xclock utility creates a graphical clock in a window that displays the current
    system time. The clock can be resized and will be set for either digital or analog
    operation. The most common command-line arguments accepted by xclock are shown
    in Table 4.6.


    ### Table 4.6 Most Common Arguments Accepted by xclock

    | Argument | Description |

    | --- | --- |

    | -analog | Specifies that xclock should display a simulated analog clock, with
    hands and a face to indicate time. This is the default behavior. |

    | -digital | Specifies that xclock should display the time digitally rather than
    with a simulated clock face. |

    | -chime | Specifies that xclock to chime audibly, once on the half hour, twice
    on the hour. |'
