    Lines 4–7 of the file specify two pairs of files that are used to hold further
    default behavior. The first two files listed in the user''s home directory if
    they are to be used are the widget resources and keyboard mapping files. The two
    files correspond to the same functions respectively—that is, widget resources
    and keyboard mapping—but they are global defaults, which will be used for everyone,
    regardless of a user''s options.


    Lines 11–25 of the file check for the existence of each file specified in lines
    4–7. If the file in question exists, the defaults contained therein will be used
    in starting and configuring the X Session. The xr command is used to merge data
    into the X resource database. More information on using xrdb and X resources can
    be found in Chapter 8, "Runtime Application Configuration." The setroot command
    is used to alter default keyboard mapping. More information on managing keyboard
    settings can be found in Chapter 7, "Runtime Server Configuration"


    Line 29 starts a window manager to manage the session. The manager called by default
    is twm, a lightweight, fast window manager that draws entirely in line (no three-dimensional
    effects) and uses few colors. It is nevertheless a handsome window manager and
    many users prefer it to this day. Note means that twm is started in the background—that
    is, with an ampersand (&) after it. This means that when twm is launched, the
    script continues to execute, and doesn''t depend on twm for its completion.


    Lines 30–32 start several background X clients. First, an xclock is started, followed
    by two independent xterm clients. The -geometry argument supplied to the clients
    in lines 29–33 modifies one of the Athena widget resources in order to specify
    the location on the display at which the windows should appear and the size of
    each window. For more information on configuring the Athena widget resources,
    including the -geometry option, please refer to Chapter 8.'
