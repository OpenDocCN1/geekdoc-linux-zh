  md: '# The fwwm Window Manager 203


    # Keyword | Description


    MWM Menus


    Uses the Motif-style menu appearance rather than the default fwwm style.


    WindowFont XLFD


    Specifies that the named font should be used as the text font in window title
    bars.


    XORValue n


    Changes the logical exclusive OR value for rubber-band operations. In practice
    this number be tweaked until the window outline drawn to represent a window during
    resize and move operations is easily visible.


    Many users spend a great deal of time configuring the colors and fonts fwwm uses.
    The keywords in Table 9.2 are simple to use—for example, the following options
    made window borders appear with a reddish background and white text:


    ```

    HiColor: white

    HiBackColor: #ea1600

