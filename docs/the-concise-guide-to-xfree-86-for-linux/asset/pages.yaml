  md: '# The Device Section


    The Device section is where all the graphics hardware on your video card gets
    configured. There can be multiple Device sections in the XF86Config file, each
    referring to a different adapter, but only one will be used on any given run because
    there is currently no support for multihead display in XFree86.


    Because the graphics hardware is the most easily detected aspect of an X console,
    many of the options in the Device section are used, only when autodetect fails.
    It is generally a good idea to specify explicitly as many options as you must
    get X to operate properly and to allow the rest of the settings to be autodetected.


    Many of the Device section options listed in Table 2.19 are also chipset- or server-specific,
    so please check the README or manual page for the related server or chipset to
    see if a given option is supported in your case.


    | Table 2.19 Valid Device Section Options |

    | Option | Parameters | Description |

    | :--- | :--- | :--- |

    | Identifier | text | The text string by which this video card will be identified
    throughout the rest of the XF86Config file. This text can be anything you like,
    but it must be reproduced exactly in the Screen section of the file when referring
    to this video card. |

    | VendorName | text | The name of the vendor who assembled or sold this video
    card. This text is for your benefit only and can be anything you like. |

    | ModelName | text | The name of the particular model of this video card. This
    text is for your benefit only and can be anything you like. |

    | Chipset | text | Use this option to explicitly specify the graphics chipset
    this video card uses. A complete list of supported chipsets in XFree86 and the
    related servers can be found in Appendix B, "XFree86 3.3.5 Details." |

    | Ramdac | text | Use this option to explicitly specify the ramdac that this video
    card uses. For a list of ramdac supported by your chipset, please see the chipset
    README in /usr/X11/lib/X11/doc or the manual page for your X server. |

    | DacSpeed | num | Use this option to explicitly specify the ramdac, in megahertz.
    |'
