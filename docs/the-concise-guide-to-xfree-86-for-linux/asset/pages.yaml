    # Common XFree86 Video Timings


    It is strongly recommended that users have their XFree86 files generated automatically,
    using the XFree86Setup and xfree8config commands. For those who must build this
    file by, XFree86 video timings listed in Tables 1 through B.7 match those generated
    by xfree8config and represent the bulk of existing monitor capabilities. These
    timings should be used with the ModelLine keyword in the XFree86config file.


    The first column in each table represents the refresh and horizontal scan rates
    in Hertz and Kilertz, respectively, for the mode. The remainder of each line are
    the actual values which make the mode. Modes which have a plus sign (+) in the
    final column have +hsync appended to the end of the mode. Modes which have a minus
    sign (-) in the final column should have -hync appended to the end of the mode.


    Use extreme caution when trying any of these modes: incorrect use of video timings
    can severely damage otherwise healthy monitors.'
