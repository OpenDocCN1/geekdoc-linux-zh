    # Mouse/Keyboard Bindings and Functions


    The method for binding mouse clicks and keyboard events to actions in twm is somewhat
    different from the method used by fwm or fwm 2, although the basic premise is
    still the same. The list of mouse or keyboard events is bound to one or several
    functions that are then executed each time the mouse or keyboard event occurs.


    # Mouse Event Bindings


    The general format for binding functions to mouse clicks in twm is as follows:


    ```

    ButtonN = modifiers : contexts : function

    ButtonN = modifiers : contexts : function

    ```


    The mouse button N is a number from 1 to 5 representing the logical mouse button
    but is known to the X server. The list of valid modifiers is shown in Table 9.26.
    The list of valid contexts is shown in Table 9.27.


    Table 9.26 Modifiers for Mouse Bindings

    | Modifier | Description |

    | shift | Normally indicates that one or both of the Shift keys are being held
    down. |

    | control | Normally indicates that one or both of the Ctrl keys are being held
    down. |

    | lock | Normally indicates that the keyboard Caps Lock is activated. |

    | meta | Normally indicates that one or both of the Alt keys are being held down.
    |

    | mod1-mod5 | Indicates that one of the X modifier maps, 1–5, is active. |


    If the click event to be bound does not involve the use of a modifier, simply
    omit any from the mouse binding.'
