  md: 'Fonts and Colors


    161


    # # X Color Management


    Virtually all computer systems today are capable of displaying graphics images
    in fully color. The days of black-and-white monochrome displays are long past.
    Unfortunately, display-ing colors and images on a computer isn''t a simple task:
    clearly, there are an infinite number of colors in reality. Because of this, computer
    displays are always imperfect in their capability to reproduce the brilliance
    of real images; one responsibility of a graphical user interface such as XFree6
    is to manage a computer''s virtual hardware in an attempt to allow multiple appli-cations
    to display colors and images with the best possible quality.


    There are basic concepts to understand in X color management. They are the visual,
    or the way that color is represented and behaves in the computer''s hardware,
    and the colorspace, a way of creating some sort of logical order for the infinite
    number of colors in reality.


    # ## PseudoColor and TrueColor (Choosing a Visual Class)


    Although many different visual classes are available to XFree86 users


    The PseudoColor visual is named because it represents not all, but only a small,
    subset of the colors that are actually visible to the human eye. PseudoColor visuals
    are found at a time from a much larger set of colors (anywhere from 256,000 to
    16.7 million). PseudoColor hardware, each pixel on a screen is represented by
    one byte (8 bits) of information in memory. The 8 bits available to each pixel
    are enough to specify a number for color from 0–255 (a total of 256 colors). This
    number maintained for each pixel refers to a slot in a 256-slot color map. Each
    slot in this map contains one of the colors from the much larger colors is capable
    of displaying. When the color contained in one of these slots is changed, all
    the pixels on the display take their color from that slot as well. Some applications
    take advantage of this property to create impressions of anima or swirling colors,
    a technique often called palette-switching or palette-coloring. Older VGA hardware
    (such as 512k or 1MB MSA VGA cards) fall into this category.


    TrueColor visuals, on the other hand, do not maintain a slot map of onscreen colors,
    chosen from a much larger set of potential colors. Instead TrueColor visuals for
    a large, fixed set of colors to be onscreen all at the same time. 15-bit TrueColor
    displays represent each pixel on the screen with 15 bits of memory data, enough
    to count 0–32,767, or enough to speci-ify one of nearly 33,000 colors for each
    pixel, far more colors than the 256 that can be displayed at once on an 8-bit
    PseudoColor display. The 16 bits used for each pixel on some displays are enough
    to allow a pixel to display a total of nearly 66,000. 24-bit TrueColor visuals
    allow for up to 16.7 million colors onscreen at once, and a 32-bit TrueColor visual
    theoretically contains enough information to allow for over 4 billion colors to
    be displayed onscreen at once, though most current video hardware doesn''t exploit
    such potential.


    ![](img/edb2a4591eafaad74c22be9075f4b815_176_0.png)'
  merge: -1
