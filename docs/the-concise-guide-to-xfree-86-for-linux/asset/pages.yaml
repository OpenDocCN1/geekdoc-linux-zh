- img_proc: true
  md: '# Changing the Resource Name


    One argument that is normally not issued as a resource string is the -name argument,
    which allows an application instance to obtain its resources under another name.
    For example, you could call the xterm command and assign it the name MyTerm like
    this:


    ```

    xterm -name MyTerm

    ```


    This command would launch an xterm that would obtain its resource configuration
    from strings that refer to MyTerm, such as these:


    +   - MyTerm*foreground: blue

    - MyTerm*background: black

    - MyTerm*title: This is my terminal!


    This argument can be useful when using the -e option of xterm to call xterm mainly
    as a container for text-based applications such as pine, lynx, and elm. Using
    the -name argument, resources could be supplied to each of these applications
    its own appearance, font, and window size, even though they run inside an xterm
    window and aren''t normally X-based applications.


    This argument also has the side effect with certain window managers (Window Maker)
    of creating a new app-icon separate from the original instance of the application.


    # The -xrm Argument


    One final command-line argument deserves mention in our discussion of X application
    resources and the resource database. Until now, we''ve set all resources other
    than the core resources from inside a resource file, which had to be merged into
    the resource database by hand or read at the start of the X session.


    The command-line arguments we learned were suited only to the core set of properties
    of the Xt and Athena widgets. It is possible, however, to set any resource on
    the command-line using the -xrm argument. It is very simple to use:


    ```

    xterm -app xterm string -xrm string ...

    ```


    In this example, foreground refers to an X resource string of the type we''ve
    been using all along. Thus, the following three methods for altering the foreground
    color of an application''s text all have an identical effect:


    ```

    xterm*foreground: black

    xterm -fg black

    xterm -xrm ''xterm*foreground: black''

    ```'
  merge: -1
  pgno: 208
- img_proc: true
  md: 'Note that the first item is meant to be included in a resource file that is
    then merged into the resource database, whereas the other two items are ways of
    launching xterm with those changes already in place. Note also that strings supplied
    to the -xrm argument should always be escaped to avoid confusion resulting from
    wildcard characters and unescaped spaces in the resource string.


    The xrm command doesn''t find a great deal of real-world use, being superseded
    most of the time by editres, xrdb, the $HOME/.defaults file, and the command-line
    arguments that correspond to the core properties. On the other hand, it can at
    times be useful, especially for playing with resources in a quick and dirty way,
    without having to launch a messy editres window and use a mouse or other pointing
    device to navigate.'
