  md: 'Aron Hsiao is a computing entrepreneur and freelance network consultant with
    a background in UNIX-like operating systems stretching back to the mid-1980s.
    He has spent time as both an independent contractor and a proprietor working in
    computer hardware and software retail, real-time software development, network
    deployment, and Internet marketing. He has also worked as a volunteer in a number
    of different computing-related and educational capacities in his local area. Aron
    has collaborated in the past with Que Sams Publishing on a number of Linux and
    UNIX-oriented texts as a technical editor. He has served as the About.com guide
    to Linux since 1997.


    # The Concise Guide to


    # XFREE86

    FOR LINUX


    Uncommon Solutions for the Technical Professional


    The Concise Guide to XFree86 for Linux gives the reader an in-depth look at the
    inner workings of the most popular X server for Linux.


    XFree86 is comprised of many different and difficult-to-understand configuration
    files. This book will tell you what you need to know to troubleshoot and successfully
    tailor the configuration files to meet your needs.


    By giving IT professionals and advanced users the expert-level information they
    need to understand, configure, and administer XFree86, The Concise Guide to XFree86
    for Linux will be the book the experts rely on for their information.


    Some of the topics covered in the book are:


    +   - Runtime server configuration


    +   - Tunneling through ssh


    +   - Runtime environment configuration


    +   - Widget hierarchies


    +   - Maintaining the X resource database


    +   - Installing and configuring the X Window System for Linux from scratch


    +   - Controlling access to your X servers on a per-user basis


