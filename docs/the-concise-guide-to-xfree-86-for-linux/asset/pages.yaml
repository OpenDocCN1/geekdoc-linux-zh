  md: 'Interacting with X


    91


    If you installed XFree86 as of Linux, your window manager''s root menu might be
    different, or in some cases, might be absent altogether. Several XFree86 configurations,
    most notably those of some Red Hat operating systems, use an FVWM variant as the
