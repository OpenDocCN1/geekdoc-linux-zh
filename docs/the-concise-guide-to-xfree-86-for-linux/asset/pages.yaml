  md: '# Chapter 6 Runtime Session Defaults


    Finally, line 33 launches another xterm client. This command is a special one,
    however, because it is the controlling process for the X session. Notice two things
    about the structure of the command. First, exec is used to launch xterm. The exec
    command causes a shell, such as the one executing the script, to chain to the
    new process rather than to it. In plain terms, this means that the shell will
    exit, launching the new command instead of itself, rather than as a foreground
    or background process with respect to itself. Next, notice that this final xterm
    command isn''t called in the foreground with the ampersand (&) but in the foreground,
    thus effectively halting processing of the script until it exits. The net effect
    of these details is that when the xterm command in line 33 exits, the entire script
    exits, closing the X session and all clients. The xterm command in line 33 is
    the controlling process of the X session.


    Many users choose to launch the window manager as the controlling process for
    a session, starting it on the last line of the script in the foreground and earlier
    clients in the background, so that when the window manager exits, the session
    also exits. To change one session user''s default script must generally be changed
    to reflect the new session. Defaults are covered later in this chapter.


    # Other Global Default Files


    One or two global default files can have an effect when running startx to start
    the X session from the console. The two have already been mentioned—the .Xmap
    and .xdefaults files located in the /usr/X11/lib/X1/init/ directory. These files
    are used by the system administrator to create sitewide or networked default keyboard
    mapping and application widget resource settings. User-specific settings go in
    the related files in the user''s home directory.


    Also of importance is the global twm configuration file. Most window managers
    will keep a default configuration somewhere in the /usr/X11/lib/X1/ directory.
    The default configuration for the twm window manager is stored at /usr/X11/lib/X1/sys/.twrc
    and should be managed by the system administrator if necessary to reflect sitewide
    or networked default settings for the X desktop. Again, the user can implement
    his or her own twm configuration by creating a file named .twrc in his or her
    home directory. Details on configuring can be found in Chapter 9, "Runtime Environment
    Configuration."


    Another widely used file that can nonetheless be useless, especially in network
    settings with multiple login points, is the /usr/X11/lib/X1/init/xerverrc file.
    This file is used to launch the X server when present; it should be a shell script
    that contains code to check for platform and operating system information and
    then to start the X server with the proper arguments for the given environment.
    For a detailed look at multiplatform and networked, see Chapter 17, "Heterogeneous
    Networks." Note that if no xserverrc file is present (as is normally the case),
    the X server will simply be called using the X binary, or in later XFree86 releases,
    the Xwrapper binary.'
  merge: -1
  pgno: 159
- img_proc: true
  md: '# Changing Global Default Files


    The global default files discussed in the /usr/X11R6/lib/X11 directory tree are
    very rough and basic indeed. They can easily be changed to suit different needs,
    and should be by system administrators in multiple user situations to create the
    most effective default settings and desktop for their users or for their company.
    Sitewide or network keymaps can be helpful when dealing with the company''s esoteric
    PC buying habits. And it is often necessary to alter both the default list of
    launched clients and the default desktop presented to users, either with a different
    window manager or by editing the window manager''s behavior. In some cases, it
    might even be helpful to edit the script so that the user''s owns are ignored
    by commenting out those sections of the script that load files from the user''s
    home directory.


    On the other hand, single-user (that is, Linux home desktop) installations, it
    is probably easier and more correct to maintain personal session preferences in
    the user''s default files rather than becoming root and editing the global defaults.
    In the home desktop environment, there is no need to spend time getting a sitewide
    or networkwide configuration right; it makes much more sense to edit for your
    personal preferences as per the instructions in the next section.


    # User Defaults


    Global settings are, of course, must be changed by the user whenever appropriate;
    the purpose of global settings is merely to provide for some baseline level and
    method of operation when user preferences have been given.


    The user-specified counterpart to the /usr/X11R6/lib/X11/xinit/xinitrc script
    is the .xinitrc script in the user''s home directory. Note that the global script''s
    name doesn''t start with a period, while the user''s script does, causing the
    file to be hidden in normal directory listings.


    # The startx Process


    When the startx command is called, it first checks to whether an .xserverrc file
    is present in the user''s home directory. This file will be used as a special
    script to start the X server present, but it is normally noted. If no .xserverrc
    file is present in the user''s home directory, and no global can be found in /usr/X11R6/lib/X11/xinit,
    the X server will be started simply by forking to the X binary, or in later XFree86
    releases, the Wrapper binary.


    After the server has launched, startx will look for a file in the user''s home
    directory called .xinitrc. If this file does not exist, startx will resort to
    the global default session script at /usr/X11R6/lib/X11/xinit/xinitrc. If .xinitrc
    script exists in the user''s home directory and is executable, it will be called
    instead, and the global script will be used.'
  merge: -1
  pgno: 160
- img_proc: true
  md: '# 146 Chapter 6 Runtime Session Defaults


    Because most users still want the .xmodmap and .xdefaults files searched and used,
    both on a global and on a user level, the most common way to construct a personal
    .xinitrc script is to copy it to one''s home directory from the global script,
    and then edit the last few lines (which calls the clients, the window manager,
    and the controlling process) by hand:


    ```

    $ cp /usr/X11R/lib/X11/xinit ${HOME}/.xinitrc

    $ vi .xinitrc

    ```


    # Important Differences


    It is important to understand that the user''s ${HOME}/.xinitrc ${HOME}/.xserver
    files will be used instead of the global defaults for these files in /usr/X11R/lib/X11/xinit,
    while the ${HOME}/.xmodmap and .xdefaults files will be used in addition to the
    global defaults for these files in the same directory. It is also important to
    note that all four files appear in the user''s home directory with the dot as
    their first character: .xserverrc, .xinitrc, .xmodmap, .xdefaults; in contrast,
    only the .xmodmap and .xdefaults files retain the dot in the global directory—the
    other two files appear as xserverrc and xinitrc (no dot) in the global directory.'
