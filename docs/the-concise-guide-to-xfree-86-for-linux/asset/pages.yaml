  md: '# Interacting with X


    # 93


    ![](img/edb2a4591eafaad74c22be9075f4b815_108_0.png)


    **Figure 3.5** The window on the left has focus; the window on the right doesn''t.
    Note that the title bar of the focused window is highlighted and that the window
    contains the mouse pointer.


    When using a sloppy-focus policy, focus behaves as much as it does under the focus-follows-mouse
    policy with one important exception: If no window (other than the root window)
    currently contains the mouse pointer, focus will remain with whichever window
    last held the mouse pointer. This focus mode is now commonly used by most focus-follows-mouse
    advocates.


    In the default XFree86 desktop (which uses the twm window manager), the focus
    policy is set to focus-follows-mouse.


    Note that, in addition to establishing a focus policy and a mechanism by which
    focus is changed, a window manager will generally also some mechanism by which
    the current focus is indicated. For example, setting a window''s border and title
    to a different color is a common method for indicating that a window has focus.


    # Moving and Raising a Window


    The twm root menu provides an item to aid the user in moving a window, not all
    readers are using the default XFree86 desktop that is so equipped. Furthermore,
    moving a window using the root menu Move item is perhaps not the easiest way to
    accomplish the task.


    By the easiest way to move a window, which is consistent across nearly all possible
    configurations of all X window managers, is the most intuitive way, shared by
    both the Windows and Mac operating systems—by clicking the window''s title bar
    and dragging the window around the desktop.


    Similarly, most standard X window manager configurations, the default XFree86
    twm configuration included, will allow windows to be “raised” simply by clicking
    on the window''s title bar. Although not everyone will find this to be the case,
    for those who do, it definitely make the chapters ahead more bearable to both
    move and raise windows easily.'
