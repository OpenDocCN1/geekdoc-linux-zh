  md: '# Chapter 2 Installing and Configuring XFree86


    The xf86config utility should be called on a text-based console logged in as the
    superuser (in order to be able to write to the systemwide /etc/XF86Config file).
    It is called like this:


    ```

    /usr/X116/bin/xf86config

    ```


    After launching xf86config, you''ll be presented with a screenful of information
    about the utility, telling you what it does and giving a few pointers on what
    you should have ready before proceeding—things like knowing which chipset your
    video adapter uses and how much video memory is installed on it. When you''re
    ready to begin configuration, press the Enter key. If for some reason you think
    you''re not ready to proceed with the configuration, press Ctrl+C to abort and
    try again later.


    # Mouse or Pointer Configuration


    After pressing Enter to proceed with the configuration, you''ll be presented with
    the first question screen asks you to specify the protocol used by your mouse
    with a list like the following:


    +   1. Microsoft compatible (2 button protocol)

    2. Mouse Systems (3 button protocol)

    3. Bus Mouse

    4. PS/2 Mouse

    5. Logitech Mouse (serial, old type, Logitech compatible)

    6. Logitech MouseMan (Microsoft compatible)

    7. MM Series

    8. MM HitTablet

    9. Microsoft IntelliMouse

    10. Aaced tablet


    Specify the protocol you decided upon earlier. Again, for most users of serial
    mice, the Microsoft Compatible option will work. PS/2 mouse users should select
    the corresponding PS/2 option. Other users will need to consider their mouse''s
    documentation.


    After choosing a mouse protocol, many users will be asked whether three-button
    emulation is desired. If your mouse has only two buttons, it is a good idea to
    enable three-button emulation, which will allow you to send the middle button
    click to applications by pressing both buttons at once. Many Linux programs do
    expect a third, middle button.


    The next question asked by xf86config will be the device name of your mouse. Most
    of the time, the answer of /dev/mouse will suffice because your Linux distribution
    will have configured the mouse device for you during install. If you have no such
    device, enter the device node you chose from Table 2.1. If you have no idea what
    kind of port your mouse is connected to, perhaps it''s time to go out and get
    a new, new serial or PS/2 mouse; they are extraordinarily cheap these days.'
