    the framebuffer console support for x86 machines in newer Linux kernels is young
    but relatively stable. A wide variety of recent video hardware is supported for
    PowerPC architectures as well. Table C.1 shows chipsets and cards that are specifically
    supported by the Linux 2.2 kernel and the corresponding configuration variable
    for each on the x86 platform.


    Supported video hardware for other (non-x86) platforms is listed in Table C.2.
    Note that this is not an exhaustive list; many minor chipset variations are also
    supported on multiple platforms.


