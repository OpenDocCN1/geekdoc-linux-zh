  md: '# Chapter 7 Runtime Server Configuration


    The visual most Linux users decide to use when running XFree6 depends on the capabilities
    of their video hardware. Most users whose graphics cards can display at 15, 16,
    24, or 32 bits-pixel choose to do so. For most intents and purposes, the TrueColor
    visual is infinitely superior to the PseudoColor visual. There are, however, some
    caveats. Because a PseudoColor visual uses only 8 bits for each pixel to be displayed,
    it can refresh a screenful of information twice as quickly as a 16-bit display
    on identical hardware, which must move twice as much data to or from memory for
    each pixel. Also, the number of onscreen colors is limited, PseudoColor visuals
    can typically fill the onscreen slots from a much larger palette of 256.00 or
    16.7 million colors, meaning that, paradoxically, a 256-color PseudoColor display
    can often display many colors that a nearly 66,000-color TrueColor display cannot.
    Finally, TrueColor displays don''t allow for the palette-switching technique employed
    by many programs written with PseudoColor displays.


    # Choosing Your Visual Class at X Launch


    The process of choosing a visual class for most users is really the process of
    choosing a color depth (8, 15, 16, 24, or 32 bits per pixel). The XFree86 server
    will normally configure an 8-bit display as a PseudoColor visual and a 15-, 16-,
    24-, or 32-bit display with a TrueColor visual.


    Choosing the display depth, in bits per pixel, can be done out of two ways. Both
    have been before, but it helps to summarize them now. The first is to include
    the DefaultColorDepth keyword in the screen section of the XFree6Config file,
    like this:


    ```

    DefaultColorDepth 24

    ```


    This example will cause X to start in 24-bits-pixel mode, and thus with a TrueColor
    visual by default, the graphics hardware is capable of displaying at that depth
    and relevant Display subsections are included in the XFB6Config file. For more
    information on the XFB6Config file, please refer to Chapter 2.


    The other way to choose the color depth and thus the default visual class is at
    runtime, supplying the -depth option to the server or to the startx command following
    a pair of dashes:


    ```

    startx -depth 24

    ```


    Most users choose to configure for the deepest visual their hardware supports,
    and then choose shallower color depths when necessary when starting XFree86.'
