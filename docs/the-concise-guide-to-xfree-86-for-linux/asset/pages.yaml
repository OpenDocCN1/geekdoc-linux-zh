    to raise. |

    | Lower | Moves a window so that it appears to be underneath all other windows
    in the screen. Other windows that share the same physical space as the lower window
    will partially obscure it. To use, click in the window you''d like to lower. |

    | Focus | Gives a window focus (see the “Focus and Other Window Manager Concepts”
    for details). To use, click in the window you''d like to have focus. |

    | Unfocus | Removes a window''s focus. To use, click in the window you''d like
    to take focus away. |

    | Show Iconmgr | Displays an icon manager to hold minimized window icons. |

    | Hide Iconmgr | Removes the icon manager from view, allowing minimized icons
    to appear anywhere on the desktop. |

    | Kill | Completely kills an X application. Note that you can lose whatever you''re
