- img_proc: true
  md: "# Chapter 9 Runtime Environment Configuration\n\nTable 9.20 Continued\n| Variable\
    \ | Description |\n| --- | --- |\n| UsePosition on|off|non-zero | Specifies that\
    \ twm should honor the positioning requests of X clients (on), ignore such requests\
    \ (off), or honor such requests only if they don't place the new window at pixel\
    \ 0,0 (non-zero). |\n| XorValue n | Changes the logical exclusive OR value for\
    \ rubber-band operations. In practice, this number should be tweaked until the\
    \ window outline drawn to represent a window during resize and move operations\
    \ is easily visible. |\n| Zoom n | Causes twm to display a zoom or zoom down animation\
    \ in n steps whenever a window is minimized or restored. |\n\nNote that several\
    \ of these variables, such as NoTitle/MakeTitle and SqueezeTitle/DontSqueezeTitle,\
    \ are inverse pairs. When using these variables, one of them is generally supplied\
    \ with a window list to specify the default behavior. The inverse is then used\
    \ with a window list to create exceptions, when necessary, to the default.\n\n\
    # Decoration Colors\n\nOne of the first and most important parts of any window\
    \ manager configuration is, the choice of colors used to draw all the window decorations\
    \ and to indicate focus. In twm, the color properties of a running desktop file\
    \ are configured in the one list called Color.\n\nThe list of a twm configuration\
    \ file follows the following basic structure:\n\n```\nColor\n{\nSimpleColorVariable\
    \ \"color\"\nSimpleColorVariable \"color\"\n...\nComplexColorVariable \"color\"\
    \n{\n  \"excepted window\" \"color\"\n  \"excepted window\" \"color\"\n}\nComplexColorVariable\
    \ \"color\"\n{\n  \"excepted window\" \"color\"\n  \"excepted window\" \"color\"\
    \n}\n...\n}\n```"
  merge: -1
  pgno: 247
- img_proc: true
  md: 'Similar configuration can be done using the Monochrome or Grayscale list in
    place of the Color list, but for most Linux users, Color is the first choice,
    for obvious reasons.


    # Simple Color Variables


    The color variables that can appear inside the Color list are entered one per
    line, a variable name followed by a color in quotes, either from the color database
    or specified from the RGB colorspace. The common simple color variables are listed
    in Table 9.21.


    | Table 9.21 Simple Color List Variables |

    | Variable | Description |

    | DefaultBackground | The background color for twm information windows, such as
    the pixel size window when resizing. |

    | DefaultForeground | The foreground color for twm information windows. |

    | MenuBackground | The background color for twm menus. |

    | MenuForeground | The foreground color for twm menus. |

    | TitleBackground | The background color used in displaying twm menu titles. |

    | TitleForeground | The foreground color used in displaying twm menu titles. |

