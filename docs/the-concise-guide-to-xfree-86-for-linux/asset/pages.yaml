  md: '# RUNTIME SERVER

    CONFIGURATION


    A sizable percentage of the XFree86 configuration is accomplished through use
    of the XF86config file documented in Chapter 2, "Installing and Configuring XFree86."
    However, many other configuration changes are normally made after XFree86 is started
    or during the XFree86 launch process in the xinitrc script discussed in the previous
    chapter. Several configuration changes also affect the way the user will interact
    with the X server at runtime, rather than just how the X server will interact
    with the system hardware.


    This chapter is all about those server configuration options that are manipulated
    after the server has been started and those configuration options that affect
    the way the user interacts with the server throughout the course of an X session.


    # Keyboard, Mouse, and Display Configuration


    Several configuration options deal in a basic way with the interaction between
    the user and the keyboard, mouse, and display hardware at an X console. Among
    these are keyboard mapping, screen savers and screen blanking, mouse acceleration,
    and internationalization. Although many users never need to change any of these
    settings from their defaults, it is often necessary to tweak a configuration to
    get it right for your own personal preferences, especially if you are a non-English
    speaker or you are running Linux on non-PC hardware.'
  merge: -1
  pgno: 162
- img_proc: true
  md: '# Keyboard Mapping: Minor Changes or Tweaks


    Usually when users ask about changing key mappings in XFree86, it is because their
    keyboard basically works okay, with one or two exceptions—such as a Backspace
    key that won''t backspace, a Delete key that deletes to the left instead of the
    right, or arrow keys that don''t seem to cause the cursor to move when pressed.
    These sorts of minor problems are easily fixed using two commands, xev and xmap.
    The process is simple, so the detail level in this section is light. For the brave
    of heart, the next section goes into more detail about the way in which keyboard
    mapping works. For this section, however, it''s best to think about keyboard mapping
    like this:


    Each key on a keyboard looks like a number to the computer. XFree86 knows about
    lots of different kinds of keys. If a key isn''t working, it''s because the keyboard
    is sending a different number than X expects for the key in question. Fixing a
    broken key is then the process of telling XFree86 about the correct number for
    a given key.


    # Finding the Right Key with xev


    The best way to find out what number a given key is sending is to use the xev
    command. The xev command is basically a window that sits on the desktop and listens
    for X events like keypress, button clicks, or mouse movement, and prints information
    about this activity on standard output. To start xev, simply supply its name on
    the command line, like this:


    ```

    xev

    ```


    Some distributions don''t install xev by default; it might be part of an X development
    or extra package; if so, you''ll have to install it before you can use it. Once
    started, xev appears simply as a window with a box in it, as shown in Figure 7.1.


    The magic begins to happen when you do anything at all—move the mouse, press a
    key on the keyboard, or click a mouse button. Notice, with each action of any
    key, xev is printing copious amounts of information in the Atoms from which it
    was launched. This information is normally used for diagnostic work when writing
    clients, but for keyboard work, we''re interested in what it prints out when a
    key is pressed. Make sure the xev window has focus, and then press the key that
    is misbehaving. You should see output like this:


    ```

    KeyPress event, serial 21, synthetic NO, window 0x3800001,

    root 0x26, subw 0xf0, time 246521803, (172, 11), root:(194,32),

    state 0x0, keycode 23 (keysym 0xff07, Tab), same_screen YES

    XlookupString gives 1 characters: "

    ```


    ```

    KeyRelease event, serial 21, synthetic NO, window 0x3800001,

    root 0x26, subw 0xf, time 246521907, (172, 11), root:(194,32),

    state 0x0, keycode 23 (keysym 0xff00, Tab), same_screen YES

    XlookupString gives 1 characters: "

    ```'
  merge: -1
