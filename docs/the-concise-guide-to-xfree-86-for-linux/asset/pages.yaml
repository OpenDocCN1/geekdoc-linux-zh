- img_proc: true
  md: '# The Common Desktop Environment (CDE)


    The Common Desktop Environment, which is based on the Motif API used by popular
    Linux applications such as Netscape and WordPerfect, is the only commercial offering
    for seeking an integrated Linux environment. Maintained by The Open Group at http://www.opengroup.org,
    the CDE is a specification originally designed and adopted cooperatively by several
    major UNIX vendors including Digital, Hewlett-Packard, and Sun Microsystems. Because
    of this, many commercial UNIX workstations use the CDE as their standard desktop
    environment.


    Unfortunately for Linux users, no free version of the CDE exists; those wanting
    to use the Common Desktop Environment will have to purchase it. To make matters
    worse, there is currently only one vendor producing a CDE for Linux, though in
    the past as many as three separate vendors produced CDE versions for Linux. As
    a result, pricing has become significantly higher and is out of reach for many
    Linux users.


    TheMaximum/CDE from Xi Graphics is currently the only version of CDE available
    for Linux and is sold directly by Xi Graphics, whose Web site can be found at


    ```

    http://www.xig.com

    ```


    The CDE is available as a standalone product or as a product integrated with a
    complete Linux operating system called Maximum CDE/OS, and ships with the commercial
    Accelerated-X server, also by Xi Graphics, which replaces XFree86. Laptop versions
    are also available.


    The CDE is a large environment, and a great deal of documentation is available
    to help those wanting to use the CDE or to develop for it. Because most XFree86
    users aren''t using the CDE, any discussion of use or configuration is beyond
    the scope of this text; users interested in the CDE should contact Xi Graphics
    directly at its Web site.'
  merge: -1
