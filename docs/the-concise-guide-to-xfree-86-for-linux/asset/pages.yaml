- img_proc: true
  md: '# 40 Chapter 2 Installing and Configuring XFree86


    If you are absolutely unsure about the capabilities of your monitor, just choose
    the Standard VGA option at 640×480. This is a safe choice because in order to
    have launched XF86Setup in the first place, your monitor must support at least
    this mode. Be warned that you should never choose a monitor specification in XF86setup
    that you exceeds the capabilities of your own monitor; doing so could result in
    an early death for the monitor in question!


    # Modeseselection Configuration


    After you have chosen a monitor, you can proceed to the Modeseselection configuration,
    shown in Figure 2.7.


    ![](img/edb2a4591eafaad74c22be9075f4b815_55_0.png)


    **Figure 2.7** The Modeseselection configuration enables you to choose modes for
    XFree86 and a default color depth.


    A list of valid display modes (resolutions) will be listed in the main widget
    in the center of the display. The number of entries in this list will depend on
    the specifications of the monitor you selected. The better the capabilities of
    your monitor, the more modes will be available for you to choose from. To enable
    a mode, click the corresponding button. Click it again to disable it.


    The list of modes you select will all be available to you after you start XFree86,
    and you''ll be able to switch between them on-the-fly while XFree86 is running.


    At the bottom of this screen is a list of supported color depths. Choose the one
    you want to be the default color depth. Beware that some modes might not be available
    in some color depths, if you find that your favorite mode isn''t available when
    you first launch XFree86, it probably means that you''ve selected either too deep
    a default color depth or that your favorite mode is too high-res!'
