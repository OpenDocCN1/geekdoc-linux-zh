  md: '# Chapter 2 Installing and Configuring XFree86


    ```

    `640x480` `800x600` for 24bpp

    `640x480` `800x600` for 32bpp

    ```


    After this list, you''re given the choice to either change the resolutions for
    a given color depth or accept the list as-is and use it. For almost all situations,
    the automatically generated list is correct and should be used.


    If you''re sure that your monitor supports modes that aren''t listed, or that
    your monitor doesn''t support modes that are, you can choose to edit the list
    of modes for each color depth. Otherwise, choose the option, These Modes Are OK,
    to move to the last step of the configuration process.


    # Writing the Configuration


    After finishing with the modes and color depths, you''ll be asked if you want
    to write the configuration to /etc/XF86Config. Normally, you''ll answer y here,
    unless there is an obvious reason why you shouldn''t. Note that if you don''t
    choose to output the configuration to /etc/XF86Config, all the work you''ve just
    done won''t become active as the new configuration.


    If you choose not to write the configuration generated to /etc/XF86Config, you''ll
    be asked successively about writing it to other locations. If you continue to
    choose No, you''ll eventually be asked where you want to write the configuration
    you just generated. Again, understand that if you choose not to write the configuration
    to /etc/XF86Config, it will not become the active configuration until you copy
    the output to that location.


    After you''ve saved the configuration somewhere, you''re finished with xf86config!
    Whew!


    # Configuration Troubleshooting


    The most common problem encountered while trying to use XF86Setup and xf86config
    is the failure of the X server to properly start after the initial configuration.
    There are several possible causes for this problem, but the solution is always
    the same: Start with the configuration program in question and try again, this
    time using different settings. Here are some pointers.


    At times, you might have to try several different similar chipset settings before
    you find the chipset that matches yours properly. For example, the Trident chipsets
    are notorious for being inconsistent in their labeling. Sometimes a TVGA8900 chip
    really only wants to work with the TVGA9000 driver or vice-versa. If you choose
    your settings by video card make and model, this won''t be a problem nearly often.


    Take time to study the README file for your chipset thoroughly. Those little options
    might seem innocuous, but they can mean the difference between a properly functioning
    video card and one that displays nothing at all.'
