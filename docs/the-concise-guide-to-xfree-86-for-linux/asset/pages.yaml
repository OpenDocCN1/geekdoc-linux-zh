- img_proc: true
  md: '# Configuring XFree86


    Now XFree86 is installed on your computer. Unfortunately, if you''re running an
    x86 architecture PC system, XFree86 still doesn''t know enough to do any work
    for you. Before you can use XFree86, you must tell it all about your system. You''ll
    need to provide information about your graphics hardware, what type of mouse you
    have, what resolutions your monitor support, and so on. This information is stored
    in a large, segmented text file that XFree86 reads each time the server starts.
    Luckily, this configuration file can be built automatically by one of two programs
    that will ask you about your hardware, and then output a configuration to match.
    Although it is possible to configure an XFree86 installation entirely by hand
    from within a text editor such as Emacs, most users prefer to use XFree86setup
    or xf86conf.


    XF8setup is the nicer of the two because it uses the 16-color VGA server to operate
    and is therefore point-and-click drive. Most aspects of XFree86 can be easily
    configured using XF86Setup, and because of this, XF86Setup becomes the tool of
    choice for most Linux operating systems, others running automatically at install.


    xf86conf isn''t as visually pleasing or as intuitive to use as XFsetup, but it
    has certain advantages. The most important advantage is that it runs in a text-based
    console, enabling it to work on systems lacking 16-color VGA hardware, which XFree86setup
    won''t support.


    Note that if you''re using a non-PC architecture that takes advantage of the x68fb.tgz
    buffer server and only allows for one kind of mouse device (like, for example,
    a 68K Macintosh machine), some of the information about configuring a wide variety
    of hardware throughout the rest of this chapter might not apply to you. For help
    on configuring such non-PC hardware for XFree86, it is best to visit the homepage
    of your distribution on the Web or to contact the distribution maintainer for
    current instructions and details on whether your particular system''s console
    driver is supported by the server in X68fb.tgz.


    # Learning About Your Hardware


    Before you can supply a configuration program with details about your display
    hardware and input hardware, you must know a thing or two about it yourself. Important
    facts to know about your video card are the chipset it uses, the amount of video
    memory installed, the ramdac and clock chip used, and the name of the card''s
    manufacturer. On newer PCs, much of this information not essential because XFree86
    servers can autodetect some of it and because all these functions are often integrated
    into a single chip, but it''s a good idea to know the details in case they''re
    needed. Important facts to know about your mouse or input device is the protocol
    it uses (usually this will be Microsoft or PS/2, but there are others) and how
    it is physically connected to your system.'
  merge: -1
  pgno: 43
- img_proc: true
  md: 'You''ll also probably want to know about your monitor, especially if it is
    an older monitor. It is actually possible, though very rare, to blow out a monitor
    by configuring it incorrectly for X. Usually, instead of a blowout with a bad
    configuration, you''ll just get an unreadable display. Most of the time, it is
    possible to stick to a few known safe settings, but you will get much more out
    of XFree86 if you have your monitor manually handled.


    # Video Card Detective Work


    Finding out about your video card is sometimes a difficult task because a computer
    system''s video hardware details are often considered over the heads of end users.
    Still, the information is usually there to be found somewhere or other, and the
    three methods can help you ferret it out.


    First, the easiest way to find out about your video adapter or the video hardware
    in your system is to check the spec-sheet that came with it. Most PCs ship with
    a separate video card that plugs into a slot on the motherboard. Often, the manual
    that came with the card, or the box in which the card, will give you information
    such as the amount of video memory installed and the graphics chipset installed.
    Sometimes a ramdac is mentioned. Sometimes this information is enough; other times
    it isn''t.


    The second, but slightly less reliable, way to find out about your video card
    is to use the SuperProbe program to find out. SuperProbe simply probes your graphics
    hardware and dumps what it finds out to display. It sounds convenient, but it
    has several drawbacks. Most importantly, it can lock up your system before it
    prints anything, forcing a reboot. This is because SuperProbe finds out about
    your hardware simply by trying to talk to it. If a piece of hardware that SuperProbe
    isn''t looking for answers, bad things happen, leading to a crash. The problem
    with SuperProbe is that it is often inaccurate, especially on older hardware or
    esoteric hardware that can behave in unexpected ways. Still, SuperProbe is useful
    and accurate 80 percent of the time, so it is an important utility, especially
    for those who don''t want to find out about their hardware using method three.
    To use SuperProbe, call it like this:


    ```

    /usr/X11re/bin/SuperProbe

    ```


    When called like this, SuperProbe will pause for five seconds to give you time
    to abort if you chicken out, and will then proceed to probe your hardware. The
    process should take a maximum of about 10 seconds before it prints the information
    you want. If more time than this lapses, your system might have locked up, meaning
    that it could be time for method number three.'
  merge: -1
  pgno: 44
- img_proc: true
  md: '# Chapter 2 Installing and Configuring XFree86


    The third way to find out your graphics hardware is also known as the hard way
    in most circles. Take the case off of your computer (taking care to inform yourself
    about things like warranty issues) and look at your video card. Be sure to do
    this only in a relatively clean and static-free environment. Before touching any
    computer internals, touch the metal frame to ground and dissipate any static.
    Repeat this process often as you work inside the body. Carefully unbolt the card
    (if the video adapter is a card) and slide it out of the slot. Copy down exactly
    the identification of marks on the board that has such marks. Also take care to
    read any silkscreen printing on the board the amount of memory installed or the
    name of the manufacturer. When you''re finished, slide the card back into the
    slot, tighten the screw, and replace the case on your computer.


    If your monitor plugs directly into your motherboard, rather than into an expansion
    card, you''re probably better off sticking with SuperProbe or letting the X server
    to autodetect your hardware.


    # Mouse or Input Device Detective Work


    The facts you''ll want to know about your input device (mouse, trackball, or otherwise)
    before configuring XFree86 is the protocol you use to communicate and the port
    to which it is physically connected.


    Luckily for most users, the PC input device market has really calmed down in recent
    years. Although a wide variety of devices can still be purchased for PCs, nearly
    all current devices use one of two protocols to communicate. For most users, this
    means that if your mouse is connected to a serial port, it uses the Microsoft
    protocol, and if it is connected to a little round PS/2 port on your motherboard,
    it uses the PS/2 protocol.


    If you are using a serial mouse, you know for a fact that it isn''t a Microsoft
    protocol, or if your mouse isn''t a serial mouse at all, you''ll need to consult
    the documentation for the mouse to find out what protocol it uses. Many older
    Logitech mice use the Logitech protocol, and there are a few others out as well.
    Using the Auto protocol can allow some mice to communicate without a specific
    protocol specification, but there is no reliable way to autodetect protocols for
    older mice, so it''s up to you if you own such a mouse to do some detective work.


    The next thing you''ll need to know about your mouse or input device is where
    it is connected. Most of the time, your Linux distribution has already done this
    for you and has linked your mouse device to the /dev/mouse node. To see if this
    is the case, issuing the following command:


    ```

    ls -l /dev/mouse

    ```'
  merge: -1
  pgno: 45
- img_proc: true
  md: 'If /dev/mouse exists, chances are that your mouse port has already been configured
    for you as being /dev/mouse and that you won''t have to remember any other device
    name. If there is no /dev/mouse device on the other hand, you''ll need to check
    Table 2.1 for some common mouse devices in Linux. An overwhelming percentage of
    users will find that their mouse is served well by one of the first three entries
    in the table—either /dev/tty0, /dev/tty1, or /dev/psaux.


    | Table 2.1 Common Devices in Linux |

    | Device | Mouse Type and Related Port |

    | /dev/tty0 | Microsoft, Logitech, MouseMan, Mouse Systems, or IntelliMouse devices
    connected to COM1 |

    | /dev/tty1 | Microsoft, Logitech, MouseMan, Mouse Systems, or IntelliMouse devices
    connected to COM2 |

    | /dev/psaux | Any type of input device connected through a built-in PS/2 type
    mouse port |

    | /dev/logbm | Mice connected through a Logitech bus port or Logitech bus mouse
    port |

    | /dev/atibm | Mice connected to an ATI XL bus mouse port |

    | /dev/inportbm | Mice connected to a Microsoft bus mouse port or Microsoft bus
    mouse |


    If you can''t identify your pointing device''s protocol or port, you might have
    to do some experimenting through trial and error when configuring XFree86 until
    you can get the device to work.


    # Monitor Detective Work


    The two most important things you''ll want to learn about your monitor is its
    horizontal and vertical scan rate. Most monitors will give such ranges somewhere
    in the manual or on a spec sheet. If you can find them, keep them handy or copy
    them down somewhere.


    If you can''t find them, be sure you can find at least a text description or resolution
    description of your monitor, like one of these examples, which will usually give
    enough information to safely configure a monitor with conservative settings:


    +   - 14-inch Super VGA

    - 15-inch XGA

    - 17-inch 1280x1024


    If you can''t find any information at all about your monitor, you can also try
    checking your Windows configuration to see what resolution you''re using in Windows.
    This will often enable you to figure out the basic capabilities of your monitor
    and conservatively match it to one of the known monitor types later.'
  merge: -1
