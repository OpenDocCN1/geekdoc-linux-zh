  md: '# 214 Chapter 9 Runtime Environment Configuration


    The rest of the arguments given to the Key keyword are identical to those given
    by the Mouse keyword discussed earlier. To illustrate, however, an example is
    in order. Remember the example in which the scroll wheel on a mouse was bound
