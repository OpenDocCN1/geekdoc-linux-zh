    # # Enlightenment Tips and Tricks


    Nearly all the tips we will discuss are be found in one way or another at the
    Enlightenment Configuration dialog, which, in a default GNOME installation, can
    be found by middle-clicking the root window and selecting Configuration from the
    pop-up menu that appears. The Configuration Editor for Enlightenment version 0.15.5
    (see Figure 12.5).


