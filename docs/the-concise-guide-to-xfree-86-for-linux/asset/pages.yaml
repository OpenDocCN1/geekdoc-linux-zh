  md: '# 14


    # DISPLAY MANAGERS


    In earlier chapters, the only way to start XFree86 that I''ve discussed is with
    the startx command from a command shell in a text console. This method for starting
    XFree86 works fine for a single user to some degree, but there are some deficiencies.
    Even if a user wants to use only X, he or she must always pass through a character-mode
    login and issue at least one character-mode command, startx. There is no facility
    for allowing the user or the environment to alter the way in which the session
    will behave other than edit the xinitrc scripts by hand. Finally, the startx command
    provides no elegant way to start and manage X sessions over a network—only on
    a local display.


    # What Is a Display Manager For?


    On a practical level, a display manager is a program that is designed to manage
    authentication and X sessions across several physical displays, as well as over
    a network if necessary. A display manager is a way to enable users at any X-capable
    display to log in to a system on the network with account and password start an
    X session on that system, even if it is displayed remotely. This graphical login
    replaces a character mode login and eliminates the need to start a startx command
    on a local display as well as into. In short, a display manager allows a single-user
    Linux system to boot into X and a networked Linux system in a multiuser environment
    to serve X sessions across the network.'
  merge: -1
  pgno: 320
- img_proc: true
  md: '# Chapter 14 Display Managers


    On a more technical level, display managers run as a daemon in the background,
    listening to port 177 for incoming connections, waiting for X Display Manager
    Control Protocol requests (which you''ll cover in Chapter 15, \“Working on the
    Network\”) that are generated by an X server elsewhere on the network. When such
    a request is received, indicating that an X server is running on the machine from
    which the request originated, the display manager presents a graphical login and
    password prompt and, if a user authenticates him- or herself, starts an X session
    that displays on the remote machine where the user is, but executes on the local
    machine where the display manager is running.


    # The X Display Manager (xdm)


    The X Display Manager is a basic solution for users needing display manager functionality.
    Because it comes as a part of XFree8, no additional software is required to use
    it. The binary, *xdm*, should be normally located in /usr/X11/bin binaries directory;
    if it is absent, you probably need to check your installation to make sure the
    xdm package is installed.


    # Basic Configuration


    Before using the display manager, it is necessary to ensure that it is properly
    configured. The configuration files for the xdm binary included with XFree8 are
    found in the lib/X11/xdm/ subtree off the main /usr/X11 installation tree. The
    following sections detail the files commonly found and the role of each file in
    xdm configuration.


    For the sake of descriptive clarity, please consult the matching files installed
    in your *xdm/* directory when reading the following sections.


    # xdm-config


    This is the master configuration file for the xdm program; it doesn''t usually
    require user modification, and we will assume for the rest of the chapter that
    no changes are made to the file, but it might at some point be necessary for you
    to alter it. It contains several resources for the display manager that dictate
    where the display manager will look for further configuration information. Table
    14.1 shows the resources and their purposes.


    Table 14.1 Resources Listed in xdm-config

    | Resource | Description |

    |---|---|\| errorLogFile | Specifies the file to which errors will be output as
    they occur in the xdm runtime. |

    | pidFile | Specifies the name of the file that will contain the process ID of
    the running xdm daemon. |'
  merge: -1
  pgno: 321
- img_proc: true
  md: '# The X Display Manager (xdm) 307


    | Resource | Description |

    | --- | --- |

    | servers | The name of the file that will be used to start local X servers at
    launch time. | The name of the file that will be used to start local X servers
    at launch time. |

    | accessFile | Specifies the file that will control access to the local system
    from remote displays requesting XDMCP connections. |

    | authorize | Whether to require authorization for communications to the given
    host. Always should be to true, unless authorization isn''t supported by the host.
    |

    | setup | The script to run before displaying the graphical login prompt on the
    running X server. Often used to display a company logo or pop up a console window.
    |

    | startup | The script that is run (with root privileges) after a user logs in
    before the session is started. Normally used for utilitarian purposes and administration
    tasks associated with logging. |

    | reset | The script that is run (with root privileges) after a user logs out
    and the session ends. |

    | resources | Files where further display manager resources will be configured.
    |

    | session | Scripts that actually start the user session, run with the user''s
    privileges and group identification. |


    For any changes to the xdm-config file to take effect, a running xdm daemon must
    be killed and a new one started.


    # Xservers


    This is normally the name of the file given by the servers resource in the xdm-config
    file. Lines that begin with the hash (#) character are comments and are ignored.
    For Linux users, this file should contain one noncomment line that starts an X
    server on the local display when xdm is started. If there is to no server on the
    local display, there should be no noncomment lines in the file.


    Each noncomment line in the file follows this format:


    ```

    host:display local|foreign servercmd -args

    ```


    The first column in the line specifies the name of the display that this command
    will start. The second column can be either local, for a local display, or foreign,
    for a remote display that doesn''t support XDMCP, making explicit instructions
    to xdm necessary. The remaining data is used as a command to start an X server,
    if applicable, and any arguments are passed to the command. The default file contains
    this line, which will be adequate for most users:


    ```

    :0 /usr/X11R6/bin/X

    ```'
