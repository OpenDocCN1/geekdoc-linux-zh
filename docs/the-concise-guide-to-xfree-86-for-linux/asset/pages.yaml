  md: '# Keyboard, Mouse, and Display Configuration 151


    The add and remove expressions tell xmodmap to add a key symbol to the list of
    key symbols that can generate a modified state. For example, assume that a user
    issued the following command:


    ```

    xmodmap -e ''add shift = Tab''

    ```


    After this command has been issued, press any and hold of the keys currently mapped
    to the XX_Tab symbol will cause the keyboard to be shifted-letters will appear
    in uppercase and symbols instead of numbers. Usually, the Tab key (which is generally
    mapped to the XX_Tab symbol) will act more or less like the user expects a Shift
    key to act. Luckily, this can be:


    ```

    xmodmap -e ''remove shift = Tab''

    ```


    A list of current modifier mappings can be obtained simply by typing xmodmap alone
    at a command prompt. A more useful change than the preceding one involves reversal
    of the functionality of Control and Caps Lock keys on a standard PC, a common
    change among veterans:


    ```

    xmodmap -e ''add lock = Control_L''

    xmodmap -e ''remove lock = Caps_Lock''

    xmodmap -e ''add control = Caps_Lock''

    xmodmap -e ''remove control = Control_L''

    ```


    Note that calling xmodmap without arguments after making this change displays
    an updated map, where the Caps_Lock symbol appears on the control modifier map
    and the Control_L symbol appears on the lock modifier map.


    # Making xmodmap Changes Permanent


    One of the problems with calling xmodmap on the command line as we''ve done is
    that the changes last only as long as the X session does; after the user logs
    out or restarts, the new mappings will be lost. The remedy for this problem is
    xmodmap''s capability to read its changes from a file. The file is normally just
    a series of expressions as shown previously, one per line. Often, these expressions
    are stored in the ${HOME}/.xmodmap file, which xinit reads (the default) each
    time it is launched. For the following file would duplicate all the changes made
    earlier, fixing the Backspace and Delete keys by reversing the Caps Lock and left
    Control keys (see Listing 7.1).


    +   Listing 7.1 Sample ${HOME}/.xmodmap File


    ```

    keycode 22 = Backspace

    keycode 107 = Delete

    add lock = Control_L

    remove lock = Caps_Lock

    add control = Caps_Lock

    remove control = Control_L

    ```'
