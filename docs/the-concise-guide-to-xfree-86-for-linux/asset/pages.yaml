  md: '# 2

    # INSTALLING AND

    # CONFIGURING XFREE86


    # ## Checking for an Existing Installation


    Most Linux users install XFree86 by default as a part of their Linux installation.
    If your Linux configuration includes a graphical user interface, chances are that
    XFree86 is already installed and running on your machine.


    Users still unsure who is using RPM-based Linux operating systems can check for
    the presence of XFree86 packages by issuing the following command:


    ```

    rpm -qa | grep XFree86

    ```


    If XFree86 is installed, this command should turn up a list of several packages
    whose names begin with XFree86 and end with some of the components listed earlier.
    If your Linux system is RPM-based but this command produces no results, XFree86
    is probably not yet installed on your system.


    For other users, such as those without an rpm package manager, checking for the
    existence of /usr/X1186 directory tree on the system is another surefire way to
    detect the presence of X. If there is no /usr/X1186 directory tree on your system,
    XFree86 is probably not installed.'
