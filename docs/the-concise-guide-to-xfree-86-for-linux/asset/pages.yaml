- img_proc: true
  md: '# Chapter 15 Working on the Network


    # Host-Based Authentication Issues


    Although the host-based method for granting or denying access to the X server
    is convenient, it is not very secure. The host-based method is best used only
    on smaller networks where the local network in question is behind a firewall if
    the network is connected to the Internet.


    It is also important to understand that removing a host from the access list will
    deny new connections from the host in question, it will have no effect on existing
    connections.


    # Token-Based Authentication


    Token-based authentication decides who connects and doesn''t by checking a token
    offered by a connecting client against a token maintained locally, usually in
    a user''s HOME/.authority file. It is more secure than host-based authentication,
    which attempts to get access and dont just looking at the connecting host''s name
    (which can be fudged in any number of ways), and which can''t prevent any particular
    user from connecting to a dis-


    Token-based authentication comes in several forms, but can be more difficult to
    administer in general than the rather simple to understand host-based method.


    # How Token-Based Authentication Works


    The basic premise behind token-based authentication is a user-to-identification
    check. That is to say that the server is secured for a particular user''s use,
    and subsequently, only that user is theoretically able to start clients on the
    server. This task is accomplished by pairing two magic cookies, one supplied by
    the client and one maintained by the server. The cookie of a connecting client
    doesn''t match the cookie used by the server, the connection is refused.


    The mechanism behind this premise can at first seem complex but is really quite
    simple. First, a random magic cookie string is generated and saved to a file.
    Then the X server is started in the following:


    ```

    X authfile

    ```


    Of course, it is rare to start an X server alone in this fashion, so if the user
    starts a session from a console using startx, the argument is passed to the server
    like this:


    ```

    startx --auth authfile

    ```


    The authfile supplied is the file containing the random magic cookie string. It
    is usually called HOME/.authority on the machine where the server will run. Assuming
    that the list of hosts in /etc/Xnhosts for host-based authentication is empty,
    the server is secured and will accept incoming connections only from clients who
    can authenticate themselves.'
  merge: -1
  pgno: 347
- img_proc: true
  md: '# Controlling Access, Authenticating Connections 333


    When the user tries to connect clients to the X server in question, whether they
    are local or remote, the server will challenge the connecting clients for the
    correct magic cookie. The connecting clients supply the magic cookie for the client
    machine in $HOME/.authority file to the server, and if the cookies match, the
    server allows the connection to proceed. If the cookies don''t match, the connection
    is refused.


    If both clients and server are running on the same machine and are started by
    the same user, the magic cookie will always match because $HOME/.authority file
    seen by the server is the same physical file seen by the clients. If $HOME/.authority
    files are different physical files, either because the clients and server are
    running on separate machines or because the clients and server are running by
    two separate users, the user''s magic cookie must be transferred some-$HOME/.authority
    file before a client connection can be made.


    Note that the token files use can be changed from their default of $HOME/.authority
    by setting the XAUTHORITY environment variable to the name of the file that contains
    the magic cookie.


    # Automatic Token-Based Authentication


    The X Display Manager and other display managers covered in Chapter 14 have a
    special role in the use of token-based authentication. Most display managers for
    the X Window System automatically enable token-based authentication, eliminating
    the need to call x or startx with extra arguments.


    When a user logs in to an X session using a display manager such as xdm, the display
    manager automatically generates a random cookie for the server and stores it in
    a cookie file whose path has been passed to the X server using the -auth argument
    at launch. If the xdm login updates the magic cookie on the X client-side as well,
    eliminating the need to update magic cookies at all unless connections from a
    third system will be required. For more information on starting an xdm login remotely
    via an XDMCP query, see “Working with Applications and Sessions,” later in this
    chapter.


    Because of xdm provides in maintaining the magic cookie control mechanism, it
    is usually preferable to run and log in xdm whenever X will be used in a network-oriented
    environment. The authority of token-oriented tasks on the initiating client machine
    and the accepting server machine ensures that all users are operating with the
    more secure access control mechanism while eliminating much of the risk of user
    error.


    # Manipulating the Cookie File with xauth


    The magic cookie at $HOME/.authority can actually be a little more complex than
    I''ve made it appear because it can contain several magic cookies at a time, for
    example, if the user needs to start clients that will connect to several different
    X servers, each with its own magic cookie.'
  merge: -1
  pgno: 348
- img_proc: true
  md: '# 334 Chapter 15 Working on the Network


    The xauth command is designed to enable users to add and remove cookies from their
    $HOME/.xauthority file safely, without having to edit it by hand. The four xauth
    operations you''re concerned with are the add, remove, merge, and extract operations.


    To add a magic cookie to your token file, use xauth with the add command, like
    this:


    ```

    xauth add host:display keyvalue

    ```


    The host:display should be an address of the type discussed earlier in “Referring
    to Displays on the Network.” The keyvalue should be a large numeric value with
    an even number of digits generated by some random means. For example, to set a
    magic cookie for the first display on the host known as pokey using the current
    date and time as a keyvalue,


    ```

    xauth add pokey:0 . date +%Y%m%d%H%M%S

    ```


    To remove a magic cookie from your token file, use xauth with the remove command,
    like this:


    ```

    xauth remove host:display

    ```


    In this case, host:display must refer to a host for which a cookie already exists
    in your token file. For example, to remove the cookie for pokey:0, you''d use


    ```

    xauth remove pokey:0

    ```


    To extract a magic cookie for a given host and write it to a file, xauth is called
    this way:


    ```

    xauth extract outputfile:display

    ```


    If the specified outputfile is a dash (-), the cookie is written to standard output.
    For example, to display the cookie for pokey:0 to standard output, you''d use


    ```

    xauth extract - pokey:0

    ```


    Finally, to merge a magic cookie for a given host from an existing file into your
    default token file, xauth is called with the merge command:


    ```

    xauth merge mergefile

    ```


    If the specified mergefile is a dash (-), the cookie is read from standard output.


    # Transferring Cookies Between Hosts


    It sometimes becomes necessary to transfer a magic cookie from the $HOME/.xauthority
    file on one host to your $HOME/.xauthority file on another host, for example,
    when you started an X server by hand with the auth argument on the host called
    pokey, but now to start clients from a separate machine, foobar. Because you didn''t
    start the session with xdm, the magic cookie for the session exists only on pokey;
    any connections from foobar will be refused until your $HOME/.xauthority file
    on foobar contains the same cookie.'
  merge: -1
  pgno: 349
- img_proc: true
  md: '# Working with Applications and Sessions


    To transfer the cookie from pokey:0 to your account at foobar, the rsh command
    can be used in conjunction with the xauth command in the following rather convenient
    way:


    ```

    xauth extract - :0 rsh foobar xauth merge -

    ```


    Assuming that it is run from pokey''s display, this command first extracts the
    HOME cookie for the local display, and then pipes it to foobar, where it is merged
    into the HOME/.authority file. Of course, you may be able to use rsh between pokey
    and foobar in order for this command to be useful; if you can''t, you''ll have
    to use some other method for transferring the cookie, per-using ftp or some other
    method for file exchange.


    # Token-Based Authentication Issues


    The first and most obvious with token-based authentication is the fact that if
    the cookie can be obtained by an untrusted third party, an unwanted connection
    (a security breach) can occur. To avoid the unauthorized stealing of magic cookies
    for running servers, two steps must be taken. First, be sure to keep the HOME/.authority
    file ownership correct (by the user who owns HOME) and the permissions limited
    to read and write for the owner only. Next, sending magic cookies across the network
    in unencrypted form where they can be stolen by an untrusted third party. An easy-to-use
    method for encrypting magic cookie exchanges and the entire X protocol is covered
    in Chapter 16, "Tunnelling X Through ssh (Secure Shell)," but any method of encryption
    or compression can be used to make the transfer safer.


    Another issue with token-based authentication is the way in which it interacts
    with host-based authentication. The two methods are not exclusive; that is to
    say, connections from any hosts in the allowed hosts list will be accepted, even
    if token-based authentication is also in use. The correct magic cookie will be
    required only for connections from systems not in the permitted hosts list. It
    is also a good idea to maintain an empty hosts list if magic cookie authentication
    is to remain secure.


    It should be noted that more than one type of magic cookie can actually be used;
    the magic cookie type discussed here is the default type, MIT-MAGIC-COOKIE-1.
    For information on using other cookie types, including DES-encrypted and Kerberos-exchanged
    cookies, please see the xsecurity and xauth manual pages.


    # Working with Applications and Sessions


    You know how to keep an X server reasonably secure once running. If you are going
    to be working on the network, it is also important to understand how to perform
    three basic worked-X tasks: starting a remote client on the local display, starting
    a local client on a remote display, and using XDMCP query to start an entire session
    across the network.'
  merge: -1
  pgno: 350
- img_proc: true
  md: 'The examples in the following sections assume that X servers are running on
    machines called foobar and pokey and that you are sitting in front of foobar.
    These examples also assume that you have taken care of any authentication issues,
    such as exchanging magic cookies between systems when necessary.


    # Starting Remote Clients on the Local Display


    Perhaps the most common type of network use for X users is the use of clients
    that are running on remote hosts which display by connecting to a local X server.
    Depending on whether you''ll be multiple clients on the same remote machine or
    just a single client on each remote machine, you''ll probably want to do one of
    two things.


    # Starting Multiple Clients


    If you plan to start multiple remote clients from the same machine, the easiest
    thing to do is to start a shell session on that machine using login or telnet:


    ```

    login pokey

    ```


    After the session has begun, set the DISPLAY environment variable to point to
    your local display:


    ```

    you@pokey$ export DISPLAY=foobar:

    ```


    After you''ve set the DISPLAY environment variable to point to your local display,
    simply start clients as you would normally from the shell:


    ```

    you@pokey$ xterm &

    [1] 26332

    you@pokey$ netscape &

    [2] 26335

    you@pokey$

    ```


    Notice that any of the clients you start in the shell on pokey display themselves
    with you on foobar:0.


    # Starting Single Clients


    If you only need to start a single remote client, or if you need to start remote
    clients on different remote hosts, the rsh command is again more helpful. For
    example, to start an xterm on pokey that will display on foobar:0, you''d use


    ```

    rsh pokey xterm -display foobar:0

    ```


    Of course, this will tie up your shell until the client exits, so it might be
    more helpful to start the rsh and client in the background:


    ```

    rsh pokey xterm -display foobar:0 &

    ```'
