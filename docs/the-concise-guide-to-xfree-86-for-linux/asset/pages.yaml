  md: '# Old Versus New Keyboard Layout


    Next you will be asked by xf86config whether you want to use the old or the new-style
    keyboard layout. Unless you know what you''re doing and specifically want the
    old keyboard layout, there''s no real reason not to choose the newer method by
    choosing v and pressing Enter.


    You''ll see a screen of text that contains some information about the new keyboard
    layout method. Read it and then press Enter to proceed to the next screen, where
    you''ll see a list of predefined keyboards from which you can choose:


    +   1 Standard 101 key, US encoding

    2 Microsoft Natural, US encoding

    3 Keyronic FlexPro, US encoding

    4 Standard 101 key, US encoding with ISO09995 3 extensions

    5 Standard 101 key, German encoding

    6 Standard 101 key, French encoding

    7 Standard 101 key, Thai encoding

    8 Standard 101 key, Swiss/German encoding

    9 Standard 101 key, Swiss/French encoding

    10 None of the above


    Select the one that closely matches your keyboard and your needs. For most users,
    the first choice for a standard 101 key PC-style keyboard will be adequate.


    # Monitor Configuration


    Now you should see a screen of text explaining that xf86config is about to configure
    settings and resolutions for your monitor. Read the page, and then press Enter
    to continue. You''ll be presented with what looks like a complicated list of horizontal
    rates to choose from:


    +   hync in kHz; monitor type with characteristic modes

    1 31.5: Standard VGA, 640x480 @ 60 Hz

    2 31.5:35.1: Super VGA, 800x600 @ 56 Hz

    3 31.5:35.5: 8514! Compatible, 1024x768 @ 87 Hz interlaced (no 800x600)

    4 31.5:35.15: Super VGA, 1024x768, 800x600 @ 56 Hz

    5 31.5:37.9: Extended VGA, 800x600 @ 60 Hz, 640x400 @ 72 Hz

    6 31.5:48.5: Non Interleaved SVGA, 1024x768 @ 60 Hz, 800x600 @ 72 Hz

    7 31.5:57.0: High Frequency SVGA, 1024x768 @ 70 Hz

    8 31.5:64.3: Monitor that can do 1280x1024 @ 60 Hz

    9 31.5:79.0: Monitor that can do 1280x1024 @ 74 Hz

    10 31.5:82.0: Monitor that can do 1280x1024 @ 76 Hz

    11 Enter your horizontal sync rate


    If you have a good monitor with good documentation, the job is easy. Just look
    at the horizontal scan rate before the semicolon and choose the line that matches
    best. If none of the lines match, choose the last option and enter the documented
    range yourself. Don''t attempt to fabricate your own numbers and enter them here!
    You''ll blow your monitor!'
