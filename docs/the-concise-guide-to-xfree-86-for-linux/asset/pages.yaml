  md: '# GNOME Basics: Getting, Installing, Starting, Configuring 277


    After issuing this command, you''ll be presented with a list of configure options,
    including the option to specify an installation location and options to specify
    where previously compiled components have been installed.


    Note that the order in which the packages are compiled is extremely important
    and compilation won''t succeed if they are compiled out of order. For the correct
    order of compilation, and complete, detailed instructions on compiling and installing
    GNOME 1.0 from source, consult the GNOME 1.0 compilation page whose URL was supplied.
    Source packages should be compiled in the order in which they are listed down
    the left side of the page.


    # Starting GNOME


    Starting GNOME is a fairly simple process after all the wrinkles have been ironed
    out. It is made slightly more complicated by the fact that Enlightenment, the
    most commonly GNOME window manager, installs its binary in a nonstandard location
    when compiled from source.


    If you have installed GNOME from binary packages, it is likely that starting GNOME
    will be as easy as ensuring that the path to the GNOME binary is in your PATH
    variable and then issuing the GNOME session command. Calling GNOME in your $HOME/.xinitrc
    file instead of a window manager might require like this:


    ```

    export PATH=$PATH:/opt/gnome/bin

    gnome-session

    ```


    Note that the directory /opt/gnome/bin should be replaced with the directory in
    your binary packages installed the GNOME binaries. When compiling from source
    using the default installation paths, the addition to $HOME/.xinitrc would look
    like this instead, accounting for Enlightenment''s slightly different preferences:


    ```

    export PATH=$PATH:/usr/local/bin:usr/local/enlightenment/bin

    gnome-session

    ```


    Be sure to call the gnome-session command at the end of your $HOME/.xinitrc file
    so that gnomes is the X session''s controlling process and exiting GNOME therefore
    exits your session.


    # Configuring GNOME


    Although the default GNOME desktop is attractive and functional, after GNOME is
    running, the first thing many users want to edit the default desktop''s appearance
    because too much has been made of GNOME''s configurability.


    As was the case with the KDE, nearly every item or app on a GNOME desktop will
    present the user with a context-sensitive menu when a right-click event is detected.
    Often, this context-sensitive menu will contain one or several options related
    to the configuration of the object in question. For example, right-clicking on
    the GNOME panel brings up the contextsensitive menu shown in Figure 12.1.'
