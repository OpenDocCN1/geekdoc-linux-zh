  md: '# 348 Chapter 16 Tunneling X Through ssh (Secure Shell)


    The ssh server should now start by itself whenever an incoming ssh connection
    is requested. Note that starting sshd on-the-fly will work only on faster systems;
    the time it takes to generate the server key each time starts may cause connections
    to timeout on slower systems.


    For more information on the formats of the /etc/services and /etc/inetd.conf files,
    please see the manual pages for services and for inetd, respectively.


    # Using ssh to Transfer Magic Cookies


    Recall that in Chapter 15, the following command was introduced to facilitate
    the transfer of a magic cookie from one host to another:


    ```

    xauth extract :0 | rsh foobar xauth merge -

    ```


    This command had the effect of transferring the magic cookie for the local display
    to the host so that clients of foobar could connect to the local X server. The
    only problem with this technique was that the magic cookie was sent via rsh in
    plain-text form over the network, and the entire process was therefore susceptible
    to breach by unscrupulous third parties.


    With the ssh command substituted instead of rsh, the process repairs itself because
    the data is encrypted:


    ```

    xauth extract ::0 | ssh foobar xauth merge -

    ```


    If you are running the ssh command for the first time, you might have to wait
    a moment as a random seed is generated, and you might be presented with a few
    bits of status text. You will also be prompted for your password on the remote
    system; enter it at the prompt and the cookie is transferred over the encrypted
    channel and merged into the $HOME/.xauthority file securely on the remote system,
    foobar.


    # Using ssh to Tunnel X Sessions


    Because ssh employs a mechanism to tunnel X sessions automatically, the process
    of launching remote clients is remarkably simple. In most cases, you can simply
    issue a command like the following one:


    ```

    ssh foobar /usr/X11R6/bin/xterm

    ```


    After asking for your password, a new xterm window will appear on the host foobar''s
    display. To see evidence of the encrypted connections, try using the netstat command
    in the new xterm window, or alternatively, check the DISPLAY variable in the new
    xterm window:


    ```

    user@foobar echo $DISPLAY

    foobar:10.0

    User@foobar$

    ```'
