- img_proc: true
  md: '# Other Configurations


    The Other configuration screen, shown in Figure 2.8, is the final configuration
    section in xF86Setup. This screen lists five toggle options for you to enable
    or disable.


    ![](img/edb2a4591eafaad74c22be9075f4b815_56_0.png)


    **Figure 2.8** The Other configuration screen lists five common toggle options.
    The first two are enabled by default.


    The first option, Allow Server To Be Killed With Hotkey Sequence decides whether
    you''ll be able to instantly kill XFree86 at any time by pressing the Ctrl+Alt+Backspace
    key combination. This is often useful when debugging programs or playing over
    resource-intensive games but can be a problem in a multiuser environment. For
    most Linux home PCs, this option should be left checked, just in case.


    The next option, Allow Video Mode Switching, decides whether you''ll be allowed
    to switch between resolutions on-the-fly while XFree86 is running by pressing
    Ctrl+Alt+Plus or Ctrl+Alt+Minus. In most cases, you''ll want to leave this option
    enabled. If you selected only one mode in the Modeselection selection screen,
    this option will have no effect.


    The last three options, Don''t Trap Signals, Allow Video Mode Changes From Other
    Hosts, and Allow Changes To Keyboard and Mouse Settings From Other Hosts are all
    rarely useful to the average user and should probably be left unchecked. The first
    of the three is useful mainly for debugging purposes, when server crashes are
    expected. The second and third options permit other computers on the network to
    change aspects of the X desktop on your computer remotely—rarely something users
    want to make possible.'
  merge: -1
