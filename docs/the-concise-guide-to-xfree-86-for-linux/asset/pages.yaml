  md: '# Enabling the Framebuffer Console


    Enabling the framebuffer console is a two-step process. The first step is a recompilation
    and reinstallation of the Linux kernel. Although recompilation of the Linux kernel
    in total is beyond the scope of this book, specific notes on where to find the
    consoles aren''t.


    When using the make xconfig method of compiling the kernel, the Console Drivers
    panel shown in Figure 2.11 can be displayed by clicking the Console Drivers button
    on the main xconfig panel.


    ![](img/edb2a4591eafaad74c22be9075f4b815_88_0.png)


    **Figure 2.11** The Console Drivers panel is used to enable support for VESA framebuffer
    device.


    To enable the VESA framebuffer, the option labeled Support for Frame Buffer Devices
    should be set to y. Then, scroll down approximately two windows until you can
    locate the option VESA VGA Graphics Console, which should also be set to y. The
    Console Drivers panel can now be closed, and when the kernel is compiled, the
    VESA framebuffer will be ready to act.


    When using the more mandane make config of compiling the Linux kernel, you must
    take care first answer to y to the first question:


    > Prompt for development and/or incomplete code/drivers

    -> [CONFIG_EXPERIMENTAL] [Y/n/?]


    This is because the framebuffer consoles are still considered experimental code.
    Not to worry-in typical Linux fashion, they have proven stable and reliable in
    everyday use. After the first question, proceed with normal configuration until
    you reach the following point (preceding lines for context):'
  merge: -1
