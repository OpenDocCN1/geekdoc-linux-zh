  md: '# Installing XFree86


    Most Linux users will never need to install XFree86 by hand because every distribution
    under the sun will include XFree86 as part of a standard workstation install.
    Sometimes, however, it can be convenient to choose a so-called "server install"
    that doesn''t typically include XFree86, even though you''d like to install XFree86
    afterward. Sometimes it becomes necessary to upgrade an XFree86 distribution,
    even if upgrade packages haven''t been available from your distribution maintainer.
    In such cases, it is important to understand how to install XFree86.


    # Installing from the CD-ROM


    Most users who discover that XFree86 isn''t installed on their systems will want
    to install it from the CD-ROM on which their Linux operating system is packaged
    because there is every chance XFree86 will be present on the CD-ROM.


    The process of locating XFree86 packages on a CD-ROM isn''t a complicated one.
    First, the CD-ROM must be mounted. On current distributions, this is accomplished
    by inserting the CD-ROM and typing the following:


    ```

    mount /mnt/cdrom

    ```


    Note that a more complex command might be times required if the relevant information
    hasn''t been inserted into /etc/fstab.


    ```

    Mount -t iso9660 /dev/cdrom /mnt/cdrom

    ```


    Note that you may need to be using the root account for the command to work. After
    the CD-ROM is located, the XFree86 packages can usually be found by issuing a
    find command similar to this:


    ```

    find /mnt/cdrom -name ''XFree86*'' -print

    ```


    After the packages have been located, installing XFree86 is simply a matter of
    visiting the directory containing the packages and installing them. Refer to the
    list of components in Chapter 1, "X11R and the XFree86 Project," if you need help
    deciding which parts of XFree86 to install. If the component files on the CD-ROM
    don''t exactly match those listed there, rpm users can query each package for
    details on what it contains like this:


    ```

    rpm -qpi package

    ```


    Replace package with the name of the package file to query. Some users might find
    it useful to print the information about what each of the XFree86 packages contains
    before making decisions about which packages to install. This can be accomplished
    with


    ```

    rpm -qpi XFree86* | lpr

    ```'
  merge: -1
