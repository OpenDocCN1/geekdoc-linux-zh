  md: '# INTRODUCTION


    The face of Linux has changed a great deal since I first encountered it, and nowhere
    more than on the Linux desktop, where twm and fwm have gradually been replaced
    by KDE and GNOME as the state-of-the-art in Linux point-and-click. Such changes
    are necessary and welcome as Linux begins to come of age in the wider market;
    the KDE and GNOME contributors and project leaders are among the best friends
    Linux could ever have.


    Still, it sometimes seems that, in many cases, a deeper understanding of the mechanisms
    that lie behind the Linux desktop has been lost for many new Linux users, and
    that, with such a loss, the ability to utilize Linux to its fullest goes as well.
    Many users are unaware of the power and network-readness of X, now hidden behind
    an easy-to-use graphical user interface. Other users have some idea of X''s capabilities,
    but lack the knowledge and documentation necessary to make use of the features
    in question. XFree86 and Linux make an unbeatable pair, but only if the best features
    of both can be exploited.


    This book is intended as a basic reference for the underlying X system on Linux
    machines that allows the Linux desktop, as well as the KDE and GNOME, to be what
    they are today. The information presented here gets at the features of X and XFree86
    that were once considered user-level, but have recently been relegated to the
    status of system-level or even esoteric classification.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Introduction


    With the basic tools documented here and a little intuition, network users will
    happily be able to more easily bring to fruition goals such as network-centric
    computing, remote network and system administration, thin client computing, and
    multiplatform interoperability. Consumer Linux users, on the other hand, can use
    these tools to help in personalizing X and Linux in terms of both hardware and
    desktop software, for the greatest possible comfort and throughput in everyday
    tasks.'
