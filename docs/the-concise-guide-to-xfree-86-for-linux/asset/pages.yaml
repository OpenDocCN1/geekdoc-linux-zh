  md: '# Keyboard Shortcuts


    Most window managers are capable of implementing what are called keyboard shortcuts.
    Keyboard shortcuts are a set of keystrokes specified in the window manager configuration
    which, when entered by the user, will be intercepted by the window manager and
    not passed to the application that has focus. These keystrokes are then interpreted
    by the window manager and used to perform various functions.


    The keyboard shortcut configuration in X varies from window manager to window
    manager and from user to user, based on the configuration present on a machine.
    Although none of these shortcuts is included in the standard twm configuration
    that is included with XFree86, the user can configure twm to accept keyboard shortcuts.


    If you find that an application is not behaving as expected—for exampleit calls
    for you to press F1 to accomplish a certain task, but when you press F1, your
    window is minimized instead—it probably means that passing the F1 key to the window
    with focus, your window manager is using the F1 key as part of a keyboard shortcut.
    Generally speaking, the only way to fix such a problem is to edit your window
    manager''s configuration directly eliminate the keyboard shortcut in question.


    For more information on keyboard shortcuts and the window manager you''re using,
    please refer to Chapter 9.


    # Multiple Virtual Desktops


    Although not part of the behavior of the twm window manager included as standard
    with XFree86, many users might find that their window manager is capable of managing
    what are called multiple virtual desktops, often with the help of a desktop manager
    or pager window. In such configurations, the window manager maintains several
    virtual desktops simultaneously—allowing for a single desktop much larger than
    the screen, in some cases (such as Window Maker desktop), simply allowing for
    multiple logical X desktop.


    There is really no equivalent concept in either window operating systems or the
    Macintosh operating system; many users are initially stymied to some degree by
    the concept of multiple virtual desktops. It''s best to think of simply in the
    way that they are described—it as though you had started XFree86 many times on
    many different monitors. Each virtual desktop can hold application windows and
    icons. Each behaves as a mini X environment, in some cases with the added benefit
    that application windows can be moved between desktops or even become “sticky”
    so as appear on all. A small interface of some sort generally enables the user
    to switch between virtual desktops with the click of a mouse (see Figure 3.6).'
