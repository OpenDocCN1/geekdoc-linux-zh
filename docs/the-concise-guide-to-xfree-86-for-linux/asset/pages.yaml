  md: "# Keyboard Event Bindings\n\nThe method for binding keyboard events to functions\
    \ in twm is similar to the method for mouse events. However, instead of supplying\
    \ a button in the form of a word such as Button1, the keystroke to be bound is\
    \ an X key symbol enclosed in quotes. For a list of X key symbols, see the include/X11/keysymdef.h\
    \ file off the main /usr/X11R6 directory. Omit the XX_ prefix in any key symbol\
    \ used in defining key bindings. The general format for binding keystrokes is\
    \ as follows:\n\n+   * 'Key' = modifiers : contexts : function\n* 'Key' = modifiers\
    \ : contexts : function\n\nThe same modifiers and contexts that were valid for\
    \ mouse event bindings are also valid for keyboard event bindings, as are the\
    \ functions. Most users will find themselves wanting to bind at least the keyboard\
    \ function keys to commonly used operations, as is the case in the following-example:\n\
    \n+   * 'F1' = all : f.rightzoom\n* 'F2' = all : f.leftzoom\n\nThe set of bindings\
    \ uses the F1 key to maximize the window to the right half of the display for\
    \ any modifier and in any context. The F2 key performs the same function to the\
    \ left half of the display.\n\n# User-Defined Functions\n\nFunction definitions\
    \ in twm are carried out using the Function variable in the dotfile. It is not\
    \ helpful to define any functions you want to bind to mouse or keystrokes before\
    \ you carry out mouse or keyboard bindings. The format for the Function variable\
    \ is as follows:\n\n```\nFunction \"function-name\"\n{\n  .twm-function\n  .twm-function\n\
    \  ...\n```\n\nThe function-name can be any string of text the user wants to use\
    \ to name the function, but names are case-sensitive and must be supplied exactly\
    \ as they appear here for the function to work properly when called from elsewhere\
    \ in the dotfile. A special function, f.deltastop, can be used inside user-defined\
    \ functions to order the function to exit if mouse movement is detected. A function\
    \ implemented in twm might look like this:\n\n```\nFunction \"move-or-raiselow\"\
    \n{\n  f.move\n  f.deltastop\n  f.raiselow\n}\n```"
  merge: -1
