    # xterm


    The xterm application emulates any number of different dumb terminals in an X
    window so that text-based applications can be executed inside the window. Most
    commonly, x windows are used to run instances of the UNIX shell, or in the case
    of Linux, the bash shell. The user''s default login shell is the default application
    started inside an xterm window if no other application is specified. The most
    common command-line arguments accepted by xterm are shown in Table 4.23. Please
    note that many, many are available, most of them having to do with terminal emulation
    behavior. For a complete list, consult the xterm manual page.


    | Table 4.23 Most Common Arguments Accepted by xterm |

    | Argument | Description |

    | -ah | Doesn''t display the cursor as a hollow box when the xterm window doesn''t
    have focus; instead, always displays a box cursor. |

    | +ah | Displays the cursor as a hollow box when the xterm window doesn''t have
    focus. |

    | -aw | Enables auto-wrap, causing text that extends to the rightmost margin to
    wrap to the beginning of the next line. |

    | +aw | Disables auto-wrap, causing text that extends past the rightmost margin
    to be truncated. |

    | -b n | Uses pixels as padding space between the window border and the text that
    appears inside the xterm window. |

    | -cm | Enables ANSI color escape sequences to be displayed. |

    | +cm | Disables the displaying of ANSI color escape sequences. Note that when
    disabled, the sequences will still be displayed—as garbage text instead of color.
    |

    | -cr color | Specifies the color to use for the text cursor.'
