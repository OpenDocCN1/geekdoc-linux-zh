- "# Linux 命令行与 Shell 脚本圣经（第二版）\n\n\n\n![](img/calibre_cover.jpg)\n\n\n\n\n\n\n# 第\
  \ 15 章：脚本控制\n\n# 第 16 章：创建函数\n- `SZ`: 如果进程被交换，所需的近似交换空间\n- `WCHAN`: 进程睡眠时的内核函数地址\n\
  \n注意 `CMD` 列中的变化。\n\n\n\n如你所见，Unix 和 BSD 类型的参数之间存在大量的重叠。从其中一种类型获取的大部分信息也可以从另一种类型获取。大多数情况下，你选择参数类型是取决于你更习惯的格式（例如，如果你在学习\
  \ Linux 之前习惯于 BSD 环境）。\n\n当你使用 BSD 风格的参数时，`ps` 命令会自动更改输出以模拟 BSD 格式。这里有一个使用 `l` 参数的示例：\n\
  \n```\n$ ps l\nF  UID  PID  PPID  PRI  NI  VSZ  RSS  WCHAN  STAT TTY       TIME\
  \  COMMAND\n0   500  3081  3080  20    0  4692  1432  wait    Ss    pts/0     0:00\
  \  -bash\n0   500  5104  3081  20    0  4468   844  -       R+    pts/0     0:00\
  \  ps l\n$\n```\n\n注意，虽然许多输出列与我们使用的 Unix 风格参数相同，但有几列是不同的：\n\n*   `VSZ`: 进程在内存中的大小（单位为\
  \ KB）\n*   `RSS`: 进程已使用但未交换出的物理内存\n*   `STAT`: 表示当前进程状态的两个字符的状态码\n\n许多系统管理员喜欢 BSD\
  \ 风格的 `l` 参数，因为它为进程生成了更详细的状态码（`STAT` 列）。与单字符的 Unix 风格输出相比，这双字符代码能更精确地定义进程中正在发生的具体情况。\n\
  \n第一个字符使用的值与 Unix 风格的 `S` 输出列相同，显示进程何时处于睡眠、运行或等待状态。第二个字符进一步定义了进程的状态：\n\n*   `<`:\
  \ 进程以高优先级运行。\n*   `N`: 进程以低优先级运行。\n*   `L`: 进程有页面锁定在内存中。\n*   `s`: 进程是一个会话首。\n*\
  \   `l`: 进程是多线程。\n*   `+`: 进程正在前台运行。\n\n从之前显示的简单示例中，你可以看到 `bash` 命令正在睡眠，但它是一个会话首（它是我会话中的主进程），而\
  \ `ps` 命令在系统上是在前台运行的。\n\n## GNU 长参数\n\n最后，GNU 开发者通过在参数组合中添加更多选项，对新的改进型 `ps` 命令融入了他们自己的见解。某些\
  \ GNU 长参数复制了现有的 Unix 或 BSD 风格参数，而另一些则提供了新功能。表 4.3 列出了可用的 GNU 长参数。\n\n### 表 4.3 ps\
  \ 命令 GNU 参数\n\n| 参数 | 说明 |\n| :--- | :--- |\n| `--deselect` | 显示命令行中列出的进程以外的所有进程。\
  \ |\n| `--Group` `grplist` | 显示组 ID 在 `grplist` 中的进程。 |\n| `--User` `userlist` |\
  \ 显示用户 ID 在 `userlist` 中的进程。 |\n| `--group` `grplist` | 显示有效组 ID 在 `grplist` 中的进程。\
  \ |\n| `--pid` `pidlist` | 显示进程 ID 在 `pidlist` 中的进程。 |\n| `--ppid` `pidlist` | 显示父进程\
  \ ID 在 `pidlist` 中的进程。 |\n| `--sid` `sidlist` | 显示会话 ID 在 `sidlist` 中的进程。 |\n| `--tty`\
  \ `ttylist` | 显示终端设备 ID 在 `ttylist` 中的进程。 |\n| `--user` `userlist` | 显示有效用户 ID 在\
  \ `userlist` 中的进程。 |\n| `--format` `format` | 仅显示格式中指定的列。 |\n| `--context` | 显示额外的安全信息。\
  \ |\n| `--cols` `n` | 将屏幕宽度设为 `n` 列。 |\n| `--columns` `n` | 将屏幕宽度设为 `n` 列。 |\n|\
  \ `--cumulative` | 显示累计信息。 |\n| `--forest` | 以树状结构显示进程。 |\n| `--headers` | 显示表头。\
  \ |\n| `--no-headers` | 不显示表头。 |\n| `--lines` `n` | 将行数设为 `n` 行。 |\n| `--rows` `n`\
  \ | 将行数设为 `n` 行。 |\n| `--sort` `order` | 用于排序输出的列。 |\n| `--width` `n` | 将屏幕宽度设为\
  \ `n`。 |\n| `--help` | 显示帮助信息。 |\n| `--info` | 显示帮助信息。 |\n| `--version` | 显示版本。\
  \ |\n\n你可以将 GNU 参数与 Unix 或 BSD 参数结合使用以真正实现自定义。长参数的一个很酷的功能是 `--forest`：\n\n```\n\
  0   500  3081  3080  20    0  4692  1432  wait    Ss    pts/0     0:00  -bash\n\
  0   500  5104  3081  20    0  4468   844  -       R+    pts/0     0:00  ps l\n```\n\
  \n## 实时进程监控\n\n`ps` 命令非常适合查找频繁交换入出的进程。`top` 命令可以解决这个问题。`top` 输出是系统运行时的快照。`top` 的第一部分显示系统信息。第一行显示当前时间、系统运行时间、登录用户数以及负载。\n\
  \n负载显示三个数字：1 分钟、5 分钟和 15 分钟的平均负载。数值越高，系统负载越大。1 分钟负载值对于突发活动来说高并不罕见。如果 15 分钟负载值很高，你的系统可能出了问题。\n\
  \nLinux 系统管理的技巧在于定义到底什么是高负载值。这取决于系统正常运行的内容以及硬件配置。对于一个系统可能是正常的，对于另一个系统可能是高的。通常，如果负载平均超过\
  \ 2，情况就会变得繁忙。\n\n第二行显示进程信息（`top` 中称为 tasks）：有多少进程正在运行、睡眠、停止或僵尸。\n\n接下来显示通用 CPU 信息。`top`\
  \ 显示将 CPU 利用率分为几类，取决于进程的所有者以及进程的状态（运行、空闲或等待）。\n\n随后，有两行详细说明系统内存状态。第一行显示物理内存状态，包括总内存、已使用和空闲。第二行内存显示系统交换区域的状态（如果已安装）。\n\
  \n最后，下一个部分显示当前运行进程的详细列表，包含一些与 `ps` 命令输出类似的熟悉列：\n\n*   `PID`: 进程 ID\n*   `USER`:\
  \ 进程所有者的用户名\n*   `PR`: 进程优先级\n*   `NI`: 进程 nice 值\n*   `VIRT`: 进程使用的总虚拟内存\n*   `RES`:\
  \ 进程使用的物理内存\n*   `SHR`: 进程与其他进程共享的内存\n*   `S`: 进程状态（D=可中断睡眠、R=运行、S=睡眠、T=被跟踪或停止，或\
  \ Z=僵尸）\n*   `%CPU`: 进程使用的 CPU 时间百分比\n\n\n\n\n*   %MEM: 进程使用的可用物理内存份额\n*   `TIME+`:\
  \ 进程自启动以来使用的总 CPU 时间\n*   `COMMAND`: 进程的命令行名称（启动的程序）\n\n默认情况下，当你启动 `top` 时，它会根据\
  \ `%CPU` 值对进程进行排序。你可以在 `top` 运行时使用几个交互式命令之一来更改排序顺序。每个交互式命令都是你在 `top` 运行时可以按下的单个字符，用于改变程序的行为。这些命令在表\
  \ 4.4 中显示。\n\n表 4.4 常用交互式命令\n\n| 命令 | 描述 |\n| :--- | :--- |\n| `1` | 切换单 CPU 和对称多处理器\
  \ (SMP) 状态。 |\n| `b` | 切换表格中重要数字的粗体显示。 |\n| `I` | 切换 Irix/Solaris 模式。 |\n| `z` |\
  \ 配置表格颜色。 |\n| `l` | 切换负载平均信息行的显示。 |\n| `t` | 切换 CPU 信息行的显示。 |\n| `m` | 切换 MEM 和\
  \ SWAP 信息行的显示。 |\n| `f` | 添加或移除不同的信息列。 |\n| `o` | 更改信息列的显示顺序。 |\n| `F` 或 `O` | 选择用于进程排序的字段（默认为\
  \ `%CPU`）。 |\n| `<` 或 `>` | 将排序字段向左移动 (<) 或向右移动 (>)。 |\n| `r` | 切换正常或反向排序顺序。 |\n\
  | `h` | 切换线程的显示。 |\n| `c` | 切换显示进程的命令名称或完整命令行（包括参数）。 |\n| `i` | 切换空闲进程的显示。 |\n|\
  \ `S` | 切换累积 CPU 时间或相对 CPU 时间的显示。 |\n| `x` | 切换排序字段的高亮显示。 |\n| `y` | 切换运行任务的高亮显示。\
  \ |\n| `z` | 切换颜色和单色模式。 |\n| `b` | 切换 x 和 y 模式的粗体模式。 |\n| `u` | 显示特定用户的进程。 |\n|\
  \ `n` 或 `#` | 设置要显示的进程数量。 |\n| `k` | 杀死特定进程（仅限进程所有者或 root 用户）。 |\n| `r` | 更改特定进程的优先级\
  \ (`renice`)（仅限进程所有者或 root 用户）。 |\n| `d` 或 `s` | 更改更新间隔（默认为三秒）。 |\n| `W` | 将当前设置写入配置文件。\
  \ |\n| `q` | 退出 top 命令。 |\n\n## 停止进程\n\n作为一名系统管理员，至关重要的一点是知道何时以及如何停止进程。有时进程会挂起，只需要轻轻“推”一下就能重新运行或停止。其他时候，进程会过度占用\
  \ CPU 并拒绝放弃。在这两种情况下，你都需要一个允许你控制进程的命令。Linux 遵循 Unix 的进程间通信方法。\n\n在 Linux 中，进程之间通过信号（signals）进行通信。进程信号是一种预定义的消息，进程可以识别它并可能选择忽略或处理。开发者通过编程来控制进程如何处理信号。大多数编写良好的应用程序都具有接收并处理标准\
  \ Unix 进程信号的能力。这些信号在表 4.5 中显示\n\n表 4.5 Linux 进程信号\n\n| 信号 | 名称 | 描述 |\n| :--- |\
  \ :--- | :--- |\n| 1 | HUP | 挂断。 |\n| 2 | INT | 中断。 |\n| 3 | QUIT | 停止运行。 |\n| 9\
  \ | KILL | 无条件终止。 |\n| 11 | SEGV | 段错误。 |\n| 15 | TERM | 在可能的情况下终止。 |\n| 17 | STOP\
  \ | 无条件停止，但不终止。 |\n| 18 | TSTP | 停止或暂停，但在后台继续运行。 |\n| 19 | CONT | 在 STOP 或 TSTP\
  \ 后恢复执行。 |\n\nLinux 中有两个命令允许你向运行中的进程发送进程信号。\n\n### kill 命令\n\n`kill` 命令允许你根据进程 ID\
  \ (PID) 向进程发送信号。默认情况下，`kill` 命令向命令行列出的所有 PID 发送 `TERM` 信号。遗憾的是，你只能使用进程 PID 而不是命令名称，这使得\
  \ `kill` 命令有时难以使用。\n\n发送进程信号要求你必须是该进程的所有者，或者以 root 用户身份登录。\n\n```\n$ kill 3940\n\
  -bash: kill: (3940) - Operation not permitted\n$\n```\n\n`TERM` 信号告诉进程请停止运行。遗憾的是，如果你有一个失控的进程，它很可能会忽略该请求。当你需要强制执行时，`-s`\
  \ 参数允许你指定其他信号（使用名称或信号数字）。\n\n通常接受的程序是先尝试 `TERM` 信号。如果进程忽略了它，则尝试 `INT` 或 `HUP` 信号。如果程序识别这些信号，它将尝试在关闭之前优雅地停止正在执行的操作。最强制的信号是\
  \ `KILL` 信号。当进程接收到信号时，它会立即停止。这可能会导致文件损坏。\n\n正如以下示例所示，`kill` 命令没有相关的输出。\n\n```\n\
  ### kill -s HUP 3940\n#\n```\n\n要查看命令是否有效，你必须执行另一个 `ps` 或 `top` 命令来查看问题进程是否停止。\n\
  \n### killall 命令\n\n`killall` 命令是一种通过名称而非 PID 数字来停止进程的强大方法。`killall` 命令还允许你使用通配符字符，当系统出现故障时，它是一个非常有帮助的工具：\n\
  \n```\n### killall http*\n#\n```\n\n此示例将杀死所有以 `http` 开头的进程，例如 Apache Web 服务器的 `httpd`\
  \ 服务。\n\n> **注意**\n> 以 root 用户身份登录时，使用 `killall` 命令要极其小心。很容易在使用通配符字符时意外停止重要的系统进程。这可能导致文件系统损坏。\n\
  \n## 监控磁盘空间\n\n系统管理员的另一项重要任务是跟踪系统的磁盘使用情况。无论你运行的是简单的 Linux 桌面还是大型 Linux 服务器，你都需要知道为应用程序留了多少空间。\n\
  \n你可以使用一些命令行工具来帮助管理 Linux 系统上的介质环境。本节描述了你在执行系统管理职责期间可能会遇到的核心命令。\n\n### 挂载介质\n\n\
  如第 3 章所述，Linux 文件系统将所有介质磁盘合并到一个虚拟目录中。在系统上使用新的介质磁盘之前，你需要将其放置在虚拟目录中。这项被称为挂载（mounting）。\n\
  \n在当今的光源桌面世界中，大多数 Linux 发行版都有自动挂载特定类型可移除介质的能力。可移除介质设备是指（显然）可以从 PC 移除的介质，例如光驱、软盘和\
  \ USB 闪存。\n\n如果你使用的自动挂载和卸载可移除介质的发行版，你需要手动操作。本节描述了帮助你管理可移除介质设备的 Linux 命令行。\n\n###\
  \ mount 命令\n\n奇怪的是，挂载介质的命令叫做 `mount`。默认情况下，`mount` 命令显示当前系统中挂载的介质设备列表：\n\n```\n\
  $ mount\n/dev/mapper/VolGroup00-LogVol00 on / type ext3 (rw)\nproc on /proc type\
  \ proc (rw)\nsysfs on /sys type sysfs (rw)\ndevpts on /dev/pts type devpts (rw,gid=5,mode=620)\n\
  /dev/sda1 on /boot type ext3 (rw)\ntmpfs on /dev/shm type tmpfs (rw)\nnone on /proc/sys/fs/binfmt_misc\
  \ type bfmt_misc (rw)\nsunrpc on /var/lib/nfs/rpc_pipefs type rpc_pipefs (rw)\n\
  /dev/sdb1 on /media/disk type vfat\n```\n\n\n\n\n\n```\n(rw,nosuid,nodev,uhelper=hal,shortname=lower,uid=503)\n\
  $\n```\n\n`mount` 命令提供了四项信息：\n\n* 媒体设备的设备文件名\n* 媒体挂载到虚拟目录的挂载点\n* 文件系统类型\n* 挂载媒体的访问状态\n\
  \n上一个示例中的最后一条是一个 USB 优存盘，GNOME 桌面自动将其挂载在 `/media/disk` 挂载点。`vfat` 文件系统类型显示它是在微软\
  \ Windows 电脑上格式化的。\n\n要在虚拟目录中手动挂载媒体设备，你需要以 root 用户身份登录。以下是手动挂载媒体设备的的基本命令：\n\n```bash\n\
  mount -t type device directory\n```\n\n`type` 参数定义了磁盘格式化时所使用的文件系统类型。Linux 识别许多不同的文件系统类型。如果你与\
  \ Windows PC 共享可移动媒体设备，你最可能会遇到的类型有：\n\n* `vfat`: Windows 长文件名文件系统。\n* `ntfs`: 用于\
  \ Windows NT、XP 和 Vista 的 Windows 高级文件系统。\n* `iso9660`: 标准 CD-ROM 文件系统。\n\n大多数 USB\
  \ 优存盘和软盘都使用 `vfat` 文件系统格式化。如果你需要挂载数据 CD，必须使用 `iso9660` 文件系统类型。\n\n接下来两个参数定义了媒体设备设备文件的位置以及虚拟目录中挂载点的位置。例如，要手动将设备\
  \ `/dev/sdb1` 的 USB 优存盘挂载到位置 `/media/disk`，你会使用以下命令：\n\n```bash\nmount -t vfat /dev/sdb1\
  \ /media/disk\n```\n\n一旦媒体设备挂载到虚拟目录，root 用户将拥有该设备的完全权限，但其他用户的访问将受到限制。你可以使用目录权限（第\
  \ 6 章讨论）来控制谁可以访问设备。\n\n如果你需要使用 `mount` 命令的一些更高级的功能，可用参数见表 4.6。\n\n### 表 4.6 mount\
  \ 命令参数\n\n| 参数 | 描述 |\n| :--- | :--- |\n| `-a` | 挂载 `/etc/fstab` 文件中指定的所有文件系统。 |\n\
  | `-f` | 使 `mount` 命令模拟挂载设备，但不实际挂载。 |\n| `-F` | 与 `-a` 参数配合使用时，同时挂载所有文件系统。 |\n|\
  \ `-v` | 详细模式，解释挂载设备所需的所有步骤。 |\n| `-I` | 不使用 `/sbin/mount.filesystem` 下任何文件系统辅助文件。\
  \ |\n| `-l` | 为 `ext2`、`ext3` 或 `XFS` 文件系统自动添加文件系统标签。 |\n| `-n` | 挂载设备不在 `/etc/mstab`\
  \ 挂载设备文件中注册。 |\n| `-p ``num` | 用于加密挂载，从文件描述符 `num` 读取密码。 |\n| `-s` | 忽略文件系统不支持的挂载选项。\
  \ |\n| `-r` | 以只读模式挂载设备。 |\n| `-w` | 以读写模式挂载设备（默认）。 |\n| `-L` `label` | 使用指定的 `label`\
  \ 挂载设备。 |\n| `-U` `uuid` | 使用指定的 `uuid` 挂载设备。 |\n| `-O` | 与 `-a` 参数配合使用时，限制应用的文件系统集。\
  \ |\n| `-o` | 为文件系统添加特定选项。 |\n\n`-o` 选项允许你使用逗号分隔的附加选项列表来挂载文件系统。常用的选项有：\n\n* `ro`:\
  \ 以只读模式挂载。\n* `rw`: 以读写模式挂载。\n* `user`: 允许普通用户挂载文件系统。\n* `check=none`: 在不进行完整性检查的情况下挂载文件系统。\n\
  * `loop`: 挂载一个文件。\n\n如今 Linux 中很流行的做法是将 CD 分发为 `.iso` 文件。`.iso` 文件是 CD 在单个文件中的完整镜像。大多数\
  \ CD 刻录软件软件包都可以根据 `.iso` 文件创建新 CD。`mount` 命令的一个功能是你可以直接将 `.iso` 文件挂载到你的 Linux 虚拟目录，而无需将其刻录到\
  \ CD。这是通过带有 `loop` 选项的 `-o` 参数实现的：\n\n```bash\n$ mkdir mnt\n$ su\nPassword:\n##\
  \ mount -t iso9660 -o loop MEPIS-KDE4-LIVE-DVD_32.iso mnt\n## ls -l mnt\ntotal 16\n\
  -r--r--r-- 1 root root 702 2007-08-03 08:49 about\ndr-xr-xr-x 3 root root 2048 2007-07-29\
  \ 14:30 boot\n-r--r--r-- 1 root root 2048 2007-08-09 22:36 boot.catalog\n-r--r--r--\
  \ 1 root root 894 2004-01-23 13:22 cdrom.ico\n-r--r--r-- 1 root root 5229 2006-07-07\
  \ 18:07 MCWL\ndr-xr-xr-x 2 root root 2048 2007-08-09 22:32 mespis\ndr-xr-xr-x 2\
  \ root root 2048 2007-04-23 16:44 OSX\n-r--r--r-- 1 root root 107 2007-08-09 22:36\
  \ version\n## cd mnt/boot\n## ls -l\ntotal 4399\ndr-xr-xr-x 2 root root 2048 2007-06-29\
  \ 09:00 grub\n-r--r--r-- 1 root root 239212 2007-07-29 12:53 initrd.gz\n-r--r--r--\
  \ 1 root root 94760 2007-06-14 14:56 memtest\n-r--r--r-- 1 root root 14704 2007-07-29\
  \ 14:26 vmlinuz\n```\n\n`mount` 命令挂载 `.iso` CD 文件就像它是一个真正的 CD 一样，并允许我们在其文件系统中进行操作。\n\
  \n### umount 命令\n\n要移除可移动设备，你不应该直接将其从系统中移除。相反，你应该总是先卸载它。\n\n> 提示：Linux 不允许你弹出已挂载的\
  \ CD。如果你在从驱动器中弹出 CD 时遇到困难，很可能是 CD 仍然挂载在虚拟目录中。先卸载它，然后再尝试弹出。\n\n用于卸载设备的命令是 `umount`（是的，命令里没有\
  \ \"n\"，这很让人混淆）。`umount` 命令的格式非常简单：`umount [directory|device]`。`umount` 命令允许你通过设备位置或挂载目录来定义媒体设备。如果有任何程序在设备上打开了文件，系统将不允许你卸载。\n\
  \n```bash\n[root@testbox mnt]# umount /home/rich/mnt\numount: /home/rich/mnt: busy\n\
  umount: /home/rich/mnt: busy\n[root@testbox mnt]# cd /home/rich\n[root@testbox rich]#\
  \ umount /home/rich/mnt\n[root@testbox rich]# ls -l mnt\ntotal 0\n[root@testbox\
  \ rich]#\n```\n\n在这个示例中，命令提示符仍在一个目录中，因此 `umount` 命令无法卸载该镜像文件。一旦命令提示符离开镜像文件，`umount`\
  \ 命令就能卸载该镜像文件了。\n\n### 使用 df 命令\n\n有时你需要查看单个设备上有多少可用磁盘空间。`df` 命令允许你轻松地查看所有挂载磁盘的状况：\n\
  \n```bash\n$ df\n```\n\n| Filesystem | 1K-blocks | Used | Available | Use% | Mounted\
  \ on |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| /dev/sda2 | 18251068 | 7703964\
  \ | 9605024 | 45% | / |\n| /dev/sda1 | 101086 | 18680 | 77187 | 20% | /boot |\n\
  | tmpfs | 119536 | 0 | 119536 | 0% | /dev/shm |\n| /dev/sdb1 | 127462 | 11392 |\
  \ 13570 | 90% | /media/disk |\n\n```\n$\n```\n\n`df` 命令显示包含数据的挂载文件系统。正如之前从 `mount`\
  \ 命令所示，某些挂载设备用于内部系统目的。该命令显示：\n\n* 设备位置\n* 它能容纳多少 1024 字节块的数据\n* 使用了多少 1024 字节块\n\
  * 可用多少 1024 字节块\n* 使用空间的百分比\n* 设备挂载点\n\n`df` 命令有许多不同的命令行参数可用，但大多数你永远用不到。一个流行的参数是\
  \ `-h`，它以人类易读的格式显示磁盘空间，通常为 M（兆字节）或 G（吉字节）：\n\n```bash\n$ df -h\n```\n\n| Filesystem\
  \ | Size | Used | Avail | Use% | Mounted on |\n| :--- | :--- | :--- | :--- | :---\
  \ | :--- |\n| /dev/sdb2 | 18G | 7.4G | 9.2G | 45% | / |\n| /dev/sda1 | 99M | 19M\
  \ | 76M | 20% | /boot |\n| tmpfs | 119M | 0 | 119M | 0% | /dev/shm |\n| /dev/sdb1\
  \ | 124G | 113G | 13G | 90% | /media/disk |\n\n```\n\n\n\n\n\n```\n/dev/sdb1   \
  \         125M  112M   14M   90%  /media/disk\n$\n```\n\n现在，你不再需要解码那些丑陋的块数字，所有的磁盘大小都用“正常”单位显示出来。`df`\
  \ 命令在排查系统磁盘空间问题时价值极高。\n\n> 注意\n> > 请记住，Linux 系统始终有后台运行的进程在处理文件。`df` 命令的值反映了 Linux\
  \ 系统在时间点认为的当前值。你可能有一个运行的进程创建或删除了文件，但尚未释放该文件。该值不会包含在可用空间的计算中。\n\n## 使用 du 命令\n\n\
  通过 `df` 命令，可以很容易看到磁盘何时耗尽空间。对于系统管理员来说，下一个问题是知道当这种情况发生时该做什么。\n\n另一个可以帮助你的有用命令是 `du`\
  \ 命令。`du` 命令显示特定目录（默认是当前目录）的磁盘占用情况。这是判断系统上是否存在明显的磁盘大户的快速方法。\n\n默认情况下，`du` 命令显示当前目录下的所有文件、目录和子目录，并显示每个文件或目录占用的磁盘块数。对于标准大小的目录，列表可能会非常长。以下是使用\
  \ `du` 命令的部分列表：\n\n```\n$ du\n484     ./.gstreamer-0.10\n8       ./Templates\n8\
  \       ./Download\n8       ./.ccache/7/0\n24      ./.ccache/7\n368     ./.ccache/a/d\n\
  384     ./.ccache/a\n424     ./.ccache\n8       ./Public\n8       ./.gphpedit/plugins\n\
  32      ./.gphpedit\n72      ./.gconfd\n128     ./.nautilus/metafiles\n384     ./.nautilus\n\
  72      ./.bittorrent/data/metainfo\n20      ./.bittorrent/data/resume\n144    \
  \ ./.bittorrent/data\n152     ./.bittorrent\n8       ./Videos\n8       ./Music\n\
  16      ./.config/gtk-2.0\n40      ./.config\n8       ./Documents\n```\n\n每行右侧的数字是每个文件或目录占用的磁盘块数。注意列表是从目录的底部开始，向上遍历该目录内包含的文件和子目录。\n\
  \n`du` 命令本身可能没什么用处。能看到每个单独的文件和目录占用多少磁盘空间是很好，但当你必须翻阅好几页的信息才能找到要找的内容时，它可能就毫无意义了。\n\
  \n你可以配合 `du` 命令使用几个命令行参数来让结果更具可读性：\n\n*   `-c`: 生成所有列出文件的总计和。\n*   `-h`: 以人类可读的格式打印大小，使用\
  \ `K` 表示字节，`M` 表示兆字节，`G` 表示千字节。\n*   `-s`: 对每个参数进行汇总。\n\n系统管理员的下一步是使用一些文件处理命令来操作大量数据。这正是下一节涵盖的内容。\n\
  \n## 处理数据文件\n\n当你有大量数据时，通常很难处理这些信息并使其变得有用。正如你在上一节中通过 `du` 命令看到的，在处理系统命令时，很容易产生数据过载。\n\
  \nLinux 系统提供了若干命令行工具来帮助你管理大量数据。本节涵盖了每个系统管理员——以及任何日常 Linux 用户——应该学会如何使用的基本命令，以便他们的生活更轻松。\n\
  \n### 排序数据\n\n在处理大量数据时，一个非常实用的函数是 `sort` 命令。`sort` 命令顾如其名——排序数据。\n\n默认情况下，`sort`\
  \ 命令使用你为会话指定的语言的标准排序规则对文本文件中的数据行进行排序。\n\n```\n$ cat file1\none\ntwo\nthree\nfour\n\
  five\n$ sort file1\nfive\nfour\none\nthree\ntwo\n$\n```\n\n非常简单。然而，事情并不总是像看起来那么简单。看这个例子：\n\
  \n```\n$ cat file2\n1\n2\n100\n45\n3\n10\n$ sort file2\n1\n2\n100\n45\n3\n10\n```\n\
  等等，上面的示例显示的是标准的字符串排序。让我们看看数值排序：\n\n```\n$ cat file2\n1\n2\n100\n45\n3\n10\n$ sort\
  \ -n file2\n1\n2\n3\n10\n45\n100\n```\n\n如果你期望数字按数值排序，那么你可能会失望。要解决这个问题，请使用 `-n`\
  \ 参数。按逆序排序：\n\n```\n$ sort -rn file2\n100\n45\n10\n3\n2\n1\n```\n\n## sort 参数\n\n\
  | 单横线 | 双横线 | 描述 |\n| :--- | :--- | :--- |\n| `-b` | | 排序时忽略空行。 |\n| `-C` | | 检查输入是否已经排序。\
  \ |\n| `-c` | | 如果未排序则报告。 |\n| `-d` | | 仅考虑字符进行排序。 |\n| `-f` | | 忽略大小写。 |\n| `-g`\
  \ | | 通用数值排序。 |\n| `-i` | | 忽略不可打印字符。 |\n| `-k` | --key=`POS1`[,`POS2`] | 基于 `POS1`\
  \ 排序，并在 `POS2` 结束。 |\n| `-M` | | 按三字符名称的顺序排序。 |\n| `-m` | | 合并两个已排序的数据文件。 |\n| `-n`\
  \ | | 按数值排序。 |\n| `-o` | -output=`file` | 将结果写入指定的文件。 |\n| `-R` | | 按键的随机哈希排序。 |\n\
  | | --random-source=`FILE` | 指定用于 `-R` 参数的随机字节的文件。 |\n| `-r` | | 反转排序顺序（降序而非升序）。\
  \ |\n| `-S` | --buffer-size=`SIZE` | 指定使用的内存量。 |\n| `-s` | | 禁用最后的比较。 |\n| `-T`\
  \ | --temporary-direction=`DIR` | 指定存储临时工作文件的位置。 |\n| `-t` | --field-separator=`SEP`\
  \ | 指定用于区分键位置的字符。 |\n| `-u` | --unique | 配合 `-c` 参数时，检查严格排序；无 `-c` 参数时，仅输出两个相似行中的第一次出现。\
  \ |\n| `-z` | --zero-terminated | 使用 NULL 字符结束所有行而不是换行符。 |\n\n`-k` 和 `-t` 参数在排序使用字段的数据（例如\
  \ `/etc/passwd` 文件）时非常方便。使用 `-t` 参数指定字段分隔符字符，使用 `-k` 参数指定根据哪个字段进行排序。例如，要根据数值 userid\
  \ 对密码文件进行排序，只需这样做：\n\n```\n$ sort -t ':' -k 3 -n /etc/passwd\nroot:x:0:0:root:/root:/bin/bash\n\
  bin:x:1:1:bin:/bin:/sbin/nologin\n```\n\n\n\n\n\n```\ndaemon:x:2:2:daemon:/sbin:/sbin/nologin\n\
  adm:x:3:4:adm:/var/adm:/sbin/nologin\nlp:x:4:7:lp:/var/spool/lpd:/sbin/nologin\n\
  sync:x:5:0:sync:/sbin:/bin/sync\nshutdown:x:6:0:shutdown:/sbin:/sbin/shutdown\n\
  halt:x:7:0:halt:/sbin:/sbin/halt\nmail:x:8:12:mail:/var/spool/mail:/sbin/nologin\n\
  news:x:9:13:news:/etc/news:\nuucp:x:10:14:uucp:/var/spool/uucp:/sbin/nologin\noperator:x:11:0:operator:/root:/sbin/nologin\n\
  games:x:12:100:games:/usr/games:/sbin/nologin\ngopher:x:13:30:gopher:/var/gopher:/sbin/nologin\n\
  ftp:x:14:50:FTP User:/var/ftp:/sbin/nologin\n```\n\n现在数据已根据第三字段（即数值用户 ID uid 值）进行了完美排序。\n\
  \n`-n` 参数非常适合对数值输出排序，例如 `du` 命令的输出：\n\n```bash\n$ du -sh * | sort -nr\n1008k   mrtg-2.9.29.tar.gz\n\
  972k    bldg1\n888k    fbs2.pdf\n760k    Printtest\n680k    rsync-2.6.6.tar.gz\n\
  660k    code\n516k    fig1001.tiff\n496k    test\n496k    php-common-4.0.4pl1-6mdk.i586.rpm\n\
  448k    MesaGLUT-6.5.1.tar.gz\n400k    plp\n```\n\n注意，`-r` 选项也会按降序排列值，因此你可以轻松地看到目录中哪些文件占用了最大的空间。\n\
  \n> 注意\n> 本示例中使用的管道命令 (|) 将 `du` 命令的输出重定向到 `sort` 命令。这将在第 10 章进行更详细的讨论。\n\n### 搜索数据\n\
  \n在大文件中，你通常需要查找隐藏在文件中间的某行特定数据。与其手动滚动整个文件，不如让 `grep` 命令为你搜索。`grep` 命令的命令行格式为：\n\n\
  ```bash\ngrep [options] pattern [file]\n```\n\n`grep` 命令在输入或你指定的文件中搜索包含匹配指定模式（pattern）字符的行。`grep`\
  \ 的输出是包含匹配模式的行。\n\n以下是使用“排序数据”部分中的 `file1` 文件使用 `grep` 命令的两个简单示例：\n\n```bash\n$\
  \ grep three file1\nthree\n$ grep t file1\ntwo\nthree\n$\n```\n\n第一个示例在 `file1`\
  \ 文件中搜索匹配模式 `three` 的文本。`grep` 命令产生包含匹配模式的行。下一个示例在 `file1` 文件中搜索匹配模式 `t` 的文本。在这种情况下，有行匹配指定的模式，并且它们都显示了出来。\n\
  \n由于 `grep` 命令非常流行，它在其生命周期内经历了许多开发变化。`grep` 命令中添加了许多功能。如果你查看 `grep` 命令的帮助页（man pages），你将会发现它是多功能强大。\n\
  \n如果你想反向搜索（输出不匹配模式的行），请使用 `-v` 参数：\n\n```bash\n$ grep -v t file1\none\nfour\nfive\n\
  $\n```\n\n如果你需要找到匹配模式所处的行号，请使用 `-n` 参数：\n\n```bash\n$ grep -n t file1\n2:two\n3:three\n\
  $\n```\n\n如果你只需要查看包含匹配模式的行数，请使用 `-c` 参数：\n\n```bash\n$ grep -c t file1\n2\n$\n```\n\
  \n如果你需要指定多个匹配模式，请使用 `-e` 参数指定每个单独的模式：\n\n```bash\n$ grep -e t -e f file1\ntwo\n\
  three\nfour\nfive\n$\n```\n\n此示例输出了包含字符串 `t` 或字符串 `f` 的行。\n\n默认情况下，`grep` 命令使用基础的\
  \ Unix 风格正则表达式来匹配模式。Unix 风格正则表达式使用特殊字符来定义如何查找匹配模式。\n\n有关正则表达式的更详细解释，请参阅第 19 章。\n\
  \n这里有一个在 grep 搜索中使用正则表达式的简单示例：\n\n```bash\n$ grep [tf] file1\ntwo\nthree\nfour\n\
  five\n$\n```\n\n正则表达式中的方括号表示 `grep` 应该查找包含 `t` 或 `f` 字符的匹配项。如果没有方括号，正则表达式将查找字符串\
  \ `tf`。\n\n`egrep` 是 `grep` 的衍生版本，允许使用扩展正则表达式。\n\n### bzip2 工具\n\n`bzip2` 软件包较新，但它正在变得流行。`bzip2`\
  \ 工具包括：\n\n*   `bzip2` 用于压缩文件\n*   `bzcat` 用于显示压缩文件的内容\n*   `bunzip2` 用于解文件\n* \
  \  `bzip2recover` 用于尝试恢复损坏的文件\n\n默认情况下，`bzip2` 命令会压缩原始文件并将其替换为 `.bz2` 扩展，这表明我们使用了什么压缩技术来压缩它。\n\
  \n```bash\n$ bzip2 myprog\n$ ls -l myprog\n-rw-r--r-- 1 root root 2378 Oct 25 12:00\
  \ myprog.bz2\n```\n\n等待，`myprog` 的原始大小为 4882 字节，经过 `bzip2` 压缩后现在是 2378 字节。此外，注意\
  \ `bzip2` 命令自动将原始文件重命名为 `.bz2` 扩展。\n\n要解压缩文件，只需使用 `bunzip2` 命令：\n\n```bash\n$ bunzip2\
  \ myprog.bz2\n$ ls -l myprog\n-rw-r--r-- 1 root root 4882 Oct 25 12:00 myprog\n\
  ```\n\n如你所示，解压缩后的文件恢复到了原始大小。一旦压缩了文本文件，你就无法使用标准的 `cat`、`more` 或 `less` 命令查看数据。相反，你需要使用\
  \ `bzcat` 命令：\n\n```bash\n$ bzcat test.bz2\nThis is a test text file.\nThe quick\
  \ brown fox jumps over the lazy dog.\nThis is the end of the test file.\n```\n\n\
  `bzcat` 命令在不解压缩实际文件的情况下显示压缩文件内部的文本。\n\n### gzip 工具\n\n到目前为止，Linux 中最流行的文件压缩工具是 `gzip`\
  \ 工具。`gzip` 软件包是 GNU 项目的产，目的是尝试创建原始 Unix compress 工具的免费版本。该软件包包含以下文件：\n\n\n\n\n\n\
  *   `gzip` 用于压缩文件\n*   `gzcat` 用于显示压缩文本文件的内容\n*   `gunzip` 用于解压缩文件\n\n这些工具的工作方式与\
  \ `bzip2` 工具相同：\n\n```\n$ gzip myprog\n$ ls -l my*\n-rwxrwxr-x 1 rich rich 2197\
  \ 2007-09-13 11:29 myprog.gz\n$\n```\n\n`gzip` 命令用于压缩你在命令行上指定的文件。你也可以指定多个文件名，甚至使用通配符来同时压缩多个文件：\n\
  \n```bash\n$ gzip my*\n$ ls -l my*\n-rwxr--r--    1 rich      rich           103\
  \ Sep  6 13:43 myprog.c.gz\n-rwxr-xr-x    1 rich      rich          5178 Sep  6\
  \ 13:43 myprog.gz\n-rwxr--r--    1 rich      rich            59 Sep  6 13:46 myscript.gz\n\
  -rwxr--r--    1 rich      rich            60 Sep  6 13:44 myscript.gz\n$\n```\n\n\
  `gzip` 命令会压缩目录中匹配通配符模式的所有文件。\n\n## zip 工具\n\n`zip` 工具与 Phil Katz 为 MS-DOS 和 Windows\
  \ 创建的流行的 PKZIP 软件包兼容。Linux zip 软件包中包含四个工具：\n\n*   `zip` 创建一个包含所列文件和目录的压缩文件。\n* \
  \  `zipcloak` 创建一个包含所列文件和目录的加密压缩文件。\n*   `zipnote` 从 zip 文件中提取注释。\n*   `zipsplit`\
  \ 将一个 zip 文件分割成一组指定大小的较小文件（用于将大型 zip 文件拷贝到软磁盘上）。\n*   `unzip` 从压缩的 zip 文件中提取文件和目录。\n\
  \n要查看 `zip` 工具的所有可用选项，只需在命令行中单独输入它即可：\n\n```bash\n$ zip\nCopyright (C) 1990-2005\
  \ Info-ZIP\nType ‘zip \"-L”’ for software license.\nZip 2.31 (March 8th 2005). Usage:\n\
  zip [-options] [-b path] [-t mmddyyyy] [-n suffixes] [zipfile list]\n[-xi list]\n\
  \   默认默认操作是从 list 中添加或替换 zipfile 条目，\n   这可以包括特殊名称 - 来压缩标准输入。\n   如果省略 zipfile 和\
  \ list，zip 将将 stdin 压缩到 stdout。\n  -f freshen: only changed files  -u update: only\
  \ changed or new files\n  -d delete entries in zipfile    -m move into zipfile (delete\
  \ files)\n  -r recurse into directories      -j junk directory names\n  -0 store\
  \ only                   -l convert LF to CR LF\n  -1 compress faster          \
  \    -9 compress better\n  -q quiet operation              -v verbose operation\n\
  \  -c add one-line comments        -z add zipfile comment\n  -@ read names from\
  \ stdin        -o make file as old as latest entry\n  -x exclude the following names\
  \  -i include only the following names\n  -F fix zipfile (-FF try harder) -D do\
  \ not add directory entries\n  -A adjust self-extracting exe   -J junk zipfile prefix\
  \ (unzipsfx)\n  -T test zipfile integrity       -X exclude file attributes\n  -y\
  \ store symbolic links as the link instead of the referenced file\n  -R PKZIP recursion\
  \ (see manual)-e encrypt -n don't compress these suffixes\n$\n```\n\n`zip` 工具的强大之处在于能够将整个目录的文件压缩成单个压缩文件。这使其成为归档目录结构的理想选择：\n\
  \n```bash\n$ zip -r test test\n```\n\n此示例创建一个名为 `test.zip` 的 zip 文件，并递归遍历 `test`\
  \ 目录，将找到每个文件和目录添加到 zip 文件中。注意输出，并不是 zip 文件中存储的所有文件都能被压缩。\n\n> 注意：当你使用 zip 命令的递归功能时，文件存储在\
  \ zip 文件中的相同目录中。子目录中的文件将存储在 zip 文件中相同的子目录内。在提取文件时必须小心；`unzip` 命令将在新位置重建整个目录结构。当你有大量的子目录和文件时，这有时会令人困惑。\n\
  \n## 归档数据\n\n虽然 `zip` 命令在将数据压缩并归档到单个文件中方面表现出色，但它不是 Unix 和 Linux 世界使用的标准工具。到目前为止，Unix\
  \ 和 Linux 中最流行的归档工具是 `tar` 命令。`tar` 命令最初用于将文件写入带设备进行归档。然而，它也可以将输出写入文件，这已成为 Linux\
  \ 中归档数据的流行方式。\n\n以下是 `tar` 命令的格式：\n\n```\ntar function [options] object1 object2\n\
  ```\n\n`function` 参数定义了 `tar` 命令应该执行。\n\n### tar 命令函数\n\n| 函数 | 长名称 | 说明 |\n| :---\
  \ | :--- | :--- |\n| `-A` | `--concatenate` | 将现有归档文件合并到另一个现有 tar 归档文件中。 |\n| `-c`\
  \ | `--create` | 创建一个新的 tar 归档文件。 |\n| `-d` | `--diff` |  tar 归档文件与文件系统的差异。 |\n\
  | `--delete` | 从现有归档文件中删除。 |\n| `-r` | `--append` | 将文件添加到现有归档文件的末尾。 |\n| `-t` |\
  \ `--list` | 列出现有归档文件的内容。 |\n| `-u` | `--update` | 将比现有归档同名文件更新的文件添加到现有归档文件中。 |\n\
  | `-x` | `--extract` | 从现有归档文件中提取文件。 |\n\n每个函数使用选项来定义 tar 归档文件的特定行为。\n\n### tar\
  \ 命令选项\n\n| 选项 |  |\n| :--- | :--- |\n| `-C` `dir` | 切换到指定的目录。 |\n| `-f` `file`\
  \ | 输出结果到文件（或设备）`file`。 |\n| `-j` | 将输出重定向到 `bzip2` 命令进行压缩。 |\n| `-p` | 保留所有文件权限。\
  \ |\n| `-v` | 处理时列出文件。 |\n| `-z` | 将输出重定向到 `gzip` 命令进行压缩。 |\n\n这些选项通常组合在一起创建以下场景。首先，你想使用此命令创建一个归档文件：\n\
  \n```bash\ntar -cvf test.tar test/ test2/\n```\n\n上述命令创建一个名为 `test.tar` 的归档文件，包含\
  \ `test` 目录和 `test2` 目录的内容。接下来，使用此命令：\n\n```bash\ntar -tf test.tar\n```\n\n列出（但不提取）tar\
  \ 文件 `test.tar` 的内容。最后，使用此命令：\n\n```bash\ntar -xvf test.tar\n```\n\n提取 tar 文件 `test.tar`\
  \ 的内容。如果 tar 文件是从目录结构创建的，则从当前目录开始重建整个目录结构。\n\n如你所见，使用 `tar` 命令是创建整个目录结构归档文件的简单方法。这是\
  \ Linux 世界分发开源源代码的常用方法。\n\n> 提示：如果你下载开源软件，通常会看到以 `.tgz` 结尾的文件。这些是 gzipped tar 文件，可以使用命令\
  \ `tar -zxvf` `filename.tgz` 进行提取。\n\n## 总结\n\n本章讨论了 Linux 系统管理员和程序员使用的一些更高级的 bash\
  \ 命令。`ps` 和 `top` 命令对于确定系统状态至关重要，允许你看到哪些应用程序正在运行以及它们消耗多少资源。\n\n\n\n\n\n在可移动介质盛行的今天，系统管理员的另一个热门话题是挂载存储设备。`mount`\
  \ 命令允许你将物理存储设备挂载到 Linux 虚拟目录结构中。要移除该设备，请使用 `umount` 命令。\n\n最后，本章讨论了用于处理数据的各种实用。`sort`\
  \ 工具可以轻松地排序大型数据文件，帮助你组织数据，而 `grep` 工具则允许你快速扫描大型数据文件以查找特定信息。Linux 中提供了不同的文件压缩工具，包括\
  \ `bzip2`、`gzip` 和 `zip`。每种工具都允许你压缩大文件以帮助节省文件系统空间。Linux 的 `tar` 工具是一种将目录结构归档为单个文件的流行方法，该文件可以轻松地迁移到另一个系统。\n\
  \n下一章将讨论 Linux 环境变量。环境变量允许你从脚本访问系统信息，并为在脚本中存储数据提供了一种方便的方法。\n\n# 第 5 章：使用 Linux 环境变量\n\
  \n## 本章内容\n- 什么是环境变量？\n- 设置环境变量\n- 删除环境变量\n- 默认 shell 环境变量\n- 设置 `PATH` 环境变量\n-\
  \ 定位系统环境变量\n- 变量数组\n- 使用命令别名\n\nLinux 环境变量有助于定义你的 Linux shell 体验。然而，对于新的 Linux 用户来说，这可能是一个令人困惑的话题。许多程序和脚本使用环境变量获取系统信息并存储临时数据和配置信息。Linux\
  \ 系统中有许多设置环境变量的地方，了解这些位置至关重要。本章将带你进入 Linux 环境变量的世界，展示它们在哪里、如何使用它们，甚至如何创建你自己的环境变量。本章将以一个相关主题结束，即在\
  \ shell 会话中定义和使用别名。\n\n## 什么是环境变量？\nbash shell 使用了一种名为环境变量的特性来存储有关 shell 会话和工作环境的信息（因此得名环境变量）。该特性还允许你在内存中存储数据，任何从\
  \ shell 运行的程序或脚本都可以轻松访问。这是一种存储标识用户账户、系统、shell 或任何你需要存储的特征的持久数据的方便方法。\n\nbash shell\
  \ 中有两种类型的环境变量：\n- 全局变量\n- 局部变量\n\n本节描述了每种环境变量，并展示了如何查看和使用它们。\n\n> 注意\n> 尽管 bash\
  \ shell 使用的是特定的且一致的环境，但不同的 Linux 发行版通常会添加自己的环境变量。在本章中看到的环境变量示例可能与你特定发行版中提供的变量略有不同。如果你遇到了此处未涵盖的环境变量，请检查你的\
  \ Linux 发行版的文档。\n\n## 全局环境变量\n全局环境变量在 shell 会话中以及 shell 启动的任何子进程中均可见。局部变量仅在创建它的\
  \ shell 中可用。这使得全局环境变量在需要来自父进程信息的子进程应用程序中非常有用。\n\nLinux 系统在你启动 bash 会话时会设置几个全局环境变量（有关那时启动了哪些变量的细节，请参见本章后面的“定位系统环境变量”部分）。系统环境变量始终使用大写字母，以区别于普通用户环境变量。\n\
  \n要查看全局环境变量，请使用 `printenv` 命令：\n\n```\n$printenv\nORBIT_SOCKETDIR=/tmp/orbit-user\n\
  HOSTNAME=localhost.localdomain\nIMSETTINGS_INTEGRATE_DESKTOP=yes\nTERM=xterm\nSHELL=/bin/bash\n\
  XDG_SESSION_COOKIE=787b3cf537971ef8462260960000006b-1284670942.440386-1012435051\n\
  HISTSIZE=1000\nGTK_RC_FILES=/etc/gtk/gtkrc:/home/user/.gtkrc-1.2-gnome2\nWINDOWID=29360131\n\
  GNOME_KEYRING_CONTROL=/tmp/keyring-Egjauk\nIMSETTINGS_MODULE=none\nUSER=user\nLS_COLORS=rs=0:di=01;34:ln=01;36:mh=00:pi=40;33:so=01;35:do=01;35:\n\
  bd=40;33;01:cd=40;33;01:or=40;31;01:mi=01;05;37;41:su=37;41:sg=30;43\n...\nSSH_AUTH_SOCK=/tmp/keyring-Egjauk/ssh\n\
  SESSION_MANAGER=local/unix:@/tmp/.ICE-unix/1331,unix/unix:/tmp/.ICE-unix/1331\n\
  USERNAME=user\nDESKTOP_SESSION=gnome\nMAIL=/var/spool/mail/user\nPATH=/usr/kerberos/sbin:/usr/kerberos/bin:/usr/local/bin:/usr/bin:\n\
  /bin:/usr/local/sbin:/usr/sbin:/sbin:/home/user/bin\nQT_IM_MODULE=xim\nPWD=/home/user/Documents\n\
  XMODIFIERS=@im=none\nGDM_KEYBOARD_LAYOUT=us\nLANG=en_US\nIMSETTINGS_INTEGRATE_DESKTOP=yes\n\
  TERM=xterm\nSHELL=/bin/bash\nUSER=user\n...\n```\n\n```bash\nUSERNAME=user\nDESKTOP_SESSION=gnome\n\
  ...\n```)\n\n## 局部环境变量\n局部变量仅在创建它的 shell 中可用。这使得全局环境变量在需要来自父进程信息的子进程应用程序中非常有用。（注意：提供的文本在描述局部变量时中断了）。\n\
  \n\n\n\n\n```bash\n`HISTFILE=/home/user/.bash_history`\n`HISTFILESIZE=1000`\n`HISTSIZE=1000`\n\
  `HOME=/home/user`\n`HOSTNAME=localhost.localdomain`\n`HOSTTYPE=i386`\n`IFS=$'\\\
  t\\n'`\n`IMSETTINGS_INTEGRATE_DESKTOP=yes`\n`IMSETTINGS_MODULE=none`\n`LANG=en_US.utf8`\n\
  `LESSOPEN='|/usr/bin/lesspipe.sh %s'`\n`LINES=24`\n`LOGNAME=user`\n`LS_COLORS='rs=0:di=01;34:ln=01;36:mh=00:pi=40;33:so=01;35:do=01;35:bd=40;33;01:cd=40;33;01:or=40;31;01:mi=01;05;37;41:su=37;41:sg=30;43...'`\n\
  `MACHTYPE=i386-redhat-linux-gnu`\n`MAIL=/var/spool/mail/user`\n`MAILCHECK=60`\n\
  `OLDPWD=/home/user`\n`OPTERR=1`\n`OPTIND=1`\n`ORBIT_SOCKETDIR=/tmp/orbit-user`\n\
  `OSTYPE=linux-gnu`\n`PATH=/usr/kerberos/sbin:/usr/kerberos/bin:/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin:/home/user/bin`\n\
  `PIPESTATUS=([0]=\"0\")`\n`PPID=1674`\n`PROMPT_COMMAND='echo -ne \"\\033]0;${USER}@${HOSTNAME%%.*}:${PWD/#$HOME/~}\"\
  ;}\"; echo -ne \"\\007\"'\n`PS1='[\\u@\\h \\W]\\$ '`\n`PS2='> '`\n`PS4='+ '`\n`PWD=/home/user/Documents`\n\
  `QT_IM_MODULE=xim`\n`SESSION_MANAGER=local/unix:@/tmp/.ICE-unix/1331,unix/unix:/tmp/.ICE-unix/1331`\n\
  `SHELL=/bin/bash`\n`SHELLOPTS=braceexpand:emacs:hashall:histexpand:history:interactive-comments:monitor`\n\
  `SHLVL=2`\n`SSH_ASKPASS=/usr/libexec/openssh/gnome-ssh-askpass`\n`SSH_AUTH_SOCK=/tmp/keyring-Egjauk/ssh`\n\
  `TERM=xterm`\n`UID=500`\n`USER=user`\n`USERNAME=user`\n`WINDOWID=29360131`\n`WINDOWPATH=1`\n\
  `XAUTHORITY=/var/run/gdm/auth-for-user-GIU7sE/database`\n`XDG_SESSION_COOKIE=787b3cf537971ef8462260960000006b-1284670942.440386-1012435051`\n\
  `XMODIFIERS=@im=none`\n`_=printenv`\n`colors=/etc/DIR_COLORS`\n```\n\n```bash\n\
  __udisks ()\n{\n    local IFS='';\n    local cur=\"${COMP_WORDS[COMP_CWORD]}\"\n\
  \    if [ \"${COMP_WORDS[$(($COMP_CWORD - 1))]}\" = \"--show-info\" ]; then\n  \
  \      COMPREPLY=($(compgen -W \"$(udisks --enumerate-device-files)\" -- $cur));\n\
  \    else\n        if [ \"${COMP_WORDS[$(($COMP_CWORD - 1))]}\" = \"--inhibit-polling\"\
  \ ]; then\n            ...\n        fi;\n    fi;\n    fi\n}\n```\n\n```bash\ncommand_not_found_handle\
  \ ()\n{\n    runcnf=1;\n    retval=127;\n    [ ! -S /var/run/dbus/system_bus_socket\
  \ ] && runcnf=0;\n    [ ! -x /usr/sbin/packagekitd ] && runcnf=0;\n    if [ $runcnf\
  \ -eq 1 ]; then\n        /usr/libexec/pk-command-not-found $1;\n        retval=$?;\n\
  \    else\n        echo \"bash: $1: command not found\";\n    fi;\n    return $retval\n\
  }\n```\n\n你会发现，通过 `printenv` 命令看到的所有全局环境变量出现在 `set` 命令的输出中。然而，现在又出现了许多额外的环境变量。这些是本地环境变量。\n\
  \n## 设置环境变量\n\n你可以直接从 bash shell 设置你自己的环境变量。本节将向你展示如何创建自己的环境变量，并从交互式 shell 或 shell\
  \ 脚本中引用它们。\n\n## 设置本地环境变量\n\n一旦启动了 bash shell（或启动了 shell 脚本），你就可以创建在 shell 进程中可见的局部变量。你可以通过等号将变量赋值为值，从而为环境变量分配数值或字符串值：\n\
  \n```bash\n$ test=testing\n$ echo $test\ntesting\n```\n\n这很简单！现在，每当你需要引用 `test`\
  \ 环境变量的值时，只需通过名称 `$test` 进行引用即可。\n\n如果你需要引用 `test` 环境变量的值，只需通过名称 `$test` 进行引用即可。\n\
  \n```bash\n$ test=testing\n$ echo $test\ntesting\n```\n\n如果你需要引用 `test` 环境变量的值，只需通过名称\
  \ `$test` 进行引用即可。\n\n```bash\n$ test=testing\n$ echo $test\ntesting\n```\n\n如果你需要引用\
  \ `test` 环境变量的值，只需通过名称 `$test` 进行引用即可。\n\n```bash\n$ test=testing\n$ echo $test\n\
  testing\n```\n\n\n\n\n\n`bash` shell 默认使用某些特定的环境变量来定义系统环境。你可以始终认为这些变量在你的 Linux 系统上已经设置好了。由于\
  \ `bash` shell 是原始 Unix Bourne shell 的派生版本，它也包含了最初在那个 shell 中定义的环境变量。\n\n表 5.1 显示了\
  \ `bash` shell 与原始 Unix Bourne shell 兼容的环境变量。\n\n### bash Shell Bourne 变量\n\n| 变量\
  \ | 说明 |\n| :--- | :--- |\n| `CDPATH` | 一个用冒号分隔的目录列表，用作 `cd` 命令的搜索路径。 |\n| `HOME`\
  \ | 当前用户的家目录。 |\n| `IFS` | 字符列表，用于 shell 分割文本字符串的字段分隔。 |\n| `MAIL` | 当前用户邮箱的文件名。`bash`\
  \ shell 会检查此文件以获取新邮件。 |\n| `MAILPATH` | 一个用冒号分隔的多个当前用户邮箱的文件名列表。`bash` shell 会检查此列表中的每个文件是否有新邮件。\
  \ |\n| `OPTARG` | 由 `getopts` 命令处理的最后一个选项参数的值。 |\n| `OPTIND` | 由 `getopts` 命令处理的最后一个选项参数的索引值。\
  \ |\n| `PATH` | 一个用冒号分隔的目录列表，shell 在其中查找命令。 |\n| `PS1` | 主级 shell 命令行界面提示符字符串。 |\n\
  | `PS2` | 次级 shell 命令行界面提示符字符串。 |\n\n到目前为止，列表中最重要的环境变量是 `PATH` 变量。当你在 shell 命令行界面\
  \ (CLI) 中输入命令时，shell 必须搜索系统以找到程序。`PATH` 变量定义了它查找命令的目录。在我的 Linux 系统上，`PATH` 变量如下：\n\
  \n```bash\n$ echo $PATH\n/usr/kerberos/sbin:/usr/kerberos/bin:/usr/local/bin:/usr/bin:/\n\
  /bin:/usr/local/sbin:/usr/sbin:/sbin:/home/user/bin\n$\n```\n\n这显示 shell 有六个查找命令的目录。`PATH`\
  \ 中的每个目录都用冒号分隔。`PATH` 变量末尾没有指示目录列表结束的符号。你只需通过添加另一个冒号以及新目录即可向 `PATH` 添加其他目录。`PATH`\
  \ 还显示了它查找命令的顺序。\n\n除了默认的 Bourne 环境变量外，`bash` shell 还提供了几个自己的变量，如表 5.2 所示。\n\n###\
  \ bash Shell 环境变量\n\n| 变量 | 说明 |\n| :--- | :--- |\n| `BASH` | 执行当前 `bash` shell\
  \ 实例的完整路径。 |\n| `BASH_ALIASES` | 当前设置的别名的关联数组。 |\n| `BASH_ARGC` | 变量数组，包含传递给子程序或\
  \ shell 脚本的参数个数。 |\n| `BASH_ARCV` | 变量数组，包含传递给子程序或 shell 脚本的参数。 |\n| `BASH_CMDS`\
  \ | shell 已执行的命令位置的关联数组。 |\n| `BASH_COMMAND` | 当前正在执行或即将执行的 shell 命令。 |\n| `BASH_ENV`\
  \ | 如果设置时，每个 bash 脚本在运行之前都会尝试执行一个由该变量定义的启动文件。 |\n| `BASH_EXECUTION_STRING` | 使用\
  \ `bash -c` 选项传递的命令。 | || `BASH_LINENO` | 变量数组，包含当前执行的 shell 函数的源代码行号。 |\n| `BASH_REMATCH`\
  \ | 只读变量数组，包含用于正则表达式比较运算符 `=∼` 进行正向匹配的模式及其子模式。 |\n| `BASH_SOURCE` | 变量数组，包含当前执行的\
  \ shell 函数的源代码文件名。 |\n| `BASH_SUBSHELL` | 当前子 shell 环境的嵌套层级。初始值为 0。 |\n| `BASH_VERSION`\
  \ | 当前 `bash` shell 实例的版本号。 |\n| `BASH_VERSINFO` | 变量数组，包含当前 `bash` shell 实例的各个主版本和次要版本号。\
  \ |\n| `BASH_XTRACEFD` | 如果设置为有效的文件描述符 (0,1,2)，则可以将从 `set -x` 调试选项生成的跟踪输出重定向。这通常用于将跟踪输出分离到文件中。\
  \ |\n| `BASHOPTS` | 当前启用的 bash shell 选项列表。 |\n| `BASHPID` | 当前 `bash` 进程的进程进程 ID\
  \ (PID)。 |\n| `COLUMNS` | 包含当前 `bash` shell 实例所使用的终端宽度。 |\n| `COMP_CWORD` | 变量 `COMP_WORDS`\
  \ 的索引，该变量包含当前光标位置。 |\n| `COMP_LINE` | 当前命令行。 |\n| `COMP_POINT` | 当前光标位置相对于当前命令起始部分的索引。\
  \ |\n| `COMP_KEY` | 用于触发补全的最后一个键。 |\n| `COMP_TYPE` | 代表补全类型的整数值。 |\n| `WORDDBREAKS`\
  \ | Readline 单词分隔符。 |\n| `COMP_WORDS` | 命令行上各个单词的数组。 |\n| `COMPREPLY` | 包含生成的可能补全代码的变量数组。\
  \ |\n| `DIRSTACK` | 目录内容的数组。 |\n| `EMACS` | 当设置为 `t` 时，表示 emacs 缓冲区已禁用。 |\n| `EUID`\
  \ | 用户的数值有效用户 ID。 |\n| `FCEDIT` | `fc` 使用的默认编辑器。 |\n| `FIGNORE` | 在文件名扩展期间忽略的后缀列表，用冒号分隔。\
  \ |\n| `FUNCNAME` | 当前执行函数的名称。 |\n| `GLOBIGNORE` | 定义文件名扩展时要忽略的文件名集的模式列表，用冒号分隔。\
  \ |\n| `GROUPS` | 包含用户所属组列表的变量数组。 |\n| `histchars` | 最多三个字符，控制历史记录。 |\n| `HISTCMD`\
  \ | 当前命令的历史编号。 |\n| `HISTCONTROL` | 控制哪些命令被输入到历史列表中。 |\n| `HISTFILE` | 保存历史列表的文件名（默认为\
  \ `.bash_history`）。 |\n| `HISTFILESIZE` | 历史记录文件中保存的最大行数。 |\n| `HISTIGNORE` | 用于决定哪些命令在历史文件中被忽略的模式列表，用冒号分隔。\
  \ |\n| `HISTSIZE` | 历史记录文件中存储的最大命令数。 |\n| `HOSTFILE` | 包含 shell 需要补全主机名时应读取的文件名。\
  \ |\n| `HOSTNAME` | 当前的主机名。 |\n| `HOSTTYPE` | 描述 bash shell 运行机器的字符串。 |\n| `IGNOREEOF`\
  \ | shell 在退出前必须接收的连续 EOF 字符数。如果此值不存在，默认值为 1。 |\n| `INPUTRC` | Readline 初始化文件名（默认是\
  \ `.inputrc`）。 |\n| `LANG` | shell 的语言区域类别。 |\n| `LC_ALL` | 覆盖 `LANG` 变量，定义一个语言区域。\
  \ |\n| `LC_COLLATE` | 设置排序字符串值时使用的排序顺序。 |\n| `LC_CTYPE` | 决定文件名扩展和模式匹配中使用的字符解释。\
  \ |\n| `LC_MESSAGES` | 决定解释由美元符号引导的双引号字符串时使用的语言区域设置。 |\n| `LC_NUMERIC` | 决定格式化数字时使用的语言区域设置。\
  \ |\n| `LINENO` | 当前执行脚本中的行号。 |\n| `LINES` | 定义终端上的可用行数。 |\n\n\n\n\n\n| `MACHTYPE`\
  \ | 一个以 `cpu-company-system` 格式定义系统类型的字符串。 |\n| `MAILCHECK` | shell 检查新邮件的频率（秒，默认为\
  \ 60）。 |\n| `OLDPWD` | 在 shell 中使用的上一个工作目录。 |\n| `OPTERR` | 如果设置为 1，bash shell 会显示\
  \ `getopts` 命令生成的错误。 |\n| `OSTYPE` | 一个定义 shell 运行的操作系统的字符串。 |\n| `PIPESTATUS` |\
  \ 一个变量数组，包含前台进程中进程退出状态值列表。 |\n| `POSIXLY_CORRECT` | 如果设置，bash 将以 POSIX 模式启动。 |\n\
  | `PPID` | bash shell 父进程的进程 ID (PID)。 |\n| `PROMPT_COMMAND` | 如果设置，则在显示主提示符之前执行的命令。\
  \ |\n| `PROMPT_DIRTRIM` | 整数，用于指定在使用 `\\w` 和 `\\W` 提示符字符串转义字符时显示的末尾目录数量。被移除的目录名将用一组省略号替换。\
  \ |\n| `PS3` | `select` 命令使用的提示符。 |\n| `PS4` | 当使用 bash `-x` 参数时，在回显命令行之前显示的提示符。\
  \ |\n| `PWD` | 当前工作目录。 |\n| `RANDOM` | 返回一个 0 到 32767 之间的随机数。为此变量赋值会为随机数生成器的种子。\
  \ |\n| `REPLY` | `read` 命令的默认变量。 |\n| `SECONDS` | 自 shell 启动以来秒数。为此变量赋值会将计时器重置为该值。\
  \ |\n| `SHELL` | bash shell 的完整路径。 |\n| `SHELLOPTS` | 已启用的 bash shell 选项的冒号分隔列表。\
  \ |\n| `SHLVL` | 表示 shell 级别，每启动一个新的 bash shell 加 1。 |\n| `TIMEFORMAT` | 指定 shell\
  \ 如何显示时间值的格式。 |\n| `TMOUT` | `select` 和 `read` 命令等待输入的时间（秒）。默认值 0 表示无限等待。 |\n| `TMPDIR`\
  \ | bash shell 创建临时文件使用的目录名。 |\n| `UID` | 当前用户的数字真实用户 ID。 |\n\n你可能会发现，当使用 `set`\
  \ 命令时，并不是所有的默认环境变量都会显示。其原因是尽管这些是默认环境变量，但并非所有变量都必须包含值。\n\n## 设置 PATH 环境变量\n\n`PATH`\
  \ 环境变量在 Linux 系统上似乎引起的问题最多。它定义了 shell 在哪里查找你在命令行上输入的命令。如果它找不到该命令，它会产生一条错误消息：\n\n\
  ```bash\n$ myprog\n-bash: myprog: command not found\n$\n```\n\n问题在于，应用程序通常将它们的可执行程序放在不在\
  \ `PATH` 环境变量中的目录中。技巧是确保你的 `PATH` 环境变量包含了你应用程序所在的所有目录。\n\n你可以将新的搜索目录添加到现有的 `PATH`\
  \ 环境变量中，而无需从头构建。`PATH` 中列出的各个目录由冒号分隔。你只需要引用原始 `PATH` 值并向字符串中添加任何新目录。它看起来像这样：\n\n\
  ```bash\n$ echo $PATH\n/usr/kerberos/sbin:/usr/kerberos/bin:/usr/local/bin:/usr/bin:/\n\
  /bin:/usr/local/sbin:/usr/sbin:/sbin:/home/user/bin\n$ PATH=$PATH:/home/user/test\n\
  $ echo $PATH\n/usr/kerberos/sbin:/usr/kerberos/bin:/usr/local/bin:/usr/bin:/\n/bin:/usr/local/sbin:/usr/sbin:/sbin:/home/user/bin:/home/user/test\n\
  $ myprog\nThe factorial of 5 is 120.\n$\n```\n\n通过将目录添加到 `PATH` 环境变量中，你现在可以从虚拟目录结构的任何地方执行你的程序：\n\
  \n```bash\n[user@localhost ~]$ cd /etc\n[user@localhost etc]$ myprog\nThe factorial\
  \ of 5 is 120\n[user@localhost etc]$\n```\n\n程序员的一个常用技巧是在 `PATH` 环境变量中包含单点符号 `.`。单点符号表示当前目录（见第\
  \ 3 章）：\n\n```bash\n[user@localhost ~]$ PATH=$PATH:.\n[user@localhost ~]$ cd test2\n\
  [user@localhost test2]$ myprog2\nThe factorial of 6 is 720\n[user@localhost test2]$\n\
  ```\n\n在下一节中，你将看到如何在系统上对环境变量进行永久更改，以便你始终能够执行你的程序。\n\n## 定位系统环境变量\n\nLinux 系统使用环境变量在程序和脚本中标识自己。这为你的程序获取系统信息提供了一种方便的方法。技巧在于这些环境变量是如何设置的。\n\
  \n当你通过登录 Linux 系统来启动 bash shell 时，默认情况下 bash 会检查几个文件以获取命令。这些文件被称为启动文件。bash 处理的启动文件取决于你启动\
  \ bash shell 的方法。启动 bash shell 有三种方式：\n\n*   作为登录时的默认登录 shell\n*   作为非登录 shell 的交互式\
  \ shell\n*   作为运行脚本的非交互式 shell\n\n接下来的章节描述了 bash shell 在这些启动方法中执行的启动文件。\n\n### 登录\
  \ shell (Login Shell)\n\n当你登录 Linux 系统时，bash shell 作为登录 shell 启动。登录 shell 会查找四个不同的启动文件来处理命令。以下是\
  \ bash 处理这些文件的顺序：\n\n* `/etc/profile`\n* `$HOME/.bash_profile`\n* `$HOME/.bash_login`\n\
  * `$HOME/.profile`\n\n`/etc/profile` 文件是系统中 bash shell 的主要默认启动文件。系统上的每个用户在登录时都会执行此启动文件。其他三个启动文件是针对每个用户特定的，并且可以根据每个用户的需求进行自定义。让我们仔细观察这些文件。\n\
  \n### /etc/profile 文件\n\n`/etc/profile` 文件是 bash 的主要默认启动文件。每当你登录 Linux 系统时，bash\
  \ 都会执行 `/etc/profile` 启动文件中的命令。不同的 Linux 发行版在该文件中放置不同的命令。在当前 Linux 系统上，它看起来是这样的：\n\
  \n```bash\n$ cat /etc/profile\n## /etc/profile\n### System wide environment and\
  \ startup programs, for login setup\n### Functions and aliases go in /etc/bashrc\n\
  # It's NOT a good idea to change this file unless you know what you\n# are doing.\
  \ Much better way is to create custom.sh shell script\n# in /etc/profile.d/ to make\
  \ custom changes. This will\n# prevent merging in future.\n... (省略部分内容)\npathmunge()\
  \ {\n  case $PATH in\n    *:*)\n      if [ \"$2\" = \"after\" ]; then\n        PATH=$1\n\
  \      else\n        PATH=$PATH:$1\n      fi\n  esac\n}\nif [ -x /id ]; then\n \
  \ if [ -z \"$EUID\" ]; then\n    # ksh around\n    EUID='id -u'\n    UID='id -ru'\n\
  \  fi\n  USER=\"id -un\"\n  LOGNAME=$USER\n  MAIL=\"/var/mail/$USER\"\nfi\n## Path\
  \ manipulation\nif [ \"$EUID\" = \"0\" ]; then\n  pathmunge /sbin\n  pathmunge /usr/sbin\n\
  \  pathmunge /usr/local/sbin\nelse\n  pathmunge /usr/local/sbin after\n  pathmunge\
  \ /usr/sbin after\n  pathmunge /sbin after\nfi\nHOSTNAME='/bin/hostname 2>/dev/null'\n\
  HISTSIZE=1000\nif [ \"$HISTCONTROL\" = \"ignorespace\" ]; then\n  export HISTCONTROL=ignoreboth\n\
  else\n  export HISTCONTROL=ignoredups\nfi\nexport PATH USER LOGNAME MAIL HOSTNAME\
  \ HISTSIZE HISTCONTROL\nfor i in /etc/profile.d/*.sh; do\n  if [ -r \"$i\" ]; then\n\
  \    if [ \"$PS1\" ]; then\n      . $i\n    else\n      . $i >/dev/null 2>&1\n \
  \   fi\n  fi\ndone\nunset i\nunset pathmunge\n\n$\n```\n\n\n\n\n你在此文件中看到的大多数命令和脚本在第\
  \ 10 章中会有更详细的介绍。现在需要注意的是在此启动文件中设置的环境变量。注意文件底部的 `export` 行：\n\n```bash\nexport PATH\
  \ USER LOGNAME MAIL HOSTNAME HISTSIZE HISTCONTROL\n```\n\n这确保了这些环境变量对于从登录 shell\
  \ 产生的所有子进程都是的。\n\nprofile 文件还使用了另一个复杂的特性。其中有一个 `for` 语句会遍历位于 `/etc/profile.d` 目录中的任何文件（`for`\
  \ 语句将在第 12 章中详细讨论）。这为 Linux 系统提供了一个放置特定应用程序启动文件的地方，这些文件会在你登录时由 shell 执行。在这个 Linux\
  \ 系统上，`profile.d` 目录下包含以下文件：\n\n```bash\n$ ls -l /etc/profile.d\ntotal 72\n-rw-r--r--.\
  \ 1 root root 1133 Apr 28 10:43 colorls.csh\n-rw-r--r--. 1 root root 1143 Apr 28\
  \ 10:43 colorls.sh\n-rw-r--r--. 1 root root 192 Sep 9 2004 glib2.csh\n-rw-r--r--.\
  \ 1 root root 192 Dec 12 2005 glib2.sh\n-rw-r--r--. 1 root root 58 May 31 06:23\
  \ gnome-ssh-askpass.csh\n-rw-r--r--. 1 root root 70 May 31 06:23 gnome-ssh-askpass.sh\n\
  -rw-r--r--. 1 root root 184 Aug 25 11:36 krb5-workstation.csh\n-rw-r--r--. 1 root\
  \ root 57 Aug 25 11:36 krb5-workstation.sh\n-rw-r--r--. 1 root root 1741 Jun 24\
  \ 15:20 lang.csh\n-rw-r--r--. 1 root root 2706 Jun 24 15:20 lang.sh\n-rw-r--r--.\
  \ 1 root root 122 Feb 7 2007 less.csh\n-rw-r--r--. 1 root root 108 Feb 7 2007 less.sh\n\
  -rw-r--r--. 1 root root 837 Sep 2 05:24 PackageKit.sh\n-rw-r--r--. 1 root root 2142\
  \ Aug 10 16:41 udisks-bash-completion.sh\n-rw-r--r--. 1 root root 74 Mar 25 19:24\
  \ vim.csh\n-rw-r--r--. 1 root root 248 Mar 25 19:24 vim.sh\n-rw-r--r--. 1 root root\
  \ 161 Nov 27 2007 which2.csh\n-rw-r--r--. 1 root root 169 Nov 27 2007 which2.sh\n\
  $\n```\n\n你会注意到这些文件大多与系统上的特定应用程序有关。大多数应用程序创建两个启动文件，一个用于 bash shell（使用 `.sh` 扩展名），另一个用于\
  \ c shell（使用 `.csh` 扩展名）。\n\n`lang.csh` 和 `lang.sh` 文件尝试确定系统使用的默认语言字符集，并恰当地设置 `LANG`\
  \ 环境变量。\n\n### $HOME 启动文件\n\n剩下的三个启动文件都用于相同的功能——提供一个用户特定的启动文件，用于定义用户特定的环境变量。大多数\
  \ Linux 发行版仅使用这三个启动文件之一：\n\n* `$HOME/.bash_profile`\n* `$HOME/.bash_login`\n* `$HOME/.profile`\n\
  \n注意这三个文件都以点开头，这意味着它们是隐藏文件（它们不会出现在普通的 `ls` 命令中）。因为它们位于用户的 `HOME` 目录中，每个用户都可以编辑这些文件并添加自己的环境变量，这些变量会在启动的每个\
  \ bash 会话中生效。此 Linux 系统包含以下 `.bash_profile` 文件：\n\n```bash\ncat .bash_profile\n\
  ## .bash_profile\n## Get the aliases and functions\nif [ -f ~/.bashrc ]; then\n\
  \    ~/.bashrc\nfi\n## User specific environment and startup programs\nPATH=$PATH:$HOME/bin\n\
  export PATH\n$\n```\n\n`.bash_profile` 启动文件首先检查 `HOME` 目录下是否存在另一个名为 `.bashrc` 的启动文件（我们将在“交互式\
  \ shell”部分中讨论它）。如果存在，启动文件将执行其中的命令。接下来，启动文件会向 `PATH` 环境变量添加一个目录，为在你的 `HOME` 目录中放置可执行文件提供一个公共位置。\n\
  \n### 交互式 shell\n\n如果你在没有登录系统的情况下启动了 bash shell（例如在 CLI 提示符处输入 `bash`），你启动的就是所谓的交互式\
  \ shell。交互式 shell 的行为不像登录 shell，但它仍然为你提供了一个 CLI 提示符来输入命令。如果 bash 作为交互式 shell 启动，它不会处理\
  \ `/etc/profile` 文件。相反，它会检查用户 `HOME` 目录下的 `.bashrc` 文件。在这个 Linux 发行版上，该文件看起来如下：\n\
  \n```bash\ncat .bashrc\n## .bashrc\n### Source global definitions\nif [ -f /etc/bashrc\
  \ ]; then\n    .etc/bashrc\nfi\n### User specific aliases and functions\n$\n```\n\
  \n`.bashrc` 文件做两件事。首先，它检查 `/etc` 目录下的通用 bashrc。其次，它为用户输入个人别名（稍后在“使用别名”部分讨论）和私有脚本函数（在第\
  \ 16 章描述）提供了一个位置。通用的 `/etc/bashrc` 启动文件由系统中启动交互式 shell 的所有人运行。在这个 Linux 发行版上，它看起来如下：\n\
  \n```bash\ncat /etc/bashrc\n## /etc/bashrc\n### System wide functions and aliases\n\
  ### Environment stuff goes in /etc/profile\n# It's NOT good idea to change this\
  \ file unless you know what you are doing.\n# Much better way is to create custom.sh\
  \ shell script in\n# /etc/profile.d/ to make custom changes to environment. This\
  \ will\n# prevent need for merging in future updates.\n### By default, we want this\
  \ to get set.\n### Even for non-interactive, non-login shells.\n### Current threshold\
  \ for system reserved uid/gids is 200\n# You could check uidgid reservation validity\
  \ in\n# /usr/share/doc/setup-*/uidgid file\nif [ $UID -gt 199 ] && [ 'id -gn' =\
  \ 'id-un' ]; then\n    umask 002\nelse\n    umask 022\nfi\n### are we an interactive\
  \ shell?\nif [ \"$PS1\" ]; then\n    case $TERM in\nxterm*)\n        if [ -e /etc/sysconfig/bash-prompt-xterm\
  \ ]; then\n            PROMPT_COMMAND=/etc/sysconfig/bash-prompt-xterm\n       \
  \ else\n            PROMPT_COMMAND=echo -ne \"\\033]${USER}@${HOSTNAME%%}:${PWD/#$HOME}/\"\
  ;\\007\"\n        fi\n        ;;\n    screen)\n        if [ -e /etc/sysconfig/bash-prompt-screen\
  \ ]; then\n            PROMPT_COMMAND=/etc/sysconfig/bash-prompt-screen\n      \
  \  else\n            PROMPT_COMMAND=echo -ne \"\\033_${USER}@${HOSTNAME%%}:${PWD/#$HOME}/\\\
  033\"\n        fi\n        ;;\n    *)\n        [ -e /etc/sysconfig/bash-prompt-default\
  \ ] && PROMPT_COMMAND=/etc/sysconfig/bash-prompt-default\n        ;;\n    esac\n\
  \    # Turn on winsize\n    shopt -s winsize\n    [ \"$PS1\" = \"\\w\\$ ] && PS1=\"\
  [@h \\W]\"\n    # You might want to have tty in prompt (e.g. more virtual machines)\n\
  \    # and console windows\n    # If you want to do so, just add e.g.\n    # if\
  \ [ \"$PS1\" ]; then\n    #   PS1=\"[@h:\\1 \\W]\"\n    # fi\n    # to your custom\
  \ modification shell script in /etc/profile.d/ directory\nfi\nif ! shopt -q login_shell;\
  \ then # We're not a login shell\n    # Need to redefine pathmunge, it's undefined\
  \ at the end of /etc/profile\n    pathmunge () {\n        case \":${PATH}:\" in\n\
  \            *:\"$1\":*)\n                ;;\n            *)\n                if\
  \ [ \"$2\" = \"after\" ]; then\n                    PATH=$PATH:$1\n            \
  \    else\n                    PATH=$1:$PATH\n                fi\n            fi\n\
  \        esac\n    }\n    # Only display echos from profile.d scripts if we are\
  \ no login shell\n    # and otherwise just process them to set env\n    for i in\
  \ /etc/profile.d/*.sh; do\n        if [ -r \"$i\" ]; then\n            if [ \"$PS1\"\
  \ ]; then\n                .$i\n            else\n                .$i >/dev/null\
  \ 2>&1\n            fi\n        fi\n    done\n    unset i\n    unset pathmunge\n\
  fi\n### vim:ts=4:sw=4\n```\n\n\n\n\n\n默认文件设置了几个环境变量，但注意它并没有使用 `export` 命令将它们设置为全局变量。记住，交互式\
  \ shell 启动文件会在每次启动新的交互式 shell 时运行；因此，任何子 shell 都会自动执行交互式 shell 启动文件。\n\n还会注意到 `/etc/bashrc`\
  \ 文件也会执行位于 `/etc/profile.d` 目录下的特定应用程序启动文件。\n\n### 非交互式 Shell\n\n最后，最后一种 shell 是非交互式\
  \ shell。这是系统为了执行 shell 脚本而启动的 shell。与之前的不同之处在于，它不需要担心 CLI 提示符。然而，你可能仍然希望每次在系统上启动脚本时运行某些特定的启动命令。\n\
  \n为了适应这种情况，bash shell 提供了 `BASH_ENV` 环境变量。当 shell 启动非交互式 进程时，它会检查此环境变量以获取要执行启动文件名。如果存在，shell\
  \ 将执行文件中的命令。在我们使用的 Linux 发行版中，默认没有设置此环境变量值。\n\n### 变量数组\n\n环境变量的一个非常酷的特性是它们可以当作数组使用。数组是可以包含多个值的变量。值可以单独引用，也可以作为整个数组整体引用。\n\
  \n要为环境变量设置多个值，只需将它们列在括号中，并用空格分隔每个值：\n\n```bash\n$ mytest=(one two three four five)\n\
  $\n```\n\n这没没什么令人兴奋的。如果你尝试像显示普通环境变量一样显示数组，你会感到失望的：\n\n```bash\n$ echo $mytest\n\
  one\n$\n```\n\n只出现了数组中的第一个值。要引用单个数组元素，必须使用数值索引值，该值代表它在数组中的位置。数值包含在方括号中：\n\n```bash\n\
  $ echo ${mytest[2]}\nthree\n$\n```\n\n> **注意**\n> 环境变量数组的索引值从零开始。这通常会引起困惑。\n\n要显示整个数组变量，你使用星号通配符作为索引值：\n\
  \n```bash\n$ echo ${mytest[*]}\none two three four five\n$\n```\n\n你也可以更改单个索引位置的值：\n\
  \n```bash\n$ mytest[2]=seven\n$ echo ${mytest[*]}\none two seven four five\n$\n\
  ```\n\n你甚至可以使用 `unset` 命令删除数组中的单个值，但要小心，因为这很复杂。看这个例子：\n\n```bash\n$ unset mytest[2]\n\
  $ echo ${mytest[*]}\none two four five\n$\n$ echo ${mytest[2]}\n$ echo ${mytest[3]}\n\
  four\n$\n```\n\n这个示例使用 `unset` 命令删除索引值为 2 的值。当你显示数组时，其他索引值似乎向下移动了一位。然而，如果你专门显示索引值为\
  \ 2 处的数据，你会发现该位置是空的。\n\n最后，你可以通过在 `unset` 命令中使用数组名删除整个数组：\n\n```bash\n$ unset mytest\n\
  $ echo ${mytest[*]}\n$\n```\n\n有时变量数组会让事情变得复杂，因此它们在 shell 编程中经常不使用。它们对其他环境的移植性不好，如果你为不同的\
  \ shell 进行大量的 shell 编程，这是一个缺点。bash 有几个使用数组的环境变量（例如 `BASH_INFO`），但总来说你不会经常遇到它们。\n\
  \n### 使用命令别名\n\n虽然命令别名（alias）不是正式环境变量，但 shell 命令别名的行为非常相似。命令别名允许你为常用命令（以及它们的参数）创建一个别名，以帮助你最少地输入。\n\
  \n很可能，你的 Linux 发行版已经为你设置了一些命令别名。要查看活动别名列表，使用带有 `-p` 参数的 `alias` 命令：\n\n```bash\n\
  $ alias -p\nalias .='ls -d --color=auto'\nalias ll='ls -l --color=auto'\nalias ls='ls\
  \ --color=auto'\nalias vi='vim'\nalias which='alias /usr/bin/which --tty-only --show-dot'\n\
  ```\n\n注意，在这个 Linux 发行版上，别名被用来覆盖标准的 `ls` 命令。它自动提供了 `--color` 参数，表示终端支持颜色。你可以通过 `alias`\
  \ 命令创建自己的别名：\n\n```bash\n$ alias li='ls -il'\n$ li\ntotal 32\n75 drwxr-xr-x 2 user\
  \ user 4096 Sep 16 11 Desktop\n79 drwxr-xr-x 2 user user 4096 Sep 20 15 Documents\n\
  76 drwxr-xr-x 2 user user 4096 Sep 15 30 Downloads\n80 drwxr-xr-x 2 user user 4096\
  \ Sep 15 30 Music\n81 drwxr-xr-x 2 user user 4096 Sep 15 30 Pictures\n78 drwxr-xr-x\
  \ 2 user user 4096 Sep 15 30 Public\n77 drwxr-xr-x 2 user user 4096 Sep 15 30 Templates\n\
  82 drwxr-xr-x 2 user user 4096 Sep 15 30 Videos\n$\n```\n\n一旦你定义了别名值，你就可以在 shell\
  \ 的任何时候使用它，包括在 shell 脚本中。命令别名的作用就像本地环境变量。它们只在定义它们的 shell 进程中有效：\n\n```bash\n$ alias\
  \ li='ls -il'\n$ bash\n$ li\nbash: li: command not found\n$\n```\n\n当然，现在你知道了解决该问题的方法。bash\
  \ shell 在启动新的交互式 shell 时总是会读取 `$HOME/.bashrc` 启动文件。这是放置命令 `alias` 语句的好地方（正如 `.bashrc`\
  \ 文件注释中所指出的）。\n\n## 总结\n\n本章研究了 Linux 环境变量的世界。全局环境变量可以从定义它的进程派生的任何子进程中访问。本地环境变量只能从定义它的进程中访问。\n\
  \nLinux 系统同时使用全局和本地环境变量来存储系统环境信息。你可以从 shell 命令行界面以及 shell 脚本内部访问这些信息。bash shell\
  \ 使用了原始 Unix Bourne shell 中定义的系统环境变量，以及许多新的环境变量。`PATH` 环境变量定义了 bash shell 查找可执行命令时所采用的搜索模式。你可以修改\
  \ `PATH` 环境变量来添加你自己的目录，甚至是当前目录符号，使运行你的程序变得更容易。\n\n你也可以创建你自己的全局和本地环境变量以供自己使用。一旦你创建了环境变量，它在整个\
  \ shell 会话期间都是可访问的。\n\n在 shell 启动时，有几个启动文件是 bash shell 启动时执行的。这些启动文件可以包含环境变量定义，以便为每个\
  \ bash 会话设置标准环境变量。当你登录 Linux 系统时，bash shell 会访问 `/etc/profile` 启动文件，还会为每个用户访问三个本地启动文件：`$HOME/.bash_profile`、`$HOME/.bash_login`\
  \ 和 `$HOME/.profile`。用户可以自定义这些文件，包含他们自己使用的环境变量和启动脚本。\n\nbash shell 还提供了环境变量数组。这些环境变量可以在单个变量中包含多个值。你可以通过引用索引值来单独访问值，也可以通过引用整个环境变量数组名来整体访问值。\n\
  \n最后，本章讨论了命令别名的使用。虽然命令别名不是环境变量，但它们的行为与环境变量非常相似。它们允许你为命令及其参数定义一个别名。你不需要输入长长的命令和参数，只需将其分配给一个简单的别名，并在\
  \ shell 会话的任何时候使用该别名即可。\n\n\n\n\n\n# 理解 Linux 文件权限\n\n## 本章内容\n\n* 理解 Linux 安全\n\
  * 解码权限\n* 组 Linux 组\n\n任何系统如果没有某种形式的安全措施是不完整的。必须有一种机制来保护文件不受未经授权的查看或修改。Linux 系统遵循\
  \ Unix 的文件权限方法，根据每个文件和目录的一组安全设置，允许个人用户和组访问文件。本章将讨论如何使用 Linux 文件安全系统在必要时保护数据，并在需要时共享数据。\n\
  \n## Linux 安全\n\nLinux 安全系统的核心是用户账户。每个访问 Linux 系统的个人都应该分配一个唯一的用户账户。用户对系统对象的权限取决于他们登录时使用的账户。\n\
  \n用户权限通过用户 ID（通常称为 `UID`）进行跟踪，该 ID 在账户创建时被分配给账户。`UID` 是一个数值，对每个用户都是唯一的。然而，你并不是使用\
  \ `UID` 登录 Linux 系统。相反，你使用的是登录名。登录名是一个 8 个字符或更少的数字字母字符串，用户用它登录系统（以及关联的密码）。\n\nLinux\
  \ 系统使用特殊文件和实用来跟踪和管理系统上的用户账户。在讨论文件权限之前，我们需要讨论 Linux 如何处理用户账户。本节描述了用户账户所需的文件和实用程序，以便你能够在处理文件权限时理解如何使用它们。\n\
  \n### /etc/passwd 文件\n\nLinux 系统使用一个特殊文件将登录名与对应的 `UID` 值匹配。这个文件就是 `/etc/passwd`\
  \ 文件。`/etc/passwd` 文件包含了关于用户的几条信息。以下是 Linux 系统上典型的 `/etc/passwd` 文件内容：\n\n```\n\
  cat /etc/passwd\nroot:x:0:0:root:/root:/bin/bash\nbin:x:1:1:bin:/bin:/sbin/nologin\n\
  daemon:x:2:2:daemon:/sbin:/sbin/nologin\nadm:x:3:4:adm:/var/adm:/sbin/nologin\n\
  lp:x:4:7:lp:/var/spool/lpd:/sbin/nologin\nsync:x:5:0:sync:/sbin:/bin/sync\nshutdown:x:6:0:shutdown:/sbin:/sbin/shutdown\n\
  halt:x:7:0:halt:/sbin:/sbin/halt\nmail:x:8:12:mail:/var/spool/mail:/sbin/nologin\n\
  news:x:9:13:news:/etc/news:\nuucp:x:10:14:uucp:/var/spool/uucp:/sbin/nologin\noperator:x:11:0:operator:/root:/sbin/nologin\n\
  games:x:12:100:games:/usr/games:/sbin/nologin\ngopher:x:13:30:gopher:/var/gopher:/sbin/nologin\n\
  ftp:x:14:50:FTP User:/var/ftp:/sbin/nologin\nnobody:x:99:99:Nobody:/:/sbin/nologin\n\
  rpm:x:37:37::/var/lib/rpm:/sbin/nologin\nvcsa:x:69:69:virtual console memory owner:/dev:/sbin/nologin\n\
  mailnull:x:47:47::/var/spool/mqueue:/sbin/nologin\nsmmsp:x:51:51::/var/spool/mqueue:/sbin/nologin\n\
  apache:x:48:48:Apache:/var/www:/sbin/nologin\nrpc:x:32:32:Rpcbind Daemon:/var/lib/rpcbind:/sbin/nologin\n\
  ntp:x:38:38::/etc/ntp:/sbin/nologin\nnscd:x:28:28:NSCD Daemon:/:/sbin/nologin\n\
  tcpdump:x:72:72::/:/sbin/nologin\ndbus:x:81:81:System message bus:/:/sbin/nologin\n\
  avahi:x:70:70:Avahi daemon:/:/sbin/nologin\nhsqldb:x:96:96::/var/lib/hsqldb:/sbin/nologin\n\
  sshd:x:74:74:Privilege-separated SSH:/var/empty/sshd:/sbin/nologin\nrpcuser:x:29:29:RPC\
  \ Service User:/var/lib/nfs:/sbin/nologin\nnfsnobody:x:65534:65534:Anonymous NFS\
  \ User:/var/lib/nfs:/sbin/nologin\nhaldaemon:x:68:68:HAL daemon:/:/sbin/nologin\n\
  xfs:x:43:43:X Font Server:/etc/X11/fs:/sbin/nologin\ngdm:x:42:42::/var/gdm:/sbin/nologin\n\
  rich:x:500:500:Rich Blum:/home/rich:/bin/bash\nmama:x:501:501:Mama:/home/mama:/bin/bash\n\
  katie:x:502:502:katie:/home/katie:/bin/bash\njessica:x:503:503:Jessica:/home/jessica:/bin/bash\n\
  mysql:x:27:27:MySQL Server:/var/lib/mysql:/bin/bash\n$\n```\n\n`root` 用户账户始终被分配\
  \ `0`。如你所见，`/etc/passwd` 文件包含不仅是登录名和 `UID`。Linux 将 500 以下的 UID 预留给系统账户。`/etc/passwd`\
  \ 文件包含以下：\n\n* 登录名\n* 密码\n* 数值 `UID`\n* 数值组 ID (`GID`)\n* 用户的文本描述（注释字段）\n* `HOME`\
  \ 目录的位置\n* 默认 shell\n\n`/etc/passwd` 中的密码字段被设为 `x`。在过去，`/etc/passwd` 文件包含密码的加密版本。然而，由于许多程序需要访问它，这成了一个安全问题。随着可以轻松解密密码的软件出现，Linux\
  \ 开发者需要重新考虑该策略。\n\n现在，大多数 Linux 系统将 `/etc/passwd` 文件看作一个标准文本文件。你可以使用任何文本编辑器直接在 `/etc/passwd`\
  \ 文件中手动执行用户管理功能（如添加、修改或删除用户账户）。然而，这是一种极其危险的做法。如果 `/etc/passwd` 文件损坏，系统将无法读取它，并阻止任何人（即使是\
  \ root 用户）登录。相反，使用标准的 Linux 用户管理实用程序更安全。\n\n### /etc/shadow 文件\n\n`/etc/shadow`\
  \ 文件对 Linux 系统如何管理密码提供了更多的控制。只有 root 用户可以访问 `/etc/shadow` 文件，这使其比 `/etc/passwd`\
  \ 文件更安全。\n\n`/etc/shadow` 文件为系统的每个用户账户提供一条记录。记录格式如下：\n\n```\nrich:$1$.FfcK0ns$f1UgiyHQ25wrB/hykCn020:11627:0:99999:7::\n\
  ```\n\n每个 `/etc/shadow` 文件记录有九个字段：\n\n* 与 `/etc/passwd` 文件中的登录名对应的登录名\n* 加密密码\n\
  * 上次更改密码距离自 1970 年 1 月 1 日起的天数\n* 更改密码前的最少天数\n* 必须更改密码前的天数\n* 密码过期前警告用户更改密码的天数\n\
  * 密码过期后账户被禁用的天数\n* 用户账户禁用的日期（存储为自 1970 年 1 月 1 日起的天数）\n\n\n\n\n\n- 留供未来使用的字段\n\n\
  使用影子密码系统，Linux 系统对用户密码有许多更精细的控制。它可以控制用户更改密码的频率，以及在密码未更改时何时禁用该账户。\n\n## 添加新用户\n\n\
  在 Linux 系统中添加新用户使用的主要工具是 `useradd`。该命令提供了一种创建新用户账户并一次性设置用户 `HOME` 目录结构的简单方法。`useradd`\
  \ 命令使用系统默认值和命令行参数的组合来定义用户账户。要查看您的 Linux 发行版上使用的系统默认值，请输入带有 `-D` 参数的 `useradd` 命令：\n\
  \n```bash\n## /usr/sbin/useradd -D\nGROUP=100\nHOME=/home\nINACTIVE=-1\nEXPIRE=\n\
  SHELL=/bin/bash\nSKEL=/etc/skel\nCREATE_MAIL_SPOOL=yes\n#\n```\n\n> 注意\n> 某些 Linux\
  \ 发行版将 Linux 用户和组工具放在 `/usr/sbin` 目录中，该目录可能不在您的 `PATH` 环境变量中。如果您的 Linux 发行版是这种情况，请将该目录添加到\
  \ `PATH` 中，或使用绝对路径运行它。\n\n`-D` 参数显示了当在创建新用户账户时未在命令行中指定时，`useradd` 命令将使用的默认值。此示例显示了以下默认值：\n\
  \n- 新用户将被添加到组 ID 为 100 的公共组中。\n- 新用户将在 `/home/loginname` 目录下创建一个 `HOME` 账户。\n- 当密码过期时，账户不会被禁用。\n\
  - 新账户不会设置在指定日期过期。\n- 新账户将使用 bash shell 作为默认 shell。\n- 系统将 `/etc/skel` 目录的内容复制到用户的\
  \ `HOME` 目录中。\n- 系统将在邮件目录中创建一个文件，供该用户账户接收邮件。\n\n倒数第二个值很有趣。`useradd` 命令允许管理员创建一个默认的\
  \ `HOME` 目录配置，然后将其作为模板来创建新用户的 `HOME` 目录。这允许您自动在每个新用户的 `HOME` 目录中放置系统的默认文件。在 Ubuntu\
  \ Linux 系统中，`/etc/skel` 目录包含以下文件：\n\n```bash\n$ ls -al /etc/skel\ntotal 32\ndrwxr-xr-x\
  \   2 root root  4096 2010-04-29 08:26 .\ndrwxr-xr-x 135 root root 12288 2010-09-23\
  \ 18:49 ..\n-rw-r--r--   1 root root   220 2010-04-18 21:51 .bash_logout\n-rw-r--r--\
  \   1 root root   3103 2010-04-18 21:51 .bashrc\n-rw-r--r--   1 root root   179\
  \ 2010-03-26 08:31 examples.desktop\n-rw-r--r--   1 root root   675 2010-04-18 21:51\
  \ .profile\n$\n```\n\n您应该在第 5 章中认识这些文件。这些是 bash shell 环境的标准启动文件。系统会自动将这些默认文件复制到您创建的每个用户的\
  \ `HOME` 目录中。\n\n您通过使用默认系统参数创建新用户账户，然后查看新用户的 `HOME` 目录来测试这一点：\n\n```bash\n## useradd\
  \ -m test\n## ls -al /home/test\ntotal 24\ndrwxr-xr-x   2 test test 4096 2010-09-23\
  \ 19:01 .\ndrwxr-xr-x   4 root root 4096 2010-09-23 19:01 ..\n-rw-r--r--   1 test\
  \ test   220 2010-04-18 21:51 .bash_logout\n-rw-r--r--   1 test test   3103 2010-04-18\
  \ 21:51 .bashrc\n-rw-r--r--   1 test test   179 2010-03-26 08:31 examples.desktop\n\
  -rw-r--r--   1 test test   675 2010-04-18 21:51 .profile\n#\n```\n\n默认情况下，`useradd`\
  \ 命令不会创建 `HOME` 目录，但 `-m` 命令行选项告诉它创建 `HOME` 目录。如示例所示，`useradd` 命令使用 `/etc/skel`\
  \ 目录包含的文件创建了新的 `HOME` 目录。\n\n> 注意\n> 要运行本章中的用户账户管理命令，您可能需要登录为特殊的 root 用户账户，或者使用\
  \ `sudo` 命令以 root 用户账户身份运行命令。\n\n如果您想在创建新用户时覆盖默认值或行为，可以通过命令行参数来实现。这些参数列在表 6.1 中所示。\n\
  \n### 表 6.1: useradd 命令命令行参数\n\n| 参数 | 描述 |\n| :--- | :--- |\n| `-c` `comment` |\
  \ 在用户注释中添加文本。 |\n| `-d` `home_dir` | 为主目录指定一个与默认不同的名称。 |\n| `-e` `expire_date` |\
  \ 指定账户过期的日期，格式为 YYYY-MM-DD。 |\n| `-f` `inactive` | 密码过期后到账户禁用前的天数。 |\n| `-g` `group`\
  \ | 指定组名或 GID。 |\n| `-G` `group` | 指定用户所属的一个或多个附加组。 |\n| `-k` `skel` | 将 `/etc/skel`\
  \ 目录的内容复制到用户的 `HOME` 目录中。 |\n| `-m` | 创建主目录。 |\n| `-M` | 不创建 `HOME` 目录。 |\n| `-n`\
  \ | 指定组名作为默认。 |\n| `-r` | 创建系统账户 |\n| `-p` `passwd` | 指定加密密码。 |\n| `-s` `shell`\
  \ | 指定默认 shell。 |\n| `-u` `uid` | 为账户指定唯一的 UID。 |\n\n如果您想在创建新用户时覆盖默认值或行为，可以使用命令行参数。这些参数列在表\
  \ 6.2 中。\n\n### 表 6.2: useradd 默认值\n\n| 参数 | 描述 |\n| :--- | :--- |\n| `-b` `default_home`\
  \ | 修改用户目录创建的位置。 |\n| `-e` `expiration_date` | 修改新账户的过期日期。 |\n| `-f` `inactive`\
  \ | 修改密码过期后到禁用前的天数。 |\n| `-g` `group` | 修改默认组名。 |\n| `-s` `shell` | 修改默认 shell。\
  \ |\n\n更改默认值的操作如下：\n\n```bash\n## useradd -D -s /bin/bash\n# useradd -D\nGROUP=100\n\
  HOME=/home\nINACTIVE=-1\nEXPIRE=\nSHELL=/bin/bash\nSKEL=/etc/skel\nCREATE_MAIL_SPOOL=yes\n\
  #\n```\n\n现在，`useradd` 命令将使用 bash shell 作为您创建的所有用户账户的默认 shell。\n\n## 删除用户\n\n如果您想从系统中删除用户，需要的是\
  \ `userdel` 命令。默认情况下，`userdel` 命令仅从 `/etc/passwd` 文件中删除用户信息。它不会删除账户在系统中拥有的任何文件。\n\
  \n如果您使用 `-r` 参数，`userdel` 将删除用户的 `HOME` 目录以及用户的邮件目录。然而，系统中可能仍有其他删除用户账户拥有的文件。这在某些环境中可能会产生问题。\n\
  \n使用 `userdel` 命令删除现有用户账户的示例：\n\n```bash\n## /usr/sbin/userdel -r test\n## ls -al\
  \ /home/test\nls: 无法访问 home/test': 无此文件或目录\n#\n```\n\n使用 `-r` 参数后，用户的旧 `/home/test`\
  \ 目录不再存在。\n\n> 警告\n> 在多用户环境中使用 `-r` 参数时要小心。您永远不知道用户是否在其 `HOME` 目录中存储了其他其他人或其他程序使用的重要文件。在删除用户的\
  \ `HOME` 目录之前，请务必进行检查！\n\n\n\n\n\nLinux 提供了不同的工具来修改现有用户账户的信息。表 6.3 显示了这些工具。\n\n\
  ### 用户账户修改工具\n\n表 6.3 用户账户修改工具\n\n| 命令 | 描述 |\n| :--- | :--- |\n| `usermod` | 编辑用户账户字段，并指定主组和从组的组成关系\
  \ |\n| `passwd` | 更改现有用户的密码 |\n| `chpasswd` | 读取包含用户名和密码对的文件并更新密码 |\n| `chage` |\
  \ 修改密码的过期日期 |\n| `chfn` | 修改用户账户的注释信息 |\n| `chsh` | 更改用户账户的默认 shell |\n\n这些工具中的每一个都提供了用于更改用户账户信息的特定功能。接下来的章节将详细介绍这些这些工具。\n\
  \n### usermod\n\n`usermod` 命令是用户账户修改工具中最功能强大的一个。它提供了更改 `/etc/passwd` 文件中大部分字段的选项。要实现这一点，你只需要使用与你想要更改的值相对应的命令行参数。这些参数与\
  \ `useradd` 参数大部分相同（例如使用 `-c` 更改注释字段，`-e` 更改过期日期，以及 `-g` 更改默认登录组）。不过，还有几个额外的参数可能非常有用：\n\
  \n* `-l` 更改用户账户的登录名称\n* `-L` 锁定账户，使用户无法登录\n* `-p` 更改账户的密码\n* `-U` 解锁账户，使用户可以登录\n\
  \n`-L` 参数特别有用。使用它来锁定账户，这样用户在无需删除账户及其用户数据的情况下无法登录。要将账户恢复正常，只需使用 `-U` 参数即可。\n\n###\
  \ passwd 和 chpasswd\n\n更改用户密码的快速方法是使用 `passwd` 命令：\n\n```bash\n## passwd test\n\
  Changing password for user test.\nNew UNIX password:\nRetype new UNIX password:\n\
  passwd: all authentication tokens updated successfully.\n#\n```\n\n如果你仅单独使用 `passwd`\
  \ 命令，它将更改你自己的密码。系统中的任何用户都可以更改自己的密码，但只有 root 用户可以更改他人的密码。\n\n`-e` 选项是一种强制用户在下次登录时更改密码的实用方法。这允许你将用户的密码设置为一个简单的值，然后强制他们更改为他们可以记住的更复杂的密码。\n\
  \n如果你需要对系统上的大量用户进行批量密码更改，`chpasswd` 命令可以成为救命稻草。`chpasswd` 命令自动从标准输入读取用户名和密码对（用冒号分隔），加密密码并将其设置到用户账户。你也可以使用重定向命令将\
  \ `userid:password` 对的文件重定向到命令中：\n\n```bash\n## chpasswd < users.txt\n#\n```\n\n\
  ### chsh, chfn 和 chage\n\n`chsh`、`chfn` 和 `chage` 工具专门用于特定的账户修改功能。`chsh` 命令允许你快速更改用户的默认登录\
  \ shell。你必须使用 shell 的完整路径，而不仅仅是 shell 名称：\n\n```bash\n## chsh -s /bin/csh test\n\
  Changing shell for test.\nShell changed.\n#\n```\n\n`chfn` 命令提供了一种在 `/etc/passwd`\
  \ 文件注释字段中存储信息的标准方法。`chfn` 命令并不是仅仅插入随机文本（如姓名或昵称），或者留空注释字段，而是使用 Unix `finger` 命令中使用的特定信息在注释字段中存储信息。`finger`\
  \ 命令允许你轻松查找 Linux 系统上人员的信息：\n\n```bash\n# finger rich\nLogin: rich             \
  \           Name: Rich Blum\nDirectory: /home/rich             Shell: /bin/bash\n\
  On since Thu Sep 20 18:03 (EDT) on pts/0 from 192.168.1.2\nNo mail.\nNo Plan.\n\
  #\n```\n\n> **注意**\n> 出于安全考虑，许多 Linux 系统管理员会在他们的系统上禁用 `finger` 命令。\n\n如果你在不带任何参数的情况下使用\
  \ `chfn` 命令，它会询问你输入适当的值：\n\n```bash\n# finger rich\nLogin: rich                \
  \        Name: Rich Blum\nDirectory: /home/rich             Shell: /bin/bash\nOn\
  \ since Thu Sep 20 18:03 (EDT) on pts/0 from 192.168.1.2\nNo mail.\nNo Plan.\n#\n\
  ```\n\n\n\n\n\n```\n`rich:x:500:`\n`mama:x:501:`\n`katie:x:502:`\n`jessica:x:503:`\n\
  `mysql:x:27:`\n`test:x:504:`\n```\n\n与 UID 类似，GID 也使用特殊的格式进行分配。用于系统账户的组被分配 500 以下的\
  \ GID，而用户组被分配从 500 开始的 GID。`/etc/group` 文件包含四个字段：\n\n* 组名\n* 组密码\n* GID\n* 属于该组的用户账户列表\n\
  \n组密码允许非组成员通过使用密码临时成为该组的成员。虽然这一功能并不算常用，但它确实存在。\n\n你永远不应该通过编辑 `/etc/group` 文件来将用户添加到组中。相反，请使用\
  \ `usermod` 命令（在前面的“Linux 安全”章节中已讨论过）将用户账户添加到组中。在能够将用户添加到不同的组之前，你必须先创建这些组。\n\n>\
  \ 注意\n> 用户账户列表具有某种误导性。你会注意到列表中有几个组没有列出任何用户。这并不是因为它们没有成员。当一个用户账户在 `/etc/passwd` 文件中使用某个组作为默认组时，该用户账户不会作为成员出现在\
  \ `/etc/group` 文件中。多年来，这曾让多个系统管理员感到过困惑！\n\n## 创建新组\n\n`groupadd` 命令允许你在系统上创建新组：\n\
  \n```\n## /usr/sbin/groupadd shared\n## tail /etc/group\nhaldaemon:x:68:\nxfs:x:43:\n\
  gdm:x:42:\nrich:x:500:\nmama:x:501:\nkatie:x:502:\njessica:x:503:\nmysql:x:27:\n\
  test:x:504:\nshared:x:505:\n#\n```\n\n当你创建一个新组时，默认没有用户分配给它。`groupadd` 命令没有提供将用户账户添加到组的选项。相反，要添加新用户，请使用\
  \ `usermod` 命令：\n\n```\n## /usr/sbin/usermod -G shared rich\n## /usr/sbin/usermod\
  \ -G shared test\n## tail /etc/group\nhaldaemon:x:68:\nxfs:x:43:\ngdm:x:42:\nrich:x:500:\n\
  mama:x:501:\nkatie:x:502:\njessica:x:503:\nmysql:x:27:\ntest:x:504:\nshared:x:505:rich,\
  \ test\n#\n```\n\n`shared` 组现在有两个成员：test 和 rich。`usermod` 中的 `-G` 参数将新组添加到该用户账户的组列表中。\n\
  \n> 注意\n> 如果你更改了当前登录系统的账户的用户组，则用户必须注销并重新登录，组更改才会生效。\n\n> 警告\n> 在为用户账户分配组时要小心。如果你使用\
  \ `-g` 参数，你指定的组名将替换该用户账户的默认组。`-G` 参数会将该组添加到用户所属的组列表中，同时保持默认组不变。\n\n## 修改组\n\n如你从\
  \ `/etc/group` 文件中所见，关于组的信息并不多供你修改。`groupmod` 命令允许你更改现有组的 GID（使用 `-g` 参数）或组名（使用\
  \ `-n` 参数）：\n\n```\n## /usr/sbin/groupmod -n sharing shared\n## tail /etc/group\n\
  haldaemon:x:68:\nxfs:x:43:\ngdm:x:42:\nrich:x:500:\nmama:x:501:\nkatie:x:502:\n\
  jessica:x:503:\nmysql:x:27:\ntest:x:504:\nsharing:x:505:test,rich\n#\n```\n\n在更改组名时，GID\
  \ 和组成员保持不变，只有组名发生了。由于所有安全权限都是基于 GID 的，你可以随心所欲更改组名，而不会对文件安全产生不利影响。\n\n## 解码文件权限\n\
  \n现在你已经了解了用户和组，是时候解码在使用 `ls` 命令时看到的那些晦涩的文件权限了。本节描述了如何破解这些权限以及它们从何而来。\n\n### 使用文件权限符号\n\
  \n如果你还记得第 3 章的内容，`ls` 命令允许你查看 Linux 系统上文件、目录和设备的权限权限：\n\n```\n$ ls -l\ntotal 68\n\
  -rw-rw-r-- 1 rich rich    50 2010-09-13 07:49 file1.gz\n-rw-rw-r-- 1 rich rich \
  \   23 2010-09-13 07:50 file2\n-rw-rw-r-- 1 rich rich    48 2010-09-13 07:56 file3\n\
  ```\n\n输出中的第一个字符定义了文件类型：\n* `-` 表示文件\n* `d` 表示目录\n* `l` 表示链接\n* `c` 表示字符设备\n* `b`\
  \ 表示块设备\n* `s` 表示符号链接\n* `p` 表示套接字\n* `f` 表示命名管道\n\n之后，有三组字符。每组定义了访问权限：\n* `r` 表示读\n\
  * `w` 表示写\n* `x` 表示执行\n\n破折线 `-` 表示权限被拒绝。这三组分别对应所有者、所属组和所有人。\n\n例如：\n\n```\n-rw-rw-r--\
  \ 1 rich rich    50 2010-09-13 07:49 file1.gz\n-rw-rw-r-- 1 rich rich    23 2010-09-13\
  \ 07:50 file2\n-rw-rw-r-- 1 rich rich    48 2010-09-13 07:56 file3\n```\n\n```\n\
