  \ |\n| `-error_file=filename` | 将 HTTP 状态码写入指定文件。 |\n| `-exec` | 开启本地程序执行。 |\n|\
  \ `-force_empty_hrefless_a` | 强制让没有 href 属性的 `<a>` 元素为空。默认设置为 `off`。 |\n| `-force_html`\
