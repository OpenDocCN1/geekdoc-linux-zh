  \ | 禁用文件 URL 传输 `Referer` 头部。默认设置为 `on`。 |\n| `-nolist` | 禁用转储中的链接列表功能。默认设置为 `off`。\
  \ |\n\n\n\n\n\n| `-nolog` | 禁用向文档所有者发送错误消息。默认设置为 `on`。 |\n| `-nonrestarting_sigwinch`\
  \ | 使窗口大小变化处理程序不重新启动。默认设置为 `off`。 |\n| `-nopause` | 禁用状态行消息的强制暂停。 |\n| `-noprint`\
