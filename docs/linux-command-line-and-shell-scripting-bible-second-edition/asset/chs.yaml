  \ | 等待指定的进程完成，并返回退出状态。 |\n\n内置命令比外部命令具有更高的性能，但添加到 shell 中的内置命令越多，它消耗的内存就越多（其中包含许多你可能永远用不到命令）。`bash`\
  \ shell 还包含为 shell 提供扩展功能的外部命令。这些内容将在 bash 命令部分进行讨论。\n\n## bash 命令\n\n除了内置命令外，`bash`\
