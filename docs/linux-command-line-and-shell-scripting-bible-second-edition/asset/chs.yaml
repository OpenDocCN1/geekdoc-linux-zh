  | `-resubmit_posts` | 当其返回的文档通过 `PREV_DOC` 命令或从历史列表被请求时，强制对方法为 `POST` 的表单进行重新提交（不使用缓存）。默认设置为\
  \ `off`。 |\n| `-rlogin` | 禁用 `rlogin` 功能。默认设置为 `off`。 |\n| `-selective` | 需要 `.www_browsable`\
  \ 文件才能浏览目录。 |\n| `-short_url` | 在状态行中启用对长 URL 开头和结尾的检查。默认设置为 `off`。 |\n| `-show_cursor`\
  \ | 设置为 `off` 时隐藏右下角的光标，否则显示光标。默认设置为 `on`。 |\n| `-show_rate` | 显示传输速率。默认设置为 `on`。\
  \ |\n| `-soft_dquotes` | 使用旧版 Netscape 和 Mosaic 的 bug，该 bug 将 `>` 视为双引号和标签的共同终止符。默认设置为\
  \ `off`。 |\n| `-source` | 将第一个 URL 的源码导出到 STDOUT 并退出。 |\n| `-stack_dump` | 禁用 SIGINT\
  \ 清理处理程序。默认设置为 `off`。 |\n| `-startfile_ok` | 允许配合 `-validate` 使用非 HTTP 起始页和首页。默认设置为\
  \ `off`。 |\n| `-stdin` | 从 `STDIN` 读取 startfile。默认设置为 `off`。 |\n| `-tagsoup` | 使用\
  \ TagSoup 而不是 SortaSGML 解析器。默认设置为 `off`。 |\n| `-telnet` | 禁用 telnet 会话。默认设置为 `off`。\
  \ |\n| `-term=term` | 指定要模拟的终端类型。 |\n| `-tlog` | 为当前会话使用 Lynx 追踪日志。默认设置为 `on`。 |\n\
  | `-tna` | 使用文本字段激活模式。默认设置为 `off`。 |\n| `-trace` | 使用 Lynx 追踪模式。默认设置为 `off`。 |\n\
  | `-trace_mask` | 自定义 Lynx 追踪模式。默认设置为 `0`。 |\n| `-traversal` | 遍历从 startfile 产生的所有\
  \ HTTP 链接。 |\n| `-trim_input_fields` | 修剪表单中的输入文本/文本区域字段。默认设置为 `off`。 |\n| `-underline_links`\
  \ | 为链接使用下划线/粗体属性。默认设置为 `off`。 |\n| `-underscore` | 在导出中使用下划线格式。默认设置为 `off`。 |\n\
  | `-use_mouse` | 启用鼠标支持。默认设置为 `off`。 |\n| `-useragent=Name` | 设置备的 Lynx User-Agent\
  \ 头部。 |\n| `-validate` | 接受 `http` URL（用于验证），意味着比 `-anonymous` 更多限制，但允许 `http` 和\
  \ `https` 的重定向。默认设置为 `off`。 |\n| `-verbose` | 使用带有这些图像文件名的 `[LINK]`、`[IMAGE]` 和\
  \ `[INLINE]` 注释。默认设置为 `on`。 |\n| `-version` | 显示 Lynx 版本信息。 |\n| `-vikeys` | 启用类似\
  \ vi 的键移动。默认设置为 `off`。 |\n| `-width=n` | 设置用于导出格式化的屏幕宽度。默认值为 80 列。 |\n| `-with_backspaces`\
  \ | 如果使用 `-dump` 或 `-crawl` 参数，则在输出中产生退格键。默认设置为 `off`。 |\n\n如你所见，你可以直接从命令行控制几乎任何类型的\
  \ HTTP 或 HTML 设置。例如，如果你想使用 HTTP POST 方法向 Web 表单发布数据，只需在 `-post-data` 参数中包含你的数据。如果你想将网站收到的\
  \ cookie 存储在特殊位置，可以使用 `-cookie_save_file` 参数。\n\n许多命令行参数定义了你在浏览网页时控制 Lynx 的行为。与其在每次使用时都输入这些参数，Lynx\
  \ 提供了一个通用配置文件来定义基础行为。下一节将讨论该文件。\n\n## Lynx 配置文件\n\n\n\n\n虽然这看起来像是在浪费时间，但它是保护客户免受互联网危险的一项重要功能。代理服务器可以过滤不适当的内容和恶意代码，甚至可以检测用于网络数据钓鱼计划的网站（伪装成他人以获取客户数据的流氓服务器）。代理服务器还可以帮助减少互联网带宽的使用，因为它们缓存常用的\
  \ Web 页面并将其返回给客户端，而不是重新下载原始页面。\n\n用于定义代理服务器的配置参数有：\n\n`http_proxy:http://some.server.dom:port/`\n\
  `https_proxy:http://some.server.dom:port/`\n`ftp_proxy:http://some.server.dom:port/`\n\
  `gopher_proxy:http://some.server.dom:port/`\n`news_proxy:http://some.server.dom:port/`\n\
  `newspost_proxy:http://some.server.dom:port/`\n`newsreply_proxy:http://some.server.dom:port/`\n\
  `snews_proxy:http://some.server.dom:port/`\n`snewspost_proxy:http://some.server.dom:port/`\n\
  `snewsreply_proxy:http://some.server.dom:port/`\n`nntp_proxy:http://some.server.dom:port/`\n\
  `wais_proxy:http://some.server.dom:port/`\n`finger_proxy:http://some.server.dom:port/`\n\
  `cso_proxy:http://some.server.dom:port/`\n`no_proxy:host.domain.dom`\n\n你可以为 Lynx\
  \ 支持的任何网络协议定义不同的代理服务器。`NO_PROXY` 参数是一个由逗号分隔的列表，包含了你希望直接访问而不使用代理服务器的网站。这些通常是不需要过滤的内部网站。\n\
  \n## Lynx 环境变量\n\n从丰富的命令行选项和配置文件参数可以看出，Lynx 程序是高度自定义的。然而，自定义并不仅于此。你可以使用环境变量覆盖许多配置文件参数。如果你在一个无法访问\
  \ `lynx.cfg` 配置文件的环境中工作，可以通过设置本地环境变量来覆盖某些默认参数。表 24.2 列出了在受限环境中使用 Lynx 时可能需要的更常用的\
  \ Lynx 环境变量。\n\n### 表 24.2 Lynx 环境变量\n\n| 变量 | 说明 |\n| :--- | :--- |\n| `LYNX_CFG`\
  \ | 指定备用配置文件的位置。 |\n| `LYNX_LSS` | 指定默认 Lynx 字符样式表的位置。 |\n| `LYNX_SAVE_SPACE` |\
  \ 指定保存文件到磁盘的位置。 |\n| `NNTPSERVER` | 指定用于检索和发布 USENET 新闻的服务器。 |\n| `PROTOCOL_PROXY`\
  \ | 覆盖指定协议的代理服务器。 |\n| `SSL_CERT_DIR` | 指定包含访问信任站点所需的信任证书的目录。 |\n| `SSL_CERT_FILE`\
  \ | 指定包含你的信任证书的文件。 |\n| `WWW_HOME` | 定义 Lynx 启动时使用的默认 URL。 |\n\n在使用 Lynx 程序之前，你就像设置任何其他环境变量一样设置这些环境变量：\n\
  \n```bash\n$ http_proxy=http://myproxy.com:8080\n$ lynx\n```\n\n要指定代理服务器，你必须提供协议、服务器名称以及与代理服务器通信的端口。如果你需要设置此变量，最好将其包含在\
  \ shell 的常用启动文件中（例如 bash shell 的 `.bashrc` 文件），这样你就不需要每次都输入它了。\n\n## 从 Lynx 获取数据\n\
  \n当你在 shell 脚本中使用 Lynx 时，你可能正尝试从 Web 页面获取特定的某部分或多部分信息。实现此目标的技术被称为屏幕抓取（screen scraping）。在屏幕抓取中，你正试图程序化地在图形界面的特定位置寻找数据，以便捕获并在\
  \ shell 脚本中使用。\n\n使用 `lynx` 执行屏幕抓取的简单方法是使用 `-dump` 选项。该选项不会尝试在终端屏幕上显示 Web 页面。相反，它将\
  \ Web 页面的文本数据直接显示到 `STDOUT`：\n\n```bash\n$ lynx -dump http://localhost/RecipeCenter/\n\
  ```\n\n```\nRecipe Center\n          “就像妈妈做的一样”\n欢迎\n    [1]首页\n    [2]登录发布\n  \
  \  [3]免费注册\n      _________________________________________________________\n  \
  \  [4]发布新食\n```\n\n每个链接通过标签数字识别，Lynx 在网页数据之后会显示所有标签引用的列表。\n\n一旦你获取了网页的所有文本数据，你可能知道我们要从工具箱中取出哪些工具来开始提取数据了。没错，就是我们的老朋友\
  \ `sed` 和 `gawk` 程序（见第 18 章）。\n\n首先，让我们找到一些有趣的数据来收集。Yahoo! 天气网页是查找世界上任何地方当前天气状况的绝佳来源。每个位置使用单独的\
  \ URL 来显示该城市的天气信息（你可以通过普通浏览器访问该网站并输入你的城市信息来找到你城市的特定 URL）。用于查找伊利诺伊州芝加哥市天气的 `lynx`\
  \ 命令是：\n\n```bash\nlynx -dump http://weather.yahoo.com/united-states/illinois/chicago-2379574/\n\
  ```\n\n此命令从网页中导出了大量数据。第一步是找到你需要的精确信息。为了实现这一点，将 `lynx` 命令的输出重定向文件，然后在文件中搜索你的数据。在执行了上述命令后，我们在输出文件中发现了以下文本：\n\
  \n```\n截至东部时间下午 1:54 的当前状况\n大部分多云\n    体感温度:\n          32 °F\n    气压:\n       \
  \   30.13 英寸正在上升\n湿度:\n          50%\n能见度:\n          10 英里\n露点:\n          15 °F\n\
  风力:\n          西风 10 英里\n```\n\n这就是你需要的关于当前天气全部信息了。这个输出只有一个小问题。你会发现数字在标题下方的一行中。尝试只提取单个数字将很困难。第\
  \ 18 章讨论了如何处理这种情况。\n\n\n\n\n```\necho The current temp outside is: $temp\n$ ./weather\n\
  Current conditions: Mostly Cloudy\nThe current temp outside is: 32 °F\n$\n```\n\n\
  该天气脚本会连接到所需城市的 Yahoo! 天气网页，将网页保存到临时文件，提取相应的文本，删除临时文件，然后显示天气信息。这种做法的妙之处在于，一旦你从网站上提取了数据，就可以对它进行任何操作，例如创建一个温度表。然后，你可以创建一个\
  \ `cron` 任务（参见第 15 节），让它每天运行一次以跟踪每日温度。\n\n> 注意\n> 互联网是一个动态变化的地方。如果你花费了几个小时来确定网页上数据的精确位置，结果发现它在几周后移动了位置，导致你的脚本崩溃，这并不请不要感到意外。事实上，当你读到这本书时，这个示例可能已经无法工作了。重要的是学会从网页上提取数据的流程，然后你就可以将该原理应用于任何情况。\n\
  \n# cURL 程序\n\nLynx 的流行催生另一个类似的产品，称为 `cURL`。`cURL` 程序允许你使用指定的 URL 从命令行自动传输文件。它目前支持\
  \ URL 中指定的 FTP, FTPS, HTTP, HTTPS, SCP, SFTP, TFTP, telnet, DICT, LDAP, LDAPS 和\
  \ FILE 协议。\n\n虽然 `cURL` 本身不是作为浏览器浏览器，但它允许你通过简单的命令，直接从命令行或你的 shell 脚本中无人地发送或检索数据。这为你的\
  \ shell 脚本工具箱提供了一个非常棒的工具。\n\n本节将带你了解如何在 shell 脚本中安装和使用 `cURL`。\n\n> 注意\n> 还有一种名为\
  \ `curl` 的编程语言，由 Sumisho Computer System Corporation 所有并销售。请不要将 `cURL` 与 `curl`\
  \ 编程语言混淆。\n\n# 安装 cURL\n\n随着用性的日益提高，许多 Linux 发行版默认都安装了 `cURL`。在 Ubuntu 中，你必须从软件仓库手动安装它。只需使用此命令即可：\n\
  \n```\n$ sudo apt-get install curl\n```\n\n如果你的 Linux 发行版没有 `cURL`，或者你只想使用最新版本，可以从\
  \ `curl.haxx.se` 网站下载源代码并在你的 Linux 系统上进行编译。\n\n再次强调，标准的免责声明仍然适用；你必须在 Linux 系统上安装\
  \ C 开发库才能使其工作。\n\n下一节将描述如何从命令行使用 `curl` 程序。\n\n# 使用 cURL 进行探索\n\n默认情况下，`cURL` 将整个网页的完整\
  \ HTML 代码返回到 `STDOUT`：\n\n```\n$ curl http://www.google.com\n<!doctype html><<html><head><meta\
  \ http-equiv=\"content-type\" content=\"text/html; charset=ISO-8859-1\">><title>Google</title>\n\
  [ listing truncated ]\n```\n\n与 Lynx 程序一样，你可以使用标准的 shell 脚本技术从导出的网页中提取单个数据元素。\n\n\
  我们喜欢使用 `cURL` 来批量下载文件。现如今，我们似乎在不断地下载最新的 Linux 发行版 ISO 文件。因为 ISO 文件非常大，我们需要开始下载并在下载时时离开电脑。一旦我们知道了\
  \ ISO 文件的 URL，就可以就可以使用 `cURL` 创建一个简单的 shell 脚本来自动化该过程：\n\n```\n$ cat downld\n#!/bin/bash\n\
  # download latest cURL file automatically\ncurl -s -o /home/rich/curl-7.18.0.tar.gz\
  \ http://curl.haxx.se/download/curl-7-18.0.tar.gz\n$\n```\n\n`-s` 命令行选项将 `curl`\
  \ 置于静默模式，不向 `STDOUT` 发送任何数据。`-o` 命令行选项将输出重定向到一个文件名。虽然你从列表中看不出来，但脚本中的 `curl` 命令是单行的。这个简单的脚本只是直接从\
  \ `cURL` 网站下载文件。你现在可以使用 `at` 或 `cron` 命令（参见第 15 节）调度下载，在晚上你不使用电脑或网络时进行。\n\n# 使用\
  \ zsh 进行网络操作\n\n第 22 节描述了 `zsh` shell 中可用的所有功能。`zsh` shell 是一种适用于 Linux 和 Unix 环境的较新\
  \ shell。`zsh` shell 的功能之一是插件模块。与其尝试将许多功能整合到 `zsh` 核心中，`zsh` 使用了专用模块，这样你可以根据需要选择加载的命令。其中一个模块就是\
  \ TCP 模块。\n\n`zsh` shell 中的 TCP 模块直接从命令行提供了一些惊人的网络能力。你可以直接从命令行（或 shell 脚本）与另一个网络设备创建一个\
  \ TCP 网络会话。本节讨论了 `zsh` TCP 模块的功能，并展示了一个你可以使用 `zsh` shell 脚本构建的简单客户端/服务器应用程序。\n\n\
  ## TCP 模块\n\n`zsh` shell 使用模块为核心 `zsh` 添加额外功能。每个模块都包含专门用于特定领域的内置命令。TCP 模块为大量的网络功能提供了内置命令。\n\
  \n要在 `zsh` shell 中安装 TCP 模块，请执行以下操作：\n\n```\n% zmodload zsh/net/tcp\n%\n```\n\n\
  这就是在 shell 中安装模块库的全部工作！如果你在 shell 脚本中使用 TCP 模块，请记住在脚本中包含此行。该模块仅适用于当前 shell。\n\n\
  一旦加载了 TCP 模块，你就可以使用 `ztcp` 命令。`ztcp` 命令的格式为：\n\n```\nztcp [-acflLtv] [-d fd] [[args]]\n\
  ```\n\n可用的命令行选项有：\n\n*   `-a`: 接受新连接。\n*   `-c`: 关闭现有连接。\n*   `-d`: 为连接使用指定的文件描述符。\n\
  *   `-f`: 强制关闭连接。\n*   `-l`: 打开一个新的 socket 进行监听。\n*   `-L`: 列出当前连接的 socket。\n* \
  \  `-t`: 如果没有挂起的连接则退出。\n*   `-v`: 显示有关连接的详细信息。\n\n`ztcp` 命令使用文件描述符与打开的 TCP 连接进行交互。默认情况下，`zsh`\
  \ 使用环境变量 `$RESULT` 引用文件描述符。你只需要向 `$RESULT` 变量指定的文件描述符发送数据，TCP 模块将其转发到远程主机。同样，如果远程主机向你发送任何数据，你只需要从\
  \ `$RESULT` 变量指定的文件描述符中读取它。网络编程没有这更简单了！\n\n## 客户端/服务器范式\n\n在深入使用 `zsh` shell 创建客户端/服务器程序之前，了解客户端和服务器程序具体是如何运行是一个很好的主意。显然，它们在数据连接和传输中承担着不同的责任。\n\
  \n服务器程序监听网络上来自客户端的请求。客户端向服务器发起连接请求。一旦服务器接受了连接请求，每个设备就可以通过双向通信通道发送和接收数据了。这一过程在 图\
  \ 24.2 中所示。\n\n图 24.2 客户端/服务器通信图\n\n![](img/00028.jpg)\n\n如从 图 24.2 中所示，服务器在与客户端通信之前必须执行两个功能。首先，它必须设置一个特定的\
  \ TCP 端口来监听传入的请求。当连接请求进来时，它必须接受连接。\n\n客户端的责任要简单得多。它所需要的尝试连接到服务器正在监听的特定 TCP 端口。如果服务器接受了连接，双向通信即可可用，就可以发送数据。\n\
  \n\n\n\n一旦服务器和客户端之间建立了连接，在两个设备之间就必须使用某种通信过程（或规则）。如果两个设备都尝试同时监听消息，它们将发生死锁，什么也不会发生。同样，如果它们都尝试同时发送消息，也将无法完成任何操作。\n\
  \n作为网络编程员，你的工作是决定你的客户端程序和服务器程序必须遵循的协议规则。\n\n# 使用 zsh 进行客户端/服务器编程\n\n为了演示使用 `ztcp`\
  \ 创建客户端/服务器程序，让我们建立一个简单的网络应用程序。我们将创建的服务器程序将在 TCP 端口 `5150` 上监听连接请求。当连接请求进来时，服务器将接受它，然后向客户端发送一条欢迎消息。\n\
  \n随后，服务器程序将等待接收客户端的消息。如果它收到了消息，服务器将显示该消息，并将相同的消息发回客户端。发送消息后，服务器将循环回来监听另一个消息。此循环将一直持续，直到服务器接收到包含文本\
  \ `exit` 的消息。发生这种情况时，服务器将终止会话。\n\n我们将创建的客户端程序将向服务器的 TCP 端口 `5150` 发送连接请求。连接建立，客户端需要接收服务器的欢迎消息。\n\
  \n接收消息后，客户端会显示它，然后询问用户要发送到服务器的数据。从用户获取消息后，客户端程序将将其发送到服务器并等待接收返回的消息。如果消息返回，客户端将显示该消息并循环回来请求用户提供另一个消息。此循环将一直持续，直到用户输入文本\
  \ `exit`。发生这种情况时，客户端将退出文本发送给服务器，然后终止会话。\n\n接下来的章节将展示服务器和客户端程序。\n\n## 服务器程序\n\n以下是服务器程序的代码：\n\
  \n```bash\n% cat server\n#!/bin/zsh\n# zsh TCP server script\nzmodload zsh/net/tcp\n\
  ztcp -l 5150\nfd=$REPLY\necho “Waiting for a client…”\nztcp -a $fd\nclientfd=$REPLY\n\
  echo “client connected”\necho “Welcome to my server” > $clientfd\nwhile [ 1 ]\n\
  do\n    read line < $clientfd\n    if [[ $line = “exit” ]]\n    then\n      break\n\
  \    else\n      echo Received: $line\n      echo $line > $clientfd\n    fi\ndone\n\
  echo “Client disconnected session”\nztcp -c $fd\nztcp -c $clientfd\n%\n```\n\n服务器程序遵循图\
  \ 24.2 所示的客户端/服务器范式。它首先使用 `-l` 参数在指定的端口 (5150) 上监听。`$RESULT` 包含 Linux 系统返回的用于识别连接的文件描述符。服务器使用\
  \ `-a` 参数接受新的连接请求。此命令会等待新的连接请求进来（称为阻塞）。除非接受了连接请求，否则脚本不会继续。\n\n每个客户端连接都使用与监听端口文件描述符不同的文件描述符。这允许你在需要时维护多个客户端连接（在这个简单的练习中我们没有这样做）。\n\
  \n在接受连接后，服务器将欢迎消息重定向到客户端的文件描述符：\n\n`echo “Welcome to my server” > $clientfd`\n\n\
  zsh shell TCP 模块处理了所有确保数据发送到远程客户端的机制。\n\n接下来，服务器程序进入一个无限循环。它使用 `read` 命令等待从客户端返回数据：\n\
  \n`read line < $clientfd`\n\n此命令也会阻塞脚本的执行，直到收到来自客户端的数据。如果客户端丢失了网络连接，这可能会是一坏。为了防止这个问题，你可以在\
  \ `read line` 中使用 `-t` 选项指定超时值（秒）。如果服务器在超时时间内没有从客户端接收数据，它将继续执行。\n\n如果服务器收到了客户端的数据，它将在\
  \ `STDOUT` 上显示数据，然后将其发回客户端。如果数据等于文本字符串 `exit`，服务器将退出循环，并使用 `ztcp` 中的 `-c` 参数关闭客户端的文件描述符和监听端口的文件描述符。如果你希望服务器监听另一个连接，在关闭客户端文件描述符后，你可以循环回来等待接受新连接。\n\
  \n## 客户端程序\n\n以下是客户端程序的代码：\n\n```bash\n% cat server\n#!/bin/zsh\n# zsh TCP server\
  \ script\nzmodload zsh/net/tcp\nztcp -l 5150\nfd=$REPLY\necho “Waiting for a client…”\n\
  ztcp -a $fd\nclientfd=$REPLY\necho “client connected”\necho “Welcome to my server”\
  \ > $clientfd\nwhile [ 1 ]\ndo\n    read line < $clientfd\n    if [[ $line = “exit”\
  \ ]]\n    then\n      break\n    else\n      echo Received: $line\n      echo $line\
  \ > $clientfd\n    fi\ndone\necho “Client disconnected session”\nztcp -c $fd\nztcp\
  \ -c $clientfd\n%\n```\n（等一下，原文在客户端程序标题下再次提供了服务器代码，我将按照它在源代码中出现的格式进行格式化，但保持逻辑流）\n\
  \n*更正：查看提供的文本，“客户端程序”部分再次包含了服务器代码块。我将按照源文本提供的进行格式化。*\n\n以下是客户端的代码：\n\n```bash\n\
  % cat server\n#!/bin/zsh\n# zsh TCP server script\nzmodload zsh/net/tcp\nztcp -l\
  \ 5150\nfd=$REPLY\necho “Waiting for a client…”\nztcp -a $fd\nclientfd=$REPLY\n\
  echo “client connected”\necho “Welcome to my server” > $clientfd\nwhile [ 1 ]\n\
  do\n    read line < $clientfd\n    if [[ $line = “exit” ]]\n    then\n      break\n\
  \    else\n      echo Received: $line\n      echo $line > $clientfd\n    fi\ndone\n\
  echo “Client disconnected session”\nztcp -c $fd\nztcp -c $clientfd\n%\n```\n\n等等，重新检查源文本：“客户端程序”部分在提示中提供的文本中实际上再次列出了服务器代码。我将完全遵循提示的文本，但应用格式规则。\n\
  \n实际上，仔细查看提示中的“待格式化文本”，“客户端程序”章节确实以“以下是客户端的代码：”开头，随后是服务器代码块。\n\n客户端程序将向服务器的 TCP\
  \ 端口 `5150` 发送连接请求。连接建立后，客户端需要接收服务器的欢迎消息。\n\n接收消息后，客户端显示它，然后询问用户要发送到服务器的数据。从用户处获取消息后，客户端程序将将其发送到服务器并等待接收返回的消息。如果消息返回，客户端显示该消息并循环回来请求用户提供另一个消息。此循环将一直持续，直到用户输入文本\
  \ `exit`。发生这种情况时，客户端将退出文本发送给服务器，然后终止会话。\n\n## 运行程序\n\n你可以在不同的 Linux 系统上运行这些程序，也可以在同一系统的终端会话中运行。你必须先启动服务器，以便它能够监听连接：\n\
  \n`./server`\nWaiting for a client...\n\n然后你可以启动客户端：\n\n`./client`\n\nWelcome to\
  \ my server\nEnter text: test\nSending test to remote host...\nReceived: test\n\n\
  当客户端连接时，你将在服务器上看到：\n\nclient connected\nReceived: test\n\n这将一直持续，直到用户在客户端输入 `exit`：\n\
  \nEnter text: exit\nSending exit to remote host...\n\n你应该看到服务器自动退出：\n\nClient disconnected\
  \ session\n\n## 总结\n\n本章介绍了 shell 脚本与交互的世界。执行该操作最流行的工具之一是 Lynx。Lynx 是一个命令行程序，可以在会话中使用文本模式显示网站信息。除了该功能外，Lynx\
  \ 还提供了从网站检索原始数据的方法，并将其显示在 `STDOUT`。你可以使用 Lynx 从网站提取数据，并使用 `sed` 和 `gawk` 等标准 Linux\
  \ 文本工具对其进行解析。\n\n`curl` 程序是与互联网进行交互时的另一个非常有用的工具。`curl` 程序还允许你从网站转储数据，并提供了一种轻松脚本下载不同类型文件的方法。\n\
  \n最后，本章展示了如何使用 `zsh` shell 的 `TCP` 模块编写你自己的网络程序。`zsh` shell 提供了一种在位于网络不同系统的 shell\
  \ 脚本之间进行通信的方法。\n\n\n\n在下一章中，我们将探讨如何在 shell 脚本中利用电子邮件。通常当你使用 shell 脚本实现流程自动化时，如果能收到一条消息指示过程是成功还是失败了，将非常好。通过了解如何使用系统上安装的电子邮件软件，你可以轻松地向世界上任何人发送自动化的消息。\n\
  \n# 第 25 章：使用电子邮件\n\n## 本章内容\n* 电子邮件与 Linux\n* 搭建电子邮件服务器\n* 发送简单消息\n* 在 Mutt 中使用附件\n\
  \n随着电子邮件的普及，如今几乎每个人都有一个电子邮箱地址。正因如此，人们往往期望通过电子邮件接收数据，而不是查看文件或打印件。这在 shell 脚本世界中也大无相同。如果你从\
  \ shell 脚本中生成了任何种类型的报告，很可能在某个时刻，你会被要求将结果通过电子邮件发送给某人。本章将向你展示如何配置你的 Linux 系统以支持直接从\
  \ shell 脚本发送电子邮件。它还将向你展示如何确保你的 Linux 系统可以发送向出的邮件消息，以及如何确保你拥有一个可以从命令行执行此操作的邮件客户端。不过，本章将简要概述\
  \ Linux 处理电子邮件的一般方式。\n\n## Linux 电子邮件基础\n有时在 shell 脚本中使用电子邮件，最困难的部分是理解 Linux 中的电子邮件系统到底是如何工作的。了解哪些软件包执行特定的任务，对于将邮件从你的\
  \ shell 脚本发送到你的收件箱至关重要。本节将带你了解 Linux 系统如何使用电子邮件的基础知识，以及在使用它之前需要准备好的配置。\n\n### Linux\
  \ 中的电子邮件\nUnix 操作系统的主要目标之一是软件模块化。Unix 开发者没有创建一个一个处理某项功能所需所有部分的单体程序，而是创建了许多较小的程序，每个程序负责处理系统总功能的一个较小部分。\n\
  \n这种哲学被应用于 Unix 中使用的电子邮件系统的实现，并被继承到了 Linux 环境。在 Linux 中，电子邮件功能被分为不同的部分，每个部分分配给不同的程序。图\
  \ 25.1 显示了大多数开源电子邮件软件如何在 Linux 环境中将电子邮件功能模块化。\n\n图 25.1 Linux 模块化电子邮件环境\n\n![](img/00008.jpg)\n\
  \n正如你在图 25.1 中所示，在 Linux 环境中，电子邮件过程通常分为三个功能：\n* 邮件传输代理 (MTA)\n* 邮件投递代理 (MDA)\n*\
  \ 邮件用户代理 (MUA)\n\n这三个功能之间的边界往往是模糊的。某些电子邮件软件包将 MDA 和 MTA 功能结合，而另一些则结合了 MDA 和 MUA\
  \ 功能。接下来的章节将更详细地描述这些基础电子邮件组件以及它们在 Linux 系统中如何实现。\n\n### 邮件传输代理 (MTA)\nMTA 软件是 Linux\
  \ 电子邮件系统的核心。它负责处理系统中的入站和出邮件消息。对于每条出站邮件消息，MTA 必须确定收件人地址的目标。如果目标主机是本地系统，MTA 可以直接投递到本地邮箱，也可以将消息传递给本地\
  \ MDA 进行投递。\n\n然而，如果目标主机是远程邮件服务器，MTA 必须与远程主机上的 MTA 软件建立通信链接以传输消息。MTA 软件包使用两种常用方法将邮件投递到远程主机：\n\
  * 直接投递\n* 代理投递\n\n如果你的 Linux 系统直接连接到互联网，它通常可以直接将目标为远程主机收件人的消息直接投递到远程主机。MTA 软件使用域名系统\
  \ (DNS) 来解析目标主机，并使用简单邮件传输协议 (SMTP) 将消息投递到远程主机。\n\n\n\n\n\n> 注意\n> > 邮件箱的原始 Unix\
  \ 位置是 `/var/spool/mail`。大多数 Linux 发行版都使用这种命名约定；但也有少数 Linux 发行版使用的是 `/var/mail`。\n\
  \n如果你的系统确实使用特殊的 MDA 程序来处理入站邮件消息，那么很可能就是流行的 `Procmail` 程序。`Procmail` 允许每个用户创建自定义的配置文件，以定义邮件过滤器、自动回复目标以及独立的邮件信箱。\n\
  \n# 邮件用户代理 (MUA)\n\n到目前为止，我们追踪了邮件从远程主机到本地主机，再到单个用户信箱的流量。该过程的下一步是允许单个用户查看他们的电子邮件。\n\
  \nLinux 邮件模型为每个用户使用一个本地信箱文件或目录来存放该用户的邮件。`MUA` 程序的作用是为用户提供一种与其信箱交互以读取消息的方法。\n\n需要注意的是，`MUAs`\
  \ 并不接收消息；它们只显示已经存在信箱中的消息。许多 `MUA` 程序还提供创建独立邮件文件夹的能力，以便用户可以将邮件从默认信箱（通常称为 `Inbox`）移动到单独文件夹中进行组织。\n\
  \n大多数 `MUA` 程序还提供发送消息的能力。这部分稍微有点模糊，因为正如你所看到的，发送电子邮件消息是 `MTA` 程序的工作。\n\n为了执行此功能，大多数\
  \ `MUA` 程序利用了 `SMTP` 中的智能主机（smart host）功能。可以是 `MUA` 程序自动将消息投递给本地 `MTA` 程序进行发送，或者你必须在\
  \ `MUA` 配置中定义一个远程智能主机以便其发送消息。\n\n多年来，Linux 平台提供了许多不同的开源 `MUA` 程序。以下章节描述了你在 Linux\
  \ 中会遇到的一些流行的 `MUA` 程序。\n\n## Mailx\n\n`Mailx` 程序是 Linux 环境中最常用的命令行 `MUA` 程序。在所有安装版本中，`Mailx`\
  \ 程序都会连同可执行文件 `mail` 一起安装，这表明它是 `mail` 程序的替代品，而不是一个独立的程序。\n\n> 注意\n> > 像 Ubuntu\
  \ 和 openSUSE 这种面向图形桌面的 Linux 发行版默认不安装命令行 `Mailx` 程序。你需要作为邮件客户端包的一部分（见第 8 章）手动安装它。然而，你必须小心，因为并不是所有的\
  \ Linux 邮件包都是一样的。对于 Ubuntu，该包名为 `mailutils`，它使用的是 GNU `Mailutils` 包而不是 `Mailx`。它提供了相同的功能，但命令行参数略有不同。\n\
  \n`Mailx` 程序允许用户从命令行访问其信箱以读取存储的消息，并向其他邮件用户发送消息。以下是一个 `Mailx` 会话示例。\n\n```\n$ mail\n\
  \"/var/mail/rich\": 2 messages 2 new\n>N    1 Rich Blum           Dec  9 10:07 \
  \ 13/579   Test message\n N    2 Rich Blum           Dec  9 10:08  13/593   This\
  \ is another test\n? 1\nReturn-Path: <rich@rich-Parallels-Virtual-Platform>\nX-Original-To:\
  \ rich@rich-Parallels-Virtual-Platform\nDelivered-To: rich@rich-Parallels-Virtual-Platform\n\
  Received: by rich-Parallels-Virtual-Platform (Postfix, from userid 1000)\n     \
  \  id 5C03F2606CF; Thu,  9 Dec 2010 10:07:48 -0500 (EST)\nTo: <rich@rich-Parallels-Virtual-Platform>\n\
  Subject: Test message\nX-Mailer: mail (GNU Mailutils 2.1)\nMessage-Id: <20101209150748.5C03F2606CF@rich-Parallels-Virtual-Platform>\n\
  Date: Thu,  9 Dec 2010 10:07:48 -0500 (EST)\nFrom: rich@rich-Parallels-Virtual-Platform\
  \ (Rich Blum)\nThis is a test message\n? d\n? q\nHeld 1 message in /var/mail/rich\n\
  $ \n```\n\n第一行显示在不带命令行选项的情况下执行了 `Mailx` 程序。默认情况下，这允许用户检查其信箱中的消息。在输入 `mail` 命令后，会显示用户信箱中所有消息的摘要。`Mailx`\
  \ 程序只能读取 `/var/mail` 格式或 `$HOME/mail` 格式的消息。它无法处理 `Maildir` 邮件文件夹格式的消息。\n\n每个用户都有一个包含其所有消息的独立文件。对于某些\
  \ Linux 发行版，在用户账户接收消息之前，信箱文件是不存在的。文件名通常是用户的系统登录名，位于系统信箱目录中。因此，用户名 `rich` 的所有消息都存储在\
  \ Linux 系统的 `/var/mail/rich` 文件中。当用户收到新消息时，它们会被追加到文件的末尾。\n\n你也可以使用 `mail` 命令行程序发送邮件消息：\n\
  \n```\n$ mail barbara\nCc:\nSubject: This is a test sent to Barbara\nHello Barbara\
  \ -\nThis is a test message I'm sending from the command line.\n$ \n```\n\n## 设置你的服务器\n\
  \n在开始向世界发送你的自动化电子邮件消息之前，你需要确保你的 Linux 系统运行着一个 MTA 包，并且其配置是完全的。这本身并不是一项轻易的任务，但幸运的是，某些\
  \ Linux 发行版提供了一些基本工具来帮助你。\n\n本节将带你了解 Linux 中最常用的两种邮件 MTA 程序：`sendmail` 和 `Postfix`\
  \ 的基础知识。虽然已有专门的书介绍了如何正确配置这些包中的每一个，但我们只需查看基础知识，以了解如何让邮件离开 Linux 系统并进入你的收件箱。\n\n\n\
  \n\n\n# sendmail\n\n`sendmail` MTA 软件包是互联网邮件服务器使用的最流行的开源 MTA 软件包之一。在过去，它曾饱受后门和安全漏洞故事的困扰；然而，它已经经过了重写，不仅消除了安全漏洞，还整合了许多新的\
  \ MTA 特性，例如垃圾邮件控制。新版本的 `sendmail` 程序已被证明既安全又多功能。\n\n## sendmail 程序的组成\n\n主可执行程序称为\
  \ `sendmail`。它通常在后台模式下运行，监听来自远程邮件服务器的 SMTP 连接，并转发本地用户的出站邮件。\n\n除了主 `sendmail` 程序外，还有一个配置文件和若干张表，它们用于包含在处理入站和出站邮件消息时需要的信息。[表\
  \ 25.1] 列出了标准 `sendmail` 安装中使用的所有部分。\n\n### 表 25.1 sendmail 配置文件\n\n| 文件 | 描述 |\n\
  | :--- | :--- |\n| `sendmail.cf` | 控制 `sendmail` 程序行为的文本文件。 |\n| `sendmail.cw` |\
  \ 文本文件，包含 `sendmail` 程序将接收邮件的域名列表。 |\n| `sendmail.ct` | 文本文件，包含可以控制 `sendmail` 操作的信任用户列表。\
  \ |\n| `aliases` | 二进制文件，包含有效本地邮件地址列表，这些地址可以将邮件重定向到另一个用户、文件或程序。 |\n| `newaliases`\
  \ | 可执行程序，从文本文件创建新的 `aliases` 数据库文件。 |\n| `mailq` | 可执行程序，检查邮件队列并打印任何消息。 |\n| `mqueue`\
  \ | 用于存储等待交付的邮件的目录。 |\n| `mailertable` | 用于指定特定域名路由路径的文本文件。 |\n| `domaintable` |\
  \ 用于将旧域名映射到新域名的文本文件。 |\n| `virtusertable` | 用于将用户和域名映射到备用地址的文本文件。 |\n| `relay-domains`\
  \ | 文本文件，列出允许通过 `sendmail` 程序中继消息的特定主机。 |\n| `access` | 文本文件，列出允许或拒绝接收来自特定域名的消息。\
  \ |\n\n除非你正在为公司或互联网服务提供商运行主邮件服务器，否则你需要关心的只有 `sendmail.cf` 配置文件。事实上，许多使用 `sendmail`\
  \ 的 Linux 发行版会自动为你创建并配置一个核心 `sendmail.cf` 配置文件，它在大多数简单应用程序中都能正常工作。\n\n## sendmail.cf\
  \ 文件\n\n`sendmail` 程序需要被告知在服务器接收消息时如何处理它们。作为一种 MTA，`sendmail` 处理入站邮件并将其重定向到另一个邮件包，可以在远程系统，也可以在本地系统。配置文件用于指导\
  \ `sendmail` 如何操作目标邮件地址，以决定在哪里以及如何转发消息。配置文件的默认位置是 `/etc/mail/sendmail.cf`。\n\n`sendmail.cf`\
  \ 文件由规则集组成，这些规则集解析入站邮件消息并确定采取的操作。每个规则集都用于识别特定的邮件格式并指示 `sendmail` 如何处理该消息。\n\n当 `sendmail`\
  \ 程序接收到消息时，它解析邮件头并将消息通过各种规则集，以确定对消息采取的操作。`sendmail` 配置文件包含了允许 `sendmail` 处理许多不同格式邮件的规则。从\
  \ SMTP 主机接收的邮件与从本地用户接收的邮件具有不同的头字段。`sendmail` 程序必须知道如何处理任何邮件情况。\n\n规则在配置文件中还定义了辅助函数。你可以定义三种不同类型的辅助函数：\n\
  \n*   **类（Classes）**：定义常用的短语，用于帮助规则集识别某些类型的消息。\n*   **宏（Macros）**：设置值，以简化配置文件中长字符串的输入。\n\
  *   **选项（Options）**：用于设置 `sendmail` 程序运行的参数。\n\n配置文件由一系列类、宏、选项和规则集组成。每个函数在配置文件中被定义为单行文本。\n\
  \n配置文件中的每行都以一个字符开头，该字符定义了该行的操作。以空格或制表符开头的行是上一一个操作行的延续。以井号（`#`）开头的行表示注释，不会被 `sendmail`\
  \ 处理。\n\n文本行开头的操作定义了该行的用途。[表 25.2] 显示了标准的 `sendmail` 操作及其含义。\n\n### 表 25.2 sendmail\
  \ 配置文件行\n\n| 配置行 | 描述 |\n| :--- | :--- |\n| `C` | 定义文本类 |\n| `D` | 定义宏 |\n| `F`\
  \ | 定义包含文本类的文件 |\n| `H` | 定义头字段和操作 |\n| `K` | 定义包含搜索文本的数据库 |\n| `M` | 定义邮件传输器 (mailers)\
  \ |\n| `O` | 定义 `sendmail` 选项 |\n| `P` | 定义 `sendmail` 优先级值 |\n| `R` | 定义解析地址的规则集\
  \ |\n| `S` | 定义规则集组 |\n\n正如我们提到的，你可能不需要从头开始编写 `sendmail.cf` 配置文件；Linux 发行版应该会为你创建一个标准的模板文件。很可能，你唯一需要担心的只是如果你必须使用智能主机（smart\
  \ host）来为你转发邮件。`DS` 配置行控制此功能：\n\n```\nDSmyisp.com\n```\n\n在 `DS` 标签之后添加智能主机的主机名即可。\n\
  \n# Postfix\n\nPostfix 软件包迅速成为 Unix 和 Linux 系统流行的邮件包之一。Postfix 由 Wietse Venema 开发，旨在为标准的\
  \ Unix 类型服务器提供替代的 MTA。Postfix 软件能够将任何 Unix 或 Linux 系统转变为功能完整的邮件服务器。\n\nMTA 包负责管理进入或离开邮件服务器的消息。Postfix\
  \ 通过使用多个模块化程序和邮件队列系统来实现这种消息跟踪。每个程序通过各种邮件队列处理消息，直到其交付到最终目的地。如果在邮件传输期间邮件服务器发生崩溃，Postfix\
  \ 可以确定消息最后成功放置的队列，并尝试继续处理消息。\n\n## Postfix 系统的组成\n\nPostfix 系统由多个邮件队列目录和可执行程序组成，所有程序相互交互以提供邮件服务。\n\
  \nPostfix 包利用一个始终作为后台进程的主程序。主程序允许 Postfix 启动扫描邮件队列中的新消息并将其发送到目的地的程序。\n\n主程序根据需要启动额外的辅助程序。这些程序可以被配置为在使用后保持运行一段时间。这允许主程序在需要时重用正在运行的辅助程序，从而节省处理时间。在设定的时间限制后，辅助程序会静默停止。\n\
  \n主程序用于控制 Postfix 的整体运行。[表 25.3] 显示了 Postfix 用于传输邮件消息的辅助程序。\n\n### 表 25.3 Postfix\
  \ 辅助程序\n\n| 程序 | 描述 |\n| :--- | :--- |\n| `bounce` | 为退回邮件在退回邮件队列中发布日志并将退回邮件返回给发件者\
  \ |\n| `cleanup` | 处理入站邮件头并将消息放入入站队列 |\n\n\n\n\n\n## Postfix 队列\n\nPostfix 使用多个不同的队列来管理处理过程中的电子邮件消息。每个队列包含处于不同状态的。。表\
  \ 25.4 列出了 Postfix 使用的队列。\n\n| 队列 | 描述 |\n| :--- | :--- |\n| `mail` | 等待处理的来自本地用户的新消息。\
  \ |\n| `incoming` | 等待处理的或来自远程主机的新消息。 |\n| `active` | 准备好进行投递的消息。 |\n| `deferred`\
  \ | 初始投递失败并等待下一次尝试的消息。 |\n| `flush` | 目标为远程主机的消息，这些主机将连接到邮件服务器来获取它们。 |\n| `mail`\
  \ | 如果 Postfix 系统随时关闭，消息将保留在它们最后所在的队列中。当 Postfix 重启时，它将自动从队列开始处理消息。这是 Postfix 的一个优秀特性，使其成为可用最稳健的电子邮件系统之一！\
  \ |\n\n## 配置文件\n\nPostfix 系统的一个至关重要的部分是配置文件。Postfix 使用三个独立的配置文件，允许你设置用于指导 Postfix\
  \ 如何处理消息的参数。与其他 MTA 程序不同，可以在 Postfix 服务器运行时更改配置信息，并发出命令让 Postfix 载入新信息，而无需完全停止邮件服务器。\n\
  \n这三个配置文件通常存储在公共 Postfix 目录中。通常，该目录的默认位置是 `/etc/postfix`。通常，所有用户都有查看配置文件的权限，而只有\
  \ root 用户有更改文件内值的权限。当然，出于安全考虑，可以对此进行修改。表 25.5 列出了配置文件。\n\n表 25.5 Postfix 配置文件\n\n\
  | 文件 | 描述 |\n| :--- | :--- |\n| `install.cf` | 包含安装 Postfix 时使用的安装参数信息。`install.cf`\
  \ 配置文件允许你检索 Postfix 软件首次安装到系统上时使用的安装参数。这提供了一种简单的方法，来确定设置中哪些功能可用或不可用。 |\n| `main.cf`\
  \ | 包含 Postfix 程序在处理消息时使用的参数。 |\n| `master.cf` | 包含 Postfix 主程序在运行核心程序时使用的参数。 |\n\
  \n`master.cf` 配置文件控制 Postfix 核心程序的行为。每个程序都单独列在一行，并带有控制其操作的参数。这是一个带有默认设置的示例 `master.cf`\
  \ 文件：\n\n```\n#==================================\n# service type unpriv root wakeup\
  \ maxproc command + args\n#             (yes)  (yes)  (yes)  (never) (50)\n#==================================\n\
  smtp     inet  n  -  n  -  -  smtpd\npickup   fifo  n  -  n  60  1   pickup\ncleanup\
  \  unix  -  -  n  -  0   cleanup\nqmgr     fifo  n  -  n  300 1   qmgr\nrewrite\
  \  unix  -  -  n  -  -  trivial-rewrite\nbounce   unix  -  -  n  -  0   bounce\n\
  defer    unix  -  -  n  -  0   defer\n```\n\n\n\n\n\n| `-a` | 指定额外的 SMTP 头部行。 |\n\
  | `-b` | 向消息中添加 BCC（密送）收件人。 |\n| `-c` | 向消息中添加 CC（抄送）收件人。 |\n| `-e` | 如果消息为空，则不发送。\
  \ |\n| `-i` | 忽略 TTY 中断信号。 |\n| `-I` | 强制 Mailx 在交互模式下运行。 |\n| `-n` | 不读取 `/etc/mail.rc`\
  \ 启动文件。 |\n| `-s` | 指定主题（Subject）。 |\n| `-v` | 在终端上显示投送详情。 |\n\n正如从 表 25.6 所示，你几乎可以通过命令行参数创建整个电子邮件。你唯一需要添加的是消息正文。\n\
  \n要做到这一点，你需要将文本重定向到 `mail` 命令。这里有一个直接从命令行创建并发送电子邮件的简单示例：\n\n```\n$ echo \"This is\
  \ a test message\" | mail -s \"Test message\" rich\n```\n\nMailx 程序将来自 `echo` 命令的文本作为消息正文。这为你从\
  \ shell 脚本发送消息提供了一种方便的方法。这里有一个快速示例：\n\n```bash\n$ cat factmail\n\n#!/bin/bash\n\
  # 发送阶乘结果\nMAIL='which mail'\nfactorial=1\ncounter=1\nread -p \"Enter the number:\
  \ \" value\nwhile [ $counter -le $value ]\ndo\n    factorial=$[$factorial * $counter]\n\
  \    counter=$[$counter + 1]\ndone\necho The factorial of $value is $factorial |\
  \ mail -s \"Factorial answer\" $USER\necho \"The result has been mailed to you.\"\
  \n```\n\n此脚本并没有假设 Mailx 程序位于标准位置。它使用 `which` 命令来确定 `mail` 程序的具体位置。\n\n在计算完阶乘函数的结果后，shell\
  \ 脚本使用 `mail` 命令将消息发送到用户定义的 `$USER` 环境变量，该变量应该是执行脚本的人。\n\n```bash\n$ ./factmail\n\
  Enter the number: 5\nThe result has been mailed to you.\n$\n```\n\n你只需要检查你的邮箱以查看答案是否送达：\n\
  \n```bash\n$ mail\n\"/var/mail/rich\": 1 message 1 new\n>N    1 Rich Blum      \
  \       Thu Dec  9 10:32  13/586   Factorial answer\n? \nReturn-Path: <rich@rich-Parallels-Virtual-Platform>\n\
  X-Original-To: rich@rich-Parallels-Virtual-Platform\nDelivered-To: rich@rich-Parallels-Virtual-Platform\n\
  Received: by rich-Parallels-Virtual-Platform (Postfix, from userid 1000)\n     \
  \   id B4A2A260081; Thu,  9 Dec 2010 10:32:24 -0500 (EST)\nSubject: Factorial answer\n\
  To: <rich@rich-Parallels-Virtual-Platform>\nX-Mailer: mail (GNU Mailutils 2.1)\n\
  Message-Id: <20101209153224.B4A2A260081@rich-Parallels-Virtual-Platform>\nDate:\
  \ Thu,  9 Dec 2010 10:32:24 -0500 (EST)\nFrom: rich@rich-Parallels-Virtual-Platform\
  \ (Rich Blum)\nThe factorial of 5 is 120\n?\n```\n\n在消息正文中仅只发送一行文本并不总是方便的。通常，你可能需要将整个输出作为电子邮件消息。在这些情况下，你始终可以将文本重定向到临时文件，然后使用\
  \ `cat` 命令并将输出重定向到 `mail` 程序。\n\n这里是一个在电子邮件消息中发送较多数据的示例：\n\n```bash\n$ cat diskmail\n\
  \n#!/bin/bash\n# 在电子邮件中发送当前磁盘统计信息\ndate='date +m/%d/%Y'\nMAIL='which mail'\nTEMP='mktemp\
  \ tmp.XXXXXX'\ndf -k > $TEMP\ncat $TEMP | $MAIL -s \"Disk stats for $date\" $1\n\
  rm -f $TEMP\n```\n\n`diskmail` 程序使用 `date` 命令获取当前日期（带有一些特殊格式），找到 Mailx 程序的路径，然后创建一个临时文件。之后，它使用\
  \ `df` 命令显示当前的磁盘空间统计信息（见第 4 章），并将输出重定向到临时文件。\n\n然后它将临时文件重定向到 `mail` 命令，使用第一个命令行参数作为目标地址，并在主题头中使用当前日期。当你运行脚本时，你不会在命令行输出上看到任何内容：\n\
  \n```bash\n$ ./diskmail rich\n```\n\n但如果你检查你的邮箱，你应该能看到送出的消息：\n\n```bash\n$ mail\n\
  \"/var/mail/rich\": 1 message 1 new\n>N    1 Rich Blum             Thu Dec  9 10:35\
  \  19/1020   Disk stats for 12/09/2010\n? \nReturn-Path: <rich@rich-Parallels-Virtual-Platform>\n\
  X-Original-To: rich@rich-Parallels-Virtual-Platform\nDelivered-To: rich@rich-Parallels-Virtual-Platform\n\
  Received: by rich-Parallels-Virtual-Platform (Postfix, from userid 1000)\n     \
  \   id 3671B260081; Thu,  9 Dec 2010 10:35:39 -0500 (EST)\nSubject: Disk stats for\
  \ 12/09/2010\nTo: <rich@rich-Parallels-Virtual-Platform>\nX-Mailer: mail (GNU Mailutils\
  \ 2.1)\nMessage-Id: <20101209153539.3671B260081@rich-Parallels-Virtual-Platform>\n\
  Date: Thu,  9 Dec 2010 10:35:39 -0500 (EST)\nFrom: rich@rich-Parallels-Virtual-Platform\
  \ (Rich Blum)\nFilesystem     Blocks      Used Available Use% Mounted on\n/dev/sda1\
  \      63315876 25955124 37360752  41% /\n```\n\n\n\n\n\n| `-F` muttrc | 指定一个初始化文件进行读取，而不是\
  \ `$HOME/.muttrc`。 |\n| `-h` | 显示帮助文本。 |\n| `-H` draft | 指定一个包含头信息和正文的草稿文件用于发送消息。\
  \ |\n| `-i` include | 指定一个包含在消息正文中的文件。 |\n| `-m` type | 指定默认邮箱类型。 |\n| `-n` | 忽略系统配置文件。\
  \ |\n| `-p` | 恢复已推迟的消息。 |\n| `-Q` query | 查询配置变量的值。查询会在所有配置文件解析完毕且命令行给出的任何命令执行后执行。\
  \ |\n| `-R` | 以只读模式打开邮箱。 |\n| `-s` subject | 指定消息的主题。 |\n| `-v` | 显示 Mutt 版本号和编译时定义。\
  \ |\n| `-x` | 模拟 Mailx 的组合模式。 |\n| `-y` | 从列出 `mailboxes` 命令指定的所有邮箱开始。 |\n| `-z`\
  \ | 与 `-f` 用时，如果邮箱中没有消息，则不启动。 |\n| `-Z` | 打开 `mailboxes` 命令指定的包含新邮件的第一个邮箱。 |\n\n\
  通过无数种命令行参数，你可以直接从命令行自定义你的电子邮件消息，这正是你在 shell 脚本中想要做的。\n\n与 `Mailx` 程序一样，`Mutt` 程序中有一点是你无法在命令行上指定的，那就是消息的正文文本。如果你不将文本重定向到\
  \ `Mutt` 程序，它将以文本图形模式启动，并打开一个编辑器窗口供你输入消息正文。\n\n对于 shell 脚本来说这不是一件好事，因此你总是希望重定向某种类型的文本作为消息正文，即使你正在使用附件选项来指定要附加的文件。下一节将演示如何这样做。\n\
  \n### 使用 Mutt\n\n现在你准备好在 shell 脚本中使用 `Mutt` 程序了。要在你的 shell 脚本中创建基础的 `mutt` 命令，你需要包含指定消息主题、附件文件以及消息所有收件人的的命令行选项：\n\
  \n```\nmutt -s Subject -a file -- recipients\n```\n\n`recipients` 列表是一个用空格分隔的电子邮箱地址列表。如果你想附加多个文件，可以在\
  \ `-a` 选项之后列出用空格分隔的文件；`--` 符号用于将文件名与收件地址列表隔离开。`file` 参数必须是绝对路径，或者是从运行 `mutt` 命令的当前工作目录相对路径。\n\
  \n`mutt` 命令还有另一个陷阱。如果你没有重定向消息正文文本，Mutt 将自动进入全屏模式，让你在编辑器窗口中输入文本。这可能不是你想要的，所以请确保为消息正文重定向一些文本：\n\
  \n```\necho \"Here's the log file\" | mutt -s file -a /var/log/messages\n```\n\n\
  此命令将系统日志文件作为附件发送到本地系统上的邮箱地址 `rich`。请注意，你还必须拥有访问要附加文件的相应权限。图 25.5 显示了 Evolution 邮件客户端中收到的电子邮件。注意消息包含了来自\
  \ `echo` 语句的正文文本，以及一个单独的附件图标。你可以直接从 KMail 客户端保存附件文件。\n\n> 注意\n> 如果查看附件文件名，你会发现 Mutt\
  \ 使用附件文件的基名（basename）作为名称。使用临时文件时要小心，因为 Mutt 将使用临时文件名作为附件。使用更具描述性的名称来保存临时文件会比使用临时名称要好。\n\
  \n## 总结\n\n本章讨论了如何在 shell 脚本中整合电子邮件。定期向客户发送电子邮件报告是 shell 脚本中可以提供的一个很棒的功能。\n\n在使用命令行发送电子邮件消息之前，你需要了解电子邮件在\
  \ Linux 环境中如何工作，以及你需要安装和配置哪些应用程序。Linux 邮件环境由三个元素组成：邮件传输代理（MTA）程序、邮件传递代理（MDA）程序（通常是\
  \ MTA 程序的一部分）以及邮件用户代理（MUA）程序。\n\nMTA 程序负责为 Linux 系统收发邮件消息。它必须知道如何将传入的邮件传递给正确的用户邮箱，以及如何发送发往远程邮件服务器用户的出站邮件。通常，MTA\
  \ 程序会使用代理服务器（也称为智能主机）来完成投递。它将任何发往远程服务器用户的消息转发给智能主机进行投递。它可以依靠智能主机自行完成投递。\n\nMDA 程序负责确保发往本地用户的邮件进入正确的本地邮箱。有时此功能由\
  \ MTA 程序直接执行。但是，如果你需要高级的邮件投递功能（例如离开通知或垃圾邮件过滤），你可以配置 MTA 程序将消息传递给 MDA 程序，后者通常内置了这些功能。\n\
  \nMUA 程序允许单个系统用户访问其邮箱中的消息，并将出站消息传递给 MTA 进行投递。这些程序范围从简单的命令行程序（如 `Mailx` 和 `Mutt`）到精美的图形化程序（如\
  \ `KMail` 和 `Evolution`）。\n\n从 shell 脚本发送电子邮件最简单的方法是使用 `Mailx` 程序。该程序允许你在命令行上指定主题头和一个或多个收件人。你通过将文本重定向到\
  \ `Mailx` 程序来创建消息正文。你可以使用 `echo` 命令处理单行文本，或使用 `cat` 命令将文件内容重定向到邮件消息。\n\n`Mutt` 程序是一个更高级的命令行\
  \ MUA 程序，它提供了为邮件消息附加文件的能力，而不是在消息正文中包含文本。这允许你附加大型文本文件，客户可以轻松将其保存到磁盘，并在其他程序（如表格或文字处理软件包）中检查。\n\
  \n本书的最后两章涵盖了 shell 脚本的重要部分：编写脚本管理函数。如果你是 Linux 系统管理员，很可能会遇到想要定期监控系统功能状态的情况。通过创建一个\
  \ shell 脚本并将其放在 `cron` 任务中，你可以轻松监控 Linux 系统中发生的情况。\n\n### 第 26 章：编写脚本工具\n\n在本章中：\n\
  * 监控磁盘空间\n* 执行备份\n* 管理用户账户\n\n没有地方比为 Linux 系统管理员编写脚本工具的 shell 脚本编程更有用了。典型的 Linux\
  \ 系统管理员每天有许多需要完成的工作，从监控磁盘空间到备份重要文件再到管理用户账户。shell 脚本工具可以让系统管理员的生活变得简单得多！本章演示了在 `bash`\
  \ shell 中编写脚本工具的一些能力。\n\n## 监控磁盘空间\n\n多用户 Linux 系统最大的问题之一是可用磁盘空间量。在某些情况下（例如文件共享服务器），仅仅因为一个粗心的用户，磁盘空间就可能立即填满。\n\
  \n\n\n\n\n此 shell 脚本工具可以帮助你确定指定目录中占用磁盘空间排名前十的项目。它会生成带有日期戳的报告，允许你监控磁盘空间消耗趋势。\n\n\
  ## 所需的函数\n\n你需要使用的第一个工具是 `du` 命令（参见第 4 章）。该命令显示单个文件和目录的磁盘使用情况。`-s` 选项允许你在目录层级汇总总量。这在计算单个用户使用的总磁盘空间时非常有用。以下是使用\
  \ `du` 命令对 `/home` 目录下每个用户的 `$HOME` 目录进行汇总示例：\n\n```\n$ du -s /home/*\n6174428 \
  \     /home/consultant\n4740           /home/Development\n4740           /home/Production\n\
  3860           /home/Samantha\n7916           /home/Timothy\n140376116      /home/user\n\
  $\n```\n\n`-s` 选项对于用户的 `$HOME` 目录很好，但如果我们想查看像 `/var/log` 等系统目录的磁盘占用情况怎么办？\n\n```\n\
  $ du -s /var/log/*\n4           /var/log/alternatives.log\n44          /var/log/alternatives.log.1\n\
  4           /var/log/apparmor\n176         /var/log/apt\n0           /var/log/aptitude\n\
  4           /var/log/aptitude.1.gz\n4           /var/log/aptitude.2.gz\n4      \
  \     /var/log/aptitude.3.gz\n4           /var/log/aptitude.4.gz\n4           /var/log/aptitude.5.gz\n\
  160         /var/log/auth.log\n...\n$\n```\n\n列表很快变得过于详细。`-S` 选项在这里更符合我们的需求，它能为每个目录和子目录单独提供总计。这允许你快速定位问题区域：\n\
  \n```\n$ du -S /var/log\n176      /var/log/apt\n52       /var/log/exim4\n1048  \
  \   /var/log/dist-upgrade/20101011-1337\n6148     /var/log/dist-upgrade\n1248  \
  \   /var/log/installer\n228      /var/log/gdm\n4        /var/log/news\n4       \
  \ /var/log/samba/cores/winbindd\n4        /var/log/samba/cores\n16       /var/log/samba\n\
  4        /var/log/unattended-upgrades\n4        /var/log/sysstat\n4        /var/log/speech-dispatcher\n\
  108      /var/log/ConsoleKit\n64       /var/log/cups\n4        /var/log/apparmor\n\
  12       /var/log/fsck\n4844     /var/log\n$\n```\n\n由于我们感兴趣的是占用最大磁盘空间块的目录，你需要对\
  \ `du` 生成的列表使用 `sort` 命令（参见第 4 章）：\n\n```\n$ du -S /var/log | sort -rn\n6148   \
  \ /var/log/dist-upgrade\n4864    /var/log\n1248    /var/log/installer\n1048    /var/log/dist-upgrade/20101011-1337\n\
  228     /var/log/gdm\n176     /var/log/apt\n108     /var/log/ConsoleKit\n64    \
  \  /var/log/cups\n52      /var/log/exim4\n16      /var/log/samba\n12      /var/log/fsck\n\
  4       /var/log/unattended-upgrades\n4       /var/log/sysstat\n4       /var/log/speech-dispatcher\n\
  4       /var/log/samba/cores/winbindd\n4       /var/log/samba/cores\n4       /var/log/news\n\
  4       /var/log/apparmor\n$\n```\n\n`-n` 选项允许你进行数值排序。`-r` 选项将最大的数字列在前。这对于寻找最大的占用者非常完美。`sed`\
  \ 编辑器（参见第 18 和第 20 章）将使列表更加清晰。为了聚焦前十名磁盘占用者，当到达第 1 行时，`sed` 被设置为删除列表的剩余部分。下一步是为每行添加行号。第\
  \ 18 章已向了如何通过向 `sed` 命令添加等号 `=` 来实现这一点。为了让这些行号与磁盘空间在同一行，正如我们在第 20 章中做的那样，使用 `N`\
  \ 命令合并文本行。`sed` 命令如下：\n\n```bash\nsed '{1,$D}' | sed 'N; /'\n```\n\n现在可以使用 `awk`\
  \ 命令清理输出（参见第 21 章）。来自 `sed` 编辑器的输出被传递给 `awk` 命令，然后使用 `printf` 函数打印出来。\n\n```bash\n\
  awk '{printf $1 \":\\t\" $2 \"\\t\" $3 \"\\n\"}'\n```\n\n在行号之后添加了一个冒号（`:`），并在每行输出的各个字段之间放置了制表符（`\\\
  t`）。这产生了一个格式整齐的前十名磁盘空间占用者列表。\n\n```bash\n$ du -S /var/log | sort -rn | sed '{1,$D}'\
  \ | sed 'N; /' | awk '{printf $1 \":\\t\" $2 \"\\t\" $3 \"\\n\"}'\n1:   6148   \
  \ /var/log/dist-upgrade\n2:   4864    /var/log\n3:   1248    /var/log/installer\n\
  4:   1048    /var/log/dist-upgrade/20101011-1337\n5:   228     /var/log/gdm\n6:\
  \   176     /var/log/apt\n7:   108     /var/log/ConsoleKit\n8:   64      /var/log/cups\n\
  9:   52      /var/log/exim4\n10:  16      /var/log/samba\n$\n```\n\n现在你已经入门了！下一步是使用这些信息创建脚本。\n\
  \n## 创建脚本\n\n为了节省时间和精力，脚本为多个指定目录创建报告。使用一个名为 `CHECK_DIRECTORIES` 的变量来实现这一点。对于我们的目的，该变量被设置为仅两个目录：\n\
  \n```bash\nCHECK_DIRECTORIES=\"/var/log /home\"\n```\n\n脚本包含一个 `for` 循环，对变量列出的每个目录执行\
  \ `du` 命令。这种技术用于（参见第 12 章）读取和处理列表中的值。每当 `for` 循环遍历变量 `CHECK_DIRECTORIES` 中的值列表时，它会将列表中的下一个值赋值给\
  \ `DIR_CHECK` 变量：\n\n```bash\nfor DIR_CHECK in $CHECK_DIRECTORIES\ndo\n  ...\n \
  \ du -S $DIR_CHECK\n  ...\ndone\n```\n\n为了便于快速识别，使用 `date` 命令在报告的文件名添加了日期戳。使用 `exec`\
  \ 命令（参见第 14 章），脚本将其输出重定向到带有日期戳的报告文件：\n\n```bash\nDATE=$(date '+%m%d%y')\nexec >\
  \ disk_space_$DATE.rpt\n```\n\n现在，为了产生格式良好的报告，脚本使用 `echo` 命令放入几个报告标题：\n\n```bash\n\
  echo \"Top Ten Disk Usage\"\necho \"for $CHECK_DIRECTORIES Directories\"\n```\n\n\
  让我们来看看整个脚本是如何组合的：\n\n```bash\n#!/bin/bash\n#\n# Big_Users - 查找各种目录的大磁盘占用者\n###############################################\n\
  # Parameters for Script\n# \nCHECK_DIRECTORIES=\"/var/log /home\"   # 要检查的目录\n#\
  \ \n############## Main Script #################################\n#\nDATE=$(date\
  \ '+%m%d%y')              #报告文件的日期\n# \nexec > disk_space_$DATE.rpt         #报告标准输出\n\
  #\necho \"Top Ten Disk Usage\"           # 报告标题\necho \"for $CHECK_DIRECTORIES Directories\"\
  \nfor DIR_CHECK in $CHECK_DIRECTORIES #循环目录\ndo\n  echo \"\"\n  echo \"The $DIR_CHECK:\"\
  \           # 每个目录的标题\n  # 创建占用者列表\n  du -S $DIR_CHECK | sed '{1,$D}' | sed 'N;\
  \ /' | awk '{printf $1 \":\\t\" $2 \"\\t\" $3 \"\\n\"}'\ndone                  \
  \              #循环结束\n```\n\n就这样。这是一个为你选择的目录创建日期戳报告的简单 shell 脚本。\n\n## 运行脚本\n\n\
  在让 `Big_Users` 脚本自动运行之前，你想手动测试几次，以确保它的运行符合预期：\n\n```\n$\n$ ./Big_Users\n$\n$ cat\
  \ disk_space_012311.rpt\nTop Ten Disk Usage\nfor /var/log /home Directories\nThe\
  \ /var/log:\n1:   6148    /var/log/dist-upgrade\n2:   4864    /var/log\n3:   1248\
  \    /var/log/installer\n4:   1048    /var/log/dist-upgrade/20101011-1337\n5:  \
  \ 176     /var/log/apt\n6:   108     /var/log/ConsoleKit\n7:   64      /var/log/cups\n\
  8:   52      /var/log/exim4\n9:   16      /var/log/samba\n```\n\n\n\n\n\n```\n7:\
  \           64 /var/log/cups\n8:           52 /var/log/exim4\n9:           16 /var/log/samba\n\
  10:          12 /var/log/fsck\n```\n\n`/home` 目录：\n\n1:        92365332 /home/user/.VirtualBox/HardDisks\n\
  2:        18659720 /home/user/Downloads\n3:        17626092 /home/user/archive\n\
  4:        6174408 /home/Timothy/Junk/More_Junk\n5:        6174408 /home/Timothy/Junk\n\
  6:        6174408 /home/consultant/Work\n7:        6174408 /home/consultant/Downloads\n\
  8:        3227768 /home/user/vmware/Mandriva\n9:        3212464 /home/user/vmware/Fedora\n\
  10:         104632 /home/user/vmplayer\n```\n$\n\n成功了！现在你可以设置 shell 脚本根据需要自动执行。你可以使用\
  \ `cron` 表来实现此功能（参见第 15 章）。\n\n> 注意\n> > 当运行包含需要 root 权限的 bash shell 命令的脚本时，你需要使用\
  \ `su` 或 `sudo` 命令。否则，脚本将产生意想不到的结果。\n\n运行此脚本的频率取决于你的文件服务器的活跃程度。要每周运行一次脚本，请向你的 `cron`\
  \ 表添加以下条目：\n\n```\n15 7 * * 1 /home/user/Big_Users\n```\n\n该条目会在每周一早上 7:15 运行 shell\
  \ 脚本。现在，你可以在周一早上第一时间喝着咖啡，查看你的每周磁盘占用报告了。\n\n# 执行备份\n\n无论你是在商业环境中负责 Linux 系统，还是仅仅在家里使用，数据丢失都可能是灾难性的。为了防止糟糕情况的发生，定期备份是一个好主意。\n\
  \n然而，良好的主意和实际可行性往往是两回事。尝试安排备份计划来存储重要文件可能是一项挑战。这也是 shell 脚本经常大显身手的地方。\n\n本节演示了使用\
  \ shell 脚本备份 Linux 系统数据的两种不同方法。\n\n# 归档数据文件\n\n如果你正在使用 Linux 系统处理重要项目，可以创建一个 shell\
  \ 脚本来自动对特定目录创建快照。在配置文件中指定这些目录允许你在特定项目发生变化时更改它们。这将有助于避免从主存档文件中进行耗时的恢复过程。\n\n本节将向你展示如何创建一个自动化\
  \ shell 脚本，对指定的目录创建快照，并保留数据过去版本的存档。\n\n## 所需函数\n\nLinux 世界中归档数据的核心工具是 `tar` 命令（参见第\
  \ 4 章）。`tar` 命令用于将整个目录归档为单个文件。这是一个使用 `tar` 命令创建工作目录归档文件的示例：\n\n```\n$ tar -cf archive.tar\
  \ /home/user/backup_test\ntar: Removing leading ‘/’ from member names\n$\n```\n\n\
  `tar` 命令会返回一条警告信息，说明它正在从路径中删除起始的正斜杠，将其从绝对路径转换为相对路径（参见第 3 章）。这允许你在文件系统的任何位置提取这些 `tar`\
  \ 归档文件。你可能想在脚本中消除这条信息。可以通过将 `STDERR` 重定向到 `/dev/null` 文件来实现（参见第 14 章）：\n\n```\n\
  $ tar -cf archive.tar /home/user/backup_test 2>/dev/null\n$\n```\n\n由于 `tar` 归档文件可能会占用大量磁盘空间，因此压缩文件是一个好主意。你可以通过简单添加\
  \ `-z` 选项来实现。这将 tar 归档文件压缩为 gzipped `tar` 文件，称为 tarball。请确保使用正确的文件扩展名表示该文件是 tarball。使用\
  \ `.tar.gz` 或 `.tgz` 都可以。这是一个创建工作目录 tarball 的示例：\n\n```\n$ tar -zcf archive.tar.gz\
  \ /home/user/backup_test 2>/dev/null\n$\n```\n\n现在你已经完成了归档脚本的主要组件。\n\n与其为每个想要备份的新目录或文件修改或创建新的存档脚本，你可以使用配置文件。配置文件应该包含你想包含在存档中的每个目录或文件：\n\
  \n```\n$ cat Files_To_Backup\n/home/user/Downloads\n/home/user/Documents/CLandSS_V2\n\
  /home/Samantha/Documents\n/home/Does_not_exist\n/home/Timothy/Junk\n/home/consultant/Work\n\
  $\n```\n\n> 注意\n> 如果你使用的是包含图形桌面的 Linux 发行版，请小心归档整个 `$HOME` 目录。虽然这看起来很好，但 `$HOME`\
  \ 目录包含许多与图形桌面相关的配置和临时文件。这将创建一个比你预期的大得多的存档文件。选择一个存储工作文件的子目录，并在归档配置文件中使用该子目录。\n\n\
  你可以让脚本读取配置文件并将每个目录或文件的名称添加到存档列表中。要做到这一点，请使用简单的 `read` 命令（参见第 13 章）从文件中读取每条记录。但与我们在第\
  \ 13 章中那样将 `cat` 命令通过到 `while` 循环不同，此脚本将使用 `exec` 命令重定向 `STDINPUT`（参见第 14 章）。它看起来如下：\n\
  \n```\nexec < $CONFIG_FILE\nread FILE_NAME\n```\n\n注意，归档配置文件以及从文件中读取的每条记录都使用了变量。只要\
  \ `read` 命令在配置文件中找到新记录进行读取，它就会在 `?` 变量中返回退出 0 表示成功（参见第 10 章）。你可以将其用作 `while` 循环中的测试，以读取配置文件中的所有记录：\n\
  \n```\nwhile [ $? -eq 0 ]\ndo\n  ...\nread FILE_NAME\n```\n\n\n\n\n`Daily_Archive`\
  \ 脚本会自动在指定位置创建一个归档，并使用当前日期来唯一标识文件。以下是脚本该部分的代码：\n\n```bash\nDATE='date +y%m%d'\n\n\
  #\n# 设置归档文件名\n#\nFILE=archive$DATE.tar.gz\n#\n# 设置配置文件和目标文件\n#\nCONFIG_FILE=/home/user/archive/Files_To_Backup\n\
  DESTINATION=/home/user/archive/$FILE\n```\n\n`DESTINATION` 变量附加了归档文件的完整路径。`CONFIG_FILE`\
  \ 变量指向包含要归档文件的归档配置文件。如果需要，这两者都可以轻松更改为备用目录和文件。\n\n整合在一起，`Daily_Archive` 脚本现在看起来如下：\n\
  \n```bash\n#!/bin/bash\n#\n# Daily_Archive - 归档指定的文件和目录\n###############################################\n\
  #\n# 获取当前日期\n#\nDATE='date +y%m%d'\n\n#\n# 设置归档文件名\n#\nFILE=archive$DATE.tar.gz\n\
  #\n# 设置配置文件和目标文件\n#\nCONFIG_FILE=/home/user/archive/Files_To_Backup\nDESTINATION=/home/user/archive/$FILE\n\
  ######### 主脚本 ##########\n#\n# 检查备份配置文件是否存在\n#\nif [ -f $CONFIG_FILE ]   # 确保配置文件仍然存在。\
  \ \nthen                # 如果存在，则什么都不做继续执行。  \n      echo\nelse                #\
  \ 如果不存在，发出错误并退出脚本。\n      echo\n      echo “CONFIG_FILE 不存在。”\n      echo “由于缺少文件，备份完成”\
  \ \n      echo\n      exit\nfi\n#\n# 构建所有待备份的文件名 \n#\nFILE_NO=1    # 从配置文件的第 1 行开始。\
  \ \nexec < $CONFIG_FILE    # 将标准输入重定向到配置文件名\n#\nread FILE_NAME      # 读取第一条记录 \n\
  #\nwhile [ $? -eq 0 ]    # 创建要归档的文件列表。 \ndo\n    # 确保文件或目录存在。\n    if [ -f $FILE_NAME\
  \ -o $FILE_NAME ]\n    then\n        # 如果文件存在，将其名称添加到列表。\n        FILE_LIST=”FILE_LIST\
  \ $FILE_NAME”\n    else\n        # 如果文件不存在，发出警告\n        echo\n        echo “FILE_NAME\
  \ 不存在。”\n        echo “显然，我不会将其包含在此归档中。”\n        echo “它列在配置文件的 $FILE_NO 行。”\n\
  \        echo “正在继续构建归档列表...” \n        echo\n    fi\n#\n    FILE_NO=$[$FILE_NO\
  \ + 1] # 行号/文件数加 1。 \n    read FILE_NAME      # 读取下一条记录。 \ndone\n#\n#######################################\n\
  #\n# 备份文件并压缩归档\n#\ntar -czf $DESTINATION $FILE_LIST 2> /dev/null\n```\n\n### 运行每日归档脚本\n\
  \n测试 `Daily_Archive` 脚本非常简单：\n\n```bash\n$ ./Daily_Archive\n/home/Does_not_exist,\
  \ 不存在。 \n显然，我不会将其包含在此归档中。 \n它列在配置文件的第 4 行。 \n正在继续构建归档列表... \n```\n\n你可以看到脚本捕获了一个不存在的目录\
  \ `/home/Does_not_exist`。它让你知道该错误目录位于配置文件的第几行，然后继续创建列表并归档数据。数据现在已安全地归档在 tarball\
  \ 文件中。\n\n### 创建每小时归档脚本\n\n如果你处于文件变化快速的高并发生产环境中，每日归档可能并不理想。如果你想将归档频率增加到每小时一次，你需要考虑另一个因素。\n\
  \n当每小时备份文件并尝试使用 `date` 命令为每个文件名添加时间戳时，情况会很快变得糟糕。在筛选具有此类文件名的文件目录是非常枯燥的：\n\n`archive0102110233.tar.gz`\n\
  \n与其将所有归档文件放在同一个文件夹中，不如为你的归档文件创建一个目录层次结构。这种原则是：归档目录包含每年每个月的目录，使用月份数字作为目录名。每个月的目录又包含该月每一天的文件夹（使用日期的数值作为目录名）。这允许你只需为单个归档文件标记时间戳，然后将其放在相应的日期和月份目录中。\n\
  \n现在有一个新挑战要解决。脚本必须自动创建各个月份和日期目录，并且知道如果它们已经存在，则不需要创建。\n\n如果你查阅 `mkdir` 的命令行（参见第 3\
  \ 章），你会发现 `-p` 命令行选项。此选项允许你在单个命令中创建目录和子目录；此外，额外的好处是如果目录已存在，它不会产生错误信息。完美！\n\n我们现在准备好创建\
  \ `Hourly_Archive` 脚本了。这是脚本的上部分：\n\n```bash\n#!/bin/bash\n#\n# Hourly_Archive -\
  \ 每小时创建一个归档\n#############################\n#\n# 设置配置文件\n#\nCONFIG_FILE=/home/user/archive/hourly/Files_To_Backup\n\
  #\n# 设置基础归目标位置\n#\nBASEDEST=/home/user/archive/hourly\n#\n# 获取当前日期、月份和时间\n#\nDAY='date\
  \ +d'\nMONTH='date +m'\nTIME='date +%M'\n#\n# 创建归档目标目录\n#\nmkdir -p $BASEDEST/$MONTH/$DAY\n\
  #\n# 构建归档目标文件名\n#\nDESTINATION=$BASEDEST/$MONTH/$DAY/archive$TIME.tar.gz\n#\n##########\
  \ 主脚本 #####\n...\n```\n\n一旦脚本到达 `Hourly_Archive` 的“主脚本”部分，该脚本与 `Daily_Archive` 脚本完全相同。大部分工作已经完成了！`Hourly_Archive`\
  \ 从 `date` 命令中获取日期和月份值，以及用于唯一标识归档文件的时间戳。然后它使用这些信息创建当天的归档目录（如果已存在则静默退出）。最后，脚本使用 `tar`\
  \ 命令创建归档并将其压缩为 tarball。\n\n### 运行每小时归档脚本\n\n与 `Daily_Archive` 脚本一样，在将其放入 `cron`\
  \ 表之前测试 `Hourly_Archive` 脚本是一个好主意：\n\n```bash\n$ cat /home/user/archive/hourly/Files_To_Backup\n\
  /home/Development/Simulation_Logs\n/home/Production/Machine_Errors\n$\n$ ./Hourly_Archive\n\
  $\n$ ls /home/user/archive/hourly/01/02\narchive1601.tar.gz\n$\n$ ./Hourly_Archive\n\
  $ ls /home/user/archive/hourly/01/02\narchive1601.tar.gz archive1602.tar.gz\n$\n\
  ```\n\n脚本第一次运行正常，创建了相应的月份和日期目录，然后创建了归档文件。为了测试，再次运行它以查看是否会对现有目录产生问题。脚本再次运行正常并创建了第二个归档文件。它现在可以用于\
  \ `cron` 表了。\n\n### 管理用户账户\n\n用户账户不仅仅是添加、修改和删除账户。你还需要考虑安全问题、保留工作的需求以及准确管理账户。这是一项耗时的任务。这是另一个编写脚本工具真正节省时间的实例！\n\
  \n### 需要的函数\n\n删除账户是账户管理中更复杂的任务。在删除账户时，至少需要四个独立操作：\n\n1. 获取要删除的正确账户名称。\n\n\n\n\n\
  > 2. 杀死系统中当前运行的属于该账户的所有进程。\n> 3. 确定系统中所有属于该账户的文件。\n> 4. 删除该用户账户。\n\n很容易漏掉某一个步骤。本节中的\
  \ Shell 脚本工具将帮助你避免犯此类错误。\n\n## 获取正确的账户名\n\n删除账户过程的第一步是最重要的，即获取要删除的正确账户名。由于这是一个交互式脚本，你可以使用\
  \ `read` 命令（参见第 13 章）来获取账户名。如果脚本用户离开了并让问题悬挂在那里，你可以使用 `read` 命令的 `-t` 选项，在给脚本用户 60\
  \ 秒时间回答问题后超时：\n\n```bash\necho “Please enter the username of the user ”\necho -e\
  \ “account you wish to delete from system: \\c”\nread -t 60 ANSWER\n```\n\n由于中断是生活的一部分，最好给用户三次回答问题的机会。为了实现这一点，请使用\
  \ `while` 循环（参见第 12 章）并配合 `-z` 选项来测试 `ANSWER` 变量是否为空。当脚本第一次进入 `while` 循环时，`ANSWER`\
  \ 变量长度为零，因为问题会被放在循环的末端：\n\n```bash\nwhile [ -z “$ANSWER” ]\ndo\n  ...\necho “Please\
  \ enter the username of the user ”\necho -e “account you wish to delete from system:\
  \ \\c”\nread -t 60 ANSWER\ndone\n```\n\n现在你需要一种方法与脚本用户通信，告知第一次问题超时的情况、还有一次回答问题的机会等等。`case`\
  \ 语句（参见第 11 章）是可以在此处完美工作的结构化命令。通过使用递增的 `ASK_COUNT` 变量，你可以设置不同的消息与脚本用户通信。该部分的代码如下：\n\
  \n```bash\ncase $ASK_COUNT in\n2)\n      echo\n      echo “Please answer the question.”\n\
  \      echo\n;;\n3)\n      echo\n      echo “One last try...please answer the question.”\n\
  \      echo\n;;\n4)\n      echo\n      echo “Since you refuse to answer the question...”\n\
  \      echo “exiting.”\n      echo\n      exit\n;;\nesac\n```\n\n现在脚本已经拥有了请求用户删除账户所需的所有结构。此脚本中有几个问题你需要提问，仅仅问一个问题就已经写了大量代码！因此，让我们这段代码转换为一个函数（参见第\
  \ 16 章），以便在你的 `Delete_User` 脚本的多个位置使用它。\n\n你首先做的第一件事是声明函数名 `get_answer`。接下来，使用 `unset`\
  \ 命令（参见第 5 章）清除脚本用户之前提供的任何回答。执行这些操作的代码如下：\n\n```bash\nfunction get_answer{\nunset\
  \ ANSWER\n```\n\n你在原始代码中需要更改另一个项目是对向脚本用户的实际问题。脚本不会每次都问同一个问题，所以让我们创建两个变量 `LINE1`\
  \ 和 `LINE2` 来处理问题所在行：\n\n```bash\necho $LINE1\necho -e $LINE2 \\c\n```\n\n然而，并不是每个问题都有两行。有些只有一行。使用\
  \ `if` 结构（参见第 1 章）来协助解决这个问题。该函数将测试 `LINE2` 是否为空，如果为空，则仅使用 `LINE1`：\n\n```bash\n\
  if [ -n “$LINE2” ]\nthen\n  echo $LINE1\n  echo -e $LINE2 \\c\nelse\n  echo -e $LINE1\
  \ \\c\nfi\n```\n\n最后，我们的函数需要通过清除 `LINE1` 和 `LINE2` 变量来自我清理。因此，函数现在看起来是：\n\n```bash\n\
  function get_answer{\nunset ANSWER\nASK_COUNT=0\nwhile [ -z “$ANSWER” ]\ndo\n  ASK_COUNT=$[\
  \ ASK_COUNT + 1 ]\n  case $ASK_COUNT in\n  2)\n      echo ...\n  esac\n  echo\n\
  \  if [ -n “$LINE2” ]\n  then      #打印 2 行\n    echo $LINE1\n    echo -e $LINE2\
  \ \\c\n  else      #打印 1 行\n    echo -e $LINE1 \\c\n  fi\n  read -t 60 ANSWER\n\
  done\nunset LINE1\nunset LINE2\n} # get_answer 函数结束\n```\n\n要询问脚本用户要删除哪个账户，你需要设置几个变量然后调用\
  \ `get_answer` 函数。使用新函数使脚本代码变得简单得多：\n\n```bash\nLINE1=“Please enter the username\
  \ of the user ”\nLINE2=“account you wish to delete from system:”\nget_answer\nUSER_ACCOUNT=$ANSWER\n\
  ```\n\n由于可能存在拼写错误，你希望验证输入的账户名。因为我们已经有了代码来处理提问：\n\n```bash\nLINE1=“Is $USER_ACCOUNT\
  \ the user ”\nLINE2=“you wish to delete from system? y/n”\nget_answer\n```\n\n一旦提问，脚本需要处理回答。变量\
  \ `ANSWER` 携带用户对问题的回答。如果用户回答“是”，你就获得了要删除账户。可以使用 `case` 语句（参见第 1 章）来处理回答。确保代码处理输入“是”的情况：\n\
  \n```bash\ncase $ANSWER in\ny|yes|yEs|yS|yES ) \n;;\n*)\n  echo “the account, $USER_ACCOUNT,\
  \ is not ”\n  echo “the one you wish to delete, we are leaving the script...”\n\
  \  exit\n;;\nesac\n```\n\n脚本多次需要处理用户的是/否回答。因此，创建一个函数来处理这项任务是合理的。只需要对前面的代码进行少量修改。简单地声明函数名并将\
  \ `EXIT_LINE1` 和 `EXIT_LINE2` 变量添加到 `case` 语句中。结合最后的变量清理，这些将产生 `process_answer`\
  \ 函数：\n\n```bash\nfunction process_answer{\ncase $ANSWER in\ny|yes|yEs|yS|yES )\
  \ \n;;\n*)\n  echo $EXIT_LINE1\n  echo $EXIT_LINE2\n  exit\n;;\nesac\nunset EXIT_LINE1\n\
  unset EXIT_LINE2\n} # process_answer 函数结束\n```\n\n简单的函数调用现在将处理回答：\n\n```bash\nEXIT_LINE1=“Because\
  \ the account, $USER_ACCOUNT, is not ”\nEXIT_LINE2=“the one you wish to delete,\
  \ we are leaving the script...”\nprocess_answer\n```\n\n用户给了我们要删除的账户并进行了验证。现在是双检查该账户是否存在于系统的良好时间。此外，向脚本用户显示完整的账户记录以检查这真的是要删除的账户。为了完成这些操作，使用变量\
  \ `USER_ACCOUNT_RECORD`，并设置为对 `/etc/passwd` 文件的 `grep`（参见第 4 章）搜索结果。`-w` 选项允许在该特定用户账户的账户记录中进行精确词匹配：\n\
  \n```bash\nUSER_ACCOUNT_RECORD=$(cat /etc/passwd | grep -w $USER_ACCOUNT)\n```\n\
  \n如果在 `/etc/passwd` 中没有找到任何用户账户记录，这意味着该账户已经被删除或从未存在过。在任何情况下，你都需要让脚本用户知道并退出脚本。`grep`\
  \ 命令的退出状态将在此帮助我们。如果没有找到账户记录，`?` 变量将被设置为 1：\n\n```bash\nif [ $? -eq 1 ]\nthen\n \
  \ echo “Account, $USER_ACCOUNT, not found. ”\n  echo “Leaving the script...”\n \
  \ exit\nfi\n```\n\n\n\n\n```bash\necho \"I found this record:\"\necho $USER_ACCOUNT_RECORD\n\
  echo\n#\nLINE1=\"Is this the correct User Account? [y/n]\"\nget_answer\n#\nEXIT_LINE1=\"\
  Because the account, $USER_ACCOUNT, is not\"\nEXIT_LINE2=\"the one you wish to delete,\
  \ we are leaving the script...\"\nprocess_answer\n```\n\n# 账户进程\n\n到目前为止，你已经获取并验证了要删除的用户账户正确名称。为了从系统中移除该用户账户，该账户不能拥有任何当前运行的进程。因此，你的下一步是找到并杀掉这些进程。这将变得有点复杂！\n\
  \n查找用户进程将是简单的一部分。在这里，脚本可以使用 `ps` 命令（参见第 4 章）和 `-u` 选项来定位任何由该账户拥有的进程。如果确实存在任何进程，它们将显示给脚本用户。\n\
  \n```bash\nps -u $USER_ACCOUNT\n```\n\n你可以使用 `ps` 命令的退出状态和 `case` 结构来确定下一步采取的措施：\n\
  \n```bash\ncase $? in\n1)\n    echo \"There are no processes for this account currently\
  \ running.\"\n    echo\n;;\n0)\n    unset ANSWER\n    LINE1=\"Would you like me\
  \ to kill the process(es)? [y/n]\"\n    get_answer\n...\nesac\n```\n\n如果退出状态返回 1，则系统中没有属于该用户账户的运行进程。然而，如果退出状态返回\
  \ 0，则系统上运行着该该账户的进程。在这种情况下，脚本需要询问脚本用户他们是否想要杀掉这些进程。你可以通过使用 `get_answer` 函数完成此任务。\n\
  \n你可能认为脚本的下一步操作是调用 `process_answer` 函数。遗憾的是，下一个项目对于 `process_answer` 来说太复杂了。你需要嵌入另一个\
  \ `case` 语句来处理脚本用户的回答。`case` 语句的第一部分看起来与我们的 `process_answer` 函数非常相似：\n\n```bash\n\
  case $ANSWER in\n    y|Y|YES|yes|Yes|yEs|yeS|YEs|yES ) # 如果用户回答 \"yes\"，\n     \
  \                                  #杀掉用户账户进程。\n...\n;;\n*)   # 如果用户回答 \"yes\" 以外的任何内容，则不杀死。\n\
  \    echo\n    echo \"Will not kill the process(s)\"\n    echo\n;;\nesac\n```\n\n\
  如你所见，`case` 语句本身并没有特别有趣的地方。有趣的地方在于 `case` 语句中的 \"yes\" 部分。在这里，需要杀掉用户账户进程。要这样做，重新执行\
  \ `ps` 命令，这次将输出发送到临时报告文件而不是屏幕。\n\n```bash\nps -u $USER_ACCOUNT > $USER_ACCOUNT_Running_Process.rpt\n\
  ```\n\n你可以使用 `exec` 命令和 `while` 循环来读取报告文件，类似于我们在 `Daily_Archive` 脚本中读取备份配置文件的方法。\n\
  \n```bash\nexec < $USER_ACCOUNT_Running_Process.rpt\nread USER_PROCESS_REC\nwhile\
  \ [ $? -eq 0 ]\ndo\n...\n    read USER_PROCESS_REC\ndone\n```\n\n在 `while` 循环内部，使用\
  \ `cut` 命令从每个运行进程的状态记录中提取进程 ID (PID)。一旦获得 PID，就使用 `kill` 命令（参见第 4 章）配合 `-9` 选项无条件地终止进程。\n\
  \n```bash\nUSER_PID=$(echo $USER_PROCESS_REC | cut -d \" \" -f1)\nkill -9 $USER_PID\n\
  echo \"Killed process $USER_PID\"\n```\n\n现在任何用户账户拥有的进程都被杀掉，脚本可以移动到下一步，查找该用户账户的所有文件。\n\
  \n# 查找账户文件\n\n当用户账户从系统中删除时，归档属于该账户的所有文件是一个良好的习惯。除了这种做法之外，移除文件或将它们的所有权分配给另一个账户也很重要。如果你删除的账户用户\
  \ ID 为 1003，而你没有移除或重新分配这些文件，那么下一个创建的用户 ID 为 1003 的账户将拥有这些文件！你可以看到在这种情况下可能发生的安全灾难。\n\
  \n`Delete_User` 脚本不会为你完成所有这些，但它会创建一个报告，该报告可以在 `Daily_Archive` 脚本中作为备份配置文件使用。你可以利用报告来帮助移除或重新分配文件。\n\
  \n要查找用户文件，你可以使用 `find` 命令。`find` 命令使用 `-u` 选项搜索整个文件系统，这将精确找到任何用户账户拥有的文件。命令如下：\n\n\
  ```bash\nfind / -user $USER_ACCOUNT > $REPORT_FILE\n```\n\n与处理用户账户进程相比，这非常简单！在 `Delete_User`\
  \ 脚本的下一步，实际上移除用户账户，操作变得更简单。\n\n# 移除账户\n\n在从系统中移除用户账户时，稍微谨慎一点总是好主意。因此，你应该再次询问脚本用户是否想要移除该账户。\n\
  \n```bash\nLINE1=\"Do you wish to remove User_Account's account? [y/n]\"\nget_answer\n\
  #\nEXIT_LINE1=\"Since you do not wish to remove the account,\"\nEXIT_LINE2=\"$USER_ACCOUNT\
  \ at this time, exiting the script...\"\nprocess_answer\n```\n\n最后，我们达到了脚本的主要目的，实际上从系统中删除该用户。在这里你可以使用\
  \ `userdel` 命令（参见第 6 章）：\n\n```bash\nuserdel $USER_ACCOUNT\n```\n\n现在我们已经收集了所有的部分，准备好它们组合成一个完整的、实用的工具了。\n\
  \n创建脚本\n\n记住 `Delete_User` 脚本与脚本用户具有高度交互性。因此，包含大量的文字以让用户了解脚本执行过程中的发生情况非常重要。在脚本顶部，声明了两个函数\
  \ `get_answer` 和 `process_answer`。然后脚本进入了移除用户的四个步骤：获取用户名；查找并杀掉用户进程；创建用户所有文件的报告；以及实际移除用户。这里是完整的\
  \ `Delete_User` 脚本：\n\n```bash\n#!/bin/bash\n# Delete_User - 自动完成移除账户的 4 个步骤\n###############################################\n\
  # Functions\n#####################################\nfunction get_answer {\n    unset\
  \ ANSWER\n    ASK_COUNT=0\n    while [ -z \"$ANSWER\" ] # 当没有给出回答时，继续询问\n    do\n\
  \        ASK_COUNT=$[ASK_COUNT + 1] # 如果用户在规定时间内没有给出回答\n        case $ASK_COUNT\
  \ in\n            2)\n                echo\n                echo \"Please answer\
  \ the question.\"\n                ;;\n            3)\n                echo\n  \
  \              echo \"One last try...please the question.\"\n                ;;\n\
  \            4)\n                echo\n                echo \"Since you refuse to\
  \ answer the question... exiting program.\"\n                exit\n            \
  \    ;;\n        esac\n        echo\n        if [ -n \"$LINE2\" ]; then # 打印 2 行\n\
  \            echo $LINE1\n            echo -e \"$LINE2 \\c\"\n        else # 打印\
  \ 1 行\n            echo -e \"$LINE1 \\c\"\n        fi\n        # 允许 60 秒回答，超时\n\
  \        read -t 60 ANSWER\n    done\n    # 简单的变量清理\n    unset LINE1\n    unset\
  \ LINE2\n} # get_answer 函数 结束\n\n#####################################\nfunction\
  \ process_answer {\n    case $ANSWER in\n        y|Y|YES|yes|Yes|yEs|yeS|YEs|yES\
  \ ) # 如果用户回答 \"yes\"，什么都不做。\n            ;;\n        *) # 如果用户回答 \"yes\" 以外的任何内容，退出脚本\n\
  \            echo\n            echo $EXIT_LINE1\n            echo $EXIT_LINE2\n\
  \            echo\n            exit\n            ;;\n    esac\n}\n```\n\n\n\n\n\n\
  `} #End of process_answer function`\n\n#\n\n##############################################\n\
  # 函数定义结束\n\n############## 主脚本 #####################\n\n# 获取要检查的用户账户名称\n\necho \"\
  步骤 #1 - 确定要删除的用户账户名称 \"\necho\nLINE1=\"请输入您想要从系统中删除的用户 \"\nLINE2=\"账户名：\"\n`get_answer`\n\
  `USER_ACCOUNT=$ANSWER`\n\n# 向脚本执行者再次确认是否为正确的的用户账户\n\nLINE1=\"账户 $USER_ACCOUNT 是您想要\
  \ \"\nLINE2=\"从系统中删除的账户吗？ [y/n]\"\n`get_answer`\n\n# 调用 process_answer 函数：\n#  \
  \   如果用户回答的不是“yes（是）”，则退出脚本\n\nEXIT_LINE1=\"因为账户 $USER_ACCOUNT 不是 \"\nEXIT_LINE2=\"\
  您想要删除的那个，我们正在退出脚本...\"\n`process_answer`\n\n################################################################\n\
  # 检查 USER_ACCOUNT 是否确实是系统上的一个账户\n\n`USER_ACCOUNT_RECORD=$(cat /etc/passwd | grep\
  \ -w $USER_ACCOUNT)`\n\nif [ $? -eq 1 ]; # 如果未找到该账户，则退出脚本\nthen\n    echo\n    echo\
  \ \"未找到账户，$USER_ACCOUNT。\"\n    echo \"正在退出脚本...\"\n    echo\n    exit\nfi\n\necho\n\
  echo \"我找到了这条记录：\"\necho $USER_ACCOUNT_RECORD\necho\n\n#\nLINE1=\"这是正确的的用户账户吗？ [y/n]\"\
  \n`get_answer`\n\n# # 调用 process_answer 函数：\n#       如果用户回答的不是“yes（是）”，则退出脚本\n\n\
  EXIT_LINE1=\"因为账户 $USER_ACCOUNT 不是 \"\nEXIT_LINE2=\"您想要删除的那个，我们正在退出脚本...\"\n`process_answer`\n\
  \n##################################################################\n# 查找任何属于该用户账户的运行进程\n\
  \necho\necho \"步骤 #2 - 查找系统中属于该用户账户的进程\"\necho \"$USER_ACCOUNT 正在运行以下进程： \"\necho\n\
  \n# ps -u $USER_ACCOUNT #列出运行的用户进程。\ncase $? in\n1) # 该账户没有正在运行的进程\n    #\n    echo\
  \ \"该账户当前没有运行的进程。\"\n    echo\n;;\n0) # 该账户有正在运行的进程。\n    # 询问脚本执行者是否希望我们杀死这些进程。\n\
  \    #\n    unset ANSWER\n    LINE1=\"您想让我杀掉这些进程（们）吗？ [y/n]\"\n    `get_answer`\n\
  \    #\n    case $ANSWER in\n        y|YES|Yes|yEs|Y|ES) # 如果用户回答“yes”，\n      \
  \      # 杀死账户进程。\n            #\n            echo\n            # 信号时清理文件\n     \
  \       trap \"rm $USER_ACCOUNT_Process.rpt\" TERM SIG QUIT\n            # 列出运行的进程\n\
  \            ps -u $USER_ACCOUNT > $USER_ACCOUNT_Process.rpt\n            # 生成报告输入\n\
  \            exec < $USER_ACCOUNT_Process.rpt\n            # 第一条记录将为空\n        \
  \    read USER_PROCESS_REC\n            while [ $? -eq 0 ]\n            do\n   \
  \             # 获取 PID\n                USER_PID=$(echo $USER_PROCESS_REC | cut\
  \ -d \" \" -f1)\n                kill -9 $USER_PID\n                echo \"已杀死进程\
  \ $USER_PID\"\n                read USER_PROCESS_REC\n            done\n       \
  \     #\n            echo\n            rm $USER_ACCOUNT_Process.rpt # 临时报告。\n  \
  \          ;;\n        *) # 如果用户回答的不是“yes”，则不杀死。\n            echo\n           \
  \ echo \"不会杀死这些进程（们）\"\n            echo\n            ;;\n    esac\n;;\nesac\n\n\
  #################################################\n# 创建所有属于该用户账户的文件报告\n\necho\n\
  echo \"步骤 #3 - 查找系统中属于该用户账户的文件\"\necho\necho \"正在创建 $USER_ACCOUNT 拥的所有文件报告。\"\n\
  echo\necho \"建议您备份/存档这些文件，\"\necho \"然后执行以下两个操作之一：\"\necho \"  1) 删除文件\"\necho \"\
  \  2) 将文件的所有权更改为当前用户账户。\"\necho\necho \"请等待。这可能需要一些时间...\"\n#\n`REPORT_DATE=$(date\
  \ +%y%m%d')`\n`REPORT_FILE=$USER_ACCOUNT\"_Files\"$REPORT_DATE\".rpt`\n\n#\n`find\
  \ / -user $USER_ACCOUNT > $REPORT_FILE 2>/dev/null`\n\n#\necho\necho \"报告已完成。\"\n\
  echo \"报告名称：   $REPORT_FILE\"\necho \"报告位置：   'pwd'\"\necho\n\n####################################\n\
  # 用户账户\n\necho\necho \"步骤 #4 - 移除用户账户\"\necho\n\n#\nLINE1=\"您确定要从系统中移除 $User_Account\
  \ 的账户吗？ [y/n]\"\n`get_answer`\n\n# # 调用 process_answer 函数：\n#       如果用户回答的不是“yes（是）”，则退出脚本\n\
  \n#\nEXIT_LINE1=\"由于您不想移除 \"\nEXIT_LINE2=\"该账户，...\"\n`process_answer`\n\n#\n`USER_ACCOUNT=$ANSWER`\n\
  `echo`\necho \"用户账户 $USER_ACCOUNT 已移除\"\necho\n\n$\n这运行得非常棒！现在你拥有了一个可以提供帮助的脚本工具。\n\
  \n`} #End of process_answer function`\n\n\n\n\n上一节向你介绍了如何使用 shell 脚本对 Linux 系统上的数据文件进行归档和备份。`tar`\
  \ 命令是一个用于数据归档的常用命令。本章节展示了如何在 shell 脚本中使用它创建归档文件，以及如何在归档目录中管理这些文件。\n\n我们在章节末尾介绍了如何使用\
  \ shell 脚本来完成删除用户账户所需的四个步骤。为脚本中重复的 shell 代码创建函数可以使代码更易读和修改。该脚本结合了许多不同的结构化命令，例如 `case`\
  \ 和 `while` 命令。本章演示了用于 `cron` 任务表的脚本与交互式脚本在结构上的差异。\n\n现在，我们将转向更高级的 shell 脚本，这些脚本将帮助解决更复杂的\
  \ Linux 系统问题。\n\n# 第 27 章：高级 shell 脚本\n\n## 本章内容\n* 监控系统统计信息\n* 问题跟踪数据库\n\n在本章中，我们将学习在\
  \ shell 脚本中使用更高级的方法。这些技术允许你以多种不同的方式对系统脚本进行操作。\n\n## 监控系统统计信息\n\n`bash` shell 中有很多工具可以帮助你监控\
  \ Linux 系统的性能和资源使用。遗憾的是，很难找到时间来使用它们，特别是当你有多个系统需要管理时。创建几个 shell 脚本利用这些工具的输出生成报告，是利用时间的极方法。\n\
  \n本节将引导你创建一些高级 shell 脚本，协助你监控各种系统性能统计信息。\n\n### 系统快照报告\n\n通过快照报告来了解系统性能和资源使用情况是一个很好的方法。快照报告是系统在特定时间点的统计数据快照。这类报告是系统健康的“执行摘要”。\n\
  \n创建此快照报告的脚本可以根据需要每天运行多次以获取数据。更棒，脚本还会通过电子邮件将报告发送给你。\n\n### 所需的函数\n\n你需要使用四个 bash\
  \ shell 命令来创建快照报告：`uptime`、`df`、`free` 和 `ps`。这些不同的命令将为你提供所需的统计数据。\n\n#### 运行时 (Up\
  \ Time)\n\n第一个命令 `uptime` 是最基础的系统统计命令：\n\n```\n$ uptime\n14:15:23 up 1 day, 5:10,\
  \ 3 users, load average: 0.66, 0.54, 0.33\n```\n\n`uptime` 命令提供了我们可以利用的几条不同的基础信息：\n\
  * 当前时间\n* 系统运行的天数、小时和分钟\n* 当前登录系统的用户数\n* 一分钟、五分钟和十五分钟的平均负载\n\n系统的运行时间是快照报告中一个非常棒的统计数据。然而，尝试获取此统计数据时存在一个问题。你的系统可能只运行了几分钟，也可能已经运行了几天（传闻有些\
  \ Linux 服务器已经运行了几年！）。以下是一个运行了几个小时系统的 `uptime` 命令输出：\n\n```\n$ uptime\n18:00:20 up\
  \ 8:55, 3 users, load average: 0.62, 0.45, 0.37\n```\n\n以下是一个运行了数天的系统的 `uptime`\
  \ 输出：\n\n```\n$ uptime\n13:29:32 up 3 days, 4:24, 4 users, load average: 1.44, 0.83,\
  \ 0.46\n```\n\n如你所见，从这个列表中收集正确的统计数据将很困难。`gawk` 命令（见第 16 章）可以毫无问题地为运行了数天的系统完成这项工作：\n\
  \n```\n$ uptime | gawk '{print $2,$3,$4,$5}'\nup 3 days, 4:27,\n```\n\n然而，当同样的 `gawk`\
  \ 命令用于仅运行了几小时的系统时，会出现以下情况：\n\n```\n$ uptime | gawk '{print $2,$3,$4}'\nup 8:59,\
  \ 3 users,\n```\n\n为了解决这个困境，你可以使用 `gawk` 的一个高级功能 `if` 语句（见第 19 章）。如果系统已经运行了几天，`gawk`\
  \ 变量 `$4` 将包含单词“days”。为了测试 `$4` 是否为字符串“days”，你的 `gawk` 命令应该像这样：\n\n```\n$ uptime\
  \ |\n> gawk '{if ($4 == \"days\") {print $2,$3,$4,$5} else {print $2,$3}}'\nup 9:23,\n\
  ```\n\n你可能会遇到系统仅运行了一天的情况。因此，你还需要测试字符串“day”。逻辑或运算符 `or` (`||`) 可以解决这个问题。因此，你的 `gawk`\
  \ 命令现在看起来如下：\n\n```\ngawk '{if ($4 == \"days\" || $4 == \"day\") {print $2,$3,$4,$5}\
  \ else {print $2,$3}}'\n```\n\n现在输出中那些难看的逗号怎么办？使用 `sed` 命令，你可以简单将它们替换为空格。\n\n```\n\
  $ uptime | sed -n ‘/,/s/,/ /gp’ |\n> gawk '{if ($4 == \"days\" || $4 == \"day\"\
  ) {print $2,$3,$4,$5} \nelse {print $2,$3}}'\nup 9:32\n```\n\n这看起来好多了！为了保险起见，让我们在一个运行了超过一天的系统上测试该命令：\n\
  \n```\n$ uptime | sed -n ‘/,/s/,/ /gp’ | \n> gawk '{if ($4 == \"days\" || $4 ==\
  \ \"day\") {print $2,$3,$4,$5} \nelse {print $2,$3}}’ \nup 3 days 4:34\n```\n\n\
  看起来也不错。现在我们可以转向另一个性能工具命令来创建系统快照报告。\n\n#### 磁盘使用情况 (Disk Usage)\n\n帮助你创建快照报告的下一个命令是\
  \ `df`。`df` 命令显示磁盘空间使用统计信息：\n\n```\n$ df\nFilesystem      1K-blocks      Used  \
  \        Available  Use%    Mounted on\n/dev/sda2      307465076   185930336   \
  \   105916348   64%      /\nnone            503116           240        502876 \
  \    1%      /dev\nnone            508716              ...\n```\n\n`df` 命令显示所有真实和虚拟磁盘的统计。你可以将单个磁盘名称传递给\
  \ `df` 命令以仅检索该磁盘的信息。为了让信息更易读，为命令添加 `-h` 选项：\n\n```\n$ df -h /dev/sda2\nFilesystem\
  \  Size  Used  Avail  Use%  Mounted\n/dev/sda2  294G  178G  102G   64%  /\n```\n\
  \n`sed` 和 `gawk` 命令将帮助你解析并打印报告所需的信息。由于我们不需要包含 `df` 输出中的表头行，使用 `sed` 搜索数据行中特有的字符。字符串\
  \ `/` 仅出现在数据行中。这可行了，让我们进入获取系统内存快照的部分。\n\n#### 内存使用情况 (Memory Usage)\n\n有几个 bash\
  \ shell 命令可以获取内存统计信息。在这里，我们将重点关注 `free` 命令。\n\n`free` 命令显示物理内存的总量，以及空闲和已分配量。它还会显示交换内存的相同数据，并包含内核缓冲区。以下是\
  \ `free` 命令输出的示例：\n\n```\n$ free\n              total        used        free  \
  \    shared  buffers   cached\nMem:           1017436      890148      127288  \
  \         0      31536      484100\n-/+ buffers/cache:   374512      642924\nSwap:\
  \           200776             0      200776\n```\n\n\n\n因为我们提取了磁盘使用率百分比统计，所以对内存使用也进行同样的操作是一个好主意。然而，你会发现\
  \ `free` 命令并没有提供任何使用百分比！这没关系。使用 `gawk` 命令，你可以计算出百分比。\n\n`free` 命令的输出已经通过空格很好地分开了，因此\
  \ `gawk` 可以通过变量名直接引用计算所需的两个字段。`$2` 变量是可用总内存，`$3` 变量是已用内存。通过将 `$3` 除以 `$2`，`gawk`\
  \ 将为你提供内存使用率：\n\n```bash\n$ free | sed -n ‘2p’ | gawk ‘x = ($3 /$2) {print x}\n\
  ```\n`0.87165`\n\n注意命令中使用了 `sed` 来从 `free` 命令的输出中提取第二行数据，这允许你“丢弃”标题行。生成的数字仍然不是报告所需的格式。你可以通过将数字乘以\
  \ 100 并使用 `gawk` 的整数函数 `int` 对进行截断来清理百分比。最后，使用 `sed` 加上百分比符号：\n\n```bash\n$ free\
  \ | sed -n ‘2p’ | \n> gawk ‘x = int(($3 /$2)* 100) (print x)’ ||\n> sed ‘s/$/%/’\n\
  ```\n`87%`\n\n现在内存统计已经是你报告所需的格式了。让我们继续最后一个要包含的项目——僵尸进程！\n\n## 僵尸进程\n\nLinux 系统上的僵尸进程是处于中间状态的进程。该进程已经完成了工作，但由于各种原因卡在未完成的状态。因此，正如它的名字一样，僵尸进程既没有死也没有活。\n\
  \n虽然在 Linux 系统上有一一两个僵尸进程并不什么，但多个僵尸进程会导致问题。僵尸持有一个进程 ID（PID），在僵尸被杀死之前，该 ID 不会释放进程\
  \ ID 表。因此，另一个需要关注的系统统计是当前僵尸进程的数量。\n\n使用 `ps` 命令可以轻松实现（见第 4 章）。`ps` 命令配合 `-al` 选项将返回系统上所有的进程及其进程状态。状态\
  \ `Z` 表示该进程是僵尸：\n\n```bash\n$ ps -al \nF S  UID  PID PPID C  PRI NI ADDR    SZ WCHAN\
  \  TTY       TIME CMD \n0 T  1000  2174 2031 0   80  0     - 2840 signal pts/0 00:00:00\
  \ mail \n0 T  1000  2175 2031 0   80  0     - 2839 signal pts/0 00:00:00 mail \n\
  1 Z  1000  8779 8797 0   80  0     -     0 exit    pts/0 00:00:00 zomb <defunct>\
  \ \n0 R  1000  8781 8051 0   80  0     - 1094 -       pts/5 00:00:00 ps \n$\n```\n\
  \n再次，`gawk` 命令将在这里帮助你。通过将 `ps` 命令的输出管道到 `gawk`，你只需要打印字段 `$2` 和 `$4` 来获取进程 ID 及其进程状态。然而，你只想显示僵尸进程，因此使用\
  \ `grep` 命令搜索输出是可行的。所需的命令如下：\n\n```bash\n$ ps -al | gawk '{print $2,$4}’ | grep\
  \ Z\nZ 8779\n```\n\n这对于快照报告来说效果非常好。现在，你已经有了所有的部分，让我们把它们组合成一个可以运行的脚本。\n\n## 创建快照脚本\n\
  \n你需要设置的第一项是用于脚本正文各种变量。这些变量应该包含在脚本顶部，以便将来方便修改。\n\n我们的快照报告需要一个时间戳，因此将包含一个日期变量 `DATE`。对于性能统计，你可能有多个需要收集统计信息的磁盘。因此，一个数组变量\
  \ `DISKS_TO_MONITOR` 将包含你系统所有磁盘的列表。由于不同的管理员设置了不同的邮件工具，让我们包含一个邮件变量 `MAIL`，以指定本地使用的哪种工具（见第\
  \ 25 章）。此外，由于特定系统的 `mail` 命令可能位于独特的位置，你应该使用 `which` 命令（见第 23 章）来查找 `mail` 命令的位置。将报告发送给谁在变量\
  \ `MAIL_TO` 中。最后，报告名称设置在变量 `REPORT` 中。\n\n快照脚本的变量部分如下：\n\n```bash\n# Set Script\
  \ Variables\n#\nDATE='date +m%d%Y'\nDISKS_TO_MONITOR=\"/dev/sda1 /dev/sda2\"\nMAIL='which\
  \ mutt'\nMAIL_TO=user\nREPORT=/home/user/Documents/$DATE.rpt\n```\n\n因为你是在同一个脚本中生成报告并发送它，你需要保存并在以后恢复文件描述符（见第\
  \ 14 章）。保存文件描述符并将输出重定向到 `STDOUT` 的 shell 命令如下：\n\n```bash\n# Create Report File\n\
  #\nexec 3>&1  #保存 file descriptor\n#\nexec 1> $REPORT #将输出重定向到 rpt 文件。\n```\n\n\
  在 `mail` 命令之前的后续代码将把 `STDOUT` 恢复到保存的文件描述符：\n\n```bash\n# Restore File Descriptor\
  \ & Mail Report\n#\nexec 1>&3    #恢复输出到 STDOUT\n```\n\n将所有各个部分组合在一起后，脚本现在看起来如下：\n\
  \n```bash\n#!/bin/bash\n#\n# Snapshot_Stats - produces a report for system stats\n\
  #####################################################\n# Set Script Variables\n\
  #\nDATE='date +m%d%Y'\nDISKS_TO_MONITOR=\"/dev/sda1 /dev/sda2\"\nMAIL='which mutt'\n\
  MAIL_TO=user\nREPORT=/home/user/Documents/Snapshot_Stats_$DATE.rpt\n#\n##########################################\n\
  # Create Report File\n#\nexec 3>&1  #Save file descriptor\n#\nexec 1> $REPORT #direct\
  \ output to rpt file.\n#\n##########################################\n#\necho\n\
  echo -e \"\\t\\tDaily System Report\"\necho\n#\n##########################################\n\
  # Date Stamp the Report\n#\necho -e \"Today is $(date +%m/%d/%Y)\"\n#\n##########################################\n\
  # 1) Gather Uptime Statistics\n#\necho\necho -e \"System has been \"\nuptime | sed\
  \ -n ',/p' | awk '{if ($4 == \"days\" || $4 == \"day\") print $2,$3}'\n#\n##########################################\n\
  # 2) Gather Disk Usage\n#\necho\nfor DISK in $DISKS_TO_MONITOR\ndo\n  echo -e \"\
  $DISK usage: \"\n  df -h $DISK | sed -n 2p | awk '{print $5}' # Note: corrected\
  \ logic for disk space check\ndone\n#\n##########################################\n\
  # 3) Gather Memory Statistics\n#\necho\necho -e \"Memory Usage: \"\nfree | sed -n\
  \ ‘2p’ | awk 'x = int(($3 /$2)* 100) {print x}'\n#\n##########################################\n\
  # 4) Gather Number of Zombie Processes\n#\necho\nZOMBIE_CHECK=$(ps -al | gawk '{print\
  \ $2,$4}’ | grep Z)\n#\nif [ \"$ZOMBIE_CHECK\" = \"\" ]; then\n  echo \"No Zombie\
  \ Process on System at this Time\"\nelse\n  echo \"Current System Zombie Processes\"\
  \n  ps -al | gawk '{print $2,$4}’ | grep Z\nfi\necho\n#\n##########################################\n\
  # Restore File Descriptor & Mail Report\n#\nexec 1>&3    #Restore output to STDOUT\n\
  #\nmail -a $REPORT -s “System Statistics Report for $DATE” -- $MAIL_TO < /dev/null\n\
  #\n###########################################\n# Clean up\n#\nrm -f $REPORT\n#\n\
  #\n```\n\n\n\n快照报告对于让你了解系统的整体健康状况非常有帮助。然而，这种类型的报告无法让你看到性能和资源使用随时间演变的各种趋势。因此，让我们来看一组脚本，它们将为你提供这类信息。\n\
  \n# 系统统计报告\n\n任何 Linux 系统的核心统计数据都是 CPU 和内存使用情况。如果这些值开始失控，问题会很快出现。本节将演示如何编写脚本，以帮助你在一段时间内监控并跟踪\
  \ Linux 系统的 CPU 和内存使用情况。\n\n## 所需的函数\n\n第一个脚本的目的是将性能用量统计数据收集到一个数据文件中以供日后使用。因此，你需要确切地确定想通过脚本收集哪些数据，以及使用哪些命令。\n\
  \n对于此脚本，我们将再次使用 `uptime` 命令。但这次，我们不是获取系统运行的时间，而是获取系统上的用户数量。用户数量直接影响 CPU 和内存的使用。通过\
  \ `sed`，我们将在 `uptime` 命令的输出文本中搜索“users”一词。在当前行中找到该词后，让 `sed` 直接删除该行的剩余文本，包括“users”一词。这将留下你需要的统计数据——系统用户数——作为该行的最后一个项目。要获取最后一个数据项，你可以使用\
  \ `gawk` 变量 `NF`。整个命令行及其输出看起来如下：\n\n```bash\n$ uptime | sed 's/users.*$//' | gawk\
  \ '{print $NF}'\n4\n```\n\n系统负载是另一个可以从 `uptime` 命令输出中解析出的良好统计数据。系统负载显示了系统中 CPU 的平均忙程度。平均负载为\
  \ `1` 意味着单个 CPU 一直处于忙状态。然而，如果你的系统中有两个 CPU，这意味着每个 CPU 的忙程度仅为 50%。`uptime` 命令提供的系统负载是最后分钟、最后五分钟和最后十五分钟的平均值。我们将获取最后十五分钟的平均系统负载统计数据，它方便地位于输出文本行的末尾：\n\
  \n```bash\n$ uptime | gawk '{print $NF}'\n0.19\n```\n\n另一个提取系统信息的强大命令是 `vmstat`。这里是\
  \ `vmstat` 命令的输出示例：\n\n```bash\n$ vmstat \nprocs -----------memory---------- ---swap--\
  \ -----io---- -system-- ----cpu---- \nr b    swpd   free  buff  cache   si  so \
  \     bi  bo    in  cs    us sy id wa \n0 0   11328  42608 165444  502500   0  \
  \ 0      1   2     68  10    1  0 99  0 \n```\n\n当你第一次运行 `vmstat` 命令时，它显示自上次重启以来的平均值。要获取当前统计数据，你必须带命令行参数运行\
  \ `vmstat` 命令：\n\n```bash\n$ vmstat 1 2\nprocs -----------memory---------- ---swap--\
  \ -----io---- -system-- ----cpu---- \nr b    swpd   free  buff  cache   si  so \
  \     bi  bo    in  cs    us sy id wa \n0 0   11328  43112 165452  502444   0  \
  \ 0      1   2     68  10    1  0 99  0 \n0 0   11328  40540 165452 505064   0 \
  \  0      0   0     58 177    1  1 98  0 \n```\n\n第二行包含 Linux 系统的当前统计数据。如你所示，`vmstat`\
  \ 命令的输出有些晦涩。[表 27.1]解释了每个符号的含义。\n\n### 表 27.1 vmstat 输出符号\n\n| 符号 | 描述 |\n| :---\
  \ | :--- |\n| `r` | 等待 CPU 时间的进程数 |\n| `b` | 处于不可中断睡眠状态的进程数 |\n| `swpd` | 使用的虚拟内存（单位：MB）\
  \ |\n| `free` | 未使用的物理内存量（单位：MB） |\n| `buff` | 用作缓冲区内存内存（单位：MB） |\n| `cache` | 用作缓存空间的内存（单位：MB）\
  \ |\n| `si` | 从磁盘交换入的内存（单位：MB） |\n| `so` | 交换到磁盘的内存（单位：MB） |\n| `bi` | 从块设备接收的块数\
  \ |\n| `bo` | 发送到块设备的块数 |\n| `in` | 每秒 CPU 中断数 |\n| `cs` | 每秒 CPU 上下文切换数 |\n| `us`\
  \ | 运行非内核代码的 CPU 时间百分比 |\n| `sy` | 运行内核代码的 CPU 时间百分比 |\n| `id` | 空闲的 CPU 时间百分比 |\n\
  | `wa` | 等待 I/O 的 CPU 时间百分比 |\n\n这些是大量信息。空闲内存和 CPU 空闲时间百分比统计数据将满足我们这里的需求。\n\n你可能已经注意到\
  \ `vmstat` 命令的输出包含了表头信息，你显然不想在数据中包含这些内容。要解决这个问题，请使用 `sed` 命令仅显示包含数值的行：\n\n```bash\n\
  $ vmstat 1 2 | sed -n '[0-9]/p'\n1 0 11328 38524 165476 506548 0 0 1 2 68 10 1 0\
  \ 99 0 \n0 0 11328 35820 165476 509528 0 0 0 0 82 160 1 1 98 0 \n```\n\n这样好多了，但现在你只需要第二行数据。再次调用\
  \ `sed` 即可解决该问题：\n\n```bash\n$ vmstat 1 2 | sed -n '[0-9]/p' | sed -n '2p'\n0 0\
  \ 11328 36060 165484 509560 0 0 0 0 58 177 1 1 98 0 \n``` （等等，示例输出显示为 `0 0 11328\
  \ 36060...`，遵循上述逻辑）。\n\n最后，你可能为每条记录标记一个时间戳，以指示获取统计数据的时间。只需使用 `date` 命令并指定你需要的格式即可。\n\
  \n```bash\n$ date +%m/%d/%Y %H:%M:%S\n12/09/2010 13:55:31\n```\n\n## 创建采集脚本\n\n\
  一旦所有函数都就绪，这个用于采集数据的脚本就会非常简单。它的样子如下：\n\n```bash\n#!/bin/bash\n# Capture_Stats - 收集系统统计\n\
  ######################\n# 设置脚本变量\n#\nREPORT_FILE=/home/user/Documents/capstats.csv\n\
  DATE=$(date +%m/%d/%Y)\nTIME=$(date +%H:%M:%S)\n##########################################\n\
  # 收集性能\n#\nUSERS=$(uptime | sed 's/users.*$//' | gawk '{print $NF}')\nLOAD=$(uptime\
  \ | gawk '{print $NF}')\nFREE=$(vmstat 1 2 | sed -n '[0-9]/p' | sed -n '2p' | gawk\
  \ '{print $4}')\nIDLE=$(vmstat 1 2 | sed -n '[0-9]/p' | sed -n '2p' | gawk '{print\
  \ $15}')\n#########################################\n# 将统计数据发送到报告文件\n#\necho \"\
  $DATE,$TIME,$USERS,$LOAD,$FREE,$IDLE\" >> $REPORT_FILE\n#\n```\n\n在创建脚本后，在从你的 `cron`\
  \ 表中定期运行之前，你应该先在命令行中对其测试：\n\n```bash\n$ cat capstats.csv\n12/09/2010,9:06:50,2,0.29,645988,99\n\
  12/09/2010,9:07:55,2,0.28,620252,100\n```\n\n\n\n\n`12/09/2010, 9:40:51,3,0.37,474740,100\
  \ `\n`12/10/2010,14:36:46,3,0.30,46640,98 `\n`12/12/2010, 7:16:26,4,0.25,27308,98\
  \ `\n`12/12/2010,13:28:53,4,0.42,58832,100 `\n\n接下来的脚本将根据 CSV 数据生成报告并通过电子邮件发送给相关个人。由于报告脚本是一个独立的脚本，你可以让\
  \ `cron` 以与 `Capture_Stats` 脚本不同的时间表运行它。这让你在报告之前捕获多少数据量上具有灵活性。\n\n## 生成报告脚本\n\n\
  现在你已经有了一个充满原始数据的文件，可以开始编写用于生成精美报告的脚本了。处理此任务的最佳工具是 `gawk` 命令。\n\n`gawk` 命令将允许你从 CSV\
  \ 文件中提取原始数据并以任何想要的方式呈现。首先，在命令行中进行测试，使用由 `Capture_Stats` 脚本创建的新 `capstats.csv` 文件：\n\
  \n```bash\n$ cat capstats.csv | gawk -F, '{printf \"%s %s - %s\\n\", $1, $2, $4}'\n\
  12/09/2010 9:06:50 - .29\n12/09/2010 9:07:55 - .28\n12/09/2010 9:40:51 - .37\n12/10/2010\
  \ 14:36:46 - .30\n12/12/2010 7:16:26 - .25\n12/12/2010 13:28:53 - .42\n```\n\n你需要使用\
  \ `gawk` 命令的 `-F` 选项将逗号定义为数据中的字段分隔符。之后，你可以使用 `printf` 功能检索每个数据字段并按你需要的方式显示。\n\n\
  对于报告，我们将使用 HTML 格式。HTML 使用简单的标签来界定网页中的数据。然而，HTML 不仅用于网页，你经常会在邮件消息中发现它。取决于你的邮件工具（见第\
  \ 25 章），你可能会看到嵌入的 HTML 文档。更好的解决方案创建一个 HTML 报告并作为邮件附件。\n\n使用 HTML 创建报告允许你生成格式良好的报告。显示报告程序将完成所有的格式工作。你只需要插入适当的\
  \ HTML 标签来格式化数据。在 HTML 中显示表格风格数据最简单的方法是使用 `<table>` 标签。表格标签允许你创建行和单元格，这些在 HTML 中被称为“划分”。使用\
  \ `<tr>` 标签定义行的开始，使用 `</tr>` 标签定义行的结束。同样，使用 `<td>` 和 `</td>` 标签定义单元格。\n\n完整的 HTML\
  \ 表格所示：\n\n```html\n<html>\n<body>\n  <h2>Report title</h2>\n  <table border=\"\
  1\">\n    <tr>\n      <td>Date</td><td>Time</td><td>Users</td>\n      <td>Load</td><td>Free\
  \ Memory</td><td>Idle</td>\n    </tr>\n    <tr>\n      <td>12/09/2010</td><td>1:00</td><td>4</td>\n\
  \      <td>0.26</td><td>57.06</td><td>87</td>\n    </tr>\n  </table>\n</body>\n\
  </html>\n```\n\n每条数据记录都是 `<tr>...</tr>` 对的一部分。每个数据字段都在自己的 `<td>...</td>` 对中。当你在浏览器中显示\
  \ HTML 报告时，浏览器会为你创建表格，如图 27.2 所示。\n\n对于脚本，你只需要使用 `echo` 命令生成 HTML 头部，使用 `gawk` 命令生成数据，然后再次使用\
  \ `echo` 命令关闭表格。这是 `Report_Stats` 脚本，它将生成报告并发送：\n\n```bash\n#!/bin/bash\n# Report_Stats\
  \ - 从捕获的状态生成报告\n# 设置变量\nREPORT_FILE=/home/user/capstats.csv\nTEMP_FILE=/home/user/capstats.html\n\
  # 日期\nDATE=$(date +%m/%d/%Y)\n# 邮件\nMAIL=mutt\nMAIL_TO=user\n# 创建报告头部\necho \"<html><body><h2>Report\
  \ for $DATE</h2>\" > $TEMP_FILE\necho \"<table border='1'>\" >> $TEMP_FILE\necho\
  \ \"<tr><td>Date</td><td>Time</td><td>Users</td>\" >> $TEMP_FILE\necho \"<td>Load</td><td>Free\
  \ Memory</td><td>Idle</td></tr>\" >> $TEMP_FILE\n# 将性能状态放入报告\ncat $REPORT_FILE |\
  \ gawk -F, '{\n  printf \"<tr><td>%s</td><td>%s</td><td>%s</td>\", $1, $2, $3;\n\
  \  printf \"<td>%s</td><td>%s</td><td>%s</td></tr>\\n\", $4, $5, $6;\n}' >> $TEMP_FILE\n\
  echo \"</table></body></html>\" >> $TEMP_FILE\n# 发送性能报告并清理\n$MAIL -a $TEMP_FILE\
  \ -s \"Performance Report $DATE\" -- $MAIL_TO < /dev/null\nrm -f $TEMP_FILE\n```\n\
  \n我们使用 `mutt` 来发送性能报告，但你可以将其更改为本地邮件客户端。临时 HTML 报告的文件也可以修改以更好地符合你的需求。\n\n> **注意**\n\
  > 大多数邮件客户端可以通过文件扩展名自动检测附件类型。由于由于原因，你应该以 `.html` 结束报告文件名。\n\n### 运行脚本\n\n创建 `Report_Stats`\
  \ 脚本后，从命令行中进行测试运行并看看发生了什么：\n\n```bash\n$ ./Report_Stats\n```\n\n嗯，这并不有趣。现在的真正测试是查看你的邮件消息，最好使用如\
  \ KMail 或 Evolution 等图形化邮件客户端。图 27.3 展示了如何从 Evolution 邮件客户端查看消息。注意数据是如何使用 HTML 表格进行整齐格式化的，就像在浏览器中查看时一样！\n\
  \n## 问题跟踪数据库\n\n每个系统都不可避免地遇到意外。然而，对问题的分析将允许你做出更改，以尽量减少未来意外的困难。拥有一份关于如何解决问题的记录也有帮助，以防问题再次发生。当你与一个可以记录所经历的问题/解决方案的团队合作工作时，会有更大的收益。问题/解决方案的信息可以更方便地在团队成员之间传播。\n\
  \n在本节中，我们将带你建立基础问题跟踪数据库的过程。此外，我们还将帮助你创建几个高级脚本来记录、更新和审查问题及解决方案。\n\n## 创建数据库\n\n规划数据库结构是创建问题跟踪数据库最重要的部分。你需要确定你想要跟踪什么类型的信息，以及谁有权访问和使用存储在数据库中的数据。\n\
  \n此数据库的主要目的是记录问题及其如何修复，以便你利用这些信息更快速地解决未来的类似问题。为了实现这一目的，你应该跟踪以下信息：\n\n*   报告问题的日期\n\
  *   修复问题的日期\n*   问题的描述及其症状\n*   对问题解决方案的描述\n\n我们将使用 `mysql`（见第 23 章）作为问题跟踪数据库的数据库系统。首先，创建一个空数据库：\n\
  \n```bash\n$ mysql -u root -p\nEnter password: \n```\n\n\n\n\n\n`欢迎使用 MySQL 监控器。命令以\
  \ ; 或 `\\g` 结束。`\n\n`...`\n\n```mysql\nmysql> CREATE DATABASE Problem_Trek;\nQuery\
  \ OK, 1 row affected (0.02 sec)\nmysql>\n```\n\n创建一个空数据库后，现在可以添加表了。我们将创建一个名为 `problem_logger`\
  \ 的表，包含四个字段来存储问题信息。此外，你还需要一个字段 `id_number` 来作为数据库的主键。[表 27.2] 显示了所需的五个字段。\n\n###\
  \ 表 27.2 Problem_Logger 表的字段\n\n| 字段名称 | 数据类型 |\n| :--- | :--- |\n| `id_number`\
  \ | integer |\n| `report_date` | date |\n| `fixed_date` | date |\n| `prob_symptoms`\
  \ | text |\n| `prob_solutions` | text |\n\n在 `mysql` 中创建此表非常简单：\n\n```mysql\nmysql>\
  \ USE Problem_Trek;\nDatabase changed\nmysql>\nmysql> CREATE TABLE problem_logger\
  \ (\n->  id_number int not null,\n->  report_date Date,\n->  fixed_date Date,\n\
  ->  prob_symptoms text,\n->  prob_solutions text,\n->  primary key (id_number));\n\
  Query OK, 0 rows affected (0.04 sec)\nmysql>\n```\n\n注意，下发 `USE` 命令是为了确保我们在正确的数据库中创建新表。让我们使用\
  \ `DESCRIBE` 命令再次查看新的 `problem_logger` 表。这是显示已添加到表中的字段的一种非常清晰的方法：\n\n```mysql\n\
  mysql> DESCRIBE problem_logger;\n+----------------+---------+------+-----+---------+-------+\n\
  | Field           | Type    | Null | Key | Default | Extra |\n+----------------+---------+------+-----+---------+-------+\n\
  | id_number       | int(11) | NO   | PRI | NULL    |       |\n| report_date    \
  \ | date    | YES |     | NULL    |       |\n| fixed_date      | date    | YES |\
  \     | NULL    |       |\n| prob_symptoms   | text    | YES |     | NULL    | \
  \      |\n| prob_solutions  | text    | YES |     | NULL    |       |\n+----------------+---------+------+-----+---------+-------+\n\
  5 rows in set (0.01 sec)\nmysql>\n```\n\n到目前为止，我们必须使用 `root` 账户创建数据库和表。现在这些步骤已经完成，你的工作不再需要\
  \ `root` 账户。正如你在第 23 章中学到的，在脚本中使用 `root` 账户不是良好的做法。因此，你需要为数据库添加一个具有适当权限的新账户。该账户将供脚本用于访问\
  \ `Problem_Trek` 数据库：\n\n```mysql\nmysql> GRANT SELECT,INSERT,UPDATE ON Problem_Trek.*\
  \ TO cbres IDENTIFIED BY 'test_password';\nQuery OK, 0 rows affected (0.03 sec)\n\
  mysql>\n```\n\n一旦你为数据库添加了新用户账户，请务必进行测试：\n\n```bash\nmysql Problem_Trek -u cbres\
  \ -p\nEnter password:\n```\n\n新账户运行得完美！现在，再过一步，你就可以开始为我们的数据库编写所需的函数了。使用你喜欢的文本编辑器创建一个特殊的配置文件\
  \ `~/.my.cnf`，其中包含你为用户账户设置的密码。这将允许脚本访问 `mysql` 而无需在内部包含密码。\n\n```bash\ncat ~/.my.cnf\n\
  [client]\npassword=test_password\n```\n\n并且不要将其限制为仅供访问：\n\n```bash\nchmod 400 ~/.my.cnf\n\
  ```\n\n现在 `Problem_Trek` 数据库已经创建，并已设置了适当的访问权限。你准备好开始编写数据库脚本了。\n\n### 记录问题\n\n跟踪问题的第一步是记录它的症状。因为使用\
  \ `mysql` 命令记录问题可能会耗时，我们将通过在其周围封装一个易用的脚本来简化这一过程。要将问题信息放入你的 `problem_logger` 表以向表中插入一条新记录，你需要执行这些命令：\n\
  \n```bash\nmysql Problem_Trek -u cbres -p\nEnter password:\n```\n\n```mysql\nmysql>\
  \ INSERT INTO problem_logger VALUES (\n->  101211322,\n->  20101211,\n->  0,\n->\
  \  \"When trying to run script Capture_Stats, getting message: bash:./Capture_Stats:\
  \ Permission denied\", \"\");\nQuery OK, 1 row affected (0.02 sec)\nmysql>\n```\n\
  \n这非常简单。你可以使用 `SELECT` 命令查看你刚刚放入表的记录。通过在 `WHERE` 中指定新记录的 ID 编号，只会显示插入的记录：\n\n```mysql\n\
  mysql> SELECT * FROM problem_logger WHERE id_number=101211322;\n+-----------+-------------+------------+---------------+---------------++\n\
  | id_number | report_date | fixed_date | prob_symptoms | prob_solutions |\n+-----------+-------------+------------+---------------+---------------++\n\
  | 101211322 | 2010-12-11 | 0000-00-00 | When trying to run script Capture_Stats,\
  \ getting message: bash:./Capture_Stats: Permission denied | |\n+-----------+-------------+------------+---------------+---------------++\n\
  1 row in set (0.00 sec)\nmysql>\n```\n\n虽然你可以看到插入的记录，但在这种格式下很难阅读数据。为了让记录更易读，你可以在命令末尾添加\
  \ `\\G` 而不是分号（`;`）：\n\n```mysql\nmysql> SELECT * FROM problem_logger WHERE id_number=101211322\\\
  G\n*************************** 1.row *****************\nid_number: 101211322\nreport_date:\
  \ 2010-12-11\nfixed_date: 0000-00-00\nprob_symptoms: When trying to run script Capture_Stats,\
  \ getting message: bash:./Capture_Stats: Permission denied\nprob_solutions: \n```\n\
  \n### 创建脚本\n\n在第 23 章中，你学习了使用 `which` 命令在你的特定系统上查找 `mysql` 命令，然后将其分配给环境变量。你可以更进一步，为\
  \ `mysql` 添加数据库名称和用户账户：\n\n```bash\n#\nMYSQL=$(which mysql) \"Problem_Trek -u cbres\"\
  \n#\n```\n\n### 所需函数\n\n`Record_Problem` 是一个交互式脚本。为了保持简单，你可以通过提问来获取所需信息。随着脚本获取答案，它会将这些答案分配给不同的变量。一旦收集了所有数据，你就可以使用变量名配合\
  \ `INSERT` 命令将信息输入数据库。这样一来，脚本用户就可以完全忽略那些必要的 `mysql` 命令了：\n\n```bash\nID_NUMBER=$(date\
  \ +%y%m%d%H%M)\n#\n```\n\n由于此脚本仅用于记录问题，你可能还没有关于 `FIXED_DATE` 和 `PROB_SOLUTIONS`\
  \ 变量的数据。因此，在向表中插入记录之前，请将这两个变量都设置为适当的空值：\n\n```bash\n#\n# 现在将修复日期和问题解决方案设置为空\nFIXED_DATE=0\n\
  PROB_SOLUTIONS=\"\"\n#\n```\n\n\n\n\n为了显示问题记录添加成功，请向脚本添加一个 `SELECT` 语句。为了防止显示整个数据库的内容，`WHERE`\
  \ 命令将使用 `ID_NUMBER` 变量仅选择刚刚添加的记录：\n\n```\nSELECT * FROM problem_logger WHERE id_number=$ID_NUMBER\\\
  G\n```\n\n将所有部分组合在一起将得到如下脚本：\n\n```bash\n#!/bin/bash\n#\n# Record_Problem - 在数据库中记录问题\n\
  ######################################################\n# 确定 mysql 位置并存入变量\n#\n\
  MYSQL=‘which mysql‘“ Problem_Trek -u cbres”\n#\n#############################################\n\
  # 创建记录 ID 和报告日期 \n#\nID_NUMBER=‘date +%y%m%d%H%M‘\n#\nREPORT_DATE=‘date +%Y%m%d‘\n\
  #\n#############################################\n# 获取要放入表格的信息\n#\necho\necho -e\
  \ “简要描述问题及其症状: \\c”\n#\nread ANSWER\nPROB_SYMPTOMS=$ANSWER\n#\n# 暂时将固定日期和问题解决方案设为空值\n\
  FIXED_DATE=0\nPROB_SOLUTIONS=\"\"”\n#\n##############################################\n\
  # 将获取的信息插入表格\n#\n#\necho\necho “问题记录如下:”\necho\n$MYSQL <<EOF\nINSERT INTO problem_logger\
  \ VALUES (\n  $ID_NUMBER,\n  $REPORT_DATE,\n  $FIXED_DATE,\n  \"$PROB_SYMPTOMS\"\
  ,\n  \"$PROB_SOLUTIONS\");\nSELECT * FROM problem_logger WHERE id_number=$ID_NUMBER\\\
  G\nEOF\n#\n##############################################\n```\n\n现在测试 `Record_Problem`\
  \ 脚本并查看它是否已就绪：\n\n```\n$ ./Record_Problem \n简要描述问题及其症状: \n运行 yum 安装软件并\n收到‘not found’消息。\
  \ \n问题记录如下: \n*************************** 1. row **************************** \n\
  id_number: 1012111510 \nreport_date: 2010-12-11 \nfixed_date: 0000-00-00 \nprob_symptoms:\
  \ \n运行 yum 安装软件并收到‘not found’消息。 \nprob_solutions: \n$ \n```\n\n运行得非常棒！你可以看到，使用这样的脚本记录问题比尝试使用单独的\
  \ `mysql` 命令进行插入要容易得多。\n\n现在你已经有了一种记录问题的方法，你需要一种更新记录的方法。让我们开始创建 `Update_Problem`\
  \ 脚本。\n\n# 更新问题\n\n跟踪问题的下一步是记录问题的解决方案。在本节创建的脚本将允许将这些信息添加到问题记录中。\n\n## 必要的函数\n\n\
  使用 `mysql` 更新记录非常简单。一旦获取了所有必要的数据，只需使用 `mysql UPDATE` 命令即可：\n\n```\nUPDATE problem_logger\
  \ SET \n      prob_solutions=\"$PROB_SOLUTIONS\", \n      fixed_date=$FIXED_DATE\
  \ \n      WHERE id_number=$ID_NUMBER;\n```\n\n这非常简单。然而，组合 `Update_Problem` 脚本比仅仅使用\
  \ `UPDATE` 函数要复杂一点。\n\n## 创建脚本\n\n与之前的脚本一样，我们希望让脚本用户尽可能方便。为了实现这一目标，需要添加几个功能。\n\n\
  `Problem_Trek` 数据库的主键 `id_number` 用于标识要更新的记录。如果已知 ID 数字，可以将其作为参数传递给脚本（参见第 13 章）。你只需要检查该参数并将其分配给变量\
  \ `ID_NUMBER`。如果没有作为参数传递 ID 数字，脚本将提示输入：\n\n```bash\nif [ $# -eq 0 ]  #检查是否传递了 id\
  \ 数字\nthen          #如果未传递，则询问。\n#\n...\n  echo\n  echo “你想要更新的问题”\n  echo -e “ID\
  \ 数字是?: \\c”\n  read ANSWER\n  ID_NUMBER=$ANSWER\nelse\n  ID_NUMBER=$1\nfi\n```\n\
  \n但是，询问问题 ID 数字有一点不公平。没有多少人能在脑海中记住一个 10 位的数字来标识他们正在解决的特定问题。因此，你应该提供数据库中各种未解决问题的列表，让脚本用户更容易操作。\n\
  \n首先，检查是否存在未解决的记录。`fixed_date` 和 `prob_solutions` 字段将为空。如果这两个字段中的任何一个，就需要更新记录；通过\
  \ `SELECT`，你可以在 `WHERE` 语句中使用 `OR` 命令搜索这两个字段。实现此操作的代码如下：\n\n```bash\nRECORDS_EXIST='$MYSQL\
  \ -Bse ‘SELECT id_number FROM problem_logger \nWHERE fixed_date=\"0000-00-00” OR\
  \ prob_solutions=\"\"’‘\n```\n\n注意命令的输出被赋值给变量 `RECORDS_EXIST`。为了实现这一点，`mysql` 命令必须使用\
  \ `-Bse` 选项。它们允许命令以批量（一次性）执行然后退出。如果 `RECORDS_EXIST` 变量包含数据，则存在需要更新的记录。使用以下操作将其显示在屏幕上：\n\
  \n```bash\n#\n  if [ “RECORDS_EXIST” != \"\" ]\n  then\n  echo\n  echo “以下记录需要更新...”\n\
  \  $MYSQL  <<EOF\n    SELECT id_number, report_date, prob_symptoms \n          FROM\
  \ problem_logger \n          fixed_date=\"0000-00-00” \nOR\n```\n\n这将提供一个不错的未完成记录列表。从列表中选择\
  \ ID 数字比尝试记住数字要容易得多。现在你可以组合出一个易于使用的整个脚本。它看起来应该类似于：\n\n```bash\n#!/bin/bash\n#\n\
  # Update_Problem - 更新数据库中的记录\n######################################\n# 确定 mysql\
  \ 位置并设置变量\n#\nMYSQL=‘which mysql‘“ Problem_Trek -u cbres”\n#\n#############################################\n\
  # 获取 ID \n#\nif [ $# -eq 0 ]  #检查是否传递了 id 数字\nthen          #如果未传递，则询问。\n#\n# 检查是否存在记录。\n\
  \  RECORDS_EXIST='$MYSQL -Bse ‘SELECT id_number FROM problem_logger \nWHERE fixed_date=\"\
  0000-00-00” OR prob_solutions=\"\"’‘\n#\n  if [ “RECORDS_EXIST” != \"\" ]\n  then\n\
  \  echo\n  echo “以下记录需要更新...”\n  $MYSQL  <<EOF\n    SELECT id_number, report_date,\
  \ prob_symptoms \n          FROM problem_logger \n          fixed_date=\"0000-00-00”\
  \ \nOR\nEOF\n  fi\n# 这提供了一个不错的未完成记录列表。选择 ID 数字。\n  echo\n  echo “你想要更新的问题”\n  echo\
  \ -e “ID 数字是?: \\c”\n  read ANSWER\n  ID_NUMBER=$ANSWER\nelse\n  ID_NUMBER=$1\n\
  fi\n#############################\n# 获取解决方案（即修复日期）\n#\necho\necho -e “今天解决问题了吗？(y/n)\
  \ \\c”\nread ANSWER\ncase $ANSWER in\ny|Y|yes|Yes|yS|YEs|yES )\n#\n  FIXED_DATE=‘date\
  \ +%Y%m%d‘\n;;\n*)\n# 如果答案不是 yes，则询问日期\n  echo\n  echo -e “解决日期是？[YYYYMMDD] \\c”\n\
  \  read ANSWER\n  FIXED_DATE=$ANSWER\n;;\nesac\n#\n##############################################\n\
  # 更新问题记录\n#\n#\necho\necho “问题记录更新如下:”\necho\n$MYSQL <<EOF\nUPDATE problem_logger\
  \ SET \n      prob_solutions=\"$PROB_SOLUTIONS\", \n      fixed_date=$FIXED_DATE\
  \ \n      WHERE id_number=$ID_NUMBER;\nSELECT * FROM problem_logger WHERE id_number=$ID_NUMBER\\\
  G\nEOF\n#\n```\n\n测试此脚本并查看它的性能如何。\n\n```\n$ ./Update_Problem \n以下记录需要更新... \n***************************\
  \ 1. row **************************** \n```\n\n\n\n\n\n`id_number: 1012111624`\n\
  `report_date: 2010-12-11`\n`prob_symptoms: 运行 yum 安装软件时获取‘not found’ 消息。`\n你想要更新的问题\
  \ ID 号是多少？`1012111624`\n今天解决问题了吗？(y/n) y \n简要描述问题解决方案：网络服务宕了。\n执行了命令：`service network\
  \ restart`\n\n问题记录更新如下：\n*************************** 1. row ****************************\n\
  `id_number: 1012111624`\n`report_date: 2010-12-11`\n`fixed_date: 2010-12-11`\n`prob_symptoms:\
  \ 运行 yum 安装软件时获取‘not found’ 消息。`\n`prob_solutions: 网络服务宕机。`\n执行了命令：`service network\
  \ restart`\n$\n\n这运行非常好，而且使用非常简单。\n\n### 补充\n\n现在，为了让脚本用户操作更加方便，让我们修改 `Record_Problem`\
  \ 脚本，在需要时调用 `Update_Problem`。有时候当你很忙时，“批量”记录问题会更方便。在原始 `Record_Problem` 脚本的最后面，你可以添加以下代码：\n\
  \n```bash\n# 检查现在想要输入解决方案\n#\necho\necho -e “你现在有解决方案了吗？(y/n) \\c”\nread ANSWER\n\
  #\ncase $ANSWER in\n  y|Y|YES|yes|Yes|yEs|yeS|YEs|yES )\n    ./$HOME/scripts/Update_Problem\
  \ $ID_NUMBER\n##\n    ;;\n  *)\n    # 如果回答不是 yes，直接退出脚本\n    ;;\nesac\n##############################################\n\
  ```\n\n现在让我们测试一下这个修改，看看它是否有效：\n`$ ./Record_Problem`\n简要描述问题及其症状：\n将脚本从 Fedora 移动到\
  \ Ubuntu 后无法正常工作。\n问题记录如下：\n*************************** 1. row ****************************\n\
  `id_number: 1012111631`\n`report_date: 2010-12-11`\n`fixed_date: 0000-00-00`\n`prob_symptoms:\
  \ 将脚本从 Fedora 移动到 Ubuntu 后无法正常工作。`\n`prob_solutions:`\n你现在有解决方案了吗？(y/n) y\n今天解决问题了吗？(y/n)\
  \ y\n简要描述问题解决方案：\n在脚本顶部添加了 `#!/bin/bash`。这是必要的因为 Ubuntu 的默认 shell 是 `dash`。\n问题记录更新如下：\n\
  *************************** 1. row ****************************\n`id_number: 1012111631`\n\
  `report_date: 2010-12-11`\n`fixed_date: 2010-12-11`\n`prob_symptoms: 将脚本从 Fedora\
  \ 移动到 Ubuntu 后无法正常工作。`\n`prob_solutions: 在脚本顶部添加了 `#!/bin/bash`。这是必要的因为 Ubuntu 的默认\
  \ shell 是 `dash.`\n$\n\n这运行得非常完美。现在你已经非常方便地在 `Problem_Trek` 数据库中记录和更新记录了。\n\n###\
  \ 查找问题\n\n拥有像 `Problem_Trek` 这样的数据库的真正之处在于回顾记录。查看过去的问题及其解决方案将让你能够快速解决重复问题并发现趋势。\n\
  \n### 必须的函数\n\n为了在表中查找记录进行回顾，你可以再次使用 `SELECT` 命令。我们在本章之前已经使用过它，用于查看 `problem_logger`\
  \ 表中新添加的记录等目的：\n\n```sql\nSELECT * FROM problem_logger WHERE id_number=$ID_NUMBER\\\
  G\n```\n\n对于 `Find_Problem` 脚本，需要对之前使用的 `SELECT` 命令进行微调。为了能够轻松找到旧问题，脚本会要求输入关键词。因此，如果你记得你有关于\
  \ `yum` 的问题，就会输入关键词“yum”。要在数据库中搜索包含该关键词的记录，请在脚本的 `SELECT` 语句中添加 `LIKE`。代码类似于：\n\n\
  ```sql\nmysql> SELECT * FROM problem_logger WHERE prob_symptoms LIKE 'yum'\\G\n\
  ```\nEmpty (0 sec)。 等，这没起作用！这是因为需要通配符。要在 `prob_symptoms` 字段中找到“yum”这个词，需要在两边都添加通配符。实际上，你是在告诉\
  \ `mysql` 寻找一个 `prob_symptoms` 字段包含单词“yum”的记录。使用的通配符是 `%`。因此，你的代码应该像：\n\n```sql\n\
  mysql> SELECT * FROM problem_logger WHERE prob_symptoms LIKE '%yum%'\\G\n```\n***************************\
  \ 1. row *****************\n`id_number: 1012111624`\n`report_date: 2010-12-11`\n\
  `fixed_date: 2010-12-11`\n`prob_symptoms: 运行 yum 安装软件时获取‘not found’ 消息。`\n`prob_solutions:\
  \ 网络服务宕机。`\n执行了命令：`service network restart`\n1 row (0 sec)\n\n你可能希望 `SELECT` 命令也能搜索\
  \ `prob_solutions` 字段以及 `prob_symptoms` 字段，这将允许更彻底的搜索：\n\n```sql\nmysql> SELECT\
  \ * FROM problem_logger WHERE prob_symptoms LIKE '%yum%' OR prob_solutions LIKE\
  \ '%yum%'\\G\n```\n*************************** 1. row *****************\n注意：如果你担心大小写敏感，不用担心。默认情况下，`mysql`\
  \ 会忽略大小写，所以你可以输入关键词“yum”或“YUM”。为了对 `Problem_Trek` 数据库进行有效搜索，应该允许使用多个关键词。`LIKE` 命令无法兼顾多个。但是，你可以使用正则表达式\
  \ `REGEXP`。`REGEXP` 的优点之一是它会搜索整个字段——不需要通配符。要搜索多个关键词，在它们之间放置一个管道符 `|`。因此，代码现在看起来像：\n\
  \n```sql\nmysql> SELECT * FROM problem_logger WHERE prob_symptoms REGEXP 'yum|dash'\\\
  G\n```\n*************************** 1. row ****************************\n\n### 创建脚本\n\
  \n最好在调用脚本时允许关键词作为参数传递。然而，你不知道可能会传递多少个关键词。可能是五个，可能是一个，也可能没有！这实际上是一个很容易解决的困境。使用 `if`\
  \ 测试检查是否传递了任何关键词。如果是，使用 `$@` 一性获取所有关键词（见第 13 章）。如果没有传递关键词，脚本将需要它们。完成此任务的代码如下：\n\n\
  ```bash\n# 获取关键词(s)\n#\nif [ -n \"$1\" ]; # 检查是否传递了关键词\nthen             # 获取所有传递的关键词\n\
  \  KEYWORDS=$@ # 获取所有参数作为独立的单词，相同的字符串\nelse # 关键词(s) 未传递。询问它们。\n  echo\n  echo “你想搜索哪些关键词？”\n\
  \  echo -e “请用空格分隔单词: \\c”\n  read ANSWER\n  KEYWORDS=$ANSWER\nfi\n```\n\n\n\n\n\
  \n一旦你有了关键词，下一步就是构建搜索语句。请记住，在每对关键词之间需要放置逻辑或 `or (|)`，以便 `REGEXP` 能够正确搜索它们。这可以通过 `sed`\
  \ 轻松实现。`KEYWORDS` 数组变量中的每个空格都可以替换为 `|`。\n\n```bash\nKEYWORDS=‘echo $KEYWORDS | sed\
  \ ‘s/ /|/g’‘\n```\n\n现在脚本看起来像这样：\n\n```bash\n#!/bin/bash\n#\n# Find_Problem - 使用关键字查找问题记录\n\
  ######################################################\n# 确定 sql 位置并设置变量\n#\nMYSQL=‘which\
  \ mysql‘“ Problem_Trek -u cbres”\n#\n#############################################\n\
  # 获取关键词(s)\n#\nif [ -n \"$1\" ]      # 检查是否传递了关键词\nthen               # 获取所有传递的关键词\n\
  #\n      KEYWORDS=$@    # 获取所有参数作为独立的单词，保持字符串相同\n#\nelse               # 未传递关键词。询问用户。\n\
  \      echo\n      echo “您想搜索哪些关键词?”\n      echo -e “请用空格分隔单词: \\c”\n      read\
  \ ANSWER\n      KEYWORDS=$ANSWER\nfi\n#\n##############################################\n\
  # 查找问题记录\n#\necho\necho “使用关键词 $KEYWORDS 找到了以下内容:”\necho\n#\nKEYWORDS=‘echo $KEYWORDS\
  \ | sed ‘s/ /|/g’‘\n# \n$MYSQL <<EOF\nSELECT * FROM problem_logger WHERE\n    prob_symptoms\
  \ REGEXP ‘($KEYWORDS)’\n    OR\n    prob_solutions REGEXP ‘($KEYWORDS)’\nEOF\n#\n\
  ```\n\n当然，下一步是测试你的新脚本。由于多关键词问题一直是关注的焦点，让我们先尝试在命令行中传递多个关键词：\n\n```bash\n$ ./Find_Problem\
  \ yum dash\n```\n\n使用关键词 yum dash 找到了以下内容：yum dash \n***************************\
