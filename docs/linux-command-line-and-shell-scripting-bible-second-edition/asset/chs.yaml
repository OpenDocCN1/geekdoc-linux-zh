  | `PS3` | `select` 命令使用的提示符。 |\n| `PS4` | 使用 bash `-x` 参数时，在命令行回显之前显示的提示符。 |\n|\
  \ `PWD` | 当前工作目录。 |\n| `RANDOM` | 返回 0 到 32767 之间的随机数。给此变量赋值会为随机数生成器种子。 |\n| `REPLY`\
  \ | `read` 命令的默认变量。 |\n| `SECONDS` | 自 shell 启动以来的秒数。赋值会将计时器重置为该值。 |\n| `SHELLOPTS`\
  \ | 已启 bash shell 选项列表，用冒号分隔。 |\n| `SHLVL` | 表示 shell 层级，每启动一个新的 bash shell 就会加\
  \ 1。 |\n| `TIMEFORMAT` | 指定 shell 如何显示时间的格式。 |\n| `TMOUT` | shell 等待的时间（秒为单位）。 |\n\
  | `UID` | 当前用户的有效用户 ID。 |\n\n# 附录 B：sed 和 gawk 快速指南\n\n## sed 编辑器\n\nsed 编辑器可以处理数据。它从输入读取一行数据，并将该数据与提供的编辑器命令进行匹配，更改流中的数据然后输出新数据。\n\
  \n### 启动 sed 编辑器\n\n使用 sed 的格式为：\n\n`sed options script`\n\n`options` 参数允许你自定义 `sed`\
  \ 命令的行为，包括表 B.1 所示的选项。\n\n### 表 B.1：sed 命令选项\n\n| 选项 |  |\n| :--- | :--- |\n| `-e`\
  \ `script` | 在处理输入时，将 `script` 中指定的命令添加到命令列表中。 |\n| `-f` `file` | 在处理输入时，将文件 `file`\
  \ 中指定的命令添加到命令列表中。 |\n| `-n` | 不为每个命令产生输出，而是等待 `print` 命令。 |\n\n`script` 参数指定了应用于数据流的单个命令。如果需要多个命令，你必须使用\
  \ `-e` 选项在命令行中指定它们，或使用 `-f` 选项在单独的文件中指定它们。\n\n## sed 命令\n\nsed 编辑器脚本包含了 sed 对输入中每行数据进行处理的命令。本节描述了你可能想要使用的一些常用\
  \ sed 命令。\n\n### 替换\n\n`s` 命令替换输入流中的文本。`s` 命令的格式为：\n\n`s/pattern/replacement/flags`\n\
  \n`pattern` 是要替换的文本，`replacement` 是 sed 将插入到该位置的新文本。\n\n`flags` 参数控制替换的发生方式。共有四种类型的替换标志可用：\n\
  \n*   一个数字，表示要替换的模式出现次数。\n*   `g`：表示替换文本的所有出现处。\n*   `p`：表示打印原始行的内容。\n*   `w` `file`：表示将替换结果写入文件。\n\
  \n\n\n\n在第一种替换中，你可以指定 `sed` 编辑器应该替换匹配模式的几次出现处。例如，你使用 `2` 来仅替换模式的第二次出现处。\n\n## 定址\
  \ (Addressing)\n\n默认情况下，你在 `sed` 编辑器中使用的命令适用于文本数据的所有行。如果你只想将命令应用于特定的某行或一组行，则必须使用行定址。\n\
  \n`sed` 编辑器中有两种行定址的格式：\n\n*   数字行范围\n*   过滤出某行的文本模式\n\n这两种形式在指定地址时使用相同的格式：\n\n`[address]command`\n\
  \n使用数字行定址时，你通过行在文本流中的位置来引用行。`sed` 编辑器将文本流中的第一行分配为行号一，并对每个新行顺序递增。\n\n```\n$ sed ‘2,3s/dog/cat/’\
  \ data1\n```\n\n另一种限制命令应用行的方法稍微复杂一些。`sed` 编辑器允许你指定一个文本模式，并用它为命令过滤行。其格式为：\n\n`/pattern/command`\n\
  \n你必须用正斜杠将你指定的 `pattern` 括起来。`sed` 编辑器仅对包含你指定的文本模式的行应用命令。\n\n```\n$ sed ‘/rich/s/bash/csh/’\
  \ /etc/passwd\n```\n\n此过滤器会找到包含文本 `rich` 的行，并将文本 `bash` 替换为 `csh`。\n\n你还可以将多个命令组合到特定的地址中：\n\
  \n```\naddress {\ncommand1\ncommand2\ncommand3\n}\n```\n\n`sed` 编辑器将你指定的每个命令仅应用于匹配指定地址的行。`sed`\
  \ 编辑器将处理地址行上列出的每个命令：\n\n```\n$ sed ‘2{\n> s/fox/elephant/\n> s/dog/cat/\n> }’ data1\n\
  ```\n\n`sed` 编辑器将每个替换操作都应用于数据文件中的第二行。\n\n## 删除行 (Deleting Lines)\n\n删除命令 `d` 的作用几乎如其名。它会删除任何匹配所提供地址方案的文本行。使用删除命令时要小心，因为如果你忘记包含地址方案，流中的所有行都将被删除：\n\
  \n```\n$ sed ‘d’ data1\n```\n\n删除命令在与指定地址结合使用时显然最有用。这允许你从数据流中删除特定的文本行，可以通过行号：\n\n\
  ```\n$ sed ‘3d’ data6\n```\n\n或者通过一个特定的行范围：\n\n```\n$ sed ‘2,3d’ data6\n```\n\n\
  `sed` 编辑器的模式匹配功能也适用于删除命令：\n\n```\n$ sed ‘/number 1/d’ data6\n```\n\n只有匹配指定文本的行会被从流中删除。\n\
  \n## 插入和追加文本 (Inserting and Appending Text)\n\n正如你预期的，像任何其他编辑器一样，`sed` 编辑器允许你向数据流插入和追加文本行。这两个操作之间的区别可能会引起混惑：\n\
  \n*   插入命令 (`i`）在指定行之前添加新行。\n*   追加命令 (`a`）在指定行之后添加新行。\n\n这两个命令的格式可能会引起混惑：你不能在单行命令上使用这些命令。你必须在单独的一行中指定要插入或追加的行。此操作的格式为：\n\
  \n```\nsed ‘[address]command\\\nnew line’\n```\n\n`new line` 中的文本将出现在 `sed` 编辑器输出的指定位置。记住，当你使用插入命令时，文本出现在数据流文本之前：\n\
  \n```\n$ echo “testing” | sed ‘i\\\n> This is a test’\nThis is a test\ntesting\n\
  $\n```\n\n当你使用追加命令时，文本出现在数据流文本之后：\n\n```\n$ echo “testing” | sed ‘a\\ \n> This is\
  \ a test’\ntesting\nThis is a test\n$\n```\n\n这允许你在普通文本的末尾插入文本。\n\n## 修改行 (Changing\
  \ Lines)\n\n更改命令允许你更改数据流中整行文本的内容。它的工作方式与插入和追加命令相同，即你必须将新行与 `sed` 命令的其他部分分开单独指定：\n\
  \n```\n$ sed ‘3c\\\n> This is a changed line of text.’ data6\n```\n\n反斜杠字符用于指示脚本中的新行数据。\n\
  \n## 转换命令 (Transform Command)\n\n转换命令 (`y`) 是 `sed` 编辑器中唯一对单个字符操作的命令。转换命令使用以下格式：\n\
  \n`[address]y/inchars/outchars/`\n\n转换命令对 `inchars` 和 `outchars` 的值进行一对一的映射。`inchars`\
  \ 中的第一个字符转换为 `outchars` 中的第一个字符。`inchars` 中的第二个字符转换为 `outchars` 中的第二个字符。这种映射持续到指定字符的整个长度。如果\
  \ `inchars` 和 `outchars` 长度不同，`sed` 编辑器将产生错误消息。\n\n## 打印行 (Printing Lines)\n\n与替换命令中的\
  \ `p` 标志类似，`p` 命令在 `sed` 编辑器输出中打印一行。打印命令最常用的用途是打印包含来自文本模式匹配文本的行：\n\n```\n$ sed -n\
  \ ‘number 3/p’ data6\nThis is line number 3.\n$\n```\n\n`print` 命令允许你从输入流中过滤出特定的数据行。\n\
  \n## 写入文件 (Writing to a File)\n\n`w` 命令用于将行写入。`w` 命令的格式为：\n\n`[address]w filename`\n\
  \n`filename` 可以指定为相对路径或绝对路径，但无论哪种，sed 编辑器必须对该文件具有写权限。\n\n### 从文件读取 (Reading from\
  \ a File)\n\n你已经看到如何向数据流插入和追加文本。读取命令 (`r`) 允许你插入包含在单独文件中的数据。读取命令的格式：\n\n`[address]r\
  \ filename`\n\n`filename` 指定绝对或相对路径。你不能对读取命令使用地址范围。你只能指定单个行号或文本模式。sed 编辑器会在地址之后插入来自文件的文本。\n\
  \n```\n$ sed ‘1,2 test’ data6\n```\n\n输出文件 `test` 仅包含来自输入流的最前两行。\n\n## gawk 程序\n\
  \n### gawk 程序\n\n`gawk` 程序是 Unix 中原始 `awk` 程序的 GNU 版本。`awk` 程序通过提供编程语言而非仅是编辑器命令，比\
  \ `sed` 编辑器更进一步。本节描述了 `gawk` 程序的基础，作为其功能的快速参考。\n\n### 命令格式\n\n`gawk` 程序的的基本格式如下：\n\
  \n`gawk options program file`\n\n### gawk 选项\n\n| 选项 | 描述 |\n| :--- | :--- |\n|\
  \ `-F` `fs` | 指定文件分隔符用于划分行中的数据字段。 |\n| `-f` `file` | 指定用于读取程序的文件名。 |\n| `-v` `var=value`\
  \ | 在 `gawk` 程序中定义变量和默认值。 |\n| `-mf` `N` | 指定数据文件中处理的最最大字段数。 |\n| `-mr` `N` | 指定数据文件中最大记录的大小。\
  \ |\n| `-W` `keyword` | 为 `gawk` 指定兼容模式或警告级别。使用 `help` 选项列出所有可用关键字。 |\n\n命令行选项提供了一种自定义\
  \ `gawk` 程序功能的简便方法。\n\n### 使用 gawk\n\n你可以直接从命令行使用 `gawk`，也可以在你的 shell 脚本中使用。本节演示了如何使用\
  \ `gawk` 程序以及如何为 `gawk` 输入供其处理的脚本。\n\n\n\n\n# 从命令行读取程序脚本\n\n一个 `gawk` 程序脚本由一对左括号和右括号定义。你必须将脚本命令放置在两个括号之间。由于\
  \ `gawk` 命令行假设脚本是一个单一文本字符串，因此你还必须用单引号将你的脚本括起来。这里有一个在命令行上指定的简单 `gawk` 程序脚本的示例：\n\n\
  ```\n$ gawk '{print $1}'\n```\n\n该脚本将显示输入流中每行的第一个数据字段。\n\n## 在程序脚本中使用多个命令\n\n如果一种编程语言只能执行一个命令，那么这种语言将变得大大没用处。`gawk`\
  \ 编程语言允许你将多个命令组合成一个正常的程序。若要在在命令行指定的程序脚本中使用多个命令，只需在每个命令之间放置一个分号即可：\n\n```\n$ echo\
  \ \"My name is Rich\" | gawk '{$4=\"Dave\"; print $0}'\nMy name is Dave\n$ \n```\n\
  \n该脚本执行了两个命令：首先，它将第四个数据字段替换为不同的值；然后它显示流中的整条数据行。\n\n## 从文件读取程序\n\n与 `sed` 编辑器一样，`gawk`\
  \ 编辑器允许你将程序存储在文件中，并在命令行中引用它们：\n\n```\n$ cat script2\n{ print $5 ' userid is ' $1\
  \ }\n$ gawk -F: -f script2 /etc/passwd\n```\n\n`gawk` 程序会在输入流数据上处理文件中指定的所有命令。\n\n\
  ## 在处理数据之前运行脚本\n\n`gawk` 程序还允许你指定程序脚本运行的时机。默认情况下，`gawk` 从输入中读取一行文本，然后对该行文本中的数据执行程序脚本。有时，你可能需要在处理数据之前运行脚本，例如为报告创建一个表头部分。要做到这一点，你可以使用\
  \ `BEGIN` 关键字。这会强制 `gawk` 在读取数据之前执行 `BEGIN` 关键字之后指定的程序脚本：\n\n```\n$ gawk 'BEGIN\
  \ {print \"This is a test report\"}'\nThis is a test report\n$ \n```\n\n你可以在 `BEGIN`\
  \ 部分中放置任何类型的 `gawk` 命令，例如为变量分配默认值的命令。\n\n## 在处理数据后运行脚本\n\n与 `BEGIN` 关键字类似，`END`\
  \ 关键字允许你指定一个 `gawk` 在读取数据后执行的程序脚本：\n\n```\n$ gawk 'BEGIN {print \"Hello World!\"\
  } {print $0} END {print \"byebye\"}'\nHello World!\nThis is a test\nThis is a test\n\
  This is another test.\nThis is another test.\nbyebye\n$\n```\n\n`gawk` 程序首先执行 `BEGIN`\
  \ 部分的代码，然后处理输入流中的任何数据，最后执行 `END` 部分的代码。\n\n# gawk 变量\n\n`gawk` 程序不仅仅是一个编辑器；它是一个完整的编程环境。因此，有许多与\
  \ `gawk` 相关的命令和功能。本节展示了在使用 `gawk` 进行编程时需要了解的主要功能。\n\n## 内置变量\n\n`gawk` 程序使用内置变量来引用程序数据中的特定功能。本节描述了你可以在\
  \ `gawk` 程序中使用的 `gawk` 内置变量，并演示了如何使用它们。\n\n`gawk` 程序将数据定义为记录（records）和数据字段（fields）。记录是一行数据（默认以换行符分隔），数据字段是行内一个独立的数据元素（默认以空白字符，如空格或制表符分隔）。\n\
  \n`gawk` 程序使用数据字段变量来引用每个记录中的数据元素。[表 B.3] 描述了这些变量。\n\n### 表 B.3\n\n| 变量 | 描述 |\n\
  | :--- | :--- |\n| `$0` | 整个记录 |\n| `$1` | 第一个字段 |\n| `$2` | 第二个字段 |\n| `$n` | 第\
  \ n 个字段 |\n| `FIELDWIDTHS` | 定义字段宽度 |\n| `FS` | 输入字段符 |\n| `RS` | 输入记录符 |\n| `OFS`\
  \ | 输出字段符 |\n| `ORS` | 输出记录符 |\n\n除了字段和记录分隔符外，`gawk` 还提供了其他内置变量来帮助你了解情况。表 B.4 显示了更多内置变量。\n\
  \n### 表 B.4 hơn gawk 内置变量\n\n| 变量 | 描述 |\n| :--- | :--- |\n| `ARGC` | 命令行参数的数量 |\n\
  | `ARGIND` | 当前参数的索引 |\n| `ARGV` | 命令行参数数组 |\n| `CONVFMT` | 数字转换格式 |\n| `ENVIRON`\
  \ | 环境关联数组 |\n| `ERRNO` | 发生错误时的系统错误 |\n| `FILENAME` | 输入的文件名 |\n| `FNR` | 当前记录行号\
  \ |\n| `IGNORECASE` | 设置为非零值时忽略大小写 |\n| `NF` | 字段总数 |\n| `NR` | 处理的记录数 |\n| `OFMT`\
  \ | 数字输出格式 |\n| `RLENGTH` | 匹配子串的长度 |\n| `RSTART` | 匹配子串的起始索引 |\n\n你可以在程序脚本的任何地方使用这些内置变量，包括\
  \ `BEGIN` 和 `END` 部分。\n\n## 在脚本中变量赋值\n\n在 `gawk` 程序中为变量赋值类似于在 shell 脚本中——使用赋值语句：\n\
  \n```\n$ gawk '\n> BEGIN{\n> testing=\"This is a test\"\n> print testing\n> }\n\
  This is a test\n$ \n```\n\n一旦为变量赋值，你就可以在 `gawk` 脚本的任何地方使用它。\n\n## 在命令行中变量赋值\n\n\
  你还可以使用 `gawk` 命令行为变量赋值。这允许你在代码之外设置值，从而动态更改值。这里有一个使用命令行变量显示文件中特定数据字段的示例：\n\n```\n\
  $ cat script1\nBEGIN{FS=\",\"}\n{print $n}\n$ gawk -f script1 n=2 data1\n$ gawk\
  \ -f script1 n=3 data1\n```\n\n这一特性是处理 shell 脚本数据的极佳方法。\n\n# gawk 程序功能\n\n`gawk`\
  \ 程序的某些功能对于处理数据非常方便，允许你创建可以解析任何类型文本文件的 gawk 脚本，包括日志文件。\n\n## 正则表达式\n\n你可以使用基础正则表达式\
  \ (BRE) 或扩展正则表达式 (ERE) 来过滤数据流中哪些行适用于程序脚本。\n\n在使用正则表达式时，正则表达式必须出现在它所控制的程序脚本的左括号之前：\n\
  \n```\n$ gawk 'BEGIN{FS=\",\"} /test/{print $1}' data1\nThis is a test\n$ \n```\n\
  \n## 匹配运算符\n\n匹配运算符允许你将正则表达式限制到记录中的特定数据字段。匹配运算符是波浪号 (`~`)。你指定匹配运算符、数据字段变量以及要匹配的正则表达式：\n\
  \n```\n$1 ~ /^data/\n```\n\n该表达式过滤第一个数据字段以文本 data 开头的记录。\n\n\n\n\n除了正则表达式外，你还可以在匹配模式中使用数学表达式。此功能在匹配数据字段中的数值时非常有用。例如，如果你想显示所有属于\
  \ root 用户组（组 ID 0）的系统用户，可以使用此脚本：\n\n```bash\ngawk -F: ‘$4 == 0{print $1} /etc/passwd\n\
  ```\n\n此脚本会显示第四个数据字段包含 0 的所有行的第一个数据字段。\n\n# 结构化命令\n\n`gawk` 程序支持以下结构化命令：\n\n## if-then-else\
  \ 语句\n```bash\nif (condition) statement1; else statement2\n```\n\n### `while` 语句\n\
  ```bash\nwhile (condition)\n{\n  statements\n}\n```\n\n### `do-while` 语句\n```bash\n\
  do {\n  statements\n} while (condition)\n```\n\n### `for` 语句\n```bash\nfor(variableassignment;\
  \ condition; iteration process)\n```\n\n这为 `gawk` 脚本程序员提供了丰富的编程机会。你可以编写出功能足以媲拟任何高级语言程序的\
  \ `gawk` 程序。\n\n# 索引\n\n## 符号与数字\n\n- `:` (冒号)\n- `/etc/passwd`\n- `IFS`\n- `.`\
  \ (点)\n- BRE\n- 正则表达式\n- 相对文件路径\n- `..` (双点), 相对文件路径\n- `;` (分号)\n- `do`\n- 函数\n\
  - `IFS`\n- `mysql`\n- `sed`\n- shell 脚本\n- `&` (安符)\n- 后模式\n- 双括号符号\n- `sed`\n-\
  \ `STDERR`\n- `&&` (双安符)\n- 双括号符号\n- `PID`\n- `*` (星号)\n- BRE\n- `case`\n- 可执行文件\n\
  - 过滤字符串\n- `ls`\n- 正则表达式\n- `**` (双星号), 双括号符号\n- `\\` (反斜杠)\n- `for`\n- bash 提示符字符\n\
