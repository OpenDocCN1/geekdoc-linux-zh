  \ `off`。 |\n| `-newschunksize=n` | 设置分块新闻列表中的文章数量。 |\n| `-newsmaxchunk=n` | 设置新闻列表分块前的最大文章数量。\
  \ |\n| `-nobold` | 禁用视频粗体属性。 |\n| `-nobrowse` | 禁用目录浏览。 |\n| `-nocc` | 禁用邮件发送时的自复制副本提示。默认设置为\
