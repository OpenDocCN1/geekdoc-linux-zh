  \ |\n| `builtin` | 执行指定的 shell 内置命令。 |\n| `cd` | 将当前目录更改指定的目录。 |\n| `caller` | 返回任何活动子程序调用的上下文。\
  \ |\n| `command` | 在不进行正常 shell 查找的情况下执行指定的命令。 |\n| `compgen` | 为指定的单词生成可能的补全匹配。\
  \ |\n| `complete` | 显示指定的单词将如何完成。 |\n| `continue` | 恢复 `for`、`while`、`select` 或\
