  \ 总结\n\n在本章中，我们回顾了一些可以放入 shell 脚本的更高级的功能。用户经常忽略 shell 脚本在特定系统管理任务中的有用之处，因为脚本需要高级功能才能正常运行。\n\
  \n本章演示了如何使用 shell 性能工具（如 `uptime`、`df` 和 `free`）来收集系统性能和资源使用的快照。使用 `sed` 和 `gawk`\
  \ 从命令输出中提取了所需信息，包含了它们的一些更高级的能力。在根据信息创建报告后，通过电子邮件客户端发送给指定的用户账户。\n\n下一节介绍了如何使用 `uptime`\
  \ 和 `vmstat` 创建一个更高级的性能监控脚本。数据从这些工具中收集并存储。\n\n### 附录 A\n\n#### bash 快速指南\n\n在本附录中，我们提供了关于以下内容的简明指南：\n\
  *   shell 内部 \n*   内置命令\n*   环境变量\n\n#### 内置命令\n\nshell 直接包含了许多常用命令。\n\n| 命令 | 描述\
