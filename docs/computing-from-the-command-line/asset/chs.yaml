  \ 文件的大小。\n\n```\n[](#cb265-1)$ stat # ???\n[](#cb265-2)scores.csv: 70\n[](#cb265-3)timings.txt:\
  \ 49\n```\n\n\n\n\n\n### 11) 哪个 `touch` 选项可以帮助你在文件不存在时防止创建该文件？\n\n### 12) 假设 `new_file.txt`\
  \ 不在当前工作目录中。所示 `stat` 命令的输出将会是什么？\n\n```\n[](#cb266-1)$ touch -t '202010052010.05'\
  \ new_file.txt\n[](#cb266-2)$ stat -c '%y' new_file.txt\n[](#cb266-3)# ???\n```\n\
  \n### 13) 下面的 `touch` 命令有效吗？如果是，接下来的 `stat` 命令的输出将会是什么？\n\n```\n[](#cb267-1)# 进入\
  \ 'scripts' 目录并源化 'touch.sh' 脚本\n[](#cb267-2)$ source touch.sh\n[](#cb267-3)\n[](#cb267-4)$\
  \ stat -c '%n: %y' fruits.txt\n[](#cb267-5)fruits.txt: 2017-07-13 13:54:03.576055933\
  \ +0530\n[](#cb267-6)\n[](#cb267-7)$ touch -r fruits.txt f{1..3}.txt\n[](#cb267-8)$\
  \ stat -c '%n: %y' f*.txt\n[](#cb267-9)# ???\n```\n\n### 14) 使用适当的选项获取所示输出。\n\n\
  ```\n[](#cb268-1)$ printf 'αλεπού\\n' | file -\n[](#cb268-2)/dev/stdin: UTF-8 Unicode\
  \ text\n[](#cb268-3)\n[](#cb268-4)$ printf 'αλεπού\\n' | file # ???\n[](#cb268-5)UTF-8\
  \ Unicode text\n```\n\n### 15) 下面的命令有效吗？如果是，输出将会是什么？\n\n```\n[](#cb269-1)$ basename\
  \ -s.txt ~///test.txt///\n[](#cb269-2)# ???\n```\n\n### 16) 给定 shell 变量 `p` 中的文件路径，你是如何获得所示输出的？\n\
  \n```\n[](#cb270-1)$ p='~/projects/square_tictactoe/python/game.py'\n[](#cb270-2)$\
  \ dirname # ???\n[](#cb270-3)~/projects/square_tictactoe\n```\n\n### 17) 解释以下 `stat`\
  \ 命令输出中每个字符的含义。\n\n```\n[](#cb271-1)$ stat -c '%A' ../scripts/\n[](#cb271-2)drwxrwxr-x\n\
  ```\n\n### 18) 所示的第二个 `stat` 命令的输出将会是什么？\n\n```\n[](#cb272-1)$ touch new_file.txt\n\
  [](#cb272-2)$ stat -c '%a %A' new_file.txt\n[](#cb272-3)664 -rw-rw-r--\n[](#cb272-4)\n\
  [](#cb272-5)$ chmod 546 new_file.txt\n[](#cb272-6)$ stat -c '%a %A' new_file.txt\n\
  [](#cb272-7)# ???\n```\n\n### 19) 你如何使用 `mkdir` 命令指定目录权限？\n\n```\n[](#cb273-1)#\
  \ 不要用这个\n[](#cb273-2)$ mkdir back_up\n[](#cb273-3)$ chmod 750 back_up\n[](#cb273-4)$\
  \ stat -c '%a %A' back_up\n[](#cb273-5)750 drwxr-x---\n[](#cb273-6)$ rm -r back_up\n\
  [](#cb273-7)\n[](#cb273-8)# 尝试这样做\n[](#cb273-9)$ mkdir # ???\n[](#cb273-10)$ stat\
  \ -c '%a %A' back_up\n[](#cb273-11)750 drwxr-x---\n```\n\n### 20) 将 `book_list.txt`\
  \ 的文件权限更改为匹配所示的第二个 `stat` 命令的输出。不要使用数字 `220`，请用 `rwx` 字符指定更改。\n\n```\n[](#cb274-1)$\
  \ touch book_list.txt\n[](#cb274-2)$ stat -c '%a %A' book_list.txt\n[](#cb274-3)664\
  \ -rw-rw-r--\n[](#cb274-4)\n[](#cb274-5)# ???\n[](#cb274-6)$ stat -c '%a %A' book_list.txt\n\
  [](#cb274-7)220 --w--w----\n```\n\n### 21) 将 `test_dir` 的权限更改为匹配所示的第二个 `stat` 命令的输出。不要使用数字\
  \ `757`，请用 `rwx` 字符指定更改。\n\n```\n[](#cb275-1)$ mkdir test_dir\n[](#cb275-2)$ stat\
  \ -c '%a %A' test_dir\n[](#cb275-3)775 drwxrwxr-x\n[](#cb275-4)\n[](#cb275-5)# ???\n\
  [](#cb275-6)$ stat -c '%a %A' test_dir\n[](#cb275-7)757 drwxr-xrwx\n```\n\n# 进程管理\n\
  \n本章提供了仅用于交互式使用的进程管理的基本概述。对于其他用例（如系统管理），处理进程需要更健壮的解决方案（请参见 [mywiki.wooledge: 进程管理](https://mywiki.wooledge.org/ProcessManagement)\
  \ 开始学习此类用例）。\n\n## 定义\n\n以下是一些对理解本章内容非常有用的定义：\n\n*   **程序 (Program)** 是为了执行某任务而编写的指令集\n\
  *   **进程 (Process)** 是任何运行中的程序\n*   **守护进程 (Daemon)** 是后台进程\n*   **作业 (Job)** 是不是守护进程的进程\n\
  \    *   即\n\n\n\n\n\n```\n$ ps -e | grep 'vim'\n  6195 ?        00:03:13 gvim\n\
  ```\n\n> ![info](img/file0.svg) 另请 [linuxjourney: ps 教程](https://linuxjourney.com/lesson/monitor-processes-ps-command)。\n\
  \n## pgrep\n\n`pgrep` 命令可以帮助你根据进程名称和属性过滤进程。默认情况下，它匹配进程名，例如：\n\n```\n$ ps -e | grep\
  \ 'vim'\n  2006 ?        00:00:27 gvim\n  3992 pts/2    00:00:00 vim\n$ pgrep 'vim'\n\
  2006\n3992\n```\n\n你可以使用 `-l` 选项来显示进程名（默认显示 PID）。\n\n```\n$ pgrep -l 'vim'\n2006\
  \ gvim\n3992 vim\n```\n\n若要精确匹配进程名（而不是匹配任意位置），请使用 `-x` 选项。\n\n```\n$ pgrep -x 'vim'\n\
  3992\n```\n\n`-a` 选项将列出完整的命令行（之前的 `-l` 选项仅显示名称，不显示参数）。\n\n```\n$ pgrep -a 'vim'\n\
  2006 gvim -p notes.txt src/managing-processes.md\n3992 vim substitution.md\n```\n\
  \n> ![info](img/file0.svg) 还有其他选项，如根据有效 UID、PPID 等进行过滤。更多详情请参 [pgrep 手册](https://www.mankier.com/1/pgrep)。\n\
  \n## kill\n\n有时，进程可能对你的交互没有响应、运行时间过长、无意中占用过多内存等。你可以使用 `kill` 命令来管理此类进程。\n\n正如本章开头提到的，这些示例适用于由你启动的交互式进程（其他用法，例如在脚本中，需要不同的策略）。在尝试发送信号来管理进程之前，请确保\
  \ 100% 确定。\n\n你可以通过信号名称或其关联数字来传递信号。使用 `kill -l` 获取完整的信号列表。另请参考 [unix.stackexchange:\
  \ 信号列表](https://unix.stackexchange.com/q/317492/109046) 和 [unix.stackexchange: 是什么导致了各种信号的发送？](https://unix.stackexchange.com/q/6332/109046)。\n\
  \n```\n# 下列出了前 20 个信号（共 64 个） \n$ kill -l\n1) SIGHUP       2) SIGINT       3) SIGQUIT\
  \      4) SIGILL       5) SIGTRAP\n6) SIGABRT      7) SIGBUS       8) SIGFPE   \
  \    9) SIGKILL     10) SIGUSR1\n11) SIGSEGV     12) SIGUSR2     13) SIGPIPE   \
  \  14) SIGALRM     15) SIGTERM\n16) SIGSTKFLT   17) SIGCHLD     18) SIGCONT    \
  \ 19) SIGSTOP     20) SIGTSTP\n...\n```\n\n你可以使用 PID 或作业号来指定要发送信号的进程。默认发送 `SIGTERM`（`15`），这是一种请求终止程序的礼貌方式。这里是一个示例：\n\
  \n```\n# 这里使用 'sleep' 来模拟一个长时间运行进程\n# 按 Ctrl+z 挂起此命令\n$ sleep 100\n^Z\n[1]+  Stopped\
  \                 sleep 100\n\n# 终止作业号 1\n# 默认发送 SIGTERM\n$ kill %1\n# 只按回车\n$\n\
  [1]+  Terminated              sleep 100\n```\n\n注意，在上面的示例中，`Ctrl+z` 用于挂起进程（注：此处描述可能有误，通常应为挂起，但后续\
  \ `kill` 终止）。\n\n\n\n\n\n# 多功能文本处理工具\n\n许多 CLI 文本处理工具已经存在了半个世纪。新的工具也正在不断编写中，以解决不断扩展的文本处理问题。仅仅知道某个工具的存在，或者在尝试编写自己的解决方案之前搜索现有工具，就能节省时间。此外，流行的工具可能已经针对速度进行了优化，通过广泛使用使其在漏洞方面变得更加加固，并在论坛上有大量的讨论等。\n\
  \n`grep` 已经在之前的搜索文件和文件名 本章介绍的示例仅涵盖了部分功能。我编写了专门的书籍来介绍这些工具，提供了更详细的解释、示例和练习。请访问 [`learnbyexample.github.io/books/`](https://learnbyexample.github.io/books/)\
  \ 查看这些书籍的链接。\n\n> ![info](img/file0.svg) [example_files](https://github.com/learnbyexample/cli-computing/tree/master/example_files)\
  \ 目录包含了本章使用的示例输入文件。\n\n## sed\n\n命令名 `sed` 源于 `stream`（流）`editor（编辑器）。在这里，流指的是通过\
  \ shell 管道传递的数据。因此，该命令的主要功能是 `stdin` 数据的文本编辑器，并将 `stdout` 作为输出目标。你也可以编辑文件并在并在时将更改保存回原文件。\n\
  \n### Substitution\n\n`sed` 有多种命令来处理文本输入。最常用的是 `substitute`（替换）命令，其语法为 `s/REGEXP/REPLACEMENT/FLAGS`。是一些示例：\n\
  \n```\n# 对于每行输入，仅将第一个 ',' 更改为 '-'\nprintf '1,2,3,4\\na,b,c,d\\n' | sed 's/,/-/'\n\
  1-2,3,4\na-b,c,d\n# 通过添加 'g' 标志更改所有匹配项\nprintf '1,2,3,4\\na,b,c,d\\n' | sed 's/,/-/g'\n\
  1-2-3-4\na-b-c-d\n```\n\n这是一个使用文件输入的示例：\n\n```\ncat greeting.txt\nHi there\nHave\
  \ a nice day\n# 将 'day' 更改为 'weekend'\nsed 's/day/weekend/g' greeting.txt\nHi there\n\
  Have a nice weekend\n```\n\n如果你想执行多个替换命令（或使用几个其他 `sed` 命令）怎么办？这取决于使用的命令。这里有一个示例，你可以使用\
  \ `-e` 选项或用 `;` 字符分隔命令。\n\n```\n# 将所有出现的 'day' 更改为 'weekend'\n# 在每行末尾添加 '.'\nsed\
  \ 's/day/weekend/g; s/$/./' greeting.txt\nHi there.\nHave a nice weekend.\n# 使用\
  \ -e 选项实现相同的效果\nsed -e 's/day/weekend/g' -e 's/$/./' greeting.txt\nHi there.\nHave\
  \ a nice weekend.\n```\n\n### Inplace editing\n\n你可以使用 `-i` 选项进行原地编辑（inplace editing）。向此选项传递一个参数可以将原始输入保存为备份。\n\
  \n```\ncat ip.txt\ndeep blue\nlight orange\nblue delight\n# sed 的输出写回 'ip.txt'\n\
  # 原文件保留在 'ip.txt.bkp' 中\nsed -i.bkp 's/blue/green/g' ip.txt\ncat ip.txt\ndeep green\n\
  light orange\ngreen delight\n```\n\n### Filtering features\n\n`sed` 也具有像 `grep`\
  \ 似样的过滤行的功能。你可以根据需要对这些过滤后的行应用其他 `sed` 命令。\n\n```\n# -n 禁用自动打印\n# 'p' 命令打印模式空间的内容\n\
  # 等同于：grep 'at'\nprintf 'sea\\neat\\ndrop\\n' | sed -n '/at/p'\neat\n# 'd' 命令删除匹配行\n\
  # 等同于：grep -v 'at'\nprintf 'sea\\neat\\ndrop\\n' | sed '/at/d'\nsea\ndrop\n# 仅当输入行包含\
  \ '2' 时才将逗号更改为连字符\nprintf '1,2,3,4\\na,b,c,d\\n' | sed '/2/ s/,/-/g'\n1-2-3-4\n\
  a,b,c,d\n# 当输入行不包含 '2' 时，将逗号更改为连字符\nprintf '1,2,3,4\\na,b,c,d\\n' | sed '/2/! s/,/-/g'\n\
  1,2,3,4\na-b-c-d\n```\n\n你可以使用 `q` 和 `Q` 命令在找到匹配行后退出 `sed`：\n\n```\n# 找到包含 'st'\
  \ 的行后退出\nprintf 'apple\\nsea\\neast\\ndust' | sed '/st/q'\napple\nsea\neast\n# 匹配项的行不会被打印\n\
  printf 'apple\\nsea\\neast\\ndust' | sed '/st/Q'\napple\n```\n\n除了替换之外，过滤也可以基于范围完成。\n\
  \n```\n# 使用 '$' 表示最后一行\nprintf 'apple\\n'\n# 使用 {start,} 用于范围\nprintf '1,2,3,4\\\
  na,b,c,d\\n' | sed '1,2'\n1-2-3-4\na-b-c-d\n```\n\n### Regexp substitution\n\n`-E`\
  \ 选项启用 **ERE**（扩展正则表达式）。默认是 **BRE**（基础正则表达式）。\n\n```bash\n# 将非数字序列替换为 '-'\nprintf\
  \ 'Sample12342' | sed -E 's/[⁰-9]+/-'\nSample-42\n# 移除前导零\nprintf '035 12 9834'\
  \ | sed -E 's/\\b0[1-9]{2,}\\b/X/'\n```\n```\n# 由空格分隔的两个或多个重复单词\necho 'aa a a 42\
  \ f_1 f_1.14' | sed -E 's/\\b(\\w+)( \\1)+\\b/\\1/'\naa 42 f_1.14\n# & 反向引用匹配部分\n\
  # \\u 将下一个字符更改为大写\necho 'hello there. how are you?' | sed 's/\\b\\w/\\u&/g'\nHello\
  \ There. How Are You?\n# 仅替换第三个匹配项\necho 'apple:123:banana:fig' | sed 's/:/-/3'\n\
  apple:123:banana-fig\n# 仅从第二次出现开始将所有 ':' 更改为 ','\necho 'apple:123:banana:fig' |\
  \ sed 's/:/,/2g'\napple:123,banana,fig\n```\n\n\n\n\n\n`/` 字符在习惯上被用作正则表达式的分隔符。但除了\
  \ `\\` 和换行符之外的任何字符都可以用来替代它。这有助于避免或减少转义分隔符字符的需求。\n\n```\n[](#cb298-1)$ echo '/home/learnbyexample/reports'\
  \ | sed 's#/home/learnbyexample/#~/#'\n[](#cb298-2)~/reports\n[](#cb298-3)\n[](#cb298-4)$\
  \ echo 'home path is:' | sed 's,$, '\"$HOME\"','\n[](#cb298-5)home path is: /home/learnbyexample\n\
  ```\n\n## 进阶阅读\n\n- 我的电子书 [GNU SED](https://github.com/learnbyexample/learn_gnused)\n\
  \  - 另参我的博客文章 [GNU BRE/ERE 快速备表](https://learnbyexample.github.io/gnu-bre-ere-cheatsheet/)\n\
  - [unix.stackexchange: 使用 sed 和其他工具常用的搜索与替换示例](https://unix.stackexchange.com/q/112023/109046)\n\
  \n## awk\n\n`awk` 是一种编程语言，主要用于基于字段的处理。`awk` 还提供了类似于 `grep` 和 `sed` 支持的过滤功能，以及一些更巧妙的功能。与许多命令行工具一样，`awk`\
  \ 可以从标准输入（stdin）和文件接受输入。\n\n### 正则表达式过滤\n\n为了方便在命令行使用编程功能，有几种快捷方式，例如：\n\n- `awk\
  \ '/regexp/'` 是 `awk '$0 ~ /regexp/{print $0}'` 的快捷方式\n- `awk '!/regexp/'` 是 `awk\
  \ '$0 !~ /regexp/{print $0}'` 的快捷方式\n\n```\n[](#cb299-1)# 等于：grep 'at' 和 sed -n\
  \ '/at/p'\n[](#cb299-2)$ printf 'gate\\napple\\nwhat\\nkite\\n' | awk '/at/'\n[](#cb299-3)gate\n\
  [](#cb299-4)what\n[](#cb299-5)\n[](#cb299-6)# 等于：grep -v 'e' 和 sed -n '/e/!p'\n\
  [](#cb299-7)$ printf 'gate\\napple\\nwhat\\nkite\\n' | awk '!/e/'\n[](#cb299-8)what\n\
  ```\n\n### Awk 特殊变量\n\n下面提供了一些特殊变量的要描述：\n\n- `$0` 包含输入记录的内容\n- `$1` 第一个字段\n- `$2`\
  \ 第二个字段，依此类推\n- `FS` 输入字段分隔符\n- `OFS` 输出字段分隔符\n- `NF` 字段数\n- `RS` 输入记录分隔符\n- `ORS`\
  \ 输出记录分隔符\n- `NR` 记录数（即行号）\n\n### 默认字段处理\n\n`awk` 自动根据一个或多个连续的 `space`、`tab` 或 `newline`\
  \ 字符序列将输入分成字段。此外，输入开头或结尾的这三个字符中的任何一个会被修剪，不会成为字段内容的一部分。可以使用 `$N` 访问字段，其中 `N` 是你需要的字段编号。你也可以传递表达式而不是数字字面量来指定所需的字段。\n\
  \n以下是一些示例：\n\n```\n[](#cb300-1)$ cat table.txt\n[](#cb300-2)brown bread mat hair\
  \ 42\n[](#cb300-3)blue cake mug shirt -7\n[](#cb300-4)yellow banana window shoes\
  \ 3.14\n[](#cb300-5)\n[](#cb300-6)# 打印每行输入内容的第二个字段\n[](#cb300-7)$ awk '{print $2}'\
  \ table.txt\n[](#cb300-8)bread\n[](#cb300-9)cake\n[](#cb300-10)banana\n[](#cb300-11)\n\
  [](#cb300-12)# 仅当最后一个字段为负数时打印该行\n[](#cb300-13)$ awk '$NF<0' table.txt\n[](#cb300-14)blue\
  \ cake mug shirt -7\n[](#cb300-15)\n[](#cb300-16)# 仅对第一个字段将 'b' 更改为 'B'\n[](#cb300-17)#\
  \ gsub() 类似于带有 'g' 标志的 sed 替换命令\n[](#cb300-18)# 不需要 'g' 标志时使用 sub()\n[](#cb300-19)$\
  \ awk '{gsub(/b/, \"B\", $1)} 1' table.txt\n[](#cb300-20)Brown bread mat hair 42\n\
  [](#cb300-21)Blue cake mug shirt -7\n[](#cb300-22)yellow banana window shoes 3.14\n\
  ```\n\n### 条件与动作\n\n到目前为止的示例使用了几种不同的方法来构建典型的 `awk` 单行命令。如果你还没有掌握语法，这个通用结构可能会有所帮助：\n\
  \n```\n[](#cb301-1)awk 'cond1{action1} cond2{action2} ... condN{actionN}'\n```\n\
  \n如果未提供条件，则始终执行动作。在块内部，你可以提供多个由分号隔开的语句。如果没有提供动作，则当条件评估为 `true` 时，默认会打印 `$0` 变量的内容。当动作不存在时，可以使用分号来终止条件并开始另一个\
  \ `condX{actionX}` 片段。\n\n你可以在 `BEGIN{}` 块在读取输入之前执行某些操作，并在 `END{}` 块在处理所有输入后执行某些操作。\n\
  \n```\n[](#cb302-1)$ seq 2 | awk 'BEGIN{print \"---\"} 1; END{print \"%%%\"}'\n\
  [](#cb302-2)---\n[](#cb302-3)1\n[](#cb302-4)2\n[](#cb302-5)%%%\n```\n\n### 正则表达式字段处理\n\
  \n如前所述，`awk` 自动将输入分成字段（基于空格/制表符/换行符），可以使用 `$N` 访问，其中 `N` 是你需要的字段编号。可以使用 `-F` 选项或\
  \ `FS` 设置字段分隔符。使用 `OFS` 设置输出字段分隔符。\n\n```\n[](#cb303-1)$ awk -F: '{print $1, $2}'\
  \ file.txt\n[](#cb303-2)apple red\n[]cbcb303-3)banana yellow\n```\n\n\n\n\n\n```bash\n\
  # same as: sed -n '/start/,/end/p' uniform.txt\nawk '/start/{f=1} f; /end/{f=0}'\
  \ uniform.txt\n--start 1--\n1234\n6789\n**end 1**\n--start 2--\na\nb\nc\n**end 2**\n\
  # you can re-arrange and invert the conditions to create other combinations\n# for\
  \ example, exclude ending match\nawk '/start/{f=1} /end/{f=0} f' uniform.txt\n--start\
  \ 1--\n1234\n6789\n--start 2--\na\nb\nc\n```\n\n这里有一个示例，仅当第一记录包含 `ar` 且第二记录包含 `nice`\
  \ 时，打印这两个连续记录：\n\n```bash\nawk 'p ~ /ar/ && /nice/{print p ORS $0} {p=$0}' uniform.txt\n\
  how are you\nhave a nice day\n```\n\n### 两个文件的处理\n\n以下解决方案中使用的关键特性：\n\n* 对于作为两个文件作为输入，只有在处理第一个文件时，`NR==FNR`\
  \ 才为真\n    * `FNR` 是记录数，类似于 `NR`，但每个输入文件处理时都会重置\n* `next` 将跳过代码剩余部分并获取下一记录\n* `a[$0]`\
  \ 本身是一个有效语句。它会在数组 `a` 中创建一个未初始化的元素，以 `$0` 为键（如果该键尚不存在）\n* `$0 in a` 检查给定字符串（此处为\
  \ `$0`）是否存在于数组 `a` 的键\n\n```bash\n# common lines, same as: grep -Fxf c1.txt c2.txt\n\
  awk 'NR==FNR{a[$0]; next} $0 in a' c1.txt c2.txt\nBlue\nOrange\nRed\nWhite\n# lines\
  \ present in c2.txt but not in c1.txt\nawk 'NR==FNR{a[$0]; next} !($0 in a)' c1.txt\
  \ c2.txt\nBlack\nGreen\nPink\n```\n\n> ![warning](img/file7.svg) 注意，如果第一个文件为空，`NR==FNR`\
  \ 逻辑将失效。请参考[这个 unix.stackexchange 线程](https://unix.stackexchange.com/a/237110/109046)\
  \ 获取解决方案。\n\n### 去重\n\n`awk '!a[$0]++'` 是最著名的 `awk` 单行命令之一。它在保留输入顺序的同时消除基于行的重复。下面的示例展示了这一特性的用法，并说明了逻辑的工作原理。\n\
  \n```bash\ncat purchases.txt\ncoffee\ntea\nwashing powder\ncoffee\ntoothpaste\n\
  tea\nsoap\ntea\nawk '{print +a[$0] \"\\t\" $0; a[$0]++}' purchases.txt\n0      \
  \ coffee\n0       tea\n0       washing powder\n1       coffee\n0       toothpaste\n\
  1       tea\n0       soap\n2       tea\n# 只有第一列为零的记录会被保留\nawk '!a[$0]++' purchases.txt\n\
  coffee\ntea\nwashing powder\ntoothpaste\nsoap\n```\n\n## 延伸阅读\n\n* 我的电子书 [GNU AWK](https://github.com/learnbyexample/learn_gnuawk)\n\
  * 另另我的博客文章 [GNU BRE/ERE cheatsheet](https://learnbyexample.github.io/gnu-bre-cheatsheet/)\n\
  * [在线 gawk 手册](https://www.gnu.org/software/gawk/manual/)\n\n### perl\n\nPerl 是一种具有许多内置功能和强大生态系统的脚本语言。Perl\
  \ 单行命令可以用于文本处理，类似于 `grep`、`sed`、`awk`。类似于许多命令行工具，`perl` 可以同时从 `stdin` 和文件参数接受输入。\n\
  \n#### 基础单行命令\n\n```bash\n# print all lines containing 'at'\n# same as: grep 'at'\
  \ and sed -n '/at/p' and awk '/at/'\nprintf 'gate\\napple\\nkite\\n' | perl -ne\
  \ 'print if /at/'\n# print lines NOT containing 'e'\n# same as: grep -v 'e' and\
  \ sed -n '/e/!' and awk '!e/'\nprintf 'gate\\napple\\nkite\\n' | perl -ne 'print\
  \ if !e/'\n```\n\n当你在双引号内使用数组（如上面示例中的 `\"@F\"`）时，字段将以空格字符分隔进行打印。`join` 函数是使用自定义字段分隔符打印数组内容的方法之一。这里有一个示例：\n\
  \n```bash\n# print contents of @F array with colon as the separator\nperl -lane\
  \ 'print join \":\", @F' table.txt\nbrown:bread:mat:hair:42\nblue:cake:mug:shirt:-7\n\
  yellow:banana:window:shoes:3.14\n```\n\n> ![info](img/file0.svg) 在上面的示例中，使用了 `-l`\
  \ 选项从输入行中移除记录分隔符（默认是换行符）。因此，当使用 `print` 函数时，移除的记录分隔符会被加上。\n\n### Perl 特殊变量\n\n下面提供了一些特殊变量的简要描述：\n\
  \n* `$_` 包含输入记录的内容\n* `@F` 包含字段的数组（通过 `-a` 和 `-F` 选项）\n    * `$F[0]` 第一字段\n    *\
  \ `$F[1]` 第二字段，依此类推\n    * `$F[-1]` 最后字段\n    * `$F[-2]` 倒数第二个字段，依此类推\n    * `$#F`\
  \ 最后一个字段的索引\n* `$.` 记录数（即行号）\n* `$1` 第一个捕获组引用\n* `$2` 第二个捕获组引用，依此类推\n* `$&` 整个匹配部分的引用\n\
  \n### 自动分割\n\n这里有一些基于特定字段而非整行的示例。`-a` 选项将输入行按空白符分割，可以使用特殊变量 `@F` 访问字段内容。开头和结尾的空白会被抑制，因此不存在空字段的情况。\n\
  \n```bash\ncat table.txt\nbrown bread mat hair 42\nblue cake mug shirt -7\nyellow\
  \ banana window shoes 3.14\n# same as: awk '{print $2}' table.txt\nperl -lane 'print\
  \ $F[1]' table.txt\nbread\ncake\nbanana\n# same as: awk '$NF<0' table.txt\nperl\
  \ -lane 'print if $F[-1] < 0' table.txt\nblue cake mug shirt -7\n# same as: awk\
  \ '{gsub(/b/, \"B\", $1)} 1' table.txt\nperl -lane '$F[0] =~ s/b/B/g; print \"@F\"\
  ' table.txt\nBrown bread mat hair 42\nBlue cake mug shirt -7\nyellow banana window\
  \ shoes 3.14\n```\n\n> ![info](img/file0.svg) 类似于 `sed`，你可以使用 `-i` 选项进行原地编辑。\n\n\
  ### 正则字段分隔符\n\n你可以使用 `-F` 选项指定用于输入字段分割的正则表达式模式。\n\n\n\n\n\n```\n$ echo 'apple,banana,cherry'\
  \ | perl -F, -lane 'print $F[1]'\nbanana\n\n$ s='Sample123string42with777numbers'\n\
  $ echo \"$s\" | perl -F'\\d+' -lane 'print join \",\", @F'\nSample,string,with,numbers\n\
  ```\n\n### 强大的功能\n\n当我需要强大的正则表达式功能并利用大量的内置函数和库时，我会选择 Perl 而不是 `grep`、`sed` 或 `awk`。\n\
  \n以下是一些展示了 BRE/ERE 中不存在的正则表达式特性：\n\n```bash\n# 反转输入行末尾的小写字母字母表\n# 'e' 标志允许你在替换部分中使用\
  \ Perl 代码\n$ echo 'fig 42apples' | perl -pe 's/[a-z]+$/reverse $&/e'\nfig 42selppa\n\
  \n# 将算术表达式替换为它们的结果\n$ echo '42*10 200+100 22/7' | perl -pe 's|\\d+[+/*-]\\d+|$&|gee'\n\
  420 300 3.14285714285714\n\n# 在搜索模式中排除术语\n$ s='orange apple appleseed'\n$ echo \"\
  $s\" | perl -pe 's#\\bapple\\b(*SKIP)(*F)|\\w+#($&)#g'\n(orange) apple (appleseed)\n\
  ```\n\n这里是一些展示内置功能的示例：\n\n```bash\n# 过滤包含 'in'、'it' 或 'is' 的字段\n$ s='goal:amazing:42:whistle:kwality:3.14'\n\
  $ echo \"$s\" | perl -F: -lane 'print join \":\", grep {/i[nts]/} @F'\namazing:whistle:kwality\n\
  \n# 按升序排序数字\n# 使用 {$b <=> $a} 进行降序\n$ echo '23 756 -983 5' | perl -lane 'print join\
  \ \" \", sort {$a <=> $b} @F'\n-983 5 23 756\n\n# 按升序排序字符串\n$ s='floor bat to dubious\
  \ four'\n$ echo \"$s\" | perl -lane 'print join \":\", @F'\nbat:dubious:floor:four:to\n\
  \n# 唯一字段，保持元素的输入顺序\n# -M 选项帮助你加载模块\n$ s='3,b,a,3,c,d,1,d,c,2,2,2,3,1,b'\n$ echo\
  \ \"$s\" | perl -MList::Util=uniq -F, -lane 'print join \",\", uniq @F'\n3,b,a,c,d,1,2\n\
  ```\n\n### 扩展阅读\n\n* [perldoc: Perl 简介](https://perldoc.perl.org/perlintro)\n* [perldoc:\
  \ Regular 表达式教程](https://perldoc.perl.org/perlretut)\n* 我的电子书 [Perl 单行命令](https://github.com/learnbyexample/learn_perl_oneliners)\n\
