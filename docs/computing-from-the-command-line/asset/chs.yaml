  $ chmod +x try.sh\n/try.sh: line 2: No file or directory\nhello\n```\n\n2) 下述命令有效吗？如果是，输出是什么？\n\
  \n```bash\n$ echo hello | bash\n```\n\n3) 什么时候使用 `source` 而不是 shebang？\n\n4) 如何在变量后添加\
