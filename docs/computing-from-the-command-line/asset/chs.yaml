  \ `bash -x` 和 `bash -v` 选项做了什么？\n\n### 24) 什么时候使用 `shellcheck`？\n\n# Shell 自定义\n\
  \n本章将讨论一些你可以用来自定义运行进程 shell 的功能。\n\n## 环境变量\n\n根据 [wikipedia: Environment variable](https://en.wikipedia.org/wiki/Environment_variable)\
  \ 定义：\n\n环境变量是一个动态命名的值，可以影响进程的行为。它们是运行进程环境的一部分。例如，进程可以查询 `TEMP` 环境变量以发现存储临时文件的位置，或者\
  \ `HOME` 或 `USERPROFILE` 变量来查找用户目录。\n\n* `HOME`: 当前用户的家目录；由 `cd` 内置命令设置。该变量也用于波浪号扩展\n\
  * `PS1`: 主提示符。默认值为 `\\s-\\$`。\n* `PS2`: 次要提示符。默认值为 `>`。\n* `PATH`: 查找命令的冒号分隔目录列表。`PATH`\
  \ 值中的零长度目录表示当前目录。空目录可能出现在相邻冒号或出现在开头/结尾。\n* `PWD`: 由 `cd` 内置命令设置的当前目录。\n* `OLDPWD`:\
  \ 由 `cd` 内置命令设置的上一个目录。\n* `SHELL`: shell 的完整路径\n\n你可以使用 `printenv` 命令显示所有环境变量的名称和值。提供参数将只显示这些变量的值。\n\
  \n```\n[](#cb508-1)$ printenv SHELL PWD HOME\n[](#cb508-2)/bin/bash\n[](#cb508-3)/home/learnexample/cli-computing\n\
  [](#cb508-4)/home/learnexample\n```\n\n> ![info](img/file2.svg) ![warning](img/file7.svg)\
  \ 建议使用小写定义用户变量，以避免与环境变量冲突。你可能注意到我在脚本脚本章节中使用了小写。\n\n> ![info](img/file0.svg) 另请 [unix.stackexchange:\
  \ 如何正确将路径添加到 PATH?](https://unix.stackexchange.com/q/26047/109046)。\n\n## 别名和函数\n\
  \n使用相应的 `alias` 命令创建别名。不带任何参数时，它将列出所有定义的别名。如果你想知道某个现有别名的作用，提供一个或多个名称作为参数。要创建一个别名，给出一个名称，后面跟\
  \ `=` 然后是要被别名的命令。`=`运算符周围不应有空格。使用 `type name` 检查该名称是否已被某些命令占用。示例如下：\n\n\n\n\n\n\
  ```\n# 将 'p'映射到 'pwd'命令\n$ type p\nbash: type: p: not found\n$ alias p='pwd'\n$\
  \ p\n/home/learnbyexample/cli-computing\n\n#为 'ls' 调用添加 '--color=auto'\n$ type -a\
  \ ls\nls is /bin/ls\n$ alias ls='ls --color=auto'\n$ type -a ls\nls is aliased to\
  \ 'ls --color=auto'\nls is /bin/ls\n```\n\n以下是检查上述别名作用的方法：\n\n```\n$ alias p ls\n\
  alias p='pwd'\nalias ls='ls --color=auto'\n```\n\n> ![info](img/file0.svg) 如上所示，别名的优先级高于\
  \ `PATH` 中的路径命令。如果你想避开别名并使用原始命令，可以使用 `\\` 前缀（例如 `\\ls`）。你也可以使用 `command ls` 来代替转义字符。\n\
  \n如果你需要向你的自定义命令传递参数，请使用函数（或编写一个 shell 脚本）。这里有一个函数示例：\n\n```\n# 在给定的参数前加上当前路径\n$\
  \ ap() { for f in \"$@\"; do echo \"$PWD/$f\"; done; }\n\n$ p\n/home/learnbyexample\n\
  $ ap ip.txt mountain.jpg\n/home/learnbyexample/ip.txt\n/home/learnbyexample/mountain.jpg\n\
  ```\n\n> ![info](img/file0.svg) 上述的别名和函数仅对特定的 shell 会话有效。要自动加载这些快捷方式，你需要将它们添加到特殊文件中。详细信息请见下一节。\n\
  \n你可以使用 `unalias` 命令来删除别名。对于函数，使用 `unset -f` 命令。\n\n```\n$ unalias p\n\n$ unset\
  \ -f ap\n\n$ type p ap\nbash: type: p: not found\nbash: type: ap: not found\n```\n\
  \n## 配置文件\n\n你可以向特殊的配置文件中添加自定义内容，这样这些设置会在启动交互式 shell 会话时自动加载。\n\n### .bashrc\n\n\
  参考 [bash 手册：启动文件](https://www.gnu.org/software/bash/manual/bash.html#Bash-Startup-Files)：\n\
  \n> 当启动一个非登录 shell 的交互式 shell 时，如果 `~/.bashrc` 文件存在，Bash 会读取并执行该文件中的命令。\n\n你可能会从已安装的\
  \ Linux 发行版获得一个 `~/.bashrc` 文件，其中包含实用的设置，如启用 `bash` 程序化补全功能、别名等。除非它们与我想自定义的别名和 shell\
  \ 选项有关，否则我不会修改发行版提供的设置。\n\n我使用的一些 `shopt` 自定义配置所示。`shopt` 在 Shell 特性 章节中简单讨论过。更多详情请参\
  \ [bash 手册：Shopt 内置命令](https://www.gnu.org/software/bash/manual/bash.html#The-Shopt-Builtin)。\n\
  \n```\n# 追加历史文件而不是覆盖\nshopt -s histappend\n\n# 扩展通配符功能\nshopt -s extglob\n\n# 用于在指定路径内递归匹配文件\n\
  shopt -s globstar\n```\n\n我倾向于使用简单的提示符 `PS1='$ '` 而不是花哨的颜色。自定义选项参见 [bash 手册：控制提示符](https://www.gnu.org/software/bash/manual/bash.html#Controlling-the-Prompt)。你可以使用\
  \ [bashrcgenerator](https://bashrcgenerator.com/) 轻松生成花哨的提示符。另见 [starship](https://starship.rs/)，这是一个适用于任何\
  \ shell 的极简、极速且无限自定义的提示符。\n\n某些历史自定义配置所示。更多详情参见 [bash 手册：历史设施](https://www.gnu.org/software/bash/manual/bash.html#Bash-History-Facilities)。另见\
  \ [unix.stackexchange：跨会话的常用历史](https://unix.stackexchange.com/q/18212/109046)。\n\
  \n```\n# ignorespace 防止以空格开头的行被保存到历史\n# erased 删除与当前匹配之前的条目\nHISTCONTROL=ignorespace:erased\n\
  \n# 当前 shell 会话的最大行数\n# 如果超过大小，将覆盖旧条目\n# 使用负数表示无限大小\nHISTSIZE=2000\n\n# 历史文件的最大行数\n\
  HISTFILESIZE=2000\n```\n\n对于别名和函数，我使用一个名为 `~/.bash_aliases` 的独立文件来减少 `.bashrc` 文件的混乱。这不是一个自动加载的文件，因此你需要在\
  \ `.bashrc` 文件中添加 `source ~/.bash_aliases` 命令。下面展示我常用的一些别名和函数。更多内容请参见 [.bash_aliases](https://github.com/learnbyexample/scripting_course/master/.bash_aliases)。\n\
  \n```\nalias c='clear'\nalias p='pwd'\nalias e='exit'\nalias c1='cd ../'\nalias\
  \ c2='cd ../..'\nalias c3='cd ../../../\nalias ls='ls --color=auto'\nalias l='ls\
  \ -ltrG'\nalias la='l -A'\nalias grep='grep --color=auto'\n# 将历史记录中的最后命令保存到引用文件\n\
  alias sl='fc -1 | sed \"s/^\\s//\" ~/.saved_cmds.txt'\nalias slg='< ~/.saved_cmds.txt\
  \ grep'\n# 不忽略大小写的文件搜索\n# fs foo 等同于 find -iname 'foo*'\nfs() { find -iname \"$1\"\
  * ; }\n```\n\n\n\n\n\nTab 键可以根据上下文帮助你完成命令、别名、文件名等。如果只有一种可能的补全结果，按一次 Tab 键即可完成。否则，你可以按两次\
  \ Tab 键获取所有可能的匹配项列表（如果有的话）。\n\n如前文 .inputrc 节所示，使用 `set show-all-if-ambiguous on`\
  \ 可以将单击和双击 Tab 合并为一个操作。\n\n> ![info](img/file0.svg) 更多详情请参 [bash 手册：可编程补全](https://www.gnu.org/software/bash/manual/bash.html#Programmable-Completion)。\n\
  \n### 搜索历史记录\n\n你可以使用 `Ctrl+r` 来搜索命令历史。按下此组合键序列后，输入你想在历史中匹配的字符，然后按 `Esc` 键返回命令提示符，或按\
  \ `Enter` 键执行命令。\n\n你可以反复按 `Ctrl+r` 向后移动匹配项，并按 `Ctrl+s` 向前移动。如果 `Ctrl+s` 无法按预期工作，请参\
  \ [unix.stackexchange: disable ctrl-s](https://unix.stackexchange.com/q/332791/109046)。\n\
  \n如 .inputrc 节所述，你可以使用自定义键位映射来根据命令的起始字符进行搜索。\n\n### 移动光标\n\n文档使用了 `Meta`（`M-` 前缀），并指出在许多键盘上该键被标记为\
  \ `Alt`。文档还提到你也可以使用 `Esc` 键进行此类组合。\n\n*   `Alt+b` 将光标移动到当前或上一个单词的开头\n*   `Alt+f`\
  \ 将光标移动到下一个单词的末尾\n*   `Ctrl+a` 或 `Home` 将光标移动到行首\n*   `Ctrl+e` 或 `End` 将光标移动到行尾\n\
  \n> ![info](img/file0.svg) `Alt` 和 `Esc` 组合的区别在于，你可以按住 `Alt` 键点击 `b` 或 `f`；而 `Esc`\
  \ 组合是两次按键，且 `Alt` 必须按住快捷键才生效。\n\n### 删除字符\n\n*   `Alt+Backspace`（或 `Esc+Backspace`）向后删除到单词边界\n\
  *   `Ctrl+w` 向后删除到空格边界\n*   `Ctrl+u` 删除光标之前的所有字符\n*   `Ctrl+k` 从光标位置删除到行尾\n\n###\
  \ 清屏\n\n*   `Ctrl+l` 保留输入的内容并清除屏幕\n\n> ![info](img/file0.svg) 注意 `Ctrl+l` 不会尝试移除回滚缓冲区。为此目的使用\
  \ `clear` 命令。\n\n### 交换单词和字符\n\n*   `Alt+t`（或 `Esc+t`）交换两个单词\n*   `Ctrl+t` 交换两个字符\n\
  \    *   例如，如果你输入的是 `sp` 而不是 `ps`，当光标在 `sp` 右侧时按 `Ctrl+t`\n\n### 插入参数\n\n*   `Alt+.`（或\
  \ `Esc+.`）插入上一个命令的参数，多次按下将遍历上上一个命令，以此类推\n    *   例如，如果上一个命令是 `cat temp.txt`，按下 `Alt+.`\
  \ 将插入 `temp.txt`\n    *   你也可以使用 `!$` 表示上一个命令的参数\n\n### 扩展阅读\n\n*   [bash 手册：绑定\
  \ Readline 命令](https://www.gnu.org/software/bash/manual/bash.html#Bindable-Readline-Commands)\n\
  *   [archlinux wiki：Readline 简介](https://wiki.archlinux.org/title/readline)\n* \
  \  [高效命令行导航](https://cuplofcode.com/blog/2013/07/efficient-command-navigation/index.html)\n\
  \n## 复制与粘贴\n\n下面是终端中的复制粘贴快捷键。你可以在终端中自定义这些快捷键。\n\n*   `Shift+Ctrl+c` 复制选中部分到剪贴板\n\
  *   `Shift+Ctrl+v` 粘贴剪贴板内容\n*   `Shift+Insert` 粘贴选中文本（不一定是剪贴板内容）\n\n你也可以点击鼠标中间代替\
  \ `Shift+Insert` 快捷键。这不仅限于终端，在许多应用程序中同样有效。你可以使用 `xinput` 命令来启用/禁用鼠标点击。首先，不带参数使用\
  \ `xinput` 找到对应鼠标的数字。例如，假设设备数字为 `11`，可以使用以下命令：\n\n*   `xinput set-button-map 11\
  \ 1 3` 禁用中间点击\n*   `xinput set-button-map 11 2 3` 启用中间点击\n\n## 练习\n\n**1)** 使用什么命令显示所有或特定环境变量的名称和值？\n\
  \n**2)** 如果你为已存在的命令（例如 `ls`）添加了别名，如何调用原始命令？\n\n**3)** 为什么下面的别名不起作用？你会用什么代替？\n\n\
  ```\n# 不按预期工作\nalias ext='echo \"${1##*.}\"'\n$ ext ip.txt\ntxt\n# 预期输出\n$ ext ip.txt\n\
  txt\n$ ext scores.csv\ncsv\n.txt\n```\n\n**4)** 如何移除当前会话的特定别名/函数定义？\n\n```\nalias\
  \ hw='echo hello world'\n$ hw\nhello world\n# ???\n$ hw\nhw: command not found\n\
  $ hw() { echo hello there ; }\n$ hw\nhello there\n# ???\n$ hw\nhw: command not found\n\
  ```\n\n**5)** 编写一个别名和一个函数，通过将 `:` 替换为换行符来单独显示 `PATH` 环境变量的内容。示例输出如下。\n\n```\n$ echo\
