  \n**7)** 使用适当的命令和 shell 功能获取以下输出。\n\n```bash\nprintf 'carpet\\njeep\\nbus\\n'\n\
  carpet\njeep\nbus\n\n# 使用上述 'printf' 命令作为输入数据\nc=\necho \"$c\"\ncar\n```\n\n**8)**\
