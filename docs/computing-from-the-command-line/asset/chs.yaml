  ```\n\n## 12) 从输入文件 `fruits.txt` 和 `table.txt` 中提取后六个字节。\n\n```\n[](#cb171-1)# ???\n\
  [](#cb171-2)mango\n[](#cb171-3) 3.14\n```\n\n## 搜索文件和文件名\n\n本章将展示如何根据字符串或正则表达式搜索文件内容。之后，你将学习如何根据文件名以及大小、最后修改时间戳等属性来定位文件。\n\
  \n> ![info](img/file0.svg) [example_files](https://github.com/learnbyexample/cli-computing/tree/master/example_files)\
  \ 目录包含了本章使用的脚本。\n\n## grep\n\n引用自 [wikipedia](https://en.wikipedia.org/wiki/Grep)：\n\
  \n> `grep` 是一个用于在纯文本数据集中搜索匹配正则表达式的行的命令行工具。它的名字源于 `ed` 命令 `g/re/p`（**g**lobally search\
  \ a **r**egular **e**xpression and **p**rint），其效果与此相同。\n\n`grep` 命令拥有非常多的功能，以至于我专门为它写了一本[书](https://github.com/learnbyexample/learn_gnugrep_ripgrep)。最常用的用法是使用正则表达式（regexp）从输入中过滤行。\n\
  \n### 常用选项\n\n下面列出了常用的选项。示例将在稍后的章节中讨论。\n\n* `--color=auto` 使用颜色高亮匹配部分、文件名、行号等\n\
  * `-i` 匹配时忽略大小写\n* `-v` 仅打印不匹配的行\n* `-n` 在输出行前前加行号\n* `-c` 仅显示输出行的计数\n* `-l` 仅打印匹配给定表达式的文件名\n\
  * `-L` 打印不匹配模式的文件名\n* `-w` 仅作为整个单词匹配模式\n* `-x` 仅作为整行匹配模式\n* `-F` 将模式解释为固定字符串（即不是正则表达式）\n\
  * `-o` 仅打印匹配部分\n* `-A N` 打印匹配行及其其后的 `N` 行\n* `-B N` 打印匹配行及其之前的 `N` 行\n* `-C N` 打印匹配行及其前后的\
  \ `N` 行\n* `-m N` 最多打印 `N` 行匹配项\n* `-q` 不产生标准输出，如果找到匹配项则立即退出，在脚本中很有用\n* `-s` 抑制错误信息，在脚本中很有用\n\
  * `-r` 递归搜索指定输入文件夹中的所有文件（默认搜索当前目录）\n* `-R` 类似于 `-r`，也会跟踪符号链接\n* `-h` 不在匹配的行前前缀文件名（单个输入文件的默认行为）\n\
  * `-H` 在匹配的行前前缀文件名（多个输入文件的默认行为）\n\n### 字面量搜索\n\n以下示例都适用于 `-F` 选项，因为它们没有使用正则表达式。`grep`\
  \ 足够智能，可以在情况下执行正确的操作。\n\n```\n[](#cb172-1)# 包含 'an' 的行\n[](#cb172-2)$ printf 'apple\\\
  nbanana\\nmango\\nfig\\ntango\\n' | grep 'an'\n[](#cb172-3)banana\n[](#cb172-4)mango\n\
  [](#cb172-5)tango\n[](#cb172-6)\n[](#cb172-7)# 忽略大小写的匹配\n[](#cb172-8)$ printf 'Cat\\\
  ncut\\ncOnCaT\\nfour cats\\n' | grep -i 'cat'\n[](#cb172-9)Cat\n[](#cb172-10)OnCaT\n\
  [](#cb172-11)four cats\n[](#cb172-12)\n[](#cb172-13)# 仅匹配单词\n[](#cb172-14)$ printf\
  \ 'par value\\nheir\\ntar-par' | grep -w 'par'\n[](#cb172-15)par value\n[](#cb172-16)tar-par\n\
  [](#cb172-17)\n[](#cb172-18)# 统计空行\n[](#cb172-19)$ printf 'hi\\n\\nhello\\n\\nbye\\\
  n' | grep -cx ''\n[](#cb172-20)4\n[](#cb172-21)\n[](#cb172-22)# 匹配匹配后两行的行\n[](#cb172-23)$\
  \ printf 'red\\nblue\\ngreen\\nyellow' | grep -A2 'blue'\n[](#cb172-24)blue\n[](#cb172-25)green\n\
  [](#cb172-26)brown\n```\n这里有一个带有行号和彩色匹配部分的示例：![example with --color](img/file8.png)\n\
  \n### 正则表达式\n\n默认情况下，`grep` 将搜索模式视为基本正则表达式 (BRE)\n\n* `-G` 选项可用于指定需要 BRE\n* `-E`\
  \ 选项将启用扩展正则表达式 (ERE)\n    * 在 `GNU grep` 中，BRE 和 ERE 的区别在于元字符的指定方式\n* `-F` 选项将导致搜索模式被字面处理\n\
  * `-P` 如果可用，此选项将启用 Perl 正则表达式 (PCRE)\n\n以下参考是针对扩展正则表达式的。\n\n**锚点**\n\n* `^` 将匹配限制在字符串开头\n\
  * `$` 将匹配限制在字符串末尾\n* `\\<` 将匹配限制在单词开头\n* `\\>` 将匹配限制在单词末尾\n* `\\b` 将匹配限制在单词开头/结尾\n\
  * `\\B` 匹配任何 `\\b` 不匹配的地方\n\n**点号元字符和量词**\n\n* `.` 匹配任意字符，包括换行符\n* `?` 匹配 0 次或 1\
  \ 次\n* `*` 匹配 0 次或更多次\n* `+` 匹配 1 次或多次\n* `{m,n}` 匹配 `m` 到 `n` 次\n* `{m,}` 匹配至少\
  \ `m` 次\n* `{,n}` 匹配最多 `n` 次（包括 0 次）\n* `{n}` 匹配恰好 `n` 次\n\n**字符类**\n\n* `[set123]`\
  \ 匹配这些字符中的任意一个\n* `[^set123]` 匹配除这些字符之外的任意一个\n* `[3-7AM-X]` 从 `3` 到 `7`、`A` 以及从\
  \ `M` 到 `X` 的字符范围\n* `\\w` 类似于 `[a-zA-Z0-9_]` 用于匹配单词字符\n* `\\s` 类似于 `[ \\t\\n\\\
  r\\f\\v]` 用于匹配空白字符\n* `\\W` 匹配非单词字符\n* `\\S` 匹配非空白字符\n* `[[:digit:]]` 类似于 `[0-9]`\n\
  * `[[:alnum:]]` 类似于 `\\w`\n    * 参见 [grep 手册](https://www.gnu.org/software/grep/manual.html#Character-Classes-and-Bracket-Expressions)\n\
  \n**或与分组**\n\n* `pat1|pat2|pat3` 匹配 `pat1` 或 `pat2` 或 `pat3`\n* `()` 分组模式，`a(b|c)d`\
  \ 等于 `abd|acd`\n    * 同时作为捕获组\n* `\\N` 反引用，给出第 `N` 个捕获组\n    * `\\1` 引用第一个捕获组\n\
  \    * `\\2` 引用第二个捕获组，以此类推直到 `\\9`\n\n引用手册关于 BRE 与 ERE 的差异：\n\n> 在基本正则表达式中，元字符 `?`、`+`、`{`、`|`、`(`\
  \ 和 `)` 失去特殊含义；应使用转义后的 `\\?`、`\\+`、`\\{`、`\\|`、`\\(` 和 `\\)`。\n\n### 正则表达式示例\n\n\
  ```\n[](#cb173-1)# 以 'ar' 结尾的行\n[](#cb173-2)$ printf 'spared no one\\npar\\nspar\\\
  ndare' | grep 'ar$'\n[](#cb173-3)par\n[](#cb173-4)spar\n[](#cb173-5)\n[](#cb173-6)#\
  \ 忽略大小写提取 'part' 或 'parrot' 或 'parent'\n[](#cb173-7)$ echo 'par apartment PARROT\
  \ parent' | grep -ioE 'par(en|ro)?t'\n[](#cb173-8)part\n[](#cb173-9)PARROT\n[](#cb173-10)parent\n\
  [](#cb173-11)\n[](#cb173-12)# 提取引号文本\n[](#cb173-13)$ echo 'I like \"mango\" and\
  \ \"guava\"' | grep -oE '\"[^\"]+'\n[](#cb173-14)\"mango\"\n[](#cb173-15)\"guava\"\
  \n[](#cb173-16)\n[](#cb173-17)# 首尾具有相同三个小写字母的 8 字符行\n[](#cb173-18)$ grep -xE '([a-z]{3})..\\\
  1' /usr/share/dict/words\n[](#cb173-19)mesdames\n[](#cb173-20)respires\n[](#cb173-21)restores\n\
  [](#cb173-22)testates\n```\n\n### 文件之间的行比较\n\n\n\n\n\n`-f` 和 `-x` 选项可以组合使用，获取两个文件之间的共同行，或者配合\
  \ `-v` 获取差异。如果你希望将搜索字符串视为字面量，请添加 `-F`（注意正则表达式是默认选项）。\n\n```bash\n# 进入 'scripts'\
  \ 目录并加载 'grep.sh' 脚本\nsource grep.sh\n## 两个文件之间的共同行\ngrep -Fxf colors_1 colors_2\n\
  yellow\n# 存在 colors_2 中但不在 colors_1 中的行\ngrep -Fvxf colors_1 colors_2\nblue\nblack\n\
  dark green\n# 存在 colors_1 中但不在 colors_2 中的行\ngrep -Fvxf colors_2 colors_1\nteal\n\
  light blue\nbrown\n```\n\n### Perl 兼容正则表达式 (PCRE)\n\n与 BRE/ERE 相比，PCRE 具有许多高级功能。以下是一些示例：\n\
  \n```bash\n# 数字 >= 100，使用独占量量符\necho '0501 035 154 12 26 98234' | grep -oP '0*+\\\
  d{3,}'\n0501\n154\n98234\n# 仅当数字被 = precede 时提取\necho '100 apple=42, fig=314 red:255'\
  \ | grep -oP '=\\K\\d+'\n42\n314\n## 从行首提取数字及可选的连字符组合\necho '123-87-593 42 fig 314-12-111'\
  \ | grep -oP '\\G\\d+-?'\n123-\n87-\n593\n# 除 'bat' 和 'map' 外的所有完整单词\necho 'car2\
  \ bat cod map combat' | grep -oP '\\b(bat|map)\\b(*SKIP)(*F)|\\w+'\ncar2\ncod\n\
  combat\n```\n\n文档请参阅 `man pcrepattern` 或 [PCRE 在线手册](https://www.pcre.org/original/doc/html/pcrepattern.html)。\n\
  \n### 递归搜索\n\n你可以使用 `-r` 选项在指定的目录内进行递归搜索。默认情况下，将搜索当前目录。如果你希望对输入目录中的符号链接也跟踪，请使用 `-R`。在将符号链接作为参数时，不需要\
  \ `-R` 选项。\n\n这里是一些基础示例。递归搜索的效果就像也指定了 `-H` 选项，即使只匹配到一个文件也是如此。此外，默认包含隐藏文件。\n\n```bash\n\
  # 进入 'scripts' 目录并加载 'grep.sh' 脚本\nsource grep.sh\nls -AF\nbackups/  colors_1  colors_2\
  \  .hidden  projects/\n# 在 'backups' 目录递归搜索\ngrep -r 'clear' backups\nbackups/dot_files/.bash_aliases:alias\
  \ c=clear\n# 添加 -h 选项防止输出中出现文件名前\ngrep -rh 'clear' backups\nalias c=clear\n## 默认使用当前目录进行递归搜索\n\
  grep -rl 'clear'\n.hidden\nbackups/dot_files/.bash_aliases\n```\n\n你可以使用 `include/exclude`\
  \ 选项进一步修剪要搜索的文件。注意，即使在没有激活递归搜索的情况下这些选项也有效。\n\n| 选项 | 说明 |\n| --- | --- |\n| `--include=GLOB`\
  \ | 仅搜索匹配 GLOB 的 |\n| `--exclude=GLOB` | 跳过匹配 GLOB 的文件 |\n| `--exclude-from=FILE`\
  \ | 跳过匹配 FILE 中任意模式的文件 |\n| `--exclude-dir=GLOB` | 跳过匹配 GLOB 的目录 |\n\n```bash\n\
  ## 默认搜索\ngrep -r 'Hello'\nprojects/python/hello.py:print(\"Hello, Python!\")\nprojects/shell/hello.sh:echo\
  \ \"Hello!\"\n## 限制搜索仅限以 .py 结尾的文件\ngrep -r --include='*.py' 'Hello'\nprojects/python/hello.py:print(\"\
  Hello, Python!\")\n# 或者，你也可以使用 shell globs 代替 递归+include/exclude\nshopt -s globstar\n\
  grep -H 'Hello'/*.py\nprojects/python/hello.py:print(\"Hello, Python!\")\n```\n\n\
  ![info](img/file0.svg) [ripgrep](https://github.com/BurntSushi/ripgrep) 是 `GNU grep`\
  \ 的推荐替代方案，它具有高度优化的正则表达式、并行搜索，并根据 `.gitignore` 忽略文件等。\n\n### grep 和 xargs\n\n你可以使用\
  \ shell 的 `|` 运算符将一个命令的输出作为另一个命令的输入。假设一个命令给你了一个文件名列表，你想将此列表作为参数传递给另一个命令，你会怎么做？一种解决方案是使用\
  \ `xargs` 命令。这里有一个基础示例（假设文件名不会与 shell 元字符冲突）：\n\n```bash\n## 生成文件名列表的示例\ngrep -rl\
  \ 'clear'\n.hidden\nbackups/dot_files/.bash_aliases\n# 等同于：head -n1 .hidden backups/dot_files/.bash_aliases\n\
  grep -rl 'clear' | xargs head -n1\n> .hidden\n> ghost\n> backups/dot_files/.bash_aliases\n\
  alias p=pwd\n```\n\n空格、换行、分号等字符对 shell 来说是特殊的。因此，包含这些字符的文件名必须正确引用。或者在适用情况下，你可以使用\
  \ ASCII NUL 字符分隔的文件列表（因为文件名不能包含 NUL 字符）。你可以使用 `grep -Z` 用 NUL 分隔输出，并使用 `xargs -0`\
  \ 将输入视为 NUL 分隔。这是一个示例：\n\n```bash\n## 考虑这个生成文件名列表的命令\ngrep -rl 'blue'\n.hidden\n\
  colors_1\ncolors_2\nbackups/color list.txt\n## 显示由于文件名包含元字符导致的问题\n# 'backups/color\
  \ list.txt' 被视为两个不同的文件\ngrep -rl 'blue' | xargs grep -l 'teal'\ncolors_2\ngrep:\
  \ backups/color: No such file or directory\ngrep: list.txt: No such file or directory\n\
  # 使用 'grep -Z' + 'xargs -0' 组合获得稳健的解决方案\n# 匹配包含 'blue' 和 'teal' 的文件\ngrep -rlZ 'blue'\
  \ | xargs -0 grep -l 'teal'\ncolors_1\n```\n\n注意，传递给 `xargs` 的命令不接受自定义的别名和函数。因此，如果你为\
  \ `grep` 设置别名为 `grep --color=auto`，如果输出没有颜色，请不要惊讶。详情请 [unix.stackexchange: 让 xargs\
  \ 使用 alias 代替 binary](https://unix.stackexchange.com/q/141367/109046)。\n\n> ![info](img/file0.svg)\
  \ 你可以使用 `xargs -r` 在文件名列表没有空字符时（即列表为空时）避免运行命令。\n\n> \n\n```bash\n# 没有包含 'violet'\
  \ 的文件\n## 所以，xargs 没有获取任何文件名，但 grep 仍然运行\ngrep -rlZ 'violet' | xargs -0 grep -L\
  \ 'brown'\n(标准输入)\n## 使用 -r 选项在这种情况下避免运行命令\ngrep -rlZ 'violet' | xargs -r0 grep\
  \ -L 'brown'\n```\n\n> ![warning](img/file7.svg) ![warning](img/file7.svg) 不要使用\
  \ `xargs -P` 来合并并行运行的输出，因为可能会得到混乱的结果。[parallel](https://www.gnu.org/software/parallel/)\
  \ 命令是更好的选择。详情见 [unix.stackexchange: xargs vs parallel](https://unix.stackexchange.com/q/104778/109046)。另见\
  \ [unix.stackexchange: 何时使用 xargs](https://unix.stackexchange.com/q/24954/109046)。\n\
  \n## 延伸阅读\n\n*   我的电子书 [GNU GREP 和 RIPGREP](https://github.com/learnbyexample/learn_gnugrep_ripgrep)\n\
  \n    *   另见我的博客文章 [GNU BRE/ERE 快速备表](https://learnbyexample.github.io/gnu-bre-ere-cheatsheet/)\n\
  \n\n\n\n\n* [为什么 GNU grep 如此之快](https://lists.freebsd.org/pipermail/freebsd-current/2010-August/019310.html)\n\
  * [unix.stackexchange: grep -r vs find+grep](https://unix.stackexchange.com/q/131535/109046)\n\
  \n## find\n\n`find` 命令拥有强大的功能，可以根据名称、大小、时间戳等过滤文件和目录。更重要的是，`find` 可以帮助你对这些过滤出的文件执行操作。\n\
  \n## 文件名\n\n默认情况下，当你不带任何选项或路径使用 `find` 时会获取当前目录及其子目录下的所有项（包括隐藏项）。要在特定路径内搜索，应紧跟在\
  \ `find` 之后，即在任何选项之前。\n\n```bash\n[](#cb181-1)# 切到 'scripts' 目录并加载 'find.sh' 脚本\n\
  [](#cb181-2)$ source find.sh\n[](#cb181-3)$ ls -F\n[](#cb181-4)backups/    hello_world.py*\
  \  ip.txt     report.log  todos/\n[](#cb181-5)errors.log  hi.sh*           projects/\
  \  scripts@\n[](#cb181-6)\n[](#cb181-7)$ cd projects\n[](#cb181-8)# 等同于: find .\n\
  [](#cb181-9)$ find\n[](#cb181-10).\n[](#cb181-11)./.venv\n[](#cb181-12)./tictactoe\n\
  [](#cb181-13)./tictactoe/game.py\n[](#cb181-14)./calculator\n[](#cb181-15)./calculator/calc.sh\n\
  [](#cb181-16)\n[](#cb181-17)$ cd ..\n[](#cb181-18)$ find todos\n[](#cb181-19)todos\n\
  [](#cb181-20)todos/books.txt\n[](#cb181-21)todos/TRIP.txt\n[](#cb181-22)todos/wow.txt\n\
  ```\n\n> ![info](img/file0.svg) 注意：默认情况下不会跟踪符号链接。此类情况下，你可以使用 `-L` 选项。\n\n要根据特定标准匹配文件名，可以使用通配符或正则表达式。对于通配符，可以使用\
  \ `-name` 或不区分大小写的版本 `-iname`。这些将仅匹配文件名（basename），因此如果你在模式中使用 `/`，将会收到警告。如果你需要在模式中也包含\
  \ `/`，可以使用 `-path` 和 `-ipath`。与 `grep` 不同，通配符模式（glob pattern）是针对整个文件名匹配的（因为通配符中没有开始/结束锚点）。\n\
  \n```bash\n[](#cb182-1)# 匹配以 '.log' 结尾的文件\n[](#cb182-2)# 'find pij 表示当前工作目录 (CWD)\
  \ 为搜索路径\n[](#cb182-3)$ find . -name '*.log'\n[](#cb182-4)./report.log\n[](#cb182-5)./backups/aug.log\n\
  [](#cb182-6)./backups/jan.log\n[](#cb182-7)./errors.log\n[](#cb182-8)\n[](#cb182-9)#\
  \ 不区分大小写地匹配包含 'ip' 的文件名\n[](#cb182-10)# 注意在 'ip' 两边使用 '*' 以匹配整个文件名\n[](#cb182-11)#\
  \ 当 CWD 是唯一搜索路径时，. 是可选的\n[](#cb182-12)$ find -iname '*ip*'\n[](#cb182-13)./todos/TRIP.txt\n\
  [](#cb182-14)./scripts\n[](#cb182-15)./ip.txt\n[](#cb182-16)\n[](#cb182-17)# 在 'backups'\
  \ 和 'todos' 目录中查找包含 'k' 的名称\n[](#cb182-18)$ find backups todos -name '*k*'\n[](#cb182-19)backups\n\
  [](#cb182-20)backups/bookmarks.html\n[](#cb182-21)todos/books.txt\n```\n\n你可以使用\
  \ `-not` (或 `!`) 运算符来反转匹配条件：\n\n```bash\n[](#cb183-1)# 等同于: find todos ! -name '*[A-Z]*'\n\
  [](#cb183-2)$ find todos -not -name '*[A-Z]*'\n[](#cb183-3)todos\n[](#cb183-4)todos/books.txt\n\
  [](#cb183-5)todos/wow.txt\n```\n\n你可以使用 `-regex` 和 `-iregex`（不区分大小写）根据正则表达式匹配文件名。在这种情况下，模式将匹配整个路径，因此可以在不需要特殊选项的情况下使用\
  \ `/`。默认的正则表达式变体是 `emacs`，你可以通过使用 `-regextype` 选项更改它。\n\n```bash\n[](#cb184-1)#\
  \ 文件名仅包含大写字母且扩展扩展为 '.txt'\n[](#cb184-2)# 注意使用 '.*/' 来匹配整个文件路径\n[](#cb184-3)$ find\
  \ -regex '.*/[A-Z]+\\.txt'\n[](#cb184-4)./todos/TRIP.txt\n[](#cb184-5)\n[](#cb184-6)#\
  \ 这里使用了 'egrep' 变体\n[](#cb184-7)# 文件名以相同的单词字符开头和结尾（不区分大小写）\n[](#cb184-8)# 且文件扩展名为\
  \ '.txt'\n[](#cb184-9)$ find -regextype egrep -iregex '.*/(\\w).*\\1\\.txt'\n[](#cb184-10)./todos/wow.txt\n\
  ```\n\n## 文件类型\n\n`-type` 选项有助于根据类型（如普通文件、目录、符号链接等）过滤文件。\n\n```bash\n[](#cb185-1)#\
  \ 普通文件\nfind -type f\n```\n\n## 深度\n\n`-maxdepth` 选项限制目录树搜索的深度。\n\n```bash\nfind\
  \ -maxdepth 1\n```\n\n## Age\n\n考虑以下属性：\n* `a` 访问\n* `c` 状态更改\n* `m` 修改\n\n上述属性需要结合\
  \ `time`（以 24 小时为单位）或 `min`（以分钟为单位）。例如，`-mtime`（24 小时）检查最后修改时间`-amin`（分钟）检查最后访问时间。这些选项接受数字（整数或小数），并可以前缀\
  \ `+` 或 `-`。\n\n## 大小\n\n你可以使用 `-size` 选项根据文件大小进行过滤。默认情况下，数字参数将被视为 512 字节块。你可以使用后缀\
  \ `c` 以字节指定大小。后缀 `k`（千）、`M`（兆）和 `G`（吉）是按 1024 的幂计算的。\n\n\n\n\n\n```bash\n# greater\
  \ than 10 * 1024 bytes\n$ find -type f -size +10k\n./report.log\n./errors.log\n\n\
  ## greater than 9 bytes and less than 50 bytes\n$ find -type f -size +9c -size -50c\n\
  ./hi.sh\n./hello_world.py\n./ip.txt\n\n# exactly 10 bytes\n$ find -type f -size\
  \ 10c\n./ip.txt\n```\n\n> ![info](img/file0.svg) 你也可以使用 `-empty` 选项代替 `-size 0`。\n\
  \n### 对匹配的文件执行操作\n\n`-exec` 选项可以帮助你将匹配的文件传递给另一个命令。你可以选择为每个文件执行一次命令（使用 `\\;`），或者仅为所有匹配的文件统一执行一次命令（使用\
  \ `+`）。但是，如果文件数量过多，`find` 将根据需要使用更多的命令调用。`;` 字符需要转义，因为它是 shell 的元字符（你也可以使用引号来代替转义）。\n\
  \n你需要使用 `{}` 来表示作为参数传递给所执行命令的文件。\n\n这里是一些示例：\n\n```bash\n# 计算每个匹配文件的字符数\n# wc 为每个匹配文件单独调用一次\n\
  $ find -type f -size +9k -exec wc -c {} \\;\n1234567 ./report.log\n54321 ./errors.log\n\
  \n# 这里，两个匹配的文件被一起传递给 wc 命令\n$ find -type f -size +9k -exec wc -c {} +\n1234567 ./report.log\n\
  \  54321 ./errors.log\n1288888 total\n```\n\n正如管理文件和目录章节提到的，`cp` 和 `mv` 命令的 `-t`\
  \ 选项可以帮助你在源文件之前指定目标目录。这是一个示例：\n\n```bash\n$ mkdir rc_files\n$ find backups/dot_files\
  \ -type f -exec cp -t rc_files {} +\n\n$ find rc_files -type f\nrc_files/.bashrc\n\
  rc_files/.inputrc\nrc_files/.vimrc\n\n$ rm -r rc_files\n```\n\n> ![info](img/file0.svg)\
  \ 你可以使用 `-delete` 选项代替调用 `rm` 命令来删除匹配的文件。然而，它无法删除非空目录，并且还有其他需要注意的问题。详情请参阅手册。\n\n\
  ### 多准则\n\n你可以指定多个匹配准则，例如 `-name`、`-size`、`-mtime` 等。你可以在它们之间使用运算符，并在 `\\(` 和 `\\\
  )` 中进行分组以构建复杂的表达式。\n\n- `-a` 或 `-and` 或缺少运算符意味着两个表达式都必须满足\n    - 如果第一个表达式为假，则不会评估第二个表达式\n\
  - `-o` 或 `-or` 意味着两个表达式必须满足其一\n    - 如果第一个表达式为真，则不会评估第二个表达式\n- `-not` 反转表达式的结果\n\
  \    - 你也可以使用 `!`，但根据 shell 的不同，这可能需要转义或加引号\n\n```bash\n# 查找同时包含 'x' 和 'ip' 的文件名（不区分大小，顺序任意）\n\
  $ find -iname '*x*' -iname '*ip*'\n./todos/TRIP.txt\n./ip.txt\n\n# 查找包含 'sc' 或大小大于\
  \ 10k 的文件\n$ find -name '*sc*' -or -size +10k\n./report.log\n./scripts\n./errors.log\n\
  \n# 排除包含 'o'、'r' 或 'txt' 的文件名\n$ find -type f -not \\( -name '*[or]*' -or -name\
  \ '*txt*' \\)\n./projects/tictactoe/game.py\n./projects/calculator/calc.sh\n./.hidden\n\
  ./hi.sh\n```\n\n## Prune (剪剪)\n\n当你想要防止 `find` 进入特定目录时，`-prune` 选项非常有用。默认情况下，即使给定的条件会导致结果被丢弃，`find`\
  \ 也会遍历所有文件。因此，使用 `-prune` 不仅有助于加速过程，还能在访问排除路径内的文件可能导致错误的情况下提供帮助。\n\n```bash\n##\
  \ 以 .log 结尾的普通文件\n$ find -type f -name '*.log'\n./report.log\n./backups/aug.log\n\
  ./backups/jan.log\n./errors.log\n\n# 排除 'backups' 目录\n# 注意当模式中需要 '/' 时使用 -path\n\
  $ find -type f -not -path './backups/*' -prune -name '*.log'\n./report.log\n./errors.log\n\
  ```\n\n在处理基于 Git 的版本控制项目时，使用 `-not -path '*/.git/*' -prune` 非常方便。\n\n## find 和 xargs\n\
  \n类似于之前看到的 `grep -Z` 和 `xargs -0` 组合，你可以使用 `find -print0` 和 `xargs -0` 组合。`-exec`\
  \ 选项对于大多数用例已经足够了，但如果你需要并行处理，`xargs` 会非常有用。将在多功能工具章节中讨论：\n\n```bash\n$ find -name\
  \ '*.log'\n./report.log\n./backups/aug.log\n./backups/jan.log\n./errors.log\n# 对于过滤后的文件，将所有的\
  \ 'apple' 替换为 'fig'\n$ find -name '*.log' -print0 | xargs -0 -n2 -P2 sed -i 's/apple/g'\n\
  ```\n\n在上面的示例中，`-P2` 用于允许 `xargs` 同时运行两个进程（默认为一）。`-n2` 选项用于限制传递给每个 `sed` 的文件参数数量，否则\
  \ `xargs` 可能会传递尽可能多的参数。注意，上面插图中用于 `-n` 和 `-P` 的值只是随机示例，你需要根据自己的用例进行微调。\n\n## 延伸阅读\n\
  \n- [mywiki.wooledge: 使用 find](https://mywiki.wooledge.org/UsingFind)\n- [find 和\
  \ tar 示例]\n- [为什么遍历 find 的输出是坏习惯]\n\n## locate\n\n`locate` 是通过文件名搜索文件的 `find` 命令的快速替代方案。它基于数据库，该数据库由\
  \ [cron](https://en.wikipedia.org/wiki/Cron) 任务更新。因此，除非更新数据库，否则新文件可能不在结果中。如果你的发行版包含它（例如在\
  \ Debian 类系统上使用 `sudo apt install mlocate`），并且你记得文件名的一部分，可以使用它。这在需要搜索整个文件系统时非常有用，此时\
  \ `find` 命令将花费非常长时间。\n\n是一些示例：\n\n- `locate power` 在整个文件系统中查找包含 `power` 的文件名路径\n\
  \    - 隐式地，由于指定的字符串中没有通配符，`locate` 将字符串转换为 `*power*`\n- `locate -b \\power.log`\
  \ 查找路径结尾完全匹配字符串 power.log 的路径\n    - `/home/learnexample/power.log` 匹配\n    - `/home/learnexample/lowpower'`\
  \ 不匹配，因为文件名开头有其他字符\n    - 使用 `\\` 可以防止搜索字符串被隐式地替换为 `*power.log*`\n- `locate -b \\\
  proj_adder` `-b` 选项也便于仅打印匹配的目录名，否则该文件夹下的所有文件都会被显示\n\n\n\n\n\n> ![info](img/file0.svg)\
  \ 另请 [unix.stackexchange: find 和 locate 的优缺点](https://unix.stackexchange.com/q/60205/109046)。\n\
