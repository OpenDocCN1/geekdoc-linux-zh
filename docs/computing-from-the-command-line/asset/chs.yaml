  [](#cb433-3)05,06,07,08\n[](#cb433-4)09,10,11,12\n[](#cb433-5)13,14,15,16\n```\n\
  \n### 17) 使用 `pr` 命令合并输入文件 `fruits.txt` 和 `ip.txt` 如下所示。\n\n```bash\n[](#cb434-1)#\
  \ ???\n[](#cb434-2)banana : deep blue\n[](#cb434-3)papaya : light orange\n[](#cb434-4)mango\
  \ : blue delight\n```\n\n\n\n\n17) `cut` 命令不支持选择最后 `N` 个字段。本章介绍的哪种工具可以与 `cut` 结合使用以得到如下所示的输出？\n\
  \n```\n# 每行的最后两个字符\n$ printf 'apple\\nbanana\\ncherry\\ndates\\n' | # ???\nle\n\
  na\nry\nes\n```\n\n18) 查阅 `split` 文档并使用适当选项为输入文件 `purchases.txt` 获取如下所示的输出。\n\n\
  ```\n# 每次最多输入最多 3 行\n# ???\n\n$ head xa?\n==> xaa <==\ncoffee\ntea\nwashing powder\n\
  \n==> xab <==\ncoffee\ntoothpaste\ntea\n\n==> xac <==\nsoap\ntea\n\n$ rm xa?\n```\n\
  \n19) 查阅 `split` 文档并使用适当选项获取如下所示的输出。\n\n```\n$ echo 'apple,banana,cherry,dates'\
  \ | split # ???\n\n$ head xa?\n==> xaa <==\napple,\n==> xab <==\nbanana,\n==> xac\
  \ <==\ncherry,\n==> xad <==\ndates\n\n$ rm xa?\n```\n\n20) 拆分输入文件 `purchases.txt`，使得包含\
  \ `powder` 的行之前的文本属于第一个文件，其余部分属于第二个文件，如下所示。\n\n```\n# ???\n\n$ head xx0?\n==> xx00\
  \ <==\ncoffee\ntea\n\n==> xx01 <==\nwashing powder\ncoffee\ntoothpaste\ntea\n\n\
  $ rm xx0\n```\n\n21) 编写一个通用解决方案来转置逗号分隔的数据。示例输入/输出如下所示。你可以使用书中介绍的任何工具。\n\n```\n$\
  \ cat scores.csv\nName,Maths,Physics\nIth,100,100\nCy,97,95\nLin,78,80\n# ???\n\
  Name,Ith,Cy,Lin\nMaths,100,97,78\nPhysics,100,98,83\nChemistry,100,95\n```\n\n22)\
  \ 重塑 `table.txt` 的内容以达到预期的输出。\n\n```\n$ cat table.txt\nbrown bread mat 42 blue cake\
  \ shirt-7\n# ???\nbrown bread mat hair 42 blue cake mug shirt-7 banana window 14\n\
  ```\n\n# Shell 脚本\n\n本章将涵盖使用 `bash` 进行 Shell 脚本的基础知识。你将学习变量、控制结构、向脚本传递参数、获取用户输入等。\n\
  \n![info](img/file0.svg) [example_files](https://github.com/learnbyexample/cli-computing/tree/master/example_files)\
  \ 目录包含了本章中讨论的所有 Shell 脚本。不过，建议你使用自己喜欢的文本编辑器手动输入脚本，仅在需要时参考 `example_files/shell_scripting`\
  \ 目录。\n\n## 脚本的必要\n\n来自 [wikipedia: 脚本语言](https://en.wikipedia.org/wiki/Scripting_language)：\n\
  \n脚本语言或脚本语言是一种用于运行时系统的编程语言，用于自动化执行原本由人工操作员执行的任务。脚本语言通常在运行时解释而不是编译。\n\n典型的脚本语言旨在非常易于学习和编写，既可以以短代码文件的形式存在，也可以在读取-评估-打印循环（REPL，shell）中交互式地进行。这通常意味着语法和语义相对简单；通常一个“脚本”（用脚本语言编写的代码）从头到尾作为“脚本”执行执行，没有显式的入口点。\n\
  \n来自 [wikipedia: Shell 脚本](https://en.wikipedia.org/wiki/Shell_script)：\n\nShell\
  \ 脚本是一种设计用于 Unix shell（一种命令行解释器）运行的计算机程序。脚本脚本的各种方言被认为是脚本语言。脚本脚本执行的典型操作包括文件操作、程序执行和文本打印。设置环境、运行程序并进行任何必要的清理或记录的脚本称为封装（wrapper）。\n\
  \n另见 [脚本语言与编程语言的区别](https://stackoverflow.com/q/17253545/4082052)。\n\n## 可执行脚本\n\
  \n有几种方法可以从执行命令。本节展示了创建一个可执行脚本的示例。考虑保存在文件 `hello.sh` 中的示例脚本：\n\n```\n#!/bin/bash\n\
  \necho \"Hello $USER\"\necho \"Today is $(date -u +%A)\"\necho 'Have a nice day'\n\
  ```\n\n上述脚本的第一行包含两个部分：\n\n* `/bin/bash` 是 `bash` 解释器的路径\n    * 你可以使用 `type bash`\
  \ 获取你系统上的路径。\n* `#!` 被称为 [shebang 或 hashbang](https://en.wikipedia.org/wiki/Shebang_(Unix))，它引导程序加载器使用提供的解释器路径。\n\
  \    * 另见 [stackoverflow: #!/usr/bin/env 和 #!/bin/bash 的比较](https://stackoverflow.com/q/21612980/4082052)\n\
  \    * `#` 字符开始注释，`#!` 只在脚本开头是特殊的\n\n使用 `chmod` 为文件添加执行权限：\n\n```bash\nchmod +x\
  \ hello.sh\n./hello.sh\n```\n\n## 将文件传递给 bash\n\n你也可以将普通文件作为参数传递给 `bash`。这种情况不需要\
  \ shebang（尽管如下例所示，它不会引起任何问题）。\n\n```\n# table.txt\nbrown bread mat 42 blue cake\
  \ shirt-7\n\n$ bash table.txt\nbrown bread mat 42 blue cake shirt-7\n```\n\n![info](img/file2.svg)\
  \ `.sh` 通常用作 Shell 脚本的扩展名。*不使用*扩展名也是常见的，特别是对于可执行脚本。\n\n## source 脚本（加载）\n\n执行脚本的另一种方法是使用\
  \ `source`（或 `.`）内置命令对其 *source*。与之前的方法的主要区别是脚本是在当前 shell 环境中执行，而不是在子 shell 中。常见的用例是\
  \ source `~/.bashrc` 以及如果函数保存在单独文件中的话。\n\n这是一个示例：\n\n```bash\n# prev_cmd.sh\nprev=$(fc\
  \ -ln -2 | sed 's/^\\s*//; q')\necho \"$prev\"\n\n# 这里的 'echo' 只是为了说明目的示例命令\n\n\
  $ echo 'hello'\nhello\n\n# 正确 source 脚本可以之前的命令\n$ source prev_cmd.sh\necho 'hello'\n\
  hello\n\n# 在子 shell 中执行脚本时没有输出\n$ bash prev_cmd.sh\n```\n\n## 注释\n\n单行注释可以插入在 `#`\
  \ 字符之后，可以在行首也可以在指令之后。\n\n\n\n\n\n```bash\n$ cat comments.sh\n# this is a comment\
  \ on its own line\necho 'hello' # and this is a comment after a command\n\n$ bash\
  \ comments.sh\nhello\n```\n\n> ![info](img/file2.svg) 请参考这个 [unix.stackexchange\
  \ thread](https://unix.stackexchange.com/q/37411/109046) 来模拟多行注释。\n\n## 变量\n\n这是一个赋值变量并访问其值的基础示例：\n\
  \n```bash\n$ name='learnbyexample'\n\n$ echo \"$name\"\nlearnbyexample\n```\n\n\
  如上所示，访问存储在变量中的值时，你需要使用 `$` 前缀。你可以使用 `${variable}` 语法来区分 `variable` 和字符串的其他部分。除非有必要，否则建议使用适当的引号。\n\
  \n你可以通过 `+=` 运算符向变量追加内容。这是一个示例：\n\n```bash\n$ colors='blue'\n$ echo \"$colors\"\n\
  blue\n\n$ colors+=' green'\n$ echo \"$colors\"\nblue green\n```\n\n你可以使用 `declare`\
  \ 内置命令为变量添加属性。例如，`-i` 选项用于将变量视为整数，`-r` 选项用于只读等。这些属性可以改变变量对 `=` 和 `+=` 等运算符的行为。更多细节请参阅\
  \ [bash manual: Shell-Parameters](https://www.gnu.org/software/bash/manual/bash.html#Shell-Parameters)\
  \ 和 [bash manual: declare](https://www.gnu.org/software/bash/manual/bash.html#index-declare)。\n\
  \n```bash\n$ declare -i num=5\n$ echo \"$num\"\n5\n$ num+=42\n$ echo \"$num\"\n\
  47\n\n$ declare -r color='brown'\n$ echo \"$color\"\nbrown\n$ color+=' green'\n\
  bash: color: readonly variable\n```\n\n> ![info](img/file0.svg) ![warning](img/file1.svg)\
  \ 变量赋值是最常见的错误来源之一。与大多数编程语言不同，`=` 号周围不允许有空格。因为空格是 shell 的元字符。另一个常见问题是在值周围使用（或不使用）引号。以下是一些示例：\n\
  \n```bash\n$ num = 42\nnum: command not found\n$ greeting=hello world\nworld: command\
  \ not found\n$ greeting='hello world'\n$ echo \"$greeting\"\nhello world\n\n$ dir_path=~/reports\n\
  $ echo \"$dir_path\"\n/home/byexample/reports\n$ dir_path='~/reports'\n$ echo \"\
  $dir_path\"\n~/reports\n```\n\n## 数组\n\n来自 [bash manual: Arrays](https://www.gnu.org/software/bash)：Bash\
  \ 提供了一维索引数组和关联数组变量。任何变量都可以用作索引数组；`declare` 内置命令会显式声明一个数组。数组的大小没有上限，也不要求成员必须是连续的。索引数组使用整数引用，且从\
  \ 0 开始；关联数组使用字符串。以下是赋值索引数组以及访问元素的各种方法的示例：\n\n```bash\n$ fruits=('apple' 'fig' 'mango')\n\
  $ echo \"${fruits[0]}\"\napple\n$ echo \"${fruits[-1]}\"\nmango\n$ echo \"${fruits[@]}\"\
  \napple fig mango\n$ printf '%s\\n' \"${fruits[@]}\"\napple\nfig\nmango\n```\n\n\
  ## 参数扩展\n\nBash 提供了几种实用方法来提取和修改参数及变量（包括数组）的内容。本节将讨论这些中的一些功能。\n\n### 1) 使用 `${parameter:offset}`\
  \ 语法进行子字符串提取，从给定索引获取所有字符：\n\n```bash\n$ city='Lucknow'\n# 从索引 4 开始的所有字符\n# 索引从 0\
  \ 开始\n$ echo \"${city:4}\"\nnow\n# 最后两个字符\n# 负号前的空格是强制的，\n# 因为 ${parameter:-word}\
  \ 是另一个功能\n$ echo \"${city: -2}\"\now\n```\n\n当应用于数组时，子字符串提取将给你这些元素：\n\n```bash\n\
  $ fruits=('apple' 'fig' 'mango')\n# 从索引 1 开始的所有元素\n$ echo \"${fruits[@]:1}\"\nfig\
  \ mango\n```\n\n### 2) 使用 `${parameter:offset:length}` 语法进行子字符串提取，从给定索引获取指定数量的字符：\n\
  \n```bash\n$ city='Lucknow'\n# 从索引 0 开始的 4 个字符\n# 也可以使用: echo \"${city::4}\"\n$\
  \ echo \"${city:0:4}\"\nLuck\n\n# 从索引 -4（倒数第 4 个字符）开始的 2 个字符\n$ echo \"${city: -4:2}\"\
  \nkn\n\n# 除最后 2 个字符\n$ echo \"${city::-2}\"\nLuckn\n```\n\n### 3) `${#parameter}`\
  \ 将给出字符串的长度，`${#array[@]}` 将给出数组中的元素数量：\n\n```bash\n$ city='Lucknow'\n$ echo \"\
  ${#city}\"\n7\n$ fruits=('apple' 'fig' 'mango')\n$ echo \"${#fruits[@]}\"\n3\n```\n\
  \n### 4) `${parameter#glob}` 将从字符串开头删除最短匹配项。如果通过 `shopt` 启用了扩展通配符，也可以使用。`${parameter##glob}`\
  \ 将从字符串开头删除最长匹配项。以下是一些示例：\n\n```bash\n$ s='this is his life history\n# 删除最短匹配项\n\
  $ echo \"${s#*is}\"\nis his life history\n# 删除最长匹配项\n$ echo \"${s##*is}\"\ntory\n\
  \n# 假设已启用 extglob\n$ echo \"${s#+([^ ])}\"\nis his life history\n$ echo \"${s##+([^\
  \ ])}\"\nlife history\n\n# 对于数组，处理应用于每个元素\n$ fruits=('apple' 'fig' 'mango')\n$ echo\
  \ \"${fruits[@]#*[aeiou]}\"\npple g ngo\n```\n\n### 5) 你可以使用 `${parameter%glob}`\
  \ 从字符串结尾删除最短匹配项。`${parameter%%glob}` 将从字符串结尾删除最长匹配项。以下是一些示例：\n\n```bash\n$ s='this\
  \ is his life history\n$ echo \"${s%is*}\"\nthis is his life h\n$ echo \"${s%%is*}\"\
  \nth\n\n$ fruits=('apple' 'fig' 'mango')\n$ echo \"${fruits[@]%[aeiou]*}\"\nappl\
  \ f mang\n```\n\n### 6) `${parameter/glob/string}` 将第一个匹配项替换为指定的字符串，`${parameter//glob/string}`\
  \ 将替换所有匹配项。当你想要删除匹配项时，可以省略 `/string` 部分。`glob` 将匹配最长部分，类似于正则表达式中的贪婪行为。\n\n\n\n\n\
  \n```\nip='this is a sample string'\n# 将第一个出现的 'is' 替换为 '123'\necho \"${ip/is/123}\"\
  \nth123 is a sample string\n# 将所有的 'is' 替换为 '123'\necho \"${ip//is/123}\"\nth123\
  \ 123 a sample string\n# 将所有的 'am' 或 'in' 替换为 '-'\necho \"${ip//@(am|in)/-}\"\n\
  this is a s-ple str-g\n\n# 匹配输入中从第一个 'is' 到最后一个 's' 的内容\necho \"${ip/is*s/ X }\"\
  \nth X tring\n\n# 删除第一个出现的 's'\necho \"${ip/s}\"\nthi is a sample string\n# 删除所有的\
  \ 's'\necho \"${ip//s}\"\nthi i a ample tring\n```\n\n7) 你可以使用 `${parameter/#glob/string}`\
  \ 仅匹配字符串的开头，使用 `${parameter/%glob/string}` 仅匹配字符串的末尾。\n\n```\nip='spare'\n# 只从字符串开头删除\n\
  echo \"${ip/#sp}\"\nare\necho \"${ip/#par}\"\nspare\n# 替换字符串的示例\necho \"${ip/#sp/fl}\"\
  \nflare\n# 只从字符串末尾删除\necho \"${ip/%re}\"\nspa\necho \"${ip/%par}\"\nspare\n```\n\
  \n8) 如果被 glob 匹配，`${parameter^glob}` 可以仅将第一个字符转换为大写。`${parameter^^glob}` 会将所有匹配的字符转换为大写（输入字符串中的任何位置）。你应该提供一个长度仅为一个字符的\
  \ glob。如果省略了 glob，则将匹配整个参数。这些规则也适用于稍后讨论的小写和大小写转换版本。\n\n```\nfruit='apple'\n# 将第一个字母转换为大写\n\
  echo \"${fruit^}\"\nApple\necho \"${fruit^^}\"\nAPPLE\n# 第一个字符不匹配 'g-z' 范围，因此不更改\n\
  echo \"${fruit^[g-z]}\"\napple\n# 将 'g-z' 范围内的所有字母转换为大写\necho \"${fruit^^[g-z]}\"\
  \naPPLe\n# 将 'a-e' 或 'j-m' 范围内的所有字母转换为大写\necho \"${fruit^^[a-ej-m]}\"\nAppLE\n#\
  \ 这不起作用，因为 'sky-' 不是一个单个字符\ncolor='sky-rose'\necho \"${color^^*-}\"\nsky-rose\n\
  ```\n\n9) 要将字符转换为小写，使用如下所示的 `,` 和 `,,`：\n\n```\nfruit='APPLE'\necho \"${fruit,}\"\
  \nPPLE\necho \"${fruit,,}\"\napple\necho \"${fruit,,[G-Z]}\"\n```\n\n10) 要切换字符大小写，使用如下所示的\
  \ `~` 和 `~~`。注意，这似乎已经过时，因为 `bash` 手册中不再提到它。\n\n```\nfruit='aPPle'\n# 仅切换第一个字符的大小写\n\
  echo \"${fruit~}\"\nAPPle\n# 切换所有字符的大小写\necho \"${fruit~~}\"\nAppLE\n# 切换匹配给定集合的字符的大小写\n\
  echo \"${fruit~~[g-zZ]}\"\nappLe\n```\n\n> 请参见 [bash 手册：参数扩展](https://www.gnu.org/software/bash/manual/bash.html#Shell-Expansion)\
  \ 了解更多细节和其他类型的扩展。\n\n## 命令行参数\n\n传递给脚本（或函数）的命令行参数保存在 `1`、`2`、`3` 等位置参数中。`0` 包含 shell\
  \ 或脚本的名字。`@` 包含从 `1` 开始的所有位置参数。使用 `#` 获取位置参数的数量。与变量类似，需要使用 `$` 前缀来获取存储在这些参数中的值。如果参数编号超过一位，则必须将其括在\
  \ `{}` 中（例如使用 `${12}` 获取第 12 个参数的值）。这里是一个接受两个参数的示例脚本：\n\n```\ncat command_line_arguments.sh\n\
  echo \"No. of lines in '$1' is $(wc -l < \"$1\")\"\necho \"No. of lines in '$2'\
  \ is $(wc -l < \"$2\")\"\nseq 12 > 'test.txt'\nbash command_line_arguments.sh hello.sh\
  \ test.txt \n```\nNo. of lines in 'hello.sh' is 5\nNo. of lines in 'test.txt' is\
  \ 12\n```\n\n**进阶阅读**\n\n- [unix.stackexchange: shell 脚本处理空格或其他特殊字符卡死](https://unix.stackexchange.com/q/131766/109046)\n\
  - [bash 手册：特殊参数](https://www.gnu.org/software/bash/manual/bash.html#Special-Parameters)\n\
  \n## 条件表达式\n\n你可以在 `[[` 和 `]]` 内部测试条件，以获得成功（0）或失败（1 或更高）的退出状态并据此采取行动。Bash 提供了你可以使用的多个选项和运算符。为了使命令生效，`[[`\
  \ 之后和 `]]` 之前需要空格。\n\n> 本节将使用运算符 `;`、`&&` 和 `||` 以使示例更简洁。`if-else` 和其他控制结构将在稍后讨论。\n\
  \n### 选项\n\n`-e` 选项检查指定的路径参数是否存在。添加 `!` 前缀可以反转条件。\n\n```\n# 本节切换到 'example_files/shell_scripting'\
  \ 目录\n[[ -e hello.sh ]] && echo 'found' || echo 'not found'\nfound\n[[ -e xyz.txt\
  \ ]] && echo 'found' || echo 'not found'\nnot found\n# 退出状态\n[[ -e hello.sh ]] ;\
  \ echo $?\n0\n[[ -e xyz.txt ]] ; echo $?\n1\n[[ ! -e xyz.txt ]] ; echo $?\n0\n```\n\
  \n你可以使用 `-d` 和 `-f` 分别检查路径为有效的目录和文件。`-s` 选项检查文件是否存在且大小大于零。`-x` 选项检查文件是否存在并可执行。参见\
  \ test 和 [bash 手册：条件表达式](https://www.gnu.org/software/bash/manual/bash.html#Bash-Conditional-Expressions)\
  \ 获取完整的列表。\n\n### 字符串比较\n\n* `s1 = s2` 或 `s1 == s2` 检查两个字符串是否相等\n    * `s2` 的未引号部分在测试\
  \ `s1` 时会被视为通配符\n    * `extglob` 在此类比较中会被启用\n\n* `s1 != s2` 检查字符串是否不相等\n\n    *\
  \ `s2` 的未引号部分在测试 `s1` 时会被视为通配符\n    * `extglob` 在此类比较中会被启用\n\n* `s1 < s2` 检查 `s1`\
  \ 在字典序上是否在 `s2` \n\n* `s1 > s2` 检查 `s1` 在字典序上是否在 `s2` \n\n* `s1 =~ s2` 检查 `s1` 是否匹配由\
  \ `s2` 提供的 POSIX 扩展正则表达式\n    * 如果 `s2` 不是有效的正则，退出状态将为 `2`\n\n以下是相等和不相等比较的一些示例：\n\
  \n\n\n\n\n```bash\n[](#cb463-1)$ fruit='apple'\n[](#cb463-2)$ [[ $fruit == 'apple'\
  \ ]] && echo 'true' || echo 'false'\n[](#cb463-3)true\n[](#cb463-4)$ [[ $fruit ==\
  \ 'banana' ]] && echo 'true' || echo 'false'\n[](#cb463-5)false\n[](#cb463-6)\n\
  [](#cb463-7)# glob should be constructed to match the entire string\n[](#cb463-8)$\
  \ [[ hello == h* ]] && echo 'true' || echo 'false'\n[](#cb463-9)true\n[](#cb463-10)#\
  \ don't quote the glob!\n[](#cb463-11)$ [[ hello == 'h*' ]] && echo 'true' || echo\
  \ 'false'\n[](#cb463-12)false\n[](#cb463-13)\n[](#cb463-14)# another example to\
  \ emphasize that the glob should match the entire string\n[](#cb463-15)$ [[ hello\
  \ == e*o ]] && echo 'true' || echo 'false'\n[](#cb463-16)false\n[](#cb463-17)$ [[\
  \ hello == *e* ]] && echo 'true' || echo 'false'\n[](#cb463-18)true\n[](#cb463-19)\n\
  [](#cb463-20)$ [[ hello != *a* ]] && echo 'true' || echo 'false'\n[](#cb463-21)true\n\
  [](#cb463-22)$ [[ hello != *e* ]] && echo 'true' || echo 'false'\n[](#cb463-23)false\n\
  ```\n\n以下是一些“大于”和“小于”比较的示例：\n\n```bash\n[](#cb464-1)$ [[ apple < banana ]] && echo\
  \ 'true' || echo 'false'\n[](#cb464-2)true\n[](#cb464-3)$ [[ par < part ]] && echo\
  \ 'true' || echo 'false'\n[](#cb464-4)true\n[](#cb464-5)\n[](#cb464-6)$ [[ mango\
  \ > banana ]] && echo 'true' || echo 'false'\n[](#cb464-7)true\n[](#cb464-8)$ [[\
  \ sun > moon && fig < papaya ]] && echo 'true' || echo 'false'\n[](#cb464-9)true\n\
  [](#cb464-10)\n[](#cb464-11)# 不要用此来比较数字！\n[](#cb464-12)$ [[ 20 > 3 ]] && echo 'true'\
  \ || echo 'false'\n[](#cb464-13)false\n[](#cb464-14)# -gt 等其他运算符将在稍后讨论\n[](#cb464-15)$\
  \ [[ 20 -gt 3 ]] && echo 'true' || echo 'false'\n[](#cb464-16)true\n```\n\n以下是一些正则表达式比较的示例。你可以使用特殊数组\
  \ `BASH_REMATCH` 来获取匹配到的字符串的特定部分。索引 `0` 提供整个匹配部分，索引 `1` 提供第一个捕获组匹配的部分，以此此类推。\n\n\
  ```bash\n[](#cb465-1)$ fruit='apple'\n[](#cb465-2)$ [[ $fruit =~ ^a ]] && echo 'true'\
  \ || echo 'false'\n[](#cb465-3)true\n[](#cb465-4)$ [[ $fruit =~ ^b ]] && echo 'true'\
  \ || echo 'false'\n[](#cb465-5)false\n[](#cb465-6)\n[](#cb465-7)# 整个匹配部分\n[](#cb465-8)$\
  \ [[ $fruit =~ a.. ]] && echo \"${BASH_REMATCH[0]}\"\n[](#cb465-9)app\n[](#cb465-10)#\
  \ 第一个捕获组匹配的部分\n[](#cb465-11)$ [[ $fruit =~ a(..) ]] && echo \"${BASH_REMATCH[1]}\"\
  \n[](#cb465-12)pp\n```\n\n### 数值比较\n\n- `n1 -eq n2` 检查两个数字是否相等\n- `n1 -ne n2` 检查两个数字是否*不*相等\n\
  - `n1 -gt n2` 检查 `n1` 是否大于 `n2`\n- `n1 -ge n2` 检查 `n1` 是否大于等于 `n2`\n- `n1 -lt n2`\
  \ 检查 `n1` 是否小于 `n2`\n- `n1 -le n2` 检查 `n1` 是否小于或等于 `n2`\n\n这些运算符仅支持整数比较。\n\n```bash\n\
  [](#cb466-1)$ [[ 20 -gt 3 ]] && echo 'true' || echo 'false'\n[](#cb466-2)true\n\
  [](#cb466-3)\n[](#cb466-4)$ n1='42'\n[](#cb466-5)$ n2='25'\n[](#cb466-6)$ [[ $n1\
  \ -gt 30 && $n2 -lt 12 ]] && echo 'true' || echo 'false'\n[](#cb466-7)false\n```\n\
  \n数值算术和比较也可以在 `((` 和 `))` 复合命令中执行。这里是一些示例比较：\n\n```bash\n[](#cb467-1)$ (( 20 > 3\
  \ )) && echo 'true' || echo 'false'\n[](#cb467-2)\n[](#cb467-3)$ n1='42'\n[](#cb467-4)$\
  \ n2='25'\n[](#cb467-5)$ (( n1 > 30 && n2 < 12 )) && echo 'true' || echo 'false'\n\
  [](#cb467-6)false\n```\n\n> ![info](img/file2.svg) 注意在上面的示例中，变量*没有*使用 `$` 前缀。更多信息请参阅\
  \ [bash 手册：Shell 算术](https://www.gnu.org/software/bash/manual/bash.html#Shell-Arithmetic)。\n\
  \n## 交互式接受用户输入\n\n你可以使用 `read` 内置命令交互式地接受用户输入。如果为 `read` 命令提供了多个变量作为参数，默认值将根据空格分隔进行赋值。任何遗留值将分配给最后一个变量。以下是一些示例：\n\
  \n```bash\n[](#cb468-1)# 在 'read' 命令后按 'Enter'\n[](#cb468-2)# 并且在完成输入后也按回车键\n[](#cb468-3)$\
  \ read color\n[](#cb468-4)light green\n[](#cb468-5)$ echo \"$color\"\n[](#cb468-6)light\
  \ green\n[](#cb468-7)\n[](#cb468-8)# 多个变量示例\n[](#cb468-9)$ read fruit qty\n[](#cb468-10)apple\
  \ 10\n[](#cb468-11)$ echo \"${fruit}: ${qty}\"\n[](#cb468-12)apple: 10\n```\n\n\
  `-p` 选项帮助你添加用户提示。这里有一个获取两个参数的示例：\n\n```bash\n[](#cb469-1)$ cat user_input.sh\n[](#cb469-2)read\
  \ -p 'Enter two integers separated by spaces: ' num1 num2\n[](#cb469-3)sum=$(( num1\
  \ + num2 ))\n[](#cb469-4)echo \"$num1 + $num2 = $sum\"\n[](#cb469-5)\n[](#cb469-6)-2\
  \ 42\n[](#cb469-7)40\n```\n\n> ![info](img/file2.svg) 你可以使用 `-a` 选项分配数组，使用 `-d`\
  \ 选项指定自定义分隔符代替换行符结束输入等。参见 `help read` 和 [bash 手册：内置命令](https://www.gnu.org/software/bash/manual/bash.html#Builtins)\n\
  \n## if then\n\n构建 `if` 结构需要的关键字有 `if`、`then`、`else`、`elif` 和 `fi`。你可以使用 `[[` 或\
  \ `((` 作为条件。\n\n### if else\n\n构建 `if` 结构需要的关键字有 `if`、`then`、`else`、`elif` 和 `fi`。你可以使用\
  \ `[[` 或 `((` 作为条件。\n\n### if then\n\n构建 `if` 结构需要的关键字有 `if`、`then`、`else`、`elif`\
  \ 和 `fi`。你可以使用 `[[` 或 `((` 作为条件。\n\n有时你只需要知道预期操作是否成功，然后根据结果采取行动。在这种情况下，你可以直接在 `if`\
  \ 关键字后面提供命令。注意，除非重定向，否则 `stdout` 和 `stderr` 将都是活跃的。\n\n- `stderr` 用于重定向 `stderr`。例如，`grep`\
  \ 命令支持 `-q` 选项来抑制 `stdout`。这里有一个使用该功能的脚本：\n\n```bash\n...\n```\n\n## for loop\n\n\
  构建 `for` 循环需要 `for`、`do` 和 `done` 关键字。以下是一些示例：\n\n```bash\n...\n```\n\n\n\n\n\n\
  如上面的示例所示，`in` 关键字之后提供的空格分隔的参数会在每次迭代中自动赋值给 `for` 关键字之后的变量。\n\n这里是上一个示例的修改版本，它可以接受用户提供的命令行参数：\n\
  \n```\n[](#cb475-1)$ cat for_loop.sh\n[](#cb475-2)for file in \"$@\"; do \n[](#cb475-3)\
  \    echo mv \"$file\" \"$file.bkp\"\n[](#cb475-4)done\n[](#cb475-5)\n[](#cb475-6)$\
  \ bash for_loop.sh [gh]*.sh\n[](#cb475-7)mv greeting.sh greeting.sh.bkp\n[](#cb475-8)mv\
  \ hello.sh hello.sh.bkp\n[](#cb475-9)\n[](#cb475-10)$ bash for_loop.sh report.log\
  \ ip.txt fruits.txt\n[](#cb475-11)mv report.log report.log.bkp\n[](#cb475-12)mv\
  \ ip.txt ip.txt.bkp\n[](#cb475-13)mv fruits.txt fruits.txt.bkp\n```\n\n这里是一个遍历数组的示例：\n\
  \n```\n[](#cb476-1)$ files=('report.log' 'pass_list.txt')\n[](#cb476-2)$ for f in\
  \ \"${files[@]}\"; do echo \"$f\"; done\n[](#cb476-3)report.log\n[](#cb476-4)pass_list.txt\n\
  ```\n\n> ![info](img/file2.svg) 你可以使用 `continue` 和 `break` 根据特定条件来改变循环流。详情请参阅 [bash\
  \ 手册: Bourne Shell 内内置](https://www.gnu.org/software/bash/manual/bash.html#Bourne-Shell-Builtins)。\n\
  \n> ![info](img/file0.svg) `for file;` 等同于 `for file in \"$@\";`，因为 `in \"$@\"`\
  \ 是默认值。我建议使用显式版本。\n\n## while 循环\n\n这是一个简单的 `while` 循环结构。你将在本章后面看到一个更实用的示例。\n\n\
  ```\n[](#cb477-1)$ cat while_loop.sh\n[](#cb477-2)i=\"$1\"\n[](#cb477-3)while ((\
  \ i > 0 )) ; do\n[](#cb477-4)    echo \"$i\"\n[](#cb477-5)    (( i-- ))\n[](#cb477-6)done\n\
  [](#cb477-8)$ bash while_loop.sh 3\n[](#cb477-9)3\n[](#cb477-10)2\n[](#cb477-11)1\n\
  ```\n\n## 读取文件\n\n`while` 循环结合 `read` 内置命令可以帮助处理文件内容。这是一个逐行读取输入内容的示例：\n\n```\n[](#cb478-1)$\
  \ cat read_file_lines.sh\n[](#cb478-2)while IFS= read -r line; do\n[](#cb478-3)\
  \    # 对每一行进行某些操作\n[](#cb478-4)    wc -l \"$line\"\n[](#cb478-5)done < \"$1\"\n\
  [](#cb478-7)$ printf 'hello.sh\\ngreeting.sh\\n' > files.txt\n[](#cb478-8)$ bash\
  \ read_file_lines.sh files.txt\n[](#cb478-9)5 hello.sh\n[](#cb478-10)2 greeting.sh\n\
  ```\n\n上述脚本的意图是字面处理每行输入。因此，将特殊变量 `IFS`（输入字段分隔符）设置为空字符串以防止去除开头和的空格。`read` 内置命令的 `-r`\
  \ 选项允许输入中的 `\\` 被视为字面量。注意，输入文件名作为第一个命令行参数接收，并重定向为 `stdin` 输入到 `while` 循环。你还需要确保输入的最后一行以换行符结束，否则最后一行将不会被处理。\n\
  \n你可以更改 `IFS` 将输入行分成不同的字段，并为 `read` 内置命令指定相应数量的变量。这是一个示例：\n\n```\n[](#cb479-1)$\
  \ cat read_file_fields.sh\n[](#cb479-2)while IFS=' : ' read -r field1 field2; do\n\
  [](#cb479-3)    echo \"$field2,$field1\"\n[](#cb479-4)done < \"$1\"\n[](#cb479-6)$\
  \ bash read_file_fields.sh <(printf 'apple : 3\\nfig : 100\\n')\n[](#cb479-7)3,apple\n\
  [](#cb479-8)100,fig\n```\n\n你可以给 `read` 内置命令的 `-n` 选项传递一个数字，以便每次处理相应数量的字符。示例：\n\n\
  ```\n[](#cb480-1)$ while read -r -n2 ip; do echo \"$ip\"; done <<< '\\word'\n[](#cb480-2)\\\
  w\n[](#cb480-3)or\n[](#cb480-4)d\n```\n\n> ![info](img/file0.svg) `xargs` 命令也可以用于上述讨论的一些情况。示例请参阅\
  \ [unix.stackexchange: 将文本文件的每行作为命令行参数解析](https://unix.stackexchange.com/q/149726/109046)。\n\
  \n## 函数\n\n来自 [bash 手册: Shell Functions](https://www.gnu.org/software/bash/manual/bash.html#Shell-Functions)：\n\
  \n> Shell 函数是将命令分组以便稍后执行的方法，使用单个名称来表示该组。它们的执行方式与“普通”命令无异。当 Shell 函数名被用简单命令名使用时，与该函数名关联的命令列表将被执行。Shell\
  \ 函数在当前 shell 上下文中执行；不会创建新进程来解释它们。\n\n你可以使用以下任意一种语法来声明函数：\n\n```\n[](#cb481-1)fname\
  \ ()\n```\n```\n[](#cb481-2)function fname\n```\n\n函数的参数传递方式与 shell 脚本的相同。这里有一个示例：\n\
  \n```\n[](#cb482-1)$ cat functions.sh\n[](#cb482-2)fname () {\n[](#cb482-3)    size=10\n\
  [](#cb482-4)    color='grey'\n[](#cb482-5)    if (( $# == 1 )); then\n[](#cb482-6)\
  \        size=\"$1\"\n[](#cb482-7)    elif (( $# == 2 )); then\n[](#cb482-8)   \
  \     if [[ $1 =~ ⁰-9]+ ]]; then\n[](#cb482-9)            size=\"$1\"\n[](#cb482-10)\
  \        else\n[](#cb482-11)            color=\"$1\"\n[](#cb482-12)        fi\n\
  [](#cb482-13)    else\n[](#cb482-14)        size=\"$1\"\n[](#cb482-15)        color=\"\
  $2\"\n[](#cb482-16)    fi\n[](#cb482-17)    op=\"${ip%.*}\"\n[](#cb482-18)    echo\
  \ convert -border \"$size\" -border \"$color\" \"$op\"\n[](#cb482-19)}\n```\n\n\
  在上述示例中，`echo` 用于显示将要执行的命令。如果你想让脚本实际创建图像，请删除 `echo`。函数接受一到三个参数，并在未传递时使用默认值。\n\n```\n\
  [](#cb483-1)$ bash functions.sh\n[](#cb483-2)convert -border 10 -grey flower.png\n\
  [](#cb483-3)convert -border 5 -grey insect.png\n[](#cb483-4)convert -border 10 -red\
  \ lake.png\n[](#cb483-5)convert -border 20 -blue sky.png\n```\n\n> ![info](img/file2.svg)\
  \ 如果你想修改输入图像而不是创建新图像，可以使用 `mogrify` 代替 `convert`。这些图像处理命令是 [ImageMagick](https://imagemagick.org/)\
  \ 软件包的一部分。shell 脚本和用户定义的函数（反可能调用自身或另一个函数）都可以拥有位置参数。在这种情况下，shell 在函数完成任务后会将位置参数恢复之前的状态。\n\
  \n函数也有退出状态，默认基于最后一个执行的命令。你可以使用 `return` 内置命令提供你自定义的退出状态。\n\n## 调试\n\n你可以使用以下 `bash`\
  \ 选项进行调试：\n\n- `-x` 打印执行的命令及其参数\n- `-v` 详细模式，打印读取的 shell 输入行\n\n这里有一个使用 `bash -x`\
  \ 选项的示例\n\n```\n[](#cb484-1)$ bash -x search.sh\n[](#cb484-2)+ read -p 'Enter a\
  \ search pattern: ' search\n[](#cb484-3)Enter a search pattern: xyz\n[](#cb484-4)+\
  \ grep -q xyz hello.sh\n[](#cb484-5)+ echo 'match not found'\n[](#cb484-6)match\
  \ not found\n```\n\n\n\n\n\n```bash\n$ bash -xv search.sh\nread -p 'Enter a search\
  \ pattern: ' search\n+ read -p 'Enter a search pattern: ' search\nEnter a search\
  \ pattern: xyz\n\nif grep -q \"$search\" hello.sh ; then\n    echo \"match found\"\
  \nelse\n    echo \"match not found\"\nfi\n+ grep -q xyz hello.sh\n+ echo 'match\
  \ not found'\nmatch not found\n```\n\n> ![info](img/file2.svg) 你也可以在脚本内部使用 `set\
  \ -x` 或 `set -v` 或 `set -xv` 来从某个特定点开始调试。你可以使用 `+` 代替 `-` 作为选项前缀来关闭此类调试（例如 `set\
  \ +x`）。\n\n## shellcheck\n\n[shellcheck](https://www.shellcheck.net/) 是一个静态分析工具，可以为脚本提供警告和建议。你可以在在线使用它，也可以安装该工具离线使用。考虑到\
  \ `bash` 的各种陷阱，强烈建议初学者和高级用户使用此工具。\n\n考虑以下脚本：\n\n```bash\n$ cat bad_script.sh\n#!/bin/bash\n\
  \ngreeting = 'hello world'\necho \"$greeting\"\n```\n\n这里是 `shellcheck` 报告问题的方式：\n\
  \n```bash\n$ shellcheck bad_script.sh\n\nIn bad_script.sh line 3:\ngreeting = 'hello\
  \ world'\n         ^-- SC1068: 赋值时等号周围不要留空格\n                     (或使用引号使其成为字面量)。\n\
  \n更多信息请访问：\n  https://www.shellcheck.net/wiki/SC1068 -- Don't put spaces around\
  \ the = in ...\n```\n\n> ![info](img/file2.svg) 如果脚本没有 shebang，你可以使用 `-s` 选项（例如\
  \ `shellcheck -s bash`）来指定 shell 应用程序。\n\n> ![info](img/file2.svg) ![warning](img/file1.svg)\
  \ 请注意，`shellcheck` 不会捕获所有类型的问题。在不理解其在给定语境下合理的情况下，不应盲目接受建议。\n\n## 资源列表\n\n这里是一些更多的学习资源：\n\
