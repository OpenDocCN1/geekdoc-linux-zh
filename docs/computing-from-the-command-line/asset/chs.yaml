- "# 命令行计算指南\n\n\n\n\n2. 目录\n\n# 前言\n\n本书旨在为初级到中用户教授 Linux 命令行工具和 Shell 脚本编写。重点在于管理文件和执行文本处理任务。书中不会讨论系统管理和网络等主题，但某些细节可能会在未来的版本中涵盖。\n\
  \n## 先提条件\n\n你应该熟悉基础电脑操作，了解文件和目录等基本术语，以及如何安装程序等。此外，你应该已经熟悉编程基础知识，如变量、循环和函数。\n\n\
  在软件方面，你应该能够访问 `GNU bash` shell 和常用的 Linux 命令行工具。这可以是某个 Linux 发行版的一部分，也可以通过其他方式（如虚拟机、`WSL`（Windows\
  \ 的 Linux 子系统）等）实现。关于工作环境的更多细节将在介绍章节中讨论。\n\n你还应该习惯于阅读手册、进行在线搜索、访问提供的进一步阅读的外部链接、研究插图示例、在遇到困难时寻求帮助等。换句话之，要保持积极和好奇心，而不是仅仅被动地消费内容。\n\
  \n请查看我关于[Linux CLI 和 Shell 脚本](https://learnbyexample.github.io/curated_resources/linux_cli_scripting.html)的精列表获取更多学习资源。\n\
  \n## 规范\n\n* 所示的代码片段是从 `bash` shell（版本 `5.0.17`）中复制粘贴的，并为了演示目的进行了修改。某些命令前带有注释以提供背景和解释，并添加了空行以提高可读性等。\n\
  \n* 书中提供了外部链接，以便你更深入地探索某些主题。\n\n* [cli-computing 仓库](https://github.com/learnbyexample/cli-computing)包含了书中使用的所有[示例文件和脚本](https://github.com/learnbyexample/cli-computing/tree/master/example_files)。该仓库还包含一个单一文件的[练习题](https://github.com/learnbyexample/cli-computing/blob/master/exercises/exercises.md)，以及一个单独的[答案](https://github.com/learnbyexample/cli-computing/blob/master/exercises/exercise-solutions.md)文件。如果你不熟悉\
  \ `git` 命令，请点击网页上的 `Code` 按钮获取文件。\n\n* 请参阅设置章节，了解如何创建一个用于跟进书中内容的工作环境。\n\n## 致谢\n\
  \n* [GNU 手册](https://www.gnu.org/manual/manual.html) — 命令行工具和 `bash` shell 的文档\n\
  \n* [stackoverflow](https://stackoverflow.com/) 和 [unix.stackexchange](https://unix.stackexchange.com/)\
  \ — 用于获取与 CLI 工具相关问题的答案\n\n* [tex.stackexchange](https://tex.stackexchange.com/)\
  \ — 用于寻求有关 [pandoc](https://github.com/jgm/pandoc/) 和 `tex` 相关问题的帮助\n\n* [/r/commandline/](https://old.reddit.com/r/commandline),\
  \ [/r/linux4noobs/](https://old.reddit.com/r/linux4noobs/), [/r/linuxquestions/](https://old.reddit.com/r/linuxquestions/)\
  \ 以及 [/r/linux/](https://old.reddit.com/r/linux/) — 有用的论坛\n\n* [canva](https://www.canva.com/)\
  \ — 封面图片\n\n* [Warning](https://commons.wikimedia.org/wiki/File:Warning_icon.svg)\
  \ 和 [Info](https://commons.wikimedia.org/wiki/File:Info_icon_002.svg) 图标由 [Amada44](https://commons.wikimedia.org/wiki/User:Amada44)\
  \ 在公有领域提供\n\n* [carbon](https://carbon.now.sh/) — 创建带有高亮文本的终端截图\n\n* [oxipng](https://github.com/shssoichiro/oxipng),\
  \ [pngquant](https://pngquant.org/) 和 [svgcleaner](https://github.com/RazrFalcon/svgcleaner)\
  \ — 优化图像\n\n## 反馈与错\n\n如果你能让我知道你对这本书的感受，我胜感激。这可以是简单的感谢、指出拼写错误、代码片段中的错误、书中的哪些方面对你有帮助（或不帮助）等。读者的反馈至关重要，对于自出版作者来说尤为如此。\n\
  \n* 问题管理器：[`github.com/learnbyexample/cli-computing/issues`](https://github.com/learnbyexample/cli-computing/issues)\n\
  \n* 邮箱：learnbyexample.net@gmail.com\n\n* Twitter：[`twitter.com/learn_byexample`](https://twitter.com/learn_byexample)\n\
  \n## 作者信息\n\nSundeep Agarwal 是一个懒人，倾向于只做足够的工作来维持他平凡的生活。他在 Analog Devices 担任设计工程师期间积累了巨额财富，并在\
  \ 28 岁时就从企业界退休。遗憾的是，他在短短几年内耗光了储蓄，不得不为了生计挣扎。在极其困难的情况下，销售编程电子书拯救了这个懒惰的自己，使其无需重新工作。现在他可以负担得起任何想读的幻想电子书，并花费不健康的时间浏览互联网。\n\
  \n当创作灵感来袭时，你会发现他正在编写另一本编程电子书（通常包含至少一个正则表达式示例）。为他的电子书研究资料以及日常社交媒体的使用几乎淹没了他的书签，因此为了保持理智，他维护了精选资源列表。他感谢免费的学习资源和开源工具。他的个人贡献可以在\
  \ [`github.com/learnbyexample`](https://github.com/learnbyexample) 找到。\n\n**书籍列表:**\
  \ [`learnbyexample.github.io/books/`](https://learnbyexample.github.io/books/)\n\
  \n## 许可协议\n\n本书根据 [知识共享署名-非商业性-相同共享 4.0 国际许可](https://creativecommons.org/licenses/by-nc-sa/4.0/)\
  \ 授权。\n\n代码片段根据 [MIT 许可证](https://github.com/learnbyexample/cli-computing/blob/master/LICENSE)\
  \ 提供。\n\n致谢部分中提到的资源根据原始许可提供。\n\n## 书籍版本\n\n1.0\n\n查看 [Version_changes.md](https://github.com/learnbyexample/cli-computing/blob/master/Version_changes.md)\
  \ 以跟踪版本间的更改。\n\n# 简介与设置\n\n回到 2007 年，我在半导体公司担任设计工程师，在利用软件工具方面起步艰难。Linux 命令行、Vim\
  \ 和 Perl 对我来说都是全新的。除了从同事和主管那里学习命令行工具外，我记得在一本复印的书上阅读并做笔记（现在想不起标题了）。\n\n最大的痛点是不知道实用的选项（例如，`grep\
  \ --color` 高亮匹配部分，`find -exec` 对过滤后的文件应用命令等）以及工具（例如，`xargs` 绕过命令行参数过多的限制）。此外还有像\
  \ `sed` 和 `awk` 这种语法令人生畏的工具。我无法解释为什么我没有经常使用 Shell 脚本。我坚持使用 Perl 和 Vim，而不是学习这些工具。直到\
  \ 2014 年离职后，我才知道像 [stackoverflow](https://stackoverflow.com/) 和 [unix-stackexchange](https://unix.stackexchange.com/)\
  \ 这样的论坛。\n\n当我有机会为大学生举办课程工作会时，我开始整理关于 Linux 命令行工具的知识。2016 年到 2018 年，我开始在 GitHub\
  \ 仓库中维护我的 Linux 命令行、Vim 和脚本语言教程。正如你可能猜到的，随后我开始润色这些材料并将其[作为电子书出版](https://learnbyexample.github.io/books/)。这是一个持续的过程，《从命令行计算》是第十三本电子书。\n\
  \n\n\n\n\n本书旨在向初级到中用户教授 Linux 命令行工具和 Shell 脚本编写。书中提供了大量的示例，以便更好地理解特定工具及其各种功能。书中还提供了外部链接以供进一步阅读。重要的注释和警告经过格式化处理，以便与正文区分开来。\n\
  \n写书对我来说总会有一些意外的惊喜。这次我学习了诸如 `mkdir -m` 和 `chmod =` 等实用的选项，对许多 Shell 特性有了更好的理解等等。我还计划在本书的后续版本学习并介绍更多的命令行工具。\n\
  \n本章将对 Linux 进行简要介绍。你还将看到有关设置命令行环境的建议和指令，以便跟随书中内容的演示。\n\n## Linux 概述\n\n引用自 [维基百科](https://en.wikipedia.org/wiki/Linux)\
  \ 部分内容：\n\n> Linux 是一个基于 Linux 内核的开源 Unix 类操作系统族，该内核是由 Linus Torvalds 于 1991 年 9\
  \ 月 17 日首次发布的操作系统内核。Linux 通常以 Linux 发行版的形式打包。\n\n> Linux 最初是为基于 Intel x86 架构的个人电脑开发的，但此后移植到的平台比任何其他操作系统都多。由于基于\
  \ Linux 的 Android 在智能手机上的主导地位，Linux 也拥有所有通用操作系统中最大的安装量。\n\n> Linux 是自由和开源软件协作最著名的例子之一。任何人都可以根据各自的许可证（如\
  \ GNU 通用公共许可证）以商业或非商业方式使用、修改和分发其源代码。\n\n在在我之前的工作接触过 Linux 之外，我从 2014 年开始一直使用 Linux\
  \ 作为我的桌面系统，它非常适合我的需求。与我的 Windows 相比，Linux 更轻量、安全、稳定、快速，而且重要的是不会强制你升级硬件。阅读上方链接的维基百科文章可以获取关于\
  \ Linux 的更全面介绍，包括它的用途等。\n\n## Linux 发行版\n\n再次引用自 [维基百科](https://en.wikipedia.org/wiki/Linux_distribution)：\n\
  \n> Linux 发行版（通常缩写为 distro）是基于 Linux 内核以及通常一个包管理系统的软件集合形成的操作系统。Linux 用户通常通过下载一个\
  \ Linux 发行版来获取操作系统，这些发行版适用于各种系统，从嵌入式设备（例如 OpenWrt）和个人电脑（例如 Linux Mint）到强大的超级计算机（例如\
  \ Rocks Cluster Distribution）。\n\n我使用 Ubuntu，它对新手非常友好。这里是一些帮助你选择发行版的资源：\n\n*   [/r/linux4noobs\
  \ wiki](https://old.reddit.com/r/linux4noobs/wiki/distro_selection) — 针对新手的选择指南\n\
  *   [Linux 发行版列表](https://en.wikipedia.org/wiki/List_of_Linux_distributions) ——\
  \ 以分类列表形式提供的著名 Linux 发行版概览\n*   [DistroWatch](https://distrowatch.com/) —— 一个专门用于讨论、评审和关注开源操作系统动态的网站。该网站特别关注\
  \ Linux 发行版和 BSD 变体，尽管有时也会讨论其他开源操作系统\n*   [轻量级 Linux 发行版](https://en.wikipedia.org/wiki/Light-weight_Linux_distribution)\
  \ —— 比“功能丰富”的 Linux 发行版占用更少的内存和/或对处理器速度的要求更低\n\n## 访问 Linux 环境\n\n你通常可以在想要安装的相应发行版网站上找到安装说明。或者，你可以在\
  \ [虚拟机](https://en.wikipedia.org/wiki/Virtual_machine)上安装 Linux，或尝试在线使用。这里是一些让你入门的资源：\n\
  \n*   [安装 Ubuntu 桌面](https://ubuntu.com/tutorials/install-ubuntu-desktop)\n*   [如何使用\
  \ VirtualBox 在虚拟机上运行 Ubuntu 桌面](https://ubuntu.com/tutorials/how-to-run-ubuntu-desktop-on-a-virtual-machine-using-virtualbox)\n\
  *   [DistroTest](https://distrotest.net/index.php) — 直接在线测试发行版而无需安装\n\n如果你已经在 Windows\
  \ 或 macOS 上，可以使用以下选项访问 Linux 工具：\n\n*   [Git for Windows](https://git-scm.com/downloads)\
  \ —— 提供一个用于从命令行运行 Git 的 Bash 仿真\n*   [Windows Linux 子系统 (WSL)](https://en.wikipedia.org/wiki/Windows_Subsystem_for_Linux)\
  \ —— 用于在 Windows 上原生运行 Linux 二进制执行文件的兼容层\n*   [brew](https://brew.sh/) —— macOS（或\
  \ Linux）的包管理器\n\n> ![info](img/file0.svg) ![info](img/file0.svg) ![warning](img/file1.svg)\
  \ 如果你是命令行使用的完全新手，我建议设置一个虚拟机。或者也许是一个你可以自由实验的备用电脑。命令行中的错误可能比图形界面更具破坏性。例如，一个简单的空格拼写错误就会导致数据丢失、使你的机器无法使用等。\n\
  \n## 设置\n\n为了跟随书中介绍的内容，你需要从我的 [cli-computing 仓库](https://github.com/learnbyexample/cli-computing)\
  \ 获取文件。一旦你进入了 Linux 环境，请按照下方显示的说明操作。如果下面使用的所有命令对你来说都很陌生，请等你到达 ls 部分（届时你将获得一个返回这些指令的链接）。\n\
  \n要获取文件，可以使用 `git` 命令克隆 cli-computing 仓库，你也可以使用 `git` 命令，或者下载 `zip` 版本。如果你还没有 `git`，在\
  \ Debian 类系统上可能需要 `sudo apt install git`。\n\n```\n# 选项 1: 使用 git\n$ git clone --depth\
  \ 1 https://github.com/learnbyexample/cli-computing\n\n# 选项 2: 下载 zip 文件\n$ wget\
  \ -OL https://github.com/learnbyexample/cli-computing/archive/refs/heads/master.zip\n\
  $ unzip master.zip\n$ mv cli-computing-master cli-computing\n```\n\n一旦有了这些文件，就可以就可以书中介绍的命令。例如，你需要执行\
  \ `ls.sh` 脚本来学习 ls 部分。\n\n```\n$ cd cli-computing/example_files/scripts/\n$ ls\n\
  cp.sh  file.sh  globs.sh  ls.sh  rm.sh    tar.sh\ndu.sh  find.sh  grep.sh  mv.sh\
  \  stat.sh  touch.sh\n$ source ls.sh\n$ ls -F\nbackups/    hello_world.py*  ip.txt\
  \     report.log  todos/\n```\n\n对于像 cat 命令这样的章节，你需要使用 `text_files` 目录中提供的示例输入文件。\n\
  \n```\n$ cd cli-computing/example_files/text_files/\n$ cat greeting.txt \nHi there\n\
  Have a nice day\n```\n\n## 命令行界面\n\n命令行界面（CLI）允许你使用文本命令与计算机交互。例如，`cd` 命令帮助你导航到特定目录。`ls`\
  \ 命令显示目录内容。在图形环境中，你会使用资源管理器（文件管理器）进行导航，并且默认显示目录内容。某些任务可以在 CLI 和 GUI 环境中完成，而某些任务仅在其中一个环境中才适用且有效。\n\
  \n以下是使用 CLI 工具相比 GUI 程序的某些优势：\n\n*   自动化\n*   执行速度更快\n*   命令调用是重复的\n*   易于保存解决方案并与他人分享\n\
  *   与不同 UI/UX 的图形化解决方案相比，环境更单一\n\n\n\n\n\n* 通用的文本界面允许工具之间进行进行通信。\n\n这里还有一些缺点：\n\n\
  * 学习曲线陡峭\n* 语法可能会变得非常复杂\n* 需要熟练使用大量工具\n* 拼写错误往往更具破坏性\n\n你可以利用命令历史、快捷键和自动补全等功能，来帮助处理大量的命令和语法问题。持续的练习将帮助你熟悉命令行环境的特性。具有破坏性潜力的命令通常会包含允许手动确认和交互式使用的选项，从而减少或完全避免拼写错误的影响。\n\
  \n## 章节\n\n以下是剩余章节的列表：\n\n* 命令行概述\n* 管理文件和目录\n* Shell 特性\n* 查看文件部分或全部内容\n* 搜索文件和文件名\n\
  * 文件属性\n* 管理进程\n* 多功能文本处理工具\n* 排序内容\n* 比较文件\n* 各种文本处理工具\n* Shell 脚本\n* Shell 定制\n\
  \n## 资源列表\n\n本书仅涵盖了 Linux 命令行用法的一小部分。系统管理和网络等主题完全没有讨论。查看以下列表以了解此类主题并发现酷的工具：\n\n\
  * [Linux 精选资源](https://learnbyexample.github.io/curated_resources/linux_cli_scripting.html)\
  \ — 我收集 Linux 命令行、Shell 脚本和其他相关资源的集合\n* [Awesome Linux](https://github.com/inputsh/awesome-linux)\
  \ — 让 Linux 变得更酷的优秀项目和资源列表\n* [Arch wiki: 列表](https://wiki.archlinux.org/title/List_of_applications)\
  \ — 按类别排序，可作为寻找软件包人员的参考\n\n# 命令行概述\n\n本章将帮助你迈出进入命令行世界的第一步。除了你可以尝试的命令示例外，你还将学习关于在文本环境中工作的一些基本知识。\n\
  \n对于新手来说，突然转变为仅使用文本命令与计算机交互的范式转变可能会让人无所措，特别是对于习惯了图形用户界面（GUI）的人来说。在使用一段时间后，事情将开始变得系统化，你可能会发现\
  \ GUI 不适合重复性任务。随着持续的使用，回忆各种命令将变得更容易。命令行历史、别名、Tab 补全和快捷键等功能也会有所帮助。\n\n如果你用过科学计算器，你就会知道它在小小的屏幕上挤满了太多的功能和大量的多功能按钮，这是非常方便的。命令行环境也是如此，但不局限于数学。从管理文件到处理数据，从图像处理到处理视频，你可能会为你你所想象的几乎任何计算任务找到工具。始终记住，命令行工具出现的时间远早于图形工具。丰富的历史展示了它以强大的工具和各种应用程序的形式存在的分量。\n\
  \n## 你好命令行\n\n打开一个[终端模拟器](https://en.wikipedia.org/wiki/Terminal_emulator) 并输入如下所示命令。开头的\
  \ `$` 后面跟着一个空格字符是我使用的简单命令提示符。它对你来说可能不同。要输入的实际命令是 `echo` 后跟一个空格，然后是参数 `'Hello Command\
  \ Line'`，最后按 `Enter` 键执行。你应该看到该参数作为命令输出返回给你。\n\n```\n[](#cb4-1)$ echo 'Hello Command\
  \ Line'\n```\n[](#cb4-2)Command Line\n\n这是另一个简单的示例。此时，输入 `pwd` 命令。你应该得到当前位置作为输出。\n\
  \n```\n[](#cb5-1)$pwd\n```\n[](#cb5-2)/home/byexample\n\n接下来，输入 `exit` 命令退出。\n\n\
  ```\n[](#cb6-1)$ exit\n```\n\n如果你是命令行世界的完全新手，请尝试上面的步骤。关于命令结构、自定义命令提示符等更多细节将在后面的章节讨论。\n\
  \n## 文件系统\n\n在 Linux 中，目录结构以 `/` 符号开始，被称为根目录。`man hier` 命令提供了文件系统的描述。这里是一些选定的示例：\n\
  \n* `/` 这是根目录。它是整个树开始的地方。\n* `/bin` 此目录包含单用户模式下所需的执行程序。\n* `/home` 对于拥有用户的机器，通常位于此目录下。\n\
  * `/tmp` 此目录包含临时文件，这些文件可能会在没有通知的情况下被删除，例如系统启动时。\n* `/usr` 此目录通常从单独分区挂载。它应该只包含只读数据，以便在运行\
  \ Linux 的机器之间共享。\n* `/usr/bin` 这是可执行程序的主要目录。大多数用户执行的、不需要引导或修复系统的程序应放在此目录。\n* `/usr/share`\
  \ 此目录包含特定应用程序数据的子目录，可以在不同架构之间共享。\n\n## 绝对路径和相对路径\n\n引用 [wikipedia](https://en.wikipedia.org/wiki/Path_%28computing%29#Absolute_and_relative_paths)：\n\
  \n> 绝对路径或全路径无论当前工作目录如何都指向文件系统中的相同位置。为了做到这一点，它必须包含根目录。\n\n> 相比之下，相对路径从给定的工作目录开始，避免了提供全绝对路径。文件名可以被视为基于工作目录的相对路径。如果工作目录不是文件的父目录，当通过名称访问文件时将导致找不到文件错误。\n\
  \n例如，`/home/learnbyexample` 是绝对路径，而 `../design` 是相对路径。你将在接下来的章节中学习路径如何执行任务。\n\n\
  ## Shell 和终端模拟器\n\n这些术语通常被互换表示同一个意思 —— 允许用户执行命令的提示符。然而，它们不同：\n\n* Shell 是命令行解释器。设置调用命令的语法规则，提供连接命令和重定向数据的操作符，具有循环、函数等脚本功能\n\
  * 终端是文本输入/输出环境。负责字体大小、颜色等视觉细节\n\n\n\n\n\n一些流行的 shell 有 `bash`、`zsh` 和 `fish`。本书将仅讨论\
  \ [Bash](https://en.wikipedia.org/wiki/Bash_(Unix_shell)) 。。一些流行的终端模拟器有 [GNOME Terminal](https://en.wikipedia.org/wiki/GNOME_Terminal)、[konsole](https://en.wikipedia.org/wiki/Konsole)、[xterm](https://en.wikipedia.org/wiki/Xterm)\
  \ 和 [alacritty](https://github.com/alacritty/alacritty)。\n\n引用自 [wikipedia: Unix\
  \ shell](https://en.wikipedia.org/wiki/Unix_shell)：\n\n> Unix shell 是一种命令行解释器或 shell，它为类\
  \ Unix 操作系统提供命令行用户界面。shell 既是一种交互式命令语言，也是一种脚本语言，操作系统通过使用 shell 脚本来控制系统的执行。\n\n>\
  \ 用户通常使用终端模拟器与 Unix shell 交互；然而，对于服务器系统，通过串口硬件连接或安全外壳（SSH）直接操作是常见的。所有的 Unix shell\
  \ 都提供文件名通配符、管道、在此文档（here documents）、命令替换、变量以及用于条件测试和迭代的控制结构。\n\nShell 特将在后续的章节和章节中讨论。现在，打开终端并尝试以下命令：\n\
  \n```\n[](#cb7-1)$ cat /etc/shells\n[](#cb7-2)# /etc/shells: valid login shells\n\
  [](#cb7-3)/bin/sh\n[](#cb7-4)/bin/dash\n[](#cb7-5)/bin/bash\n[](#cb7-6)/bin/rbash\n\
  [](#cb7-7)\n[](#cb7-8)$ echo \"$SHELL\"\n[](#cb7-9)/bin/bash\n```\n\n在上面的示例中，`cat`\
  \ 命令用于显示文件的内容，`echo` 命令用于显示变量的内容。`SHELL` 是一个环境变量，包含 shell 的完整路径。\n\n> ![info](img/file2.svg)\
  \ 上述命令的输出对你来说可能不同。正如前面提到的，你的命令提示符可能与 `$` 不同。现在你可以忽略它。或者，你可以输入 `PS1='$ '` 并按下 `Enter`\
  \ 键来设置当前会话提示符。\n\n## 进阶阅读\n\n* [unix.stackexchange: 'terminal', 'shell', 'tty' 和\
  \ 'console' 之间的确区别是什么？](https://unix.stackexchange.com/q/4126/109046)\n* [wikipedia:\
  \ 命令 shell 比较](https://en.wikipedia.org/wiki/Comparison_of_command_shells)\n* [unix.stackexchange:\
  \ 登录 shell 和非登录 shell 的区别](https://unix.stackexchange.com/q/38175/109046)\n* [各种\
  \ shell 之间的功能和差异](http://www.faqs.org/faqs/unix-faq/shell/shell-differences/)\n\
  * [不同 shell 的语法对比示例](https://hyperpolyglot.org/unix-shells)\n* [Shell 选择 shell 以及更改默认\
  \ shell](https://wiki.ubuntu.com/ChangingShells)\n\n## Unix 哲学\n\n引用自 [wikipedia:\
  \ Unix Philosophy](https://en.wikipedia.org/wiki/Unix_philosophy)：\n\n> * 编写只做一件事并将其良好的程序。\n\
  > * 编写协作工作的程序。\n> * 编写处理文本流的程序，因为那是通用接口。\n\n这些原则并不严格适用于所有命令行工具，但意识到它们是有好处的。当你熟悉从命令行工作后，你将能够更好地理解这些指南。\n\
  \n## 命令结构\n\n不需要完全理解本章中使用的命令，只需要掌握大意。示例旨在帮助你熟悉使用命令选项和参数的基础。\n\n### 不带任何选项或参数的命令调用\n\
  \n* `clear` 清除终端屏幕\n* `date` 显示当前日期和时间\n\n### 带有选项（标志）的命令\n\n* `ls -l` 以长列表格式列出目录内容\n\
  * `ls -la` 以长列表格式列出包括隐藏文件在内的目录内容\n    * 两个短选项 `-l` 和 `-a` 在这里被组合为 `-la`\n* `df -h`\
  \ 以人类可读的格式报告文件系统磁盘空间占用\n* `df --human-readable` 与 `df -h` 相同，但使用长选项而不是短选项\n\n###\
  \ 带有参数的命令\n\n* `mkdir project` 在当前工作目录下创建一个名为 `project` 的目录\n* `man sort` `sort`\
  \ 命令的手帮助页\n* `diff file1.txt file2.txt` 显示两个输入文件之间的差异\n* `wget https://s.ntnu.no/bashguide.pdf`\
  \ 从网络下载文件\n    * 上述示例传递给 `wget` 的链接是真实的，访问 [BashGuide](https://mywiki.wooledge.org/BashGuide)\
  \ 详情\n\n### 同时带有选项和参数的命令\n\n* `rm -r project` 递归删除（删除）`project` 目录\n* `paste -sd,\
  \ ip.txt` 使用 `,` 作为分隔符将输入文件中的所有行序列化为单行\n\n### 单引号对比双引号\n\n* **单引号** 保留引号内每个字符的字面值\n\
  * **双引号** 保留引号内所有字符的字面值，但 `$`、`` ` ` `、`\\` 以及在启用历史扩展时的的 `!` 除外\n\n```\n[](#cb8-1)#\
  \ 单引号内没有字符是特殊字符的\n[](#cb8-2)$ echo '$SHELL'\n[](#cb8-3)$SHELL\n[](#cb8-4)\n[](#cb8-5)#\
  \ $ 在双引号内是特殊的，在此用于插值变量\n[](#cb8-6)$ echo \"Full path to the shell: $SHELL\"\n[](#cb8-7)Full\
  \ path to the shell: /bin/bash\n```\n\n更多细节和其他类型的引号将在 Shell Features 章节中讨论。\n\n\
  ## 命令网络\n\n之前提到的 *Unix Philosophy* 之一提到了命令协作工作。shell 提供了几种实现方法。一个常用的功能是重定向命令的输出——作为另一个命令的输入，保存到文件中等。\n\
  \n* 到另一个命令\n    * `du -sh * | sort -h` 使用 `du` 以人类可读的格式计算文件和文件夹的大小，然后使用专门用于该任务的工具进行排序\n\
  * 到文件\n    * `grep 'pass' *.log > pass_list.txt` 将结果写入文件而不是显示在终端上（如果文件已存在，则会被覆盖）\n\
  \    * `grep 'error' *.log >> errors.txt` 将结果追加到指定文件（必要时会创建新文件）\n* 到变量\n    * `d=$(date)`\
  \ 将命令输出保存到名为 `d` 的变量中\n\n许多此类 shell 特将在后续章节中讨论。\n\n## 脚本\n\n并不是所有操作都可以通过终端的一命令行完成。在这种情况下，你可以将指令保存到文本文件中执行它们。打开你喜欢的文本编辑器并编写下面的三行：\n\
  \n```\n[](#cb9-1)$ cat cmds.sh\n[](#cb9-2)echo 'hello world'\n[](#cb9-3)echo 'how\
  \ are you?'\n[](#cb9-4)seq 3\n```\n\n作为使用文本编辑器的替代方案，你可以使用下面的任意命令来创建此文件。\n\n```\n\
  [](#cb10-1)# 假设 'echo' 在你的环境中支持 '-e' 选项\n[](#cb10-2)$ echo -e \"echo 'hello world'\\\
  necho 'how are you?'\\nseq 3\" > cmds.sh\n[](#cb10-3)\n[](#cb10-4)# 使用内置 'printf'\
  \ 命令的可移植性解决方案\n[](#cb10-5)$ printf \"echo 'hello world'\\necho 'how are you?'\\\
  nseq 3\\n\" > cmds.sh\n```\n\n脚本文件名为 `cmds.sh`，在三个单独行中有三个命令。执行此文件内容的方法是使用 `source`\
  \ 命令：\n\n```\n[](#cb11-1)$ source cmds.sh\n[](#cb11-2)hello world\n[](#cb11-3)how\
  \ are you?\n[](#cb11-4)1\n[](#cb11-5)2\n[](#cb11-6)3\n```\n\n> ![info](img/file0.svg)\
  \ 你的 Linux 发版可能有易于使用的图形文本编辑器，如 `gedit` 和 `mousepad`。请查看 [wiki.archlinux: text editors](https://wiki.archlinux.org/title/List_of_applications#Text_editors)\
  \ 获取大量的可选编辑器列表。\n\n> ![info](img/file0.svg) Shell Scripting 章节将更详细地讨论脚本。\n\n## 命令帮助\n\
  \n\n\n\n\n大多数用于个人使用的 Linux 发行版都预装了已安装命令的文档。学习如何从终端使用手册是有用的，而且还有其他方法可以获取特定信息。\n\n\
  ### man\n\n`man` 命令是一个在终端内部查看手册的接口。它使用分页器（pager，通常是 `less` 命令）来显示内容。你可以将这些命令视为终端用户界面（TUI）应用程序。例如，输入\
  \ `man cat`，你应该能看到下面截图所示的内容：\n\n![cat 命令的手册页](img/file3.png)\n\n由于文档有几行无法完全适应终端窗口显示，因此你只会看到手册的起始部分。你有几种选项进行导航：\n\
  \n*   使用 `↑` 和 `↓` 方向键可以向上或向下移动一行\n    *   你也可以使用 `k` 和 `j` 键（与 Vim 编辑器中使用的键相同）\n\
  *   使用 `f` 和 `b` 键向前或向后移动一屏内容\n    *   `Space` 键也可以向前移动一屏\n*   鼠标滚轮可以向上或向下移动几行\n\
  *   `g` 或 `Home` 跳到手册开头\n*   `G` 或 `End` 跳到手册结尾\n*   `/pattern` 后紧跟 `Enter` 在正向搜索指定的模式\n\
  *   `?pattern` 后紧跟 `Enter` 在反向搜索指定的模式\n*   `n` 跳到下一个匹配项\n*   `N` 跳到上一个匹配项\n*   `q`\
  \ 退出\n\n正如你在上面的截图中注意到的，你可以使用 `h` 获取关于 `less` 命令本身的帮助信息。这里是一些与文档相关的实用提示：\n\n*   `man\
  \ man` 提供关于 `man` 命令本身的信息\n*   `man bash` 将为你提供 `bash` 壳的手册页\n    *   由于该内容非常长，我建议使用[在线\
  \ GNU Bash 手册](https://www.gnu.org/software/bash/manual/)\n*   `man find | gvim\
  \ -` 在你喜爱的文本编辑器中打开手册页\n*   `man -k printf` 在所有手册页中搜索字符串 `printf` 的短描述\n    *   你也可以使用\
  \ `apropos` 命令代替 `man -k`\n*   `wc --help` 许多命令支持 `--help` 选项来提供选项和语法的简要细节\n   \
  \ *   此外，这些细节将直接显示在终端上，无需处理 `pager` 接口\n\n> ![info](img/file2.svg) 另见 [unix.stackexchange:\
  \ 如何使用 man 页来学习使用命令？](https://unix.stackexchange.com/q/193815/109046) 和 [unix.stackexchange:\
  \ man 页中的颜色](https://unix.stackexchange.com/q/119/109046)。\n\n> ![info](img/file0.svg)\
  \ ![info](img/file0.svg) ![info](img/file0.svg) Linux 手册页通常是完整文档的简化版本。你可以使用 `info`\
  \ 命令查看 GNU 工具的完整文档。`info` 也是一个 TUI 应用程序，但按键配置与 `man` 命令不同。如果你更喜欢从网络浏览器阅读，请参阅 [GNU\
  \ 在线手册](https://www.gnu.org/manual/manual.html)。你也可以下载 PDF 等格式以便进行离线使用。\n\n### type\n\
  \n对于某些操作，shell 提供了自己的命令集，称为内置命令（builtin commands）。`type` 命令显示关于命令的信息，例如其路径、是否为内置命令、别名、函数等。\n\
  \n```\ntype cd\ncd is a shell builtin\ntype sed\nsed is /bin/sed\ntype type\ntype\
  \ is a shell builtin\n# 可以给出多个命令作为参数\ntype pwd awk\npwd is a shell builtin\nawk\
  \ is /usr/bin/awk\n```\n\n正如在 Shell 自定义章节中将的那样，你可以创建别名（aliases）来自定义命令调用。你可以使用 `type`\
  \ 命令来揭示此类别名的本质。以下基于我使用的别名的示例：\n\n```\ntype p\np is aliased to 'pwd'\ntype ls\nls\
  \ is aliased to 'ls --color=auto'\n```\n\n`type` 命令在命令输出开头使用反引号并在结尾使用单引号来格式化输出。这与语法高亮不兼容，因此在上面的示例中我将反引号改为了单引号。\n\
  \n> ![info](img/file0.svg) 另见 [unix.stackexchange: 内置命令与非内置命令之间有什么区别？](https://unix.stackexchange.com/q/11454/109046)。\n\
  \n### help\n\n`help` 命令为内置命令提供文档。与 `man` 命令不同，整个文本显示在终端中。\n\n```\nhelp cd\ncd is\
  \ a builtin\nUsage: cd [OPTION] [DIRECTORY]\n...\n```\n\n> ![info](img/file0.svg)\
  \ 使用 `help` 获取内置命令的文档。\n\n### whatis and whereis\n\n这里是更多获取命令信息的方法：\n\n*   `whatis`\
  \ 显示单行的手册页描述\n*   `whereis` 定位命令的二进制、源码和手册页文件\n\n```\nwhatis grep\ngrep (1)    \
  \         - print lines that match\nwhereis awk\nawk: /usr/bin/awk /usr/share/man/x86_64-linux-gnu/awk.1gz\n\
  ```\n\n### ch\n\n[explainshell](https://explainshell.com/) 是一个 Web 应用，显示与你输入的每个参数匹配的帮助文本。例如，下面是\
  \ [tar -xzvf archive.gz](https://explainshell.com/explain?cmd=tar+-xzvf+archive.gz)\
  \ 的截图：\n\n![tar 命令的 explainshell 示例](img/file4.png)\n\n受此应用的启发，我写了一个 Bash 脚本 [ch](https://github.com/learnbyexample/command_help)\
  \ 从 `man` 和 `help` 页中提取信息。以下是一些示例：\n\n```\nch ls -vX\nls - list directory contents\n\
  -v     对文本中的（版本）数字进行自然排序\n-X     按条目扩展名字母排序\nch type -a\ntype - Display information\
  \ about command type.\n-a        显示所有包含名为 NAME 可执行文件的位置;\n         包括别名、内置命令和函数，当且仅当\n\
  \         没有使用 '-p' 选项时\n```\n\n### 阅读\n\n*   [Linux man pages](https://www.mankier.com/)\
  \ — 提供在线手册页的网站之一\n*   [ArchWiki](https://wiki.archlinux.org/title/Table_of_contents)\
  \ — Arch Linux 及其他发行版的全面文档\n*   [Debian Reference](https://www.debian.org/doc/manuals/debian-reference/)\
  \ — Debian 系统的广泛概述，通过 shell 命令示例涵盖了系统管理的许多方面\n\n\n\n\n\n你可以使用几个快捷键来提高命令行操作效率。这些内容将在\
  \ Shell 定制章节中讨论。以下是一些示例以供你直观理解：\n\n* `Ctrl+u` 删除光标左侧的所有内容\n* `Ctrl+k` 删除从当前字符到行尾的内容\n\
  * `Ctrl+c` 终止当前输入的命令\n* `Ctrl+l` 清除终端屏幕并将提示符移动到顶部，作为当前命令一部分输入的任何字符都将被保留\n* `↑` 和\
  \ `↓` 方向键可以在历史记录中导航之前使用过的命令\n    * `Ctrl+p` 和 `Ctrl+n` 也可以代替方向键\n    * 你可以在执行历史记录中的这些行之前对命令进行修改\n\
  \nTab 键可以根据上下文帮助你自动补全命令、别名、文件名等。如果只有一种可能的补全结果，只需按一次 Tab 键即可完成。否则，你可以按两次 Tab 键来获取可能的匹配项列表（如果有的话）。这里有一个在不同阶段多次按\
  \ Tab 键补全文件路径的示例。这不仅节省了时间，还能帮助避免拼写错误，因为你同时在验证路径。\n\n```\n[](#cb18-1)# pressing tab\
  \ after typing '/e' will autocomplete to '/etc/'\n[](#cb18-2)$ ls /etc/\n[](#cb18-3)\n\
  [](#cb18-4)# pressing tab after 'di' will autocomplete to 'dict'\n[](#cb18-5)$ ls\
  \ /etc/dict\n[](#cb18-6)# pressing tab twice will show all possible completions\n\
  [](#cb18-7)$ ls /etc/dict\n[](#cb18-8)dictd/               dictionaries-common/\
  \ \n[](#cb18-9)\n[](#cb18-10)# type 'i' and press tab to get 'dictionaries-common'\n\
  [](#cb18-11)$ ls /etc/dictionaries-common/\n[](#cb18-12)\n[](#cb18-13)# type 'w'\
  \ and press tab to get 'words'\n[](#cb18-14)$ ls /etc/dictionaries-common/words\
  \ \n```\n\n上述示例中按下 Tab 键的字符是为了说明而特意挑选的。如果你尝试在每个字符后都按 Tab，步骤将会增加。随着经验的积累，使用 Tab 键进行自动补全将成为你命令行使用的自然习惯。\n\
  \n> ![info](img/file0.svg) 你可以设置一个选项，将单按和双击 Tab 键的功能合并为单次按下。这将在 Shell 定制章节中讨论。\n\
  \n## 现实世界用例\n\n如果命令行环境只有文件管理功能，我仍然会使用它。鉴于丰富的应用程序，我无法想象为每个用例都回到不同的 GUI 程序。我的主要工作是编写电子书、博客文章和录制视频。以下是我使用的主要\
  \ CLI 工具：\n\n* 使用 `head`、`tail`、`sort`、`grep`、`sed`、`awk` 等进行文本处理（你将在后续章节中学习这些命令）\n\
  * [git](https://git-scm.com/) — 版本控制\n* [pandoc](https://github.com/jgm/pandoc/)\
  \ — 从 markdown 文件生成 PDF/EPUB 版本\n* [mdBook](https://github.com/rust-lang/mdBook)\
  \ — 从 markdown 文件生成网页书籍\n* [zola](https://github.com/getzola/zola) — 静态站点生成器\n*\
  \ [ImageMagick](https://imagemagick.org/index.php) — 图片处理，如调整尺寸、添加边框等\n* [oxipng](https://github.com/shssoichiro/oxipng),\
  \ [pngquant](https://pngquant.org/) 和 [svgcleaner](https://github.com/RazrFalcon/svgcleaner)\
  \ — 图片优化\n* [auto-editor](https://github.com/WyattBlue/auto-editor) — 移除视频记录中的静音部分\n\
  * [FFmpeg](https://github.com/FFmpeg/FFmpeg) — 视频处理，例如填充（`FFmpeg` 也是 `auto-editor`\
  \ 解决方案的重要部分）\n\n某些工作流需要额外的管理，为此我编写 shell 函数或脚本。我也需要 GUI 工具，例如网络浏览器、图像查看器、PDF/EPUB\
  \ 查看器、[SimpleScreenRecorder](https://github.com/MaartenBaert/ssr) 等。其中某些可以在终端内处理，但在这些情况下我倾向于使用\
  \ GUI。我确实会从终端启动某些程序，主要是为了提供要打开的文件或 URL。\n\n你可能会奇怪，命令行在处理图像和视频方面有什么优势？除了速度更快，自定义参数（如边框颜色、边框大小、质量百分比等）会自动保存为我创建的脚本的一部分。之后，我只需要调用一次脚本，而无需等待\
  \ GUI 程序打开、导航到所需文件、应用自定义参数、在完成所有所需处理后保存、关闭应用程序等。此外，该脚本可以使用任意数量的工具，而在使用 GUI 时，你必须在不同的应用程序之间重复这些步骤。\n\
  \n## 练习题\n\n> ![info](img/file0.svg) 你可以设置一个选项，将单按和双击 Tab 键的功能合并为单次按下。这将在 Shell\
  \ 定制章节中讨论。\n\n1. **1)** 默认情况下，`echo` 是内置命令还是外部命令？用什么命令可以答案？\n2. **2)** 所示命令的输出是什么？\n\
  ```\n[](#cb20-1)$ whatis cat\n[](#cb20-2)cat (1)              - concatenate files\
  \ and print on standard output\n[](#cb20-3)\n[](#cb20-4)$ whatis type\n[](#cb20-5)type:\
  \ nothing appropriate.\n[](#cb20-6)\n[](#cb20-7)# ???\n[](#cb20-8)type - Display\
  \ information about command type.\n```\n3. **3)** `/tmp` 目录的作用是什么？\n4. **4)** 分别给出一个绝对路径和相对路径示例。\n\
  5. **5)** 什么时候使用 `man -k` 命令？\n6. **6)** `man` 页面和 `info` 页面之间有什么区别？\n7. **7)**\
  \ 在查看 `man` 页面时（假设使用 `less` 命令），使用哪个键可以将第 50 行移动到屏幕顶部？\n8. **8)** 简述以下运算符的作用：\n\
  \    * a) `|`\n    * b) `>`\n    * c) `>>`\n9. **9)** `Ctrl+k` 是做什么的？\n10. **10)**\
  \ 浏览 [bash 手册：波浪号展开](https://www.gnu.org/software/bash/manual/html/Tilde-Expansion)。`~/projects`\
  \ 是相对路径还是绝对路径？参考此 [stackexchange 线程](https://stackexchange.com/q/221970/10946) 获取答案。\n\
  \n\n\n\n\n> Shell 还提供了一小部分内置命令（builtins），它们用于实现那些通过独立实用程序无法实现或不方便实现的功能。例如，`cd`、`break`、`continue`\
  \ 和 `exec` 无法在 shell 之外实现，因为它们直接操作 shell 本身。`history`、`getopts`、`kill` 或 `pwd` 等内置命令可以在独立的实用程序中实现，但作为内置命令使用会更方便。\n\
  \n日常使用需要的许多命令都是外部命令，即它们不是 shell 的一部分。某些内置命令（例如 `pwd`）在你的系统上可能作为外部命令可用（这些版本在功能上可能存在差异）。在这种情况下，默认将执行内置版本，你可以通过使用外部版本的路径来覆盖它。\n\
  \n你可以使用 `type` 命令来区分内置命令和外部命令。`type` 命令是一个 shell 内置命令，并且还提供其他功能（稍后会讨论）。你可以使用 `-a`\
  \ 选项来获取关于指定命令的所有细节。\n\n```\n[](#cb21-1)$ type -a cd\n[](#cb21-2)cd is a shell builtin\n\
  [](#cb21-3)\n[](#cb21-4)$ type -a ls\n[](#cb21-5)ls is /bin/ls\n[](#cb21-6)\n[](#cb21-7)$\
  \ type -a pwd\n[](#cb21-8)pwd is a shell builtin\n[](#cb21-9)pwd is /bin/pwd\n```\n\
  \n> ![info](img/file2.svg) 要查阅文档，内置命令使用 `help` 命令，外部命令使用 `man` 命令（或在适用时使用 `info`\
  \ 查看完整文档）。使用 `help help` 和 `man man` 查看它们自身的文档。\n\n> ![info](img/file2.svg) 仅输入\
  \ `help` 将给出内置命令列表以及命令的语法。\n\n## pwd\n\n`pwd` 是一个 shell 内置命令，用于获取当前工作目录。这有助于确定自己在文件系统中的位置。打印的绝对路径通常便于复制粘贴到其他地方，例如脚本中。某些用户偏于让终端模拟器和/或\
  \ shell 提示符始终显示当前工作目录。\n\n```\n[](#cb22-1)$ pwd\n[](#cb22-2)/home/learnbyexample\n\
  ```\n\n## cd\n\n`cd` 是另一个 shell 内置命令。有助于更改当前工作目录。这里有一个使用绝对路径更改工作目录的示例：\n\n```\n\
  [](#cb23-1)$ pwd\n[](#cb23-2)/home/learnbyexample\n[](#cb23-3)\n[](#cb23-4)# 在路径末尾指定\
  \ / 是可选的\n[](#cb23-5)$ cd /etc\n[](#cb23-6)$ pwd\n[](#cb23-7)/etc\n```\n\n你可以使用\
  \ `-` 作为参数返回上一个工作目录。继续上例的示例：\n\n```\n[](#cb24-1)$ cd -\n[](#cb24-2)/home/learnbyexample\n\
  ```\n\n> ![info](img/file0.svg) 大多数命令会将以 `-` 开头的字符串视为命令选项。你可以使用 `--` 告诉命令，所有后续参数都不应被视为选项，即使它们以\
  \ `-` 开头。例如，如果你在当前工作目录下有一个名为 `-oops` 的文件夹，可以使用 `cd -- -oops` 切换到该目录。\n\n相对路径是相对于当前工作目录的：\n\
  \n*   `.` 指代当前目录\n*   `..` 指代上一层级的目录（即父目录）\n*   `../..` 指代上上层级的目录，依此类推\n*   `cd\
  \ ./-` 将帮助你切换到当前位置名为 `-` 的目录\n    *   你不能使用 `cd -`，因为那会带你回到上一个工作目录\n\n```\n[](#cb25-1)$\
  \ pwd\n[](#cb25-2)/home/learnbyexample\n[](#cb25-3)\n[](#cb25-4)# 回到上一层级\n[](#cb25-5)$\
  \ cd ..\n[](#cb25-6)$ pwd\n[](#cb25-7)/home\n[](#cb25-8)\n[](#cb25-9)# 到当前目录下的 'learnbyexample'\n\
  [](#cb25-10)# 在这种情况下 './' 是可选的\n[](#cb25-11)$ cd ./learnbyexample\n[](#cb25-12)$\
  \ pwd\n[](#cb25-13)/home/learnbyexample\n[](#cb25-14)\n[](#cb25-15)# 回到上上层级\n[](#cb25-16)$\
  \ cd ../..\n[](#cb25-17)$ pwd\n[](#cb25-18)/\n```\n\n你可以从文件系统的任何地方通过 `cd` 或 `cd\
  \ ~` 或 `cd ~/` 切换到主目录。这由存储在 `HOME` shell 变量中的值决定。参见 [bash 手册：波浪展开](https://www.gnu.org/software/bash/manual/html_node/Tilde-Expansion.html)。\n\
  \n```\n[](#cb26-1)$ pwd\n[](#cb26-2)/\n[](#cb26-3)$ echo \"$HOME\"\n[](#cb26-4)/home/learnbyexample\n\
  [](#cb26-5)\n[](#cb26-6)$ cd\n[](#cb26-7)$ pwd\n[](#cb26-8)/home/learnbyexample\n\
  ```\n\n## clear\n\n你可以使用此命令清除终端屏幕。默认情况下，`clear` 命令会将提示符移动到屏幕顶部，并尝试清除回滚缓冲区。如果你想保留回滚缓冲区，可以使用\
  \ `-x` 选项。\n\n> ![info](img/file2.svg) 快捷键 `Ctrl+l` 也会将提示行移动到顶部。它会保留你在提示符上输入的文本，且不会清除回滚缓冲区。\n\
  \n## ls\n\n当你使用文件管理器 GUI 应用时，你会自动看到目录内容。此类 GUI 应用通常具有显示文件大小、区分文件和文件夹等功能。`ls` 是相应的命令行工具，具有许多与查看目录相关的选项和功能。\n\
  \n> ![info](img/file2.svg) 如前所述，会显示目录内容。你可以传递一个或多个路径作为参数。是一些示例：\n\n```\n[](#cb28-1)$\
  \ ls\n[](#cb28-2)backups    hello_world.py  ip.txt     report.log  todos/\n[](#cb28-3)errors.log\
  \  hi              projects/  scripts\n```\n\n如果你只需要区分文件和目录，可以使用 `-p` 选项：\n\n```\n\
  [](#cb31-1)$ ls -p\n[](#cb31-2)backups/    hello_world.py  ip.txt     report.log\
  \  todos/\n[](#cb31-3)errors.log  hi              projects/  scripts\n```\n\n你还可以使用\
  \ `--color` 选项来视觉上区分文件类型：\n\n![带有 --color 选项的示例](img/file5.png)\n\n\n\n\n\n`-l`\
  \ 选项使用长列表格式显示内容。你将获得文件权限、所有者、大小、时间戳等详细信息。第一列的第一个字符区分文件类型：`d` 表示目录，`-` 表示普通文件，`l`\
  \ 表示符号链接等。在每个目录列表的下方，第一行将显示条目的总大小（以 KB 为单位）。\n\n```\n$ ls -l hi\n-rwxrwxr-x 1 learnbyexample\
  \ learnbyexample 21 Dec  5  2019 hi\n# 你可以添加 -G 选项来避免分组列\n$ ls -lG\ntotal 7516\n\
  drwxrwxr-x 3 learnbyexample    4096 Feb  4 09:23 backups\n-rw-rw-r-- 1 learnbyexample\
  \   12345 Jan  1 03:30 errors.log\n-rwxrwxr-x 1 learnbyexample      42 Feb 29  2020\
  \ hello_world.py\n-rwxrwxr-x 1 learnbyexample      21 Dec  5  2019 hi\n-rw-rw-r--\
  \ 1 learnbyexample      10 Jul 21  2017 ip.txt\ndrwxrwxr-x 4 learnbyexample    4096\
  \ Mar  5 11:21 projects\n-rw-rw-r-- 1 learnbyexample 765421 Jan  1 01:01 report.log\n\
  lrwxrwxrwx 1 learnbyexample      13 May  7 15:17 scripts -> ../scripts\ndrwxrwxr-x\
  \ 2 learnbyexample    4096 Apr  6 13:19 todos\n```\n\n> ![info](img/file0.svg) ![warning](img/file1.svg)\
  \ 注意，显示小时和分钟还是年份取决于相对于时间的差异。例如，你可能会得到 `Feb 4 2022` 而不是 `Feb 4 09:23`。\n\n使用 `-h`\
  \ 选项以人类可读的格式显示文件大小（默认是字节）。\n\n```\n$ ls -lG report.log\n-rw-rw-r-- 1 learnbyexample\
  \ 765421 Jan  1 01:01 report.log\n$ ls -lhG report.log\n-rw-rw-r-- 1 learnbyexample\
  \ 7.3M Jan  1 01:01 report.log\n```\n\n如果你只需要分配的文件大小和名称，可以使用 `-s` 选项代替长列表：\n\n```\n\
  $ ls -1sh errors.log report.log\n16K errors.log\n7.4M report.log\n```\n\n有几个选项可以更改列表顺序：\n\
  \n*   `-t` 按时间戳排序\n*   `-S` 按文件大小排序（适用于目录）\n*   `-v` 按版本排序（适用于文件名包含数字的文件）\n*   `-X`\
  \ 按文件扩展名排序（即文件名中 `.` 之后的字符）\n*   `-r` 反转列表顺序\n\n```\n$ ls -lGhtr\ntotal 7.4M\n-rw-rw-r--\
  \ 1 learnbyexample   10 Jul 21  2017 ip.txt\n-rwxrwxr-x 1 learnbyexample   21 Dec\
  \  5  2019 hi\n-rwxrwxr-x 1 learnbyexample      42 Feb 29  2020 hello_world.py\n\
  -rw-rw-r-- 1 learnbyexample 12345 Jan  1 03:30 errors.log\n-rw-rw-r-- 1 learnbyexample\
  \ 765421 Jan  1 01:01 report.log\ndrwxrwxr-x 4 learnbyexample    4096 Mar  5 11:21\
  \ projects\nlrwxrwxrwx 1 learnbyexample      13 May  7 15:17 scripts -> ../scripts\n\
  drwxrwxr-x 2 learnbyexample    4096 todos\n```\n\n以 `.` 开头的文件被视为隐藏文件，默认不会显示。你可以使用\
  \ `-a` 选项查看它们。`-A` 选项类似，但不会显示 `.` 和 `..` 条目。\n\n```\n$ ls -a backups/files/\n..\
  \ .bashrc .inputrc .vimrc\n$ ls -A backups/files/\n.bashrc .inputrc .vimrc\n```\n\
  \n`-R` 选项还会递归列出子目录：\n\n```\n$ ls -AR\nbackups/\nhello_world.py  .hidden  projects/\n\
  scripts\n/\nhello_world.py  hi  ip.txt\nreport.log\ntodos/\n```\n\n通常你可能根据某些标准（例如文件扩展名）列出特定的文件或目录。shell\
  \ 提供了一种名为**通配符 (globs)** 或 wildcards 的匹配技术。下面是一些简单的示例（更多信息请参见通配符）。`*` 是零或多个字符的占位符：\n\
  \n```\n## *.py *.log 将给出以 .py 或 .log 结尾的文件名\n$ echo *.py *.log\nhello_world.py report.log\n\
  ## 使用引号可以防止 glob \n$ echo '*.py' *.log\n'*.py' hello_world.py report.log\n## 列出以\
  \ .log 结尾的文件\n$ ls -lG *.log\n-rw-rw-r-- 1 learnbyexample 12345 Jan  1 03:30 errors.log\n\
  -rw-rw-r-- 1 learnbyexample 765421 Jan  1 01:01 report.log\n```\n\n`[]` 帮助你指定一组匹配一次的字符。例如，`[ad]`\
  \ 匹配一次 `a` 或 `d`。`[c-i]` 匹配从 `c` 到 `i` 的字符范围。\n\n```\n## 以 'c' 到 'i' 开头的条目\n$ echo\
  \ [c-i]*\nerrors.log hello_world.py ip.txt\n$ ls -1sh [c-i]*\n16K errors.log\n4.0K\
  \ hello_world.py\n4.0K hi\n4.0K ip.txt\n```\n\n> ![info](img/file2.svg) ![info](img/file2.svg)\
  \ 如上面的示例所示，glob 由 shell 扩展。初学者通常将 glob 视为 `ls` 命令特有的东西，这就是为什么我在上面的示例中也使用了 `echo`。\n\
  \n你可以使用 `-d` 选项*不*显示目录内容：\n\n```\n$ echo b*\nbackups\n## backups 是目录，ls 将显示其内容\n\
  $ ls b*\nbookmarks.html dot_files\n## -d 将显示目录本身而不是其内容\n$ ls -d b*\nbackups\n##\
  \ 获取仅目录条目的方便方法\n$ echo */\nbackups/ projects/ todos/\n$ ls -1d */\nbackups/\nprojects/\n\
  todos/\n```\n\n\n\n\n\n```bash\nmkdir reports 'low power adders'\nls -1\n'low power\
  \ adders'\nreports\n```\n\n`-p` 选项将帮助你一次性创建多级目录结构：\n\n```bash\n## 报错因为 'a' 和 'a/b'\
  \ 路径尚不存在\nmkdir a/b/c\nmkdir: cannot create directory ‘a/b/c’: No such file or directory\n\
  \n## 在这种情况下 -p 非常有用\nmkdir -p a/b/c\n\ntree\n.\n├── a\n│   └── b\n│       └── c\n\
  ├── low power adders\n└── reports\n\n5 directories, 0 files\n```\n\n`-p` 选项还有另一个功能：如果你尝试创建的目录已经存在，它不会报错。这在\
  \ shell 脚本中特别有用。\n\n```bash\n## 'reports' 目录在之前的示例中已经被创建了\nmkdir reports\nmkdir:\
  \ cannot create directory ‘reports’: File exists\n## 退出状态将反映发生了某些错误\necho $?\n1\n\
  \n## -p 选项会覆盖此类错误\nmkdir -p reports\necho $?\n0\n```\n\n如上面的示例所示，你可以使用 `$?` 特殊变量检查上一个执行命令的退出状态。`0`\
  \ 表示一切顺利，较大的数字表示发生了某种错误（具体细节可以在命令的手手册中查阅）。\n\n> Linux 文件名可以使用除 `/` 和 ASCII NUL 字符外的任何字符。如果参数中包含空格、`*`\
  \ 等字符，请对参数加引号以防止 shell 扩展。shell 将空格视为参数分隔符，将 `*` 视为通配符等。作为良好的习惯，除非你有特殊需求，否则文件名应仅使用字母、数字和下划线。另请参见\
  \ [unix.stackexchange: 文件名中应避免的字符](https://unix.stackexchange.com/q/269093/109046)。\n\
  \n> 如果你愿意，可以删除练习目录：\n\n```bash\ncd ..\nrm -r practice_mkdir\n```\n\n## touch\n\n\
  你通常使用文本编辑器或通过将命令的输出重定向到文件来创建文件。在某些情况下，需要空文件用于测试或满足特定的构建过程。一个真实世界的用例是为 [GitHub Pages](https://docs.github.com/en/pages/getting-started-with-github-pages/about-github-pages#static-site-generators)\
  \ 创建空的 `.nojekyll` 文件。\n\n`touch` 命令的主要功能是修改时间戳（将在文件属性章节讨论）。如果文件不存在，`touch` 将使用时间戳创建一个空文件。如果需要，你也可以传递多个文件参数。\n\
  \n```bash\nmkdir practice_touch\ncd practice_touch\n\nls ip.txt\nls: cannot access\
  \ 'ip.txt': No such file or directory\n\ntouch ip.txt\n\nls -s ip.txt\n0 ip.txt\n\
  ```\n\n> 你也可以使用 `> ip.txt` 创建空文件，但如果文件已存在，重定向操作符将覆盖该文件。\n\n## rm\n\n`rm` 命令将帮助你删除文件和目录。你可以传递一个或多个路径作为参数。\n\
  \n```bash\n# 到 'scripts' 目录并执行 'rm.sh' 脚本\nsource rm.sh\nls -F\nempty_dir/  hello.py\
  \  loops.py  projects/  read_only.txt  reports/\n\n## 删除以 .py 结尾的文件\nrm *.py\nls\
  \ -F\nempty_dir/  projects/  read_only.txt  reports/\n```\n\n你需要添加 `-r` 选项来递归删除目录内容。你可以使用\
  \ `rm -d` 或 `rmdir` 命令仅删除空目录。\n\n```bash\n## 递归删除目录内容需要 -r\nrm reports\nrm: cannot\
  \ remove 'reports': Is a directory\nrm -r reports\nls -F\nempty_dir/  projects/\
  \  read_only.txt\n\n## 删除空目录，等同于使用 'rmdir' 命令\nrm -d empty_dir\n## 如果目录为空，你会得到错误\n\
  rm -d projects\nrm: cannot remove 'projects': Directory not empty\n```\n\n像空格位置错误、错误的通配符等拼写错误可能会抹除并非打算删除的文件。除了保留备份和快照外，你还可以采取一些缓解措施：\n\
  \n*   使用 `-i` 选项交互式地删除每个文件\n    *   你也可以使用 `-I` 选项来减少提示次数\n*   使用 `echo` 作为空运行（dry\
  \ run），查看通配符如何展开\n*   使用垃圾箱命令（见下文链接）代替 `rm`\n\n在使用带有 `-i` 或 `-I` 选项时，使用 `y` 确认，使用\
  \ `n` 取消删除。这是一个取消删除的示例：\n\n```bash\nrm -ri projects\nrm: descend into directory\
  \ 'projects'? n\n\nls -F\nprojects/  read_only.txt\n```\n\n这里是在删除过程的每一步提供确认的示例：\n\
  \n```bash\ntree projects\nprojects\n├── calculator\n│   └── calc.sh\n└── tictactoe\n\
  \    └── game.py\n\n2 directories, 2 files\n\nrm -ri projects\nrm: descend into\
  \ directory 'projects'? y\nrm: descend into directory 'projects/tictactoe'? y\n\
  rm: remove regular empty file 'projects/tictactoe/game.py'? y\nrm: remove directory\
  \ 'projects/tictactoe'? y\nrm: descend into directory 'projects/calculator'? y\n\
  rm: remove regular empty file 'projects/calculator/calc.sh'? y\nrm: remove directory\
  \ 'projects/calculator'? y\nrm: remove directory 'projects'? y\n\nls -F\nread_only.txt\n\
  ```\n\n`-f` 选项可以忽略对不存在文件的报错（类似于 `mkdir -p` 功能）。它也有助于删除写保护文件（只要你有删除权限）。该选项对于递归删除具有写保护的目录特别有用，例如\
  \ `.git/objects`。\n\n```bash\nrm xyz.txt\nrm: cannot remove 'xyz.txt': No such file\
  \ or directory\necho $?\n1\nrm -f xyz.txt\necho $?\n0\n\n## 删除写文件的示例\n## 即使没有 -i/-I\
  \ 也会询问确认\nrm read_only.txt\n## 使用 -f，文件将被删除而不询问\nrm -f read_only.txt\n```\n\n**进阶阅读**\n\
  \n*   使用垃圾箱命令（例如 Ubuntu 上的 `trash-cli`），以便在需要时恢复删除的文件\n    *   另请 [unix.stackexchange:\
  \ 创建简单的垃圾箱命令](https://unix.stackexchange.com/q/452496/109046)\n*   使用 `rm` 删除的文件仍然可以通过时间和技能恢复\n\
  \    *   [unix.stackexchange: 恢复误删的文件](https://unix.stackexchange.com/q/80270/109046)\n\
  \    *   [unix.stackexchange: 恢复意外删除的文件](https://unix.stackexchange.com/q/2677/109046)\n\
  *   如果你想让删除的文件更难恢复，可以使用 `shred` 等命令\n    *   [wiki.archlinux: 安全擦除磁盘](https://wiki.archlinux.org/title/Securely_wipe_disk)\n\
  *   `git` 及相关资源的[我的精选列表](https://learnbyexample.github.io/curated_resources/git_and_github.html)\n\
  \n\n\n\n你可以使用 `cp` 命令来复制文件和目录。使用默认语法，你必须先指定源路径，然后是目标路径。要复制多个项目，最后一个参数作为目标时只能是一个目录。你还需要使用\
  \ `-r` 选项来复制目录（类似于之前看到的 `rm -r`）。\n\n```\n[](#cb52-1)# 切到 'scripts' 目录并执行 'cp.sh'\
  \ 脚本\n[](#cb52-2)$ source cp.sh\n[](#cb52-3)$ ls -F\n[](#cb52-4)backups/  reference/\n\
  [](#cb52-5)\n[](#cb52-6)# 记得 . 是指向当前目录的相对路径\n[](#cb52-7)$ cp /usr/share/dict/words\
  \ .\n[](#cb52-8)$ ls -F\n[](#cb52-9)backups/  reference/  words\n[](#cb52-10)\n\
  [](#cb52-11)# 错误因为复制目录需要 -r\n[](#cb52-12)# 其他文件参数（如果存在）仍会被复制\n[](#cb52-13)$ cp /usr/share/dict\
  \ .\n[](#cb52-14)cp: -r not specified; omitting directory '/usr/share/dict'\n[](#cb52-15)$\
  \ cp -r /usr/share/dict .\n[](#cb52-16)$ ls -F\n[](#cb52-17)backups/  dict/  reference/\
  \  words\n```\n\n> ![info](img/file2.svg) ![warning](img/file7.svg) 默认情况下，`cp` 将覆盖目标目录中同名的现有文件。你可以使用\
  \ `-i` 选项交互式确认或拒绝覆盖现有文件。`-n` 选项将防止在不询问确认的情况下覆盖现有文件。\n\n```\n[](#cb53-1)$ echo 'hello'\
  \ > ip.txt\n[](#cb53-2)$ ls -F\n[](#cb53-3)backups/  dict/  ip.txt  reference/ \
  \ words\n[](#cb53-4)$ ls backups\n[](#cb53-5)ip.txt  reports\n[](#cb53-6)$ cat backups/ip.txt\n\
  [](#cb53-7)apple banana cherry\n[](#cb53-8)# 文件将在不询问确认的情况下覆盖！\n[](#cb53-9)$ cp ip.txt\
  \ backups/\n[](#cb53-10)$ cat backups/ip.txt\n[](#cb53-11)hello\n[](#cb53-12)\n\
  [](#cb53-13)# 使用 -i 交互式确认或拒绝覆盖\n[](#cb53-14)$ echo 'good morning' > ip.txt\n[](#cb53-15)$\
  \ cp -i ip.txt backups/\n[](#cb53-16)cp: overwrite 'backups/ip.txt'? n\n[](#cb53-17)$\
  \ cat backups/ip.txt\n[](#cb53-18)hello\n[](#cb53-19)\n[](#cb53-20)# 使用 -n 防止在不需要确认的情况下覆盖\n\
  [](#cb53-21)$ cp -n ip.txt backups/\n[](#cb53-22)$ cat backups/ip.txt\n[](#cb53-23)hello\n\
  ```\n\n如果目标路径中存在与正在复制的目录相同的文件夹，则内容将合并。如果此类目录中存在同名文件，将适用于上述规则。\n\n```\n[](#cb54-1)$\
  \ tree backups\n[](#cb54-2)backups\n[](#cb54-3)├── ip.txt\n[](#cb54-4)└── reports\n\
  [](#cb54-5)    └── jan.log\n[](#cb54-6)\n[](#cb54-7)1 directory, 2 files\n[](#cb54-8)\n\
  [](#cb54-9)$ mkdir reports\n[](#cb54-10)$ touch reports/dec.log\n[](#cb54-11)$ cp\
  \ -r reports backups/\n[](#cb54-12)$ tree backups\n[](#cb54-13)backups\n[](#cb54-14)├──\
  \ ip.txt\n[](#cb54-15)└── reports\n[](#cb54-16)    ├── dec.log\n[](#cb54-17)   \
  \ └── jan.log\n[](#cb54-18)\n[](#cb54-19)1 directory, 3 files\n```\n\n通常情况下，你想以不同的名称复制文件（或目录）。在这种情况下，你只需在指定目标时使用一个新名称即可。\n\
  \n```\n[](#cb55-1)# 将源处的 'words' 文件复制到目标命名为 'words_ref.txt'\n[](#cb55-2)$ cp /usr/share/dict/words\
  \ words_ref.txt\n[](#cb55-3)\n[](#cb55-4)# 将 'words' 文件复制为 'reference' 目录下的 'words.txt'\n\
  [](#cb55-5)$ cp /usr/share/dict/words reference/words.txt\n[](#cb55-6)\n[](#cb55-7)#\
  \ 将 'dict' 目录复制为 'word_lists'\n[](#cb55-8)$ cp -r /usr/share/dict word_lists\n```\n\
  \n如前所述，要复制多个文件和目录，你必须将目标目录作为最后一个参数。\n\n```\n[](#cb56-1)$ cp -r ~/.bashrc /usr/share/dict\
  \ backups/\n[](#cb56-2)\n[](#cb56-3)$ ls -AF backups\n[](#cb56-4).bashrc  dict/\
  \  ip.txt  reports/\n```\n\n如果你想在源路径之前指定目标，可以使用 `-t` 选项（例如在使用 `find` 命令时很有帮助，稍后将讨论）。以下是一些值得注意的选项：\n\
  \n* `-u` 仅当源文件较新或在目标中不存在时才复制文件\n\n* `-b` 和 `--backup` 选项允许你为目标中已存在的文件创建备份副本\n\n\
  * `--preserve` 选项将帮助你在复制文件时，同时保留源文件的属性（如所有者、时间戳等）。\n\n\n\n```bash\n#cb60-1$ mkdir\
  \ practice_rename\n#cb60-2$ cd practice_rename\n## 创建示例文件\ntouch caves.jpeg waterfall.JPEG\
  \ flower.JPG\n\n## 替换命令语法为 s/查找/替换/标志\n## \\. 字面匹配 . 字符\n# e? 可选匹配 e (? 是量符，匹配 0\
  \ 或 1 次)\n## $ 将匹配项锚定到输入的末尾\n## i 标志忽略大小写匹配输入\nrename 's/\\.jpe?g$/.jpg/i' *\n\n\
  ls\ncaves.jpg  flower.jpg  waterfall.jpg\nrm *.jpg\n```\n\n作为一个良好的习惯，使用 `-n` 选项在实际重命名文件之前查看文件将如何重命名。\n\
  \n```bash\ntouch 1.png 3.png 25.png 100.png\nls\n100.png  1.png  25.png  3.png\n\
  \n## 使用 -n 选项进行检查\n## 注意 100.png 不在输出中，因为它不受影响\n# \\d 匹配数字字符\n# \\d+ 匹配 1 或多个数字\
  \ (+ 是量符，匹配 1 次或多次)\n## e 标志将替换字符串视为 Perl 代码处理\n## $& 是匹配部分的反向引用\nrename -n 's/\\\
  d+/sprintf \"%03d\", $&/e' *.png\nrename(1.png, 001.png)\nrename(25.png, 025.png)\n\
  rename(3.png, 003.png)\n\n## 检查后移除 -n 选项以实际重命名文件\nrename 's/\\d+/sprintf \"%03d\"\
  , $&/e' *.png\nls\n001.png  003.png  025.png  100.png\n```\n\n如果新文件名已经存在，你将得到错误，如果你愿意，可以使用\
  \ `-f` 选项覆盖它。如果你传递了包含路径组件的文件，可以使用 `-d` 选项仅影响文件名部分。否则，你使用的逻辑可能会影响目录名。\n\n```bash\n\
  mkdir projects\ntouch projects/toc.sh projects/reports.py\n\n## 目标是将文件名的非扩展名部分转换为大写\n\
  ## [^.]+ 匹配 1 或多个非 '.' 字符\n# \\U 将随后的字符转换为大写\n## $& 是匹配部分的反向引用\nrename -n -d 's/[^.]+/\\\
  U$&/' projects/*\nrename(projects/reports.py, projects/REPORTS.py)\nrename(projects/toc.sh,\
  \ projects/TOC.sh)\n\n## 没有 -d 选项，目录名也会受到影响\nrename -n 's/[^.]+/\\U$&/' projects/*\n\
  rename(projects/reports.py, PROJECTS/REPORTS.py)\nrename(projects/toc.sh, PROJECTS/TOC.sh)\n\
  ```\n\n## 延伸阅读\n\n* [perldoc: 正则表达式教程](https://perldoc.perl.org/perlretut)\n* 查看我的\
  \ [Perl 一行命令](https://github.com/learnbyexample/learn_perl_oneliners) 电子书，获取更多 Perl\
  \ 替换和 `rename` 命令的示例和细节\n\n## ln\n\n`ln` 命令帮助你在相同或不同位置创建指向另一个文件或目录的链接。链接有两种类型——**符号**链接和**硬**链接。符号链接可以指向文件和目录。以下是一些特性：\n\
  \n* 如果原始文件被删除或移动到另一个位置，符号链接将不再可用\n* 如果符号链接移动到另一个位置，如果使用绝对路径创建链接，则它将仍然有效（对于相对路径，将取决于该位置是否有另一个同名文件）\n\
  * 符号链接文件有它自己的 inode、权限、时间戳等\n* 当将原始文件或符号链接文件作为命令行参数时，某些命令的工作方式相同，而某些则需要额外的选项（例如\
  \ `du -L`）\n\n用法与 `cp` 命令类似。你必须先指定源，然后是目标（如果是当前工作目录，目标是可选的）。\n\n```bash\nmkdir practice_ln\n\
  cd practice_ln\n\n# 在当前目录创建链接时，目标是可选的\n## 创建符号链接需要 -s 选项\nln -s /usr/share/dict/words\n\
  \n## 如果需要，你也可以重命名链接\nln -s /usr/share/dict/words words.txt\nls\n```\n硬链接只能指向另一个文件。它们被限制在同一个文件系统中。硬链接不能指向目录。\n\
  \n* 等同原始文件被删除或移动到另一个位置，符号链接将不再可用\n* 如果符号链接移动到另一个位置，如果使用绝对路径创建链接，则它将仍然有效（对于相对路径，将取决于该位置是否有另一个同名文件）\n\
  * 符号链接文件有它自己的 inode、权限、时间戳等\n* 当将原始文件或符号链接文件作为命令行参数时，某些命令的工作方式相同，而某些则需要额外的选项（例如\
  \ `du -L`）\n\n用法与 `cp` 命令类似。你必须先指定源，然后是目标（如果是当前工作目录，目标是可选的）。\n\n```bash\nmkdir practice_ln\n\
  cd practice_ln\n\n# 在当前目录创建链接时，目标是可选的\n## 创建符号链接需要 -s 选项\nln -s /usr/share/dict/words\n\
  \n## 如果需要，你也可以重命名链接\nln -s /usr/share/dict/words words.txt\nls\n```\n等待，`ln` 的源文本是重复且混乱的。让我们根据提供的逻辑进行清理，同时保留核心内容。\n\
