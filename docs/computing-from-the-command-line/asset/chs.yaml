  \ '%s\\n' {1..3},item_{1..3}\n```\n\n## 查看部分或全部内容\n\n在本章中，你将学习如何在终端内查看文件内容。如果内容太长，你可以选择一次查看一屏内容，或者只获取输入的开头/结尾部分。用于这些目的的命令还有其他功能，本章也将讨论其中一些功能。\n\
  \n> ![info](img/file0.svg) [example_files](https://github.com/learnbyexample/cli-computing/tree/master/example_files)\
  \ 包含了本章使用的示例文件。\n\n## cat\n\n`cat` 命令的名字来源于 **concatenate**（连接）。它主要用于合并多个文件的内容并保存到文件中或作为另一个命令的输入。\n\
  \n常用选项所示：\n\n- `-n` 在每行输入前前加上行号和一个制表符。\n- `-b` 类似于 `-n`，但不对空行进行编号。\n- `-s` 将连续的空行压缩为单个空行。\n\
  - `-v` 使用[脱字符符号](https://en.wikipedia.org/wiki/ASCII_control_characters#Control_code_chart)\
  \ 查看如 NUL 等特殊字符。\n- `-e` 查看特殊字符并标记行尾。\n- `-A` 包含 `-e` 并有助于识别制表符。\n\n以下是展示 `cat`\
  \ 主要用途的示例。可以提供一个或多个文件作为参数。\n\n\n\n\n\n*   使用 `↑` 和 `↓` 方向键向上或向下移动一行\n    *   你也可以使用\
  \ `k` 和 `j` 键（与 Vim 编辑器中使用的键相同）\n*   使用 `f` 和 `b` 键向前或向后移动一屏内容\n    *   `Space`\
  \ 键也可以向前移动一屏\n*   鼠标滚动可向上或向下移动几行\n*   `g` 或 `Home` 跳转到文件开头\n*   `G` 或 `End` 跳转到文件末尾\n\
  *   `/pattern` 后按 `Enter` 键正向搜索指定的模式\n    *   pattern 指的是正则表达式，取决于你系统中的正则库\n   \
  \ *   在我的系统中，该变体是扩展正则表达式 (ERE)\n    *   更多详情请参见 `man re_format`\n*   `?pattern`\
  \ 后按 `Enter` 键反向搜索指定的模式\n*   `n` 跳到下一个匹配项\n*   `N` 跳到上一个匹配项\n*   `q` 退出\n\n例如，使用\
  \ `less /usr/share/dict/words` 打开字典文件并练习上述讨论的命令。如果你的帮助页 `pager` 设置为 `less`，你也可以尝试使用\
  \ `man ls` 进行练习。\n\n与 `cat` 命令类似，你可以使用 `-s` 选项来压缩连续的空行。但与 `cat -n` 不同，你需要使用 `less\
  \ -N` 来显示行号。小写的 `-n` 选项将关闭行号。\n\n## 延伸阅读\n*   `less` 命令是 `more` 命令的[改进版本](https://unix.stackexchange.com/q/604/109046)\n\
  *   [unix.stackexchange: most, more 和 less 之间的区别](https://unix.stackexchange.com/q/81129/109046)\n\
  *   我的 [Vim 参考指南](https://github.com/learnbyexample/vim_reference) 电子书\n\n## tail\n\
  \n默认情况下，`tail` 显示输入文件的最后 10 行。如果输入少于 10 行，则只显示这些。你可以使用 `-n` 选项来更改显示的行数。通过使用 `tail\
  \ -n +N`，你可以获取从第 `N` 行开始的所有行。\n\n这是一个用于说明的示例文件：\n\n```\ncat sample.txt \n1) Hello\
  \ World\n2) \n3) Hi there\n4) How are you\n5) \n6) Just do-it\n7) Believe it\n8)\
  \ \n9) banana\n10) papaya\n11) mango\n12) \n13) Much ado about nothing\n14) He he\
  \ he\n15) Adios amigo\n```\n\n以下是使用 `-n` 选项的一些示例：\n\n```bash\n# 最后两行（输入有 15 行）\n\
  tail -n2 sample.txt\n14) He he he\n15) Adios amigo\n\n# 从第 11 行开始的所有行\n# -n 和 +N\
  \ 之间的空格可选的\ntail -n +11 sample.txt\n11) mango\n12) \n13) Much ado about nothing\n\
  14) He he he\n15) Adios amigo\n```\n\n如果你传递多个输入文件，每个文件将被分别处理。默认情况下，输出带有文件名头和空行分隔符，格式良好，你可以使用\
  \ `-q`（安静）选项来覆盖它。\n\n```bash\ntail -n2 fruits.txt sample.txt \n== fruits.txt <==\n\
  papaya\nbanana\n\n== sample.txt <==\n14) He he he\n15) Adios amigo\n```\n\n`-c`\
  \ 选项的作用与 `-n` 选项类似，但处理的是字节而不是行：\n\n```bash\n# 最后三个字节\n# 注意输入没有以换行符结束\nprintf 'apple\
  \ pie' | tail -c3\npie\n\n## 从第五个字节开始\nprintf 'car\\njeep\\nbus\\n' | tail -c +5\n\
  jeep\nbus\n```\n\n## 延伸阅读\n*   [wikipedia: 使用 tail -f 和 -F 选项监控文件](https://en.wikipedia.org/wiki/Tail_(Unix)#File_monitoring)\n\
  *   [unix.stackexchange: tail -f 选项是如何工作的？](https://unix.stackexchange.com/q/18760/109046)\n\
  *   [如何处理输出缓冲？](https://mywiki.wooledge.org/BashFAQ/009)\n\n## head\n\n默认情况下，`head`\
  \ 显示输入文件的前 10 行。如果输入少于 10 行，则只显示这些行。你可以使用 `-n` 选项来更改行数。通过使用 `head -n -N`，你可以获取除最后\
  \ `N` 行以外的所有输入。\n\n```bash\n## 前三行\nhead -n3 sample.txt\n1) Hello World\n2) \n3)\
  \ Hi there\n\n# 除最后的 11 行\nhead -n -11 sample.txt\n1) Hello World\n2) \n3) Hi there\n\
  4) How are you\n```\n\n你可以通过结合 `head` 和 `tail` 命令来选择特定的行范围。\n\n```bash\n# 第 9 到第\
  \ 11 行\n# 如：tail -n +9\nhead -n11 sample.txt | tail -n +9\n9) banana\n10) papaya\n\
  11) mango\n```\n\n如果你传递多个输入文件，每个文件将被分别处理。默认情况下，输出带有文件名头和空行分隔符，格式良好，你可以使用 `-q`（安静）选项来覆盖它。\n\
  \n```bash\nprintf '1\\n2\\n' | head -n1 greeting.txt\n== greeting.txt <==\n1\n```\n\
  \n`-c` 选项的作用与 `-n` 选项类似，但处理的是字节：\n\n```bash\n## 前三个字节\nprintf 'apple pie' | head\
  \ -c3\napp\n\n## 排除最后的四个字节\nprintf 'car\\njeep\\nbus\\n' | head -c -4\ncar\njeep\n\
  ```\n\n## 练习\n\n![info](img/file0.svg) 使用 [example_files/text_files](https://github.com/learnbyexample/cli-computing/tree/example_files/text_files)\
