  \ `locate` 命令的工作原理为什么比等效 `find` 命令快？\n\n## 文件属性\n\n在本章中，你将学习如何查看文件详情，如行数和字数、文件和磁盘大小、文件类型、提取路径部分等。你还将学习如何更改文件属性，如时间戳和权限。\n\
  \n> ![info](img/file0.svg) [example_files](https://github.com/learnbyexample/cli-computing/tree/master/example_files)\
  \ 目录在本章使用的脚本和示例输入文件。\n\n## wc\n\n`wc` 命令通常用于统计给定输入的行数、字数和字符数。这里是一些基本示例：\n\n```\n\
  [](#cb223-1)# 进入 'example_files/text_files' 目录\n[](#cb223-2)$ cat greeting.txt\n\
  [](#cb223-3)Hi there\n[](#cb223-4)Have a nice day\n[](#cb223-5)\n[](#cb223-6)# 默认情况下，给出行/字/字节计数（按此顺序）\n\
  [](#cb223-7)$ wc greeting.txt\n[](#cb223-8) 2  6 25 greeting.txt\n[](#cb223-9)\n\
  [](#cb223-10)# 仅获取指定的计数\n[](#cb223-11)$ wc -l greeting.txt\n[](#cb223-12)2 greeting.txt\n\
  [](#cb223-13)$ wc -w greeting.txt\n[](#cb223-14)6 greeting.txt\n[](#cb223-15)$ wc\
  \ -c greeting.txt\n[](#cb223-16)25 greeting.txt\n[](#cb223-17)$ wc -wc greeting.txt\n\
  [](#cb223-18) 6 25 greeting.txt\n```\n\n对于标准输入数据，不会打印文件名。这对于脚本目的将结果保存到变量中有帮助。\n\n\
  ```\n[](#cb224-1)$ wc -l <greeting.txt\n[](#cb224-2)2\n```\n\n字数基于空格分隔。你可以对输入进行预处理，防止某些非空白字符影响结果。可以使用\
  \ `tr` 来删除特定的字符集（该命令将在杂文本处理工具$ echo 'apple ; banana ; cherry' | wc -w\n[](#cb225-2)5\n\
  [](#cb225-3)\n[](#cb225-4)# 删除除字母和空白以外的字符\n[](#cb225-5)# -d 选项用于删除，-c 选项补充给定的集\n\
  [](#cb225-6)$ echo 'apple ; banana ; cherry' | tr -cd 'a-zA-Z[:space:]'\n[](#cb225-7)apple\
  \  banana  cherry\n[](#cb225-8)$ echo 'apple ; banana ; cherry' | tr -cd 'a-zA-Z[:space:]'\
  \ | wc -w\n[](#cb225-9)3\n```\n\n如果你向 `wc` 命令传递多个文件，每个文件的计数值将单独显示。你还会在最后得到一个摘要，汇总了所有输入文件的计数总和。\n\
  \n```\n[](#cb226-1)$ wc greeting.txt fruits.txt sample.txt\n[](#cb226-2)  2   6\
  \  25 greeting.txt\n[](#cb226-3)  3   3  20 fruits.txt\n[](#cb226-4) 15  38 183\
  \ sample.txt\n[](#cb226-5) 20  47 228 total\n```\n\n你可以使用 `-L` 选项报告输入中最长行的长度（不包括行的换行符）。注意\
  \ `-L` 不会计算不可打印字符，制表符会被转换为相应的空格。多字节字符和[字符簇](https://unicode.org/reports/tr29/#Grapheme_Cluster_Boundaries)每个将被计为\
  \ `1`（取决于区域设置，它们也可能变为不可打印）。\n\n```\n\n[](#cb227-1)$ echo 'apple' | wc -L\n[](#cb227-2)5\n\
  [](#cb227-3)\n[](#cb227-4)$ echo 'αλεπού' | wc -L\n[](#cb227-5)11\n[](#cb227-6)\n\
  [](#cb227-7)$ wc -L <greeting.txt\n[](#cb227-8)15\n```\n\n如果输入包含多字节字符，请使用 `-m` 代替\
  \ `-c`。\n\n```\n[](#cb228-1)$ printf 'αleidiu' | wc -c\n[](#cb228-2)12\n[](#cb228-3)\n\
  [](#cb228-4)$ printf 'αleidiu' | wc -m\n[](#cb228-5)6\n```\n\n## du\n\n`du` 命令帮助你估计文件和目录的大小。默认情况下，以\
  \ 1024 字节为单位。递归报告所有目录和子目录，但忽略文件。如果应该报告文件，可以使用 `-a` 选项。如果要跟随符号链接，则需要显式选项（在这种情况下为\
  \ `-L`）。\n\n```\n[](#cb229-1)# 进入 'scripts' 目录并执行 'du.sh' 脚本\n[](#cb229-2)$ source\
  \ du.sh\n[](#cb229-3)\n[](#cb229-4)# n * 1024 bytes\n[](#cb229-5)$ du\n[](#cb229-6)28\
  \      ./projects/scripts\n[](#cb229-7)48      ./projects\n[](#cb229-8)8       ./todos\n\
  [](#cb229-9)7536    .\n```\n\n使用 `-s` 选项显示总目录大小，而不进入子目录。添加 `-c` 选项在最后也显示总大小。\n\n\
  ```\n[](#cb230-1)$ du -s projects report.log\n[](#cb230-2)48      projects\n[](#cb230-3)7476\
  \    report.log\n[](#cb230-4)\n[](#cb230-5)$ du -sc projects report.log\n[](#cb230-6)48\
  \      projects\n[](#cb230-7)7476    report.log\n[](#cb230-8)7524    total\n```\n\
  \n这里是一些说明格式选项的示例：\n\n```\n[](#cb231-1)# 字节数\n[](#cb231-2)$ du -b report.log\n[](#cb231-3)7654321\
  \ report.log\n[](#cb231-4)\n[](#cb231-5)# n * 1024 bytes\n[](#cb231-6)$ du -k report.log\n\
  [](#cb231-7)7476    report.log\n[](#cb231-8)\n```\n\n`-h` 选项以人类可读的方式报告大小（使用 1024\
  \ 的幂）。使用 `--si` 获取 1000 的幂的结果。\n\n\n\n\n\n```\n# 进入 'scripts' 目录并源化 'stat.sh' 脚本\n\
  $ source stat.sh\n\n# %x 输出最后访问时间\n$ stat -c '%x' ip.txt\n2022-06-01 13:25:18.693823117\
  \ +0530\n\n# %y 输出最后修改时间\n$ stat -c '%y' ip.txt\n2022-05-24 14:39:41.285714934 +0530\n\
  \n# %s 输出文件大小（字节）\n# \\n 用于获取换行符\n# %i 输出 inode 值\n# 等同于: stat --printf='%s\\n%i\\\
  n' ip.txt\n$ stat -c $'%s\\n%i' ip.txt\n10\n787224\n\n# %N 输出带引号的文件名\n# 如果输入是链接，也会显示其指向的路径\n\
  $ stat -c '%N' words.txt\n'words.txt' -> '/usr/share/dict/words'\n```\n\n你也可以传递多个文件参数：\n\
  \n```bash\n# %s 输出文件大小（字节）\n## %n 输出文件名\n$ stat -c '%s %n' ip.txt hi.sh\n10 ip.txt\n\
  21 hi.sh\n```\n\n> ![info](img/file0.svg) ![warning](img/file1.svg) 获取文件详情时应优先使用\
  \ `stat` 命令而不是解析 `ls -l` 的输出。请参考 [mywiki.wooledge: avoid parsing output of ls](https://mywiki.wooledge.org/ParsingLs)\
  \ 和 [unix.stackexchange: why not parse ls?](https://unix.stackexchange.com/q/128985/109046)\
  \ 获取解释和其他替代方案。\n\n## touch\n\n如前，`touch` 命令帮助你修改文件的时间戳。你可以根据当前时间、传递参数、从另一个文件复制值等来实现。\n\
  \n默认情况下，`touch` 将访问时间和修改时间都更新为当前时间。你可以使用 `-a` 仅更改访问时间，使用 `-m` 仅更改修改时间。\n\n```bash\n\
  # 进入 'scripts' 目录并源化 'touch.sh' 脚本\n$ source touch.sh\n\n# 最后访问和修改时间\n$ stat -c\
  \ $'%x\\n%y' fruits.txt\n2017-07-19 17:06:01.523308599 +0530\n2017-07-13 13:54:03.576055933\
  \ +0530\n\n# 将访问和修改值更新为当前时间\n$ touch fruits.txt \n$ stat -c $'%x\\n%y' fruits.txt\n\
  2022-06-14 13:01:25.921205889 +0530\n2022-06-14 13:01:25.921205889 +0530\n```\n\n\
  你可以使用 `-r` 选项将一个文件的时间戳复制到另一个文件。`-d` 和 `-t` 选项允许你直接作为命令的一部分指定时间戳。\n\n```bash\n$ stat\
  \ -c '%y' hi.sh\n2022-06-14 13:00:46.170416890 +0530\n\n# 将 'ip.txt' 的修改时间复制到 'hi.sh'\n\
  $ touch -m -r ip.txt hi.sh\n$ stat -c '%y' hi.sh\n2022-05-24 14:39:41.285714934\
  \ +0530\n\n# 将时间戳作为参数\n$ touch -m -d '2000-01-01 00:00:01' hi.sh\n$ stat -c '%y'\
  \ hi.sh\n2000-01-01 00:00:01.000000000 +0530\n```\n\n正如在管理文件和目录 章节所示，如果目标文件不存在，`touch`\
  \ 会创建一个新文件。你可以使用 `-c` 选项来防止这种行为。\n\n```bash\n$ ls report.txt\nls: cannot access\
  \ 'report.txt': No such file or directory\n$ touch report.txt\n$ ls report.txt\n\
  report.txt\n\n$ touch -c xyz.txt\n$ ls xyz.txt\nls: cannot access 'xyz.txt': No\
  \ such file or directory\n```\n\n## file\n\n`file` 命令帮助你识别文本编码（ASCII、UTF-8 等）、文件是否可执行等。\n\
  \n以下是一些示例，展示了 `file` 命令如何处理不同类型的行为：\n\n```bash\n# 进入 'scripts' 目录并源化 'file.sh' 脚本\n\
  $ source file.sh\n$ ls -F\nhi.sh*  ip.txt  moon.png  sunrise.jpg\n\n$ file ip.txt\
  \ hi.sh\nip.txt: ASCII text\nhi.sh: Bourne-Again shell script, ASCII text executable\n\
  \n$ printf 'αλεπού\\n' | file -\n/dev/stdin: UTF-8 Unicode text\n\n$ printf 'hi\\\
  r\\n' | file -\n/dev/stdin: ASCII text, with CRLF line terminators\n```\n\n图像文件的示例：\n\
  \n```bash\n# 为了演示'sunrise.jpg' 的输出进行了折行\n$ file sunrise.jpg moon.png\nsunrise.jpg:\
  \ JPEG image data, standard baseline 3 (JFIF), offset 21), 640x480, 3:1, progressive\
  \ 0\nmoon.png: PNG image data, 100x100, 8-bit greyscale, alpha GATLR chunk 09\n\
  ```\n\n\n\n\n\n在上述输出中，最后一行显示的 10 个字符与文件类型和权限有关。第一个字符表示`file type`。最常见的类型如下所示：\n\n\
  - `-` 普通文件\n- `d` 目录\n- `l` 符号链接\n\n其他九个字符代表三组`file permissions`，分别对应`user` (`u`)、`group`\
  \ (`g`) 和 `others` (`o`)，顺序如下：\n\n- `user` — 文件所有者\n- `group` — 组中具有文件访问权限的用户\n\
  - `others` — 其他所有人\n\n本节将仅讨论 `rwx` 文件属性。对于其他类型的属性，请参阅 [coreutils 手册：文件权限](https://www.gnu.org/software/coreutils/manual/coreutils.html#File-permissions)。\n\
  \n### 文件权限参考对照表：\n\n| 字符 | 含义 | 数值 |\n| --- | --- | --- |\n| `r` | 读 | `4` |\n|\
  \ `w` | 写 | `2` |\n| `x` | 执行 | `1` |\n| `-` | 无权限 | `0` |\n\n这里是一个显示文件权限的 `rwx`\
  \ 形式和数值表示法的示例：\n\n```\n[](#cb251-1)$ stat -c '%A' ip.txt\n[](#cb251-2)-rw-rw-r--\n\
  [](#cb251-3)\n[](#cb251-4)# r(4) + w(2) + 0 = 6\n[](#cb251-5)# r(4) + 0 + 0 = 4\n\
  [](#cb251-6)$ stat -c '%a' ip.txt\n[](#cb251-7)664\n```\n\n> ![info](img/file0.svg)\
  \ 注意，目录的权限理解并不直观。如果一个目录只有 `x` 权限，你可以 `cd` 进入它，但无法读取其内容（例如使用 `ls`）。如果一个目录只有 `r` 权限，你无法\
  \ `cd` 进入它，但能够读取其内容（会提示“无法访问”错误）。出于这个原因，`rx` 权限几乎总是同时启用或禁用的。\n\n`w` 权限允许你在 `x` 激活的情况下添加或删除内容。\n\
  \n### 修改所有三类别的权限\n\n你可以为 `ugo` 提供数字（按该顺序）来更改权限。通过示例来理解最为清晰：\n\n```\n[](#cb252-1)$\
  \ printf '#!/bin/bash\\n\\necho hi\\n' > hi.sh\n[](#cb252-2)$ stat -c '%a %A' hi.sh\n\
  [](#cb252-3)664 -rw-rw-r--\n[](#cb252-4)\n[](#cb252-5)# r(4) + w(2) + x(1) = 7\n\
  [](#cb252-6)# r(4) + 0 + x(1) = 5\n[](#cb252-7)$ chmod 755 hi.sh\n[](#cb252-8)$\
  \ stat -c '%a %A' hi.sh\n[](#cb252-9)755 -rwxr-xr-x\n```\n\n这是一个针对目录的示例：\n\n```\n\
  [](#cb253-1)$ mkdir dot_files\n[](#cb253-2)$ stat -c '%a %A' dot_files\n[](#cb253-3)775\
  \ drwxrwxr-x\n[](#cb253-4)\n[](#cb253-5)$ chmod 700 dot_files\n[](#cb253-6)$ stat\
  \ -c '%a %A' dot_files\n[](#cb253-7)700 drwx------\n```\n\n你也可以使用 `mkdir -m` 代替上面看到的\
  \ `mkdir+chmod` 组合。`-m` 选项的参数接受与 `chmod` 相同的语法（包括接下来将讨论的格式）。\n\n```\n[](#cb254-1)$\
  \ mkdir -m 750 backups\n[](#cb254-2)$ stat -c '%a %A' backups\n[](#cb254-3)750 drwxr-x---\n\
  ```\n\n> ![info](img/file0.svg) 你可以使用 `chmod -R` 递归更改权限。如果你只想对通过某些标准筛选的文件应用更改，请使用\
  \ `find+exec`。\n\n### 修改特定类别的权限\n\n你可以通过使用这些符号赋值（`=`）、添加（`+`）或移除（`-`）一个或多个 `rwx`\
  \ 权限。这取决于 `umask` 的值：\n\n```\n[](#cb255-1)$ umask\n[](#cb255-2)0002\n```\n\n`umask`\
  \ 值 `0002` 表示：\n\n- 不带 `ugo` 前缀的读和执行权限影响所有三个类别\n- 不带 `ugo` 前缀的写权限仅影响 `user` 和 `group`\
  \ 类别\n\n以下是一些不带 `ugo` 前缀的示例：\n\n```\n[](#cb256-1)# 移除所有类别的执行权限\n[](#cb256-2)$ chmod\
  \ -x hi.sh\n[](#cb256-3)\n[](#cb256-4)# 仅为 'user' 和 'group' 添加写权限（注：此处逻辑在实际操作中通过\
  \ chmod +w 实现，但受 umask 影响）\n```\n*(注：此处原文示例逻辑为基于 umask 环境的演示，翻译仅保留描述)*\n\n```\n\
  [](#cb256-4)# 仅为 'user' 和 'group' 添加写权限\n[](#cb256-5)$ chmod +w ip.txt\n[](#cb256-6)\n\
  [](#cb256-7)$ touch sample.txt\n[](#cb256-8)$ chmod 702 sample.txt\n[](#cb256-9)#\
  \ 为所有类别赋予读权限\n[](#cb256-10)# 如果有写/执行权限，将被移除\n[](#cb256-11)$ chmod =r sample.txt\n\
  [](#cb256-12)$ stat -c '%a %A' sample.txt\n[](#cb256-13)444 -r--\n```\n*(注：此处为翻译注释)*\n\
  \n这里是一些带 `ugo` 前缀的示例。你可以使用 `a` 代表所有类别。例如，`a+w` 等同于 `ugo+w`。\n\n```\n[](#cb257-1)#\
  \ 移除 'others' 的读写权限\n[](#cb257-2)$ chmod o-rw sample.txt\n[](#cb257-3)# 为 'group'\
  \ 和 'others' 添加执行权限\n[](#cb257-4)$ chmod go+x hi.sh\n```\n\n### 扩展阅读\n\n- [Linux\
  \ 权限](https://danielmiessler.com/study/linux_permissions/)\n- [unixexchange：为什么\
  \ chmod +w 没有权限](https://stackexchange.com/q/42921/1094)\n\n## 练习\n\n> ![info](img/file0.svg)\
  \ 使用 [example_files/text_files](https://github.com/learnbyexample/cli-computing/tree/master/example_files/text_files)\
  \ 目录作为输入文件，除非另有说明。\n> ![info](img/file0.svg) 创建一个临时目录用于练习，完成后可以删除。\n\n**1)** 将 `greeting.txt`\
  \ 的行数保存到变量 `lines`。\n\n```\n[](#cb259-1)# ???\n[](#cb259-2)$ echo \"$lines\"\n[](#cb259-3)2\n\
  ```\n\n**2)** 你认为以下命令的输出是什么？\n\n```\n[](#cb260-1)$ echo 'dragons:2 ; unicorns:10'\
  \ | wc -w\n```\n\n**3)** 使用合适的选项和参数获取如下所示的输出。\n\n```\n[](#cb261-1)$ printf 'apple\\\
  nbanana\\ncherry' | wc # ???\n[](#cb261-2)     15     183 sample.txt\n[](#cb261-3)\
  \      2      19 -\n[](#cb261-4)     17     202 total\n```\n\n**4)** 查阅 `wc` 手册并使用合适的选项和参数获取如下所示的输出。\n\
  \n```\n[](#cb262-1)$ printf 'greeting.txt\\scores.csv' | wc # ???\n[](#cb262-2)2\
  \ 6 25 greeting.txt\n[](#cb262-3)4 4 70 scores.csv\n[](#cb262-4)6 10 95 total\n\
  ```\n\n**5)** `wc -c` 和 `wc -m` 选项之间的区别是什么？你会用哪个选项获取最长行的长度？\n\n**6)** 找到以 `.log`\
  \ 结尾的文件并以人类可读的格式报告大小。第一种情况使用 `find+du` 组合，第二种情况使用 `ls` 命令（配合合适的 shell 功能）。\n\n```\n\
  [](#cb263-1)# 进入 'scripts' 目录并执行 'du.sh'\n[](#cb263-2)$ source du.sh\n[](#cb263-3)\n\
  [](#cb263-4)# ??? find+du\n[](#cb263-5)16K     ./projects.errors.log\n[](#cb263-6)7.4M\
  \    ./report.log\n[](#cb263-7)\n[](#cb263-8)# ??? ls and shell features\n[](#cb263-9)\
  \ 16K projects/errors.log\n[](#cb263-10)7.4M report.log\n```\n\n**7)** 以 `1000`\
