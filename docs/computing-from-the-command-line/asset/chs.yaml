  \ gzip 的 `-z`、bzip 的 `-j` 以及用于 xz 的 `-J`。\n\n# Shell 特性\n\n本章重点介绍 Bash 特性，如引用机制、通配符、重定向、命令分组、进程替换、命令替换等。其他内容将在后面的章节讨论。\n\
  \n[example_files](https://github.com/learnbyexample/cli-computing/master/example_files)\
  \ 目录包含了本章使用的脚本和示例输入文件。\n\n本章中的一些示例使用了将在后续章节讨论的命令。这里添加了对此类命令的基本描述，你还会在后续章节中看到更多示例。\n\
  \n## 引用机制\n\n本节将引用 bash 手册中的相关定义，并为四种机制中的每种提供一些示例。\n\n### 1) 转义字符\n\n> 1) 转义字符\n\
  \n未加引号的反斜杠 `\\` 是 Bash 的转义字符。它会保留后续后续字符的字面值，换行符除外。\n\n**元字符**: 一种在未加引号时会分隔单词的字符。元字符是空格、制表符、换行符或以下字符之一：`|`、`&`、`;`、`(`、`)`、`<`\
  \ 或 `>`。\n\n这是一个未引号 shell 元字符导致错误的示例：\n\n```\n$ echo apple;cherry\napple\ncherry:\
  \ command not found\n# 使用 \\; 可以帮助你将 ';' 用作普通字符使用\n$ echo apple\\;\napple;cherry\n\
  ```\n\n这里是一个更微妙的、一眼可能察觉不到的问题示例：\n\n```\n# 这将创建两个名为 'new' 和 'file.txt' 的文件\n# 目标是创建一个名为\
  \ 'new file.txt' 的文件\n$ touch new file.txt\n$ ls new*txt\nls: cannot access 'new*txt':\
  \ No such file or directory\n$ rm file.txt new\n# 转义空格将创建一个名为 'new file.txt' 的文件\n\
  $ touch new\\ file.txt\n$ ls new*txt\nfile.txt\n$ rm new\\ file.txt\n```\n\n###\
  \ 2) 单引号\n\n> 2) 单引号\n\n将字符封装在单引号（`'`）中可以保留引号内每个字符的字面值。单引号之间不允许出现单引号，即使前面有反斜杠也不行。\n\
  \n在单引号字符串内，没有任何字符是特殊的。这里有一个示例：\n\n```\n$ echo 'apple;cherry'\napple;cherry\n```\n\
  \n你可以将由不同引用机制表示的字符串放在一起以将它们拼接在一起。这是一个示例：\n\n```\n# 四个字符串的拼接\n$ echo 'apple' \"cherry\"\
  banana'orange'\napplecherrybananaorange\n```\n\n### 3) 双引号\n\n> 3) 双引号\n\n将字符封装在双引号（`\"\
  `）中可以保留引号内每个字符的字面值，但 `$`、`` ` `` 和 `!` 除外。\n\n这是一个显示变量扩展的示例：\n\n```\n$ qty='5'\n\
  $ echo \"$qty\"\n5\n```\n\n除非你明确想让 shell 解析特殊字符，否则你应该始终对变量加引号以避免问题。\n\n```bash\n\
  $ f='new.txt'\n$ ls f*\nnew.txt\n```\n\n### 4) ANSI-C 引用\n\n> 4) ANSI-C 引用\n\n形式如\
  \ `$'string'` 的单词会被特殊对待。该单词展开为字符串，其中反斜杠转义字符按照 ANSI 标准进行替换。\n\n这种形式的引用帮助你使用转义序列，如用于制表符的\
  \ `\\t`、用于换行的 `\\n` 等。你还可以八进制和十六进制格式的代码点值表示字符。\n\n```\n# 也可以使用 echo -e 'fig:\\t42'\
  \ 或 printf 'fig:\\t42\\n'\n$ echo $'fig:\\t42'\nfig:    42\n# \\x27 代表十六进制格式的单字符\n\
  $ echo $'@fruits = \\x27apple and banana\\x27'\n@fruits = 'apple and banana'\n#\
  \ 'grep' 帮助根据给定模式过滤行\n# 但它不识别像 '\\t' 这样的制表符转义字符\n$ printf 'fig\\t42\\napple 100\\\
  nball\\t20\\n' | grep '\\t'\n# 在这种情况下，解决方法是使用 ANSI-C 引用\n$ printf 'fig\\t42\\napple\
  \ 100\\nball\\t20\\n' | grep $'\\t'\nfig     42\nball    20\n```\n\n\n\n\n\n> ![info](img/file0.svg)\
  \ 查看 [bash 手册：ANSI-C Quoting](https://www.gnu.org/software/bash/manual/bash.html#ANSI_002dC-Quoting)\
  \ 获取支持的转义序列完整列表。查看 `man ascii` 获取 ASCII 字符及其数值表示的表。\n\n## 通配符 (Wildcards)\n\n当文件名较少时，将完整文件名作为命令参数相对容易。你可以使用制表符补全和鼠标中键点击（粘贴上次高亮的文本）等功能来辅助此类操作。\n\
  \n但如果你必须处理几十、上百个文件（甚至更多）该怎么办？如果适用，一种方法是根据文件名中的共同模式匹配所有文件，例如 `.py`、`.txt` 等扩展名。通配符（globs）在这种情况下大有裨益。此功能由\
  \ shell 提供，因此单个命令不需要担心实现它们。通配符支持的模式匹配与正则表达式某些之处相似，但它们之间存在根本性的和语法上的差异。\n\n下面列出了一些常用的通配符：\n\
  \n- `*` 匹配任意字符，重复零次或多次\n  - 作为特殊情况，除非设置了 `dotglob` shell 选项，否则 `*` 不匹配隐藏文件开头的 `.`\n\
  - `?` 匹配任意字符，恰好一次\n- `[set149]` 匹配这些字符中的任意一个\n- `[^set149]` 匹配*除*给定字符集之外的字符\n  -\
  \ 你也可以使用 `[!set149]` 来取反字符类\n- `[a-z]` 匹配从 `a` 到 `z` 的范围内的字符\n- `[0-9a-fA-F]` 匹配任意十六进制字符\n\
  \n这里是一些示例：\n\n```bash\n[](#cb90-1)# 切到 'scripts' 目录并加载 'globs.sh' 脚本\n[](#cb90-2)$\
  \ source globs.sh\n[](#cb90-3)$ ls\n[](#cb90-4)100.sh   f1.txt      f4.txt    hi.sh\
  \   math.h         report-02.log\n[](#cb90-5)42.txt   f2_old.txt  f7.txt    ip.txt\
  \  notes.txt      report-04.log\n[](#cb90-6)calc.py  f2.txt      hello.py  main.c\
  \  report-00.log  report-98.log\n[](#cb90-7)\n[](#cb90-8)# 以 'c' 或 'h' 或 't' 开头\n\
  [](#cb90-9)$ ls [cht]*\n[](#cb90-10)calc.py  hello.py  hi.sh\n[](#cb90-11)\n[](#cb90-12)#\
  \ 仅隐藏文件和目录\n[](#cb90-13)$ ls -d .*\n[](#cb90-14).  ..  .hidden  .somerc\n[](#cb90-15)\n\
  [](#cb90-16)# 以 '.c' 或 '.py' 结尾\n[](#cb90-17)$ ls *.c *.py\n[](#cb90-18)calc.py\
  \  hello.py  main.c\n[](#cb90-19)\n[](#cb90-20)# 包含 'o' 且后面跟着 'x' 或 'y' 或 'z'\n\
  [](#cb90-21)$ ls *o*[xyz]*\n[](#cb90-22)f2_old.txt  hello.py  notes.txt\n[](#cb90-23)\n\
  [](#cb90-24)# 以 '.' 和另外两个字符结尾\n[](#cb90-25)$ ls *.??\n[](#cb90-26)100.sh  calc.py\
  \  hello.py  hi.sh\n[](#cb90-27)\n[](#cb90-28)# 不以 'f' 开头并以 '.txt' 结尾\n[](#cb90-29)$\
  \ ls [^f]*.txt\n[](#cb90-30)42.txt  ip.txt  notes.txt\n[](#cb90-31)\n[](#cb90-32)#\
  \ 包含数字 '1' 到 '5' 并以 'log' 结尾\n[](#cb90-33)$ ls *[1-5]*log\n[](#cb90-34)report-02.log\
  \  report-04.log\n```\n\n由于某些字符在字符类内部是特殊的，你需要通过特殊的放置位置来将它们视为普通字符：\n\n- `-` 应该是集合中的第一个或最后一个字符\n\
  - `^` 不应该是是第一个字符\n- `]` 应该是第一个字符\n\n```bash\n[](#cb91-1)$ ls *[ns-]*\n[](#cb91-2)100.sh\
  \  main.c     report-00.log  report-04.log\n[](#cb91-3)hi.sh   notes.txt  report-02.log\
  \  report-98.log\n[](#cb91-4)\n[](#cb91-5)$ touch 'a^b' 'mars[planet].txt'\n[](#cb91-6)$\
  \ rm -i *[]^]*\n[](#cb91-7)rm: remove regular file 'a^b'?\n[](#cb91-8)rm: remove\
  \ regular file 'mars[planet].txt'?\n```\n\n`命名字符集` 由 `[:` 和 `]` 之间的名称定义，必须在字符类 `[]`\
  \ 中使用，并根据需要带有其他字符。\n\n| 命名集合 | 描述 |\n| :--- | :--- |\n| `[:digit:]` | `[0-9]` |\n\
  | `[:lower:]` | `[a-z]` |\n| `[:upper:]` | `[A-Z]` |\n| `[:alpha:]` | `[a-zA-Z]`\
  \ |\n| `[:alnum:]` | `[0-9a-Z]` |\n| `[:word:]` | `[0-9a-Z_]` |\n| `[:xdigit:]`\
