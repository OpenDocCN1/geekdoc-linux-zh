  | `+(pattern-list)` | 匹配给定模式的一次或多次出现 |\n| `@(pattern-list)` | 匹配给定模式中的之一 |\n| `!(pattern-list)`\
  \ | 匹配除给定模式外的任何内容 |\n\n扩展通配符（Extended globs）默认是禁用的。你可以使用内置命令 `shopt` 来设置/取消 shell\
  \ 选项，如 `extglob`、`globstar` 等。你也可以检查这些选项的当前状态。\n\n```\n[](#cb96-1)$ shopt extglob\
  \ \n[](#cb96-2)extglob         off\n[](#cb96-3)\n[](#cb96-4)# set extglob\n[](#cb96-5)$\
  \ shopt -s extglob \n[](#cb96-6)$ shopt extglob \n[](#cb96-7)extglob         on\n\
  [](#cb96-8)\n[](#cb96-9)# unset extglob\n[](#cb96-10)$ shopt -u extglob \n[](#cb96-11)$\
  \ shopt extglob \n[](#cb96-12)extglob         off\n```\n\n以下是一些示例，假设 `extglob` 选项已经设置：\n\
  \n```\n[](#cb97-1)# 切到 'scripts' 目录并加载 'globs.sh' 脚本\n[](#cb97-2)$ source globs.sh\n\
  [](#cb97-3)$ ls\n[](#cb97-4)100.sh   f1.txt      f4.txt    hi.sh   math.h      \
  \   report-02.log\n[](#cb97-5)42.txt   f2_old.txt  f7.txt    ip.txt  notes.txt \
  \     report-04.log\n[](#cb97-6)calc.py  f2.txt      hello.py  main.c  report-00.log\
  \  report-98.log\n[](#cb97-7)\n[](#cb97-8)# 一个或多个数字，后跟 '.'，然后是零或多个字符\n[](#cb97-9)$\
  \ ls +([0-9]).*\n[](#cb97-10)100.sh  42.txt\n[](#cb97-11)\n[](#cb97-12)# 等同于：ls\
  \ *.c *.sh\n[](#cb97-13)$ ls *.@(c|sh)\n[](#cb97-14)100.sh  hi.sh  main.c\n[](#cb97-15)\n\
  [](#cb97-16)# 不以 '.txt' 结尾\n[](#cb97-17)$ ls !(*.txt)\n[](#cb97-18)100.sh   hello.py\
  \  main.c  report-00.log  report-04.log\n[](#cb97-19)calc.py  hi.sh     math.h \
  \ report-02.log  report-98.log\n[](#cb97-20)\n[](#cb97-21)# 不以 '.txt' 或 '.log' 结尾\n\
  [](#cb97-22)$ ls *.!(txt|log)\n[](#cb97-23)100.sh  calc.py  hello.py  hi.sh  main.c\
  \  math.h\n```\n\n如果你启用了 `globstar` 选项，就可以可以在指定路径内递归匹配文件名。\n\n```\n[](#cb98-1)#\
  \ 切到 'scripts' 目录并加载 'ls.sh' 脚本\n[](#cb98-2)$ source ls.sh\n[](#cb98-3)\n[](#cb98-4)#\
  \ 使用 'find' 命令（这将在后面的章节中解释）\n[](#cb98-5)$ find -name '*.txt'\n[](#cb98-6)./todos/books.txt\n\
  [](#cb98-7)./todos/outing.txt\n[](#cb98-8)./ip.txt\n[](#cb98-9)\n[](#cb98-10)# 启用\
  \ 'globstar'\n[](#cb98-11)$ shopt -s globstar\n[](#cb98-12)$ ls **/*.txt\n[](#cb98-13)ip.txt\
  \  todos/books.txt  todos/outing.txt\n[](#cb98-14)\n[](#cb98-15)# 另一个示例\n[](#cb98-16)$\
  \ ls -1 **/*.@(py|html)\n[](#cb98-17)backups/bookmarks.html\n[](#cb98-18)hello_world.py\n\
  [](#cb98-19)projects/tictactoe/game.py\n```\n\n> ![info](img/file2.svg) 如果你想在终端启动时应用这些设置，请将\
  \ `shopt` 调用添加到 `~/.bashrc` 中。这将在 Shell 定制 章节中讨论。\n\n## set\n\n内置命令 `set` 帮助你设置或取消\
  \ shell 选项和位置参数的值。以下是一些 shell 选项的示例：\n\n```\n[](#cb99-1)# 从现在开始停止记录命令历史\n[](#cb99-2)$\
  \ set +o history\n[](#cb99-3)# 启用历史记录\n[](#cb99-4)$ set -o history\n[](#cb99-5)\n\
  [](#cb99-6)# 使用 vi 风格的 CLI 编辑界面\n[](#cb99-7)$ set -o vi\n[](#cb99-8)# 使用 emacs 风格界面，这通常是默认值\n\
  [](#cb99-9)$ set -o emacs\n```\n\n你将在后面的章节中看到更多示例（例如 `set -x`）。请参阅 [bash 手册：Set\
  \ Builtin](https://www.gnu.org/software/bash/manual/bash.html#The-Set-Builtin) 文。\n\
  \n## Pipelines\n\n管道控制运算符 `|` 帮助你将一个命令的输出作为另一个命令的输入。该运算符极大减少了对临时中间文件的需求。正如之前在 Unix\
  \ 哲学 节中所讨论的，命令行工具专注于单一任务。如果你能将一个问题分解为更小的任务，管道运算符将经常派上用场。以下是一些示例：\n\n```\n[](#cb100-1)#\
  \ 切到 'scripts' 目录并加载 'du.sh' 脚本\n[](#cb100-2)$ source du.sh\n[](#cb100-3)\n[](#cb100-4)#\
  \ 文件列表\n[](#cb100-5)$ ls\n[](#cb100-6)projects  report.log  todos\n[](#cb100-7)#\
  \ 统计文件数量\n[](#cb100-8)# 你也可以使用：printf '%q\\n' * | wc -l\n[](#cb100-9)$ ls -q | wc\
  \ -l\n[](#cb100-10)3\n[](#cb100-11)\n[](#cb100-12)# 以人类可读的格式报告文件/文件夹的报告\n[](#cb100-13)#\
  \ 然后根据人类可读的大小按升序排序\n[](#cb100-14)$ du -sh * | sort -h\n[](#cb100-15)8.0K    todos\n\
  [](#cb100-16)48K     projects\n[](#cb100-17)7.4M    report.log\n```\n\n在上面的示例中，`ls`\
  \ 和 `du` 分别执行它们显示文件列表和显示文件大小的任务。之后，`wc` 和 `sort` 命令分别负责计算行数和排序。在这种情况下，管道运算符节省了你处理临时数据的麻烦。\n\
  \n注意，`printf` 中的 `%q` 格式指定符可以帮助你以某种方式对参数进行引用，这种方式是 shell 识别的。`%q` 格式指定符可以帮助你以 shell\
  \ 识别的方式转义参数。\n\n> ![info](img/file2.svg) 从此处开始。管道控制运算符 `|` 将在后面的章节中讨论。\n\n### tee\n\
  \n有时，你可能希望在显示命令输出的同时也记录结果。在这种情况下，你可以使用 `tee` 命令：\n\n```\n[](#cb101-1)$ du -sh *\
  \ | tee sizes.log\n[](#cb101-2)8.0K    todos\n[](#cb101-3)48K     projects\n[](#cb101-4)7.4M\
  \    report.log\n[](#cb101-5)\n[](#cb101-6)$ cat sizes.log\n[](#cb101-7)8.0K   \
  \ todos\n[](#cb101-8)48K     projects\n[](#cb101-9)7.4M    report.log\n[](#cb101-10)$\
  \ rm sizes.log\n```\n\n## Redirection\n\n来自 [bash 手册：Redirection](https://www.gnu.org/software/bash/manual/bash.html#Redirection)：\n\
  \n> 在命令执行之前，其输入和输出可以使用特殊符号进行重定向。重定向允许句柄被复制、关闭、指向不同的文件，并可以更改命令读取和写入的文件。\n\n有三个流：\n\
  \n*   **标准输入** (`stdin` —— 文件符 0）\n*   **标准输出** (`stdout` —— 文件符 1）\n*   **标准错误**\
  \ (`stderr` —— 文件符 2）\n\n标准输出和错误默认都显示在终端上。`stderr` 流在命令出现问题时使用。这三个流都如上面所述具有预定义的文件符。在本节中，你将看到如何重定向这三个流。\n\
  \n> ![info](img/file2.svg) 重定向可以放在任何位置，但通常放在命令的开头或结尾。例如，以下两个命令是等效的：\n\n>\n\n> ```\n\
  [](#cb102-1)>op.txt grep 'error' report.log\n[](#cb102-2)\n[](#cb102-3)grep 'error'\
  \ report.log >op.txt\n> ```\n\n### 重定向输出\n\n你可以使用 `>`运算符将命令的标准输出重定向到文件。`>`运算符可以添加数字前缀以处理特定的文件符。默认是\
  \ `1`（记得 `stdout` 的文件符是 `1`），因此 `1>` 和 `>` 执行相同的操作。使用 `>>` 将输出追加到文件。\n\n如果 `>` 和\
  \ `>>` 运算符提供的文件名不存在，则将创建它。如果文件已存在，`>` 将覆盖该文件，而 `>>` 将将内容追加到该文件。\n\n\n\n\n\n```bash\n\
  # 本节切换到 'example_files/text_files' \n# 将 'sample.txt' 的前三行保存到 'op.txt'\n$ head -n3\
  \ sample.txt > op.txt\n$ cat op.txt\n1) Hello World\n2) \n3) Hi there\n\n# 将 'sample.txt'\
  \ 的最后两行追加到 'op.txt'\n$ tail -n2 sample.txt >> op.txt\n$ cat op.txt\n1) Hello World\n\
  2) \n3) Hi there\n14) He he he\n15) Adios amigo\n\n$ rm op.txt\n```\n\n> ![info](img/file0.svg)\
  \ 你可以使用 `/dev/null` 作为文件名来丢弃输出、为命令提供空文件等。\n\n> ![info](img/file2.svg) 你可以使用 `set\
  \ noclobber` 来防止在文件已存在时进行覆盖。当设置了 `noclobber` 选项，你仍然可以使用 `>|` 代替 `>` 操作来覆盖文件。\n\n\
  ### 重定向输入\n\n某些命令如 `tr` 和 `datamash` 只能处理来自标准输入（stdin）的数据。当你从另一个命令管道传输数据时，这并不是问题，例如：\n\
  \n```bash\n# 从输入文件 'greeting.txt' 中过滤包含 'the' 的行\n# 然后使用 'tr' 命令将结果显示为大写\n$ grep\
  \ 'the' greeting.txt | tr 'a-z' 'A-Z'\nHI THERE\n```\n\n如果你想将数据从文件传递给此类命令，可以使用 `<`\
  \ 重定向运算符。这里的默认前缀是 `0`，它是 `stdin` 数据的句描述符。这是一个示例：\n\n```bash\n$ tr 'a-z' 'A-Z' <greeting.txt\n\
  HI THERE\nHAVE A NICE DAY\n```\n\n在某些情况下，工具处理 `stdin` 数据的行为与处理文件输入有所不同。这里有一个使用 `wc\
  \ -l` 报告输入总行数的示例：\n\n```bash\n## 行数计数，文件名也是输出的一部分\n$ wc -l purchases.txt\n8 purchases.txt\n\
  \n# 对于 stdin 数据，文件名不会是输出的一部分\n# 这利于在脚本编写中将数字赋值给变量\n$ wc -l <purchases.txt\n8\n```\n\
  \n有时，你需要将 `stdin` 数据以及其他文件输入传递给命令。在这种情况下，你可以使用 `-` 来代表来自标准输入的数据。这是一个示例：\n\n```bash\n\
  $ cat scores.csv\nName,Maths,Physics,Chemistry\nIth,100,100,100\nCy,97,98,95\nLin,78,83,80\n\
  \n## 在开头插入一列\n$ printf 'ID\\n1\\n2\\n3' | paste -d, - scores.csv\nID,Name,Maths,Physics,Chemistry\n\
  1,Ith,100,100,100\n2,Cy,97,98,95\n3,Lin,78,83,80\n```\n\n即使命令直接接受文件输入作为参数，重定向也可以对交互式使用很有帮助。这里有一个示例：\n\
  \n```bash\n## 只显示第三字段\n$ <scores.csv cut -d, -f3\nPhysics\n100\n98\n83\n\n## 稍后，你发现你也需要第一个字段\n\
  # 使用“向上'方向键调出之前的命令\n## 并方便地在末尾修改参数\n# 如果你之前使用的是 cut -d, -f3 scores.csv，\n# 你必须越过文件名才能修改参数\n\
  $ <scores.csv cut -d, -f1,3\nName,Physics\nIth,100\nCy,98\nLin,83\n```\n\n> ![info](img/file0.svg)\
  \ ![warning](img/file1.svg) 不要使用 `cat filename | cmd` 将文件内容作为 `stdin` 数据传递，除非你需要合并来自多个输入文件的数据。更多信息请参阅\
  \ [wikipedia: UUOC](https://en.wikipedia.org/wiki/Cat_(Unix)#Useless_use_of_cat)\
  \ 和 [Useless Use of Cat Award](https://porkmail.org/era/unix/award.html)。\n\n###\
  \ 重定向错误\n\n记得 `stderr` 的文件描述符是 `2`。因此，你可以使用 `2>` 将标准错误重定向到文件。如果需要追加内容，请使用 `2>>`。这是一个示例：\n\
  \n```bash\n# 假设 'abcdxyz' 不是一个 shell 命令\n$ abcdxyz\nabcdxyz: command not found\n\
  \n# 在这种情况下，错误将是 stderr 流的一部分，而不是 stdout\n## 所以你在这里需要使用 2>\n$ abcdxyz 2> cmderror.log\n\
  $ cat cmderror.log\nabcdxyz: command not found\n\n$ rm cmderror.log\n```\n\n> ![info](img/file0.svg)\
  \ 如果你需要丢弃结果，请使用 `/dev/null` 作为文件名。\n\n### 合并 stdout 和 stderr\n\n较版本的 Bash 提供了这些方便的快捷方式：\n\
  \n* `&>` 重定向 `stdout` 和 `stderr`（覆盖现有文件）\n* `&>>` 重定向 `stdout` 和 `stderr`（追加到现有文件）\n\
  * `|&` 将 `stdout` 和 `stderr` 都作为输入管道传输到另一个命令\n\n这里的示例假设 `xyz.txt` 不存在，从而导致错误：\n\n\
  ```bash\n# 使用 '>' 只重定向 stdout 流\n## stderr 将显示在终端上\n$ grep 'log' file_size.txt xyz.txt\
  \ >\ngrep: xyz.txt: No such file or directory\n\n# '&>' 将同时重定向 stdout 和 stderr\n\
  $ grep 'log' file_size.txt xyz.txt > op.txt\n$ cat op.txt\nfile_size.txt:104K\n\
  file_size.txt:746K\ngrep: xyz.txt: No such file or directory\n```\n\n这里是使用 `|&`\
  \ 操作符的示例：\n\n```bash\n# 从给定文件中过滤包含 'log' 的行\n# 然后从 stdout 和 stderr 中过滤包含 'or' 的行\n\
  $ grep 'log' file_size.txt xyz.txt |& grep 'or'\nfile_size.txt:746K\n: xyz.txt:\
  \ No No\n```\n\n对于较旧版本，你必须手动重定向：\n\n* `1>&2` 将 `stdout` (`stdout`) 重定向到 `stderr`\
  \ (`stderr`)\n* `2>&1` 将 `stderr` (`stderr`) 重定向到 `stdout` (`stdout`)\n\n这里有一些示例：\n\
  \n```bash\n## 注意，这里重定向的顺序很重要\n# 你也可以使用: 2> op.txt 1>&1\n$ grep 'log' file_size.txt\
  \ xyz.txt > op.txt 2>&1\n$ cat op.txt\nfile_size.txt:104K\nfile_size.txt:746K\n\
  grep: xyz.txt: No such file or directory\n\n$ rm op.txt\n\n$ grep 'log' file_size.txt\
  \ xyz.txt 2>&1 | grep 'or'\nfile_size.txt:746K\n```\n\n### 等待 stdin\n\n有时，你可能输入错了命令但没有提供输入。你看到的不是错误信息，而是光标在耐心地等待着什么。这并不是\
  \ shell 挂起了你。命令正在等待你输入数据，以便它可以执行任务。\n\n假设你输入了 `cat` 并按了回车键。看到闪烁的光标，你输入了一些文本并再次按了回车键。你会看到刚刚输入的文本作为\
  \ `stdout` 回显显示给你（这是 `cat` 命令的功能）。这将一直持续下去，直到你告诉 shell 你已完成。如何操作呢？在空行按 `Ctrl+d`，或者在行尾连续按两次\
  \ `Ctrl+d`。在后一种情况下，数据末尾不会得到一个换行符。\n\n\n\n\n\n```\n# 输入所有需要的字符后，按 Enter 键和 Ctrl+d\n\
  $ cat\nknock knock\nknock knock\nanybody here?\nanybody here?\n\n# 这里的 'tr' 命令将小写转换为大写\n\
  $ tr 'a-z' 'A-Z'\nknock knock \nKNOCK KNOCK\nanybody here?\nANYBODY HERE?\n```\n\
  \n> ![info](img/file0.svg) 在每行输入后立即获得输出取决于命令的功能。诸如 `sort` 和 `shuf` 等命令会等待整个输入数据完成后产生输出。\n\
  \n> ```\n# 在第三行输入后，按 Ctrl+d\n$ sort\nlion\nzebra\nbee\nbee\nlion\nzebra\n```\n\n\
  这是一个包含输出重定向的示例：\n\n```\n# 在包含 'histogram' 的行之后，按 Ctrl+d\n# 过滤包含 'is' 的行\n$ grep\
  \ 'is' > op.txt\nhi there\nthis is a sample line\nhave a nice day\nhistogram\n\n\
  $ cat op.txt\nthis is a sample line\nhistogram\n\n$ rm op.txt\n```\n\n> ![info](img/file0.svg)\
  \ 另见 [unix.stackexchange: Ctrl+c 和 Ctrl+d 的区别](https://unix.stackexchange.com/q/16333/109046)。\n\
  \n### Here Documents (在此文档)\n\nHere Documents 是另一种提供 `stdin` 数据的方法。在这种情况下，终止条件是匹配预定义字符串的行，该字符串指定在\
  \ `<<` 重定向运算符之后。这对于自动化特别有用，因为交互式地按下 `Ctrl+d` 并不理想。这里有一个示例：\n\n```\n# EOF 通常作为特殊字符串\n\
  $ cat << 'EOF' > fruits.txt\n> banana 2\n> papaya 3\n> mango  10\n> EOF\n\n$ cat\
  \ fruits.txt\nbanana 2\npapaya 3\nmango  10\n$ rm fruits.txt\n```\n\n在上面的示例中，终止字符串被包含在单引号中以防止参数扩展、命令替换等。你也可以使用\
  \ `\\string` 用于此目的。如果你使用 `<<-` 而不是 `<<`，可以在输入行的开头添加制表符，而它们不会成为实际数据的一部分。\n\n> ![info](img/file0.svg)\
  \ 就像 `$` 和一个空格代表主提示符（`PS1` 壳变量），行开头的 `>` 和空格代表次级提示符 `PS2`（适用于多行命令）。在壳脚本中使用 Here\
  \ Documents 时，不要输入这些字符。\n\n> ![info](img/file0.svg) 请参 [bash manual: Here Documents](https://www.gnu.org/software/bash/manual/bash.html#Here-Documents)\
  \ 和 [stackoverflow: here documents](https://stackoverflow.com/q/2953081/4082052)\
  \ 以获取更多示例和细节。\n\n### Here Strings (在此字符串)\n\n这与 Here Documents 类似，但不使用终止字符串。重定向运算符是\
  \ `<<<`。以下是一些示例：\n\n```\n$ tr 'a-z' 'A-Z' <<< hello\nHELLO\n$ tr 'a-z' 'A-Z' <<<\
  \ 'hello world'\nHELLO WORLD\n\n$ greeting='hello world'\n$ tr 'a-z' 'A-Z' > op.txt\
  \ <<< \"$greeting\"\n$ cat op.txt\nHELLO WORLD\n$ rm op.txt\n```\n\n### 扩展阅读\n\n\
  * [shell 重定向简介绍](https://mywiki.wooledge.org/BashGuide/InputAndOutput#Redirection)\n\
  * [图解重定向教程](https://wiki.bash-hackers.org/howto/redirection_tutorial)\n* [stackoverflow:\
  \ 使用 >& 将流重定向到另一个文件描述符](https://stackoverflow.com/q/818255/4082052)\n* [2>&1 >foo\
  \ 和 >foo 2>&1 的区别](https://mywiki.wooledge.org/BashFAQ/055)\n* [stackoverflow: 将标准输出和标准错误重定向并追加到文件](https://stackoverflow.com/q/876239/4082052)\n\
  * [unix.stackexchange: <> 重定向的示例](https://unix.stackexchange.com/q/164391/109046)\n\
  \n## 命令分组\n\n你可以使用 `(list)` 和 `{ list; }` 复合命令为多个命令重定向内容。前者在子壳中执行，而后者在当前上下文中执行。参考自\
  \ [bash: Lists](https://mywiki.wooledge.org/BashFAQ/055):\n\n```\n## 分组命令\n(list)\n\
  { list; }\n```\n\n你可以使用 `(list)` 和 `{ list; }` 复合命令为多个命令重定向内容。前者在子壳中执行，而后者在当前上下文中执行。\n\
  \n\n\n\n\n```bash\n# 因为第一个命令执行成功，第二个命令将不会运行\n$ echo 'hello' || echo 'have a nice\
  \ day'\nhello\n\n# 假设 'abcdxyz' 不是一个 shell 命令\n# 因为第一个命令执行失败，第二个命令将运行\n$ abcdxyz\
  \ || echo 'have a nice day'\nabcdxyz: command not found\nhave a nice day\n```\n\n\
  ## 命令替换\n\n命令替换允许你将一个命令的标准输出作为另一个命令的一部分。末尾的换行符（如果有的话）将被移除。你可以使用较新且推荐的语法 `$(command)`\
  \ 或旧的语法 `` `command` ``。以下是一些示例：\n\n```bash\n## 示例输入\n$ printf 'hello\\ntoday is:\
  \ \\n'\nhello\ntoday is:\n#将 'date' 命令的输出追加到包含 'today' 的行后面\n$ printf 'hello\\ntoday\
  \ is: \\n' | sed '/today/ s/$/'\"$(date +%A)\"'/'\nhello\ntoday is: Monday\n\n#\
  \ 将 'wc' 命令的输出保存到变量\n# 等同于：line_count=`wc -l <sample.txt`\n$ line_count=$(wc -l\
  \ <sample.txt)\n$ echo \"$line_count\"\n15\n```\n\n这是一个带有嵌套替换的示例：\n\n```bash\n#\
  \ dirname 去末尾的路径组件\n$ dirname projects/tictactoe/game.py\nprojects/tictactoe\n#\
  \ basename 去前面的目录组件\n$ basename projects/tictactoe\ntictactoe\n\n$ proj=$(basename\
  \ $(dirname projects/tictactoe/game.py))\n$ echo \"$proj\"\ntictactoe\n```\n\n两种语法的区别摘引自\
  \ [bash 手册：命令替换](https://www.gnu.org/software/bash/manual/bash.html#Command-Substitution)：\n\
  \n> 当使用旧式的反引号形式进行替换时，反斜杠会保留其字面含义，除非其后紧跟着 `$`、`` ` `` 或 `\\`。第一个没有被反斜杠前面的反引号将结束命令替换。当使用\
  \ $(command) 形式时，括号之间的所有字符都构成命令；任何字符都不被视为特殊字符。\n\n> 命令替换可以嵌套。在在使用反引号形式进行嵌套时，请用反斜杠转义内部的反引号。\n\
  \n## 进程替换\n\n你可以使用进程替换的命令的输出来代替文件参数。语法为 `<(list)`。shell 将负责传递一个带有这些命令标准输出的文件名。这是一个示例：\n\
  \n```bash\n# 本节切换到 'example_files/text_files' 目录\n\n$ cat scores.csv\nName,Maths,Physics,Chemistry\n\
  Ith,100,100,100\nCy,97,98,95\nLin,78,83,80\n\n# 也可以使用：paste -d, <(echo 'ID'; seq\
  \ 3) scores.csv\n$ paste -d, <(printf 'ID\\n1\\n2\\n3') scores.csv \nID,Name,Maths,Physics,Chemistry\n\
  1,Ith,100,100,100\n2,Cy,97,98,95\n3,Lin,78,83,80\n```\n\n对于上面的示例，你也可以使用 `-` 来表示管道数据的\
  \ `stdin`，正如前面的章节中所示。这里有一个使用了两个替换的示例。这本质上帮助你避免管理多个临时文件，类似于 `|` 管道运算符帮助处理单个临时文件一样。\n\
  \n```bash\n# 并排查看示例输入文件\n$ paste f1.txt f2.txt\n1       1\n2       hello\n3    \
  \   3\nworld   4\n\n# 此命令给出两个文件之间的共同行\n# 文件必须经过排序命令才能正常工作\n$ comm -12 <(sort f1.txt)\
  \ <(sort f2.txt)\n1\n3\n```\n\n> ![info](img/file0.svg) 查看[这个 unix.stackexchange\
  \ 线程](https://unix.stackexchange.com/q/609375/109046) 获取 `>(list)` 形式的示例。\n\n##\
  \ \n\n> ![info](img/file0.svg) 除非另有说明，否则使用 `globs.sh` 脚本进行通配符相关的练习。\n\n> ![info](img/file0.svg)\
  \ 为练习创建一个可能需要创建某些文件的临时目录。你可以在之后删除此类练习目录。\n\n**1)** 使用 `echo` 命令显示如下的文本。根据需要使用适当的引号。\n\
  \n```bash\n# ???\nthat's    great! $x = $y + $z\n```\n\n**2)** 使用 `echo` 命令按如下格式显示三个变量的值。\n\
  \n```bash\n$ n1=10\n$ n2=90\n$ op=100\n\n# ???\n10 + 90 = 100\n```\n\n**3)** 下面命令的输出将是什么？\n\
  \n```bash\n$ echo $'\\x22apple\\x22: \\x2710\\x27'\n```\n\n**4)** 列出以数字开头的文件。\n\n\
