  \     projects\n[](#cb264-3)7.7M    report.log\n[](#cb264-4)8.2k    todos\n[](#cb264-5)7.8M\
  \    total\n```\n\n**8)** `du --apparent-size` 选项的作用是什么？\n\n**9)** 什么时候你会使用 `df`\
