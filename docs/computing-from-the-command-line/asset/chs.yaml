  \ \nfig\ncarpet\njeep\nbus\n```\n\n\n\n\n## 9) 使用什么命令可以获得如下所示的输出？\n\n```\n[](#cb168-1)$\
  \ cat fruits.txt\n[](#cb168-2)banana\n[](#cb168-3)papaya\n[](#cb168-4)mango\n[](#cb168-5)$\
  \ cat blocks.txt\n[](#cb168-6)%=%=\n[](#cb168-7)apple\n[](#cb168-8)banana\n[](#cb168-9)%=%=\n\
  [](#cb168-10)brown\n[](#cb168-11)green\n[](#cb168-12)\n[](#cb168-13)# ???\n[](#cb168-14)banana\n\
