  \ 001.png)\nrename(25.png, 025.png)\nrename(3.png, 003.png)\n\n## 检查后移除 -n 选项以实际重命名文件\n\
  rename 's/\\d+/sprintf \"%03d\", $&/e' *.png\nls\n001.png  003.png  025.png  100.png\n\
  ```\n\n如果新文件名已经存在，你将得到错误，如果你愿意，可以使用 `-f` 选项覆盖它。如果你传递了包含路径组件的文件，可以使用 `-d` 选项仅影响文件名部分。否则，你使用的逻辑可能会影响目录名。\n\
  \n```bash\nmkdir projects\ntouch projects/toc.sh projects/reports.py\n\n## 目标是将文件名的非扩展名部分转换为大写\n\
  ## [^.]+ 匹配 1 或多个非 '.' 字符\n# \\U 将随后的字符转换为大写\n## $& 是匹配部分的反向引用\nrename -n -d 's/[^.]+/\\\
  U$&/' projects/*\nrename(projects/reports.py, projects/REPORTS.py)\nrename(projects/toc.sh,\
  \ projects/TOC.sh)\n\n## 没有 -d 选项，目录名也会受到影响\nrename -n 's/[^.]+/\\U$&/' projects/*\n\
  rename(projects/reports.py, PROJECTS/REPORTS.py)\nrename(projects/toc.sh, PROJECTS/TOC.sh)\n\
  ```\n\n## 延伸阅读\n\n* [perldoc: 正则表达式教程](https://perldoc.perl.org/perlretut)\n* 查看我的\
  \ [Perl 一行命令](https://github.com/learnbyexample/learn_perl_oneliners) 电子书，获取更多 Perl\
  \ 替换和 `rename` 命令的示例和细节\n\n## ln\n\n`ln` 命令帮助你在相同或不同位置创建指向另一个文件或目录的链接。链接有两种类型——**符号**链接和**硬**链接。符号链接可以指向文件和目录。以下是一些特性：\n\
  \n* 如果原始文件被删除或移动到另一个位置，符号链接将不再可用\n* 如果符号链接移动到另一个位置，如果使用绝对路径创建链接，则它将仍然有效（对于相对路径，将取决于该位置是否有另一个同名文件）\n\
  * 符号链接文件有它自己的 inode、权限、时间戳等\n* 当将原始文件或符号链接文件作为命令行参数时，某些命令的工作方式相同，而某些则需要额外的选项（例如\
  \ `du -L`）\n\n用法与 `cp` 命令类似。你必须先指定源，然后是目标（如果是当前工作目录，目标是可选的）。\n\n```bash\nmkdir practice_ln\n\
  cd practice_ln\n\n# 在当前目录创建链接时，目标是可选的\n## 创建符号链接需要 -s 选项\nln -s /usr/share/dict/words\n\
  \n## 如果需要，你也可以重命名链接\nln -s /usr/share/dict/words words.txt\nls\n```\n\n\n\n\n```bash\n\
  tar -tf bkp.tar.gz \nreport.log\nprojects/\nprojects/scripts/\nprojects/scripts/calc.sh\n\
  projects/errors.log\n```\n\n要解压 `.gz` 文件，你可以使用 `gunzip` 或 `gzip -d`。这会将压缩版本替换为解压后的归档文件：\n\
  \n```bash\n# 这个 '.gz' 文件将被解压后的版本覆盖\ngunzip bkp.tar.gz\n\n$ls -F\nbkp.tar  projects/\
  \  report.log  todos/\nls -sh bkp.tar\n7.4M bkp.tar\n```\n\n要从归档提取文件，请使用 `tar` 配合\
  \ `-x` 选项：\n\n```bash\nmkdir test_extract\nmv bkp.tar test_extract\ncd test_extract\n\
  ls\nbkp.tar\n\ntar -xf bkp.tar\ntree\n.\n├── bkp.tar\n├── projects\n│   ├── errors.log\n\
  │   └── scripts\n│       └── calc.sh\n└── report.log\n\n2 directories, 4 files\n\
  \ncd ..\nrm -r test_extract\n```\n\n使用 `GNU tar`，你可以配合 `tar` 命令进行压缩/解压，而无需单独使用 `gzip`\
  \ 等工具。例如，`-z` 选项将使用 `gzip`，`-j` 将使用 `bzip2`，`-J` 将使用 `xz`。如果你想让 `tar` 根据提供的扩展名自动选择压缩技术，请使用\
  \ `-a` 选项。\n\n```bash\nls -F\nprojects/  report.log  todos/\n\n# -z 提供了与 gzip 命令相同的压缩效果\n\
  tar -zcf bkp.tar.gz report.log projects\nls -sh bkp.tar.gz\n5.6M bkp.tar.gz\n\n\
  # 从压缩文件中提取原始文件\nmkdir test_extract\ncd test_extract\ntar -zxf ../bkp.tar.gz\ntree\n\
  .\n├── projects\n│   ├── errors.log\n│   └── scripts\n│       └── calc.sh\n└── report.log\n\
  \n2 directories, 3 files\n\ncd ..\nrm -r test_extract\n```\n\n`tar` 有许多适用于各种需求的选项。下面列出了部分，完整细节请参阅文档。\n\
  \n- `-v` 详细选项\n- `-r` 将文件追加到现有归档中\n- `--exclude=` 指定归档时要忽略的文件\n\n还有以 `z` 开头的命令用于处理压缩文件，例如：\n\
  \n- `zcat` 显示压缩文件的内容\n- `zless` 每次显示一屏内容来查看压缩文件的内容\n- `zgrep` 搜索压缩文件\n\n> ![info](img/file2.svg)\
  \ 如果你需要处理 `.zip` 文件，请使用 `zip` 和 `unzip` 命令。\n\n## 进阶阅读\n\n- [unix.stackexchange:\
