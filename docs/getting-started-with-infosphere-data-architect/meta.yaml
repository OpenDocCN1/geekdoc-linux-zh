    # **3.7 Summary**


    This chapter discussed the concept of logical data modeling, using IBM InfoSphere
    Data Architect to complete your task. You learned how to create data models with
    both the data diagram and the Data Project Explorer.


    The chapter also introduced topics like working with naming standards and working
