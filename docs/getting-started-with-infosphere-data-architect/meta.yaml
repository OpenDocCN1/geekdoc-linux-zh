    ## 图5.2 – 新建的物理数据模型及数据对象\n## 5.4 物理数据模型操作\n### 5.4.1 模型结构\n图5.3展示了物理数据模型的形态。\n\
    ## 图5.3 – 工作区中展示的物理数据模型\n\n所有物理数据模型均具备以下特征：\n- 文件扩展名：每个物理数据模型文件名的末尾扩展名为.dbm。\n\
    - 架构与数据库设计：\n  - 结构与逻辑数据模型大致相同。\n  - 如您之前所了解，逻辑数据模型包含单个包，您可以在包中存储子包、实体和图表。而物理数据模型会在数据库中存储信息，每个数据库可包含多个架构，每个架构又可包含多张数据表。\n\
    - 图表：\n  - 从逻辑数据模型转换图表时，您的设计会完整保留，包括备注、格式和关系，唯一差异是用于呈现新数据表、列及其他设计的数据对象的图标不同。\n\
    \  - 与逻辑数据模型一致，您可以创建物理数据模型图表，辅助您可视化并理解复杂数据模型的设计。\n- 存储图表：您可以创建图表来建模DB2数据库的存储结构，包含分区、表空间、缓冲池及其他存储对象。\n\
    - SQL语句：“SQL脚本”文件夹用于存储您在物理数据模型中创建的SQL脚本。如果您浏览物理数据模型，会发现您指定的所有原子域元素都会被迁移至新的物理数据模型中。\n\
    \n### 5.4.2 DB2存储建模\n**注释：** 使用IBM InfoSphere Data Architect时，您仅能对DB2 for Linux,\
    \ UNIX, and Windows数据库或DB2 for z/OS数据库进行存储建模。如需了解DB2存储模型的更多信息，请参阅本丛书中的*《DB2 Express-C入门》*。本章不会详细讲解存储建模的具体操作，因为本次创建的架构规模较小，但本节会介绍存储建模背后的基础概念，以及设计复杂数据模型存储结构时需要注意的信息。\n\
    \n#### 5.4.2.1 表空间\n数据库的数据存储在*表空间*中。表空间具有数据库供应商专属特性。\n**注释：** 如需了解DB2 for Linux,\
    \ UNIX, and Windows中表空间的更多信息，请访问以下网址：http://publib.boulder.ibm.com/infocenter/db2luw/v9r7/topic/com.ibm.db2.luw.admin.dbobj.doc/doc/c0004935.html\n\
    如需了解DB2 for z/OS中表空间的更多信息，请访问：http://publib.boulder.ibm.com/infocenter/dzichelp/v2r2/index.jsp?topic=/com.ibm.db2z.doc.gloss/src/gloss/db2z_gloss.htm\n\
    表空间通常有两种管理方式：\n- *系统管理的空间*：由操作系统管理表空间。容器被定义为操作系统文件，通过操作系统调用访问。这意味着操作系统负责以下操作：\n\
    \  - 输入输出缓冲\n  - 空间分配\n  - 表空间的自动扩展\n- *数据库管理的空间*：由数据库管理表空间。容器可被定义为文件（在空间创建时会按照指定大小完成全量分配），或定义为设备。当您使用DB2管理表空间时，DB2会负责以下操作：\n\
    \  - 输入输出缓冲（程度受分配方式和操作系统限制）\n  - 使用ALTER TABLESPACE语句时扩展容器\n  - 释放数据库管理容器的未使用部分\n\
    每个表空间至少包含一个容器。容器仅属于单个表空间（但一个表空间可包含多个容器）。仅当数据库已分区、且该分区尚未为对应表空间分配容器时，您才能向系统管理的表空间添加容器。向表空间添加容器时，数据会在所有容器间分布式存储。\n\
    配置表空间时，您需要考虑以下设置（可在表空间“属性”视图的“常规”选项卡中找到）：\n- *页面大小*：定义表空间所使用的页面大小。DB2支持的页面大小包括4K、8K、16K和32K。页面大小限制了可存储在表空间中的数据表的行长度和列数量。表空间的页面总数上限为16,777,216。选择更大的页面大小可提升表空间的容量。\n\
    - *扩展单元大小*：指定在切换到下一个容器之前，会写入单个容器的页面数量。数据存储时，数据库管理器会循环遍历所有容器。该设置仅在表空间包含多个容器时生效。\n\
    - *预取大小*：指定执行数据预取时，会从表空间读取的页面数量。预取会在查询实际引用数据前，就加载查询所需的数据，使得查询在执行输入输出操作时数据已准备就绪。当数据库管理器判断需要执行顺序输入输出、且预取数据可提升性能时，会触发预取操作。\n\
    **最佳实践：** 预取大小应设置为扩展单元大小与表空间容器数量的倍数。例如，若扩展单元大小为32，容器数量为4，则预取大小应为128、256或其他128的倍数。如果某张数据表使用频率较高，请为该表创建独立的表空间以提升性能。\n\
    - **开销与传输速率：** 决定查询优化过程中输入输出的成本。值以毫秒为单位计量，应为所有容器的平均值。*开销*是与输入输出控制器活动、磁盘寻道时间和旋转延迟相关的时间。*传输速率*是将页面读取到内存所需的时间。这些值可基于硬件规格计算得出。\n\
    \n#### 5.4.2.2 缓冲池\n*缓冲池*与单个数据库关联，可被多个表空间共用。为表空间创建缓冲池时，您需要确保该缓冲池服务的所有表空间的表空间大小与缓冲池页面大小保持一致。单个表空间仅能使用一个缓冲池。\n\
    充足的缓冲池大小是保障数据库性能的关键，因为其可减少磁盘的输入输出量，而磁盘输入输出是耗时最长的数据库操作。较大的缓冲池也会对查询优化产生影响，因为更多操作可在内存中完成。\n\
    \n#### 5.4.2.3 存储建模的性能影响\n设计架构或数据库的存储结构时，您应重点关注缓冲区的利用和输入输出并行度的最大化。请遵循以下任务流程，保障存储模型的高效性：\n\
    1. 确定数据表设计带来的限制条件。您可能需要使用多个常规表空间。\n2. 考虑将数据表放置在配置不同的大容量表空间中，是否可能提升性能。\n3. 设计试验性表空间。\n\
    4. 考虑使用缓冲池，其可能有助于优化您的表空间设计。\n5. 为表空间分配容器。\n6. 优化模型，并通过全面测试和基准测试验证设计的合理性。\n"
