    # Table 5.1 – Differences between logical and physical data models


    # 5.2 Creating a physical data model from scratch


    Ideally, you would first create a logical data model before you create a physical
    data model. This helps you keep the logical and physical designs separate, allowing
    you to modify data models at the logical level before you design the physical
    storage aspects of a database or schema.


    However, it is possible to create a blank physical data model within the workbench.


    > **Note:**


    The steps below are provided for reference only. You do not need to perform these
    steps to continue with the design of the student information system. In the next
    section, you will learn how to transform to the physical data model.


    To create a blank physical data model:


    +   1. Click *File -> New -> Physical Data Model*. The New Physical Data Model
    wizard opens.

    2. Complete the wizard. You can create a blank physical data model, or you can
    reverse-engineer an existing database, schema, or DDL script. Reverse-engineering
    is covered in a later chapter.

    3. Use the workbench to add data objects, such as tables, schemas, or columns.
    Right-click on various objects within the data model to see which data objects
    you can add from the context menu, or create a diagram to visualize these data
    objects and their relationships.


    # 5.3 Transforming a logical data model to a physical data model


    Instead of creating a physical data model from scratch, you will use the existing
    logical data model (`STUDENT_INFO_SYSTEM.1dm`) that you created in the previous
    chapters and transform it to a physical data model. The transformation process
    creates the physical design of a database or schema for you, which saves you the
    work of manually creating tables, columns, and other data objects.


    After you transform from the logical data model, you will add more specific properties
    to the physical data model and bring it one step closer to a functional, deployable
    data model.


    > **Note:**


    The data types that are mapped from one data model to another depend on what you
    have specified in the Preferences window. To ensure that data types are mapped
    correctly between the logical data model and the new physical data model:'
