    # 8.2 Building mappings within the workbench


    You can create mapping models from source logical and physical data models in
    your data design projects. Target models for your mapping models can be logical
    or physical data models or XML schemas.


    > **Restriction:** You cannot generate scripts from a source that is a logical
    data model. When you create mappings between logical data models and other sources
    or targets, it is only for publishing purposes; that is, you can only report on
    the mappings.


    # 8.2.1 Creating a blank mapping model


    Let''s create a new mapping model to map the objects in the `NEW_SDT_INFO_SYS.dbm`
    physical data model to the `STUDENT_INFO_SYSTEM.dbm` physical data model:


    +   1. Click *File* -> *New* -> *Mapping Model*. The Mapping Editor wizard opens.


    +   2. Complete the Create Mapping page:


    +   a. Make sure that the *University Info System* data design project is specified
    in the *Destination folder* field.


    +   b. In the *File name* field, specify `STUDENT_MAPPING.msl`.


    +   c. Make sure that the *Enable script generation for this model* option is
    selected, so that you can create SQL scripts to deploy your mappings.


    +   d. Click *Next*.


    +   3. Complete the Specify the Mapping Source page:


    +   a. Click the *Add* button. The Select a Mapping Source window opens.


    +   b. Select the `NEW_SDT_INFO_SYS.dbm` physical data model file, then click
    *OK*. The mapping source file is added to the *Mapping source files* list.


    +   c. Click *Next*.


    +   4. Do not change any of the options on the Specify the Mapping Source page,
    then click *Next*.


    +   5. Complete the Specify the Mapping Target page:


    +   a. Click the *Add* button. The Select a Mapping Target window opens.


    +   b. Select the `STUDENT_INFO_SYSTEM.dbm` physical data model file, then click
    *OK*. The mapping target file is added to the *Mapping target files* list.


    +   c. Make sure that all of the objects in the *Mapping target schemas* list
    are selected.


    +   d. Click *Next*.


    +   6. Verify your options on the New Mapping Model Summary page, then click *Finish*.


    The mapping model file is created in the *Mappings* folder of your data design
    project, and it opens in the editor view.'
