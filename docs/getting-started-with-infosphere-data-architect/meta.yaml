    # Chapter 1 – Introduction to IBM InfoSphere Data Architect


    # Data Architect


    IBM InfoSphere® Data Architect is an enterprise-level data modeling tool. It is
    a comprehensive development environment that you can use to model diverse and
    distributed data assets and also to find and establish relationships between those
    assets.


    In this chapter you will learn about the following concepts:


    +   - What is IBM InfoSphere Data Architect?

    - How to use the product

    - System requirements

    - How to install IBM InfoSphere Data Architect


    # 1.1 What is IBM InfoSphere Data Architect?


    Businesses today own vast amount of data and decisions are made based on data.
    The challenge for IT is clear: provide understanding of the data, improve data
    quality and consistency, and keep data design aligned with business intent and
    requirements. IBM InfoSphere Data Architect is a collaborative data design solution
    that helps you discover, model, relate, and standardize diverse and distributed
    data assets. Some of the key features and benefits of IBM InfoSphere Data Architect
    are listed below:


    +   - InfoSphere Data Architect discovers the structure of heterogeneous data
    sources by examining and analyzing the underlying metadata. Using an established
    Java Database Connectivity (JDBC) connection to the data sources, InfoSphere Data
    Architect explores their structures using native queries. With the user interface,
    users can easily browse through the hierarchy of data elements, facilitating an
    understanding of detailed properties for every element.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# 24 Getting started with InfoSphere Data Architect


    +   - InfoSphere Data Architect can create logical, physical, and domain models
    for DB2®, Informix®, Oracle, Sybase, Microsoft SQL Server, MySQL, and Teradata.
    Elements from logical and physical data models can be visually represented in
    diagrams using Information Engineering (IE) notation. Alternatively, physical
    data model diagrams can use the Unified Modeling Language (UML) notation. InfoSphere
    Data Architect enables data professionals to create physical data models from
    scratch, from logical models using transformation or from the database using reverse-engineering.


    IBM InfoSphere Data Architect can also create and work with both logical and physical
    multidimensional data models. As with logical and physical data models, you can
    create these models from scratch or reverse-engineer them from existing data sources.


    Note:


    Multidimensional modeling is not covered in this book. If you want to learn more
    conceptual information about multidimensional modeling visit the IBM InfoSphere
    Data Architect information center:


    http://publib.boulder.ibm.com/infocenter/ndahelp/v7r5/topic/com.ibm.datatools.dimensional.ui.doc/topics/c_ida_dm_container.html


    +   - Most development projects are iterative in nature, so it is important to
    be able to design incrementally and manage changes and their impact seamlessly.
    InfoSphere Data Architect allows users to do just that. Impact analysis lists
    all of the dependencies on the selected data elements. Advanced synchronization
    technology compares two models, model to database or two databases. Changes can
    then be promoted within and across data models and data sources. Use with Optim™
    Database Administrator to manage complex DB2 changes and data migrations without
    disruption.


    +   - InfoSphere Data Architect enables architects to define and implement standards
    that increase data quality and enterprise consistency for naming, meaning, values,
    relationships, privileges, privacy, and traceability. Define standards once and
    associate them with diverse models and databases. Built-in, extensible, rules-driven
    analysis verifies compliance to naming, syntax, normalization, and best practices
    standards for both models and databases.


    +   - Whether you are working on a small team where each member plays multiple
    roles or in a large distributed team with clearer delineation of responsibilities,
    you can use InfoSphere Data Architect as plug-in function to a shared Eclipse
    instance or share artifacts through standard configuration management repositories
    like Rational® Clear Case or Concurrent Versions System (CVS).'
  merge: -1
