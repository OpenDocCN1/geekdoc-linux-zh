  md: '# 44 Getting started with InfoSphere Data Architect


    > Note: The primary focus of this book is on forward-engineering. Reverse-engineering
    is also introduced to provide a full perspective of both data modeling and the
    capabilities of the product.


    More information about reverse-engineering is provided in Chapter 7 of this book.


    To develop and deploy databases in the workbench, you should use the following
    process:


    +   1. **Gather requirements for the project.** Speak with business process owners
    and determine what information is vital to the business. You can use this information
    to draft entities or tables and attributes or columns.


    +   2. **Use IBM InfoSphere Data Architect to create a logical data model.** The
    logical data model is the first part of the data modeling process, where you gather
    requirements and create entities and attributes. You will eventually use the logical
    data model to create a physical data model.


    As you design the logical data model, you can work with data diagrams to visualize
    the model and help you show business process owners how information is linked
    together. You refine this data model over time, improving the design as you speak
    with business process owners and further define what information must be modeled.


    +   3. **Use IBM InfoSphere Data Architect to transform the logical data model
    into a physical data model.** Work with the physical data model to draft physical
    storage, table spaces, indexes, or views. You can also use the physical data model
    to secure parts of the database that you create by implementing roles and users
    to deploy on the new database.


    As you refine your physical data model, you can continue to work with existing
    data diagrams that were transformed from the logical data model, or you can create
    new data diagrams to visually model your storage requirements.


    +   4. **Create a mapping model that defines the relationships between your data
    models and the target database.** Mapping models contain the information that
    defines the relationship between the source schemas that you create and their
    targets. This includes transformations, join conditions, filters, sort conditions,
    and annotations. Mapping models can find or document the relationships, and you
    can use a mapping model to generate statements that query or manipulate your data
    sources by using these relationships.


    > Note: As a best practice, make sure that your data models are stable before
    you create mapping'
