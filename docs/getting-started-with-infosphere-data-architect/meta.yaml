    # Chapter 6 – Generating Reports, Importing, and Exporting


    Reporting is an important feature of IBM InfoSphere Data Architect. The information
    provided by reports can be copied, printed, and distributed as one physical document.
    Reports are used to provide compliance information in many organizations.


    The Import/Export feature in IBM InfoSphere Data Architect helps you ensure that
    your data models are compatible with other data modeling, design, and reporting
    tools. The Import/Export feature allows you to import existing data models from
    compatible data modeling tools and export to compatible data modeling tools and
    formats.'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# ## 6.1 Reporting, importing, and exporting: The big picture


    When you create reports within the workbench, you can provide information on all
    or part of a model; that is, a list of objects and their relationships. IBM InfoSphere
    Data Architect provides a wide range of built-in reports or templates for your
    logical, physical, domain, and glossary models. *Figure 6.1* illustrates the big
    picture of reporting and import/export.


    ![](img/38311ad87170342fd88ee1165fee68b0_107_0.png)


    **Figure 6.1** – Reporting, importing, and exporting in the workbench


    The left side of *Figure 6.1* illustrates the import and export capabilities of
    IBM InfoSphere Data Architect. The *import* feature of IBM InfoSphere Data Architect
    allows you to convert the data model from another tool into either a physical
    data model or logical data model in IBM InfoSphere Data Architect. The *export*
    feature of IBM InfoSphere Data Architect allows you to convert either a physical
    data model or logical data model in IBM InfoSphere Data Architect to the format
    that is supported by other tool that you want to export the data model to.


    The right side of *Figure 6.1* illustrates the reporting capabilities of IBM InfoSphere
    Data Architect. You can generate reports for your logical, physical, domain, and
    glossary models in 6 different formats: HTML, PDF, PowerPoint, Excel, Word (.doc),
    and PostScript.


    > **Note**: You can only import or export physical or logical data models or domain
    models.'
  merge: -1
  pgno: 107
