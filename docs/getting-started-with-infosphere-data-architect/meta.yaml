    # ### 5.4.2 Storage modeling in DB2


    Storage modeling for DB2 involves creating *table spaces*, *partitions*, and *partition
    groups* of a database setup.


    > **Note:**


    With IBM InfoSphere Data Architect, you can only model the storage of a DB2 for
    Linux, UNIX, and Windows database, or DB2 for z/OS database.


    For more information about the DB2 storage model, refer to the book *Getting started
    with DB2 Express-C*, that is part of this book series.


    This chapter does not cover how to model storage in detail, because the schema
    we are creating is very small. However, this section does explain the basic concepts
    behind storage modeling and the information that you should keep in mind when
    you design the storage for complex data models.


    # #### 5.4.2.1 Table spaces


    The data for databases is stored in *table spaces*. Table spaces are database
    vendor-specific.


    > **Note:**


    To learn more about table spaces in DB2 for Linux, UNIX, and Windows, visit the
    following URL:

    http://publib.boulder.ibm.com/infocenter/db2luw/v9r7/topic/com.ibm.db2.luw.admin.dbobj.doc/doc/c0004935.html


    To learn more about table spaces in DB2 for z/OS:

    http://publib.boulder.ibm.com/infocenter/dzichelp/v2r2/index.jsp?topic=/com.ibm.db2z.doc.gloss/src/gloss/db2z_gloss.htm


    Table spaces are typically managed in one of two ways:'
  - "[PAGE 92]\n\n+   - *System-managed space*: The operating system will manage the\
    \ table spaces. Containers are defined as operating system files, and they are\
    \ accessed using operating system calls. This means that the operating system\
    \ handles the following actions:\n  - Buffering of input and output\n  - Space\
    \ allocation\n  - Automatic extension of the table space\n\n+   - *Database-managed\
    \ space*: The database manages the table spaces. Containers are defined as files,\
    \ which will be fully allocated with the size given when the space is created,\
    \ or as devices. When you use DB2 to manage your table spaces, it will handle\
    \ the following actions:\n  - Buffering of input and output (as much as the allocation\
    \ method and operating system allows)\n  - Extending containers when using ALTER\
    \ TABLESPACE\n  - Releasing unused portions of database-managed containers\n\n\
    Each table space has at least one container. A container belongs to a single table\
    \ space (but a table space can have more than one container). You can only add\
    \ a container to a system-managed table space when the database is partitioned,\
    \ and the partition does not yet have a container allocated for that table space.\
    \ When you add a container to a table space, the data is distributed across all\
    \ of the containers.\n\nWhen you specify a table space, you need to consider the\
    \ following settings (found on the General tab of the Properties view of the table\
    \ space):\n\n+   - *Page size*: Defines the size of pages that are used for the\
    \ table space. For DB2, the supported sizes include 4K, 8K, 16K, and 32K. The\
    \ page size limits the row length and column count of the tables that can be placed\
    \ in the table space. Table spaces are limited to 16,777,216 pages. Choosing a\
    \ larger page size increases the capacity of the table space.\n\n+   - *Extent\
    \ size*: Specifies the number of pages that will be written to a container before\
    \ the next container is used. The database manager cycles repeatedly through the\
    \ containers as data is stored. This setting only has an effect when there are\
    \ multiple containers for each table space.\n\n+   - *Prefetch size*: Specifies\
    \ the number of pages that are read from the table space when data prefetching\
    \ is performed. Prefetching draws data that is needed by a query before they are\
    \ actually referenced by the query. This allows the query to have the data ready\
    \ when data input or output is performed. Prefetching is selected by the database\
    \ manager when it determines that it needs to use sequential input and output,\
    \ and prefetching the data will improve performance."
  - '[PAGE 93]


    # **Best practice:**


    Set the prefetch size as a multiple of the extent size value and the number of
    table space containers. For example, if your extent size is 32 and there are 4
    containers, then the prefetch size should be 128, 256, or other multiples of 128.
    If a table is used often, create a separate table space for that table to improve
    performance.


    +   - **Overhead and transfer rate:** Determines the cost of input and output
    during query optimization. Values are measured in milliseconds, and they should
    be the average for all containers. *Overhead* is the time that is associated with
    input-output controller activity, disk seek time, and rotational latency. The
    *transfer rate* is the amount of time that is needed to read a page into memory.
    These values can be calculated based on hardware specifications.


    # **5.4.2.2 Buffer pools**


    A *buffer pool* is associated with a single database, and it can be used by more
    than one table space. When you create a buffer pool for a table space, you must
    ensure that the table space size and the buffer pool page size are the same for
    all of the table spaces that the buffer pool services. A table space can use only
    one buffer pool.


    Adequate buffer pool size is essential to good database performance, because it
    reduces the amount of input and output by the disk, which is the most time-consuming
    database operation. Large buffer pools also have an effect on query optimization,
    because more of the work can be done in memory.


    # **5.4.2.3 Performance implications of storage modeling**


    When you design the storage of a schema or database, you should focus primarily
    on utilizing buffers and maximizing the amount of parallelism for input and output.
    Use the following task flow to ensure that your storage models are efficient:


    +   1. Determine the constraints given by the table designs. You might have to
    use more than one regular table space.

    2. Consider whether having the tables in large table spaces with different settings
    is likely to increase performance.

    3. Design a tentative table space.

    4. Consider using buffer pools, which might help you improve upon your table space
    design.

    5. Allocate containers to the table spaces.

    6. Refine the model, and verify that your design is solid by thoroughly testing
    and benchmarking the model.'
- md: "As a general rule, start out with the simplest design. Only allow complexity\
    \ if and when performance is impacted.\n\n## **5.5 Refining the physical data\
    \ model**\n\nNow that we have transformed a logical data model into a physical\
    \ data model, we should make some final refinements before we generate the DDL\
    \ to deploy the database. First, we will rearrange the columns of the STUDENT\
    \ table into a more logical order. Then, we will create a role and add a user\
    \ to the database.\n\n### 5.5.1 Rearranging columns in a physical data model\n\
    \nWhen you created the logical data model, you were more concerned with modeling\
    \ *what* attributes and data characteristics must go into each entity. Let's rearrange\
    \ the columns of the STUDENT table to make the object more easily understood to\
    \ an end user. To rearrange the columns, perform the following steps:\n1. Select\
    \ the STUDENT table under the STUDENT_LIFE schema. The properties of the table\
    \ display in the Properties view.\n2. Open the Columns tab of the Properties view.\n\
    3. Rearrange the columns to identify vital student information first:\n   a. Make\
    \ the FIRST_NAME column the first column in the table. Select the FIRST_NAME column,\
    \ then press the Move Column Up arrow (↑) to place it first in the table. The\
    \ columns should now look like the image in *Figure 5.4*.\n   ![](img/38311ad87170342fd88ee1165fee68b0_94_0.png)\n\
    \   **Figure 5.4 – Rearranging columns in a table**\n   b. Make the LAST_NAME\
    \ column the second column in the table by moving it under the FIRST_NAME column.\n\
    \   c. Make the STUDENT_SSN column the fourth column in the table.\n   d. Make\
    \ the EMAIL_ADDR column the fifth column in the table. The columns should be in\
    \ the order displayed in *Figure 5.5*.\n   ![](img/38311ad87170342fd88ee1165fee68b0_95_0.png)\n\
    \   **Figure 5.5 – The proper order of the columns in the table**\n4. Save your\
    \ work.\n\n### 5.5.2 Creating roles within the physical data model\n\nRoles simplify\
    \ the administration and management of privileges. A *role* is a database object\
    \ that groups together one or more privileges and can be assigned to users, groups,\
    \ PUBLIC, or other roles. Roles provide several advantages that make it easier\
    \ to manage privileges in a database system:\n- **Security administrators** (SECADM)\
    \ can control access to their databases in a way that mirrors the structure of\
    \ their organizations. They can create roles in the database that map directly\
    \ to the job functions in their organizations.\n- **Users** are granted membership\
    \ in the roles that reflect their job responsibilities. As their job responsibilities\
    \ change, their membership in roles can be easily *granted* and *revoked*.\n-\
    \ The assignment of privileges is simplified. Instead of granting the same set\
    \ of privileges to each individual user in a particular job function, the administrator\
    \ can grant this set of privileges to a role that represents that job function\
    \ and then grant that role to each user in that job function.\n- A role's privileges\
    \ can be updated and all users who have been granted that role receive the update.\
    \ The administrator does not need to update the privileges for every user on an\
    \ individual basis.\n- The privileges and authorities granted to roles are always\
    \ used when you create views, triggers, materialized query tables (MQTs), static\
    \ SQL and SQL routines, whereas privileges and authorities granted to groups (directly\
    \ or indirectly) are not used. Because roles are managed inside the database,\
    \ the DB2 database system can determine when authorization changes and act accordingly.\n\
    \nAll of the roles assigned to a user are enabled when that user establishes a\
    \ connection, so all privileges and authorities granted to roles are taken into\
    \ account when a user connects. Roles cannot be explicitly enabled or disabled.\n\
    \n- The security administrator can delegate management of a role to others. All\
    \ DB2 privileges and authorities that can be granted within a database can be\
    \ granted to a role. For example, a role can be granted any of the following authorities\
    \ and privileges:\n  - DBADM, SECADM, LOAD, and IMPLICIT_SCHEMA database authorities\n\
    \  - CONNECT, CREATETAB, CREATE_NOT_FENCED, BINDADD, CREATE_EXTERNAL_ROUTINE,\
    \ or QUIESCE_CONNECT database authorities\n  - Any database object privilege (including\
    \ CONTROL)\n\nA user's roles are automatically enabled and considered for authorization\
    \ when a user connects to a database; you do not need to activate a role by using\
    \ the SET ROLE statement. For example, when you create a view, a materialized\
    \ query table (MQT), a trigger, a package, or an SQL routine, the privileges that\
    \ you gain through roles apply. A role does not have an owner. After speaking\
    \ with your information system team, it is determined that you should create a\
    \ role for application developers, so that they can connect to your system. This\
    \ role that you create can be used to grant certain elevated privileges to the\
    \ application developers so that they can deploy stored procedures, routines,\
    \ and other data objects that easily access your schemas and databases. To create\
    \ the APP_DEV role:\n1. Right-click on the SAMPLE database object, then select\
    \ *Add Data Object -> Role*. A new role is created in the Data Project Explorer.\n\
    2. Name the role **APP_DEV**.\n3. Add the privileges to the role:\n   a. Open\
    \ the *Privileges* tab of the Properties view. Make sure the *Database* tab is\
    \ selected.\n   b. Click the New (\U0001F48E) button. The Grant New Privileges\
    \ window opens.\n   c. Select the BINDADD, CONNECT, CREATE_EXTERNAL_ROUTINE, and\
    \ CREATE_NOT_FENCED_ROUTINE options, then click *OK*. The database privileges\
    \ are added to the role.\n4. Save your work. The role is created within the physical\
    \ data model. Once you deploy the DDL that you generate in *section 5.6 DDL generation*,\
    \ you can assign users to this role.\n\n### 5.5.3 Adding a user ID to the physical\
    \ data model\n\nTo ensure that specific users can access the database once it\
    \ is deployed, you should add those user IDs to the physical data model. You can\
    \ also add other users, but let's start with the default user1 ID that is created\
    \ for most DB2 databases:\n1. Right-click on the SAMPLE database and select *Add\
    \ Data Object* -> *User*. A new user object is created in the physical data model.\n\
    2. Specify **user1** as the name of the user. An example of this is shown in *Figure\
    \ 5.6*.\n   ![](img/38311ad87170342fd88ee1165fee68b0_97_0.png)\n   > **Figure\
    \ 5.6 – Specifying a user**\n3. In the *Privileges* tab of the Properties view,\
    \ make sure that you are in the *Database* section.\n4. Click the New (⊕) button.\
    \ The Grant New Privileges window opens.\n5. Select all of the privileges, then\
    \ click *OK*.\n6. Save your work. The privileges are added to the user1 user ID.\
    \ Now that user will have full access to the database.\n\n### 5.5.4 Validating\
    \ the physical data model\n\nBefore you deploy the physical data model, you should\
    \ validate it. When you validate the model, the workbench checks the model to\
    \ ensure that valid DDL can be generated from the data model. The validation process\
    \ also ensures that your model not only adheres to the design standards that you\
    \ have created, but that it adheres to the common data modeling standards. These\
    \ “best practice” rules are built into the product, making it easier for you to\
    \ ensure that your model is well-designed before you deploy it.\n\nTo validate\
    \ the physical data model:\n1. Right-click on the SAMPLE database in the Data\
    \ Project Explorer, then select *Analyze Model*. The Analyze Model wizard opens.\
    \ By default, all of the *Physical data model* rules are selected.\n2. Deselect\
    \ the *Dimensional Modeling* and *Naming Standard* options, then click *Finish*.\n\
    \n> **Note:** Dimensional modeling is not a topic that is covered in this book.\
    \ For more information about dimensional modeling and its benefits, visit the\
    \ IBM InfoSphere Data Architect information center at http://publib.boulder.ibm.com/infocenter/rdahhelp/v7r5/index.jsp.\n\
    \nThe model is analyzed, and you see a list of warnings and informational messages\
    \ in the Problems view, as shown in *Figure 5.7*.\n![](img/38311ad87170342fd88ee1165fee68b0_98_0.png)\n\
    **Figure 5.7 – List of warnings in the Problems view**\n\nFor the purposes of\
    \ this exercise, you do not have to take any steps to correct warnings and informational\
    \ messages; these messages simply let you know of potential issues that can impact\
    \ performance or alert you of where SQL statements might fail. For example, when\
    \ information is INSERTed for the data objects in *Figure 5.7*, the update might\
    \ fail, because no default value is explicitly set for the columns that are set\
    \ to NOT NULL. Since your data model is relatively small and will not go into\
    \ a real production environment, you do not need to correct these warnings by\
    \ creating table spaces and indexes. However, it is considered a best practice\
    \ to evaluate each warning to ensure the best performance of your schemas and\
    \ databases."
  mdcn: "\n通常来说，应从最简单的设计方案起步。只有当性能受到影响时，才允许引入复杂性。\n## **5.5 优化物理数据模型**\n现在我们已经将逻辑数据模型转换为物理数据模型，在生成用于部署数据库的DDL之前，我们需要做一些最终的优化调整。首先，我们将重新排列STUDENT表的列，使其顺序更符合逻辑。之后，我们将创建一个角色，并向数据库中添加用户。\n\
    ### 5.5.1 重新排列物理数据模型中的列\n在设计逻辑数据模型时，你更关注的是对每个实体需要包含*哪些*属性和数据特征进行建模。现在我们来重新排列STUDENT表的列，让终端用户更容易理解这个对象。\n\
    要重新排列列，请执行以下步骤：\n1. 选中STUDENT_LIFE架构下的STUDENT表。表的属性将显示在属性视图中。\n2. 打开属性视图中的“列”选项卡。\n\
    3. 重新排列列，将重要的学生信息放在最前面：\n   a. 将FIRST_NAME列设置为表的第1列。选中FIRST_NAME列，然后点击“上移列”箭头（↑），将其移动到表的最前面。此时列的排列应如*图5.4*所示。\n\
    \   ![](img/38311ad87170342fd88ee1165fee68b0_94_0.png)\n   **图5.4 – 重新排列表中的列**\n\
    \   b. 将LAST_NAME列移动到FIRST_NAME列下方，使其成为表的第2列。\n   c. 将STUDENT_SSN列设置为表的第4列。\n\
    \   d. 将EMAIL_ADDR列设置为表的第5列。此时列的排列应如*图5.5*所示。\n   ![](img/38311ad87170342fd88ee1165fee68b0_95_0.png)\n\
    \   **图5.5 – 表中列的正确顺序**\n4. 保存你的工作。\n### 5.5.2 在物理数据模型中创建角色\n角色可以简化权限的管理。*角色*是一种数据库对象，可将一个或多个权限组合在一起，并可分配给用户、用户组、PUBLIC或其他角色。\n\
    角色具备多项优势，可简化数据库系统中的权限管理工作：\n- **安全管理员**（SECADM）可以按照自身组织的架构管理数据库访问权限。他们可以在数据库中创建直接对应组织内岗位职能的角色。\n\
    - **用户**会被授予与其工作职责相匹配的角色成员资格。当其工作职责发生变化时，其角色成员资格可以轻松地被*授予*和*撤销*。\n- 权限分配被简化。管理员无需将同一组权限授予同一岗位的每个独立用户，而是可以将这组权限授予代表该岗位的角色，之后再将该角色授予该岗位的每个用户即可。\n\
    - 角色的权限可以被更新，所有被授予该角色的用户都会同步获得更新。管理员无需逐个更新每个用户的权限。\n- 创建视图、触发器、物化查询表（MQT）、静态SQL和SQL例程时，始终会使用授予角色的权限和授权；而直接或间接授予用户组的权限和授权则不会被使用。由于角色在数据库内部管理，DB2数据库系统可以识别授权变更的时间并做出相应处理。\n\
    - 用户建立连接时，分配给该用户的所有角色都会自动启用，因此用户连接时，所有授予角色的权限和授权都会被纳入考量。角色无法被手动显式启用或禁用。\n- 安全管理员可以将角色的管理权限委托给其他人员。数据库中所有可授予的DB2权限和授权都可以授予角色。例如，角色可以被授予以下任意权限和授权：\n\
    \  - DBADM、SECADM、LOAD和IMPLICIT_SCHEMA数据库授权\n  - CONNECT、CREATETAB、CREATE_NOT_FENCED、BINDADD、CREATE_EXTERNAL_ROUTINE或QUIESCE_CONNECT数据库授权\n\
    \  - 任意数据库对象权限（含CONTROL权限）\n用户连接到数据库时，其拥有的所有角色会自动启用并纳入授权考量；你无需通过SET ROLE语句手动激活角色。例如，当你创建视图、物化查询表（MQT）、触发器、包或SQL例程时，通过角色获得的权限都会生效。角色没有所有者。\n\
    和你的信息系统团队沟通后，确定你需要为应用程序开发人员创建一个角色，以便他们可以连接到你的系统。你创建的该角色可用于授予应用程序开发人员特定的提升权限，以便他们能够部署存储过程、例程以及其他可轻松访问你的架构和数据库的数据对象。\n\
    要创建APP_DEV角色，请执行以下步骤：\n1. 右键点击SAMPLE数据库对象，选择*添加数据对象 -> 角色*。数据项目资源管理器中会创建一个新角色。\n\
    2. 将该角色命名为**APP_DEV**。\n3. 为角色添加权限：\n   a. 打开属性视图中的*权限*选项卡，确保已选中*数据库*选项卡。\n  \
    \ b. 点击“新建”按钮（\U0001F48E），将打开“授予新权限”窗口。\n   c. 选中BINDADD、CONNECT、CREATE_EXTERNAL_ROUTINE和CREATE_NOT_FENCED_ROUTINE选项，然后点击*确定*。数据库权限将被添加到该角色中。\n\
    4. 保存你的工作。此时角色已在物理数据模型中创建。一旦你部署了*第5.6节 DDL生成*中生成的DDL，就可以将用户分配到这个角色中。\n### 5.5.3\
    \ 向物理数据模型添加用户ID\n为确保特定用户能够在数据库部署后访问数据库，你需要将这些用户ID添加到物理数据模型中。你也可以添加其他用户，但我们先从大多数DB2数据库默认创建的user1\
    \ ID开始：\n1. 右键点击SAMPLE数据库，选择*添加数据对象 -> 用户*。物理数据模型中会创建一个新的用户对象。\n2. 将用户名指定为**user1**。示例如*图5.6*所示。\n\
    \   ![](img/38311ad87170342fd88ee1165fee68b0_97_0.png)\n   > **图5.6 – 指定用户**\n\
    3. 在属性视图的*权限*选项卡中，确保你处于*数据库*分区。\n4. 点击“新建”按钮（⊕），将打开“授予新权限”窗口。\n5. 选中所有权限，然后点击*确定*。\n\
    6. 保存你的工作。权限将被添加到user1用户ID中，该用户将拥有数据库的完全访问权限。\n### 5.5.4 验证物理数据模型\n在部署物理数据模型之前，你需要对其进行验证。验证模型时，工作台会检查模型，确保可以从数据模型生成有效的DDL。验证过程还会确保你的模型不仅符合你自己制定的设计标准，还符合通用的数据建模标准。这些“最佳实践”规则已内置到产品中，让你在部署模型之前更容易确保模型设计合理。\n\
    要验证物理数据模型，请执行以下步骤：\n1. 在数据项目资源管理器中右键点击SAMPLE数据库，选择*分析模型*。将打开“分析模型”向导，默认情况下会选中所有*物理数据模型*规则。\n\
    2. 取消选中*维度建模*和*命名标准*选项，然后点击*完成*。\n> **注意：** 本书不涉及维度建模的相关内容。如需了解维度建模及其优势的更多信息，请访问IBM\
    \ InfoSphere Data Architect信息中心：http://publib.boulder.ibm.com/infocenter/rdahhelp/v7r5/index.jsp。\n\
    模型分析完成后，你会在“问题”视图中看到警告和信息消息列表，如*图5.7*所示。\n![](img/38311ad87170342fd88ee1165fee68b0_98_0.png)\n\
    **图5.7 – 问题视图中的警告列表**\n本练习中，你无需采取任何措施纠正警告和信息消息；这些消息仅用于告知你可能影响性能的潜在问题，或提醒你SQL语句可能执行失败的位置。例如，为*图5.7*中的数据对象执行INSERT操作插入信息时，更新操作可能会失败，因为未为设置为NOT\
    \ NULL的列显式指定默认值。\n由于你的数据模型规模较小，不会投入实际生产环境，因此你无需通过创建表空间和索引来纠正这些警告。但评估每条警告以确保架构和数据库的最佳性能，是被公认的最佳实践。\n"
