    # ## 3.2.2 Creating entities with the diagram


    To work with a logical data model, you should work with the visual representation
    of the model, the diagram. Each logical data model can contain multiple diagrams,
    each representing a small part of the greater logical data model.


    # ### 3.2.2.1 Creating diagrams


    You can use diagrams to visualize and edit objects that are contained in data
    design projects.


    As you create objects within the diagrams of the logical data model, the changes
    are automatically made to the logical data model, making it easier to not only
    visualize your data objects and the relationships between those objects, but also
    saving the time needed to manually create these relationships.


    Data diagrams are a representation of an underlying data model. You can create
    diagrams that contain only a subset of model objects that are of interest.'
  - '[PAGE 53]


    # 3.2.2.2 The Data section of the palette


    The Data area of the palette contains data model objects. When you add or modify
    data model objects by using the palette or the diagram surface, you modify the
    underlying data model.


    # 3.2.2.3 Renaming data objects from the Properties view


    By default, Diagram1 is the name of this diagram, but you should change it to
    something that you can easily remember or differentiate from other data models
    in the project. To rename the diagram and the top-level package, perform the following
    steps:


