    \     - Start date (START)\n      - Student (STUDENT or SDT)\n      - Student\
    \ activity (ACTIVITY or ACT)\n9. Save your work.\n\nIn the next section, *3.4\
    \ Working with naming standards*, you will learn how to modify the naming standards\
    \ so that when you validate the logical data model, your entities and attributes\
