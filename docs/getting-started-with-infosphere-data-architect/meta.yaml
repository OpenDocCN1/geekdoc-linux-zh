    \n### 1.5 Installing InfoSphere Data Architect\n\nIBM InfoSphere Data Architect\
    \ can be installed by using the Launchpad interface, or silently, which means\
    \ that you create a response file of your chosen installation options, then run\
    \ that response file. Silent installations are useful for larger installations\
    \ in which installation must be pushed out to many machines. This chapter focuses\
    \ on the installation that uses the Launchpad interface. It assumes you do not\
    \ have the IBM Installation Manager installed. This means that installing IBM\
    \ InfoSphere Data Architect starts in the Installation Manager. If you choose\
    \ to install additional products that also use that release of Installation Manager,\
    \ you do not need to install Installation Manager again.\n\n> **Note:** As explained\
    \ in the Data Security, Privacy, and Lifecycle Management information center (http://publib.boulder.ibm.com/infocenter/idm/docv3/index.jsp?topic=/com.ibm.datatools.rda.install.doc/topics/c_plan_imover.html),\
    \ IBM Installation Manager is a program for installing, updating, and modifying\
    \ packages. It helps you manage the IBM applications, or packages, that it installs\
    \ on your computer. IBM Installation Manager does more than install packages;\
    \ it helps you keep track of what you have installed, determine what is available\
    \ for you to install, and organize installation directories.\n\nThis chapter assumes\
    \ that you have administrative privileges on the computer on which you are installing\
    \ the product. Follow these steps to install the IBM InfoSphere Data Architect\
    \ product:\n\n- 1. After you extract the contents of the compressed package, start\
    \ the launchpad:\n  - Windows: Run the **setup.exe** file, located in the directory\
    \ where you extracted the image.\n  - Linux or UNIX: Run the **setup** command\
    \ from the root path where you extracted the image. The launchpad opens.\n- 2.\
    \ In the left pane, select *Install Product*, as shown in Figure 1.1. The product\
    \ installation page opens. You can now select which type of install that you want\
    \ to run.\n  ![](img/38311ad87170342fd88ee1165fee68b0_26_0.png)\n  **Figure 1.1**\
    \ – Click Install Product to launch the Installation Manager\n- 3. Select the\
    \ *Administrative Installation* option. IBM Installation Manager opens.\n- 4.\
    \ Select the packages that you want to install. For this exercise, select the\
    \ *IBM InfoSphere Data Architect* package. Click *Next*.\n- 5. Review and accept\
    \ the license agreement. Click *Next*.\n- 6. Create a new package group and specify\
    \ where common components will be installed:\n  a. Select the *Create a new package\
    \ group* radio button as shown in Figure 1.2. Because you are installing the product\
    \ on a machine that does not include any existing package groups, you should select\
    \ this option.\n  | Option | Selected |\n  |--------|----------|\n  | Use the\
    \ existing package group | ○ |\n  | Create a new package group | ● |\n  ![](img/38311ad87170342fd88ee1165fee68b0_27_0.png)\n\
    \  Package Group Name: IBM InfoSphere Installation Directory: C:\\Program Files\\\
    IBM\\IDA7.5.3\n  **Figure 1.2** – Create a new package group for IBM InfoSphere\
    \ Data Architect\n  b. Specify the directory where the shared resources and Installation\
    \ Manager will be installed. For the purpose of this exercise, you can use the\
    \ default settings, but remember that you should choose a drive that has more\
    \ space than you think you need just for IBM InfoSphere Data Architect in case\
