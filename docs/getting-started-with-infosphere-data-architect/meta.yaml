  - '[PAGE 94]


    As a general rule, start out with the simplest design. Only allow complexity if
    and when performance is impacted.


    # **5.5 Refining the physical data model**


    Now that we have transformed a logical data model into a physical data model,
    we should make some final refinements before we generate the DDL to deploy the
    database. First, we will rearrange the columns of the STUDENT table into a more
    logical order. Then, we will create a role and add a user to the database.


    # **5.5.1 Rearranging columns in a physical data model**


    When you created the logical data model, you were more concerned with modeling
    *what* attributes and data characteristics must go into each entity. Let''s rearrange
    the columns of the STUDENT table to make the object more easily understood to
    an end user.


    To rearrange the columns, perform the following steps:


    +   1. Select the STUDENT table under the STUDENT_LIFE schema. The properties
    of the table display in the Properties view.


    +   2. Open the Columns tab of the Properties view.


    +   3. Rearrange the columns to identify vital student information first:


    +      a. Make the FIRST_NAME column the first column in the table. Select the
    FIRST_NAME column, then press the Move Column Up arrow (↑) to place it first in
    the table. The columns should now look like the image in *Figure 5.4*.


    ![](img/38311ad87170342fd88ee1165fee68b0_94_0.png)


    **Figure 5.4 – Rearranging columns in a table**


    +      b. Make the LAST_NAME column the second column in the table by moving it
    under the FIRST_NAME column.


    +      c. Make the STUDENT_SSN column the fourth column in the table.


    +      d. Make the EMAIL_ADDR column the fifth column in the table.


    The columns should be in the order displayed in *Figure 5.5*.'
  - '[PAGE 95]


    ![](img/38311ad87170342fd88ee1165fee68b0_95_0.png)


    # **Figure 5.5 – The proper order of the columns in the table**


    +   4. Save your work.


    # ## 5.5.2 Creating roles within the physical data model


    Roles simplify the administration and management of privileges. A *role* is a
    database object that groups together one or more privileges and can be assigned
    to users, groups, PUBLIC, or other roles. Roles provide several advantages that
    make it easier to manage privileges in a database system:


    +   * **Security administrators** (SECADM) can control access to their databases
    in a way that mirrors the structure of their organizations. They can create roles
    in the database that map directly to the job functions in their organizations.


    +   * **Users** are granted membership in the roles that reflect their job responsibilities.
    As their job responsibilities change, their membership in roles can be easily
    *granted* and *revoked*.


    +   * The assignment of privileges is simplified. Instead of granting the same
    set of privileges to each individual user in a particular job function, the administrator
    can grant this set of privileges to a role that represents that job function and
    then grant that role to each user in that job function.


    +   * A role''s privileges can be updated and all users who have been granted
    that role receive the update. The administrator does not need to update the privileges
    for every user on an individual basis.


    +   * The privileges and authorities granted to roles are always used when you
    create views, triggers, materialized query tables (MQTs), static SQL and SQL routines,
    whereas privileges and authorities granted to groups (directly or indirectly)
    are not used. Because roles are managed inside the database, the DB2 database
    system can determine when authorization changes and act accordingly.'
  - "[PAGE 96]\n\n+   - All of the roles assigned to a user are enabled when that\
    \ user establishes a connection, so all privileges and authorities granted to\
    \ roles are taken into account when a user connects. Roles cannot be explicitly\
    \ enabled or disabled.\n- The security administrator can delegate management of\
    \ a role to others.\n\nAll DB2 privileges and authorities that can be granted\
    \ within a database can be granted to a role. For example, a role can be granted\
    \ any of the following authorities and privileges:\n\n+   - DBADM, SECADM, LOAD,\
    \ and IMPLICIT_SCHEMA database authorities\n- CONNECT, CREATETAB, CREATE_NOT_FENCED,\
    \ BINDADD, CREATE_EXTERNAL_ROUTINE, or QUIESCE_CONNECT database authorities\n\
    - Any database object privilege (including CONTROL)\n\nA user's roles are automatically\
    \ enabled and considered for authorization when a user connects to a database;\
    \ you do not need to activate a role by using the SET ROLE statement. For example,\
    \ when you create a view, a materialized query table (MQT), a trigger, a package,\
    \ or an SQL routine, the privileges that you gain through roles apply.\n\nA role\
    \ does not have an owner.\n\nAfter speaking with your information system team,\
    \ it is determined that you should create a role for application developers, so\
    \ that they can connect to your system. This role that you create can be used\
    \ to grant certain elevated privileges to the application developers so that they\
    \ can deploy stored procedures, routines, and other data objects that easily access\
    \ your schemas and databases.\n\nTo create the APP_DEV role:\n\n+   1. Right-click\
    \ on the SAMPLE database object, then select *Add Data Object -> Role*. A new\
    \ role is created in the Data Project Explorer.\n2. Name the role **APP_DEV**.\n\
    3. Add the privileges to the role:\n   a. Open the *Privileges* tab of the Properties\
    \ view. Make sure the *Database* tab is selected.\n   b. Click the New (\U0001F48E\
    ) button. The Grant New Privileges window opens.\n   c. Select the BINDADD, CONNECT,\
    \ CREATE_EXTERNAL_ROUTINE, and CREATE_NOT_FENCED_ROUTINE options, then click *OK*.\
    \ The database privileges are added to the role.\n4. Save your work.\n\nThe role\
    \ is created within the physical data model. Once you deploy the DDL that you\
    \ generate in *section 5.6 DDL generation*, you can assign users to this role."
  - '[PAGE 97]


    # ## 5.5.3 Adding a user ID to the physical data model


    To ensure that specific users can access the database once it is deployed, you
    should add those user IDs to the physical data model. You can also add other users,
    but let''s start with the default user1 ID that is created for most DB2 databases:


    +   1. Right-click on the SAMPLE database and select *Add Data Object* -> *User*.
    A new user object is created in the physical data model.

    2. Specify **user1** as the name of the user. An example of this is shown in *Figure
    5.6*.


    ![](img/38311ad87170342fd88ee1165fee68b0_97_0.png)


    > **Figure 5.6 – Specifying a user**


    +   3. In the *Privileges* tab of the Properties view, make sure that you are
    in the *Database* section.

    4. Click the New (⊕) button. The Grant New Privileges window opens.

    5. Select all of the privileges, then click *OK*.

    6. Save your work.


    The privileges are added to the user1 user ID. Now that user will have full access
    to the database.


    # ## 5.5.4 Validating the physical data model


    Before you deploy the physical data model, you should validate it. When you validate
    the model, the workbench checks the model to ensure that valid DDL can be generated
    from the data model. The validation process also ensures that your model not only
    adheres to the design standards that you have created, but that it adheres to
    the common data modeling standards. These “best practice” rules are built into
    the product, making it easier for you to ensure that your model is well-designed
    before you deploy it.'
  - '[PAGE 98]


    To validate the physical data model:


    +   1. Right-click on the SAMPLE database in the Data Project Explorer, then select
    *Analyze Model*. The Analyze Model wizard opens. By default, all of the *Physical
    data model* rules are selected.

    2. Deselect the *Dimensional Modeling* and *Naming Standard* options, then click
    *Finish*.


    > **Note:**


    Dimensional modeling is not a topic that is covered in this book. For more information
    about dimensional modeling and its benefits, visit the IBM InfoSphere Data Architect
    information center at http://publib.boulder.ibm.com/infocenter/rdahhelp/v7r5/index.jsp.


    The model is analyzed, and you see a list of warnings and informational messages
    in the Problems view, as shown in *Figure 5.7*.


    ![](img/38311ad87170342fd88ee1165fee68b0_98_0.png)


    **Figure 5.7 – List of warnings in the Problems view**


    For the purposes of this exercise, you do not have to take any steps to correct
    warnings and informational messages; these messages simply let you know of potential
    issues that can impact performance or alert you of where SQL statements might
    fail. For example, when information is INSERTed for the data objects in *Figure
    5.7*, the update might fail, because no default value is explicitly set for the
    columns that are set to NOT NULL. Since your data model is relatively small and
    will not go into a real production environment, you do not need to correct these
    warnings by creating table spaces and indexes.


    However, it is considered a best practice to evaluate each warning to ensure the
    best performance of your schemas and databases.'
- md: "## 5.6 DDL generation\nNow that you have generated a complete physical data\
    \ model, you are aware of the process of creating, editing, and updating data\
    \ models. Now that you've completed this process, how do you deploy the database\
    \ to a test or production environment? IBM InfoSphere Data Architect is capable\
    \ of creating database-specific *data definition language (DDL)* scripts from\
    \ the model that you have created. After you generate the DDL script, you can\
    \ run it on the server, and users can access the model as part of the database.\n\
    \n## 5.6.1 Generating the DDL script from the database object\nYou generate the\
    \ DDL script from the database object of the physical data model. The Generate\
    \ DDL wizard will create the SQL statements to deploy your database on a server.\
    \ Let's create a DDL script to deploy your new database:\n- 1. Connect to the\
    \ SAMPLE database by right-clicking on the connection in the Data Source Explorer\
    \ and selecting *Connect*.\n- 2. Right-click on the SAMPLE database in the Data\
    \ Project Explorer, then select *Generate DDL*. The Generate DDL wizard opens.\n\
    - 3. On the Options page of the wizard, make sure that all of the options are\
    \ selected, then click *Next*.\n> **Note:** If you are not deploying the DDL as\
    \ part of the DDL generation, you do not need to connect to the database as the\
    \ first step.\n### Table 5.1 – Available model elements that you can add to the\
    \ DDL script\n| Option | Explanation |\n|--------|-------------|\n| Check model\
    \ | The model is validated before the script is created. |\n| Fully qualified\
    \ names | Any object is referenced by its full name. For example, the STUDENT\
    \ table of the STUDENT_LIFE schema is referenced as STUDENT_LIFE.STUDENT. |\n\
    | Quoted identifiers | Specifies if you need to address object within quotes.\
    \ This is done if you want to consider \"Table A\" and \"TABLE A\" as two different\
    \ objects. |\n| DROP statements | Includes DROP statements at the beginning of\
    \ the DDL script to drop objects if they are already present. |\n| CREATE statements\
    \ | Includes CREATE statements in the DDL to create or re-create data objects.\
    \ |\n| COMMENT ON statements | Includes the statements from the *Documentation*\
    \ tab of the Properties view of the data objects. |\n| IN TABLESPACE clause |\
    \ Takes info from the storage model or the default table space and adds it to\
    \ the DDL script. |\n- 4. Keep the default settings on the Objects page, then\
    \ click *Next*.\n- 5. On the Save and Run DDL page, specify the following file\
    \ name: `DEPLOY_SYS.sql`.\n> **Note:** The DDL script is displayed in the *Preview\
    \ DDL* section of the page. Use this section to verify that your script contains\
    \ all of the SQL that you need to deploy the information system to the server.\
    \ The first part of the SQL makes sure that none of the data objects exist on\
    \ the server. Then, the SQL will re-create these data objects and make sure that\
    \ the role you have specified is, in fact, created on the server.\n- 6. Select\
    \ the *Run DDL on server* option, then click *Next*.\n- 7. Complete the Select\
    \ Connection page by selecting the SAMPLE database.\n- 8. Review your choices\
    \ on the Summary page. You cannot change the options on this page. Once you are\
    \ ready to generate the script, click *Next*.\n- 9. On the Select Connection page,\
    \ select the SAMPLE database connection, then click *Next*.\n- 10. On the Summary\
    \ page, click *Finish*.\nThe DDL script is generated and saved in the *SQL Scripts*\
    \ folder of the data design project, as shown in *Figure 5.8*.\n### Figure 5.8\
    \ – The DDL script, saved in the SQL Scripts folder\n![](img/38311ad87170342fd88ee1165fee68b0_101_0.png)\n\
    The DDL script also runs on the server. This deploys your new database and schema\
    \ to the DB2 system, where it can be populated with data, and application developers\
    \ can create applications to query and report on the data.\nTo verify that the\
    \ schema has deployed, open the Data Source Explorer view, and expand the SAMPLE\
    \ node and database. Locate and expand the *Schemas* folder and look for the STUDENT_LIFE\
    \ schema, now created in the database. This is shown in Figure 5.9.\n### Figure\
    \ 5.9 – Newly-deployed schema\n![](img/38311ad87170342fd88ee1165fee68b0_102_0.png)\n\
    \n## 5.7 Exercise\nGenerate a new DDL script for the physical data model:\n- 1.\
    \ On the Options page of the Generate DDL wizard, make sure the following items\
    \ are not selected:\n  - DROP statements\n  - COMMENT ON statements\n  - Use domain\
    \ if exists\n- 2. On the Objects page of the Generate DDL wizard, only generate\
    \ statements for the following objects:\n  - Tables\n  - Privileges\n  - Primary\
    \ key constraint\n  - Roles\n- 3. Complete the Save and Run DDL page of the wizard:\n\
    \  a. Specify `EXERCISE_5_7.sql` as the file name.\n- **b.** Select the *Open\
    \ DDL file for editing* option.\n- 4. Complete the wizard.\n- 5. Select both SQL\
    \ files that you have created (DEPLOY_SYS.sql and EXERCISE_5_7.sql), then right-click\
    \ and select *Compare With -> Each Other*. The compare editor opens. What are\
    \ the differences in the files?\n\n## 5.8 Summary\nIn this chapter, you learned\
    \ about *physical data models*. Physical data models are the next step in the\
    \ data design process; they take the logical design and help you draft the physical\
    \ storage (tables, columns, indexes, and other data objects) for the database\
    \ and server. You also learned about data definition language (DDL) files and\
    \ how they can be used to deploy the data models that you create with IBM InfoSphere\
    \ Data Architect. DDL scripts contain the queries that are necessary to drop,\
    \ create, or modify data objects.\n\n## 5.9 Review questions\n- 1. What is a physical\
    \ data model?\n- 2. Physical data models can model one or all of the following\
    \ objects:\n  - A. Tables\n  - B. Roles\n  - C. Schemas\n  - D. All of the above\n\
    - 3. From which objects of the physical data model do you generate DDL scripts?\n\
    - 4. True or false: You cannot preview the DDL script before you create it in\
    \ your workspace.\n- 5. What is the purpose of storage modeling?\n- 6. What storage\
    \ model objects can you create in a physical data model?\n- 7. True or false:\
    \ You must have a logical data model before you create a physical data model.\
    \ You cannot create a physical data model from scratch.\n\n## 5.10 What's next?\n\
    Congratulations! You have designed and deployed a complete data model. In the\
    \ next chapter, you will learn how to generate informative reports about your\
    \ data models.\n\n# PART III – ITERATIVE DESIGN: REPORTING, REVISING, AND ANALYZING\n\
    \n# THANK YOU\n![](img/38311ad87170342fd88ee1165fee68b0_105_0.png)\n![](img/38311ad87170342fd88ee1165fee68b0_106_0.png)\n\
    \n# Chapter 6 – Generating Reports, Importing, and Exporting\nReporting is an\
    \ important feature of IBM InfoSphere Data Architect. The information provided\
    \ by reports can be copied, printed, and distributed as one physical document.\
    \ Reports are used to provide compliance information in many organizations. The\
    \ Import/Export feature in IBM InfoSphere Data Architect helps you ensure that\
    \ your data models are compatible with other data modeling, design, and reporting\
    \ tools. The Import/Export feature allows you to import existing data models from\
    \ compatible data modeling tools and export to compatible data modeling tools\
    \ and formats.\n\n## 6.1 Reporting, importing, and exporting: The big picture\n\
    When you create reports within the workbench, you can provide information on all\
    \ or part of a model; that is, a list of objects and their relationships. IBM\
    \ InfoSphere Data Architect provides a wide range of built-in reports or templates\
    \ for your logical, physical, domain, and glossary models. *Figure 6.1* illustrates\
    \ the big picture of reporting and import/export.\n### Figure 6.1 – Reporting,\
    \ importing, and exporting in the workbench\n![](img/38311ad87170342fd88ee1165fee68b0_107_0.png)\n\
    The left side of *Figure 6.1* illustrates the import and export capabilities of\
    \ IBM InfoSphere Data Architect. The *import* feature of IBM InfoSphere Data Architect\
    \ allows you to convert the data model from another tool into either a physical\
    \ data model or logical data model in IBM InfoSphere Data Architect. The *export*\
    \ feature of IBM InfoSphere Data Architect allows you to convert either a physical\
    \ data model or logical data model in IBM InfoSphere Data Architect to the format\
    \ that is supported by other tool that you want to export the data model to.\n\
    The right side of *Figure 6.1* illustrates the reporting capabilities of IBM InfoSphere\
    \ Data Architect. You can generate reports for your logical, physical, domain,\
    \ and glossary models in 6 different formats: HTML, PDF, PowerPoint, Excel, Word\
    \ (.doc), and PostScript.\n> **Note**: You can only import or export physical\
    \ or logical data models or domain models."
  mdcn: "\n## 5.6 生成DDL\n现在你已经生成了完整的物理数据模型，你已经了解了创建、编辑和更新数据模型的流程。既然你已经完成了这一流程，如何将数据库部署到测试或生产环境？IBM\
    \ InfoSphere Data Architect 可以根据你创建的模型生成针对特定数据库的*数据定义语言（DDL）*脚本。生成 DDL 脚本后，你可以在服务器上运行该脚本，用户即可将模型作为数据库的一部分进行访问。\n\
    \n## 5.6.1 从数据库对象生成 DDL 脚本\n你可以从物理数据模型的数据库对象生成 DDL 脚本。“生成 DDL”向导会创建用于在服务器上部署数据库的\
    \ SQL 语句。接下来我们创建一个 DDL 脚本来部署你的新数据库：\n- 1. 在数据源浏览器中右键点击连接，选择*连接*，连接到 SAMPLE 数据库。\n\
    - 2. 在数据项目浏览器中右键点击 SAMPLE 数据库，然后选择*生成 DDL*，“生成 DDL”向导随即打开。\n- 3. 在向导的“选项”页面中，确保所有选项均被选中，然后点击*下一步*。\n\
    > **注意：** 如果你不需要在生成 DDL 的同时执行部署，则无需执行第一步的数据库连接操作。\n\n### 表 5.1 – 可添加到 DDL 脚本中的可用模型元素\n\
    | 选项 | 说明 |\n|--------|-------------|\n| 检查模型 | 脚本创建前会先验证模型。 |\n| 完全限定名称 | 任何对象都以其全名引用。例如，STUDENT_LIFE\
    \ 模式下的 STUDENT 表会被引用为 STUDENT_LIFE.STUDENT。 |\n| 带引号的标识符 | 指定是否需要用引号引用对象。当你希望将\
    \ \"Table A\" 和 \"TABLE A\" 视为两个不同对象时，需要开启此项。 |\n| DROP 语句 | 在 DDL 脚本开头包含 DROP\
    \ 语句，用于删除已存在的对象。 |\n| CREATE 语句 | 在 DDL 中包含 CREATE 语句，用于创建或重建数据对象。 |\n| COMMENT\
    \ ON 语句 | 包含数据对象“属性”视图*文档*选项卡中的语句。 |\n| IN TABLESPACE 子句 | 从存储模型或默认表空间获取信息，并将其添加到\
    \ DDL 脚本中。 |\n\n- 4. 在“对象”页面保留默认设置，然后点击*下一步*。\n- 5. 在“保存并运行 DDL”页面中，指定以下文件名：`DEPLOY_SYS.sql`。\n\
    > **注意：** DDL 脚本会显示在页面的*预览 DDL*区域中。你可以使用该区域验证脚本是否包含将信息系统部署到服务器所需的所有 SQL 语句。SQL\
    \ 的第一部分会确保服务器上不存在任何数据对象，随后 SQL 会重建这些数据对象，并确保你指定的角色确实已在服务器上创建。\n- 6. 选中*在服务器上运行\
    \ DDL*选项，然后点击*下一步*。\n- 7. 在“选择连接”页面中选择 SAMPLE 数据库，完成该页面设置。\n- 8. 在“摘要”页面检查你的选择。此页面的选项无法修改。准备好生成脚本后，点击*下一步*。\n\
    - 9. 在“选择连接”页面中选择 SAMPLE 数据库连接，然后点击*下一步*。\n- 10. 在“摘要”页面点击*完成*。DDL 脚本会生成并保存在数据设计项目的*SQL\
    \ 脚本*文件夹中，如*图 5.8*所示。\n\n### 图 5.8 – 保存在 SQL 脚本文件夹中的 DDL 脚本\n![](img/38311ad87170342fd88ee1165fee68b0_101_0.png)\n\
    \nDDL 脚本还会在服务器上运行，会将新数据库和模式部署到 DB2 系统中，后续可向其中填充数据，应用开发人员还可创建应用程序来查询数据并生成数据报表。要验证模式是否已成功部署，可打开“数据源浏览器”视图，展开\
    \ SAMPLE 节点和数据库，找到并展开*模式*文件夹，查找刚刚在数据库中创建的 STUDENT_LIFE 模式，结果如*图 5.9*所示。\n\n###\
    \ 图 5.9 – 新部署的模式\n![](img/38311ad87170342fd88ee1165fee68b0_102_0.png)\n\n## 5.7\
    \ 练习\n为物理数据模型生成新的 DDL 脚本：\n- 1. 在“生成 DDL”向导的“选项”页面中，确保未选中以下项目：\n  - DROP 语句\n\
    \  - COMMENT ON 语句\n  - 如果存在则使用域\n- 2. 在“生成 DDL”向导的“对象”页面中，仅生成以下对象的语句：\n  - 表\n\
    \  - 权限\n  - 主键约束\n  - 角色\n- 3. 完成向导的“保存并运行 DDL”页面：\n  a. 指定 `EXERCISE_5_7.sql`\
    \ 为文件名。\n  - **b.** 选中*打开 DDL 文件进行编辑*选项。\n- 4. 完成向导其余步骤。\n- 5. 选中你创建的两个 SQL 文件（DEPLOY_SYS.sql\
    \ 和 EXERCISE_5_7.sql），然后右键点击，选择*比较 -> 相互比较*，比较编辑器随即打开。这两个文件有哪些差异？\n\n## 5.8 总结\n\
    在本章中，你学习了*物理数据模型*。物理数据模型是数据设计流程的下一步，它在逻辑设计的基础上，帮助你起草数据库和服务器的物理存储结构（表、列、索引以及其他数据对象）。你还学习了数据定义语言（DDL）文件，以及如何使用\
    \ DDL 文件部署你用 IBM InfoSphere Data Architect 创建的数据模型。DDL 脚本包含删除、创建或修改数据对象所需的查询语句。\n\
    \n## 5.9 复习问题\n- 1. 什么是物理数据模型？\n- 2. 物理数据模型可以对以下部分或全部对象进行建模：\n  - A. 表\n  - B.\
    \ 角色\n  - C. 模式\n  - D. 以上全部\n- 3. 你可以从物理数据模型的哪些对象生成 DDL 脚本？\n- 4. 判断正误：你无法在工作区中创建\
    \ DDL 脚本之前预览它。\n- 5. 存储建模的目的是什么？\n- 6. 你可以在物理数据模型中创建哪些存储模型对象？\n- 7. 判断正误：你必须先有逻辑数据模型才能创建物理数据模型，无法从零开始创建物理数据模型。\n\
    \n## 5.10 接下来学什么？\n恭喜！你已经完成了一个完整数据模型的设计与部署。在下一章中，你将学习如何生成关于你数据模型的信息丰富的报告。\n\n\
    # 第三部分 – 迭代设计：报表、修订与分析\n# 致谢\n![](img/38311ad87170342fd88ee1165fee68b0_105_0.png)\n\
    ![](img/38311ad87170342fd88ee1165fee68b0_106_0.png)\n\n# 第 6 章 – 生成报表、导入与导出\n\
    报表是 IBM InfoSphere Data Architect 的重要功能。报表提供的信息可以复制、打印，并以纸质文档的形式分发。许多组织会使用报表来提供合规信息。IBM\
    \ InfoSphere Data Architect 的导入/导出功能可确保你的数据模型与其他数据建模、设计和报表工具兼容。该功能支持你从兼容的数据建模工具导入现有数据模型，也可导出到兼容的数据建模工具和格式中。\n\
    \n## 6.1 报表、导入与导出：整体概览\n在工作台中创建报表时，你可以提供模型全部或部分的信息，即对象列表及其关系。IBM InfoSphere Data\
    \ Architect 为逻辑、物理、域和术语表模型提供了大量内置报表或模板。*图 6.1* 展示了报表与导入/导出的整体概览。\n\n### 图 6.1\
    \ – 工作台中的报表、导入与导出\n![](img/38311ad87170342fd88ee1165fee68b0_107_0.png)\n\n*图 6.1*\
    \ 左侧展示了 IBM InfoSphere Data Architect 的导入导出功能。IBM InfoSphere Data Architect 的*导入*功能支持你将其他工具中的数据模型转换为\
    \ IBM InfoSphere Data Architect 中的物理数据模型或逻辑数据模型。*导出*功能支持你将 IBM InfoSphere Data\
    \ Architect 中的物理数据模型或逻辑数据模型转换为你要导出到的其他工具所支持的格式。*图 6.1* 右侧展示了 IBM InfoSphere Data\
    \ Architect 的报表功能。你可以为逻辑、物理、域和术语表模型生成 6 种不同格式的报表：HTML、PDF、PowerPoint、Excel、Word（.doc）和\
    \ PostScript。\n\n> **注意：** 你仅可以导入或导出物理或逻辑数据模型，或是域模型。\n"
