    \ 创建仅包含类词的子术语表，减少浏览整个术语表理解这些术语所花费的时间。\n- 如果可能，使用电子表格更高效地录入业务术语。将术语复制到电子表格应用程序（如Lotus®\
    \ Symphony或Microsoft Excel）中，可快速更新和编辑术语，再将其复制回InfoSphere Data Architect中。\n\n\
    ### 3.3.2 创建术语表模型\n现在我们来创建术语表模型，以构建学生术语表。该术语表模型将确定项目中所有数据模型里学生相关信息的规范。要创建术语表模型，请执行以下步骤：\n\
    \n1. 选择*文件* -> *新建* -> *术语表模型*。\n2. 确保目标文件夹设置为大学信息系统数据设计项目。\n3. 将文件名指定为**STUDENT_GLOSSARY**。\n\
