    \ *General* tab of the Properties view, specify **SAMPLE** as the new name.\n\
    8. Save your work.\n\nFigure 5.2 shows the data objects and folders that are created\
    \ after you complete the transformation process.\n## Figure 5.2 – New physical\
    \ data model and data objects\n\n## 5.4 Working on your physical data model\n\n\
    ### 5.4.1 Anatomy of your model\n\nFigure 5.3 shows you what a physical data model\
    \ looks like.\n## Figure 5.3 – The physical data model, displayed in the workbench\n\
    \nEvery physical data model has the following characteristics:\n- File extension:\
    \ The file extension at the end of each physical data model file name is .dbm.\n\
    - Schema and database design:\n  - The structure is more or less the same as a\
    \ logical data model.\n  - As you have learned previously, logical data models\
    \ contain a single package, where you can store subpackages, entities, and diagrams.\
    \ Physical data models, on the other hand, store information in databases. Each\
    \ database can have multiple schemas, and each schema can contain multiple tables.\n\
    - Diagrams:\n  - When you transform a diagram from a logical data model, your\
    \ design is intact, including notes, formatting, and relationships. The only difference\
    \ is in the icons used to depict the new tables, columns, and other data objects\
    \ that you design.\n  - As with logical data models, you can create physical data\
    \ model diagrams to help you visualize and understand the design of complex data\
    \ models.\n- Storage diagrams: You can create diagrams to help you model the storage\
    \ of your DB2 databases. This includes partitions, table spaces, buffer pools,\
    \ and other storage objects.\n- SQL statements: The SQL Scripts folder stores\
    \ SQL scripts that you create within the physical data model.\n\nIf you explore\
    \ the physical data model, you will see that even the atomic domain elements that\
    \ you specified are carried over into the new physical data model.\n\n### 5.4.2\
    \ Storage modeling in DB2\n**Note:** With IBM InfoSphere Data Architect, you can\
    \ only model the storage of a DB2 for Linux, UNIX, and Windows database, or DB2\
    \ for z/OS database. For more information about the DB2 storage model, refer to\
    \ the book *Getting started with DB2 Express-C*, that is part of this book series.\
    \ This chapter does not cover how to model storage in detail, because the schema\
    \ we are creating is very small. However, this section does explain the basic\
    \ concepts behind storage modeling and the information that you should keep in\
    \ mind when you design the storage for complex data models.\n\n#### 5.4.2.1 Table\
    \ spaces\n\nThe data for databases is stored in *table spaces*. Table spaces are\
    \ database vendor-specific.\n\n**Note:** To learn more about table spaces in DB2\
    \ for Linux, UNIX, and Windows, visit the following URL: http://publib.boulder.ibm.com/infocenter/db2luw/v9r7/topic/com.ibm.db2.luw.admin.dbobj.doc/doc/c0004935.html\
    \ To learn more about table spaces in DB2 for z/OS: http://publib.boulder.ibm.com/infocenter/dzichelp/v2r2/index.jsp?topic=/com.ibm.db2z.doc.gloss/src/gloss/db2z_gloss.htm\n\
    \nTable spaces are typically managed in one of two ways:\n- *System-managed space*:\
    \ The operating system will manage the table spaces. Containers are defined as\
    \ operating system files, and they are accessed using operating system calls.\
    \ This means that the operating system handles the following actions:\n  - Buffering\
    \ of input and output\n  - Space allocation\n  - Automatic extension of the table\
    \ space\n- *Database-managed space*: The database manages the table spaces. Containers\
    \ are defined as files, which will be fully allocated with the size given when\
    \ the space is created, or as devices. When you use DB2 to manage your table spaces,\
    \ it will handle the following actions:\n  - Buffering of input and output (as\
    \ much as the allocation method and operating system allows)\n  - Extending containers\
    \ when using ALTER TABLESPACE\n  - Releasing unused portions of database-managed\
    \ containers\n\nEach table space has at least one container. A container belongs\
    \ to a single table space (but a table space can have more than one container).\
    \ You can only add a container to a system-managed table space when the database\
    \ is partitioned, and the partition does not yet have a container allocated for\
    \ that table space. When you add a container to a table space, the data is distributed\
    \ across all of the containers. When you specify a table space, you need to consider\
    \ the following settings (found on the General tab of the Properties view of the\
    \ table space):\n- *Page size*: Defines the size of pages that are used for the\
    \ table space. For DB2, the supported sizes include 4K, 8K, 16K, and 32K. The\
    \ page size limits the row length and column count of the tables that can be placed\
    \ in the table space. Table spaces are limited to 16,777,216 pages. Choosing a\
    \ larger page size increases the capacity of the table space.\n- *Extent size*:\
    \ Specifies the number of pages that will be written to a container before the\
    \ next container is used. The database manager cycles repeatedly through the containers\
    \ as data is stored. This setting only has an effect when there are multiple containers\
    \ for each table space.\n- *Prefetch size*: Specifies the number of pages that\
    \ are read from the table space when data prefetching is performed. Prefetching\
    \ draws data that is needed by a query before they are actually referenced by\
    \ the query. This allows the query to have the data ready when data input or output\
    \ is performed. Prefetching is selected by the database manager when it determines\
    \ that it needs to use sequential input and output, and prefetching the data will\
    \ improve performance.\n\n**Best practice:** Set the prefetch size as a multiple\
    \ of the extent size value and the number of table space containers. For example,\
    \ if your extent size is 32 and there are 4 containers, then the prefetch size\
    \ should be 128, 256, or other multiples of 128. If a table is used often, create\
    \ a separate table space for that table to improve performance.\n- **Overhead\
    \ and transfer rate:** Determines the cost of input and output during query optimization.\
    \ Values are measured in milliseconds, and they should be the average for all\
    \ containers. *Overhead* is the time that is associated with input-output controller\
    \ activity, disk seek time, and rotational latency. The *transfer rate* is the\
    \ amount of time that is needed to read a page into memory. These values can be\
    \ calculated based on hardware specifications.\n\n#### 5.4.2.2 Buffer pools\n\n\
    A *buffer pool* is associated with a single database, and it can be used by more\
    \ than one table space. When you create a buffer pool for a table space, you must\
    \ ensure that the table space size and the buffer pool page size are the same\
    \ for all of the table spaces that the buffer pool services. A table space can\
    \ use only one buffer pool. Adequate buffer pool size is essential to good database\
    \ performance, because it reduces the amount of input and output by the disk,\
    \ which is the most time-consuming database operation. Large buffer pools also\
    \ have an effect on query optimization, because more of the work can be done in\
    \ memory.\n\n#### 5.4.2.3 Performance implications of storage modeling\n\nWhen\
    \ you design the storage of a schema or database, you should focus primarily on\
    \ utilizing buffers and maximizing the amount of parallelism for input and output.\
    \ Use the following task flow to ensure that your storage models are efficient:\n\
    1. Determine the constraints given by the table designs. You might have to use\
    \ more than one regular table space.\n2. Consider whether having the tables in\
    \ large table spaces with different settings is likely to increase performance.\n\
    3. Design a tentative table space.\n4. Consider using buffer pools, which might\
    \ help you improve upon your table space design.\n5. Allocate containers to the\
    \ table spaces.\n6. Refine the model, and verify that your design is solid by\
    \ thoroughly testing and benchmarking the model."
