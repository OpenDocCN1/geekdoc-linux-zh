    # 1.5 Installing InfoSphere Data Architect


    IBM InfoSphere Data Architect can be installed by using the Launchpad interface,
    or silently, which means that you create a response file of your chosen installation
    options, then run that response file. Silent installations are useful for larger
    installations in which installation must be pushed out to many machines.


    This chapter focuses on the installation that uses the Launchpad interface. It
    assumes you do not have the IBM Installation Manager installed. This means that
    installing IBM InfoSphere Data Architect starts in the Installation Manager. If
    you choose to install additional products that also use that release of Installation
    Manager, you do not need to install Installation Manager again.


    > **Note:**


    As explained in the Data Security, Privacy, and Lifecycle Management information
    center (http://publib.boulder.ibm.com/infocenter/idm/docv3/index.jsp?topic=/com.ibm.datatools.rda.install.doc/topics/c_plan_imover.html),
    IBM Installation Manager is a program for installing, updating, and modifying
    packages. It helps you manage the IBM applications, or packages, that it installs
    on your computer. IBM Installation Manager does more than install packages; it
    helps you keep track of what you have installed, determine what is available for
    you to install, and organize installation directories.


    This chapter assumes that you have administrative privileges on the computer on
    which you are installing the product.


