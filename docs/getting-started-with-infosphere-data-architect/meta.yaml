    ## 第5章 – 物理数据建模\n在本章中，你将学习*物理数据模型*及其与逻辑数据模型的区别。你还将学习如何将逻辑数据模型转换为物理数据模型。学完本章后，你将掌握如何创建和使用物理数据模型，生成特定数据库的DDL语句，从而将数据建模工作转化为可用的数据库架构。\n\
    ### **5.1 物理数据建模：整体概述**\n物理数据模型是针对特定数据库的数据模型，基于数据库规范构建。通过物理数据模型，你除了可以建模分区、表空间、索引等其他存储对象外，还可以对存储进行建模。你可以利用特定数据库及数据库平台独有的属性来建模数据。例如，针对DB2系统、Oracle系统或SQL\
    \ Server系统建模的物理数据模型会有所差异。IBM InfoSphere Data Architect支持多种数据库系统类型和版本，你可以使用物理数据模型为这些系统生成特定数据库的数据对象。\n\
    > **注意：** > InfoSphere Data Architect仅支持针对DB2 for Linux、UNIX和Windows、DB2 for z/OS®以及DB2\
    \ for i5/OS®数据库的存储建模。你仍可在工作台中创建表、列和其他相关对象，但不支持其他数据库厂商（例如表空间、缓冲池）的数据对象。本书中，你将使用针对DB2系统设计的模型进行操作。\n\
