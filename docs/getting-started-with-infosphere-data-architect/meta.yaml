    \ 173\n\n# Preface\nKeeping your skills current in today's world is becoming increasingly\
    \ challenging. There are too many new technologies being developed, and little\
    \ time to learn them all. The DB2® on Campus Book Series has been developed to\
    \ minimize the time and effort required to learn many of these new technologies.\n\
    \n## Who should read this book?\nThis book is intended for anyone who needs to\
    \ learn the fundamentals of data modeling using IBM InfoSphere® Data Architect,\
    \ an Eclipse-based tool that can help you create data models for various data\
    \ servers. By using the IBM InfoSphere Data Architect interface, you can design\
    \ and deploy data models to a number of environments, and you can even integrate\
    \ it with other Eclipse-based products.\n\n## How is this book structured?\nThe\
    \ book is structured as follows:\n- Chapter 1 introduces you to IBM InfoSphere\
    \ Data Architect and gets you up and running with the InfoSphere Data Architect\
    \ workbench (user interface).\n- Chapter 2 introduces you to the basic concepts\
    \ of data modeling and the project that you will complete as you work through\
    \ the exercises in the book.\n- Chapters 3, 4, and 5 walk you through the data\
    \ modeling process:\n  - Chapter 3 teaches you about logical data modeling, and\
    \ it shows you how to start creating your data models. You learn about entities,\
    \ attributes, relationships, glossary models, and naming standards.\n  - Chapter\
    \ 4 helps you get familiar with domain models. In particular, you will learn how\
    \ to create unique data types that can help you specify what data should be masked\
    \ to keep personal information private.\n  - Chapter 5 introduces you to physical\
    \ data modeling. In this chapter, you transform your existing logical data model\
    \ into a new physical data model, which you will then use to generate a DDL script\
    \ that you can use to actually deploy the data model.\n- Chapters 6, 7, 8, and\
    \ 9 acquaint you with the iterative design process:\n  - Chapter 6 walks you through\
    \ the process of creating reports within IBM InfoSphere Data Architect. You learn\
    \ how to draft both BIRT and XSLT reports to share with your larger data modeling\
    \ team.\n  - Chapter 7 describes how reverse-engineering works within the workbench.\
    \ You learn how to create physical data models from DDL scripts and use existing\
    \ database connections so that you can make changes and deploy them to the server.\n\
    \  - *Chapter 8* introduces mapping models and how they help you integrate different\
    \ data models and data sources.\n  - *Chapter 9* covers how to analyze your data\
    \ models to ensure that they are valid, in order to ensure that they conform to\
    \ common best practices and design standards or do not cause errors once the models\
    \ are deployed to the server.\n  - *Chapter 10* describes how IBM InfoSphere Data\
    \ Architect fits in with the greater data management capabilities from IBM, and\
    \ how you can integrate this product with other IBM offerings to further design,\
    \ develop, and manage your data models throughout the entire data life cycle.\n\
    \nExercises are provided with most chapters. There are also review questions in\
    \ each chapter to help you learn the material.\n\n# A book for the community\n\
    This book was created by the community; a community consisting of university professors,\
    \ students, and professionals (including IBM employees). The online version of\
    \ this book is released to the community at no-charge. Numerous members of the\
    \ community from around the world have participated in developing this book, which\
    \ will also be translated to several languages by the community. If you would\
    \ like to provide feedback, contribute new material, improve existing material,\
    \ or help with translating this book to another language, please send an email\
    \ of your planned contribution to [db2univ@ca.ibm.com](mailto:db2univ@ca.ibm.com)\
    \ with the subject \"IBM InfoSphere Data Architect book feedback.\"\n\n## Conventions\n\
    Many examples of commands, SQL statements, and code are included throughout the\
    \ book. Specific keywords are written in uppercase bold. For example: A **NULL**\
    \ value represents an unknown state. Commands are shown in lowercase bold. For\
    \ example: The **dir** command lists all files and subdirectories on Windows.\
    \ SQL statements are shown in upper case bold. For example: Use the **SELECT**\
    \ statement to retrieve information from a table. Object names used in our examples\
    \ are shown in bold italics. For example: The ***flights*** table has five columns.\
    \ Italics are also used for variable names in the syntax of a command or statement.\
    \ If the variable name has more than one word, it is joined with an underscore.\
