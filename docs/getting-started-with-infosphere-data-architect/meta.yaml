    - 了解InfoSphere Data Architect能为您做什么

    - 学习如何创建、部署和更新数据模型

    - 管理和分析数据模型变更的影响

    - 了解如何对数据源进行正向和逆向工程

    - 学习数据隐私、安全和生命周期管理的相关知识

    - 通过实操练习巩固使用技能


    InfoSphere Data Architect是一款协作式数据设计解决方案，可用于发现、建模、可视化、关联和标准化多样化分布式数据资产。您可以使用InfoSphere
    Data Architect在整个数据生命周期中挖掘数据模型的价值，促进跨生命周期、跨角色、跨组织的协作，对齐流程服务、应用和数据架构。


    本书全面介绍了InfoSphere Data Architect，包含使用SQL和DB2 Express-C（DB2免费版本）的实操练习。


