    \ |\n## 表3.1 – 父实体与子实体操作的定义\n5. 保存你的工作。\n## 3.3 使用术语表模型\n有时，同一项目的不同参与者在数据对象命名上存在差异。比如，一位数据架构师可能将销售实体称为`SALES_X`，而另一位数据建模师可能更倾向于使用`SLS_X`。久而久之，系统会变得难以理解，这种不一致还会蔓延至其他系统，造成困惑、延长应用开发周期，甚至无法关联两个不同系统中含义相同的字段。\n\
    \n为避免该问题，你应在数据设计流程早期制定一套命名标准。*命名标准*能帮助你及组织内的其他人员以一致的方式看待数据，确保所有人对数据的理解一致。借助IBM\
