    # ## 5.5.4 Validating the physical data model


    Before you deploy the physical data model, you should validate it. When you validate
    the model, the workbench checks the model to ensure that valid DDL can be generated
    from the data model. The validation process also ensures that your model not only
    adheres to the design standards that you have created, but that it adheres to
    the common data modeling standards. These “best practice” rules are built into
    the product, making it easier for you to ensure that your model is well-designed
    before you deploy it.'
  merge: -1
  pgno: 97
- img_proc: true
  md: 'To validate the physical data model:


    +   1. Right-click on the SAMPLE database in the Data Project Explorer, then select
    *Analyze Model*. The Analyze Model wizard opens. By default, all of the *Physical
    data model* rules are selected.

    2. Deselect the *Dimensional Modeling* and *Naming Standard* options, then click
    *Finish*.


    > **Note:**


    Dimensional modeling is not a topic that is covered in this book. For more information
    about dimensional modeling and its benefits, visit the IBM InfoSphere Data Architect
    information center at http://publib.boulder.ibm.com/infocenter/rdahhelp/v7r5/index.jsp.


    The model is analyzed, and you see a list of warnings and informational messages
    in the Problems view, as shown in *Figure 5.7*.


    ![](img/38311ad87170342fd88ee1165fee68b0_98_0.png)


    **Figure 5.7 – List of warnings in the Problems view**


    For the purposes of this exercise, you do not have to take any steps to correct
    warnings and informational messages; these messages simply let you know of potential
    issues that can impact performance or alert you of where SQL statements might
    fail. For example, when information is INSERTed for the data objects in *Figure
    5.7*, the update might fail, because no default value is explicitly set for the
    columns that are set to NOT NULL. Since your data model is relatively small and
    will not go into a real production environment, you do not need to correct these
    warnings by creating table spaces and indexes.


    However, it is considered a best practice to evaluate each warning to ensure the
    best performance of your schemas and databases.'
