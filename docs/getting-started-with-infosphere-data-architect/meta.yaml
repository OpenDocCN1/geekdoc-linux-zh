  md: '# 5.6 DDL generation


    Now that you have generated a complete physical data model, you are aware of the
    process of creating, editing, and updating data models. Now that you''ve completed
    this process, how do you deploy the database to a test or production environment?


    IBM InfoSphere Data Architect is capable of creating database-specific *data definition
    language (DDL)* scripts from the model that you have created. After you generate
    the DDL script, you can run it on the server, and users can access the model as
    part of the database.


    # 5.6.1 Generating the DDL script from the database object


    You generate the DDL script from the database object of the physical data model.
    The Generate DDL wizard will create the SQL statements to deploy your database
    on a server.


    Let''s create a DDL script to deploy your new database:


    +   1. Connect to the SAMPLE database by right-clicking on the connection in the
    Data Source Explorer and selecting *Connect*.

    2. Right-click on the SAMPLE database in the Data Project Explorer, then select
    *Generate DDL*. The Generate DDL wizard opens.

    3. On the Options page of the wizard, make sure that all of the options are selected,
    then click *Next*.


    > **Note:**

    If you are not deploying the DDL as part of the DDL generation, you do not need
    to connect to the database as the first step.


    Table 5.1 explains the options on the Options page:


    | Option | Explanation |

    |--------|-------------|

    | Check model | The model is validated before the script is created. |

    | Fully qualified names | Any object is referenced by its full name. For example,
    the STUDENT table of the STUDENT_LIFE schema is referenced as STUDENT_LIFE.STUDENT.
    |

    | Quoted identifiers | Specifies if you need to address object within quotes.
    This is done if you want to consider "Table A" and "TABLE A" as two different
    objects. |

    | DROP statements | Includes DROP statements at the beginning of the DDL script
    to drop objects if they are |'
  merge: -1
  pgno: 99
- img_proc: true
  md: '| | already present. |

    | --- | --- |

    | CREATE statements | Includes CREATE statements in the DDL to create or re-create
    data objects. |

    | COMMENT ON statements | Includes the statements from the *Documentation* tab
    of the Properties view of the data objects. |

    | IN TABLESPACE clause | Takes info from the storage model or the default table
    space and adds it to the DDL script. |


    # **Table 5.1 – Available model elements that you can add to the DDL script**


