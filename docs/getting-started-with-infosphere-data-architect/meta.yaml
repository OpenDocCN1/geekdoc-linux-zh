  md: '# Chapter 8 – Model Mapping and Discovery


    Information can come from different data sources, and integration of such data
    is a common requirement in any enterprise. When an existing data source has to
    be integrated with an acquisition data source, understanding the metadata is very
    crucial.


    Metadata is data about the data; it stores the data type of the data, purpose
    of the data, and other identifying information. Understanding metadata helps to
    visualize how the different data sources are related to each other and creating
    mappings and relationships amongst them. Mapping models help you map this metadata
    among a variety of data sources.


    IBM InfoSphere Data Architect provides the following metadata integration tools:


    +   - Define relationships and mappings between data sources

    - Set transformation rules

    - Discover relationships

    - Generate scripts which could be deployed to a database


    # 8.1 Mapping models: The big picture


    ![](img/38311ad87170342fd88ee1165fee68b0_142_0.png)


    **Figure 8.1 – The big picture**'
  merge: -1
  pgno: 142
- img_proc: true
  md: '# 144 Getting started with InfoSphere Data Architect


    A *mapping model* defines relationships between two different schemas: a source
    schema and a target schema. The mapping model is stored as a mapping specification
    language (MSL) file. The source model can be either a logical data model or physical
    data model. The target model can be a **logical data model**, **physical data
    model**, or an XML schema file (XSD).


    Mapping models are a part of information integration modeling. *Information integration
    modeling* provides a set of functions that can help you manage metadata. To integrate
    a new data source with existing enterprise data, you need to understand how the
    data in the new source is related to data in the existing environment. You can
    build a process that copies data from the new data source into the existing source.
    By defining mappings and relationships, you can manipulate a large set of disparate
    metadata.


    # ## 8.1.1 Managing metadata with mapping models


    IBM InfoSphere Data Architect helps you manage the metadata about your models
    in the following ways:


    +   - **Discover relationships**: The workbench can help you discover methods
    that show you how one or more source schemas might be related to a target schema.
    The relationships can be based on the metadata or any available data samples.

    - **Map relationships**: IBM InfoSphere Data Architect visually maps your source
    and target data models and the relationships that are discovered or manually specified.
    The mapping that you create describes how you can combine and transform data that
    is represented by one or more source models into some form that is appropriate
    to a target model. The results are saved in a mapping model.

    - **Build expressions**: You can define criteria, such as functions, join conditions,
    filter conditions, and sort conditions, that you can add to the mapping model.
    Use these expressions in scripts that you deploy.

    - **Generate scripts**: You can generate a script from the mapping model that
    can be used to transform and filter data from mapping model-compliant sources
    to mapping model-compliant targets.


    Mapping models help us integrate different models from various sources by defining
    relationships amongst them. Transformation rules can be added to the relationships
    and mappings created between schemas.


    A *mapping* is a dependency between two data structures that is not implemented
    in the data source. A mapping model stores the summary of these mappings.


    Assume that this student information system is one that is designed to work with
    multiple campuses. For example, some universities have a main campus, and they
    also make use of smaller, satellite campuses, typically within the same geographical
    area. Assume that the `NEW_SDT_INFO_SYS.dbm` physical data model models some of
    the data from a smaller satellite campus for a major university, but you want
    to seamlessly integrate that information


    Since you reverse-engineered the physical data model in Chapter 6, you can create
    a mapping model to map some of its metadata to the corresponding objects in the
    **STUDENT_INFO_SYSTEM.dbm** physical data model file.'
  merge: -1
