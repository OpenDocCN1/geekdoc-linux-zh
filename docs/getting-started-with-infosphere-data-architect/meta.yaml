    # ## 5.5.2 Creating roles within the physical data model


    Roles simplify the administration and management of privileges. A *role* is a
    database object that groups together one or more privileges and can be assigned
    to users, groups, PUBLIC, or other roles. Roles provide several advantages that
    make it easier to manage privileges in a database system:


    +   * **Security administrators** (SECADM) can control access to their databases
    in a way that mirrors the structure of their organizations. They can create roles
    in the database that map directly to the job functions in their organizations.


    +   * **Users** are granted membership in the roles that reflect their job responsibilities.
    As their job responsibilities change, their membership in roles can be easily
    *granted* and *revoked*.


    +   * The assignment of privileges is simplified. Instead of granting the same
    set of privileges to each individual user in a particular job function, the administrator
    can grant this set of privileges to a role that represents that job function and
    then grant that role to each user in that job function.


    +   * A role''s privileges can be updated and all users who have been granted
    that role receive the update. The administrator does not need to update the privileges
    for every user on an individual basis.


    +   * The privileges and authorities granted to roles are always used when you
    create views, triggers, materialized query tables (MQTs), static SQL and SQL routines,
    whereas privileges and authorities granted to groups (directly or indirectly)
    are not used. Because roles are managed inside the database, the DB2 database
    system can determine when authorization changes and act accordingly.'
