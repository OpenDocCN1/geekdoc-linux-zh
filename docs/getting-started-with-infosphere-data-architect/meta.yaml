    # Chapter 2 – Data Modeling Overview


    When you create data models, you follow a certain process. This book introduces
    some best practices and concepts to ensure that the models you create within the
    workbench adhere to good data design principles.


    In this chapter, you will learn about the following concepts:


    +   - The data design life cycle

    - How data models are typically organized

    - The information management system that you will create as a result of this book


    > **Note:**

    For more information about Data Modeling, review the eBook [Database Fundamentals](Database
    Fundamentals) that is part of this book series.


    # 2.1 The data model design life cycle


    With this book, you will learn how to create data models that can be used to create
    databases. The data model design life cycle helps you conceptualize and develop
    your data model, using an iterative design process.


    Data modeling is done through two methods of engineering:


    +   * **Forward-engineering:** Data models and databases are built from scratch,
    without a pre-existing model to work from. This type of modeling is best done
    for new systems or when modeling new business processes that are not yet addressed
    by your current systems.

    * **Reverse-engineering:** Existing data models and databases are used to create
    models within the workbench. The workbench is capable of creating physical data
    models from existing databases and schemas, and you can use the transformation
    tool to create logical data models to further refine your projects.'
