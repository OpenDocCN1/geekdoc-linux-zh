    the remaining relationships and determine whether to accept the mappings.


    To accept or reject discovered relationships:


    +   1. Select the mapping for the STUDENT.LAST_NAME relationship. The mapping
    line changes to a brown color, and the discovered mapping displays in the Properties
    view.


    +   2. Right-click on the mapping and select *Accept Mapping*, as shown in Figure
    8.8.


    ![](img/38311ad87170342fd88ee1165fee68b0_150_0.png)


    The mapping line color changes to blue.


    +   3. Use the method outlined in steps 1 and 2 above to approve the mapping for
    the STUDENT.STUDENT_SSN and STUDENT.EMAIL_ADDR mappings.


    +   4. Save your work.


    At this point, you probably realize that with large data models, this can be a
    tedious process. Now that you are familiar with how to accept or reject mappings
    manually, you can view the remaining mappings and determine whether to accept
    all of the proposed mappings.


    +   5. Expand all of the table nodes in the *Source* and *Target* panes. The editor
    should look like the image in *Figure 8.9*.'
- md: "6. View the mappings and verify that they should be mapped together. In this\
    \ case, you would speak with your extended team at the satellite campus to determine\
    \ what each column is intended to do, and then determine which columns should\
    \ be mapped. Since you reverse-engineered the **NEW_SDT_INFO_SYS.dbm** physical\
    \ data model, you know that the discovered relationships are, in fact, mapped\
    \ correctly.\n7. Right-click in the mapping editor and select *Accept All Mappings*.\n\
    8. Save your work. The color of the mapping lines changes to light-blue, making\
    \ them a valid part of the mapping model.\n\n## 8.3 Types of mapping\nFive types\
    \ of mappings can be identified, depending on their properties and how they were\
    \ created. Mappings are represented in the editor by lines that are drawn between\
    \ the source and target nodes. Each mapping line contains a hub in the middle\
    \ of the line. The color of the line depends on the type of mapping. Discovered\
    \ mapping lines contain hubs that appear as brackets. All other mapping lines\
    \ contain square hubs.\n\n- **Mappings:** A mapping connects one or more source\
    \ columns to a single target column or an XML schema document (XSD) simple element\
    \ or attribute.\n- **Discovered mappings:** These are the mappings proposed from\
    \ the Discover Relationships wizard. You can either accept or reject the individual\
    \ mapping of each relationship. Discovered mapping lines contain hubs that appear\
    \ as brackets, until you approve or reject them. If you approve a discovered mapping,\
    \ the hub changes to a square.\n- **Constant mappings:** These mappings have a\
    \ target element, but they do not have a source element. This can be used to select\
    \ a transformation function like date or time function to assign it to target\
    \ element. You create constant mappings by right-clicking a target element in\
    \ the *Mapping Group Details* view, then selecting *Create Constant Mapping* from\
    \ the menu.\n- **Mapping groups:** Mapping groups sort mapped elements by the\
    \ target table (in a relational database) or by the element (in an XML schema).\
    \ When you generate scripts for these mapping groups, one query is generated per\
    \ mapping group.\n- **Invalid mappings:** The mapping becomes invalid when you\
    \ change the properties of data objects in the source or target model. When the\
    \ mapping editor is opened, all of the mappings are re-validated. If the source\
    \ or target object is no longer valid, then the mapping is invalidated and a red\
    \ \"X\" will appear on the mapping line.\n\n## 8.4 Adding expressions and filters\
    \ to the mapping model\nYou can create transformation statements for each mapping\
    \ that is created. The expression may be a filter, join, sort, or a transformation\
    \ function on a source column to get the desired target column value. The expression\
    \ may change either the value or data type of the source column to be compatible\
    \ with the target column. These expressions are SQL fragments and appear in the\
    \ DDL that you generate from the mapping model. Let's create a mapping transformation\
    \ expression to make sure that all of the rows in the `STUDENT.FIRST_NAME` column\
    \ of the `NEW_SDT_INFO_SYS.dbm` physical data model appear in uppercase when they\
    \ are consolidated with the information in the `STUDENT_INFO_SYSTEM.dbm` physical\
    \ data model.\n\nTo create a transformation expression:\n1. Select the mapping\
    \ line between the two `STUDENT.FIRST_NAME` columns. The properties of the mapping\
    \ appear in the Properties view.\n2. Click the *Expression Builder* button next\
    \ to the *Transformation* field. The Expression Builder window opens.\n3. Select\
    \ a function. In this case, you will add a function to make sure that all first\
    \ names stored in the database are stored in uppercase characters. Expand the\
    \ *String* node and select the `UCASE(VARCHAR)` – `VARCHAR` function. The function\
    \ appears in the *Transformation expression* pane.\n4. Place the cursor between\
    \ the parentheses, as shown in *Figure 8.10*.\n\n### Figure 8.10 – Placing the\
    \ cursor to format the expression\n5. Add the STUDENT.FIRST_NAME column to the\
    \ expression by double-clicking the column. The expression should look like the\
    \ image in *Figure 8.11*.\n\n### Figure 8.11 – Creating a complete expression\n\
    6. Click *OK* to add the transformation expression to the mapping model.\n\n##\
    \ 8.5 Generate scripts that you can deploy\nYou can generate a SQL script from\
    \ the mapping model. This SQL script contains the SQL scripts necessary to account\
    \ for all of the mappings that you created in the mapping model. The script can\
    \ then be deployed onto a database. Let's generate a script to deploy the mapping\
    \ model:\n1. Locate the **STUDENT_MAPPING.msl** mapping model in the Data Project\
    \ Explorer: *University Info System -> Mappings -> STUDENT_MAPPING.msl*.\n2. Right-click\
    \ on the mapping model file and select *Generate script*. The Generate Script\
    \ wizard opens.\n3. Complete the Generate Script Options page:\n   a. Make sure\
    \ that the SQL query language is selected.\n   b. Make sure that the *Create a\
    \ Select statement* query type is selected.\n   c. Select the *Create fully qualified\
    \ names* check box.\n   d. Specify **STUDENT_MAPPING.sql** as the script file\
    \ name.\n   e. Click *Next*.\n4. Review the script on the Summary page, then click\
    \ *Finish* to generate the SQL script. The script is generated and opens in the\
    \ editor view. When you run this script on the server, the queries run and generate\
    \ the mappings between the schemas in the physical data models.\n\n## 8.6 Export\
    \ mapping models in CSV format\nYou can export the mapping model into a comma\
    \ separated file (using the **.csv** file extension). The CSV format is supported\
    \ by other tools (including spreadsheet tools), and therefore, you can use this\
    \ file to import the mapping model into other tools. When you export a mapping\
    \ model to a file in CSV format, the contents of the mapping model are transformed\
    \ as follows:\n- For one-to-one mappings, the resulting CSV file contains one\
    \ row for each mapping.\n- For many-to-one mappings, there are multiple rows,\
    \ one for each source and target pair.\n\nExport your mapping model to a CSV file:\n\
    1. From the main menu, click *File -> Export*. The Export wizard opens.\n2. Expand\
    \ the *Data* node, and select the *Export a mapping model to a file in CSV format*\
    \ option, then click *Next*.\n3. Complete the Mapping Model Export page:\n   a.\
    \ Click the Browse button next to the *Model to export* field. The Export Mapping\
    \ Model window opens.\n   b. Select the `STUDENT_MAPPING.msl` mapping model file,\
    \ then click *OK* to add it to the wizard.\n   c. Click the Browse button next\
    \ to the *Export to* field. The Save As window opens.\n   d. Specify `STUDENT_MAPPING.csv`\
    \ in the *File name* field, then click *OK*.\n4. Click *Finish* to create the\
    \ CSV file in your workspace. The CSV file is created and saved in the *University\
    \ Info System* directory of your workspace path. For example, it could be saved\
    \ to the following file path on a Windows machine:\n```\nC:\\Documents and Settings\\\
    Administrator\\IBM\\workspaces\\IDA_GettingStarted\\University Info System\\STUDENT_MAPPING.csv\n\
    ```\nYou can import this file to other tools that support the *.csv* file format.\n\
    \n## 8.7 Exercise\n1. Create a mapping model of the `NEW_SDT_DDL.dbm` physical\
    \ data model and the `STUDENT_INFO_SYSTEM.dbm` physical data model.\n2. Run the\
    \ Discover Relationships tool and approve or reject mappings within the mapping\
    \ model.\n3. Create new mappings as necessary.\n4. Add a transformation function\
    \ to one of the mappings.\n5. Generate an SQL script from the mapping model.\n\
    6. Create a CSV file that can be used with other tools.\n\n## 8.8 Summary\nIn\
    \ this chapter, you learned about mapping models and how they can be used to manage\
    \ various data sources and the relationships between data models. You learned\
    \ how to create a mapping model and discover the potential relationships between\
    \ the objects in your data models, and you also learned how to manually create\
    \ the relationships between these objects. Then you generated a SQL file to create\
    \ these relationships on the server, and you generated a CSV file to use the mapping\
    \ model in other tools.\n\n## 8.9 Review questions\n1. What is a mapping model?\n\
    2. Why would you need to create a mapping model?\n3. What are the different types\
    \ of mapping?\n4. Which of the following transformation functions can be added\
    \ to a mapping group?\n   A. Filter"
  mdcn: "\n6. 查看映射关系，确认这些列应当被配对映射。在这种情况下，你需要联系卫星校区的扩展团队，明确每列的预期用途，再判断哪些列需要建立映射。由于你已对**NEW_SDT_INFO_SYS.dbm**物理数据模型进行了逆向工程，因此你知晓所发现的关系实际上已被正确映射。\n\
    7. 在映射编辑器内右键单击，选择*接受所有映射*。\n8. 保存你的工作。映射连线的颜色会变为浅蓝色，说明它们已成为映射模型的有效组成部分。\n## 8.3\
    \ 映射类型\n根据属性和创建方式的不同，可将映射分为五类。在编辑器中，映射以源节点与目标节点之间绘制的连线表示。每条映射连线的中间都有一个中心节点。连线颜色取决于映射的类型。\n\
    已发现的映射连线的中心节点为括号样式。其余所有映射连线的中心节点均为方括号样式。\n- **映射：** 映射会将一个或多个源列连接到单个目标列，或XML架构文档（XSD）的简单元素/属性。\n\
    - **已发现映射：** 这类映射由“发现关系”向导提出。你可以接受或拒绝每条关系的单独映射。在批准或拒绝已发现映射前，其连线中心节点为括号样式；若你批准某条已发现映射，中心节点会变为方括号样式。\n\
    - **常量映射：** 这类映射拥有目标元素，但没有源元素。可用于选择转换函数（如日期、时间函数）并将其分配给目标元素。你可以在*映射组详细信息*视图中右键单击目标元素，然后从菜单中选择*创建常量映射*来生成常量映射。\n\
    - **映射组：** 映射组按目标表（关系型数据库中）或元素（XML架构中）对已映射元素进行分类。为这些映射组生成脚本时，每个映射组会生成一条查询。\n-\
    \ **无效映射：** 若你更改了源或目标模型中数据对象的属性，映射会变为无效。打开映射编辑器时，所有映射都会重新验证。如果源或目标对象不再有效，则映射会被标记为无效，映射连线上会出现红色“X”标识。\n\
    ## 8.4 向映射模型添加表达式和过滤器\n你可以为每个已创建的映射定义转换语句。表达式可以是过滤器、连接、排序，或是对源列的转换函数，用于获取所需的目标列值。表达式可修改源列的值或数据类型，使其与目标列兼容。这些表达式是SQL片段，会出现在你从映射模型生成的数据定义语言（DDL）中。\n\
    现在我们创建一个映射转换表达式，确保`NEW_SDT_INFO_SYS.dbm`物理数据模型中`STUDENT.FIRST_NAME`列的所有行，在与`STUDENT_INFO_SYSTEM.dbm`物理数据模型的信息整合时，以大写形式呈现。\n\
    创建转换表达式的步骤如下：\n1. 选中两个`STUDENT.FIRST_NAME`列之间的映射连线。映射的属性将显示在“属性”视图中。\n2. 点击*转换*字段旁的*表达式生成器*按钮，将打开表达式生成器窗口。\n\
    3. 选择一个函数。本例中，你需要添加一个函数，确保数据库中存储的所有名字都为大写字符。展开*字符串*节点，选择`UCASE(VARCHAR)` – `VARCHAR`函数，该函数将显示在*转换表达式*窗格中。\n\
    4. 将光标置于括号内，如*图8.10*所示。\n### 图8.10 – 将光标置于指定位置以格式化表达式\n5. 双击`STUDENT.FIRST_NAME`列，将其添加到表达式中。表达式应如*图8.11*所示。\n\
    ### 图8.11 – 创建完整的表达式\n6. 点击*确定*，将转换表达式添加到映射模型中。\n## 8.5 生成可部署的脚本\n你可以从映射模型生成SQL脚本，该脚本包含为映射模型中创建的所有映射生成所需的全部SQL语句，之后可将该脚本部署到数据库上。\n\
    现在我们生成一个用于部署映射模型的脚本：\n1. 在“数据项目资源管理器”中定位到**STUDENT_MAPPING.msl**映射模型：*大学信息系统 ->\
    \ 映射 -> STUDENT_MAPPING.msl*。\n2. 右键单击映射模型文件，选择*生成脚本*，将打开“生成脚本”向导。\n3. 完成“生成脚本选项”页面：\n\
    \   a. 确保已选择SQL查询语言。\n   b. 确保已选择*创建SELECT语句*查询类型。\n   c. 勾选*创建完全限定名称*复选框。\n \
    \  d. 将**STUDENT_MAPPING.sql**指定为脚本文件名。\n   e. 点击*下一步*。\n4. 在“摘要”页面查看脚本，然后点击*完成*生成SQL脚本。脚本生成后将在编辑器视图中打开。当你在服务器上运行此脚本时，查询将执行并生成物理数据模型中架构之间的映射。\n\
    ## 8.6 以CSV格式导出映射模型\n你可以将映射模型导出为逗号分隔文件（使用**.csv**文件扩展名）。CSV格式受其他工具（包括电子表格工具）支持，因此你可以使用该文件将映射模型导入其他工具。\n\
    将映射模型导出为CSV格式文件时，映射模型的内容会按以下规则转换：\n- 对于一对一映射，生成的CSV文件中每条映射对应一行。\n- 对于多对一映射，会生成多行，每个源-目标对对应一行。\n\
    将映射模型导出为CSV文件的操作步骤如下：\n1. 点击主菜单中的*文件 -> 导出*，将打开“导出”向导。\n2. 展开*数据*节点，选择*将映射模型导出为CSV格式文件*选项，然后点击*下一步*。\n\
    3. 完成“映射模型导出”页面：\n   a. 点击*要导出的模型*字段旁的“浏览”按钮，将打开“导出映射模型”窗口。\n   b. 选择`STUDENT_MAPPING.msl`映射模型文件，然后点击*确定*将其添加到向导中。\n\
    \   c. 点击*导出到*字段旁的“浏览”按钮，将打开“另存为”窗口。\n   d. 在*文件名*字段中输入`STUDENT_MAPPING.csv`，然后点击*确定*。\n\
    4. 点击*完成*，在工作区中创建CSV文件。CSV文件会保存在工作区路径的*大学信息系统*目录下。例如，在Windows系统中可能保存在以下文件路径：\n\
    ``` C:\\Documents and Settings\\Administrator\\IBM\\workspaces\\IDA_GettingStarted\\\
    University Info System\\STUDENT_MAPPING.csv ```\n你可以将此文件导入到支持*.csv*文件格式的其他工具中。\n\
    ## 8.7 练习\n1. 为`NEW_SDT_DDL.dbm`物理数据模型和`STUDENT_INFO_SYSTEM.dbm`物理数据模型创建映射模型。\n\
    2. 运行“发现关系”工具，并在映射模型中批准或拒绝映射。\n3. 按需创建新的映射。\n4. 为其中一条映射添加转换函数。\n5. 从映射模型生成SQL脚本。\n\
    6. 创建可与其他工具配合使用的CSV文件。\n## 8.8 小结\n在本章中，你学习了映射模型的相关知识，以及如何利用其管理各类数据源和数据模型间的关系。你学习了如何创建映射模型、发现数据模型中对象间的潜在关系，也学习了如何手动创建这些对象间的关系。之后你生成了SQL文件以在服务器上创建这些关系，还生成了CSV文件以便在其他工具中使用映射模型。\n\
    ## 8.9 复习题\n1. 什么是映射模型？\n2. 为什么需要创建映射模型？\n3. 映射有哪些不同类型？\n4. 以下哪些转换函数可以添加到映射组中？\n\
    A. 过滤器\n"
