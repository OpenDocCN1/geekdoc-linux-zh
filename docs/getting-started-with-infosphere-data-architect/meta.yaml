    # ## 7.6 Summary


    We have seen how the process of reverse-engineering helps us in creating a physical
    data model from an existing set of tables and schemas in our database or from
    a DDL script. We have also seen how we can choose the type of database elements
    which we want to incorporate into the reverse engineered model when reverse-engineering
    from a database. We have seen how the compare and merge process can help us manage
    the changes to an existing database without losing any existing data.


