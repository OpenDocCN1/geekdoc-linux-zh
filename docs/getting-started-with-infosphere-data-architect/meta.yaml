    \ of one or more GRADES.\n\n## Chapter 4 – Domain Models\n![](img/38311ad87170342fd88ee1165fee68b0_76_0.png)\n\
    \nIn this chapter, you will learn how to create a domain model. *Domain models*\
    \ describe domain data types and their constraints that are specific to an organization.\
    \ You can define domain models as part of the logical data model, or you can create\
    \ a separate domain model that can be used throughout all logical and physical\
    \ data models for a project. You will create a domain model that can be used to\
    \ model what information should be secured in a test environment – in particular,\
    \ you will secure the social security numbers, last names, and email addresses\
    \ of each student. The test system will be populated with realistic data, and\
    \ the privacy rules that you specify ensure that sensitive information is still\
    \ protected. Then, you will associate this domain model with the data objects\
    \ in the logical data model.\n\n> **Note:** The domain models that you create\
    \ in InfoSphere Data Architect can be shared with the Optim Data Privacy Solution\
    \ suite of products. To learn more about the Optim Data Privacy Solutions, visit\
    \ this URL: http://www-01.ibm.com/software/data/optim/protect-data-privacy/\n\n\
    ### 4.1 Domain models\n\nDomain models describe the domain data types and their\
    \ constraints that an organization allows. You can create organization-specific\
    \ data types within a domain model (in other words, data types that describe aspects\
    \ of a certain domain). Using a domain data type instead of the base data type\
    \ ensures that you maintain consistency across an organization, and you can reuse\
    \ the common data type definitions to make your team more efficient. Domain data\
    \ types can be stored in a domain model or as part of a logical data model. You\
    \ can associate a domain data model with a data design project so that the domain\
    \ data types are available for all of your logical and physical data models. Using\
    \ atomic domains instead of base data types ensures consistency among team members.\n\
    \nGetting started with InfoSphere Data Architect\nA domain model consists of a\
    \ group of domain data types. A domain data type represents a base data type that\
    \ can be restricted by adding constraints. You can use the domain model to define\
    \ the domain data types for attributes or columns within logical or physical data\
    \ models. Domain data types are based on base data types. For example, you can\
    \ define domain data types for common descriptors, such as gender or grade. IBM\
    \ InfoSphere Data Architect can be used to create domain models and atomic domains.\
    \ These models can be shared among all team members who are working on modeling\
    \ tasks. IBM InfoSphere Data Architect provides the tooling that helps you create\
    \ and manage domain models. You can create a domain model from a wizard, either\
    \ from an existing template or from scratch. Use the Data Project Explorer to\
    \ add domain objects, then use the Properties view to modify them.\n\nThe following\
    \ list details some best practices for domains:\n- Group all domains into one\
    \ or more domain models, so that these domains can be reused in future projects.\n\
    - Create a separate enterprise standard project that contains any glossary or\
    \ domain model that is universally shared throughout the organization.\n- Create\
    \ a domain model within a specific project for legacy models that might have domains\
    \ that were created before any enterprise domains if they do not conform to the\
    \ newer enterprise standard.\n- Give the domain model a meaningful name. You might\
    \ want to include \"domain\" as part of the model name to easily identify the\
    \ domain model in the Data Project Explorer view.\n- Create subpackages (separate\
    \ domain packages under the root domain package) to provide a logical grouping\
    \ of domains within a specific business subject area.\n\nNow that you have created\
    \ the base logical data model, you have been asked to also store sensitive information\
    \ within the logical data model, including social security numbers and email addresses.\
    \ Before you expand the logical data model to include this information, you decide\
    \ to create a domain model that will secure this sensitive information. Then,\
    \ you will create new attributes in the STUDENT entity and use the domain model\
    \ data types to define the attributes. First, let's define a domain model to protect\
    \ personally identifiable information. This domain model will help you ensure\
    \ that the personal information of students is protected.\n\n### 4.1.1 Creating\
    \ a blank domain model\n\nLet's create the STUDENT_PII_DOMAIN domain model:\n\
    1. Right-click the Data Models folder in the Data Project Explorer, then select\
    \ New -> Domain Model. The New Domain Model window opens.\n2. Specify the *File\
    \ name* for the domain model: **STUDENT_PII_DOMAIN**.\n3. Make sure that the *Add\
    \ to project properties* option is selected, then click *Finish*. The **STUDENT_PII_DOMAIN.ddm**\
    \ domain model is created in the *Data Models* folder of the data design project.\n\
    4. Specify the name for the root package of the domain model:\n   a. Select the\
    \ package underneath the STUDENT_PII_DOMAIN domain model, as shown in *Figure\
    \ 4.1*.\n   ![](img/38311ad87170342fd88ee1165fee68b0_78_0.png)\n   **Figure 4.1**\
    \ – Selecting the STUDENT_PII_DOMAIN domain model\n   The properties for the package\
    \ display in the Properties view.\n   b. Specify the following name in the *Name*\
    \ field: **STUDENT_PII_ROOT**\n5. Save your work. The domain model and package\
    \ are created and displayed in the Data Project Explorer.\n\nNow that you have\
    \ created an empty domain model, you can add an atomic domain, list domain, or\
    \ union domain. In this exercise, you will add an atomic domain to secure the\
    \ social security numbers of each student.\n\n### 4.1.2 Atomic domains\n\n*Atomic\
    \ domains* are custom data types that you create to maintain consistency across\
    \ your organization. You create domain-specific rules, then use these rules to\
    \ define other objects within your data models. For example, you could define\
    \ a domain model for grades to ensure that no values outside an appropriate range\
    \ are entered. You can only accept values between 1 and 10 on a 10-point scale.\n\
    \nYou can also create a domain model to specify when data is private and requires\
    \ masking, such as a student or a teacher identifier. By default, data masking\
    \ is not enforced, but to ensure privacy of sensitive data elements, you should\
    \ enforce data privacy. With an atomic domain, you typically specify privacy rules\
    \ for four areas:\n- Classification: In a test environment, how should this data\
    \ be classified? Is it personally identifiable information, or is it confidential?\n\
    - Enforcement: In a test environment, is privacy for this atomic domain required,\
    \ not required, or simply a best practice?\n- Privacy policy type: What type of\
    \ information do you want to mask in a test environment?\n- Privacy policy: What\
    \ type of masking should a test system use?\n\n### 4.1.2.1 Creating an atomic\
    \ domain\n\nYou decide that you should first secure student social security numbers.\
    \ To do this, you will create a new atomic domain, **SSN**, that will display\
    \ a random social security number to mask that sensitive piece of information.\
    \ This atomic domain creates a unique data type within the data design project,\
    \ and you can use this special data type for various models throughout your project.\
    \ This domain model can be used throughout the design process to define the policies\
    \ that you should apply to the student information stored in this model. This\
    \ will help you ensure consistency across your data models.\n\nLet's create the\
    \ SSN and STUDENT_ID atomic domains:\n1. Right-click on the STUDENT_PII_ROOT package,\
    \ then select *Add Data Object* -> *Atomic Domain*. A new atomic domain object\
    \ is created in the Data Project Explorer under the root domain package.\n2. Name\
    \ the atomic domain object **SSN**.\n3. Define the base data type of the SSN atomic\
    \ domain object in the *General* tab of the Properties view. Since social security\
    \ numbers contain both numbers and dashes, you should specify a base data type\
    \ of CHAR(11).\n4. Specify the data privacy properties for this atomic domain\
    \ data type:\n   a. Open the *Data Privacy* tab of the Properties view.\n   b.\
    \ Specify the following settings to mask the students' social security numbers:\n\
    \   - Classification: Personally Identifiable Information\n   - Enforcement: Required\n\
    \   - Privacy Policy Type: Social Security Number (SSN)"
