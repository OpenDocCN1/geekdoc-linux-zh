  md: "# ## 6.2 An insight into reporting\n\nThe reporting feature of IBM InfoSphere\
    \ Data Architect allows you to generate reports that help you analyze a data model\
    \ or a package. There are various built-in templates available in IBM InfoSphere\
    \ Data Architect which can be used to generate a report. You will see the information\
    \ related to various built-in templates in IBM InfoSphere Data Architect in the\
    \ next section.\n\nReporting in IBM InfoSphere Data Architect is done via two\
    \ methods:\n\n+   - Business Intelligence Reporting Tool (BIRT) reporting\n- XSLT\
    \ reporting\n\n*BIRT reports* are a widely used reporting format in IBM InfoSphere\
    \ Data Architect. It gives greater flexibility and more options for the output\
    \ format of a report. It supports multiple output formats.\n\n*XSLT reports* only\
    \ support PDF output.\n\nIBM InfoSphere Data Architect supports various built-in\
    \ templates to generate reports for your logical, physical, glossary and mapping\
    \ models. The file extension for a BIRT report template is `.rptdesign`, and for\
    \ an XSLT report, the file extension is `.xsl`.\n\n> **Note:**\n\nYou can also\
    \ create your own report templates. You will create one later in the Exercise\
    \ section of this chapter.\n\n# ## 6.3 Generating a BIRT Report\n\nLet's learn\
    \ how to create a BIRT report by using an existing data model. We will use the\
    \ existing `STUDENT_INFO_SYSTEM.dbm` physical data model to create a report in\
    \ HTML format with the *Physical Data Model* report type.\n\nFirst, you will see\
    \ how easy it is to generate a physical data model report. Then, you will learn\
    \ how to customize your reports by using the Report Design perspective to specify\
    \ the data objects for which to create a report.\n\n# ### 6.3.1 Generating a basic\
    \ physical data model report\n\nWhen you create a report model template, you can\
    \ re-use them to produce reports that contain the same information and basic formatting.\
    \ This helps you provide a consistent experience when presenting model reports\
    \ to business process owners.\n\nUse the Report Configurations window to create\
    \ a report of your existing physical data model:\n\n+   1. Click *Run* -> *Report*\
    \ -> *Report Configurations*. The Report Configurations window opens.\n2. Double-click\
    \ the *BIRT Report* option in the left pane. A new report configuration is created\
    \ and opens in the Report Configurations window.\n3. Specify the options for the\
    \ report:\n\ta. In the *Name* field, specify `SDT_Info_Sys`."
  merge: -1
