    #### 2.5 What's next?\nNow that you know the basics of data modeling, you should\
    \ start to draft a design. Using this book, you will become acquainted with the\
    \ workbench and how to create complete data models, from start to finish, that\
    \ you can deploy and refine.\n\n## PART II – MODELING YOUR DATA\n\n### Chapter\
    \ 3 – Logical Data Modeling\n\n![](img/38311ad87170342fd88ee1165fee68b0_48_0.png)\n\
    \nLogical data models are just the first step in the data design life cycle. Logical\
    \ data models help you capture the requirements of the business, and you start\
    \ creating the future design of your schemas and databases before you design the\
    \ physical storage and deploy the model. This chapter covers the following concepts:\n\
    - How to design a logical data model\n- Creating diagrams to visually display\
    \ the design of your models\n- Developing glossary models and naming standards\
    \ for your organization\n- Applying those glossary models and naming standards\
    \ to your data models\n\n> **Note:**\n> For more information about Logical Data\
    \ Modeling, review the eBook [Database Fundamentals] that is part of this book\
    \ series.\n\n#### 3.1 Logical data modeling: The big picture\n\n![](img/38311ad87170342fd88ee1165fee68b0_49_0.png)\n\
    \n**Figure 3.1** – Use InfoSphere Data Architect as your data modeling tool\n\n\
    When you create a logical data model, you take the first step in developing a\
    \ database or schema that addresses business needs. A *logical data model* is\
    \ a model that isn't specific to a database vendor. The logical data model describes\
    \ things about which an organization wants to collect data, and it documents the\
    \ relationships between these things. Logical data models are organized hierarchically\
    \ and contain objects such as packages, entities, attributes, and other relationship\
    \ objects. Before you create a logical data model, you must gather the requirements\
    \ for the model. A business user's description of his or her requirements may\
    \ be incomplete. Often, business users or clients may give you only some pieces\
    \ of a whole. You may be given a very vague description of a business process:\
    \ \"The business must track the sales of our products.\" You, as a data modeler,\
    \ must understand all of the requirements of the project in order to gather the\
    \ missing pieces and construct a complete model. After you gather initial requirements,\
    \ you present the outcome to the client, preferably by presenting a diagram, and\
    \ you work with the client to negotiate the relevant and insignificant aspects,\
    \ as you can see in *Figure 3.1*. After negotiations, you (the data modeler) modify\
    \ the logical data model and present the revised model to the client. Through\
    \ this iterative process, you draft and develop a complete logical data model.\
    \ The development of the logical data model is introduced in this chapter.\n\n\
    #### 3.2 Creating a logical data model\nOne of the most difficult problems you\
    \ will encounter as you create a logical data model for a project is to come to\
    \ agreement on what business process should be modeled. You should work with your\
    \ client to determine the needs of the business that the project will satisfy.\
    \ To create a logical data model of a business process, you should use the following\
    \ process:\n- Analyze the various needs of the business. Start with the most important\
    \ business process. Document the analysis, so that you and other data modelers\
    \ can understand the goals and future plans of the project.\n- Work with the project\
    \ owners to determine what data they want to identify and why the data is important.\
    \ You can use this to identify preliminary data objects that are common across\
    \ several processes, data sources, or the various grains of each data object.\n\
    - Meet with project owners to resolve ambiguous requirements.\n- Make a preliminary\
    \ plan to meet the requirements. Create a conceptual model, drafting the initial\
    \ design of the logical data model. You will use this plan to draft your data\
    \ model.\n\n##### 3.2.1 Creating a logical data model with the workbench\nYou\
    \ meet with business process owners for the university. They ask you to help them\
    \ create a student information management system that collects student information.\
    \ After further meetings, you decide to start small. You will create a logical\
    \ data model that tracks basic student information, such as student ID number,\
    \ grades, and classes. To learn how to create a logical data model with the workbench,\
    \ you will create a small logical data model, named **STUDENT_INFO_SYSTEM**.\n\
    \n###### 3.2.1.1 Creating a new data design project to store your models\nBefore\
    \ you can create a logical data model, you need to create a *new data design project*,\
    \ where your files are stored. Use this data design project to store all of the\
    \ data models for this project. You can have multiple data design projects within\
    \ a workspace, and each data design project can contain multiple data models.\
    \ To create a new data design project:\n- Click on *File -> New -> Data Design\
    \ Project*. The New Data Design Project window opens.\n  > **Note:** Since your\
    \ workspace is more than likely empty, you can also click the *Click to create\
    \ a new data design project* link. However, this link is not available once you\
    \ create your first data design project.\n- In the *Project* field, specify a\
    \ descriptive name for your project. Type **University Info System**.\n- Click\
    \ *Finish*. The University Info System data design project is created in the Data\
    \ Project Explorer. In the data design project, there are folders that store the\
    \ files in your project.\n\n###### 3.2.1.2 Creating your first logical data model\n\
    Currently, the project is empty, so you must create a new logical data model.\
    \ You will use this logical data model to start creating the student information\
    \ management system. Create a new logical data model:\n- Open the New Logical\
    \ Data Model window:\n  - In the Data Project Explorer view, expand the *University\
    \ Info System* data design project.\n  - Right-click on the *Data Models* folder,\
    \ then choose *New* -> *Logical Data Model*. The New Logical Data Model window\
    \ opens.\n- Complete the fields of the New Logical Data Model window:\n  - Specify\
    \ the following text in the *File name* field: **STUDENT_INFO_SYSTEM**.\n  - Click\
    \ *Finish*. The logical data model is created, and the data model is opened, including\
    \ a blank diagram. You can use the diagram editor to create a visual representation\
    \ of your logical data model.\n\n*Figure 3.2* shows your new data design project\
    \ and the new, empty logical data model."
  mdcn: "\n本书下一部分将聚焦数据设计生命周期中的数据建模环节。你将基于虚构大学的流程负责人提出的需求创建逻辑数据模型。逻辑数据模型创建完成后，你可以将其转换为物理数据模型。物理数据模型创建完成，且你已完成表、列及其他物理数据对象的设计后，你将生成DDL脚本来部署物理数据模型，进而创建数据库。随后，你将创建映射模型，借此将你的数据模型与其他数据模型整合，搭建能够跟踪学生信息全维度的统一数据库系统。在本书第三部分，你将学习如何使用工作台生成报表。这些报表可供业务流程负责人使用，用于分析通过你的数据模型设计可获取的数据。最后，你将学习如何对现有数据库或架构进行反向工程，从而对现有数据对象进行进一步的迭代修改并部署变更。在最后一章中，你将学习如何分析数据模型，确保在将模型部署到生产环境前其符合有效性要求。\n\
    \n#### 2.4 小结\n你已了解数据建模的基本概述，以及如何使用IBM InfoSphere数据架构师草拟和部署数据模型。创建这些模型时，你会先从逻辑设计入手，之后再草拟物理设计。数据设计流程是迭代式的，IBM\
    \ InfoSphere数据架构师能够帮助你轻松继续使用现有的数据模型和数据源开展工作。反向工程功能可让你便捷地操作现有数据源，你可以持续优化现有资源以扩展功能、提升性能或响应变更的需求。\n\
    \n#### 2.5 接下来要学什么\n现在你已经掌握了数据建模的基础知识，应该开始着手草拟设计方案。通过本书，你将熟悉工作台的操作，以及如何从头到尾创建可部署、可优化的完整数据模型。\n\
    \n## 第二部分 – 数据建模\n### 第3章 – 逻辑数据建模\n![](img/38311ad87170342fd88ee1165fee68b0_48_0.png)\n\
    \n逻辑数据模型是数据设计生命周期的第一步。逻辑数据模型能够帮助你捕获业务需求，在设计物理存储和部署模型之前，你就可以开始设计架构和数据库的未来方案。本章涵盖以下概念：\n\
    - 如何设计逻辑数据模型\n- 创建图表以直观展示模型的设计方案\n- 为你的组织开发术语表模型和命名规范\n- 将这些术语表模型和命名规范应用到你的数据模型中\n\
    \n> **注意：**\n> 有关逻辑数据建模的更多信息，请查阅本系列丛书中的电子书[《数据库基础》]。\n\n#### 3.1 逻辑数据建模：整体概览\n\
    ![](img/38311ad87170342fd88ee1165fee68b0_49_0.png)\n\n**图3.1** – 将IBM InfoSphere数据架构师作为你的数据建模工具\n\
    \n创建逻辑数据模型是开发满足业务需求的数据库或架构的第一步。*逻辑数据模型*是不针对特定数据库厂商的模型。逻辑数据模型描述了组织想要收集数据的对象，并记录这些对象之间的关系。逻辑数据模型采用分层结构，包含包、实体、属性及其他关系对象。在创建逻辑数据模型之前，你必须收集模型的需求。业务用户对自身需求的描述可能不完整，通常业务用户或客户只会提供整体需求的部分片段。你可能会收到非常模糊的业务流程描述，例如“企业必须跟踪我们产品的销售情况”。作为数据建模师，你必须了解项目的所有需求，才能补全缺失的部分，构建完整的模型。收集完初始需求后，你要将结果呈现给客户，最好通过展示图表的方式，然后与客户协商相关及非核心方面，如*图3.1*所示。协商完成后，你（数据建模师）修改逻辑数据模型，并将修改后的模型呈现给客户。通过这一迭代流程，你草拟并开发出完整的逻辑数据模型。本章将介绍逻辑数据模型的开发流程。\n\
    \n#### 3.2 创建逻辑数据模型\n为项目创建逻辑数据模型时，你遇到的最棘手的问题之一就是商定需要建模的业务流程。你应该与客户协作，明确项目需要满足的业务需求。要创建业务流程的逻辑数据模型，你需要遵循以下流程：\n\
    - 分析企业的各类需求。从最重要的业务流程入手。记录分析结果，以便你和其他数据建模师能够了解项目的目标与未来规划。\n- 与项目负责人协作，明确他们需要识别的数据以及这些数据的重要性。你可以借此识别出在多个流程、数据源或各数据对象不同粒度下通用的初始数据对象。\n\
    - 与项目负责人会面，解决模糊的需求。\n- 制定满足需求的初步方案。创建概念模型，起草逻辑数据模型的初始设计。你将使用该方案来设计数据模型。\n\n#####\
    \ 3.2.1 使用工作台创建逻辑数据模型\n你与大学的业务流程负责人会面，他们请你帮忙创建一个用于收集学生信息的学生信息管理系统。经过进一步沟通，你们决定从小处着手，先创建一个用于跟踪学生基本信息（如学生学号、成绩、课程）的逻辑数据模型。为了学习如何使用工作台创建逻辑数据模型，你将创建一个名为**学生信息管理系统（STUDENT_INFO_SYSTEM）**的小型逻辑数据模型。\n\
    \n###### 3.2.1.1 创建新的数据设计项目以存储模型\n在创建逻辑数据模型之前，你需要创建一个*新建数据设计项目*来存储文件。使用该数据设计项目存储本项目中的所有数据模型。你可以在一个工作区中创建多个数据设计项目，每个数据设计项目都可以包含多个数据模型。创建新数据设计项目的步骤如下：\n\
    - 点击*文件 -> 新建 -> 数据设计项目*。“新建数据设计项目”窗口随即打开。\n> **注意：**\n> 由于你的工作区大概率是空的，你也可以点击*点击此处创建新建数据设计项目*链接。不过，在你创建第一个数据设计项目后，该链接将不再可用。\n\
    - 在*项目*字段中，为你的项目指定一个描述性名称。输入**大学信息系统**。\n- 点击*完成*。“大学信息系统”数据设计项目将在数据项目浏览器中创建。在该数据设计项目中，设有用于存储项目文件的文件夹。\n\
    \n###### 3.2.1.2 创建你的首个逻辑数据模型\n当前项目为空，因此你需要创建一个新的逻辑数据模型。你将使用该逻辑数据模型开始搭建学生信息管理系统。创建新的逻辑数据模型步骤如下：\n\
    - 打开“新建逻辑数据模型”窗口：\n  - 在数据项目浏览器视图中，展开*大学信息系统*数据设计项目。\n  - 右键单击*数据模型*文件夹，然后选择*新建*\
    \ -> *逻辑数据模型*。“新建逻辑数据模型”窗口随即打开。\n  - 填写“新建逻辑数据模型”窗口中的字段：\n    - 在*文件名*字段中输入以下内容：**学生信息管理系统（STUDENT_INFO_SYSTEM）**。\n\
    \    - 点击*完成*。逻辑数据模型创建完成，该数据模型将被打开，其中包含一个空白图表。你可以使用图表编辑器来创建逻辑数据模型的可视化呈现。*图3.2*展示了你的新数据设计项目以及新建的空白逻辑数据模型。\n"
