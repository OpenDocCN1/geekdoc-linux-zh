- img_proc: true
  md: "+   - All of the roles assigned to a user are enabled when that user establishes\
    \ a connection, so all privileges and authorities granted to roles are taken into\
    \ account when a user connects. Roles cannot be explicitly enabled or disabled.\n\
    - The security administrator can delegate management of a role to others.\n\n\
    All DB2 privileges and authorities that can be granted within a database can be\
    \ granted to a role. For example, a role can be granted any of the following authorities\
    \ and privileges:\n\n+   - DBADM, SECADM, LOAD, and IMPLICIT_SCHEMA database authorities\n\
    - CONNECT, CREATETAB, CREATE_NOT_FENCED, BINDADD, CREATE_EXTERNAL_ROUTINE, or\
    \ QUIESCE_CONNECT database authorities\n- Any database object privilege (including\
    \ CONTROL)\n\nA user's roles are automatically enabled and considered for authorization\
    \ when a user connects to a database; you do not need to activate a role by using\
    \ the SET ROLE statement. For example, when you create a view, a materialized\
    \ query table (MQT), a trigger, a package, or an SQL routine, the privileges that\
    \ you gain through roles apply.\n\nA role does not have an owner.\n\nAfter speaking\
    \ with your information system team, it is determined that you should create a\
    \ role for application developers, so that they can connect to your system. This\
    \ role that you create can be used to grant certain elevated privileges to the\
