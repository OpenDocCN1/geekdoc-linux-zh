    ### 1.7 Launching IBM InfoSphere Data Architect

    Launch IBM InfoSphere Data Architect via one of the following methods:

    - Windows: Click `Start` -> `All Programs` -> `IBM InfoSphere` -> `IBM InfoSphere
    Data Architect 7.5.3.0.`

    - Linux or UNIX: In a terminal window, type the following command: `.product_install_directory/eclipse`
    where *product_install_directory* is the directory in which you installed the
    product.


    When you open the product, you can specify what workspace you want to use. Specify
    **IDA_GettingStarted** as the name of your workspace, as shown in *Figure 1.7*.

    ![](img/38311ad87170342fd88ee1165fee68b0_32_0.png)

    **Figure 1.7 – Selecting a workspace**

    > **Note:**

    > A workspace is a location to save your work, customizations, and preferences.
    Your work and other changes in one workspace are not visible if you open a different
    workspace. The workspace concept comes from Eclipse.


    IBM InfoSphere Data Architect opens for the first time in the Data perspective,
    which includes the Task Launcher.

    > **Note:**

    > A perspective is an Eclipse concept. A perspective contains views and actions
    that are associated with particular tasks. A view shows you your resources, which
    are associated with editors. The default perspective for IBM InfoSphere Data Architect
    is the Data perspective, as shown in Figure 1.8. You can see the names of the
    various views there, including the Data Project Explorer and Outline.

    ![](img/38311ad87170342fd88ee1165fee68b0_33_0.png)

    **Figure 1.8 – The default Data perspective in IBM InfoSphere Data Architect**


    #### 1.7.1 Touring the workbench

    The term *workbench* refers to the desktop development environment, and is an
    Eclipse concept. The workbench aims to achieve seamless tool integration and controlled
    openness by providing a common paradigm for the creation, management, and navigation
    of workspace resources.


    ##### 1.7.1.1 The Task Launcher

    When you open an InfoSphere Data Architect workspace for the first time, you see
    a pane in the main editor view called the Task Launcher. The Task Launcher is
    a view designed to help you get started with basic tasks within the workbench.
    For example, the Task Launcher within IBM InfoSphere Data Architect can help you
    create a physical data model for the first time. Use the tabs at the top of the
    Task Launcher to get started with these tasks. IBM InfoSphere Data Architect has
    three tabs in the Task Launcher view:

    - **Overview:** This tab contains links to general information about the product,
    as well as general “getting started” tasks, such as connecting to a database.

    - **Design:** This tab contains common tasks that help you create data models
    and design your data. You can also learn more about other common tasks, or follow
    the links to tutorials on developerWorks.

    - **Develop:** This tab contains common tasks that help you develop SQL or XQuery
    statements and stored procedures, and you can learn how to debug these statements.


    The Task Launcher is shown in Figure 1.9.

    ![](img/38311ad87170342fd88ee1165fee68b0_34_0.png)

    > **Figure 1.9 – Getting to know the Task Launcher**


    When you open a task in the Task Launcher, the perspective that is associated
    with that task automatically opens. A help panel also opens. Follow the instructions
    in the help pane to complete the task. Let''s explore the Task Launcher by connecting
    to the SAMPLE database connection that is included when you installed DB2. Open
    the *Overview* tab of the Task Launcher to complete this task.

    1. In the *Tasks* box, click the *Connect and browse a database* link. If the
    Data perspective is not open, the perspective opens, and the Help view opens to
    guide you through the task. The changes to the workbench are shown in *Figure
    1.10*.

    ![](img/38311ad87170342fd88ee1165fee68b0_35_0.png)

    > **Figure 1.10 – Completing a task with the Task Launcher**

    2. Follow the instructions in the Help panel of the Task Launcher to complete
    the task and connect to the SAMPLE database that you set up when you installed
    DB2 Express-C. Once you have completed the task, the connection appears in the
    Data Source Explorer view.


    The Task Launcher is included with all Eclipse-based products in the Data Security,
    Privacy, and Lifecycle Management suite of products. If you shell-share with other
    Eclipse-based products, the tabs and tasks associated with those tabs will change,
    since you have more capabilities associated with your product environment. Shell-sharing
    is discussed in detail in Chapter 10, as well as the larger Data Security, Privacy,
    and Lifecycle Management portfolio of products.

    **Note:** If you do not want to see the Task Launcher when you open the workspace,
    simply close the view. If you want to open the Task Launcher in the future, simply
    open it from the main menu: Help -> Open Task Launcher.


    ##### 1.7.1.2 Perspectives

    Each workbench window contains one or more perspectives. *Perspectives* contain
    views and editors and control what appears in certain menus and toolbars based
    on a certain task or role. So you will see different views and tasks from the
    Debug perspective (for Java debugging) than you will for the Data perspective.
    Let''s look at the Java perspective for fun. One way to open a different perspective
    is to click the icon shown below in *Figure 1.11* and select *Java*. An alternate
    way to open a perspective is to click on *Window* -> *Open Perspective*.

    ![](img/38311ad87170342fd88ee1165fee68b0_36_0.png)

    *Figure 1.11* – Opening a different perspective


    As you can see by comparing *Figure 1.8* and *Figure 1.12* (below), the Java perspective
    has a different task focus (Java development) than the Data perspective. The outline
    in this case, for example, would work with Java source code in the editor. The
    explorer shows Java packages, as opposed to database objects.

    ![](img/38311ad87170342fd88ee1165fee68b0_37_0.png)

    **Figure 1.12 – The Java perspective**


    Click on the Data perspective to switch back again so that you can learn more
    about the capabilities of the Data perspective.

    > **Note:**

    > For more information about perspectives and views, see the ebook *Getting Started
    with Eclipse*.


    #### 1.7.2 Touring the Data Perspective and its views

    Because most of the work you''ll do in this book is in the Data perspective, make
    sure the Data perspective is open. As we described earlier, *views* are the windows
    that you see in the workbench, such as Data Source Explorer and Properties. A
    view is typically used to navigate a hierarchy of information, open an editor,
    or display properties for the active editor. The changes that you make to the
    views (their sizes and positions), and the resources that you create in the views
    are saved in your workspace, as we mentioned previously. The views shown in the
    Data perspective are described in *Table 1.4* below.


    | View | Description |

    | --- | --- |

    | Data Project Explorer | This view is used by a data architect or a data or information
    modeler when creating models. It shows data design projects (which you will use
    to store logical and physical data models) and data development projects. |

    | Data Source Explorer | This view allows you to connect to and view databases
    and the objects that are within them. It automatically displays detected databases,
    but you can add new database connections. You can reverse-engineer from this view
    by dragging and dropping data objects from the Data Source Explorer into the Data
    Project Explorer. |

    | Properties | This view shows the properties of the object that is currently
    selected in the workspace. For some objects, you can use this view to edit properties,
    such as making changes to the database objects that are selected in the Data Source
    Explorer. When an object is highlighted in either a diagram or the Data Project
    Explorer, the Properties view changes to show the properties of that object. |

    | SQL Results | This view shows the results after you run SQL or XQuery statements.
    You can also use this view to obtain sample data from a selected table within
    a database. |

    | Outline | This view shows an outline of a structured file that is currently
    open in the editor area and lists its structural elements. For example, if you
    were editing a data diagram, you would see the overall diagram in the Outline
    view, and when you zoom in or out in the diagram, a shaded box displays to show
    you where you are in the context of the larger diagram. |


    #### 1.7.3 Manipulating views

    The basic view controls are shown in *Figure 1.13*.

