    # ## 1.9 Summary


    IBM InfoSphere Data Architect provides tooling support to help you create data
    models that discover, visualize, relate, and standardize your data. You can create
    logical, physical, dimensional, and domain models for DB2, *Informix*, *Oracle*,
    *Sybase*, *Microsoft SQL Server*, *MySQL*, and *Teradata* source systems. It allows
    for an iterative design process, which lets you update and refine your data models
    as the needs of the business change, with minimal impact to your production environment.


    There is an active discussion forum for IBM InfoSphere Data Architect at the following
    URL: [http://www.ibm.com/developerworks/forums/forum.jspa?forumID=1796](http://www.ibm.com/developerworks/forums/forum.jspa?forumID=1796)


    This forum can provide informal support.


    This chapter also covered how to install the product and navigate the Eclipse
    workbench. You learned how to open different perspectives and manipulate the views
    in a perspective.


