  md: '# ## About the Authors


    **Erin Wilson** is an information developer working at IBM''s Silicon Valley Laboratory.
    As information development lead for InfoSphere Data Architect, she works to document
    the information needed most by data architects. She has worked with several Eclipse-based
    products in the InfoSphere Optim™ Data Lifecycle portfolio, specializing in data
    modeling and warehousing, and she is particularly knowledgeable about DB2-based
    environments. In addition to product documentation, she has contributed to and
    narrated for product demos in the data lifecycle portfolio. Before joining IBM,
    Erin graduated from Purdue University with a degree in Professional Writing. A
    lifelong lover of computers and technology, she spends her spare time learning
    more about programming and web development.


    **Sagar Vibhute** began his career in 2008 with IBM. Presently he is a part of
    the JCC development team with the India Software Lab (ISL) in Bangalore. He has
    previously worked as a part of the Continuing Engineering team for InfoSphere
    Data Architect. He holds a Masters Degree in Information Technology from IIIT-Bangalore.
    In his spare time he likes to play the guitar or cycle through the countryside.


    **Chetan Bhatia** has been working with IBM since 2008. He is currently working
    as a developer for InfoSphere Data Architect. He has a Masters in Computer Applications
    and has around 11+ years of experience in the software development field. He has
    worked on Web development platforms and is currently working with Eclipse Framework-based
    product development. He enjoys learning new technologies and new gadgets. He also
    enjoys swimming and reading.


    **Rahul Jain** started his professional career with IBM in June 2008. He is a
    software developer and currently working as a part of the InfoSphere Data Architect
    development team in ISL Bangalore. Prior to that, he was working with the Continuing
    Engineering team for InfoSphere Data Architect in ISL Bangalore. He completed
    his Master Degree in Information Technology from IIIT-Bangalore and Bachelor Degree
    in Chemical Engineering. His favorite pastime is listening to music and driving
    his car on the highways.


    **Liviu Perniu** is an Associate Professor in the Automation Department at Transilvania
    University of Brasov, Romania, teaching courses in the area of Data Requirements,
    Analysis, and Modeling. He is an IBM 2006 Faculty Award recipient as part of the
    Eclipse Innovation Awards program, and also one of the authors of *Database Fundamentals*
    book which is also part of the DB2 on campus book series.


    **Shilpa Shree R.** is a BE graduate in the branch of Electronics and Communications.
    She has 6 years of IT experience in Java and J2EE. She is currently working as
    a System Analyst at iGate Global Solution Ltd.


    **Pauljayam Sp Robertsamuel** has been with IBM for more than two years. He has
    a degree in Physiotherapy [Rehabilitation Medicine]. However, he changed interests
    and now is currently positioned as a Level 3 product support engineer for InfoSphere
    Data Architect.'
