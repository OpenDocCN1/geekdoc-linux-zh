    limitations on the data placed within the structure.


    # 2.3 Creating the student information management system


    You will use this book and the workbench to create a sample student information
    management system for a university. The student information management system
    will store information about students, such as student ID number, grades, and
    address.


    You will follow the data design life cycle to design and then implement this student
    management information system. You will create a logical data model, which is
    then used to create a physical data model. After the physical data model is created,
    you can make further updates to the system or deploy it.'
