  md: '# 78 Getting started with InfoSphere Data Architect


    A domain model consists of a group of domain data types. A domain data type represents
    a base data type that can be restricted by adding constraints. You can use the
    domain model to define the domain data types for attributes or columns within
    logical or physical data models.


    Domain data types are based on base data types. For example, you can define domain
    data types for common descriptors, such as gender or grade. IBM InfoSphere Data
    Architect can be used to create domain models and atomic domains. These models
    can be shared among all team members who are working on modeling tasks. IBM InfoSphere
    Data Architect provides the tooling that helps you create and manage domain models.
    You can create a domain model from a wizard, either from an existing template
    or from scratch. Use the Data Project Explorer to add domain objects, then use
    the Properties view to modify them .


    The following list details some best practices for domains:


    +   - Group all domains into one or more domain models, so that these domains
    can be reused in future projects.

    - Create a separate enterprise standard project that contains any glossary or
    domain model that is universally shared throughout the organization.

    - Create a domain model within a specific project for legacy models that might
    have domains that were created before any enterprise domains if they do not conform
    to the newer enterprise standard.

    - Give the domain model a meaningful name. You might want to include "domain"
    as part of the model name to easily identify the domain model in the Data Project
    Explorer view.

    - Create subpackages (separate domain packages under the root domain package)
    to provide a logical grouping of domains within a specific business subject area.


