- md: "1. （题干及A选项缺失）\n- **B.** PDF\n- **C.** Plain text\n- **D.** Microsoft Excel\n\
    2. Which of the following data models you can import or export in the workbench?\n\
    - **A.** Physical data model\n- **B.** Glossary model\n- **C.** Mapping model\n\
    - **D.** All of the above\n3. Which of the following validity check is not supported\
    \ when you export data models?\n- **A.** Basic validity check\n- **B.** Normal\
    \ validity check\n- **C.** No validity check\n- **D.** Both A and C\n4. What is\
    \ the file extension for a BIRT report template?\n- **A.** .xsl\n- **B.** .xsldesign\n\
    - **C.** .rptdesign\n- **D.** None of the above\n5. Which report output format\
    \ is supported by XSLT reports?\n- **A.** PDF\n- **B.** Microsoft Excel\n- **C.**\
    \ Plain text\n- **D.** HTML\n\n## Chapter 7 – Reverse-Engineering\nOften, companies\
    \ have large schemas with multiple tables that are deployed to a database before\
    \ you start your work as a data architect. If you need to make changes to these\
    \ schemas, it takes a large amount of time and effort to manage these changes\
    \ without affecting existing constraints or losing data. However, you can create\
    \ a physical data model from the existing set of database objects. After you reverse-engineer\
    \ an existing database, making changes and deploying the set of changes in the\
    \ model back to the database becomes an easy process. This is what we will be\
    \ exploring in this chapter.\n\nIn this chapter you will learn about:\n- Reverse-engineering\
    \ from an existing database in the workbench\n- Comparing and merging changes\
    \ to your data models\n- Generating the DDL to deploy your changes\n\n## 7.1 Reverse-engineering:\
    \ The big picture\nWe have seen how objects in the physical data model can be\
    \ converted into objects in a database when you generate a DDL script that deploys\
    \ them. *Reverse-engineering* is the opposite of this process: We convert an object\
    \ in the database into an object in the physical data model. *Figure 7.1* illustrates\
    \ the big picture of reverse-engineering.\n\n![](img/38311ad87170342fd88ee1165fee68b0_129_0.png)\n\
    \nThe left side of *Figure 7.1* illustrates that the process of reverse-engineering\
    \ can be carried out from either a database or a DDL script. The reverse-engineering\
    \ process creates a physical data model (.dbm) file in the Data Project Explorer\
    \ of the workbench. This physical data model captures the information about the\
    \ data objects in the database. Once you reverse-engineer to a physical data model,\
    \ you can modify the data model, transform to a logical data model, or work with\
    \ it as you would any other data model. Once you make changes to the physical\
    \ data model, you should deploy the changes to the database. Use the compare function\
    \ in the workbench to match the physical data model against the database and show\
    \ the differences between the model in development and the model in production.\
    \ Then, you can analyze the impact that your changes will have to an existing\
    \ data model. Finally, use the workbench to merge the changes and generate a delta\
    \ DDL file that can deploy the changes to the database. When you run this script\
    \ on a database, you make the necessary modifications to the database object without\
    \ losing any existing data.\n\n> **Note:** Although you can reverse-engineer from\
    \ a DDL script or an existing database, you have more options when you reverse-engineer\
    \ from a database. Since the database stores a lot of metadata in catalog tables,\
    \ IBM InfoSphere Data Architect can make good use of that metadata to better populate\
    \ the physical data model.\n\n## 7.2 Reverse-engineering with the workbench\n\
    When you reverse-engineer a database, the workbench reads the details of the objects\
    \ in the database and converts them to their equivalent representation in the\
    \ physical data model. This simply means that if you reverse-engineer a schema\
    \ that contains one table and one index, then the reverse-engineered physical\
    \ data model will contain one schema with one table and one index. To understand\
    \ what happens when you reverse-engineer from a DDL script, consider the following\
    \ example: A DDL script creates a schema that contains a table and an index in\
    \ the database. When you reverse-engineer from the DDL script, the workbench creates\
    \ an equivalent representation of the schema, the table, and the index in the\
    \ physical data model. We will see the process in more detail in the next section.\n\
    \n### 7.2.1 Reverse-engineering from DDL\n#### 7.2.1.1 Creating a sample DDL script\n\
    First, let's create a sample DDL script from which to reverse-engineer. This DDL\
    \ script creates the following database objects in the SAMPLE database connection:\n\
    - A database, named *SAMPLEUNIV*\n- A schema, named *UNIVERSITY*, that belongs\
    \ to the *SAMPLEUNIV* database\n- Two tables in the schema, named *DEPARTMENT*\
    \ and *STUDENT*\n\nTo create the sample DDL script:\n1. Right-click on the *SQL\
    \ Scripts* folder of your data design project, then select *New* -> *SQL or XQuery\
    \ Script*. The New SQL or XQuery Script window opens.\n2. Complete the New SQL\
    \ or XQuery Script window:\n   a. Specify the *University Info System* project.\n\
    \   b. In the *Name* field, type **SAMPLE_DDL.sql**.\n   c. Make sure that the\
    \ following radio button is selected: *SQL and XQuery Editor* (for scripts that\
    \ contain one or more SQL and XQuery statements)\n   d. Click *Finish*.\n3. Select\
    \ the SAMPLE database connection profile. Since you aren't deploying the script,\
    \ you do not need to worry about a connection at this point. The Select Connection\
    \ Profile window opens. A blank SQL file is created and opens in the SQL Editor\
    \ view.\n4. Enter the following SQL statements to create the SAMPLEUNIV database\
    \ with a UNIVERSITY schema and DEPARTMENT and STUDENT tables:\n```sql\nCREATE\
    \ DATABASE SAMPLEUNIV;\nCREATE SCHEMA \"SAMPLEUNIV\".\"UNIVERSITY\";\nCREATE TABLE\
    \ \"UNIVERSITY\".\"STUDENT\" (\n    STUDENT_ID CHAR(10) NOT NULL,\n    STUDENT_FIRSTNAME\
    \ CHAR(20) NOT NULL,\n    STUDENT_LASTNAME CHAR(20) NOT NULL,\n    STUDENT_ADDRESS\
    \ CHAR(100) NOT NULL,\n    STUDENT_PHONE CHAR(10) NOT NULL,\n    DEPARTMENT_ID\
    \ INTEGER NOT NULL\n);\nCREATE TABLE \"UNIVERSITY\".\"DEPARTMENT\" (\n    DEPARTMENT_ID\
    \ INTEGER NOT NULL,\n    DEPARTMENT_NAME CHAR(20) NOT NULL,\n    DEPARTMENT_ESTDATE\
    \ DATE\n);\nALTER TABLE \"UNIVERSITY\".\"STUDENT\" ADD CONSTRAINT \"STUDENT_PK\"\
    \ PRIMARY KEY(STUDENT_ID);\nALTER TABLE \"UNIVERSITY\".\"DEPARTMENT\" ADD CONSTRAINT\
    \ \"DEPARTMENT_PK\" PRIMARY KEY(DEPARTMENT_ID);\nALTER TABLE \"UNIVERSITY\".\"\
    STUDENT\" ADD CONSTRAINT \"STUDENT_DEPARTMENT_fk\" FOREIGN KEY(DEPARTMENT_ID)\
    \ REFERENCES \"UNIVERSITY\".\"DEPARTMENT\" (DEPARTMENT_ID);\n```\n5. Save your\
    \ work. The SQL script is created and saved in your *SQL Scripts* folder.\n\n\
    > **Note:** You do not have to run this file to reverse-engineer from it. You\
    \ will reverse-engineer from this script in the next section.\n\n#### 7.2.1.2\
    \ Reverse-engineering from the DDL script\nLet's use this new DDL file to reverse-engineer\
    \ to a physical data model. To reverse-engineer the DDL script:\n1. Create a new\
    \ physical data model by clicking *File -> New -> Physical Data Model*. The New\
    \ Physical Data Model wizard opens.\n2. Complete the Model File page of the wizard:\n\
    \   a. Specify the *University Info System* data design project as the destination\
    \ folder.\n   b. In the *File name* field, specify **NEW_SDT_DDL**.\n   c. Specify\
    \ *DB2 for Linux, UNIX, and Windows* as the database type.\n   d. Specify 9.7\
    \ as the database version.\n   e. Select the *Create from reverse engineering*\
    \ radio button.\n   f. Click *Next*.\n3. On the Source page, select the *DDL script*\
    \ option, then click *Next*.\n4. On the Script File page, click *Browse*, then\
    \ select the SAMPLE_DDL.sql file. Click *Next*.\n5. On the Options page, click\
    \ *Next*.\n6. On the Reverse Engineering Status page, verify that the script file\
    \ was successfully reverse-engineered, then click *Finish* to create the physical\
    \ data model. The **NEW_SDT_DDL.dbm** physical data model is created in the Data\
    \ Project Explorer, as shown in *Figure 7.2*.\n\n![](img/38311ad87170342fd88ee1165fee68b0_132_0.png)\n\
    \n#### **Figure 7.2** – New physical data model, created from a DDL file\nIf you\
    \ explore the physical data model, you see the schema and tables that were specified\
    \ in the DDL script.\n\n### 7.2.2 Reverse-engineering from a database\nThe process\
    \ of reverse-engineering from a database is pretty similar to that of reverse-engineering\
    \ from a DDL script, except that you can choose what objects to **reverse-engineer**\
    \ from the database. For example, a database might contain multiple schemas, and\
    \ you want to keep your schema models separate from one another. Simply select\
    \ the schema or schemas that you want to **reverse-engineer**, and modify them\
    \ before you deploy the changes. Although you already have an existing copy of\
    \ the STUDENT_LIFE schema, contained in the STUDENT_INFO_SYSTEM.dbm physical data\
    \ model file, let's use the schema deployed on the database to **reverse-engineer**\
    \ and make changes, so that we can later compare and deploy those changes to the\
    \ SAMPLE database.\n\nTo reverse-engineer from a database:\n1. From the main menu,\
    \ click *File -> New -> Physical Data Model*. The New Physical Data Model wizard\
    \ opens.\n2. Complete the Model File page:\n   a. Specify the *University Info\
    \ System* data design project as the destination folder.\n   b. In the *File name*\
    \ field, specify **NEW_SDT_INFO_SYS**.\n   c. Specify *DB2 for Linux, UNIX, and\
    \ Windows* as the database type.\n   d. Specify *V9.7* as the database version."
  mdcn: "\n1. （题干及A选项缺失）\n- **B.** PDF\n- **C.** 纯文本\n- **D.** Microsoft Excel\n2.\
    \ 以下哪些数据模型可以在工作台中导入或导出？\n- **A.** 物理数据模型\n- **B.** 术语模型\n- **C.** 映射模型\n- **D.**\
    \ 以上所有\n3. 以下哪种有效性检查在导出数据模型时不受支持？\n- **A.** 基本有效性检查\n- **B.** 常规有效性检查\n- **C.**\
    \ 无有效性检查\n- **D.** A和C均正确\n4. BIRT报告模板的文件扩展名是什么？\n- **A.** .xsl\n- **B.** .xsldesign\n\
    - **C.** .rptdesign\n- **D.** 以上都不是\n5. XSLT报告支持哪种报表输出格式？\n- **A.** PDF\n- **B.**\
    \ Microsoft Excel\n- **C.** 纯文本\n- **D.** HTML\n\n## 第7章 – 反向工程\n通常，在你开始担任数据架构师的工作之前，企业已经有包含多张表的大型架构部署到数据库中。如果你需要对这些架构进行修改，在不影响现有约束或不丢失数据的情况下管理这些变更会耗费大量时间和精力。不过，你可以基于现有的数据库对象集创建物理数据模型。对现有数据库进行反向工程后，修改模型并将变更集部署回数据库就会成为一个简单的流程。这正是我们本章将要探讨的内容。\n\
    本章你将学习以下内容：\n- 在工作台中从现有数据库进行反向工程\n- 比较和合并数据模型的变更\n- 生成DDL以部署你的变更\n\n## 7.1 反向工程：整体概览\n\
    我们已经了解到，当你生成用于部署的DDL脚本时，物理数据模型中的对象可以转换为数据库中的对象。*反向工程*是这一过程的逆过程：我们将数据库中的对象转换为物理数据模型中的对象。*图7.1*说明了反向工程的整体概览。\n\
    ![](img/38311ad87170342fd88ee1165fee68b0_129_0.png)\n*图7.1*的左侧说明，反向工程过程可以基于数据库或DDL脚本开展。反向工程过程会在工作台的“数据项目浏览器”中创建物理数据模型（.dbm）文件。该物理数据模型会捕获数据库中数据对象的相关信息。一旦你通过反向工程得到物理数据模型，就可以修改该数据模型、将其转换为逻辑数据模型，或者像操作其他任意数据模型一样使用它。对物理数据模型完成修改后，你需要将变更部署到数据库中。使用工作台中的比较功能，匹配物理数据模型与数据库，展示开发中模型与生产环境模型之间的差异。随后，你可以分析自己的变更对现有数据模型产生的影响。最后，使用工作台合并变更，生成可部署到数据库的增量DDL文件。当你在数据库上运行该脚本时，可以在不丢失任何现有数据的前提下，对数据库对象进行必要的修改。\n\
    > **注意：** 尽管你可以从DDL脚本或现有数据库进行反向工程，但从数据库进行反向工程时可供选择的选项更多。由于数据库在系统目录表中存储了大量元数据，IBM\
    \ InfoSphere Data Architect可以充分利用这些元数据，更好地填充物理数据模型。\n\n## 7.2 使用工作台进行反向工程\n当你对数据库进行反向工程时，工作台会读取数据库中对象的详细信息，并将其转换为物理数据模型中对应的等效表示形式。这可以简单理解为：如果你对包含1张表和1个索引的架构进行反向工程，那么最终得到的物理数据模型将包含1个带1张表和1个索引的架构。为了解从DDL脚本进行反向工程时会发生什么，请参考以下示例：一段DDL脚本会在数据库中创建包含1张表和1个索引的架构。当你从该DDL脚本进行反向工程时，工作台会在物理数据模型中创建架构、表和索引的等效表示形式。我们将在下一节详细讲解这一流程。\n\
    \n### 7.2.1 从DDL进行反向工程\n#### 7.2.1.1 创建示例DDL脚本\n首先，我们先创建一个用于反向工程的示例DDL脚本。该DDL脚本会在SAMPLE数据库连接中创建以下数据库对象：\n\
    - 1个名为*SAMPLEUNIV*的数据库\n- 1个属于*SAMPLEUNIV*数据库、名为*UNIVERSITY*的架构\n- 该架构中的2张表，分别名为*DEPARTMENT*和*STUDENT*\n\
    \n创建示例DDL脚本的步骤如下：\n1. 右键点击数据设计项目中的*SQL脚本*文件夹，然后选择*新建* -> *SQL或XQuery脚本*。“新建SQL或XQuery脚本”窗口将打开。\n\
    2. 填写“新建SQL或XQuery脚本”窗口：\n    a. 指定*University Info System*项目。\n    b. 在*名称*字段中输入**SAMPLE_DDL.sql**。\n\
    \    c. 确保选中以下单选按钮：*SQL和XQuery编辑器*（适用于包含1个或多个SQL和XQuery语句的脚本）\n    d. 点击*完成*。\n\
    3. 选择SAMPLE数据库连接配置文件。由于你当前不需要部署该脚本，因此无需关注连接问题。“选择连接配置文件”窗口将打开。系统将创建一个空SQL文件，并在SQL编辑器视图中打开。\n\
    4. 输入以下SQL语句，创建包含UNIVERSITY架构以及DEPARTMENT和STUDENT表的SAMPLEUNIV数据库：\n```sql\nCREATE\
    \ DATABASE SAMPLEUNIV;\nCREATE SCHEMA \"SAMPLEUNIV\".\"UNIVERSITY\";\nCREATE TABLE\
    \ \"UNIVERSITY\".\"STUDENT\" (\n  STUDENT_ID CHAR(10) NOT NULL,\n  STUDENT_FIRSTNAME\
    \ CHAR(20) NOT NULL,\n  STUDENT_LASTNAME CHAR(20) NOT NULL,\n  STUDENT_ADDRESS\
    \ CHAR(100) NOT NULL,\n  STUDENT_PHONE CHAR(10) NOT NULL,\n  DEPARTMENT_ID INTEGER\
    \ NOT NULL\n);\nCREATE TABLE \"UNIVERSITY\".\"DEPARTMENT\" (\n  DEPARTMENT_ID\
    \ INTEGER NOT NULL,\n  DEPARTMENT_NAME CHAR(20) NOT NULL,\n  DEPARTMENT_ESTDATE\
    \ DATE\n);\nALTER TABLE \"UNIVERSITY\".\"STUDENT\" ADD CONSTRAINT \"STUDENT_PK\"\
    \ PRIMARY KEY(STUDENT_ID);\nALTER TABLE \"UNIVERSITY\".\"DEPARTMENT\" ADD CONSTRAINT\
    \ \"DEPARTMENT_PK\" PRIMARY KEY(DEPARTMENT_ID);\nALTER TABLE \"UNIVERSITY\".\"\
    STUDENT\" ADD CONSTRAINT \"STUDENT_DEPARTMENT_fk\" FOREIGN KEY(DEPARTMENT_ID)\
    \ REFERENCES \"UNIVERSITY\".\"DEPARTMENT\" (DEPARTMENT_ID);\n```\n5. 保存你的工作。SQL脚本已创建并保存在你的*SQL脚本*文件夹中。\n\
    > **注意：** 你无需运行此文件即可基于它进行反向工程。你将在下一节基于该脚本进行反向工程。\n\n#### 7.2.1.2 从DDL脚本进行反向工程\n\
    让我们使用这个新的DDL文件反向工程得到物理数据模型。要从DDL脚本进行反向工程，请按以下步骤操作：\n1. 点击*文件 -> 新建 -> 物理数据模型*，创建新的物理数据模型。“新建物理数据模型”向导将打开。\n\
    2. 填写向导的“模型文件”页面：\n    a. 将*University Info System*数据设计项目指定为目标文件夹。\n    b. 在*文件名*字段中指定**NEW_SDT_DDL**。\n\
    \    c. 将*DB2 for Linux, UNIX, and Windows*指定为数据库类型。\n    d. 将9.7指定为数据库版本。\n \
    \   e. 选中*从反向工程创建*单选按钮。\n    f. 点击*下一步*。\n3. 在“源”页面，选择*DDL脚本*选项，然后点击*下一步*。\n4.\
    \ 在“脚本文件”页面，点击*浏览*，然后选择SAMPLE_DDL.sql文件。点击*下一步*。\n5. 在“选项”页面，点击*下一步*。\n6. 在“反向工程状态”页面，验证脚本文件已成功完成反向工程，然后点击*完成*以创建物理数据模型。\n\
    **NEW_SDT_DDL.dbm**物理数据模型将在数据项目浏览器中创建，如*图7.2*所示。\n![](img/38311ad87170342fd88ee1165fee68b0_132_0.png)\n\
    #### **图7.2** – 从DDL文件创建的新的物理数据模型\n如果你浏览该物理数据模型，就会看到DDL脚本中指定的架构和表。\n\n### 7.2.2\
    \ 从数据库进行反向工程\n从数据库进行反向工程的流程与从DDL脚本进行反向工程的流程非常相似，区别在于你可以选择要从数据库中**反向工程**的对象。例如，数据库可能包含多个架构，你希望各个架构模型相互独立。只需选择你要**反向工程**的一个或多个架构，在部署变更前对其进行修改。尽管你已经拥有STUDENT_LIFE架构的现有副本，该副本包含在STUDENT_INFO_SYSTEM.dbm物理数据模型文件中，但我们还是使用部署在数据库上的架构进行**反向工程**并做出修改，以便后续可以将这些变更与SAMPLE数据库进行比较和部署。\n\
    要从数据库进行反向工程，请按以下步骤操作：\n1. 从主菜单点击*文件 -> 新建 -> 物理数据模型*。“新建物理数据模型”向导将打开。\n2. 填写“模型文件”页面：\n\
    \    a. 将*University Info System*数据设计项目指定为目标文件夹。\n    b. 在*文件名*字段中指定**NEW_SDT_INFO_SYS**。\n\
    \    c. 将*DB2 for Linux, UNIX, and Windows*指定为数据库类型。\n    d. 将*V9.7*指定为数据库版本。\n"
