    A *glossary model* is a model that describes the names and abbreviations that
    an organization allows for data objects. Data object naming standards promote
    a common understanding of data, since you use the same name conventions across
    the entire organization. You can use glossary models to enable sharing of data
    across organizational boundaries and reduce data redundancy through the consolidation
    of synonymous and overlapping data elements.


    When you name a data object, you need to take into account two items: semantic
    rules and format. Semantically, glossary model objects include prime words, class
    words, and modifiers:'
  - '[PAGE 65]


    +   - *Prime word*: A word that represents the business concept about which data
    is being collected. Prime words are nouns that describe the subject area of the
    data. For example: LOAN, EMPLOYEE

    - *Class word*: A word that identifies a distinct category or classification of
    data. For example: RATE, NAME

    - *Modifier*: A word that further qualifies or distinguishes the prime and class
    words. It helps make the object name clear and unique, and it can help restrict
    the meaning of the class and prime words. For example: NEXT, FIRST


    You can use IBM InfoSphere Data Architect to help you define these semantic rules
    or *naming standards*. You will learn more about how to specify some of these
    options for future data modeling projects in *Section 3.4, Working with naming
    standards*.


