  md: '# 3.2.2.2 The Data section of the palette


    The Data area of the palette contains data model objects. When you add or modify
    data model objects by using the palette or the diagram surface, you modify the
    underlying data model.


    # 3.2.2.3 Renaming data objects from the Properties view


    By default, Diagram1 is the name of this diagram, but you should change it to
    something that you can easily remember or differentiate from other data models
    in the project. To rename the diagram and the top-level package, perform the following
    steps:


    +   1. Open the Diagram1 diagram in the diagram editor. When you open or select
    any object, the properties of that object are displayed in the Properties view.
    In this case, you will edit the diagram properties of the Diagram1 diagram.

    2. Open the General tab of the Properties view, and change the text in the Diagram
    name field to **STUDENT_INFO**.

    3. Select the Package1 package in the Data Project Explorer. The package is located
    under the **STUDENT_INFO_SYSTEM.ldm** data model file.

    4. Open the General tab, and change the text in the Name field to **STUDENT INFO
    SYSTEM**.


    The data object is automatically renamed. When you click a blank area in the diagram,
    the name of the diagram editor changes to STUDENT_INFO, and the logical data model
    is updated in the Data Project Explorer view. An asterisk (*) appears next to
    any data object in the Data Project Explorer or the data object editor that has
    been modified. The asterisk will disappear when you save the file or project.


    > **Note:**


    You can modify the display characteristics of the diagram with the Properties
    view. For example, you can change the following options:


    - Use the Format tab to change the foreground or background colors of entities
    or foreign keys, or change the line color of an implicit foreign key relationship.

    - Use the Documentation tab to document the purpose of the diagram.

    - Use the Appearance tab to format the fonts and text color.


    All of these options change the diagram properties, but do not modify the underlying
    data model. You can also save image files of diagrams for archival or presentation
    purposes.


    # 3.2.2.4 Adding notes and text boxes to the diagram


    Add notes or text boxes to the diagram to help you document information about
    the data model. Notes and text boxes are also useful to call out information or
    fully explain what complex diagrams are intended to address.'
