    \ Specify a name for the root package of the glossary model:\n   a. Select the\
    \ NamingStandard data object under the STUDENT_GLOSSARY glossary model, as shown\
    \ in *Figure 3.14*. The **STUDENT_GLOSSARY.ndm** glossary model is opened, and\
    \ you can find it in the *Data Models* folder of the data design project.\n\n\
    ![](img/38311ad87170342fd88ee1165fee68b0_68_0.png)\n\n**Figure 3.14 – Selecting\
    \ the NamingStandard package**\n\n   b. In the *General* tab of the Properties\
