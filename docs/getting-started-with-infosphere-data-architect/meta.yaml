    \n![](img/38311ad87170342fd88ee1165fee68b0_112_0.png)\n\n**Figure 6.4** – Specifying\
    \ text properties for a label\n\n+   2. Add a BIRT report table to the report:\n\
    \t  a. From the Palette view, drag a *Table* element into the *Layout* window\
    \ after the report title. The Insert Table window opens.\n\t  b. Set the number\
    \ of columns to 2.\n\t  c. Specify *Column* from the list of data set options.\
    \ A two-column table is inserted into the report. The table contains a header\
    \ row, a detail row, and a footer row. The Column data set is associated with\
    \ the report table.\n\n> **Note**:\n\nThe Column data set is a predefined data\
    \ set in the report design. In the Data Explorer view, you can see the data sets\
    \ that are defined for the report design.\n\n+   3. Specify a name for the report\
    \ table, and update the format of the table:\n\t  a. Open the Outline view, found\
    \ in the bottom half of the left pane by default.\n\t  b. Click *SDT_Info_Sys_custom.rptdesign*\
    \ -> *Body* -> *Table*."
- md: "![](img/38311ad87170342fd88ee1165fee68b0_113_0.png)\nFigure 6.5 – Selecting\
    \ objects in the Outline view\n\n- c. In the Property Editor view, select the\
    \ *General* tab.\n- d. In the *Name* field, type `Column Report`.\n\n> Note: The\
    \ format of a BIRT report table can be set at the table level. You can override\
    \ the properties within the table by selecting the element and updating the properties.\n\
    \n- 4. Add the *Name* and *Full Data Type Information* elements from the *Column*\
    \ data set to the table:\n  - a. Open the Data Explorer view.\n  - b. Expand the\
    \ *Data Sets* -> *Column* node and drag the *Name* element to the left column\
    \ of the detail row in the table.\n  - c. Expand the *Data Sets* -> *Column* node\
    \ and drag the *Full Data Type Information* element to the right column of the\
    \ detail row in the table.\n\nThe report should now look like the image in *Figure\
    \ 6.6*.\n\n![](img/38311ad87170342fd88ee1165fee68b0_114_0.png)\nFigure 6.6 – Adding\
    \ elements to a report\n\n- 5. Set the table property to sort the data in the\
    \ table by the data type, then by column name:\n  - a. Open the Outline view.\n\
    \  - b. Expand the *SDT_Info_Sys_custom.rptdesign* -> *Body* node, then select\
    \ *Table – Column Report*. The *Table – Column Report* element opens in the Property\
    \ Editor view.\n  - c. In the Property Editor, select the *Sorting* tab at the\
    \ top of the view. Click *Add*. The New Sort Key window opens.\n  - d. In the\
    \ *Key* field, select *Full Data Type Information* and click *OK*.\n  - e. Click\
    \ the *Add* button to add another sort key.\n  - f. In the *Key* field, select\
    \ *Name* and click *OK*.\n\nYou have created two sort keys for the table. When\
    \ you generate the report later in this chapter, the information in the table\
    \ will be sorted by the data type of each column and then by the name of each\
    \ column.\n\n- 6. Preview your report. At the bottom of the Report Editor view,\
    \ click the *Preview* tab. Your report should look like the image in *Figure 6.7*.\n\
    \n![](img/38311ad87170342fd88ee1165fee68b0_115_0.png)\nFigure 6.7 – Previewing\
    \ a report\n\nYou have created a basic BIRT report. Use the *Preview* tab to check\
    \ the design of your reports before you run them. Now, you should further modify\
    \ this report to specify what tables these columns belong to. You will nest a\
    \ table within the existing table in order to group and sort the columns to organize\
    \ them according to the report design that you specify.\n\n## 6.3.4 Grouping data\
    \ in a report\n\nLet's group the columns by table, maintaining the existing design\
    \ of sorting the columns by data type and name. To group the data in the report:\n\
    \n- 1. Click the *Layout* tab at the bottom of the Report Editor.\n- 2. Select\
    \ the table. When you hover over the table, the *Table* handle appears, as shown\
    \ in *Figure 6.8*. Select this handle.\n\n![](img/38311ad87170342fd88ee1165fee68b0_115_1.png)\n\
    Figure 6.8 – Click the *Table* handle to select the table\n\nThe guide cells for\
    \ the table appear to the left and top of the report table.\n\n- 3. Add a group\
    \ to sort the detail rows of the table by source table:\n  - a. Right-click the\
    \ detail row guide cell and click *Insert Group*. The detail row guide cell is\
    \ the middle guide cell, as shown in Figure 6.9.\n\n![](img/38311ad87170342fd88ee1165fee68b0_116_0.png)\n\
    **Figure 6.9 – Insert a group with a detail guide cell**\n\nThe New Group window\
    \ opens.\n\n- b. Specify `GroupByTable` as the name.\n- c. Specify *Source Table*\
    \ as the *Group On* option.\n- d. Click *OK* to insert the group.\n\nThe table\
    \ now contains a group to sort the columns by table. The report layout should\
    \ look like the image in *Figure 6.10*.\n\n![](img/38311ad87170342fd88ee1165fee68b0_117_0.png)\n\
    **Figure 6.10 – Adding groups to the report**\n\n- 4. Format the *[Source Table]*\
    \ element:\n  - a. In the Report Editor, select the *[Source Table]* element.\
    \ The properties of the element display in the Property Editor view.\n  - b. In\
    \ the *Properties* tab of the Property Editor, make sure the *General* tab is\
    \ open.\n  - c. Change the font color to *Maroon*, and set the font weight to\
    \ **bold**.\n\n- 5. Format the *[Full Data Type Information]* element:\n  - a.\
    \ In the Report Editor, select the *[Full Data Type Information]* element.\n \
    \ - b. In the *Properties* tab of the Property Editor, open the *Padding* tab.\n\
    \  - c. In the *Left* field, type **20**.\n\n- 6. Format the *[Name]* element:\n\
    \  - a. In the Report Editor, select the *[Name]* element.\n  - b. In the *Properties*\
    \ tab of the Property Editor, open the *Padding* tab.\n  - c. In the *Left* field,\
    \ type **40**.\n\n- 7. Create a header row:\n  - a. In the Report Editor, right-click\
    \ the guide cell for the table header row that contains the *[Full Data Type Information]*\
    \ element.\n  - b. Select *Insert -> Row -> Below*. A group header row is inserted\
    \ into the report table.\n  - c. In the Report Editor, move the *Name* and *Full\
    \ Data Type Information* labels from the first header row to the new row that\
    \ you created. Drag the *Name* label to the left column, and drag the *Full Data\
    \ Type Information* label to the right column.\n  - d. Delete the newly empty\
    \ header row. Right-click on the guide cell for the first header row, then click\
    \ *Delete*.\n  - e. Format the *Name* label. Select the *Name* element. In the\
    \ *General* tab, set the font weight to *Bold*, and in the *Padding* tab, set\
    \ the left padding to **40**.\n  - f. Format the *Full Data Type Information*\
    \ label. Select the *Full Data Type Information* label. In the *General* tab,\
    \ set the font weight to *Bold*.\n\nIn the *Layout* tab of the Report Editor,\
    \ the table looks like the image in **Figure 6.11**.\n\n![](img/38311ad87170342fd88ee1165fee68b0_118_0.png)\n\
    **Figure 6.11 – Grouping and formatting data in a report**\n\n- 8. Preview the\
    \ report. Open the *Preview* tab of the Report Editor. The report should look\
    \ like the image in **Figure 6.12**.\n\n![](img/38311ad87170342fd88ee1165fee68b0_118_1.png)\n\
    **Figure 6.12 – Previewing a modified report**\n\n## 6.3.5 Adding dynamic text\
    \ to a report\n\nNow that you have created a basic report, you should improve\
    \ the appearance of the report with dynamic text and formatting. A dynamic text\
    \ label lets you clearly label elements of your data model, and the name of each\
    \ data object displays dynamically according to text that you specify.\n\nIn the\
    \ report that you have created, you should clearly label tables and columns, so\
    \ that when you share this report with other members of your team (or business\
    \ process owners), they will be able to clearly understand the design of your\
    \ physical data model. To format the report:\n\n- 1. Open the *Layout* tab of\
    \ the Report Editor.\n- 2. Create dynamic text for the table header:\n  - a. Delete\
    \ the *[Source Table]* element from the group header row.\n  - b. From the Palette,\
    \ drag a *Dynamic Text* element into the header cell where you deleted the *[Source\
    \ Table]* element. The Expression Builder window opens.\n  - c. In the Expression\
    \ Builder window, add the following string to the *Expression* field, then click\
    \ *OK*:\n    ```\n    \"Table: \" + row[\"Source Table\"]\n    ```\n  The expression\
    \ is added to the dynamic text element, as shown in *Figure 6.13*.\n\n![](img/38311ad87170342fd88ee1165fee68b0_119_0.png)\n\
    **Figure 6.13 – Adding a dynamic text element to a BIRT report**\n\n- 3. Format\
    \ the new dynamic text label:\n  - a. Make sure the label is selected in the Report\
    \ Editor.\n  - b. In the Property Editor view, open the *General* tab. Set the\
    \ font weight to *Bold*, and set the font color to *Maroon*.\n- 4. Preview your\
    \ report. The report should look like the image in *Figure 6.14*.\n\n![](img/38311ad87170342fd88ee1165fee68b0_120_0.png)\n\
    Figure 6.14 – Previewing the formatted report\n\nThis design helps make it easier\
    \ for your team to identify the various objects within your data model. Information\
    \ is conveniently sorted.\n\n## 6.3.6 Generating a report configuration from a\
    \ template\n\nNow, let's create a report configuration so that you can share your\
    \ report with your team. You can also use this report configuration repeatedly,\
    \ so as you make changes to the model, you can create new reports with minimal\
    \ effort. To generate a report from a BIRT template:\n\n- 1. Open the Navigator\
    \ view.\n- 2. Select the report and create the configuration:\n  - a. Right-click\
    \ the **SDT_Info_Sys_custom.rptdesign** file and select *Report As* -> *Report\
    \ Configurations*. The Report Configurations window opens.\n  - b. Double-click\
    \ the **BIRT Report** node to create a new report configuration.\n  - c. In the\
    \ *Name* field, specify **SDT_Info_Sys_custom**.\n  - d. Select the *Location*\
    \ radio button, then click the *Workspace* button to locate your report design\
    \ in your workspace. The Select Report window opens.\n  - e. Expand the *University\
    \ Info System* node, then select the **SDT_Info_Sys_custom.rptdesign** template\
    \ that you just created. Click **OK** to add it to the report configuration.\n\
    \  - f. Specify a location for the report output. For example, specify `C:\\Temp\\\
    IDA_Reports\\Student_Info_Sys.html`.\n  - g. Click *Apply* to save the configuration.\n\
    - 3. Click *Report* to run the report configuration and generate a report."
  mdcn: "\n![](img/38311ad87170342fd88ee1165fee68b0_113_0.png)\n图 6.5 – 在大纲视图中选择对象\n\
    - c. 在属性编辑器视图中，选择*常规*选项卡。\n- d. 在*名称*字段中输入`Column Report`。\n> 注：BIRT报表表格的格式可以在表格层级设置。你可以通过选中对应元素并更新属性，覆盖表格内部的属性设置。\n\
    - 4. 将*列*数据集中的*名称*和*完整数据类型信息*元素添加到表格中：\n  - a. 打开数据资源管理器视图。\n  - b. 展开*数据集* ->\
    \ *列*节点，将*名称*元素拖到表格明细行的左列。\n  - c. 展开*数据集* -> *列*节点，将*完整数据类型信息*元素拖到表格明细行的右列。\n\
    此时报表应如*图 6.6*所示。\n![](img/38311ad87170342fd88ee1165fee68b0_114_0.png)\n图 6.6 –\
    \ 向报表中添加元素\n- 5. 设置表格属性，按数据类型优先、列名其次的顺序为表格内数据排序：\n  - a. 打开大纲视图。\n  - b. 展开*SDT_Info_Sys_custom.rptdesign*\
    \ -> *Body*节点，然后选中*表格 – 列报表*，*表格 – 列报表*元素将在属性编辑器视图中打开。\n  - c. 在属性编辑器中，选择视图顶部的*排序*选项卡。点击*添加*，此时会打开“新建排序键”窗口。\n\
    \  - d. 在*键*字段中选择*完整数据类型信息*，然后点击*确定*。\n  - e. 点击*添加*按钮添加另一个排序键。\n  - f. 在*键*字段中选择*名称*，然后点击*确定*。你已为表格创建了两个排序键。在本章后续生成报表时，表格中的信息会先按每列的数据类型排序，再按每列的列名排序。\n\
    - 6. 预览报表。在报表编辑器视图底部，点击*预览*选项卡。你的报表应如*图 6.7*所示。\n![](img/38311ad87170342fd88ee1165fee68b0_115_0.png)\n\
    图 6.7 – 预览报表\n你已创建了一个基础BIRT报表。可以通过*预览*选项卡在运行报表前检查报表设计。接下来你需要进一步修改该报表，指定这些列所属的表。你将在现有表格内嵌套一个表格，以便对列进行分组和排序，按照你指定的报表设计来组织列。\n\
    \n## 6.3.4 报表数据分组\n现在我们将按表对列进行分组，同时保留先按数据类型、再按列名排序的现有设计。要对报表中的数据进行分组：\n- 1. 点击报表编辑器底部的*布局*选项卡。\n\
    - 2. 选中表格。将鼠标悬停在表格上时，会出现*表格*控制柄，如*图 6.8*所示。选中该控制柄。\n![](img/38311ad87170342fd88ee1165fee68b0_115_1.png)\n\
    图 6.8 – 点击*表格*控制柄以选中表格\n表格的辅助单元格将显示在报表表格的左侧和顶部。\n- 3. 添加一个分组，按源表对表格的明细行进行排序：\n\
    \  - a. 右键单击明细行辅助单元格，然后点击*插入分组*。明细行辅助单元格是中间的辅助单元格，如图 6.9 所示。\n![](img/38311ad87170342fd88ee1165fee68b0_116_0.png)\n\
    **图 6.9 – 使用明细辅助单元格插入分组**\n此时会打开“新建分组”窗口。\n  - b. 将`GroupByTable`指定为名称。\n  - c.\
    \ 将*源表*指定为*分组依据*选项。\n  - d. 点击*确定*插入分组。此时表格已包含一个按表对列进行排序的分组。报表布局应如*图 6.10*所示。\n\
    ![](img/38311ad87170342fd88ee1165fee68b0_117_0.png)\n**图 6.10 – 向报表中添加分组**\n-\
    \ 4. 格式化*[源表]*元素：\n  - a. 在报表编辑器中选中*[源表]*元素，该元素的属性将显示在属性编辑器视图中。\n  - b. 在属性编辑器的*属性*选项卡中，确保*常规*选项卡处于打开状态。\n\
    \  - c. 将字体颜色改为*褐红色*，并将字体粗细设置为**粗体**。\n- 5. 格式化*[完整数据类型信息]*元素：\n  - a. 在报表编辑器中选中*[完整数据类型信息]*元素。\n\
    \  - b. 在属性编辑器的*属性*选项卡中，打开*内边距*选项卡。\n  - c. 在*左*字段中输入**20**。\n- 6. 格式化*[名称]*元素：\n\
    \  - a. 在报表编辑器中选中*[名称]*元素。\n  - b. 在属性编辑器的*属性*选项卡中，打开*内边距*选项卡。\n  - c. 在*左*字段中输入**40**。\n\
    - 7. 创建表头行：\n  - a. 在报表编辑器中，右键单击包含*[完整数据类型信息]*元素的表头行辅助单元格。\n  - b. 选择*插入 -> 行\
    \ -> 下方*，此时会在报表表格中插入一个组表头行。\n  - c. 在报表编辑器中，将*名称*和*完整数据类型信息*标签从第一个表头行移动到新创建的行中。将*名称*标签拖到左列，将*完整数据类型信息*标签拖到右列。\n\
    \  - d. 删除新产生的空表头行。右键单击第一个表头行的辅助单元格，然后点击*删除*。\n  - e. 格式化*名称*标签。选中*名称*元素，在*常规*选项卡中将字体粗细设置为*粗体*，在*内边距*选项卡中将左内边距设置为**40**。\n\
    \  - f. 格式化*完整数据类型信息*标签。选中*完整数据类型信息*标签，在*常规*选项卡中将字体粗细设置为*粗体*。在报表编辑器的*布局*选项卡中，表格应如**图\
    \ 6.11**所示。\n![](img/38311ad87170342fd88ee1165fee68b0_118_0.png)\n**图 6.11 – 报表数据分组与格式化**\n\
    - 8. 预览报表。打开报表编辑器的*预览*选项卡。报表应如**图 6.12**所示。\n![](img/38311ad87170342fd88ee1165fee68b0_118_1.png)\n\
    **图 6.12 – 预览修改后的报表**\n\n## 6.3.5 向报表添加动态文本\n现在你已经创建了基础报表，接下来可以通过动态文本和格式化来优化报表外观。动态文本标签可以清晰标注数据模型中的元素，每个数据对象的名称会根据你指定的文本动态显示。在你创建的报表中，需要清晰标注表和列，这样当你将报表分享给团队其他成员（或业务流程负责人）时，他们可以清晰理解你的物理数据模型的设计。要对报表进行格式化：\n\
    - 1. 打开报表编辑器的*布局*选项卡。\n- 2. 为表头创建动态文本：\n  - a. 从组表头行中删除*[源表]*元素。\n  - b. 从面板中，将*动态文本*元素拖到你删除*[源表]*元素的表头单元格中，此时会打开“表达式生成器”窗口。\n\
    \  - c. 在“表达式生成器”窗口的*表达式*字段中添加以下字符串，然后点击*确定*：\n``` \"Table: \" + row[\"Source\
    \ Table\"] ```\n此时动态文本元素会添加该表达式，如*图 6.13*所示。\n![](img/38311ad87170342fd88ee1165fee68b0_119_0.png)\n\
    **图 6.13 – 向BIRT报表中添加动态文本元素**\n- 3. 格式化新的动态文本标签：\n  - a. 确保报表编辑器中已选中该标签。\n  -\
    \ b. 在属性编辑器视图中打开*常规*选项卡，将字体粗细设置为*粗体*，将字体颜色设置为*褐红色*。\n- 4. 预览报表。报表应如*图 6.14*所示。\n\
    ![](img/38311ad87170342fd88ee1165fee68b0_120_0.png)\n图 6.14 – 预览格式化后的报表\n此设计可以帮助你的团队更轻松地识别数据模型中的各类对象，信息也会被便捷地排序。\n\
    \n## 6.3.6 从模板生成报表配置\n现在我们来创建报表配置，这样你就可以将报表分享给团队。你也可以重复使用该报表配置，当你修改模型后，只需少量操作即可生成新报表。要从BIRT模板生成报表：\n\
    - 1. 打开导航器视图。\n- 2. 选中报表并创建配置：\n  - a. 右键单击**SDT_Info_Sys_custom.rptdesign**文件，选择*报表为\
    \ -> 报表配置*，此时会打开“报表配置”窗口。\n  - b. 双击**BIRT Report**节点以创建新报表配置。\n  - c. 在*名称*字段中指定**SDT_Info_Sys_custom**。\n\
    \  - d. 选择*位置*单选按钮，然后点击*工作区*按钮在工作区中定位你的报表设计，此时会打开“选择报表”窗口。\n  - e. 展开*大学信息管理系统*节点，然后选中你刚创建的**SDT_Info_Sys_custom.rptdesign**模板，点击**确定**将其添加到报表配置中。\n\
    \  - f. 指定报表输出位置，例如指定`C:\\Temp\\IDA_Reports\\Student_Info_Sys.html`。\n  - g. 点击*应用*保存配置。\n\
    - 3. 点击*报表*运行报表配置并生成报表。\n"
