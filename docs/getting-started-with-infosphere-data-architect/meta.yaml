  md: '# **3.2.2.5 Designing the data diagram and logical data model**


    An *entity* is a logical data model object that store information about significant
    areas of interest. Each entity contains *attributes*, which store details about
    the entities. For example, you can create a Sales entity, with ProductKey, Quantity,
    UnitPrice, and OrderKey attributes to describe the sales for various products.
    When the logical data model is transformed into a physical data model, the entities
    can become tables, and attributes become columns.


    When you create entities and attributes, be as specific as you can. Insert all
    attributes you need, all domain constraints, and all other aspects you consider
    in helping you obtaining a model closer to real world. Remember that the logical
    data model will be transformed into a physical data model.


    Let''s use the data diagram to add a new entity to the logical data model:


    +   1. In the Palette view, expand the *Data* section, then drag and drop an entity
    onto a blank space in the diagram editor. The new entity is created in the model
    and within the diagram, and you can immediately give the entity a new name.

    2. Name the entity **STUDENT**.


    The entity is created in the diagram, and the corresponding data object is created
    in the logical data model. When you add or modify logical data model objects by
    using the palette or the diagram surface, the underlying logical data model is
    modified.'
