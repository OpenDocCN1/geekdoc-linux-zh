    # Chapter 9 – Analyzing Data Models


    IBM InfoSphere Data Architect is a free-form modeling tool, which means you can
    create a model that suits the needs of the business, and the workbench will not
    restrict the design of the model in any way.


    When you design a model, however, you could possibly unintentionally create a
    model that violates the logical or physical data modeling rules or constraints
    which could introduce errors or do not conform to common data design best practices.


    To help you identify issues with the model, use the Analyze Model wizard. In this
