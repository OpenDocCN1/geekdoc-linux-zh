    \ IBM InfoSphere Data Architect allows you to generate reports that help you analyze\
    \ a data model or a package. There are various built-in templates available in\
    \ IBM InfoSphere Data Architect which can be used to generate a report. You will\
    \ see the information related to various built-in templates in IBM InfoSphere\
    \ Data Architect in the next section.\n\nReporting in IBM InfoSphere Data Architect\
    \ is done via two methods:\n\n+   - Business Intelligence Reporting Tool (BIRT)\
    \ reporting\n- XSLT reporting\n\n*BIRT reports* are a widely used reporting format\
    \ in IBM InfoSphere Data Architect. It gives greater flexibility and more options\
    \ for the output format of a report. It supports multiple output formats.\n\n\
    *XSLT reports* only support PDF output.\n\nIBM InfoSphere Data Architect supports\
    \ various built-in templates to generate reports for your logical, physical, glossary\
    \ and mapping models. The file extension for a BIRT report template is `.rptdesign`,\
    \ and for an XSLT report, the file extension is `.xsl`.\n\n> **Note:**\n\nYou\
    \ can also create your own report templates. You will create one later in the\
    \ Exercise section of this chapter.\n\n# ## 6.3 Generating a BIRT Report\n\nLet's\
