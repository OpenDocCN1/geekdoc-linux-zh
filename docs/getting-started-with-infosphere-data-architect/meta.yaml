    \ actions\n\n5. Save your work.\n\n## 3.3 Working with glossary models\n\nSometimes,\
    \ when working with various people on the same project, data object naming varies.\
    \ Where one data architect might refer to sales entities as `SALES_X`, another\
    \ data modeler might prefer `SLS_X`. Over time, the system becomes difficult to\
    \ understand, and the inconsistency can spread across systems, causing confusion,\
    \ longer application development times, or even the inability to make the connection\
    \ between two fields that mean the same thing in two different systems. To avoid\
    \ this problem, you should develop a set of naming standards early in the data\
    \ design process.\n\n*Naming standards* help you and other people in your organization\
    \ look at your data in a consistent manner, so that you all get the same meaning.\
    \ With IBM InfoSphere Data Architect, you can create a set of rules that all data\
    \ modelers should follow, and the workbench can automatically create names of\
    \ some of the data objects (such as relationships) for you.\n\nA *glossary model*\
    \ is a model that describes the names and abbreviations that an organization allows\
    \ for data objects. Data object naming standards promote a common understanding\
    \ of data, since you use the same name conventions across the entire organization.\
    \ You can use glossary models to enable sharing of data across organizational\
    \ boundaries and reduce data redundancy through the consolidation of synonymous\
    \ and overlapping data elements.\n\nWhen you name a data object, you need to take\
    \ into account two items: semantic rules and format. Semantically, glossary model\
    \ objects include prime words, class words, and modifiers:\n- *Prime word*: A\
    \ word that represents the business concept about which data is being collected.\
    \ Prime words are nouns that describe the subject area of the data. For example:\
    \ LOAN, EMPLOYEE\n- *Class word*: A word that identifies a distinct category or\
    \ classification of data. For example: RATE, NAME\n- *Modifier*: A word that further\
    \ qualifies or distinguishes the prime and class words. It helps make the object\
    \ name clear and unique, and it can help restrict the meaning of the class and\
    \ prime words. For example: NEXT, FIRST\n\nYou can use IBM InfoSphere Data Architect\
    \ to help you define these semantic rules or *naming standards*. You will learn\
    \ more about how to specify some of these options for future data modeling projects\
    \ in *Section 3.4, Working with naming standards*.\n\nTo enforce the naming conventions\
