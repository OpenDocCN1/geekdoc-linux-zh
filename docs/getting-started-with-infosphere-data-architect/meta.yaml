  md: '# 9


    # Chapter 9 – Analyzing Data Models


    IBM InfoSphere Data Architect is a free-form modeling tool, which means you can
    create a model that suits the needs of the business, and the workbench will not
    restrict the design of the model in any way.


    When you design a model, however, you could possibly unintentionally create a
    model that violates the logical or physical data modeling rules or constraints
    which could introduce errors or do not conform to common data design best practices.


    To help you identify issues with the model, use the Analyze Model wizard. In this
    chapter, you will learn the following concepts:


    +   - How to analyze the data model

    - How to change the preferences to influence how models are analyzed

    - How to address errors and warnings after the model is analyzed


    # 9.1 Analyzing data models: The big picture


    You *analyze* a data model after you create it. The Analyze Model wizard validates
    the model in two major ways:


    +   1. **Design Suggestions:** These are best practice suggestions or design constraints
    that are put in place by the architects so that the model follows a standard.

    2. **Syntax Checks:** Syntax checks are validations validate the syntax of attributes
    and also checks if the valid relations are created between entities or tables.


    Ideally, you analyze data models before you transform or deploy them. This ensures
    that you are not transforming or deploying invalid models, and you can determine
    what problems exist (if any) *before* these models go into production and cause
    potential issues.


    # 9.2 Analyzing data models with the workbench


    # 9.2.1 Analyzing logical data models with the workbench


    You can only analyze logical data models from the package node. Let''s analyze
    the **STUDENT_INFO_SYSTEM.1dm** logical data model to ensure that it is valid.


    To analyze a logical data model:'
  merge: -1
  pgno: 158
- img_proc: true
  md: '+   1. Locate the STUDENT INFO SYSTEM package within the logical data model:
    *University Info System -> Data Models -> STUDENT_INFO_SYSTEM.ldm -> STUDENT INFO
    SYSTEM.*


    +   2. Right-click on the STUDENT INFO SYSTEM package and select *Analyze Model*.
    The Analyze Model wizard opens.


    Since we selected a logical data model package, by default, all of the rule sets
    under the *Logical Data Model* node are selected. The rule sets in the *Logical
    Data Model* node include best practices, naming standards, and common design suggestions.
    Each rule set typically contains its own set of rules.


    You can pick and choose which rules you want to adhere to when you validate your
    model, depending on what works best for your organization. Are naming standards
    important? Do you use domains? Does your data model have to be fully normalized?


    +   3. Since you have already validated the naming standards, deselect the *Naming
    Standard* rule set.


    +   4. Since you did not create a dimensional model, deselect the *Dimensional
    Modeling* rule set.


    +   5. Click *Finish* to analyze the model.


    The model is analyzed, and you see two warnings in the Problems view.


    *A warning* specifies best practices, database limitations, or organizational
    requirements. Warnings do not make any model invalid by themselves. Warnings do
    not require changes to the data model before it is deployed. Warnings simply point
    out potential conflicts that could warrant design changes to your model. You should
    look at all warnings and act on them accordingly to make sure that any database
    limitations are addressed, and that you are adhering to organizational standards.
    You decide, however, whether to correct the warnings that relate to a data design
    best practice.


    In this case, the two warnings in the Problems view note that the COURSE ID and
    STUDENT ID attributes in the COURSE and STUDENT entities are not unique. These
    attributes were added when you created relationships between the two entities.
    Therefore, you do not need to fix these attributes.


    *An error* in the Problems view means that there is an issue with the data model
    that must be fixed. Errors will cause problems in a production environment, and
    you should fix them before you transform or deploy them to a production environment.


    # 9.2.2 Analyzing physical data models with the workbench


    Let''s analyze the **STUDENT_INFO_SYSTEM.dbm** physical data model. You can analyze
    physical data models from the database or schema node.


    To analyze a physical data model:


    +   1. Locate the SAMPLE database object in the physical data model: *University
    Info System -> Data Models -> STUDENT_INFO_SYSTEM.dbm -> SAMPLE.*


    +   2. Right-click on the SAMPLE database object and select *Analyze Model*. The
    Analyze Model wizard opens.


    Since we selected an object within the physical data model, by default, all of
    the rule sets under the *Physical Data Model* category are selected. Just as in
    the logical data model analysis, the physical'
  merge: -1
  pgno: 159
- img_proc: true
  md: 'model analysis contains categories with their own rules that check for common
    best practices, naming standards, and design suggestions.


    +   3. Because we did not create a dimensional model, deselect the *Dimensional
    Modeling* rule set.


    +   4. Because we do not have table spaces for this physical data model, make
    sure that the tool does not validate table space options:


    +   a. Select the *Index and Storage* rule set under the *Design Suggestions*
    node. The rules for the *Index and Storage* rule set display in the *Rules* pane.


    +   b. Deselect the *Table space design check* and *Table with table space check*
    rules.


    +   c. Deselect the *Table spaces* rule set under the *Syntax Check* node.


    +   5. Deselect the *Naming Standard* rule set. Click *Finish* to analyze the
    physical data model.


    You see 7 warnings and 13 informational messages about the physical data model.
    If you wish, you can navigate through the problems in the Problems view and fix
    the warnings.


    # 9.2.3 Fixing errors and warnings in the Problems view


    If you want to fix the errors or warnings in the Problems view:


    +   1. View the entire message to see the design suggestions offered by the tool.


    +   2. Double-click the message to navigate to the data object or objects affected
    by the warning message.


    +   3. Update the objects according to the design suggestions offered in the Problems
    view.


    > **Note**:


    You can fix some of the messages in the *Problems view* by right-clicking on the
    message, then selecting *Quick Fix*.


    # 9.3 Modifying the preferences for model analysis


    You can modify the categories and rules that are selected by default when you
    analyze your data models. If you perform these steps, you do not have to spend
    time selecting and deselecting the options that you always use in the Analyze
    Model wizard.


    > **Note**:


    You will not actively modify these preferences in this section, but you will learn
    how to get to these options in the Preferences window.


    To modify preferences for the Analyze Model wizard:


    +   1. From the main menu, click *Window* -> *Preferences*. The Preferences window
    opens.


    +   2. Expand the *Model Validation* node and select the *Constraints* page. Use
    this page to change the default settings for what categories and rules are selected
    when you validate your data models.'
  merge: -1
  pgno: 160
- img_proc: true
  md: 'For example, if you do not implement a naming standard for logical data models,
    expand the *Logical data model -> Design suggestions* node and deselect the *Naming
    standard* category.


    +   3. Once you have made your changes, click *Apply*, then click *OK*.


    The next time you validate your data model, your preferred categories and rules
    are selected.


    # ## 9.4 Summary


    In this chapter you have learned how to analyze a model to make sure that it conforms
    to organizational standards or standard design syntax rules. You learned about
    warnings and errors in the Problems view and how to address them.


    # ## 9.5 Exercise


    Modify the default preferences for the Analyze Model wizard.


    +   1. First, analyze your existing physical and logical data models without changing
    the default settings. Document your results.

    2. Then, use the Preferences window to ensure that both physical and logical data
    models are not checked for naming standards, table spaces, or dimensional modeling
    rules.

    3. Analyze your physical and logical data models, and document the results. Do
    not fix the warnings or errors.

    4. Then, open the Preferences window and restore the default settings for the
    model validation tool.


    # ## 9.6 Review questions


    1. At what level of a data model can you invoke the Analyze Model wizard?


    +   A. Model file

    B. Diagram

    C. Package, database, or schema

    D. Entity or table


    2. What type of validation occurs when you analyze your models?


    +   A. Best practices

    B. Model syntax

    C. Valid design

    D. All of the above


    3. Warnings point out potential problems in the following area:


    +   A. Database limitations and best practices

    B. Organizational requirements'
  merge: -1
  pgno: 161
- img_proc: true
  md: 'C. Both A and B


    D. None of the above


    4. How do you change the default preferences for the Analyze Model wizard?


    5. When is the best time to analyze a model?


    6. What should you keep in mind when analyzing your data model or determining
    whether to address a warning?


    7. True or false: You must correct warnings in the Problems view.


    8. True or false: Your model is considered invalid if there are errors in the
    Problems view.'
