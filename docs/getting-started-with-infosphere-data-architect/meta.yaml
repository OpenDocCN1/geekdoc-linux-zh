  md: "![](img/38311ad87170342fd88ee1165fee68b0_164_0.png)\n\n# Chapter 10 – The Data\
    \ Management Life Cycle\n\n# 10.1 Managing your data\n\nThe Data Security, Privacy,\
    \ and Lifecycle Management portfolio is a unified solution set that facilitates\
    \ management of data throughout all the stages of the software development cycle,\
    \ from gathering requirements to project retirement. IBM InfoSphere Data Architect\
    \ is a part of the Data Security, Privacy, and Lifecycle Management portfolio.\
    \ Some of the popular products in the portfolio are:\n\n+   - IBM InfoSphere Data\
    \ Architect\n- Optim Development Studio and pureQuery Runtime\n- Optim Database\
    \ Administrator\n- Optim Performance Manager Extended Edition\n- Optim High Performance\
    \ Unload\n- Optim Query Tuner\n\nThe following list contains some high-level descriptions\
    \ of these products in the Data Security, Privacy, and Lifecycle Management family:\n\
    \n+   - **Optim Development Studio**\n\n  Optim Development Studio allows you\
    \ to develop and administer databases. With Optim Development Studio, you can\
    \ create, alter, and drop objects; manage database privileges; view distributions\
    \ of data; and gather statistics on data objects. You can also develop and test\
    \ SQL and XQuery queries, stored procedures, Web services, and Java data access\
    \ layers.\n\n  Optim pureQuery Runtime is an optional feature that you can use\
    \ with Optim Development Studio. Optim pureQuery Runtime is a high-performance\
    \ data access platform that makes it easier to monitor, develop, optimize, secure,\
    \ and manage data access. Use APIs to simplify best practices and enable collaboration\
    \ between developers and database administrators, or monitor your SQL hot spots\
    \ to gain insight to improve response times.\n\n- **Optim Database Administrator**"
  merge: -1
  pgno: 164
- img_proc: true
  md: "Optim Database Administrator allows you to administer complex structural changes\
    \ to databases and manage database migration scenarios. You can automate structural\
    \ changes to better manage your test databases and speed up deployments, streamlining\
    \ administrative tasks. Analyze the impact of database changes to minimize the\
    \ risk to your deployment environment. You can also manage large environments\
    \ more efficiently with Optim Database Administrator.\n\n+   - **Optim Performance\
    \ Manager Extended Edition**\n\n  Optim Performance Manager helps database administrators\
    \ improve DB2 performance and availability. DB2 Performance Expert helps you identify,\
    \ diagnose, solve, and prevent performance problems before they impact the business.\
    \ Optim Performance Manager provides optimization and tuning recommendations and\
    \ helps you analyze trends to plan for database growth. It monitors your applications\
    \ and databases, identifying potential problems and managing your workload before\
    \ it impacts performance.\n\n- **Optim High Performance Unload**\n\n  Optim High\
    \ Performance Unload helps database administrators work with very large quantities\
    \ of data with less effort and faster results. Optim High Performance Unload runs\
    \ concurrently with production applications, maintaining system availability while\
    \ minimizing the impact to production performance. Optim High Performance Unload\
    \ can also fit unloads, backups, migrations, re-partitioning into tight or shrinking\
    \ batch windows, reducing the risk of impact to your online production environment.\n\
    \n- **Optim Query Tuner**\n\n  Optim Query Tuner helps developers create efficient\
    \ queries and build their tuning skills. It improves performance by providing\
    \ expert advice about how to write high-quality queries and improve the design\
    \ of the database.\n\n# 10.1.1 The data management life cycle\n\nThe products\
    \ listed in the previous section, either individually or in collaboration, provide\
    \ solutions in each phase of software development life cycle. *Figure 10.1* illustrates\
    \ this life cycle that can be accomplished with IBM's Data Security, Privacy,\
    \ and Lifecycle Management portfolio."
  merge: -1
  pgno: 165
- img_proc: true
  md: '![](img/38311ad87170342fd88ee1165fee68b0_166_0.png)


    **Figure 10.1 – Data Security, Privacy, and Lifecycle Management tools**


    IBM InfoSphere Data Architect, as discussed previously, is primarily used in the
    design phase of the integrated data management life cycle, although modifications
    to the design are commonplace throughout the life cycle of any project. You can
    use the workbench to manage these changes.


    With the Data Security, Privacy, and Lifecycle Management portfolio, all of these
    products are presented to you as a single solution (see section 10.1.2 on Integration
    capabilities of IBM InfoSphere Data Architect and 10.1.3 on shell-sharing). With
    Data Security, Privacy, and Lifecycle Management, the entire product life cycle
    can be managed. Because the portfolio overcomes the problems of interoperability
    and compatibility, you can achieve the following improvements:


    +   - Develop enterprise-ready applications faster

    - Effectively manage data growth

    - Optimize database application performance

    - Protect data privacy in all stages of the product/application life cycle

    - Simplify migrations and upgrades


    # **10.1.2 Integrating IBM InfoSphere Data Architect with other products**


    In any software development team, whether large or small, you should use tools
    that can share data or information seamlessly. This makes it easier to reuse all
    of the information throughout the various stages of product development.


    IBM InfoSphere Data Architect supports model-driven design by integrating with
    the following products:


    +   - InfoSphere Business Glossary: Share enterprise glossaries across the business

    - Cognos Business Intelligence: Author, share, and use reports from information
    in your database

    - Rational Software Architect: Synch the design of applications and information

    - Rational RequisitePro: Ensure that the model is complete for the requirements
    of the business

    - WebSphere® Business Modeler Advanced: Transform data models to XML schema definitions
    for business processes'
  merge: -1
  pgno: 166
- img_proc: true
  md: '![](img/38311ad87170342fd88ee1165fee68b0_167_0.png)


    # Figure 10.2 – Integrating InfoSphere Data Architect with other software development
    products


    # 10.1.3 Shell-sharing with other Eclipse-based products


    IBM InfoSphere Data Architect is built on top of the Eclipse platform, which is
    a popular open-source platform that you can use to develop applications. The Eclipse
    platform allows you to integrate with other Eclipse-based products.


    *Shell-sharing* between Eclipse-based products basically means that you can share
    the core components of products so that they are not duplicated across each of
    the products. It eliminates the need for each product to have its own Eclipse
    platform. A simple analogy to understand shell-sharing is to compare it to a Microsoft
    Windows installation: all of the common components required by Windows Program
    Files are stored in the `C:\Windows` folder.


    At a basic level, shell-sharing translates into disk space savings, and duplicate
    components are not installed. Shell-sharing achieves this result by sharing common
    and compatible features. Therefore, you can interact with all of the features
    of each of the products via a single user interface. If, for example, you shell-share
    IBM InfoSphere Data Architect and Optim Development Studio with each other, you
    can develop and architect databases from a single, common platform. This common
    platform is launched without regard to which of the products is launched.'
  merge: -1
