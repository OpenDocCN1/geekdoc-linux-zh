  md: '# Getting started with InfoSphere Data Architect couldn''t be easier.


    # Read this book to:


    +   - Find out what InfoSphere Data Architect can do for you

    - Learn how to create, deploy, and update data models

    - Manage and analyze the impact of changes to your data models

    - Discover how to forward- and reverse-engineer your data sources

    - Learn more about data privacy, security, and lifecycle management

    - Practice using hands-on exercises


    InfoSphere Data Architect is a collaborative data design solution that you can
    use to discover, model, visualize, relate, and standardize diverse and distributed
    data assets. You can use InfoSphere Data Architect to leverage data model value
    across the data lifecycle to promote cross-lifecycle, cross-role and cross-organization
    collaboration and to align process service, application, and data architecture.


    This book provides a comprehensive look at InfoSphere Data Architect and includes
    hands-on exercises using SQL and DB2 Express-C, the free version of DB2.


    To learn more or download a free trial of InfoSphere Data Architect, visit ibm.com/developerworks/downloads/r/rda/


    To learn more or download DB2 Express-C, visit ibm.com/db2/express


    To socialize and watch related videos, visit channelDB2.com


    This book is part of the DB2 on Campus book series, free eBooks for the community.
    Learn more at db2university.com


