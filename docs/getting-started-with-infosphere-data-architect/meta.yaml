  md: '![](img/38311ad87170342fd88ee1165fee68b0_128_0.png)


    # Chapter 7 – Reverse-Engineering


    Often, companies have large schemas with multiple tables that are deployed to
    a database before you start your work as a data architect. If you need to make
    changes to these schemas, it takes a large amount of time and effort to manage
    these changes without affecting existing constraints or losing data.


    However, you can create a physical data model from the existing set of database
    objects. After you reverse-engineer an existing database, making changes and deploying
    the set of changes in the model back to the database becomes an easy process.
    This is what we will be exploring in this chapter.


    In this chapter you will learn about:


    +   - Reverse-engineering from an existing database in the workbench

    - Comparing and merging changes to your data models

    - Generating the DDL to deploy your changes'
  merge: -1
  pgno: 128
- img_proc: true
  md: '# 7.1 Reverse-engineering: The big picture


    We have seen how objects in the physical data model can be converted into objects
    in a database when you generate a DDL script that deploys them. *Reverse-engineering*
    is the opposite of this process: We convert an object in the database into an
    object in the physical data model. *Figure 7.1* illustrates the big picture of
    reverse-engineering.


    ![](img/38311ad87170342fd88ee1165fee68b0_129_0.png)


    The left side of *Figure 7.1* illustrates that the process of reverse-engineering
    can be carried out from either a database or a DDL script. The reverse-engineering
    process creates a physical data model (.dbm) file in the Data Project Explorer
    of the workbench. This physical data model captures the information about the
    data objects in the database. Once you reverse-engineer to a physical data model,
    you can modify the data model, transform to a logical data model, or work with
    it as you would any other data model.


    Once you make changes to the physical data model, you should deploy the changes
    to the database. Use the compare function in the workbench to match the physical
    data model against the database and show the differences between the model in
    development and the model in production. Then, you can analyze the impact that
    your changes will have to an existing data model. Finally, use the workbench to
    merge the changes and generate a delta DDL file that can deploy the changes to
    the database. When you run this script on a database, you make the necessary modifications
    to the database object without losing any existing data.


    > **Note:**


    Although you can reverse-engineer from a DDL script or an existing database, you
    have more options when you reverse-engineer from a database. Since the database
    stores a lot of metadata in catalog tables, IBM InfoSphere Data Architect can
    make good use of that metadata to better populate the physical data model.'
  merge: -1
  pgno: 129
- img_proc: true
  md: "# 7.2 Reverse-engineering with the workbench\n\nWhen you reverse-engineer a\
    \ database, the workbench reads the details of the objects in the database and\
    \ converts them to their equivalent representation in the physical data model.\
    \ This simply means that if you reverse-engineer a schema that contains one table\
    \ and one index, then the reverse-engineered physical data model will contain\
    \ one schema with one table and one index.\n\nTo understand what happens when\
    \ you reverse-engineer from a DDL script, consider the following example: A DDL\
    \ script creates a schema that contains a table and an index in the database.\
    \ When you reverse-engineer from the DDL script, the workbench creates an equivalent\
    \ representation of the schema, the table, and the index in the physical data\
    \ model. We will see the process in more detail in the next section.\n\n# 7.2.1\
    \ Reverse-engineering from DDL\n\n# 7.2.1.1 Creating a sample DDL script\n\nFirst,\
    \ let's create a sample DDL script from which to reverse-engineer. This DDL script\
    \ creates the following database objects in the SAMPLE database connection:\n\n\
    +   - A database, named *SAMPLEUNIV*\n- A schema, named *UNIVERSITY*, that belongs\
    \ to the *SAMPLEUNIV* database\n- Two tables in the schema, named *DEPARTMENT*\
    \ and *STUDENT*\n\nTo create the sample DDL script:\n\n+   1. Right-click on the\
    \ *SQL Scripts* folder of your data design project, then select *New* -> *SQL\
    \ or XQuery Script*. The New SQL or XQuery Script window opens.\n2. Complete the\
    \ New SQL or XQuery Script window:\n    a. Specify the *University Info System*\
    \ project.\n    b. In the *Name* field, type **SAMPLE_DDL.sql**.\n    c. Make\
    \ sure that the following radio button is selected: *SQL and XQuery Editor* (for\
    \ scripts that contain one or more SQL and XQuery statements)\n    d. Click *Finish*.\n\
    3. Select the SAMPLE database connection profile. Since you aren't deploying the\
    \ script, you do not need to worry about a connection at this point.\n\nThe Select\
    \ Connection Profile window opens.\n\nA blank SQL file is created and opens in\
    \ the SQL Editor view.\n\n4. Enter the following SQL statements to create the\
    \ SAMPLEUNIV database with a UNIVERSITY schema and DEPARTMENT and STUDENT tables:\n\
    \n```\nCREATE DATABASE SAMPLEUNIV;\nCREATE SCHEMA \"SAMPLEUNIV\".\"UNIVERSITY\"\
    ;\nCREATE TABLE \"UNIVERSITY\".\"STUDENT\"\n    (STUDENT_ID CHAR(10) NOT NULL,\n\
    ```"
  merge: -1
  pgno: 130
- img_proc: true
  md: "```\nSTUDENT_FIRSTNAME CHAR(20) NOT NULL,\nSTUDENT_LASTNAME CHAR(20) NOT NULL,\n\
    STUDENT_ADDRESS CHAR(100) NOT NULL,\nSTUDENT_PHONE CHAR(10) NOT NULL,\nDEPARTMENT_ID\
    \ INTEGER NOT NULL);\nCREATE TABLE \"UNIVERSITY\".\"DEPARTMENT\"\n(    DEPARTMENT_ID\
    \ INTEGER NOT NULL,\n    DEPARTMENT_NAME CHAR(20) NOT NULL,\n    DEPARTMENT_ESTDATE\
    \ DATE);\nALTER TABLE \"UNIVERSITY\".\"STUDENT\" ADD CONSTRAINT\n\"STUDENT_PK\"\
    \ PRIMARY KEY(STUDENT_ID);\nALTER TABLE \"UNIVERSITY\".\"DEPARTMENT\" ADD CONSTRAINT\
    \ \"DEPARTMENT_PK\" PRIMARY\nKEY(DEPARTMENT_ID);\nALTER TABLE \"UNIVERSITY\".\"\
    STUDENT\" ADD CONSTRAINT \"STUDENT_DEPARTMENT_fk\"\nFOREIGN KEY(DEPARTMENT_ID)\
    \ REFERENCES\n\"UNIVERSITY\".\"DEPARTMENT\" (DEPARTMENT_ID);\n```\n\n+   5. Save\
    \ your work.\n\nThe SQL script is created and saved in your *SQL Scripts* folder.\n\
    \n> **Note:**\nYou do not have to run this file to reverse-engineer from it. You\
    \ will reverse-engineer from this script in the next section.\n\n# 7.2.1.2 Reverse-engineering\
    \ from the DDL script\n\nLet's use this new DDL file to reverse-engineer to a\
    \ physical data model.\n\nTo reverse-engineer the DDL script:\n\n+   1. Create\
    \ a new physical data model by clicking *File -> New -> Physical Data Model*.\
    \ The New Physical Data Model wizard opens.\n2. Complete the Model File page of\
    \ the wizard:\n    a. Specify the *University Info System* data design project\
    \ as the destination folder.\n    b. In the *File name* field, specify **NEW_SDT_DDL**.\n\
    \    c. Specify *DB2 for Linux, UNIX, and Windows* as the database type.\n   \
    \ d. Specify 9.7 as the database version.\n    e. Select the *Create from reverse\
    \ engineering* radio button.\n    f. Click *Next*.\n3. On the Source page, select\
    \ the *DDL script* option, then click *Next*.\n4. On the Script File page, click\
    \ *Browse*, then select the SAMPLE_DDL.sql file. Click *Next*.\n5. On the Options\
    \ page, click *Next*."
