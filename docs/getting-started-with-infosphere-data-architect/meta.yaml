    ## 第一部分 – 概述与安装

    ![](img/38311ad87170342fd88ee1165fee68b0_22_0.png)


    ## 第1章 – IBM InfoSphere 数据架构师简介

    IBM InfoSphere® Data Architect 是一款企业级数据建模工具。它是一个综合开发环境，可用于对多样化的分布式数据资产进行建模，也可用于发现并建立这些资产之间的关联。在本章中，您将了解以下概念：

    - 什么是 IBM InfoSphere 数据架构师？

    - 如何使用该产品

    - 系统要求

    - 如何安装 IBM InfoSphere 数据架构师


    ### 1.1 什么是 IBM InfoSphere 数据架构师？

    当今企业拥有海量数据，所有决策都基于数据做出。IT 领域面临的挑战十分明确：理解数据、提升数据质量与一致性，并使数据设计与业务意图及需求保持一致。IBM InfoSphere
    Data Architect 是一款协作式数据设计解决方案，可帮助您发现、建模、关联并标准化多样化的分布式数据资产。IBM InfoSphere Data
    Architect 的部分主要功能与优势如下所示：

    - InfoSphere 数据架构师通过检查分析底层元数据，发现异构数据源的结构。通过使用已建立的 Java 数据库连接（JDBC）连接至数据源，InfoSphere
    数据架构师利用原生查询探索其结构。通过用户界面，用户可以轻松浏览数据元素层级，便于了解每个元素的详细属性。

    - InfoSphere 数据架构师可为 DB2®、Informix®、Oracle、Sybase、Microsoft SQL Server、MySQL 和
    Teradata 创建逻辑、物理和域模型。逻辑与物理数据模型的元素可使用信息工程（IE）标记法以图表形式可视化呈现。此外，物理数据模型图也可使用统一建模语言（UML）标记法。InfoSphere
    数据架构师支持数据专业人员从零开始创建物理数据模型、通过转换从逻辑模型创建物理数据模型，或通过逆向工程从数据库创建物理数据模型。IBM InfoSphere
    数据架构师还可创建并使用逻辑与物理多维数据模型。与逻辑及物理数据模型类似，您可以从零开始创建这些模型，也可从现有数据源对其进行逆向工程。

    > **注意：** 本书未涉及多维建模相关内容。若想了解多维建模的更多概念性信息，请访问 IBM InfoSphere 数据架构师信息中心：http://publib.boulder.ibm.com/infocenter/ndahelp/v7r5/topic/com.ibm.datatools.dimensional.ui.doc/topics/c_ida_dm_container.html

    - 多数开发项目本质上是迭代式的，因此能够增量式设计并无缝管理变更及其影响十分重要。InfoSphere 数据架构师正好支持这一需求。影响分析会列出所选数据元素的所有依赖项。高级同步技术可比较两个模型、模型与数据库或两个数据库。之后可在数据模型内、跨数据模型以及跨数据源推广变更。可与
    Optim™ Database Administrator 搭配使用，在不中断业务的情况下管理复杂的 DB2 变更与数据迁移。

    - InfoSphere 数据架构师支持架构师定义并实施标准，提升命名、含义、值、关联、权限、隐私与可追溯性方面的数据质量与企业一致性。只需定义一次标准，即可将其关联到多种模型和数据库。内置的、可扩展的、基于规则的分析功能可验证模型和数据库是否符合命名、语法、规范化及最佳实践标准。

    - 无论您是在小团队中工作（成员需承担多个角色），还是在职责划分明确的大型分布式团队中工作，都可以将 InfoSphere 数据架构师作为插件用于共享的 Eclipse
    实例，或通过标准配置管理代码库（如 Rational® Clear Case 或并发版本系统（CVS））共享开发制品。


    ### 1.2 系统要求

    安装 IBM InfoSphere 数据架构师 V7.5.3 之前，请确保您的计算机满足系统要求。您可通过以下网址查找 IBM InfoSphere 数据架构师的系统要求：

    http://www-01.ibm.com/support/docview.wss?uid=swg27019867

    该文档包含硬件、软件和数据源要求。

    > **注意：** 如果您要扩展现有 Eclipse 环境，则必须使用 Eclipse 3.4.2 版本和 IBM JDK 1.6 SR 7。


    ### 1.3 获取 DB2 Express-C

    本书大部分练习均使用 DB2 免费版本 DB2 Express-C。要获取并安装 DB2 Express-C：

    - 从 ibm.com/db2/express 下载 DB2 Express-C

    - 安装 DB2 Express-C。您可在 db2university.com 查看相关操作视频

    - 配置 DB2 自带的 SAMPLE 示例数据库，以便部署您在学习本书过程中创建的数据模型

    > **注意：** 更多相关信息，请参阅本丛书中的*《DB2 Express-C 入门》*电子书。


    ### 1.4 获取 InfoSphere 数据架构师

    如果您是学生、教师或研究人员，可通过 IBM 学术计划免费获取 IBM InfoSphere 数据架构师。您需隶属于某所院校，且需满足以下任一条件：

    - 您是学习数据架构的学生

    - 您是教授数据建模与架构的教师

    - 您希望使用该产品开展研究

    想了解 IBM 学术计划的更多信息，请访问以下网址：

    https://www.ibm.com/developerworks/university/academicinitiative/

    '
