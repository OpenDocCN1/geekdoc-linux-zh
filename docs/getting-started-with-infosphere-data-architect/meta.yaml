    6. 在“数据库元素”页面，保留默认选项，然后单击*下一步*。\n7. 在“选项”页面，单击*完成*。新的物理数据模型会在数据项目资源管理器中创建（如图7.3所示），并在编辑器视图中打开。\n\
    ![](img/38311ad87170342fd88ee1165fee68b0_133_0.png)\n图7.3 – 从现有数据库逆向工程得到的新物理数据模型\n\
    \n## 7.3 修改新的物理数据模型\n我们来修改`NEW_SDT_INFO_SYS.dbm`物理数据模型文件，在其中添加一些新列和一个索引。在本场景中，业务流程负责人要求你添加列，用于存储每门课程每位讲师的主电话号码以及学生的电话号码。他们还要求创建一个索引，帮助按学生姓名排序，以便更便捷地访问数据。完成这些修改后，你可以使用工作台的比较与合并功能生成DDL，将修改部署到SAMPLE数据库中。\n\
    \n要修改物理数据模型：\n1. 在数据设计项目中定位COURSE表：*大学信息系统 -> 数据模型 -> NEW_SDT_INFO_SYS.dbm ->\
    \ SAMPLE -> STUDENT_LIFE -> COURSE*。\n2. 在COURSE表中创建INSTRUCTOR_PHONE列：\n   a.\
    \ 右键单击COURSE表，选择*添加数据对象 -> 列*。将在COURSE表下创建一个新的列对象。\n   b. 将新列命名为**INSTRUCTOR_PHONE**。\n\
    \   c. 在INSTRUCTOR_PHONE列的*数据类型*字段中，指定CHAR。\n   d. 在*长度*字段中，指定**10**。\n3. 按照步骤2的说明，在STUDENT表中创建STUDENT_PHONE列。使用相同的数据类型。\n\
    4. 创建一个新索引，按姓氏对学生信息排序：\n   a. 右键单击STUDENT表，选择*添加数据对象 -> 索引*。将在STUDENT表下创建一个新索引。\n\
    \   b. 将索引命名为**STUDENT_LAST_NAME_IDX**。\n   c. 打开属性视图的*列*选项卡，单击*键列*字段旁的省略号按钮（...）修改键列。将打开“选择列”窗口。\n\
    \   d. 取消选中FIRST_NAME列，选中LAST_NAME列。单击*确定*修改键列。\n5. 保存你的工作。列和索引已创建并保存在你的物理数据模型文件中。现在你可以使用此修改后的物理数据模型与目标数据库进行比较，然后生成增量DDL，将你的修改合并到SAMPLE数据库中。\n\
    \n## 7.4 比较并合并你的修改\n*比较*功能可帮助你查找同一模型两个版本之间的差异。*合并*功能可帮助你将修改部署到现有模型中。通过此视图，你还可以*分析修改对现有模型的影响*。此操作可帮助你查找数据对象之间的依赖关系，从而了解你对某一数据对象做出的修改将如何影响关联对象。\n\
    \n> **注意：** 由于我们对这个小模型所做的修改较少，该模型中没有会受到影响的依赖对象。作为最佳实践，你在生成DDL以部署修改之前，应始终分析修改的影响。如果将来你想要分析修改的影响，必须先将修改从一个数据模型复制到另一个数据模型。之后，你可以使用**分析左侧影响**或**分析右侧影响**按钮来分析修改的影响。受影响的对象将显示在“受影响对象”视图中，你可以深入查看修改，了解哪些数据对象会受到你的修改的影响。\n\
    \n> **注意：** 你也可以比较工作区中的两个模型。本书未涵盖此任务，但其与对比源数据库的流程类似。\n\n### 7.4.1 使用数据库比较和合并修改\n\
    你可以将数据模型与源数据库进行比较。以下对象可使用比较功能：\n- 源数据库\n- 逻辑数据模型\n- 物理数据模型\n- 术语表模型\n- 域模型\n\n\
    现在我们来对比新的物理数据模型与其源数据库：\n1. 在数据项目资源管理器中定位STUDENT_LIFE架构：*大学信息系统 -> 数据模型 -> NEW_SDT_INFO_SYS.dbm\
    \ -> SAMPLE -> STUDENT_LIFE*。\n2. 在数据项目资源管理器中右键单击STUDENT_LIFE架构，选择*对比 -> 另一个数据对象*。将打开“与另一个数据对象对比”向导。\n\
    3. 展开SAMPLE (SAMPLE)数据库，然后选择源数据库的STUDENT_LIFE架构，如图7.4所示。单击“下一步”进入下一个屏幕。将打开“过滤条件”页面。\n\
    4. 选择要对比的特定数据对象：\n   a. 单击*全部取消*按钮，取消选中所有数据对象。\n   b. 在*纳入对比的对象*字段中，选择*列*对象。所有与列相关的对象也会被选中。\n\
    \   c. 选择*索引*对象。\n5. 单击*完成*运行对比。物理数据模型的架构对象将与SAMPLE数据库中的STUDENT_LIFE架构进行对比。将打开“对比”编辑器。“结构对比”窗格可让你浏览数据设计项目架构与源架构之间的差异。数据设计项目架构位于窗格左侧，源架构位于窗格右侧。如图7.5所示。\n\
    ![](img/38311ad87170342fd88ee1165fee68b0_136_0.png)\n图7.4 – 选择源数据库\n![](img/38311ad87170342fd88ee1165fee68b0_137_0.png)\n\
    **图7.5 – 对比架构**\n6. 使用“结构对比”窗格浏览两个架构之间的差异。单击*下一处差异*或*上一处差异*按钮查看架构之间的差异。\n7. 使用“结构对比”视图定位COURSE.INSTRUCTOR_PHONE列，如图7.6所示。注意，“结构对比”视图显示该对象在源架构中不存在。\n\
    ![](img/38311ad87170342fd88ee1165fee68b0_137_1.png)\n**图7.6 – 定位新列**\n\n“属性对比”窗格可让你对比各个数据对象之间的差异。窗格左侧包含数据模型中对象的相关信息，窗格右侧包含源数据库中对象的相关信息（如果该对象存在）。\n\
    \n8. 右键单击INSTRUCTOR_PHONE列，选择*分析左侧影响*。将打开“受影响对象”视图。由于没有其他数据对象引用此列，且不存在依赖关系，因此“受影响对象”视图中不会显示任何影响。\n\
    9. 使用“属性对比”视图指定你要将新列复制到源架构。单击*从左复制到右*按钮。\n10. 使用“结构对比”视图定位STUDENT_PHONE列。\n11.\
    \ 右键单击STUDENT_PHONE列，选择*分析左侧影响*。由于没有其他数据对象引用此列，且不存在其他依赖关系，因此“受影响对象”视图中不会显示任何影响。\n\
    12. 使用“属性对比”视图指定你要将STUDENT_PHONE列复制到源架构。\n13. 定位新的STUDENT_LAST_NAME_IDX索引，然后分析影响并将修改复制到源架构。\n\
    14. 生成DDL以部署你的修改。*生成右侧DDL*按钮可生成将修改部署到数据库所需的DDL。将打开“生成DDL”向导。\n15. 完成“保存并运行DDL”页面：\n\
    \    a. 确保*文件夹*字段中指定的是*大学信息系统*数据设计项目。\n    b. 在*文件名*字段中，指定**DELTA_SDT_CHANGES.sql**。\n\
    \    c. 选中*在服务器上运行DDL*复选框，在服务器上运行DDL脚本并部署你的修改。\n    d. 单击*下一步*。\n16. 在“选择连接”页面，选择SAMPLE数据库连接，然后单击*下一步*。\n\
    17. 查看“摘要”页面上的信息，然后单击*完成*。DDL将在服务器上运行，你的新列和索引将在SAMPLE数据库中创建。查看“SQL结果”视图以确保SQL语句成功运行。在“数据源资源管理器”中刷新数据库，然后验证新列和索引是否存在。其中一个新列如图7.7所示。\n\
    ![](img/38311ad87170342fd88ee1165fee68b0_138_0.png)\n图7.7 – 在数据源资源管理器中查看修改\n"
