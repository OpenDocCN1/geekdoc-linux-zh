    \ 173\n\n# 前言\n在当今世界保持技能与时俱进正变得越来越具有挑战性。新技术层出不穷，却没有足够的时间学习所有技术。DB2® 校园系列丛书旨在缩短学习诸多新技术所需的时间和精力。\n\
    \n## 谁应该阅读本书？\n本书面向所有需要使用 IBM InfoSphere® Data Architect 学习数据建模基础知识的读者，这是一款基于\
    \ Eclipse 的工具，可帮助你为各类数据服务器创建数据模型。通过使用 IBM InfoSphere Data Architect 界面，你可以将数据模型设计和部署到多种环境中，甚至可以将其与其它基于\
    \ Eclipse 的产品集成。\n\n## 本书结构如何？\n本书结构如下：\n- 第1章向你介绍 IBM InfoSphere Data Architect，帮助你快速上手\
    \ InfoSphere Data Architect 工作台（用户界面）。\n- 第2章为你介绍数据建模的基本概念，以及你在完成书中练习时将完成的项目。\n\
    - 第3、4、5章带你走一遍数据建模流程：\n  - 第3章讲授逻辑数据建模的相关知识，展示如何开始创建数据模型。你将学习实体、属性、关系、术语模型和命名规范。\n\
    \  - 第4章帮助你熟悉域模型。尤其是你将学习如何创建独特的数据类型，这类数据类型可帮助你指定哪些数据需要被掩码以保护个人信息隐私。\n  - 第5章为你介绍物理数据建模。在本章中，你将把现有的逻辑数据模型转换为新的物理数据模型，之后可使用该模型生成\
    \ DDL 脚本，用于实际部署数据模型。\n- 第6、7、8、9章带你了解迭代设计流程：\n  - 第6章带你走一遍在 IBM InfoSphere Data\
    \ Architect 中创建报告的流程。你将学习如何起草 BIRT 和 XSLT 报告，与你的大型数据建模团队共享。\n  - 第7章描述工作台中的逆向工程如何运作。你将学习如何从\
    \ DDL 脚本创建物理数据模型，并使用现有数据库连接，以便你可以修改模型并将其部署到服务器上。\n  - *第8章*介绍映射模型，以及映射模型如何帮助你集成不同的数据模型和数据源。\n\
    \  - *第9章*介绍如何分析你的数据模型以确保其有效性，从而保证模型符合通用的最佳实践和设计标准，或在模型部署到服务器后不会引发错误。\n  - *第10章*介绍\
    \ IBM InfoSphere Data Architect 如何与 IBM 更广泛的数据管理功能适配，以及你如何将该产品与其他 IBM 产品集成，以便在整个数据生命周期中进一步设计、开发和管理你的数据模型。\n\
    \n大多数章节都配有练习。每章还设有复习题，帮助你学习内容。\n\n# 社区之书\n本书由社区创作；该社区由大学教授、学生和专业人士（包括 IBM 员工）组成。本书的在线版本免费向社区发布。来自全球各地的众多社区成员参与了本书的开发，本书也将由社区翻译为多种语言。如果你想提供反馈、贡献新内容、改进现有内容，或帮助将本书翻译为其他语言，请将你计划贡献的内容发送电子邮件至\
