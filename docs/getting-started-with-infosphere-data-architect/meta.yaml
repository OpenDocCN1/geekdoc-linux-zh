  - "[PAGE 120]\n\n![](img/38311ad87170342fd88ee1165fee68b0_120_0.png)\n\nFigure 6.14\
    \ – Previewing the formatted report\n\nThis design helps make it easier for your\
    \ team to identify the various objects within your data model. Information is\
    \ conveniently sorted.\n\n# 6.3.6 Generating a report configuration from a template\n\
    \nNow, let's create a report configuration so that you can share your report with\
    \ your team. You can also use this report configuration repeatedly, so as you\
    \ make changes to the model, you can create new reports with minimal effort.\n\
    \nTo generate a report from a BIRT template:\n\n+   1. Open the Navigator view.\n\
    2. Select the report and create the configuration:\n   a. Right-click the **SDT_Info_Sys_custom.rptdesign**\
    \ file and select *Report As* -> *Report Configurations*. The Report Configurations\
    \ window opens.\n   b. Double-click the **BIRT Report** node to create a new report\
    \ configuration.\n   c. In the *Name* field, specify **SDT_Info_Sys_custom**.\n\
    \   d. Select the *Location* radio button, then click the *Workspace* button to\
    \ locate your report design in your workspace. The Select Report window opens.\n\
    \   e. Expand the *University Info System* node, then select the **SDT_Info_Sys_custom.rptdesign**\
    \ template that you just created. Click **OK** to add it to the report configuration.\n\
    \   f. Specify a location for the report output. For example, specify `C:\\Temp\\\
    IDA_Reports\\Student_Info_Sys.html`.\n   g. Click *Apply* to save the configuration.\n\
    3. Click *Report* to run the report configuration and generate a report."
- md: "The physical data model report configuration runs. Since you created an HTML\
    \ report, your default browser opens the physical data model report. The files\
    \ for the report are also saved to the location that you specified. This report\
    \ contains some of the information about your tables and columns. The HTML report\
    \ is shown in Figure 6.15.\n\n![](img/38311ad87170342fd88ee1165fee68b0_121_0.png)\n\
    \n**Figure 6.15** – The report displays in your default Web browser\n\nNote that\
    \ the physical data model report does not actually display the data within the\
    \ database. This type of report is useful to analyze the structure of your model\
    \ with other members of your team.\n\n> **Note:** The report configuration is\
    \ saved to your workspace, as well. If the design of your model changes, simply\
    \ run the report configuration by clicking **Run -> Report -> Report Configurations**,\
    \ and select the report configuration that you want to run.\n\n## 6.4 Generating\
    \ XSLT reports\n\nLet's produce one more report that contains all of the information\
    \ about the logical data model that you have already created. This report will\
    \ gather all of the information about the logical data model so that you can present\
    \ detailed information to your team.\n\nTo create an XSLT report:\n\n- 1. Switch\
    \ to the Data perspective by clicking Window -> Open Perspective -> Other. The\
    \ Open Perspective window opens. Select the Data perspective.\n- 2. From the main\
    \ menu, click Run -> Report -> Report Configurations. The Report Configurations\
    \ window opens.\n- 3. Double-click the *Data Model Classic XSLT Report* option\
    \ to create a new XSLT report configuration.\n- 4. Specify the following options\
    \ for the new configuration:\n  a. In the *Name* field, specify `SDT_Info_Sys_XSLT`.\n\
    \  b. In the report input *Location* field, click *Browse* and select the `STUDENT_INFO_SYSTEM.ldm`\
    \ logical data model.\n  c. In the report input *Element* field, click *Browse*\
    \ and select the *STUDENT INFO SYSTEM* package.\n  d. Select the *Built-in* radio\
    \ button in the *Report* section, then click *Browse*. The Select Built-In Report\
    \ window opens.\n  e. Expand the *Logical Data Model (Classic XSLT Reports)* node,\
    \ then select *Classic Sample Logical Model Report*. Click *OK* to add the report\
    \ type to the configuration.\n  f. In the report output *Location* field, specify\
    \ a file path and name. For example, specify `C:\\Temp\\IDA_Reports\\SDT_Info_Sys_XSLT.pdf`.\n\
    - 5. Click *Apply* to save the configuration.\n- 6. Click *Report* to run the\
    \ configuration. The report runs. After the report is generated, it opens. The\
    \ report contains all of the information about the logical data model and describes\
    \ all of the properties of your data objects. The diagram that you have created\
    \ with IBM InfoSphere Data Architect is also included in the report, making it\
    \ easy for non-technical members of your team to understand the relationships\
    \ between the data objects.\n\n## 6.5 Importing and exporting with IBM InfoSphere\
    \ Data Architect\n\nThe import and export capabilities of IBM InfoSphere Data\
    \ Architect allow you to import and export data models from IBM InfoSphere Data\
    \ Architect to and from other modeling tools, such as IBM Cognos Framework Manager,\
    \ IBM Rational Rose, or IBM Rational Software Architect. When you import or export\
    \ data models in and out of IBM InfoSphere Data Architect, the metadata from the\
    \ data models is converted to a format that can be understood by the other modeling\
    \ tools.\n\n## 6.5.1 Exporting with the workbench\n\nLet's use IBM InfoSphere\
    \ Data Architect to export a logical data model to an XML file, so that when the\
    \ data model is populated with information, business process owners can import\
    \ the XML model file into tools that can use it to generate reports.\n\nTo export\
    \ the data model:\n\n- 1. From the main menu, click *File* -> *Export*. The Export\
    \ wizard opens.\n- 2. Expand the *Data* node and select *Data Model Export Wizard*,\
    \ then click *Next*.\n- 3. Complete the Select the Model page of the wizard:\n\
    \  a. In the *Model format* field, specify *W3C XML Schema 1.0 (XSD)*.\n  b. Click\
    \ *Browse* next to the *Model* field, and select the `STUDENT_INFO_SYSTEM.ldm`\
    \ logical data model file.\n  c. Click *Browse* next to the *Export to* field,\
    \ and then specify that the exported data model should be saved to your data design\
    \ project as **SDT_Info_Sys_Exp.xml**. An example of this is shown in *Figure\
    \ 6.16*.\n\n  ![](img/38311ad87170342fd88ee1165fee68b0_123_0.png)\n\n  *Figure\
    \ 6.16 – Exporting the data model and saving it to your project*\n\n  d. Click\
    \ *Next*.\n- 4. On the Select the Options page, click *Next*. The data model is\
    \ exported.\n- 5. Click *Finish* to save the exported data model and exit the\
    \ Data Model Export wizard.\n\nThe exported model can be found in your data design\
    \ project, under the *XML Schemas* folder.\n\n> **Note**: Since you are exporting\
    \ to an XML file, the diagram included with this model is not exported.\n\n##\
    \ 6.5.2 Importing a data model with the workbench\n\nAlthough the exported model\
    \ is already in your workbench, let's practice importing models. IBM InfoSphere\
    \ Data Architect can read information from a number of other data modeling tools,\
    \ making it easy for you to further refine and improve your data models with the\
    \ workbench.\n\nLet's import the data model into the workbench:\n\n- 1. From the\
    \ main menu, click *File -> Import*. The Import wizard opens.\n- 2. Expand the\
    \ *Data* node and select *Data Model Import Wizard*, then click *Next*.\n- 3.\
    \ Complete the Select the Model page:\n  a. In the *Model Format* field, select\
    \ *W3C XML Schema 1.0 (XSD)*.\n  b. Click the *Browse* button next to the *Model*\
    \ field, then select the `SDT_Info_Sys_Exp.xml` file.\n  c. Click the *Browse*\
    \ button next to the *Target project* field, then select the *University Info\
    \ System* data design project.\n  d. In the *Model type* field, select *Logical\
    \ only*. This will generate a logical data model file, which you can revise and\
    \ then transform into a physical data model.\n  e. In the *File name* field, specify\
    \ `SDT_Info_Sys_Imp`.\n  f. Click *Next*.\n- 4. On the Select the Options page,\
    \ click *Next*. The data model is transformed and imported into the data design\
    \ project.\n- 5. Click *Finish* to exit the Data Model Import wizard.\n\nThe model\
    \ is located in your *Data Models* folder. When you expand the logical data model,\
    \ you can see that your data model is complete.\n\n## 6.6 Exercise\n\nCreate a\
    \ customize template, `SDT_Info_Sys_Diag.rptdesign`, which will capture the diagram\
    \ in the `STUDENT_INFO_SYSTEM.ldm` logical data model, including information about\
    \ the entities in the diagram. Copy and modify a *Blank Diagram Report* to draft\
    \ this report.\n\n- 1. Insert a table with 1 column and 2 detail rows, and specify\
    \ a diagram as the data set.\n- 2. In the first detail row, insert an image of\
    \ the diagram, and specify that you want to insert a *dynamic image*. Click the\
    \ *Select Image Data* button to specify the data set binding for the row.\n- 3.\
    \ Click the *Add* button to add a new data binding that will let you add an image\
    \ to the report. Specify the best data type to use for this row, in this case,\
    \ *Blob*, then click the button next to the *Expression* field to open the Expression\
    \ Builder window.\n- 4. Use the Expression Builder window to specify the following\
    \ expression for the data set row:\n```dataSetRow[\"Image\"]```\n- 5. Once you've\
    \ added the expression, select the check box next to the Column Binding data set,\
    \ then click *OK*, then *Insert* the image in the table.\n- 6. Nest (insert) a\
    \ table in the second detail row, with 1 column and 2 detail rows and no data\
    \ set.\n- 7. In the new table, insert a grid with 2 rows and 1 column in the first\
    \ detail row.\n- 8. Insert a label, **Entity**, in the left column of the grid.\n\
    - 9. Use the Data Explorer to insert a *Entity -> Name* object in the right column\
    \ of the grid.\n- 10. Switch back to the Data perspective, then create a report\
    \ configuration for the report template. Make sure that the data source of the\
    \ template points to the **STUDENT_INFO_SYSTEM.ldm** logical data model file,\
    \ so that the diagram within the logical data model can be pulled into the report.\
    \ Specify that you want a PDF output, then run the report. The report should look\
    \ like the image in *Figure 6.17*.\n\n![](img/38311ad87170342fd88ee1165fee68b0_125_0.png)\n\
    \n**Figure 6.17** – Completed diagram report\n\n## 6.7 Summary\n\nIn this chapter,\
    \ you learned the fundamental concepts of creating reports for data models in\
    \ IBM InfoSphere Data Architect. You learned how to generate different types of\
    \ reports using various built-in templates available in the workbench. You also\
    \ learned how to import and export data models within IBM InfoSphere Data Architect.\
    \ This feature helps you to convert different data models, so that they can be\
    \ imported from or used with other tools.\n\n## 6.8 Review questions\n\n- 1. Which\
    \ BIRT report output format is not supported in the workbench? A. HTML"
  mdcn: "\n物理数据模型报表配置开始运行。由于你创建的是HTML报表，系统会用默认浏览器打开该物理数据模型报表，报表文件也会保存到你指定的位置。\n该报表包含你部分表和列的相关信息。图6.15展示了该HTML报表。\n\
    ![](img/38311ad87170342fd88ee1165fee68b0_121_0.png)\n**图6.15** – 报表在默认Web浏览器中显示\n\
    请注意，物理数据模型报表不会实际展示数据库内的数据，该类报表可用于和团队成员一起分析你的模型结构。\n> **注意：** 报表配置也会保存到你的工作区中。如果你的模型设计发生变更，只需点击**运行\
    \ -> 报表 -> 报表配置**，运行报表配置并选择你想要运行的配置即可。\n\n## 6.4 生成XSLT报表\n现在我们来生成另一份报表，该报表会包含你已创建的所有逻辑数据模型的相关信息，它会汇总所有逻辑数据模型的资料，方便你向团队展示详细信息。\n\
    创建XSLT报表的步骤如下：\n- 1. 点击「窗口 -> 打开透视图 -> 其他」切换到数据透视图，“打开透视图”窗口会弹出，选择数据透视图即可。\n-\
    \ 2. 点击主菜单中的「运行 -> 报表 -> 报表配置」，“报表配置”窗口会弹出。\n- 3. 双击*经典XSLT数据模型报表*选项，即可创建新的XSLT报表配置。\n\
    - 4. 为新配置指定以下选项：\n  a. 在「*名称*」字段中，输入`SDT_Info_Sys_XSLT`。\n  b. 在报表输入的「*位置*」字段中，点击「*浏览*」，选择`STUDENT_INFO_SYSTEM.ldm`逻辑数据模型。\n\
    \  c. 在报表输入的「*元素*」字段中，点击「*浏览*」，选择*学生信息管理系统*数据包。\n  d. 在「*报表*」区域选中「*内置*」单选按钮，然后点击「*浏览*」，“选择内置报表”窗口会弹出。\n\
    \  e. 展开*逻辑数据模型（经典XSLT报表）*节点，选择*经典示例逻辑模型报表*，点击「*确定*」将报表类型添加到配置中。\n  f. 在报表输出的「*位置*」字段中指定文件路径和名称，例如指定`C:\\\
    Temp\\IDA_Reports\\SDT_Info_Sys_XSLT.pdf`。\n- 5. 点击「*应用*」保存配置。\n- 6. 点击「*报表*」运行配置，报表开始生成，生成完成后会自动打开。\n\
    该报表包含所有逻辑数据模型的相关信息，并会描述你所有数据对象的属性，用IBM InfoSphere Data Architect创建的图表也会包含在报表中，方便团队中的非技术人员理解数据对象间的关联。\n\
    \n## 6.5 使用IBM InfoSphere Data Architect导入和导出\nIBM InfoSphere Data Architect的导入导出功能支持你将该工具中的数据模型与其他建模工具（如IBM\
    \ Cognos Framework Manager、IBM Rational Rose或IBM Rational Software Architect）进行互导。在向IBM\
    \ InfoSphere Data Architect导入或导出数据模型时，数据模型的元数据会被转换为其他建模工具可识别的格式。\n\n## 6.5.1 使用工作台导出\n\
    现在我们来使用IBM InfoSphere Data Architect将逻辑数据模型导出为XML文件，这样当数据模型填充完信息后，业务负责人可以将该XML模型文件导入到可用来生成报表的工具中。\n\
    导出数据模型的步骤如下：\n- 1. 点击主菜单中的「*文件 -> 导出*」，“导出向导”窗口会弹出。\n- 2. 展开「*数据*」节点，选择「*数据模型导出向导*」，然后点击「*下一步*」。\n\
    - 3. 完成向导中的“选择模型”页面：\n  a. 在「*模型格式*」字段中选择「*W3C XML Schema 1.0 (XSD)*」。\n  b. 点击「*模型*」字段旁的「*浏览*」，选择`STUDENT_INFO_SYSTEM.ldm`逻辑数据模型文件。\n\
    \  c. 点击「*导出到*」字段旁的「*浏览*」，将导出的数据模型指定保存到你的数据设计项目中，命名为**SDT_Info_Sys_Exp.xml**，该操作的示例如*图6.16*所示。\n\
    \  ![](img/38311ad87170342fd88ee1165fee68b0_123_0.png)\n  *图6.16 – 导出数据模型并保存到你的项目中*\n\
    \  d. 点击「*下一步*」。\n- 4. 在“选择选项”页面中点击「*下一步*」，数据模型就会被导出。\n- 5. 点击「*完成*」保存导出的数据模型并退出数据模型导出向导，你可以在数据设计项目的「*XML架构*」文件夹下找到导出的模型。\n\
    > **注意**：由于你导出的是XML文件，因此模型中包含的图表不会被导出。\n\n## 6.5.2 使用工作台导入数据模型\n虽然导出的模型已经存在于你的工作台中，但让我们练习一下导入模型的操作。IBM\
    \ InfoSphere Data Architect可以读取多个其他数据建模工具的信息，方便你使用工作台进一步细化和完善数据模型。\n现在我们将数据模型导入工作台，步骤如下：\n\
    - 1. 点击主菜单中的「*文件 -> 导入*」，“导入向导”窗口会弹出。\n- 2. 展开「*数据*」节点，选择「*数据模型导入向导*」，然后点击「*下一步*」。\n\
    - 3. 完成“选择模型”页面：\n  a. 在「*模型格式*」字段中选择「*W3C XML Schema 1.0 (XSD)*」。\n  b. 点击「*模型*」字段旁的「*浏览*」按钮，选择`SDT_Info_Sys_Exp.xml`文件。\n\
    \  c. 点击「*目标项目*」字段旁的「*浏览*」按钮，选择*高校信息系统*数据设计项目。\n  d. 在「*模型类型*」字段中选择「*仅逻辑模型*」，该操作会生成一个逻辑数据模型文件，你可以修改该文件，之后再将其转换为物理数据模型。\n\
    \  e. 在「*文件名*」字段中指定`SDT_Info_Sys_Imp`。\n  f. 点击「*下一步*」。\n- 4. 在“选择选项”页面中点击「*下一步*」，数据模型会被转换并导入到数据设计项目中。\n\
    - 5. 点击「*完成*」退出数据模型导入向导，模型会存放在你的「*数据模型*」文件夹中，展开逻辑数据模型后即可看到你的数据模型已完整导入。\n\n## 6.6\
    \ 练习\n请创建一个自定义模板`SDT_Info_Sys_Diag.rptdesign`，该模板可以提取`STUDENT_INFO_SYSTEM.ldm`逻辑数据模型中的图表，包括图表中实体的相关信息。你可以复制并修改「*空白图表报表*」来草拟该报表。\n\
    - 1. 插入1列、2个详细行的表格，并将图表指定为数据集。\n- 2. 在第一个详细行中插入图表图片，并指定插入「*动态图片*」，点击「*选择图片数据*」按钮为该行指定数据集绑定。\n\
    - 3. 点击「*添加*」按钮添加新的数据绑定，以便将图片添加到报表中，为该行指定最合适的数据类型，此处选择「*Blob（二进制大对象）*」，然后点击「*表达式*」字段旁的按钮打开表达式构建器窗口。\n\
    - 4. 在表达式构建器窗口中为数据集行指定以下表达式：\n```dataSetRow[\"Image\"]```\n- 5. 添加完表达式后，选中列绑定数据集旁的复选框，点击「*确定*」，然后在表格中「*插入*」图片。\n\
    - 6. 在第二个详细行中嵌套（插入）1列、2个详细行且无数据集的表格。\n- 7. 在新表格的第一个详细行中插入2行1列的网格。\n- 8. 在网格的左列插入标签「**实体**」。\n\
    - 9. 使用数据资源管理器在网格的右列插入*实体 -> 名称*对象。\n- 10. 切换回数据透视图，为报表模板创建报表配置，确保模板的数据源指向**STUDENT_INFO_SYSTEM.ldm**逻辑数据模型文件，以便将逻辑数据模型中的图表提取到报表中，指定PDF输出格式后运行报表，报表效果应如*图6.17*所示。\n\
    \  ![](img/38311ad87170342fd88ee1165fee68b0_125_0.png)\n  **图6.17** – 完成的图表报表\n\
    \n## 6.7 小结\n本章你学习了在IBM InfoSphere Data Architect中创建数据模型报表的基本概念，掌握了如何使用工作台中的各类内置模板生成不同类型的报表，还学习了如何在IBM\
    \ InfoSphere Data Architect中导入导出数据模型，该功能可将不同数据模型进行格式转换，以便被其他工具导入或兼容使用。\n\n## 6.8\
    \ 复习题\n- 1. 工作台不支持以下哪种BIRT报表输出格式？\n  A. HTML\n"
