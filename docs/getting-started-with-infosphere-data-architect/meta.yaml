    # ### 1.7.2 Touring the Data Perspective and its views


    Because most of the work you''ll do in this book is in the Data perspective, make
    sure the Data perspective is open.


    As we described earlier, *views* are the windows that you see in the workbench,
    such as Data Source Explorer and Properties. A view is typically used to navigate
    a hierarchy of information, open an editor, or display properties for the active
    editor. The changes that you make to the views (their sizes and positions), and
    the resources that you create in the views are saved in your workspace, as we
    mentioned previously.


