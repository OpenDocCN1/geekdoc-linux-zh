  md: "# 8.1.2 Further managing naming standards with mapping models\n\nYou can use\
    \ a glossary or naming model to discover relationships between source and target\
    \ schemas. You learned about glossary models in Chapter 3 of this book. The naming\
    \ rules that you defined earlier in the data design process can be used to identify\
    \ the relationships between different schemas.\n\n> **Note:**\n\nYou will not\
    \ perform the steps outlined in this section. They are provided for reference\
    \ only.\n\nYou already created a glossary model to track the names of entities,\
    \ tables, and other data objects in your data models. You could use this glossary\
    \ model to ensure that all data models conform to the naming standards that you\
    \ have defined for your organization. If the mapping model discovery cannot correctly\
    \ determine which objects should be mapped, then perhaps some of these objects\
    \ are out of compliance.\n\nTo determine if models are in compliance with naming\
    \ standards with a mapping model:\n\n+   1. Open the Enterprise Naming Standard\
    \ window to attach a naming model to the mapping model:\n   a. Open the mapping\
    \ editor by opening an existing mapping model.\n   b. Right-click in the mapping\
    \ editor.\n   c. Select *Discover Relationships -> Enterprise Naming Standard*.\
    \ The window opens.\n2. Select the schema to which you want to attach a naming\
    \ standard.\n3. Click the *Add* button next to the *Naming model list* pane. The\
    \ Select Naming Model Files window opens.\n4. Select a glossary model (with the\
    \ file extension of *.ndm*) and click OK.\n5. Repeat the steps above for any remaining\
    \ schemas, then click *Finish*.\n6. Discover the relationships based on the best\
    \ fit:\n   a. Right-click in the mapping editor and select *Discover Relationships\
    \ -> Find Best Fit*. The Discover Relationships window opens.\n   b. Select the\
    \ schemas for which you want to discover the relationships, then click *Finish*.\n\
    \nThe models are analyzed, and the workbench determines which data objects should\
    \ be related in the mapping model.\n\n7. Approve or reject the mappings.\n8. Create\
    \ new mappings if necessary.\n9. Save your work."
