    ## 第4章 – 领域模型

    ![](img/38311ad87170342fd88ee1165fee68b0_76_0.png)

    在本章中，你将学习如何创建领域模型。*领域模型*描述特定组织独有的领域数据类型及其约束。你可以将领域模型作为逻辑数据模型的一部分，也可以创建独立的领域模型，在项目的所有逻辑和物理数据模型中复用。接下来你需要创建一个领域模型，用于对测试环境中需要保护的信息进行建模——具体来说，你要保护每位学生的社会安全号、姓氏和电子邮件地址。测试系统会填充真实数据，而你指定的隐私规则将确保敏感信息仍然受到保护。之后，你会将这个领域模型与逻辑数据模型中的数据对象进行关联。

    > **注意：** 你在InfoSphere Data Architect中创建的领域模型可以与Optim Data Privacy Solution系列产品共享。要了解有关Optim
    Data Privacy Solutions的更多信息，请访问此网址：http://www-01.ibm.com/software/data/optim/protect-data-privacy/


    ### 4.1 领域模型

    领域模型描述组织允许的领域数据类型及其约束。你可以在领域模型内创建特定于组织的数据类型（即描述特定领域各个方面的数据类型）。使用领域数据类型而非基础数据类型可以确保组织内部的一致性，还能复用通用的数据类型定义，提升团队效率。领域数据类型可以存储在领域模型中，也可以作为逻辑数据模型的一部分。你可以将领域数据模型与数据设计项目关联，这样所有逻辑和物理数据模型都可以使用这些领域数据类型。使用原子领域而非基础数据类型可以确保团队成员之间的一致性。


    InfoSphere Data Architect 入门 领域模型由一组领域数据类型组成。领域数据类型代表基础数据类型，可通过添加约束进行限制。你可以使用领域模型为逻辑或物理数据模型中的属性或列定义领域数据类型。领域数据类型基于基础数据类型。例如，你可以为性别、成绩等常见描述符定义领域数据类型。

    IBM InfoSphere Data Architect可用于创建领域模型和原子领域。这些模型可以在所有参与建模任务的团队成员之间共享。IBM InfoSphere
    Data Architect提供了可帮助你创建和管理领域模型的工具。你可以通过向导创建领域模型，既可以使用现有模板，也可以从零开始创建。使用“数据项目浏览器”添加领域对象，然后使用“属性”视图修改它们。以下列表详述了领域的一些最佳实践：

    - 将所有领域归入一个或多个领域模型，以便这些领域可在未来项目中复用。

    - 创建独立的企业标准项目，包含整个组织普遍共享的术语表或领域模型。

    - 在特定项目中为遗留模型创建领域模型，如果遗留模型中的领域不符合新的企业标准，且是在任何企业领域创建之前就存在的，就可以这么做。

    - 为领域模型指定有意义的名称。你可以在模型名称中加入“领域”字样，以便在“数据项目浏览器”视图中轻松识别领域模型。

    - 创建子包（根领域包下的独立领域包），对特定业务主题领域内的领域进行逻辑分组。


    现在你已经创建了基础逻辑数据模型，还被要求在逻辑数据模型中存储敏感信息，包括社会安全号和电子邮件地址。在扩展逻辑数据模型以纳入这些信息之前，你决定先创建一个领域模型来保护这些敏感信息。之后，你将在STUDENT实体中创建新属性，并使用领域模型数据类型定义这些属性。

    首先，我们先定义一个用于保护个人身份信息的领域模型。该领域模型将帮助你确保学生的个人信息受到保护。


    ### 4.1.1 创建空白领域模型

    我们来创建STUDENT_PII_DOMAIN领域模型：

    1. 在“数据项目浏览器”中右键单击“数据模型”文件夹，然后选择“新建”->“领域模型”。“新建领域模型”窗口随即打开。

    2. 为领域模型指定*文件名*：**STUDENT_PII_DOMAIN**。

    3. 确保已选中*添加到项目属性*选项，然后单击*完成*。**STUDENT_PII_DOMAIN.ddm**领域模型将在数据设计项目的*数据模型*文件夹中创建。

    4. 指定领域模型根包的名称：

    a. 如*图4.1*所示，选择STUDENT_PII_DOMAIN领域模型下方的包。

    ![](img/38311ad87170342fd88ee1165fee68b0_78_0.png)

    **图4.1** – 选择STUDENT_PII_DOMAIN领域模型

    该包的属性将显示在“属性”视图中。

    b. 在*名称*字段中输入以下名称：**STUDENT_PII_ROOT**

    5. 保存工作。领域模型和包已创建，并显示在“数据项目浏览器”中。


    现在你已经创建了空白领域模型，接下来可以添加原子领域、列表领域或联合领域。本次练习中，你将添加原子领域来保护每位学生的社会安全号。


    ### 4.1.2 原子领域

    *原子领域*是你创建的用于确保组织内部一致性的自定义数据类型。你先创建领域特定的规则，再使用这些规则定义数据模型中的其他对象。例如，你可以为成绩定义领域模型，确保不会输入超出合适范围的数值，比如10分制下只接受1到10的分数。你还可以创建领域模型来指定数据何时属于私有且需要掩码处理，例如学生或教师标识符。默认情况下不强制实施数据掩码，但为确保敏感数据元素的隐私，你应该强制实施数据隐私保护。

    使用原子领域时，你通常需要为四个区域指定隐私规则：

    - 分类：在测试环境中，该数据应如何分类？是个人身份信息还是机密信息？

    - 强制实施：在测试环境中，该原子领域的隐私保护是必需、非必需，还是仅作为最佳实践？

    - 隐私策略类型：在测试环境中，你想对哪些类型的信息进行掩码处理？

    - 隐私策略：测试系统应使用哪种类型的掩码？


    ### 4.1.2.1 创建原子领域

    你决定应先保护学生的社会安全号。为此，你将创建新的原子领域**SSN**，该领域将显示随机社会安全号以掩码处理这段敏感信息。该原子领域会在数据设计项目中创建唯一的数据类型，你可以在项目中的各种模型里使用该特殊数据类型。可在整个设计过程中使用该领域模型定义应用于该模型中存储的学生信息的策略，这将帮助你确保所有数据模型的一致性。

    我们来创建SSN和STUDENT_ID原子领域：

    1. 右键单击STUDENT_PII_ROOT包，然后选择*添加数据对象*->*原子领域*。新的原子领域对象将在根领域包下的“数据项目浏览器”中创建。

    2. 将原子领域对象命名为**SSN**。

    3. 在“属性”视图的*常规*选项卡中定义SSN原子领域对象的基础数据类型。由于社会安全号包含数字和连字符，因此应将基础数据类型指定为CHAR(11)。

    4. 指定该原子领域数据类型的隐私属性：

