    \n**Figure 3.13 – Selecting a glossary model**\n\nThe glossary model is referenced\
    \ by the data design project.\n\n### **3.3.1 Best practices for naming standards\
    \ and glossary models**\n\nHere are some best practices you can keep in mind when\
    \ designing your naming standards:\n- Choose the singular form of the word for\
    \ entity names.\n- Do not use numbers for the first character of an entity name.\n\
    - Choose short, unambiguous names, and try to use no more than one or two words.\n\
    \nWhen creating glossary models, consider the following best practices:\n- Create\
    \ a separate enterprise standard project that contains any glossary or domain\
    \ model that should be shared throughout the organization. You will learn more\
    \ about domain models in Chapter 4.\n- Create a glossary model within a specific\
    \ project for legacy models that might have terminology that was created before\
