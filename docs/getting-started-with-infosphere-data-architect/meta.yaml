- md: "**Note:** If you don't know what data type to choose, keep in mind the following\
    \ considerations:\n- If an attribute or column is designed for arithmetic calculations,\
    \ use a numeric data type.\n- Use text data types for all other attributes for\
    \ the following reasons:\n  - Text data types are more flexible; for example,\
    \ you can use constraints to reduce storage size of data.\n  - You can better\
    \ control the input of text data types because DB2 offers more functions for string\
    \ data types.\nHowever, sometimes you should use a numeric data type if you want\
    \ the primary key to also be numeric (for example, surrogate keys are also numeric).\n\
    \nNote that when you add attributes to the entity, the diagram is also updated.\
