    \n## Chapter 5 – Physical Data Modeling\nIn this chapter, you will learn about\
    \ *physical data models* and how they differ from logical data models. You will\
    \ also learn how to transform a logical data model into a physical data model.\
    \ By the end of the chapter, you will learn how to create and use a physical data\
    \ model to create database-specific DDL statements that can turn your data modeling\
    \ exercises into a functional schema.\n\n### **5.1 Physical data modeling: The\
    \ big picture**\nPhysical data models are data models that are specific to a database,\
    \ and they are based on database specifications. With a physical data model, you\
    \ can model storage that includes partitions, table spaces, or indexes, in addition\
    \ to other storage objects. You can model data by making use of specific properties\
    \ available within a specific database and database platform. For example, physical\
    \ data models will vary depending on whether they are modeled for DB2 systems,\
    \ Oracle systems, or SQL Server systems. IBM InfoSphere Data Architect supports\
    \ many different database system types and versions, and you can use a physical\
    \ data model to create the database-specific data objects for these systems.\n\
    \n> **Note:** InfoSphere Data Architect only supports storage modeling for DB2\
    \ for Linux, UNIX, and Windows, DB2 for z/OS®, and DB2 for i5/OS® databases. You\
    \ can still create tables, columns, and other related objects within the workbench,\
    \ but data objects from other database vendors, such as table spaces and buffer\
    \ pools, are not supported. For this book, you will be working with models that\
    \ are designed for a DB2 system.\n\nTypically, when you work with a physical data\
    \ model, you use the following task flow:\n1. Create a physical data model, either\
    \ from scratch, template, transforming from a logical data model, or importing\
    \ from another system.\n2. Refine the physical data model by adding storage objects,\
    \ indexes, and views.\n3. Generate the DDL to deploy the database and/or schema.\n\
    4. Run the DDL script that creates the data objects on the server.\n\nSo you might\
    \ be asking yourself, \"What are the differences between a logical and physical\
    \ data model?\" Table 5.1 summarizes the differences.\n\n**Table 5.1 – Differences\
    \ between logical and physical data models**\n| Logical data models | Physical\
    \ data models |\n| --- | --- |\n| Do not correspond to any database vendor | Always\
    \ correspond to a database vendor and database version |\n| Based on a higher\
    \ level of abstraction; more generic | More specific; closer to the design of\
    \ an actual database |\n| Physical storage is not taken into account | Used to\
    \ model physical storage for supported database vendors |\n| Does not require\
    \ database vendor construction knowledge; requires to know how the model will\
    \ be used | Requires knowledge about database vendors and how models are constructed\
    \ for each platform; requires information about how data will be stored |\n\n\
    ### **5.2 Creating a physical data model from scratch**\nIdeally, you would first\
    \ create a logical data model before you create a physical data model. This helps\
    \ you keep the logical and physical designs separate, allowing you to modify data\
    \ models at the logical level before you design the physical storage aspects of\
    \ a database or schema. However, it is possible to create a blank physical data\
    \ model within the workbench.\n\n> **Note:** The steps below are provided for\
    \ reference only. You do not need to perform these steps to continue with the\
    \ design of the student information system. In the next section, you will learn\
    \ how to transform to the physical data model.\n\nTo create a blank physical data\
    \ model:\n1. Click *File -> New -> Physical Data Model*. The New Physical Data\
    \ Model wizard opens.\n2. Complete the wizard. You can create a blank physical\
    \ data model, or you can reverse-engineer an existing database, schema, or DDL\
    \ script. Reverse-engineering is covered in a later chapter.\n3. Use the workbench\
    \ to add data objects, such as tables, schemas, or columns. Right-click on various\
    \ objects within the data model to see which data objects you can add from the\
    \ context menu, or create a diagram to visualize these data objects and their\
    \ relationships.\n\n### **5.3 Transforming a logical data model to a physical\
    \ data model**\nInstead of creating a physical data model from scratch, you will\
    \ use the existing logical data model (`STUDENT_INFO_SYSTEM.1dm`) that you created\
    \ in the previous chapters and transform it to a physical data model. The transformation\
    \ process creates the physical design of a database or schema for you, which saves\
    \ you the work of manually creating tables, columns, and other data objects. After\
    \ you transform from the logical data model, you will add more specific properties\
    \ to the physical data model and bring it one step closer to a functional, deployable\
    \ data model.\n\n> **Note:** The data types that are mapped from one data model\
    \ to another depend on what you have specified in the Preferences window. To ensure\
    \ that data types are mapped correctly between the logical data model and the\
    \ new physical data model:"
