- img_proc: true
  md: 'Relationships within a mapping model are color-coded. The color codes are determined
    by the settings in the Preferences window, in the Mapping Editor page (found under
    the *Data Management* node).


    Note that the relationships you created are in blue or light blue, depending on
    whether the relationship is selected. Within the workbench, these are considered
    to be accepted mappings and are an approved part of the mapping model. Discovered
    mappings are in gold if they are not selected, and they appear to be brown if
    you select them.


    You select mappings to approve or reject them. If you reject a mapping, the mapping
    line disappears from the mapping model.


    First, you will approve a couple of relationships manually. Then, you will inspect
    the remaining relationships and determine whether to accept the mappings.


    To accept or reject discovered relationships:


    +   1. Select the mapping for the STUDENT.LAST_NAME relationship. The mapping
    line changes to a brown color, and the discovered mapping displays in the Properties
    view.


    +   2. Right-click on the mapping and select *Accept Mapping*, as shown in Figure
    8.8.


    ![](img/38311ad87170342fd88ee1165fee68b0_150_0.png)


    The mapping line color changes to blue.


    +   3. Use the method outlined in steps 1 and 2 above to approve the mapping for
    the STUDENT.STUDENT_SSN and STUDENT.EMAIL_ADDR mappings.


    +   4. Save your work.


    At this point, you probably realize that with large data models, this can be a
    tedious process. Now that you are familiar with how to accept or reject mappings
    manually, you can view the remaining mappings and determine whether to accept
    all of the proposed mappings.


    +   5. Expand all of the table nodes in the *Source* and *Target* panes. The editor
    should look like the image in *Figure 8.9*.'
  merge: -1
  pgno: 150
- img_proc: true
  md: '![](img/38311ad87170342fd88ee1165fee68b0_151_0.png)


    +   6. View the mappings and verify that they should be mapped together. In this
    case, you would speak with your extended team at the satellite campus to determine
    what each column is intended to do, and then determine which columns should be
    mapped. Since you reverse-engineered the **NEW_SDT_INFO_SYS.dbm** physical data
    model, you know that the discovered relationships are, in fact, mapped correctly.


    7. Right-click in the mapping editor and select *Accept All Mappings*.


    8. Save your work.


    The color of the mapping lines changes to light-blue, making them a valid part
    of the mapping model.


    # 8.3 Types of mapping


    Five types of mappings can be identified, depending on their properties and how
    they were created. Mappings are represented in the editor by lines that are drawn
    between the source and target nodes. Each mapping line contains a hub in the middle
    of the line.


    The color of the line depends on the type of mapping. Discovered mapping lines
    contain hubs that appear as brackets. All other mapping lines contain square hubs.


    +   - **Mappings:** A mapping connects one or more source columns to a single
    target column or an XML schema document (XSD) simple element or attribute.

    - **Discovered mappings:** These are the mappings proposed from the Discover Relationships
    wizard. You can either accept or reject the individual mapping of each relationship.


    Discovered mapping lines contain hubs that appear as brackets, until you approve
    or reject them. If you approve a discovered mapping, the hub changes to a square.


    +   - **Constant mappings:** These mappings have a target element, but they do
    not have a source element. This can be used to select a transformation function
    like date or time function to assign'
  merge: -1
  pgno: 151
- img_proc: true
  md: 'it to target element. You create constant mappings by right-clicking a target
    element in the *Mapping Group Details* view, then selecting *Create Constant Mapping*
    from the menu.


    +   - **Mapping groups**: Mapping groups sort mapped elements by the target table
    (in a relational database) or by the element (in an XML schema). When you generate
    scripts for these mapping groups, one query is generated per mapping group.


    +   - **Invalid mappings**: The mapping becomes invalid when you change the properties
    of data objects in the source or target model. When the mapping editor is opened,
    all of the mappings are re-validated. If the source or target object is no longer
    valid, then the mapping is invalidated and a red "X" will appear on the mapping
    line.


    # ## 8.4 Adding expressions and filters to the mapping model


    You can create transformation statements for each mapping that is created. The
    expression may be a filter, join, sort, or a transformation function on a source
    column to get the desired target column value. The expression may change either
    the value or data type of the source column to be compatible with the target column.
    These expressions are SQL fragments and appear in the DDL that you generate from
    the mapping model.


    Let''s create a mapping transformation expression to make sure that all of the
    rows in the `STUDENT.FIRST_NAME` column of the `NEW_SDT_INFO_SYS.dbm` physical
    data model appear in uppercase when they are consolidated with the information
    in the `STUDENT_INFO_SYSTEM.dbm` physical data model.


    To create a transformation expression:


    +   1. Select the mapping line between the two `STUDENT.FIRST_NAME` columns. The
    properties of the mapping appear in the Properties view.


    +   2. Click the *Expression Builder* button next to the *Transformation* field.
    The Expression Builder window opens.


    +   3. Select a function. In this case, you will add a function to make sure that
    all first names stored in the database are stored in uppercase characters. Expand
    the *String* node and select the `UCASE(VARCHAR)` – `VARCHAR` function.


    The function appears in the *Transformation expression* pane.


    +   4. Place the cursor between the parentheses, as shown in *Figure 8.10*.'
  merge: -1
  pgno: 152
- img_proc: true
  md: '![](img/38311ad87170342fd88ee1165fee68b0_153_0.png)


    # **Figure 8.10 – Placing the cursor to format the expression**


