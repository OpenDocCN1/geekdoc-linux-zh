    \ Architect 是一款自由格式建模工具，这意味着你可以创建符合业务需求的模型，工作台不会以任何方式限制模型的设计。不过，在设计模型时，你可能会无意中创建违反逻辑或物理数据建模规则/约束的模型，这可能引入错误或不符合常见数据设计最佳实践。为了帮你识别模型的问题，请使用“分析模型”向导。在本章中，你将学习以下概念：\n\
    - 如何分析数据模型\n- 如何修改首选项以影响模型的分析方式\n- 如何在模型分析后处理错误和警告\n### 9.1 分析数据模型：整体概览\n你会在创建数据模型后*分析*它。“分析模型”向导通过两种主要方式验证模型：\n\
    1. **设计建议**：这些是架构师制定的最佳实践建议或设计约束，目的是让模型符合标准。\n2. **语法检查**：语法检查会对属性语法进行验证，同时还会检查实体或表之间是否建立了有效关联。\n\
    理想情况下，你应该在转换或部署数据模型之前先进行分析。这能确保你不会转换或部署无效模型，还可以在这些模型上线并引发潜在问题*之前*，确定存在的（如果有的话）问题。\n\
    ### 9.2 使用工作台分析数据模型\n#### 9.2.1 使用工作台分析逻辑数据模型\n你只能从包节点分析逻辑数据模型。我们以**学生信息系统.ldm**逻辑数据模型为例进行分析，确保其有效。\n\
    分析逻辑数据模型的步骤如下：\n1. 在逻辑数据模型中定位学生信息系统包：*大学信息系统 -> 数据模型 -> 学生信息系统.ldm -> 学生信息系统*。\n\
    2. 右键单击学生信息系统包，选择*分析模型*。此时会打开“分析模型”向导。由于我们选择的是逻辑数据模型包，默认情况下，*逻辑数据模型*节点下的所有规则集都会被选中。“逻辑数据模型”节点下的规则集包含最佳实践、命名标准和通用设计建议。每个规则集通常都包含自己的一套规则。在验证模型时，你可以根据组织的实际需求，自行选择要遵守的规则。命名标准重要吗？你使用域吗？你的数据模型必须完全规范化吗？\n\
    3. 由于你已经验证过命名标准，因此取消选中*命名标准*规则集。\n4. 由于你没有创建维度模型，因此取消选中*维度建模*规则集。\n5. 单击*完成*分析模型。模型分析完成后，你会在“问题”视图中看到两条警告。\n\
    *警告*指明的是最佳实践、数据库限制或组织要求。警告本身不会导致模型无效。警告不要求你在部署前修改数据模型，只是指出可能存在的冲突，这些冲突可能需要你对模型进行设计修改。不过，是否要修改与数据设计最佳实践相关的警告，由你自行决定。在本例中，“问题”视图中的两条警告指出COURSE和STUDENT实体中的COURSE\
    \ ID和STUDENT ID属性不唯一。这些属性是在你创建两个实体之间的关联时添加的，因此你不需要修复这些属性。\n*错误*表示数据模型存在必须修复的问题。错误会在生产环境中引发问题，你应该在将模型转换或部署到生产环境之前修复它们。\n\
    #### 9.2.2 使用工作台分析物理数据模型\n我们以**学生信息系统.dbm**物理数据模型为例进行分析。你可以从数据库或架构节点分析物理数据模型。\n\
    分析物理数据模型的步骤如下：\n1. 在物理数据模型中定位SAMPLE数据库对象：*大学信息系统 -> 数据模型 -> 学生信息系统.dbm -> SAMPLE*。\n\
    2. 右键单击SAMPLE数据库对象，选择*分析模型*。此时会打开“分析模型”向导。由于我们选择的是物理数据模型内的对象，默认情况下，*物理数据模型*类别下的所有规则集都会被选中。与逻辑数据模型分析类似，物理模型分析也包含多个类别，每个类别下有各自的规则，用于检查常见最佳实践、命名标准和设计建议。\n\
    3. 由于我们没有创建维度模型，因此取消选中*维度建模*规则集。\n4. 由于该物理数据模型没有表空间，因此请确保工具不会验证表空间选项：\n   a. 选择*设计建议*节点下的*索引与存储*规则集，“规则”窗格中会显示该规则集的规则。\n\
    \   b. 取消选中*表空间设计检查*和*带表空间的表检查*规则。\n   c. 取消选中*语法检查*节点下的*表空间*规则集。\n5. 取消选中*命名标准*规则集。单击*完成*分析物理数据模型。分析完成后，你会在关于该物理数据模型的结果中看到7条警告和13条信息性消息。如果需要，你可以在“问题”视图中浏览所有问题并修复警告。\n\
    #### 9.2.3 在“问题”视图中修复错误和警告\n如果你想修复“问题”视图中的错误或警告：\n1. 查看完整消息，了解工具提供的设计建议。\n2. 双击消息，导航到受警告影响的数据对象。\n\
    3. 根据“问题”视图中提供的设计建议更新对象。\n> **注意**：你可以通过右键单击“问题”视图中的消息，然后选择*快速修复*，来修复部分消息。\n###\
    \ 9.3 修改模型分析的首选项\n你可以修改分析数据模型时默认选中的类别和规则。如果你执行这些步骤，就不用在“分析模型”向导中反复选择/取消选择你常用的选项，节省时间。\n\
    > **注意**：本节不会实际操作修改这些首选项，但你会学习如何在“首选项”窗口中找到这些选项。\n修改“分析模型”向导的首选项步骤如下：\n1. 从主菜单中单击*窗口*\
    \ -> *首选项*，此时会打开“首选项”窗口。\n2. 展开*模型验证*节点，选择*约束*页面。你可以使用该页面修改验证数据模型时默认选中的类别和规则的设置。例如，如果你没有为逻辑数据模型实施命名标准，可以展开*逻辑数据模型\
    \ -> 设计建议*节点，取消选中*命名标准*类别。\n3. 完成修改后，先单击*应用*，再单击*确定*。下次验证数据模型时，你偏好的类别和规则就会被默认选中。\n\
    ### 9.4 本章总结\n在本章中，你学习了如何分析模型以确保其符合组织标准或标准设计语法规则。你还学习了“问题”视图中的警告和错误，以及如何处理它们。\n\
    ### 9.5 练习\n修改“分析模型”向导的默认首选项。\n1. 首先，在不修改默认设置的情况下分析你现有的物理和逻辑数据模型，记录分析结果。\n2. 然后，使用“首选项”窗口确保物理和逻辑数据模型都不会检查命名标准、表空间或维度建模规则。\n\
    3. 分析你的物理和逻辑数据模型，记录结果，不要修复警告或错误。\n4. 接着，打开“首选项”窗口，恢复模型验证工具的默认设置。\n### 9.6 复习题\n\
    1. 你可以在数据模型的哪个层级调用“分析模型”向导？\n- A. 模型文件\n- B. 图\n- C. 包、数据库或架构\n- D. 实体或表\n2. 分析模型时会进行哪种类型的验证？\n\
    - A. 最佳实践\n- B. 模型语法\n- C. 有效设计\n- D. 以上全部\n3. 警告会指出以下哪些领域的潜在问题：\n- A. 数据库限制和最佳实践\n\
    - B. 组织要求\n"
