- md: "## **7.4.2 Advantages of the compare and merge functions**\nWithout the help\
    \ of IBM InfoSphere Data Architect, comparing and merging updated data models\
    \ is a time-consuming process, since you would have to manually design all of\
    \ the queries. Manually introducing changes can cause many errors, especially\
    \ in databases with large number of existing schemas, tables, and constraints.\
    \ IBM InfoSphere Data Architect accounts for existing constraints and dependencies\
    \ when it carries out the compare and merge process, making it easy for you to\
    \ manage changes to your databases and schemas.\n\n## **7.5 Exercise**\n- 1. Create\
    \ the following DDL script, named **EXERCISE_7_5.sql**:\n```\nCREATE SCHEMA \"\
    EXERCISE\";\nCREATE TABLE \"EXERCISE\".\"TABLE1\" (\n  \"TABLE1_ID\" INTEGER,\n\
    \  \"TABLE1_NAME\" VARCHAR(20),\n  \"TABLE2_ID\" INTEGER);\nCREATE TABLE \"EXERCISE\"\
    .\"TABLE2\" (\n  \"TABLE2_ID\" INTEGER,\n  \"TABLE2_NAME\" VARCHAR(20),\n  \"\
    TABLE3_ID\" INTEGER);\nCREATE TABLE \"EXERCISE\".\"TABLE3\" (\n  \"TABLE3_ID\"\
    \ INTEGER,\n  \"TABLE3_NAME\" VARCHAR(20));\nCREATE UNIQUE INDEX \"TABLE1_ID_INDEX\"\
    \ ON \"EXERCISE\".\"TABLE1\" (\"TABLE1_ID\");\nCREATE UNIQUE INDEX \"TABLE2_ID_INDEX\"\
    \ ON \"EXERCISE\".\"TABLE2\" (\"TABLE2_ID\");\nCREATE UNIQUE INDEX \"TABLE3_ID_INDEX\"\
    \ ON \"EXERCISE\".\"TABLE3\" (\"TABLE3_ID\");\n```\n- 2. Reverse-engineer the\
    \ DDL script and create a new physical data model, **EXERCISE_7_5.dbm**. On the\
    \ Options page of the New Physical Data Model wizard, make sure that you create\
    \ an *overview* diagram and *infer implicit relationships* between the data objects\
    \ of the data model. Document your results.\n- 3. Use the Properties view of the\
    \ EXERCISE diagram to display the key and non-key compartments of the objects\
    \ in the diagram. Use the *Layout* tab to change the layout to a *Hierarchical*\
    \ -> *Top to bottom* layout. The overview diagram of the new physical data model\
    \ should look like the image in *Figure 7.8*.\n\n![](img/38311ad87170342fd88ee1165fee68b0_140_0.png)\n\
    **Figure 7.8 – Viewing the EXERCISE diagram**\n\n## **7.6 Summary**\nWe have seen\
    \ how the process of reverse-engineering helps us in creating a physical data\
    \ model from an existing set of tables and schemas in our database or from a DDL\
    \ script. We have also seen how we can choose the type of database elements which\
    \ we want to incorporate into the reverse engineered model when reverse-engineering\
    \ from a database. We have seen how the compare and merge process can help us\
    \ manage the changes to an existing database without losing any existing data.\n\
    \n## **7.7 Review questions**\n- 1. True or false: To reverse-engineer a DDL script,\
    \ it can only have the .DDL file extension.\n- 2. True or false: When reverse-engineering\
    \ from a DDL script, the workbench allows you to specify the type of database\
    \ elements that you want to reverse-engineer.\n- 3. What are the different types\
    \ of database elements that can be reverse-engineered into a physical data model?\n\
    - 4. True or false: You can only compare and merge changes on a physical data\
    \ model and its ancestor in the database.\n- 5. What types of data models can\
    \ you compare?\n\n## **Chapter 8 – Model Mapping and Discovery**\nInformation\
    \ can come from different data sources, and integration of such data is a common\
    \ requirement in any enterprise. When an existing data source has to be integrated\
    \ with an acquisition data source, understanding the metadata is very crucial.\
    \ Metadata is data about the data; it stores the data type of the data, purpose\
    \ of the data, and other identifying information. Understanding metadata helps\
    \ to visualize how the different data sources are related to each other and creating\
    \ mappings and relationships amongst them. Mapping models help you map this metadata\
    \ among a variety of data sources. IBM InfoSphere Data Architect provides the\
    \ following metadata integration tools:\n- Define relationships and mappings between\
    \ data sources\n- Set transformation rules\n- Discover relationships\n- Generate\
    \ scripts which could be deployed to a database\n\n## **8.1 Mapping models: The\
    \ big picture**\n![](img/38311ad87170342fd88ee1165fee68b0_142_0.png)\n**Figure\
    \ 8.1 – The big picture**\n\nGetting started with InfoSphere Data Architect A\
    \ *mapping model* defines relationships between two different schemas: a source\
    \ schema and a target schema. The mapping model is stored as a mapping specification\
    \ language (MSL) file. The source model can be either a logical data model or\
    \ physical data model. The target model can be a **logical data model**, **physical\
    \ data model**, or an XML schema file (XSD). Mapping models are a part of information\
    \ integration modeling. *Information integration modeling* provides a set of functions\
    \ that can help you manage metadata. To integrate a new data source with existing\
    \ enterprise data, you need to understand how the data in the new source is related\
    \ to data in the existing environment. You can build a process that copies data\
    \ from the new data source into the existing source. By defining mappings and\
    \ relationships, you can manipulate a large set of disparate metadata.\n\n###\
    \ **8.1.1 Managing metadata with mapping models**\nIBM InfoSphere Data Architect\
    \ helps you manage the metadata about your models in the following ways:\n- **Discover\
    \ relationships**: The workbench can help you discover methods that show you how\
    \ one or more source schemas might be related to a target schema. The relationships\
    \ can be based on the metadata or any available data samples.\n- **Map relationships**:\
    \ IBM InfoSphere Data Architect visually maps your source and target data models\
    \ and the relationships that are discovered or manually specified. The mapping\
    \ that you create describes how you can combine and transform data that is represented\
    \ by one or more source models into some form that is appropriate to a target\
    \ model. The results are saved in a mapping model.\n- **Build expressions**: You\
    \ can define criteria, such as functions, join conditions, filter conditions,\
    \ and sort conditions, that you can add to the mapping model. Use these expressions\
    \ in scripts that you deploy.\n- **Generate scripts**: You can generate a script\
    \ from the mapping model that can be used to transform and filter data from mapping\
    \ model-compliant sources to mapping model-compliant targets.\n\nMapping models\
    \ help us integrate different models from various sources by defining relationships\
    \ amongst them. Transformation rules can be added to the relationships and mappings\
    \ created between schemas. A *mapping* is a dependency between two data structures\
    \ that is not implemented in the data source. A mapping model stores the summary\
    \ of these mappings. Assume that this student information system is one that is\
    \ designed to work with multiple campuses. For example, some universities have\
    \ a main campus, and they also make use of smaller, satellite campuses, typically\
    \ within the same geographical area. Assume that the `NEW_SDT_INFO_SYS.dbm` physical\
    \ data model models some of the data from a smaller satellite campus for a major\
    \ university, but you want to seamlessly integrate that information. Since you\
    \ reverse-engineered the physical data model in Chapter 6, you can create a mapping\
    \ model to map some of its metadata to the corresponding objects in the **STUDENT_INFO_SYSTEM.dbm**\
    \ physical data model file.\n\n### **8.1.2 Further managing naming standards with\
    \ mapping models**\nYou can use a glossary or naming model to discover relationships\
    \ between source and target schemas. You learned about glossary models in Chapter\
    \ 3 of this book. The naming rules that you defined earlier in the data design\
    \ process can be used to identify the relationships between different schemas.\n\
    \n> **Note:** You will not perform the steps outlined in this section. They are\
    \ provided for reference only. You already created a glossary model to track the\
    \ names of entities, tables, and other data objects in your data models. You could\
    \ use this glossary model to ensure that all data models conform to the naming\
    \ standards that you have defined for your organization. If the mapping model\
    \ discovery cannot correctly determine which objects should be mapped, then perhaps\
    \ some of these objects are out of compliance.\n\nTo determine if models are in\
    \ compliance with naming standards with a mapping model:\n- 1. Open the Enterprise\
    \ Naming Standard window to attach a naming model to the mapping model:\n  a.\
    \ Open the mapping editor by opening an existing mapping model.\n  b. Right-click\
    \ in the mapping editor.\n  c. Select *Discover Relationships -> Enterprise Naming\
    \ Standard*. The window opens.\n- 2. Select the schema to which you want to attach\
    \ a naming standard.\n- 3. Click the *Add* button next to the *Naming model list*\
    \ pane. The Select Naming Model Files window opens.\n- 4. Select a glossary model\
    \ (with the file extension of *.ndm*) and click OK.\n- 5. Repeat the steps above\
    \ for any remaining schemas, then click *Finish*.\n- 6. Discover the relationships\
    \ based on the best fit:\n  a. Right-click in the mapping editor and select *Discover\
    \ Relationships -> Find Best Fit*. The Discover Relationships window opens.\n\
    \  b. Select the schemas for which you want to discover the relationships, then\
    \ click *Finish*. The models are analyzed, and the workbench determines which\
    \ data objects should be related in the mapping model.\n- 7. Approve or reject\
    \ the mappings.\n- 8. Create new mappings if necessary.\n- 9. Save your work."
  mdcn: "\n## **7.4.2 比较与合并功能的优势**\n在没有 IBM InfoSphere Data Architect 的帮助下，比较和合并更新的数据模型是一项耗时的流程，因为你必须手动设计所有查询语句。手动引入变更可能会引发大量错误，尤其在现有架构、表和约束数量众多的数据库中。IBM\
    \ InfoSphere Data Architect 在执行比较与合并流程时，会考虑现有的约束和依赖关系，让你能够轻松管理数据库和架构的变更。\n## **7.5\
    \ 练习**\n- 1. 创建以下名为 **EXERCISE_7_5.sql** 的DDL脚本：\n```sql\nCREATE SCHEMA \"EXERCISE\"\
    ;\nCREATE TABLE \"EXERCISE\".\"TABLE1\" (\n  \"TABLE1_ID\" INTEGER,\n  \"TABLE1_NAME\"\
    \ VARCHAR(20),\n  \"TABLE2_ID\" INTEGER\n);\nCREATE TABLE \"EXERCISE\".\"TABLE2\"\
    \ (\n  \"TABLE2_ID\" INTEGER,\n  \"TABLE2_NAME\" VARCHAR(20),\n  \"TABLE3_ID\"\
    \ INTEGER\n);\nCREATE TABLE \"EXERCISE\".\"TABLE3\" (\n  \"TABLE3_ID\" INTEGER,\n\
    \  \"TABLE3_NAME\" VARCHAR(20)\n);\nCREATE UNIQUE INDEX \"TABLE1_ID_INDEX\" ON\
    \ \"EXERCISE\".\"TABLE1\" (\"TABLE1_ID\");\nCREATE UNIQUE INDEX \"TABLE2_ID_INDEX\"\
    \ ON \"EXERCISE\".\"TABLE2\" (\"TABLE2_ID\");\nCREATE UNIQUE INDEX \"TABLE3_ID_INDEX\"\
    \ ON \"EXERCISE\".\"TABLE3\" (\"TABLE3_ID\");\n```\n- 2. 对DDL脚本进行反向工程，创建一个新的物理数据模型\
    \ **EXERCISE_7_5.dbm**。在新建物理数据模型向导的“选项”页面中，请确保你创建了数据模型对象之间的*概览*图，并*推断隐式关系*。记录你的结果。\n\
    - 3. 使用EXERCISE图的“属性”视图，显示图中对象的键和非键分区。使用*布局*选项卡将布局更改为*层次结构* -> *自上而下*布局。新物理数据模型的概览图应与*图7.8*中的图像一致。\n\
    ![](img/38311ad87170342fd88ee1165fee68b0_140_0.png)\n**图7.8 – 查看EXERCISE图**\n\
    ## **7.6 小结**\n我们已经了解到反向工程流程如何帮助我们基于数据库中现有的表和架构，或DDL脚本创建物理数据模型。我们还了解了从数据库进行反向工程时，如何选择要纳入反向工程模型的数据库元素类型。我们已经了解到比较与合并流程如何帮助我们管理现有数据库的变更，且不会丢失任何现有数据。\n\
    ## **7.7 复习题**\n- 1. 判断正误：对DDL脚本进行反向工程时，该脚本的文件扩展名只能是.DDL。\n- 2. 判断正误：从DDL脚本进行反向工程时，工作台允许你指定要进行反向工程的数据库元素类型。\n\
    - 3. 哪些不同类型的数据库元素可以反向工程为物理数据模型？\n- 4. 判断正误：你只能在物理数据模型及其在数据库中的祖先模型上比较和合并变更。\n-\
    \ 5. 你可以比较哪些类型的数据模型？\n## **第8章 – 模型映射与发现**\n信息可能来自不同的数据源，整合这类数据是任何企业的常见需求。当现有数据源需要与被获取的数据源集成时，理解元数据至关重要。元数据是关于数据的数据，它存储了数据的类型、用途以及其他标识信息。理解元数据有助于可视化不同数据源之间的关联，并在它们之间创建映射和关系。映射模型可帮助你在多种数据源之间映射这类元数据。IBM\
    \ InfoSphere Data Architect 提供以下元数据集成工具：\n- 定义数据源之间的关系和映射\n- 设置转换规则\n- 发现关系\n\
    - 生成可部署到数据库的脚本\n## **8.1 映射模型：全局概览**\n![](img/38311ad87170342fd88ee1165fee68b0_142_0.png)\n\
    **图8.1 – 全局概览**\nInfoSphere Data Architect 入门\n*映射模型*用于定义两个不同架构之间的关系：源架构和目标架构。映射模型以映射规范语言（MSL）文件的形式存储。源模型可以是逻辑数据模型或物理数据模型。目标模型可以是**逻辑数据模型**、**物理数据模型**或XML架构文件（XSD）。映射模型是信息集成建模的一部分。*信息集成建模*提供了一系列可帮助你管理元数据的函数。要将新数据源与现有企业数据集成，你需要了解新数据源中的数据与现有环境中的数据如何关联。你可以构建一个流程，将新数据源中的数据复制到现有源中。通过定义映射和关系，你可以操作大量异构元数据。\n\
    ### **8.1.1 使用映射模型管理元数据**\nIBM InfoSphere Data Architect 通过以下方式帮助你管理模型的元数据：\n\
    - **发现关系**：工作台可以帮助你发现展示一个或多个源架构与目标架构关联方式的方法，这些关系可以基于元数据或任何可用的数据样本。\n- **映射关系**：IBM\
    \ InfoSphere Data Architect 可直观地映射你的源和目标数据模型，以及已发现或手动指定的关系。你创建的映射描述了如何将一个或多个源模型表示的数据合并、转换为适合目标模型的格式，结果会保存在映射模型中。\n\
    - **构建表达式**：你可以定义诸如函数、连接条件、过滤条件和排序条件等规则，将其添加到映射模型中，并在部署的脚本中使用这些表达式。\n- **生成脚本**：你可以从映射模型生成脚本，用于将符合映射模型要求的源中的数据转换、过滤后导入符合映射模型要求的目标中。\n\
    映射模型通过定义不同来源模型之间的关系，帮助我们集成各类模型。可以为架构之间创建的关系和映射添加转换规则。*映射*是指数据源中未实现的两个数据结构之间的依赖关系，映射模型会存储这些映射的概要信息。假设本学生信息系统是为支持多个校区运行而设计的，例如部分大学设有主校区，同时还会使用通常位于同一地理区域的小型卫星校区。假设\
    \ `NEW_SDT_INFO_SYS.dbm` 物理数据模型对某大型大学卫星校区的部分数据进行了建模，而你希望无缝整合这些信息。由于你在第6章已完成该物理数据模型的反向工程，因此你可以创建映射模型，将其部分元数据映射到\
    \ **STUDENT_INFO_SYSTEM.dbm** 物理数据模型文件中的对应对象。\n### **8.1.2 使用映射模型进一步管理命名规范**\n\
    你可以使用术语表或命名模型来发现源架构与目标架构之间的关系。你在本书第3章已经了解了术语表模型。你在数据设计流程早期定义的命名规则可用于识别不同架构之间的关系。\n\
    > **注意：** 你无需执行本节所列的步骤，这些步骤仅作为参考。你已经创建了术语表模型来跟踪数据模型中实体、表和其他数据对象的名称。你可以使用该术语表模型确保所有数据模型都符合你为组织定义的命名规范。如果映射模型发现功能无法正确判定哪些对象应被映射，则可能是部分对象不符合命名规范。\n\
    要使用映射模型判定模型是否符合命名规范，请按以下步骤操作：\n- 1. 打开“企业命名标准”窗口，将命名模型附加到映射模型：\n  a. 通过打开现有映射模型来打开映射编辑器。\n\
    \  b. 在映射编辑器中单击鼠标右键。\n  c. 选择*发现关系 -> 企业命名标准*，窗口将打开。\n- 2. 选择要附加命名标准的架构。\n- 3.\
    \ 单击“命名模型列表”面板旁边的*添加*按钮，“选择命名模型文件”窗口将打开。\n- 4. 选择一个文件扩展名为*.ndm*的术语表模型，然后单击“确定”。\n\
    - 5. 对剩余的所有架构重复上述步骤，然后单击*完成*。\n- 6. 基于最佳匹配发现关系：\n  a. 在映射编辑器中单击鼠标右键，然后选择*发现关系\
    \ -> 查找最佳匹配*，“发现关系”窗口将打开。\n  b. 选择要发现关系的架构，然后单击*完成*。系统将分析模型，并由工作台判定哪些数据对象应在映射模型中关联。\n\
    - 7. 批准或拒绝映射。\n- 8. 如有必要，创建新映射。\n- 9. 保存你的工作。\n"
