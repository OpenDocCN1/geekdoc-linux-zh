    # # Chapter 5 – Physical Data Modeling


    In this chapter, you will learn about *physical data models* and how they differ
    from logical data models. You will also learn how to transform a logical data
    model into a physical data model. By the end of the chapter, you will learn how
    to create and use a physical data model to create database-specific DDL statements
    that can turn your data modeling exercises into a functional schema.'
  merge: -1
  pgno: 84
- img_proc: true
  md: '# **5.1 Physical data modeling: The big picture**


    Physical data models are data models that are specific to a database, and they
    are based on database specifications. With a physical data model, you can model
    storage that includes partitions, table spaces, or indexes, in addition to other
    storage objects.


    You can model data by making use of specific properties available within a specific
    database and database platform. For example, physical data models will vary depending
    on whether they are modeled for DB2 systems, Oracle systems, or SQL Server systems.
    IBM InfoSphere Data Architect supports many different database system types and
    versions, and you can use a physical data model to create the database-specific
    data objects for these systems.


    > **Note:** InfoSphere Data Architect only supports storage modeling for DB2 for
    Linux, UNIX, and Windows, DB2 for z/OS®, and DB2 for i5/OS® databases. You can
    still create tables, columns, and other related objects within the workbench,
    but data objects from other database vendors, such as table spaces and buffer
    pools, are not supported.


    For this book, you will be working with models that are designed for a DB2 system.


    Typically, when you work with a physical data model, you use the following task
    flow:


    +   1. Create a physical data model, either from scratch, template, transforming
    from a logical data model, or importing from another system.

    2. Refine the physical data model by adding storage objects, indexes, and views.

    3. Generate the DDL to deploy the database and/or schema.

    4. Run the DDL script that creates the data objects on the server.


    So you might be asking yourself, "What are the differences between a logical and
    physical data model?" Table 5.1 summarizes the differences.


    | Logical data models | Physical data models |

    |---|---|

    | Do not correspond to any database vendor | Always correspond to a database vendor
    and database version |

    | Based on a higher level of abstraction; more generic | More specific; closer
    to the design of an actual database |

    | Physical storage is not taken into account | Used to model physical storage
    for supported database vendors |

    | Does not require database vendor construction knowledge; requires to know how
    the model will be used | Requires knowledge about database vendors and how models
    are constructed for each platform; requires information about how data |'
