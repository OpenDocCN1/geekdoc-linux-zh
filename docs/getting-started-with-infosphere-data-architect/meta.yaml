    \n*术语表模型*是描述组织允许用于数据对象的名称和缩写的模型。数据对象命名标准能促进对数据的共识，因为你在整个组织中会使用相同的命名约定。你可以使用术语表模型实现跨组织边界的数据共享，并通过合并同义和重叠的数据元素减少数据冗余。\n\
    \n命名数据对象时，你需要考虑两项内容：语义规则和格式。从语义上看，术语表模型对象包括核心词、类词和修饰词：\n- *核心词*：表示正在收集数据所对应的业务概念的词。核心词是描述数据主题领域的名词。例如：LOAN、EMPLOYEE\n\
    - *类词*：用于标识数据的不同类别或分类的词。例如：RATE、NAME\n- *修饰词*：进一步限定或区分核心词和类词的词。它能确保对象名称清晰唯一，还有助于限制类词和核心词的含义。例如：NEXT、FIRST\n\
    \n你可以使用IBM InfoSphere Data Architect来帮你定义这些语义规则或*命名标准*。你将在*3.4节 使用命名标准*中进一步了解如何在未来的数据建模项目中指定其中部分选项。\n\
    \n要强制执行术语表中指定的命名约定，包含待分析模型的项目必须引用该术语表模型。若要在项目中引用现有术语表模型，请执行以下步骤：\n> **注意：** 你无需执行这些步骤，因为你将在后续部分创建项目将引用的术语表模型。仅当你创建术语表模型时未将其添加到项目，或从其他产品导入了术语表模型时，才需要执行此步骤。\n\
    \n1. 在数据项目浏览器中选择数据设计项目。数据设计项目的属性将显示在属性视图中。\n2. 打开*命名标准*选项卡，然后点击*添加*按钮。将打开文件选择窗口。\n\
    3. 展开数据设计项目，然后从文件列表中选择术语表模型，如*图3.13*所示。\n![](img/38311ad87170342fd88ee1165fee68b0_66_0.png)\n\
    **图3.13 – 选择术语表模型**\n术语表模型已被数据设计项目引用。\n\n### **3.3.1 命名标准与术语表模型的最佳实践**\n以下是设计命名标准时可以参考的一些最佳实践：\n\
    - 实体名称使用单词的单数形式。\n- 实体名称的首字符不要使用数字。\n- 选择简短、无歧义的名称，尽量不超过一两个单词。\n\n创建术语表模型时，请考虑以下最佳实践：\n\
    - 创建一个独立的企业标准项目，其中包含应在全组织共享的任何术语表或域模型。你将在第4章中进一步了解域模型。\n- 为可能包含企业术语表创建之前遗留的术语、且可能使用不同定义的遗留模型，在特定项目中创建术语表模型。\n\
