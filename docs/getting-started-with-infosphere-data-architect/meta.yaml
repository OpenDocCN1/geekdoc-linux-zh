    your workspace.


    +   5. What is the purpose of storage modeling?


    +   6. What storage model objects can you create in a physical data model?


    +   7. True or false: You must have a logical data model before you create a physical
    data model. You cannot create a physical data model from scratch.


    # **5.10 What''s next?**


    Congratulations! You have designed and deployed a complete data model.


    In the next chapter, you will learn how to generate informative reports about
