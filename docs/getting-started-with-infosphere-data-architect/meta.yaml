    # Chapter 4 – Domain Models


    In this chapter, you will learn how to create a domain model. *Domain models*
    describe domain data types and their constraints that are specific to an organization.
    You can define domain models as part of the logical data model, or you can create
    a separate domain model that can be used throughout all logical and physical data
    models for a project.


    You will create a domain model that can be used to model what information should
    be secured in a test environment – in particular, you will secure the social security
    numbers, last names, and email addresses of each student. The test system will
    be populated with realistic data, and the privacy rules that you specify ensure
    that sensitive information is still protected. Then, you will associate this domain
    model with the data objects in the logical data model.


    > **Note:**


    The domain models that you create in InfoSphere Data Architect can be shared with
    the Optim Data Privacy Solution suite of products. To learn more about the Optim
    Data Privacy Solutions, visit this URL:


    http://www-01.ibm.com/software/data/optim/protect-data-privacy/


    # 4.1 Domain models


    Domain models describe the domain data types and their constraints that an organization
    allows. You can create organization-specific data types within a domain model
    (in other words, data types that describe aspects of a certain domain). Using
    a domain data type instead of the base data type ensures that you maintain consistency
    across an organization, and you can reuse the common data type definitions to
    make your team more efficient.


    Domain data types can be stored in a domain model or as part of a logical data
    model. You can associate a domain data model with a data design project so that
    the domain data types are available for all of your logical and physical data
    models. Using atomic domains instead of base data types ensures consistency among
    team members.'
