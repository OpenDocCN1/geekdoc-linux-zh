    \ add or modify data model objects by using the palette or the diagram surface,\
    \ you modify the underlying data model.\n\n### 3.2.2.3 Renaming data objects from\
    \ the Properties view\nBy default, Diagram1 is the name of this diagram, but you\
    \ should change it to something that you can easily remember or differentiate\
    \ from other data models in the project. To rename the diagram and the top-level\
    \ package, perform the following steps:\n1. Open the Diagram1 diagram in the diagram\
    \ editor. When you open or select any object, the properties of that object are\
    \ displayed in the Properties view. In this case, you will edit the diagram properties\
    \ of the Diagram1 diagram.\n2. Open the General tab of the Properties view, and\
    \ change the text in the Diagram name field to **STUDENT_INFO**.\n3. Select the\
    \ Package1 package in the Data Project Explorer. The package is located under\
    \ the **STUDENT_INFO_SYSTEM.ldm** data model file.\n4. Open the General tab, and\
    \ change the text in the Name field to **STUDENT INFO SYSTEM**. The data object\
    \ is automatically renamed. When you click a blank area in the diagram, the name\
    \ of the diagram editor changes to STUDENT_INFO, and the logical data model is\
    \ updated in the Data Project Explorer view. An asterisk (*) appears next to any\
    \ data object in the Data Project Explorer or the data object editor that has\
    \ been modified. The asterisk will disappear when you save the file or project.\n\
    \n> **Note:** You can modify the display characteristics of the diagram with the\
    \ Properties view. For example, you can change the following options:\n- Use the\
    \ Format tab to change the foreground or background colors of entities or foreign\
    \ keys, or change the line color of an implicit foreign key relationship.\n- Use\
    \ the Documentation tab to document the purpose of the diagram.\n- Use the Appearance\
    \ tab to format the fonts and text color.\n\nAll of these options change the diagram\
    \ properties, but do not modify the underlying data model. You can also save image\
    \ files of diagrams for archival or presentation purposes.\n\n### 3.2.2.4 Adding\
    \ notes and text boxes to the diagram\nAdd notes or text boxes to the diagram\
    \ to help you document information about the data model. Notes and text boxes\
    \ are also useful to call out information or fully explain what complex diagrams\
    \ are intended to address.\n\nFirst, let's add a note to the diagram that labels\
    \ the diagram.\n1. Click the *Note* icon in the palette of the diagram, as shown\
    \ in *Figure 3.3*.\n\n![](img/38311ad87170342fd88ee1165fee68b0_54_0.png)\n**Figure\
    \ 3.3 – Clicking the Note icon**\n\n2. Click a blank area in the diagram editor.\
    \ The note appears on the diagram.\n3. In the note, type the following note:\n\
    ```\nSTUDENT_INFO: All information relating to student life.\n```\n\nThe note\
    \ appears on the diagram, as shown in *Figure 3.4*.\n\n![](img/38311ad87170342fd88ee1165fee68b0_54_1.png)\n\
    **Figure 3.4 – Creating a note in the diagram**\n\nTo provide additional information\
    \ to a data diagram, you can add text boxes. Let's add a text box to note that\
    \ the logical data model is still being drafted.\n1. Right-click an empty space\
    \ in the diagram, then select *Add -> Text*. A text box appears on the diagram.\n\
    2. In the text box, type:\n> NOTE: This logical data model is still being drafted.\n\
    3. Make the text red and bold:\n   a. Open the *Advanced* tab of the Properties\
    \ view.\n   b. Expand the *Styles* property.\n   c. Change the *bold* property\
    \ to *true*.\n   d. Change the font color to red.\n4. Save your work. Click *File\
    \ -> Save All*.\n\n### 3.2.2.5 Designing the data diagram and logical data model\n\
    An *entity* is a logical data model object that stores information about significant\
    \ areas of interest. Each entity contains *attributes*, which store details about\
    \ the entities. For example, you can create a Sales entity, with ProductKey, Quantity,\
    \ UnitPrice, and OrderKey attributes to describe the sales for various products.\
    \ When the logical data model is transformed into a physical data model, the entities\
    \ can become tables, and attributes become columns. When you create entities and\
    \ attributes, be as specific as you can. Insert all attributes you need, all domain\
    \ constraints, and all other aspects you consider in helping you obtain a model\
    \ closer to real world. Remember that the logical data model will be transformed\
    \ into a physical data model.\n\nLet's use the data diagram to add a new entity\
    \ to the logical data model:\n1. In the Palette view, expand the *Data* section,\
    \ then drag and drop an entity onto a blank space in the diagram editor. The new\
    \ entity is created in the model and within the diagram, and you can immediately\
    \ give the entity a new name.\n2. Name the entity **STUDENT**. The entity is created\
    \ in the diagram, and the corresponding data object is created in the logical\
    \ data model. When you add or modify logical data model objects by using the palette\
    \ or the diagram surface, the underlying logical data model is modified.\n\n![](img/38311ad87170342fd88ee1165fee68b0_56_0.png)\n\
    **Figure 3.5 – Creating the STUDENT entity**\n\nYou can also add entities to the\
    \ diagram via two other methods:\n- Using the context menu: You can right-click\
    \ in the diagram editor to add data objects to a diagram. To add a new entity,\
    \ you can right-click an empty area of the editor, then select *Add Data Object*\
    \ > *Entity*.\n- Using the pop-up bar to create entities: You can use the white\
    \ space on the diagram editor to add data objects to diagrams. When you hover\
    \ over a data object or an empty area of the diagram, a pop-up bar appears, as\
    \ shown in *Figure 3.6*.\n\n![](img/38311ad87170342fd88ee1165fee68b0_56_1.png)\n\
    **Figure 3.6 – Using the pop-up bar to create data objects in the diagram**\n\n\
    You can also use this method to add other data objects to existing data objects;\
    \ for example, you can add primary keys to entities by using this method.\n\n\
    ### 3.2.2.6 Adding attributes to the STUDENT entity\nThe entity is currently empty.\
    \ Add attributes to the entity. Attributes of an entity can include the primary\
    \ key and non-key attributes. All of these attributes will store information about\
    \ each student at the university. Let's start with the STUDENT entity. At the\
    \ university, each student receives a unique ID number that is 10 characters long.\
    \ You will create an attribute to store the student ID number of the students\
    \ at the university. To add attributes to the STUDENT entity, perform the following\
    \ steps:\n1. Select the STUDENT entity in the STUDENT_INFO diagram. The Properties\
    \ view displays the properties of the STUDENT entity.\n2. Open the *Attributes*\
    \ tab of the Properties view.\n3. Add the student ID (STUDENT ID) attribute to\
    \ the entity:\n   a. Click the *New* button (\U0001F48E). A new attribute is created\
    \ in the Properties view and the diagram.\n   b. Give the new attribute the following\
    \ properties:\n      - *Name*: STUDENT ID\n      - *Primary key*: Select this\
    \ check box.\n      - *Type*: CHAR\n      - *Length/Precision*: 10\n\nYou have\
    \ created the STUDENT ID attribute. The STUDENT ID attribute is of the CHAR(10)\
    \ data type, making it long enough to store the student ID numbers of the students\
    \ at the university. When you select the check box in the *Primary key* column\
    \ to mark the STUDENT ID column as the primary key, the *Required* property is\
    \ automatically selected, too, because a primary key cannot be a null value.\n\
    \n![](img/38311ad87170342fd88ee1165fee68b0_57_0.png)\n**Figure 3.7 – Creating\
    \ the STUDENT ID attribute**"
  mdcn: "\n![](img/38311ad87170342fd88ee1165fee68b0_52_0.png)\n**图 3.2 – 创建空白逻辑数据模型**\n\
    \n## 3.2.2 使用图表创建实体\n\n### 3.2.2.1 创建图表\n你可以使用图表来可视化和编辑数据设计项目中包含的对象。当你在逻辑数据模型的图表中创建对象时，这些更改会自动应用到逻辑数据模型中，这不仅使你更容易可视化数据对象及其之间的关系，还能节省手动创建这些关系所需的时间。数据图表是底层数据模型的一种表示形式。你可以创建仅包含你感兴趣的模型对象子集的图表。\n\
    \n### 3.2.2.2 调色板的 Data 部分\n调色板的 Data 区域包含数据模型对象。当你使用调色板或图表界面添加或修改数据模型对象时，你修改的是底层数据模型。\n\
    \n### 3.2.2.3 从属性视图重命名数据对象\n默认情况下，此图表的名称为 Diagram1，但你应该将其更改为容易记住或能与项目中其他数据模型区分开的名称。要重命名图表和顶层包，请执行以下步骤：\n\
    1. 在图表编辑器中打开 Diagram1 图表。当你打开或选择任何对象时，该对象的属性会显示在属性视图中。在本例中，你将编辑 Diagram1 图表的图表属性。\n\
    2. 打开属性视图的 General 选项卡，将 Diagram name 字段中的文本更改为 **STUDENT_INFO**。\n3. 在数据项目浏览器中选择\
    \ Package1 包。该包位于 **STUDENT_INFO_SYSTEM.ldm** 数据模型文件下。\n4. 打开 General 选项卡，将 Name\
    \ 字段中的文本更改为 **STUDENT INFO SYSTEM**。数据对象会自动重命名。当你点击图表中的空白区域时，图表编辑器的名称会更改为 STUDENT_INFO，并且逻辑数据模型会在数据项目浏览器视图中更新。任何已修改的数据对象在数据项目浏览器或数据对象编辑器中都会显示星号（*）。当你保存文件或项目时，星号会消失。\n\
    \n> **注意：** 你可以使用属性视图修改图表的显示特征。例如，你可以更改以下选项：\n- 使用 Format 选项卡更改实体或外键的前景色或背景色，或更改隐式外键关系的线条颜色。\n\
    - 使用 Documentation 选项卡记录图表的用途。\n- 使用 Appearance 选项卡设置字体和文本颜色的格式。\n\n所有这些选项都会更改图表属性，但不会修改底层数据模型。你还可以将图表保存为图像文件，用于归档或演示目的。\n\
    \n### 3.2.2.4 向图表中添加注释和文本框\n向图表中添加注释或文本框，帮助你记录有关数据模型的信息。注释和文本框也有助于标注信息或完整解释复杂图表所要解决的问题。\n\
    \n首先，让我们向图表中添加一个标注图表的注释。\n1. 点击图表调色板中的 *Note* 图标，如 *图 3.3* 所示。\n\n![](img/38311ad87170342fd88ee1165fee68b0_54_0.png)\n\
    **图 3.3 – 点击 Note 图标**\n\n2. 点击图表编辑器中的空白区域。注释会出现在图表上。\n3. 在注释中输入以下内容：\n```\nSTUDENT_INFO:\
    \ All information relating to student life.\n```\n\n注释会出现在图表上，如 *图 3.4* 所示。\n\n\
    ![](img/38311ad87170342fd88ee1165fee68b0_54_1.png)\n**图 3.4 – 在图表中创建注释**\n\n要向数据图表提供额外信息，你可以添加文本框。让我们添加一个文本框，注明逻辑数据模型仍在起草中。\n\
    1. 右键点击图表中的空白区域，然后选择 *Add -> Text*。文本框会出现在图表上。\n2. 在文本框中输入：\n> NOTE: This logical\
    \ data model is still being drafted.\n3. 将文本设置为红色和粗体：\n   a. 打开属性视图的 *Advanced*\
    \ 选项卡。\n   b. 展开 *Styles* 属性。\n   c. 将 *bold* 属性更改为 *true*。\n   d. 将字体颜色更改为红色。\n\
    4. 保存你的工作。点击 *File -> Save All*。\n\n### 3.2.2.5 设计数据图表和逻辑数据模型\n*实体*是存储重要关注领域信息的逻辑数据模型对象。每个实体包含*属性*，用于存储实体的详细信息。例如，你可以创建一个\
    \ Sales 实体，包含 ProductKey、Quantity、UnitPrice 和 OrderKey 属性来描述各种产品的销售情况。当逻辑数据模型转换为物理数据模型时，实体可以变成表，属性变成列。在创建实体和属性时，应尽可能具体。插入你需要的所有属性、所有域约束以及你认为有助于获得更接近现实世界模型的所有其他方面。请记住，逻辑数据模型将被转换为物理数据模型。\n\
    \n让我们使用数据图表向逻辑数据模型添加一个新实体：\n1. 在调色板视图中，展开 *Data* 部分，然后将一个实体拖放到图表编辑器的空白区域。新实体会在模型和图表中创建，你可以立即为实体指定一个新名称。\n\
    2. 将实体命名为 **STUDENT**。实体在图表中创建，相应的数据对象在逻辑数据模型中创建。当你使用调色板或图表界面添加或修改逻辑数据模型对象时，底层逻辑数据模型会被修改。\n\
    \n![](img/38311ad87170342fd88ee1165fee68b0_56_0.png)\n**图 3.5 – 创建 STUDENT 实体**\n\
    \n你还可以通过另外两种方法将实体添加到图表中：\n- 使用上下文菜单：你可以在图表编辑器中右键点击以将数据对象添加到图表。要添加新实体，你可以右键点击编辑器的空白区域，然后选择\
    \ *Add Data Object* > *Entity*。\n- 使用弹出栏创建实体：你可以使用图表编辑器中的空白区域向图表添加数据对象。当你将鼠标悬停在数据对象或图表的空白区域上时，会出现一个弹出栏，如\
    \ *图 3.6* 所示。\n\n![](img/38311ad87170342fd88ee1165fee68b0_56_1.png)\n**图 3.6 –\
    \ 使用弹出栏在图表中创建数据对象**\n\n你还可以使用此方法将其他数据对象添加到现有数据对象中；例如，你可以使用此方法为实体添加主键。\n\n### 3.2.2.6\
    \ 向 STUDENT 实体添加属性\n该实体目前为空。向实体添加属性。实体的属性可以包括主键和非键属性。所有这些属性将存储大学中每位学生的信息。让我们从\
    \ STUDENT 实体开始。在大学中，每位学生都会获得一个10个字符长的唯一ID号。你将创建一个属性来存储大学中学生的学号。要向 STUDENT 实体添加属性，请执行以下步骤：\n\
    1. 在 STUDENT_INFO 图表中选择 STUDENT 实体。属性视图会显示 STUDENT 实体的属性。\n2. 打开属性视图的 *Attributes*\
    \ 选项卡。\n3. 向实体添加学号（STUDENT ID）属性：\n   a. 点击 *New* 按钮（\U0001F48E）。在属性视图和图表中会创建一个新属性。\n\
    \   b. 为新属性设置以下属性：\n      - *Name*：STUDENT ID\n      - *Primary key*：选中此复选框。\n\
    \      - *Type*：CHAR\n      - *Length/Precision*：10\n\n你已经创建了 STUDENT ID 属性。STUDENT\
    \ ID 属性的数据类型为 CHAR(10)，足以存储大学中学生的学号。当你选中 *Primary key* 列中的复选框将 STUDENT ID 列标记为主键时，*Required*\
    \ 属性也会自动被选中，因为主键不能为 null 值。\n\n![](img/38311ad87170342fd88ee1165fee68b0_57_0.png)\n\
    **图 3.7 – 创建 STUDENT ID 属性**\n"
