    | Data Source Explorer | This view allows you to connect to and view databases
    and the objects that are within them. It automatically displays detected databases,
    but you can add new database connections. You can reverse-engineer from this view
    by dragging and dropping data objects from the Data Source Explorer into the Data
    Project Explorer. |

    | Properties | This view shows the properties of the object that is currently
