    ## 第10章 – 数据管理生命周期

    ### 10.1 管理您的数据

    数据安全、隐私与生命周期管理产品组合是一套统一的解决方案集，可支持在软件开发生命周期的所有阶段（从需求收集到项目退役）管理数据。IBM InfoSphere
    Data Architect 是数据安全、隐私与生命周期管理产品组合的组成部分。

    该产品组合中的部分热门产品包括：

    - IBM InfoSphere Data Architect

    - Optim Development Studio and pureQuery Runtime

    - Optim Database Administrator

    - Optim Performance Manager Extended Edition

    - Optim High Performance Unload

    - Optim Query Tuner

    以下列表包含数据安全、隐私与生命周期管理家族中这些产品的一些高层级描述：

    - **Optim Development Studio**

    Optim Development Studio 支持开发和管理数据库。使用 Optim Development Studio，您可以创建、修改和删除对象；管理数据库权限；查看数据分布情况；以及收集数据对象的统计信息。您还可以开发和测试
    SQL 与 XQuery 查询、存储过程、Web 服务和 Java 数据访问层。Optim pureQuery Runtime 是可与 Optim Development
    Studio 搭配使用的可选功能，它是一个高性能数据访问平台，可简化数据访问的监控、开发、优化、安全管控和管理工作。您可以使用 API 简化最佳实践的实施，促进开发人员与数据库管理员之间的协作，也可以监控
    SQL 热点，获取可改善响应时间的相关洞察。

    - **Optim Database Administrator**

    Optim Database Administrator 支持对数据库进行复杂的结构变更管理，以及处理数据库迁移场景。您可以自动化结构变更流程，更好地管理测试数据库、加快部署速度，从而简化管理任务。您可以分析数据库变更的影响，最大程度降低对部署环境的风险。借助
    Optim Database Administrator，您还可以更高效地管理大型环境。

    - **Optim Performance Manager Extended Edition**

    Optim Performance Manager 可帮助数据库管理员提升 DB2 的性能和可用性。DB2 Performance Expert 能够在性能问题影响业务之前，帮助您识别、诊断、解决并预防这类问题。Optim
    Performance Manager 会提供优化和调优建议，并帮助您分析趋势以规划数据库扩容。它会监控您的应用程序和数据库，在性能受到影响之前识别潜在问题、管理工作负载。

    - **Optim High Performance Unload**

    Optim High Performance Unload 可帮助数据库管理员以更少的工作量、更快的速度处理海量数据。Optim High Performance
    Unload 可与生产应用程序并行运行，在维持系统可用性的同时，最大程度降低对生产性能的影响。Optim High Performance Unload 还可将数据卸载、备份、迁移、重新分区操作适配到紧张或不断缩减的批处理窗口中，降低对在线生产环境的影响。

    - **Optim Query Tuner**

    Optim Query Tuner 可帮助开发人员编写高效查询、提升调优技能。它通过提供专业建议，指导您如何编写高质量查询、优化数据库设计，从而提升性能。

    ### 10.1.1 数据管理生命周期

    上一节所列的产品可单独或协作使用，为软件开发生命周期的各个阶段提供解决方案。*图 10.1* 展示了可使用 IBM 数据安全、隐私与生命周期管理产品组合实现的这一生命周期。

    ![](img/38311ad87170342fd88ee1165fee68b0_166_0.png)

    **图 10.1 – 数据安全、隐私与生命周期管理工具**

    IBM InfoSphere Data Architect 如前所述，主要应用于集成数据管理生命周期的设计阶段，尽管任何项目的整个生命周期中对设计进行修改都是常规操作。您可以使用该工作台管理这些变更。

    借助数据安全、隐私与生命周期管理产品组合，所有这些产品将作为一套单一解决方案提供给用户（有关 IBM InfoSphere Data Architect 的集成能力请参阅
    10.1.2 节，有关外壳共享请参阅 10.1.3 节）。

    借助数据安全、隐私与生命周期管理解决方案，可以管理完整的产品生命周期。由于该产品组合解决了互操作性和兼容性问题，您可以获得以下提升：

    - 更快开发出适用于企业的应用程序

    - 有效管理数据增长

    - 优化数据库应用程序性能

    - 在产品/应用程序生命周期的所有阶段保护数据隐私

    - 简化迁移和升级流程

    ### 10.1.2 将 IBM InfoSphere Data Architect 与其他产品集成

    在任何软件开发团队中（无论规模大小），您都应使用能够无缝共享数据或信息的工具。这样可以更轻松地在产品开发各个阶段复用所有信息。

    IBM InfoSphere Data Architect 通过与以下产品集成，支持模型驱动设计：

    - InfoSphere Business Glossary：在整个企业范围内共享企业术语表

    - Cognos Business Intelligence：基于数据库中的信息创建、共享和使用报表

    - Rational Software Architect：同步应用程序和信息的设计

    - Rational RequisitePro：确保模型满足企业的所有需求

    - WebSphere® Business Modeler Advanced：将数据模型转换为业务流程的 XML 架构定义

    ![](img/38311ad87170342fd88ee1165fee68b0_167_0.png)

    **图 10.2 – 将 InfoSphere Data Architect 与其他软件开发产品集成**

    ### 10.1.3 与其他基于 Eclipse 的产品进行外壳共享

    IBM InfoSphere Data Architect 构建于 Eclipse 平台之上，Eclipse 是一个流行的开源平台，您可以使用该平台开发应用程序。Eclipse
    平台支持您与其他基于 Eclipse 的产品集成。

    基于 Eclipse 的产品之间的*外壳共享*本质上是指您可以共享产品的核心组件，避免在各产品中重复安装这些组件。这样无需每个产品都单独配备一套 Eclipse
    平台。

    一个理解外壳共享的简单类比是对比微软 Windows 的安装：Windows 程序文件所需的所有公共组件都存储在 `C:\Windows` 文件夹中。

    从基础层面来看，外壳共享可以节省磁盘空间，无需重复安装组件。

    外壳共享通过共享通用且兼容的功能实现这一效果。

    因此，您可以通过单一用户界面与每个产品的所有功能进行交互。

    例如，如果您让 IBM InfoSphere Data Architect 和 Optim Development Studio 启用外壳共享，就可以在单一公共平台上完成数据库的开发和架构设计。

    该公共平台的启动与要启动的具体产品无关。

    您可以将任意数量的兼容产品进行外壳共享。

    例如，您还可以将 Rational Software Architect 与 IBM InfoSphere Data Architect 和 Optim Development
    Studio 集成，以便使用 Rational Software Architect 的功能。

    > **注意：** 有关如何为 InfoSphere Data Architect、Optim Development Studio 和 Optim Database
    Administrator 启用外壳共享的示例，请参阅以下 developerWorks 文章：http://www.ibm.com/developerworks/data/library/techarticle/dm-0811khatri/index.html

