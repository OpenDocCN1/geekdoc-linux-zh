    In this case, you will edit the diagram properties of the Diagram1 diagram.

    2. Open the General tab of the Properties view, and change the text in the Diagram
    name field to **STUDENT_INFO**.

    3. Select the Package1 package in the Data Project Explorer. The package is located
    under the **STUDENT_INFO_SYSTEM.ldm** data model file.

    4. Open the General tab, and change the text in the Name field to **STUDENT INFO
    SYSTEM**.


    The data object is automatically renamed. When you click a blank area in the diagram,
    the name of the diagram editor changes to STUDENT_INFO, and the logical data model
    is updated in the Data Project Explorer view. An asterisk (*) appears next to
    any data object in the Data Project Explorer or the data object editor that has
    been modified. The asterisk will disappear when you save the file or project.


    > **Note:**


    You can modify the display characteristics of the diagram with the Properties
