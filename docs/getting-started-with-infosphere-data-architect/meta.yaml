    # **5.8 Summary**


    In this chapter, you learned about *physical data models*. Physical data models
    are the next step in the data design process; they take the logical design and
    help you draft the physical storage (tables, columns, indexes, and other data
    objects) for the database and server.


    You also learned about data definition language (DDL) files and how they can be
    used to deploy the data models that you create with IBM InfoSphere Data Architect.
    DDL scripts contain the queries that are necessary to drop, create, or modify
    data objects.


