    \ new mappings if necessary.\n9. Save your work."
- md: "## 8.2 Building mappings within the workbench\n\nYou can create mapping models\
    \ from source logical and physical data models in your data design projects. Target\
    \ models for your mapping models can be logical or physical data models or XML\
    \ schemas.\n\n> **Restriction:** You cannot generate scripts from a source that\
    \ is a logical data model. When you create mappings between logical data models\
    \ and other sources or targets, it is only for publishing purposes; that is, you\
    \ can only report on the mappings.\n\n### 8.2.1 Creating a blank mapping model\n\
    \nLet's create a new mapping model to map the objects in the `NEW_STUDENT_INFO_SYS.dbm`\
    \ physical data model to the `STUDENT_INFO_SYSTEM.dbm` physical data model:\n\
    - 1. Click *File* -> *New* -> *Mapping Model*. The Mapping Editor wizard opens.\n\
    - 2. Complete the Create Mapping page:\n  - a. Make sure that the *University\
    \ Info System* data design project is specified in the *Destination folder* field.\n\
    \  - b. In the *File name* field, specify `STUDENT_MAPPING.msl`.\n  - c. Make\
    \ sure that the *Enable script generation for this model* option is selected,\
    \ so that you can create SQL scripts to deploy your mappings.\n  - d. Click *Next*.\n\
    - 3. Complete the Specify the Mapping Source page:\n  - a. Click the *Add* button.\
    \ The Select a Mapping Source window opens.\n  - b. Select the `NEW_STUDENT_INFO_SYS.dbm`\
    \ physical data model file, then click *OK*. The mapping source file is added\
    \ to the *Mapping source files* list.\n  - c. Click *Next*.\n- 4. Do not change\
    \ any of the options on the Specify the Mapping Target page, then click *Next*.\n\
    - 5. Complete the Specify the Mapping Target page:\n  - a. Click the *Add* button.\
    \ The Select a Mapping Target window opens.\n  - b. Select the `STUDENT_INFO_SYSTEM.dbm`\
    \ physical data model file, then click *OK*. The mapping target file is added\
    \ to the *Mapping target files* list.\n  - c. Make sure that all of the objects\
    \ in the *Mapping target schemas* list are selected.\n  - d. Click *Next*.\n-\
    \ 6. Verify your options on the New Mapping Model Summary page, then click *Finish*.\
    \ The mapping model file is created in the *Mappings* folder of your data design\
    \ project, and it opens in the editor view.\n\nThe mapping editor has three panes,\
    \ as shown in *Figure 8.2*:\n- **Source**: This pane contains the source file\
    \ and schema.\n- **Mappings**: This pane will display mappings and mapping groups\
    \ within the mapping model.\n- **Target**: This pane contains the target file\
    \ and schema.\n\n![](img/38311ad87170342fd88ee1165fee68b0_146_0.png)\n\n### **Figure\
    \ 8.2 – Getting to know the mapping editor**\n\n### 8.2.2 Adding mappings to mapping\
    \ model\n\nYou can create mappings between the source and target schemas from\
    \ the mapping editor. You can create mappings in two ways:\n- **Manually add mappings**:\
    \ Select objects in the *Source* and *Target* panes, then create a mapping between\
    \ them.\n- **Let the workbench discover mappings**: Run the Discover Relationships\
    \ wizard to determine the best mappings between data objects.\n\n#### 8.2.2.1\
    \ Manually creating a mapping\n\nWhen you create a mapping manually, you ensure\
    \ that each source object is mapped to its appropriate, corresponding object in\
    \ the target data model. This can be a time-consuming process, but in the case\
    \ of small data models, it is sometimes best to use this method. Let's experiment\
    \ with manually creating mappings and create two mappings:\n- 1. Map the STUDENT.STUDENT_ID\
    \ columns:\n  - a. Left-click to select the STUDENT.STUDENT_ID column in the *Source*\
    \ pane.\n  - b. Left-click to select the STUDENT.STUDENT_ID column in the *Target*\
    \ pane. The selected columns are shown in the image in *Figure 8.3*.\n\n![](img/38311ad87170342fd88ee1165fee68b0_147_0.png)\n\
    \n### **Figure 8.3 – Selecting source and target objects**\n\n  - c. Right-click\
    \ anywhere in the mapping editor, then select *Create mapping*. The mapping is\
    \ created and displayed in the mapping editor, as shown in *Figure 8.4*.\n\n![](img/38311ad87170342fd88ee1165fee68b0_147_1.png)\n\
    \n### **Figure 8.4 – Newly-created mapping in the mapping editor**\n\n- 2. Map\
    \ the STUDENT.FIRST_NAME columns using the above process. The mapping editor should\
    \ now look like the image in *Figure 8.5*.\n\n![](img/38311ad87170342fd88ee1165fee68b0_148_0.png)\n\
    \n### **Figure 8.5 – Creating another new mapping**\n\n- 3. Save your work.\n\n\
    #### 8.2.2.2 Automatically discovering relationships\n\nIdentifying the relationships\
    \ between disparate data sources is quite tedious and time consuming when you\
    \ are working with large data models. In addition, the subtle relationships are\
    \ not always obvious to identify. You can use the Discover Relationships wizard\
    \ within the workbench to perform this task for you, based on certain algorithms.\n\
    \n> **Note**: You can modify how relationships are discovered from the Preferences\
    \ window. Click *Window -> Preferences*. The Preferences window opens. Expand\
    \ the *Data Management* node, then select *Mapping Editor* -> *Discover Relationships*\
    \ to define how relationships are discovered.\n\nUse your existing mapping model\
    \ to discover the relationships between objects in both data models:\n- 1. Right-click\
    \ anywhere within the mapping model, then select *Discover Relationships -> Find\
    \ Best Fit*. The Discover Relationships window opens.\n- 2. In the *Source* pane,\
    \ select the check box next to the **NEW_STUDENT_INFO_SYS.dbm** data model. Make\
    \ sure that all objects under the physical data model are selected, as shown in\
    \ *Figure 8.6*.\n\n![](img/38311ad87170342fd88ee1165fee68b0_149_0.png)\n\n###\
    \ **Figure 8.6 – Selecting all objects in the Source pane**\n\n- 3. In the *Target*\
    \ pane, select the check box next to the **STUDENT_INFO_SYSTEM.dbm** data model.\
    \ Make sure that all objects under the physical data model are selected.\n- 4.\
    \ Click *Finish*. The discovery process runs, and you see a series of mapping\
    \ lines that show potential relationships between the objects in the two data\
    \ models. This is shown in *Figure 8.7*.\n\n![](img/38311ad87170342fd88ee1165fee68b0_149_1.png)\n\
    \n### **Figure 8.7 – Mapping lines, connecting data objects between models**\n\
    \n#### 8.2.2.3 Accepting and rejecting discovered relationships\n\nThe relationships\
    \ that were discovered are only potential relationships. Before they become officially\
    \ part of the mapping model, you must approve or reject the mappings.\n\nRelationships\
    \ within a mapping model are color-coded. The color codes are determined by the\
    \ settings in the Preferences window, in the Mapping Editor page (found under\
    \ the *Data Management* node). Note that the relationships you created are in\
    \ blue or light blue, depending on whether the relationship is selected. Within\
    \ the workbench, these are considered to be accepted mappings and are an approved\
    \ part of the mapping model. Discovered mappings are in gold if they are not selected,\
    \ and they appear to be brown if you select them. You select mappings to approve\
    \ or reject them. If you reject a mapping, the mapping line disappears from the\
    \ mapping model. First, you will approve a couple of relationships manually. Then,\
    \ you will inspect the remaining relationships and determine whether to accept\
    \ the mappings.\n\nTo accept or reject discovered relationships:\n- 1. Select\
    \ the mapping for the STUDENT.LAST_NAME relationship. The mapping line changes\
    \ to a brown color, and the discovered mapping displays in the Properties view.\n\
    - 2. Right-click on the mapping and select *Accept Mapping*, as shown in Figure\
    \ 8.8.\n\n![](img/38311ad87170342fd88ee1165fee68b0_150_0.png)\n\nThe mapping line\
    \ color changes to blue.\n\n- 3. Use the method outlined in steps 1 and 2 above\
    \ to approve the mapping for the STUDENT.STUDENT_SSN and STUDENT.EMAIL_ADDR mappings.\n\
    - 4. Save your work. At this point, you probably realize that with large data\
    \ models, this can be a tedious process. Now that you are familiar with how to\
    \ accept or reject mappings manually, you can view the remaining mappings and\
    \ determine whether to accept all of the proposed mappings.\n- 5. Expand all of\
    \ the table nodes in the *Source* and *Target* panes. The editor should look like\
    \ the image in *Figure 8.9*."
  mdcn: "\n## 8.2 在工作台中创建映射\n你可以在数据设计项目中，从源逻辑和物理数据模型创建映射模型。映射模型的目标模型可以是逻辑或物理数据模型，也可以是XML架构。\n\
    > **限制：** 你无法从以逻辑数据模型作为源的场景生成脚本。当你在逻辑数据模型和其他源或目标之间创建映射时，仅用于发布目的；也就是说，你只能对映射进行报告。\n\
    ### 8.2.1 创建空白映射模型\n让我们创建一个新的映射模型，将`NEW_STUDENT_INFO_SYS.dbm`物理数据模型中的对象映射到`STUDENT_INFO_SYSTEM.dbm`物理数据模型：\n\
    - 1. 点击*文件* -> *新建* -> *映射模型*。此时会打开映射编辑器向导。\n- 2. 完成“创建映射”页面：\n  - a. 确保在*目标文件夹*字段中已指定*大学信息系统*数据设计项目。\n\
    \  - b. 在*文件名*字段中指定`STUDENT_MAPPING.msl`。\n  - c. 确保已选中*为此模型启用脚本生成*选项，这样你就能创建SQL脚本来部署映射。\n\
    \  - d. 点击*下一步*。\n- 3. 完成“指定映射源”页面：\n  - a. 点击*添加*按钮。此时会打开“选择映射源”窗口。\n  - b. 选择`NEW_STUDENT_INFO_SYS.dbm`物理数据模型文件，然后点击*确定*。该映射源文件会被添加到*映射源文件*列表中。\n\
    \  - c. 点击*下一步*。\n- 4. 不要更改“指定映射目标”页面上的任何选项，然后点击*下一步*。\n- 5. 完成“指定映射目标”页面：\n \
    \ - a. 点击*添加*按钮。此时会打开“选择映射目标”窗口。\n  - b. 选择`STUDENT_INFO_SYSTEM.dbm`物理数据模型文件，然后点击*确定*。该映射目标文件会被添加到*映射目标文件*列表中。\n\
    \  - c. 确保已选中*映射目标架构*列表中的所有对象。\n  - d. 点击*下一步*。\n- 6. 在“新建映射模型摘要”页面上验证你的选项，然后点击*完成*。映射模型文件会创建在你数据设计项目的*映射*文件夹中，并会在编辑器视图中打开。\n\
    \n映射编辑器包含三个窗格，如*图8.2*所示：\n- **源**：此窗格包含源文件和架构。\n- **映射**：此窗格会显示映射模型内的映射和映射组。\n\
    - **目标**：此窗格包含目标文件和架构。\n![](img/38311ad87170342fd88ee1165fee68b0_146_0.png)\n\
    ### **图8.2 – 了解映射编辑器**\n### 8.2.2 向映射模型添加映射\n你可以从映射编辑器中，在源架构和目标架构之间创建映射。你可以通过两种方式创建映射：\n\
    - **手动添加映射**：在*源*和*目标*窗格中选择对象，然后在它们之间创建映射。\n- **让工作台自动发现映射**：运行“发现关系”向导，确定数据对象之间的最佳映射。\n\
    #### 8.2.2.1 手动创建映射\n手动创建映射时，你可以确保每个源对象都映射到目标数据模型中对应的合适对象。这个过程可能比较耗时，但对于小型数据模型，这有时是最佳方法。让我们尝试手动创建映射，创建两个映射：\n\
    - 1. 映射`STUDENT.STUDENT_ID`列：\n  - a. 在*源*窗格中左键点击选中`STUDENT.STUDENT_ID`列。\n  -\
    \ b. 在*目标*窗格中左键点击选中`STUDENT.STUDENT_ID`列。选中的列会显示在*图8.3*的图片中。\n  ![](img/38311ad87170342fd88ee1165fee68b0_147_0.png)\n\
    \  ### **图8.3 – 选择源和目标对象**\n  - c. 在映射编辑器的任意位置右键点击，然后选择*创建映射*。映射会被创建并显示在映射编辑器中，如*图8.4*所示。\n\
    \  ![](img/38311ad87170342fd88ee1165fee68b0_147_1.png)\n  ### **图8.4 – 映射编辑器中新建的映射**\n\
    - 2. 使用上述流程映射`STUDENT.FIRST_NAME`列。此时映射编辑器应如*图8.5*的图片所示。\n  ![](img/38311ad87170342fd88ee1165fee68b0_148_0.png)\n\
    \  ### **图8.5 – 创建另一条新映射**\n- 3. 保存你的工作。\n#### 8.2.2.2 自动发现关系\n当你处理大型数据模型时，识别异构数据源之间的关系非常繁琐且耗时。此外，细微的关系也不总是容易识别。你可以使用工作台内的“发现关系”向导，基于特定算法为你完成这项任务。\n\
    > **注意：** 你可以从“首选项”窗口修改关系的发现方式。点击*窗口 -> 首选项*。“首选项”窗口会打开。展开*数据管理*节点，然后选择*映射编辑器*\
    \ -> *发现关系*来定义关系的发现规则。\n\n使用你现有的映射模型，发现两个数据模型中对象之间的关系：\n- 1. 在映射模型的任意位置右键点击，然后选择*发现关系\
    \ -> 查找最佳匹配*。此时会打开“发现关系”窗口。\n- 2. 在*源*窗格中，选中**NEW_STUDENT_INFO_SYS.dbm**数据模型旁边的复选框。确保已选中该物理数据模型下的所有对象，如*图8.6*所示。\n\
    \  ![](img/38311ad87170342fd88ee1165fee68b0_149_0.png)\n  ### **图8.6 – 选择源窗格中的所有对象**\n\
    - 3. 在*目标*窗格中，选中**STUDENT_INFO_SYSTEM.dbm**数据模型旁边的复选框。确保已选中该物理数据模型下的所有对象。\n- 4.\
    \ 点击*完成*。发现流程会运行，你会看到一系列映射线，展示两个数据模型中对象之间的潜在关系。该结果如*图8.7*所示。\n  ![](img/38311ad87170342fd88ee1165fee68b0_149_1.png)\n\
    \  ### **图8.7 – 连接两个模型间数据对象的映射线**\n#### 8.2.2.3 接受和拒绝已发现的关系\n已发现的关系仅为潜在关系。在它们正式成为映射模型的一部分之前，你必须批准或拒绝这些映射。映射模型中的关系会按颜色编码。颜色代码由首选项窗口中“映射编辑器”页面的设置决定（该页面位于*数据管理*节点下）。注意，你创建的关系为蓝色或浅蓝色，具体取决于该关系是否被选中。在工作台中，这些被视为已接受的映射，是映射模型的已批准部分。未被选中的已发现映射为金色，选中后则显示为棕色。你可以选择映射来进行批准或拒绝操作。如果你拒绝某条映射，该映射线会从映射模型中消失。\n\
    \n首先，你会手动批准几条关系。接着，你会检查剩余的关系，并决定是否接受这些映射。\n\n接受或拒绝已发现关系的操作步骤：\n- 1. 选中`STUDENT.LAST_NAME`关系的映射。映射线会变为棕色，已发现的映射会显示在“属性”视图中。\n\
    - 2. 在映射线上右键点击，然后选择*接受映射*，如*图8.8*所示。\n  ![](img/38311ad87170342fd88ee1165fee68b0_150_0.png)\n\
    \  此时映射线的颜色会变为蓝色。\n- 3. 使用上述步骤1和2所述的方法，批准`STUDENT.STUDENT_SSN`和`STUDENT.EMAIL_ADDR`的映射。\n\
    - 4. 保存你的工作。\n\n此时，你大概已经意识到，对于大型数据模型，这可能是一个繁琐的过程。现在你已经熟悉了如何手动接受或拒绝映射，你可以查看剩余的映射，并决定是否接受所有提议的映射。\n\
    - 5. 展开*源*和*目标*窗格中的所有表节点。此时编辑器应如*图8.9*的图片所示。\n"
