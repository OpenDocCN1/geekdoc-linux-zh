- md: '## 6.2 An insight into reporting

    The reporting feature of IBM InfoSphere Data Architect allows you to generate
    reports that help you analyze a data model or a package. There are various built-in
    templates available in IBM InfoSphere Data Architect which can be used to generate
    a report. You will see the information related to various built-in templates in
    IBM InfoSphere Data Architect in the next section.

    Reporting in IBM InfoSphere Data Architect is done via two methods:

    - Business Intelligence Reporting Tool (BIRT) reporting

    - XSLT reporting

    *BIRT reports* are a widely used reporting format in IBM InfoSphere Data Architect.
    It gives greater flexibility and more options for the output format of a report.
    It supports multiple output formats. *XSLT reports* only support PDF output.

    IBM InfoSphere Data Architect supports various built-in templates to generate
    reports for your logical, physical, glossary and mapping models. The file extension
    for a BIRT report template is `.rptdesign`, and for an XSLT report, the file extension
    is `.xsl`.

    > **Note:** You can also create your own report templates. You will create one
    later in the Exercise section of this chapter.


    ## 6.3 Generating a BIRT Report

    Let''s learn how to create a BIRT report by using an existing data model. We will
    use the existing `STUDENT_INFO_SYSTEM.dbm` physical data model to create a report
    in HTML format with the *Physical Data Model* report type.

    First, you will see how easy it is to generate a physical data model report. Then,
    you will learn how to customize your reports by using the Report Design perspective
    to specify the data objects for which to create a report.


    ### 6.3.1 Generating a basic physical data model report

    When you create a report model template, you can re-use them to produce reports
    that contain the same information and basic formatting. This helps you provide
    a consistent experience when presenting model reports to business process owners.

    Use the Report Configurations window to create a report of your existing physical
    data model:

    1. Click *Run* -> *Report* -> *Report Configurations*. The Report Configurations
    window opens.

    2. Double-click the *BIRT Report* option in the left pane. A new report configuration
    is created and opens in the Report Configurations window.

    3. Specify the options for the report:

    - a. In the *Name* field, specify `SDT_Info_Sys`.

    - b. If it is not already selected, select the *Built-in* radio button, then click
    *Browse*. The Select **Built-In Report** window opens.

    - c. Expand the *Physical Data Model Reports* node, then select *Physical Data
    Model Report*. Click *OK* to add the report to the configuration.

    - d. In the *Report Data* section, in the *Data Sources* field, select the *Data
    Source* option, then click the *Add* button. The Load Resource window opens.

    - e. Click the *Browse Workspace* button, then expand the *University Info System*
    node and select the **STUDENT_INFO_SYSTEM.dbm** physical data model. Click *OK*.

    - f. Click *OK* to add the physical data model to the report configuration.

    - g. Click the *Workspace* button to specify a location to save the report. The
    Select Report Output Location window opens.

    - h. In the *File name* field, specify **SDT_Info_Sys_Rpt**, then click *OK*.

    **4.** Click *Report* to generate the report. The report is generated and opens
    in your default browser.

    As you can see, it''s a somewhat generic report, and it contains all of the information
    about your physical data model. IBM InfoSphere Data Architect also allows you
    to customize your report designs, making it even easier for you and your teams
    to make sense of the data model. Let''s create a new report configuration to showcase
    important information about the columns in your physical data model. Before you
    create the report configuration, you will set up the workbench environment to
    design the report. You will work in the Report Design perspective to create a
    report that displays the information about the physical data model in a report
    that you can then share with other members of your team. This report is useful
    to analyze the structure of the data model and place it in a more visual, understandable
    format.


    ### 6.3.2 Setting up the reporting environment

    First, let''s set up the report environment to design the report:

    **1.** Open the Report Explorer view:

    - a. Click *Window* -> *Show View* -> *Other*. The Show View window opens.

    - b. Expand the *Reporting* node, then select the Report Explorer option. The
    Report Explorer view opens, and you see a list of report templates.

    **2.** Copy the *Blank **Physical** Data Model Report (BlankPhysicalModel.rptdesign)*
    template to the *Other Files* folder:

    - a. In the Report Explorer view, expand the *Physical Data Model* node, then
    right-click *Blank physical Data Model Report (BlankPhysicalModel.rptdesign)*
    and select *Copy*.

    - b. In the Data Project Explorer, expand the *University Info System* folder,
    right-click the *Other Files* folder and select *Paste*.

    - c. In the Data Project Explorer, right-click *University Info System* -> *Other
    Files* -> *BlankPhysicalModel.rptdesign* and click *Rename*. The Rename Resource
    window opens.

    - d. In the Rename Resource window, specify **SDT_Info_Sys_custom** for the new
    resource name and click *OK*.

    **3.** Open the Report Design perspective:

    - a. From the main menu, click *Window* -> *Open Perspective* -> *Other*. The
    Open Perspective window opens.

    - b. In the Open Perspective window, select *Report Design*. The perspective opens.
    The Palette, Data Explorer, Outline, and Property Editor views are empty until
    you open a report design in the Report Editor view. Not all of the views are visible.
    For example, the Navigator and Outline views are configured so that only one view
    is visible. Click the tab to display the other view.

    **4.** Open the **SDT_Info_Sys_custom.rptdesign** file in the Report Editor view:

    - a. Open the Navigator view, located in the bottom half of the left pane by default.

    - b. Expand the University Info System folder and double-click the **SDT_Info_Sys_custom.rptdesign**
    file. The report opens in the Report Editor, as shown in *Figure 6.2*.

    ![](img/38311ad87170342fd88ee1165fee68b0_110_0.png)

    **Figure 6.2 – Opening the report in the report editor**

    **5.** Add the **STUDENT_INFO_SYSTEM.dbm** physical data model as a BIRT data
    source:

    - a. Locate the Data Explorer, located in the top half of the left pane by default.

    - b. In the Data Explorer, expand the *Data Sources* folder, then right-click
    the *Data Source* object and click *Edit*. The Edit Data Source - Data Source
    window opens.

    - c. On the *Models* page, in the *Instance models* section, click *Add*. The
    Load Resource window opens.

    - d. In the Load Resource window, click *Browse workspace*. The File Selection
    window opens.

    - e. Select **STUDENT_INFO_SYSTEM.dbm** under the *University Info System* node
    and click *OK*. This is shown in Figure 6.3.

    ![](img/38311ad87170342fd88ee1165fee68b0_111_0.png)

    # Figure 6.3 – Selecting the physical data model

    - f. Click *OK* to load the data model resource.

    - g. Click *OK* to save the data source.

    **5.** Save your work. The **STUDENT_INFO_SYSTEM** physical data model file is
    added as a BIRT data source. The report environment is now set up for you to start
    drafting your BIRT reports.


    ### 6.3.3 Adding data objects to a report

    You have a blank report. In order to report on the information in the data model,
    you should add data objects to this report. Let''s start by creating a table that
    lists the columns in the tables of your schema:

    **1.** First, add a title to the report:

    - a. Open the Palette view by clicking the *Palette* tab, found in the top half
    of the left pane by default.

    - b. From the Palette view, select and drag a *Label* element into the *Layout*
    page of the Report Editor.

    - c. Double-click the label in the Report Editor and enter the following text
    for the label: `Table and column report`.

    - d. In the Property Editor, select the *General* tab.

    - e. Set the font weight to **bold**.

    - f. Align the text in the center of the label. Click the *Center* button. The
    General tab should look like the following image:

    ![](img/38311ad87170342fd88ee1165fee68b0_112_0.png)

    **Figure 6.4** – Specifying text properties for a label

    **2.** Add a BIRT report table to the report:

    - a. From the Palette view, drag a *Table* element into the *Layout* window after
    the report title. The Insert Table window opens.

    - b. Set the number of columns to 2.

    - c. Specify *Column* from the list of data set options. A two-column table is
    inserted into the report. The table contains a header row, a detail row, and a
    footer row. The Column data set is associated with the report table.

    > **Note**: The Column data set is a predefined data set in the report design.
    In the Data Explorer view, you can see the data sets that are defined for the
    report design.

    **3.** Specify a name for the report table, and update the format of the table:

    - a. Open the Outline view, found in the bottom half of the left pane by default.

    - b. Click *SDT_Info_Sys_custom.rptdesign* -> *Body* -> *Table*.'
  mdcn: "\n## 6.2 报表功能概览\nIBM InfoSphere Data Architect 的报表功能可帮助你生成报表，用于分析数据模型或数据包。IBM\
    \ InfoSphere Data Architect 内置了多种可用于生成报表的模板，你可以在下一节中了解与这些内置模板相关的信息。\nIBM InfoSphere\
    \ Data Architect 中的报表生成可通过两种方式实现：\n- 商业智能报表工具（BIRT）报表\n- XSLT 报表\n*BIRT 报表*是 IBM\
    \ InfoSphere Data Architect 中广泛使用的报表格式，具备更高的灵活性，支持更多报表输出格式选项，可输出多种格式的文件。*XSLT\
    \ 报表*仅支持 PDF 输出。\nIBM InfoSphere Data Architect 支持多种内置模板，可用于为逻辑模型、物理模型、术语表和映射模型生成报表。BIRT\
    \ 报表模板的文件扩展名为`.rptdesign`，XSLT 报表的文件扩展名为`.xsl`。\n> **注意：** 你也可以创建自定义报表模板，相关内容将在本章练习部分后续介绍。\n\
    \n## 6.3 生成 BIRT 报表\n接下来我们将学习如何使用现有数据模型创建 BIRT 报表，这里将使用现有的`STUDENT_INFO_SYSTEM.dbm`物理数据模型，以*物理数据模型*报表类型创建\
    \ HTML 格式的报表。\n首先，你会了解到生成物理数据模型报表十分简单，之后你将学习如何通过报表设计透视图自定义报表，指定需要生成报表的数据对象。\n\n\
    ### 6.3.1 生成基础物理数据模型报表\n创建报表模型模板后，你可以重复使用该模板生成包含相同信息与基础格式的报表，这有助于你在向业务流程负责人展示模型报表时提供一致的体验。\n\
    使用「报表配置」窗口为现有物理数据模型创建报表：\n1. 点击*运行* -> *报表* -> *报表配置*，「报表配置」窗口随即打开。\n2. 在左侧面板中双击*BIRT\
    \ 报表*选项，此时会创建新的报表配置，并在「报表配置」窗口中打开。\n3. 指定报表相关选项：\n   - a. 在*名称*字段中指定`SDT_Info_Sys`。\n\
    \   - b. 若未默认选中该选项，选择*内置*单选按钮，然后点击*浏览*，「选择**内置报表**」窗口随即打开。\n   - c. 展开*物理数据模型报表*节点，然后选择*物理数据模型报表*，点击*确定*将报表添加到配置中。\n\
    \   - d. 在*报表数据*分区下的*数据源*字段中，选择*数据源*选项，然后点击*添加*按钮，「加载资源」窗口随即打开。\n   - e. 点击*浏览工作区*按钮，展开*University\
    \ Info System*节点，选择**STUDENT_INFO_SYSTEM.dbm**物理数据模型，然后点击*确定*。\n   - f. 点击*确定*将物理数据模型添加到报表配置中。\n\
    \   - g. 点击*工作区*按钮指定报表的保存位置，「选择报表输出位置」窗口随即打开。\n   - h. 在*文件名*字段中输入**SDT_Info_Sys_Rpt**，然后点击*确定*。\n\
    **4.** 点击*报表*生成报表，报表生成后将在默认浏览器中打开。\n如你所见，这是一份较为通用的报表，包含了物理数据模型的所有相关信息。IBM InfoSphere\
    \ Data Architect 还支持自定义报表设计，让你和你的团队更轻松地理解数据模型。接下来我们将创建新的报表配置，展示物理数据模型中列的重要信息。在创建报表配置前，你需要先配置工作台环境以设计报表，你将在报表设计透视图中创建报表，将物理数据模型的信息整合到报表中，供团队其他成员共享。该报表可用于分析数据模型的结构，并将其以更直观、易理解的格式呈现。\n\
    \n### 6.3.2 配置报表环境\n首先，我们先配置报表环境以设计报表：\n**1.** 打开「报表资源管理器」视图：\n- a. 点击*窗口* ->\
    \ *显示视图* -> *其他*，「显示视图」窗口随即打开。\n- b. 展开*报表*节点，然后选择「报表资源管理器」选项，「报表资源管理器」视图随即打开，你将看到报表模板列表。\n\
    **2.** 将*空白**物理**数据模型报表（BlankPhysicalModel.rptdesign）*模板复制到*其他文件*文件夹：\n- a. 在「报表资源管理器」视图中，展开*物理数据模型*节点，右键点击*空白物理数据模型报表（BlankPhysicalModel.rptdesign）*，选择*复制*。\n\
    - b. 在数据项目浏览器中，展开*University Info System*文件夹，右键点击*其他文件*文件夹，选择*粘贴*。\n- c. 在数据项目浏览器中，右键点击*University\
    \ Info System* -> *其他文件* -> *BlankPhysicalModel.rptdesign*，点击*重命名*，「重命名资源」窗口随即打开。\n\
    - d. 在「重命名资源」窗口中，为新资源指定名称**SDT_Info_Sys_custom**，然后点击*确定*。\n**3.** 打开报表设计透视图：\n\
    - a. 从主菜单中，点击*窗口* -> *打开透视图* -> *其他*，「打开透视图」窗口随即打开。\n- b. 在「打开透视图」窗口中选择*报表设计*，透视图随即打开。在报表编辑器视图中打开报表设计前，「面板」「数据浏览器」「大纲」和「属性编辑器」视图均为空。并非所有视图都可见，例如「导航器」和「大纲」视图默认仅显示其中一个，点击对应标签可切换到另一视图。\n\
    **4.** 在报表编辑器视图中打开**SDT_Info_Sys_custom.rptdesign**文件：\n- a. 打开「导航器」视图，该视图默认位于左侧面板的下半区域。\n\
    - b. 展开 University Info System 文件夹，双击**SDT_Info_Sys_custom.rptdesign**文件，报表将在报表编辑器中打开，如*图\
    \ 6.2*所示。\n![](img/38311ad87170342fd88ee1165fee68b0_110_0.png)\n**图 6.2 – 在报表编辑器中打开报表**\n\
    **5.** 将**STUDENT_INFO_SYSTEM.dbm**物理数据模型添加为 BIRT 数据源：\n- a. 找到「数据浏览器」视图，该视图默认位于左侧面板的上半区域。\n\
    - b. 在「数据浏览器」中，展开*数据源*文件夹，右键点击*数据源*对象，点击*编辑*，「编辑数据源 - 数据源」窗口随即打开。\n- c. 在*模型*页面的*实例模型*分区中，点击*添加*，「加载资源」窗口随即打开。\n\
    - d. 在「加载资源」窗口中，点击*浏览工作区*，「文件选择」窗口随即打开。\n- e. 在*University Info System*节点下选择**STUDENT_INFO_SYSTEM.dbm**，点击*确定*，结果如*图\
    \ 6.3*所示。\n![](img/38311ad87170342fd88ee1165fee68b0_111_0.png)\n# 图 6.3 – 选择物理数据模型\n\
    - f. 点击*确定*加载数据模型资源。\n- g. 点击*确定*保存数据源。\n**5.** 保存你的工作。**STUDENT_INFO_SYSTEM**物理数据模型文件已被添加为\
    \ BIRT 数据源，现在报表环境已配置完成，你可以开始起草 BIRT 报表了。\n\n### 6.3.3 向报表添加数据对象\n你现在有一份空白报表，若要报表展示数据模型中的信息，需要向报表中添加数据对象。接下来我们先创建一张表格，列出你架构中所有数据表的列信息：\n\
    **1.** 首先向报表添加标题：\n- a. 点击*面板*标签打开「面板」视图，该标签默认位于左侧面板的上半区域。\n- b. 在「面板」视图中，选择*标签*元素，将其拖拽到报表编辑器的*布局*页面中。\n\
    - c. 在报表编辑器中双击该标签，输入以下标签文本：`Table and column report`。\n- d. 在「属性编辑器」中，选择*常规*标签。\n\
    - e. 将字体粗细设置为**粗体**。\n- f. 将标签内的文本居中对齐，点击*居中*按钮，「常规」标签的界面应如下图所示：\n![](img/38311ad87170342fd88ee1165fee68b0_112_0.png)\n\
    **图 6.4** – 指定标签的文本属性\n**2.** 向报表添加 BIRT 报表表格：\n- a. 在「面板」视图中，将*表格*元素拖拽到报表标题后的*布局*窗口中，「插入表格」窗口随即打开。\n\
    - b. 将列数设置为 2。\n- c. 从数据集选项列表中选择*列*，此时报表中会插入一个两列表格。该表格包含表头行、明细行和表脚行，并且列数据集会关联到该报表表格。\n\
    > **注意：** 列数据集是报表设计中的预定义数据集，你可以在「数据浏览器」视图中查看为该报表设计定义的所有数据集。\n**3.** 为报表表格指定名称，并更新表格格式：\n\
    - a. 打开「大纲」视图，该视图默认位于左侧面板的下半区域。\n- b. 点击*SDT_Info_Sys_custom.rptdesign* -> *主体*\
    \ -> *表格*。\n"
