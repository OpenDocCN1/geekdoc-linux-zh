    \ more other attributes to the STUDENT entity. Add the following attributes to\
    \ the STUDENT entity:\n1. Add the FIRST NAME attribute. The attribute has a data\
    \ type of VARCHAR(20) and is required.\n2. Add the LAST NAME attribute. The attribute\
    \ has a data type of VARCHAR(50) and is required.\n3. Add the START DATE attribute.\
    \ The attribute has a data type of DATE.\n4. Add the GRADUATION DATE attribute.\
    \ The attribute has a data type of DATE.\n5. Save your work.\n\nYou have used\
    \ the diagram editor to create a complete entity, as seen in *Figure 3.8*. Now\
    \ let's learn how to use the Data Project Explorer to create another entity.\n\
    \n> **Figure 3.8 – Complete STUDENT entity**\n\n### 3.2.2.7 Creating entities\
    \ in the Data Project Explorer\n\nLet's use the Data Project Explorer view to\
    \ create a new entity, **GRADE** to store information about student grades. To\
    \ create entities with the Data Project Explorer view:\n1. Locate the `STUDENT_INFO_SYSTEM.ldm`\
    \ data model in the Data Project Explorer by expanding the folders in the project:\
    \ *University Info System* -> *Data Models* -> *STUDENT_INFO_SYSTEM.ldm*.\n2.\
    \ Create the GRADE entity.\n   a. Right-click the *STUDENT INFO SYSTEM* package\
    \ under the logical data model, then select *Add Data Object* -> *Entity*.\n \
    \  b. Name the new entity **GRADE** by making sure the entity is selected in the\
    \ Data Project Explorer, then open the **General** tab of the Properties view\
    \ and change the name and label to **GRADE**. The entity is created under the\
    \ *STUDENT INFO SYSTEM* package. Note that the entity does not appear in the diagram\
    \ editor. This is because you did not create the entity within the diagram. Only\
    \ objects that you create or drag to the diagram appear in the diagram editor.\
    \ To better visualize how the data is connected, add the entity to the diagram.\n\
    3. Add the new entity to the diagram:\n   a. Select the GRADE entity in the Data\
    \ Project Explorer.\n   b. Drag the entity from the Data Project Explorer to a\
    \ blank space in the diagram editor. When you release the mouse button, the entity\
    \ is added to the diagram.\n4. Select the GRADE entity.\n5. Add the following\
    \ attributes to the GRADE entity:\n   - STUDENT ID: Use the same properties that\
    \ you used to create the STUDENT ID attribute for the STUDENT entity.\n   - COURSE\
    \ ID: Use the CHAR(8) data type. This is also a primary key.\n   - SCORE PASSFAIL:\
    \ Use the BOOLEAN data type. This attribute is required.\n   - SCORE TOTAL: Use\
    \ the DECIMAL data type, with a length/precision of 3 and a scale of 0. This attribute\
    \ is required.\n\nYou have created the GRADE entity. In some cases a composite\
    \ key is needed. A *composite key* is a primary key that is made up of more than\
    \ one attribute. Composite keys help make sure that your primary keys are always\
    \ unique without duplicating existing attributes. For example, to make the GRADE\
    \ entity unique, you need a composite primary key: STUDENT ID and COURSE ID. This\
    \ is shown in *Figure 3.9*.\n\n> **Figure 3.9 – Creating a composite key in the\
    \ Properties view**\n\n> **Note:** When you delete objects from the diagram, they\
    \ are not deleted from the data model. Use the Data Project Explorer to remove\
    \ data objects from your data models.\n\n### 3.2.3 Adding relationships\n\nNow\
    \ that you have created the two entities in this diagram, you need to specify\
    \ how the entities are related. Since the information in this model is related\
    \ to the student, the STUDENT entity is the parent entity. Just as you can create\
    \ entities within the diagram, you can also specify the relationships between\
    \ data objects by using the diagram editor. Relationship types are identifying\
    \ and non-identifying. In an *identifying* relationship, one of the child entities\
    \ is a dependent entity. A dependent entity is an entity whose existence is based\
    \ on the existence of another set of entities. A *non-identifying* relationship\
    \ is one in which both entities are independent (also known as strong relationship\
    \ set). Create a non-identifying optional relationship between the STUDENT entity\
    \ and the GRADE entity:\n\n1. Display all key and non-key attributes in each entity:\n\
    \   a. Click on a blank part of the diagram. The properties of the diagram display\
    \ in the Properties view.\n   b. On the *Filters* tab of the Properties view,\
    \ select the *Show key* and *Show non-key* check boxes.\n2. Use the diagram to\
    \ create a *Non-Identifying Optional* relationship from the STUDENT entity to\
    \ the GRADE entity:\n   a. In the palette, under the *Data* section, select the\
    \ *Non-Identifying Optional* data object.\n   b. In the diagram editor, select\
    \ the STUDENT entity, drag the mouse cursor to the GRADE entity, then release\
    \ the mouse button.\n   c. Since the STUDENT ID attribute exists in both entities,\
    \ you are asked to specify how to address the attribute. In this case, choose\
    \ the *Replace with migrated FK attribute/column* option to ensure that both attributes\
    \ are the same. The relationship is created in the model and depicted in the diagram.\n\
    Now you should describe the relationship. Remember that the diagram is just a\
    \ visual representation of the metadata in the model; therefore the relationship\
    \ is also created in the logical data model. When you \"describe\" this relationship,\
    \ you explain with verb phrases how these entities interact in the real world.\
    \ In this case, you might explain that each student has more than one grade, because\
    \ they take more than one class. Also, a single grade is given to each student\
    \ for each class. Therefore, the cardinality of the relationship is a *one-to-many*\
    \ relationship.\n3. Describe the relationship, using the Properties view:\n  \
    \ a. Select the relationship object on the data diagram, as shown in *Figure 3.10*:\n\
    \n> **Figure 3.10 – Selecting the relationship object**\nThe properties of the\
    \ relationship object display in the Properties view.\nb. Open the *Details* tab\
    \ of the Properties view.\nc. Enter verb phrases to describe the relationship\
    \ between the parent and child entities:\n- GRADE: **is given**\n- STUDENT: **receives**\n\
    The relationship is defined in the Properties view, as shown in *Figure 3.11*.\n\
    \n> **Note** All foreign key attributes are automatically constructed. You are\
    \ not prompted to migrate the key attribute if you do not have a corresponding\
    \ attribute of the same name in the child entity.\n\n> **Figure 3.11 – Defining\
    \ the relationship within the Properties view**\n\nIn the Properties view, it\
    \ is possible to choose the type of relationship, participation, and cardinality.\n\
    4. Explore the other tabs in the Properties view to see what other information\
    \ you can define:\n   a. Open the *Type* tab. Make sure that the following options\
    \ are defined:\n      - *Relationship Type*: Non-identifying\n      - *Existence*:\
    \ Optional\n      - *Cardinality*: One or more\n   b. Use the *Referential Integrity*\
    \ tab to specify what should happen to the child entity when you update the primary\
    \ key of the parent entity of the relationship. Make sure that the *Delete* option\
    \ is set to CASCADE in the *Parent Action* group. The *Referential Integrity*\
    \ tab should look like the image in *Figure 3.12*:\n\n> **Figure 3.12 – Specifying\
    \ a CASCADE action on the child GRADE entity**\n\n*Table 3.1* specifies what will\
    \ happen when you specify each action. You draft these requirements in the logical\
    \ data model, and when you deploy the physical data model, these actions will\
    \ occur when the referenced data objects are updated.\n\n| Action | Definition\
    \ |\n|--------|------------|\n| NONE | No action occurs. The delete or update\
    \ action is rolled back. |\n| RESTRICT | The parent entity is not deleted, nor\
    \ its key updated, because there are dependent entities that rely on this entity.\
    \ |\n| CASCADE | If the modified parent entity has a foreign-key relationship\
    \ to the other entity in the relationship, the foreign-key reference to the dependent\
    \ entity is updated. If the entity is deleted, and the delete action is set to\
    \ CASCADE, the dependent entity is removed from all relationships (in other words,\
    \ deleted). |\n| SET_NULL | If the modified parent entity has a foreign-key relationship\
    \ to the other entity in the relationship, each nullable foreign-key attribute\
    \ of each dependent entity is set to NULL. This option can only be specified if\
    \ all foreign-key attributes allow NULL |"
  mdcn: "\n**注意：** 如果你不知道选择什么数据类型，请记住以下几点考量：\n- 如果某个属性或列用于算术计算，请使用数值数据类型。\n- 其他所有属性使用文本数据类型，原因如下：\n\
    \  - 文本数据类型更灵活；例如，你可以使用约束来降低数据存储开销。\n  - 你可以更好地控制文本数据类型的输入，因为DB2为字符串数据类型提供了更多函数。不过，如果你希望主键也为数值类型（例如代理键也属于数值型），有时也应使用数值数据类型。\n\
    注意，当你向实体添加属性时，图表也会同步更新。现在学生ID（STUDENT ID）实体将显示在图表中学生（STUDENT）实体的主键区域，旁边带有图标，用于标识学生ID是该实体的主键。按照上述相同流程，你可以为学生实体添加更多其他属性。请向学生实体添加以下属性：\n\
    1. 添加名字（FIRST NAME）属性。该属性数据类型为`VARCHAR(20)`，且为必填项。\n2. 添加姓氏（LAST NAME）属性。该属性数据类型为`VARCHAR(50)`，且为必填项。\n\
    3. 添加入学日期（START DATE）属性。该属性数据类型为`DATE`。\n4. 添加毕业日期（GRADUATION DATE）属性。该属性数据类型为`DATE`。\n\
    5. 保存你的工作。你已经使用图表编辑器创建了一个完整的实体，如*图3.8*所示。现在我们来学习如何使用数据项目浏览器创建另一个实体。\n> **图3.8\
    \ – 完整的学生实体**\n### 3.2.2.7 在数据项目浏览器中创建实体\n我们来使用数据项目浏览器视图创建新的**GRADE（成绩）**实体，用于存储学生成绩相关信息。使用数据项目浏览器视图创建实体的步骤如下：\n\
    1. 在数据项目浏览器中定位`STUDENT_INFO_SYSTEM.ldm`数据模型，展开项目中的文件夹即可找到：*大学信息管理系统（University\
    \ Info System）* -> *数据模型（Data Models）* -> `STUDENT_INFO_SYSTEM.ldm`。\n2. 创建GRADE实体：\n\
    \   a. 在逻辑数据模型下的*学生信息管理系统（STUDENT INFO SYSTEM）*包上点击右键，然后选择*添加数据对象* -> *实体*。\n\
    \   b. 选中数据项目浏览器中的新实体，打开属性视图的**常规**选项卡，将名称和标签都改为**GRADE**，即可完成命名。该实体会创建在*学生信息管理系统*包下。注意，该实体不会显示在图表编辑器中，因为你没有在图表内创建该实体。只有你在图表中创建或拖入的对象才会显示在图表编辑器中。为了更好地可视化数据关联，请将该实体添加到图表中。\n\
    3. 将新实体添加到图表：\n   a. 在数据项目浏览器中选中GRADE实体。\n   b. 将该实体从数据项目浏览器拖到图表编辑器的空白区域，松开鼠标按键后，实体就会被添加到图表中。\n\
    4. 选中GRADE实体。\n5. 向GRADE实体添加以下属性：\n   - 学生ID（STUDENT ID）：使用和学生实体创建学生ID属性时相同的配置。\n\
    \   - 课程ID（COURSE ID）：使用`CHAR(8)`数据类型。这也是一个主键。\n   - 是否通过成绩（SCORE PASSFAIL）：使用`BOOLEAN`数据类型。该属性为必填项。\n\
    \   - 总成绩（SCORE TOTAL）：使用`DECIMAL`数据类型，长度/精度为3，小数位数为0。该属性为必填项。\n你已经创建了GRADE实体。某些情况下需要用到复合键。*复合键*是由多个属性组合而成的主键。复合键可以确保主键始终唯一，无需重复现有属性。例如，要让GRADE实体具备唯一性，你需要一个复合主键：学生ID和课程ID。相关示例如*图3.9*所示。\n\
    > **图3.9 – 在属性视图中创建复合键**\n> **注意：** 从图表中删除对象时，不会从数据模型中删除该对象。请使用数据项目浏览器从数据模型中移除数据对象。\n\
    ### 3.2.3 添加关联\n现在你已经在这张图表中创建了两个实体，接下来需要明确两个实体的关联关系。由于本模型中的信息和学生相关，因此学生实体是父实体。就像你可以在图表内创建实体一样，你也可以通过图表编辑器指定数据对象之间的关联关系。关联类型分为标识型和非标识型。在*标识型*关联中，子实体之一是依赖实体。依赖实体是指其存在基于另一组实体存在的实体。*非标识型*关联是指两个实体相互独立（也称为强关联集）的情况。请在学生实体和成绩实体之间创建非标识型可选关联：\n\
    1. 显示每个实体中的所有主键和非主键属性：\n   a. 点击图表的空白区域，属性视图中会显示图表的属性。\n   b. 在属性视图的*筛选器*选项卡中，勾选*显示主键*和*显示非主键*复选框。\n\
    2. 使用图表从学生实体到成绩实体创建*非标识型可选*关联：\n   a. 在面板的*数据*分类下，选择*非标识型可选*数据对象。\n   b. 在图表编辑器中选中学生实体，将鼠标光标拖到成绩实体上，然后松开鼠标按键。\n\
    \   c. 由于学生ID属性同时存在于两个实体中，系统会提示你指定如何处理该属性。本例中选择*替换为迁移的外键属性/列*选项，确保两个属性的配置完全一致。该关联会被创建到模型中，并显示在图表中。\n\
    现在你需要描述该关联。请记住，图表只是模型中元数据的可视化呈现，因此关联也会被创建到逻辑数据模型中。当你“描述”该关联时，你需要用动词短语解释这些实体在现实世界中的交互方式。在本例中，你可以解释为：每个学生有多门成绩，因为他们修多门课程；同时，每门课程会给每个学生对应一个成绩。因此，该关联的基数是一对多*关联。\n\
    3. 使用属性视图描述该关联：\n   a. 在数据图表上选中关联对象，如*图3.10*所示：\n   > **图3.10 – 选中关联对象**\n   属性视图中会显示关联对象的属性。\n\
    \   b. 打开属性视图的*详情*选项卡。\n   c. 输入动词短语描述父实体和子实体之间的关联：\n   - 成绩（GRADE）：**被授予**\n\
    \   - 学生（STUDENT）：**获得**\n   该关联已在属性视图中完成定义，如*图3.11*所示。\n> **注意** 所有外键属性都会自动构建。如果子实体中没有对应名称的属性，系统不会提示你迁移主键属性。\n\
    > **图3.11 – 在属性视图中定义关联**\n在属性视图中，你可以选择关联类型、参与约束和基数。\n4. 浏览属性视图的其他选项卡，查看你还可以定义哪些其他信息：\n\
    \   a. 打开*类型*选项卡。确保以下选项已配置：\n   - *关联类型*：非标识型\n   - *存在性*：可选\n   - *基数*：一个或多个\n\
    \   b. 使用*引用完整性*选项卡，指定更新关联的父实体主键时，子实体应执行的操作。确保在*父操作*分组中将*删除*选项设置为CASCADE。*引用完整性*选项卡的样式如*图3.12*所示：\n\
    \   > **图3.12 – 在成绩子实体上指定CASCADE操作**\n   *表3.1*列出了指定每种操作时会发生的情况。你在逻辑数据模型中起草这些需求，当部署物理数据模型时，这些操作会在引用的数据对象被更新时触发。\n\
    \n| 操作 | 定义 |\n|--------|------------|\n| NONE | 无操作发生。删除或更新操作会回滚。 |\n| RESTRICT\
    \ | 父实体不会被删除，其主键也不会被更新，因为存在依赖于此实体的子实体。 |\n| CASCADE | 如果被修改的父实体与该关联中的另一实体存在外键关联，则会更新对子实体的外键引用。如果实体被删除，且删除操作设置为CASCADE，则该子实体会从所有关联中移除（即被删除）。\
    \ |\n| SET_NULL | 如果被修改的父实体与该关联中的另一实体存在外键关联，则每个子实体的每个允许为NULL的外键属性会被设置为NULL。该选项仅在所有外键属性都允许为NULL时才能指定\
    \ |\n"
