  md: '# Toolkit Fundamentals


    In this section, I show you the tools for conducting a pen test to simulate malware
    attacks, which are attacks that cause destruction.


    # Antivirus software and other tools


    Tools such as Kali, Nessus (which I discuss further in the following section),
    Wireshark, and others can be used to scan for vulnerabilities in your systems,
    that you can mitigate the risks and the attacks.


    Destruction attacks — like all attacks — are hard to identify, so don''t limit
    your self to your pen test toolkit. You might also want to monitor antivirus (AV)
    management consoles, firewall logs, routers in the network (to see inbound and
    outbound traffic), and other tools (see Chapter 5) and Metasploit (see Chapter
    4).


    Most destruction attacks originate from malicious software (malware). Because
    of this, the best tool you have in your arsenal will be the antivirus platforms
    used in your enterprise. You will find that scanning for vulnerabilities with
    your toolkit will help, and I will explain when this will be relevant, but to
    identify and remove destructive hacks from your systems, you need to look outside
    of your toolkit to see the full picture.


