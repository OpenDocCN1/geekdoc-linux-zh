    # # Understanding Vectors and the Art of Hacking


    A solid understanding of how an attacker can penetrate and exploit your valuable
    resources is a necessity. But it''s a challenge because the technology is always
    changing and advancing. So do the types of attacks.


    For example, in the past you could set up a threat perimeter with a firewall and
    make sure all your internal devices were configured with antivirus protection
    to avoid malware attacks and assured your network was secure. Now, with wireless
    networks, mobile devices, the Internet of Things (IoT), cloud interfaces, and
    the sheer complexity of technology, a good firewall isn''t enough to keep your
    network secure.


    As we look into the future, things are going to get even more complicated. With
    IoT, you can imagine that just anything and everything can will be connected to
    a computer network.


    The basis where all hacks start from a vector. A vector (or path) of attack is
    how a hacker can get in. When every single device is connected to a computer network,
    it can be an entry point into safeguarded data or assets. The attack vector isn''t
    only widened, it''s also deeper. Consider these vectors in regard to your networks:


    +   * Through your protected (or unprotected) firewalls to the Internet

    * Through a router that connects your network to the outside world (public or
    private)

    * From an older dialup or other out-of-band access systems in your organization

    * Through an unsecured wireless connection inside your organization

    * From a device inside the network (similar to a black box solution) running a
    program such as Raspberry Pi'
