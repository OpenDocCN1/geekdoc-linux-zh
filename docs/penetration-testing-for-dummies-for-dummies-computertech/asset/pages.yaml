    OSI model.


    The protocols used in a suite (such as TCP/IP) map to the various layers of the
    model and perform different functions. For example, FTP operates at a higher layer
    in the model than TCP or IP. The theory is that, if the lower layers don''t work,
    then the higher layer protocols will not operate correctly. The OSI allows to
    troubleshoot problems in a workflow manager.


    Figure 1-3 shows a packet capture that shows a lot of the information you need
    to read through to conduct a pen test with a tool such as Wireshark. Here you
    can see packets when captured can be decoded to tell you the details within them.


    Having knowledge of these protocols, how and where they operate, and what is contained
    in the frames, headers, and inner details of the packet is what will make you
    a great pen tester. If you run a pen test and it reports back and forth in cleartext,
    you may find for example, that you have a vulnerability in telnet that''s to determine
    what a hacker might make. You can more easily make determination if you know the
    protocols work and what is expected behavior and what can be manipulated versus
    could be impacted by a software-bug. This way, you can test yourself first to
    identify whether an issue needs to be remediated or mitigated.


    ![](img/c028467b75a4f3372e49c00c9bd53148_26_0.png)


    I highly recommend that you study more on TCP/IP. It''s the main protocol suite
    in use today across the world; when it was first put into production many ago
    it came with many flaws. Its use is one of the biggest flaws and the fact that
    security was an afterthought before usability. That said, today''s networks and
    systems can account for these flaws, but there is always danger in shadows. Study
    TCP/IP and all of its sub-protocols and how they work to get better at testing
    weaknesses in your enterprise.


