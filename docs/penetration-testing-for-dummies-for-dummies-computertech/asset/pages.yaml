    # # Fragmentation Attacks


    A fragmentation attack (also known as an IP fragmentation attack or frag attack)
    is where IP fragmentation of packets causes a DoS Attack. By exploiting the natural
    design of TCP/IP, a hacker or ethical hacker can send pieces of data to a source
    device in hopes that it causes the DoS, or as a pen tester, shows you that you
    have a vulnerability to assess.


    Frag attacks use the actual protocols as manipulation points instead of the hard-resource
    available like the buffer.


    You can use tools such as Kali’s fragroute and fragmentation6 to conduct tests
    to identify whether you’re vulnerable to these types of attacks, as shown in Figure
    6–7.


    By using fragest (as shown in Figure 6–8), the Kali toolkit allows you to send
    the malformed packets to hosts to see how they respond. You might need to assess
    the hosts themselves while conducting these specific tests to identify whether
    the systems crash, become overwhelmed, or are disrupted.'
