    # # Cryptology and Encryption


    One of the most common attacks is password cracking, and the use of encryption
    can thwart many of the tools I discuss in this chapter. Keep the following points
    in mind as you dive into how encryption works:


    +   * Encryption is the process in which you cleartext data that you run through
    a protected cipher; this produces a key to decrypt (decode) the data. You want
    to protect the key, so when you transmit the data, only the recipient can decode
    and use it.


    +   * Cryptology is the study and work with encryption methods. Many consider
    it to be one of the hardest parts of learning security because it is complex and
    confusing.


    +   * Although you need to understand many concepts about encryption to exploit
    them, you can let the tool handle most of the work to run a pen test on encryption.
    You can view the reports to get an understanding of what the tool found and what
    risks you need to mitigate.


    +   * I cover some of the most common forms of encryption here at a very high
    level of how they are used and their practicality when running tests. This is
    not an all-inclusive discussion because encryption, the math involved, and all
    of the different ways it''s implemented could fill a 300-page book (at least).


    +   * If you are new to encryption, use this chapter to run the tools and reports.
    Later, you can study things as they start to appear in your reports. This is a
    springboard to learning more about encryption and its uses.


    Security analysts and pen testers like the CIA (confidentiality, integrity, and
    availability) tried to model security operations using encryption. By using this
    model, you can design any form of security using encryption whether you''re securing
    data in transit or at rest.


    When you transform data (typically with a transform set), it hides and makes the
    data. Figure 4–9 shows while accessing a website that is protected by encryption,
    all communications sent through are encrypted and can''t be read in cleartext
    if data is captured and reviewed.'
