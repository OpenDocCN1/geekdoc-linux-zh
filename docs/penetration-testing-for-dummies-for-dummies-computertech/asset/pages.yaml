    # Systems infrastructure and applications


    You must also be familiar with a company''s systems (servers, storage, and telecommunications)
    and the applications that run on them. This includes operating systems and the
    services they offer (name resolution services, remote access gateways, and IP
    address leasing). Pen testing and all these areas will show up on your reports.


    If you run a scan on a Domain Name System (DNS) you may find that it needs to
    be patched. If the server is a Microsoft Windows Server, you may be able to download
    needed patches and apply them based on the report. You may also be running a UNIX
    or Linux system running BIND, which is a DNS daemon or service. Either way, both
    may show up on your report as needing attention. Knowing what they can help you
    direct attention towards not only how to repair them, but also which must be prioritized
    immediately.


    Web applications and web programming are also major areas that are exposed to
    vulnerabilities based on the logic used to keep them running. Database servers
    running the Structured Query Language (SQL) may be subject to injection attacks.
    Operating systems that the services and applications run also remain open to attack
    and need to be scanned and patched.'
