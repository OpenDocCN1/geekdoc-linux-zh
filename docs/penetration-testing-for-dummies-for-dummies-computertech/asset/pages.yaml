    # # Nmap


    ```

    https://nmap.org/

    ```


    Nmap is undeniably one of the hottest and most used tools for pen testing outside
    of Metasploit. Contained in Kali, Nmap is a tool that can really do it all. On
    the website you will find advanced usage of the tool to include subverting firewalls,
    spoofing scans, getting around IDS, automation and scripting of the tool, and
    so much more.


    # # Wireshark


    ```

    https://www.wireshark.org

    ```


    Wireshark is one of the de facto tools in your toolkit and a primary source of
    information for troubleshooting networks, information gathering, or pen testing.


    ```

    https://www.wireshark.org/#learnWS

    ```


