    FIGURE 2: Nmap is a tool that you use to conduct to ping sweeps.


    Port scanners can only scan for open ports. A vulnerability scanner can do more
    than that, and it can probe other peers to find out-of-date software, configurations,
    and more. This is where a tool such as Nessus (which I introduce in Chapter 3)
    becomes valuable to the pen tester.


    # Patching


    System patching is one of the main outcomes of at least half on your risk register.
    Because software is so buggy (even upon release — see the nearby sidebar), half
    of the results and solutions provided by your software vendors and almost all
    of your "bugs" found in code results in exploit. Service packs, hotfixes, firmware
    updates, upgrades, and hardening by patching can save many of your problems.


    Aside from bug, the biggest reason why misleads as exploited vulnerabilities and
    attacks take place is because something isn''t configured correctly or configured
    and then altered so that a vulnerability is inadvertently exposed on the system.


