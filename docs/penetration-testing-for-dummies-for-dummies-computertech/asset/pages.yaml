    # # Understanding Denial of Service (DoS) Attacks


    Denial of Service (DoS) attacks are quite simply the launch of any attack that
    stops legitimate services from being provided. This can be anything from the websites
    you host, the printers in a print room, or a wireless access point (WAP). The
    larger scale version of this type of attack is the DDoS, or distributed denial
    of service. While a DDoS attack typically uses just one computer and one Internet
    connection to flood a targeted system or resource, the DDoS uses multiple computers
    and Internet connections to flood the target.


    DoS is the best to ruin not only a company''s reputation, but it can also be very
    costly. If a good DoS attack is launched systematically against a high-level resource
    target (for example, a backbone Internet router), the payload of attack could
    take down the Internet until it''s resolved.


    Figure 6-5 shows the attack vector and how it''s conducted. In this classic case
    of a DDoS attack, the hacker has successfully turned zombies (workstations they''ve
    taken control of) into attack machines. This is usually done by distributing a
    virus (normally a downloadable Trojan horse) that turns systems unknowingly into
    traffic generators. The hacker can then backdoor (usually via rootkit) control
    these systems so that they can launch attacks (much like flood) at anything the
    hacker desires.


    84 PART 2 Understanding the Different Types of Pen Testing'
