  md: 'The only way to know how vulnerable you are to cybercrime activities is to
    test your systems yourself. This enables you to be ahead of the curve in protecting
    your resources and assets to mitigate risk.


    You must be employed, contracted, or given permission to conduct ethical hacking,
    pen testing, vulnerability testing, or any other assessment where computer technology
    will be penetrated and exploited to find vulnerabilities.


    Pen testing can be considered an act of cyberfare if you test on systems and networks
    you don''t have permission to test on. It reverts your ethical hacking procedures
    into unethical ones with that simple oversight!


    If you don''t work in the field and/or for a company hired to conduct pen testing,
    you must have permission to conduct it.


    ![](img/c028467b75a4f3372e49c00c9bd53148_30_0.png)


    Once vulnerabilities are found, you can use the tools to exploit them. However,
    you must be careful to analyze what could impact or other problems it could create.
    For example, you could overwhelm a buffer on a network card or network switch
    to test its ability to be exploited, creating an outage in the network or on the
    system.


    You should be careful and assess whether possible irreversible damage can be caused
    and for it. This means you must conduct an exploit that could corrupt an operating
    system and if it happens, it must be restored to get it back to working condition.


    You must be careful not corrupt (or lose) data as part of the system, storage
    unit, server, or other storage facility. Make sure a backup is done prior to testing.


    You could expose weaknesses to others you might be working with and that could
    cause problems with information being leaked about security issues that impact
    a company''s reputation. This is why it''s recommended to be very careful with
    giving any information to anyone who needs to know.


    If you''re the security incident handler (like those of Incident Response Team,
    which I discuss in Chapter 2) who''s tracking a cybercriminal, you might be responsible
    for collecting data and creating a chain of custody of the evidence that can be
    used in a court of law.


    The dark web (or garnet) is where many attackers go to find their tools as part
    of the web is not searchable with common search engines. Most of these tools are
    found on peer to peer networks and other means of distribution are the leading
    causes of attacks via script kiddies and low level hackers worldwide. Most cybercrime
    (and cyberfare) is conducted using these means.


