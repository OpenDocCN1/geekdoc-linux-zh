  md: '# Chapter 12


    # Making Recommendations


    In this chapter, I try to capture the most common issues you might encounter and
    recommendations you''ll likely want to make based on your tools. The chapter focuses
    on the tools, the report, the output, and your report findings and fuse those
    with best practices found in the industry today.


    Most of what you find in this chapter (and in real life) is that most of the recommendations
    revolves around systems that are not up to date and need security and other forms
    of patching or misconfigurations that lead to security risks in your infrastructure,
    network, and applications.


    This is your time to shine! You can highlight many of the items you will learn
    in your report, create a separate report or put a presentation together andor
    give a training class or awareness seminar. All this is part of post-test assessment
    and recommendations that you can provide your company or clients based on your
    findings.'
  merge: -1
  pgno: 175
- img_proc: true
  md: '# Understanding Why Recommendations Are Necessary


    You may be given tasks where you just run the pen test, collect the findings,
    and report them. Other times, you are expected to recommend how to remediate some
    of the issues you''ve identified.


    Before you report any recommendations, think about these key considerations:


    +   - Not all recommendations are actionable. You''ll find accepted risks (which
    are noted on the risk register), and you may have to have alternative solutions
    in place to mitigate the threat. For example, a router may need to remain exposed.


    The recommendation normally would be to block access to the router. Because it
    needs to be accessed, hardening it with access control lists may be the viable
    solution in this case.


    +   - Some recommendations may not solve the problem. You may make recommendations
    that are industry-standard solutions that often come from the vendors, but may
    not mitigate the risk.


    There may be risks hidden within the solution. This is retesting (which I cover
    in the next chapter) comes into play and is a critical piece of pen testing.


    ![](img/c028467b75a4f3372e49c00c9bd53148_176_0.png)


    If you''re asked for recommendations, options, or security threats in an organization
    post pen test, be sure you''re confident in your ability to do so. Your strengths
    may lie in pen testing but may not rely on applying solutions in an enterprise.
    For example, some solutions might require programming to fix, and maybe you''re
    not a programmer. Be honest with your abilities and make sure you''re brought
    in with the project team. This is when other consultants or experts may be there
    to help apply the security solutions needed when others can''t apply them. The
    role of the pen test is to penetration and ethically hack to find weaknesses.
    Another person (or team) might be responsible for securing the weaknesses. Whatever
    part you play in this process, you can gain from it and it will make you a better
    pen tester over time.


    # Seeing How Assessments Fit into Recommendations


