    # Awareness and social engineering


    I''ve said it before, but I have to say again: The weakest link is the non-technology
    assets such as your workers, desktop users, and mobile workforce. They''re human,
    and there''s really no way to make 100 percent everyone will work diligently to
    always consider security. This is why awareness training is a must and why it''s
    an ongoing effort.'
