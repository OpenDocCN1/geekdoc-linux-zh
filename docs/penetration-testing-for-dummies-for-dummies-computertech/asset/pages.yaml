    Use a RAC chart to identify roles and responsibilities.


    On the other hand, you may be given a very specific task such as ensuring the
    company''s trade secrets are safe from prying eyes — internally and externally.
    You now have a more specific goal to accomplish.


    # Setting scope


    Clarifying exactly what your task will be is determining the scope of your work.
    Whoever is asking for your services should detail the scope up front. Scope discussion
    should absolutely be part of your meetings with stakeholders because they''re
    setting the expectations and goals. Topics to discuss include


    +   - Whether this is an in-house test or a consultant pen test.

    - Whether this is a one-off test or part of a program.

    - If part of a program, how retesting will be handled.


    # BUILDING A TEST PLAN BASED ON GOALS


    With these two examples, if the first is given as task, you may want to start
    with vulnerability scans, and mapping scans to identify threats, if you find weaknesses,
    move into each test whether you can exploit them. All your reports may produce
    artifacts so that they can be reviewed later to identify problem areas that you
    may want to restart (which I will cover in Chapter 12). Where a more specific
    deliverable is given and you can focus your attention in that area, you will be
    able to dig right into a potential problem spot and penetration test until you
    do or do not finds.'
  merge: -1
  pgno: 133
- img_proc: true
  md: 'What will also partially dictate scope are what you see in past test results
    and the existing risk register, if there is one. I discuss both in the later section,
    "Gathering Requirements."


    # Gaining permission


    Being a pen tester requires you to make great assessments about the pen testing
    you''re conducting. You are an ethical hacker conducting an active penetration
    on an enterprise network with permission. This means you will have to ask for
    permission, and that might require going through a formal process.


    Gaining permission to conduct a pen test is a multifaceted process. Many aspects
    fall under the umbrella of what you should discuss early on:


    +   It depends on the size of the company and what you are asking you to accomplish
    it. Ultimately gives permission might not be anyone you''re dealing with directly
    but who''s higher up the chain of command.


    +   There also needs to be specific guidelines on next steps and what you have
    the access and rights to do.


    For example, you may find a weakness outside the boundaries you were given and
    it thus a threat. The right thing to do is to escalate it to those who need to
    know immediately and seek further guidance, not probe and try to exploit it.


    +   Gaining permission should be part of the first series of meetings that take
    place once the roles have been assigned and the tasks have been agreed upon and
    approved.


    +   You may want to have a test in covert fashion to really test who might be
    involved in securing systems. You may need to obtain separate permission to do
    this.


    +   You may also corrupt data (so you need a backup), or you may cause another
    problem that needs to be addressed. These are also issues to address during the
    permission discussion.


    +   You will have a strategy for how you''ll approach and conduct the pen test.
    Share this strategy with the stakeholders, so they understand your method and
    everyone knows what you''re doing, and they can confidently provide you the permission
    to do your job.'
  merge: -1
  pgno: 134
- img_proc: true
  md: '# Following change control


    You will likely need to a change control to document the fact that a change (scanning,
    testing, and attempting of changes on your network and systems) will be taking
    place.


    Change control is necessary to document what is happening but also to log the
    time, and other useful information needed if an incident arises from the scan
    itself and support teams need to mobilize to assist. A critical prep item should
    be a contingency plan if something goes wrong. "Having a Backup," later in this
    chapter, for more about contingency plans.


    In my experience, I have seen older systems and interfaces fail due to excessive
    scanning that caused a technical failure to occur. I have also seen triggers,
    thresholds, and alerts that starts to shut down when an attack may be present
    and cause a production outage. All, your operations teams (who may not be the
    RACI or know about the scans) may start to see suspicious activity and think they
    under attack and respond to a false positive.


    All these scenarios and more can be solved with a change ticket and/ change control.
    In the cases where you may not be able to follow this process (smaller companies
    might not have a process), you may want to consider an alternative that you can
    track the work being done and avoid issues.


    # Keeping backups


    Make sure you not only have backup of data, but backup of systems, software, firmware,
    access to all of this, and so on. If virtual, snapshots of data/systems VMs hosts
    and other pertinent data suffice.


    # Having documentation


    Larger companies might automatically have everything in writing. If not, ask to
    have documentation in place that authorizes your scan (and all your activities)
    and all steps needed to recover data, recover from disaster, and so on.


    # Gathering Requirements


    Gathering requirements is based on the scope of what needs to be done, but at
    the same time, the requirements you gather might indicate what needs to be done
    — and could be different from what you or stakeholders expected. For example,'
  merge: -1
  pgno: 135
- img_proc: true
  md: 'the scenarios provided in this chapter can still serve to show you differences
    in the requirement gathering process. If I am going to do a wide assessment versus
    a deep and specific assessment, the requirements for each might be different.
    In this example, the wide assessment may require a set of tools and specific access
    to the network both internally and externally. In another scenario, you may only
    need to scan internally and start your pen test from a wireless access point.


    > This is why it is crucial to assess pass results and the risk register — it
    you define the scope. You need to refine the actual tools, strategy, vectors,
    and strategies to accomplish a good pen test. As you refine your strategy, you
    provide status updates at the regular stakeholder meetings I discussed earlier
    in this chapter. Keeping everyone apprised will ensure no one (including you)
    gets a nasty surprise.


    # Reviewing past test results


    The next part of assessment and prep work is looking at what has already been
    done before you start to conduct your pen test. The reason you do this is because
    the more you know, the better equipped you''ll be. This is especially important
    if you''re conducting a pen test for a company for the first time. Find out what
    you can from previous assessments (check the risk register, which I cover next)
    to discover if you need an immediate reset and if you still have vulnerabilities
    based on previous assessments.


    If you''ve done pen tests for this company before, you may have (and I really
    hope you do!) saved reports or logs in assessment tools already available to review
    as shown in Figure 9–2. Part of testing is to make sure you''re documenting the
    experience so that you can either mitigate the risks or document them and monitor
    if they can repair them. Having documentation for future reference is invaluable.


    If and when possible, discuss with other IT security team members who have conducted
    previous assessments. Ask them for any artifacts from past results and scans that
    they can share. Remember, use the RACI chart, so you know who are authorized to
    talk to and what you are allowed to divulge.


    # Consult the risk register


    The risk register is all the vulnerabilities you have found and need to wind up.
    If previous pen tests have already been conducted, there should already be a risk
    register with entries you can review. Figure 9–3 shows risk register metrics you
    can consult to determine whether there are areas where you may want to tailor
    your scans, tests, and assessments.'
