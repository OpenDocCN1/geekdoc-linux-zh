  md: '# Hackivist


    A hackivist (someone who promotes hackivism) wants to use technology in a way
    to promote their agendas, which are generally centered around a political movement
    or social effort. One of the best examples of modern hackivism is the group Anonymous.
    Although they''re not the first (some, like the Cult of the Dead Cow, have been
    around for many, years), they have proven to be one of the most widely seen on
    social media platforms and even in pop culture.


    The motive is to use technology assets to get something they want. So, if a hackivist
    wants to enact a change in a political agenda, they may penetrate a series of
    web servers and deface them in hopes to embarrass or motivate others in a particular
    way against their political adversary.


    With pen testing, you would have been able to scan web servers, find that they
    could be exploited and protected. Unfortunately, hackivists run their own secure
    scanners to find the weakness to exploit them.


    # Script kiddie to elite


    There are two ends of the spectrum, and you need to understand the type and volume
    of both sides.


    Elite hackers in the world intimately understand not the systems and structures
    but also how to program them, make tools that can penetrate systems, and exploit
    them. These elite hackers are few and far between but are highly dangerous. They
    only get caught when they make a big mistake that exposes them because most times
    they spoof what they originate from and are very hard to identify.


    On the other side of the spectrum are script kiddies. Script kiddies have basic
    skills and just enough knowledge to damage and gain access to the tools elite
    hackers create and follow their blueprints to gain access to systems and cause
    problems. Although they''re nowhere as skilled or dangerous as the elite hackers,
    they can become a threat if they''re able to pull off an attack successfully.


    # White hat


    White hat hackers are you and I: Those who practice security are security analysts
    and do pen testing to protect technology assets. White hats are those who can
    legitimately disclose hacks but for vulnerabilities and exploits and secure them.
    White hats are responsible for conducting hack attacks in secure labs to study
    the outcomes so they''re understood and what risks they impose.'
  merge: -1
