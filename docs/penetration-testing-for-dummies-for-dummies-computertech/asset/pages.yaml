- img_proc: true
  md: 'Risks run the gamut regarding what level of damage might be done if the risk
    isn''t mitigated properly although you don''t necessarily handle all risks the
    same:


    +   **A small, identified risk:** The risk can be small where you know there is
    a problem, but you accept its risk because you can''t fix it at this time. Maybe
    a patch is not yet available by software vendor and you need to wait.


    +   **An identified risk to monitor:** You identify a risk and monitor it, but
    a penetration and exploitation would lead to very little threat. An example may
    be hurting the company''s reputation slightly by upsetting a few clients who rely
    on the systems because they temporarily weren unavailable. This risk is low level.


    There are other situations where some vulnerabilities can be exploited, and it
    makes sense to monitor them. Other vulnerabilities are of a very high priority
    (and risk) and therefore must be monitored until they''re corrected, which may
    take some time to accomplish.


    +   **An identified high-risk ripe to be exploited:** This risk is likely to be
    exploited and may cause loss to a company''s finances, high-level reputation,
    or worse, a loss of life.


    You record all these risks in a risk register and log the results of most security
    assessments (your pen test results) with a marker denoting the level of risk and
    the priority in which it should be addressed.


    A risk register is a list of known risks and vulnerabilities you compile as you
    scan, assess, penetrate, and test. The risk register is the official document
    (or information stored and accessible in a database, spreadsheet, or other facility)
    that shows the following:


    +   * What risks (and vulnerabilities) you''ve found

    * How you may have found those risks

    * The weight you''ve assigned to each risk

    * A priority level in fixing or correcting each risk


    > REMEMBER

    Sometimes you have to accept a few vulnerabilities in the course of getting business
    done. Systems are upgraded, new sites are added, mergers and joint ventures happen.
    But it''s still important for to know where they are, so you can keep an eye on
    unusual activity through that vulnerability.


    ![](img/c028467b75a4f3372e49c00c9bd53148_38_0.png)


    Table 2-1 shows what a typical risk register looks like.'
