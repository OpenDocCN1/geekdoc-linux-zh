    # Chapter 4


    # Penetrate and Exploit


    Penetrate and exploit might sound like the title of an intense video game where
    you have to break into an enemy''s fortress and expose their weakness to the world.
    What that means in the context of pen testing isn''t too far off from that and
    is also intense. Penetration involves the attempt (perhaps successful, perhaps
    not) to circumvent or break through security barriers, to access a company''s
    data, for instance. An exploit is when an intruder successfully penetrates the
    barriers and takes advantage of a system''s vulnerability.


    A good part of your day as a pen tester is to think like a hacker. Where can penetrate
    your systems? What information can they exploit for their own gain? This sometimes
    takes creative thinking!


    I also discuss attack vectors in this chapter. This can be confusing to new testers
    because the bad guy hackers often know where to start their attacks, and the white
    hats need to figure that out. This helps to demystify that by explaining client-side
    and server-side attacks, wireless attacks, and other points of entry into a secure
    location. I devote the section of this chapter to introducing you to encryption,
    which can be a white hat''s best friend and a black hat''s enemy.


    Here''s the hard truth: You can''t secure everything. You can''t make everything
    bulletproof. The open nature of systems and the ability to access resources using
    them will always leave some form of hole in your security plan. What you should
    be aware of is that there will always be the ability to penetrate and


