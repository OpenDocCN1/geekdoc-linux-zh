    a separate section or add it to the detailed findings.


    As you see, the detailed findings, appendices, and recommendations can be repurposed
    and reorganized based on what you need for your report. You could have a recommendations
    list in your appendix.


    > Recommendations should be made if they''re in scope. Not all pen testers are
