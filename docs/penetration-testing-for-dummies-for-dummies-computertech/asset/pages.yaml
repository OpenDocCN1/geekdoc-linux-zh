  md: '# Coming Up with a Plan


    After you have consulted prior test results and the risk register, you''re getting
    closer to being ready to conduct a pen test. What you''ve assessed so far in this
    chapter, as an example, has shown the need to do a wide scan first and drill down
    to specific areas that may present threats. Recovering any data of value in an
    APT type format is desired as an expected outcome.


    Figure 9-4 shows the attack vector. Broken into steps, it looks like this:


    +   1. An internal user comes in via wireless.

    2. The user attempts to find access to a database with valuable information and
    remain undetected.

    3. The user continues to access data until exfiltrating undetected with the company
    data.


    With this information in hand, you can select tools you believe may be helpful
    in getting this pen test accomplished, deciding the best vectors to take, and
    determining how you could go about doing this exact test in Chapter 10.


    ![](img/c028467b75a4f3372e49c00c9bd53148_138_0.png)'
  merge: -1
  pgno: 138
- img_proc: true
  md: '# # Selecting a project or scan type


    When preparing for a pen test, one of the first things you need to pre-plan is
    the tool selection once you know what tools you need, you know what options are
    available within the tools.


    This may seem like common sense and it is; however, there are many variables based
    on the scan type, what the stakeholders are asking for, if you''re running a quarterly,
    monthly, or annual scan or possibly running a test of your tools for accuracy
    or practice. Because of these variables, consider what tools you need to use and
    what vectors you are accessing. For example, you may need different tools to access
    a wired network without a wireless network.


    ![](img/c028467b75a4f3372e49c00c9bd53148_139_0.png)


    Next to consider the types of scans you may do in detail. Because you need to
    be connected to a wireless network to conduct the test, consider wireless enabled
    tools such as Wireshark and its wireless functions. Other scan types you may want
    to resolve around network mapping (Nmap) and a basic scan with Nessus (see Figure
    9-5) and others to gain the info you need to conduct an APT.


    ![](img/c028467b75a4f3372e49c00c9bd53148_139_1.png)


    FIGURE 9-5:

    Reviewing Nessus templates.


    # # Selecting the tool(s)


    In this section you select your tools. In general, use the most common of tools
    (including Nessus, Nmap, Kali, Wireshark) and other system and operating systems
    tools to help you conduct an APT.


    Before getting started with the pen test, you also need to get your toolkit ready
    for the task. For example, if you know that you may want to see whether you can
    access FTP servers, you can tailor a set of FTP filters that can pull the specific
    info immediately. Based on data what you are able to gather, you may need to search
    for usernames and passwords that can be used in your APT. Figure 9-6 shows Wireshark''s
    filter option that can be used quickly to get the data you need.'
  merge: -1
