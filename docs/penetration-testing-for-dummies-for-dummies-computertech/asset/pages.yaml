    TIP


    # Appendix/Appendices


    Many reports might have extra information that may or may not be fully relevant
    to the scope or goal of your pen test and report. Place such information at the
    end of the report in an appendix or appendices (if you have multiples). Other
    information that can go here may be pen charts, maps, full audit, or tool logs
    and other items that can be helpful to those using or reading the report.'
