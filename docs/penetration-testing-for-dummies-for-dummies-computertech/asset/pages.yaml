    # # Password cracking


    All interconnected devices need to communicate and almost every single one of
    them require an account so humans can access and use them. Other services can
    sit over them (think enterprise management software) and overlay the management
    of them with a bigger tool. Either way, require accounts to be managed, and answer
    credentials — a username and a password.


    Despite the warnings over the years, people still use old and easy-to-guess passwords
    for their systems (such the names of their children or pets). Because usernames
    are usually some version of first initial and name (or other common variation)
    with the company''s domain name as the second portion, school hackers can easily
    gain access by just guessing the logon credentials.


    Fortunately, many systems are set up to require strong passwords (using upper
    and lowercase, numbers, special characters), and for them to be changed on a routine
    basis. But hackers still have a fairly easy way to get through password cracking.


    Password cracking is accomplished through a tool that attempts all possible username
    and password combinations using a dictionary file. With enough time, the correct
    username/password combination is usually found. This can be done locally or remotely
    via tools such as Kali and Metasploit. Figure 4-8 shows an example of a password
    attack with Metasploit.


