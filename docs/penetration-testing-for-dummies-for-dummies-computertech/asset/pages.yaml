  md: '# IPSec


    The Internet Protocol Security (IPSec) protocol also builds secure channels between
    devices using a Virtual Private Network (VPN). VPNs are used to create a tunnel
    between a sender and a receiver so that data in transit is secured with encryption.
    Specific algorithms and cryptographic keys are required for IPSec and it can be
    complicated to configure. Most of the time, this type of encryption is set up
    on network devices looking to communicate with other network devices to share
    information, as routing updates, tables, and adjacency information. It commonly
    uses pre-shared credentials to build secure connections.


    # Metasploit Framework and Pro


    Metasploit is a tool maintained by Rapid7 (rapid7.com). You can download a trial
    for Linux or Windows and get it up and running pretty easily for test and use
    within minutes. If you want to learn the tool and run your first pen test with,
    simply sign up for an account by accessing the free trials. You''ll get a copy
    of Metasploit Pro for download; install it (an easy process), and request a trial
    key via the login interface where you set up the.


    Before I enter the specifics of using this tool, a few words of caution:


    +   **Be patient.** Depending on your network segment and what options you select,
    the pen test can take some time.


    +   **Do not scan without permission.** Make sure you''re conducting an ethical/pen
    test and that you only have permission but have created awareness about it with
    key IT personnel.


