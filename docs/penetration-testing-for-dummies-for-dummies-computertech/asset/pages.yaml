    # Examining Types of Penetration Attacks


    Getting into a network through a password is just one way for a hacker to attack
    a system. A hacker can access many vectors to penetrate a network. In the following
    sections, I discuss a few of them and how you can test for them.


    # Social engineering


    Social engineering attacks are the most commonly used type of penetration attack,
    and yet''re the easiest to prevent with enough safeguards in place. They actually-
    dont rely on technology at all.


    All that is required in a social engineering attack is for someone — whether angrily
    or tricked into it — to give a username/password to a hacker. They extract the
    information by calling the employee and pretending to be an authenticated person
    (such as an IT professional). Or they simply set up a clone website (such as a
    bank website or intranet portal) that looks like the one the person is expecting.
    The hacker sees everything entered in the clone website, including username and
    password.


    Then the hacker has access to everything that person has (imagine money, insider
    information, and any other company secrets). It''s simply the easiest route a
    hacker can take. It takes a lot time to trick a person into handing over a username/password
    than it tries to brute-force their way through firewalls.


    You can track down social engineering using Kali; you can also prevent it from
    happening in the first place. I discuss both in the following sections.'
