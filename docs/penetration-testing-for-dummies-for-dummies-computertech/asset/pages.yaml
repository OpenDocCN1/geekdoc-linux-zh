    of a bug fix, service pack, hotfix, new tool, removal of a service or additional
    of a service.


    +   **Harden your systems without breaking or restricting their functionality.**
    This balance may be hard to achieve because you will find that you in fact harden
    something so much that it may not be usable.


    +   **Test and retest.** Harden your system and re-conduct the pen test.


    # Active monitoring


    Another great method of prevention is to do active monitoring. If you''re constantly
    monitoring the use of systems and their activities, you will be able to baseline
    those activities and hopefully able to spot anomalies when they occur. These may
    be flagged as possible attacks.


    # Retesting


    As I mention in the "Hardening" section, never stop testing. There needs to be
    active updates to all systems in the form of new hardware, new firmware, updated
    software, and operating systems. Every drivers for devices need new updates. Every
    time this takes place, the possibility for threat has been exposed. Do the updates,
    and then retest.


    # Devising best practices from lessons learned


    The most effective best practices you can follow are lessons you learn by testing
    in real environments. Reading alone can help but the more you touch the tools,
    test environments, and review the results, you eventually begin to generate more
    knowledge. By analyzing real attacks, you can learn from past tests (and perhaps
    mistakes) to help you use prevention practices to keep the systems safe and secure.'
