  md: '# About the Author


    **Rob Shimonski** (www.shimonski.com) is an experienced entrepreneur and an active
    participant in the business community. Rob is a bestselling author and editor
    over 25 years’ experience developing, producing, and distributing print in the
    form of books, magazines, and periodicals. To date, Rob has successfully contributed
    to over 100 books that are currently in circulation. Rob has written over 25 of
    those books specializing on security covering intricate topics as penetration
    testing, incident handling, cyber warfare, and the deployment of advanced network
    and security technologies. Rob has worked for many large-scale global companies
    including the US Military, Microsoft, Cisco, the National Security Agency (NSA),
    and Northwell. Rob also served as a veteran of the United States Marine Corps.


    As a leader, technologist, security practitioner, penetration tester, incident
    responder/handler and network architect, Rob has led numerous efforts to design,
    strategize, and implement enterprise solutions that must and remain secure. Working
    for government, military, health, and technology entities has noted the importance
    of protecting assets, testing for finding issues as well as handling critical
    incidents, but what is at risk. Rob has spent over two decades taking what he
    has learned in real-world scenarios teaching others through his published books,
    videos, and articles.


    Rob is also a well-known expert in the analysis of protocols with tools such as
    Wireshark and has written multiple books on protocol analysis, capture, and decoding.
    As a technology, crisis, and security expert, Rob has helped companies find weaknesses
    and how to secure them correctly, respond to incidents, and be proactive in monitoring
    for them as well as preventing and stopping them.


    One of the most interesting contracts Rob has taken as a penetration tester (and
    also to disclose) is when he was featured in Men''s Health Magazine having been
    hired by the parent company to infiltrate and exfiltrate the corporate network
    and remain undetected (https://www.menshealth.com/technology-gear/at9528048/protect-yourself-online/).'
