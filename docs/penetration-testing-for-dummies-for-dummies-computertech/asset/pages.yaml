  md: '# Securing logs


    As a pen tester, logs are your source of most of the information you collect and
    a giant source for information you want to populate in your report. One of the
    ways hackers conduct APTs is by deleting or updating logs. By swapping, changing,
    moving, deleting, or altering logs, they have false information or no information
    about breaches.


    Figure 12-9 shows a simple log from Solarwinds which allows me to have a router
