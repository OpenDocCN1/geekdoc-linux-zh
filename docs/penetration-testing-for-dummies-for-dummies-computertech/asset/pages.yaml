  md: '# Overwhelm and disrupt


    It’s possible to block many of the overwhelm and disrupt attacks (see Chapter
    6)

    and mitigate risk of DoS by:


    +   - Patching your systems as necessary.

    - Distributing and ensuring malware detection as antivirus software is updated
    and functional.

    - Blocking traffic at key points on routers and firewalls such as ICMP threats.
    Monitor for them and put alarms in place with intrusion prevention and detection
    systems to alert you of suspicious traffic patterns.


    # Destroy


    Regarding destroy attacks, prevention comes in the form of knowledge. If your
    systems, tools, and protective software remain updated, scanning for and-problems
    in your reports assist in the next steps of mitigating them.


    This list highlights ways to help prevent destroy attacks, which are often launched
    via malware getting into your systems and infrastructure:


    +   - Educate users. Some companies have multiple issues where pen testing can’t
    reach the endpoint devices as tablets and phones. Now, you can log into your corporate
    email from mobile, and your pen test tools may not be to reach them. Nobody should
    open unsolicited email attachments and links.

    - Back up critical data. You can prevent destroy attacks, but you can also recover
    from them. This means you must have good backups of your critical data.

    - Consider user system rights and permissions. Some pen tools identify whether
    users have elevated rights to install software. That should be identified and
    removed because the easiest way a virus can spread.

    - Block malware. At the highest level (and what you can also check as a pen tester)
    would be to identify whether your enterprise infrastructure is set up to block
    the ability for destroy attacks by stopping malware from coming through blocking
    it through filtering. Other ways to block malware:


    +   - Use antivirus software and keep it updated and functional.

    - Patch your systems as needed.

    - Block traffic at key points on routers and firewalls for attacks such as malware.
    Monitor for them and put alarms in place with intrusion prevention and detection
    systems to alert you of suspicious traffic patterns.


    144 PART 3 Diving In: Preparations and Testing'
