  md: 'through misconfiguration of an asset, a bug, or code problem in the software
    installed, or any anomaly in your enterprise.


    For example, your hardware vendor updated your firewall, inadvertently introducing
    a bug. You can be completely unaware of the exploit until either your identified
    by the vendor or another end user, or you run a pen test on your firewall. This
    doesn''t mean all bugs are exploits, but some can cause and lead to exploits.


    > Vulnerabilities are a type of risk that can be rated and used as a recorded
    artifact that can be logged, reviewed, and corrected by people who are responsible
    for its correction.


    Two examples of vulnerabilities are:


    +   **Buffer overflow:** *Buffers* are memory spaces in computers, systems, routers,
    switches, and many devices in your infrastructure that help to speed things up
    and when transferring data more efficient. For example, two devices communicating
    may get impacted by one way sending too much data to the other to absorb and consume,
    so it may buffer it (send into memory, essentially slowing it down) for a moment
    to the internal computing of the receiving system catch.


    +   **Malware** (malicious software) is a type of exploit created by a hacker
    that has taken this seemingly good service and turn it into a vulnerability. If
    a malicious party sends too much data to the buffer in an exploit to overwhelm
    (or overflow) it, it could cause performance to be impacted or in the worst-case
    scenario, crash the system or cause it to be unresponsive.


    +   **Password usage:** Weak passwords (easily guessed or easily cracked with
    a password cracking tool) allow immediate entry into a system with the click of
    the tools button. This is a real-world example of a very common vulnerability,
    which can be found and prevented by a pen test.


    A good password policy (with a system that secures and enforces it) is the best
    choice to protect against this vulnerability. Unfortunately, it''s still common
    in many places around the world, and I''m sure during your own pen testing, you
    will find instances of it during your own pen testing.


    Chapter 6 covers other vulnerabilities.


    # Scanning and assessing


    The successful pen tester uses (both hardware and software) to run penetration
    tests (sometimes called *penetration assessments*) to find vulnerabilities and
    exploit them.'
