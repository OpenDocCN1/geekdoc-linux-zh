  md: '# Reviewing the risk register


    By closing an item on the risk register, you can mark it as complete and ready
    for retest. Consider, as example, two items identified in the pen test report
    and shown in Table 13-1. Here you can see the item on the risk register, the priority
    or tier rating, and the pen tester''s notes.


    The register could include the recommendations, too, or can be in a separate document.
    Whatever the fix is for each item, it needs to be addressed, change control followed
    to mitigate the issue, and then marked as complete. In this example, the two items
    found were important to get to the next phase, which is the retest. Depending
    on the risk and other factors, you can also accept the risk and monitor it if
    you cannot repair it at the time you find.


    A retest will likely show that this no longer exists. If a retest flags the issue
    again, it goes back into the report and the risk item is reopened.


    You must address all risks in a priority manner. As I marked in the notes Table
    13-1, one of the items is a high priority. If the default credentials are not
    handled immediately, an exploit will likely happen sooner rather than later.


    # TABLE 13-1 Reviewing the Risk Register for Issues to Retest


