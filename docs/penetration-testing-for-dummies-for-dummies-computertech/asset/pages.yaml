- img_proc: true
  md: 'APTs are commonly done by using a variety of methods such as infiltration through
    code, by accessing via pen tests tools, malware, programs, and other means. Once
    you gain access, you can expect the following to take place from the hacker and
    as the ethical hacker should take each step and ensure that you are secure:


    +   1. Gain initial access (infiltration).

    This is the first step in the APT attack and can happen from many of the methods
    I list throughout this chapter. You should re-enact them to ensure your systems
    are safe and your end users are educated.


    +   2. Once access is established and can be maintained, work to protect that
    access and keep it a secret.

    This is done through stealth ops and by maintaining those operations by any means
    possible.


    +   3. Now that access is secure and secret, start attempting to move around,
    gaining more access, and identifying data or targets to access.

    This is done by continuing to run tests, access other devices, find targets, penetrate
    them, all while remaining secret and secure.


    +   4. Complete the APT by exfiltration of data and information.

    Do so while remaining inside or by getting out with the data and without getting
    caught.'
