    # # Infrastructure


    General includes storage platforms, mainframes, tape silos, and anything else
    that falls outside of the network and servers attached to them. You need to consider
    each separately and harden it accordingly.


    Some examples (and suggestions) include but aren''t limited to all of these devices
    connect to the network that share interfaces, ports, and protocols, use TCP/IP
    (or other protocol), and communicate and pass traffic back and forth. Because
    they do, every one of them becomes a target to an unethical hacker or ethical
    hacker.


    Storage systems might be considered the holy grail of data capture. Storage arrays
    normally host terabytes of data, the company''s databases, and other critical
    data that keeps many technology-driven companies alive and healthy. To launch
    an attack and successfully destroy, overwhelm, or subvert any of this infrastructure
    is an instant weapon.


    The recommendations are similar to what I cover for networks and systems:


