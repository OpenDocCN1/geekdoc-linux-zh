  md: '# Wireshark


    Wireshark is a tool that can look at and show you your wired communication paths
    that exist — including those that are not authorized. Wireshark is one of the
    most powerful tools I''ve ever used in my entire technology career.


    You use it to capture data from your network, so you can analyze it. You''ll need
    to decode that information you capture with it. Wireshark is good to conduct vulnerability
    assessments and find risks.


    With this tool, your machine grabs packets ominously off the network you review
    them. This information can be very valuable. Imagine being able to see what is
    traversing a your network—as you can imagine, hackers often use this information
    to exploit a network and its hosts.


    Though labeled as a protocol analyzer, Wireshark functions as a vulnerability
    scanner. Its primary functions are to capture and filter traffic on the network
    and perform deep inspection of packet contents and protocol.


    The way it works is simple. It sets up your toolkit to ominously sniff and capture
    network traffic. Figure 3-5 shows output from Wireshark; it clearly shows Secure
    Socket Layer (SSL) in one of the packets.


