    # Chapter 9


    # Preparing for the Pen Test


    Becoming familiar with types of attacks and a pen tester''s tools are necessary
    early steps to using those tools to protect a company''s assets against hackers
    and their nefarious intentions. Before you dive into the testing, assessing, and
    preventing, however, there are certain preparatory tasks to care of.


    In addition to knowing what attack type you''re exploring and what tools you need
    to do with that, you must understand your role, which systems you''re testing
    (or not), and what the stakeholder''s goals and expectations are. I cover all
    of that in this chapter and more, including what to do if you have to end a test
    before it even gets started.


    # Handling the Preliminary Logistics


    You need to get to the part where you will do any pen testing, you must work out
    certain logistical details, including getting permission to do the tests. This
    section highlights and explains those logistics.'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# Holding an initial meeting


    You''ll want to have a meeting to discuss roles, responsibilities, and expectations.
    This brings together all involved parties, who are assisting with the scan, mitigating
    any risks that may be found, or simply providing the necessary permission to have
    the work done.


    In this section, I focus on what will happen in the initial meeting with the stakeholders
    roles established, expectations discussed, the scope defined. Note that a series
    of meetings will be necessary, however, as you begin other preparations, which
    involves gathering requirements. The stakeholders might decide to set up a weekly
    meeting, or have them every twice a week, for the life of the project.


    # Understanding everyone''s role


    You must understand what role you''re playing in the scenario in front of you.
    For example, if you''re working for a large company as part of their in-house
    security team, conducting a pen test will be slightly different than if you''re
    hired as an outside consultant who will assess and pen test for the client. You''ll
    do everything the same, but the role you play may be slightly different.


    Note, as a pen tester, your role is first and foremost to conduct penetration
    tests to find weaknesses in an organization''s security plan. You might or not
    be expected to make recommendations on your findings and implement those recommendations
    to secure the identified weaknesses. That all might be someone''s responsibility,
    too, making it so important to hash out these issues of time.


    As a pen tester (especially one who is a consultant), you may want to suggest
    a clear identification of roles and responsibilities. 9-1 shows a RACI (Responsible,
    Accountable, Consulted, and Informed) chart that you customize however you see
    fit. This chart is used to list who is part of the project, who responsible for
    specific tasks, and so on.


    This chart is a good way to verify the scope and set boundaries, as well as document
    the set of deliverables and who will perform them and keep concerned parties involved
    to the necessary level (consulted, informed).


    # Setting expectations


    If the expectation is that you conduct a pen test to test the security of the
    enterprise, you have been given a very wide and non-specific task to follow. You
    may need to cast a wide net to get a good catch.'
  merge: -1
  pgno: 132
- img_proc: true
