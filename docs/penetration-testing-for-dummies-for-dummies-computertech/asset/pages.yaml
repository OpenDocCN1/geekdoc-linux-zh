- img_proc: true
  md: '![](img/c028467b75a4f3372e49c00c9bd53148_199_0.png)


    Also, you want to ensure that the retest is followed the same way as the original
    pen test. The same approvals, process, communication, discussions, and work-flow
    must be followed as was covered in Chapter 10.


    # # Choosing What to Retest


    If you''ve conducted the pen test thoroughly and diligently documented what you
    did and what you found, deciding what to retest can be, dare say, easy? You''ll
    rely on your documentation, the report, and the risk register.


    # ## Consulting your documentation


    In Figure 13-3, I have updated my documentation to reflect what changes were made
    to the vectors and threats identified in the pen test report. I also took the
    recommendations provided and some of the risk register items to create a visual
    of what my report may look like so I can use it as reference when putting together
    a retest plan.'
