    # Deciding How and When to Pen Test


    When you conduct any pen test, your goal is to have a strategy.


    You can blindly run tests to see what you find; you can also try to penetrate
    systems to find whether there are any weaknesses. That''s fine for any scans or
    tests you conduct weekly or monthly to assess your security posture, which is
    the status of the security of your company''s software and hardware, networks,
    services, and information. The state of your security posture should be evaluated
    regularly and take into account your readiness and ability to react and recover
    from incidents.


