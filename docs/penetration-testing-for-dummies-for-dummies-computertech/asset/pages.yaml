  md: '# Grey hat


    Grey hat hackers are those who border on the white and the black. They may not
    be as malicious as a black hacker, but they cross the lines at times and break
    laws, steal code, or even share information they shouldn''t. The grey hat is usually
    someone who doesn''t work as a security analyst or in another security role in
    an organization or isn''t a criminal looking to break laws and risk imprisonment.


    # Black hat


    Black hat hackers are hackers who want to exploit systems and technology for personal
    gain. They either want to seek revenge, get a financial payment, or gain another
    benefit from conducting attacks on systems. If a black hacker finds something
    they can exploit, they do without question — especially if it fits their motives.
    They also go on social channels (as the dark web) and share this information,
    sometimes creating a multi–prong attack against others (or entities) in the form
    of distributed attacks, such as a distributed service (DDoS) attack. Black hat
    hackers are indeed criminals and are generally found out and penalized (and sometimes
    imprisoned) for their actions.


    # Doing Active Reconnaissance:

    How Hackers Gather Intelligence


    Like you have many tools for pen testing, hackers have many tools to probe systems,
    applications, networks, and more to find security vulnerabilities. Experienced
    and advanced hacker know there are many more paths to enter and are familiar with
    various ways to gather information and bypass security:


    +   **Social engineering:** Essentially, this is when someone (knowingly or not)
    gives a username/password to a hacker. It''s the fastest way to bypass security
    to this day. See the nearby sidebar and Chapter 4 for more about this.


    +   **Spying:** The advanced hacker knows how to collect information by basically
    spying to learn about what security features exist to learn ways to bypass them
    undetected. Here are just a few examples of how a hacker might gain information
    that helps them simply walk through the front door undetected:


    +   * Dumper diving: Dumper diving is the act of going through to find handwritten
    information or other printed documents with information that can be used against
    someone, such as login information, passwords, account information, and many other
    pieces of private data.'
  merge: -1
