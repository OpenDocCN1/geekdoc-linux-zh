  md: 'Sometimes you want to go deeper and really test your security posture by conducting
    specific attacks, such as penetration, stealth operations, destroy attacks, and
    overwhelm attacks. For example, if you believe a hacker''s goal is to gain access
    to files from outside of your corporate network, your goal should be to assess
    that threat using your tools.


    You also need to conduct both internal and external tests. You never know where
    your attacks might originate from.


    A high-level view of what attacks may come from—both from within your trusted
    network (trusted users) and those that originate from outside of your security
    perimeter from untrusted users—is essential to have. An example of an external
    attack from an outside trusted user may come in the form of using a website you
    host in your network (usually in a demilitarized zone (DMZ)) that may find a vulnerability
    that allows them to access resources within your trusted network. On the contrary,
    an internal attack is just that—originating from inside your network that easily
    evades every perimeter such as firewalls and access control lists.


