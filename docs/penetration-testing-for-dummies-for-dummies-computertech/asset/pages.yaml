    to meet a compliance level. I cover compliance, reporting, and legal matters in
    an upcoming chapter, but I bring this up now because pen testing isn''t only to
    secure systems and networks. Your company might be legally obligated to ensure
    secure (and prove) they''re doing everything possible to protect information that
    anyone


