  md: 'I get to all that and throughout the book, but in this chapter, I cover the
    basics, starting with what roles a pen tester can hold in a company. I move from
    there the importance of getting certified and what skills are required. I end
    the chapter with a couple sections that can set you on the path to becoming a
    competent and sought-after pen tester.


    # # Looking at Pen Testing Roles


    The security area has myriad names applied to anyone who does good or bad security
    stuff. If you''re new to pen testing, all that can be highly confusing. To clear
    up all and confusion on the matter, I dedicate this section to describing the
    good guys who do pen testing and what roles you might have as a pen tester. (See
    Chapter 2 for a breakdown of the baddies).


    The pen tester''s role is to penetrate and ethically hack to find weaknesses within
    a company''s IT security program. Securing the weaknesses might be someone''s
    responsibility. You may or not be responsible for recommending-based on the weaknesses
    you uncover, but I discuss that task in Chapter 12.


    You must have permission to conduct penetration testing if you don''t work in
    the field or for a company hired to conduct it. Even if you''re hired to pen test
    an organization''s security, you likely still need permission for certain types
    of pen testing activities. See Chapter 9 for more on issue.


    ![](img/c028467b75a4f3372e49c00c9bd53148_21_0.png)


    # # Crowdsourced pen testers


    As big data grows as a concept and more systems grow in complexity and size, especially
    as companies move into cloud architecture and outsourced solutions, there is a
    need to leverage additional resources to stay on top of all the latest risks,
    issues, and threats. As more and more systems join massive compute nodes and virtualized
    systems are used in new architectural models, the global community of good guys
    (white hackers) can bring a wide array of benefits to the table.


    Crowdsourcing is a form of security where pen testing is done group-based team
    efforts of enthusiasts (who can be experts) for the purpose of testing systems
    managed by enterprises much the same way as a constant group. For example, a crowdsource
    pen test group may be contacted to run the same types of attacks against you that
    a consultant may and report on their findings.


    Crowdsourced pen testing is no different than any other crowdsourced solution.
    You''re using multiple resources to conduct your tasks to get a better outcome
    by'
