  md: '# Packet capture and analysis


    Part of being a great security analyst is to have deep knowledge of networking
    technologies and protocols. The best way to gain that knowledge is through protocol
    analysis from the packet captures you can do with a tool like Wireshark.


    Many network tools on the market allow for the analysis, threat detection, and
    management of network traffic based on how protocols operate. Using Wireshark
    is a very manual way of doing this and why it''s a great tool for a pen tester.
    Packet capture is simple: You set up the tool, position it correctly, and run
    it to nab the packets.


    The analysis portion is what brings pen testing full circle. Successfully analyzing
    what you capture — determining, for example, whether a communication between a
    web client and its associated web server is safe and why or not — is what you
    should be mastering as a pen tester. See Chapter 10 for more about the post-test
    analysis.


    # Key loggers


    A key logger allows an attacker to record what keys you tap on the keyboard. It''s
    either a device placed on a computer or a piece of software installed on it (some-via
    USB stick). After the device or software is live on your computer, the attacker
    can watch what you do. It''s a great way to collect information such as usernames
    and passwords.


    You''ll want to test to make sure key loggers aren''t live on the computers under
    your care. I recommend ensuring your company has policy and tools in place to
    keep key loggers from being put on computers in the first place. The policy can
    be one that users must read and follow so that they know to add these devices
    or it can be an electronic policy applied to the system that can prevent any types
    of devices from being added without system administrator approval.


    # Card skimmers


    A card skimmer is placed over a device to sit in the middle of a transmission
    where it can collect data. It''s hidden in plain sight because it''s made to look
    like a natural part of whatever machine it''s placed on, as shown in Figure 5-5.
    Card skimmers are commonly used in ATM machines. The skimmer sits on the dock
    where the debit card is placed. Users unknowingly continue to use the ATM and
    their information is collected, stolen, and used. A pen tester can scan these
    systems to make sure devices aren''t installed.'
  merge: -1
