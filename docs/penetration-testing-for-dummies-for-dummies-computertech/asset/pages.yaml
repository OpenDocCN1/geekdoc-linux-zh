    Figure 11-3 shows an example of what this section may look like.


    Depending on the length and complexity of the pen test, this section can continue
    on a step-by-step (or hop-by-hop) layout of the attack narrative and certain information
    was found based on the assessment. The specifics here can really help to build
    a technical map for other teams you might collaborate with to address the risks.'
