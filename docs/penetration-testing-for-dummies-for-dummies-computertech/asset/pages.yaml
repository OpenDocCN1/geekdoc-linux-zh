  md: '# Scanning Maintenance


    I want to shift focus now to what pen testing and constantly scanning for exploits
    looks like in a real–world scenario or in a corporate security plan. The truth
    is that what pen testing actually looks like depends on the organization and the
    value budget it puts into the actual security team''s ability to test, assess,
    and fix.


    Regardless, you can''t scan all day long and scan whenever you want. Most times,
    you need to gain approvals to run scans. Whenever need to know what scans are
    and what they''re scanning for. I discuss a few in this section.


    # Exclusions and ping sweeps


    You need to test systems, and you might have to create exclusions, which are systems
    you can''t scan. Knowing which systems you can scan is very important. For example,
    you may have very old and antiquated systems; scanning them may cause an outage
    to the system. You may have older systems that run critical functions that you
    are need to be replaced or upgraded, but the software vendor may not have released
    patches or current software for your older hardware. Maybe they never release
    updates because they no longer support these platforms. Whatever the case, you
    may have to exclude these systems from your scan and test them in a different
    way.


    Additionally, you may have to tune certain scans on specific systems so that they
    don''t trip defenses on that system. A great example of that is a firewall. Firewalls
    don''t like ping sweeps (the repeat testing with ICMP using the tool to see what
    responds). There may be access control lists (ACLs) in place or firewall rules
    that block these requests. You may not be able to reach certain segments because
    the routing won''t allow for a return path and you won''t be able to get the results
    of your scan. These are just a few reasons you must understand scan maintenance
    moving forward if you want to implement a professional testing program in your
    organization.


    One of the most used TCP/IP suite protocols is Internet Message Protocol (ICMP).
    ICMP messages are used to conduct ping sweeps in scanning tools. The scan can
    be used to test hosts on networks for ports that are open or hosts that are responsive.
    If I can query a host and it accepts my communication — and I also find a door
    to knock on (an open port) — then my job as a hacker is as easy as conducting
    a brute force attack on the host to find a way in.


    ![](img/c028467b75a4f3372e49c00c9bd53148_44_0.png)


    Open ports indicate services that may be running and listening on a device that
    may be susceptible to an attack. Open ports can provide an entry point. Ping sweeps
    use ICMP to touch the hosts on the network and a tool such as Nmap'
