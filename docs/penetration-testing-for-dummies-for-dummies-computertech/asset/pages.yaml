    Reconnaissance work can provide a lot of information. It may be hard to make a
    recommendation to keep a lower profile online, but it may be you have to suggest.
    For example, in previous chapters, I show how you pen tester might find a public
    IP address or a phone number to start attacks. You can attempt to keep all information
    away from hackers, but that''s likely not a viable option. Instead, heed this
    advice:


    ![](img/c028467b75a4f3372e49c00c9bd53148_178_0.png)


    +   **Do your best to suggest a reduced footprint.** Reduce the overhead in your
    technology that you may not need. For example, if you''re using Windows systems
    and not need services, remove them or disable them. An example could be to turn
    off AutoPlay(AutoRun in systems), which allows devices once connected to run what
    may be on. AutoPlay is dangerous because anyone can plug in a USB drive with malware,
    which would immediately start. By turning off a service of this kind, you have
    reduced the attack surface, reduced exposure, hardened your system, and inevitably
    reduced your footprint.


    +   **Educate those who might be susceptible to providing sensitive information.**
    Social engineering, which I discuss further in Chapter 4, is a great way for would-be
    hackers to coerce information such as usernames and passwords out unwitting users.


    +   **Keep certain information on a need to know basis.** People need to access
    information required to perform their jobs, so policies managing access should
    be in place.


    +   **Become deceptive with what you provide as information.** For example, you
    might recommend turning a default account on a system into a honeypot to identify
    whether possible attackers are testing the waters inside your organization. A
    honeypot account looks and behaves like the real account, but it''s isolated from
    other systems, so no actual damage can be done if someone hacks into it.


