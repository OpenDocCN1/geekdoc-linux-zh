    # # General security technology


    In the general security technology category are firewalls. Most scans devices
    such as a firewall turn up with little to no information. Knowing why is helpful
    to your report, in a ping sweep, you ping the interface and find nothing because
    the firewall has disabled that protocol responds.


    Figure 1-4 shows a Cisco firewall log lists the source and destination IP addresses
    used to make each connection and as a description of what connection did.


    Another example is when you run a scan and find open ports are in use on a web
    server in a DMZ where a firewall shouldn''t be. By examining the firewall that
    sits in front of these servers, you can see the server IP address that''s attempting
    to make connections. This could be an active attack and prioritize it immediately
    patch or fix.


    Other general technologies to consider would be devices such as intrusion prevention
    and detection systems, load balancers, access control lists (ACLs) on routers
    and wireless access points, controllers, and mobile extends. Each and every one
    of these devices can be exploited and the more you know about how to review the
    logs on them, the better you are at identifying risks and conducting ethical hacking.


