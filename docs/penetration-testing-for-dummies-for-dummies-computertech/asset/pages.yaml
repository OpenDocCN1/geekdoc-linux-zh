  md: '# Tools, Methods, and Vectors


    This section of the report is where you can get more detailed, covering the tools
    that were used, what methods were chosen to conduct the pen test, paths taken,
    attack patterns, vectors selected. You can also write a general outline or narrative
    of the ethical hacks.


    Figure 11-2 shows an example. You can either detail or map the specifics of paths
    or vectors you took, what tools you used, and any specific methods of attack.
    This can be considered the attack narrative.


