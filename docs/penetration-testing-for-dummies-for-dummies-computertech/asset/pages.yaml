  md: '# MOST SOFTWARE VENDORS RELEASE BUGGY CODE


    It''s a scary truth, but it''s truth all the same: Most software vendors do in
    fact release buggy code. What this means is that there''s no way a software vendor
    — whether they make a simple network card driver, an application, or an operating
    system — can fix every problem before they release the product to the public.
    This is why software vendors have beta programs, beta testing, early release programs,
    and test software deployments. They will use that time to identify issues with
    the code and actively identify and patch with software revisions.


    Code developers spend a large amount of time running these tests and attempt to
    release the best software possible. With today''s demands and requirements for
    more, more, more, however, it''s not just feasible to release a perfect product
    without a bug


    For example, you might have a bulletproof Linux server by adding a web server
    such as Apache to it, you might have opened some ports or exposed something that
    puts the server at risk.


    Again, if you do pen testing and scan the server (and the web server), you can
    find open ports or access points and then identify, secure, and/or configure them
    so that there are no further issues to worry about.


    # Antivirus and other technologies


    When considering pen testing, it''s helpful to understand the basics of heuristic
    scanning, which is very much like vulnerability assessment. An AV program sits
    on a system and is fed information to a baseline and look for anomalies. If anything
    comes up and is a match for a known piece of malware, example, or just weird in
    general, the AV quarantines it for inspection. Figure 2–3 highlights commonly
    used AV software.


    Other similar technologies such as intrusion detection software (IDS) and intrusion
    prevention software (IPS) actively scan for exploits, malware, intrusion attempts,
    and other anomalies. They work similarly to how AV programs and pen test tools
    such as Nessus do. Although I don''t cover AV/IDS and IPS in this book because
    they''re not traditional toolsets by pen testers, the truth is that you will need
    to use them to understand the scope of any attacks.'
