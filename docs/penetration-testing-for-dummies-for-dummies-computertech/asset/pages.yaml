    # # CONSIDERATIONS FOR PEN TESTING


    Before you begin the actual pen test, take a deep breath and consider the plan
    you have established. Consider the following tips so that you can not be unsuccessful,
    but also have mismatches that could ruin your reputation or that of the clients.


    +   * Staying focused is important. As a tester, you''re probably curious. Push
    the limits and find holes that you can drive through to get your goal. This is
    very different from an actual organizational-sponsored penetration test. There
    may be guidelines that you need to follow.


    +   * Staying on target is important. You have a plan; stick to it. You can consider
    options and alternatives, but you need to document them as opportunities in your
    logs.


    For example, I personally try to hack into a router by exploiting a weak password.
    The next step is to see what my hop is. Look at the routing table and find a series
    of routes in a Cisco router using route command. I may find a route I didn''t
    want to look and probe it to see what the router tells me.


    ```

    RouterA# show ip route 130.115.0.0nRouting entry for 130.115.0.0 (mask 255.255.0.0)

    Known via "igrp 100", distance 100, metric 10988

    Tag #

    ```


