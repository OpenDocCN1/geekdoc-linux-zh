  md: '# Networks


    Making recommendations to harden your network can come from the current pen test
    and report you conducted and completed. You may have found a series of ports open
    that allowed access to systems or credentials to devices that were erased and
    accessed.


    # General network hardening


    There are many ways to secure and harden a network:


    +   **Use challenging password security options and block IP access from unknown
    sources.** Doing so helps you to protect and harden against router hopping from
    device to device. hackers commonly try to breach a network by router hopping.
    You can use Kali to check routers for access and conduct brute force cracking
    until access is gained.


    +   **Use encryption.** Other attacks I covered include overflows, routing updates
    that were left encrypted, and more. Every one of these should be in your recommendations
    list and how they can be fixed so that the attack can''t be conducted in the future,
    or if you can''t change or access, how to monitor for intrusion if you''re aware
    of a hack is taking place.


    +   **Disable any services not in use.** As mentioned earlier in the chapter,
    reducing the footprint or attack surface can minimize what a hacker has access
    to exploit. An example could be to remove any protocols not using if you are using
    TCP/IP version 4, you can remove version 6. You can remove NetBIOS if you only
    using DNS for name resolution and


    +   **Use up-to-date software that is free of bugs and security issues.


    +   **Leverage Authentication, Authorization, and Accounting (AAA) whenever possible.**
    AAA is used as a service that allows you to monitor access into devices so you
    can review a log of all activities taking place.


    +   **Authentication:** Authentication handles credentials as username and password.
    Without a credential set, you can''t access a system. You must authenticate to
    a system to use it.


    +   **Authorization:** Authorization gives you permission to do things. So, for
    example, your user account may belong to a group that allows you access to data.


    +   **Accounting:** Accounting is the log based on what you do have been authenticated
    and authorized (or not authorized) based on your activity. So, when you access
    the file, it appends to a log that you have done and'
  merge: -1
  pgno: 179
- img_proc: true
  md: 'makes inspection and tracking easier for looking to protect services, systems,
    and data.


    +   Ensure attack patterns are nullified by additional security. For example,
    applying SSH instead of telnet so passwords that aren''t cleartext can be caught
    by pen test tools such as Wireshark, or further segmenting protected areas of
    your network with VLANs (virtual LANs) so that access can be controlled to secure
    services like databases you want to keep secure.


    +   Rely on vendors. For example, Cisco Systems (www.cisco.com) is one of the
    premier vendors of network equipment and software. Cisco provides a hardening
    guide (as most vendors do) so that you know how to increase your security posture
    and for your systems to be in a higher state of protection then if you didn''t
    apply any of the suggestions they make.


    ```

    https://www.cisco.com/c/en/us/support/docs/ip/access-lists/13680-21.html

    ```


    Also, many of these suggestions (such as using a centralized log collection) can
    be further used and suggested on other systems regardless of maker or vendor.
    Some of the suggestions are best practices no matter what product you use.


    # Network segmentation


    Networks can be laid out in many ways, but most (if not all) generally follow
    basic standards. You can see most of them in Figure 12-2. The figure shows the
    most common, which is the division of the internal and external networks (usually
    by the demarcation of the public or private owned vendor network) that allows
    you to gain or get into and out of your internal network. Along the external edge
    is where more hackers attempt to penetrate because this is where you''re visible
    on the public Internet.


    To access an internal company network, you have to use a public facing connection
    to connect from the edge into the company network to access their core. The core
    is commonly referred to as the high-speed center of any network that is configured.


    Depending on the size of the network, you could say that most core networks have
    at least a distribution, or layer where switches connect and wireless segments
    connect together. Most of these are configured with different IP addresses and
    further configured as virtual local area networks (VLANs). Segmentation (physically
    by device or logically by VLAN) can help protect each portion with access lists
    or firewalls so you can control what people can or cannot access based on what
    they''re permitted to do.


