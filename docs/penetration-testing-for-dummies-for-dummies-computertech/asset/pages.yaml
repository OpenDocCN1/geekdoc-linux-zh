  md: '# Phishing


    One of the main options for a hacker to gain access to a computer through phishing,
    which is a technical version of social engineering. You are using an email hoax
    or information to entice someone to do (such as click a link), which can lead
    to click bait or clickjacking attacks that install software on your machine to
    gain access to it. That machine then becomes part of the hacker toolkit to gain
    access to your systems.


    As a pen tester, you need to attempt this same attack on your internal users to
    see whether they are smart or trained well enough to know not click a phishing
    attempt. If they''re presented with something that looks fishy (pun intended),
    do the users know what they can do to thwart what might be a possible attack?


    The clickjacking attack is very similar. The hacker tricks a victim to click something
    they perceive to be else. The victim clicks, a link they think is legitimate,
    and the hacker can gain access or control over system.


    It''s kind of a standard carjacking but with click bait inside. An attacker is
    to trick you into giving something up by making you provide it through trickery.


    How this relates to subvert attacks and stealth ops is that the victim becomes
    part of the attacker''s hack. When victims are themselves to be fooled, they become
    part of the path or vector of the attack the hacker is launching. You should be
    comfortable with constructing a fake link that redirects to another page or site
    (informing the user they have been fooled) from a real-looking address and provide
    materials for them to review on how to identify these types of attacks in an educational
    way.


    # Spoofing


    Spoofing is the way an attacker disguises their identity and remains hidden. If
    I launch an attack from Nmap and need to hide my identity, I can do it either
    from a hacked source or directly from the tool itself.


    As an example, when you launch Nmap, you can use the -S option, which spoofs your
    source address into whatever you would like to choose. Other ways to spoof are
    pretty well documented online based on the tools you choose, but because Nmap
    is the focus here, attempt to add the -S <ip_address> information and use Wireshark
    on the receiving host to see the spoof attack. To conduct a spoofing attack, such
    as Man In The Middle (MitM) or other subvert attacks, see 5.


    CHAPTER 8 Subvert (Controls Bypass) 111'
  merge: -1
  pgno: 125
- img_proc: true
  md: 'Another example of spoofing would be when a hacker makes an email legitimate
    to the recipient. But it''s easily seen as a spoof through the email header, where
    the fake address is usually listed. This kind of spoof happens to people all the
    time — they get an email from their email provider (or so they think) that their
    account has been compromised and they need to log into their account to fix it.
    When they do, they get the attacker their username and password.


    # Malware


    In this section, I shine a light on the inner workings of an attacker uses AV
    software and malware to get into your system. It should be no wonder (or mistake)
    the best way to get in undetected is through malware. The original version I describe
    earlier in this chapter, in the “Attack Vectors” section, going from hop leaves
    a huge footprint in the system. You can catch it at any point in that path.


    As you move from system to system you may be caught by other tools and logs. As
    well, you need to clean and sanitize hop from hop to eliminate being seen, which
    sometimes means wiping logs that you can identify. It depends on how much security
    enterprise uses and has deployed. For any company with much to lose (and much
    to gain for hacker), it seems likely that they will have much of this security
    deployed.


    # Malware to find a way in


    Malware is one of the best ways in, so using this to your advantage can reap many
    rewards. Obviously by running tools such as Nessus and other vulnerability assessments,
    you will find what systems are unpatched, vulnerable, and have more holes than
    Swiss cheese. This doesn''t mean it covers all vectors. Just because you patch
    a system doesn''t mean it''s safe from attack.


    If a system gets malware on it that disables the protection from a host level
    as shown in Figure 8–7, you may not see it until it''s too late. For example,
    this version of Symantec Endpoint Protection (SEP) has been disabled, causing
    it to allow malware to pass due. It requires updates to a long period. If you
    don''t see it on the host system or whoever is managing it doesn''t fix it, malware
    could have slipped by. You can also cause it to fail manually by accessing the
    host.


    In Figure 8–8, the only way to re-enable and fix your AV is by having it done
    remotely at the management console or if you fix yourself locally at the local
    workstation.'
  merge: -1
