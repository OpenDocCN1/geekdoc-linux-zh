  md: '# IN THIS CHAPTER


    +   >> Exploring parts of the report: From executive summary to the appendixes


    +   >> Knowing what to include in the report — and what to leave out


    +   >> Communicating your findings clearly and professionally


    +   >> Staying on top of the risk register


    # Chapter 11

    Reporting


    When you conduct pen tests, you will likely expose at some weaknesses and vulnerabilities.
    The next step is to report on your findings. In this chapter, I show you how to
    create a professional report to deliver those findings.


    The goal of reporting is to focus on what needs to be done. You determine what
    needs to be done based on the project scope. It involves applying security holistically.
    Remaining vigilant and maintaining a high security posture requires applying defense
    in depth (the concept that, if you want to secure something, you consider all
    ways it can be exploited and add layers of security accordingly). You don''t clutter
    your report, but at the same time, you need to be thorough and note any critical
    issues you find.


    > The one major difference between the bad guys hacking and the good guys hacking
    (ethically) is reporting on what you find. The reports you create in the end ensures
    the work you can do to create a program that strengthens security within your
    organization as a whole. And that helps to keep the bad guys out.


    ![](img/c028467b75a4f3372e49c00c9bd53148_163_0.png)'
