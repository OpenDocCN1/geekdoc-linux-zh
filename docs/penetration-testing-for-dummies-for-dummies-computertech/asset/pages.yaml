- img_proc: true
  md: '# YOU WON''T STOP SOCIAL ENGINEERING WITH A PEN TEST


    A popular form of hacking is social engineering, which is about as low-tech as
    you get. Social engineering involves a hacker tricking the victim into giving
    away username and password information. The most popular hack and will always
    remain so because people are always fallible. The only defense to social engineering
    is to train employees to never give away login info. See Chapter 4 for more.


    +   * Screen scraping: Screen scraping is when an application copies what it sees
    on a system, search engine, or other data source and makes a copy.

    * Fake covers to record credit card info: These capture the information from your
    cards as you swipe them across a fake reader, which then allows a hacker to use
    the information it records. It looks just like an ATM machine (as an example)
    and you wouldn''t recognize it as a secondary cover.


    Passive reconnaissance (which is somewhat like the active version) is also important
    to know. Active reconnaissance testing is much like a port scan shows what ports
    may be open and what you can compromise. Passive reconnaissance is learning and
    gaining knowledge through observation without actively engaging the systems you
    want to know. Think of active like I''m probing a system and it''s answering me;
    whereas with passive, I''m doing an eavesdropping attack and recording the information
    I learn about.


    > Even though pen testing is an amazing program that allows you to gather information
    on weaknesses and how to prevent or fix them, it doesn''t solve the entire security
    problem. Take that into account when you''re conducting security assessments for
    your organization.


    ![](img/c028467b75a4f3372e49c00c9bd53148_51_0.png)'
