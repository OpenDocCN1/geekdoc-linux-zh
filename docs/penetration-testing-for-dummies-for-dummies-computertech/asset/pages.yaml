  md: '# Dedication


    This book is dedicated to Dylan and Vienna. Watching you grow and being a part
    of your life has forever defined mine. I love being we your Dad. Love always and
    forever.


    # Acknowledgements


    Writing a book is a team sport. Unless you have embarked on a project of this
    magnitude, it''s hard to put into words 8-10 months fly by and how many people
    are involved in that year to make a book even better than you imagined. Having
    been officially writing books since 1998 (my first), I cannot believe it''s now
    2020 and to look back at all of the connections I have made, the friends, family,
    and partnerships... it''s truly amazing.


    I can''t thank the team who helped me put Penetration Testing For Dummies together
    enough for their belief, support, guidance, and efforts throughout the process.


    Nicole, Rebecca, Katie, Ashley, and Teddy — thank you for helping me make a better
    book. I am grateful. The team assembled to write a Dummies book is by far some
    of the best in the business!Thank you for the opportunity to shine.


    I also want to thank all those who have mentored me, worked with me, spent time
    either leading me or being led by me. It is truly gratifying to come across the
    paths of so many great people in my time in business and IT. An extra special
    thank you to those at Northwell who have believed in my abilities and to all those
    who I had the honor and privilege to work with.


    Lastly (and most importantly), thank you to my family. Without you, I would not
    have the support needed to write a book in my free time (if there is such a thing)
    and be supportive and motivating me when things conflicted and time was tough
    to come by. I appreciate you all more than you will ever know.'
