  md: '# Mobile technology cloud


    Mobile technology is also a must–know endpoint technology quickly replacing the
    desktops and other devices. They also travel to and from locations and absolutely
    must be addressed — whether the devices are company assets or company soft-ware
    and data used on a personal device. There are challenges with this system, which
    mobile device management (MDM) solutions help overcome.


    You might worry about testing them to make sure you''re secure, but you approach
    this approach like all the other systems you''re accountable for — you scan, and
    report based on your findings and handle the risks as you identify them.


    Cloud is another IT security pros are trying to grow in the world of security
    and pen testing. Because cloud technologies fail under the purview of their cloud
    provider, as long as you''re working in conjunction with the cloud pro-vider''s
    system and they''reconducting pen tests, you have achieved the same goal as if
    you did yourself.


    Note: You might face the fallout of mistakes or mishaps committed on the vendor
    side.


    # Introducing Cybercrime


    Cybercrime is the act of conducting criminal activities — for example, data theft,
    information destruction, and identify theft — using technology such as computer
    systems and networks. A lot of hacking revolves around cyber activities and cyber-crime.
    Any access to something that is not with the intention of doing an investigation,
    including collecting information about access or damage (harm), is in fact against
    the law. As time has passed, more and more legal aspects of pro-tecting activities
    have arisen since the earlier 1990s.


    Here are some key considerations about cybercrime you should consider before your
    pen test:


    +   Those who commit cybercrime are usually out to gain information, access, or
    leverage to create a competitive edge, or gain wealth or information that can
    be used or sold.


    +   The main way that criminals conduct these criminal activities is by surreptitiously
    accessing information systems to get resources.'
