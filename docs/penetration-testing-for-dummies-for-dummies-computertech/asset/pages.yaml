    +   **Keeping your toolkit current is one of the hardest things to do as a tester.**
    You will find some tools (sometimes older tools) are more helpful to getting the
    results you need. Some are scripts that are created and maintained by each individual
    tester.


    +   **Some tools are expensive, and you need license for them.** You also need
    to keep them updated. For example, any tools, software, programs, applications,
    and systems you need to be patched, virus scanned, updated, and kept up to date.


    +   **All software must be updated.** Any software that requires signature files,
    digital certificates, block ciphers, and any other form of additional software
    needs to be updated and maintained.


    +   **Technology changes over time.** There will be updates to the systems you
    use, and there will be different systems in different organizations — all this
    means you need to keep your toolkit current with new additions that you will need.


    +   **Make sure your computer is updated and safe.** Make sure you keep the system
