  md: '# PHYSICAL SAFETY


    In this chapter, I concentrate on the technical side of safety. But you can''t
    forget about the actual physical nature of your resources, as well. Don''t allow
    physical destruction of assets by allowing unauthorized access to your protected
    areas. Protect them with physical security (guards), and locked and secured area
    cameras, card swipes, and other biometric entrance systems that keep out unwanted
    people.


    This example shows a very simple design in which the attacker destroys assets
    using a script that could have been delivered in a variety of ways:


    +   * From a Trojan horse application inserted on a host inside the network.

    * Sent in an email with an attached virus (malware) that spreads like a worm that
    caused attacks against the database that could corrupt it.

    * Someone walking into the data center, getting on a console, and deleting files.

    * Conducted remotely from a trusted (but potentially disgruntled) user from the
    safety of their home over VPN.


    ![](img/c028467b75a4f3372e49c00c9bd53148_111_0.png)


    By looking at NAC (network access control) software from vendors such as Forescout,
    you will have a better chance at finding, exposing, and protecting against destroy-style
    attacks. NAC denies (and quarantines) systems that come online in your network
    with any malware present or not meeting the expectations of the policies set by
    the administrators. They are placed on a protected network segment and addressed
    (possibly fixed or repaired) prior to being able to participate on the network.


    # Malware


    Malware (or malicious software) is the most common form of vulnerability faced
    by every single organization that uses technology today. This is a global issue
    and it doesn''t discriminate in any. If you''re connected to a network and use
    its resources, it''s likely you have at one time in your life come across some
    form of malware — be viruses, worms, or Trojan horses.


    CHAPTER 7 Destroy (Malware) 97'
