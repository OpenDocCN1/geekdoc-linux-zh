- img_proc: true
  md: '# Structuring the Pen Test Report


    Your report should come from a combination of the tools you use (some generate
    reports) and your own written work to explain overall health of the environment.
    A report comprises any sections included in the scope of the project (see Chapter
    9), but this list shows sections that commonly appear:


    +   **Executive Summary:** The executive summary briefs all of the key details
    of the report. It will speak to the reader in a way that lets them know what steps
    were taken, what the report ultimately found, and an overview or highlight of
    next steps, which might include recommendations (see Chapter 12).


    +   **Tools, Methods, and Vectors:** This section covers the tools you used and
    the methods you choose to conduct the pen test. In addition to providing a general
    outline or narrative of your ethical hacks, also detail the paths you took with
    detailed-by-step attack patterns and selected vectors.


    +   **Detailed Findings:** This is where you will list all security risks, vulnerabilities,
    penetration points, threats, and concerns. Include the technical aspects of each
    in detail.


    +   **Conclusion:** The section of your report reiterates the executive summary
    with a focus on the next steps.


    +   **Recommendations:** Although your job is ultimately to do the pen test and
    assess the health of the organization''s overall security posture, you might be
    additionally responsible for providing guidance on ways to improve the security.
    If so, put this in a separate section and as detailed as possible.


    +   **Appendix:** Include this section for charts, logs, and any information that
    falls outside the project scope but which you could be helpful.


    This list shows how some reports are structured to give you a starting point.
    Your company may have specific ways in which they would like you to report, or
    you may find other examples online that can give you more ideas to choose from.


    # Executive Summary


    The first part to consider in your report is your Executive Summary. A summary
    becomes an executive when you conduct a summary response in an organization that
    is likely read by the executive leadership staff.


    For those of you who work in these environments, many times you have very little
    time to speak with and meet with senior executives so think of the executive'
  merge: -1
  pgno: 164
- img_proc: true
  md: 'summary as an elevator pitch. You need to very quickly and concisely talk to
    your goals, outcomes, and provide a high-level view of key findings. Keep details
    for the body of the report, not in the summary.


    Overall, the goal of the summary is to let the reader know what steps were taken,
    what was ultimately found, and next steps. If these are the details of a pen test,
    an executive summary might look like what''s shown in Figure 11-1:


    A companywide issue with all Apache web servers that can be accessed remotely
    without a required patch (more suited for the body in findings).


    You have or a goal to identify whether your company-wide web architecture was
    secure for the upcoming holidays because the company relies on the integrity to
    be profitable in the fourth quarter.


    Executive Summary

    As requested by Company X, a pen test was requested to ensure the security posture
    of the web architecture was fact sound in light of recent concerns made internally
    by IT professionals. It is critical that there would be no issues and that security
    remain during high fourth quarter sales and the upcoming holiday season.

    While conducting a pen test of this architecture, the following was found:

    - 42 identified risks added to the risk register.\

    - 37 identified risks can be completely mitigated by XX/XX/XX.

    - The remaining 5 risks are acceptable risks and will be monitored.


    FIGURE 11-1 An executive summary.

    As of the completion of this test and report, it has been deemed that once all
    risks have been mitigated, the security posture will remain through the end of
    the year as expected and requested.


    (This is not only a suggestion; however, it fits audiences. I didn''t get details
    about patches, vendors, systems names, technical jargon or any other important,
    but unnecessary information for the executive summary. These details can be added
    into other sections and appendices.


    Another one of the biggest items to consider for the executive summary is scope.
    This should read very clearly in the first part of your report. I covered that
    a scan was needed and completed. I didn''t get into vectors I chose, tools used,
    and methods so on. I had to identify the web architecture because that was in
    scope. I didn''t have to scan every part of and pen test the entire enterprise''s
    technical footprint. The scope of the pen test was to identify whether security
    posture was high on the web architecture, and that''s what I included in the summary.


    CHAPTER 11 Reporting 151'
