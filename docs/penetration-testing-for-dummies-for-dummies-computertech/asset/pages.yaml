  md: '# DEFENSE IN DEPTH


    Defense in depth is a concept that requires you to consider all the ways an asset
    can be exploited and add layers of security to it — in this way, you create some
    defensive depth. A great example of adding a layer of security is dual-factor
    authentication. If I log into a system using a password, having to provide a second
    password (or better, a biometric control or a code that''s emailed or texted to
    me) adds another layer of proving who I am — in a way that others cannot easily
    replicate — to access the asset.


    Pen testing can help validate whether systems have defense in depth. If, for example,
    a simple password cracking test easily smashes a defense, you know that you can
    make the recommendation that the company needs to use harder to guess passwords
    via a good policy. If the password-protected asset is of high value, you could
    recommend using a secondary method (such as dual-factor authentication) of authorization
    to protect it.


    # Responding to incidents


    What if you can see an active attack taking place because of issues identified
    through pen testing and you are now monitoring as part of your risk assessment?
    The answer lies in a process or workflow called incident response.


    Incident response (which is sometimes called incident handling) is the event management
    of an attack based on an exploitation of a known or unknown vulnerability. In
    this book, I''m primarily focused on conducting pen tests and how to prevent attacks,
    so I don''t spend much time explaining incident response or incident handling.
    As a security analyst, however, you should know what an incident response team
    (IRT) is and why it matters. That''s what I briefly explain in this section.


    You might wonder if you''d need a specialized team to handle security-related
    issues, and the answer is actually very simple: The need is based on containing
    the incident. Special training is required, and special procedures must be followed
    for an incident to be handled correctly, as these examples show:


    +   >> A need-to-know basis: You don''t want to tip off someone conducting an
    attack that you know it''s happening and are watching. To prevent the attacker
    from knowing their movements are being monitored, who needs to know about the
    attack as it happens will be restricted to trained individuals who can react appropriately
    to the incident.'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'Containing the chain of custody on evidence: You might also want to control
    the actual message of the day as the incident could wind up on social media platforms
    or the evening news. You never just know how an incident may impact you or your
    organization, you have specific handling procedures and a trained team in place
    to handle the details.


    Note that one part of containing the event is to provide tangible evidence in
    a court of law. Should the company decide to take legal action against the perpetrator,
    documented evidence will be needed.


    What do you do if you have an active incident take? The answer depends on the
    following:


    Where you are: Location is everything! If you''re local to the attack you can
    start to work the issue and conduct all tests and other actions fear of being
    disconnected from the network. If you''re working on a virtual private network
    (VPN) connection or remotely connected to a system over a network, it may be part
    of the attack vector and you could become disconnected. Being local to the system
    you console access directly from the system itself and in most cases, this can
    be the most reliable option.


    Who you are (that, what role you have): To be designated an active member of an
    IRT, you simply need to be assigned the role. It may be a full-time role in a
    larger organization or consulting firms, or in smaller firms you may be assigned
    it as a collateral duty. Either way, the responsibility is the same and understanding
    your role and the procedures, processes, and plans are important.


    The actual team you''re assigned to train together. There is value in understanding
    everyone''s place on the team and how to handle an active incident.


    What you believe to be happening: Most companies have an IRT''s responsible for
    providing support in the case of an active incident handling request, such as
    a firewall breach, a virus or malware outbreak, an intrusion, or other security-related
    matter. What event is actually happening dictates your course of action.


    Obviously, you don''t ever have to respond to an active attack. Hopefully, you
    might be able to prevent it in the first place, and that is why pen testing is
    valuable in the entire security framework and defense in depth. If you''re able
    to secure everything properly or identify any weaknesses and fix them (or accept
    and monitor them), you solve half the exploit battle.'
