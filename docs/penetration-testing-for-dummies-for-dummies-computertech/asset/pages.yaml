- img_proc: true
  md: '# # Looking at the Benefits of Retesting


    After you conclude the phases of pen testing and become more familiar with that
    process and have made recommendations from the output of your ethical hacking,
    it''s time to do it all over again. This time, however, hopefully when you retest,
    there is less to find! This is one of many benefits to retesting.


    Pen test retesting benefits includes:


    +   **Testing the ability to respond to incidents.** As you conduct more pen testing
    efforts, vulnerability scans, mitigation work, and overall security efforts, everyone
    on the team (and individually) becomes more knowledgeable- and better responders.
    It also builds team cohesion for bigger events.


    +   **Testing the ability to harden systems.** Making recommendations and applying
    them can be a difficult challenge. It''s tough to work on systems as it is, to
    make radical changes at times and test them, can be tough on the people performing
    the work. This effort takes place, the easier it becomes for performing it, especially
    when it comes to paperwork such change management.


    +   **Testing the viability of the risk register.** Your risk register is the
    central database of your critical issues, flaws, and problems. If you''re running
    your pen test program, you have a comprehensive database of all of these issues,
    but also ways to mitigate them, monitor them, and solve them. Conducting tests
    and retest value checks your risk register for sure!


    +   **Scanning for finding new issues post remediation.** There is no harm in
    retesting and getting more scans of your network, penetration testing, and other
    methods to test security if you''re allowed and to do so! The more you test what
    you know and the more secure you will be.


    Conducting a pen test and then a retest does not mean you are 100 percent secure.
    Pen testing is a continuous program that doesn''t stop. When new systems are deployed,
    new technology brought online, software is patched or upgraded — to name a few
    scenarios — the environment experiences a change that potentially allows a security
    posture to be weakened. Therefore, you must consider pen testing, reporting, making
    recommendations, and the retesting phase iterative.


    ![](img/c028467b75a4f3372e49c00c9bd53148_196_0.png)'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# # Understanding the Reiterative Nature of Pen Testing and Retesting


    Triggers alert you to the need for a retest. Whether you retest (and when) is
    determined by whoever''s in charge, or you may make the suggestion yourself.


    Figure 13-1 shows the workflow for both a pen test and a retest, where you find
    the following workflow items:


    +   1. Start (start the process).

    2. Do an assessment of information required to conduct a pen test.

    3. This may be part of a project plan (or a bigger project program) where you
    have stakeholders meeting to gather requirements, as I discuss in Chapter 9. Regardless,
    when this step is done, you have goals and the scope for your test.

    4. Conduct a pen test.


    See Chapter 10 for details.


    ![](img/c028467b75a4f3372e49c00c9bd53148_197_0.png)


    CHAPTER 13 Retesting 183'
  merge: -1
  pgno: 197
- img_proc: true
  md: '+   4. Report your findings.


    Delivering a report, covered in Chapter 11, is likely always a part of your pen
    testing duties. A subtask or process might be to make recommendations and guide
    the mitigation process (if that is part of the project scope) and help to work
    with the risk register.


    Technically, at this point, the pen test is complete, but you might be asked to
    retest.


    +   5. Retest and report on the new findings.


    The process could keep going if you don''t get the all clear.


    +   6. End of workflow.


    Note that the workflows shown in Figure 13-1 are barebones representations of
    what the process will look like. You might need to include sub processes in additional
    swimal lanes that point to change control/management and other subprocess areas.


    After you report, make recommendations, and then retest, you absolutely need to
    re-report it no matter what — even if you don''t have any recommendations or items
    to update on the register. This is why you must continually ask, is the problem
    solved?


    # Determining When to Retest


    The pen test process flowing into retest (refer to Figure 13-1) should be a trigger-based
    system where a retest becomes a task in your pen test program on a continuous
    basis you post first pen test for the organization. Once that first pen test is
    done and the workflow begins, retests should be qualified at all times based on
    the process of reporting, finding remediation, and then retesting.


    You can also schedule them on a need basis. In Figure 13-2, I set up a process
    where the risk register is consulted by priority. If a risk is identified as Tier
    1, it''s immediately retested as soon as possible. Tier 2 or 3 risks might be
    to wait until the monthly or quarterly vulnerability scanning to take place.


    > Regardless of how or your organization sets it up, the truth is, you may not
    be able to scan whenever you want. This is why change control is so important
    to follow. You want to know what is on the change calendar and what is going on
    in the entire organization so there are no conflicts.


    ![](img/c028467b75a4f3372e49c00c9bd53148_198_0.png)'
  merge: -1
