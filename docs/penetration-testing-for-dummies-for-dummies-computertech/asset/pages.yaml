  md: 'Some of the biggest attacks in history were difficult to identify because they
    all came from spoofed addresses. For example, a Denial of Service (DoS) attack
    is when an attacker sends an inordinate amount of traffic to receive in hopes
    of overwhelming (the network buffers), so the system can''t function correctly.
    The receiver has to process every network packet it receives, interrupt the CPU,
    and process the request, sending tons of bogus requests simply blocks the capability
    for it to be processed in a timely fashion (if at all). Experienced hackers run
    this attack from a zombie (a computer infected with a virus that does the work
    for them) or from a machine that pretends to be a place of origin it isn''t (it''s
    spoofed). This way, a security analyst investigating the attack can capture some
    of the traffic and investigate it will discover they can''t track the source of
    the attack because the hacker is using a fake address. Chapter 6 for more about
    overwhelm and DoS attacks.


    You must know how a spoof is conducted, even as you accept it''s very difficult
    to stop or track it. Here are a few thoughts on helping to prevent spoof attacks:


    +   **Use encryption to help safeguard identities.** This helps to the transmission
    of usable data to be captured by a packet capture device and be usable. Discuss
    encryption further in Chapter 4.


    +   **Deploy security that doesn''t allow unauthorized connections to the network.**
    An attacker needs to connect to the network, using tools such as Forescout (forescout..com),
    allows who connect without authorization to be quarantined or examined. This is
    called network access control (NAC).


    +   **Run the attacks yourself.** And then pen test the ability to conduct this
    attack — gives you information about the likelihood of bad hackers to successfully
    conduct this attack against you.


    ![](img/c028467b75a4f3372e49c00c9bd53148_88_0.png)


    Advanced attacks in which you can conduct spoofing (or the testing of spoofing)
    is with arp-poisoning. Regarding the OSI model and its associated layers, IP addresses
    operate at layer 3. The data link layer is layer 2 and MAC addresses are mapped.
    The arp cache of a machine that is the layer 2 and layer 3 addresses are mapped.
    If I can poison the arp cache (alter it to make changes such as spoofing), I can
    conduct the same attack as the IP spoofing attack.


