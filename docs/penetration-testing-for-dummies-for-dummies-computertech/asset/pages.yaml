    # Listening In To Collect Data


    Spoofing, eavesdropping, key logging, card skimming, and even USB drives are all
    hackers use to attack an organization for collecting data. In this section, I
    talk about these various attacks and ways you can test for.


    # Address spoofing


    Spoofing an address is the best way to gain access and be in the middle of a conversation.
    If I pretend to be you and you start to communicate with me, then I have successfully
    conducted a Man In The Middle (MITM) attack. This information is vital to the
    pen tester. Knowing that may require you to test one level of security first to
    ensure that the next level is or not at risk makes you better knowing what to
    check and when. This provides you with a foundation in how an advanced persistent
    attack is conducted, but also how you can conduct an advanced pen test.


    The concept of spoofing is when someone pretends to be someone they are not based
    on faking a digital identity. Like identity theft in real life, the digital version
    is very much the same. For example, a computer need an IP address to be able to
    communicate with the network with other systems and resources, connect to the
    Internet, access web pages, and more.


    A more technical explanation of spoofing is an IP address spoofing when an attack
    intercepts the conversation by sending IP packets (network data that is transmitted)
    from a fake source address so that the recipient believes they''re speaking to
    the real source but instead is speaking (transmitting data) with a hacker.


    ![](img/c028467b75a4f3372e49c00c9bd53148_87_0.png)


