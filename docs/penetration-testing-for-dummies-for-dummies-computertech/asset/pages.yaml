    follow to permit access. If a deny statement is within the list, the system blocks
    entry.


    +   Use firewalls and firewall rules. Firewalls can also monitor and log information
    for later review, or send alerts based on thresholds or alarms that are set to
    be tripped for alerting purposes. Firewall rules (very similar to ACLs) are statements
    that your review when entry is requested and if a deny statement is used, it blocks
    entry based on specific criteria such as a port, IP address, hostname, or other
    form of identifier. The firewall can also be intelligent when it sees something
    out of the ordinary, it can send an alert to the administrator. For example if
    a port for hacking is on a system very rarely used, it may trigger the firewall
    to send an alert.


    +   Enforce secure password or credential usage. A set of credentials is a username
    and password combo, unless you''re using multifactor authentication mechanisms,
    biometrics, or other form of access and identity control.


    +   Multifactor authentication (MFA) in MFA. MFA increases the difficulty of password
    guessing or cracking. It''s especially true with the extra factor added is like
    a one-time password (OTP) that needs to be generated and used on demand.


    +   Encourage strong passwords. Another consideration is to have a password policy
    in place for your organization disallows the use of easy to guess passwords and
    makes the end users change them in a specified amount of time.


    +   Disable default, unnamed, or generic accounts. You want to ensure that credentials
    are set up to real users who can be audited. Any faulty accounts can be set up
    as a trap (for example, a honeypot) and audited that if you see activity on default
    (and honeypot accounts, you know someone is probing the network or attempting
    to.


    # Backups


    Creating and keeping backups is vital to the health of your organization. You
    cant continue operations if you lose critical data or systems with no way to access
    them after a disaster.


    Make no mistake, a breach by hackers is in fact a disaster and your recovery or
    continuity policy should follow your incident response plan.'
