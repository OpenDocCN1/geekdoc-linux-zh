  md: '# Stay Informed


    Just like any other role, skill, or function, the more you know the better off
    you will be. Up-to-date threat information can help you learn about the myriad
    of attacks and patterns coming daily. This information deepens your knowledge
    of what you need to be aware of as a pen tester protecting them.


    You should also stay ahead of things going on in the pen test community. Great
    way to do this is by meeting with others in your field (as I advise in the

    "Get Involved," earlier in this chapter).


    ![](img/c028467b75a4f3372e49c00c9bd53148_222_0.png)


    # Stay Ahead of New Technologies


    Technology is always changing. Remember when virtualization became important?
    Cloud? Wireless? Mobile? As each of these technologies emerged (and in some instances
    converged), it was important to stay on top of them because the minute they came
    to market, there seemed to be a ton of attacks that came right along with them.
    When wireless hit the market, there were drive-by scanners hanging out of cars
    — hackers were cracking into systems from the parking lot. You must know about
    new technologies, learning about them, and anticipating how hackers might use
    them.


    There are countless resources available to learn of new technology. For example,
    if you know your primary targets are going to be Cisco, Citrix, Microsoft, VMware,
    Linux (a distribution), and EMC Storage, you may want to add yourself to those
    vendors'' websites and their mailing lists to stay ahead of updates, new patches,
    version updates, and so on. If you have a contract with any of these vendors,
    they should be sending you information; however, anyone can contact these vendors
    and be added to their mailing lists so you can learn more about them. For example,
    if you were a large Cisco networking customer, you can gain access to RSS feeds,
    field notices, security advisories, bug alerts, software updates, and so much
    more.


    # Build Your Reputation


    Building your reputation is easy. For someone (anyone) to let you into these protected
    networks where all their data sits, they absolutely must trust you. Trust. It''s
    the critical piece of the proverbial pie of your career in pen testing. Identify
    as'
  merge: -1
  pgno: 222
- img_proc: true
  md: 'someone who can''t be trusted, and it''s likely you will never work for a company
    that needs your assistance in thwarting crime again.


    This means you cannot be a criminal! You need to make sure you act professionally
    and ethically. Build your network of peers and people who can vouch for you and
    continue to act in a way that is honorable and as a consummate professional.


    # Learn about Physical Security


    All the technical knowledge, skill, tools, and experience in the world can''t
    save you and a company from a social engineering attack. Nothing can thwart technical
    security faster than social engineering. Card swipes, magnetic door locks, bio-sensor
    reading, cameras, physical security guards, wall hopping, and all of the other
    things that fall outside of the computer network where data is kept can''t stop
    someone from breaking and entering. Always consider physical security challenges
    as a pen tester and augment your technical vulnerability analysis and scans with
    checking how physical security and defense in depth stacks up.'
  merge: -1
