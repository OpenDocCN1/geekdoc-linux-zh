  md: '# Tiny Packet Attacks


    Another easily manipulated technology that can be used for harm is the tiny packet
    attack. Tiny packets are packets that, similar to IP fragmentation attacks, can
    be further shrunk down to the computer buffers receiving them. This DoS attack
    is buffer overflow, fragmentation attack.


    This type of attack changes the data packet size, which is normally normed specifically
    (as the standard maximum transmission [MTU] size) that routers and other devices
    expect to see in their buffers. For the midrange (or normal) size of an Ethernet
    packet is 1,500 bytes. If a hacker starts to send packets that are smaller than
    1,500 bytes, the system will have a hard time receiving and processing them, which
    creates more overhead on the device to process incoming data. In other words,
    it has to work twice as hard to process data.


    Wireshark is the tool you want to identify tiny packets in your network. Figure
    6-10 shows the Wireshark Packet Lengths menu shows packets outside the 1500 size
    norm and volume in which they appear.


