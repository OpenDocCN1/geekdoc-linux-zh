    # Basic networking


    Basic networking includes, but is not limited to, understanding the OSI (open
    systems interconnect) model. Knowing how data transmits from one location (a sender)
    to another (a receiver) is key to being able to unwind how many attacks occur.


    It also includes how routers, switches, hubs, load balancers, firewalls, intrusion
    prevention devices, and other network black boxes on the wire work. Black security
    testing refers to testing software security from the inside. Generally, the tester
    has little or no knowledge of the internal workings). If you pen a router, you
    need to know how it operates.


    The TCP/IP protocol suite also falls under basic networking knowledge. The mission
    control protocol (TCP) and Internet protocol (IP) controls how computers connect
    to the Internet. It includes many of the protocols in the 7-layer OSI model. The
    Open Systems Interconnection (OSI) model is used as a logical framework to show
    data travels from the source to the destination and back to the source through
    the many technologies that comprise the network, systems, and'
  merge: -1
