- img_proc: true
  md: 'testing.) The breadth of pen testing is where the complexity grows because
    networks, systems, infrastructure, mobility, and cloud architecture all stretch
    what needs to be assessed. That requires you to look at every aspect of everything
    your client, company, or business is accountable for.


    # Protecting assets


    Your goal as a security analyst (one of the good guys) should be to keep the bad
    guys (hackers) out of things that they should not be in. It''s important to protect
    assets that they can''t be damaged or corrupted (rendering them unusable), altered
    (changed), infected (with a virus), stolen, hijacked, or the myriad of security
    threats that could happen.


    This list breaks down various scenarios by industry type:


    +   **The banking industry:** Money can be stolen, moved to other accounts, or
    debt added to others.

    **Credit card industry:** Identities are stolen and that information is used to
    penetrate accounts that have monetary assets or credit that can be used.

    **The sales industry:** Patents can be stolen and products made outside in foreign
    competitor companies, which causes businesses to fail and stock to drop (or rise)
    based on the intention of the hacker.

    **Health industry:** Electronic medical record (EMR) systems can be infiltrated
    to change, gather, or corrupt info.

    **Power industry:** The power grid needs to stay online, so the government, private
    industry, and residents can access energy to carry on daily tasks.

    **Military (and other governmental) industries:** Secrets need to stay secure
    and information can''t be obtained to cause harm.


    ![](img/c028467b75a4f3372e49c00c9bd53148_37_0.png)


    You can be proactive by conducting daily, weekly, monthly, quarterly, and yearly
    tests to find weaknesses that can be monitored or fixed.


    # Identifying risk


    Risk is another important word to define prior to discussing vulnerabilities.
    What is at risk is the technology that runs much of our world today and the data
    that resides on technology. By testing technology, pen testers can reduce the
    risk of it being exploited and causing harm. What is at risk is simple . . security
    itself is at risk.'
