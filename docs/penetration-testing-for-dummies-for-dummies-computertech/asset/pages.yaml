  md: '# Wired/wireless


    A challenge with wireless networks is that they aren''t always set up correctly.
    An example may be where a hacker is able to see and get a signal from a wireless
    access point from the external network (refer to Figure 12–2). This can be a hacker
    with a transmitter hacking from the parking lot with a high-powered antenna to
    see their SSIDs respond to beaconing.


    If you show you can in fact gain access this way, here are a few recommendations
    to make:


    +   * Turn off SSIDs to private networks so they do not advertise.

    * Lower the decibel and power rating on the access point so it doesn''t transmit
    past the walls of the organization.

    * Set up monitoring of the wireless network through controllers that allow for
    auditing and other AAA functions.


    # External


    The external network is hard to secure because most times you don''t own the systems
    that the ISP provides. You also need to consider that you are limited in what
    you can secure, but this is the true power of the pen test and the pen report.
    If you find that you scan the provider and edge leading into your private network
    (the demarcation is considered the DMZ, or demilitarized zone) where you may even
    host public facing systems, can show where they need to lock down their own system
    or if you own them, lock down yours.


    # Systems


    Whether you pen test and report on Windows, Unix, Apple OS, or any other operating
    system in your organization, you will find some vulnerability that needs to be
    patched, fixed, reconfigured, or examined. With the nature of changing technology,
    there will always be updates that cause problems later. Most, if not all, pen
    test output shows operating systems that need patching or protected against some
    form of threat in the world.


    > Keep in mind any compliance standards the organization must adhere. These are
    most common in finance and health, but other industries might have compliance
    issues, too. Many operating systems are required to be compliant, so you will
    find information on vendor websites on how to bring a system into compliance,


    ![](img/c028467b75a4f3372e49c00c9bd53148_182_0.png)'
