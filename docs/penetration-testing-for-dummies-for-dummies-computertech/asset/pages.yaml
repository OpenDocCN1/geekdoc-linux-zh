  md: '# CROSSING THE LINE INTO

    CYBERTERRORISM AND CYBERWARFARE


    known as cyberterrorism and cyber warfare can be considered an act of war, especially
    with foreign actors. For example, someone in Russia runs a few tools acquired
    on the dark web to penetrate U.S. businesses — to gain access, for instance. One
    could consider that an act of war or terrorism.


    It can get even worse if those same countries (or others) decide to launch attacks
    against all-power grids, steal secrets, or gain access to military secrets. This
    makes pen testing and ensuring assets are secure very important. Just as important
    is to ensure they remain secure over time.


    # What You Need to Get Started


    You might not realize it, but you don''t just dive into pen testing. You should
    take these specific steps before you get into the heart of pen testing:


    +   **Make sure you have a thorough understanding of the basics of information
    technology (IT) systems, networks, and other technologies at the fundamental level.**
    This knowledge airs your career in security, pen testing, and ethical hacking.


    +   **Conduct vulnerability tests.** A type of pen testing is a vulnerability
    test. A vulnerability test identifies in advance any potential threats — areas
    where a hacker could potentially attack a vector — your systems. An attack vector
    is a method or pathway a hacker uses to access or penetrate the target system;
    hackers poke around your systems to find something that''s weak or vulnerable.
    I discuss vectors further detail in Chapter 4. One example of a vulnerability
    is a known software bug that allows elevated privileges.


    You''ll use framework tools such as Metasploit (see Figure 1-5) and other tools
    to produce vulnerability reports that tell all the security concerns you need
    to know. From, you can run all tests to determine exactly what you need to do
    (if anything) to fix the threat.


    Vulnerability tests become more complex and exponentially more useful when you
    use them in combination with other tests. Other tests may include, but aren''t
    limited to, system checks (for example, checking logs for access), vulnerability
    logs, and system performance tests that show items as high as CPU, disk utilization,
    or other system issues that could potentially show an exposure, breach, or injection
    of code or an unwanted visitor.'
