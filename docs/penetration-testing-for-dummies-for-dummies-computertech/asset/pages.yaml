  md: '+   IN THIS CHAPTER

    >> Examining why a retest is a good thing

    >> Testing and retesting ... and testing and retesting: the reiterative process

    >> Knowing when to retest

    >> Using the report and risk register to choose what to retest

    >> Doing the retest


    # Chapter 13


    # # Retesting


    After you''ve conducted a pen test, written your report, and made your recommendations,
    the next step is to make sure all work was done correctly for the sake of an increased
    security posture. What that means is that it''s time to retest.


    There are important reasons to retest:


    +   >> Ensure the original pen test findings no longer pose a threat. Or, if they
    do not and decide to monitor them instead, you can review for any other weaknesses
    that may be created between the original test and retest.

    >> Test the fixes. This includes what goes into production, the configurations
    made to fix things, and the services added (or removed). You also want to make
    sure configuration changes don''t expose other issues.

    >> Scan any software that was updated. If software is updated with any patches,
    security fixes, new drivers, or any other upgrades, it is by vulnerability scanned
    and retested to ensure it has no exposed points post-mediation.


    When you run a retest and produce a clean and healthy report, this is the final
    outcome you hope for, but the process is iterative. In this chapter I cover the
    fundamentals of conducting a retest and show how the iterative process makes a
    circular workflow that builds on mitigation and remediation efforts.


    CHAPTER 13 Retesting 181'
  merge: -1
