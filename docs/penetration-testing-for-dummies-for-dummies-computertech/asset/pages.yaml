  md: '# Reviewing the report


    The goal of reporting (see Chapter 11) is to focus on what needs to be done on
    the goal of the project or the scope of the task you have been given. Defense
    in depth needs to be considered in all aspects of retest. You should go back over
    the original report, documentation, findings, and other items and refract everything
    you already tested, or you can focus on areas that may have been compromised.


    The threat of specific areas should remain the focus, and you should work to mitigate
    any threats reported in those areas. As I mention in Chapter 11, this is one of
    the reasons why you don''t want to clutter your reports. Some things may be implied
    such as overall scan of the network. You may want to simply focus on the edge
    where you were able to gain access via the edge and to another router and gain
    more access.


    You''ll want to review the report prior to retesting to know where to focus your
    retesting efforts after mitigations have been implemented. If, for example, a
    pen test was requested to ensure the security posture of the web architecture
    was sound in light of recent concerns internally by IT professionals, you''ll
    review the report to find:


    +   - Was the web architecture penetrated?

    - If was this done specifically?


    FIGURE 13-4 shows some of the remediations you may want to make, such as using
    SSL/TLS, to reduce risks in a web architecture.


    ![](img/c028467b75a4f3372e49c00c9bd53148_201_0.png)


