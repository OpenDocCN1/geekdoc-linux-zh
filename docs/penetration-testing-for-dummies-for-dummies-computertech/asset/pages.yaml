    Another consideration is, what if you hardened everything and used all of the
    security architecture possible to secure your systems? If you designed and implemented
    your systems and networks correctly, understood and tested for every change before
    making any, and only installed and used stable, well-tested, and non-programmatic
    code, you would really never have any security-related issues. If you added a
    secure perimeter defense system with firewalls, IPS/IDS units, and active monitoring,
    you would be worry free!


    The fact is, this is not just reality. You make changes. You can connect to other
    companies and vendors to do business. You install code that isn''t ready for prime
    time. You do work and function in these infrastructures and dynamically build
    them as you go, so you can anticipate that there will be some issues. Because
    of that you would absolutely need to pen test!


