- img_proc: true
  md: '# Creating a Professional and Accurate Report


    Writing the report isn''t just about including the correct sections that I describe
    the preceding section. You need to be professional, show correct data, and not
    mispent facts. I''ve compiled this list of do''s and don''ts to help ensure you
    deliver a great report.


    # Be professional


    For the report itself, consider using company letterhead, or company branded office
    documents.


    For the report out, which I discuss later in this chapter, consider using Power-Point,
    Keynote, or another presentation program to put your findings in a nice, visual
    layout.


    # Stay focused


    The purpose of this pen test is to make sure you help an organization identify
    potential threats through analysis, assessment, and testing. You can then use
    a report to help develop mitigation strategies that can help with risk avoidance.
    If it''s a major security concern, it may be a topic to broach if it is not, it
    should be left out of your report.


    Also, never steer away from what the purpose of your pen test is to make your
    needs or wants. You don''t want to point out designs that impact perfor-ance,
    vendor choices you may not like, or delve into areas of the intended purpose.


    # Avoid false positives


    As you conclude your test and then your report, you need to ensure that your report
    has very carefully been cleaned up so that it doesn''t misrepresent the out-comes
    of your test and it clearly depicts what you want to ensure isn''t in your report
    is unnecessary information. One of the items you topic one step further, you should
    ensure that you have inspected your data collection to filter any false positives
    from your report findings.


    For those of you who are familiar with firewalls and firewall logs (as an example),
    if you look at the log output you immediately get overwhelmed. That said, you'
  merge: -1
  pgno: 170
- img_proc: true
  md: 'may want to use snippets of information. You can also clean up the information
    in a way that highlights what you want the report reader to focus on.


    Lastly, you don''t want incorrect or erroneous information in the report. Because
    of that, you should do a data clean up (or sanitize the data) before using it.
    An example may be, if you''re trying to show a log entry for someone entering
    FTP ports from an unauthorized IP address, you would want to remove any information
    from the authorized ones. These may show up as false positive information where
    the access was flagged and recorded, but it doesn''t impose a threat/or unrelatable
    to the pen test and threat assessment.


    # Classify your data


    Another important factor for your reports may be considering a data classification
    exercise so that your report findings be grouped for easy interpretation and easy
    assignment for remediation. For example, if you place your findings in categories
    such as subvert attacks, destroy attacks, or other examples provided in this book,
    you can also prioritize the threat level based on these findings.


    The goal is to make sure that important data is easy to identify and assign. When
    attempting to ensure risk compliance, management, avoidance, and acceptance, you
    want to make sure you do not miss any priorities based on the outcomes from your
    pen test.


    # Enforce staff awareness and training


    Your report should contain information that points to areas in your pen testing
    and ethical hacking that leads to a need for staff training and awareness. For
    example, if you were able to hack via social engineering, phishing, trickery,
    deception, or any other form of hack I cover in this book to subvert stealth attacks,
    you need to highlight these areas in your report as a need for training and awareness.


    # Delivering the Report:

    Report Out Fundamentals


    After report creation comes delivery: This is the report out, and it should be
    reported to those who need to hear it, the stakeholders in your project or program.
    Who will ultimately be reporting out to should be identified up front as part
    of the preparation I discuss in Chapter 9.


    CHAPTER 11 Reporting 157'
  merge: -1
  pgno: 171
- img_proc: true
  md: 'As pen reports can contain some sensitive (and sometimes dangerous) information,
    it''s imperative you give your report to only those who need to know. Your findings
    should be considered secret unless you have permission to declasy them. Because
    the report essentially creates a step-by-step roadmap to get past very expensive
    security technology and steal company data, you should secure and even protect
    or encrypt your report for safe keeping.


    The report follows the same structure as your report, with the same sections.
    Because you will be presenting your report during the report out, creating a presentation
    with slides helps you cover the appropriate talking points while showing the information
    in a clear, visual, and professional manner.


    # # Updating the Risk Register


    A report is just a document. It is what you do with the information in the report
    that matters. After you outline a series of remediations that need to take place,
    add to the risk register and prioritize them. The risk register, which I introduce
    in Chapter 2, is the database of risks that need to be worked on to lower risk,
    and both can be risk aversion or risk avoidance specific.


    As you scan, penetrate, and test, you will find issues to add to the risk register.
    The report is created specifically for each test while the register is a living,
    breathing document that accompanies all post-test reports and is continually updated.
    Risk registers generally include the risks and vulnerabilities found, how you
    discovered them, the level of risk associated with each, and a priority for dealing
    with each. For example:


    +   - Low-level risks: The risk can be small where you know there is a problem,
    but you accept the risk of it being a problem because you might not be able to
    fix it at time. Maybe a patch is not yet available by a software vendor, and you
    have to wait.


    You might identify a risk and decide to monitor it, but if there is a penetration
    and exploitation of that risk, it will lead to very little threat. An example
    may be if the company''s reputation is hurt slightly by upsetting a few clients
    who are on the systems, but they were not available for the day. It was disruptive
    but not harmful to the clients. You might accept this as a low-level risk.


    +   - High-level risks: A high-risk item may be one that is to be exploited. And
    if it is, that may cause major financial losses for the company, as well as a
    big negative impact on your reputation, or worse, a loss of life.'
  merge: -1
  pgno: 172
- img_proc: true
  md: 'Dealing with the risk register is just part of being a pen tester, and it might
    require some project management on your part. Standard project plans with Gantt
    charts, critical paths, and assigned resources and tasks can be used. A company
    might prefer agile methods or a scrum team that uses scrum boards to assign resources
    and tasks. You''ll get your remediation either documented post report or risks
    mitigated through task completion. Either way, be aware that this is an important
    part of the testing/analysis/report out process.


    Depending on what was established during the preparations (see Chapter 9), the
    process for dealing with risk mitigation might look something like this:


    +   1. Collect data and organize it into a report.


    +   2. Map the identified risks into the risk compliance program.


    +   3. Determine a fix.


    An example may be the SQL injection attack identified in the pen test report.
    The fix may be to secure the database with patching, configuration, or additional
    security applied.


    +   4. Assign the fix.


    Resource allocation is an important part of project management. You want to be
    sure whoever is assigned can handle the efforts before rescan. There is no reason
    to retest if you know the vulnerabilities still exist.


    +   5. Go through the change control process to mitigate the issue.


    +   6. Mark the item as complete and retest.


    A retest will likely show this issue longer exists. If a retest flags the issue
    again, it goes back into the report and the risk register item is reopened.'
  merge: -1
