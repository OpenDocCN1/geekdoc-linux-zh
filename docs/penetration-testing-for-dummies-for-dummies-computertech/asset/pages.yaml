  md: '# FIGURE 4-9.

    Using Wireshark to capture and expose data protected by SSL.


    ![](img/c028467b75a4f3372e49c00c9bd53148_77_0.png)


    As a pen tester, encryption is a great way to show that you''re at risk by some-simply
    running a packet capture tool, grabbing network traffic, and picking out information
    that gives them access to your network. This is why encryption is so important.


    # SSL/TLS


    **Secure Sockets Layer** (SSL) is a protocol that provides encryption, an authentication
    method, and provides message integrity. It can be implemented in different strengths
    and the bit strength denotes how secure it is. For example, 40-bit encryption
    is not as strong as 128-bit encryption (SSL 3.0). Tools such as Metasploit or
    Ness help you identify weak versions of encryption.


    Transport Layer Security (TLS) is an community-standard that provides many of
    the same services as SSL. It''s more extensible and more commonly used in today''s
    infrastructures. SSL and TLS are used when data is in transit (not at rest).


    # SSH


    Many older systems still have a telnet daemon or service running that allows an
    attacker to begin a password cracking attack. A secure shell (SSH) is the stronger
    replacement for telnet.


    It''s an application and protocol that allows you to remotely log in to another
    computer using a secure tunnel and allows you to secure data (much like SSL does)
    in transit from being captured and through encryption. A session key is exchanged
    from the computer requesting a connection to the computer you want to connect
    with, and this builds the secure channel between them.'
