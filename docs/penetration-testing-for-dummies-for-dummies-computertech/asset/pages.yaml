  md: '# Buffer Overflow Attacks


    The buffer overflow attack is a very common exhaustion of memory on any device
    in your enterprise that has a buffer (which is pretty much all of them). A buffer
    is an available memory space on a device that allows for incoming traffic to queue
    so the system architecture can take it and process it accordingly. This is a common
    design that allows your systems (and the hardware everything runs on) to operate
    correctly.


    Figure 6-6 shows the most common use of a buffer overflow attack to overwhelm
    a network router (externally facing) to overfill the memory so it can''t take
    in any legitimate requests. Legitimate requests would be other connections looking
    to use resources such as a web page you may host from a server behind a network
    firewall.


    In this attack, I am showing the most vulnerable aspect of the device to interrupt
    based on needed functionality for it to operate correctly. A router must be able
    to take data and process it to make decisions on where to router traffic. Figure
    6-6, the buffer may be normally at 60% and that''s a very busy router. If I an
    ethical hacker flood it with traffic to overwhelm it (bring it to 100% utilization),
    I can then watch as legitimate requests drop which is the normal and intended
    functionality of the routing device.


    ![](img/c028467b75a4f3372e49c00c9bd53148_99_0.png)


    FIGURE 6-6:

    How the buffer overflow attack works.'
