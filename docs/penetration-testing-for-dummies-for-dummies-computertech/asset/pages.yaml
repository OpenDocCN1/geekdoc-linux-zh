    # Conclusion


    The Conclusion section takes everything you compiled into your report and succinctly
    wraps it up with a focus on next steps. Repeating what you write in the executive
    summary can be okay, as long as you switch the focus to next steps. You of course
    outline next steps in the body or anywhere else in the report, the conclusion
    at the end should take one look at next steps holistically and purposely. Figure
    11-5 shows an example.


    As you can see, the next step is to do a retest (which I cover in Chapter 13)
    to ensure that any documented changes, fixes, risk avoidance, or compliance items
    were handled and done so correctly. A retest will prove that.'
