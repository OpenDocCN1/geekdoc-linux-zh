  md: 'The pen test report may show that the network was breached through a social
    engineering attack that allowed for the login to a centralized system with user-name
    and password combo that was provided by a mistaken helpdesk technician. When hackers
    socially engineer an attack, they can be very believable. Because of this, there
    needs to be a good mix of technology-based security assets also a blend of end-user
    awareness through classes, seminars, and webinars to help end users aware about
    these types of attacks.


    +   **Policies:** You''ll restrict things like using your personal mobile device
    for corporate business and your corporate devices for personal business.


    +   **Consistent auditing:** This can help to provide feedback on programs and
    how end users feel about security and their ability to withstand an attack. By
    testing them with a phishing email, you can see whether they click it and give
    you access. If this happens, you want to see how many end users did this through
    an audit and use that metric as the basis for getting more training for your workforce.


    People and skills are important to consider. The more your workforce knows about
    security, the more likely they will suspect an attack and do something about it
    if they recognize it.


    +   **Separation of duties and a need-to-know environment:** Administrators only
    have access to what they need, not to the entire domain in Windows (as an example).
    Maybe every network engineer does not need access to the core. Maybe the storage
    administrator should request higher level access as needed and required.


    By separating these, you can protect your assets with a higher security posture.
    It also helps to alleviate mistakes.'
