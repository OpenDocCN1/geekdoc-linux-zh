  md: '# Types of malware include but are not limited to:


    +   ** Virus:** A simple program created to replicate itself to other computers,
    systems, and programs when it''s executed. The most common theme with a virus
    is that it needs to be executed to be harmful, so it''s usually followed by some
    form of trickery to execute it. This trickery can be in the form of phishing,
    social engineering, click baiting, and so on.


    +   ** Worm:** A worm is similar to a virus and a bad form of malware in that
    it is self-replicating. The worm uses holes in your security that it can piggyback
    on to replicate.


    +   ** Trojan Horse:** In ancient Greek mythology, the Trojan horse was used to
    trick those who thought it be a gift to accept and bring it into their protected
    area (through their gates), unknowing that within it were many soldiers ready
    to battle. This is why this piece of malware is called a Trojan horse. It misleads
    you into thinking it is something you want or need, but in the background contains
    a piece of malware that causes you.


    A Trojan horse (sometimes just referred to as a Trojan) is devastating to those
    it installs because spy on you (capture your passwords/credentials), activate
    and use your machine (to launch attacks), and other things, such as leave a backdoor
    open to enter your systems from the host it has occupied.


    +   ** Spyware:** Spyware does exactly what it says; it spies on you and your
    activities while lying dormant on your system. It can collect information and
    send it to those who find most value in the collected data sent by the malware.


    +   ** Zero day:** A zero day is a simple piece of code that has an exploit that
    has to be identified. It''s ripe for the picking by hackers if they find it before
    you do. It''s one of the hardest attacks to prevent. Zero days can come from coding
    by a vendor or a proper exploit code or malware. Either way — the zero day event
    is because no one knows about it.


    +   ** Logic bomb:** The logic bomb malware is set to activate on a set of criteria
    taking place. For example, the payload, a bomb could be delete a bunch of files
    on your local computer at a certain time, a certain keystroke, or a certain click,
    which would be the logic that activates.


    +   ** Ransomware:** Covered in more detail in the next section, this type of
    malware happens to be one of the most devastating. It feels worse than the others
    because you''re left to interact with the hacker — who has caused you this problem
    and is demanding a ransom for the release of your property.


    Ransomware is a destroy attack with a timer. If you fail to pay the ransom, the
    encrypted data is held hostage forever and you can''t use it leaving in a devastated
    state. Anyone who doesn''t have reliable and timely backups is left helpless.'
