  md: '# Introduction


    Welcome to Penetration Testing For Dummies! It is my goal to start you down the
    path to learning more about pen testing and why it''s such a hot topic for anyone
    interested in information technology security. This book shows you how to target,
    test, analyze, and report on security vulnerabilities with testing tools.


    I break down the most complex of tasks into easily digestible chunks that familiarize
    you with the details of conducting a pen test, but also why you need to do it
    and how the hackers you are trying to access your systems are doing so. Your purpose
    as a pen tester is to test systems, identify risks, and then mitigate these risks
    before the hackers do.


    It takes a person with hacking skills to look for the weaknesses that make an
    organization susceptible to hacking. The topics in this book will equip IT professionals
    at various levels with the basic knowledge of pen testing.


    # About This Book


    One of my main goals in writing this book is to give you an understanding of the
    different attacks, vectors, vulnerabilities, patterns, and paths that hackers
    use to get into your network and systems. Pen testing is intended to follow those
    same steps, security pros know about them (and can fix or monitor them) before
    the hackers do.


    For this book, I use a Windows workstation and where I must, I use Linux tools
    from a virtual machine. I have chosen this because this is where many beginners
    are likely to start their pen testing journey. For this book, you can use any
    current supported version of Windows (Windows 7 and above) on a device that has
    a network connection (wired and wireless).


    A highly experienced pen tester will likely use a native Linux system like Ubuntu
    (as an example), but you do not need to use it.


    If you are using Linux or Apple, you can follow the same steps throughout the
    book with a few modifications here and there.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Foolish Assumptions


    As I was writing this book, I assumed you work in IT and want to transition to
    security. It is the go-to-book for those who have some IT experience but desire
    more knowledge of how to gather intelligence on a target, learn the steps for
    mapping out a test, and discover best practices for analyzing, solving, and reporting
    vulnerabilities.


    You might have an entry-level or junior position, or you might be a manager or
    director, with more experience than coming from a different area of expertise.
    Either way, you want to know more about how pen testing fits into the big picture.
    As such, you''ll find that I explain simple concepts to clarify things in the
    context of penetration testing and overall security.


    # Icons Used in This Book


    Throughout the book, I use various icons to draw your attention to specific information.
    Here''s a list of those icons and what they mean.


    ![](img/c028467b75a4f3372e49c00c9bd53148_15_0.png)


    This icon highlights pointers where I provide an easier way of doing something
    or info that can save you. This icon contains content you definitely don''t want
    to miss, be sure to read whatever''s next to it.


    ![](img/c028467b75a4f3372e49c00c9bd53148_15_1.png)


    When you see this icon, you know it''s next to information to keep in mind — something
    I''ve discussed elsewhere, and I''m reminding you of it. It''s often advice to
    keep out of trouble.


    ![](img/c028467b75a4f3372e49c00c9bd53148_15_2.png)


    Pay attention to this icon, which I use to point out pitfalls to avoid or doing
    something (or not doing something) could land you in legal trouble (like pen testing
    something you don''t have permission to test).


