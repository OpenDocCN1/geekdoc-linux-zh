  md: '# HOW TCP/IP WORKS


    The way TCP/IP is used as protocols to establish a communication channel through
    a series of packet transfers known as a handshake. Much like when meeting someone
    new and introducing yourself then they do the same, having a common goal of embrace
    creates a bond. In TCP/IP, this handshake does the exact same things except it
    creates a channel to bond. In this source, the destination sends back a SYN/ACK
    and the source provides the three-way handshake final communication of an ACK.
    Once this happens, a connection is established and maintained between the devices
    until terminated. It may be seen as a reset packet that is known as RST.


    ![](img/c028467b75a4f3372e49c00c9bd53148_121_0.png)


