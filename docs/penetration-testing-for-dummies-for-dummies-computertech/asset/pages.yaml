    ![](img/c028467b75a4f3372e49c00c9bd53148_183_0.png)


    In general, you can apply across some of these common guidelines:


    +   **Apply hardening to the base operating system.** If you were considering
    Windows desktops (very commonly a footprint in most organizations), you would
    want to consider focusing on Internet Explorer or Edge and using policies to control
    what it allows an end user to.


    +   **Include a program for patching and compliance.** The program should allow
    all Windows desktops to be up to date with all critical security patches most
    of which stop elevated privileged and malware.


    +   **Lock down administrator rights and privileges.** You limit access rights
    for any user, admin, or anyone permitted to use the system so that they only have
    rights to do exactly what they need to.


    ![](img/c028467b75a4f3372e49c00c9bd53148_183_1.png)


    Because administrator accounts have access to literally everything, considering
    them honeypot accounts ensures unstopping hackers looking to attempt to use them.
    Or disable them give rights to the named accounts of your users and admins with
    login enabled to ensure that no unnamed accounts remain in use with the power
    to do anything on your systems.


    +   **Ensure the desktops using an updated antivirus program.


    +   **Stay abreast of new features available with newer versions of operating
    systems.** With these newer features come updated forms of security, and you''re
    responsible to know about these updates and consider recommending them if you
    found you able to penetration and exploit a system because it was not available.
    One example of this may be the Windows 10 Attack Surface Reduction (ASR) feature
