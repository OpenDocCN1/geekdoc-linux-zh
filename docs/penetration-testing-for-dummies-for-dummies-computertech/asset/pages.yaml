    # # Segmentation and virtualization


    One important one is a different view on segmentation. You should always put critical
    systems into separate parts of the network whenever possible. This doesn''t just
    mean network components; it also means the systems that connect to your network
    such as servers. This can be easily accomplished with virtualized servers (or
    virtual machines) within a virtualized host.


    Also consider virtualization. With the use of VMware and other technologies you
    can create virtual machines (VMs) which allows you to create logical networks
    instead of physical ones, much like VLANs.


