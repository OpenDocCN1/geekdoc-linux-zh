    # Internal network


    Making recommendations to secure a local internal network are fairly straightforwardforward:


    +   **Make sure the recommendation is correctly documented.** This is true of
    any recommendation of any IT system or services. Documentation helps all better
    understand, respond to, secure, and operate their technology investment.


    +   **Use IANA IP addressing blocks and segment your network correctly.** Keep
    critical resources on private networks or VLANs that you can use your routers
    or layer 3 switches by controlling access with access control lists or only routing
    approved segments to these private. This step helps to mitigate hop-by-hop attacks
    and stop many hackers in their tracks.


