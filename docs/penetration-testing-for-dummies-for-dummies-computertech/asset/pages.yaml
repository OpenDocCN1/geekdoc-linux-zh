    # # General Security Recommendations:

    All Systems


    From ports and unused services to firewalls and encryption (and more), this covers
    several recommendations that don''t fall specifically under networks and systems.
    Though general in nature, they''re still important, of course, and I take them
    one by one.


    # ## Ports


    One of the most common items to appear on pen test reports is ports. Closing unnecessary
    server ports helps if you can''t change them or reread them. The IANA registry
    shows the list of commonly used and assigned ports:


    https://www.iana.org/assignments/service-names-port-numbers/service-port-numbers.xhtml


    It''s important to be aware of ports and how they are used and configured. Ports
    are commonly how attackers and pen test remote systems through socket connection
    by a port and IP address. The example in 12–6 shows one of the ways you can secure
    a system by changing the default port. Another consideration is, if Server A wanted
    to access web services on Server B, it would have to do so by specifying the port
    by number and look like: 10.1.1.11:8080.


    # ## Unneeded services


    Remove unneeded services from systems and audit them periodically for. What this
    means is, if you find that you have the FTP service running on most of your servers
    but FTP is only really needed on two, remove the unneeded ones.'
