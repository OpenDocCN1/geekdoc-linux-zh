  md: '# Chapter 14

    Top Ten Myths About Pen Testing


    myth is defined as a phenomenon or a widely held idea or belief that is usually
    incorrect. When you think about security analysis and doing pen tests, you might
    have some beliefs that may be wrong. For example, years ago everyone thought that
    if you were called a hacker you were a bad guy. Now, that''s not the case. With
    white hats, grey hats, and the many people hear the term hacker and know it isn''t
    always a bad thing.


    That said, there are people who believe things like, "Pen testing will secure
    my organization or provide an adequate amount of security." Pen testing will help
    to develop your security posture and increase your security level, but it is not
    the one thing you can rely on to secure your organization completely.


    This chapter contains most of the common questions and concerns folks about what
    is true and not true about pen testing. Keep these myths in mind, but don''t consider
    them definitive. There''s always more to learn.'
  merge: -1
  pgno: 207
- img_proc: true
  md: '# # All Forms of Ethical Hacking Are the Same


    Many forms of security analysis take place. As a security professional, knowing
    which one to conduct at appropriate times is important to understand. Vulnerability
    assessments, for example, are used to check the status of systems to find and
    expose weaknesses. Pen testing is the act of actively trying to penetrate defenses.
    This includes (and is not limited to) using any tool at your disposal to thwart
    the security in place to assess whether a vulnerability exists, and if so, it
    can be exploited.


    An example would be a tool that checks whether you have an open port on a firewall.
    A pen test (and ethical hacking) is acting in a role to attack and penetrate that
    and attempt to gain access, see what you can leverage from there, and continue
    in gaining access to valuable data or information.


    ![](img/c028467b75a4f3372e49c00c9bd53148_208_0.png)


    Not all forms of ethical hacking are the same. Some are just to find vulnerabilities,
    other forms are to penetrate the systems, and other forms are to conduct full-scale
    APTs.


    # # We Can''t Afford a Pen Tester


    Although many company leaders and department heads believe they need to have security
    (and also fund it), they might not be aware of the value-add that a real pen tester
    can bring to their organization nor believe one is worth the cost. So, this myth
    really has two parts:


    +   **Pen testers do not bring value.** A pen tester should be considered the
    highest level of security analyst you may have employed at your firm. An ethical
    hacker knows what hackers know. Hackers (and other forms of attackers) is why
    you have an investment in security in the first place.


    A pen tester who can identify and prevent a major breach can save a company not
    tangible assets and costs, but also intangible assets and costs such as reputation
    management. A bank that suffers a breach, for example, will likely lose customer''s
    trust and their business.


    +   **Pen testers cost too much.** Whether a company can afford one depends on
    how much that is willing to lose in the case of a security incident. My hope is
    that a book like this can help bridge the gap because there are ways to lower
    the costs of pen testing. Maybe train a trusted in-house employee (another IT
    team member) to use pen testing tools to solve security for you.'
  merge: -1
  pgno: 208
- img_proc: true
