- img_proc: true
  md: 'Within the main website you will find tons of detailed information on how to
    use this tool. As well, the forums where engineers talk about issues and things
    they find are loaded with literally thousands of pieces of valuable information
    that will help you learn more about networking, TCP/IP, the Internet, and how
    packets and frames traverse a network.


    > Need to learn more about ports, channels, communication, sockets, protocols,
    packets, headers, and so on? This is the site you need to go to learn more about
    these details.


    ![](img/c028467b75a4f3372e49c00c9bd53148_230_0.png)


    # Dark Reading


    ```

    https://www.darkreading.com

    ```


    In today''s pen testing world, one of the go-sites for security professionals
    is Dark Reading. Dark Reading helps provide information not only on old but breaking
    news stories geared towards an online community of security gurus and professionals
    looking for more information about topics like pen testing.


    You''ll find newsletters and feeds and the sections on Attacks and Breaches help
    you emulate scenarios in your pen testing, stay on top of trends, and conduct
    ethical hacks to test your security posture.


    # Offensive Security


    ```

    https://www.offensive-security.com/

    ```


    From the distributors of Kali, Offensive Security is a company that specializes
    in doing penetration testing. Offensive Security offers penetration testing services
    as a service, and they provide a certification as well. On this site, shown in
    Figure 16–5, you can learn more about pen testing from the experts who do it in
    and day out. You''ll find sample checklists, tools, reports, and a lot of the
    things you might want to emulate in your own pen tests.'
