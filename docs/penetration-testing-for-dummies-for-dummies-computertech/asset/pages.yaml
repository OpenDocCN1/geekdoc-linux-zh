    # # Taking Your First Steps


    When you''re ready to pen test, these are the general steps you''ll take:


    +   1. **Download and run a pen test in a safe environment such as your home.**


    Running a pen test in a production environment that causes an outage a denial
    of service attack, prevents other people from using your system. Make sure you
    are doing things safely and as controlled as possible to test and find risks,
    not create outages and impact. Discuss denial of service attacks in Chapter 6.


    +   2. **Download a free tool and start to investigate.


    I discuss many available tools in Chapter 3, but for a basic test, I recommend
    using a vulnerability scanner. Figure-1 shows Retina CS from BeyondTrust (www.beyondtrust.com),
    which allows you to run scans to see what a host is susceptible to what threats
    are exposed.


    +   3. **Scan a single host by its IP address, or an entire IP subnet with many
    hosts on.**


    This step helps identify target systems that need to be reviewed based on the
    reports they generate for threats and exploits that exist on them.


    +   4. **Document the host or hosts you are testing and which attacks you want
    to try based on the information you have gathered.**


    Your goal here is to find vulnerabilities.


    +   5. **Penetrate.**


    This is the part of the pen test that actually conducts the known hack to if you
    can execute it.


    +   6. **Follow up with your findings.**


    You can report the findings, fix the issues, monitor the issues that you don''t
    have fixes, contact the vendors to get fixes, block access, and so on.'
