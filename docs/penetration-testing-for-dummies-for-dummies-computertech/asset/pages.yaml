    > If you can''t afford to set up your own lab environment for testing purposes,
    seeking outside resources as this can really help develop your skills.


    # Open Web Application Security Project


    ```

    https://www.owasp.org/

    ```


    The Open Web Application Security Project (OWASP) was established in 2001 and
    is currently not-for-profit organization that works on the foundation of group
    collaboration. OWASP is a group that boasts open source and does so with no affiliation
    of any kind. Their focus is on web application hacking and the security of applications,
    software, web apps, and programs.


    The frameworks, information, and resources provided help to guide a pen tester
    into areas of risk and vulnerabilities surrounding applications such as hacking


    ```

    https://www.owasp.org/index.php/Category:Vulnerability

    ```'
  merge: -1
  pgno: 227
- img_proc: true
  md: 'This can help you get better understand in-depth details about SQL injection,
    fuzzing, and other topics surrounding programming and software hacking, and what
    you seek to penetrate and expose these systems as an ethical hacker. Figure 16–3
    shows the ten application security risks at the time.


    ![](img/c028467b75a4f3372e49c00c9bd53148_228_0.png)


    | Top 10 Application Security Risks |

    | 1. Injection | Injection flaws occur when data, such as SQL, NoSQL, or LDAP
    queries, untrusted data is sent to an interpreter in a query or command, usually
    into executing unauthorized commands or accessing sensitive data. |

    | 2. Broken Authentication | Authentication functions are incorrectly implemented,
    allowing attackers to compromise passwords, keys, or session tokens, or assume
    identities. |

    | 3. Sensitive Data Exposure | Many applications fail to protect sensitive data,
    such as credit card numbers, social security numbers, or health records while
    in transit or at rest. |

    | 4. Broken Access Control | Insecure direct object references (IDOR) occur when
    access control to objects based on user input is not properly gated, allowing
    attackers to access data outside of their intended permissions or modify or delete
    other users'' data. |

    | 5. Security Misconfiguration | Misconfiguration is the most common vulnerability.
    This is caused by security settings, misconfigured HTTP headers, and verbose error
    messages containing sensitive information. Not only must vulnerabilities be fixed,
    but they must be patched in a timely fashion. |

    | 6. Cross-Site Scripting (XSS) | XSS occurs when an application includes untrusted
    data in a web page without proper validation or encoding. An attacker can use
    the user-supplied data to execute scripts in the victim''s browser. |


    # # Tenable


    > https://www.tenable.com


    Tenable makes Nessus, and you can visit the website for more information on vulnerability
    scanning, pen testing, and research. One of the greatest things you can find on
    the Tenable website is a series of tools and information focused on pen testing.
    In their research papers are details on how to become a better pen tester:


    > https://www.tenable.com/research


    Figure 16–4 shows the Tenable website where you can download Nessus for trial,
    or purchase a license for permanent use.


