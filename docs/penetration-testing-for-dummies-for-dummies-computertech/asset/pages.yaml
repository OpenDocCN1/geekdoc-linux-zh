    # Chapter 1


    # Understanding the Role Pen Testers Play in Security


    Penetration (or pen, for short) testing is one of the hottest up and coming skills
    any IT professional needs to have. As more and more technology takes over our
    world, the need to ensure it''s safe and secure is at the forefront. Companies
    are actively looking for professionals with a background in IT security and the
    ability to do penetration testing.


    As a tester, you need a solid understanding of how an attacker can access your
    systems and how they can conduct attacks. Not to fear, I walk through these attacks
    and the mind of the hacker. You have to think like a hacker to be a good pen tester,
    which is why pen testers are called white hats, grey hats, or ethical hackers,
    which I explain in more depth in Chapter 2.


    I lay out everything you need to know about security vulnerabilities and introduce
    you to the tools, techniques, and skills that today''s most elite pen testers
    use on a daily basis to conduct penetration tests that keep their company''s assets
    safe.


    CHAPTER 1 Understanding the Role Pen Testers Play in Security 7'
