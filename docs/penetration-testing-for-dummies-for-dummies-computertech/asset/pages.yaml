  md: 'entrusts to their organization. This means you must have a way to determine
    and prove that compliance is met.


    Here are just two (although common) standards of compliance:


    +   **Payment Card Industry Data Security Standard (PCI DSS):** This is a compliance
    standard that organizations must uphold to use credit cards, cardholder data,
    and safeguard against fraud. Pen testing and risk compliance are big components
    toward the compliance of this standard.


    +   **Health Insurance Portability and Accountability Act (HIPAA) of 1996:** This
    was put into effect as a piece of United States to ensure that patient privacy
    is guaranteed by health providers, who are held to high standards, audited, and
    fined heavily if not compliant.


    Other industries have other standards of compliance. Always be sure you''re aware
    of any compliance issues and what it takes to maintain compliance.


    # Hacker Agenda


    An integral piece of this chapter is to talk about how you''re fighting: the bad
    guys, otherwise known as *hackers*. The problem with calling them hackers is that
    technically, the good guys are hackers, too. The whole culture is confusing, so
    I attempt to demystify it with simple explanations of a myriad of definitions.


    First, forget the bad and bad of it. Think neutral — a hacker is someone who likes
    to pull apart computers, systems, code, or applications to further investigate,
    test, probe, or learn from them because they''re intrigued. That''s it! That''s
    simple really real. Your typical hacker is someone who likes to needle with complexity.


    Now, I consider motives. I cover bad guys, so you can better understand your enemy.
    In some situations, however, the bad guys might become yours. Some elite hackers
    have joined forces with law enforcement as part of their plea—bargains and have
    shown them skills!


    I also cover the most commonly used terms in the hacker community today to denote
    and identify who''s a good guy (white hat), a bad guy (black hat), or some—where
    in the middle (grey hat).'
