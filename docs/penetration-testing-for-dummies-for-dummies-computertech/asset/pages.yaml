    # Chapter 8

    Subvert (Controls Bypass)


    The definition of subvert is to undermine and get within control. In the realm
    of IT security, this means you get within and beyond controls or control points
    that are meant to secure access. Subvert attacks bring their intense brand of
    nastiness to the security equation.


    Advanced persistent threats (APTs) are the holy grail of hacker attacks where
    an attacker can infiltrate, gain what they need, and then move to exfiltration
    undetected with the goods. There are other attacks that are less advanced such
    as bypassing controls such as an access list undetected without being caught or
    logging into a system undetected data. Some malware can also be introduced to
    elevate privileges of accounts that can then be used to bypass other security
    controls.


    In this chapter, I discuss these and other forms of subvert attacks.


    # Toolkit Fundamentals


    In this section, I show you the tools for conducting a pen test to simulate subvert
    attacks, which are attacks that get past security controls. Tools such as Kali,
    Nmap (which I discuss further in an upcoming section), Wireshark, and others are
    used to scan for vulnerabilities in your systems. With many such attacks, subvert


