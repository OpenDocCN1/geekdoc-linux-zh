  md: 'applications. It''s a model of standards that shows the under the hood actions
    of the technologies at each layer. Figure 1-2 shows an example of the OSI model.


    | |

    |---|

    | Application |

    | Presentation |

    | Session |

    | Transport |

    | Network |

    | Data Link |

    | Physical |


