  md: '# # Running a Pen Retest


    To do a pen retest, you follow the same steps from Chapters 9 and 10. You select
    your tools after your goal and scope have been defined, appropriate permissions
    and access, set up logging, and then move to gain control and final approvals.
    Nothing has changed except you focus on specific areas, items, and artifacts derived
    from the last pen test, report, and the risk register.


    Although I point out what you can do as a pen tester in this chapter, you are
    ethically hacking, so you need to know where and how to stop your attack — you
    don''t want to crash and burn your company or your client''s systems.


    ![](img/c028467b75a4f3372e49c00c9bd53148_203_0.png)


