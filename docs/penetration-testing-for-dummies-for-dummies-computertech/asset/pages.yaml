  md: '# # What You''re Not to Read


    This book is written so you aren''t required to read it beginning to end. If you''re
    familiar with the basics of penetration testing, for example, you can probably
    skip the first part. You can skip Part 2 if you feel you have a pretty good handle
    on attack types and various pen testing tools. Technical Stuff are truly technical
    pieces of information that I file under “nice to know” skip those, as if you''re
    looking for need-to-know content only.


    # # Where to Go from Here


    If you''re truly new to the world of penetration testing, I recommend you begin
    with Chapter 1 and read from there. Readers with a grasp on pen testing fundamentals
    — what it is, the role of the pen tester, types of hackers, attacks, and so on
    — but who want to hone their testing and/or reporting skills, for example, can
    go straight to Parts 3 and 4, respectively.


    Looking for information about a particular tool or attack? Use the Table of Contents
    or Index to cover that thing and go straight to that discussion. Advanced readers
    might want to read only those sections that cover any area they need to bounce
    up on.


    Of course, I recommend Chapters 15 and 16 for everyone because continual learning
    is so important to becoming and remaining an excellent pen tester.


    You can also make pen testing topics on the book''s cheat sheet, as pen testing
    terminology and specific certifications you''ll find useful in your career. Go
    dummies.com and search for “Pen Testing For Dummies cheat sheet” to find it.


    > The more you study, read, and work in the field, the more you''ll learn as your
