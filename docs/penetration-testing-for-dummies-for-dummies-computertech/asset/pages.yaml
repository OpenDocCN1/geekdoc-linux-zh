  md: '![](img/c028467b75a4f3372e49c00c9bd53148_91_0.png)


    # USB drives


    Other advanced attacks take place through a very unknown vector, which is the
    USB drive. A hacker, criminal, or other nefarious person can place a USB stick
    (also known as a thumb or jump drive) in your computer and be in the middle of
    your business. Tools such as Sophos (sophos.com) install software that blocks
