- img_proc: true
  md: '![](img/c028467b75a4f3372e49c00c9bd53148_127_0.png)


    # # Bypassing AV software


    AV bypass is common and one way to get through your host-based defenses. Local
    firewalls are bypassed in the same fashion. When this happens, malware, viruses,
    worms, Trojan horses, backdoor/rootkits and other nasty pieces of code will enter
    and allow for further attacks remotely. The attacks can happen locally, too; raised
    or elevated privileges on the host machine allow more access than the user may
    have had previously.


    CHAPTER 8 Subvert (Controls Bypass) 111'
  merge: -1
