  md: '# Smurf Attacks


    When running tests for a smurf vulnerability assessment don''t believe for a little
    blue people will show up and wreak havoc on your systems. Havoc will be created
    by the actual DDoS attack where ping sweeping is done from spoofed IP addresses
    to a legitimate host resource in hope to deny it functioning. This has nothing
    to do with the fictional characters and every- do with real characters trying
    to create a denial of service attack.


    Similar to when a large amount of data causes the DDoS that ultimately causes
    the disruption, with a smurf attack, the actual data used to create the overwhelming
    interrupt of requests legitimate service comes in the way of the Internet Message
    Protocol (ICMP). This protocol is commonly used in tools such as ping and traceroute
    (or tracer for Windows). Smurf attacks can be conducted from any device that sends
    pings, which is nearly every tool in this book (Nessus, Metasploit, Nmap, Kali''s
    tools) but also from any console where ping can be manipulated.


    6-9 shows Linux''s ping tool to be configured to change the time to live (TTL),
    the size of the ping packet, the volume of packets, and so on that allows the
    packets that are changed to create disruption to the network interfaces it will
    receive.


    Smurf attacks (with tiny packet and Xmas tree attacks, too) take the technology
    it was intended to use and manipulates it in a way that creates a DDoS attack.


    ![](img/c028467b75a4f3372e49c00c9bd53148_104_0.png)


    6-9:

    Using ping to generate a sweep and smurf attack.


    ![](img/c028467b75a4f3372e49c00c9bd53148_104_1.png)'
