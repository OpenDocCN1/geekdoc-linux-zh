  md: '# Attack Vectors


    To help explain attack vectors, Figure 8-6 shows that regardless of whether an
    attack originates from inside or outside your protected network, the concepts
    are the same. I am going to conduct a pen test to see if I can probe your network.
    I may do this from a spoofed address or I may launch an attack from a Trojan installed
    on a machine that a victim may not be aware of.


    ![](img/c028467b75a4f3372e49c00c9bd53148_123_0.png)


    FIGURE 8-6: Internal and external subvert attacks operate under the same concepts.


    In this attack vector, the hacker (in this case, me) is looking to gain access
    and do so undetected. Byfiltrating the network step by step (or hop by hop), I
    can begin sneaking my way inside to collect information from valuable data sources.
    Here''s how I did it:


    +   1. The first hop will be through a router scanned with Nmap and found that
    it was vulnerable due to a weak password.


    By conducting a password crack, I am inside the first hop and ready to attempt
    to gain access to the next hop. In this router, I am able to conduct a series
    of next steps to find more information: I can look at the router table, the MAC
    address table, ARP cache, and other non-proprietary features to learn where to
    go.


    I can look at the router''s configuration file and see how it is configured. For
    example, if I see that there is a port connected to another network with an IP
    address and subnet mask associated for only four valid hosts to include the'
  merge: -1
  pgno: 123
- img_proc: true
  md: 'network and broadcast identifiers, I can assume that the one configured IP
    address is 10.1.1.2, perhaps the next one across the wide area network (WAN) link
    may be 10.1.1.3. I can quickly ping or attempt to telnet to the next hop to see.


    Proprietary systems such as Cisco brand routers use other protocols and services
    such as CDP (Cisco Discovery Protocol), which allows for the building of a database
    of neighbors that can be accessed by running the show CDP command as another example
    on how to get information on adjacent hosts.


    +   2. I can attempt to access router hop 2 and do the same procedure as hop.


    +   3. I then attempt to get to hop 3, which is a switch that accepts telnet as
    an option.


    I also list a firewall device between the router and the switch, but this may
    signify an access control list (ACL) that disallows traffic or attempts and may
    not be an actual separate firewall device.


    If the other or any other device is misconfigured and allows connections through,
    I may be able to get to the third hop.


    Once I am able to maintain a connection in the third hop, I may be able to run
    a ping sweep from the switch device or look at the MAC table to see what may be
    connected. Inside I find a Linux host that I find interesting because it too accepts
    connections from telnet and host allows me to quickly crack and gain access to
    the system.


    Here I can then look through the system and see whether it hosts any internal
    data I can use, or I can remain dormant to see whether there are other secrets
    elsewhere at another time.


    Although this is a simplified explanation of a pen attack with a lot of misconfigurations
    and protocols that should be disabled and more secure versions used (such as SSH
    instead of telnet), it does not mean that this attack is unachievable. Believe
    it or not, this hack is still being conducted.


    What it should teach you as a pen tester is that the attack vector and path taken
    would be the same matter what types of attacks were used or attempted. If a piece
    of malware was inside your network and a hacker can control the host if it is
    attached to they, they would conduct this exact series of attacks.'
