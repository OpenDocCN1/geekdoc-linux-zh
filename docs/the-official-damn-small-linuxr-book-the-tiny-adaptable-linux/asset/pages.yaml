- pgno: 65
  md: 'Upon selecting the desired keyboard, DSL attempts to start the X Window System.
    If all goes well, you shortly arrive at your final destination, the DSL desktop
    (refer to Figure 2-1). If you find that the screen is unreadable or the colors
    are horribly off, you can continue your quest to find the appropriate boot codes
    for your particular hardware. You can press Ctrl+Alt+Backspace to exit X; at the
    system prompt, type xsetup.sh and select another set of options for this, the
    third stage DSL booting.


    After you have arrived at the DSL desktop, you want to save your configurations
    for X, resolution, mouse, and keyboard. The full details of configuration backup
    and restore are covered in Chapter 4, “Configuring and Saving DSL Settings.”


    # Advanced Boot Options


    To boot DSL and be able to assign passwords to the super-user root and user DSL,
    add the secure boot option. This option is a must if you also plan to start daemons—that
    is, services available for local or network use. You are prompted during the boot
    sequence to enter your chosen passwords. For example, to start the NFS (Network
    File System) and SSH (Secure Shell) services, you can type the following options
    at the boot prompt:


    ```

    boot: dsl nfs ssh secure

    ```


    Using the host boot option allows you to set the hostname of your machine. This
    is very useful when providing other network services or if you happen to run many
    DSL boxes.


    Add dma to your boot option list if you have newer hardware. This direct memory
    access method speeds up access to your CD drive, as well as to your hard drives.
    (Most PCs built in the past ten years support DMA.)


    # Running in Background Services Daemons of DSL


    DSL provides several local and network services. These services run unattended
    in the background. Most distributions start many background processes. DSL does
    not. In fact, this is another reason why DSL is not just a small distribution
    but runs so well on very small resource machines. Knowing this, you must use a
    boot code to start up each of the services that DSL provides.


    Services you can start from the DSL boot prompt include printing service (lpd),
    remote login service (ssh), scheduled command execution (cron), system logging
    (syslog), Web service (monkey), file transfer service (ftp), and file system in
    user space (fuse).'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# SUMMARY


    Successful booting of DSL can be as easy as inserting the CD and pressing Enter.
    For the majority of users, this is their experience. Given that there are always
    exceptions to the rule, this chapter has tried to step you through all three stages
    of booting DSL. At each stage, you saw common examples based on actual feedback
    from many users who have come to the Damn Small Linux forums with their questions
    and particulars of their hardware. Hopefully, sharing these stages has made booting
    DSL a pleasant experience.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Using DSL Applications


    Damn Small Linux is designed to be a fully functional desktop in a very small
    package. The native applications in DSL are chosen for their blend of compact
    size, speed of use, and functionality.


    The DSL developers and user community has spent more than three years refining
    our choice of applications in DSL, and we believe in the quality of our overall
    package. There have been several changes over the last few years as we worked
    out the best combination of features to fit into our small package.


    # THE LOGIC BEHIND OUR CHOICES


    The three dominant issues in choosing applications for DSL have been reliability,
    library dependency, and usability. In this process, we changed media players,
    spreadsheet application, browsers, word processors, calculators, text editors,
    and the widget language on which we base our desktop GUIs.


    GTK+ is a toolkit for creating graphical user interfaces. GTK+ was originally
    developed for the Gimp image editing program. An experienced Linux user may notice
    that there are no GTK2 applications in DSL and may wonder why. Many of our applications
    are actually based on the older GTK1.2 toolkit. The two reasons are that GTK1.2
    applications tend to be:


    +   - **Smaller.** They take up less space and have fewer dependencies.

    +   - **Faster.** Speed is very important in the DSL computing philosophy.'
  merge: -1
  img_proc: true
- pgno: 68
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 69
  md: 'The Pager is actually very handy, and we will return to it in a bit. For users
    without a wheel mouse, you can switch from one work environment to another by
    clicking the little arrow buttons on the left side of the task bar at the bottom
    of the screen (see Figure 3-1).


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_69_0.png)


    # FIGURE 3-1 The Damn Small Linux Desktop.


    If you have not yet opened an application, you should at this time. Let''s try
    opening the Aterm window. Locate the icon with Aterm in the upper-left corner
    of your screen; click it once. An Aterm terminal emulator appears, ready to use
    a shell command interpreter. Although a terminal emulator is comparable to a DOS
    window in Microsoft operating systems, it is arguably more powerful.


    Your open window looks like a transparent rectangle and has dsl@box:~$ in the
    upper-left corner. As you can see, Aterm is ready to receive instructions. However,
    we are not going to give it any for the moment! We are opening this term window
    (term is short for terminal emulator) to demonstrate an additional way to jump
    to another workspace. This one may be useful if you want to push an application
    to a workspace that is less crowded.'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'At the top of the Aterm terminal, you should notice a bar that reads Bash—on
    one end is a dot (.) and on the other an underscore, a square, and a big X. For
    now, ignore that and instead put your mouse arrow near where it says "Bash."


    There are a couple of options to move this Aterm window to a different workspace.
    One way is to right-click the bar. Doing so opens up a menu with several entries.
    For now, look at the first one, which reads "Send To." Bring the mouse arrow to
    it; the Save To menu item becomes highlighted, and a Workspace 1 submenu opens.
    If you select one of these options, the Aterm window moves to another workspace.


    Alternatively, you could press your left mouse button down in the same bar and
    instead of a drop-down menu, you get a multidirectional symbol, which indicates
    that you are now free to move this Aterm window anywhere you like. This includes
    dragging it to a different virtual workspace by moving the Aterm window to the
    left or right of the screen. Give it a try! It may seem very foreign to you if
    you are not accustomed to virtual workspaces. They are extremely useful when you
    are multitasking, and eventually you may come to depend on them.


    # The Fluxbox Pager


    As mentioned earlier, the application in the lower-left corner is a Pager; more
    specifically, it is called Fluxter, a lightweight pager made just to work with
    Fluxbox. Fluxter is configurable by editing the /home/dsl/fluxbox/fluxter.bb file
    to your liking. The default settings offer a good mix of functionality without
    crowding the workspace. Fluxter intelligently monitors which theme Fluxbox is
    using and alters its look to match the theme.


    # How to Use Fluxter


    Fluxter is very simple to use. To figure out how it works, open up a few applications.
    As they materialize on the desktop, notice that they have corresponding shapes
    in the pager. See Figure 3-2. Now, take your mouse and left-click one of the shapes,
    hold down on the mouse button, and move the shape around. The application that
    corresponds to the shape in Fluxter is moved in the desktop. If you drag the shape
    to another cube in Fluxter, the corresponding application moves to the virtual
    workspace it represents.


    FIGURE 3-2 Fluxter: square shades represent applications.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_70_0.png)


    Fluxter can also be used to switch virtual desktops. To do so, simply click the
    middle mouse button on the virtual desktop you want to go to.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# NOTE


    It is possible to simulate a middle button click by pressing the left and right
    buttons together on a two-button mouse. However, please note that you must configure
    your X setup (/usr/sbin/xsetup.sh) so that it thinks you have a two-button mouse,
    not a three-button mouse, by default. To change the default setting, run the xsetup.sh
    script. After running the X setup script, three button emulation will be activated
    when you restart the X server.


    # More Fluxbox Functionality


    At the top of each application window, you should see four buttons. On the left
    side, you can see a button with just a dot (:); pressing that button causes the
    application to stick to the screen, meaning it will be present in all virtual
    workspaces. You can see the application suddenly appear in all the cubes in the
    Fluxter pager. Observe that the dot increases in size when pressed. Depressing
    the button causes the application to have normal virtual desktop function again.


    The buttons on the right side are probably much more familiar. The one with the
    underscore bar iconifies, which means it pulls the application off the desktop
    space and into the taskbar. You can click it in the taskbar to restore the application.
    The middle one on the right with the box-shaped icon maximizes and contracts an
    application. Finally, the big X button closes the application.


    Double-clicking with the left mouse button on the top window dressing causes an
    application to pull up into the titlebar. Fluxbox calls this function shade.


    Resizing applications is really simple: just bring the mouse arrow to either of
    the bottom corners of an application, then press and hold the left mouse button
    down. You should notice that the mouse arrow gets replaced by a right angle graphic.
    While holding the mouse button down, move your mouse and you can see that the
    application is changing shape. Unclick the mouse and the application holds the
    new shape.


    # Grouping Applications with Tabs


    One of the features that sets Fluxbox apart from other window managers is the
    ability to group windowed applications. This powerful adaptation makes a working
    environment very space efficient and extremely work efficient. Because of this
    capacity, Fluxbox is a joy to use, even in tight resolutions such as 800×600.


    Figure 3-3 shows an example of a multitab window with a terminal currently being
    displayed. (Bash indicates the shell that is running within that terminal.)'
  merge: -1
  img_proc: true
- pgno: 72
  md: '![](img/af53325d7f38f1cdafca9f44568e4ab8_72_0.png)


    # FIGURE 3-3 Fluxbox lets you use tabs to keep multiple windows within a single
    window frame.


    To use tabs, you need a three-button mouse, or a two-button mouse with three-button
    emulation. You will notice that all windowed applications have a small tab at
    the lower left of the windows trim.


    For your first attempt at using tabs, let’s launch two applications. For this
    demonstration, we will use applications that have a light contrast: Aterm and
    Dillo. Click the ATerminal icon (upper-left icon) and the Dillo icon (upper-right
    icon) to open each. Now, take your mouse arrow and hover it over the Aterm tab
    (it says Bash). Click and hold your middle mouse button.


    Now, while holding the middle mouse button down, move your mouse so that it is
    in the center of Dillo in the second window. You should see a small rectangle
    move with the mouse. Drag that rectangle to the middle of Dillo and unclickthe
    middle mouse button. You now see Aterm taking on the shape and location of Dillo.
    Dillo and Aterm are sharing the same space and windowing.


    Do you notice that in the lower left of the windowing decor, there are now two
    tabs? You can change which application is displayed by left-clicking its corresponding
    tab. If you are using a wheel mouse, you can bring the mouse arrow to the top
    window dressing and spin the wheel up and down to rotate through the applications.
    The active application will show in bold font.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'When you resize one tabbed application, all the applications resize with it.
    Also, there is no limit to how many. I am sure it is obvious how this grouping
    of applications can be very handy if you are trying to work on a project that
    utilizes many tools simultaneously.


    I use the tabs constantly, particularly if I am going to use a small or poor resolution
    monitor. Instead of having several applications open in small windows, I often
    stack the applications together and maximize them so that they are in full screen
    mode. I found it much more efficient to work with applications this way, particularly
    when I have a wheel mouse.


    It is possible to move grouped applications to other virtual desktops the same
    way I described moving single applications earlier. In addition, you can specify
    to which virtual workspace you would like to send the applications group by clicking
    the top border area of the windowing. After the menu drops down, mouse over Send
    Group To. At this point, you can select which virtual workspace you want by clicking
    one of the selections.


    # Mounting Drives and Controlling Volume


    Look for the application in the lower-right corner, a volume and drive mounting
    application that we descriptively call Docked.lua. You will see that the application
    is basically split into two sections:


    +   - **Volume Control**—The top section is a volume control. Its function is
    simple; you move the dial with your mouse to adjust the volume. The button with
    the big M is mute—press it and the sound stops. Press it again or adjust the volume
    and the sound comes back on. There is also a button labeled dMix. Click it and
    a more advanced sound mixer launches.


    +   - **Drive Control**—On the lower half of the application, you will see a gray
    bar with lettering like hda1, sda1, cdrom, or some other variation. These are
    drives that have been found to be mountable by DSL.


    The lower button gives you the status of the drive. It reads mounted, unmounted,
    or irregular, with the corresponding colors of green, red, and blue. To cycle
    through the drives, click the top button. When you see the drive that you would
    like to mount or unmount, click the lower button. Then, the application either
    does as you wish or shows an error explaining why the mounted status could not
    be changed.'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'Figure 3-4 shows an example of the Docked.lua tool.


    # FIGURE 3-4  Change audio settings and mount and unmount drives for the Docked.lua
    tool.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_74_0.png)


    Drive names in DSL have a logical order; you just have to learn how the labeling
    works:


    +   - hda is the first IDE drive (primary master).

    +   - hdb is the second IDE drive (primary slave).

    +   - sda is the first SCSI or USB drive.

    +   - sdb is the second SCSI or USB drive.


    For the partitions, the convention is to add a number to the end of the drive.


    Here are few examples:


    +   - hda1 is the first partition on the first IDE drive.

    +   - hdb5 is the fifth partition on the second IDE drive.

    +   - sda2 is the second partition on the first SCSI or USB device.


    Often, hda1 corresponds to the C drive in Microsoft Windows. hdb1 could be your
    D drive in Microsoft Windows, but the labeling convention in Microsoft Windows
    is a bit of a mystery.


    # USING THE JWM WINDOW MANAGER


    Damn Small Linux also comes equipped with another window manager, called JWM—actually,
    the version of JWM in Damn Small Linux is cut down a bit and has some of the features
    stripped out. JWM looks more familiar to people who are coming from a Microsoft
    Windows environment. JWM has a task bar and a Start button. If you find the wide-open
    world of Fluxbox too overwhelming, try JWM. It is also worth noting that JWM is
    very resource efficient, so if you have a very low power computer, you may want
    to give JWM a try. To try JWM, click on "Switch to JWM" on "WindowManager" sub-menu
    on the Fluxbox menu.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# USING DSL APPLICATIONS


    In this section, I divide applications into two classifications—GUI and terminal-based.
    Terminal applications may be used within a windowing environment in a terminal
    emulator, such as Aterm, or could be used without X if you happen to be in text
    mode. So, if you are ever on a computer that cannot run Fluxbox and you are forced
    to work in command mode, you can take solace in the fact that DSL does not leave
    you hanging.


    Okay, let’s start looking at the applications.


    # X-Based Applications


    In this first section, we are outlying the X-based applications found in Damn
    Small Linux. Here, you can find some applications that are commonplace among most
    Linux distributions, and some that you may be trying out for the first time in
    Damn Small Linux.


    # Aterm—The AfterStep Terminal Emulator


    Aterm is our terminal emulator of choice for its compact size and ability to customize.
    Despite its small size, Aterm is full-featured. It is capable of pseudo-transparency
    without being a resource hog. Aterm is capable of tinting, font color alterations,
    as well as shade settings. Another eye-candy trick is that the contents of the
    terminal will fade when off focus.


    > TIP

    > If you want to adjust the font size, try Shift+KeyPad_Add and Shift+Keyad_Subtract.
    If you want a large font that is easy to read, start Aterm from the command line
    by typing aterm -fn 10x20.

    > For more information on Aterm, refer to the Aterm home page (http://www.afterstep.org/aterm.php).


    # The Ace of Penguins


    Ace of Penguins is a suite of solitary games including FreeCell, Golf, Mastermind,
    Merlin, Minesweeper, Pegged, Solitaire, Taipedit, Taipei, and Thornq. I have played
    these games way too much. I advise staying away if you want to remain productive.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# AxY FTP a GUI FTP Client for X


    Authored by Alexander Yukhimets, the version of AxY FTP we are running in DSL
    is a GTK1.2 port. AxY FTP should have a very familiar interface for many, because
    it relies on the classic two-panel design made popular in the 1990’s, ws_ftp (a
    Microsoft Windows program). AxY FTP has a convenient session manager panel that
    can save your accounts and passwords. It also supports recursive downloads, recursive
    uploads, and passive and nonpassive data transfers.


    # Beaver—Our GUI Text Editor


    Beaver was originally developed by Damien Terrier. Its name is actually an acronym
    for *Beaver is an Early AdVanced EditoR*, which plays on the UNIX joke of having
    a self-recursive name. In DSL, it is simply the most feature-rich editor available
    in its size range. It packs features that browsers more than double its size lack.


    Beaver is very easy; it has multiple tabs and the ability to do search and replace
    over multiple buffers. Coders find the optional color highlighting easy on the
    eyes. Casual desktop users are familiar with the typical key bindings for cut
    and paste.


    Another critical feature that Beaver has is the capability to undo and redo operations.
    For coders, Beaver’s capability to turn on and off word-wrap is a must. Some of
    the lesser-known features of Beaver include its capability to convert text documents
    in and out of DOS format. This is handy if you are sharing a file between platforms.
    Beaver is also capable of converting text case to uppercase, lowercase, or proper
    case (the first letter of every word is capitalized). The version of Beaver in
    DSL is 0.2.7 and has been updated with bug fixes.


    For more information on Beaver, you can visit the project’s website at the following
    address: `http://www.nongnu.org/beaver`.


    # Calcoo—An RPN and Algebraic Calculator


    This GTK1.2-based calculator is full-featured, yet only 108Kbytes. Get more information
    on Calcoo from its project site at `http://calcoo.sourceforge.net`.


    # Dillo—A Very Light Web Browser


    Dillo is an alternative lightweight browser designed by Jorge A. Arellano Cid
    for embedded or otherwise constraint systems. Such a browser is a natural for
    DSL.


    The development of Dillo has been very methodical over the years and the project’s
    authors are very careful to write clean and concise code. This means that Dillo
    has a very solid base, yet it lacks features of a fully functional, modern browser.'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'Despite Dillo’s limited features, the version we have in DSL is highly modified
    with several patches that greatly enhance its capabilities. Our version of Dillo
    can do the following:


    +   - Negotiate SSL pages and password authentication

    +   - Render frames and Iframes

    +   - Text search

    +   - Perform GUI configuration

    +   - Support referer data

    +   - Perform user-agent configuration

    +   - Perform gzip compression

    +   - Perform meta-refresh


    Users of Dillo will be amazed at how fast it loads and how quickly pages render.


    For more information on Dillo, refer to the Dillo project site at www.dillo.org.
    Refer here for details on Dillo internationalization: http://teki.jpn.ph/pc/software/index-e.shtml.


    # EmelFM—A Highly Configurable Two-Panel File Manager


    EmelFM has a simple-to-use interface; bookmark and history lists; multiaction
    selection for each file type, filename, size, and date filters; a very handy built-in
    command line; user-defined menu; loadable plug-ins; and configurable toolbar.


    In DSL, we integrate EmelFM into our desktop for the convenience of the user.
    For example, in the Fluxbox menu, we have both user- and root-level options. We
    also built in a MyDSL button for extension management and have emelFM use native
    DSL applications as the default whenever applicable.


    Basically, we configure EmelFM so that it works in our lightweight environment;
    thus, it will call Aterm instead of Xterm, as well as our Wordview Lua program
    (written by Robert Shingledecker) to view Microsoft doc files. Figure 3-5 shows
    an example of an EmelFM window.


    For details on emelFM, visit its project site at http://emelfm.sourceforge.net/.


    # Firefox—The Open Source Web Browser from the Mozilla Foundation


    Firefox is a very robust and capable browser. It is by far the largest application
    in Damn Small Linux, yet we do make provisions to get the size down, including
    building against GTK1.2 and having our version use system fonts.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '![](img/af53325d7f38f1cdafca9f44568e4ab8_78_0.png)


    # FIGURE 3-5 Use emelFM to manage files in DSL.


    Firefox is very capable; it has a full Javascript interpretation engine, renders
    SSI, does FTP, authentication, animated GIFs, tabbed browsing, is Java ready,
    and can do just about anything else you would need from a browser.


    See the Firefox home page (www.mozilla.com/en-US/firefox) for further information.


    # gPhone—A VoIP Application


    gPhone, or Gnome-a-Phone, is an IP-to-IP Internet telephone that uses librtp for
    audio compression. Although gPhone isn''t designed to make calls to public telephones
    (as the Skype service described in Chapter 14, "Using Skype VoIP Service in DSL,"
    can), it does include nominal support for RTP/RTCP. This enables gPhone to allow
    you to talk to other Internet telephone services that support those protocols.


    For more information on gPhone, visit http://gphone.sourceforge.net.


    # gRun—A GTK-Based Run Dialog


    The gRun run dialog is a simple application written for GTK1.2 that allows you
    to launch applications without the need for the Aterm window or selecting a menu.'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'gRun also stores a list of recent usage, so you may select from a drop-down
    menu to save typing time.


    Access via ''Run Program'' on root menu.


    # GtkFind—A File Finder Program


    The GtkFind program provides a great front-end to the command-line find program.
    It has lots of options and takes the guesswork out of the command line for those
    who are uninitiated.


    Access via /Applications->Tools->Find from root menu.


    # Gvu—A PostScript Viewer


    Gvu, the PostScript Viewer, is part of the Siag office suite. It is easy-to-use
    and intuitive. A PostScript (PS) file is a file that is formatted for printing
    by the ghostscript interpreter. Applications such as Firefox have the capability
    to save these files for later digital viewing instead of sending them off to the
    printer. Gvu can magnify sections of the PS document, which makes it very handy
    for difficult reading.


    Refer to this site for information on Gvu: http://siag.nu/applets/gvu.html.


    # Ted—An Easy Rich Text Processor


    Ted is an easy-to-use word processor that saves documents in Rich Text Format
    (RTF). RTF is a standardized, cross-platform markup, readable by many word processing
    programs, including Open Office, Gnumeric, and Microsoft Word. One little-known
    feature of Ted is that it can also save documents in HTML and the underlying code
    is surprisingly clean. The author of Ted (Mark de Does) was kind enough to fix
    a compatibility issue it had with Fluxbox for us.


    For more information on Ted, refer to the following: http://www.nl1gg.nl/Ted/.


    # Siag (Scheme in a Grid)—A Spreadsheet Program


    When compared to contemporary spreadsheet applications, Siag is truly a compact
    program, yet it is very robust. In addition to its native .siag format, Siag can
    also read Comma Separated Values (CSV), plain text, Lotus 1-2-3, Scheme Code,
    Open Office Calc, and some Microsoft Excel documents.'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'For extensive documentation on Siag, refer to the documentation on the Siag
    development site at http://siag.nu/online-docs/siag/siag.html. Figure 3-6 shows
    an example of the Siag application.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_80_0.png)


    FIGURE 3-6 Despite its compact size, Siag can work with many different spreadsheet
    formats.


    # Sylpheed—Lightweight and User-Friendly Email Client


    Sylpheed is a great email client. It is fast and very capable, yet very easy-to-use
    with a very clean interface. Sylpheed is compatible with both POP3 and IMAP mail
    protocols and can do SMTP authentication. Sylpheed offers multiple account capabilities
    and threaded viewing options.


    Figure 3-7 shows an example of the Sylpheed window. Refer here for Sylpheed documentation:


    http://sylpheeddoc.sourceforge.net/en/manual/manual1.html


    # VNC Viewer—A Client for the VNC Remote Desktop Protocol


    VNC stands for Virtual Network Computing. VNC is a very capable remote desktop
    application. With VNC, you can remotely manage a desktop for UNIX/Linux, Mac,
    and Windows platforms.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'Refer to the RealVNC site (www.realvnc.com) for VNC documentation:


    http://www.realvnc.com/


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_81_0.png)


    FIGURE 3-7 Sylpheed is a lightweight, but powerful, email client.


    # Rdesktop—A Remote Desktop Protocol Client


    Rdesktop is a client for the Windows Terminal Server. Rdesktop communicates via
    Remote Desktop Protocol (RDP). The original author is Matthew Chapman, who had
    to do a lot of reverse engineering and reference obscure documentation to get
    it to work.


    Refer to the Rdesktop home page for further information: www.rdesktop.org.


    # Xpdf—A PDF Viewer That Runs Under X


    Xpdf is a viewer for the Portable Document Format, or PDF. It is designed to be
    small and efficient. Refer to www.foolabs.com/xpdf for further information.


    # XMMS—The X Multimedia System


    XMMS is a media player for Linux. Anyone who has used Winamp should be at home
    with the XMMS interface. In fact, the two applications can share skins. The'
  merge: -1
