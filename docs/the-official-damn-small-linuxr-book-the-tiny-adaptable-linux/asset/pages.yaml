  merge: -1
  img_proc: true
- pgno: 107
  md: 'dialup session. When you see an IP number, the communication link is established
    and you may begin to use the Internet applications included with DSL.


    # Ethernet Configuration


    Wired and wireless Ethernet connections are supported in DSL. If you cannot automatically
    connect to a network, the following sections help you to configure an Ethernet
    connection manually.


    # Wired Options


    Because DSL boots with an automatic DHCP request, often nothing is required to
    have immediate network access. For those users who have more demanding needs,
    DSL offers the Netcardconfig program. To access this program, from the DSL Control
    Panel, select Netcardconfig; or from the system menu, select System, Net Setup,
    Netcardconfig.


    Step through the questions as they are presented. If you are connected to a device
    or LAN with an available DHCP server, you can select Yes and probably be connected
    to the Internet. If you can’t detect the DHCP server or need to configure your
    addresses manually, select No. Then you will be expected to enter a static IP
    address, netmask, broadcast address, default gateway, and DNS nameservers. If
    you don’t know what that information is, contact your Internet Service Provider
    for assistance.


    # Wireless


    Wireless network access is something that cannot be initially automatically set
    up because of the requirement of a network access point and encryption key. You
    should always boot your system with the nodhcp boot option. Having DSL try to
    connect to a DHCP server could block you from manually setting up your wireless
    connection, so nodhcp prevents that from happening.


    All DSL wireless setup attempts are automatically detected upon a normal shutdown.
    You are prompted to save your wireless setup. Each custom GUI creates a script
    of your wireless setup information. These scripts can be found in the /opt directory.


    Many older wireless cards work with the Iwconfig, Prism2 config, or Wlanconfig
    tools. For later wireless cards, however, for which open source drivers are not
    yet available, you may need to use Ndiswrapper, which lets you provide a wireless
    card’s Windows driver to get the card to work in Linux.'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'Some wireless PCMCIA cards can hang your system when you boot up on some older
    hardware. I suggest you look here for a list of wireless cards that have been
    verified to work in DSL:


    ```

    http://www.damnsmalllinux.org/wiki/index.php/Verified_Wireless_Cards

    ```


    # Native Wireless Configuration Tools


    DSL provides several simple GUI tools to aid in wireless setup with only the most
    common required fields. If you have more demanding needs, the Wlanconfig program
    prompts for almost every conceivable option.


    You may choose to select Wlanconfig from the DSL control panel or from the system
    menu by selecting System, Net Setup, Wlanconfig. However, most users need only
    the simple GUI tools shown in Figure 4-18.


    FIGURE 4-18 Configure a wireless connection using a simple graphical iwconfig
    tool.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_108_0.png)


    +   - The sid field is the name of the wireless access point. This can be left
    blank to use the closest or strongest signal. Otherwise, enter the name of the
    access point.


    +   - The wep field is the encryption key. If none is used, leave it blank. Otherwise,
    you must enter the key as colon separated pairs—for example, 12:34:56:78:FF. This
    key should be a hexadecimal representation of the encryption key entered when
    the wireless router was configured.


    Press OK when you are ready to attempt a connection. A small pop-up displays the
    results of your connection attempt, as shown in Figure 4-19.


    FIGURE 4-19 Add information to identify your wireless access point and encryption
    key.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_108_1.png)'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Other Wireless Card Using Ndiswrapper


    If you find that your wireless card is not natively supported by drivers contained
    in DSL, the catch-all wireless solution is Ndiswrapper. Ndiswrapper uses the same
    drivers that Microsoft Windows uses. The drivers may be obtained from the software
    CD that was included when you bought your wireless card. The drivers may also
    be obtained from the vendor''s support website.


    A very good source for selecting which Windows driver to use is the Ndiswrapper
    website itself:


    ```

    http://ndiswrapper.sourceforge.net/mediawiki/index.php/List

    ```


    To open the ndiswrapper setup window, select the Ndiswrapper button from the DSL
    Control Panel. The ndiswrapper setup window appears as shown in Figure 4-20.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_109_0.png)


    Using Ndiswrapper usually means having two files: an .inf file together with a
    .sys file. Often, when DSL is used on a machine that also runs Windows, you can
    simply mount the drive that contains Windows and specify the full windows path
    to the .inf file. Note that you use the forward slash and not the backward slash,
    as shown in Figure 4-20.


    +   - The sid field is the name of the wireless access point. This can be left
    blank to use the closest or strongest signal. Otherwise, enter the name of the
    access point.

    +   - The wep field is the encryption key. If none is used, leave it blank. Otherwise,
    you must enter the key as colon separated pairs—for example, 12:34:56:78:FF. This
    key should be a hexadecimal representation of the encryption key entered when
    the wireless router was configured.


    Press the OK button when you are ready to attempt a connection. A small pop-up
    displays the results of your connection attempt.'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'It is worth noting here that sometimes it is desirable to manually enter the
    Ndiswrapper commands and test the results of each step. To do so, you must open
    a Superuser terminal window. From the Aterm icon, right-click to select Aterm
    as Super User to open this terminal window. Following are the manual steps:


    ```

    ```text

    # ndiswrapper -i NET8180.INF

    # ndiswrapper -l

    # modprobe ndiswrapper

    # iwconfig

    ```

    ```


    Those are the minimal manual commands to see if the Ndiswrapper and two Windows
    drivers can access your card. If the result of the iwconfig command displays a
    wlan0, you know that you may proceed to configure the card with the GUI.


    # PRINTING USING APSFILTER


    The built-in printing system in DSL is Apsfilter. This printing subsystem was
    chosen because it was one of the smallest printing services available.


    To begin, you must first set up the printer: using the DSL control panel, select
    Printer Setup or from the main menu, select System, Printing/lpd, Configure Printer.


    The first screen to appear is the license screen. Accept the license by entering
    y and pressing Enter. You are then presented with a series of screens, one regarding
    email of the creator of the Apsfilter system and other information screens. You
    can either accept the offer of email address or you can press Enter to read the
    information screens. When you see the permission screen for /usr/share/apsfilter,
    enter y and press Enter. Because you are running from a live CD, or emulation
    thereof, these permissions have been preset for you. Next, the Add Another Printer
    or Overwrite the Existing Entries screens appear. If this is the first time to
    add a printer, enter a and press Enter.


    Figure 4-21 shows the screen where you begin the actual setup for your printer.
    Usually, only the first three steps are needed.


    # Printer Driver Selection


    For this example, I am going to set up my HP4050TN PostScript printer. The first
    step is to enter 1 and press the Enter key. The Printer Driver Selection screen
    appears, as shown in Figure 4-22.'
