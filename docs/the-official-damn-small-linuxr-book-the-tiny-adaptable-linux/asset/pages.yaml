- pgno: 46
  md: '# ON THE CD


    DSL itself only takes up about 50MB of space on your boot media. However, with
    several different versions of DSL (for booting from different media) and some
    available MyDSL software extensions, you can experience DSL in different ways.
    For those reasons, we have included a standard-size CD with this book (about 700MB)
    that we have filled with a whole lot of software you can use with DSL.


    The CD that comes with this book boots up to the latest version of Damn Small
    Linux. By default (press Enter), you will get exactly what you would were you
    to download the standard 50MB DSL image from the Internet. With our specially
    remastered CD, however, you get a whole lot more.


    +   - **Official Damn Small Linux (dsl-3.3.iso)**—This is the standard DSL that
    you would normally burn to CD and boot live.

    +   - **Official DSL for older machines (dsl-3.3-syslinux.iso)**—If you have a
    PC that requires a floppy boot image on the CD to boot up, you can use this ISO
    image. This image (contained in the `/images` directory) features the Syslinux
    boot loader, which includes a small 1.4MB boot image. To use this ISO, you need
    to burn it to a separate CD.

    +   - **Virtual DSL for Windows with QEMU (dsl-3.3-embedded.zip)**—This archive
    is unzipped on the live CD so that you can run DSL virtually within a window on
    your Windows desktop.

    +   - **Virtual DSL scripts for VMware (dsl-3.3-vmx.zip)**—Using the scripts included
    in this zip file, you can run DSL virtually from a variety of environments using
    VMware.

    +   - **Special DSL projects**—Chapters 13 through 16 describe how to create special
    software and hardware projects with Damn Small Linux. You can directly boot up
    to versions of DSL that include the software packages needed to complete those
    projects. These projects include:

    +     - **DSL Edna music server:** Manage, play, and serve your music collection
    from DSL using Edna music server software (see Chapter 13, “Making an Edna Music
    Server in DSL”).

    +     - **DSL Skype VoIP service:** Make Internet telephone calls using Skype
    IP telephony service (see Chapter 14, “Using Skype VoIP Service in DSL”).

    +     - **DSL digital picture frame:** Play slide shows of any collection of digital
    images from DSL as a standalone digital picture frame (see Chapter 15, “Running
    a Digital Picture Frame in DSL”).'
  merge: -1
  img_proc: true
- pgno: 47
  md: '—DSL web server: Include XAMPP software with DSL to create an instant web server
    to share your web content over the Internet (see Chapter 16).


    +   DSL boot images—Some older hardware that has no bootable CD drive (or no CD
    drive at all) may need a floppy boot image to be able to boot DSL. Several different
    boot images are included in the /images directory of the CD.


    +   Chapter 10 and Chapter 11 scripts—Scripts that are described in Chapter 10,
    “Adding Applications and Creating Shareable Extensions,” and Chapter 11 in this
    book are contained in the /chapter10 and /chapter11 directories, respectively,
    on the CD. The scripts will help you make your own MyDSL extensions and remaster
    your own DSL live CD.


    +   MyDSL packages—There are several extra software packages that are very popular
    with DSL users. By including some of these packages, available as software extensions
    with the MyDSL facility, on the CD, we can save you the trouble of downloading
    them over the Internet. In the /mydsl directory in the top-level directory of
    the CD, you can find packages for installing standard GNU utilities (gnu-utils
    package), ALSA sound drivers and utilities (alsa-sound package), and the OpenOffice.org
    office applications (openoffice package).


    You can use the software contained on the CD if you don’t have an Internet connection.
    As time goes by, however, you should check the Damn Small Linux website for the
    availability of later versions of the software included on the CD.


    # SUMMARY


    Damn Small Linux is the premiere business card-size Linux desktop live CD available
    today. Within its 50MB footprint, DSL contains nearly every type of application
    you would expect to find in a modern desktop operating system. Although DSL is
    designed to run from a read-only CD medium, you can add data, software extensions,
    and system settings that can be backed up separately and used again the next time
    you reboot.


    This chapter is an introduction to the features that make DSL both a useful and
    fun operating system for computer enthusiasts. It presents some of the ways in
    which you can boot, install, reuse, and enhance DSL that are described in greater
    depth in later chapters of the book. It also discusses ways in which you can learn
    more about the DSL community and contribute to its success.'
  merge: -1
