- pgno: 112
  md: '# Printer Interface Setup


    The Interface Setup screen, shown in Figure 4-23, is fairly obvious given its
    choices. In this example, I will use network printing using a JetDirect network
    card in my HP4050TN. In my case, I input 3 and press the Enter key.


    FIGURE 4-23 Choose the interface or device to which the printer is connected to
