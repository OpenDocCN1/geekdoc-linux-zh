- pgno: 141
  md: '# Running a Native Pen

    Drive Install


    There are two basic setups for a USB install: USB-ZIP and USB-HDD. Depending on
    your computer’s BIOS settings, one install may work better than the other. Unfortunately,
    there does not yet seem to be a standard for USB boot. However, it looks like
    eventually USB-HDD will become the standard. Many systems will boot one setup
    but reject another. If you have an older computer (i.e., before 2001), odds are
    that the BIOS is incapable of booting via USB at all. In addition, many systems
    are just inconsistent. For instance, some computers require that you turn off
    quick boot in the BIOS, whereas others require USB keyboard emulation to be turned
    on; other systems will only boot from the USB ports in the rear of the computer.
    There is also the problem of pen drive incompatibility. Some newer computers that
    support the USB 2.0 standard will not work with older pen drives that work with
    the USB 1.1 standard, and older computers that only support the USB 1.1 standard
    are incompatible with 2.0 USB pens. As you can see, booting from USB can be tricky!
    If you find that it is impossible for your system and hardware to support native
    USB booting, you still have the option of using a boot floppy, which we’ll talk
    about later in this chapter.


    It should be noted that in this discussion, all technical references are done
    from within the Damn Small Linux operating system. That is, we are assuming you
    are running Damn Small Linux when you are determining the device location for
    formatting or running our install scripts—not all Linux systems register devices
    in the same way.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# USB Boot Types—Background on the Two Types of USB Layouts


    This section has an overview of USP pen drive preinstallation formatting, the
    process for both types of USB installations, and some history as to why it is
    necessary to provide both types of installations. There are also some types on
    how to install DSL on a pen drive and run while using an older computer without
    a USB-compatible BIOS system.


    # USB-ZIP


    This is the format that was used with the Iomega external Zip drives. When we
    set up a USB pen drive to boot via USB-ZIP, we are emulating the layout of the
    old Iomega drives; in effect, we are fooling the BIOS into thinking it''s booting
    an old Zip drive. We do this by splitting the USB pen into two partitions and
    keeping the size of the first partition small. The geometry for the partition
    needs to have 64 heads and 32 sectors. If you do not know what that means, don''t
    worry about it—our install script does the math automatically.


    # USB-HDD


    In contrast, our USB-HDD format uses a single fat partition. This is a simpler
    setup that is more compatible with other operating systems that only recognize
    the first partition on a pen drive.


    The method you chose is dictated by what your hardware supports. If you are making
    a bootable pen drive for portable use, go for USB-HDD as its hardware compatibility
    is greater than USB-ZIP. Additionally, if your pen is doing double duty as a portable
    storage device, your Windows operating system will be able to see the full size
    of your storage device.


    # Determining the Physical Address of Your USB Drive


    When running from Damn Small Linux, most USB drives on most systems will be labeled
    as sd(something), as in sda, sdb, sdc, and so on. If you have more than one pen
    drive in your system, the first drive will be labeled sda and the second drive
    will be labeled sdb. The first partition on the first pen drive will be called
    sda1, the third partition on the second pen drive will be called sdb3, and so
    on. This will hold true 99% of the time, but to avoid the confusion, just keep
    one USB device in your computer while running the install script.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# TIP


    When preparing to install Damn Small Linux into a pen drive, boot from the CD
    with the pen already plugged in. This way, the device will be autodetected in
    the boot process and will be recognized in dmesg and /etc/fstab, as well as the
    mountapp, which relies on the data from it.


    Both the USB-ZIP and USB-HDD install scripts have the option of listing available
    USB storage devices. If you are uncertain of your pen drive''s logical location,
    invoke this option in the script for piece of mind. If you accidentally format
    the wrong drive, all the data on that drive may be lost.


    If you are going to run cfdisk ahead of time, you need to know your device before
    you run the install script. To do that, you need to look at the output from dmesg.


    # Practical Prep for a USB Install


    Before you do anything, you need to know how your system displays your USB pen
    to Damn Small Linux.


    I have done a lot of USB installs and one thing that I always do is run cfdisk
    on the device ahead of time. Sometimes, this step is not needed, but I have found
    that setting up a fresh partition table seems to make the failure rate go down
    and speed up the booting process. I''ve read that if a user messes with the indigenous
    partition of a pen drive, he may damage the device and make it unusable; however,
    I have never had this happen to me with all the pens I have formatted for the
    DSL store. Some pens'' native partitions are really mixed up to the point where
    cfdisk is not capable of reading them. When that happens, I start cfdisk with
    the flag -z, meaning start with a zero partition table. Using cfdisk, I create
    a single table that is marked as FAT16—this ensures that the pen is partitioned
    properly and that the USB install scripts can do their job.


    For further reading on cfdisk, visit:


    ```

    http://www.linux.org/docs/ldp/howto/IBM7248-HOWTO/cfdisk.html

    ```


    I would like to take a moment to talk to you about the work that went into both
    the USB-ZIP and USB-HDD scripts. Robert put a lot of work into field testing these
    scripts before they went into the Damn Small Linux ISO. Also, everything you need
    to get Damn Small Linux running from a pen drive is included in our little 50MB
    base distribution. So, there is no need to be connected to the Internet and download
    additional files. Fortunately for Damn Small Linux users, the multistep process
    has been condensed into answering a few questions.'
  merge: -1
  img_proc: true
- pgno: 144
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 145
  md: 'You should now see a terminal window with a dialog that looks a lot like that
    shown in Figure 6-2.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_145_0.png)


    FIGURE 6-2 The USB-HDD installation script opening dialog.


    Let''s run through the various parts of the dialog as it is displayed.


    +   1. Your BIOS must support USB-HDD booting.

    +   As mentioned in the beginning of this chapter, you need to determine if your
    system''s BIOS supports USB-HDD booting. Many systems do not, but more and more
    newer computers do support this method of booting.

    +   2. A single FAT partition will be made.

    +   This is the big difference between a USB-HDD and a USB-ZIP install. The partition
    table is simple for USB-HDD, with no need to set up an arbitrary partition table
    to trick the BIOS into thinking it is booting a Zip drive.

    +   3. Do not have your pendrive mounted.

    +   Please don''t! You may potentially damage your pendrive if you run this script
    while mounted.


    Next there is a warning that Damn Small Linux is not responsible for any hardware
    damage or data loss—you are proceeding fully responsible for your actions, knowing
    that if anything is damaged, the developers of DSL cannot take responsibility.
    If you are uncomfortable with being responsible for your own actions running this
    script, then just go ahead and close the window!

    Still there? Cool! Let''s keep going....'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'The very next line reads:


    ```

    Display your USB storage device information log?

    ```


    Type y and press Enter. You should see a nicely formatted readout with the pen
    drive’s physical location highlighted in green, as displayed in Figure 6-3.


    # FIGURE 6-3 The pen drive location is highlighted in green.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_146_0.png)


    You already should have a good idea of how your pen drive is seen in Damn Small
    Linux because you took the time to find the device earlier before you ran cfdisk—the
    preliminary step I recommended in the beginning of the chapter. Hopefully, this
    printout confirms your previous information.


    If all the indicators are coinciding and it looks like your pen drive is actually
