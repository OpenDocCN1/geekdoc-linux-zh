    Only three system files are copied to the target media.


    The last prompt of the Frugal Grub installation is to accommodate existing Windows
    installations. Because Frugal Grub installs into the master boot record, you must
    notify the script to add an entry for Windows. This includes all versions of Windows
    through Windows XP.


    # NOTE


    Later, in the “Poorman’s—An Easy Way to Try DSL” section, I will discuss the Poorman’s
    installation, which allows DSL to be installed within an existing Windows partition.


    ```

