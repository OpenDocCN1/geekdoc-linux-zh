    +   11. Open a Terminal window (right-click the desktop and select XShells, Root
    Access, Dark) and type the following commands to start the ALSA sound system:


    ```

    # alsa_snddevices

    # alsa_init

    ```


    The alsa_snddevices command creates the audio group and sound devices (in /dev)
    that you need for ALSA to work. The alsa_init command starts the ALSA service.
    Your ALSA sound system should now be running.


    Next, you can try to adjust your audio in DSL:


    +   1. Start audio mixer—Start DMix to adjust sound levels by right-clicking the
    desktop and selecting Apps→ Sound/MPEG/VoIP→ Dmix Sound Mixer.


    +   2. Adjust audio output—In the DMix window, select Master Volume. Then, move
    the sliders to adjust the audio levels for the right and left channels.


    +   3. Adjust audio input—In the DMix window, select the name of your input device
    (it may be Microphone, Phone Input, or Line In). Click the Rec button (so the
    button turns on) to have the microphone be selected as your recording device.
    Move the sliders up to adjust the audio input levels.


    +   4. Play sound—You can check your Internet connection at the same time you
    test sound output by starting XMMS to play a streaming radio station. Right-click
    the desktop and select Apps→ Sound/MPEG/VoIP→ XMMS→ Xmms News Feeds→ Xmms “KCPW
    NPR NEWS.” Streaming audio should play in your headphones.


    At this point, you can close the DMix and XMMS windows. If your sound system is
    still not working, refer to the Troubleshooting Skype section near the end of
