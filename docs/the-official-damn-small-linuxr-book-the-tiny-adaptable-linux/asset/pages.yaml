- pgno: 52
  md: '# SOFTWARE REQUIREMENTS–DSL VERSIONS


    Damn Small Linux is available in several different versions. The version you use
    depends on the environment in which you are running DSL. The four versions DSL
    offers include:


    +   - **A SYSLINUX version**—Used for older PCs that require the boot medium to
    be no larger than a floppy image (even if that image is on a CD). For more information
    on the SYSLINUX boot loader, refer to the SYSLINUX FAQ (http://syslinux.zytor.com/faq.php).


    +   - **An ISOLINUX version**—Used most often for booting live CDs, because it
    needs no special floppy emulation disk. For more information on the ISOLINUX boot
    loader, refer to the ISOLINUX FAQ (http://syslinux.zytor.com/iso.php).


    +   - **A Qemu Virtual Machine version**—Sets up Qemu to run DSL virtually within
    a running Linux system.


    +   - **A VMware Virtual Machine version**—Sets up VMware to run DSL virtually
    within a running Windows system.


    The first two versions concern booting from the CD, which is the topic of this
    chapter. The other two versions are discussed in Chapter 7, “Running DSL Embedded
    in Windows.” Why are there two versions for CD? Because DSL targets older and
    smaller hardware, many such systems could only boot from a CD if there existed
    an actual emulated boot floppy. This emulated boot floppy was restricted to the
    size of a real floppy. Later machines were made without such a restriction.


    So, the first rule is this: If your machine cannot begin the boot process, or
    if your machine is an older variety, use the SYSLINUX version.


    The SYSLINUX version of DSL emulates a single floppy at boot time. There are fewer
    drivers in the SYSLINUX version because they must all fit within a single floppy-sized
    file. The reason Knoppix and the other derivatives went with ISOLINUX is that
    there is no single floppy size limitation. The ISOLINUX version has many more
    drivers to support booting from newer computers.


    # GETTING DAMN SMALL LINUX


    There are several versions of Damn Small Linux included on the CD that comes with
    this book. You can read about what those versions are and how to use them by referring
    to Appendix A, “On the CD.” However, if you don’t have the CD handy or if a later
    version of DSL is available, you might consider downloading a copy of DSL to make
    your own bootable CD.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Downloading Damn Small Linux


    If you are new to the concept of live CDs, it is possible that you don’t know
    how to download an ISO and make a bootable CDROM. The first step is to find a
    local DSL download mirror. You can always check the latest list of available download
    sites by checking the Damn Small Linux website download section at:


    ```

    http://www.damnsmalllinux.org/download.html

    ```


    Using the Ibiblio site as an example, navigate to the site’s current directory:


    ```

    ftp://ibiblio.org/pub/Linux/distributions/damnsmalllinux/current

    ```


    Based on the previous discussion, select which version you want to download. The
    ISOLINUX version of DSL, which is what you want in most cases, is named ds1-??.?iso,
    where the ?? is replaced by the DSL version number.


    There are many ways to create a bootable CD and many operating systems to perform
    this task. You want to use a CD writing program with a burn image or write to
    disk option.


    Many Linux systems have the k3b utility and cdrecord command to burn CDs. For
    Windows users, Nero and Roxio are popular commercial programs. Also available
    for Windows are freeware CD Burner XP Pro (www.cdburnerxp.se) and Infra Recorder
    (http://infrarecorder.sourceforge.net) applications.


    # Getting to the Boot Prompt


    Try booting up the DSL live CD. If neither the SYSLINUX nor ISOLINUX versions
    get you to the boot screen, here are a few things you can try:


    +   - Make sure that your CD burn didn’t fail. If you downloaded and burned your
    own CD, it is best to burn at a very low rate. I suggest slowing down the burn
    process to a speed of 4. Yes, even if you have a new 52X burner.

    +   - Some computers have difficulty booting from a CD-RW CD. It is best to use
    a CD-R CD.

    +   - If you have a different live CD (such as KNOPPIX), try booting from that
    live CD to see if your problem is specific to DSL.

    +   - Your computer’s BIOS may not be set to boot from CD. Immediately after the
    boot process starts, go to your computer’s BIOS settings (press F2, Del, or some
    other key, as instructed, to enter your BIOS). Check that the boot order includes
    booting from CD and make sure that the CD will boot before the hard disk in your
    boot order.'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'If your computer does not boot from CD, you can try creating a boot floppy.
    Download the DSL standard boot floppy image, bootfloppy.img. You might want to
    check for a local download mirror to reduce your download time. Check the Damn
    Small Linux website download section: www.damnsmalllinux.org/download.html.


    Next, locate the file to download. For example,


    ```

    ftp://ibiblio.org/pub/Linux/distributions/damnsmalllinux/current/

    bootfloppy.img

    ```


    Write this image to a known good floppy disk. Don''t use old floppies because
    they will likely cause grief when read errors occur. Use typical tools to create
    the boot floppy. Usually this means rawwrite for Windows or dd for Unix/Linux
    type systems.


    For example, if your Unix/Linux system''s first floppy device was located at /dev/fd0,
    with bootfloppy.img located in your current directory, you could use the following
    dd command to write that image to an inserted floppy:


    ```

    # dd if=bootfloppy.img of=/dev/fd0 bs=16k

    ```


    Depending on the version of rawwrite you are using, the process of writing the
    bootfloppy.img file to a floppy from a DOS prompt (with the boot image locate
    at the root of C: and rawwrite in the C:\windows\command directory) should be
    similar to the following:


    ```

    C:\> cd \windows\command

    C:\windows\command> rawwrite

    Enter disk image source file name: C:\bootfloppy.img

    Enter target diskette drive: A:

    Please insert a formatted diskette into drive

    A: and press -Enter- : <Enter>

    ```


    The rawwrite program for Windows can be found at this site:


    ```

    http://www.chrysocome.net/rawwrite

    ```


    After you create the floppy disk, be sure to change your computer''s BIOS so that
    the floppy is the first device to boot from. Place the newly created floppy into
    the drive and turn on or reboot your system. If you have used a good floppy and
    had no read errors, you are presented with the DSL boot screen.


    Hopefully, you have arrived at the DSL boot screen (see Figure 2-2). If you arrived
    here because you need the boot floppy or needed to download and create the SYSLINUX
    version, just press Enter at the DSL boot prompt.


    After you can see the DSL boot screen, there are many options you can enter at
    the boot prompt to steer the direction of the boot process. The following sections
    describe the DSL boot process and how you can modify it.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '![](img/af53325d7f38f1cdafca9f44568e4ab8_55_0.png)


    FIGURE 2-2

    The DSL boot screen lets you add options to the boot process.


    # UNDERSTANDING BOOT STAGES OF DSL


    There are three stages to boot DSL. The first stage is to get to the boot prompt.
    The boot prompt allows entry of additional boot options. The second stage is the
    autoconfiguration and environment initialization of DSL. This stage processes
    the boot time options and sets up the runtime environment of DSL. The third stage
    is sometimes required (and sometimes requested) to perform additional setup not
    available via autoconfiguration—for example, serial, two-button, or USB mouse,
    non-US keyboards, or nondefault 1024x768 screen resolution.


    If your computer can boot your DSL CD, you should see the boot screen similar
    to the one shown in Figure 2-2.


    Let''s dig deeper into the boot process of DSL.


    > NOTE

    > This chapter covers the booting process only as it relates to the normal task
    of booting from a live CD. A more advanced and detailed discussion is presented
    in Chapter 11, "Setting Up a Full Remastering Environment."


    # The First Boot Stage: Choosing Boot Options


    The boot prompt lets you customize the DSL startup process. For example, you can
    specify at the boot to load entirely into RAM, where your backup files are located,'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'or even where additional applications are stored. To reach the boot prompt,
    you use the CD, the floppy disk, or a USB pen drive. The value of understanding
    this stage is so you can understand the boot options that can be used to change
    how DSL boots.


    > NOTE

    > USB pen drive specifics are discussed in Chapter 6, “Running a Native Pen Drive
    Install.”


    # Getting to the Boot Prompt


    To get to the boot prompt, follow these steps:


    +   1. Start with the computer either on or off:

    +      - Starting with the computer on—If the computer is already on, insert the
    DSL CD. If you happen to be running Windows and the CD drive is set to autorun
    mode, information about DSL appears. Restart the computer so that it boots from
    the DSL CD.

    +      - Starting with the computer off—If the computer is off, turn it on and
    immediately insert the DSL CD. On some computers, pressing the Pause/Break key
    immediately after turning power on pauses the startup, giving you more time to
    insert the CD. Press the Pause/Break key again to resume startup. Some computers
    have a key sequence to enter into a boot menu; see your computer’s documentation.
    You might also want to press the key sequence to enter BIOS setup to give you
    time to insert the DSL CD.


    +   2. The boot screen appears—Most newer computers automatically check for a
    bootable CD in the first CD drive. The DSL boot prompt should then appear, with
    the DSL boot splash screen (see Figure 2-2). If your computer can’t display the
    black and white DSL logo, you get a blue background with only the three text lines
    and a boot prompt.


    +   3. Booting DSL—At the boot prompt, press Enter to boot DSL accepting all the
    defaults. If you do nothing for 60 seconds, DSL boots automatically.


    Did you get the DSL desktop screen as shown in Figure 2-1? If not, then the next
    step is to try some boot options that are described in the following sections.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Help at the Boot Prompt


    When the DSL boot screen is displayed, you should be familiar with the boot prompt
    in the lower-left corner. This is where you can either press Enter, wait a few
    seconds, or Press F2 or F3 for the help screens.


    The help screen is a summary of the boot prompt options. Pressing F2 or any other
    key cancels the timer so DSL does not automatically boot; this way, you have plenty
    of time to peruse all of the displayed options.


    Figure 2-3 shows the screen that appears by pressing F2 at the boot prompt.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_57_0.png)


    FIGURE 2-3 Press F2 to view boot options for language, video, restoring settings,
    and other features.


    Figure 2-4 shows the screen that appears by pressing F3 at the boot prompt.


    As you can see from the boot options screen, there are a lot of options that you
    can try. However, most of these options are there to overcome rare special problems
    or offer enhanced ways of using DSL (such as running totally from RAM). The fact
    is that for most users, DSL will just boot up without additional options, so they
    can stop reading after the opening paragraph of this chapter.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '![](img/af53325d7f38f1cdafca9f44568e4ab8_58_0.png)


    FIGURE 2-4 Press F3 to view boot options for setting passwords, choosing a desktop,
    or setting other boot time features.


    # Trying Different Boot Options


    Let''s roll up our sleeves, try some common boot options, and discuss some common
    solutions. At the boot prompt, let''s try a few basic options.


    +   Video boot options—By default, DSL boots into a high resolution, vga=791 mode.
    This might be too high a resolution for your computer''s video. Using the boot
    option vga=normal might help.


    ```

    boot: dsl vga=normal

    ```


    Many older laptop/notebook computers require framebuffer video instead of the
    Xvesa. So, you might want to try:


    ```

    boot: fb800x600

    ```


    Note that I did not use the word dsl as the first option. Depending on your notebook
    computer, it might be fb1024x786. If you get an error about no fbdev, using framebuffer
    likely will not help.


    Notice the vga resolution table on the F3 screen (see Figure 2-4). Any one of
    these values can be selected with the vga= option.


    As I noted, it can be a combination of options that is required. Try this common
    selection of options:


    ```

    boot: dsl vga=normal noapic noacpi pn bios=off acpi=off noapm

    ```'
  merge: -1
  img_proc: true
- pgno: 59
  md: "Success? Great. Now, you should try again, only this time backing off each\
    \ of the preceding options, one at a time, until you have the exact set of options\
    \ required to boot. We call this fine-tuning the options for your particular machine.\
    \ On the other hand, you may still be facing issues and not yet able to boot into\
    \ DSL.\n\n+   - **failsafe boot option**—A powerful preset combination of options\
    \ is called failsafe. Try this:\n+   \n+     `boot: failsafe`\n\nIf failsafe works\
    \ for you, how can you fine-tune your options? You can always see your boot options\
    \ from the command line or in X Windows. From a command line or a shell window,\
    \ type **showbootoptions**; or from the DSL desktop, select DSLpanel, System Stats,\
    \ Boot Tab. Then, you may try booting by eliminating each of the displayed boot\
    \ options of failsafe. You want to do this, because some of these options prevent\
    \ sound and other features that you will later want to use and enjoy.\n\n+   -\
    \ **lowram boot option**—For machines with 64MB of RAM or less, you might want\
    \ to consider another preset combination of options. lowram is used like failsafe\
    \ and is optimized for low RAM systems. Again, you may want to use showbootcodes\
    \ or the System Stats Boot tab to see the preset options and then begin the fine-tuning\
    \ for your specific needs.\n+   \n+   - **toram boot option**—For machines that\
    \ are rich in RAM, you might want to try the toram boot option. Adding this option\
    \ to your list of other options loads DSL entirely into RAM. This provides a superfast\
    \ system, as no further access to the CD is required. You should not attempt this\
    \ until you first establish your machine’s required boot options and have at least\
    \ 128MB RAM.\n\n# The Second Boot Stage: Autoconfiguration\n\nDSL’s second stage\
    \ is autoconfiguration and environment initialization. This stage begins as soon\
    \ as the Enter key is pressed at the first stage boot prompt. All of our entered\
    \ boot options are processed to determine which parts of autoconfiguration are\
    \ attempted. Normally, this process runs without intervention. Figure 2-5 shows\
    \ a typical autoconfiguration in process.\n\nUpon successful completion, this\
    \ stage typically ends by initializing the X Window System. The X Window System\
    \ is used to host the graphical DSL desktop. Of course, the use of the boot time\
    \ option of 2 (dsl 2) prevents X from starting and terminates the boot process\
    \ at a shell prompt for the root user."
  merge: -1
  img_proc: true
- pgno: 60
  md: '![](img/af53325d7f38f1cdafca9f44568e4ab8_60_0.png)


    # FIGURE 2-5 DSL second stage booting.


    Hopefully, you have achieved success. Some may have the DSL desktop displayed
    and ready for exploration. Some are happy to arrive at the system prompt of runlevel
    2. But for others, the third stage of booting is required.


    > NOTE

    > As previously stated, the third stage of booting DSL may be desired for those
    that have a serial, two-button, or USB mouse, a foreign language keyboard, and
    so on. You may use the boot time option of xsetup to force DSL to enter the third
    stage of booting.


    For those who still have not been able to go further, you might have very esoteric
    hardware, perhaps too new or too old to be supported. However, help and hope are
    still available with the power of the Internet and the Damn Small Linux forums
    (see www.damnsmalllinux.org/cgi-bin/forums/ikonboard.cgi).


    Many users have passed through the forums and the collective knowledge is immense.
    Try posting a request for help providing as much detail about your system as possible.
    Who knows? Maybe someone else has the same system as you and has a readily available
    answer. And remember that no question is too dumb to ask. We all had to start
    somewhere.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# The Third Boot Stage: Setting Up X


    This stage is sometimes required. It can be the result of specifying a video boot
    option. It can also be called for when using the xsetup boot option. But normally,
    users never see the third stage booting of DSL.


    The first screen (see Figure 2-6) allows selection of the type of X server to
    use. Typically, if you have selected an fb800×600 or similar framebuffer boot
    option, the choice is clear.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_61_0.png)


    **FIGURE 2-6**  The first DSL X setup screen.


    Even though this screen is displayed, you still have the option to bail out and
    use the DSL defaults. To do so, just press Tab to Cancel and press Enter. If OK
    is selected, the following series of additional setup screens are presented. Figure
    2-7 prompts if a USB mouse will be used.


    Figure 2-8 is for the serial mouse and non-wheel ps2 mouse selection. The PS/2
    port is the round, green port that’s on the back of most PCs. Serial ports are
    rectangular and are typically labeled as COM1, COM2, and so on.'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'FIGURE 2-7  The DSL X setup mouse selection.


    FIGURE 2-8  DSL alternate mouse options.


    Figure 2-9 is critical for those users that have a two-button mouse. By pressing
    both buttons at the same time, you emulate the “third” button. Many applications
    use or require a three-button mouse.


    The screen resolution screen in Figure 2-10 appears because Xvesa was selected
    back on the initial X setup screen (refer to Figure 2-6).'
  merge: -1
  img_proc: true
- pgno: 63
  md: '![](img/af53325d7f38f1cdafca9f44568e4ab8_63_0.png)


    FIGURE 2-9  Select two or three mouse buttons.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_63_1.png)


    FIGURE 2-10  DSL screen resolution selection.


    Color depth selection, as shown in Figure 2-11, is also an Xvesa-based selection.
    The higher number of bits represents more available colors but also might cause
    the desktop to perform more slowly. If you chose Xfbdev as your X server, this
    screen does not appear.


    The final X setup screen presents a keyboard selection (see Figure 2-12).'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'FIGURE 2-11 DSL screen color depth selection.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_64_0.png)


    FIGURE 2-12 DSL keyboard language selection.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_64_1.png)


    # NOTE


    Not all programs in DSL support all languages. The programs selected for DSL,
    as described in Chapter 3, “Using DSL Applications,” were based on small size
    and functionality and not international language support.'
