- pgno: 29
  md: '# Overview of Damn Small Linux


    The Damn Small Linux mantra is *small is beautiful*.


    Weighing in at about 50MB, Damn Small Linux (DSL) is a fully functional, mini-live
    CD desktop operating system. Despite its size, DSL can do just about everything
    you would expect from a modern desktop system, such as browse the web, send and
    receive email, write documents, manage files, play music, work with spread sheets,
    and manipulate images.


    Many operating systems offering similar software features require a mountain of
    expensive computer hardware to run well and are burdened with slow, bloated applications.
    Damn Small Linux takes a different tack.


    Unlike what you get with other computer systems, applications packaged with DSL
    are chosen for their size, speed, and efficient features. Even on low-powered
    hardware, applications in DSL are startlingly fast and surprisingly powerful.
    Despite its size, DSL runs faster and more efficiently than many desktop operating
    systems for the most important things you need a desktop operating system to do.


    The book you are holding in your hand is *The Official Damn Small Linux Book*.
    We say official because the authors of this book include the two key developers
    of DSL: John Andrews, the creator of Damn Small Linux, and Robert Shingledecker,
    the lead developer for many of the technical innovations in DSL.


    Although this book will step you through the components you can use in DSL, it
    will also take you much further. You will learn how to install and run DSL from
    different devices, save your data across reboots, and add applications to DSL
    to meet your needs. Later, the book will walk you through how to build projects
    with DSL, such as a music server, Internet telephone service, and portable web
    server.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# MEASURING DAMN SMALL LINUX SUCCESS


    Despite its small size, Damn Small Linux has consistently ranked among the most
    popular Linux distributions. According to rankings from various websites that
    monitor Linux sites, DSL has consistently been among the most active. According
    to Google, there are nearly 1,000,000 references to Damn Small Linux on the web.
    Yahoo indicates the existence of about 1,480,000 inbound links to the Damn Small
    Linux home page.


    At Distrowatch (www.distrowatch.com) for the past three years, DSL has consistently
    ranked in the top ten Linux distributions for page hits, often ranking among well-known
    Linux systems such as Debian, Slackware, KNOPPIX, and Gentoo. According to Alexa
    (www.alexa.com), which monitors website popularity, in early 2007, the DSL website
    (www.damnsmalllinux.org) was around 33,350 in popularity on the web. That number
    made it more popular than home websites for Ubuntu, SuSE, Slackware, KNOPPIX,
    Mepis, Morphix, and other Linux distributions.


    As for media coverage, dozens of articles and reviews have been written about
    Damn Small Linux. In May, 2004, DSL was highlighted on TechTV''s The Screen Savers
    show. A DSL CD has been included with magazines such as Linux Format, Linux User
    & Developer, Sys Admin, Linux Journal, PC Magazine, PC World, Computer Power User
    (CPU), and Linux Pro.


    Although Damn Small Linux was not the first Linux live CD (in fact, it was originally
    based on the KNOPPIX live CD), there are many firsts to its credit. DSL was the
    first Linux live CD distribution to do the following:


    +   - Offer backup and restore capabilities.

    +   - Use download scripts to add software while it was running (in ramdisk).

    +   - Employ extendable software modules that could be used from live CD or disk.

    +   - Integrate USB install scripts.

    +   - Run virtually on Windows desktops using a special embedded version of DSL
    that includes Qemu virtualization software.

    +   - Offer low-RAM extensions designed to run on live CDs or USB drives.


    DSL also included many firsts specifically associated with desktop-oriented live
    CDs. It was the first desktop-oriented live CD to fit on a bootable business card,
    offering the smallest footprint of any desktop operating system. It also was the
    first to use the Tiny X Kdrive server as the desktop''s X display server. To implement
    many standard Linux utilities, DSL was the first to use the BusyBox space-saving
    utility.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# UNDERSTANDING WHAT DAMN SMALL LINUX DOES BEST


    When you boot up Damn Small Linux, the first thing you see is a boot screen. In
    most cases, you can press Enter and after a few moments, a desktop system appears.
    With a few clicks, you could be browsing the web, editing documents, playing music,
    or doing dozens of other activities. Figure 1-1 shows an example of a busy DSL
    desktop.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_31_0.png)


    FIGURE 1-1 Damn Small Linux offers a sleek and efficient desktop interface.


    The DSL desktop in Figure 1-1 shows some of the basic features of the DSL desktop,
    along with a few applications. You can launch applications (by a single left mouse
    click) from the icons shown in the upper-left corner of the screen. In the upper-right
    corner, view data about system resources (CPU, processes, file system, etc.).
    The docked.lua tool (lower-right corner) lets you adjust audio and mount disk'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'partitions. The bottom panel displays the current date/time, minimized applications,
    and a tool for managing workspaces. Use the tool in the lower left to move applications
    among workspaces.


    The applications shown running in Figure 1-1 include the Firefox web browser,
    XMMS music player, XPaint image editor, and Beaver text editor. In the upper-right
    corner is the excellent torsmo system monitor, for watching all your system resources
    (processor, RAM, swap, disk, and other resource usage). These and other applications
    that are available natively in DSL are described in detail in Chapter 3, “Using
    DSL Applications.”


    One administrative tool displayed in Figure 1-1 is the MyDSL Extension tool. You
    can use that tool to download and install applications that are prepackaged to
    run in DSL (see Chapter 5, “Extending Applications with MyDSL”).


    Although the applications shown in the DSL desktop in Figure 1-1 are packaged
    with the basic 50MB bootable image DSL, the value of Damn Small Linux doesn’t
    end there. If DSL doesn’t do exactly what you want it to do (and where you want
    to do it), the project helps you improve on what you can do with DSL in the following
    ways:


    +   It’s expandable—Using the MyDSL feature and a connection to the Internet,
    tons of extra applications can be downloaded and installed on your running DSL
    system with just a couple of mouse clicks. Because DSL has its roots in other
    popular Linux distributions (in particular, Debian and KNOPPIX), software created
    for those distributions can often also just be dropped in and run in DSL. See
    Appendix B, “MyDSL Extensions.”


    +   It’s portable—Although the standard DSL is made to run on a medium as small
    as a 50MB bootable business card, it can be easily made to run from your hard
    disk, standard CD or DVD, USB pen drive, or other fixed and removable media. It
    can even run embedded from installed Linux or Microsoft Windows systems.

    +   Many people have put DSL on a USB pen drive, with other applications and data
    (documents, music, images, and presentations). So instead of carrying a whole
    laptop with you, you can carry everything you need on a USB flashdrive or pen
    drive that’s about the size of a stick of gum.


    Keeping the basic DSL system small, fast, and efficient makes it both a neat tool
    in itself and a great foundation to build on. Here is a list of some of the best
    reasons for using DSL:


    +   Old machines get new life—DSL can run on computers with as little as 16MB
    of RAM and a 486DX processor. DSL developers offer versions of DSL'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'that boot on older machines that need a smaller boot image (using Syslinux).
    As a result, the PC gathering dust in the closet can find new life as a simple
    desktop system, or by adding some extra software, a firewall, web server, or music
    player PC.


    **Fits in small places—**Damn Small Linux fits on a bootable business card CD.
    So carrying around DSL can take up as little space as a credit card in your wallet.
    DSL’s small size also means that, in places where there is limited storage space
    (such as an old hard disk or handheld device), you can devote what space you have
    to holding your extra applications and personal files.


    **Runs fast!—**Because the DSL operating system and the applications that come
    with it are small, lightweight, and tuned for efficiency, they run fast, even
    on meager hardware. If you have at least 128MB of RAM, you can also use DSL’s
    toram feature, which runs the entire DSL operating system from memory. Using toram,
    applications launch almost instantaneously and run faster than you would believe.


    **Runs efficiently—**By focusing on important desktop features, instead of every
    possible desktop feature, the DSL desktop makes it easy to get to the features
    you need. All your desktop applications and system tools are available with a
    right-click of your mouse from anywhere on the desktop. Desktop tools let you
    easily view your system processing, change workspaces, mount storage media, and
    adjust your audio volume.


    **Travels with you—**By their nature, live CD operating systems are made to be
    portable. Because of its excellent hardware support, DSL runs on most common PC
    hardware. So, if you are going somewhere that already has a PC you can use, you
    may not need to lug your laptop with you. You can simply carry DSL and any extra
    software or data you need in your pocket.


    **Versatility—**Using the tools that come with DSL itself, you can configure DSL
    to run in many different ways from different storage devices. Besides the default
    (a DSL boot image burned to a live CD), easy install procedures let you install
    and run DSL from a USB flash drive, hard disk, or other storage media.


    There are also different ways in which you can configure to save and use DSL,
    your applications, and your data. For example, you can keep your data on a flash
    drive, whereas DSL itself is run from a live CD or hard disk. When a new version
    of DSL comes out, you simply boot that new version and combine it with your data.
    No messy upgrade or reinstall procedures are needed.


    **Security—**Running your operating system from a read-only media can reduce the
    ability of an intruder to take over (and effectively own) your computer. If you
    suspect your computer’s security has been compromised, you'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'can simply do a clean reboot of DSL. The operating system itself returns to
    its original state, so you only need to check the data you have saved for potential
    problems.


    Because DSL was created primarily as a desktop system, there are also no network
    services running by default that an intruder could exploit. If you want to turn
    on or add new network services, you can add firewall software from MyDSL (see
    Chapter 16, “Setting Up an XAMPP Web Server in DSL”) and configure a professional-quality
    firewall built on the standard Linux iptables facility.


    +   Network and server features—DSL automatically detects and configures most
    wired Ethernet cards, and includes tools for configuring many wireless cards.
    With an available DHCP server on the wire, DSL can often just boot up to an active
    Internet connection. Applications for using the Internet, web browsing, email,
    file transfer, instant messaging, and others are included in the basic DSL distribution.


    DSL also includes efficient versions of some network servers that you can enable,
    if you choose. From the DSL menu, select System, Daemon and choose a service to
    start. Start ssh to allow secure remote login (ssh), file copy (scp), or FTP service
    (sftp) to your machine. Or choose nfs-common to be able to share directories over
    the network. Choose Monkey web server to start a simple web server (HTTP) or FTPd
    to open your DSL system as an FTP server. Because it is Linux, there are also
    tons of other services you can add to DSL from open source projects.


    +   Build projects—By starting with a minimal operating system, it’s easy to make
    a system that is configured to do a specialized task. For example, if you want
    a system tuned just to be a firewall, music player, telephony device, or some
    other specialized device, you can add only the software you need to an otherwise
    efficient system. The result can be a system that does just what you need, so
    all your additional space can be devoted to holding your data. Part IV of this
    book, “Making Damn Small Linux Projects,” contains several interesting projects
    you can build, starting with DSL.


    The uses and advantages of DSL just described are the ones we have found. After
    you start using DSL, you will probably find many uses on your own.


    # GETTING THE MOST OUT OF DAMN SMALL LINUX


    Within a short time, you should be able to figure out how to boot from the DSL
    live CD and use the DSL desktop. However, this book is here to teach you how to
    adapt'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'DSL to do exactly what you want it to do. To that end, chapters in this book
    guide you through techniques for tuning DSL to suit your needs and adapting DSL
    to suit your computer equipment.


    The following are some of the major topics covered in this book.


    # Booting DSL


    With a PC and copy of Damn Small Linux (like the one on this book’s CD), most
    people can reboot and be up and running DSL with no instruction. If some other
    piece of hardware isn’t working, pressing F2 shows you boot options that can help
    overcome most simple problems.


    When you boot DSL, there are other boot-options you can pass to DSL that help
    direct the boot process. Some of those options can make DSL work better for your
    particular hardware (such as video cards that can’t be properly detected). Others
    let you run DSL in special ways (such as running DSL completely from RAM). Still
    others let you identify where bundles of data are located that you can pull into
    your DSL system (such as your backed-up desktop settings or saved applications).


    Boot options you might need to get DSL working initially are included in Chapter
    2, “Booting DSL.” Some options for identifying where your personal settings are
    backed up to and restored from are covered in Chapter 4, “Configuring and Saving
    DSL Settings.” Options for running DSL in different hardware environments are
    covered in Chapter 8, “Installing DSL in Alternate Ways.”


    # Customizing the Desktop


    Fluxbox is the window manager that is used by default with Damn Small Linux. Despite
    its compact size, there are many ways to tune Fluxbox to look and behave the way
    you like. A window manager defines how menus, mouse activities, keyboard navigation,
    backgrounds, and other features related to the look and feel of your graphical
    interface operate.


    From the Fluxbox desktop, most DSL activities can be directed from a single desktop
    menu (right-click the desktop to see the DSL menu). Select Desktop, Fluxbox Configuration
    to see a listing of available desktop settings that you can change. Figure 1-2
    shows examples of these menus.


    Besides changing the look and feel of your desktop, you can use various desktop
    utilities to manage your workspaces, mount and unmount file systems, and manage
    tasks. Using various desktop tools and applications is described in Chapter 3.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# FIGURE 1-2 Customize your desktop settings from the DSL menu.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_36_0.png)


    # Adding Applications with MyDSL


    Although not everyone needs every available piece of software to run with their
    live CD, nearly everyone needs at least a few software packages beyond those chosen
    for DSL. Using the MyDSL facility that was designed for DSL, you can add prepackaged
    software to your live system, save those packages to restore later, and include
    them (or not) the next time you reboot DSL.


    Chapter 5 includes descriptions of the MyDSL facility. Descriptions of MyDSL center
    on the MyDSL Extension tool, shown in Figure 1-3.


    # FIGURE 1-3 Customize your desktop settings from the DSL menu.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_36_1.png)


    # Saving and Restoring Settings and Data


    For any live CD to be useful over time, you need to be able to save your data
    files, your system settings, and any additional applications you use regularly,
    across reboots. DSL offers a lot of flexibility in how you save your personal
    files across reboots.


    The DSL backup and restore features let you choose exactly what files and directories
    of data you want to back up and where you want that data to be stored. If you
    save that data in a specific way, DSL automatically finds and restores that data'
