- pgno: 329
  md: '# WARNING


    When you take apart a laptop and remount it in a frame, besides clearly voiding
    any warranty, you are also risking injury and damage. LCD displays run at high
    voltages that can provide quite a jolt if you are shocked. Even in their original
    cases, laptop batteries have been known to catch on fire. In a picture frame,
    it is not possible to get the same cooling system to work. So be warned that while
    many people have created digital picture frames like the one described here, you
    assume responsibility yourself for the safety of the unit you put together.


    # Before Dismantling the Laptop


    Check the laptop’s BIOS before dismantling it. Make sure that the screen doesn’t
    go blank after a few minutes to save power. Also, disable hardware in the BIOS
    that you don’t need. For example, if you want to disconnect the floppy drive,
    you can also turn that off in the BIOS.


    Also, while the laptop is still running, check the viewing area and mark the corners
    of that area with a bit of tape. You want to use those markings to choose where
    to cut the opening in the matting, so that only the viewing area shows through.


    # Tips for Dismantling and Mounting the Laptop


    Laptops fit a lot of components in a small space. As you try to dismantle your
    laptop to get the component you want into a frame, you have to be very careful
    to not break delicate connections or lose tiny screws and springs that are needed.
    Here are some tips for taking apart your laptop in a way that does the least damage:


    +   - Get tools ready—Set up an antistatic mat to put the laptop on. Make it large
    enough that you can place parts outside of the laptop case and be on the mat if
    they still need to be attached. Get a range of small screwdrivers and wire cutters
    to work with.


    +   - Manufacturer’s instructions—Even for old laptops, there are usually instructions
    from the manufacturers available on the web for dismantling laptops to replace
    critical components. Check the support areas for the company that made your laptop
    before you begin taking it apart.


    +   - Be gentle—Don’t force components when you go to remove them. If something
    seems stuck, look for screws you might have missed. Components are often screwed
    in from multiple sides and screws can be hidden under little'
  merge: -1
  img_proc: true
- pgno: 330
  md: 'plastic pieces. Connecting cables are often fragile. Very gently disconnect
    those cables when necessary. The LCD ribbon cables tend to be particularly prone
    to tearing.


    +   - **Reboot occasionally**—As you try to extract the components from the case,
    you may find yourself removing and reattaching cables. Try rebooting the laptop
    every once in a while to make sure that it will still boot. If it doesn’t, at
    least you have fewer things to check.

    +   - **Remove components**—If you are booting from hard disk, you can probably
    remove the CD drive and floppy drive. The trackpad can go too, along with various
    mounting pieces. Before you remove the keyboard, do a final reboot to make sure
    everything is okay. If there is a port for an external keyboard, try to keep that
    accessible. You may find that you need to connect a keyboard at some point you
    can’t access the laptop from its network interface.

    +   - **Attach the screen to the mating**—With thick cardboard matting, some people
    glue the LCD directly to that matting. For a thin wooden board, some people clip
    the LCD to the frame, using clips that are similar to those used to hold up mirrors.
    Some use Styrofoam to hold the screen snugly in place. A piece of Plexiglas that
    is cut to fit the frame is another possibility.

    +   - **Mount the motherboard**—The motherboard is usually attached next. Usually
    the motherboard is raised off of the screen using small blocks of wood or using
    risers or spacers. The hard drive is probably the next component to be attached.
    I’ve heard suggestions that attaching the hard drive with rubber grommets can
    reduce vibration.

    +   - **Make connectors accessible**—Attach the components in such a way that
    cords you need to connect to the laptop can be accessed. For example, you might
    need to access a USB port for an Ethernet adapter or USB flash drive. I recommend
    you get a USB small extender so you have more choice of where you connect any
    USB devices.

    +   - **Open access to the frame**—Whether you are adding an extended frame to
    a regular picture frame or using a shadowbox type of frame, you need to cut access
    points open to the frame. At the very least, you need an opening for your power
    cord. With wired Ethernet network interfaces, you need an Ethernet cable to be
    able to get in. Consider cutting a hole in the top of the frame to allow heat
    to escape.


    You may want to drill openings to be able to expose ports and switches outside
    of the frame. A USB extender might be useful to expose, if you want to be able
    to attach a USB flash drive or other type of USB device. Likewise, an on/off switch
    might be nicer than just unplugging the unit. (It may take some extra soldering
    to extend those kinds of switches.)'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'When you are finished mounting all the components, check that everything is
    securely attached. Boot up the laptop to make sure that it is still working and
    try to log in to it over the network.


    # EXPANDING YOUR DIGITAL MEDIA FRAME


    There are lots of great ideas around for expanding what a digital media frame
    can do. Here are a few:


    +   - **Remote control**—It would be nice to work with the digital media frame
    from a remote control. The Linux Infra-red Remote Control (LIRC) project is a
    popular way to use a remote control with multimedia applications. There are inexpensive
    receivers described at the LIRC site (http://lirc.org/receivers.html). By coupling
    that technology with a menu system, you could select different content or players,
    without needing a keyboard.


    +   - **Adding applets**—You could stick small applications to the desktop while
    playing slideshows or other content. For example, you might want a constant clock,
    weather report, or stock ticker to play along with the multimedia content.


    +   - **Timers**—To keep from running the digital media frame day and night, it
    is a good idea to add timers that shut down the media frame at a certain time
    every night. For example, you could use the cron facility to run the `sudo shutdown
    -h now` command every night at midnight.


    # SUMMARY


    A digital media frame is a fun way to reuse an old laptop. Using the descriptions
    in this chapter, you can evaluate an old laptop, add software needed to play different
    multimedia content, and adapt the laptop to fit in a picture frame.


    The digital media frame described is made to run without any intervention. The
    laptop components inside the frame are configured to just boot it up to a slideshow.
    By adapting the procedure for making a digital image slideshow, you could have
    the device play video, music, or other content as well.'
  merge: -1
  img_proc: true
