- pgno: 91
  md: '# Configuring and Saving

    DSL Settings


    One of the biggest challenges in creating Damn Small Linux (DSL) was to make an
    integrated desktop. The usual integrated desktop environments like KDE or GNOME
    are just too large. Even Xfce and others were not the smallest available. John
    Andrews originally chose the window manager of Fluxbox and an icon program called
    XtDesk. Later, I created GUI configuration programs to give a feel for some integration.
    Whether you like a Windows-style double-click or single-click icons, it is now
    easy to set up.


    DSL’s small size is also the result of John’s carefully selected applications.
    But many of these applications have many different user interfaces. John and I
    continue to improve the GUI interface programs. The purpose is to provide a common,
    consistent user interface.


    DSL also continues to support CLI or command-line interface programs. Therefore,
    an extra challenge in creating these new GUI programs was to continue to support
    the CLI versions. Not every conceivable configuration will be covered here. Many
    programs’ setups can be found at their respective home sites. Of course, all the
    custom applications and GUI interfaces created by John and me will be thoroughly
    covered.


    This chapter will cover most of the basic aspects of configuring DSL. Topics covered
    will be the backup and restore, desktop, connecting to the Net, printing, and
    web backup. Let’s begin with the backup and restore procedure. No use in configuring
    anything if it can’t be contained in the backup and restored upon the next system
    boot.'
  merge: -1
  img_proc: true
- pgno: 92
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 93
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 94
  md: 'The default contents of the .filetool.1st file cause the entire home/ds1 directory
    to be backed up. However, you can choose to selectively back up only certain files.


    > NOTE

    > It is very important to note that the entry /home/ds1/.filetool.1st must not
    be removed from the .filetool.1st as this provides for persistence for the .filetool.1st.


    The default .filetool.1st file in DSL 3.3 looks like this:


    +   opt/ppp

    +   opt/bootlocal.sh

    +   opt/powerdown.sh

    +   opt/.ds1rc

    +   opt/.myds1_dir

    +   home/ds1/


    # Excluding Files and Directories from the Backup


    Exclude files from the backup with the file /home/ds1/.xfiletool.1st. Adding entries
    to this file excludes them from the backup. Cache and other files are in the default
    .xfiletool.1st:


    ```

    /home/ds1/.xfiletool.1st

    ```


    This file lists exceptions to files in .filetool.1st, which means if you have
    a directory listed in .filetool.1st, you can use .xfiletool.1st to prevent certain
    files or subdirectories within that directory from being added to your backup.


    This file works by using pattern matching rather than full file pathnames. In
    this way, you can exclude multiple files with the same name that may be found
    in separate directories. If you want to exclude a specific file, you can still
    use the full path to the file. The default file in DSL 3.3 looks like this:


    +   Cache

    +   XUL.mfas1

    +   home/ds1/mnt

    +   home/ds1/.wmrc

    +   home/ds1/opera/cache4

    +   home/ds1/opera/images

    +   home/ds1/fluxbox/myds1.menu


    Notice that Cache is listed without a path, which means all files named Cache
    within directories listed in .filetool.1st are excluded from the backup. You can'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'also use wildcards to extend the exclusion. For example, if it lists Cache*,
    all files whose names begin with Cache are excluded.


    # Restoring Your Setting


    Your backup of selected files and directories is automatically searched for and
    restored during the boot process. No user interaction is required. DSL searches
    your storage media for your backup archive based on the order of detected drives
    that are added to the /etc/fstab file. It checks each disk partition until it
    finds a backup.tar.gz file in the root directory of one of those devices.


    You can override this feature by specifying the device that holds your backup
    file:


    ```

    boot: dsl restore=hda2

    ```


    Specifying the restore device actually speeds up the boot process as attached
    and available physical devices do not have to be searched. However, not specifying
    the restore boot option means a hands-free automatic boot.


    > NOTE

    > If you decide at some point that you don’t want to use your backed-up settings,
    add the norestore option to the DSL boot command. If you want to permanently remove
    the settings, delete the backup.tar.gz file from the root directory of the device
    on which it is stored.


    The restore option, together with a .xinitrc file, provides the user with much
    more control of his preferred environment. See the “Configuring the Desktop” section
    for further information on using the .xinitrc file and other features to choose
    which settings and applications start up when the desktop is launched.


    Now that we have covered backup and restore, let’s continue with the desktop configuration
    options.


    # CONFIGURING THE DESKTOP


    With your backup procedure in place, configuring your desktop to your preferences
    is a good next step. Start by choosing a desktop interface, then set up icons,
    backgrounds, and wallpaper in a way that pleases you.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Selecting Your Desktop


    Fluxbox is the default window manager used by Damn Small Linux. DSL also lets
    you switch to the Joe’s Window Manager (JWM), if you prefer. JWM offers a desktop
    interface that is somewhat similar to the Microsoft Windows desktop interface.
    The version of JWM in DSL is a heavily modified and stripped-down version of the
    original JWM.


    You can change window managers by displaying the desktop menu (right-clicking
    the desktop) and selecting WindowManager, Switch to JWM. You can switch back to
    Fluxbox from the desktop menu by selecting Exit, Switch to Fluxbox. (Before switching
    window managers, keep in mind that this action will restart the X Window system
    and close any applications you have open.)


    You can add applications to open when your desktop launches by editing configuration
    files in the dsl home directory (`/home/ds1`). For example, by editing the `.xinitrc`,
    you can start up your favorite X programs. You can start non-X programs by editing
    the `.bash_profile` and then adding it to your `filetool.1st`.


    If you need to load additional modules and system-specific required files, you
    can do so by editing the `/opt/bootlocal.sh` file and then adding it to your `filetool.1st`.


    # Managing Icons


    Most distributions have the luxury of using prebuilt integrated desktop systems,
    or even icon management systems, such as Rox (http://rox.sourceforge.net). In
    keeping with DSL’s “smaller is better” theme, XtDesk icon program was used. The
    challenge was that, although XtDesk icons were very functional, there were no
    GUI configuration tools. I created a small Lua/Fltk GUI together with making a
    few modifications to the XtDesk code to create DSL’s own unique icon management
    tool.


    First, let’s discuss the standard XtDesk editing capabilities. When you right-click
    an icon, a small pop-up appears. Sometimes, the pop-up contains alternate or related
    programs to start and the bottom section of the pop-up is labeled Properties.
    Clicking Properties brings up a screen similar to the one shown in Figure 4-3.


    You can move the box cursor and edit any of the icon properties. The MenuCommand1
    option is the alternate right-click way to launch the program. The Status option
    is custom to DSL and should be used for base application. The additional applications
    called MyDSL extensions should not use the Status field. Usually, this screen
    is used to manually change X and Y coordinates, change the caption, and so on.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# FIGURE 4-3 Edit icon properties to change how an application behaves.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_97_0.png)


    For more icon management, DSL has its own Icon Tool. From the main menu, select
    Desktop, then select Icontool (in JWM, select Setup, Desktop, Icontool); you are
    presented with the DSL Icon tool shown in Figure 4-4.


    # FIGURE 4-4 Choose to display icons (or not) and single- or double-click.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_97_1.png)


    The first panel of the DSL Icon Tool is obvious. Here is where you choose to display
    icons on the desktop or not. Click the button of your choice and then the OK button.
    If you choose to have icons, the second set of buttons is enabled and allows you
    to choose single- or double-click to enable the associated action of the icon.


    # Indicating the Icon Layout


    When the Layout tab is selected (see Figure 4-5), you have the choice to use screen
    X and Y coordinates or automatic layout. If you want to use X and Y coordinates,
    it'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'makes sense that you also select Double Click from the Click tab. Using Double
    Click means the first click selects the icon; therefore, you can drag and drop
    the icon into the position that you want.


    # FIGURE 4-5 From the Layout tab, indicate how icons are arranged on the screen.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_98_0.png)


    The default settings for DSL are Single Click and Auto Arrange Icons layout. This
    works well, especially when used with the MyDSL system. Using the MyDSL system
    and automatic layout makes for a nice system. Otherwise, you find yourself constantly
    adjusting icons.


    The automatic layout provides much control of your desktop icons, from top margin,
    number of columns, to vertical and horizontal spread. Of course, as with any configuration
    change, the backup restore makes your changes persistent across reboots.


    # Adding New Desktop Icons


    The Add panel of the Icon tool allows for easy addition of a desktop icon (see
    Figure 4-6). DSL comes with some built-in generic icons. All icons for the XtDesk
    icon system are stored in /home/dsl/.xtdesktop. There, you can add more icons
    from your own collection.


    To begin using the Add tab, select an icon from the list. Then, simply fill out
    the form. Give your icon a label. Specify X and Y coordinates only if you are
    using the manual layout method. Finally, enter the full path to your application''s
    executable.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '![](img/af53325d7f38f1cdafca9f44568e4ab8_99_0.png)


    FIGURE 4-6 From the Add tab, you can add more icons to your DSL desktop.


    # Removing Icons


    The final panel of the Icon tool allows for the removal of the standard base DSL’s
    applications (see Figure 4-7).


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_99_1.png)


    FIGURE 4-7 Indicate which icons you would like removed from the DSL desktop.


    Sometimes, you find a built-in application that you never use. Or, maybe you like
    a tidy desktop. By selecting from the preceding list, you may remove that application’s
    desktop icon.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# NOTE


    You are not actually deleting the application when you select to remove it from
    the desktop. DSL as a live CD or emulation thereof means that the base system
    is a compressed read-only file. This procedure is really only hiding the chosen
    icon. In fact, if you look into the directory of icons /home/dsl/.xdesktop, you
    see the .hide filename extension being used. To actually remove a base application
    requires a full remastering. This advanced topic will be discussed in Chapter
    11, “Setting Up a Full Remastering Environment.”


    # Selecting Backgrounds and Wallpapers


    With DSL having two default window managers, changing background images or even
    selecting a color means having a custom program. You can access this program from
    the desktop icon control panel by using the Backgrounds button; or from the main
    menu, select Desktop and then click Wallpapers to see the DSL Background Selector
    tool (see Figure 4-8).


    FIGURE 4-8 Change the desktop background with the Wallpaper/Background tool.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_100_0.png)


    The Wallpaper/Background tool allows the selection of a new background image.
    You can select from the list presented or add your own collection of favorites.
    The image can be scaled to fit your screen resolution or centered as an emblem.
    By clicking OK, you can see the selected item on the screen. At this point, it
    is not installed. This allows you to try out different images to see what you
    like. After you have settled on a choice, click the Install button.


    By pressing the Help button, you can see where these images are stored. The suggested
    method to add more images is to store them in /home/dsl/.fluxbox/backgrounds.'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'The DSL Background Selector tool also allows for color selection. Pressing
    the Color button presents you with a color chooser, like the one shown in Figure
    4-9.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_101_0.png)


    # FIGURE 4-9 Choose colors to use for your DSL background.


    Here, you can select from just about any color possible, or any shade thereof,
    or even type in known RGB codes.


    # NOTE


    > As shown in Figure 4-9, the selected blue color is the default background used
    by the JWM window manager in DSL. If you have selected a background image and
    want to restore the original background color, use these settings.


    Any choice you make with the DSL Background Selector tool persists with the standard
    backup restore procedures.


    # Setting Date and Time


    To set your system''s date and time, from the DSL Control Panel, select Date/Time.
    From the main desktop menu, select System and then Set Date Time. If you happen
    to be using the JWM desktop, you can click the time displayed in the lower-right
    corner of the task bar. After you have selected the custom date application Figure
    4-10 will be displayed.


    Using the arrows, adjust the displayed values to the correct date and time. Press
    the OK button. A small pop-up window is displayed asking you to restart the window
    manager so that the displayed time can be updated on the desktop. This step is
    only needed if you are using the standard Fluxbox desktop. To restart Fluxbox,
    from the main system menu, select Window Manager and then Restart. This date application
    also writes to the system hardware clock so that the correct date and time should
    persist, even after reboots.'
  merge: -1
  img_proc: true
