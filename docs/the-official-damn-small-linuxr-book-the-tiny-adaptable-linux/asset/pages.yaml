- pgno: 279
  md: '# Making an Edna Music Server in DSL


    Damn Small Linux is a very good base for creating an Edna Music Server. It is
    compact, yet it has everything needed to run a basic server and the tools in place
    to do remote streaming, while accessing files locally and over a network. This
    means that one may have access to one’s music shared over a local network even
    if the music files are stored elsewhere on the Internet. With DSL plus Edna, you
    have the power to get your music where you want without having to worry about
    storing local copies, which is a problem that occurs in many office situations.
    Let’s explore how this is done.


    # ABOUT THE EDNA MUSIC SERVER


    The Edna Music Server was written in the Python scripting language by Greg Stein.
    He calls it a quick hack, which is not a term that does it justice. Edna is an
    HTTP server that allows users to stream audio files, including MP3, Ogg Vorbis
    (.ogg), and other audio files. It is compatible with XMMS (included in DSL) and
    other popular MP3 players such as Winamp, Sonique, and FreeAmp.


    Edna is constructed so that you can browse a music selection remotely. It uses
    a URL construct that allows you to link to a specific song. Edna also automatically
    makes a playlist for directory structures that can be played in sequence or a
    random shuffle.


    Edna also dynamically builds pages according to the underlying directory structure
    of your music collection. Thus, categorizing is very simple and logical. You can
    organize your music by using the names of your directories and subdirectories
    as the categories and subcategories. Similarly, Edna servers offer .m3u playlists'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'of recursive directory structures that media players use to stream the MP3s.
    Personally, I like this method of sorting because it is a way of having classification
    without the need for a database. This makes the code simple and reduces the overhead
    of the music server. This clever practice helps keep the server down to just a
    thousand lines of code.


    Edna is licensed under the GPL. In addition, it is an interpretive script written
    in Python, which is a scripting language that has a strong fan base because of
    its neatness and code rigidity.


    # INSTALLING THE EDNA SERVER ON DSL


    Taking advantage of your extensions is the simplest way to install the Edna Music
    Server on the Damn Small Linux OS. You need a Python extension to get a working
    Python interpreter. We have a couple of builds available in the repository; both
    python.uci and python2.3.tar.gz are based on Python 2.3.4. If you are running
    from a live CD, a USB installation, or a frugal installation, you will benefit
    from using the UCI extension. If you are running from a conventional hard drive
    installation, use the tar.gz build. You also need to grab the Edna extension (edna.ds1),
    which is found in the Net section of the repository. In our example, you will
    install Edna as if it were being run from a frugal or a USB installation.


    First, you need to install the Python scripting language. You are going to install
    the python.uci extension. Open the MyDSL panel and click UCI. Then, click the
    python.uci extension—it is a 12MB download. No configuration of Python is necessary.


    Next, you need to download the Edna extension. It is found under Net. Edna.ds1
    is a smaller download (less than 1MB) so the download time should be much faster
    than the Python extension. After DSL has loaded, the extension Edna is ready to
    run.


    The Edna files can be found at:


    ```

    /usr/bin/ednastart

    /usr/share/edna/MP3Info.py

    /usr/share/edna/MP3Info.pyc

    /usr/share/edna/daemon

    /usr/share/edna/daemon/edna

    /usr/share/edna/daemon/ednad

    /usr/share/edna/edna.conf

    /usr/share/edna/edna.py

    /usr/share/edna/ezT.py

    /usr/share/edna/ezT.pyc

    /usr/share/edna/ntsvc/

    ```'
  merge: -1
  img_proc: true
- pgno: 281
  md: '```

    /usr/share/edna/ntsvc/TCPServerService.py

    /usr/share/edna/ntsvc/ednaNTSvc.py

    /usr/share/edna/ntsvc/regsetup.py

    /usr/share/edna/templates/

    /usr/share/edna/templates/default.ezt

    /usr/share/edna/templates/default_complex.ezt

    /usr/share/edna/templates/stats.ezt

    /usr/share/edna/templates/style-xml.ezt

    /usr/share/edna/www/

