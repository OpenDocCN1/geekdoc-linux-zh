- pgno: 209
  md: '# Adding Applications and Creating Shareable Extensions


    Damn Small Linux can be easily extended to run many more applications than provided
    by the base 50MB system using the MyDSL extension system, as we saw in Chapter
    5, “Extending Applications with MyDSL.” In this chapter, we will discuss several
    ways to make your own MyDSL extensions.


    There are many ways to approach the creation of an extension—whether it starts
    by modifying an existing package, be it a tarball, a Debian package, or compiling
    from sources. We will learn how to make all four types of MyDSL extensions: from
    the .tar.gz to .dsl, .uci, and .unc.


    # OVERVIEW


    All UNIX-based systems add applications to the file system as a collection of
    files and directories. Typically, the method used is TAR (tape archive) or CPIO
    (copy input output). Later package management systems would combine installation
    scripts specific to their distributions. Some would add a database of installed
    applications and dependencies required.


    Different package management systems typically have different software package
    formats, use different commands for managing their packages, and change the package
    name extensions to something unique for their distribution. For example, .deb
    was used for Debian packages and .rpm was used for Red Hat Linux packages. Tools
    such as dpkg and apt-get are commonly used to install and manage Debian packages,
    while rpm and yum commands are most often used with packaging derived from Red
    Hat Linux (such as Fedora, Red Hat Enterprise Linux, and others).'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'DSL’s extensions are not much different than the very simplified description
    that I have just given. But why have them? Why not stay with the Debian package
    management system? Debian is already available for DSL.


    As was discussed in Chapter 5, the MyDSL extensions offered much of the same benefits
    of the traditional hard drive installation to a person using the live CD-ROM or
    the compressed DSL file system image installed to hard disk. Besides, running
    directly from the DSL live CD-ROM means that very little of the file system is
    write-enabled. The live CD-ROM and compressed type installs are running (reading
    from) a compressed read-only file system.


    Despite the fact that loading a .dsl type extension would cause much of the file
    system to become write-enabled, this file system is still on the RAM disk. If
    we were to rely on Debian, or other package management systems, laying down all
    of the files, directories, and a database for package management would quickly
    exceed the capacity of the ramdisk.


    Additionally, trying to maintain a database of installed applications with their
    dependencies in RAM disk does not make any sense. Neither does it make any sense
    to use a persistent storage device to maintain this database of applications that
    are loaded into the RAM disk.


    # Creating MyDSL Extensions


    I created the MyDSL extensions as a way of adding applications that makes sense
    for the way Damn Small Linux works. I called them extensions, and not packages,
    because the MyDSL facility does not offer any application removal. Because the
    extensions are loaded or mounted on ramdisk, simply reboot. The application extension
    is gone.


    But wait; does that mean that you must download the extension every time you want
    to use it? No. DSL, like the other distributions, offers an extension loader,
    based on the extension name’s extension. The extension loader can properly load
    and install copies of extensions stored on various persistent media.


    Therefore, a MyDSL extension is a collection of related files, executables, and
    libraries that need to be added to DSL in order to provide the application. Just
    as almost every package in UNIX-like systems are variations of the tar archive,
    so too are MyDSL .tar.gz and .dsl extensions. The .uci and .unc extensions, on
    the other hand, are compressed images of a collection of related directories and
    files needed to provide the application.


    Because the primary focus of DSL is to be a nomadic live CD-ROM or to run as a
    compressed installed image means that the only write-enabled area is on the'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'ramdisk. That being the case, every bit of space saved means more room for
    other applications. Therefore, no matter what source the packaged application
    starts with, certain areas are immediately targets to be cut. Also, realize that
    .uci and .unc style extensions are far more efficient when it comes to using RAM.


    > NOTE

    > Because MyDSL extensions are designed for the live CD-ROM and compressed installations,
    and no package database is maintained, users of traditional hard installations
    should not use MyDSL extensions. They should use the Debian package management
    system. Using MyDSL extensions on a traditional hard installation is like force
    loading a foreign package, in that it is not readily available for removal.


    > NOTE

    > The reverse is not true. You can use Debian packaging tools to load an application
    onto the ramdisk of DSL. Descriptions of how to add Debian packaging tools to
    DSL are contained in the “UNC Extension Type” section later in this chapter.


    # Understanding MyDSL Extensions


    Let’s begin by defining the four extension types of MyDSL:


    +   - **tar.gz**: A tar archive collection of files that loads entirely into the
    base write-enabled areas defined on the ramdisk—that primarily being /opt, /tmp,
    and /home/dsl. With such limited write-enabled areas, most .tar.gz extensions
    are self-contained.

    +   - **uci**: A compressed image of a self-contained application that mounts
    under /opt. Usually contains a user.tar.gz, a subextension that defines a menu,
    and an icon for the application. Most .tar.gz extensions can be converted into
    this more RAM-efficient method.

    +   - **dsl**: A tar archive collection of files that loads into ramdisk anchored
    from /. The first invocation of this extension type causes most of the file system
    to become write-enabled.

    +   - **unc**: A compressed image of files and directories anchored from /. The
    system mounts this extension type under /opt and then adds each base directory
    to the system via unionfs file systems. Base directories that by default are already
    write-enabled are not added to the union space. This extension type usually contains
    a user.tar.gz, a subextension that defines a menu, and an icon for this application.'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'Notice that the .tar.gz and the .uci extension-types are both installed under
    /opt. In fact, it is usually easy to convert from .tar.gz to .uci. Similarly,
    both .dsl and .unc extensions are installed under /. It is also easy to convert
    from .dsl to .unc. Later, I will discuss the DSL tools to help in building and
    converting extensions.


    In the rest of this chapter, I will demonstrate how to create the four MyDSL extension
    types. I will use the common application of Zile. Zile is an Emacs-like command-line
    editor.


    # COMMON ELEMENTS TO ALL MYDSL EXTENSIONS


    Let''s begin by discussing the common elements to all DSL extensions: the menu
    and icon. Being a live CD-ROM, and therefore not inherently a multiuser system,
    means the extensions are built for the default user ds1. Because you use a minimal
    window manager (as provided with Fluxbox) and a customized icon manager (called
    xtdesk), you need to provide your own menu and icon for each extension you create.
    Menus and icons are optional, but most users expect at least a menu item to be
    included.


    > NOTE

    > If the application is console based and commonly requires command-line options,
    a menu item is not very useful. The menu item is not required.


    > NOTE

    > Loading a Debian application using the standard Debian procedures does not provide
    a menu item or icon. Much of the Debian menu and icon supporting infrastructure
    was cut to reduce the size of DSL.


    All other aspects of an extension—the actual files, directories, libraries, and
    paths—are common to any Linux distribution given the existing kernel, modules,
    and libraries.


    # The Menu Element


    The menu for a MyDSL extension is actually a fragment of the Fluxbox standard.
    This menu fragment is a simple text file and is created under the directory /tmp/myds1.menu.
    It must be the same name as the base extension name and must'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'be unique. For example, for the zile.ds1 extension, the menu item would be
    /tmp/myds1.menu/zile. To ensure uniqueness, use version numbers as part of the
    name for both the extension name and the matching menu item name. No special characters
    or spaces are allowed in either. Typically, you would use DSLs beaver to create
    this file:


    ```

    $ beaver /tmp/myds1.menu/zile

    ```


    Using the standard structure of the Fluxbox menu files, here are the contents
    of the Zile extension menu item:


    ```

    [exec] (Zile) {aterm -e /usr/bin/zile}

    ```


    > NOTE

    > Because Zile is a console application, it needs a hosting terminal window. DSL
    uses Aterm for such terminal windows. Therefore, notice that the preceding command
    path includes aterm -e as a prefix to the normal command path. If Zile was an
    X-based application, such prefix would not be necessary.


    # The Icon Element


    The icon element consists of two files. The first file must be in an image format
    readable by DSLs icon manager, a modified version of xtdesk. Image formats png,
    gif, jpg, and xpm are supported. The icon''s image file is located in the /home/ds1/.xdesktop
    directory.


    > NOTE

    > DSL offers several generic icons available for your extensions. These include
    binary.png, gear.png, and shellscript.png. To use one of these generics, just
    copy them using your extension''s name as the basename. See Chapter 4, "Configuring
    and Saving DSL Settings," for details.


    The second required file is the lnk and it is also located in /home/ds1/.xdesktop
    directory. Typically, you would use your favorite text editor, such as DSLs beaver,
    to create this file:


    ```

    $ beaver /home/ds1/.xdesktop/zile.lnk

    ```'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'The .lnk file is a simple text file with the .lnk extension, such as zile.lnk.
    The format of the file is as follows:


    ```

    table Icon

    Type: Program

    Caption: zile

    Command: aterm -e /usr/bin/zile

    Icon: /home/dsl/.xdesktop/zile.jpg

    X: 420

    Y: 384

    end

    ```


    The caption entry is what the icon manager will display under the icon image.
    By convention, all MyDSL extensions should use lowercase letters for this Caption
    field entry. DSLs base application uses uppercase letters. With this convention,
    all base applications will consistently display before any add-on MyDSL extensions
    when icon auto-layout is used. Auto-layout is the default for DSL.


    Also notice that because Zile is a console-based application, the Command entry
    also has the prefix aterm -e.


    The X and Y coordinates can be any number within the minimal screen resolution
    that DSL supports (640×480). Usually, these coordinates are ignored, as icon auto-layout
    is the default with DSL. The Icon tool and icon layout were discussed in Chapter
    4.


    > NOTE

    > DSL base application icons use an additional Status: anchor field. MyDSL extensions
    should never use anchor status.


    # CREATING DSL AND UNC EXTENSIONS


    Because DSL is based on Debian Woody, it is not very difficult to create extensions
    from the Woody repository. Because the Debian Woody repository is huge, let''s
    start by taking a close look at creating a zile.dsl extension from the Debian
    Woody repository.


    # The DSL Extension Type


    DSL extensions are loaded on the root file system on the ramdisk. This extension
    type, although easy to create, consumes a lot of RAM. It is also capable of overwriting
    core system files and libraries, as well as possibly changing permissions.'
  merge: -1
  img_proc: true
