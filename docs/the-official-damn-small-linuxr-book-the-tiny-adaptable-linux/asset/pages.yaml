- pgno: 132
  md: '# FIGURE S-15

    Web extension selection screen.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_132_0.png)


    3. Click the info link in the Info column to see the extension’s info page, as
    described in the automated process. This step is critical. You should always read
    the info file. Use the back arrow to return to the available extensions.


    4. Right-click the extension name link in the Application column (third column
    from the right), then select the Save Link As item in the browser’s submenu.


    # NOTE


    We do not recommend downloading MyDSL extensions to your home directory. MyDSL
    extensions are large and static. The fact that DSL is used primarily as a live
    CD, or emulation thereof, implies that a backup/restore is required for saving
    personal settings. Having large static—that is, non-changing—items in your backup
    only slow down your system. Or worse, they cause your backup to fail as it may
    become too large for the chosen backup device. It is best to have a persistent
    store for collection of MyDSL extensions.


    So far, this is all fairly standard for downloading files via a browser. However,
    there are pitfalls to be aware of. Don’t forget to read those info files. Many
    times an extension requires additional extensions or may have special instructions.
    Many questions arise from failure to perform the extra step to read the extensions’
    info file.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '5. Right-click the md5sum link corresponding to your selection. After it has
    downloaded both the extension and the corresponding md5.txt to the same directory,
    you must manually verify that you indeed have a valid download. To do this, use
    the command


    ```

    $ md5sum -c extension_name.ext.md5.txt

    ```


    The extension_name.ext is replaced by the name of the extension you downloaded.
    You should see OK as the result. If not, you must redownload until the extension
    can be validated by its checksums.


    All of these extra and manual steps can be avoided by using our automated GUI
    download system.


    # SAVING YOUR EXTENSIONS


    Because DSL was created as a nomadic guest operating system, no drives or devices
    are automatically mounted. In fact, the default user dsl does not have administrator
    privileges to have write access to physical devices. The default for using the
    MyDSL system is to download the extensions to /tmp, which resides on the RAM disk
    (/ramdisk).


    After downloading and trying the extension, you most likely want to keep it. Recall
    that MyDSL extensions were built with the live CD user in mind. Therefore, upon
    a reboot or shutdown, the extensions are gone.


    Having a persistent store for your favorite extensions means you must mount a
    drive and copy the extensions to that location. There are many ways to accomplish
    this task:


    +   File manager—Using one of the file managers to save files is discussed in
    Chapter 3, "Using DSL Applications." For this task, you have to select the root
    version of the appropriate file manager.


    +   Save during shutdown—I did provide a sort of safety net upon shutdown. If
    you have any extensions still residing on the RAM disk-based /tmp directory, a
    dialog prompts you to save them. If you select OK, the system file manager emelfm
    opens with root privileges to allow you to save your extensions.


    Remember that you can use the mounting tool in the lower-right corner of the DSL
    desktop to mount the partition from your hard disk or pen drive where you want
    to install the extension.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# Boot Time Automatic Extension Loading


    Because you save your extensions in their packaged form to a persistent store,
    you must specify how they are to be loaded upon your next boot.


    MyDSL extensions install automatically during the boot process, either by placing
    them in a location which is searched by default or by placing them in a directory
    of your choice and using the boot time option myds1=location, where location can
    be the Linux device name. For example, myds1=hda1 or myds1=sda1 represents the
    first partition on your first IDE hard disk or SCSI hard disk (or pen drive),
    respectively. The location can even include a full path to the directory (such
    as myds1=hda1/myds1).


    First, let’s discuss the default locations for DSL. By using a default, you do
    not need a boot time option and therefore can have a hands-free boot up.


    +   On the boot disc—The first default location is the top level of your DSL installation.
    This top level, whether it be a mkmyDSL CD (discussed in Chapter 11) or an on
    emulation type install (discussed in Chapter 8, “Installing DSL in Alternate Ways”),
    is to place your extensions where the /KNOPPIX and /boot directories are located.


    +   On attached storage devices—The second default location is in a directory
    named myds1 in the top level of each available attached device.


    Using either of these two default specifications means you do not need to use
    a boot option. The system scans each available drive device looking for a myds1
    directory.


    > NOTE

    > Specifying the device name can have faster boot times. You don’t get the hands-free
    boot, but it also means that the system does not have to scan drives looking for
    a myds1 directory.


    In DSL version 1.2, I introduced the capability to specify a directory of your
    choice for mydsl extensions. This can be useful if you have multiple sets of applications
    and want to choose which set to load for any given session.


    For example, you can put your extensions in a directory called /mnt/hda2/games
    and use the boot option myds1=hda2/games. You can even have multiple setups. Have
    another collection of extensions in a directory called /mnt/hda2/office. Then,
    at boot time, decide to play games or work. This type of flexibility helps save
    resources on low RAM machines. Remember, everything we'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'do with DSL we keep in mind the older, smaller machines. We want everyone to
    enjoy DSL.


    If you have multiple extension repositories, you can only indicate one at boot
    time (indicating more than one will cause only the last one entered at the boot
    prompt to be loaded). After DSL boots, you can add extensions from other directories
    using the Load Local option from the MyDSL tool.


    Another design goal was to make an *optional* menu of rarely used extensions.
    You can create a directory called optional in a subdirectory of the mydsl directory.
    Extensions that are stored under this directory are not automatically loaded,
    but instead are listed in a separate menu section in the MyDSL desktop menu under
    the category Install Optional Extensions. This gives you quick access to installing
    these extensions at any time during your session.


    # OPTIONAL COMMAND-LINE EXTENSION ACCESS


    Besides offering nice and simple GUI tools or the usual web access, I also was
    sure to allow the use of command-line tools. These tools can be used in your own
    custom scripts to further automate access to the MyDSL repositories. These tools
    could also be used to set up and install in a command-line-only environment. You
    may choose to run DSL without the X windows system. Of course, you must be careful
    to read the extension’s info file to see that it can run without X.


    These tools also allow the user who is comfortable with the CLI to quickly access
    the repositories. Let’s begin by exploring the command-line tools that make up
    the MyDSL system.


    # Remote Access via the Command Line


    The first such tool is the mydsl-wget command. This is a tool that uses the wget
    command to download a specific myDSL extension from your favorite DSL mirror.


    ```

    Usage: mydsl-wget full-extension-name repository

    ```


    Full-extension-name is the filename of the MyDSL extension and its extension type—for
    example, xmahjongg.uci. The repository corresponds to the repositories that I
    have been discussing. Listings of these repositories are displayed in Figure 5-2
    from the Extension tool and in the links as shown in Figure 5-14. If you want
    to save the file to a specific existing and writeable local directory, you should
    specify the directory as part of filename, as in the following example:


    ```

    $ mydsl-wget /mnt/hda2/mydsl/xmahjongg.uci uci

    ```'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'Otherwise, the file is downloaded to the current directory. Recall the danger
    of storing extensions in your home directory.


    # Local Access with the Command Line


    The second tool is the `mydsl-load` command. Running `mydsl-load xmahjongg.uci`
    loads the named extension (in this example, `xmahjongg.uci`). You may also use
    a full path name to manually load extensions this way. This command is rarely
    used except in conjunction with the above `mydsl-wget`. It could be used in a
    scripted way, but with all the boot time load options, it is usually not needed.


    # SETUP AND USAGE ERRORS


    As I stated early on, the community of DSL users creates the collection of MyDSL
    extensions. The extensions are not an official part of DSL. Only the infrastructure
    to support for MyDSL is official. Having said that, the community of users is
    also responsible for the updates and corrections of any problems associated with
    the extensions.


    Sometimes, your system may be impacted when using an extension. If you have just
    downloaded the extension, a reboot will eliminate it. If the extension is already
    in a persistent store and part of your automatic loading, you need to remove it.


    There are situations when the infrastructure does not seem to be working correctly.
    Typically, I have found the following to be common situations:


    +   - **Nothing happens or a blank screen**—Check that you have a working Internet
    connection. Also check that you can access the chosen download mirror.


    +   - **Please mount media containing optional dir and try again**—This message
    usually occurs when running DSL in `toram` mode. When running in `toram` mode,
    the media is unmounted for removal. If there was an optional directory on such
    media, the submenu for their installation expects the media to be mounted for
    access to the stored extensions. This message may also appear when manually downloaded
    extensions are corrupt, or when system memory may not be sufficient to support
    all the loaded extensions.


    +   - **Non DSL User error message**—This appears when extensions are trying to
    be loaded by anyone except the default DSL user. As I have said many times, the
    extensions are designed for live CD and therefore the single default DSL user.
    The exception to this is the command-line-only installation as previously discussed.'
  merge: -1
  img_proc: true
- pgno: 137
