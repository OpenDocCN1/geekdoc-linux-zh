- pgno: 153
  md: '# What to Do When Your Computer’s BIOS Does Not Support USB Booting


    What if you want to use your pen on a computer that does not support USB booting?
    You have two options:


    +   - Boot from a floppy with our specially created bootfloppy-usb.img.

    +   - Boot from a CD with a special boot parameter that tells Syslinux to access
    the system image at the device location where the pen resides.


    # Creating a Boot Floppy for the USB Pen Drive


    The first thing you need to do is download the usb boot floppy image. You can
    find the image at any of the download sites. One place to find it is at:


    ```

    ftp://ibiblio.org/pub/Linux/distributions/damnsmall/current/

    bootfloppy-usb.img

    ```


    If you are running Damn Small Linux (or virtually any other Linux distribution),
    you can download the latest USB boot floppy image by opening up a term window
    and typing the following:


    ```

    wget ftp://ibiblio.org/pub/Linux/distributions/damnsmall/current/

    bootfloppy-usb.img

    ```


    After using wget to download the USB boot floppy image, you can format the floppy
    disk by issuing this command into the term window:


    ```

    dd if=bootfloppy-usb.img of=/dev/fd0

    ```


    Armed with your newly bootable floppy drive, you can boot your USB pen drive even
    if the computer you are using has a BIOS that does not support USB booting.


    # Using a LiveCD to Boot a Pen Drive


    The 50MB hockey ring CDs are smaller and travel better than floppy disks. It may
    be easier for many people to use a bootable USB pen drive and then use a mini
    CD as an alternative boot media in place of a floppy drive.


    You can mimic much of the behavior of USB booting with a boot CD and a pen drive
    when you are using a computer without the capability to boot from a USB device
    natively. We will review a few options you can use at the boot prompt to take
    advantage of your pen drive.


    To use your MyDSL extensions from your pen drive, type the following:


    ```

    dsl mydsl=sda1

    ```'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'To use your backup/restore files from your pen drive, type the following:


    ```

    dsl restore=sda1

    ```


    To access the image on your pen drive, type the following:


    ```

    dsl fromhd=/dev/sda1

    ```


    If your CD and pen drive both have the same version of DSL on them, there is no
    real need to issue the command fromhd=/dev/sda1; however, you may want to do this
    if the version of DSL on your CD is older than your pen drive. By using the fromhd
    command, you do not have to burn a new CD every time there is a new release of
    DSL.


    You also can combine all commands to access the pen drive in virtually the same
    way as a native boot from the pen drive by using all three commands at the boot
    prompt:


    ```

    dsl fromhd=sda1 mydsl=sda1 restore=sda1

    ```


    There are lots of hybrid possibilities when a user is traveling with DSL. It is
    possible to mix and match; for instance, you can choose to use your backup/restore
    from your pen drive and access your MyDSL extensions from your hard drive, or
    even pull down an encrypted restore file from an FTP server. To read further on
    these powerful and useful options, consult Chapter 5, “Extending Applications
    with MyDSL,” for MyDSL extensions and Chapter 4, “Configuring and Saving DSL Settings,”
    for backup and restore options.


    # After Install: Setting Default Backup/Restore and MyDSL Partitions


    Before V3.3 of DSL, the default backup/restore partition and MyDSL location in
    the syslinux.cfg were hard coded and referenced by the install scripts while booting.
    Over time, it has become clear that different systems register a USB storage device
    differently. There are even occasions when a system “sees” the device in one location
    during the installation process, and then later sees it as a different device
    while in the booting process. So, steps have been taken to make both types of
    pen drive installations device independent. The boot process probes available
    devices for the backup file and mydsl directory. The backup/restore process is
    now transparent to the end user; however, you need to select your device for initial
    mydsl extensions once before automatic boot time detection auto saving works.'
  merge: -1
  img_proc: true
