- pgno: 185
  md: 'I will now focus on using the DSL FreeDOS Utilities diskette. Doing so allows
    a common base on which to proceed. If you already have unzip and are familiar,
    I am sure it will still be easy to follow along.


    # NOTE


    If you have Windows XP, the FreeDOS boot floppy utilities will not work. With
    XP, you already have unzip; therefore, it is not needed.


    Boot from the utilities diskette and then perform the following:

    A:\> C:

    C:\> unzip dsl-33-1.zip KNOPPIX/KNOPPIX


    # NOTE


    The DSL Zip file name is munged because of the DOS 8.3 filename limit. With FreeDOS,
    you can type just a few characters and press the Tab key and the munged filename
    will be auto completed. If using Windows, you will probably be able to see and
    use the full Zip filename.


    +   4. Replace the DSL Utilities diskette with the DSL boot floppy and reboot
    your system using the DSL boot floppy.

    +   5. At the DSL boot prompt, type the following:

    +      boot: dsl 2 legacy frugal

    +      While booting from the DSL boot floppy, if errors appear or the system
    hangs, you likely need to use additional boot options. DSL boot options are discussed
    in Chapter 2.

    +   6. When you see the system prompt #, enter the following:

    +      # mkdoss swapfile

    +      Reboot again and you have arrived at a Poorman''s installation of DSL.

    +      Congratulations! You are now running a DSL Poorman''s installation within
    a Windows or DOS formatted partition.


    # DSL Installed on an Existing Linux Partition


    The Poorman''s method is also available within an existing traditional Linux installation.
    You may have another Linux distribution and want to try the Poorman''s installation
    method. The steps are really the same as earlier:'
