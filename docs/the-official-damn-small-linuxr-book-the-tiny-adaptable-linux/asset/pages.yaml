- pgno: 162
  md: "use while running with Qemu. After this is set up, it will be the simplest\
    \ way to have access to your backup files and extensions while running DSL-Embedded.\n\
    \nMost people who are interested in creating a virtual hard drive are running\
    \ DSL-Embedded from a pen drive. The rest of this section will use the pen drive\
    \ as a physical reference point for consistency, yet some may want to have this\
    \ setup sit on the regular hard drive on their personal computer. The steps are\
    \ the same as what follows; just substitute any reference to a pendrive with your\
    \ own local path.\n\nTo create a Qemu virtual hard drive, you have to use the\
    \ qemu-img.exe program included in the dsl-embedded.zip file. After it is unpacked,\
    \ the program sits in the Qemu directory or folder as recognized by MS Windows.\
    \ The following procedure describes how to create a virtual hard drive for DSL:\n\
    \n+   1. Open a DOS window and navigate to the qemu folder inside your pen drive.\
    \ In MS DOS, the navigation command is CD. If your pen drive is recognized by\
    \ Microsoft Windows as drive E, you would type the following:\n+   \n+      `CD\
    \ E:\\qemu\\`\n\n+   2. Use the qemu-img.exe program to create a virtual hard\
    \ drive. This hard drive will have a physical presence on your pen drive; you\
    \ will see it there as harddisk. (This virtual hard drive will be used later when\
    \ selecting the dsl-vhd.bat file to boot dsl-embedded.)\n+   \n+      After navigating\
    \ to your Qemu folder, you need to use qemu-img.exe to create your virtual hard\
    \ drive. The size you choose is limited by the space available on your pen drive,\
    \ and it is up to you to choose what is best for your needs.\n\n> **NOTE**\n>\
    \ \n> Keep in mind that this hard drive is *virtual* in the sense that it is not\
    \ a real drive (instead, it is a file on your pen drive). The virtual hard drive\
    \ is actually *real* in that it takes up real space on your pen drive that you\
    \ cannot use to store your non-DSL related files.\n\nThe command to use with qemu-img.exe\
    \ is\n\n```\nE:\\qemu> qemu-img.exe create hard disk SIZE\n```\n\nwhere SIZE is\
    \ the actual size you want the virtual hard drive to be. For a 64MB virtual hard\
    \ drive, type\n\n```\nE:\\qemu> qemu-img.exe create harddisk 64M\n```"
  merge: -1
  img_proc: true
- pgno: 163
  md: 'For a 500MB virtual hard drive, type


    ```

    E:\qemu> qemu-img.exe create hddisk 500M

    ```


    If, for some odd reason, you cannot navigate to the qemu directory on your pen
    drive, you may use a full-length path in your command:


    ```

    C:\> E:\qemu\qemu-img.exe create E:\qemu\hddisk 64M

    ```


    It is important to remember that the virtual hard drive needs to actually be named
    hddisk as this is how it is referenced in the ds1-vhd.bat file. After creating
    your hddisk image, go ahead and close your DOS window.


    +   3. Run the following command, which boots DSL at level two (command-line prompt),
    to perform a few steps that will format your virtual hard drive (so DSL-Embedded
    will start to use it for file restoration):


    ```

    E:\qemu> 1st-boot.bat

    ```


    You are likely to see some errors during the boot phase because the virtual hard
    drive is not yet formatted correctly.


    +   4. After the boot process is finished, format the virtual hard drive as the
    Linux native ext2 file system. At the Linux shell command prompt, type


    ```

    # mke2fs /dev/hdb


    mke2fs warning:

    Warning: /dev/hdb is entire device, not just one partition!

    Proceed anyway? (y/n) y

    ```


    You will receive a warning because you are telling mke2fs to format the entire
    virtual drive instead of just a single partition.


    +   5. Type y and press Enter.

    +   After mke2fs runs, you mount the drive and make a copy of the cloop module
    to the access point. Damn Small Linux automatically probes to look for modules.


    +   6. Mount the new virtual drive:


    ```

    # mount /mnt/hdb

    ```


    +   7. Create the mysd1 and mysd1/modules directories:


    ```

    # mkdir /mnt/hdb/mysd1

    # mkdir /mnt/hdb/mysd1/modules

    ```'
  merge: -1
  img_proc: true
- pgno: 164
  md: '8. Copy over the cloop module:


    ```

    # cp /KNOPPIX/7/lib/modules/2.4.26/kernel/drivers/block/cloop.o \ /mnt/hdb/mydsl/modules/

    ```


    9. Shut off DSL by typing this command:


    ```

    # shutdown -h now

    ```


    Your own drive now is ready to start using ds1-vhd.bat! When running ds1-vhd.bat,
    backup and restoration should automatically use /mnt/hdb, and your mydsl extensions
    will be accessed at /mnt/hdb/myds1/.


    NOTE

    When you first do a normal ds1-vhd.bat, the X setup script runs and asks for your
    preferred resolution settings. If you just want to go with the defaults, press
    Tab to highlight the Cancel button and then press Enter to exit the script.


    If you want to save your extensions, mount /mnt/hdb and download your extensions
    to /mnt/hdb/myds1.


    The mount tool in the lower-right side of your screen will not recognize your
    virtual hard drive. To mount it, open a term window and type the following:


    ```

    # sudo mount /mnt/hdb

    ```


    # Accessing Native Files from Within the Virtual Environment


    A new feature of Qemu is the ability to access your native files while booting
    in a virtual machine. The pendrive.bat file is designed to work in a pen drive
    that is used for both native BIOS booting and a virtual environment via Qemu.


    Qemu allows read access to your files, so you can load your defaults and have
    access to your extensions and personal documents. However, normally, you cannot
    save them from the virtual environment.


    Using the SMBClient, however, we can get write access via Windows network sharing
    access.


    Here are the steps as found in the readme file in the ds1-embedded.zip archive:


    +   1. In Windows, “share” your pen drive.

    +   2. In Windows, note your machine’s IP number. To do this, open a DOS window
    (command prompt) and type ipconfig.'
  merge: -1
  img_proc: true
- pgno: 165
  md: "+   3. Start DSL using the pendrive.bat.\n+   4. From DSL running in Qemu,\
    \ add files and change settings in your home directory.\n+   5. From DSL, download\
    \ any extensions you need into the /cdrom/mydsl directory.\n+   6. From DSL, click\
    \ DSLpanel, click Backup/Restore, and click Backup.\n+   7. From the DSL menu,\
    \ select Apps->Net->SMBclient and enter your specifics to connect (Domain, Machine,\
    \ Share, Name, and Password). Then, type the following from the SMB prompt:\n\
    +   \n+   smb:\\> lcd /cdrom\n+   smb:\\> put backup.tar.gz\n+   smb:\\> lcd mydsl\n\
    +   smb:\\> cd mydsl\n+   smb:\\> put just_downloaded_extension\n+   \n+   (Repeat\
    \ for all newly downloaded extensions)\n+   \n+   smb:\\> quit\n+   8. Shut down\
    \ DSL.\n\n# Using Your DSL-Embedded Equipped Pen Drive for Native BIOS Booting\n\
    \nThis subject is covered in Chapter 6, “Running a Native Pen Drive Install,”\
    \ but I want to mention that you have to apply Syslinux to the drive before the\
    \ BIOS will recognize the pen drive as being bootable. There is a version of Syslinux\
    \ that is usable from within Windows, but we are getting feedback that sometimes\
    \ it doesn’t quite work with users’ systems. You can always set up Syslinux by\
    \ booting Damn Small Linux from the LiveCD provided with this book.\n\nBe sure\
    \ to read the readme.txt found in the dsl-embedded.zip file. There are tips in\
    \ there that may be useful if you run into difficulties.\n\n# Increasing Qemu’s\
    \ Performance with KQemu\n\nSo, you think having an embedded Linux system at your\
    \ disposal is pretty cool, but you wish the speed was a little faster? The Qemu\
    \ developers have a fix for you.\n\nKQemu is a Qemu accelerator, and it works\
    \ nicely. During my experiments, I have reduced the virtual bootup time in half.\
    \ This is a great development that makes running DSL-Embedded that much more enjoyable."
  merge: -1
