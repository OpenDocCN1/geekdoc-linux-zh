- pgno: 297
  md: '# STARTING WITH SKYPE IN DSL


    Before you can start using Skype in DSL, you need to get and install the Skype
    software, then create a user account. The following sections describe how to do
    that.


    # Installing Skype


    To get and install Skype, you can use the MyDSL feature. Here''s how:


    +   1. From the DSL desktop, select the MyDSL icon.

    +   2. Select UNC and choose the latest version of Skype that is available and
    select it. For this procedure, I chose skype-1.2.0.18.

    +   3. Read the description of the Skype package and select Download.

    +   4. When prompted, indicate where you want the Skype package to be downloaded.
    The /tmp directory is used by default. Instead, you should type /mnt/sda1/myds1
    to save the extension to a pen drive. Select Download and you can watch the progress
    as Skype is downloaded and installed.


    After Skype is installed, a Skype icon appears on the desktop, as shown in Figure
    14-1.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_297_0.png)


    # FIGURE 14-1 A Skype icon appears on the DSL desktop when Skype is installed.


    # NOTE


    If you want to look for later versions of the Skype software for Linux as they
    become available, check out the Skype software download page for Linux (http://skype.com/download/skype/linux).
    Later, from the Skype window, you can select Help→ Check for Update to find if
    any software updates are available.


    At this point, everything should be ready to begin using Skype.'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# Getting a Skype User Account


    When you first launch Skype software from the icon on the DSL desktop, you are
    asked to sign in with your Skype user account, if you don’t have one yet, here’s
    how you can go about getting one:


    +   1. **Start Skype**—Select the Skype icon on the DSL desktop. A Log in to Skype
    window appears.

    +   2. **User account**—If you already have a Skype user account, type the username
    and password as prompted (then skip to the upcoming “Using Skype” section). Otherwise,
    select the New Users tab, click Next, and continue on with this procedure.

    +   3. **Add new account**—Enter the following information into the Create a New
    Skype Account screen:

    +      - **Choose Skype Name**—Type a username between 6 and 32 characters. The
    first character must be a letter, but numbers can be included after the first
    character. No spaces are allowed in the username.

    +      - **Password**—Type a 4- to 20-character password. Then, type that password
    again in the Repeat Password field.

    +      - **Store my Contacts...**—Click this box if you want your contacts, call
    history, and instant messaging history stored on the local computer.

    +      - **Your e-mail address**—Enter your email address.

    +      - **Yes, I have read...**—Click the link to the Skype End User License
    Agreement and read the license. See the Agreeing to Use Skype sidebar for some
    highlights of the license you should be aware of.

    +      - **Please contact...**—Click this box to agree to let Skype contact you
    about Skype features and services.


    Select Next to add your user account.


    At this point, the Skype main window appears.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# AGREEING TO USE SKYPE


    Before you can have a Skype user account, you must agree to the Skype End User
    License Agreement (EULA). Besides helping you understand the terms of use set
    down by Skype Software Inc. for using the Skype software, this agreement also
    helps you see some of the limitations of the software itself.


    I urge you to read the entire agreement yourself. Here are a few of the highlights:


    +   - **Covers your use**—By agreeing to use the version of Skype you install,
    you agree to adhere to the terms of the agreement, whether you use Skype from
    this install or any other installation of the software.


    +   - **Use of processor/bandwidth**—Skype helps keep the cost of providing services
    down by utilizing resources from Skype clients. To that end, the license requires
    you to agree to let Skype software use your processor and network bandwidth to
    facilitate communications among Skype users.


    +   - **No emergency calls**—As mentioned earlier, Skype doesn’t recommend that
    you use Skype software to provide your only phone service. One reason is that
    Skype software doesn’t support or carry emergency calls.


    +   - **Personal and noncommercial**—You can’t grant your rights to use the software
    to anyone else. So, you can’t legally make a Skype system to resell to others.


    As with most freely distributed software, Skype software is provided without warranty.
    The EULA also reminds you that using Skype software doesn’t grant you ownership
    to any of Skype’s intellectual property contained in that software.


    4. Add account information—If you want other Skype users to be able to find you,
    you may want to add information about yourself to your user account. An Edit Profile
    window may open automatically the first time you log in. If it doesn’t, from the
    Skype window, select File→ Your Personal Profile. Figure 14-2 shows an example
    of the My Profile screen that appears.


    As you can see from Figure 14-2, you can add name, city, state, phone number,
    and other personal information about yourself. This information makes it easier
    for people to search for you through the Skype search feature.


    Now you are ready to start using Skype to communicate with others.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# FIGURE 14-2 Add information to your Skype profile to help others find you.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_300_0.png)


    # USING SKYPE


    After you have a user account, you can start using Skype. If the Skype window
    is not already open, open it by clicking the Skype icon on the DSL desktop. When
    prompted, log in using the Skype login and password you created. The Skype window
    appears, as shown in Figure 14-3.


    Here are a few things you should learn about the Skype window:


    +   - **Toolbar**—The default toolbar lets you add a contact (plus icon), search
    for Skype users (magnifying glass icon), start a conference call (people icon),
    send an instant message (A in a bubble icon), send a file (page with up-arrow
    icon), or view profile (i in a circle icon). Select Configure (tools icon to the
    right) to change which icons appear on the toolbar.


    +   - **Contacts**—Shows the contacts you have added to your list. Contacts can
    be added to groups or kept as ungrouped. An icon next to each contact name shows
    whether the contact is currently connected to the Skype service. Right-click any
    contact name to see a list of actions to take on that contact (telephone call,
    instant message, view profile, and so on).'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# FIGURE 14-3

    Start your session from the Skype window.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_301_0.png)


    +   - **Dial**—If you are using the for-pay SkypeOut service to call traditional
    telephones, you can use the keypad on the Dial tab to key in a telephone number
    to call.

    +   - **Call List**—The Call List tab keeps a record of your missed calls, incoming
    calls, and outgoing calls. It also has a button for retrieving voice mails, if
    you have signed up for that service with Skype.

    +   - **Events**—The events area of the window lets you see contact events that
    have occurred. For example, it shows missed chats and calls that have occurred.
    You can select an event to respond to it (for example, to call the person back).

    +   - **Services**—Skype for-pay services are available from this area of the
    Skype window. Select SkypeOut, VoiceMail, or SkypeIn to connect to the Skype website
    to enable any of those services.

    +   - **Phone call**—Type in a Skype username or phone number you want to call
    and click the green phone icon to place the call. Click the red phone icon to
    hang up.

    +   - **Status list**—Click the icon in the lower-left corner of the screen to
    see the status list. The grayed item in the status list (in this case, Online)
    shows the current status of your Skype session. Select Do Not Disturb to have
    incoming calls queued to respond to later, without showing you alerts at the moment
    each call arrives. Selecting Skype Me opens your session so that any Skype user
    can try to contact you.'
  merge: -1
  img_proc: true
- pgno: 302
  md: 'When Skype is running (/opt/skype/skype command in DSL.), your computer is
    accessible to the Skype service, even if you are just signed in but not currently
    making a call. Those contacts you have allowed will be able to see that you are
    online. The Skype services itself will have access to your computer''s processor
    and bandwidth.


    The following sections describe how to use Skype to find and communicate with
    Skype users in various ways. Later, you can find information on how to use the
    Skype for-pay services, such as making calls to traditional telephones.


    If you find that you need more information on using Skype, you can refer to the
    online guides available from the Skype website (www.skype.com/help/guides). In
    particular, you can find out how to get software and instructions for setting
    up Skype on other computer systems (such as Windows and Mac OS X).


    # Trying a Test Call


    Before proceeding, you should check that your microphone and speakers/headset
    are working with Skype by trying a test call. In the text box near the bottom
    of the Skype screen, type the account name:


    ```

    echo123

    ```


    and click the green call icon. Skype makes a call to the Skype Test Call account.
    A voice tells you to record a message at the tone. After you speak for a few seconds
    into the microphone, the Skype Test Call plays the message back for you that you
    just recorded. If you hear it, your Skype service is working well enough to proceed
    to using Skype. (If not, refer to the "Troubleshooting Skype" section later.)


    # Finding People to Connect To


    Skype keeps a public record of every Skype user account, which can optionally
    include a lot of personal information. You can search that database of information
    to find people to call. Then, after you find a person you are looking for, you
    can view his profile, add him to your contact list, or send him an instant message.
    Here''s how:


    +   1. Start search—Select the Find icon (a magnifying glass) from the Skype toolbar.
    The Search for Skype Users screen appears.

    +   2. Choose search terms—Type a word to search for into the Look For box and
    select Find. The Skype Name field in the Skype user account database is searched
    for that word. By selecting Advanced, you can instead search for a'
  merge: -1
  img_proc: true
- pgno: 303
  md: 'user by full name, birth date, email address, sex, language, address, or phone
    number. Continue to refine your search until the person you are looking for appears
    on the list.


    # 3. Select a user—


    Right-click the user account you are interested in contacting. Figure 14-4 shows
    an example of the menu that appears in the search box when you right-click a user
    account.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_303_0.png)


    FIGURE 14-4 Choose how to contact someone after searching for Skype users.


    # 4. View user profile—


    Select View User Profile to make sure that the user account you selected represents
    the person you want to contact.


    # 5. Add to contacts—


    Select Add to Contacts from the menu. A Request Authorization window appears that
    asks if you want to send a message to that user requesting to “Please allow me
    to see when you are online.” You can type a different message, if you like, as
    well as make one of the following requests:


    +   - Request authorization to see his/her/status and allow this user to see when
    I am online

    +   - Request authorization to see his/her/online status but do not allow this
    user to see when I am online


    Choose the option you want and select OK. If the person you want to add to your
    list is currently connected to Skype, that person will see a message asking if
    she wants to:


    +   - Allow this person to see when you are online and contact you

    +   - Do not allow this person to see when you are online

    +   - Block this person from contacting you in the future

    +   - Add Full Name (Skype Name) to my contacts


    If the person allows you to see when she is online and adds you to her contacts
    list (the default behavior), the person’s full name appears in your contacts list
    under ungrouped buddies. You can now contact that person in different ways from
    your contacts list or add that person to a contacts group.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# Working with Groups of Contacts


    To create a group of contacts, right-click a username in the Skype window and
    select Groups→ Create New. Enter a new group name when prompted. Add others to
    that group by right-clicking their names, selecting Groups, and choosing the new
    group name from the menu.


    # Sending Contacts Lists


    After you have put together a good list of contacts, you might want to share that
    list with your friends or coworkers. To do that, select Tools→ Send Contacts.
    In the Send Contacts window that appears, type the Skype Name you want to send
    the contacts to in the top box. Next, choose the contacts you want to send from
    the All Contacts box and select Add to add each one to the Contacts to Send box.
    Select Send to send the list.


    If the person you are sending the list is currently connected to Skype, an Incoming
    contacts list should appear on that person''s desktop. Figure 14-5 shows an example
    of a contacts list that appears on a desktop for a Skype user from a Mac OS X
    desktop.


    FIGURE 14-5 Choose contacts sent from a Skype user''s contacts list.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_304_0.png)


    The person receiving the list can select Add Selected to add all the contacts
    sent to him on that list. Otherwise, he can remove the checkmarks from those users
    that he doesn''t want to have on his own contacts list.'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# Making Free Calls


    After you have gotten your Skype session all set up, making calls is the easy
    part. Here are some of the ways you can go about making free calls to other Skype
    users on a computer:


    +   - **Contact List**—Select a user from your contacts list, then click the green
    phone icon on the bottom of the screen to make the call. Or, you could right-click
    the contact name and select Call This Contact from the menu that appears.


    +   - **Search List**—Search for the contact you are looking for, as described
    in the “Finding People to Connect To” section. Select the contact from the list
    and click the green call icon from the lower-left corner of the screen to call
    that person.


    After the call is placed, a pop-up window appears on the recipient’s desktop.
    Figure 14-6 shows an example of such a pop-up appearing on the Mac OS X desktop
    of a Skype user.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_305_0.png)


    The recipient can simply select the Answer button to begin conversing. Either
    party can end the call by selecting the red hang up button.


    # Participating in Chats


    Although there are a lot of applications that let you carry on typed chats with
    one or more other people, Skype lets you leverage the same Skype contacts database
    to carry on typed chats with the same people you are set up to call. You can start
    a typed chat in much the same way you begin an audio call:


    +   - **Contact list**—Right-click a user from your contacts list, and then select
    Send an Instant Message from the menu that appears.


    +   - **Search list**—Search for the contact you are looking for, as described
    in the “Finding People to Connect To” section. Right-click the contact from the
    list, and then select Send an Instant Message.


    The chat window opens, ready for you to type a message to the chosen recipient.
    Type a message and press Enter. A chat window opens on the recipient’s desktop.'
  merge: -1
  img_proc: true
- pgno: 306
  md: 'Both sides can begin typing messages, with the results looking like the window
    shown in Figure 14-7.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_306_0.png)


    FIGURE 14-7 Open an instant message window to chat with another Skype contact.


    You can add other contacts to the chat by selecting the Add More Users to This
    Chat button. Then, you can choose people from your contacts list to add as chat
    participants. The result is that the users you choose are asked to participate.


    During the chat, you have many of the features available that you would expect
    to see during a chat session. For example, you can change the chat topic or select
    to bookmark the chat.


    # USING SKYPE FOR-PAY SERVICES AND PRODUCTS


    Before you can start making local, national, or international calls from Skype
    to phones on the standard telephone system, you need to pay for one of the Skype
    programs that let you do that. Other purchases you can make from Skype include
    wireless phones and other telephone hardware. Check the Skype website (http://skype.com/products)
    to learn about the different products available from Skype.'
  merge: -1
  img_proc: true
- pgno: 307
  md: "# Purchasing Calling Time\n\nBecause these programs change often, you need\
    \ to check the Skype website for the latest programs and pricing. However, at\
    \ the time of this writing, here are some of the available telephone calling programs:\n\
    \n+   - **SkypeOut**—This program lets you make calls from your computer to phones\
    \ and mobile devices on the traditional phone system. There are yearly rates for\
    \ unlimited calls within the United States and Canada (currently $29.95 per year).\
    \ For international calls, there are per minute rates offered (currently starting\
    \ at $.021 cents per minute).\n+   \n+   Calls to a group of countries where Skype\
    \ is most popular are available at a single SkypeOut Global Rate. Calls to countries\
    \ covered under that rate include countries in North America, Europe, Australia,\
    \ some countries in the Far East, and a few in South and Central America. Check\
    \ the Skype website for exactly which countries are covered (www.skype.com/products/skypeout/rates).\n\
    \n+   - **SkypeIn**—To allow other people to call your Skype account on your computer,\
    \ you can sign up for SkypeIn service. That service assigns a phone number to\
    \ your Skype service so it can be reached from a traditional telephone.\n+   \n\
    +   One advantage to this service is that you can have a phone number assigned\
    \ from an area that is in a particular area from which you expect a lot of calls.\
    \ In that way, people that call you from that same area can pay local charges,\
    \ instead of long-distance charges. You, on the other hand, can be logged in from\
    \ anywhere in the world that you can fire up your Skype account.\n\nSome traditional\
    \ extra telephone services are also available from Skype. For example, you can\
    \ get Skype Voicemail (to answer your calls when you aren’t around) or Call Forwarding\
    \ (to have your Skype calls forwarded to your traditional landline phone or mobile\
    \ phone).\n\n# Purchasing Accessories\n\nSkype sells accessories that you can\
    \ use with your Skype free and for-pay call services. The Skype Accessories Shop\
    \ has the latest available products (http://accessories.skype.com). The following\
    \ are some Skype products that might be useful to use with DSL."
  merge: -1
  img_proc: true
- pgno: 308
  md: '+   Headsets—Although you can purchase similar headsets to the ones that Skype
    offers at most stores that sell computer accessories, Skype offers some modestly
    priced headsets that include free SkypeOut minutes. Skype also sells a speaker/headset
    switch, to make it easier to change back to speakers when you are not making phone
    calls.


    +   Starter kit—If you are setting up several people at once to use Skype, a starter
    kit including a headset and software (usually Windows and/or Mac OS X) can help
    get everyone started. Some of the kits also include SkypeOut calling minutes.


    If you get hooked on using Skype, but you prefer to use a hand set to make and
    receive calls, Skype offers several different models of VoIP phones. Some of these
    phones connect to the computer via USB cables, whereas others connect wirelessly
    via a broadband Internet connection.


    # RESTARTING DSL TO USE SKYPE


    If you followed the procedure for installing Skype and the ALSA sound system,
    the extensions you need should already be set up to be loaded the next time you
    reboot DSL. If, when you boot DSL, you indicate that you want to use the ALSA
    sound system, you don’t even need to run any setup commands to start ALSA. It
    should just work.


    Here’s an example of what you should enter at the boot prompt when you restart
    DSL to start the ALSA sound system (so you can use Skype):


    ```

    boot: ds1 alsa

    ```


    If ALSA doesn’t start for some reason, try running the alsa_snddevices and alsa_init
    commands, as described in the “Setting Up ALSA Sound in DSL” section earlier in
    this chapter. You might also need to use other boot options if, for example, you
    had saved your MyDSL extension to some directory other than a top-level mydsl
    directory on a local hard disk or pen drive.


    # TROUBLESHOOTING SKYPE


    Skype requires an active Internet connection, working sound card, microphone,
    and speakers/headphones to be able to make audio calls. If any of those items
    isn’t working properly, you won’t be able to make audio calls with Skype.'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'Because Skype supports Linux, there are some Skype resources you can turn to
    if something goes wrong. You can begin at the Skype Help site (http://support.skype.com).
    Next, try the Skype for Linux forums (http://forum.skype.com/bb/viewtopic.php?f=18).
    Here are a few tips for overcoming potential problems with Skype:


    +   - **Calls not going through**—Check that you have an active Internet connection.
    In many cases, wired Ethernet connections start automatically if a DHCP server
    is present. If you cannot browse the web or ping a remote computer (sudo ping
    example.com), you may have to configure your network manually. For a wired Ethernet
    connection, right-click the desktop and select System→ Net Setup→ Netcardconfig
    and fill in the appropriate information for your Ethernet connection.

    +   - **Unable to log in**—You cannot log in multiple times under the same username.
    There are times when the Skype process doesn’t get killed if the Skype window
    isn’t shut down properly, which might prevent you from logging in again. If you
    think this might be the case, close the Skype window, open a Terminal window,
    and type killall skype at the prompt. Restart Skype and try logging in again.

    +   - **Microphone not working**—If your microphone is not working at all, use
    the dMix audio mixer to check that you have selected the correct input device
    and that the sliders are up (indicating the volume level at which you are recording).


    If you think that Damn Small Linux doesn’t include support for your sound card,
    try installing the ALSA Drivers package from MyDSL. Determine the type of sound
    card you have (type dmesg | less or lspci -vv | less). Determine the name of the
    driver the card needs by searching the web for the name of the audio device and
    the word Linux. Then, use the modprobe command (as root user from a Terminal window)
    to load the driver.


    Some additional configuration of Skype can be done from the Options window. Select
    Tools→ Options from the Skype window to see the Skype Options window. Besides
    being able to set options from this window that establish the behavior of Skype
    (such as what to do when your Skype session is inactive and which browser to use),
    you can also set some more advanced options.


    For example, the Hand/Headset settings let you choose the device name (/dev/dsp1,
    by default) representing the sound card to make calls on. The Advanced tab lets
    you choose a port to use for incoming connections and lets you select to display
    technical call information.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# SUMMARY


    The Skype VoIP service provides a way of making free calls over the Internet from
    Linux, Windows, Mac OS X, or handheld PC devices. A Linux port of Skype software
    is available for Damn Small Linux, which you can easily install using the MyDSL
    feature.


    Besides being able to make free Internet calls using Skype, Skype offers a database
    of Skype users that you can search to find people to call. Another free service
    that Skype offers is the ability to send instant messages to other Skype users
    to carry on Internet chats.


    If you want to expand your use of Skype, you can sign up to be able to call people
    on regular telephone lines from your computer using the for-pay SkypeOut service.
    If you want others to be able to call you from your Skype session on your computer,
    you can sign up for the SkypeIn service (which is also a for-pay service).


    Although Skype is not recommended to be used as your only telephone service (partly
    because it doesn’t offer emergency service), it can be a low-cost and convenient
    way to make telephone calls to others around the world.'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# CHAPTER 15


    # Running a Digital Media\nFrame with DSL


    Ever since people began retiring used laptop computers, converting some of those
    old machines into digital picture frames has been a popular do-it-yourself project.
    Because it would be frivolous to spend even a few hundred dollars on such a project,
    laptops used to make digital picture frames are usually cheap (under $100), have
    little memory, and feature weak processors. With its low RAM and CPU requirements,
    Damn Small Linux (DSL) is an excellent operating system platform for such a project.


    Of course, with lots of multimedia tools available in free and open source software
    today, there’s no reason to limit a digital picture frame to images alone. Why
    not use such a frame to play music, movies, or other content as well? For that
    reason, this project is called a digital media frame and includes features for
    substituting music and video players for the slideshow software. (Although with
    the least powerful computers that run Damn Small Linux, you might not be able
    to do much more than a slideshow.)


    From a hardware standpoint, the hard part of building a digital media frame is
    to get all the parts you need out of the laptop and into a thick, shadowbox-type
    frame. Along the way, you try to separate out the parts you don’t need (like the
    case and the keyboard) and try not to break the parts you do need. Besides the
    requisite frame, other hardware items you might want to add include wired or wireless
    LAN cards.


    On the software side, you want the digital picture frame to play the content you
    choose as automatically and without intervention as possible. However, you also
    want to at least provide mechanisms for adding and removing content. After all,
    how often can you watch nothing but your cousin Harvey’s wedding pictures before
    you want to change to a new slideshow?'
  merge: -1
  img_proc: true
- pgno: 312
  md: 'Making a digital media frame can be a fun project. But before diving into it,
    I strongly recommend you read the following warnings regarding both the hardware
    and software aspects of this project:


    +   - **Hardware Warning!**—In making a digital media frame, you need to take
    apart a laptop computer in such a way that it will probably not go back together
    again. So, if you want the laptop to be a laptop again, don’t use it for this
    project. Also, it is quite possible that you might do irreparable damage to the
    laptop in the process of adapting it into a digital media frame. So, please don’t
    use a laptop that you can’t afford to be without. Finally, the resulting media
    frame will not be UL approved (www.ul.com), so you run some risk of burning your
    house down.

    +   - **Software Warning!**—This is not a click-and-go project on the software
    side either. In this project, you repartition disks, modify bootloaders, and work
    with initialization scripts. If you find the command line to be challenging, you
    will probably find this project difficult to do.


    The bottom line is that this project is for more advanced Linux do-it-yourselfers
    who have an old laptop to spare. If that’s not you, you might want to limit yourself
    to playing with some of the multimedia software described in this chapter.


    # SETTING PROJECT GOALS


    In its most basic form, a digital picture frame simply plays a bunch of digital
    images it is given, without needing any intervention, after it is booted up. The
    images are usually played as a slideshow, with the images changing automatically
    every few seconds.


    To make this project different from basic digital picture frames, I want to expand
    the features in the following basic ways to make it more as a digital media frame:


    +   - **Play different media types**—Allow the unit to play music, presentations,
    or videos, along with digital image slideshows. So, for example, the frame could
    be set up to loop a video at a trade show or a real estate open house.

    +   - **Make it easy to add content**—Set up ways to add any of the supported
    content types easily, using different types of network connections (wired or wireless),
    as well as removable media (such as a USB pen drive).


    Shopping for the software for the project is easy (it’s all on the CD that comes
    with this book). For me, getting the frame meant sending my wife Sheree on a trip
    to'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'find a picture frame that is more than two-inches deep and large enough to
    display the laptop''s screen. After that, a few extra pieces for mounting the
    laptop in that frame are needed. But the big chore is finding the right laptop
    at the right price.


    # CHOOSING A LAPTOP


    When you go to search for a laptop to use for your media frame, you need to decide
    if time or money is more important. The cheaper the laptop, the more probable
    that it will require extra work to do the things you want it to do. Also, be aware
    that replacement parts can sometimes cost more than the value of the laptop itself
    (especially if you need to add RAM or replace a broken screen). So, in general,
    the cheapest laptop may not be the best choice.


    # Asking About a Used Laptop


    Old laptops are available everywhere from garage sales to online sites. If you
    are heading to a used computer store or online auction to get a used laptop, here
    are some things you should check for:


    +   Working?—Many older laptops are being sold for parts only. If you are purchasing
    a laptop online, be sure to get a guarantee that if it is not working, you can
    return it. If you have access to the laptop before you buy, take your handy Damn
    Small Linux CD and a boot floppy with you to see if the laptop can boot DSL. (While
    the laptop is booted, use DSL to check out what''s available—disk space, RAM,
    etc.—as described in the “Evaluating a Used Laptop” section in this chapter.)
    Keep in mind that our definition of working is not the same as other people''s
    definition of working. For example, a missing hard drive and a few broken keyboard
    keys might get you a good price, but still work fine for your digital frame. Without
    a hard drive, you can run the project from CD and get images over your LAN or
    from a USB flash drive.


    +   Boot media—Some older laptops don''t have CD drives. That poses problems not
    only for booting, but also for accessing the 50MB image you need to run Damn Small
    Linux. A 3.5-inch floppy disk was the standard removable boot medium before CD
    drives became popular, but it can only hold up to about 1.7MB of data at a time
    (although it is referred to as a 1.44MB floppy). Using floppy disk installation
    procedures and a stack of 35 floppies (see Chapter 8, “Installing DSL in Alternate
    Ways”), you can get DSL on to a hard disk and boot from there.'
  merge: -1
  img_proc: true
- pgno: 314
  md: 'Some older machines may have ZIP drives (internal or external). DSL offers
    procedures for booting and installing Damn Small Linux from a Zip drive. A Zip
    drive is easier to use than a stack of floppies, because the Zip media is larger.
    (100MB was an early standard size; however, later, 250MB and 750MB Zip drives
    became more popular.)


    After DSL is installed on one of these older machines, however, you may find that
    it lacks other hardware needed to make it a useful machine. For example, an old
    laptop with no CD drive probably also has a small hard disk, no LAN interface,
    and little RAM.


    +   Hard disk—Speaking of hard disks, you don’t need one at all to run DSL. However,
    consider that if you want to install DSL to hard disk, you need at least 64MB
    of disk space for DSL and at least that much space in a swap partition. You also
    need to consider whether you want to keep the content you play with the digital
    media frame on the hard disk (or get it from over the network or from some other
    removable medium, if available).


    +   RAM—There is no special RAM requirements, beyond what you already need to
    run DSL. Of course, having more than the minimum 32MB (CD boot) or 16MB (hard
    drive boot) doesn’t hurt. Honestly, I found that about 32MB was about as low as
    I wanted to go, even with just a slideshow media frame.


    +   Network interface—Having a wired or wireless Ethernet network interface makes
    everything easier with a digital media frame. From another computer on your LAN,
    you can use a variety of network services to get the images you want to display
    to your digital frame. You can also log in remotely to do any other maintenance
    on the machine. Remote login is a real plus because you probably won’t have a
    keyboard attached to the computer.


    Although most recent laptops have wired and/or wireless networking built-in, many
    older laptops include built-in modems (usually cheap WinModems). To add a LAN
    interface, you typically add a PCMCIA card (provided a slot is available). USB
    Ethernet adapters are another option, if you have a USB port (but again, some
    older machines don’t).


    A final option for networking your no-Ethernet, no-PCMCIA, no-USB laptop is to
    use the parallel port (which many older laptops have) to create a connection using
    Parallel Line Internet Protocol (PLIP). DSL includes the PLIP driver (plip.o).
    So, with the right cable (www.tldp.org/HOWTO/NET3-4-HOWTO-9.html#ss9.2) and PLIP
    HOWTO (www.tinux.com/howtos/PLIP.shtml), you should theoretically be able to work
    this to work. Personally, I haven’t tried PLIP for several years, and when I did,
    I had some trouble getting the cable right.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '+   ■ **Accessories**—Make sure that you get a power supply and battery with
    the laptop. Without those items, even if the machine works otherwise, you really
    don''t have a usable machine. If you can find a power cord, you might end up paying
    an extra $10 or $20 (or more if it''s hard to find) to get a replacement.


    Sometimes, you can find a business or school selling multiple, similar laptops.
    If some aren''t working, and you are so inclined, you can try to piece together
    a good, working laptop. Also, with older machines, having some spare parts isn''t
    a bad idea.


    # Evaluating a Used Laptop


    If you are in a position to test out a laptop (whether you are buying it or just
    digging it out of your closet), Damn Small Linux itself is a great tool for evaluating
    whether a laptop will work for this digital media frame. For a really low-end
    machine, however, you might want to grab a floppy Linux distribution. I suggest
    having these media handy:


    +   ■ **Damn Small Linux CD**—Use the CD that comes with this book or obtain one
    from Damnsmalllinux.org.


    +   ■ **Damn Small Linux Boot Image**—Copy the bootfloppy.img to floppy disk,
    as described in Chapter 8. Use this in case you find a laptop that has a CD drive
    but the CD drive is not bootable.


    +   ■ **Tom''s Root Boot**—Download Tom''s Root Boot floppy disk installer from
    http://toms.net/rb/download.html (tomsrbt-*-tar.gz). Extract the archive on a
    computer that has a floppy drive you can write to. Then, copy the floppy image
    to a blank floppy disk using the install.s script, as described in the tomsrbt.FAQ
    file. Use this floppy disk in case you encounter a laptop that has a floppy drive
    but no CD drive.


    The two laptops I had available as candidates for the digital media frame serve
    as good ways to illustrate how to evaluate laptops with and without CD drives.


    # Evaluating a Laptop with Damn Small Linux


    With the Damn Small Linux CD in hand, I tried out the first of two laptops I had
    in my closet: a Compaq Pressario 1620 laptop. After having the screen appearance
    make it unusable by the default boot, I booted DSL by typing fb800x600 as the
    boot command (frame buffer). That came up fine, so I selected Xfdev xserver when
    prompted to configure X Setup.


    With DSL running on my Compaq Presario, I could determine a lot of stuff about
    the machine. The first, and most important, thing it told me was that the'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'laptop will run Damn Small Linux! Next, I opened a terminal window as root
    (right-click the ATerminal icon and choose Aterm as Super User). Then, I ran the
    dmesg command to see boot messages from the kernel. Here’s an example:


    ```

    # dmesg | less

    <5>0MB HIGHMEM available.

    <5>32MB LOWMEM available.

    <4>Detected 167.049 MHz processor.

    <6>Memory: 28652k/32768k available (1371k kernel code, 3728k reserved,

    561k data, 140k init, 0k highmem)

    <6>Floppy drive(s): fd0 is 1.44M

    <4>hdc: TOSHIBA CD-ROM XM-1602B, ATAPI CD/DVD-ROM drive

    <4>hda: attached ide-disk driver.

    <6>hda: 4233600 sectors (2168 MB) w/96KiB Cache, CHS=525/128/63

    <6>PCI: Found IRQ 11 for device 00:01.2

    <6>usb-uhci.c: USB UHCI at I/O 0xfc0, IRQ 11

    <4>usb-uhci.c: Detected 2 ports

    <6>Yenta ISA IRQ mask 0x0498, PCI irq 5

    <6>ttyS00 at 0x03f8 (irq = 4) is a 16550A

    <6>parport0: PC-style at 0x378 [PCSPP,TRISTATE,EPP]

    <6>parport0: irq 7 detected

    ```


    The output just shown, which has been edited, tells you some things you can see
    on the laptop and some you can’t. This laptop has 32MB of RAM and a 167.049MHz
    processor (both of which are low, but workable, for our purposes).


    The machine has a floppy drive and CD-ROM drive (which you can already see if
    you are looking at the machine), and a hard disk. The hard disk has about 2GB
    of space (2168MB). Other available ports on the laptop include two USB ports,
    a CardBus slot (Yenta), a COM1 port (ttyS00), and a parallel port (parport00).
    Next, I did a quick check of the processor type:


    ```

    # cat /proc/cpuinfo

    vendor_id  : GenuineIntel

    cpu family : 5

    model name : Pentium MMX

    cpu MHz    : 167.049

    ```


    So far, it looks like this laptop would work for the project.


    # Evaluating a Laptop with Tom’s Root Boot


    The second laptop I had to try out was a Texas Instruments TravelMate 4000E 486
    WinDX2/50 MHz laptop. Because it has no CD-ROM drive, I booted up the Tom’s Root
    Boot floppy and logged in as root user (xxxx is the password). Because there is
    only a shell interface, I could immediately type dmesg to check out the hardware:'
  merge: -1
