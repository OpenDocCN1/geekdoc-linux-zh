    ![](img/af53325d7f38f1cdafca9f44568e4ab8_112_0.png)


    After you have selected a printer from over the network, as a JetDirect printer
    is, a network setup screen appears, as shown in Figure 4-24.


    FIGURE 4-24 Identify the name and IP address of the remote printer.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_112_1.png)


    To use a JetDirect or other UNIX network printer, first enter the internal IP
    number assigned to your printer. In Figure 4-24, you can see I have entered the
    address of 10.1.3.8, my JetDirect card''s IP number. Because I am using a JetDirect
