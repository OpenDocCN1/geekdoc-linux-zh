  md: 'graphical mode. If you are working on one of these units, you may consider
    using it only in text mode.


    We provide a lot of text applications that can turn this machine into a useful
    application (see Chapter 3, “Using DSL Applications”). If you do venture into
    the GUI desktop, you will want to avoid any program that requires a lot of CPU
    cycles. Firefox should be avoided on such a thin client, as well as any of the
    GTK2 extensions. In addition, do not even try to use OpenOffice.org office applications.


    In graphic mode, try to use our lighter-weight program options. For instance,
    use Ogg123 or Mpg321 to listen to your music. Use Dillo, Netrik, or Links for
    browsing the web. Additionally, use Naim instead of the Gaim extension for instant
    messaging. You may want to download the gLinks.uci extension and use that as your
    default browser. It is substantially lighter than Firefox, but it does good table
    rendering and also manages resources well.


    # Limited RAM and No Hard Drive


    Limited RAM can pose a challenge. Many thin client type systems do not have a
    real hard drive, so there is no capability to use a swap partition. In this case,
    the question is becomes, “How much RAM do you have to work with?”


    You can have fairly normal PC operation using DSL without a swap file in a system
    with 256MB. I use the Damn Small Machine daily at this amount of RAM. If you are
    careful, you can have normal functionality with 128MB of RAM and no swap drive,
    but you should monitor your RAM use closely, particularly when surfing the web.
    Figure 12-2 is a picture of the Damn Small Linux machine.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_271_0.png)


    In this scenario, you want to limit RAM usage by not having too many memory-draining
    applications open simultaneously. You will be surprised at how much you'
