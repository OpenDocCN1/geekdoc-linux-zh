- pgno: 282
  md: '![](img/af53325d7f38f1cdafca9f44568e4ab8_282_0.png)


    FIGURE 13-1 The default configuration for Edna as seen via the Firefox browser
    in DSL.


    The other directory listed is Jukebox. It points to /opt/mp3s, which lives within
    the ramdisk that DSL creates at boot time. This means that the size /opt/mp3s
    is limited by the amount of RAM space DSL has allocated. Obviously, this is not
    a location where you would store a massive amount of music. Most of the time,
    users want to access music on a hard drive. Fortunately, there is a configuration
    file that makes it easy to edit the path to your music.


    # Editing the Path to Your Music


    To point Edna to the right directory, you need to edit the edna.conf file. This
    file can be found at /usr/share/edna/edna.conf.


    You will want to open it in your editor of choice. In this example, you use Beaver
    for your editor. You need to have super user (root) privileges to edit this document,
    as shown in Figure 13-2.


    Open a term window and enter this command:


    ```

    sudo beaver /usr/share/edna/edna.conf

    ```'
