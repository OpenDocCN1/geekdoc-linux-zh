- pgno: 287
  md: '![](img/af53325d7f38f1cdafca9f44568e4ab8_287_0.png)


    **FIGURE 13-5** View a snapshot of local use and remote access to your Edna Server.


    # CONFIGURATION OPTIONS, CUSTOMIZATION, AND SAVING SETTING


    There are a few options in the config file that you may find interesting. You
    can change the default port from 8080 to any free port you desire. This may help
    in getting around some firewalls. There is also the option of binding Edna to
    a host name so that the server headings will comply with remote domain access.
    Also available are user and password authentication and restricting access to
    only specific resolved domains or remote IPs (be sure to reference /etc/services
    to avoid conflicts with other applications while choosing a port)—both are handy
    if you want to restrict access to your remote music.


    You can also customize the look of your Edna server by editing the HTML or images.
    The files to edit are located in the following directories:


    ```

    ```text

    /usr/share/edna/www/

    /usr/share/edna/www/images/

    ```

    ```


    If you edit the defaults, be sure to back up your work and to include the Edna
    directory in your .filetool.lst.'
  merge: -1
  img_proc: true
- pgno: 288
  md: 'The entry in ~/.filetool.1st should look like this:


    ```

    usr/share/edna/

    ```


    This entry makes sure your configuration file and any alterations are automatically
    saved and restored at shutdown and startup time. If you are running Edna with
    only a modified config file, all you need to back up and restore is the file itself.


    To back up just the config file, add this line to ~/.filetool.1st:


    ```

    usr/share/edna/edna.conf

    ```


    To have Edna boot and run automatically upon startup, you need to enter the Edna
    launching script into the boot local file, which can be found at /opt/bootlocal.sh.
    If you have your music on a particular drive, you also have to mount that drive
    first.


    For the example in this chapter, the bootlocal.sh entries look like this:


    ```

    mount /dev/hda1

    cd /usr/share/edna

    exec python edna.py &

    ```


    # EDNA AND ACCESSING REMOTE MUSIC


    Okay, let''s pretend that you have a job at a repressive company that does not
    allow you to bring in your music, and also deploys a restrictive firewall that
    forbids you access to a remote music server where you can access your music. What
    to do? Many work environments monitor and restrict access via HTTP, but do nothing
    about Secure Shell (SSH) access to remote hosts. How does that help you if the
    music is on your private server but you can''t bring it into work? You may remember
    in Chapter 3, "Using DSL Applications," when I went on about the FUSE file system
    (SSHFS) and how cool it is because it allows mounting remote drives via SSH. Well,
    you could use that in combination with the Edna server to access your remote music
    as if it were locally hosted! Yes, I know it''s geeky, but it is also pretty damn
    cool!


    Here is what you do: The first step is to mount your remote file system via SSHFS.
    You need to have root privileges, so open up a root term window. Before you use
    SSHFS, you need to load the fuse module. To do this, type modprobe fuse. Now,
    you can use SSHFS to access your remote drive. You have to decide on a place for
    your mount point; we conveniently have /mnt/test/ available in DSL, so you may
    just want to use it. The syntax for the sshfs command is similar to that of the
    ssh and scp commands—it works with an IP address or domain name.'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'Here is the syntax to use:


    ```

    # sshfs user@remote_address:/path/to/music/ /mnt/test/

    ```


    Next, you press Enter and then type in your password just like using SSH or SCP.
    After this is done, your remote music (MP3s, Ogg files, etc.) is accessible at
    /mnt/test/path/to/music/. All you need to do is add this path to your Edna config
    file and (re)start Edna. Bam! Done. Now, you have access to your tunes despite
    the man trying to keep you down ;-). Perhaps the greatest benefit of using SSHFS
    and Edna is that you can share your remote music with others on your network as
    well.


    Here is the entry, keeping consistent with the previous example entries:


    ```

    dir4 = /mnt/test/path/to/music/ = Remote Tunes

    ```


    If Edna is already running, you need to restart it for it to pick up the remote
    file. Let''s send a HUP signal to the python process to accomplish the restart:


    ```

    sudo killall -HUP python

    ```


    Now, you should be able to access your remote files on the computer running DSL
    via localhost access at http://127.0.0.1:8080/Remote%20Tunes/. Other people on
    your local network should also be able to access your tunes via your local IP.
    If you don''t know what it is, you can look at the Torsmo display at the upper
    right of your desktop or open a Terminal window and type /sbin/ifconfig and look
    for the four part number that comes after inet addr: on the device that is not
    the "local loopback" or "lo" listing.


    For example, if your address turns out to be 192.168.1.200, people in your local
    area network could access your remote tunes by pointing their browser to http://192.168.1.200:8080/Remote%20Tunes/.


    # SUMMARY


    This should be enough to get you going with a basic Edna setup. As you can see,
    there are many ways to use Edna to enjoy your music or any other type of audio
    files. One last tip: If you include an image in a directory with your music, Edna
    displays that image while you access it. This could be a way to add some personality
    to your music server.'
  merge: -1
  img_proc: true
