  md: '# Acknowledgments


    I would like to thank all the fine folks at Prentice Hall for giving me this opportunity.
    A special thanks to Chris Negus for shepherding me through the authoring process.
    Standing on the shoulders of giants such as Richard Stallman, Linus Torvalds,
    Klaus Knopper, and many others who have contributed and continue to contribute
    to Free Open Source Software, a big thank you. For without such, this project
    would not exist.


    Thanks to John Andrews for founding and sharing his creation. Many thanks to the
    community of DSL users. Thanks for the suggestions, bug reports, sharing your
    knowledge with others, and the many application extensions known as the MyDSL
    repository. Thanks to community members, milkshaw, thehatsrule, cabbagar01, and
    many others who over several years have continually helped make this project a
    success.


    I would also like to express my thanks to Joe Rabinsy for reading my initial manuscripts
    and offering suggestions for improvements.


    —Robert Shingledecker


    I am very in debt to my wife, Jennifer Lew-Andrews, who has acted like an unpaid
    editor for everything I’ve written in this book. Robert Shingledecker is largely
    responsible for incorporating the advanced functionality into DSL that has made
    it so popular today.


    The DSL community also needs to be acknowledged. Much of the reforms and improvements
    in DSL are direct results of the feedback and hacks posted in the DSL forums by
    our knowledgeable users. I’d like to thank Melodie and Antonina'
