  md: '![](img/af53325d7f38f1cdafca9f44568e4ab8_205_0.png)


    After the files have been copied over, the script asks if you want to install
    a boot loader. If your computer is going to be dedicated to DSL without having
    multiboot options (which is what most of you should be doing if you are using
