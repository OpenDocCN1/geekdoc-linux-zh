- pgno: 333
  md: '# Setting Up an XAMPP

    Web Server in DSL


    Serving up content for most common web servers doesn’t require a very powerful
    computer. With Damn Small Linux’s (DSL’s) small size and some prepackaged web
    server software, it’s possible to configure a powerful web server on a machine
    with as little as 64MB of RAM and about 120MB of disk space.


    XAMPP is a neat little project that combines a powerful selection of open source
    software that can be used to create a professional-quality web service on most
    popular operating systems. The popular combination of Web server software often
    referred to as LAMPP (Linux, Apache, MySQL, PHP, and Perl) has the “L” here replaced
    by an “X” to indicate that instead of just Linux, the project can run on OS X,
    Solaris, and all 32-bit Windows systems.


    XAMPP for Linux (www.apachefriends.org/en/xamp-linux.html) can be dropped into
    most Linux systems, including Damn Small Linux, and quickly configured to serve
    up your web content. XAMPP includes the following software:


    +   - **Apache**—Serves the web content

    +   - **MySQL**—Database software for organizing and storing data

    +   - **PHP and PEAR**—Scripting language support

    +   - **Perl**—Scripting language support

    +   - **ProFTPD**—FTP service for uploading content to the server

    +   - **OpenSSL**—To support encrypted communications with the server

    +   - **Webalizer**—Software for reporting activity (hits, pages viewed, and so
    on) of the server


    XAMPP also includes many smaller components, such as fonts, server modules, and
    libraries. All-in-all, there is a lot of software packed into a 50MB tarball.'
  merge: -1
  img_proc: true
- pgno: 334
  md: 'The project described in this chapter starts with a basic DSL installation,
    then adds XAMPP and firewall software to create an easy-to-use web server that,
    because of its size and efficient resource uses, can work on PCs with even very
    limited resources. Because XAMPP is delivered in a state that''s basically ready
    to run, it''s possible to have the server up and running (and permanently saved)
    in less than an hour, using the instructions in this chapter.


    After you have gathered all the pieces for your web server, you can save them
    permanently in many different ways (to hard disk, a remastered CD, and so on).
    This procedure should work well on almost any old PC you have lying around. When
    the procedure is finished, you will have saved a working web server, web content,
    and DSL operating system so that it is ready to run from your hard disk or a USB
    pen drive you can carry with you.


    # INSTALLING XAMPP


    Although there is no special MyDSL package for XAMPP, here is a case where you
    can download the software directly from the open source project and drop it into
    Damn Small Linux. XAMPP works particularly well for DSL in this way because it
    can be unpacked and used entirely from the /opt directory. Here''s how to get
    and install XAMPP:


    +   1. Visit XAMPP for Linux—From the XAMPP for Linux page, you can download the
    entire XAMPP software tarball. The page is located here:


    ```

    http://www.apachefriends.org/en/xampp-linux.html

    ```


    +   2. Select to download XAMPP—In most cases, select the first package listed
    for download: XAMPP Linux. For this example, the version was 1.6. If you already
    have XAMPP installed, you can select the Upgrade package. There is also a development
    package, in case you want to compile the software yourself. Next, you are asked
    what to do with the following package name:


    ```

    xampp-linux-1.6.tar.gz

    ```


    > NOTE

    > Depending on the type of storage medium you want to use (hard disk USB pendrive,
    etc.), available RAM, and other factors, you may want to choose different ways
    of storing and restoring your XAMPP software. The “Saving Your XAMPP Server” section
    later in this chapter describes different ways you can save and restore your XAMPP
    server with DSL.'
  merge: -1
  img_proc: true
- pgno: 335
  md: '+   3. Save XAMPP package—Select to save the XAMPP package to disk. The tarball
    is downloaded to the /home/ds1 directory. (If you don''t have enough space available
    in /home/ds1, you might have to save the XAMPP package to your hard disk or pendrive.)


    +   4. Extract the XAMPP software—Open a Terminal window (right-click the desktop
    and select XShells, Root Access, Transparent). Then, to extract the files to the
    /opt directory, type:


    ```

    # tar xvfz /home/ds1/xampp-linux-1.6.tar.gz -C /opt

    ```


    The exact version of the xampp-linux package you use may be different by the time
    you read this. This command copies all the XAMPP files you need to the /opt directory.


    Before continuing, check to see if an upgrade of your XAMPP package is also available
    from the XAMPP site. If so, you should be sure to install the upgrade as well,
    because it might well include some important security patch you need to secure
    your XAMPP server.


    # WARNING


    It''s important to run the tar command just shown below as the root user and not
    simply run the sudo command to untar the files. If you use sudo, the DSL user
    will own all XAMPP files and the server will not work.


    # Check That XAMPP Is Working


    Because XAMPP is configured, by default, for ease-of-use, you can start up all
    the XAMPP components immediately with a single command. Then, there are several
    steps you can take to make sure that it is working:


    +   1. Start XAMPP—While still logged in as the root user from a Terminal window,
    type the following:


    ```

    # /opt/lampp/lampp start

    Starting XAMPP for Linux 1.6...

    XAMPP: Starting Apache with SSL (and PHP5)...

    XAMPP: Starting MySQL...

    XAMPP: Starting ProFTPD...

    XAMPP for Linux started.

    ```'
  merge: -1
  img_proc: true
- pgno: 336
  md: 'started. At this point, the features are running to serve web pages, store
    data, and access the server (via FTP) to upload and download content over the
    network.


    +   2. View web page—To check that the XAMPP web server is working, open a web
    browser and request a web page from the local host. For example, open Firefox
    from the DSL desktop and type in the address http://localhost. If you see an XAMPP
    splash page, select your language (in this example, English) and you should see
    the page shown in Figure 16-1.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_336_0.png)


    As the message says, you have successfully installed XAMPP on your system.


    +   3. Check status—Using selections in your left column, you can now check out
    how your server is running. Select Status. You can see the status of services
    on your XAMPP server as shown in Figure 16-2.


    As you can see, all the major features are running in Figure 16-2. Click the FAQ
    link for information on turning on certain PHP extensions.


    If any of the major components aren’t running, try restarting the XAMPP server
    as root (/opt/lampp/lampp restart). If you find that you are still not able to
    start your XAMPP server, refer to the XAMPP forum for help in troubleshooting
    the problem (www.apachefriends.org/f/?language=english).'
  merge: -1
  img_proc: true
- pgno: 337
  md: '![](img/af53325d7f38f1cdafca9f44568e4ab8_337_0.png)


    # FIGURE 16-2 Check that MySQL, PHP, Perl, CGI, and SSI are running.


    # 4. Play demos—Select from the following demos in the left column:


    +   - **CD Collection**—Add CD names, titles, and years. Then, display those titles
    on a list or as a PDF document.

    +   - **Biorhythm**—Display your biorhythms based on your birthday.

    +   - **Guest Book**—Enter name, email, and text for this simple guestbook.

    +   - **Instant Art**—Type a phrase and click OK to have the words appear as calligraphy
    on the page.

    +   - **Flash Art**—Same as the Instant Art, except that the calligraphy lines
    spin around. (A Flash plug-in is required by your browser to view the Flash Art
    text. Click the download link that appears to download the plug-in.)

    +   - **phpinfo**—Show the phpinfo.php page, which displays information about
    how PHP is configured for your XAMPP server.

    +   - **Phone Book**—A simple phone book application, where you enter a last name,
    first name, and phone number for people you want to appear in the phone listing.


    # 5. Check over network—Although XAMPP is not really ready yet to be shared over
    the Internet, you might want to check that you can access your XAMPP server from
    another computer on your local area network. The easiest way to do that is to
    determine your computer’s IP address and try to'
  merge: -1
  img_proc: true
- pgno: 338
  md: 'access the XAMPP server at that address from another computer on your LAN.
    To do that, type the following from your XAMPP server system:


    ```

    # /sbin/ifconfig | grep inet

    inet addr:10.0.0.100 Bcast:10.0.0.255 Mask:255.255.255.0

    inet addr:127.0.0.1 Mask:255.0.0.0

    ```


    In this example, the address 10.0.0.100 is the one you want. The other one (127.0.0.1)
    is your computer''s loopback address. Going to another computer on your LAN, type
    in the IP address of the computer containing your XAMPP server into a web browser''s
    location box. For example,


    ```

    http://10.0.0.100

    ```


    You should see the XAMPP splash page from the remote browser. You can then browse
    any content that interests you on the XAMPP server.


    If the steps you just completed were successful, the components of your XAMPP
    server (Apache, MySQL, and PHP) are up and running and accessible to your LAN.
    The next step, before adding and sharing your content with the world, is to secure
    your server.


    # Securing Your XAMPP Server


    To make the default XAMPP server easy to start up, access to the server is wide
    open. Also, because Damn Small Linux itself is designed as a minimal desktop system,
    it doesn''t include firewall software. These security issues might not be such
    a big deal if you use XAMPP as a temporary server behind a firewall—for example,
    in a classroom. If you plan to expose your server to the Internet, however, you
    will surely want to lock down the security a little tighter.


    Luckily, XAMPP has some nice tools available for checking and tightening up the
    security of your system. As for a firewall, there is a MyDSL package you can install
    to lock down outside entry to your newly configured Damn Small Linux server.


    # Understanding General Security Issues


    Before getting into some specifics for securing your XAMPP server in DSL, you
    should be aware of some general security issues.


    Securing a public Internet server that is exposed to the Internet 24x7 is not
    something you should do without some forethought. A vulnerable web server is a
    valuable asset for an intruder who wants to host all kinds of evil content. The
    level'
  merge: -1
  img_proc: true
- pgno: 339
  md: 'of security described in this chapter may be enough for a server behind a firewall
    or used in temporary situations. However, to use this server in more permanent
    and public situations, you should do more study.


    Documentation is available for securing each of the services included with your
    XAMPP server software. I recommend that, along with the suggestions in this chapter,
    you refer to some of the following security pages for further suggestions on securing
    your XAMPP server:


    +   - **Apache Security**

    +     (http://apache.org/docs/2.0/misc/security_tips.html)—Contains warnings related
    to maintaining an Apache server, as well as the risks of enabling various services.


    +   - **PHP Security** (www.php.net/manual/en/security.php)—Both coding and configuration
    information for securing the PHP content of your XAMPP server are contained in
    the Security section of the PHP manual.


    +   - **MySQL Security**

    +     (http://dev.mysql.com/doc/refman/4.1/en/security.html)—Ways of securing
    your MySQL databases are described in the Security section of the MySQL manual.


    There are also organizations that provide information for helping you secure your
    web server. The World Wide Web consortium Security FAQ (www.w3.org/Security/Faq/)
    contains facts about web security and different types of attacks. The Linux Security
    HOWTO (http://tldp.org/HOWTO/Security-HOWTO/) contains both general information
    on securing Linux and information specific to securing network services.


    # Checking Basic XAMPP Security


    Some nice tools for checking and correcting potential security weaknesses in XAMPP
    are included with the XAMPP software. Again, start by pointing your web browser
    to the XAMPP server, then select Security (http://localhost/xampp/security.php).
    The XAMPP security page appears, as shown in Figure 16-3.'
  merge: -1
  img_proc: true
- pgno: 340
  md: '![](img/af53325d7f38f1cdafca9f44568e4ab8_340_0.png)


    # FIGURE 16-3 Check the security of your XAMPP server.


    Before you begin more refined configuration of your XAMPP server, you can deal
    with these issues using tools provided with XAMPP. Start by running the following
    command (as root user from a Terminal window):


    ```

    # /opt/lampp/lampp security

    XAMPP: Quick security check...

    XAMPP: Your XAMPP pages are NOT secured by a password.

    XAMPP: Do you want to set a password? [yes] yes

    XAMPP: Password: ********

    XAMPP: Password (again): ********

    XAMPP: Password protection active. Please use ''lampp'' as user name!

    XAMPP: MySQL is accessible via network.

    XAMPP: Normally that''s not recommended. Do you want me to turn it off?

    [yes] yes

    XAMPP: Turned off.

    XAMPP: Stopping MySQL...

    XAMPP: Starting MySQL...

    XAMPP: The MySQL/phpMyAdmin user pma has no password set!!!

    XAMPP: Do you want to set a password? [yes] yes

    XAMPP: Password: ********

    XAMPP: Password (again): ********

    XAMPP: Setting new MySQL pma password.

    ```'
  merge: -1
  img_proc: true
- pgno: 341
  md: '```

    XAMPP: Setting phpMyAdmin''s pma password to the new one.

    XAMPP: MySQL has no root password set!!

    XAMPP: Do you want to set a password? [yes] yes

    XAMPP: Write the password somewhere to make sure you won''t forget it!!!

    XAMPP: Password: ********

    XAMPP: Password (again): ********

    XAMPP: Setting new MySQL root password.

    XAMPP: Change phpMyAdmin''s authentication method.

    XAMPP: The FTP password is still set to ''lampp''.

    XAMPP: Do you want to change the password? [yes] yes

    XAMPP: Password: *****

    XAMPP: Password (again): *****

    XAMPP: Reload ProFTPD...

    XAMPP: Done.

    ```


    By stepping through the xampp security command, you had an opportunity to add
    a password to the following:


    +   - The lampp user (allowing you to access XAMPP web pages from the network).
    For a public server, you may not want to require a password to simply view web
    content from the server.

    +   - The pma user of the MySQL/phpMyAdmin service.

    +   - The root user for the MySQL service.

    +   - The nobody user for the ProFTPD service (that password had been set to lampp).


    You were also able to make MySQL administration inaccessible from the network.
    So, to configure MySQL, you would have to access that service from the DSL machine
    instead of from the network.


    With password protection and access to services set as you would like, the next
    thing you should do is set up a firewall.


    # Setting Up a Firewall


    The rc.firewall package that is available from the MyDSL Extension tool provides
    a mechanism for configuring a firewall on your DSL system. All of the configuration
    you need to do can be done in the rc.firewall script (located in the /etc/init.d
    directory). The RC.firewall Linux Firewall project (http://lfw.sourceforge.net)
    is built on the iptables facility, which is built into the kernel and used for
    most Linux firewalls.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# NOTE


    The rc.firewall script basically adds iptables rules to your DSL system. Because
    the rc.firewall package also includes the iptables facility itself, you can instead
    configure your firewall using the iptables command directly or by grabbing other
    scripts that set up iptables rules. A great place to find such scripts, particularly
    for more complex firewalls, is the LinuxGuruz site (www.linuxguruz.com/iptables).


    # Installing Firewall Software


    To use the rc.firewall package in DSL, you must install both the rc.firewall package
    and gnu-utils package from the MyDSL facility. First, select the MyDSL icon from
    the desktop. After that, select the following:


    +   - **Firewall Package**—Select UNC→ rc.firewall.unc.info. When the rc.firewall.unc.info
    page appears, select Download and download the package to the /tmp directory.


    +   - **GNU Utils Package**—Select UNC→ gnu-utils.unc.info. When the gnu-utils.unc.info
    page appears, select Download and download the package to the /tmp directory.


    Both the rc.firewall and gnu-utils packages are installed automatically after
    the download. Although iptables is immediately enabled, the rc.firewall script
    is not run at installation and no incoming connections are blocked. The next step
    is to configure and run the rc.firewall script.


    # Configuring the rc.firewall Script


    As delivered, the rc.firewall script is configured to block all incoming connections
    to your computer. It''s your job to open access to those ports associated with
    the services you want to allow outside people to use: namely Web and FTP services.


    Because rc.firewall is a shell script, you can edit it using any text editor.
    I''m going to start by making a copy of rc.firewall to the /opt directory, so
    you can run it from there. (Also, if you screw up, you can just make a fresh copy
    of the file.) For example, open a root Terminal window and run this copy command,
    then use the vi command or the Beaver editor and open the file as follows:


    ```

    # cp /etc/init.d/rc.firewall /opt/

    # beaver /opt/rc.firewall

    ```'
  merge: -1
  img_proc: true
- pgno: 343
  md: 'There are many ways you can change your firewall configuration in the rc.firewall
    file. For our purposes, we are only going to open a few ports to allow outside
    access to the web server (port 80) and the FTP server (port 21).


    With the rc.firewall script open, you can open access to the web server and FTP
    server ports by adding those port numbers to the PERMIT="" line. So, for the easiest
    case, edit the permit line so it appears as follows:


    ```

    PERMIT="80 21"

    ```


    The preceding PERMIT line opens access to the standard web service port (80) and
    FTP service port (21). Notice that a space is needed to separate the entries.
    With this line, all network interfaces allow anyone accessing those interfaces
    to request Web and FTP service. Of course, if you protected those services with
    passwords, users also need that username/password information to ultimately view
    the content associated with those services.


    Here are a few different ways that you could configure your PERMIT line to open
    access to your Web and FTP services:


    ```

    PERMIT="80/tcp 21/tcp"

    PERMIT="192.168.0.0/24:80 192.168.0.0/24:21"

    PERMIT="192.168.0.0/24 10.0.0.150"

    ```


    You can use the examples in any of the preceding PERMIT lines to allow access
    to your server. In the first example, tcp is added to each port number, to indicate
    that only TCP protocols can access those services (by default, both TCP and UDP
    are allowed). The next example only allows access to ports 80 and 21 from computers
    on the 192.168.0 network (a good approach if you want to limit access to computers
    on your LAN). The final example allows access to any available port on the 192.168.0
    network, as well as specifically permits access from the host at IP address 10.0.0.50.


    There are many, many other ways to configure firewall services in your rc.firewall
    script. For example, if your web server is also being used as a router between
    your LAN and the Internet (not a terribly secure arrangement, but one that many
    people do), the script lets you set up your firewall for that. Assuming you want
    to allow routing to the Internet (eth0 interface) from computers on your LAN (eth1
    interface), the following line would tell your firewall to allow that:


    ```

    INTERNAL_INTERFACES="eth0"

    ```


    A more secure approach to having your servers and the workstations on your LAN
    exist behind the same Internet connection is to configure what is called a Demilitarized
    Zone (DMZ). With a DMZ configuration, servers are behind one firewall, whereas
    your private LAN (generally your user workstations) is behind'
  merge: -1
  img_proc: true
- pgno: 344
  md: 'another, separate firewall. For more on using rc.firewall to configure a DMZ
    or other more complex arrangements, refer to the Linux Firewall Configuration
    page for this project (http://lfw.sourceforge.net/config.html).


    # Start Up Your Firewall


    With your rc.firewall file edited, you can try out your new firewall configuration
    by running the rc.firewall script manually as follows:


    ```

    # /opt/rc.firewall

    -> Projectfiles.com Linux Firewall version 2.0rc9 running.

    -> Performing sanity checks..... [ PASSED ]

    -> Building firewall.... [ DONE ]

    -> Successfully secured the following addresses: 10.0.0.100

    ```


    There is no indication of errors in the example just shown. Make sure that the
    information is formatted correctly in the rc.firewall file. To view the rules
    that are now set on your firewall, use the iptables command as follows:


    ```

    # /sbin/iptables -L

    Chain INPUT (policy DROP)

    target     prot opt source               destination

    ACCEPT     all  --  anywhere             anywhere             state RELATED,ESTABLISHED

    ACCEPT     tcp  --  anywhere             anywhere             state NEW tcp dpt:www

    ACCEPT     udp  --  anywhere             anywhere             state NEW udp dpt:www

    ACCEPT     tcp  --  anywhere             anywhere             state NEW tcp dpt:ftp

    ACCEPT     udp  --  anywhere             anywhere             state NEW udp dpt:fsp

    ...

    ```


    The partial output of iptables shows what happens for your firewall''s INPUT chain.
    The policy is to drop any incoming connection requests, except in those cases
    where the connection is related to an established connection (presumably started
    by a client behind the firewall). The last four entries, however, show that new
    incoming connections will be established for requests coming in from anywhere
    for tcp and udp www (port 80) connections, as well as tcp and udp ftp and fsp
    (port 21) connections. (The FSP protocol is similar to anonymous FTP and also
    accepts connections on port 21.)


    At this point, you can make sure that you can connect to your XAMPP server by
    logging into a different computer (on your LAN or on the Internet) and trying
    to connect to the server. To check the web service, point your web browser at
    the server''s IP address (such as http://10.0.0.100, as described earlier). Or
    you can connect to the FTP service (for example, ftp://nobody@10.0.0.100 and enter
    the password you created earlier). Presumably, you will use FTP to add content
    to your web server or offer file download service to users.'
  merge: -1
  img_proc: true
- pgno: 345
  md: "# # Configuring Your XAMPP Server\n\nTools for managing your XAMPP server are\
    \ also included with the XAMPP package. As with many Linux services, most services\
    \ in the XAMPP package can be configured using plain text files. However, there\
    \ are also several graphical tools for managing XAMPP from a browser. Another\
    \ part of setting up a server is to give it a static IP address, so those who\
    \ are looking for your web server can find it.\n\n# ## Setting Up Your Network\
    \ Interface\n\nFor a desktop system, getting an arbitrary IP addressed assigned\
    \ to you at boot time (usually by a DHCP service) generally works just fine. However,\
    \ with a web server that you want people to find, you typically want to assign\
    \ a permanent IP address that doesn’t potentially change with each reboot.\n\n\
    If you are creating a web server to use in temporary situations (such as in a\
    \ classroom setting), you can simply have a DHCP server assign your server’s IP\
    \ address. Then, you can tell your customers (or students) what that IP address\
    \ is to let them connect to your server. However, for a more permanent web server,\
    \ you need to assign a static IP address.\n\nTo run a permanent web server out\
    \ of your home or small business, you might want to contact your Internet service\
    \ provider and request a static IP address and purchase a domain name for your\
    \ server. The ISP (or other domain registrar) will charge a yearly fee for securing\
    \ the Internet domain name and probably charge a fee for the static IP address.\n\
    \nWhether you get a static IP address and DNS name from your ISP or simply want\
    \ a private static IP address behind your home or business firewall (which costs\
    \ you nothing), you can use the DSL Netconfig tool to try out your static IP address.\n\
    \nFrom the DSL desktop, select System→ Net Setup→ netcardconfig (assuming you\
    \ are configuring your server for a wired Ethernet connection). Then, do the following\
    \ to configure your static IP address:\n\n+   1. When asked whether to use DHCP\
    \ broadcast, select No. You are asked to enter an IP address for your Ethernet\
    \ interface (probably eth0).\n+   \n+   2. Enter the IP address assigned by your\
    \ ISP or a private IP address and select OK. (If you are using your web server\
    \ only on your LAN, choose a private IP address from the pool of IP addresses\
    \ that is not already in use and not being handed out by a local DHCP server.\
    \ For example, the addresses 192.168.0.1 through 192.168.0.254 are often used\
    \ for private LANs.)"
  merge: -1
  img_proc: true
- pgno: 346
  md: "+   3. Enter the network Mask for your IP address and select OK. Again, you\
    \ should get this number from your ISP. For private IP addresses, a netmask of\
    \ 255.255.255.0 leaves you with 254 potential IP addresses on your LAN.\n+   \n\
    +   4. Enter the broadcast address for your Ethernet interface and select OK.\
    \ For the example just shown, your broadcast address will be assigned to 192.168.0.255\
    \ by default.\n+   \n+   5. Enter the default gateway IP address and press Enter.\
    \ This is the IP address of the router attached to your computer or to your LAN\
    \ that gets you to the Internet.\n+   \n+   6. Enter the IP addresses of the DNS\
    \ servers your system will use to resolve DNS host names into IP address. You\
    \ can also get this information from your ISP.\n+   \n+   7. To check that your\
    \ addresses were set properly, type `/sbin/ifconfig` from a Terminal window. You\
    \ should see the IP address, broadcast, and netmask that you just configured for\
    \ your Ethernet interface (eth0).\n\nThe procedure shown here sets your IP address\
    \ information for the current session, so you can make sure it is working. To\
    \ set your IP address permanently, refer to the “Saving Your XAMPP Server” section\
    \ later in this chapter.\n\n# Editing XAMPP Configuration Files\n\nBecause XAMPP\
    \ keeps everything contained within one directory structure, you can find configuration\
    \ files there as well. The following sections describe files in the `/opt/lampp/etc`\
    \ directory for configuring XAMPP services.\n\n# Editing httpd.conf (Apache Web\
    \ Services)\n\nConfigure your Apache web server settings in this file. If you\
    \ plan to make this a public web server, you can change the ServerName entry from\
    \ localhost to a full DNS name (such as www.example.com) or to an IP address.\n\
    \nIf want to host web content for multiple domain names from the same physical\
    \ server, you can do that by setting up virtual hosts. First, have your domain\
    \ name registrar (or other DNS service provider) configure your domain names to\
    \ point to the IP address of your server. Then, you need to add a NameVirtualHost\
    \ line to httpd.conf, as well as a VirtualHost container for each host name you\
    \ want to be handled by the server. Here is an example:\n\n```\nNameVirtualHost\
    \ *\n<VirtualHost *>\nServerName www.example.com\n```"
  merge: -1
  img_proc: true
- pgno: 347
  md: '```

    DocumentRoot /opt/lampp/htdocs/example-com

    </VirtualHost>


    <VirtualHost *>

    ServerName www.example.net

    DocumentRoot /opt/lampp/htdocs/example-net

    </VirtualHost>

    ```


    In the virtual host examples just shown, all network interfaces on the computer
    listen for incoming HTTP requests for servers named www.example.com and www.example.net.
    You would place Web content for example.com in the /opt/lampp/htdocs/example-com
    directory, with content for example.net going in the /opt/lampp/htdocs/example-net
    directory.


    Check through the httpd.conf file to see if you want to change other features.
    For example, you should check that all the modules you need are loaded. Notice
    that the httpd daemon is run as the nobody user and group. See which files are
    presented when a directory name is requested (index.html, index.html.var, index.php,
    and so on).


    As set in httpd.conf, log files are stored in the /opt/lampp/logs directory. The
    log level and format of those logs are defined in httpd.conf as well. The last
    line in the httpd.conf file sources in the httpd-xampp.conf file, which you can
    check for special settings that are added by the XAMPP project.


    For more information on configuring httpd.conf and other features in Apache 2.2,
    refer to the Apache online documentation: http://httpd.apache.org/docs/2.2.


    # Editing php.ini (PHP Configuration)


    Depending on the type of PHP content you are hosting, you may need to change some
    of the settings in the php.ini file. For example, ASP-style tags (<% %>) are off
    by default as is Year 2000 compliance.


    You may not need to change any of the settings in this file. However, you might
    want to just step through this file to make sure that the settings don’t conflict
    with the type of PHP code included on your website.


    # Editing proftpd.conf (FTP Server Configuration)


    The proftpd.conf file is configured to allow content to be added and removed from
    your FTP site. By default, the nobody username is configured so it can be used
    to log in through the FTP service (using l​​ampp as the password) and upload files
    to populate the content of your web server. You were instructed to change the
    nobody user’s password earlier in this chapter.'
  merge: -1
  img_proc: true
- pgno: 348
  md: 'The DefaultRoot, which is the home directory when the user logs into the FTP
    server, is set to /opt/lampp/htdocs. After the user logs in, that user has the
    right to overwrite any content in the home directory and its subdirectories.


    You can use any FTP client (in Linux, commands such as ftp, ncftp, or gftp are
    often available) to log in to the FTP server and upload content.


    # Configuring XAMPP from Your Browser


    There are a couple of administrative interfaces available from XAMPP for checking
    and changing settings for your XAMPP server. You can open the interfaces from
    a browser on the local system or over the network (if you configure XAMPP to allow
    that):


    +   MySQL Administration (phpMyAdmin)—The phpMyAdmin tool is available with XAMPP
    to administer your MySQL database. From the local system, type http://localhost/phpmyadmin/
    and enter the lampp username and password. (Use the root account later for the
    Web site login.) Figure 16-4 shows an example of the phpMyAdmin page running from
    an XAMPP server in DSL.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_348_0.png)


    From the phpMyAdmin screen, you can immediately see information about the server
    (version information, host name, character set, and so on). From links on this
    page, you can see MySQL system variables and runtime'
  merge: -1
  img_proc: true
- pgno: 349
  md: 'statistics. You can also view and change user privileges and new databases
    of various types. For more information on using phpMyAdmin, select the link to
    the phpMyAdmin documentation.


    +   MySQL Databases (phpSQLiteAdmin)—The phpSQLiteAdmin tool provides another
    option you can use to manage the MySQL databases on your XAMPP server. Select
    phpSQLiteAdmin from the left column on the main XAMPP for Linux screen or type
    http://localhost/phpsqliteadmin/index.php to see the screen shown in Figure 16-5.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_349_0.png)


    FIGURE 16-5 Work with your MySQL databases from the phpSQLiteAdmin screen.


    From phpSQLiteAdmin, you can select the database that interests you from the Database
    Alias box. Then, view information about that database, such as viewing its structure,
    browsing through the data it contains, and querying the database.


    +   Web Usage Statistics (Webalizer)—By selecting Webalizer from the main XAMPP
    page, you can see daily and monthly statistics for the activities on your website.
    You can configure how those statistics are displayed and gathered using settings
    in the /opt/lampp/etc/webalizer.conf file. Figure 16-6 shows an example of the
    data on an XAMPP server that has only been installed a few days.'
  merge: -1
  img_proc: true
- pgno: 350
  md: '![](img/af53325d7f38f1cdafca9f44568e4ab8_350_0.png)


    # FIGURE 16-6 View Webalizer statistics for activity on your XAMPP server.


    Now that you have a handle on your XAMPP server configuration, it''s time to add
    some content.


    # ADDING CONTENT TO YOUR XAMPP SERVER


    As your XAMPP server is configured by default, it expects the web content (HTTP)
    you add to the server to be located in the /opt/lampp/htdocs directory. You can
    start by adding an index page to that directory. When the home page for your website
    is requested (for example, http://localhost or www.example.com), the first page
    encountered in the htdocs directory that carries one of the following names is
    displayed (in the order shown):


    ```

    index.html  index.html.var  index.php  index.php3  index.php4

    ```


    As noted earlier, the ProFTPD FTP server should be available for you to log in
    and upload content. If you are adding multiple virtual hosts, you may want to
    create additional logins to upload content to multiple directories, so that each
    website can'
  merge: -1
  img_proc: true
- pgno: 351
  md: 'separate its contents from the other. Besides that, just get a good book on
    web development and have at it.


    # SAVING YOUR XAMPP SERVER


    Now that you have gone to all the trouble to configure a web server and build
    in all your content, you certainly don''t want to lose it all on your next reboot.
    To save all the good software and settings you just created, we''re going to use
    some of the information you''ve already learned about MyDSL and backups to save
    the bootable web server permanently.


    Because I think it is cool to carry around a whole web server in my pocket, I''m
    going to put together this whole system on a USB flash drive (also called a pen
    drive or thumb drive). Although most of the components in this DSL web server
    should fit in less than 256MB, I''m using a 1GB pen drive to leave room for future
    expansion.


    The following procedure steps you through the process of creating the DSL system
    on the USB flash drive, then saving your XAMPP software, web server content, extra
    software packages, and desktop settings. With the final result, you should be
    able to insert your USB drive into a port on your PC, reboot, and begin serving
    up web content.


    Just because I am a cautious person, I backed up all the key components of my
    DSL XAMPP server before starting the procedure. I did this by opening a partition
    on my hard disk, creating a directory called xamppstuff on it, and copying my
    rc.firewall script, /opt/lampp directory, and MyDSL packages (rcfirewall and gnu-utils)
    to that directory.


    > NOTE

    > Because the USB flash drives are not the best medium for applications that require
    a lot of writing to the drive, it''s probably more effective to place some or
    all of your XAMPP server on a hard drive. See the sidebar, "Other Ways of Storing
    Your Web Server," after this procedure, for some other ways of storing your XAMPP
    server than putting it all on a USB flash drive.


    +   1. Add startup scripts—So far, we''ve run both the XAMPP server and the firewall
    script manually. To have those features run when your saved DSL system boots,
    you can add their start-up scripts to the /opt/bootlocal.sh file. Open the bootlocal.sh
    file using any text editor, and then add the last two lines so the file appears
    as follows:'
  merge: -1
  img_proc: true
- pgno: 352
  md: '```

    #!/bin/bash

    # put other system startup commands here

    /opt/lampp/lampp start

    /opt/rc.firewall

    ```


    If you installed the XAMPP tarball and copied the rc.firewall script as described
    earlier, both those services are now set up to start automatically the next time
    DSL boots.


    If you also want to add a static IP address for your server, instead of getting
    addresses assigned from a DHCP server, you can add commands for that to your bootlocal.sh
    script. For example, you could add the following lines to set your IP address
    for the eth0 interface to 192.168.0.10, set the default router (gateway) to 192.168.0.1,
    and identify your DNS servers as 192.168.0.5 and 192.168.0.6.


    ```

    ifconfig eth0 192.168.0.10

    route add default gw 192.168.0.1

    echo nameserver 192.168.0.5 > /etc/resolv.conf

    echo nameserver 192.168.0.6 >> /etc/resolv.conf

    ```


    Note that the addresses used here are all private IP addresses. If you are configuring
    a public server, you either need to have public IP addresses assigned or use some
    sort of port forwarding from a public IP address to a machine behind a firewall/router.


    # 2. Create DSL on USB flash drive—Insert your USB flash drive, that you are prepared
    to erase and use for your Web server, into your computer''s USB port (don''t mount
    it). Next, from the DSL menu on the desktop, select Apps, Tools, Install to USB
    Pendrive. Then, select either For USB-ZIP Pendrive (if you expect to run the server
    on an older PC) or For USB-HDD Pendrive (to run the server on newer PCs).


    This procedure erases everything on your USB drive! So make sure you''ve removed
    everything you need from the drive. Answer the questions as prompted. (See Chapter
    6, "Running a Native Pen Drive Install," for details on installing DSL to a pen
    drive.)


    # 3. Select files/directories to back up—The files and directories that DSL backs
    up for you need to be listed in the /home/dsl/.filetool.lst file. Several entries
    are already in that file. Open that file using any text editor and add the last
    lines shown here in bold:'
  merge: -1
  img_proc: true
- pgno: 353
  md: "```\nopt/ppp\nopt/bootlocal.sh\nopt/powerdown.sh\nopt/.dslrc\nopt/.mydsl_dir\n\
    opt/lamp/\nopt/rc.firewall\n```\n\n+   4. **Back up files and directories**—To\
    \ back up the files that you just added in your `.filetool.lst` file to your USB\
    \ flash drive, from the desktop select DSLpanel, Backup/Restore. You are prompted\
    \ to enter the device on which you want to back up your files. It’s important\
    \ to get this right.\n+   \n+   For a system that has no other SCSI or SATA drives\
    \ on it, the USB flash drive device will probably be `sda1` (for a USB-HDD drive)\
    \ or `sda2` (for a USB-ZIP drive). After typing in the device name, select Backup.\n\
    +   \n+   The result is a `backup.tar.gz` file in the root of the USB drive device\
    \ you entered.\n\n+   5. **Save MyDSL packages**—Any MyDSL packages that you want\
    \ restored can also be copied on to the USB flash drive. If you just downloaded\
    \ them, they should still be in the `/tmp` directory.\n+   \n+   You will have\
    \ the opportunity to copy your MyDSL packages when you reboot DSL. Or you can\
    \ copy them manually. For example, you could mount the USB flash device, using\
    \ the mounting tool in the lower-right corner of the screen. Then, for example,\
    \ to copy the files needed for this project to a `mydsl` directory on `sda1`,\
    \ you could type the following from a Terminal window:\n\n```\n# cd /tmp\n# mkdir\
    \ /mnt/sda1/mydsl/\n# cp gnu-utils* firewireall* /mnt/sda1/mydsl/\n```\n\nAt this\
    \ point, everything you need should be installed on your USB flash drive. Before\
    \ adding web content, my XAMPP installation required 50MB of space for DSL and\
    \ 61MB of space for XAMPP and the other packages I added. On a 256MB USB flash\
    \ drive, that would leave me more than 140MB for web content or other packages\
    \ I want to add.\n\nWhen you reboot your computer (select Power Down→ Reboot from\
    \ the DSL menu), DSL backs up your settings again and asks if you want to save\
    \ your MyDSL packages."
