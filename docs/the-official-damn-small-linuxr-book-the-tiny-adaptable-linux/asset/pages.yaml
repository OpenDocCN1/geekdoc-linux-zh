  md: 'can learn how to remaster your own DSL image to include any applications or
    data you like (without having to merge extra applications and data at boot time).


    # What Is Damn Small Linux?


    Before heading on any further, we need to define exactly what Damn Small Linux
    is. Damn Small Linux is an operating system, designed to run from live media (such
    as a bootable business card-size CD) that, at its heart, is controlled by a Linux
    kernel. It is based on another Linux live CD called KNOPPIX, which, in turn, was
    created from a Linux distribution called Debian.


    Now, we need to sort all that out.


    # Understanding Operating Systems


    An operating system is computer software that manages the interactions between
    the computer hardware and the applications you run to use that hardware. In the
    proprietary personal computing world, you are probably most familiar with Microsoft
    Windows and Mac OS/X operating systems. In the free and open source software (FOSS)
    world, most operating systems trace their roots back to UNIX.


    Damn Small Linux is one of many FOSS operating systems that carries the Linux
    name because it includes the Linux software that is referred to as the kernel.
    The Linux kernel is the most critical part of the operating system because it
    provides the most basic system services: process management, device driver framework,
    file system support, and other critical system features. As new hardware, file
    system types, and other components are connected to a Linux system, they can be
    added to the kernel in what are called loadable kernel modules.


    Linus Torvalds created the Linux kernel and continues to lead Linux kernel development
    today. This software is available from the Linux Kernel Archives (http://kernel.org).
    Most Linux distributions add a set of basic system utilities from the Free Software
    Foundation GNU project (www.gnu.org), which include many clones of commands that
    were originally available on UNIX systems.


    Although the latest available kernel is the 2.6 kernel, DSL has chosen to stay
    with the 2.4 kernel tree. This is primarily because the 2.6 kernel is considerably
    larger. As security holes are found, however, backports of fixes from the 2.6
    kernel are included with the 2.4 kernel used by DSL. Backports for improvements
    can be added in the same way.'
  merge: -1
  img_proc: true
- pgno: 39
  md: "expect, a MyDSL package called gnu-utils is available to bring those important\
    \ utilities into DSL.)\n\nAlthough the kernel, a command interpreter (called the\
    \ shell), and a few utilities are really all you need to have an operating system,\
    \ most Linux systems include other components as well. For example, the X Window\
    \ System provides the graphical framework for using most Linux systems, including\
    \ DSL. A window manager (such as Fluxbox in DSL) implements menus, icons, and\
    \ other graphical desktop elements.\n\n# Understanding Live CDs\n\nMost computer\
    \ operating systems are installed permanently on a hard disk. A live CD, on the\
    \ other hand, is typically created so that you can safely ignore any software\
    \ installed on a computer’s hard disk and so you can run entirely from the operating\
    \ system contained on the CD. This has some advantages and some disadvantages.\n\
    \nLive CDs have the advantage of letting you put together a known set of software\
    \ and be sure that you can return to that software the next time you reboot. This\
    \ makes a live CD a great medium for demonstrations, portable desktops, or rescue\
    \ media. You can take a whole computer system with you in your pocket that you\
    \ can run from most PCs (provided you are allowed to reboot the PC).\n\nThe downsides\
    \ of live CDs include some of the same features that are their attributes. For\
    \ example, with any system that you use over time, you want to save some data\
    \ and applications. By default, live CDs are run from the read-only CD-ROM medium.\
    \ So, you can’t just save files the same way you would if you were running your\
    \ system from hard disk.\n\nDamn Small Linux has overcome many of the challenges\
    \ of using a desktop system that was designed to be run from a live CD. Some features\
    \ that were already mentioned (and will be described further later in the book)\
    \ let you save files and applications so they are available the next time you\
    \ boot DSL. There are also ways in which you can install DSL to hard disk, so\
    \ it will behave like most installed operating systems.\n\n> **NOTE**\n> \n> Although\
    \ the term live CD is commonly used to describe a computer system image that is\
    \ typically booted and run from a read-only medium, the same type of image can\
    \ be run from other media as well. As you will see from descriptions in this book,\
    \ a live CD can also run from a DVD, USB flash drive, or ZIP drive. Likewise,\
    \ a live CD can be booted from a floppy disk, and then continued from CD, hard\
    \ disk, or other medium."
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Based on Debian and KNOPPIX


    Because a Linux kernel alone doesn''t let you do that much with a computer, most
    Linux distributions draw on the vast landscape of free and open source software.
    Debian GNU/Linux is one of the most popular free operating systems available today.
    KNOPPIX is a live CD Linux distribution that was created from Debian software.
    Technology from both of those projects is incorporated into DSL.


    The Debian distribution (http://debian.org) has literally thousands of software
    packages that have been compiled to run on Debian. Debian packages are stored
    in .deb format and can be downloaded and installed from the Internet using tools
    such as apt-get and dpkg. Many Debian applications can be downloaded and installed
    to DSL using apt-get (available from the dsl-dpkg MyDSL package).


    KNOPPIX (www.knopper.net/knoppix/index-en.html) was the first popular desktop-oriented
    live CD. It included a highly regarded facility for detecting and configuring
    hardware (a must for live CDs). Using compression techniques, it was able to fit
    the equivalent of about 1.5G of software within a standard 700MB CD image. Many
    specialized utilities were included in KNOPPIX to configure some of the trickier
    hardware components, such as wireless cards, printers, and modems.


    Damn Small Linux creator John Andrews began with some of the technology just described.
    Then he began whittling it down and tuning it up.


    # ANSWERS FROM THE DSL DEVELOPERS


    In case you didn''t notice from the cover, this book combines the experiences
    of three writers. John Andrews created Damn Small Linux. Robert Shingledecker
    has developed many of the critical technical innovations of DSL. Christopher Negus
    has authored many Linux books, such as the Red Hat Linux Bible, Linux Toys, and
    Live Linux CDs.


    So in this section, you get to find out first-hand how and why DSL came about.
    Chris asks John and Robert some hard-hitting questions about why they have developed
    DSL, what are its greatest attributes, and where it is going.


    # John, what encouraged you to create DSL?


    John: It was a reaction to the trend of ever increasing size of applications and
    the typical Linux desktop environment. I wanted to see if it were possible to
    build a functional desktop environment that could be compressed into 50MBs.


    One of my original draws to Linux was the fast and light applications that were
    available in the late 90s. By the time I was working on DSL, many of the applications
    I loved seemed to slow down to a crawl on my computer.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'In essence, the typical Linux desktop was pushing me to a hardware upgrade
    the same way Microsoft and Mac operating systems tend to do. I hoped (and still
    do hope) that there would be a resurgence of efficiency in the Linux community
    where people treat code bloat like the cancer it is.


    DSL is also a testament to function over form. We avoid over indulging in eye
    candy. Some core applications that are in DSL have better functionality than their
    later incarnations that are larger in size. To the developers of DSL, it is not
    about the latest or the best looking; it is about functionality and stability.


    I was searching for a light portable environment that I could take with me on
    a business card CD. At the time, the best sub 50MB distribution was LNX-BBC, but
    its orientation is much more toward being a rescue disk. I thought it would be
    possible to work within the same limited space but instead build a distribution
    that focused on having a functional desktop. Being an efficiency fan, I modeled
    DSL after my desktop and used most of the same lightweight applications.


    # Robert, what encouraged you to join DSL development?


    Robert: I have been involved with Linux CD-ROMs since the early 1990s. I created
    install-type CDs to automate the specialized setup of servers and desktops while
    I was working at the City of Garden Grove, California. Later, I worked for a Linux
    startup and created live Linux CD server appliances. We created firewalls, mail
    servers, VPN, LAMP-style systems, several database servers, MySQL, Postgres, and
    even some prototype commercial ones like Raining Data''s D3.


    These live CDs were automated to provide whatever services the customer desired.
    During this development, I had created my own live desktop. Occasionally, I would
    check Distrowatch.com to see if anyone else was doing the desktop approach. I
    always felt that there are far more desktops than servers. Demo Linux and later
    KNOPPIX were far too slow to be practical for everyday use at that time. When
    I found John''s Damn Small Linux, I liked what I saw and began to explore ways
    to expand its capabilities.


    # What were the first goals of Damn Small Linux and have they changed?


    John: The first goal of DSL was to have a functional and efficient Linux desktop
    distribution that was under 50MB, small enough to fit on a business card-size
    CD. Over the years, business card CDs became a lot less relevant as affordable
    USB pen drives have started coming into the market. Yet, we have maintained the
    50MB upper limit, which has forced us to think in unconventional ways and innovate
    instead of just adding applications.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '**Robert:** I certainly have not had a roadmap. Things just progressed in an
    evolutionary way: from adding a flexible backup/restore system to needing a write-enabled
    `/opt` directory to add more programs. Later, we created self-contained compressed
    mountable applications, originally called `.ci` extensions, later named UCI. My
    goal was to honor John’s original goal of keeping the distribution at or under
    50MB.


    Many would remaster DSL only to add or change an application. So, my thoughts
    were focused on how to allow easy yet flexible additional applications to be added
    to DSL. These additional applications I called MyDSL extensions. Originally, they
    were tarballs and UCI. They would either load into the RAM disk under `/opt` or
    mount under `/opt`. Some of the user community really wanted to use Debian on
    the live DSL CD. This led to a script to make much of the filesystem write-enabled,
    which led to the `.dsl` extension type. This is basically a tarball, but the unique
    extension type would trigger the script to set up all the symlinks needed.


    Recently, I added the capability to use mountable compressed overlay images. These
    new overlay mounts do not need to be self-contained, yet they have the same advantage
    in low system resource use as the UCI. I try to keep DSL updated with newer technology,
    while at the same time, keeping the distribution under 50MB and also acknowledging
    and fully supporting the smaller, older, less capable hardware.


    We are constantly looking for the best of breed, *small is beautiful* applications
    and utilities—for example, Lua. We heavily use Lua and Lua Fltk and create many
    of our own GUIs. We are not only a small distro; we run well on small resources.


    # What draws people to DSL?


    **John:** DSL bucks the trend of ever-increasing bloat and the ever-increasing
    demands on hardware. People who use DSL are not into eye candy for eye candy’s
    sake. They want their computer to work and be reliable. The fact that DSL runs
    from an ISO image and is inherently durable also makes it appealing, DSL is very
    hard to break and easy to fix. Of course, there is the modularity and portability
    aspects, too.


    If you want an application, you can just grab it. If you want to take your desktop
    on the road, it is very easy to do via USB pen drive, or live CD and remote backups.
    DSL’s small but functional base also makes a great platform to build on for custom
    applications. DSL is a Linux desktop without the 500 pounds of Styrofoam padding.


    **Robert:** DSL is a small distribution and one that runs very well on very small
    resources. It is extremely flexible in offering many choices of configuration
    and expandability. After you read the chapters that follow, you will begin to
    realize the potential.'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'The DSL project welcomes the user community. The MyDSL extensions only represent
    the framework. The actual extensions are requested, discussed, and created by
    the community of DSL users. This active community shares in the ownership of these
    seamless extensions.


    # What is the most interesting hardware known to running DSL?


    Robert: What comes to my mind is the original ThinkNic Internet Appliance, which
    is a CD-based machine with a 4MB ramdisk (to save configuration), a Winmodem,
    and an Ethernet port. We fully support this “first of breed” Linux appliance.


    John: For me, the most interesting hardware to run DSL has not been applied yet—there
    are so many possibilities. I personally work on a homemade laptop based on a eBox
    III thin client and a cheap 8-inch LCD monitor. I’d like to be able to hook it
    up to a small solar panel. It will have to run an IDE flash Disk On Module (dom);
    it will be passively cooled and 100% silent.


    # Why is DSL good for hobbyists?


    John: Oh, there is just so much you could do with DSL. It is small, it requires
    very little RAM, it can run on ancient hardware, and it can run without a hard
    drive. DSL can run in RAM with as little as 128MB. It could run with as little
    as 16MB of RAM with a conventional hard drive install. With DSL, you can take
    junk and make it into workable hardware.


    DSL is also easy to modify, and upgrade. We have an extension system that allows
    DSL to morph in any direction a developer could want without the need to do a
    custom remastering. We make heavy use of scripting languages. So if you want to
    get into the meat of what makes DSL DSL, all you have to do is dig around.


    Robert: The fun of tinkering with that old hardware you found in the closet. Now
    you have a neat small web server, a picture frame, or a car MP3 player. Your creativity
    is set free to explore and share with a community of DSL users. You can create
    and share MyDSL extensions or learn to code with Bash, Perl, C, Lua, Lua/FlTk.
    It’s all in there.


    DSL includes lots of hardware support. So, you can build a web surfing appliance
    for Grandma. Or perhaps buy or obtain old “throw-away” laptops. We support many
    of them. Or even buy an embedded device and use DSL as the embedded OS. We are
    like Tinker toys for Linux: a Linux construction kit. It’s all about having fun!


    # What are the challenges to someone who comes to DSL from MS Windows?


    John: In the modern MS desktop, you are prevented from looking under the hood.
    In DSL, there is no hood at all—you are free to dig as deep as you want to. There'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'are no restrictions, and you will want to learn a little about the way DSL
    works to get the most out of it.


    Robert: All the decisions are NOT forced on you. If tinker toys or a construction
    kit are not fun for you, the basic desktop is still fully functional when you
    start out. However, with so many choices and options available for extending DSL,
    it can be overwhelming to a new user. But they will soon want to explore.


    Even the community of DSL users does not agree on a single installation or run-time
    environment for DSL. We often have “Tastes Great! Less Filling!” types of forum
    debates.


    Also, DSL is Linux, and therefore we respect the UNIX file permissions. Some users
    are used to running everything as the superuser. We do not. Some expect every
    new device to be instantly supported, which is not possible given our constraints
    of size and development. Usually, answers and solutions can be had within the
    resources of the community.


    # What future plans do you have for DSL?


    John: Tough calls lay in our future. The truth is, very few in the Linux applications
    development community sees the future of Linux the same way we do. This puts us
    in a bind. Many of the lean projects are getting abandoned and replaced with other
    projects that have an enormous amount of package dependency.


    Our old friend GTK1.2 is being left behind by most currently developed projects.
    Other light graphical tool kits are slow in development or even stalled for years
    at a time. There are a few nuggets of hope out there, and I will never give up
    on the pursuit of a tiny and functional desktop. I hope that projects like DSL
    encourage developers of lean applications to continue their work.


    In the shorter run, you will likely see a smaller and a larger DSL cousin, as
    well as more framework for those who want to build custom applications based on
    the DSL infrastructure.


    Robert: I would like to see more modularization of DSL. Offer even more choices
    to the community. Our process is not formal. It is evolutionary based on our own
    interests and those expressed by the community of DSL users. And it must be fun
    and interesting for me and John too!


    # THE DAMN SMALL LINUX COMMUNITY


    Damn Small Linux has a thriving, active community of contributors and users. Although
    Robert and John direct the activities of the central 50MB DSL distribution, the
    framework for MyDSL extensions offer the opportunity for anyone to extend the
    functionality of DSL for themselves and others. To grow the knowledge'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'base of DSL, there are several communications venues available. And, of course,
    financial contributions are welcome for helping the project grow.


    Communications opportunities for the DSL project include forums, a wiki, and a
    place to blog about DSL. Here’s where you can find out more about those opportunities:


    +   - **DSL forums** (www.damnsmalllinux.org/cgi-bin/forums/ikonboard.cgi) — In
    the forums, you can find information on more than 30 topics relating to DSL. Popular
    topics include hard drive installs, DSL ideas and suggestions, and networking
    issues.

    +   - **DSL wiki** (www.damnsmalllinux.org/wiki) — The DSL wiki brings together
    a lot of information related to the DSL project. From the wiki, you can find answers
    to frequently asked questions, learn about installation and boot options, and
    read about common issues that DSL users encounter.

    +   - **DSL IRC** (irc://irc.freenote.net/damnsmalllinux) — Participate in real-time,
    online chats with other DSL users.

    +   - **DSL blog** (www.damnsmalllinux.org/talk) — At the DSL blog, you can feel
    free to present your musings and personal experiences that relate to Damn Small
    Linux.


    Because DSL is freely distributed, development is funded through contributions
    and through purchases from the DSL store. Contributing to DSL in one of these
    ways can do a lot to further development of Damn Small Linux. Here are suggestions
    for contributing:


    +   - **DSL donations** (www.damnsmalllinux.org/donate.html) — If you enjoy DSL
    and can afford to contribute, monthly subscriptions of $1, $2, $5, and $10 contributions
    can be made from this page. You can also make one-time donations via PayPal or
    credit card.

    +   - **DSL store** (www.damnsmalllinux.org/store) — At the DSL store, you can
    purchase a variety of mini-ITX computer supplies. This is also the place to buy
    a DSL CD or DSL on a bootable USB pen drive (currently, 1GB models are offered).
    One of the great features of the bootable USB drive is that it includes the QEMU
    version of DSL that can be booted and run on a Windows desktop.


    Before I became associated with John and Robert to write this book, I purchased
    a DSL USB pen drive from the DSL store. I still use that drive today to show people
    DSL. I can plug the USB drive into a running Windows system, select one file from
    that drive, and in a few moments give a demonstration of Damn Small Linux within
    a window on the Windows desktop.'
