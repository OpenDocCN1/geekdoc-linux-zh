- pgno: 82
  md: 'version of XMMS in DSL is capable of playing Audio Streams, MP3s, Ogg Vorbis,
    CD Music/Audio, wave files, and MPEG video files.


    Please note that the preceding mentions file types! The version of XMMS in DSL
    is capable of playing not just music files but also MPEG video and music CDs,
    which makes it a robust media player.


    The XMMS home page is www.xmms.org. Figure 3-8 shows an example of the XMMS player.


    # FIGURE 3-8 Play a variety of music and other audio files in the XMMS player.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_82_0.png)


    # Xpaint —A Simple Image Manipulation and Painting Program


    Xpaint has some advanced features and can manipulate multiple images at the same
    time. Although Xpaint is not as advanced as The Gimp, it does work well for simple
    image editing. For instance, we used it to take snapshots of our DSL release.


    The Xpaint home page is http://sf-xpaint.sourceforge.net/.


    # xTris —A Multiplayer Version of Tetris for the X Window System


    Xtris is a single- or multi-player version of the classic Tetris game. It is a
    true server/client application so one can connect to remote hosts and compete
    with other players via a local LAN or the Internet. If no other player is available,
    you can play one bot or several of them to increase the difficulty.


    Refer to the following page for more information on the xTris game:


    http://www.ibiblio.org/pub/X11/contrib/games/xtris.README


    # ZXGV—A Thumbnail-Based Image Viewer


    ZXGV is a fast and functional image viewer. It can rotate and resize images for
    viewing. One nice feature is that it can zoom images to fit the window


    The ZXGV home page is http://rus.members.beeb.net/zxgv.html.


    # Xzoom Screen Magnification Application


    This is a nice application for people who are visually impaired or just need to
    take a closer look at something on the desktop. For further information, refer
    to the Xzoom man page at http://huygens.ca.infn.it/cgi-bin/man/man2html?xzoom+1.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Terminal-Based Applications


    Damn Small Linux also has many terminal-based programs. Many new Linux users are
    intimidated by text-based applications, but many find that some things are just
    easier to do in a terminal window. If you are new to Linux, do yourself a favor
    and give these applications a try. You may just realize that their simplicity
    is enjoyable.


    # ftp—A Basic Terminal-Based FTP Program


    The ftp utility is really very easy to use. Many of the navigation and observation
    commands are the same as regular term functions. For instance, type ls to get
    a list of files available in a directory or pwd to get your current working environment.
    If you get stuck, just type help for a list of commands. And if you need to find
    out what a command is, just type help command (replacing command with the command
    name you are interested in).


    # index—Personal Database Management System


    Index is a minimal database management system. The author intended Index to be
    used by those who want to maintain databases of their own personal information.
    Index is easy to set up and use. Start it by simply typing the index command.


    By default, Index begins with four empty databases available. There is a business
    phone database (bphone), a database for saving your CD collection (cdlist), a
    database of CDs that you want (cdwantlist), and a personal phone database (pphone).


    Type the name of the database you want to use. You can then use Index to add entries
    (a), find entries in the database (f), and read the database one entry at a time
    (r). When you are done, type s to save modifications, q to save and exit, or x
    to exit.


    # CDW CD Burning Application


    CDW is a more friendly way to use cdrecord and mkisofs with its ncurses-based
    GUI. Although it easy to use after you are familiar with the commands, a user
    of CDW should reference the README to learn all the key functions. To start CDW,
    type the cdw command.


    Figure 3-9 shows an example of the CDW screen. We have the main README page available
    at http://damnsmalllinux.org/docs/cdw_README.txt.


    # Microcom Serial Terminal Emulator


    Microcom is a Minicom-like serial emulator with scripting support. Microcom is
    really tiny (14k) because it was written to fit into floppy-based Linux distributions.
    You can start Microcom by typing the microcom command. Find more information about
    Microcom from its home page:


    http://microcom.port5.com'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# FIGURE 3-9 Copy and burn CDs using the CDW screen.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_84_0.png)


    # Midnight Commander File Manager


    Midnight Commander (or mc for short) is a very powerful and popular text-mode
    file manager. Because mc can be used both locally and remotely, it is a favorite
    among Linux enthusiasts. Old DOS hacks who remember Norton Commander will find
    MC very comfortable with its two-panel layout.


    Figure 3-10 shows an example of the Midnight Commander screen. Refer here for
    the Midnight Commander information page: www.ibiblio.org/mc.


    # FIGURE 3-10 Manage files in text mode with Midnight Commander.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_84_1.png)


    # Naim—A Console AIM, ICQ, IRC, and Lily CMC Client


    Naim is a user-friendly text-based instant messaging and IRC client. You can start
    it from the desktop (select Apps, Net, AIM/IRC/ICQ, AIM) or from the command line
    (type the naim command). We have the IRC command in our Fluxbox menu that lets
    you plug right in to the DSL IRC channel. So, select Apps, Net, AIM/IRC/ICQ, nIRC
    #DamnSmallLinux if you have a quick question.


    For a quick start of Naim, check out http://naim.n.ml.org/quickstart.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Nano—A Simple Terminal-Based Text Editor


    Nano is a GNU clone of the well-known Pico editor, though with some improvements
    that make it more friendly for coding. Improvements include regular expression
    search-and-replace and auto-indent. Like Pico, Nano is exceptionally easy to use.


    Nano’s home page is located at www.nano-editor.org.


    # Netrik—A Minimal Text Browser


    According to the authors, “Netrik is the ANTRIK Internet Viewer/Browser/Explorer/Navigator/whatever.”
    Netrik is critical for our net-man and web-dictionary applications. We needed
    something that could render HTML, yet be small enough to not push out other applications.
    Netrik proved to be perfect for the job. What amazes us at DSL is that Netrik
    is only 79.3Kbytes in size.


    Visit the Netrik home page at http://netrik.sourceforge.net/.


    # smbclient—A Command-Line Client to Windows File Sharing


    smbclient allows you to connect to a Microsoft Windows share network with FTP-like
    interactions.


    For information on smbclient, refer to its man page at:


    http://samba.org/samba/docs/man/manpages-3/smbclient.1.html


    # SQLite—A Small, Self-Contained SQL Relational Database Management System


    SQLite is small, stable, embeddable, and fast. SQL comes with a standalone command-line
    program that can be incorporated into Bash or Perl scripts in DSL. We also have
    Lua bindings for SQLite via murgaLua.


    We have a personal information manager written in Perl, which relies on SQLite
    for the back-end database management.


    Refer to the SQLite home page for more information: www.sqlite.org.


    # Vi(m)—An Advanced Terminal-Based Text Editor


    Many people claim that using Vim is the most efficient way of editing documents.
    True, the advanced features of Vim take time to master, but after you commit them
    to memory, so much editing power is at your fingertips, you need not take your
    fingers off the keyboard.


    The basic commands for Vim are really not that complicated. To see a good list
    of the basic commands, reference this URL: http://www.selectorweb.com/vi.html.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# Lua Applications


    The developers of DSL are big fans of the programming language Lua (http://lua.org).
    We are currently using a build of Lua that has bindings to the Fast Light Tool
    Kit (FLTK), SQLite bindings, and networking capabilities.


    This build of Lua was developed by John Murga and is aptly named murgaLua after
    the author. We take advantage of the GUI bindings to develop many tools, desktop
    utilities, and front ends for command-line applications, such as the DSL Control
    Panel and the MyDSL Manager.


    Figure 3-11 shows a sample of tools that rely on murgaLua. Information about murgaLua
    may be found here: www.murga.org/devPages/murgaLua/index.html.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_86_0.png)


    **FIGURE 3-11** DSL tools relying on murgaLua include dMix, MSDoc, Calendar, and
    Mount.lua.


    Here is a short list of some of the tools found in DSL that rely on murgaLua.


    # MS Word Viewer


    This is a front end for the command line antiword Microsoft word viewer. With
    this application, you can select the .doc to view and pick whether you want to
    view the document as a PDF or PostScript.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# Calendar


    This clever program, built on murgaLua and PSeal, can keep you organized. Calendar
    does a very nice job of formatting schedules, which get displayed in an easy-to-read
    calendar format.


    # dMix


    dMix is a GUI front end for the sound volume control umix. dMix is very simple
    to use and allows one to control the left and right side volume controls independently
    or sync them up for quick volume control.


    # Mount.lua


    This is a click to mount and unmount storage devices (floppy, CD-ROM, and disk
    partitions) in this GUI tool.


    # Docked


    The docked tool is used with Fluxbox, which incorporates much of the utility of
    dMix and Mount.lua.


    # Daemon Applications


    A daemon is a program that runs in the background waiting to be used upon request.
    Often daemons are perform specific functions like remote connections, or printing.


    Damn Small Linux is equipped with four daemons to help interact with the outside
    world. They are Open Secure Shell, NFS, BetaFTP, and the Monkey Web Server. Please
    note that all these daemon services are off by default and you need to enable
    them. Services may be controlled via the DSL control panel or the Fluxbox menu
    in the System, Daemons submenu. Also note that you have to set up a user password
    to remotely log in to a Damn Small Linux computer via either Secure Shell or FTP
    protocol.


    # Open Secure Shell


    Although it is standard on most distributions, many are surprised to learn that
    Damn Small Linux is equipped with an OpenSSH secure shell daemon. This makes it
    possible to securely access a remote computer running Damn Small Linux by logging
    in as user ds1 or root. Using scp (a command-line utility to remotely transfer
    files between computers), it is also possible to securely transfer files into
    or out of Damn Small Linux remotely. Damn Small Linux has both the server and
    the client'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'tools to do remote shelling and SCPing files around. Also, Damn Small Linux
    is equipped with a very handy utility, which allows one to remotely mount a file
    system via SSHD; the utility is called SSHFS, and we are big fans of it!


    For information on OpenSSH, visit the manual page at www.openssh.com/manual1.html.


    For more information on the SSH Filesystem, visit http://fuse.sourceforge.net/sshfs.html.


    # BetaFTPD


    BetaFTPD is an incredibly small (27K) single-threaded FTP server. Its small size
    made it a natural for Damn Small Linux, and its author, Steinar H. Gunderson,
    believes that being single threaded makes it more secure while also being easy
    on RAM. Yet, mainly include BetaFTP easy cross-platform file sharing when one
    does not have access to an SCP client.


    For more information on BetaFTPD, go to http://betaftpd.sourceforge.net/.


    # Network File System


    As the name implies, network file system (NFS) is a system that allows one to
    share files across a network by remotely mounting disk partitions. It is similar
    in concept to the Windows file sharing system. Damn Small Linux has NFS-Common,
    which provides a tool set that allows you to use the NFS protocol.


    Developer''s note: In many ways, using SSHFS with Secure Shell can be used as
    an alternative to NFS. Many find it easier to use and more secure.


    You can find an NFS howto page at http://nfs.sourceforge.net/nfs-howto/ar01s02.html.


    # Monkey Web Server


    Monkey Web Server is a simple and small web server, yet it is easy to configure
    and supports server side scripting. We include a get started page for Monkey as
    the default home page for localhost. To see it, just access the control panel
    and click the Monkey Web button, then point your web browser to http://localhost.
    The server files are located at /opt/monkey/ if you want to customize your setup.


    The Monkey Web Server website can be found at http://monkeyd.sourceforge.net/.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# SUMMARY


    There you have it: an overview of our primary window manager, basic desktop functionalities,
    and the core of our applications. There is still more to learn about DSL, but
    hopefully this chapter is enough to get you exploring. One thing to keep in mind:
    You cannot break DSL when running from a CD. So, don’t be afraid to explore, have
    fun, and get some dirt under your nails.'
