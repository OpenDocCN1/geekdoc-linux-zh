- pgno: 354
  md: "# OTHER WAYS OF STORING YOUR WEB SERVER\n\nAlthough having a complete DSL web\
    \ server on a USB flash drive is fun, a more practical, permanent solution is\
    \ to put some, or all, of the project on hard disk. Using the procedure just shown\
    \ as your guide, here are ideas for changing that procedure to store your server\
    \ in different ways:\n\n+   - **Save MyDSL packages to hard disk**—Instead of\
    \ downloading the MyDSL packages to /tmp, then copying them to storage, you can\
    \ directly download the pages to the permanent storage. For example, use the desktop\
    \ mount tool to mount a hard disk partition (such as hda1 for your first IDE hard\
    \ disk partition). Then, create a myds1 directory on the device (mkdir /mnt/hda1/myds1).\
    \ When asked where to download the package, type /mnt/hda1/myds1.\n+   \n+   Later,\
    \ when you reboot, DSL should automatically find and restore the packages in the\
    \ /mnt/hda1/myds1 directory. To specifically identify that directory from the\
    \ boot prompt (in case you have MyDSL packages in multiple places), use the myds1=/mnt/hda1/myds1\
    \ option at the boot prompt.\n\n+   - **Save your backup archive to hard disk**—Instead\
    \ of using sda1 or sda2 (presuming they represent your USB flash drive), when\
    \ you choose where to back up your files, select a hard disk partition (such as\
    \ hda1, hda2, etc.). The backup.tar.gz archive is placed in the root of that partition,\
    \ so it can be restored later.\n\n+   - **Create a persistent /opt**—By dedicating\
    \ a disk partition to your /opt directory, you can save yourself the trouble of\
    \ restoring the files when you reboot. Instead, you just tell DSL to mount the\
    \ dedicated partition to /opt and it’s ready to roll.\n\nTo set up your persistent\
    \ /opt partition to work with your XAMPP server, you need to modify several steps\
    \ from the setup procedure. First, create an empty hard disk partition (for example,\
    \ /dev/hda2) and boot DSL as follows:\n\n```\nboot: dsl opt=hda2\n```\n\nNext,\
    \ install the XAMPP software to the /opt directory and copy your MyDSL packages\
    \ to a /opt/myds1 directory. Edit the .filetool.1st file and remove references\
    \ to backing up files from the /opt directory. When you go to reboot your system\
    \ later, start DSL and the XAMPP server with the following boot options:"
  merge: -1
  img_proc: true
- pgno: 355
  md: "> boot: ds1 nodhcp opt=hda2 myds1=hda2/myds1\n> Using the persistent /opt directory\
    \ in this way saves you the time used to back up your XAMPP files.\n> \n> Refer\
    \ to Chapters 6 through 9 for information on other ways of installing and configuring\
    \ DSL that may best suit your XAMPP configuration and the type of equipment you\
    \ are using.\n\n# RESTARTING YOUR XAMPP SERVER\n\nDepending on where you put your\
    \ XAMPP software, you need to enter different options to the boot prompt to have\
    \ DSL find, restore, and boot up the proper software. The following sections describe\
    \ how to restart your XAMPP server, depending on whether you stored the software\
    \ on a USB flash drive or hard disk, as described earlier.\n\n# Restarting from\
    \ a USB Flash Drive\n\nTo restart the XAMPP server you just installed on your\
    \ USB flash drive, simply insert the USB flash drive into a USB port on your PC\
    \ and reboot. If your PC skips the USB drive and tries to boot from hard disk\
    \ or another device, you may need to change the BIOS settings to boot from USB\
    \ devices.\n\nWhen you see the boot prompt, identify the location of your backup\
    \ archive and MyDSL packages as follows:\n\n```\nboot: ds1 myds1=sda1/myds1 restore=sda1\
    \ secure\n```\n\nThe first option to ds1 (myds1=) restores your saved MyDSL applications,\
    \ whereas the second option (restore=) restores your backed up files to the DSL\
    \ file system. The next time you reboot DSL, just remember that any subsequent\
    \ changes you make to the backed up files (such as those in /home/ds1 and /opt/lampp)\
    \ will be backed up again.\n\nI threw in the secure option, so that you can be\
    \ prompted for passwords to protect your server from breakins. If you are using\
    \ a static IP address, you can tell DSL not to start a network connection using\
    \ DHCP by adding nodhcp to the boot prompt.\n\n# Restarting from the Hard Drive\n\
    \nIf you had installed your backup archive and MyDSL packages to hard disk (as\
    \ described in the \"Other Ways of Storing Your Web Server\" sidebar), with a\
    \ static IP address, you could simply boot a DSL live CD and type this at the\
    \ boot prompt:"
  merge: -1
  img_proc: true
- pgno: 356
  md: 'boot: dsl nodhcp mydsl=hdal/mydsl restore=hdal secure


    Another way of rebooting DSL to include software stored on your hard disk (also
    from descriptions in the sidebar) is if you create a persistent /opt directory
    on a hard disk partition. For example, if your persistent /opt directory is on
    the second partition of your first IDE hard drive, you could boot DSL as follows:


    boot: dsl nodhcp mydsl=hdal/mydsl opt=hda2 secure


    If you have a large amount of RAM on your computer, you might also consider adding
    the toram option to the boot prompt. This helps make your slick XAMPP server blazing
    fast.


    # BACKING UP YOUR XAMPP SERVER


    The XAMPP service offers a feature that lets you securely back up you XAMPP databases,
    configuration files, log files, and content (htdocs) files. To do this, you run
    the lamp command with the backup option as follows:


    ```

    ```text

    # /opt/lampp/lampp backup mysecretpwd

    Backing up databases...

    Backing up configuration, log, and htdocs files...

    Calculating checksums...

    Building final backup file...

    Backup finished.

    Take care of /opt/lampp/backup/xampp-backup-12-02-07.sh

    ```

    ```


    The resulting backup file (xampp-backup-??-??-??.sh) is copied to the /opt/lampp/backup
    directory, from which you can copy it to a backup medium. The password (shown
    here as mysecretpwd) is the root password for your MySQL server.


    If at any point your data becomes corrupted or destroyed, you can restore the
    backup archive by running it as a shell script. For example, with the preceding
    example, you could type the following:


    ```

    ```text

    # sh /opt/lampp/backup/xampp-backup-22-01-04.sh mysecretpwd

    Checking integrity of files...

    Restoring configuration, log and htdocs files...

    Checking versions...

    Installed:  XAMPP 1.6

    Backup from: XAMPP 1.6

    Restoring MySQL databases...

    Restoring MySQL user databases...

    Backup complete. Have fun!

    You may need to restart XAMPP to complete the restore.

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 357
  md: 'Again, you need to enter the MySQL root password to be able to restore files
    to the MySQL database. After the files are restored, as the message indicates,
    you may need to restart the MySQL server for the restore to be completed (type
    `/opt/lampp/lampp restart`).


    # SUMMARY


    XAMPP is a powerful web server solution that combines the components needed to
    serve content that includes scripting languages (PHP, PEAR, and Perl), database
    tables (MySQL), FTP service (ProFTPD), and of course web HTTP service (Apache).
    All the pieces of XAMPP are contained in one directory structure and, because
    there is a Linux version, can run almost out-of-the box in Damn Small Linux.


    This chapter describes how to get and install XAMPP in Damn Small Linux. It also
    tells how to configure XAMPP, add web content, and save all the settings so the
    server can work across reboots. In particular, descriptions in this chapter can
    help you store a DSL XAMPP server and all your content on a USB flash drive that
    is less than 256MB.'
  merge: -1
  img_proc: true
