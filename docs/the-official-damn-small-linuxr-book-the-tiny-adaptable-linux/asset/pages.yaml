- pgno: 272
  md: 'can run on 128MB of RAM. All the native applications in DSL launch and run
    fine, from the XMMS media player to Ted, the word processor.


    Dillo, the web browser, also runs adequately, but you need to be careful with
    Dillo because it caches every page and image displayed until it closes down the
    program. If you are using Dillo, restrict its page views.


    We have already limited the cache size in Firefox, so it does a reasonable job
    of memory management on its own. However, it does not clear the cache for pages
    that are currently open, so if you like to surf with a lot of tabs open or if
    you view a page with a lot of images, you can use up all of your available RAM.


    As an alternative to using Dillo, consider using the gLinks.uci extension and
    manually lowering the cache use. GLinks does a good job of handling memory and
    is substantially lighter than Firefox.


    If you want to use a drive-less and limited RAM machine with OpenOffice.org, get
    the OpenOffice.uci extension. It operates fine with 128MB of RAM without a swap
    as long as it is not sharing memory space with another large application such
    as Firefox.


    Please keep in mind that if you use up all of your RAM and you do not have a swap
    file, your computer will lock up and any document that you have unsaved will be
    lost.


    # Other People’s Garbage (Resurrecting Old Laptops)


    To most people, a five-year-old laptop is hardly worth anything. These laptops
    seem to be gathering dust in the corners of many offices. If you cruise eBay or
    Craigslist, you see many old notebooks for under $100. Add a broken optical drive
    or hard drive and you are likely to see the unit in the recycle bin or given away.
    However, with a little work, many of these computers are still usable.


    Recently, I was given a Sony VAIO laptop (model PCG-Z505SX), Figure 12-3 shows
    a picture of the laptop.


    This laptop is a sexy, little lightweight notebook. It has a very thin profile
    and good resolution. The person who owned it was trying to give it away, and the
    first three people he offered it to declined it. After talking to a two people
    across the room, the owner walked over to my work area and started asking questions
    about the VAIO again.


    The conversation went something like this:


    Owner: How much do you think my laptop is worth?


    Person One: How much RAM does it have?'
