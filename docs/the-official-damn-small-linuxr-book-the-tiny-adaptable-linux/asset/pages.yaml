- pgno: 149
  md: '# FIGURE 6-7 The USB-ZIP install script opening dialog.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_149_0.png)


    Let''s review the opening dialog.


    +   1. Your pendrive must be at least 64MB in size.

    +   That is the minimum; of course, today manufacturers are not even making pen
    drives that small. It seems like the price of pen drives and all flash devices
    are rapidly dropping as the sizes are ever expanding. At the time of this writing
    1Gig pen drives were available for $20. But don''t worry about the excess space—you
    can use all that space in the second partition for extensions or other media.


    +   2. Your pendrive will be formatted into two partitions.


    +   3. One small one for USB_ZIP boot compatibility, and used to hold DSL.

    +   Numbers 2 and 3 refer to setting up the geometry for the computer''s BIOS
    to recognize the pen device as a USB-ZIP bootable drive in which the partition
    needs to have 64 heads and 32 sectors as the operational space for the first partition.


    +   4. The remaining partition will be used for backup & extensions.

    +   The second partition is automatically used for back up of your home directory
    and any other files or directories that you deem necessary and add to your filetool.lst.
    In addition, it is the default home for your MyDSL extensions while booting off
    of your pen.


    Take heed of the warning and make sure you don''t have the pen drive mounted.
    If you do, exit the install script, unmount your pen drive, and then relaunch
