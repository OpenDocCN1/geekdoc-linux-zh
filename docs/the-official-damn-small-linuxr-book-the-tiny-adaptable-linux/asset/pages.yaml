- pgno: 2
  md: '# Your practical, hands-on guides to getting real results with free software


    Books in the Negus Live Linux Series encourage and challenge you to advance in
    the free software world. Boot the live DVD or CD that comes with each book and
    watch the Linux system, applications, and content described in the book come to
    life before your eyes.


    Start as a novice by trying out examples and finish as a professional, mastering
    the many topics covered in the series, from building PHP/MySQL sites to customizing
    live CDs and more. When you are finished, you will know how to use, customize,
    and rebuild that free and open source software yourself.


    Overseeing the series is Christopher Negus, bestselling author of the Red Hat
    Linux Bible series, Linux Toys series, and the signature book for this series,
    Live Linux CDs.'
  merge: -1
  img_proc: true
