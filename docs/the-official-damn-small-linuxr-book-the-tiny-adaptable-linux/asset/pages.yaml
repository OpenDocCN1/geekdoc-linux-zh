- pgno: 183
  md: 'Both installation scripts provide an easy but typical DSL installation. If
    your requirements are very complex, having many operating systems installed and
    having pre-existing boot loaders, it is incumbent upon you to edit the appropriate
    boot loader.


    # POORMAN''S—AN EASY WAY TO TRY DSL


    If the PC on which you want to run DSL has a floppy drive, a Poorman''s install
    is a good way to configure DSL. By creating a boot floppy and installing DSL to
    an existing disk partition (Linux or Windows partitions), you can boot DSL from
    many older machines without erasing any software already installed on the machine
    and without changing the master boot record.


    Recall the DSL Install Options screen shown in Figure 8-1. With a Poorman''s install,
    many times, you may need to use a more capable machine to boot the DSL CD-ROM
    and prepare boot floppies or even a floppy only installation set. The following
    procedures describe how to get the floppy images you need and do a Poorman''s
    install to existing Linux or Windows partitions.


    # Prepare Boot Floppies


    As previously defined, a Poorman''s install is needed if your target computer
    either can''t boot from its CD drive or has only a floppy drive. In either case,
    you need to create a DSL boot floppy. I have also prepared a DSL FreeDOS utilities
    diskette, containing a collection of DOS programs to assist in the installation
    and setup process.


    Using a more capable DSL booted machine that has a CD drive and floppy drive,
    creating these floppies is easy and automatic from the DSL Install Options menu.
    However, you can manually download and create the floppies as needed.


    To download these floppies, you should check for a local download mirror. DSL''s
    mirror collection is available at http://www.damnsmalllinux.org/download.html.


    +   1. Locate the files to download using a web browser or ftp client. For example:

    +   ```

    +   ftp://ibiblio.org/pub/Linux/distributions/damnsmalllinux/current/bootfloppy.img

    +   ```

    +   and

    +   ```

    +   ftp://ibiblio.org/pub/Linux/distributions/damnsmalllinux/current/bootfloppy-utils.img

    +   ```'
  merge: -1
  img_proc: true
- pgno: 184
  md: "2. After these diskette image files are downloaded, use typical tools to write\
    \ to floppy diskette. For Windows, this usually means rawwrite. The rawwrite program\
    \ for Windows can be found here:\nhttp://www.chrysocome.net/rawwrite\n\nAfter\
    \ you have written the diskette image to a floppy disk, remove the disk so that\
    \ you can use it to install DSL on the target machine. (Later, when instructed\
    \ to boot from either of these two floppies, be sure that you have changed your\
    \ system’s BIOS setting so that the floppy is the first boot device.)\n\n# DSL\
    \ Installed on Windows 9x or DOS Partition\n\nLet’s say you have a Windows 9x\
    \ or DOS system with modem or Internet access and you want to try DSL. You do\
    \ not want to disturb your Windows installation. You especially do not want to\
    \ have to repartition your hard drive. To install DSL without affecting your current\
    \ system, follow these steps:\n\nNOTE\nInternet access is required for this section.\
    \ Methods for system without Internet access will be discussed in the next section\
    \ of this chapter.\n\n+   1. Boot the machine on which you want to install DSL\
    \ into Windows or DOS.\n\n+   2. Download the embedded version of DSL to C:\\\
    . We are not going to attempt to run virtualization as discussed in Chapter 7.\
    \ The embedded version is provided as a Zip file and therefore is very easy access\
    \ for DOS and Windows system to unzip.\n+   \n+   The embedded version, which\
    \ I will call the Zip file version of DSL, can be found here:\n+   ftp://ibiblio.org/pub/Linux/distributions/damnsmalllinux/current/dsl-embedded.zip\n\
    \n+   3. If you have an unzip program on your Windows system, unzip this Zip file\
    \ into a working directory—for example, c:\\work.\n+   If you do not have unzip,\
    \ you can reboot your computer using the DSL Utilities boot floppy and you will\
    \ find unzip and other utility programs that we will be using."
