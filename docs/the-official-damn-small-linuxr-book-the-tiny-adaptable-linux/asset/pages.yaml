- pgno: 318
  md: 'up with a Linksys USB200M Compact USB 2.0 10/100 Network adapter (for wired
    Ethernet connection). I also found an old Lucent Orinoco Gold PC Card (for wireless
    Ethernet).


    Both network adapters had drivers in Damn Small Linux. When I plugged the Linksys
    into my network switch, it was automatically configured from DHCP and I was up
    on my LAN immediately. I decided to go with a wired Ethernet, figuring that two
    cords coming out of the frame was no worse than one. I added a small cable extension
    to the USB adapter, so I had more flexibility in how it was attached to the frame.
    (See Chapter 4, “Configuring and Saving DSL Settings,” for more information on
    configuring your network interfaces.)


    One other hardware addition you should consider is a USB flash drive (or pen drive).
    You can conceivably store your multimedia content, backed up DSL settings, MyDSL
    extensions, and even DSL itself on one of these removable drives. Using the drive
    in this way, you could create the whole project on the USB flash drive and update
    the project without a network connection, by modifying the device on another machine
    and then plugging it into the frame again and rebooting to get updated software
    and content.


    # Getting Parts for the Frame


    For the frame, I ended up with something a bit different than I expected. The
    visible area of the laptop screen is 7.25×9.5 inches. So, I asked my wife to buy
    a picture frame that was at least 8.5 inches high×11 inches wide×2 inches deep.
    What she came back with was a square wall shelf with a front like a picture frame.
    The opening was 12×12 inches and the frame itself was 5 inches deep. Figure 15-1
    shows this frame and the laptop I had to adapt to it.


    On the back of the frame was hardware for mounting the frame directly to your
    wall studs. So, the weight of the frame wasn’t going to be a problem. For mounting
    the laptop into the frame, I cut a 12×12-inch square pine board and cut out the
    7.25×9.5-inch opening needed to display the screen. To connect the plywood to
    the frame, I got some strips of wood that could be attached around the side that
    faced into the frame and attached that to the frame as well.


    I purchased some clamps for connecting the laptop screen to the plywood board.
    Then, I needed some screws for connecting the other laptop components to the frame.
    The final pieces I needed were an antistatic mat (to put the laptop on as I worked
    on it) and a good set of small screwdrivers and pliers.


    Before starting to take apart the laptop, however, the next step was to get all
    the software installed on it.'
  merge: -1
  img_proc: true
- pgno: 319
  md: '![](img/af53325d7f38f1cdafca9f44568e4ab8_319_0.png)


    FIGURE 15-1 The frame front and wide opening made this square shelf a good frame
    for an old Compaq Presario.


    # INSTALLING AND CONFIGURING THE SOFTWARE


    Before starting to modify the laptop, it''s a good idea to make sure all the software
    for the project works. One main reason for doing this first is that you won''t
    have a keyboard to work from after a while, so it''s easiest to get all the software
    working before dismantling the laptop.


    At this point, you should already have an idea that DSL will boot. So, the next
    task is to get the laptop ready to install the software, get all the software
    needed, make sure it runs, and then store it so it can be available on the next
    reboot.'
  merge: -1
  img_proc: true
- pgno: 320
  md: '# NOTE


    If your laptop doesn’t have a hard disk, you can still do this project. Instead
    of installing the software to hard disk, you can create a remastered Damn Small
    Linux, as described in Chapter 11, “Setting Up a Full Remastering Environment,”
    using the components described here. Then, you can add the digital media content
    from over the network (using Samba) or from any available removable medium (such
    as a USB flash drive or a Zip drive).


    # Partitioning the Disk


    Because I have enough room on the hard disk (and so I can disconnect the CD drive),
    I decided to install Damn Small Linux directly to the hard disk on the laptop.
    Before I could do that, however, I decided to partition the hard disk.


    In Chapter 9, “Performing a Traditional Hard Drive Install,” there is a procedure
    for partitioning your hard disk to prepare it for a Damn Small Linux installation
    (type install from the boot prompt to start it, then type 12). You can repartition
    during the installation instead, but doing partitioning separately gives you a
    bit more flexibility.


    In my case, I created a 200MB swap partition (hda2) and assigned the rest (just
    under 2GB) to a Linux partition (hda1). Although the swap size is more than the
    general rule of double the amount of RAM, because the laptop has a small amount
    of RAM (under 128MB), it’s good to assign extra swap space.


    # Choosing an Install Type


    The installation type you choose depends somewhat on the amount of disk space
    and RAM you have. With a smaller amount of disk space, you can choose a Frugal
    install (which saves space by copying the compressed image to hard drive). I chose
    to do a regular hard drive installation because my computer had a low amount of
    RAM.


    The traditional hard drive installation procedure (described in Chapter 9) uncompresses
    the operating system files and copies them from the CD to the Linux hard disk
    partition. Then, the procedure lets you choose to install a bootloader (I chose
    Grub) to actually boot the installed DSL from hard disk.


    Another advantage of the hard drive installation procedure is that it steps you
    through additional configuration for your installed DSL system. Type no when you
    are asked if you want to add multiple user accounts (saying yes would force you
    to enter a password, which you don’t want to do). You can also select to use an
    ext3 file'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'system, which might run a bit slower, but will recover better if your digital
    media frame is not shut down properly. I always use ext3, but that’s your choice.


    After the installation is complete, pop out the CD and reboot the laptop, as suggested.
    In fact, turn it off and turn it back on again. When the machine boots up, you
    will see the Grub boot screen. In my case, the default boot command wouldn’t work,
    so I used the arrow keys to move to the fb800x600 entry to use the framebuffer
    X driver with 800×600 screen resolution.


    When asked to enter a password for the root and ds1 users, I just pressed Enter.
    Having a blank password allows the laptop to boot directly to DSL (as the ds1
    user) without entering a password. You are also asked to select your X driver.
    Because you installed DSL to hard disk, all these settings are restored automatically,
    without having to back them up (as you would if you ran DSL from read-only media,
    such as a CD).


    With DSL installed, I only used about 160MB of disk space. I still had 1.8GB of
    space remaining for software and digital media content (images, video, and music).


    Before proceeding, be sure to assign your swap area and turn it on. In my case,
    the swap partition was hda2 (yours may be different). Open a terminal window as
    root and type the following:


    ```

    # mkswap /dev/hda2

    # swapon /dev/hda2

    ```


    Next, shutdown your laptop and remove the CD. Then restart the laptop from hard
    disk.


    # Adding Multimedia Player and Networking Software


    If everything went well to this point, you should have a version of Damn Small
    Linux running from your laptop’s hard disk. Now, you need to add some software
    to be able to play your digital media from the frame.


    With a traditional hard disk install, you don’t need to save your MyDSL extensions
    for the next reboot. Provided you use .dsl extensions, you can simply install
    the software extensions you want and they will be on your hard disk the next time
    you reboot.


    Next, from the DSL desktop, select the MyDSL icon and add the following software
    using the MyDSL Extension Tool:


    +   ■ GQview—From the Apps menu, select the gqview package. This package can be
    used to play slideshows of digital images.'
  merge: -1
  img_proc: true
- pgno: 322
  md: 'Mplayer—From the Multimedia menu, you can add the mplayer extension. You can
    use mplayer to play video. You also need to add software extensions that contains
    the codecs needed by the video content you want to play (such as ones that you
    get by selecting System, then codecpack). (I recommend you have at least 128MB
    of RAM to use mplayer.)


    To play PowerPoint presentations, you could install the openoffice extension from
    the apps menu in the MyDSL Extension tool. You should also consider adding software
    to your media frame that can help you get content over the network. In particular,
    consider adding Samba software from the Net menu. With Samba, you can share your
    directories so other Linux and Windows machines can access them (using Windows
    file sharing).


    # Configuring the Digital Media Frame


    Most of the configuration you do to set up the digital media frame is to be able
    to start the digital media frame without manual intervention. I''ll begin by focusing
    on how to get the digital media frame to boot up directly to a slideshow.


    # Configuring the Player


    To get an idea of how to boot up directly to a media player, the first example
    shows how to start up the GQview image viewer. The general approach is to set
    up the default values for GQview, then configure GQview to start up automatically
    from the boot prompt. With GQview installed, as described earlier, do the following:


    +   1. Select the GQview icon from the desktop. The GQview image player starts.

    +   2. From the GQview window, select Edit and then Options. The GQview Configuration
    window appears, as shown in Figure 15-2.

    +   3. Set defaults for GQview to play images continuously. In particular, I selected
    Random and Repeat in the Slide Show box. I also unselected the box next to Cache
    Thumbnails, so I wouldn''t fill up the disk with thumbnails. The default is to
    change images every 15 seconds, but you may want to change that to suit your taste.
    Select other tabs to change different settings. For example, selecting Fit Image
    to Window (on the Image tab) is a good idea. Choosing Preload New Image may help
    load the images faster.

    +   4. Save the settings by clicking Apply and then OK.


    Try different options. With the image player ready to go, you are ready to configure
    the bootloader to tell DSL to boot up to GQview.'
  merge: -1
  img_proc: true
- pgno: 323
  md: '![](img/af53325d7f38f1cdafca9f44568e4ab8_323_0.png)


    # Changing the Bootloader


    The bootloader defines the kernel to boot and any options you want to pass to
    the kernel. For this example, I used the Grub boot loader. You can change the
    Grub boot loader by editing the /boot/grub/menu.lst file. Changes to that file
    are automatically picked up when you reboot.


    The following shows how I edited the existing menu.lst file (I removed comment
    lines for clarity):


    ```

    default 2

    timeout 15


    title DSL

    kernel /boot/linux24 root=/dev/hda1 quiet vga=normal noacpi noapm nodma

    noscsi frugal


    title DSL fb800x600

    kernel /boot/linux24 root=/dev/hda1 quiet vga=788 noacpi noapm nodma

    noscsi frugal

    ```'
  merge: -1
  img_proc: true
- pgno: 324
  md: '```

    title DSL fb800x600-F

    kernel /boot/linux24 root=/dev/hda1 quiet vga=788 noacpi noapm nodma

    noscsi frugal desktop=frame

    ```


    The changes to the menu.lst file are shown in bold. For the default value, I changed
    0 to 2 so that the third entry (DSL fb800x600-F) is booted by default. I then
    copied the DSL fb800x600 entry and created a new third entry (calling it DSL fb800x600-F).
    After that, I added the desktop=frame option. The desktop=frame option tells DSL
    that instead of running Fluxbox or jwm as the window manager, it should start
    a window manager definition called frame (which we will define in the next section).


    There are other options you can set as well. If you set up a static IP address
    for your media frame (which is a good idea), add the nodhcp option to the boot
    prompt. For example, if your laptop supports higher resolution, you could set
    fb1024x768 or fb1280x1024 as the default boot entries.


    Keep in mind that at this point, your laptop will try to boot directly to the
    slideshow viewer. Therefore, if you need the DSL desktop to make further changes,
    be sure to select one of the other entries on the boot screen.


    # Modifying .xinitrc to Start Player


    The way that Damn Small Linux is configured, with no password set for the DSL
    user, DSL logs in the ds1 user automatically and starts the desktop. How the desktop
    starts is directed by the contents of the /home/ds1/.xinitrc file. By adding a
    new desktop entry for your frame desktop, you can set the GQview application (gqview
    command) to start immediately when the desktop starts.


    Open the /home/ds1/.xinitrc file using any text editor. Then, add an entry for
    the frame desktop as shown:


    ```

    # put X windows programs that you want started here.

    # Be sure to add at the end of each command the &

    .

    case $DESKTOP in

    frame )

    /usr/bin/gqview -s -f /var/mediaframe/pics

    ;;

    fluxbox )

    fluxter &>/dev/null &

    wmsvallow -geometry 70x80 docked docked.lua &

    exec fluxbox 2>/dev/null

    ;;

    jwm )

    ./.background

    ```'
  merge: -1
  img_proc: true
