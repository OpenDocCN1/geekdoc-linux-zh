- pgno: 197
  md: '# Performing a Traditional Hard Drive Install


    This chapter covers various methods of a conventional hard drive installation
    (as opposed to a Frugal installation, which is covered in Chapter 8, “Installing
    DSL in Alternate Ways”). In this chapter, we will discuss when it is practical
    to do a conventional installation of Damn Small Linux (DSL), walk through hard
    drive preparation, how to use the DSL hard drive installation script, and finally,
    show some pointers on setting up a PC for multiboot.


    # CONVENTIONAL HARD DRIVE INSTALL VERSUS FRUGAL INSTALL


    Most of the development in DSL has been dedicated toward a compact and modular
    operating system with a tiny but usable base of 50MB and easily integrated extensions
    to build out functionality as needed. This system has been adapted to work from
    within a CD, a pen drive, and conventional hard drive, or an IDE Compact Flash
    drive.


    This method is so versatile because it essentially looks at these units (the core
    OS and the extensions) as solid images that are interlinked together. This means
    that DSL is run as a very durable compressed image, which is more difficult to
    damage than a conventional hard drive install. The Frugal system is also well-suited
    for nonconventional media, such as compact flash, due to its operation with a
    small ramdisk. A conventional hard drive install of Linux does many writes to
    disk, which eventually destroys compact flash.


    So, why would someone want to do a conventional hard drive install using Damn
    Small Linux, if Frugal has so much going for it? Well, a user in our forum'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'posted the same question and the results were interesting. Most users who do
    a conventional install do not know about the Frugal method. In addition, some
    say that there are applications they would like to have that aren’t provided in
    the repository, and others say that they are using DSL on a low RAM system.


    Even with knowledge of the Frugal method, the second and third explanations are
    still reasonable. If you know what you are doing and you want to run your particular
    applications from within a very compact system, DSL may be a very good fit. On
    the other hand, if you have a limited resource system, DSL may work well as a
    low-fat operating system (e.g., for hardware that was originally built for Windows
    95 or Windows 98).


    There was a group of Linux enthusiasts who installed Damn Small Linux on a pair
    of 486 computers with 16MB of RAM. They actually found the performance of this
    particular installation with DSL somewhat useful. Personally, I think that this
    is scraping the bottom of the usability scale, unless you are planning on spending
    most of your time in text mode.


    However, there are many examples of people running DSL on machines that have only
    32MB of RAM. I feel that a conventional hard drive install makes more sense than
    a Frugal installation for any conventional computer that has 64MB of RAM or less.


    In this example, you are using the computer only as a DSL machine; thus, I am
    not going to outline the many facets of creating a multiboot system. If you follow
    this process, you end up with a computer that only boots DSL when you are finished.
    If you are interested in setting up a multiboot machine, there are lots of how-tos
    on the Internet to reference. Setting up a single boot computer with DSL is a
    much simpler process, and you do not need any outside utility to accomplish this.


    A good how-to on multibooting can be found at:


    http://www.geocities.com/epark/linux/grub-w2k-HOWTO.html


    A traditional hard drive install of Damn Small Linux is not that difficult to
    do. However, before you start, there are some things you should know about software
    compatibility and hardware requirements.


    # Some Debian Compatibility


    Damn Small Linux is not Debian! Damn Small Linux is built with KNOPPIX technology
    that is based on Debian technology. However, we have done a lot of customization
    to achieve such a small package.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'This means that you are bound to run into some issues if you want to use Damn
    Small Linux as a means to install a Debian system. For example, many of the core
    libraries are based on *old stable*, which is no longer being supported by Debian.
    So, if you want to go from DSL to a full-fledged Debian system, you need to do
    a lot of updating.


    Another thing to keep in mind is that DSL uses a special light build for our Xserver,
    called Kdrive, which is compiled and is not compatible with the Debian system.
    Eventually, apt-get tries to override the setup with a fuller Xfree86 configuration.


    If you desire to go for a cutting-edge *Unstable* Debian edition, do not start
    with DSL. There are other options out there. Even using KNOPPIX gets you there
    with much less fuss.


    Because much of the base Debian structure has been stripped out of DSL, we recommend
    that you do not try to upgrade to a more recent version using DSL. That being
    said, many old stable Debian applications can be installed in DSL without much
    hassle. If you are running older hardware, you will find the software provided
    in Debian old stable much more suited for your machine than the later software.
    Thus, it is probably in your best interest to stay with what is most easily compatible
    with DSL.


    # Hardware Requirements


    Your hard drive should have at least 200MB of space. If you are planning on doing
    an install on a low RAM system, you need to allocate space for a *swap* partition
    that is used to supplement RAM.


    A general rule of thumb is to provide double the size of your RAM for your swap.
    So, if you have 128MB of RAM, you should provide 256MB for your swap partition.
    If your system is on the lower end and has 64MB of RAM or less, you may want to
    increase the swap to three times the RAM size. This helps when you run larger
    applications such as Firefox.


    On the other hand, if you have abundant RAM—for example, over 1Gig—you may not
    need a swap space at all. I have successfully used a system with 256MB of RAM
    without a swap partition, but I do have to be careful with my RAM allocation.


    Remember: Do not do a conventional hard drive install if your computer has an
    IDE Flash drive. Instead, perform a Frugal install.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# Pre-Installation Preparation


    Before you get started with the installation process, you need to partition the
    hard drive and set up the swap file. For the purpose of this walkthrough, we are
    assuming that you are going to install DSL via a DSL live CD. Please note that
    the installation process will destroy all data on the hard drive, so be sure to
    archive any important files someplace other than the computer you are about to
    format.


    # Partitioning with Cfdisk


    You need to set up a Linux partition and a swap partition. You will be using the
    cfdisk command as your partition editor. Cfdisk was selected for this example
    because it is relatively intuitive to use. Cfdisk can be used to examine your
    computer''s current partition table, as well as delete and add new partitions.


    In DSL, your primary IDE hard drive should be recognized as /dev/hda. In order
    to have writable access to the hard drive, you need to have a terminal open with
    root user privileges; this can be done by opening up a root Terminal window, or
    by typing sudo su if you are in text mode.


    To launch cfdisk, type


    ```

    # cfdisk /dev/hda

    ```


    In my example, I am altering a computer that previously had MS Windows 98 on it.
    Figure 9-1 shows the cfdisk interface.


    FIGURE 9-1 Cfdisk displaying data for a hard drive partitioned for Windows 98
    (note, it looks much the same way as Windows 95 would look to cfdisk).


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_200_0.png)


    The figure shows the hard drive as it was originally set up for a MS Windows 98
    install.'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'There is a lot of useful information in the top section of the image:


    +   - **Disk Drive:** The disk drive you are viewing/editing, shown here as /dev/hda.

    +   - **Size:** The size of the drive, which is about 3200MB in this case.

    +   - **Heads/Sectors per Track/Cylinders:** The geometry of the drive shows the
    number of heads, sectors per track, and cylinders on the hard drive.


    You will want to reference the size of the drive as you set up your partitions.
    You will be splitting the drive into a Linux partition, which will house DSL and
    a smaller Linux swap partition, which Linux uses similar to the way that MS Windows
    uses a swap file.


    You are going to put the boot partition first in this example. However, you need
    to reserve a space for the swap partition, so you are going subtract out the size
    of the swap partition from the total size of the drive. The demonstration computer
    has 256MB of RAM, and you want to give this computer a swap partition, which is
    double that size.


    You need to do some math:


    ```

    3,200MB    Total Drive Space

    - 512MB    The desired swap partition size

    ------

    2,688MB    The size of the boot partition

    ```


    Now you have your number: 2688MB for your boot partition. Before you make it,
    you need to delete the existing table.


    Cfdisks is pretty simple to use; to move the focus around, you simply use the
    arrow keys on your keyboard. The first step is to navigate to the Delete tab and
    press Enter. This removes the existing partition. If you have more than one preexisting
    partition, remove them all.


    After you have nothing remaining but free space, navigate to the New button and
    press Enter. Next, it asks if this should be a Primary or Logical partition; select
    Primary and press Enter.'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'The second partition is used for swap. The first step in creating the new partition
    is to press the down arrow on your keyboard to highlight the remaining free space
    on the drive. Next, use the right arrow key to navigate to the New button. Choose
    Primary again, and then press Enter.


    Because the math was already completed for your first partition, the size of this
    one should coincide with what you wanted for your swap file—you should be able
    to just press Enter to set the size. Do not mark this partition bootable! Navigate
    to the Type button and select #82, which is Linux swap. Figure 9-2 shows an example
    of the cfdisk interface, containing the partitioning just described.


    # FIGURE 9-2 An example of a hard drive partitioned for Linux.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_202_0.png)


    This is the same hard drive now with both the Linux boot and Linux swap partition
    mapped out.


    Now, you should have all the space assigned on your hard drive. The numbers are
    probably slightly off from what you selected, but not by much—maybe a few MBs.
    This is due to the physical limitations of the hard drive’s internal geometry.


    Next, navigate to the Write button and press Enter. You are prompted to type either
    yes or no. If everything looks good, type yes and press q to exit the program.


    # Creating the Swap File


    This is a good time to format the swap partition. It is a simple process; in a
    terminal with root privileges, type mkswap and then the partition you assigned
    to be the swap partition in Cfdisk.


    So, if the swap partition is assigned to hda2, you would type:


    ```

    # mkswap /dev/hda2

    ```


    Figure 9-3 shows an example of the output from the mkswap command after formatting
    the /dev/hda2 partition.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '![](img/af53325d7f38f1cdafca9f44568e4ab8_203_0.png)


    **FIGURE 9-3**  The mkswap command sets up a Linux swap area.


    # # THE HARD DRIVE INSTALL SCRIPT


    There are quite a few options when doing a conventional hard drive install of
    Damn Small Linux. You can install DSL without a boot loader, or you can choose
    to install either Grub or Lilo. Unless you are installing DSL on a computer from
    which you want to boot multiple operating systems, you probably want to have the
    script set up the boot loader for you.


    You can install DSL in *single user mode*, which brings you right into a desktop
    at boot. Or, you could opt for a multiuser setup, which requires you to log in
    before you can access the desktop or command line. You also have the option of
    installing DSL with ext3, a journal file system, or the older ext2 file system.


    For our demonstration, we are going to select Lilo because it is simple (gives
    less booting options) and this is an old computer that will only be booting DSL.
    In addition, we are going to install DSL to be set up for multiple users because
    it is slightly more secure with the additional requirement of logging in before
    the user is granted access to the system.


    If you are not sure what choices to make, try a few different installation configurations
    to see what fits your needs and feels the most comfortable. For this example,
    I also chose to go with ext2, the nonjournalized file system, because it has a
    faster write and read access and uses less disk space. Others may find that the
    increase in reliability is worth the performance hit of the ext3 file system.


    If your system is underpowered (or if you are in a hurry), you may want to do
    an installation from the DSL CD in “installation mode.” Type **install** at the
    boot prompt:


    ```

    boot: install

    ```


    This boots you into the following DSL Install Options:


    ```

    ┌──[ DSL Install Options ]──────────────────────────────┐

    │                                                        Net Access Req’d │

    │  1. Make Standard Boot Floppy                         yes              │

    │  2. Make USB Boot Floppy                              yes              │

    │                                                        │

    │  3. **Install to Hard Drive**                         **no**            │

    │  4. Frugal Grub Hard Drive Install                    no               │

    │  5. Frugal Lilo Compact Flash Install                 no               │

    │                                                        │

    │  6. USB Pendrive ZIP boot Install                     no               │

    │  7. USB Pendrive HDD boot Install                     no               │

    │                                                        │

    │  8. Split KNOPPIX into floppy sized chunks            no               │

    └────────────────────────────────────────────────────────┘

    ```'
  merge: -1
  img_proc: true
