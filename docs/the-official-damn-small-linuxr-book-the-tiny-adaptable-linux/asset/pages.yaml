    /usr/share/edna/www/client.html

    /usr/share/edna/www/images/

    /usr/share/edna/www/images/browser.jpg

    /usr/share/edna/www/images/chalk.jpg

    /usr/share/edna/www/images/client.jpg

    /usr/share/edna/www/images/redpix.gif

    /usr/share/edna/www/images/taskbar.jpg

    /usr/share/edna/www/images/term.jpg

    /usr/share/edna/www/index.html

    /usr/share/edna/www/new-index.html

    /usr/share/edna/www/taskbar.html

    /opt/mp3s

    ```


    You can start the Edna server by selecting Edna MP3 Server in your MyDSL submenu,
    or alternatively, you may open up a term window and type sudo python edna.py.
    At this point, you are launching Edna with a default configuration that looks
    for files in /opt/mp3s/. If you look in /opt/mp3s/, you find a sample MP3 provided
    with the Edna extension.


    At this point, you should be able to point your browser to the server and see
    if it is working. From DSL, you can launch Firefox and point it to http://127.0.0.1:8080.
    Figure 13-1 shows the default layout of the Edna Music Server.


    As you can see, there are two subdirectories listed in the default configuration.
    MP3 CDROM points to /mnt/cdrom where Edna searches for music files on your optical
    device. It is important to note that Edna cannot read music CD formats that are
    not mountable in the normal sense, but instead looks for media files the same
    way it would probe a normal file directory. So, if you store your Ogg Vorbis or
    MP3 files on CDs, Edna can access them and share them with a network. It is worth
    noting that there are lots of options for ripping and encoding music CDs from
    Damn Small Linux in the Media section of the DSL Extension repository. Even without
    any extensions, you could rip CDs with XMMS by switching the audio preference
    to “Disk Writer Plugin,” which will save the audio as a wav file, and then you
    could encode the wave file into an Ogg Vorbis file by using the command line utility
    ‘oggenc’.'
