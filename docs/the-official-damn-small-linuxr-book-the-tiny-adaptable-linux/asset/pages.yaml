- pgno: 166
  md: 'With the default configurations in DSL-Embedded bat files (1st-boot.bat, dsl-base.bat,
    dsl-vhd.bat, and printer.bat), we have Qemu run without KQemu enabled. You have
    to modify the .bat file of your choice configuration to enable KQemu acceleration.


    Look for the following option on the qemu.exe command line:


    ```

    ```text

    -no-kqemu

    ```

    ```


    Replace it with


    ```

    ```text

    -kernel-kqemu

    ```

    ```


    You need to download the Microsoft Windows build of KQEMU at


    http://www.h7.dion.ne.jp/~qemu-win/


    At the time of this writing, version Kqemu-1.3.0pre11-install.exe was available.
    After downloading and installing KQEMU, you need to run the following:


    ```

    ```text

    net start kqemu

    ```

    ```


    Either type it into the run command or open a command prompt and type the command
    in there. Figure 7-2 shows an example of KQemu being enabled from the Run utility:


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_166_0.png)


    **FIGURE 7-2** Enter `net start kqemu` into the Run utility.


    That should be all you need to do to enjoy your accelerated performance. Now go
    ahead and launch DSL-Embedded in your usual way.


    # RUNNING DSL IN VMPLAYER—VMWARE’S FREE VIRTUAL MACHINE


    VMPlayer is VMWare’s free virtual machine. It is a free download, but not freely
    distributable. Parts of the technology behind VMPlayer are open source and are
    apparently licensed under the GPL. We will explore using Damn Small Linux with
    the VMPlayer virtual machine from within the Microsoft Windows environment.'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'Figure 7-3 shows an example of Damn Small Linux running in VMPlayer in Windows
    XP.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_167_0.png)


    # FIGURE 7-3 Damn Small Linux running in VMPlayer on a Windows XP host system.


    # Comparing VMPlayer to Qemu


    In many ways, Qemu and VMPlayer performance benchmarks are comparable. Some studies
    have put Qemu with the KQEMU accelerator ahead in performance. In my limited testing,
    VMPlayer boots faster and seems to struggle less with resources during general
    use. It could be that our default settings in Qemu are limiting the system; we
    will have to do further testing to figure out the discrepancy.


    VMPlayer is much larger than Qemu (25MB versus less than 2MB), and it needs to
    be installed on the host operating system. So, there is not a way to run VMPlayer
    from a low impact pen drive like QEMU. If you are in a situation where you are
    using a Windows computer and you want a way to get back into running'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'Linux embedded, this may be a great way to achieve your goal. A large download
    VMPlayer is easy to install and use.


    # Running VMPlayer with Damn Small Linux


    Your first step is to download the latest version of VMPlayer. At the time of
    this writing, VMWare had posted 1.0.3 as the latest version.


    The following is the URL for downloading VMPlayer:


    ```

    http://www.vmware.com/download/player/

    ```


    VMware says that VMPlayer needs a processor of least 400MHz, a minimum of 128MB
    of RAM, and 150MB of free space for installation.


    The installation process is straightforward: just download and run the auto-installer.
    There are a few "extras" that you may or may not want installed, but they are
    easy to deselect. After you download and install VMPlayer, you are ready to run
    any virtual appliance listed at the VMWare site, including several operating systems.


    There is an extensive list of virtual appliances at


    ```

    http://www.vmware.com/vmtn/appliances/directory/

    ```


    We provide DSL prepackaged to run with VMPlayer. You can download it from


    ```

    http://distro.ibiblio.org/pub/linux/distributions/damnsmall/current/

    ```


    Please note that for running DSL with VMPlayer, you want to choose the download
    that ends with vmx.zip. Thus, the file will look like ds1-[version number]-vmx.zip.
    After downloading the zip file, all you need to do is unzip the file and save
    the contents locally. (You may want to make a vmplayer folder and save the content
    to your desktop for easy access.)


    The contents of our bundled file are just two files: the DSL ISO image and a configuration
    file labeled ds1.vmx. If you have already installed VMPlayer, your system will
    already recognize ds1.vmx as a VMPlayer configuration file. All you should need
    to do at this point is double-click the ds1.vmx icon.'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'While running DSL in VMPlayer, you should have access to the Internet and audio
    if these services are normally working in your computer. VMPlayer is simple to
    use with DSL and can be very handy.


    # SUMMARY


    There are a lot of options when it comes to running DSL embedded, whether it is
    from a pen drive or used from a local file. If you’ve grown to rely on Linux and
    the powerful command-line tools it offers, DSL-Embedded may make your time in
    an otherwise constricted PC an enjoyable experience.'
