- pgno: 251
  md: 'After you have completed all the changes to the base system, you are ready
    to create a new compressed KNOPPIX/KNOPPIX file.


    # The makeimage Script


    The makeimage script is on the enclosed CD-ROM in the chapter11/ remaster directory.
    The script is to be run from within your working directory. The following shows
    the script''s contents, with line numbers added:


    ```

    1. #!/bin/sh

    2. #

    3. # Clean up .bash_history

    4. if [ -f source/KNOPPIX/.bash_history ]; then

    5. rm source/KNOPPIX/.bash_history

    6. fi

    7. if [ -f source/KNOPPIX/home/ds1/.bash_history ]; then

    8. rm source/KNOPPIX/home/ds1/.bash_history

    9. fi

    10. #

    11. # Clean up any ssh hosts

    12. if [ -d source/KNOPPIX/root/.ssh ]; then

    13. rm -rf source/KNOPPIX/root/.ssh

    14. fi

    15. #

    16. # Check to see if need .bash_profile

    17. if [ ! -f source/KNOPPIX/.bash_profile ]; then

    18. cp .bash_profile source/KNOPPIX/.bash_profile

    19. fi

    20. # Copy over the release info.

    21. cp -f release.txt source/KNOPPIX/usr/share/doc/ds1/.

    22. #

    23. mkisofs -R -U -hide-rr-moved -cache-inodes -no-bak -pad source/KNOPPIX | nice
    -5 create_compressed_fs -best - 65536 > master/KNOPPIX/KNOPPIX

    24. #

    25. sync

    26. sync

    ```


    The makeimage script does the following:


    +   - Lines 4-9 remove all references from what was recorded while chrooted in.

    +   - Lines 12-14 remove any references to ssh connections that you may have used.

    +   - Lines 17-19 check to see if you need a .bash_profile.

    +   - Line 21 writes the release information using the direct method.

    +   - Line 23 creates the new compressed KNOPPIX/KNOPPIX image from your source/
    directory and writes it into the master/ directory.'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'Depending on your machine''s resources, running the makeimage script could
    take a long time. After a successful build of the new compressed image, you must
    next combine the boot files, the kernel, initial ramdisk, and the compressed runtime
    image. This process creates the actual ISO image file in your iso/ directory.
    The ISO file is ready to be burned onto a CD-R CD-ROM. If you add an optional
    parameter of cd, the script records the image.


    # The makeiso Script


    After cleaning up the chrooted environment, the next stage actually creates the
    ISO image. This stage combines the newly created KNOPPIX image file with the boot
    image files into a single bootable CD or DVD image.


    ```

    1. #!/bin/sh

    2. RELEASE=`cat release.txt`

    3. #

    4. if [ -f master/KNOPPIX/boot.img ]; then

    5.   rm master/KNOPPIX/boot.img

    6.   tar -zxvf boot/isolinux.tgz

    7. fi

    8. #

    9. mkisofs -pad -l -r -J -v -V KNOPPIX -no-emul-boot -boot-load-size 4 -boot-info-table
    -b boot/isolinux/isolinux.bin -c boot/isolinux/boot.cat -hide-rr-moved -o iso/"$RELEASE".iso
    master

    10. #

    11. sync

    12. sync

    13. if [ -n "$1" ]; then

    14.   if [ "$1" == "cd" ]; then

    15.     cdrecord -v speed=4 dev=0,0,0 -data iso/"$RELEASE".iso

    16.   fi

    17. fi

    18. cd iso

    19. md5sum "$RELEASE".iso > "$RELEASE".iso.md5.txt

    20. sync

    21. md5sum -c "$RELEASE".iso.md5.txt

    22. cd ../.

    ```


    The makeiso script can be found on the enclosed CD-ROM in the chapter11/remaster
    directory. The script is to be run from within your working directory. Note the
    following:


    +   - Line 2 provides the name of your ISO image file and checksum file.

    +   - Lines 4 through 7 allow for handling both Isolinix and Syslinux versions
    of DSL. Syslinux uses a boot.img for the boot files, whereas Isolinix uses a directory.
    These lines provide a mechanism to back up/restore your Isolinix'
  merge: -1
  img_proc: true
- pgno: 253
  md: "directory. The Syslinux boot.img is the standard DSL floppy image and therefore\
    \ does not need to be included in the backup/restore process.\n\n+   - Line 9\
    \ is the actual ISO creation. This combines the files in the master/ directory\
    \ into an ISO image file in the iso/ directory.\n+   - Lines 13 through 17 check\
    \ if the script was started with cd as an option. The script defaults with the\
    \ CD-ROM burner at device location 0,0,0. Using this option writes the new ISO\
    \ image to a CD-R.\n+   - Line 19 creates an md5sum checksum file for network\
    \ transport and verification.\n+   - Line 21 verifies the consistency of the checksum.\n\
    \n# Creating the Syslinux ISO Image\n\nMany older computers cannot boot Isolinux-based\
    \ CD-ROMs. These older computers are limited to an initial boot image that is\
    \ the actual size of a floppy disk. The older Syslinux boot loader uses just such\
    \ a mechanism.\n\n# The makesys Script\n\nThe makesys script can be found on the\
    \ enclosed CD-ROM in the chapter11/remaster directory. The script is to be run\
    \ from within your working directory to create a Syslinux bootable ISO image.\
    \ The following shows the contents of that script:\n\n```\n```sh\n#!/bin/sh\n\
    RELEASE=`cat release.txt`\n#\nif [ -d master/boot ]; then\n  tar -czvf boot.isolinux.tgz\
    \ master/boot/\n  rm -rf master/boot\nfi\ncp boot.img master/KNOPPIX/.\nmkisofs\
    \ -pad -l -r -J -b KNOPPIX/boot.img -c KNOPPIX/boot.cat -hide-rr-moved -o iso/\"\
    $RELEASE\"-syslinux.iso master\nsync\nsync\nif [ -n \"$1\" ]; then\nif [ \"$1\"\
    \ == \"cd\" ]; then\n  cdrecord -v speed=4 dev=0,0,0 -data iso/\"$RELEASE\"-syslinux.iso\n\
    fi\nfi\ncd iso\nmd5sum \"$RELEASE\"-syslinux.iso > \"$RELEASE\"-syslinux.iso.md5.txt\n\
    sync\nmd5sum -c \"$RELEASE\"-syslinux.iso.md5.txt\ncd ../.\n```\n```"
  merge: -1
  img_proc: true
- pgno: 254
  md: "Note the following about the makesys script:\n\n+   - Line 2 provides the name\
    \ of your ISO image file and checksum file.\n+   - Lines 4 through 7 allow for\
    \ handling both Isolinux and Syslinux versions of DSL. Syslinux uses a `boot.img`\
    \ for the boot files, whereas Isolinux uses a directory. These lines provide a\
    \ mechanism to back up/restore your Isolinux directory. The Syslinux `boot.img`\
    \ is the standard DSL floppy image and therefore does not need to be included\
    \ in the backup/restore process.\n+   - Line 8 copies the DSL standard boot floppy\
    \ to replace the `isolinux/` directory of boot files.\n+   - Line 9 is the actual\
    \ ISO creation. This combines the file in the `master/` directory and the `boot.img`\
    \ into an ISO image file in the `iso/` directory.\n+   - Lines 12 through 16 check\
    \ if the script was started with `cd` as an option. The script defaults with the\
    \ CD-ROM burner at device location 0,0,0. Using this option writes the new ISO\
    \ image to a CD-R.\n+   - Line 18 creates an `md5sum` checksum file for network\
    \ transport and verification.\n+   - Line 20 verifies the consistency of the checksum.\n\
    \n# Syslinux Initial Ramdisk\n\nTo change the Syslinux version of the initial\
    \ ramdisk, use the following procedure:\n\n+   1. Change directory to `master/KNOPPIX`.\
    \ There, you can find a file called `boot.img`. This file is really the same as\
    \ the `bootfloppy.img` used for boot DSL from an actual floppy diskette.\n+  \
    \ \n+   2. Make a mount point and mount the floppy image:\n+      ```\n+     \
    \ # mkdir boot\n+      # mount boot.img boot/ -t msdos -o loop\n+      ```\n+\
    \   \n+   3. Copy and unpack the minirt24.gz initial ramdisk:\n+      ```\n+ \
    \     # cp boot/minirt24.gz .\n+      # gunzip minirt24.gz\n+      ```\n+   \n\
    +   4. Make a mount point and mount the initial ramdisk:\n+      ```\n+      #\
    \ mkdir mroot\n+      # mount minirt24 mroot/ -t ext2 -o loop\n+      ```\n+ \
    \  \n+   5. As before with the Isolinux version, change directory into mroot and\
    \ perform necessary edits as previously described for boot modules or changes\
    \ to the boot script `linuxrc`. Just be aware that the Syslinux version’s initial\
    \ ramdisk must be within the size of a physical floppy disk."
  merge: -1
  img_proc: true
- pgno: 255
  md: 'To reverse the process and repack the initial ramdisk and related files back
    into the boot.img file, perform the following:


    +   1. Change directory out of mroot, unmount, and compress the initial ramdisk:

    +      # cd ..

    +      # umount mroot/

    +      # gzip -9 minirt24

    +   2. Move the compressed ramdisk back into the boot mount point:

    +      # mv minirt24.gz boot/

    +      mv: Overwrite "boot/minirt24.gz"? y

    +   3. Unmount the boot mount point and remove the work directories:

    +      # umount boot

    +      # rmdir boot/ mroot/


    # Building the DSL Qemu Embedded Version


    Virtualization is currently very popular. DSL has incorporated many features to
    make running DSL in a sandbox standalone virtual environment very easy. The creation
    of the zip image is also very easy, using your mkqemu automated script from within
    your working directory.


    # The makeqemu Script


    The makeqemu script is on the CD-ROM in the chapter11/ remaster directory. This
    script, as the others, is to be run from within the base of your working directory.
    The following shows the contents of the makeqemu script:


    +   1. #!/bin/bash

    +   2. RELEASE=`cat release.txt`

    +   3. rm iso/"$RELEASE"-embedded.zip

    +   4. cd qemu

    +   5. pwd

    +   6. cp ../master/KNOPPIX/KNOPPIX knoppix/.

    +   7. ../gnu/zip -r ../iso/"$RELEASE"-embedded.zip .

    +   8. cd ../iso

    +   9. md5sum "$RELEASE"-embedded.zip > "$RELEASE"-embedded.zip.md5.txt

    +   10. sync

    +   11. md5sum -c "$RELEASE"-embedded.zip.md5.txt

    +   12. cd ../..


    Note the following about the makeqemu script:


    +   - Line 2 names your distribution file.

    +   - Line 3 removes any preexisting copy of your distribution file.

    +   - Line 6 copies the compressed runtime image file into the qemu/ directory.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '+   Line 7 uses the GNU version of zip to make a compatible zip file of this
    release.

    +   Line 9 generates the checksum file.

    +   Line 11 verifies the checksum integrity.


    # Building the DSL VMware Edition


    Another popular virtualization system is VMware. DSL also supports this by publishing
    a VMX edition. Running the mkvmx script from within your working directory automates
    this process.


    # The makevmx Script


    The makevmx script is also on the CD-ROM in the chapter11/ remaster directory.
    This script, as the others, is to be run from within the base of your working
    directory. The following shows the contents of the makevmx script.


    ```

    1. #!/bin/bash

    2. RELEASE=`cat release.txt`

    3. rm iso/"$RELEASE"-vmx.zip

    4. cd vmware

    5. pwd

    6. sed "s/XXXX/$RELEASE/" ../dsl.vmx.txt > dsl.vmx

    7. cp ../iso/"$RELEASE".iso .

    8. ../gnu/zip -r ../iso/"$RELEASE"-vmx.zip .

    9. rm "$RELEASE".iso

    10. cd ../iso

    11. md5sum "$RELEASE"-vmx.zip > "$RELEASE"-vmx.zip.md5.txt

    12. sync

    13. md5sum -c "$RELEASE"-vmx.zip.md5.txt

    14. cd ../

    ```


    Note the following about the makevmx script:


    +   Line 2 names your distribution file.

    +   Line 3 removes any preexisting copy of your distribution file.

    +   Line 6 updates the VmWare configuration file for this release.

    +   Line 7 copies the complete ISO image file into the vmware/ directory.

    +   Line 8 uses the GNU version of zip to make a compatible zip file of this release.

    +   Line 11 generates the checksum file.

    +   Line 13 verifies the checksum integrity.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# Using a New Kernel for DSL


    So far in this chapter, you have seen how you can easily create a custom bootable
    MyDSL CD-ROM from a normal boot of your DSL/Frugal system. You have seen how you
    can remaster all four DSL images from the live DSL CD-ROM booted to runlevel 2.
    So how do you change the kernel in DSL? As always, there are many ways to accomplish
    this task. However, I find that it is best to perform this task from a traditional
    hard drive install of DSL.


    With a traditional hard drive install, you can be sure of correct permissions.
    You can use the standard make procedures. You can easily test your new kernel
    and modules in a traditional environment. Then, finally, after thorough testing,
    you can copy the new kernel and modules to the proper layout required by the DSL
    live CD-ROM system.


    # Compiling a New Kernel


    In keeping with my usual recommendation of always starting from a known state,
    let''s do so for this task as well.


    +   1. Boot from the live DSL CD-ROM using the install menu:

    +      boot: install

    +   2. Install to a Linux hard disk partition. I recommend you do a full install
    and use the Grub boot loader. I also recommend you edit the grub menu to boot
    to runlevel 2.

    +   3. Make and change to a typical source directory:

    +      # mkdir /usr/src

    +      # cd /usr/src

    +   4. Load utilities and compiler (these may be found on the enclosed CD-ROM):

    +      # mds1-load /cdrom/chapter11/kernel/gnu-utils.dsl

    +      # mds1-load /cdrom/chapter11/kernel/gcc1-with-1ibs.dsl

    +      # mds1-load /cdrom/chapter11/kernel/gcc-2.95.dsl

    +   5. Load the Linux kernel and cloop sources:

    +      # tar -zxvf /cdrom/chapter11/kernel/linux-2.4.31.tar.gz

    +      # tar -zxvf /cdrom/chapter11/kernel/cloop-2.01.tar.gz

    +   6. Configure the kernel for DSL:

    +      # cd linux-2.4.31

    +      # make menuconfig

    +      Load Alternate Configuration file: dsl.configure

    +      # patch -p1 < knoppix-kernel.patch

    +   7. Compile the kernel:

    +      # make dep

    +      # make clean

    +      # make bzImage'
  merge: -1
  img_proc: true
- pgno: 258
  md: '+   8. Compile the modules:

    +      # make modules


    +   9. Install kernel and modules:

    +      # make install

    +      # make modules_install


    +   10. Update modules dependencies:

    +       # depmod -a

    +       After successful build of new kernel and modules, reboot using those components
    and fully test them.


    DSL also uses a modified cloop module. DSL supports 64 cloop s. So we need to
    modify the source for cloop and build this module.


    +   1. Change to main source directory.

    +      # cd /usr/src


    +   2. Extract the cloop source files and change to its directory:

    +      # tar -zxvf /cdrom/chapter11/kernel/cloop-2.01.tar.gz

    +      # ln -s /usr/bin/gcc-2.95 cc

    +      # ln -s linux 2.4.31 linux

    +      # cd cloop-2.01/


    +   3. Modify a source file to up the cloop count to 64:

    +      # vi compressed_loop.c

    +      Change #define CLOOP_MAX 64


    +   4. Modify the Makefile for DSL:

    +      # vi Makefile

    +      Comment out the following line (line 9)

    +      # include $(KERNEL_DIR)/conf.vars

    +      Edit the following line (line 12)

    +      CKERNOPS: + -O2 -D_KERNEL__ ...


    +   5. Finally, make the modified module:

    +      # make all


    +   6. manually install this modified module and update the module dependencies:

    +      # cp cloop.o /lib/modules/2.4.31/kernel/drivers/block/.

    +      # depmod -a


    If you need to make additional cloop devices, the procedure is:


    ```

    # cd /dev

    # mknod /dev/cloop4 b 240 4

    # mknod /dev/cloop5 b 240 5

    ...

    # mknod /dev/cloopN b 240 N

    ```'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'This should be the minimum you need to have DSL running in the new environment.
    Of course, you may want or need to compile special modules for your particular
    hardware.


    After installing the cloop module, you should reboot your hard drive installation.
    This ensures a good test of the new kernel and modules, especially the new cloop
    module. Figure 11-11 shows the new 2.4.31 kernel and cloop module being used to
    successfully load xchat.uci.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_259_0.png)


    **FIGURE 11-11**  Load a MyDSL extension (xchat.uci) to check that the cloop driver
    is working.


    The final process is to copy the new kernel and modules over to a live CD-ROM
    environment. Compiling most new(er) kernels usually results in a kernel too large
    to fit on a single floppy disk. This is one reason why DSL has stayed with the
    current kernel. Being too large for a single floppy disk means no Syslinux version
    of the DSL CD-ROM. That means many older computers will not be able to boot the
    Isolinux CD-ROM. Therefore, the following discussion only addresses the setup
    of DSL using the Isolinux version.


    Let’s boot again from the standard DSL CD-ROM and set up your remaster working
    directory on the same partition that you installed DSL and have your new kernel
    and modules. Let’s assume it is hard drive partition hda4. To briefly review,
    follow these steps:


    +   1. **Boot DSL with minimal options:**

    +      ```

    +      boot: ds1 2 base norestore legacy

    +      ```

    +   2. **Mount the hard drive installation partition and change the directory
    to `/tmp`:**

    +      ```

    +      # mount /mnt/hda4

    +      # cd /mnt/hda4

    +      ```

    +   3. **Create the remaster directory and move there:**

    +      ```

    +      # mkdir remaster

    +      # cd remaster

    +      ```

    +   4. **Copy the remaster scripts from the enclosed CD-ROM:**

    +      ```

    +      # cp -a /cdrom/chapter11/remaster/* .

    +      # cp /cdrom/chapter11/remaster/.bash_profile .

    +      ```

    +   5. **Set up the working directory environment:**

    +      ```

    +      # ./setupFromCD

    +      ```'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'As was previously discussed in the working directory remaster method, the initial
    ramdisk contains the boot time modules and kernel. The first step to install your
    new kernel and modules for the live CD-ROM is to unpack the minirt24.gz. Recall
    that this file resides in your remastering working directory of master/boot/isolinux.
    Recall the procedure to unpack this file to gain access to the modules directory:


    +   1. Change the directory to the initial ramdisk file, unpack, and mount it:

    +      # cd master/boot/isolinux

    +      # gunzip minirt24.gz

    +      # mkdir mroot

    +      # mount minirt24 mroot/ -o loop

    +   2. Change directory to the boot time modules:

    +      # cd mroot/modules

    +   3. Copy over the new cloops module and selectively copy required SCSI modules:

    +      # cp /mnt/hda4/lib/modules/2.4.31.kernel/drivers/block/cloop.o .

    +      # cd scsi

    +      # cp /mnt/hda4/lib/modules/2.4.31/kernel/drivers/scsi/* .

    +   4. Unmount, repack, and clean up this process:

    +      # cd ../../..

    +      # umount mroot

    +      # gzip -9 minit24

    +      # rmdir mroot

    +   5. Copy over the new kernel:

    +      # cp /mnt/hda4/boot/vmlinuz-2.4.31 linux24

    +      # cd ../../..

    +   6. Copy over the remaining modules into the runtime image:

    +      # cp -a /mnt/hda4/lib/modules/2.4.31 source/KNOPPIX/lib/modules/.

    +   7. Update the runtime system map:

    +      # cp /mnt/hda4/boot/System.map-2.4.31 source/KNOPPIX/boot/.

    +      # chroot source/KNOPPIX

    +      # cd /boot

    +      # rm System.map-2.4.26

    +      # ln -sf System.map-2.4.31 System.map

    +   8. Remove references to 2.4.26 modules:

    +      # cd /lib/modules

    +      # rm -rf 2.4.26/

    +   9. Optionally remove unneeded modules for the runtime image:

    +      # cd 2.4.31/

    +      # rm -rf kernel/drivers/atm

    +      # rm -rf kernel/drivers/isdn

    +      # rm -rf kernel/drivers/telephony'
  merge: -1
  img_proc: true
- pgno: 261
  md: '```

    # rm -rf kernel/net/atm

    # rm -rf kernel/net/ipv6

    # rm -rf kernel/fs/affs

    # rm -rf kernel/fs/coda

    # rm -rf kernel/fs/cramfs

    # rm -rf kernel/fs/freefs

    # rm -rf kernel/fs/hpfs

    # rm -rf kernel/fs/ncpfs

    # rm -rf kernel/qnx4

    # rm -rf kernel/romfs

    ```


    +   10. Exit the chrooted environment:


    ```

    # exit

    ```


    # NOTE


    > You should remove existing SCSI modules from the initial ramdisk before you
    begin to copy any new modules you want to add. You only need to copy the ones
    that you will actually need to boot your system. This area can be greatly reduced
    if your systems do not use SCSI. The minimum needed to boot DSL is ide-scsi.i.o.


    The preceding module deletion was based on the actual DSL v2.x system. Your choice
    of module deletion is entirely up to you. If you do not need a firewall, the netfilter
    modules can be removed. If you do not need SCSI, much space can be saved by removing
    SCSI modules. The challenge for DSL is to provide enough modules for the public.
    You cannot go with the saying, "Well it works for me!" The modules in DSL have
    endured the test of time with many users and over several years.


    This completes the process of upgrading the kernel and modules. Continue on with
    the normal full remastering process as was previously discussed. To make the ISO
    from your working directory, simply run the ./makeimage script followed by the
    ./makeiso script.


    # SUMMARY


    This chapter has covered the spectrum with regard to remastering DSL. You have
    seen how simple it can be—from booting your typical and well-tested frugal system
    resulting in a complete bootable MyDSL CD-ROM to the full remastering using the
    working directory method.


    With full remastering, you saw how to have much more control over setting defaults
    and adding applications. You should also have gained an understanding of'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'the challenges of application removals. You also learned the process of creating
    all four of the DSL published images.


    Finally, you learned the most difficult part of remastering: compiling a new kernel
    and modules, then installing them all into the working directory of the DSL live
    CD-ROM remastering environment. Armed with this knowledge, you should now be able
    to create your own distribution, be it small or large, a live CD-ROM, or a virtual
    embedded system; it will be your own.'
  merge: -1
  img_proc: true
