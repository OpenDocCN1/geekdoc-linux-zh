- pgno: 241
  md: 'All the requirements of your project can be seen in Figure 11-10. Joe''s Window
    Manager, Gnumeric, AbiWord, GnuCash, and daemons are all there.


    # FULL REMASTERING


    There are many KNOPPIX remastering HOWTOs available on the Internet and in various
    publications. Because DSL is a derivative of KNOPPIX, all of these methods also
    should work with DSL. However, in this chapter, the remastering techniques actually
    used in the production of DSL are documented: from the initial setup from a DSL
    CD-ROM to the ISO creation of DSL Isolinix version, Syslinux version, Qemu version,
    and VMware version. The process is automated via scripts that are discussed here.


    # Setting Up from Published DSL CD-ROM


    Boot from the DSL CD-ROM with a Linux partition available. That partition is used
    to hold the source, master, and iso directories during the remastering process.
    I call my method the working directory method. All the scripts are run from the
    relative directory that you initially set up.


    > NOTE

    > If you don''t have an available Linux partition on your computer''s hard disk,
    you can create one using the cfdisk procedure shown in Chapter 8. If you don''t
    want to change the partitions on your hard disk, you could create a Linux partition
    on some other writeable medium (such as a 1GB USB flash drive).


    To begin, I boot DSL with these boot options:


    ```

    boot: ds1 2 base norestore legacy

    ```


    I use 2 to signal runlevel 2 (shell interface with no desktop) to maximize available
    resources. I include base and norestore to start from a known pristine state.
    I use legacy to not have any unionfs influence while creating the image. After
    DSL boots up, do the following:


    +   1. Mount a Linux partition and then change the directory to it.


    ```

    # mount /mnt/hda4

    # cd /mnt/hda4

    ```'
  merge: -1
  img_proc: true
- pgno: 242
  md: '+   2. Create a working directory to contain all of your files and directories
    and change to it:

    +   # mkdir remaster

    +   # cd remaster


    +   3. Copy over the scripts from the /chapter11 directory on the enclosed CD-ROM.

    +   # cp -a /cdrom/chapter11/remaster/* .

    +   # cp /cdrom/chapter11/remaster/.bash_profile .


    +   4. Create directories:

    +   # mkdir source master iso

    +   # mkdir source/KNOPPIX/


    +   5. Copy the contents of the CD-ROM to the proper directories:

    +   # cp -Rp /KNOPPIX/* source/KNOPPIX

    +   # cp -Rp /cdrom/index.html master/

    +   # cp -Rp /cdrom/boot/ master/


    +   6. Perform a final cleanup by removing the existing KNOPPIX image, and then
    sync all files:

    +   # rm master/KNOPPIX/KNOPPIX

    +   # sync


    As a result of the preceding steps, you now have your remastering working directory
    environment properly set up. After the setup scripts are copied to the working
    directory, you can automate the setup of the image remastering process by running
    the setupFromCD script contained in the working directory.


    The setupFromCD script is shown here:


    ```

    #!/bin/sh

    rm -rf source master iso

    mkdir source master iso

    mkdir source/KNOPPIX

    cp -Rp /KNOPPIX/* source/KNOPPIX/

    cp -Rp /cdrom/* master/

    rm master/KNOPPIX/KNOPPIX

    sync

    ```


    At this point, all files have been copied from the DSL CD-ROM to the source and
    master directories. I also use one other text file called release.txt. This is
    where I place the version number for the release I am working on, for example:

    ds1-3.3


    As you can see, release.txt is a simple, one-line text file. However, this makes
    it easy to change release numbers without having to remember where inside the
    main image file to update.'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'At this point, your working directory should contain the following files and
    directories:


    +   .bash_profile

    +   bootfloppy.img

    +   ds1.vmx.txt

    +   gnu/

    +   iso/

    +   makecd

    +   makeimage

    +   makeqemu

    +   makesys

    +   makevmx

    +   master/

    +   qemu/

    +   release.txt

    +   setupFromCD

    +   source/

    +   vmware/


    # Making Modifications, Additions, and Removals


    Two methods are available to access the DSL system for modifications, additions,
    or removals. The first method is direct; the second is called chrooting.


    # Changing Content with the Direct Method


    Use a full path to identify the location of your KNOPPIX source or change to that
    directory as your current working directory. For example, if your remaster directory
    were on the /mnt/hda4 partition, you could type:


    ```

    # cd /mnt/hda4/remaster/source/KNOPPIX

    ```


    Typically, I change the working directory on my mounted disk partition (for example,
    cd /mnt/hda4/remaster), then I prefix the commands to access the new source image
    files with source/KNOPPIX. From this point, my discussion will always be using
    the path relative to the working directory—that is, the directory containing the
    scripts, master, source, and iso directories.


    I mainly use the direct method. DSL is not pure Debian. Many packages, binaries,
    and scripts are not from the Debian repositories. Because of this and also the
    fact that often times using Debian implies the addition of many other unwanted
    packages, the direct method is usually used.


    Most of the time, new applications, scripts, and modifications are first applied
    to a live DSL CD-ROM or frugal system. Often, these additions can be made into
    MyDSL extensions, and, when fully tested, they simply can be extracted directly
    with the use of the tar -C source/KNOPPIX option. Another option that I frequently'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'use is to copy the new tar file to source/KNOPPIX and then later chroot in
    and do a tar extract as normal. Just be sure not to forget to delete the tar file
    sitting at the root (/) of the chrooted environment.


    Using this style keeps very tight control of what is added, changed, or deleted
    from the 50MB core DSL system.


    # Changing Content with the chroot Method


    You are now ready to issue the chroot command. The chroot method changes the root
    (/) directory to the directory containing the source files:


    ```

    # chroot source/KNOPPIX

    ```


    At this point, the new root directory is now pointing at the "root" of the DSL
    image. All file operations to copy, move, or remove files are relative to this
    directory. Be sure to exit from this chrooted environment before you continue
    the remastering process!


    Most often, when KNOPPIX remastering is discussed, it is usually the chroot method.
    Using this method gives you access to the source directory as though it is actually
    the root filesystem. This means you will see /mnt/hda4/remaster/source/KNOPPIX
    as though it were /. You now have full root shell access to what will become the
    root directory of the new image.


    To install certain packages, you need to mount the proc filesystem:


    ```

    # mount -t proc /proc proc

    ```


    Most likely, you want to install software from the Debian Woody repositories.
    For this, you need Internet access. Test your Internet connection by pinging a
    well-known server:


    ```

    # ping www.yahoo.com

    ```'
  merge: -1
  img_proc: true
- pgno: 245
  md: "Now, you are ready to install Woody packages. If you know you want packages\
    \ from other Debian repositories, edit the file at `/etc/apt/sources.list`. Here’s\
    \ an example of the contents of the `sources.list` file:\n\n```\ndeb http://archive.debian.org/debian-archive/\
    \ woody main contrib non-free\n#deb http://mirror.arrnet.edu.au/debian oldstable\
    \ main contrib non-free\n#deb http://mirror.linux.org.au/debian oldstable main\
    \ contrib non-free\n#deb http://mirrors.usg.edu/pub/linux/distributions/debian\
    \ oldstable\nmain contrib non-free\n```\n\nThe package Zile was used as an example\
    \ in Chapter 10, of how to install a package in Damn Small Linux using the MyDSL\
    \ facility. MyDSL is the normal approach for installing software in DSL. Another\
    \ way to install Zile software in DSL is by using the following command:\n\n```\n\
    # apt-get install zile\n```\n\nThe preceding procedure is most common with KNOPPIX-style\
    \ live CD-ROM systems. It is not normally used with DSL. The reasons are the same\
    \ as given in Chapters 5 and 10. Using a package manager can quickly overrun “the\
    \ small is beautiful” mantra of DSL.\n\nAs was shown in Chapter 10, many Debian\
    \ packages are first pared down into MyDSL extensions and then loaded into the\
    \ DSL core image via the direct method.\n\n> **NOTE**\n> \n> If you have mounted\
    \ the proc filesystem, be certain to unmount it before you exit the chroot environment.\n\
    \n# Adding Common Elements: Menu and Icon\n\nBecause DSL does not normally use\
    \ Debian packages, the menu item and icon have to be manually created. This area\
    \ was discussed at length in Chapter 10. This time, instead of being based off\
    \ of `/tmp` and `/home/dsl/.xtdesktop`, you must edit the following files:\n\n\
    ```\n/etc/skel/.fluxbox/menu\n/etc/skel/.jwmrc\n/etc/skel/.xtdesktop/\n```"
  merge: -1
  img_proc: true
- pgno: 246
  md: 'Here are suggestions for creating a menu item and adding a desktop icon:


    +   To create the menu item, edit /etc/ske1/.fluxbox/menu and /etc/ske1/.jwmrc.
    Because Zile is a console-based program and its path is /usr/bin/zile, our menu
    line item to be added looks like this:


    ```

    [exec] (Zile) {aterm -e /usr/bin/zile}

    ```


    +   The icon for Zile in /etc/ske1/.xdesktop/zile.lnk looks like this:


    ```

    table Icon

    Type: Program

    Caption: Zile

    Command: aterm -e /usr/bin/zile

    Icon: /home/dsl/.xdesktop/program.png

    X: 420

    Y: 384

    end

    ```


    > NOTE

    > I am using one of the generic icons available in DSL. Other generic icons are
    binary.png, gear.png, and shellscript.png. You may change the icon later by right-clicking
    the displayed icon. See Chapter 4, “Configuring and Saving DSL Settings,” for
    details.


    # Removing Applications


    Because DSL is extremely small in size and is not pure Debian, core applications
    are usually removed by force. This usually implies using the find command to locate
    all related files. Often, the command ldd is used to display all the dependent
    libraries used by an application.


    Still, the process of removing an application can be quite daunting. DSL’s compact
    and denseness is the result of much hacking code. For example, one of the common
    applications that many want to remove is Firefox. Using the standard approach,
    find / -name firefox does not reveal all that was used for Firefox in DSL. There
    are Firefox references in configuration files. The system configuration for unionfs
    contains references to Firefox. The file at /etc/init.d/mkunion needs to be cleaned
    of the Firefox references. From this example, you can see that to unravel DSL,
    dense and compact size can be a challenge.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# Other Customizations


    Other features you may want to customize include passwords, themes and backgrounds,
    default time zones, DSL-specific features, and the default desktop.


    # Setting Passwords


    You should always use the chroot method if you want to change passwords. Then,
    issue the standard command to perform this action.


    ```

    # passwd

    Changing password for user root

    Enter the new password (minimum of 5, maximum of 8 characters)

    Please use a combination of upper and lower case letters and numbers.

    Enter new password: (Password entered will not be displayed)

    Re-enter new password: (Password entered will not be displayed)

    Password changed.

    ```


    # Themes and Backgrounds


    The standard theme for DSLs Fluxbox desktop is /usr/share/fluxbox/styles/default.
    This is actually a link to the current default theme, envane. The background image
    is actually specified in the theme. In DSL, you typically use the Fluxbox rootCommand
    tag to specify the image. The default images available for Fluxbox are located
    at /usr/share/fluxbox/backgrounds.


    > NOTE

    > When using the direct method, always prefix the actual paths with source/KNOPPIX.


    # Language


    The default language, currently us, can be supplied as a boot option (lang=it)
    or by editing line 95 of the standard KNOPPIX script at /etc/init.d/knoppix-autoconfig.


    ```

    95 [ -n "$LANGUAGE" ] || LANGUAGE=us

    ```


    # Default Timezone


    The default timezone is related to the language selection inside the knoppix-autoconfig
    script. Between lines 97 and 340, you can find one very large case statement.
    This case statement assigns basic time and language settings, based on the language
    that is currently set. Depending on language selection, you'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'can also change the default timezone. For example, language en specifies a
    timezone of US/Eastern. This is where you can change it, for example, to US/Pacific.


    # DSL Specific


    Just as KNOPPIX uses a bash script from most of the boot time configurations,
    so does DSL. The script is located at /etc/init.d/dsl-config. Many boot options
    can be found here. This is where the processing of boot time MyDSL extensions
    occurs. It is where many of the daemon requests are processed. Most options unique
    to DSL are in the master boot time configuration file.


    # Default Desktop


    The default desktop can be supplied as a boot option (for example, desktop=jwm)
    or by editing the script at /etc/init.d/dsl-config line 240. This line, as it
    is set by default, sets the default desktop to fluxbox, if jwm isn’t specifically
    identified (probably from a boot option):


    ```

    240 case "$DESKTOP" in fluxbox|jwm) ;; *) DESKTOP="fluxbox"; ;; esac

    ```


    # Advanced Customizations


    More advanced DSL customizations can be used to directly modify the DSL boot process
    itself. This can include changing Isolinux boot loader files (such as boot screens
    and options), as well as modifying the initial ramdisk used when DSL first boots.


    # Boot Screen and Initial Boot Options


    Using the preceding remastering setup, the initial boot files for image, message,
    and default boot options are located at master/isolinux relative to your mount
    point and working remaster directory. The following three files are of interest:


    +   - **isolinux.cfg**: This is the configuration file for the Isolinux boot loader.
    It specifies the image to be displayed, the boot message, and all of the default
    boot options, as well as several boot images to load. This is a simple text file
    and may be edited with any text editor.


    +   - **boot.msg**: This is the initial displayed text that appears before the
    boot prompt. Again, it is a simple text file and any text editor can alter its
    contents.


    +   - **logo.16**: This is the image shown on the initial boot screen. This image
    file must be of the LSS16 image format. This is a 16-color, 640×480 image.'
  merge: -1
  img_proc: true
- pgno: 249
  md: "Other sizes or resolutions will not work. You can use the Gimp MyDSL extension\
    \ to edit and/or create a boot image file.\n\n+   - **f2 and f3:** These are the\
    \ help files displayed when the F2 and F3 function keys are pressed at the initial\
    \ boot prompt. These are text files and can be edited with any text editor.\n\
    +   - **minirt24.gz:** This is the initial ramdisk used to bootstrap DSL.\n\n\
    > **NOTE**\n> \n> The Syslinux version has these files packed into a floppy-sized\
    \ image. This is called `boot.img`. The unpacking and packing of this image file\
    \ will be discussed later, in the “Creating the Syslinux ISO Image” section.\n\
    \n# Default Boot Options\n\nThe default boot time options are stored in either\
    \ `isolinux.cfg` or `syslinux.cfg` depending on the CD-ROM master type you are\
    \ choosing. For your Isolinux-based remaster, the file to edit is located at `master/boot/isolinux/isolinux.cfg`.\
    \ This is a simple text file and can be easily edited. It is the APPEND line where\
    \ the boot options are specified.\n\n# The Boot Splash Screen\n\nThe boot splash\
    \ screen contains an image that is shown at boot time. This is the image shown\
    \ above the boot: prompt. This image is quite difficult to create as it is in\
    \ the LSS16 format. I have provided utilities in the `chapter11/remaster/gnu`\
    \ directory on the CD-ROM.\n\nThe usual procedure is to copy the image file `logo.16`\
    \ to a working directory on a machine running the X Windows System. To convert\
    \ the LSS16 to a format that Gimp can display, use the following:\n\n```\n```bash\n\
    # lss16toppm < logo.16 > logo.ppm\n# gimp logo.ppm\n```\n```\n\nAfter editing\
    \ or creating a new image file, use one of the utilities provided in the `chapter11/remaster/gnu`\
    \ directory: `giftoppm`, `pngtoppm`, or `bmptoppm`. Then, convert back to LSS16\
    \ format. For example, if in Gimp you saved the image as `.bmp`, use\n\n```\n\
    ```bash\n# bmptoppm < logo.bmp > logo.ppm\n# ppmto lss16 < logo.ppm > logo.16\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 250
  md: <!-- no content -->
