- pgno: 206
  md: '# FURTHER READING FOR THOSE INTERESTED IN MULTIBOOTING


    Those interested in multiboot systems may want to look at the Gparted LiveCD,
    which features the Gparted software. With this live CD, you will have the ability
    to resize, move, or destroy existing partitions.


    Gparted LiveCD URL is: http://gparted.sourceforge.net/


    For those who are interested in dual booting with grub, there is a good howto
    at tldp.org: http://tldp.org/HOWTO/Linux+win9x+Grub-HOWTO/index.html


    For those who are interested in multibooting with Lilo, there is another howto
    at tldp.org as well: http://tldp.org/HOWTO/Multiboot-with-LILO.html


    # ENABLING APT-GET WITH DPKG-RESTORE


    We provide a script that simplifies the process of enabling apt-get on your computer.
    Assuming your computer has Internet access, all you need to do is open up a Terminal
    window and type the following as root:


    ```

    # dpkg-restore

    ```


    This restores the missing apt utilities and populates your computer''s apt-cache
    with applications compatible with Debian Woody. We are pulling the application
    list from Debian''s archive. Remember that many applications inevitably overwrite
    the DSL framework, and you eventually end up with either a broken desktop or a
    classic version of Debian (if you download applications that overwrite your libraries).
    So, be careful and know what you want to do with your system.


    # SUMMARY


    We walked though the basic steps of installing Damn Small Linux conventionally
    on a hard drive, including hard drive preparation, and the installation process.
    As noted before, a conventional hard drive may not be the best choice for many;
    however there are special circumstances that make DSL a good fit for some computers,
    including limited RAM size.


    If you venture into a conventional hard drive installation of DSL, congratulations!
    I am sure that you have an interesting story as to why you elected to complete
    such an adventurous process. However, if it keeps an ancient computer out of a
    landfill, more power to you!'
  merge: -1
  img_proc: true
