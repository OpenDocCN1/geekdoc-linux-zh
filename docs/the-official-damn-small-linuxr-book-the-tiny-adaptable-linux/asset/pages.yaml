    \ -f /var/mediaframe/pics &\n    ogg123 -z /var/mediaframe/music\n    ;;\n   \
    \ ...\n```\n\nIf you want the default to change from frame to music, you can simply\
    \ change the default from 2 to 3 (or whatever the number is in your boot order)\
    \ in the /boot/grub/menu.lst file. If the software is installed the way you want\
    \ it now, you can get ready to start dismantling the laptop to create the digital\
    \ media frame.\n\nYou can hook up some speakers to your laptop if the ones on\
    \ the laptop do not play well from inside the frame. You will have three cords\
    \ coming out of the frame (power, network, and audio). If your sound isn’t working,\
    \ try opening the xMMs icon on the desktop. Select the play button on the X Multimedia\
    \ System player to configure the OSS sound. Then, play a test sound.\n\n# MODIFYING\
    \ THE LAPTOP HARDWARE\n\nFor several reasons, you won’t spend a lot of time on\
    \ the hardware aspects of this project. For one thing, the focus of this book\
    \ is Damn Small Linux, so the software is our primary interest. For another, it’s\
    \ hard to know the exact hardware you are starting with, since we suggest beginning\
    \ with some laptop you can pick up for under $100.\n\nAs a result, in this section,\
    \ I tell you the specific pieces I put together to build the project. Then, I\
    \ present a bunch of tips that might help you with problems you might encounter\
