- pgno: 275
  md: 'If you have never tried working on a silent computer, you really do not know
    what a joy it can be. The only noise you hear is what you want to hear (e.g.,
    some music or a radio stream). I have heard many computer users say that after
    they go silent, they could never again use a noisy computer.


    There are silent computers on the market, and some high-end units cost several
    thousand dollars. There are also Mini-ITX-based small form factor PCs specially
    built to be silent, but these also tend to be very expensive (frequently on the
    plus side of $800 for a basic unit). These computers are often priced expensively
    because they are produced in limited quantity as a special order. To have an affordable
    silent PC, the units need to be made in mass amounts, but this is too much of
    a niche market to occur.


    # The Thin Client as a Silent PC


    Thin clients are plentiful and many are affordable. Often, they are silent with
    no moving parts, and instead, relying on passive cooling to lower the temperature
    of the CPU.


    Computers designed to be thin clients can also be very small and attractive. Many
    of the more modern thin clients have some provision for on-board storage, such
    as an IDE flash, a built-in compact flash reader, or provisions for a laptop-size
    hard drive. Many of the newer thin clients can also boot via USB.


    Thin clients are often priced under $300. Used ones can be bought for next to
    nothing at sites like eBay, although they are usually the older models that tend
    to be underpowered.


    Two of the most popular models we sell in the DSL store are the eBox III, a.k.a.
    the Damn Small Machine (DSM), and a Mini-ITX-based thin client from Taiwan, which
    we call the Bargain BareBones. Both are intended for the thin client market, so
    they are affordable, but they are also well suited to running DSL. Figure 12-4
    shows an example of the eBox III.


    The DSM has embedded RAM, which means that it is fixed at 256MB. This amount is
    really not enough to run one of the name-brand operating systems well, but it
    is plenty to run DSL. As it comes, the DSM can boot right off of a USB pen drive,
    so there is no need to use an IDE drive at all if you choose.


    You do have a few options for IDE booting if you prefer this option. You could
    opt for an IDE DOM (disk on module) specifically made for the DSM. In addition,
    the DSM has provisions for a laptop-size hard drive. Thus, you can use a conventional
    hard drive, but you can also opt for a conventional CF card mounted to a IDE CF
    adapter. The motherboard is powered by a Via 700MHz Nano processor, again, plenty
    of power for DSL. Figure 12-5 shows our BareBones machine next to a more typically
    sized Mini-ITX case.'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'FIGURE 12-4 The eBox III, a very compact machine with room for a hard drive.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_276_0.png)


    FIGURE 12-5 Compare the size of the BareBones to a typical Mini-ITX case.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_276_1.png)


    The Bargain BareBones is an example of a Mini-ITX-based thin client. Again, the
    design is very small, much more compact than a typical Mini-ITX computer. The
    BareBones was never intended to be a standalone work station, and it has no provision
    for a hard drive or a media drive. Although the unit comes without RAM, it accepts
    184-pin DIMM socket DDR RAM up to 1GB.'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'Unlike the DSM, the BareBones cannot take a hard drive, but there is room for
    an IDE DOM; at the DSL store, we have 1GB units available. The DOM is not needed
    if you are content with booting via USB.


    Personally, I use one of each of these thin client computers. I have the DSM in
    my home office and the BareBones at work. Each of them has an IDE DOM, but I do
    not use them for booting. Instead, I only use them for occasional backup when
    I have important documents I want to save on them one place.


    I go back and forth between the two units using a single bootable pen drive that
    I use as my portable office. This way, regardless of where I am, I have my desktop
    the way I like it and I can continue working from the point at which I last stopped.
    DSL’s auto configuration automatically sets the ramdisk according to the available
    RAM.


    Other than this adjustment, I have the same system, same files, same everything
    on both thin clients. It is a nice way to work. Unlike the traditional use of
    these computers as thin clients, I am not dependent on any network for my files
    or applications, and I have all my work with me on the pen drive.


    If you are not the mobile type, you may want to consider running DSL from an IDE
    drive, whether it is a hard drive (DSM), IDE CF conversion (DSM), or disk on module
    (DSM or Bargain BareBones). The units are self-contained with this approach. The
    fact that most of the newer thin clients can boot from USB makes installing to
    an IDE drive easy. Simply boot up DSL via USB and perform a Frugal install (see
    Chapter 8).


    # Green Machines


    In general, alternative hardware is often environmentally friendly, whether it
    is a driverless homemade PC, a Mini-ITX system, a discarded laptop, or a thin
    client converted to run as a desktop PC. You can feel good about using less energy
    than with a conventional computer. In addition, when working with used equipment,
    you are keeping usable systems out of landfills. By using Damn Small Linux, you
    are contributing to a healthier planet. Now about that SUV…..


    # SUMMARY


    Alternative hardware is often cheap, silent, and very energy efficient. With the
    alternative installation methods available for DSL, such as the USB and Frugal
    installations, you have an operating system that is perfect for such systems.'
  merge: -1
  img_proc: true
