- pgno: 103
  md: 'desktop restarts and any open windows will be closed. So be sure to save your
    work before you click OK.


    # CONNECTING TO THE NET


    To connect to the Internet or other network, DSL includes configuration tools
    for configuring modems, wired Ethernet, and wireless Ethernet connections. If
    your computer has a physical wired Ethernet connection capable of accessing the
    Internet, it may come up automatically, without your having to do any configuration.
    If manual configuration is needed, refer to the following sections.


    # Configuring a Modem


    DSL supports dialup modems that are hardware based. Most all external modems are
    hardware based. There is a class of modems that are not fully functional hardware
    devices. This class of modem is called WinModems. WinModems have their firmware
    created specifically to run on Microsoft Windows. So, to Linux these devices don’t
    behave like standard modems.


    As you might expect, most Linux distributions have limited support for WinModems.
    In fact, some WinModems are proprietary. DSL supports the most popular of the
    WinModems, the Lucent Technologies Ltmodem.


    From the DSL Control Panel icon, click Dialup; or from the main menu, click System,
    Net Setup, and finally Dial-up PPP. A PPP Dial pop-up window appears, as shown
    in Figure 4-12.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_103_0.png)


    **FIGURE 4-12**  Select a provider name when you configure a PPP dial-up connection.


    To begin the setup for a dial-up PPP connection, click the Config button. The
    setup goes through many screens. The first one is the pppconfig main menu, shown
    in Figure 4-13.


    The main screen allows creating, changing, and deleting individual ISP provider
    information. Let’s step through the creation of a provider connection. Tab down
    to OK and press Enter.


    The next screen prompts you for a unique name for this connection record. You
    should use simple, one-word identifiers. For example, your employer’s connection
    information could be called work, or office. Notice that the name must not contain
    spaces. After you have entered the name, tab down to OK and press the Enter key.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# **FIGURE 4-13**  Begin setting up a PPP connection.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_104_0.png)


    The next screen, shown in Figure 4-14, is very important. It determines how your
    ISP provides nameserver information. The nameservers provide access to sites on
    the Internet by name. Without a correctly working nameserver, it will appear that
    your access is down.


    # **FIGURE 4-14**  Choose a dynamic or static DNS service.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_104_1.png)


    The next step is to specify the handshaking method to verify authentication. Usually,
    PAP is used and should be highlighted, as shown in Figure 4-15.


    The next step presents you with the username screen. In this screen, you should
    replace the sample text with the login name that your provider has assigned to
    your account. Most times, this is a single word. Sometimes, it contains the ISP
    name,'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'such as username@ispname. You should use exactly what your ISP has given to
    you. Then, you should Tab to OK to continue.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_105_0.png)


    You are then presented with your password screen. Enter the password that was
    provided by your ISP. You must enter it exactly as provided. Then Tab to OK to
    continue.


    The modem speed screen is displayed; it is normal to leave this screen with the
    default value. Press Tab until OK is selected and press Enter to continue.


    The modem method of dialing screen appears. You should use the default Tone unless
    you happen to still use Pulse dialing. Tab to OK and press Enter.


    Next, enter the number to dial to access your ISP. Do not include dashes or spaces.
    Enter as all numbers. Tab to OK and press Enter to continue.


    The next screen prompts you to search for your modem. Tab to Yes and press Enter
    to continue. Usually, you have to specify your modem device. This is true if you
    happen to be using a WinModem. The only WinModem that DSL supports is the Lucent
    WinModem.


    If you are presented with the screen shown in Figure 4-16, use the help text to
    convert COM ports to DSL required device names. In Figure 4-16, I have entered
    the DSL device for COM2. Now, if you happen to have the Lucent Winmodem, you type
    in /dev/ttyS14. After you have entered the device name, Tab to OK and press Enter
    to continue.


    The screen shown in Figure 4-17 displays a recap of all your specific data. It
    is very important to notice that you must select Finished, then Tab to OK and
    press Enter.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# FIGURE 4-16 Enter the Linux device name that represents the COM port connected
    to your modem.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_106_0.png)


    # FIGURE 4-17 If your PPP dial-up settings look correct, select OK to save those
    settings.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_106_1.png)


    # NOTE


    All of your setup information is in your backup and restore. You do not need to
    edit or prepare any other files. Use the simple backup and restore procedure already
    discussed.


    Upon completion of your modem setup, you are returned to the dialup dialog box.
    Simply enter the provided name and click the Dial button. Another window opens
    and displays all the messages while the communication link is being established.
    You do not need to concern yourself with the details of these messages. However,
    if an error occurs, you need to know what that may be for further assistance either
    from your ISP or the DSL forums. Near the end of the messages log, there is a
