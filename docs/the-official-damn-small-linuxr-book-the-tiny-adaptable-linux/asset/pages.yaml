- pgno: 113
  md: 'For example, let''s assume that you do not have a network printer and instead
    you chose a local parallel/USB printer, option 1 on the interface setup screen.
    In that case, instead of a network screen, you see a device selection screen.
    Because DSL is Linux-based, you select from the Linux options. Typically, printers
    are connected directly to LPT1 port. So, for a parallel connected printer, you
    enter a full path to the Linux device on LPT1, which is /dev/lp0; or, if your
    printer is connected via the first USB port, you enter /dev/usb/lp0.


    After you have selected your printer device, you again return to the main setup
    screen. Notice on the main setup screen, as options are selected, they appear
    on this screen. You are now ready to select the paper format for your printer.
    Select option 3 from the main setup screen.


    # Paper Format


    Obviously, paper format selection is one of the easier selections to make (see
    Figure 4-25). Select your paper size and press Enter.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_113_0.png)


    The main setup screen again appears with your selections shown.


    # Printing a Test Page


    You have now selected the three necessary options in order to print. But first,
    you need to test your selections. To try out your selections, input T to print
    a test page, as shown in Figure 4-26.


    The Test Page screen prompts again for the letter T and a follow-up y. Enter those
    values and press Enter. A screen appears showing commands sent to your printer.
    You should not concern yourself with these details. If the test page prints successfully,
    press Enter to return to the main menu setup screen.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# FIGURE 4-26 Print a test page to make sure the printer is working properly.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_114_0.png)


    If your test page did not print anything, you may need to go back to the main
    menu (see Figure 4-27) and check your printer interface to make sure the full
    path is exactly as shown on the screen example and that there are no typing errors.
    If your printer tried to print but failed to produce a useful result, you must
    go back to step 1 from the main menu and try a different printer driver. You do
    not need to reenter all three steps. Only change a single item and try the test
    page again. If you have trouble finding a printer driver, check to see if your
    printer has an emulation mode, where the printer itself can be set to appear as
    a different, usually more generic printer that is supported by Apsfilter.


    After a successful test page is produced, you are ready to install your printer
    specifications. From the main menu, enter I as your choice.


    You are prompted to enter a name for your printer, as shown in Figure 4-28. The
    default is lp. If you have several printers, you might want to enter something
    else.


    Be aware that no spaces are allowed in the printer name; you may instead use an
    underscore. For example, I could name my printer HP_4050_TN. Upon entering a name,
    another screen is displayed showing the results of the setup. Press Enter to continue.


    The name that you entered for your printer is used to identify which printer an
    application will print to. After this step is finished, you have completed the
    setup. At this point, the main menu screen again appears and you might want to
    continue to set up another printer or enter Q to quit. Upon selecting the quit
    option, you are again presented with several information screens. Simply press
    Enter until the application exits and you are returned to the DSL control panel.


    From the DSL control panel, you should select Printing/lpd to start the printing
    queue. Alternatively, you can use the main menu and select System, Printing/lpd,
    Start.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '![](img/af53325d7f38f1cdafca9f44568e4ab8_115_0.png)


    FIGURE 4-27 Check that your printer settings are correct.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_115_1.png)


    FIGURE 4-28 Enter a name for your printer or use the default lp name.


    You are now almost ready to begin printing from any of the DSL applications. Remember
    when you had to name your printer? How can you specify the printer to each application?
    The easiest way is to use an environment variable. You can open terminal window
    and type export PRINTER=the_name_we_gave_our_printer. Doing this eliminates having
    to specify the printer name in each invocation of printing from each application.
    You have set up the system default printer.


    Now that you have your printer set up and working, how do you back up the printer
    specifications? Upon a normal shutdown, the system detects that a printer setup
    was attempted. You are prompted to save your printer setup. If you confirm, the
    saving is automatic. Upon reboot, the only necessary step is to start the printing
    daemon from the DSL control panel.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# SAVING YOUR SETTINGS ON THE WEB


    DSL has always had the goal of being a nomadic desktop operating system. You have
    seen the backup and restore procedure. You have seen the configuration of many
    custom tools. But sometimes, these tools and their settings are specific-to-specific
    hardware. Some of your saved configurations apply everywhere. Perhaps you would
    like to save these generic machine agnostic settings to the web, so you can restore
    them from anywhere that you have web access.


    We refer to the procedure for saving generic DSL settings so you can restore them
    later over the web as a Webdata backup. To use the Webdata backup feature, you
    must have a preexisting and fully functional FTP account.


    Begin setting up your own Webdata backup by looking at the .webdata.lst file (/home/dsl/.webdata.lst).
    It is just a sample of what files to back up to the ftp site. The .webdata.lst
    file is very similar to .filetool.lst. Just use your choice of text editor to
    add or remove lines from this file. All items specified in this file are included
    in the web backup. It is up to you. Just be aware of not including machine-specific
    data.


    The following shows the contents of the default .webdata.lst file:


    ```

    home/dsl/.webdata.lst

    home/dsl/Mail

    home/dsl/.sylpheed

    home/dsl/.mozilla

    home/dsl/.vimrc

    ```


    After backing up the file .webdata.lst itself, the file notes other items from
    /home/dsl to back up. The Mail folder is the default location where your mail
    client (Sylpheed) will save your mail and the .sylpheed directory is where it
    saves its settings. In the .mozilla directory, your web bookmarks, history and
    other web browsing settings are stored. The .vimrc file is the configuration file
    that holds settings related to the vi text editor. You will want to add files
    and directories to the .webdata.lst list that contain the settings and data for
    the applications you use on a regular basis.


    As already noted, files that you are less interested in saving are those that
    are related to a specific machine, since this type of backup is meant to be shared
    by different machines as you travel to different locations. So, for example, the
    home/dsl/.xserverrc file is specific to your particular display and video card,
    so it might not work on a different machine. Better to have that sort of information
    detected and set at boot time.'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'Once you have your .webdata.1st file set up as you would like, use the following
    procedure to perform the Webdata backup:


    +   1. From the main menu, select System, Webdata Backup/Restore. The window shown
    in Figure 4-29 appears.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_117_0.png)


    # FIGURE 4-29 Choose a location on the web for backing up your data.


    +   2. In the Webdata Backup/Restore window, enter the following information:


    +   - FTP URL—Enter the host address (hostname or IP address) of your ISP''s FTP
    server.


    +   - Login—Enter your ftp login name needed to get read/write access to this
    FTP server.


    +   - Password—Enter your ftp password for the user login.


    +   - Datakey—Enter a password to be used to access the encrypted data. Type any
    password you like, but be sure to remember it. You will need it later to restore
    your backup.


    +   3. Select Backup. The program displays the ftp connection messages. If everything
    works properly, a data.des file will be copied to the home directory for the user
    account you used to access the FTP server. If something fails, look at the terminal
    window that opened. It should indicate if you typed the wrong host name, user
    name, or address, or if the server is otherwise not available.


    +   4. To restore the data, simply run this GUI program again and select Restore.
    With the data backed up to a public FTP server, you should be able to access your
    data the next time you boot DSL from any machine that has an Internet connection.


    Be sure that you know your encrypted password; otherwise, no one is going to be
    able to help you. Of course, the upside to that is that no intruder who gains
    access to the FTP server will be able to access your backed-up data without knowing
    that password.


    The .netre file is automatically created in /home/dsl when running the webdata
    script and then is destroyed upon completion. This is for security reasons and'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'also not to interfere with the use of the ftp GUI program that you may need
    for other servers or uses.


    I don’t think it would make sense to back up the entire home/ds1 as the purpose
    is to allow you to move from machine to machine and have access to the data that
    would be machine independent. The main point is to have your data available from
    anywhere that you can connect to the web.


    But as always, you have the flexibility to do whatever you want or need to do.


    # SUMMARY


    Having the tools to set up your Damn Small Linux desktop the way you want is important
    to making DSL a fun system to work with. Being able to save the files and settings
    you accumulate as you use Damn Small Linux is critical to making DSL more valuable
    from one reboot to the next.


    DSL offers tremendous flexibility in choosing which files and directories to backup,
    as well as where you want those backups to go.


    Once you know how to do a basic backup, this chapter describes ways in which you
    might want to configure and customize your desktop. Configurations include different
    ways of setting up network connections, using dial-up, wireless or wired LANs.
    It also includes procedures for configuring a printer. Customizations include
    ways of setting your background, arranging icons, and choosing screen resolutions.


    To make your Damn Small Linux system more mobile, this chapter describes how to
    backup your data to an FTP server on the web. Later, you can restore your data
    (such as web bookmarks, mail folders, and editor settings) from any computer from
    which you can boot DSL and gain access to the web.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# Extending Applications with MyDSL


    This chapter covers the what, why, and when of the process of adding applications
    to Damn Small Linux (DSL) live CDs. We call this process the *MyDSL system*. The
    additional applications are called *extensions*.


    These extensions can be added to your system in many ways. I''ll describe how
    to use the MyDSL system from the simplest GUI, which steps you through the process,
    to the usual downloading via a web browser, and finally how to download and install
    from the command line.


    After you have an extension, you most likely want to save it for future use. I
    will discuss how these extensions should be saved and the use of a persistent
    store. Discussions include how to automate a hands-free boot with your favorite
    application extensions loaded and ready to use, as well as the tradeoff of hands-free
    and boot time speed. The last section of this chapter contains a discussion of
    some common setup and usage errors.


    # INTRODUCING MyDSL


    To expand beyond the software that comes on the standard 50MB DSL live CD, we
    created the MyDSL system. MyDSL has become one of the most successful features
    of DSL. You can use the MyDSL system to add software extensions to your running
    DSL system, save extensions for later use, and even create your own extensions.


    # Overcoming Shortcomings of Hard Drive Installations


    If you have participated in Damn Small Linux forums in the past (http://damnsmalllinux.org/cgi-bin/forums/ikinboard.cgi),
    you may remember the'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'advantage posts from the forums. These posts discussed how live CD users were
    always at a disadvantage when it comes to selection of applications. The typical
    live CD contains the selection of applications that the distribution maintainers,
    such as John and I, have selected. Their choices may not be your choices.


    At the time, it was not possible to add applications to live CD systems. Therefore,
    most live CD offerings were huge with as many applications that could be packed
    onto a CD. Users wanting to install additional software knew hard drive installs
    were the way to go. Besides, that was the way it was always done: Get a CD and
    install it to your hard drive. After a system is installed, the Debian Apt system
    is an excellent tool for adding applications.


    How is it possible for a 50MB distribution to compete? During these early days,
    DSL had many who copied DSL and remastered it, only to offer a few more applications
    and add a few more MB. Some of the remasters would wholesale copy every new feature
    that was created for DSL. My thoughts turned to wanting to offer something different.
    I wanted something that could compete with the slightly larger remasters.


    I did not want to be just bigger. I did not want to abandon our users on smaller
    hardware, or the 50MB limit. But I also wanted to offer the advantage to live
    CD users that it seemed only hard drive installed users had. My solution was to
    be able to easily add software without the complex remastering process. To allow
    users to easily create any sized ISO they wanted. This would allow DSL to compete
    with the slightly larger distributions. DSL would become variable sized.


    # The Birth of MyDSL


    With the accumulated experience of the previous milestones, I set out to create
    the MyDSL system. I had to keep in mind the less capable hardware that DSL had
    built its reputation on. I began by leveraging John’s breakthrough techniques
    of download scripts, along with my writable /opt for shared apps. As proof of
    concept, I adapted and packaged the OpenOffice.org office suite as the first MyDSL
    application under the name openoffice.


    I created openoffice as a simple gzipped tarball and dropped it into /opt. I then
    created boot time options to load the software from that package back into /opt.
    That way, the package didn’t have to be included in the base DSL system. It also
    meant the package wouldn’t have to be included in the backup/restore process,
    which would have been a huge burden to bear every time DSL shut down. I then added
    a separate software package (oo-user.tar.gz) to hold the icon and menu items specifically
    for DSL as a live CD and for the default user ds1. This was going to work!'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'I tried adapting other applications to include in the MyDSL system. Some apps
    would need a small wrapper script to force the library and bin paths to be under
    /opt. Still more features were needed to make other apps work. I had seen a DSL
    user’s script that made more of the file system writeable to make the Opera browser
    work in DSL. I emailed him and asked his permission to use some of his script.
    Opera was never included in DSL because it is ad sponsored. I broke off the parts
    that I wanted and modified them to what I had in my mind.


    Using the features I just described, I could offer a tiered approach to boot time
    loaded modules. At about the same time, I became fascinated with mountable applications.
    I formatted these applications as compressed images (adding a .ci to those files).
    I quickly changed openoffice to openoffice.ci. This would really help in reducing
    systems resources as the application was mounted, so it could be used from that
    mount point, instead of being copied into memory. Later, I combined the ci file
    and its associated user file into a single file (with a .uci suffix).


    Finally, I put together six example modules. Today, they are called *extensions*.
    I also made a small simple script to quickly and easily create a custom mydsl.iso
    and burn it to CD. That script and other remastering are covered in Chapter 11,
    “Setting Up a Full Remastering Environment.”


    Being able to combine a DSL live CD with multiple extensions overcomes some deficiencies
    that live CD users face that might otherwise push them toward hard drive installs.
    DSL emerges as a very flexible, any-sized distribution with MyDSL.


    # Loading Extensions Dynamically


    After the release of sample MyDSL extensions and the mkmydsl custom CD maker,
    the most requested feature was to load the extensions without requiring the user
    to make a CD.


    John and I were a little hesitant at first. We were concerned because of bandwidth.
    If users became lazy, they would just download the extensions every time. So,
    I made a boot time option to specify a persistent store for the extensions. This
    was to be specified by mydsl=hdxx, where hdxx would be replaced by the name of
    the hard disk partition on which the extensions would be stored (such as hda1
    for the first partition of the first IDE hard disk).


    I added the code for dynamic loading. A GUI front end to the MyDSL system was
    created. Today, DSL even offers more extensive type thanks to unionfs, another
    mountable extension type. Unionfs is a special file system type that allows users
    to add or change files anywhere in the file system, instead of just the /opt and
    /home/dsl directories. With unionfs, changes to the DSL file system are stored
    in a special directory (usually in RAM) named /ramdisk that is overlayed on the
    entire file system.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# Exploring the MyDSL Software Bazaar


    The MyDSL system has become a huge success. MyDSL offers four extension types.
    Two of them are mountable. Because the MyDSL extensions are mounted, instead of
    being loaded into RAM, even users with low-memory systems can enjoy the advantage
    of using these extensions.


    The process of creating MyDSL extensions was made public so that the community
    of DSL users could join in the fun and feeling of ownership by sharing the software
    packages they create. In fact, this was also a design goal. John and I would stay
    focused on the core DSL, only creating and providing infrastructure that the community
    would need.


    Many members of the DSL user community have contributed many software titles as
    MyDSL extensions. These applications are usually repackaged from Debian packages,
    but can also be compiled from sources. Details of this building process are covered
    in Chapter 10, “Adding Applications and Creating Shareable Extensions.”


    For the user of the MyDSL system, it is an easy graphical click-and-load method
    of installation. In fact, most find it easier to add software using MyDSL than
    many other package management systems.


    Although hard drive installed users may use the features of MyDSL, there is no
    uninstall feature. Having no uninstall feature isn’t a problem when you run DSL
    from a live CD because you can remove the extension from the pen drive or hard
    disk where the extension is stored. The next time you reboot, the extension will
    be gone. For a hard drive install, there is no easy way to remove extensions after
    they’re installed.


    > NOTE

    > Hard-drive-installed systems should continue to use the full Debian package
    management system for adding and deleting software. MyDSL was designed for live
    CD and emulations thereof.


    From this point, all of my discussion is from the point of view of running a live
    CD or emulation to work with the MyDSL system. I will start with the most automatic
    and therefore recommended way. Because the MyDSL extensions are hosted on various
    mirrors on the Internet, you must have a working Internet connection.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# Using Desktop Icon for Easy Point-and-Click Access


    On the standard DSL desktop, you will see the MyDSL icon. That icon is your entry
    point to adding software that is packaged for the MyDSL system.


    # Using the Desktop Icon


    Click the MyDSL desktop icon to access the graphical user interface of the MyDSL
    system. Figure 5-1 shows an example of that icon.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_123_0.png)


    FIGURE 5-1 The MyDSL desktop icon.


    Occasionally, you may see the Extension tool with a blank screen, rather than
    displaying available extensions. The cause of this could be that you are not connected
    to the Internet. If you have a working Internet connection, it is most likely
    that the configured MyDSL download mirror cannot be accessed. If this is the case,
    you can access the DSL panel to select a different mirror server to use. See the
    “Changing Download Repository Mirror” section discussed in this chapter.


    # Displaying the Extension Tool


    If DSL can connect to a working repository, the MyDSL Extension tool displays
    all the software categories available from the online repository. Categories include
    the testing area, as well as a browser for loading extensions stored on a local
    disk. Figure 5-2 shows an example of the MyDSL Extension tool.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_123_1.png)


    FIGURE 5-2 Display available software categories from the Extension tool window.


    The following is a list of categories that appear in the MyDSL Extension tool
    window:


    +   - Apps—General category of applications.

    +   - Multimedia—Applications for audio and video playback and editing.

    +   - Themes—Packages to help customize the look and feel of your desktop.

    +   - Games—Yes, you can play games on Linux...

    +   - Net—Anything related to networking and the web.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '+   - **UCI**—General category of self-contained mountable applications.

    +   - **UNC**—General category of Unionfs mountable applications.

    +   - **Gtk2**—Applications that require the Gtk2 runtime.

    +   - **System**—Tools and utilities for managing, tweaking, and monitoring your
    system.

    +   - **WM_Apps**—Alternative window managers and tools specific to window managers.

    +   - **Testing**—General category of newly created extensions (use caution).

    +   - **Load Local**—Opens a typical file browser to extensions saved on your
    drives.


    > **NOTE**

    > The testing area includes newly submitted packages from the DSL user community.
    These packages should be considered experimental and need testing and feedback
    before they are moved into the regular area. Use with extreme caution.


    In addition to these 12 categories for extension classification, there are four
    extension types:


    +   - **tar.gz** is the simplest type. It must install to the only native writeable
    area for DSL. This means it must unpack to `/opt` and therefore must be self-contained.

    +   - **.dsl** is also based on the use of the `tar` command. However, this extension
    type causes much of the file system to become writeable.


    > **NOTE**

    > In earlier DSL versions (legacy boot), only `/home`, `/opt`, and `/tmp` directories
    were writeable. Most of the remaining file system was mounted read-only. Because
    the `.dsl` extension types are simply extracted to the root of the file system,
    much more of the file system potentially has to be writeable for those installs
    to work. Therefore, installing a `.dsl` extension causes a check that the system
    script `mkwritable` has been run to make the whole file system writable.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '+   - .uci type extensions are compressed loop images that are self-contained
    and mount under the /opt directory. All tar.gz extensions can easily be made into
    a uci type.

    +   - .unc represents our latest extension type. Extensions of this type can only
    be used on later versions of DSL that support the unionfs file system. These extensions
    are compressed cloops that mounts into the base file system.


    Don’t worry about fully understanding these extension types. Only know that both
    UCI and UNC are the preferred types. Both of these are mounted and therefore use
    considerably less system resources than the other two. Because these extension
    types are mounted, you can return your system to a pristine state by simply unmounting
    the extensions or rebooting. This is true no matter which type of the many installation
    types DSL offers is being used. You can save even more /ramdisk space by storing
    your UCI and UNC extensions on your hard disk or pen drive.


    The tar.gz and .ds1 should really only be used if no other version of the extension
    is currently available and your system has the resources to support them. Because
    the tar.gz and .ds1 types copy all files from the extension file to separate locations
    in the file system, a low memory system can quickly run out of space in /ramdisk,
    as well as run out of inodes (one is consumed for each file and directory).


    Now, let us continue with the normal procedure to use and enjoy the MyDSL system.


    # Choosing and Getting Extensions


    When you click one of the extension categories, an extension browser opens and
    displays a list of all available MyDSL packages in that category. For example,
    click the UCI category to see the list of UCI extensions shown in Figure 5-3.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_125_0.png)


    Clicking one of these packages displays its info file providing information about
    the extension. This includes the name and web address of the program’s creator,
    a brief description of the program, and any additional info that might be needed
    to'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'run the program. To follow along with our example, click xmahjongg.uci.info.
    An info page for the Xmahjongg software extension appears, as shown in Figure
    5-4.


    # FIGURE 5-4

    MyDSL extension info panel.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_126_0.png)


    It is very important to always look in the Comments section to see if there are
    any prerequisite software packages that need to be installed prior to this one.
    In this case, there are no other packages required.


    At this point, you could click the Cancel button and continue to browse the UCI
    repository. But to continue with this example, let''s proceed to download. Click
    the Download button to start the download and installation process.


    # Application Download Dialog Box


    Next, a dialog box is displayed, requesting the directory where the application
    will be downloaded. This directory must exist on your system and the user dsl
    must have write privileges. It is usually desirable to use the default /tmp directory
    to save the extension (see Figure 5-5).


    The file will be downloaded into this directory and will be verified for integrity,
    using the md5 checksum file. Should another message box be displayed, indicating
    a bad download has occurred, you will need to try again.


    Click the Download button to proceed.


    # FIGURE 5-5  Choose the directory where the extension will be downloaded.


