- pgno: 291
  md: '# Using Skype VoIP Service

    in DSL


    By adding Skype software to Damn Small Linux (DSL), you can make calls from your
    computer to a person at another computer (for free) or to any telephone in the
    world (for a bit of money). You can also use text chat to communicate with other
    Skype users.


    Besides being offered for Linux, Skype software is available for Windows, Mac
    OS X, and Pocket PCs. So, if you can get a group of family, friends, or associates
    to sign up for Skype accounts, you can make calls, send files, and participate
    in chats among those people, even if they are not all using the same type of computer.


    Because Skype software has been packaged for Damn Small Linux, you can easily
    install Skype using the MyDSL feature. You can then apply all the advantages of
    using DSL to your Skype application, so you can have your own calling tools that
    run on a low-end PC or from a custom, portable USB stick or CD.


    This chapter describes how to use the Skype software package that is available
    for DSL to place calls to people over the Internet. It also describes how to extend
    your use of Skype to include other free and inexpensive services. Although this
    chapter describes how to set up Skype from any recent version of DSL you might
    have, refer to Appendix A for information on the DSL software included on the
    CD that comes with this book.


    # NOTE


    Although this chapter describes some of the free Skype services available using
    software created for Linux, it also touches on some of the for-pay services available
    from Skype. The authors of this book have no affiliation with Skype and our coverage
    of their products doesn''t represent an endorsement of Skype. If you are interested
    in those services, you should research their suitability for yourself.'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# INTRODUCTION TO SKYPE AND VOIP


    To encourage people to purchase its voice over Internet protocol (VoIP) Internet
    telephone products, Skype Limited (www.skype.com) offers a variety of free Internet
    communications services to people who sign up for a free user account. By downloading
    and installing Skype software, setting up a user account, and doing some simple
    configuration, you can be making calls to others over the Internet within just
    a few minutes.


    Skype describes its Internet-based telephony service as a decentralized peer-to-peer
    network. The concept of peer-to-peer (P2P) networked applications was popularized
    by file-sharing applications, such as KaZaA (www.kazaa.com), where clients can
    offer and share files (containing documents, music, video, or other content) directly
    to other clients. In its P2P VoIP offering, Skype emphasizes the decentralized
    aspect of how it implements its communications services.


    By decentralizing the processing and networking power needed to run the Skype
    service, the Skype network can grow without adding more centralized servers. In
    other words, each client using Skype shares its processing power and network bandwidth
    to increase the general pool of resources available to all Skype users. So, in
    theory, adding more Skype users shouldn''t require more servers, bandwidth, and
    other computing resources to maintain the same performance level for all users.


    Traditionally, standard telephone service has been far superior to VoIP in quality
    and reliability. The following is a list of common shortcomings of VoIP services
    and how Skype is designed to deal with them:


    +   - **Poor call completion**—Firewalls (which often block most incoming service
    requests) and network address translation (which can hide many private IP addresses
    behind a single public IP address) prevented many VoIP calls from getting through.
    To more effectively route calls, Skype uses Skype clients with public IP addresses
    to act as proxies to route calls to clients that are behind firewalls.

    +   - **Poor call quality**—Inefficient routing of calls often resulted in poor
    quality of transmission on VoIP networks. Skype uses multiple connection paths
    so that the best possible route for data can be chosen as it is needed.

    +   - **Difficult configuration**—Instead of just contacting a phone company and
    plugging in a phone, many VoIP services require complex firewall configuration
    and manual identification of servers. A simplified user interface that requires
    no special incoming firewall configuration makes Skype easy to set up for most
    users. (See Skype and Firewalls: www.skype.com/help/guides/firewall.html.)'
  merge: -1
  img_proc: true
- pgno: 293
  md: '+   - **Expensive centralized servers**—Many VoIP services rely on central
    directory servers to maintain information about users, such as their identities,
    IP addresses, and whether they are currently connected. As more people joined
    the service, the VoIP provider either had to add more servers or allow the overall
    service to degrade. Skype uses a decentralized, global user directory. This *Global
    Index* technology consists of a hierarchy of nodes that allow every node in the
    network to identify all users and resources in the network with little latency.

    +   - **Insecure transmissions**—Because the Internet is a public network, it''s
    possible for calls to be intercepted. To keep potential intruders from listening
    in on Skype calls, Skype encrypts all file transfers, instant messages, and calls
    at both ends of the transmission.


    There are some aspects of VoIP that are inherently different from standard plain
    old telephone system (POTS) phones. You should keep these in mind before you consider
    replacing your current phone system with Skype or other VoIP service:


    +   - **No emergency service**—Unlike land line telephones that are hard wired
    into a particular location, your VoIP service is tied to an IP address that can
    easily change. Skype documentation makes it clear that its service should not
    be used to replace your current telephony system because it cannot support emergency
    911 (or other local emergency service) dialing.

    +   - **Restrictive firewalls**—Although Skype doesn''t require special firewall
    configuration to allow incoming calls, some very restrictive corporate firewalls
    may prevent some outgoing services as well. From a computer that is behind such
    a firewall, Skype may work poorly or not at all.

    +   - **Single phone**—The VoIP protocol doesn''t handle multiple telephones on
    the same line very well. With Skype, you are restricted to having to answer the
    phone from a single location (your computer or wireless handheld device).

    +   - **Other telephone services**—You should do a service-by-service comparison
    of your current phone service before switching to Skype, to be sure you''re not
    going to lose something you rely on. For example, outgoing caller ID is not yet
    supported by Skype (although it is being considered) so a lot of people who don''t
    answer anonymous calls may not pick up when you call.

    +   - **Unreliable Internet connection**—Poor call quality can also result from
    having a slow or unreliable Internet connection.


    Although the number of people who use Skype to replace their standard telephony
    service is growing (despite Skype''s warnings against it), most Skype users still'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'maintain their old service along with Skype. For more talk on the pros and
    cons of using Skype as your only phone service, as well as more general discussions
    about using Skype, refer to the Skype forums (http://forum.skype.com). Refer to
    the Skype for Linux forum (http://forum.skype.com/index.php?showforum=18) for
    more specific information on using Skype in Linux.


    # SETTING UP VOIP HARDWARE


    The entry point of the hardware you need for using Skype VoIP service in Damn
    Small Linux is quite low. Almost any computer that runs Damn Small Linux and has
    working sound hardware (input and output) can be used for Skype. (For example,
    most PCs with Pentium processors and at least 64MB of RAM should work fine.)


    Using your computer that is running Damn Small Linux, here is the list of minimum
    hardware requirements you need to get started:


    +   - **Network hardware**—You need to have hardware to connect you to the Internet.
    A relatively fast Internet connection is needed to get the best performance.

    +   - **Microphone**—Any microphone you can plug into the microphone jack (usually
    pink or red) on your sound card should work.

    +   - **Headphones**—Although you could use your PC speakers, headphones are recommended
    to prevent the feedback that can occur from picking up output on your microphone.


    There are a variety of headsets you can purchase for hands-free operation. Some
    of the headsets offered directly from Skype contain call minutes for SkypeOut
    calling. You can look into headsets and other Skype gear at the Skype shop (http://us.accessories.skype.com).


    Before setting up Skype software, you should plug in your headphones (Line Out,
    green port) and microphone (Microphone, pink or red port). Then, with DSL booted
    and running, check that your sound system is working.


    > NOTE

    > Although other versions of Skype support video calls, the Linux version (as
    of this writing) does not. Video support is one of the most requested new features
    on the Linux Skype forums, so you can expect later versions of Skype for Linux
    to include video support.'
  merge: -1
  img_proc: true
- pgno: 295
  md: "# Setting Up ALSA Sound in DSL\n\nTo make sure that your sound system is working\
    \ in DSL and to set sound levels, you can use several applications that come with\
    \ DSL or can be easily added using MyDSL. In particular, the Advanced Linux Sound\
    \ Architecture (ALSA) sound system is required to use Skype in DSL, along with\
    \ the gnu-utils package (which is required by ALSA).\n\nTo begin this procedure,\
    \ boot up DSL. You can boot directly from a DSL live CD or from any medium you\
    \ prefer (pen drive, hard disk, etc.).\n\nBecause I’m assuming that you want to\
    \ set up Skype to work persistently in DSL (and not just go away after you reboot),\
    \ the following procedure describes how to get the extensions you need for sound\
    \ in Skype and reload them upon reboot. Here’s how to do that:\n\n+   1. Before\
    \ you begin downloading DSL extensions, determine where you want to save them\
    \ for future use. For example, mount a hard disk partition or inserted USB flash\
    \ drive (pen drive) so it is ready to save your extensions. Then, create a mydsl\
    \ directory at the root of that device. With a pen drive, for example, you might\
    \ type the following from a Terminal window with root permissions:\n+   \n+  \
    \    `# mkdir /mnt/sda1/mydsl`\n\n> **NOTE**\n> \n> If your computer is a Windows\
    \ system, it’s quite likely that your hard disk partition is formatted for the\
    \ NTFS file system. If this is the case with your computer, you need to use a\
    \ USB pen drive, create a hard disk partition of some other type (such as FAT32\
    \ or ext3), or remaster a CD (as described in Chapter 4, “Configuring and Saving\
    \ DSL Settings”) to save the needed packages. DSL does not support writing to\
    \ NTFS file systems.\n\n+   2. From the DSL desktop, select the MyDSL icon.\n\
    +   3. Select UNC and select the ALSA package.\n+   4. Read the description of\
    \ the ALSA package. Note that the ALSA package requires the gnu-utils package\
    \ to be installed (which we’ll get next) and an ALSA boot option to work.\n+ \
    \  5. Select Download. A pop-up window asks where to install the package.\n+ \
    \  6. When prompted, indicate where you want the ALSA package to be downloaded.\
    \ The `/tmp` directory is used by default. To save it to a pen drive,"
  merge: -1
  img_proc: true
- pgno: 296
  md: 'however, you might type /mnt/sda1/myds1 instead. Select Download and you can
    watch the progress as the package is downloaded and installed.


    +   7. Select UNC and select the gnu-utils package.


    +   8. Read the description of the gnu-utils package.


    +   9. Select Download. A pop-up window asks where to install the package.


    +   10. When prompted, indicate where you want the gnu-utils package to be downloaded.
    The /tmp directory is used by default. Instead, you should type /mnt/sda1/myds1
