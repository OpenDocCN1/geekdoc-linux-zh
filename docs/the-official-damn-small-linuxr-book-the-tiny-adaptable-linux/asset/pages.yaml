- pgno: 231
  md: '# Setting Up a Full Remastering Environment


    With many live CD-ROM-based systems, adding extra software packages typically
    requires a remaster. In Chapter 5, "Extending Applications with MyDSL," you saw
    how easy it is to add dozens of extra applications called MyDSL extensions. Just
    copy them to boot media or place them on persistent storage (a hard drive partition,
    a pen drive, or compact flash); without even requiring any extra boot options,
    the whole system boots and appears much larger and customized to your particular
    needs.


    However, there will always be the desire to make a single bootable CD-ROM work
    just like your Damn Small Linux (DSL) system does. You can''t always take your
    persistent media with you. DSL offers two ways to accomplish this task.


    By just the normal procedure of booting from the live DSL CD-ROM and having all
    your MyDSL extensions loaded at boot time, DSL can make an easy combined image
    called mydsl.iso; this process is called MakeMyDSL (mkmy dsl). This process is
    additive. It is the combining of all your chosen MyDSL selections and other non-changing
    data into a new self-contained, bootable CD-ROM image.


    This is an extremely easy procedure. In fact, it is addictive. You can customize
    DSL with extra MyDSL applications, change the default desktop and wallpaper, and
    then help spread the Linux Revolution to your friends and relatives. You can create
    custom appliances. Normally, I advise to only include nonmachine and nonlocal
    environment-specific items. After all, you still want your mydsl.iso to enjoy
    the same nomadic boot capabilities as the original DSL.


    Yet, there are times when you want to include machine or network environment features.
    For example, a classroom might share a common printer, or possibly some other
    common hardware device. If you can configure it within DSL and/or MyDSL, you can
    easily create a custom mydsl.iso bootable CD-ROM.'
  merge: -1
  img_proc: true
- pgno: 232
  md: "After you see this mkmvds1 process, you may not need to read further. Because\
    \ DSL is so small, using an additive method is quite appealing. However, there\
    \ are times when you want to actually remove core DSL applications or change system\
    \ internals. When this occurs, you need to do a full KNOPPIX-style remastering.\
    \ Many books and documents can be found on the subject of remastering KNOPPIX.\
    \ It is not the intent of this single chapter to duplicate such efforts. The intent\
    \ of this chapter is to discuss areas that are specific to DSL.\n\n# Making Your\
    \ Frugal MyDSL Installation into a Bootable CD-ROM\n\nThe mkmvds1 procedure is\
    \ done locally from a live, running, CD-ROM-booted DSL system. It is based on\
    \ the MyDSL extension concept. This provides a quick and simple way to make a\
    \ custom DSL version including all the additional applications and configurations\
    \ that are known to work with the standard DSL system. This has several advantages\
    \ over the full remastering process, as follows:\n\n+   - **Try before you burn**—You\
    \ can download extensions and try them out before committing to the whole time-consuming\
    \ cycle of making an ISO, burning it, and testing it.\n+   - **Construction set**—By\
    \ downloading in parts, you truly have a construction set method. This makes it\
    \ easier for slow modem users to be able to download and test in parts and over\
    \ time.\n+   - **Privacy**—This is where the `myconf.tar.gz` comes into play.\
    \ This is your “personal” and “private” configuration including passwords (if\
    \ desired), or closed source proprietary drivers, and so on.\n+   - **Proven system**—You\
    \ already have the base ISO and have proved that it works on your system. You\
    \ already have your local “proven” collection of extensions. Creating a `mydsl.iso`\
    \ is trivial when compared to full remastering.\n+   - **The sky’s the limit**—Some\
    \ users use the `mkmvds1` script to create DVD-sized images. You are only limited\
    \ by your creativity and hardware constraints.\n\n> **NOTE**\n> \n> The `myconf.tar.gz`\
    \ is for your configurations that you will not be changing. Thus, filetool list\
    \ remains for backup. A typical `myconf.tar.gz` could have Firefox’s Flash plug-in,\
    \ Sylpheed email settings, network printer settings, and even several PPP settings\
    \ and providers."
  merge: -1
  img_proc: true
- pgno: 233
  md: 'By answering only two simple questions, you can have your mydsl1.iso created
    and ready to burn. If you have a burner, you can continue the script to burn to
    a CD-R.


    # Getting Started


    Let''s say that you have downloaded a nice, proven collection of extensions on
    your hard drive (say hda4). You know that because your extension collection is
    stored in a level 1 mydsl directory; these extensions all load upon boot. You
    have verified this by putting it all together on your target hardware platform.


    Figure 11-1 shows an example of a set of MyDSL extensions being held in the mydsl
    directory on a hard disk partition (/mnt/hda4).


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_233_0.png)


    FIGURE 11-1 Shows a typical mydsl directory containing your extensions.


    Now, you want to create a bootable CD-ROM with your collection of extensions.
    The CD should boot with no additional boot options and should contain the following
    applications:


    +   - AbiWord—Word processor

    +   - ALSA—Advanced Linux Sound System

    +   - Gimp—Image-processing application

    +   - GNU-Utils—The Busybox replacements for basic shell utilities

    +   - GNU Cash—Cash management program

    +   - Gnumeric—Spreadsheet

    +   - GTK2—The GTK2 library needed by GTK2 applications

    +   - Myplugins—A personal private extension for proprietary Firefox plug-ins


    Upon boot, you want to have the Secure Shell Daemon (ssh), as well as the Filesystem
    in User Space (fuse) service. Your desktop should be Joe''s Window Manager (jwm)
    and the system clock set to the US Pacific time zone. Finally, you want the Flash
    plug-in for Firefox to be included. You want everything to work seamlessly and
    provide a hands-free boot.'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'Sound difficult? Well, it is not. After you become familiar with the basics
    of DSL, from the tool options to the use of MyDSL extensions and some understanding
    of creating MyDSL extensions, creating a bootable CD-ROM is simple. The features
    just mentioned are discussed in Chapter 2, “Booting DSL,” Chapter 5, and Chapter
    10, “Adding Applications and Creating Shareable Extensions.”


    Here’s how….


    # Booting from the DSL CD-ROM


    To create a remastered DSL CD, you can work from a booted live DSL CD-ROM itself.
    Boot a Damn Small Linux CD, using any boot options that you would normally need
    to boot DSL. This process requires no specific boot options, so you would only
    add those required by your specific hardware. During the remastering process,
    you work from the booted live CD and use components on that CD to create your
    remastered CD.


    One boot option you might want to add is the toram option. If you have enough
    RAM to run DSL entirely from RAM, entering toram here will let you eject the CD
    and insert a blank CD later in the process, so you can immediately burn your newly
    remastered live CD.


    # Mounting a Working Directory


    You most likely need to mount a Linux partition (probably from your hard disk)
    to hold system files, extensions, and the new image. Within that partition, you
    should make a directory to keep things organized. I suggest you make a directory
    called iso. The partition should be a Linux partition because you need to maintain
    Linux ownership, file, and directory permissions as you create the remastered
    CD.


    You should only use the ramdisk (for example, /home/dsl/iso) to store your extensions,
    data, and other items if you are only making small additions and have plenty of
    RAM available. That’s because any remastering process will consume a lot of space.
    As was stated earlier, some users create DVD-sized images. So, assuming you have
    space available on a hard disk partition, use the mount tool (lower-right corner
    of the screen) to mount a disk partition (such as hda4) to hold your remastering
    software.


    You do not need to mount the drive containing your extensions. However, you can
    use the same drive that stores your extensions. But, again, I suggest that you
    make a separate directory. So, for example, to create an iso directory on the
    hda4 partition, first mount that partition, then type the following from a terminal
    window (as root user):


    ```

    ```bash

    # mkdir /mnt/hda4/iso

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# Adding MyDSL Extensions


    Once you know which MyDSL extensions you want, you need to add those extensions
    to the remastering mydsl directory. For example, if the remaster directory is
    /mnt/hda4/iso, type the following command from a terminal window to create the
    mydsl directory:


    ```

    # mkdir -p /mnt/hda4/iso/mydsl

    ```


    Now you can download and save the MyDSL extensions you want using the MyDSL Extension
    Tool, indicating /mnt/hda4/iso/mydsl (for example) as the directory to hold the
    saved extensions.


    # TIP


    If you want to be able to run your live CD from RAM (using the toram feature)
    so you can eject the CD, do not use .unc or .uci MyDSL extensions. While both
    of those types save space in RAM, they will prevent the CD from being ejected,
    since they will be mounted directly from the CD.


    So, for example, if you wanted to use an application such as mplayer, where you
    need to eject the CD to play CD music or DVD movies from that drive, only use
    extensions of .dsl or .tar.gz types.


    # Starting the MkMyDSL Script


    Before running the MkMyDSL script, be sure that the remaster directory (for example,
    /mnt/hda4/iso) doesn''t contain anything that you don''t want to go on your remastered
    CD. In particular, if you have run the script before, be sure to remove the mydsl.iso
    file left behind by the previous MkMyDSL run.


    To start the script from the menu, select Apps, Tools, Make MyDSL CD Remaster.
    Figure 11-2 shows the Make myDSL CD window that appears.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_235_0.png)


    FIGURE 11-2 Displays the first of only two prompts needed to make a custom, bootable
    CD-ROM.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# Enter Location of Target Directory


    Enter a directory to hold all of the source files and final image. For example,
    if you had created an iso directory on the /mnt/hda4 partition, you would enter
    the following: /mnt/hda4/iso. (If you type a directory name that doesn’t exist,
    MkMyDSL exits and you have to start over.)


    > NOTE

    > A common mistake is to use a Windows partition. You should always use a Linux
    partition so that filesystem permissions are preserved. Using Windows partitions
    does not provide this capability. Refer to the cfdisk procedure in Chapter 8,
    “Installing DSL in Alternate Ways,” for information on partitioning your hard
    disk to create Linux partitions.


    # Additional Boot Time Options


    You are then prompted to enter optional boot time options. Here is where you need
    to enter any options that you were required to use to successfully boot DSL. You
    can also enter any additional options. For your example project, enter the following:


    ```

    ssh fuse tz=US/Pacific desktop=jwm

    ```


    Figure 11-3 illustrates this example.


    # FIGURE 11-3 Displays the second prompt needed to create your custom CD-ROM.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_236_0.png)


    This example shows that the secure shell service (ssh) starts to allow remote
    login, file copy, and execution to the machine, file system in user space (fuse)
    support is loaded, and the timezone is set to United States Pacific (US/Pacific).
    Also, instead of the default Fluxbox window manager, JWM (desktop=jwm) is started
    as the window manager.


    If you are sure that your live CD will only be used on computers with at least
    128MB of RAM (or possibly more if you remaster a much larger ISO image), then
    consider adding toram as a boot option. That will load and run the entire CD from
    RAM, causing it to perform much faster. Other boot options are described in Chapter
    2.'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# Creation of the Bootable Image


    After entering the boot options, the creation of the ISO bootable image begins.
    Messages showing the progress as the ISO is created appear as shown in Figure
    11-4.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_237_0.png)


    FIGURE 11-4 Shows the beginning of the automated CD-ROM ISO process.


    # Optional Burning of the Image


    If you have a CD writer device, you have the option of recording the image now.
    You are prompted to continue selecting your cdwriter device.


    > NOTE

    > If you only have one CD-ROM device, which serves to boot from and record, you
    must have booted with the toram boot option. This is required so that you can
    remove the boot CD and place a blank CD-R to record.


    If you did not boot with the toram option, or you cannot because of the heavy
    memory requirements to both boot toram and remaster, you can always answer this
    prompt with n and record later.


    Should you have the requirements to record the image now, you have only two more
    easy questions to answer, as illustrated in Figure 11-5.


    By answering y to record now, a scan is performed to find your CD writer. As seen
    in Figure 11-5, the recorder is a YAMAHA CRW2200E located at address 0,0,0. Enter
    the address for your CD writer at the prompt. For recording speed, I suggest a
    slow, safe speed of 4 (although newer CD writers can record as much higher speeds).
    Note that the CD writer appears as a SCSI device, even if it is an IDE CD drive,
    because the CD recording is done in SCSI emulation.'
