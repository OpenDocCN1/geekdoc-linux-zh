- pgno: 186
  md: '+   1. Download the embedded version of DSL (the Zip file).

    +   2. Unzip to extract only the KNOPPIX/KNOPPIX file as a level one directory
    on a Linux partition.

    +   3. Boot your system from the DSL boot floppy.


    During boot, your partitions are scanned for the KNOPPIX/KNOPPIX file and begin
    to boot DSL. Again, you may need to specify additional boot parameters just as
    you would do by booting from the DSL CD-ROM.


    # FRUGAL DSL INSTALL ON WINDOWS 9x OR DOS


    Recall from the earlier definition of Frugal: A Frugal install is a Poorman''s
    installation sans floppy diskette and without having to type additional boot options.
    The procedures discussed next apply to DOS, Windows 95, and Windows 98. Only systems
    that can boot to DOS native mode are supported. Windows ME can be patched to boot
    DOS native, but that is beyond the scope of this discussion. If you have Windows
    XP, you may want to use virtualization as discussed in Chapter 7.


    Before you try these procedures, you should successfully perform the Poorman''s
    installation in the preceding section. In fact, if you have found that you are
    in need of additional boot parameters, you should have them written down. The
    goal here is to have no floppy and not have to type additional boot parameters
    upon each boot.


    # Booting DSL from Native DOS Mode Using LinLd


    The linld boot loader is a tiny DOS COM file. With linld, you can type all the
    boot information on the DOS command line similar to the DSL boot prompt, or you
    can use a simple DOS text file to store the boot options.


    For more information on LinLd, see the announcement at


    http://www.lwn.net/Articles/102210/


    Let''s continue on from our Poorman''s method. You need to have Poorman''s setup
    (in other words, you should have the C:\KNOPPIX\KNOPPIX file in place and the
    Zip file still resident on C:\ as well). Then, boot from the DSL FreeDOS Utilities
    diskette and perform the following:


    ```

    A:\> C:

    C:\> unzip dsl-33-1.zip linux24

    C:\> unzip dsl-33-1.zip minirt24.gz

    ```'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'Recall the FreeDOS Tab key shortcut to typing filenames. If you are using Windows
    and are already familiar with unzip, all you do is unzip two more DSL system files
    to C:\


    Before you copy over the DOS boot files to the C:\ drive, let’s test your setup.
    If you did not need any additional boot options, from the booted FreeDOS A: prompt,
    type


    ```

    A:\> bootdsl

    ```


    If you need additional boot parameters, you should add them to the file linld.c1.
    You can use the DOS type command to see the contents of this file. The DOS diskette
    also has the vi editor to edit this file to add or change boot options as needed.


    After you have tested booting from the bootdsl batch file, you now are ready to
    copy over the DOS files needed to boot DSL via native DOS mode. While still booted
    from the DSL FreeDOS Utilities diskette, perform the following:


    ```

    A:\> copy a:\bin\linld.com c:\

    A:\> copy a:\linld.c1 c:\

    A:\> copy a:\bootdsl.bat c\

    ```


    Now, reboot your DOS or Windows computer to native DOS mode. With Windows 9x,
    it usually means holding down the F8 key. After you have booted to native DOS,
    typing bootdsl at the DOS boot prompt starts DSL.


    Congratulations! You now have a Frugal DOS install using linld DOS boot loader
    of DSL. Next, you should select a backup device (see Chapter 4, “Configuring and
    Saving DSL Settings”); to start using MyDSL extensions, see Chapter 5, “Extending
    Applications with MyDSL.”


    # Booting DSL from Native DOS Mode Using LoadLin


    Another popular native DOS mode Linux boot loader is loadlin.exe, version 1.6c
    by Hans Lermen. This is a DOS EXE instead of a COM program. For more information,
    visit its website at


    ```

    http://elsrv.ffm.fgan.de/~lermen/

    ```


    This DOS boot loader uses a simple DOS text file to store the boot options. So,
    just as with linld.com, continue from your existing Poorman’s installation. You
    already have the KNOPPIX file located at c:\KNOPPIX\KNOPPIX and the downloaded
    DSL.Zip file is located on c:\ as well. You have been able to boot from the DSL
    boot floppy and know your additional boot options, if any were required.'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'Let’s boot from the DSL FreeDOS Utilities diskette and, if you have not already,
    extract the other two DSL system files:


    ```

    A:\> C:

    C:\> unzip dsl-33~1.zip linux24

    C:\> unzip dsl-33~1.zip minirt24.gz

    ```


    Before you set up any loadlin DOS files on the C drive, you should test by trying
    to boot DSL via loadlin:


    ```

    A:\> loadlin @options.txt

    ```


    If additional boot options are needed, you should add them to the options.txt
    file and reboot until you are satisfied that loadlin will work. Next, copy over
    the loadlin DOS files to your C: drive:


    ```

    C:\> copy a:\bin\loadlin.exe c:\

    C:\> copy a:\options.txt c:\

    ```


    Reboot for DOS or Windows computer to native DOS mode. Windows 98 usually requires
    holding down the F8 key. After you have booted to the DOS prompt, type loadlin
    @options.txt to boot DSL.


    Congratulations! You have a Frugal DOS Loadlin installation of DSL. Next, you
    should select a backup device (see Chapter 4 for information on backing up your
    data); to start using MyDSL extensions, see Chapter 5.


    # POORMAN’S REVISITED


    Why revisit this topic? For some, the real challenge might be how to get the KNOPPIX/KNOPPIX
    file on their systems hard drive. After all, without that key file, you cannot
    use either method. The following are several ways you can go about getting the
    KNOPPIX/KNOPPIX file on your hard drive.


    # Use an Alternate Machine


    You can actually remove the hard drive of the target computer and temporarily
    install it into another computer that does have a bootable CD-ROM, or net access.
    Install DSL. Because DSL uses KNOPPIX’s hardware detection, replacing the hard
    drive back into the target computer, upon boot, detects the new environment. You
    may need to adjust boot options particular to this machine. Removing a hard drive,
    especially from laptops, may not be an easy or desired task. Read on for other
    methods to overcome this task.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# Poorman’s DSL from PCMCIA


    Many laptops have PCMCIA slots. Some may have a PCMCIA hard drive. Also, there
    are PCMCIA CompactFlash adapters available. With such an easily removable device,
    you can insert this PCMCIA into a more capable computer (bootable CD-ROM or net
    access) and copy the KNOPPIX/KNOPPIX onto the memory of the PCMCIA.


    To boot from PCMCIA on the target computer, you need to prepare a second DSL boot
    floppy. The PCMCIA Module Floppy, menu option 11 from the DSL Install Options
    as shown in Figure 8-1, creates this diskette. So again, use the more capable
    computer to create this diskette, or download directly and use rawrite to create
    it.


    Returning to the target computer, insert the PCMCIA card and boot with the DSL
    boot floppy with the following:


    ```

    boot: dsl frompcmcia

    ```


    During the booting process, you are prompted to insert the PCMCIA modules floppy.
    As usual, you may find that you need additional boot options. See Chapter 2 for
    examples of boot options you might need to get your computer hardware to boot
    DSL.


    # Poorman’s DSL from USB Drive


    What is this? USB was discussed in Chapter 6 and your machine cannot boot from
    USB. But you see, using a more capable machine to create the pen drive, as discussed
    in Chapter 6, you can boot DSL Poorman’s using the DSL standard boot floppy like
    this:


    ```

    boot: dsl fromusb

    ```


    # Poorman’s DSL from a Zip Drive


    Some of you may still have an Iomega zip drive. Because this is a removable device
    also, you can copy the KNOPPIX/KNOPPIX file onto a zip drive. Then, using the
    DSL standard boot floppy, boot with


    ```

    boot: dsl fromzip

    ```


    # Installing from a Stack of Floppy Diskettes


    If you have a really old PC, you may have no PCMCIA access, no USB port, and certainly
    no zip drive. Well then, you must have a floppy drive!'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'As I mentioned earlier, sometime you need a more capable machine to produce
    what is needed for the less able machine. We will call the more capable machine
    the source machine and the other the target machine.


    Your source machine needs to be able to boot the DSL CD-ROM, either the Syslinux
    or Isolinux version, and must also have a floppy drive. You also need a stack
    of approximately 35 floppies. Make sure these are good—they should have no bad
    sectors and be in new or new-like condition. You also need the DSL FreeDos Utilities
    floppy mentioned at the beginning of this chapter.


    At the boot prompt of the source machine, enter install. This displays the now
    familiar DSL installation menu as shown in Figure 8-1.


    You have two choices. Depending on the actual size of the DSL release, menu option
    8 creates approximately 34 data files. These data files will be named chunk01,
    chunk02, ... chunk34. Be sure that you have enough space to store an additional
    50MB. Using this all-at-once option allows you to copy to floppies at your leisure.
    These files are not floppy image files like the boot floppies, but instead are
    data files.


    When the process is complete, you will find all of the chunk files. Later, when
    you have time, you can return to the source computer and manually copy each chunk
    file to a corresponding floppy disk. Because these are data and not image files,
    you must first mount the floppy, perform the copy, then unmount the floppy using
    the umount command.


    Alternatively, you may prefer menu option 9. This option creates a chunk and interactively
    prompts you to insert a blank floppy. This option loops through all chunk files
    sequentially. Your only interaction is to insert and remove floppies as prompted.
    This option eliminates all the manual commands needed with option 8. With this
    option, you need to set aside a good deal of time, but you save much typing.


    You may find that you use both options. You may need to recreate a single floppy,
    and with option 8, you can selectively choose which chunk to copy.


    After all the floppies have been created, you might want to take a break. Really,
    this is a time-consuming endeavor.


    To restore all the chunk files on the target machine, boot the target machine
    with the DSL FreeDOS utilities diskette. Change to the C drive and make the KNOPPIX
    directory and enter the copy command as shown:


    ```

    A:> c:

    C:\> mkdir knoppix

    C:\> cd knoppix

    C:\KNOPPIX> copy b:\chunk*

    ```'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'Remove the utilities diskette from the drive and insert the first chunk diskette
    in the floppy drive. Press the Enter key when ready.


    Wait for the copy to complete. You see a progress message as the copy is progressing.
    When the diskette is quiescent, remove the chunk diskette and insert the next
    one into the drive.


    You can use the up arrow key to repeat the copy command `copy b:\chunk*`, then
    press the Enter key to proceed with the copy.


    Repeat this process for all diskettes, which should be between 34 and 35 floppies.


    # NOTE


    While the copy process is running, you might see a message that says: “Error reading
    from drive B:...” If that happens, press `a` for abort. Write down this chunk
    number.


    Return to the source machine and do the following:


    +   1. Format this “bad read” diskette.

    +   2. Mount the newly formatted diskette.

    +   3. Try to copy the chunk (`cp chunkxy /mnt/auto/floppy`).

    +   4. Type `sync` to sync anything data cache to permanent storage.

    +   5. Unmount the floppy disk (`umount /mnt/auto/floppy`).


    Back on the target machine, reinsert this floppy, press the Up arrow to recall
    the copy command, and press Enter. If this diskette still fails, repeat with another
    new floppy.


    After copying all “chunk” diskettes, return to the A: drive prompt. Replace the
    utilities diskette. This should stop the prompt for any B: drive. Next, move to
    the `C:\knoppix` folder:


    ```

    A:\> C:

    C:\> cd knoppix

    C:\KNOPPIX> cat chunk* > knoppix

    C:\KNOPPIX> del chunk*

    C:\KNOPPIX> a:

    A:\>

    ```'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'Now that you have C:\KNOPPIX\KNOPPIX, you can remove the utilities diskette
    and insert the DSL boot diskette. Reboot your computer. At the boot prompt, type
    the following:


    ```

    boot: dsl 2 legacy frugal

    ```


    The next step is to make a swap file. When you see the system prompt #, enter
    the following:


    ```

    # mkdoss swapfile

    ```


    Reboot again and you have arrived at a Poorman''s installation of DSL.


    You may need additional boot parameters (see Chapter 2 for more detail of boot
    options that are specific to the booting process).


    After you have a successful installation of DSL, you might want to eliminate the
    need for the boot floppy. See the section "DSL Installed on Windows 9x or DOS
    Partition."


    # No Operating System Network Install via Tomsrtbt


    A stack of floppies doesn''t sound like much fun? Well, still one more option
    to explore. This option is not as easy as the others, as some manual configuration
    is required. This option is also a Linux-based option. Your target computer needs
    to be able to boot from a 1722k, 3.5-inch floppy. Let''s start by reviewing the
    hardware requirement.


    # Hardware Requirements for Network Install


    The hardware needed to do a DSL network install is the same hardware stated in
    Chapter 2, with the following exceptions:


    +   - No CD-ROM drive is required.

    +   - A floppy drive capable of booting a 1722k floppy is needed.

    +   - A PCMCIA and a supported PCMCIA network card supported by tomsrtbt is needed.'
  merge: -1
  img_proc: true
