- pgno: 227
  md: '3. Copy the contents of /opt/zile to the work directory:

    # cd /home/ds1/work

    # cp -a /opt/zile


    4. Make a user directory and change to it:

    # cd zile

    # mkdir user

    # cd user


    5. Create a user.list file from the contents of the user.tar.gz file:

    # tar -zxvf ../user.tar.gz | tee /tmp/user.list


    6. Edit the actual files as needed.


    7. Edit the /tmp/user.list file to reflect any added or removed files.


    8. Package up the files again, using the edited user.list file:

    # tar -T /tmp/user.list -czvf ../user.tar.gz


    9. Remove the temporary user directory you created and return to the work directory:

    # cd ..

    # rm -rf user/

    # cd ..


    10. Run the mkisofs command, run it through the create_compressed_fs command to
    compress the resulting ISO image, and create the updated uci file (called zile.uci).
    Options to mkisofs command allow Rock Ridge extensions for Linux file naming (-R),
    cause each hard linked file to only appear once on the CD-ROM image (-cache-inodes),
    and pads the image by 150 sectors (-pad):

    # mkisofs -R -hide-rr-moved -cache-inodes -pad zile/ \

    | create_compressed_fs - 65536 > ../zile.uci


    11. Remove the work directory:

    # cd ..

    # rm -rf work


    As the result of this procedure, you should have a new zile.uci MyDSL package
    in your /home/ds1 directory.


    # SHARING YOUR EXTENSION WITH THE WORLD


    After your extension is working and you have thoroughly tested it, you will likely
    want to share your creation. DSL provides many repositories for user-contributed'
  merge: -1
