- pgno: 147
  md: '# FIGURE 6-4 Choose the location of the DSL image.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_147_0.png)


    At this point, you are given the opportunity to add boot options like toram, ssh,
    or vga=normal. There are many boot options to explore; take some time to study
    them if you have special needs for your bootable pen drive as it runs Damn Small
    Linux. Our defaults are sensible, so if you do not want to take the time to dig
    into options now, just run with what we have—it will work on most computers. Type
    in your boot options (if you have any) and press Enter. (To explore the boot options
    available and how to use them, consult Chapter 2, “Booting DSL.”)


    Next, you are asked to choose language options: for German, type de; for Spanish,
    type es; and so on. Leave this option blank if you want English. After selecting
    your option, press Enter.


    The script now asks if you are ready to proceed. If yes, type y and press Enter.
    It then asks you one more time if you really want to proceed with the warning
    that you are about to destroy all the data on the selected device. This is your
    last chance to exit the script before serious things happen; if you have any concerns,
    now is your very last chance to exit the script.


    The script is now prepared to format your pen drive. This is the point where all
    the data on your drive will be erased and is your last chance to back out, as
    shown in Figure 6-5.


    Next, the script formats the single partition on your pen drive, applies Syslinux
    to the pen drive partition, and then sets up the system image in that partition.
    If all goes smoothly, you will read “USB installation has completed” in green
    and all you have to do is press Enter to exit the script.'
