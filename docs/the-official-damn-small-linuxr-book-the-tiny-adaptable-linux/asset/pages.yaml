- pgno: 283
  md: '# FIGURE 13-2 Beaver with the edna.conf file open.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_283_0.png)


    The defaults for the config file are fine for most people. The lines you want
    to edit are lines 56 and 57.


    This is what the section should look like:


    ```

    # Unix example:

    dir1 = /mnt/cdrom = MP3 CDROM

    dir2 = /opt/mp3s = Jukebox

    ```


    If you are not planning on running MP3s from CDs, you can comment out dir1 with
    a pound symbol (#) at the beginning of the line. You are free to add and delete
    directories within the server path to files, and Edna automatically adjusts to
    include or exclude them. However, after Edna is running, you have to restart the
    server for it to reread the config file, if you alter file paths. The simplest
    way to do this is to give a command-line command that restarts the server. This
    process also restarts any other Python script you have running. Note: Damn Small
    Linux does not have'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'any native Python scripts, so it should be safe unless you are a Python hacker;
    and if you are, why are you reading this How To?


    To restart Edna, type:


    ```

    sudo killall -HUP python

    ```


    If you keep your music on a particular drive, you want to configure Edna to seek
    the directory on that drive. Please note that the drive needs to be mounted first.


    Here is an example entry in the config file for accessing music on a hard drive:


    ```

    dir3 = /mnt/hda1/music/ = Hard Drive Tunes

    ```


    Here is an example for music stored on a pen drive:


    ```

    dir4 = /mnt/sda1/mp3s_and_oggs/ = My Portable Music

    ```


    If you are using DSL from a computer that pulls double duty as a MS Windows machine
    and you store your music on the Windows side, you should be able to mount your
    Windows partition and point Edna to the correct path for your music. Just be sure
    to remember that the path should be /mnt plus the path to the drive and partition
    where the Windows OS sits plus the physical path to your music (not the virtual
    path given by MS Explorer). If you have any doubts as to the true path to your
    music on the Windows partition, you can mount the drive and then navigate to the
    directory in the file manager Emelfm. You will notice that Emelfm displays the
    full directory path as you navigate—you can use this as a reference. Be sure to
    mount the drive before you try to navigate, or you won’t be able to see anything!


    # Set Up Walk-Through


    For this walk-through, I am going to use public domain music grabbed from archive.org.
    By the way, archive.org has a very nice collection of freely available music that
    can be added to your music collection legally and without cost. It is also a neat
    way to discover new music. Okay, back on topic.


    For this demonstration, I am making a directory tree on the first partition of
    a hard drive. I will be original and call it music.


    Thus, the initial path for the directory is:


    ```

    /mnt/hda1/music

    ```


    Next, I make a few directories inside the music directory: Live_Music, Grateful_Dead,
    and Jazz. We are keeping it simple for this demonstration.'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'The complete path to these directories would look like this:


    ```

    /mnt/hda1/music/Live_Music

    /mnt/hda1/music/Grateful_Dead

    /mnt/hda1/music/Jazz

    ```


    So, in the Edna configuration file, my file path entries look like this:


    ```

    dir1 = /mnt/hda1/music/Live_Music = Live Music

    dir2 = /mnt/hda1/music/Grateful_Dead = The Grateful Dead

    dir3 = /mnt/hda1/music/Jazz = Jazz

    ```


    After commenting out the original directory paths and adding my entry, I restart
    the server with the sudo killall -HUP python command. To confirm that it all went
    well, I recheck the display in the server. Refer to Figure 13-3 for an example
    of how Edna looks after adding the file paths.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_285_0.png)


    FIGURE 13-3 Edna with the new categories displayed.


    After you have the initial directory path, you can fill it up any way you like.
    You can organize your music several levels deep or have your music directory shallow
    and broad. You can also mix it up by having some music files at a top-level directory
    and an extensive tree of subdirectories for your more organized music. After just
    a few minutes of downloading some live concerts from Archive.org, you can see'
