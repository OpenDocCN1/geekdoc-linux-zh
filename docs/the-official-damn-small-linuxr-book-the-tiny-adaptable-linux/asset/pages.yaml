  md: "Setting up system image on target partition.\n\nSetting up lilo\n\nInstallation\
    \ complete.\n\n+   5. When doing an installation, type `y` to format the partitions.\
    \ Later, when you want to upgrade to a new version of DSL, you do not format the\
    \ partition (n).\n\n> **NOTE**\n> \n> Upgrading a Frugal installation is as easy\
    \ as running the installation script again. Because Frugal implies running from\
    \ the untouched compressed image, all of your extensions and backup of configurations\
    \ are unaffected during an upgrade. Only three system files are copied to the\
    \ target media.\n\nAfter installation is done, you may find you need to edit the\
    \ Lilo configuration file, `lilo.conf`. Editing `lilo.conf` requires not only\
    \ finding and then editing this file, but also reinstalling Lilo. Let’s begin\
    \ with a standard installation, open a shell as superuser (root), and perform\
    \ the following:\n\n```\n```sh\n# beaver /cdrom/boot/lilo.conf\n# ln -sf /cdrom/boot/\
    \ /\n# lilo -C /cdrom/boot/lilo.conf\n```\n```\n\nThe beaver command is just the\
    \ editor we chose to edit the `lilo.conf` file. The `ln` command does a soft link\
    \ of the `/cdrom/boot` directory to the root of your file system. The `lilo` command\
    \ uses the information from the `lilo.conf` file to add the updated boot loader\
    \ information into the master boot record.\n\nIf your system was booted with the\
    \ toram boot option, the procedure is slightly different. If necessary, you need\
    \ to mount the partition where DSL was installed. Let’s assume that you installed\
    \ DSL in partition hda2; the procedure required becomes\n\n```\n```sh\n# mount\
    \ /mnt/hda2\n# beaver /mnt/hda2/boot/lilo.conf\n# ln -sf /mnt/hda2/boot/ /\n#\
    \ lilo -C /mnt/hda2/boot/lilo.conf\n```\n```\n\nThis completes my discussion of\
    \ the native Frugal installation scripts that are provided within the DSL CD-ROM\
    \ distribution. Both types, Grub and Lilo, have their advantages, and their use\
    \ is entirely up to you."
