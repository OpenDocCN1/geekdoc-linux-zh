- pgno: 216
  md: '# NOTE


    You will want to save the ds1-dpkg.ds1 extension so you can create more extensions
    the next time you reboot DSL. Use the standard methods as described in Chapter
    4. Later, when you need this system extension, you can use the MyDSL desktop icon
    Load Local and not have to keep downloading this extension.


    # Step 3: Install and Test Desired Package


    Now, open a regular shell (ds1 user) to enter the further commands:


    ```

    $ sudo apt-get install zile

    ```


    Because DSL does not normally use Debian packages, there are no updates to the
    system menu. So, you must know the command to start the newly installed package.
    So, for this example, type zile from the shell prompt.


    # NOTE


    In case you are not familiar with Zile/Emacs, you may find yourself stuck and
    unable to exit this program. If that is the case, you can simply press Ctrl-x
    Ctrl-c to exit.


    The whereis command is very useful in determining the full path to the zile command.
    You will need this full path later in your configuration.


    Thoroughly test the application. You will then be ready to repackage the application
    and all of its dependencies into a ds1 type extension.


    # Step 4: Create the Extension


    From the open shell, enter the following :


    ```

    $ deb2ds1

    ```


    Enter the full name for your DSL extension.

    Example: rox.ds1 zile.ds1


    Enter the MyDSL menu name for your program.

    Example: Rox Filer Zile Emacs

    Is this an X application: (y/..) n


    Enter the full path to the executable.

    Example: /usr/bin/rox /usr/bin/zile'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# Step 5: Save Your Extension


    Because you have already installed Zile via the Debian apt-get command, before
    you can really test your newly built extension, you must reboot. Recall that you
    booted with base and norestore options. So, use care to mount a persistent store
    and copy your zile.dsl.


    # Step 6: Test Your New zile.dsl


    After copying your new extension, reboot DSL with the base and norestore options.
    Using the MyDSL tool, Load Local option, navigate to your saved extension and
    load it. Because you have not yet made an icon, use the System menu, MyDSL, Zile
    Emacs to launch the application.


    # Step 7: Add an Icon (Optional)


    Although adding an icon is optional, it gives me the chance to discuss how to
    open an existing ds1 extension. You will want to do this if you need to add, change,
    or edit any file(s) in your extension.


    But first, let’s create the icon file. Using the text editor beaver, create the
    icon as described earlier in “The Icon Element” section. The icon for Zile in
    /home/ds1/.xdesktop/zile.lnk is identified as follows:


    ```

    table Icon

    Type: Program

    Caption: Zile

    Command: aterm -e /usr/bin/zile

    Icon: /home/ds1/.xdesktop/program.png

    X: 420

    Y: 384

    end

    ```


    Next, copy zile.dsl to /home/ds1 and then open it with the following commands:


    ```

    # mkdir /home/ds1/work

    # cd work

    # tar -zxvf ../zile.dsl | tee > /tmp/zile.lst

    ```


    Using the text editor, beaver, add the following line to /tmp/zile.lst:


    ```

    home/ds1/.xdesktop/zile.lnk

    ```


    # NOTE


    If you are also using a new image file for this extension, you would add that
    line to the file list as well.'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'To ensure that your permissions are correct on the additional files, you should
    use the following:


    ```

    ```bash

    $ sudo chown -R 0.0 /tmp

    $ sudo chown -R 1001.50 /home/dsl/.xtdesktop

    ```

    ```


    Now, repackage the extension with the following command:


    ```

    ```bash

    $ cd /home/dsl/work

    $ tar -T /tmp/zile.lst -czvf ../zile.dsl

    ```

    ```


    # Step 8: Save Your Extension


    If the extension creation was successful, copy your zile.dsl to any persistent
    store that you have used for other MyDSL extensions (typically, a mydsl directory).


    Now, you have your final .dsl extension with both menu and icon elements. If you
    want to share this with the DSL community, skip forward to the “Sharing Your Extension
    with the World” section later in this chapter.


    # The UNC Extension Type


    UNC Extensions are mountable using the unionfs file system. The main advantage
    of using this method is the very low RAM use. If only unc and uci extensions are
    used, you would use very little RAM. Compressed mounts save RAM, as only the runtime
    is loaded into memory very similar to the RAM usage of a traditional hard drive.
    Unionfs, as implemented in DSL, makes the same area of the file system write-enabled,
    as does the ds1 extension type.


    It is trivial to create a unc extension from an existing ds1 extension. The base
    DSL system contains a tool to convert any ds1 into a unc. Open a root xterm and
    run the script:


    ```

    ```bash

    $ ds1?unc.sh zile.ds1

    ```

    ```


    It is preferred to make the unc extension this way as much of the work is automated.


    However, if you want to manually make a unc from an existing Debian package, read
    on. It is also not difficult to create. Let’s take another look at the same Debian
    Zile example.


    # Step 1: Set Up DSL for Extension Building


    As previously stated, when you are building an extension, you should eliminate
    all possible accidental dependencies. That is, your extension should work on any
    base'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'install of DSL. Therefore, to ensure this common pristine environment, you
    should always boot DSL as follows:


    ```

    boot: dsl base norestore

    ```


    The options base and norestore start DSL with a pristine environment. Other boot
    options that are required by your hardware would still need to be added.


    # Step 2: Restore Debian Package Management System


    If you have saved your Debian extension, dsl-dpkg.dsl, load this extension followed
    by the apt-get update. Otherwise, from the main menu, select Apps, Tools, Enable
    Apt. The Debian environment is downloaded again and its environment is set up.


    # Step 3: Install and Test Desired Package


    Now, you must open a root shell to enter the further commands:


    ```

    # apt-get install zile

    ```


    From a shell, for this example, type zile. Thoroughly test the application. You
    then are ready to repackage the application and all of its dependencies into a
    unc type extension.


    # Step 4: Reboot


    Yes, that is correct. You want to ensure the state of the machine. By rebooting,
    you lose this installed application and any other extra packages that you may
    have used. This step is really only needed to “start from a zero-base state.”


    # Step 5: Restore Debian Package Management System


    As in step 2, you need some base Debian package management tools. However, you
    do not actually install the Zile application.


    # Step 6: Create the UNC


    Open a root shell and enter the following commands:


    ```

    # apt-get clean

    # apt-get -d -y install zile

    # mkdir /tmp/zile

    # for F in `ls -1 /var/cache/apt/archives/*.deb`; do

    #   dpkg -x "$F" /tmp/zile

    # cd /tmp

    # mkisofs -R -hide-rr-moved -cache-inodes -pad zile/ \

    |   create_compressed_fs - 65536 > /tmp/zile.unc

    ```'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# Step 7: Test Your New zile.unc


    As normal user ds1, use the standard MyDSL system to load the extension. Because
    you have not yet made a menu or icon item, open a shell window and issue the command
    zile.


    # Step 8: Insert Common Extension Elements


    Using this manual method to create a .unc extension means you must make the menu
    and icon elements as was discussed earlier in the “Common Elements to All MyDSL
    Extensions” section.


    For a .unc type extension, the menu and icon elements are stored in a user.tar.gz
    file. It is really an additional MyDSL extension included within the unc. When
    the unc is mounted, the system looks inside the mount for a user.tar.gz (“user.tar.gz”
    is the literal filename) and then performs a mydsl-load on that .tar.gz. This
    makes for an easy single file download and load. The user.tar.gz file is optional,
    and generally includes a desktop icon, menu item, and any personal configs that
    your application requires but does not create. This file must be built the same
    way as any .tar.gz extension, including full paths and proper file owner-ships/permissions.


    Using DSL’s text editor beaver, create the following in /tmp/mydsl.menu/zile:


    ```

    ```text

    [exec] (Zile) {aterm -e /usr/bin/zile}

    ```

    ```


    To create the icon file, use the text editor beaver to create the icon as described
    earlier in “The Icon Element” section. Our icon for Zile in /home/dsl/.xtdesktop/zile.lnk
    looks like this:


    ```

    ```text

    table Icon

    Type: Program

    Caption: Zile

    Command: aterm -e /usr/bin/zile

    Icon: /home/dsl/.xtdesktop/program.png

    X: 420

    Y: 384

    end

    ```

    ```


    Next, you create the mini-extension of the user files. In this case, use the beaver
    text editor and create /tmp/user.lst. The contents of the /tmp/user.lst file is
    a list of the user files. Among those files are the zile menu (zile) and icon
    (zile.lnk) files.


    ```

    ```text

    /home/dsl/.xtdesktop/zile.lnk

    tmp/mydsl.menu/zile

    ```

    ```'
  merge: -1
  img_proc: true
