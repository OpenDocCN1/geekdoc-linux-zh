- pgno: 326
  md: 'and netcardconfig from the DSL menu). Say No to using DHCP broadcast, and enter
    a static IP address for your DSL system. You can use that address to log in to
    your digital media frame later from other computers on your LAN.


    # Using the ssh Service to Get Content


    After you get your network interface running, I suggest you have DSL start up
    the ssh interface automatically. That service lets you do remote login and remote
    copy from other computers on your LAN. For example, you could add the following
    line to the /etc/rc5.d/S99bootlocal init script:


    ```

    /etc/init.d/ssh start

    ```


    With your network interface and secure shell service running in DSL, there are
    several ways you could access your digital media frame from another computer on
    your LAN. First, I suggest you add a password for the root user in DSL. (Don''t
    add a password for ds1 or you won''t be able to boot DSL without being prompted
    for a password.)


    Assuming your IP address is 10.0.10.1, here are some ways you could access the
    media frame from another computer on your LAN from another Linux system:


    ```

    # ssh root@10.0.10.1

    # scp *.jpg root@10.0.10.1:/var/mediaframe/pics/

    ```


    For both the command lines, you are prompted for the root password. The ssh command
    shown lets you log in as root to a shell interface. The scp command shown copies
    all files ending in .jpg from the current directory on the local system to the
    /var/mediaframe/pics directory on the media frame.


    If you have a Mac OSX system, you already have ssh on your computer (just open
    a Terminal window to use the command). For Windows systems, there is a set of
    open source tools called PuTTY that you could look into for accessing ssh, scp,
    and other secure shell services from Windows systems. See www.chiark.greenend.org.uk/~sgtatham/putty.
    There is also SSHDOS to use those tools from DOS (http://sshdos.sourceforge.net).
    Of course, you could also just boot DSL from any PC on your LAN as well.


    # Using Samba to Get Content


    DSL also supports Samba, which can be used to share files and folders with Windows
    systems. With Samba installed using MyDSL (as described earlier), here is an example
    of how you could create a shared directory from DSL so that people from Windows
    clients could add and remove images from your /var/mediaframe/pics directory:'
  merge: -1
  img_proc: true
- pgno: 327
  md: '+   1. Edit the /etc/samba/smb.conf file to add a section to the Share Definitions
    section that appears as follows:


    ```

    [mediaframe]

    comment = Images for Digital Media Frame

    path = /var/mediaframe/pics

    writable = yes

    read only = no

    public = yes

    ```


    The permissions shown here are wide open. After you determine that Samba is working,
    you should look into providing password protection for securing your Samba service.
    The system name appears as the name box (you might want to change that in /etc/samba/smb.conf
    while you are at it).


    +   2. Start the nmbd and smbd services. As root user, type the following:


    ```

    # /usr/sbin/nmbd -D

    # /usr/sbin/smbd -D

    ```


    The commands just shown start the NetBIOS (nmbd) and Samba (smbd) services in
    daemon (background) mode (-D). The mediaframe share should now be available on
    your LAN.


    +   3. Try accessing the mediaframe share from another computer on your LAN. Open
    the Network or Network Neighborhood windows to see if your DSL system appears.
    From a Linux system, you could access the share by mounting it on your local file
    system. For example:


    ```

    # mkdir /mnt/box

    # mount -t smbfs //box/mediaframe /mnt/box

    ```


    You should then be able to copy files to and remove them from the /mnt/box directory
    and have them appear on your digital media frame. You may need to restart GQview
    for the new images to be picked up.


    > NOTE

    > Copying files over Samba on my 167MHz Pentium with 64MB of RAM does slow the
    performance of the media frame. Some image effects don''t complete before GQview
    goes on to the next image. After the copy is over, however, performance goes back
    to normal.


    # Adding Other Media Players and Content


    Now that the basic structure of the digital media is set up, you can add other
    kinds of players and media content. By adding the ogg123 music player and some
    music content to your media frame, you could create a combination music and slideshow
    player as follows:'
