- pgno: 173
  md: 'Installation methods described in this chapter assume you have Windows, just
    DOS, or even no operating system installed at all. The installation methods discussed
    here also apply to standard *white box* computers as well. But typically, such
    computers have CD-ROM drives or one can be easily added.


    Also, be very aware that all the boot time options that were discussed in Chapter
    2 apply here. This chapter’s focus is the alternate installation types and how
    to set up the necessary DSL files even without a CD-ROM so that you can start
    the boot and therefore installation process of DSL.


    After a successful alternate method is working, it is easy to move to the more
    advanced methods. After the Poorman’s method is working, it is easy to then set
    up a frugal DSL install, or frugal hybrid, or even the traditional hard installation.


    # Starting a DSL Installation


    The first method for installing DSL to your hard drive assumes that your computer
    can boot from the DSL CD. If that’s the case, boot the DSL CD and type the following
    boot option:


    ```

    `boot: install`

    ```


    This boot option brings up an installation menu as shown in Figure 8-1.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_173_0.png)


    This allows quick and easy access to the various installation methods. Pen drive
    installation is discussed in Chapter 6, “Running a Native Pen Drive Install,”
    and traditional hard drive installation can be found in Chapter 9, “Performing
    a Traditional Hard Drive Install.” Note that Poorman’s is missing from this menu.
    This is because it is not needed if you can boot from CD.'
  merge: -1
  img_proc: true
- pgno: 174
  md: "# FRUGAL—THE MOST POPULAR WAY TO INSTALL DSL\n\nThe DSL boot option of install\
    \ provides easy access to a Frugal installation for those users who can boot from\
    \ CD. The frugal installation available from this menu is for Linux file systems\
    \ only. You must have a prepared Linux partition to use the Frugal installation\
    \ options from this menu.\n\nNotice that DSL offers two versions of Frugal installations.\
    \ Menu option 4 uses the popular GRUB boot loader (www.gnu.org/software/grub)\
    \ in the master boot record. Menu option 5 offers LILO boot loader (http://freshmeat.net/projects/lilo)\
    \ installed into a partition on the computer’s hard disk. A boot loader is a program\
    \ that is installed on the boot medium (hard disk, live CD, or other bootable\
    \ medium) and used to identify the operating system to boot and provide an opportunity\
    \ to add boot options. Early Linux systems used the LILO boot loader, while more\
    \ recent Linux systems most often use GRUB.\n\nLet’s begin by stepping through\
    \ the Frugal installation process and finish up by discussing how to change boot\
    \ options after an installation.\n\n> **NOTE**\n> \n> You must have prepared your\
    \ Linux and Linux swap partitions before you begin either Frugal installation\
    \ scripts. DSL provides two tools to perform this task. Both fdisk and cfdisk\
    \ are available. The procedure in the section that follows describes how to partition\
    \ your disk with cfdisk.\n\n# Partitioning with Cfdisk\n\nIf your disk is already\
    \ set up with Linux and Linux swap partitions, you may skip this step. I am going\
    \ to briefly discuss a very simple setup using cfdisk to partition the entire\
    \ disk for use with DSL. To begin, select option 12 from the DSL Install Options\
    \ screen (see Figure 8-1). You are prompted to enter the target drive. The default\
    \ is hda. Recall that in Linux the first hard drive device is a, the second drive\
    \ is b, and so on. This brings up the Cfdisk Partition tool as shown in Figure\
    \ 8-2.\n\nTo navigate this program, use the up and down arrows to select a partition\
    \ or *free space*. Use the Tab key to choose an action displayed at the bottom\
    \ of the screen."
  merge: -1
  img_proc: true
