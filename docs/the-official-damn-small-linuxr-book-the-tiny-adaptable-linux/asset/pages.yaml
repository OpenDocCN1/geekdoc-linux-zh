- pgno: 195
  md: 'If you do this, reinstall into the other partition either frugal or full install.
    Next, you can get rid of the Poorman’s install on that partition by using the
    fdisk utility. Using fdisk, change the partition type to type 82 (swap) and then
    format it for swap by using the mkswap /dev/hdaX command. For example, if it were
    the first partition on the first IDE hard drive, you would enter /dev/hda1 as
    the device entered.


    # SUMMARY


    DSL can be booted, installed, and run similarly to running from the CD-ROM. Running
    from an installed compressed image has the advantage of speed over the CD-ROM,
    is an unbreakable pristine bootable system, frees the CD-ROM for other uses, and
    shares the MyDSL application extension system.


    Installing DSL this way also allows DSL to be used on old laptops that may not
    even have a CD-ROM drive. Only a floppy drive, PCMCIA CF, USB port, or a network
    card supported by tomsrtbt is required. DSL can be easily previewed on Windows
    platforms without committing a partition and can be as simple as needing only
    a single file.'
  merge: -1
  img_proc: true
