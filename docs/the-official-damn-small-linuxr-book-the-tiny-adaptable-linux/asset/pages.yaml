- pgno: 156
  md: 'running the MyDSL app and typing in the path to the directory on your pen drive
    before downloading. The typical path would be /mnt/sda2/mydsl1/.


    # A Note on DSL-embedded.zip


    We offer a bundled package of DSL with Qemu; the details of this setup will be
    discussed in Chapter 7, “Running DSL Embedded in Windows.” However, we wanted
    to include a quick note about what some users are doing to make their DSL-embedded.zip
    equipped pen drives also BIOS bootable from within the MS Windows platform. The
    results are inconsistent, but if you want to try, you need to first download the
    win32 executable version of Syslinux.


    You can download the Windows version of Syslinux from:


    ```

    http://www.kernel.org/pub/linux/utils/boot/syslinux/

    ```


    +   - Copy syslinux.exe to the root of your C drive.

    +   - Open a DOS prompt and type the following:


    ```

    syslinux.exe h:

    ```


    Windows recognizes your pen drive to be h:.. If it is a different letter, use
    that one.


    The version of Syslinux used in DSL does not work with very large pen drives.
    It does function with drives that are 1Gig and smaller. If you have an extra large
    drive, you may download a later version of Syslinux, which is compatible with
    drives exceeding 1Gig.


    You can find the latest version at


    ```

    http://www.kernel.org/pub/linux/utils/boot/syslinux/

    ```


    # Developments in the Wiki


    Finally, it is worth noting that there are some interesting alternative install
    methods being developed by our user base. If you are interested in exploring the
    latest hacks, refer to our wiki page:


    ```

    http://damnsmalllinux.org/wiki/index.php/Installing_to_a_USB_Flash_Drive

    ```'
