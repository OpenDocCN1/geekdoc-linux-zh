- pgno: 129
  md: '# CHANGING DOWNLOAD REPOSITORY MIRROR


    Damn Small Linux is hosted at many sites on the Internet. The main one is Ibiblio
    (http://distro.ibiblio.org). Ibiblio is the default. Ibiblio is also mirrored
    (which is transparent to the user). Still, at times, accessing Ibiblio can become
    slow.


    Other Internet sites have agreed to also host the DSL repositories. Many of the
    mirrors may be closer to you. In fact, some may just be faster for you to access.
    For these reasons, we make it possible to change the default download site. To
    change the default download site, select the DSL panel icon from the desktop and
    click Select Mirror. A small dialog appears, as shown in Figure 5-11.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_129_0.png)


    FIGURE 5-11 The Mirror select dialog shows the mirror being used to get DSL extensions.


    Here, you see the default Ibiblio site and default protocol. At this point, you
    can click the Select button to see a current list of mirror sites, as shown in
    Figure 5-12.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_129_1.png)


    FIGURE 5-12 Mirror selection.


    You can scroll through this list and select any mirror. Both mirror name and protocol
    are shown via their full URL. When you have selected one, it populates the Mirror
    Select dialog and you can click OK to proceed. Doing so saves your new choice.
    It is remembered via normal backup and restore procedures.


    The Mirror Select dialog is not limited to just the current available mirror sites.
    In fact, you can type in any site and protocol that you want. The purpose of this
    is that you may want to host your own private repository on a local server. Perhaps
    this is a private collection for a home network. This may also be a company intranet,
    school, or training center.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# ACCESSING DSL EXTENSIONS VIA A WEB BROWSER


    Besides using the MyDSL panel, you can also view and access DSL extensions directly
    from your Web browser.


    # Getting Extensions from the Official DSL Website


    The MyDSL application extensions can be found in the repositories that are linked
    on the DSL main project page:


    ```

    http://www.damnsmalllinux.org

    ```


    Scroll down until you see the Download link. Click that link to be taken to the
    Download page, as shown in Figure 5-13.


    ![](img/af53325d7f38f1cdafca9f44568e4ab8_130_0.png)


    FIGURE 5-13 Get to myDSL repositories from the DSL download page.


    Click the Browse the myDSL Repository link. This takes you to the extension area.
    You can also quickly access the extension area by adding a desktop icon that includes
    a link to this site.


    # Getting Extensions via DSL’s Help Screen


    Web access to the repositories can also be achieved by clicking the Dillo desktop
    icon. The usual Getting Started help screen appears. An active link to the repositories
    (Extension Library) is available within that page. Figure 5-14 displays the web
    interface to an extension repository using the Dillo browser.'
  merge: -1
