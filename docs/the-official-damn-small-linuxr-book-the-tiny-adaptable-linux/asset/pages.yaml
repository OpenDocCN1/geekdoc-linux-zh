    greps information from dmesg, probes it for SCSI emulation, and displays the information
    in a way that is easy to read. If all looks good, the device will be highlighted
    in green.


    With your pen drive’s physical location verified, the script now asks you if this
    is a new install or an upgrade. If this is a new pen drive install, type 1; and
    if it is an upgrade (meaning you already have Damn Small Linux working on this
    pen drive and you want to reinstall or upgrade the version of Damn Small Linux
    you are using), type u.


    Before the script proceeds, it needs to know if you are installing DSL for the
    first time or are upgrading. The dialog is shown in Figure 6-8.


