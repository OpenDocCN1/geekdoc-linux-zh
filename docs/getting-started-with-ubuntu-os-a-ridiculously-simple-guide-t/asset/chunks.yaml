    ## Introduction


    You’ve probably used Windows OS; maybe you’ve used MacOS. But Linux?


    Linux has been around for years, but it’s still relatively unused by the masses.
    This isn’t to say it isn’t powerful. Some argue that it’s more powerful than any
    OS out there.


    This book will cover arguably the most popular version of Linux: `Ubuntu`.


    You’ll learn about:

    - Installing Ubuntu

    - Where things are

    - An overview of the core features

    - An overview of the software

    - Using Ubuntu Utilities

    - Using Ubuntu settings

    - And more


    The book is intended for beginners who have never used Ubuntu or are still considering
    whether they want to download it.


    ## Start Here


    This chapter will cover: Installing Ubuntu System requirements How to get Ubuntu
    Creating an account Updating Ubuntu


    ### Installing Ubuntu


    Before you can use Ubuntu, you need to first have Ubuntu. If you’re using a computer
    that already has it, then you can obviously skip this section.


    ### System Requirements


    While you can certainly use Ubuntu on a heavy duty computer with lots of processing
    power and RAM, Ubuntu was built to be compatible with older computers; many people
    have Ubuntu set up on old computers, so this makes sense. The barebones system
    requirements are below:


    - 2 GHz dual core processor

    - 4 GB RAM (system memory)

    - 25 GB of hard-drive space (or USB stick, memory card or external drive)

    - VGA capable of 1024x768 screen resolution

    - Either a CD/DVD drive or a USB port for the installer media

    - Internet access is helpful


    ### How to Get Ubuntu


    There are really three approaches to getting Ubuntu: the easy way, the slightly
    harder way, and the hardest way; that’s not to say any of these approaches are
    complicated—but some are easier than others.


    If you want zero effort, and don’t want to install Ubuntu on your computer, then
    I recommend going online and buying a USB drive with Ubuntu pre-installed; they
    typically cost around $20, and the benefit of them is you can run it on your computer
    without actually installing it—it boots from the USB. You turn off your computer,
    and reboot it from the USB; when you are done using it, you shut down Ubuntu,
    and remove the USB. Once you reboot your computer, the default operating system
    is still there—along with all of your programs and files.


    You can also do this yourself if you have a spare USB, but you will need to find
    a guide online that shows you how to install it.

