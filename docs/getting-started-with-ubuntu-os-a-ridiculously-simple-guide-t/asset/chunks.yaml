    ￼


    Unlike many operating systems, Ubuntu is pretty lightweight, which means you don’t
    have to have it installed on your computer—you can put it on a USB stick and boot
    it from a normal computer. This app helps you do that.


    ￼


    ![image48.png](Images/image-CJRR8IR5.png)


    Sudoku


    As you probably guess from the name and icon image, Sudoku is the Ubuntu version
    of the popular game.


    ￼


    When it launches, you can select the difficulty level of the app.


    ￼


    ![image116.png](Images/image-OHEIAJ59.png)


    Text Editor


    There are two ways to create documents on Ubuntu: Writer and Text Editor.


    ￼


    Text Editor is for creating notes without any markup language or fancy fonts;
    it also helps you clean up text—you can copy and paste things you find on the
    web into it to quickly remove images and hyperlinks. It strips away anything fancy
    from the text.


    ￼


    ![image153.png](Images/image-RCCGXNIL.png)


    Thunderbird


    Thunderbird is from the makers of Firefox.


    ￼


    It is Mozilla’s version of Microsoft Outlook and helps you organize your email.


    ￼


    ![image98.png](Images/image-EK239P8S.png)


    To Do


    To Do lets you create very simple checklists.


    ￼


    When you open it for the first time, there is a list called Personal, but nothing
    is inside it.


    ￼


    ![image135.png](Images/image-D4M02WQE.png)


    You can create a new list by clicking on New List in the upper left corner, then
    naming the list and selecting Create List.


    ￼


    ![image54.png](Images/image-IZLLRGLC.png)


    The list will now appear, but it will still be empty.


    ￼


    ![image155.png](Images/image-1L6UMDO1.png)


    Double click it to open it, then type in what you want to add and hit enter.


    ￼


    ![image63.png](Images/image-TMR48GH4.png)


    Your list will now show entries.


    ￼


    ![image90.png](Images/image-G817MJNT.png)


    Transmission


    Transmission is an app for sharing files.


    ￼


    It lets you create what is known as a torrent, which others can download.


    ￼


    ![image45.png](Images/image-JKXW6YLD.png)


    Ubuntu Software


    As you have seen in this section, there’s a lot of software on Ubuntu, but there’s
    even more!


    ￼


    The Ubuntu Software app will launch an online store where you can find even more
    apps for your computer.


    ￼


    ![image25.png](Images/image-9KTHRRH4.png)


    It shows you bestselling and recommended apps, but you can also use the top bar
    to search for apps; also on that top bar are options to see what you currently
    have installed and if there are updates to what you have installed.


    ￼


    ![image100.png](Images/image-GVZVDRJH.png)


    Videos


    Videos, as you probably expect, is where you go to watch video files—you can also,
    of course, still watch them in the Firefox browser if the video is on a website
    (like YouTube).


    ￼


    When you open the app, it is empty.


    ￼


    ![image19.png](Images/image-WQ0G0EQI.png)


    Clicking channels will show several different video services available.


    ￼


    ![image79.png](Images/image-I7VJSSMG.png)


    You can also use the + button in the upper left corner to add videos.


    ￼


    ![image94.png](Images/image-BAQO62Y9.png)


    Utilities Folder


    Finally there’s the Utilities folder.


    ￼


    There is a lot here, so for now, just know where it is; I’ll cover it in greater
    detail in a later section.


    ￼


    ![image93.png](Images/image-02T7W5FU.png)


    ## [4]


    ## Ubuntu Utilities


    | This chapter will cover: Calculator Passwords and Keys Disk Usage Logs And more!
    |


    Inside the All Apps menu is a folder called Utilities; as you can expect from
    the name, this is where programs are that perform actions to help you monitor
    your computer and documents.


    ￼


    ![A screen shot of a phone Description automatically generated with medium confidence](Images/image-INCH4Y1V.png)


    Some of these programs you’ll use more often than others—some you will not use
    at all. To help you understand each, this chapter will give you an overview of
    what each program does.


    Archive Manager


    Have you ever opened your email and got an attached message that is Zipped? That’s
    called an archive file and that’s what an archive manager does.


    ￼


    To create an archive (compressed) file, click the + button.


    ￼


    ![Graphical user interface, application Description automatically generated](Images/image-W2E1XS7V.png)


    Next, name your file, select the compression type (e.g. .tar.gz), and select the
    location of the folder.


    ￼


    ![Graphical user interface, application Description automatically generated](Images/image-DW7UXAMV.png)


    Under Other Options, you can create a password to encrypt the file and split it
    into volumes.


    ￼


    ![Graphical user interface, text, application Description automatically generated](Images/image-6R8MQIFL.png)


    Backups


    Backups creates a backup of your computer in case you do something wrong and need
    to reinstall a disk image; you can get started once you open the program by clicking
    on Create Backup. You may need to install additional files.


    ￼


    Calculator


    Calculator is probably what you expect: a calculator.


    ￼


    But it’s more than a basic calculator; you can select from the dropdown to select
    different calculator types: basic, advanced, financial, programming and keyboard.


    ￼


    ![A picture containing text, screenshot, electronics Description automatically
    generated](Images/image-V78LNR17.png)


    Each mode has a unique interface to make calculations easier.


    ￼


    ![A screen shot of a calculator Description automatically generated with medium
    confidence](Images/image-FEOXSW9F.png)


    Characters


    Characters is a little confusing; from the icon it looks like it’s where you go
    to add characters and symbols to your text. That’s only partly true.


    ￼


    ![Graphical user interface, text, application, chat or text message Description
    automatically generated](Images/image-53KMMFM0.png)


    A better name for the Characters app might be emojis. You get a list of hundreds
    of symbols, characters and emojis.


    ￼


    ![A picture containing shape Description automatically generated](Images/image-WRCAS1A2.png)'
