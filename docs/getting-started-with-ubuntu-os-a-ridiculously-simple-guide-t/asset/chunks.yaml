    Remmina 允许你使用 Ubuntu 远程登录另一台电脑——这样即使不在桌旁，也可以从那里获取文件和其他内容。


    ![image109.png](img/image-YP5BH6MV.png)


    # Rhythmbox


    Rhythmbox 是 Ubuntu 对 iTunes 的回应；它用于收听各种音频。


    虽然你可以用 Rhythmbox 播放 `MP3` 等文件，但大多数人用它来听播客（Podcasts）和电台。


    ![image121.png](img/image-UCTBA5R7.png)


    当你点击“播客”之类的项目时，它是空的。你必须手动搜索并添加它们。点击“添加”。


    ![image80.png](img/image-OUZUWI4B.png)


    然后搜索播客的名字，点击添加。


    ![image104.png](img/image-DMCNXBH6.png)


    # 设置


    “设置”（Settings）是你精调 Ubuntu 的地方。


    设置中有很多值得发现的内容，我会在本书的后部分花更多时间来介绍。


    ![image160.png](img/image-9UPIRHJ3.png)


    # Shotwell


    Shotwell 是一个照片管理应用。


    当你第一次启动它时，它是空的。


    ![image124.png](img/image-ZXJF5IY8.png)


    要添加照片，前往`File > Import From Folder`（文件 > 从文件夹导入），找到照片的位置（例如`SD 卡`或`USB 盘`）。


    ![image66.png](img/image-LYIRTT3Z.png)


    # 软件与更新


    应用程序下有两个更新器。


    第一个应用会打开“软件与更新”（Software & Updates），允许你勾选想要获取的更新类型。


    ![image38.png](img/image-INRCPUCR.png)


    ## 软件更新


    第二个更新器是自动检查器。此应用会启动一个窗口检查是否有可用的更新。


    ![image50.png](img/image-33ISJ3I8.png)


    如果有更新，它会询问你是否想要安装或提醒你安装。


    ![image87.png](img/image-HUV9WNQZ.png)


    ## 启动应用程序首选项


    “启动应用程序”（Startup Applications）是一个简单的启动程序。你可以用它选择每次电脑启动时想要启动的不同项目。


    ![image64.png](img/image-6PWYYY31.png)


    # 启动盘


    “启动盘”（Startup Disk）允许你创建一个可启动的 Ubuntu 版本。与许多操作系统不同，Ubuntu 非常轻量，这意味着你不需要将其安装在电脑上——你可以把它放在`USB
    盘`上并从普通电脑启动。此应用可以帮助你实现这一点。


    ![image48.png](img/image-CJRR8IR5.png)


    # 数独


    正如你可能从名字和图标猜的那样，数独是这款流行游戏的 Ubuntu 版本。启动时，你可以选择应用的难度级别。


    ![image116.png](img/image-OHEIAJ59.png)


    # 文本编辑器


    在 Ubuntu 上创建文档有两种：`Writer` 和“文本编辑器”（Text Editor）。


    文本编辑器用于创建不带任何标记语言或花哨字体的笔记；它还能帮助你清理文本——你可以将从网上找到的内容复制并粘贴到这里，快速删除图像和超链接。它会剥离文本中任何复杂的元素。


    ![image153.png](img/image-RCCGXNIL.png)


    # Thunderbird


    Thunderbird（火鸟）由 Firefox 的开发者制作。它是 Mozilla 版本的`Microsoft Outlook`，帮助你组织电子邮件。


    ![image98.png](img/image-EK239P8S.png)


    # 待办事项


    “待办”（To Do）允许你创建非常简单的清单。当你第一次打开它时，有一个名为`Personal`（个人）的列表，但里面什么都没有。


    ![image135.png](img/image-D4M02WQE.png)


    你可以点击左上角的“New List”（新列表）来创建一个新列表，然后命名并选择“Create List”（创建列表）。


    ![image54.png](img/image-IZLLRGLC.png)


    列表现在会出现，但它仍然是空的。


    ![image155.png](img/image-1L6UMDO1.png)


    双击打开它，输入你想添加的内容并按回车键。


    ![image63.png](img/image-TMR48GH4.png)


    你的列表现在会显示条目。


    ![image90.png](img/image-G817MJNT.png)


    # Transmission


    Transmission 是一个共享文件的应用。它允许你创建所谓的`torrent`种子文件，其他人可以下载。


    ![image45.png](img/image-JKXW6YLD.png)


    # Ubuntu 软件


    正如你在这一节看到的，Ubuntu 上有很多软件，但更多！“Ubuntu 软件”（Ubuntu Software）应用将启动一个在线商店，你可以在那里为电脑寻找更多应用。


    ![image25.png](img/image-9KTHRRH4.png)


    它向你展示畅销和推荐的应用，但你也可以使用顶栏搜索应用；顶栏上还有查看当前已安装以及是否有更新的选项。


    ![image25.png](img/image-9KTHRR4.png)


    # 视频


    视频，正如你预期的，是你可以观看`Firefox`视频文件的地方。


    当你打开它时，它是空的。


    ![image98.png](img/image-EK239P8S.png)


    点击左上角的`+`按钮可以添加不同的视频服务。


    ![image79.png](img/image-BAQO62.png)


    # 工具


    最后是“工具”（Utilities）文件夹。


    | 本章将涵盖：计算器、密码密钥、磁盘使用及更多！ |


    在“所有应用程序”菜单中有一个名为“工具”的文件夹；正如名字所示，这里是执行操作的程序。有些程序你会用得很频繁，有些则完全不用。


    ![image93.png](img/image-02T7W5.png)


    ### 存档管理器


    你是否打开过邮件并收到过压缩包附件？那被称为归档文件，这就是存档管理器（Archive Manager）的功能。


    要创建存档（压缩）文件，点击`+`按钮。


    ![image1.png](img/image-W2E1XS7V.png)


    接下来，命名文件，选择压缩类型（例如`.tar.gz`），并选择文件的位置。


    ![image.png](img/image-DW7UXAM.png)


    在“其他选项”下，你可以设置密码来加密文件并将其分成卷。


    ![image.png](img/image-6R8MQIF.png)


    ### 备份


    备份（Backups）创建电脑的备份，以防你出错并需要重装磁盘镜像；打开程序后，点击“创建备份”即可开始。你可能需要安装额外的文件。


    ### 计算器


    计算器可能就是你预期的：一个计算器。但它不仅仅是基础计算器；你可以从下拉菜单中选择不同的计算器类型：基础、高级、财务、编程和键盘。


    ![image.png](img/image.png)


    每种模式都有独特的界面来使计算更简单。


    ### 字符


    “字符”（Characters）名字有点困惑；从图标上看，它像是你向文本中添加字符和符号的地方。这只是部分正确。


    ![image.png](img/image-53KMMFM0.png)


    字符应用的更好名字可能是表情符号（emojis）。你可以获得数百个符号、字符和表情符号的列表。


