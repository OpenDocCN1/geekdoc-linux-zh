    ![A screenshot of a computer Description automatically generated with medium confidence](Images/image-E3ZVBS1U.png)


    On the bottom, you can also toggle between `All` and `Frequent` to show only the
    programs you use most.


    ![picture containing text Description automatically generated](Images/image-PHZA24TP.png)


    If you want to copy (this will not move entirely, so you’ll still have a copy
    in the apps menu) any of the programs to `Favorites Bar`, then right click the
    program and click `Add Favorites`.


    ![picture containing text Description automatically generated](Images/image-X7TD6N7Z.png)


    ## Grouping Apps


    When you start getting a lot of apps, it makes sense to group them to make it
    easier to find what you are looking for. For example, you can put all games in
    one place. To group apps, click and hold the app that you want to group, then
    move it on top of the app you want to group with.


    ![Graphical user interface, application Description automatically generated](Images/image-F2I8A26.png)


    Once you release your mouse, they’ll be grouped together. You can continue to
    group by dragging other apps into the same folder.


    ![Graphical user interface, application Description automatically generated](Images/image-86LNA3.png)


    ## Ubuntu Software


    This chapter will cover: Overview of software, Games & Updates And more.


    | Overview of software | Games & Updates And more |

    | :--- | :--- |

    | `Samsung` is an Android phone…kind of. While people say `Android` what you have
    to understand is `Android` itself isn’t “Phone.” `Android` is the operating system
    on the phone (kind of like your computer probably runs). `Ubuntu` runs, but behind
    that is unique hardware and technology. `Samsung`’s phone build on `Android`.
    |

    | `Ubuntu` is plentiful with free software; some you’ll probably use every day
    and some will probably never use after you read about it. This chapter will cover
    all the software found in Ubuntu and briefly what it does, so you can decide if
    it’s something you’ll use later. To get started, click the app launcher on the
    `Favorites Bar`. |


    ### Additional Drivers


    The first app is `Additional Drivers`.


    ![A picture containing text Description automatically generated](Images/image-FQB00JC.png)


    This is where you will go if you get a new printer, mouse, etc., and need to install
    `additional drivers` to get it to work.


    ![Graphical user interface, text, application Description automatically generated](Images/image-BJBADIGE.png)


    ### Solitaire


    The next app is `Solitaire`.


    ![A picture containing text, outdoor, sign Description automatically generated](Images/image-442ZK2YN.png)


    As you probably can guess, `Solitaire` is a card game.


    ![Graphical user interface, application Description automatically generated](Images/image-4O0JBBGV.png)


    ### Calendar


    `Calendar` is where you go to make appointments in `Ubuntu`.


    When you launch it, it will give you the monthly calendar (you can change it to
    yearly or weekly view at the top) along with the three-day weather forecast; if
    you have something scheduled, you’ll see it on the date that it’s scheduled.


    ![A screenshot of a computer Description automatically generated with medium confidence](Images/image-7WUOSLHX.png)


    The easiest way to add (or edit) an event is to click the date the event takes
    place; this launches a box for you to add the details of the event. `Edit Details`
    will let you add more information—such as the time and place.


    ![Graphical user interface Description automatically generated](Images/image-03DOZCEK.png)


    You can also add an event by clicking the `+` sign on top of the app.


    ![Graphical user interface, text Description automatically generated](Images/image-A6LRLWRI.png)


    This launches a more detailed event box for you to add all of your information.


    ![Graphical user interface, text, application Description automatically generated](Images/image-KKPFFEGU.png)


    ### Cheese


    `Cheese` is a very basic camera / video taking app.


    Assuming your computer has a camera, you can use it to record a video of yourself
    or take a picture. Just select what you want to do on the bottom (photo, video,
    burst—burst is several photos at once), and then click the camera to the right
    of it. You can also add effects to your photo using the option to the far right.


    ![A person with a beard Description automatically generated with low confidence](Images/image-79E7AKVC.png)


    ### Files


    On Windows you find files with `File Explorer`; on Mac you use `Finder`; and on
    `Ubuntu` you use `Files`.


    On the side, you’ll see the most popular places (such as `Desktop` and `Downloads`).


    ![Graphical user interface, application Description automatically generated](Images/image-7LH5GOPE.png)


    On the upper right corner you can also search for files (or change how files show—for
    example, if you want to show thumbnails).


    ![Graphical user interface Description automatically generated](Images/image-MGAK7J6T.png)


    ### Firefox


    If you want to surf the Internet, the default browser is `Firefox`. Why `Firefox`
    and not `Chrome`? `Firefox` is developed by the nonprofit company, `Mozilla`,
    and is built for free platforms.


    ![Graphical user interface Description automatically generated](Images/image-DGPML3.png)

    '
  raw: '![A screenshot of a computer Description automatically generated with medium
    confidence](Images/image-E3ZVBS1U.png)


    On the bottom, you can also toggle between All and Frequent to show only the programs
    that you use most.


    ￼


    ![A picture containing text, device Description automatically generated](Images/image-PHZA24TP.png)


    If you want to copy (this will not move it entirely, so you’ll still have a copy
    in the apps menu) any of the programs to your Favorites Bar, then right click
    the program and click Add to Favorites.


    ￼


    ![A picture containing text, sign Description automatically generated](Images/image-X7TD6N7Z.png)


    ### Grouping Apps


    When you start getting a lot of apps, it makes sense to group them to make it
    easier to find what you are looking for. For example, you can put all your games
    in one place. To group apps, click and hold the app that you want to group, then
    move it on top of the app you want to group it with.


    ￼


    ![Graphical user interface, application Description automatically generated](Images/image-F2I82A26.png)


    One you release your mouse, they’ll be grouped together. You can continue to group
    by dragging other apps into that same folder.


    ￼


    ![Graphical user interface, application Description automatically generated](Images/image-86LUNNA3.png)


    ## [3]


    ## Ubuntu Software


    | This chapter will cover: Overview of software LibreOffice overview Camera Games
    Software & Updates And more |


    Samsung is a an Android phone…kind of.


    While people do say “Android Phone” what you have to understand is Android in
    itself isn’t a “Phone.” Android is the operating system on the phone (kind of
    like your computer probably runs Windows). Samsung runs the Android operating
    system, but behind that operating system is unique hardware and technology.


    So Samsung’s a phone build on Android Operating system. Kind of…but not exactly!
    Huh? I know! It’s a little confusing, right?


    A lot of Android phones use Google’s operating system and don’t reall


    Ubuntu is plentiful with free software; some you’ll probably use every day and
    some you will probably never use after you read about it. This chapter will cover
    all the software found in Ubuntu and briefly what it does, so you can decide if
    it’s something you’ll use later.


    To get started, click the app launcher on the Favorites Bar.


    ￼


    Additional Drivers


    The first app is Additional Drivers.


    ￼


    ![A picture containing text, electronics Description automatically generated](Images/image-FQB000JC.png)


    This is where you will go if you get a new printer, mouse, etc., and need to install
    additional drivers to get it to work.


    ￼


    ![Graphical user interface, text, application, email Description automatically
    generated](Images/image-BJBADIGE.png)


    Solitaire


    The next app is Solitaire.


    ￼


    ![A picture containing text, tree, outdoor, sign Description automatically generated](Images/image-442ZK2YN.png)


    As you probably can guess, Solitaire is a card game.


    ￼


    ![Graphical user interface, application Description automatically generated](Images/image-4O0JBBGV.png)


    Calendar


    Calendar is where you go to make appointments in Ubuntu.


    ￼


    When you launch it, it will give you the monthly calendar (you can change it to
    yearly or weekly view at the top of the software) along with the three-day weather
    forecast; if you have something scheduled, you’ll see it on the date that it’s
    scheduled.


    ￼


    ![A screenshot of a computer Description automatically generated with medium confidence](Images/image-7WUOSLHX.png)


    The easiest way to add (or edit) an event is to click the date the event takes
    place; this launches a box for you to add the details of the event. Clicking Edit
    Details will let you add more information—such as the time and place.


    ￼


    ![Graphical user interface Description automatically generated](Images/image-03DOZCEK.png)


    You can also add an event by clicking the + sign on top of the app.


    ￼


    ![Graphical user interface, text Description automatically generated](Images/image-A6LRLWRI.png)


    This launches a more detailed event box for you to add all of your information.


    ￼


    ![Graphical user interface, text, application Description automatically generated](Images/image-KKPFFEGU.png)


    Cheese


    Cheese is a very basic camera / video taking app.


    ￼


    Assuming your computer has a camera, you can use it to record a video of yourself
    or take a picture. Just select what you want to do on the bottom (photo, video,
    burst—burst is several photos at once), and then click the camera to the right
    of it. You can also add effects to your photo using the option to the far right.


    ￼


    ![A person with a beard Description automatically generated with low confidence](Images/image-79E7AKVC.png)


    Files


    On Windows you find files with File Explorer; on Mac you use Finder; and on Ubuntu
    you use Files.


    ￼


    On the side, you’ll see the most popular places (such as Desktop and Downloads).


    ￼


    ![Graphical user interface, application Description automatically generated](Images/image-7LH5GOPE.png)


    On the upper right corner you can also search for files (or change how files show—for
    example, if you want to show thumbnails).


    ￼


    ![Graphical user interface Description automatically generated](Images/image-MGAK7J6T.png)


    Firefox


    If you want to surf the Internet, the default browser is Firefox. Why Firefox
    and not Chrome? Firefox is developed by the nonprofit company, Mozilla, and is
    built for free platforms like Ubuntu.


    ￼


    Unsurprisingly, Firefox looks and works just as it would on any other operating
    system.


    ￼


    ![Graphical user interface, website Description automatically generated](Images/image-VGPVMR10.png)


    Language Support


    If you want to add another language to Ubuntu, you’ll need to go into Language
    Support.


    ￼


    When you open the app, it will remind you that you need to install additional
    languages; to save on storage space, this is something not included with the initial
    download.


    ￼


    ![Graphical user interface, text, application Description automatically generated](Images/image-L1S7EJ9O.png)


    LibreOffice Calc


    LibreOffice is the productivity software that comes with Ubuntu; Calc is a spreadsheet
    app.


    ￼


    If you’ve used Excel, Numbers, or any other spreadsheet tool, then it will be
    pretty easy to jump right in and start using it.


    ￼


    ![Graphical user interface, application, table, Excel Description automatically
    generated](Images/image-V2XBVHW0.png)


    LibreOffice Draw


    Draw is a very simple drawing app.


    ￼


    Using draw, you can either create drawings that you save as PNG or JPG, or that
    you export into the other LibreOffice tools.


    ￼


    ![Graphical user interface, application Description automatically generated](Images/image-A1I8RMNV.png)


    LibreOffice Impress


    LibreOffice Impress is presentation software.


    ￼


    It is very similar to PowerPoint or Keynote.


    ￼


    ![Graphical user interface, application Description automatically generated](Images/image-O9L386DI.png)


    LibreOffice Writer


    The last LibreOffice app is Writer.


    ￼


    Writer is Ubuntu’s version of Word or Pages. It’s to create documents.


    ￼


    ![Graphical user interface, application, Word Description automatically generated](Images/image-QV5LKLTX.png)


    LivePatch


    LivePatch installs patches to Ubuntu.


    ￼


    It’s a good idea to toggle it on (you need a free account for this), so your computer
    is always updated and protected with the latest critical patches.


    ￼


    ![Graphical user interface, text, application, email Description automatically
    generated](Images/image-CBGLYDVO.png)


    Mahjongg


    As you probably guessed, Mahjongg is another game for Ubuntu.


    ￼


    ￼


    ![A picture containing Word Description automatically generated](Images/image-9MQ85613.png)


    Mines


    Mines is another Ubuntu game that is very similar to Minesweeper on Windows.


    ￼


    Power Statistics


    Power Statistics is a barebones app that tells you about the health of your battery.


    ￼


    The app is more informative than actionable.


    ￼


    ![image125.png](Images/image-DXD1T45G.png)


    Remmina


    If you want to use your computer remotely, then Remmina will help out.


    ￼'
