    ## [5]


    ## Ubuntu Settings


    | This chapter will cover: Mouse settings Display settings Adding accounts Notifications
    And more! |


    Settings is where you can really start fine-tuning your OS, but, like Utilities,
    you’ll probably find many of these settings are things that you will never use.
    This section will walk you through what each one is.


    ￼


    ![Graphical user interface, text, application Description automatically generated](Images/image-X19BSZIK.png)


    Network


    Network is where you will go if you want to change your network setting—if you
    want to change your wi-fi, for example.


    ￼


    ![Graphical user interface, application Description automatically generated](Images/image-3GZAWXKU.png)


    Bluetooth


    Bluetooth is where you go to connect wireless headsets, mice, and other Bluetooth
    devices. It will be blank unless the device is in pairing mode.


    ￼


    ![Graphical user interface, application Description automatically generated](Images/image-6E93LTSP.png)


    Background


    Background changes your desktop image.


    ￼


    ![A picture containing text, screenshot Description automatically generated](Images/image-YEE6B4KL.png)


    Appearance


    Appearance changes where things appear on the screen (the dock, for example) and
    icon size; you can also create dark mode schemes here.


    ￼


    ![Graphical user interface, application, PowerPoint Description automatically
    generated](Images/image-RBUMET7A.png)


    Notifications


    Notifications lets you change the permission settings for every app you have installed—so
    some can send you push notifications while others cannot. This is helpful if you
    want notifications for email (notifications float onto your screen in little rectangular
    boxes); you can also toggle on Do Not Disturb mode which silences all notifications
    until you toggle it back off.


    ￼


    ![Graphical user interface, application Description automatically generated](Images/image-0LNJ0YYP.png)


    Search


    Search lets you toggle on and off where you search when you are looking for a
    file with the search tool.


    ￼


    ![Graphical user interface, application Description automatically generated](Images/image-HM2F5UQ6.png)


    Applications


    Applications lets you change the system settings for each specific app.


    ￼


    ![Graphical user interface, text, application Description automatically generated](Images/image-4PZ50OLA.png)


    Privacy


    Privacy lets you change what information is collected when certain things are
    triggered.


    ￼


    ![Graphical user interface, text, application Description automatically generated](Images/image-VVIGRN78.png)


    Online Accounts


    Online Accounts lets you add your different account sign-ins and save them to
    the OS. For example, if you want to use Facebook, you can add your account here.


    ￼


    ![Graphical user interface, application Description automatically generated](Images/image-E89MNFN2.png)


    Sharing


    Sharing lets you share your computer either with another computer or another media
    device.


    ￼


    ![Graphical user interface, text, application, email Description automatically
    generated](Images/image-4AY7LA87.png)


    Sound


    Sound lets you adjust the volume that is coming out of your device, as well as
    the levels of your mic and the balance of the speakers.


    ￼


    ![Graphical user interface, application Description automatically generated](Images/image-U4PRQS3E.png)


    Power


    Power lets you pick when your computer will go into standby as well as what happens
    when it loses power or is using battery power.


    ￼


    ![Graphical user interface, text, application Description automatically generated](Images/image-6AG88BSO.png)


    Display


    Display lets you pick the orientation of your monitor—if you have a monitor in
    horizontal mode, for example, you can change it here.


    ￼


    ![Graphical user interface, application Description automatically generated](Images/image-6S7FZZCD.png)


