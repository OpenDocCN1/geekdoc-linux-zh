    ## 6


    ## Tips & Tricks


    | This chapter will cover: Parting tips to help you get the most out of Ubuntu
    |


    Now that you know your way around Ubuntu, below are a few tips and tricks to help
    you get the most of it.


    #### Terminate Unresponsive Programs

    You’ve seen how you can use `System Monitor` to see what is hogging memory. But
    what do you do to stop whatever is hogging the memory?


    If you go to `Processes`, then sort by “Memory” you can see what is using the
    most memory; right click on the process name and you’ll get an option to end or
    kill it.


    ![Table Description automatically generated](Images/image-01ROQXK1.png)


    #### Download a Desktop Environment

    If you’ve used Windows or Mac, then you probably get excited when a new big update
    comes out because it means things might actually look different; this is “kind
    of” true on Ubuntu, because they do have updates that change the look and feel;
    but you can also change the look and feel by downloading a new desktop environment.


    ![A screenshot of a computer Description automatically generated with low confidence](Images/image-SE1ZU2FL.png)


    Desktop environments come in all sorts of styles. Google “Linux Desktop Environment”
    and you’ll see what I mean—but download at your own risk; some environments are
    more reputable that others.


    #### Install Software

    You’ve seen the software that Ubuntu has to offer you. But there’s so much more!
    Here are some popular programs to check out.


    - `VLC` - If you watch a lot of movies that you download then perhaps the best
    video player is `VLC` (https://www.videolan.org/vlc/index.html).

    - `Gimp` - If you plan on editing graphics and images, then the go-to program
    is `Gimp` (https://www.gimp.org).

    - `Telegraph` - For text messaging, Telegraph has become one of the most popular
    solutions not only on Ubuntu but on other operating systems (https://telegram.org).

    - `Kdenlive Video Editor` - Ubuntu isn’t exactly known for video editing, but
    that doesn’t mean it can’t be done; `Kdenlive Video Editor` (https://kdenlive.org/)
    is an effective video editor if you want to edit your videos within the Ubuntu
    OS.

    - `Foliate` - If you want to read books on Ubuntu, then you need an eReader, and
    unfortunately most eBook stores don’t offer a Linux equivalent of their apps;
    if you want an eReader to read your books, then try `Foliate` (https://johnfactotum.github.io/foliate/).

    - `Lollypop` - The music player that comes with Ubuntu works great; but if you
    want to try an alternative, then `Lollypop` (https://wiki.gnome.org/Apps/Lollypop)
    is a great platform.

    - `Cawbird` - If you are in love with tweets, then you’ll need a Twitter client
    that runs in Linux; you can’t go wrong with the `Cawbird` Twitter client (https://ibboard.co.uk/cawbird/).

    - `Chrome` - `Firefox` is a fast and effective web browser; but if you are still
    living in a Google world, don’t fret: `Google Chrome` is available on Ubuntu.
    Get it here: https://www.google.com/chrome/


    #### Install Games

    You’ve probably heard about Switch, Xbox and PlayStation; but arguably the most
    popular gaming system is none of those. It’s `Steam`.


    `Steam` is a popular gaming platform that lets you play video games across several
    operating systems—including Ubuntu. It’s free to download. Game prices vary, but
    are frequently cheaper than what you would pay on traditional gaming devices.


    ## Appendix


    ## Keyboard shortcuts


    Note: the `super` key can usually be found on the bottom-left of your keyboard,
    next to the `Alt` key. On a Windows keyboard, it’s usually the key with the Windows
    logo.


    ### Desktop Keyboard Shortcuts


    | `Alt+F1` or the `Super` key | Toggle between the `Activities` overview and desktop.
    |

    | `Alt+F2` | Opens pop up command window . |

    | `Super+Tab` | Toggle between windows. |

    | `Super+` ` | Toggle between windows from the same application |

    | `Alt+Esc` | Toggle between windows in the current workspace. |

    | `Ctrl+Alt+Tab` | Give keyboard focus to the top bar. |

    | `Super+A` | Reveal the applications list. |

    | `Super+Page Up` and `Super+Page Down` | Toggle between workspaces. |

    | `Ctrl+Alt+Delete` | Reveal the Power Off / Restart dialog. |

    | `Super+L` | Lock the screen. |

    | `Super+V` | Reveal the lists of notification list. |

    | `Ctrl+A` | Select all text or items. |

    | `Ctrl+X` | Cut text or item (i.e. remove it) |

    | `Ctrl+C` | Copy text or image to the clipboard. |

    | `Ctrl+V` | Paste text or item to selected area. |

    | `Ctrl+Z` | Undo |

    | `Prnt Scrn` | Take a screenshot |

    | `Alt+Prnt Scrn` | Take a screenshot of a window only. |

    | `Shift+Prnt Scrn` | Take a screenshot of a specific area of the screen |

    | `Ctrl+Alt+Shift+R` | Start and stop screencast recording. |


