    ## 介绍


    你可能用过 Windows；可能用过 macOS。但 Linux 呢？


    Linux 已经存在很多年了，但尚未被普及。这并不是说它不强大。有些人认为它比任何操作系统都强大。


    本书将介绍最流行的版本：`Ubuntu`。


    你将学习：

    - 安装 Ubuntu

    - 所在位置

    - 核心功能概述

    - 使用 Ubuntu 工具

    - 使用 Ubuntu 设置

    - 以及更多


    本书适用于从未用过 Ubuntu 或仍在考虑是否使用的初学者。


    ## 从这里开始


    本章将涵盖：安装 Ubuntu 系统要求 如何获取 Ubuntu 创建账户 更新 Ubuntu


    ### 安装 Ubuntu


    在运行 Ubuntu 之前，你首先需要拥有它。如果你使用的电脑已经安装了，显然可以跳过此节。


    ### 系统要求


    虽然你可以在高性能处理器和内存的大型电脑上运行 Ubuntu，但 Ubuntu 的设计兼容旧电脑；许多人在旧电脑上安装了它，所以这是合理的。最低系统要求如下：


    - 2 GHz 双核处理器

    - 4 GB RAM（系统内存）

    - 25 GB 硬盘空间（或 USB 盘、内存卡或外部硬盘）

    - 能够 1024x768 分辨率的 VGA 接口

    - 具有光驱/DVD 驱动器或用于安装介质的 USB 端口

    - 网络访问会有帮助


    ### 如何获取 Ubuntu


    获取 Ubuntu get 三种方法：简单的方法、稍微困难的方法以及最困难的方法；这并不是说这些任何方法都很复杂。


    如果你不想费力，且不想在电脑上安装 Ubuntu，我建议在网上购买一个预装了 Ubuntu 的 USB 盘；它们通常售价 20 美元左右，它们的优点是让你可以在电脑上运行它而无需实际安装——它从
    USB 启动。你关闭电脑，然后从 USB 重启；当你用完后，关闭 Ubuntu 并拔掉 USB。当你重启电脑时，默认操作系统仍然在那里——以及你所有的程序和文件。


    你也可以用空闲的 USB 盘自己操作，但你需要在网上找一份教你如何安装的指南。


    '
- fmt: '

    The next approach would be to run it in a virtual client; what that means is you
    install virtual software on your computer and you run it within that virtual software.
    That means your regular operating system and Ubuntu are running at the same time.
    This is the method I currently use.


    I use `Parallels` for Mac (it’s also available for Windows); there is other software
    that works in a similar way.


    After downloading `Parallels`, it will ask you what Operating System you want
    to install (it supports Windows and Linux); if you aren’t prompted to install
    it, then you would just click the `+` in the upper right corner.


    There’s an option to download Ubuntu, which is free (`Parallels`, however, is
    not free).


    ![Graphical user interface, application Description automatically generated](Images/image-5A3TSIUU.png)


    It will tell you the amount of space you need, and you click `Download` to begin.


    ![Graphical user interface, website Description automatically generated](Images/image-E4VZBD1J.png)


    Once it’s installed, anytime you want to run Ubuntu, you just open `Parallels`
    and click it from the `Control Center` box.


    ![Graphical user interface, text, application Description automatically generated](Images/image-JFZKCXTO.png)


    Notice in the screenshot below that the Mac OS menu bar is visible while Ubuntu
    is running? That’s because they are running at the same time.


    ![A screenshot of a computer screen Description automatically generated with medium
    confidence](Images/image-8FR79MJ9.png)


    It does take a lot of power to run to operating systems together, so don’t do
    this unless your computer is newer and can support it—otherwise, you’ll find things
    run pretty slow.


    Finally, the last way to get Ubuntu is to go to `https://ubuntu.com` and download
    it, then follow the instructions to run it on your computer natively—that means
    your computer is erased and every time you boot it, it will run Ubuntu. Your computer
    will be an exclusively Ubuntu computer.


    ## Creating an Account


    The first time you run Ubuntu, it will ask at launch if you want to connect or
    create an account. You can either connect it or skip it (`skip` is in the upper
    right corner); if you are using Ubuntu on multiple devices or from a USB stick,
    then connecting it would be a good idea, as it will sync everything in the cloud.


    ![Graphical user interface, application Description automatically generated](Images/image-1K8SGC83.png)


    ## Update Ubuntu


    The next thing you’ll probably see is the `Software Updater` prompt; we’ll look
    at how to update Ubuntu without this prompt later in the book; for now you can
    either download it or skip it.


    ![Graphical user interface, text, application, chat or text message Description
    automatically generated](Images/image-DOOTN6MP.png)


    ## [2] Ubuntu Crash Course


    | This chapter will cover: What’s new What’s the difference between phones? Cosmetics
    of the phone How does it compare |


    You’ll probably notice right away that Ubuntu bears a lot of similarities to Windows
    and Mac. There’s an app bar, a desktop and even a trash bin.


    ![A screenshot of a computer screen Description automatically generated with medium
    confidence](Images/image-Y2BTGD1K.png)


    Let’s look at the four main components of Ubuntu: the top menu bar, the desktop,
    the favorites bar, and the apps menu.


    ### The Menu


    The top menu of Ubuntu is a lot more basic than many operating systems. It has
    the date, and three options to the far right side.


    The bar does change when different apps are open, but still keeps a pretty barebones
    design.


    On many operating systems, each icon in the upper right menu will open a separate
    menu; not so with Ubuntu—click on any of them, and the same options menu opens.


    ![Graphical user interface, application Description automatically generated](Images/image-WYBSKSUQ.png)


    The arrow to the right of the option tells you there are more options available.
    Under `Wired Connection`, for example, you can turn off the connection, or go
    into your network settings.


    ![Graphical user interface, text, application, chat or text message Description
    automatically generated](Images/image-ULJ53JNS.png)


    `Power Settings` is something you might want to dig further into if you have a
    laptop that relies on a battery source—you may also want to go here on a desktop
    if you want to have your monitor turn off when not in use or just don’t want to
    consume as much electricity.


    ![Graphical user interface, text, application Description automatically generated](Images/image-GJ5H85Z1.png)


    The battery options menu has just three options; it doesn''t look like any of
    them are buttons, but if you click them, they do open into pop out boxes.


    ![Graphical user interface, text, application, email Description automatically
    generated](Images/image-D7OG9V1Z.png)


    To close any of the boxes, just click the `X` in the upper right corner (it saves
    automatically).


    ![Graphical user interface, application Description automatically generated](Images/image-BDIRMG9O.png)


    There are a few options when you are ready to turn off your computer:


    - **Lock**: This keeps the computer on, but puts a login screen in front of it;
    it’s good if you are taking a coffee break and just don’t want anyone to use your
    computer while you are away.

    - **Log Out**: Logs out of your account and returns to the login screen.

    - **Suspend**: Puts your computer into a standby mode.

    - **Power Off**: Your computer is completely off.


    ![Graphical user interface, text, application Description automatically generated](Images/image-MA1X1O92.png)


    ### The Desktop


    The desktop is going to be pretty empty. You can drag apps onto the desktop to
    create shortcuts. You can also right click anywhere on the desktop to open a few
    more options. Most of them you won’t be using—`Open in Terminal`, for example,
    is a DOS-like command program that won’t be covered in this book.


    The option most people will probably want to change is the background.


    ![Graphical user interface, application Description automatically generated](Images/image-XQNOF0BZ.png)


    When you click `Change Background`, a window opens up with wallpapers that are
    available.


    ![Graphical user interface, application, PowerPoint Description automatically
    generated](Images/image-BWZJLJWJ.png)


    There are not a lot of backgrounds to choose from; if you want to add your own,
    just click `Add Picture` in the upper corner.


    As you start deleting things on Ubuntu, they’ll go into the `Trash` like they
    would on any operating system; you can empty it the same way—right click it, then
    select `Empty Trash`.


    ![A picture containing text, sign Description automatically generated](Images/image-6FUKH5LA.png)


    ### Favorites Bar


    The Favorites Bar is home to the applications you use most; the idea is to give
    you quick and easy access.


    ![Graphical user interface Description automatically generated](Images/image-57YK5MZ1.png)


    It may be a little odd seeing it on the left; on Windows and Mac, for example,
    you’ll see something similar on the bottom. And you can’t move it around easily
    like you can on Windows if you don’t like the placement. You can, however, move
    it to the right or bottom—it’s in `Settings` and I’ll cover it later in the book.


    The programs you see on the Favorites Bar are there by default when you install
    Ubuntu—that means they might not be your favorites. If it is something you won’t
    use, then right click it, and click `Remove from Favorites`.


    ![Graphical user interface, text, application, chat or text message Description
    automatically generated](Images/image-ADW9GMAW.png)


    ### Apps Launcher / Menu


    Finally, the last area—it’s on the bottom of your Favorites Bar—is the app launcher.
    This is where you’ll find all the programs currently installed on Ubuntu.


    There are not that many when you first install it—just two screens—but you can
    search for the program at the top to make it a little easier.

