    When you click on one, you can copy it and then paste it into your document.


    ![Graphical user interface, application Description automatically generated](Images/image-BM36ANLK.png)


    # Disk Usage Analyzer

    There isn’t a lot to the Disk Usage Analyzer. It helps you visualize how much
    storage you have on each of your drives.


    ![A picture containing logo Description automatically generated](Images/image-SOQYKSNI.png)


    # Disks

    Disks is where you go to create more volumes.


    ![A picture containing text, electronics, iPod, sign Description automatically
    generated](Images/image-L05LY29R.png)


    You may have one hard drive on your computer, but you can split that hard drive
    up into different images and have multiple volumes to it. For example, I have
    MacOS installed on one image, and I store all the Ubutu files on another.


    ![Graphical user interface, application Description automatically generated](Images/image-ST6GZPCY.png)


    # Document Scanner

    Document Scanner will only apply if you have a scanner attached to your computer.


    ![Graphical user interface, text, application Description automatically generated](Images/image-OUD7CLO1.png)


    Under the scan options you can select how you want to scan your document and what
    type of document it is.


    ![Graphical user interface, application Description automatically generated](Images/image-ZHLIJ2KI.png)


    # Document Viewer

    Document Viewer lets you view (but not edit) documents.


    # Fonts

    Fonts shows the fonts installed on your computer and lets you add and remove more.


    ![A picture containing text, sign, electronics, close Description automatically
    generated](Images/image-MWQZIPVV.png)


    # Help

    Help is where you’ll find the Ubuntu user guide.


    It breaks everything down by topic.


    ![Graphical user interface, text, application Description automatically generated](Images/image-3FY8BFW6.png)


    # Image Viewer

    Document Viewer is where you view documents and Image Viewer is where you view
    images.


    # Logs

    Anytime there is a bug or problem with software, you’ll get a record of it in
    your log—even if you don’t notice the bug. This is handy if you are troubleshooting
    a problem with software—sometimes they ask for a log.


    ![A picture containing graphical user interface Description automatically generated](Images/image-METINJ7V.png)


    When you open it, it will show the Important logs first, followed by logs by category.


    ![Graphical user interface, application Description automatically generated](Images/image-QS12LBTB.png)


    # Passwords and Keys

    Have you ever been on the Internet and it says “would you like to remember this
    password”; if you say yes, it stores them here.


    ![Application Description automatically generated with low confidence](Images/image-3BZGQLF4.png)


    You can view all of your passwords and keys or add new ones.


    ![Graphical user interface, application Description automatically generated](Images/image-2SNJ0S9L.png)


    # Screenshot

    Screenshot lets you capture what you see on your screen.


    You can either screenshot entire screens or segments of a screen or window.


    ![Graphical user interface, text, application, chat or text message Description
    automatically generated](Images/image-LT6O7FY8.png)


    # System Monitor

    As the name implies, System Monitor is where you can monitor your computer.


    ![Text Description automatically generated](Images/image-HB5R3O1Q.png)


    If your computer seems to be running slower than expected, you can use it to visualize
    how fast it’s going and how much memory it is using. From there, you can decide
    if you need to close more advanced programs.


    ![A picture containing scatter chart Description automatically generated](Images/image-XLKT6VWO.png)


    # Terminal

    If you have been using a computer long enough, then you probably remember the
    good old days of Microsoft DOS and command line. That’s Terminal.


    You probably won’t use Terminal that much (if you use it at all) but the idea
    of Terminal is to give you a place to add those old command lines you used to
    do in DOS. It’s a powerful program, but more for advanced users.


    ![Text Description automatically generated](Images/image-Z92PDA5V.png)


    ## [5]


    # Ubuntu Settings


    | This chapter will cover: Mouse settings Display settings Adding accounts Notifications
    And more! |


    Settings is where you can really start fine-tuning your OS, but, like Utilities,
    you’ll probably find many of these settings are things that you will never use.
    This section will walk you through what each one is.


    ![Graphical user interface, text, application Description automatically generated](Images/image-X19BSZIK.png)


    ## Network

    Network is where you will go if you want to change your network setting—if you
    want to change your wi-fi, for example.


    ![Graphical user interface, application Description automatically generated](Images/image-3GZAWXKU.png)


    ## Bluetooth

    Bluetooth is where you go to connect wireless headsets, mice, and other Bluetooth
    devices. It will be blank unless the device is in pairing mode.


    ![Graphical user interface, application Description automatically generated](Images/image-6E93LTSP.png)


    ## Background

    Background changes your desktop image.


    ![A picture containing text, screenshot Description automatically generated](Images/image-YEE6B4KL.png)


    ## Appearance

    Appearance changes where things appear on the screen (the dock, for example) and
    icon size; you can also create dark mode schemes here.


    ![Graphical user interface, application, PowerPoint Description automatically
    generated](Images/image-RBUMET7A.png)


    ## Notifications

    Notifications lets you change the permission settings for every app you have installed—so
    some can send you push notifications while others cannot. This is helpful if you
    want notifications for email (notifications float onto your screen in little rectangular
    boxes); you can also toggle on Do Not Disturb mode which silences all notifications
    until you toggle it back off.


    ![Graphical user interface, application Description automatically generated](Images/image-0LNJ0YYP.png)


    ## Search

    Search lets you toggle on and off where you search when you are looking for a
    file with the search tool.


    ![Graphical user interface, application Description automatically generated](Images/image-HM2F5UQ6.png)


    ## Applications

    Applications lets you change the system settings for each specific app.


    ![Graphical user interface, text, application Description automatically generated](Images/image-4PZ50OLA.png)


    ## Privacy

    Privacy lets you change what information is collected when certain things are
    triggered.


    ![Graphical user interface, text, application Description automatically generated](Images/image-VVIGRN78.png)


    ## Online Accounts

    Online Accounts lets you add your different account sign-ins and save them to
    the OS. For example, if you want to use Facebook, you can add your account here.


    ![Graphical user interface, application Description automatically generated](Images/image-E89MNFN2.png)


    ## Sharing

    Sharing lets you share your computer either with another computer or another media
    device.


    ![Graphical user interface, text, application, email Description automatically
    generated](Images/image-4AY7LA87.png)


    ## Sound

    Sound lets you adjust the volume that is coming out of your device, as well as
    the levels of your mic and the balance of the speakers.


    ![Graphical user interface, application Description automatically generated](Images/image-U4PRQS3E.png)


    ## Power

    Power lets you pick when your computer will go into standby as well as what happens
    when it loses power or is using battery power.


    ![Graphical user interface, text, application Description automatically generated](Images/image-6AG88BSO.png)


    ## Display

    Display lets you pick the orientation of your monitor—if you have a monitor in
    horizontal mode, for example, you can change it here.


    ![Graphical user interface, application Description automatically generated](Images/image-6S7FZZCD.png)


    ## Mouse & Touchpad

