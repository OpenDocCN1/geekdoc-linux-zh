  trans: '

    鼠标允许你选择主按钮以及鼠标速度。


    ![图形用户界面，应用程序描述自动生成](img/image-3ME2GIC6.png)


    ### 键盘快捷键

    键盘快捷键向你显示完整的快捷键列表，并允许你开启或关闭其他快捷键。


    ![图形用户界面，应用程序描述自动生成](img/image-4Z2ERDPP.png)


    ### 打印机

    打印机将显示你已安装的所有打印机；如果没有安装，将提供一个安装选项。


    ![图形用户界面，应用程序描述自动生成](img/image-6N7B84NN.png)


    ### 可移除介质

    可移除式介质允许你更改设备插入电脑时发生的情况；默认情况下，它会询问你想要做什么，但你可以将其改为启动某个程序。


    ![一张计算机截图，自动生成，置信度低](img/image-MPF3F5NG.png)


    ### 颜色

    颜色允许你为显示器添加色彩配置。


    ![图形用户界面，文本，应用程序描述自动生成](img/image-3U5RZRJ9.png)


    ### 地区与语言

    默认情况下，Ubuntu 使用英语作为语言，但如果你有需要，可以向操作系统添加其他语言。


    ![图形用户界面，文本，应用程序描述自动生成](img/image-GU1RCFVZ.png)


    ### 通用辅助

    通用辅助功能在大多数设备上被称为“辅助功能（accessibility）”，这是根据你可能存在的障碍调整设置的地方；例如，如果你视力不好，可以更改对比度和字体大小。


    ![图形用户界面，表格描述自动生成](img/image-XLM0O2UK.png)


    ### 用户

    Ubuntu 可以拥有多个用户配置文件，你可以在这里进行管理。例如，你可能想为你的孩子专门创建一个配置。


    ![图形用户界面，应用程序描述自动生成](img/image-WVZCVOTT.png)


    ### 默认应用程序

    默认应用程序允许你更改打开不同内容的程序；例如，如果你安装了不同的网络浏览器，可以在这里将其设为默认浏览器——而不是目前默认的 `Firefox`。


    ![图形用户界面，应用程序描述自动生成](img/image-DTZVVSMG.png)


    ### 日期与时间

    日期与时间允许你选择你所在的地区——例如，如果你处于 PST 时间或 EST 时间。


    ![图形用户界面，文本，应用程序，邮件描述自动生成](img/image-STA8OF5I.png)


    ### 关于

    关于允许你查看电脑的所有硬件以及你正在运行的 Ubuntu 版本。


    ![图形用户界面，应用程序描述自动生成](img/image-C1LAE84L.png)


    ## 6


    ## 技巧与妙门


    | 本章将涵盖：帮助你充分利用 Ubuntu 的实用提示 |


    现在既然你已经熟悉了 Ubuntu 的操作，下面是一些技巧和妙门，可以帮助你充分利用它。


    #### 终止无响应程序

    你已经看到如何使用 `System Monitor`（系统监视器）查看哪些程序占用了内存。但你该做什么来停止这些占用内存的程序呢？


    如果你进入 `Processes`（进程），然后按“Memory（内存）”排序，你可以看到哪些程序最内存内存；右键点击进程名称，将获得结束或杀死它的选项。


    ![表格描述自动生成](img/image-01ROQXK1.png)


    #### 下载桌面环境

    如果你用过 Windows 或 Mac，那么当新的大更新发布时，你可能会兴奋，因为这意味着事情可能真的看起来不同了；这在 Ubuntu 上“某种程度上”是真的，因为它们确实有更改视觉和体验的更新；但你也可以通过下载新的桌面环境来改变视觉和体验。


    ![一张计算机截图，自动生成，置信度低](img/image-SE1ZU2FL.png)


    桌面环境有各种风格。搜索“Linux Desktop Environment”你就会明白我的意思——但请自担风险下载；某些环境比其他环境更具声誉。


    #### 安装软件

    你已经看到了 Ubuntu 为你提供的软件。但还有非常多！这里是一些值得尝试的流行程序。


    - `VLC` - 如果你经常看下载的电影，那么最好的视频播放器可能是 `VLC` (https://www.videolan.org/vlc/index.html)。

    - `Gimp` - 如果你计划编辑图形和图像，那么首选程序是 `Gimp` (https://www.gimp.org)。

    - `Telegraph` - 对于文本消息，Telegraph 已成为 Ubuntu 以及其他操作系统上最流行的解决方案之一 (https://telegram.org)。

    - `Kdenlive Video Editor` - Ubuntu 并不完全以视频编辑而闻名，但这并不意味着不能这样做；如果你想在 Ubuntu 操作系统内编辑视频，`Kdenlive
    Video Editor` (https://kdenlive.org/) 是一个高效的视频编辑器。

    - `Foliate` - 如果你想在 Ubuntu 上看书，那么你需要一个电子阅读器，遗憾的是，大多数电子书商店没有提供这些应用的 Linux 版本；如果你需要一个电子阅读器来读书，请尝试
    `Foliate` (https://johnfactotum.github.io/foliate/)。

    - `Lollypop` - Ubuntu 自带的音乐播放器非常好用；但如果你想尝试替代方案，`Lollypop` (https://wiki.gnome.org/Apps/Lollypop)
    是一个很棒的平台。

    - `Cawbird` - 如果你热爱推特，Cawbird 是在 Ubuntu 上以及在其他操作系统上最流行的解决方案之一 (https://telegram.org/)。

    - `Chrome` - `Firefox` 是一个快速且有效的浏览器；如果你还喜欢 [Chrome](https://www.google.com/)。


    #### 安装游戏

    你已经看到了 Ubuntu 为你提供的软件。但还有非常多！`Steam` 是一个跨操作系统的流行的游戏平台。


    `Steam` 是一个跨操作系统的流行的游戏平台；在 Ubuntu 上运行它是免费的。


    ## 附录


    ## 键盘快捷键


    注意：`super` 键通常位于键盘左下方，在 `Alt` 键旁边。在 Windows 键盘上，它是带有 Windows 标志的键。


    ### 桌面快捷键


    | `Alt+F1` 或 `Super` 键 | 在 `Activities`（活动）和桌面之间切换。 |

    | `Alt+F2` | 打开弹出命令窗口。 |

    | `Super+Tab` | 切换窗口。 |

    | `Super+` | 切换同一应用程序的窗口 |

    | `Alt+Esc` | 在当前工作区内切换窗口。 |

    | `Ctrl+Alt+Tab` | 将键盘焦点交给顶部栏。 |

    | `Super+A` | 显示应用程序列表。 |

    | `Super+Page Up` 和 `Super+Page Down` | 切换工作区。 |

    | `Ctrl+Alt+Delete` | 显示关机/重启对话框。 |

    | `Super+L` | 锁定屏幕。 |

    | `Super+V` | 显示通知列表。 |

    | `Ctrl+A` | 选择所有文本或项目。 |

    | `Ctrl+X` | 剪切文本或项目（即将其删除）。 |

    | `Ctrl+C` | 文本或图像到剪贴板。 |

    | `Ctrl+V` | 将文本或项目粘贴到选定区域。 |

    | `Ctrl+Z` | 撤销 |

    | `Prnt Scrn` | 截图 |

    | `Alt+Prnt Scrn` | 仅对窗口截图。 |

    | `Shift+Prnt Scrn` | 对屏幕特定区域截图 |

    | `Ctrl+Alt+Shift+R` | 开始和停止屏幕录制。 |

