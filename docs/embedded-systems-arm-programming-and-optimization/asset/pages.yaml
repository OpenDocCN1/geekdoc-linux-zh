    # B.4 OPTIMIZING FLOATING-POINT CODE WITH NEON INTRINSICS


    Inline assembly does not include its own set of data types, but the NEON intrinsics
    are "type-aware" in that they expect their inputs to be NEON variables passed
    by value and their outputs are given as return values.


    The need for these special vector variables complicates the process by which NEON
    support is added to existing code that uses standard C-style arrays, luckily the
    compiler is to reinterpret standard arrays as NEON vector pointers. However, this
    requires NEON code include frequent casting, making the code appear more cluttered
    and less readable.


    To demonstrate how existing floating-point code can be enhanced with NEON intrinsics,
    this appendix examine a simple implementation for matrix inversion using Gaussian
    elimination.


    This method begins by concatenating the input matrix, shown as matrix A below,
    with the identity matrix:


    $A = \begin{bmatrix} 1 & 2 & 3 & 1 \ 2 & 1 & 4 & 1 \ 5 & 6 & 2 & 1 \ 7 & 6 & 3
    & 2 \end{bmatrix}$


    | R0 | 1 | 2 | 3 | 1 | 1 | 0 | 0 | 0 |

    | R1 | 2 | 1 | 4 | 1 | 0 | 1 | 0 | 0 |

    | R2 | 5 | 6 | 2 | 1 | 0 | 0 | 1 | 0 |

    | R3 | 7 | 6 | 3 | 2 | 0 | 0 | 0 | 1 |'
  merge: -1
  img_proc: true
- pgno: 247
  md: "Gaussian elimination performs successive row transformations on the concatenated\
    \ matrix having the objective of transforming the left-side of the concatenated\
    \ matrix—the original A matrix—into the identity and the right side into the inverted\
    \ form of A.\n\nThis requires three discrete steps. The first step is to convert\
    \ the matrix into triangular form, in which the transformations systematically\
    \ set each element of the bottom triangle to zeros beginning with the lower-left\
    \ element and each element along each upper-left to lower-right diagonal as shown\
    \ below.\n\n![](img/e6ebc663bbb86c6e7bf9ef22ad136e6f_247_0.png)\n\nFor purpose\
    \ of this simple example, assume that the original A matrix contains no zero elements.\
    \ This allows the matrix to be converted to triangular form using the following\
    \ row transformations:\n\n+   1. set element (3,0) to zero R3 → R3−($A_{3,0}/A_{2,0}$)R2\n\
    2. set element (2,0) to zero R2 → R2−($A_{2,0}/A_{1,0}$)R1\n3. set element (3,1)\
    \ to zero R3 → R3−($A_{3,1}/A_{2,1}$)R1\n4. set element (1,0) to zero R1 → R1−($A_{1,0}/A_{0,0}$)R0\n\
    5. set element (2,1) to zero R2 → R2−($A_{2,1}/A_{1,1}$)R1\n6. set element (3,2)\
    \ to zero R3 → R3−($A_{3,2}/A_{2,2}$)R1\n\nThis gives the result:\n\n| R0 | 1.0\
    \ | 2.0 | 3.0 | 1.0 | 0.0 | 0 | 0 |\n| R1 | 0 | -3.0 | -2.0 | -1.0 | -2.0 | 1.0\
    \ | 0 | 0 |\n| R2 | 0 | 0 | -10.3 | -2.7 | -2.3 | -1.3 | 1.0 | 0 |\n| R3 | 0 |\
    \ 0 | 0 | 0.9 | 1.2 | -1.0 | -1.2 | 1 |\n\nAssuming the input matrix is stored\
    \ in row-major order in array a and the identity matrix is stored in array b,\
    \ the code that performs this is as follows:\n\n```\nfor (i=3; i>0; i--) {\n \
    \   for (j=0; j<4; j++) {\n        coeff = -a[(i+j)*4+j]/a[((i+j)-1)*4+j];\n \
    \       for (k=0; k<4; k++) {\n            b[(i+j)*4+k] += coeff * b[((i+j)-1)*4+k];\n\
    \            a[(i+j)*4+k] += coeff * a[((i+j)-1)*4+k];\n        }\n    }\n}\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 248
  md: '# 248 APPENDIX B NEON Intrinsic Reference


    gcc 4.8.2 does not generate any NEON SIMD instructions when compiling this code,
    even when requesting maximum optimization and specifically identifying their target
    architecture and NEON support (using the -O3 -mfpu=neon -march=armv7-a switches).


    The programmer can replace the entire innermost loop (the k-loop) with two 4-wide
    (quad) VMLAQ (multiply-accumulate quad) intrinsics, using:


    ```

    *((float32x_t*)&bb((i+j)*4)));


    vmlaq_f32(*(float32x_t*)&bb((i+j)*4));


    *((float32x_t*)&ba((i+j)*4)));


    dupq_n_f32(coeff));


    *((float32x_t*)&a((i+j)*4)));


    vmlaq_f32(*(float32x_t*)&a((i+j)*4));


    *((float32x_t*)&a((i+j)*4)));


    dupq_n_f32(coeff));

    ```


    The a- and b-arrays must be referenced, as float32x4_t pointers, and then dereferenced
    for both the vector inputs and outputs. Also, the coeff scalar value must be converted
    from a scalar to a vector using the duplicate (vdupq) intrinsic.


    The next step of the Gaussian elimination is to refine the matrix by setting each
    element in the upper triangle to zero using a similar approach:


    +   1. set element (2,3) to zero

    2. set element (1,2) to zero

    3. set element (1,3) to zero

    4. set element (0,1) to zero

    5. set element (0,2) to zero

    6. set element (0,3) to zero


    | R0 | 1.0 | 0 | 0 | -0.6 | 0.3 | 0 | 0.1 |

    | R1 | 0 | -3.0 | 0 | 0 | -0.9 | 0.7 | -0.8 | 0.5 |

    | R2 | 0 | 0 | -10.3 | 0 | 1.1 | -4.3 | -2.5 | 2.9 |

    | R3 | 0 | 0 | 0 | 0.9 | 1.2 | -1.0 | -1.2 | 0 |


    This gives the following result:


    | R0 | 1.0 | 0 | 0 | -0.6 | 0.3 | 0 | 0.1 |

    | R1 | 0 | -3.0 | 0 | 0 | -0.9 | 0.7 | -0.8 | 0.5 |

    | R2 | 0 | 0 | -10.3 | 0 | 1.1 | -4.3 | -2.5 | 2.9 |

    | R3 | 0 | 0 | 0 | 0.9 | 1.2 | -1.0 | -1.2 | 0 |'
