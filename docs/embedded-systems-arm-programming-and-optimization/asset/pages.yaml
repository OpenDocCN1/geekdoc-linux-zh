- pgno: 152
  md: '# 4.2 Example Stencil: The Mean Filter


    may compute output element (x,y) as a function of the input elements above, below,
    to the left, and to the right, that is, (x,y-1), (x+y+1), (x-1,y), (x+1, y), any
    pattern is possible.


    Stencil loops are common in scientific and image processing code. They are often
    embedded deeply in nested loops, as when a stencil loop is applied iteratively
    (multiple times) to each frame of a video stream. As such, the stencil loop is
    generally the most expensive component of any application that requires it, so
    stencil loops are often a target for optimization.


    Luckily, stencil loops have two properties that allow for optimization. The first
    is their data-level parallelism. In cases where the input and output array are
    separate, each output element may be computed independently of the other output
    elements. This makes these stencil loops “embarrassingly parallel,” meaning that
    concurrent processors and/or functional units can compute output elements with
    little synchronization overhead. In other cases, the input and output arrays reside
    in the same memory pool, which creates dependencies between output elements. In
    this case, the stencil is still parallelizable but the code must constrain the
    order in which output are computed.


    The second property is their data reuse. Input elements referenced by one output
    overlap with elements referenced by other outputs. This way, stencils may reuse
    input data through the processor’s cache. However, stencil patterns are often
    complex in the sense that they span multiple dimensions, and can lead to conflict
    misses in the cache. This is especially problematic when there is a long delay
    between the first and second time the loop references a particular input element,
    which is especially challenging for larger input spaces and/or stencil stencils.


    # 4.2 EXAMPLE STENCIL: THE MEAN FILTER


    A mean filter is an example of a simple stencil. A mean filter calculates the
    average value among a set of inputs arranged on a 2D grid.


    Figure 4.1 depicts the relationship between the input and output arrays for a
    3 × 3 mean filter in which the input array is shown on the left and the output
    array is on the right. The elements of the first rows and four columns of each
    array are labeled with letters through P.


    In the 3 × 3 mean filter, each location of the output array is computed as the
