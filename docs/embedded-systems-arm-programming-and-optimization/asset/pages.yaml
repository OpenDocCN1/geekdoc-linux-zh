    Your camera may support a variety of image formats. Some cameras can compress
    individual frames or even the video itself prior via USB. For simplicity, in this
    section the video is captured as a series of uncompressed images.


    # 4.8.1 YUV and chroma subsampling


    Each camera supports its own unique set of pixel formats. Some cameras transmit
    pixels as RGB values but most cameras transmit pixels in the YUV colorspace. YUV
    stores each pixel as three values: luminance (Y), representing the brightness
    of the pixel, and two chromance (U, V)—or color—values.


    The luminance values that comprise the image themselves represent a grayscale
    version of the image. This is convenient because many computer vision and image
    processing algorithms require only the grayscale version of image. If, for example,
    the camera used the RGB colorspace, calculating the grayscale value of each pixel
    would require the following calculation:


    ```

    gray = 0.299 × red - 0.587 × green + 0.114 × blue

    ```


    The chromance values provide the color that allow YUV values to be converted into
    RGB values when needed. U represents the difference between the red color intensity
    and luminance, and V represents the difference between the blue intensity and
    luminance. Combined, the luminance and chromance values can be translated into
    red, green, and blue channels.


    YUV values can be translated into RGB values by combining the luminance with the
    chromance values using the following equations:


    ```

    R = Y + 1.13983 × (V - 128)

    G = Y - 0.39465 × (U - 128) - 0.58060 × (V - 128)

    B = Y + 2.03211 × (U - 128)

    ```


    As shown in the expressions, the red channel is a combination of luminance and
    the V-chromance values, the green channel is a combination of'
