  md: '# 1.8 Code Optimization Objectives 27


    For example, the following sequence of instructions performs a sequence of two
    dependent double-precision add instructions, because the second instruction cannot
    begin execution until the value of d0 is computed by the first instruction.


    ```

    1 faddd d0,d2,d4

    2 faddd d4,d0,d2

    ```


    In this case, the second instruction cannot enter the execute pipeline until the
    completion of the first instruction completes. The time between the first instruction
    and the initiation of the second instruction is spent executing stalls. Most floating-point
    programs contain many of these types of dependencies leading to data dependency
    stalls and resulting in low utilization of the floating-point functional units.


    Reducing the number of stalls is generally accomplished by rearranging the order
    of instructions in the code, allowing the latency of floating-point instructions
    to be "hidden" by executing other, non-dependent floating-point instructions in
    the meantime.


    Processors that perform aggressive dynamic scheduling—also called out-of-order
    execution—can do this automatically at runtime without needing to change the program
    code. However, most embedded processors, including those from ARM, cannot afford
    the cost of this, in terms of chip reality or power consumption, so they have
    limited or no capability for dynamic scheduling.


    Chapter 2 describes how to use optimization techniques to hide the latency of
    floating-point instructions and reduce the number of data dependencies using double
    buffering, software pipelining, and SIMD instructions.


    Another way to reduce the effect of floating-point latency is to convert floating-point
    instructions into fixed-point instructions. Fixed-point representation allows
    the usage of fractional numbers using the lower-latency functional units. The
    main drawback of this approach is a reduction in the dynamic range, or the ratio
    between the largest- and smaller-magnitude numerical values that can be represented.
    Luckily, many graph Chapter 2 explores this technique as well.


    Load and store stalls are linked to the effectiveness of the processor’s cache,
    but can be reduced by changing the order in which data is accessed in memory.
    The goal is to increase the locality of the accesses. To do this, the programmer
    or compiler must arrange the order of load and store instructions'
