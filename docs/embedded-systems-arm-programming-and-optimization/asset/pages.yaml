    \n```\na = {0, 1, 2, 3, 4, 5, 6, 7}\nb = {8, 9, 10, 11, 12, 13, 14, 15}\n```\n\
    \nThe following intrinsic call will extract the last five elements from a and\
    \ first three elements from b: \n\n```\nb=vext_s8(a,b,3);\n```\n\nSetting the\
    \ new state of vector b to:\n\n```\nb={3, 4, 5, 6, 7, 8, 9, 10}\n```\n\nTransposing:\n\
    \nThe vtrn intrinsic takes two vectors, interprets them as a set of 2×2 matrices,\
