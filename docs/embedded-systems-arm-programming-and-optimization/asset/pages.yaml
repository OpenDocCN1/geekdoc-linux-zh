    Recall that the bubble sort compares each pair of values $n-1$ times, where $n
    is the number of elements. After each comparison, the values are swapped if they
    are in unordered order. Each individual value can move at most one position toward
    the beginning of the array per iteration of the outermost loop, which can be thought
    of as bubbles slowing to the top of a liquid.


    Save this file as bubble_sort.c and compile with gcc, using the "-O3" flag to
    tell the compiler to use maximum optimization:


    ```

    gcc bubble_sort.c -O3 -o bubble_sort

    ```


    Execute and time the program:


    ```

    time ./bubble_sort

    ```


    On an ARM Cortex A15, the program requires 4.0 s of user CPU time to execute.
    From this it is possible to make rough estimations regarding the efficiency of
    the compiler.


    The program compares $n^2=2^{15}\times 2^{15}$ pairs of values, meaning the processor
    needs approximately $4.0^{30}=3.7$ cycles per comparison.


    At our clock rate of 2.3 GHz (usually found in /sys/devices/system/cpu0/cpufreq/cpuinfo_max_freq),
    this translates into


    $2.3e9\times 3.7e-9=8$ cycles per comparison


    This includes both the time required to execute the comparison instructions and
    the time needed for the transactions (cache stalls). Is this reasonable?


