  md: '# 4.3.3 The Harris corner detector


    Some computer vision applications require a method for identifying anchor points
    in an image for the purpose of establishing correspondence between multiple images
    taken of the same scene from different perspectives. This is useful for video
    tracking, image stitching, and 3D modeling.


    One way to identify anchor points is to find corners, an intersection of at least
    two edges. More generally, a corner is any point on the image whose patch, or
    square subregion centered on the point, would change significantly if the patch
    area shifted in any direction.


    This is depicted in Figure 4.7.


    These are many methods for detecting corners in an image. One of the most commonly
    used is the Harris detector. The Harris detector looks for pixels that has a large
    "shift difference" when shifted by (u,v):


    ```

    $E(u,v) = \sum_{x,y} w(x,y)|I(x+u,y+v) - I(x,y)|^2$$

    ```


    $I$ represents the image, and $w$ represents the weights of the pixels in the
    patch.


    This section examines a simple case where the weights are set to all ones. As
    such this term is dropped from the equation.


    ![](img/e6ebc663bbb86c6e7bf9ef22ad136e6f_159_0.png)


    **FIGURE 4.7** Two candidate pixels evaluated for their suitability as corners.
    The pixel on the left is near an edge and its corresponding patch would only change
    with a horizontal or diagonal movement. The pixel on the right is located on a
    corner, and its corresponding patch would change the patch significantly for any
    movement.'
  merge: -1
  img_proc: true
