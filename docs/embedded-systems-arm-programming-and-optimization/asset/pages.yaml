  md: '# 1.9 Runtime Profiling with Performance Counters 29


    The performance counters are a limited hardware resource that must be shared by
    all programs and users, so the OS must be responsible for arbitrating access to
    the counters. In addition, a user may want to count more events than there are
    physical counters, for multiplexing access to the counters. Also, multic processors
    will often have a PMU in each core, so inconsistent results may arise when a program
    inadvertently reaches the counters of different cores. As such, the OS must be
    responsible for maintaining per-process counter states across all cores. This
    also includes not incrementing the per-process counters during the times when
    the process is suspended by the OS, despite the fact that the hardware counters
    would still be counting.


    For these reasons, the OS must manage the PMU on behalf of the users. In fact,
    the processor will actually use user code from directly accessing the counters
    (registering as an invalid instruction exception). Users are forced to access
    the PMU through the OS using system calls.


    # 1.9.2 Linux Perf-Event


    Linux provides an abstraction layer for PMU management called perf_event. In addition
    to interfacing with the PMU, perf_event is also capable of keeping track of software
    events such as context switches and page faults. Unfortunately, as of this writing,
    perf_event is not fully implemented for the ARM11 processor of the Raspberry Pi.
    Appendix A describes how to patch the kernel to add support.


    When more counters are requested than physically available, perf_event uses a
    technique called multiplexing. In this case, the kernel enables a subset of the
    requested counters, enabling a subset at regular intervals. This allows the hardware
    counters to statistically sample the time the user requests the counters to be
    enabled. When the user requests, perf_event will report the number of cycles the
    user enabled the counter and the number of cycles the counter was actually enabled.
    These values are called time enabled and time running. The user can extrapolate
    the actual count by scaling the reported count by the ratio of these values.


    In order to use perf_event, the user instantiates each counter using the system
    call named perf_event_open. One can use the standard Posixioctl() function to
    enable, disable, and reset it, and the read() function to read its state.


    When opening a counter, the user must fill in a "struct perf_event_attr" structure
    to configure the counter. The two most important fields of this structure are
    the .type field and .config field. When counting hardware'
