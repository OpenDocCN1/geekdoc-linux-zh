    The world is becoming increasingly inundated with mobile and wearable devices
    that deliver rich multimedia, high-speed wireless broadband connectivity, and
    high-resolution sensing and signal processing. Devices owe their existence to
    two crucial technologies.


    The first is ARM processor technology, which powers virtually all of these devices.
    ARM processors were introduced into customer electronics in the 1980s and have
    grown to become the de facto embedded processor technology.


    Unlike desktop and server processors, ARM processors are never manufactured as
    standalone chips, but rather as integrated of components of a diverse and heterogeneous
    embedded system-on-chip (SoC) that is customized for each specific product.


    An embedded SoC is a collection of interconnected hardware modules on a single
    chip. A typical SoC will include one or more ARM processor cores. These processors
    serve as the "host," or central controller, of the whole SoC, and are responsible
    for the user interface and maintaining control of the peripherals and special-purpose
    processors.


    In addition to the processor cores, a typical SoC will contain a set of different
    types of memory interfaces (for SDRAM, Flash memory, etc.), a set of communications
    interfaces (for USB, Bluetooth, WiFi, etc.), and special-purpose processors for
    graphics and video (such as graphical processor units).


    Figure 1.1 shows a photo of the Apple A8 chip, processor inside Apple''s iPhone
    6. The area identified as "CPU" comprises a dual-core ARM processor and the areas
    identified as "GPU" comprise a set of special-purpose processors used for video
    and graphics. The large unlabeled area contains additional modules used for various
    other peripherals to support the iPhone''s functionality.


    In the sense of being capable of executing any program language, the ARM processors
    comprise the "computer" part of the SoC. Unfortunately, by the standards of modern
    desktop and server computers, ARM processors are very low performing processors
    because their design place higher emphasis on energy efficiency than performance
    compared to desktop and server.'
  merge: -1
