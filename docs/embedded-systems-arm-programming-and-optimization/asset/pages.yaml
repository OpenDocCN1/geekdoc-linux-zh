    # C4 PROGRAMS AND COMPILING


    OpenCL kernels can be compiled at runtime using CreateProgramWithSource() and
    BuildProgram(or clCompileProgram() and clLinkProgram()) or offline using CreateProgramWithBinary().


    Either way, the kernel code is stored in separate file from the host object code,
    so the host must explicitly read the kernel code before dispatching it onto the
    device for execution.


    After this, the program is associated with a kernel using a function such as clCreateKernel(),
    arguments are set using SetKernelArg(), and invoked by a function such as EnqueueNDRangeKernel().


