    # C.6 COMMAND QUEUE FUNCTIONS


    The OpenCL command queue is the method by which the host controls the device(s).
    The host can use the command queue to send simple, in-order commands to the device,
    or it can configure the command queue as being an out-of-order queue, which allows
    it to construct complex task graphs.


    A task graph is comprised of nodes representing kernels, and uses events to control
    when each kernel executes according to the data dependencies defined by the graph''s
    arcs.


    The command queue can contain commands, which execute code or exchange data with
    buffers. Commands are kernels, tasks, native kernels, read buffers, or write buffers.


    The command queue can also contain synchronization primitives, which enforce ordering
    between the execution of commands on the device (and'
  merge: -1
  img_proc: true
