    \ a list of events to complete before any future commands queued in the command-queue\
    \ are executed. [OpenCL 1.1 only]\n\nThis synchronization primitive prevents any\
    \ commands queued after this primitive to wait until all the specified events\
    \ have triggered.\n\n```\ncl_int clEnqueueMarkerWithWaitList(\n    cl_command_queue\
    \ command_queue,\n    cl_uint num_events_in_wait_list,\n    cl_event *event_wait_list,\n\
    \    cl_event *event)\n```\n\nEnqueues a marker which waits for either a list\
    \ of events to complete, or all previously enqueued commands to complete. [OpenCL\
    \ 1.2 ONLY]\n\nThis synchronization primitive triggers and ever after all specified\
    \ events have triggered.\n\n```\ncl_int clEnqueueBarrierWithWaitList(\n    cl_command_queue\
    \ command_queue,\n    cl_uint num_events_in_wait_list,\n    cl_event *event_wait_list,\n\
    \    cl_event *event)\n```\n\nA synchronization point that enqueues a barrier\
    \ operation. [OpenCL 1.2 ONLY]\n\nThis function prevents any commands enqueued\
    \ afterward from executing until either all previously enqueued commands completed\
