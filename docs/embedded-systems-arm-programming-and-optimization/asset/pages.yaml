    # 2.10.3 NEON intrinsics


    Unlike VFP vector instructions, the programmer can use SIMD NEON instructions
    without using inline assembly language. The header neon.h provides a set of preprocessor
    wrappers around built-in compiler expressions that allow for the programmer to
    use C-style semantics to invoke specific NEON instructions. These are called intrinsics.


    Intrinsics allow the programmer to use a C-style function to "invoke" a single
    instruction, meaning that the compiler is forced to use a specific instruction
    corresponding to the intrinsic. Like inline assembly, intrinsic calls often must
    generate additional instructions in order to allocate C variables, arrays, and
    pointers into registers.


    An intrinsic version of the code from above is shown below. It achieves roughly
    the same performance as the inline assembly version of the kernel is much easier
    to write and requires no inline assembly language.'
