    # 2.3 TEST KERNEL: POLYNOMIAL EVALUATION


    This section introduces a benchmark kernel that used throughput this chapter and
    Chapter 5 to describe and evaluate code optimizations. The kernel evaluates a
    degree-eight polynomial at every point in a vector x:


    ```

    d(x) = \sum_{j=0} a_j x^j

    ```


    Horner''s method, an iterative method that evaluates the polynomial by repeatedly
    adding each and multiplying by x:


    ```

    d_0(x) = a_7\nd_1(x) = d_0(x)x + a_6\nd_2(x) = d_1(x)x + a_5\nd_3(x) = d_2(x)x
    + a_4\nd_4(x) = d_3(x)x + a_3\nd_5(x) = d_4(x)x + a_2\nd_6(x) = d_5(x)x + a_1\nd_7(x)
    = d_6(x)x + a_0

    ```'
