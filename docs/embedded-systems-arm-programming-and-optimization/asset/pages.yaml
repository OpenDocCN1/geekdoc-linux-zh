- pgno: 190
  md: '# CHAPTER 5 Embedded Heterogeneous Programming with OpenCL


    Most smartphone and tablet users take for granted their ability to encode and
    decode high definition video and render three-dimensional (3D) graphics in real
    time. These tasks would not be possible without the help of specialized coprocessors
    such as graphical processing units (GPUs).


    Even the high-performance quad-core ARM Cortex A15—with its single instruction,
    multiple data (SIMD) units, out-of-order- superscalar architecture, and advanced
    caches—is not capable of performing these tasks on its own. For this reason, all
    modern embedded system-on-chip (SoC) coprocessors contain a diverse set of specialized
    coprocessor technologies. The most advanced of these support general purpose programming
    using Open Computing Language (OpenCL).


    For example, the Xilinx Zynq device implements its dual ARM Cortex-A9 processors
    with an integrated Field Programmable Gate Array (FPGA) fabric which can be used
    to implement custom logic circuits at high throughput and low latency.


    Another example is the Texas Instruments Keystone II, which supplements its quad
    ARM Cortex A5 processors with eight Digital Signal Processor (DSP) cores that
    have a Very Long Instruction Word microstructure that offer a peak floating-point
    throughput of 160 Gflops.


    Smartphone and tablet SoCs include coprocessors that are generally classified
    as GPUs. Unlike desktop and server GPUs whose market is dominated by NVIDIA, AMD,
    and Intel, the market for low power, mobile embedded GPUs is still competitive,
    diverse, and vibrant.


    +   - ARM Mali GPU,

    - Imagination Technologies PowerVR GPU,

    - Broadcom VideoCore GPU,

    - Qualcomm Adreno GPU,

    - NVIDIA Embedded Kepler GPU.


    Embedded GPUs generally share the same memory system as their host CPU so they
    do not have an advantage in memory bandwidth but they are not subject to CPU-GPU
    communication overhead.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# 5.1 GPU Microarchitecture 189


    General purpose programming for embedded GPUs is still relatively new and the
    associated runtime libraries and compilers are immature. This chapter uses the
    ARM Mali-T628 GPU as found on the $179 ODROID-X3 as a case study.


    Like other embedded GPUs, the ARM Mali supports general purpose programming using
    OpenCL, which is an open technology independent framework for writing performance
    oriented, data parallel code for a wide variety of microarchitectures.


    There are several challenges when programming embedded GPUs. First, as with heterogeneous
    platform—a platform comprised of a set of different processor technologies—the
    programmer must manually identify which components of the application to map to
    the coprocessors. Even after carefully implementing these components on the coprocessor,
    the programmer must adjust parameters that affect coprocessor performance in ways
    that are specific to the coprocessor used. Luckily, OpenCL provides mechanisms
    to allow the programmer to query the runtime environment to get hints on how to
    set these parameters for the specific coprocessor technology used.


    # 5.1 GPU MICROARCHITECTURE


    This chapter revisits the Horner’s method kernel Chapter 2 to illustrate the concepts
    and performance factors involved in OpenCL programming.


    Recall that our Horner’s method kernel performs the following loop:


    ```

    1 for i = 0 to n-1

    2 sum = coeff[0]

    3 for j = 1 to 7

    4 sum = sum * input_val[i]

    5 sum = sum + coeff[j]

    6 endfor

    7 endfor

    ```


    The performance bottleneck in this code is the data dependency between lines 4
    and 5. In Chapter 1 we addressed this using two different approaches: software
    pipelining, which focused on the inner loop, and explicit SIMD parallelism, which
    focused on the outer loop.'
  merge: -1
  img_proc: true
