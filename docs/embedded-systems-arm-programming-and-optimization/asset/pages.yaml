    # 2.2 AMDAHL''S LAW


    Amdahl''s Law, shown as Equation (2.1), calculates the performance impact resulting
    from optimizing one or more components of a program.


    The equation calculates the overall speedup, $S_{overall}$ as a function of what
    portion of the execution time corresponds to the code to which an improvement
    (parallelism) is applied, $time_{optimized}$ and the amount that is improved ($S_{optimized}$):


    ```

    $S_{overall} = \frac{1}{(1 - time_{optimized}) + \frac{time_{optimized}}{S_{optimized}}}$$
    (2.1)

    ```


    Amdahl''s Law has several important implications.


    First is the overall improvement of a program depends on improving the common
    case in the sense of execution time. In some cases this may origin-inate from
    a very small portion of the program code.


    An often frustrating aspect of Amdahl''s Law: $S_{overall}$ is much lower than
    expected. For example, if the programmer speeds up the portion of the code that
    consumes 10% of the execution time ($time_{optimized}=0.10$) by a factor of 10000
    ($S_{optimized}=10000$), our overall speedup is only 11% ($S_{overall}=1.11$!)
    In this case, there was very little for a large speedup of one aspect of the execution.


    As another example, if the programmer speed up the portion of the code that consumes
    99% of execution time ($time_{optimized}=0.99$) by a factor of 100 ($S_{optimized}=100$),
    our overall speedup is only 50 ($S_{overall}=50$!). In other words, 50% of the
    performance benefit of the enhancement is from only 1% of the execution time that
    was not subject to the improvement!


    Another important practical aspect is the importance of $time_{optimized}$ over
    $S_{optimized}$. For example, Figure 2.1 plots the overall speedup ($S_{overall}$)
    versus the relative execution time of the optimized code ($time_{optimized}$)
    for two very'
