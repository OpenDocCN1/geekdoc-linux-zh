  md: '# 5.4.5 Kernel attributes


    The programmer declares the kernel function using the kernel prefix. Between this
    prefix and the return type of kernel function, the programmer can use the “__attribute(())”
    qualifier to set attributes that can provide hints to the kernel compiler.


    For example, consider the following kernel declaration:


    ```

    kernel


    __attribute((reqd_work_group_size(8,8,1)))

    void naive_opengl(global float *x,

    global float *d,

    global float *coeff) {

    dispatch:

    ```


    The reqd_work_group_size specifies the work group size that the programmer must
    use when dispatching the kernel. This is essentially a promise that the programmer
    makes to the compiler, which allows the compiler to optimize the code appropriately.


    # 5.4.6 Kernel dispatch


    The host typically performs the following steps before and after kernel dispatch:


    +   1. set the kernel arguments (call clSetKernelArg)

    2. optionally transfer the input data into the device''s memory (call clEnqueueWriteBuffer()
    by referencing the input buffers created with clCreateBuffer()) (note that the
    example uses the CL_MEM_COPY_HOST_PTR option in clEnqueueWriteBuffer()), which
    allows it to avoid this (usually)

    3. set the workgroup size, number of workgroups and execute the kernel (call clEnqueueRangeKernel())

    4. transfer the output data to host memory (call clEnqueueReadBuffer() by referencing
    the output buffers previously created with clCreateBuffer())


    In Practice:


    One potentially confusing aspect of kernel dispatch is the managing of the kernel''s
    input and output arrays. Each of these is referred by its pointer in host memory
    (usually allocated to malloc()), or as a corresponding cl_mem object that serves
    as a handle to the OpenCL buffer (obtained from a call to clCreateBuffer()).


    The kernel function expects to receive pointers to each of these arguments but
    these pointers will be different from the ones allocated on'
