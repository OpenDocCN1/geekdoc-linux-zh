    # ### 4.3.4 Lucas-Kanade optical flow


    Like corner detection, optical flow is a common calculation in computer vision.
    Also like corner detection, there are many algorithms for computing it. This section
    describes a version case of Lucas-Kanade optical flow. The full version of Lucas-Kanade
    also includes a hierarchical method for evaluating the optical over subsampled
    versions of the image, which is not included in this description.


    Its objective is to compute the movement of each pixel from one video frame to
    the next. This is represented as a *flow field*, a 2D array of two-element vectors
    that indicates the *X* and *Y* movement of each pixel.'
