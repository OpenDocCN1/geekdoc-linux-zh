- pgno: 236
  md: '# A.4 Installing the Kernel 235


    # A.3 BUILDING THE KERNEL


    On your workstation, define the $CCPREFIX environment variable to:


    ```

    <tools directory root~/arm-bcm2708/arm-bcm2708-linux-gnueabi/

    bin/arm-bcm2708-linux-gnueabi-n

    ```


    Next, define the KERNEL_SRC environment variable to the root of your kernel source
    code.


    Copy and decompress your Raspberry Pi’s current kernel build to the kernel source
    directory with the filename “.config”. The kernel configuration is stored in the
    compressed file /proc/config.gz on the Raspberry Pi.


    You can use the “zcat” command to perform the decompression, that is,


    ```

    zcat config.gz > $KERNEL_SRC/.config

    ```


    Change to the root of the kernel source and issue the following command, which
    will ensure that the .config file is correct. Due to minor differences between
    your current kernel and the downloaded kernel, this command may prompt you for
    a few build options. If so, just push enter to accept the default responses.


    ```

    make ARCH=arm CROSS_COMPILE=$CCPREFIX oldconfig

    ```


    Use the following command to build the kernel. This step may take a significant
    amount of time.


    ```

    make ARCH=arm CROSS_COMPILE=$CCPREFIX

    ```


    Use the following command to build the modules.


    ```

    make ARCH=arm CROSS_COMPILE=$CCPREFIX modules

    ```


    Finally, on the Raspberry Pi itself, issue the following command in Linux kernel
    source root. This will install the modules.


    ```

    make modules_install

    ```


    # A.4 INSTALLING THE KERNEL


    The new kernel image will be located in the kernel source at /arm/boot/zImage.
    Copy this file to /boot/kernel.img and reboot.


    After the reboot, re-check the /sys/bus/event_source/devices directory for perf_event
    support.'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# # NEON intrinsic reference


    The arm_neon.h header file defines 102 data types and 2009 intrinsics that allow
    the programmer to explicitly include support for ARM NEON instructions in high-level
    source code. To use an intrinsic, the programmer needs to only call a specific
    function, but intrinsics are not normal functions. Each intrinsic is defined as
    an inline function that acts as a wrapper around a built-in command that forces
    the compiler''s back-end to emit a specific instruction (often along supporting
    instructions).


    This appendix provides additional details on ARM NEON intrinsics beyond that provided
    in Chapter 2. Interested readers should refer to the actual header file, located
    in /usr/lib/gcc/arm-linux-gnabihf/<version>/include, as well as ARM''s documentation
    for additional details on NEON programming.


    # ## B.1 VECTOR DATA TYPES


    Tables B.1–B.9 list the types defined in arm_neon.h. NEON intrinsics support 64-bit
    and 128-bit (quad-word) vectors comprised of signed and unsigned integers and
    floating-point values.


    Intrinsics that use 64-bit (double word) vectors have no suffix, while those use
    128-bit (quad-word) vectors require a q-suffix that typically appears after the
    operation name and before the element type. example:


    +   - vmul_s8 performs a pairwise two 64-bit vectors, each comprised of eight-bit
    signed integers of type int8x8_t

    - vmul_qs8 (with the q-suffix) performs a pairwise multiply two 128-bit vectors
    each comprised of sixteen eight-bit signed integers of type int8x16_t.


    NEON also supports special integer vectors called polynomials. Polynomial elements
    are stored in integer format, but carries are disabled whenever an arithmetic
    operation uses polynomial input and output operands. As such all additions are
    replaced with bitwise XOR operations.'
  merge: -1
  img_proc: true
