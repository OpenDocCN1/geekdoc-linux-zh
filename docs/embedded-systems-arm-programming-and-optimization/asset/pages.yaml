  md: '# 192 CHAPTER 5 Embedded Heterogeneous Programming with OpenCL


    An OpenCL programmer must explicitly divide the program into code executed by
    the host CPU and code executed by the coprocessor, or device.


    The programmer must write special code for host to interact with the OpenCL runtime
    environment. The special functions called in code make up the OpenCL_platform
    layer. Specifically, the platform layer is comprised of a set of API functions
    used to initialize and communicate with the device. The API function interfaces
    are standardized, meaning that they will work on any OpenCL-compatible device,
    but their implementations are provided by the target device''s vendor. A vendor
    implementation of the OpenCL layer is called *platform*.


    The next several subsections describe a basic set of OpenCL functions and their
    usage. Each of these subsections includes a section that shows the prototypes
    of the related functions and a section that shows a relevant snippet from the
    running example. When put together, these code snippets will form a complete program
    that executes an OpenCL implementation of the Horner example from Chapter 2.


    To begin, include the necessary files:


    +   * stdio.h for basic console and I/O.

    * stdlib.h for random number generation for creating datasets.

    * cl/cl.h for the OpenCL platform functions.

    * sys/time.h for the POSIX gettimeofday() function. Linux perf_event will use
    wall clock time and OpenCL''s built-in profiling functionality to measure kernel
    performance.


    ```

    #include <stdio.h>

    #include <stdlib.h>

    #include <cl/cl.h>

    #include <sys/time.h>

    ```


    # 5.3.2 Error checking


    OpenCL platform functions return error codes defined in cl.h to communicate error
    codes back to the user in the form of a 32-bit integer of type cl_int. Unfortunately,
    OpenCL does not provide any corresponding error reporting functions—similar to
    the POSIX function strerror() and error()—to convert an error code into a human-readable
    string. As a result, for debugging purposes it is important for the programmer
    to write one such function as part of the host boilerplate code.'
