  md: '# B.3 Vector Element Manipulation 245


    {1, 9, 11, 5, 13, 7, 15}}


    Interleaving:


    The vzip intrinsic takes two input vectors and interleaves them. The result is
    returned as a two-row vector type.


    For example, assume a and b are initialized as follows:


    ```

    a = {0, 1, 2, 3, 4, 5, 6, 7}

    ```


    ```

    b = {8, 9, 10, 11, 12, 13, 14, 15}

    ```


    The following intrinsic will return the value of c:


    ```

    c = vzzip1_s8(a, b);

    ```


    ```

    c = {0, 8, 1, 9, 2, 10, 3, 11},

    ```


    ```

    [4, 12, 5, 13, 6, 14, 7, 15}

    ```


    The vzip intrinsic takes two vectors and the returns the even-numbered elements
    in one vector and the odd-numbered elements in another vector.


    Starting with the same input vectors as above:


    ```

    a = {0, 1, 2, 3, 4, 5, 6, 7}

    ```


    ```

    b = {8, 9, 10, 11, 12, 13, 14, 15}

    ```


    The following intrinsic will return the value as an int8x2_t:


    ```

    c = vuzp_s8(a, b);

    ```


    ```

    c = {0, 2, 4, 6, 8, 10, 12, 14},

    ```


    ```

    [1, 3, 5, 7, 9, 11, 13, 15}]

    ```


    Gather:


    The vbtbl intrinsic performs a "gather" operation, which takes two vectors and
    interprets the second vector as a set of indices to load a set of elements from
    the first vector. If any of the values of the second vector are out of range,
    vbtbl inserts zeros at their corresponding positions in the return vector. A related
    intrinsic, vbtlb, performs the same operation but treats out of range values in
    the second vector differently. For these, vbtbx copies the original values from
