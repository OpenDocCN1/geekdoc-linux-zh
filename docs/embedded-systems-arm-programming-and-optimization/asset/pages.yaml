    \ 2, 3, 4, 5, 6, 7}\nb={8, 9, 10, 11, 12, 13, 14, 15}\n```\n\nThe following intrinsic\
    \ call will interpret these vectors as 2×2 matrices and transpose them. The result\
    \ is returned as an int8x2_t type.\n\n```\nc=vtrn_s8(a,b);\nc={0, 8, 2, 10, 4,\
