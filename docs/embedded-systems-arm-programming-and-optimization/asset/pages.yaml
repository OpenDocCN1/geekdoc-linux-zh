    # 4.4.2 Filtering along the row


    Assume the image is stored in row-major order, and consider a 1D filter having
    three coefficients. When filtering the image the processor will load three input
    values from consecutive memory locations for each filter evaluation. Since the
    filter uses a sliding window, the processor will re-load two of these elements
    in the next iteration. Because of the overlap, the processor will read each pixel
    three times.


    If as a standard averaging filter, the code will perform arithmetic operations
    per output: three multiplications and two adds. For each output pixel, the filter
    will write one pixel and read at least one, since one new pixel is revealed as
    the filtering window advances by one element.


    With an arithmetic intensity of five operations per two pixels, this filter will
    likely be memory bound and its performance will depend on its cache miss rate.
    The miss rate depends on what portion of memory accesses is reused from the cache
    (through a hit).


    The programmer can roughly estimate cache performance using a simplistic cache
    and execution model by making the following assumptions:


    +   * the cache is fully associative,

    * consider only the load operations,

    * cache lines four pixels each (equivalent to 16-byte lines),

    * do not consider outputs whose inputs would reside outside the image boundaries'
