    # C.9 CONSTANTS


    OpenCL defines a list of single-precision floating-point constants as defined
    in Table C.3. Each constant that ends with "_F" has a corresponding double precision
    without the "_F" suffix and half precision by replacing the "_H" suffix, when
    supported by the OpenCL implementation.


    # C.10 BUILT-IN FUNCTIONS


    OpenCL provides a set of built-in functions available for use in kernel code.
    Some of these functions are standard mathematical primitives and many of these
    accept vector operands. Others are utility functions for work-item identification
    and vector loads stores.


    # C.10.1 Integer functions


    Table C.4 lists the integer functions. These functions accept vector operands.


    # C.10.2 Floating-point functions


    Table C.5 lists the floating-point functions. Most of these functions accept vector
    operands.


    # C.10.3 Vector functions


    OpenCL kernels should always use explicit vector load and store functions to exchange
    data between vector variables and arrays (Table C.6).


    # C.10.4 Work-item functions


    OpenCL kernels can be dispatched as a 1-, 2-, and 3-dimensional array of work-items.
    The array of work-items can optionally be subdivided into a 1-, 2-, or 3-dimensional
    array of groups (when c1EnqueueNDRangeKernel1() is called with the local_work_size
    argument to a non-NULL value).


    Kernel workload distribution is governed by the ability for each work-item to
    self-identify itself within this coordinate system. A work-item''s global ID'
