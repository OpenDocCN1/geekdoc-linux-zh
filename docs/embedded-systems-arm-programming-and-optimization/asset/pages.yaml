    # 5.4.3 Kernel vectorization


    OpenCL kernel code uses an elegant way to explicitly perform SIMD arithmetic.
    Instead of intrinsic functions as required for ARM NEON as described in Chapter
    2, the OpenCL compiler will automatically generate SIMD instructions for any normal
    arithmetic operation when one or more operands are a SIMD type. These SIMD types
    can be as large as 16 elements.


    Consider the following example variable declarations and operations:


    ```

    float4 a, b;


    float c;


    a = a * b;


    b = a * c;

    ```


    The variables $a$ and $b$ will be 4-element floating-vectors. This code will result
    in a b being computed as an element-wise vector product of $a$ and $b$, that is,


    ```

    a <= [a[3]]*c[2]*b[2] a[1]*b[1] a[0]*b[0],

    ```


    while $b$ will be computed as the product of each element of $b$ and the scalar
    value $c$, that is,


    ```

    b = [a[3]]*c[2]*a[1]*c[1] a[0]*

    ```


    For variables declared using a SIMD type, individual elements of floating-point
    vector types can be referenced as:


    ```

    <name>.s0 (element 0)


    <name>.s1 (element 1)

    ```


