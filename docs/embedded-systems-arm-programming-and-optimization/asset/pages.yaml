- pgno: 232
  md: 'OpenCL is already well-known in the high-performance computing area but relies
    on arguably more important for embedded systems, which often rely on coprocessors
    to meet real-time performance constraints such as real-time video compression
    for smart phones or computer vision algorithms for robots.


    Unlike OpenMP, which only requires a few additional lines of code to convert a
    serial program into a parallel program, OpenCL is more verbose but gives the programmer
    fine grain control over memory allocation and movement.


    Writing OpenCL programs requires code at the platform level and kernel level.


    At the kernel level, the programmer must identify the applications'' kernels—the
    loops that account for nearly all execution time—and adapt them for execution
    on coprocessor device. This requires the programmer to isolate the loops in separate
    source files and transform them into explicitly data-parallel form in which the
    outermost loop iterations are mapped to hierarchical work sharing constructs known
    as workloads and work items.


    OpenCL kernel provides many opportunities for optimization, such as explicitly
    allocating and managing program-controlled on-chip memories, use of SIMD intrinsics,
    and adjusting the granularity of parallelization. OpenCL also provides a mechanism
    for parameterizing kernels—by adjusting workload and vector size—to tune specific
    architectures.


    At the platform level, the programmer must manage the initialization, communication,
    and synchronization of the devices, allocate device memory, and compile the kernel
    code at runtime.


    This chapter provides a running example in which the Horner''s method program
    from Chapter 2 is adapted into the OpenCL framework for an embedded GPU. The code
    is tested on the ARM Mali T628 embedded GPU, which achieves an effective performance
    of 15.6 Gflops.


    # EXERCISES


    +   1. Write an OpenCL kernel to measure the actual memory bandwidth of the coprocessor.
    Use one work item per group with 1024 workgroups. Each work item should use the
    vload4(i) and vstore16(i) functions to copy a block of data from one location
    to another. How does the coprocessor''s bandwidth compare to that of the host
    CPU?


    +   2. Plot the performance of the Horner example described in this chapter with
    WGS=1, NWG=N(4 × VS × WGS), and with VS={1, 2, 4, 8, 16}.'
  merge: -1
  img_proc: true
