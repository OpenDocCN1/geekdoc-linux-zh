    * abs, neg: absolute value and negate (can be fp)

    * fma: fused multiply-accumulate

    * fms: fused multiply-subtract


    Bit manipulation:


    +   * shl, shr: shift left, shift right (logical)?

    * sra: and accumulate. Each element is shifted independently.

    * sli, sri: shift left insert, shift right insert. Bits are not shifted element
