  md: '# CHAPTER 2 Multicore and Data-Level Optimization: OpenMP and SIMD


    The second optimization is the usage of inline assembly language for the purpose
    of increasing the floating-point throughput with respect to the total number of
    executed instructions.


    The third optimization is software pipelining, which reduces the stall rate by
    transforming dependencies within the loop body into loop-carried dependencies.
    This increases the distance between dependent instructions, reducing the number
    of stalls and increasing CPI. This optimization is effective even for the Cortex-A15
    that supports dynamic instruction scheduling.


    The fourth optimization is manual vectorization the loop body using SIMD instructions.
    This chapter covered SIMD instructions on both ARM11 and ARM Cortex processors.


    The examples in this chapter used code instrumentation with performance counters
    in order to evaluate each optimization using several metrics: instructions per
    flop, CPI, effective memory bandwidth, and floating-point throughput.


    Each optimization technique is applied to a simple benchmark kernel that uses
    Horner''s method to compute a polynomial over a 1D array. This kernel performs
    seven multiply-accumulates for every input and output word and is memory bandwidth
    bound. Our initial implementation is a relatively simple multithreaded loop nest,
    consisting of only seven lines of code. Using its performance as a baseline, the
    optimizations achieved a speedup of 11 on the single-issue, in order ARM11 processor
    (from 35 to 380 Mflops) and a speedup of four on the multiple-issue ARM Cortex
    A9 and A15 (211 to 790 Mflops on the A9 and to 7.5 Gflops on the A15).


    The next chapter covers the Linux framebuffer and describes new kernels for transformation
    and new methodologies for tuning.


