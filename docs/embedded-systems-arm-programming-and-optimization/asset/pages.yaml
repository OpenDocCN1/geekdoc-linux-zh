    # 5.3.5 Platform layer: Initializing the context


    A context is an abstraction on the host that manages host-device interaction and
    device memory. Every OpenCL function that interacts with the device requires a
    context.


    In Practice:


    After obtaining a handle to the platform and device(s), the host calls clCreateContext
    or clCreateContextFromType to obtain a handle to a context associated with a device
    reference.


    Both functions are similar, while clCreateContext() returns a context given with
    a device handle, while clCreateContextFromType() returns a context associated
    with a given device "type," such as GPU.


    Both of these functions return the context through the properties argument, passed
    by reference.


    The callback function pfn_notify and associated user_data are used by the runtime
    environment to asynchronously report errors to the application, but the programmer
    can set to NULL if this behavior is not needed.


