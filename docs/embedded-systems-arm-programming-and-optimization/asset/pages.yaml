  md: '# 80 CHAPTER 2 Multicore and Data-Level Optimization: OpenMP and SIMD


    Recall that a data dependency exists between any pair of instructions where the
    first instruction produces a result that the second instruction uses as an input
    operand. These are read-after-write (RAW) dependencies.


    For example, the instruction sequence “fads s0,s1,s2” followed by “fads s1,s0,s2”
    contains a dependency because the second instruction requires the result computed
    by the first instruction, in s0. Assume, for example, that the latency of the
    floating point add operation is four cycles. In this case, whenever these two
    instructions are fetched within four cycles of each other, stalls must be inserted
    between them.


    As shown in Figure 2.3, the assembly implementation of Horner’s method from the
    previous section contains many dependencies involving instructions that appear
    in nearby lines of code. These dependencies may contribute to the high CPI of
    our kernel.


    The latency of the fmac instruction is eight cycles, meaning that any subsequently
    issued instruction takes the output of this instruction as


    ![](img/e6ebc663bbb86c6e7bf9ef22ad136e6f_85_0.png)


