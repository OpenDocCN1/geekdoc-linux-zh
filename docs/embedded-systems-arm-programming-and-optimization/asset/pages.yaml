    \ tile\" variable (named mytile in the code below) that it contains these sizes.\n\
    \nThe program can use OpenMP to distribute the outer loop's workload across the\
    \ thread pool. This way, each thread will process a set of tile rows.\n\nThe last\
    \ tile in each dimension may straddle the image boundary, so the loop bound must\
    \ \"round up\" partial tiles. To do this, use a ternary expression that adds one\
    \ to the image-tile size quantity when the corresponding modulo is nonzero.\n\n\
