  md: '# 72 CHAPTER 2 Multicore and Data-Level Optimization: OpenMP and SIMD


    2.7 Gflops for the Cortex-A9 processors on the Xilinx Zedboard, and 17.8 Gflops
    for the Cortex-A15 processors on the NVIDIA Jetson.


    In practice, it is virtually impossible for any processor to achieve its peak
    floating-point performance, since it would require that the provider inputs to
    all its floating point units every cycle and have all of latency. One significant
    source of latency is the average memory access time, meaning that the floating-point
    units would need to be busy during the entire time to access the data needed for
    the computation. Since the floating-point units can achieve much higher throughput
    than the off-chip memory, their effective performance depends on the degree to
    which the kernel reuses data during its execution. This reuse rate is usually
    characterized by a measured arithmetic intensity, which expressed the average
    number of floating-point operations per byte of data.


    Every CPU has a theoretical arithmetic intensity threshold, under which the kernel''s
    performance is bound by memory bandwidth and over is bound by floating-point throughput.
    This is an oversimplification, since it does not consider memory locality, which
    determines cache performance, or any other sources of latency, those caused by
    data dependencies.


    Arithmetic intensity provides a tighter upper performance bound than peak floating-performance.
    It can be computed as


    ```

    Upper bound = min \frac{2 \times cores \times frequency \times n}{intensity \times
    peak memory b/w} floating-point operations per byte

    ```


    Our benchmark kernel performs two floating-point operations (multiply, add) per
    iteration of the inner loop, which iterates seven times every iteration of the
    outer loop, giving 14 floating-point operations.


    The body of the outer loop references one element of **x**, one element of **d**,
    and all eight coefficients. The small size and high temporal locality of the coefficients
    should allow the processor to keep them in the registers or cache, so this analysis
    only considers the 8 bytes that comprise an element of **d** and **x**. This gives
    an arithmetic intensity of 14/8 = 1.75 flops per byte.


    This analysis computes the memory bandwidth as a weighted average of read and
    write bandwidth for each platform as measured in Chapter 1. This kernel reads
    and writes the same amount of data—4 bytes and 4 bytes written on each iteration
    of the outermost loop—so in this case the weighted average is 0.5 $\times$ (read
    b/w) + 0.5 $\times$ (write b/w).


    The performance upper bound is thus 1.75 multiplied by the bandwidth, since this
    is always less than the peak floating-point throughput on all three CPUs.'
