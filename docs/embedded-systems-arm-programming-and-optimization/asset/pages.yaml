    results were obtained on the NVIDIA Jetson TK1, which is a larger, more substantial
    platform than the ODROID-X3.


    # 5.6.3 Workgroup size


    Workgroup size affects how effectively the GPU core can hide the latency of instructions
    from individual work-items.


    Table 5.3 shows the performance results, as reported by the OpenCL profiler, with:


    +   * NWG=N/(4 × VS × WGS), the maximum possible value such that the kernel''s
    for-loop executes only one iteration and the best-performing-setting from the
    previous test,

    * VS=4, the preferred vector size for the device (as reported by)

