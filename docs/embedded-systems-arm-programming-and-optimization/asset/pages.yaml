    When the host dispatches a kernel, the program assigns a kernel of work-items.
    This is called an n-dimensional range (NDRange), which is a 1D, 2D, or 3D value
    that represents the input or output data is mapped into work-items.


    As in OpenMP, the kernel code associated with each thread—or work item—can identify
    its unique ID for the purpose of adapting its runtime behavior to its particular
    workload, or element of its work set.


    The work-items can also be organized into a two-level hierarchy, in sets of work
    items can be divided into equal-sized workgroups. All threads within a workgroup
    can synchronize and access a shared memory space. Work items in different workgroups
    cannot communicate.


    For example, the programmer sets NDRange to {64,4,2}, the kernel will be comprised
    of 64×4×2=512 work-items. If the programmer defines the workgroup size to be [2,2,2]
    then there will be 512/(2×2×2)=64 groups.


    # 5.4.1 Device memory


    One of the most important differences between CPUs and coprocessor devices such
    as GPUs, FPGAs, and DSPs are their memory hierarchy.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# 5.4 Kernel Workload Distribution


    CPUs derive much of performance from their caches, which typically support rich
    feature sets such as sophisticated replacement policies, victim caches, and coherency
    with other caches. These features are designed to maximize memory performance
    for platform agnostic code.


    Aggressive multilevel caches also allow CPUs to have small general register files,
    since compilers use frequent register spilling to exchange register contents with
    memory without a large performance penalty.


    On the other hand, GPUs, FPGAs, and DSPs generally have simple or no caches, relying
    instead on annotations in the program code that explicitly allocate and manage
    on-chip memories. These program-controlled on-chip memories are sometimes referred
    to as scratchpad memory, although GPUs sometimes call them shared memory since
    they are also used as a mechanism by which intermediate results can be exchanged
    between work items within a workload.


    On a CPU, the contents of any memory address may be stored in multiple levels
    of the memory hierarchy at any given time. In other words, the physical location
    of the data stored at a particular address cannot be determined since the on-chip
    caches are automatically managed by the hardware.


    On a GPU, on-chip memory locations have their own special address ranges. This
    allows the program to specifically address on-chip memory and to explicitly copy
    data between on-chip and off-chip memory.


    Also, GPUs typically have large register files and their compilers do not spill
    register values to off-chip memory. The registers serve as a item''s private memory
    and must have sufficient capacity to store the highest number of live register
    values that a workitem will ever need during its execution, multiplied by the
    number of work-items assigned to the GPU core.


    OpenCL supports programming idioms by which these different memories are referenced.
    Since different devices have on-chip memory structures, OpenCL must define a set
    of generalized abstractions that can be mapped to different device technologies.


    OpenCL defines global memory as memory accessible by all processor cores. Global
    memory is usually the off-chip RAM. Global memory has the largest capacity, globally
    accessible to all work-items in the kernel, but has the highest latency. The OpenCL
    keyword “global” is used as a prefix to specify a pointer that points to global
    memory.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# 210 CHAPTER 5 Embedded Heterogeneous Programming with OpenCL


    Despite OpenCL''s objective of being an opaque abstraction for programming coprocessor
    devices, there are some technology-specific elements that exist in the language.
    These elements have a lineage that traces back to GPUs. One of these is the concept
    of constant memory. Many GPUs use a memory path that is specially designed for
    high bandwidth retrieval of read-only graphical texture data that are painted
    over 3D rendered objects. This area of memory space can be initialized by the
    host but not written by the device. In OpenCL, a pointer declared with the "constant"
    keyword points to data in this memory space. Constant memory is physically stored
    in global memory but it can be optimized for high bandwidth read access.


    In OpenCL, local memory refers to program-controlled on-chip scratchpad memory,
    and is specified when declaring a pointer or array using the "local" prefix. Local
    memory has limited capacity, is shared by all workitems within a single workgroup,
    and has a lower latency than global memory. Local memory can be allocated at runtime
    by declaring a local array in the kernel function or by the host using the clSetKernelArg()
    (described below).


    The programmer can declare a variable or small array to be allocated in private
    memory that is private to an individual work item. Private variables are generally
    mapped to registers.


    Table 5.1 summarizes the device memory types for a typical GPU, although in theory
    all of these memory types are abstractions and can have different meanings on
    different device technologies.


    # 5.4.2 Kernel parameters


    The programmer must set three primary parameters that affect how workload is distributed:


    | Table 5.1 Summary of Device Memory Types |

    | Declaration Prefix | Where Allocated | Capacity | Speed | Sharing | Usage |

    | global | On board (off-chip) DRAM memory | Large | Slow | All work items in
    workgroups | Top-level input and output arrays |

    | constant | On board (off-chip) DRAM memory | Device-specific | Device-specific
    | All work items in workgroups | Read-only input arrays |

    | shared | On-chip SRAM | Small | Fast | Local to each workgroup | Intermediate
    arrays |

    | private | On-chip registers | Very small | Very fast | Local to each work item
    | Intermediate scalars |'
