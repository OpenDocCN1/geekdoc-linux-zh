    While using these ideas in my own embedded systems course, and I often find the
    students competing among themselves to achieve the fastest image rotation or the
    fastest Mandelbrot generator. This type of collegial competition excites excitement
    for the material.


    # USING THIS BOOK


    This book is intended for use in a junior- or senior-level undergraduate course
    in computer science or computer engineering curriculum. Although a course in embedded
    systems may focus on subtopics such as control theory, robotics, low power design,
    real-time systems, or other related topics, this book is intended as an introduction
    to performance-oriented programming for for lightweight system-on-chip embedded
    processors.


    This book should accompany an embedded design platform such as a Raspberry Pi,
    on which the student can evaluate the practices and methodologies described.


    When using this text, students are expected to know the C programming language,
    have a basic knowledge of the Linux operating system, and understand basic concurrency
    such as task synchronization.


    # INSTRUCTOR SUPPORT


    Lecture slides, exercise solutions, and errata are provided at the companion website:

    textbooks.elsevier.com/9780128003428'
