    # 2.9.2 Software pipelining Horner''s method


    Before pipeling our unrolled Horner’s method kernel, use the floating-point load
    multiple instruction (fldmias) to consolidate all the individual load instructions
    into one instruction.


    The fldmias instruction loads multiple floating-point values from memory. The
    registers are listed in braces and may be separated by commas or specified using
    a hyphen. The registers must be continuously numbered. Note that this instruction
    requires that the registers be listed after the label, as opposed to the single
    load/store in which the register is listed first.


    Using the fldmias instruction will load each coefficient into separate registers,
    unlike our original version that reused s0 and s2 when loading the coefficients.


