- pgno: 17
  md: '# 1.5.2 Status register


    ARM v6/v7 maintains a status register called the CPSR (current program status
    register) that holds four status bits, negative (N), zero (Z), carry (C), and
    overflow (O). These bits can be used for conditional execution of subsequent instructions.


    The bits are set to the most recently executed ALU instruction that includes the
    special "s" suffix. For example, the "adds" instruction will modify the status
    bits but the "add" instruction will not.


    Nearly all ARM instructions can include an optional condition code that determines
    if the instruction will be executed or skipped over. In other words, an instruction
    whose condition code is evaluated to false will not change the state of the processor,
    such as writing a register to changing the PC.


    For example, the ldreq instruction will only execute if the Z-bit in the CPSR
    is set, which will be the case if the most recent computational instruction resulted
    in a result of zero.


    For example, the sequence:


    ```

    subs r2,r2,#1

    streq r3, [r0]

    ```


    ...will decrement register r2 and store r3 only if the new value of r2 is zero.


    The compare (cmp) instruction can be used to set the status bits without any other
    side effect.


    For example:


    ```

    cmp r2,r3

    streq r4, [r0]

    ```


    ...will store register r4 only if the contents of registers r2 and r3 are equal.


    When combining the condition code and the "s" suffix, the condition code comes
    first, for example,


    ```

    addeqs r0,r0,r1

    ```


    The complete list of conditional suffixes are shown in Table 1.1.'
