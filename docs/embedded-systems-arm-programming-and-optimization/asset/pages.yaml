  md: '# 3.6 Fixed-Point Arithmetic


    For example, for our (7,4) example the 16 values in the range [0, 0.9375] and
    [-1 to -0.0625]


    ...and so on.


    Assuming every value is equally likely, an n-bit signed number offers n-1 bits
    of precision (all bits its sign bit) for half of its representable values, n-2
    bits of precision for the remaining half, n-2 bits for the remaining half of those,
    and so on.


    On average this is $\sum_{i=1}^n (n-i) \cdot 2^{-i}$ bits of precision, so our
    (7,4) value offers approximately 5 bits of precision.


    On the other hand, a floating-point value offers s+1 bits of precision, where
    s is the number of bits in the significand (mantissa) field. Since the exponent
    field occupies some of bits in a floating-point value, a fixed-point value will
    offer more precision than a floating-point value of the same bit width.


    Calculated this way, a 32-bit fixed-point value has approximately 30 bits of precision,
    while a 32-bit single precision floating-point value has 24 bits of precision.


