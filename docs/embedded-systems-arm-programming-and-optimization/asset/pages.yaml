    # 2.7 INLINE ASSEMBLY LANGUAGE IN GCC


    GCC provides an interface that allows the programmer to embed inline

    assembly language into C/C++ code. Unlike writing an entire function in

    assembly, inline assembly allows the programmer to write only those

    components of the code that need to be written in assembly code.


    Inline assembly allows the programmer to specify C/C++ variables and

    postinations and operands for instructions that normally take reg-

    isters or register-based addresses. In this case, the compiler substitutes

    registers for the variables and automatically adds any additional load

    immediate or load and store instructions required to temporarily allocate

    needed registers. The programmer may directly use registers. In this

    case, the programmer must specify the affected registers in a clobber list

    the compiler can ensure that the register state is not adversely affected by the

    inline instructions.


    The syntax for inline assembly is shown below:


    ```

    asm[volatile] : output operand : input operand : clobber

    list);

    ```


    If the volatile modifier is included, the compiler will exclude the statement(s)

    from being subject to compiler optimization. In other words, the compiler will

    gerate the assembly code as written and not modify it for the purpose of

    optimization.'
