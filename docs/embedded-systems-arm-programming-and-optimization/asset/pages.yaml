    # 5.3.7 Platform layer: Kernel compilation


    OpenCL kernel code is usually compiled by the host program at runtime. As such,
    OpenCL uses a just in time compilation approach, whereas instead of the kernel
    being compiled alongside the host code (as in NVIDIA’s CUDA framework), the host
    code must include a sequence of actions that read the kernel code and compile
    it using an API call.


    In Practice:


    The platform layer function that compiles the kernel source code does not take
    a path to the source file one might expect, but instead takes a pointer to a zero-terminated
    character array—a C string—containing the source code. As such, the programmer
    must use standard system calls to read the kernel source file into a string before
    calling the compile function.


    To do this, open the file (with fopen()), determine its size (with fseek()), fell(),
    fseek() sequence), allocate memory for the string (with malloc()), then read the
    contents of the file into the string (with fread()). Make sure you allocate one
    extra character for the string to zero-terminate it before passing the string
    to the compile function.


    To compile the program, call CreateProgramWithSource() to obtain a handle to the
    program, clBuildProgram() to compile the program, and clCreateKernel() to create
    kernel instantiation.


    When building, the program can pass the compiler options stored in an options
    string. This example uses “cl-fast-relaxed-math”. These options allow the GPU
    to perform floating-point operations that are not 100% IEEE 754 compliant but
    achieve higher throughput than if compliance must be guaranteed.


    Since the programmer (usually) cannot compile any OpenCL kernels outside of the
    OpenCL host API, the programmer needs a way to identify any syntax or semantic
    errors in our kernel source. For this program you can use clGetProgramBuildInfo()
    along with the device ID of the coprocessor.


    Related Functions:


    ```

    cl_program clCreateProgramWithSource(cl_context context,

    cl_uint count,

    const char **strings,

    const size_t *lengths,

    cl_int *errcode_ret)

    ```'
