    # 3.6 FIXED-POINT ARITHMETIC


    As described in Chapter 2, floating-point instructions have a longer latency than
    instructions, meaning that several clock cycles must elapse between a floating-point
    instruction begins execution and its result is available. By itself this is not
    a problem, but floating-point code is often complicated by a series of instructions
    that depend on the intermediate result calculated by a previous instruction. Without
    enough nondependent, ancillary instructions to schedule in between the dependent
    floating-point instructions, this situation will cause calls to be inserted between
    the dependent instructions, reducing the utilization of the hardware.


    Some programmers will always use floating-point instructions (by declaring variables
    as floating point) whenever the program requires a numerical or large number that
    has a magnitude outside the range of an integer. However, in some cases this is
    unnecessary, some integers—when used fixed-point values—can represent both fractional
    and very large values. The shorter latency of integer instructions will often
    translate into increased throughput for code containing chains of instructions.


    Graphics code, which contains type conversions between floating point and integers,
    will receive the added benefit of less type-conversion instructions (instructions
    that transfer and convert values between integer and floating point registers).


    In a fixed-point value, the program treats an integer as having an implicit decimal
    point, or radix point, placed at some location other than after bit 0. A signed
    n-bit value having m bits to the right of the radix point has a fixed range of'
