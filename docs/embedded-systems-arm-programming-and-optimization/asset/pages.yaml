  md: 'There are three major causes of stalls:


    +   - Branch stalls: Caused by branch mispredictions or branch target buffer misses.

    - Data dependency stalls: Caused by register read-after-write dependencies and
    is most serious when involving floating-point instructions that have long latency.

    - Load/store stalls: Caused by cache misses, requiring off-chip access to external
    memory.


    Branch stalls are caused when the processor fails to accurately predict the outcome
    of a conditional branch instruction. When this happens, instructions that were
    specatively fetched after the branch must be discarded and replaced with stalls.


    For example, assume the following instruction sequence:


    ```

    ```

    cmp r1,r2

    beq target

    ```

    ```


    In this case, the beq instruction depends on the status register outcome of the
    cmp instruction, which itself may depend on the outcome of previous instructions
    that compute r1 and r2. The processor will continue fetching instructions after
    the beg based on its branch prediction. The number of these speculative instructions
    will depend on how long the processor must wait for the beg to execute the stage.
    If the branch is to mispredicted, all of these instructions will be converted
    to branch stalls.


    The rate at which this occurs is associated with the rate at which conditional
    branches are executed, which is higher for programs that contain control-dependent
    code, that has unpredictable if-statements in the innermost loops.


    The most obvious way to reduce branch stalls is to reduce the number of ifstatements.
    Unless there are redundant if-statements that can be removed, it is difficult
    to do this without changing the semantics of the code. Another technique is to
    replace conditional branch instructions with predicated instructions, which is
    only effective when the number of conditional instructions is relatively small.


    Data dependency stalls are caused when instructions must wait to execute until
    the results from previous instructions have been computed. These stalls are most
    serious in programs that perform floating-point instructions, since these instructions
    have the longest latency of all the arithmetic instructions.'
