    \ with 64/n rows and 4 columns, where n is the bit width of the type suffix, while\
    \ the intrinsic returns the data in transposed order.\n\nThe code below uses the\
    \ vld4_s8 intrinsic to load data from the data_in array as declared and initialized\
    \ above. The returned variable, c, is declared as an 8x4 array. The vld4 loads\
    \ four double words (64 bits each, 256 bits total), but also applies a stride\
    \ of four elements to each of the four 8 x 1 vectors given by c.\n\n```\nint8x8x4_t\
    \ c;\nc=vld4_s8(data_in;8;i);\nfor (i=0;i<8;i++) {\n    for (j=0;j<4;j++) printf(\"\
    %d \",c.val[j][i]);\n}\nprintf(\"\\n\");\n```"
