- pgno: 61
  md: '# CHAPTER 2 Multicore and Data-Level Optimization: OpenMP and SIMD


    Cortex A15 typically has four cores. All available processor cores or else the
    nontrivial amount of computation should use all available processor cores else
    the program is not taking advantage of all the CPU''s capabilities.


    To do this, the programmer must add explicit support to the code that its workload
    can be distributed over multiple cooperating parallel threads that communicate
    through a shared memory. The number of threads should equal the number of processor
    cores so each thread can execute currently on a different processor core without
    having to time-multiplex multiple threads onto a single core. OpenMP is a convenient
    method by which the programmer can specify how a kernel should be executed in
    parallel.


    As shown in Figure 2.2, OpenMP assumes a globally sequential, locally parallel
    approach, where program code executes sequentially until reaching the beginning
    of a parallel region, where multiple threads are created and launched—or“forked”—to
    cooperatively process a workload. Once all the threads complete, the original
    thread—or“master”—continues executing sequentially at the point immediately following
    the parallel region. This is called “fork-join” parallelism.


    Code-wise, OpenMP involves a combination of "decorating" loops and code blocks
    using preprocessor commands called pragmas as well as using a small set of OpenMP
    library functions.


    OpenMP allows the programmer to specify distinct code for different threads, which
    are called parallel section. Usually, though, every thread executes exactly the
    same code. In this case, each thread''s behavior is determined by its ability
    to self-identify its thread ID and the total number of threads. OpenMP functions
    used for this are omp_get_thread_num() and omp_get_num_threads(). This section
    provides a short introduction to OpenMP.


    # 2.4.1 OpenMP directives


    OpenMP largely involves adding OpenMP directives to direct specific code. OpenMP
    directives are meant to mark the next statement or code block as being significant
    with respect to multi-thread parallelism (a code block consists of multiple statements
    enclosed in braces {}), but there are a few directives that stand alone and are
    not used to modify the following statement or block.


    An OpenMP directive is specified using a preprocessor command called a pragma
    using the syntax:


    ```

    #pragma omp <directive name> <directive options>

    ```'
