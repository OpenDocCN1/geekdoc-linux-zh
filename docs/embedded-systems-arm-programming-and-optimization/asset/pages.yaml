- pgno: 4
  md: '# Preface


    For many years I have worked in the area of reconfigurable computing, whose goal
    is to develop tools and methodologies to facilitate the use of field programmable
    gate arrays (FPGAs) as co-processors for high-performance computer systems.


    One of the main challenges in this discipline is the “programming problem,” in
    which the practical application of FPGAs is fundamentally limited by their tedious
    and error-prone programming model. This is of particular concern because this
    is a consequence of the technology’s strengths: FPGAs operate with fine grain
    concurrency, where the programmer can control the simultaneous behavior of every
    circuit on the chip. Unfortunately, this control also requires that the programmer
    manage fine grain constraints such as on-chip memory usage and routing congestion.
    The CPU programmer, on the other hand, needs only consider the potential state
    of the CPU at each line of code, while on-chip resources are automatically managed
    by the hardware at runtime.


    I recently realized that modern embedded systems may now face a similar programming
    problem. Battery technology continues to remain relatively stagnant, and the slowing
    of Moore’s Law became plainly evident after the nearly 6-year gap between 65 and
    28 nm fabrication technology. At the same time, consumers have come to expect
    the expected advancement of embedded system capabilities, being able to run real-time
    augmented software on a processor that fits in a pair of eyeglasses.


    Given these demands for energy efficiency and performance, any embedded processor
    vendors are seeking more energy-efficient approaches to microarchitecture, often
    involving the types of parallelism that cannot be automatically extracted from
    software. This will require cooperation of the programmers to write parallel code.
    This is a lot of both functionality and performance on a resource- and power-constrained
    platform that includes a wide range of potential sources of parallelism from multi-core
    to GPU shader units.


    Many universities have developed “unified” parallel programming courses that cover
    the spectrum of parallel programming from distributed systems to multicore processors.
    However, the topic is most often taught from the perspective of high-performance
    computing as opposed to embedded computing.


    With the recent explosion of advanced embedded platforms like the Raspberry Pi,
    I saw a need to develop curriculum that combines topics from computer architecture
    and parallel programming for performance-oriented embedded systems. I also wanted
    to include interesting and relevant projects and case studies for the course to
    avoid the traditional


    xiii'
