  md: '# 42 CHAPTER 1 The Linux/ARM Embedded Platform


    # 1.13.6 Comparison instructions


    Table 1.9 lists comparison instructions. These instructions are used to the status
    flags, which are used for conditional instructions, often used for conditional
    branches.


    # 1.13.7 Branch instructions


    Table 1.10 lists two branch instructions. The BX (branch exchange) instruction
    is used when branching to register values, which is often used for branching to
    the link register for returning from functions. When using this instruction, the
    LSB of the target register specifies whether the processor will be in ARM mode
    or THUMB mode after the branch is taken.


    # 1.13.8 Floating-point instructions


    There are two types of floating-point instructions: the Vector Floating Point
    (VFP) instructions and the NEON instructions.


    ARMv6 processors such as the Raspberry Pi (gen1)s ARM11 support only VFP instructions.
    Newer architectures such as ARMv7 support only NEON instructions. The most common
    floating-point operations map to both a VFP instruction and a NEON instruction.
    FADD andVADD32 (when used with s-registers) perform a single precision floating
    point add.


    The NEON instruction set is more extensive than the VFP instruction set, while
    most VFP instructions have an equivalent NEON instruction, there are many NEON
    instructions that perform operations not possible with VFP instructions.


    | Table 1.9 Comparison Instructions |

    | Instruction | Description | Functionality |

    |---|---|--|

    | CMN(<cond>) Rn, Rm | Compare negative | Sets flags on comparison between R[Rn]
    and -R[Rm] |

    | CMP(<cond>) Rn, Rm | Compare negative | Sets flags on comparison between R[Rn]
    and R[Rm] |

    | TEQ(cond) Rn, Rm | Test equivalence | Tests for equivalence without affecting
    V flag |

    | TST(cond) Rn, Rm | Test | Performs a bitwise AND of two registers and updates
    the flags


    | Table 1.10 Branch Instructions |

    | Instruction | Description | Functionality |

    |---|---|--|

    | BL(cond) < target > | Branch | Branches (and optionally links in r14) to label
    |

    | BL(L)X(cond) Rm | Branch and exchange | Branches (and optionally links in r14)
    to register. Specifies if the instruction mode will be standard or THUMB upon
    branching'
