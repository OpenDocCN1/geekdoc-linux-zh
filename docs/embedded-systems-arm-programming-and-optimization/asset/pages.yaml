    As such, the static code does not necessarily translate into a proportional performance
    impact. In order to accurately capture the impact''s code changes, the programmer
    must measure the program''s runtime behavior using profiling.


    The objective of profiling is to collect program runtime information on an actual
    processor or using a cycle-accurate simulator. Cycle-accurate simulators are to
    associate performance-relevant events to lines or features in the code, but are
    slow and limit the scope of programs and datasets that can be tested. Using an
    actual processor is much faster but information can only be collected in an aggregated
    way using performance counters.


    This book uses profiling with performance counters. Performance counters are low-level
